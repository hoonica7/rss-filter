<!DOCTYPE html>

<head>
<meta charset='UTF-8'>
<meta name='viewport' content='width=device-width, initial-scale=1.0'>
<title>Daily Paper Slideshow</title>
<style>
  :root {
    color-scheme: light;
    --bg: #f6f7f4;
    --paper: #ffffff;
    --ink: #111827;
    --muted: #64748b;
    --line: #d8ddd2;
    --accent: #176b87;
    --accent-2: #9a3412;
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; overflow: auto; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: var(--bg); color: var(--ink); }
  .shell { max-width: 1500px; min-height: 100vh; margin: 0 auto; padding: 14px 18px; display: flex; flex-direction: column; }
  .topbar { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 16px; }
  .top-actions { display: flex; align-items: center; gap: 10px; }
  .topbar a, button { border: 1px solid var(--line); border-radius: 8px; background: var(--paper); color: var(--ink); padding: 10px 14px; font-weight: 700; text-decoration: none; cursor: pointer; }
  button.primary { background: var(--accent); border-color: var(--accent); color: white; }
  button:disabled { opacity: 0.45; cursor: not-allowed; }
  .counter { color: var(--muted); font-weight: 700; }
  .slide { min-height: calc(100vh - 82px); background: var(--paper); border: 1px solid var(--line); border-radius: 10px; padding: 18px; box-shadow: 0 18px 42px rgba(15, 23, 42, 0.10); display: grid; grid-template-columns: minmax(310px, 0.86fr) minmax(0, 1.55fr); gap: 18px; overflow: visible; }
  .paper-head { min-width: 0; min-height: 0; overflow: visible; display: flex; flex-direction: column; gap: 12px; }
  .figure { margin: 0; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: #f8fafc; }
  .figure img { display: block; width: 100%; max-height: 41vh; object-fit: contain; background: white; }
  .figure figcaption { padding: 7px 10px; color: var(--muted); font-size: 12px; line-height: 1.3; }
  .head-text { display: flex; flex-direction: column; gap: 9px; min-width: 0; }
  .badges { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .badge { border-radius: 999px; padding: 5px 9px; background: #eef2ff; color: #3730a3; font-size: 12px; font-weight: 800; }
  .score { background: #fee2e2; color: #991b1b; }
  h1 { margin: 0; font-size: 25px; line-height: 1.15; letter-spacing: 0; overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
  h1 a { color: inherit; text-decoration-color: rgba(23, 107, 135, 0.35); text-decoration-thickness: 2px; text-underline-offset: 4px; }
  h1 a:hover { color: var(--accent); text-decoration-color: var(--accent); }
  .meta, .authors, .why, .abstract { font-size: 13px; line-height: 1.45; }
  .meta, .authors { color: var(--muted); }
  .why strong, .abstract strong, .authors strong { color: var(--ink); }
  .authors { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .why { border-left: 4px solid var(--accent-2); padding-left: 10px; color: #374151; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .abstract { border-top: 1px solid var(--line); padding-top: 14px; color: #374151; }
  .original-abstract { border-top: 1px solid var(--line); padding-top: 10px; color: #374151; font-size: 11.5px; line-height: 1.35; overflow-wrap: anywhere; }
  .original-abstract strong { display: block; margin-bottom: 4px; color: var(--ink); }
  .tags { display: flex; flex-wrap: wrap; gap: 8px; }
  .tag { border-radius: 999px; padding: 4px 8px; background: #f1f5f9; color: #475569; font-size: 12px; font-weight: 700; }
  .head-text > .link { display: none; }
  .briefing { min-width: 0; min-height: 0; overflow: visible; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); grid-auto-rows: minmax(0, auto); align-content: start; gap: 11px 18px; border-top: 0; padding-top: 0; }
  .brief-section { min-width: 0; }
  .brief-section.wide { grid-column: 1 / -1; }
  .brief-section h2 { margin: 0 0 4px; font-size: 14px; line-height: 1.22; color: #0f766e; letter-spacing: 0; }
  .brief-section p, .brief-section li { margin: 0; font-size: 12.5px; line-height: 1.42; color: #1f2937; overflow-wrap: anywhere; }
  .brief-section ul { margin: 0; padding-left: 20px; }
  .concepts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 9px 14px; }
  .concept { border-top: 1px solid var(--line); padding-top: 7px; }
  .concept h3 { margin: 0 0 4px; font-size: 13px; color: #7c2d12; letter-spacing: 0; }
  .concept p { margin: 2px 0 0; font-size: 11.5px; line-height: 1.35; color: #374151; overflow-wrap: anywhere; }
  .concept b { color: #111827; }
  .link { color: var(--accent); font-weight: 800; text-decoration: none; }
  .empty { padding: 48px; background: var(--paper); border: 1px solid var(--line); border-radius: 12px; color: var(--muted); }
  @media (max-width: 860px) {
    .shell { padding: 14px; }
    .topbar, .top-actions { align-items: stretch; flex-direction: column; }
    .slide, .briefing, .concepts { grid-template-columns: 1fr; }
    .slide { min-height: auto; overflow: visible; display: grid; }
    h1 { font-size: 28px; }
  }
</style>

<script>
const slides = [{"title": "Graphene lattice recoil in hard x-ray photoemission: Experiment and theory", "journal": "PRB_Recent", "source": "keyword", "link": "http://link.aps.org/doi/10.1103/s8w3-plc1", "authors": "Simone Ritarossi, Alice Apponi, Orlando Castellano, et al.", "last_authors": "Francesco Offi, Alessandro Ruocco", "summary": "Hard-x-ray C 1 s photoemission from monolayer graphene probes a regime in which nuclear recoil and intrinsic electronic asymmetry contribute on comparable energy scales to the observed spectral line shape. Here we combine experiment and modeling over the photon-energy range 0.8 – 8 keV to resolve this interplay quantitatively. A graphene-specific implementation of the Fujikawa-Takata cumulant formalism, based on an anisotropic vibrational density of states constrained by first-principles phonon calculations, captures the expected recoil scaling with photon energy and emission geometry but fails to reproduce the pronounced asymmetric tails of the measured spectra. To overcome this limitation, we introduce an explicit electronic convolution model in which a photon-energy-independent reference response, dominated by the electronic line shape and extracted from the low-recoil 0.8 keV data through a recoil-inclusive fit, is convolved with a phonon recoil kernel carrying the full dependence on photon energy and emission angle. This approach reproduces both the measured line-shape evolution and the observed peak shifts across the explored energy range without refitting the spectra at higher photon energies. The results show that recoil in graphene cannot be described by a baseline treatment in which the phonon recoil kernel is combined only with symmetric lifetime broadening, but must be treated together with the intrinsic many-body electronic response of the C 1 s line.", "tier": "A_MUST_READ", "score": "9", "reason": "title strong match: photoemission", "tags": ["photoemission", "graphene", "monolayer"], "image": "", "briefing": {"background": "광전자 분광법(PES)은 고체 내 전자 구조를 직접 관측하는 강력한 도구이지만, 고에너지(Hard X-ray) 영역에서는 원자 핵의 반동(nuclear recoil)이 분광 형상에 왜곡을 일으키는 문제가 있습니다.", "motivation": "단층 그래핀의 탄소 1s 코어 레벨 측정 시 핵 반동과 고유 전자 비대칭성(asymmetry)이 분광 선형에 미치는 영향을 정량적으로 분리하고 이해하고자 합니다.", "result": "기존의 Fujikawa-Takata 누적(cumulant) 공식만으로는 실험적 비대칭 꼬리를 설명할 수 없음을 확인했습니다. 연구팀은 전자 고유 응답과 포논 반동 커널을 분리하여 합성곱(convolution)하는 모델을 통해 0.8~8 keV 전 에너지 범위에서 실험 데이터를 성공적으로 재현했습니다.", "implication": "고에너지 광전자 분광법에서 다체 전자 응답과 진동 반동이 복합적으로 작용함을 증명했으며, 향후 고에너지 분광법 분석 시 핵 반동 보정 모델에 필수적인 정밀 가이드라인을 제공합니다.", "novelty": "기존 모델의 한계를 극복하고 재피팅 없이 실험 결과를 일관되게 설명하는 모델을 도입했습니다. 그래핀이라는 명확한 시스템에서 다체 물리와 반동 효과의 상호작용을 정밀하게 다룬 점이 독창적입니다.", "unresolved": "이 모델이 다른 2D 재료나 더 복잡한 격자 구조에서도 동일하게 강력한 예측력을 가질지, 혹은 추가적인 보정항이 필요한지는 검증이 더 필요합니다.", "future_work": "다른 van der Waals 이질구조나 강한 상관관계를 가진 재료 시스템으로 본 모델을 확장 적용하여 일반성을 입증하는 연구가 기대됩니다.", "concepts": [{"term": "Nuclear Recoil", "why_emerged": "고에너지 광자를 흡수할 때 광전자가 방출되면서 반작용으로 원자핵이 에너지를 얻어 분광 스펙트럼이 변형되기 때문입니다.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "Harp-X-ray PES, X-ray Absorption Spectroscopy."}, {"term": "Cumulant Formalism", "why_emerged": "다체 시스템에서 전자 여기와 관련된 복잡한 스펙트럼 선형을 통계적인 누적 함수를 통해 효율적으로 계산하기 위해 도입되었습니다.", "origin": "Fujikawa, Takata (PRB)", "connections": "Many-body physics, Photoemission theory."}], "english_summary": ["Analyzed C 1s hard X-ray photoemission in monolayer graphene.", "Identified that standard nuclear recoil models fail to capture spectral asymmetry.", "Proposed a new convolution model separating electronic response and phonon recoil.", "Achieved consistent line-shape prediction across 0.8 to 8 keV range."]}}, {"title": "Altermagnetism in Folded Iron Chain Systems", "journal": "PRL_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/6327-7256", "authors": "Ling-Fang Lin, Yang Zhang, Satoshi Okamoto, Adriana Moreo, Lun-Hui Hu, Elbio Dagotto", "last_authors": "Lun-Hui Hu, Elbio Dagotto", "summary": "Altermagnetism—moment-compensated magnetism with momentum-dependent spin splitting—has so far been realized primarily in Néel-type antiferromagnets. Here, we demonstrate altermagnetism in folded iron chain systems with block-type magnetic order (e.g.,$↑↑↓↓$). In the strictly one-dimensional (1D) cas…", "tier": "A_MUST_READ", "score": "9", "reason": "Directly addresses altermagnetism in 1D systems, matching key user interests in magnetism and low-dimensional materials.", "tags": ["altermagnetism", "1D", "magneticorder"], "image": "", "briefing": {"background": "알터마그네틱(Altermagnetism)은 스핀 보상(순자성 0)을 유지하면서도 운동량 의존적 스핀 분리를 나타내는 새로운 자기 상태로, spintronics 및 비전통적 초전도 연구의 핵심 화두입니다.", "motivation": "기존에는 주로 Néel형 반강자성체에서 연구되었으나, 1차원 구조인 철 사슬(iron chain) 시스템에서도 이러한 물리 현상이 발현 가능한지 탐구하고자 합니다.", "result": "접힌 철 사슬(folded iron chain) 시스템에서 블록형 자기 질서(↑↑↓↓)가 존재할 때 알터마그네틱 특성이 나타남을 이론적으로 입증했습니다.", "implication": "알터마그네틱의 범위를 1차원 시스템으로 확장하였으며, 이는 스핀-운동량 고정(spin-momentum locking)을 이용한 1차원 소자 설계 가능성을 시사합니다.", "novelty": "2D/3D 물질 위주였던 알터마그네틱 연구를 1D 시스템으로 끌어내렸으며, 특히 블록형 자기 질서와의 연관성을 제시한 점이 독특합니다.", "unresolved": "이러한 1D 알터마그네틱 상태가 실험적으로 합성된 1D 철 사슬에서 실현 가능한지, 그리고 실제 어떤 물리적 관측값(예: STS 분광)으로 확인될지에 대한 구체적 제안이 필요합니다.", "future_work": "본 이론 모델을 토대로 실제 1D 철 사슬 구조에서 각분해 광전자 분광법(ARPES)이나 STS를 이용한 스핀 분리 검증 실험이 필요합니다.", "concepts": [{"term": "Altermagnetism", "why_emerged": "기존 강자성체와 반강자성체의 범주를 넘어, 자화율이 0이면서도 에너지 밴드의 스핀 분리가 가능한 물질을 분류하기 위해 제안됨.", "origin": "최근 수년 내 다수 그룹에 의해 이론적 정립", "connections": "Néel antiferromagnets, Spin-splitting, Topological semimetals."}, {"term": "Folded Iron Chain", "why_emerged": "철 원자의 배열 구조 변화가 자기적 상호작용 및 전자의 궤도 중첩에 미치는 영향을 조절하기 위해 설계된 모델임.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "1D quantum magnetism, Iron-based superconductors."}], "english_summary": ["Demonstrated altermagnetism in 1D folded iron chain systems.", "Identified block-type magnetic order (↑↑↓↓) as a platform for momentum-dependent spin splitting.", "Expands the scope of altermagnetic materials beyond conventional Néel antiferromagnets.", "Highlights the potential for 1D spin-dependent quantum transport."]}}, {"title": "Electric field–controlled spin transport in a topological insulator interfaced with a ferroelectric antiferromagnet", "journal": "Science_Advances", "source": "author whitelist", "link": "https://www.science.org/doi/abs/10.1126/sciadv.aeh2170?af=R", "authors": "Yogesh Kumar, Pushpendra Gupta, Xinyan Li, et al.", "last_authors": "Ramamoorthy Ramesh, Sajid Husain", "summary": "Topological insulators have been explored extensively for spin-charge interconversion via magnetic interfaces, yet the true response of their spin-charge conversion, particularly in the absence of an external magnetic field, remains to be studied. Here, we report electric field control of spin-charge conversion in the topological insulator Bi 2 Te 3 with the antiferromagnetic multiferroic BiFeO 3 , using a nonlocal spin transport device. A systematic thickness dependence of the spin transport across the interface between Bi 2 Te 3 and BiFeO 3 reveals a signature of topological surface-state–dominated spin transport in the bilayer system. The spin-charge conversion remains robust for thicknesses above 10 nanometers but falls rapidly with reducing thickness and vanishes at 5 nanometers. This is consistent with hybridization-induced emergence of a trivial insulating phase, which is supported by the coherency factor estimated from the magnetoconductance of Bi 2 Te 3 . These results establish that spin-momentum–locked surface states dominate interfacial spin transport in the decoupled regime. Beyond presenting efficient spin-charge interconversion at an entirely insulating magnetic interface, this work also highlights sputter-deposited Bi 2 Te 3 as a high-quality and scalable platform for integrating quantum materials onto the devices. The nonlocal spin transport approach presented here provides a simple and unprecedented direct evidence of spin-charge conversion and opens an efficient and practical pathway toward designing energy-efficient spin-based devices.", "tier": "A_MUST_READ", "score": "9", "reason": "author whitelist: Robert J. Birgeneau", "tags": ["topologicalinsulator", "topological", "ferromagnet", "antiferromagnet", "transport"], "image": "", "briefing": {"background": "위상 절연체(TI) 표면 상태의 스핀-운동량 고정은 스핀-전하 변환의 효율이 높아 차세대 spintronics 소자 연구의 핵심입니다.", "motivation": "외부 자기장 없이도 자성 절연체(BiFeO3)와의 계면을 통해 TI(Bi2Te3)의 스핀-전하 변환 효율을 전기장으로 제어하고 관측하고자 합니다.", "result": "Bi2Te3/BiFeO3 이질구조에서 비국소(nonlocal) 스핀 수송을 통해 전기장 제어가 가능함을 확인했습니다. 특히 10nm 이상의 두께에서는 표면 상태가 지배적이나, 5nm 이하에서는 절연성 위상으로 전이되어 효과가 사라짐을 발견했습니다.", "implication": "자성 절연체와 TI를 결합한 스케일 가능한 스핀 소자 플랫폼을 구축하였으며, 전력 효율적인 스핀 소자 구현의 이정표를 마련했습니다.", "novelty": "기존의 금속성 자성체 대신 자성 절연체를 사용하여 인터페이스에서의 전하 손실을 최소화하고, 순수하게 위상 표면 상태의 스핀 특성을 추출했다는 점이 중요합니다.", "unresolved": "5nm 이하에서 나타나는 절연화 메커니즘의 상세 구조와 계면 결함이 표면 상태에 미치는 영향에 대한 정밀한 원자 단위 분석이 필요합니다.", "future_work": "본 플랫폼을 활용한 저전력 스핀-궤도 토크(SOT) 소자 제작 및 BiFeO3의 도메인 제어를 통한 스핀 흐름의 비휘발성 스위칭 연구가 기대됩니다.", "concepts": [{"term": "Nonlocal spin transport", "why_emerged": "국소적인 전하 흐름으로부터 발생하는 노이즈를 배제하고 오직 스핀 확산에 의한 신호만을 정밀하게 측정하기 위해 도입되었습니다.", "origin": "Johnson, Silsbee (1985)", "connections": "Spin Hall effect, Spin-charge conversion."}, {"term": "Spin-momentum locking", "why_emerged": "위상 절연체 표면 상태에서 전자의 운동 방향이 스핀 방향과 고정되어 있어 후방 산란이 금지되는 특성을 이용하기 위함입니다.", "origin": "Hasan, Kane (Rev. Mod. Phys. 2010)", "connections": "Topological insulators, Berry phase."}], "english_summary": ["Electric field control of spin-charge conversion in Bi2Te3/BiFeO3 heterostructures.", "Confirmed topological surface states dominate spin transport above 10 nm thickness.", "Vanishing spin-charge conversion below 5 nm due to hybridization-induced insulating phase.", "Paves the way for scalable, energy-efficient spintronic devices using magnetic insulators."]}}, {"title": "Time-reversal-symmetry-breaking spin injection from a compensated magnet", "journal": "Nature", "source": "Gemini", "link": "https://www.nature.com/articles/s41586-026-1 NT_CONDMAT", "score": "9", "reason": "Kagome flat-band system with heavy-fermion physics; high relevance.", "tags": ["kagome", "heavy-fermion", "flatband"], "image": "", "briefing": {"background": "가고메 금속(kagome metals)은 기하학적 좌절로 인해 평탄 밴드(flat band)가 나타나며 강한 전자 상관관계를 유발합니다. 중페르미온(heavy-fermion) 물질은 f-전자와 전도 전자 사이의 혼성으로 매우 무거운 유효 질량을 가지는데, 이 두 현상이 결합된 시스템은 위상학적 물성 연구의 핵심입니다.", "motivation": "YbCr6Ge6 시스템에서 4f 밴드와 3d 가고메 밴드가 어떻게 협력적으로 상호작용하며 강상관 전자 물성을 만들어내는지 규명하고자 합니다.", "result": "YbCr6Ge6에서 4f 전자와 3d 가고메 평탄 밴드의 협동적인 발생을 확인했으며, 이것이 시스템의 전자 상태에 중요한 역할을 함을 보였습니다.", "implication": "가고메 격자 내의 f-전자와 d-전자의 상호작용은 새로운 위상학적 초전도성이나 양자 상태를 유도할 수 있는 풍부한 플랫폼이 될 수 있습니다.", "novelty": "기존 가고메 금속 연구에서 f-전자 시스템을 도입하여 전자 상관관계의 깊이를 더했다는 점이 독창적이며, 독자의 연구 주제인 AV3Sb5 계열의 확장 모델로서 중요한 가치가 있습니다.", "unresolved": "f-전자와 d-전자 사이의 구체적인 결합 세기와 이로 인한 위상학적 위상의 변화(Berry curvature 영향 등)는 정량적 평가가 더 필요합니다.", "future_work": "고해상도 ARPES 및 STM/STS를 통한 밴드 구조 관측과 전자-포논 결합의 상세 분석.", "concepts": [{"term": "Kagome flat band", "why_emerged": "가고메 격자의 파괴적인 간섭(destructive interference)으로 인해 분산이 없는 평탄한 밴드가 생성됨.", "origin": "가고메 격자 자체는 수학적 격자로 오래전 제안됨.", "connections": "AV3Sb5 등 최근 가고메 초전도체 물질군과 연결됨."}, {"term": "Heavy-fermion", "why_emerged": "국소화된 f-전자와 전도 전자 간의 Kondo 산란으로 유효 질량이 급증하는 현상.", "origin": "1970년대 CeAl3 등에서 실험적으로 처음 확립됨.", "connections": "Kondo 격자 모델 및 강상관 전자계 연구의 기초."}], "english_summary": ["Investigation of cooperative concurrence of 4f and 3d flat bands in YbCr6Ge6.", "Explores the interplay between kagome geometry and heavy-fermion physics.", "Highlights the potential for emergent quantum states in f-d electron hybridized systems.", "Provides significant insight for researchers interested in strongly correlated kagome metals."]}}, {"title": "Transparency-controlled multiple charge transfer in superconducting junctions with local shot-noise scanning tunneling spectroscopy", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/81fz-49c6", "authors": "Yudai Sato, Maialen Ortego Larrazabal, Jian-Feng Ge, et al.", "last_authors": "Milan P. Allan, Jiasen Niu", "summary": "Charge transport in superconducting junctions at finite voltages is governed by Andreev reflections, including multiple Andreev reflections, which are processes that enable multiple charge transfer, a hallmark that shot noise can directly quantify. Since the effective charge extracted from shot-noise measurements varies with the transparency of the junction, systematic control of transparency is essential but experimentally challenging. Here, we present shot-noise scanning tunneling microscopy measurements enabled by a newly developed amplifier, allowing access to different transparency regimes. We perform shot-noise measurements on Pb(111) with tunable transparency at 2.2 K and observe that the shot noise evolves from a single-electron tunneling regime to multiple charge-transfer regimes as transparency increases. Our results are quantitatively consistent with theoretical simulations of Andreev reflections and multiple Andreev reflections for a single-channel system. These results establish junction transparency as the key parameter governing the evolution of charge transport and demonstrate that noise STM is a powerful platform for investigating microscopic charge transport mechanisms with controlled junction transparency at the atomic scale.", "tier": "B_IMPORTANT_CONDMAT", "score": "9", "reason": "Direct relevance of STM/STS methodology on superconductors to the user's interests.", "tags": ["method", "STM", "superconductivity"], "image": "", "briefing": {"background": "초전도 접합에서의 전하 수송은 Andreev 반사(AR)와 다중 Andreev 반사(MAR) 과정에 의해 결정됩니다. 특히 MAR은 쿠퍼 쌍이 접합을 가로지르며 여러 전하를 한 번에 전달하는 현상으로, 이는 접합의 투명도(transparency)에 민감하게 반응합니다.", "motivation": "기존 STM/STS 연구에서는 접합 투명도를 정밀하게 제어하며 샷 노이즈(shot noise)를 측정하는 것이 기술적으로 매우 어려웠습니다. 연구팀은 투명도를 자유롭게 조절하며 미세한 전하 수송 메커니즘을 규명하고자 했습니다.", "result": "새로운 앰프를 사용하여 투명도를 조절 가능한 노이즈 STM 플랫폼을 구축했습니다. Pb(111) 표면에서 투명도 증가에 따라 단일 전자 터널링에서 다중 전하 전달  for multiband CdGM states in iron-based superconductors.", "tier": "B_IMPORTANT_CONDMAT", "score": "9", "reason": "Spectroscopy of vortex states in a major iron-based superconductor; highly relevant to electronic structure interests.", "tags": ["material", "superconductivity", "spectroscopy"], "image": "", "briefing": {"background": "철 기반 초전도체(Fe-based superconductors)는 다중 밴드 특성을 가지며, 이들의 보텍스 코어 내부에는 전자가 국소화된 Caroli-de Gennes-Matricon (CdGM) 상태가 존재합니다.", "motivation": "기존 STM 연구를 넘어, 테라헤르츠 자기 광학 분광법을 이용해 FeTe1-xSex 물질 내 보텍스 코어의 헬리컬(chiral) 여기 상태를 동역학적으로 직접 관측하고자 했습니다.", "result": "테라헤르츠 분광법을 통해 FeTe1-xSex의 보텍스 코어 내 다중 밴드 CdGM 상태에 대한 동적 증거를 확보했습니다.", "implication": "강한 상관관계를 가진 초전도체에서 보텍스 여기 상태의 위상학적/chirality 성질을 조사하는 새로운 실험적 경로를 열었습니다.", "novelty": "기존 STM의 정적 측정을 넘어, 테라헤르츠 대역의 분광학적 접근을 통해 보텍스 여기의 'Chirality'를 직접 분해했다는 점이 혁신적입니다.", "unresolved": "관측된 신호와 실제 보텍스 내부의 위상학적 준입자 여기 사이의 미세한 대응 관계에 대한 이론적 정교화가 필요합니다.", "future_work": "다양한 도핑 수준 및 변형된 철 기반 초전도체에서의 보텍스 여기 동역학 비교 연구.", "concepts": [{"term": "CdGM states", "why_emerged": "초전도체 내 보텍스 코어에 갇힌 준입자들의 에너지 수준을 설명하기 위해 도입됨.", "origin": "Caroli, de Gennes, Matricon (1964).", "connections": "Andreev 경계 상태, 마요라나 준입자, 초전도 보텍스 물리학."}, {"term": "Terahertz Magneto-optics", "why_emerged": "저에너지 밴드 구조와 준입자 동역학을 고해상도로 탐색하기 위해 사용됨.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "ARPES, 자기 분광법, 준입자 여기 연구."}], "english_summary": ["Reported chirality-resolved THz spectroscopy of CdGM states in FeTe1-xSex.", "Provided dynamical evidence for multiband vortex-core excitations.", "Established THz magneto-optics as a probe for helical vortex-core states.", "Highlights the potential for studying topological and chiral excitations in iron-based superconductors."]}}, {"title": "Altermagnetism revealed by polarized neutrons in MnF2", "journal": "Science", "source": "Gemini", "link": "https://www.science.org/doi/abs/10.1126/science.aec2602?af=R", "authors": "Quentin Faure, Dalila Bounoua, Victor Balédent, et al.", "last_authors": "Sylvain Petit, Paul McClarty", "summary": "Altermagnets are compensated magnets with symmetry-enforced spin split bands. Direct spectroscopic evidence for their existence has been reported in several materials. For example, inelastic neutron scattering (INS) has recently been used to witness a splitting of magnon bands in MnTe that is compatible with altermagnetism. Here, we present polarized INS results on MnF 2 showing that it is altermagnetic. Our data reveal a splitting coming from the long-range dipolar coupling. Furthermore, using a domain-biased sample, the data reveal a nonzero chirality in the neutron scattering cross section that reverses the sign between the two magnon modes. It is this feature that clearly demonstrates altermagnetism in MnF 2 . This finding highlights the potential for polarized INS to characterize altermagnets through its sensitivity to fine structure in magnon spectra.", "tier": "B_IMPORTANT_CONDMAT", "score": "9", "reason": "Neutron scattering study of altermagnetism, directly matching user interest.", "tags": ["neutron-scattering", "MnF2", "altermagnetism"], "image": "", "briefing": {"background": "알터마그네틱(Altermagnetism)은 강자성과 반강자성의 특성을 결합한 새로운 자기 상으로, 스핀이 상쇄됨에도 불구하고 대칭성에 의해 강제된 운동량 의존적 스핀 분할 밴드를 가집니다.", "motivation": "MnF2에서 알터마그네틱 특성을 직접적으로 검증하고, 편극 중성자 산란(polarized INS)이 이러한 미세한 마그논 스펙트럼 구조를 밝혀낼 수 있음을 입증하고자 했습니다.", "result": "편극 중성자 산란 실험을 통해 장거리 쌍극자 결합에 의한 마그논 분할을 확인했습니다. 특히 도메인 바이어스 샘플을 사용하여 두 마그논 모드 간의 부호를 반전시키는 비영(non-zero) 카이랄성을 관측함으로써 알터마그네틱 상태임을 확증했습니다.", "implication": "알터마그네틱 물질의 마그논 동역학을 특성화하는 데 편극 중성자 산란이 매우 강력한 도구임을 보여주었으며, 향후 스핀트로닉스 소자 개발의 기반이 됩니다.", "novelty": "기존 반강자성체로 알려졌던 MnF2에서 알터마그네틱의 핵심인 비영 카이랄 마그논 특성을 실험적으로 직접 증명했다는 점이 독보적입니다.", "unresolved": "실험 데이터의 해석에 있어 장거리 쌍극자 결합의 정확한 기여도 분리 및 다른 비자성 효과와의 정밀한 구분이 여전히 중요합니다.", "future_work": "다른 알터마그네틱 후보 물질들에 대한 편극 중성자 산란 적용 및 마그논 밴드 구조와 수송 현상 간의 상관관계 연구가 예상됩니다.", "concepts": [{"term": "Altermagnetism", "why_emerged": "강자성도 반강자성도 아닌 제3의 자기 질서 상태를 분류하고 스핀 분할 현상을 설명하기 위해 제안되었습니다.", "origin": "최근 수년 내 제안되었으며, 구체적으로는 특정 자기군(magnetic point group) 대칭성 기반으로 정립되었습니다.", "connections": "반강자성체에서의 스핀-궤도 결합 없이 나타나는 스핀 분할, 스핀트로닉스."}, {"term": "Polarized Inelastic Neutron Scattering", "why_emerged": "비편극 중성자 산란으로는 분리하기 어려운 마그논의 미세한 분할과 카이랄성을 명확히 구분하기 위해 필요합니다.", "origin": "중성자 산란 기술의 발전과 함께 확립되었습니다.", "connections": "마그논 분산 관계 연구, 스핀 궤도 상호작용 분석."}], "english_summary": ["MnF2 is identified as an altermagnet using polarized inelastic neutron scattering.", "The study reveals magnon band splitting caused by long-range dipolar coupling.", "Observation of nonzero chirality in magnon modes confirms the altermagnetic nature.", "Polarized neutron scattering is proven as a powerful technique for characterizing magnon fine structure."]}}, {"title": "Chiral altermagnon in MnTe", "journal": "Science", "source": "Gemini", "link": "https://www.science.org/doi/abs/10.1126/science.adv3196?af=R", "authors": "Daniel Jost, Resham Babu Regmi, Eder G. Lomeli, et al.", "last_authors": "Stephan Geprägs, Matthias F. Kling", "summary": "Altermagnetism has been recognized as a magnetic phase that bridges the properties of ferro- and antiferromagnetism. The momentum-dependent spin splitting observed in these materials reflects their distinctive symmetry characteristics, which also establish the conditions for chiral magnons to emerge. Here we provide direct experimental evidence for a chiral magnon in the altermagnetic candidate manganese telluride (MnTe) revealed by circular-dichroism resonant inelastic x-ray scattering. This mode, which we term chiral altermagnon, exhibits a distinct momentum dependence of its spin polarization consistent with the altermagnetic g -wave symmetry of MnTe. Our polarization-resolved data corroborate the existence of a discrete class of magnetic excitations, demonstrating how altermagnetic order shapes spin dynamics and paving the way for advances in spintronic and quantum technologies.", "tier": "B_IMPORTANT_CONDMAT", "score": "9", "reason": "Direct experimental study of altermagnetism, a key interest for this user.", "tags": ["experiment", "MnTe", "altermagnetism"], "image": "", "briefing": {"background": "알터마그네틱은 스핀 보상 상태에서도 결정 대칭성에 의해 강제된 비상호적(non-reciprocal) 스핀 분할을 가져, 강자성 수준의 스핀 분극 기능을 가질 수 있는 물질군입니다.", "motivation": "알터마그네틱 물질인 MnTe에서 이론적으로 예측된 '카이랄 알터마그논'을 분광학적 실험으로 직접 검증하고자 했습니다.", "result": "원편광 이색성(circular-dichroism) 기반의 공명 비탄성 X선 산란(RIXS)을 통해 MnTe의 g-wave 대칭성에 부합하는 운동량 의존적 스핀 분극 마그논 모드를 관측했습니다.", "implication": "알터마그네틱 질서가 스핀 동역학을 어떻게 지배하는지 입증하였으며, 카이랄 마그논을 활용한 새로운 자기 소자 가능성을 열었습니다.", "novelty": "CD-RIXS를 활용해 MnTe의 마그논 카이랄성을 직접적으로 증명했다는 점이 본 분야의 핵심적인 진전입니다.", "unresolved": "고온 환경이나 실제 소자 작동 조건에서의 마그논 결맞음(coherence) 및 수명에 대한 상세 연구가 부족합니다.", "future_work": "카이랄 마그논을 이용한 정보 전송, 제어 및 차세대 스핀트로닉 소자로의 응용 연구가 진행될 것입니다.", "concepts": [{"term": "Chiral Altermagnon", "why_emerged": "알터마그네틱 물질의 대칭성에 의해 발생하는 마그논의 운동량 의존적 카이랄 분극 현상을 설명하기 위해 등장했습니다.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "스핀 분할, g-wave 자기 대칭성."}, {"term": "CD-RIXS", "why_emerged": "시료의 자기적 특성과 카이랄한 스핀 구조를 운동량 및 에너지 분해능을 가지고 측정하기 위해 개발되었습니다.", "origin": "RIXS 기술과 광학 이색성 측정 기술의 융합.", "connections": "ARPES를 통한 전자 구조 연구와 상호보완적 관계."}], "english_summary": ["Experimental identification of chiral magnons in MnTe using CD-RIXS.", "The results confirm g-wave altermagnetic symmetry-induced spin splitting.", "Direct visualization of momentum-dependent spin polarization in magnons.", "Advances the understanding of spin dynamics in altermagnets for spintronics."]}}, {"title": "Layer-decoupled electronic reconstruction and a robust charge density wave in GdTe3", "journal": "npj_QuantumMaterials", "source": "Gemini", "link": "https://www.nature.com/articles/s41535-026-00946-9", "authors": "Xin Zheng, Yunbo Wu, Tongrui Li, et al.", "last_authors": "Shengtao Cui, Zhe Sun", "summary": "Layer-decoupled electronic reconstruction and a robust charge density wave in GdTe 3", "tier": "B_IMPORTANT_CONDMAT", "score": "9", "reason": "Electronic structure study of a classic charge density wave material system highly relevant to ARPES.", "tags": ["material", "CDW", "electronicstructure", "tellurides"], "image": "https://pubads.g.doubleclick.net/gampad/ad?iu=/285/npjquantmats.nature.com/article&sz=728x90&c=1353518546&t=pos%3Dtop%26type%3Darticle%26artid%3Ds41535-026-00946-9%26doi%3D10.1038/s41535-026-00946-9%26subjmeta%3D301,639,766%26kwrd%3DMaterials+science,Physics", "briefing": {"background": "GdTe3와 같은 RTe3 계열 물질은 준 2차원적인 층상 구조를 가지며, 강한 전하 밀도 파(CDW) 현상과 이로 인한 전자 구조의 재구성이 나타나는 대표적인 시스템입니다.", "motivation": "GdTe3 시스템에서 나타나는 층간 결합의 영향과 이로 인한 전자 구조의 재구성이 CDW 형성 및 안정성에 어떤 역할을 하는지 규명하고자 했습니다.", "result": "층간 결합이 해제된 전자 재구성을 관측하였으며, 이는 GdTe3 내에서 매우 강건한(robust) CDW 상태를 유지하는 핵심 메커니즘임을 밝혔습니다.", "implication": "층상 구조 물질에서의 전자적 상관관계가 어떻게 CDW 형성을 안정화하는지에 대한 물리적 이해를 제공합니다.", "novelty": "GdTe3 시스템의 층간 결합과 전자 재구성의 관계를 정밀하게 분석하여 CDW의 견고함을 설명한 점이 특징입니다.", "unresolved": "이러한 층간 결합 해제가 구체적으로 어떤 에너지 스케일에서 발생하는지, 그리고 초전도성과의 연관성은 여전히 논의의 여지가 있습니다.", "future_work": "압력이나 도핑을 통한 층간 결합 제어 및 그에 따른 CDW와 경쟁/협력하는 양자 상태 관측 연구가 필요합니다.", "concepts": [{"term": "Charge Density Wave (CDW)", "why_emerged": "페르미 표면의 네스팅(nesting) 또는 강한 전자-포논 상호작용으로 인한 전자 밀도의 주기적 변조를 설명하기 위해 등장했습니다.", "origin": "Peierls(1955) 등에 의해 1차원 금속에 대해 처음 제안되었습니다.", "connections": "페르미 표면 재구성, ARPES로 관측 가능한 밴드 접힘 현상."}, {"term": "Layer-decoupled electronic reconstruction", "why_emerged": "3차원 결정 구조 내에서 각 층이 갖는 전자적 성질이 층간 상호작용보다 독자적으로 행동하는 현상을 설명하기 위해 사용됩니다.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "반데르발스 이질구조, 준 2차원 계열 물질."}], "english_summary": ["Investigation of layer-decoupled electronic reconstruction in GdTe3.", "The study links electronic structural features to the robust charge density wave order.", "Provides insights into the stabilization mechanisms of CDW in telluride systems.", "Relevant for understanding electronic correlation in layered transition metal chalcogenides."]}}, {"title": "Thermodynamic demonstration of tetracriticality and multicomponent superconductivity in UTe2", "journal": "Nature_Physics", "source": "Gemini", "link": "https://www.nature.com/articles/s41567-026-03504-z", "authors": "Sahas Kamat, Jared Dans, Shanta Saha, et al.", "last_authors": "Jörg Schmalian, B. J. Ramshaw", "summary": "Prior measurements of the phase diagram of UTe2 contain a triple point that is forbidden by thermodynamics. Now, an additional phase boundary is discovered that resolves this problem and confirms multicomponent superconductivity in this material.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Important study on multicomponent superconductivity in the topological superconductor candidate UTe2.", "tags": ["thermodynamics", "UTe2", "unconventionalsuperconductivity"], "image": "https://media.springernature.com/m685/springer-static/image/art%3A10.1038%2Fs41567-026-03504-z/MediaObjects/41567_2026_3504_Fig1_HTML.png", "briefing": {"background": "UTe2는 위상 초전도체 후보 물질로, 강한 전자 상관관계와 스핀-삼중항 초전도 가능성으로 주목받고 있습니다. 기존 실험 데이터에서 열역학적으로 금지된 삼중점이 관측되어 위상 특성에 대한 논란이 있었습니다.", "motivation": "기존 데이터의 열역학적 불일치를 해결하고 UTe2의 다성분 초전도성(multicomponent superconductivity) 가설을 엄밀하게 검증하기 위해 새로운 상 경계를 탐색했습니다.", "result": "열역학적 측정을 통해 새로운 상 경계를 발견하였으며, 이를 통해 기존의 삼중점 문제를 해결하고 UTe2가 다성분 초전도체임을 강력히 지지하는 증거를 제시했습니다.", "implication": "UTe2가 다성분 질서 변수를 가진 초전도체임을 확인함으로써, 이 물질의 위상학적 성질과 대칭성 파괴를 이해하는 데 결정적인 단서를 제공합니다.", "novelty": "열역학적 불일치를 해결함으로써 UTe2의 복잡한 상도 논쟁을 잠재우고, 위상 초전도 후보로서의 위상을 공고히 했습니다.", "unresolved": "다성분 초전도 상태의 정확한 대칭성 및 미시적 메커니즘은 여전히 추가 연구가 필요합니다.", "future_work": "저온에서의 고해상도 분광학 실험(ARPES 등)을 통해 상 경계 근처의 전자 구조 변화를 관측할 필요가 있습니다.", "concepts": [{"term": "다성분 초전도성", "why_emerged": "초전도 질서 변수가 여러 성분으로 구성되어 복잡한 위상 및 에너지 구조를 형성하기 위해 필요합니다.", "origin": "초기 연구자들은 질서 변수의 축퇴성을 설명하기 위해 제안했으나 초록 정보만으로는 특정하기 어려움.", "connections": "비전통적 초전도체, 대칭성 파괴, 위상 초전도."}, {"term": "UTe2", "why_emerged": "스핀-삼중항 초전도 후보 물질로서 위상 양자 컴퓨터 구현 가능성 때문에 주목받았습니다.", "origin": "Ran et al. (2019)에 의해 위상 초전도 후보로 처음 보고되었습니다.", "connections": "강상관 전자계, Heavy fermion 초전도체."}], "english_s , vdW 이질 구조에서의 물리적 결합을 통해 위상 상을 제어하는 디자인 규칙을 제시했습니다.", "unresolved": "실제 합성된 이종 구조에서 나타날 수 있는 격자 불일치(mismatch)나 계면 결함 효과는 고려되지 않았습니다.", "future_work": "제시된 이종 구조를 실제로 합성하고 STM/STS를 통해 에지 상태를 직접 관측하는 실험이 필요합니다.", "concepts": [{"term": "양자 스핀 홀 상", "why_emerged": "절연체 내부와 달리 경계면에서 스핀 분리된 전도 채널이 존재하여 무손실 수송을 구현하기 위해 필요합니다.", "origin": "Bernevig, Hughes, Zhang (2006) 등에 의해 제안되었습니다.", "connections": "위상 절연체, 2D 물질, 스핀트로닉스."}, {"term": "van der Waals 이질 구조", "why_emerged": "서로 다른 2D 물질을 쌓아 자연 상태에 존재하지 않는 새로운 위상적/양자 현상을 구현하기 위해 필요합니다.", "origin": "Geim과 Novoselov 그룹에 의해 2010년대 이후 본격화되었습니다.", "connections": "Moiré 초격자, 2D 반도체."}], "english_summary": ["Investigates topological phase control in Bi2Te3-based vdW heterobilayers.", "Uses first-principles and tight-binding methods to predict quantum spin Hall phases.", "Demonstrates the feasibility of designing topological insulators via interfacial stacking.", "Provides a theoretical basis for future device applications in topological electronics."]}}, {"title": "Magnetism and symmetry of superconducting gap in LaFeAsO from dynamical mean-field theory", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/gfr4-g54x", "authors": "S. L. Skornyakov, V. I. Anisimov, A. A. Katanin", "last_authors": "V. I. Anisimov, A. A. Katanin", "summary": "By employing a combined method of density functional theory and dynamical mean field theory $(\\mathrm{DFT}+\\mathrm{DMFT})$ we investigate the effect of electronic correlations on the magnetic and superconducting properties of the iron-based parent compound LaFeAsO. We find that the static nonlocal s…", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Electronic structure (DFT+DMFT) of iron-based superconductors is a core interest for the user.", "tags": ["theory", "iron-pnictides", "superconductivity"], "image": "", "briefing": {"background": "철 기반 초전도체(FeSC)의 모물질인 LaFeAsO는 전형적인 강상관 전자계로, 자기적 질서와 초전도성 사이의 상호작용을 이해하는 것이 고온 초전도 기작 규명의 핵심입니다.", "motivation": "기존의 단일 입자 이론인 DFT만으로는 강한 전자 상관관계를 충분히 기술하기 어려워, DFT+DMFT 접근 방식을 통해 전자 상관효과가 자기적 성질 및 초전도 갭 구조에 미치는 영향을 규명하고자 합니다.", "result": "비국소적인(nonlocal) 상관관계가 LaFeAsO의 자기적 특성과 초전도 갭의 대칭성에 중요한 역할을 함을 보였습니다.", "implication": "강상관 전자계에서 전자 간 상호작용이 단순히 국소적 쿨롱 에너지를 넘어 비국소적인 형태로 나타나며, 이것이 초전도 페어링 대칭성에 결정적 영향을 미칠 수 있음을 시사합니다.", "novelty": "DFT+DMFT라는 정밀한 계산 기법을 도입하여 FeSC의 미시적 전자 구조를 보다 정확하게 재현하려 시도했다는 점이 전문가들에게 의의가 있습니다.", "unresolved": "비국소적 상관관계가 실험적인 ARPES 밴드 구조나 스펙트럼 함수와 얼마나 정확히 일치하는지에 대한 정량적 비교가 추가로 필요합니다.", "future_work": "더 넓은 도핑 영역에서 비국소적 상관관계가 초전도 전이 온도(Tc)를 어떻게 변화시키는지에 대한 체계적인 연구가 예상됩니다.", "concepts": [{"term": "DFT+DMFT", "why_emerged": "DFT는 밴드 구조를 잘 설명하지만 강한 전자 상관관계를 기술하는 데 한계가 있어 이를 극복하기 위해 제안되었습니다.", "origin": "G. Kotliar, S. Y. Savrasov 등(2006년경 정립)", "connections": "LDA+U, 동역학적 평균장 이론(DMFT)의 발전적 결합체."}, {"term": "Iron-based superconductors", "why_emerged": "구리 기반 산화물 초전도체 이후 발견된 새로운 고온 초전도 물질군으로, 전자의 궤도 자유도가 중요한 역할을 합니다.", "origin": "Kamihara et al. (2008)", "connections": "FeAs/FeSe 층구조, 스핀 밀도 파동(SDW), 비전통적 초전도성."}], "english_summary": ["Investigates the parent compound LaFeAsO using combined DFT+DMFT methods.", "Focuses on the role of electronic correlations in determining magnetic and superconducting properties.", "Highlights the significance of nonlocal correlations in the iron-pnictide electronic structure.", "Provides theoretical insight into the pairing symmetry of iron-based superconductors."]}}, {"title": "Propagation and localization of spin excitations at altermagnetic domain walls", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/zgw5-99k2", "authors": "Oksana Peschanska, Jeroen van den Brink, Volodymyr P. Kravchuk", "last_authors": "Jeroen van den Brink, Volodymyr P. Kravchuk", "summary": "Altermagnets ( AMs ) are spin-compensated materials in which opposite-spin sublattices are connected by a symmetry that causes a spin splitting in their elementary excitations. As there is a strong effect of altermagnetism on domain wall properties, it is quite natural to also expect an enrichment of the physics of magnetic excitations at AM domain walls. Here, we consider the propagation of spin eigenexcitations along domain walls in easy-axial d -wave AMs . Investigating the presence of bound states localized on a domain wall, we find that the effect of the AM on the bound states strongly depends on the orientation of the domain wall relative to the crystallographic directions. If the domain wall is oriented along a nodal direction [100] or [010], AM does not change the number of bound states; however, it leads to a nonlinear dispersion and a tilt of the wavefront. The effect of AM is strongest when the domain wall is oriented along the directions [110] or [ 1 ¯ 10 ] , i.e., along the directions of the strongest AM splitting in the magnon spectrum. In this case, (i) the additional gapped bound states appear, (ii) degeneracy of the eigenstates with respect to their polarization (right-hand or left-hand precession of the Néel vector) is removed, and (iii) the localization area of the bound states strongly depends on the eigenfrequency. The latter may lead to strong localization of the bound state at the domain wall. We further consider the influence of a static magnetic field that is applied along the easy axis and find that the magnetic field induces an asymmetry between the localization regions on opposite sides of the domain wall and sets an upper limit on the absolute value of the propagating eigenstate's wave vector.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Theory of spin excitations in altermagnets, a high-priority material class for the user.", "tags": ["theory", "altermagnetism", "domainwalls"], "image": "", "briefing": {"background": "알터자성(Altermagnetism)은 시간 역전 대칭성이 깨져 있으나 스핀이 보상된 상태로, 기존의 강자성이나 반강자성과는 다른 독특한 물리적 특성을 가집니다.", "motivation": "알터자성체의 도메인 벽(domain wall) 내에서 스핀 들뜸(magnon)이 어떻게 전파되거나 국소화되는지 이해하여, 차세대 스핀트로닉스 소자 응용 가능성을 타진하고자 합니다.", "result": "도메인 벽의 방향과 ed": "이 페어링 전이가 초전도성으로 직접 연결되는지, 혹은 더 높은 차수의 위상 순서와 관련이 있는지 명확하지 않습니다.", "future_work": "유사한 궤도 조절 방식을 활용한 비-아벨리안(non-Abelian) 애니온 상태의 탐색이 중요한 과제입니다.", "concepts": [{"term": "복합 페르미온", "why_emerged": "강한 자기장 하의 전자 시스템을 상호작용하지 않는 입자들의 계로 재해석하기 위해 제안됨.", "origin": "Jain (1989)", "connections": "분수 양자 홀 효과, Chern-Simons 이론, 라플린 상태."}, {"term": "궤도 튜닝", "why_emerged": "란다우 준위의 파동함수 성분이 전자 간 상호작용의 유효 범위를 결정하므로, 이를 변형하여 위상 상태를 제어하기 위함.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "모아레 시스템, 밴드 엔지니어링, 평탄 밴드 물리학."}], "english_summary": ["Study of orbitally tuned composite-fermion pairing transitions in bilayer graphene.", "Investigates how orbital character influences fractional quantum Hall states.", "Experimental control over metal-insulator transitions in half-filled Landau levels.", "Provides insights into the interplay between orbital degrees of freedom and strong correlations."]}}, {"title": "Competing charge and spin instabilities and giant magnetoelastic coupling in CrSb", "journal": "Science_Advances", "source": "Gemini", "link": "https://www.science.org/doi/abs/10.1126/sciadv.aei0921?af=R", "authors": "A. Korshunov, M. Alkorta, C.-Y. Lim, et al.", "last_authors": "Ion Errea, S. Blanco-Canosa", "summary": "Electronic, magnetic, and lattice degrees of freedom are often strongly intertwined in quantum materials, giving rise to competing ordered states and emergent collective phenomena. Understanding how these interactions evolve across symmetry-breaking transitions is essential for identifying new mechanisms of electronic ordering. Here, we show that the antiferromagnet chromium antimonide provides an ideal platform to investigate this interplay and uncover short-range charge-order fluctuations at the M point of the Brillouin zone, q * = ( 1 2 0 ) , persisting well above the Néel temperature, T N . These fluctuations collapse upon entering the magnetically ordered phase, revealing a direct competition between charge and spin order parameters. At T N , the phonon dispersion at q * develops a pronounced Kohn-like anomaly, signaling strong electron-phonon coupling in the vicinity of the magnetic transition. Below T N , exchange striction markedly renormalizes the associated soft phonon mode by ∼6 milli–electron volts, corresponding to the largest spin-phonon coupling reported to date. First-principles calculations show that the relevant phonon branch is unstable at the harmonic level only in the absence of magnetic order, highlighting the remarkable sensitivity of the lattice to magnetic symmetry breaking. The suppression of charge correlations upon magnetic ordering, together with the abrupt reconstruction of the phonon spectrum at T N , demonstrates an exceptional coupling between charge, spin, and lattice degrees of freedom in chromium antimonide. With its chemically simple structure and symmetry-protected altermagnetic state, chromium antimonide emerges as a model system for exploring giant spin-phonon coupling, competing electronic instabilities, and emergent broken symmetries in altermagnetic materials.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "CrSb is a relevant magnetic material with complex electronic instabilities like CDW/SDW.", "tags": ["material", "magnetism", "chargedensitywave"], "image": "", "briefing": {"background": "양자 물질에서 전자, 스핀, 격자 자유도의 상호작용은 복잡한 상전이와 새로운 물성을 창출하는 핵심 요소입니다. 특히 전하 밀도 파동(CDW)과 자기 질서 사이의 경쟁은 강상관 전자계 연구의 주요 과제입니다.", "motivation": "CrSb(안티모니화 크롬)라는 화학적으로 단순한 구조를 가진 물질에서 자기적 질서와 전하 질서가 어떻게 상호작용하는지, 특히 알터자기(altermagnetic) 상태에서의 스핀-격자 결합 기작을 규명하고자 했습니다.", "result": "Néel 온도 이상에서 M 포인트(q* = (1/2, 0))에서의 단거리 전하 질서 요동을 확인했으며, 자기 질서가 형성될 때 이 전하 요동이 억제됨을 발견했습니다. 또한 Néel 온도에서 발생하는 강한 스핀-격자 결합으로 인해 역대 최대 수준의 스핀 유도 포논 모드 변화가 관측되었습니다.", "implication": "CrSb가 알터자기 물질로서 전자-스핀-격자의 강한 결합을 연구하는 이상적인 모델 시스템임을 입증했습니다. 이는 스핀트로닉스 응용을 위한 새로운 물질 설계의 기초가 될 수 있습니다.", "novelty": "자기 상전이에 따른 포논 스펙트럼의 급격한 변화와 전하 질서의 억제를 직접적으로 연결했다는 점이 중요하며, 알터자기와 CDW의 경쟁을 다루어 연구자의 관심사인 자기 위상 물질 및 전하 질서 분야에 시사점을 줍니다.", "unresolved": "자기 질서 내부에서 나타나는 세부적인 포논 분산의 비조화성(anharmonicity) 기작과 전하 질서 요동의 미시적 원인은 여전히 상세 연구가 필요합니다.", "future_work": "저온에서의 고해상도 ARPES를 통한 전자 구조 변화 관측 및 외부 자기장 하에서의 포논 이상 현상 연구가 기대됩니다.", "concepts": [{"term": "알터자기(Altermagnetism)", "why_emerged": "기존의 강자성/반강자성과 달리 스핀 분할(spin-splitting)이 있으면서도 알짜 자화가 없는 자기 질서 상태를 설명하기 위해 도입됨.", "origin": "최근 이론적으로 정립되었으며(예: Libor Smejkal 등), CrSb 등에서 실험적 근거가 강화됨.", "connections": "반강자성체, 비상호성 자기 수송 현상, 스핀-궤도 결합."}, {"term": "스핀-격자 결합(Spin-phonon coupling)", "why_emerged": "자기 질서가 격자의 진동 모드에 미치는 영향을 이해하여 물질의 상전이 기작을 밝히기 위해 필요.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "스핀 변형(Magnetostriction), 포논, 상전이 물리학."}, {"term": "Kohn 이상(Kohn anomaly)", "why_emerged": "페르미 표면의 중첩으로 인해 격자 진동(포논) 스펙트럼에서 나타나는 급격한 이상 현상을 설명하기 위해.", "origin": "Walter Kohn (1959).", "connections": "CDW, 전자-포논 결합, 페르미 표면 중첩(nesting)."}], "english_summary": ["CrSb exhibits strong competition between short-range charge-order fluctuations and magnetic order.", "A record-high spin-phonon coupling is identified at the Néel temperature in the altermagnetic phase.", "Magnetic ordering suppresses charge correlations and induces a dramatic renormalization of the phonon spectrum.", "CrSb is established as a model system for exploring the interplay of spin, lattice, and charge degrees of freedom."]}}, {"title": "Tunneling spectroscopy of topological insulator Josephson junctions", "journal": "Science_Advances", "source": "Gemini", "link": "https://www.science.org/doi/abs/10.1126/sciadv.aeg0687?af=R", "authors": "Jakob Schluck, Ella Nikodem, Anton Montag, et al.", "last_authors": "Fabian Hassler, Yoichi Ando", "summary": "In the seminal proposal by Fu and Kane, the superconducting proximity effect is used to realize topological superconductivity in the topological surface state (TSS) of a 3D topological insulator (TI). In a Josephson junction made on the TI surface, the spin-momentum locking of the TSS guarantees the existence of spin nondegenerate, perfectly transmitted Andreev modes. These modes lead to gap closing as a function of the superconducting phase difference φ. Here, we report the observation of highly transmissive Andreev modes in a TI Josephson junction, probed via tunnel contacts and φ controlled by a flux loop. Within our experimental resolution, they could indicate a gap closing and reopening. This phenomenon is observed for a wide range of chemical potentials, supporting its TSS origin. Under an applied magnetic field, highly transmissive modes are observed locally, matching theoretical predictions for Josephson vortices in the TSS. Our results support the fundamental role of spin-momentum locking in the Andreev physics in the TSS.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Directly relevant to tunneling spectroscopy, STM-related physics, and topological insulators.", "tags": ["method", "material", "topologicalinsulator"], "image": "", "briefing": {"background": "3D 위상 절연체(TI)의 표면 상태는 스핀-운동량 고정(spin-momentum locking)이라는 독특한 특성을 가집니다. 이를 초전도체와 접합하면 위상 초전도성을 구현하여 마요라나 준입자를 탐색할 수 있습니다.", "motivation": "Fu-Kane 이론에 따라 위상 절연체 표면 상태의 초전도 근접 효과를 활용한 조셉슨 접합에서, 스핀-운동량 고정으로 인해 발생하는 고투과성 안드레프 결합 모드를 실험적으로 검증하고자 했습니다.", "result": "조셉슨 접합을 통해 위상 절연체 표면 상태에서 기인한 것으로 보이는 고투과성 안드레프 결합 모드를 관측했으며, 이는 위상 상전이의 징후인 갭 닫힘 및 재열림 현상을 시사합니다.", "implication": "위상 절연체 기반 조셉슨 소자에서 위상학적으로 보호된 모드들을 정밀하게 제어할 수 있음을 보여주며, 이는 위상 양자 컴퓨팅 소자 구현의 핵심적인 전 단계입니다.", "novelty": "STM/STS 계열의 터널링 분광법을 통해 TI 조셉슨 접합 내의 미시적 전자 상태를 직접 확인했다는 점에서 연구자의 관심 분야와 밀접하게 부합합니다.", "unresolved": "관측된 갭 닫힘이 위상학적 보호에 의한 것인지, 혹은 불순물이나 다른 효과에 의한 것인지에 대한 더 정밀한 위상 식별이 필요합니다.", "future_work": "위상 절연체-초전도체 접합에서의 조셉슨 와동 내부의 마요라나 모드에 대한 직접적인 분광학적 이미지 분석이 예상됩니다.", "concepts": [{"term": "안드레프 결합 모드(Andreev bound states)", "why_emerged": "초전도체-정상상태-초전도체 접합 내에서 준입자가 위상차에 의해 국소화되어 에너지가 진동하는 현상을 설명하기 위해 필요.", "origin": "A. F. Andreev (1964).", "connections": "조셉슨 효과, 위상 초전도성, 마요라나 준입자."}, {"term": "스핀-운동량 고정(Spin-momentum locking)", "why_emerged": "위상 절연체 표면에서 전자의 스핀 방향이 운동량 방향
