<title>Daily Paper Slideshow</title>
<style>
  :root {
    color-scheme: light;
    --bg: #f6f7f4;
    --paper: #ffffff;
    --ink: #111827;
    --muted: #64748b;
    --line: #d8ddd2;
    --accent: #176b87;
    --accent-2: #9a3412;
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; overflow: auto; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: var(--bg); color: var(--ink); }
  .shell { max-width: 1500px; min-height: 100vh; margin: 0 auto; padding: 14px 18px; display: flex; flex-direction: column; }
  .topbar { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 16px; }
  .top-actions { display: flex; align-items: center; gap: 10px; }
  .topbar a, button { border: 1px solid var(--line); border-radius: 8px; background: var(--paper); color: var(--ink); padding: 10px 14px; font-weight: 700; text-decoration: none; cursor: pointer; }
  button.primary { background: var(--accent); border-color: var(--accent); color: white; }
  button:disabled { opacity: 0.45; cursor: not-allowed; }
  .counter { color: var(--muted); font-weight: 700; }
  .slide { min-height: calc(100vh - 82px); background: var(--paper); border: 1px solid var(--line); border-radius: 10px; padding: 18px; box-shadow: 0 18px 42px rgba(15, 23, 42, 0.10); display: grid; grid-template-columns: minmax(310px, 0.86fr) minmax(0, 1.55fr); gap: 18px; overflow: visible; }
  .paper-head { min-width: 0; min-height: 0; overflow: visible; display: flex; flex-direction: column; gap: 12px; }
  .figure { margin: 0; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: #f8fafc; }
  .figure img { display: block; width: 100%; max-height: 41vh; object-fit: contain; background: white; }
  .figure figcaption { padding: 7px 10px; color: var(--muted); font-size: 12px; line-height: 1.3; }
  .head-text { display: flex; flex-direction: column; gap: 9px; min-width: 0; }
  .badges { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .badge { border-radius: 999px; padding: 5px 9px; background: #eef2ff; color: #3730a3; font-size: 12px; font-weight: 800; }
  .score { background: #fee2e2; color: #991b1b; }
  h1 { margin: 0; font-size: 25px; line-height: 1.15; letter-spacing: 0; overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
  h1 a { color: inherit; text-decoration-color: rgba(23, 107, 135, 0.35); text-decoration-thickness: 2px; text-underline-offset: 4px; }
  h1 a:hover { color: var(--accent); text-decoration-color: var(--accent); }
  .meta, .authors, .why, .abstract { font-size: 13px; line-height: 1.45; }
  .meta, .authors { color: var(--muted); }
  .why strong, .abstract strong, .authors strong { color: var(--ink); }
  .authors { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .why { border-left: 4px solid var(--accent-2); padding-left: 10px; color: #374151; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .abstract { border-top: 1px solid var(--line); padding-top: 14px; color: #374151; }
  .original-abstract { border-top: 1px solid var(--line); padding-top: 10px; color: #374151; font-size: 11.5px; line-height: 1.35; overflow-wrap: anywhere; }
  .original-abstract strong { display: block; margin-bottom: 4px; color: var(--ink); }
  .tags { display: flex; flex-wrap: wrap; gap: 8px; }
  .tag { border-radius: 999px; padding: 4px 8px; background: #f1f5f9; color: #475569; font-size: 12px; font-weight: 700; }
  .head-text > .link { display: none; }
  .briefing { min-width: 0; min-height: 0; overflow: visible; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); grid-auto-rows: minmax(0, auto); align-content: start; gap: 11px 18px; border-top: 0; padding-top: 0; }
  .brief-section { min-width: 0; }
  .brief-section.wide { grid-column: 1 / -1; }
  .brief-section h2 { margin: 0 0 4px; font-size: 14px; line-height: 1.22; color: #0f766e; letter-spacing: 0; }
  .brief-section p, .brief-section li { margin: 0; font-size: 12.5px; line-height: 1.42; color: #1f2937; overflow-wrap: anywhere; }
  .brief-section ul { margin: 0; padding-left: 20px; }
  .concepts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 9px 14px; }
  .concept { border-top: 1px solid var(--line); padding-top: 7px; }
  .concept h3 { margin: 0 0 4px; font-size: 13px; color: #7c2d12; letter-spacing: 0; }
  .concept p { margin: 2px 0 0; font-size: 11.5px; line-height: 1.35; color: #374151; overflow-wrap: anywhere; }
  .concept b { color: #111827; }
  .link { color: var(--accent); font-weight: 800; text-decoration: none; }
  .empty { padding: 48px; background: var(--paper); border: 1px solid var(--line); border-radius: 12px; color: var(--muted); }
  @media (max-width: 860px) {
    .shell { padding: 14px; }
    .topbar, .top-actions { align-items: stretch; flex-direction: column; }
    .slide, .briefing, .concepts { grid-template-columns: 1fr; }
    .slide { min-height: auto; overflow: visible; display: grid; }
    h1 { font-size: 28px; }
  }
</style>

const slides = [{"title": "Pressure tuning of electronic correlations and flat bands in CsCr3Sb5", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/pqbc-87xb", "authors": "Maria Chatzieleftheriou, Jonas B. Profe, Ying Li, Roser Valentí", "last_authors": "Ying Li, Roser Valentí", "summary": "${\\mathrm{CsCr}}_{3}{\\mathrm{Sb}}_{5}$ is a newly identified strongly correlated kagome superconductor, characterized by non-Fermi-liquid behavior at elevated temperatures and intertwined charge and spin density wave order below ${T}_{\\text{DW}}≈54\\phantom{\\rule{0.222222em}{0ex}}\\mathrm{K}$. Under e…", "tier": "A_MUST_READ", "score": "10", "reason": "Direct hit: kagome superconductor material analogous to AV3Sb5 series.", "tags": ["kagome", "superconductivity", "correlated"], "image": "", "briefing": {"background": "Kagome 격자 구조를 가진 금속은 위상적 전자 구조와 강한 전자 상관관계가 얽혀 나타나는 독특한 물성으로 인해 최근 응집물질물리 분야에서 매우 활발히 연구되고 있습니다.", "motivation": "CsV3Sb5로 대표되는 바나듐계 카고메 금속의 뒤를 이어, 크롬(Cr) 기반의 CsCr3Sb5가 새롭게 주목받고 있습니다. 이 물질에서 나타나는 강한 전자 상관관계와 전하/스핀 밀도파(CDW/SDW)의 특성을 압력 조절을 통해 이해하고자 합니다.", "result": "압력 변화를 통해 CsCr3Sb5의 평탄 밴드(flat bands)와 전자 상관관계의 조절 가능성을 확인하였으며, 온도에 따른 비-페르미 액체 거동과 밀도파 질서 간의 상호작용을 규명했습니다.", "implication": "바나듐계 카고메 금속과 비교했을 때 크롬 기반 시스템이 가진 고유한 상관계물리학적 특성을 밝혀내어, 새로운 양자 상태를 제어할 수 있는 가능성을 제시합니다.", "novelty": "AV3Sb5 시리즈 연구 경험을 바탕으로 할 때, 이 연구는 카고메 격자에서의 다체 물리학이 전이 금속 종류(V vs Cr)에 따라 어떻게 달라지는지를 비교 분석할 수 있는 핵심적인 데이터를 제공합니다.", "unresolved": "고압 하에서 초전도성과 밀도파 질서가 구체적으로 어떻게 경쟁하거나 공존하는지에 대한 미세한 메커니즘은 여전히 추가 연구가 필요합니다.", "future_work": "압력과 자기장 결합 실험을 통한 위상적 특성의 변화 관찰, 그리고 ARPES를 이용한 평탄 밴드의 직접적인 관측이 필요합니다.", "concepts": [{"term": "Kagome lattice", "why_emerged": "기하학적 좌절(geometric frustration)과 평탄 밴드 구조를 통해 강한 전자 상관관계와 위상적 물성을 유도하기 위해 필요함.", "origin": "수학적인 격자 개념으로 물리계에 도입되었으며, 최근 2차원 물질 및 금속에서 활발히 연구됨.", "connections": "Berry 곡률, 비정질 자기장, 위상 절연체와 밀접하게 연결됨."}, {"term": "Flat bands", "why_emerged": "에너지 분산이 거의 없는 밴드에서 전자 간의 상호작용이 극대화되어 분수 양자 홀 효과나 강상관계 초전도성을 유도하기 위해 필요함.", "origin": "카고메 및 모아레 격자 연구에서 이론적으로 강조됨.", "connections": "Strong correlation, superconductivity와 직결됨."}], "english_summary": ["CsCr3Sb5 is identified as a new strongly correlated kagome superconductor.", "The material exhibits intertwined charge and spin density wave orders at low temperatures.", "Pressure tuning modifies the electronic correlations and flat band physics.", "This provides a key comparison point to the well-studied AV3Sb5 series."]}}, {"title": "Tunable electron-plasmon coupling in the layered transition metal dichalcogenide ZrSe2−xTex", "journal": "PRB_Recent", "source": "author whitelist", "link": "http://link.aps.org/doi/10.1103/mkfk-8k2t", "authors": "Tongrui Li, Yuzhe Wang, Haoyuan Yan, et al.", "last_authors": "Donglai Feng, Juan Jiang", "summary": "Electron-plasmon coupling, in which carriers are dressed by collective electronic oscillations, represents an important many-body interaction in solids. Here, using angle-resolved photoemission spectroscopy, we report the tunable electron-plasmon coupling in the layered transition metal dichalcogeni…", "tier": "A_MUST_READ", "score": "10", "reason": "author whitelist: Donglai Feng", "tags": ["angle-resolvedphotoemission", "photoemission"], "image": "", "briefing": {"background": "전자와 플라즈몬 간의 결합(electron-plasmon coupling)은 고체 내 전하 밀도의 집단적 진동이 개별 전자 상태를 옷 입히는 현상으로, 전자-포논 결합과는 다른 고유한 다체 상호작용을 이해하는 데 중요합니다.", "motivation": "층상 전이금속 디칼코게나이드(TMDC)인 ZrSe2-xTex 시스템에서 화학적 도핑이나 조성 변화를 통해 이 전자-플라즈몬 결합을 인위적으로 조절할 수 있는지 확인하고자 합니다.", "result": "ARPES 측정을 통해 ZrSe2-xTex에서의 전자-플라즈몬 결합 강도를 직접적으로 관측하고, 조성 조절을 통해 이를 체계적으로 제어할 수 있음을 증명했습니다.", "implication": "플라즈몬 모드를 이용한 전자 상태의 엔지니어링이 가능함을 시사하며, 이는 나노 광학 및 양자 소자 개발에 중요한 기초 자료가 됩니다.", "novelty": "Donglai Feng 그룹의 정밀한 ARPES 측정 기술이 동원되었으며, 단순한 밴드 구조 연구를 넘어 동적 상호작용(collective excitations)을 제어했다는 점이 핵심입니다.", "unresolved": "특정 조성에서 왜 결합 강도가 비선형적으로 변하는지에 대한 상세한 미시적 이유는 여전히 해석의 여지가 있습니다.", "future_work": "시간 분해 ARPES 등을 활용하여 플라즈몬 결합의 동역학적 특성을 직접 시간 영역에서 관찰하는 연구가 기대됩니다.", "concepts": [{"term": "Electron-plasmon coupling", "why_emerged": "고밀도 전자계에서 전자들의 집단 진동이 단일 입자의 에너지 분산에 미치는 영향을 규명하기 위해 필요.", "origin": "다체물리학 이론의 표준 모델로 확립됨.", "connections": "ARPES 스펙트럼의 'kink' 구조 및 준입자 수명과 관련됨."}, {"term": "TMDCs", "why_emerged": "층상 구조를 통해 전자 특성을 조절하기 쉬워 2차원 소자 및 응집물질 연구의 핵심 플랫폼으로 등장.", "origin": "초기 반도체 물리학에서 연구되어 2010년대 이후 그래핀의 대안으로 부상.", "connections": "Excitonic insulator, 2D superconductivity와 연결."}], "english_summary": ["Electron-plasmon coupling is a fundamental many-body interaction in solids.", "ARPES measurements reveal tunable coupling in layered ZrSe2-xTex.", "Compositional tuning allows control over the collective electronic oscillations.", "The results offer insights into the interaction between quasiparticles and collective modes."]}}, {"title": "A Disconnected Superconducting Regime at the Parent Limit of Infinite-Layer Nickelates", "journal": "arXiv_CondMat", "source": "author whitelist", "link": "https://arxiv.org/abs/2607.16684", "authors": "Chihao Li, Yutong Chen, Yaolong Bian, et al.", "last_authors": "Rui Peng, Donglai Feng", "summary": "Infinite-layer nickelates have been widely viewed as cuprate analogs in which superconductivity emerges and forms a superconducting dome centered around 10-20% cation substitution. Here we show that pristine and stoichiometric PrNiO2, without cation substitution, exhibits intrinsic superconductivity characterized by zero resistance and diamagnetism in uncapped films. Through heterostructure engineering, we further exclude an interfacial origin of the superconductivity. Remarkably, zero-resistance superconductivity is consistently observed in trivalent-substituted PrNiO2, whereas it is rapidly suppressed by dilute divalent substitution. Combined with angle-resolved photoemission studies, these results indicate that such a new superconducting regime is confined to within 3% additional hole doping from pristine PrNiO2. Furthermore, this phase is separated from the previously estab ntifies regions with strong correlated responses in twisted bilayer MoSe2.", "The AI prioritizes a quantum-fluctuation-renormalized origin for the robust u = 1/2 crystal by systematically testing energy scales.", "This work demonstrates a closed-loop AI system capable of perception recovery, measurement choice, and mechanism attribution in complex quantum matter experiments."]}}, {"title": "Electrical Control of Altermagnetism in a Quasi-1D Magnet", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2607.16856", "authors": "Alberto M. Ruiz, Cuiju Yu, Diego L\\'opez-Alcal\\'a, Jose L. Lado, Adolfo O. Fumega, Jos\\'e J. Baldov\\'i", "last_authors": "Adolfo O. Fumega, Jos\\'e J. Baldov\\'i", "summary": "Altermagnetism is a collinear magnetic state characterized by momentum-dependent spin splitting in fully compensated materials. While widely investigated in systems governed by three- or two-dimensional exchange interactions, its extension to quasi-one-dimensional magnets remains almost unexplored. Focusing on the experimentally established AgCrP$_2$S$_6$ van der Waals magnet, we demonstrate that antiferromagnetic chains embedded in a two-dimensional lattice provide a general route to altermagnetism. Combining first-principles calculations and spin-space-group analysis, we show that out-of-plane symmetry breaking can generate a nonrelativistic d-wave spin splitting. An external out-of-plane electric field validates this mechanism, where the induced splitting increases linearly with field strength and reverses sign with field direction. We rationalize such behaviour by constructing an effective tight-binding model, which links the altermagnetic response to anisotropic third-neighbor interchain hoppings. Additionally, we show that Janus substitution also induces a d-wave spin texture, while ferroelectric interfacing with CuInP$_2$S$_6$ enables polarization-controlled spin-split bands in a fully compensated ferrimagnetic state. Our results establish quasi-one-dimensional antiferromagnets as building blocks for altermagnetism.", "tier": "A_MUST_READ", "score": "9", "reason": "Theory predicting electrical control of altermagnetism in a quasi-1D van der Waals magnet, highly relevant.", "tags": ["theory", "altermagnetism", "quasi-1D", "vanderWaals", "magnetic", "DFT"], "image": "https://arxiv.org/html/2607.16856v1/x1.png", "briefing": {"background": "알터자성(Altermagnetism)은 최근 발견된 자성 상태로, 전하 균형이 완벽하게 이루어진 물질(즉, 순 자화가 0인 물질)에서 운동량 의존적인 스핀 분리(momentum-dependent spin splitting)가 나타나는 특징을 가집니다. 이는 기존의 강자성(ferromagnetism) 및 반강자성(antiferromagnetism)과는 다른 새로운 유형의 자성 질서입니다. 주로 3D 또는 2D 물질에서 연구되어 왔습니다.", "motivation": "알터자성은 3D나 2D 교환 상호작용이 지배하는 시스템에서 주로 탐구되었지만, 준1차원(quasi-1D) 자석에서의 알터자성은 거의 연구되지 않았습니다. 이 논문은 준1차원 반강자성체가 알터자성을 발현할 수 있는지, 그리고 이를 전기적으로 제어할 수 있는지를 탐구하는 것을 목표로 합니다.", "result": "실험적으로 확립된 AgCrP$_2$S$_6$ 반데르발스 자석을 대상으로 제일원리 계산과 스핀-공간군 분석을 통해, 2차원 격자에 내장된 반강자성 사슬이 알터자성을 구현하는 일반적인 경로를 제공함을 보였습니다. 특히, 면외 대칭 깨짐(out-of-plane symmetry breaking)이 비상대론적 d-파동 스핀 분리(nonrelativistic d-wave spin splitting)를 생성할 수 있음을 입증했으며, 외부 면외 전기장이 이 스핀 분리를 선형적으로 증가시키고 방향에 따라 부호를 바꿀 수 있음을 확인했습니다. 또한, 유효 타이트-바인딩 모델을 통해 알터자성 응답이 이방성 3차 최근접 사슬 간 호핑과 관련이 있음을 밝히고, 야누스 치환(Janus substitution) 및 강유전체 인터페이스를 통해 알터자성을 유도하거나 제어할 수 있음을 제안했습니다.", "implication": "이 결과는 준1차원 반강자성체가 알터자성 재료의 새로운 빌딩 블록이 될 수 있음을 시사합니다. 특히, 전기장으로 스핀 분리를 제어할 수 있다는 것은 스핀트로닉스 및 저전력 데이터 저장 장치 개발에 있어 매우 중요한 의미를 가집니다. 독자에게 흥미로운 'altermagnetism'과 'quasi-1D materials'의 결합입니다.", "novelty": "준1차원 자석에서 알터자성 발현 가능성을 처음으로 체계적으로 탐구하고, 전기장으로 알터자성을 효과적으로 제어할 수 있는 메커니즘을 이론적으로 제시했다는 점이 새롭습니다. 독자 프로필에 언급된 'altermagnetism'과 'quasi-1D materials'에 대한 관심을 직접적으로 충족시키는 연구입니다. 기존에 3D/2D 시스템에 국한되었던 알터자성 연구의 지평을 확장합니다.", "unresolved": "이 이론적 예측이 실험적으로 AgCrP$_2$S$_6$ 또는 다른 준1차원 물질에서 검증되어야 합니다. 전기장 효과의 실제 구현 가능성, 스핀 분리의 크기, 그리고 스핀트로닉스 소자 응용을 위한 온도 안정성 등이 추가적으로 연구되어야 합니다.", "future_work": "제안된 전기장 제어 알터자성을 AgCrP$_2$S$_6$ 또는 유사한 준1차원 반데르발스 물질에서 ARPES, 스핀 분극 ARPES, 자기광학 효과 등의 실험을 통해 검증하는 것이 필수적입니다. 야누스 h nonrelativistic d-wave spin splitting.", "Crucially, an external out-of-plane electric field is shown to linearly control this spin splitting, reversing its sign with field direction.", "The mechanism is linked to anisotropic third-neighbor interchain hoppings via an effective tight-binding model.", "The findings establish quasi-1D antiferromagnets as promising building blocks for altermagnetism, with potential for electrical control in spintronic applications."]}}, {"title": "Foundry CMOS platform for multimodal quantum materials characterization", "journal": "arXiv_CondMat", "source": "author whitelist", "link": "https://arxiv.org/abs/2607.18059", "authors": "Sharad Kumar Yadav, Luca Nessi, Ondrej Dyck, et al.", "last_authors": "Dirk Englund, Jawaher Almutlaq", "summary": "Quantum materials experiments increasingly rely on microwave, electrical, thermal, optical, and structural probes, but these capabilities are typically assembled from custom hardware that limits reproducibility and scalability. Here we show that a commercial 65-nm CMOS process can be repurposed as a passive, foundry-manufacturable characterization platform by functionally partitioning its metal stack into microwave, thermal, and electrical subsystems within a 1 mm2 footprint. The integrated RF architecture enables cryogenic magnetic susceptibility measurements of Fe3GeTe2 heterostructures at 1.75 K without sample-specific fabrication. We further demonstrate NV-center optically detected magnetic resonance (ODMR) with >20% contrast at 4-9 dBm microwave power, reducing power requirements by 20-25 dB relative to conventional antenna-based approaches while maintaining sensitivities of 2-3 uT/sqrt(Hz). We additionally confirm compatibility with in-situ electron-beam imaging, showing no measurable degradation in image quality upon device operation. These results establish a scalable, foundry-manufacturable platform for multimodal quantum sensing and materials characterization.", "tier": "A_MUST_READ", "score": "9", "reason": "author whitelist: Riccardo Comin", "tags": ["heterostructure"], "image": "https://arxiv.org/html/2607.18059v1/CMOS_Figure1.png", "briefing": {"background": "양자 물질 연구는 마이크로파, 전기, 열, 광학, 구조 등 다양한 측정 프로브를 필요로 합니다. 하지만 이러한 측정 기능들은 대부분 맞춤형 하드웨어로 구성되어 재현성과 확장성(스케일링)에 한계가 있습니다.", "motivation": "맞춤형 하드웨어의 한계를 극복하고, 다양한 측정 기능을 하나의 통합된 플랫폼에서 제공하여 양자 물질 특성 분석의 재현성과 확장성을 높이는 것이 필요합니다. 상용 CMOS 공정을 활용하여 이러한 다중 모드(multimodal) 측정 플랫폼을 개발하는 것을 목표로 합니다.", "result": "상업용 65nm CMOS 공정을 재활용하여 1mm$^2$ 면적 내에서 마이크로파, 열, 전기 서브시스템으로 금속 스택을 기능적으로 분할함으로써 수동형, 파운드리 제조 가능한 특성 분석 플랫폼을 개발했습니다. 이 통합 RF 아키텍처를 통해 Fe$_3$GeTe$_2$ 헤테로구조의 극저온 자기 민감도 측정을 샘플별 제작 없이 1.75K에서 수행할 수 있었습니다. 또한 NV 중심 광학적으로 검출된 자기 공명(ODMR)에서 기존 안테나 방식 대비 20-25dB 낮은 마이크로파 전력으로 >20%의 대비를 얻었으며, 2-3uT/sqrt(Hz)의 감도를 유지했습니다. 전자 빔 이미징과의 호환성도 확인했습니다.", "implication": "이 플랫폼은 양자 물질 특성 분석을 위한 다중 모드 센싱의 재현성, 확장성 및 접근성을 크게 향상시킬 수 있습니다. 연구자들이 더 쉽고 효율적으로 다양한 물리적 특성을 동시에 측정하고, 새로운 양자 현상을 발견하는 데 기여할 수 있습니다. 독자가 관심을 가질만한 'heterostructure' 물질(Fe$_3$GeTe$_2$)을 사용하여 자성 특성을 연구했습니다.", "novelty": "상업용 CMOS 공정을 재활용하여 다중 모드 양자 물질 특성 분석 플랫폼을 개발했다는 점이 핵심적인 참신성입니다. 이는 기존의 맞춤형 하드웨어 방식의 한계를 극복하고, 파운드리 제조 가능성을 통해 플랫폼의 접근성과 확장성을 혁신적으로 개선합니다. 저전력 NV-센터 ODMR 측정 기능은 특히 주목할 만하며, 'quantum sensing' 분야에도 중요합니다. Riccardo Comin 교수가 공동 저자로 참여한 점도 독자의 주목을 받을 수 있습니다.", "unresolved": "이 플랫폼의 범용성이 어디까지인지, 즉 다른 복잡한 양자 물질 시스템(예: kagome 금속)에 대한 더 넓은 범위의 측정(예: ARPES, STM/STS)에 직접적으로 통합될 수 있는지, 또는 특정 유형의 측정에만 최적화되어 있는지에 대한 추가적인 검증이 필요합니다. 측정 가능한 에너지 스케일 범위나 샘플 유형의 제한 등도 고려해야 합니다.", "future_work": "이 CMOS 기반 플랫폼을 활용하여 더 다양한 양자 물질 시스템(예: 초전도체, 위상 물질)의 특성을 종합적으로 분석하는 연구를 수행할 수 있습니다. 플랫폼에 추가적인 센싱 모드(예: 극저온 광학 분광학)를 통합하거나, 측정 데이터의 실시간 분석 및 AI 기반 제어를 위한 기능을 개발할 수 있습니다.", "concepts": [{"term": "CMOS process (CMOS 공정)", "why_emerged": "저전력, 고집적 회로를 대량 생산하기 위한 표준화된 반도체 제조 공정으로, 디지털 및 아날로그 회로 제작에 널리 사용됩니다. 다양한 기능을 통합하고 비용 효율적인 생산을 가능하게 합니다.", "origin": "1960년대 RCA의 Frank Wanlass에 의해 처음 개발되었습니다.", "connections": "반도체 제조(Semiconductor manufacturing), 집적 회로(Integrated Circuit, IC), 파운드리(Foundry)."}, {"term": "Multimodal quantum materials characterization (다중 모드 양자 물질 특성 분석)", "why_emerged": "양자 물질의 복잡한 물리적 현상을 완전히 이해하기 위해서는 전기적, 자기적, 열적, 광학적, 구조적 특성 등 여러 측면에서 동시 또는 통합적으로 접근하여 측정할 필요가 있기 때문에 중요해졌습니다.", "origin": "초록 정보만으로는 특정하기 어려움. 여러 측정 기법의 융합 추세에서 자연스럽게 등장했습니다.", "connections": "양자 센싱(Quantum sensing), 재료 과학(Materials science), 실험 물리학(Experimental physics)."}, {"term": "Fe$_3$GeTe$_2$ heterostructures (Fe$_3$GeTe$_2$ 헤테로구조)", "why_emerged": "Fe$_3$GeTe$_2$는 2D 강자성체로, 낮은 차원에서 자성이 발현되며 전기적으로 자성을 제어할 수 있는 특성 때문에 스핀트로닉스 및 자성 메모리 소자 응용에 큰 관심을 받고 있습니다. 다른 2D 물질과 결합한 헤테로구조는 새로운 기능성을 탐색하는 데 사용됩니다.", "origin": "Fe$_3$GeTe$_2$ 자체는 2018년 이후 2D 자성체로 널리 연구되기 시작했습니다. 헤테로구조는 2D 물질 연구의 중요한 부분입니다.", "connections": "2D 자성체(2D ferromagnets), 반데르발스 헤테로구조(van der Waals heterostructures), 스핀트로닉스(Spintronics), 자기 메모리(Magnetic memory). 독자의 'van der Waals heterostructures' 관심과 연결됩니다."}, {"term": "NV-center optically detected magnetic resonance (NV 중심 광학 검출 자기 공명)", "why_emerged": "다이아몬드 내 질소-빈자리(Nitrogen-Vacancy) 결함(NV 중심)은 실온에서도 스핀 상태를 광학적으로 읽고 조작할 수 있는 특성을 가지므로, 양자 정보 처리, 생체 센싱 및 자기장 센싱을 위한 고감도 양자 센서로 활용하기 위해 개발되었습니다.", "origin": "1990년대 중반부터 NV 중심의 스핀 상태 제어가 연구되었고, 2000년대 초반부터 양자 센싱 및 정보 처리 응용이 활발해졌습니다.", "connections": "양자 센싱(Quantum sensing), 양자 자기장 측정(Quantum magnetometry), 다이아몬드 양자 기술(Diamond quantum technology), 전자 스핀 공명(Electron Spin Resonance, ESR)."}], "english_summary": ["This work presents a foundry-manufacturable, multimodal quantum materials characterization platform using a commercial 65-nm CMOS process.", "The platform functionally partitions its metal stack into microwave, thermal, and electrical subsystems within a 1 mm2 footprint.", "It enables cryogenic magnetic susceptibility measurements of Fe3GeTe2 heterostructures and low-power NV-center ODMR with high sensitivity.", "The integrated RF architecture reduces microwave power requirements by 20-25 dB compared to conventional antenna-based methods.", "These results establish a scalable and accessible platform for diverse quantum sensing and materials characterization applications."]}}, {"title": "Quantized Photocurrents in Gapless Topological Matter", "journal": "arXiv_CondMat", "source": "author whitelist", "link": "https://arxiv.org/abs/2607.12420", "authors": "Byunghoon Kim, Tenzin Norden, Mohammad Yahyavi, et al.", "last_authors": "M. Zahid Hasan, Prashant Padmanabhan", "summary": "The quantum Hall effect establishes that topology can fix a material response to integer multiples of fundamental constants when an energy gap isolates the relevant symmetry-protected electronic states. Whether such universal quantization can also emerge in gapless matter, where topological bands coexist with a continuum of metallic excitations, has remained a fundamental question in the field of quantum materials. Chiral topological semimetals provide a unique setting in which to explore this principle; when optical transitions are confined to a single chiral node, the resulting circular photogalvanic effect is predicted to be quantized by the topological charge of the node. In real materials, however, this nonlinear optical phenomenon has remained experimentally elusive, obscured by trivial band transitions, insufficient energy separation between node pairs, and their relative positions with respect to the Fermi level. Here we observe a quantized circular photogalvanic effect in the chiral topological semimetal Rh0.95Ni0.05Si. Band engineering via Ni substitution opens a photon-energy window dominated by interband optical transitions at the {\\Gamma}-point multifold node. This allows circularly polarized near- to mid-infrared pulses to drive a helicity-odd terahertz response that manifests three hallmarks of quantization: a sharp onset, a photon-energy-independent plateau governed by the magnitude of the monopole charge, and an abrupt long-wavelength cutoff imposed by Pauli blocking. Our work thus establishes an all-optical analogue of the quantum Hall effect and a new paradigm to realize topological quantization in gapless matter.", "tier": "A_MUST_READ", "score": "9", "reason": "author whitelist: M. Zahid Hasan", "tags": ["STS", "topologicalsemimetal", "quantumHall", "topological", "Halleffect"], "image": "https://arxiv.org/static/browse/0.3.4/images/arxiv-logo-fb.png", "briefing": {"background": "위상 물질은 대칭 보호된 전자 상태가 에너지 갭으로 분리되어 있을 때, 물질의 응답이 근본 상수의 정수배로 양자화되는 양자 홀 효과와 같은 흥미로운 현상을 보입니다. 이러한 위상학적 특성이 과연 밴드 갭이 없는 물질, 즉 위상 밴드가 금속성 여기 상태의 연속체와 공존하는 '갭 없는 물질(gapless matter)'에서도 나타날 수 있는지는 양자 물질 분야의 기본적인 질문으로 남아 있었습니다.", "motivation": "키랄 위상 반금속(chiral topological semimetals)은 갭 없는 물질에서 보편적인 양자화를 탐구하기에 독특한 환경을 제공합니다. 이론적으로 광학 전이가 단일 키랄 노드에 국한될 때, 원형 광갈바닉 효과(circular photogalvanic effect)는 노드의 위상 전하에 의해 양자화될 것으로 예측됩니다. 그러나 실제 물질에서는 사소한 밴드 전이, 노드 쌍 간의 불충분한 에너지 분리, 페르미 준위에 대한 상대적 위치 등으로 인해 이러한 비선형 광학 현상이 실험적으로 관찰하기 어려웠습니다.", "result": "본 연구에서는 키랄 위상 반금속 Rh0.95Ni0.05Si에서 양자화된 원형 광갈바닉 효과를 관찰했습니다. 니켈(Ni) 치환을 통한 밴드 엔지니어링을 통해 {\\Gamma}-점 다중 노드(multifold node)에서의 밴드간 광학 전이가 지배적인 특정 광자 에너지 영역을 열었습니다. 이를 통해 원형 편광된 근적외선-중적외선 펄스가 헬리시티 홀수 테라헤르츠 응답을 유도하며, 이는 날카로운 시작점, 단극 전하의 크기에 의해 결정되는 광자 에너지 독립적인 평탄부, 그리고 파울리 배제 원칙에 의해 부과되는 급격한 장파장 차단이라는 세 가지 양자화 특징을 보였습니다.", "implication": "이 결과는 갭 없는 물질에서 양자 홀 효과의 모든 광학적 유사체를 확립하고, 위상학적 양자화를 실현하기 위한 새로운 패러다임을 제시합니다. 이는 갭 없는 위상 물질의 근본적인 이해를 심화시키는 동시에, 새로운 양자 소자 개발의 가능성을 열어줍니다.", "novelty": "이 논문은 갭 없는 물질에서 양자화된 광전류를 실험적으로 명확히 관찰한 최초의 사례입니다. 특히, M. Zahid Hasan 교수의 그룹에서 나온 연구로, 위상 반금속, 양자 홀 효과, 그리고 새로운 양자 현상 탐구에 대한 연구자의 직접적인 관심사와 일치합니다. 밴드 엔지니어링을 통해 이전에 관찰하기 어려웠던 현상을 성공적으로 구현했다는 점에서 중요합니다.", "unresolved": "이 양자화된 광전류 현상이 Rh0.95Ni0.05Si 이외의 다른 키랄 위상 반금속에서도 보편적으로 나타나는지, 그리고 이 현상을 뒷받침하는 더 심층적인 이론적 설명이 필요한지는 추가 연구가 필요합니다. 또한, 불순물이나 격자 결함이 이 양자화에 미치는 영향에 대한 상세한 연구도 필요합니다.", "future_work": "향후 연구에서는 다른 키랄 위상 반금속 물질에서 유사한 양자화된 광전류를 탐색하고, 물질 조성을 최적화하여 현상 관찰에 필요한 조건을 완화할 수 있습니다. 이러한 효과를 기반으로 하는 새로운 광전자 소자, 예를 들어 고효율 테라헤르츠 검출기 또는 위상학적으로 보호된 광학 스위치를 개발하는 응용 연구가 가능할 것입니다.", "concepts": [{"term": "Quantum Hall effect (양자 홀 효과)", "why_emerged": "이 현상은 강한 자기장에서 2차원 전자 가스의 홀 전도도가 양자화된 값을 가지는 현상으로, 위상학적 개념이 응집 물질 물리학에 도입되는 계기가 되었습니다. 이는 물질의 내부 구조와는 독립적으로 위상학적 불변량에 의해 결정되는 보편적인 물리량의 존재를 보여주었습니다.", "origin": "Klaus von Klitzing이 1980년 실험적으로 발견했으며, 이에 대한 공로로 노벨 물리학상을 수상했습니다.", "connections": "위상 절연체, 위상 반금속, 베리 곡률, 카이랄성, 스핀 홀 효과 등 다양한 위상 물질 및 수송 현상 연구의 근간이 됩니다."}, {"term": "Chiral topological semimetals (키랄 위상 반금속)", "why_emerged": "이 물질들은 결정 구조가 키랄성(거울상 대칭이 없음)을 가지며, 벌크 밴드 구조에 와일(Weyl) 또는 디락(Dirac) 노드와 같은 위상학적 특징을 포함합니다. 이들은 전자들이 특정 '손대칭(handedness)'을 가지고 움직이는 독특한 수송 및 광학 현상을 나타내어, 고속 전자를 이용한 새로운 전자 소자 가능성을 제시합니다.", "origin": "초록 정보만으로는 특정하기 어려움. 하지만 와일 반금속은 1929년 Hermann Weyl이 이론적으로 예측했고, 이후 여러 물질에서 실험적으로 발견되었습니다.", "connections": "와일 반금속, 디락 반금속, 다중 노드 페르미온, 비대칭 수송 현상(non-reciprocal transport), 원형 광갈바닉 효과 등과 관련이 있습니다."}, {"term": "Circular photogalvanic effect (원형 광갈바닉 효과)", "why_emerged": "빛의 편광 상태가 물질 내 전하 수송에 영향을 미치는 현상으로, 특히 원형 편광된 빛이 물질에 비대칭적인 전류를 생성할 때 발생합니다. 이는 키랄 물질이나 스핀-궤도 결합이 강한 물질에서 스핀-운동량 커플링을 직접적으로 probing하는 방법으로 중요합니다.", "origin": "초록 정보만으로는 특정하기 어려움. 비선형 광학 현상과 물질의 대칭성에 대한 연구에서 발전했습니다.", "connections": "선형 광갈바닉 효과, 포토-드래그 효과, 스핀 전류, 위상학적 전이, 비대칭 광학 응답 등과 연관됩니다."}, {"term": "Multifold node (다중 노드)", "why_emerged": "일부 물질의 전자 밴드 구조에서 페르미 준위 근처에 여러 개의 밴드가 한 점으로 합쳐지는 경우가 있으며, 이를 '노드(node)'라고 합니다. 이 노드가 단순한 디락 노드나 와일 노드를 넘어 세 개 이상의 밴드가 교차하는 지점을 다중 노드라고 부르며, 특이한 페르미온 유사 입자(multifold fermions)를 생성하여 새로운 양자 현상을 가능하게 합니다.", "origin": "초록 정보만으로는 특정하기 어려움. 와일 페르미온과 디락 페르미온의 개념이 확장되면서 등장한 개념입니다.", "connections": "와일 노드, 디락 노드, 위상 반금속, 고차 페르미온, 비정상적인 수송 현상 등과 관련이 있습니다."}], "english_summary": ["This study experimentally observes a quantized circular photogalvanic effect in the chiral topological semimetal Rh0.95Ni0.05Si.", "Band engineering via Ni substitution enabled the isolation of interband optical transitions at the {\\Gamma}-point multifold node.", "Circularly polarized near- to mid-infrared pulses induced a helicity-odd terahertz response showing three hallmarks of quantization.", "The observed quantization is characterized by a sharp onset, a photon-energy-independent plateau determined by monopole charge, and a Pauli blocking-imposed cutoff.", "This work establishes an all-optical analogue of the quantum Hall effect, offering a new paradigm for topological quantization in gapless matter."]}}, {"title": "Unconventional superconductivity in ScIr2 chiral crystal with a kagome lattice", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2607.16689", "authors": "Keqi Xia, Jianzhou Zhao, Igor Plokhikh, et al.", "last_authors": "Toni Shiroka, Tian Shang", "summary": "Materials with a kagome lattice host exotic quantum phenomena driven by the interplay between band topology, spin-orbit coupling, magnetism, and electronic correlations. While magnetism of kagome materials has been widely investigated, their unconventional superconductivity (SC) remains largely unexplored due to the limited availability of suitable materials. Here, we report evidence of unconventional SC in the ScIr$_{2-x}$Si$_{x}$ family by combining muon-spin spectroscopy measurements with band-structure calculations. The parent ScIr$_2$ undergoes a structural phase transition from a high-$T$ cubic- to a low-$T$ rhombohedral phase, while the Ir kagome layer remains, albeit slightly distorted. Although the structural transition is suppressed by Si substitution, the superconducting pairing of ScIr$_{2-x}$Si$_{x}$ remains well described by a two-gap model. Since at least one of the gaps has nodes, this indicates an unconventional SC. Its unconventional nature can be explained by the distinct flat bands occurring near the Fermi level, leading to strong electronic correlations in the ScIr$_{2-x}$Si$_{x}$ family. Moreover, the low-$T$ phase of ScIr$_2$ exhibits an Ir chiral chain; therefore, it can be classified as a topological chiral crystal. Overall, the unusual properties of the ScIr$_{2-x}$Si$_{x}$ family make it an interesting, albeit rare, system for studying the interplay between unconventional SC, flat bands, and chirality.", "tier": "A_MUST_READ", "score": "9", "reason": "Experimental evidence of unconventional superconductivity in a kagome material with flat bands and chirality.", "tags": ["experiment", "superconductivity", "kagome", "topological", "flatband"], "image": "https://arxiv.org/html/2607.16689v1/x1.png", "briefing": {"background": "카고메(kagome) 격자 물질은 밴드 위상학, 스핀-궤도 결합, 자기적 특성 및 전자 상관관계의 상호작용에 의해 이국적인 양자 현상을 나타냅니다. 특히 카고메 물질의 자기적 특성은 활발하게 연구되어 왔지만, 적합한 물질의 제한으로 인해 이들의 비전통적인 초전도(unconventional superconductivity, SC)는 아직 충분히 탐구되지 못했습니다.", "motivation": "카고메 물질에서 비전통적인 초전도를 탐구하기 위해서는 새로운 후보 물질을 발굴하고 그 특성을 면밀히 조사하는 것이 필수적입니다. 본 연구는 ScIr2-xSix 계열 물질에서 비전통적인 초전도 증거를 찾아내고, 이 물질이 가진 카고메 격자, 평탄 밴드, 그리고 키랄성 사이의 복잡한 상호작용을 이해하고자 했습니다.", "result": "뮤온 스핀 분광학 측정과 밴드 구조 계산을 결합하여 ScIr2-xSix 계열에서 비전통적인 초전도의 증거를 발견했습니다. 모체 ScIr2는 고온의 입방정에서 저온의 마름모형 구조 전이를 겪지만, 이리듐(Ir) 카고메 층은 약간의 왜곡에도 불구하고 유지됩니다. 실리콘(Si) 치환이 구조 전이를 억제함에도 불구하고, ScIr2-xSix의 초전도 페어링은 노드를 포함하는 최소한 하나의 갭을 가진 '두-갭 모델(two-gap model)'로 잘 설명됩니다. 이는 비전통적인 초전도임을 시사합니다. 이러한 비전통적인 특성은 페르미 준위 근처에서 발생하는 뚜렷한 '평탄 밴드(flat bands)'로 설명될 수 있으며, 이는 강한 전자 상관관계를 유도합니다. 더욱이, ScIr2의 저온상은 이리듐 키랄 사슬을 나타내어 위상학적 키랄 결정으로 분류될 수 있습니다.", "implication": "이 결과는 비전통적인 초전도와 평탄 밴드, 그리고 키랄성의 상호작용을 연구하기 위한 희귀하고 흥미로운 카고메 물질 시스템을 제공합니다. 이는 카고메 물질에서 새로운 양자 현상을 탐구하는 데 중요한 이정표가 될 것입니다.", "novelty": "이 연구는 카고메 격자와 키랄성을 동시에 가지는 ScIr2-xSix 계열 물질에서 비전통적인 초전도를 발견하고 그 특성을 규명한 것으로, 사용자 연구자의 핵심 관심사인 '카고메 금속'과 '비전통적인 초전도'에 직접적으로 부합합니다. 특히, 평탄 밴드와 키랄성이 초전도에 미치는 영향을 다룬다는 점에서 중요하며, ARPES를 통한 추가적인 전자 구조 연구가 기대됩니다.", "unresolved": "이 초전도체의 정확한 페어링 대칭은 아직 명확히 밝혀지지 않았습니다. 노드를 가진 갭의 존재는 확인되었으나, 구체적인 대칭 특성을 결정하기 위한 추가적인 실험적 증거(예: 열 전도도, 핵 자기 공명)가 필요합니다. 또한, 평탄 밴드가 강한 전자 상관관계와 비전통적인 초전도를 유도하는 메커니즘에 대한 심층적인 이해가 더 필요합니다.", "future_work": "초전도 페어링 대칭을 명확히 규명하기 위한 추가적인 실험(예: ARPES, 비열, 열 전도도)이 요구됩니다. 실리콘 치환량에 따른 상 다이어그램과 초전도 특성의 변화를 체계적으로 연구하여 평탄 밴드와 키랄성의 역할을 더 자세히 밝힐 수 있습니다. 또한, 이 물질 시스템을 기반으로 새로운 카고메 초전도체를 탐색하는 연구도 진행될 수 있습니다.", "concepts": [{"term": "Kagome lattice (카고메 격자)", "why_emerged": "별 모양 육각형으로 배열된 삼각형 격자로, 고전적인 스핀 액체 후보 물질이자 플랫 밴드를 비롯한 독특한 전자 구조를 가집니다. 기하학적 좌절(geometrical frustration)과 위상학적 특성으로 인해 다양한 이국적인 양자 현상을 연구하는 데 중요한 플랫폼이 됩니다.", "origin": "일본의 전통적인 대나무 바구니 짜는 방식인 '카고메(籠目)'에서 유래했습니다.", "connections": "AV3Sb5 계열 물질(CsV3Sb5, RbV3Sb5 등), CDW, 플랫 밴드, 스핀 액체, 위상학적 초전도 등과 관련이 깊습니다."}, {"term": "Unconventional superconductivity (비전통적인 초전도)", "why_emerged": "고온 초전도체(구리 산화물, 철 기반 초전도체 등)나 중성자별 초전도체처럼 BCS 이론으로 설명할 수 없는 초전도 현상을 통칭합니다. 이들은 전자-포논 상호작용 외의 다른 메커니즘(예: 스핀 플럭츄에이션, 궤도 플럭츄에이션, 전자 상관관계)에 의해 페어링이 형성되며, 비표준적인 페어링 대칭(예: d-파동, p-파동)을 가집니다.", "origin": "1970년대 후반 중페르미온(heavy fermion) 초전도체 발견 이후 본격적으로 연구되기 시작했습니다.", "connections": "BCS 이론, 페어링 대칭(s-wave, d-wave, p-wave), 스핀 삼중항 초전도, 양자 임계점, 강상관관계 물질 등과 연관됩니다."}, {"term": "Chiral crystal (키랄 결정)", "why_emerged": "결정 구조가 거울상 대칭 조작에 대해 불변하지 않고, 그 거울상이 원본과 겹쳐지지 않는 물질을 말합니다. 이러한 키랄성은 물질 내의 전자 스핀-궤도 상호작용과 결합하여, 독특한 광학 활성, 비대칭 전하 수송, 그리고 키랄 스핀 텍스처와 같은 현상을 유발합니다.", "origin": "초록 정보만으로는 특정하기 어려움. 결정학의 대칭성 분류에서 중요한 개념입니다.", "connections": "비대칭 수송 현상(non-reciprocal transport), 키랄 자기 구조, 위상학적 초전도, 스핀-궤도 결합 등과 관련이 있습니다."}, {"term": "Flat bands (평탄 밴드)", "why_emerged": "전자 밴드 구조에서 에너지 분산이 매우 작은, 즉 전자의 운동 에너지가 거의 없는 밴드를 의미합니다. 평탄 밴드는 전자의 국재화와 강한 전자-전자 상호작용(강상관관계)을 유발하며, 이는 페로마그네티즘, 초전도, 양자 홀 효과와 같은 이국적인 양자 현상의 기원이 될 수 있습니다.", "origin": "허버드 모델(Hubbard model)과 같은 이론 모델에서 처음 제시되었으며, 이후 마법각 그래핀(magic-angle graphene), 카고메 격자, 파이로클로어(pyrochlore) 등 다양한 실제 물질에서 발견되었습니다.", "connections": "강상관관계 전자계, 모아레 초격자, 양자 자성, 초전도성, 위상학적 특성 등과 밀접하게 관련되어 있습니다."}], "english_summary": ["This study reports experimental evidence of unconventional superconductivity in the ScIr2-xSix family, which features a distorted kagome lattice and exhibits chirality.", "Muon-spin spectroscopy and band-structure calculations confirm a two-gap superconducting state, with at least one gap showing nodes, indicating unconventional pairing.", "The unconventional nature is attributed to distinct flat bands near the Fermi level, leading to strong electronic correlations.", "ScIr2's low-temperature phase is identified as a topological chiral crystal due to its Ir chiral chain.", "This system provides a rare platform to investigate the interplay between unconventional superconductivity, flat bands, and chirality in kagome materials."]}}, {"title": "Nonreciprocal Superconducting Transport from Chiral Edge States", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2607.18159", "authors": "Jin-Xing Hou, Yan-Song Song, James Jun He, Song-Bo Zhang", "last_authors": "James Jun He, Song-Bo Zhang", "summary": "Nonreciprocal superconducting transport enables dissipationless rectification and has attracted considerable interest, yet its microscopic origin is typically sought in bulk electronic states. Here, we show that boundary-controlled chiral edge states in topological systems provide a simple yet largely overlooked mechanism for nonreciprocal superconducting transport. Focusing on chiral kagome antiferromagnets, we demonstrate that out-of-plane spin canting or spin-orbit coupling opens a high-Chern-number bulk gap, giving rise to multiple chiral edge modes. Strikingly, sublattice-dependent boundary termination selects a single-valley character for the edge states, leading to asymmetric edge spectra at opposite edges. This boundary asymmetry directly yields observable nonreciprocal signatures in Josephson junctions oriented transverse to the edges, including asymmetric Andreev spectra, Josephson diode effect, and anomalous Fraunhofer interference patterns. These findings broaden the microscopic understanding of superconducting nonreciprocity and highlight boundary engineering as a tunable route toward superconducting diode devices.", "tier": "B_IMPORTANT_CONDMAT", "score": "10", "reason": "Directly relevant to kagome antiferromagnet research, TRSB, and transport diagnostics.; demoted from A: broad CM, not direct user/project hit", "tags": ["material", "topic"], "image": "https://arxiv.org/html/2607.18159v1/Fig1_BigPicture.png", "briefing": {"background": "비대칭 초전도 수송(nonreciprocal superconducting transport)은 전력 손실 없이 정류(rectification) 기능을 가능하게 하여 큰 관심을 받아왔습니다. 그러나 그 미시적 기원은 주로 벌크 전자 상태에서 찾아져 왔으며, 경계면 제어 키랄 에지 상태(boundary-controlled chiral edge states)의 역할은 크게 간과되어 왔습니다.", "motivation": "비대칭 초전도 수송의 새로운 미시적 기원을 찾고, 특히 위상학적 시스템에서 경계면 제어 키랄 에지 상태가 초전도 비대칭성에 어떻게 기여할 수 있는지 탐구하는 것이 중요합니다. 본 연구는 키랄 카고메 반강자성체(chiral kagome antiferromagnets)에 초점을 맞춰 이러한 메커니즘을 밝히고자 합니다.", "result": "본 연구는 키랄 카고메 반강자성체에서 면외 스핀 캔팅(out-of-plane spin canting) 또는 스핀-궤도 결합이 높은 Chern 수 벌크 갭을 열어 다중 키랄 에지 모드를 생성함을 보였습니다. 놀랍게도, 부격자(sublattice) 의존적인 경계면 종결(boundary termination)은 에지 상태에 '단일 계곡(single-valley)' 특성을 부여하여, 반대쪽 에지에서 비대칭적인 에지 스펙트럼을 유도합니다. 이러한 경계면 비대칭성은 에지에 수직으로 놓인 조셉슨 접합(Josephson junctions)에서 비대칭 Andreev 스펙트럼, 조셉슨 다이오드 효과(Josephson diode effect), 그리고 비정상적인 Fraunhofer 간섭 패턴을 포함한 관찰 가능한 비대칭 신호로 직접 나타납니다.", "implication": "이러한 발견은 초전도 비대칭성에 대한 미시적 이해를 넓히고, '경계면 엔지니어링(boundary engineering)'이 초전도 다이오드 소자를 구현하기 위한 조절 가능한 경로임을 강조합니다.", "novelty": "이 연구는 키랄 카고메 반강자성체에서 경계면 제어 키랄 에지 상태가 비대칭 초전도 수송을 유도하는 새로운 메커니즘을 제시합니다. 이는 사용자 연구자가 관심을 가지는 '카고메 반강자성체', 'TRSB(시간 역전 대칭 깨짐)', '자기적 위상 물질'과 직접적으로 연관되며, ARPES나 STM/STS를 통한 에지 상태 관측 가능성을 시사합니다. 조셉슨 다이오드 효과와 같은 실질적인 장치 응용 가능성도 제시합니다.", "unresolved": "이러한 이론적 예측이 실제 키랄 카고메 반강자성체에서 실험적으로 검증되어야 합니다. 또한, 실제 물질에서 불순물이나 결함이 이러한 경계면 유도 비대칭성에 미치는 영향에 대한 상세한 연구가 필요합니다.", "future_work": "실험적으로 키랄 카고메 반강자성체에서 이러한 비대칭 조셉슨 효과를 탐색하고, 다양한 경계면 조건을 가진 샘플을 제작하여 에지 상태의 특성을 조절하는 연구가 진행될 수 있습니다. 이론적으로는 다른 위상학적 시스템이나 자기 구조에서도 유사한 비대칭 수송 현상을 예측하는 연구가 가능합니다.", "concepts": [{"term": "Nonreciprocal superconducting transport (비대칭 초전도 수송)", "why_emerged": "일반적으로 전기 수송은 방향에 관계없이 대칭적이지만, 특정 물질에서는 전류 방향에 따라 저항이나 전도도가 달라지는 비대칭성이 나타날 수 있습니다. 특히 초전도체에서 이러한 비대칭성이 발생하면, 손실 없이 한 방향으로만 전류를 흐르게 하는 '조셉슨 다이오드 효과'와 같은 혁신적인 소자를 만들 수 있어 큰 관심을 받게 되었습니다.", "origin": "초록 정보만으로는 특정하기 어려움. 비대칭 물리학(non-Hermitian physics)과 응집 물질 물리학의 교차점에서 발전했습니다.", "connections": "조셉슨 다이오드 효과, 스핀-궤도 결합, 시간 역전 대칭 깨짐(TRSB), 키랄성, Weyl 또는 Dirac 반금속 등과 관련이 있습니다."}, {"term": "Chiral edge states (키랄 에지 상태)", "why_emerged": "위상학적 물질에서 벌크는 절연체이지만 경계면에서는 전도성이 나타나는 상태를 에지 상태라고 합니다. 특히 키랄 에지 상태는 한 방향으로만 전하가 흐르는 양자화된 경로를 형성하며, 이는 불순물이나 결함에 의한 산란에 강건하여 무손실 수송을 가능하게 합니다. 양자 홀 효과의 핵심적인 특징 중 하나입니다.", "origin": "양자 홀 효과 연구에서 처음으로 중요한 개념으로 부각되었습니다.", "connections": "양자 홀 효과, 위상 절연체, Weyl 반금속, 자기 위상 물질, 위상학적 초전도체 등과 관련이 있습니다."}, {"term": "Kagome antiferromagnets (카고메 반강자성체)", "why_emerged": "카고메 격자는 기하학적 좌절(geometrical frustration)을 강하게 유발하여 특이한 자기 상태를 형성합니다. 이러한 격자에 반강자성 상호작용이 있는 스핀이 놓이면, 고전적인 네엘(Néel) 질서가 형성되지 않고 스핀 액체, 스핀 아이스 또는 비정상적인 스핀 질서와 같은 이국적인 자기 상태가 나타날 수 있습니다. 최근에는 이들 중 일부가 위상학적 특성과 결합하여 Weyl 반금속 특성을 보이는 등 주목받고 있습니다.", "origin": "초록 정보만으로는 특정하기 어려움. 카고메 격자와 반강자성 연구에서 발전했습니다.", "connections": "기하학적 좌절, 스핀 액체, 위상학적 자성체, Weyl 반금속, Anomalous Hall 효과, AV3Sb5 계열 물질 등과 깊은 관련이 있습니다."}, {"term": "Josephson diode effect (조셉슨 다이오드 효과)", "why_emerged": "일반적인 다이오드가 전기적 정류 기능을 하는 것처럼, 초전도체에서도 전력 손실 없이 전류를 한 방향으로만 흐르게 하는 '초전도 다이오드'에 대한 요구가 있었습니다. 조셉슨 다이오드 효과는 조셉슨 접합에서 전류-위상 관계가 비대칭적이 되어 발생하는 현상으로, 양자 컴퓨팅 및 초전도 전자 장치에 대한 새로운 가능성을 제시합니다.", "origin": "2020년대 들어 비대칭 초전도 연구의 활성화와 함께 실험적으로도 관찰되기 시작했습니다.", "connections": "조셉슨 접합, 비대칭 초전도 수송, 시간 역전 대칭 깨짐(TRSB), 스핀-궤도 결합, 양자 소자 등과 관련이 있습니다."}], "english_summary": ["This theoretical study proposes boundary-controlled chiral edge states as a novel mechanism for nonreciprocal superconducting transport.", "In chiral kagome antiferromagnets, spin canting or spin-orbit coupling opens a high-Chern-number bulk gap, creating multiple chiral edge modes.", "Sublattice-dependent boundary termination selects single-valley edge states, leading to asymmetric edge spectra at opposite edges.", "This boundary asymmetry directly results in observable nonreciprocal signatures in Josephson junctions, including asymmetric Andreev spectra and the Josephson diode effect.", "The findings broaden the un 7의 ARPES 및 광학 전도도 측정에서 관찰되는 독특한 전자 구조적 특징들이 다중 오비탈 허버드 모델에서 어떻게 발생하는지 이론적으로 설명하고자 합니다.", "result": "이차원 이층(bilayer) 모델에서 궤도 선택적(orbital-selective) 상관관계가 z2 궤도 간 층간 스핀 일중항(interlayer spin singlet)을 형성함을 확인했습니다. 이는 실험에서 관찰되는 강한 전자 밴드 재규격화와 밴드 갈라짐 현상을 성공적으로 설명합니다.", "implication": "La3Ni2O7의 정상 상태 전자 구조를 이해함으로써, 니켈계 고온 초전도체의 강상관 초전도 메커니즘을 일반화할 수 있는 이론적 기반을 마련했습니다.", "novelty": "특정 궤도에서의 상관관계가 에너지 스케일을 결정하는 방식을 제시하여, ARPES 데이터와 이론 간의 불일치를 해소하는 물리적 그림을 제공합니다.", "unresolved": "이 모델이 초전도 상태에서의 구체적인 페어링 대칭성과 그 기원을 완전히 포괄하는지에 대해서는 추가 연구가 필요합니다.", "future_work": "제안된 궤도 선택적 상관관계가 어떻게 구체적인 초전도 전이온도와 페어링 대칭성을 유도하는지에 대한 미시적 모델링이 뒤따를 것으로 보입니다.", "concepts": [{"term": "Orbital-selective correlation", "why_emerged": "다중 궤도를 가진 강상관 계에서 각 궤도별 전자 이동도가 달라지는 현상을 설명하기 위해 도입됨.", "origin": "Anisimov et al. (2002) 등에 의해 제안됨.", "connections": "Mott 전이, Hund's metal 물리와 밀접하게 연관됨."}, {"term": "Bilayer Ni-based superconductor", "why_emerged": "La3Ni2O7이 고압에서 80K 초전도를 보임에 따라 새로운 고온 초전도 플랫폼으로 부상함.", "origin": "Sun et al. (Nature, 2023).", "connections": "cuprates의 d-wave 초전도성과 대조 및 비교 연구 중."}], "english_summary": ["Addresses the multiorbital electron correlations in La3Ni2O7 using a bilayer two-orbital Hubbard model.", "Identifies orbital-selective correlations leading to interlayer spin singlets in z2 orbitals.", "Provides a theoretical basis explaining observed ARPES band renormalization and splitting features.", "Offers insights into the normal state and superconducting mechanism of multilayer nickelates."]}}, {"title": "Quantum-metric-driven light-induced ferrovalley state in d-wave altermagnets", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2607.17049", "authors": "Shihao Zhang", "last_authors": "Shihao Zhang", "summary": "Isolating the quantum metric from the Berry curvature remains a central challenge in quantum materials, as the two geometric quantities nearly always coexist and their contributions are difficult to disentangle. We show that d-wave alterma
