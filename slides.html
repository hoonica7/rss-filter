.org/doi/10.1103/qv9w-x78v", "authors": "Xiaoying Xu, Wei Qin, Yuelin Shen, et al.", "last_authors": "Zirao Wang, Yufan Li", "summary": "Chiral superconductivity is a novel superconducting phase characterized by order parameters that break time-reversal symmetry, endowing the state with a definite handedness. Unlike conventional superconductors, the Cooper pairs in a chiral superconductor carry nonzero orbital angular momentum. Throu…", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Explores chiral superconductivity and time-reversal symmetry breaking in mesoscopic systems, a relevant topic.", "tags": ["superconductivity", "chiral", "time-reversalsymmetrybreaking", "mesoscopicphysics"], "image": "", "briefing": {"background": "카이랄 초전도체(Chiral Superconductor)는 시간 반전 대칭성(TRS)을 자발적으로 깨뜨리는 상태로, 초전도 페어링이 0이 아닌 궤도 각운동량을 가집니다.", "motivation": "메조스코픽(Mesoscopic) 규모의 시스템에서 카이랄 초전도성의 특징적인 징후를 실험적으로 포착하고자 합니다.", "result": "메조스코픽 초전도체에서 시간 반전 대칭성 깨짐(TRSB)과 연결된 카이랄 초전도 질서 변수(Order parameter)의 징후를 확인했습니다.", "implication": "초전도체의 위상적 성질과 자성(Magnetism)이 결합된 새로운 물리 상태를 제어할 수 있는 가능성을 시사합니다.", "novelty": "메조스코픽 스케일에서의 정밀한 물리량 측정을 통해 카이랄 페어링의 실험적 증거를 제시했습니다.", "unresolved": "관측된 신호가 순수한 카이랄 초전도성인지, 아니면 불순물이나 공간적 비균질성에 의한 국소적 효과인지에 대한 엄밀한 구분이 필요합니다.", "future_work": "국소적 프로브(예: STS)를 이용한 위상적 에지 상태 확인 및 위상 초전도체 후보 물질로의 확장 연구.", "concepts": [{"term": "Chiral Superconductivity", "why_emerged": "표준적인 BCS 이론을 넘어선 이색적인 초전도 페어링 상태를 기술하기 위해.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "Time-Reversal Symmetry Breaking (TRSB), Topological superconductivity."}, {"term": "Mesoscopic Physics", "why_emerged": "양자역학적 효과가 거시적 물리와 만나는 중간 영역의 물리 현상을 이해하기 위해.", "origin": "20세기 후반 반도체 나노구조 기술 발전과 함께 확립.", "connections": "Quantum interference, Aharonov-Bohm effect."}], "english_summary": ["Investigates the signatures of chiral superconductivity in mesoscopic devices.", "Identifies evidence for time-reversal symmetry breaking in the superconducting state.", "Connects non-zero orbital angular momentum of Cooper pairs to experimental observables.", "Offers insights into characterizing topological superconducting phases."]}}, {"title": "Preferred synthesis of armchair transition metal dichalcogenide nanotubes", "journal": "Science", "source": "Gemini", "link": "https://doi.org/10.1126/science.aeh1429", "authors": "Abid, Luneng Zhao, Ju Huang, et al.", "last_authors": "Huayong Yang, Rong Xiang", "summary": "Nanotubes represent an important class of crystalline materials, but controlling their structures, particularly chiralities, remains a fundamental challenge. In this work, we report a strategy for synthesizing transition metal dichalcogenide nanotubes with preferred armchair chirality. Tin disulfide, molybdenum disulfide, and tungsten disulfide nanotubes were formed with high yield and structural purity inside boron nitride nanotube channels. Atomic-resolution imaging, electron diffraction, and circular dichroism revealed an armchair preference up to 83%. Density functional theory ruled out structural stability as the origin of this preference but confirmed that zigzag nanoribbons are energetically more stable. Machine learning potential molecular dynamics simulated that zigzag nanoribbons roll up to form armchair nanotubes, a process that was subsequently observed by in situ transmission electron microscope. This work may inspire the achievement of on-demand synthesis of various nanotubes with specific chiralities.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Synthesis and characterization of 1D TMDC nanotubes with controlled chirality, relevant to 2D materials.", "tags": ["nanotubes", "TMDCs", "1Dmaterials", "synthesis", "spectroscopy", "chirality"], "image": "", "briefing": {"background": "나노튜브(Nanotube)는 구조적 카이랄성(Chirality)에 따라 전기적, 광학적 특성이 크게 변하지만, 원하는 카이랄성만 선택적으로 합성하는 것은 오랫동안 큰 난제였습니다.", "motivation": "Boron Nitride(BN) 나노튜브 채널을 템플릿으로 사용하여 전이금속 디칼코게나이드(TMDC) 나노튜브의 카이랄성을 정밀하게 제어하고자 합니다.", "result": "BN 나노튜브 내에서 SnS2, MoS2, WS2 나노튜브를 합성하여 암체어(Armchair) 구조를 83%의 높은 수율로 얻는 데 성공했습니다.", "implication": "구조적 카이랄성이 제어된 1차원 나노 물질을 대량으로 합성할 수 있게 되어, 나노 소자 제작 및 물리적 연구에 큰 진전이 예상됩니다.", "novelty": "에너지 안정성이 더 높은 지그재그 구조 대신 암체어 구조가 선호되는 메커니즘을 기계학습 기반 동역학 시뮬레이션으로 규명했습니다.", "unresolved": "왜 템플릿 내부에서 암체어 구조가 우세한지에 대한 근본적인 에너지 경합 메커니즘을 추가적인 이론적 보강이 필요합니다.", "future_work": "다양한 종류의 다른 TMDC에 대한 확장 연구 및 카이랄성에 따른 광전자 특성 정밀 분석.", "concepts": [{"term": "Armchair Chirality", "why_emerged": "나노튜브의 원자 배열 방향을 분류하여 물성을 특정하기 위해.", "origin": "탄소 나노튜브(CNT) 연구 초기 1990년대.", "connections": "Zigzag chirality, Chiral vector, Carbon nanotubes."}, {"term": "TMDCs", "why_emerged": "그래핀과 같은 2D 물질을 넘어 밴드갭 엔지니어링이 가능한 층상 물질 연구 필요성.", "origin": "1960년대 층상 구조물 연구.", "connections": "Van der Waals heterostructures, 2D semiconductors."}], "english_summary": ["Reports a strategy for synthesizing TMDC nanotubes with preferred armchair chirality.", "Uses boron nitride nanotubes as channels to control the growth of SnS2, MoS2, and WS2.", "Achieves up to 83% armchair preference confirmed by atomic imaging and circular dichroism.", "Uncovers the growth mechanism where zigzag nanoribbons roll into armchair nanotubes using ML-MD simulations."]}}, {"title": "Room-temperature multiferroicity in all–van der Waals heterostructures", "journal": "Science", "source": "Gemini", "link": "https://doi.org/10.1126/science.adq0420", "authors": "Qinqin Wang, Baojuan Xin, Chen Liu, et al.", "last_authors": "Evgeny Y. Tsymbal, Cheng Gong", "summary": "Multiferroics host simultaneous and coupled ferroic orders, allowing disparate external stimuli to induce abrupt transformations in their structures and properties. Creating multiferroicity in two-dimensional (2D) van der Waals (vdW) platforms would add the elements of strong quantum confinement, enhanced quasiparticle excitations, and wide tunability to the capabilities of these systems. In this work, we constructed vdW heterostructures of ferromagnetic triiron gallium ditelluride (Fe 3 GaTe 2 ) and ferroelectric copper indium thiophosphate (CuInP 2 S 6 ) to integrate their respective orders. We observed strong interferroic coupling at room temperature by demonstrating ferroelectrically reconfigurable magnetic anisotropy of 2D Fe 3 GaTe 2 . The interferroic magnetoelectricity diminished with increasing Fe 3 GaTe 2 thickness, revealing the interfacial nature of heterostructure multiferroicity. Our discovery of all-vdW heterostructure multiferroicity opens the door to the artificial assembly of vdW layers for designer 2D multiferroics.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Demonstrates room-temperature multiferroicity in van der Waals heterostructures, relevant for 2D magnetic/topological materials.", "tags": ["vanderWaalsheterostructures", "2Dmaterials", "multiferroicity", "ferromagnetism"], "image": "", "briefing": {"background": "다강체(Multiferroics)는 강유전성과 강자성 등의 서로 다른 질서가 공존하며 이들이 결합된 물질로, 외부 자극을 통해 물리적 특성을 제어할 수 있어 차세대 정보 소자 후보로 연구됩니다. 이를 2D 반데르발스 이종접합 구조로 구현하면 양자 구속 효과와 넓은 튜닝 범위를 활용할 수 있습니다.", "motivation": "2D 층상 구조 물질을 적층하여 실온에서 작동하는 다강성 이종접합 시스템을 인공적으로 설계하고, 자성-강유전 결합(interferroic coupling)을 입증하고자 했습니다.", "result": "강자성체인 Fe3GaTe2와 강유전체인 CuInP2S6를 결합하여 실온에서 강유전 제어를 통해 Fe3GaTe2의 자기 이방성을 재구성하는 데 성공했습니다. 이 효과가 두께에 의존적임을 보임으로써 계면 현상임을 확인했습니다.", "implication": "이종접합 설계를 통해 실온 다강성 소자를 구현하는 전략을 제시했으며, 이는 자성 2D 물질의 스핀 자유도를 비휘발성 메모리 등에 활용할 수 있는 가능성을 열어줍니다.", "novelty": "기존 물질에서 보기 힘들던 실온에서의 강한 자성-강유전 결합을 2D 반데르발스 계면에서 실현했다는 점이 핵심입니다. 특히 자성 위상 물질이나 자기적 위상 변화를 연구하는 분야에 중요한 플랫폼을 제공합니다.", "unresolved": "계면 결합의 정확한 물리적 기작 및 다양한 다른 2D 자성 물질과의 호환성, 그리고 스케일업을 위한 대면적 합성법은 여전히 해결해야 할 과제입니다.", "future_work": "다른 2D 위상 자성 물질과의 조합 연구 및 나노 소자 기반의 구체적인 자기소자 구현 실험이 예상됩니다.", "concepts": [{"term": "Multiferroics", "why_emerged": "하나의 물질에서 전기적/자기적 제어를 동시에 수행하여 정보 저장 효율을 극대화하기 위해 필요함.", "origin": "20세기 초반 제안되었으나 2000년대 이후 산화물 기반으로 집중 연구됨.", "connections": "스핀트로닉스, 자기-전기 효과, 위상 자성체 연구와 밀접함."}, {"term": "Interferroic coupling", "why_emerged": "이종접합 구조에서 각 층의 질서가 서로 영향을 주고받는 결합 메커니즘을 규명하기 위해 필요.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "근접 효과(Proximity effect) 및 계면 물리학과 연결됨."}], "english_summary": ["Demonstrated room-temperature multiferroicity in an all-vdW heterostructure.", "Combined Fe3GaTe2 and CuInP2S6 to achieve ferroelectric control of magnetic anisotropy.", "The coupling is identified as an interfacial effect, decreasing with Fe3GaTe2 thickness.", "Provides a design paradigm for 2D artificial multiferroic devices."]}}, {"title": "Ultralong sheathed single-metal-atom chains synthesized under high pressure", "journal": "Science", "source": "Gemini", "link": "https://doi.org/10.1126/science.aeg0028", "authors": "Jie Zhang, Xiao Dong, Shengchao Qiu, et al.", "last_authors": "Haiyan Zheng, Kuo Li", "summary": "Single-metal-atom chains (SMACs) represent the ultimate limit of one-dimensional nanostructures. They serve as archetypal model systems for condensed matter physics and constitute fundamental building blocks for next-generation nanoelectronics. However, synthesis of SMACs suitable for practical applications remains challenging. In this work, we create micrometer-long, carbon-sheathed copper SMACs at milligram scale by compressing β-copper phthalocyanine to above 21 gigapascals. The SMACs are in atom-scale ordering, are isolable through acid-assisted exfoliation, and exhibit exceptional stability, with Cu-Cu distance confined at 2.57 angstroms. Anisotropic conductance and antiferromagnetic interactions are suggested by experimental and computational results. This work establishes a universal synthetic strategy for sheathed SMACs, positioning them as a compelling platform for prospective electronic and spintronic applications.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "1D nanostructures with antiferromagnetic interactions, relevant to nanoelectronics and quasi-1D materials.", "tags": ["1Dmaterials", "nanostructures", "antiferromagnetism", "condensedmatter", "synthesis"], "image": "", "briefing": {"background": "단일 금속 원자 사슬(SMAC)은 1차원 나노 구조의 극한을 나타내며, 양자 역학적 특성 및 준1차원적 물리 현상을 연구하는 모델 시스템으로 중요합니다.", "motivation": "기존에 합성하기 어려웠던 금속 원자 사슬을 대량으로, 그리고 높은 안정성을 가지고 합성할 수 있는 보편적인 전략을 개발하고자 했습니다.", "result": "고압(21 GPa 이상) 환경에서 프탈로시아닌을 압축하여 탄소 외피로 보호된 구리 SMAC를 합성했습니다. 2.57 옹스트롬의 Cu-Cu 거리를 유지하며 안정적인 1차원 구조를 보였고, 이방성 전도도와 반강자성 상호작용의 가능성을 확인했습니다.", "implication": "안정적인 1차원 금속 체인을 대량 합성할 수 있게 되어 준1차원 물질 연구 및 스핀트로닉스 소자 응용이 가속화될 것으로 보입니다.", "novelty": "압력을 이용해 구조를 안정화하는 전략이 독창적이며, 특히 준1차원 물질이나 스핀 분리(spin-charge separation) 연구에 활용 가능한 플랫폼을 제공합니다.", "unresolved": "합성된 사슬의 구체적인 전자 구조 및 스핀-전하 분리 현상에 대한 직접적인 ARPES/STS 증거가 필요합니다.", "future_work": "합성된 SMAC의 나노 소자 제작 및 온도에 따른 자기적 전이 측정 연구.", "concepts": [{"term": "SMAC", "why_emerged": "물질의 가장 낮은 차원에서 나타나는 고유한 물리적 현상을 탐구하기 위함.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "준1차원 물질, 럿팅거 액체, 나노 스핀트로닉스."}, {"term": "Beta-copper phthalocyanine", "why_emerged": "금속 원자 사슬을 구조적으로 감싸고 안정화하는 탄소 기반 전구체로 활용.", "origin": "합성 화학 분야에서 오랜 역사를 가짐.", "connections": "유기 반도체 및 나노 구조체 합성법과 연결됨."}], "english_summary": ["Synthesized micrometer-long copper SMACs using high-pressure compression of phthalocyanine.", "The chains are carbon-sheathed, stable, and exhibit 1D atomic ordering.", "Evidence suggests anisotropic conductance and antiferromagnetic interactions.", "Provides a universal synthesis strategy for 1D nanostructured metal chains."]}}, {"title": "Multidimensional spectro-temporal imaging of exciton dynamics under propagating acoustic strain in two-dimensional semiconductors", "journal": "Science_Advances", "source": "Gemini", "link": "https://doi.org/10.1126/sciadv.aef5458", "authors": "Yuta Takahashi, Takumi Yamamoto, Hidetoshi Kanzawa, et al.", "last_authors": "Shinichi Watanabe, Shun Fujii", "summary": "Dynamic strain offers a promising route to manipulate tightly bound excitons in two-dimensional semiconductors. Its impact, however, has so far been inferred primarily from time-averaged or spatially integrated measurements. In particular, for dynamic strain driven by surface acoustic waves (SAWs), the relatively small strain amplitude and competing piezoelectric effects have hindered direct access to the real-time evolution of exciton emission energy and recombination dynamics within a single acoustic cycle. Here we report a fully phase-synchronized, multidimensional spectro-temporal-spatial visualization of exciton emission in monolayer tungsten diselenide driven by propagating SAWs. By integrating phase-resolved microscopy and interferometric surface displacement measurements, we achieve simultaneous mapping of exciton emission energy, photoluminescence intensity, linewidth, and decay dynamics and directly correlate them with the dynamic strain field. Our work establishes propagating acoustic strain as a powerful platform for deterministic exciton control and provides a comprehensive framework for exploring nonequilibrium exciton dynamics in low-dimensional materials.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Spectroscopy of exciton dynamics in 2D monolayer semiconductors under strain.", "tags": ["2Dmaterials", "excitons", "spectroscopy", "strainengineering", "WSe2"], "image": "", "briefing": {"background": "2D 반도체에서 엑시톤은 빛과 물질의 상호작용을 지배하는 핵심 요소입니다. 동적 변형(dynamic strain)은 이 엑시톤의 에너지를 제어하는 방법으로 주목받고 있지만, 초고속 과정에서의 동역학을 직접 관찰하는 것은 기술적으로 매우 어렵습니다.", "motivation": "표면 탄성파(SAW)로 유도된 동적 변형 하에서 엑시톤의 방출 에너지와 재결합 역학을 단일 음향 주기 내에서 실시간으로 관찰하고자 했습니다.", "result": "위상 동기 현미경과 변위 측정을 결합하여 WSe2 단층의 엑시톤 방출 에너지, 강도, 선폭, 붕괴 역학을 시공간적으로 동시 매핑하는 데 성공했습니다.", "implication": "동적 변형을 통해 엑시톤을 확정적으로 제어할 수 있는 프레임워크를 마련했으며, 저차원 물질의 비평형 동역학 연구에 강력한 도구를 제공합니다.", "novelty": "기존의 시간 평균 방식에서 벗어나, SAW 주기에 맞춘 실시간 다차원 분광 이미징을 구현하여 엑시톤-격자 상호작용의 상세 정보를 얻었습니다.", "unresolved": "변형이 엑시톤의 위상적 성질이나 밸리(valley) 분극에 미치는 구체적인 영향은 향후 추가 연구가 필요합니다.", "future_work": "다른 2D 물질로의 확장 및 엑시톤 응축 또는 위상적 엑시톤 거동 탐구.", "concepts": [{"term": "SAW (Surface Acoustic Waves)", "why_emerged": "물질 표면에 정밀한 기계적 변형을 주기적으로 인가하기 위해 필요함.", "origin": "레일리파 연구에서 유래.", "connections": "음향광학 소자 및 변형 엔지니어링과 연결됨."}, {"term": "Exciton dynamics", "why_emerged": "광학 소자 응용을 위해 여기자의 생성과 재결합 과정을 제어하고 이해해야 하기 때문.", "origin": "반도체 물리 초기 단계에서 개념화됨.", "connections": "반도체 광학, 엑시톤-폴라리톤, 밸리트로닉스."}], "english_summary": ["Developed a multidimensional spectro-temporal-spatial imaging technique for 2D excitons.", "Used propagating SAW to induce and track dynamic strain in monolayer WSe2.", "Achieved real-time mapping of exciton emission dynamics within a single acoustic cycle.", "Establishes acoustic strain as a platform for deterministic exciton control."]}}, {"title": "Altermagnetic memcapacitors", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2608.19476", "authors": "Martin Latorre (Departamento de Fisica, CEDENNA, FCFM, et al.", "last_authors": "Chile), Alvaro S. Nunez (Departamento de Fisica", "summary": "We propose a spintronic memcapacitance effect based upon altermagnetic multiferroic materials. We identify the rare-earth vanadates RVO$_3$ as a concrete platform, with all key parameters tied to measured properties. Under an oscillating electric field, the resulting charge and spin currents trace pinched hysteresis loops that close tangentially at zero field -- the hallmark of memcapacitive, type-2 memdevice behavior -- with charge current densities exceeding, by a factor of about 3.6, the lowest deterministic switching current density reported for optimized spin-transfer-torque magnetic tunnel junctions. We model the system theoretically as a dimerized two-orbital $d$-wave altermagnetic lattice via a Su--Schrieffer--Heeger-type bond modulation, in the spirit of the spin-dependent Rice--Mele model, thereby coupling the altermagnetic order to field-switchable charge and spin polarizations. The associated polarization loops close tangentially at zero field and yield a sign-changing, history-dependent ``butterfly'' differential capacitance, identifying the device as a genuine memcapacitor. Both responses are protected by the same inversion symmetry, so charge and spin channels switch simultaneously with no separate control needed. These results establish altermagnetic multiferroics, realized concretely in RVO$_3$, as an efficient, non-volatile platform for combined electric and spintronic memory.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Altermagnetism is a key interest for the user.", "tags": ["altermagnet", "spintronics"], "image": "https://arxiv.org/html/2608.19476v1/model.png", "briefing": {"background": "알터마그네틱(Altermagnetism)은 기존의 강자성이나 반강자성과는 구별되는 새로운 자기 위상으로, 결정 대칭성에 의해 스핀 분할이 발생하는 비상대론적 스핀 구조를 의미하며 차세대 스핀트로닉스의 핵심 후보입니다.", "motivation": "알터마그네틱 물질인 RVO3 희토류 바나데이트를 활용하여, 전압으로 자기적 상태와 전하 상태를 동시에 제어할 수 있는 저전력, 비휘발성 memcapacitor 소자를 설계하고자 함.", "result": "Rice-Mele 모델에 기반한 이론적 모델링을 통해 RVO3가 전계에 따라 pinched hysteresis 루프를 보이는 memcapacitor 특성을 가짐을 증명함. 이는 기존 spin-transfer-torque(STT) 소자보다 약 3.6배 더 낮은 결정적 스위칭 전류 밀도를 보임.", "implication": "알터마그네틱 다강체(multiferroics)가 전하와 스핀 정보를 전기적으로 제어 가능한 비휘발성 메모리 플랫폼으로서 실용적 가치가 매우 높음을 입증함.", "novelty": "알터마그네틱의 대칭성 보호 특성을 이용하여 별도의 제어 채널 없이 전하와 스핀이 동시에 스위칭되는 효율적인 소자 구조를 제안함.", "unresolved": "실제 실험적 소자 제작 및 저온/상온에서의 스위칭 안정성에 대한 검증이 필요함.", "future_work": "RVO3 박막을 활용한 실제 전기적 특성 측정과 고주파 스위칭 성능 평가.", "concepts": [{"term": "Altermagnetism", "why_emerged": "강자성과 반강자성 사이의 새로운 자기 정렬 방식으로, 스핀 분할이 대칭성으로 인해 실현됨.", "origin": "초근 수 년간 이론적으로 정립 및 실험적 증거가 발견됨.", "connections": "반강자성체, 스핀트로닉스, 비상대론적 스핀 분할."}, {"term": "Memcapacitor", "why_emerged": "가해진 전기적 이력에 따라 정전용량이 변하는 비선형 소자로서 메모리 효율을 높이기 위함.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "Memristor, 비휘발성 메모리, 스핀트로닉 소자."}, {"term": "Rice-Mele model", "why_emerged": "격자 변조와 전하 밀도 파(CDW)를 결합한 시스템에서 위상적 특성을 이해하기 위함.", "origin": "1982년 M.J. Rice와 E.J. Mele가 제안.", "connections": "Su-Schrieffer-Heeger(SSH) 모델, 위상 절연체."}], "english_summary": ["Proposes RVO3 altermagnetic multiferroics as a platform for memcapacitive devices.", "Demonstrates that charge and spin currents can be controlled simultaneously by oscillating electric fields.", "Predicts lower switching current densities compared to optimized STT magnetic tunnel junctions.", "Establishes a robust theoretical framework using a modified Rice-Mele model for altermagnetic lattices."]}}, {"title": "Effects of the surface on double surface Fermi arcs in a realistic tight-binding model of Na3Bi (100)", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2608.20115", "authors": "Vasilios K. Passias, Lucas K. Wagner", "last_authors": "Vasilios K. Passias, Lucas K. Wagner", "summary": "Na$_3$Bi is a topological Dirac semimetal (TDSM) that can support double surface Fermi arcs (DSFAs), which are important for its material classification and their potential use in spintronic devices. However, it is unclear how the surfaces affect realistic Na$_3$Bi (100) systems. To investigate the effects of diverse surfaces on DSFAs, we consider first principles derived tight-binding models of two Na$_3$Bi (100) terminations. On the stoichiometric termination, we find DSFAs as expected. On the non-stoichiometric structure there are DSFAs on one termination and two loops that retain many of the properties of DSFAs. Thus, the local properties such as spin momentum locking and hybridization with the Dirac points appear to be more robust than their global connectivity. That is, the surface can reshape the arc fingerprint without destroying the arc-like physics.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Realistic modeling of surface Fermi arcs in a prominent Dirac semimetal relevant for ARPES studies.", "tags": ["Diracsemimetal", "Na3Bi", "Fermiarcs"], "image": "https://arxiv.org/html/2608.20115v1/fig1WSM_DSM_bulk_slab_Fermi_Arcs.png", "briefing": {"background": "위상적 디락 반금속(TDSM)인 Na3Bi는 표면에 나타나는 페르미 아크(Fermi arc)로 유명하며, 이는 물질의 위상적 분류와 스핀트로닉스 응용에 매우 중요한 역할을 합니다.", "motivation": "Na3Bi (100) 표면의 종단(termination) 방식에 따라 이론적으로 예측된 이중 표면 페르미 아크(DSFA)가 얼마나 견고하게 유지되는지 정밀하게 분석하고자 함.", "result": "화학양 n splitting and opposite sector Chern numbers, while the combined $C_{4z}\\mathcal T$ symmetry enforces a vanishing total charge Chern number. We show that this hidden topological structure can be activated by orbital-selective magnetic coupling and independently tuned by ferroelectric orbital hybridization. The magnetic coupling removes the sector cancellation and generates $C=\\pm1$ and $\\pm2$ phases, whereas the polar distortion shifts the Dirac gap closing away from high-symmetry momenta and enables electrical transitions such as $C=0\\rightarrow-1$ and $C=1\\rightarrow2$. The resulting phases exhibit the expected chiral edge-state multiplicity and quantized anomalous Hall conductivity. Their topology is further reflected in the orbital magnetization through the in-gap relation $\\partial_\\mu \\widetilde M_z=-C$. Finally, we show that the Chern phases remain robust against transverse Kramers-sector mixing and symmetry-allowed inversion-asymmetric spin--orbit coupling. These results establish a symmetry-based route to electrically tunable Chern insulating phases in compensated altermagnets.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Topological theory combining altermagnetism, Chern insulators, and ferroelectricity in 2D systems.", "tags": ["theory", "altermagnetism", "topological-insulator"], "image": "https://arxiv.org/html/2606.11862v2/figure1_reference.png", "briefing": {"background": "2차원 물질에서 위상적 비자명성을 가진 Chern insulator는 양자 변칙 홀 효과를 나타내며, 이를 전기적으로 제어하는 것은 차세대 논리 소자의 핵심 과제입니다.", "motivation": "알터마그네틱(d-wave) 대칭성을 가진 2차원 시스템에서 자기장과 강유전성 왜곡을 통해 Chern 수(Chern number)를 전기적으로 제어하는 메커니즘을 규명하고자 함.", "result": "알터마그네틱의 스핀 분할 밴드 구조가 자기적 결합과 강유전성 궤도 혼성화를 통해 위상적으로 재구성될 수 있음을 보임. 특정 강유전성 왜곡을 통해 Chern 수를 0에서 1, 또는 1에서 2로 천이시키는 것이 가능함.", "implication": "알터마그네틱 위상 절연체가 정적 상태가 아니라 전기적으로 동적 제어가 가능한 플랫폼임을 제시함.", "novelty": "상쇄된 알터마그네틱 상태에서 대칭성 기반의 접근 방식을 통해, 외부 필드 없이(또는 약한 자기장하에) Chern 위상을 스위칭할 수 있는 경로를 제안함.", "unresolved": "이러한 현상이 발현되는 구체적인 후보 물질군의 선정과 실제
