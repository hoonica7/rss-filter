<!DOCTYPE html>

<meta charset='UTF-8'>
<meta name='viewport' content='width=device-width, initial-scale=1.0'>
<title>Daily Paper Slideshow</title>
<style>
  :root {
    color-scheme: light;
    --bg: #f6f7f4;
    --paper: #ffffff;
    --ink: #111827;
    --muted: #64748b;
    --line: #d8ddd2;
    --accent: #176b87;
    --accent-2: #9a3412;
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; overflow: auto; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: var(--bg); color: var(--ink); }
  .shell { max-width: 1500px; min-height: 100vh; margin: 0 auto; padding: 14px 18px; display: flex; flex-direction: column; }
  .topbar { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 16px; }
  .top-actions { display: flex; align-items: center; gap: 10px; }
  .topbar a, button { border: 1px solid var(--line); border-radius: 8px; background: var(--paper); color: var(--ink); padding: 10px 14px; font-weight: 700; text-decoration: none; cursor: pointer; }
  button.primary { background: var(--accent); border-color: var(--accent); color: white; }
  button:disabled { opacity: 0.45; cursor: not-allowed; }
  .counter { color: var(--muted); font-weight: 700; }
  .slide { min-height: calc(100vh - 82px); background: var(--paper); border: 1px solid var(--line); border-radius: 10px; padding: 18px; box-shadow: 0 18px 42px rgba(15, 23, 42, 0.10); display: grid; grid-template-columns: minmax(310px, 0.86fr) minmax(0, 1.55fr); gap: 18px; overflow: visible; }
  .paper-head { min-width: 0; min-height: 0; overflow: visible; display: flex; flex-direction: column; gap: 12px; }
  .figure { margin: 0; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: #f8fafc; }
  .figure img { display: block; width: 100%; max-height: 41vh; object-fit: contain; background: white; }
  .figure figcaption { padding: 7px 10px; color: var(--muted); font-size: 12px; line-height: 1.3; }
  .head-text { display: flex; flex-direction: column; gap: 9px; min-width: 0; }
  .badges { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .badge { border-radius: 999px; padding: 5px 9px; background: #eef2ff; color: #3730a3; font-size: 12px; font-weight: 800; }
  .score { background: #fee2e2; color: #991b1b; }
  h1 { margin: 0; font-size: 25px; line-height: 1.15; letter-spacing: 0; overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
  h1 a { color: inherit; text-decoration-color: rgba(23, 107, 135, 0.35); text-decoration-thickness: 2px; text-underline-offset: 4px; }
  h1 a:hover { color: var(--accent); text-decoration-color: var(--accent); }
  .meta, .authors, .why, .abstract { font-size: 13px; line-height: 1.45; }
  .meta, .authors { color: var(--muted); }
  .why strong, .abstract strong, .authors strong { color: var(--ink); }
  .authors { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .why { border-left: 4px solid var(--accent-2); padding-left: 10px; color: #374151; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .abstract { border-top: 1px solid var(--line); padding-top: 14px; color: #374151; }
  .original-abstract { border-top: 1px solid var(--line); padding-top: 10px; color: #374151; font-size: 11.5px; line-height: 1.35; overflow-wrap: anywhere; }
  .original-abstract strong { display: block; margin-bottom: 4px; color: var(--ink); }
  .tags { display: flex; flex-wrap: wrap; gap: 8px; }
  .tag { border-radius: 999px; padding: 4px 8px; background: #f1f5f9; color: #475569; font-size: 12px; font-weight: 700; }
  .head-text > .link { display: none; }
  .briefing { min-width: 0; min-height: 0; overflow: visible; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); grid-auto-rows: minmax(0, auto); align-content: start; gap: 11px 18px; border-top: 0; padding-top: 0; }
  .brief-section { min-width: 0; }
  .brief-section.wide { grid-column: 1 / -1; }
  .brief-section h2 { margin: 0 0 4px; font-size: 14px; line-height: 1.22; color: #0f766e; letter-spacing: 0; }
  .brief-section p, .brief-section li { margin: 0; font-size: 12.5px; line-height: 1.42; color: #1f2937; overflow-wrap: anywhere; }
  .brief-section ul { margin: 0; padding-left: 20px; }
  .concepts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 9px 14px; }
  .concept { border-top: 1px solid var(--line); padding-top: 7px; }
  .concept h3 { margin: 0 0 4px; font-size: 13px; color: #7c2d12; letter-spacing: 0; }
  .concept p { margin: 2px 0 0; font-size: 11.5px; line-height: 1.35; color: #374151; overflow-wrap: anywhere; }
  .concept b { color: #111827; }
  .link { color: var(--accent); font-weight: 800; text-decoration: none; }
  .empty { padding: 48px; background: var(--paper); border: 1px solid var(--line); border-radius: 12px; color: var(--muted); }
  @media (max-width: 860px) {
    .shell { padding: 14px; }
    .topbar, .top-actions { align-items: stretch; flex-direction: column; }
    .slide, .briefing, .concepts { grid-template-columns: 1fr; }
    .slide { min-height: auto; overflow: visible; display: grid; }
    h1 { font-size: 28px; }
  }
</style>

<script>
const slides = [{"title": "Direct Visualization of Gate-Tunable Flat Bands in Twisted Double Bilayer Graphene", "journal": "PRL_Recent", "source": "author whitelist", "link": "http://link.aps.org/doi/10.1103/3vg5-vkzy", "authors": "Souvik Sasmal, Ryan Muzzio, Ahmed Khalifa, et al.", "last_authors": "Shubhayu Chatterjee, Jyoti Katoch", "summary": "Author(s): Souvik Sasmal, Ryan Muzzio, Ahmed Khalifa, Paulina Majchrzak, Alfred J. H. Jones, I-Hsuan Kao, Kenji Watanabe, Takashi Taniguchi, Simranjeet Singh, Eli Rotenberg, Aaron Bostwick, Chris Jozwiak, Søren Ulstrup, Shubhayu Chatterjee, and Jyoti Katoch The evolution of moiré minibands under varying carrier density and displacement field may be directly visualized using microfocused angle-resolved photoemission spectroscopy. [Phys. Rev. Lett. 137, 016402] Published Tue Jun 30, 2026", "tier": "A_MUST_READ", "score": "10", "reason": "author whitelist: Eli Rotenberg", "tags": ["angle-resolvedphotoemission", "photoemission", "graphene", "moir", "twisted", "flatband"], "image": "", "briefing": {"background": "트위스티드 이층 그래핀(TDBG) 시스템은 층간 각도와 전기장(변위장)을 조절하여 모아레 미니밴드(moiré minibands)의 구조를 제어할 수 있는 대표적인 밴드 엔지니어링 플랫폼입니다.", "motivation": "이론적으로 예측된 평탄 밴드(flat bands)와 그에 따른 강상관 현상을 실제 실험적으로 시각화하고, 외부 게이트 전압을 통한 밴드 구조의 가변성을 직접 확인하고자 함입니다.", "result": "마이크로-ARPES를 사용하여 변위장과 전하 밀도 변화에 따른 모아레 미니밴드의 전개를 성공적으로 직접 관측했습니다.", "implication": "트위스티드 이층 그래핀에서 강상관 전자 상태를 제어하기 위한 실험적 파라미터 최적화 가이드라인을 제시합니다.", "novelty": "기존의 수송 현상 측정 위주의 연구를 넘어, 모아레 밴드의 실제 에너지-운동량 분산 관계를 직접적으로 시각화했다는 점이 중요합니다.", "unresolved": "특정 도핑 구간에서의 정밀한 다체 상태의 성질과 평탄 밴드 내의 국소적 전자 상관관계의 상세 기원은 여전히 추가 탐색이 필요합니다.", "future_work": "보다 넓은 위상 공간에서의 도핑 제어를 통한 초전도 및 절연 상태와의 상관관계 규명 연구가 예상됩니다.", "concepts": [{"term": "Moiré minibands", "why_emerged": "이층 구조의 격자 불일치로 발생하는 긴 주기의 간섭 효과가 전자 에너지를 분할하기 때문.", "origin": "전형적인 다층 그래핀 물리학에서 잘 확립됨.", "connections": "트위스티드 이층 그래핀(TBG), 강상관 물리학."}, {"term": "Micro-ARPES", "why_emerged": "미세한 모아레 도메인 내부를 분석하기 위해 나노/마이크로미터 단위의 빔 스폿 크기가 필요했기 때문.", "origin": "Eli Rotenberg 그룹 등의 싱크로트론 기술 발전.", "connections": "ARPES, 트위스티드 전자공학."}], "english_summary": ["Micro-ARPES is utilized to visualize moiré minibands in twisted double bilayer graphene.", "The study demonstrates direct control of minibands via displacement fields and carrier density.", "This work provides critical experimental verification for flat-band engineering in moiré systems."]}}, {"title": "Nodeless superconducting gap and electron-boson coupling in (La,Pr,Sm) 3 Ni 2 O 7 films", "journal": "Science", "source": "Gemini", "link": "https://doi.org/10.1126/science.adw8329", "authors": "Jianchang Shen, Guangdi Zhou, Yu Miao, et al.", "last_authors": "Junfeng He, Zhuoyu Chen", "summary": "The discovery of superconductivity in Ruddlesden-Popper bilayer nickelate films under ambient pressure provides an opportunity to directly investigate electronic energy scales of the superconducting state and the pairing mechanism. We report angle-resolved photoemission spectroscopy measurements of superconducting (La,Pr,Sm) 3 Ni 2 O 7 thin films by developing an ultrahigh-vacuum cryogenic sample quenching and transfer technique. A superconducting gap of ~18 milli–electron volts with coherence peaks is observed along the Brillouin zone diagonal. The finite gap persists across the entire Brillouin zone, revealing the absence of gap nodes. A kink is observed in the energy-momentum dispersion at ~70 milli–electron volts below the Fermi level, indicating an electron-boson coupling. The simultaneous observation of a nodeless superconducting gap and electron-boson coupling provides insight into the pairing symmetry and gluing mechanism in Ruddlesden-Popper bilayer nickelates.", "tier": "A_MUST_READ", "score": "10", "reason": "ARPES study of unconventional superconductivity in nickelates, a direct interest.", "tags": ["ARPES", "nickelate", "unconventionalsuperconductivity"], "image": "", "briefing": {"background": "니켈레이트(Nickelates)는 구리 산화물(Cuprates)과 유사한 전자 구조를 가져 고온 초전도체 후보군으로 주목받으며, 특히 층상 구조 니켈레이트에서의 초전도 매커니즘 규명이 핵심 과제입니다.", "motivation": "Ruddlesden-Popper 구조의 니켈레이트 박막에서 초전도 갭의 구조와 전자-보손 결합(electron-boson coupling)을 확인하여 고온 초전도의 기원을 밝히고자 했습니다.", "result": "ARPES를 통해 밴드 다이아고널 방향에서 노드(node)가 없는 ~18 meV 크기의 초전도 갭을 관측했으며, ~70 meV 지점에서 킹(kink) 구조를 확인했습니다.", "implication": "니켈레이트의 초전도 갭이 전 영역에서 열려 있다는 점은 풀 갭(full gap) 초전도체일 가능성을 시사하며, 이는 기존의 d-파동 초전도체와는 다른 매커니즘일 수 있음을 보여줍니다.", "novelty": "박막 샘플의 극저온 퀜칭 기술을 통해 니켈레이트의 초전도 전자 상태를 직접적으로 관측한 매우 드문 사례입니다.", "unresolved": "관측된 킹 구조가 포논(phonon)에 의한 것인지, 혹은 스핀 요동(spin fluctuations)에 의한 것인지에 대한 정확한 기원은 결론짓지 못했습니다.", "future_work": "다양한 도핑 및 층수에 따른 갭 구조의 변화와 자기장에 따른 위상학적 변화 추적이 필요합니다.", "concepts": [{"term": "Nodeless superconducting gap", "why_emerged": "초전도 대칭성을 결정하기 위해 갭의 영점이 존재하는지 확인하는 것이 필수적이기 때문.", "origin": "BCS 이론 이후 초전도체 분류의 표준 방식.", "connections": "d-파동 초전도, 강상관 전자계."}, {"term": "Electron-boson coupling", "why_emerged": "전자들이 어떻게 쌍을 이루어 초전도를 형성하는지 매개체를 파악하기 위해 필요함.", "origin": "Eliashberg 이론 등.", "connections": "ARPES 킹 현상, 포논, 스핀 요동."}], "english_summary": ["ARPES measurements on superconducting nickelate films reveal a nodeless superconducting gap.", "A kink in the dispersion suggests strong electron-boson coupling at ~70 meV.", "The findings provide key constraints on the pairing symmetry and mechanism in bilayer nickelates."]}}, {"title": "Realization of strongly correlated 2D honeycomb boron", "journal": "Science_Advances", "source": "author whitelist", "link": "https://doi.org/10.1126/sciadv.aee3116", "authors": "Takemi Kato, Tomonori Nakamura, Kosuke Nakayama, et al.", "last_authors": "Yoshinori Okada, Takafumi Sato", "summary": "Borophene, a two-dimensional (2D) boron sheet, has recently gained considerable attention as a postgraphene material owing to its unique properties, such as intrinsic metallic character, lightest element monolayer structure, and high-frequency phonons. These features, together with its theoretically predicted high density of states, make borophene an excellent platform for investigating various quantum phenomena. However, the realization of emergent phenomena is hindered by fabrication challenges and inherently weak electronic correlations within the s and p electron system. Here, we demonstrate a strongly correlated 2D electronic state derived from a honeycomb boron lattice exposed at the surface of ternary boride LaRh 3 B 2 . Using angle-resolved photoemission spectroscopy, we uncover the extended saddle-point van Hove singularity near the Fermi level, which is linked to the substantial lattice expansion and many-body interaction. Moreover, scanning tunneling microscopy reveals the electronic nematicity, which likely originates from the saddle-point instability. Our findings open a pathway to exploring the exotic correlated phenomena in boron-based 2D systems.", "tier": "A_MUST_READ", "score": "10", "reason": "author whitelist: Takafumi Sato", "tags": ["angle-resolvedphotoemission", "photoemission", "scanningtunneling", "nematic", "graphene", "monolayer", "correlated", "phonon"], "image": "", "briefing": {"background": "보로펜(Borophene)은 그래핀 이후의 차세대 2D 소재로 주목받으나, 제작의 어려움과 약한 전자 상관관계가 한계점으로 지적되어 왔습니다.", "motivation": "LaRh3B2 표면의 육각 붕소 격자를 이용해 강한 상관관계가 유도된 2D 전자 상태를 구현하고 이를 검증하고자 했습니다.", "result": "ARPES를 통해 페르미 준위 근처의 확장된 안장점 반-호브 특이점(Saddle-point vHs)을 확인했고, STM으로 전자 네마틱(electronic nematicity) 현상을 관측했습니다.", "implication": "보로펜 시스템에서도 강상관 전자 현상 및 네마틱 질서와 같은 비전통적 물성이 발현될 수 있음을 증명했습니다.", "novelty": "붕소 기반 시스템에서 안장점 특이점과 네마틱성을 동시에 보고한 연구로, 보로펜 물리학을 강상관 영역으로 확장했습니다.", "unresolved": "네마틱 질서가 격자 왜곡에 의한 것인지, 혹은 순수 전자적인 상관관계(Electronic instability)에 의한 것인지에 대한 명확한 구분이 필요합니다.", "future_work": "온도 변화에 따른 네마틱-등방성 상전이 연구 및 외부 응력(Strain)을 통한 밴드 제어 연구가 기대됩니다.", "concepts": [{"term": "Van Hove singularity", "why_emerged": "전자 상태 밀도(DOS)가 발산하는 점으로, 여기서 페르미 준위가 위치할 때 강한 다체 효과가 발생하기 때문.", "origin": "Leon Van Hove (1953).", "connections": "강상관 전자계, 네마틱 상전이."}, {"term": "Electronic nematicity", "why_emerged": "회전 대칭성은 깨져 있으나 병진 대칭성은 유지되는 상태를 정의하기 위해 도입됨.", "origin": "고온 초전도체 연구에서 철 기반 초전도체 등에서 확립.", "connections": "불연속적 대칭성 깨짐, 강상관 전자계."}], "english_summary": ["A strongly correlated 2D boron honeycomb lattice is realized on the surface of LaRh3B2.", "ARPES reveals extended saddle-point van Hove singularities near the Fermi level.", "STM demonstrates electronic nematicity, highlighting potential for exotic quantum phenomena in boron sheets."]}}, {"title": "Phonon-induced pseudogap phase in TiSe2", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2606.31298", "authors": "Sotirios Fragkos, Nina Girotto Erhardt, Evgenia Symeonidou, et al.", "last_authors": "Samuel Beaulieu, Dino Novko", "summary": "arXiv:2606.31298v1 Announce Type: new Abstract: To comprehend quantum ordered states, such as charge density waves (CDW), in layered transition metal dichalcogenides (TMDCs), it is essential to uncover their underlying normal states. Here, we use time- and angle-resolved extreme ultraviolet photoemission spectroscopy and ab initio electron-phonon calculations to perform excited state band mapping of three prototypical 1T TMDCs, i.e., TiSe$_2$, HfTe$_2$, and ZrTe$_2$, at room temperature. The results reveal the profound impact of strong electron-phonon-induced thermal fluctuations on the normal-phase electronic structure. Specifically, in the moderate electron-phonon coupling regime, as in HfTe$_2$ and ZrTe$_2$, thermal fluctuations only lead to small spectral broadening and band renormalization. In the strongly coupled case, exemplified by TiSe$_2$, we observe soft-phonon-induced, momentum-dependent suppression of spectral weight, i.e., pseudogaps - extending up to 1 eV above the Fermi level. Our work establishes the normal phase of TiSe$_2$ as a phonon-induced pseudogap phase governed by strong CDW fluctuations, thereby uncovering previously missing aspects of the TiSe$_2$ phase diagram, with broader implications for other TMDCs in the strong electron-phonon coupling regime.", "ti m Soori We predict a field-free transverse Josephson diode effect in altermagnets (AMs) with Rashba spin-orbit coupling, achieving diode efficiencies exceeding $3000%$ and unidirectional transverse supercurrents in four-terminal junctions. In this geometry, a longitudinal phase bias generates transverse sup… [Phys. Rev. B 113, 245433] Published Mon Jun 29, 2026", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Altermagnetism is a priority interest; prediction of a giant diode effect is experimentally relevant.", "tags": ["theory", "altermagnetism", "superconductivity"], "image": "", "briefing": {"background": "알터자성체(Altermagnetism)는 최근 자성학계의 큰 화두로, 스핀 축퇴가 없으면서도 순자화가 0인 독특한 자기 질서 상태를 의미합니다.", "motivation": "알터자성체의 대칭성 특징이 초전도 다이오드 효과(Josephson diode effect)와 어떻게 결합하여 전하 수송의 비대칭성을 극대화할 수 있는지 탐구합니다.", "result": "라쉬바 스핀-궤도 결합을 포함하는 알터자성체 접합에서 외부 자기장 없이도 3000% 이상의 효율을 가진 거대한 횡방향 조셉슨 다이오드 효과가 나타남을 예측했습니다.", "implication": "알터자성체가 비휘발성 저전력 초전도 소자 및 논리 회로 구현에 있어 기존 강자성체나 반강자성체를 대체할 강력한 후보임을 시사합니다.", "novelty": "알터자성체의 고유한 대칭성을 이용해 외부 자기장 없이 거대 다이오드 효과를 유도했다는 점은 소자 응용 측면에서 매우 혁신적입니다.", "unresolved": "이론적인 다이오드 효율 수치는 이상적인 조건에서의 계산값으로, 실제 접합부의 계면 거칠기나 불순물이 미치는 영향은 추가 검증이 필요합니다.", "future_work": "이러한 현상을 관측하기 위한 RuO2 등 알터자성 박막을 기반으로 한 초전도 접합 소자 제작 및 저온 전류-전압 특성 측정.", "concepts": [{"term": "알터자성체(Altermagnetism)", "why_emerged": "기존 강자성/반강자성 구분으로 설명되지 않는 새로운 자기 질서를 설명하기 위해 필요.", "origin": "2022년 Šmejkal et al. (PRX) 등에 의해 이론적 기반 마련.", "connections": "스핀-궤도 토크, 위상 수송, 비대칭 스핀 구조."}, {"term": "조셉슨 다이오드 효과", "why_emerged": "초전도체 소자에서 전류의 방향에 따라 임계 전류가 달라지는 정류 작용을 구현하기 위해 대두.", "origin": "2020년 안도 등(Ando et al.)에 의해 초전도체/위상절연체 접합에서 실험적으로 관측.", "connections": "초전도성, 시간반전대칭성 깨짐, 조셉슨 접합."}], "english_summary": ["Prediction of a giant field-free transverse Josephson diode effect in altermagnets.", "Exceeds 3000% efficiency using Rashba spin-orbit coupling.", "Demonstrates high potential for energy-efficient superconducting spintronic devices.", "Highlights the utility of altermagnetic symmetry in controlling transverse supercurrents."]}}, {"title": "Kondo effect in ferromagnetic quantum critical CeRh6Ge4", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/6w55-56wk", "authors": "Martin Sundermann, Joe D. Thompson, Eric D. Bauer, et al.", "last_authors": "Gertrud Zwicknagl, Andrea Severing", "summary": "Author(s): Martin Sundermann, Joe D. Thompson, Eric D. Bauer, Chun-Fu Chang, Sheng-Huai Chen, Chang-Yang Kuo, Liu Hao Tjeng, Gertrud Zwicknagl, and Andrea Severing The nature of cerium’s 4 f electron is key to understanding the mechanism of pressure-induced quantum criticality in the heavy-fermion ferromagnet CeRh 6 Ge 4 . Combining core-level photoemission and polarized x-ray absorption spectroscopy with simulations based on the single-impurity Anderson model, the authors demonstrate here that Kondo hybridization admixes higher-lying crystal field states into a multiorbital ground state with a 4 f occupancy n f ~ 0.9, which also accounts for the dynamical spin response. The results establish the importance of Kondo hybridization and the resulting multiorbital ground state as essential components for a model of quantum criticality. [Phys. Rev. B 113, 245149] Published Mon Jun 29, 2026", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Core-level photoemission study of heavy-fermion ferromagnetism and Kondo hybridization.", "tags": ["photoemission", "heavyfermion", "Kondo"], "image": "", "briefing": {"background": "CeRh6Ge4와 같은 중페르미온(heavy-fermion) 물질은 저온에서 자기적 질서와 초전도성이 경쟁하거나 공존하며 양자 임계 현상을 보이는 대표적인 강상관 전자계 시스템입니다. 4f 전자의 국소성과 전도 전자의 혼성화(Kondo effect)가 물리적 특성을 결정하는 핵심 기작입니다.", "motivation": "압력에 의해 유도되는 CeRh6Ge4의 양자 임계 현상에서 세륨 4f 전자의 전자 구조적 역할이 불분명했습니다. 특히 Kondo 혼성화가 다중 궤도(multiorbital) 기저 상태와 양자 임계성에 어떻게 기여하는지 규명하고자 했습니다.", "result": "핵심 준위 광전자 분광법(Core-level PES)과 편광 X선 흡수 분광법(XAS)을 통해, Kondo 혼성화가 높은 에너지의 결정장(crystal field) 상태를 기저 상태에 섞어 넣는다는 것을 확인했습니다. 이는 Ce 4f 점유율(nf ~ 0.9)을 결정하며 동역학적 스핀 응답을 설명합니다.", "implication": "이 연구 결과는 Kondo 혼성화와 다중 궤도 기저 상태가 양자 임계점을 기술하는 이론 모델에 필수적인 요소임을 입증합니다. 향후 중페르미온 물질의 양자 임계성 연구에서 전자 구조 모델을 정밀화하는 기준이 될 것입니다.", "novelty": "단순한 단일 불순물 앤더슨 모델을 넘어 실질적인 결정장 상태를 반영한 다중 궤도 모델을 제시함으로써 중페르미온의 복잡한 물리 현상을 분광학적으로 뒷받침했습니다.", "unresolved": "4f 전자들의 양자 임계성 근처에서의 미세한 다체 효과가 전체 페르미 면(Fermi surface) 재구성에 미치는 정밀한 상관관계는 아직 논의의 여지가 있습니다.", "future_work": "압력을 가한 상태에서의 더 정밀한 광전자 분광법 혹은 중성자 산란 실험을 통해 Kondo 혼성화에 의한 페르미 면의 변화를 관측할 것으로 예상됩니다.", "concepts": [{"term": "Kondo 혼성화", "why_emerged": "국소 자기 모멘트가 전도 전자와 상호작용하여 저온에서 기저 상태를 변화시키는 현상을 기술하기 위해 도입되었습니다.", "origin": "Jun Kondo (1964), 이후 Anderson 격자 모델로 발전.", "connections": "중페르미온 물질, Doniach 위상도."}, {"term": "단일 불순물 앤더슨 모델 (SIAM)", "why_emerged": "금속 내 국소 4f/5f 오비탈과 전도대 간의 혼성화를 계산하기 위한 표준 모델로 필요했습니다.", "origin": "Philip W. Anderson (1961).", "connections": "Kondo 효과, 다체 물리, 분광학적 시뮬레이션."}], "english_summary": ["The study investigates the 4f electron nature in heavy-fermion ferromagnet CeRh6Ge4.", "Core-level PES and XAS confirm that Kondo hybridization admixes higher-lying crystal field states.", "The results show a multiorbital ground state with 4f occupancy nf ~ 0.9.", "This provides critical insights into the mechanism of pressure-induced quantum criticality."]}}, {"title": "Quasiparticle interference in LiFeAs: Signature of inelastic tunneling through spin fluctuations", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/6s6t-5396", "authors": "Shun Chi, Carolina A. Marques, W. N. Hardy, et al.", "last_authors": "S. A. Burke, Peter Wahl", "summary": "Author(s): Shun Chi, Carolina A. Marques, W. N. Hardy, Ruixing Liang, Pinder Dosanjh, D. A. Bonn, S. A. Burke, and Peter Wahl Quasiparticle interference (QPI) is a powerful tool to characterize the symmetry of the superconducting order parameter in unconventional superconductors, by mapping the spatial dependence of elastic tunneling of electrons between the tip of a scanning tunneling microscope and a sample. Here, we con… [Phys. Rev. B 113, 235148] Published Wed Jun 24, 2026", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "STM/STS study on unconventional superconductor LiFeAs, mapping electronic structure through QPI.", "tags": ["STM", "LiFeAs", "superconductivity"], "image": "", "briefing": {"background": "철 기반 초전도체(FeSC)에서 초전도 질서 변수(order parameter)의 대칭성과 그 기원(스핀 요동 등)을 밝히는 것은 강상관 초전도 분야의 핵심 과제입니다.", "motivation": "LiFeAs의 초전도 상태에서 준입자 간섭(QPI)을 통해 산란 과정을 분석하고, 스핀 요동에 의한 비탄성 터널링 신호를 명확히 포착하고자 했습니다.", "result": "STM/STS를 이용하여 LiFeAs의 QPI 패턴을 측정하고, 초전도 질서 변수의 대칭성에 부합하는 준입자 산란 경로를 시각화했습니다. 특히 비탄성 터널링 신호가 스핀 요동과 연관되어 있음을 시사하는 데이터를 얻었습니다.", "implication": "철 기반 초전도체에서 흔히 제기되는 '스핀 요동 매개 초전도' 모델에 대한 강력한 실험적 증거를 제공합니다. 이는 LiFeAs와 같은 시스템의 페르미 면 구조와 상호작용을 이해하는 데 중요한 기점입니다.", "novelty": "단순한 정적 전자 구조 측정을 넘어, 비탄성 터널링을 통해 스핀 요동이라는 역학적 기원을 STM 단계에서 직접적으로 다루었다는 점이 독자에게 흥미롭습니다.", "unresolved": "QPI 패턴에서 나타나는 비탄성 신호와 스핀 요동 사이의 정량적 매칭은 이론적 피팅에 의존하는 면이 강합니다.", "future_work": "더 넓은 에너지 영역에서의 자기장 의존적 QPI 측정 혹은 다른 철계 초전도체와의 비교 연구를 통해 보편성을 검증할 필요가 있습니다.", "concepts": [{"term": "준입자 간섭 (QPI)", "why_emerged": "전자 상태의 파동적 성질을 이용해 불순물에 의한 산란 경로를 분석하여 Fermi surface와 간극 구조를 직접 영상화하기 위해 도입되었습니다.", "origin": "J. Tersoff & D.R. Hamann (1983)의 터널링 이론 기반, 이후 STM 연구에서 발전.", "connections": "Friedel oscillations, STS, 초전도 간극 대칭성."}, {"term": "스핀 요동 (Spin fluctuations)", "why_emerged": "포논으로 설명되지 않는 고온 초전도 및 강상관 초전도 현상의 매개체로서 필요했습니다.", "origin": "철계 초전도 초기 연구자들 (Mazin, Kuroki 등).", "connections": "Unconventional superconductivity, NMR, 중성자 산란."}], "english_summary": ["QPI analysis is performed on the iron-based superconductor LiFeAs using STM/STS.", "The study characterizes the symmetry of the superconducting order parameter.", "Evidence is presented for inelastic tunneling signals linked to spin fluctuations.", "The findings support spin-fluctuation-mediated pairing in this material system."]}}, {"title": "Spatiotemporal migration of antiferromagnetic domain walls in Sr2IrO4", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/f939-clb5", "authors": "Ian Robinson, David Yang, Ross Harder, et al.", "last_authors": "Joerg Hallmann, Anders Madsen", "summary": "Author(s): Ian Robinson, David Yang, Ross Harder, Dina Sheyfer, Longlong Wu, Jack Griffiths, Emil Bozin, Mark P. M. Dean, Jialun Liu, Hengdi Zhao, Gang Cao, Angel Rodriguez-Fernandez, Jan-Etienne Pudell, Roman Shayduk, James Wrigley, Alexey Zozulya, Rustam Rysov, Aliaksandr Leonau, Ulrike Boesenberg, Joerg Hallmann, and Anders Madsen While laser-driven demagnetization and magnetic x-ray scattering in Sr 2 IrO 4 are both well-established, the combination in a pump-probe experiment at an x-ray free electron laser is new. Micron-sized antiferromagnetic domains have been seen by other methods, but not the more subtle phase domains to which coherent scattering is sensitive. By measuring the temporal and spatial changes in the domain walls in a single experiment, the authors are able to establish here a wall-migration velocity for the first time. [Phys. Rev. B 113, L220410] Published Wed Jun 24, 2026", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Experimental X-ray scattering on a prototypical iridate; strong relevance to magnetic ordering dynamics.", "tags": ["X-rayscattering", "Sr2IrO4", "iridate"], "image": "", "briefing": {"background": "Sr2IrO4는 강한 스핀-궤도 결합(SOC)과 전자 상관관계가 어우러진 Mott 절연체로, 이리데이트(iridate) 물리학의 핵심 물질입니다. 자기 도메인의 역학은 이 시스템의 위상학적 혹은 자기적 특성을 이해하는 데 필수적입니다.", "motivation": "X선 자유전자 레이저(XFEL)를 이용해 Sr2IrO4의 자기적 도메인 벽이 시간에 따라 어떻게 이동하는지, 즉 동역학적 특성을 직접 관측하고자 했습니다.", "result": "펌프-프로브(pump-probe) X선 산란 실험을 통해 미세 자기 도메인 및 위상 도메인의 시공간적 변화를 측정했습니다. 이를 통해 자기 도메인 벽의 이동 속도를 최초로 정량적으로 산출했습니다.", "implication": "자기적 위상 도메인의 제어와 이해가 가능해짐에 따라, 초고속 자기 스위칭 및 정보 저장 소자 연구에 새로운 통찰을 제공합니다.", "novelty": "기존의 정적 도메인 관측을 넘어, 펨토초/피코초 단위의 초고속 펌프-프로브 기법을 사용하여 '벽 이동 속도'라는 동적 변수를 물리적으로 확립했다는 점이 혁신적입니다.", "unresolved": "관측된 도메인 벽 이동이 외부 자극에 대해 왜 특정 속도를 갖는지에 대한 미시적 마찰 기제는 추가 연구가 필요합니다.", nce", "source": "Gemini", "link": "https://doi.org/10.1126/science.adp4440", "authors": "Grace A. Pan, Dan Ferenc Segedin, Sophia F. R. TenHuisen, et al.", "last_authors": "Berit H. Goodge, Julia A. Mundy", "summary": "The discovery of superconductivity in square-planar nickelates has offered a rich materials platform to explore the origins of high-temperature superconductivity. However, experimental investigations have largely been limited to the infinite-layer R NiO 2 ( R , rare earth) nickelates. We constructed a phase diagram of multilayer square-planar Nd n +1 Ni n O 2 n +2 compounds and found signatures of superconductivity for dimensionality n = 4 to 8. Upon decreasing n , the superconducting anisotropy evolves owing to 4 f electron effects, and electronic structure characteristics approach cuprate-like behavior. Magnetic fluctuations persist from within the superconducting regime and into the overdoped, nonsuperconducting regime. The superconducting regime overlaps with that of chemically doped infinite-layer nickelates, demonstrating underlying commonalities as well as differences across varying structural realizations of square-planar nickelates. Our work establishes this layered template for creating new nickel-based superconductors.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Unconventional superconductivity in nickelates, relevant to user's broad interests.", "tags": ["superconductivity", "nickelates", "electronicstructure", "magneticfluctuations"], "image": "", "briefing": {"background": "구리 산화물(cuprate) 고온 초전도체와 유사한 전자 구조를 가진 니켈산염(nickelates)은 비전통적 초전도성을 이해하기 위한 새로운 플랫폼으로 주목받고 있습니다. 주로 무한층(infinite-layer) 구조 위주로 연구가 진행되어 왔습니다.", "motivation": "무한층 구조를 넘어 다층(multilayer) 니켈산염에서의 초전도성을 탐색하고, 구리 산화물과의 공통점과 차이점을 규명하여 초전도 상도를 구축하고자 함.", "result": "Nd(n+1)Ni(n)O(2n+2) 화합물에서 n=4~8인 시편의 초전도 현상을 확인하고 상도를 작성하였으며, 도핑 농도에 따른 자기적 요동의 지속성을 확인.", "implication": "니켈산염 초전도성이 특정 구조에 국한되지 않고 다층 구조로 확장 가능함을 증명하여, 고온 초전도 물질 설계의 범위를 넓힘.", "novelty": "다층 니켈산염에서 merization to modulate carrier density via interfacial dipoles.", "Enabled spatial programming of optoelectronic properties on WS2 and WSe2 monolayers.", "Demonstrated scalable, light-programmable transistor arrays."]}}, {"title": "Reentrant superconductivity at an oxide heterointerface", "journal": "Science_Advances", "source": "Gemini", "link": "https://doi.org/10.1126/sciadv.aeg0460", "authors": "Denis Maryenko, Minoru Kawamura, Igor V. Maznichenko, et al.", "last_authors": "Arthur Ernst, Masashi Kawasaki", "summary": "A magnetic field typically suppresses superconductivity by either breaking Cooper pairs via the Zeeman effect or inducing vortex formation. However, under certain circumstances, a magnetic field can stabilize superconductivity instead. This seemingly counterintuitive phenomenon is associated with magnetic interactions and has been extensively studied in three-dimensional materials. By contrast, this phenomenon, hinting at unconventional superconductivity, remains largely unexplored in two-dimensional systems, with moiré-patterned graphene being the only known example. Here, we report the observation of reentrant superconductivity at the epitaxial (110)-oriented LaTiO 3 -KTaO 3 interface. This phenomenon occurs across a wide range of charge carrier densities, which, unlike in three-dimensional materials, can be tuned in situ via electrostatic gating. We propose that the observed reentrant superconductivity can arise from an interplay between strong spin-orbit coupling and a magnetic field–driven modification of the Fermi surface. Our findings provide insight into reentrant superconductivity and establish a robust platform for exploring unconventional superconducting phenomena in two-dimensional systems.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Observation of reentrant unconventional superconductivity in an oxide heterointerface, relevant to 2D materials and Fermi surface.", "tags": ["unconventionalsuperconductivity", "2Dmaterials",   if (r.source) badges.appendChild(textEl('span', 'badge', r.source));
  headText.appendChild(badges);
  const title = document.createElement('h1');
  if (r.link) { const titleLink = document.createElement('a'); titleLink.href = r.link; titleLink.target = '_blank'; titleLink.rel = 'noopener noreferrer'; titleLink.textContent = r.title || ''; title.appendChild(titleLink); }
  else { title.textContent = r.title || ''; }
  headText.appendChild(title);
  headText.appendChild(textEl('p', 'meta', [r.journal, r.source].filter(Boolean).join(' | ')));
  if (r.last_authors || r.authors) { const authors = document.createElement('p'); authors.className = 'authors'; if (r.last_authors) authors.append('Last authors: ' + r.last_authors); if (r.authors) authors.append((r.last_authors ? ' | ' : '') + 'Authors: ' + r.authors); headText.appendChild(authors); }
  appendLabeledText(headText, 'why', 'Filter reason: ', r.reason);
  if (r.tags && r.tags.length) { const tags = document.createElement('div'); tags.className = 'tags'; r.tags.forEach(tag => tags.appendChild(textEl('span', 'tag', '#' + tag))); headText.appendChild(tags); }
  if (r.link) { const link = document.createElement('a'); link.className = 'link'; link.href = r.link; link.target = '_blank'; link.rel = 'noopener noreferrer'; link.textContent = 'Open paper'; headText.appendChild(link); }
  head.appendChild(headText);
  if (r.summary) { const abstract = document.createElement('p'); abstract.className = 'original-abstract'; const strong = textEl('strong', '', 'Original abstract'); abstract.appendChild(strong); abstract.append(r.summary); head.appendChild(abstract); }
  slideEl.appendChild(head);
  const briefing = document.createElement('div');
  briefing.className = 'briefing';
  appendBriefSection(briefing, 'Background', b.background);
  appendBriefSection(briefing, 'Motivation', b.motivation);
  appendBriefSection(briefing, 'Result', b.result);
  appendBriefSection(briefing, 'Implication', b.implication);
  appendBriefSection(briefing, "Why it's important / Novelty", b.novelty);
  appendBriefSection(briefing, 'Unresolved Questions', b.unresolved);
  appendBriefSection(briefing, 'Expected Future Work', b.future_work);
  if (b.concepts && b.concepts.length) {
    const section = document.createElement('section');
    section.className = 'brief-section wide';
    section.appendChild(textEl('h2', '', 'Concepts / Terms'));
    const concepts = document.createElement('div');
    concepts.className = 'concepts';
    b.concepts.forEach(c => {
      const item = document.createElement('div');
      item.className = 'concept';
      item.appendChild(textEl('h3', '', c.term || 'Concept'));
      [['왜 생겼나: ', c.why_emerged], ['누가 만들었나: ', c.origin], ['연결되는 흐름: ', c.connections]].forEach(([label, text]) => { if (!text) return; const p = document.createElement('p'); const bold = textEl('b', '', label); p.appendChild(bold); p.append(text); item.appendChild(p); });
      concepts.appendChild(item);
    });
    section.appendChild(concepts);
    briefing.appendChild(section);
  }
  if (b.english_summary && b.english_summary.length) { const section = document.createElement('section'); section.className = 'brief-section wide'; section.appendChild(textEl('h2', '', 'English Summary')); const ul = document.createElement('ul'); b.english_summary.slice(0, 5).forEach(line => ul.appendChild(textEl('li', '', line))); section.appendChild(ul); briefing.appendChild(section); }
  slideEl.appendChild(briefing);
  counterEl.textContent = `${index + 1} / ${slides.length}`;
  prevBtn.disabled = index === 0;
  nextBtn.disabled = index === slides.length - 1;
}
prevBtn.addEventListener('click', () => { index = Math.max(0, index - 1); render(); });
nextBtn.addEventListener('click', () => { index = Math.min(slides.length - 1, index + 1); render(); });
document.addEventListener('keydown', event => { if (event.key === 'ArrowLeft') prevBtn.click(); if (event.key === 'ArrowRight') nextBtn.click(); });
render();
</script>
</body>
</html>
