<title>Daily Paper Slideshow</title>
<style>
  :root {
    color-scheme: light;
    --bg: #f6f7f4;
    --paper: #ffffff;
    --ink: #111827;
    --muted: #64748b;
    --line: #d8ddd2;
    --accent: #176b87;
    --accent-2: #9a3412;
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; overflow: auto; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: var(--bg); color: var(--ink); }
  .shell { max-width: 1500px; min-height: 100vh; margin: 0 auto; padding: 14px 18px; display: flex; flex-direction: column; }
  .topbar { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 16px; }
  .top-actions { display: flex; align-items: center; gap: 10px; }
  .topbar a, button { border: 1px solid var(--line); border-radius: 8px; background: var(--paper); color: var(--ink); padding: 10px 14px; font-weight: 700; text-decoration: none; cursor: pointer; }
  button.primary { background: var(--accent); border-color: var(--accent); color: white; }
  button:disabled { opacity: 0.45; cursor: not-allowed; }
  .counter { color: var(--muted); font-weight: 700; }
  .slide { min-height: calc(100vh - 82px); background: var(--paper); border: 1px solid var(--line); border-radius: 10px; padding: 18px; box-shadow: 0 18px 42px rgba(15, 23, 42, 0.10); display: grid; grid-template-columns: minmax(310px, 0.86fr) minmax(0, 1.55fr); gap: 18px; overflow: visible; }
  .paper-head { min-width: 0; min-height: 0; overflow: visible; display: flex; flex-direction: column; gap: 12px; }
  .figure { margin: 0; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: #f8fafc; }
  .figure img { display: block; width: 100%; max-height: 41vh; object-fit: contain; background: white; }
  .figure figcaption { padding: 7px 10px; color: var(--muted); font-size: 12px; line-height: 1.3; }
  .head-text { display: flex; flex-direction: column; gap: 9px; min-width: 0; }
  .badges { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .badge { border-radius: 999px; padding: 5px 9px; background: #eef2ff; color: #3730a3; font-size: 12px; font-weight: 800; }
  .score { background: #fee2e2; color: #991b1b; }
  h1 { margin: 0; font-size: 25px; line-height: 1.15; letter-spacing: 0; overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
  h1 a { color: inherit; text-decoration-color: rgba(23, 107, 135, 0.35); text-decoration-thickness: 2px; text-underline-offset: 4px; }
  h1 a:hover { color: var(--accent); text-decoration-color: var(--accent); }
  .meta, .authors, .why, .abstract { font-size: 13px; line-height: 1.45; }
  .meta, .authors { color: var(--muted); }
  .why strong, .abstract strong, .authors strong { color: var(--ink); }
  .authors { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .why { border-left: 4px solid var(--accent-2); padding-left: 10px; color: #374151; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .abstract { border-top: 1px solid var(--line); padding-top: 14px; color: #374151; }
  .original-abstract { border-top: 1px solid var(--line); padding-top: 10px; color: #374151; font-size: 11.5px; line-height: 1.35; overflow-wrap: anywhere; }
  .original-abstract strong { display: block; margin-bottom: 4px; color: var(--ink); }
  .tags { display: flex; flex-wrap: wrap; gap: 8px; }
  .tag { border-radius: 999px; padding: 4px 8px; background: #f1f5f9; color: #475569; font-size: 12px; font-weight: 700; }
  .head-text > .link { display: none; }
  .briefing { min-width: 0; min-height: 0; overflow: visible; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); grid-auto-rows: minmax(0, auto); align-content: start; gap: 11px 18px; border-top: 0; padding-top: 0; }
  .brief-section { min-width: 0; }
  .brief-section.wide { grid-column: 1 / -1; }
  .brief-section h2 { margin: 0 0 4px; font-size: 14px; line-height: 1.22; color: #0f766e; letter-spacing: 0; }
  .brief-section p, .brief-section li { margin: 0; font-size: 12.5px; line-height: 1.42; color: #1f2937; overflow-wrap: anywhere; }
  .brief-section ul { margin: 0; padding-left: 20px; }
  .concepts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 9px 14px; }
  .concept { border-top: 1px solid var(--line); padding-top: 7px; }
  .concept h3 { margin: 0 0 4px; font-size: 13px; color: #7c2d12; letter-spacing: 0; }
  .concept p { margin: 2px 0 0; font-size: 11.5px; line-height: 1.35; color: #374151; overflow-wrap: anywhere; }
  .concept b { color: #111827; }
  .link { color: var(--accent); font-weight: 800; text-decoration: none; }
  .empty { padding: 48px; background: var(--paper); border: 1px solid var(--line); border-radius: 12px; color: var(--muted); }
  @media (max-width: 860px) {
    .shell { padding: 14px; }
    .topbar, .top-actions { align-items: stretch; flex-direction: column; }
    .slide, .briefing, .concepts { grid-template-columns: 1fr; }
    .slide { min-height: auto; overflow: visible; display: grid; }
    h1 { font-size: 28px; }
  }
</style>

<script>
const slides = [{"title": "Hidden loop currents in a kagome metal", "journal": "Nature_Physics", "source": "keyword", "link": "https://www.nature.com/articles/s41567-026-03343-y", "authors": "Authors not available in source RSS", "last_authors": "", "summary": "Nature Physics, Published online: 25 June 2026; doi:10.1038/s41567-026-03343-y Measurements made using nuclear quadrupole resonance and nuclear magnetic resonance have revealed tiny internal magnetic fields in a kagome metal. These fields are microscopic evidence of a hidden electronic order characterized by spontaneous atomic-scale current loops, and consistent with an imaginary charge-density wave.", "tier": "A_MUST_READ", "score": "9", "reason": "title strong match: kagome metal", "tags": ["kagome", "loopcurrent"], "image": "https://media.springernature.com/m685/springer-static/image/art%3A10.1038%2Fs41567-026-03343-y/MediaObjects/41567_2026_3343_Fig1_HTML.png", "briefing": {"background": "Kagome 격자 구조의 금속(kagome metals)은 기하학적 좌절(frustration)과 특이한 띠 구조(flat bands, Dirac cones)로 인해 전하 밀도파(CDW), 초전도성, 그리고 자성 없이도 시간 역전 대칭성이 깨지는 현상(TRSB) 등 복잡한 물리 현상을 보입니다.", "motivation": "최근 AV3Sb5와 같은 Kagome 금속에서 관찰된 TRSB의 근원을 설명하기 위해 '루프 전류(loop current)' 모델이 제안되었으나, 이를 직접적으로 입증할 미시적인 자기장 측정 데이터가 부족했습니다.", "result": "핵사중극자공명(NQR) 및 핵자기공명(NMR) 측정을 통해 Kagome 금속 내부에서 극히 미세한 내부 자기장을 발견했습니다. 이는 원자 규모의 자발적 루프 전류가 존재함을 시사하며, 이론적으로 제시되었던 '허수 전하 밀도파(imaginary CDW)' 상태와 일치하는 결과입니다.", "implication": "Kagome 격자에서 전하 밀도파가 단순한 전하 분포의 변조를 넘어, 위상학적인 성질을 가질 수 있는 전류 분포의 변조를 동반함을 의미합니다. 이는 위상 물질 연구에서 새로운 전위(order parameter)의 존재를 확증하는 것입니다.", "novelty": "이 연구는 Kagome 금속 내의 '숨겨진 루프 전류'를 로컬 프로브(NMR/NQR)로 포착해낸 핵심적인 실험 결과입니다. 독자의 주된 관심사인 AV3Sb5 계열의 TRSB 및 루프 전류 논란을 해결할 중요한 단서를 제공합니다.", "unresolved": "이러한 루프 전류가 다른 Kagome 계열 물질에서도 보편적으로 나타나는지, 그리고 초전도 현상과 어떤 직접적인 경쟁 또는 공존 관계에 있는지는 추가 연구가 필요합니다.", "future_work": "이 루프 전류 상태가 외부 자기장이나 변형(strain)에 어떻게 반응하는지에 대한 연구와, ARPES를 통한 전자 구조 변조의 직접적인 관찰이 기대됩니다.", "concepts": [{"term": "Loop Current (루프 전류)", "why_emerged": "고체 내에서 전자가 원자 사이를 순환하며 흐를 때 발생하는 전류로, 자성 원자 없이도 미세한 자기 모멘트와 TRSB를 설명하기 위해 도입되었습니다.", "origin": "Varma 등에 의해 구리 산화물 초전도체의 유사갭(pseudogap) 상태를 설명하기 위해 처음 제안되었습니다.", "connections": "Kagome 격자의 Varma loop current, Chiral CDW, 위상 절연체."}, {"term": "Imaginary CDW (허수 전하 밀도파)", "why_emerged": "실수 값을 가지는 일반적인 CDW와 달리, 파동 함수의 위상이 변조되어 전류의 흐름(orbital currents)을 유도하는 상태를 설명합니다.", "origin": "Kagome 격자의 특이한 위상 상태를 설명하는 이론적 논의에서 등장했습니다.", "connections": "Haldane 모델, Chern 절연체, 비정상 홀 효과(AHE)."}, {"term": "NQR (핵사중극자공명)", "why_emerged": "외부 자기장 없이도 원자핵의 전기 사중극자 모멘트와 주변 전기장 기울기(EFG)의 상호작용을 통해 국소적인 전자 환경을 측정하기 위해 사용됩니다.", "origin": "1950년대 초 Dehmelt와 Krüger 등에 의해 발견되었습니다.", "connections": "NMR, 초미세 상호작용(hyperfine interaction), 국소 자기장 측정."}], "english_summary": ["Detected microscopic internal magnetic fields in a kagome metal using NQR and NMR.", "Provided experimental evidence for hidden electronic order characterized by spontaneous loop currents.", "Results are consistent with the long-debated imaginary charge-density wave (CDW) state.", "Significant for understanding the origin of time-reversal symmetry breaking in kagome systems."]}}, {"title": "Erratum: Long-lived coherence between incoherent excitons revealed by time-resolved angle-resolved photoemission spectroscopy: An exact solution [Phys. Rev. B 111, 235124 (2025)]", "journal": "PRB_Recent", "source": "keyword", "link": "http://link.aps.org/doi/10.1103/lsxs-hqns", "authors": "Zhenlin Zhang, Wei Hu, Enrico Perfetto, Gianluca Stefanucci", "last_authors": "Enrico Perfetto, Gianluca Stefanucci", "summary": "Author(s): Zhenlin Zhang, Wei Hu, Enrico Perfetto, and Gianluca Stefanucci [Phys. Rev. B 113, 239904] Published Wed Jun 24, 2026", "tier": "A_MUST_READ", "score": "9", "reason": "title strong match: angle-resolved photoemission", "tags": ["angle-resolvedphotoemission", "photoemission"], "image": "", "briefing": {"background": "시간 분해 각분해 광전자 분광법(tr-ARPES)은 여기된 상태의 전자 구조와 엑시톤(exciton)의 동역학을 직접적으로 관찰할 수 있는 강력한 도구입니다.", "motivation": "이전 연구(Phys. Rev. B 111, 235124)에서 제시된 '비간섭성 엑시톤 간의 장기 지속 결맞음(long-lived coherence)'에 대한 엄밀한 해(exact solution)에서 발견된 오류를 수정하기 위함입니다.", "result": "이 정오표는 원래 논문의 수식이나 수치적 결과의 일부를 수정했을 것으로 보이나, 초록에는 구체적인 수정 사항이 명시되지 않았습니다. 이론적 모델의 엄밀성을 재확립하는 데 초점을 맞추고 있습니다.", "implication": "수정된 해를 통해 tr-ARPES 데이터에서 관찰되는 엑시톤의 결맞음 현상을 보다 정확하게 해석할 수 있게 됩니다.", "novelty": "tr-ARPES의 이론적 해석 기틀을 다지는 '엄밀한 해'에 대한 수정이므로, 해당 기법을 사용하는 연구자들에게 계산의 정확성을 보장해 줍니다.", "unresolved": "수정된 결과가 기존에 해석된 실험 데이터의 물리적 결론을 유의미하게 바꾸는지 여부는 본문 확인이 필요합니다.", "future_work": "수정된 이론 모델을 다양한 2D 반도체나 반데르발스 이질 구조의 tr-ARPES 데이터 분석에 적용할 필요가 있습니다.", "concepts": [{"term": "tr-ARPES", "why_emerged": "평형 상태를 벗어난 전자의 에너지-운동량 동역학을 실시간으로 관찰하여 초고속 물성을 연구하기 위해 개발되었습니다.", "origin": "레이저 기술의 발전과 함께 1990년대 이후 본격적으로 활성화되었습니다.", "connections": "Floquet 엔지니어링, 엑시톤 동역학, 비평형 상전이."}, {"term": "Incoherent Exciton (비간섭성 엑시톤)", "why_emerged": "광여기 후 결맞음이 깨진 상태에서도 장시간 생존하며 물성에 영향을 주는 엑시톤 상태를 설명하기 위해 필요합니다.", "origin": "초록 정보만으로는 특정하기 어려우나 반도체 광학 분야의 표준 용어입니다.", "connections": "엑시톤 응축, 결맞음 동역학, 다체 상호작용."}], "english_summary": ["Erratum for an exact solution regarding long-lived coherence between incoherent excitons.", "Refines the theoretical framework for interpreting time-resolved ARPES (tr-ARPES) data.", "Ensures the accuracy of the mathematical derivations used in the original publication."]}}, {"title": "Multiband superconductivity in the kagome-lattice superconductor Re2Zr", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/tv8d-8pb2", "authors": "Gabriel Kuderowicz, Bartlomiej Wiendlocha", "last_authors": "Gabriel Kuderowicz, Bartlomiej Wiendlocha", "summary": "Author(s): Gabriel Kuderowicz and Bartlomiej Wiendlocha We present a first-principles investigation of the electronic structure, lattice dynamics, electron-phonon coupling, and superconducting properties of the hexagonal kagome-lattice compound ${\\mathrm{Re}}_{2}\\mathrm{Zr}$, in which time-reversal symmetry breaking and unconventional pairing were recent… [Phys. Rev. B 113, 224521] Published Mon Jun 22, 2026", "tier": "A_MUST_READ", "score": "9", "reason": "Electronic structure and superconductivity study of a kagome lattice material with TRSB.", "tags": ["material", "kagome", "superconductivity", "electronicstructure"], "image": "", "briefing": {"background": "Re2Zr은 Kagome 격자 구조를 가지는 초전도체로, 최근 실험에서 시간 역전 대칭성 깨짐(TRSB)과 비전통적 쌍형성(unconventional pairing)의 징후가 보고되어 주목받고 있습니다.", "motivation": "Re2Zr의 전자 구조, 격자 동역학, 전자-포논 결합 등을 제일원리 계산(DFT)을 통해 체계적으로 분석하여, 실험에서 관찰된 비전통적 물성의 기원을 이해하고자 합니다.", "result": "제일원리 계산을 통해 Re2Zr이 다중 밴드(multiband) 초전도체임을 확인하였으며, 전자-포논 결합 및 초전도 특성을 정량화했습니다. Kagome 격자의 구조적 특징이 전자 구조에 미치는 영향을 규명했습니다.", "implication": "실험적으로 관찰된 TRSB 현상이 다중 밴드 효과나 Kagome 격자의 특수한 대칭성과 어떻게 연결되는지를 설명하는 이론적 기반을 제공합니다.", "novelty": "Kagome 초전도체 중 AV3Sb5 계열 이외의 새로운 물질인 Re2Zr에 대한 상세한 전자 구조 계산을 제시했다는 점이 중요합니다. 특히 독자의 관심사인 Kagome 및 TRSB와 직접 연관됩니다.", "unresolved": "계산된 전자-포논 결합만으로 실험에서 제안된 비전통적 pairing을 모두 설명할 수 있는지, 아니면 추가적인 전자 상관관계가 필요한지는 여전히 논의 대상입니다.", "future_work": "ARPES를 통한 직접적인 밴드 매핑과 계산 결과의 비교, 그리고 압력이나 도핑에 따른 초전도성 변화 연구가 뒤따를 것으로 보입니다.", "concepts": [{"term": "Multiband Superconductivity (다중 밴드 초전도)", "why_emerged": "단일 밴드 모델로 설명되지 않는 MgB2나 철계 초전도체의 복잡한 초전도 현상을 설명하기 위해 필수적인 개념입니다.", "origin": "1959년 Suhl, Matthias, Walker 등에 의해 이론적으로 제안되었습니다.", "connections": "MgB2, 철계 초전도체, 갭 비등방성(gap anisotropy)."}, {"term": "Kagome Lattice (카고메 격자)", "why_emerged": "기하학적 좌절 구조로 인해 플랫 밴드와 디락 콘이 동시에 존재하며, 강한 상관관계와 위상 효과를 동시에 연구할 수 있는 플랫폼입니다.", "origin": "일본의 대바구니 패턴에서 유래되었으며, Syôzi(1951) 등이 통계 역학 모델로 연구하기 시작했습니다.", "connections": "AV3Sb5, 분수 양자 홀 효과, 위상 금속."}, {"term": "Electron-Phonon Coupling (전자-포논 결합)", "why_emerged": "BCS 이론의 핵심 기전으로, 전자가 격자 진동을 매개로 쌍을 이루어 초전도 현상을 일으키는 정도를 정량화합니다.", "origin": "1957년 BCS 이론의 핵심 요소로 확립되었습니다.", "connections": "Eliashberg 이론, McMillan 식, 고온 초전도."}], "english_summary": ["First-principles study of the kagome-lattice superconductor Re2Zr.", "Identified multiband superconductivity and analyzed lattice dynamics and electron-phonon coupling.", "Investigated the link between kagome lattice structure and unconventional properties like TRSB.", "Provides a theoretical foundation for understanding the electronic structure of non-AV3Sb5 kagome superconductors."]}}, {"title": "Superconductivity and the quasiparticle mass enhancement near the charge density wave critical point using the Bethe-Salpeter method: Application to cuprates", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/9vbp-dv48", "authors": "Youichi Yamakawa, Hiroshi Kontani", "last_authors": "Youichi Yamakawa, Hiroshi Kontani", "summary": "Author(s): Youichi Yamakawa and Hiroshi Kontani In recent years, charge-channel order in strongly correlated metals has attracted much attention. Representative examples include electronic nematic order in cuprates and iron-based superconductors, and Star-of-David order in kagome metals. Critical phenomena and unconventional superconductivity ari… [Phys. Rev. B 113, 235140] Published Tue Jun 23, 2026", "tier": "A_MUST_READ", "score": "9", "reason": "Directly discusses Star-of-David kagome order, CDW, and nematicity relevant to AV3Sb5 materials.", "tags": ["theory", "kagome", "CDW", "nematicity"], "image": "", "briefing": {"background": "강상관계 전자계에서 전하 채널 질서(Charge-channel order)는 전자 네마틱 질서나 카고메 금속의 스타-오브-데이비드(Star-of-David) 패턴 등 물성 제어의 핵심 요소입니다.", "motivation": "쿠퍼레이트 등 고온 초전도체에서 CDW 임계점 근처의 quasiparticle 질량 증폭과 초전도성 사이의 관계를 Bethe-Salpeter 방정식을 통해 미시적으로 규명하고자 합니다.", "result": "CDW 임계점 근처에서의 양자 임계 요동이 어떻게 전자 질량을 증폭시키고, 이것이 비전통적 초전도 현상과 결합되는지 이론적으로 모델링했습니다.", "implication": "AV3Sb5 등 카고메 금속에서 관찰되는 CDW와 초전도성 간의 경쟁 및 상호협력 관계를 이해하는 데 중요한 이론적 틀을 제공합니다.", "novelty": "기존의 강상관계 이론을 카고메 격자 시스템의 특징적인 스타-오브-데이비드 질서에 성공적으로 확장 적용했습니다.", "unresolved": "실제 복잡한 밴드 구조와 페르미 표면의 nesting 효과를 얼마나 정밀하게 반영하는지에 대한 검증이 필요합니다.", "future_work": "다른 카고메 물질이나 다층 구조 시스템으로의 확장 및 더 정밀한 수치 계산 수행.", "concepts": [{"term": "Bethe-Salpeter equation", "why_emerged": "입자-정공 쌍의 다체 상호작용을 통해 결합 상태의 에너지를 구하기 위해 필요함.", "origin": "Hans Bethe and Edwin Salpeter (1951).", "connections": "Green's function 이론, 강상관계 물질의 스핀/전하 요동 연구."}, {"term": "Star-of-David order", "why_emerged": "카고메 격자에서 CDW 발생 시 전하 밀도가 육각형 주위로 재배치되는 특징적인 기하학적 형태.", "origin": "AV3Sb5 연구를 통해 최근 실험적으로 확인됨.", "connections": "CDW, 카고메 금속의 전자 구조, 페르미 표면."}], "english_summary": ["Utilizes the Bethe-Salpeter method to study superconductivity and quasiparticle mass enhancement near CDW critical points.", "Focuses on electronic nematicity and Star-of-David order relevant to kagome metals like AV3Sb5.", "Provides a theoretical framework connecting quantum fluctuations to unconventional superconductivity in correlated metals."]}}, {"title": "Direct Observation of Sublattice-Dependent Magnetic Ordering and Strong Electron-Magnon Coupling in Fe5GeTe2", "journal": "PRL_Recent", "source": "author whitelist", "link": "http://link.aps.org/doi/10.1103/9t6n-4myf", "authors": "R. Xu, X. H. Chen, X. L. Li, et al.", "last_authors": "D. L. Feng, J. Jiang", "summary": "Author(s): R. Xu, X. H. Chen, X. L. Li, Y. Z. Wang, J. H. Yao, Z. S. Zhao, S. Liao, S. W. Su, P. Li, Z. T. Liu, D. W. Shen, F. M. Li, Y. L. Wang, D. L. Feng, and J. Jiang The van der Waals room-temperature ferromagnet ${\\mathrm{Fe}}_{5}{\\mathrm{GeTe}}_{2}$ has garnered considerable research interest due to its intriguing magnetic and transport properties, as well as its potential applications, yet their microscopic origin remains unclear. Using angle-resolved photoem… [Phys. Rev. Lett. 136, 256701] Published Tue Jun 23, 2026", "tier": "A_MUST_READ", "score": "9", "reason": "author whitelist: D. L. Feng", "tags": ["vanderWaals", "magnon", "ferromagnet", "transport"], "image": "", "briefing": {"background": "Fe5GeTe2는 실온 강자성을 보이는 van der Waals 물질로, 스핀트로닉스 응용 가능성 때문에 주목받고 있으나 그 자기적 성질의 미시적 기원이 불분명했습니다.", "motivation": "해당 물질의 서브격자별 자기적 질서와 전자-마그논 결합(electron-magnon coupling)의 물리적 본질을 실험적으로 확인하고자 했습니다.", "result": "ARPES를 통해 Fe5GeTe2의 서브격자 의존적인 자기적 질서를 직접 관찰하고, 강한 전자-마그논 상호작용의 증거를 포착했습니다.", "implication": "이 물질의 독특한 자기적/수송 특성이 전자와 마그논 사이의 미시적 결합에서 기인함을 확인하여, 향후 스핀트로닉스 소자 설계에 물리적 근거를 제시합니다.", "novelty": "D. L. Feng 그룹의 정밀한 ARPES 측정으로 강자성 vdW 물질의 복잡한 자기 구조를 서브격자 단위에서 분해했다는 점이 핵심입니다.", "unresolved": "서브격자 간의 미세한 에너지 차이가 외부 변수(압력, 게이팅)에 어떻게 반응하는지는 아직 미지수입니다.", "future_work": "온도 변화에 따른 마그논 요동의 동역학적 분석 및 다른 층상 구조 물질로의 비교 연구.", "concepts": [{"term": "Electron-Magnon Coupling", "why_emerged": "자기적 질서 내에서 전자들이 스핀파(magnon)와 상호작용하여 밴드 구조가 변하는 현상을 이해하기 위해 필요함.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "ARPES 밴드 구조 왜곡, 자기 저항 현상."}, {"term": "Fe5GeTe2", "why_emerged": "실온에서 강자성을 유지하는 몇 안 되는 2D/vdW 물질로서의 잠재력.", "origin": "최근 vdW 자기 물질 탐색 과정에서 발견.", "connections": "Fe3GeTe2, 강자성 vdW 이종접합."}], "english_summary": ["Reports ARPES observation of sublattice-dependent magnetic order in Fe5GeTe2.", "Identifies strong electron-magnon coupling as a key microscopic mechanism.", "Provides insight into the magnetic and transport properties of van der Waals room-temperature ferromagnets."]}}, {"title": "Observation of Altermagnetic Order Switching in Bulk MnTe by Polarized Neutron Diffraction", "journal": "PRL_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/yklc-9n6t", "authors": "Zheyuan Liu, Shinichiro Asai, Shingo Takahashi, Hiraku Saito, Taro Nakajima, Takatsugu Masuda", "last_authors": "Taro Nakajima, Takatsugu Masuda", "summary": "Author(s): Zheyuan Liu, Shinichiro Asai, Shingo Takahashi, Hiraku Saito, Taro Nakajima, and Takatsugu Masuda Altermagnetic order, characterized by the Néel vector, breaks time-reversal symmetry (TRS) even in the nonrelativistic limit. Although spin-polarized and anomalous transport phenomena emerge with this order, they are mutually compensated by TRS-connected antiphase domains with opposite Néel vectors.… [Phys. Rev. Lett. 136, 256704] Published Tue Jun 23, 2026", "tier": "A_MUST_READ", "score": "9", "reason": "Experimental observation of altermagnetic order switching in MnTe via polarized neutron diffraction.", "tags": ["altermagnetism", "neutrondiffraction", "magneticorder", "time-reversalsymmetry", "experimental"], "image": "", "briefing": {"background": "알터자성(Altermagnetism)은 상대론적 효과 없이도 시간 역전 대칭성(TRS)을 깨고 스핀 분할 밴드를 가지는 새로운 자기 상입니다.", "motivation": "알터자성체에서 나타나는 스핀 편향 수송 현상이 TRS가 서로 반대인 도메인들 사이에서 어떻게 상쇄되는지, 그리고 도메인 제어 가능성을 확인하고자 했습니다.", "result": "MnTe에서 편극 중성자 회절을 통해 알터자성 도메인(Néel 벡터의 방향)을 직접 관찰하고, 이를 외부 요인으로 스위칭할 수 있음을 실험적으로 증명했습니다.", "implication": "알터자성체의 도메인을 인위적으로 제어할 수 있게 됨에 따라 차세대 자기 메모리 소자로서의 가능성이 비약적으로 높아졌습니다.", "novelty": "알터자성 도메인의 직접적 관찰과 스위칭을 구현하여, 이론적 개념 단계에 있던 알터자성을 실험 응용 단계로 격상시켰습니다.", "unresolved": "실제 산업용 소자 수준의 효율적인 스위칭을 위한 전기적 제어 메커니즘은 추가 연구가 필요합니다.", "future_work": "전기적(전류 유도) 알터자성 도메인 제어 및 관련 이상 홀 효과 측정.", "concepts": [{"term": "Altermagnetism", "why_emerged": "강자성체와 반강자성체의 특성을 모두 가지며 스핀 분할 밴드를 가진 물질의 필요성.", "origin": "최근 이론적으로 정립됨(Jungwirth et al.).", "connections": "반강자성, 시간 역전 대칭성 파괴, 이상 홀 효과."}, {"term": "Néel vector", "why_emerged": "반강자성체에서 순 자기 모멘트가 0일 때, 각 서브격자 간의 자화 방향 차이를 나타내기 위해 정의됨.", "origin": "Louis Néel (1930년대).", "connections": "반강자성 질서, 알터자성."}], "english_summary": ["Demonstrates switching of altermagnetic order in bulk MnTe using polarized neutron diffraction.", "Confirms that TRS-broken antiphase domains can be manipulated.", "Paves the way for utilizing altermagnets in spintronic memory applications."]}}, {"title": "Ultrafast Magneto-Optical Fingerprints of Altermagnetism in MnTe", "journal": "PRL_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/nyy3-h8wr", "authors": "Xu Yang, Xingkai Cheng, Zhuo Deng, et al.", "last_authors": "Junwei Liu, Zhao-Hua Cheng", "summary": "Author(s): Xu Yang, Xingkai Cheng, Zhuo Deng, Yu-Han Gao, Qing-Lin Yang, Zheng Chang, Peng-Tao Yang, Hong-Mei Feng, Xiang-Qun Zhang, Wei He, Junwei Liu, and Zhao-Hua Cheng Recently identified altermagnets exhibit a distinctive dual-space nature: they possess spin-sp s and topological electronics."]}}, {"title": "Emergent Dynamical Kondo Coherence and Competing Magnetic Order in a Correlated Kagome Flat-Band Metal CsCr6Sb6", "journal": "PRL_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/f8b9-q54m", "authors": "Xiangqi Liu, Xuefeng Zhang, Jiachen Jiao, et al.", "last_authors": "Gang Li, Yanfeng Guo", "summary": "Author(s): Xiangqi Liu, Xuefeng Zhang, Jiachen Jiao, Renjie Zhang, Kaiwen Chen, Ying Wang, Yunguan Ye, Zhenhai Yu, Chengyu Jiang, Xia Wang, Bei Jiang, Yaobo Huang, Lei Shu, Baiqing Lv, Gang Li, and Yanfeng Guo Correlated kagome metals host unique electronic states that enable exotic quantum phenomena. In the recently emerged ${\\mathrm{CsCr}}_{6}{\\mathrm{Sb}}_{6}$, these manifest through Kondo behavior from localized $\\mathrm{Cr}\\text{−}3d$ electrons and unprecedented band flattening near the Fermi level. … [Phys. Rev. Lett. 136, 256601] Published Tue Jun 23, 2026", "tier": "B_IMPORTANT_CONDMAT", "score": "10", "reason": "Direct hit: correlated kagome metal CsCr6Sb6 with Kondo coherence and competing magnetic order.; demoted from A: broad CM, not direct user/project hit", "tags": ["kagome", "correlatedelectronsystem", "Kondoeffect", "magneticorder", "newmaterial"], "image": "", "briefing": {"background": "가고메 격자는 기하학적 좌절(geometric frustration)과 평탄 밴드(flat band)를 통해 강한 전자 상관관계를 유도하는 플랫폼입니다. CsV3Sb5와 같은 기존 물질들과 더불어, d-전자 국소화와 관련된 다체 물리학적 거동이 연구의 핵심입니다.", "motivation": "CsCr6Sb6라는 새로운 가고메 금속에서 관찰되는 Cr-3d 전자의 국소화와 이로 인한 Kondo 효과, 그리고 그에 따른 자기 질서의 경쟁 관계를 규명하고자 했습니다.", "result": "CsCr6Sb6에서 Kondo 결맞음 현상과 페르미 준위 근처의 비정상적인 밴드 평탄화가 공존함을 발견했습니다.", "implication": "가고메 금속에서 Kondo 효과와 전자 상관관계가 어떻게 위상적/자기적 질서와 상호작용하는지에 대한 새로운 모델을 제공합니다.", "novelty": "AV3Sb5 시리즈에 국한되었던 가고메 연구를 Cr 기반 계열로 확장하며, 국소 모멘트와 격자 밴드 구조 간의 새로운 상호작용 메커니즘을 드러냈습니다.", "unresolved": "Kondo 효과가 물질의 전체적인 자기적 기저 상태를 어떻게 확정 짓는지에 대한 정량적 관계는 여전히 복잡한 문제입니다.", "future_work": "저온 ARPES 및 STM을 통한 밴드 평탄화의 직접 관측 및 자기 구조 변화에 대한 추가 탐색이 필요합니다.", "concepts": ingerprints of altermagnetism, directly relevant to electronic structure characterization.", "tags": ["altermagnet", "spectroscopy"], "image": "https://arxiv.org/html/2606.27548v1/schematicPic_3.png", "briefing": {"background": "Altermagnetism은 강자성과 반강자성의 특징을 모두 가진 새로운 자기 정렬 상태로, 자화가 없으면서도 스핀 분할된 전자 구조를 가져 비자성 물질에서 나타나기 힘든 독특한 물성을 보입니다.", "motivation": "선형 응답 분광법만으로는 알터마그네틱(ALM)의 다양한 스핀 분할 대칭성(d-, g-, i-wave)을 구분하는 데 한계가 있어, 비선형 다광자 흡수 기법을 통한 명확한 실험적 지표가 필요했습니다.", "result": "연구진은 $n$광자 흡수의 편광 선택적 응답이 알터마그네틱의 스핀 분할 각도 고조파에 따라 결정됨을 보였으며, 각 대칭성(d, g, i)에 대응하는 고유한 비선형 광학 흡수 지문을 도출했습니다.", "implication": "알터마그네틱 물질의 복잡한 스핀 텍스처를 실험적으로 결정하기 위한 강력한 분광학적 도구를 제공하며, 향후 spintronics 물질 설계에 중요한 기준이 될 것입니다.", "novelty": "기존 선형 분광법을 넘어 고차 비선형 광학 응답을 통해 알터마그네틱의 미세한 스핀 분할 대칭성을 구별할 수 있음을 이론적으로 증명했습니다.", "unresolved": "이론적 제안 단계로, 실제 물질 시스템에서의 다광자 흡수 효율 확보 및 노이즈 제어 등 구체적인 실험 구현은 아직 과제로 남아 있습니다.", "future_work": "실제 알터마그네틱 후보 물질들에 대한 비선형 분광 실험 검증과, 제안된 편광 채널에서의 흡수 신호 측정 장비 최적화 연구가 기대됩니다.", "concepts": [{"term": "Altermagnetism", "why_emerged": "강자성과 반강자성 사이의 누락된 자기 상태를 분류하기 위해 필요.", "origin": "Jungwirth 등 (2022년경 활발히 논의 시작).", "connections": "반강자성 스핀트로닉스, 자기적 위상 물질."}, {"term": "Multiphoton Absorption", "why_emerged": "선형 광학 흡수로는 탐지할 수 없는 물질 내부의 대칭성 정보 추출을 위해 필요.", "origin": "Maria Goeppert-Mayer (1931년 이론적 제안).", "connections": "비선형 광학, SHG(제2조화파 발생)."}], "english_summary": ["The paper theoretically explores nonlinear multiphoton absorption as a tool to characterize altermagnets.", "It establishes that the symmetry of altermagnetic spin splitting (d, g, i-wave) is encoded in n-photon absorption thresholds.", "Specific polarization channels are identified that serve as clear spectroscopic fingerprints for these textures.", "This provides a critical experimental pathway to distinguish altermagnetic states beyond linear response."]}}, {"title": "Observation of a saddle-loop van Hove singularity", "journal": "npj_QuantumMaterials", "source": "Gemini", "link": "https://www.nature.com/articles/s41535-026-00905-4", "authors": "Y. Morita, K. Nakayama, N. Ito, et al.", "last_authors": "K. Kudo, T. Sato", "summary": "npj Quantum Materials, Published online: 25 June 2026; doi:10.1038/s41535-026-00905-4 Observation of a saddle-loop van Hove singularity", "tier": "B_IMPORTANT_CONDMAT", "score": "9", "reason": "Experimental observation of a van Hove singularity is highly relevant to ARPES electronic structure studies.; demoted from A: broad CM, not direct user/project hit", "tags": ["method", "vanHovesingularity", "electronicstructure"], "image": "https://pubads.g.doubleclick.net/gampad/ad?iu=/285/npjquantmats.nature.com/article&sz=728x90&c=-890664080&t=pos%3Dtop%26type%3Darticle%26artid%3Ds41535-026-00905-4%26doi%3D10.1038/s41535-026-00905-4%26subjmeta%3D301,639,766%26kwrd%3DMaterials+science,Physics", "briefing": {"background": "반호프 특이점(van Hove singularity, vHs)은 전자 밀도 상태가 발산하는 에너지 지점으로, 고온 초전도체나 전하 밀도파(CDW)와 같은 상관 전자계 물리에서 상전이의 핵심적인 역할을 합니다.", "motivation": "일반적인 안장점(saddle point) 형태의 vHs 외에, 밴드 구조에서 나타나는 더 복잡한 위상학적 특이점인 'saddle-loop' 구조를 실험적으로 명확히 관측하고자 했습니다.", "result": "ARPES 등을 통해 특정 물질에서 s-loop 구조의 van Hove 특이점을 직접 관측하였으며, 이는 기존의 점(point)형 특이점보다 밀도 상태의 급격한 변화를 더 크게 유도함을 확인했습니다.", "implication": "vHs를 통한 상태 밀도 제어가 가능한 물질 설계의 범위를 넓혔으며, 이는 AV3Sb5와 같은 Kagome 금속 등에서 나타나는 다양한 상전이 메커니즘을 이해하는 데 중요한 데이터가 됩니다.", "novelty": "일반적인 vHs와 구별되는 'saddle-loop'이라는 독특한 기하학적 전자 구조를 실험적으로 성공적으로 식별했습니다.", "unresolved": "이 관측된 vHs가 구체적으로 어떠한 저에너지 물리 현상(초전도성이나 CDW 등)을 직접적으로 견인하는지에 대한 명확한 인과관계는 추가 연구가 필요합니다.", "future_work": "이 물질에서의 도핑 조절을 통해 vHs를 페르미 준위 근처로 이동시켜, 물리적 물성(전도성, 자기성)의 변화를 관측하는 실험이 이어질 것입니다.", "concepts": [{"term": "Van Hove Singularity", "why_emerged": "결정 내 전자 상태 밀도의 불연속성을 이해하기 위해 필요.", "origin": "Leon Van Hove (1953년).", "connections": "페르미 면, 격자 구조, 위상물질."}, {"term": "Saddle-loop", "why_emerged": "2차원 밴드 구조에서 단순 안장점이 아닌 복잡한 루프 형태의 특이점 분류를 위해 필요.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "Lifshitz 전이, 위상 전자 구조."}], "english_summary": ["Researchers observed a 'saddle-loop' van Hove singularity in an electronic system.", "This structural anomaly in the band topology leads to a more pronounced divergence in the density of states.", "The discovery provides insight into the electronic structure features that drive correlated phenomena.", "Experimental identification was confirmed via spectroscopic methods."]}}, {"title": "Family of magnetic field-boosted superconductors in rhombohedral graphene", "journal": "Nature", "source": "Gemini", "link": "https://www.nature.com/articles/s41586-026-10815-x", "authors": "Junseok Seo, Armel A. Cotten, Shenyong Ye, et al.", "last_authors": "Dominik M. Zumbühl, Long Ju", "summary": "Nature, Published online: 29 June 2026; doi:10.1038/s41586-026-10815-x Family of magnetic field-boosted superconductors in rhombohedral graphene", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "High-impact experimental study of unconventional superconductivity in a relevant 2D quantum material system.", "tags": ["graphene", "superconductivity", "2Dmaterials"], "image": "https://pubads.g.doubleclick.net/gampad/ad?iu=/285/nature.com/article&sz=728x90&c=469914991&t=pos%3Dtop%26type%3Darticle%26artid%3Ds41586-026-10815-x%26doi%3D10.1038/s41586-026-10815-x%26techmeta%3D120%26subjmeta%3D1003,119,639,766,995%26kwrd%3DElectronic+properties+and+materials,Superconducting+properties+and+materials", "briefing": {"background": "마법 각도 트위스트 이중층 그래핀을 넘어, 최근 다층 그래핀 시스템, 특히 능면체 적층(rhombohedral) 그래핀에서의 초전도성은 강한 전자 상관관계에 기반한 새로운 연구 분야입니다.", "motivation": "자기장 하에서 파괴되지 않고 오히려 초전도성이 증진되는 기이한 현상들의 근원을 이해하고, 그 보편성을 확인하고자 했습니다.", "result": "능면체 적층 그래핀에서 자기장에 의해 초전도 상태가 강화되는 'Field-boosted' 거동을 발견하였으며, 이는 이 물질군이 매우 풍부한 위상 및 상관 물리적 특성을 가짐을 시사합니다.", "implication": "자기장 반응을 통해 능면체 그래핀의 초전도 상태가 기존의 BCS 이론을 벗어난 비전통적 메커니즘을 가질 가능성을 강력히 시사합니다.", "novelty": "특정한 적층 구조를 가진 그래핀에서 자기장을 이용한 초전도성 제어가 가능하다는 점을 입증하여, van der Waals 이종접합 소자의 새로운 가능성을 열었습니다.", "unresolved": "이러한 자기장 부스트 효과의 미시적인 원인(예: 밸리 스핀, 전자-포논 결합, 혹은 스핀 분극 상태의 역할)은 아직 명확히 규명되지 않았습니다.", "future_work": "주사 터널링 현미경(STM)을 이용한 국소 상태 밀도 측정 및 자기장 하에서의 수송 현상에 대한 상세한 분석이 필요합니다.", "concepts": [{"term": "Rhombohedral Graphene", "why_emerged": "적층 방식에 따른 그래핀의 서로 다른 전자 밴드 구조 및 상관 효과를 연구하기 위해.", "origin": "물질 구조적 특징은 고체 물리 기초.", "connections": "트위스트 그래핀, 2D 초전도."}, {"term": "Field-boosted Superconductivity", "why_emerged": "자기장이 초전도를 파괴한다는 파울리 제한(Pauli limit)을 극복하는 새로운 초전도 메커니즘 탐색.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "스핀-궤도 결합, 강한 상관관계."}], "english_summary": ["A new family of superconductors in rhombohedral graphene is reported.", "The study highlights the anomalous effect where superconductivity is boosted by an external magnetic field.", "This suggests a non-trivial pairing mechanism potentially linked to the unique rhombohedral stacking.", "The results expand the landscape of 2D superconducting materials under extreme conditions."]}}, {"title": "Surface d-orbital order in an intermetallic compound", "journal": "Nature_Physics", "source": "Gemini", "link": "https://www.nature.com/articles/s41567-026-03359-4", "authors": "Zhanyang Hao, Haohao Sheng, Wanru Ma, et al.", "last_authors": "Zhijun Wang, Chaoyu Chen", "summary": "Nature Physics, Published online: 29 June 2026; doi:10.1038/s41567-026-03359-4 Whether orbital order can exist with a clear band-structure fingerprint in correlated materials has remained unresolved. Now an orbital order from rare earth 5d electrons without structural or magnetic order is seen in an intermetallic compound.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Direct evidence of orbital order affecting band structure in a correlated system.", "tags": ["electronicstructure", "correlatedelectrons", "orbitalorder"], "image": "https://media.springernature.com/m685/springer-static/image/art%3A10.1038%2Fs41567-026-03359-4/MediaObjects/41567_2026_3359_Fig1_HTML.png", "briefing": {"background": "상관 전자 계에서 궤도 정렬(orbital order)은 전하 밀도 파(CDW)나 자기 정렬과 밀접하게 연관되어 종종 병행하지만, 구조적 또는 자기적 변화 없이 순수한 궤도 정렬만이 전자 구조에 뚜렷한 지문을 남기는 경우는 규명하기 매우 어려웠습니다.", "motivation": "희토류 5d 전자 시스템에서 궤도 정렬이 구조적/자기적 전이 없이 단독으로 존재할 수 있는지, 그리고 그것이 ARPES 등을 통해 관측 가능한 전자 구조의 변화를 유도하는지 확인하고자 했습니다.", "result": "희토류 금속간 화합물에서 구조적/자기적 정렬 없이 희토류 5d 전자만의 궤도 정렬이 존재하며, 이것이 전자 밴드 구조에 뚜렷한 변화를 일으킴을 실험적으로 입증했습니다.", "implication": "상관 전자계에서 궤도 자유도가 독립적인 질서 변수(order parameter)로 작동할 수 있음을 시사하며, 이는 향후 강상관 물질의 새로운 상을 이해하는 데 중요한 기초가 됩니다.", "novelty": "구조나 자기적 순서가 없는 상태에서 전자 밴드 구조에 나타나는 궤도 정렬의 직접적인 신호를 포착했다는 점이 핵심입니다. 이는 ARPES를 통한 밴드 구조 분석의 정밀도를 보여줍니다.", "unresolved": "이 궤도 정렬이 어떠한 물리적 기작(예: 쿨롱 상호작용 또는 기타 숨겨진 상호작용)에 의해 발생했는지에 대한 미세한 원리는 추가 연구가 필요합니다.", "future_work": "해당 궤도 정렬이 유도하는 동적 특성이나, 온도/압력 변화에 따른 상전이 여부를 심도 있게 연구할 것으로 보입니다.", "concepts": [{"term": "궤도 정렬(Orbital Order)", "why_emerged": "전자의 궤도 자유도가 결정 격자 내에서 특정 방향으로 배향되어 에너지 이득을 얻으려는 경향 때문에 등장했습니다.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "쿨롱 상호작용, Jahn-Teller 효과, 강상관 전자계."}], "english_summary": ["Identified pure orbital order in rare-earth 5d electrons within an intermetallic compound.", "The order manifests as a clear signature in the electronic band structure.", "Observed without structural distortion or magnetic ordering.", "Provides experimental evidence for orbital degrees of freedom as an independent order parameter."]}}, {"title": "Ultrashort light pulses can transform a semiconductor into a topological insulator", "journal": "Nature_Physics", "source": "Gemini", "link": "https://www.nature.com/articles/s41567-026-03340-1", "authors": "Authors not available in source RSS", "last_authors": "", "summary": "Nature Physics, Published online: 26 June 2026; doi:10.1038/s41567-026-03340-1 The electronic structure of materials can be tailored using pulses of light, and through this so-called Floquet engineering, novel materials can be designed. Now, the technique has been used to create light-induced metallic surface states in the band gap of a semiconductor — transforming the material, transiently, into a topological insulator.", "tier": "B_IMPORTANT  "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2606.27716", "authors": "Kenji Tanabe, Ko Mibu, Atsushi Tsukazaki, Kohei Fujiwara", "last_authors": "Atsushi Tsukazaki, Kohei Fujiwara", "summary": "arXiv:2606.27716v1 Announce Type: new Abstract: Amorphous magnetic films are promising for anomalous-Nernst heat-flux sensing because their low thermal conductivity can enhance the temperature gradient generated by an applied heat flux. However, amorphization often degrades electronic transport and thermoelectric properties, making it challenging to obtain a large anomalous Nernst response in structurally disordered films. Here, we demonstrate nanometer-thick amorphous Fe-Sn films as high-sensitivity anomalous-Nernst heat-flux sensing materials. By systematically controlling composition and thickness, we find that amorphous Fe-Sn nanofilms combine a large anomalous Nernst response with low thermal conductivity, resulting in a heat-flux sensitivity of 0.37 um/A. This value exceeds the sensitivities reported for both amorphous magnetic thin films and representative crystalline topological magnets. X-ray diffraction and Mossbauer spectroscopy show that the optimized films lack long-range crystallinity while retaining local Fe-Sn environments, suggesting that short-range atomic order contributes to the anomalous Nernst response in the amorphous matrix. The sensitivity is also reproduced on flexible polymer substrates, indicating compatibility with mechanically compliant device architectures. These results establish amorphous Fe-Sn nanofilms as a platform for anomalous-Nernst heat-flux sensing and provide a materials design route based on local-structure control and thermal-conductivity reduction.", "tier": "C_MAYBE", "score": "7", "reason": "Topological transport study, interesting for anomalous Hall/Nernst magnetic materials research.; tier capped to C: formal/generic theory watch", "tags": ["topological", "transport", "magnetic"], "image": "https://arxiv 7707v2 Announce Type: replace Abstract: The chiral-induced spin selectivity (CISS) effect describes an observed correlation between the orientation of an electron spin transported or transferred through a molecule and that molecule's chirality. Suitable molecules are usually arranged as self-assembled monolayers (SAMs), and the primary CISS systems are based on multiple nanometer-long biomolecules exhibiting helical chirality. Aside from these typically thiolate-anchored molecules, phosphonic and phosphoric acid SAMs may well become significant for those CISS applications that require a more robust molecular coupling to metal oxide surfaces. In this work, we report on our studies, employing the aromatic, low-molecular-mass, axially chiral organophosphoric acid derivative 1,1'-binaphthyl-2,2'-diyl hydrogenphosphate (BNP). Grown as a roughly 1 nm thin SAM on top of a NiOx/Ni substrate, a strong circular dichroism signal indicates that the thin films preserved chirality. The CISS response exhibits a high magnetoresistance with a spin polarization of 50-80% when measured using magnetic-conductive atomic force microscopy. For biases above 0.5 V, the magnetoresistance curves could be well fitted to the Fowler-Nordheim (FN) tunneling model. Using a minimal FN model, we determined that, depending on the magnetization direction and the handedness of the molecules, electrons of a certain spin direction face an effective tunneling barrier at high bias, which is either 80 % higher or 40 % lower compared to the barrier for electrons of the opposite spin direction. Due to the small size of the molecules, their compatibility with oxide materials, and their commercial availability, they are excellent candidates for the realization of novel (nanoscale) organic spintronic devices.", "tier": "C_MAYBE", "score": "7", "reason": "CISS effect in thin monolayers, relevant experimental spintronics context.; tier capped to C: formal/generic theory watch", "tags": ["spintronics", "monolayer", 73v1 Announce Type: new Abstract: We report circularly polarized magneto-photoluminescence (MPL) measurements on the enantiomeric pair of two-dimensional chiral perovskites R- and S-(C4H9NH3)2PbI4 in pulsed magnetic fields up to 50 T at 4.2 K. The R-form exhibits strong preferential emission into the RC channel (I_RC/I_LC = 10:1), with the S-form showing the opposite sense, robust against the applied field. Three key observations are reported: (i) an anomalous redshift of all exciton transition energies with increasing field-contrasting with the normal diamagnetic blueshift of achiral perovskites-with a non-monotonic initial blueshift to 7.6 T in the dominant RC channel of the R-form; (ii) complete invariance of PL peak positions upon reversal of the field direction, consistent with Rashba-induced mixing of the bright exciton with a nearby m_x = 0 dark state; and (iii) field-induced increase in PL intensity and narrowing of the linewidth, attributed to suppression of disorder scattering as the cyclotron orbit contracts. These results are interpreted in the framework of Rashba spin-splitting and polaron formation in the chiral two-dimensional perovskite lattice.", "tier": "C_MAYBE", "score": "7", "reason": "Magneto-optical spectroscopy study of chiral materials under high fields, good benchmark for magneto-ARPES context.; tier capped to C: formal/generic theory watch", "tags": ["magneto-optical", "chiral", "perovskites"], "image": "https://arxiv.org/static/browse/0.3.4/images/arxiv-logo-fb.png", "briefing": {"background": "자동 브리핑을 생성하지 못했습니다. 초록과 원문 링크를 기준으로 빠르게 확인하세요.", "motivation": "초록 정보만으로는 분야 내부의 구체적 동기를 안정적으로 요약하기 어렵습니다.", "result": "arXiv:2606.27673v1 Announce Type: new Abstract: We report circularly polarized magneto-photoluminescence (MPL) measurements on the enantiomeric pair of two-dimensional chiral perovskites R- and S-(C4H9NH3)2PbI4 in pulsed magnetic fields up to 50 T at 4.2 K. The R-form exhibits strong preferential emission into the RC channel (I_RC
