<title>Daily Paper Slideshow</title>
<style>
  :root {
    color-scheme: light;
    --bg: #f6f7f4;
    --paper: #ffffff;
    --ink: #111827;
    --muted: #64748b;
    --line: #d8ddd2;
    --accent: #176b87;
    --accent-2: #9a3412;
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; overflow: auto; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: var(--bg); color: var(--ink); }
  .shell { max-width: 1500px; min-height: 100vh; margin: 0 auto; padding: 14px 18px; display: flex; flex-direction: column; }
  .topbar { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 16px; }
  .top-actions { display: flex; align-items: center; gap: 10px; }
  .topbar a, button { border: 1px solid var(--line); border-radius: 8px; background: var(--paper); color: var(--ink); padding: 10px 14px; font-weight: 700; text-decoration: none; cursor: pointer; }
  button.primary { background: var(--accent); border-color: var(--accent); color: white; }
  button:disabled { opacity: 0.45; cursor: not-allowed; }
  .counter { color: var(--muted); font-weight: 700; }
  .slide { min-height: calc(100vh - 82px); background: var(--paper); border: 1px solid var(--line); border-radius: 10px; padding: 18px; box-shadow: 0 18px 42px rgba(15, 23, 42, 0.10); display: grid; grid-template-columns: minmax(310px, 0.86fr) minmax(0, 1.55fr); gap: 18px; overflow: visible; }
  .paper-head { min-width: 0; min-height: 0; overflow: visible; display: flex; flex-direction: column; gap: 12px; }
  .figure { margin: 0; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: #f8fafc; }
  .figure img { display: block; width: 100%; max-height: 41vh; object-fit: contain; background: white; }
  .figure figcaption { padding: 7px 10px; color: var(--muted); font-size: 12px; line-height: 1.3; }
  .head-text { display: flex; flex-direction: column; gap: 9px; min-width: 0; }
  .badges { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .badge { border-radius: 999px; padding: 5px 9px; background: #eef2ff; color: #3730a3; font-size: 12px; font-weight: 800; }
  .score { background: #fee2e2; color: #991b1b; }
  h1 { margin: 0; font-size: 25px; line-height: 1.15; letter-spacing: 0; overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
  h1 a { color: inherit; text-decoration-color: rgba(23, 107, 135, 0.35); text-decoration-thickness: 2px; text-underline-offset: 4px; }
  h1 a:hover { color: var(--accent); text-decoration-color: var(--accent); }
  .meta, .authors, .why, .abstract { font-size: 13px; line-height: 1.45; }
  .meta, .authors { color: var(--muted); }
  .why strong, .abstract strong, .authors strong { color: var(--ink); }
  .authors { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .why { border-left: 4px solid var(--accent-2); padding-left: 10px; color: #374151; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .abstract { border-top: 1px solid var(--line); padding-top: 14px; color: #374151; }
  .original-abstract { border-top: 1px solid var(--line); padding-top: 10px; color: #374151; font-size: 11.5px; line-height: 1.35; overflow-wrap: anywhere; }
  .original-abstract strong { display: block; margin-bottom: 4px; color: var(--ink); }
  .tags { display: flex; flex-wrap: wrap; gap: 8px; }
  .tag { border-radius: 999px; padding: 4px 8px; background: #f1f5f9; color: #475569; font-size: 12px; font-weight: 700; }
  .head-text > .link { display: none; }
  .briefing { min-width: 0; min-height: 0; overflow: visible; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); grid-auto-rows: minmax(0, auto); align-content: start; gap: 11px 18px; border-top: 0; padding-top: 0; }
  .brief-section { min-width: 0; }
  .brief-section.wide { grid-column: 1 / -1; }
  .brief-section h2 { margin: 0 0 4px; font-size: 14px; line-height: 1.22; color: #0f766e; letter-spacing: 0; }
  .brief-section p, .brief-section li { margin: 0; font-size: 12.5px; line-height: 1.42; color: #1f2937; overflow-wrap: anywhere; }
  .brief-section ul { margin: 0; padding-left: 20px; }
  .concepts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 9px 14px; }
  .concept { border-top: 1px solid var(--line); padding-top: 7px; }
  .concept h3 { margin: 0 0 4px; font-size: 13px; color: #7c2d12; letter-spacing: 0; }
  .concept p { margin: 2px 0 0; font-size: 11.5px; line-height: 1.35; color: #374151; overflow-wrap: anywhere; }
  .concept b { color: #111827; }
  .link { color: var(--accent); font-weight: 800; text-decoration: none; }
  .empty { padding: 48px; background: var(--paper); border: 1px solid var(--line); border-radius: 12px; color: var(--muted); }
  @media (max-width: 860px) {
    .shell { padding: 14px; }
    .topbar, .top-actions { align-items: stretch; flex-direction: column; }
    .slide, .briefing, .concepts { grid-template-columns: 1fr; }
    .slide { min-height: auto; overflow: visible; display: grid; }
    h1 { font-size: 28px; }
  }
</style>

in": "C. M. Varma (가설 제안).", "connections": "가고메 금속, TRSB, 비통상적 초전도성."}, {"term": "TRSB", "why_emerged": "시스템의 자성 혹은 위상학적 특성을 구분하기 위해 사용됨.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "가고메 격자 물리, 비전통적 초전도."}], "english_summary": ["Provides microscopic evidence for imaginary charge density waves in CsV3Sb5.", "Confirms spontaneous time-reversal symmetry breaking in the kagome metal.", "Validates the role of loop currents in the CDW state of V-based kagome systems.", "Advances the understanding of the interplay between correlation and topology."]}}, {"title": "Room-Temperature Intrinsic Nonlinear Planar Hall Effect in TaIrTe4", "journal": "PRL_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/hbdj-2hgf", "authors": "Chang Jiang, Fan Yang, Yu Zhao, et al.", "last_authors": "Shaoming Dong, Faxian Xiu", "summary": "Author(s): Chang Jiang, Fan Yang, Yu Zhao, Jinshan Yang, Peng Yu, Huiying Liu, Yuda Zhang, Zehao Jia, Xiangyu Cao, Li Tian, Jingyi Yan, Zheng Liu, Zhongkai Liu, Xian-Lei Sheng, Cong Xiao, Shengyuan A. Yang, Shaoming Dong, and Faxian Xiu A room-temperature intrinsic nonlinear planar Hall effect in the nonmagnetic topological semimetal TaIrTe 4 reveals how an in-plane magnetic field generates a Berry-connection-polarizability dipole through an orbital mechanism. [Phys. Rev. Lett. 136, 236302] Published Fri Jun 12, 2026", "tier": "A_MUST_READ", "score": "9", "reason": "Directly relevant topological semimetal TaIrTe4; connects to 112 tellurides and Berry curvature dipole physics.", "tags": ["material", "topologicalsemimetal", "transport"], "image": "", "briefing": {"background": "위상 절연체 및 위상 반금속 연구에서 Berry 곡률(Berry curvature)은 전자 수송 특성에 중요한 역할을 합니다. 특히 비선형 응답은 물질의 대칭성에 대한 정보를 담고 있어 새로운 전자 소자 응용 가능성을 제시합니다.", "motivation": "TaIrTe4와 같은 위상 반금속에서 실온 조건 하에 비선형 평면 홀 효과(Nonlinear Planar Hall Effect)를 관측하여, 그 원인인 베리 연결 편극 쌍극자(Berry-connection-polarizability dipole)의 메커니즘을 밝히고자 함.", "result": "TaIrTe4에서 실온 비선형 평면 홀 효과를 발견하였으며, 이는 궤도 기제(orbital mec }, {"title": "General ab initio framework for electronic-order–induced lattice-dynamics symmetry breaking", "journal": "Science_Advances", "source": "Gemini", "link": "https://doi.org/10.1126/sciadv.aed7081", "authors": "Shuai Zhang, Mengqi Wang, Pan Zhang, Tiantian Zhang", "last_authors": "Pan Zhang, Tiantian Zhang", "summary": "Conventional ab initio approaches are unable to describe phonon time-reversal symmetry ( T ) breaking. Here, we develop an ab initio framework, grounded in molecular Berry curvature (MBC) theory, which captures electronic-order–driven symmetry breaking in lattice dynamics. Using Co 3 Sn 2 S 2 as a model system, our ab initio framework yields phonon spectra that break both T and mirror symmetries, quantitatively reproduce the observed phonon splittings observed in experiments, and reveal distinct microscopic origins for the E g and E u modes: E g splitting is governed by MBC and is accurately captured by our algorithm, whereas E u splitting is enhanced by the Fano resonance and matches the experimental data once the Fano-factor correction is included. Leveraging this algorithm, we predict several candidate materials with nonzero electronic-order–driven symmetry breaking in lattice dynamics, establishing a first-principles route to understand electron-phonon coupling, phonon magnetism, and related Hall-type lattice responses.", "tier": "B_IMPORTANT_CONDMAT", "score": "9", "reason": "Ab initio framework for Berry curvature and TRSB in Co3Sn2S2, relevant to topological semimetals.", "tags": ["theory", "electronic_structure", "DFT", "phonons", "Berry_curvature", "TRSB", "topological_semimetal", "Co3Sn2S2"], "image": "", "briefing": {"background": "기존 제일원리 계산(DFT)은 시간반전대칭(T)이 깨진 계의 격자 동역학을 다루는 데 한계가 있어, 위상 물질의 자기적 위상 전이를 이해하는 데 어려움이 있었음.", "motivation": "분자 베리 곡률(Molecular Berry Curvature) 이론을 도입하여 전자적 질서에 의해 유도되는 격자 대칭성 파괴를 정량적으로 계산할 수 있는 프레임워크를 개발하고자 함.", "result": "Co3Sn2S2를 모델로 하여, E_g 및 E_u 포논 모드의 분리(splitting)를 MBC 이론으로 성공적으로 재현하고 예측함.", "implication": "자기 위상 물질의 격자 동역학을 제일원리 수준에서 이해할 수 있게 되어, 포논 자기(phonon magnetism) 및 Hall 타입 격자 응답을 설계할 수 있는 길을 열었음.", "novelty": "위상 반금속에서 포논 스펙트럼의 대칭성 파괴를 다룬 이론적 진보로, 특히 강상관계 및 위상 물리 연구자에게 중요한 분석 툴을 제공함.", "unresolved": "복잡한 강상관 시스템에서 Fano 공명 효과가 지배적인 경우의 범용적 적용성은 추가 검증이 필요함.", "future_work": "제안된 알고리즘을 사용하여 다른 자기 위상 후보 물질들에 대한 격자 응답 예측 및 실험적 검증.", "concepts": [{"term": "Molecular Berry Curvature (MBC)", "why_emerged": "격자 진동(포논)이 전자 시스템의 위상적 성질과 결합할 때 나타나는 기하학적 위상 효과를 기술하기 위해 필요함.", "origin": "초록 정보만으로는 특정하기 어려움 (최근 위상 포노닉스 분야에서 발전).", "connections": "Berry curvature, 시간반전대칭 파괴, 위상 반금속."}, {"term": "Phonon Splitting", "why_emerged": "결정 내 대칭성이 깨질 때 축퇴되어 있던 포논 모드들이 분리되며 나타나는 현상으로, 자성 위상 정보의 직접적인 지표가 됨.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "자성 order, 라만 분광법, 중성자 산란."}], "english_summary": ["Introduces an ab initio framework for T-symmetry breaking in lattice dynamics.", "Utilizes Molecular Berry Curvature to describe electronic-order-induced symmetry breaking.", "Successfully predicts phonon splitting in Co3Sn2S2, matching experimental data.", "Provides a theoretical tool for exploring phonon magnetism and Hall-type lattice responses."]}}, {"title": "Field-free Josephson diode and tunable ϕ0-junction in chiral kagome antiferromagnets", "journal": "npj_QuantumMaterials", "source": "Gemini", "link": "https://www.nature.com/articles/s41535-026-00907-2", "authors": "Jin-Xing Hou, Chuang Li, Lun-Hui Hu, Song-Bo Zhang", "last_authors": "Lun-Hui Hu, Song-Bo Zhang", "summary": "npj Quantum Materials, Published online: 17 June 2026; doi:10.1038/s41535-026-00907-2 Field-free Josephson diode and tunable ϕ 0 -junction in chiral kagome antiferromagnets", "tier": "B_IMPORTANT_CONDMAT", "score": "9", "reason": "Direct relevance to kagome magnetism and topological phase phenomena in correlated systems.", "tags": ["kagome", "magnetism", "Josephson"], "image": "https://pubads.g.doubleclick.net/gampad/ad?iu=/285/npjquantmats.nature.com/article&sz=728x90&c=271105985&t=pos%3Dt n diode effect in quasi-1D topological nanowires.", "Explores the role of multi-subband regimes in enhancing supercurrent asymmetry.", "Demonstrates the importance of Majorana bound states in driving the effect.", "Provides a theoretical pathway for robust superconducting logic components."]}}, {"title": "Interplay between many-body correlations, strain, and lattice relaxation in twisted bilayer graphene", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/x2mz-hm8y", "authors": "Lorenzo Crippa, Gautam Rai, Dumitru Călugăru, et al.", "last_authors": "Giorgio Sangiovanni, Tim Wehling", "summary": "Author(s): Lorenzo Crippa, Gautam Rai, Dumitru Călugăru, Haoyu Hu, Jonah Herzog-Arbeitman, B. Andrei Bernevig, Roser Valentí, Giorgio Sangiovanni, and Tim Wehling Here, the authors explain a set of experimental features that, while ubiquitously observed in twisted bilayer graphene samples, have so far eluded a unified theoretical description. A broad range of spectral, response, and thermodynamic properties in twisted bilayer graphene is accurately described microscopically and traced to the interplay of electronic correlations, lattice strain, and structural relaxation. The results are in excellent agreement with multiple recent experiments including scanning tunneling and quantum twisting microscopy experiments. [Phys. Rev. B 113, L241112] Published Wed Jun 17, 2026", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Comprehensive study of moire physics relevant to the user profile.", "tags": ["moire", "graphene", "experiment"], "image": "", "briefing": {"background": "뒤틀린 이중층 그래핀(Twisted Bilayer Graphene, TBG)은 매직 앵글 부근에서 나타나는 강력한 전자 상관관계와 평탄 밴드(flat bands) 물리로 인해 모아레(moire) 물리학의 핵심 연구 대상입니다.", "motivation": "그동안 실험적으로 관찰된 TBG의 다양한 분광학적, 열역학적 특성들이 개별적으로는 보고되었으나, 이를 전자 상관관계, 격자 변형, 구조적 완화 효과를 통합하여 설명하는 미시적 이론이 부족했습니다.", "result": "전자 상관관계와 격자 변형 및 완화 사이의 상호작용을 고려한 통합 모델을 제시하여, STM 및 양자 뒤틀림 현미경(Quantum Twisting Microscopy) 등 최신 실험 결 ttices", "journal": "PRL_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/yh3v-pwz9", "authors": "Henri Menke, Niklas Enderlein, Roland Gillen, et al.", "last_authors": "Giorgio Sangiovanni, Philipp Hansmann", "summary": "Author(s): Henri Menke, Niklas Enderlein, Roland Gillen, Yi-Ting Tseng, Michel Bockstedte, Janina Maultzsch, Giorgio Sangiovanni, and Philipp Hansmann We propose three transition-metal adatom systems on SiC surfaces as a versatile platform to realize massless Dirac fermions and flat bands with strong electronic correlations. Using density functional theory combined with the constrained random phase approximation and dynamical mean-field theory, we… [Phys. Rev. Lett. 136, 246503] Published Thu Jun 18, 2026", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Electronic structure engineering of Dirac fermions and flat bands, involving strong correlations and DFT+DMFT.", "tags": ["electronic_structure", "Dirac_fermions", "flat_bands", "correlated_electrons", "DFT+DMFT", "computational_materials"], "image": "", "briefing": {"background": "표면 물리 및 나노 구조체에서의 전자 구조 엔지니어링은 위상 물질 및 강한 상관관계 물리 현상을 인위적으로 구현하기 위한 핵심 분야입니다. 실리콘 카바이드(SiC) 기판 위의 흡착 구조는 2D 물질을 넘어선 새로운 양자 상태 제어 플랫폼으로 주목받고 있습니다.", "motivation": "SiC 표면 상의 전이 금속 흡착 원자 배열을 통해 디락 페르미온과 플랫 밴드를 동시에 생성하고, 여기에 전자의 강한 상관관계를 도입하여 새로운 양자 위상이나 초전도 등 다체 물리학적 현상을 탐구하고자 함입니다.", "result": "DFT+DMFT 등 고도화된 계산 기법을 사용하여, 특정 전이 금속 흡착 시스템이 질량이 없는 디락 페르미온과 플랫 밴드를 동시에 가질 수 있음을 이론적으로 규명했습니다.", "implication": "이러한 인공 격자 설계는 위상 물질과 상관관계 전자 시스템이 공존하는 새로운 물질 설계의 청사진을 제공하며, ARPES를 통한 실험적 검증의 이론적 토대가 됩니다.", "novelty": "DFT+DMFT와 같은 정교한 다체 계산을 결합하여, 단순한 밴드 구조 설계를 넘어 전자 상관관계까지 고려한 물질 설계라는 점에서 귀하의 전자 구조 연구 관심사와 부합합니다.", "unresolved": "실제 실험적 구현 시 표면 결함이나 도핑 농도에 따른 밴드 구조의 변화, 기판과의 하이브리드화 정도에 대한 구체적인 정량적 불확실성이 남아있습니다.", "future_work": "실제 분자 빔 에피택시(MBE)를 이용한 샘플 제작 및 ARPES를 이용한 디락 콘 및 플랫 밴드의 분산 관계 직접 관측이 필요합니다.", "concepts": [{"term": "Flat Band", "why_emerged": "밴드 폭이 극도로 좁아진 상태에서는 운동 에너지가 억제되고 전자 간 상호작용이 지 n C. W. Song", "last_authors": "Giovanni Vignale, Justin C. W. Song", "summary": "Author(s): Oles Matsyshyn, Giovanni Vignale, and Justin C. W. Song Superconductivity and Bloch band Berry curvature responses represent two distinct paradigms of quantum coherent phenomena. The former relies on the collective motion of Cooper pairs while the latter proceeds from the momentum-space winding of Bloch wave functions. Here, we reveal a superconducting B… [Phys. Rev. Lett. 136, 246902] Published Thu Jun 18, 2026", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Theoretical concept combining Berry curvature and superconductivity with implications for experimental responses.", "tags": ["superconductivity", "Berry_curvature", "theory", "electronic_properties"], "image": "", "briefing": {"background": "응집물질물리학에서 초전도 현상과 베리 곡률(Berry curvature)은 양자 결맞음 현상을 이해하는 두 가지 중요한 기둥입니다. 전자는 쿠퍼 쌍의 집단적 거동을, 후자는 운동량 공간에서 블로흐 파동 함수의 위상적 회전을 다룹니다.", "motivation": "이 연구는 초전도 상태가 베리 곡률과 결합할 때 발생하는 새로운 양자 반응을 이론적으로 규명하고자 합니다.", "result": "초전도 상태에서 베리 곡률 쌍극자(Berry curvature dipole)가 존재할 수 있으며, 이것이 초전도체 내의 비선형 전자기적 응답을 유도할 수 있음을 보였습니다.", "implication": "초전도체에서도 베리 곡률 기반의 수송 현상을 관측하거나 제어할 수 있는 가능성을 제시하며, 비중심대칭 초전도체에서 새로운 물리 현상을 탐색하는 기초가 됩니다.", "novelty": "기존의 정상 상태(normal state)에서 주로 논의되던 베리 곡률 효과를 초전도 응축(superconducting condensate) 영역으로 확장했다는 점이 독창적입니다.", "unresolved": "실제 실험적 관측을 위해 요구되는 구체적인 물질 시스템이나 외부 파라미터 조건은 추가 연구가 필요합니다.", "future_work": "초전도 베리 곡률 쌍극자가 비선형 홀 효과(Nonlinear Hall effect) 등에 미치는 정량적 예측 및 실험적 검증이 기대됩니다.", "concepts": [{"term": "베리 곡률 쌍극자", "why_emerged": "운동량 공간에서 베리 곡률의 비대칭적 분포를 기술하기 위해 도입되었습니다.", "origin": "Fu (2015) 등에 의해 비선형 홀 효과와 관련하여 제안되었습니다.", "connections": "비선형 수송 현상, 위상학적 수송 특성."}, {"term": "초전도 응축", "why_emerged": "쿠퍼 쌍이 결맞음 상태를 형성하는 양자역학적 상태를 설명하기 위해 필요합니다.", "origin": "BCS 이론(Bardeen, Cooper, Schrieffer, 1957).", "connections": "마이스너 효과, 조셉슨 효과."}], "english_summary": ["The study links superconductivity with Bloch band Berry curvature responses.", "It theoretically demonstrates the existence of a superconducting Berry curvature dipole.", "This finding suggests novel nonlinear electromagnetic responses in superconducting materials.", "The work expands the application of Berry curvature physics to Cooper pair condensate."]}}, {"title": "Topological quantum materials: kagome, chiral, and square-net frameworks", "journal": "npj_QuantumMaterials", "source": "Gemini", "link": "https://www.nature.com/articles/s41535-026-00902-7", "authors": "Avdhesh K. Sharma, Snehashish Chatterjee, Premakumar Yanda, Claudia Felser, Chandra Shekhar", "last_authors": "Claudia Felser, Chandra Shekhar", "summary": "npj Quantum Materials, Published online: 11 June 2026; doi:10.1038/s41535-026-00902-7 Topological quantum materials: kagome, chiral, and square-net frameworks", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Comprehensive review on kagome and topological lattices relevant to AV3Sb5 materials.", "tags": ["kagome", "review", "topology"], "image": "https://pubads.g.doubleclick.net/gampad/ad?iu=/285/npjquantmats.nature.com/article&sz=728x90&c=1920987270&t=pos%3Dtop%26type%3Darticle%26artid%3Ds41535-026-00902-7%26doi%3D10.1038/s41535-026-00902-7%26subjmeta%3D301,639,766%26kwrd%3DMaterials+science,Physics", "briefing": {"background": "위상 양자 물질 연구는 복잡한 전자 구조와 위상학적 비자명성을 가진 새로운 물질군을 찾는 것을 목표로 하며, 이는 차세대 전자 소자 및 양자 정보 처리에 핵심적입니다.", "motivation": "AV3Sb5와 같은 카고메 금속 및 기타 격자 구조에서 발견되는 위상적 물리 현상을 통합적으로 정리하고 향후 전망을 제시하고자 합니다.", "result": "카고메 격자, 카이랄 구조, 사각형 격자 등 다양한 결정 구조에서의 위상적 상태를 분류하고, 이들이 어떻게 독특한 전자 구조적 특성을 발현하는지 요약하였습니다.", "implication": "AV3Sb5 등 강상관 카고메 금속 연구의 이론적 배경과 실험적 현상을 체계화하여 향후 위상 물질 탐색의 가이드라인을 제공합니다.", "novelty": "독자가 연구 중인 AV3Sb5 및 관련 Kagome 물질의 위상학적 문맥을 폭넓게 이해할 수 있는 종합적인 리뷰입니다.", "unresolved": "다양한 격자 구조에서 위상성과 강상관 효과가 공존할 때 발생하는 경쟁적인 질서(CDW, 초전도 등)의 정밀한 미시적 메커니즘은 여전히 논의 중입니다.", "future_work": "새로운 위상 위상을 가진 신소재 합성 및 이들의 물성 제어 연구가 가속화될 것으로 예상됩니다.", "concepts": [{"term": "카고메 격자", "why_emerged": "기하학적 좌절(frustration) 및 위상적 밴드 의 근본적인 이론 모델을 강화하며, 강상관 전자계에서 창발하는 준입자들의 상호작용을 더 깊이 이해하게 합니다.", "novelty": "실험적으로 접근하기 어려운 분수 양자 홀 상태의 중성 여기를 포착하여 이론적 가설을 강력하게 입증했습니다.", "unresolved": "다양한 필링 팩터(filling factor) 및 더 복잡한 위상학적 순서에서의 여기 상태에 대한 완벽한 이해는 과제로 남아 있습니다.", "future_work": "관측된 중성 여기의 물성을 이용한 양자 정보 저장 및 제어 연구로 확장될 가능성이 있습니다.", "concepts": [{"term": "파트론(Parton)", "why_emerged": "FQHE의 복잡한 파동 함수를 더 간단한 하위 가상의 입자들의 결합으로 묘사하기 위해 제안되었습니다.", "origin": "Jain (1989) 등의 복합 페르미온 이론과 관련된 파트론 기술 방식.", "connections": "분수 양자 홀 효과, Chern-Simons 이론."}, {"term": "중성 여기(Neutral excitation)", "why_emerged": "전하를 띠지 않는 입자의 들뜸을 통해 양자 홀 액체의 결맞음 특성을 조사하기 위해 필요합니다.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "자기 엑시톤, 마그논, 분수 통계."}], "english_summary": ["Reports experimental evidence for neutral excitations in FQHE systems.", "Supports the validity of the parton description for fractional quantum Hall states.", "Observes chiral spin-2 excitations predicted by geometric theories.", "Enhances the understanding of quasiparticle dynamics in strongly correlated topological phases."]}}, {"title": "Bilateral hydrogenation-induced high-Chern-number quantum anomalous Hall state in monolayer Cr2Ge2Te6", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/vjm5-xhl7", "authors": "Xiang Li, Xin-Wei Yi, Jing-Yang You, et al.", "last_authors": "Gang Su, Bo Gu", "summary": "Author(s): Xiang Li, Xin-Wei Yi, Jing-Yang You, Jia-Wen Li, Qing-Han Yang, Gang Su, and Bo Gu The pursuit of high-temperature quantum anomalous Hall (QAH) insulators faces fundamental challenges, including narrow topological gaps and low Curie temperatures (${T}_{\\text{C}}$) in existing materials. Here, we propose a transformative strategy using bilateral hydrogenation to engineer a robust Q… [Phys. Rev. B 113, 224430] Published Tue Jun 16, 2026", "tier": "B_IMPORTANT_CONDMAT", "score": "7", "reason": "Relevant theory for engineering anomalous Hall/topological states.", "tags": ["anomalous_Hall", "topology", "theory"], "image": "", "briefing": {"background": "양자 변칙 홀(QAH) 효과는 외부 자기장 없이도 위상학적 경계 상태를 통해 무손실 전류를 구현할 수 있어 차세대 전자 소자로 주목받습니다. 하지만 기존 물질들은 매우 낮은 퀴리 온도와 좁은 밴드갭으로 인해 실제 응용에 한계가 있습니다.", "motivation": "본 연구는 기존 Cr2Ge2Te6 단층 물질의 한계를 극복하기 위해 양면 수소화(bilateral hydrogenation)라는 화학적 변형 기법을 사용하여 전자 구조를 조절하고, 보다 안정적인 고차수(high-Chern-number) QAH 상태를 유도하고자 합니다.", "result": "이론적 계산을 통해 양면 수소화가 Cr2Ge2Te6의 밴드 구조를 변형시켜 위상학적 밴드갭을 넓히고, 높은 천 수(Chern number)를 가진 QAH 상태를 안정화할 수 있음을 제시했습니다.", "implication": "이러한 화학적 기능화(functionalization) 전략이 위상학적 물질의 물성을 제어하는 효과적인 수단이 될 수 있음을 보여주며, 고온 QAH 효과 구현을 위한 새로운 물질 설계 방향을 제시합니다.", "novelty": "기존의 물리적 변형 대신 화학적 수소화를 이용해 위상학적 위상을 조절했다는 점이 핵심입니다. 특히 강자성 절연체인 Cr2Ge2Te6를 활용한 점은 위상학적 소자 설계에 관심이 많은 독자에게 유용한 참고 사례가 됩니다.", "unresolved": "실제 실험적 합성을 통해 양면 수소화의 정밀한 구조 제어와 이론적 예측치인 고온에서의 QAH 효과가 그대로 재현될지는 미지수입니다.", "future_work": "실험을 통한 수소화 시료의 제작, 자기 수송 측정을 통한 위상학적 특성 검증, 그리고 도핑이나 기판 효과를 통한 추가적인 밴드 엔지니어링 연구가 필요합니다.", "concepts": [{"term": "Quantum Anomalous Hall (QAH) State", "why_emerged": "외부 자기장 없이 위상학적 비자명성에 의해 정수화된 홀 전도도를 구현하기 위해 필요.", "origin": "Haldane (1988)의 벌집 격자 모델에서 처음 제안됨.", "connections": "위상 절연체, Berry 곡률, anomalous Hall effect."}, {"term": "Chern Number", "why_emerged": "에너지 밴드의 위상학적 특성을 수학적으로 분류하기 위해 도입된 불변량.", "origin": "Thouless, Kohmoto, Nightingale, den Nijs (TKNN, 1982)에 의해 정립.", "connections": "Berry 위상, 양자 홀 효과, 위상학적 전이."}], "english_summary": ["Proposes bilateral hydrogenation to enhance topological properties in monolayer Cr2Ge2Te6.", "Calculations show enlarged topological band gaps and a high Chern number state.", "Offers a chemical engineering strategy for robust high-temperature QAH insulators.", "Provides a theoretical pathway to overcome current Curie temperature limitations."]}}, {"title": "Boosted magnetic fluctuations at the onset of superconductivity in UTe2 beyond 40 T", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/3hzr-5qcs", "authors": "T. Thebault, K. Somesh, G. Lapertot, M. Nardone, A. Zitouni, M. Barragan, et al.", "last_authors": "D. Aoki, G. Knebel, D. Braithwaite, and W. Knafo", "summary": "Author(s): T. Thebault, K. Somesh, G. Lapertot, M. Nardone, A. Zitouni, M. Barragan, J. Béard, J. Billette, F. Lecouturier-Dupouy, S. Tardieu, D. Aoki, G. Knebel, D. Braithwaite, and W. Knafo Multiple triplet-candidate unconventional superconducting phases have been reported in the heavy-fermion compound UTe 2 . Here, the authors find an enhancement of the electrical resistivity Fermi liquid coefficient A at a metamagnetic transition preceding the onset of superconductivity in magnetic fields higher than 40 T. The enhancement of A is attributed to a magnetic fluctuation mode probably in play for the mechanism of this superconducting phase. [Phys. Rev. B 113, L220503] Published Mon Jun 15, 2026", "tier": "B_IMPORTANT_CONDMAT", "score": "7", "reason": "High-field study of heavy-fermion unconventional superconductivity.", "tags": ["superconduct", "heavy-fermion"], "image": "", "briefing": {"background": "UTe2는 중페르미온(heavy-fermion) 물질 중에서도 스핀 삼중항 초전도체 후보 물질로 매우 중요한 연구 대상입니다. 특히 강한 자기장 하에서 나타나는 다양한 초전도 상과 메타자기적 전이의 상관관계는 현대 응집물질물리의 핵심 미해결 과제입니다.", "motivation": "UTe2의 높은 자기장 영역(40 T 이상)에서 관찰되는 초전도 상의 발생 원인을 자기적 요동(magnetic fluctuations)과의 연관성에서 찾고자 합니다.", "result": "40 T 이상의 메타자기적 전이 구간에서 페르미 액체 계수 A가 비정상적으로 증가함을 확인했습니다. 이는 초전도 상태를 매개하는 특정 자기적 요동 모드가 존재할 가능성을 시사합니다.", "implication": "UTe2의 초전도 현상이 자기적 유도에 의한 것임을 강력하게 지지하며, 중페르미온 물질에서 나타나는 비전통적 초전도의 근본적인 메커니즘 이해를 돕습니다.", "novelty": "초강자기장 영역에서 페르미 액체 물성을 측정한 실험적 성과가 돋보입니다. 특히 중페르미온과 초전도의 미시적 연결고리를 실험적으로 포착했다는 점에서 가치가 높습니다.", "unresolved": "관찰된 자기적 요동이 구체적으로 어떤 스핀 구조를 가지는지, 그리고 실제 초전도 페어링 대칭성과 어떻게 결합하는지는 여전히 명확하지 않습니다.", "future_work": "초강자기장 하에서의 중성자 산란 연구나 더 정밀한 자기 공명 실험을 통해 해당 자기적 요동 모드의 동역학적 특성을 직접 관찰할 필요가 있습니다.", "concepts": [{"term": "Heavy-Fermion", "why_emerged": "f-전자와 전도 전자 사이의 강한 교환 상호작용으로 인한 무거운 유효 질량 현상을 설명하기 위해 도입.", "origin": "1970년대 중반 CeAl3 등에서 처음 관찰.", "connections": "Kondo 격자 모델, 비전통적 초전도, 양자 임계점."}, {"term": "Metamagnetic Transition", "why_emerged": "자기장에 따라 자화율이 급격히 변하는 전이 현상을 기술하기 위해 필요.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "자성 상전이, 강상관 전자계, Fermi 표면 재구성."}], "english_summary": ["Investigates UTe2 in magnetic fields exceeding 40 T.", "Reports an enhancement of the Fermi liquid coefficient A near the metamagnetic transition.", "Links the observed magnetic fluctuations to the superconductivity pairing mechanism.", "Provides new experimental data for unconventional superconductivity in heavy-fermion systems."]}}, {"title": "Coupling of magnetic and lattice collective excitations in the two-dimensional van der Waals antiferromagnet FePS3", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/fwb8-fwjb", "authors": "Kartik Panda, Itzik Kapon, Dumitru Dumcenco, Dirk van der Marel, Alexey B. Kuzmenko, Nimrod Bachar", "last_authors": "Alexey B. Kuzmenko, Nimrod Bachar", "summary": "Author(s): Kartik Panda, Itzik Kapon, Dumitru Dumcenco, Dirk van der Marel, Alexey B. Kuzmenko, and Nimrod Bachar We combine polarized infrared magnetotransmission and Faraday angle rotation measurements to map the collective excitations of the van der Waals antiferromagnet ${\\mathrm{FePS}}_{3}$. Below the Néel temperature (${T}_{\\mathrm{N}}≈118\\phantom{\\rule{4pt}{0ex}}\\mathrm{K}$), the phonon spectrum becomes … [Phys. Rev. B 113, 235124] Published Mon Jun 15, 2026", "tier": "B_IMPORTANT_CONDMAT", "score": "7", "reason": "Van der Waals magnetic material study with optical spectroscopy.", "tags": ["material", "magnetism", "spectroscopy"], "image": "", "briefing": {"background": "FePS3는 2차원 반데르발스 반강자성체로, 층상 구조 내에서 자기적 정렬과 격자 진동(포논) 사이의 강한 상호작용이 예상되는 물질입니다. 저차원 자성 물질에서의 스핀-격자 결합은 근본적인 물성 연구와 스핀트로닉스 응용 측면에서 매우 중요합니다.", "motivation": "Néel 온도 이하에서 FePS3의 포논 스펙트럼 변화를 정밀하게 관측하여 자기적 질서와 격자 자유도 사이의 구체적인 결합 양상을 규명하고자 합니다.", "result": "편광 적외선 자성 투과 및 패러데이 회전 측정을 통해 자기적 정렬에 따른 포논 모드의 명확한 변화를 매핑했습니다.", "implication": "반데르발스 자성체에서 자기적 요동과 포논이 어떻게 결합하는지를 보여주는 직접적인 증거를 제공하며, 이러한 물질의 다기능적 특성을 활용할 수 있는 토대를 마련합니다.", "novelty": "광학 분광법을 통해 2차원 물질의 스핀-포논 결합을 높은 분해능으로 시각화했다는 점이 독보적입니다. ARPES나 다른 분광학적 접근을 즐기는 독자에게 보완적 정보를 제공합니다.", "unresolved": "관찰된 스핀-포논 결합이 물질 전체의 물리적 성질, 특히 초전도나 여타 위상학적 상태에 미치는 구체적인 파급 효과는 추가 연구가 필요합니다.", "future_work": "해당 결합이 외부에너지(빛 등)에 의해 제어될 수 있는지에 대한 Floquet 엔지니어링 접근이나 다른 2차원 자성체와의 비교 연구가 기대됩니다.", "concepts": [{"term": "Van der Waals Antiferromagnet", "why_emerged": "층간 결합이 약해 2차원 극한에서 자성을 연구할 수 있는 플랫폼으로 필요.", "origin": "2010년대 이후 그래핀 연구의 연장선에서 재조명됨.", "connections": "2D 자성, 스핀트로닉스, 층상 구조 물질."}, {"term": "Faraday Rotation", "why_emerged": "물질 내 자성 상태가 빛의 편광에 미치는 영향을 측정하여 비접촉 방식으로 자기 질서를 파악하기 위해 사용.", "origin": "Michael Faraday (1845)에 의해 발견.", "connections": "자기-광학 효과, Berry 곡률 측정, 위상학적 물질."}], "english_summary": ["Examines spin-lattice coupling in the 2D van der Waals antiferromagnet FePS3.", "Utilizes polarized infrared magnetotransmission and Faraday rotation spectroscopy.", "Maps collective excitations below the Néel temperature.", "Demonstrates significant phonon spectrum changes linked to magnetic ordering."]}}, {"title": "Direct observation of femtometer-scale atomic displacement driving multiferroicity in TbMnO3: A polarized Raman study", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/j82h-yvz7", "authors": "Pragati Sharma, Binoy Krishna De, Divya Jangra, et al.", "last_authors": "Raman Sankar, Vasant G. Sathe", "summary": "Author(s): Pragati Sharma, Binoy Krishna De, Divya Jangra, R. Mittal, Mayanak K. Gupta, Sivasakthi Kuppusamy, Sritharan Krishnamoorthi, Raman Sankar, and Vasant G. Sathe ${\\mathrm{TbMnO}}_{3}$ is a model type-II multiferroic where ferroelectricity appears with spiral magnetic order, but its microscopic origin remains unresolved. Utilizing novel approach using polarized Raman spectroscopy, we isolate individual Raman tensor and directly provide evidence of anionic di… [Phys. Rev. B 113, L220405] Published Mon Jun 15, 2026", "tier": "B_IMPORTANT_CONDMAT", "score": "7", "reason": "Experimental study of magnetic multiferroicity using sensitive probes.", "tags": ["magnetism", "spectroscopy"], "image": "", "briefing": {"background": "다강체(multiferroic) 물질은 자기적 질서와 전기적 분극이 동시에 존재하는 물질로, 스핀과 전하 자유도 간의 강한 결합을 통해 차세대 소자 응용 가능성이 큽니다. TbMnO3는 스핀 나선 구조와 강유전성이 결합된 대표적인 Type-II 다강체 물질입니다.", "motivation": "TbMnO3에서 자기 질서가 어떻게 강유전성을 유도하는지에 대한 미시적 메커니즘이 여전히 명확하지 않습니다. 본 연구는 편광 라만 분광법을 사용하여 구조적 변위를 미세하게 추적하고자 합니다.", "result": "편광 라만 분광법을 통해 펨토미터(femtometer) 수준의 음이온 변위를 직접 관측하고, 이것이 다강성 현상을 유도하는 핵심 기제임을 입증했습니다.", "implication": "자기-구조적 결합의 미시적 원리를 규명함으로써, 향후 스핀 기반의 전자기 소자 제어 전략에 중요한 통찰을 제공할 것입니다.", "novelty": "기존의 회절 기법으로 포착하기 어려웠던 초미세 구조 변화를 라만 텐서 분석으로 직접 증명했다는 점이 독창적입니다.", "unresolved": "이 미세 변위가 거시적인 강유전적 분극의 전체 크기를 완벽하게 설명할 수 있는지에 대한 정량적 완결성은 추가 검증이 필요합니다.", "future_work": "다른 Type-II 다강체 물질로의 확장 연구 및 온도 변화에 따른 변위의 동역학 관찰이 요구됩니다.", "concepts": [{"term": "Type-II 다강체", "why_emerged": "스핀 질서가 직접 분극을 유도하는 기제를 이해하기 위해 필요함", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "스핀 나선 구조, Dzyaloshinskii-Moriya 상호작용"}, {"term": "편광 라만 분광법", "why_emerged": "물질의 대칭성과 결정 구조의 미세한 변화를 비파괴적으로 탐지하기 위해 필요함", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "격자 진동 모드, 라만 텐서 분석"}], "english_summary": ["TbMnO3 is studied as a prototypical Type-II multiferroic material.", "Polarized Raman spectroscopy isolates specific lattice vibrations.", "Femtometer-scale anionic displacement is identified as the driver for multiferroicity.", "The study provides microscopic evidence for spin-lattice coupling."]}}, {"title": "Giant anomalous Hall conductivity and magnetostriction in heavy-element substituted Co-based all-d Heusler alloys", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/mgsp-4vz9", "authors": "Pengju Wu, Tao Zhu, Chengwu Xie, Hang Li, Wenhong Wang", "last_authors": "Hang Li, Wenhong Wang", "summary": "Author(s): Pengju Wu, Tao Zhu, Chengwu Xie, Hang Li, and Wenhong Wang All-$d$ Heusler alloy  스핀 분할이 일어나는 새로운 자기 위상을 기술하기 위해.", "origin": "초록 정보만으로는 특정하기 어려움 (최근 이론적으로 활발히 제안됨).", "connections": "강자성, 반강자성, 비반전 대칭성 위상 물질."}, {"term": "Optical Phonon", "why_emerged": "결정 격자의 진동 모드가 광학적 성질과 어떻게 상호작용하는지 분석하기 위해.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "라만 분광학, 적외선 분광학, 전자-포논 상호작용."}], "english_summary": ["Investigates the structural symmetry and phonons of α-MnTe, a candidate altermagnet.", "Identifies that mechanical strain induces significant broadening in Bragg peaks, confounding structural interpretation.", "Clarifies the correct optical phonon modes and symmetry through combined spectroscopic analysis.", "Highlights the importance of sample preparation in experimental identification of magnetic topological phases."]}}, {"title": "Signatures of the Rashba spin-split states in time-resolved second harmonic generation from the dual topological insulator Bi1Te1", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/p5mv-27mj", "authors": "Aindrila Sinha, K. P. Mithun, Shoubhik Mandal, P. S. Anil Kumar, D. V. S. Muthu, and A. K. Sood", "last_authors": "Shoubhik Mandal, P. S. Anil Kumar, D. V. S. Muthu, and A. K. Sood", "summary": "Author(s): Aindrila Sinha, K. P. Mithun, Shoubhik Mandal, P. S. Anil Kumar, D. V. S. Muthu, and A. K. Sood Polarization-resolved second-harmonic generation (SHG) is reported in highly doped ${\\mathrm{Bi}}_{1}{\\mathrm{Te}}_{1}$, dual topological insulator, demonstrating the role of Rashba spin-split states (RSS) in driving a magnetization-induced nonlinear optical response. Steady-state measurements revea… [Phys. Rev. B 113, 224311] Published Thu Jun 18, 2026", "tier": "B_IMPORTANT_CONDMAT", "score": "7", "reason": "Time-resolved spectroscopy on topological insulator relevant to electronic structure.", "tags": ["experiment", "topological-insulator", "spectroscopy"], "image": "", "briefing": {"background": "위상 절연체(Topological Insulator)는 벌크는 절연체지만 표면은 금속성 상태를 띠는 물질입니다. Rashba 효과는 표면 대칭성 깨짐에  "last_authors": "Junxi Duan, Yugui Yao", "summary": "Author(s): Jinrui Zhong, Huimin Peng, Yuqing Hu, Qi Feng, Qiuli Li, Shihao Zhang, Qinsheng Wang, Jinhai Mao, Junxi Duan, and Yugui Yao A new experiment probes the quantum geometry of electronic wave functions involved in a nonlinear Hall response. [Phys. Rev. Lett. 136, 246301] Published Mon Jun 15, 2026", "tier": "B_IMPORTANT_CONDMAT", "score": "7", "reason": "Investigates topological fermions and quantum geometry in moire systems, a relevant 2D material platform.", "tags": ["graphene", "topological", "moire"], "image": "", "briefing": {"background": "그래핀 모아레(Moiré) 초격자는 전자 간 상관관계와 위상학적 밴드 구조를 엔지니어링할 수 있는 강력한 플랫폼입니다. 특히 위상학적 하위 밴드 내의 양자 기하학(quantum geometry) 연구가 활발합니다.", "motivation": "모아레 시스템에서 발생하는 비선형 홀 효과(non-linear Hall effect)를 이용하여 시스템 내의 위상학적 'Brown-Zak 페르미온'의 기하학적 특성을 직접 탐구하고자 함.", "result": "비선형 홀 양자 진동을 통해 모아레 밴드의 양자 기하학적 파동 함수 정보를 추출해냄으로써 Brown-Zak 페르미온의 위상학적 성질을 검증함.", "implication": "모아레 시스템의 전자 구조를 이해하는 데 있어 비선형 수송 현상이 강력한 진단 도구로 활용될 수 있음을 입증함.", "novelty": "기존 선형 홀 효과를 넘어 비선형 응답을 통해 위상학적 정보를 추출했다는 점이 독창적이며, 모아레 기반 위상 물질 연구의 새로운 접근 방식을 제시함.", "unresolved": "비선형 홀 응답의 크기가 샘플의 균일도와 기판 효과에 매우 민감할 수 있다는 점이 정밀도 확보에 과제로 남음.", "future_work": "다양한 트위스트 각도와 압력을 가한 모아레 시스템에서 이러한 비선형 수송 현상이 어떻게 변하는지 체계적인 데이터 수집이 필요함.", "concepts": [{"term": "Brown-Zak 페르미온", "why_emerged": "자기장이 인가된 모아레 초격자에서 밴드 구조가 재구성될 때 나타나는 독특한 준입자 상태를 설명하기 위함.", "origin": "Zak(1964)", "connections": "호프슈타터 나비(Hofstadter butterfly), 모아레 초격자 내 위상학적 밴드."}, {"term": "비선형 홀 효과", "why_emerged": "반전 대칭성이 깨진 물질에서 베리 곡률 쌍극자(Berry curvature dipole)를 통해 나타나는 전류 응답을 측정하기 위해 필요함.", "origin": "Sodemann and Fu(2015)", "connections": "베리 곡률, 비중심 대칭성 물질, 수송 현상."}], "english_summary": ["Nonlinear Hall quantum oscillations are used to probe moiré graphene systems.", "The experiment extracts quantum geometry information of Brown-Zak fermions.", "This approach provides a sensitive probe for topological bands in moiré lattices."]}}, {"title": "Repulsive-Interaction-Driven Topological Superconductivity in a Landau Level Coupled to an s-Wave Superconductor", "journal": "PRL_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/gpyx-z281", "authors": "Koji Kudo, Ryota Nakai, Hiroki Isobe, J. K. Jain, Kentaro Nomura", "last_authors": "J. K. Jain, Kentaro Nomura", "summary": "Author(s): Koji Kudo, Ryota Nakai, Hiroki Isobe, J. K. Jain, and Kentaro Nomura A two-dimensional topologically nontrivial state of noninteracting electrons, such as the surface state of a three-dimensional topological insulator, is predicted to realize a topological superconductor when proximity-coupled to an ordinary $s$-wave superconductor. In contrast, noninteracting electr… [Phys. Rev. Lett. 136, 246601] Published Tue Jun 16, 2026", "tier": "B_IMPORTANT_CONDMAT", "score": "7", "reason": "Theory of topological superconductivity relevant to TI proximity effects and Majorana physics.", "tags": ["theory", "topological-superconductor", "material:TI"], "image": "", "briefing": {"background": "위상 절연체(TI) 표면 상태와 일반적인 s-파 초전도체의 근접 효과(proximity effect)를 결합하여 위상 초전도성을 구현하는 것은 마요라나 페르미온 연구의 핵심 주제입니다.", "motivation": "비상호작용 전자계에서 예측된 위상 초전도성이 전자 간의 척력(repulsive interaction)이 존재하는 실제 물리계(란다우 준위 등)에서 어떻게 발현되는지 이론적으로 규명하고자 했습니다.", "result": "란다우 준위에 구속된 전자계가 s-파 초전도체와 결합할 때, 전자 간 척력이 오히려 위상 초전도성을 유도하거나 강화할 수 있음을 이론적으로 보였습니다.", "implication": "위상 초전도성을 얻기 위해 기존의 비상호작용 모델에 의존하던 방식에서 벗어나, 강한 상관관계 효과를 능동적으로 활용할 수 있는 새로운 설계 원리를 제시합니다.", "novelty": "상관관계가 무시되던 기존 TI 위상 초전도 연구와 달리, 란다우 준위와 척력을 직접적으로 연결하여 위상 물성을 도출했다는 점이 독창적입니다.", "unresolved": "이론적 모델이 제시하는 위상 초전도 상태의 강건함과 실제 실험 환경에서의 무질서(disorder) 영향은 추가 검증이 필요합니다.", "future_work": "실제 실험에서 란다우 준위가 형성되는 강자기장 환경에서 초전도 근접 효과를 활용한 마요라나 모드 검출 시도가 필요합니다.", "concepts": [{"term": "위상 초전도성", "why_emerged": "기존의 s-파 초전도성과 달리 내부 구조에 위상적 기하학(topological order)을 가지는 초전도 상태를 찾기 위해 제안되었습니다.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "마요라나 페르미온, TI-초전도체 이질구조 연구와 밀접함."}, {"term": "란다우 준위", "why_emerged": "강한 자기장 내에서 전자의 운동 에너지가 양자화됨에 따라 나타나는 에너지 준위입니다.", "origin": "레프 란다우(Lev Landau), 1930년 제안", "connections": "양자 홀 효과, 위상 물성 연구의 핵심적 기초 개념."}], "english_summary": ["The paper investigates topological superconductivity emerging from repulsive interactions in Landau levels.", "It studies systems where surface states of 3D topological insulators are proximity-coupled to s-wave superconductors.", "The results show that electron-electron interactions can effectively stabilize topological superconductivity.", "This provides a new framework for designing topological materials in strongly correlated electron systems."]}}, {"title": "Electric field–induced ferromagnetic domain change by ferroelectric topological domain switching in Co-substituted BiFeO 3 nanodots", "journal": "Science_Advances", "source": "Gemini", "link": "https://doi.org/10.1126/sciadv.aec2861", "authors": "Koomok Lee, Peter Meisenheimer, Paul Stevenson, et al.", "last_authors": "Ramamoorthy Ramesh, Masaki Azuma", "summary": "Electric field–induced magnetization reversal accompanying polarization switching is promising for low–power consumption, nonvolatile, voltage-write, magnetic-read memory applications. Perovskite BiFe 0.9 Co 0.1 O 3 is a room-temperature multiferroic material in which both ferroelectric and weakly ferromagnetic orders coexist, with spontaneous magnetization coupled to the ferroelectric polarization. Here, we report electric field–induced ferroelectric and ferromagnetic domain changes in BiFe 0.9 Co 0.1 O 3 nanodots using a combination of piezoresponse microscopy and scanning nitrogen-vacancy center magnetometry assisted by image analysis techniques to directly observe both ferroic orders on the nanometer scale. The complex ferroelectric domains present in a 190-nanometer structure which can be switched from a net-down to a net-up polarization by scanning with a biased cantilever, accompanied by reversal of both in-plane and out-of-plane components of the magnetization. This directly demonstrates electric field–induced magnetization reversal accompanying 180° polarization switching in a complex structure of a scale relevant to the semiconductor industry, creating a potential path for next generation memory devices.", "tier": "B_IMPORTANT_CONDMAT", "score": "7", "reason": "Explores electric field control of ferromagnetism and ferroelectric topological domains in a multiferroic material.", "tags": ["multiferroics", "ferromagnetism", "ferroelectricity", "topologicalconcept", "scanningprobemicroscopy"], "image": "", "briefing": {"background": "다강체(multiferroic) 물질은 전기적 분극과 자기적 질서가 공존하며 이들이 서로 결합되어 있어, 전기장으로 자기 상태를 제어할 수 있는 차세대 메모리 소자 후보입니다.", "motivation": "BiFeO3 기반 나노 구조에서 전기장 유도 자기 상태 변화가 나노미터 규모에서 어떻게 발생하는지 직접 관측하고 제어 가능성을 확인하고자 했습니다.", "result": "BiFe0.9Co0.1O3 나노점(nanodot)에서 전기장 인가를 통해 180도 분극 스위칭과 그에 수반되는 자기 도메인의 가역적 변화를 나노미터 수준에서 직접 관찰했습니다.", "implication": "전기장으로 자기적 정보를 읽고 쓸 수 있는 저전력 비휘발성 메모리 소자의 물리적 구현 가능성을 확인하였습니다.", "novelty": "피에조 응답 현미경(PFM)과 스캔형 NV 센터 자력계(NV magnetometry)를 결합하여 전기/자기 도메인을 동시에 고해상도로 영상화했다는 점이 돋보입니다.", "unresolved": "나노 구조가 더 작아질 때 도메인 벽의 안정성이나 스위칭 임계값이 어떻게 변화하는지는 명확하지 않습니다.", "future_work": "반도체 소자 공정과의 호환성을 확보하기 위한 대면적 나노점 배열의 전기적 제어 특성 최적화가 필요합니다.", "concepts": [{"term": "다강체", "why_emerged": "강유전성과 강자성이 한 물질에서 동시에 나타나 제어 효율을 극대화하기 위해 연구되었습니다.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "스핀트로닉스, 전기적 자기 제어, 도메인 벽 물성."}, {"term": "NV 센터 자력계", "why_emerged": "다이아몬드 내 결함인 질소-공공(NV) 센터의 스핀 상태를 이용해 극미세 자기장을 나노미터 해상도로 측정하기 위해 고안되었습니다.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "스핀 물성, 자기 도메인 이미지, 양자 센싱."}], "english_summary": ["Electric field-induced magnetic domain switching is demonstrated in BiFe0.9Co0.1O3 nanodots.", "The study utilizes PFM and NV center magnetometry to visualize ferroelectric and magnetic orders.", "It confirms the 180-degree polarization switching correlates with magnetization reversal.", "The work suggests a promising pathway for low-power, nonvolatile, voltage-written magnetic memory."]}}, {"title": "Low-temperature hyperbolic phonon polaritonics with suppressed phononic scattering", "journal": "Science_Advances", "source": "Gemini", "link": "https://doi.org/10.1126/sciadv.aef2802", "authors": "Gang Zhong, Lu Liu, Wenqi Bi, et al.", "last_authors": "Zhigao Dai, Qingdong Ou", "summary": "Hyperbolic phonon polaritons (PhPs) enable unparalleled light manipulation due to their subwavelength confinement and anisotropic dispersions but suffer from substantial phononic scattering losses at room temperature. Recent cryogenic nanoimaging has demonstrated extended hyperbolic PhP propagation at low temperatures; however, the fundamental dissipation mechanisms remain elusive. Here, we unveil the intrinsic loss channels and scattering rates of hyperbolic PhPs in van der Waals alpha–molybdenum trioxide (α-MoO 3 ) and bulk yttrium orthovanadate (YVO 4 ) through integrated structural, vibrational, and polaritonic characterizations at cryogenic temperatures, complemented by anharmonic lattice dynamics analysis. We reveal that three-phonon interactions dominate dissipation within the entire hyperbolic frequency range; four-phonon processes become significantly inhibited at low temperature. Notably, suppressed phonon decay extends the PhP lifetime, leading to enhanced quality factors by ~97.8% in α-MoO 3 –based polaritonic crystals. This phonon suppression-induced prolongation of polariton lifetime also applies to YVO 4 , and temperature-dependent analysis of various PhP materials further confirms its universality. These insights elucidate the dissipation physics of hyperbolic PhPs and provide a foundation for designing high-performance polaritonic devices for low-temperature applications.", "tier": "B_IMPORTANT_CONDMAT", "score": "7", "reason": "Studies low-temperature phonon polaritons in van der Waals alpha-MoO3, relevant to 2D materials and low-T physics.", "tags": ["vanderWaalsmaterial", "2Dmaterials", "phononpolaritons", "lowtemperaturephysics", "alpha-MoO3"], "image": "", "briefing": {"background": "쌍곡선 포논 폴라리톤(Hyperbolic Phonon Polaritons)은 빛을 물질 내에서 파장보다 훨씬 작은 규모로 구속하고 제어할 수 있게 하여 나노 광학 소자의 핵심 구성 요소가 됩니다.", "motivation": "상온에서 포논 산란으로 인해 발생하는 에너지 손실을 저온에서 어떻게 억제하고 수명을 연장할 수 있는지 물리적 메커니즘을 밝히고자 했습니다.", "result": "저온에서 3개 포논 상호작용이 주도적이며, 4개 포논 상호작용은 크게 억제됨을 확인하여 포논 폴라리톤의 수명과 품질 계수(Q-factor)를 크게 개선했습니다.", "implication": "극저온 나노 광학 소자에서 빛의 전파 거리를 늘리고 손실을 최소화할 수 있는 물리적 근거를 제공합니다.", "novelty": "반데르발스 물질 α-MoO3 등에서 온도에 따른 포논 산란 과정을 체계적으로 분리 분석하여 소멸 메커니즘을 규명했습니다.", "unresolved": "실제 장치 구현 시 발생하는 기판과의 계면 산란이 고품질 계수를 얼마나 상쇄하는지는 구체적인 검증이 필요합니다.", "future_work": "개선된 포논 폴라리톤 수명을 활용한 나노 레이저나 강결합 폴라리톤 소자의 극저온 성능 실증 연구.", "concepts": [{"term": "쌍곡선 포논 폴라리톤", "why_emerged": "이방성 매질에서 빛이 쌍곡선 형태의 분산 관계를 가져 빛의 극도로 강한 국소화(subwavelength confinement)를 가능케 하기 위해 연구됩니다.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "반데르발스 이질구조, 나노 포토닉스."}, {"term": "비조화 격자 동역학", "why_emerged": "조화 근사(harmonic approximation)만으로 설명되지 않는 포논 간의 상호작용과 열적 수명 문제를 해석하기 위해 필요합니다.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "열전도도, 포논 수명, 비선형 격자 물성."}], "english_summary": ["The study characterizes energy dissipation channels for hyperbolic phonon polaritons in alpha-MoO3.", "Cryogenic nanoimaging reveals that four-phonon scattering is inhibited at low temperatures.", "Suppressed phonon decay significantly increases polariton lifetimes and quality factors.", "These findings establish a strategy for designing efficient low-temperature polaritonic devices."]}}, {"title": "Probing and controlling coherent and incoherent dynamics of phase transitions via multipulse excitation", "journal": "Science_Advances", "source": "Gemini", "link": "https://doi.org/10.1126/sciadv.aef8585", "authors": "Feng-Wu Guo, Wen-Hao Liu, Zhi Wang, et al.", "last_authors": "Lin-Wang Wang, Jun-Wei Luo", "summary": "Ultrafast laser pulses can selectively induce either wide-sized coherent or localized incoherent dynamics in solids, yet harnessing these complex dynamics to achieve controlled phase transitions remains challenging. Here, we use real-time time-dependent density functional theory (rt-TDDFT) to investigate a double-pulse laser scheme in VO 2 , elucidating the roles of these two distinct types of dynamics and proposing two more energy-efficient phase transition routes. In the first scenario, a weak initial pulse induces coherent oscillations of V-V dimers. When the second pulse is applied at the dimer stretching time, transient bandgap narrowing enhances carrier excitation, thereby reducing the total laser fluence required for the phase transition. In the second scenario, a stronger but subthreshold first pulse activates localized structural distortions resembling photoinduced polarons. A subsequent long-wavelength pulse promotes accumulation and spatial propagation of the polarons, ultimately triggering a global phase transition. Our findings establish multipulse excitation as an energy-efficient and general approach for controlling structural phase transitions and disentangling distinct ultrafast dynamics in solids.", "tier": "B_IMPORTANT_CONDMAT", "score": "7", "reason": "Investigates ultrafast dynamics and control of phase transitions in correlated VO2, relevant to strongly correlated systems.", "tags": ["ultrafastdynamics", "phasetransition", "stronglycorrelatedelectronsystem", "VO2", "DFT"], "image": "", "briefing": {"background": "강상관계 물질에서 초고속 레이저 펄스를 이용한 상전이 제어는 응집물질물리학의 중요한 연구 분야입니다. 물질의 전자 구조와 격자 동역학을 실시간으로 조절하여 에너지 효율적인 상태 변화를 유도하는 것이 핵심 문제입니다.", "motivation": "VO2의 금속-절연체 전이 과정에서 코히어런트(coherent) 진동과 인코히어런트(incoherent) 국소 동역학이 상전이에 기여하는 메커니즘을 규명하고, 이를 통해 상전이에 필요한 에너지를 절감하는 최적의 다중 펄스 제어 전략을 찾고자 함.", "result": "rt-TDDFT 시뮬레이션을 통해 V-V 이량체의 코히어런트 진동을 이용한 밴드갭 축소 방식과, 국소적인 격자 왜곡(폴라론 유사)을 활성화하여 전파시키는 방식 등 두 가지 에너지 효율적인 상전이 경로를 제시함.", "implication": "다중 펄스 여기 방식을 활용하면 단일 펄스 대비 훨씬 적은 플루언스로 물질의 상전이를 유도할 수 있어, 차세대 초고속 광스위칭 소자 설계에 중요한 물리적 가이드라인을 제공함.", "novelty": "기존 연구들이 단일 펄스에 의존했던 것과 달리, 코히어런트와 인코히어런트 동역학을 체계적으로 분리하고 제어하여 에너지 효율을 극대화했다는 점이 독창적임. VO2와 같은       const item = document.createElement('div');
      item.className = 'concept';
      item.appendChild(textEl('h3', '', c.term || 'Concept'));
      [['왜 생겼나: ', c.why_emerged], ['누가 만들었나: ', c.origin], ['연결되는 흐름: ', c.connections]].forEach(([label, text]) => { if (!text) return; const p = document.createElement('p'); const bold = textEl('b', '', label); p.appendChild(bold); p.append(text); item.appendChild(p); });
      concepts.appendChild(item);
    });
    section.appendChild(concepts);
    briefing.appendChild(section);
  }
  if (b.english_summary && b.english_summary.length) { const section = document.createElement('section'); section.className = 'brief-section wide'; section.appendChild(textEl('h2', '', 'English Summary')); const ul = document.createElement('ul'); b.english_summary.slice(0, 5).forEach(line => ul.appendChild(textEl('li', '', line))); section.appendChild(ul); briefing.appendChild(section); }
  slideEl.appendChild(briefing);
  counterEl.textContent = `${index + 1} / ${slides.length}`;
  prevBtn.disabled = index === 0;
  nextBtn.disabled = index === slides.length - 1;
}
prevBtn.addEventListener('click', () => { index = Math.max(0, index - 1); render(); });
nextBtn.addEventListener('click', () => { index = Math.min(slides.length - 1, index + 1); render(); });
document.addEventListener('keydown', event => { if (event.key === 'ArrowLeft') prevBtn.click(); if (event.key === 'ArrowRight') nextBtn.click(); });
render();
</script>
</body>
</html>
