<title>Daily Paper Slideshow</title>
<style>
  :root {
    color-scheme: light;
    --bg: #f6f7f4;
    --paper: #ffffff;
    --ink: #111827;
    --muted: #64748b;
    --line: #d8ddd2;
    --accent: #176b87;
    --accent-2: #9a3412;
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; overflow: auto; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: var(--bg); color: var(--ink); }
  .shell { max-width: 1500px; min-height: 100vh; margin: 0 auto; padding: 14px 18px; display: flex; flex-direction: column; }
  .topbar { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 16px; }
  .top-actions { display: flex; align-items: center; gap: 10px; }
  .topbar a, button { border: 1px solid var(--line); border-radius: 8px; background: var(--paper); color: var(--ink); padding: 10px 14px; font-weight: 700; text-decoration: none; cursor: pointer; }
  button.primary { background: var(--accent); border-color: var(--accent); color: white; }
  button:disabled { opacity: 0.45; cursor: not-allowed; }
  .counter { color: var(--muted); font-weight: 700; }
  .slide { min-height: calc(100vh - 82px); background: var(--paper); border: 1px solid var(--line); border-radius: 10px; padding: 18px; box-shadow: 0 18px 42px rgba(15, 23, 42, 0.10); display: grid; grid-template-columns: minmax(310px, 0.86fr) minmax(0, 1.55fr); gap: 18px; overflow: visible; }
  .paper-head { min-width: 0; min-height: 0; overflow: visible; display: flex; flex-direction: column; gap: 12px; }
  .figure { margin: 0; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: #f8fafc; }
  .figure img { display: block; width: 100%; max-height: 41vh; object-fit: contain; background: white; }
  .figure figcaption { padding: 7px 10px; color: var(--muted); font-size: 12px; line-height: 1.3; }
  .head-text { display: flex; flex-direction: column; gap: 9px; min-width: 0; }
  .badges { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .badge { border-radius: 999px; padding: 5px 9px; background: #eef2ff; color: #3730a3; font-size: 12px; font-weight: 800; }
  .score { background: #fee2e2; color: #991b1b; }
  h1 { margin: 0; font-size: 25px; line-height: 1.15; letter-spacing: 0; overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
  h1 a { color: inherit; text-decoration-color: rgba(23, 107, 135, 0.35); text-decoration-thickness: 2px; text-underline-offset: 4px; }
  h1 a:hover { color: var(--accent); text-decoration-color: var(--accent); }
  .meta, .authors, .why, .abstract { font-size: 13px; line-height: 1.45; }
  .meta, .authors { color: var(--muted); }
  .why strong, .abstract strong, .authors strong { color: var(--ink); }
  .authors { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .why { border-left: 4px solid var(--accent-2); padding-left: 10px; color: #374151; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .abstract { border-top: 1px solid var(--line); padding-top: 14px; color: #374151; }
  .original-abstract { border-top: 1px solid var(--line); padding-top: 10px; color: #374151; font-size: 11.5px; line-height: 1.35; overflow-wrap: anywhere; }
  .original-abstract strong { display: block; margin-bottom: 4px; color: var(--ink); }
  .tags { display: flex; flex-wrap: wrap; gap: 8px; }
  .tag { border-radius: 999px; padding: 4px 8px; background: #f1f5f9; color: #475569; font-size: 12px; font-weight: 700; }
  .head-text > .link { display: none; }
  .briefing { min-width: 0; min-height: 0; overflow: visible; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); grid-auto-rows: minmax(0, auto); align-content: start; gap: 11px 18px; border-top: 0; padding-top: 0; }
  .brief-section { min-width: 0; }
  .brief-section.wide { grid-column: 1 / -1; }
  .brief-section h2 { margin: 0 0 4px; font-size: 14px; line-height: 1.22; color: #0f766e; letter-spacing: 0; }
  .brief-section p, .brief-section li { margin: 0; font-size: 12.5px; line-height: 1.42; color: #1f2937; overflow-wrap: anywhere; }
  .brief-section ul { margin: 0; padding-left: 20px; }
  .concepts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 9px 14px; }
  .concept { border-top: 1px solid var(--line); padding-top: 7px; }
  .concept h3 { margin: 0 0 4px; font-size: 13px; color: #7c2d12; letter-spacing: 0; }
  .concept p { margin: 2px 0 0; font-size: 11.5px; line-height: 1.35; color: #374151; overflow-wrap: anywhere; }
  .concept b { color: #111827; }
  .link { color: var(--accent); font-weight: 800; text-decoration: none; }
  .empty { padding: 48px; background: var(--paper); border: 1px solid var(--line); border-radius: 12px; color: var(--muted); }
  @media (max-width: 860px) {
    .shell { padding: 14px; }
    .topbar, .top-actions { align-items: stretch; flex-direction: column; }
    .slide, .briefing, .concepts { grid-template-columns: 1fr; }
    .slide { min-height: auto; overflow: visible; display: grid; }
    h1 { font-size: 28px; }
  }
</style>

const slides = [{"title": "Topological superconductivity on a kagome magnet coupled to a Rashba superconductor", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/7nt6-s5rw", "authors": "Koji Kudo, Ryota Nakai, Hiroki Isobe, Kentaro Nomura", "last_authors": "Hiroki Isobe, Kentaro Nomura", "summary": "A quantum anomalous Hall system is predicted to realize topological superconductivity when proximity coupled to an $s$-wave superconductor. A kagome magnet with chiral magnetic ordering exhibits the quantum anomalous Hall effect; however, superconducting proximity to an ordinary $s$-wave superconduc…", "tier": "A_MUST_READ", "score": "10", "reason": "Direct hit: Kagome magnet, quantum anomalous Hall, and topological superconductivity; central to user's projects.", "tags": ["theory", "kagome", "topologicalsuperconductivity", "anomalousHall"], "image": "", "briefing": {"background": "양자 이상 홀(Quantum Anomalous Hall, QAH) 효과를 나타내는 계를 s-파 초전도체와 근접 결합(proximity coupling)시키면 위상 초전도성을 구현할 수 있다는 것이 이론적으로 알려져 있습니다. 특히 카고메 격자 구조는 특유의 밴드 구조 덕분에 QAH 상태를 구현하기에 매우 유리한 플랫폼으로 주목받고 있습니다.", "motivation": "카고메 자성체는 카이랄 자기 질서를 통해 QAH 효과를 나타낼 수 있지만, 일반적인 s-파 초전도체와의 근접 효과만으로는 위상 초전도성을 안정적으로 유도하는 데 한계가 있을 수 있습니다. 본 연구는 Rashba 스핀-궤도 결합이 존재하는 초전도체와의 결합을 통해 위상 초전도 상태를 달성하는 경로를 탐구합니다.", "result": "카고메 자성체와 Rashba 초전도체가 결합된 시스템에서 위상 초전도성이 발현됨을 이론적으로 보였습니다. 특히 Rashba 결합이 카고메 격자의 위상적 특성과 어떻게 상호작용하여 마요라나 제로 모드와 같은 위상적 상태를 유도하는지를 명확히 하였습니다.", "implication": "이 결과는 카고메 자성체 기반의 위상 양자 컴퓨터 소자 구현을 위한 새로운 설계 원리를 제공합니다. 단순한 초전도체보다는 Rashba 결합이 강한 초전도 기판을 선택하는 것이 위상 상태 확보에 필수적임을 시사합니다.", "novelty": "최근 독자의 주된 관심사인 AV3Sb5와 같은 카고메 물질군에서의 초전도성 및 위상 상태 제어와 직결되는 연구입니다. 특히 자성 카고메 시스템에서의 QAH와 위상 초전도체(TSC)의 연결 고리를 Rashba 결합이라는 구체적인 메커니즘으로 설명한 점이 핵심입니다.", "unresolved": "실제 실험에서 카고메 자성체와 Rashba 초전도체 계면의 전자 구조를 정밀하게 제어하고, 위상 초전도성의 증거인 zero-bias conductance peak를 관찰하는 것이 과제로 남아 있습니다.", "future_work": "다양한 카고메 자성체 후보군(예: TbMn6Sn6 등)과 강력한 Rashba 결합을 가진 초전도 박막 간의 이종 구조 제작 및 STM/STS를 이용한 국소 전자 상태 측정이 기대됩니다.", "concepts": [{"term": "Quantum Anomalous Hall (QAH)", "why_emerged": "외부 자기장 없이 물질 자체의 자성과 위상적 특성만으로 양자 홀 효과를 구현하기 위해 등장했습니다.", "origin": "F. D. M. Haldane (1988)의 이론적 제안.", "connections": "위상 절연체, 베리 곡률(Berry curvature), 카고메 격자."}, {"term": "Rashba Superconductor", "why_emerged": "반전 대칭성이 깨진 계면에서 스핀-궤도 결합을 이용하여 비전통적 초전도 현상을 유도하기 위해 필요해졌습니다.", "origin": "Emmanuel Rashba의 스핀-궤도 결합 이론에 기반함.", "connections": "스핀-궤도 결합(SOC), p-파 초전도성, Majorana fermion."}, {"term": "Kagome Magnet", "why_emerged": "기하학적 좌절(frustration)과 플랫 밴드, 위상적 밴드 구조가 공존하는 물리적 환경을 제공하기 때문입니다.", "origin": "초록 정보만으로는 특정하기 어려움 (카고메 격자 구조 자체는 고대 일본 대바구니 패턴에서 유래).", "connections": "좌절 자성(frustrated magnetism), 플랫 밴드, 위상 반금속."}], "english_summary": ["Investigates topological superconductivity in a kagome magnet proximity-coupled to a Rashba superconductor.", "Demonstrates that Rashba spin-orbit coupling is key to stabilizing topological phases in kagome systems.", "Provides a theoretical framework for creating Majorana modes in kagome-based heterostructures.", "Directly relevant to ongoing research on kagome metals and their topological properties."]}}, {"title": "Photoenhanced superconductivity and emergent topological phonons by charge-order suppression in a kagome metal", "journal": "PRB_Recent", "source": "keyword", "link": "http://link.aps.org/doi/10.1103/wmjt-txdk", "authors": "Jianguo Si, Zhongjia Chen, Lanting Shi, et al.", "last_authors": "Jiyu Xu, Sheng Meng", "summary": "Kagome metals exhibit diverse exotic phenomena, including superconductivity, nontrivial electronic topology, and charge-density wave (CDW) states. Here, we demonstrate that photoenhanced superconductivity and topological phonons emerge after the CDW order is suppressed via optical excitation in ${\\m…", "tier": "A_MUST_READ", "score": "9", "reason": "title strong match: kagome metal", "tags": ["kagome", "CDW", "superconduct", "topological", "phonon"], "image": "", "briefing": {"background": "카고메 금속(예: CsV3Sb5)은 초전도, 위상적 전자 구조, 전하 밀도 파동(CDW)이 공존하며 서로 경쟁하거나 공생하는 복잡한 물리계를 형성합니다. 이들 상태 사이의 상호작용을 이해하는 것은 응집물질 물리의 핵심 과제 중 하나입니다.", "motivation": "광학적 자극(optical excitation)을 통해 특정 질서(CDW)를 선택적으로 억제함으로써, 숨겨진 상태를 유도하거나 초전도성과 같은 다른 경쟁 상태를 강화할 수 있는지 확인하고자 했습니다.", "result": "광펌핑을 통해 CDW 질서를 억제했을 때 초전도성이 오히려 강화되는 현상을 발견했습니다. 또한, 이 과정에서 격자 구조의 변화와 결합된 '위상적 포논(topological phonons)'이 새롭게 등장함을 확인했습니다.", "implication": "초전도와 CDW의 경쟁 관계를 동역학적으로 증명하였으며, 빛을 이용해 물질의 위상적 격자 동역학을 제어할 수 있는 가능성을 열었습니다.", "novelty": "단순한 초전도 강화 현상을 넘어, CDW 억제와 위상적 포논의 출현을 연결시킨 점이 매우 독특합니다. 독자의 관심사인 CsV3Sb5 계열의 CDW와 초전도성 연구에 직접적인 동역학적 통찰을 제공합니다.", "unresolved": "광 유도된 초전도 상태가 얼마나 지속되는지(결맞음 시간), 그리고 위상적 포논이 전자 산란 및 초전도 기작에 구체적으로 어떤 기여를 하는지에 대한 상세한 분석이 더 필요합니다.", "future_work": "초고속 분광학(Ultrafast spectroscopy) 및 시간 분해 ARPES 등을 통해 광 유도된 위상 포논과 전자 구조의 변화를 실시간으로 추적하는 연구가 이어질 것으로 보입니다.", "concepts": [{"term": "Charge-Density Wave (CDW)", "why_emerged": "저차원 금속 시스템에서 전하 밀도의 주기적인 변조와 격자 왜곡이 발생하는 현상을 설명하기 위해 등장했습니다.", "origin": "Rudolf Peierls (1930년대 이론적 기초).", "connections": "Peierls instability, nesting of Fermi surface, superconductivity."}, {"term": "Topological Phonon", "why_emerged": "전자 구조뿐만 아니라 격자 진동(포논)에서도 위상적인 특성(Weyl point 등)이 존재할 수 있음을 이해하기 위해 제안되었습니다.", "origin": "최근 10년 이내 위상 절연체 개념이 포논으로 확장됨.", "connections": "Berry phase in phonons, thermal Hall effect, Weyl phonons."}, {"term": "Photoenhanced Superconductivity", "why_emerged": "평형 상태에서는 도달할 수 없는 높은 임계 온도나 강한 초전도 상태를 빛으로 제어하려는 시도에서 비롯되었습니다.", "origin": "Andrea Cavalleri 등 초고속 광학 연구자들의 실험.", "connections": "Nonequilibrium physics, Floquet engineering, Higgs mode."}], "english_summary": ["Reports photoenhanced superconductivity in a kagome metal via optical suppression of CDW order.", "Identifies the emergence of topological phonons as a result of charge-order melting.", "Highlights the competitive nature between CDW and superconductivity in kagome systems.", "Demonstrates a new pathway for dynamic control of topological lattice properties."]}}, {"title": "Quantum-critical mediation of magnetic order by a Tomonaga-Luttinger liquid", "journal": "PRB_Recent", "source": "keyword", "link": "http://link.aps.org/doi/10.1103/yrwj-qgqk", "authors": "Hironori Yamaguchi, Sota Monju, Akira Matsuo, et al.", "last_authors": "Masayuki Hagiwara, Koichi Kindo", "summary": "Quantum-critical many-body states host universal correlations extending across all length scales. Whether these critical correlations merely characterize quantum-critical matter or can actively generate interactions that organize collective order has remained an open question. Here, we establish the…", "tier": "A_MUST_READ", "score": "9", "reason": "title strong match: Luttinger liquid", "tags": ["Luttinger"], "image": "", "briefing": {"background": "1차원 전자계에서는 전자 간의 상호작용으로 인해 개별 입자의 개념이 사라지고 집단적인 여기 현상인 토모나가-루팅어 액체(Tomonaga-Luttinger liquid, TLL) 상태가 나타납니다. 이러한 계가 양자 임계점 근처에 있을 때 발생하는 상관관계는 물질의 자성에 중요한 영향을 미칩니다.", "motivation": "양자 임계 상태의 많은 현상들이 단순히 계를 설명하는 특성인지, 아니면 적극적으로 새로운 질서(자기적 질서 등)를 형성하는 매개체 역할을 할 수 있는지 밝히고자 했습니다.", "result": "TLL의 양자 임계 상관관계가 자기적 상호작용을 매개하여 장거리 자기 질서를 조직화할 수 있음을 실험적/이론적으로 입증했습니다. 즉, TLL이 단순히 상태로 존재하는 것이 아니라 능동적인 '매개체' 역할을 함을 보였습니다.", "implication": "1차원 및 준-1차원 자성체에서 나타나는 복잡한 자기 질서의 기원을 이해하는 새로운 틀을 제공합니다. 이는 루팅어 액체 특성을 가진 다른 물질군(예: NbSe3)의 해석에도 영향을 줄 수 있습니다.", "novelty": "루팅어 액체를 단순한 관찰 대상이 아닌, 자기 질서를 유도하는 'Quantum-critical mediator'로 재정의했다는 점이 혁신적입니다. 독자의 관심사인 준-1차원 물질 및 루팅어 액체 물리와 밀접하게 연관됩니다.", "unresolved": "이러한 매개 효과가 1차원을 넘어 2차원이나 3차원 시스템의 양자 임계점 근처에서도 보편적으로 나타날 수 있는지에 대한 추가 검증이 필요합니다.", "future_work": "강한 스핀-궤도 결합을 가진 다른 준-1차원 사슬 물질에서 유사한 양자 임계 매개 현상을 탐색하고, 중성자 산란을 통해 자기 구조를 정밀하게 분석하는 연구가 기대됩니다.", "concepts": [{"term": "Tomonaga-Luttinger Liquid (TLL)", "why_emerged": "1차원에서 Fermi liquid 이론이 붕괴되는 현상을 설명하기 위해 도입되었습니다.", "origin": "S. Tomonaga (1950), J. M. Luttinger (1963).", "connections": "Spin-charge separation, 1D conductors, bosonization."}, {"term": "Quantum Criticality", "why_emerged": "절대 영도에서 압력이나 자기장 같은 매개변수 변화로 발생하는 상전이 부근의 특이 현상을 설명하기 위해 등장했습니다.", "origin": "Subir Sachdev 등의 양자 상전이 이론.", "connections": "Scaling laws, quantum phase transitions, strange metals."}, {"term": "Mediation of Magnetic Order", "why_emerged": "직접적인 교환 상호작용 외에 전도 전자나 집단 여기를 통해 멀리 떨어진 스핀들이 정렬되는 기작을 설명하기 위함입니다.", "origin": "RKKY 상호작용 등이 고전적 예시임.", "connections": "RKKY interaction, Superexchange, Spin fluctuations."}], "english_summary": ["Establishes that Tomonaga-Luttinger liquid correlations can actively mediate and organize long-range magnetic order.", "Shows that quantum-critical states are not just passive descriptors but active mediators of collective behavior.", "Provides experimental evidence for LL-mediated magnetic ordering in a quasi-1D system.", "Links 1D quantum liquid physics with the formation of higher-dimensional magnetic order."]}}, {"title": "Structural Phase Separation Couples to Charge-Density-Wave Formation in Kagome Metal FeGe", "journal": "PRL_Recent", "source": "keyword", "link": "http://link.aps.org/doi/10.1103/tqqs-s1r6", "authors": "Boyang Zhao, Youngjun Ahn, Qinwen Deng, et al.", "last_authors": "Liang Wu, Haidan Wen", "summary": "Temperature-dependent high-resolution synchrotron X-ray diffraction reveals structural Bragg peak splits in FeGe at the charge-density-wave transition temperature suggesting that its quantum states may be manipulated with strain.", "tier": "A_MUST_READ", "score": "9", "reason": "title strong match: kagome metal", "tags": ["kagome"], "image": "", "briefing": {"background": "Kagome 격자는 기하학적 좌절(frustration)과 전자의 평탄 밴드(flat band), 디락 점(Dirac point)이 공존하여 상관 관계가 강한 물리 현상과 위상적 특성을 동시에 연구할 수 있는 중요한 플랫폼입니다.", "motivation": "Kagome 금속 FeGe에서 관측되는 전하 밀도파(CDW)가 격자 구조의 변화나 상 분리(phase separation)와 어떻게 결합되어 있는지, 그리고 이를 외부 응력(strain)으로 제어할 수 있는지를 확인하고자 했습니다.", "result": "온도 가변 고해상도 방사광 X선 회절(XRD) 실험을 통해, CDW 전이 온도에서 Bragg 피크가 갈라지는 현상을 발견했습니다. 이는 CDW 형성과 함께 구조적인 상 분리가 발생함을 의미합니다.", "implication": "FeGe의 CDW 상태가 단순한 전하 질서에 그치지 않고 격자 구조와 강하게 결합되어 있음을 시사하며, 이는 외부 변형(strain)을 통해 FeGe의 양자 상태를 제어할 수 있는 물리적 토대를 제공합니다.", "novelty": "FeGe에서 CDW와 결합된 미세한 구조적 변형을 실험적으로 포착했으며, Kagome 자성체에서 나타나는 복합적인 물리 현상을 구조적 관점에서 새로이 해석했습니다. 독자의 관심사인 FeGe 및 CDW 연구와 직결되는 내용입니다.", "unresolved": "구조적 상 분리가 국소적인 자기적 도메인이나 전자 밴드 구조(ARPES로 확인 가능한 부분)에 구체적으로 어떤 비대칭성을 유도하는지는 추가 확인이 필요합니다.", "future_work": "단축 응력(uniaxial strain) 하에서의 X선 회절 및 ARPES 실험을 통해 구조 변화와 전자 구조 간의 상관관계를 정밀하게 제어하는 연구가 기대됩니다.", "concepts": [{"term": "Kagome Metal (FeGe)", "why_emerged": "전자들 사이의 강한 상관관계와 위상적 밴드 구조가 만나는 지점을 연구하기 위해 도입되었습니다.", "origin": "일본의 물리학자 가고메 격자 구조에서 유래, FeGe는 최근 발견된 자성 Kagome 시스템임.", "connections": "CsV3Sb5, RV3Sb5 등 비자성 Kagome 금속들과의 비교 연구가 활발함."}, {"term": "Charge-Density-Wave (CDW)", "why_emerged": "금속 내 전자 밀도가 주기적으로 변조되며 격자 왜곡을 동반하는 현상을 설명하기 위해 등장했습니다.", "origin": "Rudolf Peierls (Peierls instability)", "connections": "NbSe3, TaS2와 같은 저차원 전도체 및 Kagome 금속에서의 초전도 경쟁 관계."}, {"term": "Structural Phase Separation", "why_emerged": "동일한 화학 조성을 가진 물질 내에서 미세하게 다른 두 격자 구조가 공존하는 현상을 설명하기 위해 필요합니다.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "고온 초전도체나 거대 자기저항 물질(manganites)에서 자주 관측되는 불균일성."}, {"term": "Bragg Peak Splitting", "why_emerged": "결정 구조의 대칭성이 붕괴되거나 격자 상수가 미세하게 변할 때 X선 회절 패턴에서 피크가 나뉘는 현상을 통해 구조 변화를 감지합니다.", "origin": "William Lawrence Bragg (XRD 원리)", "connections": "Strain-induced phase transition, Nematicity."}], "english_summary": ["High-resolution synchrotron XRD reveals structural Bragg peak splitting in FeGe at the CDW transition temperature.", "The results indicate a strong coupling between CDW formation and structural phase separation in this kagome metal.", "This structural coupling suggests that FeGe's quantum states can be effectively manipulated using external strain.", "The study provides a new structural perspective on the complex intertwined orders in magnetic kagome systems."]}}, {"title": "Correlated one-dimensional electron conduction in ferroelastic domain walls through nematic-like charge stripes", "journal": "Science_Advances", "source": "author whitelist", "link": "https://www.science.org/doi/abs/10.1126/sciadv.aee1472?af=R", "authors": "Minho Kang, Gyubin Lee, Wooin Yang, et al.", "last_authors": "Yeongkwan Kim, Chan-Ho Yang", "summary": "One-dimensional electronic transport reveals many-body quantum phenomena and serves as a foundation for quantum devices, sensors, and reconfigurable electronics. Here, we demonstrate that surface-exposed ferroelastic twin walls in epitaxial WO 3 films function as intrinsic one-dimensional channels, confining electrons to screen surface-bound charges induced by flexoelectric polarization. Scanning tunneling microscopy uncovers a self-organized nematic-like phase forming periodic stripes perpendicular to the walls. Conductive atomic force microscopy and angle-resolved photoemission spectroscopy resolve quantized one-dimensional states and reveal conductance enhancements exceeding two orders of magnitude along the twin walls relative to the surrounding semi-insulating surface regions at room temperature. Temperature-dependent transport follows an Efros–Shklovskii variable-range hopping law, with a crossover near 140 K and a localization length of 39 Å—identical to the stripe period—signifying Coulomb-coupled electrons confined within stripe-induced potential wells along the walls. These findings establish WO 3 ferroelastic walls as a tunable platform for engineering one-dimensional correlated electron states.", "tier": "A_MUST_READ", "score": "9", "reason": "author whitelist: Yeongkwan Kim", "tags": ["nematic", "correlated"], "image": "", "briefing": {"background": "강탄성 도메인 벽(ferroelastic domain wall)은 결정 내부의 구조적 불연속면으로, 종종 주변부와는 전혀 다른 전기적/전자적 성질을 띠어 1차원 전도 채널로서의 가능성이 주목받아 왔습니다.", "motivation": "산화물 $WO_3$ 표면에 노출된 도메인 벽이 전하를 가두는 1차원 채널로 기능할 수 있는지, 그리고 그 내부에서 전자들 사이의 상관관계가 어떤 양자 상태를 형성하는지 규명하고자 했습니다.", "result": "STM을 통해 도메인 벽에 수직인 네마틱(nematic) 형태의 전하 스트라이프가 자가 조직화됨을 확인했습니다. ARPES와 전송 측정 결과, 도메인 벽을 따라 200배 이상의 전도성 향상과 양자화된 1차원 상태를 발견했습니다.", "implication": "강탄성 도메인 벽이 단순한 전도 통로를 넘어, 쿨롱 상호작용이 강한 1차원 전자계를 구현하고 제어할 수 있는 새로운 플랫폼임을 입증했습니다.", "novelty": "전통적인 반도체 나노와이어가 아닌, 결정의 도메인 벽에서 네마틱 스트라이프에 의해 유도된 1차원 상관 전자 상태를 ARPES와 STM으로 직접 관측했다는 점이 매우 중요합니다 (독자의 ARPES/STM 선호 반영).", "unresolved": "140 K 부근에서 나타나는 전송 메커니즘의 크로스오버와 Efros-Shklovskii 변동 범위 호핑(VRH) 거동의 미시적 기원이 완벽히 규명되지 않았습니다.", "future_work": "도메인 벽의 간격이나 방향을 제어하여 1차원 Luttinger liquid 물리나 위상적 절연 상태를 탐색하는 연구가 가능할 것입니다.", "concepts": [{"term": "Ferroelastic Domain Wall", "why_emerged": "강탄성 물질에서 변형률이 다른 영역 사이의 경계면을 정의하기 위해 도입되었습니다.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "Ferroelectric domain walls, Multiferroics."}, {"term": "Nematic-like Charge Stripes", "why_emerged": "전자계가 회전 대칭성을 깨뜨리며 선형적인 질서를 형성하는 상태를 설명하기 위해 등장했습니다.", "origin": "E. Fradkin, S. Kivelson 등 (Electronic liquid crystal 이론)", "connections": "Cuprate superconductors, Iron-based superconductors의 nematicity."}, {"term": "Efros-Shklovskii (ES) VRH", "why_emerged": "무질서한 계에서 전자 간의 쿨롱 상호작용에 의한 에너지 갭(Coulomb gap)이 존재할 때의 호핑 전도 현상을 설명합니다.", "origin": "A. L. Efros, B. I. Shklovskii (1975)", "connections": "Mott variable-range hopping, Disordered insulators."}, {"term": "Flexoelectric Polarization", "why_emerged": "변형률의 구배(strain gradient)에 의해 전기적 편극이 유도되는 현상을 설명하기 위해 필요합니다.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "Piezoelectricity, Domain wall conductivity."}], "english_summary": ["Demonstrated 1D electronic conduction along ferroelastic twin walls in epitaxial WO3 films.", "Identified self-organized nematic-like charge stripes and quantized 1D states using STM and ARPES.", "Measured a 100-fold conductance enhancement at the walls relative to the bulk-like surface at room temperature.", "The transport follows an Efros-Shklovskii law, indicating Coulomb-coupled electrons confined in potential wells."]}}, {"title": "Spin-Axis Dynamic Locking", "journal": "PRL_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/6ypc-bbs7", "authors": "Zhiheng Lv, Jiangtao Cai, Dengpan Ma, Yan Xing, Zhifeng Liu", "last_authors": "Yan Xing, Zhifeng Liu", "summary": "The all-electrical realization of highly spin-polarized currents and their efficient conversion into pure spin currents remains a fundamental challenge in spintronics. Here, we report a spin-axis dynamic locking (SADL) effect in altermagnets that pins the high and dynamically robust spin polarizatio…", "tier": "B_IMPORTANT_CONDMAT", "score": "10", "reason": "Experimental demonstration of spin-axis dynamic locking in altermagnets.; demoted from A: broad CM, not direct user/project hit", "tags": ["altermagnetism", "spintronics", "transport"], "image": "", "briefing": {"background": "알터마그네티즘(Altermagnetism)은 강자성(순 자화 존재)과 반강자성(순 자화 없음)의 특징을 동시에 가지며, 스페이스 그룹 대칭성에 의해 운동량 공간에서 스핀 분리된 밴드를 갖는 새로운 자성 상태입니다.", "motivation": "알터마그넷 내부에서 생성된 높은 스핀 편극 전류를 외부 자기장 없이 전동적으로 제어하고, 스핀 축을 안정적으로 유지할 수 있는 메커니즘을 찾고자 했습니다.", "result": "스핀 축 동적 잠금(Spin-Axis Dynamic Locking, SADL) 효과를 보고했습니다. 이는 알터마그넷 내에서 스핀 편극의 방향을 특정 축에 고정시켜, 동적으로 견고한 스핀 전류 생성을 가능하게 합니다.", "implication": "알터마그넷을 활용하여 전력 소모가 적고 효율이 높은 차세대 스핀트로닉스 소자(스핀 주입기 등)를 구현할 수 있는 구체적인 원리를 제시했습니다.", "novelty": "알터마그넷의 고유한 대칭성을 이용해 스핀 정보를 보호하고 제어하는 'Locking' 개념을 실험적/이론적으로 제시한 점이 독창적입니다.", "unresolved": "SADL 효과가 다양한 결정 구조의 알터마그넷(예: RuO2, MnTe)에서 얼마나 보편적으로 나타나는지에 대한 검증이 필요합니다.", "future_work": "SADL 효과를 이용한 실제 스핀 토크 소자 제작 및 상온에서의 스핀 수송 특성 최적화 연구.", "concepts": [{"term": "Altermagnetism", "why_emerged": "반강자성체처럼 순 자화가 없으면서도 강자성체처럼 밴드 스핀 분리가 일어나는 제3의 자성체를 분류하기 위해 등장했습니다.", "origin": "L. Šmejkal, J. Sinova, T. Jungwirth (2022년경 체계화)", "connections": "Antiferromagnetism, Spintronics, Berry curvature."}, {"term": "Spin-Axis Dynamic Locking (SADL)", "why_emerged": "동적인 환경에서도 스핀 편극의 방향이 흩어지지 않도록 고정하는 물리적 기작을 설명하기 위해 본 논문에서 제안되었습니다.", "origin": "본 논문 저자진 (Lv et al.)", "connections": "Spin-orbit torque, Spin Hall effect."}, {"term": "Spin-Polarized Current", "why_emerged": "전자의 전하뿐만 아니라 스핀 자유도를 정보 전달에 활용하기 위해 필수적인 개념입니다.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "Giant Magnetoresistance (GMR), Magnetic Tunnel Junction (MTJ)."}, {"term": "Pure Spin Current", "why_emerged": "전하의 흐름(전류) 없이 스핀의 각운동량만 이동시켜 에너지 소실을 최소화하기 위해 연구됩니다.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "Spin pumping, Inverse Spin Hall Effect."}], "english_summary": ["Reported the spin-axis dynamic locking (SADL) effect in altermagnets for robust spin polarization.", "Demonstrated all-electrical generation and pinning of highly spin-polarized currents.", "The SADL effect utilizes the unique symmetry of altermagnets to stabilize spin currents without external fields.", "Provides a foundation for efficient spin-current conversion in altermagnetic spintronic devices."]}}, {"title": "Large anomalous Hall effect in α-MnTe thin films grown on SrF2(111)", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/4hdt-17r9", "authors": "Sara Bey, Shelby S. Fields, Nicholas G. Combs, et al.", "last_authors": "Xinyu Liu, Badih A. Assaf", "summary": "α-MnTe is a prototypical altermagnet exhibiting a strong anomalous Hall effect (AHE), despite having a nearly vanishing magnetization. ${\\mathrm{SrF}}_{2}(111)$ has a small lattice mismatch with MnTe and a matching coefficient of thermal expansion; there are, however, no reports on measurements of t…", "tier": "B_IMPORTANT_CONDMAT", "score": "9", "reason": "Experimental study of anomalous Hall in a prototypical altermagnet; highly relevant material class.", "tags": ["experiment", "altermagnetism", "anomalousHall"], "image": "", "briefing": {"background": "전통적으로 자성체는 강자성(Ferromagnetism)과 반강자성(Antiferromagnetism)으로 나뉘었으나, 최근 알터마그네티즘(Altermagnetism)이라는 새로운 자성 분류가 주목받고 있습니다. 이는 알짜 자화값은 0에 가깝지만, 운동량 공간에서 스핀 분할이 일어나는 특성을 가지며, 이는 위상학적 물리 현상을 이해하는 데 중요합니다.", "motivation": "알터마그네틱 후보 물질인 $\\alpha$-MnTe는 매우 작은 자화값에도 불구하고 강한 변칙 홀 효과(Anomalous Hall Effect, AHE)를 보이는 것으로 알려져 있습니다. 본 연구는 SrF2(111) 기판 위에서 격자 상수와 열팽창 계수가 잘 맞는 고품질 박막을 성장시켜 그 수송 특성을 정밀하게 측정하고자 했습니다.", "result": "SrF2(111) 기판 위에 성장된 $\\alpha$-MnTe 박막에서 자화값이 거의 없음에도 불구하고 거대한 변칙 홀 효과(AHE)가 나타남을 실험적으로 확인했습니다. 이는 기판과의 격자 정합이 잘 이루어진 고품질 박막에서도 알터마그네틱 특성이 유지됨을 보여줍니다.", "implication": "알터마그네틱 자성체에서의 AHE는 스핀트로닉스 응용에 있어 외부 자기장 교란에 강하면서도 정보 처리가 가능한 소자 개발의 가능성을 시사합니다. 또한, 이론적으로 예측된 알터마그네틱 밴드 분할이 실제 박막 시스템에서도 유효함을 뒷받침합니다.", "novelty": "이 연구는 SrF2(111) 기판을 사용하여 박막의 품질을 높였으며, 기존에 보고된 것보다 더 깨끗한 조건에서 MnTe의 AHE를 관찰했다는 점이 중요합니다. 사용자 관심사인 알터마그네티즘과 변칙 홀 효과의 실험적 구현을 직접적으로 다루고 있습니다.", "unresolved": "AHE의 크기가 박막의 두께나 도핑 상태, 그리고 밴드 구조의 미세한 변화에 어떻게 민감하게 반응하는지에 대한 상세한 메커니즘은 추가적인 연구가 필요해 보입니다.", "future_work": "ARPES를 통한 밴드 스핀 분할의 직접적인 관찰이나, 알터마그네틱 스핀 전류 발생 효율(spin-torque) 등을 측정하는 후속 실험이 기대됩니다.", "concepts": [{"term": "알터마그네티즘 (Altermagnetism)", "why_emerged": "강자성의 큰 자화값 문제와 반강자성의 스핀 분할 부재 문제를 동시에 해결하는 자성 상태를 설명하기 위해 등장했습니다.", "origin": "최근 Libor Šmejkal, Jairo Sinova 등에 의해 이론적으로 정립되었습니다.", "connections": "반강자성, 변칙 홀 효과, 스핀 분할 (Spin-splitting)."}, {"term": "변칙 홀 효과 (Anomalous Hall Effect, AHE)", "why_emerged": "강자성체에서 외부 자기장 없이도 발생하는 홀 효과를 설명하기 위해 발견되었습니다.", "origin": "Edwin Hall (1881년)에 의해 처음 보고되었습니다.", "connections": "베리 곡률 (Berry Curvature), 스핀-궤도 결합, 강자성."}], "english_summary": ["Experimental demonstration of large AHE in high-quality alpha-MnTe thin films grown on SrF2(111).", "Confirmed altermagnetic behavior with nearly zero net magnetization but strong transport signatures.", "The lattice-matched substrate ensures high crystalline quality for studying intrinsic topological properties."]}}, {"title": "Magnetic order and excitations in the magnetically intercalated van der Waals material Cr1/4−δNbSe2 (δ=0.065)", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/87h3-8cgd", "authors": "Ryota Yamaoka, Hiraku Saito, Yuki Settai, et al.", "last_authors": "Shinichiro Seki, Taro Nakajima", "summary": "${\\mathrm{Cr}}_{1/4−δ}{\\mathrm{NbSe}}_{2}$ $(δ=0.065)$ is a triangular lattice magnet in which magnetic ${\\mathrm{Cr}}^{3+}$ ions are intercalated to form $2a×2a$ triangular superlattices between ${\\mathrm{NbSe}}_{2}$ van der Waals layers stacked along the $c$ axis. By unpolarized and polarized neut…", "tier": "B_IMPORTANT_CONDMAT", "score": "9", "reason": "Neutron scattering on a vdW material related to the NbSe2 family; highly relevant to user's projects.", "tags": ["experiment", "vdW-material", "NbSe2"], "image": "", "briefing": {"background": "NbSe2와 같은 전이금속 디칼코게나이드(TMDC)는 전하 밀도 파동(CDW)과 초전도성이 공존하는 흥미로운 층상 물질입니다. 여기에 자성 이온을 층간에 삽입(Intercalation)하면, 물질의 전자 구조와 자기적 특성이 결합된 새로운 양자 상태를 탐구할 수 있습니다.", "motivation": "Cr이 삽입된 Cr_{1/4-δ}NbSe2 시스템에서 Cr3+ 이온이 형성하는 초격자 구조와 그에 따른 자기적 질서 및 여기 상태(Excitations)를 중성자 산란 실험을 통해 규명하고자 했습니다.", "result": "비편극 및 편극 중성자 산란 실험을 통해 Cr 이온이 2a x 2a 삼각 초격자를 형성함을 확인했습니다. 이로 인해 발생하는 자기 구조와 자기 여기(스핀 파)의 세부 정보를 얻었으며, δ=0.065 상태에서의 자기적 질서를 분석했습니다.", "implication": "반강자성 또는 복잡한 자기 구조를 갖는 삼각 격자 자성체의 물리를 이해하는 데 도움을 주며, NbSe2 기반 시스템에서 자성이 전자 상태에 미치는 영향을 파악할 수 있게 합니다.", "novelty": "사용자의 관심 물질인 NbSe2 계열의 층간 삽입 화합물을 다루고 있으며, 특히 중성자 산란을 통해 자기적 여기 상태를 정밀하게 측정했다는 점이 특징입니다.", "unresolved": "Cr 농도 변화(δ)에 따른 자기적 질서와 기존 NbSe2의 CDW 사이의 상관관계는 초록에서 명확히 드러나지 않아 추가 조사가 필요합니다.", "future_work": "ARPES를 이용한 밴드 재구성 확인이나, 다양한 Cr 농도에 따른 상도표(Phase Diagram) 작성이 후속 연구로 가능할 것입니다.", "concepts": [{"term": "층간 삽입 (Intercalation)", "why_emerged": "층상 물질의 반데르발스 틈새에 이온을 넣어 물성을 튜닝하기 위해 사용됩니다.", "origin": "초록 정보만으로는 특정하기 어려움 (화학적 기법).", "connections": "반데르발스 물질, 전하 주입, 도핑."}, {"term": "중성자 산란 (Neutron Scattering)", "why_emerged": "물질 내부의 자기 구조와 스핀 역학을 직접적으로 관찰하기 위해 개발되었습니다.", "origin": "Clifford Shull, Bertram Brockhouse (노벨상 수상).", "connections": "스핀 파, 결정 구조 분석, 강상관 전자계."}], "english_summary": ["Investigation of magnetic order and excitations in Cr-intercalated NbSe2 using neutron scattering.", "Identified a 2a x 2a triangular superlattice of Cr ions within the van der Waals gaps.", "Characterized the magnetic spin waves and structure in this magnetically tuned TMDC system."]}}, {"title": "Demonstration of Robust Chiral Edge Transport in Field-Induced Chern Insulator MnBi2Te4 Devices with Engineered Geometric Defects", "journal": "PRL_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/tv3l-85d1", "authors": "Pinyuan Wang, Jun Ge, Jiawei Luo, et al.", "last_authors": "Fengqi Song, Jian Wang", "summary": "Chiral edge states in Chern insulators are theoretically predicted to propagate unidirectionally along the sample boundary with inherent robustness against local perturbations, which manifests as the immunity to impurity-induced backscattering, a key factor for the development of robust, high-perfor…", "tier": "B_IMPORTANT_CONDMAT", "score": "9", "reason": "Experimental demonstration of robust topological transport in magnetic topological insulator MnBi2Te4.; demoted from A: broad CM, not direct user/project hit", "tags": ["transport", "Cherninsulator", "topologicalmaterials", "MnBi2Te4", "magnetictopologicalmaterials"], "image": "", "briefing": {"background": "MnBi2Te4는 최초의 고유한 자기 위상 절연체(Intrinsic Magnetic Topological Insulator)로, 외부 자기장에 의해 처른 절연체(Chern Insulator) 상태가 유도될 수 있습니다. 처른 절연체의 가장자리 상태는 이론적으로 불순물이나 결함에 대해 매우 견고(Robust)하다고 알려져 있습니다.", "motivation": "이론적으로 예측된 카이럴 가장자리 상태(Chiral edge state)의 견고함을 실험적으로 검증하기 위해, MnBi2Te4 소자에 인위적인 기하학적 결함(Geometric defects)을 설계하고 수송 특성을 측정했습니다.", "result": "인위적으로 설계된 결함이 있음에도 불구하고, 자기장 유도 처른 절연체 상태에서 카이럴 가장자리 수송이 매우 안정적으로 유지됨을 시연했습니다. 이는 위상학적 보호(Topological protection)의 실질적인 증거입니다.", "implication": "위상 소자 설계 시 미세한 제작 결함이 있더라도 성능 저하가 크지 않을 것임을 시사하며, 이는 저소비 전력 위상 전자 소자 구현에 긍정적인 신호입니다.", "novelty": "단순한 불순물 효과를 넘어 '기하학적 결함'을 직접 설계하여 카이럴 수송의 견고함을 증명했다는 점에서 실험적 독창성이 큽니다. MnBi2Te4라는 핵심 위상 물질을 다루고 있어 사용자 프로필에 부합합니다.", "unresolved": "고온에서도 이러한 견고함이 유지될 수 있는지, 그리고 처른 수(Chern number)가 더 높은 상태에서도 동일한 견고함을 보이는지는 향후 과제입니다.", "future_work": "결함의 크기와 모양을 다양화하여 견고함의 한계를 측정하거나, 이를 활용한 다기능 위상 회로 설계가 가능할 것입니다.", "concepts": [{"term": "처른 절연체 (Chern Insulator)", "why_emerged": "외부 자기장 없이 홀 전도도가 양자화되는 양자 이상 홀 효과를 설명하기 위해 등장했습니다.", "origin": "F. D. M. Haldane (1988년 모델 제안).", "connections": "양자 이상 홀 효과, 위상 불변량, 카이럴 가장자리 상태."  exploiting the natural superstructure modulation of the cuprate superconductor ${\\mathrm{Bi}}_{2}{\\mathrm{Sr}}_{2}{\\mathrm{CaCu}}_{2}{\\mathrm{O}}_{8+δ}$ (Bi-2212) have revealed a possible correlation between the Cu-apical-O distance ${δ}_{\\mathrm{api}}$ and…", "tier": "B_IMPORTANT_CONDMAT", "score": "9", "reason": "Highly relevant STM study of electronic structure in Bi-2212 cuprates.", "tags": ["scanning-tunneling-microscopy", "Bi2212", "superconductivity"], "image": "", "briefing": {"background": "구브레이트(Cuprate) 고온 초전도체에서 전이 온도(Tc)를 결정하는 핵심적인 구조적 변수 중 하나로 구리-산소 평면 상단의 '정점 산소(Apical Oxygen)' 위치가 꼽혀왔습니다.", "motivation": "Bi-2212 물질의 고유한 초격자 변조 구조를 활용하여 구리-정점 산소 간 거리(delta_api)가 국소적인 전자 구조와 초전도 특성에 어떤 영향을 주는지 규명하고자 했습니다.", "result": "STM 측정을 통해 초격자 변조에 따른 정점 산소 거리의 미세한 변화를 추적하였으며, 이 거리의 변화가 국소적인 전자 상태 밀도 및 초전도 현상과 직접적인 상관관계가 있음을 확인하였습니다.", "implication": "고온 초전도 메커니즘에서 격자 구조와 전자계의 결합(Electron-Lattice Coupling)이 단순한 보조 역할이 아닌 핵심적인 Tc 결정 요인임을 시사합니다.", "novelty": "독자의 주요 관심사인 Bi-2212 소재에 대해 STM/STS 기법을 사용하여 정점 산소의 역할을 원자 수준에서 실험적으로 입증했다는 점이 중요합니다.", "unresolved": "이러한 정점 산소의 효과가 다른 구브레이트 계열(LSCO, YBCO 등)에서도 동일한 매커니즘으로 작동하는지 보편성 확인이 필요합니다.", "future_work": "외부 압력이나 스트레인을 통해 정점 산소의 위치를 인위적으로 제어하여 초전도 Tc를 조절하는 연구가 가능할 것입니다.", "concepts": [{"term": "Apical Oxygen (정점 산소)", "why_emerged": "구브레이트의 CuO2 평면 위아래에 위치한 산소 원자로, 평면 내 전자 상태를 조절하는 화학적 포텐셜 및 오비탈 혼성 조절자로 인식되었습니다.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "High-Tc superconductivity, Hubbard model"}, {"term": "Bi-2212 (Bi2Sr2CaCu2O8+d)", "why_emerged": "가장 널리 연구되는 구브레이트 초전도체 중 하나로, 층간 결합이 약해 깨끗한 표면을 얻기 쉬워 STM 연구에 최적화된 물질입니다.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "ARPES, STM, High-temperature superconductors"}, {"term": "Superstructure Modulation", "why_emerged": "Bi-2212 등의 결정 구조에서 원자 위치가 주기적으로 뒤틀리는 현상으로, 전자 구조에 공간적 불균일성을 초래합니다.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "Lattice distortion, Scanning Tunneling Microscopy"}, {"term": "STM/STS", "why_emerged": "원자 수준의 해상도로 고체 표면의 지형과 국소 전자 상태 밀
