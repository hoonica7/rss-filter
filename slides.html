<title>Daily Paper Slideshow</title>
<style>
  :root {
    color-scheme: light;
    --bg: #f6f7f4;
    --paper: #ffffff;
    --ink: #111827;
    --muted: #64748b;
    --line: #d8ddd2;
    --accent: #176b87;
    --accent-2: #9a3412;
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; overflow: auto; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: var(--bg); color: var(--ink); }
  .shell { max-width: 1500px; min-height: 100vh; margin: 0 auto; padding: 14px 18px; display: flex; flex-direction: column; }
  .topbar { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 16px; }
  .top-actions { display: flex; align-items: center; gap: 10px; }
  .topbar a, button { border: 1px solid var(--line); border-radius: 8px; background: var(--paper); color: var(--ink); padding: 10px 14px; font-weight: 700; text-decoration: none; cursor: pointer; }
  button.primary { background: var(--accent); border-color: var(--accent); color: white; }
  button:disabled { opacity: 0.45; cursor: not-allowed; }
  .counter { color: var(--muted); font-weight: 700; }
  .slide { min-height: calc(100vh - 82px); background: var(--paper); border: 1px solid var(--line); border-radius: 10px; padding: 18px; box-shadow: 0 18px 42px rgba(15, 23, 42, 0.10); display: grid; grid-template-columns: minmax(310px, 0.86fr) minmax(0, 1.55fr); gap: 18px; overflow: visible; }
  .paper-head { min-width: 0; min-height: 0; overflow: visible; display: flex; flex-direction: column; gap: 12px; }
  .figure { margin: 0; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: #f8fafc; }
  .figure img { display: block; width: 100%; max-height: 41vh; object-fit: contain; background: white; }
  .figure figcaption { padding: 7px 10px; color: var(--muted); font-size: 12px; line-height: 1.3; }
  .head-text { display: flex; flex-direction: column; gap: 9px; min-width: 0; }
  .badges { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .badge { border-radius: 999px; padding: 5px 9px; background: #eef2ff; color: #3730a3; font-size: 12px; font-weight: 800; }
  .score { background: #fee2e2; color: #991b1b; }
  h1 { margin: 0; font-size: 25px; line-height: 1.15; letter-spacing: 0; overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
  h1 a { color: inherit; text-decoration-color: rgba(23, 107, 135, 0.35); text-decoration-thickness: 2px; text-underline-offset: 4px; }
  h1 a:hover { color: var(--accent); text-decoration-color: var(--accent); }
  .meta, .authors, .why, .abstract { font-size: 13px; line-height: 1.45; }
  .meta, .authors { color: var(--muted); }
  .why strong, .abstract strong, .authors strong { color: var(--ink); }
  .authors { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .why { border-left: 4px solid var(--accent-2); padding-left: 10px; color: #374151; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .abstract { border-top: 1px solid var(--line); padding-top: 14px; color: #374151; }
  .original-abstract { border-top: 1px solid var(--line); padding-top: 10px; color: #374151; font-size: 11.5px; line-height: 1.35; overflow-wrap: anywhere; }
  .original-abstract strong { display: block; margin-bottom: 4px; color: var(--ink); }
  .tags { display: flex; flex-wrap: wrap; gap: 8px; }
  .tag { border-radius: 999px; padding: 4px 8px; background: #f1f5f9; color: #475569; font-size: 12px; font-weight: 700; }
  .head-text > .link { display: none; }
  .briefing { min-width: 0; min-height: 0; overflow: visible; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); grid-auto-rows: minmax(0, auto); align-content: start; gap: 11px 18px; border-top: 0; padding-top: 0; }
  .brief-section { min-width: 0; }
  .brief-section.wide { grid-column: 1 / -1; }
  .brief-section h2 { margin: 0 0 4px; font-size: 14px; line-height: 1.22; color: #0f766e; letter-spacing: 0; }
  .brief-section p, .brief-section li { margin: 0; font-size: 12.5px; line-height: 1.42; color: #1f2937; overflow-wrap: anywhere; }
  .brief-section ul { margin: 0; padding-left: 20px; }
  .concepts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 9px 14px; }
  .concept { border-top: 1px solid var(--line); padding-top: 7px; }
  .concept h3 { margin: 0 0 4px; font-size: 13px; color: #7c2d12; letter-spacing: 0; }
  .concept p { margin: 2px 0 0; font-size: 11.5px; line-height: 1.35; color: #374151; overflow-wrap: anywhere; }
  .concept b { color: #111827; }
  .link { color: var(--accent); font-weight: 800; text-decoration: none; }
  .empty { padding: 48px; background: var(--paper); border: 1px solid var(--line); border-radius: 12px; color: var(--muted); }
  @media (max-width: 860px) {
    .shell { padding: 14px; }
    .topbar, .top-actions { align-items: stretch; flex-direction: column; }
    .slide, .briefing, .concepts { grid-template-columns: 1fr; }
    .slide { min-height: auto; overflow: visible; display: grid; }
    h1 { font-size: 28px; }
  }
</style>

const slides = [{"title": "Microscopic signatures of an imaginary charge density wave in a kagome metal", "journal": "Nature_Physics", "source": "keyword", "link": "https://www.nature.com/articles/s41567-026-03339-8", "authors": "S. Suetsugu, F. Hori, M. Shibata, et al.", "last_authors": "H. Kontani, Y. Matsuda", "summary": "Nature Physics, Published online: 17 June 2026; doi:10.1038/s41567-026-03339-8 Whether imaginary charge density waves and their associated loop currents exist has remained an open question. Now signatures of this state have been observed in kagome metal CsV3Sb5, revealing spontaneous time-reversal symmetry breaking.", "tier": "A_MUST_READ", "score": "9", "reason": "title strong match: kagome metal", "tags": ["kagome", "CsV3Sb5", "V3Sb5", "chargedensitywave", "loopcurrent", "time-reversalsymmetrybreaking"], "image": "https://media.springernature.com/m685/springer-static/image/art%3A10.1038%2Fs41567-026-03339-8/MediaObjects/41567_2026_3339_Fig1_HTML.png", "briefing": {"background": "카고메 금속(Kagome metal) AV3Sb5 계열은 위상적 전자 구조와 전하 밀도 파(CDW), 그리고 초전도성이 복잡하게 얽혀 있는 물질입니다. 특히 CDW 상태가 시간 반전 대칭성을 깨뜨리는지, 혹은 루프 전류(loop current)가 형성되는지에 대한 논란이 오랜 시간 지속되어 왔습니다.", "motivation": "CsV3Sb5에서 관측되는 CDW 상태의 본질을 규명하기 위해, 이론적으로 제안된 허수 전하 밀도 파(imaginary CDW)와 그에 수반되는 루프 전류의 존재를 미세한 실험적 증거를 통해 입증하고자 함.", "result": "CsV3Sb5 물질 내에서 자발적인 시간 반전 대칭 깨짐(Time-reversal symmetry breaking)의 미세한 신호를 포착하였으며, 이는 루프 전류 기반의 허수 전하 밀도 파 상태가 실제로 존재함을 강력하게 시사함.", "implication": "카고메 금속의 위상 물성과 초전도성 발현 기작을 이해하는 데 있어, 단순한 격자 왜곡 이상의 비전통적인 전자 질서가 핵심적인 역할을 함을 증명함.", "novelty": "실험적으로 입증하기 어려웠던 루프 전류 모델을 구체적인 물질 시스템에서 직접적인 신호로 확인했다는 점이 핵심이며, 독자의 주 관심사인 카고메 금속 물성 이해에 결정적인 기여를 함.", "unresolved": "관측된 신호가 정확히 어떤 공간적 패턴의 루프 전류와 연관되어 있는지, 그리고 이 현상이 물질 전체의 벌크 특성인지 국소적인 불균일성인지에 대한 추가 분석이 필요함.", "future_work": "저온 환경에서의 자기 광학 효과 측정이나 고해상도 스핀 분해 ARPES를 통한 루프 전류 밴드 구조의 직접적인 가시화.", "concepts": [{"term": "루프 전류 (Loop current)", "why_emerged": "전하 밀도 파 상태에서 스핀이나 시간 반전 대칭을 깨뜨리는 미세한 전류 회로의 존재를 설명하기 위해 도입됨.", "origin": "초록 정보만으로는 특정하기 어려움 (통상적으로 구리 산화물 초전도체 이론에서 유래).", "connections": "반강자성 질서, Chern 절연체 이론, 카고메 격자의 위상 밴드."}, {"term": "허수 전하 밀도 파 (Imaginary CDW)", "why_emerged": "일반적인 실수 CDW와 달리 시간 반전 대칭을 깨뜨리는 위상학적 질서를 기술하기 위해 필요함.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "시간 반전 대칭 깨짐, 위상적 카고메 금속 물성."}], "english_summary": ["Provides experimental evidence for the existence of an imaginary charge density wave in CsV3Sb5.", "Confirms spontaneous time-reversal symmetry breaking in the kagome metal.", "Supports the loop current model as a driver for the electronic order in AV3Sb5 compounds."]}}, {"title": "Dielectric screening in electromagnetic dressing of semiconductors", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/v4w2-zvxn", "authors": "Quentin Courtade, Umberto Dellasette, Sotirios Fragkos, et al.", "last_authors": "Yann Mairesse, Samuel Beaulieu", "summary": "Author(s): Quentin Courtade, Umberto Dellasette, Sotirios Fragkos, Stéphane Petit, Dominique Descamps, Yann Mairesse, and Samuel Beaulieu Nonequilibrium manipulation of quantum materials via electromagnetic dressing provides an on-demand route to tailoring electronic band structures through Floquet engineering. Time- and angle-resolved photoemission spectroscopy offers a direct means to probe these light-dressed electronic states. In … [Phys. Rev. B 113, 235430] Published Mon Jun 22, 2026", "tier": "A_MUST_READ", "score": "9", "reason": "Directly relevant to Floquet engineering and ARPES methodology.", "tags": ["ARPES", "Floquet", "spectroscopy"], "image": "", "briefing": {"background": "Floquet 공학(Floquet engineering)은 광학적 섭동을 통해 양자 물질의 밴드 구조를 동적으로 재구성하는 기법입니다. 이를 정밀하게 측정하기 위해 TR-ARPES가 사용되지만, 광학적 드레싱 과정에서 발생하는 유전체 스크리닝 효과가 측정 결과에 어떻게 영향을 미치는지 이해하는 것이 중요합니다.", "motivation": "반도체에 가해지는 강한 레이저 필드가 전자 구조를 변형시킬 때, 물질의 유전체 스크리닝(dielectric screening)이 어떻게 드레싱된 전자 상태를 변화시키고 관측되는 스펙트럼에 영향을 주는지 분석함.", "result": "전자기 드레싱 과정에서의 유전체 응답이 단순히 외부 장을 차폐하는 데 그치지 않고, Floquet-Bloch 밴드의 재구조화에 결정적인 역할을 함을 이론적/실험적으로 명확히 규명함.", "implication": "TR-ARPES 실험 데이터 분석 시 유전체 스크리닝 효과를 정확히 고려해야만 Floquet 엔지니어링의 효과를 오독하지 않고 올바르게 해석할 수 있음을 제시함.", "novelty": "Floquet 물성 연구의 핵심 도구인 ARPES의 방법론적 엄밀성을 높였으며, 특히 광학-물질 상호작용의 정밀한 모델링을 가능하게 함.", "unresolved": "다양한 상관관계 물질(강상관계 전자계)에서의 비선형 유전체 응답은 여전히 복잡한 문제로 남아 있음.", "future_work": "강상관계 물질 및 위상 절연체에 대한 Floquet 유효 해밀토니안 분석 시, 스크리닝 효과를 포함한 고도화된 스펙트럼 시뮬레이션 적용.", "concepts": [{"term": "Floquet 공학", "why_emerged": "평형 상태에서 존재하지 않는 새로운 위상적 질서나 밴드 특성을 외부 조명(빛)으로 유도하기 위해 고안됨.", "origin": "G. Floquet (1883년 수학적 이론), 응집물질물리 분야는 2010년대 전후로 활성화.", "connections": "비평형 통계역학, TR-ARPES, 광-물질 상호작용."}, {"term": "전자기 드레싱", "why_emerged": "빛의 전기장 성분이 물질의 전자 파동함수에 결합하여 에너지 준위를 직접적으로 수정하는 효과를 기술하기 위해 필요.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "Floquet 상태, 비선형 광학."}], "english_summary": ["Investigates the role of dielectric screening in the electromagnetic dressing of semiconductors.", "Highlights critical impacts of screening on Floquet-engineered band structures.", "Improves interpretation accuracy of time- and angle-resolved photoemission spectroscopy (TR-ARPES) data."]}}, {"title": "Superconductivity and the quasiparticle mass enhancement near the charge density wave critical point using the Bethe-Salpeter method: Application to cuprates", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/9vbp-dv48", "authors": "Youichi Yamakawa, Hiroshi Kontani", "last_authors": "Youichi Yamakawa, Hiroshi Kontani", "summary": "Author(s): Youichi Yamakawa and Hiroshi Kontani In recent years, charge-channel order in strongly correlated metals has attracted much attention. Representative examples include electronic nematic order in cuprates and iron-based superconductors, and Star-of-David order in kagome metals. Critical phenomena and unconventional superconductivity ari… [Phys. Rev. B 113, 235140] Published Tue Jun 23, 2026", "tier": "A_MUST_READ", "score": "9", "reason": "Directly links CDW, kagome, nematicity, and superconductivity using theory relevant to ARPES interpretation.", "tags": ["kagome", "CDW", "nematicity", "superconductivity"], "image": "", "briefing": {"background": "강상관계 금속에서 전하 채널의 질서(CDW 등)는 초전도성 발현과 깊은 관련이 있습니다. 특히 구리 산화물(cuprates)의 네마틱 질서나 카고메 금속의 스타 오브 다윗(Star-of-David) 패턴은 페르미 면의 불안정성을 초래하여 초전도 전이 온도에 큰 영향을 미칩니다.", "motivation": "Bethe-Salpeter 방정식을 사용하여 CDW 임계점 근처에서의 준입자 질량 강화(mass enhancement)와 초전도성 사이의 물리적 연관성을 이론적으로 정립하고자 함.", "result": "CDW 섭동이 페르미 액체 내 준입자에게 미치는 영향을 계산하여, 임계점 근처에서 나타나는 강한 전자 상관관계와 질량 강화 현상이 어떻게 초전도 쌍 형성을 돕는지 이론적 근거를 마련함.", "implication": "카고메 금속과 구리 산화물 등에서 CDW와 초전도성이 경쟁하거나 공존하는 양상을 일반적인 강상관계 체계 내에서 일관되게 이해할 수 있게 함.", "novelty": "Kontani 그룹의 강점인 다체론적 접근 방식을 통해 실험적으로 관측되는 ARPES의 페르미 면 특징과 초전도성 사이의 잃어버린 연결고리를 해석해냄.", "unresolved": "이 모델이 모든 종류의 카고메 금속에서 나타나는 다양한 위상적 CDW 상태에 범용적으로 적용 가능한지는 미지수임.", "future_work": "실제 실험 데이터(ARPES 질량 강화 값 등)와 이론적 예측값 간의 정량적 비교 및 타 물질 시스템으로의 확장.", "concepts": [{"term": "Bethe-Salpeter 방정식", "why_emerged": "다체계에서 두 입자 간의 상호작용(들뜸 상태)을 비섭동적으로 기술하기 위해 사용되는 정식화.", "origin": "Hans Bethe, Edwin Salpeter (1951년).", "connections": "그린 함수론, 페르미 액체 이론, 초전도성 이론."}, {"term": "전자 네마틱 질서", "why_emerged": "회전 대칭성이 깨지지만 격자의 병진 대칭성은 유지되는 전자 상태를 설명하기 위해 도입됨.", "origin": "전통적인 액정 물리학에서 유래, 응집물질물리에서는 2000년대 후반부터 Fe-pnictides 등에서 본격 논의.", "connections": "CDW, 초전도성, nematicity."}], "english_summary": ["Applies the Bethe-Salpeter method to analyze the interplay between CDW and superconductivity.", "Explains quasiparticle mass enhancement near the CDW critical point.", "Provides a theoretical framework relevant to both cuprates and kagome metals."]}}, {"title": "Direct Observation of Sublattice-Dependent Magnetic Ordering and Strong Electron-Magnon Coupling in Fe5GeTe2", "journal": "PRL_Recent", "source": "author whitelist", "link": "http://link.aps.org/doi/10.1103/9t6n-4myf", "authors": "R. Xu, X. H. Chen, X. L. Li, et al.", "last_authors": "D. L. Feng, J. Jiang", "summary": "Author(s): R. Xu, X. H. Chen, X. L. Li, Y. Z. rmalization)를 일으키는 현상을 설명하기 위해 필요합니다.", "origin": "고체물리학 초기 자성 이론 및 다체 물리(Many-body physics)에서 유래했습니다.", "connections": "ARPES kink, Spintronics, Quasiparticle lifetime"}], "english_summary": ["Direct ARPES observation of sublattice-specific magnetic behavior in the room-temperature vdW ferromagnet Fe5GeTe2.", "Identified strong electron-magnon coupling as a key factor in the electronic structure renormalization.", "Provides a microscopic link between complex crystal structure and macro-scale magnetic properties."]}}, {"title": "Room-Temperature Intrinsic Nonlinear Planar Hall Effect in TaIrTe4", "journal": "PRL_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/hbdj-2hgf", "authors": "Chang Jiang, Fan Yang, Yu Zhao, et al.", "last_authors": "Shaoming Dong, Faxian Xiu", "summary": "Author(s): Chang Jiang, Fan Yang, Yu Zhao, Jinshan Yang, Peng Yu, Huiying Liu, Yuda Zhang, Zehao Jia, Xiangyu Cao, Li Tian, Jingyi Yan, Zheng Liu, Zhongkai Liu, Xian-Lei Sheng, Cong Xiao, Shengyuan A. Yang, Shaoming Dong, and Faxian Xiu A room-temperature intrinsic nonlinear planar Hall effect in the nonmagnetic topological semimetal TaIrTe 4 reveals how an in-plane magnetic field generates a Berry-connection-polarizability dipole through an orbital mechanism. [Phys. Rev. Lett. 136, 236302] Published Fri Jun 12, 2026", "tier": "A_MUST_READ", "score": "9", "reason": "Berry connection polarizability in a 112-family topological semimetal; direct interest match.", "tags": ["transport", "material", "topology"], "image": "", "briefing": {"background": "비자성 물질에서도 결정의 대칭성이 깨지면 비선형적인 홀 효과(Nonlinear Hall Effect)가 나타날 수 있습니다. 이는 베리 곡률(Berry curvature)과 관련된 양자 기하학적 특성을 측정하는 중요한 도구입니다.", "motivation": "기존의 비선형 홀 효과는 주로 극저온에서 관찰되었으나, 실제 소자 응용을 위해서는 상온에서 작동하는 고유(intrinsic) 비선형 효과를 찾는 것이 필수적입니다. TaIrTe4와 같은 Weyl 반도체 후보군이 이 가능성을 열어주고 있습니다.", "result": "TaIrTe4에서 상온 고유 비선형 평면 홀 효과(NPHE)를 발견했습니다. 이 현상은 평면 내 자기장에 의해 유도된 '베리 연결 편극성(Berry-connection-polarizability) 쌍극자'에서 기인하며, 이는 궤도 기작(orbital mechanism)을 통해 발생함을 규명했습니다.", "implication": "자기장 없이도 위상학적 특성을 이용한 정류(rectification)나 테라헤르츠 감지가 상온에서 가능함을 시사하며, 112 계열 화합물의 새로운 활용도를 제시합니다.", "novelty": "독자님의 관심 소재인 112 계열(TaNiTe2 등과 유사한 구조) 위상 반도체에서 상온 비선형 수송 특성을 확인했다는 점이 매우 중요합니다. Berry curvature dipole을 넘어 BCP dipole이라는 고차원적 개념을 실험적으로 구현했습니다.", "unresolved": "궤도 기작 외에 스핀-궤도 결합이나 산란 기작이 비선형 신호에 미치는 정량적 기여도를 완벽히 분리하는 숙제가 남아있습니다.", "future_work": "다른 112 계열 물질에서의 보편성 확인 및 BCP dipole을 극대화하기 위한 격자 변형(strain) 엔지니어링 연구가 예상됩니다.", "concepts": [{"term": "Nonlinear Planar Hall Effect", "why_emerged": "선형 응답 이론을 넘어서는 고차원적인 전하 수송 현상을 이해하고 위상학적 물리량을 측정하기 위해 등장했습니다.", "origin": "최근 2D 위상 물질 및 Weyl 반도체 수송 연구 그룹들에서 제안 및 관측되었습니다.", "connections": "Berry curvature dipole, Second-harmonic generation, Weyl semimetals"}, {"term": "Berry-connection-polarizability (BCP) dipole", "why_emerged": "베리 곡률 쌍극자만으로 설명되지 않는 고유 비선형 홀 응답을 설명하기 위해 도입된 물리량입니다.", "origin": "Cong Xiao, Shengyuan A. Yang 등 이론 물리 그룹에서 제안되었습니다.", "connections": "Quantum metric, Orbital magnetization, Nonlinear transport"}], "english_summary": ["Demonstrated room-temperature intrinsic nonlinear planar Hall effect in the topological semimetal TaIrTe4.", "Revealed the role of Berry-connection-polarizability (BCP) dipole driven by an orbital mechanism.", "Connects topological electronic structures of 112-family materials to practical room-temperature applications."]}}, {"title": "Visualizing Symmetry Broken Chern Insulators and their Quantum Melting", "journal": "arXiv_CondMat", "source": "author whitelist", "link": "https://arxiv.org/abs/2606.23795", "authors": "Minhao He, Yen-Chen Tsui, Ran Peng, et al.", "last_authors": "Oskar Vafek, Ali Yazdani", "summary": "arXiv:2606.23795v1 Announce Type: new Abstract: In the presence of a magnetic field, electronic states of moir\\'e quantum materials develop a Hofstadter spectrum that provides a unique setting for studying the interplay between band topology and strong electron-electron interaction. Using scanning tunneling microscopy, we study Hofstadter's states in bilayer graphene aligned with hexagonal BN and directly visualize the formation of interaction-driven symmetry breaking Chern insulators. Our measurements reveal the formation of phases that double, triple or quadruple the moir\\'e unit cell at fractional filling of the Hofstadter bands, as well as states with complex intra-unit-cell wave functions. We visualize two distinct quantum phenomena in different Chern states, including quantum melting driven by the appearance and proliferation of topological defects, and a quantum transition co-occurring with phase competition and separation.", "tier": "A_MUST_READ", "score": "9", "reason": "author whitelist: Ali Yazdani", "tags": ["scanningtunneling", "Chern", "graphene", "topological"], "image": "https://arxiv.org/static/browse/0.3.4/images/arxiv-logo-fb.png", "briefing": {"background": "모아레(moiré) 물질은 격자 간의 간섭으로 인해 호프스타터 스펙트럼(Hofstadter spectrum)을 형성하며, 강한 전자 상호작용을 통해 다양한 양자 상태를 만들어낼 수 있는 훌륭한 플랫폼입니다.", "motivation": "이론적으로 예측된 '상호작용에 의한 대칭성 붕괴 Chern 절연체'를 실공간에서 직접 시각화하고, 이들이 어떻게 붕괴(melting)되거나 상전이를 일으키는지 관찰하고자 했습니다.", "result": "hBN과 정렬된 이층 그래핀에서 STM을 사용하여, 호프스타터 밴드의 분수 채움(fractional filling) 상태에서 모아레 단위 격자가 2배, 3배, 4배로 확장되는 대칭성 붕괴 Chern 절연체를 시각화했습니다. 또한 위상 결함(topological defects)의 증식에 의한 양자 용융(quantum melting) 현상을 확인했습니다.", "implication": "모아레 시스템에서의 Chern 상태가 단순한 단일 상이 아니라, 복잡한 공간적 파동함수와 결함에 의해 지배받는 동역학적인 상태임을 밝혀냈습니다.", "novelty": "Ali Yazdani 그룹의 고정밀 STM 연구로, 독자님의 관심사인 Chern insulator와 대칭성 붕괴 현상을 나노미터 수준에서 직접 보여줍니다. 특히 호프스타터 상태의 공간적 분포를 직접 매핑했다는 점이 독보적입니다.", "unresolved": "관찰된 다양한 Chern 상태들 사이의 경쟁이 외부 환경(압력, 게이트 전압)에 의해 얼마나 미세하게 제어될 수 있는지는 추가 연구가 필요합니다.", "future_work": "위상 결함을 인위적으로 조작하여 양자 상전이를 유도하거나, 다른 모아레 시스템(예: transition metal dichalcogenides)으로의 확장 연구가 기대됩니다.", "concepts": [{"term": "Hofstadter spectrum", "why_emerged": "강한 자기장 하에서 주기적인 격자 구조를 지닌 전자의 에너지 준위가 프랙탈 구조를 가짐을 설명하기 위해 등장했습니다.", "origin": "Douglas Hofstadter (1976)", "connections": "Landau levels, Moiré superlattice, Quantum Hall effect"}, {"term": "Chern Insulator", "why_emerged": "외부 자기장 없이도 자성이나 상호작용을 통해 양자 홀 효과와 같은 위상학적 상태를 갖는 절연체를 설명하기 위해 필요합니다.", "origin": "F. D. M. Haldane (1988)", "connections": "Berry curvature, Quantum anomalous Hall effect, Topology"}], "english_summary": ["Visualized symmetry-breaking Chern insulators in hBN-aligned bilayer graphene using high-resolution STM.", "Observed unit cell multiplication (doubling to quadrupling) at fractional fillings of Hofstadter bands.", "Discovered quantum melting of topological phases driven by the proliferation of topological defects."]}}, {"title": "Emergent Dynamical Kondo Coherence and Competing Magnetic Order in a Correlated Kagome Flat-Band Metal CsCr6Sb6", "journal": "PRL_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/f8b9-q54m", "authors": "Xiangqi Liu, Xuefeng Zhang, Jiachen Jiao, et al.", "last_authors": "Gang Li, Yanfeng Guo", "summary": "Author(s): Xiangqi Liu, Xuefeng Zhang, Jiachen Jiao, Renjie Zhang, Kaiwen Chen, Ying Wang, Yunguan Ye, Zhenhai Yu, Chengyu Jiang, Xia Wang, Bei Jiang, Yaobo Huang, Lei Shu, Baiqing Lv, Gang Li, and Yanfeng Guo Correlated kagome metals host unique electronic states that enable exotic quantum phenomena. In the recently emerged ${\\mathrm{CsCr}}_{6}{\\mathrm{Sb}}_{6}$, these manifest through Kondo behavior from localized $\\mathrm{Cr}\\text{−}3d$ electrons and unprecedented band flattening near the Fermi level. … [Phys. Rev. Lett. 136, 256601] Published Tue Jun 23, 2026", "tier": "B_IMPORTANT_CONDMAT", "score": "10", "reason": "Direct hit: Electronic structure (flat bands) and Kondo behavior in a new kagome metal.; demoted from A: broad CM, not direct user/project hit", "tags": ["experiment", "material", "kagome", "electronic-structure"], "image": "", "briefing": {"background": "Kagome 격자 구조는 기하학적 좌절(frustration)로 인해 플랫 밴드(flat band)와 Dirac cone 같은 독특한 전자 구조를 형성하며, 이는 강한 전자 상관관계와 위상적 특성이 결합된 양자 상태를 연구하기에 최적의 플랫폼입니다.", "motivation": "최근 주목받는 AV3Sb5 Weyl semimetals", "journal": "Nature_Materials", "source": "Gemini", "link": "https://www.nature.com/articles/s41563-026-02630-6", "authors": "Xiangyu Jiang, Zeping Shi, Yuhan Du, et al.", "last_authors": "Junhao Chu, Xiang Yuan", "summary": "Nature Materials, Published online: 24 June 2026; doi:10.1038/s41563-026-02630-6 The different Fermi velocities of particle and hole bands result in a giant mid-infrared circular dichroism in the magnetic Weyl semimetal Mn(Bi1−xSbx)2Te4.", "tier": "B_IMPORTANT_CONDMAT", "score": "9", "reason": "Direct electronic structure study of topological Weyl material with circular dichroism relevance.", "tags": ["Weyl", "spectroscopy", "topological"], "image": "https://media.springernature.com/m685/springer-static/image/art%3A10.1038%2Fs41563-026-02630-6/MediaObjects/41563_2026_2630_Fig1_HTML.png", "briefing": {"background": "Weyl 준금속은 비정상적인 수송 특성과 위상학적 응답을 보이며, 특히 빛의 편광에 반응하는 광학적 원형 이색성(Circular Dichroism)은 물질의 베리 곡률과 밴드 구조를 이해하는 핵심 도구입니다.", "motivation": "입자-홀 대칭성(Particle-hole symmetry)이 깨진 실제 Weyl 준금속 시스템에서 원형 이색성 신호가 어떻게 증폭되고 제어될 수 있는지 실험적으로 규명하고자 했습니다.", "result": "자기적 Weyl 준금속인 Mn(Bi1-xSbx)2Te4에서 입자와 홀 밴드의 페르미 속도 차이로 인해 발생하는 거대하고 넓은 대역의 중적외선 원형 이색성(CD)을 관측했습니다.", "implication": "입자-홀 대칭성 파괴라는 단순한 밴드 특징이 거대 광학 응답을 생성할 수 있음을 보여주며, 위상 물질 기반의 고성능 중적외선 광학 소자 설계 원리를 제공합니다.", "novelty": "CD-ARPES에 관심이 많은 유저에게 광학적 CD 신호의 근본 원인을 입자-홀 대칭성 붕괴와 연결해 설명하며, 특히 자성 위상 물질에서의 거대 응답을 보고한 점이 중요합니다.", "unresolved": "도핑 농도 x의 변화가 Weyl node의 위치 및 CD 신호 세기에 미치는 비선형적 영향에 대한 상세한 분석이 보완되어야 합니다.", "future_work": "다른 자기적 Weyl 준금속에서의 보편성 확인 및 CD 응답을 이용한 초고속 광 스위칭 소자 구현 연구가 기대됩니다.", "concepts": [{"term": "Circular Dichroism (CD)", "why_emerged": "좌원편광과 우원편광에 대한 흡수율 차이를 통해 물질의 키랄성이나 위상적 성질을 분석하기 위해 도입되었습니다.", "origin": "Aimé Cotton (1895)", "connections": "CD-ARPES, Berry curvature, Chiral anomaly"}, {"term": "Weyl Semimetal", "why_emerged": "상대론적 Weyl 페르미온을 고체 내에서 구현하고 그에 따른 비정상 홀 효과 등을 연구하기 위해 등장했습니다.", "origin": "Hermann Weyl (이론), 2015년 실험적 발견 (TaAs 등)", "connections": "Dirac semimetals, Fermi arcs, Topological insulators"}, {"term": "Particle-Hole Symmetry Breaking", "why_emerged": "이상적인 모델과 달리 실제 물질에서 전도띠와 가전자띠가 비대칭적일 때 나타나는 새로운 물성을 설명하기 위해 필요합니다.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "Non-linear optical response, Fermi velocity asymmetry"}], "english_summary": ["Observation of giant, broadband mid-infrared circular dichroism in magnetic Weyl semimetal Mn(Bi1-xSbx)2Te4.", "CD is driven by particle-hole symmetry breaking, manifesting as asymmetric Fermi velocities.", "Establishes a link between band symmetry breaking and enhanced topological optical responses.", "Provides a foundation for designing infrared optoelectronic devices using topological materials."]}}, {"title": "Observation of Altermagnetic Order Switching in Bulk MnTe by Polarized Neutron Diffraction", "journal": "PRL_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/yklc-9n6t", "authors": "Zheyuan Liu, Shinichiro Asai, Shingo Takahashi, Hiraku Saito, Taro Nakajima, Takatsugu Masuda", "last_authors": "Taro Nakajima, Takatsugu Masuda", "summary": "Author(s): Zheyuan Liu, Shinichiro Asai, Shingo Takahashi, Hiraku Saito, Taro Nakajima, and Takatsugu Masuda Altermagnetic order, characterized by the Néel vector, breaks time-reversal symmetry (TRS) even in the nonrelativistic limit. Although spin-polarized and anomalous transport phenomena emerge with this order, they are mutually compensated by TRS-connected antiphase domains with opposite Néel vectors.… [Phys. Rev. Lett. 136, 256704] Published Tue Jun 23, 2026", "tier": "B_IMPORTANT_CONDMAT", "score": "9", "reason": "Experimental neutron study of altermagnetism, directly matching the user's secondary material interests.", "tags": ["experiment", "material", "altermagnetism", "neutrons"], "image": "", "briefing": {"background": "Altermagnetism은 순 자화값은 0이지만 결정 구조의 이방성으로 인해 실공간뿐 아니라 운동량 공간에서도 시간 반전 대칭성이 깨져 있는 새로운 자성 상태입니다.", "motivation": "Altermagnet의 핵심 특징인 Néel 벡터의 방향에 따른 도메인 구조와 이들의 외부 자극에 의한 스위칭 현상을 직접적으로 확인하고자 했습니다.", "result": "편광 중성자 회절(Polarized Neutron Diffraction) 기법을 활용하여 MnTe 벌크 시료 내에서 altermagnetic 질서(Néel 벡터)의 방향이 스위칭되는 과정을 실험적으로 입증하였습니다.", "implication": "Altermagnet 내에서 나타나는 도메인의 제어 가능성을 확인함으로써, 강자성체처럼 제어하기 쉬우면서도 반강자성체처럼 누설 자장이 없는 차세대 스핀트로닉스 소자 개발의 가능성을 열었습니다.", "novelty": "유저의 주요 관심사인 altermagnetism과 TRSB(시간 반전 대칭성 파괴)를 다루며, 중성자 산란이라는 신뢰도 높은 실험 기법을 통해 물성을 확증했다는 점이 돋보입니다.", "unresolved": "Néel 벡터의 스위칭을 유도하는 임계 자기장의 세기와 결정 결함이 도메인 벽의 이동에 미치는 영향은 아직 명확하지 않습니다.", "future_work": "전기장이나 스핀 토크를 이용한 비자기적 방식의 altermagnetic 도메인 제어 연구가 후속될 것으로 보입니다.", "concepts": [{"term": "Altermagnetism", "why_emerged": "강자성과 반강자성의 장점을 동시에 갖춘(순 자화는 없으나 스핀 분극된 밴드를 가짐) 제3의 자성 분류를 위해 제안되었습니다.", "origin": "Libor Šmejkal et al. (2022년경 본격 정립)", "connections": "Spintronics, Non-relativistic spin splitting"}, {"term": "Néel Vector", "why_emerged": "반강자성 또는 altermagnet에서 스핀 정렬의 주된 방향을 정의하고 질서 변수로 사용하기 위해 필요합니다.", "origin": "Louis Néel (1930년대 반강자성 이론 확립 시)", "connections": "Antiferromagnetic resonance, Domain switching"}, {"term": "Polarized Neutron Diffraction", "why_emerged": "물질 내의 복잡한 자기 구조와 스핀 배열을 다른 산란 효과와 분리하여 정밀하게 측정하기 위해 개발되었습니다.", "origin": "Clifford Shull (1950년대 노벨상 수상 연구)", "connections": "Magnetic structure factor, Neutron scattering"}], "english_summary": ["Experimental demonstration of altermagnetic order switching in bulk MnTe using polarized neutron diffraction.", "Direct visualization of Néel vector reorientation, proving the controllability of altermagnetic domains.", "Advances the fundamental understanding of time-reversal symmetry breaking in zero-magnetization systems.", "Crucial for developing altermagnet-based spintronics with high-speed and low-energy operation."]}}, {"title": "Field-free Josephson diode and tunable ϕ0-junction in chiral kagome antiferromagnets", "journal": "npj_QuantumMaterials", "source": "Gemini", "link": "https://www.nature.com/articles/s41535-026-00907-2", "authors": "Jin-Xing Hou, Chuang Li, Lun-Hui Hu, Song-Bo Zhang", "last_authors": "Lun-Hui Hu, Song-Bo Zhang", "summary": "npj Quantum Materials, Published online: 17 June 2026; doi:10.1038/s41535-026-00907-2 Field-free Josephson diode and tunable ϕ 0 -junction in chiral kagome antiferromagnets", "tier": "B_IMPORTANT_CONDMAT", "score": "9", "reason": "Direct relevance to kagome materials and symmetry-broken electronic states.", "tags": ["kagome", "antiferromagnetism", "Josephson-junction"], "image": "https://pubads.g.doubleclick.net/gampad/ad?iu=/285/npjquantmats.nature.com/article&sz=728x90&c=-117704415&t=pos%3Dtop%26type%3Darticle%26artid%3Ds41535-026-00907-2%26doi%3D10.1038/s41535-026-00907-2%26subjmeta%3D301,639,766%26kwrd%3DMaterials+science,Physics", "briefing": {"background": "카고메 격자 구조는 기하학적 좌절과 평탄한 밴드(flat band), 반-반-크로싱(Dirac points) 등으로 인해 위상물성과 강상관 전자계 연구의 핵심 플랫폼으로 자리 잡았습니다.", "motivation": "카고메 반강자성체에서 나타나는 카이랄성(chirality)이 외부 자기장 없이 어떻게 조셉슨 소자의 비가역적 전류 흐름(Josephson diode effect)과 위상차(phi-0 junction)를 제어할 수 있는지 이론적으로 탐구하고자 합니다.", "result": "카이랄 카고메 반강자성체 내부의 대칭성 파괴가 외부 자기장 없이도 조셉슨 다이오드 효과를 유도하며, 위상차를 조절할 수 있는 phi-0 접합 구현이 가능함을 보였습니다.", "implication": "위상물질과 초전도체의 결합을 통해 자기장 없이 작동하는 초전도 전자소자(superconducting spintronics)의 새로운 설계 원리를 제시합니다.", "novelty": "외부 자기장 인가라는 기존의 필수 조건을 제거하여, 소형화 및 저전력 초전도 양자 회로에 응용 가능한 실질적인 메커니즘을 제안했다는 점이 주목됩니다.", "unresolved": "실제 실험적 구현을 위해 필요한 특정 카고메 반강자성체 후보 물질의 물성 최적화와 계면 접합 기술의 정밀도가 여전히 과제로 남아 있습니다.", "future_work": "실제 해당 물성을 보유한 카고메 화합물을 합성하여 저온 조셉슨 접합 실험을 수행하고, 위상차 조절 능력을 검증하는 후속 연구가 필요합니다.", "concepts": [{"term": "Josephson diode effect", "why_emerged": "초전도체 소자에서 전류의 비가역적 흐름을 제어하여 정류 작용을 얻기 위해 필요합니다.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "비대칭 접합, 초전도 스핀트로닉스, 위상 절연체 접합과 관련됨"}, {"term": "phi-0 junction", "why_emerged": "접합면의 위상차를 외부 요인 없이 제어하여 스핀-궤도 결합 시스템에서 전류 제어를 최적화하기 위해 고안되었습니다.", "origin": "Buzdin 등(2008) 등 다수의 이론가들이 스핀-궤도 결합 시스템에서 제안함", "connections": "Josephson 효과, 스핀-궤도 결합, 강자성/반강자성 접합부"}], "english_summary": ["Explores Josephson diode effect in chiral kagome an ", "score": "8", "reason": "Relates to cuprates and time-reversal symmetry breaking in moiré junctions.", "tags": ["cuprate", "superconductivity", "moiré"], "image": "", "briefing": {"background": "트위스트된 이중층 구조(moiré systems)는 층간 상호작용과 뒤틀림 각도를 조절하여 새로운 전자 상을 유도할 수 있는 플랫폼입니다. 특히 고온 초전도체인 구리산화물(cuprate)을 이 구조에 적용할 경우, 시간 역전 대칭성 깨짐(TRSB)이 동반된 특이 초전도 상태가 나타날 것으로 기대되어 왔습니다.", "motivation": "트위스트된 구리산화물 조셉슨 접합 실험들에서 TRSB 신호가 일관되지 않게 나타나는 현상을 이론적으로 규명하고자 하였습니다.", "result": "트위스트 각도, 전하 충진률(filling), 층간 터널링 강도라는 세 가지 미시적 매개변수가 경쟁하는 초전도 상태들을 결정하며, 실험적 가변성이 이 매개변수들의 차이에서 기인함을 밝혔습니다.", "implication": "실험 조건의 미세한 차이가 TRSB 여부를 결정하는 핵심임을 입증함으로써, 구리산화물 모아레 구조에서의 초전도상 제어 가능성을 제시합니다.", "novelty": "기존의 무작위적인 데이터 해석 대신 미시적 매개변수 공간에서의 상태도(phase diagram) 분석을 통해 모아레 구리산화물의 물리적 다양성을 체계적으로 설명했습니다.", "unresolved": "실제 실험 기기 간의 불균일성을 완벽하게 제어할 수 있는 공정상의 구체적인 방안은 제시되지 않았습니다.", "future_work": "특정 트위스트 각도에서의 TRSB 초전도 상태를 검증하기 위한 정밀한 위상 민감형 조셉슨 접합 측정 연구가 필요합니다.", "concepts": [{"term": "Twisted Bilayer Cuprate", "why_emerged": "그래핀 모아레 시스템의 성공 이후, 강력한 전자 상관관계가 존재하는 구리산화물에 이를 도입하여 새로운 초전도 위상을 탐색하기 위해 등장했습니다.", "origin": "최근 2D 물질 및 고온 초전도 연구 분야에서 점진적으로 발전했습니다.", "connections": "트위스트 이중층 그래핀, 고온 초전도체 이론, 조셉슨 접합 물리와 연결됩니다."}, {"term": "Time-Reversal Symmetry Breaking (TRSB)", "why_emerged": "초전도 상태에서 자기적 질서가 동반되거나 비통상적인 파라미터가 유도될 때 물리적 이해를 위해 필요합니다.", "origin": "전통적인 BCS 이론 이후 Ginzburg-Landau 이론 등에서 논의되었습니다.", "connections": "카고메 금속의 자성, 위상 초전도체, 카이랄 초전도체 연구와 밀접합니다."}], "english_summary": ["Twisted bilayer cuprates are explored as platforms for TRSB superconducting states.", "Experiments have yielded conflicting results regarding the presence of TRSB.", "The authors show that twist angle, filling, and interlayer tunneling stabilize competing states.", "The findings unify the understanding of variability in device-specific superconducting behaviors."]}}, {"title": "Giant anomalous Hall conductivity and magnetostriction in heavy-element substituted Co-based all-d Heusler alloys", "journal": "PRB_Recent upling in magnetic topological materials."]}}, {"title": "Band offsets and stability of WSe2/RuCl3 van der Waals charge-transfer contacts", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2606.24199", "authors": "Thomas S. Nielsen, Edvard Solbrekken, Christian Overby, et al.", "last_authors": "Takashi Taniguchi, S{\\o}ren Ulstrup", "summary": "arXiv:2606.24199v1 Announce Type: new Abstract: The layered Mott insulator $\\alpha$-RuCl$_3$ induces degenerate hole-doping in two-dimensional semiconductors due to its large electron affinity, making it a promising charge-transfer material for establishing ohmic contacts in electronic devices. In order to assess the applicability and guide the design of devices incorporating RuCl$_3$ it is critical to determine the electronic structure and robustness of the band offsets that underpin the transport properties of semiconductors in contact with RuCl$_3$. Here, we apply micro-focused angle-resolved photoemission spectroscopy to determine the electronic structure of single-layer WSe$_2$ contacted to RuCl$_3$ on hexagonal boron nitride substrates. We find that formation of a functioning WSe$_2$/RuCl$_3$ contact leads to a valence band shift of $(0.68 \\pm 0.05)$ eV towards the Fermi energy in WSe$_2$. The charge transfer effect is challenging to observe as it depends sensitively on fabrication conditions such as solvent exposure, quality of interface encapsulation and heating of RuCl$_3$, imposing strict requirements on device design to attain high-quality contacts.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Direct ARPES characterization of vdW heterostructure band offsets.", "tags": ["ARPES", "vanderWaals", "electronic-structure"], "image": "https://arxiv.org/html/2606.24199v1/x1.png", "briefing": {"background": "반데르발스 이종 접합체는 원자 단위의 제어가 가능해 차세대 전자소자 후보로 꼽히지만, 접합면에서의 전하 이동과 밴드 오프셋 조절은 여전히 어려운 문제입니다.", "motivation": "WSe2와 같은 2D 반도체에 alpha-RuCl3(Mott 절연체)를 접합하여 전자소자용 오믹 컨택을 형성할 때, 밴드 오프셋이 어떻게 변하는지 정량적으로 측정하고자 합니다.", "result": "마이크로 ARPES 측정을 통해 WSe2/RuCl3 접합 시 WSe2의 가전자대가 페르미 준위 쪽으로 약 0.68 eV 이동함을 확인했습니다.", "implication": "RuCl3를 이용한 효과적인 도핑 제어법을 제시하며, 향후 2D 소자 설계 시 밴드 정렬을 제어하는 실질적인 데이터를 제공합니다.", "novelty": "현미경 기반 ARPES를 통해 2D 헤테로 구조 내의 복잡한 밴드 정렬을 직접 측정했다는 점이 ARPES 전문가에게 매우 유용합니다.", "unresolved": "제작 공정(용매, 가열 등)에 따라 결과가 매우 민감하게 변하는 불안정성 문제가 해결되지 않았습니다.", "future_work": "보다 안정적이고 재현성 있는 접합 제작 공정을 개발하고, 다른 전이금속 디칼코게나이드와의 접합 연구로 확장할 예정입니다.", "concepts": [{"term": "Band Offset", "why_emerged": "이종 접합 물질 간의 에너지 준위 차이를 결정하여 소자의 전기적 특성을 규정하기 위해 필요.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "Schottky barrier, Charge transfer."}, {"term": "Micro-ARPES", "why_emerged": "작은 크기의 2D 시료 표면에서 국소적인 전자 구조를 분석하기 위해 필요.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "Photoemission spectroscopy, 2D materials."}, {"term": "RuCl3", "why_emerged": "강한 스핀-궤도 결합을 가진 모트 절연체로서, 2D 물질과의 접합에서 전하 주입원으로 활용.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "Kitaev magnets, van der Waals heterostructures."}], "english_summary": ["Direct measurement of band offsets in WSe2/RuCl3 van der Waals heterostructures.", "Micro-ARPES reveals 0.68 eV valence band shift due to charge transfer.", "Highlights sensitivity of electronic properties to fabrication conditions.", "Crucial data for engineering high-quality ohmic contacts in 2D electronics."]}}, {"title": "Emergent partons in fractional quantum Hall systems", "journal": "Nature_Physics", "source": "Gemini", "link": "https://www.nature.com/articles/s41567-026-03338-9", "authors": "Zihao Yang, Yifan Wang, Xinyu Lu, et al.", "last_authors": "Ajit C. Balram, Lingjie Du", "summary": "Nature Physics, Published online: 22 June 2026; doi:10.1038/s41567-026-03338-9 In a geometrical theory for the fractional quantum Hall effect, chiral spin-2 neutral excitations arise. Now, multiple such excitations are observed and provide evidence for the parton description of the quantum Hall effect.", "tier": "B_IMPORTANT_CONDMAT", "score": " ore": "7", "reason": "Anomalous transport in magnetic materials relevant to topological/Hall projects.", "tags": ["anomalous-Nernst", "Heusler", "transport"], "image": "", "briefing": {"background": "Heusler 합금은 독특한 자기적, 구조적 상전이를 보이며 spintronics 및 열전 소자 분야에서 중요한 재료로 연구되고 있습니다. Ni2MnGa는 특히 형상 기억 효과와 결합된 자기적 성질로 인해 주목받습니다.", "motivation": "비자성/강자성 계면에서 발생하는 비정상 네른스트 효과(ANE)를 통해 열전 특성을 조사하고, 위상적 전자 구조와 자기적 위상의 연관성을 찾기 위함입니다.", "result": "Ni2MnGa/MgO 박막에서 나타나는 비정상 네른스트 효과의 발현을 보고하고, 오스테나이트-마르텐사이트 상전이와의 연관성을 분석했습니다.", "implication": "열전 소자 및 자성 센서 소자 설계 시 상전이 구간에서의 수송 물성 제어 가능성을 시사합니다.", "novelty": "잘 알려진 형상 기억 합금의 열전 수송 물성을 위상적/자기적 관점에서 재조명했다는 점이 독특합니다.", "unresolved": "관측된 네른스트 신호의 기원이 베리 곡률(Berry curvature)에 의한 것인지, 아니면 상전이 시 발생하는 국부적 스핀 산란에 의한 것인지에 대한 정량적 분리가 완전히 이루어지지 않았습니다.", "future_work": "위상적 밴드 구조 계산과 결합한 온도 의존적 ANE 측정 및 홀 효과와의 직접 비교 연구가 필요합니다.", "concepts": [{"term": "비정상 네른스트 효과 (ANE)", "why_emerged": "자기 물질에서 온도 기울기를 가했을 때 횡방향 전압이 발생하는 현상으로, 베리 곡률 및 스핀-궤도 결합 연구에 활용됨.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "이상 홀 효과(AHE), 스핀-궤도 토크와 밀접한 관계."}, {"term": "Heusler 합금", "why_emerged": "높은 큐리 온도와 반금속성(half-metallicity) 특성을 가진 자성 재료를 설계하기 위해 고안됨.", "origin": "Fritz Heusler에 의해 1903년 발견.", "connections": "형상 기억 합금, 위상적 반강자성체 연구로 확장됨."}], "english_summary": ["The study explores the anomalous Nernst effect (ANE) in Ni2MnGa/MgO thin films.", "It correlates transport properties with the austenite-martensite phase transition of the shape-memory alloy.", "The findings suggest potential applications in thermal-to-electric conversion based on magnetic phase transitions."]}}, {"title": "Boltzmann transport theory of magnon-exciton drag", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/s8bd-vb42", "authors": "Zakhar A. Iakovlev, Akashdeep Kamra, Mikhail M. Glazov", "last_authors": "Akashdeep Kamra, Mikhail M. Glazov", "summary": "Author(s): Zakhar A. Iakovlev, Akashdeep Kamra, and Mikhail M. Glazov We develop a microscopic theory -orbit coupled distorted honeycomb magnet BiErGeO5", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/z66x-362w", "authors": "S. Mohanty, S. Guchhait, S. S. Islam, Surya P. Patra, M. P. Saravanan, J. A. Krieger, T. J. Hicken, H. Luetkens, D. T. Adroja, Gøran J. Nilsen, M. D. Le, and R. Nath", "last_authors": "D. T. Adroja, Gøran J. Nilsen, M. D. Le, and R. Nath", "summary": "Author(s): S. Mohanty, S. Guchhait, S. S. Islam, Surya P. Patra, M. P. Saravanan, J. A. Krieger, T. J. Hicken, H. Luetkens, D. T. Adroja, Gøran J. Nilsen, M. D. Le, and R. Nath Here, the authors report the magnetic properties, crystal electric field excitations, and spin dynamics of a distorted honeycomb magnet BiErGeO 5 . Inelastic neutron scattering and μSR experiments reveal the effect of crystal electric field leading to a Kramers doublet ground state and anisotropic interactions. Despite an anomaly at T N ≃ 0.4 K in heat capacity, μSR measurements rule out a magnetic long-range order, and instead suggest persistent spin fluctuations down to 30 mK, highlighting unconventional magnetism in this spin-orbit coupled honeycomb system. [Phys. Rev. B 113, 214452] Published Tue Jun 23, 2026", "tier": "B_IMPORTANT_CONDMAT", "score": "7", "reason": "Interesting neutron scattering study on a spin-orbit coupled magnetic material.", "tags": ["neutronscattering", "spin-orbitcoupling", "magnetism"], "image": "", "briefing": {"background": "스핀-궤도 결합(SOC)과 기하학적 좌절(frustration)이 공존하는 자성체는 양자 스핀 액체나 비전통적인 자기 질서를 탐색하는 현대 응집물리학의 주요 연구 분야입니다.", "motivation": "벌집 격자 구조의 BiErGeO5에서 SOC와 결정 전기장(CEF)이 어떠한 자기적 기저 상태와 동역학을 유도하는지 규명하고자 함.", "result": "비탄성 중성자 산란(INS)과 뮤온 스핀 회전(μSR) 실험을 통해 CEF에 의한 크래머스 이중항(Kramers doublet) 기저 상태와 이방성 상호작용을 확인했으나, 저온에서 자기 장거리 질서 없이 스핀 요동이 지속됨을 발견함.", "implication": "이 물질이 스핀-궤도 결합된 저차원 자성체에서 나타나는 비전통적 자기 상태를 탐구하는 후보 물질임을 시사함.", "novelty": "벌집 격자 기반 자성체에서 SOC와 CEF가 결합하여 나타나는 독특한 저온 양자 동역학을 실험적으로 규명함.", "unresolved": "0.4 K 근처에서 관측된 열용량 이상(anomaly)의 정확한 기원과 스핀 요동의 구체적인 메커니즘은 여전히 불분명함.", "future_work": "초저온에서의 추가적인 자화율 측정 및 고자기장 하에서의 중성자 산란 실험을 통한 이방성 에너지 갭 정밀 분석.", "concepts": [{"term": "Kramers doublet", "why_emerged": "시간 반전 대칭성이 존재하는 계에서 축퇴된 에너지 준위를 설명하기 위해 필요.", "origin": "Hendrik Kramers (1930년 제안).", "connections": "시간 반전 대칭성 및 스핀-궤도 결합을 가진 자기 계의 기저 상태 분석에 필수적임."}, {"term": "Crystal Electric Field (CEF)", "why_emerged": "이온 주위의 배위자(ligands)에 의한 전기장이 이온의 d 또는 f 오비탈 에너지를 분리하는 현상을 이해하기 위해 도입.", "origin": "Hans Bethe (1929년 이론적 확립).", "connections": "희토류 자성체의 이방성 및 자기 구조를 결정짓는 핵심 물리량임."}], "english_summary": ["Investigated magnetism in the distorted honeycomb lattice material BiErGeO5.", "Identified a Kramers doublet ground state via CEF effects using INS and μSR.", "Reported persistent spin fluctuations down to 30 mK despite a heat capacity anomaly at 0.4 K.", "Confirmed the absence of long-range magnetic order, indicating unconventional spin dynamics."]}}, {"title": "Decisive role of an extra Fe sublattice: Frustration, criticality, and skyrmions in the van der Waals ferromagnets Fe5GeTe2 versus Fe3GeTe2", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/v9rm-l6vb", "authors": "Jyoti Saini, Ankita Tiwari, Pawan Kumar Srivastava, Changgu Lee, Subhasis Ghosh", "last_authors": "Changgu Lee, Subhasis Ghosh", "summary": "Author(s): Jyoti Saini, Ankita Tiwari, Pawan Kumar Srivastava, Changgu Lee, and Subhasis Ghosh The van der Waals magnets ${\\mathrm{Fe}}_{3}{\\mathrm{GeTe}}_{2}$ and ${\\mathrm{Fe}}_{5}{\\mathrm{GeTe}}_{2}$, chemically similar yet magnetically distinct, provide an ideal platform for probing how structural complexity governs emergent magnetic order, anisotropy, and topological textures. ${\\mat… [Phys. Rev. B 113, 214451] Published Tue Jun 23, 2026", "tier": "B_IMPORTANT_CONDMAT", "score": "7", "reason": "Relevant van der Waals magnets with interesting electronic/topological texture properties.", "tags": ["vanderWaals", "topological", "ferromagnet"], "image": "", "briefing": {"background": "Fe3GeTe2와 같은 반데르발스(vdW) 강자성체는 층간 결합의 조절을 통해 위상적 자성 텍스처(스커미온 등)를 제어할 수 있는 차세대 스핀트로닉스 소재로 주목받음.", "motivation": "화학적으로 유사한 Fe3GeTe2와 Fe5GeTe2 사이의 자기적 차이를 결정하는 Fe 서브격자의 역할을 규명하고자 함.", "result": "Fe5GeTe2에서 추가적인 Fe 서브격자가 자기적 좌절과 임계 거동을 조절하며, 스커미온과 같은 위상적 자성 구조 발현에 핵심적인 역할을 함을 제시함.", "implication": "vdW 강자성체에서 적층 구조나 화학적 조성을 미세하게 조정하여 위상 자성 상태를 엔지니어링할 수 있는 가이드라인을 제공함.", "novelty": "추가적인 Fe 서브격자가 구조적 복잡성을 통해 강자성 상태와 위상적 텍스처를 어떻게 재구성하는지 비교 분석함.", "unresolved": "이러한 미세 구조적 차이가 스커미온의 안정성 및 동역학적 특성에 미치는 정량적 관계는 향후 정밀 조사가 필요.", "future_work": "로렌츠 투과 전자 현미경(LTEM)을 통한 스커미온 발현 직접 관측 및 위상적 홀 효과 연구.", "concepts": [{"term": "Van der Waals Ferromagnets", "why_emerged": "2차원 극한에서도 장거리 자기 질서를 유지하는 물질을 통해 물리적 자유도를 확보하기 위해 필요.", "origin": "2017년 전후 CrI3, Fe3GeTe2 등의 발견으로 대두됨.", "connections": "위상적 절연체, 스핀트로닉스 소자 응용 분야와 밀접함."}, {"term": "Skyrmion", "why_emerged": "자기 모멘트의 소용돌이 형태의 준입자가 가진 위상적 보호성을 스핀 정보 저장 소자에 활용하기 위해 필요.", "origin": "Tony Skyrme (입자 물리학에서 제안, 이후 자성체에서 관측).", "connections": "위상적 홀 효과, 전류에 의한 스커미온 이동 제어 연구와 연결됨."}], "english_summary": ["Analyzed the magnetic differences between Fe3GeTe2 and Fe5GeTe2.", "Highlighted the role of the extra Fe sublattice in driving magnetic frustration.", "Connected the structural complexity to the emergence of topological textures like skyrmions.", "Provided insights into engineering magnetic anisotropy in vdW magnets."]}}, {"title": "Engineering ideal two-dimensional type-II nodal line semimetals via stacking and intercalation of van der Waals layers", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/stw7-rdfg", "authors": "Li Chen, Junlan Shi, Jiani Zhang, Botao Fu", "last_authors": "Jiani Zhang, Botao Fu", "summary": "Author(s): Li Chen, Junlan Shi, Jiani Zhang, and Botao Fu Two-dimensional type-II topological semimetals (TSMs), characterized by strongly tilted Dirac cones, have attracted intense interest for their unconventional electronic properties and exotic transport behaviors. However, rational design remains challenging due to the sensitivity of band tilting to l… [Phys. Rev. B 113, 245142] Published Tue Jun 23, 2026", "tier": "B_IMPORTANT_CONDMAT", "score": "7", "reason": "Topological semimetals in vdW materials are central to the user profile.", "tags": ["topologicalsemimetal", "vanderWaals"], "image": "", "briefing": {"background": "위상적 반금속(TSM)은 밴드 구조의 교차점에서 발생하는 Berry 곡률과 이로 인한 이상 홀 효과 등 독특한 물리적 현상을 연구하는 핵심 플랫폼임.", "motivation": "반데르발스 층의 적층과 삽입(intercalation)을 통해 II형 노달 라인 반금속의 밴드 기울기를 설계하는 방법을 탐색하고자 함.", "result": "반데르발스 물질의 층간 결합과 적층 패턴 조절이 밴드 구조의 비대칭성을 유도하여 II형 노달 라인 반금속을 구현할 수 있는 구체적인 설계 전략을 제안함.", "implication": "합성 가능한 물질 라이브러리에서 위상적 상태를 인위적으로 제어할 수 있는 가능성을 보여줌.", "novelty": "II형 위상 반금속의 난제인 밴드 경사도 제어를 적층 구조 엔지니어링을 통해 해결하는 체계적인 방법론 제시.", "unresolved": "제안된 적층 구조가 실제 실험적인 박막 성장 과정에서 열역학적으로 안정적으로 구현될 수 있는지는 추가 검증이 필요.", "future_work": "제시된 적층 구조를 가진 실제 화합물의 ARPES 측정 및 수송 현상 분석을 통한 노달 라인 물리 검증.", "concepts": [{"term": "Type-II Nodal Line Semimetal", "why_emerged": "밴드가 과도하게 기울어져 전자와 정공의 페르미 면이 공존하는 위상적 상태를 탐구하기 위해 필요.", "origin": "Soluyanov et al. (2015년 제안).", "connections": "Lorentz 불변성 위반, 비등방성 자기 저항 등과 관련됨."}, {"term": "Intercalation", "why_emerged": "vdW 층 사이에 원자나 이온을 삽입하여 전자 밀도나 구조적 자유도를 변조하기 위해 사용.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "초전도체 AV3Sb5에서의 위상적 현상 제어 및 도핑 연구에 널리 활용됨."}], "english_summary": ["Proposed a design strategy for Type-II nodal line semimetals in 2D vdW materials.", "Focused on stacking and intercalation as primary tools for tuning band tilting.", "Addressed the challenge of controlling band geometry for topological semimetals.", "Facilitates the rational discovery of exotic electronic phases in layered compounds."]}}, {"title": "Giant and robust Josephson diode effect in multiband topological nanowires", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/q8yz-wrcq", "authors": "Bao-Zong Wang, Zi-Kai Li, Zhong-Da Li, Xiong-Jun Liu", "last_authors":     const img = document.createElement('img');
    img.src = r.image; img.alt = 'Figure or article preview image'; img.loading = 'lazy'; img.referrerPolicy = 'no-referrer'; img.onerror = () => figure.remove();
    figure.appendChild(img);
    figure.appendChild(textEl('figcaption', '', 'Figure / article preview image from the source page'));
    head.appendChild(figure);
  }
  const headText = document.createElement('div');
  headText.className = 'head-text';
  const badges = document.createElement('div');
  badges.className = 'badges';
  if (r.score) badges.appendChild(textEl('span', 'badge score', `${r.score}/10`));
  if (r.tier) badges.appendChild(textEl('span', 'badge', r.tier));
  if (r.journal) badges.appendChild(textEl('span', 'badge', r.journal));
  if (r.source) badges.appendChild(textEl('span', 'badge', r.source));
  headText.appendChild(badges);
  const title = document.createElement('h1');
  if (r.link) { const titleLink = document.createElement('a'); titleLink.href = r.link; titleLink.target = '_blank'; titleLink.rel = 'noopener noreferrer'; titleLink.textContent = r.title || ''; title.appendChild(titleLink); }
  else { title.textContent = r.title || ''; }
  headText.appendChild(title);
  headText.appendChild(textEl('p', 'meta', [r.journal, r.source].filter(Boolean).join(' | ')));
  if (r.last_authors || r.authors) { const authors = document.createElement('p'); authors.className = 'authors'; if (r.last_authors) authors.append('Last authors: ' + r.last_authors); if (r.authors) authors.append((r.last_authors ? ' | ' : '') + 'Authors: ' + r.authors); headText.appendChild(authors); }
  appendLabeledText(headText, 'why', 'Filter reason: ', r.reason);
  if (r.tags && r.tags.length) { const tags = document.createElement('div'); tags.className = 'tags'; r.tags.forEach(tag => tags.appendChild(textEl('span', 'tag', '#' + tag))); headText.appendChild(tags); }
  if (r.link) { const link = document.createElement('a'); link.className = 'link'; link.href = r.link; link.target = '_blank'; link.rel = 'noopener noreferrer'; link.textContent = 'Open paper'; headText.appendChild(link); }
  head.appendChild(headText);
  if (r.summary) { const abstract = document.createElement('p'); abstract.className = 'original-abstract'; const strong = textEl('strong', '', 'Original abstract'); abstract.appendChild(strong); abstract.append(r.summary); head.appendChild(abstract); }
  slideEl.appendChild(head);
  const briefing = document.createElement('div');
  briefing.className = 'briefing';
  appendBriefSection(briefing, 'Background', b.background);
  appendBriefSection(briefing, 'Motivation', b.motivation);
  appendBriefSection(briefing, 'Result', b.result);
  appendBriefSection(briefing, 'Implication', b.implication);
  appendBriefSection(briefing, "Why it's important / Novelty", b.novelty);
  appendBriefSection(briefing, 'Unresolved Questions', b.unresolved);
  appendBriefSection(briefing, 'Expected Future Work', b.future_work);
  if (b.concepts && b.concepts.length) {
    const section = document.createElement('section');
    section.className = 'brief-section wide';
    section.appendChild(textEl('h2', '', 'Concepts / Terms'));
    const concepts = document.createElement('div');
    concepts.className = 'concepts';
    b.concepts.forEach(c => {
      const item = document.createElement('div');
      item.className = 'concept';
      item.appendChild(textEl('h3', '', c.term || 'Concept'));
      [['왜 생겼나: ', c.why_emerged], ['누가 만들었나: ', c.origin], ['연결되는 흐름: ', c.connections]].forEach(([label, text]) => { if (!text) return; const p = document.createElement('p'); const bold = textEl('b', '', label); p.appendChild(bold); p.append(text); item.appendChild(p); });
      concepts.appendChild(item);
    });
    section.appendChild(concepts);
    briefing.appendChild(section);
  }
  if (b.english_summary && b.english_summary.length) { const section = document.createElement('section'); section.className = 'brief-section wide'; section.appendChild(textEl('h2', '', 'English Summary')); const ul = document.createElement('ul'); b.english_summary.slice(0, 5).forEach(line => ul.appendChild(textEl('li', '', line))); section.appendChild(ul); briefing.appendChild(section); }
  slideEl.appendChild(briefing);
  counterEl.textContent = `${index + 1} / ${slides.length}`;
  prevBtn.disabled = index === 0;
  nextBtn.disabled = index === slides.length - 1;
}
prevBtn.addEventListener('click', () => { index = Math.max(0, index - 1); render(); });
nextBtn.addEventListener('click', () => { index = Math.min(slides.length - 1, index + 1); render(); });
document.addEventListener('keydown', event => { if (event.key === 'ArrowLeft') prevBtn.click(); if (event.key === 'ArrowRight') nextBtn.click(); });
render();
</script>
</body>
</html>
