<title>Daily Paper Slideshow</title>
<style>
  :root {
    color-scheme: light;
    --bg: #f6f7f4;
    --paper: #ffffff;
    --ink: #111827;
    --muted: #64748b;
    --line: #d8ddd2;
    --accent: #176b87;
    --accent-2: #9a3412;
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; overflow: auto; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: var(--bg); color: var(--ink); }
  .shell { max-width: 1500px; min-height: 100vh; margin: 0 auto; padding: 14px 18px; display: flex; flex-direction: column; }
  .topbar { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 16px; }
  .top-actions { display: flex; align-items: center; gap: 10px; }
  .topbar a, button { border: 1px solid var(--line); border-radius: 8px; background: var(--paper); color: var(--ink); padding: 10px 14px; font-weight: 700; text-decoration: none; cursor: pointer; }
  button.primary { background: var(--accent); border-color: var(--accent); color: white; }
  button:disabled { opacity: 0.45; cursor: not-allowed; }
  .counter { color: var(--muted); font-weight: 700; }
  .slide { min-height: calc(100vh - 82px); background: var(--paper); border: 1px solid var(--line); border-radius: 10px; padding: 18px; box-shadow: 0 18px 42px rgba(15, 23, 42, 0.10); display: grid; grid-template-columns: minmax(310px, 0.86fr) minmax(0, 1.55fr); gap: 18px; overflow: visible; }
  .paper-head { min-width: 0; min-height: 0; overflow: visible; display: flex; flex-direction: column; gap: 12px; }
  .figure { margin: 0; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: #f8fafc; }
  .figure img { display: block; width: 100%; max-height: 41vh; object-fit: contain; background: white; }
  .figure figcaption { padding: 7px 10px; color: var(--muted); font-size: 12px; line-height: 1.3; }
  .head-text { display: flex; flex-direction: column; gap: 9px; min-width: 0; }
  .badges { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .badge { border-radius: 999px; padding: 5px 9px; background: #eef2ff; color: #3730a3; font-size: 12px; font-weight: 800; }
  .score { background: #fee2e2; color: #991b1b; }
  h1 { margin: 0; font-size: 25px; line-height: 1.15; letter-spacing: 0; overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
  h1 a { color: inherit; text-decoration-color: rgba(23, 107, 135, 0.35); text-decoration-thickness: 2px; text-underline-offset: 4px; }
  h1 a:hover { color: var(--accent); text-decoration-color: var(--accent); }
  .meta, .authors, .why, .abstract { font-size: 13px; line-height: 1.45; }
  .meta, .authors { color: var(--muted); }
  .why strong, .abstract strong, .authors strong { color: var(--ink); }
  .authors { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .why { border-left: 4px solid var(--accent-2); padding-left: 10px; color: #374151; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .abstract { border-top: 1px solid var(--line); padding-top: 14px; color: #374151; }
  .original-abstract { border-top: 1px solid var(--line); padding-top: 10px; color: #374151; font-size: 11.5px; line-height: 1.35; overflow-wrap: anywhere; }
  .original-abstract strong { display: block; margin-bottom: 4px; color: var(--ink); }
  .tags { display: flex; flex-wrap: wrap; gap: 8px; }
  .tag { border-radius: 999px; padding: 4px 8px; background: #f1f5f9; color: #475569; font-size: 12px; font-weight: 700; }
  .head-text > .link { display: none; }
  .briefing { min-width: 0; min-height: 0; overflow: visible; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); grid-auto-rows: minmax(0, auto); align-content: start; gap: 11px 18px; border-top: 0; padding-top: 0; }
  .brief-section { min-width: 0; }
  .brief-section.wide { grid-column: 1 / -1; }
  .brief-section h2 { margin: 0 0 4px; font-size: 14px; line-height: 1.22; color: #0f766e; letter-spacing: 0; }
  .brief-section p, .brief-section li { margin: 0; font-size: 12.5px; line-height: 1.42; color: #1f2937; overflow-wrap: anywhere; }
  .brief-section ul { margin: 0; padding-left: 20px; }
  .concepts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 9px 14px; }
  .concept { border-top: 1px solid var(--line); padding-top: 7px; }
  .concept h3 { margin: 0 0 4px; font-size: 13px; color: #7c2d12; letter-spacing: 0; }
  .concept p { margin: 2px 0 0; font-size: 11.5px; line-height: 1.35; color: #374151; overflow-wrap: anywhere; }
  .concept b { color: #111827; }
  .link { color: var(--accent); font-weight: 800; text-decoration: none; }
  .empty { padding: 48px; background: var(--paper); border: 1px solid var(--line); border-radius: 12px; color: var(--muted); }
  @media (max-width: 860px) {
    .shell { padding: 14px; }
    .topbar, .top-actions { align-items: stretch; flex-direction: column; }
    .slide, .briefing, .concepts { grid-template-columns: 1fr; }
    .slide { min-height: auto; overflow: visible; display: grid; }
    h1 { font-size: 28px; }
  }
</style>

<script>
const slides = [{"title": "Spin-orbit crossover and the origin of magnetic torque in kagome metals", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/3mmc-tsqr", "authors": "Mathias S. Scheurer, Harley D. Scammell", "last_authors": "Mathias S. Scheurer, Harley D. Scammell", "summary": "Recent experiments on the kagome metal ${\\mathrm{CsV}}_{3}{\\mathrm{Sb}}_{5}$ reveal a curious phase transition-like feature: a nematic magnetic torque response that abruptly sets in at ${T}_{τ}≃130\\phantom{\\rule{0.16em}{0ex}}\\mathrm{K}$, above the known charge-density wave (CDW) transition at ${T}_{…", "tier": "A_MUST_READ", "score": "10", "reason": "Directly addresses CsV3Sb5, nematicity, and CDW in kagome metals—the user's primary project focus.", "tags": ["theory", "CsV3Sb5", "kagome", "nematicity"], "image": "", "briefing": {"background": "CsV3Sb5와 같은 카고메 금속은 전하 밀도 파(CDW), 초전도성, 그리고 시간 역전 대칭성 깨짐(TRSB) 등 복잡한 양자 현상이 얽혀 있어 현대 응집물리 학계의 핵심 연구 대상입니다. 특히 이 물질에서 관찰되는 비정상적인 네마틱 신호의 기원은 여전히 논란의 중심에 있습니다.", "motivation": "최근 실험에서 CsV3Sb5의 CDW 전이 온도(약 94K)보다 높은 약 130K 부근에서 자기 토크의 네마틱 응답이 갑자기 나타나는 현상이 보고되었습니다. 이 논문은 이러한 자기적 이방성이 단순한 상전이인지, 아니면 물질 고유의 전자 구조와 관련된 물리 현상인지 이론적으로 규명하고자 합니다.", "result": "연구진은 이를 '스핀-궤도 교차(spin-orbit crossover)' 현상으로 설명합니다. 바나듐(V) 3d 오비탈 구조와 스핀-궤도 결합(SOC)의 상호작용에 의해 특정 온도에서 자기장과 격자 사이의 결합 방식이 변화하며, 이것이 마치 상전이처럼 보이는 급격한 토크 신호를 생성한다는 것을 보였습니다.", "implication": "이 결과가 맞다면, 130K에서의 토크 이상 현상은 새로운 대칭성 깨짐 상전이가 아니라 오비탈 물리학에 기인한 현상일 가능성이 큽니다. 이는 카고메 금속의 고온 영역 전자 상태를 이해하는 새로운 프레임워크를 제공합니다.", "novelty": "실험적으로 관찰된 높은 온도의 네마틱 신호를 단순한 대칭성 깨짐이 아닌 SOC와 오비탈 자유도의 동역학적 교차로 해석했다는 점이 독창적입니다. 특히 독자가 주시하는 CsV3Sb5의 네마틱성 및 TRSB 논란에 직접적인 답을 제시합니다.", "unresolved": "이 이론적 모델이 실제 실험에서 관찰되는 모든 정량적 수치와 일치하는지, 그리고 다른 카고메 물질(AV3Sb5 계열 전체)에서도 보편적으로 나타나는지 검증이 필요합니다.", "future_work": "이 이론을 바탕으로 온도에 따른 ARPES 데이터의 오비탈 특성 변화를 재해석하거나, 고자기장 하에서의 정밀한 자기 토크 실험을 통해 교차 영역의 미세 구조를 탐색하는 연구가 기대됩니다.", "concepts": [{"term": "CsV3Sb5", "why_emerged": "카고메 격자 구조에서 나타나는 특이한 밴드 토폴로지와 강상관 현상을 동시에 연구하기 위해 발견된 핵심 물질입니다.", "origin": "2019~2020년경 Stephen Wilson 그룹 등에 의해 합성 및 물성이 보고됨.", "connections": "카고메 초전도체, 전하 밀도 파(CDW), 변칙 홀 효과(AHE)와 깊이 연관됨."}, {"term": "Magnetic Torque Nematicity", "why_emerged": "자기장이 인가되었을 때 격자의 대칭성보다 낮은 회전 대칭성을 갖는 토크 신호를 측정함으로써, 전자계의 자발적 대칭성 깨짐을 감지하기 위해 사용됩니다.", "origin": "초록 정보만으로는 특정하기 어려움 (일반적으로 고체 물리 실험 기법).", "connections": "액정 네마틱 상, 오비탈 정렬, 전자적 네마틱성."}, {"term": "Spin-Orbit Crossover", "why_emerged": "온도 변화에 따라 스핀-궤도 결합의 효과가 물리량에 미치는 영향력이 급격히 변하는 현상을 설명하기 위해 도입되었습니다.", "origin": "본 연구에서 핵심 메커니즘으로 제안됨.", "connections": "오비탈 물리학, 밴드 구조의 온도 의존성, 스핀-오비탈 커플링."}, {"term": "Kagome Metal", "why_emerged": "꼭짓점을 공유하는 삼각형 격자 구조에서 기하학적 좌절(frustration)과 플랫 밴드, 디락 점을 구현하기 위해 연구됩니다.", "origin": "전통적인 격자 이론에서 유래했으나, 최근 AV3Sb5 계열의 발견으로 재조명됨.", "connections": "플랫 밴드 물리학, 위상 반금속, 양자 스핀 액체."}], "english_summary": ["The paper explains the origin of the 130K magnetic torque anomaly in CsV3Sb5 as a spin-orbit crossover rather than a standard phase transition.", "It focuses on the interaction between vanadium 3d orbitals and spin-orbit coupling under an external magnetic field.", "The theory provides a consistent explanation for the nematic torque response observed above the CDW transition temperature.", "This work clarifies long-standing debates regarding high-temperature symmetry breaking in kagome superconductors."]}}, {"title": "Altermagnetism, Kagome Flat Band, and Weyl Fermion States in Magnetically Intercalated Transition Metal Dichalcogenides (npj Quantum Mater.)", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2510.21968", "authors": "Avinash Sah, Ting-Yong Lim, Clayton Conner, et al.", "last_authors": "Pavlo Sukhachov, Guang Bian", "summary": "Altermagnetic (AM) compounds have recently emerged as a promising platform for realizing unconventional quantum phases, enabled by their unique spin-split band structure at zero net magnetization. Here, we present a first-principles investigation of magnetically intercalated transition metal dichalcogenides (TMDs) of the form XY$_4$Z$_8$ (X $=$ Mn, Fe, Co, Ni, Cr, or V; Y $=$ Nb or Ta; and Z $=$ Se or S), identifying a subset of new versatile AM candidates. Our results establish a systematic correlation between interatomic geometry, quantified by the ratio of interlayer to intralayer spacing, and the magnetic ground states. Systems with A-type antiferromagnetic order exhibit momentum-dependent spin splitting consistent with AM behavior. The combination of the AM spin-splitting and the spin-orbit coupling leads to the emergence of Weyl nodes together with the corresponding topological Fermi arc surface states. Moreover, we identify flat bands near the Fermi level that originate from the intercalant-induced formation of an effective kagome-like sublattice in the TMD layer. These results collectively establish magnetically intercalated TMDs as a promising platform for engineering altermagnetism, flat bands, and Weyl fermions within a single material family, facilitating the development of topological and spintronic applications.", "tier": "A_MUST_READ", "score": "10", "reason": "Direct relevance to kagome metals, altermagnetism, Weyl fermions, and Nb/Ta transition metal dichalcogenides.", "tags": ["material", "kagome", "altermagnetism", "Weylsemimetal"], "image": "https://arxiv.org/html/2510.21968v3/Fig1CrystalStructureN.png", "briefing": {"background": "알터자성(Altermagnetism)은 넷 자화가 0이면서도 밴드 구조에서 스핀 분할이 일어나는 새로운 자기 상입니다. 이는 강자성과 반자성의 장점을 모두 갖춰 차세대 스핀트로닉스와 위상 물질 연구의 핵심 주제로 떠오르고 있습니다.", "motivation": "자성체가 삽입된 전이금속 디칼코게나이드(TMD) 시스템에서 알터자성, 카고메 플랫 밴드, 그리고 바일 페르미온 상태가 동시에 존재할 수 있는지 제일원리 계산을 통해 탐색하고자 합니다.", "result": "XY4Z8 (X=자성 원소, Y=Nb/Ta, Z=Se/S) 형태의 TMD 물질군에서 알터자성 후보들을 대량 식별했습니다. 특히 삽입된 자성 원자가 카고메 격자 유사 구조를 형성하여 플랫 밴드를 유도하며, 알터자성 스핀 분할과 SOC가 결합하여 위상학적 바일 노드와 페르미 아크를 형성함을 확인했습니다.", "implication": "단일 물질 시스템 내에서 알터자성, 플랫 밴드, 위상 상태를 결합할 수 있음을 보여주었으며, 이는 고효율 스핀트로닉 소자 및 양자 소자 설계의 플랫폼이 될 수 있습니다.", "novelty": "사용자의 주요 관심사인 카고메 격자와 TMD(Nb/Ta 계열) 시스템을 결합하여 최신 화두인 알터자성을 도출했다는 점이 매우 중요합니다. 특히 NbNiTe2와 같은 112 계열 연구와도 맥락을 같이 합니다.", "unresolved": "이론적으로 예측된 XY4Z8 시스템의 실험적 합성 가능성과 실제 저온에서의 자기 구조 안정이 확인되어야 합니다.", "future_work": "실제 해당 물질을 합성하여 ARPES를 통한 스핀 분할 밴드 측정 및 바일 노드 확인 실험이 뒤따라야 할 것입니다.", "concepts": [{"term": "Altermagnetism", "why_emerged": "반자성체처럼 거시적 자화는 없지만, 강자성체처럼 운동량 공간에서 큰 스핀 분할을 얻기 위해 정의되었습니다.", "origin": "최근 2022년경 Libor Šmejkal 등에 의해 이론적으로 정립됨.", "connections": "반자성 스핀트로닉스, 베리 곡률, 비정상 홀 효과."}, {"term": "Weyl Fermion", "why_emerged": "질량이 없는 손지기(chiral) 입자를 고체 내부에서 준입자로 구현하여 높은 이동도와 토폴로지 효과를 이용하기 위함입니다.", "origin": "Hermann Weyl (1929) 제안, 2015년 TaAs 등에서 실험적 확인.", "connections": "바일 반금속, 페르미 아크, 카이럴 비정상 현상."}, {"term": "Kagome Flat Band", "why_emerged": "파동함수의 파괴적 간섭을 통해 운동량에 무관한 일정한 에너지를 갖는 밴드를 만들어 강한 전자 상관관계를 유도하기 위해 연구됩니다.", "origin": "카고메 격자의 기하학적 특성에서 기인함.", "connections": "분수 양자 홀 효과, 강상관 전자계, 초전도성."}, {"term": "Magnetic Intercalation", "why_emerged": "층상 구조인 TMD 사이에 자성 원자를 삽입하여 물질의 자기적, 수송적 성질을 획기적으로 조절하기 위해 사용됩니다.", "origin": "초록 정보만으로는 특정하기 어려움 (전통적인 화학적 합성법).", "connections": "2D 물질, 반데르발스 이종구조, 스핀 주입."}], "english_summary": ["The study identifies a new family of magnetically intercalated TMDs (XY4Z8) as promising altermagnetic candidates.", "First-principles calculations reveal the coexistence of altermagnetism, kagome-like flat bands, and Weyl fermion states.", "The magnetic ground state and spin splitting are found to be highly sensitive to the interlayer-to-intralayer spacing ratio.", "These materials offer a versatile platform for exploring the intersection of topology, magnetism, and strong correlations."]}}, {"title": "Quantum-geometry stabilization of dilute fractional Chern insulators", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2608.24013", "authors": "Ying-Xing Ding, Li-Min Zhang, Wen-Tong Li, D. L. Zhou, Wu-Ming Liu", "last_authors": "D. L. Zhou, Wu-Ming Liu", "summary": "Fractional Chern insulators have attracted broad in tice of local magnetic moments. Interestingly, in its bulk form, the insulating gap is not correlation-driven, but stems from interlayer coupling. Here, we exploit the stacking-dependent nature of the insulating gap to show that in twisted 1T-TaS 2 bilayers, the spatially dependent competition between many-body and single-particle gaps creates Mott–trivial mosaic superlattices, featuring regions with local magnetic moments and non-magnetic insulating regions. We further demonstrate the tunability of the mosaic correlated state with an interlayer bias, giving rise to controllable charge transfer and quenching of correlations. Our results establish twisted 1T-TaS 2 as a flexible platform to engineer mixed spatially modulated correlated insulating phases, arising from the moiré profile. KEYWORDS: van der Waals materials, transition metal dichalcogenides, charge density wave, moiré, Mott insulator", "tier": "B_IMPORTANT_CONDMAT", "score": "10", "reason": "Focuses on moire-engineered Mott states in a transition metal dichalcogenide with CDW.; demoted from A: broad CM, not direct user/project hit", "tags": ["material", "TaS2", "moire", "Mottinsulator", "CDW"], "image": "https://arxiv.org/html/2604.02001v2/Figure_1.png", "briefing": {"background": "1T-TaS2는 층간 결합과 강한 상관관계에 의해 독특한 전하 밀도 파동(CDW)과 모트 절연체 상태를 보이는 다층 박막 재료입니다.", "motivation": "비틀린 이중층(twisted bilayer) 구조를 통해 적층 순서에 따른 전자 상태의 변조 가능성을 확인하고, 모트 상태와 금속 상태의 공간적 모자이크를 구현하고자 합니다.", "result": "비틀림 각도를 조절함으로써 모트 절연체 영역과 비자성 절연체 영역이 교차하는 모자이크 구조를 생성하고, 전압 제어를 통해 이를 튜닝하는 데 성공했습니다.", "implication": "모아레 초격자를 통해 강상관 상태를 공간적으로 프로그래밍할 수 있는 새로운 플랫폼을 제시합니다.", "novelty": "CDW 시스템인 TaS2에 모아레 공학을 접목하여 기존에 없던 강상관 모자이크 상태를 설계했다는 점이 핵심입니다.", "unresolved": "모자이크 경계면에서 나타나는 국소적 상태의 물리적 특성이 아직 상세히 밝혀지지 않았습니다.", "future_work": "실제 STM을 이용한 국소적 전자 상태 맵핑 및 모아레 밴드 구조에 대한 이론적 정밀 계산이 뒤따라야 합니다.", "concepts": [{"term": "Moiré Mott Correlated Mosaic", "why_emerged": "서로 다른 전자 상태를 가지는 박막을 비틀어 쌓아 공간적으로 주기적인 강상관 패턴을 만들기 위해 도입됨.", "origin": "비틀린 이중층 그래핀의 상관 효과 연구에서 파생됨.", "connections": "Twisted bilayers, Mott transition, CDW, Superlattices."}, {"term": "1T-TaS2", "why_emerged": "강한 CDW와 모트 절연체 성질이 결합된 전형적인 상관 시스템으로 주목받음.", "origin": "초기 TMD 연구에서 잘 확립됨.", "connections": "Charge Density Wave, Correlated insulators, Star-of-David reconstruction."}], "english_summary": ["Engineering of Mott-trivial mosaic superlattices in twisted 1T-TaS2 bilayers.", "Spatial competition between many-body and single-particle gaps creates programmable correlated states.", "Demonstrates gate-tunability of the mosaic electronic phase.", "Establishes twisted TMDs as a flexible platform for correlated quantum matter."]}}, {"title": "Visualizing flat-band spatial renormalization in rhombohedral graphene superlattices", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2608.24684", "authors": "Peng-Cheng Pan, Shihao Zhang, Yang Zhang, et al.", "last_authors": "Zhihui Qin, Long-Jing Yin", "summary": "Rhombohedral graphene/hBN moir\\'e superlattices exhibit flat-band-driven emergent phases, including superconductivity and the fractional quantum anomalous Hall effect (FQAHE), yet the microscopic role of the moir\\'e potential remains unclear. Here, using scanning tunneling microscopy, we visualize moir\\'e-modulated spatial renormalization of flat bands in rhombohedral pentalayer and tetralayer graphene/hBN superlattices. We observe spatially hierarchical filling, manifested as periodic energy shifts of the flat bands at the moir\\'e scale, leading to spatial reshaping of correlated states in the interacting regime. Remarkably, this modulation vanishes below a ~10 nm moir\\'e period--the same threshold below which the FQAHE is absent. Theoretical modeling attributes this mechanism to atomic-corrugation-induced charge redistribution. Our work provides real-space visualization of moir\\'e-engineered flat-band reconstruction, resolving a key link between moir\\'e periodic potential and emergent topological order.", , 이를 뉴런의 '누설 적분 발화(leaky-integrate-and-fire)' 모델과 연결하고자 합니다.", "result": "STM을 사용하여 실온에서 1T-TaS2의 터널링 노이즈를 측정했습니다. CDW 불일치(discommensuration)의 프랙탈 구조 재구성이 전류 버스트를 유발하며, 이것이 생체 모사 뉴런 발화 모델과 일치하는 확률적 거동을 보임을 확인했습니다.", "implication": "원자 단위의 CDW 동역학을 제어함으로써 나노 크기의 고효율 뉴로모픽 소자 개발이 가능해질 수 있습니다. 이는 기존 반도체 소자를 대체하거나 보완할 수 있는 새로운 하드웨어 아키텍처의 가능성을 보여줍니다.", "novelty": "CDW 시스템의 복잡한 동역학을 뉴로모픽 컴퓨팅의 실질적인 확률적 비선형 요소로 해석했다는 점이 독창적입니다. STM을 이용한 로컬 프로빙을 통해 CDW의 미시적 구조와 거시적 회로 성능을 직접 연결했습니다.", "unresolved": "실제 상용화 가능한 소자 수준에서 이러한 원자 단위의 노이즈를 얼마나 정교하게 제어할 수 있을지는 여전히 과제입니다.", "future_work": "실제 소자 환경에서의 집적화 공정 연구와 다양한 CDW 물질군으로의 응용 확장이 예상됩니다.", "concepts": [{"term": "Charge Density Wave (CDW)", "why_emerged": "저차원 물질에서 전자-격자 결합이 강화될 때 에너지를 낮추기 위해 발생하는 전자 밀도의 주기적 변조 현상입니다.", "origin": "Peierls에 의해 1차원 금속 시스템에서 제안되었습니다.", "connections": "전자 상관관계, 초전도체와의 경쟁, STM을 통한 실공간 관측 등."}, {"term": "Leaky-Integrate-and-Fire (LIF)", "why_emerged": "생물학적 뉴런의 발화 과정을 단순화한 수학적 모델로 뉴로모픽 하드웨어 설계를 위해 도입되었습니다.", "origin": "Lapicque (1907)에 의해 초기 모델이 제안되었습니다.", "connections": "인공신경망, 스파이킹 신경망(SNN), 비선형 동역학."}], "english_summary": ["Analyzed atomic-scale noise in 1T-TaS2 using STM at room temperature.", "Identified that CDW discommensuration reorganization drives stochastic current bursts.", "Demonstrated that these dynamics effectively mimic leaky-integrate-and-fire neuron behavior.", "Suggests CDW materials as potential candidates for miniaturized neuromorphic hardware."]}}, {"title": "Bridging ambient- and high-pressure superconductivity in La2LnNi2O7 films", "journal": "Nature_Materials", "source": "Gemini", "link": "https://www.nature.com/articles/s41563-026-02695-3", "authors": "Motoki Osada, Chieko Terakura, Shusaku Imajo, et al.", "last_authors": "Yoshinori Tokura, Atsushi Tsukazaki", "summary": "Lanthanide substitution, ultrahigh magnetic field measurements and high-pressure studies are utilized to compare and contrast ambient- and high-pressure superconductivity in bilayer nickelate films.", "tier": ature.com/articles/s41567-026-03428-8", "authors": "Authors not available in source RSS", "last_authors": "", "summary": "Anyons are fractionally charged quasiparticles of the quantum Hall effect, and could one day power topological quantum computers. Trapping and measuring anyons remains difficult, but quasiparticle charges have now been measured using a gate-defined antidot in bilayer graphene. For hole-conjugate states, the parity of downstream integer edge modes sets the observed charge.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Experimental study of fractional charges in graphene quantum Hall states.", "tags": ["transport", "graphene", "quantumHall"], "image": "https://media.springernature.com/m685/springer-static/image/art%3A10.1038%2Fs41567-026-03428-8/MediaObjects/41567_2026_3428_Fig1_HTML.png", "briefing": {"background": "분수 양자 홀 효과는 강한 자기장 하에서 전자들이 위상학적으로 얽혀 분수 전하를 띤 준입자(애니온)를 형성하는 현상입니다. 이러한 애니온의 전하를 직접 측정하는 것은 위상 양자 컴퓨터 구현을 위한 핵심 단계입니다.", "motivation": "그래핀 시스템에서 게이트로 정의된 안티도트(antidot)를 사용하여 양자 홀 상태의 준입자 전하를 정밀하게 측정하고, 특히 구멍-켤레(hole-conjugate) 상태에서의 전하 특성을 밝히고자 했습니다.", "result": "이중층 그래핀의 안티도트 구조에서 준입자 전하를 측정하는 데 성공했습니다. 하류의 정수 에지 모드(downstream integer edge modes)의 패리티가 관찰된 전하에 영향을 미친다는 것을 밝혔습니다.", "implication": "분수 양자 홀 시스템 내 준입자의 통계와 전하 특성을 실험적으로 검증함으로써 위상 양자 연산의 기반 기술을 확보했습니다.", "novelty": "그래핀 내 안티도트 구조를 통해 분수 전하를 측정하는 기법을 확립했으며, 에지 모드와의 상호작용이 관측값에 미치는 영향을 규명했습니다.", "unresolved": "이러한 준입자들의 braiding 통계(braiding statistics)를 실험적으로 직접 증명하는 단계가 남아 있습니다.", "future_work": "본 기법을 활용한 애니온 간의 상호작용 및 위상적 간섭 효과 연구가 기대됩니다.", "concepts": [{"term": "Anyons", "why_emerged": "2차원 계에서 보손도 페르미온도 아닌 독특한 통계적 성질을 가지는 준입자의 필요성으로 인해 제안되었습니다.", "origin": "Wilczek 등에 의해 제안되었습니다.", "connections": "위상 양자 컴퓨터, 분수 양자 홀 효과, Chern-Simons 이론."}, {"term": "Antidot", "why_emerged": "양자 홀 에지 상태 내의 전하 이동을 차단하거나 간섭계를 만들기 위한 국소적인 인공적 구멍 구조입니다.", "origin": "중앙의 전위를 조절하여 입자를 가두는 초기 양자점 연구에서 확장되었습니다.", "connections": "에지 상태, Aharonov-Bohm 간섭, 준입자 터널링."}], "english_summary": ["Measured fractional charges of anyons in bilayer graphene using a gate-defined antidot.", "Demonstrated that downstream integer edge mode parity governs observed charge.", "Advances the ability to isolate and probe quasiparticles in topological phases.", "Significant progress toward experimental validation for topological quantum computing."]}}, {"title": "Quantum Hall antidot as a fractional coulombmeter", "journal": "Nature_Physics", "source": "Gemini", "link": "https://www.nature.com/articles/s41567-026-03412-2", "authors": "Mario Di Luca, Emily Hajigeorgiou, Zekang Zhou, et al.", "last_authors": "Steven H. Simon, Mitali Banerjee", "summary": "A transport technique that allows the measurement of the effective charge of fractional quantum Hall states as they tunnel through a controlled impurity is demonstrated.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Important transport measurement of fractional quantum Hall quasiparticle charges.", "tags": ["transport", "fractionalquantumHall", "quasiparticles"], "image": "https://media.springernature.com/m685/springer-static/image/art%3A10.1038%2Fs41567-026-03412-2/MediaObjects/41567_2026_3412_Fig1_HTML.png", "briefing": {"background": "분수 양자 홀 효과(FQHE)는 강한 자기장 하에서 전자 간의 강한 상관관계로 인해 전하가 분수화된 준입자가 나타나는 현상입니다. 이들의 전하를 정밀하게 측정하는 것은 위상 물질의 근본적인 이해를 위해 필수적입니다.", "motivation": "분수 양자 홀 상태에서 준입자가 제어 가능한 불순물(antidot)을 통과할 때의 거동을 통해 유효 전하를 직접 측정하는 새로운 전송 기법을 입증하고자 함.", "result": "안티닷을 이용한 전송 측정을 통해 분수 양자 홀 상태에서의 유효 준입자 전하를 성공적으로 추출함.", "implication": "분수 통계와 하전된 준입자의 존재를 직접적인 수송 실험으로 검증함으로써, 비아벨 통계나 분수 통계와 관련된 위상 양자 컴퓨터 연구의 기반을 제공함.", "novelty": "기존의 노이즈 측정 방식과는 달리, 제어된 불순물 통과 방식을 통해 전하를 직접 '계량'하는 새로운 정량적 방법론을 제시함.", "unresolved": "실제 실험적 노이즈 수준에서의 정밀도 한계와 준입자 간의 상호작용이 측정값에 미치는 복잡한 영향.", "future_work": "더 높은 분수 상태에서의 전하 측정 및 비아벨 통계 거동 규명을 위한 시도.", "concepts": [{"term": "안티닷 (Antidot)", "why_emerged": "양자 홀 효과 상태에서 국소적인 전위 장벽을 만들어 전자가 우회하거나 터널링하게 함으로써 수송 특성을 조절하기 위해 도입됨.", "origin": "초록 정보만으로는 특정하기 어려움 (통상적으로 90년대 반도 FT 계산을 결합하여 자성 불순물의 국소적 거동과 전자 상태의 상관관계를 다각도로 분석함.", "unresolved": "Fe 도핑이 위상 절연체의 벌크 전도도와 표면 상태를 얼마나 분리해서 제어할 수 있는지에 대한 정량적 규명.", "future_work": "Fe 농도에 따른 자기 상전이 온도와 위상적 표면 상태의 결어긋남(decoherence) 분석.", "concepts": [{"term": "Weak Antilocalization (WAL)", "why_emerged": "강한 스핀-궤도 결합으로 인해 전자 파동의 간섭이 반대 위상으로 작동하여 저항이 감소하는 현상을 설명하기 위해 필요함.", "origin": "Hikami, Larkin, Nagaoka (1980).", "connections": "Topological insulator, Berry phase, 스핀-궤도 결합."}, {"term": "Muon Spin Resonance (muSR)", "why_emerged": "물질 내부의 국소 자기장의 분포와 자성 원자의 정적인/동적인 거동을 비파괴적으로 정밀하게 조사하기 위해 도입됨.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "NMR, 중성자 산란(Neutron scattering)."}], "english_summary": ["Investigates the impact of Fe doping on Sb2Te3 topological insulators.", "Employs muSR and DFT to analyze magnetic and electronic properties.", "Observes changes in weak antilocalization characteristics upon Fe substitution.", "Contributes to understanding magnetism-topology interplay in chalcogenides."]}}, {"title": "Emergent room-temperature anomalous and topological Hall responses in the epitaxial ferromagnetic Weyl nodal-line metal Fe5Si3", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/flxb-4ktc", "authors": "Shubhashish Pati, Sonali Srotaswini Pradhan, Abhay Pandey, et al.", "last_authors": "V. Kanchana, Sujeet Chaudhary", "summary": "The interplay between real and reciprocal space topology yields intrinsically linked transport phenomena in topological magnetic material systems. In particular, broken time-reversal symmetry together with strong Dzyaloshinskii-Moriya interaction and pronounced uniaxial anisotropy can simultaneously…", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Topological Weyl semimetal with anomalous Hall transport, directly relevant to user research interest.", "tags": ["material", "topological", "transport"], "image": "", "briefing": {"background": "위상학적 자성 금속은 위상적인 밴드 구조와 자기적 질서가 공존하여, anomalous Hall 효과 등 독특한 수송 특성을 나타내며 차세대 스핀트로닉스 재료로 주목받고 있습니다.", "motivation": "강자성 Weyl 마디선 금속인 Fe5Si3에서 실온 수준의 위상적 Hall 효과와 anomalous Hall 효과의 기원을 규명하고자 함.", "result": "Fe5Si3에서 실온 이상의 온도 범위에서 비정상적 및 위상적 Hall 응답을 관측했으며, 이는 결정 내의 자기적 비등방성과 위상적 밴드 구조에 기인함을 밝힘.", "implication": "실온에서 위상적 수송 특성을 보여줌으로써, 위상 기반 메모리나 소자 응용에 유리한 물질 후보를 제시함.", "novelty": "Fe5Si3라는 물질에서 실온 위상 홀 효과를 보고했으며, 이는 위상적 밴드 구조와 강자성이 결합된 시스템의 수송 현상을 잘 보여줌.", "unresolved": "Weyl 마디선의 상세한 에너지 위치와 Berry 곡률의 정량적 기여도.", "future_work": "ARPES를 통한 밴드 구조 직접 관측 및 자기적 구조와 전하 수송 간의 상관관계 심화 연구.", "concepts": [{"term": "Weyl Nodal-line Metal", "why_emerged": "밴드 구조에서 점 형태의 Weyl node가 아닌 선 형태의 교차(nodal line)를 가지는 물질의 위상적 특징을 설명하기 위해 필요.", "origin": "초록 정보만으로는 특정하기 어려움 (10년대 중반 이후 이론적 정립).", "connections": "Weyl semimetal, Berry curvature, Topological Hall effect."}, {"term": "Anomalous Hall Effect (AHE)", "why_emerged": "강자성체에서 자기장에 의한 Lorentz 힘 외에 물질 내부의 자성과 스핀-궤도 결합으로 발생하는 추가적인 홀 전압을 설명하기 위해 도입됨.", "origin": "Edwin Hall (1881).", "connections": "Berry phase, 스핀 궤도 결합, 강자성."}], "english_summary": ["Reports emergent room-temperature topological Hall effects in Fe5Si3.", "Identifies the material as a ferromagnetic Weyl nodal-line metal.", "Connects transport phenomena to intrinsic topology and magnetic anisotropy.", "Suggests potential for room-temperature topological spintronics."]}}, {"title": "Identifying open-orbit topological surface states in dual topological semimetal TaSb2", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/9gk1-krjp", "authors": "Susmita Changdar, Heike Schlörb, Oleksandr Suvorov, et al.", "last_authors": "Sergey Borisenko, Setti Thirupathaiah", "summary": "TaSb 2 , a member of the TmPn 2 family of materials, hosts the very rare dual topological phase—weak topological insulating state and topological crystalline insulating state along different crystallographic orientations. So far, studies on the electronic structure of TmPn 2 compounds have focused on their overall electronic structure and the bulk open-orbit Fermi surfaces. Using angle-resolved photoemission spectroscopy, density functional theory calculations, and transport measurements, we distinguish the intertwined bulk and surface states on the weakly topological ( 20 1 ¯ ) plane of TaSb 2 . We identify multiple electron- and holelike bulk bands, yielding a near-perfect carrier compensation. Crucially, we observe open-orbit FSs near M ¯ and parallel to Γ ¯ − Y ¯ direction that are entirely of surface origin. The surface states also exhibit band crossing at ∼ 0.6 eV below Fermi level at the time-reversal invariant momentum M ¯ , indicating nontrivial band topology. Consistent with this, magnetotransport measurements display weak antilocalization, establishing TaSb 2 as a platform for spin-polarized topological transport on a weakly topological surface.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "STS study of electronic structure in a topological semimetal, highly relevant to user profile.", "tags": ["experiment", "STS", "topologicalsemimetal"], "image": "", "briefing": {"background": "위상 반금속(topological semimetals)은 결정 대칭성과 위상 기하학적 특성에 의해 보호받는 전도성 띠 구조를 가집니다. 특히 TmPn2 계열 물질은 약한 위상 절연체와 위상 결정 절연체 성질이 공존하는 이중 위상 위상을 가질 가능성으로 주목받고 있습니다.", "motivation": "기존 연구들은 TmPn2 계열의 전반적인 전자 구조와 벌크 페르미 표면(open-orbit)에 치중되어 있어, 특정 결정면에서 나타나는 벌크와 표면 상태의 복잡한 얽힘을 명확히 구분할 필요가 있었습니다.", "result": "ARPES와 이론 계산을 통해 TaSb2의 (20-1) 평면에서 벌크 띠와 표면 상태를 성공적으로 분리했습니다. 특히 M 지점 근처에서 표면 기원의 열린 궤도(open-orbit) 페르미 표면을 확인했으며, 이는 비자명한 띠 위상을 가리킵니다.", "implication": "TaSb2가 약한 위상 절연체 표면에서 스핀 편극된 위상 수송을 구현할 수 있는 최적의 플랫폼임을 입증했습니다.", "novelty": "벌크 상태와 표면 상태가 강하게 얽혀 있는 상황에서 ARPES와 자성 수송 측정을 결합해 표면 기원의 위상 상태를 직접 분리해냈다는 점이 핵심입니다.", "unresolved": "페르미 준위 아래 0.6 eV 부근의 띠 교차점이 벌크 특성과 어떻게 최종적으로 조화를 이루는지에 대한 심층적 해석이 추가로 필요합니다.", "future_work": "표면 상태의 스핀 구조를 직접 측정하기 위한 스핀 분해 ARPES 수행 및 소자 기반의 수송 측정 연구가 기대됩니다.", "concepts": [{"term": "약한 위상 절연체 (Weak Topological Insulator)", "why_emerged": "띠 구조의 비자명성을 이해하고 위상 수송 현상을 분류하기 위해 도입되었습니다.", "origin": "Fu, Kane, Mele (2007)에 의해 이론적으로 정립되었습니다.", "connections": "강한 위상 절연체, 위상 결정 절연체와 관련됨."}, {"term": "열린 궤도 (Open-orbit Fermi surface)", "why_emerged": "특정 방향으로만 전자 전도가 가능한 비등방성 페르미 표면을 기술하기 위해 필요합니다.", "origin": "금속의 반전 자기저항 효과 연구 과정에서 확립되었습니다.", "connections": "위상 표면 상태, 자기 수송(Magnetotransport) 특성과 연결됨."}], "english_summary": ["TaSb2 is identified as a dual topological material hosting both weak and crystalline topological phases.", "ARPES and DFT are combined to separate intertwined bulk and surface states on the (20-1) surface.", "Evidence of open-orbit surface Fermi surfaces and non-trivial band topology is observed near M.", "Weak antilocalization in magnetotransport confirms the platform's potential for spin-polarized surface transport."]}}, {"title": "Layer-mediated tuning of spin and valley physics in stacked tetragonal altermagnetic bilayers", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/w468-mdrb", "authors": "Jianke Tian, Xiaowen Zhou, Gui-Bin Liu", "last_authors": "Xiaowen Zhou, Gui-Bin Liu", "summary": "As an emerging magnetic phase, altermagnets (AMs) with collinear compensated magnetism in real space and alternating spin splitting in the band structure have attracted widespread attention. Here, based on first-principles calculations, we demonstrate that the layer stacking imposes symmetry constra…", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Altermagnetism in 2D bilayers, a key emerging topic closely related to user interests.", "tags": ["material", "altermagnet", "bandstructure"], "image": "", "briefing": {"background": "알터자성(Altermagnetism)은 상쇄된 자기 모멘트를 가지면서도 스핀 분리(spin-splitting)가 발생하는 새로운 자기 질서로, 기존의 강자성이나 반강자성과 구분되는 물리적 특성을 가집니다.", "motivation": "2차원 물질에서 층간 적층 구조를 변경하여 대칭성을 조절함으로써 알터자성의 스핀 및 밸리(valley) 물성을 제어할 수 있는 가능성을 탐구하고자 했습니다.", "result": "제일원리 계산을 통해 적층 방식(stacking)이 층간 대칭성에 영향을 주어 알터자성 상태와 밸리 분리 현상을 미세하게 조정할 수 있음을 보였습니다.", "implication": "반데르발스 이질구조 등에서 적층 공학을 통해 알터자성 기반의 스핀트로닉스 소자를 설계할 수 있는 이론적 토대를 제공합니다.", "novelty": "알터자성이라는 최신 개념을 2D 적층 구조에 도입하여 층간 상호작용이 어떻게 자기적/위상적 특성을 바꾸는지 체계적으로 분석했습니다.", "unresolved": "실제 실험적으로 정밀한 적층 제어 및 이에 따른 자기 측정은 아직 도전적인 과제입니다.", "future_work": "실제 적층된 2D 물질에서의 밴드 구조 실험적 검증 및 밸리-스핀 수송 측정이 필요합니다.", "concepts": [{"term": "알터자성 (Altermagnetism)", "why_emerged": "기존 반강자성 범주로 설명되지 않는, 스핀 분열을 가진 상쇄 자기 질서를 기술하기 위해 등장했습니다.", "origin": "최근 2-3년 내에 이론적으로 크게 발전한 개념입니다.", "connections": "강자성, 반강자성, 스핀-궤도 결합과 연관됨."}], "english_summary": ["Altermagnetism represents a compensated magnetic phase with alternating spin-splitting.", "Layer stacking in tetragonal bilayers is shown to impose symmetry constraints that tune magnetic properties.", "The study demonstrates active control over spin and valley physics via stacking engineering.", "Provides a foundation for designing altermagnetic-based spintronic devices in 2D systems."]}}, {"title": "Magnetization-free quantum anomalous Hall effect in altermagnetic weak topological insulators", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/5378-2fcs", "authors": "Yanmiao Han, Yu-Hao Wan, Peng-Yi Liu, Rundong Zhao, Qing-Feng Sun", "last_authors": "Rundong Zhao, Qing-Feng Sun", "summary": "The quantum anomalous Hall (QAH) effect is usually realized through ferromagnetism or magnetic doping, which limits material choices and often results in low mobility, disorder sensitivity, and low operating temperatures. Here, we propose a mechanism to achieve the QAH phase without net magnetizatio…", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Topical intersection of altermagnetism and QAH effect; high interest for topological materials.", "tags": ["anomalousHall", "altermagnet", "topological"], "image": "", "briefing": {"background": "양자 비정상 홀 효과(QAH)는 일반적으로 강자성체에서 나타나지만, 외부 자기장이나 자성 불순물 도핑에 의존해야 하는 한계가 있어 새로운 물질적 플랫폼이 필요합니다.", "motivation": "알터자성 물질은 순 자화(net magnetization)가 없음에도 스핀 띠 분리가 존재하므로, 이를 활용해 자성 불순물 없이 QAH 효과를 실현하는 새로운 기제를 찾고자 했습니다.", "result": "알터자성 위상 절연체를 기반으로, 자성 없이도 위상 띠가 역전되어 QAH 상태를 구현할 수 있는 이론적 메커니즘을 제안했습니다.", "implication": "외부 자기장의 간섭이나 불순물 산란을 피하면서도 저전력·고효율의 토폴로지 소자를 구현할 수 있는 가능성을 열었습니다.", "novelty": "자화가 없는 알터자성체를 QAH 효과의 매개체로 활용한다는 발상의 전환이 매우 신선합니다.", "unresolved": "제안된 메커니즘을 구체적으로 구현할 수 있는 실제 화합물의 명확한 화학적 식별이 필요합니다.", "future_work": "후보 물질군의 합성 및 전기적 수송 측정을 통한 QAH 효과의 실험적 관찰이 중요합니다.", "concepts": [{"term": "양자 비정상 홀 효과 (Quantum Anomalous Hall Effect)", "why_emerged": "외부 자기장 없이 양자화된 홀 저항을 구현하여 소모 전력을 획기적으로 줄이기 위해 필요합니다.", "origin": "Haldane 모델(1988)이 이론적 기틀을 마련했습니다.", "connections": "양자 홀 효과, 위상 절연체, 자성 물질과 연결됨."}], "english_summary": ["QAH effect traditionally requires ferromagnetism or magnetic doping, limiting mobility.", "A mechanism for magnetization-free QAH is proposed using altermagnetic topological insulators.", "This approach circumvents magnetic disorder and enables dissipationless transport without external magnetic fields.", "Offers a new path for robust topological electronics using intrinsically compensated magnets."]}}, {"title": "Nonvolatile electrical control of spin splitting via altermagnets with sliding ferroelectricity", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/fvdw-j1mc", "authors": "Jiajun Lu, Mu Tian, Chaoxi Cui, et al.", "last_authors": "Run-Wu Zhang, Yugui Yao", "summary": "Achieving precise and nonvolatile electrical control of spin represents a fundamental yet long-standing challenge in spintronics. In this work, we demonstrate that bilayer altermagnets with sliding ferroelectricity give rise to a distinct form of sliding multiferroicity, thereby establishing a pathw…", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Strongly relevant altermagnetism study, combining magnetic and ferroelectric degrees of freedom.", "tags": ["material", "altermagnet"], "image": "", "briefing": {"background": "스핀트로닉스 소자에서 스핀 상태를 비휘발성으로 제어하는 것은 오랜 난제입니다. 최근 등장한 알터마그넷(altermagnet)은 비자성체와 같이 순자화(net magnetization)는 0이지만, 결정 대칭성을 활용한 스핀 분리(spin splitting)를 통해 자성체와 유사한 성질을 보이는 새로운 자성 상태입니다.", "motivation": "알터마그넷의 스핀 분리 효과를 강유전체적인 슬라이딩(sliding ferroelectricity)과 결합하여 전기적으로 조절 가능한 다강체(multiferroic) 플랫폼을 제안하고자 합니다.", "result": "이중층 알터마그넷에서 슬라이딩 강유전성을 도입함으로써 스핀 분리 상태를 전기적으로 비휘발성 제어할 수 있음을 이론적으로 규명했습니다.", "implication": "알터마그네틱 스핀트로닉스와 강유전성 메모리 기술을 융합하여 저전력, 고속, 비휘발성 스핀 정보 소자 개발의 새로운 가능성을 열었습니다.", "novelty": "기존의 자성 재료가 아닌 알터마그넷을 활용했다는 점이 독창적이며, 특히 자성 모멘트가 없는 상태에서도 스핀 의존적인 전도를 제어할 수 있어 고집적 소자 구현에 유리합니다.", "unresolved": "실제 실험적으로 이러한 알터마그넷-강유전체 이중층 구조를 구현하는 데 필요한 물질 합성의 난이도가 존재합니다.", "future_work": "구체적인 물질 후보군을 제안하고, 이를 직접 합성하여 전기적 제어 특성을 검증하는 후속 연구가 필요합니다.", "concepts": [{"term": "알터마그넷", "why_emerged": "기존 강자성체와 반강자성체의 한계를 넘어 스핀 분리 효과를 가짐", "origin": "최근 1~2년 사이 이론적으로 확립됨", "connections": "반강자성체, 스핀 밸리트로닉스"}, {"term": "슬라이딩 강유전성", "why_emerged": "반데르발스 층상 구조에서 층간 밀림으로 발생하는 분극 현상 연구", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "반데르발스 이질구조, 층상 재료"}], "english_summary": ["Proposes an electrical control scheme for spin splitting in altermagnets.", "Utilizes sliding ferroelectricity in bilayer systems to achieve nonvolatile switching.", "Integrates altermagnetic spin physics with multiferroic properties for spintronics.", "Provides a potential pathway for next-generation spin-based memory devices."]}}, {"title": "Pressure-invariant isotope effect as evidence for electronically driven intertwined order in Pr4Ni3O10", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/wzcz-z62k", "authors": "Rustem Khasanov, Thomas J. Hicken, Igor Plokhikh, et al.", "last_authors": "Christof W. Schneider, Dariusz J. Gawryluk", "summary": "We report muon-spin rotation measurements of the pressure dependence of the oxygen-isotope ( O 16 / O 18 ) effect on the spin-density wave (SDW) transition in the trilayer Ruddlesden-Popper nickelate Pr 4 Ni 3 O 10 . At ambient pressure, the SDW transition shows a finite isotope shift, with T SDW 16 = 158.04 ( 5 ) K and T SDW 18 = 159.81 ( 6 ) K . Under hydrostatic pressure, T SDW decreases linearly at rates that are equal within uncertainty for the two isotope compositions, d 16 T SDW / d p = − 4.93 ( 5 ) K/GPa and d 18 T SDW / d p = − 4.90 ( 7 ) K/GPa, such that the isotope shift remains constant within uncertainty under compression. The absence of pressure enhancement of the isotope effect points to a predominantly electronic origin of the SDW transition and is consistent with recent inelastic x-ray scattering results, suggesting a regime of intertwined order in trilayer RP nickelates, which is stabilized by strong spin interactions.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Muon spin rotation on a trilayer nickelate; relevant unconventional superconductivity/order material.", "tags": ["material", "method", "nickelate"], "image": "", "briefing": {"background": "니켈레이트(Nickelates)는 큐프레이트와 유사한 전자 구조를 가져 고온 초전도체 후보로 주목받습니다. 특히 Pr4Ni3O10과 같은 삼중층 Ruddlesden-Popper 구조는 스핀 밀도 파동(SDW)과 같은 다양한 질서 상태가 경쟁하거나 얽혀 있는 양자 물질입니다.", "motivation": "Pr4Ni3O10에서 나타나는 SDW 전이의 기원(전자적 기원 vs 격자-전자 결합)을 확인하기 위해 압력과 동위원소 효과를 이용해 분석하고자 합니다.", "result": "압력 변화에 따라 동위원소 이동(isotope shift)이 거의 변하지 않음을 발견했습니다. 이는 SDW 전이가 격자 효과보다 전자적 상호작용에 의해 주로 결정됨을 의미합니다.", "implication": "삼중층 니켈레이트의 질서 상태가 강한 스핀 상호작용에 기반한 전자적 얽힘(intertwined order)임을 뒷받침하며, 초전도 현상과 SDW의 관계를 명확히 하는 근거가 됩니다.", "novelty": "뮤온 스핀 회전(μSR) 측정 기술을 통해 압력 하에서의 동위원소 효과를 정밀하게 분석하여 전자적 상관관계의 핵심을 짚어냈습니다.", "unresolved": "SDW와 초전도성 사이의 정확한 상호작용 메커니즘과 그 얽힘의 미시적 기전은 여전히 연구가 필요합니다.", "future_work": "고압 환경에서의 더 상세한 비탄성 X-선 산란 연구를 통해 전자적 자유도와 격자 자유도의 결합도를 구체적으로 관찰할 계획입니다.", "concepts": [{"term": "Ruddlesden-Popper 니켈레이트", "why_emerged": "큐프레이트 구조와의 유사성을 통한 초전도성 탐색", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "큐프레이트, 페로브스카이트"}, {"term": "동위원소 효과", "why_emerged": "전이 현상의 격자 기여도(포논)를 확인하기 위함", "origin": "초전도 연구 초기부터 확립됨", "connections": "BCS 이론, 전자-포논 결합"}, {"term": "스핀 밀도 파동(SDW)", "why_emerged": "전도 전자의 스핀 밀도가 공간적으로 주기성을 갖는 상태 규명", "origin": "Overhauser (1960년대)", "connections": "전하 밀도 파동(CDW), 페르미 표면 불안정성"}], "english_summary": ["Investigated the pressure-dependent oxygen isotope effect in Pr4Ni3O10.", "Found the isotope shift is invariant under hydrostatic pressure.", "Suggests an electronic rather than lattice-driven origin for the SDW state.", "Supports the existence of intertwined order in trilayer RP nickelates."]}}, {"title": "Probing the intermediate state of type-I superconductor SnAs using muon spin spectroscopy", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/z1sz-ly3y", "authors": "Shashank Srivastava, Omkar Kulkarni, Arushi, et al.", "last_authors": "Adrian D. Hillier, Ravi Prakash Singh", "summary": "Superconductivity with nontrivial band topology provides a platform for exploring topological superconductivity and its quantum applications. A detailed microscopic understanding of the superconducting ground state in such materials is crucial. Here, we report the results of a muon spin rotation/rel…", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Experimental investigation of a material with topological band structure and superconductivity.", "tags": ["experiment", "SnAs", "topologicalsuperconductor"], "image": "", "briefing": {"background": "위상 절연체나 위상 초전도체와 같이 밴드 구조가 위상수적으로 자명하지 않은 물질들은 양자 정보 소자로서의 가치가 큽니다. SnAs와 같은 재료는 이러한 물리 현상을 연구하는 플랫폼이 됩니다.", "motivation": "SnAs의 초전도 상태에서 나타나는 미시적인 자기적 특성을 관찰하여 해당 물질의 위상 초전도체로서의 잠재력을 평가하고자 합니다.", "result": "뮤온 스핀 분광법을 사용하여 SnAs의 초전도 상태에서의 내부 자기장 분포를 조사하고, 제1종 초전도체로서의 거동을 확인했습니다.", "implication": "SnAs의 초전도 상태가 위상학적 성질과 결합되어 있는지에 대한 중요한 실험적 기초 데이터를 제공합니다.", "novelty": "비파괴적인 뮤온 스핀 기법을 통해 SnAs의 초전도 상태를 직접적으로 들여다보았다는 점이 중요합니다.", "unresolved": "이 연구 결과만으로는 SnAs의 위상학적 비자명성이 초전도성과 결합된 위상 초전도 상태임을 완전히 증명하기에는 부족합니다.", "future_work": "단결정 샘플을 이용한 ARPES나 STM/STS를 통해 표면 상태와 위상적 밴드 구조를 직접 관측하는 후속 연구가 필요합니다.", "concepts": [{"term": "뮤온 스핀 회전(μSR)", "why_emerged": "물질 내부의 미시적 자기장 정보를 얻기 위해", "origin": "1950년대 발견 후 고체 물리학에 응용", "connections": "NMR, 중성자 산란"}, {"term": "위상 초전도체", "why_emerged": "마요라나 페르미온을 구현하여 위상 양자 컴퓨팅에 활용", "origin": "2000년대 중반 이론적 제안", "connections": "위상 절연체, 마요라나 구속 상태"}], "english_summary": ["Reported muon spin rotation studies on the superconductor SnAs.", "Probed the intermediate state and microscopic magnetic behavior.", "Analyzed SnAs as a platform for nontrivial band topology and superconductivity.", "Provides microscopic insights into the superconducting ground state."]}}, {"title": "Three-dimensional quantum Hall effect of Fermi arc surface states in tilted Weyl semimetals", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/gd4w-x272", "authors": "Mingqi Chang, Rong Ma", "last_authors": "Mingqi Chang, Rong Ma", "summary": "Three-dimensional (3D) quantum Hall effect (QHE) of Fermi arcs in Weyl semimetals has attracted significant interest. In this work, we explore the 3D QHE of Fermi arc surface states in tilted Weyl semimetals. We systematically consider both the symmetric the and asymmetric tilts. For the asymmetric …", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Detailed study of Fermi arc surface states in Weyl semimetals, highly relevant to ARPES/topological interests.", "tags": ["material", "topic", "Weylsemimetal"], "image": "", "briefing": {"background": "바일 반금속(Weyl semimetal)의 핵심 특징인 페르미 아크(Fermi arc) 표면 상태는 위상학적으로 보호받으며, 3차원 공간에서 양자 홀 효과(QHE)를 구현할 수 있는 후보군으로 주목받아 왔습니다.", "motivation": "바일 반금속의 틸트(tilt) 정도가 페르미 아크의 표면 상태와 3차원 양자 홀 효과에 어떤 영향을 미치는지 체계적으로 분석하고자 했습니다.", "result": "대칭 및 비대칭 틸트 상황을 고려하여 페르미 아크의 기하학적 구조가 3차원 QHE 특성에 미치는 영향을 이론적으로 규명했습니다.", "implication": "바일 반금속의 밴드 구조 조절을 통해 위상학적 수송 현상을 정밀하게 제어할 수 있는 가능성을 제시합니다.", "novelty": "기존의 단순 모델을 넘어 기울어진 바일 밴드 구조에서의 양자 수송을 구체화했으며, ARPES로 관측되는 페르미 아크의 틸트 효과를 수송 물성과 연결했다는 점이 독자에게 중요합니다.", "unresolved": "실제 복잡한 격자 구조를 가진 화합물에서의 비대칭 틸트 효과가 수송 실험에서 어느 정도의 정량적 편차를 보일지는 추가적인 연구가 필요합니다.", "future_work": "특정 바일 반금속 물질에서의 비대칭 틸트 엔지니어링을 통한 QHE 실험 관측 시도가 이어질 것으로 보입니다.", "concepts": [{"term": "Fermi arc", "why_emerged": "바일 반금속의 표면에서 바일 노드 쌍을 연결하는 개방형 페르미 표면이 필요했기 때문입니다.", "origin": "Wan et al. (2011)에 의해 이론적으로 예측되었습니다.", "connections": "위상 절연체의 표면 상태와 연결되며, ARPES의 주요 관측 대상입니다."}, {"term": "3D Quantum Hall Effect", "why_emerged": "2차원 계에서만 가능하던 양자 홀 효과를 3차원 물질의 페르미 아크를 통해 확장하려는 시도입니다.", "origin": "Halperin (1987)이 이론적 기반을 마련했습니다.", "connections": "위상 수송 현상, 자기 저항 효과와 관련이 깊습니다."}], "english_summary": ["The paper investigates 3D QHE in tilted Weyl semimetals.", "It considers both symmetric and asymmetric band tilting conditions.", "The results provide insights into how surface Fermi arcs contribute to transport.", "This connects topological band geometry to observable quantum transport phenomena."]}}, {"title": "Tunneling signatures of interband coherence in dilute exciton condensates", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/mb3n-l45p", "authors": "Kryštof Kolář, Felix von Oppen", "last_authors": "Kryštof Kolář, Felix von Oppen", "summary": "We theoretically investigate signatures of exciton condensation and the underlying interband coherence in scanning tunneling microscopy. We consider both monolayer and bilayer condensates in the regime of a dilute condensate of tightly bound excitons. For monolayer condensates, interband coherence is directly encoded in spatially oscillating contributions to the tunneling conductance, which break the underlying lattice symmetry. We show how scanning tunneling microscopy allows one to extract the exciton wave function. For bilayer condensates, we show that the formation of the exciton insulator is signaled by the emergence of a characteristic peak in the tunneling conductance, which can be used to extract the (local) exciton density. Our results are based on analytical considerations using a systematic solution of the mean-field equations in powers of the exciton density as well as numerical calculations.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Theoretical STM signatures for 2D condensates; matches user interest in STM and 2D materials.", "tags": ["method", "material", "STM"], "image": "", "briefing": {"background": "엑시톤 응축체(exciton condensate)는 전자와 정공이 결합하여 형성된 보존(boson)의 집합체로, 위상적 절연체와 초전도체에 비견되는 강상관계 물질의 중요한 연구 대상입니다.", "motivation": "응축된 엑시톤 상태를 직접적으로 증명하기 위한 유용한 도구로서 STM의 tunneling signature를 이론적으로 정립하고자 했습니다.", "result": "단층에서는 엑시톤 응축에 의한 격자 대칭성 파괴가 공간적인 tunneling conductance 진동으로 나타나며, 이중층에서는 응축 밀도에 비례하는 특징적인 피크가 나타남을 보였습니다.", "implication": "STM을 통해 엑시톤 파동함수와 밀도를 직접적으로 이미징할 수 있는 방법론을 제공합니다.", "novelty": "STM의 로컬 프로빙 능력을 활용하여 엑시톤의 결맞음(coherence) 특성을 추출하는 구체적인 지표를 제시했다는 점에서 STM/STS 관련 연구자에게 큰 실용적 가치가 있습니다.", "unresolved": "실험적 관측 시, 온도 효과나 표면 오염에 의한 노이즈를 어떻게 완벽히 분리할지에 대한 구체적 실험 프로토콜은 부족합니다.", "future_work": "반데르발스 이종접합 구조에서의 저온 STM 실험을 통한 응축 피크 검증이 기대됩니다.", "concepts": [{"term": "Exciton condensation", "why_emerged": "전자와 정공의 강한 쿨롱 인력으로 인해 저온에서 새로운 바닥 상태가 형성될 가능성이 제기되었습니다.", "origin": "Keldysh와 Kopaev (1964)에 의해 처음 제안되었습니다.", "connections": "BCS 초전도 이론과 수학적으로 유사한 구조를 가집니다."}, {"term": "Interband coherence", "why_emerged": "두 밴드 간의 전자 결합이 응축 상태의 위상적 위상을 결정짓기 때문에 중요합니다.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "다체 물리 및 양자 광학의 결맞음 현상과 연결됩니다."}], "english_summary": ["Provides a theoretical framework for identifying exciton condensates via STM.", "Predicts spatially oscillating tunneling conductance for monolayer condensates.", "Identifies a specific tunneling peak for bilayer exciton insulators.", "Offers a method to extract exciton wave functions using scanning probes."]}}, {"title": "Dynamical Spectral Function of the Kagome Quantum Spin Liquid", "journal": "PRL_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/fjjf-xspp", "authors": "Jiahang Hu, Runze Chi, Yibin Guo, B. Normand, Hai-Jun Liao, T. Xiang", "last_authors": "Hai-Jun Liao, T. Xiang", "summary": "Quantum spin liquids (QSLs) host exotic fractionalized magnetic and gauge-field excitations whose microscopic origin , "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/n824-tw3h", "authors": "Bo Peng, Yuzhu Wang, Bo Yang", "last_authors": "Yuzhu Wang, Bo Yang", "summary": "A single Landau level (LL) dressed with periodic electrostatic potentials can realize a plethora of interacting topological phases where the Hall conductivity generally does not equal to the LL filling factor. Their physics can be captured by a new family of flat topological bands: decorated Landau …", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Theoretical study of topological phases and incompressible states in decorated Landau levels, relevant to quantum Hall physics.", "tags": ["theory", "topologicalphases", "quantumHall", "Landaulevels"], "image": "", "briefing": {"background": "양자 홀 효과(Quantum Hall Effect)는 강한 자기장에서 평탄한 란다우 준위(Landau level)가 형성되어 나타나는 위상학적 현상입니다. 최근에는 란다우 준위의 분산 관계를 물리적으로 변형하여 새로운 분수 양자 홀 상태나 비압축성 상태를 제어하려는 시도가 활발합니다.", "motivation": "란다우 준위가 주기적인 정전기 포텐셜로 '장식(decorated)'될 때, 상호작용하는 입자들이 어떻게 새로운 위상학적 위상으로 상전이하는지 이론적으로 규명하고자 합니다.", "result": "새로운 평탄 위상 밴드 모델인 '장식된 란다우 준위(decorated Landau levels)'를 제시하였으며, 이 모델에서 홀 전도도가 일반적인 란다우 준위 채움 인자와 일치하지 않는 다양한 비압축성 위상들이 나타남을 보였습니다.", "implication": "란다우 준위의 에너지를 엔지니어링함으로써 새로운 형태의 분수 양자 홀 상태를 구현할 수 있는 이론적 토대를 마련하였습니다.", "novelty": "기존 란다우 준위의 고정된 위상 물리학을 넘어, 포텐셜 변형을 통해 위상적 위상을 인위적으로 조절하는 새로운 설계 방식을 제시했다는 점에서 흥미롭습니다.", "unresolved": "이러한 장식된 란다우 준위 모델이 실제 2차원 전자 가스 시스템에서 물리적으로 어떻게 구현될 수 있는지에 대한 구체적인 재료적 제안은 부족합니다.", "future_work": "실제 실험적으로 관측 가능한 장식된 란다우 준위 시스템을 설계하고, 이를 통해 나타날 수 있는 분수 양자 홀 위상의 수치적 검증이 필요합니다.", "concepts": [{"term": "란다우 준위", "why_emerged": "자기장 하에서 전자의 에너지 상태가 불연속적인 밴드로 분리되는 현상을 설명하기 위해 필요함.", "origin": "Lev Landau (1930).", "connections": "양자 홀 효과, 사이클로트론 공명."}, {"term": "분수 양자 홀 효과", "why_emerged": "전자 간 상호작용으로 인해 정수 배가 아닌 분수 배의 홀 전도도가 나타나는 현상을 설명하기 위해 필요함.", "origin": "Tsui, Stormer, Laughlin (1982).", "connections": "위상적 질서, 애니온(Anyons)."}], "english_summary": ["Explores physics of Landau levels modified by       [['왜 생겼나: ', c.why_emerged], ['누가 만들었나: ', c.origin], ['연결되는 흐름: ', c.connections]].forEach(([label, text]) => { if (!text) return; const p = document.createElement('p'); const bold = textEl('b', '', label); p.appendChild(bold); p.append(text); item.appendChild(p); });
      concepts.appendChild(item);
    });
    section.appendChild(concepts);
    briefing.appendChild(section);
  }
  if (b.english_summary && b.english_summary.length) { const section = document.createElement('section'); section.className = 'brief-section wide'; section.appendChild(textEl('h2', '', 'English Summary')); const ul = document.createElement('ul'); b.english_summary.slice(0, 5).forEach(line => ul.appendChild(textEl('li', '', line))); section.appendChild(ul); briefing.appendChild(section); }
  slideEl.appendChild(briefing);
  counterEl.textContent = `${index + 1} / ${slides.length}`;
  prevBtn.disabled = index === 0;
  nextBtn.disabled = index === slides.length - 1;
}
prevBtn.addEventListener('click', () => { index = Math.max(0, index - 1); render(); });
nextBtn.addEventListener('click', () => { index = Math.min(slides.length - 1, index + 1); render(); });
document.addEventListener('keydown', event => { if (event.key === 'ArrowLeft') prevBtn.click(); if (event.key === 'ArrowRight') nextBtn.click(); });
render();
</script>
</body>
</html>
