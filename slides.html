<title>Daily Paper Slideshow</title>
<style>
  :root {
    color-scheme: light;
    --bg: #f6f7f4;
    --paper: #ffffff;
    --ink: #111827;
    --muted: #64748b;
    --line: #d8ddd2;
    --accent: #176b87;
    --accent-2: #9a3412;
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; overflow: auto; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: var(--bg); color: var(--ink); }
  .shell { max-width: 1500px; min-height: 100vh; margin: 0 auto; padding: 14px 18px; display: flex; flex-direction: column; }
  .topbar { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 16px; }
  .top-actions { display: flex; align-items: center; gap: 10px; }
  .topbar a, button { border: 1px solid var(--line); border-radius: 8px; background: var(--paper); color: var(--ink); padding: 10px 14px; font-weight: 700; text-decoration: none; cursor: pointer; }
  button.primary { background: var(--accent); border-color: var(--accent); color: white; }
  button:disabled { opacity: 0.45; cursor: not-allowed; }
  .counter { color: var(--muted); font-weight: 700; }
  .slide { min-height: calc(100vh - 82px); background: var(--paper); border: 1px solid var(--line); border-radius: 10px; padding: 18px; box-shadow: 0 18px 42px rgba(15, 23, 42, 0.10); display: grid; grid-template-columns: minmax(310px, 0.86fr) minmax(0, 1.55fr); gap: 18px; overflow: visible; }
  .paper-head { min-width: 0; min-height: 0; overflow: visible; display: flex; flex-direction: column; gap: 12px; }
  .figure { margin: 0; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: #f8fafc; }
  .figure img { display: block; width: 100%; max-height: 41vh; object-fit: contain; background: white; }
  .figure figcaption { padding: 7px 10px; color: var(--muted); font-size: 12px; line-height: 1.3; }
  .head-text { display: flex; flex-direction: column; gap: 9px; min-width: 0; }
  .badges { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .badge { border-radius: 999px; padding: 5px 9px; background: #eef2ff; color: #3730a3; font-size: 12px; font-weight: 800; }
  .score { background: #fee2e2; color: #991b1b; }
  h1 { margin: 0; font-size: 25px; line-height: 1.15; letter-spacing: 0; overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
  h1 a { color: inherit; text-decoration-color: rgba(23, 107, 135, 0.35); text-decoration-thickness: 2px; text-underline-offset: 4px; }
  h1 a:hover { color: var(--accent); text-decoration-color: var(--accent); }
  .meta, .authors, .why, .abstract { font-size: 13px; line-height: 1.45; }
  .meta, .authors { color: var(--muted); }
  .why strong, .abstract strong, .authors strong { color: var(--ink); }
  .authors { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .why { border-left: 4px solid var(--accent-2); padding-left: 10px; color: #374151; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .abstract { border-top: 1px solid var(--line); padding-top: 14px; color: #374151; }
  .original-abstract { border-top: 1px solid var(--line); padding-top: 10px; color: #374151; font-size: 11.5px; line-height: 1.35; overflow-wrap: anywhere; }
  .original-abstract strong { display: block; margin-bottom: 4px; color: var(--ink); }
  .tags { display: flex; flex-wrap: wrap; gap: 8px; }
  .tag { border-radius: 999px; padding: 4px 8px; background: #f1f5f9; color: #475569; font-size: 12px; font-weight: 700; }
  .head-text > .link { display: none; }
  .briefing { min-width: 0; min-height: 0; overflow: visible; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); grid-auto-rows: minmax(0, auto); align-content: start; gap: 11px 18px; border-top: 0; padding-top: 0; }
  .brief-section { min-width: 0; }
  .brief-section.wide { grid-column: 1 / -1; }
  .brief-section h2 { margin: 0 0 4px; font-size: 14px; line-height: 1.22; color: #0f766e; letter-spacing: 0; }
  .brief-section p, .brief-section li { margin: 0; font-size: 12.5px; line-height: 1.42; color: #1f2937; overflow-wrap: anywhere; }
  .brief-section ul { margin: 0; padding-left: 20px; }
  .concepts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 9px 14px; }
  .concept { border-top: 1px solid var(--line); padding-top: 7px; }
  .concept h3 { margin: 0 0 4px; font-size: 13px; color: #7c2d12; letter-spacing: 0; }
  .concept p { margin: 2px 0 0; font-size: 11.5px; line-height: 1.35; color: #374151; overflow-wrap: anywhere; }
  .concept b { color: #111827; }
  .link { color: var(--accent); font-weight: 800; text-decoration: none; }
  .empty { padding: 48px; background: var(--paper); border: 1px solid var(--line); border-radius: 12px; color: var(--muted); }
  @media (max-width: 860px) {
    .shell { padding: 14px; }
    .topbar, .top-actions { align-items: stretch; flex-direction: column; }
    .slide, .briefing, .concepts { grid-template-columns: 1fr; }
    .slide { min-height: auto; overflow: visible; display: grid; }
    h1 { font-size: 28px; }
  }
</style>

tags": ["method", "material", "kagome", "correlated", "Hubbard"], "image": "https://arxiv.org/html/2608.03894v1/x1.png", "briefing": {"background": "가고메 격자 시스템은 전자 간의 상호작용과 기하학적 좌절(frustration)이 복합적으로 작용하여 독특한 전자 상태를 유도하는 응집물질물리학의 주요 연구 대상입니다. 기존의 DQMC(Determinant Quantum Monte Carlo) 시뮬레이션은 높은 계산 비용으로 인해 시스템 크기 확장에 제약이 많았습니다.", "motivation": "기존 시뮬레이션의 한계를 극복하여 더 큰 시스템 크기에서 가고메 격자의 전자 상관관계를 명확히 규명하고, 유한 크기 효과(finite-size effect)를 배제한 물리적 상(phase)을 확인하고자 합니다.", "result": "FFT와 지연 업데이트 알고리즘을 결합하여 계산 속도를 획기적으로 개선했습니다. 이를 통해 Dirac 채움에서의 초유체 양자 임계 현상을 검증했으며, 과거 제안되었던 삼각형 규칙 전하 밀도파(charge-density-wave) 질서가 유한 크기 효과일 가능성이 높음을 보였습니다.", "implication": "가고메 금속(AV3Sb5 등)에서 관측되는 다양한 전자 질서가 진정한 벌크 상태인지 혹은 제한된 환경에서의 부차적 효과인지 판별하는 기준을 마련합니다.", "novelty": "기존 O(N^3) 수준의 계산 복잡도를 O(N^2.49)로 개선하여 대규모 시뮬레이션을 가능하게 했으며, 이론적 논란이 있던 전하 밀도파 질서의 타당성을 재검토했습니다.", "unresolved": "이번 연구는 인력(attractive) Hubbard 모델에 집중되어 있어, 실제 가고메 금속의 척력(repulsive) 및 밴드 구조 효과를 완전히 대체하기에는 한계가 있습니다.", "future_work": "더 복잡한 밴드 구조와 Coulomb 척력을 포함한 모델로의 확장, 그리고 실험적 관측 데이터와의 직접적인 정량적 비교가 필요합니다.", "concepts": [{"term": "Determinant Quantum Monte Carlo (DQMC)", "why_emerged": "강상관 전자계에서 다체 문제(many-body problem)를 수치적으로 해결하기 위해 도입됨.", "origin": "Blankenbecler, Scalapino, Sugar (1981)에 의해 정립됨.", "connections": "Hubbard 모델 시뮬레이션의 표준 도구이며, 부호 문제(sign problem) 극복이 핵심 과제임."}, {"term": "Dirac filling", "why_emerged": "가고메 격자의 밴드 구조에서 나타나는 Dirac 노드(node) 위치의 전자 밀도 상태를 정의하기 위해 필요함.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "위상 절연체 및 위상 반금속 연구의 중심 개념."}], "english_summary": ["Developed a faster DQMC algorithm using FFT and delay-update schemes.", "Achieved doubled system sizes for studying the attractive Hubbard model on kagome lattices.", "Identified superfluid quantum criticality at Dirac filling.", "Showed that previously proposed triangle-rule CDW order is likely a finite-size artifact.", "Demonstrated O(N^2.49) scaling, enabling more reliable finite-size scaling analyses."]}}, {"title": "Emergence and Detection of Surface altermagnetism in KV2Se2O", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2608.03551", "authors": "Rodrigo Jaeschke-Ubiergo, Xanthe H. Verbeek, Colin Lange, et al.", "last_authors": "Alexander Mook, Jairo Sinov", "summary": "We demonstrate the recent concept of emergent surface altermagnetism through its unique signatures in \\KVSO. We show that for bulk antiferromagnetically ordered \\KVSO, the (001) surface exhibits $d$-wave altermagnetism. Our results fully explain the recent seemingly contradicgting experimental evidence, independently showing both an antiferromagnetically ordered bulk from neutron diffraction, and $d$-wave spin splitting from photoemission spectroscopy. To fully verify this conecept, we predict, as a key experimental signature, a large nonlinear Edelstein response, which is localized at the surface, and follows the $d$-wave altermagnetic symmetry. These results are not only relevant for the metallic and room-temperature magnet \\KVSO, but also for several other Lieb lattice systems. Our work expands the pool of techniques that can be used to detect altermagnetism emerging at the surfaces of antiferromagnets.", "tier": "A_MUST_READ", "score": "10", "reason": "Directly addresses altermagnetism and reconciles photoemission (ARPES) with bulk neutron data in KV2Se2O.", "tags": ["photoemission", "altermagnetism", "material"], "image": "https://arxiv.org/html/2608.03551v1/surface_states.001.jpeg", "briefing": {"background": "반강자성체(antiferromagnet)의 표면에서 발생하는 전자 구조 변화는 벌크와 다른 독특한 스핀 및 밴드 구조를 가질 수 있습니다. 알터자기성(altermagnetism)은 최근 발견된 비상반성 자성 질서로, 비자성체와 자성체의 특성을 공유하며 주목받고 있습니다.", "motivation": "KV2Se2O 물질에서 벌크의 중성자 회절 데이터와 표면 ARPES 데이터 간의 불일치를 해소하고, 이 현상의 근본 원인을 알터자기성으로 설명하고자 합니다.", "result": "KV2Se2O의 (001) 표면이 d-wave 알터자기성을 가짐을 입증했습니다. 이는 벌크의 반강자성 특성과 표면의 스핀 분할(spin splitting) 현상을 동시에 설명하는 물리적 프레임워크를 제공합니다.", "implication": "표면 알터자기성은 표면 민감한 측정 기법인 ARPES를 통해 자성 상태를 탐구하는 새로운 길을 제시합니다.", "novelty": "벌크 측정값과 표면 측정값 간의 상 DE) is a fascinating nonreciprocal phenomenon where the critical current is different for opposite current directions. It is widely believed that realizing SDE requires breaking both inversion symmetry (IS) and time-reversal symmetry (TRS), which are usually achieved via heterostructure engineering and applying external magnetic fields. Here, we report a pressure-induced magnetic-field-free SDE in NbSe2 flakes without any heterostructures. We show that pressure alone breaks the IS, as confirmed by the second harmonic generation. Crucially, upon applying an out-of-plane magnetic field (B), the SDE exhibits even-in-B behavior, implying the absence of explicit TRS breaking. This finding challenges the prevailing theoretical paradigm and demonstrates that a magnetic-field-free SDE can emerge without explicitly breaking TRS. Thereby, our work establishes pressure engineering as a powerful tool for inducing nonreciprocal superconductivity and designing versatile, magnetic-field-free superconducting devices.", "tier": "A_MUST_READ", "score": "9", "reason": "author whitelist: Yulin Chen", "tags": ["heterostructure", "superconduct"], "image": "https://arxiv.org/static/browse/0.3.4/images/arxiv-logo-fb.png", "briefing": {"background": "초전도 다이오드 효과(SDE)는 전류의 방향에 따라 임계 전류 값이 달라지는 비상반성 현상을 의미합니다. 통상적으로 이는 반전 대칭성(IS)과 시간 반전 대칭성(TRS)이 동시에 깨져야 가능하다고 알려져 있습니다.", "motivation": "기존 통념과 달리 외부 자기장이나 이종 구조 없이, 압력만으로 NbSe2 박막에서 SDE를 구현할 수 있는지 탐구하고자 함.", "result": "압력 하에서 구조적 대칭성 붕괴(IS 파괴)가 발생하며, 이때 외부 자기장 하에서 발생하는 SDE가 TRS 파괴 없이도 나타남을 입증.", "implication": "자기장이 없는 환경에서도 비상반 초전도 소자를 제작할 수 있는 새로운 물리적 경로를 제시함.", "novelty": "이종 구조 없이 오직 압력 제어만으로 SDE를 유도했다는 점이 파격적이며, NbSe2와 같은 2D 물질 연구자들에게 새로운 설계 가이드를 제공.", "unresolved": "자기장 하에서 SDE가 왜 'even-in-B' 거동을 보이는지에 대한 미시적 메커니즘은 추가적인 이론 검증이 필요함.", "future_work": "다양한 2D 물질에 대한 압력 기반 SDE 제어 연구 및 이를 활용한 비자기장형 초전도 회로 소자 제작.", "concepts": [{"term": "Superconducting Diode Effect", "why_emerged": "초전도체에서의 전류 방향에 따른 비대칭적 응답을 활용한 비선형 전자 소자 응용을 위해 주목받음.", "origin": "초전도 이종 구조 및 특정 결정계에서 발견된 이후 최근 집중 연구됨.", "connections": "비상반성 수송, 위상 초전도체, Josephson 접합."}, {"term": "Second Harmonic Generation (SHG)", "why_emerged": "물질 내부의 대칭성, 특히 반전 대칭성 붕괴 여부를 비파괴적으로 확인하기 위해 사용되는 비선형 광학 기술.", "origin": "비선형 광학의 초기 연구들로부터 확립.", "connections": "결정 구조 해석, 위상 물질의 대칭성 탐구."}], "english_summary": ["Discovery of magnetic-field-free superconducting diode effect in NbSe2 flakes under pressure.", "Pressure induces inversion symmetry breaking, confirming nonreciprocal transport without external fields.", "Challenges the paradigm that explicit TRS breaking is required for SDE.", "Establishes pressure engineering as a robust tool for designing nonreciprocal superconducting devices."]}}, {"title": "Pressure-induced Superconductivity in Thermoelectric Semiconductor Mg3Sb2 (Journal American Chemical Society (2026))", "journal": "arXiv_CondMat", "source": "author whitelist", "link": "https://arxiv.org/abs/2608.03058", "authors": "Cuiying Pei, Yasong Wu, Airan Li, et al.", "last_authors": "Jiong Yang, Yanpeng Qi", "summary": "The intrinsic electronic structures of narrow bandgap thermoelectric (TE) materials serve as a platform for the investigation of coupling effects of quasi-particles under high pressure, enabling the exploration of emerging electronic and phonon transport, superconductivity, and topological transition. Here, we report the discovery of pressure-induced superconductivity in the TE semiconductor Mg3Sb2. Upon the increased pressure, the metallization occurs at 8.7 GPa, followed by a superconducting transition concomitant with a carrier-type crossover from p- to n-type. This phenomenon arises from a pressure-induced structural phase transition from the semiconducting P-3m1 to the metallic C2/m-I phase. The superconducting critical temperature (Tc) exhibits a dome-shaped pressure dependence, peaking at 3.3 K at 12.6 GPa. Combined theoretical calculations, high-pressure Raman spectroscopy, and X-ray diffraction (XRD) measurements reveal an a , {"title": "Laser-induced controllable magnetic order switching and spin injection in altermagnets", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/wfn4-2gy6", "authors": "Jie Ma", "last_authors": "Jie Ma", "summary": "Altermagnets have zero net magnetization and nonrelativistic spin splitting, which is ideal for spintronic applications. The control of the spin state is of crucial importance. Here, the laser-induced spin dynamics in an altermagnet/metal heterostructure has been investigated using the real-time tim…", "tier": "B_IMPORTANT_CONDMAT", "score": "9", "reason": "Directly relevant to altermagnetism and spin dynamics, a strong interest area.", "tags": ["altermagnet", "spintronics", "magnetism", "heterostructure"], "image": "", "briefing": {"background": "알터마그넷(Altermagnet)은 순 자화는 0이지만 비상대론적 스핀 분할을 가져 차세대 스핀트로닉스 소자로 주목받는 물질군입니다.", "motivation": "알터마그넷의 자기적 상태를 레이저를 이용해 초고속으로 제어하고 스핀 주입 효율을 높이는 방안을 탐구하기 위함입니다.", "result": "레이저 유도 스핀 동역학 시뮬레이션을 통해 알터마그넷/금속 이종접합에서 스핀 상태 제어 및 주입 가능성을 확인했습니다.", "implication": "알터마그넷 기반의 초고속 스핀트로닉스 소자 개발에 직접적인 물리적 토대를 제공합니다.", "novelty": "외부 자기장 없이 빛으로 자기 상태를 스위칭할 수 있음을 보였으며, 이는 알터마그넷 기반 비휘발성 메모리 소자 구동의 핵심 단서입니다.", "unresolved": "실제 실험적 레이저 파라미터(펄스 폭, 강도)에 따른 정확한 스위칭 임계값과 열적 요동의 영향은 추가 분석이 필요합니다.", "future_work": "실제 알터마그넷 박막 샘플에서의 펨토초 레이저 측정 및 스핀 주입 전압 실험.", "concepts": [{"term": "알터마그넷", "why_emerged": "기존 강자성체의 잔류 자기 문제와 반강자성체의 스핀 정보 읽기 어려움을 동시에 해결하기 위해 제안됨.", "origin": "최근 이론적 예측 및 실험적 검증이 활발히 진행 중이며, 구체적인 선구자는 특정하기 어려움.", "connections": "반강자성체, 스핀트로닉스, 베리 곡률."}], "english_summary": ["Explores laser-induced spin dynamics in altermagnet/metal heterostructures.", "Demonstrates controllability of spin state and injection efficiency.", "Provides a foundation for ultrafast spintronic devices using altermagnets."]}}, {"title": "Staggered Dzyaloshinskii-Moriya and the spin-canting angle in centrosymmetric altermagnetic and ferromagnetic phases: Influence on the anomalous Hall effect and Weyl points", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/rjg7-n1tc", "authors": "Mathews Benny, Xujia Gong, Kamil Jamroszczyk, et al.", "last_authors": "Jan Skolimowski, Carmine Autieri", "summary": "We present a simple methodology to compute the anomalous Hall conductivity (AHC) as a function of the canting angles in ferromagnets and altermagnets, starting from a nonmagnetic Hamiltonian obtained from first-principles calculations that preserves the full symmetry of the crystal structure. Magnet…", "tier": "B_IMPORTANT_CONDMAT", "score": "9", "reason": "Theory paper directly connecting altermagnetism, anomalous Hall effect, and Weyl points.", "tags": ["altermagnet", "anomalousHall", "Weyl", "theory", "electronicstructure"], "image": "", "briefing": {"background": "자성 물질 내에서의 비정상 홀 효과(AHE)와 Weyl 노드는 물질의 위상학적 특성을 이해하는 핵심 지표입니다.", "motivation": "강자성체와 알터마그넷에서 스핀 경사각(canting angle) 변화가 어떻게 홀 전도도와 Weyl 점의 위치를 변화시키는지 체계적으로 분석하고자 함.", "result": "스핀 경사각에 따른 비정상 홀 전도도를 계산하는 방법론을 정립하고, 대칭성을 보존하는 제일원리 계산을 통해 이를 입증함.", "implication": "알터마그넷 내에서 스핀 재배열이 어떻게 위상학적 전자 상태를 조절하는지 예측 가능하게 함.", "novelty": "비자기적 해밀토니안에서 출발하여 경사각에 따른 홀 효과를 직접 계산하는 범용적 접근법을 제시함.", "unresolved": "제시된 모델이 복잡한 강상관 관계를 포함한 알터마그넷에서 어느 정도의 정확도를 유지하는지는 추가 검증이 필요.", "future_work": "실제 화합물(예: RuO2)에서의 AHE 측정값과 이론값의 직접 비교.", "concepts": [{"term": "비정상 홀 효과 (AHE)", "why_emerged": "전하 수송에서 자기적 위상 상태가 기여하는 부분을 구분하기 위해 필요함.", "origin": "Edwin Hall이 발견한 고전적 홀 효과 이후, 자성체에서의 변형으로 확립됨.", "connections": "베리 곡률, 위상학적 반금속, 스핀-궤도 결합."}, {"term": "Weyl 점", "why_emerged": "밴드 구조에서 스핀-운동량 고정 및 위상 불변량을 설명하기 위해 등장함.", "origin": "Hermann Weyl의 이론적 제안(1929), 고체물질에서는 2010년대 초반 제안됨.", "connections": "토폴로지, 아노말리(Anomaly), 페르미 아크."}], "english_summary": ["Presents a methodology to calculate AHC as a function of spin canting angles.", "Applies the method to both ferromagnetic and altermagnetic phases.", "Analyzes the impact of canting on Weyl points and topological properties."]}}, {"title": "Theory of orientation averaging in x-ray spectroscopies: Understanding polarization dependence in a Cartesian tensor approach", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/r37l-y2gc", "authors": "Sihan Zhang (张思翰), Oana Bunău, Marius Retegan, Pieter Glatzel", "last_authors": "Marius Retegan, Pieter Glatzel", "summary": "X-ray absorption spectroscopy (XAS) and resonant inelastic x-ray scattering (RIXS) are powerful probes of electronic structure owing to their chemical and orbital selectivity. For powder samples, however, interpreting RIXS spectral intensities remains challenging as the measured signal is an average…", "tier": "B_IMPORTANT_CONDMAT", "score": "9", "reason": "RIXS methodology theory is very relevant for an experimentalist working with RIXS.; demoted from A: broad CM, not direct user/project hit", "tags": ["RIXS", "spectroscopy", "methodology", "theory"], "image": "", "briefing": {"background": "RIXS와 XAS는 전자 구조 및 궤도 선택적 정보를 제공하나, 분말 샘플 측정 시 방향 평균화(orientation averaging)로 인한 해석의 복잡성이 큼.", "motivation": "분말 샘플의 RIXS 스펙트럼에서 편광 의존성을 체계적으로 해석하기 위한 텐서 기반 수학적 프레임워크를 정립하고자 함.", "result": "카테시안 텐서를 사용하여 방향 평균화 과정을 일반화하고, 실험적 스펙트럼 해석을 위한 직관적인 방법론을 제공.", "implication": "단결정 샘플을 구하기 힘든 신물질 연구에서 RIXS 데이터의 신뢰도를 높이고 해석 편향을 줄일 수 있음.", "novelty": "데이터 해석의 불확실성을 줄이는 엄밀한 수학적 기초를 제공하여 RIXS 실험 데이터 분석의 표준화에 기여함.", "unresolved": "매우 강한 비등방성을 가진 시스템에서 근사치의 정확도 범위.", "future_work": "다양한 전이금속 산화물 분말 샘플에 대한 방법론 검증 및 라이브러리 구축.", "concepts": [{"term": "RIXS", "why_emerged": "전자 구조의 에너지, 운동량, 궤도 정보를 동시에 관측하기 위해 등장.", "origin": "초기 X선 산란 기술에서 발전하여 현대적인 고분해능 기술로 정착됨.", "connections": "XAS, 전하 밀도 파(CDW), 마그논, 엑시톤."}], "english_summary": ["Addresses the challenge of interpreting RIXS spectral intensities in powder samples.", "Utilizes a Cartesian tensor approach for orientation averaging.", "Provides a theoretical framework to handle polarization dependence systematically."]}}, {"title": "Emergent cooperative superstructures via order-disorder kinetics in molecular intercalation superlattices", "journal": "Science_Advances", "source": "Gemini", "link": "https://doi.org/10.1126/sciadv.aeg4785", "authors": "Taiga Ueda, Hideki Matsuoka, Shungo Aoyagi, et al.", "last_authors": "Taka-hisa Arima, Naoya Kanazawa", "summary": "Molecular intercalation superlattices, formed by inserting organic molecules into van der Waals crystals, create inorganic-organic hybrid interfaces that have enabled a variety of emergent phenomena. Traditionally, the intercalated molecules have been regarded as inactive spacers, while their collective ordering have remained largely unexplored. Here, we report the discovery of a cooperative superstructure phase in molecule-intercalated niobium diselenide (NbSe 2 ), where ordering of the guest molecules induce a superstructure in the NbSe 2 host lattice, characterized by a moiré structure due to incommensurability between molecular and inorganic lattices. Thermal-quench measurements show that the transition is governed by slow order-disorder kinetics, contrasting with fast charge or magnetic ordering in inorganic solids. Our findings establish molecular ordering as a route for engineering heterointerfaces, enabling thermally programmable superstructures.", "tier": "B_IMPORTANT_CONDMAT", "score": "9", "reason": "Molecular intercalation in NbSe2 creating moiré superstructures; highly relevant to vdW engineering and CDW systems.", "tags": ["material", "vanderWaals", "NbSe2", "moir"], "image": "", "briefing": {"background": "반데르발스(vdW) 물질의 층 사이에 분자를 삽입하는 인터칼레이션은 새로운 물성 제어를 위한 플랫폼으로 연구되어 왔으나, 주로 삽입된 분자는 수동적인 역할로 간주되었습니다.", "motivation": "분자 인터칼레이션에서 삽입된 분자 자체의 집단적 정렬(ordering)이 호스트 격자에 미치는 영향과 이로 인한 새로운 초격자 구조 형성 가능성을 탐구하고자 했습니다.", "result": "NbSe2 호스트 내부에 유기 분자를 삽입하여 분자 층과 호스트 층 사이의 불일치(incommensurability)로 인한 모아레 초격자가 형성됨을 발견했습니다.", "implication": "분자 정렬을 조절함으로써 무기물 호스트의 격자 구조를 열적으로 프로그래밍할 수 있는 새로운 인터페이스 공학적 기법을 제시합니다.", "novelty": "기존의 빠른 전하/자기 정렬과 달리, 매우 느린 질서-무질서 동역학을 이용해 열적으로 제어 가능한 초격자를 구현했다는 점이 독특합니다.", "unresolved": "분자층의 정렬이 호스트의 초전도성이나 CDW(전하밀도파) 상태와 어떻게 구체적으로 상호작용하는지에 대한 상세 메커니즘은 명확하지 않습니다.", "future_work": "다른 2차원 물질군으로의 확장 및 삽입된 분자의 종류를 변경하여 모아레 패턴의 주기와 물성을 정밀하게 튜닝하는 연구가 기대됩니다.", "concepts": [{"term": "Molecular Intercalation", "why_emerged": "vdW 층상 물질의 층간 간격을 넓히거나 전하를 도핑하여 물리적 성질을 변조하기 위해 도입되었습니다.", "origin": "초기에는 흑연 인터칼레이션 화합물(GICs)로 잘 알려져 있습니다.", "connections": "vdW 헤테로구조 설계, 전이금속 디칼코게나이드(TMD) 물성 제어."}, {"term": "Moiré Superstructure", "why_emerged": "두 격자 간의 주기성 차이나 회전 각도에 의해 발생하는 거대 주기 구조를 통해 물성을 공학적으로 제어하기 위해 사용됩니다.", "origin": "트위스트 이층 그래핀 연구에서 주목받기 시작했습니다.", "connections": "Flat band 물성, 강상관 전자계 제어."}], "english_summary": ["Molecular intercalation into NbSe2 creates inorganic-organic hybrid superlattices.", "The guest molecules induce a moiré superstructure due to lattice incommensurability.", "The phase transition is characterized by slow order-disorder kinetics.", "This provides a route for thermally programmable superstructures in vdW materials."]}}, {"title": "Curvature-Controlled Topological Magnon Phases in a Folded Kagome Lattice", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2607.08580", "authors": "Seif Alwan, Jonas Fransson", "last_authors": "Seif Alwan, Jonas Fransson", "summary": "We show that geometric curvature, encoded in the folding angle between two corner-sharing triangles on a kagome lattice, provides a continuous tuning knob for topological magnon phase. Starting from an extended spin Hamiltonian with exchange, Dzyaloshinskii-Moriya (DM) interaction, and a higher-order bow-tie coupling of scalar chiralities, we derive the chirality-mediated hopping amplitude, which depends on the folding and spin canting of the bow-tie triangles. At small folding and canting angles, the bow-tie coupling surpasses DM, establishing a curvature-dominated regime. These results establish curvature as an intrinsic geometric control parameter for topological magnonics and reveal a direct analogy with chirality-induced spin selectivity in molecular systems, pointing to a unified mechanism for chirality driven transport across scales. The mechanism is particularly relevant for chiral crystals where the DM interaction is weak or forbidden by symmetry, as in systems with a six-fold screw axis.", "tier": "B_IMPORTANT_CONDMAT", "score": "9", "reason": "Direct relevance to kagome lattice physics and topological magnonics.", "tags": ["kagome", "topological", "magnon"], "image": "https://arxiv.org/html/2607.08580v3/x1.png", "briefing": {"background": "카고메 격자 내의 자기적 상호작용은 기하학적 좌절(frustration)과 위상수학적 성질이 결합하여 독특한 들뜸(excitation) 상태를 만들어냅니다.", "motivation": "카고메 격자의 기하학적 접힘(folding) 각도가 위상수학적 마그논 위상을 어떻게 제어할 수 있는지 이론적으로 규명하고자 했습니다.", "result": "접힘 각도와 스핀 기울어짐(canting)을 통해 DM 상호작용보다 더 지배적인 'bow-tie' 결합이 발생하며, 이를 통해 마그논 위상을 제어할 수 있음을 보였습니다.", "implication": "기하학적 곡률(curvature)을 위상수학적 마그논 소자를 위한 새로운 튜닝 파라미터로 사용할 수 있음을 시사합니다.", "novelty": "기존의 DM 상호작용이 약하거나 금지된 대칭성을 가진 시스템에서도 곡률을 통해 위상적 성질을 유도할 수 있는 일반적인 메커니즘을 제시했습니다.", "unresolved": "실제 실험적으로 곡률이 정밀하게 제어된 카고메 자성체를 합성하고 마그논 밴드 구조를 관측하는 도전 과제가 남아있습니다.", "future_work": "카이랄 결정 구조에서의 마그논 수송 실험 및 곡률 기반의 위상적 마그논 회로 설계 연구가 뒤따를 것입니다.", "concepts": [{"term": "Topological Magnonics", "why_emerged": "스핀 파동(마그논)의 위상적 특성을 이용하여 에너지 소모가 적은 정보 처리를 구현하기 위해 필요합니다.", "origin": "위상 절연체 이론이 자성체로 확장되면서 정립되었습니다.", "connections": "스핀트로닉스, 베리 곡률, DM 상호작용."}, {"term": "Kagome Lattice", "why_emerged": "강한 기하학적 좌절과 평탄 밴드(flat band)를 포함한 독특한 전자 구조를 생성하기 위해 연구됩니다.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "AV3Sb5, 양자 스핀 액체, 위상 물질."}], "english_summary": ["Geometric curvature in folded kagome lattices controls topological magnon phases.", "A bow-tie coupling mechanism dominates over Dzyaloshinskii-Moriya interactions.", "Folding angle acts as a continuous knob for tuning topological magnon transport.", "The results offer a unified mechanism for chirality-driven transport."]}}, {"title": "Magnetoresistance in Magnetic Weyl semimetal Mn3ZnC", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2608.03414", "authors": "Sunil Gangwar, C. S. Yadav", "last_authors": "Sunil Gangwar, C. S. Yadav", "summary": "The magnetoresistance (MR) in magnetic materials reveal an intriguing spin-dependent electron scattering, highlighting the role of spin polarization on the electronic transport properties. This becomes even more interesting for the topological magnetic materials where a finite Berry curvature leads to an intrinsic scattering channel also. In this report, we investigate MR of Mn$_{3}$ZnC, an antiperovskite magnetic nodal line semimetal. Mn$_{3}$ZnC shows a ferromagnetic (FM) transition at $\\sim$ 420 K, followed by an ferrimagnetic (FIM) transition at $\\sim$ 195 K. We focus on the interpretation of MR data and highlight the relation between MR and its magnetization. The signature of magnetization induced MR shows correlation at low magnetic fields and displays distinct behaviors in the FIM and FM states. Similar to the isothermal magnetization M(H) curve of FM and FIM state, the MR curves exhibit a sharp increase, followed by a linear behavior at higher fields. As the magnetic field varies, the cusp-like anomaly becomes more pronounced, and vanishes at the magnetic phase transition, which then reappears as the temperature increases. The sign change in the MR curves in the FIM state is attributed to a drastic change in the carrier mobility. Interestingly, this system shows a positive MR in FM state at very low field, which is quite unusual.", "tier": "B_IMPORTANT_CONDMAT", "score": "9", "reason": "Experimental transport study on a magnetic Weyl semimetal, highlighting Berry curvature effects.", "tags": ["experiment", "Weyl-semimetal", "transport"], "image": "https://arxiv.org/static/browse/0.3.4/images/arxiv-logo-fb.png", "briefing": {"background": "위상학적 자성체에서 나타나는 특이한 자기저항(MR) 거동은 전자-스핀 결합 및 베리 곡률에 의한 산란 효과를 이해하는 핵심 지표입니다.", "motivation": "반페로브스카이트 구조를 가진 자기적 노드 라인(nodal line) 반금속 Mn3ZnC에서 자기장 변화에 따른 include all weathervane loops with networks restricted to elementary six-spin loops, we examine how energetic constraints shape phase-space structure. We find that connectivity distributions are sharply peaked in large systems, while restrictions to short loops reduce typical connectivity. Spectral properties further distinguish the two cases, with short-loop networks exhibiting Gaussian spectra and full networks displaying non-Gaussian features associated with correlated loop updates. Finally, a box-counting analysis reveals distinct fractal properties of the two networks, demonstrating how energetic constraints control the global geometry of configuration space. These results show that the hierarchy of weathervane loop rotations provides a direct link between microscopic constraints and emergent phase-space geometry in a frustrated magnet.", "tier": "B_IMPORTANT_CONDMAT", "score": "9", "reason": "Study of the kagome antiferromagnet ground state, very relevant to current kagome materials.", "tags": ["kagome", "magnetism", "frustration"], "image": "https://arxiv.org/html/2601.05933v2/schematic_arrows.png", "briefing": {"background": "가고메 격자 반강자성체는 기하학적 좌절(frustration)로 인해 바닥 상태가 축퇴되어 복잡한 위상 공간 구조를 가집니다. 이는 가고메 금속(AV3Sb5 등)에서 관찰되는 전하 밀도 파동이나 자기적 질서의 기원을 이해하는 데 중요한 기초가 됩니다.", "motivation": "가고메 하이젠베르크 반강자성체의 공평면(coplanar) 바닥 상태 manifold에서, 'weathervane loop' 회전이 위상 공간 내의 상태 간 연결성에 어떤 영향을 미치는지 밝히고자 합니다.", "result": "위상 공간 네트워크 분석을 통해, 에너지 제약이 짧은 루프(six-spin loop)와 전체 루프 간의 연결성 및 프랙탈 특성을 다르게 결정함을 확인했습니다. 전체 루프 모델은 비가우스적 스펙트럼과 복잡한 연결성을 보입니다.", "implication": "가고메 격자에서 국소적인 스핀 회전(weathervane)이 단순한 국소 변화를 넘어 거시적인 위상 공간의 기하학적 구조를 결정짓는 핵심 기제임을 보여줍니다.", "novelty": "기존의 물리적 관찰 대신 위상 공간 네트워크(Phase-space network)와 그래프 이론을 도입하여 가고메 반강자성체의 복잡성을 정량적으로 분석했습니다.", "unresolved": "실제 실험적 화합물에서의 에너지 스케일이 구체적인 위상 공간 경로에 미치는 영향은 명확하지 않습니다.", "future_work": "실제 AV3Sb5 계열 물질의 비공평면 상태나 온도 변화에 따른 연결성 변화를 시뮬레이션으로 확장하는 연구가 필요합니다.", "concepts": [{"term": "Weathervane loop", "why_emerged": "가고메 격자의 기하학적 좌절 상태에서 에너지를 높이지 않고 스핀을 재배치할 수 있는 국소적 루프 회전 모드를 설명하기 위해 도입됨.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "가고메 격자의 잔류 엔트로피, 스핀 액체 이론과 연결됨."}, {"term": "Three-coloring problem", "why_emerged": "가고메 격자의 기하학적 제약 조건 하에서 바닥 상태 스핀 배열을 수학적으로 매핑하기 위해 사용됨.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "기하학적 좌절 문제, 통계 역학의 vertex 모델과 연결됨."}], "english_summary": ["Analyzed the phase-space network of kagome Heisenberg antiferromagnets using coplanar manifold mapping.", "Identified that weathervane loop hierarchies dictate the global geometry and connectivity of configuration space.", "Distinguished Gaussian and non-Gaussian spectral features based on loop update constraints.", "Provides a theoretical framework for understanding how local constraints shape emergent magnetic properties."]}}, {"title": "Strain Tuning of Orbital-Driven Giant Magnetoresistance in van der Waals ferrimagnet Mn3Si2Te6", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2608.03568", "authors": "Abdul Ahad, Miuko Tanaka, Shunta Aoki, et al.", "last_authors": "Jiang Pu, Toshiya Ideue", "summary": "Strain engineering of magnetotransport offers a powerful strategy for uncovering emergent electronic and domain phenomena in quantum magnetic materials, while providing a promising pathway toward next-generation mechanically programmable spintronic technologies. Van der Waals magnets are particularly attractive in this context because their high crystallinity and mechanical flexibility allow exceptionally large, precisely controllable strain, enabling access to strain-induced functionalities unattainable in conventional solids. Here, we report systematic strain control of the van der Waals magnet Mn$_3$Si$_2$Te$_6$, which exhibits an unconventional colossal magnetoresistance whose microscopic origin remains under debate. We demonstrate in situ large-strain modulation of the electrical resistance in bulk crystals and show that the effect can be consistently explained by s authors": "Matteo Carrega, Niccolo Traverso Ziani", "summary": "Nonreciprocal dissipationless transport has long been sought for applications in superconducting technologies. Recently, it has been implemented by the so-called superconducting diode effect. Such an effect arises from an imbalance in critical supercurrents flowing in opposite directions. In this work, we theoretically demonstrate how the superconducting diode effect emerges in the quantum spin Hall phase when brought into full proximity with a superconductor. We explore two regimes: large and narrow quantum wells. In the former geometry, we show that the superconducting diode effect can be externally controlled using both magnetic and electric fields, achieving unit efficiency. In the latter regime, where tunneling between opposite edges may occur, we propose a mechanism for an intrinsic superconducting diode effect driven by edge reconstruction, which does not require external magnetic fields. This phenomenon, which is related to the topological nature of the underlying system, represents one of the few examples of a superconducting diode effect in low dimensions enabled by spontaneous time-reversal symmetry breaking.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Relevant to topological superconductivity and quantum spin Hall systems.", "tags": ["superconduct", "quantumspinHall", "topological", "transport", "theory"], "image": "", "briefing": {"background": "초전도 다이오드 효과(Superconducting Diode Effect)는 특정 방향으로만 초전류가 흐르는 현상으로, 저전력 비대칭 소자 구현의 핵심 기술입니다.", "motivation": "양자 스핀 홀(QSH) 절연체와 초전도체의 근접 효과를 활용하여, 외부 자기장 없이도 자발적인 시간 반전 대칭 깨짐(TRSB)을 이용한 다이오드 효과를 이론적으로 설계하고자 함.", "result": "QSH 위상 절연체에서 자기장/전기장 제어를 통해 다이오드 효율을 100%까지 높일 수 있음을 증명함. 좁은 양자 우물에서는 에지 재구성을 통해 자발적인 다이오드 효과가 나타남을 제시함.", "implication": "위상학적 물질을 활용하여 외부 자성체 없이도 초전도 비대칭 소자를 만들 수 있는 가능성을 열었음.", "novelty": "단순한 이종접합을 넘어, QSH 에지 상태의 위상학적 특성을 다이오드 효과에 직접 결부시킨 이론적 설계를 제공함.", "unresolved": "실제 실험에서 에지 상태의 분리 및 제어의 어려움, 노이즈 및 온도의 영향은 여전히 측함.", "implication": "위상학적 밴드 구조가 자성 들뜸(magnon)과 상호작용할 수 있음을 보여주며, 위상 자성 물질의 응용 가능성을 제시함.", "novelty": "La 치환으로 Weyl 반금속상을 유도한 후, 마그논 갭을 실험적으로 확인하여 자성과 위상학적 성질의 결합을 보여준 사례임.", "unresolved": "마그논 갭 형성에 기여하는 정확한 위상학적 기여도와 자성체 간의 상호작용 메커니즘은 정량적 해석이 더 필요함.", "future_work": "RIXS(공명 비탄성 X선 산란)를 통한 마그논 분산 관계의 직접 측정 및 ARPES를 통한 Weyl 페르미 아크 관측.", "concepts": [{"term": "Weyl 반금속", "why_emerged": "위상학적으로 보호되는 비자명한 밴드 교차점(Weyl node)을 가진 물질을 찾기 위해 필요.", "origin": "초록 정보만으로는 특정하기 어려움 (일반적으로 이론은 Wan et al. 2011, 실험은 TaAs 계열).", "connections": "Berry curvature, Anomalous Hall Effect, 페르미 아크."}, {"term": "마그논 갭", "why_emerged": "자성 정렬 상태에서 들뜸에 에너지가 필요한 상태(gapped)를 설명하기 위함.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "자기 이방성, 스핀 파동, 위상 자성."}], "english_summary": ["Reports La-substituted EuBiTe3 as a topological Weyl semimetal.", "Observes the emergence of a magnon gap related to magnetic order in the system.", "Highlights the intersection of topological band structures and magnetic excitations.", "Provides experimental evidence for correlated magnon excitations in nontrivial systems."]}}, {"title": "Modification of charge and spin textures by light chemical substitution in Eu(Al1−xGax)4 (x=0.1)", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/6kwv-fh15", "authors": "Zétény Bacsó, Fellipe Carneiro, Kevin Allen, et al.", "last_authors": "Alessandro Bombardi, Roger D. Johnson", "summary": "We present the results of a resonant x-ray-diffraction experiment, resolving both charge and spin textures in the intermetallic topological magnet Eu ( Al 1 − x Ga x ) 4 ( x = 0.1). Below ≈ 75 K the system develops a charge-density wave (CDW) with propagation vector k CDW ≈ ( 0 , 0 , 0.18 ) . The CDW order parameter grows monotonically on cooling until ≈ 15 K, when a sudden decrease in the CDW amplitude occurs. Pairs of magnetic satellites of the (0, 0, 8) Bragg reflection corresponding to two distinct domains, k 1 = ( ± δ m , 0, 0), k 2 = (0, ± δ m , 0), δ m = 0.2002 ( 4 ) were studied at the Eu L 3 edge, appearing below T N = 14.8 K. Our measurement of T N is exactly coincident with the sudden drop in the CDW amplitude, which suggests strong coupling between the charge and spin orders, as observed in other compounds of the Eu ( Al 1 − x Ga x ) 4 series. Azimuthal measurements were consistent with a single helical spin arrangement having an elliptical envelope of μ Y / μ Z = 1.19(6) for the k 2 domain, and a tilted helical (helicoidal) spin arrangement for the k 1 domain, with μ Y / μ Z = 1.14(4) and μ X / μ Z = 0.20(2) that may be hidden for the k 2 domain due to multiple subdomains. Temperature evolution of the magnetic satellite intensities in linear and circularly polarized light found the respective ratio to be invariant with temperature, suggesting a single helicoidal magnetic phase throughout the measured temperature range. This behavior is unlike the x = 0 material, in which a spin-density wave forms first, transitioning to a helical ground state on cooling through intermediate phases. Future theoretical work on the Eu electronic ground state, supported by related experiments, will help understand the effects of Ga substitution on the evolution of the magnetic structure.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Resonant x-ray study of CDW and spin textures in a topological magnet.", "tags": ["material", "CDW", "topological"], "image": "", "briefing": {"background": "Eu(Al,Ga)4 화합물은 전하 밀도 파동(CDW)과 자기적 정렬이 공존하는 위상 자성체입니다. 이러한 물질들은 전하와 스핀 자유도 간의 강한 상관관계를 연구하는 데 중요한 플랫폼을 제공하며, 특히 위상적 특성이 자성 및 CDW와 어떻게 얽혀 있는지가 핵심 연구 주제입니다.", "motivation": "x=0.1로 Ga을 치환했을 때, 모물질(x=0)에서 관찰되는 복잡한 스핀 상태 변화와 CDW가 어떻게 변하는지 규명하고자 합니다.", "result": "Ga 치환이 CDW와 자기 정렬 사이의 강한 결합을 유도함을 확인했습니다. T_N(14.8K)에서 CDW 진폭이 급격히 감소하는 현상을 통해 두 질서 변수 간의 경쟁 및 결합을 입증했으며, 스핀 구조는 온도의 변화 없이 하나의 나선형(helicoidal) 상태로 고정됨을 보였습니다.", "implication": "Ga 치환이 시스템의 자기적 기저 상태를 단순화하고 CDW와의 결합을 직접적으로 조절할 수 있음을 시사합니다.", "novelty": "공명 X-선 회절을 통해 CDW와 자기 구조를 동시에 고분해능으로 분석했으며, Ga 치환이 스핀 위상 변화 과정을 단순화하여 제어 가능함을 보였다는 점이 특징입니다.", "unresolved": "Ga 치환에 따른 전자 상태의 구체적인 변화와, 이러한 치환이 어떻게 위상적 비자명성에 기여하는지는 여전히 상세 연구가 필요합니다.", "future_work": "Eu 기반 화합물의 전자 구조에 대한 이론적 계산과 더불어, 치환 정도에 따른 물성 진화 과정을 추적하는 추가 실험이 기대됩니다.", "concepts": [{"term": "Charge Density Wave (CDW)", "why_emerged": "금속 내 전자 밀도의 공간적 주기성이 자발적으로 깨지면서 형성되는 상태를 이해하기 위해 필요합니다.", "origin": "Peierls, 1955년 1차원 금속에 대해 제안.", "connections": "Kagome 금속, 층상 전이금속 칼코겐화물 등에서 전하 질서와 초전도성 간의 상호작용으로 연결됨."}, {"term": "Resonant X-ray Diffraction", "why_emerged": "특정 원소의 전자 상태에 민감하게 반응하여 자기 구조와 전하 구조를 분리하여 관찰하기 위해 개발되었습니다.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "ARPES와 함께 물질의 전자 구조 및 자기적 정렬을 밝히는 필수적인 분광학 도구로 활용됨."}], "english_summary": ["Eu(Al1-xGax)4 (x=0.1) exhibits coupled charge density wave and magnetic orders.", "A sudden decrease in CDW amplitude at T_N = 14.8 K indicates strong spin-charge coupling.", "Resonant X-ray diffraction reveals a stable helicoidal spin arrangement unlike the parent compound.", "Gallium substitution acts as a control parameter for the magnetic and electronic phase diagram."]}}, {"title": "Multiorbital character of the density wave in trilayer nickelate superconductors", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/znvc-8425", "authors": "Abhi Suthar, Vignesh Sundaramurthy, Matías Bejas, et al.", "last_authors": "Andrés Greco, Matthias Hepting", "summary": "Ruddlesden–Popper nickelates exhibit high-temperature superconductivity closely intertwined with charge and spin density waves. However, fundamental questions persist regarding the interplay between the associated density wave (DW) fluctuations and superconductivity, as well as the orbital character and symmetry underlying the DW instabilities. Here, we utilize polarized Raman scattering to investigate the phononic and electronic Raman responses of the trilayer nickelate La 4 Ni 3 O 10 across its concomitant charge and spin density wave transitions. In addition to distinct phonon anomalies occurring below the transition temperature, we observe a depletion of continuum spectral weight up to 114 meV and a pronounced peak centered at this energy. By combining momentum-selective information from polarized electronic Raman scattering with Raman-response model calculations based on a multiorbital Raman vertex in a reconstructed two-orbital DW state involving both Ni − 3 d x 2 − y 2 and Ni − 3 d z 2 orbitals, we identify 114 meV as the energy scale 2 Δ DW of the DW gap, characterized by incoherent opening and non-mean-field behavior. Furthermore, the model calculations reveal that the corresponding 2 Δ DW peak has a multiorbital origin, requiring both orbital contributions and their mixing beyond single-orbital projections, thus shedding light on the nature of the DW instabilities in La 4 Ni 3 O 10 .", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Unconventional superconductivity and density waves in nickelates are important for user.", "tags": ["unconventionalsuperconductivity", "CDW", "nickelate"], "image": "", "briefing": {"background": "Ruddlesden-Popper 니켈산염은 고온 초전도체 후보 물질로 주목받고 있으며, 전하 및 스핀 밀도 파동(DW)과 초전도성 사이의 상관관계가 핵심적인 미해결 과제입니다.", "motivation": "La4Ni3O10에서 나타나는 전하 및 스핀 밀도 파동의 오비탈 특성과 대칭성을 파악하여, 초전도 메커니즘과의 연관성을 이해하고자 합니다.", "result": "편광 라만 산란을 통해 114 meV 에너지 규모에서 밀도 파동 갭(2Δ_DW)을 관찰했습니다. 이 갭은 Ni-3d(x²-y²)와 Ni-3d(z²) 오비탈의 혼합에서 기인하는 다중 오비탈 특성을 가짐을 밝혀냈습니다.", "implication": "니켈산염의 밀도 파동은 단순한 단일 오비탈 현상이 아니라, 여러 오비탈이 얽힌 복합적인 기원을 가짐을 시사합니다.", "novelty": "라만 산란과 이론적 모델을 결합하여 니켈산염 내 DW의 오비탈 기원을 명확히 규명했으며, 이는 강상관 전자계에서 오비탈 자유도의 중요성을 강조합니다.", "unresolved": "이러한 DW 기원이 초전도 전이 온도 및 초전도 페어링 대칭성과 정확히 어떻게 연결되는지는 추가 연구가 필요합니다.", "future_work": "다른 도핑 수준이나 압력 조건에서 오비탈 혼합이 어떻게 변화하는지에 대한 연구가 필요합니다.", "concepts": [{"term": "Ruddlesden-Popper Nickelates", "why_emerged": "구리 산화물 초전도체와 유사한 구조적/전자적 특징을 가진 물질을 탐색하는 과정에서 부상했습니다.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "고온 초전도체 연구, 강상관 전자계, 페로브스카이트 구조와 연관됨."}, {"ter  결합의 상호작용을 연구하기 위한 표준적인 물질군으로, 페르미 면과 초전도 상태의 상관관계 규명이 중요합니다.", "motivation": "기존 연구에서 설명되지 않았던 YNi2B2C의 특정 페르미 면(β, ζ) 주파수와 전자-포논 결합 특성을 개선된 밴드 계산과 dHvA 실험으로 명확히 규명하고자 합니다.", "result": "향상된 밴드 구조 계산을 통해 기존에 풀리지 않았던 dHvA 주파수들의 기원을 페르미 면의 시트별(sheet-dependent) 전자-포논 결합으로 규명하였습니다.", "implication": "초전도체 내의 전자-포논 결합이 페르미 면의 특정 위치에서 선택적으로 강하게 작용함을 보여주어, 비등방성 초전도 메커니즘 이해에 기여합니다.", "novelty": "정밀한 dHvA 실험과 이론적 밴드 계산을 결합하여, 물질의 전자 구조와 초전도성 간의 미세한 상관관계를 실험적으로 입증했습니다.", "unresolved": "이러한 시트별 결합 강도가 초전도 갭의 비등방성으로 직접 연결되는 방식에 대한 정밀한 분광학적 분석이 필요합니다.", "future_work": "고해상도 ARPES를 이용한 특정 시트에서의 갭 비등방성 직접 측정.", "concepts": [{"term": "dHvA 진동", "why_emerged": "강한 자기장 하에서 페르미 면의 단면적과 진동 주파수 사이의 관계를 통해 페르미 면의 모양을 실험적으로 결정하기 위해 필요함.", "origin": "Willem de Haas, Pieter van Alphen (1930년).", "connections": "페르미 면, 란다우 준위, 전자 구조."}, {"term": "전자-포논 결합", "why_emerged": "BCS 이론에서 금속 내 전자가 포논 매개로 쌍을 이루는 기작을 설명하기 위해 필요함.", "origin": "Bardeen, Cooper, Schrieffer (BCS 이론, 1957년).", "connections": "초전도성, 포논 스펙트럼, 밴드 구조."}], "english_summary": ["Performs dHvA measurements and refined band calculations for YNi2B2C.", "Identifies the origins of previously inexplicable Fermi surface sheets (β and ζ).", "Confirms sheet-dependent electron-phonon coupling in the superconducting state.", "Advances the understanding of anisotropic electron-phonon interactions in borocarbide superconductors."]}}, {"title": "Step geometry–guided growth of rhombohedral graphene", "journal": "Science", "source": "Gemini", "link": "https://doi.org/10.1126/science.aed9202", "authors": "Mengze Zhao, Zhibin Zhang, Xin Sui, et al.", "last_authors": "Xiaobo Lu, Kaihui Liu", "summary": "Rhombohedral (ABC)–stacked graphene has emerged as a platform for exploring correlated and topological physics. However, its large-scale, pure-phase synthesis has been hindered by intrinsic thermodynamic metastability and kinetic instability. In this work, we introduce a step geometry–guided epitaxial strategy to deterministically control interlayer slip, enabling the synthesis of pure-phase rhombohedral graphene. Using this approach, we obtained pure (phase purity > 99%) rhombohedral graphene with an area reaching 160 micrometers by 80 micrometers and thickness ranging from ~15 layers to ~120 nanometers. The resulting samples establish the first comprehensive reference dataset of Raman fingerprints and intrinsic band structures from few-layer films to ~200-layer bulk. Electronic transport measurements reveal a layer-antiferromagnetic state and the quantum anomalous Hall effect, enabling scalable exploration of next-generation quantum science and technology applications.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Synthesizes rhombohedral graphene showing correlated physics and quantum anomalous Hall effect.", "tags": ["graphene", "transport", "correlated-physics", "topological-matter"], "image": "", "briefing": {"background": "그래핀은 적층 구조(Bernal vs. Rhombohedral)에 따라 전자 구조가 완전히 달라집니다. 특히 능면체(ABC) 적층 그래핀은 표면 상태의 평탄한 밴드(flat band) 특성 덕분에 강한 상관관계 및 위상학적 물성 연구의 핵심 플랫폼으로 주목받아 왔습니다.", "motivation": "기존의 기계적 박리나 무작위 증착으로는 대면적의 순수한 ABC 적층 그래핀을 얻기 어려웠으며, 이로 인해 체계적인 물성 연구에 한계가 있었습니다.", "result": "계단 구조를 이용한 에피택셜 성장 전략을 통해 99% 이상의 순도를 가진 대면적 ABC 적층 그래핀을 합성했습니다. 이를 통해 층간 반강자성 상태와 양자 변칙 홀 효과(QAHE)를 성공적으로 관측했습니다.", "implication": "고품질의 대면적 샘플이 확보됨으로써 강상관계 물성 및 위상학적 현상을 대규모 디바이스 수준에서 정밀하게 제어하고 활용할 수 있는 길이 열렸습니다.", "novelty": "기존의 층간 슬립 제어 한계를 극복하여 순수 ABC상 그래핀을 대면적으로 구현했으며, 이는 향후 위상학적 양자 소자 연구에 중요한 토대가 될 것입니다.", "unresolved": "매우 두꺼운 층에서의 구체적인 상관관계 기작과 층 수에 따른 정확한 QAHE 위상 변화의 경계 조건이 여전히 과제로 남아 있습니다.", "future_work": "다양한 층수의 샘플에서 나타나는 강상관계 전이 현상을 상세히 매핑하고, 이를 활용한 차세대 위상학적 전자 소자 응용 연구가 기대됩니다.", "concepts": [{"term": "ABC-stacking", "why_emerged": "그래핀 층간 적층 순서에 따른 전자 밴드 구조의 변화를 연구하기 위해 필요함", "origin": "그래핀 물성 연구 초기에 적층 구조 차이로 명명됨", "connections": "Bernal(AB) 적층과 대조되며 평탄한 밴드 형성에 핵심적"}, {"term": "Quantum Anomalous Hall Effect (QAHE)", "why_emerged": "자기장 없이도 위상학적 절연체 특성을 구현하기 위해 필요함", "origin": "Haldane 모델(1988)에 의해 이론적 기초 확립", "connections": "위상학적 자성 물질 및 베리 곡률과 밀접한 연관"}], "english_summary": ["Achieved large-scale synthesis of pure-phase rhombohedral (ABC) stacked graphene using step-guided epitaxy.", "Demonstrated 99% phase purity with samples spanning from few-layer to thick bulk.", "Confirmed layer-antiferromagnetic states and quantum anomalous Hall effect in the synthesized films.", "Provides a scalable platform for exploring correlated and topological physics in graphene."]}}, {"title": "Toward an exact quantum many-body treatment of Kondo correlation in magnetic impurities", "journal": "Science", "source": "Gemini", "link": "https://doi.org/10.1126/science.adq7402", "authors": "Tianyu Zhu, Linqing Peng, Huanchen Zhai, Zhi-Hao Cui, Runze Chi, Garnet Kin-Lic Chan", "last_authors": "Runze Chi, Garnet Kin-Lic Chan", "summary": "The Kondo effect is a prototypical quantum phenomenon arising from the interaction between localized electrons in a magnetic impurity and itinerant electrons in a metallic host. Although this phenomenon has served as the testing ground for quantum many-body methods for decades, the precise description of Kondo physics with material specificity remains challenging. Here, we present a systematic ab initio approach to converge toward an exact zero-temperature electronic treatment of Kondo correlations. Across a series of 3d transition metals, we extracted Kondo temperatures matching subtle experimental trends, with accuracy exceeding that of standard models. We further obtained microscopic insight into the origin of these trends. More broadly, we demonstrate the possibility to start from fully ab initio many-body simulations and push toward the realm of converged predictions.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Ab initio quantum many-body treatment of Kondo effect in magnetic impurities, relevant to correlated materials.", "tags": ["theory", "stronglycorrelatedelectrons", "Kondoeffect", "abinitio", "magneticmaterials"], "image": "", "briefing": {"background": "콘도 효과(Kondo effect)는 금속 호스트 내의 자성 불순물이 전도 전자와 상호작용하여 저온에서 전기저항이 증가하는 현상입니다. 이는 강상관계 물질 및 불순물 물리학의 기본 모델입니다.", "motivation": "기존 모델들은 특정 재료의 상세한 전자 구조를 반영하는 데 한계가 있어, 실제 재료에서의 콘도 현상을 정밀하게 예측하기 위한 고차원적인 ab initio 방법론이 필요했습니다.", "result": "3d 전이 금속 불순물 시스템에 대해 콘도 온도를 정확하게 예측할 수 있는 ab initio 다체 이론 기법을 개발했습니다.", "implication": "실험적인 콘도 온도 경향을 이론적으로 정밀하게 재현함으로써, 복잡한 강상관계 재료의 전자 구조 해석에 강력한 이론적 도구를 제공합니다.", "novelty": "전통적인 모델 의존성을 탈피하여, 실제 재료의 다체 상호작용을 시작부터(ab initio) 정밀하게 다룰 수 있는 가능성을 입증했습니다.", "unresolved": "더 복잡한 고차원 격자 구조나 다중 불순물 시스템에서의 계산 비용 및 수렴 정밀도가 여전히 숙제입니다.", "future_work": "이 방법론을 복잡한 강상관계 산화물이나 다중 불순물 시스템으로 확장하여 재료 설계에 활용할 것으로 보입니다.", "concepts": [{"term": "Kondo effect", "why_emerged": "금속 내 자성 불순물의 기묘한 저온 저항 거동을 설명하기 위해 필요함", "origin": "Jun Kondo (1964)", "connections": "안데르송 불순물 모델, 페르미 액체 이론과 연결됨"}, {"term": "Ab initio many-body treatment", "why_emerged": "모델 파라미터 가정 없이 실제 재료의 전자 상관관계를 예측하기 위해 필요함", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "DFT+DMFT와 같은 기존의 방법론적 도구들과 궤를 같이함"}], "english_summary": ["Introduced a systematic ab initio approach for exact zero-temperature Kondo correlation treatment.", "Successfully predicted Kondo temperatures for 3d transition metals matching experimental data.", "Provided microscopic insights into the origin of Kondo trends beyond standard model approximations.", "Demonstrates high-accuracy, material-specific quantum many-body simulations."]}}, {"title": "Dynamic twisting and imaging of moiré crystals", "journal": "Science_Advances", "source": "Gemini", "link": "https://doi.org/10.1126/sciadv.aeg5362", "authors": "Qixuan Zhang, Lingyuan Lyu, Sneh Pancholi, et al.", "last_authors": "Daniel E. Parker, Monica T. Allen", "summary": "Moiré superlattices in stacked two-dimensional crystals are powerful platforms for engineering correlated and topological quantum phases, with twisted graphene and transition metal dichalcogenides as prominent examples. Their angle-sensitive band structures enable rich tunability; however, conventional tear-and-stack methods fix the angle at assembly, limiting systematic exploration of angle-dependent phenomena. Here, we present a scanning probe–based manipulation scheme that enables in situ, continuous postfabrication twist control using nanostructured metal rotors. We demonstrate reproducible angle tuning and direct moiré imaging across three platforms: graphene, hexagonal boron nitride, and encapsulated, air-sensitive MoTe 2 . Quantitative piezoresponse force microscopy analysis confirms subdegree precision with minimal induced heterostrain, preserving sample quality even in the marginally twisted regime. Crucially, the device architecture maintains open access to the active region, allowing optical, scanning probe, and transport measurements. This work enables single-device mapping of the angular phase diagram of moiré material including the minimally twisted regime.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Scanning probe technique for in situ twist control in moir materials like MoTe2.", "tags": ["method", "moir", "twistedbilayer", "MoTe2"], "image": "", "briefing": {"background": "적층된 2차원 결정(Moire superlattices)은 층간 뒤틀림 각도(twist angle)에 따라 평탄한 밴드와 강상관계 물성이 극적으로 변화하는 시스템입니다.", "motivation": "기존의 테어-앤-스택(tear-and-stack) 방식은 제작 후 각도 수정이 불가능하여, 단일 샘플에서 연속적인 각도 변화에 따른 물성 변화를 관측하기가 매우 어렵습니다.", "result": "나노 구조 금속 로터를 이용한 주사 탐침 기반의 '인시츄(in situ) 각도 제어' 기술을 개발하여 MoTe2 등을 포함한 여러 시스템에서 각도를 정밀하게 조절하는 데 성공했습니다.", "implication": "단일 디바이스 내에서 각도를 연속적으로 변경하며 물성 지도를 작성할 수 있어, 위상학적 및 강상관계 물성 연구의 효율성을 획기적으로 높입니다.", "novelty": "제작 후 물리적 각도 제어가 가능하다는 점에서, 각도에 민감한 상관관계 현상을 연구하는 연구자들에게 매우 유용한 새로운 도구입니다.", "unresolved": "매우 큰 면적에서의 균일한 뒤틀림 유지와 나노 로터로 인한 국부적인 스트레인 영향이 완벽히 제거되었는지는 추가 검증이 필요합니다.", "future_work": "이 기술을 극저온 환경이나 강한 자기장 환경으로 확장하여, 위상학적 전이의 각도 의존성을 정밀하게 탐구할 것으로 예상됩니다.", "concepts": [{"term": "Moiré superlattice", "why_emerged": "두 2차원 물질의 주기성 차이를 이용하여 인위적으로 밴드 구조를 변조하기 위해 필요함", "origin": "그래핀 트위스트 연구(2018) 이후 본격화", "connections": "Twisted bilayer graphene, flat band engineering"}, {"term": "In situ twist control", "why_emerged": "각도 변화에 따른 물리적 위상 전이를 효율적으로 추적하기 위해 필요함", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "Scanning probe microscopy, micro-manipulation"}], "english_summary": ["Developed a scanning probe–based technique for in situ, post-fabrication twist angle control.", "Demonstrated precise, sub-degree angular tuning in graphene, hBN, and MoTe2 samples.", "Maintained sample quality and device accessibility for simultaneous multi-modal measurements.", "Enables mapping of angular phase diagrams within a single device."]}}, {"title": "A table-top few-femtosecond broadband extreme-ultraviolet absorption spectrometer with cryogenic cooling", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2608.03955", "authors": "Sheng-Chih Lin, Alfred Zong, Emma Berger, et al.", "last_authors": "Jackson McClellan, Michael W. Zuerch", "summary": "We present a table-top cryogenic ultrafast broadband XUV absorption spectroscopy (c-UBXAS) beamline designed for temperature-dependent and time-resolved investigations of quantum materials. The instrument combines a broadband high-harmonic generation source spanning 22-73 eV with automated image registration and cryogenic sample control down to 20 K, enabling element-specific measurements under both equilibrium and nonequilibrium conditions. The beamline provides sub-50-meV energy resolution and a sub-10-fs instrument response function, while maintaining long-term stability suitable for extended, ultrasensitive measurements. Benchmark experiments on NiI$_2$, a van der Waals multiferroic, reveal temperature-dependent spectral evolution across its magnetic phase transitions, demonstrating the ability to identify element-specific contributions to the ground state and its transient response in the femtosecond regime. This instrument introduces the opportunity to unravel the very first response of a solid-state materi
