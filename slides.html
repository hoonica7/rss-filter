miconductor", "journal": "Science_Advances", "source": "Gemini", "link": "https://doi.org/10.1126/sciadv.aeb0659", "authors": "Qi Zhang, Mithun Ghosh, Yaroslav Zhumagulov, et al.", "last_authors": "Zdeněk Sofer, Ahmet Avsar", "summary": "Dilute magnetic semiconductors (DMSs) provide a platform for electrically controlling spin interactions; however, conventional systems face limited gate tunability and structural disorder. Here, we demonstrate gate-switchable magnetism in air-stable, dilute Fe-doped PtSe 2 , a two-dimensional (2D) DMS that remains structurally homogeneous down to the atomically thin limit. Bulk crystals exhibit ferromagnetism with a Curie temperature of 320 kelvin, and this coupling persists in metallic devices down to seven layers. As thickness and carrier concentration further decrease, the system transitions to antiferromagnetic order, with a gate-tunable Néel temperature reaching 105 kelvin in five-layer semiconducting devices. Our first-principles calculations reveal a carrier-density–dependent crossover from Ruderman-Kittel-Kasuya-Yosida–mediated ferromagnetism to superexchange-driven antiferromagnetism. These findings demonstrate how induced magnetic order evolves from bulk to the 2D limit, providing a pathway to functional spintronic devices with electrically controlled magnetic states.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Demonstrates gate-switchable magnetism in a 2D semiconductor, relevant to spintronics and quantum materials.", "tags": ["2Dmaterials", "magnetism", "spintronics", "semiconductor", "DFT"], "image": "", "briefing": {"background": "희석 자기 반도체(DMS)는 전하 운반자 농도를 조절해 자성을 제어할 수 있어 스핀트로닉스 분야의 핵심 플랫폼으로 연구되어 왔습니다. 그러나 기존 재료들은 구조적 무질서와 낮은 게이트 제어 효율이라는 한계가 있었습니다.", "motivation": "대기 중에서 안정적이고 원자 수준으로 얇은 두께까지 구조적 균질성을 유지하는 2D DMS 시스템을 통해, 차세대 스핀트로닉 소자를 위한 전기적 자성 제어 가능성을 입증하고자 했습니다.", "result": "Fe가 도핑된 PtSe2에서 두께와 캐리어 농도에 따라 강자성과 반강자성 상태 사이의 전이가 발생함을 규명했습니다. 특히 박막 소자에서 게이트 전압을 통해 Néel 온도를 최대 105K까지 제어할 수 있음을 확인했습니다.", "implication": "RKKY 상호작용과 초교환 상호작용 사이의 경쟁을 통해 캐리어 밀도로 자성 상태를 스위칭할 수 있음을 보여주며, 이는 전기적으로 제어 가능한 2D 자성 소자의 가능성을 제시합니다.", "novelty": "벌크에서 2D 극한까지 자성 질서의 진화를 추적했으며, 특히 공기 중 안정성이 확보된 시스템에서 게이트를 이용한 자성 위상 제어를 시연했다는 점이 중요합니다.", "unresolved": "반강자성 상태에서 외부 게이트 제어 시 자성 도메인 구조의 구체적인 공간적 변화나 비평형 상태에서의 동역학은 추가 연구가 필요합니다.", "future_work": "Fe 도핑 농도 최적화를 통한 상온 소자 구현 및 이러한 전기적 자성 스위칭을 활용한 논리 소자(logic device) 개발 연구가 예상됩니다.", "concepts": [{"term": "희석 자기 반도체 (DMS)", "why_emerged": "반도체의 전하 제어 기술과 자성체의 스핀 제어 기술을 통합하기 위해 도입됨.", "origin": "1980년대 Furdyna 등의 연구에 의해 확립됨.", "connections": "스핀트로닉스, 베리 곡률, 비정상 홀 효과 관련 연구와 밀접함."}, {"term": "RKKY 상호작용", "why_emerged": "금속 내 전도 전자들이 국소 자기 모멘트 간의 교환 상호작용을 매개하는 현상을 설명하기 위해 필요함.", "origin": "Ruderman, Kittel, Kasuya, Yosida에 의해 제안됨.", "connections": "자기적 질서, 근접 효과, 전하 밀도 파(CDW) 연구와 연결됨."}], "english_summary": ["Fe-doped PtSe2 is demonstrated as an air-stable 2D dilute magnetic semiconductor.", "Gate-tunable magnetic transition between ferromagnetism and antiferromagnetism is achieved.", "The transition is driven by carrier-density dependent crossover from RKKY to superexchange interactions.", "This system provides a practical platform for electrical control of magnetism in spintronics."]}}, {"title": "Real-space imaging of moiré-confined excitons in twisted bilayer MoS2", "journal": "Nature_Physics", "source": "Gemini", "link": "https://www.nature.com/articles/s41567-026-03425-x", "authors": "Laurens J. M. Westenberg, Lumen Eek, Jort D. Verbakel, et al.", "last_authors": "Cristiane Morais Smith, Pantelis Bampoulis", "summary": "Moiré excitons have been widely observed in twisted two-dimensional semiconductors but have not been directly imaged at room temperature. Now, this is achieved using photocurrent atomic force microscopy.", "tier": "B_IMPORTANT_CONDMAT", "score": "7", "reason": "Relevant experimental study on twisted bilayer van der Waals materials.", "tags": ["experiment", "MoS2", "moire"], "image": "https://media.springernature.com/m685/springer-static/image/art%3A10.1038%2Fs41567-026-03425-x/MediaObjects/41567_2026_3425_Fig1_HTML.png", "briefing": {"background": "반데르발스 물질을 비틀어 쌓으면 생기는 모아레 초격자는 밴드 구조를 변형하고 상관관계가 강한 전자 상태를 유도합니다. 이 안에서 형성되는 엑시톤은 독특한 공간적 구속 특성을 가집니다.", "motivation": "모아레 초격자 내에서 발생하는 엑시톤의 공간적 거동을 실시간으로 시각화하여, 이론적으로 예측된 모아레 퍼텐셜에 의한 엑시톤 구속 현상을 직접 확인하고자 했습니다.", "result": "광전류 원자간력 현미경(PC-AFM)을 이용하여 상온에서도 모아레 패턴에 구속된 엑시톤을 실공간에서 직접 이미지화하는 데 성공했습니다.", "implication": "모아레 물질의 광학적 물성을 나노 스케일에서 정밀하게 이해할 수 있게 되었으며, 엑시톤 기반 광소자 설계의 기초를 제공합니다.", "novelty": "이전까지 저온에서 주로 관측되던 모아레 엑시톤을 상온에서 직접 시각화했다는 점이 물리적 분석의 새로운 돌파구가 될 것입니다.", "unresolved": "모아레 퍼텐셜의 국소적인 결함이 엑시톤 구속에 미치는 영향이나, 층간 비틀림 각도에 따른 엑시톤 동역학의 구체적 세부 사항은 여전히 탐구가 필요합니다.", "future_work": "다른 이종접합(heterostructure) 시스템에서의 모아레 엑시톤 거동 분석 및 엑시톤-폴라리톤 제어 연구로 이어질 것입니다.", "concepts": [{"term": "모아레 엑시톤", "why_emerged": "비틀린 2D 층에서 형성되는 주기적 퍼텐셜이 엑시톤의 파동함수를 국소화시키면서 등장함.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "전이금속 디칼코게나이드(TMD), 모아레 초격자, 상관관계가 강한 2D 계와 연결됨."}, {"term": "광전류 원자간력 현미경", "why_emerged": "국소적인 빛 흡수 및 광전하 생성을 나노미터 단위에서 시각화하기 위해 개발됨.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "주사 탐침 현미경(SPM), 광전자 분광법(ARPES)과 상보적인 나노 분석 기술."}], "english_summary": ["Direct spatial imaging of moiré-confined excitons in twisted MoS2 bilayer.", "Achieved using photocurrent atomic force microscopy at room temperature.", "Provides experimental evidence for exciton trapping by the moiré potential.", "Advances the understanding of light-matter interaction in moiré van der Waals materials."]}}, {"title": "Coexistence of strong spin fluctuations and partial ordering in the buckled honeycomb lattice system Nd2Te4O11", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/1k4t-954p", "authors": "Manshi Rani, J. M. Wilkinson, G. B. G. Stenning, and K. Mukherjee", "last_authors": "Manshi Rani, J. M. Wilkinson, G. B. G. Stenning, and K. Mukherjee", "summary": "Frustration-driven quantum fluctuations, along with spin-orbit coupling and crystal electric field can give rise to exotic magnetic phenomena in rare-earth based quantum magnets. Here, we report the magnetic ground state properties of a buckled honeycomb lattice system, ${\\mathrm{Nd}}_{2}{\\mathrm{Te…", "tier": "B_IMPORTANT_CONDMAT", "score": "7", "reason": "Study of a quantum magnet on a frustrated lattice, relevant to the user's broader interest in magnetism.", "tags": ["experiment", "quantummagnet", "honeycomblattice"], "image": "", "briefing": {"background": "기하학적 좌절(frustration)이 존재하는 격자 구조는 스핀이 정렬되지 못하게 방해하여 양자 액체 상태나 복잡한 자기적 위상을 유도합니다. 특히 벌집 격자에서의 자기적 거동은 응집물질 물리학의 주요 연구 주제입니다.", "motivation": "Nd2Te4O11과 같은 구부러진 벌집 격자 시스템에서 스핀-궤도 결합과 결정 전기장이 어우러져 나타나는 자기적 기저 상태의 특성을 규명하고자 했습니다.", "result": "이 화합물에서 강한 스핀 요동과 부분적인 자기 질서가 공존함을 확인했습니다.", "implication": "기하학적 좌절과 스핀-궤도 결합이 경쟁하는 양자 자기체 시스템에 대한 이해를 넓히며, Nd 기반 희토류 자성체의 새로운 물성을 제시합니다.", "novelty": "벌집 격자라는 기하학적 특징과 Nd의 스핀-궤도 결합 특성이 결합된 독특한 자기적 거동을 실험적으로 보고했다는 점이 가치 있습니다.", "unresolved": "부분적인 자기 질서의 정확한 대칭성 깨짐 여부나, 스핀 요동이 양자 스핀 액체 상태와 연결되는지에 대한 명확한 결론은 아직 부족합니다.", "future_work": "중성자 산란 실험을 통한 스핀 동역학 분석 및 저온 열용량 측정을 통한 양자 상태 검증이 뒤따라야 할 것입니다.", "concepts": [{"term": "기하학적 좌절", "why_emerged": "격자 구조상 모든 스핀 간의 교환 상호작용을 동시에 만족시킬 수 없는 상태를 설명하기 위해 도입됨.", "origin": "G. H. Wannier(1950) 등의 연구가 시초.", "connections": "양자 스핀 액체, 카고메 격자, Nd계 희토류 화합물과 연결됨."}, {"term": "벌집 격자", "why_emerged": "그래핀과 같은 2차원 위상 절연체나 양자 자성체를 연구하는 기본적인 대칭 구조로 필요함.", "origin": "고체물리학의 기본 격자 모델.", "connections": "디락 준금속, Kitaev 모델, 자기 위상 절연체와 연결됨."}], "english_summary": ["Investigation of magnetic properties in the buckled honeycomb lattice Nd2Te4O11.", "Evidence of coexistence between strong spin fluctuations and partial magnetic ordering.", "Highlights the role of frustration, spin-orbit coupling, and crystal electric fields.", "Contributes to the broader study of frustrated quantum magnets."]}}, {"title": "Competition and coexistence of superconductivity and nematic order in a two-dimensional electron gas with quadrupolar interactions", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/93xz-rklx", "authors": "Nei Lopes, Guilherme da Silva do Vale, Daniel G. Barci", "last_authors": "Guilherme da Silva do Vale, Daniel G. Barci", "summary": "We investigate the interplay between superconductivity and nematic order in a two-dimensional electron gas with competing pairing and quadrupolar forward-scattering interactions. The model includes both $s$-wave and $d$-wave superconducting channels. We compute the mean-field free energy density and…", "tier": "B_IMPORTANT_CONDMAT", "score": "7", "reason": "Theoretically investigates the interplay of nematicity and superconductivity, core themes for the user's projects.", "tags": ["theory", "nematicity", "superconductivity"], "image": "", "briefing": {"background": "강상관계 물질에서 네마틱 질서(nematic order)와 초전도성의 경쟁 및 공존은 전자 구조와 대칭성 붕괴 사이의 근본적인 연결 고리를 이해하는 핵심 주제입니다.", "motivation": "2차원 전자 가스 모델에서 사중극자 상호작용(quadrupolar interaction)이 존재할 때, s-파 및 d-파 초전도 채널과 네마틱 질서가 어떻게 상호작용하고 경쟁하는지 이론적으로 규명하고자 함.", "result": "평균장 이론을 통해 두 질서가 특정 조건에서 경쟁하거나 공존할 수 있는 상 다이어그램을 도출함.", "implication": "네마틱 질서가 초전도 쌍 형성 기작에 직접적인 영향을 미칠 수 있음을 시사하며, 이는 철계 초전도체나 Kagome 금속 등에서 관찰되는 비전통적 물리 현상을 이해하는 기반이 됨.", "novelty": "이론적으로 네마틱 변동이 어떻게 초전도 대칭성을 선택하거나 억제하는지를 명확히 분리하여 모델링함.", "unresolved": "이 연구는 평균장 접근에 기반하고 있어 강한 요동(fluctuation) 효과를 완전히 반영하지 못할 가능성이 있음.", "future_work": "몬테카를로 시뮬레이션 등을 통해 양자 요동이 이 상들에 미치는 영향 분석 필요.", "concepts": [{"term": "네마틱 질서", "why_emerged": "회전 대칭성이 깨지지만 병진 대칭성은 유지되는 상태를 기술하기 위해 도입됨.", "origin": "액정 물리학에서 유래, 고체 물리학에서는 철계 초전도체 연구에서 본격화됨.", "connections": "전자 네마틱성, 구조적 상전이, 강상관계."}, {"term": "사중극자 상호작용", "why_emerged": "궤도 자유도가 있는 강상관계 물질에서 입자 간의 비등방성 결합을 설명하기 위해 사용됨.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "궤도 물리학, 다극자 상호작용."}], "english_summary": ["Investigates the interplay between nematic order and superconductivity in 2D systems.", "Uses a model with quadrupolar interactions to analyze s-wave and d-wave channels.", "Provides mean-field results for the competition and coexistence of these orders.", "Offers insights relevant to understanding unconventional superconducting mechanisms."]}}, {"title": "Interaction-driven charge textures and unconventional superconductivity in strained monolayer graphene", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/q528-6vj2", "authors": "Elias Andrade, Alejandro Jimeno-Pozo, Pierre A. Pantaleón, Francisco Guinea, Gerardo G. Naumis", "last_authors": "Francisco Guinea, Gerardo G. Naumis", "summary": "Two-dimensional systems with flat bands support correlated phases such as superconductivity. While twisted moiré systems, like twisted bilayer graphene, have revealed such states, they remain complex to control. Here, we study monolayer graphene under uniaxial periodic strain, which forms a quasi-on…", "tier": "B_IMPORTANT_CONDMAT", "score": "7", "reason": "Relates to graphene, moire-like systems, and unconventional superconductivity in a quasi-1D context.", "tags": ["theory", "graphene", "superconductivity"], "image": "", "briefing": {"background": "평탄 띠(flat band)를 가진 시스템은 전자 간 상호작용이 증폭되어 초전도성을 비롯한 비전통적 양자 상태가 발현하기 매우 유리한 환경을 제공합니다.", "motivation": "트위스트 무아레 시스템은 제어가 어렵다는 한계가 있어, 비교적 제어가 용이한 단층 그래핀의 주기적 변형(strain)을 통해 유사한 물리적 효과를 유도하고자 함.", "result": "단층 그래핀에 주기적 일축 변형을 가함으로써 1차원적인 준-주기적 구조를 형성하고, 여기서 전하 텍스처와 초전도성이 유도될 수 있음을 확인함.", "implication": "복잡한 트위스트 공정 없이도 변형 공학(strain engineering)만으로 평탄 띠를 조절하여 강상관계 물성을 연구할 수 있는 가능성을 제시함.", "novelty": "그래핀의 변형을 통해 1차원적 성질을 인위적으로 유도함으로써, quasi-1D 물리와 초전도성의 연관성을 탐구함.", "unresolved": "실제 실험적 구현에서 이러한 미세한 주기적 변형을 균일하게 가하는 것은 기술적으로 매우 난해함.", "future_work": "STM을 통한 국부적인 상태 밀도(LDOS) 변화 관찰 및 초전도 임계 온도 측정 실험이 필요함.", "concepts": [{"term": "평탄 띠", "why_emerged": "전자 속도가 거의 0에 가까워 상호작용 에너지가 운동 에너지보다 지배적인 상태를 기술하기 위해 필요함.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "모아레 격자, 강상관계, 분수 양자 홀 효과."}, {"term": "변형 공학", "why_emerged": "물질의 격자 구조를 인위적으로 왜곡하여 밴드 구조를 제어하기 위 nsport coefficient exhibits a distinctive d -wave dependence on the polarization angle, reversing sign under orthogonal rotation and vanishing at symmetry-restoring directions. Our findings show a path to all-optical regulation of topological and caloritronic responses beyond traditional magnetic systems and establish thermal transport as a sensitive probe of altermagnetic order.", "tier": "B_IMPORTANT_CONDMAT", "score": "7", "reason": "Addresses altermagnetism and Floquet engineering, both identified as important topics for the user.", "tags": ["theory", "altermagnetism", "Floquet"], "image": "", "briefing": {"background": "알터마그네틱(Altermagnetism)은 전통적인 강자성이나 반강자성과는 다른 새로운 자기 질서로, 스핀이 정렬되어 있으면서도 결정 대칭성에 의해 자화가 상쇄되는 특징을 가집니다. 이를 통해 고전적인 반강자성체가 가질 수 없었던 특이한 전자 구조와 수송 현상을 구현하는 것이 응집물질물리학의 주요 연구 주제 중 하나입니다.", "motivation": "본 연구는 2차원 d-파 알터마그네틱 위상 절연체에 선편광된 빛을 가해 '플로케(Floquet) 공학'을 적용함으로써, 빛을 이용해 시스템의 위상적 상태를 동적으로 제어하고 그에 따른 열전도 및 수송 특성을 규명하고자 했습니다.", "result": "선편광된 빛이 알터마그네틱 시스템의 스핀 섹터 간 대칭성을 깨뜨려, 양자 스핀 홀 상태에서 스핀 편극된 천 절연체(Chern insulator) 상태를 거쳐 자명한 상태로 변화하는 위상 전이를 유도함을 보였습니다. 또한, 이상 홀 효과 및 열 홀 효과가 양자화됨을 확인했습니다.", "implication": "알터마그네틱 물질에서 빛을 이용해 위상적 상태를 직접 제어하고 칼로리트로닉(caloritronic) 반응을 조절할 수 있는 가능성을 제시합니다. 이는 미래의 위상 양자 소자 및 광학적 제어 기술 개발에 중요한 이론적 근거가 됩니다.", "novelty": "기존 반강자성체와 달리 빛의 편광 방향에 따라 위상적 특성이 민감하게 반응하는 'd-파 알터마그네틱'의 독특한 응답을 이론적으로 도출했으며, 이는 사용자가 관심 있는 Floquet 공학 및 자기 위상 물질 연구와 직접적으로 맞닿아 있습니다.", "unresolved": "이론적인 고주파 유효 해밀토니안 분석에 기초하고 있어, 실제 물질에서의 광학적 손실, 격자 진동과의 상호작용 및 비평형 상태의 안정성이 구체적인 실험 조건에서 어떻게 나타날지는 미지수입니다.", "future_work": "실제 알터마그네틱 후보 물질에서의 초고속 분광학(time-resolved ARPES) 실험을 통한 위상 전이 관측과, 해당 효과가 실제 물질의 전자-격자 결합 환경에서 얼마나 강하게 보존되는지에 대한 후속 연구가 필요합니다.", "concepts": [{"term": "알터마그네틱(Altermagnetism)", "why_emerged": "기존의 강자성/반강자성 분류로 설명되지 않는, 스핀-궤도 결합 없이도 스핀 분리된 밴드 구조를 가지는 새로운 자기상을 정의하기 위해 도입됨.", "origin": "최근 2020년대 초반, 질구(Smejkal) 등 다수 연구진에 의해 체계적으로 정립됨.", "connections": "반강자성, 스핀-궤도 토크(SOT), Berry 곡률."}, {"term": "플로케 공학(Floquet Engineering)", "why_e     section.appendChild(textEl('h2', '', 'Concepts / Terms'));
    const concepts = document.createElement('div');
    concepts.className = 'concepts';
    b.concepts.forEach(c => {
      const item = document.createElement('div');
      item.className = 'concept';
      item.appendChild(textEl('h3', '', c.term || 'Concept'));
      [['왜 생겼나: ', c.why_emerged], ['누가 만들었나: ', c.origin], ['연결되는 흐름: ', c.connections]].forEach(([label, text]) => { if (!text) return; const p = document.createElement('p'); const bold = textEl('b', '', label); p.appendChild(bold); p.append(text); item.appendChild(p); });
      concepts.appendChild(item);
    });
    section.appendChild(concepts);
    briefing.appendChild(section);
  }
  if (b.english_summary && b.english_summary.length) { const section = document.createElement('section'); section.className = 'brief-section wide'; section.appendChild(textEl('h2', '', 'English Summary')); const ul = document.createElement('ul'); b.english_summary.slice(0, 5).forEach(line => ul.appendChild(textEl('li', '', line))); section.appendChild(ul); briefing.appendChild(section); }
  slideEl.appendChild(briefing);
  counterEl.textContent = `${index + 1} / ${slides.length}`;
  prevBtn.disabled = index === 0;
  nextBtn.disabled = index === slides.length - 1;
}
prevBtn.addEventListener('click', () => { index = Math.max(0, index - 1); render(); });
nextBtn.addEventListener('click', () => { index = Math.min(slides.length - 1, index + 1); render(); });
document.addEventListener('keydown', event => { if (event.key === 'ArrowLeft') prevBtn.click(); if (event.key === 'ArrowRight') nextBtn.click(); });
render();
</script>
</body>
</html>
