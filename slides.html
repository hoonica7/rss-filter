<title>Daily Paper Slideshow</title>
<style>
  :root {
    color-scheme: light;
    --bg: #f6f7f4;
    --paper: #ffffff;
    --ink: #111827;
    --muted: #64748b;
    --line: #d8ddd2;
    --accent: #176b87;
    --accent-2: #9a3412;
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; overflow: auto; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: var(--bg); color: var(--ink); }
  .shell { max-width: 1500px; min-height: 100vh; margin: 0 auto; padding: 14px 18px; display: flex; flex-direction: column; }
  .topbar { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 16px; }
  .top-actions { display: flex; align-items: center; gap: 10px; }
  .topbar a, button { border: 1px solid var(--line); border-radius: 8px; background: var(--paper); color: var(--ink); padding: 10px 14px; font-weight: 700; text-decoration: none; cursor: pointer; }
  button.primary { background: var(--accent); border-color: var(--accent); color: white; }
  button:disabled { opacity: 0.45; cursor: not-allowed; }
  .counter { color: var(--muted); font-weight: 700; }
  .slide { min-height: calc(100vh - 82px); background: var(--paper); border: 1px solid var(--line); border-radius: 10px; padding: 18px; box-shadow: 0 18px 42px rgba(15, 23, 42, 0.10); display: grid; grid-template-columns: minmax(310px, 0.86fr) minmax(0, 1.55fr); gap: 18px; overflow: visible; }
  .paper-head { min-width: 0; min-height: 0; overflow: visible; display: flex; flex-direction: column; gap: 12px; }
  .figure { margin: 0; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: #f8fafc; }
  .figure img { display: block; width: 100%; max-height: 41vh; object-fit: contain; background: white; }
  .figure figcaption { padding: 7px 10px; color: var(--muted); font-size: 12px; line-height: 1.3; }
  .head-text { display: flex; flex-direction: column; gap: 9px; min-width: 0; }
  .badges { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .badge { border-radius: 999px; padding: 5px 9px; background: #eef2ff; color: #3730a3; font-size: 12px; font-weight: 800; }
  .score { background: #fee2e2; color: #991b1b; }
  h1 { margin: 0; font-size: 25px; line-height: 1.15; letter-spacing: 0; overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
  h1 a { color: inherit; text-decoration-color: rgba(23, 107, 135, 0.35); text-decoration-thickness: 2px; text-underline-offset: 4px; }
  h1 a:hover { color: var(--accent); text-decoration-color: var(--accent); }
  .meta, .authors, .why, .abstract { font-size: 13px; line-height: 1.45; }
  .meta, .authors { color: var(--muted); }
  .why strong, .abstract strong, .authors strong { color: var(--ink); }
  .authors { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .why { border-left: 4px solid var(--accent-2); padding-left: 10px; color: #374151; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .abstract { border-top: 1px solid var(--line); padding-top: 14px; color: #374151; }
  .original-abstract { border-top: 1px solid var(--line); padding-top: 10px; color: #374151; font-size: 11.5px; line-height: 1.35; overflow-wrap: anywhere; }
  .original-abstract strong { display: block; margin-bottom: 4px; color: var(--ink); }
  .tags { display: flex; flex-wrap: wrap; gap: 8px; }
  .tag { border-radius: 999px; padding: 4px 8px; background: #f1f5f9; color: #475569; font-size: 12px; font-weight: 700; }
  .head-text > .link { display: none; }
  .briefing { min-width: 0; min-height: 0; overflow: visible; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); grid-auto-rows: minmax(0, auto); align-content: start; gap: 11px 18px; border-top: 0; padding-top: 0; }
  .brief-section { min-width: 0; }
  .brief-section.wide { grid-column: 1 / -1; }
  .brief-section h2 { margin: 0 0 4px; font-size: 14px; line-height: 1.22; color: #0f766e; letter-spacing: 0; }
  .brief-section p, .brief-section li { margin: 0; font-size: 12.5px; line-height: 1.42; color: #1f2937; overflow-wrap: anywhere; }
  .brief-section ul { margin: 0; padding-left: 20px; }
  .concepts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 9px 14px; }
  .concept { border-top: 1px solid var(--line); padding-top: 7px; }
  .concept h3 { margin: 0 0 4px; font-size: 13px; color: #7c2d12; letter-spacing: 0; }
  .concept p { margin: 2px 0 0; font-size: 11.5px; line-height: 1.35; color: #374151; overflow-wrap: anywhere; }
  .concept b { color: #111827; }
  .link { color: var(--accent); font-weight: 800; text-decoration: none; }
  .empty { padding: 48px; background: var(--paper); border: 1px solid var(--line); border-radius: 12px; color: var(--muted); }
  @media (max-width: 860px) {
    .shell { padding: 14px; }
    .topbar, .top-actions { align-items: stretch; flex-direction: column; }
    .slide, .briefing, .concepts { grid-template-columns: 1fr; }
    .slide { min-height: auto; overflow: visible; display: grid; }
    h1 { font-size: 28px; }
  }
</style>

<script>
const slides = [{"title": "Electronic Origin of Delicate Antiferromagnetism in FexNbS2", "journal": "PRL_Recent", "source": "author whitelist", "link": "http://link.aps.org/doi/10.1103/99yr-nqbx", "authors": "Wenxin Li, Jonathan T. Reichanadter, Shan Wu, et al.", "last_authors": "Jeffrey B. Neaton, Yu He", "summary": "Author(s): Wenxin Li, Jonathan T. Reichanadter, Shan Wu, Ji Seop Oh, Rourav Basak, Shannon C. Haley, Siqi Wang, Joshua E. Chaparro Mata, Elio Vescovo, Donghui Lu, Makoto Hashimoto, Christoph Klewe, Suchismita Sarker, Jessica L. McChesney, Alex Frañó, James G. Analytis, Robert J. Birgeneau, Jeffrey B. Neaton, and Yu He A combination of ARPES, XAS, and DFT shows a dramatic eV-scale electronic restructuring in Fe x NbS 2 , similar to what happens in correlated oxides, and suggests electronic correlations play a central role in the magnetism of Fe-intercalated transition-metal dichalcogenides. [Phys. Rev. Lett. 136, 216503] Published Wed May 27, 2026", "tier": "A_MUST_READ", "score": "10", "reason": "author whitelist: Donghui Lu", "tags": ["ARPES", "STS", "correlated", "ferromagnet", "antiferromagnet"], "image": "", "briefing": {"background": "Fe가 층간 삽입된 NbS2(Fe-TMD) 시스템은 삽입된 원자의 농도와 배열에 따라 자성과 전자 수송 특성이 극적으로 변하는 흥미로운 강상관 계열 재료입니다. 특히 반강자성(AFM) 상태에서의 전하 이동과 자성 기원 연구가 활발합니다.", "motivation": "Fe_xNbS2에서 관찰되는 미묘한 반강자성 특성이 단순한 밴드 충전(band filling) 효과인지, 아니면 전하 상관관계에 의한 전자 구조의 근본적인 재구성에서 기인하는지를 규명하고자 했습니다.", "result": "ARPES, XAS 및 DFT 계산을 결합하여 분석한 결과, Fe 삽입 시 단순 도핑을 넘어선 eV 단위의 거대한 전자 구조 재구성이 발생함을 확인했습니다. 이는 강상관 산화물에서 나타나는 것과 유사한 현상으로, 상관관계가 Fe-TMD의 자성 형성에 핵심적임을 시사합니다.", "implication": "이 연구는 TMD 기반 자성 물질을 이해할 때 단순한 단일 전자 모델을 넘어 강상관 효과를 반드시 고려해야 함을 보여줍니다. 이는 자성 위상 물질 설계에 중요한 지침이 됩니다.", "novelty": "유저의 주 관심사인 ARPES를 활용하여 Fe-intercalated TMD의 전자 구조를 직접 측정하고, 이를 통해 상관관계의 중요성을 입증했습니다. 특히 Donghui Lu 등 ARPES 전문가 그룹의 참여로 데이터의 신뢰도가 높습니다.", "unresolved": "eV 스케일의 전자 구조 변화가 어떻게 수 십 K 수준의 낮은 자기 전이 온도와 양립하며, 미세한 자기 구조를 결정하는지에 대한 상세한 연결 고리는 추가 연구가 필요합니다.", "future_work": "다양한 자성 원소(Cr, Co 등) 삽입 계열로의 확장 연구와 RIXS를 이용한 스핀 여기(spin excitation) 프로파일링이 기대됩니다.", "concepts": [{"term": "Intercalated TMDs", "why_emerged": "2차원 층상 물질 사이에 이종 원자를 넣어 물성을 제어하기 위해 등장함.", "origin": "초록 정보만으로는 특정하기 어려움 (반세기 이상의 연구 역사)", "connections": "NbS2, TaS2, Fe-intercalation, 자성 반도체/금속"}, {"term": "Electronic Restructuring", "why_emerged": "상관관계가 강한 계에서 외부 섭동(도핑 등)에 의해 밴드 구조가 비선형적으로 변하는 현상을 설명하기 위해 도입됨.", "origin": "Mott-Hubbard 물리 및 강상관 전자계 이론", "connections": "Correlated oxides, Hubbard U, ARPES spectral weight transfer"}], "english_summary": ["Combines ARPES, XAS, and DFT to study Fe_xNbS2 electronic structure.", "Discovers massive eV-scale electronic restructuring upon Fe intercalation.", "Identifies electronic correlations as a central driver for magnetism in these TMDs.", "Parallels phenomena typically seen in strongly correlated transition metal oxides."]}}, {"title": "Symmetry-Broken Ground State and Phonon-Mediated Superconductivity in Kagome CsV3Sb5", "journal": "PRL_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/4r8x-j3nd", "authors": "Manex Alkorta, Martin Gutierrez-Amigo, Đorđe Dangić, et al.", "last_authors": "Maia G. Vergniory, Ion Errea", "summary": "Author(s): Manex Alkorta, Martin Gutierrez-Amigo, Đorđe Dangić, Chunyu Mark Guo, Philip J. W. Moll, Maia G. Vergniory, and Ion Errea The newly discovered family of nonmagnetic kagome metals ${\\mathrm{AV}}_{3}{\\mathrm{Sb}}_{5}$ ($\\mathrm{A}=\\mathrm{K}$, Rb, or Cs) provides a unique platform for exploring the interplay between charge-density wave (CDW) order, superconductivity, nontrivial topology, and spontaneous time-reversal sym… [Phys. Rev. Lett. 136, 206401] Published Fri May 22, 2026", "tier": "A_MUST_READ", "score": "10", "reason": "Direct hit on core material interest; addresses CDW and superconductivity in CsV3Sb5.", "tags": ["CsV3Sb5", "kagome", "CDW", "superconductivity"], "image": "", "briefing": {"background": "AV3Sb5 (A=K, Rb, Cs) 계열의 카고메 금속은 전하 밀도파(CDW), 초전도성, 위상학적 특성이 공존하여 최근 응집물질 물리 분야에서 가장 뜨거운 소재 중 하나입니다.", "motivation": "CsV3Sb5에서 나타나는 대칭성 파괴 상태의 본질과 초전도성이 포논에 의해 매개되는 전통적인 방식인지, 아니면 비전통적인 방식인지를 명확히 하고자 했습니다.", "result": "이 연구는 CsV3Sb5의 바닥 상태에서 나타나는 대칭성 파괴 양상을 분석하고, 초전도 현상이 포논 매개(phonon-mediated) 메커니즘으로 설명될 수 있음을 제시했습니다.", "implication": "카고메 금속의 초전도 기원에 대한 논쟁(전통적 vs 비전통적)에서 포논의 역할을 강조하는 중요한 이론적/실험적 근거를 제공합니다.", "novelty": "유저가 주목하는 CsV3Sb5의 CDW와 초전도성 간의 상호작용을 다루며, 특히 대칭성 파괴 상태를 구체화했다는 점에서 직접적인 연구 참고 자료가 됩니다.", "unresolved": "포논 매개 모델이 실험에서 보고된 시간 반전 대칭성 깨짐(TRSB) 현상을 완벽하게 설명할 수 있는지에 대해서는 여전히 논의가 필요합니다.", "future_work": "압력이나 도핑에 따른 포논 스펙트럼의 변화와 초전도 전이 온도의 상관관계를 추적하는 정밀한 실험이 필요합니다.", "concepts": [{"term": "Kagome Metal", "why_emerged": "기하학적 좌절(frustration)과 특이한 밴드 구조(flat band, Dirac cone)를 동시에 연구하기 위해 등장함.", "origin": "Syozi (1951) 등에 의한 격자 구조 제안", "connections": "CsV3Sb5, Frustrated magnetism, Flat bands, CDW"}, {"term": "Phonon-mediated Superconductivity", "why_emerged": "BCS 이론에 따라 전자-포논 결합에 의한 쿠퍼 쌍 형성을 설명하기 위해 확립됨.", "origin": "Bardeen, Cooper, Schrieffer (1957)", "connections": "BCS theory, Electron-phonon coupling, Conventional superconductivity"}], "english_summary": ["Investigates the symmetry-broken ground state of kagome CsV3Sb5.", "Provides evidence supporting phonon-mediated superconductivity in the system.", "Addresses the interplay between CDW order and the superconducting phase.", "Clarifies the nature of the electronic state in nonmagnetic kagome metals."]}}, {"title": "Mass-invariant universal optical conductivity from quantum geometry", "journal": "Science_Advances", "source": "Gemini", "link": "https://doi.org/10.1126/sciadv.ady2033", "authors": "Chang-geun Oh, Sun-Woo Kim, Kun Woo Kim, Bartomeu Monserrat, Jun-Won Rhim", "last_authors": "Bartomeu Monserrat, Jun-Won Rhim", "summary": "Mass is a defining property of particles, shaping their fundamental nature and interactions. In condensed matter systems, the effective mass of electrons has long been regarded as a key factor influencing material properties, including their transport and optical responses. In this work, we challenge this conventional wisdom by unveiling a mass-invariant universal optical conductivity, purely derived from quantum geometry, in quadratic band–touching semimetals. Specifically, the optical conductivity simplifies to σ = ( e 2 / 8 ℏ ) d max 2 , independent of effective mass and other band structure details, where d max represents the maximum Hilbert-Schmidt quantum distance. Furthermore, under time-reversal and rotational symmetries, d max is restricted to discrete values of 0 or 1, leading to a quantized universal optical conductivity. We also use first-principles calculations to demonstrate the mass-invariant universal optical conductivity across multiple materials, including bilayer graphene, monolayer bismuth, monolayer kagome palladium thiophosphate, and other realistic material candidates. Our work establishes a previously unidentified class of universal quantities in quantum materials entirely governed by quantum geometry.", "tier": "A_MUST_READ", "score": "10", "reason": "Direct hit: kagome, graphene, quantum geometry, optical conductivity, and electronic structure of quantum materials.", "tags": ["theory", "quantumgeometry", "opticalproperties", "kagome", "graphene", "semimetal"], "image": "", "briefing": {"background": "전통적으로 물질의 광학 전도도는 전자의 유효 질량과 산란 시간에 의존한다고 알려져 있습니다. 하지만 최근 양자 기하학(Quantum Geometry)이 전자의 수송 특성에 미치는 영향이 주목받고 있습니다.", "motivation": "이차 밴드 접촉(quadratic band-touching)을 가진 준금속에서 질량과 무관하게 나타나는 보편적인 광학적 특성이 존재하는지 이론적으로 밝히고자 했습니다.", "result": "광학 전도도가 질량에 의존하지 않고 오직 힐베르트-슈미트(Hilbert-Schmidt) 양자 거리에 의해서만 결정되는 '질량 불변 보편 광학 전도도'를 발견했습니다. 특정 대칭성 하에서는 이 값이 양자화됨을 증명했습니다.", "implication": "물질의 구체적인 화학적 성질이나 밴드 파라미터(질량)에 상관없이, 기하학적 구조만으로 광학적 반응을 정교하게 제어하거나 예측할 수 있는 새로운 가능성을 열었습니다.", "novelty": "베리 곡률(Berry curvature)을 넘어 양자 거리(quantum distance)라는 개념을 도입해 광학 전도도를 재정의했습니다. 유저 관심사인 카고메 격자(PdPS) 및 이층 그래핀을 예시로 들어 실용성을 높였습니다.", "unresolved": "온도 효과나 비선형 광학 반응 환경에서도 이러한 보편성이 얼마나 견고하게 유지될지에 대한 검증이 필요합니다.", "future_work": "이론적으로 제시된 재료들(monolayer bismuth, kagome palladium thiophosphate 등)에 대한 실제 테라헤르츠/적외선 분광 실험.", "concepts": [{"term": "Quantum Geometry", "why_emerged": "베리 곡률만으로는 설명할 수 없는 파동함수의 기하학적 성질(거리 등)을 다루기 위해 등장함.", "origin": "Provost and Vallee (1980) 등에 의해 기초가 마련됨", "connections": "Berry phase, Quantum metric, Fubini-Study metric"}, {"term": "Quadratic band-touching", "why_emerged": "선형적인 Dirac 접촉과는 다른 유효 질량과 위상학적 성질을 탐구하기 위해 연구됨.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "Bilayer graphene, Luttinger semimetals, Quantum Hall effect"}], "english_summary": ["Unveils a mass-invariant universal optical conductivity in quadratic band-touching semimetals.", "Shows conductivity is governed purely by quantum geometry (Hilbert-Schmidt distance).", "Predicts quantized optical responses under specific symmetry constraints.", "Validates findings with DFT on bilayer graphene and kagome palladium thiophosphate."]}}, {"title": "BCS-BEC crossover driven by small Fermi pockets of a high-Tc cuprate superconductor (Nat. Commun.)", "journal": "arXiv_CondMat", "source": "author whitelist", "link": "https://arxiv.org/abs/2606.05653", "authors": "Junhyeok Jeong, Yamato Enomoto, Yoshimitsu Kohama, et al.", "last_authors": "Kazuyasu Tokiwa, Takeshi Kondo", "summary": "arXiv:2606.05653v1 Announce Type: new Abstract: Fermi arcs observed in underdoped cuprates have sparked debate over whether they represent segments of a large Fermi surface or small Fermi pockets. This ambiguity has long hindered their classification as either the conventional Bardeen-Cooper-Schrieffer (BCS) regime or the strongly coupled Bose-Einstein condensation (BEC) crossover limit. Here, using angle-resolved photoemission spectroscopy and quantum oscillations, we demonstrate the coexistence of a small Fermi pocket and a large superconducting gap in the clean inner CuO2 layers of the four-layer cuprate Ba2Ca3Cu4O8(F,O)2. This coexistence constitutes a hallmark of the BCS-BEC crossove d conventional spin-orbit coupling. However, achieving deterministic electric control has remained elusive. Here, a six-state platform for high-dimensional magnetoelectric coupling in altermagnets is established by exploiting the nondegenerate transition paths of sliding ferroelectrics as a symmetry-engineering knob, thereby transcending the conventional binary (up/down) paradigm of sliding ferroelectricity. First-principles calculations on bilayer manganese phosphorus trisulfide reveal a spin-polarization symmetry-locking mechanism. Polarization switching along the three nondegenerate paths not only reverses the spin splitting but also rotates its spin-splitting texture in 120° increments, yielding six nonvolatile, electrically addressable altermagnetic states. Furthermore, direct correspondence is established between the spin-splitting texture and the nonlinear Hall response, providing unique electrical fingerprints for each state. This work establishes a paradigm for electric field–driven reconstruction of momentum-space spin geometry, providing a versatile platform for controlling quantum phenomena in altermagnetic spintronics.", "tier": "A_MUST_READ", "score": "9", "reason": "Directly relevant to altermagnetism, multiferroics, spin-splitting, and nonlinear Hall physics via first-principles.", "tags": ["altermagnetism", "multiferroics", "spinphysics", "Halleffect", "DFT"], "image": "", "briefing": {"background": "알터마그네티즘(Altermagnetism)은 순 자화가 없으면서도 스핀 분리(spin-splitting)가 발생하는 새로운 자기 질서로, 기존 강자성체나 반강자성체의 한계를 넘어서는 저전력 스핀트로닉스 구현을 위한 핵심 분야입니다.", "motivation": "알터마그네틱 다중강성체에서 전기적 제어를 통해 스핀 상태를 결정론적으로 조절하는 방법은 여전히 도전적인 과제입니다.", "result": "이중층 MnPSe3에서 슬라이딩 강유전성을 이용해 스핀 분리 텍스처를 120도씩 회전시키고, 이를 통해 총 6개의 비휘발성 알터마그네틱 상태를 전기적으로 제어할 수 있음을 이론적으로 보였습니다.", "implication": "운동량 공간(momentum-space)에서의 스핀 기하 구조를 전기장으로 재구성할 수 있어, 알터마그네틱 소자의 비휘발성 메모리 및 논리 소자 응용 가능성을 열었습니다.", "novelty": "기존의 이분법적인 강유전성 스위칭(up/down)을 넘어 다차원적인(6상태) 스핀-전기 제어를 제안했으며, 비선형 홀 효과(nonlinear Hall effect)를 통한 상태 검출법을 제시했습니다.", "unresolved": "이론적 제안이므로 실제 소자 제작을 통한 실험적 검증 및 재료의 결함이 스위칭 경로에 미치는 영향은 미해결 과제입니다.", "future_work": "제안된 MnPSe3 시스템의 실제 소자 제작 및 저온에서의 비선형 홀 측정 등 실험적 검증이 요구됩니다.", "concepts": [{"term": "Altermagnetism", "why_emerged": "순 자화가 없는 반강자성체에서도 스핀-궤도 결합 없이 큰 스핀 분리를 얻기 위해 등장.", "origin": "최근 2-3년 내 체계적으로 정립됨 (예: Jungwirth 등).", "connections": "반강자성체, 스핀트로닉스, 비상반성 수송 현상."}, {"term": "Sliding Ferroelectricity", "why_emerged": "반데르발스 층상 구조에서 층간 미끄러짐을 통해 전기적 분극을 유도하기 위해 필요.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "2D 반데르발스 이질구조, 스태킹(stacking) 자유도."}, {"term": "Nonlinear Hall Effect", "why_emerged": "시간 반전 대칭이 깨진 시스템에서 Berry 곡률 쌍극자로 인해 나타나는 2차 홀 응답을 측정하기 위해 필요.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "Berry 곡률, 스핀 분리, 토폴로지 물질."}], "english_summary": ["Proposes a six-state control mechanism for altermagnetism in bilayer MnPSe3.", "Utilizes sliding ferroelectricity to rotate spin-splitting textures by 120 degrees.", "Links specific spin geometries to distinct nonlinear Hall signatures.", "Establishes a new platform for electrically addressable altermagnetic spintronics."]}}, {"title": "Linear magneto-birefringence as a probe of altermagnetism", "journal": "npj_QuantumMaterials", "source": "Gemini", "link": "https://www.nature.com/articles/s41535-026-00901-8", "authors": "V. Sunko, J. Orenstein", "last_authors": "V. Sunko, J. Orenstein", "summary": "npj Quantum Materials, Published online: 30 May 2026; doi:10.1038/s41535-026-00901-8 Linear magneto-birefringence as a probe of altermagnetism", "tier": "A_MUST_READ", "score": "9", "reason": "Experimental probe for altermagnetism, a key user interest.", "tags": ["altermagnetism", "magneto-optics", "experimentaltechnique"], "image": "https://pubads.g.doubleclick.net/gampad/ad?iu=/285/npjquantmats.nature.com/article&sz=728x90&c=-1898303853&t=pos%3Dtop%26type%3Darticle%26artid%3Ds41535-026-00901-8%26doi%3D10.1038/s41535-026-00901-8%26subjmeta%3D301,639,766%26kwrd%3DMaterials+science,Physics", "briefing": y_emerged": "물질의 저에너지 전자 동역학 및 전하 수송 특성을 조사하기 위해", "origin": "광학 물리학 전반", "connections": "광전도도, 루드윅-크뢰니히 관계"}, {"term": "층간 결합 (Layer decoupling)", "why_emerged": "2차원적 성질을 띠는 물질에서 층 간의 전자 이동도가 낮아지는 현상을 설명하기 위해", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "반데르발스 물질, 이방성 수송"}], "english_summary": ["Study of trilayer nickelate La4Ni3O10 using polarization-resolved infrared spectroscopy.", "Density-wave order drives a strong electronic anisotropy.", "Material exhibits metallic in-plane and insulating out-of-plane character in the ordered phase.", "Discovery of layer decoupling driven by charge order in nickelates."]}}, {"title": "Broadband and high-speed terahertz wireless sensing via vertical-transport Dirac-source detector", "journal": "Science_Advances", "source": "Gemini", "link": "https://doi.org/10.1126/sciadv.aeg2196", "authors": "Xiaokai Pan, Yiming Wang, Hangxiang Wang, et al.", "last_authors": "Wei Lu, Lin Wang", "summary": "In the realm of wireless sensing, it is envisioned that sensing and communication functionalities will coexist and be fully integrated within a unified system. Future sensing systems thus necessitate detectors capable of operating at higher frequency bands—ranging from millimeter wave to terahertz (THz)—while delivering wider bandwidths, faster response rates, and enhanced functional integration. Dirac-source (DS) detectors use Dirac semimetals as hot-electron sources to capitalize on the low density of states (DOS) near the Dirac point, thereby effectively suppressing the formation of metal-induced gap states. Furthermore, when this architecture incorporates the inherent interlayer vertical electron transport of vertical van der Waals (vdW) heterostructures, it shows great promise for realizing low-power, post–Moore era sensing devices with superior injection and transport efficiencies. Here, we report a DS detector composed of the completely vertical gold/zirconium pentatelluride/graphene/gold structure (Au/ZrTe 5 /graphene/Au) heterojunction, which harnesses strong localized fields to achieve high thermionic emission. The detector manifests outstanding performance in terms of remarkable responsivity, exceeds a peak of 1600 V/W from 0.02 to 0.5 THz at room temperature, has a fast response time less than 20 ns, and notably is capable for heterodyne mixing with intermediate frequency (IF) bandwidth larger than ±26.5 gigahertz. Our results not only shed a fresh light on DS dynamics in the terahertz region but also highlight the transformative potential of semimetal electronics for applications in wireless energy harvesting, communication, and imaging.", "tier": "B_IMPORTANT_CONDMAT", "score": "9", "reason": "Electronic structure and transport in Dirac semimetals, graphene, and vdW heterostructures.; demoted from A: broad CM, not direct user/project hit", "tags": ["Dirac", "graphene", "vanderWaals", "heterostructure", "transport"], "image": "", "briefing": {"background": "디락 반금속은 선형적인 분산 관계와 낮은 상태 밀도를 가져 테라헤르츠(THz) 대역에서의 초고속 감지기로 활용 가능성이 높습니다.", "motivation": "반데르발스 이종접합 구조를 이용하여 효율적인 Dirac-source(DS) 테라헤르츠 감지기를 개발하고 그 성능을 검증하고자 했습니다.", "result": "Au/ZrTe5/Graphene/Au 수직 이종접합 구조를 통해 높은 응답도(1600 V/W)와 빠른 응답 시간(20ns 미만)을 달성했습니다.", "implication": "반금속 전자 소자가 기존 실리콘 기반 소자를 넘어선 초고속 통신 및 센싱 분야의 차세대 기술이 될 수 있음을 시사합니다.", "novelty": "디락 반금속 ZrTe5와 그래핀을 결합한 완전히 수직인 구조를 통해 테라헤르츠 영역에서 뛰어난 검출 성능을 구현했습니다.", "unresolved": "소자 제작 공정의 대량 생산 가능성 및 장기적인 소자 안정성에 대해서는 추가적인 연구가 필요합니다.", "future_work": "더 넓은 주파수 대역으로의 확장 및 실제 무선 통신 시스템에 통합하는 후속 연구가 예상됩니다.", "concepts": [{"term": "디락 반금속", "why_emerged": "에너지 밴드가 디락 점 근처에서 선형으로 교차하는 위상 물질의 특성을 활용하기 위해", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "위상 절연체, 베리 곡률, ZrTe5"}, {"term": "반데르발스 이종접합", "why_emerged": "2차원 물질들을 쌓아 새로운 물리적 특성과 기능을 설계하기 위해", "origin": "Andre Geim & Konstantin Novoselov (2010년대)", "connections": "그래핀, 전이금속 디칼코게나이드, 적층 구조"}, {"term": "테라헤르츠 감지기", "why_emerged": "밀리미터파와 원적외선 사이의 미개척 주파수 대역 활용을 위해", "origin": "통신 공학 및 응집물질물리학", "connections": "광전자 소자, 핫 전자"}], "english_summary": ["Development of a high-speed THz detector using Dirac semimetals.", "Vertical Au/ZrTe5/Graphene/Au heterojunction enhances hot-electron injection.", "Demonstrated peak responsivity of 1600 V/W and response time under 20 ns.", "Highlights potential of semimetal electronics for wireless sensing and communication."]}}, {"title": "All optical excitation of spin polarization in d-wave altermagnets", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2408.05187", "authors": "Marius Weber, Stephan Wust, Luca Haag, et al.", "last_authors": "Benjamin Stadtm\\\"uller, Hans Christian Schneider", "summary": "arXiv:2408.05187v2 Announce Type: replace Abstract: The recently discovered altermagnets exhibit collinear magnetic order with zero net magnetization but with unconventional spin-polarized d/g/i-wave band structures, expanding the known paradigms of ferromagnets and antiferromagnets. In addition to novel current-driven electronic transport effects, the unconventional time-reversal symmetry breaking in these systems also makes it possible to obtain a spin response to \\emph{linearly polarized} fields in the optical frequency domain. We show through ab-initio calculations of the prototypical d-wave altermagnet RuO$_2$, with a symmetry combining twofold spin rotation with fourfold lattice rotation, $[C_2\\|C_{4z}]$, that there is an optical analogue of a spin splitter effect, as the coupling to a linearly polarized exciting laser field makes the d-wave character of the altermagnet directly visible. By magneto-optical measurements on RuO$_2$ films of different thicknesses ranging from $2$ to $8\\,$nanometers, we demonstrate the predicted connection of the linear polarization of an ultrashort pump pulse to the sign and magnitude of the optically excited electronic spin polarization in the ultrathin RuO$_2$ films. The possibility of exciting and controlling an electronic spin polarization by linearly polarized optical pulses in a compensated system is a unique consequence of the altermagnetic material properties. Our experimental results therefore establish an optical pump-probe based protocol for detection of altermagnetic characteristics in ultrathin RuO$_2$ films, but our all-optical approach should apply more generally to materials in this altermagnetic symmetry class.", "tier": "B_IMPORTANT_CONDMAT", "score": "9", "reason": "Directly relevant to altermagnetism and time-reversal symmetry breaking in electronic structure.", "tags": ["altermagnet", "transport", "bandstructure", "time-reversalsymmetrybreaking"], "image": "https://arxiv.org/html/2408.05187v2/x1.png", "briefing": {"background": "알터마그넷(Altermagnet)은 자성체의 새로운 범주로, 순자화(net magnetization)는 0이지만 스핀 분극된 d/g/i-wave 대칭성을 가진 전자 구조를 보여줍니다. 기존의 강자성체나 일반적인 반강자성체와 구분되는 독특한 대칭성 깨짐을 가집니다.", "motivation": "알터마그넷의 시간 역전 대칭성 깨짐이 빛의 편광과 어떻게 상호작용하는지 규명하고, 이를 통해 물질의 알터마그넷적 특성을 광학적으로 탐지할 수 있는 프로토콜을 개발하고자 함입니다.", "result": "RuO2를 프로토타입으로 하여, 선형 편광된 레이저 펄스가 알터마그넷의 d-wave 특성과 결합하여 스핀 분극을 유도함을 이론적으로 계산하고, 박막 샘플에서 실험적으로 검증했습니다.", "implication": "자기장 없이도 빛의 편광만으로 알터마그넷의 스핀 상태를 제어하고 읽어낼 수 있음을 시사하며, 이는 차세대 스핀트로닉스 소자 개발에 큰 이정표가 될 것입니다.", "novelty": "외부 자기장 없이 선형 편광 광학 펄스를 사용하여 알터마그넷의 고유한 스핀 분극 특성을 직접 관측하는 'Optical Spin Splitter' 효과를 입증했습니다.", "unresolved": "RuO2 이외의 다른 대칭성 클래스를 가진 알터마그넷에서도 동일한 광학적 효율과 신호가 나타나는지에 대한 추가 연구가 필요합니다.", "future_work": "다양한 결정 구조를 가진 알터마그넷 물질들에 대한 유사한 광학 펌프-프로브 실험 확장 및 소자 응용을 위한 메커니즘 최적화.", "concepts": [{"term": "Altermagnet", "why_emerged": "순자화가 없음에도 불구하고 스핀 분극 대칭성을 가질 수 있는 물질군의 필요성 때문", "origin": "최근 2020년대 초반 이론적 제안 및 실험적 입증", "connections": "강자성체(Ferromagnet), 반강자성체(Antiferromagnet), 시간 역전 대칭성"}, {"term": "Spin Splitter effect", "why_emerged": "스핀을 분리하거나 제어하기 위한 전기적/광학적 수단 필요", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "Spin-orbit torque, anomalous Hall effect"}, {"term": "Time-reversal symmetry breaking", "why_emerged": "스핀 분극과 전자 구조의 비대칭성을 설명하기 위한 필수적 물리 개념", "origin": "응집물질물리학 초기 개념", "connections": "Berry p rials, Bandgap engineering, Density of states."}], "english_summary": ["Reports the synthesis of 1-nm-diameter single-walled MoS2 nanotubes.", "Uses boron nitride nanotubes as spatial templates for confined growth.", "Confirms the theoretical prediction of diameter-dependent bandgap shrinkage.", "Demonstrates a potential gate-all-around architecture for nanoscale transistors."]}}, {"title": "Corrugating van der Waals gaps for decoupling heat and charge transport in layered thermoelectrics", "journal": "Science_Advances", "source": "Gemini", "link": "https://doi.org/10.1126/sciadv.aef9733", "authors": "Chuan-Dong Zhou, Jianfeng Cai, Minhui Yuan, et al.", "last_authors": "Bo Liang, Jun Jiang", "summary": "Layered thermoelectric materials face intrinsic challenges in disentangling phonon and electron transport due to their anisotropic bonding networks. Here, we introduce a van der Waals gap engineering strategy that deliberately imposes out-of-plane stress on n-type bismuth telluride (Bi 2 Te 3 ). Selective interlayer doping creates local charge imbalance, which in turn drives ripple-like lattice corrugations. These structural undulations mimic substrate-induced strain fields, renormalize phonon dispersion, and substantially reduce phonon velocity, thereby suppressing lattice thermal conductivity. The corrugation amplitude is far smaller than the electronic mean free path, ensuring negligible additional electron scattering. As a result, the material reaches a peak zT of 1.43 at 350 kelvin, while the fabricated module delivers a conversion efficiency of 7.5% under a 250-kelvin temperature gradient—both representing state-of-the-art performances for n-type Bi 2 Te 3 systems. More broadly, this work establishes interlayer stress as a general strategy to manipulate phonons in van der Waals solids, providing previously unidentified design principles for high-efficiency thermoelectrics.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Relevant for van der Waals materials, phonon engineering, and charge/heat transport in Bi2Te3.", "tags": ["vanderWaals", "phonon", "transport", "thermoelectric", "Bi2Te3"], "image": "", "briefing": {"background": "열전 소자는 온도 차를 전압으로 변환하는데, 이때 효율을 높이기 위해서는 전기 전도도는 높이고 열 전도도는 낮춰야 합니다. 하지만 일반적인 고체 물질에서 전하와 열은 모두 전자에 의해 운반되므로 이 두 특성을 독립적으로 제어하기가 매우 어렵습니다.", "motivation": "층상 구조를 가진 비스무트 텔루라이드(Bi2Te3)에서 반 데르 발스 틈새에 인위적인 스트레스를 가해 격자 구조를 변형함으로써, 전자 이동은 방해하지 않으면서 포논(열) 이동만 선택적으로 차단하고자 했습니다.", "result": "반 데르 발스 틈새에 도핑을 통해 국소적인 전하 불균형을 유도하여 층간 물결 모양의 주름(ripple)을 만들었습니다. 이 구조가 포논 분산을 재규격화하여 포논 속도를 늦추고 격자 열전도도를 효과적으로 억제했습니다.", "implication": "반 데르 발스 물질에서 층간 스트레스 조절이 열전 성능 향상을 위한 범용적인 포논 엔지니어링 전략이 될 수 있음을 입증했습니다.", "novelty": "전자 평균 자유 행로보다 훨씬 작은 규모의 구조적 왜곡을 도입하여 전자 산란은 최소화하면서 열 차단 효율을 극대화한 점이 핵심입니다.", "unresolved": "이러한 미세 주름 구조가 극한 환경이나 고온 소자 작동 시에도 장기적인 구조적 안정성을 유지할 수 있는지에 대한 추가 연구가 필요합니다.", "future_work": "다른 층상 구조 물질로 이 전략을 확장하고, 실제 상용화 가능한 열전 모듈의 신뢰성 테스트가 이어질 것으로 예상됩니다.", "concepts": [{"term": "반 데르 발스(vdW) 틈새", "why_emerged": "층상 물질에서 층 사이의 약한 결합 영역을 제어하기 위해 필요.", "origin": "요하네스 디데릭 반 데르 발스, 19세기 후반 발견.", "connections": "2D 재료, 전이 금속 디칼코게나이드(TMD) 연구의 핵심."}, {"term": "포논 엔지니어링", "why_emerged": "물질의 열 전달 특성을 격자 진동 제어를 통해 설계하기 위해.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "열전 소자, 나노 구조 열역학."}], "english_summary": ["Layered Bi2Te3 is engineered by introducing interlayer stress to create ripple-like lattice corrugations.", "These corrugations effectively suppress phonon transport by reducing phonon velocity while maintaining electron mobility.", "The result achieves a peak zT of 1.43, demonstrating a significant improvement in thermoelectric efficiency.", "This approach provides a scalable strategy for decoupling electronic and thermal transport in vdW materials."]}}, {"title": "Linearly Polarized Light-Induced Anomalous Hall Effect and Topological Phase Transitions in an Altermagnetic Topological Insulator", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2603.06486 n materials and cold atomic gases.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Theoretical study of odd-parity magnons, altermagnetism, and loop currents in a topological Hubbard model.", "tags": ["theory", "altermagnetism", "loopcurrent", "topological", "magnon", "Hubbard"], "image": "https://arxiv.org/html/2606.05837v1/figures/plot_combined_honeycomb_BZ_phasediagram.png", "briefing": {"background": "자성체에서 스핀 분할은 주로 공간 반전 대칭과 시간 반전 대칭의 깨짐에 의해 결정됩니다. 최근 주목받는 '알터마그넷(Altermagnet)'은 스핀-궤도 결합 없이도 대칭성 기반의 비상관적 스핀 분할을 보여주며, 본 연구는 이를 '홀수 패리티(odd-parity)' 맥락으로 확장하여 연구합니다.", "motivation": "기존의 알터마그넷 연구는 주로 비공선형(noncollinear) 자성체에 집중되었습니다. 본 논문은 홀데인-허바드(Haldane-Hubbard) 모델을 통해, 루프 전류가 존재하는 공선형(collinear) 자성체에서도 홀수 패리티의 스핀 분할과 맥논(magnon)이 나타날 수 있음을 규명하고자 합니다.", "result": "홀데인-허바드 모델의 상자성 상태에서 위상적 엑시톤(topological exciton)이 존재함을 발견하고, 이들의 응집이 네엘(Néel) 상태로의 상전이를 유도함을 보였습니다. 이 상태에서 홀수 패리티를 가진 f-파형의 스핀 분할 맥논이 나타남을 확인했습니다.", "implication": "루프 전류를 동반하는 자기 정렬 상태가 알터마그넷의 새로운 범주인 '홀수 파형 자성체(odd-wave magnets)'가 될 수 있음을 제시합니다. 이는 위상 물리학과 자성체 이론의 교차점을 넓힙니다.", "novelty": "공선형 자성체에서도 복잡한 스핀-궤도 결합 없이 위상적 특성과 결합된 거대한 스핀 분할을 구현할 수 있다는 이론적 근거를 마련했습니다.", "unresolved": "이러한 위상적 엑시톤 응집을 실제 고체 물성에서 구체적으로 어떻게 실험적으로(예: RIXS, ARPES 등) 확실하게 식별할지에 대한 구체적 제안은 부족합니다.", "future_work": "플로케(Floquet) 엔지니어링을 통한 동적 제어 가능성 연구 및 원자 가스 실험을 통한 해당 상의 직접적인 검증이 예상됩니다.", "concepts": [{"term": "알터마그넷(Altermagnet)", "why_emerged": "기존 강자성/반강자성 구분으로 설명되지 않는 특이한 스핀 분할 현상을 설명하기 위해.", "origin": "최근 3~4년 내 여러 그룹에 의해 대칭성 기반으로 정립됨.", "connections": "반강자성, 홀-효과, 스핀-궤도 토크."}, {"term": "루프 전류(Loop current)", "why_emerged": "고온 초전도체 등에서 시간 반전 대칭이 깨진 숨겨진 질서 매개변수를 설명하기 위해.", "origin": "Varma 등에 의해 고온 초전도체 의사갭(pseudogap) 상태의 기원으로 제안됨.", "connections": "오비탈 자기 모멘트, 시간 반전 대칭 파괴."}, {"term": "Haldane-Hubbard 모델", "why_emerged": "위상적 절연체 성질과 강상관 전자계의 허바드 상호작용을 동시에 연구하기 위해.", "origin": "Duncan Haldane의 허니컴 격자 모델과 허바드 모델의 결합.", "connections": "위상적 절연체, 양자 이상 홀 효과."}], "english_summary": ["The paper investigates odd-parity mag als, NLS)은 운동량 공간에서 밴드가 선 형태로 교차하는 물질로, 일반적인 금속과는 다른 독특한 준입자 역학을 가집니다. 이를 이해하려면 페르미 표면의 기하학적 구조와 산란 기작을 정밀하게 분석해야 합니다.", "motivation": "NLS의 토로이드(toroidal) 페르미 표면이 전자-포논 산란과 같은 수송 현상에 어떤 물리적 영향을 미치는지 구체적인 수치와 모델로 정량화하고자 합니다.", "result": "토로이드 구조로 인해 폴로이드(poloidal) 및 토로이드(toroidal) 방향의 운동량 전달에 따른 두 개의 서로 다른 블로흐-그뤼나이젠(Bloch-Grüneisen) 온도가 존재함을 발견했습니다. 그 결과 온도에 따른 붕괴율(decay rate)과 전도도(conductivity)가 멱함수 형태의 특이한 거동을 보입니다.", "implication": "NLS 물질의 ARPES 선폭 측정이나 저온 수송 실험에서 나타나는 비정상적인 거동을 설명할 수 있는 이론적 기준점을 제공합니다.", "novelty": "단순한 밴드 교차를 넘어 페르미 표면의 위상적 기하학(토로이드 구조)이 포논 산란이라는 다체 물리에 미치는 구체적인 온도 의존성을 도출했습니다.", "unresolved": "불순물 산란이나 전자-전자 상호작용이 우세한 영역에서의 복합적인 효과는 고려되지 않았습니다.", "future_work": "실제 NLS 후보 물질(예: ZrSiS 계열 등)에서의 포논 산란율 측정을 통한 이론 검증 및 더 복잡한 격자 구조로의 확장.", "concepts": [{"term": "마디선 반금속(Nodal-line semimetal)", "why_emerged": "점(Dirac/Weyl)이 아닌 선(line) 형태의 밴드 축퇴를 가진 물질의 독특한 위상 물성을 규명하기 위해.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "디락 반금속, 웨일 반금속, 위상적 물성."}, {"term": "블로흐-그뤼나이젠 온도(Bloch-Grüneisen temperature)", "why_emerged": "금속에서 저온 전도도가 포논에 의해 제한되는 방식을 기술하기 위해.", "origin": "Felix Bloch, Eduard Grüneisen.", "connections": "전기 저항률, 전자-포논 산란."}], "english_summary": ["Analyzes electron-phonon scattering in nodal-line semimetals with toroidal Fermi surfaces.", "The toroidal geometry induces two distinct Bloch-Grüneisen temperature scales.", "Predicts specific power-law scaling for decay rates and conductivity in the intermediate temperature regime.", "Provides clear signatures for ARPES line-width and transport studies in nodal-line materials."]}}, {"title": "Phases of quasi-one-dimensional fractional quantum anomalous Hall -- superconductor heterostructures", "journal": "npj_QuantumMaterials", "source": "Gemini", "link": "https://www.nature.com/articles/s41535-026-00897-1", "authors": "Steffen Bollmann, Andreas Haller, Jukka I. Väyrynen, Thomas L. Schmidt, Elio J. König", "last_authors": "Thomas L. Schmidt, Elio J. König", "summary": "npj Quantum Materials, P
