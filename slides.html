<title>Daily Paper Slideshow</title>
<style>
  :root {
    color-scheme: light;
    --bg: #f6f7f4;
    --paper: #ffffff;
    --ink: #111827;
    --muted: #64748b;
    --line: #d8ddd2;
    --accent: #176b87;
    --accent-2: #9a3412;
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; overflow: auto; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: var(--bg); color: var(--ink); }
  .shell { max-width: 1500px; min-height: 100vh; margin: 0 auto; padding: 14px 18px; display: flex; flex-direction: column; }
  .topbar { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 16px; }
  .top-actions { display: flex; align-items: center; gap: 10px; }
  .topbar a, button { border: 1px solid var(--line); border-radius: 8px; background: var(--paper); color: var(--ink); padding: 10px 14px; font-weight: 700; text-decoration: none; cursor: pointer; }
  button.primary { background: var(--accent); border-color: var(--accent); color: white; }
  button:disabled { opacity: 0.45; cursor: not-allowed; }
  .counter { color: var(--muted); font-weight: 700; }
  .slide { min-height: calc(100vh - 82px); background: var(--paper); border: 1px solid var(--line); border-radius: 10px; padding: 18px; box-shadow: 0 18px 42px rgba(15, 23, 42, 0.10); display: grid; grid-template-columns: minmax(310px, 0.86fr) minmax(0, 1.55fr); gap: 18px; overflow: visible; }
  .paper-head { min-width: 0; min-height: 0; overflow: visible; display: flex; flex-direction: column; gap: 12px; }
  .figure { margin: 0; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: #f8fafc; }
  .figure img { display: block; width: 100%; max-height: 41vh; object-fit: contain; background: white; }
  .figure figcaption { padding: 7px 10px; color: var(--muted); font-size: 12px; line-height: 1.3; }
  .head-text { display: flex; flex-direction: column; gap: 9px; min-width: 0; }
  .badges { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .badge { border-radius: 999px; padding: 5px 9px; background: #eef2ff; color: #3730a3; font-size: 12px; font-weight: 800; }
  .score { background: #fee2e2; color: #991b1b; }
  h1 { margin: 0; font-size: 25px; line-height: 1.15; letter-spacing: 0; overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
  h1 a { color: inherit; text-decoration-color: rgba(23, 107, 135, 0.35); text-decoration-thickness: 2px; text-underline-offset: 4px; }
  h1 a:hover { color: var(--accent); text-decoration-color: var(--accent); }
  .meta, .authors, .why, .abstract { font-size: 13px; line-height: 1.45; }
  .meta, .authors { color: var(--muted); }
  .why strong, .abstract strong, .authors strong { color: var(--ink); }
  .authors { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .why { border-left: 4px solid var(--accent-2); padding-left: 10px; color: #374151; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .abstract { border-top: 1px solid var(--line); padding-top: 14px; color: #374151; }
  .original-abstract { border-top: 1px solid var(--line); padding-top: 10px; color: #374151; font-size: 11.5px; line-height: 1.35; overflow-wrap: anywhere; }
  .original-abstract strong { display: block; margin-bottom: 4px; color: var(--ink); }
  .tags { display: flex; flex-wrap: wrap; gap: 8px; }
  .tag { border-radius: 999px; padding: 4px 8px; background: #f1f5f9; color: #475569; font-size: 12px; font-weight: 700; }
  .head-text > .link { display: none; }
  .briefing { min-width: 0; min-height: 0; overflow: visible; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); grid-auto-rows: minmax(0, auto); align-content: start; gap: 11px 18px; border-top: 0; padding-top: 0; }
  .brief-section { min-width: 0; }
  .brief-section.wide { grid-column: 1 / -1; }
  .brief-section h2 { margin: 0 0 4px; font-size: 14px; line-height: 1.22; color: #0f766e; letter-spacing: 0; }
  .brief-section p, .brief-section li { margin: 0; font-size: 12.5px; line-height: 1.42; color: #1f2937; overflow-wrap: anywhere; }
  .brief-section ul { margin: 0; padding-left: 20px; }
  .concepts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 9px 14px; }
  .concept { border-top: 1px solid var(--line); padding-top: 7px; }
  .concept h3 { margin: 0 0 4px; font-size: 13px; color: #7c2d12; letter-spacing: 0; }
  .concept p { margin: 2px 0 0; font-size: 11.5px; line-height: 1.35; color: #374151; overflow-wrap: anywhere; }
  .concept b { color: #111827; }
  .link { color: var(--accent); font-weight: 800; text-decoration: none; }
  .empty { padding: 48px; background: var(--paper); border: 1px solid var(--line); border-radius: 12px; color: var(--muted); }
  @media (max-width: 860px) {
    .shell { padding: 14px; }
    .topbar, .top-actions { align-items: stretch; flex-direction: column; }
    .slide, .briefing, .concepts { grid-template-columns: 1fr; }
    .slide { min-height: auto; overflow: visible; display: grid; }
    h1 { font-size: 28px; }
  }
</style>

why_emerged": "기하학적 좌절(frustration)이 전자 구조에 플랫 밴드와 반-Dirac 점을 형성하여 상관계 효과를 극대화하기 때문.", "origin": "AV3Sb5 물질군은 2020년경 Ortiz 등에 의해 체계적으로 연구되기 시작함.", "connections": "밴드 토폴로지, CDW."}], "english_summary": ["Studies unconventional superconducting pairing in AV3Sb5 kagome metals.", "Identifies a transition in pairing symmetry that involves time-reversal symmetry breaking.", "Calculates collective modes and gap functions using a multi-band approach.", "Provides theoretical insight into the non-trivial pairing state in kagome superconductors."]}}, {"title": "Direct Visualization of Gate-Tunable Flat Bands in Twisted Double Bilayer Graphene", "journal": "PRL_Recent", "source": "author whitelist", "link": "http://link.aps.org/doi/10.1103/3vg5-vkzy", "authors": "Souvik Sasmal, Ryan Muzzio, Ahmed Khalifa, et al.", "last_authors": "Shubhayu Chatterjee, Jyoti Katoch", "summary": "Author(s): Souvik Sasmal, Ryan Muzzio, Ahmed Khalifa, Paulina Majchrzak, Alfred J. H. Jones, I-Hsuan Kao, Kenji Watanabe, Takashi Taniguchi, Simranjeet Singh, Eli Rotenberg, Aaron Bostwick, Chris Jozwiak, Søren Ulstrup, Shubhayu Chatterjee, and Jyoti Katoch The evolution of moiré minibands under varying carrier density and displacement field may be directly visualized using microfocused angle-resolved photoemission spectroscopy. [Phys. Rev. Lett. 137, 016402] Published Tue Jun 30, 2026", "tier": "A_MUST_READ", "score": "10", "reason": "author whitelist: Eli Rotenberg", "tags": ["angle-resolvedphotoemission", "photoemission", "graphene", "moir", "twisted", "flatband"], "image": "", "briefing": {"background": "뒤틀린(twisted) 반데르발스 이종접조체는 모아레 무늬를 통해 밴드폭을 극도로 줄인 플랫 밴드를 형성할 수 있으며, 여기서 상관 전자 물성이 극대화됩니다.", "motivation": "전자 밀도와 변위장(displacement field)에 따라 변화하는 모아레 미니밴드를 직접 시각화하여 미시적인 밴드 제어 능력을 확인하고자 합니다.", "result": "마이크로 ARPES 기술을 활용하여 트위스트된 이중 이중층 그래핀의 플랫 밴드가 외부 게이트 전압에 의해 어떻게 재구성되는지 실험적으로 관측했습니다.", "implication": "모아레 시스템에서 전하 도핑과 외부 전기장 조절을 통한 밴드 엔지니어링의 정밀한 제어가 가능함을 입증했습니다.", "novelty": "Eli Rotenberg 그룹의 정밀한 tion": "철 칼코게나이드 계열인 K3Fe2Se4에서 관찰되는 독특한 블록형(block-type) 반강자성 상태의 기원을 규명하고, 준일차원 사슬 구조가 전자 간 상호작용에 미치는 영향을 파악하고자 합니다.", "result": "K3Fe2Se4가 나타내는 특이한 블록형 반강자성 질서의 실험적 증거를 제시하고, 이것이 준일차원 구조 내의 전자 정렬과 밀접하게 연관되어 있음을 확인했습니다.", "implication": "준일차원 철 기반 물질에서 나타나는 자기적 질서의 메커니즘을 밝혀냄으로써, 다른 철 기반 초전도체 및 자성체와의 비교 연구를 위한 중요한 이정표를 마련했습니다.", "novelty": "준일차원 사슬 구조에서 나타나는 블록형 반강자성이라는 독특한 자기적 구조를 명확히 규명했으며, 이는 강상관계 물리 연구자들에게 구조와 자성의 상관관계를 이해하는 새로운 관점을 제공합니다.", "unresolved": "이러한 블록형 반강자성이 구체적으로 어떠한 전자-격자 결합 또는 궤도 정렬에 의해 기인하는지에 대한 미시적 메커니즘은 여전히 추가 연구가 필요합니다.", "future_work": "다른 도핑 수준이나 압력 조건 하에서 이 자기적 상태가 어떻게 변하는지, 그리고 초전도 상태와의 경쟁 또는 공존 가능성을 조사할 필요가 있습니다.", "concepts": [{"term": "블록형 반강자성", "why_emerged": "준일차원 구조에서 단순한 네엘(Néel) 유형의 질서가 아닌, 국소적인 클러스터 정렬이 일어나는 현상을 기술하기 위해 도입됨.", "origin": "철 칼코게나이드 연구 분야에서 실험적으로 보고됨.", "connections": "철 기반 초전도체의 스핀 밀도 파동(SDW) 및 저차원 강상관계 시스템의 자기 구조와 연결됨."}], "english_summary": ["Experimental study of K3Fe2Se4 reveals unusual block-type antiferromagnetism.", "Highlights the role of quasi-1D chains in correlated electron systems.", "Provides insights into unconventional magnetism in iron chalcogenides."]}}, {"title": "Revisiting the Charge-Density-Wave Superlattice of 1T−TiSe2", "journal": "PRL_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/btvb-ngy5", "authors": "Wei Wang, Patrick Liu, Lijun Wu, et al.", "last_authors": "Alfred Zong, Yimei Zhu", "summary": "Author(s): Wei Wang, Patrick Liu, Lijun Wu, Jing Tao, Genda Gu, Binghai Yan, Alfred Zong, and Yimei Zhu A number of intriguing phenomena, including exciton condensation, orbital ordering, and emergence of chirality, have been proposed to accompany charge-density-wave (CDW) formation in the layered transition metal dichalcogenide $1T\\text{−}{\\mathrm{TiSe}}_{2}$. Explaining these effects relies on knowl… [Phys. Rev. Lett. 136, 256101] Published Thu Jun 25, 2026", "tier": "B_IMPORTANT_CONDMAT", "score": "9", "reason": "CDW in layered materials is directly relevant to kagome CDW interest.", "tags": ["CDW", "TMD", "electronicstructure"], "image": "", "briefing": {"background": "층상 전이금속 디칼코게나이드(TMD)인 1T-TiSe2는 전하 밀도 파동(CDW)과 관련된 엑시톤 응축, 궤도 정렬 등 다양한 물성이 공존하는 흥미로운 후보 물질입니다.", "motivation": "1T-TiSe2의 CDW 상전이와 동반되는 격자 왜곡 및 전자 구조 변화의 정체를 재평가하여, 오랫동안 논쟁이 되어온 현상들의 기원을 명확히 하고자 했습니다.", "result": "CDW 초격자의 정밀한 구조적 특성을 규명하여 이전에 제안되었던 엑시톤 응축과 물리적 현상 간의 상관관계를 보다 엄밀한 관점에서 재해석했습니다.", "implication": "TiSe2의 CDW 상태에 대한 이해를 재정립함으로써, 복잡한 위상과 상관관계가 얽힌 2차원 물질의 기초 물성 연구에 새로운 기준을 제시합니다.", "novelty": "기존의 CDW 모델을 최신 실험 기법으로 재검증하여, 카이랄성이나 궤도 정렬 등 논란이 많았던 현상들의 물리적 토대를 재구성했다는 점이 주목할 만합니다.", "unresolved": "전체 CDW 상태의 형성을 주도하는 핵심적인 구동력(엑시톤 응축 vs 전자-포논 결합) 사이의 정량적 기여도는 여전히 논의의 여지가 있습니다.", "future_work": "초고속 분광학이나 ARPES를 통한 동역학 연구를 통해 상전이 과정에서의 전자-격자 커플링을 직접 관측할 필요가 있습니다.", "concepts": [{"term": "1T-TiSe2", "why_emerged": "CDW 상전이와 반도체-금속 전이를 동시에 보여주는 모델 시스템으로 연구됨.", "origin": "1970년대 이후 반도체 물성 연구에서 광범위하게 확립됨.", "connections": "CDW, 엑시톤 절연체, 층상 TMD 물성 등과 연결됨."}, {"term": "전하 밀도 파동(CDW)", "why_emerged": "전자 밀도의 주기적 변조와 격자 왜곡이 결합된 저차원 물질의 상전이를 이해하기 위해 도입됨.", "origin": "Peierls에 의해 이론적 기틀이 마련됨.", "connections": "쿠퍼 쌍, 스핀 밀도 파동, 전자-포논 결합과 깊은 연관."}], "english_summary": ["Re-examines the CDW superlattice in 1T-TiSe2 using modern structural probes.", "Clarifies the relationship between lattice distortion and electronic phase transitions.", "Addresses long-standing debates regarding exciton condensation and orbital ordering in TMDs."]}}, {"title": "Two-Band Superconductivity in Few-Layer NbSe2 and TaS2", "journal": "PRL_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/p836-tdgw", "authors": "Shahar Simon, Maya Klang, Oded Millo, Hadar Steinberg", "last_authors": "Oded Millo, Hadar Steinberg", "summary": "Author(s): Shahar Simon, Maya Klang, Oded Millo, and Hadar Steinberg The nature of superconductivity in the transition metal dichalcogenide family, particularly $2{\\mathrm{H}\\text{−}\\mathrm{NbSe}}_{2}$ and $2{\\mathrm{H}\\text{−}\\mathrm{TaS}}_{2}$ in the ultrathin limit, is not fully understood. While tunneling measurements apparently show a single superconducting gap,… [Phys. Rev. Lett. 137, 016001] Published Mon Jun 29, 2026", "tier": "B_IMPORTANT_CONDMAT", "score": "9", "reason": "Superconductivity in few-layer NbSe2/TaS2, highly relevant material and electronic structure probe.; demoted from A: broad CM, not direct user/project hit", "tags": ["superconductivity", "NbSe2", "TaS2", "2Dmaterials", "TMDC", "experimental", "tunnelingspectroscopy"], "image": "", "briefing": {"background": "NbSe2와 TaS2 같은 2H-TMD 물질들은 벌크 상태에서 초전도체로 잘 알려져 있으며, 층수를 줄였을 때(ultrathin limit) 나타나는 물성 변화는 현대 응집물질 물리학의 핵심 연구 주제입니다.", "motivation": "극박막(few-layer)으로 갈수록 나타나는 초전도 갭 구조의 변화를 미세하게 관측하여, 단일 밴드가 아닌 다중 밴드(two-band) 초전도성 여부를 확인하고자 했습니다.", "result": "터널링 분광법을 통해 얇은 층에서의 초전도 갭 특성을 분석하여, 두 개의 밴드가 기여하는 초전도 메커니즘의 증거를 제시했습니다.", "implication": "초박막 2D 초전도체에서 다중 밴드 효과가 중요하다는 점을 증명함으로써, 향후 위상 초전도성 및 스핀-궤도 결합 연구에 중요한 데이터를 제공합니다.", "novelty": "기존 측정에서 단순한 단일 갭으로 보이던 현상을 다중 밴드 모델로 세밀하게 분리해냈다는 점에서, 2차원 초전도체의 미시적 이해도를 크게 높였습니다.", "unresolved": "각 밴드에서의 위상적 특성이나 스핀-궤도 결합이 이러한 다중 밴드 초전도성에 미치는 구체적인 영향은 향후 추가적인 이론적 정교화가 필요합니다.", "future_work": "자기장 내에서의 특성 변화(magneto-transport)나 자기 불순물을 통한 초전도 갭 억제 실험을 통해 다중 밴드의 기여도를 검증하는 실험이 이어질 것입니다.", "concepts": [{"term": "2H-NbSe2", "why_emerged": "초전도성과 CDW가 공존하는 대표적인 층상 TMD 물질로 연구됨.", "origin": "1960년대 초전도체 탐색 과정에서 잘 알려짐.", "connections": "2차원 초전도, 위상 물질, 스핀-궤도 결합."}, {"term": "터널링 분광법(STS)", "why_emerged": "국소적인 전자 상태 밀도(DOS)를 에너지 분해능 높게 측정하기 위해 개발됨.", "origin": "Giaever 등에 의해 초전도 갭 관측으로 정립됨.", "connections": "STM, 밴드 구조 분석, 초전도 갭 분포 측정."}], "english_summary": ["Investigates the multi-band superconducting nature of ultrathin NbSe2 and TaS2.", "Uses tunneling spectroscopy to resolve complex gap structures in few-layer limits.", "Challenges the simple single-gap interpretation in 2D transition metal dichalcogenides."]}}, {"title": "Coexistence of liquid-like disordered state and weak ferromagnetism in a s = 1 ka hysics."]}}, {"title": "DC spin current driven by low-frequency light in altermagnets", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/3j6x-397h", "authors": "Yihua Xiao, Ruizhi Dong, Xiaomu Wang, Ruixiang Fei", "last_authors": "Xiaomu Wang, Ruixiang Fei", "summary": "Author(s): Yihua Xiao, Ruizhi Dong, Xiaomu Wang, and Ruixiang Fei Efficient generation of DC spin-polarized currents via light is a promising route toward ultrafast spintronics, yet remains challenging. Here, we show that altermagnets, a class of antiferromagnets with symmetry-driven spin splitting, can generate DC spin currents via the nonlinear spin Hall effect.… [Phys. Rev. B 114, 014405] Published Wed Jul 01, 2026", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Addresses altermagnetism and spin Hall effect, highly relevant to magnetic topological materials.", "tags": ["altermagnet", "spintronics", "Halleffect"], "image": "", "briefing": {"background": "알터마그넷(Altermagnet)은 비자성체와 자성체의 중간적 특성을 띠며, 특정 대칭성으로 인해 페르미 표면의 스핀 분할이 일어나는 새로운 자성 물질군입니다.", "motivation": "알터마그넷의 대칭성 파괴를 이용하여 빛을 통한 효율적인 스핀 전류 생성(스핀트로닉스 소자 응용) 가능성을 규명하고자 합니다.", "result": "알터마그넷에서 비선형 스핀 홀 효과(Nonlinear Spin Hall Effect)를 통해 저주파 빛만으로도 직류 스핀 전류를 생성할 수 있음을 이론적으로 제시했습니다.", "implication": "기존 강자성체 기반 스핀트로닉스의 한계를 넘어, 외부 자기장 없이도 자성 정보를 빠르게 제어할 수 있는 고속 스핀 소자 구현이 가능해집니다.", "novelty": "알터마그넷 특유의 스핀-궤도 결합 없는 스핀 분할 현상을 빛으로 직접 제어한다는 점이 spintronics 분야에서 매우 혁신적입니다.", "unresolved": "제시된 비선형 효과의 효율이 실제 소자 구동에 충분한 크기인지에 대한 실험적 검증이 남아있습니다.", "future_work": "실제 알터마그넷 물질(예: RuO2 등)을 대상으로 한 광전 스핀 전류 측정 및 광-ARPES 기반의 밴드 변화 추적이 기대됩니다.", "concepts": [{"term": "알터마그넷", "why_emerged": "기존의 반강자성체와 강자성체의 분류로 설명되지 않는 대칭성에 의한 스핀 분할 물질을 정의하기 위해 필요함.", "origin": "Šmejkal et al. (2022)", "connections": "Antiferromagnetism, Spin splitting, Symmetry-protected topology"}, {"term": "비선형 스핀 홀 효과", "why_emerged": "스핀-궤도 결합이 없어도 시간 반전 대칭성이 깨진 계에서 스핀 전류를 유도하기 위해 필요함.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "Spin Hall Effect, Berry curvature dipole"}], "english_summary": ["Proposes DC spin current generation in altermagnets via light.", "Utilizes nonlinear spin Hall effect driven by symmetry-induced spin splitting.", "Offers a new scheme for ultrafast, non-magnetic-field-dependent spintronics.", "Altermagnets emerge as promising candidates for high-speed spin control."]}}, {"title": "Interface effects of Pb films on TlBiSe2 and Bi2Se3 topological insulators", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/nxxg-r5b2", "authors": "Roberto Flammini, Oreste De Luca, Martina Casciaro, et al.", "last_authors": "Sergey V. Eremeev, Marco Papagno", "summary": "Author(s): Roberto Flammini, Oreste De Luca, Martina Casciaro, Tommaso Caruso, Fabio Biffoli, Daniela Pacilé, Khatira Z. Mehtiyeva, Ziya S. Aliev, Alexey Barinov, Alfonso Policicchio, Anastasia G. Ryabishchenkova, Fabio Ronci, Stefano Colonna, Evgueni V. Chulkov, Raffaele G. Agostino, Sergey V. Eremeev, and Marco Papagno We present an experimental investigation of the Pb-induced changes on the electronic structure of selected topological insulators, namely, ${\\mathrm{TlBiSe}}_{2}$ and ${\\mathrm{Bi}}_{2}{\\mathrm{Se}}_{3}$. Using spatially resolved and surface-sensitive techniques, including micro-angle-resolved photo… [Phys. Rev. B 114, 045101] Published Wed Jul 01, 2026", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Micro-ARPES investigation of topological insulator interface electronic structure changes.", "tags": ["ARPES", "topologicalinsulator", "material"], "image": "", "briefing": {"background": "위상 절연체(TI)는 표면의 위상적으로 보호된 전자 상태가 중요한 특성입니다. 이러한 표면 상태는 외부 환경(금속 코팅, 흡착물 등)에 의해 쉽게 변형될 수 있는데, 이는 위상적 특성을 제어하거나 소자로 응용하는 데 핵심적인 연구 대상입니다.", "motivation": "TlBiSe2 및 Bi2Se3와 같은 잘 알려진 위상 절연체 표면에 납(Pb) 박막을 증착했을 때, 계면에서 전자 구조가 어떻게 변하는지 Micro-ARPES와 같은 국소적 측정 기법을 통해 상세히 규명하고자 함.", "result": "Pb 증착이 위상 절연체의 표면 상태에 미치는 정량적 변화를 관찰함. 구체적으로 전하 이동이나 밴드 구조의 변형 등 계면에서의 전자 상태 재구성을 보고함.", "implication": "위상 절연체 기반의 이종 접합 소자 제작 시, 금속 전극이나 박막 증착이 위상적 표면 상태에 미치는 영향을 제어하는 가이드라인을 제공함.", "novelty": "Micro-ARPES를 활용하여 계면 효과를 국소적으로 분석했다는 점에서 기존의 벌크 측정보다 정밀한 정보를 제공하며, 특히 TI 표면 상태의 보호 메커니즘과 계면 조절 가능성을 확인한 것이 중요함.", "unresolved": "Pb 증착 조건에 따른 계면 합금화 여부나 장기적인 화학적 안정성에 대한 상세 분석은 추가 검토가 필요함.", "future_work": "다른 금속 흡착물과의 비교 연구 및 위상 절연체 기반 소자 응용을 위한 전기적 전송 특성 실험이 이어질 것으로 예상됨.", "concepts": [{"term": "Micro-ARPES", "why_emerged": "시료의 공간적 불균일성을 측정하고 미세한 영역의 전자 구조를 분석하기 위해 필요함.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "ARPES 기술의 발전형으로 공간 분해능이 향상됨."}, {"term": "위상 절연체(Topological Insulator)", "why_emerged": "내부는 절연체이나 표면은 전도성을 띠는 특이한 양자 상태 연구를 위해 필요함.", "origin": "Hasan & Kane (2010) 등 리뷰 논문들을 통해 정립됨.", "connections": "양자 홀 효과, 위상 불변성, 스핀-궤도 결합과 밀접함."}], "english_summary": ["The study investigates electronic structure changes in TlBiSe2 and Bi2Se3 topological insulators upon Pb deposition.", "Micro-ARPES is utilized to characterize the interface states and potential modifications to topological surface states.", "Results provide insights into how interfacial metallic layers influence the robustness of topological surface bands.", "The work aids in the design of functional topological insulator-based electronic devices."]}}, {"title": "Kondo effect in ferromagnetic quantum critical CeRh6Ge4", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/6w55-56wk", "authors": "Martin Sundermann, Joe D. Thompson, Eric D. Bauer, et al.", "last_authors": "Gertrud Zwicknagl, Andrea Severing", "summary": "Author(s): Martin Sundermann, Joe D. Thompson, Eric D. Bauer, Chun-Fu Chang, Sheng-Huai Chen, Chang-Yang Kuo, Liu Hao Tjeng, Gertrud Zwicknagl, and Andrea Severing The nature of cerium’s 4 f electron is key to understanding the mechanism of pressure-induced quantum criticality in the heavy-fermion ferromagnet CeRh 6 Ge 4 . Combining core-level photoemission and polarized x-ray absorption spectroscopy with simulations based on the single-impurity Anderson model, the authors demonstrate here that Kondo hybridization admixes higher-lying crystal field states into a multiorbital ground state with a 4 f occupancy n f ~ 0.9, which also accounts for the dynamical spin response. The results establish the importance of Kondo hybridization and the resulting multiorbital ground state as essential components for a model of quantum criticality. [Phys. Rev. B 113, 245149] Published Mon Jun 29, 2026", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Spectroscopic investigation (photoemission/XAS) of heavy fermion Kondo physics.", "tags": ["photoemission", "heavyfermion", "material"], "image": "", "briefing": {"background": "자동 브리핑을 생성하지 못했습니다. 초록과 원문 링크를 기준으로 빠르게 확인하세요.", "motivation": "초록 정보만으로는 분야 내부의 구체적 동기를 안정적으로 요약하기 어렵습니다.", "result": "Author(s): Martin Sundermann, Joe D. Thompson, Eric D. Bauer, Chun-Fu Chang, Sheng-Huai Chen, Chang-Yang Kuo, Liu Hao Tjeng, Gertrud Zwicknagl, and Andrea Severing The nature of cerium’s 4 f electron is key to understanding the mechanism of pressure-induced quantum criticality in the heavy-fermion ferromagnet CeRh 6 Ge 4 . Combining core-level photoemission and polarized x-ray absorption spectroscopy with simulations based on the single-impurity Anderson model, the authors demonstrate here that Kondo hybridization admixes higher-lying crystal field states into a multiorbital ground state with a 4 f occupancy n f ~ 0.9, which also accounts for the dynamical spin response. The results establish the importance of Kondo hybridization and the resulting multiorbital ground state as essential components for a model of quantum criticality. [Phys. Rev. B 113, 245149] Published Mon Jun 29, 2026", "implication": "필터가 이 논문을 통과시킨 이유는 관련 키워드, 저자, 또는 Gemini relevance score 때문입니다.", "novelty": "Spectroscopic investigation (photoemission/XAS) of heavy fermion Kondo physics.", "unresolved": "원문 확인 후 열린 질문을 판단해야 합니다.", "future_work": "후속 실험, 독립 재현, 관련 물질/조건 확장이 가능한지 확인하세요.", "concepts": [], "english_summary": ["The detailed AI briefing was unavailable for this paper.", "Use the abstract, score reason, and original link for a quick first pass."]}}, {"title": "Nonthermal melting and density wave instability coupled to the lattice in La4Ni3O10", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/f1ll-pr86", "authors": "Chen Zhang, Lixing Chen, Qi-Yi Wu, et al.", "last_authors": "Jun Zhao, Jian-Qiao Meng", "summary": "Author(s): Chen Zhang, Lixing Chen, Qi-Yi Wu, Congcong Le, Xianxin Wu, Hao Liu, Bo Chen, Ying Zhou, Zhong-Tuo Fu, Chun-Hui Lv, Zi-Jie Xu, Hai-Long Deng, Enkang Zhang, Yinghao Zhu, H. Y. Liu, Yu-Xia Duan, Jun Zhao, and Jian-Qiao Meng The recent discovery of high-temperature superconductivity in pressurized nickelates has renewed interest in the broken-symmetry states of their ambient-pressure parent phases, where a density wave (DW) order emerges and competes with superconductivity, but its microscopic origin remains unresolved.… [Phys. Rev. B 113, L241121] Published Mon Jun 29, 2026", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Study of nickelate density waves and competing orders relevant to correlated electron systems.", "tags": ["nickelate", "superconductivity", "density-wave"], "image": "", "briefing": {"background": "니켈산화물(Nickelates)은 큐프레이트와 유사한 전자 구조를 가져 고온 초전도체 후보군으로 주목받아 왔습니다. 특히 상압 상태에서 나타나는 전하 밀도 파동(DW)과 같은 대칭성 파괴 상태는 초전도성과 경쟁하거나 밀접하게 연관되어 있어 이를 이해하는 것이 매우 중요합니다.", "motivation": "La4Ni3O10 화합물에서 관찰되는 전하 밀도 파동(DW)과 격자 불안정성이 고온 초전도성과 어떤 관계를 맺는지, 그리고 미시적 기원이 무엇인지 규명하고자 함.", "result": "La4Ni3O10에서 나타나는 DW 상태가 격자 왜곡과 결합되어 있음을 확인하였으며, 열적 평형 상태를 벗어난 비열적(nonthermal) 융해 거동을 분석함.", "implication": "니켈산화물 초전도체의 모상(parent phase)에서 나타나는 질서 상태를 명확히 함으로써, 초전도 현상을 발현시키기 위한 위상 제어 및 도핑 전략에 중요한 정보를 제공함.", "novelty": "니켈산화물에서 초전도성과 경쟁하는 DW 상태의 미시적 기원을 격자 결합 측면에서 규명했다는 점이 핵심적이며, 층상 니켈산화물의 물성 이해를 확장함.", "unresolved": "DW 상태와 초전도성 사이의 정확한 상호작용 메커니즘(협동적 혹은 경쟁적 관계)은 여전히 추가 연구가 필요함.", "future_work": "고압 환경에서의 DW 억제 및 초전도 발현 과정에 대한 분광학적/회절 실험이 후속될 것으로 기대됨.", "concepts": [{"term": "전하 밀도 파동(Density Wave)", "why_emerged": "강상관 전자계에서 전자 밀도가 공간적으로 주기적인 변조를 일으키는 상태를 설명하기 위해 필요함.", "origin": "Peierls (1955) 등이 일차원 금속의 불안정성으로 처음 제시함.", "connections": "초전도성과의 경쟁, 페르미 면의 네스팅(nesting)과 관련됨."}, {"term": "니켈산화물(Nickelates)", "why_emerged": "구조적으로 큐프레이트와 유사한 전이금속 산화물에서 새로운 초전도성을 찾기 위해 필요함.", "origin": "Li et al. (2019) 등 최근 박막 기반 초전도 발견이 기폭제가 됨.", "connections": "구리 산화물(Cuprates), 3d 궤도 물성."}], "english_summary": ["Investigation of non-thermal melting of density wave (DW) order in La4Ni3O10.", "The study links DW instabilities to lattice degrees of freedom in these nickelate materials.", "Understanding these broken-symmetry states is crucial for interpreting high-Tc superconductivity in pressurized nickelates.", "Results provide foundational evidence for competing orders in the nickelate phase diagram."]}}, {"title": "Odd-parity altermagnetism: A spin group study", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/7kmk-yl2t", "authors": "Minghuan Zeng, Zheng Qin, Ling Qin, et al.", "last_authors": "Dong-Hui Xu, Rui Wang", "summary": "Author(s): Minghuan Zeng, Zheng Qin, Ling Qin, Shiping Feng, Lin Wu, Dong-Hui Xu, and Rui Wang Conventional altermagnetism, characterized by the even-parity spin splitting, has been intensively studied. Here, on the basis of spin-group analyses, the authors elucidate necessary conditions for the emergence of odd-parity altermagnetism. It is derived that the odd-parity altermagnetism arises from the following criteria: (i) the breaking nonmagnetic time reversal symmetry; (ii) the collinear compensated magnetism; (iii) the symmetry [ C 2 | | E ¯ ] connecting opposite-spin sublattices, where C 2 and E ¯ respectively represent a 180° rotation around the axis perpendicular to spins and the inversion separating opposite-spin sublattices. [Phys. Rev. B 113, L220412] Published Wed Jun 24, 2026", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Theory of altermagnetism relevant to modern magnetic topology.", "tags": ["theory", "altermagnetism", "topology"], "image": "", "briefing": {"background": "자성체에서 전자의 스핀이 밴드 구조를 어떻게 갈라놓는지는 물리적 성질을 결정짓는 핵심 요소입니다. 기존의 강자성체나 반강자성체와는 달리, 최근 주목받는 '알터마그네티즘(Altermagnetism)'은 순 자화가 0이면서도 스핀 분열이 나타나는 새로운 자기 질서입니다.", "motivation": "기존에 연구된 알터마그네티즘은 주로 짝패리티(even-parity) 스핀 분열에 집중되어 왔습니다. 이 연구는 스핀 그룹 이론을 통해 상대적으로 덜 알려진 '홀패리티(odd-parity)' 알터마그네티즘이 존재할 수 있는 대칭성 조건을 명확히 규명하고자 합니다.", "result": "비자기적 시간 역전 대칭성 파괴, 상쇄되는 자기 모멘트, 그리고 특정 대칭성 요소(회전 및 반전 결합)를 만족해야 홀패리티 알터마그네티즘이 나타날 수 있음을 이론적으로 도출했습니다.", "implication": "알터마그네틱 위상 물질의 탐색 범위를 넓히고, 스핀트로닉스 소자 응용을 위한 새로운 물리적 상태를 정의합니다.", "novelty": "스핀 그룹 이론을 체계적으로 적용하여 알터마그네티즘의 분류 체계를 완성했다는 점이 중요합니다. 자기적 위상 물질과 Berry 곡률을 연구하는 사용자에게 새로운 물질 후보군을 설계할 이론적 토대를 제공합니다.", "unresolved": "이러한 대칭성을 실제로 만족하는 구체적인 화합물 후보의 제시는 논문 범위를 벗어나 있습니다.", "future_work": "이론적으로 도출된 대칭성 조건을 만족하는 구체적인 결정 구조를 가진 물질을 탐색하고, ARPES를 통해 실제 스핀 분열을 검증하는 연구가 필요합니다.", "concepts": [{"term": "Altermagnetism", "why_emerged": "기존 강자성체와 반강자성체의 이분법을 넘어, 비상식적인 스핀 특성을 가진 새로운 자기 질서를 설명하기 위해 필요.", "origin": "최근 3~4년 내 이론적 체계화(주로 Jungwirth 그룹 등).", "connections": "반강자성체, 스핀트로닉스, 베리 곡률 기반 위상 물질."}, {"term": "Spin-group symmetry", "why_emerged": "자기 구조 내에서 공간 대칭성과 스핀 회전을 결합하여 밴드 구조의 스핀 의존성을 기술하기 위해 도입.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "자기 점군(magnetic point groups), 결정 대칭성."}], "english_summary": ["This study categorizes odd-parity altermagnetism using spin-group analysis.", "The researchers defined necessary criteria for odd-parity splitting in compensated magnets.", "Key conditions include breaking nonmagnetic time-reversal symmetry and specific rotational-inversion symmetries.", "The findings expand the theoretical framework for identifying novel magnetic topological materials."]}}, {"title": "Quasiparticle interference in LiFeAs: Signature of inelastic tunneling through spin fluctuations", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/6s6t-5396", "authors": "Shun Chi, Carolina A. Marques, W. N. Hardy, et al.", "last_authors": "S. A. Burke, Peter Wahl", "summary": "Author(s): Shun Chi, Carolina A. Marques, W. N. Hardy, Ruixing Liang, Pinder Dosanjh, D. A. Bonn, S. A. Burke, and Peter Wahl Quasiparticle interference (QPI) is a powerful tool to characterize the symmetry of the superconducting order parameter in unconventional superconductors, by mapping the spatial dependence of elastic tunneling of electrons between the tip of a scanning tunneling microscope and a sample. Here, we con… [Phys. Rev. B 113, 235148] Published Wed Jun 24, 2026", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Important STM/QPI study on an iron-based superconductor.", "tags": ["experiment", "STM", "superconductivity"], "image": "", "briefing": {"background": "철 기반 초전도체(FeSC)에서 초전도 쌍의 대칭성을 이해하는 것은 고온 초전도 메커니즘을 밝히는 핵심입니다. LiFeAs는 깨끗한 표면을 얻기 쉬워 STM 기반의 준입자 간섭(QPI) 실험의 표준 모델로 쓰입니다.", "motivation": "탄성 산란 이외에, 전자와 스핀 요동 사이의 상호작용으로 인해 발생하는 '비탄성 터널링(inelastic tunneling)' 효과가 QPI 이미지에 어떻게 기여하는지 분석하고자 합니다.", "result": "LiFeAs의 QPI 데이터에서 비탄성 터널링 과정을 분리해내어, 이것이 초전도 상태의 스핀 요동과 직접적으로 연결되어 있음을 보였습니다.", "implication": "단순한 밴드 구조 매핑을 넘어, 초전도체의 동역학적 특성 및 결합 상호작용을 STM으로 직접 탐색할 수 있음을 입증합니다.", "novelty": "QPI 데이터를 통해 단순히 밴드 구조를 시각화하는 수준을 넘어, 스핀 요동과 같은 다체 상호작용의 흔적을 추출해낸 점이 전자 구조 연구자에게 매우 유익합니다.", "unresolved": "비탄성 터널링의 신호와 강한 결합 영역에서의 준입자 감쇠 효과를 완벽하게 분리하는 것은 여전히 실험적 난제로 남아 있습니다.", "future_work": "다른 FeSC 물질이나 더 복잡한 상관관계 시스템에서의 비탄성 터널링 효과에 대한 추가 비교 연구가 예상됩니다.", "concepts": [{"term": "Quasiparticle interference (QPI)", "why_emerged": "물질 표면의 결함에 의해 발생하는 전자 산란 패턴을 통해 페르미 면과 초전도 갭 구조를 시각화하기 위해 사용.", "origin": "2000년대 초반, Hoffman et al.에 의해 구리 산화물 초전도체에서 확립.", "connections": "ARPES(페르미 면 매핑), STM/STS."}, {"term": "Inelastic tunneling", "why_emerged": "터널링 전자가 에너지 손실을 겪으며 샘플과 상호작용할 때 발생하는 신호를 분석하기 위해 필요.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "전자-포논 결합, 스핀 요동, inelastic electron tunneling spectroscopy(IETS)."}], "english_summary": ["Investigation of quasiparticle interference (QPI) in LiFeAs using STM.", "The study identifies signatures of inelastic tunneling through spin fluctuations.", "Distinguishes between elastic scattering and dynamic interaction effects in the tunneling spectrum.", "Provides evidence for the role of spin fluctuations in unconventional superconductivity."]}}, {"title": "Spatiotemporal migration of antiferromagnetic domain walls in Sr2IrO4", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/f939-clb5", "authors": "Ian Robinson, David Yang, Ross Harder, et al.", "last_authors": "Joerg Hallmann, Anders Madsen", "summary": "Author(s): Ian Robinson, David Yang, Ross Harder, Dina Sheyfer, Longlong Wu, Jack Griffiths, Emil Bozin, Mark P. M. Dean, Jialun Liu, Hengdi Zhao, Gang Cao, Angel Rodriguez-Fernandez, Jan-Etienne Pudell, Roman Shayduk, James Wrigley, Alexey Zozulya, Rustam Rysov, Aliaksandr Leonau, Ulrike Boesenberg, Joerg Hallmann, and Anders Madsen While laser-driven demagnetization and magnetic x-ray scattering in Sr 2 IrO 4 are both well-established, the combination in a pump-probe experiment at an x-ray free electron laser is new. Micron-sized antiferromagnetic domains have been seen by other methods, but not the more subtle phase domains to which coherent scattering is sensitive. By measuring the temporal and spatial changes in the domain walls in a single experiment, the authors are able to establish here a wall-migration velocity for the first time. [Phys. Rev. B 113, L220410] Published Wed Jun 24, 2026", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Advanced X-ray scattering study on magnetic domain dynamics.", "tags": ["experiment", "magnetism", "scattering"], "image": "", "briefing": {"background": "Sr2IrO4는 스핀-궤도 결합과 강한 상관관계가 얽힌 대표적인 Mott 절연체입니다. 자기적 도메인의 동역학을 이해하는 것은 물질의 상변이 메커니즘을 파악하는 데 필수적입니다.", "motivation": "기존의 정적인 관측을 넘어, X-선 자유 전자 레이저(XFEL)를 이용한 펌프-프로브 실험으로 자기 도메인 벽의 실제 이동 속도를 실시간으로 측정하고자 합니다.", "result": "Sr2IrO4의 미세 자기 도메인 구조가 펨토초 레이저 펌핑 하에서 어떻게 변화하는지 공간적, 시간적으로 추적하여 도메인 벽의 이동 속도를 최초로 정량화했습니다.", "implication": "강상관 전자계에서 위상적 결함이나 자기 도메인이 외부 자극에 어떻게 반응하는지에 대한 근본적인 물리적 이해를 제공합니다.", "novelty": "XFEL을 사용하여 단일 실험에서 자기 도메인 벽의 이동 속도를 측정했다는 점에서 실험 기법상 중요한 진전입니다.", "unresolved": "측정된 도메인 벽 이동 속도가 정확히 어떤 미시적 메커니즘(스핀-격자 결합 등)에 의해 제한되는지는 추가 분석이 필요합니다.", "future_work": "다양한 외부 자극 하에서의 도메인 벽 동역학 변화를 관찰하고, 이를 위상 절연체나 다른 자기 질서 물질로 확장할 것으로 보입니다.", "concepts": [{"term": "X-ray free electron laser (XFEL)", "why_emerged": "극도로 짧은 시간과 나노미터 규모의 공간 해상도를 동시에 만족하여 물질의 동역학적 변화를 관측하기 위해 등장.", "origin": "2000년대 후반 LCLS 가동 이후 활발해짐.", "connections": "Coherent X-ray scattering, 펌프-프로브 분광학."}, {"term": "Antiferromagnetic domains", "why_emerged": "반강자성체 내부의 자기 정렬 방향이 다른 영역들을 구분하여 물질의 전체 자기 상태를 이해하기 위해 필요.", "origin": "전통적인 자기 연구의 핵심 개념.", "connections": "자기 위상, 도메인 벽 역학, 스핀트로닉스."}], "english_summary": ["Real-time observation of antiferromagnetic domain wall migration in Sr2IrO4.", "Uses pump-probe X-ray scattering at an X-ray free electron laser (XFEL).", "Successfully measures domain wall velocity for the first time in this material.", "Highlights dynamic behavior of magnetic orders under laser excitation."]}}, {"title": "Theoretical study on ambient-pressure superconductivity in La3Ni2O7 thin films: Structural analysis, model construction, and robustness of s±-wave pairing", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/ql1x-2k9q", "authors": "Kensei Ushio, Shu Kamiyama, Yuto Hoshi, et al.", "last_authors": "Kazuhiko Kuroki, Hirofumi Sakakibara", "summary": "Author(s): Kensei Ushio, Shu Kamiyama, Yuto Hoshi, Ryota Mizuno, Masayuki Ochi, Kazuhiko Kuroki, and Hirofumi Sakakibara We theoretically study ambient-pressure superconductivity in thin films of ${\\mathrm{La}}_{3}{\\mathrm{Ni}}_{2}{\\mathrm{O}}_{7}$. We construct model Hamiltonians adopting the crystal structure theoretically determined by fixing the in-plane lattice constant to those substrates examined in the experim… [Phys. Rev. B 114, 014501] Published Wed Jul 01, 2026", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Relevant theoretical study on high-Tc nickelate superconductors.", "tags": ["superconduct", "nickelates", "theory"], "image": "", "briefing": {"background": "니켈산염(Nickelates)은 큐프레이트와 유사한 전자 구조를 가지면서도 고온 초전도성을 구현할 수 있는 후보 물질로 주목받고 있습니다. 특히 La3Ni2O7은 고압 환경에서 초전도 현상이 보고된 이후, 상압에서도 초전도성을 유도하려는 시도가 활발히 진행되고 있습니다.", "motivation": "La3Ni2O7의 구조적 변형 및 박막화를 통해 상압 환경에서 초전도 상태를 유지할 수 있는 물리적 조건과 전자 상태를 이론적으로 규명하고자 합니다.", "result": "La3Ni2O7 박막 구조에 기반한 모델 해밀토니안을 구축하여 분석한 결과, 특정 조건에서 s±-파(s±-wave) 쌍형성이 강건하게 나타남을 제시했습니다.", "implication": "상압에서의 니켈산염 초전도체 구현 가능성을 뒷받침하며, 이는 향후 고온 초전도체 연구의 새로운 플랫폼으로서의 가능성을 열어줍니다.", "novelty": "실제 실험에서 사용 가능한 기판과 박막 구조를 고려한 현실적인 이론 모델을 구축했다는 점에서 강력한 물리적 통찰을 제공합니다.", "unresolved": "이론적 모델에서 가정한 최적화된 격자 구조가 실험적으로 완벽히 구현될 수 있을지는 아직 확증되지 않았습니다.", "future_work": "박막 성장 기술과 결합한 실제 ARPES 실험을 통해 이론적으로 예측된 전자 구조와 밴드갭의 특징을 검증해야 합니다.", "concepts": [{"term": "s±-wave pairing", "why_emerged": "페르미 면 사이의 부호가 다른 초전도 갭의 존재를 설명하기 위해 필요함.", "origin": "철 기반 초전도체 연구에서 주로 제안됨(Mazin et al., 2008).", "connections": "큐프레이트의 d-파(d-wave)와 대비되는 전자-보손 상호작용 매커니즘."}], "english_summary": ["Theoretical study on La3Ni2O7 thin film superconductivity at ambient pressure.", "Constructed a model Hamiltonian based on realistic substrate-influenced crystal structures.", "Identified robust s±-wave pairing symmetry as the likely ground state.", "Provides a theoretical roadmap for engineering ambient-pressure nickelate superconductors."]}}, {"title": "Exciton-Anyon Binding in Fractional Chern Insulators: Spectral Fingerprints", "journal": "PRL_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/8bp8-g8g4", "authors": "Tianhong Lu, Luiz H. Santos", "last_authors": "Tianhong Lu, Luiz H. Santos", "summary": "Author(s): Tianhong Lu and Luiz H. Santos Transition-metal dichalcogenides (TMDs) uniquely combine topological electronic   appendLabeledText(headText, 'why', 'Filter reason: ', r.reason);
  if (r.tags && r.tags.length) { const tags = document.createElement('div'); tags.className = 'tags'; r.tags.forEach(tag => tags.appendChild(textEl('span', 'tag', '#' + tag))); headText.appendChild(tags); }
  if (r.link) { const link = document.createElement('a'); link.className = 'link'; link.href = r.link; link.target = '_blank'; link.rel = 'noopener noreferrer'; link.textContent = 'Open paper'; headText.appendChild(link); }
  head.appendChild(headText);
  if (r.summary) { const abstract = document.createElement('p'); abstract.className = 'original-abstract'; const strong = textEl('strong', '', 'Original abstract'); abstract.appendChild(strong); abstract.append(r.summary); head.appendChild(abstract); }
  slideEl.appendChild(head);
  const briefing = document.createElement('div');
  briefing.className = 'briefing';
  appendBriefSection(briefing, 'Background', b.background);
  appendBriefSection(briefing, 'Motivation', b.motivation);
  appendBriefSection(briefing, 'Result', b.result);
  appendBriefSection(briefing, 'Implication', b.implication);
  appendBriefSection(briefing, "Why it's important / Novelty", b.novelty);
  appendBriefSection(briefing, 'Unresolved Questions', b.unresolved);
  appendBriefSection(briefing, 'Expected Future Work', b.future_work);
  if (b.concepts && b.concepts.length) {
    const section = document.createElement('section');
    section.className = 'brief-section wide';
    section.appendChild(textEl('h2', '', 'Concepts / Terms'));
    const concepts = document.createElement('div');
    concepts.className = 'concepts';
    b.concepts.forEach(c => {
      const item = document.createElement('div');
      item.className = 'concept';
      item.appendChild(textEl('h3', '', c.term || 'Concept'));
      [['왜 생겼나: ', c.why_emerged], ['누가 만들었나: ', c.origin], ['연결되는 흐름: ', c.connections]].forEach(([label, text]) => { if (!text) return; const p = document.createElement('p'); const bold = textEl('b', '', label); p.appendChild(bold); p.append(text); item.appendChild(p); });
      concepts.appendChild(item);
    });
    section.appendChild(concepts);
    briefing.appendChild(section);
  }
  if (b.english_summary && b.english_summary.length) { const section = document.createElement('section'); section.className = 'brief-section wide'; section.appendChild(textEl('h2', '', 'English Summary')); const ul = document.createElement('ul'); b.english_summary.slice(0, 5).forEach(line => ul.appendChild(textEl('li', '', line))); section.appendChild(ul); briefing.appendChild(section); }
  slideEl.appendChild(briefing);
  counterEl.textContent = `${index + 1} / ${slides.length}`;
  prevBtn.disabled = index === 0;
  nextBtn.disabled = index === slides.length - 1;
}
prevBtn.addEventListener('click', () => { index = Math.max(0, index - 1); render(); });
nextBtn.addEventListener('click', () => { index = Math.min(slides.length - 1, index + 1); render(); });
document.addEventListener('keydown', event => { if (event.key === 'ArrowLeft') prevBtn.click(); if (event.key === 'ArrowRight') nextBtn.click(); });
render();
</script>
</body>
</html>
