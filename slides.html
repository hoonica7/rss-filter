<title>Daily Paper Slideshow</title>
<style>
  :root {
    color-scheme: light;
    --bg: #f6f7f4;
    --paper: #ffffff;
    --ink: #111827;
    --muted: #64748b;
    --line: #d8ddd2;
    --accent: #176b87;
    --accent-2: #9a3412;
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; overflow: auto; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: var(--bg); color: var(--ink); }
  .shell { max-width: 1500px; min-height: 100vh; margin: 0 auto; padding: 14px 18px; display: flex; flex-direction: column; }
  .topbar { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 16px; }
  .top-actions { display: flex; align-items: center; gap: 10px; }
  .topbar a, button { border: 1px solid var(--line); border-radius: 8px; background: var(--paper); color: var(--ink); padding: 10px 14px; font-weight: 700; text-decoration: none; cursor: pointer; }
  button.primary { background: var(--accent); border-color: var(--accent); color: white; }
  button:disabled { opacity: 0.45; cursor: not-allowed; }
  .counter { color: var(--muted); font-weight: 700; }
  .slide { min-height: calc(100vh - 82px); background: var(--paper); border: 1px solid var(--line); border-radius: 10px; padding: 18px; box-shadow: 0 18px 42px rgba(15, 23, 42, 0.10); display: grid; grid-template-columns: minmax(310px, 0.86fr) minmax(0, 1.55fr); gap: 18px; overflow: visible; }
  .paper-head { min-width: 0; min-height: 0; overflow: visible; display: flex; flex-direction: column; gap: 12px; }
  .figure { margin: 0; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: #f8fafc; }
  .figure img { display: block; width: 100%; max-height: 41vh; object-fit: contain; background: white; }
  .figure figcaption { padding: 7px 10px; color: var(--muted); font-size: 12px; line-height: 1.3; }
  .head-text { display: flex; flex-direction: column; gap: 9px; min-width: 0; }
  .badges { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .badge { border-radius: 999px; padding: 5px 9px; background: #eef2ff; color: #3730a3; font-size: 12px; font-weight: 800; }
  .score { background: #fee2e2; color: #991b1b; }
  h1 { margin: 0; font-size: 25px; line-height: 1.15; letter-spacing: 0; overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
  h1 a { color: inherit; text-decoration-color: rgba(23, 107, 135, 0.35); text-decoration-thickness: 2px; text-underline-offset: 4px; }
  h1 a:hover { color: var(--accent); text-decoration-color: var(--accent); }
  .meta, .authors, .why, .abstract { font-size: 13px; line-height: 1.45; }
  .meta, .authors { color: var(--muted); }
  .why strong, .abstract strong, .authors strong { color: var(--ink); }
  .authors { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .why { border-left: 4px solid var(--accent-2); padding-left: 10px; color: #374151; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .abstract { border-top: 1px solid var(--line); padding-top: 14px; color: #374151; }
  .original-abstract { border-top: 1px solid var(--line); padding-top: 10px; color: #374151; font-size: 11.5px; line-height: 1.35; overflow-wrap: anywhere; }
  .original-abstract strong { display: block; margin-bottom: 4px; color: var(--ink); }
  .tags { display: flex; flex-wrap: wrap; gap: 8px; }
  .tag { border-radius: 999px; padding: 4px 8px; background: #f1f5f9; color: #475569; font-size: 12px; font-weight: 700; }
  .head-text > .link { display: none; }
  .briefing { min-width: 0; min-height: 0; overflow: visible; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); grid-auto-rows: minmax(0, auto); align-content: start; gap: 11px 18px; border-top: 0; padding-top: 0; }
  .brief-section { min-width: 0; }
  .brief-section.wide { grid-column: 1 / -1; }
  .brief-section h2 { margin: 0 0 4px; font-size: 14px; line-height: 1.22; color: #0f766e; letter-spacing: 0; }
  .brief-section p, .brief-section li { margin: 0; font-size: 12.5px; line-height: 1.42; color: #1f2937; overflow-wrap: anywhere; }
  .brief-section ul { margin: 0; padding-left: 20px; }
  .concepts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 9px 14px; }
  .concept { border-top: 1px solid var(--line); padding-top: 7px; }
  .concept h3 { margin: 0 0 4px; font-size: 13px; color: #7c2d12; letter-spacing: 0; }
  .concept p { margin: 2px 0 0; font-size: 11.5px; line-height: 1.35; color: #374151; overflow-wrap: anywhere; }
  .concept b { color: #111827; }
  .link { color: var(--accent); font-weight: 800; text-decoration: none; }
  .empty { padding: 48px; background: var(--paper); border: 1px solid var(--line); border-radius: 12px; color: var(--muted); }
  @media (max-width: 860px) {
    .shell { padding: 14px; }
    .topbar, .top-actions { align-items: stretch; flex-direction: column; }
    .slide, .briefing, .concepts { grid-template-columns: 1fr; }
    .slide { min-height: auto; overflow: visible; display: grid; }
    h1 { font-size: 28px; }
  }
</style>

<script>
const slides = [{"title": "Observation of spin-free interatomic orbital angular momentum in a chiral crystal", "journal": "arXiv_CondMat", "source": "author whitelist", "link": "https://arxiv.org/abs/2605.21124", "authors": "Dongjin Oh, Sungsoo Hahn, Chiara Pacella, et al.", "last_authors": "Domenico Di Sante, Changyoung Kim", "summary": "The inherent spin-orbit interaction of electrons inevitably couples spin to the orbital angular momentum (OAM), posing a fundamental challenge to spin-free orbital transport. Here, we propose a novel strategy to achieve spin-decoupled OAM states in crystalline solids. Using angle-resolved photoemission spectroscopy (ARPES), we resolve well-isolated s-orbital bands in a chiral Te crystal, clearly separated from the p-orbital manifold. Combined circular dichroism ARPES and first-principles calculations reveal that these bands host OAM arising exclusively from interatomic hopping, with no intra-atomic contribution. Spin-resolved ARPES further confirms the absence of spin angular momentum (SAM), providing decisive evidence of spin-free OAM states. These findings establish the existence of OAM without spin polarization in crystalline solids and highlight the essential role of inter-atomic OAM. This work provides a general framework for designing spinless OAM states, opening an opportunity toward pure orbital currents for orbitronics.", "tier": "A_MUST_READ", "score": "10", "reason": "author whitelist: Changyoung Kim", "tags": ["ARPES", "angle-resolvedphotoemission", "photoemission", "circulardichroism", "transport"], "image": "https://arxiv.org/html/2605.21124v2/Fig.1.png", "briefing": {"background": "고체 물리학에서 궤도 각운동량(OAM)은 일반적으로 스핀-궤도 결합(SOC)을 통해 스핀 각운동량(SAM)과 밀접하게 얽혀 있어, 순수한 궤도 자유도만을 제어하는 '오비트로닉스(Orbitronics)' 구현에 어려움이 있었습니다.", "motivation": "이 연구는 스핀과 분리된 궤도 각운동량 상태를 결정질 고체 내에서 구현하고 관측할 수 있는 설계 전략을 제시하고자 했습니다.", "result": "키랄성(chiral)을 가진 Te 결정에서 s-궤도 밴드를 분리해내어, 원자 내 기여가 없는 '원자 간 호핑(interatomic hopping)'에 의해서만 발생하는 스핀-무관 궤도 각운동량을 ARPES 및 CD-ARPES를 통해 입증했습니다.", "implication": "스핀 편극 없이 궤도 각운동량만을 가진 상태를 구현함으로써, 향후 스핀 소모를 줄인 순수 궤도 전류 기반의 새로운 소자 응용 가능성을 열었습니다.", "novelty": "기존의 SOC 기반 시스템과 달리 '스핀 없는 궤도 각운동량'이라는 새로운 개념을 실험적으로 확실히 증명했으며, 저자인 Changyoung Kim 그룹의 전문성이 반영된 고정밀 ARPES 분석이 돋보입니다.", "unresolved": "이러한 순수 궤도 상태가 실제 외부 전기장이나 자기장 하에서 얼마나 안정적으로 유지되는지에 대한 동역학적 특성은 추가 연구가 필요합니다.", "future_work": "이러한 스핀-무관 궤도 각운동량을 이용한 수송 현상 측정 및 실제 오비트로닉스 소자 제작을 위한 제어 기술 개발이 기대됩니다.", "concepts": [{"term": "키랄 결정(Chiral crystal)", "why_emerged": "공간 반전 대칭성이 깨진 구조에서 나타나는 독특한 위상학적 및 전자적 특성을 연구하기 위해 필요함.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "Weyl 반금속, 베리 곡률, 고차원 위상 절연체."}, {"term": "CD-ARPES", "why_emerged": "광자의 원편광(circular polarization)을 이용해 밴드의 궤도 각운동량 상태와 대칭성을 구분하기 위해 개발됨.", "origin": "수십 년간 광전자 분광학 발전에 따라 정립됨.", "connections": "ARPES, 자기 원편광 이색성(XMCD)."}], "english_summary": ["Demonstrates spin-free orbital angular momentum (OAM) in chiral Tellurium crystals.", "Utilizes ARPES and CD-ARPES to isolate s-orbital bands decoupled from spin-orbit interaction.", "Proves OAM arises solely from interatomic hopping rather than intra-atomic contributions.", "Provides a foundational platform for future orbitronics applications without spin currents."]}}, {"title": "3D bulk-resolved g-wave altermagnetic order parameter in CrSb", "journal": "Nature", "source": "Gemini", "link": "https://www.nature.com/articles/s41586-026-10902-z", "authors": "Mengmeng Long, Theodore I. Weinberger, Zheyu Wu, et al.", "last_authors": "F. Malte Grosche, Alexander G. Eaton", "summary": "Quantum oscillation measurements map the g-wave altermagnetic order parameter in CrSb, establishing it as a prototypical unconventional magnet with momentum-dependent spin splitting.", "tier": "A_MUST_READ", "score": "9", "reason": "Direct experimental evidence of altermagnetic order and momentum-dependent spin splitting in CrSb.", "tags": ["material", "altermagnetism", "quantum-oscillations"], "image": "https://media.springernature.com/m685/springer-static/image/art%3A10.1038%2Fs41586-026-10902-z/MediaObjects/41586_2026_10902_Fig1_HTML.png", "briefing": {"background": "최근 자성체 연구에서 스핀과 궤도 자유도가 얽혀 운동량 공간에서 특이한 스핀 분할을 보이는 알터자성(altermagnetism)이 강한 주목을 받고 있습니다.", "motivation": "CrSb 물질에서 이론적으로 예측된 알터자성 순서 변수(order parameter)와 g-wave 대칭성을 실험적으로 명확히 규명하고자 했습니다.", "result": "양자 진동 측정(quantum oscillation)을 통해 CrSb 내부의 벌크 전자 구조에서 운동량 의존적 스핀 분할을 확인하고, g-wave 알터자성 거동을 성공적으로 매핑했습니다.", "implication": "알터자성이 단순히 이론적 모델을 넘어 실제 물질계에서 구현되는 핵심적인 비전통적 자성 상태임을 입증했습니다.", "novelty": "알터자성 분야에서 직접적인 벌크 측정을 통한 실험적 증거를 제시했다는 점에서 매우 큰 학술적 가치를 지닙니다.", "unresolved": "이러한 알터자성 상태가 외부 변수(압력, 도핑 등)에 의해 어떻게 제어되는지, 그리고 초전도체와의 계면에서 어떤 근접 효과를 보이는지는 미지수입니다.", "future_work": "알터자성 물질에서의 비상식적인 수송 현상 측정 및 초전도체와의 이종접합을 통한 새로운 위상학적 상태 연구가 예상됩니다.", "concepts": [{"term": "알터자성(Altermagnetism)", "why_emerged": "강자성체와 반강자성체의 특성을 넘어선, 스핀 분할이 운동량 공간에서 대칭적으로 나타나는 새로운 자성 유형의 필요성.", "origin": "최근 2020년대 들어 이론적 틀이 체계화됨.", "connections": "반강자성, 스핀-궤도 토크, 스핀트로닉스."}, {"term": "g-wave 대칭성", "why_emerged": "알터자성체에서 나타나는 스핀 분할의 각도 의존적 특성을 분류하기 위한 대칭성 지표.", "origin": "군론 및 자성 이론에 기초함.", "connections": "d-wave 초전도체, 페르미 면 위상학."}], "english_summary": ["Provides definitive experimental evidence of g-wave altermagnetic order in CrSb.", "Employs quantum oscillation techniques to map momentum-dependent spin splitting.", "Confirms CrSb as a prototypical material for unconventional altermagnetic behavior.", "Advances understanding of spin-splitting in magnetic materials without net magnetization."]}}, {"title": "Hierarchy of quantum corrections to resistivity of a γ−Al2O3/SrTiO3 two-dimensional electron gas", "journal": "PRB_Recent", "source": "author whitelist", "link": "http://link.aps.org/doi/10.1103/6xfk-zwrl", "authors": "Jiwon Yang, Akira Endo, Daisuke Shiga, et al.", "last_authors": "Hiroshi Kumigashira, Mikk Lippmaa", "summary": "A resistance upturn that occurs in SrTiO 3 -based two-dimensional electron gases at low temperatures is often attributed to Kondo scattering of carriers from localized spins. We show that the low-temperature transport behavior of the electron gas that forms at the γ − Al 2 O 3 / SrTiO 3 interface is governed by a whole hierarchy of quantum corrections in addition to the Kondo contribution. Upon cooling, the resistance shows a typical Kondo-like upturn, but then decreases due to weak antilocalization, and finally vanishes at the superconducting transition. When superconductivity is suppressed by applying a magnetic field or by reducing the carrier density, a logarithmic correction due to electron-electron interactions appears at millikelvin temperatures. These results show that the low-temperature resistance behavior cannot be accounted for by a Kondo-only interpretation, but requires consideration of several quantum corrections.", "tier": "A_MUST_READ", "score": "9", "reason": "author whitelist: Daisuke Shiga", "tags": ["Kondo", "transport"], "image": "", "briefing": {"background": "SrTiO3 기반 계면은 2차원 전자 가스(2DEG)가 형성되는 대표적인 시스템으로, 저온에서 발생하는 전기 저항의 특이한 거동을 해석하는 것은 강상관 전자계 연구의 핵심 과제입니다.", "motivation": "γ-Al2O3/SrTiO3 계면의 저온 저항 상승 원인을 단일 기작(Kondo)이 아닌 다각적인 양자 보정(quantum correction) 관점에서 분석하고자 했습니다.", "result": "저온 저항 상승이 Kondo 효과뿐만 아니라 약한 반국소화(weak antilocalization) 및 전자-전자 상호작용에 의한 로그 보정(logarithmic correction) 등 다양한 효과의 결합임을 규명했습니다.", "implication": "저차원 시스템의 수송 현상을 해석할 때 단일 기작에 의존하는 기존 관행이 불완전할 수 있음을 경고하며, 전체적인 '양자 보정의 계층 구조'를 고려해야 함을 제시했습니다.", "novelty": "단순한 Kondo 물리학을 넘어 복합적인 양자 보정 효과를 실험 데이터와 정합시킴으로써 해석의 정교함을 높였습니다.", "unresolved": "초전도 상이 억제된 상황에서의 전자-전자 상호작용 세부 매개변수와 계면 결함 분포 간의 정량적 상관관계는 아직 완전히 밝혀지지 않았습니다.", "future_work": "더 극저온에서의 수송 측정 및 전자 밀도 제어를 통한 양자 보정 효과의 동역학적 변화 연구가 진행될 것으로 보입니다.", "concepts": [{"term": "Kondo 효과", "why_emerged": "금속 내 국소 자성 불순물이 전도 전자와 상호작용하여 저온에서 저항이 상승하는 현상을 설명하기 위해 제안됨.", "origin": "Jun Kondo (1964).", "connections": "강상관 전자계, 중페르미온 물질."}, {"term": "약한 반국소화(Weak Antilocalization)", "why_emerged": "SOC가 존재하는 시스템에서 전자의 위상이 간섭하여 저항을 낮추는 현상을 설명하기 위함.", "origin": "Hikami ", "tier": "A_MUST_READ", "score": "9", "reason": "author whitelist: Yulin Chen", "tags": ["superconduct"], "image": "https://pubads.g.doubleclick.net/gampad/ad?iu=/285/npjquantmats.nature.com/article&sz=728x90&c=-1123194028&t=pos%3Dtop%26type%3Darticle%26artid%3Ds41535-026-00930-3%26doi%3D10.1038/s41535-026-00930-3%26subjmeta%3D301,639,766%26kwrd%3DMaterials+science,Physics", "briefing": {"background": "초전도 다이오드 효과(Superconducting Diode Effect, SDE)는 특정 방향으로의 임계 전류가 반대 방향과 다른 비대칭적 초전도 현상으로, 비반전 대칭성 파괴와 시간 반전 대칭성 파괴가 결합될 때 나타납니다.", "motivation": "외부 자기장 없이(field-free) 이러한 비대칭적 초전도 수송 현상을 실현하는 것은 소자 응용 및 응축물질 물리학의 핵심 과제 중 하나입니다.", "result": "FeTe0.55Se0.45 단결정에서 외부 자기장 없이도 강력한 초전도 다이오드 효과를 관측했습니다.", "implication": "자기장 인가 없이 자발적인 대칭성 파괴를 통해 비가역적 초전도 수송을 제어할 수 있음을 시사하며, 이는 에너지 효율적인 초전도 소자 개발의 토대가 될 수 있습니다.", "novelty": "철 기반 초전도체(Fe-based superconductor) 시스템에서 자발적 SDE를 입증했다는 점이 중요하며, 이는 토폴로지 물성과 초전도성이 공존하는 시스템 연구에 중요한 단서를 제공합니다.", "unresolved": "자발적 SDE를 유도하는 미시적인 대칭성 파괴의 근원(자성, 도메인 등)이 실험적으로 완전히 규명되지 않았습니다.", "future_work": "ARPES 등을 통해 전자 구조와 SDE 사이의 상관관계를 직접 확인하고, 해당 시스템의 자기 구조를 정밀하게 분석하는 연구가 필요합니다.", "concepts": [{"term": "초전도 다이오드 효과", "why_emerged": "초전도 소자에서 전류의 일방향 흐름을 정밀하게 제어하기 위함.", "origin": "최근 수년간 강한 스핀-궤도 결합과 대칭성 파괴가 있는 시스템에서 활발히 연구됨.", "connections": "조셉슨 접합, 비반전 대칭 초전도체, 스핀트로닉스."}, {"term": "FeTeSe", "why_emerged": "높은 초전도 전이 온도와 토폴로지적 성질이 공존하는 후보 물질로서 중요.", "origin": "2000년대 후반 철 기반 초전도체 발견 당시 제안됨.", "connections": "FeSe, 토폴로지 절연체, 마요라나 페르미온 연구."}], "english_summary": ["Demonstrates robust field-free superconducting diode effect in FeTe0.55Se0.45.", "The result suggests self-induced broken symmetry allowing non-reciprocal transport.", "This provides a platform for energy-efficient superconducting electronics without external magnets."]}}, {"title": "Significant modulation of acoustoelectric current associated with charge density wave transitions", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2608.27959", "authors": "Natsumi Nikaido, Takuya Kawada, Koji Fujiwara, et al.", "last_authors": "Shintaro Takada, Yasuhiro Niimi", "summary": "We studied acoustoelectric (AE) currents in materials that undergo charge density wave (CDW) transitions, induced by a surface acoustic wave (SAW) on a piezoelectric substrate. The polarity and magnitude of the AE current in NbSe$_3$ and 2H-TaSe$_2$ were modulated due to their CDW transitions. We also found that the sign of the AE current depends on the SAW propagation direction with respect to the crystalline axis of the substrate.A phenomenological model assuming strain-modified conductivity can qualitatively account for the significant modulation of the AE current associated with the CDW transition, as well as the SAW propagation orientation dependence. The present results offer a powerful probe for exploring SAW-electron interactions in van der Waals materials, thereby highlighting their potential for advancing the emerging field of straintronics.", "tier": "B_IMPORTANT_CONDMAT", "score": "10", "reason": "Direct hit on NbSe3 and CDW transitions, core interests for current projects.; demoted from A: broad CM, not direct user/project hit", "tags": ["experimental", "NbSe3", "CDW"], "image": "https://arxiv.org/html/2608.27959v1/setup_070326.png", "briefing": {"background": "전하 밀도 파(CDW)는 물질 내에서 전자 밀도가 주기적으로 재배열되는 현상이며, NbSe3와 같은 quasi-1D 물질에서 이 현상의 동역학적 특성은 오랜 연구 대상입니다.", "motivation": "표면 탄성파(SAW)를 이용하여 CDW 상태와 전자 간의 상호작용을 비파괴적으로 제어하고 측정하고자 하는 실험적 목적이 있습니다.", "result": "SAW를 통해 유도된 음향 전기적(AE) 전류가 NbSe3 및 2H-TaSe2의 CDW 상전이와 함께 크게 변조됨을 확인했습니다.", "implication": "AE 전류 측정이 CDW 상태의 상전이를 민감하게 감지하는 강력한 프로브가 될 수 있음을 입증했습니다.", "novelty": "반데르발스 물질의 CDW 상태를 스트레인 제어를 통해 다루는 '스트레인트로닉스(straintronics)' 기술의 실효성을 보여줍니다.", "unresolved": "AE 전류의 부호 및 크기 변화를 일으키는 전자 구조적 변화의 미시적 기작에 대한 정밀한 분석이 더 필요합니다.", "future_work": "다른 위상 반금속이나 강상관 전자계 물질에서의 SAW 상호작용 연구로의 확장이 예상됩니다.", "concepts": [{"term": "음향 전기적 전류", "why_emerged": "탄성파와 전자의 상호작용을 통해 물질의 전기적 특성을 연구하기 위해 도입.", "origin": "Weinreich 등에 의해 초기 이론 정립.", "connections": "음향광학, 스트레인트로닉스, 압전 효과."}, {"term": "전하 밀도 파 (CDW)", "why_emerged": "1차원적인 전자계에서 페르미 면의 네스팅(nesting)에 의해 발생하는 불안정성 기술.", "origin": "Peierls에 의해 초기 이론 제안.", "connections": "NbSe3, TaSe2, 위상학적 물성."}], "english_summary": ["Observed significant modulation of acoustoelectric current during CDW transitions in NbSe3 and 2H-TaSe2.", "Acoustoelectric current is shown to be a sensitive probe for electron-SAW interactions.", "Results highlight the potential for straintronics in van der Waals materials."]}}, {"title": "Strain-control of electronic superlattice domains in CsV3Sb5", "journal": "npj_QuantumMaterials", "source": "Gemini", "link": "https://www.nature.com/articles/s41535-026-00933-0", "authors": "E. Sadrollahi, J. Almeida Mendes, N. Stilkerich, et al.", "last_authors": "T. Ritschel, J. Geck", "summary": "Strain-control of electronic superlattice domains in CsV 3 Sb 5", "tier": "B_IMPORTANT_CONDMAT", "score": "10", "reason": "Direct impact on current CsV3Sb5 kagome metal research.; demoted from A: broad CM, not direct user/project hit", "tags": ["CsV3Sb5", "kagome", "strain", "CDW"], "image": "https://media.springernature.com/m685/springer-static/image/art%3A10.1038%2Fs41535-026-00933-0/MediaObjects/41535_2026_933_Fig1_HTML.png", "briefing": {"background": "CsV3Sb5와 같은 카고메 금속은 CDW 상태와 위상학적 전자 구조가 얽혀 있는 독특한 강상관 물질로, 최근 많은 주목을 받고 있습니다.", "motivation": "카고메 금속에서 관찰되는 CDW 상태의 대칭성 파괴 및 초격자(superlattice) 도메인의 제어는 이 물질의 기저 물성을 이해하는 데 필수적입니다.", "result": "외부 스트레인을 통해 CsV3Sb5 내의 전자 초격자 도메인 구조를 가역적으로 제어할 수 있음을 확인했습니다.", "implication": "스트레인을 통해 전자 질서의 공간적 분포를 재구성함으로써 비자명한 토폴로지 및 초전도 상태와의 상관관계를 직접 실험적으로 조사할 수 있게 되었습니다.", "novelty": "카고메 격자 시스템에서 스트레인을 이용한 국소적 전자 질서 제어 능력을 입증한 점이 매우 중요합니다.", "unresolved": "이러한 도메인 재구성이 실제 위상학적 밴드 구조와 홀 효과 등 수송 현상에 미치는 영향은 추가 규명이 필요합니다.", "future_work": "스트레인 유도 도메인 제어 상태에서의 공간 분해능 ARPES 또는 RIXS 연구가 기대됩니다.", "concepts": [{"term": "전자 초격자", "why_emerged": "CDW로 인해 원래 결정 구조보다 큰 주기성을 가지는 새로운 전자적 질서가 형성되기 때문.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "CDW, 카고메 금속, 페르미 면 네스팅."}, {"term": "CsV3Sb5", "why_emerged": "카고메 격자 기반의 위상학적 물성과 초전도성의 상호작용 연구를 위한 핵심 물질.", "origin": "2020년경 본격적인 연구 시작.", "connections": "AV3Sb5, 강상관 물질, 네마틱성."}], "english_summary": ["Demonstrates reversible control of electronic superlattice domains in CsV3Sb5 using strain.", "Provides a experimental pathway to manipulate electronic orders in kagome metals.", "Enables better investigation of the interplay between CDW, topology, and superconductivity."]}}, {"title": "Berry-curvature-driven anomalous Hall and Nernst effects in the kagome permanent magnets RCo5", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/jhff-xgwg", "authors": "Weian Guo, Pengyu Zheng, Rui Liu, Yiran Peng, Ying Yang, Zhiping Yin", "last_authors": "Ying Yang, Zhiping Yin", "summary": "Kagome lattice materials have attracted considerable attention due to their intriguing topological properties and potential applications in next-generation quantum and spintronic technologies. In particular, rare-earth permanent magnets with kagome structure provide an ideal platform that combines r…", "tier": "B_IMPORTANT_CONDMAT", "score": "9", "reason": "Strong topological kagome physics with direct relevance to anomalous Hall interest.", "tags": ["kagome", "anomalousHall", "topological"], "image": "", "briefing": {"background": "카고메 격자 구조는 독특한 기하학적 좌절(geometrical frustration)과 밴드 구조의 플랫 밴드(flat band), 디락 점(Dirac point)으로 인해 위상 물리 연구의 핵심 플랫폼입니다. 특히 자성 원소와 결합된 카고메 자성체는 강한 스핀-궤도 결합과 베리 곡률(Berry curvature)을 유도하여 이상 홀 효과(AHE)와 같은 수송 현상을 극대화합니다.", "motivation": "희토류 기반 카고메 영구자석인 RCo5 화합물이 갖는 위상학적 특성과 거대 이상 홀/네른스트 효과 사이의 상관관계를 이론적으로 규명하고자 함.", "result": "RCo5 시스템에서 베리 곡률이 어떻게 이상 홀 효과와 이상 네른스트 효과를 유도하는지 DFT 계산을 통해 확인하였으며, 카고메 구조적 특성이 이러한 수송 현상에 미치는 기여도를 정량적으로 분석함.", "implication": "희토류 카고메 자성체가 향후 효율적인 스핀트로닉스 소자 및 위상학적 양자 재료로서 중요한 후보군임을 보여줌.", "novelty": "RCo5라는 특정 자성 시스템에서의 베리 곡률 유도 수송 현상을 상세히 모델링하였으며, 카고메 격자의 위상학적 특성이 실제 영구자석 재료의 물성에 어떻게 연결되는지 입증함.", "unresolved": "실제 실험적 측정값과 이론적 계산값 사이의 정밀한 정량적 일치 여부는 후속 검증이 필요함.", "future_work": "ARPES를 통한 실제 전자 구조 확인 및 다양한 희토류 이온 치환에 따른 물성 변화 연구.", "concepts": [{"term": "베리 곡률 (Berry Curvature)", "why_emerged": "운동량 공간에서 파동 함수의 기하학적 위상 성질을 이해하기 위해 필요함.", "origin": "M. V. Berry (1984).", "connections": "이상 홀 효과, 양자 홀 효과, 위상 절연체."}, {"term": "이상 홀 효과 (Anomalous Hall Effect)", "why_emerged": "강자성체에서 자기장 없이도 나타나는 전압차 현상을 설명하기 위해 제안됨.", "origin": "E. H. Hall (1881).", "connections": "베리 곡률, 스핀-궤도 결합, 강자성체."}], "english_summary": ["Investigates the origin of AHE and ANE in rare-earth kagome magnets RCo5.", "Uses DFT to link Berry curvature to transport properties in kagome magnets.", "Demonstrates RCo5 as a candidate for spintronics via topological electronic structure."]}}, {"title": "Emergence of magnetic ordering and weak antilocalization in Fe-doped Sb2Te3: Evidence by muon spin resonance and density functional theory studies", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/7jww-qc6d", "authors": "Suchandra Mukherjee, Nabakumar Rana, Ankit Kumar, et al.", "last_authors": "Swapnadeep Goswami, Aritra Banerjee", "summary": "Three-dimensional topological insulators have garnered significant attention in scientific research due to their unique electronic properties. An in-depth study has been conducted to explore the influence of iron (Fe) doping on both the magnetic properties and the topological insulating behavior of …", "tier": "B_IMPORTANT_CONDMAT", "score": "9", "reason": "Experimental study of magnetic ordering in an Fe-doped topological insulator; includes DFT.", "tags": ["topologicalinsulator", "magneticmaterial", "muonspinresonance", "DFT"], "image": "", "briefing": {"background": "3차원 위상 절연체(TI)는 표면 상태의 스핀-운동량 잠금 현상으로 주목받아 왔습니다. 여기에 자기적 불순물을 도핑하면 시간 반전 대칭이 깨지며 위상학적으로 비자명한 갭이 열리게 되는데, 이는 양자 이상 홀 효과 등의 물리 현상을 구현하는 핵심 경로입니다.", "motivation": "Fe를 도핑한 Sb2Te3 시스템에서 자기적 정렬과 위상학적 특성이 어떻게 공존하거나 변화하는지 실험적으로 추적하기 위함.", "result": "Muon spin resonance(µSR)를 통해 Fe 도핑에 따른 자기적 정렬의 발현을 확인하였으며, 약한 반국소화(weak antilocalization) 특성을 관찰하여 시스템의 위상학적 특성을 검증함.", "implication": "자기 도핑된 위상 절연체 내의 자기적 불균일성 및 전자 수송 특성에 대한 이해를 높임.", "novelty": "벌크 자성과 표면 위상 상태의 상호작용을 로컬 프로브(µSR)를 통해 직접 관측하고 DFT와 결합하여 전자 구조 변화를 설명함.", "unresolved": "Fe 이온의 공간적 분포 균일성 및 표면 상태와 벌크 상태의 결합 정도에 대한 명확한 분리 측정은 여전히 과제로 남음.", "future_work": "ARPES를 통한 Fe 도핑 전후의 표면 상태 갭 변화 및 자기적 도메인에 따른 위상 상태 변화 관측.", "concepts": [{"term": "약한 반국소화 (Weak Antilocalization)", "why_emerged": "강한 스핀-궤도 결합 시스템에서의 양자 간섭 현상을 설명하기 위해 도입됨.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "위상 절연체, 스핀-궤도 결합, 전자 수송."}, {"term": "Muon Spin Resonance (µSR)", "why_emerged": "물질 내부의 극미세 자기 환경을 국소적으로 프로빙하기 위해 개발됨.", "origin": "1950년대 발견 이후 응집물질물리 분야로 확장.", "connections": "자기 정렬 측정, 초전도체 갭 구조 연구."}], "english_summary": ["Explores magnetic ordering in Fe-doped Sb2Te3 topological insulators.", "Uses µSR to confirm magnetic ground states and weak antilocalization.", "Combines experimental techniques with DFT to analyze magnetic and electronic properties."]}}, {"title": "Evolution of spin excitations in superconducting La2−xCaxCuO4−δ from the underdoped to the heavily overdoped regime", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/kvpz-x64t", "authors": "S. Hameed, Y. Liu, M. Knauft, et al.", "last_authors": "B. Keimer, M. Minola", "summary": "We investigate high-energy spin excitations in hole-doped La 2 − x Ca x CuO 4 − δ (LCCO) films across a broad Ca doping range ( x = 0.05 – 0.50 ) using resonant inelastic x-ray scattering (RIXS). Polarization analysis and incident-photon energy detuning measurements confirm the persistence of collective paramagnon excitations up to x = 0.50 . Consistent with previous studies on other cuprate families, we observe a pronounced crossover near x = 0.15 , where paramagnon spectral weight is transferred to incoherent spin-flip excitations associated with the particle-hole continuum. The overall behavior of paramagnons in LCCO resembles that in other hole-doped cuprates and appears insensitive to the persistence of superconductivity at high doping levels in LCCO—up to at least x = 0.50 , as demonstrated in prior work. These findings support the view that high-energy magnetic excitations probed by RIXS are not a major contributor to superconducting pairing, in line with theories of spin-fluctuation mediated superconductivity.", "tier": "B_IMPORTANT_CONDMAT", "score": "9", "reason": "Directly matches interest in RIXS spectroscopy and unconventional superconductivity in cuprates.; demoted from A: broad CM, not direct user/project hit", "tags": ["RIXS", "cuprates", "unconventionalsuperconductivity"], "image": "", "briefing": {"background": "구리 산화물 초전도체(cuprates)에서 스핀 요동이 초전도 페어링의 기제인지 여부는 지난 수십 년간 고온 초전도 분야의 가장 큰 논쟁 중 하나입니다. 고에너지 영역의 스핀 여기를 직접 관측하는 것은 이 기제를 이해하는 데 필수적입니다.", "motivation": "La2-xCaxCuO4-δ(LCCO)에서 도핑 농도를 넓게 변화시키며 고에너지 스핀 여기(파라마그논)의 변화 양상을 RIXS로 추적하여 초전도 페어링과의 상관관계를 검토함.", "result": "x=0.50까지 파라마그논이 유지됨을 확인하였으며, 초전도성과 무관하게 고에너지 스핀 여기가 존재함을 보임. 이는 고에너지 자기 여기가 초전도 페어링의 주된 원인이 아닐 가능성을 시사함.", "implication": "고에너지 스핀 요동보다 저에너지 물성이나 다른 전자적 상호작용이 초전도성에 더 결정적일 수 있다는 관점을 강화함.", "novelty": "기존에 연구된 cuprates와 유사하게 높은 도핑 영역(x=0.50)까지 파라마그논의 지속성을 보였다는 점이 특징.", "unresolved": "고에너지 여기와 저에너지 페어링 사이의 연결 고리를 완전히 배제하기는 어려움.", "future_work": "도핑 영역별 전자-포논 결합 또는 기타 전하 요동 성분과의 비교 분석.", "concepts": [{"term": "RIXS (공명 비탄성 X선 산란)", "why_emerged": "전자 구조 및 집단 여기(스핀, 전하)를 운동량 전달과 에너지 손실별로 동시에 측정하기 위해 필요함.", "origin": "1970년대 제안, 2000년대 중반 이후 비약적 발전.", "connections": "파라마그논, 전자 상관관계, 고온 초전도체."}, {"term": "파라마그논 (Paramagnon)", "why_emerged": "반강자성 절연체 내의 마그논이 도핑된 금속성 상태에서도 살아남는 스핀 여기를 설명하기 위해 필요함.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "스핀 요동, 초전도 페어링, cuprates."}], "english_summary": ["Uses RIXS to map spin excitations in LCCO from underdoped to heavily overdoped regimes.", "Observes persistence of paramagnons up to x=0.50.", "Suggests that high-energy spin excitations are not the primary drivers of superconductivity in cuprates."]}}, {"title": "Inducing a metal-insulator transition via disorder in correlated kagome systems", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/5wsr-blr5", "authors": "Qingzhuo Duan, Hongdao Zhuge, Zixuan Jia, Tianxing Ma", "last_authors": "Zixuan Jia, Tianxing Ma", "summary": "The metal-insulator transition is often accompanied by fascinating quantum phenomena, including superconducting domes, antiferromagnetic phase transitions, and quantum spin liquids. Concurrently, kagome materials are predominantly metallic, necessitating the realization of insulating states to fully…", "tier": "B_IMPORTANT_CONDMAT", "score": "9", "reason": "Directly relevant to user's focus on correlated kagome metals.", "tags": ["kagome", "correlated", "MIT"], "image": "", "briefing": {"background": "카고메 금속 격자는 독특한 기하학적 좌절(geometric frustration)과 밴드 구조(flat bands, van Hove singularities)로 인해 강한 전자 상관관계 연구의 핵심 플랫폼입니다. 특히 이들은 주로 금속성을 띠어, 양자 스핀 액체나 Mott 절연체와 같은 절연 상태를 구현하는 것이 강상관 물리학의 중요한 도전 과제입니다.", "motivation": "기존의 카고메 금속 물질들은 대부분 금속성을 보이고 있어, 무질서(disorder)를 도입함으로써 전자의 국소화를 유도해 금속-절연체 전이(MIT)를 제어하고 그 과정에서의 양자 현상을 관찰하고자 합니다.", "result": "이론적 모델링을 통해 카고메 시스템 내의 무질서가 어떻게 금속 상태에서 절연 상태로의 전이를 이끄는지 규명하였으며, 특정 상관관계 강도에서 무질서가 미치는 영향을 분석했습니다.", "implication": "무질서 제어를 통해 카고메 물질에서 양자 위상 변화를 유도할 수 있음을 보여주었으며, 이는 AV3Sb5와 같은 실제 카고메 초전도체의 물성 변조 연구에 중요한 가이드라인을 제공합니다.", "novelty": "카고메 격자에서 무질서 효과를 금속-절연체 전이와 연결하여 이론적으로 다루었다는 점이 핵심이며, 강상관 카고메 시스템의 위상 상태 제어에 대한 통찰을 제공합니다.", "unresolved": "실제 실험적 구현에서 무질서를 어떻게 정밀하게 제어할지, 그리고 특정 카고메 물질에서의 전이 온도가 이론과 일치하는지에 대한 검증이 필요합니다.", "future_work": "실제 kagome 금속 물질(AV3Sb5 등)에 불순물을 도핑하거나 결함을 도입하여 실험적으로 전이 현상을 관찰하는 연구가 예상됩니다.", "concepts": [{"term": "Kagome Lattice", "why_emerged": "기하학적 좌절을 가진 스핀 모델을 연구하기 위해 필요했습니다.", "origin": "수학적인 패턴으로서 오래전부터 알려졌으나, 고체물리에서는 2000년대 이후 위상 물질 및 강상관 분야에서 주목받았습니다.", "connections": "Berry curvature, Flat bands, AV3Sb5 관련 위상 초전도체"}, {"term": "Metal-Insulator Transition (MIT)", "why_emerged": "전자 상관관계에 의한 절연 현상을 설명하기 위해 도입되었습니다.", "origin": "Mott (1949)", "connections": "Mott Hubbard insulator, Hubbard model, DMFT"}], "english_summary": ["The paper investigates the impact of disorder on the electronic states of correlated kagome systems.", "Theoretical framework is presented to induce metal-insulator transitions via disorder.", "Results provide insights into how localization competes with intrinsic kagome band features.", "Useful for understanding phase stability in real-world kagome metals like AV3Sb5."]}}, {"title": "Transient photoexcited state of the small-gap quasi-two-dimensional Mott-Hubbard insulator Sn/Si(111)−(√3×√3)−R30∘", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/bc4t-fzc3", "authors": "G. M. Pierantozzi, S. Modesti, M. Perlangeli, R. Cucini, S. Fiori, F. Salvador, G. Rossi, and G. Panaccione", "last_authors": "S. Fiori, F. Salvador, G. Rossi, and G. Panaccione", "summary": "We investigate the transient response to photodoping of Sn / Si ( 111 ) − ( √ 3 × √ 3 ) R 30 ∘ , a simple and prototypical two-dimensional Mott-Hubbard insulator with a small gap on a triangular lattice, by time- and angle-resolved photoemission with a 120 fs time resolution. A transient metallic state forms nearly instantaneously after photoexcitation and persists for a few hundred femtoseconds, consistent with theoretical predictions and previous studies of small-gap Mott systems in one and three dimensions. The temperature dependence of the doublon lifetime indicates that the dominant relaxation mechanism involves coupling between charge and spin degrees of freedom. On a longer timescale, a small energy shift of the lower Hubbard band persists for more than 1 ns. We attribute this long-lived modification to energy renormalization of the Hubbard bands induced by the photoexcited electron-hole plasma in the Si substrate. Our results further c devices. The key challenges limiting their full potential are (i) high-quality epitaxial thin-film growth and (ii) the understanding of Berry curvature and antiferromagnetic domain physics. Here, we focus on a noncollinear antiperovskite antiferromagnet Mn 3 NiN as a model system, successfully grown as a single-crystal epitaxial thin film. Combining multiple experiments supported by theoretical calculations, we probe the Berry curvature associated with antiferromagnetic Γ 4g domains in Mn 3 NiN and its strong connection to an AHE. We directly image the antiferromagnetic domains driving the intrinsic Berry curvature with high-resolution Sagnac MOKE (magneto-optical Kerr-effect) microscopy, controlling spatial distribution and dynamics by varying temperature and applied magnetic fields. Our findings provide critical advancement of the fundamental understanding and wide tunability of Berry curvature in noncollinear antiferromagnets important for realization in potential spintronic applications.", "tier": "B_IMPORTANT_CONDMAT", "score": "9", "reason": "Direct imaging of Berry curvature and anomalous Hall effect in a noncollinear antiferromagnet.; demoted from A: broad CM, not direct user/project hit", "tags": ["Berrycurvature", "anomalousHalleffect", "antiferromagnet", "spintronics", "magnetictopologicalmaterials", "thinfilm", "experimental"], "image": "", "briefing": {"background": "비콜리니어(noncollinear) 반강자성체는 스핀 구조에 의해 유도되는 베리 곡률로 인해, 자성체 없이도 비정상 홀 효과(AHE)를 나타낼 수 있어 차세대 스핀트로닉스 재료로 주목받습니다.", "motivation": "반강자성체 Mn3NiN에서 베리 곡률과 AHE의 연관성을 실험적으로 명확히 규명하고, 이를 제어할 수 있는 도메인 물리 모델을 확립하고자 했습니다.", "result": "Mn3NiN 에피택셜 박막을 성공적으로 성장시키고, Sagnac MOKE를 통해 자기 도메인과 베리 곡률 유도 AHE 사이의 직접적인 연관성을 시각화했습니다.", "implication": "반강자성 도메인 구조를 제어함으로써 AHE 특성을 조절할 수 있음을 입증하여, 반강자성 기반 소자의 실용화 가능성을 높였습니다.", "novelty": "특히 비콜리니어 반강자성체의 미세 도메인 구조를 직접 이미징하고 이를 베리 곡률과 연결한 점이 매우 중요하며, 이는 자기 위상 물질 연구자들에게 귀중한 데이터입니다.", "unresolved": "박막 품질에 따른 AHE 값의 정량적 차이와 온도 변화에 따른 도메인 역학의 미세한 메커니즘은 추가 연구가 필요합니다.", "f field Fermi surface topology and electronic structure study of a heavy fermion material.", "tags": ["experimental", "heavyfermion", "Fermisurface"], "image": "https://arxiv.org/html/2608.28119v1/YNP_d6rot1au83.png", "briefing": {"background": "중페르미온(Heavy Fermion) 물질은 f-전자와 전도 전자 사이의 강한 혼성으로 인해 유효 질량이 크게 증가하며, 자기장 하에서 전자 구조가 극적으로 변화하는 양자 임계 현상이 나타납니다.", "motivation": "YbNi4P2 화합물에서 자기장을 통해 전자 구조를 튜닝하고, 양자 임계점 근처에서의 페르미 표면 변화 및 준입자 특성을 규명하고자 했습니다.", "result": "양자 진동 측정을 통해 자기장이 커질수록 준입자 유효 질량이 감소함을 확인했고, 약 17T 근처에서 페르미 표면이 바뀌는 리프시츠 전이(Lifshitz transition)를 관측했습니다.", "implication": "자기장을 제어함으로써 f-전자 시스템의 결맞음 상태를 조절할 수 있음을 입증하며, Kondo 모델 기반의 이론적 예측을 실험적으로 뒷받침합니다.", "novelty": "고자기장 하에서의 정밀한 양자 진동 데이터는 중페르미온 물질의 밴드 구조와 상관관계를 이해하는 데 필수적인 제약 조건을 제공합니다.", "unresolved": "17T에서 나타난 페르미 표면 변화가 단순한 리프시츠 전이인지, 아니면 f-전자의 편재화-국소화 전이(localization-delocalization)가 동반된 것인지 구분이 필요합니다.", "future_work": "고압이나 다른 조성 치환을 통해 양자 임계점의 위치를 바꾸어 보며, 이 전이들이 초전도나 자기 정렬과 어떻게 연관되는지 연구가 필요합니다.", "concepts": [{"term": "중페르미온 (Heavy Fermion)", "why_emerged": "f-전자와 전도 전자의 상호작용으로 준입자 유효 질량이 수백 배 커지는 현상", "origin": "Steglich et al. (1979)", "connections": "콘도 효과, 비전형적 초전도, 양자 임계 현상"}, {"term": "리프시츠 전이", "why_emerged": "페르미 표면의 위상적 변화가 전자 밀도 및 수송 특성에 미치는 급격한 변화를 설명하기 위함", "origin": "Lifshitz (1960)", "connections": "밴드 구조, 양자 진동, 페르미 표면"}, {"term": "양자 진동 (Quantum Oscillations)", "why_emerged": "페르미 표면의 단면적을 실험적으로 결정하는 가장 강력한 도구", "origin": "de Haas-van Alphen (1930)", "connections": "페르미 표면, 랜드우 준위, 자기장 의존성"}], "english_summary": ["Investigated Fermi surface and quasiparticle mass in YbNi4P2 under high magnetic fields.", "Observed a Lifshitz transition at 17 T via quantum oscillations.", "Demonstrated qualitative consistency with the single-ion Kondo model.", "Provides key experimental data for tuning electronic structures in heavy-fermion systems."]}}, {"title": "Layer-Controlled Intermolecular Coupling and Many-Body Effects in C60 Films", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2608.28583", "authors": "Hai-Lan Luo, Weitang Li, Luca Moreschini, et al.", "last_authors": "Claudia Ojeda-Aristizabal, Alessandra Lanzara", "summary": "Abstract Crystalline C 60 is a molecular solid whose electronic properties emerge from the interplay of intermolecular hopping, electron correlations, and electron-vibration coupling. Unlike moir e ´ \\rm\\acute{e} van der Waals heterostructures, where interaction strength is commonly tuned by twist angle, molecular materials offer a complementary route in which layer number, molecular orientation, and substrate registry provide experimentally accessible control parameters. Here we present a systematic thickness-dependent angle-resolved photoemission study of C 60 films, spanning the monolayer to the bulk limit. The HOMO-derived band exhibits a non-monotonic evolution: the intermediate-thickness film shows larger bandwidth, reduced effective mass, and pronounced gap-like and sub-band features. The experimental trends, together with Holstein-model simulations, point to strengthened effective intermolecular electronic coupling and enhanced electron-phonon-induced spectral renormalization in the intermediate-thickness regime. These results identify a dimensional crossover in C 60 films and establish layer number as an effective knob for engineering electronic structure and many-body interactions in molecular thin films. Keywords: C 60 molecular films, angle-resolved photoemission spectroscopy, intermolecular coupling, electron-phonon coupling", "tier": "B_IMPORTANT_CONDMAT", "score": "9", "reason": "Systematic thickness-dependent ARPES study of C60 films exploring many-body interactions and bandwidth evolution.", "tags": ["ARPES", "C60", "many-bodyeffects", "molecularfilms"], "image": "https://arxiv.org/html/2608.28583v1/Figure1.png", "briefing": {"background": "분자성 고체(Molecular solid)는 분자 간 호핑, 전자 상관관계, 전자-진동 결합이 상호작용하여 전자 구조를 형성합니다. 특히 C60 필름은 차원성(dimension) 변화에 따른 물성 제어가 가능하여 다체 물리(many-body physics) 연구의 중요한 플랫폼입니다.", "motivation": "기존 연구는 모아레 물질에서 비틀림 각도로 상호작용을 제어했으나, 본 연구는 층 수(layer number)를 핵심 제어 변수로 활용하여 C60 박막의 차원성에 따른 전자 구조와 다체 효과의 변화를 체계적으로 관찰하고자 했습니다.", "result": "층 수가 증가함에 따라 HOMO 밴드가 단조롭지 않은 진화를 보임을 발견했습니다. 중간 두께 필름에서 밴드 폭 증가, 유효 질량 감소, 그리고 현저한 밴드갭과 부밴드 특징이 관찰되었으며, 이는 홀스타인 모델 시뮬레이션을 통해 전자-포논 결합에 의한 스펙트럼 재정규화로 설명됩니다.", "implication": "층 수 제어가 분자 박막의 전자 구조와 다체 상호작용을 설계하는 효과적인 방법임을 입증하였으며, 이는 저차원 분자 전자소자 개발에 중요한 가이드라인을 제공합니다.", "novelty": "ARPES를 통해 분자 박막의 차원 크로스오버와 다체 효과를 체계적으로 연결했습니다. 이는 ARPES 전문가인 독자에게 박막 두께에 따른 전자 구조의 미세한 변화를 추적하는 방법론적 통찰을 줍니다.", "unresolved": "중간 두께 regime에서 관찰되는 특정 스펙트럼 재정규화의 세부적인 메커니즘과 기판과의 구체적인 계면 효과에 대해서는 추가적인 정밀 분석이 필요합니다.", "future_work": "다양한 분자성 물질에서 층 수 제어를 통한 위상 변화 연구나, 외부 자극(빛, 게이트 전압)을 결합한 다체 효과 조절 실험이 기대됩니다.", "concepts": [{"term": "Holstein 모델", "why_emerged": "전자와 격자 진동(포논) 간의 국소적 상호작용을 기술하기 위해 도입되었습니다.", "origin": "T. Holstein (1959).", "connections": "전자-포논 결합의 기본 모델로 폴라론 물성 연구에 연결됩니다."}, {"term": "스펙트럼 재정규화", "why_emerged": "다체 상호작용으로 인해 준입자의 에너지와 유효 질량이 자유 전자 모델과 달라지는 현상을 설명하기 위해 필요합니다.", "origin": "다체 물리 분야에서 확립된 개념으로 특정하기 어렵습니다.", "connections": "밴드 폭 축소, 유효 질량 증가 등 ARPES에서 관찰되는 전형적인 상관관계 효과와 연결됩니다."}], "english_summary": ["Systematic ARPES study of thickness-controlled C60 molecular films.", "Identified non-monotonic band evolution from monolayer to bulk limits.", "Enhanced electron-phonon coupling in intermediate-thickness regimes.", "Established layer number as a powerful knob for engineering many-body effects in molecular systems."]}}, {"title": "Microscopic magnetic phase evolution in the Weyl semimetal Mn3Sn revealed by ^+SR", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2608.01892", "authors": "U. Miniotaite, O. K. Forslund, H. Luetkens, et al.", "last_authors": "Y. Sassa, M. M{\\aa}nsson", "summary": "We report a comprehensive muon spin relaxation ( μ + ​ SR \\mu^{+}\\mathrm{SR} ) and bulk magnetization study of the antiferromagnetic (AFM) Weyl semimetal Mn 3 ​ Sn \\mathrm{Mn}_{3}\\mathrm{Sn} (composition Mn 2.99 ​ Sn \\mathrm{Mn}_{2.99}\\mathrm{Sn} ). Mn 3 ​ Sn \\mathrm{Mn}_{3}\\mathrm{Sn} is reported to exhibit a commensurate inverse triangular (IT) AFM phase, an incommensurate (IC) helical AFM phase, and a proposed low-temperature spin-glass-like state. In our sample, we identify the characteristic temperatures associated with these regimes as Néel temperature ( T N = 418 T_{\\mathrm{N}}=418 K), a macroscopic bulk transition temperature between IT-AFM to IC helical phase ( T t ≈ 275 T_{\\mathrm{t}}\\approx 275 K), and low-temperature transition T f = 21 T_{\\mathrm{f}}=21 K. Investigating the low-temperature regime below T f T_{\\mathrm{f}} , we find no evidence of a static spin-glass state. Instead, the sample exhibits an increasing ferromagnetic (FM) component accompanied by a localized slowing of spin fluctuations, indicating that these phenomena may be decoupled. In the IC helical AFM phase, the zero-field (ZF) spectra are best described by damped oscillations with an empirical phase offset, consistent with anharmonic and amplitude-modulated order reported by scattering studies. Upon warming above 150 K, a continuous redistribution of muon spectral weight reveals a broad, homogeneous magnetic crossover between the IC helical and IT-AFM phases. In the commensurate IT-AFM phase above T t T_{\\mathrm{t}} , a persistent missing fraction in the initial asymmetry indicates that a subset of implanted muons, corresponding to roughly 20% of the sample-related asymmetry, undergoes unresolved ultrafast depolarization. Finally, we observe temperature-driven shifts in muon site populations above 325 K. Ultimately, our results show a highly dynamic magnetic landscape in Mn 3 ​ Sn \\mathrm{Mn}_{3}\\mathrm{Sn} , demonstrating how its complex magnetic orders often coexist and evolve continuously with temperature.", "tier": "B_IMPORTANT_CONDMAT", "score": "9", "reason": "Very relevant study on Mn3Sn, a known Weyl semimetal with strong magnetic interest.", "tags": ["Weyl", "magnetism", "material"], "image": "https://arxiv.org/html/2608.01892v2/Mag_struc_2.png", "briefing": {"background": "Mn3Sn은 베리 곡률과 관련된 비정상 홀 효과(AHE)를 나타내는 대표적인 자기 Weyl 반금속입니다. 삼각형 격자에서 나타나는 복잡한 자기 구조는 위상 물성과 직결되어 있어 이를 규명하는 것이 중요합니다.", "motivation": "Mn3Sn의 위상적 성질을 이해하기 위해서는 그 근간이 되는 자기 위상(commensurate/incommensurate 자기 구조)의 미시적 진화와 저온에서의 스핀 상태를 명확히 밝힐 필요가 있습니다.", "result": "Muon spin relaxation(uSR)을 통해 418K의 Néel 온도, 275K의 자기 위상 전이, 21K의 저온 전이를 명확히 구분했습니다. 특히 저온에서 스핀 글래스 상태가 아닌 동역학적인 강자성 성분의 공존을 확인했습니다.", "implication": "Mn3Sn이 가지는 자기적 다중성(magnetic multifunctionality)이 정적인 상이 아니라 복잡하게 얽힌 동역학적 과정임을 보여주며, 이는 위상적 수송 현상의 해석에 중요한 기초를 제공합니다.", "novelty": "uSR 기법을 활용하여 Mn3Sn의 자기적 불균일성과 온도에 따른 위상 진화를 시공간적으로 분해했다는 점에서 매우 정밀한 접근입니다.", "unresolved": "상온 부근에서 발생하는 'missing fraction' 신호의 기원과 초고속 자기 탈분극 현상의 구체적인 물리적 근거는 여전히 숙제입니다.", "future_work": "자기장의 방향과 세기에 따른 위상 전이의 제어 가능성 연구 및 이와 관련된 Weyl 노드 구조의 변화를 추적하는 ARPES 연계 연구가 필요합니다.", "concepts": [{"term": "Muon spin relaxation (uSR)", "why_emerged": "물질 내부의 극도로 작은 자기장을 비파괴적으로 정밀하게 측정하기 위해 개발되었습니다.", "origin": "1940년대 발견 이후 1970년대 본격적으로 응집물질 연구에 도입.", "connections": "중성자 산란과는 상호보완적이며 스핀 동역학 연구에 필수적입니다."}, {"term": "Weyl 반금속", "why_emerged": "밴드 구조에서 전도대와 가전자가 점(Weyl node)에서 접하는 위상 물질을 설명하기 위해 도입되었습니다.", "origin": "Herring (1937)의 예측 및 2011년경 본격적인 위상물성 이론으로 정립.", "connections": "베리 곡률, 비정상 홀 효과, 페르미 아크와 직접 연결됩니다."}], "english_summary": ["Comprehensive uSR study on the magnetic Weyl semimetal Mn3Sn.", "Identified detailed magnetic transitions and ruled out static spin-glass at low temperatures.", "Evidence for dynamic coexistence of magnetic orders and complex phase evolution.", "Provides crucial microscopic insight into the magnetic landscape of Weyl magnets."]}}, {"title": "Orbital-Selective Coexistence of Interlayer Spin-Singlet Formation and SDW Order with Anomalous Spin Reconfiguration in Bilayer Nickelate La3Ni2O7 Revealed by 17O-NMR", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2608.27917", "authors": "H. Lee, M. Yashima, M. Kakoi, T. Ino, Y. Arai, K. Kitagawa, H. Sakurai, Y. Takano, K. Kuroki, H. Mukuda", "last_authors": "H. Sakurai, Y. Takano, K. Kuroki, H. Mukuda", "summary": "The spin structure of the spin density wave (SDW) order in the bilayer nickelate La$_3$Ni$_2$O$_7$ has been investigated using site-selective $^{17}$O-NMR measurements on the inner apical O(1), outer apical O(2), and planar O(3,4) sites. Below $T_{\\rm SDW}$ (= 150 K), the peak of all planar O(3,4) sites significantly broadens due to the emergence of a finite internal magnetic field, whereas O(2) sites remain with no (or a negligibly small) internal field. These results are consistent with commensurate SDW order with a single spin-spinless (or large-tiny spin) stripe. As for the O(1) sites that bridge the NiO$_2$ planes, the internal field is nearly canceled below $T_{\\rm SDW}$, indicating an antiparallel spin configuration between adjacent planes. However, below $T_\\text{A}$ ($\\sim$ 115 K), the spectrum of the O(1) site disappears even though the in-plane SDW order remains robust, implying that the antiparallel spin configuration through the Ni--O(1)--Ni bond is not particularly stable below $T_{\\rm A}$, despite the expected strong interlayer spin coupling between the NiO$_2$ planes. Above all, we emphasize that the local spin susceptibility is extremely small at the O(2) site that has a strong covalency with the $d_{3z^2-r^2}$ orbital, indicating a well-developed interlayer spin-singlet formation in the Ni-$d_{3z^2-r^2}$ orbitals bridging the NiO$_2$ planes. These findings shed new light on the interlayer spin-singlet formation and the anomalous spin reconfiguration through the $\\text{Ni--O(1)--Ni}$ bonding orbitals connecting the NiO$_2$ planes, which characterize the orbital-selective nature of the bilayer nickelate La$_3$Ni$_2$O$_7$.", "tier": "B_IMPORTANT_CONDMAT", "score": "9", "reason": "NMR study of spin order and spin-singlet formation in a bilayer nickelate, a key unconventional superconductor.; demoted from A: broad CM, not direct user/project hit", "tags": ["nickelate", "unconventionalsuperconductivity", "NMR", "SDW", "experiment"], "image": "https://arxiv.org/html/2608.27917v1/fig1.png", "briefing": {"background": "La3Ni2O7은 상압 혹은 고압 환경에서 고온 초전도성을 나타내는 것으로 알려진 이중층 니켈산염입니다. 큐프레이트와 유사하면서도 궤도 선택적(orbital-selective) 성질이 강해 강상관계 전자계 연구의 핵심 소재입니다.", "motivation": "La3Ni2O7의 초전도 발현 기전을 이해하기 위해, 이중층 사이의 스핀 결합과 SDW(스핀 밀도 파) 정렬의 궤도 선택적 성질을 미시적으로 규명하고자 했습니다.", "result": "17O-NMR 측정을 통해 평면 NiO2층 내의 SDW 질서와 층간을 연결하는 Ni-O(1)-Ni 결합에서의 스핀 재배치를 관찰했습니다. 특히 d3z2-r2 궤도에서 층간 스핀-싱글렛이 형성됨을 NMR 스펙트럼으로 직접 확인했습니다.", "implication": "이 물질이 단순한 SDW 상태가 아니라 궤도 선택적 스핀-싱글렛과 SDW가 공존하는 복합적인 전자 상태임을 시사합니다. 이는 니켈산염 초전도체의 페어링 메커니즘 규명에 결정적인 단서가 됩니다.", "novelty": "O-NMR을 통해 특정 궤도의 스핀 상태를 분리해낸 점이 탁월하며, 층간 스핀-싱글렛 형성이라는 모델을 실험적으로 뒷받침했다는 점이 중요합니다.", "unresolved": "이러한 궤도 선택적 질서가 초전도 상태로 전이되는 과정에서의 정밀한 상도표와 그 정확한 전이 메커니즘은 아직 미지수입니다.", "future_work": "압력 변화에 따른 NMR 신호의 변화를 통해 초전도성과의 연관성을 직접 입증하는 실험과 이론적 모델링이 수반되어야 합니다.", "concepts": [{"term": "SDW (Spin Density Wave)", "why_emerged": "전도 전자의 스핀 밀도가 공간적으로 주기적인 변조를 일으키는 바닥 상태를 설명하기 위해 등장했습니다.", "origin": "Overhauser (1962).", "connections": "페르미면 중첩(nesting) 및 초전도 경쟁/공존 상태와 깊게 연관됩니다."}, {"term": "궤도 선택적 성질", "why_emerged": "멀티 궤도 물질에서 특정 궤도는 국소화되고 다른 궤도는 전도성을 띠는 특이 상태를 기술하기 위해 필요합니다.", "origin": "Anisimov et al. (2002) 등 중금속 산화물 연구에서 확립.", "connections": "허바드 모델, 밴드 엔지니어링, 강상관계 전자계의 물성 제어와 연결됩니다."}], "english_summary": ["17O-NMR study of bilayer nickelate La3Ni2O7.", "Reported orbital-selective coexistence of SDW and interlayer spin-singlet state.", "Evidence for Ni-d3z2-r2 orbital involvement in interlayer spin-singlet formation.", "Provides vital insights into the unique electronic and magnetic landscape of nickelate superconductors."]}}, {"title": "Switchable chiral antiferromagnetism through nonlinear magnetic susceptibility", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2608.28546", "authors": "Hua Chen, Philipp Gegenwart", "last_authors": "Hua Chen, Philipp Gegenwart", "summary": "Antiferromagnets (AFM) have attracted considerable attention in recent years because a number of nontrivial, technologically relevant properties associated with time-reversal symmetry (TRS) breaking are discovered in many materials. However, time-reversal (TR) partners of AFM states are generally challenging to be selected deterministically except in a few cases with nonzero net magnetization. Recently, it has been shown that the TR partners of the kagome spin ice ground state in HoAgGe with strictly zero net magnetization can be selected through a nonlinear magnetic susceptibility $\\chi^{(1)}$. In this work, we generalize this scenario to a broad class of chiral AFM with zero net magnetization but field-switchable ground states through $\\chi^{(1)}$. After a general discussion of $\\chi^{(1)}$ and its symmetry constraints, we first present a first-principles formalism for calculating it including both mean-field and self-consistent corrections, and then apply the approach to the noncollinear AFM family Mn$_3X$N ($X=$ Ni, Ag, Ga, Zn, Sn) in the $\\Gamma_{5g}$ phase. An intuitive picture of the origin of $\\chi^{(1)}$ in similar noncollinear AFM is illustrated using 3-sublattice toy model. The model also predicts a nontrivial temperature dependence of $\\chi^{(1)}$ due to competitions between the longitudinal and transverse single-spin susceptibilities. Our work shows that nonlinear susceptibility can serve as a general protocol for accessing and switching TR partners in fully compensated AFM.", "tier": "B_IMPORTANT_CONDMAT", "score": "9", "reason": "Highly relevant for topological antiferromagnetism, TRSB, and chiral magnetic materials research.", "tags": ["kagome", "antiferromagnet", "magnetic"], "image": "https://arxiv.org/html/2608.28546v1/schematic.png", "briefing": {"background": "반강자성체(AFM)는 자화가 0이면서도 시간 반전 대칭성(TRS)을 깨뜨릴 수 있어 차세대 스핀트로닉스 소재로 주목받습니다. 하지만 TRS가 깨진 상태들(TR 파트너) 중 특정 상태를 외부 필드로 제어하는 것은 순자화가 없는 경우 매우 어렵습니다.", "motivation": "자화가 없는 카이랄 반강자성체에서 비선형 자기 감수율(chi^(1))을 활용해 특정 TR 파트너 상태를 결정론적으로 제어하고 스위칭할 수 있는 일반적인 프로토콜을 정립하고자 함.", "result": "Mn3XN(X=Ni, Ag 등) 계열의 비공선형 반강자성체에서 비선형 자기 감수율을 통해 TR 파트너를 스위칭할 수 있음을 이론적으로 증명함. 또한 3-서브격자 모델을 통해 이 현상의 미시적 기원을 규명.", "implication": "자기 모멘트가 0인 순수 반강자성체에서도 비선형 자기 응답을 활용하면 스핀 상태 제어가 가능함을 시사하며, 이는 카고메 금속 등 복잡한 자기 구조를 가진 물질 연구에 중요한 방법론이 됨.", "novelty": "기존의 선형 자기 응답이 아닌 고차의 비선형 응답을 스위칭 도구로 제안한 점이 핵심이며, 독자의 주 관심사인 카고메 격자 및 TRSB 연구에 직접적인 방법론적 통찰을 제공함.", "unresolved": "실제 실험적으로 비선형 감수율을 정밀하게 분리하고 측정하는 데 따르는 기술적 난이도가 여전히 존재함.", "future_work": "제안된 Mn3XN 계열 물질의 실제 합성 및 극저온 자기 측정 실험, 그리고 타 카고메 시스템으로의 응용 가능성 타진.", "concepts": [{"term": "비선형 자기 감수율 (Nonlinear magnetic susceptibility)", "why_emerged": "선형 응답만으로는 구분이 불가능한 복잡한 자기 구조의 대칭성을 탐색하기 위해 필요.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "고차 스핀-스핀 상관관계, 비공선형 반강자성 이론"}, {"term": "카이랄 반강자성체 (Chiral AFM)", "why_emerged": "격자 구조의 카이랄리티와 스핀 배치가 결합된 비전통적 자기 정렬을 이해하기 위해 필요.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "베리 곡률, 이상 홀 효과, 스핀-궤도 결합"}], "english_summary": ["Presents a general formalism for using nonlinear magnetic susceptibility (chi^(1)) to switch time-reversal partners in compensated antiferromagnets.", "Applies the approach to Mn3XN (X=Ni, Ag, Ga, Zn, Sn) noncollinear antiferromagnets.", "Provides a theoretical framework to control ground states in zero-net-magnetization materials.", "Suggests chi^(1) as a powerful probe for topological magnetic states in kagome and other frustrated systems."]}}, {"title": "Antidots measure anyonic charge in graphene", "journal": "Nature_Physics", "source": "Gemini", "link": "https://www.nature.com/articles/s41567-026-03428-8", "authors": "Authors not available in source RSS", "last_authors": "", "summary": "Anyons are fractionally charged quasiparticles of the quantum Hall effect, and could one day power topological quantum computers. Trapping and nformation studies."]}}, {"title": "Domains with noncentrosymmetric structural distortion in altermagnetic MnTe", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/tsls-h6fj", "authors": "Ao Wu, Di Cheng, Jing-Yang Chung, et al.", "last_authors": "Silvija Gradečak-Garaj, Xinwei Li", "summary": "The hexagonal MnTe is a prime material candidate for altermagnets, an emerging class of magnetic compounds characterized by the nontrivial interplay of antiparallel spin arrangements with their underlying crystal structures. Recognizing precise knowledge of crystal symmetry as the cornerstone of the…", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Important altermagnetism study; directly relevant to magnetic material interests.", "tags": ["altermagnet", "material"], "image": "", "briefing": {"background": "알터자성체(Altermagnet)는 반강자성 스핀 배열과 결정 대칭성이 비전통적으로 결합하여, 자화가 0임에도 불구하고 강자성체와 유사한 spin-split 밴드 구조를 가지는 새로운 물질군입니다.", "motivation": "육각형 MnTe 물질에서 알터자성 특성의 기반이 되는 결정 대칭성과 그에 따른 도메인 구조를 명확히 이해하고자 함.", "result": "MnTe에서 비중심대칭적(noncentrosymmetric) 구조 왜곡이 나타나는 도메인을 발견하고 이를 특성화함.", "implication": "알터자성에서 결정 구조와 자기적 도메인 간의 밀접한 상관관계를 밝혀, 향후 Altermagnet의 밴드 엔지니어링 및 제어에 중요한 기초 자료를 제공함.", "novelty": "이미 잘 알려진 MnTe에서 최근 주목받는 알터자성적 특성을 구조적 관점에서 재해석한 것이며, 독자의 주요 연구 주제인 자기 토폴로지 소재 연구에 시사점이 큼.", "unresolved": "관찰된 구조 왜곡이 알터자성 밴드 구조의 스핀 분할에 미치는 정량적 영향에 대해서는 추가 논의가 필요.", "future_work": "도메인 벽에서의 전자 구조 연구 및 이러한 왜곡이 Berry 곡률이나 이상 홀 효과에 미치는 영향 조사.", "concepts": [{"term": "알터자성체 (Altermagnet)", "why_emerged": "강자성체와 반강자성을 넘어선 새로운 자기 대칭성 분류가 필요했기 때문.", "origin": "최근 3~4년 내 이론적 정립 및 실험적 발견", "connections": "시간 반전 대칭성 깨짐, 반강자성, Spin-splitting"}, {"term": "비중심대칭 구조 (Noncentrosymmetric structure)", "why_emerged": "결정 구조에서 반전 중심의 부재는 스핀-궤도 결합에 의한 비대칭적 밴드 분리를 유도함.", "origin": "결정학의 고전적 분류", "connections": "Rashba 효과, 위상학적 성질"}], "english_summary": ["Reports on domains with noncentrosymmetric structural distortion in hexagonal MnTe.", "Connects the crystal symmetry breaking to the underlying altermagnetic characteristics of the material.", "Provides critical insights into the structural origin of spin-splitting in compensated magnets.", "Relevant for understanding the interplay between structural symmetry and magnetism in topological magnetic materials."]}}, {"title": "High harmonic spectroscopy from lower-order to higher-order topological insulators", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/7zjc-4b4r", "authors": "Bryan Lorenzo, Carlos Batista, Milad Jangjan, et al.", "last_authors": "Camilo Granados, Alexis Chacón", "summary": "Here, the authors demonstrate that high-harmonic spectroscopy from lower-order to higher-order topological insulators reveals distinct contributions from bulk, edge, and corner electronic states. By systematically resolving these emission channels, they establish how topological features evolve across different classes of topological materials and clarify the microscopic origin of the emitted harmonics. Their results provide a unified framework for understanding and exploiting high-harmonic generation as a probe of topological quantum matter.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Probing topological insulators with high harmonic spectroscopy; distinguishes bulk, edge, corner states.", "tags": ["topologicalinsulator", "spectroscopy", "experimentalmethod"], "image": "", "briefing": {"background": "위상 절연체(TI) 연구는 전자 구조의 위상학적 특성을 이해하는 것이 핵심인데, 고차 위상 절연체(HOTI)의 도입으로 벌크-경계 대응 원리를 넘어 모서리(corner)나 힌지(hinge) 상태를 규명하는 것이 중요해졌습니다.", "motivation": "기존의 분광학적 방법으로는 물질 내부(bulk)의 기여와 표면의 기여를 명확히 구분하기 어려웠기에, 고차 위상 절연체의 위상학적 특성을 선택적으로 감지할 수 있는 새로운 분광학적 도구가 필요했습니다.", "result": "고조파 분광법(high harmonic spectroscopy)을 사용하여 벌크, 에지, 코너 상태에서 나오는 신호를 각각 구분해내는 데 성공했습니다.", "implication": "고조파 생성이 단순히 비선형 광학 응답을 넘어 위상 물질의 미세 구조를 파악하는 강력하고 통합적인 위상적 탐침이 될 수 있음을 입증했습니다.", "novelty": "위상학적 상이 변화함에 따라 고조파 방출이 어떻게 진화하는지를 보여주었으며, ARPES와 같은 기존의 평형 상태 측정법을 보완하는 비평형 분광 기법으로서의 가능성을 제시합니다.", "unresolved": "실제 실험적 구현에서 각 상태(벌크 vs 경계)의 신호 세기를 얼마나 정밀하게 분리할 수 있는지, 샘플의 불순물 효과가 어떻게 영향을 미치는지는 추가 연구가 필요합니다.", "future_work": "강한 상관관계를 가진 위상 물질이나 플로케 위상 상태에 대한 고조파 분광학 적용 및 이론적 모델링 확장이 기대됩니다.", "concepts": [{"term": "고차 위상 절연체", "why_emerged": "표면 상태를 넘어 차원이 낮은(예: 1D 경계, 0D 모서리) 위상학적 상태를 설명하기 위해 등장했습니다.", "origin": "Benalcazar, Bernevig, Hughes (2017) 등에 의해 이론적으로 확립되었습니다.", "connections": "벌크-경계 대응 원리, 위상 절연체, 쿼드러폴 위상 절연체."}, {"term": "고조파 분광학", "why_emerged": "강한 레이저 장에 노출된 물질의 전자 비선형 응답을 통해 전자 구조를 탐색하기 위해 필요했습니다.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "비선형 광학, 아토초 분광학."}], "english_summary": ["Demonstrates high-harmonic spectroscopy as a probe for topological insulators.", "Distinguishes contributions from bulk, edge, and corner electronic states.", "Provides a unified framework for characterizing higher-order topological matter.", "Offers an alternative to traditional spectroscopic probes for topological materials."]}}, {"title": "Nonthermal pairing glue of electrons in the steady state", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/69b6-xzv7", "authors": "Michele Pini, Christian H. Johansen, Francesco Piazza", "last_authors": "Christian H. Johansen, Francesco Piazza", "summary": "The study of mechanisms for enhancing superconductivity has been a central topic in condensed matter physics because of the combination of fundamental and technological interests. One promising route is to exploit nonequilibrium effects in the steady state. Efforts in this direction have so far focused on enhancing the pairing mechanism known from thermal equilibrium through modified distributions for the electrons or the bosons mediating the electron–electron interaction. In this work, we identify an additional pairing mechanism that is active only outside thermal equilibrium. By generalizing Eliashberg theory to nonequilibrium steady states using the Keldysh formalism, we derive a set of Eliashberg equations that capture the effect of this genuinely nonthermal pairing glue even in the weak-coupling regime. We discuss two examples where this mechanism has a major impact. First, in a temperature-bias setup, we find that superconductivity is enhanced when the boson mediator is colder than the electrons. Second, we find that an incoherent drive of the boson mediator at energies much greater than the temperature pushes the system far from thermal equilibrium but leaves the critical coupling essentially unchanged, owing to a competition between electron heating and the enhancement of pairing by the nonthermal glue.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Probing non-thermal pairing glue in superconductors, mentioning STS as a detection method.", "tags": ["superconductivity", "STS", "pairingmechanism", "nonequilibrium"], "image": "", "briefing": {"background": "초전도체 연구에서는 전자 간의 인력을 유도하는 '페어링 글루(pairing glue)'를 이해하는 것이 핵심이며, 이를 인위적으로 제어하거나 강화하려는 시도가 비평형 통계역학의 주요 과제입니다.", "motivation": "기존 평형 상태의 페어링 매커니즘을 넘어, 시스템이 비평형 상태에 있을 때만 작동하는 새로운 페어링 메커니즘이 존재하는지 확인하고자 했습니다.", "result": "켈디쉬(Keldysh) 형식을 활용하여 비평형 정상 상태에서만 나타나는 새로운 페어링 글루를 이론적으로 규명하였으며, 보손 매개체가 전자보다 차가울 때 초전도성이 강화됨을 보였습니다.", "implication": "에너지 소모를 줄이거나 외부 구동(drive)을 통해 초전도 임계 온도를 제어할 수 있는 새로운 경로를 이론적으로 제시했습니다.", "novelty": "기존 Eliashberg 이론을 비평형으로 확장하여 '비열적(nonthermal) 페어링 글루'의 존재를 약한 결합 영역에서 증명했습니다.", "unresolved": "실제 고체 물질에서의 실험적 검증이 부족하며, 전자 가열 효과와 페어링 강화 사이의 정밀한 경쟁 양상을 실험 데이터와 직접 대조할 필요가 있습니다.", "future_work": "STS(주사 터널링 분광법)를 이용한 초전도 갭의 비평형 변화 측정 및 관련 물질에서의 실험적 확인 연구가 뒤따라야 합니다.", "concepts": [{"term": "Eliashberg 이론", "why_emerged": "BCS 이론의 약한 결합 근사를 넘어 강한 전자-포논 결합 시스템의 초전도를 기술하기 위해 등장했습니다.", "origin": "G. M. Eliashberg (1960)", "connections": "BCS 이론, 전자-포논 상호작용, 강한 결합 초전도체."}, {"term": "Keldysh 형식", "why_emerged": "시간에 의존하거나 비평형 상태에 있는 양자 다체 시스템을 계산하기 위해 도입되었습니다.", "origin": "L. V. Keldysh (1964)", "connections": "비평형 통계역학, 그린 함수 이론."}], "english_summary": ["Identifies a nonthermal pairing glue mechanism in nonequilibrium steady states.", "Generalizes Eliashberg theory to non-equilibrium via Keldysh formalism.", "Shows superconductivity enhancement when mediating bosons are colder than electrons.", "Discusses the trade-off between heating effects and pairing enhancement."]}}, {"title": "Probing the intermediate state of type-I superconductor SnAs using muon spin spectroscopy", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/z1sz-ly3y", "authors": "Shashank Srivastava, Omkar Kulkarni, Arushi, et al.", "last_authors": "Adrian D. Hillier, Ravi Prakash Singh", "summary": "Superconductivity with nontrivial band topology provides a platform for exploring topological superconductivity and its quantum applications. A detailed microscopic understanding of the superconducting ground state in such materials is crucial. Here, we report the results of a muon spin rotation/rel…", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Experimental muSR study of the superconducting ground state in a topological superconductor.", "tags": ["superconductivity", "topologicalsuperconductor", "muonspinresonance", "experimental"], "image": "", "briefing": {"background": "위상 초전도체 후보 물질의 바닥 상태를 마이크로스케일에서 이해하는 것은 위상 양자 컴퓨터 구현을 위한 필수적인 전제 조건입니다.", "motivation": "SnAs와 같은 1종 초전도체(type-I)이자 위상학적 특성을 가질 것으로 예상되는 물질의 내부 자성 및 초전도 상태를 미시적으로 확인하고자 했습니다.", "result": "뮤온 스핀 회전/완화(muSR) 실험을 통해 SnAs의 중간 상태(intermediate state)에서의 자기적 및 초전도적 성질을 관찰하고 분석했습니다.", "implication": "SnAs가 위상 초전도체로서 가지는 기본적인 전자기적 물성을 명확히 하여 차세대 양자 소자 재료로서의 가능성을 입증했습니다.", "novelty": "뮤온이라는 국소 탐침을 활용하여 SnAs의 초전도 바닥 상태를 심층 분석했다는 점이 중요하며, 이는 저자의 관심사인 위상물질의 위상 초전도성 확인과 직접 연결됩니다.", "unresolved": "실제 초전도 상태에서 위상학적 밴드가 어떻게 발현되는지, 마요라나 페르미온과의 연관성은 추가적인 STS 연구가 필요합니다.", "future_work": "저온 환경에서의 더 정밀한 자화 측정 및 위상학적 밴드 구조를 직접 확인하기 위한 ARPES 연구가 필요합니다.", "concepts": [{"term": "MuSR (뮤온 스핀 회전)", "why_emerged": "물질 내부의 미시적인 자기장을 비파괴적으로 측정하기 위해 개발된 도구입니다.", "origin": "1950년대 후반부터 고에너지 물리학 및 응집물질 물리학에서 활용됨.", "connections": "자기 정렬, 초전도체의 침투 깊이 측정, 나이트 시프트."}, {"term": "중간 상태 (Intermediate state)", "why_emerged": "Type-I 초전도체가 자기장 하에서 초전도 영역과 정상 영역이 섞여 공존하는 현상을 설명하기 위해 등장했습니다.", "origin": "F. London (1930년대)", "connections": "마이스너 효과, Type-I vs Type-II 초전도체."}], "english_summary": ["Investigates the superconducting state of SnAs using muon spin spectroscopy.", "Provides microscopic insights into the intermediate state of this type-I superconductor.", "Validates superconducting ground state properties critical for topological superconductivity.", "Utilizes muSR for high-precision local magnetic probing of the sample."]}}, {"title": "Sizable ligand-mediated bond-dependent interactions in the spin-1 triangular antiferromagnet NiI2", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/7rr7-8cxr", "authors": "Hao Xu, Weiqin Zhu, Shufan Cheng, et al.", "last_authors": "Changsong Xu, Jinsheng Wen", "summary": "Kitaev interaction can generate unusual quantum states and is usually sought in compounds with strongly spin-orbit-coupled magnetic ions. Here, the authors combine neutron scattering with calculations of magnetic structure and excitations to establish sizable Kitaev and off-diagonal interactions in the spin-1 triangular magnet NiI 2 , with spin-orbit coupling supplied instead by surrounding iodine atoms. These interactions stabilize its canted proper-screw order and open an excitation gap. This finding extends the search for Kitaev physics into high‑spin systems with intrinsically weak ionic spin–orbit coupling.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Neutron scattering study of Kitaev interactions in a real triangular antiferromagnet.", "tags": ["neutronscattering", "antiferromagnetism", "Kitaev", "quantummagnetism"], "image": "", "briefing": {"background": "Kitaev 물리학은 강한 스핀-궤도 결합(SOC)을 가진 전이 금속 이온을 통해 양자 액체 등 독특한 양자 상태를 구현하려는 시도에서 중요하게 다뤄집니다.", "motivation": "일반적으로 큰 스핀(spin-1)을 가진 계는 SOC가 약해 Kitaev 상호작용이 무시되기 쉬운데, 이 연구는 리간드(아이오딘)를 통해 간접적으로 유도된 Kitaev 상호작용의 가능성을 확인하고자 했습니다.", "result": "NiI2 시스템에서 중성자 산란 실험과 계산을 통해 상당한 크기의 Kitaev 및 비대각 상호작용이 존재함을 증명했으며, 이것이 스핀 나사(proper-screw) 자기 구조와 여기 갭을 유발함을 보였습니다.", "implication": "Kitaev 물리학의 탐색 범위를 기존의 강한 SOC 기반 물질에서 리간드에 의한 SOC 효과가 중요한 고스핀 물질까지 확장할 수 있음을 시사합니다.", "novelty": "이온 자체의 고유 SOC가 아닌 주변 리간드의 SOC를 통해 Kitaev 물리학을 실현했다는 점이 이론적으로나 실험적으로 새로운 관점을 제공합니다.", "unresolved": "고스핀 계에서 이러한 리간드 매개 상호작용이 양자 스핀 액체와 같은 더 복잡한 상태로 이어질 수 있는지에 대한 추가 연구가 필요합니다.", "future_work": "다른 리간드 기반 화합물로의 확장 연구 및 해당 여기 갭의 에너지 의존적 정밀 측정 등이 기대됩니다.", "concepts": [{"term": "Kitaev interaction", "why_emerged": "기하학적 좌절 상태에서 자기적 비등방성을 통해 양자 스핀 액체를 구현하기 위해 제안됨.", "origin": "Alexei Kitaev (2006).", "connections": "벌집 격자 모델, 스핀-궤도 결합, 양자 스핀 액체."}, {"term": "Proper-screw order", "why_emerged": "비공선형 자기 정렬 상태의 일종으로, 회전 대칭성과 나선형 구조가 결합된 자기 구조를 설명하기 위해 필요함.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "헬리컬 자기 구조, Dzyaloshinskii-Moriya 상호작용."}], "english_summary": ["NiI2 is identified as a platform for Kitaev physics despite being a spin-1 system.", "Ligand-mediated spin-orbit coupling via iodine facilitates Kitaev and off-diagonal interactions.", "Neutron scattering data confirms the existence of these interactions stabilizing the canted magnetic order.", "The findings expand the search for exotic quantum magnetism to high-spin compounds."]}}, {"title": "Spin-Hall angle temperature dependence in NiFe/MnBi2Te4 heterostructures", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/8ndt-kt7c", "authors": "A. S. Pakhomov, V. V. Yurlov, P. N. Skirdkov, et al.", "last_authors": "A. I. Chernov, K. A. Zvezdin", "summary": "Pairing a ferromagnet with the MnBi 2 Te 4 offers a promising route to efficient spin-to-charge conversion, but how well it performs across temperature had remained unmapped. Combining ferromagnetic resonance with inverse spin-Hall voltage measurements from 20–290 K, the authors show here that the spin-Hall angle stays ne iefing": {"background": "전이금속 비화물(K2Cr3As3) 계열은 1차원적인 사슬 구조를 가져 강한 전자 상관관계와 독특한 초전도 현상을 보이는 물질군입니다. 이 물질에서의 위상 초전도성은 새로운 양자 계산 소자나 마요라나 페르미온 연구의 후보로 주목받습니다.", "motivation": "K2Cr3As3 내에서 보고된 여러 초전도 상의 기원과 그 위상적 성질이 불분명하여, 이를 명확히 규명하고 제어하는 방법을 찾고자 합니다.", "result": "이전에 모호했던 초전도 상들의 구체적인 특성을 측정하여 위상적 초전도성을 구현하기 위한 물리적 토대를 마련했습니다.", "implication": "이 물질이 왜 위상 초전도성을 나타낼 수 있는지에 대한 핵심 단서를 제공하며, 다중 위상 제어 가능성을 입증했습니다.", "novelty": "다양한 위상적 상태를 가질 수 있는 물질로서의 가능성을 실험적으로 확인했다는 점이 중요합니다.", "unresolved": "구체적인 페어링 대칭성과 위상적 성질을 확정하기 위한 분광학적 데이터는 여전히 상세 분석이 더 필요합니다.", "future_work": "저온 STM이나 RIXS를 이용한 전자 구조와 초전도 갭의 국소적 대칭성 조사, 특정 위상 상의 고립을 위한 압력/도핑 연구가 예상됩니다.", "concepts": [{"term": "위상 초전도체", "why_emerged": "위상적으로 보호된 마요라나 경계 상태를 통해 양자 계산의 오류 내성을 확보하고자 제안됨.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "초전도성, 위상 절연체, 마요라나 페르미온"}, {"term": "K2Cr3As3", "why_emerged": "quasi-1D 구조를 기반으로 하는 비관습적 초전도체 특성을 연구하기 위해 도입.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "quasi-1D 초전도체, 자기 정렬"}], "english_summary": ["Experimental identification of multiple superconducting phases in K2Cr3As3 is reported.", "The study aims to characterize the topological properties of these superconducting states.", "It serves as a playground for manipulating topological superconductivity in quasi-1D materials.", "Results provide essential data for understanding the unconventional pairing symmetry."]}}, {"title": "Room-Temperature Noncollinear Ferroelectricity in van der Waals WO2Cl2 with a Wide Bandgap", "journal": "PRL_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/zjyw-z6s6", "authors": "Yu Xing, Ning Ding, Zhipeng Wang, et al.", "last_authors": "Linglong Li, Shuai Dong", "summary": "Exotic noncollinear room-temperature ferroelectricity has now been experimentally realized in 2D WO 2 Cl 2 , establishing a polar counterpart to noncollinear spin textures.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Experimental discovery of noncollinear ferroelectricity in a 2D van der Waals material.", "tags": ["experiment", "ferroelectricity", "2Dmaterials", "vanderWaals"], "image": "", "briefing": {"background": "반데르발스(vdW) 층상 물질은 박리가 쉽고 물성 제어가 용이하여 소자 응용에 유리합니다. 강유전성은 전하 극성을 이용한 메모리 소자 등에 필수적이며, 비공선형(noncollinear) 구조는 새로운 자유도를 제공합니다.", "motivation": "2D 시스템에서 상온 상의 비공선형 강유전성을 실현하여, 스핀 텍스처와 유사한 복잡한 극성 구조를 제어하고자 합니다.", "result": "WO2Cl2 물질에서 상온에서 유지되는 비공선형 강유전성을 실험적으로 처음 확인했습니다.", "implication": "비공선형 스핀 텍스처와 유사한 비공선형 극성 텍스처의 구현으로, 새로운 유형의 강유전성 소자 개발이 가능해집니다.", "novelty": "2D vdW 물질에서 상온 강유전성을 비공선형으로 구현했다는 점이 매우 독특하며, 자기적 비공선형 구조와의 대응성을 강조합니다.", "unresolved": "이 강유전성이 박막화 되었을 때 두께에 따라 어떻게 변하는지, 그리고 도메인 스위칭 메커니즘은 무엇인지에 대한 정보가 부족합니다.", "future_work": "PFM(압전 반응 현미경)을 이용한 도메인 직접 관측과, 이 강유전성이 다른 위상 물질과 결합했을 때의 상호작용 연구가 기대됩니다.", "concepts": [{"term": "비공선형 강유전성", "why_emerged": "기존의 선형적인 극성 정렬을 넘어선 복잡한 극성 정렬을 통해 정보 저장 밀도 및 제어 효율을 높이기 위해 필요.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "강유전성, 비공선형 자성, 2D 극성 물질"}, {"term": "반데르발스 WO2Cl2", "why_emerged": "2D 공간에서의 강한 강유전성을 상온에서 구현 가능한 후보 물질로 확인됨.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "2D 소재, 층상 구조물질"}], "english_summary": ["Room-temperature noncollinear ferroelectricity is observed in vdW WO2Cl2.", "This discovery presents a polar counterpart to noncollinear magnetic spin textures.", "The material's wide bandgap and 2D nature make it a strong candidate for future electronic applications.", "It establishes a new class of topological polar materials."]}}, {"title": "Spin Dynamics of the Spin-1 Triangular Lattice Heisenberg Antiferromagnet K2Ni(SeO3)2", "journal": "PRL_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/k4tt-7fq3", "authors": "Chaebin Kim, Sathvik Nallapati, E. A. Ghioldi, et al.", "last_authors": "Cristian D. Batista, Martin Mourigal", "summary": "Strong quantum fluctuations dominate the spin-$1/2$ triangular lattice Heisenberg antiferromagnet, but their survival at spin-1 remains an open question. We address it in ${\\mathrm{K}}_{2}\\mathrm{Ni}({\\mathr rsions in this material exhibits exotic topological feature at a special symmetry direction K K . Generalized gradient approximation (GGA) fails to capture the semiconducting nature of M Cl 3 \\text{M}\\text{Cl}_{3} , incorrectly predicting metallic behavior. In contrast, hybrid functional calculations that includes 25% of exact exchange yield band gaps in good agreement with available literature: 2.54 eV ( VCl 3 \\text{VCl}_{3} ), 4.01 eV ( CrCl 3 \\text{CrCl}_{3} ), and 2.61 eV ( TiCl 3 \\text{TiCl}_{3} ). We use these benchmarks to derive appropriate Hubbard U U parameters for more efficient modeling of magnetic exchange interactions. The ferromagnetic (FM) nature of MCl 3 is evidenced by its positive magnetic exchange interactions. The calculated exchange constants are subsequently used to obtain magnon dispersions by diagonalizing the spin Hamiltonian within the Holstein-Primakoff transformation. The two calculated magnon branches in CrCl 3 , originating from the two magnetic sublattices, exhibit topological features along the high-symmetry K K direction. This topological magnonic feature at K K overlaps with the topological feature seen in phonons leading to magnon-phonon coupling. These dispersions are in an excellent agreement with the available experimental magnon dispersions of CrI 3 . Doping VCl 3 with Ti or Cr modifies the bandgap (to 1.32 eV and 2.74 eV, respectively) while maintaining ferromagnetism. Ce-doping in CrCl 3 preserves the FM semiconducting behavior, producing a localized 4 ​ f 4f state and spin as well as orbital magnetic moments. Originating from this localized 4 ​ f 4f state below the Fermi level, nearest-neighbor Ce-Ce coupling yields a large exchange constant, suggesting possibility of a robust magnetic phase. Overall, the electronic and magnetic tunability of these materials through 3 ​ d 3d - and 4 ​ f 4f -electron doping in this family of 2D materials advances the magnonic and phononic functionalities making them ideal for spintronics.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "DFT study of electronic structure, magnetism, magnons, and topological features in 2D materials.", "tags": ["DFT", "2Dmaterial", "magnetism", "magnon", "topological"], "image": "https://arxiv.org/html/2608.27747v1/Fig_1.png", "briefing": {"background": "자동 브리핑을 생성하지 못했습니다. 초록과 원문 링크를 기준으로 빠르게 확인하세요.", "motivation": "초록 정보만으로는 분야 내부의 구체적 동기를 안정적으로 요약하기 어렵습니다.", "result": "We report phase stability, electronic structure, magnetic interactions, phononics, and magnonics of selective pristine, 3 ​ d 3d -element (Ti or Cr) doped, and 4 ​ f 4f -element (Ce) doped transition metal trichlorides ( M Cl 3 \\text{M}\\text{Cl}_{3} ), calculated using advanced density functional theory. Negative cohesive and formation energies prove that pristine M Cl 3 \\text{M}\\text{Cl}_{3} has strong chemical and structural stability. Meanwhile, negative defect formation energies show that adding dopant atoms is energetically favorable and keeps the doped crystal stable. The positive phonon frequencies in Ce Cl 3 \\text{Ce}\\text{Cl}_{3} confirm the dynamical stability of adding cerium to the transition metal trichlorides. The phonon dispersions in this material exhibits exotic topological feature at a special symmetry direction K K . Generalized gradient approximation (GGA) fails to ca", "implication": "필터가 이 논문을 통과시킨 이유는 관련 키워드, 저자, 또는 Gemini relevance score 때문입니다.", "novelty": "DFT study of electronic structure, magnetism, magnons, and topological features in 2D materials.", "unresolved": "원문 확인 후 열린 질문을 판단해야 합니다.", "future_work": "후속 실험, 독립 재현, 관련 물질/조건 확장이 가능한지 확인하세요.", "concepts": [], "english_summary": ["The detailed AI briefing was unavailable for this paper.", "Use the abstract, score reason, and original link for a quick first pass."]}}, {"title": "Evidence for Three-component Interlayer Coherent Exciton Condensation", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2608.28338", "authors": "Subi Du, Xiaohan Zhang, Hongxi Song, et al.", "last_authors": "Jiangping Hu, Yang Xu", "summary": "Increasing the number of internal components in a quantum many-body system can host collective orders inaccessible to simpler settings. Quantum Hall bilayers provide a canonical realization of interlayer exciton condensation, yet extending such coherence across three independently addressable electronic fluids has remained elusive. Here we report evidence for three-component interlayer coherent exciton condensation in triple-layer graphene system. Using Rydberg excitons in an adjacent WSe2 monolayer as a layer-sensitive optical probe, we resolve interaction-induced incompressibility at zeroth-Landau-level crossings for all three pairwise layer combinations, establishing top-middle, middle-bottom and top-bottom exciton condensate channels within the same device. Independent control of displacement field and interlayer bias continuously tunes these pairwise states towards a regime where Landau levels from all three layers approach simultaneous degeneracy. At their convergence, incompressibility persists while the exciton energy and spectral weight evolve smoothly between the pairwise limits, suggesting coherent participation of all three layers in a single three-component state. More broadly, the ability to independently control layer potentials and engineer interlayer interactions establishes multilayer graphene as a programmable synthetic dimension for exploring higher-component quantum Hall order and simulating strongly correlated quantum matter.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Strong experimental study of correlated phases in graphene trilayers, highly relevant to quantum matter.", "tags": ["graphene", "correlated", "quantum-hall"], "image": "https://arxiv.org/static/browse/0.3.4/images/arxiv-logo-fb.png", "briefing": {"background": "자동 브리핑을 생성하지 못했습니다. 초록과 원문 링크를 기준으로 빠르게 확인하세요.", "motivation": "초록 정보만으로는 분야 내부의 구체적 동기를 안정적으로 요약하기 어렵습니다.", "
