<!DOCTYPE html>

<head>
<meta charset='UTF-8'>
<meta name='viewport' content='width=device-width, initial-scale=1.0'>
<title>Daily Paper Slideshow</title>
<style>
  :root {
    color-scheme: light;
    --bg: #f6f7f4;
    --paper: #ffffff;
    --ink: #111827;
    --muted: #64748b;
    --line: #d8ddd2;
    --accent: #176b87;
    --accent-2: #9a3412;
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; overflow: auto; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: var(--bg); color: var(--ink); }
  .shell { max-width: 1500px; min-height: 100vh; margin: 0 auto; padding: 14px 18px; display: flex; flex-direction: column; }
  .topbar { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 16px; }
  .top-actions { display: flex; align-items: center; gap: 10px; }
  .topbar a, button { border: 1px solid var(--line); border-radius: 8px; background: var(--paper); color: var(--ink); padding: 10px 14px; font-weight: 700; text-decoration: none; cursor: pointer; }
  button.primary { background: var(--accent); border-color: var(--accent); color: white; }
  button:disabled { opacity: 0.45; cursor: not-allowed; }
  .counter { color: var(--muted); font-weight: 700; }
  .slide { min-height: calc(100vh - 82px); background: var(--paper); border: 1px solid var(--line); border-radius: 10px; padding: 18px; box-shadow: 0 18px 42px rgba(15, 23, 42, 0.10); display: grid; grid-template-columns: minmax(310px, 0.86fr) minmax(0, 1.55fr); gap: 18px; overflow: visible; }
  .paper-head { min-width: 0; min-height: 0; overflow: visible; display: flex; flex-direction: column; gap: 12px; }
  .figure { margin: 0; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: #f8fafc; }
  .figure img { display: block; width: 100%; max-height: 41vh; object-fit: contain; background: white; }
  .figure figcaption { padding: 7px 10px; color: var(--muted); font-size: 12px; line-height: 1.3; }
  .head-text { display: flex; flex-direction: column; gap: 9px; min-width: 0; }
  .badges { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .badge { border-radius: 999px; padding: 5px 9px; background: #eef2ff; color: #3730a3; font-size: 12px; font-weight: 800; }
  .score { background: #fee2e2; color: #991b1b; }
  h1 { margin: 0; font-size: 25px; line-height: 1.15; letter-spacing: 0; overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
  h1 a { color: inherit; text-decoration-color: rgba(23, 107, 135, 0.35); text-decoration-thickness: 2px; text-underline-offset: 4px; }
  h1 a:hover { color: var(--accent); text-decoration-color: var(--accent); }
  .meta, .authors, .why, .abstract { font-size: 13px; line-height: 1.45; }
  .meta, .authors { color: var(--muted); }
  .why strong, .abstract strong, .authors strong { color: var(--ink); }
  .authors { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .why { border-left: 4px solid var(--accent-2); padding-left: 10px; color: #374151; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .abstract { border-top: 1px solid var(--line); padding-top: 14px; color: #374151; }
  .original-abstract { border-top: 1px solid var(--line); padding-top: 10px; color: #374151; font-size: 11.5px; line-height: 1.35; overflow-wrap: anywhere; }
  .original-abstract strong { display: block; margin-bottom: 4px; color: var(--ink); }
  .tags { display: flex; flex-wrap: wrap; gap: 8px; }
  .tag { border-radius: 999px; padding: 4px 8px; background: #f1f5f9; color: #475569; font-size: 12px; font-weight: 700; }
  .head-text > .link { display: none; }
  .briefing { min-width: 0; min-height: 0; overflow: visible; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); grid-auto-rows: minmax(0, auto); align-content: start; gap: 11px 18px; border-top: 0; padding-top: 0; }
  .brief-section { min-width: 0; }
  .brief-section.wide { grid-column: 1 / -1; }
  .brief-section h2 { margin: 0 0 4px; font-size: 14px; line-height: 1.22; color: #0f766e; letter-spacing: 0; }
  .brief-section p, .brief-section li { margin: 0; font-size: 12.5px; line-height: 1.42; color: #1f2937; overflow-wrap: anywhere; }
  .brief-section ul { margin: 0; padding-left: 20px; }
  .concepts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 9px 14px; }
  .concept { border-top: 1px solid var(--line); padding-top: 7px; }
  .concept h3 { margin: 0 0 4px; font-size: 13px; color: #7c2d12; letter-spacing: 0; }
  .concept p { margin: 2px 0 0; font-size: 11.5px; line-height: 1.35; color: #374151; overflow-wrap: anywhere; }
  .concept b { color: #111827; }
  .link { color: var(--accent); font-weight: 800; text-decoration: none; }
  .empty { padding: 48px; background: var(--paper); border: 1px solid var(--line); border-radius: 12px; color: var(--muted); }
  @media (max-width: 860px) {
    .shell { padding: 14px; }
    .topbar, .top-actions { align-items: stretch; flex-direction: column; }
    .slide, .briefing, .concepts { grid-template-columns: 1fr; }
    .slide { min-height: auto; overflow: visible; display: grid; }
    h1 { font-size: 28px; }
  }
</style>

<script>
const slides = [{"title": "Pressure tuning of electronic correlations and flat bands in CsCr3Sb5", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/pqbc-87xb", "authors": "Maria Chatzieleftheriou, Jonas B. Profe, Ying Li, Roser Valentí", "last_authors": "Ying Li, Roser Valentí", "summary": "${\\mathrm{CsCr}}_{3}{\\mathrm{Sb}}_{5}$ is a newly identified strongly correlated kagome superconductor, characterized by non-Fermi-liquid behavior at elevated temperatures and intertwined charge and spin density wave order below ${T}_{\\text{DW}}≈54\\phantom{\\rule{0.222222em}{0ex}}\\mathrm{K}$. Under e…", "tier": "A_MUST_READ", "score": "10", "reason": "Directly addresses correlations and flat bands in a novel kagome superconductor system.", "tags": ["experiment", "CsCr3Sb5", "kagome"], "image": "", "briefing": {"background": "카고메 격자(Kagome lattice) 기반 물질들은 기하학적 좌절(geometric frustration)로 인해 발생하는 평탄 밴드(flat band)와 디락 원뿔(Dirac cone) 등 독특한 전자 구조를 가집니다. 최근 AV3Sb5 계열의 카고메 금속에서 초전도 현상과 전하 밀도파(CDW)의 얽힘이 발견되어 응집물질 물리 분야의 핵심 주제가 되었습니다.", "motivation": "새롭게 발견된 CsCr3Sb5는 기존의 V 기반 카고메 물질보다 전자 상관관계(electronic correlation)가 훨씬 강하며, 비-페르미 액체(non-Fermi-liquid) 거동과 스핀 밀도파(SDW)를 보입니다. 연구진은 외부 압력을 통해 이 시스템의 강력한 전자 상관관계와 평탄 밴드가 어떻게 변화하는지 규명하고자 했습니다.", "result": "압력을 가함에 따라 CsCr3Sb5의 전자 상관관계가 정밀하게 조절되며, 이 과정에서 평탄 밴드의 위치와 그에 따른 유효 질량이 변화함을 확인했습니다. 특히 압력이 증가함에 따라 상관관계의 세기가 변하며 시스템의 상도표가 재구성되는 거동을 이론적/실험적으로 분석했습니다.", "implication": "이 연구는 카고메 시스템에서 전자 상관관계를 외부 변수(압력)로 제어할 수 있음을 보여줍니다. 이는 Cr 기반 카고메 물질이 단순한 금속을 넘어 상관관계가 주도하는 양자 상전이를 연구하기에 최적의 플랫폼임을 시사합니다.", "novelty": "독자의 관심사인 CsV3Sb5와 구조적으로 유사하면서도, Cr을 도입해 자성(SDW)과 강한 상관관계를 결합한 시스템을 다루고 있습니다. 특히 압력을 변수로 하여 평탄 밴드의 물리적 특성을 튜닝했다는 점이 독창적입니다.", "unresolved": "압력 하에서 나타나는 SDW와 초전도성 사이의 정확한 경쟁 관계 및 전하 밀도파와의 상호작용 메커니즘은 여전히 추가 연구가 필요합니다.", "future_work": "고압 환경에서의 ARPES 실험을 통해 계산된 밴드 구조 변화를 직접적으로 검증하고, 압력 유도 초전도 임계 온도(Tc)의 변화를 정밀 측정하는 연구가 기대됩니다.", "concepts": [{"term": "CsCr3Sb5", "why_emerged": "기존 AV3Sb5 계열보다 강한 전자 상관관계를 가진 카고메 격자 시스템을 탐색하기 위해 등장함.", "origin": "초록 정보만으로는 특정하기 어려우나 최근 새롭게 합성된 물질임.", "connections": "CsV3Sb5, Kagome superconductor, Strong correlation"}, {"term": "Flat Band (평탄 밴드)", "why_emerged": "운동량에 상관없이 에너지가 일정한 밴드로, 전자의 유효 질량이 무한대가 되어 상관관계 효과를 극대화함.", "origin": "카고메 격자나 트위스트 바이레이어 그래핀 등 특정 격자 구조의 기하학적 특성에서 유래함.", "connections": "Electronic correlation, Mott insulator, Superconductivity"}, {"term": "Electronic Correlation (전자 상관관계)", "why_emerged": "전자 간의 쿨롱 상호작용이 강해 단일 입자 근사로 설명할 수 없는 현상을 설명하기 위해 도입됨.", "origin": "Mott, Hubbard 등에 의해 이론적 기초가 확립됨.", "connections": "Non-Fermi-liquid, Heavy fermion, Mott transition"}, {"term": "Pressure Tuning (압력 조절)", "why_emerged": "화학적 도핑과 달리 불순물을 도입하지 않고 격자 상수를 조절해 물리적 특성을 변화시키기 위해 사용됨.", "origin": "고압 물리 실험 기법의 발전과 함께 정착됨.", "connections": "Quantum phase transition, Lattice constant, Diamond anvil cell"}], "english_summary": ["Investigates the effect of pressure on the strongly correlated kagome superconductor CsCr3Sb5.", "Demonstrates that electronic correlations and flat band properties can be effectively tuned via external pressure.", "Provides insights into the interplay between magnetism (SDW) and electronic structure in Cr-based kagome systems.", "Identifies a pathway to manipulate quantum phases in frustrated lattice structures."]}}, {"title": "Tunable electron-plasmon coupling in the layered transition metal dichalcogenide ZrSe2−xTex", "journal": "PRB_Recent", "source": "author whitelist", "link": "http://link.aps.org/doi/10.1103/mkfk-8k2t", "authors": "Tongrui Li, Yuzhe Wang, Haoyuan Yan, et al.", "last_authors": "Donglai Feng, Juan Jiang", "summary": "Electron-plasmon coupling, in which carriers are dressed by collective electronic oscillations, represents an important many-body interaction in solids. Here, using angle-resolved photoemission spectroscopy, we report the tunable electron-plasmon coupling in the layered transition metal dichalcogeni…", "tier": "A_MUST_READ", "score": "10", "reason": "author whitelist: Donglai Feng", "tags": ["angle-resolvedphotoemission", "photoemission"], "image": "", "briefing": {"background": "고체 내에서 전자가 집단적인 전자 진동인 플라즈몬(plasmon)과 상호작용하는 '전자-플라즈몬 결합'은 물질의 광학적, 전기적 성질을 결정하는 중요한 다체 현상(many-body interaction)입니다. 특히 2차원 층상 물질에서 이러한 결합의 제어는 소자 응용 측면에서 중요합니다.", "motivation": "전이금속 디칼코게나이드(TMD)인 ZrSe2에서 Se를 Te로 점진적으로 치환함에 따라 전자 구조와 플라즈몬 결합이 어떻게 변화하는지 ARPES를 통해 실시간으로 관찰하고 이를 제어할 방법을 찾고자 했습니다.", "result": "Te의 도핑 농도(x)를 조절함에 따라 캐리어 농도와 유전 상수가 변화하며, 이로 인해 전자-플라즈몬 결합의 세기가 연속적으로 튜닝됨을 ARPES 데이터로 입증했습니다. 도핑을 통해 준입자(quasiparticle)의 특성을 직접 제어할 수 있음을 보였습니다.", "implication": "TMD 물질에서 화학적 조성을 통해 다체 상호작용의 세기를 조절할 수 있음을 보여줌으로써, 향후 플라즈모닉스 기반의 차세대 전자 소자 설계에 중요한 물리적 근거를 제시합니다.", "novelty": "ARPES 분야의 저명한 연구자인 Donglai Feng 그룹의 연구로, 단순한 밴드 관찰을 넘어 전자-플라즈몬 결합이라는 정교한 다체 물리 현상을 TMD 시스템에서 정량적으로 분석했다는 점이 돋보입니다.", "unresolved": "치환된 Te 원자가 유도하는 무질서(disorder) 효과가 플라즈몬 산란에 미치는 영향에 대해서는 추가적인 논의가 필요합니다.", "future_work": "다른 층상 물질(예: MoS2, WSe2)로의 확장 연구 및 광학적 펌프-프로브 실험을 통한 비평형 플라즈몬 동역학 연구가 가능합니다.", "concepts": [{"term": "Electron-plasmon coupling", "why_emerged": "전자가 주변 전하 구름의 집단적 진동과 에너지를 주고받는 현상을 설명하기 위해 등장함.", "origin": "Bohm과 Pines의 플라즈몬 이론에서 기초함.", "connections": "Quasiparticle, Polaron, Many-body physics"}, {"term": "ARPES", "why_emerged": "고체 내부 전자의 에너지와 운동량을 직접 측정하여 밴드 구조를 시각화하기 위해 개발됨.", "origin": "Einstein의 광전효과를 기반으로 하며, Kai Siegbahn 등에 의해 발전됨.", "connections": "Fermi surface, Electronic structure, Photoemission"}, {"term": "TMD (Transition Metal Dichalcogenide)", "why_emerged": "그래핀과 유사한 층상 구조를 가지면서도 밴드갭이 있어 반도체 및 광학 소자에 활용하기 위해 연구됨.", "origin": "자연적으로 존재하는 MoS2 등의 연구에서 시작됨.", "connections": "ZrSe2, 2D materials, Van der Waals heterostructures"}, {"term": "Chemical Substitution (화학적 치환)", "why_emerged": "물질의 격자 구조는 유지하면서 전자 농도나 스핀 특성을 미세하게 조절하기 위해 사용됨.", "origin": "고체화학 및 재료과학의 표준적인 방법론.", "connections": "Doping, Alloy, Phase diagram"}], "english_summary": ["Reports tunable electron-plasmon coupling in ZrSe2-xTex using ARPES.", "Shows that Te substitution modulates carrier density and dielectric environment to control many-body interactions.", "Provides experimental evidence of quasiparticle renormalization by collective electronic oscillations.", "Highlights the potential for engineering electronic properties in layered TMDs."]}}, {"title": "Direct evidence of light-induced phase-fluctuations in cuprates via time-resolved ARPES", "journal": "npj_QuantumMaterials", "source": "keyword", "link": "https://www.nature.com/articles/s41535-026-00919-y", "authors": "D. Armanno, F. Goto, J.-M. Parent, et al.", "last_authors": "N. Gauthier, F. Boschini", "summary": "Direct evidence of light-induced phase-fluctuations in cuprates via time-resolved ARPES", "tier": "A_MUST_READ", "score": "10", "reason": "title strong match: ARPES", "tags": ["ARPES", "cuprate"], "image": "https://pubads.g.doubleclick.net/gampad/ad?iu=/285/npjquantmats.nature.com/article&sz=728x90&c=1755815862&t=pos%3Dtop%26type%3Darticle%26artid%3Ds41535-026-00919-y%26doi%3D10.1038/s41535-026-00919-y%26subjmeta%3D301,639,766%26kwrd%3DMaterials+science,Physics", "briefing": {"background": "구리 산화물(Cuprate) 초전도체에서 초전도 상태는 쿠퍼 쌍의 진폭(amplitude)뿐만 아니라 위상(phase)의 결맞음(coherence)에 의해 결정됩니다. 특히 고온 초전도체에서는 열적/양자적 위상 흔들림(phase fluctuation)이 초전도 전이 온도 부근에서 중요한 역할을 합니다.", "motivation": "강력한 빛(레이저)을 쏘아 초전도체를 비평형 상태로 만들었을 때 관찰되는 변화가 단순한 가열 효과인지, 아니면 위상 결맞음의 파괴 때문인지를 시간 분해 ARPES(tr-ARPES)를 통해 규명하고자 했습니다.", "result": "빛을 조사한 직후 전자 구조의 스펙트럼 강도 변화를 분석하여, 초전도 응축물의 위상이 무작위하게 흔들리는 '위상 흔들림' 현상이 유도됨을 직접적인 증거로 제시했습니다. 이는 빛이 초전도 쌍을 직접 파괴하기보다 위상 결맞음을 먼저 무너뜨릴 수 있음을 보여줍니다.", "implication": "광유도 초전도성(light-induced superconductivity)이나 광제어 현상의 메커니즘을 이해하는 데 있어 '위상 동역학'이 핵심 요소임을 입증했습니다. 이는 빛을 이용한 초전도 스위칭 기술의 물리적 한계를 규정합니다.", "novelty": "tr-ARPES의 높은 시간/에너지 분해능을 활용하여, 그동안 간접적으로만 추론되었던 '빛에 의한 위상 흔들림'을 전자 구조상에서 직접 관측했다는 점이 매우 중요합니다.", "unresolved": "관찰된 위상 흔들림이 테라헤르츠(THz) 펌핑 시 보고되는 초전도 증강 현상과 어떤 정량적 상관관계를 갖는지에 대해서는 추가 연구가 필요합니다.", "future_work": "펌프 광의 파장 및 세기를 조절하여 위상 흔들림을 억제하고 오히려 결맞음을 강화할 수 있는 특정 비평형 경로를 찾는 연구가 예상됩니다.", "concepts": [{"term": "Time-resolved ARPES (tr-ARPES)", "why_emerged": "펌프-프로브 기법을 결합하여 고체 내 전자의 비평형 동역학을 초고속 시간 단위로 관찰하기 위해 개발됨.", "origin": "레이저 기술의 발전과 기존 ARPES의 결합으로 탄생함.", "connections": "Ultrafast dynamics, Non-equilibrium physics, Pump-probe"}, {"term": "Phase Fluctuations (위상 흔들림)", "why_emerged": "초전도 응축물의 위상이 불확실해지면서 거시적인 초전도성이 사라지는 현상을 설명하기 위해 도입됨.", "origin": "Emery와 Kivelson 등이 구리 산화물 초전도 이론에서 강조함.", "connections": "Phase coherence, BKT transition, Superconducting dome"}, {"term": "Cuprates (구리 산화물 초전도체)", "why_emerged": "액체 질소 온도 이상에서 작동하는 고온 초전도 현상을 구현하기 위해 발견됨.", "origin": "1986년 Bednorz와 Müller가 발견함.", "connections": "High-Tc superconductivity, Pseudogap, Cooper pair"}, {"term": "Non-equilibrium State (비평형 상태)", "why_emerged": "외부 자극(빛, 전류 등)에 의해 열적 평형에서 벗어난 물질의 새로운 물성을 연구하기 위해 도입됨.", "origin": "통계역학 및 레이저-물질 상호작용 연구에서 유래함.", "connections": "Floquet engineering, Transient superconductivity, Relaxation"}], "english_summary": ["Provides direct evidence of light-induced phase fluctuations in cuprates using time-resolved ARPES.", "Identifies that optical excitation primarily disrupts phase coherence rather than just suppressing the gap amplitude.", "Clarifies the non-equilibrium mechanism of superconducting state manipulation by light.", "Establishes the critical role of phase dynamics in ultrafast control of high-Tc superconductors."]}}, {"title": "A magnetic impurity sets off ripples in a kagome superconductor", "journal": "Nature_Physics", "source": "keyword", "link": "https://www.nature.com/articles/s41567-026-03372-7", "authors": "Barun Ghosh", "last_authors": "Barun Ghosh", "summary": "The role of magnetic impurities in shaping superconductivity and electronic order in kagome metals remains unresolved. Now, a study reveals anisotropic Kondo resonances intertwined with the superconducting gap in a magnetically doped kagome superconductor.", "tier": "A_MUST_READ", "score": "9", "reason": "title strong match: kagome superconductor", "tags": ["kagome", "Kondo", "superconduct"], "image": "https://media.springernature.com/m685/springer-static/image/art%3A10.1038%2Fs41567-026-03372-7/MediaObjects/41567_2026_3372_Fig1_HTML.png", "briefing": {"background": "카고메 격자를 가진 금속은 전하 밀도파(CDW), 초전도, 위상학적 특성이 공존하며 상호작용하는 독특한 플랫폼을 제공합니다. 특히 카고메 초전도체에서 외부 자성 불순물이 전자 구조와 초전도 갭의 대칭성에 어떤 영향을 미치는지는 양자 물질 연구의 핵심 과제 중 하나입니다.", "motivation": "카고메 초전도체 내에서 자성 불순물이 유도하는 국소적인 전자 상태의 변화와 이것이 전체 초전도 질서 매개변수와 어떻게 얽혀 있는지 규명하고자 합니다.", "result": "자성 불순물이 도입된 카고메 초전도체에서 초전도 갭 내부에 형성되는 콘도 공명(Kondo resonance) 현상을 관측했습니다. 특히 이 공명 상태가 카고메 격자의 대칭성을 반영하여 비등방적인(anisotropic) 형태를 띠며 초전도 갭과 밀접하게 연관되어 있음을 확인했습니다.", "implication": "자성 불순물을 이용해 카고메 초전도체의 페어링 대칭성이나 전자적 상관관계를 정밀하게 탐침할 수 있음을 시사하며, 이는 향후 비전통적 초전도 기전 규명에 기여할 수 있습니다.", "novelty": "카고메 격자라는 특수한 기하학적 구조에서 자성 불순물이 만드는 '잔물결(ripples)'과 같은 전자적 섭동을 비등방성 콘도 공명을 통해 시각화하고 초전도와의 상관관계를 밝힌 점이 새롭습니다. 독자의 관심사인 CsV3Sb5 등 카고메 금속의 전자 구조 연구와 직결됩니다.", "unresolved": "불순물의 농도나 종류에 따른 초전도 상전이 온도의 정량적 변화 및 벌크 물성과의 완전한 일치 여부는 추가 연구가 필요합니다.", "future_work": "다양한 자성 원자를 도핑하여 불순물 유도 상태(Shiba state 등)와 콘도 물리 사이의 경쟁 관계를 조사하고, 극저온 STM을 통한 정밀 측정이 이어질 것으로 보입니다.", "concepts": [{"term": "Kagome superconductor", "why_emerged": "카고메 격자의 기하학적 좌절과 평탄 밴드에서 기인하는 특이한 전자 상태를 연구하기 위해 등장했습니다.", "origin": "1950년대 격자 모델 연구에서 유래했으나, 최근 AV3Sb5 계열의 발견으로 급부상했습니다.", "connections": "Charge Density Wave (CDW), Flat bands, Frustrated magnetism"}, {"term": "Kondo resonance", "why_emerged": "금속 내 자성 불순물이 전도 전자와 상호작용하여 페르미 준위 근처에서 나타나는 산란 현상을 설명하기 위해 제안되었습니다.", "origin": "1964년 Jun Kondo의 이론적 제안.", "connections": "Heavy fermions, Quantum dots, Scanning Tunneling Spectroscopy (STS)"}, {"term": "Anisotropy", "why_emerged": "결정 구조나 전자 궤도의 방향에 따라 물리량이 달라지는 현상을 설명하기 위해 필요합니다.", "origin": "초록 정보만으로는 특정하기 어려움 (고체물리 일반 개념).", "connections": "Nematicity, Orbital order, Directional scattering"}, {"term": "Superconducting gap", "why_emerged": "초전도 상태에서 쿠퍼 쌍을 형성하기 위해 필요한 최소 에너지를 정의하기 위해 등장했습니다.", "origin": "1957년 BCS 이론에서 정립되었습니다.", "connections": "Cooper pairs, Quasiparticle interference (QPI), ARPES"}], "english_summary": ["Discovered anisotropic Kondo resonances in a magnetically doped kagome superconductor.", "Revealed the intricate coupling between magnetic impurity states and the superconducting gap.", "Provided insights into the role of local perturbations in shaping the global electronic order of kagome metals.", "Highlighted the importance of geometric lattice effects on impurity-induced electronic features."]}}, {"title": "Observation of superconductivity-induced leading-edge gap in a bilayer nickelate", "journal": "Nature_Physics", "source": "author whitelist", "link": "https://www.nature.com/articles/s41567-026-03396-z", "authors": "Wenjie Sun, Zhicheng Jiang, Bo Hao, et al.", "last_authors": "Donglai Feng, Yuefeng Nie", "summary": "Superconductivity has been demonstrated in La3Ni2O7, and now the structure of the superconducting gap is observed. The Fermi surface is shown to derive mainly from the $${d}_{{x}^{2}-{y}^{2}}$$ d x 2 − y 2 bands, with minimal involvement from the $${d}_{{z}^{2}}$$ d z 2 band.", "tier": "A_MUST_READ", "score": "9", "reason": "author whitelist: Donglai Feng", "tags": ["nickelate", "superconduct", "Fermisurface"], "image": "https://media.springernature.com/m685/springer-static/image/art%3A10.1038%2Fs41567-026-03396-z/MediaObjects/41567_2026_3396_Fig1_HTML.png", "briefing": {"background": "최근 발견된 La3Ni2O7과 같은 이층 구조 니켈레이트는 고압 환경에서 고온 초전도성을 나타내어 제2의 구리 산화물(cuprate)로 큰 관심을 받고 있습니다. 하지만 이들의 페르미 면과 초전도 갭의 구체적인 구조는 실험적으로 확인하기 어려웠습니다.", "motivation": "이층 구조 니켈레이트의 초전도 상태에서 에너지 갭(Leading-edge gap)을 직접 관측하여, 어떤 전자 궤도가 초전도 형성에 핵심적인 역할을 하는지 규명하는 것이 목적입니다.", "result": "초전도 유도 에너지 갭을 관측하는 데 성공했으며, 페르미 면이 주로 dx2-y2 궤도에서 기인한다는 것을 확인했습니다. 반면, 기존 이론에서 중요하게 다루어졌던 dz2 궤도의 기여는 미미한 것으로 나타났습니다.", "implication": "니켈레이트 초전도 메커니즘에서 dx2-y2 궤도의 지배적인 역할을 입증함으로써, 구리 산화물과의 유사성 및 차이점을 명확히 하고 향후 이론 모델 수정에 중요한 근거를 제공합니다.", "novelty": "ARPES 측정(Leading-edge gap 분석)을 통해 니켈레이트의 초전도 갭 구조를 실험적으로 제시한 선구적인 연구입니다. 독자가 주목하는 Donglai Feng 교수 그룹의 성과로 신뢰도가 높습니다.", "unresolved": "고압 하에서의 실험적 제약으로 인해 갭의 정확한 대칭성(s-wave 또는 d-wave 등)을 완전히 확정하는 데에는 추가 데이터가 필요할 수 있습니다.", "future_work": "압력 변화에 따른 궤도 기여도의 정밀 측정 및 다른 니켈레이트 화합물(La4Ni3O10 등)과의 비교 분석이 예상됩니다.", "concepts": [{"term": "Bilayer nickelate", "why_emerged": "이층 구조를 가진 니켈 산화물에서 고온 초전도 가능성을 탐색하기 위해 연구되었습니다.", "origin": "2023년 La3Ni2O7의 고온 초전도성 보고(Sun et al.).", "connections": "Cuprates, High-Tc superconductivity, La3Ni2O7"}, {"term": "Leading-edge gap", "why_emerged": "ARPES 실험에서 초전도 갭을 정량화하기 위해 스펙트럼의 페르미 준위 근처 에너지를 측정하는 방식입니다.", "origin": "ARPES 초기 연구 및 고온 초전도체 분석 과정에서 확립되었습니다.", "connections": "ARPES, Superconducting gap, Energy resolution"}, {"term": "dx2-y2 orbital", "why_emerged": "전이금속 산화물의 전자 구조에서 평면 방향의 전도성을 결정하는 핵심 궤도입니다.", "origin": "결정장 이론(Crystal Field Theory)에서 유래했습니다.", "connections": "Cuprates, Orbital-selective physics, Tight-binding model"}, {"term": "Fermi surface", "why_emerged": "금속의 전기적, 자기적 성질을 결정하는 운동량 공간상의 경계면을 정의하기 위해 도입되었습니다.", "origin": "초기 양자통계 및 금속 이론에서 발전했습니다.", "connections": "Brillouin zone, Luttinger's theorem, ARPES"}], "english_summary": ["Reported the first observation of a superconductivity-induced leading-edge gap in bilayer La3Ni2O7.", "Identified that the Fermi surface is predominantly formed by dx2-y2 orbitals rather than dz2.", "Challenged existing theoretical models that emphasized the dominance of the dz2 band in nickelate superconductivity.", "Utilized ARPES-based gap analysis to provide experimental constraints on the pairing mechanism."]}}, {"title": "Electron orbitals choose a direction", "journal": "Nature_Physics", "source": "Gemini", "link": "https://www.nature.com/articles/s41567-026-03358-5", "authors": "Pochang Chen, Md Shafayat Hossain", "last_authors": "Pochang Chen, Md Shafayat Hossain", "summary": "Orbital order is difficult to isolate because it often intertwines with lattice and magnetic transitions. Now, a study on an intermetallic compound reveals a surface 5d-orbital order through its electronic band structure and real-space fingerprints.", "tier": "B_IMPORTANT_CONDMAT", "score": "9", "reason": "Directly relevant study of orbital order using electronic band structure and real-space fingerprints.", "tags": ["ARPES", "STM", "electronic-structure"], "image": "https://media.springernature.com/m685/springer-static/image/art%3A10.1038%2Fs41567-026-03358-5/MediaObjects/41567_2026_3358_Fig1_HTML.png", "briefing": {"background": "궤도 질서(Orbital order)는 전자의 궤도 점유 상태가 특정 방향성을 갖는 현상으로, 종종 격자 변형이나 자기적 전이와 동시에 발생하여 이를 독립적으로 구분해내기가 매우 어렵습니다.", "motivation": "격자나 자성의 영향이 최소화된 상태에서 순수한 궤도 질서가 전자 밴드 구조와 실공간 이미지에 미치는 영향을 직접 관측하고자 합니다.", "result": "특정 금속 화합물 표면에서 5d 전자들이 특정 방향으로 정렬되는 궤도 질서를 발견했습니다. 이를 ARPES를 통한 밴드 구조 변화와 STM을 통한 실공간 '지문(fingerprint)' 관측으로 증명했습니다.", "implication": "궤도 질서가 전자 구조에 미치는 독자적인 영향을 규명함으로써, 네마틱성(nematicity)이나 대칭성 붕괴 현상을 이해하는 새로운 시각을 제공합니다.", "novelty": "5d 궤도 시스템에서 궤도 질서를 밴드 구조와 실공간에서 동시에 포착하여 '궤도의 선택'을 명확히 보여준 점이 돋보입니다. 독자의 ARPES/STM 관심도와 밀접한 관련이 있습니다.", "unresolved": "표면에서 관측된 이 궤도 질서가 벌크 내부에서도 동일하게 존재하는지, 혹은 표면 대칭성 파괴에 의한 고유 효과인지에 대한 검증이 필요합니다.", "future_work": "온도 변화에 따른 궤도 질서의 상전이 과정 관측 및 외부 변수(스트레인, 전계 등)를 이용한 궤도 조절 연구가 기대됩니다.", "concepts": [{"term": "Orbital order", "why_emerged": "전자들 사이의 쿨롱 상호작용으로 인해 전자 궤도가 특정 방향으로 정렬되는 질서를 설명하기 위해 등장했습니다.", "origin": "전이금속 산화물의 금속-절연체 전이 연구 과정에서 제안되었습니다.", "connections": "Nematicity, Jahn-Teller effect, Crystal field split"}, {"term": "5d-orbital", "why_emerged": "무거운 전이금속(Ta, W, Ir 등)에서 스핀-궤도 결합과 전자 상관관계의 상호작용을 연구하기 위해 중요합니다.", "origin": "초록 정보만으로는 특정하기 어려움 (원자 물리 개념).", "connections": "Spin-orbit coupling (SOC), Heavy element physics, Mott insulators"}, {"term": "Real-space fingerprints", "why_emerged": "주사 터널링 현미경(STM) 등을 통해 원자 단위에서 나타나는 전자 질서의 기하학적 형태를 확인하기 위해 사용됩니다.", "origin": "STM 연구 분야에서 널리 쓰이는 비유적 표현입니다.", "connections": "Scanning Tunneling Microscopy (STM), Quasiparticle interference (QPI)"}, {"term": "Electronic band structure", "why_emerged": "고체 내 전자의 에너지와 운동량 관계를 파악하여 물질의 물리적 성질을 이해하기 위해 필수적입니다.", "origin": "블로흐의 정리(Bloch's theorem)와 함께 현대 고체물리의 기초로 정립되었습니다.", "connections": "ARPES, Density Functional Theory (DFT), Brillouin zone"}], "english_summary": ["Identified a surface 5d-orbital order in an intermetallic compound through its electronic signatures.", "Used ARPES and STM to visualize how orbital selection breaks rotational symmetry in the band structure.", "Isolated the orbital transition from lattice and magnetic effects, providing a clean case study for orbital physics.", "Demonstrated the utility of combining momentum-space and real-space probes to study symmetry-breaking phases."]}}, {"title": "Band splitting in the altermagnet CrSb", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/mytl-kml2", "authors": "Vladimir P. Mineev", "last_authors": "Vladimir P. Mineev", "summary": "Altermagnets are a class of metallic magnets characterized by spin-split electron bands. As antiferromagnets they lack spontaneous bulk magnetization. The initial description of the momentum-dependent spin splitting of electron bands in altermagnets was based on the spin-group approach, which is val…", "tier": "B_IMPORTANT_CONDMAT", "score": "9", "reason": "Highly relevant electronic structure study of an altermagnet, a core interest.", "tags": ["altermagnet", "CrSb", "electronicstructure"], "image": "", "briefing": {"background": "알터마그넷(Altermagnet)은 순자화값이 없는 반강자성체이면서도, 스핀-궤도 결합 없이 대칭성 깨짐에 의해 전자 밴드 구조에서 스핀 분할(Spin-splitting)이 발생하는 새로운 자기적 상태입니다.", "motivation": "기존의 스핀 그룹 이론을 바탕으로 제안된 알터마그넷의 운동량 의존적 스핀 분할 모델을 실제 CrSb 물질의 구체적인 밴드 구조와 연결하여 이론적 정합성을 재검토하고자 합니다.", "result": "CrSb에서의 스핀 분할 밴드 구조를 구체화하였으며, 반강자성 상태에서 스핀 분할이 일어나는 물리적 메커니즘을 상세히 설명했습니다.", "implication": "알터마그넷의 핵심 물성인 비상반적 수송 현상 및 스핀 분극 현상을 이해하는 데 중요한 이론적 토대를 제공합니다.", "novelty": "최근 주목받는 알터마그넷 분야에서 대표 물질인 CrSb의 밴드 구조를 심도 있게 분석하여, 자기적 위상 물질 연구의 지평을 넓혔습니다.", "unresolved": "실험적인 ARPES 측정과 이론적 예측의 정량적 일치 여부와 실제 물질 내 결함이 밴드 분할에 미치는 영향은 추가 규명이 필요합니다.", "future_work": "다른 알터마그넷 물질에 대한 스핀 분해 ARPES 검증 및 이를 활용한 스핀트로닉스 소자 응용 가능성 연구.", "concepts": [{"term": "Altermagnet", "why_emerged": "기존 강자성과 반강자성의 이분법을 넘어, 스핀 분할을 보이면서 순자화가 없는 물질군을 분류하기 위해 필요.", "origin": "최근 2~3년 내 이론적으로 급부상, 특정 학자보다는 다수의 이론 그룹이 동시다발적으로 정립.", "connections": "반강자성체, 스핀 밸리트로닉스, 자기 스핀 홀 효과."}], "english_summary": ["Analyzes spin-split electronic bands in the altermagnetic CrSb.", "Re-evaluates the momentum-dependent splitting beyond the conventional spin-group approach.", "Provides a theoretical framework for understanding the magnetic properties of CrSb."]}}, {"title": "Heavy-Fermion Phase Diagram in Magic-Angle Twisted Trilayer Graphene", "journal": "PRL_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/zzks-vkl2", "authors": "Le Zhang, Wenqiang Zhou, Xinjie Fang, et al.", "last_authors": "Yi-feng Yang, Shuigang Xu", "summary": "The interplay between localized magnetic moments and itinerant electrons gives rise to exotic quantum states in condensed matter systems. Here, we demonstrate an electrically tunable heavy fermion phase diagram in magic-angle twisted trilayer graphene, achieved by controlling the Kondo hybridization…", "tier": "B_IMPORTANT_CONDMAT", "score": "9", "reason": "Discovery of a tunable heavy-fermion phase in trilayer graphene, relevant to moiré and Kondo physics.", "tags": ["graphene", "heavy-fermion", "moire"], "image": "", "briefing": {"background": "모아레 격자 시스템은 물리적 자유도를 전기적으로 정밀하게 제어할 수 있어, 강상관 전자계 연구의 핵심 플랫폼으로 자리 잡았습니다.", "motivation": "마법 각도로 뒤틀린 3층 그래핀(MATTG)에서 국소적 자기 모멘트와 비편재화된 전자 간의 상호작용을 통해 중-페르미온(Heavy-fermion) 거동이 나타나는지 규명하고자 합니다.", "result": "게이트 전압을 이용해 콘도 혼성(Kondo hybridization)을 조절함으로써 중-페르미온 상도를 전기적으로 제어하는 데 성공했습니다.", "implication": "모아레 시스템이 중-페르미온 물리뿐만 아니라, 다양한 강상관 상태를 모의하는 양자 시뮬레이터로 활용될 수 있음을 입증합니다.", "novelty": "전기적 제어를 통해 중-페르미온의 상도를 구현했다는 점에서 기존 희토류 기반 중-페르미온 물질 연구의 새로운 실험적 접근법을 제시합니다.", "unresolved": "중-페르미온 상에서 나타나는 초전도성과의 연관성 및 양자 임계점 부근의 상세 물성은 미해결 과제입니다.", "future_work": "온도 변화에 따른 수송 특성 분석 및 스캐닝 터널링 현미경(STM)을 이용한 국소 상태 밀도 관찰.", "concepts": [{"term": "Heavy-fermion", "why_emerged": "국소적 f-전자와 전도 전자 사이의 강한 상호작용으로 인해 전자의 유효 질량이 급격히 증가하는 현상을 설명하기 위해 도입.", "origin": "1970년대 CeAl3 등 희토류 금속 화합물에서 최초 발견.", "connections": "Kondo lattice, 양자 임계 현상, 비전통적 초전도체."}, {"term": "Kondo hybridization", "why_emerged": "국소 자기 모멘트가 전도 전자들에 의해 차폐(screening)되는 물리적 과정을 기술하기 위해 필요.", "origin": "Jun Kondo (1964).", "connections": "Kondo effect, RKKY interaction."}], "english_summary": ["Demonstrates a tunable heavy-fermion phase diagram in magic-angle twisted trilayer graphene.", "Controlled via gate-tuning of Kondo hybridization.", "Provides evidence for moiré systems as tunable platforms for correlated electron physics."]}}, {"title": "Fermi surface topology of the topological nodal-loop semimetal HfP2", "journal": "npj_QuantumMaterials", "source": "Gemini", "link": "https://www.nature.com/articles/s41535-026-00926-z", "authors": "Yong Zhang, Yonglong Xue, Sutao Sun, et al.", "last_authors": "Yan Bin Chen, Yan-Feng Chen", "summary": "Fermi surface topology of the topological nodal-loop semimetal HfP 2", "tier": "B_IMPORTANT_CONDMAT", "score": "9", "reason": "Direct electronic structure study of a topological semimetal, highly relevant to ARPES methodology.", "tags": ["ARPES", "topologicalsemimetal", "Fermisurface"], "image": "https://pubads.g.doubleclick.net/gampad/ad?iu=/285/npjquantmats.nature.com/article&sz=728x90&c=-375452469&t=pos%3Dtop%26type%3Darticle%26artid%3Ds41535-026-00926-z%26doi%3D10.1038/s41535-026-00926-z%26subjmeta%3D301,639,766%26kwrd%3DMaterials+science,Physics", "briefing": {"background": "위상 절연체 및 위상 반금속 연구는 물질의 고유한 밴드 토폴로지를 통해 비자명한 표면 상태나 전자기적 수송 특성을 이해하는 데 목적이 있습니다.", "motivation": "HfP2 물질의 위상 결절-고리(Nodal-loop) 반금속 특성을 전자 구조 관점에서 확인하고 페르미 표면의 토폴로지를 밝히고자 합니다.", "result": "ARPES를 통해 HfP2의 전자 구조를 직접 측정하여 위상 결절-고리의 존재와 페르미 표면 구조를 규명하였습니다.", "implication": "HfP2가 위상물질의 후보군으로서, 향후 토폴로지 기반의 전자 소자 연구에 활용될 수 있음을 시사합니다.", "novelty": "최신 ARPES 기술을 사용하여 HfP2의 결절-고리 구조를 실험적으로 입증하여 위상 반금속 물질의 데이터베이스를 확장했습니다.", "unresolved": "이 물질에서 나타날 수 있는 비자명한 수송 특성(예: 아노말리 홀 효과 등)의 상세한 기원은 추가적인 분석이 필요합니다.", "future_work": "자기장 하에서의 저항 측정 및 자기-ARPES를 통한 밴드 변화 관찰.", "concepts": [{"term": "Topological nodal-loop semimetal", "why_emerged": "전도대와 가전자대가 브릴루앙 존 내에서 고리(loop) 형태로 교차하는 위상 물질을 분류하기 위해 등장.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "Dirac semimetal, Weyl semimetal, Berry curvature."}], "english_summary": ["Investigates the Fermi surface topology of the topological nodal-loop semimetal HfP2.", "Utilizes ARPES to directly map the electronic structure.", "Confirms the existence of nodal-loop features in the band structure."]}}, {"title": "Mirror-selective quasiparticle interference in bilayer nickelate superconductor", "journal": "npj_QuantumMaterials", "source": "Gemini", "link": "https://www.nature.com/articles/s41535-026-00913-4", "authors": "Zhongyi Zhang, Jun Zhan, Congcong Le, Hoi Chun Po, Jiangping Hu, Xianxin Wu", "last_authors": "Jiangping Hu, Xianxin Wu", "summary": "Mirror-selective quasiparticle interference in bilayer nickelate superconductor", "tier": "B_IMPORTANT_CONDMAT", "score": "9", "reason": "Electronic structure spectroscopy (QPI) on high-interest nickelate superconductors.", "tags": ["nickelate", "STM/STS", "superconductivity"], "image": "https://pubads.g.doubleclick.net/gampad/ad?iu=/285/npjquantmats.nature.com/article&sz=728x90&c=-1000275697&t=pos%3Dtop%26type%3Darticle%26artid%3Ds41535-026-00913-4%26doi%3D10.1038/s41535-026-00913-4%26subjmeta%3D301,639,766%26kwrd%3DMaterials+science,Physics", "briefing": {"background": "니켈산염 초전도체는 구리산염의 전자 구조와 유사한 점이 많아 고온 초전도 메커니즘을 규명하는 핵심 후보군입니다. 특히 이층(bilayer) 구조의 니켈산염은 복잡한 다중 밴드 구조를 가지고 있어, 그 안에서의 준입자 동역학을 이해하는 것이 중요합니다.", "motivation": "이층 니켈산염에서 발견되는 초전도 특성을 결정짓는 전자 상태의 대칭성을 규명하고, STS(주사 터널링 분광법)를 통해 관측되는 준입자 간섭(QPI) 패턴에서 특정 대칭성(Mirror)이 어떻게 선택적으로 나타나는지 확인하고자 했습니다.", "result": "이층 니켈산염의 전자 구조에서 미러 대칭성에 따른 준입자 간섭 패턴의 선택적 발현을 이론적으로 제안하였습니다.", "implication": "초전도 페어링을 매개하는 전자 상태의 대칭성을 직접적으로 식별할 수 있는 단서를 제공하며, 이는 향후 고온 초전도체의 스핀/궤도 결합 특성을 이해하는 데 기여합니다.", "novelty": "기존 단순 단층 니켈산염 연구를 넘어 이층 구조의 미러 선택적 특성을 다루었으며, ARPES/STS 연구자들에게 실험적 관측의 핵심 지표를 제시합니다.", "unresolved": "이론적 제안 단계이므로, 실제 샘플에서의 정밀한 실험적 검증과 다양한 도핑 수준에서의 보편성 확인이 필요합니다.", "future_work": "실제 초전도 상태의 니켈산염 샘플에 대한 저온 STM/STS 실험을 통해 해당 QPI 패턴의 실증이 요구됩니다.", "concepts": [{"term": "QPI (준입자 간섭)", "why_emerged": "표면 불순물에 의한 산란 패턴을 분석해 에너지-운동량 분산 관계를 직접 추출하기 위해 필요합니다.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "ARPES를 보완하는 국소 전자 구조 측정 기법으로 STS와 함께 사용됨."}, {"term": "이층 니켈산염 (Bilayer Nickelate)", "why_emerged": "구조적 자유도를 높여 초전도 전이 온도를 높이거나 새로운 위상 상태를 탐색하기 위해 설계됨.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "La3Ni2O7 고압 초전도체 연구와 연관됨."}], "english_summary": ["Investigates mirror-selective quasiparticle interference in bilayer nickelate superconductors.", "Uses theoretical modeling to predict specific STS patterns based on lattice symmetry.", "Provides a framework for identifying pairing symmetry in multiband electronic systems.", "Connects localized scattering behavior to global superconducting properties."]}}, {"title": "From electronic clovers to emergent quantum matter", "journal": "Nature_Physics", "source": "Gemini", "link": "https://www.nature.com/articles/s41567-026-03374-5", "authors": "Eduardo H. da Silva Neto", "last_authors": "Eduardo H. da Silva Neto", "summary": "The first holes doped into a cuprate create atomic-scale electronic states that combine into larger motifs, offering a bottom-up view of the emergence of charge order and superconducting phenomena.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Important study on charge order and unconventional superconductivity in doped cuprates.", "tags": ["STM", "cuprates", "superconductivity"], "image": "https://media.springernature.com/m685/springer-static/image/art%3A10.1038%2Fs41567-026-03374-5/MediaObjects/41567_2026_3374_Fig1_HTML.png", "briefing": {"background": "구리산염 초전도체에서 전하 질서(Charge Order)는 초전도 현상과 밀접하게 경쟁 ", "score": "8", "reason": "Connects altermagnetism, Weyl semimetals, and Hall effects, which are high-priority topics for the user.", "tags": ["theory", "altermagnetism", "Weyl-semimetal"], "image": "", "briefing": {"background": "알터자성(Altermagnetism)은 강자성이나 반강자성과는 다른 새로운 자기 질서로, 비자성 원자들 사이의 대칭성을 이용해 스핀 분극을 유도합니다.", "motivation": "2차원 알터자성 물질에서 위상적 비자명성과 자성을 결합하여 Weyl 반금속 상태와 골짜기 홀 효과를 어떻게 구현할 수 있는지 이론적으로 조사하고자 합니다.", "result": "양극성(Bipolarized) Weyl 반금속 특성을 가진 2차원 알터자성체를 제안하고, 이들이 골짜기 홀 효과를 강하게 유도함을 밝혔습니다.", "implication": "알터자성 물질이 차세대 위상 양자 소자 및 저전력 스핀트로닉스 구현을 위한 유망한 플랫폼임을 입증합니다.", "novelty": "기존의 Weyl 반금속보다 제어가 용이한 알터자성 환경을 제안하여, 위상 물성과 자성을 통합한 새로운 기능성 물질 후보를 제시합니다.", "unresolved": "구체적인 물질 합성 가능성과 그에 따른 위상 상태의 안정성이 실제 샘플에서 실험적으로 증명되어야 합니다.", "future_work": "제안된 모델을 기반으로 한 DFT+DMFT 계산과 실제 화합물 후보군 합성 및 ARPES를 통한 밴드 구조 검증.", "concepts": [{"term": "알터자성 (Altermagnetism)", "why_emerged": "전통적인 자성 분류(강자성/반강자성)로 설명되지 않는 대칭성 기반의 스핀 분극 현상을 설명하기 위해 도입됨.", "origin": "최근 5년 이내 이론적 정립", "connections": "반강자성 스핀트로닉스, 베리 곡률과 연관된 위상 물성."}, {"term": "Weyl 반금속 (Weyl Semimetal)", "why_emerged": "밴드 구조의 교차점(Weyl node)에서 발생하는 위상학적 비자명성과 높은 이동도를 활용하기 위해 도입됨.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "아노말리 홀 효과, 카이랄 자성 현상."}], "english_summary": ["Explores bipolarized Weyl semimetals in 2D altermagnetic materials.", "Theoretical framework links magnetism, topology, and valley Hall effect.", "Proposes new functional topological states for quantum electronic devices.", "Suggests altermagnetism as a novel platform for controlling Berry curvature-related transport."]}}, {"title": "Effect of modest hydrostatic pressure on low-temperature transport behavior in La3Ni2O7 thin films", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/zjnc-vv8p", "authors": "Deepak Kumar, Jared Z. Dans, Keenan E. Avers, Ryan Paxson, Ichiro Takeuchi, Johnpierre Paglione", "last_authors": "Ichiro Takeuchi, Johnpierre Paglione", "summary": "How do La 3 Ni 2 O 7 thin films behaves under modest hydrostatic pressure? The authors here investigate epitaxial thin films under substrate selection, oxygen treatment, and hydrostatic pressure, and reveal tunable transport behavior, where modest pressure drives a transition from Fermi liquid-like metallicity toward non-Fermi liquid response. These findings highlight strain- and pressure-enabled control of bilayer nickelate thin films, offering a concise pathway to explore exotic low-temperature electronic states.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Transport study on bilayer nickelate thin films exploring non-Fermi liquid behavior under pressure.", "tags": ["material", "nickelate", "transport"], "image": "", "briefing": {"background": "La3Ni2O7은 고온 초전도 가능성으로 주목받는 이중층 니켈산염입니다. 고압 환경에서의 초전도 현상이 발견된 이후, 박막 형태에서의 전자 상태 제어와 상전이 연구가 핵심적인 문제로 떠올랐습니다.", "motivation": "이 논문은 박막의 기판 선택, 산소 열처리, 그리고 정수압(hydrostatic pressure)을 통해 La3Ni2O7의 전기 수송 특성이 어떻게 변화하는지 규명하고자 합니다.", "result": "비교적 낮은 압력에서도 Fermi 액체 금속 상태에서 비Fermi 액체(non-Fermi liquid) 거동으로의 전이가 유도됨을 확인하였습니다.", "implication": "단결정 벌크와는 다른 박막 고유의 변형(strain) 제어를 통해, 고온 초전도체로 향하는 전자 상태의 조절 가능성을 보여줍니다.", "novelty": "벌크 니켈산염 연구가 대다수인 상황에서, 박막 공정과 압력을 결합하여 전자 상관관계를 미세 조정(tuning)할 수 있는 플랫폼을 제시했습니다.", "unresolved": "비Fermi 액체 거동의 구체적인 미시적 메커니즘과 이것이 초전도와 직접적인 관련이 있는지는 불분명합니다.", "future_work": "더 넓은 압력 범위에서의 수송 특성 측정과 ARPES 등을 통한 전자 구조 변화 직접 관측이 필요합니다.", "concepts": [{"term": "비Fermi 액체", "why_emerged": "Landau의 Fermi 액체 이론으로 설명되지 않는 강상관 전자계의 특이한 물성을 기술하기 위해 도입됨.", "origin": "Philip Anderson 등이 강상관 전자계 연구 과정에서 정립함.", "connections": "고온 초전도체, 퀀텀 임계점(Quantum Critical Point) 현상과 밀접함."}, {"term": "이중층 니켈산염", "why_emerged": "구리 산화물 초전도체의 전자 구조를 모방할 수 있는 후보 물질로서 고온 초전도 현상을 구현하기 위해 탐색됨.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "La2NiO4 등 단층 니켈산염, cuprate 초전도체."}], "english_summary": ["La3Ni2O7 thin films were studied under hydrostatic pressure.", "Transition from Fermi liquid to non-Fermi liquid behavior was observed.", "Pressure and strain offer tunable control over electronic correlations in bilayer nickelates.", "Provides a path to explore exotic states beyond conventional metallicity."]}}, {"title": "H-linear magnetoresistance in the T2 resistivity regime of overdoped infinite-layer nickelate La1xSrxNiO2", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/stvg-vbqs", "authors": "Yong-Cheng Pan, Tommy Kotte, Toni Helm, Motoki Osada, Atsushi Tsukazaki, Yu-Te Hsu", "last_authors": "Atsushi Tsukazaki, Yu-Te Hsu", "summary": "We report a systematic magnetotransport study on high-crystallinity ${\\mathrm{La}}_{1−x}{\\mathrm{Sr}}_{x}{\\mathrm{NiO}}_{2}$ (LSNO) thin films with $x=0.20−0.24$. By conducting pulsed-field transport experiment up to 62 T, we reveal two salient features of the normal-state transport in overdoped LSN…", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Experimental transport study on nickelates, a key material class of interest.", "tags": ["experiment", "nickelate", "magnetoresistance"], "image": "", "briefing": {"background": "무한층(infinite-layer) 니켈산염은 cuprate와 유사한 구조와 전자 상태를 가져 고온 초전도 구현을 위한 핵심 물질로 여겨집니다. 과도핑 영역에서의 금속성(normal state) 이해는 초전도 메커니즘 규명의 열쇠입니다.", "motivation": "과도핑된 LSNO 박막에서 나타나는 자기저항의 비정상적 거동(H-linear magnetoresistance)을 높은 자기장 환경에서 규명하고자 합니다.", "result": "62T에 달하는 강자기장 환경에서 자기저항이 자기장에 선형적으로 비례하는(H-linear) 특성을 확인하였습니다.", "implication": "이는 이 물질이 일반적인 금속과는 다른, 강한 상관관계를 가진 독특한 전자 상태에 있음을 시사합니다.", "novelty": "니켈산염 연구에서 흔치 않은 초강자기장 환경에서의 실험으로, 정상 상태(normal state)의 비고전적 거동을 명확히 관측했습니다.", "unresolved": "이 H-linear 자기저항이 스핀-전하 분리나 양자 임계 현상 중 무엇에 기인하는지 명확하지 않습니다.", "future_work": "이러한 수송 특성을 설명할 수 있는 정밀한 전자 구조 계산 및 이론 모델 정립이 요구됩니다.", "concepts": [{"term": "자기저항(Magnetoresistance)", "why_emerged": "물질 내 전자의 산란 기구와 Fermi 표면의 기하학적 구조를 파악하기 위한 기초 수송 측정 도구.", "origin": "Lord Kelvin이 1856년 최초 발견.", "connections": "홀 효과, 사이클로트론 운동, 양자 진동."}, {"term": "무한층 니켈산염", "why_emerged": "CuO2 평면과 유사한 NiO2 평면을 가진 구조를 구현하여 고온 초전도를 모색하기 위함.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "cuprate 초전도체, 2D van der Waals 소재."}], "english_summary": ["Systematic magnetotransport study on LSNO thin films up to 62 T.", "Observation of H-linear magnetoresistance in the overdoped regime.", "Provides evidence for unconventional normal-state transport in infinite-layer nickelates.", "Highlights the departure from standard Fermi liquid theory."]}}, {"title": "Highly fluctuating double-q magnetic order in the van der Waals metal CeTe3", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/m9lb-4vhx", "authors": "Ryutaro Okuma, Yuita Fujisawa, Natsumi Maekawa, et al.", "last_authors": "Yoshinori Okada, Daichi Ueta", "summary": "${\\mathrm{CeTe}}_{3}$ is a van der Waals antiferromagnet composed of magnetic ${[\\mathrm{CeTe}]}^{+}$ layers coupled to highly conducting ${\\mathrm{Te}}^{0.5−}$ square nets. Its simple quasi-two-dimensional electronic structure and cleavable nature make it an appealing platform for exploring correla…", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Explores magnetic order and fluctuations in CeTe3, a cleavable vdW material highly relevant to spectroscopy.", "tags": ["material", "van-der-waals", "magnetism"], "image": "", "briefing": {"background": "RTe3 (Rare-earth tritellurides) 계열은 전하 밀도 파동(CDW)과 자기적 질서가 공존하는 대표적인 vdW 물질입니다. 특히 CeTe3는 자성 이온인 Ce를 포함하여 흥미로운 자기적 특성을 보여줍니다.", "motivation": "CeTe3 내에서 관측되는 복잡한 자기적 질서(double-q)의 특성과 이들의 요동(fluctuation) 기원을 밝히고자 합니다.", "result": "해당 물질에서 자기 질서가 매우 강하게 요동치는 double-q 상태임을 시사하는 결과를 얻었습니다.", "implication": "CDW와 자기적 질서 간의 상호작용이 물질의 전자 상태를 결정하는 핵심적인 역할을 한다는 점을 강화합니다.", "novelty": "vdW 소재의 cleavable한 특성을 활용하여 자기적 요동을 명확히 규명했으며, 이는 강상관 전자계와 topological 물리 연구에 중요한 데이터가 됩니다.", "unresolved": "Double-q 자기 질서가 CDW와 어떻게 위상학적으로 혹은 구조적으로 연결되어 있는지 상세 메커니즘은 남아있습니다.", "future_work": "중성자 산란을 통한 자기 구조의 직접 관측 및 spectroscopy를 통한 전자 구조 요동과의 결합 연구가 기대됩니다.", "concepts": [{"term": "Double-q 자기 질서", "why_emerged": "단일 파동 벡터(q)로 설명할 수 없는 다중 주기성을 가진 복잡한 자성 구조를 기술하기 위해 필요.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "CDW, 스핀 파동, 기하학적 좌절(geometrical frustration)."}, {"term": "반데르발스(vdW) 물질", "why_emerged": "층상 구조를 가진 박리 가능한 소재를 통해 차세대 양자 소자 및 저차원 물리 연구를 수행하기 위해 주목됨.", "origin": "Johannes Diderik van der Waals의 분자 간 상호작용 이론에 기반.", "connections": "그래핀, 흑린, 2D 전이금속 칼코겐화물."}], "english_summary": ["Study of magnetic ordering in the van der Waals metal CeTe3.", "Identified highly fluctuating double-q magnetic order.", "Highlights interplay between Ce-layers and Te-square nets.", "Suggests CeTe3 is a key platform for studying correlated quantum matter."]}}, {"title": "Identifying the origin of out-of-plane spin polarization in the noncollinear antiferromagnet Mn3Ge", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/kpj1-yrwh", "authors": "Mingxing Wu, Kouta Kondou, Taishi Chen, Satoru Nakatsuji, YoshiChika Otani", "last_authors": "Satoru Nakatsuji, YoshiChika Otani", "summary": "Noncollinear antiferromagnets Mn 3 X ( X =Sn, Ge) possess out-of-plane spin polarization that enables field-free magnetization switching. However, its microscopic origin remains under debate, specifically whether it arises from the antiferromagnetic order dependent magnetic spin Hall effect or antiferromagnetic order independent spin swapping. To address this issue here, the authors comparatively evaluate the spin torques in single-crystal Mn 3 Ge/Py bilayers with different crystallographic orientations using spin-torque ferromagnetic resonance technique. Their results reveal that both mechanisms coexist with comparable magnitudes, responsible for the out-of-plane spin polarization.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Direct study of Mn3Ge, a kagome-lattice antiferromagnet with anomalous Hall effect.", "tags": ["Mn3Ge", "kagome", "antiferromagnetism"], "image": "", "briefing": {"background": "Mn3Ge는 카고메 격자 구조를 가진 비공선형 반강자성체로, 거대한 비정상 홀 효과(AHE)와 스핀 홀 효과(SHE)를 보여 차세대 스핀트로닉스 소자 후보로 주목받고 있습니다.", "motivation": "Mn3Ge에서 관찰되는 면외(out-of-plane) 스핀 분극 현상이 반강자성 차수와 직접적으로 연관된 '자기 스핀 홀 효과' 때문인지, 아니면 차수와 무관한 '스핀 스와핑(spin swapping)' 때문인지에 대한 논쟁을 해결하고자 했습니다.", "result": "ST-FMR(스핀 토크 강자성 공명) 측정을 통해 두 메커니즘이 모두 유사한 크기로 공존하고 있음을 확인했습니다.", "implication": "Mn3Ge 기반 소자 설계 시 반강자성 차수 제어뿐만 아니라 스핀 스와핑 기여도까지 함께 고려해야 함을 시사합니다.", "novelty": "카고메 반강자성체에서 스핀 토크의 미시적 기원을 실험적으로 분리하여 제시함으로써, 스핀트로닉스 응용 가능성을 보다 정밀하게 이해하게 했습니다.", "unresolved": "두 메커니즘의 상대적 비율이 Mn3Ge의 도메인 구조나 결함 농도에 어떻게 민감하게 변하는지는 여전히 숙제입니다.", "future_work": "다양한 두께와 방향의 박막을 활용한 소자 효율 최적화 및 도메인 벽에서의 스핀 토크 거동 연구가 필요합니다.", "concepts": [{"term": "Magnetic Spin Hall Effect", "why_emerged": "반강자성체 내부의 스핀-궤도 결합과 비공선형 자기 구조에 의한 스핀 전류 생성 원리를 규명하기 위해 등장.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "비정상 홀 효과, 스핀-오빗 토크(SOT) 기술."}, {"term": "Spin Swapping", "why_emerged": "스핀 전류가 계면에서 산란될 때 스핀 편극 방향이 변하는 현상을 설명하기 위해 도입됨.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "스핀 홀 효과, 계면 스핀 수송 이론."}], "english_summary": ["Investigated the microscopic origin of out-of-plane spin polarization in Mn3Ge/Py bilayers.", "Used ST-FMR to differentiate between magnetic spin Hall effect and spin swapping mechanisms.", "Found that both mechanisms contribute comparably to the spin torque.", "Provides key insights for field-free magnetization switching in kagome antiferromagnets."]}}, {"title": "Light-induced parity anomaly and topological phase transitions in the antiferromagnetic topological insulator MnBi2Te4", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/y5s3-ndym", "authors": "Jiayan Zhang, Yu Wang, Yanxia Xing", "last_authors": "Yu Wang, Yanxia Xing", "summary": "The utilization of periodic driving to control nonequilibrium topological phases has garnered increasing attention in condensed matter physics. In this work, within the high-frequency limit of Floquet theory, we investigate the effects of circularly polarized light (CPL) on the topological propertie…", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Floquet engineering on a primary material of interest, MnBi2Te4.", "tags": ["MnBi2Te4", "topologicalinsulator", "Floquet"], "image": "", "briefing": {"background": "MnBi2Te4는 본질적인 자기 위상 절연체로서, 위상 상태와 자기 질서가 결합된 흥미로운 물성을 보이며 Floquet 공학의 주요 타겟입니다.", "motivation": "고주파 원편광 빛(CPL)을 이용해 MnBi2Te4의 전자 구조를 주기적으로 구동함으로써 위상학적 성질을 능동적으로 제어할 수 있는지 탐구하고자 했습니다.", "result": "이론적 고찰을 통해 빛에 의한 패리티 이상(parity anomaly) 유도와 이로 인한 위상 상전이 가능성을 제시했습니다.", "implication": "광학적으로 MnBi2Te4의 위상 상태를 전환할 수 있다면, 초고속 위상 스위칭 소자 개발의 단초가 될 수 있습니다.", "novelty": "이미 알려진 자기 위상 절연체에 Floquet 이론을 적용하여 외부 자극을 통한 위상 제어 시나리오를 구체화했습니다.", "unresolved": "실제 실험적 환경에서의 가열 효과(heating effect) 및 Floquet 상태의 안정성 확보가 관건입니다.", "future_work": "Pump-probe ARPES 실험을 통해 실제 전자 구조 변화를 관측하고, 위상 상전이의 가역성을 검증해야 합니다.", "concepts": [{"term": "Floquet Engineering", "why_emerged": "물질에 주기적인 외부장을 가해 에너지를 재구성하고 새로운 위상 상태를 창출하기 위해 도입.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "Floquet-Bloch 정리, 빛에 의한 위상 조절."}, {"term": "Parity Anomaly", "why_emerged": "2차원 Dirac 페르미온 시스템에서 패리티 대칭성이 깨질 때 나타나는 위상학적 불변량을 설명하기 위해 필요.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "위상 절연체, 아노말리(Anomaly) 물리학."}], "english_summary": ["Analyzed the effect of circularly polarized light on MnBi2Te4 using Floquet theory.", "Identified light-induced parity anomaly and subsequent topological phase transitions.", "Demonstrates potential for all-optical control of topological phases in magnetic materials.", "Highlights the utility of Floquet engineering in MnBi2Te4-based quantum devices."]}}, {"title": "Magnetic field induced magnon portfolio in the van der Waals magnet CrOCl", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/l132-qx8q", "authors": "T. Riccardi, F. Le Mardélé, L. A. Veyrat de Lachenal, et al.", "last_authors": "C. Faugeras, B. A. Piot", "summary": "Magnonic excitations are investigated in the CrOCl van der Waals (vdW) antiferromagnet with absorption experiments in a broad continuous energy range. In an external magnetic field, the dispersions of magnon branches characteristic of different magnetic orders are subsequently observed, revealing a strong biaxial anisotropy, hysteretic magnon spectra, as well as the formation of spatially separated magnetic phases. Theexperiments here show that competing exchange interactions broaden the options to generate different kinds of magnonic excitations within the same vdW material.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Experimental study of a vdW magnet, relevant to magnetic topological materials.", "tags": ["CrOCl", "vdWmagnet", "magnons"], "image": "", "briefing": {"background": "CrOCl은 층상 구조의 반데르발스 반강자성체로, 자성 구조와 밴드 구조의 상관관계를 연구하기 좋은 모델 시스템입니다.", "motivation": "외부 자기장에 따라 변하는 CrOCl의 마그논(magnon) 분산 관계를 상세히 분석하여 이 물질의 자기적 위상 변화를 규명하고자 했습니다.", "result": "강한 이축 이방성과 자기장 하에서의 히스테리시스 특성을 확인했으며, 다양한 자기 상태에 따른 마그논 스펙트럼의 변화를 포착했습니다.", "implication": "반데르발스 자성체에서 마그논 제어를 통한 정보 처리 기술의 기초 데이터를 제공합니다.", "novelty": "CrOCl이라는 물질에서 자기장 유도 마그논 포트폴리오를 체계적으로 정리하여, 층상 자성체의 스핀 파동 물성을 실험적으로 잘 규명했습니다.", "unresolved": "공존하는 자기 상들 사이의 미시적인 에너지 결합 메커니즘과 공간적 분리 이유에 대한 상세 해석이 필요합니다.", "future_work": "중성자 산란 실험을 통한 마그논 분산의 상세 구조 재확인 및 이방성 제어를 위한 도핑 연구가 기대됩니다.", "concepts": [{"term": "Magnon Portfolio", "why_emerged": "특정 물질에서 외부 변수 변화에 따라 나타나는 다양한 마그논 모드의 집합을 체계적으로 명명하기 위해 사용.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "스핀 파동, 반데르발스 자성체."}, {"term": "Biaxial Anisotropy", "why_emerged": "자기 이방성이 단순하지 않고 두 방향으로 다른 특성을 가질 때, 이를 정확히 기술하기 위해 필요.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "자기 이방성 상수, 마그논 분산."}], "english_summary": ["Studied magnonic excitations in CrOCl van der Waals antiferromagnet using absorption spectroscopy.", "Observed magnon dispersions under external magnetic fields revealing biaxial anisotropy.", "Reported hysteretic magnon spectra indicating spatially separated magnetic phases.", "Suggests competing exchange interactions allow for a wide range of tunable magnonic excitations."]}}, {"title": "Room-temperature two-dimensional ferromagnetism, large magnetic anisotropy, and anomalous Hall effect: From supported to freestanding monolayers GdM2 (M=Cu, Ag, Au)", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/csml-jn4q", "authors": "Jia-wan Li, Xunwu Hu, Dao-Xin Yao, Yusheng Hou", "last_authors": "Dao-Xin Yao, Yusheng Hou", "summary": "Here, the authors demonstrate that decoupling rare-earth Gd M 2 ( M =Cu, Ag, and Au) monolayers from metallic substrates transforms low-temperature supported surface alloys into room-temperature ferromagnets. Substrate removal enhances magnetic exchange interactions through charge redistribution, and eliminating structural buckling further modifies the competing exchange interactions. Freestanding GdAu 2 exhibits perpendicular magnetic anisotropy and a symmetry-tunable anomalous Hall effect, providing a platform for two-dimensional magnetic and topological spintronics.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Discovery of room-temperature 2D ferromagnetism and anomalous Hall in rare-earth monolayers.", "tags": ["theory", "magnetism", "anomalousHall"], "image": "", "briefing": {"background": "2차원 자성 재료는 차세대 스핀트로닉스 소자 구현을 위한 핵심 물질로 연구되고 있으나, 대부분 낮은 퀴리 온도(Curie temperature)가 걸림돌이었습니다.", "motivation": "희토류 기반 2차원 GdM2(M=Cu, Ag, Au) 단원자층이 기판과의 상호작용에 의해 그 자기적 특성이 어떻게 변하는지 규명하고자 함.", "result": "기판에서 분리된 자유 상태의 GdM2 단원자층에서 강한 자기 교환 상호작용이 유도되어 상온 강자성이 발현됨을 확인했습니다.", "implication": "GdAu2가 상온 강자성 및 수직 자기 이방성을 가짐으로써 2차원 자기/위상 스핀트로닉스 응용 가능성을 입증했습니다.", "novelty": "기판 효과 제거를 통한 자기적 전이 온도 향상 및 Gd 기반 단원자층에서의 상온 강자성 발현은 매우 흥미로운 발견입니다.", "unresolved": "실제 실험적으로 GdM2를 단원자층 형태로 기판에서 안전하게 분리하거나 자유 상태로 합성하는 기술적 난제가 남아있습니다.", "future_work": "실제 박리 공정 개발 및 ARPES를 통한 전자 구조 및 교환 상호작용의 직접적 관측이 필요합니다.", "concepts": [{"term": "Anomalous Hall Effect", "why_emerged": "강자성체에서 자기장 없이도 발생하는 비정상적인 홀 전압을 설명하기 위해 도입됨.", "origin": "Edwin Hall이 발견한 고전적 홀 효과의 연장선으로, Karplus와 L erconductivity, cuprates."}, {"term": "Nuclear Magnetic Resonance (NMR)", "why_emerged": "원자핵 위치에서의 국소적인 자기 환경(초미세 상호작용)을 정밀하게 탐색하기 위해.", "origin": "Rabi, Purcell, Bloch, 1930s-40s.", "connections": "Hyperfine coupling, magnetic order."}], "english_summary": ["NMR measurements provide microscopic evidence for a Zhang-Rice triplet ground state in NiPS3.", "Establishes a link between correlated electron physics and magnetism in vdW antiferromagnets.", "Advances understanding of the electronic ground state in transition metal phosphorous trisulfides."]}}, {"title": "NMR Evidence for Spontaneous Electronic Chiral Order in URhSn", "journal": "PRL_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/1vjx-4jfv", "authors": "Y. Tokunaga, T. Ishitobi, H. Sakai, S. Kambe, H. Harima, A. Nakamura, A. Maurya, D. Li, Y. Homma, F. Honda, D. Aoki, and Y. Shimizu", "last_authors": "Y. Homma, F. Honda, D. Aoki, and Y. Shimizu", "summary": "The first direct evidence of spontaneous electronic chiral order in URhSn, a strongly correlated material without an inherently chiral lattice structure, fundamentally challenges the prevailing notion that electronic chirality requires a chiral crystal framework.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Experimental NMR evidence for electronic chiral order, related to TRSB and loop currents.", "tags": ["electronic-order", "NMR", "correlated-electrons"], "image": "", "briefing": {"background": "강상관계 전자계에서 격자의 비대칭성 없이 발생하는 전자적 키랄성(electronic chirality)은 시간 역전 대칭성 깨짐(TRSB)과 루프 전류 모델 등과 연결되는 매우 흥미로운 주제입니다.", "motivation": "URhSn은 격자 구조 자체가 키랄하지 않음에도 불구하고 전자적 키랄성이 나타날 가능성이 제기되어, NMR 측정을 통해 자발적인 전자적 키랄 질서의 증거를 찾고자 했습니다.", "result": "NMR 데이터를 통해 URhSn에서 격자 구조와 독립적인 자발적 전자적 키랄 질서가 존재함을 직접적으로 입증했습니다.", "implication": "전자적 키랄성이 결정 구조에만 국한되지 않고, 강한 상관관계에 의해 유도될 수 있음을 시사하여 위상 물질 및 강상관계 연구에 새로운 시각을 제공합니다.", "novelty": "결정 구조적 키랄성이 없는 물질에서 전자적 상태의 키랄성을 실험적으로 확인한 첫 사례로, Kagome 금속 등에서 논의되는 TRSB나 루프 전류 연구와 밀접하게 연관됩니다.", "unresolved": "전자적 키랄 질서가 발생하는 정확한 미시적 메커니즘과 그로 인해 나타나는 물성의 전반적인 파급 효과는 추가 연구가 필요합니다.", "future_work": "해당 전자적 질서가 저에너지 준입자 구조(밴드 구조)에 미치는 영향에 대한 ARPES 관측 및 이론적 모델링이 기대됩니다.", "concepts": [{"term": "Electronic Chiral Order", "why_emerged": "결정의 대칭성 외에도 전자계 자체의 상호작용으로 인해 발생할 수 있는 대칭성 깨짐을 이해하기 위해 도입됨.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "TRSB, 루프 전류, 위상학적 비자명성"}, {"term": "URhSn", "why_emerged": "우라늄 기반 화합물은 강한 5f 전자 상관관계와 독특한 자기적/초전도적 물성 연구의 장을 제공함.", "origin": "오랫동안 연구되어 온 중페르미온 화합물 계열", "connections": "중페르미온, 자기 질서, TRSB"}], "english_summary": ["NMR measurements provide the first direct evidence of spontaneous electronic chiral order in URhSn.", "The discovery challenges the paradigm that electronic chirality requires a chiral crystal lattice.", "This finding suggests that correlated electrons can spontaneously break spatial symmetries regardless of the atomic arrangement."]}}, {"title": "Unconventional Altermagnetism in Quasicrystals: A Hyperspatial Projective Construction", "journal": "PRL_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/hx9n-v1yg", "authors": "Yiming Li, Mingxiang Pan, Jun Leng, Yuxiao Chen, Huaqing Huang", "last_authors": "Yuxiao Chen, Huaqing Huang", "summary": "Altermagnetism, a novel magnetic phase characterized by symmetry-protected, momentum-dependent spin splitting and collinear compensated magnetic moments, has thus far been explored primarily in periodic crystals. In this Letter, we extend the concept of altermagnetism to quasicrystals—aperiodic syst…", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Explores altermagnetism, a key interest, in a novel quasicrystalline context; highly relevant theory.", "tags": ["theory", "altermagnetism", "quasicrystals"], "image": "", "briefing": {"background": "Altermagnetism은 강자성도 반강자성도 아닌 제3의 자기 위상으로, 대칭성에 의해 보호되는 운동량 의존적 스핀 분열을 가집니다.", "motivation": "주기적인 결정 구조에서만 주로 다루어지던 Altermagnetism 개념을, 비주기적인 구조를 가진 준결정(Quasicrystal)으로 확장하여 그 가능성을 탐색하고자 했습니다.", "result": "준결정 구조에서도 특정 대칭성을 통해 Altermagnetism이 나타날 수 있음을 이론적(초공간 투영 방식)으로 정립했습니다.", "implication": "준결정 시스템이 위상 물성과 스핀트로닉스 응용을 위한 새로운 플랫폼이 될 수 있음을 보여줍니다.", "novelty": "Altermagnetism을 주기적 격자에서 준결정이라는 비주기적 환경으로 확장한 첫 이론적 시도이며, 이는 위상적 준결정 연구의 돌파구가 될 수 있습니다.", "unresolved": "준결정에서 실제로 Altermagnetic 위상을 구현할 수 있는 구체적인 후보 물질과 실험적 검증 방법은 미해결 과제입니다.", "future_work": "이론적으로 제안된 구조에서 실제 전자 구조 계산 및 ARPES를 통한 스핀 분열 관측 가능성 탐색이 이어질 것입니다.", "concepts": [{"term": "Altermagnetism", "why_emerged": "보상된 자기 모멘트를 가지면서도 밴드 구조에서 스핀 분열을 일으키는 물질을 분류하기 위해 필요함.", "origin": "최근 2-3년 내 이론적으로 급부상한 개념", "connections": "반강자성, 스핀트로닉스, 베리 곡률"}, {"term": "Quasicrystals", "why_emerged": "주기성을 가지지 않지만 회전 대칭성을 포함하는 독특한 정렬 상태를 이해하기 위해.", "origin": "Dan Shechtman (1982년 발견)", "connections": "준주기적 위상 물질, 강상관계 전자계"}], "english_summary": ["Extends the concept of altermagnetism from periodic crystals to aperiodic quasicrystals.", "Uses a hyperspatial projective construction to demonstrate symmetry-protected, momentum-dependent spin splitting in quasicrystalline structures.", "Provides a theoretical framework for future exploration of unconventional magnetism in non-periodic quantum materials."]}}, {"title": "Step geometry–guided growth of rhombohedral graphene", "journal": "Science", "source": "Gemini", "link": "https://doi.org/10.1126/science.aed9202", "authors": "Mengze Zhao, Zhibin Zhang, Xin Sui, et al.", "last_authors": "Xiaobo Lu, Kaihui Liu", "summary": "Rhombohedral (ABC)–stacked graphene has emerged as a platform for exploring correlated and topological physics. However, its large-scale, pure-phase synthesis has been hindered by intrinsic thermodynamic metastability and kinetic instability. In this work, we introduce a step geometry–guided epitaxial strategy to deterministically control interlayer slip, enabling the synthesis of pure-phase rhombohedral graphene. Using this approach, we obtained pure (phase purity > 99%) rhombohedral graphene with an area reaching 160 micrometers by 80 micrometers and thickness ranging from ~15 layers to ~120 nanometers. The resulting samples establish the first comprehensive reference dataset of Raman fingerprints and intrinsic band structures from few-layer films to ~200-layer bulk. Electronic transport measurements reveal a layer-antiferromagnetic state and the quantum anomalous Hall effect, enabling scalable exploration of next-generation quantum science and technology applications.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Synthesis and transport of rhombohedral graphene showing quantum anomalous Hall effect and correlated states.", "tags": ["material", "graphene", "QAHE", "topology"], "image": "", "briefing": {"background": "ABC-stacking을 가진 롬보헤드랄(rhombohedral) 그래핀은 전자 상관관계가 증폭되기 쉬운 평탄한 밴드 구조를 가져 위상 물성 연구에 매우 중요합니다.", "motivation": "열역학적 불안정성 때문에 대면적 합성이 어려웠던 롬보헤드랄 그래핀을 결정론적으로 제어하여 합성하고 관련 물성을 측정하고자 했습니다.", "result": "Step-geometry를 이용한 에피택셜 성장법으로 99% 이상의 순도를 가진 대면적 롬보헤드랄 그래핀을 합성했습니다.", "implication": "층상 반강자성 상태와 양자 변칙 홀 효과(QAHE)를 관찰하여, 확장 가능한 양자 기술의 플랫폼을 확보했습니다.", "novelty": "기존의 불안정한 성장 문제를 단계별 기하학적 제어로 해결하여 대면적 소자 제작이 가능해졌으며, 강상관/위상 그래핀 연구의 진입 장벽을 크게 낮췄습니다.", "unresolved": "초고압 또는 특정 층수에서의 미세한 상전이 현상과 그에 따른 준입자 거동은 추가적인 정밀 측정 연구가 필요합니다.", "future_work": "합성된 시료를 이용한 정밀한 ARPES 측정 및 도핑을 통한 correlated state 튜닝 연구가 예상됩니다.", "concepts": [{"term": "Rhombohedral Graphene", "why_emerged": "ABC 적층 구조가 가지는 평탄한 밴드 특성이 강한 전자 상관관계를 유도하기 때문.", "origin": "위상 절연체 및 2D 물질 연구가 발전하며 주목받음.", "connections": "비틀린 이중층 그래핀(TBG), 양자 변칙 홀 효과, 위상학적 물리"}, {"term": "Quantum Anomalous Hall Effect (QAHE)", "why_emerged": "외부 자기장 없이도 자발적인 자기 질서에 의해 양자화된 홀 전도도를 나타내는 위상 현상을 구현하기 위해.", "origin": "Haldane 모델(1988) 제안, Xue Qikun 그룹(2013) 실험적 발견.", "connections": "토폴로지, 위상 절연체, 스핀트로닉스"}], "english_summary": ["Demonstrates a step geometry–guided growth strategy for large-scale, high-purity rhombohedral (ABC-stacked) graphene.", "Enables exploration of correlated states and topological physics in samples up to 120 nm thick.", "Reports the observation of layer-antiferromagnetic states and the quantum anomalous Hall effect in the synthesized samples."]}}, {"title": "Surface-dominant transport in Weyl semimetal NbAs nanowires for next-generation interconnects", "journal": "Science", "source": "Gemini", "link": "https://doi.org/10.1126/science.adx3027", "authors": "Yeryun Cheon, Mehrdad T. Kiani, Yi-Hsin Tu, et al.", "last_authors": "Ching-Tzu Chen, Judy J. Cha", "summary": "Ongoing demands for smaller and more energy-efficient electronic devices necessitate alternative interconnect materials with lower electrical resistivity at reduced dimensions. We report the synthesis of Weyl semimetal niobium arsenide (NbAs) nanowires through thermomechanical nanomolding with single crystallinity and controlled diameters down to 40 nanometers. The resistivity of NbAs nanowires decreases with decreasing diameter, and 40-nanometer-diameter nanowires exhibited a room-temperature resistivity of 10.5 ± 1.9 microhm·centimeters, which is ~70% lower than their bulk counterpart. Calculations attribute this resistivity reduction to surface-dominant conduction with a long carrier lifetime at finite temperatures. Further characterization of nanowires and bulk crystals revealed high breakdown current density, stability, and thermal conductivity. These properties highlight the potential of NbAs nanowires as next-generation interconnects that could surpass the limitations of current copper-based interconnects.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Explores surface states of a Weyl semimetal, highly relevant to topological electronic structure.", "tags": ["transport", "NbAs", "Weylsemimetal"], "image": "", "briefing": {"background": "반도체 소자의 미세화가 한계에 다다르면서 기존 구리(Cu) 기반 배선 재료의 비저항 문제를 해결할 새로운 후보군으로 위상 물질이 주목받고 있습니다.", "motivation": "Weyl 반금속인 NbAs의 나노와이어 구조를 활용하여 차세대 소자 배선 재료로서의 성능 향상 가능성을 평가하고자 함.", "result": "40nm 직경의 NbAs 나노와이어에서 벌크 대비 70% 낮은 전기 비저항을 확인했으며, 이는 표면 지배적 전도(surface-dominant conduction)와 긴 운반자 수명에 기인함을 보임.", "implication": "NbAs 나노와이어가 낮은 저항, 높은 전류 밀도, 열적 안정성을 갖춘 차세대 배선 재료로 활용될 수 있음을 시사함.", "novelty": "Weyl 반금속의 토폴로지적 특성인 표면 상태(surface states)를 나노 구조 공학을 통해 실용적인 전자기기 배선 문제 해결에 직접 연결함.", "unresolved": "나노와이어 제작 과정에서의 대량 생산성 및 공정 적합성에 대한 추가 검증이 필요함.", "future_work": "실제 상용화 가능한 수준의 소자 집적도에서의 신뢰성 평가 및 표면 상태 제어를 통한 저항 추가 최적화.", "concepts": [{"term": "Weyl 반금속", "why_emerged": "밴드 구조의 교차점에서 Weyl 페르미온이라 불리는 질량이 없는 쿼시파티클이 존재하는 위상 물질 연구 필요성.", "origin": "Hermann Weyl(이론 제안), 2015년 TaAs에서 실험적 관측.", "connections": "Berry 곡률, 비정상 홀 효과, 위상학적 표면 상태."}, {"term": "표면 지배적 전도", "why_emerged": "벌크의 비저항을 낮추기 어려운 상황에서 위상학적 보호를 받는 표면 상태의 높은 이동도를 이용하기 위해.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "토폴로지컬 인슐레이터, 위상 반금속."}], "english_summary": ["NbAs nanowires synthesized via thermomechanical nanomolding show significantly reduced resistivity at small diameters.", "The performance improvement is attributed to surface-dominant conduction with extended carrier lifetimes.", "NbAs nanowires demonstrate high breakdown current density and thermal stability for interconnect applications.", "This study bridges topological Weyl physics with practical next-generation microelectronics engineering."]}}, {"title": "Van der Waals template–encoded soft epitaxy of tellurium enabled by atomic layer deposition", "journal": "Science_Advances", "source": "Gemini", "link": "https://doi.org/10.1126/sciadv.aef1430", "authors": "Changhwan Kim, Hyeon Cho, Chuqiao Shi, et al.", "last_authors": "Bonggeun Shong, Joonki Suh", "summary": "Van der Waals (vdW) epitaxy can integrate lattice-mismatched crystals with atomically sharp, pristine interfaces. However, translating this concept to atomic layer deposition (ALD), a standard for low-temperature, layer-by-layer growth, remains challenging because precursors adsorb transiently on chemically inert vdW basal planes, leading to physisorption-limited nucleation and poor crystalline ordering. Here, we introduce diffusion-steered epitaxial ALD (Epi-ALD), redefining vdW surfaces a ": "양자장론에서 유래, 위상 물질에서는 Nielsen-Ninomiya 정리 등에 의해 설명됨.", "connections": "Weyl 반금속, 음의 자기저항(negative magnetoresistance)."}], "english_summary": ["Diffusion-steered Epi-ALD is introduced for low-temperature, high-quality growth of Tellurium films on vdW surfaces.", "The method overcomes physisorption-limited nucleation through surface-potential engineering.", "Resulting Te films show pristine interfaces and clear evidence of chiral anomaly.", "This approach provides a scalable template for integrating topological materials via ALD."]}}, {"title": "Observation of a commensurate super modulation consistent with an intertwined charge density wave and antiferromagnetic phase in monolayer 1T-NbSe2", "journal": "npj_QuantumMaterials", "source": "Gemini", "link": "https://www.nature.com/articles/s41535-026-00924-1", "authors": "Joy Y. Hsu, Rachel Birchmier, Gurjyot Sethi, et al.", "last_authors": "Steven G. Louie, Vidya Madhavan", "summary": "Observation of a commensurate super modulation consistent with an intertwined charge density wave and antiferromagnetic phase in monolayer 1T-NbSe 2", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Directly relevant study of charge density waves in a monolayer niobium-based chalcogenide.", "tags": ["CDW", "monolayer", "NbSe2"], "image": "https://pubads.g.doubleclick.net/gampad/ad?iu=/285/npjquantmats.nature.com/article&sz=728x90&c=-348742103&t=pos%3Dtop%26type%3Darticle%26artid%3Ds41535-026-00924-1%26doi%3D10.1038/s41535-026-00924-1%26subjmeta%3D301,639,766%26kwrd%3DMaterials+science,Physics", "briefing": {"background": "1T-NbSe2는 전하 밀도 파동(CDW)과 상관관계가 있는 자기적 질서가 공존할 가능성이 있어 저차원 상관 전자 계 연구의 핵심 모델임.", "motivation": "단층 1T-NbSe2 박막에서 관측되는 초격자 구조와 CDW 및 반강자성(AFM) 질서 간의 상호작용을 규명하고자 함.", "result": "단층 1T-NbSe2에서 CDW와 AFM 상이 뒤얽힌(intertwined) commensurable 초격자 변조 현상을 관측함.", "implication": "저차원 물질에서 CDW와 자기적 질서가 서로 분리되지 않고 긴밀하게 결합되어 있음을 입증함.", "novelty": "STM/STS 등을 통해 단층 수준에서 CDW와 자성 간의 정교한 상호작용을 관측한 점이 독자 연구 분야(특히 나이오븀 기반 칼코게나이드)에서 매우 function render() {
  slideEl.replaceChildren();
  if (!slides.length) { slideEl.className = 'empty'; slideEl.textContent = 'No papers passed the filters in this run.'; counterEl.textContent = '0 / 0'; prevBtn.disabled = true; nextBtn.disabled = true; return; }
  slideEl.className = 'slide';
  const r = slides[index];
  const b = r.briefing || {};
  const head = document.createElement('div');
  head.className = 'paper-head';
  if (r.image) {
    const figure = document.createElement('figure');
    figure.className = 'figure';
    const img = document.createElement('img');
    img.src = r.image; img.alt = 'Figure or article preview image'; img.loading = 'lazy'; img.referrerPolicy = 'no-referrer'; img.onerror = () => figure.remove();
    figure.appendChild(img);
    figure.appendChild(textEl('figcaption', '', 'Figure / article preview image from the source page'));
    head.appendChild(figure);
  }
  const headText = document.createElement('div');
  headText.className = 'head-text';
  const badges = document.createElement('div');
  badges.className = 'badges';
  if (r.score) badges.appendChild(textEl('span', 'badge score', `${r.score}/10`));
  if (r.tier) badges.appendChild(textEl('span', 'badge', r.tier));
  if (r.journal) badges.appendChild(textEl('span', 'badge', r.journal));
  if (r.source) badges.appendChild(textEl('span', 'badge', r.source));
  headText.appendChild(badges);
  const title = document.createElement('h1');
  if (r.link) { const titleLink = document.createElement('a'); titleLink.href = r.link; titleLink.target = '_blank'; titleLink.rel = 'noopener noreferrer'; titleLink.textContent = r.title || ''; title.appendChild(titleLink); }
  else { title.textContent = r.title || ''; }
  headText.appendChild(title);
  headText.appendChild(textEl('p', 'meta', [r.journal, r.source].filter(Boolean).join(' | ')));
  if (r.last_authors || r.authors) { const authors = document.createElement('p'); authors.className = 'authors'; if (r.last_authors) authors.append('Last authors: ' + r.last_authors); if (r.authors) authors.append((r.last_authors ? ' | ' : '') + 'Authors: ' + r.authors); headText.appendChild(authors); }
  appendLabeledText(headText, 'why', 'Filter reason: ', r.reason);
  if (r.tags && r.tags.length) { const tags = document.createElement('div'); tags.className = 'tags'; r.tags.forEach(tag => tags.appendChild(textEl('span', 'tag', '#' + tag))); headText.appendChild(tags); }
  if (r.link) { const link = document.createElement('a'); link.className = 'link'; link.href = r.link; link.target = '_blank'; link.rel = 'noopener noreferrer'; link.textContent = 'Open paper'; headText.appendChild(link); }
  head.appendChild(headText);
  if (r.summary) { const abstract = document.createElement('p'); abstract.className = 'original-abstract'; const strong = textEl('strong', '', 'Original abstract'); abstract.appendChild(strong); abstract.append(r.summary); head.appendChild(abstract); }
  slideEl.appendChild(head);
  const briefing = document.createElement('div');
  briefing.className = 'briefing';
  appendBriefSection(briefing, 'Background', b.background);
  appendBriefSection(briefing, 'Motivation', b.motivation);
  appendBriefSection(briefing, 'Result', b.result);
  appendBriefSection(briefing, 'Implication', b.implication);
  appendBriefSection(briefing, "Why it's important / Novelty", b.novelty);
  appendBriefSection(briefing, 'Unresolved Questions', b.unresolved);
  appendBriefSection(briefing, 'Expected Future Work', b.future_work);
  if (b.concepts && b.concepts.length) {
    const section = document.createElement('section');
    section.className = 'brief-section wide';
    section.appendChild(textEl('h2', '', 'Concepts / Terms'));
    const concepts = document.createElement('div');
    concepts.className = 'concepts';
    b.concepts.forEach(c => {
      const item = document.createElement('div');
      item.className = 'concept';
      item.appendChild(textEl('h3', '', c.term || 'Concept'));
      [['왜 생겼나: ', c.why_emerged], ['누가 만들었나: ', c.origin], ['연결되는 흐름: ', c.connections]].forEach(([label, text]) => { if (!text) return; const p = document.createElement('p'); const bold = textEl('b', '', label); p.appendChild(bold); p.append(text); item.appendChild(p); });
      concepts.appendChild(item);
    });
    section.appendChild(concepts);
    briefing.appendChild(section);
  }
  if (b.english_summary && b.english_summary.length) { const section = document.createElement('section'); section.className = 'brief-section wide'; section.appendChild(textEl('h2', '', 'English Summary')); const ul = document.createElement('ul'); b.english_summary.slice(0, 5).forEach(line => ul.appendChild(textEl('li', '', line))); section.appendChild(ul); briefing.appendChild(section); }
  slideEl.appendChild(briefing);
  counterEl.textContent = `${index + 1} / ${slides.length}`;
  prevBtn.disabled = index === 0;
  nextBtn.disabled = index === slides.length - 1;
}
prevBtn.addEventListener('click', () => { index = Math.max(0, index - 1); render(); });
nextBtn.addEventListener('click', () => { index = Math.min(slides.length - 1, index + 1); render(); });
document.addEventListener('keydown', event => { if (event.key === 'ArrowLeft') prevBtn.click(); if (event.key === 'ArrowRight') nextBtn.click(); });
render();
</script>
</body>
</html>
