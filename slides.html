<title>Daily Paper Slideshow</title>
<style>
  :root {
    color-scheme: light;
    --bg: #f6f7f4;
    --paper: #ffffff;
    --ink: #111827;
    --muted: #64748b;
    --line: #d8ddd2;
    --accent: #176b87;
    --accent-2: #9a3412;
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; overflow: auto; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: var(--bg); color: var(--ink); }
  .shell { max-width: 1500px; min-height: 100vh; margin: 0 auto; padding: 14px 18px; display: flex; flex-direction: column; }
  .topbar { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 16px; }
  .top-actions { display: flex; align-items: center; gap: 10px; }
  .topbar a, button { border: 1px solid var(--line); border-radius: 8px; background: var(--paper); color: var(--ink); padding: 10px 14px; font-weight: 700; text-decoration: none; cursor: pointer; }
  button.primary { background: var(--accent); border-color: var(--accent); color: white; }
  button:disabled { opacity: 0.45; cursor: not-allowed; }
  .counter { color: var(--muted); font-weight: 700; }
  .slide { min-height: calc(100vh - 82px); background: var(--paper); border: 1px solid var(--line); border-radius: 10px; padding: 18px; box-shadow: 0 18px 42px rgba(15, 23, 42, 0.10); display: grid; grid-template-columns: minmax(310px, 0.86fr) minmax(0, 1.55fr); gap: 18px; overflow: visible; }
  .paper-head { min-width: 0; min-height: 0; overflow: visible; display: flex; flex-direction: column; gap: 12px; }
  .figure { margin: 0; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: #f8fafc; }
  .figure img { display: block; width: 100%; max-height: 41vh; object-fit: contain; background: white; }
  .figure figcaption { padding: 7px 10px; color: var(--muted); font-size: 12px; line-height: 1.3; }
  .head-text { display: flex; flex-direction: column; gap: 9px; min-width: 0; }
  .badges { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .badge { border-radius: 999px; padding: 5px 9px; background: #eef2ff; color: #3730a3; font-size: 12px; font-weight: 800; }
  .score { background: #fee2e2; color: #991b1b; }
  h1 { margin: 0; font-size: 25px; line-height: 1.15; letter-spacing: 0; overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
  h1 a { color: inherit; text-decoration-color: rgba(23, 107, 135, 0.35); text-decoration-thickness: 2px; text-underline-offset: 4px; }
  h1 a:hover { color: var(--accent); text-decoration-color: var(--accent); }
  .meta, .authors, .why, .abstract { font-size: 13px; line-height: 1.45; }
  .meta, .authors { color: var(--muted); }
  .why strong, .abstract strong, .authors strong { color: var(--ink); }
  .authors { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .why { border-left: 4px solid var(--accent-2); padding-left: 10px; color: #374151; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .abstract { border-top: 1px solid var(--line); padding-top: 14px; color: #374151; }
  .original-abstract { border-top: 1px solid var(--line); padding-top: 10px; color: #374151; font-size: 11.5px; line-height: 1.35; overflow-wrap: anywhere; }
  .original-abstract strong { display: block; margin-bottom: 4px; color: var(--ink); }
  .tags { display: flex; flex-wrap: wrap; gap: 8px; }
  .tag { border-radius: 999px; padding: 4px 8px; background: #f1f5f9; color: #475569; font-size: 12px; font-weight: 700; }
  .head-text > .link { display: none; }
  .briefing { min-width: 0; min-height: 0; overflow: visible; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); grid-auto-rows: minmax(0, auto); align-content: start; gap: 11px 18px; border-top: 0; padding-top: 0; }
  .brief-section { min-width: 0; }
  .brief-section.wide { grid-column: 1 / -1; }
  .brief-section h2 { margin: 0 0 4px; font-size: 14px; line-height: 1.22; color: #0f766e; letter-spacing: 0; }
  .brief-section p, .brief-section li { margin: 0; font-size: 12.5px; line-height: 1.42; color: #1f2937; overflow-wrap: anywhere; }
  .brief-section ul { margin: 0; padding-left: 20px; }
  .concepts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 9px 14px; }
  .concept { border-top: 1px solid var(--line); padding-top: 7px; }
  .concept h3 { margin: 0 0 4px; font-size: 13px; color: #7c2d12; letter-spacing: 0; }
  .concept p { margin: 2px 0 0; font-size: 11.5px; line-height: 1.35; color: #374151; overflow-wrap: anywhere; }
  .concept b { color: #111827; }
  .link { color: var(--accent); font-weight: 800; text-decoration: none; }
  .empty { padding: 48px; background: var(--paper); border: 1px solid var(--line); border-radius: 12px; color: var(--muted); }
  @media (max-width: 860px) {
    .shell { padding: 14px; }
    .topbar, .top-actions { align-items: stretch; flex-direction: column; }
    .slide, .briefing, .concepts { grid-template-columns: 1fr; }
    .slide { min-height: auto; overflow: visible; display: grid; }
    h1 { font-size: 28px; }
  }
</style>

<script>
const slides = [{"title": "c-axis strain tuning of superconductivity and symmetric elastoresistivity in CsV3Sb5", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/l499-9f6c", "authors": "Xiaoran Yang, Yutong Li, Chunyi Li, et al.", "last_authors": "Huiqiu Yuan, Xingye Lu", "summary": "The kagome metal ${\\mathrm{CsV}}_{3}{\\mathrm{Sb}}_{5}$ hosts an intriguing interplay between charge-density-wave (CDW) order and superconductivity that is highly sensitive to lattice distortions. However, determining the specific roles of the in-plane $({A}_{1g,1})$ and out-of-plane $({A}_{1g,2})$ s…", "tier": "A_MUST_READ", "score": "10", "reason": "Direct hit on core project interest: kagome metal CsV3Sb5 and its CDW/superconductivity interplay.", "tags": ["material", "CsV3Sb5", "kagome", "CDW"], "image": "", "briefing": {"background": "카고메 격자 물질인 AV3Sb5 (A=K, Rb, Cs)계열은 좌절된 격자 구조에서 비롯된 독특한 밴드 구조와 전하 밀도 파(CDW), 초전도성(SC)이 공존하며 얽혀 있는 시스템으로 큰 주목을 받고 있습니다. 특히 이들 사이의 상호작용은 격자 변형(strain)에 매우 민감한 것으로 알려져 있습니다.", "motivation": "기존 연구들은 주로 면내(in-plane) 변형에 초점을 맞추었으나, 입체적인 대칭성 변화를 이해하기 위해서는 c-축(out-of-plane) 방향의 변형이 초전도성과 대칭적 탄성 저항(elastoresistivity)에 미치는 구체적인 역할을 규명할 필요가 있습니다.", "result": "c-축 방향의 strain 튜닝을 통해 CsV3Sb5의 초전도 전이 온도와 CDW와의 상관관계를 조사하였으며, 대칭적인 탄성 저항 성분을 분리해 내어 격자 변형에 따른 전자 구조의 응답 특성을 확인하였습니다.", "implication": "c-축 변형이 초전도와 CDW의 경쟁 혹은 공존 관계를 조절하는 핵심 변수임을 확인하였으며, 이는 카고메 금속의 위상적 상태와 전자 상관관계를 미세하게 제어할 수 있는 경로를 제시합니다.", "novelty": "사용자의 주 관심사인 CsV3Sb5 계열에서 c-축 strain이라는 물리적 변수를 정밀하게 제어하여 초전도성과 탄성 저항의 변화를 연결시킨 점이 돋보이며, 이는 해당 물질의 nematicity나 loop current 연구와도 밀접한 관련이 있습니다.", "unresolved": "실제 실험에서 유도된 strain이 국소적인 도메인 구조나 CDW의 위상에 구체적으로 어떤 미시적 변화를 일으키는지에 대한 직접적인 이미징 데이터는 보강이 필요할 수 있습니다.", "future_work": "c-축 strain 하에서의 ARPES 또는 STM 측정을 통해 페르미 면의 변형과 갭(gap) 형성을 직접 관찰함으로써 탄성 저항 데이터의 미시적 기원을 확인할 필요가 있습니다.", "concepts": [{"term": "CsV3Sb5", "why_emerged": "카고메 격자에서 나타나는 특이한 밴드 구조와 상관 전자의 상호작용을 연구하기 위한 표준 물질로 등장했습니다.", "origin": "2020년경 Stephen Wilson 그룹 등에 의해 위상적 특성과 CDW의 공존이 발견되며 널리 알려짐.", "connections": "카고메 금속, 전하 밀도 파(CDW), 비정상 홀 효과, 초전도성."}, {"term": "Elastoresistivity", "why_emerged": "격자 변형에 따른 저항 변화를 측정하여 전자 구조의 회전 대칭성 깨짐(nematicity) 등을 탐지하기 위해 사용됩니다.", "origin": "고체물리 실험 기법으로 오랫동안 존재했으나 최근 철 기반 초전도체 등의 연구에서 중요성이 부각됨.", "connections": "Nematicity, 상관 전자계, Strain tuning."}], "english_summary": ["Investigated the effect of c-axis strain on the superconductivity of CsV3Sb5.", "Extracted symmetric elastoresistivity components to probe electronic responses.", "Demonstrated that out-of-plane lattice distortion is a key tuning knob for the CDW-SC interplay.", "Provides insights into the symmetry-breaking electronic states in kagome metals."]}}, {"title": "Elucidating the topological nature of molecular beam epitaxy grown high Curie temperature (Mn1+ySb2-yTe4)x(Sb2-yMnyTe3)1-x using angle resolved photoelectron spectroscopy", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2611.00548", "authors": "Candice R. Forrester, Jisoo Moon, Sina Mohammadi, et al.", "last_authors": "Lia Krusin-Elbaum, Maria C. Tamargo", "summary": "Angle-resolved photoemission spectroscopy (ARPES) is used to elucidate the band structure of (Mn1+ySb2-yTe4)x(Sb2-yMnyTe3)1-x, a new magnetic quantum material grown using molecular beam epitaxy that has a Curie temperature (TC) above 100K, much higher than those reported for other materials of the MnxSb2-xTe4 class. Conflicting and sparse theory and experiments, as well as the complex disordered structure of the materials make it difficult to establish their topological nature. Here we explore this question by performing ARPES studies for two samples with x=0.65 and x=0.92, respectively. Images of the band structures of these two samples were acquired using photon energy dependent studies. The bulk and surface states of this complex material system, and the effects of composition on the band structure were investigated. Evidence of surface state features as well as bulk related ones were obtained, supporting their non-trivial nature. No signature of Fermi-arcs consistent with Weyl semimetals were seen. A shift in the Fermi level of the two samples due to different carrier densities allowed observation of the onset of a Dirac point in the surface states. Temperature dependent ARPES suggests possible band splitting as the materials undergo magnetic transitions, helping to understand the magnetic interactions. Our results point to their likely magnetic topological insulating nature.", "tier": "A_MUST_READ", "score": "10", "reason": "Direct ARPES study of a high-Tc magnetic topological material, a perfect match for user's expertise.", "tags": ["ARPES", "topologicalinsulator", "magneticmaterial", "bandstructure", "MBE"], "image": "https://arxiv.org/static/browse/0.3.4/images/arxiv-logo-fb.png", "briefing": {"background": "자성 위상 절연체(MTI)는 위상적 비자명성과 자성 질서를 결합하여 양자 이상 홀 효과(QAHE) 등을 높은 온도에서 구현하려는 목적으로 연구되고 있습니다. 특히 Mn-Sb-Te 계열은 이러한 특성을 구현할 유력한 후보 물질군입니다.", "motivation": "최근 MBE로 성장된 (Mn,Sb)2Te3 기반의 새로운 화합물들이 100K 이상의 높은 큐리 온도(Tc)를 보이지만, 복잡한 무질서와 구조적 변이 때문에 이들의 실제 위상적 상태와 전자 구조에 대해서는 논란이 많았습니다.", "result": "ARPES 측정을 통해 x=0.65 및 x=0.92 샘플의 밴드 구조를 분석한 결과, 표면 상태(surface state)와 벌크 상태의 증거를 확인하여 MTI 가능성을 뒷받침했습니다. Weyl 반금속의 특징인 Fermi-arc는 발견되지 않았으며, 온도 변화에 따른 밴드 갈라짐(splitting)을 관찰했습니다.", "implication": "100K 이상의 높은 Tc를 가진 이 시스템이 자성 위상 절연체일 가능성이 높음을 시사하며, 이는 상온에 가까운 위상 자성 소자 구현을 위한 중요한 단계입니다.", "novelty": "기존 MnBi2Te4 계열보다 훨씬 높은 Tc를 가진 물질을 ARPES로 직접 분석했다는 점이 중요하며, 사용자 관심사인 '자성 위상 물질'과 'ARPES를 이용한 밴드 분석'에 완벽히 부합합니다.", "unresolved": "Dirac point의 명확한 갭 크기 측정과 무질서(disorder)가 위상적 보호를 받는 상태에 미치는 영향에 대해서는 추가적인 정밀 분석이 필요합니다.", "future_work": "고분해능 ARPES를 통한 Dirac gap의 정밀 측정과 외부 자기장에 따른 밴드 구조 변형 연구가 뒤따라야 합니다.", "concepts": [{"term": "Magnetic Topological Insulator (MTI)", "why_emerged": "시간 반전 대칭성을 깨뜨려 위상 절연체 내부에서 양자 이상 홀 효과를 유도하기 위해 필요하게 되었습니다.", "origin": "2010년대 초반 이론적 제안 후 MnBi2Te4 등에서 실험적 구현.", "connections": "Quantum Anomalous Hall Effect, Axion Insulator, MnBi2Te4."}, {"term": "Molecular Beam Epitaxy (MBE)", "why_emerged": "원자 층 단위의 정밀한 박막 성장을 통해 복잡한 화학 조성을 가진 양자 물질을 합성하기 위해 필수적입니다.", "origin": "1960년대 후반 J. R. Arthur와 Alfred Y. Cho에 의해 개발.", "connections": "박막 성장, 헤테로 구조, 양자 홀 소자."}], "english_summary": ["ARPES study on high-Tc (above 100K) Mn-Sb-Te based magnetic quantum materials.", "Identified surface and bulk states supporting the magnetic topological insulator (MTI) nature.", "No Weyl Fermi-arcs observed, ruling out a simple Weyl semimetal phase.", "Observed temperature-dependent band splitting associated with magnetic transitions."]}}, {"title": "Depth-dependent electronic states of Fe3O4 across the Verwey transition studied by hard x-ray photoemission spectroscopy", "journal": "PRB_Recent", "source": "keyword", "link": "http://link.aps.org/doi/10.1103/lyp6-ctpz", "authors": "Shigenori Ueda, Azusa N. Hattori, Hidekazu Tanaka", "last_authors": "Azusa N. Hattori, Hidekazu Tanaka", "summary": "Depth-dependent electronic states of a prototypical strongly correlated ${\\mathrm{Fe}}_{3}{\\mathrm{O}}_{4}$ thin film across the Verwey transition temperature $({T}_{\\mathrm{V}}∼125\\phantom{\\rule{0.16em}{0ex}}\\mathrm{K})$ were investigated by hard x-ray photoemission spectroscopy (HAXPES) combined w…", "tier": "A_MUST_READ", "score": "9", "reason": "title strong match: photoemission", "tags": ["photoemission", "correlated"], "image": "", "briefing": {"background": "자철석(Fe3O4)은 금속-절연체 전이의 고전적 사례인 버웨이(Verwey) 전이를 보여주는 대표적인 강상관 전자계 물질입니다. 하지만 박막 형태에서 표면과 벌크의 전자 상태가 어떻게 다른지는 여전히 중요한 연구 대상입니다.", "motivation": "기존 광전자 분광법은 표면 민감도가 높아서 벌크의 특성을 정확히 반영하지 못할 수 있으므로, 투과 깊이가 깊은 경엑스선 광전자 분광법(HAXPES)을 통해 깊이에 따른 전자 상태 변화를 명확히 규명하고자 했습니다.", "result": "HAXPES를 사용하여 Fe3O4 박막의 Verwey 전이 전후 깊이별 전자 상태를 측정하였으며, 전이 온도 부근에서 벌크와 계면 근처의 전자 구조가 어떻게 변화하는지 정량적으로 분석하였습니다.", "implication": "Fe3O4의 전하 질서(charge ordering)와 절연체 전이 기작이 깊이에 따라 달라질 수 있음을 보여주며, 이는 소자 응용 시 계면 특성 제어의 중요성을 시사합니다.", "novelty": "HAXPES라는 강력한 깊이 분해능 도구를 사용하여 고전적인 상관계 물질인 Fe3O4의 상전이를 재조명했다는 점이 특징입니다. 사용자 프로필의 'correlated electron systems' 및 'photoemission' 관심사에 해당합니다.", "unresolved": "박막의 두께나 기판과의 격자 불일치(mismatch)로 인한 변형이 전이 거동에 미치는 미시적 메커니즘에 대해서는 추가 연구가 필요할 수 있습니다.", "future_work": "다양한 기판 위에서 성장된 박막에 대해 깊이별 HAXPES 측정을 수행하여 격자 변형과 전하 질서의 상관관계를 일반화할 필요가 있습니다.", "concepts": [{"term": "Verwey transition", "why_emerged": "Fe3O4에서 저온 시 발생하는 급격한 저항 증가와 구조 변화를 설명하기 위해 제안되었습니다.", "origin": "1939년 E. J. W. Verwey가 처음 보고함.", "connections": "Charge ordering, Metal-insulator transition, Magnetite."}, {"term": "HAXPES", "why_emerged": "기존 부드러운 X선 기반 PES의 짧은 탈출 깊이 한계를 극복하고 벌크 내부의 전자 구조를 직접 측정하기 위해 개발되었습니다.", "origin": "2000년대 초반 3세대 방사광 가속기 활용과 함께 본격화됨.", "connections": "벌크 민감도, 광전자 분광법, 깊이 분해능."}], "english_summary": ["Investigated depth-dependent electronic states of Fe3O4 thin films using HAXPES.", "Monitored the evolution of electronic structures across the Verwey transition.", "Provided bulk-sensitive information compared to conventional surface-sensitive PES.", "Clarified how the metal-insulator transition manifests at different depths within the film."]}}, {"title": "Graphene lattice recoil in hard x-ray photoemission: Experiment and theory", "journal": "PRB_Recent", "source": "keyword", "link": "http://link.aps.org/doi/10.1103/s8w3-plc1", "authors": "Simone Ritarossi, Alice Apponi, Orlando Castellano, et al.", "last_authors": "Francesco Offi, Alessandro Ruocco", "summary": "Hard-x-ray C 1 s photoemission from monolayer graphene probes a regime in which nuclear recoil and intrinsic electronic asymmetry contribute on comparable energy scales to the observed spectral line shape. Here we combine experiment and modeling over the photon-energy range 0.8 – 8 keV to resolve this interplay quantitatively. A graphene-specific implementation of the Fujikawa-Takata cumulant formalism, based on an anisotropic vibrational density of states constrained by first-principles phonon calculations, captures the expected recoil scaling with photon energy and emission geometry but fails to reproduce the pronounced asymmetric tails of the measured spectra. To overcome this limitation, we introduce an explicit electronic convolution model in which a photon-energy-independent reference response, dominated by the electronic line shape and extracted from the low-recoil 0.8 keV data through a recoil-inclusive fit, is convolved with a phonon recoil kernel carrying the full dependence on photon energy and emission angle. This approach reproduces both the measured line-shape evolution and the observed peak shifts across the explored energy range without refitting the spectra at higher photon energies. The results show that recoil in graphene cannot be described by a baseline treatment in which the phonon recoil kernel is combined only with symmetric lifetime broadening, but must be treated together with the intrinsic many-body electronic response of the C 1 s line.", "tier": "A_MUST_READ", "score": "9", "reason": "title strong match: photoemission", "tags": ["photoemission", "graphene", "monolayer"], "image": "", "briefing": {"background": "고에너지 엑스레이 광전자 분광법(HAXPES)에서는 광전자가 방출될 때 원자핵이 반동(recoil) 에너지를 얻게 되며, 이는 광전자 스펙트럼의 이동 및 형태 변화를 유발합니다. 특히 그래핀과 같은 가벼운 원소로 구성된 저차원 물질에서는 이 효과가 전자적 비대칭성과 비슷한 에너지 척도에서 나타나 해석이 복잡해집니다.", "motivation": "본 연구는 0.8 ~ 8 keV 범위의 다양한 광자 에너지와 방출 각도에서 그래핀의 C 1s 코어 수준 스펙트럼을 측정하여, 핵 반동 효과와 고유한 다체 전자 응답이 어떻게 결합되어 나타나는지를 정량적으로 분리하고 모델링하고자 했습니다.", "result": "기존의 Fujikawa-Takata cumulant 형식론은 포논에 의한 반동의 경향성은 포착하지만 스펙트럼의 비대칭 꼬리 부분을 설명하지 못함을 발견했습니다. 연구진은 저에너지(0.8 keV) 데이터에서 추출한 에너지 독립적 전자 응답과 포논 반동 커널을 결합한 '전자 회선 모델(electronic convolution model)'을 도입하여, 추가적인 피팅 없이도 전체 에너지 범위의 스펙트럼 진화와 피크 이동을 재현하는 데 성공했습니다.", "implication": "그래핀의 HAXPES 데이터를 정확히 해석하기 위해서는 단순히 포논 반동과 대칭적인 수명 확폭(lifetime broadening)만을 고려해서는 안 되며, 반동 효과와 다체계 전자 응답 간의 상호작용을 반드시 포함해야 함을 시사합니다.", "novelty": "이론적 포논 계산과 실험적 HAXPES 데이터를 결합하여 그래핀의 핵 반동 현상을 가장 정밀하게 규명한 연구입니다. ARPES 연구 시 고에너지 영역에서 나타날 수 있는 스펙트럼 변형을 이해하는 데 중요한 기초 자료가 됩니다.", "unresolved": " rsion via magnetic interfaces, yet the true response of their spin-charge conversion, particularly in the absence of an external magnetic field, remains to be studied. Here, we report electric field control of spin-charge conversion in the topological insulator Bi 2 Te 3 with the antiferromagnetic multiferroic BiFeO 3 , using a nonlocal spin transport device. A systematic thickness dependence of the spin transport across the interface between Bi 2 Te 3 and BiFeO 3 reveals a signature of topological surface-state–dominated spin transport in the bilayer system. The spin-charge conversion remains robust for thicknesses above 10 nanometers but falls rapidly with reducing thickness and vanishes at 5 nanometers. This is consistent with hybridization-induced emergence of a trivial insulating phase, which is supported by the coherency factor estimated from the magnetoconductance of Bi 2 Te 3 . These results establish that spin-momentum–locked surface states dominate interfacial spin transport in the decoupled regime. Beyond presenting efficient spin-charge interconversion at an entirely insulating magnetic interface, this work also highlights sputter-deposited Bi 2 Te 3 as a high-quality and scalable platform for integrating quantum materials onto the devices. The nonlocal spin transport approach presented here provides a simple and unprecedented direct evidence of spin-charge conversion and opens an efficient and practical pathway toward designing energy-efficient spin-based devices.", "tier": "A_MUST_READ", "score": "9", "reason": "author whitelist: Robert J. Birgeneau", "tags": ["topologicalinsulator", "topological", "ferromagnet", "antiferromagnet", "transport"], "image": "", "briefing": {"background": "위상 절연체(TI)는 표면의 스핀-운동량 잠금(spin-momentum locking) 특성 덕분에 효율적인 스핀-전하 변환이 가능합니다. 이를 자성체와 결합하면 외부 자기장 없이 스핀 전류를 제어하는 차세대 저전력 스핀트로닉스 소자를 구현할 수 있습니다.", "motivation": "본 연구는 위상 절연체 Bi2Te3와 다강성(multiferroic) 반강자성체 BiFeO3 계면에서 외부 자기장 대신 전기장만을 이용하여 스핀 수송을 제어하고, TI의 위상적 표면 상태가 실제 수  band magnetism in Co3Sn2S2", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2611.00310", "authors": "Ola Kenji Forslund, Andrzej Ptok, Chun Lin, et al.", "last_authors": "Olle Eriksson, Johan Chang", "summary": "Correlations and topology are central pillars in the study of emergent electronic phases. Topological flat bands near the Fermi level unite these concepts, providing a route towards correlated topological phenomena and unconventional magnetism. Despite theoretical predictions, momentum-resolved observation of a topological flat band at the Fermi level has remained elusive. Using angle resolved photoemission spectroscopy, we observe a flat band at the Fermi level within the topologically non-trivial electronic structure of the magnetic kagome Weyl semimetal Co$_3$Sn$_2$S$_2$. We further uncover a strong temperature dependence in which the flat band shifts across the Fermi level, accompanied by a reconstruction of the Fermi surface. Strikingly, this evolution occurs on the same temperature scale as previously reported anomalies in the magnetic response. Together, these results provide evidence for topological flat band magnetism in Co$_3$Sn$_2$S$_2$, establishing a microscopic setting in which topology, electronic correlations, and magnetism become intertwined.", "tier": "A_MUST_READ", "score": "9", "reason": "Direct ARPES study of kagome magnetic Weyl semimetals directly tied to user's research profile.", "tags": ["ARPES", "kagome", "Weyl", "topological"], "image": "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAsAAAAOCAYAAAD5YeaVAAAAAXNSR0IArs4c6QAAAAZiS0dEAP8A/wD/oL2nkwAAAAlwSFlzAAALEwAACxMBAJqcGAAAAAd0SU1FB9wKExQZLWTEaOUAAAAddEVYdENvbW1lbnQAQ3JlYXRlZCB3aXRoIFRoZSBHSU1Q72QlbgAAAdpJREFUKM9tkL+L2nAARz9fPZNCKFapUn8kyI0e4iRHSR1Kb8ng0lJw6FYHFwv2LwhOpcWxTjeUunYqOmqd6hEoRDhtDWdA8ApRYsSUCDHNt5ul13vz4w0vWCgUnnEc975arX6ORqN3VqtVZbfbTQC4uEHANM3jSqXymFI6yWazP2KxWAXAL9zCUa1Wy2tXVxheKA9YNoR8Pt+aTqe4FVVVvz05O6MBhqUIBGk8Hn8HAOVy+T+XLJfLS4Z why_emerged": "상전이나 외부 자극에 의해 전자의 점유 영역이 급격히 변하는 현상을 설명하기 위해 사용됩니다.", "origin": "고체물리학의 금속-절연체 전이 및 자성 전이 연구에서 일반화됨.", "connections": "Lifshitz transition, CDW (Charge Density Wave), Quantum oscillations."}], "english_summary": ["Directly observed a topological flat band at the Fermi level in magnetic kagome Weyl semimetal Co3Sn2S2 using ARPES.", "Discovered a temperature-driven shift of the flat band across the Fermi level, coinciding with known magnetic anomalies.", "Provided microscopic evidence for the interplay between electronic correlations, topology, and magnetism.", "Established Co3Sn2S2 as a premier platform for studying correlated topological phenomena in kagome systems."]}}, {"title": "Melting noncoplanar order on the square-kagome lattice: Chiral, flat-band, and staggered spin liquids from projective symmetry", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2611.00987", "authors": "Harsh Raj, Atanu Maity, Yasir Iqbal", "last_authors": "Atanu Maity, Yasir Iqbal", "summary": "Noncoplanar magnetic orders carry a scalar spin chirality, and their melting by quantum fluctuations has been proposed as a route to chiral spin liquids. We ask what this route can produce on the square-kagome lattice, where couplings across the octagons stabilize noncoplanar cuboc and conical orders. We classify the fermionic spin liquids of this lattice by their projective symmetry groups, identify the symmetry class into which each noncoplanar order would melt, and compare candidate states with Gutzwiller-projected wave functions. A magnetic selection rule constrains the route: the chirality of every cuboc and conical order alternates in space, so a liquid that keeps the symmetry of its parent order has zero Chern number and no spontaneous thermal Hall response. A Chern state can descend only from uniformly chiral orders, and the regular ones we find need ferromagnetic bow-tie couplings. The energetics do not favor a chiral liquid either: among the projected wave functions we compare, a cuboc1-ordered state is lowest for strong cross-octagon couplings, and nonchiral states, a valence-bond crystal or a time-reversal-symmetric liquid, for weaker ones. The two inequivalent site orbits shape the spinons: a relative time-reversal sign between them pins flat bands to the Fermi level, and because the translations of $p4mm$ are not commutators, staggered chiral liquids exist, which are absent on sixfold-symmetric lattices.", "tier": "A_MUST_READ", "score": "9", "reason": "Theoretical study of spin liquids, flat bands, and Chern states on the kagome lattice, directly relevant.", "tags": ["kagome", "spinliquid", "flatband", "Chern", "theory", "magneticorder"], "image": "https://arxiv.org/html/2611.00987v1/fig3_chiral_classes.png", "briefing": {"background": "전통적인 카고메(kagome) 격자는 강한 기하학적 좌절(frustration)로 인해 양자 스핀 액체(QSL) 연구의 핵심 무대입니다. 스퀘어-카고메(square-kagome) 격자는 이와 유사하지만 다른 대칭성을 가지며, 비공면(noncoplanar) 자기 구조가 녹으면서 나타날 수 있는 키랄 스핀 액체(CSL)나 플랫 밴드(flat-band) 물리학의 새로운 가능성을 제시합니다.", "motivation": "본 연구는 스퀘어-카고메 격자에서 옥타곤(octagon) 가로지르기 결합에 의해 안정화되는 비공면 자성(cuboc, conical order)이 양자 요동에 의해 녹았을 때 어떤 형태의 페르미온 스핀 액체가 나타나는지 투영 대칭군(PSG) 이론을 통해 규명하고자 했습니다.", "result": "연구팀은 스퀘어-카고메 격자의 페르미온 스핀 액체를 PSG로 분류하고, cuboc이나 conical 질서로부터 파생되는 액체 상태들이 자기 선택 규칙에 의해 Chern 수가 0이 되며 자발적 열 홀 응답이 없음을 보였습니다. 반면, 강자성 bow-tie 결합이 있을 때만 Chern 상태가 가능하며, 격자의 두 사이트 궤도(site orbits) 간의 시간 반전 부호 차이로 인해 페르미 수준에 플랫 밴드가 고정되고 '엇갈린(staggered) 키랄 액체'가 존재할 수 있음을 발견했습니다.", "implication": "이 결과는 스퀘어-카고메 시스템에서 키랄 스핀 액체를 찾기 위해서는 단순한 비공면 질서의 붕괴뿐만 아니라 특정 자기 결합(강자성 bow-tie) 조건이 필요함을 시사합니다. 또한 플랫 밴드와 관련된 강상관 현상을 탐구할 수 있는 새로운 경로를 제시합니다.", "novelty": "스퀘어-카고메 격자에 대한 포괄적인 PSG 분류를 처음으로 수행했으며, 육각형 카고메와는 다른 대칭성($p4mm$)에 기인한 독특한 엇갈린 키랄 상태를 제안했습니다. 카고메 금속(AV3Sb5)의 CDW 및 루프 전류와 관련된 위상적 성질에 관심이 많은 독자에게 이론적 영감을 줄 수 있는 연구입니다.", "unresolved": "이론적으로 제안된 '엇갈린 키랄 액체'가 실제 물질에서 안정적으로 구현될 수 있는지, 그리고 스핀-궤도 결합이 이러한 상태의 안정성에 미치는 영향에 대한 추가 검증이 필요합니다.", "future_work": "강자성 bow-tie 결합을 가진 실제 화합물 후보를 탐 struction connects three-dimensional altermagnets to two-dimensional type-IV magnets and extends the same principle to one-dimensional ribbons. In a symmetric $[110]$ ribbon, a sublattice-exchange operation preserves the longitudinal momentum and enforces nonrelativistic spin degeneracy. {Spin-orbit coupling (SOC) ties spin to the lattice, so the N\\'eel orientation determines whether the remaining symmetries protect the doublets or allow them to split.} First-principles-derived Wannier calculations for Ta$_2$TeSeO ribbons reveal spin-polarized propagating channels with an ideal right-moving-mode polarization of approximately $35\\%$ at finite conductance for the parent easy-axis orientation $\\mathbf N\\parallel[100]$. Direct DFT calculations of Ta$_2$Te$_2$O ribbons resolve the contrast between spin-split $[100]$ and spin-degenerate $[001]$ SOC spectra. Assembling the same isolated Ta$_2$Te$_2$O ribbons into a transversely periodic array restores spin splitting without SOC. This conversion parallels the recovery of three-dimensional altermagnetism through suitable periodic stacking of two-dimensional type-IV magnets. One-dimensional type-IV magnetism thus provides a route to spin splitting through the interplay of antiferromagnetic order and SOC, distinct from conventional Rashba splitting driven by structural inversion asymmetry.", "tier": "A_MUST_READ", "score": "9", "reason": "Altermagnetic confinement in Ta2Te2O ribbons; combines altermagnetism, 1D physics, and tellurides.", "tags": ["material", "altermagnetism", "tellurides"], "image": "https://arxiv.org/html/2609.11547v2/Figure1.jpg", "briefing": {"background": "최근 '알터마그네티즘(Altermagnetism, Type-IV magnetism)'은 순수 자화가 없으면서도 비상대론적인 스핀 분할(spin splitting)을 보여 큰 주목을 받고 있습니다. 대개 3차원이나 2차원에서 논의되지만, 이를 1차원 나노 구조로 가두었을 때의 물리적 거동은 아직 미개척 분야입니다.", "motivation": "본 연구는 알터마그네티즘을 1차원 리본 구조에 가두었을 때(altermagnetic confinement), 대칭성과 스핀-궤도 결합(SOC)이 스핀 분할 및 전송 특성에 어떤 영향을 미치는지 규명하고자 했습니다.", "result": "Ta2Te2O 및 Ta2TeSeO 리본을 대상으 e interplay of AFM order and SOC."]}}, {"title": "Superconductivity of bilayer two-orbital Hubbard model for La3Ni2O7 under high pressure (SCIENCE CHINA Physics, Mechanics & Astronomy)", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2511.01801", "authors": "Wei-Yang Chen, Cui-Qun Chen, Meng Wang, Shou-Shu Gong, Dao-Xin Yao", "last_authors": "Shou-Shu Gong, Dao-Xin Yao", "summary": "By combining density functional theory (DFT) and density matrix renormalization group calculations, we investigate the unusual pressure dependence of superconducting transition temperature ($T_c$) in the nickelate superconductor La$_{3}$Ni$_{2}$O$_{7}$. Using the hopping integrals and on-site potentials obtained by fitting the DFT band structures, we map a quantum phase diagram of a bilayer two-orbital Hubbard model with increasing pressure in a ladder geometry, which has an intermediate Hubbard repulsion and a Hund's coupling. Near $3/8$ filling, we find a strong spin density wave order, which at $3/8$ filling shows a real-space spin pattern similar to the spin-charge stripe order along a lattice direction. At $21/64$ filling, we find a superconducting phase with interlayer superconductivity (SC) in both the $d_{z^2}$ and $d_{x^2-y^2}$ orbitals, as well as in-plane SC in the $d_{z^2}$ orbital. Intriguingly, the SC is weakened with increasing pressure and transits to a Luttinger liquid above $80$ GPa, which qualitatively agrees with the experimental observations of decreasing $T_c$ with increasing pressure and a transition to Fermi liquid above $80$ GPa in La$_{3}$Ni$_{2}$O$_{7}$. Through a comparative study, we further show that the ratio of interaction to hopping integral, which reduces moderately with increasing pressure, may play a dominant role in the weakening of SC. Our results of this experimentally relevant model not only find a robust SC through suppressing the competing spin density wave order, but also give new insight into the unusual pressure dependence of SC in La$_{3}$Ni$_{2}$O$_{7}$.", "tier": "A_MUST_READ", "score": "9", "reason": "Theoretical study of unconventional superconductivity and Luttinger liquid in nickelate La3Ni2O7.", "tags": ["theory", "superconductivity", "nickelate", "DFT", "Hubbard", "Luttingerliquid", "stronglycorrelated"], "image": "https://arxiv.org/html/2511.01801v2/Fig1.jpg", "briefing": {"background": "최근 발견된 La3Ni2O7은 고압(약 14-30 GPa)에서 약 80K의 초전도 전이 온도를 보여 '제2의 구리 산화물'로 큰 관심을 받고 있습니다. 하지만 더 높은 압력(80 GPa 이상)에서는 오히려 초전도성이 약해지고 페르미 액체로 전이되는 비정상적인 압력 의존성을 보입니다.", "motivation": "DFT와 DMRG 계산을 결합하여 La3Ni2O7의 압력 증가에 따른 초전도 전이 온도($T_c$) 변화와 80 GPa 이상의 영역에서 나타나는 물리적 거동(Luttinger liquid 전이 등)의 근본 원인을 규명하고자 했습니다.", "result": "이중층 2-오비탈 허바드 모델 계산 결과, 압력이 증가함에 따라 $d_{z^2}$ 및 $d_{x^2-y^2}$ 오비탈의 층간 초전도성이 약화되며, 80 GPa 이상에서는 루팅거 액체(Luttinger liquid)로 전이됨을 확인했습니다. 이는 압력이 증가함에 따라 상호작용($U$) 대비 호핑($t$) 비율이 감소하여 상관관계 효과가 상대적으로 약해지기 때문으로 분석되었습니다.", "implication": "La3Ni2O7의 초전도성이 상관관계가 강한 중간 영역에서 최적화되어 있음을 뜻하며, 극고압에서 초전도성이 사라지는 실험 결과를 이론적으로 뒷받침합니다.", "novelty": "DMRG를 통해 La3Ni2O7의 압력 유도 상도표를 정교하게 그려냈으며, 초전도 위상에서 루팅거 액체 위상으로의 전이를 명확히 제시했습니다. 니켈레이트 초전도체와 1차원적 물리(루팅거 액체)에 관심 있는 독자에게 매우 중요한 자료입니다.", "unresolved": "실제 실험은 3차원 결정 구조에서 이루어지지만, 본 연구의 DMRG 계산은 사다리(ladder) 기하학의 1차원적 근사에 기반하고 있어 3차원적 효과가 결과에 미치는 영향을 더 검토해야 합니다.", "future_work": "층간 결합 및 격자 왜곡을 더 정밀하게 포함하는 2D/3D 시뮬레이션과, 초전도와 경쟁하는 스핀 밀도 파동(SDW) 상태의 실험적 관측이 필요합니다.", "concepts": [{"term": "La3Ni2O7 nickelate", "why_emerged": "구리 산화물 이외의 물질에서 고온 초전도성을 구현하기 위한 탐구 과정에서 발견되었습니다.", "origin": "최근(2023년) Sun et al. (Nature)의 고압 실험 보고", "connections": "High-Tc superconductivity, Cuprates, Nickelates"}, {"term": "Luttinger liquid", "why_emerged": "1차원 계에서 상호작용하는 전자 시스템은 개별 입자가 아닌 집단적 들뜸으로 설명되어야 하기 때문에 등장했습니다.", "origin": "Joaquin Mazdak Luttinger (1963), Haldane (1981)", "connections": "Spin-charge separation, 1D conductors, Quantum wires"}, {"term": "Hund's coupling", "why_emerged": "다중 오비탈 시스템에서 스핀 정렬 에너지가 전자의 국소화 및 초전도 메커니즘에 핵심 역할을 하기 때문입니다.", "origin": rising from the scalar spin chirality of the non-coplanar order. This mix", "implication": "필터가 이 논문을 통과시킨 이유는 관련 키워드, 저자, 또는 Gemini relevance score 때문입니다.", "novelty": "독자의 관심사인 교대자성 및 베리 곡률과 직접적으로 연결되는 논문입니다. 특히 p-wave 스핀 분할이 스핀-궤도 결합(SOC)이 아닌, 비공면(non-coplanar) 자기 구조에서 유래한 '스칼라 스핀 카이랄성'과 그에 따른 창발적 자속(emergent flux)에 의해 발생한다는 점이 매우 혁신적입니다.", "unresolved": "원문 확인 후 열린 질문을 판단해야 합니다.", "future_work": "후속 실험, 독립 재현, 관련 물질/조건 확장이 가능한지 확인하세요.", "concepts": [{"term": "Altermagnetism (교대자성)", "why_emerged": "강자성체(순 자화 존재)와 반강자성체(스핀 분할 없음)의 장점을 결합한 새로운 자성 상태를 설명하기 위해 등장했습니다.", "origin": "최근 Libor Šmejkal 등에 의해 이론적으로 체계화됨.", "connections": "비상대론적 스핀 갈라짐, 스핀 홀 효과, 거대 자기 저항"}, {"term": "Mixed-Parity Spin Splitting", "why_emerged": "자기 대칭성에 따라 스핀 분할의 대칭성이 결정되는데, 복잡한 자기 구조에서는 여러 대칭성이 혼재될 수 있음을 설명하기 위해 도입되었습니다.", "origin": "초록 정보만으로는 특정하기 어려우나, 본 연구에서 TbB4의 특성으로 강조됨.", "connections": "p-wave, d-wave 스핀 텍스처, 다강성체"}, {"term": "Scalar Spin Chirality", "why_emerged": "스핀들이 비공면(non-coplanar)으로 배열될 때 전자가 느끼는 유효 자기장을 설명하기 위해 고안되었습니다.", "origin": "초록 정보만으로는 특정하기 어려움 (통상 응집물질 물리에서 널리 쓰임).", "connections": "창발적 자기장, 이상 홀 효과, 스카이뮨"}, {"term": "Berry Curvature Dipole", "why_emerged": "반전 대칭성이 깨진 계에서 비선형 수송 현상을 설명하는 핵심 기하학적 양입니다.", "origin": "Sodemann과 Fu (2015)에 의해 제안됨.", "connections": "비선형 홀 효과, 양자 기하학, 광전류"}], "english_summary": ["Demonstrates mixed-parity spin splitting in the 3D compensated magnet TbB4.", "Identifies that in-plane p/f-wave spin textures are driven by scalar spin chirality and emergent flux, rather than SOC.", "Shows that out-of-plane components maintain d-wave altermagnetic character.", "Predicts specific transport fingerprints including Edelstein response and Berry curvature dipole signatures."]}}, {"title": "Nodeless d-wave superconductivity driven by charge fluctuations in monolayer FeSe on SrTiO3", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2611.00534", "authors": "Jin-Wei Dong, Sen Zhou, Jian Wang, Gang Su, Ziqiang Wang", "last_ attice reconstruction at moiré lattice length scales (20-45 nm); and we detect a dilation of the atomic lattice at the AA sites at Angstrom length scale. We demonstrate at a phenomenological level that the inclusion of moiré lattice reconstruction supports compact localized heavy fermion f − f- states at AA sites. The additional inclusion of atomic lattice dilation generates a strong flexo-electric response that explicitly breaks particle-hole symmetry, pushing the f f -states down in energy. Consequently, these heavy fermion states, which are eightfold degenerate, energetically coexist with itinerant c c -electrons at the AB/BA sites. Our spatially resolved spectroscopic STM measurements quantitatively visualize this coexistence, confirming the persistence of the heavy fermion model over a continuous twist-angle range at θ < 1 ∘ \\theta<1^{\\circ} . Our findings show that flexo-electric responses can realize qualitatively distinct electronic landscapes in moiré materials beyond the single-particle picture. Looking ahead, small-angle TBG could prove an ideal platform to explore the interacting large- N N Kondo lattice problem with high tunability of the f − f- occupation and c − c- density through twist-angle and electrostatic back gates, respectively.", "tier": "B_IMPORTANT_CONDMAT", "score": "10", "reason": "STM study mapping heavy fermion localized states in small-angle twisted bilayer graphene.; demoted from A: broad CM, not direct user/project hit", "tags": ["STM", "graphene", "twistedbilayer", "heavyfermion"], "image": "https://arxiv.org/html/2610.38305v2/FIG01.png", "briefing": {"background": "매직 각도(약 1.05도) 부근의 뒤틀린 이중층 그래핀(TBG)은 평탄 밴드와 강한 상관 관계로 인해 초전도 및 절연 상태를 보입니다. 하지만 이보다 더 작은 각도(< 1도)에서는 격자 이완(lattice relaxation)이 심하게 일어나 전자 구조가 근본적으로 변하게 됩니다.", "motivation": "작은 각도 TBG에서 격자 재구성 및 원자 단위의 변형이 전자 구조, 특히 헤비 페르미온(Heavy Fermion) 묘사에 어떤 영향을 미치는지 STM/STS를 통해 규명하고자 했습니다.", "result": "Twisted bilayer graphene (TBG) near the first “magic angle” ( θ ≈ 1.05 ∘ \\thet nnections": "디락 점, 화학 퍼텐셜"}], "english_summary": ["Investigates small-angle TBG (0.3-0.7 degrees) using STM/STS to map electronic landscapes.", "Identifies that lattice dilation at AA sites creates a flexoelectric response breaking particle-hole symmetry.", "Confirms the persistence of the heavy fermion (f-c) model even at very small twist angles.", "Establishes small-angle TBG as a tunable platform for exploring the large-N Kondo lattice problem."]}}, {"title": "Cooperative concurrence of 4f and 3d flat bands in the kagome heavy-fermion metal YbCr6Ge6", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/zdzj-bln9", "authors": "Wenxin Lv (吕文欣), Pengcheng Ma (马鹏程), Tianqi Wang (王天琦), et al.", "last_authors": "Zhonghao Liu (刘中灏), Hechang Lei (雷和畅)", "summary": "Flat-band (FB) systems originating from special lattice geometry like in kagome metals as well as localized orbitals in materials such as heavy-fermion (HF) compounds have attracted intensive interest due to their band topology and strong electron correlation effects, leading to emergent quantum sta…", "tier": "B_IMPORTANT_CONDMAT", "score": "9", "reason": "Directly related to kagome electronic structure and heavy fermions.", "tags": ["kagome", "heavy_fermion", "electronic_structure"], "image": "", "briefing": {"background": "카고메 격자는 기하학적 좌절(frustration)로 인해 파동함수의 상쇄 간섭을 일으켜 플랫 밴드(flat band)를 형성하며, 이는 강한 전자 상관관계를 유도합니다. 한편, 희토류 화합물에서는 4f 전자의 국소성으로 인해 무거운 페르미온(heavy fermion) 상태가 형성되어 또 다른 형태의 밴드 편평화를 보입니다.", "motivation": "카고메 격자의 3d 전자 기하학적 구조와 희토류의 4f 전자 상관관계가 한 물질 내에서 어떻게 상호작용하고 협력하여 전자 구조를 형성하는지 규명하고자 했습니다.", "result": "YbCr6Ge6 화합물에서 Cr 3d 전자에 의한 카고메 유래 플랫 밴드와 Yb 4f 전자에 의한 무거운 페르미온 밴드가 공존함을 확인했습니다. 이들은 서로 다른 기원을 가지지만 페르미 준위 근처에서 협력적으로 나타납니다.", "implication": "기하학적 위상 효과와 강한 전자 상관관계가 결합된 새로운 양자 상태를 탐구할 수 있는 독특한 플랫폼을 제공하며, 카고메 금속 연구의 범위를 중성 페르미온 시스템으로 확장합니다.", "novelty": "기존 카고메 금속(AV3Sb5 등)이 주로 3d 혹은 1d 체인에 집중했다면, 이 연구는 4f 국소 모멘트와 3d 카고메 네트워크의 '협력적 공존'을 명시적으로 보여주었다는 점에서 독점적인 가치가 있습니다.", "unresolved": "4f-3d 혼성(hybridization)의 세부적인 결합 강도가 대칭성 깨짐이나 다른 정렬 상태(예: CDW)에 미치는 영향은 아직 명확하지 않습니다.", "future_work": "극저온 ARPES와 STM을 통해 4f 전자와 전도 전자 사이의 Kondo 산란 및 에너지 갭 형성을 직접적으로 관찰할 필요가 있습니다.", "concepts": [{"term": "Flat band (플랫 밴드)", "why_emerged": "밴드 폭이 좁아지면 전자의 운동 에너지가 억제되어 전자 간 상호작용이 지배적인 역할을 하게 되므로 초전도나 자기성 등 특이 현상을 이해하기 위해 도입되었습니다.", "origin": "초록 정보만으로는 특정하기 어려우나, 고체물리 초기부터 알려진 개념임.", "connections": "Kagome lattice, Moiré superlattice, Heavy fermions"}, {"term": "Kagome metal (카고메 금속)", "why_emerged": "이차원 카고메 격자에서 나타나는 디락 콘, 플랫 밴드, 반-밴드(van Hove singularity) 등 독특한 전자 구조를 연구하기 위해 등장했습니다.", "origin": "일본의 대나무 바구니 패턴에서 유래함.", "connections": "AV3Sb5, RV6Sn6, Frustrated magnetism"}, {"term": "Heavy fermion (무거운 페르미온)", "why_emerged": "국소화된 f-전자가 전도 전자와 상호작용(Kondo effect)하여 유효 질량이 수백 배 커지는 현상을 설명하기 위해 제안되었습니다.", "origin": "1970년대 CeCu2Si2 등에서 발견됨.", "connections": "Kondo effect, Non-Fermi liquid, Unconventional superconductivity"}], "english_summary": ["Discovery of cooperative 4f and 3d flat bands in YbCr6Ge6.", "Integrates kagome lattice geometry with heavy-fermion physics.", "Identifies coexisting electronic correlation mechanisms near the Fermi level.", "Provides a platform for exploring the intersection of topology and strong correlations."]}}, {"title": "Transparency-controlled multiple charge transfer in superconducting junctions with local shot-noise scanning tunneling spectroscopy", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/81fz-49c6", "authors": "Yudai Sato, Maialen Ortego Larrazabal, Jian-Feng Ge, et al.", "last_authors": "Milan P. Allan, Jiasen Niu", "summary": "Charge transport in superconducting junctions at finite voltages is governed by Andreev reflections, including multiple Andreev reflections, which are processes that enable multiple charge transfer, a hallmark that shot noise can directly quantify. Since the effective charge extracted from shot-noise measurements varies with the transparency of the junction, systematic control of transparency is essential but experimentally challenging. Here, we present shot-noise scanning tunneling microscopy measurements enabled by a newly developed amplifier, allowing access to different transparency regimes. We perform shot-noise measurements on Pb(111) with tunable transparency at 2.2 K and observe that the shot noise evolves from a single-electron tunneling regime to multiple charge-transfer regimes as transparency increases. Our results are quantitatively consistent with theoretical simulations of Andreev reflections and multiple Andreev reflections for a single-channel system. These results establish junction transparency as the key parameter governing the evolution of charge transport and demonstrate that noise STM is a powerful platform for investigating microscopic charge transport mechanisms with controlled junction transparency at the atomic scale.", "tier": "B_IMPORTANT_CONDMAT", "score": "9", "reason": "Shot-noise STS is highly relevant to electronic structure spectroscopy techniques.", "tags": ["STS", "superconductivity", "transport"], "image": "", "briefing": {"background": "초전도체와 금속의 접합부에서 전하 수송은 안드레예프 반사(Andreev Reflection)를 통해 일어납니다. 이 과정에서 전하가 2e 또는 그 이상의 배수로 전달될 수 있는데, 이를 실험적으로 직접 정량화하기 위해서는 전류의 요동인 샷 노이즈(shot noise) 측정이 필수적입니다.", "motivation": "접합의 투과도(transparency)에 따라 다중 안드레예프 반사의 기여도가 변하지만, STM 환경에서 투과도를 정밀하게 제어하며 샷 노이즈를 측정하는 것은 기술적으로 매우 어려웠습니다.", "result": "새로운 증폭기 기술을 적용한 STM을 통해 Pb(111) 표면에서 투과도를 조절하며 샷 노이즈를 측정했습니다. 낮은 투과도에서의 단일 전자 터널링부터 높은 투과도에서의 다중 전하 전달(MAR) 현상까지의 진화를 성공적으로 관측했습니다.", "implication": "STM이 단순한 상태 밀도 측정 도구를 넘어, 원자 수준에서 미시적인 전하 수송 메커니즘을 규명하고 전하의 크기를 직접 잴 수 있는 강력한 분광학적 도구임을 입증했습니다.", "novelty": "전통적인 수송 측정과 달리 STM의 팁-시료 간격을 조절하여 투과도를 연속적으로 제어하며 샷 노이즈를 측정했다는 점이 혁신적이며, 사용자 관심사인 STS 기술의 지평을 넓혔습니다.", "unresolved": "현재는 고전적인 초전도체인 Pb에 국한되어 있으나, 비전통적 초전도체나 위상 물질 접합에서의 노이즈 특성은 연구가 더 필요합니다.", "future_work": "이 기법을 활용하여 마요라나 제로 모드나 비전통적 초전도체의 Cooper pair 분할 메커니즘 등을 규명하는 연구가 기대됩니다.", "concepts": [{"term": "Shot noise (샷 노이즈)", "why_emerged": "전하의 불연속적 흐름으로 발생하는 시간적 요동을 통해 전하 운반자의 유효 전하량(effective charge)을 측정하기 위해 필요합니다.", "origin": "1918년 Walter Schottky가 처음 제안함.", "connections": "Andreev reflection, Fano factor, Quantum point contact"}, {"term": "Andreev reflection (안드레예프 반사)", "why_emerged": "금속의 전자가 초전도체로 들어갈 때 Cooper pair를 형성하며 구멍(hole)이 반사되는 현상을 설명하기 위해 도입되었습니다.", "origin": "1964년 Alexander F. Andreev가 제안함.", "connections": "Cooper pair, Multiple Andreev Reflection (MAR), Proximity effect"}, {"term": "Junction transparency (접합 투과도)", "why_emerged": "터널링 장벽의 세기에 따라 전하가 장벽을 통과할 확률을 나타내며, 수송 특성의 체제(regime)를 결정하는 핵심 변수입니다.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "Tunneling resistance, Transmission coefficient, Landauer-Büttiker formula"}], "english_summary": ["Demonstrated transparency-controlled shot-noise spectroscopy using a new STM amplifier.", "Observed the evolution from single-electron tunneling to multiple charge transfer on Pb(111).", "Results match theoretical simulations of multiple Andreev reflections (MAR).", "Establishes noise-STM as a tool for atomic-scale charge transport investigations."]}}, {"title": "Tuning the Fermi surface of MoTe2 by Nb doping", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/nqff-vzcg", "authors": "Andrew P. Weber, Iñigo Robredo, Philipp Rüßmann, et al.", "last_authors": "J. Enrique Ortega, Julen Ibañez-Azpiroz", "summary": "Ab initio calculations and angle-resolved photoemission experiments demonstrate that the bulk and surface electronic structure of Weyl semimetal candidate ${\\mathrm{MoTe}}_{2}$ changes significantly by tuning the chemical potential by less than 0.4 eV. Calculations indicate that several Lifshitz tra…", "tier": "B_IMPORTANT_CONDMAT", "score": "9", "reason": "Direct ARPES experiment on Weyl semimetal candidate.", "tags": ["ARPES", "Weyl", "Fermisurface"], "image": "", "briefing": {"background": "MoTe2는 2형 Weyl 준금속(type-II Weyl semimetal)으로, 결정 구조에 따라 위상적 특성이 크게 달라집니다. 특히 페르미 준위 근처의 Weyl 노드(node)와 페르미 아크(arc)의 거동을 제어하는 것은 소자 응용과 기초 물리 연구에서 중요합니다.", "motivation": "MoTe2에 Nb를 도핑하여 화학 포텐셜을 변화시켰을 때, 전자 구조와 페르미면이 구체적으로 어떻게 재구축되는지를 ARPES를 통해 직접 관찰하고자 했습니다.", "result": "Nb 도핑을 통해 화학 포텐셜을 0.4 eV 이하의 범위에서 조절하는 데 성공했습니다. 이 과정에서 여러 번의 립시츠 전이(Lifshitz transition)가 발생하며 Weyl 노드의 개수와 위치가 변하는 등 벌크 및 표면 전자 구조가 크게 변화함을 ARPES 실험과 제일원리 계산으로 증명했습니다.", "implication": "Nb 도핑이 MoTe2의 위상적 상태를 조율(tuning)할 수 있는 효과적인 수단임을 확인하였으며, 페르미면의 복잡한 진화 과정을 규명했습니다.", "novelty": "Weyl 준금속 후보 물질에서 도핑에 따른 페르미면의 변화와 립시츠 전이를 ARPES로 정밀하게 추적했다는 점이 돋보이며, 사용자 관심사인 Weyl/Dirac 시스템의 제어 가능성을 보여줍니다.", "unresolved": "도핑 농도가 높아짐에 따라 발생할 수 있는 무질서 효과가 위상적 안정성이나 수송 특성에 미치는 부정적 영향에 대한 논의가 필요합니다.", "future_work": "도핑된 MoTe2의 이상 홀 효과(Anomalous Hall Effect)나 자기 저항 측정을 통해 변화된 전자 구조가 실제 수송 현상에 미치는 영향을 확인할 필요가 있습니다.", "concepts": [{"term": "Weyl semimetal (웨일 준금속)", "why_emerged": "고체 내에서 질량이 없는 웨일 페르미온을 구현하고, 그로 인한 독특한 위상적 수송 특성(키랄 이상 현상 등)을 연구하기 위해 도입되었습니다.", "origin": "Hermann Weyl의 이론적 제안을 기반으로 2015년경 TaAs 등에서 실험적으로 확인됨.", "connections": "Dirac semimetal, Fermi arc, Chiral anomaly"}, {"term": "Lifshitz transition (립시츠 전이)", "why_emerged": "압력이나 도핑에 의해 페르미면의 위상(연결성)이 갑자기 변하는 현상을 설명하기 위해 도입되었습니다.", "origin": "1960년 Ilya Lifshitz가 제안함.", "connections": "Fermi surface reconstruction, Phase transitions, Van Hove singularity"}, {"term": "ARPES", "why_emerged": "고체 내부 전자의 에너지와 운동량을 동시에 측정하여 밴드 구조를 직접 시각화하기 위해 개발되었습니다.", "origin": "광전 효과를 기반으로 하며, 수십 년간 발전해 옴.", "connections": "Electronic structure, Fermi surface, Synchrotron radiation"}], "english_summary": ["Tuned the Fermi surface of Weyl semimetal MoTe2 via Nb doping.", "Observed multiple Lifshitz transitions using ARPES and ab initio calculations.", "Demonstrated significant changes in Weyl node configuration with small chemical potential shifts.", "Established doping as an effective tool to manipulate topological properties in 112 tellurides."]}}, {"title": "Altermagnetism in Folded Iron Chain Systems", "journal": "PRL_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/6327-7256", "authors": "Ling-Fang Lin, Yang Zhang, Satoshi Okamoto, Adriana Moreo, Lun-Hui Hu, Elbio Dagotto", "last_authors": "Lun-Hui Hu, Elbio Dagotto", "summary": "Altermagnetism—moment-compensated magnetism with momentum-dependent spin splitting—has so far been realized primarily in Néel-type antiferromagnets. Here, we demonstrate altermagnetism in folded iron chain systems with block-type magnetic order (e.g.,$↑↑↓↓$). In the strictly one-dimensional (1D) cas…", "tier": "B_IMPORTANT_CONDMAT", "score": "9", "reason": "Directly relevant topic (altermagnetism) in a specific quasi-1D material context.", "tags": ["altermagnetism", "1D-materials", "iron-chains"], "image": "", "briefing": {"background": "알터마그네티즘(Altermagnetism)은 넷 모멘트는 0이지만 밴드 구조에서 스핀 갈라짐이 나타나는 새로운 자성 상태로, 최근 응집물질 물리 분야에서 큰 관심을 받고 있습니다. 기존에는 주로 Néel 타입의 반강자성체(AFM)를 중심으로 연구되어 왔습니다.", "motivation": "이 연구는 Néel 타입이 아닌 블록형 자기 구조($↑↑↓↓$)를 가진 접힌 철 사슬(folded iron chain) 시스템에서도 알터마그네티즘이 존재할 수 있는지, 그리고 1차원 및 2차원 시스템에서 어떤 조건이 필요한지를 규명하고자 했습니다.", "result": "연구팀은 블록형 자기 순서를 가진 접힌 철 사슬 시스템이 알터마그네틱 특성을 가짐을 보였습니다. 1차원 구조 자체에서는 스핀 갈라짐이 나타나지 않지만, 사슬이 층을 이루거나 기판과의 상호작용을 통해 대칭성이 깨질 때 알터마그네틱 스핀 갈라짐이 유도됨을 계산으로 증명했습니다.", "implication": "알터마그네티즘의 후보 물질군을 기존의 복잡한 3차원 결정에서 준-1차원(quasi-1D) 사슬 시스템으로 확장했습니다. 이는 저차원 물질에서의 스핀트로닉스 응용 가능성을 시사합니다.", "novelty": "독자의 관심사인 준-1차원 물질(quasi-1D)과 알터마그네티즘을 결합한 연구입니다. 특히 철 기반 사슬 시스템에서 블록형 자기 구조라는 새로운 플랫폼을 제시했다는 점이 중요합니다.", "unresolved": "실제 실험에서 이러한 블록형 자기 구조를 가진 철 사슬을 완벽하게 구현하고, 예측된 스핀 갈라짐을 직접 측정(ARPES 등)하는 과제가 남아 있습니다.", "future_work": "Fe 기반 사슬 물질(예: BaFe2Se3 관련 구조)에 대한 ARPES 및 전송 특성 측정이 이어질 것으로 보입니다.", "concepts": [{"term": "Altermagnetism", "why_emerged": "강자성(FM)의 스핀 편향성과 반강자성(AFM)의 넷 모멘트 제로 특성을 동시에 활용하기 위해 등장했습니다.", "origin": "Libor Šmejkal, Jairo Sinova, Tomas Jungwirth 등이 이론적으로 정립함.", "connections": "반강자성 스핀트로닉스, Hall 효과, 비상호적 수송 현상."}, {"term": "Block-type magnetic order", "why_emerged": "단순한 교차 AFM($↑↓$) 외에 더 복잡한 자기 구조를 설명하기 위해 제안되었습니다.", "origin": "철 기반 초전도체 및 관련 화합물 연구 과정에서 관측됨.", "connections": "Fe-based superconductors, 모트 절연체, 자기 이방성."}], "english_summary": ["Demonstrates altermagnetism in folded iron chain systems with block-type magnetic order.", "Identifies that altermagnetic spin splitting emerges when 1D chains are layered or substrate-coupled.", "Expands the search for altermagnets into quasi-1D and non-Néel magnetic systems."]}}, {"title": "Atomic-Scale Visualization of Quantum Phase Transition in Mixed-Valence Regime", "journal": "PRL_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/17nh-csbr", "authors": "Xingsen Chen, Junyi Zhang, Qiaoyan Yu, et al.", "last_authors": "Hao Zheng, Jinfeng Jia", "summary": "Fe dopants on the surface of a ${\\mathrm{Bi}}_{2}{\\mathrm{Te}}_{3}$ thin film grown on a superconducting ${\\mathrm{NbSe}}_{2}$ substrate by molecular beam epitaxy are investigated by a dilution-refrigerator scanning tunneling microscope. Utilizing the tip-induced band bending effect, we precisely ma…", "tier": "B_IMPORTANT_CONDMAT", "score": "9", "reason": "Directly relevant STM study of Fe on Bi2Te3/NbSe2, exploring quantum phase transitions in topological systems.; demoted from A: broad CM, not direct user/project hit", "tags": ["STM", "topologicalinsulator", "superconductivity", "Bi2Te3", "NbSe2"], "image": "", "briefing": {"background": "초전도체 표면에 흡착된 자기 불순물은 Yu-Shiba-Rusinov (YSR) 상태라고 불리는 속박 상태를 형성하며, 이는 양자 상전이(QPT) 연구의 핵심 모델이 됩니다.", "motivation": "초전도체(NbSe2) 위의 위상 절연체(Bi2Te3) 박막에 존재하는 Fe 원자의 원자가 상태를 정밀하게 제어하여, 양자 상전이 과정을 원자 수준에서 시각화하고자 했습니다.", "result": "STM 팁에 의한 밴드 굽힘(tip-induced band bending) 효과를 이용해 Fe 원자의 원자가를 혼합 원자가 영역 내에서 연속적으로 조절했습니다. 이를 통해 YSR 상태가 페르미 레벨을 가로지르며 발생하는 양자 상전이의 국소적 상태 밀도 변화를 성공적으로 관측했습니다.", "implication": "위상 물질과 초전도성이 결합된 계에서 자기 불순물의 양자 상태를 인위적으로 조절하고 관찰할 수 있는 방법론을 제시했습니다.", "novelty": "사용자의 주요 관심사인 STM/STS를 활용해 Bi2Te3/NbSe2 계의 전자 구조와 양자 상전이를 직접 시각화했다는 점에서 가치가 높습니다.", "unresolved": "혼합 원자가 상태에서 나타나는 다체 효과(Kondo 효과 등)와 YSR 상태 간의 복잡한 상호작용에 대한 추가 이론적 해석이 필요합니다.", "future_work": "마요라나 제로 모드(Majorana zero modes) 탐색을 위해 이러한 불순물 제어 기술을 위상 초전도체 후보군에 적용할 것으로 예상됩니다.", "concepts": [{"term": "Yu-Shiba-Rusinov (YSR) states", "why_emerged": "초전도체 내 자기 불순물에 의한 산란 효과를 설명하기 위해 도입되었습니다.", "origin": "L. Yu, H. Shiba, R. Rusinov가 1960년대에 각각 독립적으로 제안.", "connections": "불순물 유도 초전도 갭 내 상태, 마요라나 속박 상태."}, {"term": "Tip-induced band bending", "why_emerged": "STM 측정 시 팁의 전압이 샘플 표면의 전자 농도를 국부적으로 변화시키는 현상을 설명하기 위함입니다.", "origin": "반도체 STM 연구 분야에서 널리 알려진 현상.", "connections": "Gate-tunable STM, 2D materials spectroscopy."}], "english_summary": ["Visualizes the quantum phase transition of Fe impurities on Bi2Te3/NbSe2 using STM.", "Achieves continuous control of the impurity state via tip-induced band bending.", "Maps the transition between different ground states of Yu-Shiba-Rusinov levels."]}}, {"title": "Altermagnetism revealed by polarized neutrons in MnF2", "journal": "Science", "source": "Gemini", "link": "https://www.science.org/doi/abs/10.1126/science.aec2602?af=R", "authors": "Quentin Faure, Dalila Bounoua, Victor Balédent, et al.", "last_authors": "Sylvain Petit, Paul McClarty", "summary": "Altermagnets are compensated magnets with symmetry-enforced spin split bands. Direct spectroscopic evidence for their existence has been reported in several materials. For example, inelastic neutron scattering (INS) has recently been used to witness a splitting of magnon bands in MnTe that is compatible with altermagnetism. Here, we present polarized INS results on MnF 2 showing that it is altermagnetic. Our data reveal a splitting coming from the long-range dipolar coupling. Furthermore, using a domain-biased sample, the data reveal a nonzero chirality in the neutron scattering cross section that reverses the sign between the two magnon modes. It is this feature that clearly demonstrates altermagnetism in MnF 2 . This finding highlights the potential for polarized INS to characterize altermagnets through its sensitivity to fine structure in magnon spectra.", "tier": "B_IMPORTANT_CONDMAT", "score": "9", "reason": "Direct experimental study of altermagnetism using neutron scattering in a real material.", "tags": ["altermagnetism", "neutronscattering", "magneticorder", "MnF2"], "image": "", "briefing": {"background": "알터마그네티즘은 밴드 구조의 스핀 분할이 특징이지만, 이를 마그논(magnon) 스펙트럼의 변화를 통해 실험적으로 입증하는 시도가 진행 중입니다.", "motivation": "가장 전형적인 반강자성체 중 하나인 MnF2가 실제로는 알터마그네틱 대칭성을 가지고 있음을 편광 비탄성 중성자 산란(polarized INS)을 통해 증명하고자 했습니다.", "result": "편광 중성자 산란 실험 결과, MnF2의 마그논 밴드에서 알터마그네티즘에 기인한 갈라짐을 확인했습니다. 특히, 두 마그논 모드 사이에서 부호가 반전되는 비제로(nonzero) 카이랄성(chirality)을 관측함으로써 MnF2의 알터마그네틱 성질을 결정적으로 입증했습니다.", "implication": "중성자 산란이 알터마그네틱 물질의 미세한 자기 구조와 여기 상태를 분석하는 강력한 도구임을 입증했습니다. 또한 MnF2라는 친숙한 물질을 알터마그네트의 표준 물질로 재정의했습니다.", "novelty": "독자의 관심사인 알터마그네티즘과 중성자 산란을 결합한 논문입니다. 단순히 밴드 구조(ARPES)를 넘어 마그논(INS) 레벨에서 알터마그네티즘을 확인한 최신 성과입니다.", "unresolved": "장거리 쌍극자 결합(long-range dipolar coupling)이 마그논 갈라짐에 미치는 기여도와 알터마그네틱 교환 상호작용의 기여도를 분리하여 정량화하는 정밀한 분석이 더 필요할 수 있습니다.", "future_work": "다른 알려진 반강자성체들에 대해 편광 중성자 산란을 활용한 알터마그네티즘 전수 조사가 이루어질 것으로 보입니다.", "concepts": [{"term": "Polarized Inelastic Neutron Scattering (PINS)", "why_emerged": "자성 시스템에서 핵 산란과 자기 산란을 분리하고, 스핀의 방향 및 카이랄성을 정밀하게 측정하기 위해 개발되었습니다.", "origin": "Moon, Riste, Koehler (1969) 등이 기초를 확립.", "connections": "Magnetic excitations, Spin waves, Magnon topology."}, {"term": "Magnon splitting", "why_emerged": "자기 시스템의 이방성이나 대칭성 파괴를 이해하기 위해 마그논 모드의 에너지 차이를 연구하게 되었습니다.", "origin": "초록 정보만으로는 특정하기 어려움 (전통적인 스핀파 이론에서 파생).", "connections": "Dzyaloshinskii-Moriya interaction, Altermagnetism."}], "english_summary": ["Identifies altermagnetism in the classic antiferromagnet MnF2 using polarized INS.", "Observes magnon splitting and sign-reversing chirality between modes.", "Demonstrates the power of polarized neutron scattering for characterizing altermagnets."]}}, {"title": "Chiral altermagnon in MnTe", "journal": "Science", "source": "Gemini", "link": "https://www.science.org/doi/abs/10.1126/science.adv3196?af=R", "authors": "Daniel Jost, Resham Babu Regmi, Eder G. Lomeli, et al.", "last_authors": "Stephan Geprägs, Matthias F. Kling", "summary": "Altermagnetism has been recognized as a magnetic phase that bridges the properties of ferro- and antiferromagnetism. The momentum-dependent spin splitting observed in these materials reflects their distinctive symmetry characteristics, which also establish the conditions for chiral magnons to emerge. Here we provide direct experimental evidence for a chiral magnon in the altermagnetic candidate manganese telluride (MnTe) revealed by circular-dichroism resonant inelastic x-ray scattering. This mode, which we term chiral altermagnon, exhibits a distinct momentum dependence of its spin polarization consistent with the altermagnetic g -wave symmetry of MnTe. Our polarization-resolved data corroborate the existence of a discrete class of magnetic excitations, demonstrating how altermagnetic order shapes spin dynamics and paving the way for advances in spintronic and quantum technologies.", "tier": "B_IMPORTANT_CONDMAT", "score": "9", "reason": "Study of altermagnetism in a real material, directly relevant to user's interests.", "tags": ["altermagnetism", "magnons", "MnTe"], "image": "", "briefing": {"background": "최근 발견된 교대자성(Altermagnetism)은 강자성(순자화 존재)과 반강자성(자화 상쇄)의 특성을 동시에 지닌 새로운 자성 상태입니다. 운동량 공간에서의 스핀 갈라짐(spin splitting)이 특징이며, 이는 고체 물리 및 스핀트로닉스 분야에서 매우 중요한 화두입니다.", "motivation": "이 연구는 교대자성 후보 물질인 MnTe에서 자성 차수뿐만 아니라, 이 차수가 자기 여기(magnon)의 거동에 어떤 영향을 미치는지, 특히 '카이랄 마그논'의 존재 여부를 실험적으로 검증하고자 했습니다.", "result": "원편광 이색성 공명 연엑스선 산란(CD-RIXS)을 통해 MnTe에서 카이랄 마그논(chiral altermagnon)의 직접적인 증거를 확보했습니다. 이 여기 모드는 MnTe의 교대자성 g-웨이브 대칭성과 일치하는 운동량 의존적 스핀 편광을 보여주었습니다.", "implication": "교대자성 질서가 단순히 밴드 구조뿐만 아니라 스핀 동역학(spin dynamics)을 근본적으로 정의한다는 점을 확인했습니다. 이는 교대자성체를 활용한 차세대 스핀트로닉스 소자 설계의 실험적 토대가 됩니다.", "novelty": "실제 물질인 MnTe에서 교대자성 특유의 마그논 분산과 카이랄성을 RIXS를 통해 직접 관측한 세계 첫 사례 중 하나입니다. st spectral broadening is strikingly different. Specifically, while SHG-CD is strongly suppressed by dissipation, THG-CD remains robust over a wide frequency range. We show that this qualitative difference originates from the phase structure of the nonlinear current, where SHG-CD arises from subleading interference processes that are sensitive to dephasing, whereas THG-CD emerges already at the leading nonlinear order and is therefore protected against spectral broadening. As a result, THG-CD provides a robust probe of chirality encoded in nonequilibrium electronic dynamics. We further reveal non-monotonic frequency dependences and pronounced sensitivity of harmonic emission to the polarization state and crystallographic orientation of the driving field. Our results provide a representative example of robust nonlinear chiroptical responses in chiral topological semimetals and highlight the potential of high-harmonic spectroscopy as a probe of phase-resolved electronic dynamics.", "tier": "B_IMPORTANT_CONDMAT", "score": "9", "reason": "High-harmonic circular dichroism study in the chiral topological semimetal CoSi, highly relevant to user's spectroscopic interests.; demoted from A: broad CM, not direct user/project hit", "tags": ["theory", "material", "topologicalsemimetal", "circulardichroism"], "image": "https://arxiv.org/html/2604.03983v2/fig_system.png", "briefing": {"background": "CoSi와 같은 카이랄 위상 준금속은 공간 반전 대칭성이 깨져 있으며, 독특한 밴드 토폴로지를 가집니다. 이러한 물질의 비선형 광학 응답(고조파 발생 등)은 전자 구조의 위상적 성질을 탐지하는 새로운 도구로 주목받고 있습니다.", "motivation": "카이랄 물질에서 2차 및 3차 고조파 발생(SHG, THG)의 원편광 이색성(CD)이 물질의 소산(dissipation)이나 산란에 얼마나 강건(robust)하게 유지되는지 이론적으로 규명하고자 했습니다.", "result": "SHG-CD는 산란(spectral broadening)에 의해 쉽게 억제되지만, THG-CD는 넓은 주파수 대역에서 매우 강건하게 유지됨을 발견했습니다. 이는 THG-CD가 비선형 전류의 주된 차수(leading order)에서 발생하기 때문임을 밝혔습니다.", "implication": "THG-CD를 통해 실험적으로 더 깨끗하고 신뢰할 수 있는 카이랄 위상 상태 측정이 가능해집니다. 특히 위상 정보가 비평형 전자 동역학에 어떻게 인코딩되는지 이해하는 길을 제시합니다.", "novelty": "고조파 차수에 따른 CD의 강건성 차이를 물리적 기원(비선형 전류의 위  in the temporal-continuum limit. For zero flavor chemical potential, the model realizes three-dimensional quantum electrodynamics (QED$_3$) which has been argued to describe the ground state and low-energy excitations of the Dirac spin liquid phase of quantum antiferromagnets. At finite flavor chemical potential, which corresponds to a Zeeman field perturbing the Dirac spin liquid, we find a \"chiral flux\" phase which is characterized by the generation of a finite mean emergent gauge flux and, accordingly, the formation of relativistic Landau levels for the Dirac fermions. We use field-theory arguments to argue that in this state a U(1)$_m$ magnetic symmetry is spontaneously broken, leading to a gapless photon mode. Because of spin-flux attachment this mode would contribute to the low-energy longitudinal spin response. We numerically compute longitudinal and transverse spin structure factors which match our continuum and lattice mean-field theory predictions. In a different region of the phase diagram, strong fluctuations of the emergent gauge field give rise to an antiferromagnetically ordered state with gapped Dirac fermions coexisting with a deconfined gauge field. We also find an interesting intermediate phase where the chiral flux phase and the antiferromagnetic phase coexist. We argue that our results pave the way to testable predictions for magnetized Dirac spin liquids in frustrated quantum antiferromagnets.", "tier": "B_IMPORTANT_CONDMAT", "score": "9", "reason": "Theory with testable predictions for magnetized U(1) Dirac spin liquids in quantum antiferromagnets.; demoted from A: broad CM, not direct user/project hit", "tags": ["theory", "Dirac", "spinliquid", "antiferromagnet", "topological", "magnetism"], "image": "https://arxiv.org/html/2508.08528v4/fig_lattice_model_phase_diagram.png", "briefing": {"background": "양자 스핀 액체(QSL)는 절대 영도에서도 자기적 질서를 갖지 않는 상호작용하는 스핀들의 상태입니다. 그 중 U(1) 디락 스핀 액체는 디락 페르미온과 게이지 장의 결합으로 설명되며, 좌절 자성체에서 중요한 연구 대상입니다.", "motivation": "외부 자기장(Zeeman field)이 디락 스핀 액체에 가해졌을 때 나타나는 창발적 현상과 그에 따른 상전이를 양자 몬테카를로 시뮬레이션을 통해 엄밀하게 조사하고자 했습니다.", "result": "자기장이 인가된 디락 스핀 액체에서 '카이랄 플럭스(chiral flux)' 상이 나타남을 확인했습니다. 이 상은 창발적 게이지 플럭스를 생성하며, 디락 페르미온을 위한 란다우 레벨을 형성하고 갭이 없는 광자 모드를 가집니다.", "implication": "좌절 자성체의 스핀 구조 요인(structure factor) 측정 시, 제안된 광자 모드나 란다우 레벨의 특징을 관측함으로써 디락 스핀 액체의 존재를 간접적으로 증명할 수 있는 실험적 지표를 제공합니다.", "novelty": "게이지 장과 페르미온의 결합 모델(QED3)에 화학 퍼텐셜을 도입하여 실제 자기장 환경을 모사하고, 이를 대규모 시뮬레이션으로 풀어낸 이론적 성과입니다. 독자의 관심사인 토폴로지컬 자성 및 스핀 액체와 관련이 깊습니다.", "unresolved": "이론적 모델에서 가정된 '혼합(mixed)' 게이지 장 구성이 실제 특정 물질의 해밀토니안과 얼마나 정확히 매칭될지는 추가 논의가 필요합니다.", "future_work": "중성자 산란 실험 등을 통한 자기장 하의 좌절 자성체에서의 스핀 구조 요인 비교 분석이 후속될 것으로 보입니다.", "concepts": [{"term": "Dirac Spin Liquid", "why_emerged": "강하게 얽힌 스핀 시스템에서 낮은 에너지 여기를 디락 페르미온으로 설명하기 위해 제안되었습니다.", "origin": "M. Hermele, T. Senthil, P.A. Lee 등에 의해 2000년대 중반 논의되었습니다.", "connections": "QED3, Kagome lattice, Quantum Spin Liquid"}, {"term": "Emergent Gauge Flux", "why_emerged": "입자 간의 복잡한 상관관계를 유효 필드 이론에서 가상의 자기장처럼 취급하여 단순화하기 위해 등장했습니다.", "origin": "분수 양자 홀 효과 및 게이지 이론 연구에서 유래했습니다.", "connections": "Flux attachment, Anyons"}, {"term": "Quantum Electrodynamics (QED3)", "why_emerged": "2+1차원에서 디락 페르미온과 게이지 장의 상호작용을 다루는 표준 모델로, 응집물질 물리에서 비페르미 액체 등을 설명할 때 사용됩니다.", "origin": "입자 물리학 이론을 고체 물리 시스템에 적용한 것입니다.", "connections": "Confinement, Chiral symmetry breaking"}, {"term": "Quantum Monte Carlo (QMC)", "why_emerged": "강상관 전자계의 다체 문제를 근사 없이(또는 통제된 오차 내에서) 수치적으로 풀기 위해 개발되었습니다.", "origin": "20세기 중반 몬테카를로 알고리즘의 발전과 함께 시작되었습니다.", "connections": "Determinant QMC, Sign problem"}], "english_summary": ["Large-scale QMC study of magnetized U(1) Dirac spin liquids via a mixed QED3 model.", "Discovery of a 'chiral flux' phase with emergent gauge flux and Landau levels under a Zeeman field.", "Spontaneous breaking of U(1) magnetic symmetry leads to a gapless photon mode.", "Provides testable spin structure factor predictions for frustrated magnets in magnetic fields."]}}, {"title": "Fermi surface and field-induced Lifshitz transition in the antiferromagnet NbMnP exhibiting an anomalous Hall effect", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2611.02360", "authors": "Taichi Terashima, Yuya Hattori, David Graf, et al.", "last_authors": "Ibuki Terada, Michi-To Suzuki", "summary": "We performed Shubnikov--de Haas (SdH) oscillation measurements on the $\\mathbf{Q}=0$ antiferromagnet NbMnP, which exhibits a large anomalous Hall effect. The SdH frequencies observed in the low-field region up to 17.5~T are well described by first-principles band-structure calculations based on the $B_{3g}+B_{2u}$ noncollinear magnetic structure determined by neutron diffraction. The effective masses are enhanced by approximately a factor of two relative to the calculated band masses. High-field measurements up to 41.5~T reveal a Lifshitz transition accompanied by a pronounced evolution of the SdH frequency spectrum. These results confirm that first-principles calculations provide a reliable tool for the development of functional antiferromagnetic materials, while also demonstrating that field-induced changes in the Fermi surface itself need to be taken into account in understanding their high-field magnetotransport properties.", "tier": "B_IMPORTANT_CONDMAT", "score": "9", "reason": "High relevance: anomalous Hall, antiferromagnetism, and direct Fermi surface study via SdH oscillations.", "tags": ["experimental", "Fermisurface", "anomalousHall", "antiferromagnet"], "image": "https://arxiv.org/html/2611.02360v1/KURO_RED_FvsAng_new.png", "briefing": {"background": "최근 비공선형(noncollinear) 자성 구조를 가진 반강자성체에서 나타나는 거대한 변칙 홀 효과(Anomalous Hall Effect, AHE)는 스핀트로닉스 분야에서 큰 관심을 받고 있습니다. 특히 NbMnP는 Q=0의 반강자성 상태를 가지면서도 강자성체와 유사한 수송 특성을 보여 그 전자 구조를 이해하는 것이 중요합니다.", "motivation": "NbMnP의 AHE 기원을 밝히기 위해 페르미 면(Fermi surface)의 형태와 자성 구조 간의 상관관계를 실험적으로 규명하고, 제1원리 계산 결과와 비교하여 실제 전자 구조를 확인하고자 했습니다.", "result": "Shubnikov-de Haas(SdH) 진동 측정을 통해 17.5T 이하 저자기장 영역의 진동수가 비공선형 자성 구조를 가정한 밴드 계산 결과와 잘 일치함을 확인했습니다. 유효 질량은 계산값보다 약 2배 정도 높게 나타났으며, 41.5T에 이르는 고자기장 측정에서는 페르미 면이 급격히 변화하는 립시츠 전이(Lifshitz transition)를 발견했습니다.", "implication": "제1원리 계산이 기능성 반강자성체 설계에 유용한 도구임을 입증함과 동시에, 고자기장 하에서의 수송 특성을 해석할 때 자기장에 의한 페르미 면의 변화를 반드시 고려해야 함을 시사합니다.", "novelty": "NbMnP에 대해 최초로 직접적인 페르미 면 맵핑을 수행했으며, 고자기장에서의 립시츠 전이를 관측하여 자성과 전자 구조의 밀접한 연관성을 보여주었습니다. 사용자 관심사인 AHE와 반강자성 전자 구조 연구에 직접적으로 부합하는 결과입니다.", "unresolved": "실험에서 관측된 유효 질량 증강(mass enhancement)의 정확한 물리적 기작(전자 상관관계 등)은 아직 더 연구가 필요합니다.", "future_work": "고자기장 영역에서의 밴드 구조 변화를 직접 확인하기 위한 강자기장 하 ARPES 실험이나 더 정밀한 수송 특성 분석이 기대됩니다.", "concepts": [{"term": "Anomalous Hall Effect (AHE)", "why_emerged": "강자성체에서 외부 자기장 없이도 발생하는 홀 효과를 설명하기 위해 도입되었습니다.", "origin": "Edwin Hall (1881)", "connections": "Berry curvature, Spin-orbit coupling, Topological materials"}, {"term": "Lifshitz transition", "why_emerged": "압력이나 자기장 등에 의해 페르미 면의 위상(topology)이 변하는 현상을 설명하기 위해 제안되었습니다.", "origin": "Ilya Lifshitz (1960)", "connections": "Fermi surface topology, Quantum phase transition"}, {"term": "Shubnikov-de Haas (SdH) oscillation", "why_emerged": "강한 자기장에서 전자의 란다우 준위 양자화에 따른 저항 진동을 통해 페르미 면 정보를 얻기 위해 사용됩니다.", "origin": "Lev Shubnikov, Wander de Haas (1930)", "connections": "Quantum oscillations, de Haas-van Alphen effect"}, {"term": "Noncollinear Antiferromagnet", "why_emerged": "스핀이 단순히 평행/반평행하지 않고 꼬인 구조를 가질 때 나타나는 독특한 위상 효과를 이해하기 위해 중요해졌습니다.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "Magnetic Weyl semimetals, Geometrical Hall effect"}], "english_summary": ["Observed SdH oscillations in the Q=0 antiferromagnet NbMnP up to 41.5 T.", "Fermi surface at low fields matches DFT calculations based on a noncollinear magnetic structure.", "Discovered a field-induced Lifshitz transition at high magnetic fields.", "Demonstrates that field-induced FS modifications are critical for understanding magnetotransport in functional AFMs."]}}, {"title": "Hidden variable Z2 topological order in a bilayer kagom\\'e antiferromagnet", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2611.03073", "authors": "Hao Tian, Pengwei Zhao, Gang v. Chen", "last_authors": "Pengwei Zhao, Gang v. Chen", "summary": "Topological orders in realistic systems are quite rare, raising one fundamental question of whether they might be harbored with hidden degrees of freedom rather than directly exposed in conventional spins or electrons. We here propose a set of hidden variables and their effective interactions in a bilayer kagom\\'e antiferromagnet. By properly organizing four local states of the spin dimer into two pseudospin-$1/2$ variables ($\\boldsymbol{\\tau}$ and $\\boldsymbol{\\mu}$), we identify a regime where an effective Balents-Fisher-Girvin model emerges, realizing a $\\mathbb{Z}_2$ topological order in the hidden $\\boldsymbol{\\tau}$ sector while the auxiliary $\\boldsymbol{\\mu}$ sector remains a trivial paramagnet. This hidden nature drastically alters the experimental manifestations. Physical spins map to composite objects, typically convolving fractionalized anyon continua with non-topological magnon excitations. Nevertheless, specific symmetry-selected channels, such as the longitudinal intralayer response, exclusively reveal the bare two-vison continuum without collective-mode dressing. Our findings demonstrate that the topological order could be buried in certain hidden and emergent degrees of freedom, pointing to a promising pathway for seeking elusive topological states disguised within hidden internal degrees of freedom.", "tier": "B_IMPORTANT_CONDMAT", "score": "9", "reason": "Directly addresses topological order and spectroscopic response in kagome systems, a top-tier user interest.; demoted from A: broad CM, not direct user/project hit", "tags": ["theory", "kagome", "topological-order"], "image": "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAsAAAAOCAYAAAD5YeaVAAAAAXNSR0IArs4c6QAAAAZiS0dEAP8A/wD/oL2nkwAAAAlwSFlzAAALEwAACxMBAJqcGAAAAAd0SU1FB9wKExQZLWTEaOUAAAAddE
