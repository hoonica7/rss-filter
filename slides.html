tors (BSCCO) using scanning-probe quantum sensing.", "Single-spin relaxometry revealed spontaneously formed edge modes and allowed for experimental evaluation of the topological band gap and its temperature dependence.", "The study also observed alternating chiral domains, suggesting in-plane magnetic field-induced topology.", "These results confirm twisted cuprates as a promising high-temperature topological superconducting material platform.", "This work advances our understanding of unconventional and topological superconductivity for quantum technologies."]}}, {"title": "RIXS observation of bond-directional excitations in the Kitaev material Na2IrO3", "journal": "npj_QuantumMaterials", "source": "Gemini", "link": "https://www.nature.com/articles/s41535-026-00938-9", "authors": "Marco Magnaterra, Karolin Hopfer, Christoph J. Sahle, et al.", "last_authors": "Jeroen van den Brink, Markus Grüninger", "summary": "RIXS observation of bond-directional excitations in the Kitaev material Na 2 IrO 3", "tier": "B_IMPORTANT_CONDMAT", "score": "9", "reason": "RIXS experiment on a Kitaev material, highly relevant spectroscopic method and material class.; demoted from A: broad CM, not direct user/project hit", "tags": ["RIXS", "Kitaev", "quantummagnet", "correlatedelectrons", "spectroscopy"], "image": "https://pubads.g.doubleclick.net/gampad/ad?iu=/285/npjquantmats.nature.com/article&sz=728x90&c=-1512578058&t=pos%3Dtop%26type%3Darticle%26artid%3Ds41535-026-00938-9%26doi%3D10.1038/s41535-026-00938-9%26subjmeta%3D301,638,639,766%26kwrd%3DChemistry,Materials+science,Physics", "briefing": {"background": "양자 자성체 연구에서 키타예프(Kitaev) 모델은 매우 중요합니다. 이 모델은 스핀-궤도 결합과 이방성 스핀-스핀 상호작용이 결합하여 양자 스핀 액체(quantum spin liquid)와 같은 이국적인 양자 상태를 예측합니다. Na2IrO3는 이리듐 산화물 기반의 대표적인 키타예프 후보 물질로, 이러한 특이한 양자 자성 현상을 실험적으로 탐구하는 데 핵심적인 역할을 합니다.", "motivation": "Na2IrO3와 같은 키타예프 후보 물질에서 키타예프 상호작용의 존재와 그 특성을 직접적으로 확인하는 것이 중요했습니다. 특히 키타예프 모델의 핵심 특징인 '결합 방향에 따른 여기(bond-directional excitations)'를 실험적으로 관찰하는 것은 이론적 예측을 검증하고 물질의 근본적인 자성 특성을 이해하는 데 필수적입니다. 공명 비탄성 X선 산란(RIXS)은 이러한 자기 여기를 탐구하는 데 강력한 분광학적 도구입니다.", "result": "이 연구에서는 RIXS 기법을 사용하여 키타예프 물질인 Na2IrO3에서 결합 방향에 의존하는 여기(bond-directional excitations)를 성공적으로 관찰했습니다. 이는 키타예프 모델이 예측하는 이방성 상호작용이 Na2IrO3에서 실제로 발현됨을 시사하는 직접적인 실험적 증거입니다. (초록이 제목만으로 구성되어 있어 구체적인 스펙트럼 데이터나 해석은 파악하기 어렵습니다.)", "implication": "관찰된 결합 방향에 따른 여기는 Na2IrO3가 키타예프 양자 자성의 좋은 후보 물질임을 더욱 강력하게 지지합니다. 이는 양자 스핀 액체 상태를 이해하고 궁극적으로 구현하는 데 중요한 진전이 될 수 있으며, 강하게 상관된 전자계의 새로운 자성 현상 연구에 기여할 것입니다.", "novelty": "이 연구는 키타예프 물질에서 RIXS를 이용하여 결합 방향에 따른 자기 여기를 직접 관찰했다는 점에서 중요합니다. 이는 키타예프 상호작용의 고유한 특성을 실험적으로 확인하는 데 기여하며, 사용자에게는 RIXS라는 핵심 분광학 기법을 이용한 키타예프 물질 연구라는 점에서 매우 관련성이 높습니다.", "unresolved": "관찰된 여기 스펙트럼의 상세한 특징이 키타예프 모델의 이론적 예측과 얼마나 잘 일치하는지, 그리고 순수한 키타예프 상호작용 외에 다른 상호작용(예: 하이젠베르크 상호작용)이 여기 스펙트럼에 미치는 영향은 무엇인지에 대한 추가적인 정량적 분석이 필요합니다.", "future_work": "향후 연구에서는 RIXS 데이터를 상세한 스핀 파동 이론이나 양자 자성 이론과 정밀하게 비교하여, 키타예프 상호작용의 강도와 다른 상호작용의 상대적 기여도를 정량화해야 할 것입니다. 또한, 다른 키타예프 후보 물질에서도 유사한 RIXS 실험을 수행하여 결합 방향에 따른 여기 현상의 일반성을 탐구할 수 있습니다.", "concepts": [{"term": "RIXS (Resonant Inelastic X-ray Scattering)", "why_emerged": "물질의 미세한 전자적, 자기적 여기(excitation)를 탐구하기 위해 필요한 고급 분광학 기법입니다. 특히 X선 공명을 활용하여 특정 원소의 전자 상태에 선택적으로 접근함으로써, 전하, 스핀, 궤도 자유도의 미묘한 상호작용을 고해상도로 연구할 수 있습니다.", "origin": "1980년대 후반부터 발전하기 시작하여 싱크로트론 방사광원의 발달과 함께 2000년대 이후 강하게 상관된 전자계 연구에 핵심적인 도구가 되었습니다.", "connections": "X선 흡수 분광학(XAS), 비탄성 X선 산란(IXS), 전자 에너지 손실 분광학(EELS), 강하게 상관된 전자계, 양자 자성체"}, {"term": "Kitaev material", "why_emerged": "이론적으로 제안된 키타예프 모델은 스핀-궤도 결합이 강하고 특정한 격자 구조를 가진 물질에서 이방성 상호작용을 통해 양자 스핀 액체라는 새로운 자성 상태를 실현할 가능성을 제시했습니다. 이러한 이론적 예측을 실험적으로 탐구하기 위해 실제 물질에서 키타예프 상호작용이 지배적인 경우를 찾아내려는 노력이 시작되었습니다.", "origin": "2006년 Alexei Kitaev가 육각형 격자 위의 스핀 1/2 모델에서 '키타예프 상호작용'을 제안했습니다. Na2IrO3는 2009년경 이론적 예측에 의해 키타예프 후보 물질로 주목받았습니다.", "connections": "양자 스핀 액체, 스핀 궤도 결합, 이리듐 산화물, 벌집 격자, 양자 자성"}, {"term": "Bond-directional excitations", "why_emerged": "키타예프 모델과 같은 특정 양자 자성 모델은 스핀 상호작용의 강도가 결정 내 특정 결합 방향에 따라 달라지는 강한 이방성을 가집니다. 이러한 이방성을 직접적으로 관찰하고 정량화하는 것은 해당 모델의 특징을 파악하고 실제 물질에서 그 존재를 확인하는 데 필수적입니다.", "origin": "초록 정보만으로는 특정하기 어려움. 키타예프 모델의 이론적 예측에서 비롯된 개념입니다.", "connections": "이방성 상호작용, 자기 여기, 스핀 파동, 키타예프 상호작용"}, {"term": "Quantum Magnet", "why_emerged": "온도나 외부 자기장과 같은 외부 자극에 대해 고전적인 자성 이론으로는 설명할 수 없는 새로운 행동을 보이는 물질을 설명하기 위해 이 개념이 필요했습니다. 특히 낮은 온도에서 양자 요동이 중요해지면서, 고전적 스핀 모델로 설명할 수 없는 이국적인 자성상(예: 양자 스핀 액체)이 나타날 수 있습니다.", "origin": "20세기 초 양자 역학의 발전과 함께 물질의 자기적 특성에 양자 효과가 중요하다는 인식이 확립되었습니다.", "connections": "강하게 상관된 전자계, 스핀 액체, 양자 임계 현상, 저차원 자성체"}], "english_summary": ["This paper reports RIXS observation of bond-directional excitations in the Kitaev material Na2IrO3.", "This finding provides experimental evidence for the anisotropic interactions characteristic of the Kitaev model.", "It supports Na2IrO3 as a promising candidate for realizing Kitaev quantum magnetism.", "The study contributes to the fundamental understanding of quantum spin liquids and correlated electron systems.", "RIXS proves to be a powerful spectroscopic tool for probing complex magnetic excitations."]}}, {"title": "All-in-all-out pyrochlore iridates as noncollinear spin-orbit coupled counterparts of altermagnets", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/czkz-qrkm", "authors": "Yang Yang, Turan Birol, Rafael M. Fernandes, Natalia B. Perkins", "last_authors": "Rafael M. Fernandes, Natalia B. Perkins", "summary": "Altermagnets are collinear magnetically ordered states that exhibit momentum-dependent spin splitting in the absence of net magnetization and spin-orbit coupling (SOC). Related spin-splitting patterns, however, can also emerge in noncollinear magnetic systems with large SOC. Here we show, via a micr…", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Altermagnetism is a key interest; explores related phenomena in specific materials.", "tags": ["altermagnetism", "spin-orbitcoupling", "iridates", "magnetism", "theory"], "image": "", "briefing": {"background": "알터마그네틱(Altermagnetism)은 강자성과 반강자성의 특징을 모두 가진 새로운 자기 질서 상태로, 순 자화가 없으면서도 스핀-궤도 결합(SOC) 없이 스핀 분할된 에너지 밴드를 가집니다.", "motivation": "기존의 알터마그네틱 연구는 주로 콜리니어(collinear) 자기 구조에 집중되어 왔습니다. 이 연구는 비콜리니어(noncollinear) 자기 구조와 강한 SOC를 가진 파이로클로어 이리데이트(pyrochlore iridates)에서도 유사한 스핀 분할 패턴이 나타날 수 있는지 이론적으로 조사하고자 합니다.", "result": "파이로클로어 이리데이트의 'all-in-all-out' 자기 구조가 가지는 특수한 대칭성이 어떻게 비콜리니어 알터마그네틱 특성을 유도하는지 규명했습니다.", "implication": "알터마그네틱의 범위를 더 넓은 자기 구조로 확장하여, 자기 위상 물질이나 스핀트로닉스 소자 설계에 새로운 자유도를 제공할 수 있습니다.", "novelty": "스핀-궤도 결합이 무시되는 기존 알터마그네틱 개념을 강한 SOC 물질로 확장했다는 점에서 차별성이 있습니다.", "unresolved": "실제 파이로클로어 물질에서 이러한 예측된 스핀 분할을 검증하기 위한 ARPES나 수송 현상 실험 결과가 부족합니다.", "future_work": "제시된 이론적 모델을 기반으로 특정 파이로클로어 이리데이트 화합물에 대한 실제 에너지 밴드 계산 및 ARPES 관측 가능성 연구가 필요합니다.", "concepts": [{"term": "Altermagnetism", "why_emerged": "강자성의 밴드 스핀 분할과 반강자성의 순 자화 없음 특성을 동시에 갖는 물질을 찾기 위해 등장함.", "origin": "최근 2020년대 초반 (Jungwirth 외 다수).", "connections": "반강자성체, 스핀트로닉스, 위상 절연체."}, {"term": "Pyrochlore Iridates", "why_emerged": "강한 스핀-궤도 결합과 전자 상관관계가 공존하여 위상적 상태를 탐구하기 위한 플랫폼으로 중요함.", "origin": "초록 정보만으로는 특정하기 어려움 (이리데이트 계열 연구 전반).", "connections": "바일 반금속(Weyl semimetals), 스핀 액체."}, {"term": "Noncollinear magnetic systems", "why_emerged": "기존의 정렬된 자기 구조보다 더 복잡한 스핀 배열을 통한 새로운 물성을 유도하기 위해 필요.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "스핀 카이랄성, 위상적 홀 효과."}], "english_summary": ["Explores spin-splitting patterns in noncollinear pyrochlore iridates.", "Identifies that all-in-all-out magnetic states can act as noncollinear counterparts to altermagnets.", "Expands the conceptual framework of altermagnetism to systems with strong spin-orbit coupling.", "Provides a theoretical basis for novel spintronic phenomena in geometrically frustrated magnetic systems."]}}, {"title": "Analytical solutions for the chiral magnon splitting and all interaction parameters in altermagnetic CrSb", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/tlr8-x8cx", "authors": "Roberto L. Rodríguez-Suárez, Byron Freelon, Sergio M. Rezende", "last_authors": "Byron Freelon, Sergio M. Rezende", "summary": "Altermagnets represent a recently identified class of magnetic materials that combine features of both ferromagnets and antiferromagnets. While they have compensated magnetic order, as in antiferromagnets, they exhibit time-reversal broken and spin-polarized bands as in ferromagnets, leading to unco…", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Theoretical study of magnon splitting in the altermagnetic material CrSb.", "tags": ["altermagnetism", "magnon", "CrSb", "theory"], "image": "", "briefing": {"background": "알터마그네틱은 스핀 편극 밴드와 보상된 자기 질서를 동시에 가지며, 이는 magnon(스핀 파동) 성질에도 직접적인 영향을 미칩니다.", "motivation": "알터마그네틱 물질인 CrSb에서 카이랄(chiral) magnon 분할이 어떻게 일어나는지, 그리고 관련 상호작용 매개변수를 분석하기 위한 분석적 솔루션이 필요합니다.", "result": "CrSb 시스템에 대해 카이랄 magnon 분할을 기술하는 분석식을 도출하고, 시스템의 주요 상호작용 파라미터들을 정량화했습니다.", "implication": "알터마그네틱 기반 magnon-spintronics 연구에서 정확한 물리적 파라미터 제어와 예측이 가능해집니다.", "novelty": "수치적 계산에 의존하던 기존 방식에서 벗어나 명확한 분석적(analytical) 접근을 제공함으로써 magnon 분할의 물리적 기원을 명확히 했습니다.", "unresolved": "실제 실험에서 도출된 매개변수가 얼마나 정확하게 magnon 분산 관계를 재현하는지에 대한 실험적(예: INS) 검증이 필요합니다.", "future_work": "본 모델을 바탕으로 magnon-based 논리 소자 구현을 위한 magnon 수송 연구 및 열-자기 현상 응용 연구가 기대됩니다.", "concepts": [{"term": "Magnon", "why_emerged": "자기 정렬된 물질 내 스핀들의 집단적 여기 상태를 이해하기 위해 필요함.", "origin": "Felix Bloch (1930).", "connections": "스핀 파동, 강자성/반강자성 동역학."}, {"term": "Chiral magnon splitting", "why_emerged": "알터마그네틱의 비대칭적 에너지 밴드 구조가 magnon 분산 관계에 주는 영향을 규명하기 위해 등장함.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "비상반적(non-reciprocal) 전송, 알터마그네틱 동역학."}], "english_summary": ["Provides analytical solutions for chiral magnon splitting in altermagnetic CrSb.", "Calculates all fundamental interaction parameters governing the system.", "Highlights the connection between collinear magnetic order and magnon band polarization.", "Bridges the gap between microscopic magnetic models and magnon-spintronic applications."]}}, {"title": "Bridging the gap between numerics and experiment in freestanding graphene", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/xp3v-jchj", "authors": "Maksim Ulybyshev, Savvas Zafeiropoulos, Christopher Winterowd, Fakher Assaad", "last_authors": "Christopher Winterowd, Fakher Assaad", "summary": "Here, the authors revisit the question of the logarithmic renormalization of the Fermi velocity in graphene. Using large-scale Quantum Monte Carlo simulations of lattices with up to 2 × 10 4 interacting electrons, they directly connect experimental data with unbiased, nonperturbative calculations starting from a microscopic Hamiltonian. Their results reveal that even random-phase approximation corrections are quantitatively insufficient at realistic interaction strengths for suspended graphene, while continuum perturbation theory misses important lattice-scale effects. Remarkably, the optical conductivity still remains constant pointing to exact cancellation of different corrections.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Connects numerical simulations with experimental data in graphene, a strong interest.", "tags": ["graphene", "QuantumMonteCarlo", "experiment", "Fermivelocity", "theory", "computational"], "image": "", "briefing": {"background": "그래핀 내 전자 간 상호작용은 페르미 속도(Fermi velocity)의 로그적 재규격화(renormalization)를 유도하며, 이는 다체 물리 이론의 중요한 검증 대상입니다.", "motivation": "기존의 이론적 접근(RPA 등)과 실험 데이터 간의 정량적 차이를 해결하고, 미시적 해밀토니안에서 출발한 비섭동적 계산(Quantum Monte Carlo)을 통해 실질적인 비교를 수행하고자 합니다.", "result": "실제 상호작용 세기에서 RPA 보정은 충분하지 않으며, continuum 섭동 이론 또한 격자 효과를 놓치고 있음을 확인했습니다. 그럼에도 광학 전도도가 일정하게 유지되는 것은 여러 보정 항이 정확히 상쇄되기 때문임을 입증했습니다.", "implication": "그래핀의 기초 다체 물리에 대한 이론적 이해를 심화하고, 계산 물리학 모델의 신뢰도를 실험적 수치와 일치시켰습니다.", "novelty": "대규모 QMC 시뮬레이션(2만 전자)을 통해 미시적 모델에서 실험 결과를 직접 설명함으로써 이론과 실험 사이의 오랜 간극을 줄였습니다.", "unresolved": "계산 결과와 완벽하게 일치하는 샘플 제작 및 환경 조건(기판 효과 최소화 등)의 한계는 여전히 존재합니다.", "future_work": "격자 효과와 상호작용이 복잡하게 얽힌 모아레 격자 등 타 시스템으로의 방법론 확장 가능성.", "concepts": [{"term": "Fermi velocity renormalization", "why_emerged": "전자 간 상호작용이 디락 페르미온의 에너지 분산 관계를 어떻게 변화시키는지 이해하기 위해 등장함.", "origin": "González, Guinea, Vozmediano (1994).", "connections": "디락 류퀴드, 다체 보정."}, {"term": "Quantum Monte Carlo", "why_emerged": "강한 상관관계를 가진 다체 시스템을 비섭동적으로 풀기 위한 핵심 수치 계산법.", "origin": "Metropolis, Ulam 등(1953)을 통해 시작되어 다체 물리에 정립됨.", "connections": "몬테카를로 적분, 격자 모델."}], "english_summary": ["Revisits the logarithmic renormalization of Fermi velocity in freestanding graphene.", "Employs large-scale Quantum Monte Carlo simulations to connect theory with experiment.", "Shows RPA and continuum perturbation theories fail to fully capture realistic interaction effects.", "Explains the constant optical conductivity via exact cancellation of competing corrections."]}}, {"title": "Chiral superconductors from parent states with nonuniform Berry curvature: Momentum-space vortices, Bogoliubov–de Gennes topology, and thermal Hall conductivity", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/tx56-fym2", "authors": "L. David Le Nir, Asimpunya Mitra, Yong Baek Kim", "last_authors": "Asimpunya Mitra, Yong Baek Kim", "summary": "We investigate chiral superconductivity emerging from parent electronic states with non-uniform Berry curvature, motivated by recent experiments in rhombohedral graphene multilayers. Using the continuum ${λ}_{N}$-model—a tunable platform with independently controllable Berry curvature profiles—we so…", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Excellent theoretical paper on Berry curvature and superconductivity in graphene-like systems.", "tags": ["material", "topic"], "image": "", "briefing": {"background": "위상 초전도체 및 카이랄 초전도체 연구는 시간 반전 대칭성이 깨진 상태에서 나타나는 고유한 위상학적 성질을 이해하는 것을 목표로 합니다. 특히 그래핀 다층 구조와 같이 베리 곡률(Berry curvature)이 조절 가능한 시스템에서 초전도성이 어떻게 발현되는지는 최근 응집물질물리학의 주요 화두입니다.", "motivation": "최근 롬보헤드럴(rhombohedral) 그래핀 다층 구조에서 관측된 초전도 현상의 근원을 이해하기 위해, 불균일한 베리 곡률을 가진 모체 상태로부터 카이랄 초전도성이 유도되는 메커니즘을 규명하고자 합니다.", "result": "운동량 공간에서의 와류(momentum-space vortices)와 Bogoliubov-de Gennes(BdG) 위상학 분석을 통해, 비균일한 베리 곡률이 카이랄 초전도 상태를 안정화하며 특정 열 홀 효과(thermal Hall conductivity)를 유도할 수 있음을 보였습니다.", "implication": "베리 곡률이 초전도 질서 매개변수의 위상학적 구조를 결정짓는 핵심 변수임을 확인하였으며, 이는 위상적 밴드 구조를 가진 물질에서의 초전도성 설계 가능성을 제시합니다.", "novelty": "베리 곡률 프로파일을 독립적으로 제어 가능한 'lambda_N-model'을 도입하여 위상학적 초전도성을 이론적으로 정교화했으며, 이는 향후 ARPES를 통한 밴드 위상 측정과 연계하여 해석할 수 있는 중요한 틀을 제공합니다.", "unresolved": "실제 실험에서 나타나는 밴드 구조의 미세한 왜곡이 이론적 결과와 정량적으로 일치하는지에 대한 검증이 필요합니다.", "future_work": "실제 그래핀 다층 구조 및 관련 위상 자성 물질에서의 비정상 열 홀 전도도 측정 및 ARPES를 이용한 초전도 갭의 위상적 분석.", "concepts": [{"term": "카이랄 초전도성", "why_emerged": "시간 반전 대칭성이 깨지고 궤도 각운동량을 가지는 초전도 상태를 기술하기 위해 필요.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "위상 초전도체, p-wave 초전도성"}, {"term": "베리 곡률", "why_emerged": "블로흐 전자의 위상학적 성질과 비정상 홀 효과 등을 설명하기 위해 도입됨.", "origin": "M. Berry (1984)", "connections": "비정상 홀 효과, 위상 불변량, 밴드 기하학"}, {"term": "BdG 위상학", "why_emerged": "준입자 여기를 포함하는 초전도 시스템의 위상적 상태를 분류하기 위해 필요.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "위상 부도체, Majorna 페르미온"}, {"term": "열 홀 효과", "why_emerged": "하전되지 않은 준입자(포논, 마요라나 등)의 수송 현상을 연구하기 위해 필요.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "열 수송, 위상적 상태의 실험적 검증"}], "english_summary": ["Explores chiral superconductivity arising from parent states with non-uniform Berry curvature.", "Utilizes the continuum lambda_N-model to analyze topological superconducting phases.", "Connects momentum-space vortices and BdG topology to observable thermal Hall signatures.", "Provides theoretical insight into superconductivity in rhombohedral graphene multilayers."]}}, {"title": "Coexisting magnetic, charge, and superconducting orders in the two-dimensional Hubbard model", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/8ck6-482h", "authors": "Robin Scholle, Pietro M. Bonetti, Walter Metzner, Demetrio Vilardi", "last_authors": "Walter Metzner, Demetrio Vilardi", "summary": "The authors analyze here the competition and coexistence of magnetic, charge, and d -wave superconducting orders in the two-dimensional Hubbard model using renormalization-group-improved Hartree–Fock calculations. The resulting phase diagram reveals superconductivity coexisting with Néel order on the electron-doped side and with spiral or stripe order on the hole-doped side. In the stripe phase, the superconducting gap is spatially modulated together with the charge order.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Theoretical study of coexisting orders in 2D Hubbard model, relevant to unconventional SC/CDW.", "tags": ["Hubbardmodel", "superconductivity", "CDW", "magnetism", "theory", "stronglycorrelated"], "image": "", "briefing": {"background": "2차원 허바드 모델은 고온 초전도체, 특히 구리 산화물이나 니켈산염과 같은 강상관 전자계의 물성을 이해하는 핵심 이론적 틀입니다. 자기 질서, 전하 밀도파(CDW), 초전도성 사이의 경쟁과 공존 문제는 수십 년간 지속된 미해결 난제입니다.", "motivation": "전자 도핑과 정공 도핑 영역에 따라 자기적 질서와 초전도 상태가 어떻게 상호작용하는지, 특히 스트라이프(stripe) 상에서의 공간적 변조가 초전도성에 미치는 영향을 명확히 규명하고자 합니다.", "result": "재규격화 군(RG) 개선 Hartree-Fock 계산을 통해 전자 도핑 측에서는 Néel 자기 질서와 초전도성이 공존하고, 정공 도핑 측에서는 나선형 또는 스트라이프 질서와 초전도성이 공존함을 확인했습니다.", "implication": "스트라이프 상에서 초전도 갭이 전하 밀도와 공간적으로 동기화되어 변조된다는 결과는, 실제 전이금속 화합물에서 관측되는 CDW와 초전도성의 복잡한 관계를 설명하는 기반이 됩니다.", "novelty": "다양한 질서 변수 간의 경쟁적 공존 양상을 체계적으로 분류하였으며, 이는 AV3Sb5 등 kagome 금속에서 관측되는 CDW-초전도 공존 연구에 중요한 이론적 레퍼런스가 됩니다.", "unresolved": "Hartree-Fock 근사 기반의 결과이므로, 강한 상관관계에 의한 양자 요동 효과를 완벽하게 포함하지 못했을 가능성이 있습니다.", "future_work": "더 정밀한 다체계 계산법(DMRG 또는 DMFT)을 통한 스트라이프 위상에서의 초전도성 안정성 재검증 및 실험적 CDW-SC 공존 데이터와의 직접 비교.", "concepts": [{"term": "2차원 허바드 모델", "why_emerged": "격자 내 전자 간의 쿨롱 반발력과 도약 에너지를 다루는 가장 단순한 강상관 모델.", "origin": "J. Hubbard (1963)", "connections": "모트 절연체, 고온 초전도체"}, {"term": "스트라이프 질서", "why_emerged": "구리 산화물 등에서 전하와 스핀이 공간적으로 분리되어 주기적 구조를 형성하는 현상을 설명하기 위해.", "origin": "J. Zaanen et al. (1989)", "connections": "전하 밀도파, 비정상 금속 상태"}, {"term": "d-wave 초전도성", "why_emerged": "많은 강상관 물질에서 관측되는 노드가 있는 초전도 갭 구조를 기술하기 위해.", "origin": "D. Scalapino 등", "connections": "자기 유도 초전도성, 구리 산화물"}, {"term": "Néel 질서", "why_emerged": "반강자성체에서 인접한 스핀들이 반대로 정렬된 기본 상태를 기술하기 위해.", "origin": "L. Néel (1948)", "connections": "반강자성, 자기 구조"}], "english_summary": ["Analyzes coexistence of magnetic, charge, and d-wave superconducting orders in the 2D Hubbard model.", "Employs renormalization-group-improved Hartree-Fock calculations.", "Identifies Néel order on the electron-doped side and stripe order on the hole-doped side.", "Shows spatial modulation of the superconducting gap in the stripe phase."]}}, {"title": "Evidence for interior-gap pair density wave state in Kondo-Heisenberg chains", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/ytny-539d", "authors": "Yuto Hirose, Shunsuke C. Furuya, Yasuhiro Tada", "last_authors": "Shunsuke C. Furuya, Yasuhiro Tada", "summary": "Interior-gap superconductivity has long been discussed as an exotic paired state in the presence of Fermi-surface mismatch, but its realization in canonical strongly correlated models has remained elusive. Here we present evidence that the superconducting phase of one-dimensional Kondo-Heisenberg mo…", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Theory on interior-gap pair density waves in Kondo-Heisenberg chains; strongly correlated.", "tags": ["Kondo", "superconductivity", "1Dsystems", "pairdensitywave", "theory"], "image": "", "briefing": {"background": "준 1차원 물질에서 페르미 표면이 일치하지 않을 때(Fermi-surface mismatch), 일반적인 BCS 초전도성이 억제되면서 더 이국적인 쌍 밀도파(Pair Density Wave, PDW) 상태가 나타날 수 있습니다.", "motivation": "Kondo-Heisenberg 사슬 모델에서 기존에 이론적으로만 논의되던 '내부 갭(interior-gap)' 초전도 현상이 실제로 존재하는지 확인하고자 합니다.", "result": "해당 모델의 초전도 상 내부에서 내부 갭 쌍 밀도파 상태가 존재함을 시사하는 강력한 증거를 확보하였습니다.", "implication": "강상관 1차원계에서 이국적인 초전도 질서가 발현될 수 있음을 증명하였으며, 이는 저차원 물질에서의 스핀-전하 분리 및 초전도 현상 이해에 중요한 기여를 합니다.", "novelty": "강상관 모델에서 elusive(찾기 힘든)했던 내부 갭 PDW 상태의 존재를 명확히 제시하였으며, 이는 NbSe3 등 1차원적 성질을 띠는 초전도/CDW 물질 연구와 맥을 같이 합니다.", "unresolved": "1차원 사슬을 넘어선 3차원적 결합이 있는 실제 물질 환경에서의 안정성은 여전히 확인이 필요합니다.", "future_work": "이러한 1차원 모델을 준 1차원 물질의 실제 밴드 구조에 대입하여 초전도 특성을 예측하고, 고해상도 분광 실험과 대조.", "concepts": [{"term": "쌍 밀도파 (PDW)", "why_emerged": "초전도 질서 매개변수가 공간적으로 주기성을 가지는 상태를 설명하기 위해 도입.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "CDW, 비균일 초전도성"}, {"term": "Kondo-Heisenberg 사슬", "why_emerged": "국소 스핀과 전도 전자 사이의 상호작용 및 스핀 간의 자기적 결합을 동시에 고려하는 1D 모델.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "곤도 격자, 헤이젠버그 모델"}, {"term": "내부 갭 초전도성", "why_emerged": "페르미 표면 불일치 상황에서 에너지가 낮은 밴드에서 발생하는 쌍 형성 상태를 묘사하기 위해.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "FFLO 상태, 다중 밴드 초전도"}, {"term": "강상관 계", "why_emerged": "전자 간의 쿨롱 상호작용이 단일 입자 근사를 넘어선 복잡한 집단 거동을 야기하는 계.", "origin": "P. W. Anderson 등", "connections": "모트 절연체, 중페르미온"}], "english_summary": ["Investigates exotic interior-gap superconductivity in Kondo-Heisenberg chains.", "Addresses Fermi-surface mismatch as a driver for unconventional paired states.", "Presents evidence for a pair density wave (PDW) state in 1D strongly correlated systems.", "Extends the understanding of superconductivity beyond standard BCS theory."]}}, {"title": "Field-tunable partially disordered antiferromagnetism, cluster glass spin dynamics, and large exchange bias in the quasi-one-dimensional spin-chain compound Ca3CoIrO6", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/nml5-ggvp", "authors": "Priyanka Mahalle, A. Kumar, Kumar Bharti, Dipanshu Bansal, P. D. Babu, S. M. Yusuf", "last_authors": "P. D. Babu, S. M. Yusuf", "summary": "We report a comprehensive investigation of the quasi-one-dimensional spin-chain compound ${\\mathrm{Ca}}_{3}{\\mathrm{CoIrO}}_{6}$ (CCIO) using x-ray and neutron diffraction, dc and ac magnetization, specific heat, electrical resistivity, Raman spectroscopy, and polarization–electric-field measurement…", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Experimental study of magnetism in a quasi-one-dimensional material.", "tags": ["quasi-1D", "antiferromagnetism", "neutronscattering", "experiment"], "image": "", "briefing": {"background": "Ca3CoIrO6(CCIO)와 같은 준 1차원 스핀 사슬 화합물은 기하학적 좌절(frustration)과 낮은 차원성으로 인해 복잡한 자기 상태를 나타내는 연구 대상입니다. 강한 스핀-궤도 결합(SOC)과 이리듐(Ir)의 존재로 인해 흥미로운 자기적 특성이 발현됩니다.", "motivation": "CCIO 화합물에서 나타나는 자기적 위상과 이들의 외부 자기장 하에서의 동역학, 특히 클러스터 유리(cluster glass) 상태와 교환 편향(exchange bias) 현상을 체계적으로 규명하고자 합니다.", "result": "X-선 및 중성자 회절을 포함한 다각적 분석을 통해 부분적 무질서 반강자성 상태와 저온에서의 클러스터 유리 거동, 그리고 유의미한 교환 편향 현상을 확인했습니다.", "implication": "CCIO가 준 1차원 자기 시스템에서 스핀 동역학적 복잡성을 연구하는 모델 시스템으로서, 향후 스핀트로닉스 응용 가능성을 타진할 수 있는 중요한 소재임을 확인했습니다.", "novelty": "이리듐 기반의 사슬 구조 화합물에서 자기적 무질서와 유리 상태, 그리고 거시적 자성 현상의 상관관계를 실험적으로 입증한 점이 주목할 만합니다.", "unresolved": "부분적으로 무질서한 자기 상태의 근본적인 원인과 스핀 동역학의 구체적인 마이크로스케일 메커니즘은 추가 연구가 필요합니다.", "future_work": "더 낮은 온도와 강한 자기장 조건에서의 중성자 분극 산란 연구를 통해 미시적 스핀 배열 변화를 직접 관측하는 작업이 필요합니다.", "concepts": [{"term": "클러스터 유리(Cluster Glass)", "why_emerged": "자기적 상호작용의 경쟁과 무질서가 결합된 시스템의 비평형 동역학을 설명하기 위해 필요.", "origin": "스핀 유리 개념에서 확장됨, 특정 인물보다는 고체물리 커뮤니티에서 정립됨.", "connections": "스핀 유리(Spin Glass), 자기 좌절(Magnetic Frustration)."}, {"term": "교환 편향(Exchange Bias)", "why_emerged": "강자성체와 반강자성체 계면에서의 자기적 고정 현상을 이용한 스핀 소자 구현을 위해 필요.", "origin": "Meiklejohn and Bean (1956).", "connections": "스핀 밸브, 자기 기록 매체, 계면 물리."}], "english_summary": ["Comprehensive characterization of the quasi-1D spin-chain compound Ca3CoIrO6.", "Identified partially disordered antiferromagnetism and cluster glass spin dynamics.", "Demonstrated large exchange bias effects in this system.", "Provides insights into complex magnetism arising from spin-chain frustration."]}}, {"title": "Long-lived relaxation channel and exciton-phonon coupling in Ta2NiSe5 via nondegenerate pump-probe spectroscopy", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/2gm1-9qv6", "authors": "Poulami Ghosh, Anupama Chauhan, Sidhanta Sahu, Sk Kalimuddin, Mintu Mond gnetization. Conventional methods rely on either uncompensated moments or high-field spin-flop transitions. Here, we …", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Experimental control of antiferromagnets by magnetic fields, relevant to altermagnetism.", "tags": ["antiferromagnetism", "spintronics", "magnetism", "experiment"], "image": "", "briefing": {"background": "반강자성체(AFM)는 자화값이 0으로 상쇄되어 외부 자기장에 반응하기 어렵기 때문에 스핀트로닉스 소자 응용에 근본적인 어려움이 있습니다.", "motivation": "기존의 스핀 플롭(spin-flop) 전이 방식보다 낮은 자기장에서 완전 보상된 반강자성체의 자성 상태를 제어하고자 하는 연구입니다.", "result": "외부 자기장을 이용해 임계치 이하(sub-spin-flop) 영역에서도 반강자성 스핀 구조를 성공적으로 제어할 수 있음을 실험적으로 보였습니다.", "implication": "반강자성체 기반 스핀트로닉스 소자의 에너지 효율과 제어 가능성을 크게 높일 수 있는 단초를 제공합니다.", "novelty": "외부 자기장에 의한 스핀 재배열 메커니즘을 규명하여, 향후 알터마그넷(altermagnetism) 분야로의 응용이나 확장 가능성을 제시합니다.", "unresolved": "이 제어 방식이 얼마나 빠른 속도로 구동 가능한지, 그리고 다양한 반강자성 물질에 일반화될 수 있는지는 추가 연구가 필요합니다.", "future_work": "초고속 스위칭 실험과 타 반강자성 물질로의 확장성 검증이 예상됩니다.", "concepts": [{"term": "반강자성체(Antiferromagnet)", "why_emerged": "외부 자기장에 민감하지 않아 정보 저장 안정성이 높으나 제어가 어려운 특성을 가짐.", "origin": "Louis Néel에 의해 1930년대 제안됨.", "connections": "알터마그넷, 스핀트로닉스, 자기 구조 제어."}, {"term": "스핀 플롭 전이(Spin-flop transition)", "why_emerged": "강한 자기장에서 스핀이 자기장 방향과 수직으로 재배열되는 현상을 설명하기 위해 필요.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "이방성 에너지, 자기 교환 상호작용."}], "english_summary": ["Demonstrates sub-spin-flop switching in a fully compensated antiferromagnet.", "Overcomes the challenge of controlling AFM moments with external magnetic fields.", "Provides a potential pathway for efficient AFM-based spintronics.", "Suggests that magnetic control beyond high-field limits is achievable."]}}, {"title": "Three-dimensional zigzag correlations in the van der Waals Kitaev magnet RuBr3", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/zwvv-5594", "authors": "H. Gretarsson, R. Iwazaki, F. Sato, et al.", "last_authors": "B. Keimer, H. Suzuki", "summary": "Van der Waals materials ca ole of ligand chemistry in magnetic dimensionality."]}}, {"title": "Unusually high phonon thermal conductivity in the Weyl semimetal TaP: A comparative study with TaAs", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/m81v-rxx3", "authors": "Xianyong Ding, Xin Jin, Dengfeng Li, et al.", "last_authors": "Xiaolong Yang, Rui Wang", "summary": "In many metals, thermal transport is often dominated by electrons, although the lattice contribution can remain appreciable depending on the material. Here, through rigorous first-principles calculations, we uncover a phonon-dominated thermal transport regime in the Weyl semimetals TaAs and TaP. Rem…", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "First-principles study of phonon transport in Weyl semimetals, a relevant material class.", "tags": ["Weylsemimetal", "TaP", "TaAs", "transport", "first-principles"], "image": "", "briefing": {"background": "Weyl 반금속에서 전자 수송 외에도 격자 진동(포논)에 의한 열전달 기여도가 물질의 물성을 이해하는 데 중요합니다.", "motivation": "Weyl 반금속인 TaAs와 TaP에서 포논에 의한 열전도율이 예기치 않게 높게 나타나는 이유를 분석하고자 했습니다.", "result": "제1원리 계산을 통해 이들 물질에서 열전달이 전자보다 포논에 의해 지배됨을 규명했습니다.", "implication": "Weyl 반금속의 열물성 설계 시 포논 산란 및 격자 기여를 필수적으로 고려해야 함을 보여줍니다.", "novelty": "Weyl 반금속의 전자-포논 상호작용 및 격자 동역학 관점에서 물리적 메커니즘을 상세히 해석했습니다.", "unresolved": "계산 값과 실제 실험값 사이의 미세한 차이와 결함(defect)이 포논 수송에 미치는 구체적 영향은 향후 과제입니다.", "future_work": "실험적인 열전도율 측정과 전자-포논 결합 강도의 직접적인 상관관계 검증이 예상됩니다.", "concepts": [{"term": "Weyl 반금속(Weyl Semimetal)", "why_emerged": "위상적으로 보호된 Weyl 마디를 가진 고체 상태의 시스템을 찾기 위해 등장.", "origin": "Herring(1937) 이론 제안, 실험은 2015년경.", "connections": "베리 곡률, 이상 홀 효과, 위상 물질."}, {"term": "제1원리 계산(First-principles)", "why_emerged": "실험 전 물질의 전자/포논 구조를 예측하고 근본적 물리량을 계산하기 위함.", "origin": "DFT(밀도범함수이론)에 기반, Kohn-Sham(1965).", "connections": "밴드 구조, 볼츠만 수송 방정식."}], "english_summary": ["Investigates thermal transport in Weyl semimetals TaAs and TaP.", "Reveals a phonon-dominated thermal conductivity regime via first-principles.", "Contrasts with the common assumption that metals are primarily electron-conductors.", "Important for understanding heat management in Weyl semimetal devices."]}}, {"title": "Winding feature and thermal evolution of the gapped Dirac magnons in CrI3", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/1rmh-8msr", "authors": "Weiliang Yao, Matthew B. Stone, Colin L. Sarkis, et al.", "last_authors": "Xingye Lu, Pengcheng Dai", "summary": "Here, the authors use inelastic neutron scattering to investigate gapped Dirac magnons in the van der Waals ferromagnet CrI 3 . With high-quality single crystals, they directly resolve the characteristic winding of magnon spectral weight around the K point of the hexagonal Brillouin zone, which provides a key signature of Dirac magnons. The authors further show that the magnon energies exhibit an approximately T 2 thermal renormalization, consistent with magnon-magnon interactions.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Experimental neutron scattering on a van der Waals ferromagnet showing Dirac magnons.", "tags": ["Diracmagnons", "vanderWaals", "neutronscattering", "ferromagnetism", "experiment"], "image": "", "briefing": {"background": "반데르발스 자성체는 층상 구조 덕분에 원자 수준에서 제어 가능한 2차원 자기적 성질을 연구하는 핵심 플랫폼입니다. 특히 허니컴 격자 구조를 가진 CrI3와 같은 물질은 스핀파(magnon)의 위상적 성질을 탐구하기 위한 이상적인 모델 시스템입니다.", "motivation": "이 연구는 CrI3의 자기 들뜸(magnetic excitation) 스펙트럼에서 나타나는 디랙 마그논의 존재를 실험적으로 검증하고, 그 특징적인 물리적 성질인 스펙트럼의 권선(winding) 특성을 명확히 확인하고자 했습니다.", "result": "비탄성 중성자 산란(INS)을 통해 CrI3의 K 포인트 주변에서 디랙 마그논의 권선 특성을 직접 관측하였으며, 온도가 상승함에 따라 마그논 에너지가 T 제곱에 비례하여 재정규화되는 현상을 통해 마그논-마그논 상호작용의 존재를 확인했습니다.", "implication": "이번 결과는 2차원 반데르발스 자성체에서 위상적 마그논의 존재를 강력하게 뒷받침하며, 스핀파를 이용한 정보 소자인 마그논닉스(magnonics) 분야에서 위상적 보호를 받는 정보 전달의 가능성을 시사합니다.", "novelty": "ARPES를 통해 전자 구조의 디랙 콘을 보는 것과 유사하게, 중성자 산란을 통해 마그논의 디랙 점을 직접 가시화했다는 점이 독창적입니다. 이는 귀하가 관심을 가지는 위상적 자기 물질의 연구 방법론적 측면에서 매우 유익한 결과입니다.", "unresolved": "마그논-마그논 상호작용의 상세한 미시적 function appendLabeledText(parent, className, label, text) { if (!text) return; const el = document.createElement('p'); el.className = className; const strong = textEl('strong', '', label); el.appendChild(strong); el.append(text); parent.appendChild(el); }
function appendBriefSection(parent, title, text, wide = false) { if (!text) return; const section = document.createElement('section'); section.className = 'brief-section' + (wide ? ' wide' : ''); section.appendChild(textEl('h2', '', title)); section.appendChild(textEl('p', '', text)); parent.appendChild(section); }
function render() {
  slideEl.replaceChildren();
  if (!slides.length) { slideEl.className = 'empty'; slideEl.textContent = 'No papers passed the filters in this run.'; counterEl.textContent = '0 / 0'; prevBtn.disabled = true; nextBtn.disabled = true; return; }
  slideEl.className = 'slide';
  const r = slides[index];
  const b = r.briefing || {};
  const head = document.createElement('div');
  head.className = 'paper-head';
  if (r.image) {
    const figure = document.createElement('figure');
    figure.className = 'figure';
    const img = document.createElement('img');
    img.src = r.image; img.alt = 'Figure or article preview image'; img.loading = 'lazy'; img.referrerPolicy = 'no-referrer'; img.onerror = () => figure.remove();
    figure.appendChild(img);
    figure.appendChild(textEl('figcaption', '', 'Figure / article preview image from the source page'));
    head.appendChild(figure);
  }
  const headText = document.createElement('div');
  headText.className = 'head-text';
  const badges = document.createElement('div');
  badges.className = 'badges';
  if (r.score) badges.appendChild(textEl('span', 'badge score', `${r.score}/10`));
  if (r.tier) badges.appendChild(textEl('span', 'badge', r.tier));
  if (r.journal) badges.appendChild(textEl('span', 'badge', r.journal));
  if (r.source) badges.appendChild(textEl('span', 'badge', r.source));
  headText.appendChild(badges);
  const title = document.createElement('h1');
  if (r.link) { const titleLink = document.createElement('a'); titleLink.href = r.link; titleLink.target = '_blank'; titleLink.rel = 'noopener noreferrer'; titleLink.textContent = r.title || ''; title.appendChild(titleLink); }
  else { title.textContent = r.title || ''; }
  headText.appendChild(title);
  headText.appendChild(textEl('p', 'meta', [r.journal, r.source].filter(Boolean).join(' | ')));
  if (r.last_authors || r.authors) { const authors = document.createElement('p'); authors.className = 'authors'; if (r.last_authors) authors.append('Last authors: ' + r.last_authors); if (r.authors) authors.append((r.last_authors ? ' | ' : '') + 'Authors: ' + r.authors); headText.appendChild(authors); }
  appendLabeledText(headText, 'why', 'Filter reason: ', r.reason);
  if (r.tags && r.tags.length) { const tags = document.createElement('div'); tags.className = 'tags'; r.tags.forEach(tag => tags.appendChild(textEl('span', 'tag', '#' + tag))); headText.appendChild(tags); }
  if (r.link) { const link = document.createElement('a'); link.className = 'link'; link.href = r.link; link.target = '_blank'; link.rel = 'noopener noreferrer'; link.textContent = 'Open paper'; headText.appendChild(link); }
  head.appendChild(headText);
  if (r.summary) { const abstract = document.createElement('p'); abstract.className = 'original-abstract'; const strong = textEl('strong', '', 'Original abstract'); abstract.appendChild(strong); abstract.append(r.summary); head.appendChild(abstract); }
  slideEl.appendChild(head);
  const briefing = document.createElement('div');
  briefing.className = 'briefing';
  appendBriefSection(briefing, 'Background', b.background);
  appendBriefSection(briefing, 'Motivation', b.motivation);
  appendBriefSection(briefing, 'Result', b.result);
  appendBriefSection(briefing, 'Implication', b.implication);
  appendBriefSection(briefing, "Why it's important / Novelty", b.novelty);
  appendBriefSection(briefing, 'Unresolved Questions', b.unresolved);
  appendBriefSection(briefing, 'Expected Future Work', b.future_work);
  if (b.concepts && b.concepts.length) {
    const section = document.createElement('section');
    section.className = 'brief-section wide';
    section.appendChild(textEl('h2', '', 'Concepts / Terms'));
    const concepts = document.createElement('div');
    concepts.className = 'concepts';
    b.concepts.forEach(c => {
      const item = document.createElement('div');
      item.className = 'concept';
      item.appendChild(textEl('h3', '', c.term || 'Concept'));
      [['왜 생겼나: ', c.why_emerged], ['누가 만들었나: ', c.origin], ['연결되는 흐름: ', c.connections]].forEach(([label, text]) => { if (!text) return; const p = document.createElement('p'); const bold = textEl('b', '', label); p.appendChild(bold); p.append(text); item.appendChild(p); });
      concepts.appendChild(item);
    });
    section.appendChild(concepts);
    briefing.appendChild(section);
  }
  if (b.english_summary && b.english_summary.length) { const section = document.createElement('section'); section.className = 'brief-section wide'; section.appendChild(textEl('h2', '', 'English Summary')); const ul = document.createElement('ul'); b.english_summary.slice(0, 5).forEach(line => ul.appendChild(textEl('li', '', line))); section.appendChild(ul); briefing.appendChild(section); }
  slideEl.appendChild(briefing);
  counterEl.textContent = `${index + 1} / ${slides.length}`;
  prevBtn.disabled = index === 0;
  nextBtn.disabled = index === slides.length - 1;
}
prevBtn.addEventListener('click', () => { index = Math.max(0, index - 1); render(); });
nextBtn.addEventListener('click', () => { index = Math.min(slides.length - 1, index + 1); render(); });
document.addEventListener('keydown', event => { if (event.key === 'ArrowLeft') prevBtn.click(); if (event.key === 'ArrowRight') nextBtn.click(); });
render();
</script>
</body>
</html>
