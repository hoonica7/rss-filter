<title>Daily Paper Slideshow</title>
<style>
  :root {
    color-scheme: light;
    --bg: #f6f7f4;
    --paper: #ffffff;
    --ink: #111827;
    --muted: #64748b;
    --line: #d8ddd2;
    --accent: #176b87;
    --accent-2: #9a3412;
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; overflow: auto; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: var(--bg); color: var(--ink); }
  .shell { max-width: 1500px; min-height: 100vh; margin: 0 auto; padding: 14px 18px; display: flex; flex-direction: column; }
  .topbar { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 16px; }
  .top-actions { display: flex; align-items: center; gap: 10px; }
  .topbar a, button { border: 1px solid var(--line); border-radius: 8px; background: var(--paper); color: var(--ink); padding: 10px 14px; font-weight: 700; text-decoration: none; cursor: pointer; }
  button.primary { background: var(--accent); border-color: var(--accent); color: white; }
  button:disabled { opacity: 0.45; cursor: not-allowed; }
  .counter { color: var(--muted); font-weight: 700; }
  .slide { min-height: calc(100vh - 82px); background: var(--paper); border: 1px solid var(--line); border-radius: 10px; padding: 18px; box-shadow: 0 18px 42px rgba(15, 23, 42, 0.10); display: grid; grid-template-columns: minmax(310px, 0.86fr) minmax(0, 1.55fr); gap: 18px; overflow: visible; }
  .paper-head { min-width: 0; min-height: 0; overflow: visible; display: flex; flex-direction: column; gap: 12px; }
  .figure { margin: 0; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: #f8fafc; }
  .figure img { display: block; width: 100%; max-height: 41vh; object-fit: contain; background: white; }
  .figure figcaption { padding: 7px 10px; color: var(--muted); font-size: 12px; line-height: 1.3; }
  .head-text { display: flex; flex-direction: column; gap: 9px; min-width: 0; }
  .badges { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .badge { border-radius: 999px; padding: 5px 9px; background: #eef2ff; color: #3730a3; font-size: 12px; font-weight: 800; }
  .score { background: #fee2e2; color: #991b1b; }
  h1 { margin: 0; font-size: 25px; line-height: 1.15; letter-spacing: 0; overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
  h1 a { color: inherit; text-decoration-color: rgba(23, 107, 135, 0.35); text-decoration-thickness: 2px; text-underline-offset: 4px; }
  h1 a:hover { color: var(--accent); text-decoration-color: var(--accent); }
  .meta, .authors, .why, .abstract { font-size: 13px; line-height: 1.45; }
  .meta, .authors { color: var(--muted); }
  .why strong, .abstract strong, .authors strong { color: var(--ink); }
  .authors { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .why { border-left: 4px solid var(--accent-2); padding-left: 10px; color: #374151; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .abstract { border-top: 1px solid var(--line); padding-top: 14px; color: #374151; }
  .original-abstract { border-top: 1px solid var(--line); padding-top: 10px; color: #374151; font-size: 11.5px; line-height: 1.35; overflow-wrap: anywhere; }
  .original-abstract strong { display: block; margin-bottom: 4px; color: var(--ink); }
  .tags { display: flex; flex-wrap: wrap; gap: 8px; }
  .tag { border-radius: 999px; padding: 4px 8px; background: #f1f5f9; color: #475569; font-size: 12px; font-weight: 700; }
  .head-text > .link { display: none; }
  .briefing { min-width: 0; min-height: 0; overflow: visible; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); grid-auto-rows: minmax(0, auto); align-content: start; gap: 11px 18px; border-top: 0; padding-top: 0; }
  .brief-section { min-width: 0; }
  .brief-section.wide { grid-column: 1 / -1; }
  .brief-section h2 { margin: 0 0 4px; font-size: 14px; line-height: 1.22; color: #0f766e; letter-spacing: 0; }
  .brief-section p, .brief-section li { margin: 0; font-size: 12.5px; line-height: 1.42; color: #1f2937; overflow-wrap: anywhere; }
  .brief-section ul { margin: 0; padding-left: 20px; }
  .concepts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 9px 14px; }
  .concept { border-top: 1px solid var(--line); padding-top: 7px; }
  .concept h3 { margin: 0 0 4px; font-size: 13px; color: #7c2d12; letter-spacing: 0; }
  .concept p { margin: 2px 0 0; font-size: 11.5px; line-height: 1.35; color: #374151; overflow-wrap: anywhere; }
  .concept b { color: #111827; }
  .link { color: var(--accent); font-weight: 800; text-decoration: none; }
  .empty { padding: 48px; background: var(--paper); border: 1px solid var(--line); border-radius: 12px; color: var(--muted); }
  @media (max-width: 860px) {
    .shell { padding: 14px; }
    .topbar, .top-actions { align-items: stretch; flex-direction: column; }
    .slide, .briefing, .concepts { grid-template-columns: 1fr; }
    .slide { min-height: auto; overflow: visible; display: grid; }
    h1 { font-size: 28px; }
  }
</style>

<script>
const slides = [{"title": "Signatures of a light-induced exciton condensate exhibiting BEC-BCS crossover", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2608.20310", "authors": "Khanh Duy Nguyen, Gabriele Berruto, Yunhe Bai, et al.", "last_authors": "Y. Shirley Meng, Shuolong Yang", "summary": "Exciton condensates provide a platform to study quasiparticle pairing, Bose-Einstein condensation-Bardeen-Cooper-Schrieffer (BEC-BCS) crossover, and excitonic topological phenomena. Achieving a nonequilibrium exciton condensate allows the ultimate tunability of these emergent phenomena. Yet, evidence of a light-induced, nonequilibrium exciton condensate and its BEC-BCS crossover remains elusive. Here, we use time- and angle-resolved photoemission spectroscopy to demonstrate signatures of a non-equilibrium exciton condensate and its BEC-BCS crossover in monolayer MnBi2Te4. Following optical excitation, a distinctive hole-like dispersion representing excitons emerges and persists for >20 ps. Strikingly, energy-domain sharpening in the valence band occurs 2 ps after time zero and exhibits a sharp onset at a threshold pump fluence of 0.84 mJ/cm2. The delayed and strongly nonlinear response is difficult to reconcile with transient field effects or conventional carrier-induced band shifts but is consistent with a model of exciton condensation governed by a Berezinskii-Kosterlitz-Thouless transition. The estimated threshold exciton density agrees quantitatively with the Nelson-Kosterlitz critical density. At higher fluences, the exciton feature develops a camel-back-shaped dispersion, consistent with the BEC-BCS crossover in the condensate framework. Our work establishes ultrathin MnBi2Te4 as a model system for studying nonequilibrium exciton condensates with a connection to superconductivity and exciton-driven topological phases.", "tier": "A_MUST_READ", "score": "10", "reason": "TR-ARPES study on MnBi2Te4 demonstrating exciton condensation; perfectly aligns with user's core interests and methodology.", "tags": ["tr-ARPES", "MnBi2Te4", "topologicalinsulator", "exciton"], "image": "https://arxiv.org/static/browse/0.3.4/images/arxiv-logo-fb.png", "briefing": {"background": "엑시톤 응축은 전자와 정공이 정전기적 인력으로 결합하여 보존(boson) 상태를 형성하는 상으로, 초전도체와 유사한 물리적 성질을 가지며 BEC-BCS 크로스오버 연구의 핵심 플랫폼입니다.", "motivation": "비평형 상태에서 빛을 이용해 엑시톤 응축을 유도하고, 그 상전이 과정에서 나타나는 BEC-BCS 크로스오버 현상을 직접 관측하고자 합니다.", "result": "단일층 MnBi2Te4에서 광여기 후 20ps 이상 유지되는 엑시톤 응축 신호를 tr-ARPES로 포착했으며, 특정 플루언스 임계값 이상에서 발생하는 에너지 대역의 날카로움(sharpening)과 카멜백(camel-back) 분산 형태를 확인했습니다.", "implication": "이 결과는 MnBi2Te4가 엑시톤 응축의 비평형 동역학을 연구하는 이상적인 모델 시스템임을 입증하며, 위상물질과 강상관 전자계 간의 접점을 넓혔습니다.", "novelty": "MnBi2Te4는 귀하가 관심을 가지는 위상절연체이자 자기적 특성을 가진 물질로, 여기서 BEC-BCS 크로스오버와 BKT 전이를 tr-ARPES로 실시간 관측했다는 점은 독보적입니다.", "unresolved": "엑시톤 응축의 구체적인 위상적 특성과 초전도성과의 직접적인 상관관계에 대한 추가적인 증거가 필요합니다.", "future_work": "엑시톤 응축에 의한 에너지 갭의 위상적 성질을 규명하기 위한 CD-ARPES 혹은 시간 분해 고조파 생성 실험이 예상됩니다.", "concepts": [{"term": "BEC-BCS crossover", "why_emerged": "강하게 결합된 보존(BEC)과 약하게 결합된 페르미온 쌍(BCS) 사이의 연속적인 전이를 설명하기 위해 필요합니다.", "origin": "Leggett (1980) 등에 의해 초전도와 초유동 연구에서 정립되었습니다.", "connections": "고온 초전도체, 냉각 원자 가스, 엑시톤 응축계와 밀접하게 연결됩니다."}, {"term": "Berezinskii-Kosterlitz-Thouless (BKT) transition", "why_emerged": "2차원 시스템에서 장거리 질서가 없는 상태에서도 위상적 결함(보텍스)의 쌍생성/소멸을 통해 상전이가 발생함을 설명하기 위해 도입되었습니다.", "origin": "Berezinskii(1971), Kosterlitz와 Thouless(1973)가 제안하였습니다.", "connections": "2D 시스템의 자기성, 초유동, 엑시톤 응축 등 2D 양자 상전이의 핵심 기작입니다."}], "english_summary": ["Demonstrates light-induced exciton condensation in monolayer MnBi2Te4 using tr-ARPES.", "Observes BEC-BCS crossover via evolution of camel-back shaped energy dispersion.", "Identifies BKT-type phase transition at a specific critical exciton density.", "Establishes MnBi2Te4 as a model platform for nonequilibrium excitonic and topological phenomena."]}}, {"title": "Band structure of Na2KSb: Near-band-gap photoemission spectroscopy and density functional theory calculations", "journal": "PRB_Recent", "source": "keyword", "link": "http://link.aps.org/doi/10.1103/n3js-g2bn", "authors": "S. A. Rozhkov, V. V. Bakin, S. V. Eremeev, V. S. Rusetsky, V. A. Golyashov, D. A. Kustov, D. K. Orekhov, H. E. Scheibler, V. L. Alperovich, and O. E. Tereshchenko", "last_authors": "D. K. Orekhov, H. E. Scheibler, V. L. Alperovich, and O. E. Tereshchenko", "summary": "The electronic band structure of ${\\mathrm{Na}}_{2}\\mathrm{KSb}$ was studied by a combination of low-energy photoemission spectroscopy and density functional theory (DFT) calculations. The optical and photoemission quantum efficiency (QE) spectra, along with longitudinal energy distribution curves (…", "tier": "A_MUST_READ", "score": "9", "reason": "title strong match: photoemission", "tags": ["photoemission", "bandstructure"], "image": "", "briefing": {"background": "Na2KSb와 같은 알칼리 금속 안티몬 화합물은 광음극(photocathode)으로서 높은 효율을 가지며, 이를 최적화하기 위해 기초 전자 구조에 대한 정확한 이해가 필수적입니다.", "motivation": "DFT 계산과 저에너지 광전자 분광법(PES)을 병행하여 해당 물질의 밴드 구조를 실험적으로 검증하고자 합니다.", "result": "해당 물질의 밴드 구조 및 양자 효율(QE) 스펙트럼 데이터를 확보하여 DFT 계산값과 비교 분석했습니다.", "implication": "광전 소자로서의 Na2KSb의 성능을 이해하고 개선하기 위한 기초 데이터를 제공합니다.", "novelty": "표준적인 전자구조 연구로서, 광음극 재료의 기본 분산 관계를 저에너지 영역에서 정밀하게 측정했습니다.", "unresolved": "이 연구 결과가 강상관 관계나 위상적 특성을 포함하고 있는지는 명확하지 않습니다.", "future_work": "도핑이나 표면 처리에 따른 밴드 구조의 변화 연구가 뒤따를 것으로 보입니다.", "concepts": [{"term": "Low-energy PES", "why_emerged": "페르미 준위 근처의 상태 밀도와 밴드 구조를 높은 에너지 분해능으로 관측하기 위해 필요합니다.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "일반적인 ARPES 연구와 방법론적으로 궤를 같이합니다."}], "english_summary": ["Investigates the electronic band structure of Na2KSb.", "Combines experimental low-energy photoemission spectroscopy with DFT calculations.", "Provides data on quantum efficiency and energy distribution curves.", "Supports material characterization for high-efficiency photocathode applications."]}}, {"title": "Pressure-Induced Magnetic-Field-Free Superconducting Diode Effect in NbSe2 Flake", "journal": "PRL_Recent", "source": "author whitelist", "link": "http://link.aps.org/doi/10.1103/8wnw-16qt", "authors": "Shihao Zhu, Tian Le, Cuiying Pei, et al.", "last_authors": "Wen-Yu He, Yanpeng Qi", "summary": "The superconducting diode effect (SDE) is a fascinating nonreciprocal phenomenon where the critical current is different for opposite current directions. It is widely believed that realizing SDE requires breaking both inversion symmetry and time-reversal symmetry (TRS), which are usually achieved vi…", "tier": "A_MUST_READ", "score": "9", "reason": "author whitelist: Yulin Chen", "tags": ["superconduct"], "image": "", "briefing": {"background": "초전도 다이오드 효과(SDE)는 전류 방향에 따라 임계 전류값이 다른 현상으로, 비반전 대칭성과 시간 반전 대칭성이 깨진 시스템에서 구현되는 차세대 소자 기술입니다.", "motivation": "일반적으로 외부 자기장을 걸어주어야 발생하는 SDE를 NbSe2 박막에서 압력(strain)을 조절하여 자기장 없이 구현하고자 합니다.", "result": "압력을 가함으로써 결정 대칭성을 제어하여, 외부 자기장 없이도 자발적인 초전도 다이오드 효과를 유도하는 데 성공했습니다.", "implication": "자기 소자 없이도 전자기적 제어가 가능한 초전도 회로 개발의 핵심 이정표가 될 것입니다.", "novelty": "기존에는 외부 자기장이 필수였으나, 구조적 변형만으로 SDE를 유도했다는 점에서 에너지 효율적인 소자 응용 가능성을 높였습니다.", "unresolved": "압력 하에서의 정확한 대칭성 깨짐 기작과 그에 따른 전자 구조 변화를 ARPES로 직접 관측한 것은 아닙니다.", "future_work": "해당 압력 조건에서의 저온 전자 구조 변화를 직접 관측하는 전단성(strain) 제어 ARPES 실험이 필요합니다.", "concepts": [{"term": "Superconducting Diode Effect (SDE)", "why_emerged": "초전도 상태에서 비가역적인 전류 흐름을 제어하여 초전도 논리 소자를 만들기 위해 필요합니다.", "origin": "최근 2D 물질 및 위상 초전도체 분야에서 실험적으로 활발히 입증되고 있습니다.", "connections": "Rashba 상호작용, 자기장, 위상절연체와 관련이 깊습니다."}], "english_summary": ["Demonstrates a pressure-induced superconducting diode effect in NbSe2 flakes.", "Achieves nonreciprocal critical current without external magnetic fields.", "Breaks inversion symmetry via strain control to enable the diode effect.", "Opens pathways for magnetic-field-free superconducting electronic devices."]}}, {"title": "A Unified Theoretical Framework for Photoemission and Its Inverse: Reciprocity, Spin, and Photon Polarization", "journal": "arXiv_CondMat", "source": "keyword", "link": "https://arxiv.org/abs/2608.20192", "authors": "Frank O. Schumann, J\\\"urgen Henk", "last_authors": "Frank O. Schumann, J\\\"urgen Henk", "summary": "We present a unified theoretical framework for spin- and angle-resolved photoemission spectroscopy (SARPES) and its inverse process (SARIPES), treating both on an equal footing. The formulation is based on a response tensor that encodes the reciprocity between the two processes. We show that polarization tomography within SARPES calculations provides a systematic route for reconstructing the tensor elements. The number of independent components is significantly reduced by symmetry constraints, which in turn allows for explicit expressions describing spin-reversal processes and intensity modulations. The formalism is illustrated for the W(110) surface. The resulting framework provides a symmetry-adapted description of spin-dependent optical transitions at surfaces and enables the direct prediction of SARIPES intensities from SARPES calculations.", "tier": "A_MUST_READ", "score": "9", "reason": "title strong match: photoemission", "tags": ["ARPES", "angle-resolvedphotoemission", "photoemission"], "image": "https://arxiv.org/html/2608.20192v1/Fig1.png", "briefing": {"background": "광전자 분광법(ARPES)과 그 역과정인 역광전자 분광법(IPES)은 고체 표면의 전자 구조를 이해하는 핵심 도구입니다. 이 두 과정 간의 물리적 대칭성 및 상관관계를 이론적으로 통일하는 것은 정밀한 전자 구조 분석을 위해 필수적입니다.", "motivation": "ARPES와 IPES 사이의 상호관계(Reciprocity)를 응답 텐서(response tensor)로 공식화하여, 실험 데이터 간의 정량적 비교 및 예측 가능성을 높이고자 했습니다.", "result": "편극 단층 촬영(polarization tomography)과 대칭성 제약을 사용하여 독립적인 텐서 요소를 획기적으로 줄였으며, SARPES 데이터를 바탕으로 SARIPES 강도를 직접 예측할 수 있는 프레임워크를 구축했습니다.", "implication": "스핀-의존적 광학 전이 과정을 대칭성에 기반해 엄밀하게 기술할 수 있게 되어, ARPES 데이터 해석의 정확도가 향상될 것입니다.", "novelty": "기존에 분리되어 다뤄지던 ARPES와 IPES를 단일 응답 텐서로 통합하여, 특히 스핀 분해 실험에서 대칭성에 근거한 예측 모델을 제시했다는 점이 독보적입니다.", "unresolved": "W(110) 표면과 같은 표준적인 시스템에서 검증되었으나, 복잡한 위상 물질이나 강상관 전자계에서의 다체 효과가 응답 텐서에 미치는 영향은 추가 연구가 필요합니다.", "future_work": "보다 복잡한 자기 구조를 가진 물질에서의 스핀 역전 과정 검증 및 다 tex lattice in the Weyl semimetal -PtBi2 (Phys. Rev. Lett.)", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2508.04867", "authors": "Jose Antonio Moreno, Pablo Garc\\'ia Talavera, Edwin Herrera, et al.", "last_authors": "Paul C. Canfield, Hermann Suderow", "summary": "The layered compound $\\gamma$-PtBi$_2$ is a topological semimetal with Fermi arcs at the surface joining bulk Weyl points. Recent work has found signatures of surface superconductivity consisting of gap openings compatible with a critical temperature orders of magnitude larger than the bulk value. However, no superconducting vortices have been identified, raising questions about the robustness of the phase coherence. Here we use very low temperature Scanning Tunneling Microscopy (STM) and find robust superconductivity with T$_C=$2.9 K and H$_{C2}\\approx$1.8 T linked to the Fermi arcs. We observe quantized superconducting vortices and the Josephson effect, demonstrating two-dimensional macroscopic quantum phase coherence.", "tier": "B_IMPORTANT_CONDMAT", "score": "10", "reason": "STM study of surface superconductivity and Fermi arcs in a Weyl semimetal.; demoted from A: broad CM, not direct user/project hit", "tags": ["STM", "Weylsemimetal", "superconductivity", "Fermiarcs"], "image": "https://arxiv.org/html/2508.04867v3/gapvsTv4.png", "briefing": {"background": "Weyl semimetals은 bulk에서 밴드가 교차하는 Weyl point를 가지며, 표면에는 특이한 위상적 상태인 Fermi arc가 존재합니다. 최근 이러한 위상 물질에서 벌크와는 다른 특성을 보이는 표면 초전도 현상이 발견되어 주목받고 있습니다.", "motivation": "이전 연구들에서 gamma-PtBi2 표면의 초전도 갭이 관찰되었으나, 실제 초전도성을 증명하는 핵심 지표인 보텍스(vortex) 격자가 확인되지 않아 위상적 표면 상태의 위상적 결맞음(coherence)에 의문이 제기되었습니다.", "result": "극저온 STM을 통해 2.9 K의 Tc와 1.8 T의 Hc2를 갖는 표면 초전도성을 확인하였고, 양자화된 초전도 보텍스와 조셉슨 효과를 직접 관측하여 표면에서 2차원적인 거시적 양자 결맞음이 존재함을 증명했습니다.", "implication": "위상 반금속 표면의 Fermi arc가 단순히 전자 구조적 특성일 뿐만 아니라, 거시적인 초전도 질서를 매개할 수 있는 플랫폼이 될 수 있음을 의미합니다.", "novelty": "Weyl semimetal의 표면 초전도성에 대해 위상적으로 보호된 2차원 초전도성을 실험적으로 확증하여, 위상 초전도체 후보군으로서의
