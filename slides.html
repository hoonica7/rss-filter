<title>Daily Paper Slideshow</title>
<style>
  :root {
    color-scheme: light;
    --bg: #f6f7f4;
    --paper: #ffffff;
    --ink: #111827;
    --muted: #64748b;
    --line: #d8ddd2;
    --accent: #176b87;
    --accent-2: #9a3412;
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; overflow: auto; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: var(--bg); color: var(--ink); }
  .shell { max-width: 1500px; min-height: 100vh; margin: 0 auto; padding: 14px 18px; display: flex; flex-direction: column; }
  .topbar { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 16px; }
  .top-actions { display: flex; align-items: center; gap: 10px; }
  .topbar a, button { border: 1px solid var(--line); border-radius: 8px; background: var(--paper); color: var(--ink); padding: 10px 14px; font-weight: 700; text-decoration: none; cursor: pointer; }
  button.primary { background: var(--accent); border-color: var(--accent); color: white; }
  button:disabled { opacity: 0.45; cursor: not-allowed; }
  .counter { color: var(--muted); font-weight: 700; }
  .slide { min-height: calc(100vh - 82px); background: var(--paper); border: 1px solid var(--line); border-radius: 10px; padding: 18px; box-shadow: 0 18px 42px rgba(15, 23, 42, 0.10); display: grid; grid-template-columns: minmax(310px, 0.86fr) minmax(0, 1.55fr); gap: 18px; overflow: visible; }
  .paper-head { min-width: 0; min-height: 0; overflow: visible; display: flex; flex-direction: column; gap: 12px; }
  .figure { margin: 0; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: #f8fafc; }
  .figure img { display: block; width: 100%; max-height: 41vh; object-fit: contain; background: white; }
  .figure figcaption { padding: 7px 10px; color: var(--muted); font-size: 12px; line-height: 1.3; }
  .head-text { display: flex; flex-direction: column; gap: 9px; min-width: 0; }
  .badges { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .badge { border-radius: 999px; padding: 5px 9px; background: #eef2ff; color: #3730a3; font-size: 12px; font-weight: 800; }
  .score { background: #fee2e2; color: #991b1b; }
  h1 { margin: 0; font-size: 25px; line-height: 1.15; letter-spacing: 0; overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
  h1 a { color: inherit; text-decoration-color: rgba(23, 107, 135, 0.35); text-decoration-thickness: 2px; text-underline-offset: 4px; }
  h1 a:hover { color: var(--accent); text-decoration-color: var(--accent); }
  .meta, .authors, .why, .abstract { font-size: 13px; line-height: 1.45; }
  .meta, .authors { color: var(--muted); }
  .why strong, .abstract strong, .authors strong { color: var(--ink); }
  .authors { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .why { border-left: 4px solid var(--accent-2); padding-left: 10px; color: #374151; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .abstract { border-top: 1px solid var(--line); padding-top: 14px; color: #374151; }
  .original-abstract { border-top: 1px solid var(--line); padding-top: 10px; color: #374151; font-size: 11.5px; line-height: 1.35; overflow-wrap: anywhere; }
  .original-abstract strong { display: block; margin-bottom: 4px; color: var(--ink); }
  .tags { display: flex; flex-wrap: wrap; gap: 8px; }
  .tag { border-radius: 999px; padding: 4px 8px; background: #f1f5f9; color: #475569; font-size: 12px; font-weight: 700; }
  .head-text > .link { display: none; }
  .briefing { min-width: 0; min-height: 0; overflow: visible; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); grid-auto-rows: minmax(0, auto); align-content: start; gap: 11px 18px; border-top: 0; padding-top: 0; }
  .brief-section { min-width: 0; }
  .brief-section.wide { grid-column: 1 / -1; }
  .brief-section h2 { margin: 0 0 4px; font-size: 14px; line-height: 1.22; color: #0f766e; letter-spacing: 0; }
  .brief-section p, .brief-section li { margin: 0; font-size: 12.5px; line-height: 1.42; color: #1f2937; overflow-wrap: anywhere; }
  .brief-section ul { margin: 0; padding-left: 20px; }
  .concepts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 9px 14px; }
  .concept { border-top: 1px solid var(--line); padding-top: 7px; }
  .concept h3 { margin: 0 0 4px; font-size: 13px; color: #7c2d12; letter-spacing: 0; }
  .concept p { margin: 2px 0 0; font-size: 11.5px; line-height: 1.35; color: #374151; overflow-wrap: anywhere; }
  .concept b { color: #111827; }
  .link { color: var(--accent); font-weight: 800; text-decoration: none; }
  .empty { padding: 48px; background: var(--paper); border: 1px solid var(--line); border-radius: 12px; color: var(--muted); }
  @media (max-width: 860px) {
    .shell { padding: 14px; }
    .topbar, .top-actions { align-items: stretch; flex-direction: column; }
    .slide, .briefing, .concepts { grid-template-columns: 1fr; }
    .slide { min-height: auto; overflow: visible; display: grid; }
    h1 { font-size: 28px; }
  }
</style>

const slides = [{"title": "Pressure tuning of electronic correlations and flat bands in CsCr3Sb5", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/pqbc-87xb", "authors": "Maria Chatzieleftheriou, Jonas B. Profe, Ying Li, Roser Valentí", "last_authors": "Ying Li, Roser Valentí", "summary": "${\\mathrm{CsCr}}_{3}{\\mathrm{Sb}}_{5}$ is a newly identified strongly correlated kagome superconductor, characterized by non-Fermi-liquid behavior at elevated temperatures and intertwined charge and spin density wave order below ${T}_{\\text{DW}}≈54\\phantom{\\rule{0.222222em}{0ex}}\\mathrm{K}$. Under e…", "tier": "A_MUST_READ", "score": "10", "reason": "Directly focuses on the electronic structure and correlations of a chromium-based kagome superconductor relative.", "tags": ["material", "kagome", "flatband"], "image": "", "briefing": {"background": "Kagome 격자 물질은 기하학적 좌절과 평탄 밴드(flat band) 특성으로 인해 강한 전자 상관관계를 유도하며, 특히 AV3Sb5 계열의 초전도체와 전하밀도파(CDW) 현상은 현재 응집물질물리학의 핵심 연구 주제입니다.", "motivation": "새롭게 발견된 크롬 기반의 CsCr3Sb5 물질에서 나타나는 비페르미 액체 거동과 CDW/SDW 상전이의 물리적 기원을 이해하고, 압력에 따른 전자 상관관계 변화를 규명하고자 합니다.", "result": "압력 변화를 통해 전자 상관관계와 평탄 밴드 구조를 제어할 수 있음을 이론적으로 제시하며, CsCr3Sb5의 상관관계 특성이 어떻게 변하는지 분석하였습니다.", "implication": "CsCr3Sb5가 바나듐 기반 kagome 초전도체와 유사한 혹은 차별화된 물리적 메커니즘을 가짐을 시사하며, kagome 물질의 초전도성과 자성 질서 간의 상호작용을 이해하는 새로운 플랫폼을 제공합니다.", "novelty": "기존 AV3Sb5를 넘어 크롬 계열로 Kagome 연구를 확장하였으며, 압력 인가에 따른 평탄 밴드 변화를 추적했다는 점에서 상관관계 물리 연구에 중요한 정보를 제공합니다.", "unresolved": "실험적인 ARPES 측정치가 아직 충분히 확보되지 않았으며, 압력에 따른 실제 상전이 온도 및 초전도 상태의 정밀한 위상 변화 확인이 필요합니다.", "future_work": "고압 환경에서의 실제 구조 분석 및 저온 전기 저항/자기 감수성 측정, 그리고 ARPES를 통한 밴드 구조의 직접적인 실험적 검증이 예상됩니다.", "concepts": [{"term": "Kagome Lattice", "why_emerged": "기하학적 좌절(geometric frustration)과 평탄 밴드를 통한 강한 상관관계 연구를 위해 필요함", "origin": "수학적인 패턴으로서 유래하였으며, 응집물질물리학에서는 최근 수년간 급격히 관심이 집중됨", "connections": "AV3Sb5 계열, 밴드 토폴로지, 초전도성"}, {"term": "Flat band", "why_emerged": "운동 에너지가 억제되어 전자 상관관계 효과가 극대화되는 에너지 대역을 찾기 위해 고안됨", "origin": "Lieb 격자나 Kagome 격자 모델 이론에서 먼저 제안됨", "connections": "강한 상관관계, Mott 절연체, 비전통적 초전도"}], "english_summary": ["CsCr3Sb5 is a newly identified chromium-based kagome superconductor.", "The paper investigates the correlation between electronic structure and pressure-induced phase changes.", "It focuses on the role of flat bands in mediating the non-Fermi liquid and CDW/SDW states.", "The study provides a theoretical basis for further exploring chromium-based correlated systems."]}}, {"title": "Tunable electron-plasmon coupling in the layered transition metal dichalcogenide ZrSe2−xTex", "journal": "PRB_Recent", "source": "author whitelist", "link": "http://link.aps.org/doi/10.1103/mkfk-8k2t", "authors": "Tongrui Li, Yuzhe Wang, Haoyuan Yan, et al.", "last_authors": "Donglai Feng, Juan Jiang", "summary": "Electron-plasmon coupling, in which carriers are dressed by collective electronic oscillations, represents an important many-body interaction in solids. Here, using angle-resolved photoemission spectroscopy, we report the tunable electron-plasmon coupling in the layered transition metal dichalcogeni…", "tier": "A_MUST_READ", "score": "10", "reason": "author whitelist: Donglai Feng", "tags": ["angle-resolvedphotoemission", "photoemission"], "image": "", "briefing": {"background": "전자-플라즈몬 결합은 물질 내의 전하 캐리어와 집단적 진동인 플라즈몬 사이의 상호작용으로, 다체 물리 현상과 밴드 구조 보정에서 매우 중요한 역할을 합니다.", "motivation": "층상 구조의 전이금속 칼코겐화물(TMD)인 ZrSe2-xTex에서 조성 변화를 통해 플라즈몬 결합 세기를 인위적으로 제어할 수 있는지 확인하고자 합니다.", "result": "ARPES를 통해 텔루륨 도핑 수준을 조절함으로써 전자-플라즈몬 결합 강도가 변하며, 밴드 꺾임(kink) 구조를 통해 이를 관측하였습니다.", "implication": "TMD 물질의 전자적 상태를 플라즈몬 엔지니어링을 통해 미세 조정할 수 있는 가능성을 열었으며, 다체 상호작용 연구의 새로운 지표를 제공합니다.", "novelty": "Donglai Feng 그룹의 정밀한 ARPES 측정을 통해 플라즈몬-전자 결합의 튜닝 가능성을 시각적으로 입증한 점이 돋보입니다.", "unresolved": "플라즈몬 결합의 비균일성에 따른 국소적인 전자 상태 변화와 실제 소자 응용 시의 효과는 명확하지 않습니다.", "future_work": "다른 TMD 화합물로의 확장 연구 및 시간에 따른 다이내믹스 연구(TR-ARPES)를 통한 결합 완화 시간 분석이 기대됩니다.", "concepts": [{"term": "Electron-plasmon coupling", "why_emerged": 3Ni2O7 thin films", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/zjnc-vv8p", "authors": "Deepak Kumar, Jared Z. Dans, Keenan E. Avers, Ryan Paxson, Ichiro Takeuchi, Johnpierre Paglione", "last_authors": "Ichiro Takeuchi, Johnpierre Paglione", "summary": "How do La 3 Ni 2 O 7 thin films behaves under modest hydrostatic pressure? The authors here investigate epitaxial thin films under substrate selection, oxygen treatment, and hydrostatic pressure, and reveal tunable transport behavior, where modest pressure drives a transition from Fermi liquid-like metallicity toward non-Fermi liquid response. These findings highlight strain- and pressure-enabled control of bilayer nickelate thin films, offering a concise pathway to explore exotic low-temperature electronic states.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Experimental study on nickelate thin films, relevant to correlated materials.", "tags": ["nickelate", "transport", "pressure"], "image": "", "briefing": {"background": "La3Ni2O7은 최근 고압에서 초전도성을 보인 물질로 큰 주목을 받고 있으며, 이의 전자 구조와 압력 하에서의 변화를 이해하는 것이 핵심 연구 주제입니다.", "motivation": "La3Ni2O7 박막을 통해 압력 및 기판 조절을 통한 물성 제어 가능성을 확인하고, 저온 수송 특성을 파악하고자 했습니다.", "result": "적당한 정수압(hydrostatic pressure) 환경에서 이 물질이 페르미 액체 금속성에서 비페르미 액체 거동으로 변화함을 관찰했습니다.", "implication": "박막 성장을 통한 strain 엔지니어링과 압력을 결합하면 니켈산염의 전자 상관 상태를 정밀하게 튜닝할 수 있음을 확인했습니다.", "novelty": "고압 단결정 연구에 편중된 기존 연구와 달리, 박막 상태에서의 압력 반응을 체계적으로 조사하여 제어 가능한 플랫폼으로서의 가치를 보여주었습니다.", "unresolved": "관찰된 비페르미 액체 거동이 구체적으로 어떤 기원(예: 자성 요동 등)에 의한 것인지는 명확하지 않습니다.", "future_work": "박막 상태에서의 ARPES를 통해 페르미 표면의 변화를 관찰하고, 실제 압력에 따른 초전도 전이의 변화를 추적하는 연구가 필요합니다.", "concepts": [{"term": "페르미 액체", "why_emerged": "상호작용하는 전자를 준입자(quasiparticle) 개념으로 기술하여 금속의 저온 물성을 설명하기 위해 필요.", "origin": "Landau (1956)에 의해 정립됨.", "connections": "비페르미 액체, 강상관 물질, 론딩/슈퍼플루이드 이론과 연결됨."}, {"term": "비페르미 액체", "why_emerged": "일부 강상관 물질에서 페르미 액체 이론이 예측하는 온도 의존성(저항 T^2 등)이 깨지는 현상을 설명하기 위해 필요.", "origin": "고온 초전도체 연구가 rable magnitudes, responsible for the out-of-plane spin polarization.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Experimental study of Mn3Ge, a key topological/Weyl semimetal material of interest.", "tags": ["experiment", "Mn3Ge", "topological"], "image": "", "briefing": {"background": "비공선형 반강자성체 Mn3X 계열은 베리 곡률에 의한 이상 홀 효과(AHE)가 나타나 차세대 스핀트로닉스 소자 후보로 주목받고 있습니다.", "motivation": "Mn3Ge에서 관찰되는 면외(out-of-plane) 스핀 분극의 미시적 기원이 자성 질서와 직접 연관된 것인지, 아니면 독립적인 메커니즘인지 분리하여 확인하고자 합니다.", "result": "스핀 토크 강자성 공명(ST-FMR) 실험을 통해, 자성 질서와 관련된 스핀 홀 효과와 독립적인 스핀 스왑 효과가 공존하고 있음을 밝혔습니다.", "implication": "이러한 두 가지 기여도를 이해함으로써 Mn3Ge 기반 소자의 스핀 토크 효율을 더 정밀하게 제어할 수 있게 되었습니다.", "novelty": "기존에 논쟁적이었던 비공선형 반강자성체의 스핀 분극 기원을 두 가지 기작의 공존으로 깔끔하게 설명했습니다.", "unresolved": "두 메커니즘의 상대적 크기가 샘플의 결정 품질이나 결함에 의해 어떻게 변하는지에 대한 추가 연구가 필요합니다.", "future_work": "결정 방향을 제어한 소자 제작 및 스핀 토크 효율을 최적화하기 위한 엔지니어링 연구가 이어질 것으로 보입니다.", "concepts": [{"term": "Noncollinear antiferromagnet", "why_emerged": "자성 모멘트가 일렬로 정렬되지 않고 각도를 가지는 구조에서 발생하는 새로운 위상 물성을 연구하기 위함.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "Mn3Sn, 베리 곡률, 이상 홀 효과, 위상 반강자성체."}, {"term": "Spin-torque FMR", "why_emerged": "자기성 물질 내부의 스핀 토크 및 자성 거동을 전기적으로 측정하기 위해 개발된 고감도 기술.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "스핀트로닉스, 자화 스위칭, 반강자성체 특성화."}], "english_summary": ["Investigated the origin of out-of-plane spin polarization in Mn3Ge.", "Compared spin torques using ST-FMR in Mn3Ge/Py bilayers.", "Found coexistence of magnetic spin Hall effect and spin swapping mechanisms.", "Clarifies the microscopic physics enabling field-free switching in noncollinear antiferromagnets."]}}, {"title": "Magnetic field induced magnon portfolio in the van der Waals magnet CrOCl", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/l132-qx8q", "authors": "T. Riccardi, F. Le Mardélé, L. A. Veyrat de Lachenal, et al.", "last_authors": "C. Faugeras, B. A. Piot", "summary": "Magnonic excitations are investigated in the CrOCl ion experiments.", "Observed biaxial anisotropy and hysteretic magnon spectra under external magnetic fields.", "Demonstrated the formation of spatially separated magnetic phases.", "Highlighted the capability to tune magnonic excitation types via competing exchange interactions."]}}, {"title": "Room-temperature two-dimensional ferromagnetism, large magnetic anisotropy, and anomalous Hall effect: From supported to freestanding monolayers GdM2 (M=Cu, Ag, Au)", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/csml-jn4q", "authors": "Jia-wan Li, Xunwu Hu, Dao-Xin Yao, Yusheng Hou", "last_authors": "Dao-Xin Yao, Yusheng Hou", "summary": "Here, the authors demonstrate that decoupling rare-earth Gd M 2 ( M =Cu, Ag, and Au) monolayers from metallic substrates transforms low-temperature supported surface alloys into room-temperature ferromagnets. Substrate removal enhances magnetic exchange interactions through charge redistribution, and eliminating structural buckling further modifies the competing exchange interactions. Freestanding GdAu 2 exhibits perpendicular magnetic anisotropy and a symmetry-tunable anomalous Hall effect, providing a platform for two-dimensional magnetic and topological spintronics.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Studies 2D ferromagnetism and anomalous Hall effect in monolayers, combining topology and magnetism.", "tags": ["material", "anomalousHall", "monolayer"], "image": "", "briefing": {"background": "2차원 자성체는 현대 스핀트로닉스 연구의 중심이며, 특히 상온에서의 강자성 구현은 소자 응용을 위해 필수적입니다. 기판과의 상호작용을 제어함으로써 이러한 특성을 극대화하는 것이 이 분야의 주요 과제입니다.", "motivation": "GdM2(M=Cu, Ag, Au) 단원자층이 기판 위에 존재할 때와 자유롭게 떨어져 있을 때(freestanding)의 자기적 특성 차이를 규명하고, 상온 강자성을 구현하는 조건을 찾고자 했습니다.", "result": "기판에서 분리된 GdM2 단원자층은 전하 재분배와 구조적 변형을 통해 상온 강자성을 나타내며, 특히 GdAu2는 수직 자기 이방성과 비정질 홀 효과를 보임을 보였습니다.", "implication": "기판 공학을 통한 2차원 자성체의 물성 제어가 가능하며, 위상물질과 자성을 결합한 스핀트로닉스 소자 설계에 활용될 수 있음을 시사합니다.", "novelty": "기존 저온에서만 가능했던 2차원 자성을 상온으로 끌어올릴 수 있는 구조적, 물리적 매커니즘을 이론적으로 제시했습니다.", "unresolved": "실제 실험적으로 freestanding monolayer를 구현하는 과정에서의 결함 제어 및 안정성 문제는 추가 검증이 필요합니다.", "future_work": "실제 실험적 합성 및 비정질 홀 효과에 대한 수송 현상 측정이 뒤따를 것으로 보입니다.", "concepts": [{"term": "Anomalous Hall Effect", "why_emerged": "강자성체에서 자기장 없이도 발생하는 비대칭 전하 흐름을 설명하기 위해 도입됨.", "origin": "Hall (1881)에 의해 발견된 일반 홀 효과의 확장판.", "connections": "Berry 곡률, 스핀-궤도 결합, 위상 자성체와 밀접함."}, {"term": "Perpendicular magnetic anisotropy", "why_emerged": "초고밀도 자기 기록 매체 등에서 자기 모멘트가 면 수직 방향을 향하게 하여 안정성을 높이기 위함.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "계면 이방성, 결정장 효과와 연결됨."}], "english_summary": ["Demonstrated room-temperature ferromagnetism in freestanding GdM2 (M=Cu, Ag, Au) monolayers.", "Substrate removal enhances exchange interactions and modifies structural buckling.", "Freestanding GdAu2 shows perpendicular magnetic anisotropy and anomalous Hall effect.", "Provides a promising platform for 2D magnetic and topological spintronics."]}}, {"title": "Two-dimensional helical superconductivity and gapless superconducting edge modes in the heterophase 1T′−WS2/2H−WS2 bilayer", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/lqry-yq57", "authors": "Xuance Jiang, Jennifer Cano, Yuan Ping, Yafis Barlas, Deyu Lu", "last_authors": "Yafis Barlas, Deyu Lu", "summary": "We propose a material platform comprising transition-metal dichalcogenide (TMDC) heterostructures to realize two-dimensional (2D) helical superconductivity with an intrinsic gap. By van der Waals stacking a 2D superconductor ($1{T}^{′}\\text{−}{\\mathrm{WS}}_{2}$ with inversion symmetry) on top of a 2…", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Predicts helical superconductivity in a specific TMDC vdW heterostructure, highly relevant to topological interests.", "tags": ["material", "TMDC", "superconductivity"], "image": "", "briefing": {"background": "TMDC(전이금속 디칼코게나이드)의 반데르발스 헤테로 구조는 층 간의 대칭성 깨짐이나 밴드 엔지니어링을 통해 위상적 특성을 조절할 수 있는 매우 유연한 플랫폼입니다.", "motivation": "1T'-WS2와 2H-WS2 헤테로 구조에서 나타날 수 있는 2차원 헬리컬 초전도성과 에지 모드의 존재를 예측하고자 했습니다.", "result": "1T'-WS2(초전도체)와 다른 층을 쌓아 inversion symmetry를 조절함으로써, 헬리컬 초전도 상태와 위상적인 에지 모드가 발현될 수 있음을 제안했습니다.", "implication": "TMDC 헤테로 구조가 위상 초전도체나 마요라나 페르미온을 탐구하는 새로운 플랫폼이 될 수 있음을 의미합니다.", "novelty": "구조적 헤테로 구조를 이용해 초전도성 내에 위상적 특성(헬리컬 에지 모드)을 도입할 수 있음을 이론적으로 규명한 점이 돋보입니다.", "unresolved": "제시된 모델에서 가정한 헤테로 구조의 계면 결함이나 도핑 농도에 따른 위상적 특성의 견고함(robustness)은 미지수입니다.", "future_work": "이러한 초전도 갭의 위상적 기원을 밝히기 위한 ARPES 측정 및 에지 전류 측정 실험이 요구됩니다.", "concepts": [{"term": "Helical superconductivity", "why_emerged": "스핀과 운동량이 고정된 상태에서 발생하는 특이한 초전도성으로 위상적 상태를 기술하기 위해 필요함.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "위상 절연체, 스핀-궤도 결합, 마요라나 페르미온과 관련됨."}, {"term": "1T'-WS2", "why_emerged": "TMDC의 동질이상(polymorph) 중 위상적 특성을 가진 금속/초전도 위상을 찾기 위함.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "위상 반금속, TMDC 밴드 구조 연구와 연결됨."}], "english_summary": ["Proposed a 1T'-WS2/2H-WS2 vdW heterostructure for 2D helical superconductivity.", "Utilizes inversion symmetry breaking to host gapless superconducting edge modes.", "Suggests this platform is suitable for realizing topological superconducting states.", "Offers a theoretical framework for future experimental realization in TMDC heterostructures."]}}, {"title": "Altermagnetism in Quasicrystals", "journal": "PRL_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/src1-b2xt", "authors": "Rui Chen, Bin Zhou, Dong-Hui Xu", "last_authors": "Bin Zhou, Dong-Hui Xu", "summary": "Altermagnets are a recently discovered class of magnetic materials that combine a collinear, zero-magnetization spin structure, characteristic of antiferromagnets, with spin-split electronic bands, a hallmark of ferromagnets. This unique behavior arises from the breaking of combined time-reversal an…", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Direct interest: altermagnetism in novel quasicrystal materials.", "tags": ["theory", "altermagnetism", "quasicrystals", "magneticmaterials"], "image": "", "briefing": {"background": "알터마그넷(Altermagnet)은 기존의 강자성과 반강자성 분류를 넘어, 순자화는 0이면서 전자 밴드 구조에서 스핀 분할이 발생하는 새로운 자기적 질서 형태입니다.", "motivation": "결정학적 대칭성이 낮은 준결정(Quasicrystal) 구조에서도 알터마그네틱 상태가 구현될 수 있는지, 그 이론적 가능성과 물성을 탐구하고자 합니다.", "result": "준결정의 비주기적 대칭성이 어떻게 시간 반전 대칭성과 결정 대칭성의 결합을 깨뜨려 알터마그네틱 스핀 분할을 유도하는지 확인했습니다.", "implication": "알터마그네틱 현상이 주기적 격자를 넘어 준결정과 같은 복잡한 위상 구조에서도 나타날 수 있음을 보임으로써 해당 분야의 외연을 넓혔습니다.", "novelty": "기존의 알터마그넷 연구가 대부분 단순한 주기적 격자에 집중된 반면, 비주기적 준결정 시스템으로 대상을 확장했다는 점에서 차별화됩니다.", "unresolved": "실제 준결정 화합물에서 이 상태가 얼마나 안정적으로 존재할 수 있는지에 대한 실험적 증거는 아직 부족합니다.", "future_work": "해당 이론을 만족하는 구체적인 준결정 물질의 전자 구조 계산(DFT) 및 ARPES를 통한 밴드 분할 관측 연구가 필요합니다.", "concepts": [{"term": "Altermagnetism", "why_emerged": "반강자성체의 제로 순자화와 강자성체의 스핀 분할 밴드 특성을 동시에 갖춘 물질이 필요해짐", "origin": "최근 2020년대 초반 이론적으로 정립됨", "connections": "스핀트로닉스, 비상반적 수송 현상"}, {"term": "Quasicrystal", "why_emerged": "결정 격자의 주기성은 없으나 회전 대칭성은 가지는 고체의 존재 증명", "origin": "Dan Shechtman (1982)", "connections": "준주기적 위상 절연체, 복잡한 에너지 스펙트럼"}], "english_summary": ["Explores the emergence of altermagnetism in quasicrystalline systems.", "Identifies that non-periodic symmetries can break time-reversal and crystal symmetry combinations.", "Expands the scope of altermagnetic materials beyond periodic lattices.", "Provides a theoretical framework for future investigation in non-periodic solids."]}}, {"title": "Anyon Dispersion from Nonuniform Magnetic Field on the Sphere", "journal": "PRL_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/gzdq-wkxj", "authors": "Mina-Lou Schleith, Tomohiro Soejima (副島智大), Eslam Khalaf", "last_authors": "Tomohiro Soejima (副島智大), Eslam Khalaf", "summary": "The discovery of fractional quantum anomalous Hall states in moiré systems has raised the possibility of realizing phases of itinerant anyons, whose mobility requires the absence of continuous magnetic translation symmetry (CMTS). Motivated by this, we consider anyons on the sphere in ", "Controls Kondo hybridization to manipulate quantum phases.", "Provides a platform to study the interplay between localized moments and itinerant electrons.", "Validates the use of moiré systems as heavy fermion analogs."]}}, {"title": "Intrinsic Nernst Effect from Berry Curvature in Superconductors", "journal": "PRL_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/jhgx-c8f1", "authors": "Tzu-Chi Hsieh, Cong Xiao, Yi-Ting Hsu", "last_authors": "Cong Xiao, Yi-Ting Hsu", "summary": "The Nernst effect acts as direct probe of Berry curvature to test topological superconductivity in 2D material with spin-orbit coupling.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Berry curvature and topological superconductivity in 2D materials with experimental probe.", "tags": ["experiment", "theory", "Berrycurvature", "topologicalsuperconductor", "2Dmaterials"], "image": "", "briefing": {"background": "위상적 초전도체에서 발생하는 베리 곡률(Berry curvature)은 전하와 열 수송에 독특한 효과를 주며, 이를 검출하는 것은 위상 상태의 핵심적인 증거임.", "motivation": "초전도 상태에서 베리 곡률이 어떻게 넌스트 효과(Nernst effect)에 기여하는지 이론적으로 분석하고, 이를 위상 초전도체의 탐침으로 제안함.", "result": "스핀-궤도 결합이 있는 2D 초전도체에서 베리 곡률로 인해 발생하는 비정상 넌스트 효과를 유도함.", "implication": "위상 초전도 후보 물질에서 열-전기 수송 현상만으로 위상 상태를 확인할 수 있는 실질적인 실험 가이드를 제공함.", "novelty": "베리 곡률이 위상 초전도체의 주요 물리적 특성임을 명시하고, 실험적으로 측정 가능한 물리량을 제안하여 독자의 실험적 연구와 밀접하게 연결됨.", "unresolved": "초전도 갭 내부의 준입자 상태가 온도에 따라 어떻게 기여하는지, 그리고 실제 복잡한 밴드 구조에서의 정량적 해석 문제.", "future_work": "위상 초전도 후보 물질(예: 2D 물질 기반)에서의 저온 넌스트 효과 측정 실험.", "concepts": [{"term": "넌스트 효과", "why_emerged": "온도 기울기가 있을 때 자기장 방향에 수직인 전압이 생기는 현상으로, 전하 운반자의 위상적 성질을 탐지하기 위해 사용됨.", "origin": "Nernst (1886).", "connections": "비정상 홀 효과, 위상 물성."}, {"term": "베리 곡률", "why_emerged": "양자화된 위상 상태와 운동량 공간에서의 곡률 기하학을 연관시키기 위해 필요.", "origin": "Berry (1984).", "connections": "위상 절연체, 비정상 홀 효과, 궤도 자기 모멘트."}], "english_summary": ["Analyzes the intrinsic Nernst effect arising from Berry curvature in superconductors.", "Proposes the Nernst effect as a diagnostic probe for topological superconductivity.", "Focuses on 2D systems with strong spin-orbit coupling.", "Establishes a transport-based detection method for topological phases in superconductors."]}}, {"title": "NMR Evidence for Spontaneous Electronic Chiral Order in URhSn", "journal": "PRL_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/1vjx-4jfv", "authors": "Y. Tokunaga, T. Ishitobi, H. Sakai, S. Kambe, H. Harima, A. Nakamura, A. Maurya, D. Li, Y. Homma, F. Honda, D. Aoki, and Y. Shimizu", "last_authors": "Y. Homma, F. Honda, D. Aoki, and Y. Shimizu", "summary": "The first direct evidence of spontaneous electronic chiral order in URhSn, a strongly correlated material without an inherently chiral lattice structure, fundamentally challenges the prevailing notion that electronic chirality requires a chiral crystal framework.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Electronic chiral order in correlated materials is directly relevant to interest in loop current/TRSB.", "tags": ["NMR", "correlated", "chiralorder"], "image": "", "briefing": {"background": "강상관계 물질에서 자발적 대칭성 깨짐은 새로운 양자 상태를 이해하는 핵심 열쇠입니다. 특히 시간 역전 대칭성이나 공간 반전 대칭성이 깨지는 현상은 루프 전류나 비통상적 초전도체 연구의 주요 주제입니다.", "motivation": "URhSn은 결정 구조 자체가 키랄(chiral)하지 않음에도 불구하고 물리적 특성에서 키랄성이 나타날 가능성이 제기되어 왔으며, 이를 실험적으로 증명하고자 했습니다.", "result": "NMR 측정을 통해 결정 구조와 무관하게 전자 상태에서 자발적으로 발생하는 키랄 순서(electronic chiral order)를 직접 관측했습니다.", "implication": "결정 구조가 비대칭적이어야만 키랄 현상이 나타난다는 기존의 통념을 뒤집었으며, 전자 상호작용만으로도 복잡한 질서 변수가 발생할 수 있음을 보여줍니다.", "novelty": "외부 자기장이나 결정 구조의 도움 없이 순수하게 전자적 기원에 의한 키랄 질서가 규명된 사례로, AV3Sb5 등에서 연구되는 TRSB(시간 역전 대칭성 깨짐) 현상과 맥락을 같이합니다.", "unresolved": "이 전자적 키랄 질서가 발생하는 미시적인 구동 메커니즘과 이것이 페르미 표면의 특정한 중첩(nesting) 또는 다체 상호작용과 어떻게 연결되는지는 추가 연구가 필요합니다.", "future_work": "이 전자적 키랄 질서가 자성이나 초전도성과 어떤 상관관계를 맺는지 조사하고, 다른 U-기반 강상관계 물질에서의 보편성을 검증할 필요가 있습니다.", "concepts": [{"term": "Electronic Chiral Order", "why_emerged": "결정 구조의 대칭성만으로는 설명되지 않는 물리적 현상을 전자적 질서 변수로 설명하기 위해 도입됨.", "origin": 연구되어 왔습니다.", "motivation": "알터자성의 정의를 주기적 결정 구조를 넘어 비주기적 구조를 가진 준결정(quasicrystal)으로 확장할 수 있는지 탐구하고자 했습니다.", "result": "준결정 구조에서도 특정 대칭성을 이용해 모멘텀 의존적인 스핀 분할을 생성하는 알터자성 상태가 존재할 수 있음을 이론적으로 증명했습니다.", "implication": "알터자성 물질의 범위를 비주기적 시스템으로 획기적으로 넓혔으며, 복잡한 결정 구조를 가진 물질에서의 새로운 물리적 현상 탐색을 가능하게 합니다.", "novelty": "주기성이 깨진 시스템에서 알터자성 현상을 구현하는 논리적 경로를 제시했다는 점에서 혁신적입니다.", "unresolved": "실제 준결정 화합물에서 이 상태가 안정적으로 나타날 수 있는지, 그리고 실험적으로 어떻게 검증할 것인지에 대한 구체적인 물질 후보군과 방법론이 필요합니다.", "future_work": "실제 실험에서 활용 가능한 준결정 물질 설계 및 ARPES를 통한 스핀-편향 밴드 구조 측정 시도.", "concepts": [{"term": "Altermagnetism", "why_emerged": "반강자성체이면서도 강자성과 유사하게 스핀-편향 밴드 구조를 가지는 시스템을 분류하기 위해 등장.", "origin": "최근 3~4년 내 확립, 특정 연구 그룹 주도.", "connections": "반강자성, 비정상 홀 효과, 스핀트로닉스"}, {"term": "Quasicrystals", "why_emerged": "회전 대칭성은 있으나 병진 대칭성이 없는 고체 구조를 이해하기 위해 도입됨.", "origin": "Dan Shechtman(1982)", "connections": "펜로즈 타일링, 비주기적 배열"}], "english_summary": ["Extends the concept of altermagnetism from periodic crystals to quasicrystals.", "Utilizes a hyperspatial projective construction to show momentum-dependent spin splitting in aperiodic systems.", "Significantly expands the design space for magnetic topological materials.", "Establishes a theoretical foundation for exploring unconventional magnetism in non-periodic lattice structures."]}}, {"title": "Step geometry–guided growth of rhombohedral graphene", "journal": "Science", "source": "Gemini", "link": "https://doi.org/10.1126/science.aed9202", "authors": "Mengze Zhao, Zhibin Zhang, Xin Sui, et al.", "last_authors": "Xiaobo Lu, Kaihui Liu", "summary": "Rhombohedral (ABC)–stacked graphene has emerged as a platform for exploring correlated and topological physics. However, its large-scale, pure-phase synthesis has been hindered by intrinsic thermodynamic metastability and kinetic instability. In this work, we introduce a step geometry–guided epitaxial strategy to deterministically control interlayer slip, enabling the synthesis of pure-phase rhombohedral graphene. Using this approach, we obtained pure (phase purity > 99%) rhombohedral graphene with an area reaching 160 micrometers by 80 micrometers and thickness ranging from ~15 layers to ~120 nanometers. The resulting samples establish the first comprehensive reference dataset of Raman fingerprints and intrinsic band structures from few-layer films to ~200-layer bulk. Electronic transport measurements reveal a layer-antiferromagnetic state and the quantum anomalous Hall effect, enabling scalable exploration of next-generation quantum science and technology applications.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Experimental study of quantum anomalous Hall effect in rhombohedral graphene, relevant to topological magnetism.", "tags": ["graphene", "topological", "magnetism", "transport"], "image": "", "briefing": {"background": "그래핀은 적층 구조에 따라 전기적, 위상학적 성질이 크게 달라집니다. 특히 ABC 적층(Rhombohedral) 구조는 평탄한 밴드와 강한 상관관계, 위상학적 물리 현상을 탐구할 수 있는 핵심 플랫폼이지만, 열역학적으로 불안정하여 대면적 합성이 매우 어려웠습니다.", "motivation": "기존의 무작위적인 적층 제어 방식에서 벗어나, 기판의 단차(step) 기하학적 구조를 이용해 층간 미끄러짐을 정밀하게 제어함으로써 고순도의 ABC 적층 그래핀을 대면적으로 합성하고자 했습니다.", "result": "99% 이상의 순도를 가진 ABC 적층 그래핀을 최대 160x80 마이크로미터 크기로 합성하는 데 성공했습니다. 이를 통해 층 수에 따른 라만 분광 데이터셋을 확보하고, 층간 반강자성 상태 및 양자 변칙 홀 효과(QAH)를 실험적으로 확인했습니다.", "implication": "고품질의 ABC 그래핀을 대량으로 얻을 수 있게 됨으로써, 모아레 시스템이나 강상관 위상 물성을 연구하는 데 있어 안정적인 플랫폼을 확보하게 되었습니다.", "novelty": "기존의 물리적 박리 방식 대신 '단차 유도 성장법'이라는 새로운 합성 전략을 도입하여 위상 물성 연구의 스케일업 가능성을 열었습니다.", "unresolved": "매우 두꺼운 샘플에서 나타나는 물성의 복잡한 기원에 대한 추가적인 미세 분광 분석이 필요할 수 있습니다.", "future_work": "QAH 효과를 활용한 퀀텀 컴퓨팅 소자 구현이나, 더 두꺼운 샘플에서 나타나는 강상관 현상의 상세 메커니즘 연구.", "concepts": [{"term": "ABC-stacking", "why_emerged": "그래핀 층들이 반복적으로 어긋나며 쌓일 때 나타나는 독특한 밴드 구조와 위상학적 특성을 연구하기 위해 필요함.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "Bernal(AB) 적층과 대조적이며, 평탄한 밴드 구조로 인해 초전도성이나 강자성 연구의 토대가 됨."}, {"term": "Quantum Anomalous Hall Effect (QAH)", "why_emerged": "외부 자기장 없이도 자성 물질 내부의 위상학적 구조에 의해 양자화된 홀 저항을 얻기 위함.", "origin": "Haldane(1988)의 이론적 제안.", "connections": "위상 절연체, 자기적 위상 물질과 밀접하게 연관됨."}], "english_summary": ["Developed a step-guided epitaxial growth method for large-scale, high-purity rhombohedral (ABC) stacking graphene.", "Achieved over 99% phase purity with samples up to 160x80 micrometers.", "Confirmed layer-antiferromagnetic state and quantum anomalous Hall effect via transport measurements.", "Provides a reliable material platform for studying correlated and topological phases in multilayer graphene systems."]}}, {"title": "Van der Waals template–encoded soft epitaxy of tellurium enabled by atomic layer deposition", "journal": "Science_Advances", "source": "Gemini", "link": "https://doi.org/10.1126/sciadv.aef1430", "authors": "Changhwan Kim, Hyeon Cho, Chuqiao Shi, et al.", "last_authors": "Bonggeun Shong, Joonki Suh", "summary": "Van der Waals (vdW) epitaxy can integrate lattice-mismatched crystals with atomically sharp, pristine interfaces. However, translating this concept to atomic layer deposition (ALD), a standard for low-temperature, layer-by-layer growth, remains challenging because precursors adsorb transiently on chemically inert vdW basal planes, leading to physisorption-limited nucleation and poor crystalline ordering. Here, we introduce diffusion-steered epitaxial ALD (Epi-ALD), redefining vdW surfaces as programmable kinetic-thermodynamic landscapes and demonstrate highly crystalline tellurium at 150°C. Epi-ALD couples surface-potential-encoded physisorption with long-range diffusion to promote ordered nucleation and epitaxial alignment. This “soft” pathway enables strain-free tellurium epitaxy with a pristine vdW gap (∼1.4 angstrom) despite lattice mismatch (>3.6%) and generalizes across multiple vdW templates. Retaining hallmark advantages of ALD including scalability and uniformity, we further program in-plane orientation through vdW symmetry engineering to achieve quasi-single-crystalline tellurium films with pronounced anisotropy and a chiral anomaly signature. Our work establishes a universal, low-thermal-budget approach for integrating vdW materials and expands the scope of epitaxy within the ALD paradigm.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Van der Waals epitaxy of tellurium with chiral anomaly signature; relevant to topological materials.", "tags": ["van_der_Waals", "epitaxy", "tellurium", "chiral_anomaly", "topological_materials", "materials_synthesis"], "image": "", "briefing": {"background": "반데르발스(vdW) 물질은 층간 결합이 약해 서로 다른 재료를 접합하기 좋지만, 기존 원자층 증착(ALD) 공정에서는 기판 표면의 화학적 비활성 때문에 고품질 박막 성장이 어려웠습니다.", "motivation": "표면 잠재 에너지를 제어하여 원자의 확산을 유도하는 '확산 제어형 에피택셜 ALD(Epi-ALD)' 기술을 통해 tellurium(Te)의 저온 고결정성 성장을 구현하고자 했습니다.", "result": "150도라는 낮은 온도에서 변형이 없는 고품질 Te 박막을 성공적으로 합성했습니다. 특히 원자층의 방향성을 제어하여 카이랄 이상(chiral anomaly) 신호를 관측했습니다.", "implication": "기존의 복잡한 물리적 증착 대신 ALD 공정으로 위상 물질을 대면적/균일하게 합성할 수 있는 범용적인 경로를 제시했습니다.", "novelty": "ALD 공정에 vdW 에피택시 개념을 성공적으로 결합하여 격자 불일치가 큰 물질 간에도 고품질 계면을 형성할 수 있음을 증명했습니다.", "unresolved": "성장된 박막의 결함 농도가 전하 수송 특성에 미치는 정량적 영향.", "future_work": "다양한 vdW 물질로의 확장 및 카이랄 물성을 이용한 비선형 홀 효과 등 차세대 소자 응용.", "concepts": [{"term": "Van der Waals epitaxy", "why_emerged": "기판과 박막 간의 격자 정합성이 맞지 않아도 층간 인력만을 이용해 결정성 박막을 성장시키기 위해 필요함.", "origin": "Koma et al. (1984).", "connections": "2D 소재와 고체 소자 집적 기술의 핵심."}, {"term": "Chiral Anomaly", "why_emerged": "Weyl 반금속 등에서 위상학적 특성을 수송 현상으로 확인하기 위해 필요함.", "origin": "입자 물리학에서 기원하여 고체 물리학으로 확장됨.", "connections": "음의 자기저항(Negative Magnetoresistance) 현상과 직접 연결됨."}], "english_summary": ["Introduced Epi-ALD to grow high-quality crystalline tellurium on vdW templates at low temperatures.", "Successfully mitigated lattice mismatch issues through diffusion-steered epitaxial alignment.", "Demonstrated anisotropic transport and chiral anomaly signatures in the grown tellurium films.", "Provides a scalable and universal ALD-based method for integrating topological vdW materials."]}}, {"title": "Fermi surface topology of the topological nodal-loop semimetal HfP2", "journal": "npj_QuantumMaterials", "source": "Gemini", "link": "https://www.nature.com/articles/s41535-026-00926-z", "authors": "Yong Zhang, Yonglong Xue, Sutao Sun, et al.", "last_authors": "Yan Bin Chen, Yan-Feng Chen", "summary": "Fermi surface topology of the topological nodal-loop semimetal HfP 2", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Relevant topological semimetal study; maps directly to interest in topological band structures.", "tags": ["topological", "semimetal", "Fermisurface"], "image": "https://pubads.g.doubleclick.net/gampad/ad?iu=/285/npjquantmats.nature.com/article&sz=728x90&c=-898600805&t=pos%3Dtop%26type%3Darticle%26artid%3Ds41535-026-00926-z%26doi%3D10.1038/s41535-026-00926-z%26subjmeta%3D301,639,766%26kwrd%3DMaterials+science,Physics", "briefing": {"background": "위상 반금속은 전자 구조 내에서 밴드가 교차하는 노드(node)가 존재하며, 이는 독특한 물리적 현상을 유도합니다. 특히 노달 루프(Nodal-loop) 구조는 페르미 면이 고리 모양으로 형성되는 특징을 가집니다.", "motivation": "HfP2 물질에서 이론적으로 예측된 위상 노달 루프 구조를 실제 페르미 면과 밴드 구조 측면에서 실험적으로 검증하고자 했습니다.", "result": "초록의 내용이 매우 간략하여, HfP2의 페르미 면 위상학을 규명하는 데 ARPES 등이 활용되었음을 알 수 있습니다. 정확한 실험적 결론은 원문을 확인해야 하나, 위상 반금속으로서의 구조적 증거를 제시한 것으로 보입니다.", "implication": "HfP2가 새로운 위상 노달 루프 물질로서, 위상 물성 연구의 또 다른 실험적 후보군이 됨을 시사합니다.", "novelty": "새로운 위상 물질 후보군인 HfP2에 대한 전자 구조 정보를 제공하여 기존 이론 모델을 검증했습니다.", "unresolved": "물질의 위상적 불변성(topology invariant)에 대한 구체적인 수치나, 해당 페르미 면이 실제 수송 현상에 미치는 영향은 원문 확인이 필수적입니다.", "future_work": "이 물질에서의 자기 저항, 비정상 홀 효과 등 위상 관련 수송 특성 연구.", "concepts": [{"term": "Nodal-loop semimetal", "why_emerged": "브릴루앙 영역 내에서 밴드 교차점이 점이 아닌 고리(loop) 형태로 분포하는 위상 물질을 분류하기 위해 필요함.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "Weyl 반금속, Dirac 반금속과 함께 위상 반금속의 주요 카테고리."}, {"term": "Fermi surface", "why_emerged": "금속 및 반금속의 전기적, 열적 성질을 이해하는 데 가장 핵심적인 에너지 상태 지도를 시각화하기 위해 필요함.", "origin": "Sommerfeld 모형(1928).", "connections": "ARPES를 통한 실험적 측정의 대상."}], "english_summary": ["Investigated the Fermi surface topology of the HfP2 nodal-loop semimetal.", "Provides experimental insight into the electronic structure of this topological semimetal.", "Confirms the presence of nodal-loop features in the band structure of HfP2."]}}, {"title": "Mirror-selective quasiparticle interference in bilayer nickelate superconductor", "journal": "npj_QuantumMaterials", "source": "Gemini", "link": "https://www.nature.com/articles/s41535-026-00913-4", "authors": "Zhongyi Zhang, Jun Zhan, Congcong Le, Hoi Chun Po, Jiangping Hu, Xianxin Wu", "last_authors": "Jiangping Hu, Xianxin Wu", "summary": "Mirror-selective quasiparticle interference in bilayer nickelate superconductor", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "STM/STS study on nickelate superconductor electronic structure.", "tags": ["nickelate", "superconductivity", "STM/STS"], "image": "https://pubads.g.doubleclick.net/gampad/ad?iu=/285/npjquantmats.nature.com/article&sz=728x90&c=1419123047&t=pos%3Dtop%26type%3Darticle%26artid%3Ds41535-026-00913-4%26doi%3D10.1038/s41535-026-00913-4%26subjmeta%3D301,639,766%26kwrd%3DMaterials+science,Physics", "briefing": {"background": "니켈 산화물(nickelate) 초전도체는 구리 산화물(cuprate)과 유사한 전자 구조를 가져 고온 초전도 메커니즘을 이해하는 핵심 플랫폼으로 주목받고 있습니다.", "motivation": "이 연구는 최근 발견된 이층(bilayer) 니켈 산화물 초전도체의 전자 구조 및 준입자 산란 특성을 이해하여 초전도성 기원을 밝히고자 합니다.", "result": "거울 대칭(mirror symmetry)에 선택적인 준입자 간섭(QPI) 패턴을 이론적으로 분석하여, 전자 상태의 대칭성이 어떻게 국소적인 불순물 산란에 반영되는지 규명했습니다.", "implication": "STS(주사 터널링 분광법)를 통해 이층 니켈 산화물의 밴드 구조와 초전도 갭의 대칭성을 직접적으로 확인할 수 있는 이론적 토대를 제공합니다.", "novelty": "이층 시스템 특유의 궤도 및 대칭성 결합 효과를 QPI 해석에 도입함으로써, 니켈 산화물 연구의 핵심인 페르미 표면 분석의 정밀도를 높였습니다.", "unresolved": "실제 실험적 STM/STS 측정 결과와 이론적 예측치 간의 정확한 정량적 일치 여부는 후속 실험 데이터가 필요합니다.", "future_work": "저온 STM을 이용한 실제 실험 데이터와의 비교 분석 및 도핑 변화에 따른 QPI 패턴의 진화 과정 연구.", "concepts": [{"term": "Quasiparticle Interference (QPI)", "why_emerged": "물질 내 불순물에 의한 산란된 전자파들의 간섭 현상을 통해 페르미 표면의 정보를 얻기 위해 도입됨.", "origin": "Hoffman et al. (Science, 2002).", "connections": "ARPES와 상보적인 도구로, 강상관 전자계의 페르미 표면 및 초전도 갭 이방성 연구에 필수적임."}, {"term": "Bilayer Nickelate", "why_emerged": "구리 산화물 초전도체와 유사한 물성을 구현하기 위해 적층 구조를 제어한 새로운 고온 초전도 후보 물질군.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "LaNiO2와 같은 무한층(infinite-layer) 니켈 산화물 계열의 확장판."}], "english_summary": ["Analyzes mirror-selective quasiparticle interference in bilayer nickelate superconductors.", "Provides a theoretical framework to interpret STM/STS data for these materials.", "Highlights the role of symmetry in determining quasiparticle scattering patterns.", "Connects bilayer electronic structure to superconducting gap symmetry."]}}, {"title": "Anomalous carrier dynamics in a van der Waals heterostructure with a Janus layer", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/6z3r-cn7t", "authors": "Yifan Wu, Yuee Xie, Han Wang, Yuanping Chen", "last_authors": "Han Wang, Yuanping Chen", "summary": "A two-dimensional (2D) Janus layer has different physical properties than a 2D non-Janus layer. When a van der Waals (vdW) heterostructure contains a Janus layer, some unusual phenomena different from those in a heterostructure made of two non-Janus layers are expected. Here, we study electronic str…", "tier": "B_IMPORTANT_CONDMAT", "score": "7", "reason": "Electronic structure and dynamics in vdW heterostructures, matching user's interest in 2D materials.", "tags": ["theory", "vdWheterostructure", "Januslayer"], "image": "", "briefing": {"background": "반데르발스(vdW) 이종접합은 층간 결합을 통해 새로운 양자 상태를 설계하는 강력한 도구이며, 특히 대칭성이 깨진 Janus 층은 층간 비대칭성을 극대화합니다.", "motivation": "Janus 층이 포함된 vdW 이종접합 구조에서 나타나는 독특한 전하 운반자 거동을 이론적으로 밝히고자 합니다.", "result": "Janus 층의 내재적 쌍극자 모멘트가 층간 전하 재분배를 유도하여, 일반적인 2D 이종접합과 차별화된 비정상적인 캐리어 동역학을 보임을 확인했습니다.", "implication": "Janus 층을 이용해 차세대 전자 소자나 광전자 소자에서 전하 운반자의 흐름을 제어할 수 있는 새로운 가능성을 제시합니다.", "novelty": "기존 대칭적 vdW 시스템과 차별화되는 Janus 층만의 비대칭적 효과가 전하 동역학에 미치는 영향을 체계적으로 정리했습니다.", "unresolved": "다양한 전이 금속 디칼코게나이드(TMD) Janus 물질 조합에 따른 보편적 물리 현상인지에 대한 추가적인 검증이 필요합니다.", "future_work": "Janus 층 기반 이종접합 소자 제작을 통한 전기적/광학적 특성 실험적 검증.", "concepts": [{"term": "Janus Layer", "why_emerged": "2D 층의 위아래 원자 종류를 다르게 하여 구조적 비대칭성을 강제로 도입하기 위해 고안됨.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "강한 스핀-궤도 결합 및 비대칭성에 의한 Rashba 효과 연구와 연결됨."}, {"term": "vdW Heterostructure", "why_emerged": "서로 다른 2D 물질을 적층하여 단일 물질에서는 나타나지 않는 새로운 물성을 창출하기 위해 필요함.", "origin": "Geim, Novoselov (Nature, 2013).", "connections": "Moire 격자 물성, 엑시톤 공학 등 다양한 응집물질물리학 분야의 핵심 플랫폼."}], "english_summary": ["Investigates the electronic dynamics in vdW heterostructures containing Janus layers.", "Shows that intrinsic dipole moments in Janus layers drive anomalous carrier transport.", "Compares properties with standard symmetric vdW heterostructures.", "Suggests implications for tunable electronic and optoelectronic device design."]}}, {"title": "Criticality of a pseudospin phase transition", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/k6z5-wvsf", "authors": "S. A. Andreeva, O. V. Orlov, A. V. Shchepetilnikov, G. A. Nikolaev, Ya. V. Fedotova, A. R. Khisameeva, A. A. Dremin, C. Reichl, W. Wegscheider, and I. V. Kukushkin", "last_authors": "A. A. Dremin, C. Reichl, W. Wegscheider, and I. V. Kukushkin", "summary": "We investigate the temperature dependence of the pseudospin phase transition at filling factor $ν=2$ in the quantum Hall regime. Experiments were performed on a high-quality, wide AlAs quantum well, where the pseudospin degree of freedom arises naturally from the near degeneracy and equivalence of t…", "tier": "B_IMPORTANT_CONDMAT", "score": "7", "reason": "Experimental investigation of phase transitions in the quantum Hall regime of high-quality semiconductor wells.", "tags": ["experiment", "quantumHall", "phaseTransition"], "image": "", "briefing": {"background": "양자 홀 효과 상태에서 준입자들의 스핀 및 가짜 스핀(pseudospin) 자유도는 위상학적 전이와 관련된 복잡한 질서 현상을 유발합니다.", "motivation": "AlAs 양자 우물에서 충전율(filling factor) 2일 때 나타나는 가짜 스핀 위상 전이의 임계 현상을 온도 의존성을 통해 분석하고자 합니다.", "result": "온도 변화에 따른 가짜 스핀 전이의 임계 거동을 실험적으로 관측하여 양자 홀 영역 내의 상호작용  field-theoretical basis for understanding suggested pathways for controlling hybrid topological matter through long-range interactions.", "tier": "B_IMPORTANT_CONDMAT", "score": "7", "reason": "Studies topological excitations in ferromagnetic superconductors, matching the user's broader interest in unconventional superconductivity.", "tags": ["theory", "skyrmions", "superconductivity"], "image": "", "briefing": {"background": "강자성 초전도체는 자기 질서와 초전도 상태가 공존하는 희귀한 물질 상태로, 위상학적 여기(topological excitations)들 간의 상호작용을 연구하는 중요한 플랫폼입니다.", "motivation": "강자성 내의 스카이뮴(skyrmion)과 초전도체의 자기 볼텍스(vortex)가 결합했을 때 형성되는 복합적 위상학적 결함의 물리적 성질과 상호작용을 이론적으로 규명하고자 함.", "result": "Ginzburg-Landau 이론을 통해 스카이뮴-볼텍스 쌍(SVP)이 에너지적으로 안정적인 결합 상태를 형성함을 보였으며, 이들 사이에 단거리 척력과 장거리 인력이 작용하여 클러스터링이 발생함을 확인함.", "implication": "복합 위상학적 여기를 제어함으로써 위상학적 물질의 물성을 조절하거나 새로운 양자 정보를 처리할 수 있는 물리적 기초를 제공함.", "novelty": "자기 텍스처와 초전도 볼텍스의 하이브리드 결합 상태를 해석적 모델로 접근하여, 위상학적 물질 제어를 위한 장거리 상호작용 메커니즘을 제시함.", "unresolved": "실제 실험적 강자성 초전도체 물질에서의 구체적인 SVP 형성과 직접적인 관측 방법은 여전히 도전 과제임.", "future_work": "다른 위상학적 결함과의 추가적인 상호작용 연구 및 외부 자기장에 의한 SVP 배열 조절 가능성 조사.", "concepts": [{"term": "스카이뮴(Skyrmion)", "why_emerged": "자기 물질에서 소용돌이 형태의 비자명한 위상학적 스핀 구조가 정보 저장 효율성을 높일 수 있음이 알려지며 주목받음.", "origin": "Tony Skyrme이 입자 물리학에서 처음 제안했으며, 이후 자기 물질에서 실험적으로 관측됨.", "connections": "위상학적 홀 효과, 스핀트로닉스, 양자 컴퓨팅 소자."}, {"term": "Ginzburg-Landau 이론", "why_emerged": "초전도 현상의 거시적 양자 상태를 위상학적 질서 변수로 설명하기 위해 필요함.", "origin": "Vitaly Ginzburg와 Lev Landau가 1950년 제안.", "connections": "상전이 이론, 볼텍스 격자, 초전도체의 임계 현상."}], "english_summary": ["Studies composite skyrmion-vortex pairs (SVPs) in ferromagnetic superconductors.", "Uses a Ginzburg-Landau model to reveal stable SVP bound states.", "Identifies a competition between short-range repulsion and long-range attraction.", "Provides a theoretical framework for manipulating hybrid topological excitations."]}}, {"title": "Machine learning protocol to identify pairing symmetries via quasiparticle interference imaging in asiparticle interference (QPI) imaging in Ising superconductors.", "Enhances the reliability of characterizing unconventional superconducting states.", "Demonstrates a systematic approach to bridging STM data with symmetry classification."]}}, {"title": "Proximate spin liquid ground state arising from competing stripy and 120∘ spin correlations in the triangular quantum antiferromagnet ErMgGaO4", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/9wx4-qd4h", "authors": "S. H.-Y. Huang, S. Petit, B. Yuan, Z. W. Cronkwright, C. Pinvidic, Y. Wang, et al.", "last_authors": "A. I. Kolesnikov, R. J. Cava, E. Kermarrec, and B. D. Gaulin", "summary": "ErMgGaO 4 is a quantum antiferromagnet, wherein pseudospin-½ degrees of freedom decorate two-dimensional triangular planes. Powder ErMgGaO 4 shows a freezing transition near T g ~ 2.5 K, about 1/6 of its Curie-Weiss temperature. The authors observe here a continuum of inelastic neutron scattering, and estimate are its spin-Hamiltonian within a theoretical J 1 - J 2 - Δ model. This places ErMgGaO 4 close to the quantum phase boundary between the expected spin liquid and the stripy ordered phases. Elastic scattering shows two-dimensional Warren lineshapes near T g , which elucidate the competition between stripy and 120° spin correlations.", "tier": "B_IMPORTANT_CONDMAT", "score": "7", "reason": "Neutron scattering study of spin correlations in a frustrated triangular lattice quantum antiferromagnet.", "tags": ["neutronscattering", "magnetism", "spinliquid"], "image": "", "briefing": {"background": "삼각 격자 양자 반강자성체는 강한 기하학적 좌절(frustration)로 인해 고전적 질서가 억제되며, 양자 스핀 액체와 같은 이국적인 양자 상태가 발현될 가능성이 커 연구 가치가 높음.", "motivation": "ErMgGaO4라는 새로운 양자 반강자성체에서 나타나는 복잡한 스핀 상관관계와 기저 상태의 물리적 기원을 밝히고자 함.", "result": "중성자 산란을 통해 시스템이 스핀 액체와 줄무늬(stripy) 질서 사이의 양자 위상 경계 근처에 위치하며, 120도 스핀 상관관계와 경쟁하고 있음을 확인.", "implication": "기하학적 좌절 시스템에서 스핀 액체 후보군을 확장하고, 물질의 조성 조절을 통한 양자 상전이 제어의 가능성을 보여줌.", "novelty": "삼각 격자에서의 서로 다른 ong Wang, Peng Zhou", "last_authors": "Chong Wang, Peng Zhou", "summary": "The ultimate goal of information storage is single-electron memory. Quantum mechanics predicts that two distinguishable quantum states can be realized by confining a single electron within an ultrasmall space. However, scaling down such devices paradoxically amplifies fringe capacitance effects, which hinders the experimental observation of single-electron memory. We report a two-dimensional single-electron memory device based on a coplanar drain-channel-source structure that suppressed fringe capacitance, exhibiting a nonvolatile threshold voltage shift of 0.5 volts after the change of a single electron. Two intriguing quantum behaviors have also been verified regarding the programming voltage. Additionally, we have predicted and observed a distinctive quantum memory effect: A quantum state is cut off by density of states scissors.", "tier": "B_IMPORTANT_CONDMAT", "score": "7", "reason": "Quantum memory device with single-electron control, relevant to quantum materials/devices.", "tags": ["quantumcomputing", "quantumdevice", "memory", "electrontransport"], "image": "", "briefing": {"background": "자동 브리핑을 생성하지 못했습니다. 초록과 원문 링크를 기준으로 빠르게 확인하세요.", "motivation": "초록 정보만으로는 분야 내부의 구체적 동기를 안정적으로 요약하기 어렵습니다.", "result": "The ultimate goal of information storage is single-electron memory. Quantum mechanics predicts that two distinguishable quantum states can be realized by confining a single electron within an ultrasmall space. However, scaling down such devices paradoxically amplifies fringe capacitance effects, which hinders the experimental observation of single-electron memory. We report a two-dimensional single-electron memory device based on a coplanar drain-channel-source structure that suppressed fringe capacitance, exhibiting a nonvolatile threshold voltage shift of 0.5 volts after the change of a single electron. Two intriguing quantum behaviors have also been verified regarding the progra   headText.appendChild(badges);
  const title = document.createElement('h1');
  if (r.link) { const titleLink = document.createElement('a'); titleLink.href = r.link; titleLink.target = '_blank'; titleLink.rel = 'noopener noreferrer'; titleLink.textContent = r.title || ''; title.appendChild(titleLink); }
  else { title.textContent = r.title || ''; }
  headText.appendChild(title);
  headText.appendChild(textEl('p', 'meta', [r.journal, r.source].filter(Boolean).join(' | ')));
  if (r.last_authors || r.authors) { const authors = document.createElement('p'); authors.className = 'authors'; if (r.last_authors) authors.append('Last authors: ' + r.last_authors); if (r.authors) authors.append((r.last_authors ? ' | ' : '') + 'Authors: ' + r.authors); headText.appendChild(authors); }
  appendLabeledText(headText, 'why', 'Filter reason: ', r.reason);
  if (r.tags && r.tags.length) { const tags = document.createElement('div'); tags.className = 'tags'; r.tags.forEach(tag => tags.appendChild(textEl('span', 'tag', '#' + tag))); headText.appendChild(tags); }
  if (r.link) { const link = document.createElement('a'); link.className = 'link'; link.href = r.link; link.target = '_blank'; link.rel = 'noopener noreferrer'; link.textContent = 'Open paper'; headText.appendChild(link); }
  head.appendChild(headText);
  if (r.summary) { const abstract = document.createElement('p'); abstract.className = 'original-abstract'; const strong = textEl('strong', '', 'Original abstract'); abstract.appendChild(strong); abstract.append(r.summary); head.appendChild(abstract); }
  slideEl.appendChild(head);
  const briefing = document.createElement('div');
  briefing.className = 'briefing';
  appendBriefSection(briefing, 'Background', b.background);
  appendBriefSection(briefing, 'Motivation', b.motivation);
  appendBriefSection(briefing, 'Result', b.result);
  appendBriefSection(briefing, 'Implication', b.implication);
  appendBriefSection(briefing, "Why it's important / Novelty", b.novelty);
  appendBriefSection(briefing, 'Unresolved Questions', b.unresolved);
  appendBriefSection(briefing, 'Expected Future Work', b.future_work);
  if (b.concepts && b.concepts.length) {
    const section = document.createElement('section');
    section.className = 'brief-section wide';
    section.appendChild(textEl('h2', '', 'Concepts / Terms'));
    const concepts = document.createElement('div');
    concepts.className = 'concepts';
    b.concepts.forEach(c => {
      const item = document.createElement('div');
      item.className = 'concept';
      item.appendChild(textEl('h3', '', c.term || 'Concept'));
      [['왜 생겼나: ', c.why_emerged], ['누가 만들었나: ', c.origin], ['연결되는 흐름: ', c.connections]].forEach(([label, text]) => { if (!text) return; const p = document.createElement('p'); const bold = textEl('b', '', label); p.appendChild(bold); p.append(text); item.appendChild(p); });
      concepts.appendChild(item);
    });
    section.appendChild(concepts);
    briefing.appendChild(section);
  }
  if (b.english_summary && b.english_summary.length) { const section = document.createElement('section'); section.className = 'brief-section wide'; section.appendChild(textEl('h2', '', 'English Summary')); const ul = document.createElement('ul'); b.english_summary.slice(0, 5).forEach(line => ul.appendChild(textEl('li', '', line))); section.appendChild(ul); briefing.appendChild(section); }
  slideEl.appendChild(briefing);
  counterEl.textContent = `${index + 1} / ${slides.length}`;
  prevBtn.disabled = index === 0;
  nextBtn.disabled = index === slides.length - 1;
}
prevBtn.addEventListener('click', () => { index = Math.max(0, index - 1); render(); });
nextBtn.addEventListener('click', () => { index = Math.min(slides.length - 1, index + 1); render(); });
document.addEventListener('keydown', event => { if (event.key === 'ArrowLeft') prevBtn.click(); if (event.key === 'ArrowRight') nextBtn.click(); });
render();
</script>
</body>
</html>
