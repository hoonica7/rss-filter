<!DOCTYPE html>

<title>Daily Paper Slideshow</title>
<style>
  :root {
    color-scheme: light;
    --bg: #f6f7f4;
    --paper: #ffffff;
    --ink: #111827;
    --muted: #64748b;
    --line: #d8ddd2;
    --accent: #176b87;
    --accent-2: #9a3412;
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; overflow: auto; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: var(--bg); color: var(--ink); }
  .shell { max-width: 1500px; min-height: 100vh; margin: 0 auto; padding: 14px 18px; display: flex; flex-direction: column; }
  .topbar { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 16px; }
  .top-actions { display: flex; align-items: center; gap: 10px; }
  .topbar a, button { border: 1px solid var(--line); border-radius: 8px; background: var(--paper); color: var(--ink); padding: 10px 14px; font-weight: 700; text-decoration: none; cursor: pointer; }
  button.primary { background: var(--accent); border-color: var(--accent); color: white; }
  button:disabled { opacity: 0.45; cursor: not-allowed; }
  .counter { color: var(--muted); font-weight: 700; }
  .slide { min-height: calc(100vh - 82px); background: var(--paper); border: 1px solid var(--line); border-radius: 10px; padding: 18px; box-shadow: 0 18px 42px rgba(15, 23, 42, 0.10); display: grid; grid-template-columns: minmax(310px, 0.86fr) minmax(0, 1.55fr); gap: 18px; overflow: visible; }
  .paper-head { min-width: 0; min-height: 0; overflow: visible; display: flex; flex-direction: column; gap: 12px; }
  .figure { margin: 0; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: #f8fafc; }
  .figure img { display: block; width: 100%; max-height: 41vh; object-fit: contain; background: white; }
  .figure figcaption { padding: 7px 10px; color: var(--muted); font-size: 12px; line-height: 1.3; }
  .head-text { display: flex; flex-direction: column; gap: 9px; min-width: 0; }
  .badges { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .badge { border-radius: 999px; padding: 5px 9px; background: #eef2ff; color: #3730a3; font-size: 12px; font-weight: 800; }
  .score { background: #fee2e2; color: #991b1b; }
  h1 { margin: 0; font-size: 25px; line-height: 1.15; letter-spacing: 0; overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
  h1 a { color: inherit; text-decoration-color: rgba(23, 107, 135, 0.35); text-decoration-thickness: 2px; text-underline-offset: 4px; }
  h1 a:hover { color: var(--accent); text-decoration-color: var(--accent); }
  .meta, .authors, .why, .abstract { font-size: 13px; line-height: 1.45; }
  .meta, .authors { color: var(--muted); }
  .why strong, .abstract strong, .authors strong { color: var(--ink); }
  .authors { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .why { border-left: 4px solid var(--accent-2); padding-left: 10px; color: #374151; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .abstract { border-top: 1px solid var(--line); padding-top: 14px; color: #374151; }
  .original-abstract { border-top: 1px solid var(--line); padding-top: 10px; color: #374151; font-size: 11.5px; line-height: 1.35; overflow-wrap: anywhere; }
  .original-abstract strong { display: block; margin-bottom: 4px; color: var(--ink); }
  .tags { display: flex; flex-wrap: wrap; gap: 8px; }
  .tag { border-radius: 999px; padding: 4px 8px; background: #f1f5f9; color: #475569; font-size: 12px; font-weight: 700; }
  .head-text > .link { display: none; }
  .briefing { min-width: 0; min-height: 0; overflow: visible; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); grid-auto-rows: minmax(0, auto); align-content: start; gap: 11px 18px; border-top: 0; padding-top: 0; }
  .brief-section { min-width: 0; }
  .brief-section.wide { grid-column: 1 / -1; }
  .brief-section h2 { margin: 0 0 4px; font-size: 14px; line-height: 1.22; color: #0f766e; letter-spacing: 0; }
  .brief-section p, .brief-section li { margin: 0; font-size: 12.5px; line-height: 1.42; color: #1f2937; overflow-wrap: anywhere; }
  .brief-section ul { margin: 0; padding-left: 20px; }
  .concepts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 9px 14px; }
  .concept { border-top: 1px solid var(--line); padding-top: 7px; }
  .concept h3 { margin: 0 0 4px; font-size: 13px; color: #7c2d12; letter-spacing: 0; }
  .concept p { margin: 2px 0 0; font-size: 11.5px; line-height: 1.35; color: #374151; overflow-wrap: anywhere; }
  .concept b { color: #111827; }
  .link { color: var(--accent); font-weight: 800; text-decoration: none; }
  .empty { padding: 48px; background: var(--paper); border: 1px solid var(--line); border-radius: 12px; color: var(--muted); }
  @media (max-width: 860px) {
    .shell { padding: 14px; }
    .topbar, .top-actions { align-items: stretch; flex-direction: column; }
    .slide, .briefing, .concepts { grid-template-columns: 1fr; }
    .slide { min-height: auto; overflow: visible; display: grid; }
    h1 { font-size: 28px; }
  }
</style>

<script>
const slides = [{"title": "Signatures of a light-induced exciton condensate exhibiting BEC-BCS crossover", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2608.20310", "authors": "Khanh Duy Nguyen, Gabriele Berruto, Yunhe Bai, et al.", "last_authors": "Y. Shirley Meng, Shuolong Yang", "summary": "Exciton condensates provide a platform to study quasiparticle pairing, Bose-Einstein condensation-Bardeen-Cooper-Schrieffer (BEC-BCS) crossover, and excitonic topological phenomena. Achieving a nonequilibrium exciton condensate allows the ultimate tunability of these emergent phenomena. Yet, evidence of a light-induced, nonequilibrium exciton condensate and its BEC-BCS crossover remains elusive. Here, we use time- and angle-resolved photoemission spectroscopy to demonstrate signatures of a non-equilibrium exciton condensate and its BEC-BCS crossover in monolayer MnBi2Te4. Following optical excitation, a distinctive hole-like dispersion representing excitons emerges and persists for >20 ps. Strikingly, energy-domain sharpening in the valence band occurs 2 ps after time zero and exhibits a sharp onset at a threshold pump fluence of 0.84 mJ/cm2. The delayed and strongly nonlinear response is difficult to reconcile with transient field effects or conventional carrier-induced band shifts but is consistent with a model of exciton condensation governed by a Berezinskii-Kosterlitz-Thouless transition. The estimated threshold exciton density agrees quantitatively with the Nelson-Kosterlitz critical density. At higher fluences, the exciton feature develops a camel-back-shaped dispersion, consistent with the BEC-BCS crossover in the condensate framework. Our work establishes ultrathin MnBi2Te4 as a model system for studying nonequilibrium exciton condensates with a connection to superconductivity and exciton-driven topological phases.", "tier": "A_MUST_READ", "score": "10", "reason": "TR-ARPES on monolayer MnBi2Te4 for exciton condensate; highly relevant to ARPES and topological materials.", "tags": ["ARPES", "topological", "monolayer", "superconductivity", "magnetism", "experiment"], "image": "https://arxiv.org/static/browse/0.3.4/images/arxiv-logo-fb.png", "briefing": {"background": "엑시톤 응축물(exciton condensate)은 전자와 정공이 결합하여 형성된 보존(boson) 상태로, 응집물질물리학에서 초전도 현상과 유사한 BEC-BCS 크로스오버를 관찰할 수 있는 중요한 시스템입니다. 위상절연체 MnBi2Te4와 같은 단층 시스템에서 이를 구현하면 비평형 상태의 위상적 물성을 제어할 수 있는 가능성이 열립니다.", "motivation": "열역학적 평형 상태에서 얻기 어려운 엑시톤 응축 현상을 빛을 이용한 비평형(nonequilibrium) 제어를 통해 유도하고, 이 과정에서 발생하는 BEC-BCS 크로스오버의 증거를 포착하기 위해 연구되었습니다.", "result": "시간 분해 광전자 분광법(TR-ARPES)을 사용하여 단층 MnBi2Te4에서 광 여기 후 20ps 이상 지속되는 정공 유사 분산(hole-like dispersion)을 발견했습니다. 특정 임계 플루언스(0.84 mJ/cm2) 이상에서 발생하는 밸런스 밴드의 에너지 Sharpening 현상은 Berezinskii-Kosterlitz-Thouless(BKT) 전이에 의한 엑시톤 응축 모델과 잘 일치하며, 고에너지 영역에서 나타나는 낙타 등(camel-back) 형태의 분산은 BEC-BCS 크로스오버를 시사합니다.", "implication": "단층 MnBi2Te4가 비평형 엑시톤 응축물과 초전도성, 그리고 위상적 상 전이를 연구할 수 있는 훌륭한 모델 시스템임을 입증했습니다.", "novelty": "기존의 carrier 유도 밴드 이동과 구별되는 비선형 응답을 TR-ARPES로 명확히 분리해냈으며, 2차원 위상 물질에서 BKT 물리와 BEC-BCS 크로스오버를 실험적으로 연결했다는 점에서 독보적입니다.", "unresolved": "엑시톤 응축이 발생하는 구체적인 마이크로스코픽 메커니즘과 그로 인해 변조되는 위상적 특성(Topological edge state 등)의 변화는 추후 검증이 필요합니다.", "future_work": "다른 2차원 위상 자성 물질로의 확장 연구 및 더 긴 시간 영역에서의 동역학적 특성 측정, 광 여기를 통한 위상 상 전이 직접 관찰 등이 예상됩니다.", "concepts": [{"term": "BEC-BCS crossover", "why_emerged": "강하게 결합된 보존(BEC)과 약하게 결합된 페르미온 쌍(BCS) 사이의 연속적인 변화를 이해하기 위해 필요함.", "origin": "Leggett (1980), Nozières와 Schmitt-Rink (1985) 등에 의해 이론화됨.", "connections": "고온 초전도체, 엑시톤 응축, 냉각 원자 가스 연구와 밀접."}, {"term": "Berezinskii-Kosterlitz-Thouless (BKT) transition", "why_emerged": "2차원 시스템에서 Mermin-Wagner 정리에 의해 깨진 장거리 질서를 위상학적 결함(vortex)의 쌍생성/해리로 설명하기 위해 도입됨.", "origin": "Berezinskii(1971), Kosterlitz와 Thouless(1973).", "connections": "2D XY 모델, 초유체 필름, 위상적 상전이."}, {"term": "TR-ARPES", "why_emerged": "물질의 비평형 전자 구조 및 동역학을 펨토초 단위의 시간 분해능으로 관측하기 위해 필수적.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "ARPES, 광여기 동역학, 초고속 분광학."}], "english_summary": ["Demonstrates signature of light-induced exciton condensate in monolayer MnBi2Te4 via TR-ARPES.", "Observes nonlinear spectral sharpening and camel-back dispersion consistent with BEC-BCS crossover.", "Evidence suggests the transition is governed by BKT physics with quantitative agreement with Nelson-Kosterlitz density.", "Establishes ultrathin MnBi2Te4 as a platform for nonequilibrium topological exciton physics."]}}, {"title": "Band structure of Na2KSb: Near-band-gap photoemission spectroscopy and density functional theory calculations", "journal": "PRB_Recent", "source": "keyword", "link": "http://link.aps.org/doi/10.1103/n3js-g2bn", "authors": "S. A. Rozhkov, V. V. Bakin, S. V. Eremeev, V. S. Rusetsky, V. A. Golyashov, D. A. Kustov, D. K. Orekhov, H. E. Scheibler, V. L. Alperovich, and O. E. Tereshchenko", "last_authors": "D. K. Orekhov, H. E. Scheibler, V. L. Alperovich, and O. E. Tereshchenko", "summary": "The electronic band structure of ${\\mathrm{Na}}_{2}\\mathrm{KSb}$ was studied by a combination of low-energy photoemission spectroscopy and density functional theory (DFT) calculations. The optical and photoemission quantum efficiency (QE) spectra, along with longitudinal energy distribution curves (…", "tier": "A_MUST_READ", "score": "9", "reason": "title strong match: photoemission", "tags": ["photoemission", "bandstructure"], "image": "", "briefing": {"background": "Na2KSb는 알칼리 금속 안티모나이드 계열로서 광전음극(photocathode) 재료로 널리 사용됩니다. 효율적인 광전자 방출을 위해 밴드 구조와 페르미 레벨 근처의 전자 상태에 대한 정밀한 실험적 규명이 필수적입니다.", "motivation": "기존 이론적 계산과 비교하여 Na2KSb의 전자 밴드 구조를 광전자 분광법으로 검증하고, 재료의 광전 효율을 결정짓는 밴드 갭 및 에너지 준위를 확립하고자 했습니다.", "result": "저에너지 광전자 분광법과 DFT 계산을 결합하여 Na2KSb의 전자 밴드 구조를 재확인하고, 광전 방출의 양자 효율 스펙트럼과 일치하는 밴드 매핑 데이터를 도출했습니다.", "implication": "고성능 광전음극 설계를 위한 기초 전자 구조 데이터를 제공하며, 해당 물질의 물성 해석에 표준 모델을 확립했습니다.", "novelty": "실험적 밴드 구조 데이터가 부족했던 Na2KSb의 물성을 최신 분광법으로 정밀하게 측정하여 이론 계산과의 불일치를 해소했습니다.", "unresolved": "표면 상태나 불순물이 광전 효율에 미치는 미세한 영향은 추가적인 STS 연구 등이 필요할 수 있습니다.", "fu  위상 초전도성의 실험적 증거를 확립했다는 점이 독자의 연구 관심사와 깊게 연관됩니다.", "unresolved": "실험 결과가 구체적으로 어떤 다중 상 구조를 형성하는지에 대한 미시적 원리는 추가 검증이 필요합니다.", "future_work": "초전도 상의 위상적 특징을 확인하기 위한 저온 상태에서의 정밀한 물리량 측정과 스핀-궤도 결합 강도의 정량적 분석이 기대됩니다.", "concepts": [{"term": "위상 초전도성", "why_emerged": "물질 내부의 토폴로지적 상태가 초전도성과 결합하여 마요라나 페르미온을 생성할 가능성 때문에 연구됩니다.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "마요라나 물리, 위상 절연체"}, {"term": "준일차원 물질", "why_emerged": "전자들 간의 강한 상관관계가 1차원적인 방향으로 특이하게 나타나 독특한 양자 위상을 형성하기 때문입니다.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "루팅어 액체, 스핀-전하 분리"}], "english_summary": ["This study presents the first definitive measurements of superconductivity in K2Cr3As3.", "The compound is identified as a platform for manipulating topological superconductivity.", "The findings highlight the complex superconducting phases inherent to quasi-1D materials."]}}, {"title": "Cavity-enhanced superconductivity in the two-dimensional limit of NbSe2", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2606.19171", "authors": "Hanxiang Zhang, Zexin Feng, I-Te Lu, et al.", "last_authors": "Angel Rubio, Weibo Gao", "summary": "Vacuum electromagnetic fluctuations have emerged as a means of controlling collective quantum phases without external driving. Cavity-induced modification of superconductivity has been widely predicted. What sets the size of the effect, and which microscopic channel carries it, remain open. Here we couple few-layer NbSe2 to a terahertz complementary split-ring resonator (CSRR) and show that the enhancement grows sharply on approaching the two-dimensional limit. In bilayer NbSe2 the superconducting transition temperature rises by 10%, from 3.02 K to 3.41 K, on a cavity resonant at 0.92 THz - roughly four times the shift measured in a ten-layer device at the same resonance. Within a single device the shift maps onto the simulated cavity field profile, falling from 0.39 K at the field maximum to zero outside the resonator, with the lower critical field following the same spatial ordering; because all regions are measured on one continuous flake in a single cooldown, sample-to-sample variation is excluded by construction. The frequency dependence is non-monotonic, with suppression below resonance and maximal enhancement near 0.96 THz. Quantum electrodynamical density functional theory calculations show that cavity coupling redistributes spectral weight in the Eliashberg function, weakening the total electron-phonon coupling while hardening the logarithmic average phonon frequency; competition between the two reproduces a sign change in Tc. These results identify dimensionality, local field amplitude and detuning as the control parameters of cavity-enhanced superconductivity, and point to electron-phonon reweighting as its microscopic origin.", "tier": "B_IMPORTANT_CONDMAT", "score": "9", "reason": "Experimental study of cavity-enhanced superconductivity in a relevant 2D material (NbSe2).", "tags": ["superconduct", "2Dmaterial", "experiment"], "image": "https://arxiv.org/static/browse/0.3.4/images/arxiv-logo-fb.png", "briefing": {"background": "진공 전자기 요동을 이용해 외부 구동 없이 물질의 양자 위상을 제어하려는 시도는 최근 광물질 상호작용 분야에서 큰 화두입니다.", "motivation": "NbSe2와 같은 2차원 초전도체에서 공동(cavity) 환경이 초전도 전이 온도(Tc)를 어떻게 조절하는지, 그리고 그 미시적 메커니즘을 밝히고자 합니다.", "result": "이중층 NbSe2에서 공동 모드와의 결합을 통해 Tc가 약 10% 증가함을 확인했으며, 이 현상이 공동 장의 프로파일과 일치함을 입증했습니다.", "implication": "차원성과 국소 장 진폭이 초전도성을 제어하는 핵심 파라미터임을 밝혀, 양자 전자기역학적(QED) 재료 공학의 가능성을 제시했습니다.", "novelty": "2차원 극한 영역에서 공동 결합을 통한 초전도성 향상을 실험적으로 입증하고, 전자-포논 결합의 재분배라는 물리적 원인을 규명했습니다.", "unresolved": "공동 모드와 초전도성 사이의 상호작용이 정확히 어떤 전자 대역에서 지배적인지는 추가 연구가 필요합니다.", "future_work": "다른 van der Waals 초전도체에 대한 확장 적용 및 광학적 제어를 통한 동적 위상 전환 연구가 예상됩니다.", "concepts": [{"term": "공동 강화 초전도성", "why_emerged": "진공 광자 환경을 이용하여 물질의 전자 구조나 포논 산란을 인위적으로 조절하기 위해 필요합니다.", "origin": "최근 이론적으로 광범위하게 제안됨", "connections": "QED-DFT, 초전도 제어"}, {"term": "Eliashberg 함수", "why_emerged": "강한 전자-포논 결합을 갖는 초전도체의 물성을 미시적으로 기술하기 위해 고안되었습니다.", "origin": "Eliashberg, 1960년대", "connections": "BCS 이론, 포논 스펙트럼"}], "english_summary": ["Cavity-induced enhancement of superconductivity is observed in bilayer NbSe2.", "The superconducting transition temperature increases by 10% in a terahertz resonator.", "The study identifies electron-phonon reweighting as the microscopic origin of this enhancement.", "Dimensionality and local field amplitude act as key control parameters for the effect."]}}, {"title": "Effects of the surface on double surface Fermi arcs in a realistic tight-binding model of Na3Bi (100)", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2608.20115", "authors": "Vasilios K. Passias, Lucas K. Wagner", "last_authors": "Vasilios K. Passias, Lucas K. Wagner", "summary": "Na$_3$Bi is a topological Dirac semimetal (TDSM) that can support double surface Fermi arcs (DSFAs), which are important for its material classification and their potential use in spintronic devices. However, it is unclear how the surfaces affect realistic Na$_3$Bi (100) systems. To investigate the effects of diverse surfaces on DSFAs, we consider first principles derived tight-binding models of two Na$_3$Bi (100) terminations. On the stoichiometric termination, we find DSFAs as expected. On the non-stoichiometric structure there are DSFAs on one termination and two loops that retain many of the properties of DSFAs. Thus, the local properties such as spin momentum locking and hybridization with the Dirac points appear to be more robust than their global connectivity. That is, the surface can reshape the arc fingerprint without destroying the arc-like physics.", "tier": "B_IMPORTANT_CONDMAT", "score": "9", "reason": "Electronic structure of topological Dirac semimetal Na3Bi with Fermi arcs, highly relevant.", "tags": ["material", "topological", "electronicstructure"], "image": "https://arxiv.org/html/2608.20115v1/fig1WSM_DSM_bulk_slab_Fermi_Arcs.png", "briefing": {"background": "나트륨-비스무트(Na3Bi)는 위상 디락 반금속의 대표적인 예로, 표면 상태와 그로 인한 페르미 아크는 스핀트로닉스 응용 가능성 때문에 중요합니다.", "motivation": "Na3Bi(100) 표면의 원자 배치(터미네이션) 변화가 토폴로지적 페르미 아크의 거동에 어떤 영향을 미치는지 밝히고자 합니다.", "result": "화학량론적 표면과 비화학량론적 표면 모두에서 페르미 아크의 물리적 특징(스핀-운동량 잠김 등)이 구조적 변화에도 불구하고 견고하게 유지됨을 확인했습니다.", "implication": "위상 반금속 소자 설계 시 표면의 미세한 구조 변화에 대해 시스템의 토폴로지적 성질이 매우 강건함을 시사합니다.", "novelty": "현실적인 타이트 바인딩 모델을 통해 실제 실험 환경에서 나타날 수 있는 표면 결함이 토폴로지적 상태를 파괴하지 않음을 증명했습니다.", "unresolved": "실제 실험에서 발생하는 복잡한 표면 재구조화가 페르미 아크의 미세한 비대칭성에 주는 영향은 여전히 남아 있습니다.", "future_work": "표면 상태 변화를 고려한 스핀-궤도 결합 기반 소자의 스핀 전류 효율성 측정 실험이 기대됩니다.", "concepts": [{"term": "디락 반금속", "why_emerged": "3차원 공간에서 디락 점이 위상적으로 보호되어 나타나는 에너지 구조를 설명하기 위해 필요합니다.", "origin": "Na3Bi 등에서 이론적으로 예측됨", "connections": "위상 절연체, 페르미 아크"}, {"term": "페르미 아크", "why_emerged": "위상 물질의 표면에서 bulk 상태의 위상적 특징이 투영되어 나타나는 열린 페르미 면입니다.", "origin": "Wan et al., 2011 (Weyl semimetals)", "connections": "위상 반금속, 스핀-운동량 잠김"}], "english_summary": ["This paper investigates the effects of surface termination on double surface Fermi arcs in Na3Bi.", "The study shows that spin-momentum locking is robust against surface structural changes.", "Topological surface states persist even when the surface geometry is reshaped.", "These findings support the resilience of topological semimetal properties for spintronic devices."]}}, {"title": "Engineering altermagnetic symmetry to enable anomalous Hall response in Cr1-xMnxSb", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2602.06173", "authors": "Miriam G. Fischer, Lukas Odenbreit, Olena Gomonay, et al.", "last_authors": "Mathias Kl\\\"aui, Martin Jourdan", "summary": "Altermagnets are a promising class of materials for spintronic applications. However, compounds that simultaneously combine the symmetry required to support an anomalous Hall effect with good metallic conductivity and magnetic ordering temperatures well above room temperature have remained elusive. Here, we demonstrate that partial substitution of Cr by Mn in epitaxial CrSb(100) thin films provides a viable route to engineer the combined structural and magnetic symmetry necessary to enable an otherwise symmetry-forbidden anomalous Hall effect. We systematically explore the magnetic phase diagram of Cr(Mn)Sb thin films including neutron diffraction. This allows us to identify a magnetic symmetry that supports the anomalous Hall effect, which we demonstrate in Cr(0.75)Mn(0.25)Sb. Guided by Landau theory, we model the field-driven reorientation of the Neel vector and the resulting anomalous Hall response, achieving good qualitative agreement with the experimental observations.", "tier": "B_IMPORTANT_CONDMAT", "score": "9", "reason": "Direct experimental study of altermagnetism and anomalous Hall effect in a magnetic material.", "tags": ["altermagnet", "anomalousHall", "material"], "image": "https://arxiv.org/html/2602.06173v2/Fig1.JPG", "briefing": {"background": "알터마그네틱(Altermagnetism)은 비상식적 자성체(collinear but non-relativistic spin-polarized)로, 시간 반전 대칭이 깨져 있으면서도 순 자화가 0인 새로운 자성 상태입니다. 이는 Spintronics 응용을 위한 새로운 물리적 자유도를 제공합니다.", "motivation": "알터마그네틱 물질에서 전도성과 높은 자기 전이 온도를 유지하면서, Anomalous Hall Effect(AHE)를 유도할 수 있는 대칭성을 공학적으로 구현하는 것이 난제였습니다.", "result": "CrSb(100) 박막에 Mn을 치환하여 Cr(0.75)Mn(0.25)Sb 합금을 제작함으로써, 대칭성을 조절해 AHE를 발현시켰습니다. 중성자 회절과 Landau 이론을 통해 이 물질이 AHE를 허용하는 자기적 대칭성을 가짐을 증명했습니다.", "implication": "알터마그네틱 물질 설계에서 원소 치환을 통한 대칭성 제어가 자성 및 수송 특성을 최적화하는 데 효과적인 전략임을 보여주었습니다.", "novelty": "실험적으로 구현하기 어려운 알터마그네틱의 AHE를 성공적으로 관측했으며, Cr/Mn 치환을 통한 구조적/자기적 대칭성 제어를 명확히 제시했다는 점이 중요합니다.", "unresolved": "치환에 따른 국소적 불균일성(disorder)이 알터마그네틱의 근본적인 대칭성에 미치는 영향은 여전히 논의의 여지가 있습니다.", "future_work": "더 높은 온도에서의 스핀트로닉스 소자 응용 연구 및 다른 알터마그네틱 후보 물질들에 대한 대칭성 설계 검증.", "concepts": [{"term": "Altermagnetism", "why_emerged": "기존 강자성체와 반강자성체의 분류를 넘어서는 새로운 스핀 대칭성 범주가 필요했음.", "origin": "초록 정보만으로는 특정하기 어려움 (최근 2-3년 내 이론적으로 급격히 정립됨).", "connections": "Spin-polarized band structure, Spintronics, Berry curvature."}, {"term": "Anomalous Hall Effect", "why_emerged": "자성 물질 내에서의 스핀-궤도 결합으로 인한 비정상적인 전하 수송 현상을 이해하기 위해 필요함.", "origin": "Edwin Hall (1881년), Karplus & Luttinger (1954년).", "connections": "Berry phase, Topological Hall effect, Magnetic order."}, {"term": "Cr1-xMnxSb", "why_emerged": "알터마그네틱 특성을 유지하면서 AHE를 구현하기 위한 최적의 치환 모델.", "origin": "본 논문 저자들에 의해 실험적으로 확립됨.", "connections": "Epitaxial thin film, Neel vector."}], "english_summary": ["Demonstrated anomalous Hall effect in altermagnetic Cr(0.75)Mn(0.25)Sb thin films.", "Achieved symmetry engineering via chemical substitution of Cr by Mn.", "Validated the magnetic phase diagram using neutron diffraction and Landau theory.", "Established a viable materials platform for altermagnetic spintronics."]}}, {"title": "Hysteresis without coexistence: disorder-rounded first-order transitions in a van der Waals magnet", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2608.19352", "authors": "Xiaoyu Guo, Abby N. Neill, Christopher M. Pasco, Tyrel M. McQueen, N. P. Armitage", "last_authors": "Tyrel M. McQueen, N. P. Armitage", "summary": "Quenched disorder can profoundly modify phase transitions. In low-dimensional systems, theory predicts that even weak quenched disorder can round the thermodynamic discontinuities associated with a first-order phase transition. Here, we employ time-domain terahertz spectroscopy to investigate the quasi-two-dimensional trimerized kagome van der Waals magnet family Nb$_3$Cl$_{8-x}$Br$_x$ ($x=0$, 1 and 8). We observe the emergence of an additional phonon branch upon Br substitution, whose spectral weight increases and frequency softens with increasing Br concentration. The temperature evolution of the phonon frequencies reveals a clean first-order transition in Nb$_3$Cl$_8$ characterized by macroscopic phase coexistence and thermal hysteresis. In contrast, the transition in the substitutionally disordered compound Nb$_3$Cl$_7$Br retains its hysteresis while exhibiting a substantially broadened transition with no resolvable macroscopic phase coexistence. These observations reveal disorder-induced fragmentation of the transition into locally favored domains instead of well-defined bulk phases separated by stable phase boundaries. The behavior is consistent with the Imry-Wortis and the Aizenman-Wehr scenarios for the effect of quenched disorder in low-dimensional systems, which destabilizes macroscopic phase coexistence and rounds the thermodynamic discontinuities associated with first-order transitions. Thermal hysteresis persists in the disordered compound despite the lack of resolvable coexistence, indicating that the two features often treated as a single hallmark of first-order character arise distinctly and can be separated by disorder. Moreover, our results establish Nb$_3$Cl$_{8-x}$Br$_x$ as a promising platform for investigating the effects of disorder on first-order transitions in low-dimensional systems.", "tier": "B_IMPORTANT_CONDMAT", "score": "9", "reason": "Study of first-order transitions and disorder in a trimerized kagome van der Waals magnet.; demoted from A: broad CM, not direct user/project hit", "tags": ["experiment", "kagome", "vanderWaals"], "image": "https://arxiv.org/html/2608.19352v1/Figure1.png", "briefing": {"background": "일반적인 1차 상전이에서 관찰되는 열적 이력(hysteresis)과 상 공존(coexistence)은 불순물이 유입될 경우 분쇄되거나 변형됩니다. 저차원 계에서 이러한 현상이 어떻게 나타나는지 규명하는 것은 물리계의 근본적인 물성을 이해하는 데 필수적입니다.", "motivation": "Trimerized kagome van der Waals 자성체인 Nb3Cl8-xBrx 계열에서, Br 치환에 따른 무질서(disorder)가 상전이 특성에 어떤 변화를 주는지 조사하고자 했습니다.", "result": "순수한 Nb3Cl8에서는 명확한 1차 상전이와 상 공존이 관찰되지만, Br이 치환된 무질서 계에서는 이력(hysteresis)은 유지되나 상 공존은 사라지는 현상을 확인했습니다.", "implication": "불순물이 상전이의 통계적 특성을 파편화하여, '열적 이력'과 '상 공존'이 불순물에 의해 서로 분리될 수 있는 물리적 현상임을 입증했습니다.", "novelty": "Kagome 격자계에서 불순물이 도입된 1차 상전이의 미세한 거동을 THz 분광법으로 추적했다는 점에서, 강상관계 저차원 자성체 연구자에게 흥미로운 통찰을 제공합니다.", "unresolved": "불순물 유입이 국소적 도메인 형성에 미치는 정량적인 상관관계 및 Imry-Wortis 시나리오의 완벽한 적용 가능성에 대한 추가 검토가 필요합니다.", "future_work": "도메인 구조를 직접 시각화하는 나노 분해능 이미징 연구 및 추가적인 격자 매개변수 변조 실험.", "concepts": [{"term": "Trimerized Kagome", "why_emerged": "카고메 격자의 기하학적 좌절과 자기적 특성을 조절하기 위한 구조적 왜곡의 필요성.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "Geometric frustration, Van der Waals magnets."}, {"term": "1st order phase transition", "why_emerged": "계의 물리적 성질이 불연속적으로 변하는 과정을 설명하기 위해 필요함.", "origin": "Clausius & Clapeyron (19세기).", "connections": "Hysteresis, Latent heat, Phase coexistence."}, {"term": "THz spectroscopy", "why_emerged": "물질 내의 저에너지 준입자(phonons, magnons) 동역학을 비파괴적으로 정밀 측정하기 위해 도입됨.", "origin": "20세기 중반 이후 광학 기술의 발전으로 정립.", "connections": "Pump-probe spectroscopy, Phonon modes."}], "english_summary": ["Studied disorder-rounded first-order transitions in Nb3Cl8-xBrx kagome magnets.", "Observed thermal hysteresis without macroscopic phase coexistence in disordered samples.", "Disorder fragments the transition into locally favored domains rather than bulk phase boundaries.", "Supports Imry-Wortis/Aizenman-Wehr scenarios in low-dimensional magnetic systems."]}}, {"title": "Pair-Density Wave from Doping an Altermagnetic Mott Insulator", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2607.23654", "authors": "Shuai A. Chen, Qianqian Chen, Guangyu Yu, Zheng Zhu", "last_authors": "Guangyu Yu, Zheng Zhu", "summary": "Pair-density-wave (PDW) superconductivity is a state in which the superconducting order parameter modulates at a finite wavevector. Using large-scale density matrix renormalization group, we study the doped altermagnetic Mott insulator in the checkerboard $t$-$J$ model, where altermagnetic exchange anisotropy is encoded microscopically through anisotropic ferromagnetic next-nearest-neighbor exchange. By mapping the ground-state phase diagram as a function of doping and altermagnetic anisotropy, mainly on six-leg cylinders, we identify a transition from a uniform $d$-wave superconducting regime with charge modulation to a PDW regime coexisting with stripe order. In the PDW regime, we rep nnections": "Hubbard model, High-Tc superconductivity."}, {"term": "DMRG", "why_emerged": "1D 또는 준 2D 강상관계 모델에서 기저 상태를 정확하게 계산하기 위해 필요함.", "origin": "Steve White (1992년).", "connections": "Tensor networks, Entanglement entropy."}], "english_summary": ["Identified PDW superconductivity in a doped altermagnetic Mott insulator.", "Performed large-scale DMRG calculations on the checkerboard t-J model.", "Found unconventional wave-vector locking between PDW and stripe order.", "Proposed altermagnetism as a strong-coupling route to finite-momentum pairing."]}}, {"title": "Pressure-tuning of electronic structure of CeTe3 probed by femtosecond collective mode spectroscopy", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2608.20057", "authors": "Chandra V. Kotyada, Priyanka Yogi, Amon P. Lanz, et al.", "last_authors": "Alexej Pashkin, Jure Demsar", "summary": "We use femtosecond optical spectroscopy to study the evolution of coherent order-parameter dynamics in the prototypical charge-density-wave (CDW) system CeTe3 under hydrostatic pressure. The CDW transition temperature decreases from approximately 570 K at ambient pressure to near room temperature at approximately 6 GPa. The pressure dependence of the order-parameter recovery dynamics indicates enhanced electron-phonon coupling with increasing pressure, implying that CDW suppression is driven predominantly by the reduction in Fermi-surface nesting. Above 7 GPa, no evidence of CDW order is observed down to cryogenic temperatures. Concurrently, the relaxation dynamics exhibit significant slowing down at low-temperatures, consistent with emerging heavy-electron behaviour due to pressure-enhanced hybridization between localized Ce 4f levels and itinerant carriers.", "tier": "B_IMPORTANT_CONDMAT", "score": "9", "reason": "High relevance: CDW system, Fermi-surface nesting, and electronic structure spectroscopy.; demoted from A: broad CM, not direct user/project hit", "tags": ["experiment", "CDW "experiment", "SmB6", "Kondo-insulator"], "image": "", "briefing": {"background": "SmB6는 위상적 콘도 절연체(Topological Kondo Insulator, TKI) 후보 물질로, 낮은 온도에서 나타나는 금속성 표면 상태와 양자 진동 현상이 오랫동안 논란의 대상이 되어 왔음.", "motivation": "SmB6 내부에 존재하는 양자 진동 신호가 벌크의 위상적 성질 때문인지, 아니면 불순물이나 미세 구조에 의한 것인지 명확히 구별하고자 함.", "result": "동위원소가 풍부한 고순도 SmB6 단결정에서 고자기장 양자 진동을 측정. LaB6와 같은 비교군 실험을 통해 신호의 기원을 분석함.", "implication": "SmB6의 양자 진동 기원에 대한 논란에 중요한 실험적 증거를 제공하며, TKI 후보 물질의 검증 기준을 강화함.", "novelty": "동위원소 정제를 통해 시료의 균질성을 높여 양자 진동 데이터를 보다 신뢰성 있게 획득함.", "unresolved": "SmB6의 양자 진동 신호가 여전히 벌크의 전도도 기여와 표면 상태를 완벽하게 분리하지 못하는 측면이 존재함.", "future_work": "표면 민감도가 높은 ARPES 및 STS를 통한 밴드 구조의 직접 검증 및 양자 진동 신호와의 상관관계 분석.", "concepts": [{"term": "Kondo Insulator", "why_emerged": "국소 자기 모멘트와 전도 전자의 강한 혼성으로 인해 페르미 준위에서 갭이 형성되는 강상관 시스템을 설명하기 위해 제안.", "origin": "1960-70년대 Kondo 효과 연구의 연장선에서 정립.", "connections": "Heavy fermion, topological insulator, SmB6."}, {"term": "Quantum Oscillations", "why_emerged": "강한 자기장 아래서 페르미 표면의 극단적인 궤도 면적을 측정하여 전자 구조를 규명하기 위해 사용.", "origin": "de Haas-van Alphen 효과 (1930년).", "connections": "Fermi surface, Landau levels, topological semimetals."}], "english_summary": ["Investigation of quantum oscillations in isotopically enriched SmB6 crystals up to 35 T.", "Used high-sensitivity calorimetry and transport measurements to probe the Kondo insulator ground state.", "Aims to clarify the long-standing debate regarding the origin of quantum oscillations in SmB6.", "Provides high-quality experimental data for characterizing topological Kondo insulators."]}}, {"title": "Layer-mediated tuning of spin and valley physics in stacked tetragonal altermagnetic bilayers", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/w468-mdrb", "authors": "Jianke Tian, Xiaowen Zhou, Gui-Bin Liu", "last_authors": "Xiaowen Zhou, Gui-Bin Liu", "summary": "As an emerging magnetic phase, altermagnets (AMs) with collinear compensated magnetism in real space and alternating spin splitting in the band structure have attracted widespread attention. Here, based on first-principles calculations, we demonstrate that the layer stacking imposes symmetry constra…", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "First-principles study of altermagnetic bilayers, a topic specifically noted in user profile.", "tags": ["theory", "altermagnetism", "bilayer"], "image": "", "briefing": {"background": "알터마그네틱(Altermagnet)은 실제 공간에서 자성이 상쇄되지만 운동량 공간(Band structure)에서 스핀 분리가 일어나는 새로운 자기 위상입니다. 기존의 강자성이나 반강자성과는 다른 독특한 스핀 분극 특성으로 주목받고 있습니다.", "motivation": "적층(Stacking) 구조가 알터마그네틱 이중층 시스템에서 대칭성을 어떻게 제어하고, 결과적으로 스핀 및 밸리 물성에 어떤 영향을 미치는지 밝히고자 했습니다.", "result": "제1원리 계산을 통해 층간 적층 방식이 시스템의 대칭성 제약 조건을 결정하며, 이를 통해 스핀과 밸리 자유도를 효과적으로 튜닝할 수 있음을 입증했습니다.", "implication": "알터마그네틱 재료에서 층간 구조를 조작함으로써 스핀트로닉스 소자에 필요한 전자 구조를 설계할 수 있는 새로운 가능성을 제시합니다.", "novelty": "이중층 구조에서의 대칭성 튜닝을 통해 알터마그네틱 특성을 제어하는 메커니즘을 이론적으로 정립한 점이 핵심입니다.", "unresolved": "이론적 예측을 뒷받침할 구체적인 실험적 관측(ARPES 등)은 아직 제시되지 않았습니다.", "future_work": "실제 van der Waals 이중층 알터마그네틱 시편을 제작하여 스핀 분할 구조를 직접 측정하는 연구가 필요합니다.", "concepts": [{"term": "Altermagnetism", "why_emerged": "강자성체와 반강자성체의 장점을 결합하여 스핀 전류 제어와 자성 안정성을 동시에 확보하기 위해 도입됨.", "origin": "최근 2020년대 초반, 질서 변수와 결정 대칭성 분석을 통해 체계적으로 확립됨.", "connections": "반강자성 스핀트로닉스, 비자성체 스핀 분할 현상."}, {"term": "Valley Physics", "why_emerged": "전자의 에너지 밴드 극점인 밸리 자유도를 정보 저장 및 연산에 활용하기 위해 연구됨.", "origin": "그래핀의 밸리 분극 현상 연구에서 유래함.", "connections": "밸리트로닉스, 위상 절연체, 그래핀."}], "english_summary": ["Altermagnetic bilayers exhibit alternating spin splitting in reciprocal space despite compensated magnetic order.", "First-principles study investigates symmetry constraints imposed by layer stacking.", "Demonstrates effective control of spin and valley degrees of freedom through bilayer engineering.", "Provides a theoretical foundation for designing future altermagnetic spin-electronic devices."]}}, {"title": "Nematic phase transitions in Bernal bilayer graphene", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/t6hh-dsyz", "authors": "R. David Mayrhofer, Andrey V. Chubukov", "last_authors": "R. David Mayrhofer, Andrey V. Chubukov", "summary": "In experiments on Bernal bilayer graphene under perpendicular electric field, quantum oscillations have shown the presence of electronic nematic states in some ranges of hole density. Here, the authors perform a Hartree-Fock study to numerically determine where nematic states develop in the system as hole density and displacement field are varied. Nematic phases are found close to the boundary between fully and partially isospin polarized phases. An analytic criterion for the appearance of nematicity is also derived. It is in good agreement with the numerical results.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Significant study of electronic nematicity in a relevant graphene system.", "tags": ["theory", "material", "nematicity"], "image": "", "briefing": {"background": "버날 적층(Bernal bilayer) 그래핀은 전기장 인가에 따라 밴드 구조와 아이소스핀(isospin) 상태가 변화하며, 강한 상관관계에 의한 전자 네마틱(nematic) 현상이 관찰되는 흥미로운 플랫폼입니다.", "motivation": "실험에서 관찰된 버날 그래핀의 전자 네마틱 상태가 어떤 물리적 변수(구멍 밀도, 변위장) 영역에서 발생하는지 수치적으로 규명하고자 했습니다.", "result": "Hartree-Fock 근사를 통해 네마틱 상이 아이소스핀이 부분적으로 편극된 영역과 완전히 편극된 영역의 경계 부근에서 발생함을 확인하고 해석적 기준을 도출했습니다.", "implication": "그래핀 내의 전자적 위상 천이와 자발적 대칭성 깨짐 현상을 이해하는 이론적 지도를 완성했습니다.", "novelty": "수치적 계산과 해석적 모델을 결합하여 그래핀의 네마틱 위상도를 명확히 기술한 점이 중요합니다.", "unresolved": "도출된 이론적 위상도가 복잡한 다체 효과를 얼마나 정확하게 포괄하는지는 추가 실험 검증이 필요합니다.", "future_work": "더 넓은 변위장/밀도 영역에서 네마틱 전이와 초전도성 사이의 상관관계 조사.", "concepts": [{"term": "Electronic Nematicity", "why_emerged": "회전 대칭성이 깨진 전자 액체 상태를 설명하기 위해 응집물질물리학에 도입됨.", "origin": "철 기반 초전도체 연구에서 본격적으로 확립됨.", "connections": "아이징 네마틱, 자발적 대칭성 깨짐, 전자 점성."}, {"term": "Bernal Bilayer Graphene", "why_emerged": "그래핀 층간 상호작용과 전기적 튜닝을 통해 위상적 특성을 연구하기 위해 도입됨.", "origin": "탄소 동소체 연구 초기 단계부터 확립됨.", "connections": "모아레 격자, 뒤틀린 이중층 그래핀, 밴드 엔지니어링."}], "english_summary": ["Analyzes electronic nematic states in Bernal bilayer graphene under perpendicular electric fields.", "Utilizes Hartree-Fock theory to map the emergence of nematic phases as a function of carrier density and displacement.", "Identifies nematicity at the boundaries of isospin-polarized phases.", "Provides an analytical criterion consistent with numerical simulations for nematic transitions."]}}, {"title": "Pressure-induced emergent phases in pyrochlore iridate Eu2Ir2O7 film", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/d5gm-vv6m", "authors": "Mingyu Yang, Jianping Sun, Zhaoqing Ding, et al.", "last_authors": "Jinguang Cheng, Jiandong Guo", "summary": "By applying hydrostatic pressure to (111)-oriented ${\\mathrm{Eu}}_{2}{\\mathrm{Ir}}_{2}{\\mathrm{O}}_{7}$ single-crystalline films, we unveil a sequence of emergent quantum phases. We find transport signatures consistent with a pressure-induced “all-in–all-out” magnetic Weyl metal regime, followed by …", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Experimental transport study of emergent Weyl metal phases in a magnetic topological material.", "tags": ["Eu2Ir2O7", "Weylsemimetal", "pressureeffect"], "image": "", "briefing": {"background": "파이로클로어 이리데이트(Eu2Ir2O7)는 자기적 질서와 위상적 밴드 구조가 결합된 Weyl 금속 후보 물질로, 강한 스핀-궤도 결합(SOC)과 전자 상관관계의 상호작용을 연구하기에 적합합니다.", "motivation": "정수압(Hydrostatic pressure)을 가하여 시스템의 격자 상수를 미세하게 조절함으로써 숨겨진 양자 상을 이끌어내고 전자 구조 변화를 관찰하고자 했습니다.", "result": "압력을 가함에 따라 'All-in-All-out' 자기 구조를 가진 Weyl 금속 상태를 유도하고 이후 전이되는 새로운 상들을 수송 측정으로 확인했습니다.", "implication": "위상적 자기 재료의 압력 튜닝이 양자 위상 제어를 위한 유효한 도구임을 입증했습니다.", "novelty": "박막 시료에서의 압력 의존 수송 측정은 드문 연구이며, 자기적 위상 전이를 관측한 점이 주목할 만합니다.", "unresolved": "압력에 의해 유도된 구체적인 페르미 표면의 변화나 자기적 정렬의 미세 구조는 아직 규명되지 않았습니다.", "future_work": "압력 하에서의 ARPES 또는 RIXS 측정을 통해 Weyl 노드 및 자기 구조의 진화를 직접 확인해야 함.", "concepts": [{"term": "Weyl Semimetal", "why_emerged": "운동량 공간에서 선형 분산하는 Weyl 페르미온을 포함하는 위상 물질을 설명하기 위해 나옴.", "origin": "Herring(1937)이 제안하고, 2010년대 ": "도핑된 Hubbard 모델에서 전자와 정공 도핑에 따른 비대칭적 전자 구조를 정밀하게 분석하여 의사갭 현상의 물리적 기원을 명확히 규명하고자 합니다.", "result": "정공 도핑 시에는 Mott 갭의 영향으로 반결절(antinodal) 간섭성이 억제되며 페르미 아크가 형성되지만, 전자 도핑 시에는 반강자성 상관관계에 의한 핫스팟이 지배적인 구조를 보임을 확인했습니다.", "implication": "의사갭 현상이 급격한 상전이보다는 강한 상관관계에 의한 연속적인 크로스오버 현상임을 시사하며, 이는 고온 초전도 연구의 통합적 모델링에 기여합니다.", "novelty": "DQMC 시뮬레이션을 통해 ARPES 스펙트럼과 직접 비교 가능한 고해상도 단일 입자 스펙트럼을 제공하여, 강상관 이론과 실험 데이터를 연결하는 가교 역할을 합니다.", "unresolved": "이 시뮬레이션이 실제 도핑된 cuprates 물질의 복잡한 불순물이나 다체 효과를 모두 포괄하는지는 여전히 추가적인 검증이 필요합니다.", "future_work": "보다 큰 단위 셀에서의 장거리 상관관계 연구 및 실제 물질의 궤도 성분을 포함한 다중 궤도 모델로의 확장이 필요합니다.", "concepts": [{"term": "의사갭(Pseudogap)", "why_emerged": "초전도 전이 온도 이하가 아닌 정상 상태에서도 상태 밀도가 감소하는 현상을 설명하기 위해 도입.", "origin": "1990년대 고온 초전도체 연구 중 NMR과 ARPES 실험을 통해 확립됨.", "connections": "페르미 아크, 짝짓기 밀도 파, 스핀 밀도 파 이론과 연결됨."}, {"term": "Hubbard 모델", "why_emerged": "고체 내 전자 간의 쿨롱 반발력을 단순화하여 강상관 현상을 이해하기 위해 제안.", "origin": "John Hubbard가 1963년에 제안함.", "connections": "Mott 절연체, 고온 초전도체 이론의 기본 프레임워크."}, {"term": "DQMC (Determinant Quantum Monte Carlo)", "why_emerged": "강상관 격자 모델에서 부호 문제(sign problem)를 제한적으로 제어하며 다체 시스템을 수치적으로 계산하기 위해 사용.", "origin": "1980년대 초반 개발됨.", "connections": "수치적 강상관 물리학의 주력 도구."}], "english_summary": ["The paper investigates the doped Hubbard model using determinant quantum Monte Carlo.", "A clear electron-hole asymmetry in spectral functions is identified.", "Hole doping suppresses antinodal coherence, while electron doping enhances hot spots.", "The results suggest the pseudogap arises from strong correlations rather than a sharp phase transition."]}}, {"title": "Topological states and superconductivity in two-dimensional Ta-rich Ta-S systems", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/bvws-dyxb", "authors": "Haifei Qin, Panlong Kong, Xinyong Cai, Jiao Chen", "last_authors": "Xinyong Cai, Jiao Chen", "summary": "The coexistence of Dirac points and van Hove singularities (VHSs) near the Fermi level provides a promising mechanism for realizing high-temperature superconductivity and nontrivial topology in 2D systems. Here, via global structural searches, we identify four stable Ta-S monolayers: ${\\text{Ta}}_{2…", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Identifies Dirac points and VHS in Ta-S monolayers, highly relevant to ARPES electronic structure.", "tags": ["theory", "transition-metal-dichalcogenide", "topological-superconductivity"], "image": "", "briefing": {"background": "2차원 물질에서 위상학적 비자명성과 초전도성은 차세대 양자 소자 구현을 위한 핵심 주제입니다. 특히 전자 구조의 Dirac 점과 van Hove 특이점(VHS)의 공존은 강한 전자 상관관계를 유도하는 중요한 환경입니다.", "motivation": "Ta 기반의 2차원 물질군에서 고온 초전도와 위상학적 특성을 동시에 발현시킬 수 있는 안정적인 구조를 탐색하고자 합니다.", "result": "구조 탐색을 통해 4가지 안정한 Ta-S 단층 구조를 식별하였으며, 이들이 페르미 준위 근처에서 Dirac 점과 VHS를 공유함을 입증했습니다.", "implication": "해당 물질들은 위상학적 초전도체 후보군으로서 ARPES를 통한 전자 구조 검증 시 흥미로운 위상 특성을 보일 것으로 기대됩니다.", "novelty": "전이금속 칼코겐 화합물(TMD) 시스템에서 Ta의 함량을 조절함으로써 위상 물성과 초전도성을 동시에 튜닝할 수 있는 플랫폼을 제시합니다.", "unresolved": "실제 합성의 가능성과 그에 따른 결함(defect)이 위상 상태에 미치는 영향은 실험적으로 확인되지 않았습니다.", "future_work": "제시된 물질의 물리적 합성을 통한 ARPES 및 STS 측정이 후속 연구로 요구됩니다.", "concepts": [{"term": "van Hove Singularity (VHS)", "why_emerged": "상태 밀도(DOS)의 발산이 물질의 상전이(초전도, 자기적 질서 등)에 미치는 영향을 기술하기 위해 필요.", "origin": "Leon Van Hove가 1953년 제안.", "connections": "Kagome 금속, 꼬인 이중층 그래핀의 상관 효과와 연결됨."}, {"term": "Dirac Point", "why_emerged": "선형 분산 관계를 갖는 준입자의 위상학적 성질을 이해하기 위해 필요.", "origin": "그래핀 연구를 통해 2000년대 중반 실험적으로 확립.", "connections": "위상 절연체, Weyl 반금속."}], "english_summary": ["Identifies four stable 2D Ta-S monolayer structures via global search.", "Predicts the coexistence of Dirac points and van Hove singularities near the Fermi level.", "The system is proposed as a candidate for topological superconductivity.", "Provides a platform for exploring electronic correlations in Ta-based 2D materials."]}}, {"title": "Tunable collinear altermagnets induced by Floquet engineering in A-type sliding antiferromagnetic bilayers", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/bw7d-mlsp", "authors": "Zhe Li, Lijuan Li, Da-Shuai Ma, Mengxue Guan, Rui Wang, Sheng Meng", "last_authors": "Rui Wang, Sheng Meng", "summary": "Arranging the stacking orders of $A$-type antiferromagnetic ($A$-AFM) bilayers offers a practical pathway to realizing two-dimensional altermagnets. Previous proposals, however, rely on stringent symmetry constraints, including layer groups and stacking registries. In this work, we demonstrate that …", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Connects altermagnetism and Floquet engineering, both key interests.", "tags": ["theory", "topic", "altermagnetism"], "image": "", "briefing": {"background": "Altermagnetism(알터자성)은 비상대론적 스핀 분할(spin-splitting)을 통해 강자성과 반강자성의 장점을 모두 갖춘 새로운 자기 질서 상태입니다. Floquet engineering은 레이저 조사를 통해 물질의 대칭성을 동적으로 제어하는 강력한 도구입니다.", "motivation": "기존의 엄격한 대칭성 제한을 극복하고, Floquet engineering을 이용하여 Altermagnetism을 유도하거나 튜닝할 수 있는 방법을 제시하고자 합니다.", "result": "A-type 반강자성 이중층 구조에서 Floquet 구동을 통해 대칭성을 제어함으로써 Altermagnetism 상태를 효과적으로 유도하고 제어할 수 있음을 이론적으로 입증했습니다.", "implication": "정적 결정 구조에 국한되었던 Altermagnetism 연구를 동적 제어 영역으로 확장하여 차세대 스핀트로닉스 소자 응용 가능성을 넓혔습니다.", "novelty": "광학적 제어(Floquet)를 통해 물질의 자기적 특성을 튜닝하는 전략을 도입하여, Altermagnetism의 구현 유연성을 크게 높였습니다.", "unresolved": "초고속 레이저 조사 시 발열 문제와 결맞음(coherence) 유지 시간이 실제 실험 구현의 가장 큰 관건입니다.", "future_work": "시간 분해(time-resolved) ARPES를 통한 Floquet 유도 전자 구조 변화의 직접적인 관찰이 필요합니다.", "concepts": [{"term": "Altermagnetism", "why_emerged": "스핀-궤도 결합 없이도 스핀 분할을 나타내는 비자성/반강자성 물질을 기술하기 위해 제안.", "origin": "최근 2-3년 내 이론적 체계가 정립됨 (예: Jungwirth 등).", "connections": "강자성, 반강자성, 스핀트로닉스."}, {"term": "Floquet Engineering", "why_emerged": "주기적 구동을 통해 물질의 유효 해밀토니안을 수정하여 새로운 위상/자기 상태를 창출하기 위해 필요.", "origin": "초록 정보만으로는 특정하기 어려움 (통계물리/양자광학 분야 전통).", "connections": "Floquet 위상 절연체, 시간 결정."}], "english_summary": ["Proposes Floquet engineering as a tool to realize and tune altermagnets in bilayers.", "Overcomes static symmetry constraints for altermagnetism using periodic driving.", "Demonstrates controllability of spin-splitting via stacking and laser parameters.", "Offers a new pathway for optical control of spintronic materials."]}}, {"title": "Contactless Cavity Sensing of Superfluid Stiffness in Atomically Thin 4Hb−TaS2", "journal": "PRL_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/p6wt-2dkx", "authors": "Trevor Chistolini, Ha-Leem Kim, Qiyu Wang, et al.", "last_authors": "Irfan Siddiqi, Feng Wang", "summary": "A key property of superconductors called superfluid stiffness can now be measured in a wide range of 2D systems.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Investigation of superfluid stiffness in a layered transition metal dichalcogenide.", "tags": ["superconductivity", "2Dmaterial", "TMD"], "image": "", "briefing": {"background": "2차원 초전도체에서 초유체 강성(Superfluid stiffness)은 위상학적 전이와 초전도 상태의 안정성을 결정하는 핵심 물성이나, 시편의 원자층 두께로 인해 정밀 측정에 어려움이 있었습니다.", "motivation": "기존의 전극 접촉식 측정 방식의 한계를 극복하고, 원자층 두께의 4Hb-TaS2 박막에서 초유체 강성을 비접촉 방식으로 정밀 측정하고자 했습니다.", "result": "마이크로파 공진기(Microwave cavity)를 이용한 비접촉식 감지 기술을 통해 2차원 한계 영역에서의 초유체 강성을 성공적으로 측정했습니다.", "implication": "다양한 2차원 물질 및 헤테로구조에서 전극 접촉 없이 고유한 초전도 물성을 탐색할 수 있는 새로운 실험 표준을 제시합니다.", "novelty": "비접촉 방식의 초유체 강성 측정은 시편 손상을 최소화하며, 복잡한 미세 공정 없이도 고감도 측정이 가능하다는 점에서 중요합니다.", "unresolved": "이 측정 기술이 타 물질 시스템(예: 모아레 격자 시스템)에 일반화될 때의 해상도 한계 및 기판과의 상호작용 영향은 추가 연구가 필요합니다.", "future_work": "다양한 2차원 초전도체 및 위상학적 초전도체 후보 물질로의 확장 및 공진기 설계를 통한 감도 최적화 연구가 예상됩니다.", "concepts": [{"term": "Superfluid stiffness", "why_emerged": "2차원 시스템에서 위상학적 전이와 초전도성을 이해하기 위해 필수적인 에너지 스케일입니다.", "origin": "초기 유체 역학 및 초전도 이론에서 정립되었으며, BKT 전이 이론에서 핵심적인 역할을 합니다.", "connections": "BKT 전이, 2차원 초전도성, 위상학적 물리."}, {"term": "4Hb-TaS2", "why_emerged": "금속성과 초전도성이 공존하는 흥미로운 TMD(전이금속 디칼코게나이드) 구조를 탐색하기 위해 연구됩니다.", "origin": "다양한 TMD 적층 구조 연구 과정에서 층상 구조 특성이 잘 알려졌습니다.", "connections": "TMD, 전하밀도파(CDW), 초전도성."}], "english_summary": ["Developed a contactless microwave cavity sensing technique for superfluid stiffness.", "Successfully applied to atomic-thin 4Hb-TaS2 films.", "Avoids issues associated with conventional contact-based transport measurements.", "Provides a versatile platform for probing 2D superconducting transitions."]}}, {"title": "Discovery of Berezinskii-Kosterlitz-Thouless Correlations in the Quantum Kagome Compound Cs2Cu3SnF12", "journal": "PRL_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/bm42-z87g", "authors": "M. S. Grbić, I. Jakovac, I. Kupčić, H. Tanaka, M. Horvatić", "last_authors": "H. Tanaka, M. Horvatić", "summary": "We investigate the microscopic properties of the kagome compound ${\\mathrm{Cs}}_{2}{\\mathrm{Cu}}_{3}{\\mathrm{SnF}}_{12}$ using $^{63,65}\\mathrm{Cu}$ nuclear quadrupolar resonance. Analysis of the local hyperfine fields below the Néel temperature ${T}_{\\mathrm{N}}=20\\text{ }\\text{ }\\mathrm{K}$ indica…", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Experimental NMR study of a kagome lattice compound displaying BKT correlations.", "tags": ["experiment", "kagome", "magnetism"], "image": "", "briefing": {"background": "카고메 격자 시스템은 기하학적 좌절(frustration)로 인해 복잡한 자기 상태와 위상학적 들뜸이 발생하는 응집물질물리학의 주요 연구 대상입니다.", "motivation": "카고메 화합물 Cs2Cu3SnF12에서 나타나는 자기적 질서와 저차원성 사이의 상관관계를 핵사중극공명(NQR)을 통해 상세히 규명하고자 했습니다.", "result": "Néel 온도 이하에서 국소 자기장 분석을 통해 BKT(Berezinskii-Kosterlitz-Thouless) 상관관계의 증거를 발견했습니다.", "implication": "카고메 격자에서 일반적인 3차원 장거리 자기 질서 외에도 저차원적 위상학적 자기 특성이 공존할 수 있음을 시사합니다.", "novelty": "일반적인 카고메 자성체 연구와 달리, BKT 타입의 상관관계를 실험적으로 식별했다는 점이 본 연구의 학술적 가치입니다.", "unresolved": "BKT 상관관계가 전체 시스템의 거시적 물성에 미치는 정량적인 영향과 상전이 경계면의 정확한 메커니즘은 여전히 미지수입니다.", "future_work": "이러한 저차원적 상관관계가 카고메 시스템의 변칙적 홀 효과나 비평형 상태에 미치는 영향에 대한 추가적인 동역학 연구가 필요합니다.", "concepts": [{"term": "BKT Correlations", "why_emerged": "2차원 시스템에서 장거리 질서가 없더라도 위상학적 소용돌이(vortex)의 쌍 형성을 통한 상전이를 설명하기 위해 도입되었습니다.", "origin": "Berezinskii(1971), Kosterlitz와 Thouless(1973)에 의해 제안되었습니다.", "conne 'Agueda Velasco, Jose D. Berm\\'udez-P\\'erez, Pablo Garc\\'ia Talavera, et al.", "last_authors": "Edwin Herrera Vasco, Hermann Suderow", "summary": "Scanning Tunneling Microscopy is a cornerstone technique for visualizing the electronic density of states with atomic resolution (typically below 0.1 nm). While the field of view of most STM setups extends up to a few microns, obtaining atomic resolution over these large areas is often impractical and excessively time-consuming. This is due to the need to acquire maps with a point number reaching $10^7$ or more with a full current or conductance vs voltage curve at each point. The standard procedure is to make large scale maps and then select small regions to zoom-in for high-resolution atomic scale analysis. However, this approach fails to address a question which is often critical: Does a specific atomic-scale modulation of the electronic density of states persist over much larger, mesoscopic length scales? Here we present a new method: Replica STM (R-STM), that overcomes this limitation, allowing the study of atomic-scale phenomena up to micron length scales. We obtained new large-area STM tunneling conductance maps in UTe$_2$ and FeSe, spanning areas over 200 nm in size. In these large scale maps we discovered periodic signals with wavelengths significantly exceeding interatomic distances. We show that these large-wavelength periodic signals are replicas of the underlying atomic-scale density of states modulations. R-STM leverages these replica signals to efficiently track atomic-scale features over large areas. We discuss the influence of phase slips, disorder and defects in the replicas. Our results suggest that atomic scale modulations of the superconducting density of states could persist over large length scales in FeSe. R-STM provides a new capability for STM to compare atomic scale with micrometer scale phenomena. The proof of principle of R-STM can be extended to any other scanning probe microscopy experime
