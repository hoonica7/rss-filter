<title>Daily Paper Slideshow</title>
<style>
  :root {
    color-scheme: light;
    --bg: #f6f7f4;
    --paper: #ffffff;
    --ink: #111827;
    --muted: #64748b;
    --line: #d8ddd2;
    --accent: #176b87;
    --accent-2: #9a3412;
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; overflow: auto; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: var(--bg); color: var(--ink); }
  .shell { max-width: 1500px; min-height: 100vh; margin: 0 auto; padding: 14px 18px; display: flex; flex-direction: column; }
  .topbar { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 16px; }
  .top-actions { display: flex; align-items: center; gap: 10px; }
  .topbar a, button { border: 1px solid var(--line); border-radius: 8px; background: var(--paper); color: var(--ink); padding: 10px 14px; font-weight: 700; text-decoration: none; cursor: pointer; }
  button.primary { background: var(--accent); border-color: var(--accent); color: white; }
  button:disabled { opacity: 0.45; cursor: not-allowed; }
  .counter { color: var(--muted); font-weight: 700; }
  .slide { min-height: calc(100vh - 82px); background: var(--paper); border: 1px solid var(--line); border-radius: 10px; padding: 18px; box-shadow: 0 18px 42px rgba(15, 23, 42, 0.10); display: grid; grid-template-columns: minmax(310px, 0.86fr) minmax(0, 1.55fr); gap: 18px; overflow: visible; }
  .paper-head { min-width: 0; min-height: 0; overflow: visible; display: flex; flex-direction: column; gap: 12px; }
  .figure { margin: 0; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: #f8fafc; }
  .figure img { display: block; width: 100%; max-height: 41vh; object-fit: contain; background: white; }
  .figure figcaption { padding: 7px 10px; color: var(--muted); font-size: 12px; line-height: 1.3; }
  .head-text { display: flex; flex-direction: column; gap: 9px; min-width: 0; }
  .badges { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .badge { border-radius: 999px; padding: 5px 9px; background: #eef2ff; color: #3730a3; font-size: 12px; font-weight: 800; }
  .score { background: #fee2e2; color: #991b1b; }
  h1 { margin: 0; font-size: 25px; line-height: 1.15; letter-spacing: 0; overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
  h1 a { color: inherit; text-decoration-color: rgba(23, 107, 135, 0.35); text-decoration-thickness: 2px; text-underline-offset: 4px; }
  h1 a:hover { color: var(--accent); text-decoration-color: var(--accent); }
  .meta, .authors, .why, .abstract { font-size: 13px; line-height: 1.45; }
  .meta, .authors { color: var(--muted); }
  .why strong, .abstract strong, .authors strong { color: var(--ink); }
  .authors { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .why { border-left: 4px solid var(--accent-2); padding-left: 10px; color: #374151; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .abstract { border-top: 1px solid var(--line); padding-top: 14px; color: #374151; }
  .original-abstract { border-top: 1px solid var(--line); padding-top: 10px; color: #374151; font-size: 11.5px; line-height: 1.35; overflow-wrap: anywhere; }
  .original-abstract strong { display: block; margin-bottom: 4px; color: var(--ink); }
  .tags { display: flex; flex-wrap: wrap; gap: 8px; }
  .tag { border-radius: 999px; padding: 4px 8px; background: #f1f5f9; color: #475569; font-size: 12px; font-weight: 700; }
  .head-text > .link { display: none; }
  .briefing { min-width: 0; min-height: 0; overflow: visible; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); grid-auto-rows: minmax(0, auto); align-content: start; gap: 11px 18px; border-top: 0; padding-top: 0; }
  .brief-section { min-width: 0; }
  .brief-section.wide { grid-column: 1 / -1; }
  .brief-section h2 { margin: 0 0 4px; font-size: 14px; line-height: 1.22; color: #0f766e; letter-spacing: 0; }
  .brief-section p, .brief-section li { margin: 0; font-size: 12.5px; line-height: 1.42; color: #1f2937; overflow-wrap: anywhere; }
  .brief-section ul { margin: 0; padding-left: 20px; }
  .concepts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 9px 14px; }
  .concept { border-top: 1px solid var(--line); padding-top: 7px; }
  .concept h3 { margin: 0 0 4px; font-size: 13px; color: #7c2d12; letter-spacing: 0; }
  .concept p { margin: 2px 0 0; font-size: 11.5px; line-height: 1.35; color: #374151; overflow-wrap: anywhere; }
  .concept b { color: #111827; }
  .link { color: var(--accent); font-weight: 800; text-decoration: none; }
  .empty { padding: 48px; background: var(--paper); border: 1px solid var(--line); border-radius: 12px; color: var(--muted); }
  @media (max-width: 860px) {
    .shell { padding: 14px; }
    .topbar, .top-actions { align-items: stretch; flex-direction: column; }
    .slide, .briefing, .concepts { grid-template-columns: 1fr; }
    .slide { min-height: auto; overflow: visible; display: grid; }
    h1 { font-size: 28px; }
  }
</style>

<script>
const slides = [{"title": "Energy- and momentum-resolved Cooper-pair emission from a cuprate superconductor", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2611.09857", "authors": "Henry Amir, Jack Zwettler, Ka Ho Wong, et al.", "last_authors": "Dirk K. Morr, Fahad Mahmood", "summary": "Superconductivity arises from Cooper pairing, but conventional photoemission probes electrons individually rather than as pairs. Here we report the observation of Cooper-pair emission from an optimally doped cuprate superconductor using two-electron angle-resolved photoemission (2e-ARPES). Below the superconducting transition, we observe a distinct two-electron emission peak at zero pair binding energy and zero pair momentum that disappears in the normal state, revealing the characteristic fingerprint of a Cooper pair. Unexpectedly, the joint energy distribution broadens markedly along the relative-energy axis as temperature decreases, while the total energy width remains nearly unchanged. This anomalous behavior cannot be explained by instrumental resolution, static disorder or thermal broadening, and instead points to scattering processes involving collective excitations of the superconductor. Our results establish 2e-ARPES as a probe of both Cooper-pair emission and the many-body dynamics of the superconducting state.", "tier": "A_MUST_READ", "score": "10", "reason": "Direct interest: experimental 2e-ARPES on cuprate superconductors.", "tags": ["ARPES", "superconductivity", "cuprates"], "image": "https://arxiv.org/html/2611.09857v2/fig1_v8.png", "briefing": {"background": "초전도 현상은 전자들이 쿠퍼 쌍(Cooper pairs)을 형성함으로써 발생하지만, 기존의 광전자 분광법(ARPES)은 주로 단일 전자의 에너지와 운동량 상태만을 측정할 수 있었습니다. 따라서 초전도체 내부에서 쿠퍼 쌍 자체의 동역학을 운동량 공간에서 직접 관찰하는 것은 실험적 난제였습니다.", "motivation": "본 연구는 '이전자 광전자 분광법(2e-ARPES)'이라는 새로운 기법을 사용하여 최적 도핑된 구리 산화물(cuprate) 초전도체에서 쿠퍼 쌍의 방출을 직접 관찰하고, 그 에너지 및 운동량 분포를 규명하고자 했습니다.", "result": "초전도 전이 온도 이하에서 총 결합 에너지와 총 운동량이 0인 지점에서 뚜렷한 이전자 방출 피크를 확인했습니다. 특히 온도가 낮아질수록 총 에너지 너비는 유지되지만 상대 에너지 축을 따라 분포가 넓어지는 현상을 발견했는데, 이는 단순한 열적 효과나 무질서가 아닌 초전도체 내 집단 들뜸(collective excitations)과의 산란 과정에 의한 것임을 밝혀냈습니다.", "implication": "2e-ARPES가 초전도체의 쿠퍼 쌍 방출뿐만 아니라 초전도 상태의 다체 동역학(many-body dynamics)을 직접 탐구할 수 있는 강력한 도구가 될 수 있음을 입증했습니다.", "novelty": "구리 산화물 초전도체에서 쿠퍼 쌍의 에너지-운동량 분해 방출을 직접 관찰한 혁신적인 사례입니다. 사용자께서 관심을 가지시는 ARPES 기법의 확장판이자 구리 산화물 초전도 기전 연구에 새로운 시각을 제공합니다.", "unresolved": "저온에서 상대 에너지 축을 따라 발생하는 비정상적인 넓어짐(broadening)의 구체적인 물리적 기작(예: 어떤 집단 모드와의 결합인지)에 대한 추가적인 정량적 분석이 필요합니다.", "future_work": "다양한 도핑 농도의 구리 산화물 및 철 기반 초전도체 등 다른 초전도 시스템으로의 확장 연구와 집단 들뜸에 대한 이론적 모델링과의 비교가 기대됩니다.", "concepts": [{"term": "2e-ARPES", "why_emerged": "단일 전자 ARPES가 제공하지 못하는 전자 쌍의 상관관계와 결합 상태를 직접 측정하기 위해 고안되었습니다.", "origin": "초록 정보만으로는 특정하기 어려우나, 최근 다체계 물리 측정을 위해 제안된 고급 분광 기법입니다.", "connections": "기존 ARPES, 동시 계수 광전자 분광(Coincidence photoemission spectroscopy)"}, {"term": "Cooper-pair emission", "why_emerged": "초전도의 근본 단위인 쿠퍼 쌍이 물질 밖으로 방출되는 현상을 포착하여 응축물(condensate)의 특성을 이해하기 위함입니다.", "origin": "L. N. Cooper (1956년 이론적 제안)", "connections": "BCS 이론, 초전도 응축"}, {"term": "Relative-energy axis", "why_emerged": "두 전자의 총 에너지와 별개로 두 전자 사이의 내부 에너지 분포를 분석하여 쌍 내부의 상관관계를 보기 위해 필요합니다.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "이전자 동역학, 다체 산란"}, {"term": "Collective excitations", "why_emerged": "초전도체 내에서 개별 전자뿐만 아니라 집단적으로 움직이는 모드(예: 힉스 모드, 포논 등)가 쌍의 거동에 미치는 영향을 설명하기 위해 도입되었습니다.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "포논, 스핀 파, 초전도 질서 파라미터 진동"}], "english_summary": ["Direct observation of Cooper-pair emission from an optimally doped cuprate using 2e-ARPES.", "Identified a distinct two-electron peak at zero pair binding energy and momentum below Tc.", "Found anomalous broadening along the relative-energy axis at low temperatures, linked to many-body scattering.", "Establishes 2e-ARPES as a unique probe for the many-body dynamics of superconducting states."]}}, {"title": "Magneto-ARPES as a direct probe of Berry Curvature and the Orbital Magnetic Moment", "journal": "arXiv_CondMat", "source": "keyword", "link": "https://arxiv.org/abs/2611.30968", "authors": "Seohyun Kong, Bernd Braunecker, Luke C. Rhodes", "last_authors": "Bernd Braunecker, Luke C. Rhodes", "summary": "The Berry curvature and orbital magnetic moment are central to the understanding of electronic transport phenomena such as the anomalous Hall effect, yet measuring these quantities directly with momentum resolution remains experimentally challenging. Here we show that angle-resolved photoemission spectroscopy measurements in a weak magnetic field (magneto-ARPES) provide a direct route to both quantities. We develop an analytic theory of photoemission in a weak magnetic field and show that, for any material, the first-order change in photoemission intensity is directly proportional to both the Berry curvature and the orbital magnetic moment, even in the presence of self-energy effects. For linearly polarised light, the matrix elements are unchanged to first order in the field, so the intensity change directly reflects these quantities. Using monolayer WSe$_2$ as an example, we show how both quantities can be extracted in a typical experiment. This finding thus points to magneto-ARPES as a general route for measuring the momentum-resolved Berry curvature and orbital magnetic moment in quantum materials.", "tier": "A_MUST_READ", "score": "10", "reason": "title strong match: ARPES", "tags": ["ARPES", "angle-resolvedphotoemission", "photoemission", "Berrycurvature", "anomalousHall", "monolayer", "Halleffect", "transport"], "image": "https://arxiv.org/html/2611.30968v1/Figure1.png", "briefing": {"background": "베리 곡률(Berry curvature)과 궤도 자기 모멘트(Orbital magnetic moment)는 양자 물질의 수송 현상과 위상적 성질을 결정하는 핵심 요소입니다. 하지만 이를 운동량 공간(momentum space)에서 직접 분해하여 측정하는 방법은 매우 제한적이었습니다.", "motivation": "약한 자기장 하에서 수행하는 ARPES(magneto-ARPES) 실험 데이터로부터 베리 곡률과 궤도 자기 모멘트를 직접적으로 추출할 수 있는 이론적 기반을 마련하고자 했습니다.", "result": "약한 자기장에서 ARPES 세기의 1차 변화량이 물질의 베리 곡률 및 궤도 자기 모멘트와 직접 비례한다는 해석적 이론을 도출했습 니다.", "result": "CDW 갭 형성이 전자 구조 전반에 걸쳐 초고속 응답에 어떤 변화를 주는지에 대한 실험적 증거를 제시합니다.", "implication": "페르미 준위 근처의 미세한 전자 구조 변화가 어떻게 전체 밴드 구조의 광학적 응답을 재구성하는지 이해하는 모델을 제공합니다.", "novelty": "CDW 시스템에서 페르미 준위 근처의 갭이 고에너지 영역의 동역학적 변화를 유도하는 메커니즘을 규명하여, CDW 전이 동역학에 대한 통찰을 제공합니다.", "unresolved": "초록 정보만으로는 특정 물질에서의 구체적인 결과값이 언급되지 않아 일반적인 CDW 이론으로 해석됩니다.", "future_work": "다양한 CDW 물질 시스템으로의 확장을 통한 결과의 보편성 확인이 필요합니다.", "concepts": [{"term": "Charge-Density Waves (CDW)", "why_emerged": "낮은 차원 시스템에서 에너지 최소화를 위한 전자 밀도의 공간적 주기성 변조 현상입니다.", "origin": "Peierls instability (1955).", "connections": "페르미 표면 Nesting, 초전도와의 경쟁."}, {"term": "Ultrafast spectroscopy", "why_emerged": "전자의 에너지 완화 시간과 결맞음 붕괴 시간을 실시간으로 관측하기 위해 필요합니다.", "origin": "Ahmed Zewail (1990년대).", "connections": "펌프-프로브 측정, 전자-포논 결합 측정."}], "english_summary": ["The study examines ultrafast responses in CDW systems induced by Fermi-level gap opening.", "It explores how subtle changes near the Fermi surface impact high-energy interband spectral dynamics.", "Provides insights into the dynamical coupling between electronic structure and CDW formation.", "The results enhance the understanding of spectroscopic signatures in correlated materials."]}}, {"title": "Valence band, electron correlation, and possible temperature dependent change in the electronic structure near EF of a candidate of ambient-pressure nickelate superconductors Sr3Ni2O5Cl2", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2611.30088", "authors": "Ryota Goban, Daiki Ootsuki, Kenichi Ozawa, et al.", "last_authors": "Yuji Muraoka, Takayoshi Yokoya", "summary": "Photoemission spectroscopy (PES) studies of Sr$_3$Ni$_2$O$_5$Cl$_2$ (Sr3252), a candidate ambient-pressure bilayer nickelate superconductor, have been performed to investigate the electronic structure. Valence band spectra, which are compared with DFT and DFT+U calculations, reveal dominant Ni 3$d$ $t_{2g}$-derived states located around 0.6 eV binding energy with a shoulder around 0.2 eV that can be attributed to states with a dominant Ni 3$d_{3z2-r2}$ character. The overall valence band shape is better reproduced by the simulated spectrum of DFT+U (= 3 eV), providing an experimental estimation of the strength of electron correlation. High-resolution PES near the Fermi level ($E_F$) exhibits marked temperature dependence, which cannot be fully understood by a broadening due to coupling of a photo-hole to phonons alone and suggests change in electronic structure. The results provide fundamental electronic structure information of Sr3252, which is useful to further explore the superconductivity of Sr3252.", "tier": "B_IMPORTANT_CONDMAT", "score": "9", "reason": "Electronic structure spectroscopy (PES) on unconventional nickelate superconductor candidate.", "tags": ["photoemission", "nickelate", "superconduct"], "image": "https://arxiv.org/static/browse/0.3.4/images/arxiv-logo-fb.png", "briefing": {"background": "구리산화물 초전도체의 대안으로 니켈계 산화물(nickelates)의 초전도 가능성이 주목받고 있으며, 그 전자 구조를 이해하는 것은 메커니즘 규명에 매우 중요합니다.", "motivation": "Sr3Ni2O5Cl2 물질이 상압에서 초전도 후보 물질로 제기됨에 따라, 이 물질의 정확한 전자 구조와 상관관계의 강도를 페르미 준위 근처에서 확인하고자 합니다.", "result": "ARPES 분석을 통해 Ni 3d 밴드 구조를 확인하고, DFT+U (U=3eV) 계산 결과가 실험 데이터와 잘 일치함을 보였습니다.", "implication": "해당 물질의 강상관 전자계 특성을 확인하였으며, 향후 초전도성 연구를 위한 전자 구조적 토대를 마련했습니다.", "novelty": "상압 니켈계 초전도 후보 물질인 Sr3252의 전자 구조를 실험적으로 측정하여 유효 U 값을 추정하고 온도 의존적 변화를 포착했습니다.", "unresolved": "관측된 온도 의존적 전자 구조 변화가 단순한 포논 결합을 넘어선 어떤 물리적 기원을 가지는지는 여전히 의문입니다.", "future_work": "저온 환경에서의 ARPES 연구를 통한 밴드갭 변화 또는 상태 밀도 변화의 상세 기원 규명이 필요합니다.", "concepts": [{"term": "Nickelate superconductor", "why_emerged": "구리산화물 초전도체와 유사한 3d 궤도 물성을 가진 층상 구조 물질에서 초전도를 탐색하기 위해 제안되었습니다.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "쿠퍼레이트, 강상관 전자계, DFT+U."}, {"term": "Photoemission Spectroscopy (PES)", "why_emerged": "물질의 밴드 구조와 점유 상태를 직접 측정하기 위해 필수적인 기술입니다.", "origin": "Einstein (광전효과), 1960년대 실험 방법 정립.", "connections": "ARPES, 전자 구조 분석."}], "english_summary": ["PES study of Sr3Ni2O5Cl2, a candidate nickelate superconductor.", "Experimental valence band structure aligns well with DFT+U (U=3 eV) calculations.", "Observation of temperature-dependent electronic structure changes near EF.", "Provides fundamental insights into the electron correlation strength of this nickelate."]}}, {"title": "momipy: A time-resolved momentum microscopy data analysis workflow", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2611.25888", "authors": "Paul Werner (I. Physikalisches Institut, Georg-August-Universit\\\"at G\\\"ottingen, Germany), et al.", "last_authors": "Stefan Mathias (I. Physikalisches Institut, International Center for Advanced Studies of Energy Conversion)", "summary": "Photoemission momentum microscopy is an emerging approach to photoelectron spectroscopy that is transforming electronic band structure mapping at both laboratory-based and large-scale facilities. Its extension to time-resolved measurements has recently enabled major advances, ranging from the femtosecond imaging of exciton wavefunctions to dark-field photoelectron microscopy of light-induced dynamics and strong light-matter interactions. However, the rapid acquisition of high-dimensional data sets (including electron in-plane momenta $k_x$ and $k_y$, kinetic energy $E_\\mathrm{kin}$, time $\\Delta t$, and more) poses substantial challenges for data handling and analysis. A typical workflow encompasses data acquisition, exploratory visualization, calibration and targeted feature extraction, with data management ideally guided by FAIR principles. Here, we present momipy, a Python package that streamlines the momentum microscopy data analysis workflow efficiently and at low computational cost. Among other features, momipy provides interactive 4D data visualization, energy and momentum calibration, space-charge correction, and a broad selection of multidimensional data analysis routines, including binning, momentum-map extraction and time-, energy- and momentum-resolved model fitting. momipy is accompanied by a selection of interactive example scripts, supporting adoption of momipy by both experienced researchers and users new to momentum microscopy.", "tier": "B_IMPORTANT_CONDMAT", "score": "9", "reason": "Software tool specifically for ARPES/momentum microscopy workflows.", "tags": ["method", "ARPES", "photoemission"], "image": "https://arxiv.org/html/2611.25888v2/fig1_v12.png", "briefing": {"background": "ARPES 및 운동량 현미경(momentum microscopy)은 고체 내 전자 구조를 직접 관측하는 강력한 도구입니다. 최근 펨토초 레이저를 이용한 시간 분해 측정 기술이 발전하면서, 에너지와 운동량뿐만 아니라 시간 정보까지 포함된 고차원 데이터 처리가 연구의 병목 현상이 되고 있습니다.", "motivation": "매우 방대하고 복잡해진 다차원 데이터(k, E, t 등)를 효율적으로 시각화하고, 보정(calibration)하며, 정량적 모델 피팅까지 수행할 수 있는 표준화된 오픈소스 도구가 필요하여 momipy를 개발했습니다.", "result": "데이터 분석 효율을 높이기 위한 파이썬 기반의 momipy 라이브러리를 제안합니다. 공간 전하 효과(space-charge effect) 보정, 4D 시각화, 에너지/운동량 보정 기능을 통해 연구자의 데이터 분석 부하를 획기적으로 줄였습니다.", "implication": "시간 분해 ARPES와 같은 복잡한 실험 데이터를 FAIR(Findable, Accessible, Interoperable, Reusable) 원칙에 따라 투명하고 일관되게 분석할 수 있는 체계가 마련되었습니다.", "novelty": "기존 파편화된 스크립트 기반 분석 방식에서 벗어나, 범용적이고 상호작용 가능한 통합 파이썬 라이브러리를 제공함으로써 ARPES 사용자 커뮤니티의 진입 장벽을 낮추었습니다.", "unresolved": "소프트웨어 도구 특성상 다양한 실험 셋업(detector 종류 등)에 따른 세밀한 보정 모델의 정확도는 사용자의 주의가 필요합니다.", "future_work": "커뮤니티 피드백을 통한 기능 확장과 더 다양한 데이터 포맷 및 빔라인 시스템과의 호환성 강화가 예상됩니다.", "concepts": [{"term": "Momentum microscopy", "why_emerged": "기존 ARPES 대비 넓은 운동량 공간을 동시에 측정하기 위해 필요했습니다.", "origin": "최근 10년 내 광전자 방출 기술의 발전으로 정립됨.", "connections": "ARPES, K-space mapping."}, {"term": "Space-charge effect", "why_emerged": "펄스 레이저 강도가 높을 때 광전자 간 쿨롱 반발로 해상도가 저하되는 문제를 해결하기 위해 필요합니다.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "Time-resolved photoemission, spectral resolution degradation."}], "english_summary": ["Momentum microscopy provides high-dimensional data in modern time-resolved photoemission experiments.", "Data processing is a bottleneck due to complexity in energy, momentum, and time dimensions.", "momipy is a new open-source 는지 이론적으로 입증하였으며, 원자 단위의 자기 구조에 대한 상세 정보를 제공합니다.", "implication": "자기 옥튜폴의 다중 스케일 구조를 이해함으로써 Mn3Sn의 거대한 변칙 홀 효과 및 위상적 특성을 더욱 정밀하게 제어할 수 있는 가능성을 제시합니다.", "novelty": "기존 CMO 모델을 넘어 원자 수준의 AMO까지 고려한 멀티스케일 자기 구조 해석을 시도했다는 점이 중요합니다.", "unresolved": "이론적인 제안이 주를 이루고 있어, 실제 실험적(예: STS 등)으로 AMO의 공간적 분포를 직접적으로 검증하는 단계가 남아있습니다.", "future_work": "원자 분해능의 스핀 편극 STM을 통한 AMO 분포의 직접적인 시각화 및 그에 따른 국소적 전자 상태 변화 관측.", "concepts": [{"term": "Cluster Magnetic Octupole (CMO)", "why_emerged": "단일 원자의 자기 모멘트만으로 설명되지 않는 Mn3Sn의 비전통적 물리 현상을 설명하기 위해 제안되었습니다.", "origin": "Mn3Sn의 위상 물리학 연구 초기 단계에서 정립되었습니다.", "connections": "반강자성 스핀트로닉스, 베리 곡률, 비정상 홀 효과."}, {"term": "Intra-atomic Magnetic Octupole (AMO)", "why_emerged": "결정 격자 내 원자 사이트에서의 국소적 전자 분포와 스핀 구조를 더 정확히 기술하기 위해 필요합니다.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "다중극자 물리학, 스핀 궤도 결합, 강상관 전자계."}], "english_summary": ["Mn3Sn exhibits both cluster-scale and intra-atomic magnetic octupoles.", "The interplay between AMO and CMO defines the local magnetic structure.", "Theoretical framework provides deeper insight into topological transport properties.", "Requires further experimental verification via high-resolution probes."]}}, {"title": "Magnetic circular dichroism of terahertz modes and selection rules of Raman-active optical phonons in the polar altermagnet candidate Mn2Mo3O8", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/sqws-q32r", "authors": "F. Schilberth, K. Vasin, M. Knauft, et al.", "last_authors": "I. Kézsmárki, J. Deisenhofer", "summary": "We investigated the magnetic and vibrational excitations in the collinear altermagnet candidate Mn 2 Mo 3 O 8 by temperature-dependent Raman scattering and magneto-optical THz time-domain transmission spectroscopy. By comparison to calculations accurately capturing the eigenfrequencies of the vibrational eigenmodes, we identify all optical phonons, including the lowest-lying Raman modes of A 1 and E 2 type, which had remained elusive in a previous Raman study. Moreover, we compare the selection rules for optically active phonons in the paramagnetic and the magnetically ordered phases of Mn 2 Mo 3 O 8 and analyze the Raman selection rules with respect to pseudoangular momentum conservation. No splitting of the degenerate paramagnetic E 2 optical phonons into circularly polarized modes could be resolved below T N , indicating negligible morphic effects of optical phonons upon magnetic ordering. In contrast, we observe strong magnetic circular dichroism at a broad THz excitation band, emerging in the magnetically ordered state. This band, potentially originating from two-magnon excitations, is only electric-dipole active and features a field-dependent two-component fine structure. Its magnetic circular dichroism vanishes above the spin-flop transition at 4 T.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Altermagnetism is relevant; study includes magneto-optical spectroscopy and lattice excitations.", "tags": ["altermagnetism", "spectroscopy", "magneto-optics"], "image": "", "briefing": {"background": "알터자성(Altermagnetism)은 스핀 분열된 밴드 구조를 가지면서도 자화가 0인 새로운 자기 위상으로, 최근 차세대 스핀트로닉스 재료로 주목받고 있습니다.", "motivation": "Mn2Mo3O8의 자기적/진동적 들뜸을 분석하여 알터자성 후보 물질로서의 격자 및 자기적 성질을 정확히 이해하고자 합니다.", "result": "라만 산란과 THz 분광법을 통해 모든 광학 포논 모드를 동정하였으며, 자기 상태에서의 자기 원형 이색성(MCD)을 관측했습니다.", "implication": "Mn2Mo3O8의 자기적 질서와 격자 간의 상호작용을 명확히 함으로써, 알터자성체의 위상적 물성을 활용한 제어 가능성을 입증했습니다.", "novelty": "알터자성 후보 물질에서 THz 영역의 자기 여기와 격자 동역학을 결합하여 분석한 연구로, 자기 위상 전이와 관련된 미세 구조를 규명했습니다.", "unresolved": "관측된 강력한 MCD 신호가 정확히 2-magnon 여기인지, 혹은 다른 전자적 기원인지에 대한 완벽한 분리는 추가 연구가 필요합니다.", "future_work": "더 낮은 온도와 높은 자기장에서의 정밀한 분광학 연구를 통해 자기 구조와 포논의 결합 메커니즘을 상세히 규명하는 작업.", "concepts": [{"term": "Altermagnetism", "why_emerged": "반강자성체에서 비자성임에도 불구하고 스핀 분리된 전자 밴드를 구현하기 위해 필요합니다.", "origin": "최근 이론적으로 정의되었으며 다수의 실험적 후보가 연구 중입니다.", "connections": "반강자성체, 스핀 분열 밴드, 위상 물질."}, {"term": "Magnetic Circular Dichroism (MCD)", "why_emerged": "물질의 자기적 들뜸과 원형 편광 사이의 상호작용을 측정하여 자기 질서를 탐구하기 위함입니다.", "origin": "오래된 분광학적 방법론이나 최근 위상/자기 물질 연구에 필수적으로 활용됩니다.", "connections": "광-자기 상호작용, 자기 여기, 스핀 편극."}], "english_summary": ["Studied lattice and magnetic excitations in the altermagnet Mn2Mo3O8.", "Identified optical phonons using Raman and THz spectroscopy.", "Observed strong magnetic circular dichroism in the ordered phase.", "Provides experimental constraints for the altermagnetic candidate state."]}}, {"title": "Magnetic-field control of the excitonic transition in Ta2NiSe5", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/9d27-6dvw", "authors": "Giacomo Mazza", "last_authors": "Giacomo Mazza", "summary": "The formation of excitonic insulator phases in quantum materials is often masked by structural distortions caused by the coupling between electronic and phononic order parameters. Here, for the candidate material ${\\mathrm{Ta}}_{2}{\\mathrm{NiSe}}_{5}$, we show that sufficiently high magnetic fields …", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Experimental investigation of excitonic insulator candidate with relevance to correlated electronic materials.", "tags": ["excitonicinsulator", "magnetotransport", "correlatedelectrons"], "image": "", "briefing": {"background": "Ta2NiSe5는 구조적 왜곡과 전자적 상관관계가 강하게 얽혀 있는 전형적인 들뜸 절연체(Excitonic Insulator) 후보 물질입니다.", "motivation": "구조 왜곡에 의해 가려진 순수한 들뜸 절연체 상태를 강한 자기장을 통해 외부적으로 조절하여 그 물성을 분리하고자 합니다.", "result": "강한 자기장이 Ta2NiSe5의 전자-포논 결합을 제어하여, 기존의 구조 전이와 독립적인 전자적 변화를 유도할 수 있음을 제시합니다.", "implication": "들뜸 절연체와 구조적 상전이 간의 복잡한 얽힘을 자기장이라는 도구로 풀 수 있는 가능성을 보여주며, 이는 correlated electron systems 연구에 중요합니다.", "novelty": "자기장 인가가 들뜸 절연체 상태를 조절하는 핵심 파라미터가 될 수 있음을 입증하여 구조적 왜곡의 마스킹 효과를 극복하는 방안을 제시했습니다.", "unresolved": "자기장에 의해 유도된 상태가 실제 들뜸 응축인지, 아니면 다른 전자적 위상인지에 대한 명확한 분광학적 증거가 필요합니다.", "future_work": "강자기장 하에서의 ARPES 또는 비선형 광학 측정을 통해 전자 상태 변화의 직접적인 증거 수집.", "concepts": [{"term": "Excitonic Insulator", "why_emerged": "전자와 정공이 결합하여 응축을 형성하는 새로운 상관 전자 상태를 기술하기 위해 netic field) Hall effect is expected to develop under an applied electric field. Motivated by recent developments in Weyl-Ko…", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Relevant theoretical framework for Berry curvature and Hall effects in Weyl materials.", "tags": ["theory", "Berrycurvature", "Weyl"], "image": "", "briefing": {"background": "베리 곡률(Berry curvature)은 토폴로지 물질에서 비정상 홀 효과와 같은 비자명한 수송 현상을 결정짓는 핵심 물리량입니다.", "motivation": "Weyl 준금속 등 시간 반전 대칭성을 유지하되 공간 반전 대칭성이 깨진 시스템에서 전기장에 의한 비평형 홀 응답을 이론적으로 정립하고자 합니다.", "result": "정상 상태가 아닌 비평형 조건에서 Berry 곡률로부터 발생하는 홀 응답의 일반적인 프레임워크를 도출했습니다.", "implication": "외부 자기장 없이도 전기장만으로 유도되는 홀 효과를 이해하여, Weyl 준금속의 수송 특성을 더욱 정밀하게 예측할 수 있습니다.", "novelty": "기존의 선형 응답 이론을 넘어선 비평형 환경에서의 베리 곡률 효과를 다룸으로써 토폴로지 수송 물리학의 범위를 확장했습니다.", "unresolved": "제시된 이론적 예측을 검증할 수 있는 구체적인 물질 시스템 및 실험적 홀 전류 정량화 기법이 아직 부족합니다.", "future_work": "특정 Weyl 준금속 물질에 대한 수치 계산 및 고주파 응답 실험을 통한 이론 검증.", "concepts": [{"term": "Berry curvature", "why_emerged": "블로흐 전자의 위상적 성질과 비정상 수송 현상을 기술하기 위해.", "origin": "Berry (1984)", "connections": "양자 홀 효과, 비정상 홀 효과"}, {"term": "Weyl semimetal", "why_emerged": "위상적으로 보호된 전하를 띤 준입자가 존재하는 물질을 찾기 위해.", "origin": "Wan et al. (2011)", "connections": "토폴로지 위상, 아노말리"}, {"term": "Nonequilibrium Hall response", "why_emerged": "외부 장이 강한 환경에서 시스템의 비선형적/비평형 수송 거동을 이해하기 위해.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "비선형 홀 효과, 플로케 엔지니어링"}, {"term": "Inversion symmetry breaking", "why_emerged": "베리 곡률의 비대칭적 분포를 유도하여 홀 응답을 생성하기 위해.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "Weyl 물리학, 비중심대칭 초전도체"}], "english_summary": ["Develops theoretical framework for Hall responses in non-equilibrium conditions.", "Focuses on systems with time-reversal symmetry but broken inversion symmetry.", "Analyzes Berry curvature effects driven by external electric fields.", "Advances understanding of intrinsic Hall effects in Weyl semimetals."]}}, {"title": "Probing Bilayer Topological Order with Layer-Resolved Transport", "journal": "PRL_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/fd6s-x6k3", "authors": "Hongquan Liu, J. I. A. Li, D. E. Feldman", "last_authors": "J. I. A. Li, D. E. Feldman", "summary": "A. Li, and D. E. Feldman Shot noise has been used to measure fractional charges of anyons. The value of the charge imposes constraints on fractional statistics but does not determine it. This limitation is particularly important in multi-component systems. For example, the zero charge of neutral anyons in bilayer graphene g…", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Transport study on topological order in bilayer graphene.", "tags": ["graphene", "topological", "transport"], "image": "", "briefing": {"background": "위상 절연체 및 분수 양자 홀 효과와 같은 시스템에서 나타나는 위상적 질서(topological order)는 전하의 분수화나 애니온(anyon) 통계와 같은 이국적인 물리 현상을 동반합니다. 하지만 이러한 상태가 다성분(multi-component) 시스템일 경우, 전하 측정만으로는 애니온의 통계를 명확히 구별하기 어렵다는 한계가 있습니다.", "motivation": "이중층 그래핀(bilayer graphene) 시스템에서 나타나는 중성 애니온(neutral anyons)과 같은 위상적 준입자들의 성질을 규명하기 위해, 단순한 전하 측정 이상의 정보를 얻을 수 있는 층 분해(layer-resolved) 수송 측정 기술을 제안합니다.", "result": "이중층 그래핀 시스템의 위상적 질서를 probe하기 위한 수송 측정 모델과 분석 기법을 제시하였습니다. 특히 층별 정보를 분리하여 위상적 상태의 기여도를 명확히 파악하고자 했습니다.", "implication": "층 분해 수송 측정은 복합적인 위상 상태를 가진 물질에서 준입자의 통계를 직접적으로 연구하는 새로운 도구가 될 수 있습니다.", "novelty": "기존 샷 노이즈 측정의 한계를 넘어 층 분해(layer-resolved) 데이터를 통해 이중층 구조의 위상적 물리량을 보다 세밀하게 제어하고 관측할 수 있는 기법을 제시했습니다.", "unresolved": "실제 실험적 구현에서 층 간의 결합(interlayer coupling)이나 불순물이 수송 신호에 미치는 영향은 여전히 정밀한 제어가 필요합니다.", "future_work": "실제 이중층 그래핀 소자에서 층 분해 transport 측정을 수행하여 분수 상태의 통계적 특성을 검증하는 연구가 뒤따라야 합니다.", "concepts": [{"term": "Fractional Statistics", "why_emerged": "2차원 계에서 입자의 교환이 위상학적 위상을 유도하여 보존/페르미온 통계를 따르지 않는 입자의 필요성 때문.", "origin": "Leinaas와 Myrheim (1977), Wilczek (1982).", "connections": "분수 양자 홀 효과, 애니온, 위상 양자 컴퓨터."}, {"term": "Shot Noise", "why_emerged": "전류의 불연속성(입자성)으로부터 전하 운반체의 유효 전하를 결정하기 위해.", "origin": "Schottky (1918).", "connections": "분수 전하 측정, 랏팅어 액체, 양자 수송."}], "english_summary": ["Addresses the limitations of charge measurement in identifying anyon statistics in multi-component systems.", "Proposes a layer-resolved transport measurement technique for bilayer graphene.", "Enables better characterization of topological order by distinguishing layer contributions.", "Provides a framework for probing neutral anyons in topological bilayer phases."]}}, {"title": "Anisotropic field suppression of charge order reveals orbital-selective Kondo hybridization in UTe2", "journal": "Science_Advances", "source": "Gemini", "link": "https://www.science.org/doi/abs/10.1126/sciadv.aeh8987?af=R", "authors": "Nileema Sharma, Fangjun Cheng, Hyeok-Jun Yang, et al.", "last_authors": "Yi-Ting Hsu, Xiaolong Liu", "summary": "UTe 2 is a rare correlated quantum material where unconventional density-wave orders, Kondo physics, spin-triplet pairing, and reentrant superconductivity coexist. Because superconductivity emerges from a strongly correlated normal state, identifying and controlling intertwined normal-state orders are essential for understanding the electronic landscape where superconductivity arises. Here, using scanning tunneling microscopy in a vector magnetic field, we uncover a staggered charge density wave (CDW) in high-quality UTe 2 crystals. This CDW exhibits a strong directional field response: It is completely quenched by a modest 1.7-tesla magnetic field along the quasi–one-dimensional uranium-chain direction while remaining robust against fields along other crystallographic axes. This anisotropy suggests an orbital-driven field-tuned quantum phase transition. Unexpectedly, the same field orientation concurrently suppresses the 5f Kondo resonance. Modeling indicates a switch in the dominant hybridization channel from Te 5 p- U 5 f to U 6 d- U 5 f coupling, suggesting an intimate interplay between CDW and the Kondo effect.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Important research on UTe2, a key heavy fermion superconductor material.", "tags": ["heavy-fermion", "superconductivity", "electronic-structure"], "image": "", "briefing": {"background": "UTe2는 강한 전자 상관관계 속에서 초전도성, 자기적 질서, Kondo 효과가 얽혀 있는 중페르미온(heavy-fermion) 물질로, 특히 스핀-삼중항(spin-triplet) 초전도 가능성 때문에 큰 주목을 받고 있습니다.", "motivation": "초전도 현상이 발생하는 배경 상태인 정규 상태(normal state)에서 나타나는 전하 밀도 파(CDW)와 Kondo 효과 사이의 경쟁 및 공존 관계를 명확히 규명하고자 했습니다.", "result": "STM 측정 결과, UTe2에서 U-chain 방향으로 정렬된 CDW를 발견했습니다. 이 CDW는 특정 방향의 자기장에 의해 억제되는데, 이와 동시에 5f Kondo 공명 상태도 소멸되는 것을 확인했습니다. 이는 CDW가 Te-U 간의 혼성(hybridization) 채널 변화와 밀접함을 시사합니다.", "implication": "UTe2의 복합적인 위상 및 초전도 성질이 특정 궤도(orbital)의 혼성 채널에 의해 제어될 수 있음을 보여주며, 이는 강상관 물질의 양자 임계 현상을 이해하는 중요한 단서입니다.", "novelty": "자기장 방향에 따른 CDW와 Kondo 효과의 비등방적 억제를 통해 궤도 선택적 혼성(orbital-selective hybridization) 매커니즘을 최초로 제시했습니다.", "unresolved": "이러한 미세한 궤도 변화가 거시적인 스핀-삼중항 초전도성에 정확히 어떻게 기여하는지는 추가 규명이 필요합니다.", "future_work": "다른 결정축 방향에서의 정밀한 RIXS 또는 추가적인 STS 측정을 통해 혼성 채널의 변화를 직접 관찰할 필요가 있습니다.", "concepts": [{"term": "Kondo Resonance", "why_emerged": "자기 불순물과 전도 전자 사이의 강한 산란으로 페르미 준위 근처에 형성되는 상태.", "origin": "Kondo (1964).", "connections": "Heavy fermion, UTe2, 궤도 혼성."}, {"term": "Orbital-selective hybridization", "why_emerged": "특정 궤도만이 페르미 준위 근처의 물성을 결정할 때 필요한 개념.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "강상관 전자계, 궤도 선택적 모트 전이."}], "english_summary": ["Discovers a field-sensitive charge density wave (CDW) in heavy-fermion UTe2 using STM.", "Reveals that CDW and 5f Kondo resonance are suppressed simultaneously by magnetic fields along the U-chain.", "Suggests a field-induced switch in the dominant orbital hybridization channel.", "Highlights the crucial role of orbital selectivity in the complex normal state of UTe2."]}}, {"title": "A Fiber-Optic Platform for Cryogenic Laser-Pump Neutron-Probe Magneto-Optical Measurements", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2611.29114", "authors": "Lazar L. Kish, Andrei T. Savici, Tyler K. White, et al.", "last_authors": "Barry L. Winn, Igor A. Zaliznyak", "summary": "We report a fiber-optic laser-pump neutron-probe method for momentum- and frequency-resolved magneto-optical measurements. The technique uses inelastic neutron scattering to measure time-dependent two-point magnetization correlations, S(Q,$\\omega$), after resonant photoexcitation at cryogenic temperatures. We demonstrate it by measuring nonequilibrium thermalization dynamics in Yb-based quantum magnets.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Innovative instrumentation for pump-probe neutron studies on quantum magnets.", "tags": ["neutronscattering", "quantummagnet", "method"], "image": "https://arxiv.org/static/browse/0.3.4/images/arxiv-logo-fb.png", "briefing": {"background": "양자 자성체와 같은 강상관 물질에서 레이저를 이용해 초고속으로 상태를 변화시키고, 이를 중성자 산란(neutron scattering)으로 측정하는 펌프-프로브(pump-probe) 기술은 물질의 비평형 동역학을 연구하는 데 핵심적입니다.", "motivation": "극저온 환경에서 작동하는 광섬유(fiber-optic) 기반의 레이저-펌프 중성자-프로브 시스템을 구축하여, 정밀한 운동량 및 에너지 분해능으로 자기 상관관계를 측정하고자 했습니다.", "result": "새로운 광섬유 기반 플랫폼을 성공적으로 구현하여 Yb 기반 양자 자성체에서 광여기에 따른 비평형 열역학 과정을 실시간으로 관측했습니다.", "implication": "이 장비는 강상관 계에서 자성 준입자의 여기와 완화 과정을 중성자 산란으로 직접 측정할 수 있게 하여, 양자 자성 연구의 새로운 돌파구를 제공합니다.", "novelty": "기존 장비의 한계를 극복하고 광섬유를 이용한 컴팩트한 설계로 극저온 환경에서 동시 계측이 가능하다는 점이 기술적으로 중요합니다.", "unresolved": "아직 초기 단계로서, 시스템의 시간 분해능을 더 높여 매우 빠른 스핀 동역학을 관측하는 연구가 필요합니다.", "future_work": "다양한 양자 자성체 및 다강체 물질에 적용하여 비평형 상태의 자기적 위상 변화를 정밀 연구할 예정입니다.", "concepts": [{"term": "Inelastic Neutron Scattering", "why_emerged": "물질 내의 원자 및 스핀의 동역학적 상관관계를 운동량과 에너지로 분해하여 측정하기 위해.", "origin": "Brockhouse (1950s).", "connections": "스핀파, 포논, 자기 구조 분석."}, {"term": "Pump-Probe Measurement", "why_emerged": "물질의 초기화 후 응답 과정을 실시간으로 추적하기 위해.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "초고속 분광학, 비평형 통계역학."}], "english_summary": ["Develops a novel fiber-optic platform for laser-pump neutron-probe measurements.", "Enables momentum- and frequency-resolved observation of magnetic correlations at cryogenic temperatures.", "Demonstrates the technique on Yb-based quantum magnets for nonequilibrium thermalization dynamics.", "Provides a powerful new tool for investigating nonequilibrium quantum magnetism."]}}, {"title": "Charge-fluctuation hot lines and superconductivity in Ba1-xKxBiO3", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2611.28879", "authors": "Xiangang Wan, Sergey Y. Savrasov", "last_authors": "Xiangang Wan, Sergey Y. Savrasov", "summary": "The origin of superconductivity near 30 K in Ba 0.6 K 0.4 BiO 3 has remained a long-standing puzzle. Tunneling experiments give an electron–boson coupling λ ≈ 0.7 \\lambda\\approx 0.7 –1.2, whereas density-functional calculations give λ ≈ 0.3 \\lambda\\approx 0.3 , concentrated in the breathing mode near 50–70 meV. We propose that the missing coupling of about 0.7 comes from dynamical charge fluctuations at 𝐐 = ( π , π , π ) / a \\mathbf{Q}=(\\pi,\\pi,\\pi)/a , the ordering vector of the charge-disproportionated parent compound, and introduce an overdamped boson model to describe them. Using a tight-binding fit to the conduction band found from density-functional calculations at x = 0.4 x=0.4 , we show that such a boson scatters electrons strongly only on hot lines of the Fermi surface, small loops around the ⟨ 111 ⟩ \\langle 111\\rangle directions where 𝐤 \\mathbf{k} and 𝐤 + 𝐐 \\mathbf{k}+\\mathbf{Q} are both at the Fermi level. We derive closed-form self-energies, quasiparticle residues and band reconstructions, including shadow bands and hot-line pseudogaps for long-range correlations, and show that a sum rule fixes the Fermi-surface-averaged coupling independently of the boson frequency and correlation length. Combining the LDA phonon with an overdamped mode of frequency ω m ≈ 25 \\omega_{m}\\approx 25 meV and coupling λ ≈ 0.7 \\lambda\\approx 0.7 , anisotropic Eliashberg calculations reproduce T c ≈ 25 T_{c}\\approx 25 –30 K for correlation lengths of two to three lattice spacings and predict a gap enhanced by a factor of 3–4 on the hot loops. For longer correlation lengths an s s -wave state competes closely with a sign-changing T 2 ​ g T_{2g} state confined to the hot loops. In the random-phase approximation for an extended Hubbard model, the boson emerges naturally near a charge instability at R R , but purely electronic fluctuations are too weak and too long-ranged; coupling to the breathing-mode lattice distortion is one possible way to strengthen them.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Theory of electronic structure and superconductivity with explicit Fermi surface hot lines.", "tags": ["superconduct", "Fermisurface", "Hubbard"], "image": "https://arxiv.org/html/2611.28879v1/Fig1.png", "briefing": {"background": "Ba1-xKxBiO3는 고온 초전도 연구 초기부터 다루어진 화합물로, 기존의 BCS 이론이나 격자 진동만으로는 설명하기 힘든 30 K 부근의 높은 전이 온도와 전자-보손 결합 세기를 보여왔습니다.", "motivation": "밀도범함수이론(DFT) 예측값과 실제 터널링 실험값 사이의 전자-보손 결합 상수(λ) 차이를 설명하고, 특정 페르미 면 영역(hot lines)에서의 동역학적 전하 요동이 초전도에 미치는 기여를 정량화하고자 합니다.", "result": "Q=(π,π,π)/a 벡터를 갖는 동역학적 전하 요동 모델을 도입하여, 페르미 면 위의 특정 hot lines에서 강한 산란이 일어남을 확인했습니다. 이를 통해 Eliashberg 계산으로 25-30 K의 Tc를 재현했습니다.", "implication": "페르미 면의 특정 부분(hot loops)에서 결합이 집중적으로 일어나는 물리적 메커니즘을 밝혀냈으며, 이는 유사한 전하 요동을 보이는 다른 물질 계열의 초전도 이해에도 큰 도움이 될 것입니다.", "novelty": "전자 구조 계산을 기반으로 동역학적 전하 요동이 어떻게 'hot lines'을 형성하고 초전도 갭의 이방성을 유도하는지 구체적인 수치 모델을 제시했습니다.", "unresolved": "순수 전자 요동만으로는 실험적인 결합 세기를 완전히 설명하기 어려우며, 격자 왜곡과의 구체적인 결합 방식에 대한 추가 검증이 필요합니다.", "future_work": "격자 자유도와 전자 요동의 결합을 포함한 더 정교한 다체론적 계산 및 해당 갭 구조를 직접 확인할 수 있는 ARPES 혹은 STM 분광학 실험이 필요합니다.", "concepts": [{"term": "Charge-fluctuation hot lines", "why_emerged": "페르미 면 전체가 아닌 특정 운동량 영역에서만 강한 산란이 일어나는 현상을 설명하기 위해 도입됨.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "cuprates의 hot spots 개념과 유사하나 전하 요동에 집중함."}, {"term": "Eliashberg theory", "why_emerged": "BCS 이론의 한계를 넘어 강한 전자-포논 결합을 다루기 위해 필요함.", "origin": "G. Eliashberg (1960)", "connections": "Migdal-Eliashberg 이론, 비전통적 초전도체 분석의 표준 도구."}], "english_summary": ["The puzzle of 30K superconductivity in Ba1-xKxBiO3 is addressed by focusing on dynamical charge fluctuations.", "An overdamped boson model is introduced to explain the discrepancy between experimental and DFT-calculated coupling constants.", "Calculations identify 'hot lines' on the Fermi surface where strong scattering drives the superconducting gap enhancement.", "The study reproduces Tc using anisotropic Eliashberg theory, linking charge instability to the breathing mode lattice distortion."]}}, {"title": "Coupled Altermagnetic and Valley Physics in Monolayer VBiSe3", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2611.30649", "authors": "Divyanshi Tyagi, Saswata Bhattacharya", "last_authors": "Divyanshi Tyagi, Saswata Bhattacharya", "summary": "The interplay of compensated magnetism, spin--orbit coupling (SOC), and valley degrees of freedom provides a promising route toward spin--valley control without conventional ferromagnetism. Here, using first-principles calculations combined with Wannier-based analysis, we reveal coupled altermagnetic and valley physics in monolayer VBiSe$_3$. In the absence of SOC, the compensated N\\'eel antiferromagnetic state, whose opposite-spin V sublattices are related only by mirror operations, exhibits momentum-dependent spin splitting with a characteristic $i$-wave altermagnetic texture. Upon inclusion of SOC, the conduction-band states develop anisotropic Rashba-like spin splitting together with a sizable $K/K'$ valley splitting of about $112.2$~meV. Orbital analysis and an effective SOC Hamiltonian identify the hybridization between SOC-active Se-$p_{x,y}$ states and predominantly V-$d_{z^2}$ conduction-band states as an important microscopic origin of the valley splitting. The two valleys carry Berry curvature of the same sign but different magnitude, unlike the opposite-sign pattern of conventional valley Hall systems, so the large valley splitting, rather than a valley Hall effect, offers a possible route to valley-selective carrier occupation by gating. Moreover, a modest $-1\\%$ biaxial compressive strain drives the system into a quasi-half-valley-metallic state with valley-polarized electrons and non-valley-polarized holes. These results establish monolayer VBiSe$_3$ as a promising platform for coupled altermagnetic, spin--orbit, and valley phenomena with strain-tunable electronic states.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Altermagnetism and valley physics in 2D, highly relevant to topological/magnetic material interests.", "tags": ["material", "altermagnetism", "topology"], "image": "https://arxiv.org/html/2611.30649v1/main_pics/Picture1.png", "briefing": {"background": "스핀-밸리 자유도를 보존하면서도 자기적 질서를 제어하는 기술은 차세대 스핀트로닉스의 핵심이며, 최근 떠오르는 '알터마그네티즘(Altermagnetism)'은 스핀 분할이 운동량 공간에서 나타나는 보상된 자성체로 주목받고 있습니다.", "motivation": "단층 VBiSe3에서 SOC와 밸리 자유도가 어떻게 결합하는지, 그리고 이를 통해 외부 제어가 가능한지 물리적 기원을 규명하고자 합니다.", "result": "VBiSe3가 i-wave 형태의 알터마그네틱 텍스처를 가지며, SOC 포함 시 K/K' 밸리 간 112 meV의 거대한 분할이 발생함을 보였습니다. 밸리 간 베리 곡률 부호가 같아 밸리 편극을 게이팅으로 조절할 수 있습니다.", "implication": "단층 VBiSe3를 밸리 전자공학(valleytronics)과 알터마그네틱 스핀트로닉스를 결합할 수 있는 다기능 플랫폼으로 제안합니다.", "novelty": "보통의 밸리 홀 시스템과 달리 밸리 간 베리 곡률이 같은 부호를 가짐으로써, 홀 효과가 아닌 전하 캐리어의 직접적인 밸리 점유 제어가 가능하다는 점이 독특합니다.", "unresolved": "이러한 밸리-알터마그네틱 물리 현상을 실제 소자 구현 시 실험적으로 입증하기 위한 구체적인 수송 측정(transport) 시그니처가 더 규명되어야 합니다.", "future_work": "스트레인에 따른 전도성 변화를 이용한 밸리 트랜지스터 소자 제작 및 광학적 밸리 편극 분광학 실험이 뒤따라야 합니다.", "concepts": [{"term": "Altermagnetism", "why_emerged": "강자성체와 반강자성체의 경계에서, 자성 보상 상태를 유지하면서도 스핀 분할을 얻기 위해 등장.", "origin": "Šmejkal et al. (2022)", "connections": "비상관적 반강자성체, 스핀-밸리 물리, 위상 물질."}, {"term": "Valley physics", "why_emerged": "에너지 밴드의 국소 최솟값(밸리)을 정보 저장 및 처리에 활용하기 위해 필요.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "그래핀, 전이금속 디칼코게나이드(TMD), 밸리 홀 효과."}], "english_summary": ["Monolayer VBiSe3 is identified as a platform exhibiting coupled altermagnetism and valley physics.", "The system shows an i-wave altermagnetic texture with significant K/K' valley splitting induced by spin-orbit coupling.", "Unlike conventional systems, the valleys share the same sign of Berry curvature, allowing valley-selective carrier control via gating.", "Strain engineering can transform the material into a quasi-half-valley-metallic state, highlighting its potential for tunable valleytronics."]}}, {"title": "Curling Superconducting Vortices by Nematic Fluxon-Skyrmion Interaction", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2611.28479", "authors": "Xiaoqing Bao, Shiyuan Wang, Dekun Shen, et al.", "last_authors": "Haiwen Liu, Jinxing Zhang", "summary": "Superconducting vortex represents a topological entity in type-II superconductors, where the prototypical manifestation of such a macroscopic quantum state holds great promise for applications in future quantum technologies. Deterministic control of the vortex dynamics at the nanoscale is central to enhance superconductors' critical thresholds and design next-generation superconducting quantum devices. However, it is still scientifically challenging due to the intrinsic nature of the vortex pinning landscapes in superconductors. Here, we observe an even-in-field Hall-like signal with about two order of magnitude enhancement in a type-II superconductor/chiral magnet heterostructure, which confines to the field-temperature window where the flux flow coexists with magnetic skyrmions. The polarity of such a giant even-in-field transverse response reverses between orthogonal current directions, suggesting an on-track vortex flow driven by a nematic fluxon-skyrmion interaction analyzed via the extended vortex-viscosity tensor. More critically, a deterministic manipulation of skyrmions at the nanoscale within the hybrid system enables selective and reversible controls over the dissipative behavior and therefore the reconfigurable fluxon transport, mimic the precise control of curling stone in winter Olympic, thereby opening a new avenue towards the exploration of programmable topological and superconducting quantum devices.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Topological and nematic physics in heterostructures; relates to interest in vortex-nematic interactions.", "tags": ["superconductivity", "nematicity", "skyrmion"], "image": "https://arxiv.org/static/browse/0.3.4/images/arxiv-logo-fb.png", "briefing": {"background": "초전도체 내 소용돌이(vortex)의 동역학 제어는 에너지 손실 없는 소자 설계에 필수적이나, 불순물에 의한 핀닝 현상으로 인해 정밀 제어가 매우 어렵습니다.", "motivation": "초전도체와 키랄 자성체 이질접합 구조에서 자기적 스카이르미온(skyrmion)이 초전도 소용돌이의 흐름을 어떻게 조절하고 제어할 수 있는지 확인하고자 합니다.", "result": "스카이르미온과 플럭손(fluxon) 간의 네마틱(nematic) 상호작용을 통해 소용돌이 흐름의 방향을 제어하고, 기존 대비 거대한 홀 신호를 관측했습니다.", "implication": "스카이르미온을 '길잡이'로 사용하여 초전도 소용돌이를 능동적으로 프로그래밍할 수 있음을 입증했습니다.", "novelty": "기존에는 수동적이었던 소용돌이 핀닝/흐름을 자성체 소자를 통해 능동적으로 제어(reconfigurable transport)하는 새로운 위상학적 물리 체계를 구축했습니다.", "unresolved": "스카이르미온과 플럭손 사이의 미시적인 네마틱 상호작용 메커니즘이 실제 어떤 물리량에 의해 정량적으로 지배되는지 완전히 밝혀지지 않았습니다.", "future_work": "온도와 자기장 조건에 따른 상전이 역학 연구 및 더 정밀한 나노 스케일 소용돌이 조작 소자 제작이 필요합니다.", "concepts": [{"term": "Skyrmion", "why_emerged": "물질 내 자성 모멘트의 소용돌이와 같은 위상학적 비자명성을 설명하기 위해 등장.", "origin": "Tony Skyrme (1962, 입자물리), 실험적 관측은 최근.", "connections": "위상 절연체, 자기장, 토폴로지컬 정보 저장."}, {"term": "Fluxon", "why_emerged": "제2종 초전도체 내 자기장선(vortex)을 양자화된 단위로 다루기 위해 사용.", "origin": "Abrikosov (1957)", "connections": "제2종 초전도체, Josephson 접합, 아브리코소프 격자."}], "english_summary": ["A type-II superconductor/chiral magnet heterostructure enables deterministic manipulation of superconducting vortices.", "Nematic fluxon-skyrmion interaction is shown to facilitate reconfigurable vortex transport.", "A giant even-in-field transverse signal is observed, reflecting the on-track flow of vortices guided by skyrmions.", "This approach demonstrates a programmable strategy for topological superconducting devices, mimicking precise control in mechanical systems."]}}, {"title": "Exact pair density wave in topological moire flat bands and universal superfluid stiffness", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2608.26245", "authors": "Zhengzhi Wu, Ming-rui Li, Hong Yao", "last_authors": "Ming-rui Li, Hong Yao", "summary": "Pair-density waves (PDWs) are unconventional superconducting states beyond the BCS paradigm, but identifying them unambiguously in microscopic lattice models is generally challenging due to various competing orders. In particular, an exact realization of PDW in interacting models with topological bands remains elusive. Here we construct an interacting model on a twisted bilayer checkerboard lattice (TBCB) featuring topological flat bands, and rigorously show that an exact PDW ground state can be induced by quantum geometric nesting (QGN), owing to its momentum-space nonsymmorphic symmetry. We further prove that the superfluid stiffness of any nondegenerate QGN superconductor (including the PDW studied here and uniform superconductor) obeys the universal relation $D_s=2N_{\\rm flat}\\nu(1-\\nu)m_{\\rm pair}^{-1}$, where $N_{\\rm flat}$, $\\nu$, and $m_{\\rm pair}$ are the number of flat bands, flat band filling, and the two-particle effective mass, respectively. Our results reveal a rich interplay among PDW order, quantum geometry, and band topology.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Important theoretical model for pair density waves in topological moire systems, relevant to correlation studies.", "tags": ["moire", "superconductivity", "topological"], "image": "https://arxiv.org/html/2608.26245v2/miniBZ.png", "briefing": {"background": "모아레(Moire) 격자 시스템은 서로 다른 층의 원자 격자가 겹쳐질 때 발생하는 초격자 구조로, 밴드 구조를 평탄하게 만들어 강한 상관관계를 유도하기 좋습니다. 이러한 시스템에서 비전통적 초전도성을 찾는 것이 현대 응집물질물리학의 주요 과제 중 하나입니다.", "motivation": "기존 격자 모델에서는 경쟁하는 질서들 때문에 페어 밀도 파동(PDW)을 명확히 식별하기 어려웠습니다. 본 연구는 위상적 평탄 밴드가 있는 모아레 시스템에서 PDW를 수학적으로 엄밀하게 구현하고자 합니다.", "result": "비대칭(nonsymmorphic) 대칭성에 기인한 양자 기하학적 네스팅(QGN)을 통해 PDW 바닥 상태를 유도할 수 있음을 증명했습니다. 또한, 평탄 밴드 초전도체에서 초유체 강성(superfluid stiffness)이 보편적인 관계식을 따른다는 것을 이론적으로 규명했습니다.", "implication": "모아레 시스템에서의 위상적 성질과 양자 기하학이 초전도 질서와 어떻게 결합하는지에 대한 새로운 관점을 제공하며, 비BCS 이론의 구체적 모델을 제시합니다.", "novelty": "위상적 평탄 밴드에서 PDW가 정확히 유도됨을 수학적으로 증명하였고, 초유체 강성과 페어 질량 간의 보편적인 관계를 도출한 점이 핵심입니다.", "unresolved": "실제 실험적으로 이 모델을 완벽하게 구현할 수 있는 물질 후보군에 대한 구체적인 계산이나 제안은 부족합니다.", "future_work": "도출된 보편 관계식이 다른 강상관 위상 물질들에서도 성립하는지 확인하는 후속 이론 연구와 이를 검증할 수 있는 모아레 물질 설계가 필요합니다.", "concepts": [{"term": "Pair Density Wave (PDW)", "why_emerged": "기존 BCS 이론의 쿠퍼 쌍은 운동량이 0이지만, 비전통적 초전도체에서는 쿠퍼 쌍이 유한한 운동량을 가질 수 있음이 관측되었습니다.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "고온 초전도체 내의 질서 변수, 스핀 밀도 파동(SDW)과의 경쟁 및 공존."}, {"term": "Quantum Geometric Nesting (QGN)", "why_emerged": "밴드 구조의 평탄함뿐만 아니라 파동함수의 기하학적 성질이 물리적 현상을 지배하는 경우를 설명하기 위해 필요합니다.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "베리 곡률, 모아레 밴드 공학, 평탄 밴드 초전도성."}], "english_summary": ["Constructs a rigorous model for Pair Density Waves (PDW) on a twisted bilayer checkerboard lattice.", "Utilizes quantum geometric nesting (QGN) to induce PDW ground states in topological flat bands.", "Derives a universal relationship for superfluid stiffness linked to flat band filling and effective pair mass.", "Demonstrates a profound interplay between topology, quantum geometry, and superconducting orders."]}}, {"title": "From raw magnetoresistance to reliable cyclotron masses: A practical guide to processing quantum oscillation data", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2611.28044", "authors": "Josh Leeman, Sudipta Chatterjee, Max Hirschberger, Leslie M. Schoop", "last_authors": "Max Hirschberger, Leslie M. Schoop", "summary": "Quantum oscillations are an essential probe of the Fermi surface in conductors, and cyclotron masses extracted using the Lifshitz-Kosevich (LK) formula are used to evaluate correlation strength and the assignment of topological states. These masses depend on choices in signal processing, including the field 5t . This model can be realized within the double Kondo lattice model, relevant to bilayer nickelates, in the limit of strong inter-layer spin coupling ( J ⟂ / t → + ∞ J_{\\perp}/t\\rightarrow+\\infty ) and a balancing inter-layer repulsion ( V V ). Importantly, the double Kondo model does not fundamentally restrict J ⟂ / t J_{\\perp}/t , suggesting the potential for high critical temperatures ( T c T_{c} ) approaching 0.5 ​ t 0.5t . While this idealized limit predicts large pairing gaps, we show a smooth connection to the more realistic regime with J ⟂ ∼ t J_{\\perp}\\sim t , albeit with a reduced pairing gap of approximately 0.1 ​ t 0.1t . Assuming t ∼ 10 3 t\\sim 10^{3} K in typical solid state systems, our model suggests the exciting possibility of achieving T c T_{c} of hundreds of Kelvin. We propose searching for bilayer materials with reduced out-of-plane lattice constants to better approximate the conditions of our ideal model.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Relevant theory for high-Tc mechanisms in bilayer nickelates, connecting to strongly correlated systems.", "tags": ["superconductivity", "nickelates", "theory"], "image": "https://arxiv.org/html/2411.07292v3/fig1_model_v10.png", "briefing": {"background": "고온 초전도체는 흔히 인력(attractive interaction)이 필요하다고 간주되지만, 강한 상관관계가 있는 시스템에서는 동역학적 에너지(kinetic energy)만으로 초전도성이 발현될 가능성이 제기되어 왔습니다.", "motivation": "이중 콘도 격자 모델(double Kondo lattice model) 등에서 운동 에너지만을 이용한 고온 초전도성을 이론적으로 검증하고, 이를 이중층 니켈산염에 응용하고자 합니다.", "result": "DMRG 수치 계산을 통해 운동 에너지 기반 초전도성에서 도핑이 증가함에 따라 페어링 갭과 위상 강성이 함께 증가함을 발견했습니다. 특정 조건하에서 수백 켈빈급의 Tc가 가능함을 보였습니다.", "implication": "전통적인 phonon-mediated BCS 메커니즘을 넘어, 전자 간 운동 에너지만으로 고온 초전도성을 구현할 수 있는 새로운 경로를 제시합니다.", "novelty": "상호작용이 없는 순수 운동 에너지 모델에서 강한 페어링을 도출했다는 점과, 이를 bilayer nickelate 시스템과 연결하여 물질 설계 원리를 제안한 점이 주목할 만합니다.", "unresolved": "이상적인 모델(J/t → ∞)에서는 갭이 크지만, 현실적인 물질 변수를 대입했을 때 갭이 크게 감소하는 문제에 대한 상세한 보정은 추가 연구가 필요합니다.", "future_work": "실제 이중층 니켈산염 물질의 합성과 압력을 이용한 층간 거리 scopy (XPCS) reveals multiscale, temperature- and wave-vector-dependent magnetic dynamics characterized by compressed-exponential relaxation and signatures of critical slowing down near the magnetic transition. These findings suggest the role of spin-orbit coupling and local structural distortions as the possible mechanism orchestrating such unconventional dynamics.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "High-quality spectroscopic study of spin-orbit coupled iridates with relevance to electronic structure.", "tags": ["electronicstructure", "magnetism", "Sr2IrO4"], "image": "https://arxiv.org/html/2611.28395v1/Figure_1_ver2_HR.png", "briefing": {"background": "Sr2IrO4는 강한 스핀-궤도 결합(SOC)이 나타나는 대표적인 5d 전이금속 산화물로, 전자 간 강한 상관관계와 자기적 질서가 얽혀 있는 양자 물질입니다. 이 물질의 자기-구조적 상호작용은 복잡한 양자 상태를 이해하는 핵심 열쇠입니다.", "motivation": "스핀-궤도 결합과 격자 왜곡이 어떻게 자기적 동역학을 조절하는지, 그리고 이들 사이의 협력적 행동이 어떤 임계 현상을 나타내는지 규명하고자 했습니다.", "result": "구조적 격자 왜곡이 자기 질서 변수의 제곱에 비례하며, 자기적 질서와 동일한 2D XY 모델의 임계 거동을 따른다는 점을 확인했습니다. 또한, 전이 온도 근처에서 느린 동역학(critical slowing down)이 나타남을 관찰했습니다.", "implication": "Sr2IrO4의 비전형적인 동역학은 SOC와 국소 구조적 왜곡이 서로 얽혀서 발생한다는 것을 시사하며, 이는 다른 강상관계 물질의 상전이 연구에도 중요한 이정표가 될 것입니다.", "novelty": "XPCS(X-ray photon correlation spectroscopy)를 사용하여 자기적 동역학을 다중 스케일에서 분석한 점이 독창적입니다. 이는 RIXS나 ARPES를 통해 전자 구조를 공부하는 사용자에게 격자-자기 간의 상세한 결합 메커니즘을 시각화해 줍니다.", "unresolved": "왜곡된 구조가 단순히 자기적 질서의 부수적 결과인지, 아니면 동역학의 직접적인 동인인지에 대한 명확한 인과관계 분석이 추가로 필요합니다.", "future_work": "온도 및 자기장 환경에서의 정밀한 동역학 제어 실험과, 이러한 동역학이 실제 초전도성 또는 위상학적 상태와 어떻게 연결되는지에 대한 연구가 필요합니다.", "concepts": [{"term": "2D XY Model", "why_emerged": "2차원 격자에서 스핀의 방향이 면 내에서 자유롭게 회전할 수 있는 경우의 상전이를 기술하기 위해 필요합니다.", "origin": "Berezinskii(1971), Kosterlitz와 Thouless(1973)에 의해 제안된 BKT 전이와 관련이 있습니다.", "connections": "평면 자기이방성을 가진 강자성체나 다층 박막 물질의 자기 거동 설명에 자주 등장합니다."}, {"term": "Critical Slowing Down", "why_emerged": "상전이점 근처에서 계의 요동이 매우 느려지는 현상을 설명하기 위해 도입되었습니다.", "origin": "초기 통계 물리학의 임계 현상 이론에서 확립되었습니다.", "connections": "다양한 상전이 시스템(강자성체, 액정 s, may not be essential for superconductivity. The calculated superconducting transition temperature ( T C T_{C} ) is approximately 10 K, in good agreement with experimental observations.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Important electronic structure and pairing study on superconducting nickelates, bridging to cuprate physics.", "tags": ["nickelate", "superconductivity", "electronicstructure"], "image": "https://arxiv.org/html/2611.28747v1/fig1_1.png", "briefing": {"background": "자동 브리핑을 생성하지 못했습니다. 초록과 원문 링크를 기준으로 빠르게 확인하세요.", "motivation": "초록 정보만으로는 분야 내부의 구체적 동기를 안정적으로 요약하기 어렵습니다.", "result": "Motivated by the recent observation of ambient-pressure superconductivity in Pr- and Y-substituted La 4 Ni 3 O 8 , we combined density-functional theory (DFT), dynamical mean-field theory (DMFT), random phase approximation (RPA), and fluctuation exchange approximation (FLEX) methods to study its electronic structure and superconducting pairing symmetry. DFT band analysis indicates that the low-energy states are mainly dominated by three Ni-3 d x 2 − y 2 d_{x^{2}-y^{2}} orbitals with weak d d - p p hybridization. Multi-orbital DMFT calculations yield an average d x 2 − y 2 d_{x^{2}-y^{2}} filling of about 0.87, close to the optimal value for infinite-layer nickelates. By comparing the DMFT results of d x 2 − y 2 d_{x^{2}-y^{2}} only and full Ni-3 d d models, we find that their electronic properties are almost completely consistent, demonstrating the effectiveness of the simplified d x 2 −", "implication": "필터가 이 논문을 통과시킨 이유는 관련 키워드, 저자, 또는 Gemini relevance score 때문입니다.", "novelty": "Important electronic structure and pairing study on superconducting nickelates, bridging to cuprate physics.", "unresolved": "원문 확인 후 열린 질문을 판단해야 합니다.", "future_work": "후속 실험, 독립 재현, 관련 물질/조건 확장이 가능한지 확인하세요.", "concepts": [], "english_summary": ["The detailed AI briefing was unavailable for this paper.", "Use the abstract, score reason, and original link for a quick first pass."]}}, {"title": "Neutron Spin Resonance as Probe of Triplet Pair Density Waves in CeCoIn5", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2611.30395", "authors": "David W. Tam, Ilaria Maccari, St\\'ephane Raymond, et al.", "last_authors": "Aline Ramires, Michel Kenzelmann", "summary": "Spin resonance modes are among the most characteristic collective excitations of unconventional superconductors, yet their microscopic origin remains unresolved. Although commonly interpreted as purely magnetic excitations, this picture does not explain the rich magnetic field evolution of these modes observed in heavy-fermion superconductors. Here we combine inelastic neutron scattering and symmetry analysis to investigate the evolution of the spin resonance modes in the heavy-fermion superconductor CeCoIn$_5$ under an in-plane magnetic field. At high fields, approaching the upper critical field of the superconductor, we discover a third resonance mode with relatively high intensity. We demonstrate that the resonance branches observed experimentally can be interpreted as collective modes of the superconducting condensate involving transitions to excited superconducting states. This framework provides a unified interpretation of the field-induced splitting of the resonance, the newly observed mode at high fields, the relative neutron scattering intensities of each mode, and provides the first direct evidence that a spin resonance mode can be associated with a singlet-triplet excitation of a superconductor.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Heavy fermion superconductivity/pair density waves; direct connection to unconventional superconductivity interest.", "tags": ["superconductivity", "neutron-scattering", "heavy-fermion"], "image": "https://arxiv.org/html/2611.30395v1/New_Fig1.png", "briefing": {"background": "CeCoIn5는 무거운 페르미온(heavy-fermion) 초전도체 중 가장 연구가 많이 된 물질로, 강한 자기장 환경에서 발생하는 독특한 초전도 상태와 자기적 들뜸(spin resonance) 연구 nic states on sub-cycle timescales. Despite its importance, the microscopic pathways for photocarrier generation in this regime remain poorly understood, as neither perturbative multiphoton absorption nor adiabatic tunneling provides an adequate description. Here, we perform time-resolved optical spectroscopy on the correlated van der Waals insulator NiPS$_3$ while systematically tuning the drive electric field and frequency over a wide range. In the crossover regime, we observe multiphoton-like resonances that are blue-shifted by ponderomotive effects within an otherwise tunneling-dominated absorption channel - a clear spectroscopic signature of adiabaticity breakdown. Hubbard-model simulations based on a time-dependent Gaussian variational approach qualitatively reproduce these features. Together, our results elucidate the microscopic mechanisms of charge excitation in the Keldysh crossover regime and identify a key ingredient for controlling strong-field nonlinear dynamics in correlated materials.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Time-resolved spectroscopy study on correlated insulators, relevant for interpretation of driven dynamics.", "tags": ["vanderWaals", "correlated", "Hubbard", "transport"], "image": "https://arxiv.org/html/2611.28980v1/Fig1.png", "briefing": {"background": "강한 전기장 하에서 고체 내 전자가 어떻게 여기(excitation)되는지를 이해하는 것은 고속 비선형 광학 및 Floquet 공학의 핵심 과제입니다.", "motivation": "Keldysh 크로스오버 영역(다광자 흡수와 단열 터널링 사이)에서 전하 여기의 미시적 경로가 명확하지 않아 이를 규명하고자 함.", "result": "NiPS3(상관관계 절연체)에서 구동 주파수와 전기장을 정밀 제어하여, 터널링이 지배적인 영역에서 폰더모티브 효과에 의한 청색 편이된 다광자 공명을 관측함.", "implication": "강상관계 물질에서 강한 외부 구동 하의 전자 동역학을 이해하고 제어할 수 있는 새로운 이정표를 제시함.", "novelty": "섭동 이론과 순수 단열 터널링 이론 사이의 미개척 영역인 Keldysh 크로스오버에서 단열성 파괴의 분광학적 증거를 실험적으로 포착함.", "unresolved": "이 미시적 메커니즘이 다른 강상관계 물질이나 복잡한 위상학적 상태에서 얼마나 범용적으로 적용될지는 추가 연구가 필요함.", "future_work": "다른 위상 부도체나 자기적 구조를 가진 강상관계 물질에 대한 유사한 시간 분해 광학 실험을 통해 이 모델의 일반화 확인.", "concepts": [{"term": "Keldysh Crossover", "why_emerged": "강한 광학장 하에서 전자 여기 메커니즘이 다광자 흡수에서 강한장 터널링으로 전이되는 영역을 설명하기 위해 필요함.", "origin": "Leonid Keldysh (1964)", "connections": "강한장 물리, 아토초 분광학"}, {"term": "Ponderomotive Effect", "why_emerged": "진동하는 전기장 내에서 입자가 받는 평균적인 척력을 기술하기 위해 필요함.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "플라즈마 물리, 광학적 트랩"}, {"term": "Floquet Engineering", "why_emerged": "주기적인 외부 구동을 통해 물질의 유효 해밀토니안을 수정하여 새로운 양자 상태를 유도하기 위해 필요함.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "비평형 통계역학, 위상학적 절연체"}], "english_summary": ["Investigated charge excitation in correlated NiPS3 under strong driving fields.", "Identified spectroscopic signatures of adiabaticity breakdown in the Keldysh crossover regime.", "Observed ponderomotive blue-shifted multiphoton resonances within a tunneling-dominated channel.", "Provided a theoretical framework based on time-dependent Gaussian variational approach."]}}, {"title": "Quantum Geometry Effects in Lattice Dynamics", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2611.30210", "authors": "Haoshu Li, Hao Chen, Qian Niu", "last_authors": "Hao Chen, Qian Niu", "summary": "Quantum geometric effects such as the Berry curvature and the quantum metric are well established in electronic transport, whereas in lattice dynamics the Berry curvature also plays a key role: adiabatically following the lattice, electrons generate a molecular Berry curvature that splits degenerate optical phonons into chiral partners. To determine how the quantum metric affects phonons, we go beyond adiabatic lattice dynamics, identifying Berry curvature and quantum metric contributions to the electronic response of the lattice. Using first-principles calculations in the magnetic topological semimetal EuB$_6$, we find that phonon modes with chiral splitting and those with nonchiral splitting coexist. Unlike the former, which originate from the Berry curvature, the latter arise from the pure quantum metric, while the Berry curvature contribution is forbidden by crystal ption of Sondheimer oscillations to type-I Weyl semimetal films. We account for the Berry curvature, the orbital magnetic moment and the effect of the Zeeman coupling on the Fermi wavevector and the electronic group velocity. The Berry curvature and the orbital magnetic moment generate a beating pattern and chirping in the Sondheimer oscillations. In the thick-film and thin-film regimes, we provide analytical expressions for the longitudinal conductivity, which highlight the interplay between electronic band topology and boundary-scattering in magnetotransport.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Directly links Berry curvature and magnetotransport in topological Weyl semimetals.", "tags": ["Weylsemimetal", "Berrycurvature", "transport"], "image": "https://arxiv.org/html/2611.29875v1/01_approximation_comparison.png", "briefing": {"background": "금속 박막 내에서 자기장이 인가될 때 전자들이 표면 사이를 왕복하며 발생하는 양자화된 전도도 진동 현상(Sondheimer oscillation)은 고전적인 금속의 전자 구조를 연구하는 중요한 수단입니다.", "motivation": "위상적 특성을 가진 Weyl 반금속 박막에서도 이러한 크기 효과(size effect)가 나타나며, 특히 물질 고유의 Berry 곡률(Berry curvature)이 이 진동 패턴을 어떻게 변화시키는지 이론적으로 규명하고자 했습니다.", "result": "반고전적 볼츠만 방정식을 확장하여 Berry 곡률과 궤도 자기 모멘트가 Sondheimer 진동의 비팅(beating)과 처핑(chirping) 패턴을 유도함을 보였습니다.", "implication": "자기 수송 측정을 통해 위상적 물질의 Berry 곡률과 밴드 위상 정보를 역으로 추적할 수 있는 정교한 분석 틀을 제공합니다.", "novelty": "기존의 일반 금속에 국한되었던 Sondheimer 진동 이론을 위상 반금속의 밴드 위상과 Zeeman 결합이 포함된 물리량으로 확장했습니다.", "unresolved": "실제 Weyl 반금속 시료에서의 층 두께나 표면 산란 특성에 따른 정량적인 실험 데이터와의 상세한 비교가 필요합니다.", "future_work": "다양한 두께의 Weyl 반금속 박막을 이용한 실제 자기 저항 측정 및 Berry 곡률에 의한 비팅 주파수의 실험적 관측.", "concepts": [{"term": "Sondheimer oscillation", "why_emerged": "금속 박막에서 전자의 평균 자유 행로가 박막 두께와 비슷해질 때 발생하는 기하학적 자기 저항 진동을 설명하기 위해 도입.", "origin": "E. H. Sondheimer (1950년).", "connections": "Shubnikov-de Haas 진동과는 기원(궤도 운동 vs 표면 산란)이 다름."}, {"term": "Weyl semimetal", "why_emerged": "에너지 밴드가 선형적으로 교차하는 Weyl 노드를 가진 위상적 위상을 기술하기 위해 도입.", "origin": "초록 정보만으로는 특정하기 어려움 (일반적으로 이론적 예측은 2011년경).", "connections": "Berry 곡률, 비정상 홀 효과와 밀접한 관련."}], "english_summary": ["Extends semiclassical Boltzmann transport theory to Type-I Weyl semimetal films.", "Identifies that Berry curvature and orbital magnetic moments cause distinct beating and chirping in Sondheimer oscillations.", "Provides analytical expressions for magnetotransport that connect band topology to boundary scattering.", "Offers a potential tool to extract topological band properties via magnetotransport in thin films."]}}, {"title": "Strain-induced non-trivial band topology and large magnetoresistance in epitaxial SrTaO3 thin films", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2611.30681", "authors": "Aditya Mehta, Soumyakanta Panda, Pratik Sahu, et al.", "last_authors": "B. R. K. Nanda, D. Samal", "summary": "Epitaxial thin films of complex transition metal oxides constitute an ideal platform for realizing correlated topological phases through strain engineering of crystal symmetry and band topology. Here, we investigate the electronic transport properties and the band structure of the 5 d 1 d^{1} paramagnetic metal SrTaO 3 thin film under epitaxial compressive strain. The film exhibits a large non-saturating quasi-quadratic magnetoresistance (MR) and a nonlinear Hall effect characteristic of two-band transport, together with the field induced re-entrant metallic behavior. The violation of Kohler’s scaling further corroborates the scattering from multiple bands. Semiclassical two-band analysis yields carrier densities and mobilities of the order ∼ 10 21 ​ cm − 3 \\sim 10^{21}~\\mathrm{cm^{-3}} and ∼ 10 4 ​ cm 2 ​ V − 1 ​ s − 1 \\sim 10^{4}~\\mathrm{cm^{2}V^{-1}s^{-1}} , respectively. The observed large mobility and unsaturated MR, indicates the presence of a non-trivial band structure. Consistent with this, results from density functional theory calculations and tight binding model studies reveal that the stable structure has an octahedral rotation a 0 ​ a 0 ​ c + a^{0}a^{0}c^{+} , where the non-symmorphic symmetry ensures the presence of topological nodal lines yielding finite Berry curvature in the vicinity of the Fermi level. Besides the nodal line, trivial electron and hole pockets exist near the Fermi level, contributing to electron transport. These findings establish that epitaxial strain drives SrTaO 3 into a nontrivial topological semimetal, a phase inaccessible in the bulk counterpart.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Topological semimetal and electronic structure study in oxides, relevant for ARPES interests.", "tags": ["material", "topology", "bandstructure"], "image": "https://arxiv.org/html/2611.30681v1/Fig.1.png", "briefing": {"background": "천이 금속 산화물 박막은 격자 왜곡이나 변형(strain)을 통해 대칭성을 제어할 수 있어, 벌크에서는 구현하기 힘든 새로운 전자 상태를 유도할 수 있는 중요한 물질 플랫폼입니다.", "motivation": "SrTaO3 박막에 에피택셜 압축 변형을 가하여 비대칭적 결정 구조를 유도하고, 이로 인해 발생하는 위상적 밴드 구조와 수송 현상을 탐구하고자 했습니다.", "result": "변형된 SrTaO3에서 비자명한 노드 라인(nodal line) 위상을 확인했으며, 이로 인해 큰 이동도와 비포화 자기저항(non-saturating MR)이 나타남을 관찰했습니다.", "implication": "변형 공학을 통해 산화물 박막을 위상적 반금속으로 설계할 수 있음을 증명하며, 이는 미래의 토폴로지 전자 소자 개발의 가능성을 시사합니다.", "novelty": "산화물 5d1 시스템에서 변형을 이용해 노드 라인을 유도하고, 이것이 수송 현상에 미치는 영향을 DFT 및 tight-binding 계산으로 상세히 분석했습니다.", "unresolved": "노드 라인의 위상적 성질을 직접 검증하는 ARPES나 광학적 측정 결과는 아직 논문에 명시되지 않음.", "future_work": "ARPES를 통한 실제 밴드 구조 관측 및 노드 라인에 의한 위상적 수송 현상의 추가 검증.", "concepts": [{"term": "Nodal line", "why_emerged": "3차원 브릴루앙 존에서 밴드 축퇴가 점이 아닌 선 형태로 나타나는 위상적 특징을 정의하기 위해 필요.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "Weyl 반금속, 위상적 절연체 연구와 연결됨."}, {"term": "Kohler's scaling", "why_emerged": "자기 저항의 거동이 산란율의 함수로 일반화됨을 기술하기 위해 필요.", "origin": "M. Kohler (1938년).", "connections": "다중 밴드 수송이나 산란 기작이 복잡해지면 이 법칙의 위반이 나타남."}], "english_summary": ["Investigates strain-engineered SrTaO3 thin films as a topological semimetal candidate.", "Reports large non-saturating magnetoresistance and nonlinear Hall effect.", "DFT calculations reveal topological nodal lines arising from a0a0c+ octahedral rotations.", "Demonstrates that epitaxial strain can drive oxide systems into non-trivial topological phases."]}}, {"title": "Stripe-Like Superconducting Enhancement and Coexisting Magnetic Texture in an Infinite Layer Nickelate", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2609.15958", "authors": "Ryan Laing, Dung Vu, Jacob Pfund, et al.", "last_authors": "Charles Ahn, Ilya Sochnikov", "summary": "Despite their promise as structural and electronic analogs to cuprates, nickelate thin films consistently exhibit broadened superconducting transitions in many experiments that remain poorly understood. Local measurements are ideal for revealing the presence of defects or competing phases, which may cause this transition broadening through a phase-separation. Here, we use scanning SQUID microscopy to investigate local superfluid density and magnetic texture of optimally doped $\\mathrm{Nd}_{1-x}\\mathrm{Eu}_{x}\\mathrm{NiO}_{2}$ (NENO) (x=0.25) grown via molecular beam epitaxy. We observed a weakly-magnetic texture coexisting with superconductivity. Spatially resolved susceptibility imaging reveals a highly non-uniform superconducting state, characterized by a robust stripe-like enhancement pattern appearing near the phase transition. By resolving the mesoscopic landscape of electronic and magnetic inhomogeneities, these findings suggest that a competing magnetic phase is a primary contributor to the unusually broad superconducting transitions of these optimally doped NENO samples. Understanding the uncovered superconducting enhancement may provide a path to raising superconducting temperatures in these materials.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Direct experimental study (scanning SQUID) on nickelate superconductivity and electronic inhomogeneities.", "tags": ["nickelate", "superconductivity", "experimental"], "image": "https://arxiv.org/static/browse/0.3.4/images/arxiv-logo-fb.png", "briefing": {"background": "니켈레이트(Nickelate) 박막은 구리산화물 고온 초전도체와 구조적으로 유사하여 고온 초전도 기작을 규명할 핵심 후보군으로 주목받고 있으나, 초전도 전이 폭이 넓다는 문제점이 있습니다.", "motivation": "초전도 전이가 넓게 나타나는 원인이 물질 내 불균일성(inhomogeneity) 때문인지 확인하기 위해 공간 분해능이 높은 스캔 SQUID로 미세 구조를 관찰하고자 했습니다.", "result": "초전도 영역 근처에서 스트라이프 형태의 초전도 강화 패턴을 관찰했으며, 이와 공존하는 미세한 자기 텍스처가 존재함을 확인했습니다.", "implication": "니켈레이트 내의 초전도 전이 폭이 넓은 주된 원인이 경쟁하는 자기 위상과의 불균일한 공존 때문일 가능성을 강력히 제시합니다.", "novelty": "스캔 SQUID를 통해 니켈레이트 박막의 국소적인 초전도 및 자기적 불균일성을 직접 시각화했습니다.", "unresolved": "관찰된 자기 텍스처의 상세한 원자적 기원 및 그것이 초전도와 결합하는 정확한 메커니즘은 미지수입니다.", "future_work": "자기적 위상을 제어하여 초전도 특성을 향상시킬 수 있는 방법론 탐색 및 니켈레이트의 도핑 최적화.", "concepts": [{"term": "Scanning SQUID microscopy", "why_emerged": "극히 낮은 자기 신호를 국소적으로 측정하여 미세한 자성이나 초전도 전류 분포를 파악하기 위해 개발.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "STM/STS와 함께 물질의 불균일성을 연구하는 핵심 장비."}, {"term": "Infinite layer nickelate", "why_emerged": "페로브스카이트 구조에서 산소를 제거하여 구리산화물과 유사한 CuO2 평면 구조를 만들기 위해 개발.", "origin": "M. Li et al. (2019년, Nature).", "connections": "구리산화물 고온 초전도체와 유사한 electronic analog로 기대를 모음."}], "english_summary": ["Uses scanning SQUID microscopy to map superconducting and magnetic landscapes in Nd1-xEuxNiO2.", "Identifies stripe-like superconducting enhancement coexisting with magnetic texture.", "Suggests that electronic and magnetic inhomogeneities contribute to broadened superconducting transitions.", "Provides insights into controlling competing phases to optimize nickelate superconductivity."]}}, {"title": "Topological Charge-Transfer Excitons", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2608.05308", "authors": "Huiyuan Zheng, Kaijie Yang, Ting Cao, Di Xiao", "last_authors": "Ting Cao, Di Xiao", "summary": "Excitons possess internal structure absent from single-particle Bloch particles, allowing their band topology to emerge from the bound-state structure rather than being inherited from their constituents. This raises the question of how the internal structure of a bou  jumps of greater than three orders of magnitude. We demonstrate that this is a manifestation of electron overheating that can be explained by an electron-phonon decoupling mechanism; an overheating model can explain the experimental observations with lattice temperatures varying between 65 and 800 mK. Applied voltage-induced electron overheating in disordered materials has previously been demonstrated in systems with an Arrhenius temperature dependence; in this work the dominant transport mechanism is that of Efros-Shklovskii hopping. Notably, it has been predicted that electron-phonon decoupling is harder to observe in such a system, when compared to a system in which transport takes an Arrhenius form.", "tier": "B_IMPORTANT_CONDMAT", "score": "7", "reason": "Experimental study of quantum Hall regime relevant to broader interest.", "tags": ["quantum-Hall", "phonon", "transport"], "image": "", "briefing": {"background": "양자 홀 효과(QHE) 영역에서 전자와 격자(포논) 간의 상호작용은 고온에서 에너지 평형을 방해하며, 이는 소자 물성에 직접적인 영향을 줍니다.", "motivation": "강한 자기장 하에서 전자-포논 결합이 약해지는 '디커플링' 현상을 관찰하여, 2차원 전자 가스의 비평형 수송 기작을 규명하고자 했습니다.", "result": "GaAs/AlGaAs 2DEG 시스템에서 Efros-Shklovskii 호핑 전도를 기반으로 한 전자 과열(overheating) 모델을 통해 실험 결과인 히스테리시스 전류 점프 현상을 설명했습니다.", "implication": "강한 상관관계 또는 무질서 시스템에서 전자-포논 디커플링이 관찰되는 조건을 정의하여 나노 소자의 발열 제어 기초가 됩니다.", "novelty": "Efros-Shklovskii 호핑 전도 환경에서의 전자-포논 디커플링을 명확히 증명한 사례입니다.", "unresolved": "호핑 전도와 무질서도가 정확히 어떤 밀도 의존성을 가지는지에 대해 정량적 추가 실험이 요구됩니다.", "future_work": "위상 절연체나 다른 2차원 시스템에서의 유사한 열적 분리 효과 연구.", "concepts": [{"term": "양자 홀 효과(QHE)", "why_emerged": "2차원 전자 계에서 강한 자기장에 의해 전도도가 양자화되는 현상을 설명하기 위해 제안됨.", "origin": "Klaus von Klitzing (1980).", "connections": "위상학적 물질, 란다우 준위, 베리 위상."}, {"term": "Efros-Shklovskii 호핑", "why_emerged": "쿨롱 상호작용이 무질서한 계에서 전자의 도약 전도를 제한하는 현상을 설명하기 위해 도입됨.", "origin": "A. L. Efros, B. I. Shklovskii (1975).", "connections": "안데르송 국소화, Mott 호핑."}], "english_summary": ["Study of electron-phonon decoupling in the quantum Hall regime.", "Observed
