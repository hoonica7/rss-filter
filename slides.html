<title>Daily Paper Slideshow</title>
<style>
  :root {
    color-scheme: light;
    --bg: #f6f7f4;
    --paper: #ffffff;
    --ink: #111827;
    --muted: #64748b;
    --line: #d8ddd2;
    --accent: #176b87;
    --accent-2: #9a3412;
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; overflow: auto; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: var(--bg); color: var(--ink); }
  .shell { max-width: 1500px; min-height: 100vh; margin: 0 auto; padding: 14px 18px; display: flex; flex-direction: column; }
  .topbar { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 16px; }
  .top-actions { display: flex; align-items: center; gap: 10px; }
  .topbar a, button { border: 1px solid var(--line); border-radius: 8px; background: var(--paper); color: var(--ink); padding: 10px 14px; font-weight: 700; text-decoration: none; cursor: pointer; }
  button.primary { background: var(--accent); border-color: var(--accent); color: white; }
  button:disabled { opacity: 0.45; cursor: not-allowed; }
  .counter { color: var(--muted); font-weight: 700; }
  .slide { min-height: calc(100vh - 82px); background: var(--paper); border: 1px solid var(--line); border-radius: 10px; padding: 18px; box-shadow: 0 18px 42px rgba(15, 23, 42, 0.10); display: grid; grid-template-columns: minmax(310px, 0.86fr) minmax(0, 1.55fr); gap: 18px; overflow: visible; }
  .paper-head { min-width: 0; min-height: 0; overflow: visible; display: flex; flex-direction: column; gap: 12px; }
  .figure { margin: 0; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: #f8fafc; }
  .figure img { display: block; width: 100%; max-height: 41vh; object-fit: contain; background: white; }
  .figure figcaption { padding: 7px 10px; color: var(--muted); font-size: 12px; line-height: 1.3; }
  .head-text { display: flex; flex-direction: column; gap: 9px; min-width: 0; }
  .badges { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .badge { border-radius: 999px; padding: 5px 9px; background: #eef2ff; color: #3730a3; font-size: 12px; font-weight: 800; }
  .score { background: #fee2e2; color: #991b1b; }
  h1 { margin: 0; font-size: 25px; line-height: 1.15; letter-spacing: 0; overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
  h1 a { color: inherit; text-decoration-color: rgba(23, 107, 135, 0.35); text-decoration-thickness: 2px; text-underline-offset: 4px; }
  h1 a:hover { color: var(--accent); text-decoration-color: var(--accent); }
  .meta, .authors, .why, .abstract { font-size: 13px; line-height: 1.45; }
  .meta, .authors { color: var(--muted); }
  .why strong, .abstract strong, .authors strong { color: var(--ink); }
  .authors { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .why { border-left: 4px solid var(--accent-2); padding-left: 10px; color: #374151; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .abstract { border-top: 1px solid var(--line); padding-top: 14px; color: #374151; }
  .original-abstract { border-top: 1px solid var(--line); padding-top: 10px; color: #374151; font-size: 11.5px; line-height: 1.35; overflow-wrap: anywhere; }
  .original-abstract strong { display: block; margin-bottom: 4px; color: var(--ink); }
  .tags { display: flex; flex-wrap: wrap; gap: 8px; }
  .tag { border-radius: 999px; padding: 4px 8px; background: #f1f5f9; color: #475569; font-size: 12px; font-weight: 700; }
  .head-text > .link { display: none; }
  .briefing { min-width: 0; min-height: 0; overflow: visible; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); grid-auto-rows: minmax(0, auto); align-content: start; gap: 11px 18px; border-top: 0; padding-top: 0; }
  .brief-section { min-width: 0; }
  .brief-section.wide { grid-column: 1 / -1; }
  .brief-section h2 { margin: 0 0 4px; font-size: 14px; line-height: 1.22; color: #0f766e; letter-spacing: 0; }
  .brief-section p, .brief-section li { margin: 0; font-size: 12.5px; line-height: 1.42; color: #1f2937; overflow-wrap: anywhere; }
  .brief-section ul { margin: 0; padding-left: 20px; }
  .concepts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 9px 14px; }
  .concept { border-top: 1px solid var(--line); padding-top: 7px; }
  .concept h3 { margin: 0 0 4px; font-size: 13px; color: #7c2d12; letter-spacing: 0; }
  .concept p { margin: 2px 0 0; font-size: 11.5px; line-height: 1.35; color: #374151; overflow-wrap: anywhere; }
  .concept b { color: #111827; }
  .link { color: var(--accent); font-weight: 800; text-decoration: none; }
  .empty { padding: 48px; background: var(--paper); border: 1px solid var(--line); border-radius: 12px; color: var(--muted); }
  @media (max-width: 860px) {
    .shell { padding: 14px; }
    .topbar, .top-actions { align-items: stretch; flex-direction: column; }
    .slide, .briefing, .concepts { grid-template-columns: 1fr; }
    .slide { min-height: auto; overflow: visible; display: grid; }
    h1 { font-size: 28px; }
  }
</style>

<script>
const slides = [{"title": "Observation of light-induced topological state in graphene", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2610.39695", "authors": "Sotirios Fragkos, Ann Chantal Goutier, Umberto Dellasette, et al.", "last_authors": "Michael Sch\\\"uler, Samuel Beaulieu", "summary": "Driving quantum materials with light can reshape not only their electronic band structures but also the geometry of their electronic wavefunctions. In graphene, circularly polarized light is predicted to open gaps at the Dirac points and induce a pseudospin texture and Berry curvature characteristic of the Haldane model, realizing a Floquet Chern insulator [ 32 , 33 , 26 , 18 ] . Transport and all-optical measurements have provided evidence for a light-induced anomalous Hall response [ 29 , 25 ] , but cannot resolve the underlying electronic states in both energy and momentum space. Time- and angle-resolved photoemission spectroscopy has revealed Floquet-Bloch sidebands [ 30 , 10 ] and hybridization gaps at crossings between Floquet bands [ 44 ] . However, these experiments used linearly polarized driving, which preserves time-reversal symmetry and thus does not induce a topological phase. Here, we combine circular-dichroic time-resolved extreme-ultraviolet momentum microscopy [ 14 ] with ab initio theory to investigate graphene driven by circularly polarized light. We observe a pump-induced photoemission circular dichroism near the Dirac point that reverses sign with pump helicity and across the Dirac energy, in agreement with our calculations. These results link the measured dichroic response to the light-induced pseudospin texture and its associated Berry curvature, providing spectroscopic evidence for the Floquet-engineered topological insulating state in graphene.", "tier": "A_MUST_READ", "score": "10", "reason": "Direct hit: tr-ARPES momentum microscopy of Floquet-engineered topological states and Berry curvature in graphene.", "tags": ["tr-ARPES", "graphene", "Floquet", "Berrycurvature"], "image": "https://arxiv.org/html/2610.39695v1/Figure_1.png", "briefing": {"background": "빛을 이용하여 물질의 전자 구조를 실시간으로 제어하는 Floquet 공학은 평범한 물질을 위상 절연체로 변환시킬 수 있는 가능성을 제시해 왔습니다. 특히 그래핀은 원편광(circularly polarized light)에 노출될 때 디락 지점에서 밴드 갭이 열리고 할데인 모델(Haldane model)과 유사한 위상 상태가 유도될 것으로 예측되었습니다.", "motivation": "기존의 수송 측정이나 광학적 측정은 유도된 변칙 홀 반응의 증거를 제시했지만, 에너지와 운동량 공간에서 실제 전자 상태와 위상적 성질(Berry curvature)을 직접적으로 시각화하는 데에는 한계가 있었습니다. 특히 선편광을 사용한 기존 tr-ARPES 실험은 시간 반전 대칭성을 깨뜨리지 못해 위상 상태 구현에 제약이 있었습니다.", "result": "연구진은 원편광 이색성 시간 분해 극자외선 모멘텀 현미경(CD-tr-XUV momentum microscopy)을 사용하여, 원편광 구동 하의 그래핀에서 디락 지점 근처의 광전자 이색성 신호를 관찰했습니다. 이 신호는 펌프 광의 반전성(helicity)과 디락 에너지를 가로지르며 부호가 반전되었으며, 이는 Floquet 엔지니어링에 의해 유도된 유사스핀(pseudospin) 텍스처와 베리 곡률(Berry curvature)을 직접적으로 나타냅니다.", "implication": "그래핀이 빛에 의해 Floquet Chern insulator 상태로 변했음을 입증하는 분광학적 증거를 제시합니다. 이는 고체 물리에서 위상 상태를 정적인 물성 조절이 아닌, 빛-물질 상호작용을 통해 동적으로 설계하고 제어할 수 있음을 확인시켜 줍니다.", "novelty": "구독자의 주요 관심사인 tr-ARPES와 모멘텀 현미경을 결합하여 Floquet 위상 상태를 직접 관측했다는 점이 핵심입니다. 특히 이론적 예측에 머물던 원편광 유도 위상 갭과 베리 곡률의 매핑을 실현한 것은 그래핀 및 2D 물질 연구에서 매우 중요한 진전입니다.", "unresolved": "실험에서 관찰된 밴드 갭의 크기와 수명이 실제 소자 응용이나 양자 홀 효과 측정에서 요구되는 수준에 도달하는지, 그리고 결맞음(coherence)이 유지되는 시간 척도에 대한 추가적인 논의가 필요할 수 있습니다.", "future_work": "다른 2D 물질이나 위상 반금속에 원편광 Floquet 엔지니어링을 적용하여 더 큰 위상 갭을 가진 상태를 탐색하거나, 초고속 위상 스위칭 소자로의 응용 가능성을 타진할 것으로 보입니다.", "concepts": [{"term": "Floquet Chern Insulator", "why_emerged": "주기적인 외부 섭동(빛)을 통해 시스템의 유효 해밀토니안을 수정하여 위상적인 성질을 유도하기 위해 등장했습니다.", "origin": "Oka and Aoki (2009) 등의 이론적 제안에서 시작되었습니다.", "connections": "Haldane model, Quantum Anomalous Hall Effect, Floquet Engineering"}, {"term": "Momentum Microscopy", "why_emerged": "단일 각도 측정의 한계를 넘어 Brillouin 영역 전체의 전자 분산 관계를 한 번에 매핑하기 위해 개발되었습니다.", "origin": "초록 정보만으로는 특정하기 어려우나, 최근 ToF(Time-of-Flight) 검출기와 결합되어 비약적으로 발전했습니다.", "connections": "ARPES, Fermi surface mapping, k-space imaging"}, {"term": "Berry Curvature", "why_emerged": "전자의 파동함수가 운동량 공간에서 가지는 기하학적 위상 효과를 설명하여 위상 물성을 정의하기 위해 필요합니다.", "origin": "Michael Berry (1984)에 의해 일반화되었습니다.", "connections": "Anomalous Hall Effect, Topological Invariant, Chern Number"}, {"term": "Circular Dichroism (CD)", "why_emerged": "물질의 카이랄성이나 스핀/유사스핀 텍스처를 원편광 흡수 차이를 통해 분석하기 위해 사용됩니다.", "origin": "광학 분야에서 오래전부터 사용되었으나, ARPES에서는 밴드의 대칭성 분석을 위해 도입되었습니다.", "connections": "Spin-ARPES, Pseudospin, Orbital Angular Momentum"}], "english_summary": ["Direct spectroscopic observation of a Floquet-engineered topological state in graphene using circular-dichroic tr-ARPES momentum microscopy.", "Identified pump-induced circular dichroism signatures that reverse with helicity, signaling light-induced Berry curvature.", "Demonstrates the realization of a Floquet Chern insulator by breaking time-reversal symmetry with circularly polarized light.", "Links experimental dichroic response to ab initio calculations of pseudospin texture and electronic band reshaping."]}}, {"title": "Graphene lattice recoil in hard x-ray photoemission: Experiment and theory", "journal": "PRB_Recent", "source": "keyword", "link": "http://link.aps.org/doi/10.1103/s8w3-plc1", "authors": "Simone Ritarossi, Alice Apponi, Orlando Castellano, et al.", "last_authors": "Francesco Offi, Alessandro Ruocco", "summary": "Hard-x-ray C 1 s photoemission from monolayer graphene probes a regime in which nuclear recoil and intrinsic electronic asymmetry contribute on comparable energy scales to the observed spectral line shape. Here we combine experiment and modeling over the photon-energy range 0.8 – 8 keV to resolve this interplay quantitatively. A graphene-specific implementation of the Fujikawa-Takata cumulant formalism, based on an anisotropic vibrational density of states constrained by first-principles phonon calculations, captures the expected recoil scaling with photon energy and emission geometry but fails to reproduce the pronounced asymmetric tails of the measured spectra. To overcome this limitation, we introduce an explicit electronic convolution model in which a photon-energy-independent reference response, dominated by the electronic line shape and extracted from the low-recoil 0.8 keV data through a recoil-inclusive fit, is convolved with a phonon recoil kernel carrying the full dependence on photon energy and emission angle. This approach reproduces both the measured line-shape evolution and the observed peak shifts across the explored energy range without refitting the spectra at higher photon energies. The results show that recoil in graphene cannot be described by a baseline treatment in which the phonon recoil kernel is combined only with symmetric lifetime broadening, but must be treated together with the intrinsic many-body electronic response of the C 1 s line.", "tier": "A_MUST_READ", "score": "9", "reason": "title strong match: photoemission", "tags": ["photoemission", "graphene", "monolayer"], "image": "", "briefing": {"background": "고에너지 광자를 사용하는 하드 엑스선 광전자 분광법(HAXPES)에서는 튀어나오는 전자의 운동량이 커짐에 따라 원자핵이 반동(recoil)을 겪게 되며, 이는 스펙트럼의 선형(line shape) 변화와 에너지 이동을 유발합니다. 이는 특히 질량이 가벼운 탄소 기반 물질인 그래핀에서 두드러지게 나타납니다.", "motivation": "그래핀의 C 1s 코어 수준 스펙트럼에서 나타나는 비대칭성은 전자의 다체 효과(intrinsic electronic asymmetry)와 격자 반동 효과가 복합적으로 작용합니다. 기존 모델들은 이 두 효과를 분리하거나 정량적으로 설명하는 데 한계가 있어, 광자 에너지에 따른 스펙트럼 변화를 정확히 예측하지 못했습니다.", "result": "연구진은 0.8~8 keV 범위의 실험 데이터와 Fujikawa-Takata cumulant 이론을 결합하여 새로운 컨볼루션 모델을 제시했습니다. 낮은 에너지(0.8 keV) 데이터에서 비대칭 전자 반응을 추출하고, 이를 광자 에너지와 방출 각도에 의존하는 포논 반동 커널(phonon recoil kernel)과 결합함으로써 전체 에너지 영역에서의 선형 진화를 성공적으로 재현했습니다.", "implication": "그래핀과 같은 저차원 경원소 물질의 HAXPES 데이터를 해석할 때, 단순한 대칭적 가우시안/로렌츠 분포가 아닌 다체 전자 효과와 이방성 포논 반동을 동시에 고려해야 함을 보여줍니다. 이는 고해상도 코어 수준 분광학의 정밀도를 높이는 데 기여합니다.", "novelty": "구독자가 관심을 갖는 그래핀 및 2D 물질 시스템에서, 광전자 분광 데이터의 근본적인 물리적 해석(recoil vs electronic asymmetry)을 정립했다는 점에서 가치가 있습니다. 특히 이론적 계산과 광범위한 에너지 영역의 실험을 일치시킨 점이 돋보입니다.", "unresolved": "이 모델이 그래핀 이외의 다른 2D 반도체나 금속(예: TMDs)에서도 동일한 정확도로 적용될 수 있는지, 그리고 기판과의 상호작용이 반동 효과에 미치는 영향에 대한 추가 검증이 필요합니다.", "future_work": "다양한 2D 이종 구조(heterostructures)에서 계면 효과가 반동 커널에 미치는 영향을 연구하거나, 펨토초 단위의 시분해 HAXPES 실험에서 격자 동역학을 추적하는 데 응용될 수 있습니다.", "concepts": [{"term": "Nuclear Recoil", "why_emerged": "광전자 방출 시 운동량 보존 법칙에 의해 원자핵이 반대 방향으로 밀려나며 에너지 손실이 발생하는 현상을 설명하기 위해 도입되었습니다.", "origin": "원자 및 핵물리학에서 확립된 개념이 고체 광전자 분광학으로 확장되었습니다.", "connections": "HAXPES, Phonon excitation, Doppler broadening"}, {"term": "HAXPES (Hard X-ray PES)", "why_emerged": "표면 민감도가 높은 연엑스선 ARPES와 달리, 물질 깊숙한 곳(bulk)의 전자 구조를 조사하기 위해 고에너지 광원을 사용합니다.", "origin": "3세대 방사광 가속기의 발전과 함께 보편화되었습니다.", "connections": "Bulk sensitivity, Mean free path, Core-level spectroscopy"}, {"term": "Cumulant Formalism", "why_emerged": "광전자 스펙트럼에서 다체 상호작용과 포논 위성(satellite) 구조를 통계적으로 정교하게 기술하기 위해 사용됩니다.", "origin": "Lundqvist (1967) 및 Fujikawa 등에 의해 발전되었습니다.", "connections": "Many-body effects, Electron-phonon coupling, Spectral function"}, {"term": "Electronic Asymmetry", "why_emerged": "금속의 코어 수준 스펙트럼에서 페르미 준위 근처의 전자-정공 쌍 생성으로 인해 발생하는 꼬리(tail) 모양을 설명하기 위해 도입되었습니다.", "origin": "Doniach and Sunjic (1970)에 의해 정립되었습니다.", "connections": "Doniach-Sunjic line shape, Core-hole screening, Fermi edge singularity"}], "english_summary": ["Quantitative resolution of the interplay between nuclear recoil and electronic asymmetry in HAXPES of monolayer graphene.", "Developed an explicit convolution model combining photon-energy-independent electronic response with a phonon recoil kernel.", "Validated the model over a wide photon energy range (0.8–8 keV), capturing both line-shape evolution and peak shifts.", "Highlights the necessity of treating intrinsic many-body effects alongside anisotropic lattice vibrations for accurate PES analysis."]}}, {"title": "Altermagnetism in Folded Iron Chain Systems", "journal": "PRL_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/6327-7256", "authors": "Ling-Fang Lin, Yang Zhang, Satoshi Okamoto, Adriana Moreo, Lun-Hui Hu, Elbio Dagotto", "last_authors": "Lun-Hui Hu, Elbio Dagotto", "summary": "Altermagnetism—moment-compensated magnetism with momentum-dependent spin splitting—has so far been realized primarily in Néel-type antiferromagnets. Here, we demonstrate altermagnetism in folded iron chain systems with block-type magnetic order (e.g.,$↑↑↓↓$). In the strictly one-dimensional (1D) cas…", "tier": "A_MUST_READ", "score": "9", "reason": "Direct study of altermagnetism in quasi-1D iron chain systems, highly relevant to user's interests.", "tags": ["altermagnetism", "quasi-1Dmaterials", "magneticmaterials"], "image": "", "briefing": {"background": "알터마그네티즘(Altermagnetism)은 순 자화값은 0이지만, 운동량 공간에서 스핀 분할(spin splitting)이 일어나는 새로운 자성 상태입니다. 이는 기존의 강자성(순 자화 존재)과 반강자성(스핀 분할 없음)의 특징을 동시에 가진 것처럼 보여 차세대 스핀트로닉스 핵심 개념으로 주목받고 있습니다.", "motivation": "지금까지 알터마그네티즘은 주로 Néel 타입의 반강자성체(인접한 스핀이 반대인 경우)에서 연구되어 왔습니다. 이 연구는 블록 타입(up-up-down-down)의 자기 구조를 가진 시스템이나 낮은 차원의 시스템에서도 알터마그네티즘이 존재할 수 있는지 탐구하고자 했습니다.", "result": "연구진은 '접힌 철 사슬(folded iron chain)' 시스템에서 블록형 자기 질서가 나타날 때 알터마그네티즘이 발생함을 이론적으로 증명했습니다. 특히 1차원 사슬이 2차원 또는 3차원 구조로 배열될 때, 특정 결정학적 대칭성과 자기 구조의 결합이 스핀 분할을 유도함을 확인했습니다.", "implication": "알터마그네티즘의 범위를 Néel 타입 너머로 확장시켰습니다. 이는 준-1차원(quasi-1D) 물질에서도 알터마그네틱 물성을 탐색할 수 있는 이론적 토대를 제공하며, 실험적으로는 철 기반 사슬 물질들에서 새로운 스핀 분할 현상을 찾을 계기를 마련합니다.", "novelty": "구독자의 관심사인 알터마그네티즘과 준-1차원(quasi-1D) 물질(NbSe3 등)의 교집합을 다룹니다. 특히 단순한 반강자성이 아닌 블록 타입 질서에서도 스핀 분할이 가능하다는 점은 자성 연구의 폭을 넓히는 중요한 발견입니다.", "unresolved": "이론적으로 제안된 '접힌 사슬' 구조를 실제 어떤 구체적인 화합물(예: 특정 철 기반 텔루라이드나 산화물)에서 완벽하게 구현하고 실험적으로 스핀 분할을 관측할 수 있는지가 관건입니다.", "future_work": "실제 후보 물질에 대한 ARPES 실험을 통해 운동량 의존적 스핀 분할을 직접 관측하거나, 이 시스템을 이용한 거대 자기 저항(GMR) 효과 등 스핀트로닉스 소자 특성 연구가 이어질 것으로 예상됩니다.", "concepts": [{"term": "Altermagnetism", "why_emerged": "거시적인 자화는 없지만 밴드 구조에서는 스핀 대칭성이 깨져 있는 제3의 자성 상태를 정의하기 위해 등장했습니다.", "origin": "Smejkal, Jungwirth, and Sinova (2022) 등이 체계화했습니다.", "connections": "Antiferromagnetism, Spin-splitting, Spin Hall Effect"}, {"term": "Block-type Magnetic Order", "why_emerged": "단순한 교대 스핀(up-down)이 아닌, 여러 개의 스핀이 묶여서 반복되는(up-up-down-down) 복잡한 자기 구조를 설명하기 위해 필요합니다.", "origin": "철 기반 초전도체 및 관련 자성체 연구에서 주로 논의되었습니다.", "connections": "Iron-based superconductors, Selenides, Frustrated magnetism"}, {"term": "Quasi-1D Systems", "why_emerged": "강한 이방성을 가진 물질에서 나타나는 독특한 물리 현상(Luttinger liquid, Peierls instability 등)을 연구하기 위해 분류되었습니다.", "origin": "TTF-TCNQ와 같은 유기 도체 및 천이 금속 칼코게나이드 연구에서 유래했습니다.", "connections": "Luttinger liquid, Charge Density Wave (CDW), NbSe3"}, {"term": "Spin Splitting", "why_emerged": "전자의 스핀 상/하 상태가 서로 다른 에너지를 갖게 하여 스핀 전류를 제어하기 위한 핵심 기작입니다.", "origin": "Rashba 효과나 Zeeman 효과 등에서 유래했습니다.", "connections": "Rashba effect, Zeeman splitting, Spintronics"}], "english_summary": ["Demonstrated altermagnetism in folded iron chain systems with block-type ($↑↑↓↓$) magnetic order.", "Expands the scope of altermagnetism beyond the traditionally studied Néel-type antiferromagnets.", "Shows that specific lattice folding and magnetic symmetry lead to momentum-dependent spin splitting in quasi-1D architectures.", "Provides a theoretical framework for searching for altermagnetic properties in iron-based chain compounds."]}}, {"title": "Electric field–controlled spin transport in a topological insulator interfaced with a ferroelectric antiferromagnet", "journal": "Science_Advances", "source": "author whitelist", "link": "https://www.science.org/doi/abs/10.1126/sciadv.aeh2170?af=R", "authors": "Yogesh Kumar, Pushpendra Gupta, Xinyan Li, et al.", "last_authors": "Ramamoorthy Ramesh, Sajid Husain", "summary": "Topological insulators have been explored extensively for spin-charge interconversion via magnetic interfaces, yet the true response of their spin-charge conversion, particularly in the absence of an external magnetic field, remains to be studied. Here, we report electric field control of spin-charge conversion in the topological insulator Bi 2 Te 3 with the antiferromagnetic multiferroic BiFeO 3 , using a nonlocal spin transport device. A systematic thickness dependence of the spin transport across the interface between Bi 2 Te 3 and BiFeO 3 reveals a signature of topological surface-state–dominated spin transport in the bilayer system. The spin-charge conversion remains robust for thicknesses above 10 nanometers but falls rapidly with reducing thickness and vanishes at 5 nanometers. This is consistent with hybridization-induced emergence of a trivial insulating phase, which is supported by the coherency factor estimated from the magnetoconductance of Bi 2 Te 3 . These results establish that spin-momentum–locked surface states dominate interfacial spin transport in the decoupled regime. Beyond presenting efficient spin-charge interconversion at an entirely insulating magnetic interface, this work also highlights sputter-deposited Bi 2 Te 3 as a high-quality and scalable platform for integrating quantum materials onto the devices. The nonlocal spin transport approach presented here provides a simple and unprecedented direct evidence of spin-charge conversion and opens an efficient and practical pathway toward designing energy-efficient spin-based devices.", "tier": "A_MUST_READ", "score": "9", "reason": "author whitelist: Robert J. Birgeneau", "tags": ["topologicalinsulator", "topological", "ferromagnet", "antiferromagnet", "transport"], "image": "", "briefing": {"background": "위상 절연체(TI)는 표면 상태의 스핀-운동량 잠김(spin-momentum locking) 특성을 이용해 에너지 효율적인 차세대 스핀트로닉스 소자를 구현하려는 연구가 활발합니다. 특히 자기 물질과의 계면에서 스핀-전하 변환 효율을 극대화하는 것이 핵심 과제입니다.", "motivation": "외부 자기장 없이도 자성체 계면에서 위상 절연체의 스핀-전하 변환이 실제로 어떻게 이루어지는지 규명하고, 이를 전기장으로 제어 가능함을 입증하고자 합니다.", "result": "Bi2Te3/BiFeO3 이중층 구조에서 비국소 스핀 수송 측정을 통해 전기장으로 스핀-전하 변환을 제어하는 데 성공했습니다. 10nm 이상의 두께에서는 위상 표면 상태가 지배적인 스핀 수송을 보이지만, 5nm 이하에서는 잡음/절연 상으로 전이되어 효율이 급감함을 확인했습니다.", "implication": "위상 절연체와 다강체(multiferroic)의 계면을 활용하여 외부 자기장 없이 전기장만으로 제어 가능한 저전력 스핀트로닉스 소자 설계의 실현 가능성을 제시합니다.", "novelty": "Sputter 증착 기술을 사용한 고품질 Bi2Te3를 통해 스케일링 가능한 양자 소자 플랫폼을 구축했으며, 위상 표면 상태의 스핀-운동량 잠김이 지배하는 수송 현상을 직접적으로 증명했습니다.", "unresolved": "BiFeO3와의 계면 상태 및 이중층 내에서의 미세한 혼성 결 Vs."]}}, {"title": "Time-reversal-symmetry-breaking spin injection from a compensated magnet", "journal": "Nature", "source": "Gemini", "link": "https://www.nature.com/articles/s41586-026-11227-7", "authors": "Jone Mencos, Antonin Badura, Eoin Dolan, et al.", "last_authors": "Helena Reichlova, Fèlix Casanova", "summary": "Experiments show that altermagnetic Mn5Si3 generates spin currents despite zero net magnetization, demonstrating a central prediction of altermagnetic spintronics.", "tier": "B_IMPORTANT_CONDMAT", "score": "10", "reason": "Direct experimental evidence for altermagnetism, TRSB, and spin currents in Mn5Si3.; demoted from A: broad CM, not direct user/project hit", "tags": ["topic", "altermagnetism", "TRSB", "spintronics", "material", "Mn5Si3"], "image": "https://media.springernature.com/m685/springer-static/image/art%3A10.1038%2Fs41586-026-11227-7/MediaObjects/41586_2026_11227_Fig1_HTML.png", "briefing": {"background": "반강자성체는 자화가 상쇄되어 외부 자기장 영향이 적지만, 최근 altermagnetism(교대 자성) 개념의 등장으로 순 자화 없이도 스핀 분극 현상을 유도할 수 있는 새로운 spintronics 재료로 주목받고 있습니다.", "motivation": "자성 보상 물질인 Mn5Si3에서 순 자화가 없음에도 불구하고 스핀 전류가 생성되는지 실험적으로 검증하여 altermagnetism 이론을 뒷받침하고자 합니다.", "result": "Mn5Si3에서 시간 역전 대칭성 깨짐(TRSB)이 동반된 스핀 주입 현상을 직접 관찰함으로써, Altermagnet이 스핀트로닉스 소자에서 기존의 강자성체를 대체할 수 있음을 입증했습니다.", "implication": "전통적인 강자성체 기반의 스핀 주입 효율 문제를 해결할 수 있는 대안으로 Altermagnet 재료의 활용 가능성이 크게 열렸습니다.", "novelty": "순 자화가 0인 물질에서 스핀 전류를 성공적으로 추출하여 altermagnetism의 실효성을 직접적으로 증명했다는 점이 핵심입니다.", "unresolved": "Mn5Si3의 구체적인 전자 구조 및 에너지 밴드에서의 스핀 분리 기작과 이 물질의 위상적 성질과의 상관관계는 추가 연구가 필요합니다.", "future_work": "다른 Altermagnet 물질들에 대한 체계적인 스핀 수송 실험 및 ARPES를 통한 전자 구조 직접 관측이 이어질 것으로 보입니다.", "concepts": [{"term": "Altermagnetism", "why_emerged": "강자성체와 반강자성체의 특성을 모두 갖춘 새로운 자기 질서 상태를 분류하기 위해 도입되었습니다.", "origin": "최근 5년 이내 이론적 정립", "connections": "반강자성 스핀트로닉스, 시간 역전 대칭성 깨짐, 결정 대칭성"}], "english_summary": ["Demonstrates spin current generation from compensated magnet Mn5Si3.", "Provides experimental evidence of altermagnetism and TRSB.", "Validates theoretical predictions for spin-polarized transport in non-collinear magnets.", "Suggests altermagnets as efficient alternatives for future spintronic devices."]}}, {"title": "Subcycle videography of Landau–Zener–Majorana transitions in graphene", "journal": "Nature", "source": "Gemini", "link": "https://www.nature.com/articles/s41586-026-11214-y", "authors": "V. Eggers, G. Inzani, M. Meierhofer, et al.", "last_authors": "R. Huber, U. Höfer", "summary": "An experimental concept enabling attosecond-precision, subcycle band-structure videography covering the entire first Brillouin zone is demonstrated and used to visualize the lightwave-driven electron motion of Landau–Zener–Majorana transitions in graphene.", "tier": "B_IMPORTANT_CONDMAT", "score": "9", "reason": "Ultrafast band-structure dynamics and Majorana-like transitions in graphene, highly relevant to electronic structure.", "tags": ["method", "graphene", "Majorana", "ultrafast", "electronicstructure", "Floquet"], "image": "https://media.springernature.com/m685/springer-static/image/art%3A10.1038%2Fs41586-026-11214-y/MediaObjects/41586_2026_11214_Fig1_HTML.png", "briefing": {"background": "고체 내 전자 상태가 초고속 레이저 펄스 하에서 어떻게 변하는지 관찰하는 것은 강상관 전자계나 위상 물질 연구에서 핵심적이지만, 시간 분해능 문제로 인해 전체 Brillouin zone을 한 번에 관측하기는 매우 어려웠습니다.", "motivation": "아토초 정밀도의 기술을 활용하여 그래핀 내 Landau-Zener-Majorana 전이 과정을 실시간으로 영상화하여 강한 장 하에서의 전자 동역학을 이해하고자 합니다.", "result": "광파 구동 전자 운동을 브릴루앙 영역 전역에서 시각화하는 데 성공했으며, 특히 위상적 전이와 관련된 전자 상태 변화를 subcycle 수준에서 포착했습니다.", "implication": "초고속 분광학의 새로운 표준을 제시하며, 향후 다양한 위상 물질 및 강상관 물질에서의 Floquet 상태 제어 및 실시간 동역학 연구에 큰 진전을 가져올 것입니다.", "novelty": "단순히 전자 구조를 찍는 수준을 넘어 전체 Brillouin zone에서의 'videography(동영상 촬영)'를 구현했다는 점이 독보적입니다.", "unresolved": "실험 조건의 극한성이 매우 높아 일반적인 실험실 환경에서 다른 복잡한 재료에 적용하기에는 기술적 장벽이 높습니다.", "future_work": "해당 기법을 다양한 위상 절연체나 복잡한 밴드 구조를 가진 전이금속 디칼코게나이드(TMD)에 적용하여 광 유도 위상 전이 연구가 예상됩니다.", "concepts": [{"term": "Landau-Zener-Majorana 전이", "why_emerged": "시간 의존적 해밀토니안 자 함.", "result": "4단위 셀 두께의 BiFeO3 초박막에서 강유전성과 알터마그네틱 성질이 공존함을 다양한 실험적 측정을 통해 입증함.", "implication": "알터마그네틱 물질이 멀티페로익 시스템에서도 구현 가능함을 보여주며, 위상학적 스핀 텍스처와 비상대론적 스핀 분할을 결합한 차세대 스핀트로닉스 소자 개발의 가능성을 제시함.", "novelty": "기존 알터마그네틱 후보군이 주로 단순 결정 구조에 집중되었던 것과 달리, 멀티페로익 초박막이라는 복합 시스템에서 이를 관측했다는 점이 중요함.", "unresolved": "초박막 내의 결함이 알터마그네틱 질서에 미치는 구체적인 영향이나, 온도 변화에 따른 위상학적 텍스처의 동역학적 거동은 추가 연구가 필요함.", "future_work": "저온 및 고온 환경에서의 스핀 전달 토크(spin-transfer torque) 효율 측정 및 위상학적 텍스처의 전기적 제어 실험.", "concepts": [{"term": "알터마그네틱(Altermagnetism)", "why_emerged": "강자성이나 반강자성으로 분류되지 않으면서도 스핀 분할이 일어나는 물질의 물성을 설명하기 위해 제안됨.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "반강자성체, 비상대론적 스핀 분할, 스핀트로닉스"}, {"term": "멀티페로익(Multiferroics)", "why_emerged": "강유전성과 자기적 질서가 공존하여 스핀과 전하의 상호 제어를 가능하게 하기 위해 연구됨.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "스핀-궤도 결합, 강유전성, 위상학적 스핀 텍스처"}], "english_summary": ["Stabilization of monoclinic phase in ultrathin 4-unit-cell BiFeO3 films.", "Experimental evidence for the coexistence of ferroelectricity and d-wave altermagnetism.", "Demonstrates potential for controlling topological textures via altermagnetic signatures.", "Provides a foundation for multi-functional spintronic devices in thin-film architectures."]}}, {"title": "Cooperative concurrence of 4f and 3d flat bands in the kagome heavy-fermion metal YbCr6Ge6", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/zdzj-bln9", "authors": "Wenxin Lv (吕文欣), Pengcheng Ma (马鹏程), Tianqi Wang (王天琦), et al.", "last_authors": "Zhonghao Liu (刘中灏), Hechang Lei (雷和畅)", "summary": "Flat-band (FB) systems originating from special lattice geometry like in kagome metals as well as localized orbitals in materials such as heavy-fermion (HF) compounds have attracted intensive interest due to their band topology and strong electron correlation effects, leading to emergent quantum sta…", "tier": "B_IMPORTANT_CONDMAT", "score": "9", "reason": "Direct interest in kagome metals and correlated elect rrelated physics.", "Confirms the presence of localized magnetic moments and their interaction with itinerant electrons in these structures.", "Provides a foundation for further exploration of quantum phase transitions in moiré superlattices."]}}, {"title": "Altermagnetism revealed by polarized neutrons in MnF2", "journal": "Science", "source": "Gemini", "link": "https://www.science.org/doi/abs/10.1126/science.aec2602?af=R", "authors": "Quentin Faure, Dalila Bounoua, Victor Balédent, et al.", "last_authors": "Sylvain Petit, Paul McClarty", "summary": "Altermagnets are compensated magnets with symmetry-enforced spin split bands. Direct spectroscopic evidence for their existence has been reported in several materials. For example, inelastic neutron scattering (INS) has recently been used to witness a splitting of magnon bands in MnTe that is compatible with altermagnetism. Here, we present polarized INS results on MnF 2 showing that it is altermagnetic. Our data reveal a splitting coming from the long-range dipolar coupling. Furthermore, using a domain-biased sample, the data reveal a nonzero chirality in the neutron scattering cross section that reverses the sign between the two magnon modes. It is this feature that clearly demonstrates altermagnetism in MnF 2 . This finding highlights the potential for polarized INS to characterize altermagnets through its sensitivity to fine structure in magnon spectra.", "tier": "B_IMPORTANT_CONDMAT", "score": "9", "reason": "Experimental study of altermagnetism, highly relevant to user interest in magnetic materials.", "tags": ["altermagnetism", "neutron-scattering", "magnetic-materials"], "image": "", "briefing": {"background": "알터자성(Altermagnetism)은 시간 역전 대칭성이 깨져 있으면서도 순자화가 상쇄된 새로운 자기 상으로, 밴드 분할이 대칭성에 의해 강제되는 물질입니다.", "motivation": "MnF2에서 편극 중성자 산란을 활용하여 알터자성 특성인 스핀 분할 밴드와 비대칭성을 실험적으로 검증하고자 했습니다.", "result": "편극 중성자 산란(INS)을 통해 MnF2의 자성 스펙트럼에서 장거리 쌍극자 결합에 의한 밴드 분할과 비영점 키랄성을 확인하여 알터자성을 입증했습니다.", "implication": "알터자성이 MnF2와 같은 물  the way for new spintronic and quantum technology applications."]}}, {"title": "Direct real-space imaging of sign-reversal superconducting state by scanning Josephson tunneling", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2610.38421", "authors": "Tianheng Wei, Yanzhao Liu, Wei Ren, Zhen Liang, Ziqiang Wang, Jian Wang", "last_authors": "Ziqiang Wang, Jian Wang", "summary": "Phase-sensitive experiments based on Josephson tunneling have been considered as a pivotal method to determine the pairing symmetry in high-temperature (high-Tc) cuprate superconductors. However, in iron-based superconductors, traditional phase-sensitive experiments face setbacks because of the complexity of pairing symmetry in multiband systems. Here, using scanning Josephson tunneling microscopy (SJTM), we report the half-unit-cell periodic Josephson tunneling modulations in monolayer high-Tc Fe(Te,Se) film epitaxially grown on SrTiO3(001). The Josephson tunneling almost vanishes along the lines connecting next-nearest-neighbor Fe atoms under an s-wave superconducting tip. Combined with single-particle tunneling spectra showing the full superconducting gap, our experimental results are consistent with the sign-reversal nodeless d-wave pairing symmetry. Our findings provide sub-unit-cell scale superconducting phase information for understanding the mechanism of high-Tc superconductivity. We anticipate our work as a starting point for atomically resolved Josephson interference experiments using SJTM in various unconventional superconductors.", "tier": "B_IMPORTANT_CONDMAT", "score": "9", "reason": "Direct visualization of pairing symmetry in iron-based superconductors using SJTM, high relevance to spectroscopy.", "tags": ["superconduct", "STS", "spectroscopy"], "image": "https://arxiv.org/static/browse/0.3.4/images/arxiv-logo-fb.png", "briefing": {"background": "철 기반 초전도체(FeSCs)는 다중 궤도 특성과 복잡한 다중 밴드 구조로 인해 초전도 대칭성을 결정하기가 매우 어렵습니다. 기존의 위상 민감 실험들은 철 기반 시스템의 미시적 구조 내에서 해석에 한계가 있었습니다.", "motivation": "Fe(Te,Se) 박막에서 나노 스케일의 조셉슨 터널링 측정을 통해 초전도 페어링 대칭성을 실공간에서 직접 규명하고자 했습니다.", "result": "SJTM을 사용하여 Fe(Te,Se)에서 반단위 셀 주기성을 가지는 터널링 변조를 관측했으며, 이는 부호 반전(sign-reversal) d-파 대칭성과 일치합니다.", "implication": "다중 밴드 시스템에서 페어링 대칭성 논란을 해소할 수 있는 강력한 실공간 도구를 제시하며, 고온 초전도 메커니즘 연구에 중요한 전환점을 마련했습니다.", "novelty": "SJTM을 활용한 원자 스케일의 위상 정보 확보는 귀하가 주목하는 전자 구조 및 STM 연구 분야에서 매우 유망한 방법론적 진보입니다.", "unresolved": "본 연구 결과가 다른 철 기반 초전도체군에서도 동일하게 일반화될 수 있는지, 특히 s± 와 d-파의 구분 문제에 대한 보편적인 결론은 추가적인 데이터가 필요합니다.", "future_work": "다양한 부가적인 전하 밀도 파(CDW)나 네마틱 상태가 존재하는 물질계로의 SJTM 응용 확장 연구가 진행될 것입니다.", "concepts": [{"term": "SJTM", "why_emerged": "초전도체의 위상 정보(페어링 부호)를 실공간에서 원자 수준으로 매핑하기 위해 필요했습니다.", "origin": "주로 고온 초전도체의 대칭성 논쟁 해결을 위해 고도화된 기술입니다.", "connections": "STM/STS, 조셉슨 효과, 위상 감응 터널링."}, {"term": "부호 반전 d-파 대칭성", "why_emerged": "페르미 면 사이의 산란 과정에서 나타나는 페어링 상호작용의 부호 변화를 설명하기 위해 제안되었습니다.", "origin": "초기 고온 초전도체 이론에서 제안되어 FeSC 모델로 확장되었습니다.", "connections": "스핀 요동 매개 페어링, s± 대칭성."}], "english_summary": ["SJTM used to map the superconducting phase of Fe(Te,Se) on SrTiO3.", "Observes half-unit-cell periodic Josephson tunneling modulations.", "Results consistent with sign-reversal nodeless d-wave symmetry.", "Provides atomically resolved superconducting phase information.", "Establishes SJTM as a viable tool for studying unconventional superconductors."]}}, {"title": "Evidence for an effective gauge field in flakes of superconducting 4Hb-TaS2", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2610.39979", "authors": "Shalev Gur, T. R. Devidas, Eylon Persky, et al.", "last_authors": "Amit Kanigel, Beena Kalisky", "summary": "Understanding the normal state of unconventional superconductors is central to uncovering the origin of superconductivity itself. Unconventional superconductivity often emerges from correlated electronic states characterized by intertwined symmetry-breaking orders. A striking example is 4Hb-TaS2, whose superconducting state exhibits a remarkable range of phenomena, including an unusual magnetic memory effect. Previous experiments showed that magnetic memory can be encoded above Tc and later revealed through spontaneous vortices below Tc, suggesting time-reversal symmetry breaking. However, since memory and vorticity are intertwined, this prevents establishing whether the effect results from trapped flux, weak conventional magnetism, or a true hidden electronic order. Here, we show that magnetic memory persists in the vortex-free Meissner regime of exfoliated 4Hb-TaS2 flakes, where it appears as a stable remanent modification of the superconducting screening response. Our results rule out explanations based on trapped vortices. Furthermore, the spatial profile of the flux generated by trained samples at zero field is inconsistent with conventional weak magnetism, suggesting a hidden electronic phase that imprints an effective flux on the superconducting condensate.", "tier": "B_IMPORTANT_CONDMAT", "score": "9", "reason": "Investigates hidden electronic order and TRSB in 4Hb-TaS2; directly relevant to user's TRSB interests.", "tags": ["experiment", "4Hb-TaS2", "TRSB"], "image": "https://arxiv.org/static/browse/0.3.4/images/arxiv-logo-fb.png", "briefing": {"background": "4Hb-TaS2는 전하 밀도 파(CDW)와 초전도성이 공존하는 흥미로운 물질입니다. 특히 초전도 상태에서의 시간 반전 대칭성 깨짐(TRSB)과 자기 메모리 효과는 물질의 근본적인 상태에 대한 질문을 던집니다.", "motivation": "기존 실험에서 나타난 자기 메모리 효과가 단순히 트랩된 자속에 의한 것인지, 아니면 물질 고유의 숨겨진 전자 질서에서 기인하는 것인지 판별하고자 했습니다.", "result": "보텍스가 없는 마이스너 영역에서도 자기 메모리가 잔류함을 확인하여 기존의 트랩 자속 기반 설명을 배제하고, 숨겨진 전자 질서가 효과적인 게이지 장을 생성함을 시사했습니다.", "implication": "4Hb-TaS2의 TRSB 현상이 외적 요인이 아닌 내재적 위상에서 기인할 가능성이 높아졌으며, 초전도 질서와 다른 질서 파라미터 간의 얽힘에 대한 이해를 재정립합니다.", "novelty": "마이스너 영역에서의 정밀 측정을 통해 기존의 혼란스러운 해석을 제거하고, 효과적 게이지 장이라는 새로운 관점을 도입했다는 점이 중요합니다.", "unresolved": "해당 '숨겨진 전자 질서'의 구체적인 미시적 정체가 무엇인지(예: 루프 전류 여부 등)에 대해서는 추가적인 증거가 필요합니다.", "future_work": "강한 자기장 하에서의 전자 구조 변화를 보는 magneto-ARPES나, 초미세 자기장을 탐지할 수 있는 뮤온 스핀 회전 실험 등이 뒤따를 것으로 예상됩니다. english_summary": ["Demonstrated long-lived (nanosecond scale) Floquet-like band renormalization in WSe2/MoS2.", "Used dense populations of incoherent dark interlayer excitons to hybridize conduction and valence bands.", "tr-ARPES observations reveal transition to Mexican-hat dispersion.", "Provides a robust alternative to coherent optical driving for band engineering."]}}, {"title": "Selective effects of selenium substitution on superconductivity and magnetic memory in 4Hb-TaS2", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2610.39969", "authors": "Shalev Gur, Sajilesh K. P., Shubam Purwar, et al.", "last_authors": "Amit Kanigel, Beena Kalisky", "summary": "Disorder plays a central role in correlated quantum materials, but its effects can be highly selective when several electronic orders coexist. The van der Waals heterostructure 4Hb-TaS2 provides such a case, combining superconductivity, charge-order tendencies, strong scattering, and magnetic memory manifested through spontaneous vortices. Here we use Se substitution as a controlled local perturbation of the disorder landscape in 4Hb-TaS2. We find that superconductivity remains remarkably robust while the magnetic memory is strongly suppressed at higher Se concentrations. These results show that Se substitution does not create the hidden magnetic memory, but instead selectively weakens its macroscopic manifestation. More broadly, they reveal a sharp separation between robust superconducting and hidden-memory phases, and a highly disorder-sensitive spontaneous-vortex response in 4Hb-TaS2.", "tier": "B_IMPORTANT_CONDMAT", "score": "9", "reason": "Highly relevant study of time-reversal symmetry breaking and superconductivity in 4Hb-TaS2 vdW heterostructures.", "tags": ["experiment", "4Hb-TaS2", "superconductivity"], "image": "https://arxiv.org/static/browse/0.3.4/images/arxiv-logo-fb.png", "briefing": {"background": "4Hb-TaS2는 초전도성과 전하 밀도 파(CDW), 그리고 시간 반전 대칭 파괴(TRSB)가 공존하는 흥미로운 반데 electronically ordered phases, and the need for high pressures to reach the superconducting phase. To disentangle these complex inter-dependencies, here we study a series of clean single crystals of trilayer La$_4$Ni$_3$O$_{10}$. We discover that enhanced biaxial, compressive pressures induce a zero-resistance state at a 60\\% lower pressure compared to previous reports. At the same time, we completely separate the low-pressure density wave phase from superconductivity, effectively ruling out that soft, quantum critical fluctuations of the density wave order parameter act as the pairing glue in this system. Our results establish biaxial, in-plane pressures as a powerful tool for promoting superconductivity in nickelates, unifying the required pressure scales for superconductivity in different Ruddlesden-Popper structures, and providing a connection to the recently discovered thin film samples.", "tier": "B_IMPORTANT_CONDMAT", "score": "9", "reason": "Direct experimental study of nickelate superconductivity and density waves.", "tags": ["nickelate", "superconduct", "experimental"], "image": "https://arxiv.org/html/2610.38959v1/2026-09-29__Ambient.png", "briefing": {"background": "La4Ni3O10과 같은 Ruddlesden-Popper 니켈레이트는 압력 하에서 초전도성을 보이나, 이 과정에서 발생하는 밀도파(Density Wave)와 초전도성 사이의 상관관계가 이 분야의 핵심 난제 중 하나입니다.", "motivation": "기존에는 압력에 따른 구조 변화와 밀도파가 초전도성에 미치는 영향을 명확히 분리하기 어려웠으며, 이를 통해 밀도파가 초전도성 형성에 필수적인 역할을 하는지(pairing glue 여부) 확인하고자 함.", "result": "단결정 La4Ni3O10에 이축 압력(biaxial pressure)을 가하여 훨씬 낮은 압력에서 초전도 상태를 구현했으며, 밀도파 상태가 초전도성과 분리됨을 확인하여 밀도파가 초전도성의 원인이 아님을 입증함.", "implication": "니켈레이트 초전도 메커니즘에서 밀도파의 역할을 배제하고, 이축 압력 제어가 초전도성 연구의 강력한 실험적 도구가 될 수 있음을 시사함.", "novelty": "이축 압력을 사용하여 저압에서 초전도성을 재현하고 밀도파와 초전도성을 분리한 실험적 설계가 돋보이며, 박막과 벌크 니켈레이트 사이의 물성 연결고리를 제공함.", "unresolved": "초전도 전이 온도와 압력 사이의 구체적인 스케일링 관계 및 박막 샘플과 벌크 단결정 간의 근본적인 차이에 대한 상세 메커니즘.", "future_work": "다른 Ruddlesden-Popper 니켈레이트에서의 이축 압력 효과 확인 및 초전도 상태의 전자 구조에 대한 분광학적 연구(ARPES 등).", "concepts": [{"term": "Ruddlesden-Popper 니켈레이트", "why_emerged": "구리 산화물 초전도체와 구조적으로 유사한 층상 구조를 가진 물질군으로서 고온 초전도성을 찾기 위한 주요 후보군.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "La2NiO4, La3Ni2O7, La4Ni3O10 등의 시리즈가 있으며 구리 산화물(cuprates) 물성과의 비교 연구가 활발함."}, {"term": "밀도파 (Density Wave)", "why_emerged": "페르미 표면의 네스팅(nesting) 효과로 인해 전자 밀도가 주기적으로 변조되는 상전이 현상.", "origin": "Peierls(1955)에 의해 이론적 기틀 마련.", "connections": "CDW, SDW와 연결되며 전이 금속 칼코게나이드 및 니켈레이트 시스템에서 빈번하게 관측됨."}], "english_summary": ["La4Ni3O10 single crystals studied under biaxial compressive pressure.", "Achieved zero-resistance superconductivity at significantly lower pressure.", "Density wave phase is decoupled from superconductivity.", "Rules out quantum critical density wave fluctuations as pairing glue.", "Establishes biaxial pressure as a key control parameter for nickelate superconductivity."]}}, {"title": "Single-stripe magnetic order and bilayer spin dynamics in single-crystalline La3Ni2O7 (Nat. Mater.)", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2605.03448", "authors": "Lixing Chen, Enkang Zhang, Yiqing Hao, et al.", "last_authors": "Qisi Wang, Jun Zhao", "summary": "High-temperature superconductivity in pressurized and thin-film nickelates has generated intense interest, yet magnetism in their ambient-pressure parent phases remains poorly understood, despite its potentially crucial role in pairing. Progress has been limited by the lack of large single crystals suitable for neutron spectroscopy. Here we overcome this limitation and map the spin order and excitations of single-crystalline La3Ni2O7. We find single-stripe magnetic order with a finite spin gap, anisotropic in-plane excitations and pronounced bilayer modulation revealing antiferromagnetic interlayer coupling. The dispersion is captured by a bilayer Heisenberg-type model with strong interlayer exchange and competing in-plane couplings. Absolute normalization reveals that, although the spin-wave bandwidth is only about 25% of that in cuprates, the local dynamic susceptibility at comparable energies is enhanced, yielding a comparable total fluctuating moment. These results highlight intense mid-energy spin excitations rooted in substantial electronic correlations, establishing a magnetic framework distinct from cuprates and relevant to superconductivity in nickelates.", "tier": "B_IMPORTANT_CONDMAT", "score": "9", "reason": "Neutron spectroscopy of magnetic order in single-crystalline nickelates, directly relevant to unconventional superconductivity interests.; demoted from A: broad CM, not direct user/project hit", "tags": ["method", "material", "superconductivity"], "image": "https://arxiv.org/static/browse/0.3.4/images/arxiv-logo-fb.png", "briefing": {"background": "La3Ni2O7의 고온 초전도성이 발견된 이후, 초전도 상태의 근원이 되는 상압 부모상(parent phase)의 자기적 성질을 이해하는 것이 니켈레이트 초전도 연구의 최우선 과제가 되었습니다.", "motivation": "기존에는 단결정 샘플의 부족으로 중성자 산란을 통한 자기적 상태 파악이 제한적이었으나, 이를 극복하고 자기 구조와 스핀 역학을 직접 관측하고자 함.", "result": "단결정 La3Ni2O7에서 단일 스트라이프 자기 정렬과 층간 반강자성 결합을 발견했으며, 스핀파 분산이 이중층 하이젠베르크 모델로 설명됨을 확인함.", "implication": "니켈레이트의 자기적 물성이 구리 산화물과는 다른 독특한 프레임워크를 가짐을 시사하며, 초전도성 메커니즘 규명의 기초를 제공함.", "novelty": "부족했던 단결정 샘플을 구현하여 중성자 분광학 데이터를 확보함으로써, 구리 산화물과 유사한 강한 상관관계에도 불구하고 차별화된 자기적 특성을 수치적으로 입증함.", "unresolved": "이러한 자기적 스핀 역학이 가압 하의 초전도 상태로 어떻게 전이되는지에 대한 직접적인 상관관계.", "future_work": "고압 하에서의 중성자 산란 실험 및 초전도 전이 과정에서의 자기적 스핀 요동 변화 관측.", "concepts": [{"term": "단일 스트라이프 자기 정렬", "why_emerged": "강한 전자 상관관계에 의해 스핀이 일정한 방향성을 가지고 줄무늬 형태로 배열되는 자기 구조.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "구리 산화물의 스트라이프 상과 연관되어 논의되나 여기서는 니켈레이트만의 고유한 특성으로 보고됨."}, {"term": "동적 자화율 (Dynamic Susceptibility)", "why_emerged": "물질 내의 스핀 시스템이 외부 자극에 대해 시간적으로 어떻게 반응하는지를 기술하는 물리량.", "origin": "통계역학 및 응집물질물리학의 표준 이론에 기초.", "connections": "중성자 산란 실험의 핵심 분석 데이터로, 스핀 파동의 강도와 에너지 분포를 측정하는 데 사용."}], "english_summary": ["First neutron spectroscopy study on single-crystalline La3Ni2O7.", "Reveals single-stripe magnetic order with anisotropic in-plane excitations.", "Bilayer Heisenberg model describes the observed spin dispersion.", "Magnetic framework identified as distinct from cuprates despite high correlations.", "Provides foundational magnetic data for understanding nickelate superconductivity."]}}, {"title": "Theory of High-Temperature Fractional Chern Phases in Monolayer van der Waals Kagome Materials A2T3X4", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2610.24633", "authors": "Soomin Oh, Jiyong Han, Jinhyeok Choi, Donghae Seo, Mingu Kang, Gil Young Cho", "last_authors": "Mingu Kang, Gil Young Cho", "summary": "Fractional Chern insulators bring the fractional quantum Hall effect, with its anyonic excitations, to zero magnetic field. So far they have been realized in moir\\'e materials, where the long superlattice period weakens electronic interactions and confines these phases to cryogenic temperatures. Early proposals instead envisioned topological flat bands on atomic-scale lattices, where fractionalization could persist to far higher temperatures, but a suitable material has been lacking. Here we theoretically identify monolayers of the van der Waals kagome family $\\mathrm{A}_2\\mathrm{T}_3\\mathrm{X}_4$ as such a platform, combining intrinsic topological flat bands and strong Coulomb interactions with gate-tunable carrier density and layer assembly. Exact diagonalization of models derived from density functional theory reveals ferromagnetism over broad filling ranges, supporting diverse fractional Chern insulators, anomalous composite Fermi liquids, and charge-ordered phases. In particular, in $\\mathrm{Cs}_2\\mathrm{Pd}_3\\mathrm{S}_4$, the fractional Chern insulator exhibits a many-body gap of approximately 26 meV in the largest system accessible with band mixing allowing at most one interband electron-hole excitation. Layer assembly further provides a natural route to fractional quantum spin Hall insulators: bilayers with antiparallel magnetizations support this phase at realistic s _IMPORTANT_CONDMAT", "score": "8", "reason": "Study of high-Tc nickelates, highly relevant to correlated electron systems interest.", "tags": ["nickelate", "superconductivity"], "image": "", "briefing": {"background": "La3Ni2O7은 가압 하에서 고온 초전도성을 보이는 니켈 화합물로, 구리 기반 고온 초전도체와 유사한 강상관 전자계 물성을 탐구하는 중요한 플랫폼입니다.", "motivation": "이 물질의 초전도 메커니즘에서 니켈의 3dz2 오비탈이 차지하는 전자 점유율과 상관관계가 초전도 쌍 형성에 미치는 역할을 규명하고자 합니다.", "result": "이 연구에서는 이층(bilayer) 2궤도 모델을 사용하여 3dz2 오비탈의 전자 점유율 변화에 따른 쌍 상관관계(pairing correlation)의 진화를 확인했습니다.", "implication": "니켈의 궤도 물리와 전자 점유율 제어가 초전도성을 조절하는 핵심 인자임을 시사하며, 물질 설계의 가이드라인을 제공합니다.", "novelty": "이층 니켈 산화물 모델에서 d-z2 오비탈의 역할을 수치적 방법으로 체계적으로 분석하여 초전도성 발현 기전을 구체화했습니다.", "unresolved": "실제 고압 실험에서 3dz2 오비탈의 정확한 점유율 측정과 모델 내의 상관관계 강도에 따른 정량적 차이.", "future_work": "실제 고압 하의 ARPES 데이터를 통한 전자 구조 변화 검증 및 다양한 도핑 수준에서의 임계 온도 예측.", "concepts": [{"term": "Bilayer two-orbital model", "why_emerged": "La3Ni2O7의 두 층으로 이루어진 구조와 Ni의 3dx2-y2, 3dz2 오비탈의 상호작용을 단순화하여 물리적 본질을 파악하기 위해 필요.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "Cuprate의 1궤도 모델과 비교되며, 다궤도 허바드 모델의 일종임."}], "english_summary": ["Investigates the role of Ni 3dz2 orbitals in the high-Tc superconductor La3Ni2O7.", "Uses a bilayer two-orbital model to analyze pairing correlations.", "Demonstrates how orbital filling influences the superconducting state.", "Provides insights into the unconventional pairing mechanism of pressurized nickelates."]}}, {"title": "Field-induced metal-insulator transition, Chern insulators, and topological semimetals in the clean magnetic semiconductor GdGaI", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/l4wt-87js", "authors": "R. K. Guzman Ilave, Hiroaki Ishizuka", "last_authors": "R. K. Guzman Ilave, Hiroaki Ishizuka", "summary": "Noncoplanar magnetic order in low-carrier-density semiconductors provides a platform on which spin-charge coupling can reshape the electronic structure and induce nontrivial topological phases. Motivated by the recent discovery of the four-sublattice triple-$q$ order in the magnetic semiconductor Gd…", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Topological magnetic material study with high relevance to Weyl/Dirac semimetal interest.", "tags": ["topologicalsemimetal", "Cherninsulator", "magneticmaterial"], "image": "", "briefing": {"background": "저밀도 전하를 가진 자기 반도체는 스핀-전하 결합을 통해 특이한 위상학적 상태를 구현할 수 있는 물리학의 중심 분야입니다.", "motivation": "최근 발견된 GdGaI의 자기 구조(triple-q order)를 바탕으로, 외부 자기장이 전자 구조의 위상학적 상태를 어떻게 변형시키는지 분석하고자 합니다.", "result": "자기장 유도 금속-절연체 전이와 함께 체른 절연체(Chern insulator) 및 위상학적 반금속 상이 나타날 수 있음을 이론적으로 제시했습니다.", "implication": "자기 위상 물질에서 외부 필드 제어를 통해 양자 위상 제어가 가능함을 시사합니다.", "novelty": "GdGaI와 같은 깨끗한 자기 반도체 시스템에서 트리플-q 자기 구조가 유도하는 위상학적 위상 도표를 체계적으로 정리했습니다.", "unresolved": "실제 시료의 불순물 효과가 이러한 위상적 상태의 안정성에 미치는 영향.", "future_work": "ARPES나 수송 현상 실험을 통해 예측된 위상학적 반금속 상태를 검증하는 연구.", "concepts": [{"term": "Chern insulator", "why_emerged": "외부 자기장 없이도 양자화된 홀 전도도를 나타내는 상태를 구현하기 위해 필요.", "origin": "Haldane (1988)", "connections": "양자 홀 효과, 위상학적 절연체, 베리 곡률과 밀접함."}, {"term": "Triple-q order", "why_emerged": "복잡한 비공면(noncoplanar) 자기 구조를 기술하기 위해 필요.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "스핀-궤도 결합을 통한 위상적 전자 구조 변화의 근간이 됨."}], "english_summary": ["Examines topological phases in the magnetic semiconductor GdGaI.", "Predicts field-induced transitions between metal, insulator, and semimetal states.", "Highlights the role of triple-q magnetic order in hosting Chern insulator phases.", "Suggests external control of topological properties in magnetic semiconductors."]}}, {"title": "Magnetic symmetry implications of the zero- and applied-field Hall effect of UNi4B", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/89wz-m23z", "authors": "Z. W. Riedel, W. S. Simeth, S. M. Thomas, F. Ronning, E. D. Bauer", "last_authors": "F. Ronning, E. D. Bauer", "summary": "The authors report here two finite zero-field Hall resistivity tensor components associated with the debated magnetic ground state of the noncollinear antiferromagnet UNi 4 B. For a commensurate magnetic structure, the finite Hall resistivity components cannot be explained by the formation of magnetic domains but are compatible with a monoclinic magnetic symmetry lower than that of previously proposed magnetic ordering models. Additional field-dependent Hall resistivity data collected up to 16 T suggest a notable intrinsic contribution to the anomalous Hall effect.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Experimental study of anomalous Hall effect and magnetic symmetry in an antiferromagnet.", "tags": ["anomalousHall", "experiment", "magnetism"], "image": "", "briefing": {"background": "비공선형 반강자성체에서 나타나는 홀 효과는 자성 구조와 위상학적 물리량 간의 결합을 이해하는 데 핵심적입니다.", "motivation": "UNi4B의 알려진 자기 지배적인 지상태와 관측된 홀 효과 사이의 불일치를 해결하고 자기 대칭성을 명확히 하기 위함입니다.", "result": "비-제로 자기장에서 나타나는 홀 효과가 단순히 도메인 형성이 아니라 기존 모델보다 낮은 대칭성을 가진 자기 구조로 설명됨을 밝혔습니다.", "implication": "자성 물질의 대칭성 분석이 거시적 수송 현상을 이해하는 데 얼마나 중요한지를 재확인하며, 숨겨진 자기 구조 분석의 중요성을 강조합니다.", "novelty": "기존에 제안된 UNi4B의 자기 구조 모델을 수정해야 할 필요성을 실험적 수송 데이터로 입증했습니다.", "unresolved": "제안된 낮은 대칭성의 자기 구조를 직접 확인할 수 있는 미시적 실험(중성자 산란 등) 필요.", "future_work": "제안된 자기 구조의 이론적 검증 및 다른 비공선형 자성체로의 일반화.", "concepts": [{"term": "Anomalous Hall effect (AHE)", "why_emerged": "전도 전자가 자성체의 스핀 구조와 상호작용하여 나타나는 횡방향 전압을 이해하기 위해 필요.", "origin": "Hall (1881)", "connections": "Berry 곡률, 스핀-궤도 결합, 강자성/반강자성 금속의 위상물리."}, {"term": "Noncollinear antiferromagnet", "why_emerged": "단순한 업-다운 스핀 배열이 아닌 복잡한 기하학적 스핀 배열을 가진 반강자성체를 설명하기 위해 필요.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "카이랄 자성, 스핀 텍스처, 위상학적 홀 효과."}], "english_summary": ["Reports anomalous Hall resistivity components in the antiferromagnet UNi4B.", "Proposes that the observed Hall effect implies a lower magnetic symmetry than previously assumed.", "Rules out magnetic domain formation as the primary source of the signal.", "Identifies significant intrinsic contributions to the anomalous
