<title>Daily Paper Slideshow</title>
<style>
  :root {
    color-scheme: light;
    --bg: #f6f7f4;
    --paper: #ffffff;
    --ink: #111827;
    --muted: #64748b;
    --line: #d8ddd2;
    --accent: #176b87;
    --accent-2: #9a3412;
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; overflow: auto; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: var(--bg); color: var(--ink); }
  .shell { max-width: 1500px; min-height: 100vh; margin: 0 auto; padding: 14px 18px; display: flex; flex-direction: column; }
  .topbar { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 16px; }
  .top-actions { display: flex; align-items: center; gap: 10px; }
  .topbar a, button { border: 1px solid var(--line); border-radius: 8px; background: var(--paper); color: var(--ink); padding: 10px 14px; font-weight: 700; text-decoration: none; cursor: pointer; }
  button.primary { background: var(--accent); border-color: var(--accent); color: white; }
  button:disabled { opacity: 0.45; cursor: not-allowed; }
  .counter { color: var(--muted); font-weight: 700; }
  .slide { min-height: calc(100vh - 82px); background: var(--paper); border: 1px solid var(--line); border-radius: 10px; padding: 18px; box-shadow: 0 18px 42px rgba(15, 23, 42, 0.10); display: grid; grid-template-columns: minmax(310px, 0.86fr) minmax(0, 1.55fr); gap: 18px; overflow: visible; }
  .paper-head { min-width: 0; min-height: 0; overflow: visible; display: flex; flex-direction: column; gap: 12px; }
  .figure { margin: 0; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: #f8fafc; }
  .figure img { display: block; width: 100%; max-height: 41vh; object-fit: contain; background: white; }
  .figure figcaption { padding: 7px 10px; color: var(--muted); font-size: 12px; line-height: 1.3; }
  .head-text { display: flex; flex-direction: column; gap: 9px; min-width: 0; }
  .badges { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .badge { border-radius: 999px; padding: 5px 9px; background: #eef2ff; color: #3730a3; font-size: 12px; font-weight: 800; }
  .score { background: #fee2e2; color: #991b1b; }
  h1 { margin: 0; font-size: 25px; line-height: 1.15; letter-spacing: 0; overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
  h1 a { color: inherit; text-decoration-color: rgba(23, 107, 135, 0.35); text-decoration-thickness: 2px; text-underline-offset: 4px; }
  h1 a:hover { color: var(--accent); text-decoration-color: var(--accent); }
  .meta, .authors, .why, .abstract { font-size: 13px; line-height: 1.45; }
  .meta, .authors { color: var(--muted); }
  .why strong, .abstract strong, .authors strong { color: var(--ink); }
  .authors { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .why { border-left: 4px solid var(--accent-2); padding-left: 10px; color: #374151; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .abstract { border-top: 1px solid var(--line); padding-top: 14px; color: #374151; }
  .original-abstract { border-top: 1px solid var(--line); padding-top: 10px; color: #374151; font-size: 11.5px; line-height: 1.35; overflow-wrap: anywhere; }
  .original-abstract strong { display: block; margin-bottom: 4px; color: var(--ink); }
  .tags { display: flex; flex-wrap: wrap; gap: 8px; }
  .tag { border-radius: 999px; padding: 4px 8px; background: #f1f5f9; color: #475569; font-size: 12px; font-weight: 700; }
  .head-text > .link { display: none; }
  .briefing { min-width: 0; min-height: 0; overflow: visible; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); grid-auto-rows: minmax(0, auto); align-content: start; gap: 11px 18px; border-top: 0; padding-top: 0; }
  .brief-section { min-width: 0; }
  .brief-section.wide { grid-column: 1 / -1; }
  .brief-section h2 { margin: 0 0 4px; font-size: 14px; line-height: 1.22; color: #0f766e; letter-spacing: 0; }
  .brief-section p, .brief-section li { margin: 0; font-size: 12.5px; line-height: 1.42; color: #1f2937; overflow-wrap: anywhere; }
  .brief-section ul { margin: 0; padding-left: 20px; }
  .concepts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 9px 14px; }
  .concept { border-top: 1px solid var(--line); padding-top: 7px; }
  .concept h3 { margin: 0 0 4px; font-size: 13px; color: #7c2d12; letter-spacing: 0; }
  .concept p { margin: 2px 0 0; font-size: 11.5px; line-height: 1.35; color: #374151; overflow-wrap: anywhere; }
  .concept b { color: #111827; }
  .link { color: var(--accent); font-weight: 800; text-decoration: none; }
  .empty { padding: 48px; background: var(--paper); border: 1px solid var(--line); border-radius: 12px; color: var(--muted); }
  @media (max-width: 860px) {
    .shell { padding: 14px; }
    .topbar, .top-actions { align-items: stretch; flex-direction: column; }
    .slide, .briefing, .concepts { grid-template-columns: 1fr; }
    .slide { min-height: auto; overflow: visible; display: grid; }
    h1 { font-size: 28px; }
  }
</style>

<script>
const slides = [{"title": "Correlated Low-Energy Model of Monolayer 1H-NbS2: A cRPA+DMFT Study", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2610.06912", "authors": "Karollaine C. Leite, Jorge L. B. de Faria, Luiz Antonio Ribeiro Junior, Alexandre C. Dias, Helena Bragan\\c{c}a, Alberto S. de Arruda", "last_authors": "Luiz Antonio Ribeiro Junior, Alexandre C. Dias, Helena Bragan\\c{c}a, Alberto S. de Arruda", "summary": "Monolayer 1 ​ H ​ - ​ NbS 2 1\\mathrm{H}\\text{-}\\mathrm{NbS}_{2} hosts a well-separated metallic band of predominant Nb- d z 2 d_{z^{2}} character, providing an ideal platform to probe electronic correlations within a single-band setting. In this work, we present a comprehensive study of 1 ​ H ​ - ​ NbS 2 1\\mathrm{H}\\text{-}\\mathrm{NbS}_{2} by combining first-principles Wannier interpolation, constrained random-phase approximation (cRPA), and DFT+DMFT. We show that an effective single-band model accurately captures the low-energy electronic structure, reproducing key experimental features from ARPES and STS d ​ I / d ​ V dI/dV spectra, including a characteristic Van Hove singularity. While static DFT+ U U fails to describe the correlated metallic nature of the system, DFT+DMFT successfully accounts for the spectral weight redistribution and dynamic correlations. By defining the cRPA target subspace directly within the isolated Nb- d z 2 d_{z^{2}} band, we obtain a renormalized local interaction of U cRPA = 1.138 ​ eV U_{\\mathrm{cRPA}}=1.138\\penalty\\ \\mathrm{eV} . This interaction stabilizes a strongly correlated metallic state that remains robust upon cooling. Remarkably, this minimal single-band model captures a spectral broadening similar to that previously reported in more elaborate treatments - incorporating larger local interactions ( U ∼ 1.8 ​ eV U\\sim 1.8\\penalty\\ \\mathrm{eV} , derived from a multiorbital cRPA construction), intersite Coulomb terms ( V V ), and electron-phonon coupling - demonstrating that a consistently downfolded local interaction alone can already capture key aspects of the experimentally observed low-energy behavior of monolayer 1 ​ H ​ - ​ NbS 2 1\\mathrm{H}\\text{-}\\mathrm{NbS}_{2} .", "tier": "A_MUST_READ", "score": "10", "reason": "Directly links DFT+DMFT, ARPES, and STS spectra for a 2D material relevant to electronic structure.", "tags": ["ARPES", "STS", "DMFT", "correlated"], "image": "https://arxiv.org/html/2610.06912v2/crystal_structure.png", "briefing": {"background": "원자 한 층 두께의 전이금속 디칼코게나이드(TMD)는 차원성 저하와 전자 상관관계(electronic correlation)가 결합하여 독특한 물성을 나타냅니다. 특히 1H-NbS2는 단일 밴드 금속성을 보여주는 드문 사례로, 상관관계가 물성에 미치는 영향을 연구하기 위한 이상적인 플랫폼입니다.", "motivation": "기존의 정적인 DFT+U 계산은 NbS2의 상관 금속 상태를 설명하는 데 한계가 있었습니다. 본 연구는 동역학적 상관관계를 고려하는 DFT+DMFT와 파라미터가 없는 cRPA 방법을 결합하여, 실험에서 관찰된 ARPES 및 STS 스펙트럼(특히 Van Hove singularity)을 정확히 모사할 수 있는 최소 모델을 구축하고자 했습니다.", "result": "Nb-dz2 궤도에 기반한 유효 단일 밴드 모델이 cRPA를 통해 도출된 국소 상호작용(U = 1.138 eV) 하에서 ARPES와 STS의 주요 특징을 잘 재현함을 확인했습니다. 특히 DMFT가 spectral weight의 재분배와 동역학적 확장을 성공적으로 설명하여, 실험에서 나타나는 특징적인 Van Hove singularity와 선폭 확장을 포착했습니다.", "implication": "복잡한 다중 궤도 모델이나 전자-포논 결합을 명시적으로 넣지 않더라도, 정확하게 도출된(downfolded) 국소 상호작용을 포함한 단일 밴드 DMFT 모델만으로도 1H-NbS2의 저에너지 물리 현상을 상당 부분 설명할 수 있음을 시사합니다.", "novelty": "실험적 기법(ARPES, STS)과 이론적 기법(cRPA, DMFT)을 직접적으로 연결하여 2D 상관계 물질의 전자 구조를 정밀하게 검증했습니다. 독자의 관심사인 ARPES/STS 해석과 2D 물질의 전자 구조 이해에 직접적인 정보를 제공합니다.", "unresolved": "단일 밴드 모델이 저에너지 영역을 잘 설명하지만, 고에너지 영역에서의 다중 궤도 효과나 비국소적(non-local) Coulomb 상호작용의 세부적인 기여는 여전히 논의의 여지가 있습니다.", "future_work": "다른 TMD 물질이나 헤테로 구조에 이 모델링 접근법을 적용하여, 상관관계에 의한 상전이(예: Mott 전이 또는 CDW와의 경쟁)를 연구할 수 있을 것입니다.", "concepts": [{"term": "cRPA (constrained Random Phase Approximation)", "why_emerged": "특정 궤도 내의 유효 상호작용(U)을 계산할 때, 다른 궤도에 의한 차폐(screening) 효과를 이론적으로 정확하게 산출하기 위해 등장했습니다.", "origin": "Aryasetiawan 등에 의해 제안됨 (2004년경)", "connections": "GW approximation, DFT+U, DMFT 파라미터 결정"}, {"term": "DFT+DMFT", "why_emerged": "표준적인 밀도범함수이론(DFT)이 강한 상관관계가 있는 전자 시스템의 들뜸 상태(excitation)를 설명하지 못하는 한계를 극복하기 위해 제안되었습니다.", "origin": "Georges, Kotliar 등에 의해 1990년대 정립됨", "connections": "Mott insulator, dynamical self-energy, Hubbard model"}, {"term": "Van Hove Singularity (VHS)", "why_emerged": "상태 밀도(DOS)가 에너지 대역 내에서 불연속적이거나 발산하는 지점을 설명하여, 물질의 전도성 및 초전도 현상을 이해하기 위해 사용됩니다.", "origin": "Leon Van Hove (1953)", "connections": "Fermi surface topology, CDW, Superconductivity"}, {"term": "1H-NbS2", "why_emerged": "2D 층상 구조에서 전하 밀도 파(CDW)와 초전도성이 공존하거나 경쟁하는 물리적 특성을 연구하기 위한 대표적인 TMD 물질로 주목받았습니다.", "origin": "초록 정보만으로는 특정하기 어려움 (전통적인 TMD 연구의 연장선)", "connections": "NbSe2, MoS2, 2D Superconductivity"}], "english_summary": ["A cRPA+DMFT study identifies a minimal single-band model for monolayer 1H-NbS2.", "The model successfully reproduces experimental ARPES and STS spectra, including Van Hove singularities.", "Dynamic correlations are shown to be essential for capturing spectral weight redistribution.", "Consistently derived local interaction U = 1.138 eV accounts for observed low-energy behavior without complex multi-orbital terms."]}}, {"title": "Progress and Prospect of AI in ARPES Workflow", "journal": "arXiv_CondMat", "source": "keyword", "link": "https://arxiv.org/abs/2610.10140", "authors": "Sandy Adhitia Ekahana, Aalok Tiwari, Pratik Saud, et al.", "last_authors": "Eli Rotenberg, Jyoti Katoch", "summary": "Artificial intelligence (AI) is becoming an increasingly useful tool across the experimental sciences, including angle-resolved photoemission spectroscopy (ARPES), which routinely produces large, multidimensional datasets of electronic structure. Recent advances in AI and machine learning (ML) have opened new opportunities across the entire ARPES workflow, from automated sample preparation and real-time data acquisition to post-experiment data analysis and comparison with theoretical calculations. Despite this progress, a comprehensive review of ML applications, their capabilities, and reliability across the different stages of ARPES workflow is still lacking. In this review, we first introduce ML methods that are most relevant to experimentalists working in condensed matter physics and materials science. We then follow the ARPES workflow, reviewing existing ML applications at each step and discussing their advantages, limitations and potential for future development. We also examine the current ARPES data landscape, where several open databases are available but remain relatively small and fragmented compared with large, shared datasets such as ImageNet. Given these limitations, we suggest that the community focus on sharing pretrained models that can be further trained, adapted to specific tasks, and redistributed, while working toward a larger and standardized open ARPES dataset repository. Finally, we discuss our perspectives on the future of AI within the ARPES workflow using a six-level framework of laboratory automation, highlighting the opportunities and challenges in moving toward a fully autonomous, self-driving ARPES laboratory.", "tier": "A_MUST_READ", "score": "10", "reason": "title strong match: ARPES", "tags": ["ARPES", "angle-resolvedphotoemission", "photoemission", "STS"], "image": "https://arxiv.org/html/2610.10140v1/figures_final/Fig1_final.png", "briefing": {"background": "ARPES는 고체 물리 연구에서 전자 구조를 직접 관찰하는 핵심 도구이지만, 생성되는 데이터의 양이 방대하고 다차원적이어서 분석에 많은 시간과 숙련도가 요구됩니다. 최근 인공지능(AI)과 머신러닝(ML)은 이러한 데이터를 효율적으로 처리하고 새로운 물리적 통찰을 얻는 대안으로 부상하고 있습니다.", "motivation": "시료 준비부터 데이터 획득, 분석, 이론과의 비교에 이르는 ARPES 전체 워크플로우에서 ML의 적용 현황을 정리하고, 앞으로의 발전 방향과 한계점을 제시하기 위함입니다.", "result": "실시간 데이터 획득 최적화, 자동화된 시료 정렬, ML 기반의 스펙트럼 디컨볼루션(deconvolution) 등 다양한 단계에서의 AI 적용 사례를 검토했습니다. 또한, ImageNet과 같은 대규모 표준 데이터셋의 부재를 해결하기 위해 사전 학습된 모델(pretrained models) 공유의 중요성을 강조했습니다.", "implication": "ARPES 연구 방식이 단순히 데이터를 수집하는 단계를 넘어, AI가 실험 과정을 가이드하고 분석을 자동화하는 '자율 주행 실험실(self-driving lab)' 모델로 진화할 가능성을 보여줍니다.", "novelty": "ARPES 특화 AI 워크플로우를 6단계 자동화 프레임워크로 정의하여 체계적인 가이드를 제공합니다. ARPES 실험가들에게는 최신 분석 기술의 트렌드를 파악할 수 있는 중요한 리뷰입니다.", " 접적으로 연결됩니다.", "unresolved": "피크 분리가 거시적인 격자 변형에 의한 것인지 아니면 나노미터 스케일의 도메인 형성에 의한 것인지에 대한 추가적인 공간 분해능 연구가 필요합니다.", "future_work": "단축 응력(uniaxial strain) 하에서의 ARPES 또는 전도성 측정을 통해 구조적 변화가 전자 구조와 수송 특성에 미치는 직접적인 영향을 조사할 것으로 예상됩니다.", "concepts": [{"term": "Kagome Metal", "why_emerged": "기하학적 좌절에 의한 평탄 밴드와 위상적 특성을 동시에 탐구하기 위해 제안된 격자 모델입니다.", "origin": "일본의 대나무 바구니 패턴(Kagome)에서 유래한 격자 구조입니다.", "connections": "AV3Sb5 (A=Cs, Rb, K), FeGe, CoSn 등"}, {"term": "Charge-Density-Wave (CDW)", "why_emerged": "저차원 금속에서 전자-음향자 상호작용에 의해 전하 밀도가 주기적으로 변조되는 상태를 설명하기 위해 도입되었습니다.", "origin": "Rudolf Peierls가 이론적으로 예측한 Peierls instability에 기반합니다.", "connections": "Fermi surface nesting, BCS 이론, NbSe2"}, {"term": "Bragg peak splitting", "why_emerged": "단일 상이었던 결정 구조가 전이 온도 이하에서 대칭성이 낮아지거나 격자 상수가 다른 두 위상으로 나뉠 때 발생합니다.", "origin": "Lawrence Bragg와 William Henry Bragg의 X선 회절 이론에서 비롯되었습니다.", "connections": "Structural phase transition, Strain engineering"}], "english_summary": ["High-resolution synchrotron X-ray diffraction reveals structural Bragg peak splitting in FeGe at the CDW transition.", "The findings indicate a strong coupling between the structural phase separation and charge-density-wave formation.", "This suggests that the quantum states in kagome metals can be effectively manipulated via external strain.", "The result provides a structural basis for understanding the complex phase diagram of FeGe."]}}, {"title": "Correlated one-dimensional electron conduction in ferroelastic domain walls through nematic-like charge stripes", "journal": "Science_Advances", "source": "author whitelist", "link": "https://www.science.org/doi/abs/10.1126/sciadv.aee1472?af=R", "authors": "Minho Kang, Gyubin Lee, Wooin Yang, et al.", "last_authors": "Yeongkwan Kim, Chan-Ho Yang", "summary": "One-dimensional electronic transport reveals many-body quantum phenomena and serves as a foundation for quantum devices, sensors, and reconfigurable electronics. Here, we demonstrate that surface-exposed ferroelastic twin walls in epitaxial WO 3 films function as intrinsic one-dimensional channels, confining electrons to screen surface-bound charges induced by flexoelectric polarization. Scanning tunneling microscopy uncovers a self-organized nematic-like phase forming periodic stripes perpendicular to the walls. Conductive atomic force microscopy and angle-resolved photoemission spectroscopy resolve quantized one-dimensional states and reveal conductance enhancements exceeding two orders of magnitude along the twin walls relative to the surrounding semi-insulating surface regions at room temperature. Temperature-dependent transport follows an Efros–Shklovskii variable-range hopping law, with a crossover near 140 K and a localization length of 39 Å—identical to the stripe period—signifying Coulomb-coupled electrons confined within stripe-induced potential wells along the walls. These findings establish WO 3 ferroelastic walls as a tunable platform for engineering one-dimensional correlated electron states.", "tier": "A_MUST_READ", "score": "9", "reason": "author whitelist: Yeongkwan Kim", "tags": ["nematic", "correlated"], "image": "", "briefing": {"background": "1차원 전자 채널은 룬팅저 액체(Luttinger liquid)와 같은 비페르미 액체 거동을 연구하는 핵심 무대이지만, 원자 단위로 잘 정의된 1차원 시스템을 실제 물질에서 구현하고 제어하는 것은 매우 어렵습니다.", "motivation": "강탄성(ferroelastic) 산화물인 WO3의 도메인 벽(twin walls)이 플렉소전기 현상에 의해 유도된 전하를 가두는 천연 1차원 전도 채널로 기능할 수 있는지 확인하고자 했습니다.", "result": "STM과 ARPES를 통해 WO3 도메인 벽에서 네마틱 스타일의 전하 스트라이프와 양자화된 1차원 상태를 확인했습니다. 특히 도메인 벽을 따라 흐르는 전도성이 상온에서도 주변보다 200배 이상 높으며, 저온에서는 Coulomb-coupled 전도 특성(Efros-Shklovskii hopping)을 보임을 밝혔습니다.", "implication": "도메인 벽이 단순한 경계면이 아니라, 강한 상관관계를 가진 1차원 전자계를 물리적으로 분리하고 가둘 수 있는 유용한 플랫폼임을 입증했습니다.", "novelty": "사용자의 주요 관심사인 ARPES와 STM을 사용하여 도메인 벽 내부의 미시적 전자 구조를 규명했으며, 네마틱 거동과 1차원 전도성을 연결했다는 점에서 독창적입니다.", "unresolved": "1차원 한정 효과가 극저온에서 완전한 Luttinger 액체 거동으로 이어지는지, 혹은 스트라이프의 주기성이 도핑에 의해 어떻게 조절되는지는 아직 불분명합니다.", "future_work": "도메인 벽의 위치를 외부 전기장이나 기계적 응력으로 이동시켜 1차원 회로를 실시간으로 재구성하는 연구가 진행될 것으로 보입니다.", "concepts": [{"term": "Ferroelastic domain wall", "why_emerged": "결정 구조의 대칭성 붕괴로 인해 생기는 서로 다른 변형 상태 간의 경계면으로, 독특한 물리적 계면 현상을 연구하기 위해 주목받았습니다.", "origin": "K. Aizu (1969) 등에 의해 강탄성 개념이 정립되었습니다.", "connections": "Multiferroics, Domain wall nanoelectronics"}, {"term": "Nematic-like charge stripes", "why_emerged": "회전 대칭성은 깨지되 병진 대칭성은 유지되는 전자 상태를 설명하기 위해 액정의 네마틱 위상 개념을 전하 시스템에 도입했습니다.", "origin": "Fradkin과 Kivelson 등이 구리 산화물(Cuprates) 연구에서 대중화했습니다.", "connections": "High-Tc superconductivity, Electronic nematicity"}, {"term": "Efros-Shklovskii hopping", "why_emerged": "무질서한 시스템에서 전자 간의 쿨롱 상호작용이 전하 수송에 미치는 영향을 설명하기 위해 제안되었습니다.", "origin": "A. L. Efros와 B. I. Shklovskii (1975)", "connections": "Variable range hopping, Mott insulator, Anderson localization"}, {"term": "Flexoelectricity", "why_emerged": "변형률의 기울기(gradient)가 전기적 편광을 유도하는 현상으로, 나노 스케일의 불균일한 변형이 중요한 시스템에서 부각되었습니다.", "origin": "V. S. Mashkevich와 K. B. Tolpygo (1957) 등에 의해 이론화되었습니다.", "connections": "Piezoelectricity, Strain gradient"}], "english_summary": ["Ferroelastic twin walls in WO3 act as intrinsic 1D conductive channels via flexoelectric charge confinement.", "STM and ARPES revealed 1D quantized states and nematic-like charge stripes perpendicular to the walls.", "Transport shows a 200-fold conductance enhancement at room temperature and ES-type variable range hopping at low T.", "The work establishes WO3 walls as a tunable platform for studying 1D correlated electronic states."]}}, {"title": "Remote magnon sensing detects the universal phase stiffness jump in Bi2Sr2CaCu2O8+", "journal": "arXiv_CondMat", "source": "author whitelist", "link": "https://arxiv.org/abs/2610.08934", "authors": "Yue Sun, Mai Nguyen, Naiyuan James Zhang, et al.", "last_authors": "Joseph Orenstein, Xiaodong Xu", "summary": "Phase stiffness governs macroscopic quantum coherence in superfluids and superconductors, providing a sensitive probe of condensate depletion, fluctuations, and phase transitions. However quantitative and spatially resolved measurements remain challenging. Here we report a contactless, local, all-optical measurement of superconducting phase stiffness using propagating antiferromagnetic magnons as remote sensors. In CrSBr, strong exciton-magnon coupling enables optical excitation and detection of magnon wavepackets and precise determination of their group velocity. When CrSBr is interfaced with underdoped Bi$_2$Sr$_2$CaCu$_2$O$_{8+\\delta}$, we find that the magnon group velocity is substantially enhanced below the superconducting transition and quantitatively encodes the phase stiffness through Meissner screening currents. Using this capability, we identify a parallel-field-induced Berezinskii-Kosterlitz-Thouless transition through direct observation of the universal phase-stiffness jump, revealing a field-controlled route to expose intrinsic two-dimensional phase-ordering physics in a bulk cuprate. Our work establishes propagating magnons as local probes of superconducting electrodynamics and phase-coherent phenomena in low-dimensional quantum materials.", "tier": "A_MUST_READ", "score": "9", "reason": "author whitelist: Makoto Hashimoto", "tags": ["cuprate", "superconduct", "magnon", "ferromagnet", "antiferromagnet"], "image": "https://arxiv.org/html/2610.08934v1/Figure_1_v4.png", "briefing": {"background": "초전도체의 위상 강성(phase stiffness)은 쿠퍼 쌍의 위상 결맞음을 결정하는 파라미터로, 초전도 전이의 본질을 이해하는 데 필수적이지만 이를 국부적이고 비접촉식으로 측정하기는 매우 어렵습니다.", "motivation": "자성체 CrSBr의 마그논 군속도가 주변 환경의 자기 차폐 효과에 민감하다는 점을 이용하여, 초전도체 Bi2212의 위상 강성을 정밀하게 측정하는 '원격 마그논 센싱' 기법을 개발하고자 했습니다.", "result": "CrSBr/Bi2212 헤테로 구조에서 마그논 속도 변화를 통해 Bi2212의 Meissner 전류를 감지했으며, 이를 통해 2차원 초전도체의 특징인 Berezinskii-Kosterlitz-Thouless(BKT) 전이의 위상 강성 급격 점프(universal jump)를 성공적으로 관찰했습니다.", "implication": "초전도 위상 동역학을 마그논이라는 자성 입자를 통해 읽어내는 새로운 방법론을 제시했으며, 이는 다양한 반데르발스 양자 물질 계면 연구에 활용될 수 있습니다.", "novelty": "사용자 관심사인 Cuprate(Bi2212)와 자성체 계면 물성을 결합했으며, 광학적 기법으로 초전도의 전기역학적 특성을 정량화한 것이 매우 혁신적입니다.", "unresolved": "마그논과 초전도체 사이의 계면 결합 세기가 측정 정밀도에 미치는 한계와, 다른 대칭성을 가진 초전도체(예: p-wave)에서의 적용 가능성이 남아 있습니다.", "future_work": "마그논 센서를 활용하여 트위스트 2D 물질이나 위상 초전도체의 국부적인 초전도 분율 및 변동성을 탐색하는 연구가 기대됩니다.", "concepts": [{"term": "Phase stiffness", "why_emerged": "초전도 응축물이 위상 변화에 저항하는 정도를 나타내며, 초전도체의 전도성과 Meissner 효과의 근원을 설명합니다.", "origin": "Ginzburg-Landau 이론 및 BCS 이론의 연장선상에 있습니다.", "connections": "Superfluid density, Kinetic inductance, Helicity modulus"}, {"term": "BKT transition", "why_emerged": "2차원 시스템에서는 장거리 질서가 존재할 수 없다는 Mermin-Wagner 정리를 깨고, 소용돌이(vortex) 쌍의 결합으로 발생하는 위상 전이를 설명하기 위해 도입되었습니다.", "origin": "Vadim Berezinskii, J. M. Kosterlitz, David Thouless (1970년대 초)", "connections": "2D superconductivity, XY model, Topological phase transition"}, {"term": "Magnon sensing", "why_emerged": "물질 내부의 자기장이나 전하 정보를 비접촉식으로, 그리고 나노미터 스케일의 높은 감도로 감지하기 위해 제안되었습니다.", "origin": "최근 반데르발스 자성체(CrSBr 등)의 발견과 함께 급격히 발전한 분야입니다.", "connections": "Spintronics, Exciton-magnon coupling, NV center sensing"}, {"term": "Meissner screening", "why_emerged": "초전도체 내부로 외부 자기장이 침투하지 못하는 현상을 설명하며, 초전도 상태의 가장 기초적인 판별 기준입니다.", "origin": "Walther Meissner와 Robert Ochsenfeld (1933)", "connections": "London equations, Magnetic levitation, Penetration depth"}], "english_summary": ["A novel remote magnon sensing technique was developed to measure the phase stiffness of Bi2212 contactless.", "The group velocity of magnons in CrSBr encodes the Meissner screening currents of the underlying cuprate.", "The study observed the universal phase-stiffness jump, a hallmark of the BKT transition in 2D systems.", "This establishes hybrid magnon-superconductor structures as a probe for low-dimensional quantum electrodynamics."]}}, {"title": "Mapping Strain and Spatial-Modulation Phase from Local Wave Vectors in Scanning Tunneling Microscopy", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2610.10255", "authors": "Xinze Yang, Sandra Sajan, Maria N. Gastiasoro, Miguel M. Ugeda, Eduardo H. da Silva Neto", "last_authors": "Miguel M. Ugeda, Eduardo H. da Silva Neto", "summary": "Spatially varying lattice distortions can produce local changes in electronic properties that are obscured by measurements averaging over extended regions. With its atomic-scale spatial resolution, scanning tunneling microscopy (STM) provides, in principle, a means of quantifying such distortions locally. A widely used approach for extracting local strain from STM images is the Lawler–Fujita (LF) algorithm [Lawler et al. , Nature 466 , 347 (2010)], which determines the displacement field from the phase of the lattice modulation and subsequently obtains the strain by differentiation. However, this approach requires two-dimensional phase unwrapping, which can fail in regions where the phase is ill-defined, particularly near topological defects such as edge dislocations. Here, we introduce an alternative approach that circumvents these limitations by directly measuring the local wave vector in real space. We derive the relationship between the local wave vector, strain, and the phase gradient, and show that the local wave vector mapping (LWM) algorithm remains robust even when the phase itself is ill-defined. This makes the method particularly well suited for imaging the phase-gradient textures associated with vortices and other topological defects. We benchmark the algorithm using simulated data containing known lattice distortions and artificially generated vortices. Finally, we apply the method to experimental STM data and resolve the charge density wave (CDW) incommensurabilities, lattice distortions, and CDW phase vortices in 4 ​ H ​ a ​ – ​ NbSe 2 \\mathrm{4Ha}\\textrm{\\,--\\,}\\mathrm{NbSe}_{2} and 2 ​ H ​ – ​ NbSe 2 \\mathrm{2H}\\textrm{\\,--\\,}\\mathrm{NbSe}_{2} . The physical implications of these observations were recently reported by S. Sajan, X. Yang, et al. [arXiv:2607.20335 (2026)]. The program package and the example usage is publicly available at the GitHub: https://github.com/jsntxyang/LocalWavevectorMeasuremnt .", "tier": "B_IMPORTANT_CONDMAT", "score": "10", "reason": "Direct methodological advancement for STM analysis of NbSe2 charge density waves.; demoted from A: broad CM, not direct user/project hit", "tags": ["STM", "CDW", "method"], "image": "https://arxiv.org/html/2610.10255v1/Fig_Process_V2.png", "briefing": {"background": "주사 터널링 현미경(STM)은 원자 수준의 해상도로 물질의 표면 구조와 전자 상태를 측정하는 도구입니다. 전하 밀도 파(CDW)나 격자 변형과 같은 공간적 변조를 정량화하는 것은 물성 연구에서 매우 중요하지만, 넓은 영역을 평균 내는 측정 방식으로는 국소적인 위상 결함이나 미세한 변형을 포착하기 어렵습니다.", "motivation": "기존에 널리 사용되던 Lawler-Fujita(LF) 알고리즘은 격자 변조의 위상을 통해 변위와 변형률을 계산하지만, 전위(dislocation)와 같이 위상이 정의되지 않는 결함 부근에서는 위상 되감기(unwrapping) 과정이 실패하는 한계가 있습니다.", "result": "본 연구에서는 실공간에서 국소 파수(local wave vector)를 직접 측정하여 위상 결함에 관계없이 변형률과 위상 기울기를 매핑할 수 있는 LWM(Local Wavevector Mapping) 알고리즘을 개발했습니다. 이를 2H-NbSe2 및 4Ha-NbSe2에 적용하여 CDW의 비정합성과 위상 보텍스(vortex) 구조를 성공적으로 시각화했습니다.", "implication": "LWM 알고리즘의 도입으로 물리적 불연속점이나 강한 위상 텍스처가 존재하는 복잡한 시스템에서도 정확한 변형률 분석이 가능해졌습니다. 이는 STM 데이터를 해석하는 새로운 표준 도구를 제공하며, 특히 결함이 물성에 중요한 역할을 하는 위상 물질 연구에 큰 도움을 줄 것입니다.", "novelty": "기존 LF 알고리즘의 고질적인 문제인 위상 결함에서의 수렴 실패를 파수 직접 매핑 방식으로 해결했다는 점이 독창적입니다. 독자의 주 관심사인 NbSe2와 같은 층상 구조 물질의 CDW 분석에 직접적으로 활용될 수 있는 방법론적 진보입니다.", "unresolved": "매우 무질서한 계(disordered system)에서 파수 피크가 불분명할 경우의 알고리즘 신뢰도 한계나, 다중 q(multiple-q) CDW 간섭 조건에서의 분리 정밀도에 대한 추가 검증이 필요할 수 있습니다.", "future_work": "개발된 오픈 소스 패키지를 활용하여 Kagome 금속(AV3Sb5)이나 고온 초전도체 등 다양한 CDW 및 격자 변조 시스템에 대한 재분석과 새로운 위상 결함 탐색이 기대됩니다.", "concepts": [{"term": "Lawler-Fujita (LF) 알고리즘", "why_emerged": "STM 이미지에서 원자 위치의 미세한 변위를 추출하여 국소적인 변형률을 정량화하기 위해 고안되었습니다.", "origin": "Lawler et al., Nature 466, 347 (2010)", "connections": "Bragg peak 분석, Fourier Transform Scanning Tunneling Spectroscopy (FT-STS)"}, {"term": "CDW Phase Vortex", "why_emerged": "전하 밀도 파의 위상이 공간적으로 2π만큼 회전하며 중심점에서는 위상이 정의되지 않는 위상적 결함을 설명하기 위해 도입되었습니다.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "Topological defects, Edge dislocations, Charge Density Wave"}, {"term": "Phase Unwrapping", "wh grown on SrF2(111)", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/4hdt-17r9", "authors": "Sara Bey, Shelby S. Fields, Nicholas G. Combs, et al.", "last_authors": "Xinyu Liu, Badih A. Assaf", "summary": "α-MnTe is a prototypical altermagnet exhibiting a strong anomalous Hall effect (AHE), despite having a nearly vanishing magnetization. ${\\mathrm{SrF}}_{2}(111)$ has a small lattice mismatch with MnTe and a matching coefficient of thermal expansion; there are, however, no reports on measurements of t…", "tier": "B_IMPORTANT_CONDMAT", "score": "9", "reason": "Experimental study of anomalous Hall effect in an altermagnet, highly relevant.", "tags": ["anomalousHall", "altermagnet"], "image": "", "briefing": {"background": "알터마그넷(Altermagnet)은 순자화가 0이면서도 비상대론적인 스핀 분극 밴드를 갖는 새로운 자성 상태로, 강자성과 반강자성의 장점을 모두 갖춰 큰 관심을 받고 있습니다.", "motivation": "알터마그넷의 전형인 알파-MnTe를 SrF2(111) 기판 위에 박막으로 성장시켜, 우수한 결정성과 함께 대칭성에 기인한 비정상 홀 효과(AHE)를 실험적으로 확인하고자 했습니다.", "result": "격자 부정합이 적은 SrF2 기판을 사용하여 고품질의 MnTe 박막 성장에 성공했으며, 자화가 매우 작음에도 불구하고 알터마그넷 특유의 거대한 비정상 홀 효과를 측정했습니다.", "implication": "알터마그넷 기반의 박막 소자 구현 가능성을 입증했으며, 이는 자성 메모리나 스핀 기반 논리 회로에서 에너지 효율적인 소자 설계에 기여할 것입니다.", "novelty": "특정 기판(SrF2)을 이용한 고품질 박막 성장 기술과 결합하여 알터마그넷의 핵심 물성인 AHE를 명확히 보여주었다는 점에서 가치가 큽니다. 독자의 주요 관심사인 altermagnetism의 실제 실험 데이터입니다.", "unresolved": "AHE의 기원이 고유한 베리 곡률(intrinsic) 때문인지 아니면 불순물 산란(extrinsic) 때문인지에 대한 정밀한 분리가 필요합니다.", "future_work": "박막의 두께 및 기판 변형(strain) 제어를 통해 알터마그네틱 스핀 분극 강도를 조절하는 연구와 실제 스핀 토크 소자 제작이 진행될 것으로 예상됩니다.", "concepts": [{"term": "Altermagnetism", "why_emerged": "순자화가 없음에도 스핀 분극된 밴드를 가지는 제3의 자성 상태를 정의하기 위해 최근 제안되었습니다.", "origin": "L. Šmejkal et al. (2022)", "connections": "Antiferromagnetism, Collinear magnetism, Spin-polarized bands"}, {"term": "Anomalous Hall Effect (AHE)", "why_emerged": "자기장이 없는 상태에서 자성체의 내부 특성만으로 발생하는 홀 전압을 설명하기 위해 발견되었습니다.", "origin": "Edwin Hall (1881)", "connections": "Berry curvature, Altermagnets"}, {"term": "Lattice Mismatch", "why_emerged": "기판과 박막 사이의 격자 상수 차이가 박막의 품질과 물리적 변형에 미치는 영향을 평가하기 위해 사용됩니다.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "Epitaxial growth, Strain engineering"}, {"term": "Thermal Expansion Matching", "why_emerged": "온도 변화에 따른 박막의 균열이나 박리를 방지하고 고품질 계면을 얻기 위해 고려됩니다.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "Thin film stability, Epitaxy"}], "english_summary": ["Reports the growth of high-quality alpha-MnTe thin films on SrF2(111) substrates.", "Observes a large anomalous Hall effect (AHE) in an altermagnetic system with nearly zero magnetization.", "Highlights the importance of lattice and thermal expansion matching for realizing altermagnetic properties in thin films.", "Strengthens the experimental evidence for altermagnetism and its potential for dissipationless spintronics."]}}, {"title": "Topological superconductivity on a kagome magnet coupled to a Rashba superconductor", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/7nt6-s5rw", "authors": "Koji Kudo, Ryota Nakai, Hiroki Isobe, Kentaro Nomura", "last_authors": "Hiroki Isobe, Kentaro Nomura", "summary": "A quantum anomalous Hall system is predicted to realize topological superconductivity when proximity coupled to an $s$-wave superconductor. A kagome magnet with chiral magnetic ordering exhibits the quantum anomalous Hall effect; however, superconducting proximity to an ordinary $s$-wave superconduc…", "tier": "B_IMPORTANT_CONDMAT", "score": "9", "reason": "Highly relevant theoretical study linking kagome magnets to topological superconductivity.", "tags": ["kagome", "topologicalsuperconductivity", "anomalousHall"], "image": "", "briefing": {"background": "위상 초전도체는 마요라나 경계 상태를 호스팅할 수 있어 양자 컴퓨팅 구현을 위한 핵심 재료로 꼽힙니다. 특히 양자 이상 홀(QAH) 시스템과 일반적인 s-파 초전도체를 접합하는 방식이 유망한 경로 중 하나로 여겨져 왔습니다.", "motivation": "카고메 격자 구조의 자석은 본질적으로 QAH 효과를 나타낼 수 있는 유망한 후보군입니다. 하지만 기존 연구에서는 카고메 자석과 일반적인 s-파 초전도체의 접합만으로는 위상 초전도 갭을 열기에 충분하지 않은 대칭성 제약이 존재할 수 있음을 시사했습니다.", "result": "이 논문은 카고메 자석을 래시바(Rashba) 스핀-궤도 결합이 존재하는 초전도체와 결합할 경우 위상 초전도 상태가 실현될 수 있음을 이론적으로 입증했습니다. 특히 카고메 격자의 카이랄(chiral) 자기 질서와 래시바 결합의 상호작용이 위상학적 위상을 유도하는 데 핵심적인 역할을 함을 보였습니다.", "implication": "최근 큰 관심을 받고 있는 AV3Sb5와 같은 카고메 물질군에서 초전도 근접 효과를 이용해 마요라나 페르미온을 탐색할 수 있는 구체적인 가이드라인을 제공합니다.", "novelty": "카고메 자석의 특이한 전자 구조와 래시바 초전도체의 스핀-궤도 결합을 결합하여 기존의 한계를 극복하는 새로운 위상 초전도 플랫폼을 제안했다는 점이 혁신적이며, 독자의 주요 관심사인 카고메 금속 및 시간 반전 대칭성 파괴(TRSB)와 직접 연결됩니다.", "unresolved": "실제 실험에서 카고메 자석과 래시바 초전도체 사이의 깨끗한 계면을 형성하고, 예측된 위상 갭을 직접 관측하는 기술적 난제가 남아 있습니다.", "future_work": "실제 물질 기반(예: CsV3Sb5와 고중원소 화합물 접합)의 제1원리 계산과 STM/STS를 통한 국소 상태 밀도 및 경계 상태 관측 실험이 기대됩니다.", "concepts": [{"term": "카고메 자석 (Kagome magnet)", "why_emerged": "기하학적 좌절과 강한 상관관계가 결합되어 특이한 자성 및 전자 구조(평탄 밴드, 디락 점)를 연구하기 위해 등장했습니다.", "origin": "초록 정보만으로는 특정하기 어려우나, 격자 구조 자체는 고대 일본 대바구니 패턴에서 유래했습니다.", "connections": "AV3Sb5 계열 물질, 양자 이상 홀 효과, 위상 부도체와 밀접한 관련이 있습니다."}, {"term": "래시바 초전도체 (Rashba superconductor)", "why_emerged": "공간 반전 대칭성이 깨진 계면이나 결정 구조에서 스핀-궤도 결합이 초전도 페어링에 미치는 영향을 연구하기 위해 필요해졌습니다.", "origin": "Emmanuel Rashba (1960년대 래시바 효과 제시 이후 초전도 접목)", "connections": "비중심대칭 초전도체, 스핀-트리플렛 페어링, 위상 초전도와 연결됩니다."}, {"term": "위상 초전도 (Topological superconductivity)", "why_emerged": "입자와 반입자가 동일한 마요라나 페르미온을 고체 물리 시스템에서 구현하기 위해 제안되었습니다.", "origin": "Alexei Kitaev (키타예프 체인 모델 등)", "connections": "양자 컴퓨팅, 마요라나 속박 상태, p-파 초전도체와 관련이 깊습니다."}], "english_summary": ["The paper explores the realization of topological superconductivity in a kagome magnet coupled with a Rashba superconductor.", "It shows that chiral magnetic ordering in the kagome lattice, combined with Rashba spin-orbit coupling, overcomes symmetry constraints to induce a topological phase.", "The findings provide a theoretical foundation for searching for Majorana bound states in kagome-based heterostructures.", "This is highly relevant for researchers focusing on AV3Sb5 systems and time-reversal symmetry breaking."]}}, {"title": "Magnetic Order from First-Principles Linear Response", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2610.10412", "authors": "Yaroslav Zhumagulov, Emiliano Cruz-Aranda, Denis Kochan, Oleg V. Yazyev", "last_authors": "Denis Kochan, Oleg V. Yazyev", "summary": "The magnetic order of a material is usually predicted by comparing the energies of trial spin configurations, a strategy that cannot reach orders outside the chosen set and rapidly becomes intractable as the number of magnetic sites grows. We show that the order can instead be identified directly from the paramagnetic state: the leading eigenmodes of its self-consistent magnetization response, obtained with spin--orbit coupling at arbitrary wavevector within the primitive cell, determine both the ordering wavevector and the pattern of moments, with no candidate configurations. With no prior assumption about the order, the method correctly reproduces the G-type stacking with out-of-plane moments in the altermagnet candidate KV$_2$Se$_2$O, the $3{:}1$ ferrimagnetic tetrahedra of Cu$_2$OSeO$_3$, and the incommensurate spiral instability of monolayer NiI$_2$. Our results establish the response of the paramagnetic state as a predictive and unbiased route to assessing magnetic order, enabling systematic searches for complex magnets.", "tier": "B_IMPORTANT_CONDMAT", "score": "9", "reason": "Predictive methodology for magnetic order in altermagnets with direct experimental relevance.", "tags": ["altermagnet", "electronicstructure"], "image": "https://arxiv.org/html/2610.10412v1/kv2se2o_modes_wide.png", "briefing": {"background": "물질의 자기 정렬 상태를 예측하는 것은 재료 과학의 핵심 과제입니다. 기존에는 여러 가지 스핀 구조 후보군을 미리 정해놓고 에너지를 비교하는 방식(Trial-and-error)을 주로 사용했습니다.", "motivation": "후보군을 미리 정하는 방식은 계산 비용이 많이 들 뿐만 아니라, 연구자가 예상하지 못한 복잡한 자기 정렬(예: 나선형 구조나 알터자성)을 놓칠 위험이 큽니다.", "result": "연구진은 상자성 상태에서의 선형 응답(Linear Response) 함수를 분석하여, 어떠한 사전 가정 없이도 가장 안정적인 자기 정렬 파수(wavevector)와 모멘트 패턴을 직접 식별할 수 있는 제1원리 방법론을 개발했습니다. 이를 통해 KV2Se2O(알터자성 후보), Cu2OSeO3, NiI2의 복잡한 자기 구조를 정확히 재현했습니다.", "implication": "알터자성체나 비공선형(Non-collinear) 자성체와 같은 새로운 범주의 자성 재료를 체계적이고 편향되지 않은 방식으로 탐색할 수 있는 강력한 도구가 확보되었습니다.", "novelty": "특히 독자의 관심사인 알터자성체(Altermagnet)를 포함하여, 복잡한 3차원 및 2차원 자성체의 정렬 상태를 초기 가설 없이 예측할 수 있다는 점이 매우 중요합니다.", "unresolved": "강한 전자 상관관계가 지배적인 계(Strongly correlated systems)에서 DFT 수준의 선형 응답 함수가 얼마나 정확하게 실제 물리량을 반영할지에 대한 추가 검증이 필요할 수 있습니다.", "future_work": "이 방법론을 활용하여 알려지지 않은 새로운 알터자성체나 고온 위상 자성체를 대량으로 스크리닝(High-throughput screening)하는 연구가 이어질 것으로 보입니다.", "concepts": [{"term": "알터자성체 (Altermagnet)", "why_emerged": "강자성과 반강자성의 특징을 동시에 가지며(넷 자화 0, 스핀 분할 밴드 존재), 기존 분류에 속하지 않는 자성체를 설명하기 위해 등장했습니다.", "origin": "L. Šmejkal, J. Sinova, T. Jungwirth 등이 최근 정립", "connections": "반강자성 스핀트로닉스, 이상 홀 효과, 스핀 갈라짐(Spin splitting)과 연결됩니다."}, {"term": "선형 응답 이론 (Linear Response Theory)", "why_emerged": "외부의 작은 자극(자기장 등)에 대해 시스템이 어떻게 반응하는지를 통해 평형 상태의 물성을 파악하기 위해 개발되었습니다.", "origin": "Ryogo Kubo (1950년대)", "connections": "감수율(Susceptibility), 유전 함수, DFT 계산 등 물리 전반에 응용됩니다."}, {"term": "자기 정렬 파수 (Ordering wavevector)", "why_emerged": "자성 모멘트가 공간적으로 반복되는 주기성을 정량화하기 위해 필요합니다.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "중성자 회절, 스핀 밀도 파(SDW), 자기 구조 인자(Structure factor)와 관련됩니다."}], "english_summary": ["A new first-principles methodology is presented to predict magnetic ordering directly from the paramagnetic state using linear response.", "The method identifies ordering wavevectors and moment patterns without prior assumptions or trial spin configurations.", "It successfully reproduces complex magnetic orders in altermagnet candidates (KV2Se2O) and spiral magnets (NiI2).", "This provides an unbiased route for the systematic search and discovery of complex magnetic materials, including altermagnets."]}}, {"title": "Magnon Polarization Textures and Transport in Antiferromagnets and Altermagnets", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2610.09035", "authors": "Konstantin S. Denisov, Igor \\v{Z}uti\\'c", "last_authors": "Konstantin S. Denisov, Igor \\v{Z}uti\\'c", "summary": "Antiferromagnets (AFMs) host magnons that can exhibit fully circular, elliptic and linear polarizations of sublattice magnetization dynamics. We analyze theoretically different momentum-space magnon polarization textures and magnon transport in collinear AFMs and altermagnets (AMs). The sensitivity of the polarization texture to a magnon momentum direction determines two regimes of magnon polarization kinetics: The Dyakonov-Perel relaxation or its dephasing due to asynchronous Larmor precession. For an easy-axis AFM, magnetic field parallel to the N{\\'e}el vector leads to the suppression of the magnetic dipolar interaction-induced Dyakonov-Perel relaxation, accompanied by the increase in the magnon spin-diffusion length and its counter-intuitive growth with temperature. For a perpendicular orientation, instead, relaxation of circular polarization of magnons is enhanced due to Larmor precession. Finally, extremely anisotropic relaxation of magnon polarization is predicted for AMs or AFMs having Dzyaloshinskii-Morya interaction.", "tier": "B_IMPORTANT_CONDMAT", "score": "9", "reason": "Directly addresses altermagnetism and magnetic transport, which is highly relevant to current interests.", "tags": ["altermagnet", "magnon", "transport"], "image": "https://arxiv.org/html/2610.09035v1/Fig1_L.png", "briefing": {"background": "반강자성체(AFM)와 알터자성체(AM) 내부의 스핀 파동인 마그논은 전하 이동 없이 정보를 전달할 수 있는 차세대 스핀트로닉스 운반체로 주목받고 있습니다.", "motivation": "마그논의 편광(Polarization) 특성이 운동량 공간에서 어떻게 분포하며, 이것이 실제 수송(Transport) 및 완화(Relaxation) 과정에 어떤 영향을 미치는지에 대한 이론적 이해가 부족했습니다.", "result": "이 논문은 AFM과 알터자성체에서 마그논 편광 텍스처를 이론적으로 분석했습니다. 특히 알터자성체에서 마그논 편광 완화가 극도로 이방성(Anisotropic)을 보인다는 점을 예측했으며, 온도 상승에 따라 마그논 스핀 확산 거리가 오히려 증가하는 반직관적인 현상 등을 설명했습니다.", "implication": "알터자성체를 활용한 마그논 기반 소자 설계 시, 특정 방향으로의 스핀 정보 전달 효율을 극대화할 수 있는 물리적 근거를 제시합니다.", "novelty": "최근 부상하고 있는 알터자성체의 마그논 수송 특성을 구체적인 편광 텍스처와 연결하여 분석했다는 점이 독창적이며, 독자의 알터자성 및 수송 물성 관심사와 일치합니다.", "unresolved": "이론적 예측을 검증하기 위한 알터자성 단결정에서의 정밀한 마그논 분산 및 수송 측정 실험이 필요합니다.", "future_work": "비탄성 중성자 산란이나 RIXS를 이용한 마그논 편광 측정, 그리고 알터자성 박막에서의 스핀 펌핑 실험 등이 유망합니다.", "concepts": [{"term": "마그논 편광 (Magnon polarization)", "why_emerged": "마그논이 가진 스핀 각운동량의 방향과 역학(원형/타원형 회전)을 구분하여 정보를 제어하기 위해 중요해졌습니다.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "스핀 파동, 반강자성 공명, 스핀 각운동량 전달과 관련됩니다."}, {"term": "디아코노프-페렐 완화 (Dyakonov-Perel relaxation)", "why_emerged": "반전 대칭성이 깨진 시스템에서 스핀-궤도 결합에 의한 스핀 완화 기작을 설명하기 위해 제안되었습니다.", "origin": "Mikhail Dyakonov, Vladimir Perel (1970년대)", "connections": "스핀-궤도 결합, 스핀 수명, 래시바 효과와 밀접한 관련이 있습니다."}, {"term": "스핀 확산 거리 (Spin-diffusion length)", "why_emerged": "스핀 정보가 소실되지 않고 물질 내부를 얼마나 멀리 이동할 수 있는지 결정하는 소자 설계의 핵심 지표입니다.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "스핀트로닉스, 스핀 밸브, 마그논 수송과 연결됩니다."}], "english_summary": ["The paper theoretically analyzes magnon polarization textures and transport in antiferromagnets and altermagnets.", "It predicts extremely anisotropic magnon relaxation in altermagnets, identifying key kinetic regimes like Dyakonov-Perel relaxation.", "A counter-intuitive growth of magnon spin-diffusion length with temperature is found for specific magnetic field orientations.", "The results offer insights into using altermagnets for highly directional and efficient magnon-based spintronic applications."]}}, {"title": "Multiorbital Anisotropy and Magnetic Excitations in Trilayer Nickelate Pr4Ni3O10", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2610.09210", "authors": "Ziqiang Guan, Sophia F. R. TenHuisen, Xuefei Guo, et al.", "last_authors": "Mark P. M. Dean, Matteo Mitrano", "summary": "Rare-earth substitution strongly modifies the structure, metallicity, and superconducting behavior of Ruddlesden-Popper (RP) nickelates, but its impact on their magnetic interactions remains unclear. Here, we combine x-ray absorption spectroscopy (XAS) and resonant inelastic x-ray scattering (RIXS) to resolve the multiorbital electronic structure and magnetic excitations of Pr$_4$Ni$_3$O$_{10}$. The absence of an overlapping rare-earth resonance provides direct access to the Ni $L_3$ edge, while polarization-dependent measurements at the Ni $L$- and O $K$-edges resolve distinct planar and out-of-plane Ni-O hybridization channels. Momentum-resolved RIXS reveals dispersive magnetic excitations that soften toward the incommensurate spin-density-wave wave vector. An effective spin-wave analysis yields a sizable intra-trilayer exchange coupling, comparable to the leading in-plane interactions and robust against rare-earth substitution. Our results identify the multilayer architecture, rather than rare-earth substitution alone, as a key control knob of the magnetic interactions in these materials.", "tier": "B_IMPORTANT_CONDMAT", "score": "9", "reason": "RIXS study of nickelate magnetism, directly aligned with interest in strongly correlated systems.", "tags": ["RIXS", "nickelate", "superconduct"], "image": "https://arxiv.org/html/2610.09210v1/figures/main/F1.png", "briefing": {"background": "Ruddlesden-Popper 구조를 가진 니켈레이트(nickelates)는 구리 산화물 초전도체와 유사한 물성을 보여 차세대 고온 초전도체 후보로 주목받고 있습니다. 특히 희토류 원소 치환이나 층상 구조의 변화가 금속성 및 초전도성에 큰 영향을 미치는데, 이 과정에서 자성 상호작용이 어떻게 변하는지 규명하는 것이 핵심적인 과제입니다.", "motivation": "기존 연구들에서는 희토류 원소의 공명 신호가 니켈(Ni)의 신호와 겹쳐 자성 들뜸(magnetic excitations)을 정확히 측정하기 어려웠습니다. 본 연구는 Pr4Ni3O10 시스템을 선택하여 희토류 간섭 없이 Ni L3-edge RIXS 측정을 수행하고, 3층 구조 니켈레이트의 다중 오비탈 전자 구조와 자성 상호작용을 명확히 밝히고자 했습니다.", "result": "RIXS와 XAS 실험을 통해 Pr4Ni3O10의 Ni-O 하이브리드화 채널을 평면 내와 평면 외 성분으로 분리하여 확인했습니다. 특히 모멘텀 분석을 통해 자성 들뜸이 불균일 스핀 밀도 파동(SDW) 벡터를 향해 연화(softening)되는 분산 관계를 관찰했으며, 3층 내부의 층간 교환 결합이 평면 내 결합만큼 강력하다는 것을 정량적으로 산출했습니다.", "implication": "니켈레이트의 자성 특성을 결정하는 데 있어 희토류 원소의 종류보다 '층상 구조의 기하학적 배치' 자체가 훨씬 더 결정적인 역할을 한다는 것을 시사합니다. 이는 향후 니켈레이트 초전도체의 전하 및 자성 질서를 제어하기 위한 설계 원리로 층수 조절이 핵심임을 의미합니다.", "novelty": "실험적으로 접근이 까다로웠던 3층 니켈레이트의 스핀 파동 분산을 RIXS로 직접 관찰했다는 점이 중요합니다. 독자님의 관심사인 RIXS 방법론과 강상관 전자계(니켈레이트) 연구가 결합된 사례로, 특히 다중 오비탈 비등방성과 층간 결합의 세기를 구체적인 수치로 제시한 점이 돋보입니다.", "unresolved": "Pr 치환이 아닌 다른 희토류 치환 시에도 층간 결합의 강도가 완벽하게 일정하게 유지되는지, 그리고 이것이 초전도 전이 온도(Tc)와 어떤 직접적인 상관관계를 갖는지는 추가 연구가 필요합니다.", "future_work": "다양한 층수(n=1, 2, 3...)를 가진 니켈레이트 시리즈에 대한 체계적인 RIXS 연구와, 압력이나 도핑에 따른 자성 들뜸의 변화를 추적하는 실험이 이어질 것으로 예상됩니다.", "concepts": [{"term": "RIXS (Resonant Inelastic X-ray Scattering)", "why_emerged": "물질 내의 전하, 스핀, 오비탈, 격자 들뜸을 특정 원소의 공명 에너지를 이용해 정밀하게 측정하기 위해 개발되었습니다.", "origin": "초록 정보만으로는 특정하기 어려우나 1970년대 이론적 토대 이후 90년대 3세대 방사광 가속기 출현으로 본격화됨.", "connections": "ARPES와 보완적 관계이며, 특히 비탄성 중성자 산란(INS)에 비해 미량의 시료로도 측정이 가능합니다."}, {"term": "Ruddlesden-Popper (RP) Nickelates", "why_emerged": "구리 산화물과 유사한 평면 구조를 가지면서도 원자가 상태가 다른 새로운 초전도 후보 물질군을 탐색하는 과정에서 중요해졌습니다.", "origin": "S. N. Ruddlesden과 P. N. Popper (1950년대)", "connections": "La3Ni2O7, La4Ni3O10 등 최근 발견된 고압 초전도체들과 직접적으로 연결됩니다."}, {"term": "Spin-Density-Wave (SDW)", "why_emerged": "금속 내에서 전자 간의 상호작용으로 인해 스핀 밀도가 공간적으로 주기적인 변조를 일으키는 현상을 설명하기 위해 도입되었습니다.", "origin": "Albert Overhauser (1960년대)", "connections": "철 기반 초전도체 및 유기 도체 등에서 초전도와 경쟁하거나 공존하는 질서로 자주 나타납니다."}, {"term": "Ni-O Hybridization", "why_emerged": "전이 금속 산화물의 전자 구조와 전도성, 자성을 이해하기 위해 금속의 d-오비탈과 산소의 p-오비탈 간의 결합 강도를 파악하는 것이 필수적입니다.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "Zaanen-Sawatzky-Allen (ZSA) 분류법에 따라 물질의 전하 이동 갭 특성을 결정하는 핵심 요소입니다."}], "english_summary": ["Measured Ni L3-edge RIXS on trilayer nickelate Pr4Ni3O10 to resolve magnetic excitations without rare-earth interference.", "Identified significant intra-trilayer exchange coupling comparable to in-plane interactions.", "Found that the multilayer architecture is a more dominant factor for magnetism than rare-earth substitution.", "Observed dispersive magnetic modes softening toward the incommensurate spin-density-wave vector."]}}, {"title": "Peierls Transition and Magnetism in a Dirac Semimetal: CaMnBi2", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2511.03721", "authors": "Aashish Sapkota, Niraj Aryal, Xiao Hu, et al.", "last_authors": "John M. Tranquada, Igor A. Zaliznyak", "summary": "Dirac semimetals of the form $A$Mn$X_2$ ($A =$ alkaline-earth or divalent rare earth; $X =$ Bi, Sb) host conducting square-net Dirac-electron layers of $X$ atoms interleaved with antiferromagnetic Mn$X$ layers. Hypervalent pnictogen square nets have long been predicted to host an electronically driven Peierls instability, whereas low-temperature anomalies in CaMnBi$_2$ near $T^{*}\\sim 50$~K have previously been discussed in terms of possible magnetic canting, TRS breaking, and a resulting Weyl-semimetal (WSM) state. Here we use polarized and unpolarized neutron diffraction, x-ray diffraction, and density functional theory (DFT) to investigate this transition in single-crystal CaMnBi$_2$. We observe a coupled structural/magnetic symmetry-lowering transition at $T^{*}=46(2)$ K from a tetragonal lattice with C-type antiferromagnetism to an orthorhombic phase with unit-cell doubling along the $c$ axis, minimal impact on magnetism, and no measurable uniform spin canting ($\\lesssim 2^\\circ$). Superlattice peak intensities and the lattice distortion reveal a continuous second-order transition governed by a single primary order parameter. The refined displacement pattern corresponds to a zigzag bond-order-wave (BOW) modulation of in-plane Bi--Bi bonds, providing direct diffraction evidence for a Peierls-type instability of the Dirac-electron Bi layer anticipated by Hoffmann and co-workers [W. Tremel and R. Hoffmann, J. Am. Chem. Soc. 109, 124 (1987); G. A. Papoian and R. Hoffmann, Angew. Chem. Int. Ed. 39, 2408 (2000)]. These results identify the $T^{*}$ anomaly as an intrinsic Dirac-electron-driven Peierls/BOW transition of the Bi square net.", "tier": "B_IMPORTANT_CONDMAT", "score": "9", "reason": "Strong experimental evidence for electronic Peierls transition in a Dirac semimetal material.", "tags": ["experiment", "Diracsemimetal", "CDW", "neutrondiffraction"], "image": "https://arxiv.org/html/2511.03721v2/Fig1abc_with_Peierls_de.png", "briefing": {"background": "CaMnBi2와 같은 AMnX2 계열 물질은 Mn 층의 반강자성과 Bi 층의 디락(Dirac) 페르미온이 공존하는 시스템입니다. 이들은 위상학적 특성과 자성이 결합된 흥미로운 물성을 보여주는데, 특히 저온에서 나타나는 상전이의 원인이 스핀 캔팅에 의한 Weyl 세미메탈 상태인지 혹은 다른 구조적 요인인지에 대한 논란이 있었습니다.", "motivation": "CaMnBi2에서 약 50K 부근에 나타나는 이상 현상(anomaly)의 근원을 명확히 밝히고자 했습니다. 기존에는 이를 자성적인 변화로 해석하려는 시도가 많았으나, 본 연구는 Bi 사각 격자(square net) 자체의 전자적 불안정성에 주목하여 정밀 회절 실험을 수행했습니다.", "result": "중성자 및 X선 회절 실험을 통해 46K에서 정방정계(tetragonal)에서 사방정계(orthorhombic)로의 구조 상전이를 관찰했습니다. 이는 Bi 층의 Bi-Bi 결합이 지그재그 형태로 변조되는 '결합 차수 파동(Bond-Order-Wave, BOW)' 때문임을 밝혀냈으며, 자성 구조는 큰 변화가 없고 스핀 캔팅도 거의 없음을 증명했습니다.", "implication": "이 물질의 저온 전이가 자성 기반의 Weyl 세미메탈 전이가 아니라, 디락 전자가 주도하는 'Peierls 유형'의 구조적 전이임을 확정지었습니다. 이는 2차원 사각 격자 시스템에서 전자-격자 상호작용이 디락 밴드 구조를 어떻게 변형시키는지를 보여주는 전형적인 사례가 됩니다.", "novelty": "1987년 로알드 호프만(Roald Hoffmann) 등이 예측했던 하이퍼벌런트(hypervalent) 사각 격자의 Peierls 불안정성을 디락 세미메탈 실물질에서 직접적인 회절 데이터로 입증했다는 점이 매우 중요합니다. 독자님의 관심사인 Dirac/Weyl 시스템 및 CDW(전하 밀도 파동)와 직접 연결되는 결과입니다.", "unresolved": "이 Peierls 전이가 디락 노드(node)의 위치나 위상학적 불변량에 구체적으로 어떤 양적 변화를 주는지, 그리고 수송 특성에서의 비정상적인 거동과 어떻게 정량적으로 연결되는지는 더 연구되어야 합니다.", "future_work": "압력이나 화학적 치환을 통해 Peierls 전이 온도(T*)를 조절하면서 위상학적 특성 변화를 ARPES 등으로 직접 관찰하는 연구가 유망할 것으로 보입니다.", "concepts": [{"term": "Peierls instability", "why_emerged": "1차원 혹은 유사 1차원 금속 체계에서 전자-격자 결합으로 인해 에너지가 낮아지며 격자 왜곡과 에너지 갭이 발생하는 현상을 설명하기 위해 제안되었습니다.", "origin": "Rudolf Peierls (1930년대)", "connections": "CDW(전하 밀도 파동), SSH 모델, 폴라론 등과 밀접한 관련이 있습니다."}, {"term": "Dirac semimetal", "why_emerged": "그래핀처럼 밴드 구조가 선형적으로 교차하는 3차원 물질에서 나타나는 독특한 양자 수송 특성을 연구하기 위해 등장했습니다.", "origin": "초록 정보만으로는 특정하기 어려우나 2010년대 초반 Na3Bi, Cd3As2 등에서 확립됨.", "connections": "Weyl semimetal, 위상 절연체, 질량이 없는 페르미온과 연결됩니다."}, {"term": "Bond-order-wave (BOW)", "why_emerged": "전하 밀도가 아닌 원자 간의 결합 강도(결합 차수)가 주기적으로 변하는 질서를 설명하기 위해 도입되었습니다.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "CDW의 일종으로 간주될 수 있으며, 주로 하이퍼벌런트 화합물이나 공액 고분자에서 논의됩니다."}, {"term": "Neutron diffraction", "why_emerged": "결정 구조뿐만 아니라 원자의 자기 모먼트 배열(자성 구조)을 원자 단위에서 직접 관찰하기 위해 필수적인 도구입니다.", "origin": "Clifford Shull 및 Bertram Brockhouse (1940-50년대)", "connections": "X선 회절과 상호보완적이며 자성 재료 연구의 핵심입니다."}], "english_summary": ["Identified the 46K transition in CaMnBi2 as a Dirac-electron-driven Peierls/BOW instability rather than magnetic canting.", "Used neutron and X-ray diffraction to observe a structural symmetry-lowering to an orthorhombic phase with unit-cell doubling.", "Directly evidenced the zigzag bond-order-wave modulation in the hypervalent Bi square nets.", "Clarified that the magnetic structure remains largely unchanged through the transition, ruling out a Weyl semimetal state from spin canting."]}}, {"title": "Realization of quantum spin Hall insulator superlattice with emergent multigap-like helical edge states (Advanced Materials, e75159 (2026))", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2609.25732", "authors": "Hui Guo, Xianghe Han, Fang Qin, et al.", "last_authors": "Hui Chen, Hong-Jun Gao", "summary": "The functional quantum spin Hall insulators (QSHI), protected by time-reversal symmetry against single-particle backscattering, hold great promise for dissipationless quantum electronics. Realization of QSHI with gapped helical edge states, which would enable deterministic on/off switching of the edge-channel conductance, is a key requirement for programmable topological circuits. Here, we report realization of superlattice-modulated QSHI HfTe5 hosting emergent multigap-like helical edge states. Using scanning tunneling microscopy and spectroscopy, we identify a reconstruction-induced periodic superlattice modulation in epitaxial monolayer HfTe5 and directly observe multiple gap-like features in the edge channel, accompanied by a series of sharp peaks in the density of states. Combined with theoretical modelling, we attribute the observed edge gap to the finite-width coupling between the two edges significantly enhanced by the superlattice modulation, whereas the sharp peaks are the manifestations of mini-gaps opening at the reduced Brillouin zone boundaries by the periodic modulation of spin-orbit coupling. Notably, these sharp peaks exhibit clear Zeeman splitting under magnetic fields, consistent with the helical nature of the topological edge states. Our results establish a viable route to engineering gapped helical edge states in QSHI and provide a promising platform for topological devices with desired on/off switchability.", "tier": "B_IMPORTANT_CONDMAT", "score": "9", "reason": "Direct interest in topological materials and STM/STS investigations of helical edge states.; demoted from A: broad CM, not direct user/project hit", "tags": ["topological", "STM", "STS"], "image": "https://arxiv.org/static/browse/0.3.4/images/arxiv-logo-fb.png", "briefing": {"background": "양자 스핀 홀 절연체(QSHI)는 시간 반전 대칭성에 의해 보호되는 나선형 가장자리 상태(helical edge states)를 가지며, 에너지 손실 없는 전자 소자 구현을 위한 핵심 물질입니다. 하지만 실제 소자 응용을 위해서는 이 가장자리 상태의 전도도를 제어할 수 있는 'on/off' 스위칭 기능(에너지 갭 생성)이 필요합니다.", "motivation": "에피택셜 단층 HfTe5에서 나타나는 초격자(superlattice) 구조를 이용하여 나선형 가장자리 상태에 인위적인 갭을 형성하고, 이를 통해 위상 소자로의 활용 가능성을 탐구하고자 했습니다.", "result": "STM/STS 연구를 통해 HfTe5 단층에서 재구조화에 의한 주기적인 초격자 변조를 발견했습니다. 가장자리 채널에서 다중 갭(multigap-like) 특징과 상태 밀도의 급격한 피크들을 관찰했으며, 이는 초격자에 의한 가장자리 간 커플링 강화 및 스핀-궤도 결합(SOC) 변조에 의한 미니 갭(mini-gap) 형성 때문임을 규명했습니다. 또한 자기장 하에서 Zeeman 분리를 확인하여 나선형 특성을 입증했습니다.", "implication": "초격자 엔지니어링이 QSHI의 가장자리 상태를 조절할 수 있는 유효한 수단임을 보여주었습니다. 이는 프로그래밍 가능한 위상 회로를 설계할 때, 물리적인 가공 없이도 초격자 구조를 통해 전도 채널을 제어할 수 있는 경로를 제시합니다.", "novelty": "단순한 QSHI 관찰을 넘어, 초격자를 이용해 위상학적 보호를 받는 가장자리 상태에 '인위적인 갭'을 유도하고 이를 STM으로 정밀하게 시각화했다는 점이 핵심입니다. 독자님의 STM/STS 및 HfTe5/위상 물질에 대한 관심사에 완벽히 부합합니다.", "unresolved": "초격자의 주기를 원자 수준에서 더 정밀하게 제어하여 갭의 크기를 실온 작동 수준까지 키울 수 있을지, 그리고 실제 소자 제작 시 전극과의 계면 효과는 어떠할지에 대한 연구가 남았습니다.", "future_work": "다양한 기판과의 격자 부정합을 이용한 초격자 주기 조절 실험 및 게이트 전압을 이용한 가장자리 상태 전도도 스위칭 시연이 기대됩니다.", "concepts": [{"term": "Quantum Spin Hall Insulator (QSHI)", "why_emerged": "2차원 물질에서 외부 자기장 없이도 스핀-궤도 결합에 의해 나타나는 위상 절연 상태를 설명하기 위해 등장했습니다.", "origin": "C. L. Kane 및 E. J. Mele (2005년)", "connections": "2D 위상 절연체, 스핀 홀 효과, 수송 특성 보호 등과 연결됩니다."}, {"term": "Helical edge states", "why_emerged": "QSHI의 가장자리에서 스핀 방향과 운동 방향이 결합되어 서로 반대 방향으로 흐르는 한 쌍의 전도 채널을 묘사합니다.", "origin": "C. L. Kane 및 E. J. Mele (2005년)", "connections": "산란에 강한 전도성, Majorana 페르미온 형성의 토대가 됩니다."}, {"term": "Superlattice modulation", "why_emerged": "물질의 원래 격자 주기보다 큰 새로운 주기를 도입하여 전자 밴드 구조를 변형(Band folding 등)시키기 위해 사용됩니다.", "origin": "Leo Esaki 및 Raphael Tsu (1970년대)", "connections": "모아레(Moiré) 패턴, 인공 결정, 밴드 엔지니어링과 관련이 깊습니다."}, {"term": "Scanning Tunneling Spectroscopy (STS)", "why_emerged": "표면의 원자 단위 국소 상태 밀도(LDOS)를 에너지의 함수로 정밀하게 측정하여 에너지 갭이나 피크를 확인하기 위해 필요합니다.", "origin": "Gerd Binnig 및 Heinrich Rohrer (1981년 STM 발명 이후)", "connections": "STM, dI/dV 매핑, 초전도 갭 측정 등의 핵심 도구입니다."}], "english_summary": ["Realized a superlattice-modulated QSHI in epitaxial monolayer HfTe5.", "Observed emergent multigap-like features in helical edge states using STM and STS.", "Attributed the edge gaps to enhanced inter-edge coupling and mini-gaps from periodic spin-orbit coupling modulation.", "Demonstrated Zeeman splitting of edge state peaks, confirming their topological and helical nature."]}}, {"title": "Single-stripe magnetic order and bilayer spin dynamics in single-crystalline La3Ni2O7", "journal": "Nature_Materials", "source": "Gemini", "link": "https://www.nature.com/articles/s41563-026-02768-3", "authors": "Lixing Chen, Enkang Zhang, Yiqing Hao, et al.", "last_authors": "Qisi Wang, Jun Zhao", "summary": "Momentum-resolved neutron scattering of a mosaic of single crystals of La3Ni2O7, a parent compound of nickelate superconductors, is reported. The magnetic behaviour of these nickelate crystals is distinct from that of cuprates and furthers our understanding of the origin of superconductivity in this class of materials.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Important neutron scattering study on the magnetic order of a new nickelate superconductor.", "tags": ["nickelate", "superconductivity", "neutronscattering"], "image": "https://media.springernature.com/m685/springer-static/image/art%3A10.1038%2Fs41563-026-02768-3/MediaObjects/41563_2026_2768_Fig1_HTML.png", "briefing": {"background": "최근 La3Ni2O7에서 발견된 고압 하 고온 초전도 현상은 구리 산화물(cuprates) 이후 새로운 고온 초전도체 후보로 주목받고 있습니다. 이 물질의 물리적 기원을 이해하기 위해서는 초전도의 모체 화합물에서 나타나는 자기적 질서와 스핀 동역학을 파악하는 것이 필수적입니다.", "motivation": "La3Ni2O7의 초전도 메커니즘을 규명하기 위해 필수적인 정보인 모체 화합물의 자기 구조와 스핀 여기(excitation)를 중성자 산란 실험을 통해 직접 관측하고자 하였습니다.", "result": "단결정 모자이크 시료를 이용한 중성자 산란 실험을 통해 La3Ni2O7이 '단일 스트라이프(single-stripe)' 자성 정렬을 가짐을 확인했습니다. 또한, 이 물질의 스핀 동역학이 구리 산화물과는 다른 독특한 이중층(bilayer) 특성을 보인다는 점을 밝혀냈습니다.", "implication": "니켈레이트 초전도체의 자기적 기원이 구리 산화물과는 차별화되는 이중층 구조 및 특정 자성 정렬에 기반하고 있음을 시사하며, 이는 초전도 메커니즘 모델링에 중요한 제약 조건을 제공합니다.", "novelty": "고품질 단결정 시료를 사용하여 운동량 분해 중성자 산란(momentum-resolved neutron scattering) 데이터를 확보한 매우 중요한 성과입니다. 비정상 초전도체 연구를 중요하게 여기는 독자 프로필에 매우 부합하는 결과입니다.", "unresolved": "초전도가 나타나는 고압 환경에서의 자기적 상태 변화와 스핀 동역학의 변형 여부는 아직 실험적으로 직접 확인되지 않았습니다.", "future_work": "고압 하에서의 중성자 산란 실험 또는 RIXS를 통한 자성 측정, 그리고 산소 결함이나 도핑에 따른 자성 상태 변화 연구가 기대됩니다.", "concepts": [{"term": "Single-stripe magnetic order", "why_emerged": "니켈레이트나 철 기반 초전도체에서 나타나는 특유의 반강자성 정렬 패턴을 설명하기 위해 도입되었습니다.", "origin": "초록 정보만으로는 특정하기 어려우나, 전이금속 산화물의 자기 구조 연구에서 유래했습니다.", "connections": "철 기반 초전도체의 띠 모양(stripe) 자성, 구리 산화물의 스핀 밀도 파동(SDW)과 비교됩니다."}, {"term": "Bilayer spin dynamics", "why_emerged": "La3Ni2O7과 같이 두 개의 Ni-O 층이 강하게 결합된 결정 구조에서 나타나는 스핀 상관관계를 설명하기 위해 필요합니다.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "이중층 구리 산화물의 인터레이어 커플링(interlayer coupling) 및 결합/반결합 밴드 동역학."}], "english_summary": ["Reported the first momentum-resolved neutron scattering on single-crystalline La3Ni2O7.", "Identified a single-stripe magnetic order in the parent compound of this nickelate superconductor.", "Revealed distinct bilayer spin dynamics that differ significantly from c
