자들이 포논 변위 공간에서 Berry curvature에 의해 유도된 Berry 위상을 획득하며, 이를 통해 동적인 궤도 각운동량이 유도됨을 이론적으로 증명했습니다.", "implication": "포논을 이용해 전자의 궤도 자유도를 제어할 수 있는 가능성을 제시하며, 이는 향후 '포노닉스(phononics)'를 이용한 새로운 전자 소자 설계의 토대가 될 수 있습니다.", "novelty": "포논 변위 공간에서의 Berry curvature라는 개념을 도입하여, 격자 진동이 전자 궤도 물리량에 직접적인 위상적 영향을 미침을 보였습니다. 독자의 관심 분야인 Berry curvature 및 궤도 물리학과 직접 연결됩니다.", "unresolved": "실제 실험적으로 이 유도된 OAM을 직접 측정하는 방법론은 여전히 도전 과제입니다.", "future_work": "실제 특정 물질 시스템에서 이 효과를 검증하기 위한 구체적인 수치 계산 및 광학적 제어 실험이 필요합니다.", "concepts": [{"term": "Berry curvature in phonon space", "why_emerged": "격자 변위가 파라미터 공간을 형성할 때, 전자 파동함수의 기하학적 위상을 기술하기 위해 필요합니다.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "전자 시스템의 Berry curvature, 위상 절연체 이론과 평행한 물리."}, {"term": "Dynamical OAM", "why_emerged": "정적인 상태가 아닌 격자 진동에 의해 유도되는 일시적이고 동적인 궤도 각운동량의 중요성 때문입니다.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "스핀-궤도 결합(SOC), 궤도 홀 효과(OHE)."}], "english_summary": ["The authors show that circularly polarized phonons dynamically induce orbital angular momentum (OAM) in electrons.", "The effect is derived from the adiabatic evolution of electrons acquiring a geometric Berry phase in phonon displacement space.", "This framework bridges lattice dynamics and orbital electronic properties through Berry curvature.", "The research highlights a potential mechanism for controlling electronic degrees of freedom using phonon engineering."]}}, {"title": "Fermi-Surface-Sheet Dependent Electron-Phonon Coupling in a Borocarbide Superconductor YNi2B2C", "journal": "PRL_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/m6r6-vpdg", "authors": "Taichi Terashima, Hiroyuki Takeya, Hisatomo Harima", "last_authors": "Hiroyuki Takeya, Hisatomo Harima", "summary": "We performed de Haas–van Alphen (dHvA) oscillation measurements and band-structure calculations for ${\\text{YNi}}_{2}{\\mathrm{B}}_{2}\\mathrm{C}$. Our improved band structure successfully explained the origins of the large dHvA frequencies $β$ and $ζ$, which were inexplicable in previous works. By co…", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Electronic structure and electron-phonon coupling in a superconductor, using dHvA.", "tags": ["superconductivity", "electronic_structure", "dHvA", "YNi2B2C", "phonons"], "image": "", "briefing": {"background": "보로카바이드 초전도체 YNi2B2C는 전자-포논 결합이 초전도성을 결정하는 전형적인 시스템으로, 페르미 면의 복잡한 구조와 초전도 간극의 비등방성 이해가 핵심입니다.", "motivation": "기존 연구에서 설명되지 않았던 대형 dHvA 주파수(β, ζ)의 기원을 명확히 하고, 특정 페르미 면 성분에서의 전자-포논 결합 강도를 분석하고자 합니다.", "result": "개선된 밴드 구조 계산을 통해 β와 ζ 주파수의 기원을 규명하였으며, 페르미 면의 특정 시트(sheet)에 따라 전자-포논 결합이 다르게 나타남을 확인했습니다.", "implication": "전자 구조 모델의 정밀화가 다중 밴드 초전도체의 물리적 성질을 이해하는 데 결정적임을 시사합니다.", "novelty": "기존에 풀리지 않던 페르미 면의 dHvA 데이터를 정교하게 해석함으로써, 전자-포논 결합의 이질성을 구체화했습니다.", "unresolved": "이러한 시트 의존적 결합이 구체적으로 특정 초전도 특성(예: 간극의 크기 차이)을 어떻게 정량적으로 결정하는지는 추가 논의가 필요합니다.", "future_work": "이 결과를 바탕으로 초전도 Gap 측정(예: ARPES, STM)을 통한 검증이 필요합니다.", "concepts": [{"term": "dHvA (de Haas-van Alphen) oscillation", "why_emerged": "강한 자기장 하에서 페르미 면의 궤도 운동을 통해 밴드 구조를 실험적으로 측정하기 위해 도입됨.", "origin": "Willem de Haas, Pieter van Alphen (1930년대)", "connections": "페르미 면 매핑, Quantum oscillations."}, {"term": "Electron-phonon coupling", "why_emerged": "금속 내 전자와 격자의 상호작용이 전도성과 초전도성을 결정하는 본질적 메커니즘이기 때문입니다.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "BCS 이론, Eliashberg 이론."}], "english_summary": ["The authors performed dHvA measurements and refined band calculations for YNi2B2C.", "Improved band structure successfully explains the previously anomalous dHvA frequencies β and ζ.", "The study reveals sheet-dependent electron-phonon coupling strength in the borocarbide superconductor.", "The results clarify the electronic structure underlying the superconducting properties of YNi2B2C."]}}, {"title": "Orbital Accumulation Induced by Chiral Phonons", "journal": "PRL_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/2yqn-cyzg", "authors": "Tetsuya Sato, Takeo Kato, Aurelien Manchon", "last_authors": "Takeo Kato, Aurelien Manchon", "summary": "We theoretically investigate orbital accumulation driven by chiral phonons via orbital-dependent electron-lattice coupling. We derive a formula for the orbital accumulation induced by classical lattice dynamics or nonequilibrium phonons, emphasizing the rectified second-order response of the orbital…", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Theory on chiral phonons inducing orbital accumulation, relevant to electronic properties.", "tags": ["theory", "phonons", "orbitalaccumulation", "electron-latticecoupling", "electronicproperties"], "image": "", "briefing": {"background": "키랄 포논은 격자 진동이 특정 회전 대칭성을 깨며 나타나는 현상으로, 전자 시스템의 궤도 자유도와의 상호작용을 통한 새로운 수송 현상 연구의 주제가 되고 있습니다.", "motivation": "키랄 포논이 전자-격자 결합을 통해 궤도 축적(orbital accumulation) 현상을 어떻게 유도하는지 이론적으로 기술하고자 합니다.", "result": "고전적 격자 동역학 또는 비평형 포논에 의해 유도된 궤도 축적 수식을 도출하였으며, 이는 2차 응답(second-order response)으로 나타남을 보였습니다.", "implication": "포논의 키랄성을 이용해 전자의 궤도 상태를 효율적으로 제어할 수 있는 '궤도트로닉스(orbitronics)'의 새로운 경로를 제공합니다.", "novelty": "키랄 포논에 의한 궤도 축적 효과를 비평형 통계역학적 관점에서 공식화했습니다. 궤도 자유도 제어에 관심이 있는 독자에게 유용한 모델입니다.", "unresolved": "이 효과가 실험적으로 관측 가능한 크기인지, 그리고 어떤 물질에서 가장 극대화될 수 있는지는 미지수입니다.", "future_work": "키랄 포논과 궤도 축적 사이의 관계를 검증하기 위한 초고속 분광학 실험 제안이 기대됩니다.", "concepts": [{"term": "Chiral phonons", "why_emerged": "격자 내 원자들의 회전 운동(angular momentum)을 동반하는 진동 모드를 기술하기 위해 필요합니다.", "origin": "최근 10년 내 활발히 연구된 개념", "connections": "Phonon angular momentum, Topological phononics."}, {"term": "Orbital accumulation", "why_emerged": "시스템의 가장자리나 특정 위치에 궤도 각운동량이 축적되는 현상을 다루기 위해 필요합니다.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "Spin accumulation, Spin-Hall effect."}], "english_summary": ["The paper theoretically investigates orbital accumulation induced by chiral phonons.", "A formal derivation is provided for the orbital accumulation arising from electron-lattice coupling.", "The effect is characterized as a rectified second-order response to lattice dynamics.", "This work contributes to the development of phonon-driven orbitronics."]}}, {"title": "Spinon Band Flattening by Its Emergent Gauge Field in a Quantum Kagome Ice", "journal": "PRL_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/1vmv-zdqt", "authors": "Masafumi Udagawa, Roderich Moessner", "last_authors": "Masafumi Udagawa, Roderich Moessner", "summary": "Fractional excitations provide a key to identifying sought-after topological quantum spin liquid states in realistic materials. Their single-particle dynamics already presents a challenging many-body problem on account of the coupling to their emergent gauge field. Here, we study the spinon excitati…", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Theory on kagome lattice spin liquid and topological properties, highly relevant.", "tags": ["kagome", "spin_liquid", "topological", "theory"], "image": "", "briefing": {"background": "양자 스핀 액체(Quantum Spin Liquid, QSL)는 기하학적 좌절(geometrical frustration)로 인해 저온에서도 자기적 질서가 형성되지 않는 물질 상태입니다. Kagome 격자는 이러한 상태를 구현하는 대표적인 플랫폼으로, 스피논(spinon)과 같은 분수화된(fractionalized) 여기 상태가 중요한 물리적 특징입니다.", "motivation": "스피논은 창발적 게이지 필드(emergent gauge field)와 강하게 결합되어 있는데, 이러한 상호작용이 스피논의 단일 입자 동역학을 어떻게 변화시키는지 이론적으로 규명하고자 했습니다.", "result": "스피논이 창발적 게이지 필드와 결합할 때 밴드가 평탄화(band flattening)되는 현상을 확인했습니다. 이는 스피논의 유효 질량이 무거워짐을 의미합니다.", "implication": "QSL 상태의 열역학적 및 동역학적 특성을 이해하는 데 있어 게이지 필드 효과가 결정적임을 보여주며, 향후 실험적인 스펙트럼 해석의 중요한 지표가 될 것입니다.", "novelty": "Kagome 얼음 상태에서의 스피논 밴드 평탄화 메커니즘을 게이지 필드와의 결합으로 이론적으로 명확히 설명한 것이 특징입니다. 이는 Kagome 금속 연구자들에게 스핀 여기 스펙트럼 분석의 기초 이론을 제공합니다.", "unresolved": "실제 실험에서 이러한 스피논 평탄화가 유도하는 구체적인 분광학적 신호(ARPES나 중성자 산란 등)가 명확히 분리되어 관측될지는 미지수입니다.", "future_work": "실제 Kagome 물질에서의 중성자 산란 및 공명 비탄성 X선 산란(RIXS) 데이터와 본 이론의 정량적 비교가 필요합니다.", "concepts": [{"term": "스피논(Spinon)", "why_emerged": "스핀-1/2 전자가 분리되어 발생하는 S=1/2의 중성 준입자입니다.", "origin": "Anderson(1973)의 공명 원자가 결합 상태 제안에서 유래.", "connections": "분수화된 여기(Fractionalized excitations), 스핀 액체 상태."}, {"term": "창발적 게이지 필드", "why_emerged": "복잡한 강상관계 시스템에서 저에너지 물리 상태를 설명하기 위해 도입된 수학적 장입니다.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "상호작용하는 다체 문제, 양자 스핀 액체."}], "english_summary": ["The paper investigates spinon dynamics in quantum kagome ice systems.", "It demonstrates that coupling to an emergent gauge field causes significant band flattening of spinons.", "This provides a microscopic mechanism for the heavy effective mass of spinon excitations.", "The findings offer crucial theoretical insights for interpreting neutron scattering data in kagome quantum spin liquids."]}}, {"title": "Third-Order Nonlinear Transport in a Percolative Two-Dimensional Superconductor", "journal": "PRL_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/jcrm-953w", "authors": "Wenjun Liu, Chenghe Wang, Xiubin Li, et al.", "last_authors": "Xiao-Xiao Zhang, Jing Li", "summary": "Percolative superconductivity frequently arises in two-dimensional van der Waals materials due to reduced dimensionality, enhanced quantum fluctuations, and complex electron-phonon interactions, providing a unique platform where normal electrons coexist with Cooper pairs. We report the observation o…", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Relevant: 2D van der Waals materials, unconventional superconductivity, transport, electron-phonon.", "tags": ["superconductivity", "vanderWaals", "2Dmaterials", "transport", "electronphonon"], "image": "", "briefing": {"background": "2D van der Waals(vdW) 물질은 낮은 차원성과 강한 양자 요동으로 인해 국소적인 초전도 섬들이 형성되는 '침투형(percolative) 초전도성'이 자주 보고됩니다. 이는 정상 상태 전자와 쿠퍼 쌍이 공존하는 독특한 상태입니다.", "motivation": "이러한 불균일한 초전도 상태에서 전자-포논 상호작용과 차원성이 전하 수송 특성에 어떤 영향을 미치는지, 특히 비선형 수송 현상을 통해 이해하고자 했습니다.", "result": "침투형 2D 초전도체에서 3차 비선형 수송(third-order nonlinear transport) 현상을 성공적으로 관측했습니다.", "implication": "비선형 전도 측정이 국소적인 초전도 질서 매개변수의 공간적 불균일성과 초전도 전이 과정을 조사하는 강력한 도구가 될 수 있음을 시사합니다.", "novelty": "전통적인 선형 저항 측정 대신 고차 비선형 수송을 분석함으로써, 복잡한 vdW 물질 내부의 초전도 상태를 탐침하는 새로운 민감한 방법을 제시했습니다.", "unresolved": "시료 내부의 구체적인 불균일성 분포(구조적 결함 vs. 화학적 불균일성)가 비선형 응답에 기여하는 기여도를 분리하기 어렵습니다.", "future_work": "다른 vdW 초전도체 시스템으로 이 측정 기법을 확장하여 초전도-절연체 전이와 같은 위상 전이 연구에 적용이 필요합니다.", "concepts": [{"term": "침투형 초전도성(Percolative superconductivity)", "why_emerged": "2D 물질에서 균일한 초전도가 형성되기 전, 고립된 초전도 영역들이 서로 연결되며 나타나는 물리입니다.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "양자 요동, 상전이 이론, 2D van der Waals 물질."}, {"term": "비선형 수송(Nonlinear transport)", "why_emerged": "전압과 전류 간의 선형 관계(Ohm's law)를 넘어선 고차항이 물질의 비대칭성이나 다체 상호작용을 반영하기 때문에 필요합니다.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "위상 반금속, 베리 곡률, 비등방성."}], "english_summary": ["The study examines percolative superconductivity in 2D van der Waals materials.", "Researchers observed third-order nonlinear transport behavior in these systems.", "Nonlinear transport serves as a sensitive probe for the coexisting normal and superconducting phases.", "The findings offer a new method to study electronic heterogeneity in low-dimensional superconductors."]}}, {"title": "Toward an exact quantum many-body treatment of Kondo correlation in magnetic impurities", "journal": "Science", "source": "Gemini", "link": "https://doi.org/10.1126/science.adq7402", "authors": "Tianyu Zhu, Linqing Peng, Huanchen Zhai, Zhi-Hao Cui, Runze Chi, Garnet Kin-Lic Chan", "last_authors": "Runze Chi, Garnet Kin-Lic Chan", "summary": "The Kondo effect is a prototypical quantum phenomenon arising from the interaction between localized electrons in a magnetic impurity and itinerant electrons in a metallic host. Although this phenomenon has served as the testing ground for quantum many-body methods for decades, the precise description of Kondo physics with material specificity remains challenging. Here, we present a systematic ab initio approach to converge toward an exact zero-temperature electronic treatment of Kondo correlations. Across a series of 3d transition metals, we extracted Kondo temperatures matching subtle experimental trends, with accuracy exceeding that of standard models. We further obtained microscopic insight into the origin of these trends. More broadly, we demonstrate the possibility to start from fully ab initio many-body simulations and push toward the realm of converged predictions.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Ab initio many-body treatment of Kondo effect in 3d transition metals; strongly correlated electrons.", "tags": ["theory", "stronglycorrelatedelectronsystems", "Kondo", "electronicstructure", "magneticimpurities"], "image": "", "briefing": {"background": "Kondo 효과는 자기 불순물과 금속 호스트의 전도 전자 사이의 상호작용으로, 강상관계 물리학의 표준 모델입니다. 그러나 실제 복잡한 물질에서의 Kondo 온도(Tk)를 ab initio 계산으로 예측하는 것은 다체 물리적 어려움으로 인해 매우 도전적이었습니다.", "motivation": "기존의 근사 모델을 넘어, 3d 전이 금속 불순물의 Kondo 상관관계를 계산 가능한 수준의 엄밀한 ab initio 다체 방법론으로 구현하고자 했습니다.", "result": "3d 전이 금속 시리즈 전체에 대해 표준 모델보다 높은 정확도로 Kondo 온도를 예측하는 새로운 계산 프레임워크를 개발했습니다.", "implication": "강상관계 시스템에서 전자 구조 계산의 정확도를 크게 향상시켰으며, 미시적인 상관관계 기원을 규명하는 데 기여합니다.", "novelty": "DFT나 모델 기반 접근보다 진일보한 다체 이론을 실물질 계산에 성공적으로 접목했습니다. 이는 전자 구조 연구자들이 강상관계 물질을 다룰 때 사용할 수 있는 강력한 새로운 분석 도구입니다.", "unresolved": "계산 비용이 여전히 높으며, 더 복잡한 격자 시스템이나 대규모 앙상블로 확장하는 데 한계가 존재합니다.", "future_work": "이 계산 기법을 AV3Sb5와 같은 Kagome 금속 내의 상관관계 분석이나 다른 자기 불순물 도핑 시스템에 적용하여 검증할 계획입니다.", "concepts": [{"term": "Kondo 효과", "why_emerged": "금속 내 자성 불순물이 저온에서 전도 전자에 의해 가려지며 나타나는 전기 저항의 최소값 현상입니다.", "origin": "Kondo(1964).", "connections": "강상관계 전자계, Heavy Fermion, 불순물 물리."}, {"term": "Ab initio 다체 처리", "why_emerged": "모델 파라미터에 의존하지 않고 물질의 화학적/구조적 정보를 직접 반영하여 정확한 물성을 예측하기 위해 필요합니다.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "DFT+DMFT, 양자화학, 강상관계 계산."}], "english_summary": ["The paper introduces a systematic ab initio approach to calculate Kondo correlations.", "It accurately reproduces Kondo temperatures in 3d transition metals across different host environments.", "The method provides microscopic insights into the origin of magnetic impurity correlations.", "This approach advances the predictive capability of many-body electronic structure simulations."]}}, {"title": "Mid-infrared long-range surface polaritons in two-dimensional van der Waals materials", "journal": "Science_Advances", "source": "Gemini", "link": "https://doi.org/10.1126/sciadv.aed2198", "authors": "Mingsong Wang, Shixiong Yin, Saroj Chand, et al.", "last_authors": "Gabriele Grosso, Andrea Alù", "summary": "The discovery of graphene plasmons (GPs) and hyperbolic phonon polaritons (HPhPs) in two-dimensional (2D) van der Waals (vdW) materials has enabled extreme light confinement and enhanced light-matter interactions, holding the promise for miniaturized mid-infrared (mid-IR) photonic devices. However, GPs and HPhPs suffer from limited propagation lengths, hindering their impact in various applications. Here, we demonstrate long-range surface polaritons (LRSPs) in 2D vdW materials, featuring much longer propagation lengths and faster group velocities, which may offer complementary opportunities for high-speed on-chip photonic applications in the mid-IR regime. The demonstrated LRSPs are supported by deep-subwavelength heterostructures consisting of a hexagonal boron nitride (h-BN) flake, a high-index germanium (Ge) layer, and a gold (Au) film. Within such geometry, we experimentally demonstrate propagation distances exceeding 80 micrometers crossing an entire h-BN flake without substantial decay. A theoretical prediction of ∼925-micrometer propagation length is obtained. These polaritons may be ideally suited for realizing polaritonic interconnects that bridge different components of compact and planar photonic systems, enabling mid-IR information transport and seamless integration with other vdW material–based mid-IR photonic devices.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Important experimental work on polaritons in 2D van der Waals materials and heterostructures.", "tags": ["2Dmaterial", "vanderWaals", "heterostructure", "graphene", "phononpolariton", "photonics"], "image": "", "briefing": {"background": "2차원 반데르발스 물질에서의 빛-물질 상호작용은 나노 광학 소자 및 적외선 분광학 분야에서 극도로 강한 빛의 제한을 가능하게 했습니다. 그러나 기존의 그래핀 플라즈몬이나 h-BN의 쌍곡선 포논 폴라리톤은 전파 거리가 짧다는 치명적인 한계가 있어 정보 전송 매체로 활용하기 어려웠습니다.", "motivation": "중적외선(mid-IR) 영역에서 정보 전송 효율을 높이기 위해, 기존 폴라리톤의 높은 제한 효과는 유지하면서도 전파 거리를 획기적으로 늘릴 수 있는 새로운 구조적 접근법이 필요했습니다.", "result": "h-BN, 고굴절률 Ge 층, 그리고 Au 박막을 결합한 하이브리드 이종접합 구조를 통해 기존보다 훨씬 긴 장거리 표면 폴라리톤(LRSP)을 실험적으로 구현했습니다. 전파 거리가 80마이크로미터를 넘어서며, 이론적으로는 900마이크로미터 이상까지 가능함을 입증했습니다.", "implication": "이 결과는 2차원 물질 기반의 광자 회로에서 구성 요소들 사이를 연결하는 '폴라리톤 인터커넥트'가 실현 가능함을 보여주며, 고속 중적외선 온칩 광통신 시스템의 새로운 기반 기술이 될 것입니다.", "novelty": "기존의 강한 빛 제한을 유지하면서도 도파관 수준의 장거리 전송을 가능케 한 하이브리드 구조의 도입이 핵심입니다. 이는 반데르발스 헤테로구조를 이용한 광전소자 설계의 유연성을 극대화합니다.", "unresolved": "실제 온칩 소자로 통합했을 때 다른 능동 소자와의 커플링 효율이나 외부 환경에 의한 산란 효과 등 실제 구현 시의 노이즈 문제가 여전히 존재합니다.", "future_work": "이 폴라리톤 전파를 제어할 수 있는 능동 스위칭 소자 개발과 다양한 2차원 물질을 조합하여 분산 특성을 자유롭게 조절하는 연구가 예상됩니다.", "concepts": [{"term": "표면 폴라리톤(Surface Polariton)", "why_emerged": "빛의 파장보다 훨씬 작은 규모에서 전자기파와 물질 내 준입자의 결합을 통해 에너지를 전달하기 위해 필요.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "플라즈몬, 포논 폴라리톤, 메타물질."}, {"term": "h-BN (Hexagonal Boron Nitride)", "why_emerged": "밴드갭이 큰 2차원 절연체로서, 반데르발스 헤테로구조의 기판이나 유전체 층으로 널리 사용됨.", "origin": "그래핀 연구와 함께 본격적으로 응용됨", "connections": "그래핀, 2D 헤테로구조, 적외선 포토닉스."}, {"term": "장거리 표면 폴라리톤(LRSP)", "why_emerged": "기존 나노 플라즈모닉스의 높은 감쇄 문제를 해결하고 마이크로미터 단위의 정보 전송을 달성하기 위해 제안됨.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "도파관 광학, 나노 포토닉스."}], "english_summary": ["Demonstrates long-range surface polaritons (LRSPs) in vdW heterostructures.", "Uses a hybrid structure of h-BN, Ge, and Au to achieve >80 µm propagation length.", "Overcomes the inherent short-range limitations of GPs and HPhPs in 2D materials.", "Enables high-speed mid-IR photonic interconnects for compact planar systems."]}}, {"title": "ASE2SPRKKR: a unified Python framework integrating the Spin-Polarized Relativistic Korringa-Kohn-Rostoker method into the Atomic Simulation Environment", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2608.05957", "authors": "Ridha Eddhib, Maty\\'a\\v{s} Nov\\'ak, Hubert Ebert, Aki Pulkkinen, J\\'an Min\\'ar", "last_authors": "Aki Pulkkinen, J\\'an Min\\'ar", "summary": "The Spin-Polarized Relativistic Korringa-Kohn-Rostoker (SPR-KKR) is an all-electron ab-initio multiple-scattering code that provides unique capabilities for treating chemical disorder, finite-temperature magnetism, relativistic effects, and spectroscopic properties of various types of solids through its fundamental formulation in terms of the single-particle Green's function rather than eigenstates. We present ASE2SPRKKR, a comprehensive Python interface that integrates SPR-KKR into the Atomic Simulation Environment (ASE), making SPR-KKR more accessible, streamlined, and uniform. Our implementation extends the ASE's Atoms object to handle fractional site occupations for coherent-potential-approximation calculations while maintaining full compatibility with ASE's extensive ecosystem of structure builders, optimizers, and analysis tools. Automated input generation with validation, comprehensive output parsing, and direct MPI support enable seamless integration into high-throughput and multi-method workflows. We demonstrate the interface through representative applications: semi-infinite surface calculations reproducing Rashba-split Au(111) surface states; one-step photoemission modeling capturing matrix-element effects; exchange-parameter extraction for atomistic spin dynamics; and X-ray absorption spectroscopy including magnetic circular dichroism. Beyond these demonstrations, ASE2SPRKKR is designed with transferability as a first-class concern. By grounding its architecture in FAIR principles of Findability, Accessibility, Interoperability, and Reusability, it establishes a replicable blueprint for bringing other specialized Green's function and first-principles codes into the collaborative, reproducible workflows that modern materials discovery requires.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Ab-initio framework supporting one-step photoemission calculations and relativistic surface state modeling.", "tags": ["method", "photoemission", "electronicstructure"], "image": "https://arxiv.org/html/2608.05957v1/Fig1.png", "briefing": {"background": "자동 브리핑을 생성하지 못했습니다. 초록과 원문 링크를 기준으로 빠르게 확인하세요.", "motivation": "초록 정보만으로는 분야 내부의 구체적 동기를 안정적으로 요약하기 어렵습니다.", "result": "The Spin-Polarized Relativistic Korringa-Kohn-Rostoker (SPR-KKR) is an all-electron ab-initio multiple-scattering code that provides unique capabilities for treating chemical disorder, finite-temperature magnetism, relativistic effects, and spectroscopic properties of various types of solids through its fundamental formulation in terms of the single-particle Green's function rather than eigenstates. We present ASE2SPRKKR, a comprehensive Python interface that integrates SPR-KKR into the Atomic Simulation Environment (ASE), making SPR-KKR more accessible, streamlined, and uniform. Our implementation extends the ASE's Atoms object to handle fractional site occupations for coherent-potential-approximation calculations while maintaining full compatibility with ASE's extensive ecosystem of structure builders, optimizers, and analysis tools. Automated input generation with validation, comprehe", "implication": "필터가 이 논문을 통과시킨 이유는 관련 키워드, 저자, 또는 Gemini relevance score 때문입니다.", "novelty": "Ab-initio framework supporting one-step photoemission calculations and relativistic surface state modeling.", "unresolved": "원문 확인 후 열린 질문을 판단해야 합니다.", "future_work": "후속 실험, 독립 재현, 관련 물질/조건 확장이 가능한지 확인하세요.", "concepts": [], "english_summary": ["The detailed AI briefing was unavailable for this paper.", "Use the abstract, score reason, and original link for a quick first pass."]}}, {"title": "Anatomy of Spin--Orbit Torques in Monolayer Fe3GeTe2 and Fe3GaTe2: Insights from atomistic and momentum-space decompositions", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2608.05788", "authors": "Gusthavo M. S. Brizolla, Stepan S. Tsirkin, Yaroslav Zhumagulov, Jaroslav Fabian", "last_authors": "Yaroslav Zhumagulov, Jaroslav Fabian", "summary": "We present a systematic first-principles study of the spin-orbit torques in the ferromagnetic monolayers Fe$_3$GeTe$_2$ (FGT) and Fe$_3$GaTe$_2$ (FGaT). Despite sharing the same crystal structure (point group $D_{3h}$) and predominantly Fe~$3d$ spin-polarized bands, the two materials exhibit markedly different current-induced torques. We reveal these differences by computing the full angular dependence of the torkance---the torque per unit applied electric field---using linear-response theory with symmetry-adapted spin--orbit-coupled Wannier functions. FGaT may be viewed as a hole-doped analogue of FGT, since Ga contributes one valence electron fewer than Ge. Although the work functions differ by only about $28$~meV, the band filling near $K$ and $K'$ changes substantially: the density of states at $\\varepsilon_F$ is reduced by a factor of three and its spin polarization reverses from majority in FGT to minority in FGaT. These electronic changes are reflected in the torques resolved by time-reversal parity, sublattice, and momentum. In particular, we identify pronounced hidden torques in FGaT and relate the suppression of its fourth-harmonic Fermi-sea component to the evolution of momentum-space pockets. Finally, we discuss the emergence of such self-torques, which are not captured by the conventional picture of current-induced spin accumulation, within a symmetry-based phenomenological framework. Our results provide microscopic insight into current-induced torques in two-dimensional ferromagnets and offer guidance for defect and van der Waals engineering of layered magnetic materials.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Electronic structure study of momentum-resolved torques in relevant van der Waals ferrom     img.src = r.image; img.alt = 'Figure or article preview image'; img.loading = 'lazy'; img.referrerPolicy = 'no-referrer'; img.onerror = () => figure.remove();
    figure.appendChild(img);
    figure.appendChild(textEl('figcaption', '', 'Figure / article preview image from the source page'));
    head.appendChild(figure);
  }
  const headText = document.createElement('div');
  headText.className = 'head-text';
  const badges = document.createElement('div');
  badges.className = 'badges';
  if (r.score) badges.appendChild(textEl('span', 'badge score', `${r.score}/10`));
  if (r.tier) badges.appendChild(textEl('span', 'badge', r.tier));
  if (r.journal) badges.appendChild(textEl('span', 'badge', r.journal));
  if (r.source) badges.appendChild(textEl('span', 'badge', r.source));
  headText.appendChild(badges);
  const title = document.createElement('h1');
  if (r.link) { const titleLink = document.createElement('a'); titleLink.href = r.link; titleLink.target = '_blank'; titleLink.rel = 'noopener noreferrer'; titleLink.textContent = r.title || ''; title.appendChild(titleLink); }
  else { title.textContent = r.title || ''; }
  headText.appendChild(title);
  headText.appendChild(textEl('p', 'meta', [r.journal, r.source].filter(Boolean).join(' | ')));
  if (r.last_authors || r.authors) { const authors = document.createElement('p'); authors.className = 'authors'; if (r.last_authors) authors.append('Last authors: ' + r.last_authors); if (r.authors) authors.append((r.last_authors ? ' | ' : '') + 'Authors: ' + r.authors); headText.appendChild(authors); }
  appendLabeledText(headText, 'why', 'Filter reason: ', r.reason);
  if (r.tags && r.tags.length) { const tags = document.createElement('div'); tags.className = 'tags'; r.tags.forEach(tag => tags.appendChild(textEl('span', 'tag', '#' + tag))); headText.appendChild(tags); }
  if (r.link) { const link = document.createElement('a'); link.className = 'link'; link.href = r.link; link.target = '_blank'; link.rel = 'noopener noreferrer'; link.textContent = 'Open paper'; headText.appendChild(link); }
  head.appendChild(headText);
  if (r.summary) { const abstract = document.createElement('p'); abstract.className = 'original-abstract'; const strong = textEl('strong', '', 'Original abstract'); abstract.appendChild(strong); abstract.append(r.summary); head.appendChild(abstract); }
  slideEl.appendChild(head);
  const briefing = document.createElement('div');
  briefing.className = 'briefing';
  appendBriefSection(briefing, 'Background', b.background);
  appendBriefSection(briefing, 'Motivation', b.motivation);
  appendBriefSection(briefing, 'Result', b.result);
  appendBriefSection(briefing, 'Implication', b.implication);
  appendBriefSection(briefing, "Why it's important / Novelty", b.novelty);
  appendBriefSection(briefing, 'Unresolved Questions', b.unresolved);
  appendBriefSection(briefing, 'Expected Future Work', b.future_work);
  if (b.concepts && b.concepts.length) {
    const section = document.createElement('section');
    section.className = 'brief-section wide';
    section.appendChild(textEl('h2', '', 'Concepts / Terms'));
    const concepts = document.createElement('div');
    concepts.className = 'concepts';
    b.concepts.forEach(c => {
      const item = document.createElement('div');
      item.className = 'concept';
      item.appendChild(textEl('h3', '', c.term || 'Concept'));
      [['왜 생겼나: ', c.why_emerged], ['누가 만들었나: ', c.origin], ['연결되는 흐름: ', c.connections]].forEach(([label, text]) => { if (!text) return; const p = document.createElement('p'); const bold = textEl('b', '', label); p.appendChild(bold); p.append(text); item.appendChild(p); });
      concepts.appendChild(item);
    });
    section.appendChild(concepts);
    briefing.appendChild(section);
  }
  if (b.english_summary && b.english_summary.length) { const section = document.createElement('section'); section.className = 'brief-section wide'; section.appendChild(textEl('h2', '', 'English Summary')); const ul = document.createElement('ul'); b.english_summary.slice(0, 5).forEach(line => ul.appendChild(textEl('li', '', line))); section.appendChild(ul); briefing.appendChild(section); }
  slideEl.appendChild(briefing);
  counterEl.textContent = `${index + 1} / ${slides.length}`;
  prevBtn.disabled = index === 0;
  nextBtn.disabled = index === slides.length - 1;
}
prevBtn.addEventListener('click', () => { index = Math.max(0, index - 1); render(); });
nextBtn.addEventListener('click', () => { index = Math.min(slides.length - 1, index + 1); render(); });
document.addEventListener('keydown', event => { if (event.key === 'ArrowLeft') prevBtn.click(); if (event.key === 'ArrowRight') nextBtn.click(); });
render();
</script>
</body>
</html>
