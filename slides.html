<title>Daily Paper Slideshow</title>
<style>
  :root {
    color-scheme: light;
    --bg: #f6f7f4;
    --paper: #ffffff;
    --ink: #111827;
    --muted: #64748b;
    --line: #d8ddd2;
    --accent: #176b87;
    --accent-2: #9a3412;
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; overflow: auto; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: var(--bg); color: var(--ink); }
  .shell { max-width: 1500px; min-height: 100vh; margin: 0 auto; padding: 14px 18px; display: flex; flex-direction: column; }
  .topbar { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 16px; }
  .top-actions { display: flex; align-items: center; gap: 10px; }
  .topbar a, button { border: 1px solid var(--line); border-radius: 8px; background: var(--paper); color: var(--ink); padding: 10px 14px; font-weight: 700; text-decoration: none; cursor: pointer; }
  button.primary { background: var(--accent); border-color: var(--accent); color: white; }
  button:disabled { opacity: 0.45; cursor: not-allowed; }
  .counter { color: var(--muted); font-weight: 700; }
  .slide { min-height: calc(100vh - 82px); background: var(--paper); border: 1px solid var(--line); border-radius: 10px; padding: 18px; box-shadow: 0 18px 42px rgba(15, 23, 42, 0.10); display: grid; grid-template-columns: minmax(310px, 0.86fr) minmax(0, 1.55fr); gap: 18px; overflow: visible; }
  .paper-head { min-width: 0; min-height: 0; overflow: visible; display: flex; flex-direction: column; gap: 12px; }
  .figure { margin: 0; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: #f8fafc; }
  .figure img { display: block; width: 100%; max-height: 41vh; object-fit: contain; background: white; }
  .figure figcaption { padding: 7px 10px; color: var(--muted); font-size: 12px; line-height: 1.3; }
  .head-text { display: flex; flex-direction: column; gap: 9px; min-width: 0; }
  .badges { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .badge { border-radius: 999px; padding: 5px 9px; background: #eef2ff; color: #3730a3; font-size: 12px; font-weight: 800; }
  .score { background: #fee2e2; color: #991b1b; }
  h1 { margin: 0; font-size: 25px; line-height: 1.15; letter-spacing: 0; overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
  h1 a { color: inherit; text-decoration-color: rgba(23, 107, 135, 0.35); text-decoration-thickness: 2px; text-underline-offset: 4px; }
  h1 a:hover { color: var(--accent); text-decoration-color: var(--accent); }
  .meta, .authors, .why, .abstract { font-size: 13px; line-height: 1.45; }
  .meta, .authors { color: var(--muted); }
  .why strong, .abstract strong, .authors strong { color: var(--ink); }
  .authors { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .why { border-left: 4px solid var(--accent-2); padding-left: 10px; color: #374151; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .abstract { border-top: 1px solid var(--line); padding-top: 14px; color: #374151; }
  .original-abstract { border-top: 1px solid var(--line); padding-top: 10px; color: #374151; font-size: 11.5px; line-height: 1.35; overflow-wrap: anywhere; }
  .original-abstract strong { display: block; margin-bottom: 4px; color: var(--ink); }
  .tags { display: flex; flex-wrap: wrap; gap: 8px; }
  .tag { border-radius: 999px; padding: 4px 8px; background: #f1f5f9; color: #475569; font-size: 12px; font-weight: 700; }
  .head-text > .link { display: none; }
  .briefing { min-width: 0; min-height: 0; overflow: visible; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); grid-auto-rows: minmax(0, auto); align-content: start; gap: 11px 18px; border-top: 0; padding-top: 0; }
  .brief-section { min-width: 0; }
  .brief-section.wide { grid-column: 1 / -1; }
  .brief-section h2 { margin: 0 0 4px; font-size: 14px; line-height: 1.22; color: #0f766e; letter-spacing: 0; }
  .brief-section p, .brief-section li { margin: 0; font-size: 12.5px; line-height: 1.42; color: #1f2937; overflow-wrap: anywhere; }
  .brief-section ul { margin: 0; padding-left: 20px; }
  .concepts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 9px 14px; }
  .concept { border-top: 1px solid var(--line); padding-top: 7px; }
  .concept h3 { margin: 0 0 4px; font-size: 13px; color: #7c2d12; letter-spacing: 0; }
  .concept p { margin: 2px 0 0; font-size: 11.5px; line-height: 1.35; color: #374151; overflow-wrap: anywhere; }
  .concept b { color: #111827; }
  .link { color: var(--accent); font-weight: 800; text-decoration: none; }
  .empty { padding: 48px; background: var(--paper); border: 1px solid var(--line); border-radius: 12px; color: var(--muted); }
  @media (max-width: 860px) {
    .shell { padding: 14px; }
    .topbar, .top-actions { align-items: stretch; flex-direction: column; }
    .slide, .briefing, .concepts { grid-template-columns: 1fr; }
    .slide { min-height: auto; overflow: visible; display: grid; }
    h1 { font-size: 28px; }
  }
</style>

<script>
const slides = [{"title": "Observation of mirror-odd and mirror-even spin texture in ultrathin epitaxially strained RuO 2 films", "journal": "Science_Advances", "source": "author whitelist", "link": "https://doi.org/10.1126/sciadv.aec2917", "authors": "Yichen Zhang, Seung Gyo Jeong, Luca Buiarelli, et al.", "last_authors": "Bharat Jalan, Ming Yi", "summary": "Recently, rutile ruthenium dioxide (RuO 2 ) has attracted renewed interest due to expectations of prominent altermagnetic spin splitting. However, accumulating experimental evidence suggests that, in its bulk and thick-film forms, RuO 2 does not display any form of magnetic ordering. Despite this, the spin structure of RuO 2 remains largely unexplored in the ultrathin limit, where substrate-imposed epitaxial strain can be substantial. Here, we use spin-resolved angle-resolved photoemission spectroscopy, supported by ab initio calculations, to reveal the electronic structure of 2-nanometer-thick epitaxial RuO 2 heterostructures. We observe an unconventional spin texture characterized by the coexistence of mirror-even and mirror-odd momentum-dependent components. A comprehensive symmetry analysis rules out nonmagnetic origins of this spin texture. These findings suggest an emergent nonrelativistic spin structure enabled by epitaxial strain in the ultrathin limit, marking a distinct departure from the behavior of relaxed or bulk RuO 2 . Our work opens previously unexplored perspectives for exploring symmetry-breaking mechanisms and spin textures in oxide heterostructures.", "tier": "A_MUST_READ", "score": "10", "reason": "author whitelist: Sung-Kwan Mo", "tags": ["angle-resolvedphotoemission", "photoemission", "STS", "altermagnet", "heterostructure"], "image": "", "briefing": {"background": "루틸 구조의 이산화루테늄(RuO2)은 최근 알터마그네티즘(Altermagnetism) 후보 물질로 주목받아 왔습니다. 알터마그네티즘은 상대론적 스핀-궤도 결합 없이도 결정 대칭성에 의해 큰 스핀 분할(spin splitting)이 일어나는 새로운 자성 상태입니다. 하지만 벌크 및 두꺼운 박막 형태의 RuO2에서는 명확한 자기 정렬이나 스핀 분할을 찾기 어려워 그 존재 여부에 대한 논란이 있었습니다.", "motivation": "본 연구는 벌크와 달리 기판에 의한 에피택셜 스트레인(epitaxial strain)이 지배적인 2nm 수준의 초박막 RuO2에서 나타나는 전자 구조와 스핀 텍스처를 규명하여, 스트레인이 유도하는 새로운 스핀 물리 현상을 탐색하고자 했습니다.", "result": "스핀 분해 광전자 분광법(Spin-resolved ARPES)과 제일원리 계산을 통해, 2nm 두께의 RuO2 박막에서 운동량(momentum)에 의존하는 거울-짝(mirror-even) 및 거울-홀(mirror-odd) 스핀 텍스처가 공존함을 확인했습니다. 대칭성 분석 결과 이는 비자기적 기원을 배제하며, 에피택셜 스트레인에 의해 발현된 비상대론적 스핀 구조임을 입증했습니다.", "implication": "벌크 RuO2에서 관찰되지 않던 스핀 분할이 초박막의 변형 제어를 통해 나타날 수 있음을 보여줍니다. 이는 산화물 이종접합 구조에서 대칭성 깨짐을 이용해 스핀 텍스처를 엔지니어링할 수 있는 새로운 경로를 제시합니다.", "novelty": "RuO2의 알터마그네틱 특성을 초박막과 스트레인이라는 변수를 통해 실험적으로 포착했다는 점이 중요합니다. 사용자님의 관심사인 알터마그네티즘과 ARPES를 통한 스핀 구조 분석이 핵심인 논문입니다.", "unresolved": "관찰된 스핀 텍스처가 실제 장거리 자성 정렬(long-range magnetic order)과 어떻게 연결되는지에 대한 직접적인 자기 측정 데이터는 보완이 필요해 보입니다.", "future_work": "다양한 기판을 사용해 스트레인의 크기와 방향을 조절함으로써 스핀 분할의 양상을 제어하는 연구와, 이를 이용한 스핀트로닉스 소자 응용 연구가 기대됩니다.", "concepts": [{"term": "Altermagnetism", "why_emerged": "강자성(FM)의 스핀 분할과 반강자성(AFM)의 순자화 제로 특성을 동시에 갖는 제3의 자성 상태를 설명하기 위해 등장했습니다.", "origin": "최근 Libor Šmejkal, Jairo Sinova 등에 의해 이론적으로 정립되었습니다.", "connections": "반강자성 스핀트로닉스, 비상대론적 스핀 분할, 거울 대칭성 깨짐."}, {"term": "Epitaxial Strain", "why_emerged": "박막 성장 시 기판과의 격자 불일치를 이용해 물질의 물리적 성질(유전성, 자성 등)을 획기적으로 변조하기 위해 사용됩니다.", "origin": "박막 물리 및 재료 공학 분야의 고전적 개념입니다.", "connections": "산화물 전자공학, 강유전성, 금속-절연체 상전이."}, {"term": "Spin-resolved ARPES", "why_emerged": "전자 구조뿐만 아니라 개별 전자 상태의 스핀 편광도를 직접 측정하여 운동량 공간에서의 스핀 지도를 그리기 위해 필요합니다.", "origin": "초기 ARPES 기술에 모트 산란(Mott scattering) 검출기 등을 결합하며 발전했습니다.", "connections": "위상 절연체, 라쉬바 효과, 스핀 텍스처 분석."}, {"term": "Mirror-odd/even spin texture", "why_emerged": "결정의 거울 대칭 평면에 대해 스핀 성분이 어떻게 반전되거나 유지되는지를 구분하여 대칭성 깨짐의 기원을 분석하기 위해 사용됩니다.", "origin": "결정학적 대칭성 분석 및 군론(Group Theory)에 기반합니다.", "connections": "결정 대칭성, 스핀-궤도 결합, 알터마그네틱 대칭 연산."}], "english_summary": ["Observed unconventional spin textures in 2nm epitaxially strained RuO2 films using spin-resolved ARPES.", "Identified coexistence of mirror-even and mirror-odd momentum-dependent spin components, ruled out non-magnetic origins.", "Demonstrates that epitaxial strain can induce emergent non-relativistic spin splitting in the ultrathin limit of RuO2.", "Provides a path for exploring symmetry-breaking mechanisms and spin textures in oxide heterostructures."]}}, {"title": "Emergence and Detection of Surface altermagnetism in KV2Se2O", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2608.03551", "authors": "Rodrigo Jaeschke-Ubiergo, Xanthe H. Verbeek, Colin Lange, et al.", "last_authors": "Alexander Mook, Jairo Sinov", "summary": "We demonstrate the recent concept of emergent surface altermagnetism through its unique signatures in \\KVSO. We show that for bulk antiferromagnetically ordered \\KVSO, the (001) surface exhibits $d$-wave altermagnetism. Our results fully explain the recent seemingly contradicgting experimental evidence, independently showing both an antiferromagnetically ordered bulk from neutron diffraction, and $d$-wave spin splitting from photoemission spectroscopy. To fully verify this conecept, we predict, as a key experimental signature, a large nonlinear Edelstein response, which is localized at the surface, and follows the $d$-wave altermagnetic symmetry. These results are not only relevant for the metallic and room-temperature magnet \\KVSO, but also for several other Lieb lattice systems. Our work expands the pool of techniques that can be used to detect altermagnetism emerging at the surfaces of antiferromagnets.", "tier": "A_MUST_READ", "score": "10", "reason": "Explains ARPES spin-splitting results in KV2Se2O using surface altermagnetism; direct hit for user.", "tags": ["ARPES", "KV2Se2O", "altermagnetism"], "image": "https://arxiv.org/html/2608.03551v1/surface_states.001.jpeg", "briefing": {"background": "KV2Se2O는 상온에서도 금속성을 띠는 자성체로 알려져 있습니다. 최근 이 물질의 중성자 회절 데이터는 벌크 반강자성을 지시하는 반면, ARPES 데이터는 d-wave 형태의 강한 스핀 분할(알터마그네티즘의 특징)을 보여주어 두 실험 결과 사이의 불일치가 논란이 되었습니다.", "motivation": "본 논문은 KV2Se2O에서 나타나는 벌크-표면 간의 자 ": "A_MUST_READ", "score": "9", "reason": "Large-scale simulation of correlated phases and charge-density-wave on the kagome lattice.", "tags": ["theory", "kagome", "CDW"], "image": "https://arxiv.org/html/2608.03894v1/x1.png", "briefing": {"background": "카고메(Kagome) 격자는 기하학적 좌절(frustration)과 플랫 밴드(flat band)를 포함하고 있어 전하 밀도 파동(CDW), 초전도, 자성 등 다양한 강상관 현상을 연구하기에 이상적인 플랫폼입니다. 하지만 이를 수치적으로 시뮬레이션하는 것은 매우 높은 계산 비용을 요구합니다.", "motivation": "기존의 결정론적 양자 몬테카를로(DQMC) 시뮬레이션은 계산량의 한계($N^3$ 스케일링)로 인해 큰 시스템 크기를 다루기 어려웠습니다. 이로 인해 이전에 제안된 '삼각형 규칙(triangle-rule) CDW' 같은 상태들이 실제 열역학적 극한에서도 존재하는지 불확실했습니다.", "result": "FFT(고속 푸리에 변환)와 지연 업데이트(delay-update) 알고리즘을 결합하여 DQMC 시뮬레이션을 가속화했습니다(계산량 $N^{2.49}$로 단축). 이를 통해 기존보다 2배 큰 크기의 카고메 격자를 시뮬레이션한 결과, 이전의 CDW 질서가 유한한 크기 효과일 뿐 실제로는 존재하지 않음을 밝혀냈으며, 디랙 채움(Dirac filling)에서의 초유체 양자 임계 현상을 정확히 정량화했습니다.", "implication": "카고메 격자 기반의 인력 허버드 모델에서 CDW 질서의 존재 가능성에 대한 논란을 종식시켰으며, 대규모 시뮬레이션을 통해 물리적 상전이의 임계 지수를 정밀하게 추출하는 새로운 표준을 제시했습니다.", "novelty": "판독자의 핵심 관심사인 카고메 금속(AV3Sb5 등)과 CDW의 연관성을 수치적으로 검증한 논문입니다. 특히 계산 과학적 돌파구를 통해 이론적 가설을 재검증했다는 점에서 가치가 큽니다.", "unresolved": "이번 연구는 인력(attractive) 허버드 모델에 집중했으나, 실제 카고메 물질에서 더 중요한 척력(repulsive) 모델이나 다중 궤도(multi-orbital) 효과에 이 가속 기법이 어떻게 적용될지는 과제로 남아 있습니다.", "future_work": "가속화된 DQMC를 활용하여 다른 프러스레이션 격자(트라이앵글, 파이로클로어 등)에서의 상관 상태 연구 및 비평형 시스템으로의 확장이 기대됩니다.", "concepts": [{"term": "DQMC (Determinant Quantum Monte Carlo)", "why_emerged": "강상관 전자계의 다체 문제를 수치적으로 정확하게 풀기 위해 보조장(auxiliary field)을 도입하여 행렬식 형태로 계산하는 방식입니다.", "origin": "Blankbecler, Scalapino, Sugar (1981) 등에 의해 정립되었습니다.", "connections": "허버드 모델 시뮬레이션의 표준적 방법론 중 하나입니다."}, {"term": "Kagome Lattice (카고메 격자)", "why_emerged": "삼각형과 육각형이 교차하는 독특한 기하학적 구조로 인해 좌절 자성이나 위상적 밴드를 연구하기 위해 도입되었습니다.", "origin": "일본의 대바구니 무늬(Kagome)에서 이름이 유래했습니다.", "connections": "CsV3Sb5와 같은 카고메 초전도체, 위상 반금속 연구의 핵심 구조입니다."}, {"term": "Thermodynamic Limit (열역학적 극한)", "why_emerged": "입자 수와 부피가 무한대로 가는 극한에서의 물리량을 예측하여 유한한 크기에서 발생하는 오차를 제거하기 위해 필요합니다.", "origin": "통계역학의 기본 개념입니다.", "connections mage": "https://arxiv.org/static/browse/0.3.4/images/arxiv-logo-fb.png", "briefing": {"background": "초전도 다이오드 효과(SDE)는 전류의 방향에 따라 임계 전류가 달라지는 현상으로, 미래의 비가역적 초전도 소자 구현에 필수적입니다. 일반적으로 SDE는 공간 반전 대칭성(IS)과 시간 반전 대칭성(TRS)이 모두 깨져야 나타난다고 알려져 있습니다.", "motivation": "대부분의 SDE 연구는 이종 구조(heterostructure) 엔지니어링이나 외부 자기장을 필요로 합니다. 본 연구는 외부 자기장 없이 단일 물질(NbSe2)에서 압력만을 사용하여 SDE를 구현할 수 있는지 탐구했습니다.", "result": "NbSe2 박막(flake)에 압력을 가함으로써 외부 자기장 없이도 SDE가 발생하는 것을 발견했습니다. SHG(제2조화파 생성) 측정을 통해 압력이 IS를 깨뜨림을 확인했으며, 특히 외부 자기장 하에서의 SDE 거동이 자기장에 대해 짝함수(even) 특성을 보임으로써 명시적인 TRS 붕괴 없이도 자기장 없는 SDE가 가능함을 입증했습니다.", "implication": "기존의 'SDE를 위해서는 명시적인 TRS 붕괴가 필수적이다'라는 이론적 패러다임에 도전하는 결과입니다. 압력 엔지니어링을 통해 단순한 구조에서도 비가역적 초전도성을 유도할 수 있음을 보여주었습니다.", "novelty": "판독자가 관심을 갖는 NbSe2 및 2차원 초전도체 시스템에서의 새로운 물리 현상입니다. 특히 자기장 없는(magnetic-field-free) 다이오드 효과는 소자 응용 측면에서 매우 중요한 돌파구입니다.", "unresolved": "자기장 없이 TRS가 깨지지 않은 상태에서 어떻게 비가역적 수송 특성이 나타나는지에 대한 미시적 메커니즘은 여전히 논의의 대상이며, 초록 정보만으로는 완전한 설명이 부족합니다.", "future_work": "압력 외에도 정전기적 게이팅(gating)이나 변형(strain)을 통한 제어 가능성 연구, 그리고 이 현상을 활용한 논리 회로 설계 연구가 이어질 것으로 보입니다.", "concepts": [{"term": "SDE (Superconducting Diode Effect)", "why_emerged": "반도체 다이오드처럼 초전도 상태에서도 한쪽 방향으로만 전류가 더 잘 흐르게 하는 비가역적 특성을 구현하기 위해 등장했습니다.", "origin": "최근 2020년경부터 본격적으로 연구되기 시작한 분야입니다.", "connections": "Rashba-Edelstein 효과, 비가역적 수송 현상과 깊은 관련이 있습니다."}, {"term": "NbSe2", "why_emerged": "CDW와 초전도성이 공존하며 2차원 한계(monolayer)에서도 초전도성을 유지하여 양자 상전이 연구의 중심 물질로 쓰입니다.", "origin": "전이금속 디칼코게나이드(TMD)의 대표적인 층상 물질입니다.", "connections": "Ising 초전도성, 전하 밀도 파동(CDW), 판독자의 관심사인 NbNiTe2 등과 유사한 계열입니다."}, {"term": "SHG (Second Harmonic Generation)", "why_emerged": "물질의 반전 대칭성 파괴를 민감하게 감지하기 위한 광학적 도구로 널리 사용됩니다.", "origin": "비선형 광학의 초기부터 확립된 기술입니다.", "connections": "강유전성, 다강성체, 위상 물질의 대칭성 분석에 필수적입니다."}], "english_summary": ["Observed pressure-induced, magnetic-field-free superconducting diode effect (SDE) in NbSe2 flakes.", "Pressure breaks inversion symmetry (IS) without the need for external magnetic fields or heterostructures.", "The SDE shows even-in-B behavior, suggesting a challenge to the traditional TRS-breaking requirement.", "Establishes pressure as a powerful tool for engineering nonreciprocal superconductivity in van der Waals materials."]}}, {"title": "Pressure-induced Superconductivity in Thermoelectric Semiconductor Mg3Sb2 (Journal American Chemical Society (2026))", "journal": "arXiv_CondMat", "source": "author whitelist", "link": "https://arxiv.org/abs/2608.03058", "authors": "Cuiying Pei, Yasong Wu, Airan Li, et al.", "last_authors": "Jiong Yang, Yanpeng Qi", "summary": "The intrinsic electronic structures of narrow bandgap thermoelectric (TE) materials serve as a platform for the investigation of coupling effects of quasi-particles under high pressure, enabling the exploration of emerging electronic and phonon transport, superconductivity, and topological transition. Here, we report the discovery of pressure-induced superconductivity in the TE semiconductor Mg3Sb2. Upon the increased pressure, the metallization occurs at 8.7 GPa, followed by a superconducting transition concomitant with a carrier-type crossover from p- to n-type. This phenomenon arises from a pressure-induced structural phase transition from the semiconducting P-3m1 to the metallic C2/m-I phase. The superconducting critical temperature (Tc) exhibits a dome-shaped pressure dependence, peaking at 3.3 K at 12.6 GPa. Combined theoretical calculations, high-pressure Raman spectroscopy, and X-ray diffraction (XRD) measurements reveal an additional structural transition above 20 GPa, yielding a distinct C2/m-II phase. Our findings establish the high-pressure phase diagram of Mg3Sb2, elucidate its pressure-dependent electronic properties, and provide valuable insights for future investigations of TE materials under high pressure.", "tier": "A_MUST_READ", "score": "9", "reason": "author whitelist: Yulin Chen", "tags": ["superconduct", "topological", "phonon", "transport"], "image": "https://arxiv.org/static/browse/0.3.4/images/arxiv-logo-fb.png", "briefing": {"background": "열전(Thermoelectric) 소재는 온도차를 전기로 바꾸거나 그 반대의 과정을 수행하며, 대개 좁은 띠틈(narrow bandgap)을 가진 반도체 특성을 보입니다. 고압 환경은 소재의 결정 구조와 전자 구조를 변형시켜 금속화, 초전도 현상, 혹은 위상 상태의 변화를 유도하는 강력한 도구로 사용됩니다.", "motivation": "대표적인 열전 반도체인 Mg3Sb2에서 고압에 따른 전하 운반자 및 포논 수송 특성 변화, 그리고 초전도 현상의 발현 가능성을 탐구하고자 했습니다.", "result": "8.7 GPa에서 금속화가 일어나고, 12.6 GPa에서 최고 3.3 K의 임계 온도(Tc)를 갖는 초전도 현상이 발견되었습니다. 이 과정에서 결정 구조가 P-3m1에서 C2/m-I으로 변하며, 전하 운반자가 p형에서 n형으로 바뀌는 '캐리어 타입 크로스오버'가 관찰되었습니다. 20 GPa 이상에서는 또 다른 구조적 상전이(C2/m-II)가 나타남을 확인했습니다.", "implication": "Mg3Sb2의 고압 상평형도를 완성했으며, 열전 소재가 고압 하에서 초전도체나 위상 물질로 변모할 수 있는 경로를 제시했습니다.", "novelty": "기존에 열전 특성으로 유명했던 Mg3Sb2에서 초전도성을 처음으로 입증했으며, 특히 구조 전이와 연계된 전하 극성 변화(p to n)를 명확히 규명했습니다. 독자님의 관심사인 전자 구조 변형과 초전도 발현 메커니즘 연구에 부합합니다.", "unresolved": "20 GPa 이상의 C2/m-II 상에서 나타나는 전자 구조의 세부적 특징과 그 상에서의 초전도성 유지 여부는 추가 연구가 필요합니다.", "future_work": "고압 하에서 ARPES 등을 이용한 직접적인 전자 구조 측정이나, 열전 효율과 초전도성이 교차하는 임계 영역에 대한 정밀한 분석이 기대됩니다.", "concepts": [{"term": "캐리어 타입 크로스오버 (Carrier-type crossover)", "why_emerged": "압력이나 도핑에 의해 주된 전하 운반자가 정공(p)에서 전자(n)로 바뀌는 현상을 설명하기 위함입니다.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "반도체 물리, 홀 효과(Hall effect), 띠 구조(band structure) 변형"}, {"term": "Mg3Sb2", "why_emerged": "상온 부근에서 우수한 성능을 보이는 차세대 열전 소재로 주목받아 왔습니다.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "열전 재료, Zintl 상(phase), 고압 물성"}, {"term": "구조적 상전이 (Structural phase transition)", "why_emerged": "외부 압력에 의해 원자 배열이 바뀌면서 소재의 물리적 성질이 근본적으로 변하는 과정을 기술합니다.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "결정학, X선 회절(XRD), 라만 분광학"}], "english_summary": ["Discovery of pressure-induced superconductivity in the thermoelectric semiconductor Mg3Sb2.", "A superconducting dome emerges with a maximum Tc of 3.3 K at 12.6 GPa, following metallization at 8.7 GPa.", "Identified a p-type to n-type carrier crossover linked to a structural transition from P-3m1 to C2/m-I phase.", "Comprehensive high-pressure phase diagram established using XRD, Raman, and transport measurements."]}}, {"title": "Spin-charge separation in the triangular-lattice Hofstadter-Hubbard model", "journal": "arXiv_CondMat", "source": "keyword", "link": "https://arxiv.org/abs/2608.02727", "authors": "Yuntian Gu, Hui Yang, Zhehao Dai, Yantao Wu", "last_authors": "Zhehao Dai, Yantao Wu", "summary": "Recent experiments in moir\\'e materials have enabled the realization of a variety of exotic quantum phases. In this context, the Hofstadter-Hubbard model has been proposed as a possible setting for hosting chiral spin liquid. Concurrently, significant progress has been recently made in the computational methods for two-dimensional many-body fermion systems, which makes numerically studying this challenging model a real possibility in genuine 2D geometry. Motivated by these advances, we investigate the putative chiral spin liquid phase in the triangular-lattice Hofstadter-Hubbard model using variational Monte Carlo with neural quantum states (NQS) and projected entangled pair states (PEPS). We observe spin-charge separation directly in real space through numerical spin-pumping simulation and real-time spin and charge motion. In addition, in the context of anyonic superconductivity conjectured in this model, we find a positive two-electron binding energy on small systems, but it decreases below our numerical resolution as the system size increases. Our work demonstrates NQS and PEPS as powerful tools, capable of cross-checking each other, for diagnosing topological order and fractionalized excitations in strongly correlated electronic systems.", "tier": "A_MUST_READ", "score": "9", "reason": "title strong match: spin-charge separation", "tags": ["spin-chargeseparation", "spinliquid", "superconduct", "correlated", "Hubbard", "topological"], "image": "https://arxiv.org/html/2608.02727v1/x1.png", "briefing": {"background": "모아레(Moiré) 시스템과 같은 2차원 계에서 강한 전자 상관관계에 의해 나타나는 기묘한 양자 상들을 연구하는 모델 중 하나가 Hofstadter-Hubbard 모델입니다. 특히 카이랄 스핀 액체(Chiral Spin Liquid)와 같은 위상학적 tionalized excitations via real-space spin-pumping and real-time dynamics simulations.", "Investigated potential anyonic superconductivity, finding size-dependent two-electron binding energies."]}}, {"title": "Robust field-free superconducting diode effect in FeTe0.55Se0.45", "journal": "npj_QuantumMaterials", "source": "author whitelist", "link": "https://www.nature.com/articles/s41535-026-00930-3", "authors": "Peng Dong, Jinghui Wang, Yanjiang Wang, et al.", "last_authors": "Jinsheng Wen, Jun Li", "summary": "Robust field-free superconducting diode effect in FeTe 0.55 Se 0.45", "tier": "A_MUST_READ", "score": "9", "reason": "author whitelist: Yulin Chen", "tags": ["superconduct"], "image": "https://pubads.g.doubleclick.net/gampad/ad?iu=/285/npjquantmats.nature.com/article&sz=728x90&c=428395610&t=pos%3Dtop%26type%3Darticle%26artid%3Ds41535-026-00930-3%26doi%3D10.1038/s41535-026-00930-3%26subjmeta%3D301,639,766%26kwrd%3DMaterials+science,Physics", "briefing": {"background": "초전도 다이오드 효과(Superconducting Diode Effect, SDE)는 전류의 방향에 따라 초전도 임계 전류가 달라지는 비가역적 수송 현상입니다. 일반적으로 이 현상은 공간 반전 대칭성과 시간 반전 대칭성이 모두 깨져야 하며, 대개 외부 자기장이 필요합니다.", "motivation": "위상 초전도체 후보 물질로 알려진 철 기반 초전도체 FeTe0.55Se0.45에서 외부 자기장 없이 작동하는(field-free) 견고한 다이오드 효과를 구현하고자 했습니다.", "result": "FeTe0.55Se0.45 단결정에서 외부 자기장이 없는 상태에서도 뚜렷하고 안정적인 초전도 다이오드 효과를 관측하는 데 성공했습니다.", "implication": "자기장 없이 작동하는 초전도 논리 회로나 소자 개발에 중요한 진전이며, 해당 물질 내부의 자생적인 대칭성 깨짐(예: 내재적 자기 질서나 위상적 표면 상태의 영향)을 시사합니다.", "novelty": "독자님의 주요 관심사인 Fe(Te,Se) 계열에서, 특히 '자기장 없는' 다이오드 효과를 발견했다는 점이 핵심입니다. 이는 이 물질의 위상적 성질이나 시간 반전 대칭성 깨짐(TRSB)과 직결될 수 있습니다.", "unresolved": "이 현상이 표면 위상 상태에서 기인한 것인지, 아니면 벌크의 미세한 비균질성이나 내재적 대칭성 결여에서 온 것인지에 대한 미시적 메커니즘은 초록만으로 명확하지 않습니다.", "future_work": "ARPES를 통한 표면 상태 확인이나, 이 다이오드 효과의 온도 및 조성 의존성을 통한 메커니즘 규명 연구가 뒤따를 것으로 보입니다.", "concepts": [{"term": "초전도 다이오드 효과 (Superconducting Diode Effect, SDE)", "why_emerged": "에너지 소모가 적은 초전도 기반의 비가역 소자(다이오드)를 구현하기 위해 연구되기 시작했습니다.", "origin": "초록 정보만으로는 특정하기 어려움 (최근 5~6년 내 급격히 발전)", "co  성공적으로 제어할 수 있음을 보였습니다. 이는 특정 방향으로 도메인을 정렬(detwinning)할 수 있음을 의미하며, CDW 상태가 격자 변형에 매우 민감하게 반응하는 전자적 자유도를 가지고 있음을 시사합니다.", "implication": "스트레인을 통해 특정 CDW 도메인을 선택적으로 생성할 수 있으므로, 향후 ARPES나 STM 실험 시 도메인 평균화 효과를 배제한 순수한 단일 도메인의 전자 구조를 측정할 수 있는 길을 열어줍니다.", "novelty": "카고메 금속 연구에서 중요한 화두인 '네마틱 CDW'를 스트레인이라는 외력을 통해 직접 조절했다는 점이 핵심입니다. 이는 사용자의 주요 관심사인 CsV3Sb5의 네마틱성 및 도메인 물성과 직결됩니다.", "unresolved": "초록 정보만으로는 스트레인의 임계값이나 온도에 따른 도메인 벽의 동역학적 변화까지는 명확히 알기 어렵습니다.", "future_work": "제어된 도메인을 바탕으로 시간 역전 대칭성 깨짐의 이방성이나 초전도 전이 온도와의 상관관계를 규명하는 후속 연구가 예상됩니다.", "concepts": [{"term": "CsV3Sb5", "why_emerged": "카고메 격자 구조에서 나타나는 좌절된 자성과 위상적 특성, 강상관 전자계를 연구하기 위해 등장했습니다.", "origin": "2020년경 Stephen Wilson 그룹 등에서 초전도성과 CDW의 공존을 발견하며 주목받았습니다.", "connections": "카고메 금속, 전하 밀도 파동(CDW), 비관습 초전도체."}, {"term": "Electronic superlattice domains", "why_emerged": "CDW로 인해 격자 주기가 변하면서 형성되는 초격자 구조가 시료 전체에서 균일하지 않고 구역(domain)별로 다른 방향성을 가질 수 있기 때문에 정의되었습니다.", "origin": "초록 정보만으로는 특정하기 어려움 (고체물리학의 일반적 개념).", "connections": "네마틱성, 도메인 벽(domain wall), 전하 밀도 파동."}, {"term": "Strain-control", "why_emerged": "물질의 대칭성을 인위적으로 깨거나 특정 방향의 물리량을 강화하여 양자 상태를 제어하기 위한 수단으로 도입되었습니다.", "origin": "초록 정보만으로는 특정하기 어려움 (재료 과학의 표준적 기법).", "connections": "Elastoresistance, Detwinning, 네마틱성 측정."}], "english_summary": ["Demonstrated the ability to control electronic superlattice (CDW) domains in CsV3Sb5 using external strain.", "Evidence of the nematic character of the charge density wave state in Kagome metals.", "Provides a method to achieve detwinned samples for clean electronic structure measurements.", "Directly links lattice deformation to the spatial distribution of electronic phases."]}}, {"title": "Effect of cobalt intercalation on the electronic structure of graphene on Ir(111): Sublattice and time-reversal symmetry breaking", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/8tv2-jw2h", "authors": "Alevtina A. Gogina, Artem V. Tarasov, Anna A. Rybkina, et al.", "last_authors": "Alexander M. Shikin, Artem G. Rybkin", "summary": "Proximity effects between graphene and hybrid ferromagnetic and heavy metal structures offer a promising road for modifying graphene's electronic properties. Such systems have been proposed for spintronic applications due to their perpendicular magnetic anisotropy and significant Dzyaloshinskii-Mori…", "tier": "B_IMPORTANT_CONDMAT", "score": "9", "reason": "Very direct: electronic structure, graphene, and time-reversal symmetry breaking (TRSB).; demoted from A: broad CM, not direct user/project hit", "tags": ["graphene", "electronicstructure", "time-reversalsymmetrybreaking", "ferromagnet", "spintronics", "material"], "image": "", "briefing": {"background": "그래핀의 우수한 전자 이동도와 물리적 특성을 유지하면서, 자성체와의 근접 효과(proximity effect)를 통해 스핀-궤도 결합이나 자성을 주입하려는 시도가 스핀트로닉스 분야에서 활발히 진행 중입니다.", "motivation": "Ir(111) 기판 위의 그래핀과 코발트(Co) 층 사이의 인터칼레이션(intercalation)이 그래핀의 전자 구조, 특히 서브래티스(sublattice) 대칭성과 시간 역전 대칭성(TRS)에 미치는 영향을 규명하고자 했습니다.", "result": "Co 인터칼레이션을 통해 그래핀의 두 서브래티스 간의 등가성이 깨지고, 시간 역전 대칭성이 파괴됨을 확인했습니다. 이는 그래핀 전자 구조에 밴드 갭을 형성하거나 스핀 분극을 유도하는 결과로 이어집니다.", "implication": "그래핀 기반의 위상 자성 상태를 구현할 수 있는 플랫폼을 제시하며, 이는 양자 이상 홀 효과(QAHE) 등의 발현으로 이어질 수 있습니다.", "novelty": "단순한 기판 효과를 넘어 인터칼레이션을 통해 서브래티스와 시간 역전 대칭성을 동시에 제어했다는 점이 돋보이며, 사용자의 관심사인 TRSB와 전자 구조 연구에 부합합니다.", "unresolved": "Co 층의 두께나 인터칼레이션 정도에 따른 대칭성 깨짐의 정량적 제어 범위는 추가 확인이 필요합니다.", "future_work": "ARPES를 통한 직접적인 밴드 갭 및 스핀 분극 측정, 그리고 Dzyaloshinskii-Moriya 상호작용(DMI)에 의한 스핀 텍스처 연구가 이어질 것으로 보입니다.", "concepts": [{"term": "Intercalation", "why_emerged": "2차원 물질과 기판 사이에 이종 원자를 삽입하여 전자 밀도를 조절하거나 새로운 상호작용을 유도하기 위해 사용됩니다.", "origin": "흑연 층간 화합물(GIC) 연구에서 유래했습니다.", "connections": "그래핀 도핑, 근접 효과, 반데르발스 헤테로구조."}, {"term": "Sublattice symmetry breaking", "why_emerged": "그래핀의 질량 없는 디락 페르미온 특성은 두 탄소 서브래티스의 대칭성에서 기인하며, 이를 깨뜨리면 에너지 갭이 발생합니다.", "origin": "Semenoff (1984) 등이 이론적으로 제시했습니다.", "connections": "질량 있는 디락 페르미온, 밴드 갭 엔지니어링."}, {"term": "Time-reversal symmetry breaking (TRSB)", "why_emerged": "자성 상태를 도입하여 위상적 특성을 변화시키고 이상 홀 효과 등을 구현하기 위해 필수적인 조건입니다.", "origin": "초록 정보만으로는 특정하기 어려움 (물리학의 근본 개념).", "connections": "강자성, 위상 절연체, 양자 이상 홀 효과."}], "english_summary": ["Investigated the impact of Co intercalation on graphene on Ir(111).", "Observed both sublattice and time-reversal symmetry breaking in the electronic structure.", "Potential for developing spintronic devices with perpendicular magnetic anisotropy.", "Graphene's electronic properties are significantly modified by proximity to the ferromagnetic Co layer."]}}, {"title": "Hybrid light-matter excitations and spontaneous time-reversal symmetry breaking in two-dimensional Josephson junctions", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/npcs-dl1q", "authors": "V. Varrica, G. Falci, E. Paladino, and F. M. D. Pellegrino", "last_authors": "V. Varrica, G. Falci, E. Paladino, and F. M. D. Pellegrino", "summary": "Here, the authors show that inductive coupling between a superconducting resonator and a short, wide two-dimensional material-based Josephson junction induces a phase transition in the global light–matter ground state. The resulting phase, which spontaneously breaks time-reversal symmetry, carries a finite equilibrium supercurrent at phase difference ϕ = π , where an isolated conventional Josephson junction carries no equilibrium supercurrent. The hybrid light–matter excitation spectrum provides spectroscopic fingerprints of the transition, while highly transparent transport channels determine the critical coupling.", "tier": "B_IMPORTANT_CONDMAT", "score": "9", "reason": "Very direct: discusses time-reversal symmetry breaking (TRSB) in 2D materials with experimental signatures.; demoted from A: broad CM, not direct user/project hit", "tags": ["time-reversalsymmetrybreaking", "superconduct", "2Dmaterials", "theory", "spectroscopy"], "image": "", "briefing": {"background": "조셉슨 접합은 초전도체 사이의 위상차를 이용해 초전류를 흘리는 소자로, 최근에는 2차원 물질을 장벽으로 사용하거나 공진기(resonator)와 결합하여 빛-물질 상호작용을 연구하는 도구로 확장되고 있습니다.", "motivation": "슈퍼전도 공진기와 2차원 조셉슨 접합 사이의 유도 결합(inductive coupling)이 시스템의 바닥 상태와 대칭성에 어떤 변화를 유도하는지 이론적으로 탐구했습니다.", "result": "특정 조건에서 시스템의 바닥 상태가 자발적으로 시간 역전 대칭성(TRSB)을 깨뜨리는 상전이를 일으킴을 발견했습니다. 특히 위상차 $\\phi = \\pi$에서 일반적인 접합과 달리 유한한 평형 초전류가 흐르는 특이한 상태가 나타납니다.", "implication": "외부 자기장 없이도 자발적인 TRSB 상태를 조셉슨 접합에서 구현할 수 있으며, 이는 위상 양자 컴퓨팅이나 민감한 분광학적 센서에 활용될 수 있습니다.", "novelty": "빛-물질 결합(하이브리드 여기)을 통해 거시적인 양자 상태의 대칭성을 제어한다는 발상이 참신하며, 사용자가 관심 있는 TRSB의 새로운 발현 기작을 제시합니다.", "unresolved": "이러한 자발적 TRSB 상태를 실험적으로 관측하기 위한 최적의 2차원 물질 선정과 저온 실험 조건의 한계 극복이 과제로 남아 있습니다.", "future_work": "공진기의 스펙트럼 측정(spectroscopic fingerprints)을 통한 상전이 검증 실험과 고투명성 수송 채널을 이용한 임계 결합 실험이 기대됩니다.", "concepts": [{"term": "2D Josephson junction", "why_emerged": "그래핀이나 NbSe2 같은 2차원 물질의 고유한 전자 특성을 초전도 소자에 결합하여 새로운 양자 현상을 관측하기 위해 등장했습니다.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "안드레예프 반사, 위상 초전도체, 2D 물질 기반 소자."}, {"term": "Hybrid light-matter excitations", "why_emerged": "광자와 물질 내부의 여기 상태(엑시톤, 플라즈몬 등)가 강하게 결합하여 형성되는 새로운 준입자를 연구하기 위해 도입되었습니다.", "origin": "폴라리톤(Polariton) 개념에서 유래했습니다.", "connections": "캐비티 양자 역학, 강결합 극한."}, {"term": "Spontaneous TRSB", "why_emerged": "외부 섭동 없이 시스템 스스로 시간 역전 대칭성을 깨뜨리는 현상은 비관습적 초전도나 위상 물질의 핵심 징후로 여겨집니다.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "비관습 초전도체, 루프 전류(loop current), 위상 상전이."}], "english_summary": ["Theoretically predicts spontaneous time-reversal symmetry breaking in 2D Josephson junctions coupled to resonators.", "Identified a phase transition in the light-matter ground state leading to a finite supercurrent at phase difference $\\phi = \\pi$.", "The hybrid excitation spectrum serves as a spectroscopic signature of this symmetry-broken phase.", "Suggests a new platform for exploring TRSB in topological and superconducting systems."]}}, {"title": "Intrinsic magnetotransport and orientation-dependent topological Hall effect in EuAuBi", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/gsjl-qnv7", "authors": "Lipika, Sneh, Shobha Singh, Ralf Koban, Walter Schnelle, Kaustuv Manna", "last_authors": "Walter Schnelle, Kaustuv Manna", "summary": "We report the growth of high-quality single crystals of the magnetic topological semimetal EuAuBi using a Pb-flux method, which effectively suppresses the formation of secondary ${\\mathrm{Au}}_{2}\\mathrm{Bi}$ impurity phases that were prevalent in the previously reported Bi-flux grown crystals. This…", "tier": "B_IMPORTANT_CONDMAT", "score": "9", "reason": "Experimental study of topological Hall effect in a magnetic topological semimetal.", "tags": ["topologicalsemimetal", "topological", "Halleffect", "transport", "experiment"], "image": "", "briefing": {"background": "자기적 위상 반금속(Magnetic Topological Semimetal)은 물질 내부의 자기 질서와 전자 구조의 위상적 특성이 결합하여 비정상 홀 효과(AHE)나 위상 홀 효과(THE)와 같은 독특한 양자 수송 현상을 나타내는 연구 분야입니다. 이는 차세대 스핀트로닉스 소자 구현을 위한 핵심 기초 물리로 주목받고 있습니다.", "motivation": "기존의 Bi-flux법으로 성장시킨 EuAuBi 단결정은 Au2Bi와 같은 불순물 상이 섞이는 고질적인 문제가 있었습니다. 본 연구는 Pb-flux법을 사용하여 고순도의 EuAuBi 결정을 성장시키고, 이 물질의 본질적인 자기 수송 특성 및 방향 의존적인 위상 홀 효과를 규명하고자 했습니다.", "result": "Pb-flux를 통해 불순물이 억제된 고품질 EuAuBi 결정을 얻는 데 성공했습니다. 자화 용이축(easy-axis)의 방향에 따라 위상 홀 효과(THE)가 민감하게 변하는 '방향 의존성'을 발견했으며, 이는 물질의 비공선적(non-collinear) 스핀 구조나 자성 상태와 결합된 베리 곡률(Berry curvature)의 기여를 시사합니다.", "implication": "자기적 위상 반금속에서 결정 방향과 외부 자기장의 방향에 따른 위상적 응답의 미세 조절 가능성을 확인했습니다. 이는 위상적 스핀 텍스처를 이용한 자기 메모리나 센서 소자 설계에 중요한 지침을 제공합니다.", "novelty": "Pb-flux라는 새로운 합성 접근법을 통해 물질의 순수성을 높였으며, 단순한 홀 효과 관측을 넘어 자기 질서의 방향에 따른 THE의 비등방성을 정밀하게 분석했다는 점이 독보적입니다. 독자의 관심사인 위상 반금속 및 자기적 특성과 직접적으로 맞닿아 있습니다.", "unresolved": "THE의 기원이 정확히 스카미온(skyrmion)과 같은 실공간 스핀 텍스처인지, 아니면 모멘트 정렬에 따른 운동량 공간의 베리 곡률 변화인지는 중성자 산란이나 Lorentz TEM 등 미시적 조사가 더 필요합니다.", "future_work": "ARPES를 통한 실제 전자 밴드 구조 확인과 위상 노드(Weyl nodes)의 존재 증명, 그리고 극저온/고자기장 하에서의 스핀 구조 정밀 매핑이 기대됩니다.", "concepts": [{"term": "위상 홀 효과 (Topological Hall Effect, THE)", "why_emerged": "비공선적 스핀 구조(예: 스카미온)를 통과하는 전자가 느끼는 유효 자기장을 설명하기 위해 등장했습니다.", "origin": "초록 정보만으로는 특정하기 어 분리(spin splitting)를 가지는 새로운 자성체 분류입니다. 반강자성체의 고속 특성과 강자성체의 스핀 분리 특성을 동시에 가져 차세대 스핀트로닉스의 핵심 소재로 급부상하고 있습니다.", "motivation": "알터마그넷의 잠재력을 활용하기 위해서는 스핀 상태를 나노초 이하의 빠른 속도로 제어하고 외부로 스핀을 주입하는 기술이 필수적입니다. 본 연구는 레이저 유도 동역학을 통해 이를 구현할 수 있는지 이론적으로 검증하고자 했습니다.", "result": "실시간 시변 밀도범함수 이론(RT-TDDFT)을 사용하여 알터마그넷/금속 이질 구조에서 레이저 펄스에 의한 자기 질서 스위칭이 가능함을 보였습니다. 또한, 이 과정에서 효율적인 스핀 주입이 일어남을 확인하여 알터마그넷 기반의 초고속 스핀 소스 가능성을 제시했습니다.", "implication": "레이저를 이용한 비접촉 방식으로 알터마그넷의 상태를 제어할 수 있음을 의미하며, 이는 테라헤르츠(THz) 대역에서 작동하는 초고속 스핀 논리 소자 개발의 이론적 토대가 됩니다.", "novelty": "최신 화두인 '알터마그네티즘'에 레이저 유도 스위칭 개념을 결합했다는 점이 매우 참신하며, 독자가 관심을 갖는 알터마그넷 및 이질 구조 물리에 부합합니다.", "unresolved": "이론적 계산 결과이므로, 실제 실험에서 레이저 강도와 펄스 지속 시간에 따른 실제 스위칭 효율 및 열적 안정성에 대한 검증이 필요합니다.", "future_work": "실제 알터마그넷 후보 물질(예: RuO2, MnTe)과 금속 계면에서의 펌프-프로브(pump-probe) 실험이 뒤따를 것으로 보입니다.", "concepts": [{"term": "알터마그네티즘 (Altermagnetism)", "why_emerged": "강자성과 반강자성으로 분류되지 않는, 교류(alternating) 형태의 스핀 분리를 가진 제3의 자성 상태를 설명하기 위해 정의되었습니다.", "origin": "L. Šmejkal, J. Sinova, T. Jungwirth 등 (2022년경 본격 체계화)", "connections": "반강자성, 스핀 분리, 테라헤르츠 스핀트로닉스"}, {"term": "실시간 시변 밀도범함수 이론 (RT-TDDFT)", "why_emerged": "전자와 스핀의 빠른 동역학을 양자역학적으로 정밀하게 계산하기 위해 필요합니다.", "origin": "Runge와 Gross (1984)", "connections": "제1원리 계산, 초고속 동역학, 레이저-물질 상호작용"}, {"term": "스핀 주입 (Spin Injection)", "why_emerged": "자성체에서 비자성체로 스핀 각운동량을 전달하여 전기적 신호로 변환하거나 제어하기 위해 필요합니다.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "스핀 펌핑, 스핀-궤도 토크(SOT), 이질 구조"}, {"term": "자기 스위칭 (Magnetic Switching)", "why_emerged": "자성체의 정보 저장 상태(0 또는 1)를 변경하기 위한 기본적인 물리 과정입니다.", "origin": "고전 자성 연구에서 유래", "connections": "광유도 자기 상전이, 초고속 메모리"}], "english_summary": ["Investigated laser-induced magnetic switching and spin injection in altermagnet/metal heterostructures.", "Used real-time TDDFT to demonstrate controllable spin dynamics in these systems.", "Found that altermagnets can serve as efficient sources for ultrafast spin current generation.", "Provides theoretical support for using altermagnets in high-speed, light-driven spintronic devices."]}}, {"title": "Magnon gap formation in the antiferromagnetic topological Weyl semimetal La0.1Eu0.9BiTe3", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/8t6f-6svn", "authors": "Kwan-Young Lee, Kornelius Nielsch, Nicolas Perez, et al.", "last_authors": "Byeongki Cho, Jong-Soo Rhyee", "summary": "Correlated magnon excitations in topologically nontrivial systems remain largely unexplored experimentally. Here, we report that 10% La substitution in localized-insulator $\\mathrm{EuBiT}{\\mathrm{e}}_{3}$ yields single crystals of $\\mathrm{L}{\\mathrm{a}}_{0.1}\\mathrm{E}{\\mathrm{u}}_{0.9}\\mathrm{BiT}…", "tier": "B_IMPORTANT_CONDMAT", "score": "9", "reason": "Very direct: combines topological Weyl semimetals, antiferromagnetism, and magnon physics.; demoted from A: broad CM, not direct user/project hit", "tags": ["topological", "Weyl", "magnetism", "antiferromagnet", "magnon", "material"], "image": "", "briefing": {"background": "Weyl 반금속(Weyl Semimetal)은 밴드 구조 내에서 Weyl 노드라는 특이점이 존재하는 물질로, 이곳에서 전자는 질량이 없는 입자처럼 행동합니다. 자기 질서가 있는 시스템에서는 자성 여기(마그논)와 위상적 전자 구조가 상호작용할 수 있어 새로운 양자 현상의 보고가 됩니다.", "motivation": "강한 상관관계가 있는 위상 물질에서 마그논(magnon) 여기 현상은 실험적으로 거의 탐구되지 않았습니다. 본 연구는 절연체인 EuBiTe3에 La를 도핑하여 Weyl 반금속 특성을 유도하고, 그 안에서 발생하는 마그논의 거동을 확인하고자 했습니다.", "result": "10% La가 치환된 La0.1Eu0.9BiTe3 단결정이 반강자성 Weyl 반금속임을 확인했습니다. 특히 반강자성 상태에서 '마그논 갭(magnon gap)' 형성을 관찰했으며, 수송 현상 및 열적 특성 분석을 통해 Weyl 페르미온과 마그논 사이의 결합 가능성을 제시했습니다.", "implication": "위상적 전자와 자성 들뜸(magnon)이 서로 어떻게 영향을 주고받는지 이해하는 중요한 사례를 제공하며, 이를 통해 위상 상태를 마그논으로 제어하는 기술로 이어질 수 있습니다.", "novelty": "특정 물질(EuBiTe3) 시스템에서 도핑을 통해 위상적 특성을 튜닝하고, 거기서 발생하는 마그논 갭을 실험적으로 포착했다는 점이 중요합니다. 독자가 관심 있는 Weyl 반금속, 반강자성, 상관관계 물리와 밀접합니다.", "unresolved": "마그논 갭의 크기가 Weyl 노드의 위치나 에너지 간격과 직접적으로 어떤 정량적 관계를 갖는지에 대한 명확한 물리적 모델 정립이 과제로 남아 있습니다.", "future_work": "비탄성 중성자 산란(INS) 또는 RIXS를 통한 마그논 분산 곡선의 직접 측정과 Weyl 페르미온과의 산란 산출물 연구가 필요합니다.", "concepts": [{"term": "마그논 갭 (Magnon Gap)", "why_emer Seif Alwan, Jonas Fransson", "summary": "We show that geometric curvature, encoded in the folding angle between two corner-sharing triangles on a kagome lattice, provides a continuous tuning knob for topological magnon phase. Starting from an extended spin Hamiltonian with exchange, Dzyaloshinskii-Moriya (DM) interaction, and a higher-order bow-tie coupling of scalar chiralities, we derive the chirality-mediated hopping amplitude, which depends on the folding and spin canting of the bow-tie triangles. At small folding and canting angles, the bow-tie coupling surpasses DM, establishing a curvature-dominated regime. These results establish curvature as an intrinsic geometric control parameter for topological magnonics and reveal a direct analogy with chirality-induced spin selectivity in molecular systems, pointing to a unified mechanism for chirality driven transport across scales. The mechanism is particularly relevant for chiral crystals where the DM interaction is weak or forbidden by symmetry, as in systems with a six-fold screw axis.", "tier": "B_IMPORTANT_CONDMAT", "score": "9", "reason": "Topological magnon phases on kagome lattices; highly relevant to user's kagome interests.; demoted from A: broad CM, not direct user/project hit", "tags": ["material", "kagome", "topological"], "image": "https://arxiv.org/html/2607.08580v3/x1.png", "briefing": {"background": "가고메 격자 시스템은 기하학적 좌절과 위상 밴드 구조가 결합하여 독특한 자성 및 전자적 상태를 나타내며, 최근 자성 격자의 위상 물성이 활발히 연구되고 있습니다.", "motivation": "가고메 격자 내의 기하학적 굽힘(curvature)이 마그논의 위상 위상(topological phase)을 어떻게 조절할 수 있는지 이론적으로 탐구하고자 했습니다.", "result": "삼각형 간의 접힘 각도가 마그논 위상 위상을 결정하는 핵심 변수임을 밝히고, DM 상호작용과 스칼라 카이랄성 결합의 상호작용을 규명했습니다.", "implication": "구조적 변형을 통해 위상적 마그논 상태를 제어할 수 있는 새로운 기법을 제시하며, 카이랄성 기반 스핀 수송 연구의 지평을 넓혔습니다.", "novelty": "가고메 격자의 기하학적 자유도를 위상 물성 제어 도구로 활용한 점이 독창적이며, 귀하가 연구하는 가고메 금속의 자성 및 위상 물성 이해에 새로운 시각을 제공합니다.", "unresolved": "이론적으로 제안된 굽힘 효과가 실제 물질의 동역학적 특성에 미치는 정량적인 상관관계는 추가 계산이 필요합니다.", "future_work": "구조적 굽힘이 제어된 가고메 자성체 후보 물질군을 탐색하거나, RIXS 등을 통한 마그논 분산 관계의 실험적 검증이 기대됩니다.", "concepts": [{"term": "위상 마그논", "why_emerged": "스핀 파동(마그논)에서도 위상학적 비자명성이 존재함을 통해 새로운 열 홀 효과나 스핀 수송 경로를 찾기 위해 필요함.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "카이랄 자성체, 스핀 홀 효과, Berry curvature."}, {"term": "가고메 격자", "why_emerged": "기하학적 좌절(frustration)을 통해 이국적인 양자 상태를 유도하기 쉬운 구조적 특성 때문.", "origin": "일본의 바구니 짜기 문양에서 유래, 고체물리에서 중요하게 다뤄짐.", "connections": "AV3Sb5, 위상 semimetal, 강상관 전자계."}], "english_summary": ["Investigates the role of geometric curvature in tuning topological magnon phases in a folded kagome lattice.", "Derives a chirality-mediated hopping amplitude driven by folding and spin canting angles.", "Establishes curvature as an intrinsic control parameter for topological magnonics.", "Reveals a deep analogy between this mechanism and chirality-induced spin selectivity in molecular systems."]}}, {"title": "First-Principles Quantum-Spectral framework for Elementary Vortex Pinning in superconductors", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2606.25862", "authors": "Haozhe Shi, Yuncheng Xie, Tong Zhang, Weibin Chu, Xin-Gao Gong", "last_authors": "Weibin Chu, Xin-Gao Gong", "summary": "The critical current of a type-II superconductor is controlled by vortex pinning, whose microscopic input is the elementary pinning force. Scanning tunneling spectroscopy has shown that a defect pins a vortex by reorganizing the Caroli--de Gennes--Matricon (CdGM) states in its core, but why this spectral reorganization amounts to a pinning force has lacked a quantum-mechanical, first-principles account. Here we establish a transferable first-principles computational framework for elementary vortex pinning, in which defect-resolved DFT/Wannier electronic structures are embedded into a finite-box projected Bogoliubov--de Gennes free-energy formalism to convert quasiparticle spectral reorganization into vortex-pinning energies and forces. Using this framework, we confirm that the defect-induced reorganization of the vortex-core spectrum is the microscopic origin of the elementary pinning force. The force is evaluated as a finite-box vortex-insertion free energy whose four-configuration subtraction isolates the meV-scale interaction from much larger backgrounds. With the superconducting gap scale and vortex-core profile fixed from experiments, the FeSe Fe-site vacancy reproduces the microscopic STM force scale together with the measured spectral reorganization. All five point defects in FeSe and FeTe pin attractively, with FeTe Fe-site vacancy strongest. Elementary vortex pinning thereby becomes a computable electronic-structure quantity, opening the first-principles screening of point defects toward higher critical currents.", "tier": "B_IMPORTANT_CONDMAT", "score": "9", "reason": "Directly connects STM vortex-core spectra to electronic structure in Fe-based superconductors.; demoted from A: broad CM, not direct user/project hit", "tags": ["method", "material", "superconductivity", "STM"], "image": "https://arxiv.org/html/2606.25862v2/fig/fig1.png", "briefing": {"background": "제2종 초전도체에서 자기장 하에 형성되는 양자 소용돌이(vortex)의 고정(pinning)은 임계 전류 밀도를 결정하는 핵심 요소입니다. 기존에는 현상학적으로 설명되었으나, 미시적인 결함 구조가 어떻게 소용돌이 내부의 전자 상태를 재구성하여 고정력을 생성하는지에 대한 제1원리 계산 모델이 부족했습니다.", "motivation": "STM(주사 터널링 분광법)으로 관측된 FeSe 등의 초전도체 내 소용돌이 코어 상태(CdGM 상태)의 변화가 실제 고정력으로 이어지는 물리적 메커니즘을 DFT 기반의 계산 프레임워크로 정량화하고자 했습니다.", "result": "DFT/Wannier 전자 구조를 Bogoliubov-de Gennes(BdG) formalism에 결합하여, 결함에 의한 소용돌이 코어 상태의 에너지 변화(Quasiparticle spectral reorganization)를 직접적인 고정력으로 변환하는 계산 프레임워크를 수립했습니다.", "implication": "초전도체의 임계 전류를 제어하기 위한 점결함의 효과를 실험 없이도 제1원리 계산으로 예측할 수 있게 되었습니다. 이는 고성능 초전도체 설계를 위한 이론적 지침이 될 것입니다.", "novelty": "실험적 STM 데이터와 이론적 DFT 계산을 정량적으로 연결했다는 점이 핵심입니다. 특히 Fe-based 초전도체 내 Fe-vacancy의 고정력 스케일을 재현함으로써 이 방법론의 타당성을 입증했습니다.", "unresolved": "계산 모델이 매우 복잡하여 대규모 결함 클러스터나 비정질 환경에서의 정확한 예측에는 한계가 있을 수 있습니다.", "future_work": "본 모델을 활용하여 임계 전류 밀도를 극대화할 수 있는 최적의 도핑 및 결함 엔지니어링 설계를 수행할 것으로 예상됩니다." g of Orbital-Driven Giant Magnetoresistance in van der Waals ferrimagnet Mn3Si2Te6", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2608.03568", "authors": "Abdul Ahad, Miuko Tanaka, Shunta Aoki, et al.", "last_authors": "Jiang Pu, Toshiya Ideue", "summary": "Strain engineering of magnetotransport offers a powerful strategy for uncovering emergent electronic and domain phenomena in quantum magnetic materials, while providing a promising pathway toward next-generation mechanically programmable spintronic technologies. Van der Waals magnets are particularly attractive in this context because their high crystallinity and mechanical flexibility allow exceptionally large, precisely controllable strain, enabling access to strain-induced functionalities unattainable in conventional solids. Here, we report systematic strain control of the van der Waals magnet Mn$_3$Si$_2$Te$_6$, which exhibits an unconventional colossal magnetoresistance whose microscopic origin remains under debate. We demonstrate in situ large-strain modulation of the electrical resistance in bulk crystals and show that the effect can be consistently explained by strain-tunable chiral orbital-current domains. Furthermore, measurements on exfoliated flake devices containing a single chiral domain reveal direct strain control of the electronic structure affected by orbital magnetic moment, establishing a unified microscopic mechanism for the unconventional colossal magnetoresistance. These results identify strain as an exceptionally effective control parameter for tailoring electronic and magnetic states in van der Waals magnets and provide a conceptual framework for realizing spin-straintronic functionalities based on orbital degrees of freedom.", "tier": "B_IMPORTANT_CONDMAT", "score": "9", "reason": "Strong focus on orbital currents and transport in vdW Mn3Si2Te6, matching user interest in loop currents.; demoted from A: broad CM, not direct user/project hit", "tags": ["tr  al.", "last_authors": "Cyprian Lewandowski, Mitali Banerjee", "summary": "Superconductivity in rhombohedral graphene has been observed across many layer numbers, with mounting evidence pointing toward spin-triplet pairing, yet complementary probes of the superconducting spin structure remain needed. Here we use one-sided WS$_2$ proximity in rhombohedral pentalayer graphene (R5G) as a surface-selective spin-orbit probe. The induced Ising spin-orbit coupling is strongest for carriers localized near the WS$_2$ interface, allowing the displacement field to tune the overlap between superconducting carriers and the spin-orbit perturbation. We observe a strongly asymmetric superconducting landscape: two robust pockets, SC1 and SC2, survive only on mutually opposite signs of displacement field, while a third pocket, SC3, is substantially weaker. Gate-tracking features, quantum oscillations, and self-consistent band-structure calculations identify the layer polarization and Fermi-surface character of the relevant carriers. The robust superconducting states are absent or strongly weakened when the active high-DOS carriers are polarized toward the WS$_2$ interface. Since Ising spin-orbit coupling is compatible with time-reversed spin-singlet pairing but competes with same-spin intervalley triplet pairing by canting or pinning the parent spin texture, this surface-selective suppression provides additional evidence for spin-triplet superconductivity involving both hole-like and electron-like carriers. Our results establish one-sided TMD proximity as a displacement-field-tunable probe of superconducting spin structure in rhombohedral graphene.", "tier": "B_IMPORTANT_CONDMAT", "score": "9", "reason": "Displacement-field tunable Ising spin-orbit proximity effect probing triplet superconductivity in rhombohedral graphene.", "tags": ["experiment", "graphene", "superconductivity"], "image": "https://arxiv.org/html/2608.03870v1/Figures/figure1_v4.png", "briefing": {"background": "능면체  pronounced peak centered at this energy. By combining momentum-selective information from polarized electronic Raman scattering with Raman-response model calculations based on a multiorbital Raman vertex in a reconstructed two-orbital DW state involving both Ni − 3 d x 2 − y 2 and Ni − 3 d z 2 orbitals, we identify 114 meV as the energy scale 2 Δ DW of the DW gap, characterized by incoherent opening and non-mean-field behavior. Furthermore, the model calculations reveal that the corresponding 2 Δ DW peak has a multiorbital origin, requiring both orbital contributions and their mixing beyond single-orbital projections, thus shedding light on the nature of the DW instabilities in La 4 Ni 3 O 10 .", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Directly relevant electronic structure study of charge density waves in the high-Tc nickelate family.", "tags": ["theory", "nickelate", "densitywave"], "image": "", "briefing": {"background": "Ruddlesden-Popper 니켈산염은 고온 초전도성과 전하 및 스핀 밀도파(DW)의 복잡한 얽힘을 보여주며, 강상관 전자계에서 전자 구조의 상호작용을 연구하는 중요한 플랫폼입니다.", "motivation": "La4Ni3O10에서 밀도파 전이와 관련된 에너지 갭의 특성과 오비탈 성격(d_x2-y2 및 d_z2)을 규명하여 초전도와의 연관성을 파악하고자 했습니다.", "result": "편광 라만 분광법을 통해 114 meV에서 밀도파 갭 에너지(2Δ_DW)를 관측했으며, 이것이 단일 오비탈이 아닌 다중 오비탈(multiorbital) 혼성에 기인함을 이론 모델링으로 입증했습니다.", "implication": "La4Ni3O10의 밀도파가 단순한 단일 오비탈 모델을 벗어나 있으며, 니켈산염의 초전도 기전을 이해하기 위해 다중 오비탈적 접근이 필수적임을 시사합니다.", "novelty": "편광 라만 분광법과 다중 오비탈 버텍스 모델을 결합하여 밀도파 갭의 에너지 스케일과 오비탈 성분을 직접적으로 규명한 점이 돋보입니다.", "unresolved": "관측된 밀도파 갭이 초전도 상태와 어떻게 미시적으로 경쟁하거나 협력하는지에 대한 직접적인 증거는 추가 연구가 필요합니다.", "future_work": "온도 변화에 따른 밀도파 갭의 진화와 외부 압력 하에서의 전자 구조 변화를 관측하여 초전도성과의 상관관계를 명확히 할 필요가 있습니다.", "concepts": [{"term": "Ruddlesden-Popper 니켈산염", "why_emerged": "층상 구조를 가진 산화물의 물리적 성질을 체계적으로 연구하기 위해.", "origin": "S.N. Ruddlesden and P. Popper (1950s).", "connections": "구리 산화물 초전도체와 구조적으로 유사하여 고온 초전도 연구의 주요 대상이 됨."}, {"term": "편광 라만 분광법", "why_emerged": "결정의 대칭성과 관련된 전자 및 격자 여기를 선택적으로 감지하기 위해.", "origin": "C.V. Raman (1928)에 의해 발견된 function appendBriefSection(parent, title, text, wide = false) { if (!text) return; const section = document.createElement('section'); section.className = 'brief-section' + (wide ? ' wide' : ''); section.appendChild(textEl('h2', '', title)); section.appendChild(textEl('p', '', text)); parent.appendChild(section); }
function render() {
  slideEl.replaceChildren();
  if (!slides.length) { slideEl.className = 'empty'; slideEl.textContent = 'No papers passed the filters in this run.'; counterEl.textContent = '0 / 0'; prevBtn.disabled = true; nextBtn.disabled = true; return; }
  slideEl.className = 'slide';
  const r = slides[index];
  const b = r.briefing || {};
  const head = document.createElement('div');
  head.className = 'paper-head';
  if (r.image) {
    const figure = document.createElement('figure');
    figure.className = 'figure';
    const img = document.createElement('img');
    img.src = r.image; img.alt = 'Figure or article preview image'; img.loading = 'lazy'; img.referrerPolicy = 'no-referrer'; img.onerror = () => figure.remove();
    figure.appendChild(img);
    figure.appendChild(textEl('figcaption', '', 'Figure / article preview image from the source page'));
    head.appendChild(figure);
  }
  const headText = document.createElement('div');
  headText.className = 'head-text';
  const badges = document.createElement('div');
  badges.className = 'badges';
  if (r.score) badges.appendChild(textEl('span', 'badge score', `${r.score}/10`));
  if (r.tier) badges.appendChild(textEl('span', 'badge', r.tier));
  if (r.journal) badges.appendChild(textEl('span', 'badge', r.journal));
  if (r.source) badges.appendChild(textEl('span', 'badge', r.source));
  headText.appendChild(badges);
  const title = document.createElement('h1');
  if (r.link) { const titleLink = document.createElement('a'); titleLink.href = r.link; titleLink.target = '_blank'; titleLink.rel = 'noopener noreferrer'; titleLink.textContent = r.title || ''; title.appendChild(titleLink); }
  else { title.textContent = r.title || ''; }
  headText.appendChild(title);
  headText.appendChild(textEl('p', 'meta', [r.journal, r.source].filter(Boolean).join(' | ')));
  if (r.last_authors || r.authors) { const authors = document.createElement('p'); authors.className = 'authors'; if (r.last_authors) authors.append('Last authors: ' + r.last_authors); if (r.authors) authors.append((r.last_authors ? ' | ' : '') + 'Authors: ' + r.authors); headText.appendChild(authors); }
  appendLabeledText(headText, 'why', 'Filter reason: ', r.reason);
  if (r.tags && r.tags.length) { const tags = document.createElement('div'); tags.className = 'tags'; r.tags.forEach(tag => tags.appendChild(textEl('span', 'tag', '#' + tag))); headText.appendChild(tags); }
  if (r.link) { const link = document.createElement('a'); link.className = 'link'; link.href = r.link; link.target = '_blank'; link.rel = 'noopener noreferrer'; link.textContent = 'Open paper'; headText.appendChild(link); }
  head.appendChild(headText);
  if (r.summary) { const abstract = document.createElement('p'); abstract.className = 'original-abstract'; const strong = textEl('strong', '', 'Original abstract'); abstract.appendChild(strong); abstract.append(r.summary); head.appendChild(abstract); }
  slideEl.appendChild(head);
  const briefing = document.createElement('div');
  briefing.className = 'briefing';
  appendBriefSection(briefing, 'Background', b.background);
  appendBriefSection(briefing, 'Motivation', b.motivation);
  appendBriefSection(briefing, 'Result', b.result);
  appendBriefSection(briefing, 'Implication', b.implication);
  appendBriefSection(briefing, "Why it's important / Novelty", b.novelty);
  appendBriefSection(briefing, 'Unresolved Questions', b.unresolved);
  appendBriefSection(briefing, 'Expected Future Work', b.future_work);
  if (b.concepts && b.concepts.length) {
    const section = document.createElement('section');
    section.className = 'brief-section wide';
    section.appendChild(textEl('h2', '', 'Concepts / Terms'));
    const concepts = document.createElement('div');
    concepts.className = 'concepts';
    b.concepts.forEach(c => {
      const item = document.createElement('div');
      item.className = 'concept';
      item.appendChild(textEl('h3', '', c.term || 'Concept'));
      [['왜 생겼나: ', c.why_emerged], ['누가 만들었나: ', c.origin], ['연결되는 흐름: ', c.connections]].forEach(([label, text]) => { if (!text) return; const p = document.createElement('p'); const bold = textEl('b', '', label); p.appendChild(bold); p.append(text); item.appendChild(p); });
      concepts.appendChild(item);
    });
    section.appendChild(concepts);
    briefing.appendChild(section);
  }
  if (b.english_summary && b.english_summary.length) { const section = document.createElement('section'); section.className = 'brief-section wide'; section.appendChild(textEl('h2', '', 'English Summary')); const ul = document.createElement('ul'); b.english_summary.slice(0, 5).forEach(line => ul.appendChild(textEl('li', '', line))); section.appendChild(ul); briefing.appendChild(section); }
  slideEl.appendChild(briefing);
  counterEl.textContent = `${index + 1} / ${slides.length}`;
  prevBtn.disabled = index === 0;
  nextBtn.disabled = index === slides.length - 1;
}
prevBtn.addEventListener('click', () => { index = Math.max(0, index - 1); render(); });
nextBtn.addEventListener('click', () => { index = Math.min(slides.length - 1, index + 1); render(); });
document.addEventListener('keydown', event => { if (event.key === 'ArrowLeft') prevBtn.click(); if (event.key === 'ArrowRight') nextBtn.click(); });
render();
</script>
</body>
</html>
