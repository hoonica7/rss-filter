<title>Daily Paper Slideshow</title>
<style>
  :root {
    color-scheme: light;
    --bg: #f6f7f4;
    --paper: #ffffff;
    --ink: #111827;
    --muted: #64748b;
    --line: #d8ddd2;
    --accent: #176b87;
    --accent-2: #9a3412;
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; overflow: auto; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: var(--bg); color: var(--ink); }
  .shell { max-width: 1500px; min-height: 100vh; margin: 0 auto; padding: 14px 18px; display: flex; flex-direction: column; }
  .topbar { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 16px; }
  .top-actions { display: flex; align-items: center; gap: 10px; }
  .topbar a, button { border: 1px solid var(--line); border-radius: 8px; background: var(--paper); color: var(--ink); padding: 10px 14px; font-weight: 700; text-decoration: none; cursor: pointer; }
  button.primary { background: var(--accent); border-color: var(--accent); color: white; }
  button:disabled { opacity: 0.45; cursor: not-allowed; }
  .counter { color: var(--muted); font-weight: 700; }
  .slide { min-height: calc(100vh - 82px); background: var(--paper); border: 1px solid var(--line); border-radius: 10px; padding: 18px; box-shadow: 0 18px 42px rgba(15, 23, 42, 0.10); display: grid; grid-template-columns: minmax(310px, 0.86fr) minmax(0, 1.55fr); gap: 18px; overflow: visible; }
  .paper-head { min-width: 0; min-height: 0; overflow: visible; display: flex; flex-direction: column; gap: 12px; }
  .figure { margin: 0; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: #f8fafc; }
  .figure img { display: block; width: 100%; max-height: 41vh; object-fit: contain; background: white; }
  .figure figcaption { padding: 7px 10px; color: var(--muted); font-size: 12px; line-height: 1.3; }
  .head-text { display: flex; flex-direction: column; gap: 9px; min-width: 0; }
  .badges { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .badge { border-radius: 999px; padding: 5px 9px; background: #eef2ff; color: #3730a3; font-size: 12px; font-weight: 800; }
  .score { background: #fee2e2; color: #991b1b; }
  h1 { margin: 0; font-size: 25px; line-height: 1.15; letter-spacing: 0; overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
  h1 a { color: inherit; text-decoration-color: rgba(23, 107, 135, 0.35); text-decoration-thickness: 2px; text-underline-offset: 4px; }
  h1 a:hover { color: var(--accent); text-decoration-color: var(--accent); }
  .meta, .authors, .why, .abstract { font-size: 13px; line-height: 1.45; }
  .meta, .authors { color: var(--muted); }
  .why strong, .abstract strong, .authors strong { color: var(--ink); }
  .authors { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .why { border-left: 4px solid var(--accent-2); padding-left: 10px; color: #374151; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .abstract { border-top: 1px solid var(--line); padding-top: 14px; color: #374151; }
  .original-abstract { border-top: 1px solid var(--line); padding-top: 10px; color: #374151; font-size: 11.5px; line-height: 1.35; overflow-wrap: anywhere; }
  .original-abstract strong { display: block; margin-bottom: 4px; color: var(--ink); }
  .tags { display: flex; flex-wrap: wrap; gap: 8px; }
  .tag { border-radius: 999px; padding: 4px 8px; background: #f1f5f9; color: #475569; font-size: 12px; font-weight: 700; }
  .head-text > .link { display: none; }
  .briefing { min-width: 0; min-height: 0; overflow: visible; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); grid-auto-rows: minmax(0, auto); align-content: start; gap: 11px 18px; border-top: 0; padding-top: 0; }
  .brief-section { min-width: 0; }
  .brief-section.wide { grid-column: 1 / -1; }
  .brief-section h2 { margin: 0 0 4px; font-size: 14px; line-height: 1.22; color: #0f766e; letter-spacing: 0; }
  .brief-section p, .brief-section li { margin: 0; font-size: 12.5px; line-height: 1.42; color: #1f2937; overflow-wrap: anywhere; }
  .brief-section ul { margin: 0; padding-left: 20px; }
  .concepts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 9px 14px; }
  .concept { border-top: 1px solid var(--line); padding-top: 7px; }
  .concept h3 { margin: 0 0 4px; font-size: 13px; color: #7c2d12; letter-spacing: 0; }
  .concept p { margin: 2px 0 0; font-size: 11.5px; line-height: 1.35; color: #374151; overflow-wrap: anywhere; }
  .concept b { color: #111827; }
  .link { color: var(--accent); font-weight: 800; text-decoration: none; }
  .empty { padding: 48px; background: var(--paper); border: 1px solid var(--line); border-radius: 12px; color: var(--muted); }
  @media (max-width: 860px) {
    .shell { padding: 14px; }
    .topbar, .top-actions { align-items: stretch; flex-direction: column; }
    .slide, .briefing, .concepts { grid-template-columns: 1fr; }
    .slide { min-height: auto; overflow: visible; display: grid; }
    h1 { font-size: 28px; }
  }
</style>

<script>
const slides = [{"title": "c-axis strain tuning of superconductivity and symmetric elastoresistivity in CsV3Sb5", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/l499-9f6c", "authors": "Xiaoran Yang, Yutong Li, Chunyi Li, et al.", "last_authors": "Huiqiu Yuan, Xingye Lu", "summary": "The kagome metal ${\\mathrm{CsV}}_{3}{\\mathrm{Sb}}_{5}$ hosts an intriguing interplay between charge-density-wave (CDW) order and superconductivity that is highly sensitive to lattice distortions. However, determining the specific roles of the in-plane $({A}_{1g,1})$ and out-of-plane $({A}_{1g,2})$ s…", "tier": "A_MUST_READ", "score": "10", "reason": "Direct experimental study on CsV3Sb5 kagome physics, highly relevant to user.", "tags": ["kagome", "CDW", "superconduct"], "image": "", "briefing": {"background": "Kagome 금속 CsV3Sb5는 전하 밀도 파(CDW)와 초전도성의 복잡한 상호작용으로 인해 큰 주목을 받고 있습니다. 격자 왜곡이 이러한 양자 질서에 미치는 영향을 이해하는 것이 해당 물질의 핵심적인 물리적 기원을 규명하는 데 필수적입니다.", "motivation": "CsV3Sb5의 CDW와 초전도성을 제어함에 있어, 평면 내(in-plane) 스트레인과 면외(c-axis) 스트레인이 각각 어떤 역할을 하는지 정량적으로 분리하여 규명하고자 합니다.", "result": "c-축 스트레인을 인가하여 CsV3Sb5의 CDW 질서와 초전도 전이 온도 간의 상관관계를 관찰하였습니다. 특히 대칭성 엘라스토저항(symmetric elastoresistivity) 측정 등을 통해 격자 왜곡이 전자 구조에 미치는 영향을 분석했습니다.", "implication": "이 결과는 CsV3Sb5의 초전도성이 단순히 CDW에 의한 페르미 표면 재구성에 의해서만 결정되는 것이 아니라, 격자 대칭성과 직접적으로 연결된 미세한 변형에 매우 민감함을 시사합니다.", "novelty": "c-축 스트레인 조절을 통해 Kagome 격자의 기하학적 구조 변화가 전자 질서에 미치는 영향을 실험적으로 직접 분리했다는 점이 중요합니다.", "unresolved": "CDW 질서가 정확히 어떤 국소적 왜곡 모드(예: V-V 결합 왜곡)에 의해 초전도성과 경쟁하거나 협력하는지에 대한 미세한 메커니즘은 완전히 규명되지 않았습니다.", "future_work": "스트레인 인가 상태에서 고분해능 ARPES를 통해 페르미 면의 변화를 직접 관측하거나, 고압 환경에서의 물리 특성 변화를 추적하는 연구가 필요합니다.", "concepts": [{"term": "Kagome Metal", "why_emerged": "기하학적 좌절(frustration)이 존재하여 독특한 밴드 구조와 밴드 평탄함(flat band)을 제공하기 위해 필요.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "반강자성체, 디락 반금속, 위상 절연체."}, {"term": "Elastoresistivity", "why_emerged": "재료의 등방성 파괴와 nematicity(네마틱성)를 민감하게 탐지하기 위해 필요.", "origin": "Chu et al. (Science, 2012) 등 철계 초전도체 연구에서 본격화.", "connections": "전자 네마틱 위상, 강상관 전자계의 비등방성."}], "english_summary": ["Investigated c-axis strain effects on CsV3Sb5 superconductivity and CDW.", "Used elastoresistivity to decouple lattice distortion roles.", "Identified critical sensitivity of electronic order to lattice symmetry breaking.", "Advances understanding of the competition between CDW and superconductivity."]}}, {"title": "A Perspective on Topological Charge Density Wave Materials", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2611.13360", "authors": "Chun-Tung Lien, Nidhish Thiruthukkal Puthenveettil, Alexander A. Balandin, Md Shafayat Hossain", "last_authors": "Alexander A. Balandin, Md Shafayat Hossain", "summary": "Charge density waves are among the earliest known ordered states in quantum materials, yet they have re-emerged at the center of modern discussions of topology, symmetry breaking, and collective dynamics. In several material classes, charge-density-wave order reshapes electronic bands, boundary states, defect structures, and electromagnetic responses in ways that invite a topological interpretation. Real-space imaging has shown that incommensurate order can form networks of phase defects rather than uniform modulations. Boundary-resolved spectroscopy has revealed in-gap modes whose existence and spatial structure track the charge-density-wave order, although such observations remain confined to a single material family. In Weyl materials, density-wave gaps have been linked to axion-like magnetoelectric response, placing the charge-density-wave phase within a dynamical-field description of the effective action. In kagome metals, charge order is intertwined with Berry curvature, unconventional symmetry breaking, and superconductivity. These developments have led to the term \"topological charge density wave,\" but the phrase describes several physically distinct phenomena. We distinguish three meanings: (i) topology of the order parameter and its defects, (ii) topology of the charge-density-wave-reconstructed electronic structure and its boundary modes, and (iii) axion-like electromagnetic response generated by density-wave order. The experimental and theoretical support for these three meanings differs substantially. This Perspective traces the development of these ideas, clarifies the evidence behind each class, identifies unresolved questions and points of debate, and outlines experimental criteria for establishing topology in charge-density-wave states.", "tier": "A_MUST_READ", "score": "10", "reason": "Crucial review of topological CDW physics, directly relevant to kagome metals and user's focus.", "tags": ["review", "kagome", "CDW", "topology"], "image": "https://arxiv.org/static/browse/0.3.4/images/arxiv-logo-fb.png", "briefing": {"background": "전하 밀도 파(CDW)는 고전적인 양자 상태이지만, 최근 위상 물리학의 발전으로 인해 CDW가 어떻게 위상학적 성질을 띠는지, 즉 '위상 CDW'로서의 물리학을 정립할 필요성이 대두되었습니다.", "motivation": "현재 학계에서 무분별하게 혼용되는 '위상 CDW'라는 용어의 의미를 세 가지 범주로 분류하고, 각 범주에 대한 실험적 및 이론적 근거를 명확히 정리하고자 합니다.", "result": "위상 CDW를 (1) 질서 변수의 위상 결함, (2) 재구성된 밴드 구조와 경계 모드, (3) 액시온 유사 전자기 반응으로 분류하고, 각각의 물리학적 타당성을 검토하였습니다.", "implication": "향후 연구자들이 위상 CDW를 논의할 때 혼란을 줄이고, 보다 엄밀한 실험적 증거(예: 액시온 반응 측정 등)를 요구하는 표준적인 프레임워크를 제공합니다.", "novelty": "Kagome 금속과 Weyl 반금속에서 나타나는 서로 다른 위상적 특징들을 통합적인 관점에서 정리하여, 관련 분야 연구자들에게 중요한 이론적 가이드라인을 제시합니다.", "unresolved": "서로 다른 위상적 의미를 지닌 CDW들이 동일한 물질에서 공존하거나 상호작용하는 구체적인 경로에 대해서는 아직 논쟁이 많습니다.", "future_work": "제안된 세 가지 분류 체계에 부합하는 정량적인 실험 데이터(특히 비등방성 및 동역학적 반응)를 확보하는 연구가 필요합니다.", "concepts": [{"term": "Topological CDW", "why_emerged": "CDW의 밴드 재구성이 위상학적 비자명성을 띨 수 있음이 밝혀지며 도입.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "Weyl 반금속, 베리 곡률, 액시온 절연체."}, {"term": "Axion-like response", "why_emerged": "위상적 질서가 외부 전자기장에 대해 비정상적인 반응(E dot B)을 유도하는 현상을 기술하기 위해 필요.", "origin": "Wilczek (PRL, 1987) 등의 액시온 전기역학에서 유래.", "connections": "위상 절연체, 자기 위상 물질."}], "english_summary": ["Provides a comprehensive perspective on topological charge density wave materials.", "Categorizes topological CDW definitions into order-parameter topology, band topology, and axion-like response.", "Analyzes evidence and debate across different material classes including kagome metals.", "Establishes criteria for characterizing topological states in density-wave systems."]}}, {"title": "Energy- and momentum-resolved Cooper-pair emission from a cuprate superconductor", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2611.09857", "authors": "Henry Amir, Jack Zwettler, Ka Ho Wong, et al.", "last_authors": "Dirk K. Morr, Fahad Mahmood", "summary": "Superconductivity arises from Cooper pairing, but conventional photoemission probes electrons individually rather than as pairs. Here we report the observation of Cooper-pair emission from an optimally doped cuprate superconductor using two-electron angle-resolved photoemission (2e-ARPES). Below the superconducting transition, we observe a distinct two-electron emission peak at zero pair binding energy and zero pair momentum that disappears in the normal state, revealing the characteristic fingerprint of a Cooper pair. Unexpectedly, the joint energy distribution broadens markedly along the relative-energy axis as temperature decreases, while the total energy width remains nearly unchanged. This anomalous behavior cannot be explained by instrumental resolution, static disorder or thermal broadening, and instead points to scattering processes involving collective excitations of the superconductor. Our results establish 2e-ARPES as a probe of both Cooper-pair emission and the many-body dynamics of the superconducting state.", "tier": "A_MUST_READ", "score": "10", "reason": "Direct experimental ARPES-related study (2e-ARPES) on cuprates, highly relevant to methodology and physics.", "tags": ["experimental", "ARPES", "cuprate", "superconductivity"], "image": "https://arxiv.org/html/2611.09857v1/fig1_v8.png", "briefing": {"background": "전통적인 neous control of oxygen stoichiometry and tolerance to nanofabrication. Here, we investigate sputtered Bi$_2$Sr$_2$Ca$_{n-1}$Cu$_n$O$_{2n+4+\\delta}$ (BSCCO) thin films and establish a direct link between annealing conditions, oxygen incorporation, and superconducting transport. By independently varying the annealing temperature and duration, we identify an optimal annealing condition of $860\\,^{\\circ}$C for 3\\,h, which yields the highest superconducting transition temperature and the narrowest transition among the investigated samples. X-ray diffraction, electron microscopy, and X-ray photoemission spectroscopy reveal a non-monotonic evolution of lattice oxygen, which governs hole doping in the CuO$_2$ planes and produces the characteristic dome-like dependence of $T_c$ on doping concentration. We further translate these optimized films into micro-devices to assess fabrication-induced effects, via micro-bridges as well as a planar Josephson junction. We demonstrate devices fabricated via both lift-off and focused ion beam (FIB) patterning methods -- proving the fabrication compatibility of these films. Importantly, we demonstrate their air-stability for extended periods of time (2 months). The combined insights offer practical guidelines for integrating cuprate thin films into superconducting electronics and quantum device architectures.", "tier": "A_MUST_READ", "score": "9", "reason": "Experimental study on cuprate superconductivity, employing photoemission, highly relevant to user's interests.", "tags": ["experiment", "cuprates", "superconductivity", "photoemission", "materials_synthesis"], "image": "https://arxiv.org/html/2611.14231v1/Fig1_R.png", "briefing": {"background": "고온 초전도체인 구리산화물(Cuprate)은 발견 이후 수십 년이 지났음에도 그 복잡한 전자 구조와 초전도 메커니즘으로 인해 응집물질물리학의 핵심 연구 대상입니다. 특히 소자 구현을 위해서는 박막 형태에서의 산소 도핑 정밀 제어와 nanofabrication 공정 내구성이 필수적입니다.", "motivation": "BSCCO 박막의 산소 화학량론(stoichiometry)을 조절하여 초전도 특성을 최적화하고, 이를 실제 전자 소자에 적용 가능한 공정 기술(리프트 오프, FIB 등)을 확립하고자 합니다.", "result": "860도에서 3시간 동안의 어닐링이 최적의 Tc를 구현함을 확인했습니다. XPS와 XRD 분석을 통해 산소 함량이 CuO2 평면의 홀 도핑을 조절하며, 이것이 초전도 도핑 곡선을 형성함을 증명했습니다.", "implication": "고온 초전도체 박막의 대기 안정성을 확보하고, 실제 회로 및 양자 소자 설계에 cuprate thin film을 통합할 수 있는 실질적인 가이드라인을 제공합니다.", "novelty": "기존의 까다로운 공정 문제를 극복하여 2개월간의 대기 안정성을 확보하고, 나노 소자 패터닝 기술을 cuprate에 성공적으로 적용한 점이 소자 연구 측면에서 주목할 만합니다.", "unresolved": "박막 내 산소 확산이 수 마이크로 단위의 소자 성능에 미치는 미세한 공간적 불균일성에 대한 분석은 미흡합니다.", "future_work": "최적화된 박막을 이용한 Josephson junction 기반의 초전도 양자 간섭 소자(SQUID) 성능 테스트가 기대됩니다.", "concepts": [{"term": "Cuprate Superconductivity", "why_emerged": "구조 내 CuO2 평면이 초전도성을 결정짓는 핵심이기 때문에 이를 분자 수준에서 제어할 필요가 있었습니다.", "origin": "Bednorz와 Müller (1986년)에 의해 최초 발견됨.", "connections": "고온 초전도, 전하 밀도 파동(CDW), 유사갭(pseudogap) 연구와 밀접하게 연결됨."}, {"term": "XPS (X-ray Photoemission Spectroscopy)", "why_emerged": "물질 표면의 원소 조성 및 화학적 결합 상태를 분석하기 위해 필요합니다.", "origin": "Kai Siegbahn (1960년대)에 의해 정립.", "connections": "ARPES와 물리적 원리는 같으나 주로 코어 레벨 분석에 사용됨."}], "english_summary": ["Optimized oxygen annealing protocol for BSCCO thin films enables high-Tc superconductivity.", "Identified direct correlation between lattice oxygen, CuO2 plane hole doping, and Tc.", "Demonstrated fabrication compatibility using lift-off and FIB patterning for micro-devices.", "Achieved 2-month air-stability, proving feasibility for integration into quantum architectures."]}}, {"title": "Surface-Dominated Anomalous Hall Effect in Altermagnetic MnTe Films", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2602.09363", "authors": "Ling-Jie Zhou, Zi-Jie Yan, Hongtao Rong, et al.", "last_authors": "Binghai Yan, Cui-Zu Chang", "summary": "Altermagnets have recently emerged as a new class of magnetic materials that combine compensated magnetic order with spin-split electronic band structures. In this work, we employ molecular beam epitaxy to grow MnTe thin films with controlled thickness on InP(111)A substrates. Using angle-resolved photoemission spectroscopy, we observe a large spin splitting of $\\approx 230$ meV for bulk bands well below the Fermi level and identify surface states that cross the Fermi level. Electrical transport measurements show that a robust anomalous Hall (AH) effect persists down to 2 K and an AH sign reversal occurs near 175 K. By systematically tuning film thickness, growth conditions, and interfacial structure, we demonstrate that the AH response in MnTe films originates from surface states rather than bulk bands. Our first-principles calculations reveal that this surface-dominated AH effect is imprinted by the bulk altermagnetic order and remains unchanged for terminations with opposite Mn magnetic orientations. Our results establish a unique surface transport probe of bulk altermagnetism, demonstrate interface engineering as an effective route to generate and control the AH effect in altermagnets, and provide a unified understanding of the AH response in altermagnetic MnTe films.", "tier": "A_MUST_READ", "score": "9", "reason": "ARPES study on altermagnetic material; highly relevant to user's expertise and materials interests.", "tags": ["ARPES", "altermagnet", "anomalous-hall"], "image": "https://arxiv.org/static/browse/0.3.4/images/arxiv-logo-fb.png", "briefing": {"background": "Altermagnet는 기존의 강자성(순자화)과 반강자성(자화 상쇄)의 경계를 허무는 새로운 자기 질서입니다. 스핀 분리된 밴드 구조를 가지면서도 순자화가 없어, 스핀트로닉스 응용 가능성으로 최근 크게 주목받고 있습니다.", "motivation": "MnTe altermagnetic 박막에서 벌크 자기 질서와 전자 구조(스핀 분리) 사이의 관계를 규명하고, 특히 이상 홀 효과(AHE)의 기원을 이해하고자 합니다.", "result": "ARPES를 통해 벌크 밴드에서 약 230 meV의 큰 스핀 분리를 관측했습니다. 또한 수송 특성 측정과 두께 조절 실험을 통해, MnTe의 이상 홀 효과가 벌크 밴드가 아닌 표면 상태에서 유래함을 입증했습니다.", "implication": "알터자성체의 수송 현상을 표면 상태 조절을 통해 제어할 수 있음을 보여주며, 이는 인터페이스 공학을 통한 스핀 소자 설계의 중요한 이정표가 됩니다.", "novelty": "ARPES와 수송 측정을 결합하여 알터자성체의 '표면 지배적' 수송 현상을 규명한 연구로, 위상 물질 및 스핀트로닉스 분야 연구자들에게 중요한 메커니즘 정보를 제공합니다.", "unresolved": "표면 상태와 벌크 알터자성 간의 구체적인 위상학적 연결 고리에 대한 이론적 정밀도가 더 필요합니다.", "future_work": "다양한 계면 구조를 설계하여 홀 효과의 부호나 크기를 의도적으로 바꾸는 스핀 트랜지스터 연구가 가능할 것입니다.", " ": {"background": "카고메 격자 구조를 가진 화합물은 전자의 상관관계, 밴드 토폴로지, 그리고 전하 밀도 파(CDW)와 같은 비전통적 물성이 나타나는 물리적 플랫폼으로 각광받고 있습니다.", "motivation": "CsV3Sb5와 구조적으로 유사하지만 전자의 충전 상태가 다른 CsTi3Bi5를 연구함으로써, 카고메 격자의 전자 구조와 격자 동역학의 상관관계를 체계적으로 이해하고자 합니다.", "result": "초고속 펌프-프로브 분광법을 통해 CsTi3Bi5에서의 들뜬 전자 완화 과정과 코히어런트 포논의 동역학적 특성을 측정하였습니다.", "implication": "동일한 격자 구조 내에서 다른 원소 조합이 어떻게 전자-포논 결합 및 구조적 불안정성에 영향을 미치는지 밝혀냄으로써, 카고메 물질군 전반의 물성 제어 원리를 확립할 수 있습니다.", "novelty": "CsV3Sb5 연구의 주요 참조점으로서 Ti 기반 카고메 물질의 기본 동역학 특성을 규명하여 카고메 금속 물성 연구의 범위를 확장했습니다.", "unresolved": "이 물질에서의 CDW 전이 유무나 초전도성의 미세한 메커니즘에 대한 구체적인 상관관계는 추가 연구가 필요합니다.", "future_work": "시간 분해 광전자 분광법(tr-ARPES)을 이용한 밴드 구조의 실시간 동역학 측정 및 도핑 제어를 통한 물성 변화 관찰.", "concepts": [{"term": "카고메 금속", "why_emerged": "특이한 밴드 구조(플랫 밴드, 디락 점)와 강한 상관관계가 결합하여 나타나는 위상 물질 연구의 필요성.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "CsV3Sb5, 강한 전자 상관관계, 위상 절연체."}, {"term": "코히어런트 포논", "why_emerged": "초고속 레이저 펄스가 격자를 집단적으로 진동시킬 때 발생하는 위상 정보의 동역학을 분석하기 위해 필요.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "펨토초 분광학, 전자-포논 결합, 시간 분해 측정."}], "english_summary": ["Investigates ultrafast carrier and phonon dynamics in CsTi3Bi5.", "Serves as a structural analog to the well-studied CsV3Sb5.", "Utilizes pump-probe spectroscopy to reveal electron-phonon coupling characteristics.", "Provides a baseline for understanding kagome lattice physics beyond vanadium-based systems."]}}, {"title": "Angular momentum splitter effect of d-wave axial phonons in orbital altermagnets (Phys. Rev. B)", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2607.13923", "authors": "Dimos Chatzichrysafis, Alexander Mook", "last_authors": "Dimos Chatzichrysafis, Alexander Mook", "summary": "We theoretically demonstrate that axial phonons, lattice vibration quanta carrying finite angular momentum, can host a $d$-wave angular momentum texture in orbital altermagnets in the absence of spin-orbit coupling. We consider a minimal electronic tight-binding model with $d$-wave loop-current order that breaks time-reversal symmetry. Within the Born-Oppenheimer approximation, we incorporate electron-phonon coupling via the molecular Berry curvature and show that the underlying $d$-wave orbital magnetic moment texture of the electronic state is transferred to the phonons without requiring the relativistic spin-orbit coupling. Our results expand the range of platforms available for engineering axial phonons and point to functionality unique to $d$-wave textures, including angular-momentum Seebeck and splitter effects, corresponding to longitudinal and transverse angular-momentum currents driven by a temperature gradient.", "tier": "B_IMPORTANT_CONDMAT", "score": "9", "reason": "Directly relevant to altermagnetism and $d$-wave order, core interests of the reader.", "tags": ["altermagnet", "phonon", "Berrycurvature"], "image": "https://arxiv.org/html/2607.13923v2/figure2.png", "briefing": {"background": "알터자성(Altermagnetism)은 시간 역전 대칭성을 깨면서도 순자화가 없는 독특한 자기 위상으로, 최근 스핀트로닉스와 위상 물성 연구의 핵심 주제로 떠오르고 있습니다.", "motivation": "스핀-궤도 결합(SOC) 없이도 전자의 궤도 자기 모멘트 질감이 포논에 전달될 수 있는지, 그리고 이것이 각운동량 분리 효과로 이어질 수 있는지 이론적으로 규명하고자 합니다.", "result": "축 포논(axial phonon)이 d-파 궤도 자기 모멘트 질감을 전달하며, 이를 통해 외부 자기장이나 SOC 없이도 각운동량 기반의 수송 현상이 발생할 수 있음을 입증했습니다.", "implication": "알터자성 물질에서 격자 진동을 통해 열-각운동량 수송을 제어할 수 있는 새로운 경로를 제시하며, 이는 저전력 스핀트로닉 소자 설계에 응용 가능합니다.", "novelty": "상대론적 효과인 SOC 없이도 궤도 자기 모멘트의 d-파 패턴을 통해 물리 현상을 제어할 수 있음을 이론적으로 보인 점이 주목할 만합니다.", "unresolved": "이 이론적 예측을 실험적으로 입증하기 위한 구체적인 알터자성 화합물의 선정 및 시료 제작이 과제로 남아 있습니다.", "future_work": "실제 알터자성 후보 물질에서의 각운동량 Seebeck 효과 관측 및 궤도 기반 수송 현상 측정.", "concepts": [{"term": "알터자성(Altermagnetism)", "why_emerged": "강자성과 반강자성의 경계에서 비전통적인 자기 대칭성을 설명하기 위해 제안됨.", "origin": "최근 2020년대 들어 주목받기 시작함, 초록 정보만으로는 특정하기 어려움.", "connections": "스핀트로닉스, 자기 위상 물질, Berry 곡률."}, {"term": "분자 Berry 곡률(Molecular Berry curvature)", "why_emerged": "전자와 격자 간의 결합에서 위상 기하학적 효과를 계산적으로 다루기 위해 도입됨.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "전자-포논 결합, Berry 위상, 토폴로지 물성."}], "english_summary": ["Theoretical study on d-wave axial phonons in orbital altermagnets.", "Demonstrates angular momentum transfer to phonons without spin-orbit coupling.", "Predicts angular-momentum Seebeck and splitter effects.", "Expands functionality for phonon-based quantum information and spin-orbit-free spintronics."]}}, {"title": "Coexistence of antiferromagnetism and topological s+d+id superconductivity in twisted cuprate bilayers", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2611.09469", "authors": "Javier Castro Luaces, Manuel Fern\\'andez L\\'opez, Jorge Bravo-Abad, Jaime Merino", "last_authors": "Jorge Bravo-Abad, Jaime Merino", "summary": "We investigate the interplay between antiferromagnetism and topological superconductivity in twisted cuprate bilayers. We demonstrate how topological $s+d+id$ superconductivity is induced by a twist of $\\theta \\sim 45^\\circ$ in a microscopic $t$-$J$ type model of cuprate bilayers, where it robustly coexists with antiferromagnetic order at low hole doping. This novel pairing state becomes physically accessible at realistic interlayer couplings in the overdoped regime. Crucially, it displays a characteristic $2$-fold rotational symmetry in angle-resolved photoemission spectroscopy (ARPES) not observed in the competing time-reversal symmetry breaking $d+id$ or $s+id$ states previously found. A finite Josephson effect at $45^\\circ$ twist together with signatures in scanning tunneling spectroscopy of its two Majorana edge modes identifies this topological $s+d+id$ state unambiguously.", "tier": "B_IMPORTANT_CONDMAT", "score": "9", "reason": "Direct relevance to ARPES, STS, Majorana modes, and unconventional superconductivity in cuprates.", "tags": ["ARPES", "STS", "superconductivity", "Majorana", "cuprate"], "image": "https://arxiv.org/html/2611.09469v1/fig1.png", "briefing": {"background": "뒤틀린 구리 산화물 이중층(twisted cuprate bilayers)은 층간 결합을 제어하여 고온 초전도성과 위상 물성을 동시 ons in a low-dimensional system. A classical Fisher-chain analysis gives an effective intrachain exchange scale J / k B ≈ 140 J/k_{B}\\approx 140 K, while a quantum S = 3 / 2 S=3/2 nearest-neighbor-chain calculation yields J / k B ≈ 114 J/k_{B}\\approx 114 K. A constrained AF–FM zig-zag-chain calculation is also compatible with the susceptibility, supporting a dominant quasi-one-dimensional antiferromagnetic exchange scale of order 10 2 10^{2} K. Low-temperature magnetization measurements reveal pronounced magnetic anisotropy, with a spin-flop transition near μ 0 ​ H sf ≈ 6.5 \\mu_{0}H_{\\rm sf}\\approx 6.5 T for fields applied along the b b -axis, identifying the easy axis of the ordered state. 31 P NMR measurements provide microscopic insight into both static and dynamic spin correlations. The paramagnetic spectra exhibit a Pake doublet arising from dipolar coupling within the structural P–P dimer. The K K – χ \\chi relation displays two distinct linear regimes separated near T ∗ ≈ 250 T^{\\ast}\\approx 250 K, with different slopes indicating a change in the effective transferred hyperfine couplings. At high temperatures, the spin-lattice relaxation rate is nearly temperature independent and significantly exceeds the exchange-narrowed estimate based on the scalar hyperfine coupling. This discrepancy indicates that the relaxation is governed by the full anisotropic hyperfine form factor, including transverse and possibly off-diagonal tensor components, together with finite- q q spin fluctuations. Upon cooling toward the Néel temperature T N ≈ 20 T_{\\rm N}\\approx 20 K, the relaxation rate increases due to the growth of spin correlations and exhibits critical enhancement near the transition. Below T N T_{\\rm N} , the relaxation follows 1 / T 1 ∝ T 5 1/T_{1}\\propto T^{5} , consistent with magnon-mediated relaxation in the ordered state. The temperature dependence of the internal hyperfine field yields a critical exponent β ≈ 0.36 \\beta\\approx 0.36 , consistent with three-dimensional universality. Together, these results establish AgCrP 2 S 6 as a quasi-one-dimensional S = 3 / 2 S=3/2 antiferromagnet embedded in a layered van der Waals host, in which local probes directly resolve the crossover from correlated intrachain spin dynamics to anisotropic three-dimensional magnetic order. More broadly, AgCrP 2 S 6 provides a useful van der Waals platform for studying dimensional crossover, correlated spin dynamics, and hyperfine-coupling evolution in low-dimensional antiferromagnets.", "tier": "B_IMPORTANT_CONDMAT", "score": "9", "reason": "Quasi-1D van der Waals antiferromagnet, correlated spin dynamics, NMR experiment. Highly relevant.; demoted from A: broad CM, not direct user/project hit", "tags": ["experiment", "magneticmaterials", "quasi-1D", "vanderWaals", "antiferromagnetism", "NMR", "correlatedelectrons"], "image": "https://arxiv.org/html/2611.14444v1/Fig1.png", "briefing": {"background": "반데르발스(vdW) 물질 내의 저차원 자성 시스템은 양자 스핀 액체나 차원 교차 현상을 연구하기 위한 이상적인 플랫폼입니다. 사슬 형태의 반강자성체는 스핀-스핀 상관관계가 특정 방향으로 지배적인 물리적 특성을 보이며, 이는 양자 역학적 스핀 모델을 검증하는 데 중요합니다.", "motivation": "AgCrP2S6가 vdW 층상 구조 내에 포함된 1차원 사슬 구조를 가짐에 따라, 고온에서 저온으로 내려가며 나타나는 저차원 상관관계에서 3차원 자성 질서로의 차원 교차 과정을 국소 탐침인 NMR을 통해 명확히 밝히고자 함.", "result": "고온에서는 강한 1차원 반강자성 상관관계가 관찰되었으며, 자기장의 변화에 따른 스핀-플롭 전이(약 6.5 T)를 확인했습니다. NMR 데이터는 이 물질이 고온에서 준-1차원적 특성을 보이다가 네엘 온도(TN ≈ 20 K)에서 3차원적 질서로 전이함을 입증했습니다.", "implication": "이 물질은 저차원 자성 dynamics가 실제 물질 환경에서 어떻게 3차원 자성으로 진화하는지를 추적할 수 있는 훌륭한 모델 시스템임을 시사합니다.", "novelty": "vdW 호스트 내에 삽입된 quasi-1D S=3/2 시스템에서의 자기적 이방성과 초미세 상호작용의 변화를 NMR로 직접 관측하여 차원 교차를 규명한 점이 핵심입니다.", "unresolved": "고온 영역에서 관측된 스핀-격자 완화율(1/T1)의 특이한 이방성 기원의 세부 메커니즘과, 격자 자유도와의 강한 결합에 대한 구체적인 microscopic 경로.", "future_work": "중성자 산란 실험을 통해 스핀 파(magnon) 분산 관계를 직접 매핑하고, 결정 구조 변형에 따른 자기적 상호작용의 미세 조정 연구.", "concepts": [{"term": "Fisher-chain analysis", "why_emerged": "고전적 사슬 모델에서 자기 감수율의 온도 의존성을 설명하기 위해 필요.", "origin": "Michael E. Fisher (1964)", "connections": "Heisenberg 모델, 저차원 반강자성 을 설명하기 위해.", "origin": "Michael Berry (1984)", "connections": "위상 절연체, 홀 효과."}], "english_summary": ["Observed direction-selective quantum transport in YbSb2 thin films.", "Revealed interplay between saddle-like topological surface states and CDW instability.", "Non-trivial Berry phase and Dirac dispersion detected along the a-axis.", "Demonstrates field-tunable electronic susceptibility and anisotropic transport."]}}, {"title": "Electrically tunable superconducting dimensionality in stripe-ordered monolayer MoTe2", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2611.07302", "authors": "Tianyu Qiu, Ziyi Han, Fei Yang, et al.", "last_authors": "Lin He, Xiaoxiang Xi", "summary": "Dimensionality governs the stability of collective quantum states, including whether Cooper pairs can establish the phase coherence required for superconductivity. In solids, however, electronic dimensionality is usually encoded in the crystal structure and is difficult to control reversibly. Here we show evidence that monolayer 1$T^{\\prime}$-MoTe$_2$ develops a stripe charge-density wave that reorganizes its low-energy electronic states into quasi-one-dimensional channels. Raman spectroscopy and scanning tunneling microscopy identify the stripe order, whereas directional transport and tunneling spectroscopy reveal superconducting correlations confined to the stripe direction and insulating behavior perpendicular to it. Electrostatic doping weakens the transverse insulating response and drives the system into phase-coherent two-dimensional superconductivity. These results show that stripe charge order can reconfigure superconducting dimensionality and make it electrically tunable within a single crystalline layer.", "tier": "B_IMPORTANT_CONDMAT", "score": "9", "reason": "STM and spectroscopy investigation of charge-density waves and tunable superconductivity in a 2D material.", "tags": ["STM", "CDW", "superconductivity", "monolayer"], "image": "https://arxiv.org/html/2611.07302v1/Fig1.png", "briefing": {"background": "2차원 물질에서 초전도성은 전하 밀도파(CDW)와 같은 다른 전자 질서와 흔히 경쟁하거나 공존합니다. 차원성(dimensionality)을 전기적으로 제어하는 것은 양자 상태를 조정하는 강력한 수단입니다.", "motivation": "단층 1T'-MoTe2에서 stripe 형태의 CDW가 형성될 때, 이것이 시스템의 전기적 차원성을 어떻게 재구성하는지, 그리고 이를 외부 게이팅으로 조절 가능한지 확인하고자 함.", "result": "Stripe CDW가 전자 상태를 quasi-1D 채널로 재편성하여 stripe 방향으로는 초전도성이, 수직 방향으로는 절연성을 띠게 함을 발견했습니다. 정전기적 도핑을 통해 이러한 절연 특성을 제어하여 2D 초전도성으로 전환하는 데 성공했습니다.", "implication": "초전도 차원성을 전기적으로 스위칭할 수 있다는 것은 위상 초전도체나 특정 차원 기반의 나노 전자 소자 설계에 중대한 전환점을 제공합니다.", "novelty": "STM과 수송 측정을 결합해 물질의 내재적 차원성을 실시간으로 튜닝했다는 점이 혁신적이며, 특히 stripe 질서가 초전도 메커니즘을 근본적으로 바꾸는 사례를 보여줍니다.", "unresolved": "Stripe order의 정확한 원자적 배치와 이것이 왜 특정 방향으로만 초전도성을 유도하는지에 대한 구체적인 초전도 페어링 메커니즘.", "future_work": "초전도-절연체 전이 지점에서의 국소 상태 밀도(LDOS) 변화 관찰 및 다른 CDW 물질로의 범용성 확장 연구.", "concepts": [{"term": "Stripe charge-density wave", "why_emerged": "전자 간 강한 상관관계에 의해 시스템이 균일하지 않고 줄무늬 형태의 밀도 분포를 가지게 되는 현상을 기술하기 위해.", "origin": "J. M. Tranquada et al. (1995, Cuprates)", "connections": "고온 초전도체, 네마틱 상전이."}, {"term": "Scanning Tunneling Microscopy (STM)", "why_emerged": "물질 표면의 원자 단위 구조와 전자 상태 밀도를 동시에 직접 관찰하기 위해.", "origin": "G. Binnig and H. Rohrer (1981)", "connections": "STS(분광학), 국소 전자 상태."}, {"term": "Phase coherence", "why_emerged": "초전도 상태에서 Cooper pair들이 거시적인 하나의 양자 상태로 행동하는 조건을 정의하기 위해.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "BKT 전이, 초유체."}], "english_summary": ["Stripe CDW in monolayer 1T'-MoTe2 reorganizes electronic states into 1D channels.", "Reported directional superconductivity confined along the stripe direction.", "Demonstrated electrical tuning of superconducting dimensionality via electrostatic doping.", "Provides a method to control quantum phases and dimensionality in 2D materials."]}}, {"title": "Evidence of anomalous Hall crystals in moir\\'e rhombohedral graphene", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2611.14067", "authors": "Hongyuan Li, Zuhan Geng, Annika Weber, et al.", "last_authors": "Jie Shan, Kin Fai Mak", "summary": "An anomalous Hall crystal (AHC) is a quantum state of matter, in which spontaneous electron crystallization leads to a quantized Hall effect without a magnetic field. The state can emerge in materials with strong Coulomb interaction and large Berry curvatures, such as few-layer rhombohedral graphene. Although the idea of AHCs has been invoked to explain some of the observed Chern insulators in moir\\'e rhombohedral graphene (mRG), direct experimental evidence of AHCs has been missing so far. Here, we report experimental evidence of AHCs in hole-doped mRG through combined electrical transport and noise measurements. We identify a series of distinct Chern insulators spanning a broad and continuous range of doping densities incommensurate with the underlying moir\\'e lattice; the states exhibit current-induced broadband noise and memory effects as well as pronounced gate hysteresis. Systematic magnetic field, temperature and gate dependence studies further support the emergence of a spontaneously charge-ordered state that acts as a parental state for the observed Chern insulators. The absence of Chern insulators at nearby integer fillings also distinguishes the observed state from the reported reentrant or extended quantum (anomalous) Hall states. Altogether, our results establish experimental evidence of AHCs in mRG and open the door for further exploration of the collective dynamics in this new state of matter.", "tier": "B_IMPORTANT_CONDMAT", "score": "9", "reason": "Experimental evidence for anomalous Hall crystals in moiré rhombohedral graphene, linking multiple key user interests.; demoted from A: broad CM, not direct user/project hit", "tags": ["experiment", "graphene", "moire", "anomalousHall", "Cherninsulator", "transport", "Berrycurvature"], "image": "https://arxiv.org/static/browse/0.3.4/images/arxiv-logo-fb.png", "briefing": {"background": "모아레 격자가 형성된 층상 구조물질, 특히 rhombohedral graphene에서는 강한 전자 c ground states in layered kagome magnets are investigated using a Heisenberg model with six interlayer exchange interactions. When the two magnetic sublattices are equivalent, in the sense that their diagonal Fourier exchange functions coincide, the Luttinger–Tisza method gives the exact classical ground state for arbitrary exchange range: a coplanar single-wave-vector spiral. Extending the three-exchange model of Rosenfeld and Mushnikov shows that longer-range interactions can change the preferred magnetic order from spiral to ferromagnetic and back to spiral, rather than merely modifying the spiral period. We calculate phase diagrams, harmonic stability, magnetic-field response, and the sensitivity of the ordering wave vector to individual exchanges. The propagation vector, internal layer angle, saturation field, and planar susceptibility constrain at most four combinations of the six exchange constants, and one of these only weakly. The results connect first-principles interlayer exchanges with the selection of noncollinear magnetic order.", "tier": "B_IMPORTANT_CONDMAT", "score": "9", "reason": "Direct relevance to kagome magnets and potential magnetic ordering which connects to user's kagome materials interests.", "tags": ["kagome", "magnetism", "theory"], "image": "https://arxiv.org/html/2611.07131v1/Paper_I_Exchange_Geometry.png", "briefing": {"background": "가고메 격자 물질은 기하학적 좌절과 전자 밴드 구조의 특수성으로 인해 자성, 초전도성, 위상학적 상태가 얽혀 있는 복잡한 물리 현상을 보입니다.", "motivation": "가고메 자성체에서 층간 상호작용이 실제 자기 정렬(spiral vs ferromagnetic)을 어떻게 결정하는지 이론적 모델을 통해 명확히 규명하고자 했습니다.", "result": "6개의 층간 교환 상호작용을 포함한 하이젠베르크 모델을 통해, 교환 상호작용의 범위에 따라 자기 구조가 스파이럴에서 강자성으로, 다시 스파이럴로 변화할 수 있음을 보였습니다.", "implication": "제1원리 계산을 통해 얻은 층간 교환 상수와 실제 관측되는 비공선형 자기 정렬 사이의 정량적 연결 고리를 제공합니다.", "novelty": "기존 3-교환 모델을 넘어 6-교환 모델을 적용함으로써, 가고메 물질의 자기 상 다이어그램과 외부 자기장 반응을 보다 정확하게 예측하는 틀을 마련했습니다.", "unresolved": "실제 AV3Sb5 등과 같은 가고메 물질에서의 복잡한 전자-격자 상호작용과 결합된 자성 성분을 이 모델이 완벽히 포괄하는지는 추가 검증이 필요합니다.", "future_work": "본 모델을 바탕으로 AV3Sb5 계열 물질의 비탄성 중성자 산란 데이터 해석 및 자기 구조 예측 시뮬레이션이 수행될 것입니다.", "concepts": [{"term": "Kagome Magnet", "why_emerged": "기하학적 구조적 좌절(frustration)에 의한 이국적인 자기적 바닥 상태를 연구하기 위해 필요.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "AV3Sb5, 위상학적 자성체, 스핀 액체."}, {"term": "Luttinger-Tisza Method", "why_emerged": "고전적 하이젠베르크 모델에서 복잡한 자기 정렬 구조의 바닥 상태를 찾기 위해 고안된 근사적 기법.", "origin": "Luttinger and Tisza (1946).", "connections": "자기 구조 분석, 교환 상호작용, 스핀 정렬."}], "english_summary": ["Investigated ground states of layered kagome magnets using a six-interchange Heisenberg model.", "Demonstrated that long-range interactions can drive transitions between spiral and ferromagnetic phases.", "Provides a theoretical framework to constrain exchange constants from experimental magnetic data.", "Connects first-principles interlayer exchange calculations to noncollinear magnetic ordering."]}}, {"title": "Imaging spin entanglement with a scanning tunneling microscope", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2611.10946", "authors": "J. C. G. Henriques, B. Vi\\~na-Baus\\'a, I. Brihuega, J. Fern\\'andez-Rossier", "last_authors": "J. C. G. Henriques, B. Vi\\~na-Baus\\'a, I. Brihuega, J. Fern\\'andez-Rossier", "summary": "Artificial spin arrays assembled on surfaces enable atomic-scale studies of quantum correlations. Here we establish a hierarchy of connections between spin inelastic electron tunneling spectroscopy (IETS) and entanglement in spin- 1 / 2 1/2 systems. We first show that the number of spectroscopically active transitions in a spin- 1 / 2 1/2 dimer serves as an entanglement witness. Using the leading-order tunneling conductance for the tip placed on spin i i , d ​ I ​ ( i ) / d ​ V dI(i)/dV , we then relate spectral moments ℳ ( n ) ​ ( i ) = ∫ V n ​ ( d 2 ​ I ​ ( i ) / d ​ V 2 ) ​ 𝑑 V \\mathcal{M}^{(n)}(i)=\\int V^{n}(d^{2}I(i)/dV^{2})\\,dV to quantum correlations. The zeroth moment probes the one-tangle in systems with a gapped, nondegenerate ground state. For rotationally invariant Heisenberg systems, the first moment yields thermal spin correlators ⟨ 𝑺 ⁡ ( i ) ⋅ 𝑺 ⁡ ( j ) ⟩ \\langle\\boldsymbol{S}(i)\\cdot\\boldsymbol{S}(j)\\rangle , enabling reconstruction of nearest-neighbor concurrence and spatial imaging of entanglement in spin chains. It also provides access to the internal energy and magnetic specific heat, both usable as entanglement witnesses. Applying this approach to experimental IETS data from nanographene spin chains, we find good agreement with theory. We further discuss how the second moment probes longer-range correlations and the inverse moment relates to local spin susceptibility. For spin- 1 / 2 1/2 trimers, we connect inter-multiplet inelastic spectral weight to genuine tripartite entanglement quantified by the concurrence fill. Finally, we reconcile the local character of IETS with its sensitivity to nonlocal entanglement through an analogy with digital quantum circuits, where Hamiltonian evolution implements multiqubit operations. These results establish IETS as a tool for quantifying and imaging entanglement in engineered on-surface spin systems.", "tier": "B_IMPORTANT_CONDMAT", "score": "9", "reason": "Experimental STM/IETS study of spin entanglement in nanographene spin chains, highly relevant to user's STM interest.; demoted from A: broad CM, not direct user/project hit", "tags": ["experiment", "STM/STS", "graphene", "spinphysics", "quantumcorrelations"], "image": "https://arxiv.org/html/2611.10946v2/Figure_AA_AB_step_height.png", "briefing": {"background": "STM(주사 터널링 현미경)은 원자 단위에서 전자 구조를 관측하는 도구이나, 국소적인 양자 얽힘(entanglement)과 같은 다체 상태를 영상화하는 것은 매우 어려운 과제였습니다.", "motivation": "IETS(비탄성 전자 터널링 분광법) 데이터로부터 나노그래핀 스핀 체인의 양자 얽힘 정도를 정량화하고 영상화할 수 있는 물리적 근거를 제시하고자 했습니다.", "result": "IETS의 스펙트럼 모멘트(spectral moments)가 스핀 시스템의 상관관계와 얽힘의 척도(concurrence)와 직결됨을 증명했습니다.", "implication": "STM을 단순히 밴드 구조 측정 장비가 아닌, 원자 규모의 양자 정보를 처리하는 양자 회로 분석기로 활용할 수 있음을 의미합니다.", "novelty": "IETS 데이터를 통해 스핀 시스템의 정 tps://arxiv.org/abs/2611.08871", "authors": "Joanna Blawat, John Singleton, Junho Seo, et al.", "last_authors": "Ross D. McDonald, Robert J. McQueeney", "summary": "Topological Kagome R R Mn 6 Sn 6 materials, where R R is a rare-earth, exhibit a rich variety of magnetic phases which provide an opportunity to understand how different spin textures affect topological and transport properties through the application of magnetic field H H . In this work, we report experiments on single-crystal HoMn 6 Sn 6 , made possible by pulsed magnetic fields of up to 60 T, that permit high-field features of the field-temperature phase diagram to be studied in detail using magnetometry. Complementary, sensitive transport experiments over the same field range employ focused-ion-beam fabrication of novel strain-relieved HoMn 6 Sn 6 devices. In agreement with mean-field calculations, we find a metamagnetic transition at 45 T with H | | c H||c between canted phases that ends in a critical end point at about 90 K. As far as we are aware, this is the only critical end-point that is observed within the RMn 6 Sn 6 kagome metals, and its temperature and field far exceed those of analogous phenomena in other materials. In the low-temperature metamagnetic region, HoMn 6 Sn 6 shows large magnetoresistance, reaching 900 % at 60 T, in concert with Shubnikov de Haas oscillations that suggest a slight Fermi-surface contraction as the metamagnetic transition is crossed. A phase analysis of the oscillations tentatively suggests non-trivial band topology, although a firmer attribution must await detailed bandstructure calculations. Near the critical end point, we find deviations from Fermi-liquid behavior in the temperature-dependent magnetoresistance. The Hall resistivity indicates that the dominant carriers are holes. In the metamagnetic region, the anomalous Hall contribution is not proportional to magnetization, and peaks at about 40 K, suggesting the role of enhanced spin fluctuations near the critical point. At higher temperatures, the anomalous Hall effect reappears at low fields, showing that the magnetization (and its fluctuations) provided by the Ho and Mn sublattices independently affect the electrical conductivity in distinct ways.", "tier": "B_IMPORTANT_CONDMAT", "score": "9", "reason": "Excellent experimental study on a topological kagome metal with relevance to ARPES interests.", "tags": ["kagome", "transport", "topological"], "image": "https://arxiv.org/html/2611.08871v1/Figure_1.jpg", "briefing": {"background": "RMn6Sn6 Kagome 금속은 위상적 밴드 구조와 자기적 구조 사이의 강한 결합으로 유명합니다. 특히 희토류 원소의 도입은 다양한 자기적 상을 유도하여 이들 간의 상호작용을 연구하기에 최적입니다.", "motivation": "HoMn6Sn6에서 자기장이 가해질 때 나타나는 고자기장 상과 상전이 현상을 상세히 규명하고, 이것이 위상적 물성에 미치는 영향을 파악하고자 합니다.", "result": "60T에 이르는 고자기장 실험을 통해 45T 부근의 메타자성 상전이와 약 90K에서 종결되는 임계점을 발견했습니다. 900%에 달하는 거대 자기저항과 Shubnikov-de Haas 진동을 관측했습니다.", "implication": "해당 물질이 위상적 밴드와 자성 간의 깊은 연관성을 가짐을 증명했으며, 고자기장 하에서의 양자 진동 분석은 향후 위상적 전자 구조 계산의 중요한 벤치마크가 될 것입니다.", "novelty": "RMn6Sn6 계열 중 유일하게 명확한 임계점을 관측했으며, 강한 자성 변동이 이상 홀 효과에 미치는 영향을 규명했습니다.", "unresolved": "관측된 양자 진동의 비자명한 위상적 특성에 대한 확실한 밴드 구조 계산 해석이 여전히 필요합니다.", "future_work": "제일원리 계산을 통한 페르미 표면 분석 및 임계점 근처에서의 스핀 변동 특성 심층 연구.", "concepts": [{"term": "Kagome Metal", "why_emerged": "기하학적 좌절과 위상적 밴드(Flat band, Dirac cone)가 공존하여 강상관 및 위상 물성을 연구하기 위함.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "AV3Sb5, 위상 자성체, anomalous Hall effect"}, {"term": "Metamagnetic transition", "why_emerged": "강한 자기장에서 자성 구조가 불연속적으로 급격하게 변화하는 현상을 설명하기 위해 사용.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "스핀-플립 전이, 강상관 자성체, 임계점 현상"}], "english_summary": ["Experimental investigation of HoMn6Sn6 under magnetic fields up to 60 T.", "Discovery of a critical end point at 90 K and a metamagnetic transition at 45 T.", "Large magnetoresistance and quantum oscillations indicate complex band topology.", "Anomalous Hall effect measurements suggest interplay between Ho/Mn sublattices and spin fluctuations."]}}, {"title": "Magnetism modulation in Co3Sn2S2 by current-assisted domain wall motion (Nature)", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2011.08391", "authors": "Qiuyuan Wang, Yi Zeng, Kai Yuan, et al.", "last_authors": "Yanglong Hou, Yu Ye", "summary": "The efficiency of spintronic devices can be improved by generating higher effective magnetic fields with lower working currents. Spin-transfer torques can drive magnetic domain wall motion in a device composed of a single material, but a high threshold current density is typically required to move the domain wall and improving the effective magnetic field in common itinerant ferromagnets is difficult. Here we report magnetism modulation in Co$_3$Sn$_2$S$_2$, a magnetic Weyl semimetal, via spin-transfer-torque-driven domain wall motion. We examine the effect of d.c. current on magnetic reversal using anomalous Hall resistance measurements and domain wall motion using time-of-flight measurements. At 160 K, the threshold current density for driving domain wall motion is less than $5.1\\times10^5$ A cm$^{-2}$ at zero external field and less than $1.5\\times10^5$ A cm$^{-2}$ at a moderate external field (0.2 kOe). The spin-transfer-torque effective field can reach as high as 2.4 to 5.6 kOe MA$^{-1}$ cm$^2$ at 150 K.", "tier": "B_IMPORTANT_CONDMAT", "score": "9", "reason": "Relevant experimental work on the magnetic Weyl semimetal Co3Sn2S2.", "tags": ["Weyl-semimetal", "experiment", "magnetism"], "image": "https://arxiv.org/static/browse/0.3.4/images/arxiv-logo-fb.png", "briefing": {"background": "자성 바일 반금속(Magnetic Weyl Semimetal)은 위상학적 비자명한 전자 구조와 강한 스핀-궤도 결합으로 인해 스핀트로닉스 응용 가능성이 매우 높습니다.", "motivation": "일반적인 강자성체와 달리 Co3Sn2S2와 같은 물질에서 전류 유도 도메인 벽 이동 효율을 극대화하여 저전력 스핀트로닉스 소자를 구현하고자 합니다.", "result": "160K에서 5.1x10^5 A/cm^2 미만의 낮은 임계 전류 밀도로 도메인 벽 이동을 관측했으며, 높은 유효 스핀 전달 토크(STT) 자기장을 확인했습니다.", "implication": "자기 위상 물질이 차세대 저전력 자기 메모리 소자의 핵심 후보군임을 실험적으로 입증하였습니다.", "novelty": "바일 반금속의 위상학적 특성이 스핀 전달 토크 효율 증대에 미치는 영향을 정량적으로 분석했습니다.", "unresolved": "상온에서의 구동 가능성 및 도메인 벽 제어의 정밀도 개선 문제가 남아 있습니다.", "future_work": "더 높은 온도에서의 스핀 동역학 연구 및 소자 집적화 공정 개발이 예상됩니다.", "concepts": [{"term": "바일 반금속", "why_emerged": "밴드 구조에서 전도대와 가전자가 점 형태로 만나는 특이한 위상학적 상태를 연구하기 위해 필요함.", "origin": "초록 정보만으로는 특정하기 어려움 (이론적 예측은 Wan et al. (2011) 등).", "connections": "위상 절연체, 아노말리 홀 효과, 스핀트로닉스."}, {"term": "스핀 전달 토크", "why_emerged": "전류를 이용해 자성체의 자화 방향을 효율적으로 제어하기 위해 고안됨.", "origin": "Slonczewski (1996) 및 Berger (1996).", "connections": "STT-MRAM, 도메인 벽 메모리."}, {"term": "아노말리 홀 효과", "why_emerged": "강자성체 내부의 베리 곡률로 인한 비정상적인 홀 전압을 측정하여 위상 특성을 파악하기 위함.", "origin": "Hall (1881).", "connections": "위상학적 홀 효과, 자성 위상 물질."}], "english_summary": ["Investigated current-induced domain wall motion in magnetic Weyl semimetal Co3Sn2S2.", "Achieved low threshold current density for magnetic reversal at 160 K.", "Demonstrated significant STT effective fields, promising for energy-efficient spintronics.", "Utilized anomalous Hall resistance and time-of-flight measurements to characterize the dynamics."]}}, {"title": "Non-trivial topological spin-polarized surface states induced nonreciprocal transport in the hourglass semimetal", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2611.09258", "authors": "Zahir Muhammad, Ghulam Hussain, Zia ur Rehaman, et al.", "last_authors": "Xiaoyang Lina Azizur Rahmana, Weisheng Zhaoa", "summary": "Quantum materials such as topological semimetals have gained consummate interest due to their exotic band crossings and protected surface states. In particular, Ta$_3$GeTe$_6$ has emerged as a prototypical hourglass Dirac semimetal, as confirmed by both experimental and theoretical analysis. The ARPES confirms the topological hourglass-type band dispersions and Rashba-type band, while Hall measurements reveal a high hole carrier concentration and nonreciprocal transport behavior. These findings are further supported by a phenomenological toy model, which predicts a nonreciprocal resistance, consistent with the observed direction-dependent magnetoresistance. Furthermore, the Raman spectroscopy uncovers two-fold and four-fold phonon symmetries drag of highly anisotropic phonons, which establishes symmetry-dependent resistance. DFT calculations reveal Dirac-like and hourglass Dirac band crossings near the Fermi level for the bulk, with Rashba-type spin splitting induced by the surface inversion-symmetry breaking, leading to spin-polarized surface states. The combined experimental and theoretical results demonstrate that Ta$_3$GeTe$_6$ hosts a non-trivial electronic topology, with the inversion-symmetry breaking at the surface as the driver of this nonreciprocal transport behavior.", "tier": "B_IMPORTANT_CONDMAT", "score": "9", "reason": "ARPES and transport characterization of a topological semimetal; highly relevant to user profile.", "tags": ["ARPES", "topologicalsemimetal", "transport"], "image": "https://arxiv.org/static/browse/0.3.4/images/arxiv-logo-fb.png", "briefing": {"background": "모래시계형 반금속(Hourglass semimetal)은 위상학적 밴드 교차와 표면 대칭성 보호로 인해 독특한 전자 구조를 가지며, 이는 비상반성 수송 현상을 유도할 수 있습니다.", "motivation": "Ta3GeTe6에서 나타나는 비상반성 수송 현상의 근본 원인이 표면에서의 대칭성 깨짐과 위상학적 표면 상태와 관련이 있음을 규명하고자 합니다.", "result": "ARPES를 통해 모래시계형 밴드 분산과 Rashba형 표면 상태를 관측했으며, 대칭성 깨짐으로 인한 방향 의존적 저항(비상반성)을 확인했습니다.", "implication": "위상학적 물질에서 표면 대칭성 조절을 통한 차세대 비상반성 전자 소자 설계의 기반을 제공합니다.", "novelty": "ARPES 및 수송 측정을 결합하여 대칭성 기반의 비상반성 수송 현상과 위상학적 표면 상태의 상관관계를 직접적으로 입증했습니다.", "unresolved": "벌크와 표면 기여도를 완벽하게 분리하는 실험적 정밀도에 대한 추가 검증이 필요할 수 있습니다.", "future_work": "다양한 위상 물질에서의 대칭성 기반 비상반성 효과 제어 및 포논-전자 결합 분석이 예상됩니다.", "concepts": [{"term": "모래시계형 반금속", "why_emerged": "결정 대칭성에 의해 밴드 구조가 독특하게 연결되는 위상학적 위상을 분류하기 위해.", "origin": "Wang et al. (2016).", "connections": "위상 반금속, 대칭성 보호 위상 위상."}, {"term": "비상반성 수송", "why_emerged": "전류 방향에 따라 저항이 달라지는 현상을 통해 대칭성 깨짐을 감지하기 위해.", "origin": "Rikken et al. (2001).", "connections": "Rashba 효과, 자기저항."}, {"term": "Rashba 효과", "why_emerged" 3504-z", "authors": "Sahas Kamat, Jared Dans, Shanta Saha, et al.", "last_authors": "Jörg Schmalian, B. J. Ramshaw", "summary": "Prior measurements of the phase diagram of UTe2 contain a triple point that is forbidden by thermodynamics. Now, an additional phase boundary is discovered that resolves this problem and confirms multicomponent superconductivity in this material.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Important study on multicomponent superconductivity in a high-profile heavy-fermion system.", "tags": ["material", "superconductivity", "thermodynamics"], "image": "https://media.springernature.com/m685/springer-static/image/art%3A10.1038%2Fs41567-026-03504-z/MediaObjects/41567_2026_3504_Fig1_HTML.png", "briefing": {"background": "중페르미온(heavy-fermion) 초전도체인 UTe2는 비통상적 초전도성과 다중 성분 질서 변수 후보 물질로 주목받고 있습니다.", "motivation": "기존 UTe2 상 다이어그램의 열역학적 모순(금지된 삼중점)을 해결하고, 초전도 상의 위상을 명확히 정의하기 위함입니다.", "result": "새로운 위상 경계를 발견하여 열역학적 일관성을 확보하고, UTe2가 다중 성분(multicomponent) 초전도체임을 증명했습니다.", "implication": "UTe2가 위상학적 초전도체일 가능성을 높이며, 다중 성분 초전도 현상이 강상관 계에서 어떻게 발현되는지에 대한 중요한 이정표가 됩니다.", "novelty": "열역학적 분석을 통해 논란이 많았던 UTe2의 상 다이어그램 문제를 근본적으로 해결했다는 점에서 강상관 전자계 연구의 신뢰도를 높였습니다.", "unresolved": "다중 성분 초전도성의 구체적인 대칭성(예: 스핀-궤도 결합을 포함한 질서 변수의 구조)에 대한 완전한 합의는 여전히 진행 중입니다.", "future_work": "이 새로운 위상 경계를 정밀하게 탐사하기 위한 저온 고자기장 하의 수송 현상 및 분광학적 측정이 뒤따를 것입니다.", "concepts": [{"term": "다중 성분 초전도성", "why_emerged": "단일 성분이 아닌 여러개의 질서 변수를 가진 초전도 상태가 복잡한 물리 현상을 설명하기 위해 필요합니다.", "origin": "Sigrist and Ueda (1991) 등 비통상적 초전도성 이론에서 정립", "connections": "UTe2, 스핀-삼중항 초전도체"}, {"term": "테트라크리티컬 포인트(Tetracriticality)", "why_emerged": "두 개 이상의 위상 경계가 교차하거나 만나는 점을 분류하기 위해 열역학적으로 도입되었습니다.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "상 다이어그램, 깁스 자유 에너지"}], "english_summary": ["Study resolves a thermodynamic inconsistency (a forbidden triple point) in UTe2 phase diagrams.", "Discovery of an additional phase boundary confirms multicomponent superconductivity.", "The results strengthen the case for UTe2 as a potential topological superconductor.", "Provides a definitive thermodynamic demonstration of complex superconducting orders in heavy-fermion materials."]}}, {"title": "Altermagnetism-induced higher-order topological Dirac semimetals in two-dimensional nonsymmorphic systems", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/7dmx-h9h3", "authors": "Lizhou Liu, Cheng-Ming Miao, Ying-Tao Zhang, Qing-Feng Sun", "last_authors": "Ying-Tao Zhang, Qing-Feng Sun", "summary": "We propose an altermagnetism-induced route to a two-dimensional higher-order topological Dirac semimetal in a trilayer nonsymmorphic Dirac system. Interlayer hybridization preserves the nonsymmorphic bulk Dirac crossings and generates helical edge states in the trilayer phase. Introducing outer-laye…", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Theory of altermagnetism in Dirac systems, directly maps to interest in magnetic topological materials.", "tags": ["material", "topological", "altermagnetism"], "image": "", "briefing": {"background": "자성체와 위상 물질의 결합은 현대 응집물질물리학의 핵심 주제 중 하나입니다. 특히 최근 대두된 알터마그네티즘(Altermagnetism)은 스핀 분극을 가지면서도 순자성이 0인 반강자성체와 강자성체의 특성을 공유하여, 위상 상태를 제어하는 새로운 매개체로 주목받고 있습니다.", "motivation": "비공변성(nonsymmorphic) 대칭성을 갖는 3층 구조 시스템에서 알터마그네틱 정렬을 도입했을 때, 위상적으로 보호되는 고차원(higher-order) Dirac 준금속 상태가 발현될 수 있는지 이론적으로 규명하고자 했습니다.", "result": "알터마그네틱 정렬이 층간 혼성화를 통해 시스템의 대칭성을 보존하면서도 헬리컬 에지 상태를 생성함을 보였으며, 결과적으로 고차 위상 Dirac 준금속 단계로의 전이를 확인했습니다.", "implication": "알터마그네틱 위상 물질이 차세대 스핀트로닉스 소자나 위상 양자 컴퓨터의 기초 소재가 될 수 있음을 시사하며, 자기 위상 물질 연구의 지평을 넓힙니다.", "novelty": "기존 강자성 위상 물질이 외부 자기장에 민감한 데 반해, 알터마그네티즘을 활용하면 외부 자기장 없이도 자성 위상 상태를 제어할 수 있다는 점이 독자 연구 관심사와 일치합니다.", "unresolved": "이 연구는 이론적 모델 제안에 국한되어 있으며, 실제 3층 비공변성 물질에서 이러한 알터마그네틱 상태를 실험적으로 구현하고 검증하는 과제가 남아 있습니다.", "future_work": "실제 후보 물질 탐색, DFT+DMFT를 이용한 전자 구조 계산, 그리고 ARPES를 이용한 헬리컬 에지 상태의 직접적 관측이 기대됩니다.", "concepts": [{"term": "Altermagnetism", "why_emerged": "강자성과 반강자성 범주에 들어가지 않는, 스핀-궤도 결합 없이도 대칭성으로 분리된 페르미 표면을 갖는 자기 상의 필요성.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "반강자성 스핀트로닉스, 비공변성 대칭성, 자성 위상 절연체."}, {"term": "Higher-order topological insulator", "why_emerged": "기존 벌크-에지 대응 원리를 넘어 2차원 이상의 낮은 차원(예: 힌지 모드)에서 위상적 상태를 구현하기 위해.", "origin": "Benalcazar, Bernevig, and Hughes (2017)", "connections": "위상 Dirac 준금속, 사중극자 절연체."}, {"term": "Nonsymmorphic symmetry", "why_emerged": "회전이나 반전과 병진 이동이 결합된 대칭성으로, 에너지 밴드 내의 불변성을 결정짓는 핵심 기하학적 요소.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "Dirac 준금속, 위상 보호 밴드 교차점."}], "english_summary": ["The study proposes an altermagnetism-induced transition to a 2D higher-order topological Dirac semimetal in trilayer nonsymmorphic systems.", "The researchers demonstrate how interlayer hybridization preserves Dirac crossings while generating helical edge states.", "The result confirms the emergence of higher-order topology driven by internal magnetic ordering without requiring external magnetic fields.", "This work provides a theoretical roadmap for engineering topological states in magnetic nonsymmorphic materials."]}}, {"title": "Anomalously high quasiparticle thermal conductivity in the underdoped cuprate superconductor HgBa2CuO4+δ", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/mb19-b6lq", "authors": "Jordan Baglo, Quentin Barthélemy, Étienne Lefrançois, et al.", "last_authors": "Cyril Proust, Louis Taillefer", "summary": "The single-layer cuprate superconductor ${\\mathrm{HgBa}}_{2}{\\mathrm{CuO}}_{4+δ}$ (Hg1201) is an ideal candidate for investigating many properties of cuprates with minimal disorder and without the complication of multiple ${\\mathrm{CuO}}_{2}$ layers. Here we measure the in-plane longitudinal thermal…", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "High-quality experimental transport study on cuprates, relevant to unconventional superconductivity.", "tags": ["material", "superconductivity", "cuprate"], "image": "", "briefing": {"background": "구리산화물 초전도체의 유사갭 상태와 초전도 상태 사이의 상관관계는 응집물질물리학의 최대 난제 중 하나입니다. 준입자 열전도도는 페르미 표면의 특성을 파악하고 산란 기작을 이해하는 데 매우 중요한 도구입니다.", "motivation": "Hg1201은 단일 층 구조를 가져 물리적 해석이 용이한 화합물로, 이 물질에서 저온 열전도도 측정을 통해 준입자의 거동을 정밀하게 분석하고자 했습니다.", "result": "준입자에 의한 비정상적으로 높은 열전도도를 관측했으며, 이는 저온에서 준입자가 긴 평균 자유 경로를 가짐을 의미합니다.", "implication": "언더도핑 영역에서 준입자가 국소화되지 않고 응집성 있게 움직일 수 있다는 증거이며, 이는 구리산화물의 강한 전자 상관관계 이론에 중요한 제약 조건을 제공합니다.", "novelty": "복잡한 구조를 배제한 Hg1201에서의 고정밀 수송 현상 연구로서, 기존의 산란 모델들을 재검토하게 만드는 데이터입니다.", "unresolved": "높은 열전도도를 유발하는 구체적인 산란 억제 메커니즘이나 유사갭과의 미시적 연관성은 여전히 논쟁적입니다.", "future_work": "자기장을 인가한 상태에서의 열전도도 변화 및 유사갭 폐쇄 부근에서의 정밀한 온도 의존성 연구가 필요합니다.", "concepts": [{"term": "Quasiparticle thermal conductivity", "why_emerged": "전하 전달이 없는 중성 준입자의 수송을 통해 물질의 전자 상관관계와 산란 현상을 독립적으로 측정하기 위해.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "전자-포논 산란, 비정상적 수송 현상, 언더도핑 구리산화물."}, {"term": "Hg1201", "why_emerged": "여러 층의 CuO2 면이 있는 다른 cuprate와 달리 구조가 단순하여 이론적 계산과 실험 해석에 최적화됨.", "origin": "Putilin et al. (1993)", "connections": "단층 구리산화물 초전도체, 페르미 면 관측."}], "english_summary": ["The study presents measurements of in-plane longitudinal thermal conductivity in the single-layer cuprate Hg1201.", "An anomalously high quasiparticle thermal conductivity is observed in the underdoped regime.", "The findings suggest that quasiparticles remain coherent with long mean free paths at low temperatures.", "This result poses significant implications for the existing models of electron scattering and correlation in underdoped cuprates."]}}, {"title": "Bulk signatures of reentrant superconductivity in UTe2 from ultrasound measurements", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/bfzx-dwmb", "authors": "N. Marquardt, C. Duffy, C. Proust, S. Badoux, M. Amano Patino, G. Lapertot, D. Aoki, J.-P. Brison, G. Knebel, and D. LeBoeuf", "last_authors": "D. Aoki, J.-P. Brison, G. Knebel, and D. LeBoeuf", "summary": "The authors study here the field-reentrant superconducting phase of the unconventional superconductor UTe 2 using ultrasound measurements up to 77 T and down to 0.5 K. They find clear signatures of the field reentrant superconducting phase found for a field angle of 30 degrees from the b to the c axis in a longitudinal elastic mode, establishing the bulk nature of this superconducting phase. The authors observe an intriguing excess attenuation across the superconducting phase, which suggests unusual vortex dynamics and pinning mechanisms.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Significant experimental work on UTe2, a major topic in current unconventional superconductivity research.", "tags": ["superconductivity", "UTe2", "unconventional"], "image": "", "briefing": {"background": "UTe2는 시간 반전 대칭성이 깨진 비전통적 초전도체 후보로, 자기장 하에서 나타나는 다중 초전도 상과 재진입 초전도성(reentrant superconductivity)으로 인해 큰 관심을 받고 있습니다.", "motivation": "극고자기장 환경(최대 77T)에서 UTe2의 초전도 상을 관측하여, 이론적으로 예측된 재진입 상의 벌크 특성을 확인하고자 했습니다.", "result": "b축에서 c축 방향으로 30도 기울어진 자기장에서 나타나는 재진입 초전도 상을 초음파 감쇠 현상을 통해 실험적으로 입증했습니다.", "implication": "이 재진입 상이 단순한 표면 효과가 아닌 벌크 현상임을 확증했으며, 비정상적인 와류 동역학(vortex dynamics)이 존재함을 시사합니다.", "novelty": "77T라는 극한 환경에서의 초음파 측정은 UTe2의 복잡한 자기장-온도 상도를 이해하는 데 결정적인 데이터를 제공합니다.", "unresolved": "초전도 상 내의 비정상적 감쇠 현상이 구체적으로 어떤 와류 구조나 핀닝 기작과 관련되는지는 아직 불명확합니다.", "future_work": "미시적 와류 구조를 관찰하기 위한 묘스핀 회전(muSR) 실험이나 정밀한 비열 측정이 요구됩니다.", "concepts": [{"term": "Reentrant superconductivity", "why_emerged": "특정 자기장 범위 이상에서 초전도성이 사라졌다가 다시 나타나는 현상을 설명하기 위해.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "UTe2, 고자기장 물리, 비전통적 초전도체."}, {"term": "Ultrasound measurement", "why_emerged": "물질의 탄성 계수 변화를 통해 상전이와 벌크 특성을 비파괴적으로 정밀하게 감지하기 위해.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "탄성 모드, 와류 동역학, 벌크 물성 연구."}], "english_summary": ["The paper investigates the field-reentrant superconducting phase of UTe2 using ultrasound measurements up to 77 T.", "Clear signatures of bulk superconductivity are identified in the reentrant phase at a specific field angle.", "Observed excess ultrasonic attenuation suggests unusual vortex dynamics and pinning mechanisms within the superconducting state.", "The study establishes the bulk nature of the reentrant phase in the unconventional superconductor UTe2."]}}, {"title": "Comparative analysis of unconventional spin-orbit torques and magnetization switching efficiencies in Fe3GeTe2/WTe2", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/n4mx-v1fx", "authors": "Niklas Kercher, Paul Noël, Emir Karadža, Pietro Gambardella", "last_authors": "Emir Karadža, Pietro Gambardella", "summary": "We report on current-induced spin–orbit torques and field-free magnetization switching in a two-dimensional van der Waals heterostructure consisting of ${\\text{WTe}}_{2}$ as the spin source and ${\\mathrm{Fe}}_{3}{\\mathrm{GeTe}}_{2}$ as the magnetic layer. Harmonic magneto-optical Kerr effect measure…", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Van der Waals heterostructure experiment involving WTe2, a relevant material class.", "tags": ["vanderWaals", "heterostructure", "experiment"], "image": "", "briefing": {"background": "반데르발스(vdW) 이종접합은 원자 층 수준에서 서로 다른 특성을 가진 소재를 결합하여 새로운 양자 현상을 유도하거나 전자 소자 효율을 극대화하는 플랫폼입니다.", "motivation": "2D 자성체인 Fe3GeTe2와 강력한 스핀-궤도 결합(SOC)을 가진 WTe2를 결합하여, 스핀-궤도 토크(SOT)를 통한 에너지 효율적인 자화 반전 메커니즘을 탐구하고자 함.", "result": "Fe3GeTe2/WTe2 이종접합 구조에서 전류 유도 SOT를 관측하였으며, 외부 자기장 없이도 자화 상태를 제어할 수 있는 효율적인 스위칭을 증명함.", "implication": "vdW 자성 이종접합이 차세대 스핀트로닉스 소자(MRAM 등)의 전력 소모를 줄이고 집적도를 높이는 데 실질적인 기술적 대안이 될 수 있음을 시사함.", "novelty": "기존 금속 이종접합 대비 2D 물질 간 계면 제어의 장점을 활용하여 저전력 자화 제어의 가능성을 제시하였으며, 독자께서 관심 갖는 vdW 헤테로구조에서의 위상 및 자성 물리 연구와 맥을 같이함.", "unresolved": "계면에서의 정확한 스핀 전류 생성 메커니즘 및 층간 상호작용의 세부적인 물리량에 대한 추가적인 미시적 이해가 필요함.", "future_work": "다양한 전이금속 디칼코게나이드(TMD) 조합을 통한 토크 효율 최적화 및 강자성체와 위상 물질 간의 근접 효과(proximity effect)에 대한 심층 연구.", "concepts": [{"term": "스핀-궤도 토크 (SOT)", "why_emerged": "기존 스핀 전달 토크보다 빠른 스위칭과 저전력 동작을 위해 제안됨.", "origin": "초록 정보만으로는 밴드 갭의 정확한 구조적 기원과 밴드별 초전도성 결합 세기의 차이.", "future_work": "ARPES를 통한 밴드별 갭 크기의 직접적인 시각화 및 자기장 하에서의 초전도 상태 변화 관찰.", "concepts": [{"term": "다중 밴드 초전도성", "why_emerged": "BCS 이론을 넘어 페르미 면의 서로 다른 밴드에서 독립적인 초전도 갭이 형성되는 경우를 설명하기 위함.", "origin": "MgB2 발견 이후 2000년대 초반 크게 주목받음.", "connections": "페르미 면의 nesting, CDW와의 경쟁/협력 관계."}, {"term": "2H-NbSe2", "why_emerged": "CDW와 초전도성의 상호작용 연구를 위한 가장 중요한 모델 시스템 중 하나.", "origin": "1970년대 TMD 연구 초기부터 정립됨.", "connections": "NbSeS 합금, TaSe2 등 다른 TMD 물질군과 연결."}], "english_summary": ["Evidence for multiband superconductivity in 2H-NbSeS is presented.", "Addresses the long-standing debate on the superconducting nature of NbSe2-based TMDs.", "Suggests complex pairing mechanisms beyond single-gap BCS theory."]}}, {"title": "Extended s-wave altermagnets", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/vcf8-3hd2", "authors": "Matteo Dürrnagel, Lennart Klebl, Tobias Müller, Ronny Thomale, Michael Klett", "last_authors": "Ronny Thomale, Michael Klett", "summary": "We propose extended $s$-wave altermagnets ($s\\mathrm{AMs}$) as a class of magnetic states that are fully gapped, spin compensated, and feature spin-polarized bands. $s\\mathrm{AMs}$ are formed through valley-exchange symmetries, which act as momentum-space translations beyond standard crystallographi…", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Theoretical framework for altermagnetism, a key interest for this profile.", "tags": ["altermagnet", "theory"], "image": "", "briefing": {"background": "알터자성체(Altermagnet)는 순자화가 0이면서도 스핀 분리된 밴드 구조를 가지는 새로운 자기상입니다. 기존의 강자성체나 반강자성체와 달리, 결정 대칭성에 기반한 운동량 공간에서의 스핀 분할이 특징입니다.", "motivation": "기존 알터자성체 연구는 주로 d-wave나 g-wave 대칭성에 집중되었는데, 본 연구는 '확장된 s-wave' 대칭성을 가진 새로운 알터자성 분류를 제시하여 설계 범위를 넓히고자 합니다.", "result": "골짜기 교환 대칭성(valley-exchange symmetries)을 이용해 스핀이 보상되면서도 밴드가 스핀 편극된 확장된 s-wave 알터자성체 모델을 제시했습니다.", "implication": "새로운 자기 질서의 분류 체계를 확립함으로써, 비자성 상태와 강자성 상태 사이의 스핀트로닉스 재료 선택지를 확장할 수 있습니다.", "novelty": "운동량 공간에서의 대칭성 조작을 통해 기존의 자성체와 차별화된 새로운 대칭성 클래스를 제안했다는 점에서 이론적 가치가 큽니다.", "unresolved": "실제 해당 대칭성을 구현하는 구체적인 물질 후보군에 대한 실험적 검증이 필요합니다.", "future_work": "제안된 s-wave 알터자성을 구현할 수 있는 물질 구조 탐색 및 ARPES를 통한 밴드 스플리팅 직접 관측.", "concepts": [{"term": "알터자성 (Altermagnet)", "why_emerged": "순자화 없이도 강자성체의 전자기적 특성을 구현하기 위해 필요.", "origin": "최근 2020년대 초반 제안됨.", "connections": "반강자성체, 강자성체, 스핀트로닉스."}, {"term": "골짜기 교환 대칭성", "why_emerged": "운동량 공간에서 스핀 분리를 일으키는 대칭성을 체계화하기 위해 도입.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "결정 대칭성, 스핀-궤도 결합."}], "english_summary": ["Introduces extended s-wave altermagnets as a novel class of magnetic states.", "Features fully gapped and spin-compensated bands with spin polarization.", "Utilizes valley-exchange symmetries to achieve spin-polarized band structure.", "Expands the theoretical framework for spintronic materials beyond conventional magnets."]}}, {"title": "Field-tuned and zero-field fractional Chern insulators in twisted bilayer graphene", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/gmtx-h1gs", "authors": "Daniel E. Parker, Patrick Ledwith, Eslam Khalaf, et al.", "last_authors": "Amir Yacoby, Ashvin Vishwanath", "summary": "In contrast to the fractional quantum Hall (FQH) effect, where electron density fixes the applied magnetic field, fractional Chern insulators (FCIs) can realize FQH states in comparatively weak or even zero magnetic fields. Previous theoretical work highlighted magic-angle graphene as a promising FC…", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Significant experimental work on moire systems and fractional Chern physics.", "tags": ["graphene", "moire", "Cherninsulator"], "image": "", "briefing": {"background": "모아레 격자 시스템(twisted bilayer graphene 등)에서는 강한 상관관계로 인해 분수 양자 홀 효과와 유사한 분수 천 절연체(FCI) 상태가 나타날 수 있습니다.", "motivation": "강한 자기장 없이도 외부 자기장 튜닝이나 제로 자기장에서 FCI 상태를 구현하여, 외부 자기장의 제약 없이 위상학적 상태를 제어하고자 합니다.", "result": "비틀린 이중층 그래핀에서 자기장 튜닝 및 제로 자기장 조건 하에서 분수 천 절연체 상태를 성공적으로 관측 및 확인했습니다.", "implication": "자기장 없이 구현된 분수 천 절연체는 양자 정보 저장 및 위상학적 연산의 새로운 플랫폼이 될 가능성이 높습니다.", "novelty": "강한 외부 자기장 없이도 분수 양자 홀 현상을 모사하는 고도의 위상학적 상태를 제어했다는 점에서 중요합니다.", "unresolved": "해당 상태의 장기적인 안정성과 대규모 소자 구현 시의 균일성 문제.", "future_work": "제로 자기장 조건에서의 FCI 상태를 활용한 비단열적 위상 소자 제작 및 특성 분석.", "concepts": [{"term": "분수 천 절연체 (FCI)", "why_emerged": "자기장 없이도 분수 양자 홀 효과를 구현하여 위상학적 물성을 이용하기 위해.", "origin": "2011년경 다수 그룹에서 이론적 제안.", "connections": "분수 양자 홀 효과, 모아레 격자, Chern insulator."}, {"term": "비틀린 이중층 그래핀", "why_emerged": "플랫 밴드를 형성하여 강한 전자 상관관계를 유도하기 위해.", "origin": "Pablo Jarillo-Herrero et al. (2018).", "connections": "초전도성, 상관관계 물리학, 모아레 물리학."}], "english_summary": ["Demonstrates field-tuned and zero-field fractional Chern insulators in twisted bilayer graphene.", "Realizes FQH-like physics without the strict requirement of high magnetic fields.", "Confirms the emergence of topological states in moire superlattices.", "Provides a platform for studying fractional topological phases under controllable conditions."]}}, {"title": "Ligand-mediated origin of altermagnetic spin splitting", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/s83n-w474", "authors": "Luigi Camerano, Federico Bisti, Gianni Profeta", "last_authors": "Federico Bisti, Gianni Profeta", "summary": "Altermagnets host spin-split electronic bands despite zero net magnetization, opening new routes for spintronics beyond conventional ferromagnets. Going beyond symmetry-based classifications, which specify allowed terms but not their hierarchy, here we use first-principles calculations and Wannier Hamiltonian engineering to uncover the microscopic bonding contributions of altermagnetic spin splitting in the g -wave altermagnet Co 1 / 4 NbSe 2 . We show that the splitting is captured by a short-range tight-binding model, establishing its local origin. By selectively controlling hopping channels, we demonstrate that the dominant contribution arises not from direct magnetic-ion hopping, but from ligand-mediated hybridization that transfers anisotropy to itinerant states. This identifies ligand-assisted coupling as a dominant mechanism driving altermagnetic spin splitting in intercalated metals, providing a microscopic bridge between minimal models and material-specific electronic structure calculations in altermagnets.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Highly relevant theory on altermagnetism, a sub-topic of high interest.", "tags": ["altermagnetism", "theory", "electronicstructure"], "image": "", "briefing": {"background": "알터자성체의 핵심은 net magnetization 없이 밴드 스플리팅이 일어나는 것인데, 이를 유발하는 미세 구조적 기원이 무엇인지 밝히는 것이 중요합니다.", "motivation": "대칭성 기반의 현상론을 넘어, 특정 물질(Co1/4NbSe2)에서 왜 알터자성이 발생하는지 그 미시적 결합 기전을 규명하고자 합니다.", "result": "스핀 분할이 직접적인 자기 이온 간의 호핑보다는 리간드 매개 혼성화(ligand-mediated hybridization)에 의해 지배됨을 보였습니다.", "implication": "알터자성을 가진 물질을 설계할 때 리간드 화학을 조절하여 스핀 분리 강도를 인위적으로 제어할 수 있음을 시사합니다.", "novelty": "기존 대칭성 접근법에서 나아가 tight-binding 모델과 DFT를 결합해 물리적 기전을 리간드 차원에서 명확히 분석했습니다.", "unresolved": "다른 종류의 알터자성 물질에서도 동일한 리간드 매개 기전이 보편적으로 작용하는지에 대한 확장 연구.", "future_work": "리간드 농도나 원자 치환을 통해 알터자성 강도를 최적화하는 실험적 시도.", "concepts": [{"term": "리간드 매개 혼성화", "why_emerged": "전이 금속 화합물에서 전자 상태의 이방성을 이해하기 위해.", "origin": "무기화학 및 고체화학의 기본 원리.", "connections": "d-밴드 모델, 호핑 매개변수, 결정장 이론."}, {"term": "Co1/4NbSe2", "why_emerged": "층상 구조의 알터자성 후보 물질로서의 연구 가치.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "NbSe2, 인터칼레이션, TMD(전이금속 디칼코게나이드)."}], "english_summary": ["Reveals the microscopic origin of altermagnetic spin splitting in Co1/4NbSe2.", "Identifies ligand-mediated hybridization, not direct ion hopping, as the dominant mechanism.", "Uses first-principles calculations and tight-binding models to explain the anisotropy.", "Connects material-specific electronic structure to minimal models of altermagnetism."]}}, {"title": "Noise spectroscopy of insulating and itinerant altermagnets", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/n78v-py2j", "authors": "Lucas V. Pupim, Mathias S. Scheurer", "last_authors": "Lucas V. Pupim, Mathias S. Scheurer", "summary": "One of the central goals in the emergent field of altermagnetism is the unambiguous experimental identification and characterization of altermagnetic order across a variety of compounds. This motivates exploring tools that can clearly distinguish altermagnets from antiferromagnets, based on symmetry signatures, and offer access to the dominant orbital character (e.g., d -wave versus g -wave) of the magnetic order parameter. In this work, we theoretically explore the potential of noise magnetometry for this task, studying contributions from both magnons and itinerant electrons in different regimes and scenarios. While altermagnetism and antiferromagnetism also lead to different noise spectra for magnons, we find the most striking and symmetry-sensitive signatures in the charge fluctuations of itinerant altermagnets. Both for the homogeneous bulk case and in the presence of strain and/or around domain walls, we identify noise contributions that are only permitted by symmetry in the altermagnet and, thus, provide a unique signature of altermagnetism. Furthermore, the angular dependence of noise around domain walls also offers access to the orbital character of the altermagnet. On a more technical note, we discuss the role and relevance of lattice effects related to the dipole tensor. We hope that our work will help pave the way toward the clear experimental identification of altermagnetism across a wide range of candidate materials.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Altermagnetism is relevant to the topological/magnetic materials interest.", "tags": ["altermagnetism", "spectroscopy"], "image": "", "briefing": {"background": "알터마그네틱(Altermagnetism)은 기존의 강자성이나 반강자성과는 구별되는 새로운 자기적 질서로, 비자기적 결정 대칭성에 의해 스핀이 분할되어 나타나는 페르미 표면의 이방성을 특징으로 합니다.", "motivation": "알터마그네틱을 기존 반강자성과 명확히 구별하고, 그 질서 변수의 궤도 성분(d-wave 대 g-wave)을 실험적으로 특정할 수 있는 새로운 분광학적 도구가 필요했습니다.", "result": "이론적 계산을 통해, 특히 순회 전자(itinerant electrons)를 가진 알터마그네틱 시스템에서 전하 요동의 노이즈 스펙트럼이 알터마그네틱 특유의 대칭성 신호를 보여준다는 점을 규명했습니다.", "implication": "노이즈 자력계(noise magnetometry)가 알터마그네틱 물질의 도메인 벽 구조나 벌크 성질을 분석하는 강력한 실험적 도구로 활용될 수 있음을 시사합니다.", "novelty": "기존의 산란 실험이나 자화율 측정과는 다른 '노이즈' 기반의 접근법을 제시하여, 도메인 벽 주변의 비대칭적 신호를 통해 알터마그네틱 궤도 성분을 결정할 수 있는 가능성을 보여줍니다.", "unresolved": "실제 실험적 구현을 위해서는 매우 정밀한 노이즈 측정 기술이 뒷받침되어야 하며, 실제 물질에서의 격자 효과나 불순물에 의한 노이즈 기여를 완전히 배제하는 방법은 숙제로 남아 있습니다.", "future_work": "실제 알터마그네틱 후보 물질에서의 극저온 노이즈 측정 실험 및 도메인 벽 전하 요동에 대한 정밀 계산 연구가 이어질 것으로 보입니다.", "concepts": [{"term": "알터마그네틱", "why_emerged": "반강자성적 스핀 정렬을 가지면서도 결정 대칭성에 의해 페르미 표면이 스핀 분할되는 새로운 상의 필요성.", "origin": "초록 정보만으로는 특정하기 어려움 (최근 1-2년 내 급부상한 분야).", "connections": "반강자성, 스핀 분할, 스핀트로닉스, 위상 물질."}, {"term": "노이즈 자력계", "why_emerged": "전자의 얽힘이나 자기적 요동에 민감한 비파괴적 측정 수단으로 부상.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "스핀 노이즈 분광학, 전하 요동, 자기 센서."}], "english_summary": ["Altermagnetism presents a unique symmetry-protected spin-splitting distinct from standard AFM.", "The authors propose noise magnetometry as a probe for altermagnetic order.", "Charge fluctuations in itinerant altermagnets reveal symmetry-specific signatures.", "Noise spectra can distinguish d-wave vs g-wave orbital character near domain walls.", "This approach provides a pathway for experimental identification of altermagnetic states."]}}, {"title": "Nonmonotonic evolution of the superconducting transition temperature and robust multigap superconductivity with extended s-wave and s-wave gaps in Zn-incorporated FeSe", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/rw7j-zxw6", "authors": "Han-Shu Xu, Changhao Ding, Guanyin Gao, et al.", "last_authors": "Kaibin Tang, Yu-Yan Han", "summary": "We synthesize high-quality $\\mathrm{F}{\\mathrm{e}}_{1−x}\\mathrm{Z}{\\mathrm{n}}_{x}\\mathrm{Se}$ single crystals over a broad Zn-doping range ( ": "Breaking reciprocity in thermal radiation opens opportunities for energy harvesting, sensing, and thermal management. Traditional nonreciprocal radiative semiconductor devices need external magnetic field. In this work, we predict a series of magnetic topological materials for magnetic-field-free nonreciprocal thermal radiation in the infrared regime, by combining first-principles calculations with Maxwell electrodynamics. We find strong and broadband nonreciprocity in magnetic Weyl semimetals (e.g., Co$_3$Sn$_2$S$_2$), outperforming the conventional semiconductor such as InAs. Furthermore, we propose universal material design recipes: strong nonreciprocity requires a large anomalous Hall response relative to the optical loss, whereas the broadband response favors large optical loss and small dielectric dispersion. Our work establishes a predictive materials-discovery framework and quantitative design rules for next-generation magnet-free nonreciprocal thermal devices.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Theory on magnetic topological materials and anomalous Hall effect for nonreciprocal thermal radiation.", "tags": ["topologicalmaterial", "Weylsemimetal", "anomalousHall", "magnetism", "theory", "first-principles"], "image": "https://arxiv.org/static/browse/0.3.4/images/arxiv-logo-fb.png", "briefing": {"background": "자동 브리핑을 생성하지 못했습니다. 초록과 원문 링크를 기준으로 빠르게 확인하세요.", "motivation": "초록 정보만으로는 분야 내부의 구체적 동기를 안정적으로 요약하기 어렵습니다.", "result": "Breaking reciprocity in thermal radiation opens opportunities for energy harvesting, sensing, and thermal management. Traditional nonreciprocal radiative semiconductor devices need external magnetic field. In this work, we predict a series of magnetic topological materials for magnetic-field-free nonreciprocal thermal radiation in the infrared regime, by combining first-principles calculations with Maxwell electrodynamics. We find strong and broadband nonreciprocity in magnetic Weyl semimetals (e.g., Co$_3$Sn$
