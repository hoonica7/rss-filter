<!DOCTYPE html>
<html lang='en'>
<head>
<meta charset='UTF-8'>
<meta name='viewport' content='width=device-width, initial-scale=1.0'>
<title>Daily Paper Slideshow</title>
<style>
  :root {
    color-scheme: light;
    --bg: #f6f7f4;
    --paper: #ffffff;
    --ink: #111827;
    --muted: #64748b;
    --line: #d8ddd2;
    --accent: #176b87;
    --accent-2: #9a3412;
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; overflow: auto; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: var(--bg); color: var(--ink); }
  .shell { max-width: 1500px; min-height: 100vh; margin: 0 auto; padding: 14px 18px; display: flex; flex-direction: column; }
  .topbar { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 16px; }
  .top-actions { display: flex; align-items: center; gap: 10px; }
  .topbar a, button { border: 1px solid var(--line); border-radius: 8px; background: var(--paper); color: var(--ink); padding: 10px 14px; font-weight: 700; text-decoration: none; cursor: pointer; }
  button.primary { background: var(--accent); border-color: var(--accent); color: white; }
  button:disabled { opacity: 0.45; cursor: not-allowed; }
  .counter { color: var(--muted); font-weight: 700; }
  .slide { min-height: calc(100vh - 82px); background: var(--paper); border: 1px solid var(--line); border-radius: 10px; padding: 18px; box-shadow: 0 18px 42px rgba(15, 23, 42, 0.10); display: grid; grid-template-columns: minmax(310px, 0.86fr) minmax(0, 1.55fr); gap: 18px; overflow: visible; }
  .paper-head { min-width: 0; min-height: 0; overflow: visible; display: flex; flex-direction: column; gap: 12px; }
  .figure { margin: 0; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: #f8fafc; }
  .figure img { display: block; width: 100%; max-height: 41vh; object-fit: contain; background: white; }
  .figure figcaption { padding: 7px 10px; color: var(--muted); font-size: 12px; line-height: 1.3; }
  .head-text { display: flex; flex-direction: column; gap: 9px; min-width: 0; }
  .badges { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .badge { border-radius: 999px; padding: 5px 9px; background: #eef2ff; color: #3730a3; font-size: 12px; font-weight: 800; }
  .score { background: #fee2e2; color: #991b1b; }
  h1 { margin: 0; font-size: 25px; line-height: 1.15; letter-spacing: 0; overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
  h1 a { color: inherit; text-decoration-color: rgba(23, 107, 135, 0.35); text-decoration-thickness: 2px; text-underline-offset: 4px; }
  h1 a:hover { color: var(--accent); text-decoration-color: var(--accent); }
  .meta, .authors, .why, .abstract { font-size: 13px; line-height: 1.45; }
  .meta, .authors { color: var(--muted); }
  .why strong, .abstract strong, .authors strong { color: var(--ink); }
  .authors { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .why { border-left: 4px solid var(--accent-2); padding-left: 10px; color: #374151; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .abstract { border-top: 1px solid var(--line); padding-top: 14px; color: #374151; }
  .original-abstract { border-top: 1px solid var(--line); padding-top: 10px; color: #374151; font-size: 11.5px; line-height: 1.35; overflow-wrap: anywhere; }
  .original-abstract strong { display: block; margin-bottom: 4px; color: var(--ink); }
  .tags { display: flex; flex-wrap: wrap; gap: 8px; }
  .tag { border-radius: 999px; padding: 4px 8px; background: #f1f5f9; color: #475569; font-size: 12px; font-weight: 700; }
  .head-text > .link { display: none; }
  .briefing { min-width: 0; min-height: 0; overflow: visible; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); grid-auto-rows: minmax(0, auto); align-content: start; gap: 11px 18px; border-top: 0; padding-top: 0; }
  .brief-section { min-width: 0; }
  .brief-section.wide { grid-column: 1 / -1; }
  .brief-section h2 { margin: 0 0 4px; font-size: 14px; line-height: 1.22; color: #0f766e; letter-spacing: 0; }
  .brief-section p, .brief-section li { margin: 0; font-size: 12.5px; line-height: 1.42; color: #1f2937; overflow-wrap: anywhere; }
  .brief-section ul { margin: 0; padding-left: 20px; }
  .concepts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 9px 14px; }
  .concept { border-top: 1px solid var(--line); padding-top: 7px; }
  .concept h3 { margin: 0 0 4px; font-size: 13px; color: #7c2d12; letter-spacing: 0; }
  .concept p { margin: 2px 0 0; font-size: 11.5px; line-height: 1.35; color: #374151; overflow-wrap: anywhere; }
  .concept b { color: #111827; }
  .link { color: var(--accent); font-weight: 800; text-decoration: none; }
  .empty { padding: 48px; background: var(--paper); border: 1px solid var(--line); border-radius: 12px; color: var(--muted); }
  @media (max-width: 860px) {
    .shell { padding: 14px; }
    .topbar, .top-actions { align-items: stretch; flex-direction: column; }
    .slide, .briefing, .concepts { grid-template-columns: 1fr; }
    .slide { min-height: auto; overflow: visible; display: grid; }
    h1 { font-size: 28px; }
  }
</style>

const slides = [{"title": "Evidence for p-wave magnetism in electronic band structure of metallic EuSi", "journal": "Nature", "source": "author whitelist", "link": "https://www.nature.com/articles/s41586-026-11295-9", "authors": "Erjian Cheng, Yixing Yang, Yifan Gao, et al.", "last_authors": "Zhongkai Liu, Claudia Felser", "summary": "A combination of symmetry analysis, first-principles calculations, neutron scattering and photoemission spectroscopy shows p-wave magnetism in the near-Fermi-level electronic structure of stoichiometric metallic EuSi.", "tier": "A_MUST_READ", "score": "10", "reason": "author whitelist: Makoto Hashimoto", "tags": ["photoemission", "neutronscattering", "bandstructure"], "image": "https://media.springernature.com/m685/springer-static/image/art%3A10.1038%2Fs41586-026-11295-9/MediaObjects/41586_2026_11295_Fig1_HTML.png", "briefing": {"background": "전통적인 자성체는 강자성(모멘텀 공간 전체에서 스핀 분리) 또는 반강자성(전체적으로 스핀 퇴화)으로 분류되었습니다. 최근에는 알터마그네티즘(Altermagnetism)과 같이 결정 대칭성에 의해 모멘텀 공간의 특정 방향에 따라 스핀 분리가 일어나는 새로운 자성 상태가 주목받고 있습니다.", "motivation": "금속성 화합물인 EuSi에서 나타나는 전자 밴드 구조 내의 비전통적인 자성 대칭성, 특히 p-웨이브(p-wave) 형태의 자성 특성을 실험적으로 증명하고자 했습니다.", "result": "대칭성 분석, 제일원리 계산, 중성자 산란 및 광전자 분광법(ARPES)을 결합하여, 화학 양론적 금속 EuSi의 페르미 준위 근처 전자 구조에서 p-웨이브 자성이 존재한다는 결정적인 증거를 제시했습니다.", "implication": "금속 내에서 p-웨이브 형태의 스핀 분리가 확인됨에 따라, 이는 알터마그네티즘 연구를 확장하고 스핀트로닉스 응용을 위한 새로운 소재 플랫폼을 제공할 수 있습니다.", "novelty": "Claudia Felser와 Makoto Hashimoto 등 저명 연구진이 참여하여 ARPES와 중성자 산란이라는 상보적 실험 기법으로 metallic 시스템에서의 p-웨이브 자성을 입증한 점이 독보적입니다.", "unresolved": "이러한 p-웨이브 자성이 시스템의 수송 특성(예: 변칙 홀 효과)이나 위상적 상태 변화에 구체적으로 어떤 영향을 주는지에 대한 추가 연구가 필요합니다.", "future_work": "EuSi 기반의 소자 제작을 통한 스핀 전류 제어 실험 및 유사한 결정 구조를 가진 다른 실리사이드 화합물에서의 일반성 확인이 기대됩니다.", "concepts": [{"term": "p-wave magnetism", "why_emerged": "모멘텀 공간에서 p-웨이브 대칭성을 갖는 스핀 분리 현상을 설명하기 위해 도입되었습니다.", "origin": "초록 정보만으로는 특정하기 어려우나, 최근 알터마그네티즘 이론과 함께 부상함", "connections": "알터마그네티즘, 스핀 분리, ARPES"}, {"term": "EuSi", "why_emerged": "희토류 기반 실리사이드로서 강한 전자 상관관계와 자성을 동시에 연구하기 위한 대상 물질입니다.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "금속성 자성체, 중성자 산란"}, {"term": "ARPES", "why_emerged": "고체의 모멘텀 공간 내 전자 구조(밴드 구조)를 직접 시각화하기 위해 개발되었습니다.", "origin": "Hertz의 광전효과 발견 이후 20세기 중반 현대적 형태로 발전", "connections": "전자 밴드 구조, 스핀 분리, 페르미 면"}, {"term": "Symmetry Analysis", "why_emerged": "물질의 결정 구조와 자기 구조가 허용하는 물리적 상태를 이론적으로 예측하기 위해 필수적입니다.", "origin": "군론(Group Theory)에 기반함", "connections": "제일원리 계산, 위상 기하학"}], "english_summary": ["Demonstrates p-wave magnetism in the electronic band structure of metallic EuSi.", "Combines symmetry analysis, DFT, neutron scattering, and ARPES for comprehensive evidence.", "Links experimental findings to near-Fermi-level electronic states in stoichiometric samples.", "Extends the understanding of unconventional spin-splitting in metallic magnetic materials."]}}, {"title": "Intracycle Interference in Strong-Field Photoemission from a Tungsten Needle Tip", "journal": "PRL_Recent", "source": "keyword", "link": "http://link.aps.org/doi/10.1103/t87j-1ngl", "authors": "Timo Wirth, Jonas Heimerl, Stefan Meier, Peter Hommelhoff", "last_authors": "Stefan Meier, Peter Hommelhoff", "summary": "by strong laser fields can rescatter, generating attosecond high harmonics. Spectral peaks arise from inter- and intracycle interference of coherent electron wave packets. While intercycle interference is well known, intracycle interference of plateau electrons has not been ob…", "tier": "A_MUST_READ", "score": "9", "reason": "title strong match: photoemission", "tags": ["photoemission"], "image": "", "briefing": {"background": "강한 레이저 장(field) 하에서 고체 표면의 전자가 방출될 때, 레이저의 주기 내에서 전자의 운동이 간섭 현상을 일으킵니다. 이는 아토초(attosecond) 수준의 전자 동역학을 이해하는 핵심입니다.", "motivation": "기존 연구에서 잘 알려진 주기 간 간섭(intercycle interference) 외에, 고에너지 '플래토(plateau)' 전자에서 발생하는 주기 내 간섭(intracycle interference)을 실험적으로 관찰하고자 했습니다.", "result": "텅스텐 나노 팁을 이용한 강전장 광전자 방출 실험에서, 재산란(rescattering)된 전자들이 보여주는 주기 내 간섭 패턴을 최초로 관찰하였습니다.", "implication": "고체 나노 구조에서 전자의 파동 패킷 동역학을 주기 내부 시간 척도에서 제어하고 이해할 수 있음을 보여줍니다.", "novelty": "지금까지 관찰이 어려웠던 플래토 전자의 주기 내 간섭 현상을 텅스텐 팁 시스템에서 명확히 구분해낸 점이 중요합니다. ARPES 관련 연구자에게는 극초단 시분해능 분광학의 기초가 됩니다.", "unresolved": "결정 구조의 국소적인 비균질성이나 팁의 기하학적 형상이 간섭 패턴의 위상에 미치는 미세한 영향은 더 연구되어야 합니다.", "future_work": "다양한 재료의 나노 팁을 활용한 고차 조화파 생성 및 전자 방출 제어 연구로 확장될 것으로 보입니다.", "concepts": [{"term": "Intracycle Interference", "why_emerged": "하나의 레이저 펄스 주기 내에서 발생하는 전자 파동의 간섭을 설명하기 위해 도입되었습니다.", "origin": "초록 정보만으로는 특정하기 어려우나 강전장 물리 분야의 핵심 개념", "connections": "Attosecond physics, Rescattering"}, {"term": "Tungsten Needle Tip", "why_emerged": "나노 스케일에서 전기장을 극대화하여 국소적인 전자 방출을 유도하기 위해 사용됩니다.", "origin": "Field emission microscopy 분야에서 시작됨", "connections": "Strong-field photoemission, Nanophotonics"}, {"term": "Plateau Electrons", "why_emerged": "광전자 에너지 스펙트럼에서 재산란에 의해 에너지가 일정하게 유지되는 높은 에너지 영역을 지칭합니다.", "origin": "High-harmonic generation 및 Strong-field physics 연구 중 발견", "connections": "Rescattering, Laser-induced electron diffraction"}, {"term": "Attosecond", "why_emerged": "원자 및 분자 내 전자 동역학의 시간 척도(10^-18초)를 포착하기 위해 필요합니다.", "origin": "Paul Corkum, Ferenc Krausz, Anne L'Huillier 등의 연구", "connections": "Time-resolved spectroscopy, Wave packet dynamics"}], "english_summary": ["Observes intracycle interference in plateau electrons from strong-field photoemission.", "Utilizes a tungsten needle tip to enhance the local electric field and electron rescattering.", "Distinguishes intracycle effects from the more commonly known intercycle interference.", "Advances the understanding of sub-cycle electron wave packet dynamics in solids."]}}, {"title": "Atomic-scale Imaging of Time Reversal Breaking Supercurrents in Bi2Sr2CaCu2O8", "journal": "arXiv_CondMat", "source": "author whitelist", "link": "https://arxiv.org/abs/2611.23060", "authors": "Bin Hu, Catherine Dawson, Shuqiu Wang, et al.", "last_authors": "Jonathan Ward, J. C. S\\'eamus Davis", "summary": "A persistent mystery of CuO_2-based high temperature superconductivity has been the mechanism and consequences of time reversal ($\\mathcal{T}$)-symmetry breaking. Although theoretical hypotheses focus upon persistent electronic currents as a potential cause, these have been invisible to direct experimental probes. That impasse has recently been removed by development of techniques for atomic-scale supercurrent visualization. Here, by imaging the energy-resolved density of electronic states $N(r,E)$ in $\\mathrm{Bi_2Sr_2CaCu_2O_8}$, we search for the specific signatures of flowing supercurrents in a disordered $d$-wave superconductor. Employing the strategy of artificial neural networks (ANN) for complex quantum matter visualization, we designed a dual-ANN (VMAP) to efficiently implement $d$-wave supercurrent visualization, achieving imaging of supercurrent speeds $V(r)$ at magnetic fields $|B| \\leq \\mu T$ in $\\mathrm{Bi_2Sr_2CaCu_2O_8}$. Correspondence between specific characteristics of $N(r,E)$ around each supercurrent loop and a quantum \"Rosetta Stone\" which translates $N(r,E)$ to $V(r)$, emphasizes the validity of $V(r)$ detection and visualization. Then, for hole-densities 0.17 $\\leq p \\leq$ 0.22 we observe statistically repeatable networks of supercurrent flows. Crucially, these supercurrents satisfy Kirchhoff's law at junctions within each network. Further, theoretical predictions for supercurrent speeds $V$ in disordered $d$-wave superconductors are consistent with measured 1250 m/s $< V <$ 4000 m/s, and with reported magnetic field amplitudes $|B| \\approx$ 0.1 mT Thus, detection and visualization of these supercurrent loop networks provides unique perspectives on $\\mathcal{T}$-symmetry breaking in cuprates. It also emphasizes the accelerating utility of ANN techniques for physics discovery from high data volume quantum matter research.", "tier": "A_MUST_READ", "score": "9", "reason": "author whitelist: J. C. S\\'eamus Davis", "tags": ["cuprate", "superconduct"], "image": "https://arxiv.org/static/browse/0.3.4/images/arxiv-logo-fb.png", "briefing": {"background": "구리 산화물(Cuprate) 고온 초전도체에서 시간 역전 대칭성(T-symmetry) 파괴의 기원은 수십 년간의 난제였습니다. 루프 전류(loop current) 모델이 유력한 후보로 제시되었으나, 이를 직접 시각화하는 것은 매우 어려웠습니다.", "motivation": "Bi2212 초전도체에서 나노 스케일의 초전류(supercurrent) 분포를 직접 이미징하여 시간 역전 대칭성 파괴의 실체를 밝히고자 했습니다.", "result": "인공신경망(ANN) 기법인 VMAP을 개발하여 STM으로 측정된 국소 상태 밀도(LDOS)를 초전류 속도 V(r)로 변환하는 '로제타 스톤'을 구현했습니다. 이를 통해 홀 농도 0.17~0.22 영역에서 Kirchhoff의 법칙을 만족하는 루프 형태의 초전류 네트워크를 시각화했습니다.", "implication": "구레이트 내의 시간 역전 대칭성 파괴가 실제 흐르는 초전류 루프에 기인한다는 강력한 증거를 제시하며, 이는 유사-에너지 갭(pseudogap) 상태의 물리적 기원과 직결될 수 있습니다.", "novelty": "Seamus Davis 그룹의 독보적인 STM 기술과 AI/ANN 분석 기법을 결합하여, 이론으로만 존재하던 루프 전류를 원자 단위에서 이미징한 획기적인 성과입니다.", "unresolved": "이러한 루프 전류 네트워크가 초전도 전이 온도(Tc) 이상의 상자성 상태나 다른 도핑 영역에서 어떻게 변화하는지는 추가 연구가 필요합니다.", "future_work": "다른 계열의 구레이트 및 카고메 금속(AV3Sb5) 등 시간 역전 대칭성 파괴가 의심되는 다른 양자 물질로의 VMAP 기법 적용이 기대됩니다.", "concepts": [{"term": "Time Reversal Breaking Supercurrent", "why_emerged": "외부 자기장 없이도 물질 내부에서 스스로 발생하는 전류 루프와 그로 인한 대칭성 파괴를 설명하기 위해 도입되었습니다.", "origin": "C. M. Varma (1997, Loop current theory)", "connections": "Pseudogap, Bi2212, TRSB"}, {"term": "ANN (Artificial Neural Networks)", "why_emerged": "방대한 STM 데이터에서 복잡한 양자 상태의 패턴(예: LDOS와 전류 속도의 관계)을 추출하기 위해 도입되었습니다.", "origin": "최근 10년 사이 응집물질물리 데이터 분석에 도입", "connections": "Machine learning, STM data analysis"}, {"term": "Bi2Sr2CaCu2O8 (Bi2212)", "why_emerged": "결정 벽면이 깨끗하게 잘려 STM 실험에 가장 적합한 고온 초전도체 모델 시스템입니다.", "origin": "1988년 발견된 구리 산화물 계열", "connections": "High-Tc superconductivity, d-wave pairing"}, {"term": "Kirchhoff's Law", "why_emerged": "회로망의 접점에서 전류의 유입과 유출이 같아야 한다는 물리적 보존 법칙입니다.", "origin": "Gustav Kirchhoff (1845)", "connections": "Supercurrent network, Current conservation"}], "english_summary": ["Directly images time-reversal symmetry-breaking supercurrents in Bi2212 cuprates using STM.", "Employs a dual-ANN (VMAP) to translate LDOS maps into supercurrent velocity distributions.", "Identifies networks of loop currents satisfying Kirchhoff's laws at junctions.", "Provides experimental validation for long-standing theories of orbital loop currents in cuprates."]}}, {"title": "Fermi-surface-driven linear magnetoresistance in the kagome magnet TbMn6Sn6", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/grzw-y5lz", "authors": "Sicheng Zhou, Ruihuan Duan, Jie Pang, et al.", "last_authors": "Guangtong Liu, Li Lu", "summary": "Here, the authors identify a Fermi surface driven mechanism for positive linear magnetoresistance in the kagome ferrimagnet TbMn 6 Sn 6 . Measurements on multiple nanoflake devices reveal pronounced linear magnetoresistance, with substantial device-to-device variations in both its slope and the quadratic-to-linear crossover field. Combining magnetotransport experiments with first-principles-based semiclassical calculations, the authors demonstrate how the relaxation time and small shifts in chemical potential govern these variations. These findings provide insight into the microscopic origin of linear magnetoresistance and, in particular, its emergence at relatively low crossover fields.", "tier": "B_IMPORTANT_CONDMAT", "score": "9", "reason": "Experimental kagome electronic structure study directly relevant to interests.; demoted from A: broad CM, not direct user/project hit", "tags": ["kagome", "magnetism", "transport", "Fermisurface"], "image": "", "briefing": {"background": "가고메(Kagome) 격자 구조를 가진 자성 물질은 베리 곡률과 연관된 흥미로운 수송 현상을 나타내어 차세대 양자 재료로 주목받고 있습니다.", "motivation": "TbMn6Sn6 자성 가고메 금속에서 관찰되는 선형 자기저항(Linear Magnetoresistance, LMR)의 미시적 기원을 규명하고자 했습니다.", "result": "나노 박막 소자 측정을 통해 선형 자기저항을 확인했으며, 이는 페르미 표면의 특성, 특히 완화 시간(relaxation time)과 화학 퍼텐셜의 미세한 변화에 의해 결정됨을 세미클래식 계산으로 입증했습니다.", "implication": "가고메 격자 물질에서의 비정상적인 수송 현상이 복잡한 다체 물리보다는 특정 페르미 표면 기하학적 구조에 의해 제어될 수 있음을 시사합니다.", "novelty": "가고메 페리자성체에서 소자별로 다른 LMR의 변동성을 정량적으로 설명했으며, 이는 전자 구조 연구에 기반한 수송 현상 분석의 좋은 모델을 제공합니다.", "unresolved": "소자 제작 과정에서 발생하는 화학 퍼텐셜의 국부적 변동이 구체적으로 어떤 결함이나 기판 상호작용에서 비롯되는지는 추가 연구가 필요합니다.", "future_work": "다른 가고메 물질(AV3Sb5 등)에 적용하여 유사한 LMR 메커니즘의 보편성을 확인하고, 게이팅을 통한 화학 퍼텐셜 제어 실험이 필요합니다.", "concepts": [{"term": "선형 자기저항", "why_emerged": "일반적인 금속은 2차 자기저항을 보이나, 일부 양자 물질은 선형성을 보여 그 기원을 규명할 필요가 있음", "origin": "Abrikosov에 의해 무질서한 갭리스 반금속에서 제안됨", "connections": "베리 곡률, 양자 진동, 페르미 표면 공학"}, {"term": "가고메 자성체", "why_emerged": "기하학적 좌절과 평탄한 밴드(flat band)가 얽힌 흥미로운 위상학적 현상을 연구하기 위함", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "디락 반금속, 토폴로지컬 절연체, AV3Sb5 화합물"}], "english_summary": ["The authors investigate linear magnetoresistance in the kagome ferrimagnet TbMn6Sn6.", "Experimental device-to-device variability is explained by semiclassical modeling.", "Results link the LMR origin to Fermi surface geometry and relaxation time modulation.", "Provides a framework for understanding transport in complex kagome electronic systems."]}}, {"title": "Pressure-tuned interlayer coupling and structural control of the ground state in 1T−IrTe2", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/bszx-hzm6", "authors": "Rongqi Wu, Ye Yang, Zhiwei Wang, et al.", "last_authors": "Jianjun Ying, Xianhui Chen", "summary": "a representative example, where superconductivity emerges in close proximity to a charge-ordered state. Here, w…", "tier": "B_IMPORTANT_CONDMAT", "score": "9", "reason": "Electronic structure and charge-ordered state in a telluride material similar to user interest.", "tags": ["material", "tellurides", "superconductivity"], "image": "", "briefing": {"background": "1T-IrTe2와 같은 전이금속 디칼코게나이드(TMD) 계열은 전하 밀도 파동(CDW)과 초전도성 사이의 경쟁 및 공존 현상을 연구하는 대표적인 플랫폼입니다.", "motivation": "IrTe2 시스템에서 압력을 통해 층간 결합을 제어하고, 이로 인해 변화하는 구조적 성질과 바닥 상태(CDW 및 초전도성)의 관계를 규명하고자 합니다.", "result": "압력 하에서 층간 결합의 변화가 구조적 불안정성을 유도하며, 전하 정렬 상태와 초전도 상태 사이의 상전이를 제어할 수 있음을 보여줍니다.", "implication": "Telluride 물질군에서 층간 쌓임(stacking) 구조와 전자 상관관계가 밀접하게 연결되어 있으며, 구조적 변형을 통해 양자 상태를 튜닝할 수 있음을 입증합니다.", "novelty": "구조적 제어를 통해 CDW와 초전도성의 상관관계를 직접적으로 입증했으며, 이는 112 계열 텔루라이드 연구에 중요한 통찰을 제공합니다.", "unresolved": "압력 인가 시 발생하는 구체적인 격자 왜곡의 미시적 패턴과 그에 따른 전자 구조의 변화(예: 페르미 표면의 nesting 특성)는 추가적인 ARPES 실험이 필요합니다.", "future_work": "고압 하에서의 전자 구조 변화를 관찰하는 고압 ARPES 실험과 상세한 제일원리 계산을 통한 CDW 갭 소멸 기작 연구가 필요합니다.", "concepts": [{"term": "1T-IrTe2", "why_emerged": "강한 스핀-궤도 결합과 CDW를 동시에 가지는 물질로서 연구 가치가 높음", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "TaNiTe2, NbNiTe2, TMD계 초전도체"}, {"term": "전하 밀도 파동(CDW)", "why_emerged": "전자와 격자 간의 상호작용으로 인한 금속 내 전하 밀도의 주기적 변조 현상을 이해하기 위함", "origin": "Peierls, Frohlich 등에 의해 정립", "connections": "페르미 표면 중첩(nesting), 구조 상전이, 초전도성 경쟁"}], "english_summary": ["Pressure-induced structural control in 1T-IrTe2 is explored to tune the ground state.", "Study focuses on the interplay between charge-ordered states and superconductivity.", "Demonstrates the importance of interlayer coupling in controlling electronic phases.", "Provides experimental insight into telluride-based quantum materials."]}}, {"title": "Altermagnetism-induced magneto-optical effects", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2611.22750", "authors": "Jun \\=Oik\\'{e}, Robert Peters, Koki Shinada", "last_authors": "Robert Peters, Koki Shinada", "summary": "Altermagnets break time-reversal symmetry despite their zero net magnetization, enabling time-reversal-odd responses while retaining the advantages of antiferromagnets. However, magneto-optical (MO) effects are not universal among altermagnets because MO effects typically arise from magnetic dipole order (ferromagnetism), which is generally absent in altermagnets. In this work, we address this limitation by establishing octupolar MO effects, which arise from magnetic octupole order through spatial dispersion. Owing to this distinct origin, octupolar MO effects do not necessarily require spin-orbit coupling even in collinear magnets and can arise without an external magnetic field in antiferromagnets where conventional MO effects are symmetry-forbidden. Such antiferromagnets include d d -wave altermagnets such as RuO 2 \\text{RuO}{\\vphantom{\\text{X}}}_{\\vphantom{\\text{2}}\\smash[t]{\\text{2}}}^{\\vphantom{\\smash[t]{\\text{2}}}\\hphantom{\\text{2}}\\text{}} and KV 2 ​ Se 2 ​ O \\text{KV}{\\vphantom{\\text{X}}}_{\\vphantom{\\text{2}}\\smash[t]{\\text{2}}}^{\\vphantom{\\smash[t]{\\text{2}}}\\hphantom{\\text{2}}\\text{}}\\text{Se}{\\vphantom{\\text{X}}}_{\\vphantom{\\text{2}}\\smash[t]{\\text{2}}}^{\\vphantom{\\smash[t]{\\text{2}}}\\hphantom{\\text{2}}\\text{}}\\text{O} , certain g g - and i i -wave altermagnets, including CrSb , as well as noncoplanar antiferromagnets such as MnTe 2 \\text{MnTe}{\\vphantom{\\text{X}}}_{\\vphantom{\\text{2}}\\smash[t]{\\text{2}}}^{\\vphantom{\\smash[t]{\\text{2}}}\\hphantom{\\text{2}}\\text{}} and pyrochlore iridates with all-in-all-out magnetic order. From an experimental perspective, octupolar MO effects can reach detectable magnitudes and offer potential for magnetic-domain imaging, as supported by numerical calculations showing μ \\mu rad-scale Faraday rotation for a 100-nm-thick sample in the visible-light range and a sign reversal between opposite domains. Furthermore, octupolar MO effects are linked to an f f -sum rule, enabling a quantitative estimate of the spin magnetic octupole moment from optical measurements. These results extend the scope of MO effects to a broad class of antiferromagnets, including altermagnets, and open a field-free optical route to exploring magnetic octupole order.", "tier": "B_IMPORTANT_CONDMAT", "score": "9", "reason": "Highly relevant to altermagnetism and potential experimental optical probes.", "tags": ["altermagnet", "magneto-optical", "antiferromagnet"], "image": "https://arxiv.org/html/2611.22750v1/Figure_crop-5.png", "briefing": {"background": "알터마그네틱(Altermagnetism)은 순수 반강자성체이면서도 시간 반전 대칭성을 깨는 전자 구조를 가져, 스핀 분극 전류를 생성할 수 있는 새로운 자기 상태입니다.", "motivation": "기존의 자성 쌍극자 기반 자기-광학(MO) 효과가 알터마그네틱에서는 대칭적으로 금지되어 있으므로, 새로운 형태의 광학적 탐지 방법을 구축하고자 합니다.", "result": "자기 팔중극자(octupole) 차수를 이용한 새로운 MO 효과를 이론적으로 제안했습니다. 이는 스핀-궤도 결합 없이도 가능하며, RuO2와 같은 d-wave 알터마그네틱에서 측정이 가능함을 보였습니다.", "implication": "알터마그네틱을 외부 자기장 없이 광학적으로 탐지할 수 있는 길이 열렸으며, 이는 반강자성 도메인 이미징 기술로 활용될 수 있습니다.", "novelty": "자기 쌍극자가 아닌 '자기 팔중극자'라는 새로운 물리량을 통해 MO 효과를 이끌어낸 점이 핵심이며, 알터마그네틱 실험 연구의 지평을 넓혔습니다.", "unresolved": "이론적으로 제안된 μrad 규모의 패러데이 회전이 실제 샘플에서 노이즈 대비 충분히 분별 가능한지 확인해야 합니다.", "future_work": "다양한 알터마그네틱 후보 물질들에 대한 초고감도 광학 반사 및 투과 실험을 통한 실증이 필요합니다.", "concepts": [{"term": "알터마그네틱", "why_emerged": "반강자성체의 장점과 강자성체의 스핀 분극 기능을 동시에 갖는 물질을 찾기 위함", "origin": "Smejkal, Jungwirth 등에 의해 제안", "connections": "반강자성체, 스핀트로닉스, 자기 팔중극자"}, {"term": "자기 팔중극자", "why_emerged": "자기 쌍극자 모멘트가 상쇄되는 물질에서 대칭성 파괴를 기술하는 고차 다중극자가 필요함", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "다중극 정렬, 숨겨진 질서, 비상호적 광학 효과"}], "english_summary": ["Introduces octupolar magneto-optical (MO) effects in altermagnets.", "Proposes an alternative to conventional MO effects, which are forbidden in altermagnets.", "Octupolar effects arise without spin-orbit coupling and allow field-free optical probing.", "Applicable to various d-wave and g-wave altermagnets like RuO2 and MnTe2."]}}, {"title": "Flat-band-induced integer doping and phase transition in monolayer graphene", "journal": "Nature", "source": "Gemini", "link": "https://www.nature.com/articles/s41586-026-11254-4", "authors": "Z. Wang, C. Moulsdale, X. Guo, et al.", "last_authors": "C. R. Woods, K. S. Novoselov", "summary": "An architecture comprising monolayer graphene doubly aligned to bulk and monolayer hBN on either side shows a gate-tunable global structural phase transition between two stacking configurations, accompanied by flat-band-induced integer doping.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "High-quality moire/twisted graphene system with correlated phases, relevant to broader interests.", "tags": ["graphene", "flat-band", "moire"], "image": "https://media.springernature.com/m685/springer-static/image/art%3A10.1038%2Fs41586-026-11254-4/MediaObjects/41586_2026_11254_Fig1_HTML.png", "briefing": {"background": "모아레 격자 시스템은 서로 다른 층의 2차원 물질을 적층할 때 발생하는 층간 간섭으로, 밴드 구조를 인위적으로 조절하여 강한 상관관계 전자 상태를 구현하는 핵심 플랫폼입니다.", "motivation": "단층 그래핀을 대칭적으로 hBN 층 사이에 배치하는 독특한 설계를 통해, 구조적 상전이와 평탄 밴드에 의한 전하 도핑 효과를 관찰하고자 했습니다.", "result": "이중 정렬된 구조에서 게이트 전압을 통해 조절 가능한 전체적인 구조적 상전이를 발견했으며, 이와 연동된 평탄 밴드 유도 정수 도핑 현상을 확인했습니다.", "implication": "그래핀 모아레 시스템에서 구조적 변화와 전자적 물성을 직접적으로 결합 제어할 수 있는 새로운 경로를 제시합니다.", "novelty": "외부 환경(게이트)으로 기계적 구조 상전이와 전자적 상태를 동시에 정교하게 제어할 수 있다는 점이 중요하며, 향후 강상관 전자 물성 연구의 제어 파라미터를 확장합니다.", "unresolved": "관찰된 구조적 상전이의 상세한 에너지론적 메커니즘과 그로 인한 위상적 변화의 정밀한 연관성은 추가 연구가 필요합니다.", "future_work": "이 시스템의 전자기적 수송 특성 측정과 STM/STS를 통한 평탄 밴드 내의 전자 상관관계 분석이 예상됩니다.", "concepts": [{"term": "모아레 격자", "why_emerged": "2차원 층상 물질에서 층간 회전각이나 격자 부정합을 통해 전자 파동함수의 간섭을 조절하기 위해 도입되었습니다.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "트위스트 이층 그래핀(TBG), 강상관 초전도체, 엑시톤 물리"}, {"term": "평탄 밴드(Flat-band)", "why_emerged": "운동 에너지가 억제되고 상호작용 에너지가 지배적인 상태를 구현하여 강상관 현상을 연구하기 위해 필요합니다.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "Landau 준위, 연관된 양자 위상 물질"}], "english_summary": ["A novel architecture of graphene aligned with hBN layers is studied.", "The system exhibits gate-tunable global structural phase transitions.", "Integer doping induced by flat-band behavior is experimentally confirmed.", "This provides a new control knob for correlated phases in moire systems."]}}, {"title": "Magnetic anisotropy in the near-stoichiometric van der Waals ferromagnet Fe3GeTe2", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/27h2-qnt8", "authors": "Riju Pal, Joyal John Abraham, Satyabrata Bera, et al.", "last_authors": "Vladislav Kataev, Alexey Alfonsov", "summary": "Quasi-two-dimensional (2D) van der Waals (vdW) ferromagnets such as the series Fe 3 − x GeTe 2 , with a relatively high Curie temperature and robust metallicity, offer an ideal platform for investigating itinerant magnetism in reduced dimensions. Here, we present a comprehensive electron spin resonance (ESR) investigation of single-crystalline, almost stoichiometric Fe 3.03 ± 0.03 GeTe 2 across wide ranges of frequencies, temperatures, and magnetic fields to gain quantitative insights into its magnetic anisotropy and spin dynamics. Frequency-dependent ESR measurements establish Fe 3 GeTe 2 as an easy-axis ferromagnet. Temperature-dependent high-field ESR reveals a large internal field that gradually decreases at higher temperatures. Remarkably, this internal field persists even above T C , indicating short-range spin correlations in Fe 3 GeTe 2 . Analysis of spin-wave modes yields a strong uniaxial magnetocrystalline anisotropy K int ≈ − 5 × 10 6 erg cm − 3 at 3 K and a large magnon gap Δ ( 3 K ) ≈ 87.8 ± 13.7 GHz ( ≈ 0.363 ± 0.057 meV ). Our study highlights that small variations in Fe content in Fe 3 GeTe 2 lead to substantial changes in the magnon gap at low temperatures, indicating the sensitivity of spin dynamics to the chemical composition. These results establish Fe 3 GeTe 2 as a model vdW ferromagnet for exploring tunable anisotropies and magnon excitations in metallic 2D magnets.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Relevant experimental study on a vdW itinerant ferromagnet, which falls within broader material interests.", "tags": ["vanderWaals", "magnetism", "experimental"], "image": "", "briefing": {"background": "Fe3GeTe2는 높은 큐리 온도와 금속성을 갖춘 반데르발스 강자성체로서, 2차원 한계에서의 이력적인 자기 정렬과 스핀 동역학 연구의 중요한 모델 물질입니다.", "motivation": "Fe3GeTe2의 화학 양론적 구성이 자기 이방성과 스핀 파(magnon) 동역학에 미치는 정량적 영향력을 명확히 규명하고자 했습니다.", "result": "ESR 측정을 통해 Fe3GeTe2가 쉬운 축(easy-axis)을 가진 강자성체임을 확인했으며, 화학적 조성 변화에 따라 마그논 갭이 크게 변함을 입증했습니다.", "implication": "이 물질이 스핀 동역학을 조절할 수 있는 2차원 자성 소자 플랫폼으로서의 가치를 가짐을 시사합니다.", "novelty": "고주파 ESR을 통해 마그논 갭과 내부 자기장을 정량적으로 도출했고, 큐리 온도 이상에서도 잔류하는 단거리 스핀 상관관계를 포착했습니다.", "unresolved": "화학적 조성의 미세한 변화가 스핀 파의 분산 관계에 미치는 구체적인 미시적 상호작용은 추가 분석이 필요합니다.", "future_work": "조성 제어를 통한 마그논 밴드 엔지니어링 및 초고속 자기 동역학 측정 연구가 기대됩니다.", "concepts": [{"term": "마그논 갭", "why_emerged": "자기 이방성이 존재하는 강자성체에서 스핀 파가 에너지를 갖기 위해 필요한 최소 에너지 준위입니다.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "자기 이방성, 강자성 공명(FMR), 스핀트로닉스"}, {"term": "반데르발스 강자성체", "why_emerged": "단층 수준에서 강자성 질서를 유지하는 물질을 통해 저차원 자성 물성을 탐구하기 위해 주목받고 있습니다.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "CrI3, FeGeTe2 계열 물질, 위상 자성체"}], "english_summary": ["Comprehensive ESR study on Fe3GeTe2 itinerant ferromagnet.", "Confirmed easy-axis anisotropy and quantified the magnon gap.", "Identified significant sensitivity of spin dynamics to Fe stoichiometry.", "Proposes Fe3GeTe2 as a tunable platform for 2D magnon excitations."]}}, {"title": "Magnetic anisotropy, first-order metamagnetic transitions, and weak antilocalization in the candidate topological semimetal Tb2Zn17", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/ytfq-5c74", "authors": "Rajesh Swami, Papul Sahu, Sonali S Pradhan, V. Kanchana, Z. Hossain", "last_authors": "V. Kanchana, Z. Hossain", "summary": "in the rhombohedral Th 2 Zn 17 -type structure (space group R 3 ¯ m ), a structure type known to accommodate atomic disorder. Here, the authors highlight the role of disorder-induced scattering in magnetotransport measurements, which exhibit signatures of weak antilocalization. This compound shows multiple first-order field-induced metamagnetic transitions, strong magnetic anisotropy, crystal electric field effects, and possible spin canting within its antiferromagnetic state. First-principles calculations predict multiple electron and hole Fermi pockets, along with mirror-symmetry-protected nodal rings, suggesting Tb 2 Zn 17 as a promising rare-earth-based magnetic topological semimetal.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Experimental investigation of a magnetic topological semimetal candidate.", "tags": ["topologicalsemimetal", "transport", "magnetism"], "image": "", "briefing": {"background": "희토류 기반 금속간 화합물은 강한 자기 이방성과 강상관 전자 현상이 결합된 위상적 상태를 탐색하는 데 중요한 후보군입니다.", "motivation": "Tb2Zn17 화합물에서 자기적 위상과 결합된 수송 특성 및 위상적 반금속 후보로서의 가능성을 조사하고자 했습니다.", "result": "약한 반국소화(WAL) 신호와 함께 메타자기 전이 및 결정 전기장 효과를 관찰했습니다. DFT 계산을 통해 노달 링(nodal ring) 구조를 예측했습니다.", "implication": "Tb2Zn17이 자기 정렬과 위상적 밴드 구조가 공존하는 희토류 기반 위상 반금속의 새로운 사례가 될 수 있음을 보여줍니다.", "novelty": "원자적 무질서가 수송 현상에 미치는 영향과 위상적 특성 간의 상호작용을 실험적으로 규명했습니다.", "unresolved": "예측된 노달 링 구조가 실험적으로 밴드 구조에서 직접 관찰된 것은 아니며, ARPES 등을 통한 직접 증명이 필요합니다.", "future_work": "ARPES를 통한 밴드 구조 매핑과 위상적 표면 상태의 직접적인 관찰이 요구됩니다.", "concepts": [{"term": "약한 반국소화(WAL)", "why_emerged": "전자 파동함수의 간섭으로 인해 무질서한 시스템에서 저항이 감소하는 위상적 수송 현상을 설명하기 위해 도입되었습니다.", "origin": "Hikami, Larkin, Nagaoka (1980)", "connections": "스핀-궤도 결합, 위상적 절연체, 약한 국소화"}, {"term": "노달 링(Nodal Ring)", "why_emerged": "밴드 구조에서 전도대와 가전자대가 고리 모양으로 접촉하는 위상적 특성을 설명하기 위해 필요합니다.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "위상 반금속, 베리 위상, 스핀-궤도 결합"}], "english_summary": ["Investigated magnetism and transport in Tb2Zn17 topological candidate.", "Observed metamagnetic transitions and weak antilocalization signatures.", "DFT calculations predict nodal ring structures protected by symmetry.", "Highlights the potential for rare-earth-based magnetic topological semimetals."]}}, {"title": "Magnetic circular dichroism of terahertz modes and selection rules of Raman-active optical phonons in the polar altermagnet candidate Mn2Mo3O8", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/sqws-q32r", "authors": "F. Schilberth, K. Vasin, M. Knauft, et al.", "last_authors": "I. Kézsmárki, J. Deisenhofer", "summary": "We investigated the magnetic and vibrational excitations in the collinear altermagnet candidate Mn 2 Mo 3 O 8 by temperature-dependent Raman scattering and magneto-optical THz time-domain transmission spectroscopy. By comparison to calculations accurately capturing the eigenfrequencies of the vibrational eigenmodes, we identify all optical phonons, including the lowest-lying Raman modes of A 1 and E 2 type, which had remained elusive in a previous Raman study. Moreover, we compare the selection rules for optically active phonons in the paramagnetic and the magnetically ordered phases of Mn 2 Mo 3 O 8 and analyze the Raman selection rules with respect to pseudoangular momentum conservation. No splitting of the degenerate paramagnetic E 2 optical phonons into circularly polarized modes could be resolved below T N , indicating negligible morphic effects of optical phonons upon magnetic ordering. In contrast, we observe strong magnetic circular dichroism at a broad THz excitation band, emerging in the magnetically ordered state. This band, potentially originating from two-magnon excitations, is only electric-dipole active and features a field-dependent two-component fine structure. Its magnetic circular dichroism vanishes above the spin-flop transition at 4 T.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Altermagnetism and magneto-optical spectroscopy are highly relevant to current research topics.", "tags": ["altermagnetism", "spectroscopy", "magnetism"], "image": "", "briefing": {"background": "알터마그네틱(Altermagnetism)은 최근 자기학 분야에서 새롭게 주목받는 개념으로, 기존의 강자성(Ferromagnetism)이나 반강자성(Antiferromagnetism)으로 분류되지 않는 독특한 자기적 순서입니다. 이는 시간 역전 대칭(Time-reversal symmetry)을 깨뜨리면서도 순자화가 0인 상태를 유지하며, 결정 대칭성에 의해 유도된 k-의존적 스핀 분할을 가집니다.", "motivation": "Mn2Mo3O8 물질이 알터마그네틱 후보군으로 제안됨에 따라, 이 물질의 자기적 및 진동(phonon) 특성을 상세히 조사하여 알터마그네틱 상태가 광학적 선택 규칙과 어떤 상호작용을 하는지 규명하고자 함.", "result": "라만 산란과 THz 분광법을 통해 광학 포논 모드를 식별했으나, 자기적 순서 이후에도 E2 포논 모드의 분할은 관찰되지 않아 포논에 대한 자기적 효과는 미미한 것으로 나타남. 반면, 강한 자기 원형 이색성(MCD)을 갖는 THz 여기 대역이 자기적 상태에서 발견됨.", "implication": "Mn2Mo3O8에서의 알터마그네틱 특성은 특정 전기 쌍극자 활성 모드와 강하게 결합되어 있음을 시사하며, 이는 알터마그네트의 자기적 상태를 비접촉식으로 조절하거나 감지하는 새로운 광학적 경로를 제공할 수 있음.", "novelty": "알터마그네트 후보 물질에서 진동 모드와 자기 여기 모드를 체계적으로 구분해내었으며, 자기 이색성 관찰을 통해 고전적인 자기적 순서와 구분되는 전자적 특성을 입증함.", "unresolved": "관찰된 강한 자기 원형 이색성 THz 밴드가 2-마그논 여기에서 기인하는 것으로 추정되나, 구체적인 미시적 메커니즘은 추가 검증이 필요함.", "future_work": "다른 알터마그네틱 후보 물질들에 대한 유사한 분광학적 연구를 통해 이번에 관찰된 THz 이색성 현상의 보편성을 검증할 필요가 있음.", "concepts": [{"term": "알터마그네트", "why_emerged": "기존 강자성/반강자성 틀로 설명되지 않는 독특한 스핀 분할 전자 구조를 설명하기 위해 등장함.", "origin": "최근 2020년대 초반 이론적 정립 이후 활발히 연구됨.", "connections": "반강자성체, k-의존적 스핀 분할, 스핀-궤도 결합."}, {"term": "자기 원형 이색성 (MCD)", "why_emerged": "자기적 물질의 전자 상태나 여기 모드에 대한 선택 규칙과 대칭성 정보를 얻기 위해 필요함.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "자기 광학 효과, Faraday 효과, 스핀 분할."}], "english_summary": ["Mn2Mo3O8 is investigated as an altermagnet candidate using Raman and THz spectroscopy.", "Phonon modes were fully identified, showing negligible morphic effects upon magnetic ordering.", "Strong magnetic circular dichroism is observed in the ordered state at THz frequencies.", "Results suggest that the observed THz band is likely linked to two-magnon excitations."]}}, {"title": "Pressure-tuned competing electronic states in layered tellurides", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/62ty-mc54", "authors": "Mahmoud Abdel-Hafiez, Govindaraj Lingannan, D. A. Chareev, et al.", "last_authors": "Hasan Sahin, Sami El-Khatib", "summary": "A. Chareev, A. N. Vasiliev, Anas Abutaha, Chia Nung Kuo, Chin Shan Lue, Kadir Can Dogan, Mehmet Yagmurcukardes, Mehmet Egilmez, Hasan Sahin, and Sami El-Khatib Layered transition-metal dichalcogenides can host multiple crystal structures that are closely spaced in free energy, giving rise to rich electronic diversity under modest external perturbations. Molybdenum ditelluride ($\\mathrm{Mo}{\\mathrm{Te}}_{2}$) is a paradigmatic example, in which semiconducti…", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Relevant study of layered tellurides akin to the user's interest in 112 tellurides.", "tags": ["material", "electronic-structure", "tellurides"], "image": "", "briefing": {"background": "층상 전이금속 디칼코게나이드(TMD)는 좁은 에너지 영역 내에 다양한 결정 구조가 공존하여, 미세한 압력이나 도핑 조절만으로도 상전이를 유도할 수 있는 풍부한 전자적 T", "score": "8", "reason": "Topological state in moiré systems, relevant to correlated electronic structure interests.", "tags": ["topological", "moiré", "Kondo"], "image": "", "briefing": {"background": "모아레 초격자(Moiré superlattice) 시스템은 층간 비틀림을 통해 강상관 전자 물성을 구현할 수 있는 플랫폼으로, 특히 밴드 평탄화와 전자 상관관계가 맞물려 새로운 양자 위상 상태를 창출함.", "motivation": "모아레 콘도 격자 시스템에서 발생하는 콘도 붕괴(Kondo breakdown) 현상과 위상학적 상태 사이의 연결 고리를 탐구하여, 기존의 무거운 페르미온 시스템과는 차별화되는 위상적 Chern 절연체 상태를 확인하고자 함.", "result": "분수 모아레 충전율에서 나타나는 위상학적으로 비자명한 상태가 카이랄 콘도 상호작용과 관련이 있음을 밝힘.", "implication": "모아레 시스템 내에서 강상관 물성과 위상적 위상이 공존할 수 있음을 증명하며, 이는 토폴로지 양자 정보 소자 설계에 중요한 기초가 됨.", "novelty": "기존 무거운 페르미온 시스템에서 볼 수 없었던 모아레 특유의 위상 절연체 상태를 발견하였으며, 이는 콘도 붕괴와 위상 물성 간의 상관관계를 직접적으로 보여줌.", "unresolved": "카이랄 콘도 상호작용이 구체적으로 어떤 에너지 스케일에서 지배적인지, 그리고 Chern 수의 미시적 원인이 정확히 무엇인지에 대한 추가적인 이론적 정립이 필요함.", "future_work": "STS를 이용한 국소 상태 밀도 측정이나 특정 자기장 환경에서의 수송 특성 연구를 통해 Chern 상태의 위상적 성질을 상세히 규명할 것으로 기대됨.", "concepts": [{"term": "모아레 콘도 격자", "why_emerged": "모아레 밴드에서의 전자 상관관계와 국소 모멘트 간의 상호작용을 연구하기 위해 도입됨.", "origin": "최근 2D 모아레 시스템의 비약적 발전과 함께 연구됨.", "connections": "무거운 페르미온(Heavy Fermion), 콘도 효과, 밴드 평탄화."}, {"term": "Chern 절연체", "why_emerged": "외부 자기장 없이도 자발적인 시간 역전 대칭 깨짐을 통해 위상적 에지 상태를 갖는 물질을 구현하기 위해 도입됨.", "origin": "Haldane 모델(1988).", "connections": "양자 변칙 홀 효과, 토폴로지 밴드, 모아레 시스템."}], "english_summary": ["A new topological state is observed near a Kondo breakdown in a moiré Kondo lattice.", "The study links chiral Kondo interaction to the emergence of nontrivial topological states.", "Topological Chern insulators are realized at fractional moiré fillings.", "This provides new insights into correlated moiré systems beyond conventional heavy-fermion materials."]}}, {"title": "Evolution of the Superfluid Density in Infinite-Layer Nickelates", "journal": "PRL_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/25gn-bfgw", "authors": "Bai Yang Wang, Shannon P. Harvey, Kyuho Lee, et al.", "last_authors": "Srinivas Raghu, Harold Y
