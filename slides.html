<title>Daily Paper Slideshow</title>
<style>
  :root {
    color-scheme: light;
    --bg: #f6f7f4;
    --paper: #ffffff;
    --ink: #111827;
    --muted: #64748b;
    --line: #d8ddd2;
    --accent: #176b87;
    --accent-2: #9a3412;
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; overflow: auto; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: var(--bg); color: var(--ink); }
  .shell { max-width: 1500px; min-height: 100vh; margin: 0 auto; padding: 14px 18px; display: flex; flex-direction: column; }
  .topbar { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 16px; }
  .top-actions { display: flex; align-items: center; gap: 10px; }
  .topbar a, button { border: 1px solid var(--line); border-radius: 8px; background: var(--paper); color: var(--ink); padding: 10px 14px; font-weight: 700; text-decoration: none; cursor: pointer; }
  button.primary { background: var(--accent); border-color: var(--accent); color: white; }
  button:disabled { opacity: 0.45; cursor: not-allowed; }
  .counter { color: var(--muted); font-weight: 700; }
  .slide { min-height: calc(100vh - 82px); background: var(--paper); border: 1px solid var(--line); border-radius: 10px; padding: 18px; box-shadow: 0 18px 42px rgba(15, 23, 42, 0.10); display: grid; grid-template-columns: minmax(310px, 0.86fr) minmax(0, 1.55fr); gap: 18px; overflow: visible; }
  .paper-head { min-width: 0; min-height: 0; overflow: visible; display: flex; flex-direction: column; gap: 12px; }
  .figure { margin: 0; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: #f8fafc; }
  .figure img { display: block; width: 100%; max-height: 41vh; object-fit: contain; background: white; }
  .figure figcaption { padding: 7px 10px; color: var(--muted); font-size: 12px; line-height: 1.3; }
  .head-text { display: flex; flex-direction: column; gap: 9px; min-width: 0; }
  .badges { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .badge { border-radius: 999px; padding: 5px 9px; background: #eef2ff; color: #3730a3; font-size: 12px; font-weight: 800; }
  .score { background: #fee2e2; color: #991b1b; }
  h1 { margin: 0; font-size: 25px; line-height: 1.15; letter-spacing: 0; overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
  h1 a { color: inherit; text-decoration-color: rgba(23, 107, 135, 0.35); text-decoration-thickness: 2px; text-underline-offset: 4px; }
  h1 a:hover { color: var(--accent); text-decoration-color: var(--accent); }
  .meta, .authors, .why, .abstract { font-size: 13px; line-height: 1.45; }
  .meta, .authors { color: var(--muted); }
  .why strong, .abstract strong, .authors strong { color: var(--ink); }
  .authors { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .why { border-left: 4px solid var(--accent-2); padding-left: 10px; color: #374151; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .abstract { border-top: 1px solid var(--line); padding-top: 14px; color: #374151; }
  .original-abstract { border-top: 1px solid var(--line); padding-top: 10px; color: #374151; font-size: 11.5px; line-height: 1.35; overflow-wrap: anywhere; }
  .original-abstract strong { display: block; margin-bottom: 4px; color: var(--ink); }
  .tags { display: flex; flex-wrap: wrap; gap: 8px; }
  .tag { border-radius: 999px; padding: 4px 8px; background: #f1f5f9; color: #475569; font-size: 12px; font-weight: 700; }
  .head-text > .link { display: none; }
  .briefing { min-width: 0; min-height: 0; overflow: visible; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); grid-auto-rows: minmax(0, auto); align-content: start; gap: 11px 18px; border-top: 0; padding-top: 0; }
  .brief-section { min-width: 0; }
  .brief-section.wide { grid-column: 1 / -1; }
  .brief-section h2 { margin: 0 0 4px; font-size: 14px; line-height: 1.22; color: #0f766e; letter-spacing: 0; }
  .brief-section p, .brief-section li { margin: 0; font-size: 12.5px; line-height: 1.42; color: #1f2937; overflow-wrap: anywhere; }
  .brief-section ul { margin: 0; padding-left: 20px; }
  .concepts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 9px 14px; }
  .concept { border-top: 1px solid var(--line); padding-top: 7px; }
  .concept h3 { margin: 0 0 4px; font-size: 13px; color: #7c2d12; letter-spacing: 0; }
  .concept p { margin: 2px 0 0; font-size: 11.5px; line-height: 1.35; color: #374151; overflow-wrap: anywhere; }
  .concept b { color: #111827; }
  .link { color: var(--accent); font-weight: 800; text-decoration: none; }
  .empty { padding: 48px; background: var(--paper); border: 1px solid var(--line); border-radius: 12px; color: var(--muted); }
  @media (max-width: 860px) {
    .shell { padding: 14px; }
    .topbar, .top-actions { align-items: stretch; flex-direction: column; }
    .slide, .briefing, .concepts { grid-template-columns: 1fr; }
    .slide { min-height: auto; overflow: visible; display: grid; }
    h1 { font-size: 28px; }
  }
</style>

const slides = [{"title": "Interface-Confined Superconductivity with Thickness-Independent Superfluid Stiffness in (Pb,Sn)Te/FeTe Bilayers", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2607.17539", "authors": "Zi-Jie Yan, Hongtao Rong, Yiyuan Luo, et al.", "last_authors": "Chih-Kang Shih, Cui-Zu Chang", "summary": "Interface-induced superconductivity in FeTe-based heterostructures provides a promising route toward topological superconductivity, yet the roles of the neighboring layers topology, symmetry, and electronic structure remain unresolved. In this work, we employ molecular beam epitaxy to grow Pb1-xSnxTe/FeTe bilayers and use angle-resolved photoemission spectroscopy to track the evolution of the Pb1-xSnxTe layer from a trivial insulator to a topological crystalline insulator hosting multiple Dirac surface states. Electrical transport measurements reveal robust superconductivity throughout the entire composition range, with a nearly constant superconducting transition temperature of ~12 K despite substantial changes in the electronic structure and topology of Pb1-xSnxTe. Double-coil mutual-inductance measurements further reveal comparable superfluid stiffness across the topological phase transition and nearly thickness-independent superfluid stiffness despite large variations in the constituent-layer thicknesses, demonstrating that superconductivity is confined near the interface. These results establish that superconductivity in FeTe-based heterostructures is largely insensitive to the topology, crystal symmetry, and detailed electronic structure of the neighboring layer, supporting a primary origin in modifications to the FeTe layer. The coexistence of interface-confined superconductivity and tunable multiple Dirac surface states in Pb1-xSnxTe/FeTe bilayers provides a versatile platform for exploring topological superconductivity and interactions among multiple Majorana zero modes.", "tier": "A_MUST_READ", "score": "10", "reason": "Direct hit: ARPES study of interface-confined topological superconductivity and Dirac states, relevant to Majorana.", "tags": ["ARPES", "superconductivity", "topological", "Majorana", "Dirac", "heterostructure", "experiment"], "image": "https://arxiv.org/static/browse/0.3.4/images/arxiv-logo-fb.png", "briefing": {"background": "FeTe는 벌크 상태에서 반강자성을 띠며 초전도성이 없으나, 특정 기판 위나 이종 접합 구조에서는 계면 효과를 통해 높은 온도의 초전도성이 유도될 수 있습니다. 이러한 계면 초전도체와 위상 물질(TCI 등)의 결합은 위상 초전도 및 마요라나 제로 모드 구현을 위한 유망한 플랫폼으로 여겨집니다.", "motivation": "위상 결정 절연체인 (Pb,Sn)Te와 FeTe의 이종 접합에서 상부 층의 위상학적 성질(위상 절연체 vs 일반 절연체)과 두께 변화가 계면 초전도성에 구체적으로 어떤 영향을 미치는지 밝히고자 했습니다.", "result": "ARPES를 통해 (Pb,Sn)Te 층이 조성에 따라 일반 절연체에서 위상 결정 절연체로 상전이하며 다중 디락 표면 상태를 형성함을 확인했습니다. 그러나 전기 수송 특성과 상호 인덕턴스 측정 결과, 초전도 전이 온도(Tc ~12 K)와 초전도 유체 강성(superfluid stiffness)은 상부 층의 위상이나 두께 변화에 관계없이 거의 일정하게 유지되었습니다.", "implication": "이 결과는 해당 시스템의 초전도성이 상부 층의 전자 구조나 대칭성에 크게 의존하지 않고 FeTe 층의 계면 수정(modification)에 의해 지배됨을 시사합니다. 이는 계면 구속형 초전도와 조절 가능한 디락 표면 상태가 공존하는 안정적인 플랫폼을 제공합니다.", "novelty": "ARPES를 이용해 상부 층의 위상 상태를 실시간으로 추적하면서 초전도 파라미터와의 상관관계를 직접 검증한 점이 돋보입니다. 특히 초전도 유체 강성이 두께에 독립적이라는 발견은 초전도가 계면에 매우 국한되어 있음을 결정적으로 보여주는 증거입니다.", "unresolved": "FeTe 층의 구체적인 구조적 변화나 전하 이동이 초전도 유도에 기여하는 정확한 미시적 메커니즘에 대해서는 추가적인 연구가 필요합니다.", "future_work": "조절 가능한 다중 디락 표면 상태와 계면 초전도체 사이의 근접 효과를 활용하여 마요라나 제로 모드 간의 상호작용 및 비가환 통계 특성 연구가 진행될 것으로 보입니다.", "concepts": [{"term": "위상 결정 절연체 (Topological Crystalline Insulator)", "why_emerged": "시간 역전 대칭성이 아닌 결정 격자 대칭성에 의해 보호되는 새로운 위상 상태를 정의하기 위해 등장했습니다.", "origin": "2011년 Liang Fu에 의해 이론적으로 제안되었습니다.", "connections": "Pb1-xSnxTe는 대표적인 TCI 물질로, 거울 대칭성(mirror symmetry)에 의해 보호되는 표면 상태를 가집니다."}, {"term": "초전도 유체 강성 (Superfluid Stiffness)", "why_emerged": "초전도체의 위상 정렬(phase ordering) 정도를 측정하고, 시스템의 유효 차원과 초전도 전이의 성격을 규명하기 위해 사용됩니다.", "origin": "초전도 현상의 현상론적 연구 과정에서 정립되었습니다.", "connections": "2차원 시스템에서는 Berezinskii-Kosterlitz-Thouless(BKT) 전이와 밀접한 관련이 있습니다."}], "english_summary": ["MBE-grown (Pb,Sn)Te/FeTe bilayers exhibit interface-confined superconductivity with Tc ~12 K.", "ARPES confirms a topological phase transition in the (Pb,Sn)Te layer, yet superconductivity remains robust and unchanged.", "Superfluid stiffness is found to be independent of constituent layer thickness, proving strict interface confinement.", "The system provides a versatile platform for studying multiple Dirac surface states coupled with 2D superconductivity."]}}, {"title": "Spectroscopic evidence for unconventional surface magnetism in the Kondo insulator FeSb2", "journal": "arXiv_CondMat", "source": "author whitelist", "link": "https://arxiv.org/abs/2611.19804", "authors": "Ke-Jun Xu, Erin E. Fleck Jonathan A. Sobota, Nhat Huy M. Tran, et al.", "last_authors": "Chunjing Jia, Robert J. Birgeneau", "summary": "Kondo insulators have a non-magnetic bulk due to many-body screening of local moment by conduction electrons. However, the surface of these systems has reduced density of itinerant electrons and may experience a Kondo breakdown, leading to recovery of non-zero local moments and possible magnetic order. Here we use angle-resolved photoemission spectroscopy to investigate the (010) surface of a $d$-$p$ electron Kondo insulator FeSb$_2$, which is predicted to host a bulk $d$-wave altermagnetic state in the absence of Kondo screening. We find anisotropic splitting on the surface states with a maximum in the $k_z$ direction and a minimum in the $k_x$ direction. The splitting is apparently suppressed with increasing temperature or with Te doping, suggesting that the splitting arises from a magnetic order rather than Rashba effects. Considering the proximity of the bulk to a $d$-wave altermagnetic state and considering the symmetry of the crystal on the surface, we postulate that our observations may be consistent with an emergent surface altermagnetic order. Such an unconventional 2-dimensional magnetic order naturally hosted on an insulating, non-magnet bulk substrate may offer a promising platform for versatile applications.", "tier": "A_MUST_READ", "score": "10", "reason": "author whitelist: Takeshi Kondo", "tags": ["angle-resolvedphotoemission", "photoemission", "altermagnet", "Kondo"], "image": "https://arxiv.org/html/2611.19804v1/Fig1_surface-01.png", "briefing": {"background": "콘도 절연체(Kondo insulator)는 벌크에서 전도 전자와 국부 모멘트의 스크리닝을 통해 비자성 바닥 상태를 가집니다. 그러나 표면에서는 전도 전자 밀도가 낮아지는 '콘도 파괴(Kondo breakdown)' 현상이 일어나 국부 모멘트가 회복되고 자기 질서가 나타날 가능성이 이론적으로 제기되어 왔습니다.", "motivation": "강한 전자 상관관계를 가진 FeSb2 물질의 (010) 표면에서 나타나는 전자 구조의 비등방적 쪼개짐(splitting)의 원인이 자기적 기원인지, 혹은 단순한 라쉬바 효과인지 ARPES를 통해 규명하고자 했습니다.", "result": "ARPES 측정 결과, FeSb2 표면 상태에서 뚜렷한 이방성 밴드 쪼개짐을 관찰했습니다. 이 쪼개짐은 온도가 올라가거나 Te 도핑을 통해 콘도 격자가 파괴될 때 억제되는 거동을 보였습니다. 이는 대칭성 분석과 결합되어 단순한 스핀-궤도 결합(Rashba)이 아닌 알터자성(altermagnetic) 성격의 표면 자기 질서일 가능성을 시사합니다.", "implication": "벌크는 비자성 절연체임에도 불구하고 표면에서만 비전통적인 자기 질서(알터자성 등)가 나타날 수 있음을 보여주며, 이는 자성 소자 응용을 위한 새로운 형태의 계면 플랫폼을 제시합니다.", "novelty": "전통적인 콘도 절연체인 FeSb2에서 '표면 자성'과 최근 화두인 '알터자성' 개념을 연결시킨 점이 매우 참신합니다. 특히 ARPES를 통한 밴드 쪼개짐의 이방성 분석이 이를 뒷받침합니다.", "unresolved": "표면 자기 구조를 직접적으로 측정할 수 있는 자성 민감 산란 실험이나 STM 등을 통한 국부적인 확인이 보완되어야 합니다.", "future_work": "다양한 도핑 조건에서의 상도표 작성과 다른 결정면에서의 표면 상태 비교 연구가 예상됩니다.", "concepts": [{"term": "콘도 파괴 (Kondo Breakdown)", "why_emerged": "중격자 페르미온 시스템에서 중격자 상태가 붕괴하며 국부 모멘트가 다시 나타나는 현상을 설명하기 위해 제안되었습니다.", "origin": "강상관 전자계 이론 연구자들에 의해 정립되었습니다.", "connections": "양자 임계점(Quantum Critical Point) 및 표면 자성 발현과 깊은 연관이 있습니다."}, {"term": "알터자성 (Altermagnetism)", "why_emerged": "강자성과 반강자성의 특징을 동시에 가지며(순자화는 0이나 운동량 공간에서 스핀 쪼개짐 발생), 비전통적인 스핀 분해 전자 구조를 설명하기 위해 등장했습니다.", "origin": "최근(2020년대 초) Libor Šmejkal 등에 의해 체계화되었습니다.", "connections": "반강자성 스핀트로닉스와 위상 자성 물질 연구의 핵심 개념으로 급부상 중입니다."}], "english_summary": ["ARPES study reveals anisotropic surface state splitting on the (010) surface of Kondo insulator FeSb2.", "Temperature and doping dependence suggest the splitting originates from magnetic order rather than Rashba effects.", "The results are consistent with an emergent surface altermagnetic order due to surface Kondo breakdown.", "This provides a potential platform for realizing 2D magnetic phases on non-magnetic insulating substrates."]}}, {"title": "Surface-bulk magnetic dichotomy in intercalated transition metal dichalcogenides", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2611.20123", "authors": "Ke Liao, Wenxin Li, Kelly Dai, et al.", "last_authors": "Yu He, Tianyu Zhu", "summary": "Magnetically intercalated transition metal dichalcogenides are layered materials with highly tunable magnetic orders and unconventional transport properties. Here we report a surface-bulk magnetic dichotomy in M 1 / 3 ​ TX 2 \\mathrm{M}_{1/3}\\mathrm{T}\\mathrm{X}_{2} , in which the surface and bulk favor distinct magnetic orders. In Fe 1 / 3 ​ NbS 2 \\mathrm{Fe}_{1/3}\\mathrm{Nb}\\mathrm{S}_{2} , angle-resolved photoemission spectroscopy (ARPES) results are reproduced by an A-type antiferromagnetic electronic structure, while neutron scattering and bulk DFT+ U U calculations identify stripe order as the bulk ground state. DFT+ U U slab calculations resolve this contradiction by showing that relaxation of an Fe-terminated surface reverses the magnetic preference from stripe to A-type order. The same dichotomy recovers the K K -centered Fermi-surface pockets that are observed in Co 1 / 3 ​ NbS 2 \\mathrm{Co}_{1/3}\\mathrm{Nb}\\mathrm{S}_{2} and Co 1 / 3 ​ TaS 2 \\mathrm{Co}_{1/3}\\mathrm{Ta}\\mathrm{S}_{2} but absent from previous bulk calculations. Notably, the surface-stabilized magnetic phase of Fe 1 / 3 ​ NbS 2 \\mathrm{Fe}_{1/3}\\mathrm{Nb}\\mathrm{S}_{2} carries nonrelativistic spin splitting and can exhibit altermagnetic character. These results caution against the general association of ARPES signals with bulk magnetic states in these systems, and suggest surface-bulk magnetic dichotomy as a promising route to realize magnetic phases, including altermagnetism, that are not energetically favored in the bulk.", "ti "origin": "John Kerr (1877).", "connections": "Faraday effect, Magnetic domains"}], "english_summary": ["Predicted electric-field-controllable spin-momentum locking in bilayer Cr2SeO using DFT calculations.", "Reversing the out-of-plane electric field switches the spin conductivity sign and Kerr rotation.", "Proposed an altermagnetic tunnel junction achieving an ultra-high TMR ratio of 10^8 without Néel vector rotation.", "Provides a theoretical foundation for all-electrical control of altermagnetic spintronic devices."]}}, {"title": "Emergent kagome-like electronic texture in epitaxial -Sb on Al(111)", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2112.05424", "authors": "Yang Wang, Pujing Zhang", "last_authors": "Yang Wang, Pujing Zhang", "summary": "We report the epitaxial growth of $\\beta$-Sb on Al(111) and the emergence of a kagome-like electronic texture with increasing Sb coverage. The surface evolves from disordered clusters through honeycomb and dice patterns before kagome-like regions appear. Diffraction, scanning tunneling microscopy, spectroscopy, and density functional calculations identify the ordered phase as $\\beta$-Sb formed by AB stacking of two dice layers, with the honeycomb phase serving as a precursor. The kagome-like maxima occupy bridge positions within the same lateral lattice and differ in apparent height from dice regions by only about 25 pm. Together with the absence of an additional chemical component or distinct band manifold in photoemission, these observations support an electronic origin of the kagome-like contrast. Comparison of local tunneling spectra with calculated orbital projections suggests an energy selective change in the relative spectral contributions of Sb p states. Interface separation tests reveal sensitivity to Al-Sb coupling, while vacuum local density of states calculations identify states with enhanced bridge density. These results suggest that local interface changes could alter the balance between atomic and bridge contributions to tunneling within $\\beta$-Sb. For a reference $\\beta$-Sb model retaining the epitaxial geometry after Al removal, spin-orbit coupling modifies local band dispersions while the structure remains metallic. The model exhibits a finite intrinsic spin Hall response that varies with chemical potential.", "tier": "A_MUST_READ", "score": "9", "reason": "Experimental STM/STS/photoemission study on emergent kagome-like electronic texture in epitaxial Sb.", "tags": ["STM/STS", "photoemission", "kagome", "electronicstructure", "spinHall"], "image": "https://arxiv.org/static/browse/0.3.4/images/arxiv-logo-fb.png", "briefing": {"background": "카고메(kagome) 격자는 플랫 밴드, 디락 콘, 위상적 특성 등 독특한 전자 구조로 인해 응집 물질 물리에서 핵심적인 연구 대상입니다. 특히 최근에는 AV3Sb5 계열 물질에서 나타나는 초전도와 전하 밀도 파(CDW)의 얽힘이 큰 주목을 받고 있습니다.", "motivation": "이 연구는 Al(111) 기판 위에 에피택셜하게 성장시킨 베타 안티모니(beta-Sb) 박막에서 나타나는 특이한 전자적 패턴을 조사하고, 이것이 실제 원자 배열인지 아니면 전자 구조의 발현인지를 규명하고자 했습니다.", "result": "연구팀은 Sb 층이 두꺼워짐에 따라 허니컴, 다이스(dice) 패턴을 거쳐 최종적으로 '카고메 형태'의 전자적 질감이 나타남을 확인했습니다. 중요한 점은 이것이 원자들의 물리적 카고메 격자가 아니라, 계면 결합과 Sb의 p-오비탈 기여도가 에너지 선택적으로 변하면서 나타나는 순수 전자적 현상(electronic texture)이라는 것입니다.", "implication": "실제 격자 구조가 카고메가 아니더라도 특정 에너지 영역에서는 카고메 물리(예: 베리 곡률과 관련된 반응)를 모방할 수 있음을 시사합니다. 또한, 이 시스템은 이론적으로 유한한 내인성 스핀 홀 응답을 가질 것으로 예측되었습니다.", "novelty": "구조적 카고메 격자 없이도 '전자적 카고메 패턴'을 유도할 수 있음을 STM/STS와 DFT를 통해 증명했습니다. 카고메 금속(CsV3Sb5 등)을 연구하는 독자에게 계면 제어를 통한 새로운 위상 상태 발현의 가능성을 제시합니다.", "unresolved": "이러한 전자적 질감이 실제 거시적인 수송 특성(특히 스핀 홀 효과)으로 얼마나 효율적으로 연결될지는 아직 실험적으로 확인되지 않았습니다.", "future_work": "ARPES를 통한 실제 밴드 분산 측정과 스핀 홀 전도도 측정을 위한 소자 제작이 필요할 것으로 보입니다.", "concepts": [{"term": "Electronic Texture", "why_emerged": "원자 격자의 물리적 배열과 별개로 나타나는 전하 밀도나 국소 상태 밀도의 공간적 패턴을 설명하기 위해 도입되었습니다.", "origin": "초록 정보만으로는 특정하기 어려우나, STM 연구에서 널리 사용되는 개념입니다.", "connections": "Charge Density Wave (CDW), Friedel oscillations, Moiré patterns"}, {"term": "Beta-Antimony (beta-Sb)", "why_emerged": "Sb의 동소체 중 하나로, 위상적 절연체나 위상 반금속 특성을 탐구하기 위한 박막 소재로 연구됩니다.", "origin": "결정학적으로 알려진 Sb의 상(phase) 중 하나입니다.", "connections": "Group-V semimetals, Topological Insulators"}, {"term": "Spin Hall Response", "why_emerged": "전하 흐름이 스핀 흐름을 유도하는 현상을 정량화하여 스핀트로닉스 응용 가능성을 평가하기 위해 필요합니다.", "origin": "Mikhail Dyakonov와 Igor Perel이 이론적으로 제안(1971).", "connections": "Spin-orbit coupling, Berry curvature, Spin Hall Insulators"}, {"term": "Dice Lattice", "why_emerged": "허니컴 격자의 중심에 원자가 추가된 기하 구조로, 플랫 밴드를 포함한 독특한 밴드 구조를 연구하기 위해 도입되었습니다.", "origin": "이론적 격자 모델에서 유래했습니다.", "connections": "Honeycomb lattice, Kagome lattice, Flat-band physics"}], "english_summary": ["Epitaxial growth of beta-Sb on Al(111) reveals a coverage-dependent transition into a kagome-like electronic texture.", "The kagome pattern is identified as an electronic effect originating from energy-selective Sb p-state contributions rather than a structural kagome lattice.", "The system exhibits a finite intrinsic spin Hall response that can be tuned by the chemical potential.", "Comparison between STM/STS and DFT calculations confirms the sensitivity of this texture to Al-Sb interface coupling."]}}, {"title": "Nonlocality relates cuprate photoemission /T scaling to a broad dielectric loss peak", "journal": "arXiv_CondMat", "source": "keyword", "link": "https://arxiv.org/abs/2608.03013", "authors": "Jian Xian Sim", "last_authors": "Jian Xian Sim", "summary": "Photoemission spectroscopy on high $T_c$ cuprates reveals a puzzling nodal self-energy with $\\omega/T$ scaling and an exponent varying continuously with doping. Meanwhile, electron energy loss spectroscopy finds a broad $\\sim 1$eV peak whose physical origin remains debated. We propose they share a common origin by introducing a phenomenological model of nonlocal screening in a many-body charged fluid. The model's key feature is spatially nonlocal effective repulsions between carriers $V_{\\alpha}(r) \\sim 1/r^\\alpha$, with doping-dependent $\\alpha$. The model predicts a falsifiable relationship between independently measured self-energy exponent $\\gamma$ and loss function peak dispersion exponent $\\alpha$, as $\\gamma = 2-\\frac{1}{\\alpha}$. This can be tested using modern ARPES and EELS. Nonlocality provides an alternative route to $\\omega/T$ scaling in observables, although it is conventionally regarded as a signature of quantum criticality.", "tier": "A_MUST_READ", "score": "9", "reason": "title strong match: photoemission", "tags": ["ARPES", "photoemission", "cuprate", "quantumcritical"], "image": "https://arxiv.org/html/2608.03013v3/falsifyexpt.png", "briefing": {"background": "고온 초전도체인 구리 산화물(cuprates)은 비정상 금속(strange metal) 상태에서 에너지(omega)와 온도(T)에 비례하는 산란율(scaling)을 보입니다. 이는 통상적으로 양자 임계점 근처의 현상으로 해석되어 왔습니다.", "motivation": "ARPES에서 관찰되는 이 특이한 옴/T 스케일링과 EELS(전자 에너지 손실 분광)에서 나타나는 넓은 유전 손실 피크(dielectric loss peak) 사이의 상관관계를 물리적으로 설명하고자 했습니다.", "result": "연구자는 전하 유체 내의 '비국소적 차폐(nonlocal screening)' 모델을 제안했습니다. 이 모델은 캐리어 간의 반발력이 거리에 따라 1/r^alpha로 감쇠한다고 가정하며, 이를 통해 ARPES 자가 에너지 지수(gamma)와 EELS 분산 지수(alpha) 사이의 명확한 관계식(gamma = 2 - 1/alpha)을 도출했습니다.", "implication": "구리 산화물의 기묘한 산란 현상이 반드시 양자 임계성 때문이 아니라, 장범위(long-range) 비국소 상호작용의 결과일 수 있음을 시사합니다.", "novelty": "서로 다른 측정 기법인 ARPES와 EELS의 데이터를 하나의 현상론적 모델로 통합했다는 점이 혁신적입니다. ARPES를 주력으로 하는 독자에게 자기 에너지 분석의 새로운 관점을 제공합니다.", "unresolved": "제안된 비국소 상호작용의 구체적인 미시적 기원과 도핑에 따른 지수 alpha의 변화 원인은 아직 명확하지 않습니다.", "future_work": "동일한 도핑 농도를 가진 시료에 대해 ARPES와 EELS를 정밀하게 측정하여 제안된 관계식이 성립하는지 실험적으로 검증해야 합니다.", "concepts": [{"term": "omega/T Scaling", "why_emerged": "비정상 금속에서 관측되는 물리량이 에너지와 온도의 비(ratio)에만 의존하는 보편적 거동을 설명하기 위해 등장했습니다.", "origin": "Marginal Fermi Liquid 이론 등에서 강조됨.", "connections": "Strange metals, Quantum criticality, Self-energy"}, {"term": "Nonlocal Screening", "why_emerged": "특정 지점의 전하 분포가 주변 넓은 영역의 전위 형성에 영향을 미치는 효과를 설명하기 위해 도입되었습니다.", "origin": "고체물리학의 다체 문제 연구에서 유래.", "connections": "Dielectric function, Coulomb interaction, Plasmons"}, {"term": "Self-energy (Sigma)", "why_emerged": "상호작용이 있는 계에서 준입자의 에너지 변화와 수명을 기술하기 위해 필요합니다. ARPES 데이터의 선폭과 위치 변화로 추출됩니다.", "origin": "양자 장론의 다체 문제 기법.", "connections": "ARPES linewidth, Quasiparticles, Green's function"}, {"term": "Dielectric Loss Function", "why_emerged": "물질 내부의 전자 밀도 요동과 에너지 흡수 메커니즘을 이해하기 위해 정의되었습니다.", "origin": "EELS 및 광학적 측정 연구.", "connections": "EELS, Plasmons, Kramers-Kronig relations"}], "english_summary": ["A phenomenological model of nonlocal screening is proposed to link cuprate ARPES self-energy scaling with EELS loss peaks.", "The model introduces a power-law interaction 1/r^alpha and predicts a specific relation between ARPES and EELS exponents.", "This provides an alternative explanation for omega/T scaling that does not strictly rely on quantum criticality.", "The theory offers a falsifiable prediction that can be tested by comparing energy-dependent ARPES and momentum-resolved EELS."]}}, {"title": "Electronic structure, quasiparticle renormalizations, and magnetic correlations in the alternating single-layer bilayer nickelate La5Ni3O11", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/4dmx-knsn", "authors": "I. V. Leonov", "last_authors": "I. V. Leonov", "summary": "Using the $\\mathrm{DFT}\\phantom{\\rule{0.16em}{0ex}}+$ dynamical mean-field theory ($\\mathrm{DFT}+\\mathrm{DMFT}$) method, we study the normal-state electronic structure, orbital-dependent quasiparticle renormalizations, Fermi surface, and magnetic correlations in the recently discovered alternating s…", "tier": "B_IMPORTANT_CONDMAT", "score": "9", "reason": "Direct electronic structure study of nickelates, high relevance to strongly correlated electron research.", "tags": ["nickelates", "DFT+DMFT", "electronicstructure"], "image": "", "briefing": {"background": "최근 니켈 산화물(nickelates)은 구리 산화물 초전도체의 유사체로서 고온 초전도 연구의 새로운 전선으로 떠오르고 있습니다. 특히 층상 구조에 따라 물리량이 크게 변하는 특성을 보입니다.", "motivation": "새롭게 발견된 La5Ni3O11 시스템은 단일층(single-layer)과 이중층(bilayer) 니켈-산소 면이 번갈아 나타나는 독특한 구조를 가집니다. 이 복잡한 구조 내에서의 전자 상관관계와 자기적 특성을 이론적으로 규명하고자 했습니다.", "result": "DFT+DMFT 계산을 통해 각 오비탈별 준입자 재규격화(renormalization)와 페르미 면의 형상을 도출했습니다. 특히 단일층과 이중층 니켈 원자들의 상호작용이 어떻게 다른지, 그리고 이것이 전체적인 자기 상관관계에 어떤 영향을 미치는지 분석했습니다.", "implication": "이 물질이 구리 산화물과 유사한 초전도성을 보일 가능성을 타진하고, 다층 구조 니켈레이트에서의 전자 구조 제어 가능성을 보여줍니다.", "novelty": "기존의 단순 무한층(infinite-layer)이나 단순 이중층 니켈레이트와는 다른, '교대 적층' 구조를 가진 구체적인 화합물(La5Ni3O11)의 전자 구조를 정밀하게 계산했다는 점이 핵심입니다. 강상관 전자계와 니켈레이트에 관심 있는 독자에게 유용한 참고 자료입니다.", "unresolved": "계산 결과가 실제 실험(ARPES, 중성자 산란 등)에서 관찰되는 물리량과 얼마나 일치하는지에 대한 검증이 필요합니다.", "future_work": "고품질 단결정 합성 후 ARPES를 이용한 페르미 면 측정과 RIXS를 이용한 자기 들뜸(magnetic excitation) 측정이 예상됩니다.", "concepts": [{"term": "DFT+DMFT", "why_emerged": "밀도범함수이론(DFT)의 한계인 강한 전자 상관관계를 동역학적 평균장 이론(DMFT)을 통해 보완하여 실제 물질을 더 정확히 묘사하기 위해 개발되었습니다.", "origin": "Antoine Georges, Gabriel Kotliar 등에 의해 1990년대 정립.", "connections": "Strongly correlated systems, Hubbard model, Electronic structure"}, {"term": "Quasiparticle Renormalization", "why_emerged": "전자 간의 상호작용으로 인해 준입자의 유효 질량이 무거워지거나 수명이 변하는 정도를 나타내기 위해 사용됩니다.", "origin": "Landau의 페르미 액체 이론.", "connections": "Effective mass, Z-factor, Fermi liquid"}, {"term": "Nickelates", "why_emerged": "구리 산화물(cuprates) 이외의 전이 금속 산화물에서 고온 초전도성을 찾으려는 시도에서 중요해졌습니다.", "origin": "1990년대 이론적 제안 후 2019년 박막 초전도 발견으로 급성장.", "connections": "High-Tc superconductivity, Cuprates, Charge order"}, {"term": "Magnetic Correlations", "why_emerged": "전자들의 스핀이 서로 어떻게 정렬되려 하는지를 파악하여 초전도의 매개나 자성 상전이를 이해하기 위해 연구됩니다.", "origin": "고체 자성 이론.", "connections": "Spin fluctuations, Neutron scattering, Superconductivity"}], "english_summary": ["The normal-state electronic structure of the alternating single-layer/bilayer nickelate La5Ni3O11 is investigated using DFT+DMFT.", "Calculations provide orbital-dependent quasiparticle renormalizations and reveal the specific Fermi surface topology of this hybrid structure.", "The study evaluates magnetic correlations, highlighting the impact of the unique stacking sequence on the material's many-body physics.", "This work provides a theoretical baseline for understanding the potential for unconventional superconductivity in multi-layer nickelates."]}}, {"title": "Fermi-surface-driven linear magnetoresistance in the kagome magnet TbMn6Sn6", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/grzw-y5lz", "authors": "Sicheng Zhou, Ruihuan Duan, Jie Pang, et al.", "last_authors": "Guangtong Liu, Li Lu", "summary": "Here, the authors identify a Fermi surface driven mechanism for positive linear magnetoresistance in the kagome ferrimagnet TbMn 6 Sn 6 . Measurements on multiple nanoflake devices reveal pronounced linear magnetoresistance, with substantial device-to-device variations in both its slope and the quadratic-to-linear crossover field. Combining magnetotransport experiments with first-principles-based semiclassical calculations, the authors demonstrate how the relaxation time and small shifts in chemical potential govern these variations. These findings provide insight into the microscopic origin of linear magnetoresistance and, in particular, its emergence at relatively low crossover fields.", "tier": "B_IMPORTANT_CONDMAT", "score": "9", "reason": "Directly relevant experimental work on kagome magnets and Fermi surface electronic structure.", "tags": ["experiment", "kagome", "magnetoresistance"], "image": "", "briefing": {"background": "카고메 격자 자성체는 특이한 밴드 구조(플랫 밴드, 디락 콘 등)로 인해 위상학적 상태와 독특한 수송 특성을 연구하기에 최적의 플랫폼입니다. 특히 이들 물질에서 관찰되는 선형 자기저항(Linear Magnetoresistance, LMR)은 종종 양자 한계 상태나 특수한 밴드 분산의 증거로 간주되어 왔습니다.", "motivation": "TbMn6Sn6와 같은 카고메 페리자성체에서 나타나는 LMR의 기원이 단순히 위상학적 디락 밴드에 의한 것인지, 아니면 페르미면의 기하학적 특성과 산란 메커니즘에 의한 것인지 명확히 규명하고자 했습니다.", "result": "연구진은 여러 나노플레이크 소자에서 측정된 LMR이 소자마다 슬로프와 크로스오버 자장이 다르다는 점에 주목했습니다. 반고전적(semiclassical) 계산과 실험을 결합하여, 이러한 변동성이 화학 퍼텐셜의 미세한 이동과 완화 시간(relaxation time)의 변화에 따른 페르미면의 기하학적 효과에 의해 지배된다는 것을 증명했습니다.", "implication": "LMR이 반드시 극도로 높은 자장이나 순수한 양자 한계 상태가 아니더라도, 페르미면의 특성에 의해 비교적 낮은 자장에서 발생할 수 있음을 시사합니다. 이는 카고메 자성체의 수송 특성을 해석할 때 밴드 구조의 세부적인 변화가 얼마나 중요한지 보여줍니다.", "novelty": "독자분의 주요 관심사인 카고메 금속(AV3Sb5 등)과 유사한 격자 구조에서 수송 특성의 미시적 기원을 밝혔다는 점이 중요합니다. 특히 단순한 위상 효과가 아닌, 실제 소자의 화학 퍼텐셜 이동과 연계된 페르미면 구동 메커니즘을 제안한 것이 핵심입니다.", "unresolved": "화학 퍼텐셜의 미세한 변화를 유도하는 구체적인 구조적 결함이나 스트레인의 역할을 실험적으로 분리하여 제어하는 과제가 남아 있습니다.", "future_work": "다른 카고메 계열 물질(CsV3Sb5 등)에서도 유사한 페르미면 구동 LMR이 나타나는지 확인하고, ARPES를 통해 계산된 화학 퍼텐셜 이동을 직접 검증하는 연구가 기대됩니다.", "concepts": [{"term": "Linear Magnetoresistance (선형 자기저항)", "why_emerged": "일반적인 금속의 자기저항은 자장의 제곱에 비례하지만, 특정 조건에서 자장에 선형으로 비례하는 현상이 발견되어 그 기원을 찾기 위해 연구됨.", "origin": "P. Kapitza (1928) 등에 의해 발견되었으며, Abrikosov 등에 의해 양자적 기원이 제안됨.", "connections": "디락/웨일 반금속, 불균일한 전도체(Adler-Long 모델), 카고메 격자 시스템."}, {"term": "TbMn6Sn6", "why_emerged": "카고메 격자를 가진 자성체로서 양자 변칙 홀 효과나 위상학적 밴드 구조를 연구하기 위한 모델 물질로 주목받음.", "origin": "초록 정보만으로는 특정하기 어려우나 1-6-6 계열 희토류-전이금속 화합물의 한 종류임.", "connections": "RM n6Sn6 계열, 위상학적 홀 효과, 카고메 자성."}, {"term": "Semiclassical Transport (반고전적 수송)", "why_emerged": "양자 역학적 밴드 구조를 고려하면서도 볼츠만 방정식을 통해 거시적인 전기 전도 현상을 설명하기 위해 도입됨.", "origin": "Sommerfeld와 Bloch 등의 금속 전자론에 기반함.", "connections": "볼츠만 방정식, 사이클로트론 운동, 페르미면 해석."}, {"term": "Chemical Potential Shift (화학 퍼텐셜 이동)", "why_emerged": "도핑, 결함, 혹은 소자 제작 과정에서의 변형으로 인해 페르미 레벨이 변하며 물성이 바뀌는 현상을 설명하기 위함.", "origin": "통계역학의 기본 개념이나 고체물리에서는 밴드 충전율 제어로 해석됨.", "connections": "게이트 전압 조절, 도핑 효과, ARPES 측정 데이터 해석."}], "english_summary": ["The study identifies a Fermi-surface-driven mechanism for linear magnetoresistance (LMR) in the kagome magnet TbMn6Sn6.", "By comparing nanoflake transport data with semiclassical calculations, the authors show that LMR variation stems from chemical potential shifts.", "This suggests that LMR in kagome systems can emerge at low fields without necessarily invoking extreme quantum limit scenarios.", "The findings emphasize the importance of Fermi surface geometry and relaxation time in understanding transport in topological magnets."]}}, {"title": "Unveiling High-Energy Ultrafast Responses Driven by Fermi-Level Gap Opening in Charge-Density Waves", "journal": "PRL_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/vz71-r52l", "authors": "Qiong Wu, Tianchen Hu, Junhan Huang, et al.", "last_authors": "Tao Dong, Nan-Lin Wang", "summary": "Ultrafast pump-probe spectroscopy is indispensable for investigating interactions, collective excitations, and nonequilibrium dynamics in superconductors and correlated electron systems. However, how a small gap opening near the Fermi surface affects the spectral changes in the high-energy interband…", "tier": "B_IMPORTANT_CONDMAT", "score": "9", "reason": "Directly relevant to CDW studies and pump-probe spectroscopy techniques used in correlated electron systems.", "tags": ["CDW", "spectroscopy", "correlated-electrons"], "image": "", "briefing": {"background": "전하 밀도 파동(CDW)은 전도 전자의 밀도가 주기적으로 변조되면서 페르미 준위 근처에 에너지 갭을 형성하는 상태입니다. 초고속 펌프-프로브 분광법은 이러한 CDW의 집단 여기와 비평형 동역학을 연구하는 강력한 도구입니다.", "motivation": "페르미 준위 근처의 작은 갭 형성이 가시광선 영역과 같은 높은 에너지의 인터밴드(interband) 전이와 관련된 광학적 응답에 구체적으로 어떤 영향을 미치는지 규명하고자 했습니다.", "result": "CDW 상태에서 페르미 준위 갭이 열릴 때, 이것이 저에너지 영역에 국한되지 않고 고에너지 인터밴드 전이의 스펙트럼 변화를 유도한다는 것을 초고속 응답 분석을 통해 밝혀냈습니다.", "implication": "고에너지 광학 응답을 측정함으로써 저에너지에서 일어나는 대칭성 붕괴(CDW 형성) 및 그 동역학을 간접적으로, 그러나 매우 정밀하게 추적할 수 있음을 의미합니다.", "novelty": "독자분의 관심사인 CDW(AV3Sb5, NbSe3 등) 연구에 있어, 초고속 분광법이 갭 동역학뿐만 아니라 전체적인 전자 구조의 재구성을 어떻게 포착할 수 있는지 보여주는 중요한 사례입니다.", "unresolved": "이러한 고에너지 응답이 서로 다른 대칭성을 가진 CDW 물질들(예: 변칙적 CDW나 다중 CDW)에서 얼마나 보편적으로 나타나는지는 추가 연구가 필요합니다.", "future_work": "다양한 상관 전자계 물질에서 펌프 에너지를 조절하며 인터밴드 응답의 선택성을 높이는 실험이 진행될 것으로 보입니다.", "concepts": [{"term": "Charge-Density Wave (CDW)", "why_emerged": "저차원 금속 시스템에서 전자-격자 상호작용에 의해 에너지를 낮추기 위해 나타나는 전하 밀도의 주기적 변조 현상.", "origin": "R. Peierls (1930년대 이론적 예측), 1970년대 전이금속 디칼코게나이드에서 실험적 확인.", "connections": "Peierls instability, 페르미면 네스팅, 초전도와의 경쟁 관계."}, {"term": "Ultrafast Pump-Probe Spectroscopy", "why_emerged": "나노초 이하의 시간 스케일에서 일어나는 전자와 격자의 동역학을 실시간으로 관찰하기 위해 개발됨.", "origin": "레이저 기술의 발전과 함께 1980년대 이후 본격화됨.", "connections": "펨토초 레이저, 비평형 상태, 전자-음향자 산란."}, {"term": "Interband Transition (인터밴드 전이)", "why_emerged": "고체 내에서 전자가 서로 다른 에너지 밴드 사이를 이동하며 빛을 흡수/방출하는 현상을 설명하기 위함.", "origin": "양자 역학적 밴드 이론의 확립과 함께 정립됨.", "connections": "광학 전도도, 밴드 갭, 결합 에너지."}, {"term": "Nonequilibrium Dynamics (비평형 동역학)", "why_emerged": "강한 외부 자극(빛 등)을 받은 후 시스템이 평형 상태로 돌아가는 과정에서 나타나는 새로운 상이나 들뜬 상태를 연구하기 위함.", "origin": "비평형 통계역학 및 레이저-물질 상호작용 연구에서 유래.", "connections": "광유도 상전이, Floquet 엔지니어링, 완화 시간."}], "english_summary": ["The paper investigates how low-energy CDW gap opening affects high-energy interband optical responses.", "Ultrafast pump-probe spectroscopy reveals that Fermi-level gaps drive significant changes in high-energy spectral features.", "This link allows high-energy probes to monitor the collective order and symmetry breaking of CDW states.", "The results offer a new perspective on interpreting the electronic dynamics of correlated systems under non-equilibrium conditions."]}}, {"title": "Charge-Transfer Energy Governed by f-d Coulomb Interaction in Rare-Earth Systems", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2611.19781", "authors": "Norimasa Sasabe, Shinji Watanabe, Akira Yasui, et al.", "last_authors": "Masaichiro Mizumaki, Hitoshi Sato", "summary": "The $f$-$d$ Coulomb interaction ($U_{\\rm fd}$) plays a central role in low-energy theories describing valence fluctuations and quantum valence criticality in rare-earth systems. In contrast, core-level spectroscopies have conventionally been analyzed using the phenomenological charge-transfer energy ($\\Delta$), and the relationship between these two descriptions has remained unclear. Here, we develop a spectroscopic framework demonstrating that the charge-transfer energy contains an $f$-$d$ Coulomb contribution $U_{\\rm fd}n_d$ arising from the $d$-electron occupation ($n_d$), leading to the charge-transfer energy $\\Delta'$. We apply this framework to the prototypical valence-transition compound YbInCu$_4$ and demonstrate, from combined analyses of core-level photoemission and $L$-edge x-ray absorption spectroscopy, that the observed spectroscopic evolution across the first-order valence transition is consistently interpreted in terms of the variation of $\\Delta'$.", "tier": "B_IMPORTANT_CONDMAT", "score": "9", "reason": "Direct relevance to electronic structure via photoemission in strongly correlated rare-earth systems.", "tags": ["photoemission", "electronicstructure", "correlated"], "image": "https://arxiv.org/html/2611.19781v1/Fig1.jpg", "briefing": {"background": "희토류 시스템에서 f-전자와 d-전자 사이의 쿨롱 상호작용($U_{fd}$)은 원자가 변동(valence fluctuation)과 양자 원자가 임계 현상을 이해하는 핵심 요소입니다. 하지만 광전자 분광법에서 주로 쓰이는 파라미터인 전하 전이 에너지($\\Delta$)와 이 $U_{fd}$ 사이의 직접적인 연결 고리는 그동안 모호했습니다.", "motivation": "코어 수준 광전자 분광법(PES)과 X선 흡수 분광법(XAS)에서 얻은 데이터로부터 어떻게 미시적인 $U_{fd}$의 기여를 분리하고 원자가 전이 현상을 설명할 것인지에 대한 프레임워크를 구축하고자 했습니다.", "result": "연구진은 전하 전이 에너지($\\Delta$)가 d-전자의 점유수($n_d$)와 $U_{fd}$의 곱만큼 보정된 형태($\\Delta'$)로 나타난다는 새로운 이론적 프레임워크를 제시했습니다. 이를 원자가 전이 물질인 YbInCu4에 적용하여, 온도에 따른 분광 데이터의 변화를 정합성 있게 설명하는 데 성공했습니다.", "implication": "광전자 분광학에서 얻은 현상론적인 파라미터를 강상관 계의 저에너지 유효 이론과 직접 연결할 수 있게 되었습니다. 이는 희토류 기반 중성 페르미온 시스템의 전자 구조 해석에 큰 진전을 의미합니다.", "novelty": "독자분이 중시하는 PES/XAS 분광 기술을 이용하여 $U_{fd}$라는 미시적 상호작용의 역할을 규명했습니다. 특히 YbInCu4와 같은 전형적인 상관 전자계 물질의 원자가 전이를 물리적으로 더 명확하게 이해할 수 있게 해줍니다.", "unresolved": "이 모델이 Yb 계열 외에 Ce이나 Sm 등 다른 희토류 화합물의 복잡한 하이브리드화 상태에서도 동일하게 적용 가능한지에 대한 검증이 필요합니다.", "future_work": "제시된 프레임워크를 바탕으로 DFT+DMFT 계산 결과와 분광 실험 데이터 간의 정량적 비교를 고도화하는 연구가 이어질 것으로 보입니다.", "concepts": [{"term": "f-d Coulomb Interaction (Ufd)", "why_emerged": "국소화된 f-전자와 전도성 d-전자 사이의 정전기적 상호작용이 시스템의 원자가 상태를 결정하기 때문에 중요함.", "origin": "Falikov-Kimball 모델 등 상관 전자계 이론에서 핵심 파라미터로 제안됨.", "connections": "원자가 전이, Kondo 효과, Falikov-Kimball 모델."}, {"term": "Charge-Transfer Energy (전하 전이 에너지)", "why_emerged": "리간드나 전도띠에서 국소화된 궤도로 전자가 이동할 때 필요한 에너지를 기술하기 위해 도입됨.", "origin": "Zaanen-Sawatzky-Allen (ZSA) 분류 체계의 핵심 개념.", "connections": "ZSA 분류, Mott 절연체, 광전자 분광학."}, {"term": "YbInCu4", "why_emerged": "온도 변화에 따라 급격한 원자가 전이(Valence Transition)를 보이는 대표적인 화합물로, 상관 전자계 연구의 표준 시료임.", "origin": "1980년대 중반 Felner와 Nowik 등에 의해 발견됨.", "connections": "원자가 상전이, 중성 페르미온, Kondo 격자."}, {"term": "Core-Level Photoemission", "why_emerged": "원자 내부의 깊은 에너지 수준을 측정하여 화학적 상태와 전자 간 상호작용 강도를 파악하기 위해 사용됨.", "origin": "K. Siegbahn (ESCA 개발) 등에 의해 정립됨.", "connections": "XPS, 다체 효과, Sud-den approximation."}], "english_summary": ["The study establishes a quantitative link between the phenomenological charge-transfer energy and the microscopic f-d Coulomb interaction.", "A new spectroscopic framework is developed to account for the d-electron occupation dependence in rare-earth systems.", "The model successfully explains the first-order valence transition in YbInCu4 through combined PES and XAS analysis.", "This work bridges the gap between core-level spectroscopy and low-energy effective theories for strongly correlated electrons."]}}, {"title": "Gapless Nature of Spin Liquid in the S=1/2 Kagome Heisenberg Antiferromagnet with Neural-Network Quantum States", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2611.18840", "authors": "Andreas Raikos, Alessandro Sinibaldi, Riccardo Rende, Giuseppe Carleo, Federico Becca, Luciano Loris Viteritti", "last_authors": "Federico Becca, Luciano Loris Viteritti", "summary": "Whether the spin-$1/2$ kagome Heisenberg antiferromagnet hosts a gapped $\\mathbb{Z}_2$ or a gapless $U(1)$ Dirac spin liquid remains a central open question in frustrated magnetism. Here, we address this question by directly computing the triplet gap with a neural-network quantum state that does not presuppose any specific spin-liquid structure. Applying a time-reversal symmetric transformer-based ansatz to clusters of up to $768$ sites, we obtain state-of-the-art variational energies on two-dimensional lattices with periodic boundary "anomalousHall", "topological"], "image": "https://arxiv.org/html/2611.20662v1/F1-1.png", "briefing": {"background": "자성 바일(Weyl) 반금속은 자성 질서에 의해 공간 및 시간 반전 대칭성이 깨지면서 생성되는 바일 점(Weyl point)을 가진 물질입니다. 이는 실공간의 스핀 구조와 역격자 공간의 베리 곡률(Berry curvature)이 결합되어 거대한 수송 특성을 나타낼 수 있습니다.", "motivation": "Nd4Sb3 물질에서 자성 구조의 변화가 전자의 위상학적 특성과 거시적인 홀 효과(Hall effect)에 어떻게 직접적으로 영향을 미치는지 규명하고자 했습니다.", "result": "Nd4Sb3가 72K에서 강자성으로 정렬된 후 42K에서 비공선형(non-coplanar) 상태로 스핀 재정렬을 일으킴을 발견했습니다. 이 과정에서 바일 점의 쌍이 42개에서 115개로 급격히 증가하며, 이로 인해 거대한 변칙 홀 효과(AHE)와 위상학적 홀 효과(THE)가 동시에 관찰되었습니다.", "implication": "실공간의 스핀 카이랄성(THE의 기원)과 역격자 공간의 바일 토폴로지(AHE의 기원)가 한 물질 내에서 강력하게 얽혀 있음을 보여줍니다. 자성을 이용해 전자 구조의 위상적 특징을 '스위칭'할 수 있는 가능성을 제시합니다.", "novelty": "자성 재구성에 따른 바일 점의 급격한 증폭과 그에 따른 거대 홀 응답(Hall response)을 실험과 이론으로 완벽하게 일치시킨 연구입니다. 독자의 핵심 관심사인 바일 반금속, 베리 곡률, 변칙 홀 효과 연구에 매우 부합합니다.", "unresolved": "바일 점의 증가가 실제 광전자 분광(ARPES)을 통해 직접적으로 관측될 수 있는지, 그리고 스핀 재정렬의 미시적 이방성 원인이 무엇인지 추가 규명이 필요합니다.", "future_work": "Nd4Sb3에 대한 온도/자기장 가변 ARPES 실험을 통한 전자 구조 재구성의 직접적 관찰 및 조절 연구가 유망합니다.", "concepts": [{"term": "Magnetic Weyl Semimetal", "why_emerged": "외부 자기장 없이도 자성 질서에 의해 바일 페르미온을 생성하고 제어할 수 있는 물질군을 찾기 위해 등장했습니다.", "origin": "2011년 Wan 등에 의해 이론적 토대가 마련됨.", "connections": "변칙 홀 효과, 키랄 변칙(chiral anomaly), 위상 제어 전자공학."}, {"term": "Topological Hall Effect (THE)", "why_emerged": "비공선형 스핀 구조나 스커미온(skyrmion) 등에 의해 전자가 실공간에서 느끼는 유효 자기장을 설명하기 위해 정의되었습니다.", "origin": "스핀 카이랄성 이론에서 유래함.", "connections": "스칼라 스핀 카이랄성, 베리 위상, 스커미온 물리."}, {"term": "Spin Reorientation", "why_emerged": "온도나 자기장 변화에 따라 물질의 자화 방향이 특정 결정축에서 다른 축으로 바뀌는 현상을 설명하기 위해 사용됩니다.", "origin": "고전 자성학에서 정립됨.", "connections": "자기 이방성, 결정장 효과, 위상학적 상전이 유도 기작."}], "english_summary": ["Establishes Nd4Sb3 as a magnetic Weyl semimetal with intertwined anomalous and topological Hall responses.", "Spin reorientation at 42 K leads to a non-coplanar state that increases the number of Weyl point pairs from 42 to 115.", "Observed a large topological Hall resistivity (~3.9 micro-ohm cm) and intrinsic anomalous Hall conductivity matching DFT calculations.", "Provides a clear demonstration of how magnetic reconstruction reshapes reciprocal-space topology and transport properties."]}}, {"title": "Large-Tiny Spin-Stripe SDW Order in La3Ni2O7 via 139La-NQR Spectroscopy: Reconsideration Based on the Am2m Structure (J. Phys. Soc. Jpn.)", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2610.20446", "authors": "Mitsuharu Yashima, Hongnam Lee, Takumi Ino, et al.", "last_authors": "Yoshihiko Takano, Hidekazu Mukuda", "summary": "The lower-symmetry $Am2m$ structure was recently proposed as the intrinsic ambient-pressure phase of La$_3$Ni$_2$O$_7$ based on synchrotron x-ray diffraction, whereas earlier studies investigated its properties assuming the commonly accepted $Amam$ structure. Here, we reexamine the crystal structure in La$_3$Ni$_2$O$_7$ and the spin configuration of spin-density-wave (SDW) state via $^{139}$La nuclear quadrupole resonance (NQR). The observation of two distinct La(2) sites in the NQR spectra is naturally accounted for by the $Am2m$ structure without any special assumptions, whereas it cannot be reconciled within the $Amam$ framework. Within the $Am2m$ framework, we reanalyze the spin configuration of the SDW phase and identify it as a large-tiny spin-stripe structure, arising naturally from two inequivalent Ni sites with large and tiny magnetic moments. These results establish the itinerant nature of the SDW order at ambient pressure in La$_3$Ni$_2$O$_7$, providing a basis for understanding its relationship to the emergence of high-$T_c$ superconductivity under high pressure.", "tier": "B_IMPORTANT_CONDMAT", "score": "9", "reason": "Experimental NQR study of spin-stripe SDW order in nickelate La3Ni2O7, directly relevant to unconventional superconductivity.; demoted from A: broad CM, not direct user/project hit", "tags": ["experimental", "unconventionalsuperconductivity", "nickelates", "SDW", "NQR", "stronglycorrelatedelectrons"], "image": "https://arxiv.org/html/2610.20446v3/fig1.png", "briefing": {"background": "니켈레이트(Nickelates) 계열, 특히 La3Ni2O7은 최근 고압 환경에서 고온 초전도 현상이 발견되어 구리 산화물 초전도체를 이을 차세대 고온 초전도 후보 물질로 주목받고 있습니다. 이 물질의 물리적 기원을 이해하기 위해서는 초전도가 나타나기 전 단계인 상압 상태의 결정 구조와 자기 질서를 정확히 파악하는 것이 필수적입니다.", "motivation": "기존 연구들은 주로 Amam 구조를 가정하여 물성을 해석했으나, 최근 싱크로트론 X선 회절을 통해 대칭성이 더 낮은 Am2m 구조가 제안되었습니다. 본 연구는 139La 핵사중극자공명(NQR) 분광학을 이용하여 실제 결정 대칭성을 검증하고, 이에 따른 스핀 밀도파(SDW) 상태의 상세한 스핀 구성을 재검토하고자 합니다.", "result": "NQR 측정 결과, 특별한 가정 없이도 Am2m 구조에서 예상되는 두 개의 독특한 La(2) 사이트 신호가 관측되어 Am2m이 본질적인 구조임을 확립했습니다. 또한, 이 구조 내에서 SDW 상태는 큰 자기 모멘트와 미세한 자기 모멘트가 교차하는 '대-소 스핀 스트라이프(large-tiny spin-stripe)' 구조를 가짐을 밝혀냈으며, 이는 이 물질의 SDW가 순회성(itinerant) 성질을 가짐을 시사합니다.", "implication": "La3Ni2O7의 상압 기저 상태가 단순한 자기 질서가 아닌 비균일한 모멘트 분포를 가진 스트라이프 상임을 밝힘으로써, 압력 인가 시 이 상태가 어떻게 초전도로 전이되는지에 대한 핵심적인 기초 정보를 제공합니다. 이는 니켈레이트 초전도 메커니즘을 설명하는 이론 모델의 수정이 필요함을 의미합니다.", "novelty": "실험적으로 논란이 있던 결정 구조를 NQR로 명확히 판별했다는 점과, 니켈 사이트의 이네퀴벌런트(inequivalent)한 특성에서 기인한 독특한 SDW 형태를 제안했다는 점이 중요합니다. 사용자 관심사인 강상관 전자계 및 초전도체 기저 상태 연구와 밀접한 관련이 있습니다.", "unresolved": "상압에서의 Am2m 구조와 SDW 상태가 압력이 증가함에 따라 어떻게 변화하여 초전도 상과 연결되는지에 대한 직접적인 고압 NQR 실험 데이터가 아직 부족합니다.", "future_work": "고압 조건에서의 NQR 분광 실험을 통해 스핀 스트라이프 상의 소멸과 초전도 발현 사이의 상관관계를 직접 관찰하고, Am2m 구조를 반영한 정밀한 DFT+DMFT 계산이 수행될 것으로 예상됩니다.", "concepts": [{"term": "NQR (Nuclear Quadrupole Resonance)", "why_emerged": "외부 자기장 없이 원자핵의 사중극자 모멘트와 주위 전기장 기울기(EFG)의 상호작용을 통해 국소적인 구조 및 전자 상태를 조사하기 위해 도입되었습니다.", "origin": "1950년대 Hans Dehmelt 등에 의해 실험적으로 확립되었습니다.", "connections": "NMR과 유사하나 자기장이 필요 없으며, 결정 구조의 미세한 대칭성 붕괴를 감지하는 데 탁월합니다."}, {"term": "Spin-Density-Wave (SDW)", "why_emerged": "금속 내 전도 전자들의 스핀 밀도가 공간적으로 주기적인 변조를 일으키는 현상을 설명하기 위해 제안되었습니다.", "origin": "Albert Overhauser가 1960년대 초에 이론적으로 제안했습니다.", "connections": "전하 밀도파(CDW), 페르미 면 네스팅(nesting), 유기 초전도체 및 철 기반 초전도체의 자기 질서와 관련이 깊습니다."}, {"term": "Am2m Structure", "why_emerged": "기존에 알려진 Amam 구조보다 낮은 대칭성을 통해 특정 물질의 물리적 특성이나 상전이를 더 정확하게 설명하기 위해 도입된 공간군입니다.", "origin": "초록 정보만으로는 특정하기 어려우나, 최근 La3Ni2O7의 정밀 구조 분석 과정에서 재발견되었습니다.", "connections": "직교 결정계(Orthorhombic) 대칭성의 변형으로, 강유전성이나 특이 자기 질서와 연결될 수 있습니다."}, {"term": "Itinerant Magnetism", "why_emerged": "국소화된 스핀이 아닌, 밴드를 형성하며 이동하는 전도 전자들의 집단적 상호작용으로 발생하는 자성을 설명하기 위해 필요합니다.", "origin": "Stoner 모델 등이 대표적인 이론적 기초를 제공했습니다.", "connections": "3d 전이금속 자성체, 무거운 페르미온 시스템, 그리고 니켈레이트의 금속적 특성을 이해하는 핵심 개념입니다."}], "english_summary": ["Identified the Am2m crystal structure as the intrinsic ambient-pressure phase of La3Ni2O7 using 139La NQR spectroscopy.", "Discovered a 'large-tiny spin-stripe' SDW configuration originating from two inequivalent Ni sites.", "Established the itinerant nature of the magnetic order, providing a new baseline for high-Tc superconductivity under pressure.", "Contradicts the previously assumed Amam structure and suggests a more complex local electronic environment."]}}, {"title": "Linear response of the Chern insulator MnBi2Te4: A Wannier function approach", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2603.11268", "authors": "Matthew Albert, Javier Sivianes, Jason G. Kattan, Julen Iba\\~nez-Azpiroz, J. E. Sipe", "last_authors": "Julen Iba\\~nez-Azpiroz, J. E. Sipe", "summary": "Recent work demonstrated that in the long wavelength limit the linear response of a Chern insulator to finite-frequency electric fields is the sum of two terms: A general frequency-dependent Kubo contribution that is present irrespective of band topology, and a topological Hall term that vanishes for topologically trivial insulators. Motivated by recent experiments and theoretical predictions, we use these expressions to calculate the optical conductivity and susceptibility of intrinsically magnetic MnBi$_2$Te$_4$ thin films with one, four, five, and eleven septuple layers by combining density functional theory with \"single-shot\" Wannier functions. To characterize the underlying topology of these systems, we compute the two-dimensional Chern number of these films using recently derived global expressions formulated in terms of Bloch energies and velocity matrix elements; the use of these expressions allows us to circumvent numerical issues at band crossings. Films with eleven septuple layers are of particular interest. We find that they have the same Chern number as five septuple layer films, in contrast to the reported \"higher Chern-number phase\" of these systems in other studies; we discuss a few possible reasons for the discrepancy. A layer-resolved decomposition of the static reactive susceptibility reveals a non-uniform spatial distribution, with interlayer contributions dominating over intralayer contributions and the bulk layers accounting for nearly 70% of the total response. We also identify spin-orbit coupling-driven band inversions as a possible indicator of these topological phases.", "tier": "B_IMPORTANT_CONDMAT", "score": "9", "reason": "Computational study of electronic structure, Chern number, and optical response in magnetic topological MnBi2Te4.", "tags": ["topological", "Cherninsulator", "MnBi2Te4", "electronicstructure", "DFT", "transport"], "image": "https://arxiv.org/html/2603.11268v2/Figures/Fig2.png", "briefing": {"background": "MnBi2Te4는 자성과 위상적 특성이 공존하는 고유 자기 위상 절연체로, 양자 이상 홀 효과(QAHE)를 구현할 수 있는 최적의 후보 물질입니다. 층 수(layer thickness)에 따라 Chern 수와 같은 위상 불변량이 변화하며, 이에 따른 광학적 응답과 전송 특성을 이해하는 것이 소자 응용을 위해 매우 중요합니다.", "motivation": "Chern 절연체의 유한 주파수 전기장에 대한 선형 응답 수식을 활용하여 MnBi2Te4 박막의 두께별 광학 전도도와 감수율을 정밀하게 계산하고, 기존에 보고된 '고차 Chern 수(higher Chern number)' 상의 존재 여부를 검증하고자 합니다.", "result": "DFT와 Wannier 함수를 결합한 계산을 통해, 11층 박막이 기존 연구의 주장과 달리 5층과 동일한 Chern 수를 가짐을 확인했습니다. 또한 정적 반응성 감수율(static reactive susceptibility) 분석 결과, 층 내부(intralayer)보다 층간(interlayer) 기여가 지배적이며 벌크 층이 전체 응답의 약 70%를 차지함을 밝혔습니다.", "implication": "특정 두께에서 고차 Chern 수가 나타난다는 기존의 위상 상전이 시나리오에 의문을 제기하며, MnBi2Te4의 위상 상태가 외부 환경이나 계산 방식에 민감할 수 있음을 시사합니다. 또한 층간 상호작용이 광학적 응답에 결정적임을 보여주었습니다.", "novelty": "수치적 불안정성을 극복하기 위해 전역적 Chern 수 수식과 'single-shot' Wannier 함수를 적용하여 계산의 신뢰도를 높였습니다. 사용자 관심사인 Berry curvature와 magnetic topological insulator의 선형 응답 특성을 심도 있게 다룹니다.", "unresolved": "본 계산 결과와 고차 Chern 수를 보고한 다른 이론/실험 연구 사이의 불일치 원인(예: 표면 완화, 무질서, 교환 상호작용 매개변수 차이 등)에 대한 명확한 결론이 아직 부족합니다.", "future_work": "층간 결합을 제어한 헤테로 구조에서의 위상 제어 연구 및 실험적인 광학 전도도 측정을 통한 계산 결과의 검증이 필요합니다.", "concepts": [{"term": "Chern Insulator", "why_emerged": "외부 자기장 없이 물질 내부의 자성과 위상 구조만으로 양자 홀 효과를 구현하기 위해 등장한 개념입니다.", "origin": "1988년 Duncan Haldane이 제안한 모델에서 기원합니다.", "connections": "Quantum Anomalous Hall Effect (QAHE), Berry Curvature, MnBi2Te4."}, {"term": "Wannier Function", "why_emerged": "운동량 공간의 블로흐 상태를 실공간에서 국소화된 기저 함수로 변환하여 복잡한 고체 물성을 효율적으로 계산하기 위해 도입되었습니다.", "origin": "1937년 Gregory Wannier가 제안했습니다.", "connections": "Tight-binding model, DFT post-processing, 전송 특성 계산."}, {"term": "Linear Response Theory", "why_emerged": "외부의 작은 자극(전기장 등)에 대해 시스템이 어떻게 반응(전류 등)하는지를 선형 근사 범위 내에서 체계적으로 기술하기 위해 발전했습니다.", "origin": "Ryogo Kubo가 정립한 Kubo 공식이 대표적입니다.", "connections": "Optical conductivity, Magnetic susceptibility, Green's function."}, {"term": "Septuple Layer (SL)", "why_emerged": "MnBi2Te4와 같은 반데르발스 층상 구조 물질의 기본 단위(Te-Bi-Te-Mn-Te-Bi-Te)를 정의하기 위해 사용됩니다.", "origin": "초록 정보만으로는 특정하기 어려우나, MnBi2Te4 연구 초기부터 정착된 용어입니다.", "connections": "Van der Waals heterostructures, Bi2Te3, 2D materials."}], "english_summary": ["Calculated optical conductivity and susceptibility of MnBi2Te4 thin films using DFT and Wannier functions.", "Found that 11-septuple-layer films have the same Chern number as 5-layer films, challenging reports of higher Chern-number phases.", "Identified that interlayer contributions dominate the static reactive susceptibility, accounting for 70% of the bulk response.", "Highlighted the role of spin-orbit coupling-driven band inversions as indicators of topological phases."]}}, {"title": "Molecular-orbital origin of weak orbital ferromagnetism and anomalous Hall effect in a trimerized kagome antiferromagnet", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2611.20632", "authors": "I. V. Solovyev", "last_authors": "I. V. Solovyev", "summary": "We reveal the molecular-orbital origin of weak orbital ferromagnetism and the anomalous Hall effect (AHE) induced by noncollinear spin order in a trimerized kagome lattice. By transforming to the molecular-orbital basis of an isolated trimer in the double-exchange regime, we derive an effective low-energy model for the states with opposite orbital angular momenta $m= \\pm 1$ subject to an effective Zeeman field arising from spin chirality and spin-orbit (SO) coupling. In this representation, the kagome-lattice problem maps onto a triangular lattice of trimers, while the nearest- and next-nearest-neighbor hoppings of the original lattice generate complex hopping amplitudes between neighboring trimers. This formulation provides a transparent picture of how spin chirality and SO coupling can be recast as an effective Zeeman field that lifts the degeneracy of the $m= \\pm 1$ states, breaks time-reversal symmetry, and thereby gives rise to weak orbital ferromagnetism and the AHE. The resulting phase diagram includes metallic phases, topologically trivial insulating phases, as well as several topological phases characterized by nonzero Chern numbers and the quantum anomalous Hall effect. We further identify an alternative route to time-reversal-symmetry breaking and orbital magnetization, driven by an emergent gauge field arising solely from complex inter-trimer hoppings and requiring no effective Zeeman field.", "tier": "B_IMPORTANT_CONDMAT", "score": "9", "reason": "Direct relevance to kagome magnets, orbital magnetism, and the anomalous Hall effect.", "tags": ["kagome", "anomalousHall", "topological"], "image": "https://arxiv.org/html/2611.20632v1/figure1.png", "briefing": {"background": "카고메 격자(Kagome lattice)는 기하학적 좌절(frustration)과 특이한 전자 밴드 구조로 인해 비공선형(non-collinear) 자기 구조와 위상적 물성이 나타나기 좋은 환경을 제공합니다. 특히 삼량체화(trimerization)된 카고메 구조는 원자 단위가 아닌 분자 궤도(molecular orbital) 관점에서의 새로운 접근을 요구합니다.", "motivation": "삼량체화된 카고메 반강자성체에서 나타나는 미세한 궤도 강자성(weak orbital ferromagnetism)과 이상 홀 효과(AHE)의 물리적 기원을 분자 궤도론적 관점에서 명확히 규명하고자 합니다.", "result": "고립된 삼량체의 분자 궤도 기저로 변환한 결과, 스핀 카이랄리티와 스핀-궤도 결합(SOC)이 궤도 각운동량 상태($m = \\pm 1$)의 퇴퇴를 해소하는 '유효 제만 장' 역할을 함을 발견했습니다. 또한, 삼량체 간의 복소 호핑(complex hopping)만으로도 유효 제만 장 없이 시간 반전 대칭성을 깨뜨리고 궤도 자성을 유도할 수 있는 새로운 경로를 식별했습니다.", "implication": "카고메 금속(예: AV3Sb5 계열)에서 논의되는 루프 전류(loop current)나 이상 홀 효과를 스핀-궤도 결합과 분자 궤도 대칭성의 상호작용으로 정교하게 설명할 수 있는 이론적 프레임워크를 제공합니다.", "novelty": "이상 홀 효과의 기원을 단순한 스핀 구조가 아닌 삼량체 내외부의 분자 궤도 간 간섭과 복소 호핑으로 설명했다는 점이 독창적입니다. 사용자 관심사인 카고메 금속, 루프 전류, TRSB와 매우 높은 연관성을 가집니다.", "unresolved": "이 이론 모델이 제안하는 다양한 위상 상(Chern insulator 등)이 실제 어떤 물질 후보군에서 가장 잘 구현될 수 있는지에 대한 구체적인 물질 탐색이 필요합니다.", "future_work": "Fe3Sn2나 AV3Sb5와 같은 실제 카고메 물질의 제일원리 계산에 본 모델을 적용하여, 실험적으로 관측된 이상 홀 효과와 궤도 자성 값을 정량적으로 재현하는 연구가 기대됩니다.", "concepts": [{"term": "Orbital Ferromagnetism", "why_emerged": "스핀에 의한 자성 외에 전자의 궤도 운동(루프 전류 등)에 의해 발생하는 순 자성 성분을 기술하기 위해 필요합니다.", "origin": "초록 정보만으로는 특정하기 어려우나, 강상관 계의 루프 전류 모델과 밀접합니다.", "connections": "Anomalous Hall Effect, Loop Current, Time-Reversal Symmetry Breaking (TRSB)."}, {"term": "Spin Chirality", "why_emerged": "비공선형 스핀 구조에서 세 개 이상의 스핀이 이루는 기하학적 위상(스칼라 카이랄리티)이 전자 운동에 미치는 영향을 설명하기 위해 도입되었습니다.", "origin": "K. Ohgushi, S. Murakami, N. Nagaosa (2000년) 등이 AHE와의 관련성을 확립했습니다.", "connections": "Berry Phase, Topological Hall Effect, Skyrmions."}, {"term": "Trimerized Kagome Lattice", "why_emerged": "카고메 격자 내의 원자들이 세 개씩 뭉쳐 삼각형 단위(trimer)를 형성하여 대칭성이 낮아진 구조를 다루기 위해 등장했습니다.", "origin": "초록 정보만으로는 특정하기 어려우나, 자성체 및 유기 도체 연구에서 흔히 발견됩니다.", "connections": "AV3Sb5 (Kagome metals), Molecular orbitals, Geometrical frustration."}, {"term": "Double-Exchange Regime", "why_emerged": "자성 이온 간의 전하 이동이 스핀 정렬 상태에 의존하는 현상을 설명하여, 금속성과 자성의 결합을 이해하기 위해 제안되었습니다.", "origin": "Clarence Zener (1951년)가 제안했습니다.", "connections": "Manganites, CMR (Colossal Magnetoresistance), Hund's coupling."}], "english_summary": ["Revealed the molecular-orbital origin of orbital ferromagnetism and AHE in trimerized kagome lattices.", "Demonstrated that spin chirality and SOC act as an effective Zeeman field lifting the degeneracy of m = +/-1 states.", "Identified an alternative TRSB mechanism driven solely by complex inter-trimer hopping amplitudes.", "Proposed a phase diagram featuring metallic, trivial insulating, and topological Chern insulating phases."]}}, {"title": "Non-Topological Chiral Anomaly: The Chiral Magnetoelectric Effect", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2611.18841", "authors": "R\\'emy Larue, Amaury Marchon, J\\'er\\'emie Quevillon, Diego Saviot", "last_authors": "J\\'er\\'emie Quevillon, Diego Saviot", "summary": "We derive the chiral anomaly in a thermal medium and show that, in addition to the well-established topological piece, the anomaly acquires a previously overlooked non-topological contribution, relevant for non-gauged axial symmetries. Remarkably, this modification of the continuity equation is independent of the electromagnetic fields, thereby giving rise to novel transport effects in relativistic hydrodynamics. We further propose an experimentally accessible new effect in Weyl semimetals which we call the Chiral Magnetoelectric Effect: an electric field proportional to the magnetic field is generated by the non-topological anomaly, even in the absence of an externally applied electric field. Beyond this concrete prediction, our results establish a broader hydrodynamic framework for non-topological chiral anomalies, opening the door to a range of previously unexplored anomaly-induced transport phenomena across condensed-matter and high-energy systems.", "tier": "B_IMPORTANT_CONDMAT", "score": "9", "reason": "Direct relevance to Weyl semimetals, topological physics, and proposed experimental magnetoelectric effect.; demoted from A: broad CM, not direct user/project hit", "tag 양자화된 장론에서 고전적인 보존 법칙이 대칭성에도 불구하고 깨지는 현상을 설명하기 위해 등장했습니다.", "origin": "Adler, Bell, Jackiw (1969년)", "connections": "Weyl 반금속, 초전도체 내의 카이럴 여기, 음의 자기저항(negative MR)"}, {"term": "Chiral Magnetoelectric Effect", "why_emerged": "비위상적 아노말리로 인해 자기장 유도 전류가 아닌 자기장 유도 전기장이 발생하는 현상을 명명하기 위해 제안되었습니다.", "origin": "본 논문 (Larue et al.)", "connections": "Axion electrodynamics, Magnetoelectric effect"}, {"term": "Relativistic Hydrodynamics", "why_emerged": "고에너지 입자 충돌이나 Weyl 반금속의 전자 유체와 같은 상대론적 에너지 스케일의 유체 거동을 기술하기 위해 필요합니다.", "origin": "Landau, Lifshitz (초기 정립)", "connections": "Electron hydrodynamics, Quark-gluon plasma"}], "english_summary": ["Derives a previously overlooked non-topological contribution to the chiral anomaly in thermal media.", "Predicts a Chiral Magnetoelectric Effect (CMEE) where an electric field is generated proportional to the magnetic field.", "Establishes a hydrodynamic framework for non-topological anomalies in Weyl semimetals.", "Suggests new experimental avenues for exploring anomaly-induced transport beyond topological constraints."]}}, {"title": "Optical spin Edelstein response of d-wave altermagnets", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2611.20235", "authors": "M. A. Mojarro, R. Carrillo-Bastos, Jes\\'us A. Maytorena", "last_authors": "R. Carrillo-Bastos, Jes\\'us A. Maytorena", "summary": "The momentum-dependent spin splitting and compensated magnetic order in altermagnets offer opportunities for electrical control of spin polarization. We explore the spin Edelstein effect in the frequency domain of a two-dimensional d-wave altermagnet with Rashba spin-orbit coupling. We calculate the spin-velocity susceptibility response function beyond the intraband response regime and find that the interband longitudinal and transverse Edelstein responses are governed by the Zeeman quantum metric and Zeeman Berry curvature, respectively. The density of states presents a logarithmic van Hove singularity at exactly the negative value of the energy below which four disconnected Fermi contours emerge. This defines three distinctive regions for the position of the Fermi level, through which the Edelstein susceptibility tensor displays characteristic spectral features, reflecting the topological change of the Fermi surface. The resulting spin magnetization shows a strong dependence on the driving frequency and on the orientation of the in-plane external electric field. Our results highlight new possibilities for electrical and optical control of the spin Edelstein effect in altermagnets that could find spintronic applications.", "tier": "B_IMPORTANT_CONDMAT", "score": "9", "reason": "Directly relevant theory for altermagnetism and Berry curvature optical responses.", "tags": ["altermagnet", "Berry-curvature", "theory"], "image": "https://arxiv.org/html/2611.20235v1/Fig1.png", "briefing": {"background": "알터마그넷(Altermagnets)은 순 자화값은 0이지만 운동량 공간에서 스핀 할당이 비대칭적인 새로운 자성체입니다. 이러한 특성은 스핀트로닉스 소자에서 전기적으로 스핀을 제어할 수 있는 큰 잠재력을 가집니다.", "motivation": "Rashba 스핀-궤도 결합이 있는 2차원 d-wave 알터마그넷에서 주파수에 따른 광학적 스핀 에델슈타인 응답(Spin Edelstein Response)의 특성을 규명하고자 했습니다.", "result": "밴드 간(interband) 응답이 제이만 양자 메트릭(Zeeman quantum metric)과 제이만 베리 곡률(Zeeman Berry curvature)에 의해 결정됨을 밝혀냈습니다. 또한, Fermi 준위 위치에 따라 van Hove 특이점이 응답 함수에 미치는 영향을 분석했습니다.", "implication": "알터마그넷에서 외부 전기장의 주파수와 방향을 조절함으로써 스핀 자화(spin magnetization)를 정밀하게 제어할 수 있는 광학적 수단을 제공합니다.", "novelty": "알터마그넷의 스핀 응답을 양자 기하학적 관점(Quantum Geometry)에서 해석하고, 광학적 주파수 영역으로 확장하여 실험적 탐지 가능성을 높였습니다. 사용자의 관심사인 알터마그네티즘과 베리 곡률 관련 연구와 매우 밀접합니다.", "unresolved": "실제 실험 환경에서의 온도 효과나 포논 산란이 광학적 응답의 선폭(line width)과 크기에 미치는 영향은 논의가 더 필요합니다.", "future_work": "다양한 d-wave 알터마그넷 후보 물질에서의 THz 분광학 실험이나 광유도 스핀 분극 측정 실험이 이어질 것으로 보입니다.", "concepts": [{"term": "Spin Edelstein Effect", "why_emerged": "전류가 흐를 때 스핀-궤도 결합을 통해 비평형 스핀 밀도가 생성되는 현상을 설명하기 위해 등장했습니다.", "origin": "V.M. Edelstein (1990년)", "connections": "Rashba-Edelstein effect, Inverse spin Hall effect"}, {"term": "Zeeman Quantum Metric", "why_emerged": "스핀 공간에서의 파동함수 변화 속도(거리)를 측정하여 종방향 응답을 기술하기 위해 도입되었습니다.", "origin": "최근 양자 기하학 연구들에서 정립 중", "connections": "Quantum geometric tensor, Interband transitions"}, {"term": "Altermagnetism", "why_emerged": "강자성(FM)과 반강자성(AFM)의 장점을 동시에 갖는(스핀 분할 밴드 + 넷 자화 0) 자성을 분류하기 위해 제안되었습니다.", "origin": "L. Šmejkal, J. Sinova, T. Jungwirth (2022년경 본격화)", "connections": "d-wave symmetry, Spin-split bands"}], "english_summary": ["Investigates the optical spin Edelstein response in d-wave altermagnets with Rashba coupling.", "Relates interband longitudinal and transverse responses to Zeeman quantum metric and Zeeman Berry curvature.", "Identifies characteristic spectral features linked to van Hove singularities and Fermi surface topology.", "Demonstrates frequency and direction control of spin magnetization for spintronic applications."]}}, {"title": "Quantum-Geometric Spin Magnetization and Spin Currents Across Altermagnetic Symmetry Classes", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2604.28088", "authors": "Neelanjan Chakraborti, Snehasish Nandy, Sudeep Kumar Ghosh", "last_authors": "Snehasish Nandy, Sudeep Kumar Ghosh", "summary": "Altermagnets host spin-split band structures despite vanishing equilibrium spin magnetization, making field-induced responses a direct probe of their quantum geometry. Based on symmetry, altermagnets can be classified into M-, S-, A-, and S/A-type according to the presence or absence of inversion and time-reversal symmetries. We develop a unified framework using a generalized quantum geometric tensor that captures both momentum translations and spin rotations of Bloch states. In particular, we introduce the Zeeman counterpart of the conventional spin quantum geometric tensor, whose real and imaginary parts define the Zeeman spin quantum metric and Zeeman spin Berry curvature, respectively. Using this framework, we study linear spin magnetization and spin currents induced by electric and magnetic fields. We show that M- and S-type altermagnets support intrinsic electric-field-induced spin currents and magnetic-field-induced spin magnetization, while A-type altermagnets exhibit both electric and magnetic field induced spin current and spin magnetization. For S/A-type altermagnets, neither inversion nor time-reversal symmetry alone determines the allowed responses. Applying our theory to the S-type $d$-wave altermagnet $\\mathrm{FeSb}_2$ and a Rashba-coupled S/A-type $d$-wave altermagnet, we find complete agreement with the symmetry constraints. The predicted responses are sizable and within reach of magnetometry and spin-transport experiments. Our results establish a symmetry based quantum geometric framework for spin responses in altermagnets and highlight their potential for experimental detection and spintronic applications.", "tier": "B_IMPORTANT_CONDMAT", "score": "9", "reason": "Theory on quantum-geometric spin responses in altermagnets, involving Berry curvature, band structure, and experimental probes.", "tags": ["altermagnetism", "Berrycurvature", "quantumgeometry", "spincurrent", "transport", "bandstructure", "theory"], "image": "https://arxiv.org/html/2604.28088v2/Rashba.png", "briefing": {"background": "알터마그넷은 대칭성에 따라 여러 클래스로 분류될 수 있으며, 이들의 고유한 양자 기하학적 특성이 전기장이나 자기장에 대한 응답으로 나타납니다.", "motivation": "다양한 알터마그넷 대칭성 클래스(M, S, A, S/A) 전체를 아우르는 스핀 자화 및 스핀 전류 응답의 통합적인 양자 기하학적 이론 프레임워크를 구축하고자 했습니다.", "result": "스핀 회전과 운동량 평행 이동을 포함하는 일반화된 양자 기하학적 텐서를 정의하고, 이를 통해 클래스별로 허용되는 스핀 응답을 분류했습니다. 특히 FeSb2와 같은 실제 물질 사례에서 이론의 유효성을 검증했습니다.", "implication": "알터마그넷의 대칭성만으로 어떤 종류의 스핀 전류나 자화가 유도될 수 있는지 예측할 수 있게 되어, 새로운 스핀트로닉스 물질 탐색에 가이드라인을 제공합니다.", "novelty": "제이만 스핀 베리 곡률과 제이만 스핀 양자 메트릭이라는 개념을 사용하여 알터마그넷의 모든 대칭성 클래스를 체계적으로 분석했다는 점이 핵심입니다. 사용자의 주요 관심사인 밴드 구조 및 양자 기하학적 수송 현상과 정확히 일치합니다.", "unresolved": "다체 상호작용(many-body interactions)이 양자 기하학적 텐서의 재정규화에 미치는 영향은 아직 완전히 파악되지 않았습니다.", "future_work": "이론에서 예측된 클래스별 응답(예: A-type에서의 자기장 유도 스핀 전류)을 확인하기 위한 정밀 자기 검출 및 스핀 수송 실험이 필요합니다.", "concepts": [{"term": "Quantum Geometric Tensor", "why_emerged": "양자 상태의 위상(Berry phase)과 거리(Metric)를 동시에 기술하여 물리적 응답을 이해하기 위해 필요합니다.", "origin": "Provost, Vallee (1980년)", "connections": "Berry curvature, Quantum metric, Hall conductivity"}, {"term": "Zeeman Spin Berry Curvature", "why_emerged": "자기장이나 스핀 자유도와 결합된 파동함수의 기하학적 휘어짐이 수송에 주는 영향을 설명하기 위해 도입되었습니다.", "origin": "초록 정보만으로는 특정하기 어려우나 본 연구진이 확장 정의함", "connections": "Spin Hall effect, Anomalous Hall effect"}, {"term": "FeSb2", "why_emerged": "강한 전자 상관관계와 독특한 수송 특성을 가진 물질로, 최근 S-type 알터마그넷의 대표적 후보로 주목받고 있습니다.", "origin": "전통적인 Kondo insulator 연구에서 유래", "connections": "Colossal thermoelectric power, Altermagnetism"}], "english_summary": ["Develops a unified quantum-geometric framework for spin responses across all altermagnetic symmetry classes.", "Introduces Zeeman spin quantum metric and Berry curvature to describe field-induced spin currents and magnetization.", "Classifies intrinsic responses for M-, S-, A-, and S/A-type altermagnets based on symmetry constraints.", "Validates the theory with d-wave altermagnet FeSb2, showing measurable effects for experimental detection."]}}, {"title": "Ultra-small-angle graphene twistronics with monolayer spacers: From interlayer hybridisation and moir\\'e effects to high-temperature magnetotransport oscillations", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2610.08505", "authors": "Benjamin Fuller, Haowei Fan, Agustin Montemurro, et al.", "last_authors": "Vladimir I. Falko, Xiao Li", "summary": "Based on the analysis of moir\\'e superlattice characteristics and interlayer hybridisation in small-angle twisted graphene multilayers with a monolayer hexagonal boron nitride (hBN) spacer, we predict spectral features and quantum transport effects in these systems. Here, we consider both a twisted bilayer and double bilayers with a spacer, discuss double bilayers in two stacking orders - with and without inversion symmetry - and also compare the results obtained with self-consistent Hartree calculations with and without in-plane periodic charge distribution, offering computationally efficient models for these graphene/hBN/graphene moir\\'e systems. We note parametric intervals where the appearance of minibands can be enhanced by tuning with an out-of-plane displacement field, and identify the miniband edges and van Hove singularities across a broad range of densities and displacement fields. These system host Lifshitz transitions at which the Fermi lines form a network across moir\\'e Brillouin zones, and to which Brown-Zak oscillations converge at low magnetic field and elevated temperatures. We analyse interlayer hybridisation across the same parameter space, discuss how hybridisation affects in-plane magneto-transport in ultra-high-mobility structures, and predict that semiclassical magneto-oscillations of interlayer hybridisation can lead to 1/B-periodic quantum oscillations of resistivity persistent to high temperature.", "tier": "B_IMPORTANT_CONDMAT", "score": "9", "reason": "Theoretical predictions for moire effects and magnetotransport in twisted graphene/hBN heterostructures, highly relevant to user's interests.; demoted from A: broad CM, not direct user/project hit", "tags": ["theory", "graphene", "twistedbilayer", "moire", "vanderWaals", "transport", "magnetotransport"], "image": "https://arxiv.org/html/2610.08505v2/fig1v6.png", "briefing": {"background": "트위스트로닉스는 두 층 사이의 각도를 조절하여 전자 구조를 설계하는 분야로, 주로 그래핀을 직접 겹치는 방식이 연구되어 왔습니다. 최근에는 두 층 사이에 원자층 스페이서(hBN 등)를 삽입하여 층간 혼성화를 미세하게 조정하려는 시도가 늘고 있습니다.", "motivation": "초소각(ultra-small-angle)으로 뒤틀린 그래핀 다층 구조에서 hBN 단일층 스페이서가 층간 혼성화와 모아레 초격자 특성에 미치는 영향을 이론적으로 규명하고, 이에 따른 독특한 전송 특성을 예측하고자 합니다.", "result": "hBN 스페이서가 포함된 그래핀 시스템에서 미니밴드(miniband)의 형성, 반 호브 특이점(van Hove singularities), 그리고 립시츠 전이(Lifshitz transition)를 확인했습니다. 특히 고온에서도 유지되는 1/B 주기성의 자기저항 진동(Brown-Zak oscillations)이 층간 혼성화를 통해 나타날 수 있음을 보였습니다.", "implication": "수직 전기장(displacement field)과 스페이
