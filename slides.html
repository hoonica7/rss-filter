<title>Daily Paper Slideshow</title>
<style>
  :root {
    color-scheme: light;
    --bg: #f6f7f4;
    --paper: #ffffff;
    --ink: #111827;
    --muted: #64748b;
    --line: #d8ddd2;
    --accent: #176b87;
    --accent-2: #9a3412;
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; overflow: auto; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: var(--bg); color: var(--ink); }
  .shell { max-width: 1500px; min-height: 100vh; margin: 0 auto; padding: 14px 18px; display: flex; flex-direction: column; }
  .topbar { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 16px; }
  .top-actions { display: flex; align-items: center; gap: 10px; }
  .topbar a, button { border: 1px solid var(--line); border-radius: 8px; background: var(--paper); color: var(--ink); padding: 10px 14px; font-weight: 700; text-decoration: none; cursor: pointer; }
  button.primary { background: var(--accent); border-color: var(--accent); color: white; }
  button:disabled { opacity: 0.45; cursor: not-allowed; }
  .counter { color: var(--muted); font-weight: 700; }
  .slide { min-height: calc(100vh - 82px); background: var(--paper); border: 1px solid var(--line); border-radius: 10px; padding: 18px; box-shadow: 0 18px 42px rgba(15, 23, 42, 0.10); display: grid; grid-template-columns: minmax(310px, 0.86fr) minmax(0, 1.55fr); gap: 18px; overflow: visible; }
  .paper-head { min-width: 0; min-height: 0; overflow: visible; display: flex; flex-direction: column; gap: 12px; }
  .figure { margin: 0; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: #f8fafc; }
  .figure img { display: block; width: 100%; max-height: 41vh; object-fit: contain; background: white; }
  .figure figcaption { padding: 7px 10px; color: var(--muted); font-size: 12px; line-height: 1.3; }
  .head-text { display: flex; flex-direction: column; gap: 9px; min-width: 0; }
  .badges { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .badge { border-radius: 999px; padding: 5px 9px; background: #eef2ff; color: #3730a3; font-size: 12px; font-weight: 800; }
  .score { background: #fee2e2; color: #991b1b; }
  h1 { margin: 0; font-size: 25px; line-height: 1.15; letter-spacing: 0; overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
  h1 a { color: inherit; text-decoration-color: rgba(23, 107, 135, 0.35); text-decoration-thickness: 2px; text-underline-offset: 4px; }
  h1 a:hover { color: var(--accent); text-decoration-color: var(--accent); }
  .meta, .authors, .why, .abstract { font-size: 13px; line-height: 1.45; }
  .meta, .authors { color: var(--muted); }
  .why strong, .abstract strong, .authors strong { color: var(--ink); }
  .authors { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .why { border-left: 4px solid var(--accent-2); padding-left: 10px; color: #374151; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .abstract { border-top: 1px solid var(--line); padding-top: 14px; color: #374151; }
  .original-abstract { border-top: 1px solid var(--line); padding-top: 10px; color: #374151; font-size: 11.5px; line-height: 1.35; overflow-wrap: anywhere; }
  .original-abstract strong { display: block; margin-bottom: 4px; color: var(--ink); }
  .tags { display: flex; flex-wrap: wrap; gap: 8px; }
  .tag { border-radius: 999px; padding: 4px 8px; background: #f1f5f9; color: #475569; font-size: 12px; font-weight: 700; }
  .head-text > .link { display: none; }
  .briefing { min-width: 0; min-height: 0; overflow: visible; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); grid-auto-rows: minmax(0, auto); align-content: start; gap: 11px 18px; border-top: 0; padding-top: 0; }
  .brief-section { min-width: 0; }
  .brief-section.wide { grid-column: 1 / -1; }
  .brief-section h2 { margin: 0 0 4px; font-size: 14px; line-height: 1.22; color: #0f766e; letter-spacing: 0; }
  .brief-section p, .brief-section li { margin: 0; font-size: 12.5px; line-height: 1.42; color: #1f2937; overflow-wrap: anywhere; }
  .brief-section ul { margin: 0; padding-left: 20px; }
  .concepts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 9px 14px; }
  .concept { border-top: 1px solid var(--line); padding-top: 7px; }
  .concept h3 { margin: 0 0 4px; font-size: 13px; color: #7c2d12; letter-spacing: 0; }
  .concept p { margin: 2px 0 0; font-size: 11.5px; line-height: 1.35; color: #374151; overflow-wrap: anywhere; }
  .concept b { color: #111827; }
  .link { color: var(--accent); font-weight: 800; text-decoration: none; }
  .empty { padding: 48px; background: var(--paper); border: 1px solid var(--line); border-radius: 12px; color: var(--muted); }
  @media (max-width: 860px) {
    .shell { padding: 14px; }
    .topbar, .top-actions { align-items: stretch; flex-direction: column; }
    .slide, .briefing, .concepts { grid-template-columns: 1fr; }
    .slide { min-height: auto; overflow: visible; display: grid; }
    h1 { font-size: 28px; }
  }
</style>

<script>
const slides = [{"title": "Interplay between charge correlations and superconductivity across the superconducting domes of CsV3Sb(5−x)Snx", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/bcqw-7lsf", "authors": "Andrea N. Capa Salinas, Steven J. Gomez Alvarado, Brenden R. Ortiz, et al.", "last_authors": "Turan Birol, Stephen D. Wilson", "summary": "The kagome metal ${\\mathrm{CsV}}_{3}{\\mathrm{Sb}}_{5}$ hosts an anomalous interplay between charge density wave (CDW) order and superconductivity—one where tuning its band filling by adding holes rapidly suppresses long-range CDW order and drives the formation of two unusual superconducting “domes.”…", "tier": "A_MUST_READ", "score": "10", "reason": "Direct hit: AV3Sb5 kagome superconductor CDW/superconductivity competition.", "tags": ["kagome", "CDW", "superconductivity"], "image": "", "briefing": {"background": "카고메 금속 CsV3Sb5는 전하 밀도 파(CDW)와 초전도성의 경쟁 및 공존 현상을 보여주는 대표적인 강상관 전자계 물질입니다. 이 계열의 물질은 밴드 충전도(band filling)를 조절함에 따라 물성이 급격히 변화하는 특징이 있습니다.", "motivation": "CsV3Sb5에서 Sn 도핑을 통해 캐리어 농도를 제어함으로써 CDW 질서가 어떻게 억제되고, 그 결과로 나타나는 두 개의 초전도 돔(superconducting domes) 구조가 어떤 물리적 상관관계를 갖는지 규명하고자 합니다.", "result": "홀 도핑을 통해 CDW 질서를 빠르게 억제할 수 있으며, 이 과정에서 발생하는 두 개의 초전도 돔 구조가 CDW와의 경쟁 관계에 있음을 확인했습니다.", "implication": "카고메 격자에서의 CDW와 초전도성 사이의 비정상적인 상호작용을 이해하는 데 중요한 데이터를 제공하며, 위상물질 내 강상관성 연구의 이정표가 됩니다.", "novelty": "CsV3Sb5 계열에서 정밀한 도핑 제어를 통해 CDW의 소멸과 초전도성 돔의 발현을 직접적으로 연결했다는 점에서 독자분의 연구 관심사와 매우 부합합니다.", "unresolved": "초전도성 돔 각각의 구체적인 대칭성이나 TRSB(시간 반전 대칭 깨짐) 유무에 대한 명확한 결론은 본 초록만으로는 식별하기 어렵습니다.", "future_work": "도핑된 샘플에 대한 저온 주사터널링현미경(STM/STS) 또는 저온 고분해능 ARPES를 통한 전자 구조의 상세 분석이 필요합니다.", "concepts": [{"term": "카고메 금속(Kagome Metal)", "why_emerged": "기하학적 좌절(geometrical frustration)이 나타나는 격자 구조로, 비자명한 위상 밴드와 강상관 물성을 연구하기 위해 필요합니다.", "origin": "Syozi(1951년) 등 고전 통계역학 모델에서 유래했으나 현대 고체물리학에서는 위상 물성 구현의 장으로 재조명받음.", "connections": "디락 페르미온, 평탄 밴드(flat band), 아노말리 홀 효과 등과 밀접함."}, {"term": "전하 밀도 파(CDW)", "why_emerged": "전자계의 주기적 변조를 통한 에너지 안정화 기작을 이해하기 위해 도입되었습니다.", "origin": "Peierls(1955년)의 1차원 전자계 불안정성 모델에서 유래.", "connections": "초전도성과의 경쟁/협력, 넴틱 상전이 등."}], "english_summary": ["CsV3Sb5-xSnx kagome metals exhibit a tuneable interplay between CDW and superconductivity.", "Hole doping suppresses the long-range CDW order effectively.", "The material displays two distinct superconducting domes linked to the CDW suppression.", "Provides experimental insight into the competition between charge order and collective electronic ground states."]}}, {"title": "From Zero to Mega-Gauss Fields: Comprehensive Magnetophotonic Spectroscopy of Graphene Dirac Cones", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2608.10638", "authors": "Shojiro Takeyama, Hiroaki Saito", "last_authors": "Shojiro Takeyama, Hiroaki Saito", "summary": "We investigate the infrared magneto-optical response of n-doped epitaxial graphene on 4H-SiC in ultrahigh magnetic fields up to 560~T, utilizing single-turn coil and electromagnetic flux compression techniques. The measured absorption spectra are anomalously broad, strongly deviating from conventional cyclotron resonance. Angle-resolved photoemission spectroscopy (ARPES) reveals a distorted Dirac dispersion featuring a ``camel-back\" structure with an energy gap of $E_g \\sim 0.2$~eV. Using the band parameters extracted via a generalized bilayer graphene model, we construct a Landau level (LL) fan chart that dictates a critical level crossing between the $N=0^+$ and $N=0^-$ states near 160--200~T. At this threshold, the optical transition mechanism undergoes a dramatic shift from an electron-dominated collective mode to a cooperative electron-hole collective excitation. Furthermore, the extreme-field absorption spectra under thulium fiber laser excitation ($\\hbar\\omega_0 = 0.636$~eV)---culminating in a massive resonance near 400~T with a shoulder at 200~T---are excellently reproduced by a collective Alfv\\'en wave model. This analysis also evidences a magnetic-field-induced enhancement of the sublattice potential asymmetry parameter (from 0.10~eV to 0.12~eV). This directly signifies that the macroscopic electron-hole band asymmetry is further amplified by the applied magnetic field. Ultimately, the field-induced energy inversion generates a strongly interacting, fully compensated electron-hole plasma. The resonant excitation of Alfv\\'en waves in this regime demonstrates that a pristine tabletop analog to the relativistic electron-positron plasmas found in astrophysical extremes can be elegantly realized within a 2D graphene system.", "tier": "A_MUST_READ", "score": "10", "reason": "Explicitly utilizes ARPES to analyze high-field Dirac physics in graphene; perfect profile match.", "tags": ["experiment", "ARPES", "graphene"], "image": "https://arxiv.org/html/2608.10638v2/ARPESGraphene.png", "briefing": {"background": "그래핀의 디락 원뿔(Dirac cone)은 강한 자기장에서 란다우 준위(Landau Level, LL)로 양자화됩니다. 극한의 자기장 환경은 전자-구멍 플라즈마의 거동을 이해하고 위상물성을 검증하는 데 필수적입니다.", "motivation": "초강자기장(560T) 하에서 n형 도핑된 그래핀의 자기광학 응답을 조사하고, 이론적으로 예측된 전자-구멍 플라즈마 상태와 란다우 준위 교차 현상을 실험적으로 증명하고자 합니다.", "result": "560T 환경에서 란다우 준위 N=0+와 N=0- 상태의 교차를 확인했으며, 이는 전자-구멍의 협동적 들뜸 현상을 유도함을 밝혀냈습니다.", "implication": "그래핀 내에서 천체물리학적 환경(상대론적 전자-양전자 플라즈마)을 모사할 수 있음을 증명하며, 그래핀의 고에너지 물성을 극한 환경에서 해석할 수 있게 합니다.", "novelty": "ARPES를 통해 얻은 밴드 파라미터를 활용하여 극한 자기장 하의 란다우 준위 구조를 설명하고, 알펜파(Alfvén wave)의 공명 현상을 실험적으로 구현한 점이 매우 뛰어납니다.", "unresolved": "자기장 유도 에너지 역전 시 발생하는 정확한 다체 효과(many-body effect)에 대한 미세한 메커니즘은 추가 연구가 필요합니다.", "future_work": "다른 위상 반금속 물질들에서의 유사한 고자기장 플라즈마 물성 연구.", "concepts": [{"term": "란다우 준위(Landau Level)", "why_emerged": "자기장 내 하전 입자의 에너지가 양자화되는 현상을 설명하기 위해 도입되었습니다.", "origin": "Lev Landau(1930년).", "connections": "양자 홀 효과, 사이클로트론 공명, 디락 물성."}, {"term": "알펜파(Alfvén Wave)", "why_emerged": "자기화된 플라즈마 내에서 전자기적 진동 모드를 기술하기 위해 필요합니다.", "origin": "Hannes Alfvén(1942년).", "connections": "자기유체역학(MHD), 고에너지 천체 플라즈마."}], "english_summary": ["Measured infrared magneto-optical response of n-doped graphene up to 560T.", "ARPES reveals a distorted Dirac dispersion with a camel-back structure.", "Identified a transition from electron-dominated to electron-hole collective excitation near 160-200T.", "Realized a tabletop analogue of relativistic electron-positron plasmas using Alfvén waves."]}}, {"title": "Reconfigurable flat bands from cooperative moir\\'e and charge order", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2511.05648", "authors": "B. K. Saika, S. Buchberger, S. Mo, A. Rajan, D. Halliday, Y. -C. Yao, L. C. Rhodes, H. Decitre, T. Balasubramanian, C. Polley, P. Wahl, P. D. C. King", "last_authors": "T. Balasubramanian, C. Polley, P. Wahl, P. D. C. King", "summary": "The formation of flat electronic bands from long-wavelength superperiodic moir\\'e potentials in van der Waals heterostructures underpins the creation and control of a host of highly-tunable correlated and topological phases. While the underlying moir\\'e periodicity is typically a fixed property of the heterostructure, here we show how the development of a charge-density wave (CDW) in one of the constituent materials can create an emergent moir\\'e lattice. We demonstrate this experimentally in TiSe$_2$/graphite epitaxial heterostructures, using angle-resolved photoemission and scanning-tunnelling microscopy and spectroscopy to directly image the resulting long-wavelength moir\\'e potential and concomitant flat-band formation. We show how the intrinsically low-energy, deformable landscape of the CDW imparts significant tunability, stabilising quasi-one-dimensional moir\\'e domains from symmetry breaking within the CDW, and allowing the complete suppression of flat-band formation by carrier doping across the CDW phase transition. Our findings thus open a new avenue for engineering moir\\'e matter by exploiting the rich many-body states of the parent compounds of 2D heterostructures.", "tier": "A_MUST_READ", "score": "10", "reason": "Direct hit: ARPES and STM study of CDW-induced moire and flat bands in TiSe2 heterostructures.", "tags": ["ARPES", "STM", "CDW", "flat-bands"], "image": "https://arxiv.org/html/2511.05648v2/x1.png", "briefing": {"background": "Van der Waals 이종접합에서 층간 회전각(twist angle)에 의한 모아레 패턴은 플랫 밴드를 형성하여 상관 물성을 연구하는 핵심 플랫폼입니다. 하지만 모아레 주기가 고정되어 있어 외부 제어가 어렵다는 한계가 있습니다.", "motivation": "TiSe2 내부의 CDW가 유발하는 자발적 대칭성 깨짐을 이용해 모아레 잠재력을 가변적으로 형성하고, 이를 통해 플랫 밴드를 재구성할 수 있는지 탐구하고자 합니다.", "result": "TiSe2/그래파이트 이종접합에서 CDW에 의한 주기적 잠재력이 모아레 격자를 형성하고 이로 인해 플랫 밴드가 유도됨을 ARPES와 STM으로 직접 관측했습니다.", "implication": "CDW를 이용하여 모아레 격자를 제어함으로써 2D 물질 연구에 새로운 자유도를 부여할 수 있습니다.", "novelty": "고정된 모아레 구조를 넘어, CDW라는 다체 상호작용을 통해 플랫 밴드를 재구성하고 스위칭할 수 있는 능동적 제어 방식을 제시했습니다.", "unresolved": "도핑 농도 변화가 CDW 도메인의 크기와 플랫 밴드 안정성에 미치는 미세한 상관관계.", "future_work": "도핑 제어를 통한 초전도성 또는 위상 절연체 상태와의 연관성 탐색.", "concepts": [{"term": "플랫 밴드(Flat Band)", "why_emerged": "에너지 분산이 거의 없는 밴드 구조에서 전자 간의 쿨롱 상호작용이 지배적이 되어 상관 물성이 극대화되기 때문입니다.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "강상관 전자계, 비재래적 초전도성, 분수 양자 홀 효과."}, {"term": "모아레 격자(Moiré Lattice)", "why_emerged": "2D 층상 물질 간의 중첩으로 인한 장주기적 잠재력 패턴이 새로운 전자 상태를 유도하기 때문입니다.", "origin": "전통적인 광학 간섭 현상에서 유래했으나 현대 물리에서는 2018년 MIT 연구진(Cao et al.)의 트위스티드 그래핀 연구로 확립됨.", "connections": "밴드 엔지니어링, 트위스트트로닉스."}], "english_summary": ["Charge density waves (CDW) create reconfigurable moiré lattices in TiSe2/graphite heterostructures.", "Flat electronic bands are observed via ARPES and STM, emerging from the CDW-induced potential.", "The moiré landscape is deformable, allowing for the suppression of flat bands through doping.", "Demonstrates a novel pathway for engineering many-body phases in 2D systems."]}}, {"title": "Defect-Induced Displacement of Topological Surface State in Quantum Magnet MnBi2Te4", "journal": "PRL_Recent", "source": "author whitelist", "link": "http://link.aps.org/doi/10.1103/pt1j-996m", "authors": "Felix Lüpke, Marek Kolmer, Hengxin Tan, et al.", "last_aut ces deflection of spin spiral wavevectors."]}}, {"title": "Nanoscale Imaging of Strain-Controlled Altermagnetic Domains in -MnTe", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2607.26495", "authors": "Alex L. Melendez, Sijie Xu, Liangbo Liang, et al.", "last_authors": "Zhaoyu Liu, Huan Zhao", "summary": "Altermagnets combine compensated magnetic order with momentum-dependent spin splitting, offering a route to spintronic functionality without the stray fields of conventional ferromagnets. Mechanical strain provides a promising means of controlling their N\\'eel order, yet the microscopic pathway by which strain reorganizes an altermagnetic texture remains unresolved. Here, we combine scanning nitrogen-vacancy magnetometry with a piezo-driven uniaxial strain cell to directly image the strain-driven evolution of magnetic domains in bulk {\\alpha}-MnTe at room temperature. By applying uniaxial stress along the nearest-neighbor Mn-Mn bond direction, we find that compressive strain reorganizes the magnetic texture through domain coalescence, increasing the size of the largest connected domain while reducing the domain-wall density. On sweeping toward tensile strain direction, however, the domain network follows a distinct trajectory from that observed during the compressive sweep. Instead, the large connected regions fragment into a new metastable configuration, producing pronounced hysteresis in the maximum domain size and stray-field distribution. These results identify domain connectivity and topology as key carriers of strain-induced magnetic memory. Our work reveals domain coalescence and hysteretic fragmentation as the microscopic pathway of strain control in {\\alpha}-MnTe and establishes a route toward strain-programmable altermagnetic textures and reconfigurable spintronic devices.", "tier": "A_MUST_READ", "score": "9", "reason": "Experimental imaging of altermagnetic domains in a key candidate material MnTe.", "tags": ["experim ink.aps.org/doi/10.1103/2bjl-p1vd", "authors": "Jiabin Yu, Yi Jiang, Yuanfeng Xu, et al.", "last_authors": "Fernando De Juan, B. Andrei Bernevig", "summary": "Here, the authors reveal that monolayer NbSe 2 and related transition metal dichalcogenides host obstructed atomic bands near the Fermi level. By constructing a b i n i t i o six-, three-, and single-band Wannier models, they identify remarkably compact obstructed Wannier functions and an unusual dominance of next-nearest-neighbor hopping. These results provide a transparent low-energy framework for investigating how quantum geometry shapes charge order, electron–phonon coupling, and superconductivity in NbSe 2 .", "tier": "B_IMPORTANT_CONDMAT", "score": "9", "reason": "Directly analyzes electronic structure and geometry in NbSe2, a relevant transition metal dichalcogenide.", "tags": ["monolayer", "NbSe2", "electronicstructure"], "image": "", "briefing": {"background": "전이금속 디칼코게나이드(TMD) 물질은 그 고유한 전자 구조와 전하 밀도 파(CDW), 초전도성으로 인해 응집물질물리학의 핵심 연구 대상입니다. 특히 그 기저에 있는 양자 기하학적 성질을 이해하는 것은 물질의 물성을 제어하는 데 중요합니다.", "motivation": "단층 NbSe2의 페르미 준위 근처 전자 밴드가 원자적 관점에서 '방해받은(obstructed)' 성질을 가진다는 점을 밝혀, 이를 기반으로 초전도성과 CDW 기저 기작을 설명하고자 함.", "result": "ab initio Wannier 모델을 통해 매우 컴팩트한 방해받은 Wannier 함수를 도출하였으며, 차근접 도핑(next-nearest-neighbor hopping)이 전자 구조를 지배함을 규명함.", "implication": "NbSe2의 초전도성과 CDW 현상을 전자-포논 결합 및 양자 기하학적 관점에서 훨씬 더 명확하고 간결한 프레임워크로 해석할 수 있게 됨.", "novelty": "Wannier 함수를 사용하여 NbSe2의 전자 구조를 재해석함으로써 복잡한 다체 물리 현상을 이해하는 새로운 이론적 도구를 제시함.", "unresolved": "이 모델이 다른 TMD 물질의 다양한 위상적 성질이나 도핑된 상태에서도 동일하게 유효한지는 추가 검증이 필요함.", "future_work": "도출된 Wannier 모델을 바탕으로 CDW와 초전도성 간의 미시적 경쟁 및 협력 메커니즘을 정량적으로 계산할 예정.", "concepts": [{"term": "Obstructed Atomic Bands", "why_emerged": "원자 궤도함수의 중심이 원자 위치와 일치하지 않아 위상적 성질을 띠는 전자 상태를 기술하기 위해 필요.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "위상 절연체, Wannier 기하학"}, {"term": "Wannier Functions", "why_emerged": "Bloch 함수를 국소화된 전자 궤도로 변환하여 고체 내 화학 결합과 전자 상관관계를 직관적으로 해석하기 위함.", "origin": "Gregory e under applied magnetic fields and link to the anomalous Hall response. The results establish x-ray microscopy as a powerful route to image domain structures in time-reversal symmetry breaking antiferromagnets.", "implication": "필터가 이 논문을 통과시킨 이유는 관련 키워드, 저자, 또는 Gemini relevance score 때문입니다.", "novelty": "Imaging topological magnetic domains in an anomalous Hall material relevant to the user's profile.", "unresolved": "원문 확인 후 열린 질문을 판단해야 합니다.", "future_work": "후속 실험, 독립 재현, 관련 물질/조건 확장이 가능한지 확인하세요.", "concepts": [], "english_summary": ["The detailed AI briefing was unavailable for this paper.", "Use the abstract, score reason, and original link for a quick first pass."]}}, {"title": "Chiral Charge Density Waves in Transition Metal Dichalcogenide", "journal": "PRL_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/5vkg-zvhv", "authors": "Ettore Carpene", "last_authors": "Ettore Carpene", "summary": "The emergence of chirality in the charge density wave (CDW) phase of 1 T − TiSe 2 has recently attracted significant attention, yet its microscopic origin remains debated. The prevailing interpretation attributes chirality to a relative phase shift between the charge density components. Here, using density functional theory and symmetry analysis, it is demonstrated that such phase-shifted states entail prohibitive energy costs, rendering them unlikely candidates for the ground state. Instead, a nearly degenerate metastable CDW phase stacking order with monoclinic symmetry is identified that naturally breaks mirror and inversion symmetries. The CDW in 1 T − TiSe 2 possesses a dual physical nature: The electronic charge redistribution is intrinsically bond modulated, while the periodic lattice distortion is atom-centered transverse. This spatial separation allows a specific optical coupling mechanism where circularly polarized light breaks the energetic degeneracy between chiral domains. These results reconcile conflicting experimental observations, identifying the “spontaneous” chirality observed in local probes as a statistical distribution of CDW phase stacking domains while establishing the mechanism for macroscopic, light-induced gyrotropic order.", "tier": "B_IMPORTANT_CONDMAT", "score": "9", "reason": "Chiral CDW in TMD, highly relevant to user's direct interests in CDW physics.", "tags": ["CDW", "chiral", "TMD", "electronicorder"], "image": "", "briefing": {"background": "1T-TiSe2와 같은 TMD 물질에서 발생하는 전하 밀도 파(CDW)는 고전적인 Peierls 전이 이외에도 물질의 대칭성을 깨뜨리는 독특한 위상적 특성을 보이며, 특히 그 '카이랄성'의 기원에 대한 논의가 활발함.", "motivation": "기존에 제안된 위상 차이 기반의 카이랄성 모델이 높은 에너지 비용 문제로 인해 실제 기저 상태로 부적합함을 지적하고, 보다 타당한 구조적 기작을 찾고자 함.", "result": "카이랄성이 위상 차이가 아닌, 단사정계 대칭성을 가진 적층 순서(stacking order)의 준안정 상태에서 기인함을 발견함. 또한 전하 재분배와 격자 변형의 공간적 분리가 원형 편광 빛에 의한 도메인 제어 가능성을 입증함.", "implication": "실험에서 관측되는 카이랄성이 단순한 위상 차이가 아닌 도메인 분포의 통계적 결과임을 밝혀 기존의 실험적 모순을 해결함.", "novelty": "CDW 도메인의 구조적 적층 방식을 통해 카이랄성을 설명함으로써, 빛을 이용한 위상 제어 가능성을 이론적으로 뒷받침함.", "unresolved": "도메인 간의 동적 변환 속도나 광학적 조절의 효율성에 대한 상세한 실험적 입증이 여전히 요구됨.", "future_work": "초고속 분광학을 이용해 광학적으로 유도된 카이랄 도메인의 동역학을 실시간 관찰할 계획.", "concepts": [{"term": "Chiral Charge Density Waves", "why_emerged": "공간 반전 대칭과 거울 대칭이 동시에 깨진 CDW 상태가 물질의 거대 물리량 변화를 설명하기 위해 제안됨.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "TMD, 1T-TiSe2, Berry 곡률"}, {"term": "Gyrotropic Order", "why_emerged": "반전 대칭이 깨진 매질에서 빛과 전자의 상호작용이 고유하게 나타나는 물리적 성질을 기술하기 위함.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "자연 광학 활성, 편광 제어"}], "english_summary": ["1T-TiSe2 CDW chirality is reassessed using DFT and symmetry analysis.", "Phase-shift models for chirality are energetically unfavorable.", "Monoclinic stacking of CDW domains naturally breaks inversion/mirror symmetry.", "The study reconciles experimental conflicts and explains light-induced gyrotropic response."]}}, {"title": "Coexistence and Tunability of Orbital and Spin Hall Effects in RuO2", "journal": "PRL_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/lf8d-26b ed Symmetry Breaking and Surface-State Transport in Rhombohedral Graphene Multilayers", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2608.11450", "authors": "Bosai Lyu, Jian Zheng, Kai Liu, et al.", "last_authors": "Weidong Luo, Guorui Chen", "summary": "Rhombohedral multilayer graphene hosts layer-polarized flat bands, providing an intriguing platform for correlated and topological electronic states; however, the role of layer number in governing symmetry breaking and surface screening remains elusive. Here we prepare rhombohedral graphene multilayers and systematically conduct electrical transport measurements. We uncover an unconventional layer dependence of phase transitions: the critical displacement field (D$_{c}$) for the layer-antiferromagnetic (LAF)-to-semimetal transitions remains constant across tetralayer to hexalayer graphene, whereas the D$_{c}$ for semimetal-to-layer-polarized-insulator (LPI) transition increases with layer number, defying unscreened Coulomb interaction models. In hexalayer graphene, surface-state-dominated transport emerges, with Landau levels (LLs) and resistive peaks selectively controlled by adjacent gates, a signature of strong interlayer screening absent in thinner stacks. High magnetic fields reveal valley-layer-locked LLs and dissipative states possibly from interlayer backscattering, highlighting the presence of decoupled surface states. Our findings establish layer number as a key tuning knob for engineering correlated and topological phases in rhombohedral graphene multilayers.", "tier": "B_IMPORTANT_CONDMAT", "score": "9", "reason": "Direct interest; topological and correlated physics in graphene multilayers.", "tags": ["graphene", "topological", "correlated-electrons", "transport"], "image": "https://arxiv.org/static/browse/0.3.4/images/arxiv-logo-fb.png", "briefing": {"background": "능형(rhombohedral) 쌓임 구조를 가진 다층 그래핀은 층간 결합과 강한 전자 상관관계에 의해 유도되는 평탄한 밴드(flat bands)를 가집니다. 이는 위상 절연체 및 강상관계 물 emerged": "위상학적 위상이 변형이나 온도에 민감하여 기초 물리 연구의 핵심 물질로 부상함", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "Van der Waals topological semimetals"}], "english_summary": ["ZrTe5 monolayers and bilayers undergo strain-induced topological phase transitions.", "Bilayers exhibit a complex phase diagram including insulating and metallic phases.", "Moderate mechanical strain (1-2%) is sufficient to modulate the topological gap.", "Thin-film ZrTe5 is proposed as a promising platform for strain-tunable topological electronics."]}}, {"title": "Pair-Density Wave from Doping an Altermagnetic Mott Insulator", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2607.23654", "authors": "Shuai A. Chen, Qianqian Chen, Guangyu Yu, Zheng Zhu", "last_authors": "Guangyu Yu, Zheng Zhu", "summary": "Pair-density-wave (PDW) superconductivity is a state in which the superconducting order parameter modulates at a finite wavevector. Using large-scale density matrix renormalization group, we study the doped altermagnetic Mott insulator in the checkerboard $t$-$J$ model, where altermagnetic exchange anisotropy is encoded microscopically through anisotropic ferromagnetic next-nearest-neighbor exchange. By mapping the ground-state phase diagram as a function of doping and altermagnetic anisotropy, mainly on six-leg cylinders, we identify a transition from a uniform $d$-wave superconducting regime with charge modulation to a PDW regime coexisting with stripe order. In the PDW regime, we report an unconventional wave-vector locking $\\mathbf Q_{\\mathrm{PDW}}\\approx 2\\mathbf Q_{\\mathrm{Stripe}}$ along the cylinder direction, in contrast to the conventional relation. Pair correlations reveal a two-scale structure, consisting of short-distance local $d$-wave pairing and long-distance finite-momentum PDW correlations. A symmetry-based Ginzburg--Landau analysis is presented for the observed locking. Our results identify altermagnetism as a strong-coupling, microscopically grou etry while preserving time-reversal ($T$) symmetry. In contrast, scalar spin chirality (SSC), a composite three-spin order, breaks $T$ symmetry and is known to induce an anomalous Hall effect (AHE). Although a spin nematic phase has been suggested in frustrated magnets and the square-lattice iridate, how it might affect magnetotransport properties is unknown. Here we use polarized neutron scattering to show that tetragonal $A$MnBi$_2$ ($A$ = Ca, Yb) is a strictly $c$-axis-aligned collinear antiferromagnet (C-type), with $T_N \\approx 270$ K and 290 K, respectively. On cooling from 450 K to $T_N$, low-energy spin excitations in YbMnBi$_2$ spontaneously change from isotropic to anisotropic in spin space within the tetragonal plane, forming a dynamic spin nematic phase around 400 K due to heavy Yb-induced spin-orbit coupling, before gapping out below $T_N$. Similar measurements on CaMnBi$_2$ reveal isotropic paramagnetic scattering without a spin nematic phase above $T_N$. Under an in-plane magnetic field, the Yb$^{3+}$ moments may interact with the dynamic spin nematic phase to induce nonzero SSC, giving rise to AHE and an anomalous Nernst effect (ANE) in YbMnBi$_2$ that are absent in CaMnBi$_2$ above $T_N$. A symmetry-based Ginzburg-Landau analysis shows that coupling terms between the nematic order and SSC are allowed under an external magnetic field, which could explain the rapid increase of AHE with field in YbMnBi$_2$. Our results provide compelling evidence for dynamic SSC-induced AHE and ANE in the paramagnetic phase of a compensated collinear antiferromagnet, opening a new avenue for the physics of composite spin orders and room-temperature spintronics without magnetic order.", "tier": "B_IMPORTANT_CONDMAT", "score": "9", "reason": "Highly relevant study on topological magnetic materials and anomalous Hall transport.", "tags": ["nematic", "anomalousHall", "neutronscattering"], "image": "https://arxiv.org/static/browse/0.3.4/images/arxiv-logo-fb.png", "briefing cant spinon band flattening.", "Provides theoretical insight into the dynamics of fractionalized excitations in topological quantum spin liquids."]}}, {"title": "Topological Surface Charge Detection via Active Capacitive Compensation: A Pathway to the 4D Quantum Hall Effect", "journal": "PRL_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/wycz-5hvd", "authors": "Yuanze Li, Renfei Wang, Yifan Zhang, et al.", "last_authors": "Yang Liu, Tian Liang", "summary": "The topological magnetoelectric effect (TME) in three-dimensional topological insulators (TIs), described by $\\mathrm{Δ}P=({e}^{2}/2h){N}_{\\text{Ch}}^{(2)}\\mathrm{Δ}B$, serves as a condensed-matter realization of the four-dimensional quantum Hall effect (4D QHE). In dual-gate axion insulator devices…", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Experimental method for detecting topological surface charge in topological insulators, relevant to QHE.", "tags": ["topologicalinsulator", "quantumHall", "experimentalmethod", "transport"], "image": "", "briefing": {"background": "위상 절연체에서 나타나는 위상 자기전기 효과(TME)는 4차원 양자 홀 효과와 수학적으로 등가이며, 이는 응집물질물리학에서 위상 상태를 탐지하는 중요한 물리량입니다.", "motivation": "기존의 수송 측정 방식으로는 3차원 위상 절연체의 표면 전하 분포를 정밀하게 분리해내기 어려워, 새로운 검출 방식인 능동 용량 보상법을 제안했습니다.", "result": "능동 용량 보상(Active capacitive compensation) 회로를 통해 위상 절연체 표면의 전하 밀도 변화를 정밀하게 측정하여 TME를 직접적으로 검출하는 데 성공했습니다.", "implication": "위상 절연체에서의 위상적 자기전기 계수를 측정하는 신뢰성 높은 실험 방법론을 확립했으며, 이는 4차원 양자 홀 효과 연구의 실험적 기반이 됩니다.", "novelty": "전통적인 홀 측정 방식에서 벗어나 용량적 보상을 도입하여 표면 상태의 기여도를 직접 탐지했다는 점에서 실험적 혁신성이 큽니다.", "unresolved": "소자의 계면 상태가 측정값에 미치는 영향(예: 불순물, 전하 패들링)을 완전히 배제하기 위한 추가적인 최적화가 필요합니다.", "future_work": "액시온 절연체 소자에 이 기술을 적용하여 액시온 전하의 정량적 측정 및 위상적 위상 전이 연구가 예상됩니다.", "concepts": [{"term": "위상 자기전기 효과 (TME)", "why_emerged": "위상 절연체의 비정상적인 전자기 유도 현상을 기술하기 위해", "origin": "Qi et al. (2008)", "connections": "액시온 절연체, 위상 절연체, 4D 양자 홀 효과"}, {"term": "4D 양자 홀 효과", "why_emerged": "고차원 위상 공간에서의 응답 함수를 일반화하기 위해", "origin": "Zhang and Hu (2001)", "connections": "토폴로지컬 절연체, TME, 위상 양자 장론"}], "english_summary": ["Introduces an active capacitive compensation method to detect topological surface charge.", "Demonstrates the detection of the topological magnetoelectric effect as a bridge to 4D quantum Hall physics.", "Offers a precise experimental tool for characterizing axion insulator devices."]}}, {"title": "Room-temperature multiferroicity in all–van der Waals heterostructures", "journal": "Science", "source": "Gemini", "link": "https://doi.org/10.1126/science.adq0420", "authors": "Qinqin Wang, Baojuan Xin, Chen Liu, et al.", "last_authors": "Evgeny Y. Tsymbal, Cheng Gong", "summary": "Multiferroics host simultaneous and coupled ferroic orders, allowing disparate external stimuli to induce abrupt transformations in their structures and properties. Creating multiferroicity in two-dimensional (2D) van der Waals (vdW) platforms would add the elements of strong quantum confinement, enhanced quasiparticle excitations, and wide tunability to the capabilities of these systems. In this work, we constructed vdW heterostructures of ferromagnetic triiron gallium ditelluride (Fe 3 GaTe 2 ) and ferroelectric copper indium thiophosphate (CuInP 2 S 6 ) to integrate their respective orders. We observed strong interferroic coupling at room temperature by demonstrating ferroelectrically reconfigurable magnetic anisotropy of 2D Fe 3 GaTe 2 . The interferroic magnetoelectricity diminished with increasing Fe 3 GaTe 2 thickness, revealing the interfacial nature of heterostructure multiferroicity. Our discovery of all-vdW heterostructure multiferroicity opens the door to the artificial assembly of vdW layers for designer 2D multiferroics.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Room-temperature multiferroicity in 2D vdW heterostructures, relevant for quantum materials.", "tags": ["multiferroicity", "vanderWaals", "heterostructure", "2Dmaterials", "magnetism"], "image": "", "briefing": {"background": "강자성체와 강유전체가 결합된 다강체(multiferroics)는 외부 자기장이나 전기장으로 상호 간의 질서 변수를 제어할 수 있어 차세대 메모리 소자로 주목받고 있습니다. 그러나 상온에서 안정적인 결합을 보이는 다강체 물질은 극히 드뭅니다.", "motivation": "2차원 반데르발스(vdW) 물질은 강한 양자 구속 효과와 넓은 튜닝 범위를 제공합니다. 연구진은 강자성 Fe3GaTe2와 강유전체 CuInP2S6를 결합하여 상온에서 작동하는 2차원 다강체 이종구조를 구현하고자 했습니다.", "result": "Fe3GaTe2와 CuInP2S6 이종구조에서 Fe3GaTe2의 자기 이방성이 CuInP2S6의 강유전성 상태에 따라 재구성되는 강력한 상호작용을 관찰했습니다. 이는 계면에서의 상호작용이 주된 원인임을 밝혀냈습니다.", "implication": "2차원 물질을 인위적으로 쌓아 올리는 방식(van der Waals heterostructuring)으로 설계 가능한 다강체 소자를 제작할 수 있음을 보여주며, 이는 저전력 비휘발성 메모리 연구에 새로운 길을 제시합니다.", "novelty": "기존 벌크 다강체와 달리 2차원 vdW 이종구조를 통해 상온에서 강한 자기-전기 결합(magnetoelectric coupling)을 실현했다는 점이 핵심입니다. 이는 박막 형태의 자성체 제어에 관심이 많은 본 독자의 연구 영역과도 밀접합니다.", "unresolved": "Fe3GaTe2의 두께가 두꺼워질수록 상호작용이 약해지는 현상에 대한 세부적인 계면 물리 메커니즘과, 소자 장기 안정성에 대한 검증이 필요합니다.", "future_work": "다른 2차원 자성체와의 조합을 통한 다강체 라이브러리 확장 및 실제 전기적 스위칭 속도 측정 연구가 이어질 것으로 보입니다.", "concepts": [{"term": "다강성(Multiferroicity)", "why_emerged": "하나의 물질 안에서 자기적 질서와 전기적 질서가 공존하여 두 물리량을 동시에 제어하기 위해 필요.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "강유전성, 강자성, 자기전기 효과(Magnetoelectric effect)"}, {"term": "반데르발스 이종구조(vdW heterostructure)", "why_emerged": "서로 다른 2차원 물질을 결합하여 새로운 물리적 특성을 창출하기 위해 개발됨.", "origin": "Geim, A. K. 및 Novoselov, K. S. 등이 그래핀 연구를 통해 기틀을 마련함.", "connections": "Moire 패턴, 2D 트랜지스터, 터널링 소자"}], "english_summary": ["Demonstrated room-temperature multiferroicity in all-vdW heterostructures.", "Combined ferromagnetic Fe3GaTe2 and ferroelectric CuInP2S6.", "Achieved ferroelectrically reconfigurable magnetic anisotropy via interfacial magnetoelectric coupling.", "Proposed a designer strategy for future 2D quantum memory devices."]}}, {"title": "Internal electric fields enhance reductive reactivity at MoS 2 boundaries revealed by ultrafast near-field nanospectroscopy", "journal": "Science_Advances", "source": "Gemini", "link": "https://doi.org/10.1126/sciadv.aee0180", "authors": "Feng Li, Qi Sun, Tao Yang, et al.", "last_authors": "Shengye Jin, Wenming Tian", "summary": "Monolayer MoS 2 is a promising low-cost and efficient catalyst for electrochemical or photochemical reduction reactions. Many previous works have demonstrated that 2D MoS 2 edges or boundaries are active reaction sites; however, their structural and electron dynamic origins remain unclear. Here we report an aperture-type near-field ultrafast transient absorption spectroscopy to directly probe the electron dynamics at nanoscale MoS 2 boundaries. Near-field transient absorption imaging reveals a Stark effect signature at boundaries, where a built-in electric field of 1.93 MV/cm is intrinsically formed due to the oxidation of crystal boundaries. This field drives ultrafast electron injection and accumulation at the boundaries, enhancing boundary reactivity over the interior. These findings uncover the nanoscale structure-activity correlation for 2D MoS 2 and promote the rational design of catalysts based on transition metal dichalcogenides.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Experimental study of electron dynamics in monolayer MoS2 using advanced nanospectroscopy; relevant 2D material.", "tags": ["2Dmaterials", "MoS2", "spectroscopy", "electrondynamics", "catalysis"], "image": "", "briefing": {"background": "2차원 전이금속 디칼코게나이드(TMD)인 MoS2는 우수한 촉매 활성으로 주목받고 있으나, 결정 경계(boundary)가 왜 높은 촉매 효율을 보이는지에 대한 근본적인 전자 동역학적 기작은 명확히 규명되지 않았습니다.", "motivation": "기존 광학적 접근 방식은 나노미터 규모의 결정 경계에서 일어나는 초고속 전자 거동을 관찰하는 데 한계가 있었습니다. 이를 해결하기 위해 나노 분해능을 갖는 초고속 근접장 분광법을 도입하고자 했습니다.", "result": "MoS2 결정 경계에서의 산화로 인해 약 1.93 MV/cm의 강한 내부 전기장이 형성되어 있음을 발견했습니다. 이 전기장이 전자를 경계로 강하게 주입하고 축적시켜 촉매 반응성을 크게 높임을 증명했습니다.", "implication": "2차원 물질의 구조적 결함이 단순한 결함이 아니라, 의도적으로 설계된 전기장 생성 부위로 활용될 수 있음을 시사합니다.", "novelty": "초고속 근접장 분광법을 통해 나노미터 단위의 경계에서 발생하는 Stark 효과와 내부 전기장의 실체(Stark effect signature)를 직접적으로 시각화했다는 점이 독보적입니다.", "unresolved": "다양한 촉매 반응 환경(용액 등)에서도 이러한 내부 전기장이 안정적으로 유지되는지에 대한 추가적인 연구가 필요합니다.", "future_work": "유사한 2차원 물질들로의 확장 적용 및 내부 전기장 튜닝을 통한 고효율 촉매 설계 최적화가 예상됩니다.", "concepts": [{"term": "스타크 효과(Stark Effect)", "why_emerged": "외부 전기장이 원자나 분자의 에너지 준위를 분리하거나 이동시키는 현상을 이해하기 위해 필요.", "origin": "Johannes Stark (1913년 발견).", "connections": "양자 가둠 효과, 엑시톤 동역학"}, {"term": "근접장 분광법(Near-field spectroscopy)", "why_emerged": "빛의 회절 한계를 극복하고 나노미터 규모의 국소적인 물리적 특성을 조사하기 위해.", "origin": "E. H. Synge (1928년 초기 개념 제안).", "connections": "s-SNOM, 나노 포토닉스"}], "english_summary": ["Used near-field ultrafast transient absorption spectroscopy to probe MoS2 boundaries.", "Revealed a strong built-in electric field (1.93 MV/cm) due to boundary oxidation.", "Demonstrated how this field drives electron injection to enhance catalysis.", "Provided a nanoscale mechanism for the high reactivity of 2D material edges."]}}, {"title": "Mid-infrared long-range surface polaritons in two-dimensional van der Waals materials", "journal": "Science_Advances", "source": "Gemini", "link": "https://doi.org/10.1126/sciadv.aed2198", "authors": "Mingsong Wang, Shixiong Yin, Saroj Chand, et al.", "last_authors": "Gabriele Grosso, Andrea Alù", "summary": "The discovery of graphene plasmons (GPs) and hyperbolic phonon polaritons (HPhPs) in two-dimensional (2D) van der Waals (vdW) materials has enabled extreme light confinement and enhanced light-matter interactions, holding the promise for miniaturized mid-infrared (mid-IR) photonic devices. However, GPs and HPhPs suffer from limited propagation lengths, hindering their impact in various applications. Here, we demonstrate long-range surface polaritons (LRSPs) in 2D vdW materials, featuring much longer propagation lengths and faster group velocities, which may offer complementary opportunities for high-speed on-chip photonic applications in the mid-IR regime. The demonstrated LRSPs are supported by deep-subwavelength heterostructures consisting of a hexagonal boron nitride (h-BN) flake, a high-index germanium (Ge) layer, and a gold (Au) film. Within such geometry, we experimentally demonstrate propagation distances exceeding 80 micrometers crossing an entire h-BN flake without substantial decay. A theoretical prediction of ∼925-micrometer propagation length is obtained. These polaritons may be ideally suited for realizing polaritonic interconnects that bridge different components of compact and planar photonic systems, enabling mid-IR information transport and seamless integration with other vdW material–based mid-IR photonic devices.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Experimental study of long-range polaritons in 2D vdW heterostructures, relevant for photonics.", "tags": ["method", "material", "vdWheterostructure", "polaritons", "graphene"], "image": "", "briefing": {"background": "2차원 물질에서 나타나는 표면 플라즈몬이나 포논 폴라리톤은 빛을 나노 단위로 가둘 수 있어 차세대 광소자로 기대를 모읍니다. 하지만 이들은 감쇄가 빨라 전파 거리가 매우 짧다는 한계가 있습니다.", "motivation": "중적외선 대역에서 더 먼 거리까지 정보를 전달할 수 있는 새로운 형태의 장거리 표면 폴라리톤(LRSP)을 구현하고, 이를 2차원 물질 기반 소자에 통합하고자 했습니다.", "result": "h-BN, 고굴절률 Ge층, Au 막을 결합한 이종구조를 통해 전파 거리가 80마이크로미터 이상인 장거리 표면 폴라리톤을 실험적으로 검증했습니다.", "implication": "극도로 제한된 공간에 빛을 가두면서도 원거리 전송이 가능한 폴라리톤 인터커넥트(interconnects) 기술의 가능성을 열어주었습니다.", "novelty": "기존의 전파 거리 한계를 극복하는 새로운 기하학적 구조를 제시했으며, 이론적으로는 900마이크로미터 수준의 전파까지 예측하여 실제 광통신 소자로의 응용 가능성을 높였습니다.", "unresolved": "이종구조 내의 계면 산란 손실을 더 줄일 수 있는 대면적 공정 기술과, 상온에서의 일관된 성능 유지 여부가 관건입니다.", "future_work": "폴라리톤 기반의 광 논리 소자 구현 및 다양한 2차원 물질 플랫폼과의 하이브리드 소자 연구가 기대됩니다.", "concepts": [{"term": "포논 폴라리톤(Phonon Polariton)", "why_emerged": "빛과 물질 내의 격자 진동(포논)이 강하게 결합하여 발생하는 준입자를 이해하기 위해.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "플라즈몬, 쌍곡선 메타물질, 광-물질 상호작용"}, {"term": "표면 폴라리톤(Surface Polariton)", "why_emerged": "전자기파가 표면을 따라 흐르면서 에너지를 국소화하는 현상을 활용하기 위해.", "origin": "Zenneck (1907) 등 초기 전자기파 표면파 연구에서 유래.", "connections": "표면 플라즈몬 공명(SPR), 나노 포토닉스"}], "english_summary": ["Demonstrated long-range surface polaritons (LRSPs) in vdW heterostructures.", "Achieved propagation distances exceeding 80 micrometers in the mid-IR regime.", "Utilized an h-BN/Ge/Au stack to enhance propagation performance.", "Offers a pathway for integrated polaritonic interconnects in planar photonic systems."]}}, {"title": "On-chip waveguide-integrated light sources using MoS 2 /WSe 2 moiré superlattices on a silicon photonic platform", "journal": "Science_Advances", "source": "Gemini", "link": "https://doi.org/10.1126/sciadv.aef5518", "authors": "Xingyu Huang, Hanlin Fang, Shima Kadkhodazadeh, et al.", "last_authors": "Martijn Wubs, Sanshui Xiao", "summary": "Moiré superlattices have been widely explored as a unique platform for investigating exotic physics, but their potential applications in integrated photonics remain unexplored. In this work, we demonstrate a waveguide-integrated light source operating at telecom wavelengths with high temporal coherence, enabled by molybdenum disulfide (MoS 2 )/tungsten diselenide (WSe 2 ) moiré superlattices coupled to a silicon photonic nanobeam cavity. Our results reveal that, at room temperature, the moiré potential in MoS 2 /WSe 2 superlattices strongly boosts light-emission intensity, extends interlayer-exciton lifetime, and redshifts the emission wavelength. Our demonstrated device shows excellent coherence properties with near-unity interference visibility and a coherence length of about 3.8 millimeters, substantially exceeding the performance of previously reported two-dimensional–material light sources. Moreover, these devices exhibit stable performance under ambient conditions, operating within the fiber communication O-band. This work paves the way for leveraging moiré superlattices as a promising material for photonic integrated circuits, highlighting their potential to enhance light-matter interactions and expand the capabilities of on-chip photonic technologies.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Experimental study of moiré superlattices in 2D materials (MoS2/WSe2) for light-matter interaction enhancement.", "tags": ["2Dmaterials", "moiré", "heterostructures", "MoS2", "WSe2", "excitons", "photonics"], "image": "", "briefing": {"background": "2차원 반도체 헤테로구조에서 모아레 초격자는 층간 엑시톤의 물리적 거동을 제어하고 광학적 특성을 획기적으로 향상시킬 수 있는 플랫폼으로 주목받고 있습니다. 본 연구는 이러한 모아레 시스템을 실리콘 광자 회로와 통합하여 온칩 광원 기술의 한계를 극복하고자 합니다.", "motivation": "기존 2차원 물질 기반 광원은 효율과 상온 동작 안정성 측면에서 한계가 있었습니다. 본 연구는 MoS2/WSe2 모아레 초격자의 잠재력을 실리콘 포토닉스 플랫폼에 접목하여 통신용 파장대에서 고성능 광원을 구현하고자 했습니다.", "result": "MoS2/WSe2 모아레 초격자를 실리콘 나노빔 공동에 결합하여 상온에서 층간 엑시톤 발광 효율을 극대화하고, 높은 간섭 가시성과 긴 코히런스 길이를 갖는 안정적인 O-band 광원을 구현했습니다.", "implication": "모아레 초격자가 단순히 물리 현상 연구를 넘어 고성능 광자 소자 플랫폼으로서 실용적인 가치가 있음을 입증했습니다. 이는 향후 칩 스케일의 고성능 광통신 소자 개발에 중요한 이정표가 될 것입니다.", "novelty": "기존 2차원 물질 광원 대비 월등한 코히런스 특성을 확보했으며, 특히 실리콘 포토닉스 공정과의 통합 가능성을 실증했다는 점에서 공학적 완성도가 높습니다.", "unresolved": "모아레 포텐셜에 의한 발광 성능 강화의 세부적인 메커니즘과 장기적인 동작 신뢰성, 그리고 대면적 균일성 확보에 대한 추가 연구가 필요합니다.", "future_work": "실제 온칩 광통신 시스템으로의 통합, 모아레 주기 조절을 통한 파장 튜닝 범위 확대, 그리고 전기적 제어가 가능한 능동형 소자로의 발전이 기대됩니다.", "concepts": [{"term": "모아레 초격자", "why_emerged": "서로 다른 격자 상수를 가진 2차원 물질을 적층할 때 발생하는 간섭 무늬가 전자 및 엑시톤의 포텐셜 에너지를 주기적으로 변조하기 위해.", "origin": "그래핀 트위스트 시스템에서 강상관계 물리 연구로 대중화됨.", "connections": "트위스트 전자공학, 강상관 전자계, 엑시톤 제한."}, {"term": "층간 엑시톤", "why_emerged": "이종 구조(heterostructure)에서 전자와 정공이 서로 다른 층에 위치하게 되어 재결합 시간이 길어지는 특성을 활용하기 위해.", "origin": "2차원 반도체 헤테로구조 연구 초기(2010년대 중반).", "connections": "반데르발스 헤테로구조, 광전 소자, 엑시톤 동역학."}, {"term": "실리콘 나노빔 공동", "why_emerged": "빛을 작은 공간에 가두어 물질과의 상호작용을 극대화(Purcell 효과)하여 광 방출 효율을 높이기 위해.", "origin": "광자결정(Photonic crystal) 연구로부터 발전.", "connections": "나노 포토닉스, 공동 양자 전기역학(cQED)."}], "english_summary": ["Demonstrates on-chip waveguide-integrated light sources using MoS2/WSe2 moiré superlattices.", "Achieves high temporal coherence and 3.8 mm coherence length at telecom wavelengths.", "Moiré potential significantly enhances interlayer exciton emission and lifetime at room temperature.", "Successfully integrated with silicon nanobeam cavities for stable ambient-condition operation.", "Establishes moiré superlattices as a viable material platform for scalable integra function textEl(tag, className, text) { const el = document.createElement(tag); if (className) el.className = className; el.textContent = text || ''; return el; }
function appendLabeledText(parent, className, label, text) { if (!text) return; const el = document.createElement('p'); el.className = className; const strong = textEl('strong', '', label); el.appendChild(strong); el.append(text); parent.appendChild(el); }
function appendBriefSection(parent, title, text, wide = false) { if (!text) return; const section = document.createElement('section'); section.className = 'brief-section' + (wide ? ' wide' : ''); section.appendChild(textEl('h2', '', title)); section.appendChild(textEl('p', '', text)); parent.appendChild(section); }
function render() {
  slideEl.replaceChildren();
  if (!slides.length) { slideEl.className = 'empty'; slideEl.textContent = 'No papers passed the filters in this run.'; counterEl.textContent = '0 / 0'; prevBtn.disabled = true; nextBtn.disabled = true; return; }
  slideEl.className = 'slide';
  const r = slides[index];
  const b = r.briefing || {};
  const head = document.createElement('div');
  head.className = 'paper-head';
  if (r.image) {
    const figure = document.createElement('figure');
    figure.className = 'figure';
    const img = document.createElement('img');
    img.src = r.image; img.alt = 'Figure or article preview image'; img.loading = 'lazy'; img.referrerPolicy = 'no-referrer'; img.onerror = () => figure.remove();
    figure.appendChild(img);
    figure.appendChild(textEl('figcaption', '', 'Figure / article preview image from the source page'));
    head.appendChild(figure);
  }
  const headText = document.createElement('div');
  headText.className = 'head-text';
  const badges = document.createElement('div');
  badges.className = 'badges';
  if (r.score) badges.appendChild(textEl('span', 'badge score', `${r.score}/10`));
  if (r.tier) badges.appendChild(textEl('span', 'badge', r.tier));
  if (r.journal) badges.appendChild(textEl('span', 'badge', r.journal));
  if (r.source) badges.appendChild(textEl('span', 'badge', r.source));
  headText.appendChild(badges);
  const title = document.createElement('h1');
  if (r.link) { const titleLink = document.createElement('a'); titleLink.href = r.link; titleLink.target = '_blank'; titleLink.rel = 'noopener noreferrer'; titleLink.textContent = r.title || ''; title.appendChild(titleLink); }
  else { title.textContent = r.title || ''; }
  headText.appendChild(title);
  headText.appendChild(textEl('p', 'meta', [r.journal, r.source].filter(Boolean).join(' | ')));
  if (r.last_authors || r.authors) { const authors = document.createElement('p'); authors.className = 'authors'; if (r.last_authors) authors.append('Last authors: ' + r.last_authors); if (r.authors) authors.append((r.last_authors ? ' | ' : '') + 'Authors: ' + r.authors); headText.appendChild(authors); }
  appendLabeledText(headText, 'why', 'Filter reason: ', r.reason);
  if (r.tags && r.tags.length) { const tags = document.createElement('div'); tags.className = 'tags'; r.tags.forEach(tag => tags.appendChild(textEl('span', 'tag', '#' + tag))); headText.appendChild(tags); }
  if (r.link) { const link = document.createElement('a'); link.className = 'link'; link.href = r.link; link.target = '_blank'; link.rel = 'noopener noreferrer'; link.textContent = 'Open paper'; headText.appendChild(link); }
  head.appendChild(headText);
  if (r.summary) { const abstract = document.createElement('p'); abstract.className = 'original-abstract'; const strong = textEl('strong', '', 'Original abstract'); abstract.appendChild(strong); abstract.append(r.summary); head.appendChild(abstract); }
  slideEl.appendChild(head);
  const briefing = document.createElement('div');
  briefing.className = 'briefing';
  appendBriefSection(briefing, 'Background', b.background);
  appendBriefSection(briefing, 'Motivation', b.motivation);
  appendBriefSection(briefing, 'Result', b.result);
  appendBriefSection(briefing, 'Implication', b.implication);
  appendBriefSection(briefing, "Why it's important / Novelty", b.novelty);
  appendBriefSection(briefing, 'Unresolved Questions', b.unresolved);
  appendBriefSection(briefing, 'Expected Future Work', b.future_work);
  if (b.concepts && b.concepts.length) {
    const section = document.createElement('section');
    section.className = 'brief-section wide';
    section.appendChild(textEl('h2', '', 'Concepts / Terms'));
    const concepts = document.createElement('div');
    concepts.className = 'concepts';
    b.concepts.forEach(c => {
      const item = document.createElement('div');
      item.className = 'concept';
      item.appendChild(textEl('h3', '', c.term || 'Concept'));
      [['왜 생겼나: ', c.why_emerged], ['누가 만들었나: ', c.origin], ['연결되는 흐름: ', c.connections]].forEach(([label, text]) => { if (!text) return; const p = document.createElement('p'); const bold = textEl('b', '', label); p.appendChild(bold); p.append(text); item.appendChild(p); });
      concepts.appendChild(item);
    });
    section.appendChild(concepts);
    briefing.appendChild(section);
  }
  if (b.english_summary && b.english_summary.length) { const section = document.createElement('section'); section.className = 'brief-section wide'; section.appendChild(textEl('h2', '', 'English Summary')); const ul = document.createElement('ul'); b.english_summary.slice(0, 5).forEach(line => ul.appendChild(textEl('li', '', line))); section.appendChild(ul); briefing.appendChild(section); }
  slideEl.appendChild(briefing);
  counterEl.textContent = `${index + 1} / ${slides.length}`;
  prevBtn.disabled = index === 0;
  nextBtn.disabled = index === slides.length - 1;
}
prevBtn.addEventListener('click', () => { index = Math.max(0, index - 1); render(); });
nextBtn.addEventListener('click', () => { index = Math.min(slides.length - 1, index + 1); render(); });
document.addEventListener('keydown', event => { if (event.key === 'ArrowLeft') prevBtn.click(); if (event.key === 'ArrowRight') nextBtn.click(); });
render();
</script>
</body>
</html>
