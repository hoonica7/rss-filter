<!DOCTYPE html>

<head>
<meta charset='UTF-8'>
<meta name='viewport' content='width=device-width, initial-scale=1.0'>
<title>Daily Paper Slideshow</title>
<style>
  :root {
    color-scheme: light;
    --bg: #f6f7f4;
    --paper: #ffffff;
    --ink: #111827;
    --muted: #64748b;
    --line: #d8ddd2;
    --accent: #176b87;
    --accent-2: #9a3412;
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; overflow: auto; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: var(--bg); color: var(--ink); }
  .shell { max-width: 1500px; min-height: 100vh; margin: 0 auto; padding: 14px 18px; display: flex; flex-direction: column; }
  .topbar { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 16px; }
  .top-actions { display: flex; align-items: center; gap: 10px; }
  .topbar a, button { border: 1px solid var(--line); border-radius: 8px; background: var(--paper); color: var(--ink); padding: 10px 14px; font-weight: 700; text-decoration: none; cursor: pointer; }
  button.primary { background: var(--accent); border-color: var(--accent); color: white; }
  button:disabled { opacity: 0.45; cursor: not-allowed; }
  .counter { color: var(--muted); font-weight: 700; }
  .slide { min-height: calc(100vh - 82px); background: var(--paper); border: 1px solid var(--line); border-radius: 10px; padding: 18px; box-shadow: 0 18px 42px rgba(15, 23, 42, 0.10); display: grid; grid-template-columns: minmax(310px, 0.86fr) minmax(0, 1.55fr); gap: 18px; overflow: visible; }
  .paper-head { min-width: 0; min-height: 0; overflow: visible; display: flex; flex-direction: column; gap: 12px; }
  .figure { margin: 0; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: #f8fafc; }
  .figure img { display: block; width: 100%; max-height: 41vh; object-fit: contain; background: white; }
  .figure figcaption { padding: 7px 10px; color: var(--muted); font-size: 12px; line-height: 1.3; }
  .head-text { display: flex; flex-direction: column; gap: 9px; min-width: 0; }
  .badges { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .badge { border-radius: 999px; padding: 5px 9px; background: #eef2ff; color: #3730a3; font-size: 12px; font-weight: 800; }
  .score { background: #fee2e2; color: #991b1b; }
  h1 { margin: 0; font-size: 25px; line-height: 1.15; letter-spacing: 0; overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
  h1 a { color: inherit; text-decoration-color: rgba(23, 107, 135, 0.35); text-decoration-thickness: 2px; text-underline-offset: 4px; }
  h1 a:hover { color: var(--accent); text-decoration-color: var(--accent); }
  .meta, .authors, .why, .abstract { font-size: 13px; line-height: 1.45; }
  .meta, .authors { color: var(--muted); }
  .why strong, .abstract strong, .authors strong { color: var(--ink); }
  .authors { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .why { border-left: 4px solid var(--accent-2); padding-left: 10px; color: #374151; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .abstract { border-top: 1px solid var(--line); padding-top: 14px; color: #374151; }
  .original-abstract { border-top: 1px solid var(--line); padding-top: 10px; color: #374151; font-size: 11.5px; line-height: 1.35; overflow-wrap: anywhere; }
  .original-abstract strong { display: block; margin-bottom: 4px; color: var(--ink); }
  .tags { display: flex; flex-wrap: wrap; gap: 8px; }
  .tag { border-radius: 999px; padding: 4px 8px; background: #f1f5f9; color: #475569; font-size: 12px; font-weight: 700; }
  .head-text > .link { display: none; }
  .briefing { min-width: 0; min-height: 0; overflow: visible; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); grid-auto-rows: minmax(0, auto); align-content: start; gap: 11px 18px; border-top: 0; padding-top: 0; }
  .brief-section { min-width: 0; }
  .brief-section.wide { grid-column: 1 / -1; }
  .brief-section h2 { margin: 0 0 4px; font-size: 14px; line-height: 1.22; color: #0f766e; letter-spacing: 0; }
  .brief-section p, .brief-section li { margin: 0; font-size: 12.5px; line-height: 1.42; color: #1f2937; overflow-wrap: anywhere; }
  .brief-section ul { margin: 0; padding-left: 20px; }
  .concepts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 9px 14px; }
  .concept { border-top: 1px solid var(--line); padding-top: 7px; }
  .concept h3 { margin: 0 0 4px; font-size: 13px; color: #7c2d12; letter-spacing: 0; }
  .concept p { margin: 2px 0 0; font-size: 11.5px; line-height: 1.35; color: #374151; overflow-wrap: anywhere; }
  .concept b { color: #111827; }
  .link { color: var(--accent); font-weight: 800; text-decoration: none; }
  .empty { padding: 48px; background: var(--paper); border: 1px solid var(--line); border-radius: 12px; color: var(--muted); }
  @media (max-width: 860px) {
    .shell { padding: 14px; }
    .topbar, .top-actions { align-items: stretch; flex-direction: column; }
    .slide, .briefing, .concepts { grid-template-columns: 1fr; }
    .slide { min-height: auto; overflow: visible; display: grid; }
    h1 { font-size: 28px; }
  }
</style>

<script>
const slides = [{"title": "Disentangling bulk and surface electronic structure using targeted cleave planes in RuO2", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/sjrs-3fjz", "authors": "Maria H. Visscher, Sebastian Buchberger, Bruno Saika, et al.", "last_authors": "Andrew P. Mackenzie, Phil D. C. King", "summary": "Using focused ion beam designed cleaving planes, the authors prepare different surface orientations of RuO 2 for study by angle-resolved photoemission spectroscopy. The high-resolution measurements this enables from two distinct surfaces, combined with electronic structure calculations, make it possible to better distinguish bulk versus surface states. In fact, they reveal that the ARPES spectra are largely dominated by surface, rather than bulk, states, and reveal how these are strongly impacted by spin-orbit coupling, surface stoichiometry, and structure.", "tier": "A_MUST_READ", "score": "10", "reason": "Direct hit: High-resolution ARPES on RuO2, a key altermagnet candidate, focusing on surface versus bulk states.", "tags": ["ARPES", "RuO2", "altermagnetism"], "image": "", "briefing": {"background": "RuO2는 최근 알터마그네티즘(altermagnetism)이라는 새로운 자성 상태의 후보 물질로 급부상했습니다. 이 상태는 전체 자화값은 0이지만 전도 밴드에서 강한 스핀 분할을 보여, 차세대 스핀트로닉스 구현을 위한 핵심 물리 현상으로 연구되고 있습니다.", "motivation": "ARPES를 통해 RuO2의 전자 구조를 정밀하게 측정하려는 시도가 많으나, 결정의 벽개(cleave)가 어렵고 표면 상태(surface states)와 벌크 상태(bulk states)가 복잡하게 섞여 있어 알터마그네틱 특징인 벌크 밴드 분할을 명확히 구분하는 데 어려움이 있었습니다.", "result": "FIB(집속 이온 빔)를 이용해 특정 결정면을 노출시키는 정밀 절단 기법을 사용하여, 서로 다른 두 가지 표면 방위에서 고해상도 ARPES 데이터를 획득했습니다. 실험 결과와 계산을 비교한 결과, 관찰된 스펙트럼의 상당 부분이 벌크가 아닌 표면 상태에 의해 지배되고 있음을 밝혀냈으며, 이것이 스핀-궤도 결합(SOC)과 표면 원자 구조에 따라 크게 달라짐을 확인했습니다.", "implication": "기존 ARPES 데이터에서 알터마그네틱 벌크 밴드 분할로 해석되었던 신호들이 실제로는 표면 효과일 가능성을 시사하며, 향후 알터마그넷의 전자 구조 해석에 있어 표면 민감도에 대한 엄밀한 검토가 필수적임을 보여줍니다.", "novelty": "FIB 기반 시편 준비법을 ARPES에 도입하여 측정 불가능했던 결정면의 전자 구조를 직접 확인했다는 기술적 혁신이 있으며, 독자의 주 관심사인 알터마그넷 RuO2의 벌크/표면 논란을 직접적으로 다루고 있습니다.", "unresolved": "표면 상태의 지배적인 영향력 속에서 순수한 벌크 알터마그네틱 밴드 분할만을 어떻게 실험적으로 분리해낼 것인가가 여전히 과제로 남아 있습니다.", "future_work": "다른 방위의 결정면 추가 측정 및 스핀 분해 ARPES(Spin-resolved ARPES)를 통한 표면 대 벌크의 스핀 편극 차이 규명이 예상됩니다.", "concepts": [{"term": "알터마그네티즘 (Altermagnetism)", "why_emerged": "강자성의 큰 스핀 분할과 반강자성의 순자화 제로 특성을 동시에 가진 물질을 설명하기 위해 등장했습니다.", "origin": "L. Šmejkal, J. Sinova, R. Jungwirth 등에 의해 최근 이론적으로 체계화됨.", "connections": "스핀 홀 효과, 비정상 홀 효과, 반강자성 스핀트로닉스"}, {"term": "FIB 기반 절단 (FIB-designed cleaving)", "why_emerged": "자연적으로 잘 쪼개지지 않는 물질의 특정 결정면을 ARPES로 측정하기 위해 개발되었습니다.", "origin": "초록 정보만으로는 특정하기 어려우나, Andrew Mackenzie 교수 그룹 등이 주도적으로 활용함.", "connections": "ARPES, 미세 소자 가공, TEM 시편 준비"}, {"term": "표면 상태 (Surface States)", "why_emerged": "결정의 종단면에서 발생하는 대칭성 파괴로 인해 벌크와 다른 에너지 상태가 형성됩니다.", "origin": "Igor Tamm 및 William Shockley가 이론적 기초를 확립함.", "connections": "위상 절연체, ARPES 표면 민감도, 촉매 물리"}, {"term": "스핀-궤도 결합 (Spin-Orbit Coupling)", "why_emerged": "전자의 스핀 각운동량과 궤도 각운동량 사이의 상호작용을 설명하기 위해 물리적으로 필수적인 개념입니다.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "밴드 반전, 라시바 효과, 위상 물질"}], "english_summary": ["Targeted FIB cleaving enables high-resolution ARPES on specific orientations of the altermagnet RuO2.", "The study reveals that surface states significantly dominate the observed ARPES spectra.", "Electronic structures are strongly influenced by spin-orbit coupling and surface stoichiometry.", "Results highlight the challenge of disentangling bulk altermagnetic features from surface-specific states."]}}, {"title": "Electronic structure of LuNb6Sn6 probed by high-field torque magnetometry up to 41 T and first-principles calculations", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/3w55-ywgg", "authors": "Tucker Beekmann, Kyryl Shtefiienko, Brenden R. Ortiz, Jiaqiang Yan, David E. Graf, Keshav Shrestha", "last_authors": "David E. Graf, Keshav Shrestha", "summary": "We report the electronic structure of the kagome compound ${\\mathrm{LuNb}}_{6}{\\mathrm{Sn}}_{6}$ usi uperconducting properties.", "Opens new possibilities for studying noncentrosymmetric phases in layered materials."]}}, {"title": "Bulk and surface electronic structure of MoAlB(010)", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/8f14-9n7p", "authors": "Gianmarco Gatti, Amalie H. Svaneborg, Wu Bing, et al.", "last_authors": "Zdenek Sofer, Philip Hofmann", "summary": "The bulk and surface electronic structure of MoAlB(010) is studied by a combination of angle-resolved photoemission spectroscopy and density functional calculations. The observed bulk Fermi-level crossings agree with the previously reported bulk Fermi surface of the material. Additionally, we find s…", "tier": "B_IMPORTANT_CONDMAT", "score": "9", "reason": "Direct ARPES electronic structure study of a material.", "tags": ["experiment", "ARPES", "electronicstructure"], "image": "", "briefing": {"background": "금속 붕화물(borides) 계열은 높은 기계적 강도와 내식성뿐만 아니라 독특한 전자 구조로 인해 기능성 재료로 주목받고 있습니다. MoAlB는 층상 구조를 가진 재료로, 그 전자 구조를 이해하는 것은 물성 제어의 기초가 됩니다.", "motivation": "MoAlB(010) 면의 벌크 및 표면 전자 상태가 실제 실험적으로 어떻게 구현되는지 ARPES와 DFT 계산을 통해 검증하고자 합니다.", "result": "실험적으로 관측된 벌크 페르미 준위 교차점들이 기존에 보고된 DFT 계산 결과와 일치함을 확인하였습니다.", "implication": "이 물질의 전자 구조가 이론적 예측과 잘 맞음을 증명하여, 향후 다른 알루미늄 붕화물 시스템에 대한 전자 구조 연구의 기준점 역할을 합니다.", "novelty": "MoAlB의 (010) 표면에 대한 정밀한 ARPES 측정 자료를 제공하며, 실제 소자 응용을 위한 기초 전자 구조 데이터를 확보했습니다.", "unresolved": "표면 상태와 벌크 상태의 상호작용 및 이로 인한 특정 물리적 특성의 구체적 기원은 추가 연구가 필요합니다.", "future_work": "도핑이나 외부 환경 변화에 따른 전자 구조 변화 연구 및 표면 상태에 대한 좀 더 정밀한 분해능의 ARPES 연구.", "concepts": [{"term": "ARPES", "why_emerged": "고체 내 전자들의 에너지와 운동량 관계를 직접적으로 측정하기 위해 개발됨.", "origin": "1960년대 광전효과 연구에서 발전함.", "connections": "밴드 구조 계산 검증, 페르미 면 측정 등."}, {"term": "MoAlB", "why_emerged": "고온 내구성 및 특정 전자적 특성을 가진 층상 붕화물 연구의 일환.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "MAX 상(phases) 재료군과의 구조적 유사성."}], "english_summary": ["The electronic structure of MoAlB(010) is examined using ARPES and DFT.", "Experimental Fermi surface measurements show good agreement with bulk theoretical calculations.", "This study establishes a baseline for the electronic properties of aluminum diboride-like layered materials."]}}, {"title": "Emergence of robust charge density wave phases in one-dimensional nanostructures of 1T′-phase MoTe2", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/7tjs-mlcw", "authors": "Zi-Yi Han, Liangting Ye, Yu-Qi Li, Ya-Ning Ren, Bing Huang, Lin He", "last_authors": "Bing Huang, Lin He", "summary": "Charge-density waves (CDWs) are a hallmark of collective electronic ordering. As the pioneering and most fundamental model system studied in CDW physics, one-dimensional (1D) CDWs are theoretically profound yet experimentally fragile. They are widely recognized to be highly susceptible to environmen…", "tier": "B_IMPORTANT_CONDMAT", "score": "9", "reason": "Strong interest in CDW and 1D nanostructures of relevant TMD MoTe2.", "tags": ["experiment", "material", "CDW", "TMD"], "image": "", "briefing": {"background": "전하 밀도 파(CDW)는 낮은 차원에서 전자 간의 강한 상관관계에 의해 발생하는 상으로, 1차원 구조에서는 섭동에 매우 취약한 것으로 알려져 있습니다.", "motivation": "일반적으로 불안정한 1차원 CDW가 1T'-MoTe2 나노구조에서 어떻게 강력하게 형성되는지 조사하고자 합니다.", "result": "1T'-MoTe2 나노구조에서 환경적 요인에도 견고한 CDW 상이 존재함을 확인했습니다.", "implication": "저차원 TMD 기반 소자에서 전자 상태를 조절하고 CDW 상을 공학적으로 이용할 수 있는 가능성을 제시합니다.", "novelty": "외부 섭동에 취약한 1차원 CDW가 이 물질에서는 왜 강력하게 유지되는지에 대한 새로운 관점을 제공합니다.", "unresolved": "나노구조화 과정에서 도입되는 격자 변형이나 경계면 효과가 CDW 강건함에 미치는 정확한 기여도는 완전히 밝혀지지 않았습니다.", "future_work": "다양한 크기의 나노구조 및 기판 환경에서의 CDW 안정성 변화 연구.", "concepts": [{"term": "Charge Density Wave", "why_emerged": "전자와 격자 간의 상호작용으로 페르미 면이 재구성되는 현상을 설명하기 위해 필요.", "origin": "Peierls에 의해 1950년대 제안됨.", "connections": "초전도성과의 경쟁 관계, 1D 금속의 불안정성."}, {"term": "1T'-MoTe2", "why_emerged": "위상 절연체 및 TMD 소자로서의 응용 가능성 때문에 주목받음.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "웨일 반금속 특성, 층상 구조 TMD."}], "english_summary": ["Robust CDW phases are observed in 1D 1T nglish_summary": ["The paper introduces 'Surface Altermagnetism' (SAM) in collinear antiferromagnets.", "Theoretical analysis shows that surface symmetry breaking induces spin-polarized states.", "This provides a framework for identifying altermagnetic materials via surface-sensitive probes like ARPES."]}}, {"title": "Nonlinear Optical Probing of Ferroic Octupolar Order Parameter in Collinear Altermagnet", "journal": "PRL_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/h1ht-vsrn", "authors": "P. A. Usachev, R. V. Pisarev, V. V. Pavlov", "last_authors": "R. V. Pisarev, V. V. Pavlov", "summary": "Optical second harmonic generation detects ferroic octupolar order in altermagnetic CoF 2 , establishing nonlinear interactions as signatures of altermagnetism in experiments.", "tier": "B_IMPORTANT_CONDMAT", "score": "9", "reason": "Nonlinear optical detection of octupolar order in CoF2, a key signature of altermagnetism.", "tags": ["experiment", "altermagnetism", "CoF2"], "image": "", "briefing": {"background": "알터마그네티즘(Altermagnetism)은 강자성(순자화)이나 반강자성(스핀 상쇄)으로 분류되지 않는 제3의 자성체로, 스핀이 정렬되어 있으면서도 결정 대칭성에 의해 스핀 분할된 밴드 구조를 가집니다.", "motivation": "알터마그네틱 물질인 CoF2에서 예측된 옥타폴라(octupolar) 오더가 실제 실험적으로 확인될 수 있는지, 그리고 이것이 비선형 광학 반응으로 검출 가능한지 확인하고자 했습니다.", "result": "비선형 광학 제2고조파 발생(SHG) 실험을 통해 CoF2에서 옥타폴라 오더 파라미터를 성공적으로 검출하였습니다.", "implication": "광학적 방법이 알터마그네틱 물질의 복잡한 자기 구조를 규명하는 강력한 탐침이 될 수 있음을 증명했습니다.", "novelty": "알터마그네틱 시스템의 핵심 특징인 스핀 분할 밴드와 대칭성 기반의 오더 파라미터를 비선형 광학으로 직접 추적했다는 점에서 독자분의 전자구조 탐구 방식과 연결됩니다.", "unresolved": "옥타폴라 오더가 구체적으로 물질의 수송 현상이나 전자 구조에 미치는 정량적 영향은 추가 연구가 필요합니다.", "future_work": "다양한 알터마그네틱 후보 물질에서의 비선형 광학 반응 비교 및 외부 섭동에 의한 오더 제어 연구.", "concepts": [{"term": "알터마그네티즘", "why_emerged": "기존 자성 분류 체계로 설명되지 않는 스핀 분할 밴드 현상을 설명하기 위해 제안됨.", "origin": "최근 이론적 체계 확립 (Jungwirth et al., 2022).", "connections": "반강자성체, 강자성체, 스핀-궤도 결합."}, {"term": "제2고조파 발생(SHG)", "why_emerged": "물질 내의 반전 대칭성 깨짐을 민감하게 탐지하기 위해 사용.", "origin": "1961년 Franken et al.에 의해 최초 관측.", "connections": "비선형 광학, ferroicity 탐지."}, {"term": "옥타폴라 오더", "why_emerged": "알터마그네틱 시스템에서 자기 모멘트가 상쇄되어도 유지되는 고차원의 스핀 상관관계를 설명하기 위해 필요.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "다중극자(Multipole) 물리학, 숨겨진 질서(Hidden order)."}], "english_summary": ["Experimental verification of octupolar order in collinear altermagnetic CoF2.", "Used optical second harmonic generation to probe magnetic symmetry.", "Establishes nonlinear optical response as a signature for altermagnetism.", "Demonstrates the power of optical probes in detecting hidden order parameters."]}}, {"title": "Topology, imaging, and emergent phenomena of spin textures", "journal": "Science_Advances", "source": "Gemini", "link": "https://doi.org/10.1126/sciadv.aeg8564", "authors": "Achim Rosch, Christian Pfleiderer, Manfred Fiebig, Xiuzhen Yu, Yoshinori Tokura, Naoto Nagaosa", "last_authors": "Yoshinori Tokura, Naoto Nagaosa", "summary": "Spin textures are magnetic configurations that vary smoothly in space, momentum, or time. This review explores the topology, geometry, dynamics, and imaging of these complex, often noncollinear configurations in magnetic and multiferroic systems, providing a framework for investigating the interplay between local spatial patterns and their global physical properties. A central theme is the role of Berry phases and quantum geometry, which provide a common framework linking topological textures, emergent electrodynamics, charge transport, and magnetically induced ferroelectricity. Spin textures can manifest as stable topological particles, coupling to electrons or magnons via emergent electromagnetic fields. Advanced real-space imaging techniques resolve the internal structure and dynamics of topological textures like magnetic skyrmions or multiferroic domains, enabling the direct observation of their nucleation, motion, and annihilation in both two and three dimensions. In multiferroic systems, spin textures can induce ferroelectricity, and nonlinear optical techniques, such as second-harmonic generation, can resolve the coexisting order parameters in such systems. Last, we examine emergent functionalities of spin textures and multiferroics, such as nonreciprocal transport, and provide an outlook on the technological potential of magnetic textures and their role in exploring the link between topology and magnetism.", "tier": "B_IMPORTANT_CONDMAT", "score": "9", "reason": "Review on topological spin textures, Berry phases, and emergent transport in magnetic and multiferroic systems.", "tags": ["review", "topologicalmaterials", "spintextures", "magnetism", "Berrycurvature", "transport"], "image": "", "briefing": {"background": "자기 구조와 위상수학(topology)이 결합하면 베리 위상과 같은 양자 기하학적 효과가 나타나며, 이는 비전형적인 전기적/열적 수송 현상을 유도합니다.", "motivation": "다양한 자기 텍스처(스카이뮴, 다강체 도메인 등)를 관통하는 통합적인 물리적 프레임워크를 정립하고 최신 이미징 기술의 발전 상황을 정리하고자 했습니다.", "result": "스핀 텍스처, 위상수학, 베리 위상, 그리고 수송 현상 사이의 깊은 연결 고리를 물리적으로 체계화했습니다.", "implication": "위상학적 자성체가 미래 전자 소자의 핵심 플랫폼이 될 것임을 시사합니다.", "novelty": "ARPES/STM 연구자가 다루는 전자 구조와 실공간 스핀 구조 사이의 연결점을 포괄적으로 다루고 있어 연구 배경지식으로 매우 적합합니다.", "unresolved": "이러한 텍스처를 나노미터 스케일에서 실시간으로 제어하는 공학적 난제는 여전히 존재합니다.", "future_work": "스핀 텍스처 기반의 정보 소자 및 토폴로지 양자 연산으로의 응용 연구.", "concepts": [{"term": "베리 위상(Berry Phase)", "why_emerged": "양자 역학적 상태가 파라미터 공간을 따라 변할 때 발생하는 기하학적 위상을 설명하기 위해.", "origin": "1984년 Michael Berry.", "connections": "이상 홀 효과, 위상 부도체, 양자 기하학."}, {"term": "자기 스카이뮴", "why_emerged": "자기 모멘트가 소용돌이 형태로 배열된 위상학적 안정성을 가진 입자 구조를 설명하기 위해.", "origin": "2009년 Muhlbauer et al. 실험적 발견.", "connections": "위상 물리학, 스핀트로닉스."}, {"term": "다강체(Multiferroics)", "why_emerged": "자기적 성질과 전기적 성질이 공존하여 상호 제어 가능한 물질군을 분류하기 위해.", "origin": "2000년대 초반 연구 활성화.", "connections": "스핀-격자 결합, 강유전성."}], "english_summary": ["Review on topological spin textures in magnetic and multiferroic materials.", "Connects Berry phases and quantum geometry to transport phenomena.", "Discusses state-of-the-art real-space imaging for topological structures.", "Highlights the potential for nonreciprocal transport and topological electronics."]}}, {"title": "Ultrafast laser-driven topological phase patterning", "journal": "Science_Advances", "source": "Gemini", "link": "https://doi.org/10.1126/sciadv.aee8907", "authors": "Jianyu Wu, Arthur Niedermayr, Gaolong Cao, Oscar Grånäs, Jonas Weissenrieder", "last_authors": "Oscar Grånäs, Jonas Weissenrieder", "summary": "Microscopic and dynamic control over quantum states is essential for bridging fundamental studies of material properties to device function. Realizing such control at combined high spatial resolution and ultrafast temporal precision remains a major challenge. Here, we demonstrate femtosecond laser-driven patterning of topological quantum states in the Weyl semimetal WTe 2 . By engineering the excitation field into a transient optical grating, we create spatially selective and reversible structural distortions that induce local transitions between topological and topologically trivial states. Using ultrafast transmission electron microscopy, we directly visualize the formation of a periodic Td/1T* heterostructure, observe the propagation of a phase front, and analyze nanoscale confinement of coherently excited optical phonon modes. Our findings establish a platform for all-optical, spatially programmable, and reconfigurable control of quantum states, paving the way for optically addressable topological devices.", "tier": "B_IMPORTANT_CONDMAT", "score": "9", "reason": "Ultrafast laser control and patterning of topological phases in Weyl semimetal WTe2 using advanced microscopy.", "tags": ["topologicalsemimetals", "WTe2", "ultrafastspectroscopy", "materialsengineering", "phasetransition"], "image": "", "briefing": {"background": "Weyl semimetal과 같은 위상 물질은 외부 자극(빛, 압력, 필드)에 의해 그 위상적 성질이 급격히 변할 수 있어, 차세대 스위칭 소자로 주목받고 있습니다.", "motivation": "펨토초 레이저를 사용하여 위상 물질인 WTe2의 구조적 상태를 나노 스케일에서 공간적/시간적으로 프로그래밍할 수 있는지 확인하고자 했습니다.", "result": "레이저 간섭을 이용해 WTe2의 Td 상과 1T* 상을 주기적으로 패턴화하는 데 성공하고, 이를 초고속 투과 전자 현미경으로 시각화했습니다.", "implication": "빛을 이용해 위상학적 성질을 즉각적으로 재설정할 수 있는 '위상학적 소자' 구현의 가능성을 열었습니다.", "novelty": "단순한 초고속 분광학을 넘어, 공간적인 패턴화(Spatial patterning)를 실시간으로 구현했다는 점에서 Floquet 엔지니어링 연구와 맥락을 같이 합니다.", "unresolved": "이러한 패턴이 유지되는 시간적 한계와 장기적인 안정성은 추가 검증이 필요합니다.", "future_work": "광학적으로 프로그래밍 가능한 위상 기반 정보 저장 장치 및 광-위상 스위치 소자 개발.", "concepts": [{"term": "Weyl Semimetal", "why_emerged": "밴드 구조 내에서 축퇴점이 위상학적으로 보호되는 물질을 기술하기 위해.", "origin": "2011년 Wan et al. 이론 예측.", "connections": "위상 부도체, 이상 홀 효과, 페르미 아크."}, {"term": "초고속 투과 전자 현미경(UTEM)", "why_emerged": "나노 스케일 구조 변화를 펨토초 단위의 시간 분해능으로 관찰하기 위해.", "origin": "1990년대 Zewail 등에 의해 개념화.", "connections": "초고속 분광학, 나노 이미징."}, {"term": "위상학적 상태 제어", "why_emerged": "물질의 위상적 성질을 능동적으로 스위칭하여 기능성 소자를 만들기 위해.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "플로케(Floquet) 공학, 구조적 상전이."}], "english_summary": ["Demonstrated femtosecond laser-driven patterning of topological states in WTe2.", "Created transient Td/1T* heterostructures using optical gratings.", "Visualized phase front propagation via ultrafast transmission electron microscopy.", "Establishes a platform for spatially programmable and reconfigurable topological devices."]}}, {"title": "Electrically controllable superconducting memory effect in UTe2", "journal": "Nature", "source": "Gemini", "link": "https://www.nature.com/articles/s41586-026-11015-3", "authors": "Zheyu Wu, Hanyi Chen, Mengmeng Long, et al.", "last_authors": "F. Malte Grosche, Alexander G. Eaton", "summary": "Observations of a memory effect in the p-wave superconductor candidate UTe2, which can be controlled by varying the strength and duration of the electrically applied stimuli, are described.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Relevant study on UTe2, a key unconventional/topological superconductor candidate.", "tags": ["UTe2", "superconductivity", "memoryeffect"], "image": "https://media.springernature.com/m685/springer-static/image/art%3A10.1038%2Fs41586-026-11015-3/MediaObjects/41586_2026_11015_Fig1_HTML.png", "briefing": {"background": "UTe2는 강한 전자 상관관계와 위상 초전도 후보 물질로 주목받으며, 스핀 삼중항(triplet) 초전도 가능성 및 복잡한 자기적 성질로 인해 현대 응집물질물리학의 중요한 연구 대상입니다.", "motivation": "UTe2의 초전도 상태가 외부 전기적 자극(전류/전압)에 의해 어떻게 변화하고, 이 변화가 메모리 효과로 이어질 수 있는지 확인하고자 함.", "result": "UTe2에서 인가된 전기적 자극의 강도와 시간에 따라 초전도 상태가 가역적으로 제어되는 메모리 효과를 관측함.", "implication": "위상 양자 컴퓨팅 소자나 비휘발성 양자 메모리 응용을 위한 기초 물리 현상으로서 초전도 상태 제어의 가능성을 제시함.", "novelty": "강상관 위상 초전도체에서 전기적 자극을 통한 상태 제어(Memory effect)를 성공적으로 시연하여 제어 가능성을 입증함.", "unresolved": "이 메모리 효과의 미시적 기원(예: 도메인 벽, 격자 결함, 혹은 국소 자기 구조의 재배열)은 아직 불분명함.", "future_work": "메모리 효과의 근본 원인을 규명하기 위한 국소 프로브 측정(STM/STS 등)과 자기장 의존성 연구가 필요함.", "concepts": [{"term": "p-wave superconductivity", "why_emerged": "기존 s-wave 초전도체와 달리 스핀 삼중항 상태를 가질 가능성이 높고, 위상 초전도체의 핵심 성질인 마요라나 페르미온을 호스팅할 수 있기 때문.", "origin": "Leggett (1975), Balian-Werthamer (1963) 등이 3He 초유체 관련 연구에서 확립.", "connections": "Sr2RuO4 연구, 위상 양자 컴퓨팅, 비전통적 초전도체 분류와 밀접함."}], "english_summary": ["Observed an electrically controllable memory effect in UTe2.", "The superconducting state responds to the magnitude and duration of electrical stimuli.", "Suggests potential for active control of topological superconducting phases.", "Requires further investigation into the microscopic origins of this memory phenomenon."]}}, {"title": "Checkerboard-type Zhang-Rice states in overdoped cuprate superconductors", "journal": "Nature_Communications", "source": "Gemini", "link": "https://www.nature.com/articles/s41467-026-77985-0", "authors": "Xiongfang Liu, Kun Han, Yan Peng, et al.", "last_authors": "Mi Jiang, Xinmao Yin", "summary": "In cuprate superconductors, the overdoped regime has received comparatively limited attention. Here, broadband optical spectroscopy and DQMC calculations reveal an electronic reconstruction in LSCO beyond x > 0.2, consistent with a checkerboard Zhang–Rice configuration hosting coexisting localized and itinerant carriers.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Investigates electronic reconstruction and Zhang-Rice states in cuprates, highly relevant to correlated systems.", "tags": ["material:LSCO", "topic:cuprates", "method:opticalspectroscopy"], "image": "https://pubads.g.doubleclick.net/gampad/ad?iu=/285/nature_communications/article&sz=728x90&c=-942511710&t=pos%3Dtop%26type%3Darticle%26artid%3Ds41467-026-77985-0%26doi%3D10.1038/s41467-026-77985-0%26techmeta%3D122,128,132,145%26subjmeta%3D1003,119,301,639,766,995%26kwrd%3DElectronic+properties+and+materials,Superconducting+properties+and+materials", "briefing": {"background": "구리 산화물(Cuprates)은 고온 초전도성을 나타내지만, 과도핑(overdoped) 영역의 전자 구조와 페르미 액체로의 전이 과정은 여전히 복잡한 미스터리로 남아있음.", "motivation": "과도핑된 LSCO에서 나타나는 전자 구조 변화를 광학 분광법과 수치 계산을 통해 규명하고 장-라이스(Zhang-Rice) 상태와의 관련성을 확인하고자 함.", "result": "x > 0.2 영역에서 체커보드 패턴의 장-라이스 상태와 국소적/유동적 캐리어가 공존하는 전자적 재구조화를 발견함.", "implication": "과도핑 영역에서의 전자 구조가 단순히 단순한 페르미 액체가 아니라, 공간적으로 불균일한 복합 상태임을 시사함.", "novelty": "잘 알려지지 않았던 과도핑 영역에서 새로운 전자 질서(체커보드 질서)를 광학적으로 포착함.", "unresolved": "이 체커보드 재구조화가 초전도성 저하와 어떻게 연결되는지, 혹은 다른 경쟁적 질서와 어떤 연관이 있는지는 추가 연구가 필요함.", "future_work": "다른 도핑 및 다른 구리 산화물 계열에서의 유사성 확인을 위한 ARPES 및 STS 분석 필요.", "concepts": [{"term": "Zhang-Rice singlet", "why_emerged": "구리 산화물에서 Cu 3d 궤도와 O 2p 궤도 사이의 강력한 혼성화를 설명하기 위해 도입.", "origin": "Zhang and Rice (1988)에 의해 제안됨.", "connections": "Hubbard 모델, 구리 산화물의 저에너지 물리, Mott 절연체 연구와 연결."}, {"term": "DQMC", "why_emerged": "강상관 전자계에서 격자 모델을 비섭동적으로 해결하기 위해 고안됨.", "origin": "Blankenbecler, Scalapino, Sugar (1981) 등이 확립.", "connections": "Hubbard 모델 계산, 강상관 이론 물리학의 핵심 계산 도구."}], "english_summary": ["Investigated overdoped LSCO using optical spectroscopy and DQMC.", "Identified electronic reconstruction in the x > 0.2 regime.", "Reveals a checkerboard-type Zhang-Rice configuration.", "Demonstrates coexistence of itinerant and localized electronic behaviors."]}}, {"title": "Anisotropic magnons in the layered honeycomb ferromagnet CrSiTe3", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/c7bd-ghcb", "authors": "T. J. Williams, D. L. Abernathy, M. D. Lumsden, J.-Q. Yan, A. D. Christianson", "last_authors": "J.-Q. Yan, A. D. Christianson", "summary": "Recent experimental and theoretical studies have suggested a possible Dirac magnon gap in the two-dimensional ferromagnetic semiconductor CrSiTe 3 . Detailed neutron scattering measurements were performed to shed light on the existence of the magnon gap, and suggest that the gap is very small or nonexistent, with previous measurements being complicated by experimental factors. During these measurements, it was found that the out-of-plane couplings could explain the usual property of the increase in the magnetic transition temperature when CrSiTe 3 is exfoliated to monolayers. Furthermore, the material was shown to have anisotropic magnons along the out-of-plane direction, through the proposed Dirac point. We speculate that this is due to an exchange anisotropy, though Kitaev-like interactions alone cannot explain the spectra.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Neutron scattering on a 2D ferromagnet investigating potential Dirac magnons.", "tags": ["experiment", "material", "neutronscattering", "magnons"], "image": "", "briefing": {"background": "CrSiTe3와 같은 2D 자성체는 층상 구조에서 나타나는 자기적 이방성과 Dirac 마그논의 존재 여부로 인해 위상 자성 연구의 핵심 물질임.", "motivation": "이전 연구에서 보고된 CrSiTe3의 Dirac 마그논 갭의 실체를 확인하고 층간 결합의 영향을 명확히 규명하고자 함.", "result": "기존의 마그논 갭 보고는 실험적 요인에 의한 오류일 가능성이 높으며, 사실상 갭이 없거나 매우 작음. 또한 면외 결합이 2D 박리 시 전이 온도 변화를 설명함을 밝힘.", "implication": "2D 자성체에서 마그논 스펙트럼 해석 시 면외 결합과 실험적 노이즈를 더 정밀하게 고려해야 함을 경고함.", "novelty": "논란이 되었던 Dirac 마그논 갭의 유무를 재정의하고, 층상 구조 물질의 자기적 이방성에 대한 새로운 물리적 통찰을 제공함.", "unresolved": "Kitaev-like 상호작용만으로는 설명되지 않는 복잡한 이방성의 정확한 미시적 메커니즘은 여전히 숙제임.", "future_work": "보다 정밀한 비탄성 중성자 산란 및 이론적 모델링(교환 이방성 분석) 보강.", "concepts": [{"term": "Dirac magnons", "why_emerged": "벌집 격자 자성체에서 에너지 분산 관계가 Dirac 점을 지날 때 발생하는 위상 자성 준입자를 연구하기 위해 도입.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "그래핀의 Dirac 페르미온, 위상 자성체, Kitaev 물질."}, {"term": "Kitaev interactions", "why_emerged": "강한 스핀-궤도 결합이 있는 벌집 격자 물질에서 스핀 방향에 의존하는 결합 모델로 도입.", "origin": "Kitaev (2006)에 의해 제안.", "connections": "양자 스핀 액체, 벌집 격자 이리데이트, 2D 자성체."}], "english_summary": ["Neutron scattering study on CrSiTe3 refutes previous Dirac magnon gap findings.", "Determines the magnon gap is negligible or absent.", "Out-of-plane coupling explains transition temperature shifts in exfoliated monolayers.", "Exchange anisotropy is required to describe the observed magnon dispersion."]}}, {"title": "From perovskite to infinite-layer nickelates: Hole concentration from x-ray absorption", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/qc3z-k45l", "authors": "R. Pons, M. Flavenot, K. Fürsich, et al.", "last_authors": "D. Preziosi, E. Benckiser", "summary": "The difficulty of determining cation concentrations and oxygen stoichiometry in infinite-layer nickelate thin films has so far prevented clear experimental identification of the nickel electron configuration in the superconducting phase. We used soft x-ray absorption spectroscopy to study the successive changes in PrNiO x thin films at various intermediate stages of topotactic reduction with x = 2 – 3 . By comparing the Ni L -edge spectra to single- and double-cluster ligand-field calculations, we find that none of our samples exhibits a pure d 9 configuration. Our quantitative analysis using the charge sum rule shows that even when films are maximally reduced, the spatially averaged number of nickel 3 d holes is 1.38. Superconducting samples have even higher values, calling into question the previously assumed limit of hole doping. Concomitant changes in the oxygen K -edge absorption spectra upon reduction indicate the presence of oxygen 2 p holes, even in the most reduced films. Overall, our results suggest a complex interplay of hole-doping mechanisms resulting from self-doping effects, structural defects, and oxygen nonstoichiometry.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "X-ray absorption study of electronic structure and hole doping in superconducting nickelates.", "tags": ["material", "nickelates", "XAS"], "image": "", "briefing": {"background": "무한층(infinite-layer) 니켈레이트는 구리 산화물 초전도체와 유사한 전자 구조를 가져 고온 초전도 메커니즘을 규명할 핵심 후보로 주목받고 있습니다.", "motivation": "기존 연구에서는 무한층 니켈레이트의 환원 과정 중 산소 화학양론과 니켈의 전자가 구성을 정확히 측정하지 못해 초전도상에서의 전자 상태에 대한 논란이 있었습니다.", "result": "연 X선 흡수 분광법(XAS) 결과, 가장 많이 환원된 샘플에서도 니켈 3d 정공 수가 1.38로 순수한 d9 상태가 아니며, 초전도 샘플은 정공 농도가 더 높음이 확인되었습니다. 또한 산소 2p 정공의 존재를 통해 스스로 도핑(self-doping) 효과가 중요함을 입증했습니다.", "implication": "초전도 무한층 니켈레이트가 단순한 d9 시스템이라는 기존 가정을 재검토해야 하며, 구조적 결함과 산소 비화학양론이 전자 구조에 미치는 복잡한 영향을 고려해야 합니다.", "novelty": "실험적으로 접근하기 어려운 박막의 환원 단계를 정량 분석하여, 도핑 메커니즘이 단순하지 않음을 밝힌 점이 독창적입니다.", "unresolved": "왜 초전도 현상이 특정 도핑 영역에서만 나타나는지에 대한 정확한 전자적 메커니즘은 여전히 불분명합니다.", "future_work": "샘플 품질 개선을 통한 산소 정공 제어 실험과, 더 정밀한 전자 구조 계산을 통한 도핑 상태와 초전도성 간의 상관관계 연구가 필요합니다.", "concepts": [{"term": "Infinite-layer nickelate", "why_emerged": "구리 산화물 초전도체의 d9 전자 배치와 유사한 물질을 구현하여 고온 초전도의 범용성을 입증하기 위해 설계됨.", "origin": "2019년 Stanford 그룹(Hwang, Cui 등)에 의해 NdNiO2에서 초전도성이 처음 보고됨.", "connections": "cuprates, nickelates, correlated electron systems"}, {"term": "Charge sum rule", "why_emerged": "XAS 스펙트럼의 적분값을 통해 시스템 내의 정공 농도를 정량적으로 추정하기 위해 사용됨.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "XAS, electronic structure"}], "english_summary": ["Infinite-layer nickelates do not exhibit a pure d9 electronic configuration.", "Soft X-ray absorption spectroscopy reveals significant oxygen 2p hole contributions.", "Higher nickel 3d hole concentrations are observed in superconducting thin films.", "Self-doping and oxygen stoichiometry play crucial roles in the electronic state."]}}, {"title": "Magneto-optical response of five-septuple-layer MnBi2Te4 in spin-flip states", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/33km-cp5r", "authors": "Shahid Sattar, Roman Stepanov, A. H. MacDonald, C. M. Canali", "last_authors": "A. H. MacDonald, C. M. Canali", "summary": "Magneto-optical (MO) effects like Kerr and Faraday rotations provide a direct probe of topological order in thin films of the magnetic topological insulator (TI) MnBi 2 Te 4 (MBT). Motivated by recent experimental studies of spin-flip/flop transitions in MBT thin films, we investigate the interplay between interlayer spin configurations, topological order, and MO response in five septuple-layer (5-SL) MBT using first-principles calculations and a simplified coupled Dirac cone model. Our results reveal that, despite possessing a nonzero out-of-plane magnetization, 5-SL MBT thin films can be either C = + 1 TIs or C = 0 topologically trivial insulators depending on the relative spin orientations of the top and bottom SLs. We evaluate the Faraday and Kerr rotation angles using tight-binding models derived from calculations and by comparing our results with those of a simplified coupled Dirac cone model to clarify the macroscopic mechanisms underlying the MO response of spin-flip states. These theoretical findings highlight the tunability of topological and MO properties in MBT thin films and provide microscopic insight into the emergence of complex topological order in layered antiferromagnetic materials.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Experimental-aligned study of magnetic topological insulators.", "tags": ["experiment", "topologicalinsulator", "magneto-optical"], "image": "", "briefing": {"background": "자기 위상 절연체(Magnetic TI)인 MnBi2Te4는 층간 자기 정렬에 따라 위상적 성질이 급격히 변하며, 이는 양자 비정상 홀 효과 등을 구현하는 데 핵심적입니다.", "motivation": "최근 5-SL MnBi2Te4 박막에서 관찰된 스핀-플립/플롭 전이 시, 위상적 상태가 어떻게 변하고 이것이 광학적 반응에 어떻게 나타나는지 규명하고자 함.", "result": "5-SL MBT 박막은 자기 정렬 상태에 따라 위상적 자명(trivial) 상태와 위상 비자명(C=1) 상태를 넘나듭니다. 이를 간단한 Dirac cone 결합 모델과 제일원리 계산으로 설명했습니다.", "implication": "자기 정렬을 제어함으로써 박막의 위상적 성질과 광학 반응을 능동적으로 튜닝할 수 있는 가능성을 제시합니다.", "nove ivity.", "These results offer critical insights into the optimization of nickelate-based superconducting thin films."]}}, {"title": "Giant Domain Walls and Intrinsic Heterogeneity in 214 Cuprate Superconductors", "journal": "PRL_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/r62x-kt5j", "authors": "Evie Ladbrook, Jon P. Wright, Mark S. Senn", "last_authors": "Jon P. Wright, Mark S. Senn", "summary": "Structural phase transitions generate complex microstructures that often govern material functionality, yet directly resolving their three-dimensional organization in bulk samples remains challenging. Here we employ scanning three-dimensional x-ray diffraction (3DXRD) to resolve the bulk microstructure of La 1.675 Eu 0.2 Sr 0.125 CuO 4 , a prototypical 1 / 8 -doped cuprate in which structural and electronic heterogeneity is well established. We reveal remarkably broad tetragonallike domain wall regions within the nominally orthorhombic crystal structure, and, upon cooling to 100 K, a fine microstructure of orthorhombiclike stripes embedded within the tetragonal matrix that has significant consequences for interpreting the interplay between structural and electronic heterogeneity in this class of materials. More broadly, this work establishes 3DXRD as a powerful approach for resolving bulk microstructures and understanding their role in emergent functionality.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Experimental study of microstructures in cuprate superconductors, relevant to unconventional superconductivity.", "tags": ["superconductivity", "cuprates", "experiment", "x-raydiffraction", "structuralproperties"], "image": "", "briefing": {"background": "214 Cuprate(LSCO 계열)와 같은 초전도체에서 전하 밀도 파(CDW)와 구조적 불균일성은 전자의 얽힘과 비통상적 초전도성을 이해하는 핵심 요소입니다.", "motivation": "벌크 시료 내부의 3차원적 미세구조가 전자 상태에 미치는 영향을 직접 해석하기 위해 고해상도 구조 분석 기법을 적용했습니다.", "result": "La1.675Eu0.2Sr0.125CuO4 내의 도메인 벽과 스트라이프(stripe) 구조를 3DXRD로 시각화하여, 구조적 이질성이 전자적 이질성과 깊게 연관됨을 증명했 ": "Mechanical sensing of magnetic phase transitions and metamagnetic tricriticality in 2D CrI3.", "tags": ["experiment", "CrI3", "2Dmagnetism"], "image": "", "briefing": {"background": "2D 자성 물질은 층간 자기적 결합과 Ising 이방성으로 인해 3차원 물질과는 다른 풍부한 자기 상전이와 임계 현상을 보입니다.", "motivation": "층상 Ising 메타자성체인 CrI3에서 메타자기적 삼중점(metamagnetic tricriticality)을 감지하기 위한 민감한 측정 방법의 필요성이 제기되었습니다.", "result": "물리적 압력 및 변형률(mechanical sensing)을 통해 CrI3의 자기적 상태 변화와 삼중점 부근의 임계 거동을 정밀하게 탐지했습니다.", "implication": "자기 상전이가 발생하는 2D 물질에서 구조적·기계적 상태 변화가 어떻게 자성을 제어하는지 이해하는 새로운 길을 열었습니다.", "novelty": "기존 자기장 의존 측정 외에 기계적 센싱 기술을 2D 메타자성체에 성공적으로 적용하여 상전이의 상세한 물리적 성질을 규명했습니다.", "unresolved": "실제 소자 구현 시 나타날 수 있는 기판-물질 간 상호작용 및 비균질한 변형률 분포의 영향.", "future_work": "다양한 2D 자성체에 대한 변형률 제어 자기 상전이 연구 및 관련 스핀트로닉스 소자 개발.", "concepts": [{"term": "Metamagnetism", "why_emerged": "외부 자기장에 의해 반강자성 상태에서 강자성 상태로 갑작스러운 상전이를 보이는 물질을 기술하기 위해 필요했습니다.", "origin": "L. Neel (1930년대).", "connections": "자성 상전이, 상전이 임계 현상."}, {"term": "Tricriticality", "why_emerged": "2차 상전이선과 1차 상전이선이 만나는 지점을 구분하기 위해 열역학적으로 정의되었습니다.", "origin": "R.B. Griffiths (1970).", "connections": "Landau 이론, 자기 정렬 연구."}], "english_summary": ["Experimental investigation of metamagnetic tricriticality in CrI3.", "Demonstrates mechanical sensing as a probe for magnetic phase transitions in 2D Ising metamagnets.", "Reveals the interplay between structural deformation and magnetism."]}}, {"title": "Phonons Reflect Dynamic Spin-State Order in LaCoO3", "journal": "PRL_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/tsw6-sdhk", "authors": "Alsu Ivashko, Taishun Manjo, Maximilian Kauth, et al.", "last_authors": "Alfred Q. R. Baron, Frank Weber", "summary": "We investigate lattice dynamics in LaCoO 3 using inelastic neutron and x-ray scattering over T = 2 − 6 5 0 K , spanning the spin-state crossover at T 1 ≈ 1 0 0 K and the insulator-metal transition at T 2 ≈ 5 5 0 K . Comparison with quasiharmonic lattice-dynamical calculations helps reveal anomalous softening of a ≈ 1 0 − meV oxygen phonon, confined to the temperature interval T 1 ≤ T ≤ T 2 and localized in momentum space at q SSO = ( ½ , ½ , ½ ) c . This wave vector is characteristic of the spin-state-ordering pattern originally proposed by Goodenough [An interpretation of the magnetic properties of the perovskite-type mixed crystals La 1 − x Sr x CoO 3 − λ , ]. Our results provide momentum-resolved evidence for dynamic correlations of high-spin and low-spin Co 3 + states characterized by q SSO = ( ½ , ½ , ½ ) c , demonstrating that phonons are sensitive probes of fluctuating spin-state correlations in LaCoO 3 .", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Neutron and X-ray scattering study of spin-state and lattice dynamics in correlated LaCoO3.", "tags": ["experiment", "LaCoO3", "correlatedelectrons"], "image": "", "briefing": {"background": "LaCoO3는 온도에 따라 코발트 이온의 스핀 상태(Low-spin/High-spin)가 변화하며 절연체-금속 전이를 보이는 대표적인 강상관 전자계 물질입니다.", "motivation": "스핀 상태 변화와 동적인 스핀 상태 정렬(spin-state order)이 격자 역학(phonons)에 미치는 영향을 규명하고자 했습니다.", "result": "비탄성 중성자 및 X-선 산란을 통해 약 10-meV 에너지 영역의 산소 포논이 특정 온도 구간에서 비정상적으로 연화(softening)됨을 발견했습니다.", "implication": "이 연화된 포논 모드는 스핀 상태 정렬 패턴과 강하게 결합되어 있으며, 격자 동역학이 복잡한 스핀 상태 변화를 감지하는 민감한 탐침(probe)이 될 수 있음을 입증했습니다.", "novelty": "Goodenough가 제안했던 스핀 상태 정렬을 운동량 분해 측정(momentum-resolved)을 통해 동적으로 확인했다는 점이 핵심입니다.", "unresolved": "이러한 동적 스핀 상태 정렬이 금속-절연체 전이의 직접적인 원인인지, 혹은 부산물인지에 대한 명확한 인과관계.", "future_work": "온도 변화에 따른 스핀 상태의 동적 상관관계에 대한 더욱 정밀한 이론적 모델링 및 전산 모사.", "concepts": [{"term": "Spin-state Crossover", "why_emerged": "코발트 이온이 온도에 따라 고스핀과 저스핀 상태 사이를 오가는 현상을 설명하기 위해 제안되었습니다.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "전이금속 산화물, 금속-절연체 전이."}, {"term": "Phonon Softening", "why_emerged": "격자 구조의 불안정성이나 상전이 근처에서의 구조적 변화를 기술하기 위해 도입되었습니다.", "origin": "W. Cochran (1960).", "connections": "강유전성, 구조 상전이, 초전도체."}], "english_summary": ["Study of lattice dynamics in LaCoO3 across spin-state and insulator-metal transitions.", "Identifies anomalous oxygen phonon softening linked to dynamic spin-state ordering at (1/2, 1/2, 1/2).", "Confirms that phonons serve as a sensitive probe for fluctuating spin-state correlations."]}}, {"title": "Thermodynamic Evidence of Tetracritical Topology in the H−T Phase Diagram of UTe2 for H∥b", "journal": "PRL_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/1l46-jbm6", "authors": "Michal Vališka, Tetiana Haidamak, Andrej Cabala, et al.", "last_authors": "Andreas Hauspurg, Sergei Zherlitsyn", "summary": "We report ultrasound velocity measurements on an ultraclean ${\\mathrm{UTe}}_{2}$ single crystal with ${T}_{c}>2\\text{ }\\text{ }\\mathrm{K}$ for $H∥b$, performed up to 18 T and down to 0.33 K. The measurements provide the missing bulk thermodynamic evidence for an additional high-field phase bounda…", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Bulk thermodynamic evidence for additional phase boundaries in the topological superconductor candidate UTe2.", "tags": ["material", "UTe2", "topological-superconductivity"], "image": "", "briefing": {"background": "UTe2는 위상 초전도체 후보 물질로, 특히 스핀-삼중항(spin-triplet) 페어링과 관련하여 강한 상관관계를 가진 초전도 현상을 연구하는 중요한 플랫폼입니다.", "motivation": "UTe2의 자기장-온도(H-T) 상도 내에서 관측되는 복잡한 상 경계들이 실제 벌크 열역학적 상태인지, 혹은 시료의 불균일성에 의한 것인지 명확히 할 필요가 있었습니다.", "result": "초음파 속도 측정을 통해 자기장 H∥b 방향에서 기존의 상 경계 외에 추가적인 고자기장 상 경계를 발견하여, UTe2가 테트라-임계점(tetracritical point)을 포함한 복잡한 상도 위상을 가짐을 열역학적으로 입증했습니다.", "implication": "이 결과는 UTe2의 초전도 상태가 단순하지 않으며, 자기장 하에서 경쟁하는 여러 오더 파라미터(order parameter) 또는 위상 전이가 존재함을 시사합니다.", "novelty": "기존의 전기적 측정이나 NMR보다 더욱 직접적인 벌크 열역학 증거를 제시하였으며, UTe2 연구의 핵심인 초전도 메커니즘 해석에 중요한 이정표가 됩니다.", "unresolved": "테트라-임계점 주변의 정확한 대칭성 변화와 각각의 상이 가지는 구체적인 위상적 성질은 여전히 규명되어야 합니다.", "future_work": "다른 결정 방향에 대한 초음파 연구 및 특정 자기장 구간에서의 공명 비탄성 X선 산란(RIXS) 실험을 통해 전자 구조와 자기적 스핀 상태 변화를 직접 관찰할 필요가 있습니다.", "concepts": [{"term": "Tetracritical Topology", "why_emerged": "두 개 이상의 상 경계가 교차하거나 만나는 특이한 위상학적 구조를 기술하기 위해 필요합니다.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "다중 위상 전이 이론, Ginzburg-Landau 다중 오더 파라미터 이론과 연결됩니다."}, {"term": "Spin-triplet superconductivity", "why_emerged": "시간 반전 대칭성이 깨진 상태에서 스핀이 평행한 전자쌍이 형성되는 현상을 설명하기 위해 도입되었습니다.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "Topological superconductors, Majorana bound states와 관련 깊음."}], "english_summary": ["Ultraclean UTe2 single crystals are studied under high magnetic fields using ultrasound velocity measurements.", "Evidence for an additional high-field phase boundary for H||b is provided.", "The result suggests a tetracritical point in the H-T phase diagram, supporting complex superconducting order parameters.", "This provides crucial bulk thermodynamic validation for the existence of multiple topological superconducting phases in UTe2."]}}, {"title": "Topological Flat Bands and Fractional Chern Insulators in Rashba Systems with Tunable Superlattice Potentials", "journal": "PRL_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/z4g8-2kwj", "authors": "Bokai Liang, Wei Qin, Zhenyu Zhang", "last_authors": "Wei Qin, Zhenyu Zhang", "summary": "Fractional Chern insulators are interaction-driven topological states that realize the lattice analog of the fractional quantum Hall effect without external magnetic fields. Here we propose a programmable platform for engineering topological flat bands by combining a Zeeman field with a tunable elec…", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Proposes experimental platform for fractional Chern insulators and topological flat bands, highly relevant theory.", "tags": ["theory", "topologicalmaterials", "flatbands", "fractionalquantumHall", "Rashbasystems", "superlattice"], "image": "", "briefing": {"background": "분수 양자 홀 효과(FQHE)는 강한 자기장이 필요한 현상이지만, 분수 천 절연체(Fractional Chern Insulator, FCI)는 외부 자기장 없이 결정 격자 내 상호작용으로 유사한 위상 상태를 구현하려는 연구 분야입니다.", "motivation": "임의의 자기장 없이도 위상학적 평탄 밴드(flat bands)를 실험적으로 구현하고, 이를 통해 FCI 상태를 효율적으로 제어할 수 있는 플랫폼을 설계하고자 했습니다.", "result": "라쉬바(Rashba) 시스템에 제이만(Zeeman) 필장과 조정 가능한 초격자(superlattice) 전위를 결합하여 위상학적 평탄 밴드를 공학적으로 생성하는 방법을 제안했습니다.", "implication": "이 이론은 고온에서 FCI 상태를 실현하거나, 위상학적 양자 정보를 다루기 위한 새로운 실험적 플랫폼을 제공할 수 있습니다.", "novelty": "외부 자기장 없이도 위상학적 특성을 유지하는 평탄 밴드 제어 모델을 제시하였으며, 이는 무아레(moire) 시스템이나 VdW 헤테로구조를 연구하는 물리 연구자에게 중요한 영감을 줍니다.", "unresolved": "실제 실험적으로 이 초격자 전위를 얼마나 정교하게 제어할 수 있을지와 FCI의 안정성을 결정하는 밴드갭의 크기가 핵심 과제입니다.", "future_work": "실제 재료 조합(예: VdW 헤테로 구조)을 활용하여 제안된 모델을 시뮬레이션하고 광학적 또는 STM 실험으로 확인하는 연구가 이어져야 합니다.", "concepts": [{"term": "Fractional Chern Insulator (FCI)", "why_emerged": "자기장이 없는 환경에서 양자 홀 효과의 물리학적 현상을 격자 모델에서 재현하고자 제안되었습니다.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "Fractional Quantum Hall Effect, Topological Flat Bands."}, {"term": "Rashba system", "why_emerged": "구조적 반전 대칭성 깨짐에 의한 스핀-궤도 결합을 설명하기 위해 도입되었습니다.", "origin": "Emmanuel Rashba (1960s)", "connections": "Spintronics, Topological insulators."}], "english_summary": ["The paper proposes a programmable platform for creating topological flat bands.", "By combining Rashba coupling, Zeeman fields, and superlattice potentials, FCI states can be realized without external magnetic fields.", "This approach bridges the gap between lattice models and experimental realization of fractional topological phases.", "It provides a roadmap for engineering exotic topological states in 2D heterostructures."]}}, {"title": "Unconventional Anisotropic Charge Dynamics in Bulk 1T−TaS2 Induced by Interlayer Dimerization", "journal": "PRL_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/pwzn-m4d2", "authors": "Achyut Tiwari, Maxim Wenzel, R. Mathew Roy, Christian Prange, Bruno Gompf, Martin Dressel", "last_authors": "Bruno Gompf, Martin Dressel", "summary": "A Peierls-like interlayer instability establishes stacking as a tuning parameter for hidden, metastable phases in van der Waals quantum materials.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Investigation of interlayer instability and CDW phases in the classic vdW material 1T-TaS2.", "tags": ["material", "van-der-waals", "CDW"], "image": "", "briefing": {"background": "1T-TaS2는 층상 구조 물질로, 전하 밀도 파(CDW)와 강한 전자 상관관계가 복합적으로 얽혀 있는 대표적인 반데르발스(VdW) 물질입니다.", "motivation": "1T-TaS2의 층간 구조 변화가 어떻게 전자 상태의 불안정성을 유도하고, 물질 내 숨겨진 준안정 상들을 제어할 수 있는지 규명하고자 했습니다.", "result": "층간 이량체화(interlayer dimerization)가 Peierls 불안정성과 유사한 메커니즘으로 작용하여, 물질의 전하 동역학을 비등방적으로 변화시키고 숨겨진 상들을 안정화함을 확인했습니다.", "implication": "VdW 물질에서 층간 적층 구조(stacking)가 단순한 물리적 구조를 넘어 전자 상을 제어하는 핵심 자유도(tuning parameter)임을 보여줍니다.", "novelty": "기존의 단일층 연구 중심에서 층간 상호작용의 중요성을 극대화하여 VdW 양자 물질의 새로운 조작 가능성을 제시하였습니다.", "unresolved": "이 층간 이량체화가 유도하는 특정 준안정 상의 정확한 전자 구조(예: 페르미 표면의 변화)는 추가적인 분해능 실험이 필요합니다.", "future_work": "ARPES나 STM을 통해 층간 이량체화가 전하 밀도 파의 공간적 분포와 대칭성에 미치는 영향을 직접 관찰하는 후속 연구가 유망합니다.", "concepts": [{"term": "Peierls instability", "why_emerged": "저차원 금속 시스템에서 격자 왜곡을 통해 에너지 밴드갭을 형성하는 현상을 설명하기 위해 도입되었습니다.", "origin": "Rudolf Peierls (1955)", "connections": "Charge Density Waves, Electron-phonon coupling."}, {"term": "Interlayer dimerization", "why_emerged": "층상 물질에서 인접한 층 사이의 결합 변화가 전자 상태에 미치는 영향을 기술하기 위해 필요합니다.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "VdW stacking engineering, Phase transition."}], "english_summary": ["The study investigates 1T-TaS2 to understand the role of interlayer instabilities.", "Interlayer dimerization is identified as a key mechanism for tuning metastable phases in this VdW material.", "This instability exhibits Peierls-like characteristics, leading to unconventional anisotropic charge dynamics.", "The results highlight the importance of interlayer coupling as a control parameter for quantum material phases."]}}, {"title": "RIXS observation of bond-directional excitations in the Kitaev material Na2IrO3", "journal": "npj_QuantumMaterials", "source": "Gemini", "link": "https://www.nature.com/articles/s41535-026-00938-9", "authors": "Marco Magnaterra, Karolin Hopfer, Christoph J. Sahle, et al.", "last_authors": "Jeroen van den Brink, Markus Grüninger", "summary": "RIXS observation of bond-directional excitations in the Kitaev material Na 2 IrO 3", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "High-impact RIXS measurement on a prominent Kitaev quantum material.", "tags": ["RIXS", "material", "Kitaev"], "image": "https://pubads.g.doubleclick.net/gampad/ad?iu=/285/npjquantmats.nature.com/article&sz=728x90&c=773504914&t=pos%3Dtop%26type%3Darticle%26artid%3Ds41535-026-00938-9%26doi%3D10.1038/s41535-026-00938-9%26subjmeta%3D301,638,639,766%26kwrd%3DChemistry,Materials+science,Physics", "briefing": {"background": "Kitaev 자성 물질은 얽힌 스핀 연산자가 결합된 벌집 격자 모델에서 양자 스핀 액체 상태를 구현할 후보로 주목받고 있습니다.", "motivation": "Na2IrO3에서의 본드 방향(bond-directional) 상호작용은 이론적으로 제안되었으나, 이를 직접적인 분광학적 방법으로 확인하려는 시도가 필요했습니다.", "result": "RIXS(공명 비탄성 X선 산란)를 통해 Na2IrO3의 격자 내 본드 방향성 들뜸(excitation)을 실험적으로 관측했습니다.", "implication": "이론적 모델인 Kitaev 물리학이 실제 물질 내에서 어떻게 발현되는지에 대한 직접적인 증거를 제공합니다.", "novelty": "RIXS 기술을 활용해 정교한 양자 자성 상호작용을 분해해낸 연구로, 강상관 전자계 및 스핀 물리학 연구자에게 중요한 실험적 레퍼런스가 됩니다.", "unresolved": "관측된 들뜸이 순수한 Kitaev 상호작용만으로 설명되는지, 혹은 다른 비등방성 교환 상호작용이 기여하는지에 대한 상세 분석이 추가로 필요합니다.", "future_work": "온도 의존성 연구 및 압력/자기장 환경에서의 들뜸 변화를 추적하여 양자 스핀 액체 후보군으로서의 특성을 추가 검증할 예정입니다.", "concepts": [{"term": "Kitaev model", "why_emerged": "양자 스핀 액체의 정확한 해를 구하기 위해 제안된 2차원 벌집 격자 모델입니다.", "origin": "Alexei Kitaev (2006년 제안)", "connections": "Honeycomb iridates, Quantum Spin Liquids(QSL), Frustrated magnetism."}, {"term": "RIXS", "why_emerged": "물질 내의 전하, 궤도, 스핀 들뜸을 에너지와 운동량 분해능을 가지고 동시에 관측하기 위해 필요합니다.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "ARPES, Inelastic neutron scattering, Core-level spectroscopy."}, {"term": "Bond-directional interactions", "why_emerged": "스핀-궤도 결합이 강한 물질에서 스핀 상호작용이 결합 방향에 따라 달라지는 이방성을 설명하기 위해 도입되었습니다.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "Spin-orbit coupling, Kitaev Hamiltonian, Mott insulators."}], "english_summary": ["RIXS experiments investigate the Kitaev material Na2IrO3.", "The study identifies bond-directional excitations in the honeycomb lattice.", "Results provide direct spectroscopic evidence for Kitaev physics in iridates.", "The findings bridge the gap between theoretical models and experimental observations of quantum magnetism."]}}, {"title": "Excitons driving spin dynamics in CrSBr", "journal": "Nature_Materials", "source": "Gemini", "link": "https://www.nature.com/articles/s41563-026-02730-3", "authors": "Wenyi Zhou, Roland K. Kawakami", "last_authors": "Wenyi Zhou, Roland K. Kawakami", "summary": "Photoexcited excitons in the two-dimensional antiferromagnet CrSBr are found to act as a source of spin torque, driving nonlinear magnon dynamics through phase-coherent energy exchange that persists well beyond the optical pulse.", "tier": "B_IMPORTANT_CONDMAT", "score": "7", "reason": "Examines spin dynamics in a popular 2D vdW antiferromagnet, relevant to the user's 2D materials interests.", "tags": ["material:CrSBr", "topic:2Dmagnetism", "method:spectroscopy"], "image": "https://media.springernature.com/m685/springer-static/image/art%3A10.1038%2Fs41563-026-02730-3/MediaObjects/41563_2026_2730_Fig1_HTML.png", "briefing": {"background": "2D 자성 물질인 CrSBr은 층상 구조와 반강자성 특성을 동시에 가져 차세대 스핀트로닉스 및 엑시톤 소자로 기대를 모으고 있습니다.", "motivation": "광학적으로 생성된 엑시톤이 자성 구조의 스핀 동역학에 어떠한 영향을 미치는지 규명하고자 하였습니다.", "result": "광 여기된 엑시톤이 스핀 토크(spin torque)를 발생시켜, 비선형 마그논 동역학을 유도하며 빛의 펄스 이후에도 지속되는 에너지 교환을 확인했습니다.", "implication": "빛을 이용해 2D 반강자성체의 스핀을 제어할 수 있는 가능성을 열었으며, 이는 초고속 자기 메모리 기술에 응용될 수 있습니다.", "novelty": "빛(엑시톤)과 스핀(마그논) 간의 강한 상호작용을 비선형 동역학 관점에서 규명하여 2D vdW 자성체에서의 제어 메커니즘을 정립했습니다.", "unresolved": "엑시톤-마그논 상호작용의 효율을 실온까지 유지하는 방안과 나노 스케일에서의 공간적 분포는 아직 연구가 필요합니다.", "future_work": "펨토초 분해능을 가진 펌프-프로브 측정을 통해 스핀 스위칭의 응답 속도를 정밀 측정할 계획입니다.", "concepts": [{"term": "CrSBr", "why_emerged": "안정적인 층상 반강자성체로서 엑시톤과 자성을 동시에 연구할 수 있는 플랫폼으로 주목받았습니다.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "2D van der Waals magnets, Excitons, Antiferromagnetism."}, {"term": "Magnon dynamics", "w esult": "중성자 산란 실험을 통해 CuGeO3 내에서 약하게 상호작용하는 스핀온과 강하게 결합된 트리플론(triplon)의 공존 및 그 분산 관계를 관찰했습니다.", "implication": "저차원 양자 자성체에서 준입자의 분수화 과정이 격자 왜곡과 같은 외부 요인에 의해 어떻게 제어되는지에 대한 이해를 높였습니다.", "novelty": "스핀-파이얼스 사슬 시스템에서 분수화된 준입자의 정량적 분석을 통해 준입자 간의 결합 세기를 명확히 구분해냈다는 점이 주목할 만합니다.", "unresolved": "격자 왜곡이 준입자의 결합 상태를 완전히 결정하는지, 아니면 추가적인 다체 상호작용이 기여하는지에 대한 상세한 이론적 정합성이 완전히 해결되지 않았습니다.", "future_work": "다른 도핑 수준이나 압력 조건 하에서 준입자 간의 상호작용이 어떻게 변하는지 확인하는 후속 연구가 필요합니다.", "concepts": [{"term": "스핀온(Spinon)", "why_emerged": "1차원 하이젠베르크 사슬에서 스핀 1인 들뜸이 분리되어 나타나는 S=1/2 준입자를 설명하기 위해 필요.", "origin": "Bethe ansatz를 통해 1930년대에 기초가 마련됨.", "connections": "양자 스핀 액체, 홀다인 갭 현상과 연결됨."}, {"term": "트리플론(Triplon)", "why_emerged": "이량체(dimer) 상태를 가진 자성체에서 나타나는 S=1인 집단 들뜸을 기술하기 위해 필요.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "스핀-파이얼스 전이, 양자 상전이 이론과 연결됨."}], "english_summary": ["Investigated quasiparticle dynamics in the quantum spin-Peierls system CuGeO3.", "Identified coexistence of weakly interacting spinons and tightly bound triplons via neutron scattering.", "Demonstrated how lattice distortions modulate the fractionalized excitation spectrum.", "Provides experimental insights into the stability of fractionalized quasiparticles in frustrated magnets."]}}, {"title": "Anisotropic magnetotransport and optical response of the multiband low-carrier antiferromagnet DyPtSb", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/lqnh-7d73", "authors": "Snehashish Chatterjee, Abhinav Agarwal, Raphael Borkenhagen, et al.", "last_authors": "Piotr Wiśniewski, Dariusz Kaczorowski", "summary": "We report a combined study of the magnetic, electrical transport, optical reflectivity, and electronic properties of single-crystalline DyPtSb, a half-Heusler antiferromagnet that orders at 2.2 K. The electrical resistivity exhibits semiconductor-like behavior and the Hall response becomes strongly …", "tier": "B_IMPORTANT_CONDMAT", "score": "7", "reason": "Multiband transport study in a magnetic topological-related candidate.", "tags": ["transport", "antiferromagnet"], "image": "", "briefing": {"background": "반강자성체, 특히 반-호이슬러(half-Heusler) 합금은 토폴로지적 밴드 구조와 자기적 특성이 결합하여 비정상 홀 효과와 같은 흥미로운 수송 현상을 나타낼 가능성이 큽니다.", "motivation": "DyPtSb 반강자성체의 다중 밴드 구조와 자기적 정렬이 전기적 수송 특성 및 광학적 반응에 미치는 영향을 규명하고자 합니다.", "result": "저온에서 반강자성 정렬을 보이는 DyPtSb가 반도체적 거동을 보이며, 홀 응답이 자기적 상태에 따라 크게 변화함을 확인했습니다.", "implication": "낮은 캐리어 농도를 가진 자성체에서 전하 운반자의 수송 현상을 자기적 정렬과 연계하여 해석할 수 있는 중요한 데이터를 제공합니다.", "novelty": "다중 밴드 효과가 지배적인 희토류 기반 반-호이슬러 화합물에서 수송 현상과 자기성의 상관관계를 통합적으로 분석했습니다.", "unresolved": "관찰된 강한 홀 응답이 베리 곡률에 의한 것인지, 단순히 다중 밴드 전하 캐리어의 합성에 의한 것인지 명확한 구분은 아직 부족합니다.", "future_work": "ARPES를 통한 전자 구조 직접 관측 및 베리 곡률 계산을 동반한 수송 현상 분석이 요구됩니다.", "concepts": [{"term": "반-호이슬러 합금(Half-Heusler)", "why_emerged": "XYZ형 조성에서 나타나는 독특한 밴드 토폴로지와 자기적 특성을 탐구하기 위해 필요.", "origin": "Friedrich Heusler가 1903년 발견.", "connections": "토폴로지 절연체, Weyl 준금속과 연결됨."}, {"term": "비정상 홀 효과(Anomalous Hall Effect)", "why_emerged": "자기 물질에서 전하 운반자가 자기 모멘트와의 상호작용으로 편향되는 현상을 설명하기 위해 필요.", "origin": "E. H. Hall이 1881년 발견.", "connections": "베리 곡률, 자기적 토폴로지 물질과 연결됨."}], "english_summary": ["Reported magnetotransport and optical properties of DyPtSb.", "Identified semiconductor-like behavior and field-dependent Hall response in an antiferromagnetic half-Heusler.", "Analyzed the multi-band nature of charge carriers in the magnetically ordered phase.", "Contributes to the study of topological and magnetic properties in low-carrier density systems."]}}, {"title": "Anisotropy of spin waves in the field-polarized phase of Fe-doped MnSi", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/4y5x-mrl7", "authors": "I. N. Khoroshiy, A. Podlesnyak, D. Menzel, et al.", "last_authors": "A. S. Sukhanov, S. E. Nikitin", "summary": "Chiral magnetic textures, such as skyrmions, are of great interest to the condensed matter community due to their novel transport properties. The stabilization of topologically nontrivial magnetic phases, like the skyrmion lattice in cubic MnSi, is governed by underlying magnetic interactions which …", "tier": "B_IMPORTANT_CONDMAT", "score": "7", "reason": "Study of spin waves in a chiral magnetic system (MnSi), relevant to topological magnetic textures.", "tags": ["experiment", "material", "topologicalmagnetism"], "image": "", "briefing": {"background": "MnSi는 카이랄 자성체로, 스카이르미온 격자(skyrmion lattice)가 안정화되는 대표적인 물질입니다. 스핀 파동(spin wave)의 이방성을 이해하는 것은 이러한 토폴로지적 자기 구조의 안정성을 이해하는 핵심입니다.", "motivation": "Fe가 도핑된 MnSi의 자기장 편극 상태에서 스핀 파동의 이방성을 측정하여, 도핑이 자성 상호작용과 토폴로지적 위상에 미치는 영향을 조사합니다.", "result": "Fe 도핑이 MnSi의 스핀 파동 분산 관계에 미치는 변화를 정량적으로 분석하여 자기적 상호작용의 이방성을 확인했습니다.", "implication": "도핑을 통한 스카이르미온 안정성 제어 및 카이랄 자성체의 물성 공학적 접근에 기초 자료를 제공합니다.", "novelty": "MnSi 시스템에서 Fe 도핑이라는 화학적 조절이 스핀 파동 이방성에 미치는 영향을 실험적으로 명확히 규명했습니다.", "unresolved": "도핑된 Fe 원자가 국소적인 불순물 산란을 넘어 어떻게 전체적인 카이랄 자기 상호작용(Dzyaloshinskii-Moriya interaction)을 재구성하는지는 구체적으로 더 연구되어야 합니다.", "future_work": "이러한 이방성 변화가 저온에서의 스카이르미온 위상 도표에 미치는 영향을 고정밀 중성자 산란으로 추가 연구할 필요가 있습니다.", "concepts": [{"term": "스카이르미온(Skyrmion)", "why_emerged": "강자성체 내에서 나타나는 입자 형태의 위상학적으로 안정된 자기 소용돌이를 기술하기 위해 필요.", "origin": "Tony Skyrme이 입자 물리학에서 처음 제안, 자성체에서는 2009년 Muhlbauer 등이 발견.", "connections": "토폴로지 홀 효과, 카이랄 자성체와 연결됨."}, {"term": "카이랄 자기 상호작용(Dzyaloshinskii-Moriya)", "why_emerged": "반전 대칭성이 깨진 계에서 스핀의 비대칭적 정렬을 설명하기 위해 필요.", "origin": "Dzyaloshinskii와 Moriya가 제안.", "connections": "스카이르미온 형성, 나선형 자기 구조와 연결됨."}], "english_summary": ["Studied spin wave anisotropy in Fe-doped MnSi under a magnetic field.", "Used experimental methods to elucidate the impact of doping on magnetic interactions.", "Provides insights into the stability of topologically non-trivial magnetic phases.", "Highlights the role of chemical tuning in modulating chiral magnetic textures."]}}, {"title": "Composition-dependent bulk properties in intercalated transition metal dichalcogenides Co1/3(1±δ)NbS2", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/vl26-p4lg", "authors": "Woonghee Cho, Kiwan Nam, Yeochan An, et al.", "last_authors": "Kee Hoon Kim, Je-Geun Park", "summary": "We report a systematic study of the composition-dependent bulk properties in $\\mathrm{C}{\\mathrm{o}}_{1/3(1±δ)}\\mathrm{Nb}{\\mathrm{S}}_{2}$ single crystals across a series of precisely controlled cobalt compositions with $−4%≤δ≤8%$. By tuning the cobalt stoichiometry, we find that the topological Ha…", "tier": "B_IMPORTANT_CONDMAT", "score": "7", "reason": "Experimental study of intercalated TMDs and topological Hall effect in a magnetic system.", "tags": ["experiment", "material", "TMD"], "image": "", "briefing": {"background": "전이금속 디칼코게나이드(TMD)에 자성 원자를 삽입(intercalation)하면 격자 구조와 자기적 정렬이 조절되어 위상학적 비자명한 전자 상태가 유도될 수 있습니다.", "motivation": "Co가 삽입된 NbS2 시스템에서 Co 농도(δ)를 정밀하게 조절함으로써 자기적 특성과 이에 연관된 수송 현상, 특히 위상학적 홀 효과(THE)가 어떻게 변화하는지 규명하고자 함.", "result": "Co 농도 변화에 따라 bulk 자기적 물성이 크게 변하며, 특정 영역에서 위상학적 홀 효과가 나타나는 것을 확인하여 물질 내 자성 구조와 위상학적 전자 상태 간의 상관관계를 보여줌.", "implication": "TMD 기반 자성 물질에서 조성 제어를 통해 스핀 구조를 조절하고, 이를 바탕으로 차세대 위상학적 스핀 소자 구현을 위한 물질적 토대를 마련함.", "novelty": "Co 함량의 미세한 조절(δ)을 통해 위상학적 홀 효과를 체계적으로 연구했으며, 이는 자성 TMD 물질의 물성 제어 전략에 중요한 데이터를 제공함.", "unresolved": "THE의 기원이 되는 정확한 스핀 텍스처(스커미온 등)의 직접적인 이미징이나 미세 구조에 대한 추가적 분석은 부족함.", "future_work": "로런츠 투과전자현미경(LTEM)을 이용한 자기 도메인 및 스커미온 구조의 직접 관측과 저온에서의 자성 물성 상세 분석.", "concepts": [{"term": "위상학적 홀 효과 (THE)", "why_emerged": "비자명한 스핀 텍스처에 의한 베리 위상이 전하 캐리어에 가하는 유효 자기장 때문에 발생함.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "스커미온, 베리 곡률, 이상 홀 효과."}, {"term": "TMD 삽입 화합물", "why_emerged": "본래 2차원 물질인 TMD에 층간 물질을 삽입하여 3차원적 물성과 새로운 자기적 위상 상태를 탐구하기 위함.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "NbS2, VSe2, 강상관 전자계."}], "english_summary": ["Systematic study of Co-intercalated NbS2 single crystals with precise composition control.", "Co-stoichiometry tunes magnetic bulk properties and triggers topological Hall effect.", "Highlights the potential for controlling topological spin states in transition metal dichalcogenides."]}}, {"title": "Crystal fields and the properties of the Kitaev candidate Na3Co2SbO6 probed with x-ray absorption spectroscopy", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/t8x5-t8bg", "authors": "M. M. Ferreira-Carvalho, S. H. Chen, Y. C. Ku, S. Rößler, Robert Kluge, Ryan C. Morrow, et al.", "last_authors": "Alexander C. Komarek, Z. Hu, M. W. Haverkort, and L. H. Tjeng", "summary": "Here, the authors utilize high-precision inverse-partial-fluorescence-yield x-ray absorption and magnetic circular dichroism, together with full-multiplet cluster calculations, to probe the local electronic structure of the Kitaev candidate Na 3 Co 2 SbO 6 . The measurements reveal a dominant trigonal crystal field together with subtle deviations from trigonal symmetry. Accounting for this lower local symmetry enables a consistent description of both the spectroscopic data and the observed in-plane magnetization anisotropy, highlighting the importance of local distortions for Kitaev physics.", "tier": "B_IMPORTANT_CONDMAT", "score": "7", "reason": "Spectroscopic study of local electronic structure in a Kitaev candidate material using XAS and MCD.", "tags": ["XAS", "material", "quantummagnetism"], "image": "", "briefing": {"background": "키타예프 물질(Kitaev material)은 벌집 격자에서 스핀-궤도 결합에 의해 발생하는 양자 스핀 액체 상태를 연구하는 핵심 분야입니다.", "motivation": "Na3Co2SbO6 시스템에서 결정장(crystal field) 환경을 정밀 분석하여, 키타예프 물성을 결정짓는 핵심 요소인 국소 대칭성 왜곡을 밝히고자 함.", "result": "X선 흡수 분광(XAS) 및 자기 원편광 이색성(MCD) 데이터를 통해 국소적인 삼각 결정장 대칭성과 그 왜곡을 성공적으로 모델링함.", "implication": "이론적 모델과 실제 실험 데이터 사이의 정합성을 높였으며, 키타예프 후보 물질에서 국소 격자 왜곡이 물성에 미치는 지배적 역할을 증명함.", "novelty": "멀티플렛 계산을 결합한 분광학적 분석을 통해 Na3Co2SbO6의 자기 이방성을 미세하게 설명했으며, 구조적 왜곡을 이론에 통합한 점이 중요함.", "unresolved": "왜곡된 대칭성이 저온에서의 복잡한 자기 정렬이나 양자 스핀 액체 후보 영역에 정확히 어떤 영향을 미치는지에 대한 동역학적 측면은 추가 논의가 필요함.", "future_work": "더 낮은 온도에서의 공명 비탄성 X선 산란(RIXS)을 통한 자성 들뜸(magnon/spinon) 분산 측정.", "concepts": [{"term": "키타예프 모델", "why_emerged": "벌집 격자에서 스핀이 방향에 따라 다르게 결합하는 스핀 액체 상태를 설명하기 위해 제안됨.", "origin": "Alexei Kitaev (2006).", "connections": "양자 스핀 액체, 스핀-궤도 결합, 마요라나 페르미온."}, {"term": "자기 원편광 이색성 (MCD)", "why_emerged": "원편광을 흡수할 때 자성 상태에 따라 흡수율이 달라지는 원리를 이용해 원소별, 궤도별 자기 모멘트를 측정하기 위함.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "X선 흡수 분광(XAS), 자성 박막, 스핀-궤도 결합."}], "english_summary": ["Investigation of local electronic structure in Kitaev candidate Na3Co2SbO6.", "Utilized high-precision XAS and MCD with full-multiplet cluster calculations.", "Identified trigonal crystal field distortions crucial for explaining magnetic anisotropy.", "Highlights the importance of structural symmetry breaking in Kitaev physics."]}}, {"title": "Electronic mean free path of the cuprate superconductor Bi2Sr2CaCu2O8+δ from thermal Hall conductivity", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/c4gc-hkfn", "authors": "Emma Campillo, Manel Mezidi, Lu Chen, et al.", "last_authors": "Genda Gu, Louis Taillefer", "summary": "We use thermal transport to access the electronic mean free path of $d$-wave quasiparticles in one of the most widely studied cuprate superconductors, ${\\mathrm{Bi}}_{2}{\\mathrm{Sr}}_{2}{\\mathrm{CaCu}}_{2}{\\mathrm{O}}_{8+δ}$ (Bi2212). We have measured the thermal conductivity ${κ}_{\\mathrm{xx}}$ and…", "tier": "B_IMPORTANT_CONDMAT", "score": "7", "reason": "Important transport study on high-Tc superconductors.", "tags": ["cuprate", "superconduct", "transport"], "image": "", "briefing": {"background": "고온 초전도체인 cuprate에서 준입자(quasiparticle)의 수송 성질은 초전도 상태의 대칭성과 산란 메커니즘을 이해하는 열쇠입니다.", "motivation": "Bi2212 물질에서 열 수송 측정(thermal transport)을 통해 d-파 초전도체의 핵심 준입자인 노드(node) 근처 준입자의 평균 자유 행로를 정밀하게 측정하고자 함.", "result": "열전도도 측정 결과를 통해 저온에서 전자 시스템의 산란 특성과 평균 자유 행로를 도출하였으며, 이는 강력한 상관관계 하에서의 준입자 거동을 지지함.", "implication": "d-파 초전도체에서 준입자의 소멸과 산란 과정을 이해함으로써, 쿠퍼 쌍 결합 기작 및 고온 초전도의 근본적 성질에 대한 증거를 보강함.", "novelty": "가장 널리 연구된 Bi2212 시스템에서 열 수송을 통한 준입자 평균 자유 행로를 실험적으로 특정했다는 점에서 기본 물성 데이터로서 가치가 높음.", "unresolved": "강하게 얽힌 전자 산란과 비-페르미 액체적 거동이 고온에서의 열 수송에 미치는 기여를 완전히 분리하는 것은 여전히 어려움.", "future_work": "다양한 도핑 수준에서의 비교 연구 및 불순물 효과에 따른 산란 행로의 변화 관측.", "concepts": [{"term": "d-파 초전도", "why_emerged": "구리 산화물 초전도체의 에너지 갭이 각도에 따라 부호를 바꾸는 비등방성을 가지는 것을 설명하기 위해 필요함.", "origin": "1980년대 후반 고온 초전도 발견 직후 여러 이론가들에 의해 제안됨.", "connections": "고온 초전도체, 반강자성 스핀 흔들림(spin fluctuation), 준입자."}, {"term": "열 홀 효과 (Thermal Hall Effect)", "why_emerged": "전하를 띠지 않는 들뜸(마그논, 포논 등)이나 위상학적 상태를 탐구하기 위해 개발됨.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "열전도도, 베리 위상, 강상관 전자계."}], "english_summary": ["Measured thermal transport to extract electronic mean free path in Bi2212.", "Focuses on d-wave quasiparticles and their scattering behavior.", "Provides experimental insights into quasiparticle dynamics in high-Tc cuprates.", "Contributes to understanding the link between transport properties and superconducting state."]}}, {"title": "Extreme-ultraviolet optical response of atomically thin molybdenum disulfide", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/xbcw-n8sc", "authors": "Giacomo Fiorentini, Nicola Di Palo, Giacomo Inzani, et al.", "last_authors": "Davide Sangalli, Matteo Lucchini", "summary": "Here, the authors determine the extreme-ultraviolet optical constants of monolayer and bilayer MoS 2 through a combined experimental and first-principles study. They establish a consistent connection between two-dimensional conductivity and an effective three-dimensional refractive index, demonstrating that the optical response scales linearly with thickness. Unlike in the visible spectral range, they find that the XUV response is dominated by local-field effects, largely suppressing distinct excitonic signatures and providing benchmark data for future XUV and attosecond spectroscopies.", "tier": "B_IMPORTANT_CONDMAT", "score": "7", "reason": "Spectroscopic study of 2D MoS2 in the XUV range, providing benchmark data for electronic structure.", "tags": ["material", "2Dmaterials", "spectroscopy"], "image": "", "briefing": {"background": "2차원 물질인 MoS2는 가시광선 영역에서 강한 엑시톤 효과가 지배적이지만, 에너지가 더 높은 극자외선(XUV) 영역에서의 광학적 특성은 데이터가 부족하고 이해가 제한적이었습니다.", "motivation": "차세대 분광학 기법인 XUV 및 아토초 분광학을 위해 MoS2의 고에너지 영역에서의 광학 상수 및 전자 구조 데이터를 구축하고자 함.", "result": "단일층 및 이중층 MoS2의 XUV 광학 상수를 측정하고, 두께에 따라 광학 응답이 선형적으로 스케일링됨을 확인함. XUV 영역에서는 엑시톤 효과보다 국소장 효과(local-field effects)가 지배적임을 발견함.", "implication": "향후 2D 물질을 활용한 고에너지 분광학 연구에서 표준 데이터셋(benchmark)으로 활용될 수 있으며, 2D 전도도와 3D 굴절률 사이의 정량적 관계를 확립함.", "novelty": "가시광선 대역과는 판이하게 다른 XUV 영역의 물리적 응답을 실험과 제1원리 계산을 통해 체계적으로 규명함.", "unresolved": "실험 데이터가 정적 광학 상수에 집중되어 있어, 동역학적인 전자 상관관계의 미세한 변화는 추가 분석이 필요함.", "future_work": "아토초 시간 분해 분광학을 통한 전자 동역학 연구 및 다양한 전이금속 디칼코게나이드(TMD)로의 확장 연구.", "concepts": [{"term": "극자외선(XUV) 분광", "why_emerged": "물질의 전자 구조와 초고속 전자 동역학을 고해상도로 관찰하기 위해 필요.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "ARPES 및 X선 흡수 분광학(XAS)과 기술적으로 연결됨."}, {"term": "국소장 효과(Local-field effects)", "why_emerged": "물질 내부의 불균일한 전하 분포가 외부 광장에 미치는 영향을 정확히 기술하기 위해 필요.", "origin": "고전적 전자론에서 유래", "connections": "밴드 구조 계산의 RPA(Random Phase Approximation) 수준을 넘어선 해석에 필수적임."}], "english_summary": ["Determined XUV optical constants for mono- and bilayer MoS2.", "Established linear scaling of optical response with layer thickness.", "Showed XUV response is dominated by local-field effects rather than excitons.", "Provides a benchmarking dataset for future attosecond spectroscopies."]}}, {"title": "Functional renormalization group analysis of superconductivity in magnetic/transition metal dichalcogenide van der Waals heterobilayers", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/vvbk-2jgp", "authors": "Shivam Sharma, Abir De Sarkar", "last_authors": "Shivam Sharma, Abir De Sarkar", "summary": "We study superconducting instabilities in van der Waals (vdW) heterostructures comprising a honeycomb an   headText.appendChild(title);
  headText.appendChild(textEl('p', 'meta', [r.journal, r.source].filter(Boolean).join(' | ')));
  if (r.last_authors || r.authors) { const authors = document.createElement('p'); authors.className = 'authors'; if (r.last_authors) authors.append('Last authors: ' + r.last_authors); if (r.authors) authors.append((r.last_authors ? ' | ' : '') + 'Authors: ' + r.authors); headText.appendChild(authors); }
  appendLabeledText(headText, 'why', 'Filter reason: ', r.reason);
  if (r.tags && r.tags.length) { const tags = document.createElement('div'); tags.className = 'tags'; r.tags.forEach(tag => tags.appendChild(textEl('span', 'tag', '#' + tag))); headText.appendChild(tags); }
  if (r.link) { const link = document.createElement('a'); link.className = 'link'; link.href = r.link; link.target = '_blank'; link.rel = 'noopener noreferrer'; link.textContent = 'Open paper'; headText.appendChild(link); }
  head.appendChild(headText);
  if (r.summary) { const abstract = document.createElement('p'); abstract.className = 'original-abstract'; const strong = textEl('strong', '', 'Original abstract'); abstract.appendChild(strong); abstract.append(r.summary); head.appendChild(abstract); }
  slideEl.appendChild(head);
  const briefing = document.createElement('div');
  briefing.className = 'briefing';
  appendBriefSection(briefing, 'Background', b.background);
  appendBriefSection(briefing, 'Motivation', b.motivation);
  appendBriefSection(briefing, 'Result', b.result);
  appendBriefSection(briefing, 'Implication', b.implication);
  appendBriefSection(briefing, "Why it's important / Novelty", b.novelty);
  appendBriefSection(briefing, 'Unresolved Questions', b.unresolved);
  appendBriefSection(briefing, 'Expected Future Work', b.future_work);
  if (b.concepts && b.concepts.length) {
    const section = document.createElement('section');
    section.className = 'brief-section wide';
    section.appendChild(textEl('h2', '', 'Concepts / Terms'));
    const concepts = document.createElement('div');
    concepts.className = 'concepts';
    b.concepts.forEach(c => {
      const item = document.createElement('div');
      item.className = 'concept';
      item.appendChild(textEl('h3', '', c.term || 'Concept'));
      [['왜 생겼나: ', c.why_emerged], ['누가 만들었나: ', c.origin], ['연결되는 흐름: ', c.connections]].forEach(([label, text]) => { if (!text) return; const p = document.createElement('p'); const bold = textEl('b', '', label); p.appendChild(bold); p.append(text); item.appendChild(p); });
      concepts.appendChild(item);
    });
    section.appendChild(concepts);
    briefing.appendChild(section);
  }
  if (b.english_summary && b.english_summary.length) { const section = document.createElement('section'); section.className = 'brief-section wide'; section.appendChild(textEl('h2', '', 'English Summary')); const ul = document.createElement('ul'); b.english_summary.slice(0, 5).forEach(line => ul.appendChild(textEl('li', '', line))); section.appendChild(ul); briefing.appendChild(section); }
  slideEl.appendChild(briefing);
  counterEl.textContent = `${index + 1} / ${slides.length}`;
  prevBtn.disabled = index === 0;
  nextBtn.disabled = index === slides.length - 1;
}
prevBtn.addEventListener('click', () => { index = Math.max(0, index - 1); render(); });
nextBtn.addEventListener('click', () => { index = Math.min(slides.length - 1, index + 1); render(); });
document.addEventListener('keydown', event => { if (event.key === 'ArrowLeft') prevBtn.click(); if (event.key === 'ArrowRight') nextBtn.click(); });
render();
</script>
</body>
</html>
