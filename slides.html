<!DOCTYPE html>

<meta charset='UTF-8'>
<meta name='viewport' content='width=device-width, initial-scale=1.0'>
<title>Daily Paper Slideshow</title>
<style>
  :root {
    color-scheme: light;
    --bg: #f6f7f4;
    --paper: #ffffff;
    --ink: #111827;
    --muted: #64748b;
    --line: #d8ddd2;
    --accent: #176b87;
    --accent-2: #9a3412;
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; overflow: auto; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: var(--bg); color: var(--ink); }
  .shell { max-width: 1500px; min-height: 100vh; margin: 0 auto; padding: 14px 18px; display: flex; flex-direction: column; }
  .topbar { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 16px; }
  .top-actions { display: flex; align-items: center; gap: 10px; }
  .topbar a, button { border: 1px solid var(--line); border-radius: 8px; background: var(--paper); color: var(--ink); padding: 10px 14px; font-weight: 700; text-decoration: none; cursor: pointer; }
  button.primary { background: var(--accent); border-color: var(--accent); color: white; }
  button:disabled { opacity: 0.45; cursor: not-allowed; }
  .counter { color: var(--muted); font-weight: 700; }
  .slide { min-height: calc(100vh - 82px); background: var(--paper); border: 1px solid var(--line); border-radius: 10px; padding: 18px; box-shadow: 0 18px 42px rgba(15, 23, 42, 0.10); display: grid; grid-template-columns: minmax(310px, 0.86fr) minmax(0, 1.55fr); gap: 18px; overflow: visible; }
  .paper-head { min-width: 0; min-height: 0; overflow: visible; display: flex; flex-direction: column; gap: 12px; }
  .figure { margin: 0; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: #f8fafc; }
  .figure img { display: block; width: 100%; max-height: 41vh; object-fit: contain; background: white; }
  .figure figcaption { padding: 7px 10px; color: var(--muted); font-size: 12px; line-height: 1.3; }
  .head-text { display: flex; flex-direction: column; gap: 9px; min-width: 0; }
  .badges { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .badge { border-radius: 999px; padding: 5px 9px; background: #eef2ff; color: #3730a3; font-size: 12px; font-weight: 800; }
  .score { background: #fee2e2; color: #991b1b; }
  h1 { margin: 0; font-size: 25px; line-height: 1.15; letter-spacing: 0; overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
  h1 a { color: inherit; text-decoration-color: rgba(23, 107, 135, 0.35); text-decoration-thickness: 2px; text-underline-offset: 4px; }
  h1 a:hover { color: var(--accent); text-decoration-color: var(--accent); }
  .meta, .authors, .why, .abstract { font-size: 13px; line-height: 1.45; }
  .meta, .authors { color: var(--muted); }
  .why strong, .abstract strong, .authors strong { color: var(--ink); }
  .authors { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .why { border-left: 4px solid var(--accent-2); padding-left: 10px; color: #374151; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .abstract { border-top: 1px solid var(--line); padding-top: 14px; color: #374151; }
  .original-abstract { border-top: 1px solid var(--line); padding-top: 10px; color: #374151; font-size: 11.5px; line-height: 1.35; overflow-wrap: anywhere; }
  .original-abstract strong { display: block; margin-bottom: 4px; color: var(--ink); }
  .tags { display: flex; flex-wrap: wrap; gap: 8px; }
  .tag { border-radius: 999px; padding: 4px 8px; background: #f1f5f9; color: #475569; font-size: 12px; font-weight: 700; }
  .head-text > .link { display: none; }
  .briefing { min-width: 0; min-height: 0; overflow: visible; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); grid-auto-rows: minmax(0, auto); align-content: start; gap: 11px 18px; border-top: 0; padding-top: 0; }
  .brief-section { min-width: 0; }
  .brief-section.wide { grid-column: 1 / -1; }
  .brief-section h2 { margin: 0 0 4px; font-size: 14px; line-height: 1.22; color: #0f766e; letter-spacing: 0; }
  .brief-section p, .brief-section li { margin: 0; font-size: 12.5px; line-height: 1.42; color: #1f2937; overflow-wrap: anywhere; }
  .brief-section ul { margin: 0; padding-left: 20px; }
  .concepts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 9px 14px; }
  .concept { border-top: 1px solid var(--line); padding-top: 7px; }
  .concept h3 { margin: 0 0 4px; font-size: 13px; color: #7c2d12; letter-spacing: 0; }
  .concept p { margin: 2px 0 0; font-size: 11.5px; line-height: 1.35; color: #374151; overflow-wrap: anywhere; }
  .concept b { color: #111827; }
  .link { color: var(--accent); font-weight: 800; text-decoration: none; }
  .empty { padding: 48px; background: var(--paper); border: 1px solid var(--line); border-radius: 12px; color: var(--muted); }
  @media (max-width: 860px) {
    .shell { padding: 14px; }
    .topbar, .top-actions { align-items: stretch; flex-direction: column; }
    .slide, .briefing, .concepts { grid-template-columns: 1fr; }
    .slide { min-height: auto; overflow: visible; display: grid; }
    h1 { font-size: 28px; }
  }
</style>

<script>
const slides = [{"title": "Hund's coupling governed orbital-selective superconductivity in Ba1−xKxFe2As2", "journal": "PRB_Recent", "source": "author whitelist", "link": "http://link.aps.org/doi/10.1103/yry8-qdm6", "authors": "Elena Corbae, Rong Zhang, Cong Li, et al.", "last_authors": "Donghui Lu, Zhi-Xun Shen", "summary": "Author(s): Elena Corbae, Rong Zhang, Cong Li, Kunihiro Kihou, Chul-Ho Lee, Makoto Hashimoto, Thomas Devereaux, Oscar Tjernberg, Egor Babaev, Dung-Hai Lee, Vadim Grinenko, Donghui Lu, and Zhi-Xun Shen While the influence of electronic correlations on superconductivity is a defining question, identifying how these correlations manifest in the superconducting state remains difficult. Furthermore, in multiorbital systems, correlations driven by Hund’s coupling can differentiate the behavior of individual orbitals, and how such orbital selectivity governs superconducting pairing has remained largely unexplored experimentally. Here, the authors use angle-resolved photoemission spectroscopy to experimentally determine the superconducting gap of a representative iron-based superconductor as the Hund’s coupling influence increases. They find increased correlation diminishes the superconducting gap in an orbital-selective way, suggesting that Hund’s coupling plays a central role in shaping pairing in multiorbital superconductors. [Phys. Rev. B 113, 224517] Published Fri Jun 12, 2026", "tier": "A_MUST_READ", "score": "10", "reason": "author whitelist: Makoto Hashimoto", "tags": ["angle-resolvedphotoemission", "photoemission", "superconduct"], "image": "", "briefing": {"background": "철 기반 초전도체(IBS)와 같은 다중 궤도(multiorbital) 시스템에서는 전자 간의 쿨롱 상호작용뿐만 아니라 훈트 결합(Hund's coupling)이 전자 상관관계의 핵심적인 역할을 합니다. 특히 이러한 상관관계가 궤도에 따라 다르게 나타나는 '궤도 선택적(orbital-selective)' 현상은 강상관 계의 본질적인 특성 중 하나입니다.", "motivation": "훈트 결합이 상전도 상태의 전자 구조에 미치는 영향은 잘 알려져 있으나, 이것이 초전도 상태의 페어링과 갭(gap) 형성에 구체적으로 어떻게 기여하는지는 실험적으로 명확히 규명되지 않았습니다.", "result": "Ba1-xKxFe2As2 시스템에서 ARPES를 통해 초전도 갭을 정밀하게 측정했습니다. 연구진은 훈트 결합에 의한 전자 상관관계가 강해짐에 따라 초전도 갭이 궤도 선택적인 방식으로 감소한다는 것을 발견했습니다.", "implication": "이 결과는 훈트 결합이 다중 궤도 초전도체의 페어링 메커니즘을 결정짓는 중심적인 요소임을 시사하며, 단순히 궤도별 유효 질량 증가를 넘어 갭의 크기 자체를 직접 제어함을 보여줍니다.", "novelty": "ARPES 분야의 권위자인 Donghui Lu와 Z-X Shen 그룹의 연구로, 훈트 결합과 궤도 선택적 초전도 갭 사이의 실험적 연결고리를 제시했다는 점이 중요합니다. 철 기반 초전도체와 ARPES를 주시하는 독자에게 필수적인 정보입니다.", "unresolved": "초록 정보만으로는 특정 조성 x에서의 훈트 결합 세기를 어떻게 정량화하고 분리했는지, 그리고 다른 철 기반 초전도체 패밀리에서도 동일한 경향성이 유지되는지는 추가 검증이 필요합니다.", "future_work": "다양한 도핑 및 압력 조절을 통해 훈트 결합의 세기를 연속적으로 튜닝하면서 초전도 갭의 변화를 관찰하는 추가 실험이 기대됩니다.", "concepts": [{"term": "훈트 결합 (Hund's coupling)", "why_emerged": "다중 궤도 원자에서 전자들이 평행한 스핀을 가질 때 정전기적 반발력을 최소화하려는 경향을 설명하기 위해 등장했습니다.", "origin": "Friedrich Hund (1925년)", "connections": "Hund's metal, 강상관 전자계, 철 기반 초전도체"}, {"term": "궤도 선택성 (Orbital selectivity)", "why_emerged": "서로 다른 d-궤도(dxy, dxz/dyz 등)의 상관관계 정도가 극명하게 다르게 나타나는 현상을 설명하기 위해 제안되었습니다.", "origin": "초록 정보만으로는 특정하기 어려움 (강상관 계 이론 연구에서 발전)", "connections": "궤도 선택적 모트 전이(OSMT), 훈트의 금속"}, {"term": "ARPES (각분해 광전자 분광법)", "why_emerged": "물질의 에너지-운동량 공간에서의 전자 구조(Fermi surface, band structure)를 직접 관찰하기 위해 개발되었습니다.", "origin": "William Spicer 등의 연구를 바탕으로 발전", "connections": "초전도 갭 측정, 준입자 수명, 상관관계 효과 관찰"}], "english_summary": ["Investigates the role of Hund's coupling in the superconducting state of Ba1-xKxFe2As2 using high-resolution ARPES.", "Discovers that increased electronic correlations driven by Hund's coupling lead to an orbital-selective suppression of the superconducting gap.", "Identifies Hund's coupling as a key driver in shaping the pairing symmetry and gap magnitude in multiorbital systems.", "Provides direct experimental evidence linking orbital-dependent correlations to superconducting pairing strengths."]}}, {"title": "Evidence for Multiband Superconductivity in 2H-NbSeS", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2606.19107", "authors": "K. Yadav, M. Lamba K. Bhattacharya, M. Majumder, S. Patnaik", "last_authors": "K. Yadav, M. Lamba K. Bhattacharya, M. Majumder, S. Patnaik", "summary": "The nature of superconductivity in 2H-NbSe 2 has generated sustained debate in the recent past. While angle resolved photoemission spectroscopy data have been interpreted as evidence for multiband superconductivity, the data from scanning tunneling microscope experiments relate to strongly anisotropic single-band superconductivity. In the later case, the charge density wave (CDW) order mimics the multigap character. Because the CDW reconstructs the Fermi surface and modifies the superconducting gap distribution, disentangling intrinsic multiband pairing from CDW-related effects is challenging. To address this issue, we investigate single-crystalline 2H-NbSeS, a mixed-chalcogen analogue of 2H-NbSe 2 in which random Se/S substitution suppresses long-range CDW order while preserving the layered crystal structure P ​ 6 3 / m ​ m ​ c P6_{3}/mmc . The material becomes superconducting below T c ≈ 6.0 T_{c}\\approx 6.0 K with moderate magnetic anisotropy γ = ξ a ​ b / ξ c ≈ 3.1 \\gamma=\\xi_{ab}/\\xi_{c}\\approx 3.1 . The upper critical field H c ​ 2 ​ ( T ) H_{c2}(T) exhibits a pronounced upward curvature that cannot be described within a single-band framework but is well captured by a dirty-limit two-band model with a large diffusivity ratio. This indicates strong band-dependent scattering. The in-plane upper critical field H c ​ 2 ∥ a b ​ ( 0 ) ≈ 14.5 H_{c2}^{\\parallel ab}(0)\\approx 14.5 T exceeds the weak-coupling Pauli limit. Measurements of the lower critical field, superfluid density, and electronic specific heat are consistent with an interpretation of a fully gapped superconducting state with two nodeless gaps of different magnitudes.", "tier": "A_MUST_READ", "score": "10", "reason": "Directly relevant experimental work on multiband superconductivity in a relevant layered material.", "tags": ["superconductivity", "NbSe2-analog", "experimental"], "image": "https://arxiv.org/html/2606.19107v1/XRD.jpg", "briefing": {"background": "2H-NbSe2는 전하 밀도파(CDW)와 초전도성이 공존하는 대표적인 물질입니다. 하지만 이 물질의 초전도성이 다중 밴드(multiband) 기인인지, 아니면 CDW에 의한 페르미면 재구성에 따른 변형된 단일 밴드 기인인지에 대해 ARPES와 STM 결과가 엇갈리며 논란이 지속되어 왔습니다.", "motivation": "CDW의 간섭 없이 순수한 초전도성을 연구하기 위해, Se/S 치환을 통해 층상 구조는 유지하면서 장거리 CDW 질서만 억제한 2H-NbSeS 단결정에서 초전도 특성을 조사했습니다.", "result": "상부 임계 자기장(Hc2)에서 단일 밴드 모델로는 설명 불가능한 특징적인 상향 굴곡(upward curvature)을 관찰했습니다. 이는 더러운 극한(dirty limit)의 2밴드 모델로 잘 설명되며, 하부 임계 자기장 및 비열 측정 결과 역시 노드가 없는(nodeless) 두 개의 초전도 갭이 존재하는 다중 밴드 초전도임을 지지합니다.", "implication": "2H-NbSe2 계열의 초전도 본질이 CDW 효과와 무관하게 고유한 다중 밴드 특성을 가지고 있음을 강력히 시사하며, Hc2가 파울리 한계를 넘는다는 점에서 강한 밴드별 산란과 비정형적인 페어링 가능성을 보여줍니다.", "novelty": "화학적 치환을 이용해 CDW와 초전도성을 성공적으로 분리해냈으며, NbSe2 관련 물질 및 다중 밴드 초전도를 연구하는 독자에게 직접적인 실험 증거를 제공합니다.", "unresolved": "두 개의 갭이 구체적으로 어떤 밴드(예: Se 4p vs Nb 4d)에서 유래하는지에 대한 미시적 확인은 본 수송 측정만으로는 부족하며 추가적인 분광학적 연구가 필요합니다.", "future_work": "CDW가 억제된 NbSeS 시스템에 대한 ARPES 및 STS 측정을 통해 직접적으로 두 개의 갭 크기와 운동량 공간 분포를 매핑하는 연구가 뒤따를 것으로 보입니다.", "concepts": [{"term": "다중 밴드 초전도 (Multiband superconductivity)", "why_emerged": "페르미 준위에 걸쳐 있는 여러 개의 에너지 밴드가 초전도 페어링에 독립적 혹은 상호 연결되어 참여하는 현상을 설명하기 위함입니다.", "origin": "H. Suhl, B. T. Matthias, L. R. Walker (1959년)", "connections": "MgB2, 철 기반 초전도체, 상부 임계 자기장 상향 굴곡"}, {"term": "파울리 한계 (Pauli limit)", "why_emerged": "외부 자기장에 의한 스핀 제만 효과가 초전도 페어링 에너지보다 커져서 초전도성이 파괴되는 이론적 한계를 정의하기 위해 등장했습니다.", "origin": "A. M. Clogston 및 B. S. Chandrasekhar (1962년)", "connections": "상부 임계 자기장, 스핀-궤도 결합, Ising 초전도"}, {"term": "더러운 극한 (Dirty limit)", "why_emerged": "전자 산란의 평균 자유 행로가 초전도 결맞음 길이(coherence length)보다 짧은 경우의 수송 특성을 설명하기 위해 사용됩니다.", "origin": "P. W. Anderson (1959년)", "connections": "BCS 이론, 불순물 산란, 초전도 전이 온도 변화"}], "english_summary": ["Investigates the multiband nature of superconductivity in 2H-NbSeS where long-range CDW order is suppressed by Se/S substitution.", "Observes a pronounced upward curvature in the upper critical field Hc2(T), consistent with a two-band model in the dirty limit.", "Determines that the in-plane upper critical field exceeds the weak-coupling Pauli limit, suggesting strong band-dependent scattering.", "Confirms a fully gapped superconducting state with two distinct nodeless gaps through specific heat and lower critical field measurements."]}}, {"title": "Suppression of p-Wave Altermagnetism by Localized 4f Electrons in CeNiAsO", "journal": "arXiv_CondMat", "source": "author whitelist", "link": "https://arxiv.org/abs/2606.02422", "authors": "Jiuxiang Zhang, Yueyang Sun, Honglin Zhou, et al.", "last_authors": "Lin Zhao, X. J. Zhou", "summary": "arXiv:2606.02422v2 Announce Type: replace Abstract: Altermagnetism, characterized by momentum-dependent spin splitting and zero net magnetization, has so far been explored mainly in weakly or moderately correlated d-electron systems. How symmetry-allowed altermagnetic band splitting manifests in heavy-fermion materials, where magnetic exchange competes with Kondo correlations, remains unclear. Here we use high-resolution angle-resolved photoemission spectroscopy (ARPES) to investigate CeNiAsO, a Kondo-lattice system that was predicted to be a candidate for p-wave altermagnetism. Fermi surface mapping and polarization-dependent ARPES show that the experimentally observed itinerant bands are mainly derived from Ni 3d orbitals, while resonant photoemission reveals that the Ce 4f states remain predominantly localized with residual c-f hybridization. Ultra-low-temperature measurements reveal no resolvable near-Fermi-level p-wave-like exchange splitting on the Ni 3d-derived conduction bands across the successive antiferromagnetic transitions. These experimental observations cannot be captured by an itinerant-4f band-structure description, which predicts a sizable p-wave splitting in the itinerant bands. When the localized Ce 4f character is incorporated, our band structure calculations indicate that the itinerant Ce 4f band weight is shifted away from the Fermi level and the p-wave-like splitting on the ed theoretical description. A broad range of spectral, response, and thermodynamic properties in twisted bilayer graphene is accurately described microscopically and traced to the interplay of electronic correlations, lattice strain, and structural relaxation. The results are in excellent agreement with multiple recent experiments including scanning tunneling and quantum twisting microscopy experiments. [Phys. Rev. B 113, L241112] Published Wed Jun 17, 2026", "tier": "B_IMPORTANT_CONDMAT", "score": "9", "reason": "Connects electronic correlations and structural relaxation to STM/STS features in twisted bilayer graphene.; demoted from A: broad CM, not direct user/project hit", "tags": ["twistedbilayergraphene", "STM", "STS", "correlations"], "image": "", "briefing": {"background": "트위스티드 이층 그래핀(TBG)은 마법 각도 근처에서 초전도성, 상관 절연체 등 놀라운 물성을 보입니다. 하지만 실제 실험에서 관측되는 분광학적, 열역학적 데이터는 단순한 전자 상관 효과만으로는 완벽히 설명되지 않는 경우가 많았습니다.", "motivation": "TBG에서 흔히 관측되지만 이론적으로 설명되지 않았던 분광학적 특성들을 전자 상관 관계, 격자 변형(strain), 구조적 완화(relaxation)의 상호작용 관점에서 통합적으로 이해하고자 했습니다.", "result": "전자 상관 관계와 구조적 왜곡을 미시적으로 결합한 모델을 통해, 이전까지 난제로 남아있던 STM/STS 데이터의 복잡한 스펙트럼 특성을 정확히 재현했습니다.", "implication": "TBG 시스템의 물리적 이해에 있어 순수 전자계 모델을 넘어 격자 왜곡과 구조적 이완을 고려하는 것이 필수적임을 입증했습니다.", "novelty": "최신 STS 및 양자 트위스팅 현미경 데이터를 동시에 설명할 수 있는 보편적인 미시 모델을 제시했습니다. 이는 강상관 시스템 연구에서 격자 자유도와 전자적 자유도의 결합을 강조한다는 점에서 중요합니다.", "unresolved": "구조적 이완 효과가 극단적인 나노 미터 스케일에서 발생하는 국소적 위상 변화나 강하게 상관된 상태의 안정성에 미치는 정밀한 기전은 여전히 토론의 여지가 있습니다.", "future_work": "이 통합 모델을 다른 꼬인 모아레 시스템이나 헤테로 구조로 확장하여, 유사한 상관 물성 발현 메커니즘을 밝혀낼 것으로 기대됩니다.", "concepts": [{"term": "Twisted Bilayer Graphene", "why_emerged": "그래핀 층 사이의 회전 각도에 따라 밴드 구조가 변하며 강상관 물성을 유도할 수 있음이 발견됨.", "origin": "Pablo Jarillo-Herrero 그룹 (2018년)", "connections": "모아레 물리학, 강상관 전자계, 평탄 밴드(Flat band)."}, {"term": "Structural Relaxation", "why_emerged": "두 층이 겹쳐질 때 에너지를 최소화하기 위해 원자들이 국소적으로 이동하며 모아레 패턴이 변형됨.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "격자 변형(Strain engineering), 전자-격자 결합."}], "english_summary": ["Addresses long-standing discrepancies between theory and experiments in twisted bilayer graphene.", "Integrates electronic correlations, lattice strain, and structural relaxation in a unified model.", "Achieves excellent agreement with recent STM and quantum twisting microscopy data."]}}, {"title": "Observation of Switchable Chiral Magnons in an Altermagnet", "journal": "PRL_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/m8lc-f8gk", "authors": "Zheyuan Liu, Hodaka Kikuchi, Zijun Wei, et al.", "last_authors": "Igor A. Zaliznyak, Takatsugu Masuda", "summary": "Author(s): Zheyuan Liu, Hodaka Kikuchi, Zijun Wei, Shinichiro Asai, Mechthild Enderle, Ursula B. Hansen, Vasile O. Garlea, Manh D. Le, Gøran J. Nilsen, Igor A. Zaliznyak, and Takatsugu Masuda Polarized inelastic neutron scattering gives the first unambiguous evidence of chirality of the split magnon bands in altermagnetic MnTe. [Phys. Rev. Lett. 136, 236705] Published Fri Jun 12, 2026", "tier": "B_IMPORTANT_CONDMAT", "score": "9", "reason": "Experimental observation of chiral magnons in an altermagnet using neutron scattering, highly relevant.", "tags": ["altermagnetism", "magnons", "neutronscattering", "MnTe", "experimental"], "image": "", "briefing": {"background": "알터자성(Altermagnetism)은 시간 역전 대칭성(TRS)이 깨져있지만 스핀 자화가 상쇄되어 알짜 자화가 없는 새로운 자기 정렬 상태로, 기존의 강자성이나 반강자성과는 다른 밴드 구조를 가집니다.", "motivation": "알터자성체에서 이론적으로 예측된 자성 밴드의 카이랄성(chirality)을 실험적으로 직접 입증하고 그 스위칭 가능성을 확인하고자 했습니다.", "result": "MnTe 알터자성체에서 편광 비탄성 중성자 산란(polarized inelastic neutron scattering)을 통해 분리된 매그논 밴드(magnon bands)가 카이랄 성질을 가짐을 명확히 관측했습니다.", "implication": "알터자성체가 기존 자성체와는 차별화된 스핀 수송 특성을 가질 수 있음을 실험적으로 증명한 것으로, 차세대 스핀트로닉스 소자 응용 가능성을 높였습니다.", "novelty": "알터자성 매그논의 카이랄성을 실험적으로 직접 증명한 첫 사례입니다. 이는 TRSB(시간 역전 대칭 깨짐) 시스템에서 카이랄 매그논을 활용한 정보 처리에 대한 중요한 물리적 근거를 제공합니다.", "unresolved": "이러한 카이랄 매그논이 외부 요인(예: 전류 또는 전계)에 의해 얼마나 빠르게 효율적으로 스위칭될 수 있는지, 그리고 다른 알터자성체에서도 일반적인 특성인지에 대한 추가 연구가 필요합니다.", "future_work": "다양한 알터자성 화합물에 대한 미로운 현상입니다.", "motivation": "TaIrTe4와 같은 비자성 위상 반금속 시스템에서 평면 내 자기장이 가해질 때, 궤도 모멘트와 Berry 접속 편극(Berry-connection-polarizability) 쌍극자를 통해 비선형 홀 효과가 어떻게 발생하는지 규명하고자 함.", "result": "상온에서 TaIrTe4의 고유한 비선형 평면 홀 효과를 관찰함. 이는 외부 자기장에 의해 유도된 궤도 메커니즘이 Berry 위상과 결합하여 비선형 수송 반응을 이끌어냄을 입증함.", "implication": "위상 물질의 수송 현상을 단순히 선형 응답으로 보는 시각에서 벗어나, 궤도 자기 모멘트와 Berry 위상을 활용한 상온 비선형 전자 소자 응용 가능성을 제시함.", "novelty": "상온에서 관측된 비선형 평면 홀 효과를 TaIrTe4라는 구체적인 물질계에서 궤도 메커니즘으로 설명한 점이 중요함. Berry 곡률 관련 물리량과 비선형 수송 현상의 결합은 향후 위상 물질 연구의 새로운 도구로 활용될 수 있음.", "unresolved": "이 효과의 크기가 소자 수준에서 실용적인 성능으로 이어지기 위한 최적화 방안 및 구체적인 궤도 모멘트 분포의 공간적 미시 구조.", "future_work": "다른 위상 물질로의 확장 연구 및 비선형 홀 효과를 활용한 초고속 자기 센서 또는 논리 소자 설계.", "concepts": [{"term": "비선형 홀 효과", "why_emerged": "선형 홀 효과가 금지된 대칭성 조건에서도 Berry 곡률의 쌍극자 분포가 존재하면 전류 응답이 나타날 수 있음.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "Berry 곡률, 비중심 대칭성, 위상 반금속 수송."}, {"term": "Berry 접속 편극", "why_emerged": "비선형 광학 및 수송 반응을 Berry 곡률만으로는 설명하기 부족하여 도입된 2차 위상 기하학적 양.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "궤도 자기 모멘트, 비선형 전류 응답."}, {"term": "TaIrTe4", "why_emerged": "강한 스핀-궤도 결합을 가진 Weyl 반금속 후보 물질로서 저차원 물성 연구에 적합.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "위상 반금속, 112 텔루라이드 계열."}], "english_summary": ["Room-temperature observation of nonlinear planar Hall effect in nonmagnetic TaIrTe4.", "Identifies an orbital mechanism driven by Berry-connection-polarizability dipole.", "Demonstrates high-temperature robustness of topology-driven nonlinear transport.", "Provides insights for future topological quantum electronic devices."]}}, {"title": "Strain induced magnetic phase transition and anomalous transport phenomena in RuO2 and MnF2", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2606.18603", "authors": "Xiuxian Yang, Zhangqi Wu, Xiangju Wang, et al.", "last_authors": "Jian Hao, Wanxiang Feng", "summary": "arXiv:2606.18603v1 Announce Type: new Abstract: Collinear antiferromagnets with broken time-reversal symmetry have emerged as a fertile platform for spintronics. Using a general tight-binding model and first-principles calculations, we show that strain engineering provides a simple route to control magnetic phase transition and activate transverse responses in representative altermagnets RuO$_2$ and MnF$_2$. For pristine RuO$_2$ and MnF$_2$ with N\\'eel vector $\\mathbf{n}\\parallel$ [001], symmetry constrains the off-diagonal elements of the Hall conductivity tensor to vanish, thereby forbidding anomalous transport and magneto-optical responses. Shear strain applied along the $ac$ direction preserves the spin symmetry relating the two spin-opposite magnetic sublattices and therefore maintains the altermagnetic phase. By contrast, shear strain applied along the $ab$ direction breaks this spin symmetry and drives a transition from an altermagnetic phase to a partially compensated ferrimagnetic phase in metallic RuO$_2$ and to a fully compensated ferrimagnetic phase in semiconducting MnF$_2$. In addition, the lowered symmetry enables finite anomalous Hall, anomalous Nernst, and anomalous thermal Hall conductivities, as well as magneto-optical rotation angles, which are prohibited in the pristine systems. These responses exhibit a clear strain dependence and become progressively stronger as the strain amplitude increases. Our results establish strain engineering as an effective route to manipulate magnetic phases and functional responses in unconventional antiferromagnets, thereby expanding opportunities for antiferromagnetic spintronics and magneto-optical applications.", "tier": "B_IMPORTANT_CONDMAT", "score": "9", "reason": "Strain-induced phase transitions and anomalous transport in RuO2, a key altermagnetic material.", "tags": ["theory", "altermagnetism", "transport"], "image": "https://arxiv.org/html/2606.18603v1/x1.png", "briefing": {"background": "Altermagnetism(알터자성)은 시간 반전 대칭성이 깨져 있지만 격자 대칭성과 스핀이 결합하여 상쇄되는 새로운 자기 질서입니다. RuO2와 MnF2는 이 분야의 핵심 연구 대상입니다.", "motivation": "스트레인(strain) 공학을 통해 RuO2와 MnF2의 자기 상태를 정밀 제어하고, 기존에는 금지되었던 anomalous Hall 효과와 같은 수송 현상을 능동적으로 유도하고자 함.", "result": "shear strain의 방향에 따라 자성 상전이와 anomalous 수송 응답이 달라짐을 보임. 특정 strain은 altermagnetism을 유지하지만, ab-방향의 shear strain은 altermagnetic에서 ferrimagnetic으로의 상전이를 유도함.", "implication": "스트레인을 통해 altermagnetic 위상을 물리적으로 스위칭하고, 그에 따른 수송 응답을 제어할 수 있는 효율적인 스핀트로닉스 설계 방향을 제시함.", "novelty": "RuO2와 같은 altermagnet의 자기적 대칭성을 스트레인으로 깨뜨려, 금지된 수송 현상을 활성화하는 구체적 방법론 제시. 이는 알터자성 소자 구현의 핵심적 토대임.", "unresolved": "실제 실험적 환경에서 대면적 박막 또는 결정에 가할 수 있는 스트레인의 정밀도와 hysteresis 안정성 문제.", "future_work": "스트레인 유도 phase transition을 이용한 실제 소자 시연 및 박막 증착 시의 격자 부정합을 활용한 응용 연구.", "concepts": [{"term": "Altermagnetism", "why_emerged": "전통적인 강자성이나 반강자성으로 분류되지 않는, 결정 대칭성에 기반한 새로운 스핀 분극 상태가 이론적으로 예측됨.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "RuO2, 시간 반전 대칭성 파괴, 스핀트로닉스."}, {"term": "Anomalous Hall effect", "why_emerged": "외부 자기장이 없어도 내부의 자성 또는 Berry 곡률에 의해 전류가 휘는 현상으로, 스핀-궤도 결합 연구의 필수 항목.", "origin": "E. H. Hall 이후 고체물리 전반.", "connections": "위상물질, 스핀홀 효과, 자성 금속."}], "english_summary": ["Proposes strain engineering as a method to control magnetic phases in RuO2 and MnF2.", "Demonstrates transition from altermagnetic to ferrimagnetic state using ab-plane shear strain.", "Shows activation of anomalous Hall and thermal Hall effects through symmetry breaking.", "Expands the utility of altermagnets in antiferromagnetic spintronics."]}}, {"title": "Field-free Josephson diode and tunable ϕ0-junction in chiral kagome antiferromagnets", "journal": "npj_QuantumMaterials", "source": "Gemini", "link": "https://www.nature.com/articles/s41535-026-00907-2", "authors": "Jin-Xing Hou, Chuang Li, Lun-Hui Hu, Song-Bo Zhang", "last_authors": "Lun-Hui Hu, Song-Bo Zhang", "summary": "npj Quantum Materials, Published online: 17 June 2026; doi:10.1038/s41535-026-00907-2 Field-free Josephson diode and tunable ϕ 0 -junction in chiral kagome antiferromagnets", "tier": "B_IMPORTANT_CONDMAT", "score": "9", "reason": "Directly t frameworks", "journal": "npj_QuantumMaterials", "source": "Gemini", "link": "https://www.nature.com/articles/s41535-026-00902-7", "authors": "Avdhesh K. Sharma, Snehashish Chatterjee, Premakumar Yanda, Claudia Felser, Chandra Shekhar", "last_authors": "Claudia Felser, Chandra Shekhar", "summary": "npj Quantum Materials, Published online: 11 June 2026; doi:10.1038/s41535-026-00902-7 Topological quantum materials: kagome, chiral, and square-net frameworks", "tier": "B_IMPORTANT_CONDMAT", "score": "9", "reason": "Review of topological quantum materials, specifically highlighting kagome and chiral systems.; demoted from A: broad CM, not direct user/project hit", "tags": ["topologicalmaterials", "kagome", "chiral", "review"], "image": "https://pubads.g.doubleclick.net/gampad/ad?iu=/285/npjquantmats.nature.com/article&sz=728x90&c=872497865&t=pos%3Dtop%26type%3Darticle%26artid%3Ds41535-026-00902-7%26doi%3D10.1038/s41535-026-00902-7%26subjmeta%3D301,639,766%26kwrd%3DMaterials+science,Physics", "briefing": {"background": "위상 양자 물질(Topological Quantum Materials)은 위상 수학적 불변량에 의해 보호되는 독특한 전자 구조를 가지며, 이는 비소산성 수송 현상이나 강건한 표면 상태 등 차세대 소자 구현에 핵심적인 물성을 제공합니다.", "motivation": "카고메(Kagome) 격자, 카이랄(Chiral) 시스템, 그리고 스퀘어 넷(Square-net) 구조와 같은 특정 결정 구조가 어떻게 위상 비자명한 전자 상태를 발현시키고, 이를 통해 물리적 기능을 제어할 수 있는지 체계적인 분류와 정리가 필요했습니다.", "result": "본 리뷰 논문은 카고메 금속(AV3Sb5 등)을 포함한 다양한 격자 프레임워크에서의 위상적 상태를 조망하며, 재료 설계 관점에서 구조적 대칭성과 위상적 특성 사이의 상관관계를 정리했습니다.", "implication": "다양한 위상 재료의 설계 가이드라인을 제공하며, 특히 카고메 금속의 위상 상태가 외부 필드나 격자 변형에 의해 어떻게 조정될 수 있는지에 대한 통찰을 제시합니다.", "novelty": "최근 주목받는 카고메 금속 및 다양한 위상 격자 시스템의 최신 연구를 포괄적으로 통합하여, 실험적 구현과 이론적 이해 사이의 간극을 좁혔습니다.", "unresolved": "실제 합성된 물질에서 위상적 상태가 불순물이나 격자 결함에 의해 어느 정도까지 견고하게 유지되는지에 대한 구체적 실험 검증 데이터는 여전히 부족합니다.", "future_work": "카고메 금속의 도핑 제어 및 정밀한 변형 공학을 통한 위상 상태의 인위적 변조 연구가 이어질 것으로 기대됩니다.", "concepts": [{"term": "카고메 격자", "why_emerged": "좌절된 자기 구조와 플랫 밴드(Flat band) 및 디락 포인트의 공존을 연구하기 위해 필요합니다.", "origin": "일본의 바구니 짜기 문양에서 유래, 물리적 제안은 I. Syozi(1951).", "conn nanometer structure which can be switched from a net-down to a net-up polarization by scanning with a biased cantilever, accompanied by reversal of both in-plane and out-of-plane components of the magnetization. This directly demonstrates electric field–induced magnetization reversal accompanying 180° polarization switching in a complex structure of a scale relevant to the semiconductor industry, creating a potential path for next generation memory devices.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Experimental study of multiferroics and electric field control of ferromagnetism at nanoscale.", "tags": ["multiferroics", "ferroelectrics", "ferromagnetism", "nanoscale", "experimentaltechnique"], "image": "", "briefing": {"background": "멀티페로익(multiferroic) 물질은 강유전성과 강자성이 공존하며 이들 사이의 결합을 통해 자기적 상태를 전기장으로 제어할 수 있어 차세대 저전력 비휘발성 메모리 소자로 주목받고 있습니다.", "motivation": "BiFe0.9Co0.1O3 나노점 구조에서 실제 반도체 공정에 적용 가능한 나노미터 규모의 전기장 기반 자화 반전이 가능한지 검증하고자 합니다.", "result": "압전힘현미경(PFM)과 주사 질소-공석(NV) 중심 자력계를 결합하여 190nm 나노점 내에서 180도 분극 스위칭에 따른 자화 반전을 나노 스케일에서 직접 관찰하는 데 성공했습니다.", "implication": "나노 규모의 복잡한 강유전체 도메인 구조 내에서 전기장만으로 자기적 상태를 비휘발성으로 제어할 수 있음을 입증하여, 스핀트로닉스 소자 설계의 실현 가능성을 높였습니다.", "novelty": "기존 연구와 달리 복잡한 나노점 구조에서 분극 스위칭과 자화 반전을 직접 연결하여 나노 스케일로 시각화했다는 점이 본 연구의 핵심입니다.", "unresolved": "나노점 외부 환경이나 기판과의 상호작용이 도메인 스위칭 속도와 안정성에 미치는 장기적인 영향은 아직 명확하지 않습니다.", "future_work": "실제 메모리 소자 구동을 위한 고속 스위칭 테스트와 인접한 소자 간의 간섭 최소화 방안 연구가 필요합니다.", "concepts": [{"term": "멀티페로익(Multiferroic)", "why_emerged": "전기적 성질과 자기적 성질의 상호 작용을 이용해 에너지 효율적인 제어를 하기 위해 필요함.", "origin": "2000년대 초반 Perovskite 구조에서의 강한 결합이 보고되며 본격적으로 연구됨.", "connections": "스핀트로닉스, 자기전기 효과, 도메인 벽 물리학."}, {"term": "NV 중심 자력계(NV-center magnetometry)", "why_emerged": "나노미터 수준의 공간 분해능으로 미세 자기장을 비파괴적으로 측정하기 위해 필요함.", "origin": "2000년대 중반 다이아몬드 결함의 스핀 상태를 이용한 센싱 기법으로 정립됨.", "connections": "양자 센싱, 자기 도메인 이미지, 응집물질물리 실험 기법."}], "english_summary": ["Electric field-induced magnetization reversal is demonstrated in Co-doped BiFeO3 nanodots.", "Combined PFM and scanning NV-center magnetometry allow nanoscale visualization of domain switching.", "The study confirms that polarization switching is coupled to magnetization reversal in 190 nm structures.", "This provides a concrete pathway for developing voltage-controlled magnetic memory devices."]}}, {"title": "Exploring the third dimension in quantum confinement of surface electrons", "journal": "Science_Advances", "source": "Gemini", "link": "https://doi.org/10.1126/sciadv.aed3926", "authors": "Lu Lyu, Tobias Eul, Wei Yao, et al.", "last_authors": "Martin Aeschlimann, Benjamin Stadtmüller", "summary": "Quantum confinement of surface electrons in two-dimensional metal-organic networks offers a powerful route to engineer electronic states for quantum and spintronic technologies. Here, we demonstrate the pivotal role of vertical variations in the surface potential on the quantum confinement of surface electrons. We investigate the confinement of both Shockley surface state and image-potential state electrons with their distinct vertical electron density distributions in a Cu-T4PT network on Cu(111). We find a substantial renormalization of the band mass of the image state, whereas the Shockley state remains almost unchanged. This notable divergence arises from the distinct three-dimensional potential landscape of the Cu-T4PT network, with a strong repulsive potential at the vertical position of the molecular backbone and leaky channels beneath the Cu coordination spheres. Our findings demonstrate the essential role of vertical potential engineering in designing quantum-confined states, thereby advancing control over electronic properties and quantum phenomena at the nanoscale.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Studies quantum confinement of surface electrons and electronic state engineering, relevant to surface science.", "tags": ["surfacescience", "quantumconfinement", "electronicstructure", "spintronics", "2Dmaterials"], "image": "", "briefing": {"background": "금속 표면의 전자 상태(Shockley 상태 등)는 표면의 전위 변화에 민감하며, 2차원 네트워크를 통해 이를 인위적으로 제어하는 것은 양자 및 스핀트로닉스 소자 설계의 기초가 됩니다.", "motivation": "2차원 금속-유기물 네트워크(Cu-T4PT) 내에서 수직적인 전위 변화(3차원적 변동)가 표면 전자의 양자 구속에 어떤 영향을 미치는지 규명하고자 합니다.", "result": "Shockley 표면 상태와 이미지-전위 상태가 서로 다른 수직 전하 분포를 가지며, 이로 인해 분자 구조의 수직적 전위가 이미지 상태의 밴드 질량을 크게 재규격화(renormalization)함을 발견했습니다.", "implication": "표면 전자의 특성을 설계할 때 수평적 배치뿐만 아니라 수직적 전위 프로파일을 정밀하게 엔지니어링해야 함을 시사합니다.", "novelty": "2차원 네트워크의 밴드 구조 변화가 단순한 수평적 구속이 아닌, 분자 백본의 수직적 위치와 기판 사이의 3차원적 전위 상호작용에 기인함을 밝혀낸 점이 중요합니다.", "unresolved": "네트워크의 복잡한 3차원 전위 구조가 다른 전자적 상태(예: 초전도성 또는 위상학적 상태)에 미치는 영향은 추가 연구가 필요합니다.", "future_work": "다양한 분자 네트워크를 활용하여 밴드 질량 제어 외의 전자 상태 엔지니어링 실험이 수행될 것으로 보입니다.", "concepts": [{"term": "Shockley 표면 상태", "why_emerged": "금속 결정 표면의 갑작스러운 종단으로 인해 생기는 전자 상태를 이해하기 위해 필요.", "origin": "1939년 William Shockley에 의해 이론적으로 예견됨.", "connections": "표면 물리, 금속 전자 구조, 2D 물질 계면."}, {"term": "이미지-전위 상태(Image-potential state)", "why_emerged": "진공 수준 직전에 존재하는 표면 전자 상태를 기술하기 위해 필요.", "origin": "1970년대 표면 전자 산란 실험을 통해 확립됨.", "connections": "표면 전자 재구성, 밴드 질량 재규격화, STM 분광학."}], "english_summary": ["The vertical variation of surface potential in 2D metal-organic networks significantly affects electron quantum confinement.", "Distinct vertical charge distributions lead to different renormalization of Shockley and image-potential states.", "The findings highlight the importance of 3D potential engineering for designing electronic properties at surfaces.", "Cu-T4PT/Cu(111) is used as a model system to verify these 3D confinement effects."]}}, {"title": "Probing and controlling coherent and incoherent dynamics of phase transitions via multipulse excitation", "journal": "Science_Advances", "source": "Gemini", "link": "https://doi.org/10.1126/sciadv.aef8585", "authors": "Feng-Wu Guo, Wen-Hao Liu, Zhi Wang, et al.", "last_authors": "Lin-Wang Wang, Jun-Wei Luo", "summary": "Ultrafast laser pulses can selectively induce either wide-sized coherent or localized incoherent dynamics in solids, yet harnessing these complex dynamics to achieve controlled phase transitions remains challenging. Here, we use real-time time-dependent density functional theory (rt-TDDFT) to investigate a double-pulse laser scheme in VO 2 , elucidating the roles of these two distinct types of dynamics and proposing two more energy-efficient phase transition routes. In the first scenario, a weak initial pulse induces coherent oscillations of V-V dimers. When the second pulse is applied at the dimer stretching time, transient bandgap narrowing enhances carrier excitation, thereby reducing the total laser fluence required for the phase transition. In the second scenario, a stronger but subthreshold first pulse activates localized structural distortions resembling photoinduced polarons. A subsequent long-wavelength pulse promotes accumulation and spatial propagation of the polarons, ultimately triggering a global phase transition. Our findings establish multipulse excitation as an energy-efficient and general approach for controlling structural phase transitions and disentangling distinct ultrafast dynamics in solids.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Theory (rt-TDDFT) on ultrafast dynamics and phase transitions in the correlated material VO2, with experimental implications.", "tags": ["ultrafastdynamics", "phasetransition", "correlatedelectronsystems", "VO2", "DFT"], "image": "", "briefing": {"background": "강상관계 물질인 VO2와 같은 물질의 초고속 상전이 제어는 응집물질물리학의 난제 중 하나로, 레이저를 이용한 에너지 효율적인 위상 전환 메커니즘을 밝히는 것이 중요합니다.", "motivation": "일반적인 단일 펄스 대신 다중 펄스 기법을 활용하여 VO2의 상전이 과정에서 발생하는 결맞은(coherent) 및 결맞지 않은(incoherent) 동역학을 각각 제어할 수 있는지 확인하고자 합니다.", "result": "rt-TDDFT 시뮬레이션을 통해 V-V 이량체의 결맞은 진동을 유도하거나 극성자(polaron)의 공간적 전파를 촉진하는 두 가지 경로를 제시하여, 전체 레이저 에너지 소모를 줄이는 상전이 메커니즘을 규명했습니다.", "implication": "초고속 스위칭 소자의 에너지 효율을 극대화할 수 있는 새로운 레이저 조작 기법을 제공하며, 복잡한 상전이 동역학을 분리하여 해석할 수 있음을 보여줍니다.", "novelty": "단순한 열적 상전이가 아닌 결맞은/결맞지 않은 동역학의 분리 제어를 이론적으로 제시하여 실험적 검증 가능성을 크게 높였습니다.", "unresolved": "실제 실험적 환경에서의 펄스 정렬 정확도와 샘플의 불균일성이 결과에 미치는 영향은 시뮬레이션에서 완벽히 고려되지 않았을 수 있습니다.", "future_work": "실제 VO2 박막 등을 이용한 펨토초 레이저 펌프-프로브 실험을 통한 검증이 이어질 것으로 기대됩니다.", "concepts": [{"term": "rt-TDDFT", "why_emerged": "강상관계 물질의 초고속 비평형 동역학을 시간에 따라 추적하기 위해 필요함.", "origin": "Runge와 Gross의 1984년 정리를 바탕으로 발전.", "connections": "시간 분해 분광학, 전자 상관계, 강상관 물질."}, {"term": "극성자(Polaron)", "why_emerged": "고체 내 전자가 격자 변형을 동반하며 이동하는 현상을 기술하기 위해 필요.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "전자-포논 상호작용, 전하 이동, 강상관계."}], "english_summary": ["Multipulse excitation is proposed as an energy-efficient method for triggering phase transitions in VO2.", "rt-TDDFT simulations reveal two distinct routes: dimer oscillation control and polaron spatial propagation.", "The scheme allows selective excitation of coherent and incoherent dynamics.", "This approach provides a framework for disentangling complex ultrafast phase transition processes."]}}, {"title": "Projected altermagnetism by symmetry reduction at surfaces and in thin films", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2606.18964", "authors": "Sopheak Sorn, Charanpreet Singh, Lukasz Plucinski, Gustav Bihlmayer, Yuriy Mokrousov, Wulf Wulfhekel", "last_authors": "Yuriy Mokrousov, Wulf Wulfhekel", "summary": "arXiv:2606.18964v1 Announce Type: new Abstract: Altermagnets are a newly identified class of magnetic materials that combine vanishing net magnetization within the unit cell with spin-split electronic states. Their theoretical description relies on symmetry properties of the bulk band structure. Surfaces and thin films, however, inherently break these symmetries. Here, we investigate the consequences of such symmetry reduction for the electronic structure of bulk altermagnets near the surface and of thin films. When the surface coincides with a symmetry plane of the bulk altermagnetic order, the resulting two-dimensional Brillouin zone exhibits spin-degenerate bands, corresponding to conventional antiferromagnetic behavior. In all other cases, the symmetry of the altermagnetic order is reduced, leading to modified spin splitting. Remarkably, we discover a thin-film geometry of a $g$-wave altermagnet with a particular surface orientation that enables a $d$-wave spin splitting, which is commonly accompanied by the spin-splitter effect, suggesting the functionalization of non-$d$-wave altermagnets by surfaces. Our findings demonstrate that symmetry breaking at surfaces and in thin films fundamentally reshapes altermagnetic spin textures, providing a tunable platform for controlling spin-dependent electronic phenomena.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Relevant theoretical study on altermagnetism in surface/thin-film geometry.", "tags": ["altermagnetism", "bandstructure", "symmetry"], "image": "https://arxiv.org/html/2606.18964v1/x1.png", "briefing": {"background": "알터마그넷(Altermagnet)은 순자화가 없음에도 불구하고 비자성 결정 대칭성에 의해 스핀 분리(spin-splitting)가 일어나는 새로운 자기 질서 상태입니다. 벌크에서의 스핀 텍스처는 이미 활발히 연구되고 있으나, 실제 소자 구현을 위한 표면 및 박막 박막 형상에서의 대칭성 붕괴 효과는 중요한 변수입니다.", "motivation": "벌크 알터마그넷의 대칭성이 표면과 박막에서 어떻게 변형되는지, 그리고 이로 인한 전자 구조 및 스핀 분리 패턴의 변화를 이론적으로 체계화하고자 함.", "result": "표면이 벌크의 대칭면과 일치하면 스핀 축퇴가 복원되어 일반적인 반강자성체처럼 행동하지만, 대칭면과 어긋나면 스핀 분리 패턴이 변합니다. 특히 g-wave 알터마그넷의 특정 박막 형상에서 d-wave 스핀 분리가 유도됨을 발견했습니다.", "implication": "표면/박막 엔지니어링을 통해 알터마그넷의 스핀 분리 특성을 튜닝할 수 있으며, 이는 비-d-wave 물질을 기능성 스핀 소자로 활용할 수 있는 가능성을 제시합니다.", "novelty": "벌크 대칭성에 의존하던 기존의 알터마그넷 정의를 저차원 시스템의 대칭성 붕괴 관점에서 재해석하여, 스핀 텍스처 조절을 위한 설계 가이드를 제공합니다.", "unresolved": "이론적 예측이 실제 ARPES나 STM 측정에서 요구되는 정밀한 결정 표면 제작 및 도메인 제어를 통해 실험적으로 입증되어야 합니다.", "future_work": "제시된 특정 박막 형상에서의 스핀 의존 전자 구조를 검증하기 위한 ARPES 연구 및 실제 소자 구현 시의 스핀 수송 특성 측정.", "concepts": [{"term": "Altermagnet", "why_emerged": "기존의 강자성(넷 자화)과 반강자성(스핀 분리 없음) 범주에 속하지 않는 제3의 자성 상태 규명을 위해.", "origin": "2020년대 초반 (주로 Libor Smejkal 및 동료들)", "connections": "반강자성체, 스핀-궤도 결합, d-wave 초전도체 이론과 연관"}, {"term": "Spin-splitting", "why_emerged": "자성체 내에서 에너지 밴드가 스핀 성분에 따라 분리되는 물리적 현상을 설명하기 위해.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "제만 효과, Rashba 효과, 스핀-궤도 토크(SOT)"}], "english_summary": ["Altermagnets exhibit spin-split bands despite zero net magnetization in the bulk.", "Surface symmetry breaking in films can suppress or fundamentally transform these spin textures.", "The authors show that g-wave altermagnets can manifest d-wave spin splitting in specific film geometries.", "This provides a route to functionalize non-d-wave altermagnets for spintronic applications."]}}, {"title": "Ultrafast optical route to coupled ferroelectric and altermagnetic switching", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2603.22848", "authors": "Yuhao Gu, Yu-Hui Song, Peng-Jie Guo, et al.", "last_authors": "Huan-Cheng Yang, Zhong-Yi Lu", "summary": "arXiv:2603.22848v2 Announce Type: replace Abstract: Exploring novel magnetoelectric coupling mechanisms to achieve control of ferroelectric polarization and magnetism is highly significant for both fundamental science and electronic device applications. Although extensive studies have been conducted on electrical switching of magnetism in multiferroic materials, simultaneous ultrafast laser switching of ferroelectric polarization and altermagnetism remains unexplored. In this letter, we propose that the ultrafast laser can be used to switch ferroelectric polarization and altermagnetism concurrently in charge-order-induced altermagnetic ferroelectrics. Building on this idea, we further demonstrate that such dual switching can be realized in charge-order-induced altermagnetic ferroelectric LiV$_2$F$_6$ by symmetry analysis and time-dependent density functional theory (TDDFT) calculation. Given that LiV$_2$F$_6$ has already been experimentally synthesized, our work not only provides an ideal material platform for experimentally realizing simultaneous switching of ferroelectric polarization and altermagnetism but a  "물질 내 스핀과 격자의 상호작용(Spin-lattice coupling)은 물질의 물리적 성질을 결정짓는 핵심 요소입니다. 최근에는 격자 진동인 포논(phonon)에 각운동량이 부여된 '키랄 포논(Chiral phonon)'에 대한 연구가 활발합니다.", "motivation": "스핀-격자 결합이 어떻게 결정의 키랄성(Chirality)을 유도하고, 이것이 라만 원편광 이색성(Raman Circular Dichroism)이라는 광학적 신호로 어떻게 발현되는지 이론적으로 규명하고자 합니다.", "result": "스핀-격자 상호작용이 특정 모드의 포논에 각운동량을 부여하여 키랄 포논을 발생시키며, 이들이 라만 산란 실험에서 원편광을 선택적으로 흡수/방출하는 패턴을 형성함을 확인했습니다.", "implication": "라만 분광학을 사용하여 자성 물질 내의 미세한 격자-스핀 결합 및 키랄성 상태를 비파괴적으로 진단할 수 있는 강력한 툴을 제공합니다.", "novelty": "포논의 키랄성을 스핀-격자 결합이라는 근본적 상호작용과 연결하고, 실험적으로 관측 가능한 라만 신호를 도출했다는 점이 주목할 만합니다.", "unresolved": "실험 데이터가 아닌 이론적 예측에 의존하고 있어, 실제 물질에서의 신호 강도나 배경 잡음과의 분리 가능성에 대한 논의가 필요합니다.", "future_work": "자성 위상 물질(Magnetic topological materials)에서 키랄 포논의 비정상적 라만 거동을 직접 측정하는 실험 연구.", "concepts": [{"term": "Chiral Phonon", "why_emerged": "격자의 회전 운동이 각운동량을 가질 때 이를 양자화하여 설명하기 위해 도입됨.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "포논 홀 효과(Phonon Hall effect), 토폴로지컬 포노닉스."}, {"term": "Raman Circular Dichroism", "why_emerged": "물질의 구조적 또는 자기적 키랄성을 광학적으로 구별하기 위해 고안됨.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "자기 광학 커 효과(MOKE), 원편광 이색성."}], "english_summary": ["Investigates spin-lattice coupling as a driver for chiral phonons.", "Connects internal spin interactions to the emergence of phonon angular momentum.", "Identifies Raman circular dichroism as a direct probe for chiral vibrational modes.", "Offers a new spectroscopic approach to study magnetic and structural chirality."]}}, {"title": "Excitonic spin torque in a magnetic semiconductor", "journal": "Nature_Materials", "source": "Gemini", "link": "https://www.nature.com/articles/s41563-026-02643-1", "authors": "Nicholas J. Brennan, Jiacheng Tang, Jalil Varela-Manjarres, et al.", "last_authors": "Yafei Ren, Youn Jue Bae", "summary": "Nature Materials, Published online: 15 June 2026; doi:10.1038/s41563-026-02643-1 Distinct magnon dynamics are observed at high excitation pump power in the two-dimensional antiferromagnetic semiconductor CrSBr, ron systems.", "Serves as a reflection on the progress and intellectual contributions of the field over recent decades."]}}, {"title": "Bilateral hydrogenation-induced high-Chern-number quantum anomalous Hall state in monolayer Cr2Ge2Te6", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/vjm5-xhl7", "authors": "Xiang Li, Xin-Wei Yi, Jing-Yang You, et al.", "last_authors": "Gang Su, Bo Gu", "summary": "Author(s): Xiang Li, Xin-Wei Yi, Jing-Yang You, Jia-Wen Li, Qing-Han Yang, Gang Su, and Bo Gu The pursuit of high-temperature quantum anomalous Hall (QAH) insulators faces fundamental challenges, including narrow topological gaps and low Curie temperatures (${T}_{\\text{C}}$) in existing materials. Here, we propose a transformative strategy using bilateral hydrogenation to engineer a robust Q… [Phys. Rev. B 113, 224430] Published Tue Jun 16, 2026", "tier": "B_IMPORTANT_CONDMAT", "score": "7", "reason": "Proposes high-Chern-number QAH in a 2D vdW magnet, relevant to topological interests.", "tags": ["quantumanomalousHall", "vanderWaals", "monolayer"], "image": "", "briefing": {"background": "양자 변칙 홀 효과(QAH)는 외부 자기장 없이도 위상학적 경계 상태를 유도하여 에너지 소모 없는 전하 수송을 가능케 합니다. 이를 고온에서 구현하는 것은 위상 물질 및 양자 소자 연구의 핵심 목표입니다.", "motivation": "기존 QAH 물질들이 낮은 큐리 온도와 좁은 위상학적 갭으로 인해 실제 응용이 어려운 점을 극복하고자, 2D van der Waals 자성 물질인 Cr2Ge2Te6에 수소화 공정을 도입하는 전략을 제안합니다.", "result": "양면 수소화(bilateral hydrogenation)를 통해 Cr2Ge2Te6의 전자 구조를 조절하고, 결과적으로 더 높은 큐리 온도에서 고-천 수(high-Chern-number) QAH 상태를 구현할 수 있음을 이론적으로 입증했습니다.", "implication": "수소화 공정이 위상학적 특성을 튜닝하는 효과적인 도구임을 보였으며, 차세대 저전력 양자 소자 개발을 위한 새로운 플랫폼을 제시했습니다.", "novelty": "vdW 물질의 위상학적 특성을 화학적 수식(수소화)으로 제어했다는 점이 독창적이며, 독자의 주된 관심사인 2D 위상 자성체 연구와 밀접합니다.", "unresolved": "실제 실험에서의 수소화 공정 제어 정밀도와 샘플의 안정성 확보가 관건입니다.", "future_work": "실제 실험적 합성과 ARPES를 통한 밴드 구조 및 큐리 온도 변화의 직접적인 관찰이 필요합니다.", "concepts": [{"term": "양자 변칙 홀 효과 (QAH)", "why_emerged": "외부 자기장 없이 전도 특성을 제어하는 위상학적 상태를 통해 소자의 효율성을 높이기 위해 필요.", "origin": "2013년 Xue Qikun 그룹이 자기 도핑된 위상 절연체에서 실험적으로 최초 관측.", "connections": "위상 절연체, Berry 곡률, 자성 위상 물질."}, {"term": "천 수 (Chern number)", "why_emerged": "에너지 밴드의 위상학적 성질을 정량화하여 경계 상태의 존재 여부를 예측하기 위해 도입.", "origin": "Chern-Simons 이론과 관련하여 정립됨.", "connections": "양자 홀 효과, 위상 불변량, Edge states."}], "english_summary": ["Proposes bilateral hydrogenation to engineer high-Chern-number QAH in monolayer Cr2Ge2Te6.", "Addresses current limitations of narrow topological gaps and low Curie temperatures in QAH insulators.", "Suggests a potential pathway for room-temperature topological electronics using 2D vdW magnets."]}}, {"title": "Boosted magnetic fluctuations at the onset of superconductivity in UTe2 beyond 40 T", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/3hzr-5qcs", "authors": "T. Thebault, K. Somesh, G. Lapertot, M. Nardone, A. Zitouni, M. Barragan, et al.", "last_authors": "D. Aoki, G. Knebel, D. Braithwaite, and W. Knafo", "summary": "Author(s): T. Thebault, K. Somesh, G. Lapertot, M. Nardone, A. Zitouni, M. Barragan, J. Béard, J. Billette, F. Lecouturier-Dupouy, S. Tardieu, D. Aoki, G. Knebel, D. Braithwaite, and W. Knafo Multiple triplet-candidate unconventional superconducting phases have been reported in the heavy-fermion compound UTe 2 . Here, the authors find an enhancement of the electrical resistivity Fermi liquid coefficient A at a metamagnetic transition preceding the onset of superconductivity in magnetic fields higher than 40 T. The enhancement of A is attributed to a magnetic fluctuation mode probably in play for the mechanism of this superconducting phase. [Phys. Rev. B 113, L220503] Published Mon Jun 15, 2026", "tier": "B_IMPORTANT_CONDMAT", "score": "7", "reason": "High-field study of UTe2, relevant for unconventional superconductor research.", "tags": ["superconductivity", "heavyfermion", "magnetism"], "image": "", "briefing": {"background": "UTe2는 강한 전자 상관관계와 삼중항(triplet) 초전도 가능성으로 인해 비전통적 초전도 연구의 최전선에 있는 물질입니다. 특히 극한 환경에서의 상태 변화는 초전도 메커니즘을 밝히는 중요한 실마리를 제공합니다.", "motivation": "UTe2에서 관측되는 여러 초전도 상과 고자기장 하에서의 metamagnetic 전이 사이의 연관성을 규명하여 비전통적 초전도 기작을 이해하고자 합니다.", "result": "40T 이상의 고자기장 조건에서 metamagnetic 전이 직전에 Fermi liquid 계수 A가 증폭됨을 발견했습니다. 이는 자기적 요동이 초전도 쌍 형성에 기여함을 암시하는 강력한 증거입니다.", "implication": "UTe2의 고자기장 초전도 상이 단순한 궤도 효과가 아닌 자기적 요동에 의해 매개될 가능성이 높음을 시사하며, 비전통적 초전도 이론 확립에 중요한 데이터가 됩니다.", "novelty": "40T가 넘는 극단적인 자기장 환경에서의 정밀한 수송 현상 측정은 UTe2의 물리적 이해도를 높이는 데 결정적인 정보를 제공합니다.", "unresolved": "관측된 자기 요동과 초전도 상태 사이의 정량적인 관계와, 다른 비전통적 초전도체와의 보편성 여부는 추가 연구가 필요합니다.", "future_work": "중성자 산란 연구를 통한 자기 요동 모드의 직접적인 확인과 다른 고자기장 수송 측정 및 이론 모델과의 비교 연구가 예상됩니다.", "concepts": [{"term": "비전통적 초전도", "why_emerged": "BCS 이론(포논 매개)으로 설명되지 않는 고온 및 강상관 초전도 현상을 이해하기 위해 등장.", "origin": "1970년대 후반 중성자별 및 액체 3He 연구에서 영감을 얻음.", "connections": "무거운 페르미온, 스핀-삼중항, 자기적 요동."}, {"term": "Metamagnetic 전이", "why_emerged": "강한 자기장 하에서 자성 상태가 급격히 변화하는 현상을 해석하기 위해 필요.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "강상관 전자계, 란다우 페르미 액체 이론의 붕괴."}], "english_summary": ["Reports enhanced Fermi liquid coefficient A at metamagnetic transitions in UTe2 under fields exceeding 40 T.", "Links the enhancement to magnetic fluctuations acting as a pairing mechanism for superconductivity.", "Provides significant insight into the nature of unconventional, likely triplet, superconductivity in heavy-fermion systems."]}}, {"title": "Contrasting field-driven behaviors of incommensurate and commensurate antiferromagnetic phases in Al/Ga-doped MnNiGe alloys", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/f1bp-ccmy", "authors": "Riya Roy, Sanat Kumar Adhikari, Rosni Roy, et al.", "last_authors": "Rajib Mondal, Souvik Chatterjee", "summary": "Author(s): Riya Roy, Sanat Kumar Adhikari, Rosni Roy, Jhuma Sannigrahi, Dmitry Khalyavin, Devashibhai T. Adroja, Rajib Mondal, and Souvik Chatterjee The Ge-site-doped MnNiGe alloys with nominal compositions ${\\mathrm{MnNiGe}}_{0.9}{\\mathrm{Al}}_{0.1}$ and ${\\mathrm{M fine the role of thermal-fluctuation from a source of decoherence to a resource for coherent-state engineering. While preliminary signs of counterintuitive temperature-rise-triggered superconductivity manifested in CeCu2Si2, ErRh4B4, Ho1.2Mo6S8 and (La,Ce)Al2, their critical-temperatures (Tc-inv) remain below Kelvin-range, precluding substantial applications. Here, we report field-modulated inverse-superconducting-transitions above 4He-cooling-limit in Eu-based infinite-layer nickelates (EuxNd1-xNiO2 and EuxPr1-xNiO2) grown on a substrate under both overdoped and underdoped regimes. Paradigmatically, superconductivity with zero-resistance is confined between Tc-inv (2.6-5.4 K) and another higher normal-Tc, rising and decreasing with applied magnetic-field, respectively. Starting from the resistive-state below Tc-inv, the inverse-superconducting-transition is driven by not only temperature-rising, but also current-density, while superconductivity further vanishes at higher temperature and current thresholds. The Kelvin-range inverse superconducting transition is plausibly explained by temperature-induced alternating dominance of effective magnetic-fields arising from Eu2+4f7 related compensations relative to the upper-critical-field. Furthermore, an extended-phenomenological-framework is also supported by reemerged superconductivity below 300 mK under magnetic-field, giving rise to an unprecedented temperature-induced reentrant superconductivity. Our findings establish magnetic-interaction-reconfigured high-Tc systems as fertile platforms for exploring quantum phenomena that reverse thermal-decoherence paradigm, also enabling antithetical-designs to unlock untapped application-scenarios for quantum-phase-transition devices.", "tier": "C_MAYBE", "score": "9", "reason": "Reports a field-modulated inverse superconducting transition in infinite-layer nickelate thin films.; tier capped to C: formal/generic theory watch", "tags": ["experiment", "superconductivity", "nickel
