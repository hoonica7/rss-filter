<!DOCTYPE html>

<head>
<meta charset='UTF-8'>
<meta name='viewport' content='width=device-width, initial-scale=1.0'>
<title>Daily Paper Slideshow</title>
<style>
  :root {
    color-scheme: light;
    --bg: #f6f7f4;
    --paper: #ffffff;
    --ink: #111827;
    --muted: #64748b;
    --line: #d8ddd2;
    --accent: #176b87;
    --accent-2: #9a3412;
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; overflow: auto; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: var(--bg); color: var(--ink); }
  .shell { max-width: 1500px; min-height: 100vh; margin: 0 auto; padding: 14px 18px; display: flex; flex-direction: column; }
  .topbar { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 16px; }
  .top-actions { display: flex; align-items: center; gap: 10px; }
  .topbar a, button { border: 1px solid var(--line); border-radius: 8px; background: var(--paper); color: var(--ink); padding: 10px 14px; font-weight: 700; text-decoration: none; cursor: pointer; }
  button.primary { background: var(--accent); border-color: var(--accent); color: white; }
  button:disabled { opacity: 0.45; cursor: not-allowed; }
  .counter { color: var(--muted); font-weight: 700; }
  .slide { min-height: calc(100vh - 82px); background: var(--paper); border: 1px solid var(--line); border-radius: 10px; padding: 18px; box-shadow: 0 18px 42px rgba(15, 23, 42, 0.10); display: grid; grid-template-columns: minmax(310px, 0.86fr) minmax(0, 1.55fr); gap: 18px; overflow: visible; }
  .paper-head { min-width: 0; min-height: 0; overflow: visible; display: flex; flex-direction: column; gap: 12px; }
  .figure { margin: 0; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: #f8fafc; }
  .figure img { display: block; width: 100%; max-height: 41vh; object-fit: contain; background: white; }
  .figure figcaption { padding: 7px 10px; color: var(--muted); font-size: 12px; line-height: 1.3; }
  .head-text { display: flex; flex-direction: column; gap: 9px; min-width: 0; }
  .badges { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .badge { border-radius: 999px; padding: 5px 9px; background: #eef2ff; color: #3730a3; font-size: 12px; font-weight: 800; }
  .score { background: #fee2e2; color: #991b1b; }
  h1 { margin: 0; font-size: 25px; line-height: 1.15; letter-spacing: 0; overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
  h1 a { color: inherit; text-decoration-color: rgba(23, 107, 135, 0.35); text-decoration-thickness: 2px; text-underline-offset: 4px; }
  h1 a:hover { color: var(--accent); text-decoration-color: var(--accent); }
  .meta, .authors, .why, .abstract { font-size: 13px; line-height: 1.45; }
  .meta, .authors { color: var(--muted); }
  .why strong, .abstract strong, .authors strong { color: var(--ink); }
  .authors { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .why { border-left: 4px solid var(--accent-2); padding-left: 10px; color: #374151; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .abstract { border-top: 1px solid var(--line); padding-top: 14px; color: #374151; }
  .original-abstract { border-top: 1px solid var(--line); padding-top: 10px; color: #374151; font-size: 11.5px; line-height: 1.35; overflow-wrap: anywhere; }
  .original-abstract strong { display: block; margin-bottom: 4px; color: var(--ink); }
  .tags { display: flex; flex-wrap: wrap; gap: 8px; }
  .tag { border-radius: 999px; padding: 4px 8px; background: #f1f5f9; color: #475569; font-size: 12px; font-weight: 700; }
  .head-text > .link { display: none; }
  .briefing { min-width: 0; min-height: 0; overflow: visible; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); grid-auto-rows: minmax(0, auto); align-content: start; gap: 11px 18px; border-top: 0; padding-top: 0; }
  .brief-section { min-width: 0; }
  .brief-section.wide { grid-column: 1 / -1; }
  .brief-section h2 { margin: 0 0 4px; font-size: 14px; line-height: 1.22; color: #0f766e; letter-spacing: 0; }
  .brief-section p, .brief-section li { margin: 0; font-size: 12.5px; line-height: 1.42; color: #1f2937; overflow-wrap: anywhere; }
  .brief-section ul { margin: 0; padding-left: 20px; }
  .concepts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 9px 14px; }
  .concept { border-top: 1px solid var(--line); padding-top: 7px; }
  .concept h3 { margin: 0 0 4px; font-size: 13px; color: #7c2d12; letter-spacing: 0; }
  .concept p { margin: 2px 0 0; font-size: 11.5px; line-height: 1.35; color: #374151; overflow-wrap: anywhere; }
  .concept b { color: #111827; }
  .link { color: var(--accent); font-weight: 800; text-decoration: none; }
  .empty { padding: 48px; background: var(--paper); border: 1px solid var(--line); border-radius: 12px; color: var(--muted); }
  @media (max-width: 860px) {
    .shell { padding: 14px; }
    .topbar, .top-actions { align-items: stretch; flex-direction: column; }
    .slide, .briefing, .concepts { grid-template-columns: 1fr; }
    .slide { min-height: auto; overflow: visible; display: grid; }
    h1 { font-size: 28px; }
  }
</style>

<script>
const slides = [{"title": "Quasi-one-dimensional topological band structure and van Hove singularities in monolayer TaIrTe4 from laser -ARPES", "journal": "arXiv_CondMat", "source": "keyword", "link": "https://arxiv.org/abs/2608.20978", "authors": "Honey Boban, Tanguy Prongu\\'e, Amarjyoti Choudhury, et al.", "last_authors": "Anna Tamai, Felix Baumberger", "summary": "Recent transport experiments reported a quantum spin Hall insulator phase in monolayer 1T-TaIrTe$_4$ gated away from charge neutrality. This phase is not predicted by band structure calculations and has been attributed to an electronic instability induced by strong correlations at a putative van Hove singularity. Here, we investigate the electronic structure of exfoliated monolayer 1T-TaIrTe$_4$ using micro-focus laser angle resolved photoemission. We find a strongly anisotropic band structure susceptible to density wave instabilities. Our data further reveal a saddle point singularity in the density of states. However, we find that the saddle point lies at a density for which transport experiments found no anomalies. Moreover, the quasiparticle line widths suggest weak electron correlations only. This points to a secondary role of van Hove singularities and electron correlations in the transport phase diagram of monolayer 1T-TaIrTe$_4$.", "tier": "A_MUST_READ", "score": "10", "reason": "title strong match: ARPES", "tags": ["ARPES", "photoemission", "quantumspinHall", "quasi-one-dimensional", "monolayer", "topological", "transport", "bandstructure"], "image": "https://arxiv.org/html/2608.20978v1/fig1.png", "briefing": {"background": "위상 절연체 및 양자 스핀 홀(QSH) 절연체는 밴드 구조의 위상적 성질로 인해 에지 채널에서 소산 없는 전류 흐름이 가능하여 차세대 전자소자로 주목받고 있습니다.", "motivation": "단층 TaIrTe4에서 보고된 QSH 위상이 기존 밴드 계산과 일치하지 않고 강상관 효과에 의한 것이라는 가설을 직접적인 전자 구조 측정을 통해 검증하고자 함.", "result": "레이저 ARPES 측정 결과, 밴드 구조는 준 1차원적 이방성을 보이며 반 호브 특이점(vHs)이 존재함을 확인했으나, 이 특이점의 위치가 수송 실험에서 나타난 이상 현상과 불일치하고 상관관계 강도 또한 약한 것으로 밝혀짐.", "implication": "TaIrTe4의 QSH 위상 기원이 단순한 vHs 유도 전자 불안정성이나 강상관 효과 때문이 아님을 시사하며, 기존 수송 모델의 재검토가 필요함.", "novelty": "마이크로 ARPES를 통해 단층 물질의 국소 전자 구조를 직접 관측하여, 이론적으로 예측된 상관관계 기반의 QSH 메커니즘에 직접적인 제동을 건 연구임.", "unresolved": "그렇다면 왜 수송 실험에서 QSH와 같은 위상적 이상 현상이 관찰되었는지에 대한 명확한 미시적 메커니즘이 여전히 불분명함.", "future_work": "QSH 위상이 관찰된 게이트 전압 범위에서의 추가적인 스핀 분해 광전자 분광법이나 다른 위상 기저 원인을 찾기 위한 정밀 계산이 필요함.", "concepts": [{"term": "Quantum Spin Hall (QSH)", "why_emerged": "시간 반전 대칭성이 보존되는 상태에서 위상적 밴드 구조를 통해 스핀-운동량 고정 에지 상태를 구현하기 위해 필요함.", "origin": "Kane과 Mele (2005)에 의해 제안됨.", "connections": "위상 절연체, 스핀 홀 효과, 이방성 밴드 구조."}, {"term": "van Hove Singularity (vHs)", "why_emerged": "상태 밀도(DOS)의 발산 현상이 격자 구조와 밴드 이방성에 미치는 영향을 해석하기 위해 도입됨.", "origin": "Leon Van Hove (1953)에 의해 제안됨.", "connections": "밀도 파 불안정성, 고온 초전도, 페르미 면 토폴로지."}, {"term": "Micro-focus Laser ARPES", "why_emerged": "박리된 마이크로미터 단위의 단층 시료에서 고해상도 전자 구조 정보를 얻기 위해 개발됨.", "origin": "Felix Baumberger 그룹 등의 실험적 확립.", "connections": "나노 ARPES, 각분해 광전자 분광법."}], "english_summary": ["The study investigates monolayer 1T-TaIrTe4 using micro-focus laser ARPES.", "The researchers found evidence of a van Hove singularity but at energetic positions inconsistent with previous transport anomalies.", "Quasiparticle linewidths suggest the system is not strongly correlated.", "These results challenge the consensus that correlations or vHs drive the observed topological insulator phase in this material."]}}, {"title": "Band structure of Na2KSb: Near-band-gap photoemission spectroscopy and density functional theory calculations", "journal": "PRB_Recent", "source": "keyword", "link": "http://link.aps.org/doi/10.1103/n3js-g2bn", "authors": "S. A. Rozhkov, V. V. Bakin, S. V. Eremeev, V. S. Rusetsky, V. A. Golyashov, D. A. Kustov, D. K. Orekhov, H. E. Scheibler, V. L. Alperovich, and O. E. Tereshchenko", "last_authors": "D. K. Orekhov, H. E. Scheibler, V. L. Alperovich, and O. E. Tereshchenko", "summary": "The electronic band structure of ${\\mathrm{Na}}_{2}\\mathrm{KSb}$ was studied by a combination  "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2608.21250", "authors": "Jun Shu, Jun Shen, Yanmin Zhang, et al.", "last_authors": "Ruidan Zhong, Ge He", "summary": "Electron-phonon coupling is usually understood in terms of electronic quasiparticles interacting with dispersive lattice vibrations. Much less is known about the complementary limit in which the relevant phonon mode is itself localized or weakly dispersive. Here we investigate this regime in the kagome compound Rb$_{2}$Ni$_{3}$S$_{4}$, which undergoes an unconventional insulating transition near $T^{*} \\approx$ 260-280~K. Combining polarization-resolved Raman spectroscopy with temperature-dependent x-ray diffraction, scanning tunneling microscopy, and electrical, thermal, and magnetic measurements, we show that the transition involves electronic localization without a conventional structural or magnetic order parameter. Raman spectra reveal a giant Franck-Condon progression associated with a nearly dispersionless 333.7~cm$^{-1}$ phonon, decorated by an equally spaced comb-like fine structure with a characteristic spacing of 40.6~cm$^{-1}$. The comb spacing is insensitive to magnetic field, whereas its spectral weight is strongly field tunable. Rather than treating either hierarchy alone as pure phonon effect, we interpret their nested coexistence as evidence for a strongly coupled electron-vibrational manifold involving a localized lattice coordinate. These results identify dispersionless phonons as an active route to vibronic correlations in solids and suggest that such electron-vibrational self-trapping is closely associated with the insulating phase of Rb$_{2}$Ni$_{3}$S$_{4}$.", "tier": "B_IMPORTANT_CONDMAT", "score": "10", "reason": "Kagome lattice, insulating transition, STS, and electron-phonon coupling.; demoted from A: broad CM, not direct user/project hit", "tags": ["kagome", "STS", "phonon"], "image": "https://arxiv.org/html/2608.21250v1/Figure1.png", "briefing": {"background": "고체 물리학에서 전자-포논 상호작용은 일반적으로 분산이 큰 격자 진동과 전자 준입자 간의 결합으로 이해됩니다. 하지만 포논 모드가 국소적이거나 분산이 거의 없는 극한의 영역은 상대적으로 연구가 부족하며, 이는 강한 상관관계를 가진 전자계의 물성을 이해하는 데 중요한 공백입니다.", "motivation": "카고메 화합물 Rb2Ni3S4가 약 260~280 K 부근에서 겪는 비전통적인 절연체 전이를 규명하기 위해, 전자와 국소적 진동 모드 간의 상관관계를 조사하고자 했습니다.", "result": "구조적 또는 자기적 질서 매개변수 없이 전자가 국소화되는 현상을 발견했습니다. 특히 분산이 없는 333.7 cm^-1 포논 모드와 그에 결합된 40.6 cm^-1의 미세 구조(comb-like fine structure)를 통해 강하게 결합된 전자-진동 매니폴드의 증거를 제시했습니다.", "implication": "분산이 없는 포논(dispersionless phonons)이 고체 내부에서 전자-진동 상관관계를 유도하는 능동적인 경로가 될 수 있음을 시사하며, 이는 전자-진동 자기포획(self-trapping)이 절연체 전이의 핵심 기제임을 보여줍니다.", "novelty": "기존의 분산형 포논 기반 모델을 넘어, 카고메 격자 내의 국소적 모드가 전자적 상태(절연체 전이)를 결정한다는 '비브로닉 스펙트럼 계층구조'라는 새로운 관점을 제시했습니다.", "unresolved": "자기장에 따른 스펙트럼 무게 변화의 정확한 미시적 메커니즘과, 이 비브로닉 상관관계가 어떻게 장거리 절연체 상태를 유지하는지에 대한 이론적 설명이 필요합니다.", "future_work": "이러한 비브로닉 결합이 다른 카고메 물질이나 강상관 전자계에서 일반적인 현상인지 확인하기 위한 추가적인 분광학 및 이론적 모델링 연구가 필요합니다.", "concepts": [{"term": "비브로닉(Vibronic)", "why_emerged": "전자 상태와 분자/격자 진동 상태가 서로 분리되지 않고 강하게 결합된 상태를 기술하기 위해 필요.", "origin": "1930년대 분자 물리학의 Born-Oppenheimer 근사 탈피 과정에서 등장.", "connections": "Franck-Condon 원리, Jahn-Teller 효과."}, {"term": "Franck-Condon Progression", "why_emerged": "전자 전이 시 핵의 위치 변화에 따른 진동 준위 간의 전이 확률 분포를 설명하기 위해 필요.", "origin": "James Franck와 Edward Condon에 의해 1920년대 정립.", "connections": "광흡수 분광학, 전자-포논 결합 강도 측정."}], "english_summary": ["Rb2Ni3S4 exhibits an unconventional insulating transition without standard structural or magnetic order.", "Experimental evidence of a vibronic manifold involving localized, dispersionless 333.7 cm^-1 phonons.", "Fine comb-like structures reveal strong electron-vibrational self-trapping.", "Highlights dispersionless phonons as a key mechanism for electronic localization in kagome lattices."]}}, {"title": "Strain-control of electronic superlattice domains in CsV3Sb5", "journal": "npj_QuantumMaterials", "source": "Gemini", "link": "https://www.nature.com/articles/s41535-026-00933-0", "authors": "E. Sadrollahi, J. Almeida Mendes, N. Stilkerich, et al.", "last_authors": "T. Ritschel, J. Geck", "summary": "Strain-control of electronic superlattice domains in CsV 3 Sb 5", "tier": "B_IMPORTANT_CONDMAT", "score": "10", "reason": "Direct relevance to CsV3Sb5 kagome metal physics and CDW domains.; demoted from A: broad CM, not direct user/project hit", "tags": ["CsV3Sb5", "kagome", "CDW"], "image": "https://media.springernature.com/m685/springer-static/image/art%3A10.1038%2Fs41535-026-00933-0/MediaObjects/41535_2026_933_Fig1_HTML.png", "briefing": {"background": "CsV3Sb5와 같은 카고메 금속은 전하밀도파(CDW)와 초전도성의 경쟁 및 공존으로 인해 주목받고 있습니다. 이 물질에서 나타나는 CDW는 단순히 격자 왜곡을 넘어 전자적 초격자 도메인 구조를 형성하며, 이는 물질의 물리적 특성을 결정짓는 핵심 요소입니다.", "motivation": "CsV3Sb5에서 CDW 도메인의 형성과 그 분포를 외부적인 변수(응력)를 통해 제어할 수 있는지 확인하고자 했습니다.", "result": "응력을 통해 CsV3Sb5 내의 전자적 초격자 도메인을 직접적으로 제어할 수 있음을 보여주었으며, 도메인 구조의 재배열이 전자적 상태에 영향을 미침을 확인했습니다.", "implication": "카고메 금속에서 CDW 상태가 단순한 상전이 결과물이 아니라, 변형(strain)을 통해 엔지니어링 가능한 가변적인 상태임을 시사합니다.", "novelty": "CsV3Sb5의 CDW 물리에서 나노 수준의 도메인 제어 가능성을 입증하여, 향후 위상 소자 응용 가능성을 열었습니다.", "unresolved": "다양한 방향의 응력이 CDW의 위상(phase)이나 다른 경쟁 질서에 미치는 구체적인 영향에 대해서는 추가 조사가 필요합니다.", "future_work": "응력 환경 하에서의 정밀한 ARPES 측정을 통해 CDW 갭의 수정과 그에 따른 전자 구조의 변화를 추적하는 연구가 이어질 것으로 보입니다.", "concepts": [{"term": "전자 초격자 도메인", "why_emerged": "CDW 형성 시 시스템이 에너지를 낮추기 위해 공간적으로 불균일한 질서 변수(order parameter) 영역을 형성하는 현상을 기술하기 위해 필요.", "origin": "초창기 CDW 연구들(Peierls instability 관련)에서 유도된 개념.", "connections": "도메인 벽(Domain walls), 나노 구조화된 CDW."}], "english_summary": ["Strain-control of electronic superlattice domains in the kagome metal CsV3Sb5.", "Demonstrates that external stress effectively manipulates CDW domain structures.", "Suggests structural strain as a viable tool to engineer topological phases in CsV3Sb5.", "Provides insights into the inhomogeneous nature of CDW order in kagome systems."]}}, {"title": "Electrical manipulation and detection of perpendicular altermagnetic order via a proximitized Dirac semimetal", "journal": "Nature_Materials", "source": "Gemini", "link": "https://www.nature.com/articles/s41563-026-02721-4", "authors": "Zhaohui Li, Wenqing He, Hua Bai, et al.", "last_authors": "Lei Shen, Hyunsoo Yang", "summary": "Electrical switching and reading of perpendicular altermagnetic order is demonstrated in a Dirac semimetal/altermagnet heterostructure PtTe2/CrSb. The switching of altermagnetic CrSb is realized using a spin–orbit torque generated in the PtTe2 layer on application of an electrical current, whereas the reading makes use of an altermagnetic proximity-induced anomalous Hall effect in the PtTe2 layer.", "tier": "B_IMPORTANT_CONDMAT", "score": "9", "reason": "Direct relevance to altermagnetism and topological Dirac semimetal heterostructures with anomalous Hall signatures.", "tags": ["altermagnet", "Diracsemimetal", "anomalousHall"], "image": "https://media.springernature.com/m685/springer-static/image/art%3A10.1038%2Fs41563-026-02721-4/MediaObjects/41563_2026_2721_Fig1_HTML.png", "briefing": {"background": "알터마그네틱(Altermagnetism)은 비상대론적 강자성이나 반강자성과 달리, 시간 반전 대칭성을 깨면서도 순자화가 0인 독특한 자기 위상입니다. 이를 제어하고 읽어내는 기술은 차세대 스핀트로닉스의 핵심 과제입니다.", "motivation": "Dirac 반금속(PtTe2)과 알터마그네틱(CrSb) 이종접합을 통해, 전기적으로 알터마그네틱 질서를 스위칭하고 이를 읽어낼 수 있는 장치를 구현하고자 했습니다.", "result": "PtTe2에서 생성된 스핀-궤도 토크(SOT)를 이용하여 CrSb의 알터마그네틱 상태를 전기적으로 전환하고, 이를 PtTe2 내의 비정상 홀 효과(AHE)를 통해 감지하는 데 성공했습니다.", "implication": "알터마그네틱 물질이 고속 스핀트로닉 소자로 사용될 수 있음을 증명했으며, 특히 위상학적 물질과의 결합이 감지 민감도를 크게 높일 수 있음을 보여줍니다.", "novelty": "알터마그네틱의 전기적 제어와 위상 물질을 이용한 전기적 검출을 결합한 최초의 구현 사례 중 하나로, 효율적인 스핀 소자 설계를 위한 가이드라인을 제공합니다.", "unresolved": "실제 소자 규모에서의 전환 속도 제한 요인과, 다양한 알터마그네틱 물질에 대한 일반화 가능성에 대한 연구가 남아있습니다.", "future_work": "더 낮은 전력에서의 스위칭 구현 및 다양한 위상학적 반금속과의 이종접합 최적화 연구가 예상됩니다.", "concepts": [{"term": "알터마그네틱", "why_emerged": "강자성처럼 비정상 홀 효과를 나타내지만, 순자화는 반강자성처럼 0인 물질군을 분류하기 위해 필요.", "origin": "최근 2020년대 들어 반강자성 내의 k-의존적 스핀 분할 연구를 통해 정의됨.", "connections": "반강자성, 위상 반금속, 스핀 분할."}, {"term": "스핀-궤도 토크 (SOT)", "why_emerged": "전류를 이 성이 결합하여 비정상 홀 효과와 같은 독특한 수송 현상이 나타납니다.", "motivation": "강자성 Weyl 노드 라인 금속인 Fe5Si3에서 실온 수준의 고온에서도 관측 가능한 비정상 및 위상학적 홀 응답의 기원을 찾고자 합니다.", "result": "에피택셜 박막 시료를 통해 Fe5Si3가 강한 Dzyaloshinskii-Moriya 상호작용과 일축 이방성을 바탕으로 고온 위상학적 수송 특성을 발현함을 보였습니다.", "implication": "상온 위상학적 소자 응용을 위한 자성 Weyl 소재 후보군으로서의 실용적 가능성을 확인하였습니다.", "novelty": "Weyl 노드 라인 금속에서 상온 수준의 위상학적 홀 효과를 보고하였으며, 이는 위상학적 스핀트로닉스 응용에 중요한 진전입니다.", "unresolved": "이 수송 현상이 정확히 어떤 Weyl 노드 혹은 스핀 텍스처(Berry 곡률 밀집 영역)에 기인하는지에 대한 명확한 분광학적 증거가 부족합니다.", "future_work": "CD-ARPES 또는 스핀 분해 광전자 분광법을 통한 전자 구조 직접 관측이 필요합니다.", "concepts": [{"term": "Weyl 노드 라인", "why_emerged": "에너지 밴드가 점이 아닌 선을 따라 교차하는 위상학적 상태를 기술하기 위해 필요", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "Weyl 반금속과 유사하나 차원이 다른 밴드 토폴로지"}, {"term": "Dzyaloshinskii-Moriya 상호작용", "why_emerged": "비중심대칭 자성체에서 스핀의 비평형 정렬을 설명하기 위해 도입", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "스카이르미온 등 위상학적 자기 구조와 연결"}], "english_summary": ["Discovery of room-temperature anomalous Hall responses in Fe5Si3.", "Material classified as a ferromagnetic Weyl nodal-line metal.", "Interplay of DMI and anisotropy drives the observed topological transport.", "Promising candidate for room-temperature topological spintronics."]}}, {"title": "Identifying open-orbit topological surface states in dual topological semimetal TaSb2", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/9gk1-krjp", "authors": "Susmita Changdar, Heike Schlörb, Oleksandr Suvorov, et al.", "last_authors": "Sergey Borisenko, Setti Thirupathaiah", "summary": "TaSb 2 , a member of the TmPn 2 family of materials, hosts the very rare dual topological phase—weak topological insulating state and topological crystalline insulating state along different crystallographic orientations. So far, studies on the electronic structure of TmPn 2 compounds have focused on their overall electronic structure and the bulk open-orbit Fermi surfaces. Using angle-resolved photoemission spectroscopy, density functional theory calculations, and transport measurements, we distinguish the intertwined bulk and surface states on the weakly topological ( 20 1 ¯ ) plane of TaSb 2 . We identify multiple electron- and holelike bulk bands, yielding a near-perfect carrier compensation. Crucially, we observe open-orbit FSs near M ¯ and parallel to Γ ¯ − Y ¯ direction that are entirely of surface origin. The surface states also exhibit band crossing at ∼ 0.6 eV below Fermi level at the time-reversal invariant momentum M ¯ , indicating nontrivial band topology. Consistent with this, magnetotransport measurements display weak antilocalization, establishing TaSb 2 as a platform for spin-polarized topological transport on a weakly topological surface.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Electronic structure study of a topological semimetal.", "tags": ["material", "topologicalsemimetal", "electronicstructure"], "image": "", "briefing": {"background": "TaSb2와 같은 위상 반금속은 강한 스핀-궤도 결합을 통해 벌크와 표면 상태가 복잡하게 얽혀 있는 이중 위상학적 상태를 제공합니다.", "motivation": "TaSb2의 표면과 벌크 전자 구조가 어떻게 얽혀 있는지, 특히 위상학적으로 자명하지 않은 표면 상태를 분리해내고자 합니다.", "result": "ARPES와 DFT를 통해 TaSb2의 (20-1) 표면에서 열린 궤도(open-orbit) Fermi 표면을 발견하고 이것이 표면 상태임을 증명했습니다.", "implication": "TaSb2가 스핀 편극된 위상학적 표면 수송을 연구하기 위한 플랫폼임을 제시합니다.", "novelty": "ARPES를 사용하여 복잡한 벌크 밴드와 표면 상태를 명확히 구분하여 오픈 궤도를 식별해낸 점이 중요합니다.", "unresolved": "해당 표면 상태의 스핀 텍스처(spin texture)에 대한 실험적 직접 증거가 더 필요합니다.", "future_work": "Spin-ARPES를 이용한 표면 상태의 스핀 편극도 측정 및 수송 측정을 통한 위상학적 성질의 구체적 검증.", "concepts": [{"term": "약한 위상 절연체", "why_emerged": "위상학적 불변량이 특정 방향으로만 정의되는 상태를 설명하기 위해 도입", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "강한 위상 절연체 및 위상 결정 절연체와 비교"}, {"term": "열린 궤도(Open-orbit)", "why_emerged": "Fermi 표면이 브릴루앙 존 경계까지 연결되어 폐곡선을 이루지 않는 상태를 기술하기 위해 필요", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "자기저항의 비등방성과 직접 연관"}], "english_summary": ["Identification of surface-originated open-orbit Fermi surfaces in TaSb2.", "Utilized ARPES and DFT to disentangle surface states from bulk bands.", "Confirms TaSb2 as a dual topological semimetal with non-trivial surface topology.", "Establishes a platform for spin-polarized topological transport."]}}, {"title": "Layer-mediated tuning of spin and valley physics in stacked tetragonal altermagnetic bilayers", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/w468-mdrb", "authors": "Jianke Tian, Xiaowen Zhou, Gui-Bin Liu", "last_authors": "Xiaowen Zhou, Gui-Bin Liu", "summary": "As an emerging magnetic phase, altermagnets (AMs) with collinear compensated magnetism in real space and alternating spin splitting in the band structure have attracted widespread attention. Here, based on first-principles calculations, we demonstrate that the layer stacking imposes symmetry constra…", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Direct relevance to altermagnetism and electronic structure.", "tags": ["material", "altermagnet", "bandstructure"], "image": "", "briefing": {"background": "알터마그넷(Altermagnet)은 실공간에서 자성이 상쇄되지만, 운동량 공간(k-space)에서 비자성 스핀 분할(spin splitting)을 보이는 새로운 자기 위상입니다.", "motivation": "적층(stacking) 구조의 대칭성 제약이 테트라고날 알터마그넷의 스핀 및 밸리 물리량에 미치는 영향을 제어하고자 합니다.", "result": "제1원리 계산을 통해 적층 방식을 조절함으로써 스핀 및 밸리 분할을 튜닝할 수 있는 물리적 메커니즘을 규명하였습니다.", "implication": "알터마그넷 기반 이질구조 설계 시 적층 공학을 통해 스핀 정보를 효율적으로 제어할 수 있는 가능성을 제시합니다.", "novelty": "기존의 전형적인 강자성체와 달리, 적층 구조의 대칭성 파괴를 통해 알터마그넷의 전자 구조를 능동적으로 제어할 수 있음을 이론적으로 입증했습니다.", "unresolved": "실제 실험적으로 어떤 재료 시스템에서 이 적층 구조를 정밀하게 구현할 수 있는지에 대한 물질 후보군이 명확하지 않습니다.", "future_work": "제안된 적층 구조를 구현할 수 있는 구체적인 2차원 또는 층상 알터마그넷 후보 물질 탐색이 필요합니다.", "concepts": [{"term": "Altermagnetism", "why_emerged": "강자성과 반강자성의 장점을 결합해 스핀 분할과 상쇄된 자성을 동시에 달성하기 위해.", "origin": "최근 2020년대 초반 (Jungwirth 외) 연구로 확립됨.", "connections": "반강자성, 스핀-궤도 결합, Weyl/Dirac 위상 물질."}], "english_summary": ["Explores spin and valley physics in tetragonal altermagnetic bilayers.", "Uses first-principles calculations to demonstrate layer-stacking control.", "Shows symmetry-based tuning of spin splitting in compensated magnets.", "Provides a theoretical framework for designing altermagnetic heterostructures."]}}, {"title": "Magnetization-free quantum anomalous Hall effect in altermagnetic weak topological insulators", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/5378-2fcs", "authors": "Yanmiao Han, Yu-Hao Wan, Peng-Yi Liu, Rundong Zhao, Qing-Feng Sun", "last_authors": "Rundong Zhao, Qing-Feng Sun", "summary": "The quantum anomalous Hall (QAH) effect is usually realized through ferromagnetism or magnetic doping, which limits material choices and often results in low mobility, disorder sensitivity, and low operating temperatures. Here, we propose a mechanism to achieve the QAH phase without net magnetizatio…", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Connects altermagnetism and QAH, highly relevant to topological materials interest.", "tags": ["altermagnet", "QAH", "topological"], "image": "", "briefing": {"background": "양자 비정상 홀 효과(QAH)는 일반적으로 강자성체에서 나타나지만, 외부 자기장이나 자성 도핑은 소자 성능 저하를 초래하는 고질적인 문제가 있습니다.", "motivation": "순자화(net magnetization) 없이도 QAH를 구현할 수 있는 새로운 위상학적 환경을 알터마그넷에서 찾고자 합니다.", "result": "알터마그넷 약위상 절연체에서 순자화 없이도 QAH 효과가 발현될 수 있는 이론적 메커니즘을 제안하였습니다.", "implication": "강자성 도핑이나 외부 자기장 없이도 고성능 토폴로지 전자 소자를 구현할 수 있는 새로운 길을 열었습니다.", "novelty": "자성체임에도 불구하고 실질적인 순자화가 없는 상태에서 위상학적 홀 효과를 유도한다는 점이 독창적입니다.", "unresolved": "제안된 이론적 모델이 실제 물질 시스템에서 에너지 갭을 충분히 확보할 수 있을지는 추가적인 검증이 필요합니다.", "future_work": "QAH 상태를 실험적으로 관측하기 위한 최적의 알터마그넷 위상 절연체 후보군 수치 계산 및 제시.", "concepts": [{"term": "Quantum Anomalous Hall Effect", "why_emerged": "외부 자기장 없이도 양자화된 홀 저항을 구현하여 저전력 소자를 개발하기 위해.", "origin": "Haldane 모델(1988)로 이론화, 이후 자기 도핑 시스템에서 관측됨.", "connections": "위상 절연체, Chern 절연체, 스핀 궤도 결합."}], "english_summary": ["Proposes QAH effect in altermagnetic weak topological insulators.", "Mechanism bypasses the need for ferromagnetism or magnetic doping.", "Avoids disadvantages like disorder sensitivity and low operating temperatures.", "Offers a pathway to robust topological transport without net magnetization."]}}, {"title": "Nonvolatile electrical control of spin splitting via altermagnets with sliding ferroelectricity", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/fvdw-j1mc", "authors": "Jiajun Lu, Mu Tian, Chaoxi Cui, et al.", "last_authors": "Run-Wu Zhang, Yugui Yao", "summary": "Achieving precise and nonvolatile electrical control of spin represents a fundamental yet long-standing challenge in spintronics. In this work, we demonstrate that bilayer altermagnets with sliding ferroelectricity give rise to a distinct form of sliding multiferroicity, thereby establishing a pathw…", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Relevant to altermagnetism and control of electronic states.", "tags": ["material", "altermagnet"], "image": "", "briefing": {"background": "스핀트로닉스 분야에서 전자적 상태를 비휘발성으로 제어하는 것은 낮은 전력 소모와 소자의 고집적화를 위한 핵심 과제입니다.", "motivation": "슬라이딩 강유전성(sliding ferroelectricity)을 가진 알터마그넷을 활용하여 스핀 분할을 비휘발적으로 제어하고자 합니다.", "result": "이중층 알터마그넷에서 층 간의 슬라이딩을 통해 다강성(multiferroicity)을 유도하고, 이를 통한 전기적 스핀 제어 경로를 규명했습니다.", "implication": "알터마그넷과 강유전성의 결합이 차세대 비휘발성 스핀 소자 구현에 결정적인 기여를 할 수 있음을 보여줍니다.", "novelty": "기존 스핀 제어 방식과 달리, 구조적 슬라이딩이라는 물리적 자유도를 활용해 스핀 분할을 제어한다는 점이 혁신적입니다.", "unresolved": "실제 적층된 물질의 슬라이딩 장벽이 높을 경우 스위칭 동작이 어려울 수 있습니다.", "future_work": "슬라이딩 강유전성을 가진 알터마그넷 후보 물질군의 물리적 스위칭 에너지 계산 및 실험적 제어 가능성 평가.", "concepts": [{"term": "Sliding Ferroelectricity", "why_emerged": "반데르발스 층상 구조에서 층 간의 미끄러짐을 통해 전기적 분극을 발생시키기 위해.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "반데르발스 이질구조, 강유전성, 모아레(Moire) 물리."}], "english_summary": ["Demonstrates nonvolatile control of spin splitting using altermagnets.", "Utilizes sliding ferroelectricity in bilayer structures.", "Proposes a novel sliding multiferroicity mechanism for spintronics.", "Establishes a path for efficient electrical spin manipulation."]}}, {"title": "Phase diagram of the vortex state in an amorphous Re6Zr thin film exhibiting inverse melting", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/v4g9-nn57", "authors": "Pritam Das, Subhamita Sengupta, Anjan Jana, et al.", "last_authors": "Vivas Bagwe, Pratap Raychaudhuri", "summary": "In Type II superconductors, the vortex lattice can exhibit inverse melting, transitioning from a liquid to a crystalline solid as temperature increases. While recently observed via scanning tunneling microscopy in a 20 nm thick amorphous ${\\mathrm{Re}}_{6}\\mathrm{Zr}$ thin film, this work investigat…", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Scanning tunneling microscopy study of the vortex lattice in a superconducting thin film.", "tags": ["experiment", "STM", "superconductivity", "vortexlattice"], "image": "", "briefing": {"background": "제2종 초전도체에서 보텍스(Vortex)는 자기장에 의해 형성되는 양자화된 소용돌이 구조로, 온도와 자기장에 따라 액체나 고체(격자) 상태로 존재합니다. 일반적인 물질과 달리 보텍스 격자가 특정 조건에서 온도가 올라갈 때 고체에서 액체로 변하는 것이 아니라 액체에서 고체로 상전이하는 '역용융(Inverse melting)' 현상이 연구 대상입니다.", "motivation": "비정질 Re6Zr 박막에서 관측된 역용융 현상의 상세한 위상 도표(Phase diagram)를 규명하고, 왜 이러한 특이한 상전이가 발생하는지 그 메커니즘을 STM(주사 터널링 현미경)을 통해 직접 시각화하고자 합니다.", "result": "온도 변화에 따른 보텍스 격자의 구조적 변화를 추적하여 특정 자기장 및 온도 범위에서 나타나는 보텍스 액체-고체 상전이 영역을 확정했습니다.", "implication": "초전도 소자 내의 보텍스 동역학을 제어하는 데 중요한 기초 데이터를 제공하며, 무질서도가 높은 비정질계 초전도체에서의 양자 상전이 이해를 돕습니다.", "novelty": "STM을 이용해 20nm 두께의 비정질 박막에서 보텍스 상태를 직접 관측했다는 점에서 실험적 정밀도가 높으며, 연구자의 주요 관심사인 초전도체 내 전자 구조 분석 기법과 직접적으로 연결됩니다.", "unresolved": "역용융 현상을 일으키는 물질 내부의 구체적인 불순물 분포와 보텍스 고정(Pinning) 메커니즘 간의 정량적 관계는 여전히 추가 분석이 필요합니다.", "future_work": "다른 박막 두께나 조성에서의 보텍스 격자 변화를 추적하거나, 자기장 조절을 통한 정밀한 상전이 경계선 탐색이 예상됩니다.", "concepts": [{"term": "보텍스 격자(Vortex Lattice)", "why_emerged": "제2종 초전도체에 강한 자기장을 가할 때 자속 선들이 서로 밀어내며 규칙적인 기하학적 구조를 형성하기 때문입니다.", "origin": "Abrikosov가 1957년 이론적으로 예측하여 'Abrikosov 격자'로도 불립니다.", "connections": "Ginzburg-Landau 이론, 초전도 유체 역학, 자기장 하의 초전도체 상태와 연결됩니다."}, {"term": "역용융(Inverse Melting)", "why_emerged": "계의 엔트로피와 에너지 상태가 비정상적으로 분포할 때 온도가 상승함에 따라 무질서한 상태가 질서 정연한 상태로 변하는 현상을 설명하기 위해 도입되었습니다.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "보텍스 역학, 상전이 이론, 비평형 통계 역학."}], "english_summary": ["This paper investigates the vortex state phase diagram in amorphous Re6Zr thin films using STM.", "It focuses on the inverse melting transition where a vortex liquid transforms into a crystalline lattice upon heating.", "The findings map the stability regions of the vortex lattice within the superconducting thin film.", "This provides insights into vortex dynamics in disordered superconducting systems."]}}, {"title": "Pressure-induced emergent phases in pyrochlore iridate Eu2Ir2O7 film", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/d5gm-vv6m", "authors": "Mingyu Yang, Jianping Sun, Zhaoqing Ding, et al.", "last_authors": "Jinguang Cheng, Jiandong Guo", "summary": "By applying hydrostatic pressure to (111)-oriented ${\\mathrm{Eu}}_{2}{\\mathrm{Ir}}_{2}{\\mathrm{O}}_{7}$ single-crystalline films, we unveil a sequence of emergent quantum phases. We find transport signatures consistent with a pressure-induced “all-in–all-out” magnetic Weyl metal regime, followed by …", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Experimental observation of pressure-induced Weyl metal phases in a correlated iridate.", "tags": ["experiment", "Eu2Ir2O7", "Weyl"], "image": "", "briefing": {"background": "피로클로어 이리데이트(Eu2Ir2O7)는 강한 스핀-궤도 결합(SOC)과 전자 상관관계가 공존하여 위상 절연체나 Weyl 반금속과 같은 독특한 양자 위상을 가질 가능성이 높은 물질군입니다.", "motivation": "정수압(Hydrostatic pressure)을 가함으로써 이 물질 내부에 숨겨진 Weyl 금속 상태나 자기적 질서의 변화를 유도하고 그 위상 도표를 확인하고자 합니다.", "result": "압력 증가에 따라 'All-in-all-out(AIAO)' 자기 구조를 가진 Weyl 금속 상태가 나타나고, 이후 다른 위상으로 전이되는 과정을 수송 현상 측정을 통해 증명했습니다.", "implication": "압력을 물리적 변수로 사용하여 강상관계 물질의 전자 구조를 재구성할 수 있음을 보여주며, Weyl 물리 연구의 새로운 플랫폼을 제시합니다.", "novelty": "이리데이트 박막에서 압력을 통해 위상적 금속 상태를 제어했다는 점이 핵심이며, 독자가 관심 있는 Weyl/Dirac 시스템의 실험적 구현과 직접 연관됩니다.", "unresolved": "Weyl 노드의 에너지 위치와 위상적 특성이 압력에 따라 어떻게 정확히 재배열되는지에 대한 미세한 전자 구조 정보는 추가적인 ARPES 분석이 필요합니다.", "future_work": "압력 하에서의 ARPES 또는 RIXS를 이용해 위상학적 전자 상태의 변화를 직접 검증하는 연구가 뒤따를 것으로 보입니다.", "concepts": [{"term": "Weyl 금속(Weyl Metal)", "why_emerged": "에너지 띠 구조에서 밴드가 교차하며 Weyl 점을 형성하는 위상적 상태를 기술하기 위해 필요했습니다.", "origin": "Hermann Weyl의 페르미온 이론에 기반하며, 2011년경 Wan 등에 의해 위상적 물질로 제안되었습니다.", "connections": "토폴로지, 변칙 홀 효과(Anomalous Hall Effect), 베리 곡률과 연결됩니다."}, {"term": "All-in-all-out (AIAO)", "why_emerged": "피로클로어 격자 구조 내에서 자기 모멘트가 정사면체의 중심을 향하거나 밖으로 향하는 독특한 자기 정렬 상태를 명명하기 위해 필요했습니다.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "자기적 위상 절연체, 좌절된 자성(Frustrated magnetism), 피로클로어 산화물."}], "english_summary": ["The paper explores pressure-induced phase transitions in (111)-oriented Eu2Ir2O7 thin films.", "Transport measurements reveal an emergent magnetic Weyl metal phase with all-in-all-out magnetic order.", "Hydrostatic pressure effectively tunes the quantum phases in this correlated iridate.", "The results highlight the potential for pressure-engineering of topological phases in complex oxides."]}}, {"title": "Electromagnetic Response of a Half-Filled Chern Band near Topological Criticality", "journal": "PRL_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/v44d-7jr4", "authors": "Xinlei Yue, Fabian Pichler, Michael Knap, Ady Stern", "last_authors": "Michael Knap, Ady Stern", "summary": "We evaluate electromagnetic-response observables in a half-filled Chern band, across a topological phase transition between a composite Fermi liquid (CFL) and a Fermi liquid (FL) phase. While a sharp gapped plasma mode exists deep in the CFL phase, we demonstrate that it is damped near the proposed …", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Theory on electromagnetic response and STS in Chern bands, relevant to topological and correlated states.", "tags": ["theory", "topological", "Chernband", "electromagneticresponse", "STS"], "image": "", "briefing": {"background": "Chern 밴드는 강한 베리 곡률을 가진 에너지 밴드로, 강한 상관관계가 더해질 때 분수 양자 홀 효과와 같은 이국적인 위상을 나타낼 수 있습니다. 이 위상들 간의 임계점 근처에서의 전자기적 반응은 물질의 위상학적 성질을 이해하는 데 핵심적입니다.", "motivation": "절반 채워진(half-filled) Chern 밴드에서 복합 페르미 액체(CFL)와 페르미 액체(FL) 사이의 위상적 상전이 시 나타나는 전자기적 응답 특성을 이론적으로 예측하고자 합니다.", "result": "위상 임계점 근처에서 CFL 내의 갭이 있는 플라즈마 모드가 감쇠(damping)되는 현상을 도출하여, STS 등으로 관측 가능한 신호를 제시했습니다.", "implication": "위상적 물질의 상전이를 STS와 같은 국소 탐침 기법으로 확인할 수 있는 이론적 근거를 마련했습니다.", "novelty": "위상 절연체 및 상관관계 전자계 연구자들에게 중요하며, 특히 Chern 밴드와 관련된 전자 상관 현상을 STS 결과와 직접 연결 지어 해석하는 틀을 제공합니다.", "unresolved": "실제 실험 물질(예: 무아레 격자 시스템)에서의 구체적인 불순물 효과나 격자 진동이 플라즈마 모드의 감쇠에 미치는 영향은 아직 불분명합니다.", "future_work": "실제 모아레 물질이나 Chern 절연체 후보 물질에서 STS를 통한 플라즈마 모드 감쇠 신호 검증이 필요합니다.", "concepts": [{"term": "Chern 밴드(Chern Band)", "why_emerged": "비영(non-zero)의 Chern 수를 가지는 에너지 밴드를 기술하여 위상적 성질을 정량화하기 위해 필요했습니다.", "origin": "Chern-Simons 이론 및 David Thouless 등의 연구에서 기원합니다.", "connections": "양자 홀 효과, 베리 곡률, 위상적 물질론."}, {"term": "복합 페르미 액체(CFL, Composite Fermi Liquid)", "why_emerged": "강한 상관관계가 있는 전자계에서 전자가 자속(flux)과 결합하여 중성 입자처럼 거동하는 상태를 설명하기 위해 도입되었습니다.", "origin": "Halperin, Lee, Read (1993)에 의해 널리 정립되었습니다.", "connections": "분수 양자 홀 효과, Chern-Simons 게이지 이론."}], "english_summary": ["This study theoretically examines the electromagnetic response of a half-filled Chern band near a topological transition.", "It focuses on the transition between a composite Fermi liquid and a Fermi liquid phase.", "The paper predicts the damping of the plasma mode near the topological critical point.", "The results offer observable signatures for scanning tunneling spectroscopy studies in topological materials."]}}, {"title": "Heterostructuring as Gateway to Electron Doping of Nickelate Superconductors", "journal": "PRL_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/qp4p-x6g3", "authors": "Chao Deng, Motoharu Kitatani, Guiwen Jiang, et al.", "last_authors": "Karsten Held, Liang Si", "summary": "Intercalation-driven self-doping is a general mechanism for engineering high-temperature superconductivity and emergent quantum states in Ruddlesden–Popper phase correlated oxides.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Mechanism for high-temperature superconductivity in nickelate correlated oxides.", "tags": ["superconductivity", "nickelates", "correlatedelectrons", "heterostructures"], "image": "", "briefing": {"background": "니켈산염 초전도체는 구리산염 고온 초전도체와 유사한 전자 구조를 가지지만, 전하 도핑(electron doping)을 조절하기 어렵다는 구조적 한계가 존재합니다.", "motivation": "Ruddlesden-Popper 상 산화물에서 이종접합(heterostructuring)과 삽입(intercalation)을 통해 전자 도핑을 제어하고 초전도 현상을 유도할 수 있는지 탐구합니다.", "result": "이종접합을 통한 삽입 유도형 자체 도핑 메커니즘이 초전도 및 창발적 양자 상태를 공학적으로 구현하는 일반적인 방법론이 될 수 있음을 제시합니다.", "implication": "합성하기 어려운 니켈산염의 전자 도핑 농도를 정밀하게 제어하여, 고온 초전도체 연구의 새로운 플랫폼을 제공할 수 있습니다.", "novelty": "이종접합 구조를 활용하여 니켈산염의 전자 도핑 문제를 극복하려는 새로운 접근 방식을 제안합니다.", "unresolved": "실제 실험적 구현에서 이종접합 계면에서의 결함이 초전도성에 미치는 영향은 명확하지 않습니다.", "future_work": "구체적인 니켈산염 이종접합 구조를 제작하고, ARPES를 통해 Fermi 표면 변화를 확인하는 후속 연구가 필요합니다.", "concepts": [{"term": "Ruddlesden-Popper phase", "why_emerged": "산화물 층상 구조를 체계적으로 분류하고 그 물리적 특성을 이해하기 위해 필요합니다.", "origin": "S.N. Ruddlesden and P. Popper (1957).", "connections": "페로브스카이트 구조, 고온 초전도체(LSCO) 등과 밀접하게 연결됨."}, {"term": "Self-doping", "why_emerged": "외부 불순물 주입 없이 구조적 요소만으로 전하 운반자 농도를 제어하기 위해 필요합니다.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "산소 함량 조절, 이종접합 계면 전자 이동."}], "english_summary": ["Nickelate superconductors face challenges with electron doping control.", "Heterostructuring is proposed as a gateway to engineer superconducting states.", "Intercalation-driven self-doping provides a tunable platform for quantum phases.", "This mechanism offers a new route for tailoring electronic properties in complex oxides."]}}, {"title": "Highly Anisotropic Charge Dynamics and Spectral Weight Redistribution in the Trilayer Nickelate La4Ni3O10", "journal": "PRL_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/5j5t-sfnc", "authors": "Zhe Liu, Jie Li, Deyuan Hu, et al.", "last_authors": "Meng Wang, Hai-Hu Wen", "summary": "We study the $ab$-plane and $c$-axis charge dynamics of ${\\mathrm{La}}_{4}{\\text{Ni}}_{3}{\\mathrm{O}}_{10}$ using optical spectroscopy. While a pronounced Drude profile, i.e., metallic response, is observed in the $ab$-plane optical conductivity ${σ}_{1}^{ab}(ω)$, the $c$-axis optical spectra ${σ}_{…", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Experimental study of charge dynamics in a trilayer nickelate via optical spectroscopy.", "tags": ["nickelate", "unconventionalsuperconductivity", "opticalspectroscopy", "chargedynamics"], "image": "", "briefing": {"background": "니켈산염은 구리산염의 대안으로 주목받고 있으나, 그 안의 전자 간 상관관계와 다층 구조에서의 전하 동역학은 여전히 활발한 연구 대상입니다.", "motivation": "3층 구조를 가진 La4Ni3O10에서 면내(ab-plane)와 면간(c-axis) 방향의 전하 동역학 차이를 광학 분광법으로 분석하고자 합니다.", "result": "ab-평면에서는 전형적인 금속성 Drude 반응이 관찰되나, c-축 방향에서는 이와 다른 비등방적 전하 동역학적 특징이 나타남을 확인했습니다.", "implication": "La4Ni3O10이 준 2차원적 전자 구조를 가지고 있음을 시사하며, 이는 초전도성 발현 기작과 관련된 전자 상관관계를 이해하는 데 중요한 단서가 됩니다.", "novelty": "La4Ni3O10의 비등방적 전자 구조를 광학 분광학으로 실증하여, 물질의 전자적 상태를 규명했습니다.", "unresolved": "관찰된 비등방성 변화와 초전도성 사이의 직접적인 상관관계 및 에너지 규모가 완전히 밝혀지지 않았습니다.", "future_work": "ARPES를 통한 Fermi 표면 맵핑 및 압력 변화에 따른 광학 응답 연구가 이어져야 합니다.", "concepts": [{"term": "Drude profile", "why_emerged": "금속 내 전하 운반자의 이동도와 산란 특성을 해석하기 위해 사용됩니다.", "origin": "Paul Drude (1900).", "connections": "광학 전도도(Optical conductivity), 플라즈몬, Fermi 액체 이론."}, {"term": "Spectral weight redistribution", "why_emerged": "강상관 전자계에서 에너지 규모에 따른 전자의 운동 에너지 변화를 추적하기 위해 필요합니다.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "Sum rules, Mott 절연체, Hubbard 모델."}], "english_summary": ["Investigated charge dynamics of trilayer La4Ni3O10 via optical spectroscopy.", "Observed metallic Drude response in-plane vs. anisotropic behavior out-of-plane.", "Provides evidence of quasi-2D electronic structure in the trilayer system.", "Contributes to understanding electron correlation in nickelate candidates."]}}, {"title": "Multiple Phases in K2Cr3As3: A Playground for Manipulating Topological Superconductivity", "journal": "PRL_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/kykd-2nj4", "authors": "Seigo Ogawa, Tomoki Miyoshi, Saki Uchida, et al.", "last_authors": "Yoshihiko Inada, Guo-qing Zheng", "summary": "Researchers have made the first definitive measurements of an elusive superconducting state.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Experimental measurements on topological superconductivity in a specific material (K2Cr3As3).", "tags": ["superconductivity", "topological", "material", "experimental"], "image": "", "briefing": {"background": "K2Cr3As3는 독특한 준 1차원 사슬 구조를 가져 위상 초전도체 후보 물질로 많은 관심을 받고 있습니다.", "motivation": "K2Cr3As3 내의 위상 초전도 상태를 명확히 측정하고, 물질 내 존재하는 다중 상의 물리적 특성을 규명하고자 합니다.", "result": "위상 초전도 상태를 뒷받침하는 결정적인 실험적 증거를 측정하는 데 성공했습니다.", "implication": "K2Cr3As3가 위상 초전도성을 연구하기 위한 이상적인 플랫폼임을 입증하며, 비전통적 초전도체 연구의 지평을 넓혔습니다.", "novelty": "실험적으로 검증하기 어려웠던 위상 초전도 상태의 직접적인 신호를 포착했다는 점이 중요합니다.", "unresolved": "이 다중 상들이 어떠한 방식으로 위상 초전도성과 상호작용하는지에 대한 상세 메커니즘은 연구가 더 필요합니다.", "future_work": "결정 방향에 따른 STS(Scanning Tunneling Spectroscopy) 측정으로 위상 에지 상태를 직접 관찰하는 연구가 요구됩니다.", "concepts": [{"term": "Topological superconductivity", "why_emerged": "물질 내부의 토폴로지적 불변량과 초전도 상태가 결합하여 마요라나 페르미온을 구현하기 위해 제안되었습니다.", "origin": "Qi and Zhang (2011).", "connections": "Majorana bound states, 반강자성, 비전통적 초전도성."}, {"term": "Quasi-1D chain structure", "why_emerged": "이방성 전하 전송과 특정 물리적 상전이를 이해하기 위한 구조적 모델입니다.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "Luttinger liquid, Spin-charge separation."}], "english_summary": ["Reported definitive measurements of the superconducting state in K2Cr3As3.", "Identified multiple phases relevant for topological superconductivity research.", "K2Cr3As3 serves as a playground for manipulating exotic quantum states.", "Establishes a critical experimental milestone for topological materials."]}}, {"title": "Quantized Spin Hall Effect in Three-Dimensional Nodal-Ring Semimetal: Geometric Scaling and Symmetry-Engineered Spin Response", "journal": "PRL_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/74ky-d71n", "authors": "Jiali Chen, Chaoxi Cui, Zhi-Ming Yu, Wei Jiang, Yugui Yao", "last_authors": "Wei Jiang, Yugui Yao", "summary": "The anomalous Hall conductivity in magnetic Weyl semimetals scales linearly with the momentum separation between Weyl nodes, establishing a geometric paradigm for three-dimensional Hall responses. Here, we discover an analogous phenomenon in the spin Hall effect: a quantized spin Hall conductivity (…", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Theory of quantized spin Hall effect and geometric scaling in Weyl/nodal-ring semimetals.", "tags": ["Weylsemimetal", "nodal-ringsemimetal", "spinHalleffect", "anomalousHalleffect", "Berrycurvature", "theory"], "image": "", "briefing": {"background": "위상 반금속(Topological semimetal)에서 베리 곡률(Berry curvature)은 비정상 홀 효과(AHE)와 같은 수송 현상을 결정짓는 기하학적 핵심 요소입니다. 특히 웨일 반금속에서는 웨일 노드 간의 거리와 홀 전도도가 밀접한 상관관계를 가집니다.", "motivation": "기존의 비정상 홀 효과에 대한 기하학적 스케일링 법칙이 스핀 홀 효과(Spin Hall Effect)에도 적용될 수 있는지, 그리고 이를 대칭성 설계를 통해 제어 가능한지 이론적으로 검증하고자 함.", "result": "3차원 노달 링(Nodal-ring) 반금속에서 스핀 홀 전도도가 양자화된 값을 가지며, 노드 구조의 기하학적 매개변수에 따라 스케일링 됨을 증명함.", "implication": "스핀 소자를 위한 소재 설계 시 대칭성을 이용해 스핀 홀 응답을 정밀하게 제어할 수 있는 이론적 가이드라인을 제공함.", "novelty": "웨일 반금속의 AHE 기하학적 패러다임을 스핀 홀 효과로 확장하고, 이를 대칭성 공학으로 연결했다는 점이 본 연구자의 위상 물질 연구 관심사와 부합함.", "unresolved": "실제 물질에서 결함이나 불순물이 이러한 양자화된 스핀 홀 응답을 얼마나 흐트러뜨릴지에 대한 정량적 분석은 부족함.", "future_work": "제시된 이론을 구현할 수 있는 구체적인 실제 후보 물질 탐색 및 수송 실험 제안.", "concepts": [{"term": "Nodal-ring semimetal", "why_emerged": "Weyl/Dirac 점이 아닌 선(line)이나 고리(ring) 형태의 밴드 교차를 가진 위상 물질 연구의 필요성 때문.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "Weyl semimetal, Berry phase, topological band structure"}, {"term": "Spin Hall Effect", "why_emerged": "전하 흐 cepts": [{"term": "Weyl Semimetal", "why_emerged": "전도대와 가전자대가 점(Weyl node)에서 만나며 위상적으로 보호된 표면 상태(Fermi arc)를 갖는 물질의 중요성 증대.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "Topological insulators, Berry curvature, anomalous Hall effect"}, {"term": "Vortex Lattice", "why_emerged": "제2종 초전도체 내부로 자기장이 침투할 때 발생하는 양자화된 자기 다발의 배열 구조 연구를 위해.", "origin": "Abrikosov (1957)", "connections": "Ginzburg-Landau theory, superconductivity, magnetic field penetration"}], "english_summary": ["Robust surface superconductivity observed in the Weyl semimetal γ-PtBi2.", "The surface transition temperature is higher than that of the bulk.", "Vortex lattice formation confirms the existence of stable superconductivity at the surface.", "This material provides a platform for investigating topological surface superconductivity."]}}, {"title": "Room-Temperature Noncollinear Ferroelectricity in van der Waals WO2Cl2 with a Wide Bandgap", "journal": "PRL_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/zjyw-z6s6", "authors": "Yu Xing, Ning Ding, Zhipeng Wang, et al.", "last_authors": "Linglong Li, Shuai Dong", "summary": "Exotic noncollinear room-temperature ferroelectricity has now been experimentally realized in 2D WO 2 Cl 2 , establishing a polar counterpart to noncollinear spin textures.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Experimental realization of ferroelectricity in a 2D van der Waals material.", "tags": ["material", "2Dmaterials", "vanderWaals", "ferroelectricity"], "image": "", "briefing": {"background": "반데르발스(vdW) 층상 물질은 박리가 용이하여 소자 응용에 유리하며, 최근 강유전성과 자성 등 기능성 물성을 가지는 2D 물질 탐색이 활발함.", "motivation": "vdW 물질 내에서 상온에서 작동하는 비공선형(noncollinear) 강유전성을 구현하고 그 구조적 특성을 규명하고자 함.", "result": "WO2Cl2 물질에서 상온 비공선형 강유전성을 실험적으로 관측하고 증명함.", "implication": "비공선형 스핀 구조와 대응되는 비공선형 강유전성 소재의 발견으로 새로운 비휘발성 메모리나 센서 소자 설계 가능성 제시.", "novelty": "2D van der Waals 시스템에서 비공선형 강유전성이라는 새로운 자유도를 확보했다는 점에서 강상관계 물성 연구자들에게 구조적, 전자적 물성 제어의 새로운 사례가 됨.", "unresolved": "이러한 강유전성이 ential for interfacial design in 2D designer multiferroics."]}}, {"title": "Molecular-driven lead-free halide photoferroelectric solid solution for high-temperature sensitive self-powered x-ray detection", "journal": "Science_Advances", "source": "Gemini", "link": "https://doi.org/10.1126/sciadv.aef7693", "authors": "Lijun Xu, Yao Li, Qianwen Guan, et al.", "last_authors": "Lina Li, Junhua Luo", "summary": "Halide double perovskite ferroelectrics have recently emerged as an environmentally friendly candidate in radiation detection, photovoltaics, and optoelectronic memory devices due to their unique spontaneous polarization and semiconductor properties. However, it is a huge challenge to achieve efficient carrier transport and high Curie temperature ( T c ) in double perovskite ferroelectrics, owing to the limitations of twisted frameworks and structural construction. Here, we present a high- T c heterovalent metal solid solution double perovskite ferroelectric, (4Br2FBZ) 2 CsAgBiBr 7 (4Br2FBZ-CAB, 4Br2FBZ = 4-bromo-2-fluorobenzylammonium), through a strategy of cation-engineered symmetry regulation. The metal ions Ag and Bi transitioned from an alternating arrangement to a mixed-site solid solution pattern, effectively optimizing the electronic band structure to enhance carrier transport. Meanwhile, 4Br2FBZ-CAB exhibits a high T c of 484 kelvin, substantially expanding the family of high- T c lead-free ferroelectrics. Benefiting from its remarkable photoelectric and ferroelectric properties, a high self-powered x-ray detection sensitivity of 273.8 microcoulomb per gray per square centimeter (μC Gy air −1 cm −2 ) was achieved at room temperature. In addition, this exceptionally high T c enables the detector to operate self-powered at high temperatures, resulting in an excellent sensitivity of 896.9 μC Gy air −1 cm −2 and a low detection limit of 13.9 nGy air s −1 at 425 kelvin. This work opens an avenue for expanding the family of high- T c lead-free perovskite ferroelectrics with superior semiconducting properties.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Electronic band structure and carrier transport in lead-free ferroelectric perovskites, relevant to materials physics.", "tags": ["ferroelectric", "perovskite", "bandstructure", "transport"], "image": "", "briefing": {"background": "할로겐 이중 페로브스카이트(Halide double perovskite)는 납 기반 페로브스카이트의 환경적 독성 문제를 해결하면서도 우수한 광전 특성과 강유전성을 유지할 수 있어 차세대 광전자 및 방사선 검출기 재료로 주목받고 있습니다.", "motivation": "기존 이중 페로브스카이트는 복잡한 결정 구조와 낮은 퀴리 온도(Tc), 효율적인 전하 수송의 한계로 인해 실용적인 고온 작동 소자 개발에 어려움이 있었습니다.", "result": "이종 원자가 금속 고용체 전략을 통해 Ag와 Bi의 배열을 재구성하여 전자 밴드 구조를 최적화했습니다. 이를 통해 484K의 높은 퀴리 온도를 달성하고 고온에서도 높은 민감도의 자가 구동 X선 검출 성능을 구현했습니다.", "implication": "납이 없는 고온 강유전체 페로브스카이트의 설계 가이드라인을 제시하며, 극한 환경이나 고온 작동이 필요한 방사선 검출기 응용 분야에 새로운 가능성을 열었습니다.", "novelty": "구조적 대칭성 조절을 통한 퀴리 온도의 획기적인 상승과 고온에서의 전하 수송 특성 향상을 결합한 점이 핵심입니다.", "unresolved": "고용체 내에서의 정확한 구조적 무질서도가 거시적 강유전성에 미치는 미세한 상관관계는 여전히 연구가 필요합니다.", "future_work": "다른 비납계 금속 조합을 활용한 소재 라이브러리 확장 및 소자의 장기 안정성 평가가 예상됩니다.", "concepts": [{"term": "이중 페로브스카이트 (Double perovskite)", "why_emerged": "납 기반 페로브스카이트의 유해성을 극복하고 구조적 다양성을 확보하기 위해 필요했습니다.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "기존 ABX3 페로브스카이트 구조의 파생형입니다."}, {"term": "강유전성 (Ferroelectricity)", "why_emerged": "외부 전기장 없이도 자발적인 분극을 유지하여 비휘발성 메모리 및 센서 등에 활용하기 위해 중요합니다.", "origin": "Valasek (1920)이 로셸 염에서 최초 발견", "connections": "유전체 물리 및 상전이 현상과 밀접하게 연결됩니다."}], "english_summary": ["Developed a lead-free double perovskite ferroelectric with high Curie temperature.", "Used cation-engineered symmetry regulation to optimize electronic band structure.", "Achieved high self-powered X-ray detection sensitivity at elevated temperatures.", "Demonstrated the potential for environmentally friendly, robust optoelectronic devices."]}}, {"title": "Strong anharmonicity driven wave-like thermal transport and high thermoelectric performance in TlCu 5 Se 3", "journal": "Science_Advances", "source": "Gemini", "link": "https://doi.org/10.1126/sciadv.aeh9096", "authors": "Sayantoni Choudhury, Animesh Bhui, Prasad V. D. Matukumilli, et al.", "last_authors": "Umesh V. Waghmare, Kanishka Biswas", "summary": "Thermal transport in crystalline solids generally occurs via particle-like phonon propagation. Here, we demonstrate the dominant unusual wave-like phonon transport and high thermoelectric figure-of-merit (zT) of ∼1.42 at 673 K in crystalline TlCu 5 Se 3 due to the strong anharmonicity exerted by confined Cu dynamic disorder and Tl rattling. TlCu 5 Se 3 shows an intrinsic ultralow lattice thermal conductivity of (κ L ) 0.3–0.2 W m −1 K −1 across the temperature range of 294–673 K. Density functional theory calculations and ab-initio molecular dynamics simulations reveal that strong lattice anharmonicity arises due to confined dynamic disorder of the Cu sublattice. The complex knot-like structure with strong anharmonicity reduces phonon lifetime below the Wigner limit, leading to substantial inter-band phonon coupling and a dominant wave-like coherence. By further tuning cationic vacancies to optimize electrical transport, we achieve an enhanced zT of ∼1.7 at 673 K in TlCu 5-x Se 3 (x = 0.03–0.07), demonstrating that confined ion dynamics not only maintains ultralow κ L but also enhances thermoelectric performance without compromising the stability.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Investigates strong anharmonicity and wave-like thermal transport in a thermoelectric material using DFT.", "tags": ["thermoelectric", "phonon", "thermaltransport", "DFT", "materialsscience"], "image": "", "briefing": {"background": "결정질 고체에서 열전달은 보통 입자 형태의 포논(phonon) 산란으로 설명되지만, 일부 복잡한 구조의 재료에서는 격자 비조화성(anharmonicity)으로 인해 파동 형태의 열전달 현상이 나타날 수 있습니다.", "motivation": "TlCu5Se3의 열전 특성을 향상시키고 비조화성이 격자 열전도도에 미치는 기계적 메커니즘을 규명하고자 했습니다.", "result": "구리(Cu)의 동적 무질서와 툴륨(Tl)의 rattling 현상이 강력한 비조화성을 유도하여 격자 열전도도를 극도로 낮추고, 파동 형태의 열전달 모드를 활성화하여 1.7에 달하는 높은 zT 성능을 구현했습니다.", "implication": "이온의 동적 무질서를 제어하여 안정성을 저해하지 않으면서도 열전 성능을 극대화하는 새로운 재료 설계 전략을 제시했습니다.", "novelty": "포논 수명이 Wigner 한계 이하로 감소하는 물리적 상황에서 파동적 열전달 모드가 우세해짐을 보인 점이 고체 물리적으로 흥미롭습니다.", "unresolved": "이런 동적 무질서 시스템에서의 구체적인 포논-포논 상호작용의 비정상적 분산 관계에 대한 실험적 검증이 더 필요합니다.", "future_work": "비슷한 rattling 구조를 가진 다른 다원계 화합물로의 응용 및 비조화성 정도에 따른 열전 성능의 체계적인 스케일링 법칙 확립.", "concepts": [{"term": "비조화성 (Anharmonicity)", "why_emerged": "조화 근사(harmonic approximation)만으로는 설명되지 않는 격자 진동과 열팽창 현상을 이해하기 위해 필요했습니다.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "포논 산란, 열전도도 및 상전이 현상과 밀접합니다."}, {"term": "Wigner 한계 (Wigner limit)", "why_emerged": "결정 내 포논의 평균 자유 행로가 원자 간 거리 수준으로 짧아질 때 입자적 설명이 붕괴되는 지점을 규정하기 위해 필요합니다.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "강한 비조화성 및 비결정질적 열전달 물리와 관련됩니다."}], "english_summary": ["Identified strong anharmonicity in TlCu5Se3 driving wave-like thermal transport.", "Showed ultralow lattice thermal conductivity due to Cu dynamic disorder and Tl rattling.", "Achieved a high thermoelectric figure-of-merit (zT) of ~1.7.", "Highlighted the role of ion dynamics in enhancing thermoelectric performance."]}}, {"title": "Berry-Curvature Effect in Anomalous Transport", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2608.21161", "authors": "V. P. Mineev", "last_authors": "V. P. Mineev", "summary": "A theory of the Berry-phase effect in anomalous transport in ferromagnets driven by statistical forces such as the gradient of temperature or chemical potential has been developed by Di Xiao et al in Phys. Rev. Lett. 97, 026603 (2006) based on a field-dependent density of states generating an additional contribution to the current density. We present an alternative derivation of the Berry- phase effect in anomalous transport in altermagnets and noncentrosymmertric metals based on quasiclassic matrix kinetic equation. Along with anomalous Hall effect an anomalous heat flow and anomalous thermalelectric currents are also derived.", "tier": "B_IMPORTANT_CONDMAT",  paper investigates correlated Chern phases in hBN-aligned rhombohedral multilayer graphene using Hartree-Fock theory.", "It proposes a 'charge imprinting' mechanism where valence band charge textures at the moiré interface influence conduction electrons in distant layers.", "The alignment of hBN acts as a remote electrostatic template, favoring either trivial or topological insulating states.", "This finding offers a design principle for engineering correlated topology through layer-dependent Coulomb templates."]}}, {"title": "Chiral superconductors from parent states with nonuniform Berry curvature: Momentum-space vortices, Bogoliubov-de Gennes topology, and thermal Hall conductivity", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2605.21618", "authors": "L. David Le Nir, Asimpunya Mitra, Yong Baek Kim", "last_authors": "Asimpunya Mitra, Yong Baek Kim", "summary": "We investigate chiral superconductivity emerging from parent electronic states with non-uniform Berry curvature, motivated by recent experiments in rhombohedral graphene multilayers. Using the continuum $\\lambda_N$-model-a tunable platform with independently controllable Berry curvature profiles-we solve the full BCS gap equation on a continuum Chern band beyond the weak-coupling limit. We find that a non-uniform Berry curvature of the parent band enriches the superconducting order parameter, leading to the formation of momentum-space vortices in the gap function away from high-symmetry points. By tuning the Berry curvature profile, we identify distinct regimes associated with vortex nucleation and vortex number saturation, and show that the nucleation of momentum-space vortices tends to lower the condensation energy. We then show analytically that the parent band Chern number constrains the number of momentum-space vortices that can nucleate in the gap-independent of details of the $\\lambda_N$-model. We also provide a gauge-invariant formulation for computing the Bogo     img.src = r.image; img.alt = 'Figure or article preview image'; img.loading = 'lazy'; img.referrerPolicy = 'no-referrer'; img.onerror = () => figure.remove();
    figure.appendChild(img);
    figure.appendChild(textEl('figcaption', '', 'Figure / article preview image from the source page'));
    head.appendChild(figure);
  }
  const headText = document.createElement('div');
  headText.className = 'head-text';
  const badges = document.createElement('div');
  badges.className = 'badges';
  if (r.score) badges.appendChild(textEl('span', 'badge score', `${r.score}/10`));
  if (r.tier) badges.appendChild(textEl('span', 'badge', r.tier));
  if (r.journal) badges.appendChild(textEl('span', 'badge', r.journal));
  if (r.source) badges.appendChild(textEl('span', 'badge', r.source));
  headText.appendChild(badges);
  const title = document.createElement('h1');
  if (r.link) { const titleLink = document.createElement('a'); titleLink.href = r.link; titleLink.target = '_blank'; titleLink.rel = 'noopener noreferrer'; titleLink.textContent = r.title || ''; title.appendChild(titleLink); }
  else { title.textContent = r.title || ''; }
  headText.appendChild(title);
  headText.appendChild(textEl('p', 'meta', [r.journal, r.source].filter(Boolean).join(' | ')));
  if (r.last_authors || r.authors) { const authors = document.createElement('p'); authors.className = 'authors'; if (r.last_authors) authors.append('Last authors: ' + r.last_authors); if (r.authors) authors.append((r.last_authors ? ' | ' : '') + 'Authors: ' + r.authors); headText.appendChild(authors); }
  appendLabeledText(headText, 'why', 'Filter reason: ', r.reason);
  if (r.tags && r.tags.length) { const tags = document.createElement('div'); tags.className = 'tags'; r.tags.forEach(tag => tags.appendChild(textEl('span', 'tag', '#' + tag))); headText.appendChild(tags); }
  if (r.link) { const link = document.createElement('a'); link.className = 'link'; link.href = r.link; link.target = '_blank'; link.rel = 'noopener noreferrer'; link.textContent = 'Open paper'; headText.appendChild(link); }
  head.appendChild(headText);
  if (r.summary) { const abstract = document.createElement('p'); abstract.className = 'original-abstract'; const strong = textEl('strong', '', 'Original abstract'); abstract.appendChild(strong); abstract.append(r.summary); head.appendChild(abstract); }
  slideEl.appendChild(head);
  const briefing = document.createElement('div');
  briefing.className = 'briefing';
  appendBriefSection(briefing, 'Background', b.background);
  appendBriefSection(briefing, 'Motivation', b.motivation);
  appendBriefSection(briefing, 'Result', b.result);
  appendBriefSection(briefing, 'Implication', b.implication);
  appendBriefSection(briefing, "Why it's important / Novelty", b.novelty);
  appendBriefSection(briefing, 'Unresolved Questions', b.unresolved);
  appendBriefSection(briefing, 'Expected Future Work', b.future_work);
  if (b.concepts && b.concepts.length) {
    const section = document.createElement('section');
    section.className = 'brief-section wide';
    section.appendChild(textEl('h2', '', 'Concepts / Terms'));
    const concepts = document.createElement('div');
    concepts.className = 'concepts';
    b.concepts.forEach(c => {
      const item = document.createElement('div');
      item.className = 'concept';
      item.appendChild(textEl('h3', '', c.term || 'Concept'));
      [['왜 생겼나: ', c.why_emerged], ['누가 만들었나: ', c.origin], ['연결되는 흐름: ', c.connections]].forEach(([label, text]) => { if (!text) return; const p = document.createElement('p'); const bold = textEl('b', '', label); p.appendChild(bold); p.append(text); item.appendChild(p); });
      concepts.appendChild(item);
    });
    section.appendChild(concepts);
    briefing.appendChild(section);
  }
  if (b.english_summary && b.english_summary.length) { const section = document.createElement('section'); section.className = 'brief-section wide'; section.appendChild(textEl('h2', '', 'English Summary')); const ul = document.createElement('ul'); b.english_summary.slice(0, 5).forEach(line => ul.appendChild(textEl('li', '', line))); section.appendChild(ul); briefing.appendChild(section); }
  slideEl.appendChild(briefing);
  counterEl.textContent = `${index + 1} / ${slides.length}`;
  prevBtn.disabled = index === 0;
  nextBtn.disabled = index === slides.length - 1;
}
prevBtn.addEventListener('click', () => { index = Math.max(0, index - 1); render(); });
nextBtn.addEventListener('click', () => { index = Math.min(slides.length - 1, index + 1); render(); });
document.addEventListener('keydown', event => { if (event.key === 'ArrowLeft') prevBtn.click(); if (event.key === 'ArrowRight') nextBtn.click(); });
render();
</script>
</body>
</html>
