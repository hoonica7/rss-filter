<title>Daily Paper Slideshow</title>
<style>
  :root {
    color-scheme: light;
    --bg: #f6f7f4;
    --paper: #ffffff;
    --ink: #111827;
    --muted: #64748b;
    --line: #d8ddd2;
    --accent: #176b87;
    --accent-2: #9a3412;
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; overflow: auto; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: var(--bg); color: var(--ink); }
  .shell { max-width: 1500px; min-height: 100vh; margin: 0 auto; padding: 14px 18px; display: flex; flex-direction: column; }
  .topbar { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 16px; }
  .top-actions { display: flex; align-items: center; gap: 10px; }
  .topbar a, button { border: 1px solid var(--line); border-radius: 8px; background: var(--paper); color: var(--ink); padding: 10px 14px; font-weight: 700; text-decoration: none; cursor: pointer; }
  button.primary { background: var(--accent); border-color: var(--accent); color: white; }
  button:disabled { opacity: 0.45; cursor: not-allowed; }
  .counter { color: var(--muted); font-weight: 700; }
  .slide { min-height: calc(100vh - 82px); background: var(--paper); border: 1px solid var(--line); border-radius: 10px; padding: 18px; box-shadow: 0 18px 42px rgba(15, 23, 42, 0.10); display: grid; grid-template-columns: minmax(310px, 0.86fr) minmax(0, 1.55fr); gap: 18px; overflow: visible; }
  .paper-head { min-width: 0; min-height: 0; overflow: visible; display: flex; flex-direction: column; gap: 12px; }
  .figure { margin: 0; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: #f8fafc; }
  .figure img { display: block; width: 100%; max-height: 41vh; object-fit: contain; background: white; }
  .figure figcaption { padding: 7px 10px; color: var(--muted); font-size: 12px; line-height: 1.3; }
  .head-text { display: flex; flex-direction: column; gap: 9px; min-width: 0; }
  .badges { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .badge { border-radius: 999px; padding: 5px 9px; background: #eef2ff; color: #3730a3; font-size: 12px; font-weight: 800; }
  .score { background: #fee2e2; color: #991b1b; }
  h1 { margin: 0; font-size: 25px; line-height: 1.15; letter-spacing: 0; overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
  h1 a { color: inherit; text-decoration-color: rgba(23, 107, 135, 0.35); text-decoration-thickness: 2px; text-underline-offset: 4px; }
  h1 a:hover { color: var(--accent); text-decoration-color: var(--accent); }
  .meta, .authors, .why, .abstract { font-size: 13px; line-height: 1.45; }
  .meta, .authors { color: var(--muted); }
  .why strong, .abstract strong, .authors strong { color: var(--ink); }
  .authors { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .why { border-left: 4px solid var(--accent-2); padding-left: 10px; color: #374151; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .abstract { border-top: 1px solid var(--line); padding-top: 14px; color: #374151; }
  .original-abstract { border-top: 1px solid var(--line); padding-top: 10px; color: #374151; font-size: 11.5px; line-height: 1.35; overflow-wrap: anywhere; }
  .original-abstract strong { display: block; margin-bottom: 4px; color: var(--ink); }
  .tags { display: flex; flex-wrap: wrap; gap: 8px; }
  .tag { border-radius: 999px; padding: 4px 8px; background: #f1f5f9; color: #475569; font-size: 12px; font-weight: 700; }
  .head-text > .link { display: none; }
  .briefing { min-width: 0; min-height: 0; overflow: visible; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); grid-auto-rows: minmax(0, auto); align-content: start; gap: 11px 18px; border-top: 0; padding-top: 0; }
  .brief-section { min-width: 0; }
  .brief-section.wide { grid-column: 1 / -1; }
  .brief-section h2 { margin: 0 0 4px; font-size: 14px; line-height: 1.22; color: #0f766e; letter-spacing: 0; }
  .brief-section p, .brief-section li { margin: 0; font-size: 12.5px; line-height: 1.42; color: #1f2937; overflow-wrap: anywhere; }
  .brief-section ul { margin: 0; padding-left: 20px; }
  .concepts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 9px 14px; }
  .concept { border-top: 1px solid var(--line); padding-top: 7px; }
  .concept h3 { margin: 0 0 4px; font-size: 13px; color: #7c2d12; letter-spacing: 0; }
  .concept p { margin: 2px 0 0; font-size: 11.5px; line-height: 1.35; color: #374151; overflow-wrap: anywhere; }
  .concept b { color: #111827; }
  .link { color: var(--accent); font-weight: 800; text-decoration: none; }
  .empty { padding: 48px; background: var(--paper); border: 1px solid var(--line); border-radius: 12px; color: var(--muted); }
  @media (max-width: 860px) {
    .shell { padding: 14px; }
    .topbar, .top-actions { align-items: stretch; flex-direction: column; }
    .slide, .briefing, .concepts { grid-template-columns: 1fr; }
    .slide { min-height: auto; overflow: visible; display: grid; }
    h1 { font-size: 28px; }
  }
</style>

nd ab initio calculations.", "Establishes strain engineering as a viable route to manipulate altermagnetic properties in transition metal oxides."]}}, {"title": "An iterative method bridging DFT, disorder averaging, and experiment in intercalated materials: application to Au-intercalated graphene", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2607.28296", "authors": "Poonam Kumari, Alberto Zobelli, Igor de Melo Froldi, Adeline Crepieux, Laurent Simon, Cristina Bena", "last_authors": "Laurent Simon, Cristina Bena", "summary": "Intercalation can strongly modify the electronic dispersion of a host material, as directly revealed by angle-resolved photoemission spectroscopy (ARPES). We develop a general iterative method combining density functional theory (DFT), tight-binding (TB), disorder averaging within the self-consistent T-matrix approximation (SCTMA), and experiment, to construct an effective model of the intercalated system. DFT identifies the relevant microscopic degrees of freedom and constrains selected model parameters, while comparison of SCTMA calculations with experiment guides their further refinement. We apply this method to graphene intercalated with Au clusters and show that it reproduces the main ARPES signatures of the Au-cluster phase, including the broadening of the V12an Hove singularity and the emergence of kink-like features in the dispersion. The essential microscopic ingredients identified by the analysis are the hybridization between selected intercalant orbitals and the graphene states, together with an intercalation-induced local scattering potential.", "tier": "A_MUST_READ", "score": "10", "reason": "Directly models ARPES signatures and kinks in intercalated graphene using DFT and SCTMA.", "tags": ["method", "ARPES", "graphene"], "image": "https://arxiv.org/html/2607.28296v1/x1.png", "briefing": {"background": "그래핀과 같은 2D 물질에 이종 원소를 층간 삽입(intercalation)하면 전자 밴드 구조가 크게 변하며, 이는 ARPES를 통해 밴드의 휘어짐(kink)이나 확장(b kably large e-ph collision cross section in CsV3Sb5.", "tier": "A_MUST_READ", "score": "10", "reason": "title strong match: CsV3Sb5", "tags": ["kagome", "AV3Sb5", "CsV3Sb5", "V3Sb5", "superconduct", "phonon", "transport"], "image": "https://arxiv.org/html/2602.19499v2/x1.png", "briefing": {"background": "가고메 격자 구조를 가진 AV3Sb5(A=K, Rb, Cs) 계열은 전하 밀도 파(CDW), 초전도성, 그리고 위상학적 특성이 공존하여 최근 응집물질 물리학에서 매우 중요하게 다뤄지는 물질군입니다.", "motivation": "CsV3Sb5에서 전자-전자 산란과 전자-음향자 산란이 수송 특성에 미치는 영향을 정량적으로 분석하고, 이 물질의 전자 상관관계 정도를 파악하기 위해 연구가 수행되었습니다.", "result": "전기 및 열 수송 측정을 통해 CsV3Sb5가 중간 정도의 전자 상관관계를 가진 금속성 페르미 액체임을 확인했습니다. 특히 저온에서 저항의 T^2 의존성이 Kadowaki-Woods 스케일링과 일치하며, Wiedemann-Franz 법칙이 극저온 한계에서 성립함을 보였습니다. 또한, 전자-음향자 산란 단면적이 매우 크다는 것을 밝혀냈습니다.", "implication": "이 물질의 전송 현상에서 전자-음향자 상호작용이 지배적인 역할을 하며, 이는 CDW 및 초전도 상태의 형성 기작을 이해하는 데 중요한 기초 정보를 제공합니다.", "novelty": "열전도도 측정을 자기장 유무에 따라 수행하여 격자 기여분과 전자 기여분을 성공적으로 분리해냈으며, Kagome 금속에서 전자-음향자 산란의 강도를 명확히 정량화했다는 점이 돋보입니다.", "unresolved": "강한 전자-음향자 결합이 실험적으로 관측된 비정상 홀 효과(AHE)나 루프 전류와 같은 시간 역전 대칭성 깨짐 현상과 어떻게 연결되는지는 아직 명확하지 않습니다.", "future_work": "압력이나 화학적 도핑을 통해 전자-음향자 결합 강도를 조절하며 초전도 임계 온도(Tc)와의 상관관계를 탐구하는 후속 연구가 예상됩니다.", "concepts": [{"term": "Kadowaki-Woods ratio", "why_emerged": "금속에서 전자 간의 상관관계 강도를 전자의 유효 질량과 저항의 온도 계수 사이의 관계로 설명하기 위해 도입되었습니다.", "origin": "1986년 Kadowaki와 Woods가 무거운 페르뮴 입자(Heavy Fermion) 시스템에서 처음 제안했습니다.", "connections": "페르미 액체 이론, 전자 상관관계, 유효 질량 재규격화"}, {"term": "Wiedemann-Franz law", "why_emerged": "금속의 전기 전도도와 열 전도도 사이의 보편적인 비례 관계를 설명하기 위해 필요했습니다.", "origin": "1853년 Gustav Wiedemann과 Rudolph Franz가 실험적으로 발견했습니다.", "connections": "로렌츠 수(Lorenz number), 탄성 산란, 페르미 액체"}, {"term": "Bloch-Grüneisen formula", "why_emerged": "결정 격자 내에서 전자-음향자 산란에 의한 금속의 전기 저항 온도 의존성을 설명하기 위해 고안되었습니다.", "origin": "Felix Bloch(1930)와 Eduard Grüneisen(1933)의 연구를 바탕으로 확립되었습니다.", "connections": "전자-음향자 상호작용, Debye 온도, 포논 산란"}, {"term": "Kagome Metal", "why_emerged": "기하학적 좌절(frustration)이 있는 격자 구조에서 나타나는 특이한 밴드 구조(플랫 밴드, 디락 콘)를 연구하기 위해 부상했습니다.", ses. By elucidating how bound states emerge from their elementary constituents, our results point to strategies for engineering exciton formation, with direct implications for optical materials and devices that operate with excitons or free carriers.", "tier": "A_MUST_READ", "score": "10", "reason": "Utilizes time- and momentum-resolved photoemission (tr-ARPES) to study dynamics in monolayer WSe2.", "tags": ["ARPES", "WSe2", "spectroscopy"], "image": "https://arxiv.org/html/2607.28417v1/x1.png", "briefing": {"background": "반도체나 2D 물질에 빛을 쏘면 자유 전자와 정공이 생성되는데, 이들이 서로 끌어당겨 엑시톤(exciton)이라는 결합 상태를 형성하는 과정은 광소자 물리에서 매우 기본적이지만 그 동역학은 복잡합니다.", "motivation": "단일층 WSe2에서 자유 전하가 어떻게 냉각되고 최종적으로 엑시톤으로 결합하는지에 대한 미시적인 경로와 음향자(phonon)의 역할을 실시간으로 관측하고자 했습니다.", "result": "시간 및 운동량 분해 광전자 분광법(tr-ARPES)을 통해 자유 전하 밴드와 엑시톤 밴드가 일시적으로 공존하며 에너지가 전이되는 과정을 포착했습니다. 이 과정이 특정 포논 방출을 통한 계단식 완화(relaxation cascade)에 의해 일어남을 증명했습니다.", "implication": "엑시톤 형성 효율이 밸리(valley) 구조와 스핀 상태, 그리고 큰 운동량을 가진 포논에 의해 결정됨을 밝혀, 향후 엑시톤 기반 소자의 효율을 제어할 수 있는 물리적 근거를 마련했습니다.", "novelty": "엑시톤 형성 과정을 단순한 '에너지 이완'이 아닌, 운동량 공간에서의 '밴드 간 스펙트럼 강도 전이'로 직접 시각화했다는 점이 독보적입니다. 독자의 ARPES 관심도에 부합하는 고해상도 동역학 연구입니다.", "unresolved": "다양한 결함(defect)이나 기판과의 상호작용이 이러한 엑시톤 형성 속도에 미치는 영향에 대해서는 추가적인 검증이 필요합니다.", "future_work": "모아레(Moire) 초격자 시스템이나 다른 전이금속 디칼코게나이드(TMD) 이종 접합에서 엑시톤 형성 메커니즘을 확장 연구할 것으로 보입니다.", "concepts": [{"term": "tr-ARPES", "why_emerged": "평형 상태가 아닌 여기 상태에서의 전자 구조 변화를 시간과 운동량 영역에서 동시에 관찰하기 위해 개발되었습니다.", "origin": "초록 정보만으로는 특정하기 어려우나, 펨토초 레이저 기술의 발전과 ARPES가 결합되어 탄생했습니다.", "connections": "초고속 동역학, 여기자, 플로케(Floquet) 공학"}, {"term": "Exciton formation", "why_emerged": "광학적 여기 후 전하 운반자가 결합하여 빛을 방출하거나 에너지를 수송하는 기본 단계를 이해하기 위해 필요합니다.", "origin": "1931년 Yakov Frenkel에 의해 엑시톤 개념이 처음 제안되었습니다.", "connections": "쿨롱 상호작용, 보즈-아인슈타인 응축, TMD 반도체"}, {"term": "Phono-conversion", "why_emerged": "자유 입자가 결합 상태로 변할 때 남는 에너지와 운동량을 포논(격자 진동)이 받아주어야 하는 과정을 설명하기 위해 사용되었습니다.", "origin": "본 논문에서 엑시톤 형성 기작을 설명하기 위해 강조된 용어입니다.", "connections": "전자-음향자 산 ": "숨겨진 스핀 분극 (Hidden Spin Polarization)", "why_emerged": "전체적인 대칭성 때문에 보이지 않는 것처럼 보이지만 실제로는 국소적/표면적으로 존재하는 스핀 분극을 설명하기 위함입니다.", "origin": "Zhang 등이나 최근 위상 물질 연구자들에 의해 강조되었습니다.", "connections": "반전 대칭성 깨짐, 라슈바 효과, 결정 구조 대칭성"}, {"term": "Bi(110) 표면 (Bi(110) Surface)", "why_emerged": "비스무트의 다양한 결정면 중 이방성이 크고 독특한 위상적 특성을 가질 것으로 기대되어 연구되었습니다.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "위상 절연체, 비스무트, 표면 재구성"}, {"term": "스핀 텍스처 (Spin Texture)", "why_emerged": "운동량 공간에서 전자 스핀의 방향이 어떻게 배열되는지를 시각화하고 분석하기 위해 사용됩니다.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "라슈바 모델, 스커미온, 베리 곡률"}], "english_summary": ["The research unveils the full 3D spin texture of Bi(110) surface states using spin-resolved ARPES.", "The experimental results reveal previously hidden spin-polarized states not fully captured in prior studies.", "The observed spin structure is compared and validated with first-principles calculations.", "This work provides a comprehensive map of the topological spin states on the Bi(110) surface."]}}, {"title": "Cavity Tuning of the CDW--Superconductivity Interplay in a Kagome Metal", "journal": "arXiv_CondMat", "source": "keyword", "link": "https://arxiv.org/abs/2607.27769", "authors": "Lan-Ting Shi, I-Te Lu, Xin Wang, Dongbin Shin, Lede Xian, Angel Rubio", "last_authors": "Lede Xian, Angel Rubio", "summary": "Kagome metals host competing electronic orders, including charge-density-wave (CDW) order and superconductivity, shaped by intertwined lattice, electronic-correlation, and kagome-geometric effects. Here, using quantum electrodynamical density functional theory, we identify an equilibrium cavity route for reshaping this balance in the kagome metal CsV$_3$Sb$_5$. An out-of-plane polarized single-mode cavity selectively softens CDW-related phonons, counteracting pressure-induced hardening and extending the CDW instability toward higher pressures. In the high-pressure regime where the CDW instability is otherwise suppressed, cavity coupling redistributes Eliashb , {"term": "T-matrix treatment", "why_emerged": "산란체가 강하거나 복잡한 구조를 가질 때 단순 섭동 이론(Born approximation)을 넘어서는 산란 효과를 계산하기 위해 필요합니다.", "origin": "양자 산란 이론의 기초.", "connections": "Green's function, Lippmann-Schwinger equation, 무질서 시스템."}], "english_summary": ["Investigated the QPI features of gold-intercalated graphene on SiC using T-matrix calculations.", "Proposed a ring-like scatterer model centered on graphene hollow sites to explain M-point QPI.", "Successfully reproduced elliptical QPI structures and stationary standing-wave patterns observed in experiments.", "Highlighted the energy-dependent sign of LDOS contrast for small gold clusters."]}}, {"title": "Intricacies of Frustrated Magnetism in the Kondo Metal YbAgGe", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2509.02252", "authors": "D. G. Mazzone, C. B. Larsen, B. Ueland, X. Boraley, D. M. Pajerowski, Y. Skourski, J. Taylor, B. Fak, S. L. Bud'ko, R. McQueeney, P. C. Canfield, O. Zaharko", "last_authors": "S. L. Bud'ko, R. McQueeney, P. C. Canfield, O. Zaharko", "summary": "The combination of localized magnetic moments, their frustration and interaction with itinerant electrons is a key challenge of condensed matter physics. Frustrated magnetic interactions promote degenerate ground states with enhanced fluctuations, a topic that is predominantly studied in magnetic insulators. The coupling between itinerant and localized electrons in metals add complexity to the problem, and presently formulated only for extreme cases in which the itinerant electrons mediate exchange between localized spins (RKKY interaction) or suppress the formation of magnetic moments (Kondo screening). Here, we report an in-depth experimental study of the distorted Kagome metal YbAgGe, unravelling the open questions of how frustration, localized magnetism and itinerant electrons are intertwined in frustrated Kondo metals. We find that coupled itinerant and localized electrons give rise to dynamic magnetic co ic Weyl semimetal", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/lr7n-yjhb", "authors": "Yiting Feng, Meng Lyu, Jinying Yang, et al.", "last_authors": "Baogen Shen, Enke Liu", "summary": "$\\mathrm{C}{\\mathrm{o}}_{2}\\mathrm{MnGa}$, a magnetic Weyl semimetal exhibiting significant anomalous Hall conductivity (AHC) and anomalous Hall angle (AHA) over a wide temperature range, provides an excellent platform for tuning and revealing the rules of the intrinsic and extrinsic contributions t…", "tier": "B_IMPORTANT_CONDMAT", "score": "9", "reason": "Direct relevance to magnetic Weyl semimetals and anomalous Hall effect experiments.", "tags": ["Weyl", "anomalousHall", "transport"], "image": "", "briefing": {"background": "자기성 웨일 반금속(Magnetic Weyl Semimetal)은 거대한 비정상 홀 효과(AHE)를 나타내어 차세대 스핀트로닉스 소자의 후보로 꼽힙니다. AHE는 베리 곡률에 의한 내인성(intrinsic) 기여와 불순물 산란에 의한 외인성(extrinsic) 기여로 나뉩니다.", "motivation": "대표적 웨일 반금속인 Co2MnGa에서 온도와 전자 수송 특성 변화에 따라 내인성 및 외인성 기여가 어떻게 진화하고 서로 경쟁하는지를 명확히 구분하고자 했습니다.", "result": "Co2MnGa에서 광범위한 온도 범위에 걸쳐 나타나는 비정상 홀 전도도(AHC)와 비정상 홀 각(AHA)의 진화를 분석하여, 특정 조건에서 내인성과 외인성 성분이 어떻게 결합하여 전체 수송 특성을 결정하는지 그 규칙성을 밝혀냈습니다.", "implication": "AHE의 메커니즘을 정밀하게 분리함으로써, 소자 설계 시 어떤 요인(물질 순도 vs 밴드 구조 설계)을 우선시해야 하는지에 대한 가이드라인을 제공합니다.", "novelty": "독자님의 관심사인 '비정상 홀 효과'와 '베리 곡률'이 실제 강자성 웨일 반금속에서 어떻게 물리적으로 구현되고 제어되는지를 실험적으로 파헤친 연구입니다. 특히 두 성분의 '이중 구성 진화(dual-component evolution)'를 강조했습니다.", "unresolved": "불순물의 종류나 농도를 체계적으로 제어했을 때 외인성 기여가 이론적 예측과 정확히 일치하는지에 대한 추가 검증이 필요할 수 있습니다.", "future_work": "스핀 홀 효과와의 연계 연구 및 자기 모멘트 정렬 방향에 따른 웨일 노드의 이동과 AHE 변화에 대한 후속 연구가 가능합니다.", "concepts": [{"term": "Magnetic Weyl Semimetal", "why_emerged": "시간 반전 대칭성이 깨진 상태에서 위상학적으로 보호받는 웨일 점을 관찰하기 위해 연구되었습니다.", "origin": "Wan et al. (2011) 등 위상 절연체 연구 그룹", "connections": "Weyl nodes, Berry curvature, Chiral anomaly"}, {"term": "Anomalous Hall Effect (AHE)", "why_emerged": "자성체 내에서 외부 자기장 없이 전하 수송이 휘어지는 현상을 설명하기 위해 발견되었습니다.", "origin": "Edwin Hall (1881)", "connections" ith Near Ideal Quantum Geometry Condition", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2607.28491", "authors": "Lin-Lin Wang", "last_authors": "Lin-Lin Wang", "summary": "The ideal quantum geometry (IQG) condition of equal magnitude between quantum metric ($G(k)$) and Berry curvature ($\\Omega(k)$) as in $|\\Omega|$/Tr$G$=1 has been associated with realizing fractional Chern insulators for the flat band in few layers of rhombohedral graphene (RG). More recently the IQG condition has also been proposed for superconductivity in the flat band for thick RG layers. Using density functional theory and Wannier functions, we study the symmetry-protected topology of bulk RG, drumhead surface state (DSS) of semi-infinite RG surface, and the IQG condition for thick RG slabs. We find that bulk RG is a weak topological insulator with spin-orbit coupling (SOC), besides being effectively a chiral semimetal with chiral nodal line without SOC. We also find that the DSS flat band of semi-infinite and thick RG slabs have a sizable convex curvature with depth agreeing with the recent angular resolved phono-emission spectroscopy experiment. The calculated IQG also shows a convex shape with the K point at the center having a minimum with approximately $|\\Omega|$/Tr$G$$\\approx$1. But the inner rim of the DSS region shows the strict IQG condition of $|\\Omega|$/Tr$G$=1. These results on semi-infinite and thick RG slabs from first-principles calculations provide useful information for the pristine DSS at the single particle level for future studies to consider when many-body interactions and strong correlations will be included.", "tier": "B_IMPORTANT_CONDMAT", "score": "9", "reason": "Direct comparison of surface states and quantum geometry in graphite with ARPES data.; demoted from A: broad CM, not direct user/project hit", "tags": ["DFT", "ARPES", "graphene"], "image": "https://arxiv.org/static/browse/0.3.4/images/arxiv-logo-fb.png", "briefing": {"ba cture loses its inversion center, reducing the point group symmetry at $\\Gamma$ from $D_{3d}$ to $C_{3v}$. First-principles density functional calculations with spin-orbit coupling show that this ordered structure retains bulk band inversion and a linearly dispersive surface state of a strong topological insulator. Additionally, its bulk bands acquire a pronounced linear-in-$k$ spin splitting away from $\\Gamma$. Fitting the conduction- and valence-band doublets to symmetry-constrained two-band $k\\cdot p$ Hamiltonians, we extract intrinsic linear Rashba coefficients of $\\alpha_{\\mathrm{CB}}\\approx2.66~\\mathrm{eV\\,\\text{\\AA}}$ and $\\alpha_{\\mathrm{VB}}\\approx0.35~\\mathrm{eV\\,\\text{\\AA}}$. The conduction-band value places ordered BiSbTeSe$_2$ among the strongest bulk-Rashba topological-insulator systems reported to date and approaches the coupling found in the benchmark polar Rashba semiconductor BiTeI. Sublattice ordering thus provides a route to giant bulk spin--momentum locking that coexists with protected topological surface states, offering a platform in which bulk-Rashba and topological surface contributions to spin and charge transport can be investigated within the same material.", "tier": "B_IMPORTANT_CONDMAT", "score": "9", "reason": "Direct hit: Electronic structure of a topological insulator with giant spin splitting.; demoted from A: broad CM, not direct user/project hit", "tags": ["theory", "topological-insulator", "electronic-structure"], "image": "https://arxiv.org/html/2607.26311v2/x1.png", "briefing": {"background": "위상 절연체는 일반적으로 반전 대칭을 유지하는 결정 구조를 가지기 때문에 벌크 내에서 Rashba형 스핀 갈라짐(spin splitting)이 금지되어 왔습니다.", "motivation": "BiSbTeSe2가 대칭성 파괴를 통해 벌크 내에서 거대한 Rashba 스핀 갈라짐을 나타낼 수 있는지, 그리고 이것이 위상 표면 상태와 공존 가능한지 확인하고자 합니다.", "result": "BiSbTeSe2의 결정 구조에서 반전 대칭이 깨지며(D3d에서 C3v로), 전도대와 가전자대에서 매우 큰 Rashba 계수를 가진 스핀 갈라짐이 발생함을 확인했습니다.", "implication": "위상적으로 보호된 표면 상태와 벌크의 거대 Rashba 스핀 갈라짐이 하나의 물질에서 공존 가능함을 보여주며, 이는 스핀트로닉스 응용에 중요한 통로를 제공합니다.", "n eristic Fermi-arc branches persist after adsorption, with H-derived spectral weight appearing within the same near-Fermi-level surface manifold. Together, these results show that chemisorbed hydrogen participates in the spin-textured surface electronic response. The accompanying adsorbate-local current-induced spin polarization points toward opportunities to connect surface chemistry with electrically controlled spin phenomena in topological semimetals.", "tier": "B_IMPORTANT_CONDMAT", "score": "9", "reason": "Electronic structure and surface state analysis of the Weyl semimetal NbP relevant for ARPES interpretation.", "tags": ["theory", "NbP", "Weylsemimetal", "electronicstructure"], "image": "https://arxiv.org/html/2606.16994v2/x1.png", "briefing": {"background": "NbP와 같은 위상 반금속은 표면 상태가 전하 및 스핀 운반체로서 역할을 할 수 있어 전기화학적 촉매 플랫폼으로 주목받고 있습니다.", "motivation": "NbP 표면에 수소가 화학흡착되었을 때, 이들의 표면 Weyl 페르미 아크와 스핀 텍스처가 어떻게 변화하는지 분석하고자 합니다.", "result": "수소 화학흡착 후에도 Weyl 페르미 아크는 유지되며, 흡착된 수소가 표면의 스핀 텍스처와 상호작용하여 국소적인 전류 유도 스핀 분극에 기여함을 확인했습니다.", "implication": "위상 물질의 표면 화학적 조작이 전기적으로 제어 가능한 스핀 현상과 직접적으로 연결될 수 있음을 시사합니다.", "novelty": "Weyl 반금속의 토폴로지적 특징과 화학흡착 반응의 관계를 계산적으로 규명하였으며, 이는 ARPES 데이터 해석에 실질적인 도움을 줄 수 있습니다.", "unresolved": "계산 모델이 상온이나 실제 촉매 환경에서도 동일하게 작동하는지, 또한 실험적인 스핀 분해 ARPES 데이터와의 정량적 일치 여부는 아직 불명확합니다.", "future_work": "실제 NbP 표면에서의 전하 전이와 연계된 스핀 분해 전자 구조 실험 및 촉매 반응 효율과의 상관관계 연구가 이어질 것으로 보입니다.", "concepts": [{"term": "Weyl Fermi Arcs", "why_emerged": "Weyl 반금속의 벌크 위상 특성이 표면에 나타날 때, 두 Weyl 노드를 연결하는 개방형 페르미 면을 설명하기 위해 필요함", "origin": "Wan et al. (2011)", "connections": "Weyl 반금속, 위상학적 표면 상태"}, {"term": "Current-induced Spin Polarization", "why_emerged": "전류 흐름에 의해 물질 표면에 스핀이 불균형하게 분포되는 현상을 설명하기 위해 등장함", "origin": "Edelstein (1990)", "connections": "Rashba 효과, 스핀트로닉스"}], "english_summary": ["Investigated hydrogen chemisorption on the Weyl semimetal NbP surface.", "Found that Fermi arcs persist and interact with adsorbates, maintaining spin polarization.", "Suggests coupling esting a route toward multifunctional magnetic topological materials.", "tier": "B_IMPORTANT_CONDMAT", "score": "9", "reason": "Magnetic Weyl semimetal with Berry curvature and topological Hall effects; direct hit.; demoted from A: broad CM, not direct user/project hit", "tags": ["experiment", "Weyl", "anomalousHall"], "image": "https://arxiv.org/static/browse/0.3.4/images/arxiv-logo-fb.png", "briefing": {"background": "위상 반금속(Topological Semimetals) 분야는 전자의 밴드 구조에서 위상적으로 보호된 비자명한 상태를 탐구합니다. 특히 자기적 Weyl 반금속은 자성과 위상적 성질이 결합하여 이상 홀 효과(AHE)와 같은 독특한 수송 현상을 생성하는 플랫폼으로 주목받고 있습니다.", "motivation": "기존에는 이질적인 위상적 특성(Berry 곡률, 스핀 키랄성 등)을 하나의 물질에서 동시에 구현하고 제어하는 것이 어려웠습니다. 본 연구는 희토류 화합물 DyB4의 자기적 비공면성 구조를 활용해 이를 통합하는 전략을 세웠습니다.", "result": "DyB4에서 자기장으로 제어 가능한 비공면 스핀 구조를 발견하였으며, 이를 통해 거대 자기저항, 카이랄 이상(chiral anomaly) 관련 부의 자기저항, 이상 홀 효과, 위상 홀 효과가 공존하는 다기능성을 확인했습니다.", "implication": "4f 국소 모멘트와 전도성 캐리어의 결합을 통해 모멘텀 공간의 Berry 곡률과 실공간의 스핀 키랄성을 동시에 조절할 수 있음을 보여주며, 이는 차세대 위상 소재 설계의 새로운 지표를 제시합니다.", "novelty": "자기적 위상 반금속 후보 물질로서 DyB4를 제시하고, 자성과 수송 현상의 결합을 통해 여러 위상적 현상을 한 물질에서 동시에 구현했다는 점이 독보적입니다.", "unresolved": "이동성 캐리어와 4f 국소 모멘트 사이의 미세한 상호작용 메커니즘과 그 결합 강도에 대한 정량적 분석은 여전히 과제로 남아 있습니다.", "future_work": "ARPES나 RIXS를 통해 제안된 Weyl 노드와 밴드 분산을 직접 관측하고, 외부 압력 등을 통한 위상 상태의 정밀 제어 연구가 기대됩니다.", "concepts": [{"term": "Weyl Semimetal", "why_emerged": "밴드 구조에서 전도대와 가전자대가 접촉하여 Weyl 점을 형성하는 위상적 상태를 기술하기 위해 필요.", "origin": "Wan et al. (2011)에 의해 제안됨.", "connections": "Berry 곡률, 비정상 홀 효과, 위상 절연체와 밀접."}, {"term": "Anomalous Hall Effect", "why_emerged": "강자성체 등에서 외부 자기장 없이도 자화에 의해 발생하는 홀 전압을 이해하기 위해 필요.", "origin": "Edwin Hall (1881)에 의해 발견.", "connections": "Berry 곡률과 스핀-궤도 결합에 기반한 이상적인 수송 현상."}, {"term": "Scalar Spin Chirality", "why_emerged": "비공면 자성 구조에서 전자의 위상적 산란을 설명하기 위해 도입.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "위상 홀 효과, 스핀-액체 상태 연구와 연결."}], "english_summary": ["DyB4 is identified as a magnetic Weyl semimetal with tunable non-coplanar spin states.", "The material exhibits a rare coexistence of large magnetoresistance, chiral anomaly, anomalous Hall effect, and topological Hall effect.", "Electronic transport is governed by the interplay between itinerant carriers and localized 4f moments.", "Provides a promising platform for multifunctional magnetic topological materials."]}}, {"title": "Orbital-Selective Mott Transition and Correlation-Amplified Charge Ordering in the Altermagnet CsCr2S2O", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2607.28029", "authors": "Xiuhua Chen, Yilin Wang", "last_authors": "Xiuhua Chen, Yilin Wang", "summary": "Altermagnet CsCr$_2$S$_2$O undergoes a Verwey-type metal-to-insulator transition (MIT) driven by lattice distortion and a stripe charge order on the Cr sublattice, reminiscent of the physics in Fe$_3$O$_4$. However, atomic distortions occur exclusively at the ligand sites rather than the Cr sites. What drives such a pronounced charge imbalance between Cr sites thus remains a mystery. Utilizing DFT+DMFT calculations, we identify an orbital-selective Mott transition, which leaves the correlated metallic $d_{yz}$ orbital governing the low-energy physics. We demonstrate that S-site distortions trigger an initial, tiny charge asymmetry between Cr sites via Cr-$d_{yz}$ and S-$p$ orbital hybridization. Crucially, this asymmetry is significantly amplified by dynamical electronic correlations, resulting in a large discrepancy in both the charge and electron correlations of the Cr-$d_{yz}$ orbital between distinct Cr sites. This further induces a substantial differentiation in local spin polarizations in the altermagnetic state, ultimately driving the MIT. In contrast, we predict that replacing S with Te weakens this correlation-amplification effect and fails to induce an MIT due to weaker electron correlations. Our findings demonstrate that many-body effects can drastically amplify ligand instabilities to reshape the electronic structure of altermagnets, highlighting that ligand engi fied by dynamical electron correlations.", "Suggests that ligand engineering is crucial for manipulating the electronic phase of altermagnets.", "Provides a theoretical framework for correlation-induced charge ordering in correlated magnets."]}}, {"title": "Pseudo-Goldstone mode in altermagnetic -MnTe: high-field electron spin resonance studies (Phys. Rev. B)", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2510.24376", "authors": "K. Yu. Povarov, J. Wosnitza, S. R\\\"o{\\ss}ler, M. Schmidt, A. A. Tsirlin, S. A. Zvyagin", "last_authors": "S. R\\\"o{\\ss}ler, M. Schmidt, A. A. Tsirlin, S. A. Zvyagin", "summary": "We report multi-frequency electron spin resonance spectroscopy studies of $\\alpha$-MnTe in magnetic fields up to $16$ T, applied along the easy anisotropy axis. At temperatures below $T_\\mathrm{N} = 310$ K, we observe a single resonance line corresponding to the pseudo-Goldstone mode of the antiferromagnetic resonance (AFMR). This mode exhibits the isotropic behavior with $g_\\mathrm{eff}=2.01$, consistent with a complete quench of the orbital angular momenta for Mn$^{2+}$ ions. At low temperatures, the resonance mode is remarkably narrow ($\\sim50$ mT for the full width at the half-maximum at $5$ K). The AFMR mode exhibits substantial broadening with increasing temperature, which can be understood in terms of the magnon-magnon scattering", "tier": "B_IMPORTANT_CONDMAT", "score": "9", "reason": "Experimental study of the pseudo-Goldstone mode in the candidate altermagnet alpha-MnTe.; demoted from A: broad CM, not direct user/project hit", "tags": ["ESR", "MnTe", "altermagnetism"], "image": "https://arxiv.org/html/2510.24376v2/x1.png", "briefing": {"background": "MnTe는 고전적인 반강자성체로, 최근 이 물질이 Altermagnetism의 범주에 속한다는 사실이 재조명되고 있습니다. 특히 자기적 여기(excitation) 스펙트럼은 이들의 대칭성과 스핀 구조를 결정하는 핵심 정보입니다.", "motivation": "알터마그네틱 후보 물질인 alpha-MnTe의 낮은 에너지 여기 모드(pseudo-Goldstone 모드)를 정밀하게 측정하여 자기적 성질을 이해하고자 했습니다.", "result": "16T 자기장 하에서 고주파 ESR 측정을 통해 스핀 파(magnon) 모드를 관측했습니다. g-factor 2.01을 확인하여 Mn2+ 이온의 궤도 각운동량이 완전히 퀜칭되었음을 증명했습니다.", "implication": "알터마그네틱 상태에서 나타나는 스핀 역학의 기본 데이터를 확보했으며, 이는 향후 고주파 spintronics 소자 연구에 필수적인 토대가 됩니다.", "novelty": "알터마그네틱 물질에서 pseudo-Goldstone 모드를 정밀 관측하고 온도의존적 선폭 변화를 magnon-magnon 산란으로 설명한 점이 중요합니다.", "unresolved": "고온에서의 모드 브로드닝 메커니즘을 정량적으로 완벽히 기술하기 위한 추가적 다체 이론 모델이 필요합니다.", "future_work": "중성자 산란을 통한 전체적인 magnon dispersion 분산 관계 측정 및 다른 Altermagnet 후보군과의 비교 연구.", "concepts": [{"term": "Pseudo-Goldstone Mode", "why_emerged": "실제 시스템에서 대칭성이 완전히 깨지지 않거나 이방성이 존재할 때, 골드스톤 모드의 에너지가 0이 아닌 값을 가지는 현상을 기술하기 위해 필요.", "origin": "Goldstone(1961) 이후 응집물질물리에서 정립.", "connections": "Magnon, 대칭성 붕괴, 자성체 역학."}, {"term": "Electron Spin Resonance (ESR)", "why_emerged": "물질 내의 국소 스핀, 자성 구조 및 스핀-궤도 결합 정보를 직접적으로 얻기 위해 필요.", "origin": "Zavoisky (1944)에 의해 발견.", "connections": "Magnon 분광학, 반강자성 공명(AFMR)."}], "english_summary": ["ESR spectroscopy of alpha-MnTe reveals a distinct pseudo-Goldstone magnon mode.", "The result confirms a complete quench of orbital angular momentum for Mn2+ ions.", "Temperature-dependent broadening of the resonance line is attributed to magnon-magnon scattering.", "Provides experimental insights into the spin dynamics of candidate altermagnetic materials."]}}, {"title": "Symmetry, Sound, and the Quest for Chiral Superconductors", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2607.28365", "authors": "B. J. Ramshaw", "last_authors": "B. J. Ramshaw", "summary": "The confirmation of a bulk, topological superconductor is a central goal of modern quantum materials research. Despite decades of searching, no confirmed examples yet exist. A primary difficulty is that most experimental signatures of topological superconductivity are ambiguous and indirect. I review efforts to narrow the search for a chiral topological superconductor using measurements of elastic moduli. In principle, these experiments can provide unambiguous thermodynamic evidence f ult)이 어떻게 위상적 평탄 밴드를 생성하는지 이론적으로 규명하고자 합니다.", "result": "뒤틀린 적층 결함이 모아레 주기성과 Zak 위상 사이의 상호작용을 통해 인터페이스 평탄 밴드를 생성함을 입증했습니다.", "implication": "인공적으로 조절된 뒤틀림뿐만 아니라 천연 적층 결함에서도 위상학적 상관관계 물리학이 나타날 수 있음을 시사합니다.", "novelty": "모아레 물리학을 벌크 물질인 흑연의 결함 구조로 확장하여 위상적 평탄 밴드의 형성 기전을 제시합니다.", "unresolved": "실제 실험에서 이러한 평탄 밴드가 STM/STS 측정 시 어떻게 나타나는지, 그리고 실제 초전도성 등 강상관 현상으로 이어지는지에 대한 실험적 증거가 부족합니다.", "future_work": "고해상도 STM을 이용한 적층 결함에서의 국소 전자 상태 밀도 측정 및 이론적 모델과의 비교.", "concepts": [{"term": "Zak 위상", "why_emerged": "1차원 시스템에서 대칭성에 의해 정의되는 위상학적 불변량을 기술하기 위해 고안되었습니다.", "origin": "J. Zak, 1989년 제안.", "connections": "위상 절연체, 수-클리(Su-Schrieffer-Heeger) 모델, 밴드 구조의 기하학적 성질."}, {"term": "평탄 밴드(Flat Band)", "why_emerged": "운동 에너지가 억제되어 전자 간 상호작용 효과가 지배적이게 되며, 초전도 및 자성 현상의 기원이 됩니다.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "모아레 물리학, 뒤틀린 이중층 그래핀, 강한 상관관계."}], "english_summary": ["Twist stacking faults in rhombohedral graphite generate nearly flat interface bands.", "The mechanism relies on the interplay between moiré periodicity and Zak phase topology.", "The study links structural defects to topological electronic properties in bulk systems.", "These results bridge the gap between moiré physics and intrinsic bulk defects."]}}, {"title": "Field-induced electronic evolution in the correlated semimetal Eu3In2As4", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/wmmn-82ts", "authors": "Xiuliang Yuan, Jingyu Yao, Xiaobo He, et al.", "last_authors": "Zhijun Wang, Youguo Shi", "summary": "The magnetic Zintl phase ${\\mathrm{Eu}}_{3}{\\mathrm{In}}_{2}{\\mathrm{As}}_{4}$ is theoretically predicted to host an ideal Weyl semimetal state in a ferromagnetic order, which could be induced from its antiferromagnetic ground state by an external magnetic field. Through comprehensive magnetotranspo…", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Relevant experimental electronic evolution study in a magnetic correlated semimetal.", "tags": ["experiment", "Weyl", "correlated"], "image": "", "briefing": {"background": "자기 위상 물질(Magnetic topological materials)은 자기적 질서와 위상적 전자 구조가 결합된 상태를 연구하는 분야입니다. 외부 자기장으로 자기 구조를 제어하여 위상적 상전이를 유도하고, 이를 통해 Weyl 준금속 등의 특이한 전도 현상을 관찰하는 것이 핵심 문제입니다.", "motivation": "Eu3In2As4는 이론적으로 강자성 상태에서 이상적인 Weyl 준금속이 될 것으로 예측되지만, 실제로는 반강자성 기저 상태를 가집니다. 따라서 외부 자기장을 통해 이 물질의 전자 구조가 어떻게 진화하는지 실험적으로 확인하고자 했습니다.", "result": "외부 자기장을 인가하여 반강자성 상태에서 강자성 상태로의 자기적 전이를 유도하고, 그에 따른 수송 특성 변화를 통해 전자 구조의 진화를 추적했습니다.", "implication": "자기장 제어를 통해 위상적 준금속 상태를 활성화할 수 있음을 보여주며, 이는 자기적 위상 소자 구현을 위한 기초가 됩니다.", "novelty": "이론적 예측과 실험적 관찰을 연결하는 구체적인 자기장 유도 전자 구조 진화 연구라는 점에서 의미가 있습니다.", "unresolved": "초록 정보만으로는 상세한 위상 불변량(topological invariant) 변화나 ARPES를 통한 직접적인 밴드 관측이 언급되지 않아 추가 확인이 필요합니다.", "future_work": "ARPES를 이용한 자기장 인가 하의 직접적인 밴드 구조 관측 및 Weyl 노드 제어 실험이 필요합니다.", "concepts": [{"term": "Weyl 준금속", "why_emerged": "에너지 밴드가 선형적으로 교차하는 Weyl 노드를 가지는 물질을 찾기 위해 등장했습니다.", "origin": "Herring(1937)이 처음 이론적으로 제시하고 2015년경 TaAs 등에서 실험적으로 확립되었습니다.", "connections": "Berry 곡률, 비정상 홀 효과와 밀접한 관련이 있습니다."}, {"term": "Zintl 상", "why_emerged": "이온성 및 공유 결합이 공존하는 전자적으로 흥미로운 반도체 및 금속 물질을 체계화하기 위해 사용됩니다.", "origin": "Eduard Zintl에 의해 명명되었습니다.", "connections": "복잡한 결정 구조 내의 전자 분율을 이해하는 데 사용됩니다."}], "english_summary": ["Study of the magnetic Zintl phase Eu3In2As4.", "Investigates the field-induced evolution from AFM to FM phase.", "Aims to realize the theoretically predicted Weyl semimetal state.", "Provides magnetotransport evidence for electronic structural changes."]}}, {"title": "Intrinsic magnetotransport and orientation-dependent topological Hall effect in EuAuBi", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/gsjl-qnv7", "authors": "Lipika, Sneh, Shobha Singh, Ralf Koban, Walter Schnelle, Kaustuv Manna", "last_authors": "Walter Schnelle, Kaustuv Manna", "summary": "We report the growth of high-quality single crystals of the magnetic topological semimetal EuAuBi using a Pb-flux method, which effectively suppresses the formation of secondary ${\\mathrm{Au}}_{2}\\mathrm{Bi}$ impurity phases that were prevalent in the previously reported Bi-flux grown crystals. This…", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Experimental study of topological semimetal magnet with anomalous Hall physics.", "tags": ["experiment", "topologicalsemimetal", "Halleffect"], "image": "", "briefing": {"background": "자기 위상 준금속은 비정상 홀 효과(AHE)와 위상 홀 효과(THE)와 같은 비자명한 수송 특성을 나타내는 연구 분야입니다. 물질의 불순물 제어와 고품질 결정 성장이 정확한 물성 측정의 선결 과제입니다.", "motivation": "이전의 Bi-flux 성장 방식으로는 불순물 상인 Au2Bi가 섞여 정확한 물성 측정이 어려웠습니다. 이를 해결하기 위해 Pb-flux를 이용한 고품질 시료 제작이 필요했습니다.", "result": "Pb-flux 방법으로 불순물이 없는 EuAuBi 단결정을 성공적으로 성장시켰으며, 이를 통해 본질적인 비정상/위상 홀 효과를 측정했습니다.", "implication": "고품질 시료를 통해 기존에 보고된 불순물 유래 현상과 진정한 본질적 위상 현상을 분리해낼 수 있음을 보여줍니다.", "novelty": "성장 방법론의 개선이 물리적 해석의 정확도를 어떻게 바꾸는지 보여주는 좋은 사례이며, Eu-기반 자성 위상 물질 연구에 중요한 시료를 제공합니다.", "unresolved": "위상 홀 효과가 유도되는 정확한 자기적 스핀 구조(스카이뮴 등)의 실체는 추가적인 중성자 산란 연구가 필요합니다.", "future_work": "중성자 산란이나 자기 힘 현미경을 통한 자구 구조 시각화 및 ARPES를 통한 위상 밴드 구조 검증.", "concepts": [{"term": "비정상 홀 효과", "why_emerged": "강자성 물질에서 자기장뿐만 아니라 물질 고유의 Berry 곡률에 의해 나타나는 홀 전압을 이해하기 위해 필요합니다.", "origin": "Edwin Hall(1881)이 발견하고 Karplus와 Luttinger(1954)가 이론을 제시했습니다.", "connections": "위상적 밴드 구조와 스핀-궤도 결합에 직접적으로 연결됩니다."}, {"term": "위상 홀 효과", "why_emerged": "비균일한 스핀 구조(스카이뮴 등)가 전자 이동에 가하는 유효 자기장에 의한 현상을 설명하기 위해 등장했습니다.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "스핀 텍스처, 비자명한 위상 위상과 연결됩니다."}], "english_summary": ["Growth of high-quality EuAuBi single crystals using Pb-flux.", "Eliminates Au2Bi impurity phases prevalent in Bi-flux samples.", "Reports intrinsic magnetotransport and orientation-dependent topological Hall effect.", "Highlights the importance of crystal growth for topological semimetal physics."]}}, {"title": "Multiorbital character of the density wave in trilayer nickelate superconductors", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/znvc-8425", "authors": "Abhi Suthar, Vignesh Sundaramurthy, Matías Bejas, et al.", "last_authors": "Andrés Greco, Matthias Hepting", "summary": "Ruddlesden–Popper nickelates exhibit high-temperature superconductivity closely intertwined with charge and spin density waves. However, fundamental questions persist regarding the interplay between the associated density wave (DW) fluctuations and superconductivity, as well as the orbital character and symmetry underlying the DW instabilities. Here, we utilize polarized Raman scattering to investigate the phononic and electronic Raman responses of the trilayer nickelate La 4 Ni 3 O 10 across its concomitant charge and spin density wave transitions. In addition to distinct phonon anomalies occurring below the transition temperature, we observe a depletion of continuum spectral weight up to 114 meV and a pronounced peak centered at this energy. By combining momentum-selective information from polarized electronic Raman scattering with Raman-response model calculations based on a multiorbital Raman vertex in a reconstructed two-orbital DW state involving both Ni − 3 d x 2 − y 2 and Ni − 3 d z 2 orbitals, we identify 114 meV as the energy scale 2 Δ DW of the DW gap, characterized by incoherent opening and non-mean-field behavior. Furthermore, the model calculations reveal that the corresponding 2 Δ DW peak has a multiorbital origin, requiring both orbital contributions and their mixing beyond single-orbital projections, thus shedding light on the nature of the DW instabilities in La 4 Ni 3 O 10 .", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Nickelate superconductors are high-priority as they share themes with unconventional superconductivity.", "tags": ["theory", "nickelate", "superconduct"], "image": "", "briefing": {"background": "니켈산염은 구리산염(cuprate) 고온 초전도체와 유사한 전자 구조를 가지고 있어, 강상관 전자계에서 전하 및 스핀 밀도 파(DW)와 초전도성 사이의 상호작용을 연구하는 핵심 물질군입니다.", "motivation": "La4Ni3O10 삼중층 니켈산염에서 나타나는 전하/스핀 밀도 파의 오비탈 특성과 에너지 갭의 기원을 밝혀, 초전도 현상과의 연관성을 이해하고자 했습니다.", "result": "편광 라만 분광법을 통해 114 meV 에너지에서 전하 밀도 파(DW) 갭을 관측했습니다. 이 갭이 Ni-3dx2-y2와 Ni-3dz2 오비탈이 섞인 다중 오비탈 특성을 가짐을 모델 계산으로 입증했습니다.", "implication": "니켈산염의 밀도 파가 단순한 단일 오비탈 현상이 아닌 다중 오비탈의 복합적인 상호작용임을 밝혀, 이 물질군의 초전도 메커니즘 해석에 중요한 단서를 제공합니다.", "novelty": "다중 오비탈 라만 꼭짓점 모델을 통해 DW의 오비탈 기여도를 규명한 점이 학술적으로 매우 중요합니다.", "unresolved": "이러한 밀도 파 상태가 초전도성과 정확히 어떤 경쟁적/협력적 관계에 있는지에 대한 직접적인 증거는 추가 연구가 필요합니다.", "future_work": "도핑에 따른 DW의 억제와 초전도성의 출현을 연계한 라만 분광 연구 및 DFT+DMFT를 통한 전자 구조의 이론적 보강.", "concepts": [{"term": "밀도 파 (Density Wave)", "why_emerged": "전자의 전하 밀도나 스핀 밀도가 주기적으로 재배열되는 상태를 설명하기 위해 등장했습니다.", "origin": "Peierls(1955)가 1차원 도체에서 전하 밀도 파를 제안하며 시작되었습니다.", "connections": "초전도성과의 경쟁 관계, 페르미 면 중첩(nesting)과 관련됩니다."}, {"term": "다중 오비탈 (Multiorbital)", "why_emerged": "단일 밴드 모델로 설명되지 않는 강상관 물질의 전자 상호작용을 이해하기 위해 필수적입니다.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "Hund 결합, 훈트 금속과 연결됩니다."}], "english_summary": ["Investigates the density wave (DW) in trilayer nickelate La4Ni3O10.", "Identifies a 114 meV DW gap using polarized Raman scattering.", "Confirms multiorbital character involving Ni 3dx2-y2 and 3dz2 orbitals.", "Provides insights into the link between density wave instabilities and superconductivity."]}}, {"title": "Percolation-driven ferromagnetism in a dilute magnetic topological insulator", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/fb7q-qfpw", "authors": "Farhan Islam, Santanu Pakhira, Deborah L. Schlagel, et al.", "last_authors": "Robert J. McQueeney, David Vaknin", "summary": "Single-crystal neutron scattering and magnetic susceptibility measurements of the dilute magnetic topological insulator (${\\mathrm{Sn}}_{0.9}{\\mathrm{Mn}}_{0.1})\\mathrm{Te}$ demonstrate the emergence of long-range ferromagnetic (FM) order below ${T}_{\\mathrm{C}}=12±1\\phantom{\\rule{0.16em}{0ex}}\\math…", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Neutron scattering on magnetic topological insulators is relevant to the user profile.", "tags": ["experiment", "neutronscattering", "topology"], "image": "", "briefing": {"background": "위상 절연체(TI)에 자성 불순물을 도핑하여 자기적 질서와 위상 상태를 결합하려는 연구는 양자 변칙 홀 효과와 같은 위상 양자 현상 구현을 위해 매우 중요합니다.", "motivation": "SnTe 기반의 희석 자성 위상 절연체(DM-TI)인 (Sn,Mn)Te에서 강자성 질서가 발생하는 미시적 기원과 그 메커니즘을 규명하고자 합니다.", "result": "중성자 산란 및 자기 감수성 측정 결과, Mn 도핑된 SnTe 시스템에서 강자성 질서가 단순한 교환 상호작용이 아닌 퍼콜레이션(percolation) 모델에 의해 지배됨을 확인했습니다.", "implication": "희석 자성 위상 절연체의 자기 상태가 도펀트의 공간적 분포와 통계적 연결성에 크게 의존함을 의미하며, 이는 위상 물성을 제어하기 위한 재료 설계의 지침이 됩니다.", "novelty": "벌크 수준에서 중성자 산란을 통해 자기 구조를 명확히 규명함으로써, 국소적인 자기 모멘트가 어떻게 거시적인 강자성으로 전이되는지를 퍼콜레이션 관점에서 해석했습니다.", "unresolved": "퍼콜레이션 임계값 근처에서의 정확한 자기적 불균질성이나 위상 표면 상태와의 구체적인 결합 방식은 여전히 규명 과제입니다.", "future_work": "도핑 농도를 정밀하게 제어하여 퍼콜레이션 경로를 직접 시각화하거나, 위상 표면 상태가 이러한 퍼콜레이션 유도 자기질서에 의해 어떻게 변조되는지 ARPES로 연구할 필요가 있습니다.", "concepts": [{"term": "퍼콜레이션(Percolation)", "why_emerged": "불균질한 매질에서 국소적인 요소들이 서로 연결되어 거시적인 전도성이나 질서를 형성하는 경로를 설명하기 위해 등장했습니다.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "무질서계 물성, 자기적 강자성 전이 이론."}, {"term": "희석 자성 위상 절연체(DM-TI)", "why_emerged": "위상 절연체의 대칭성을 자기적으로 깨뜨려 양자 변칙 홀 효과와 같은 이국적인 위상 상태를 구현하기 위해 도입되었습니다.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "위상 절연체(TI), 양자 변칙 홀 효과(QAHE)."}], "english_summary": ["The paper investigates the magnetic origin of (Sn,Mn)Te dilute magnetic topological insulators.", "Neutron scattering reveals that ferromagnetic order is driven by a percolation mechanism rather than long-range exchange coupling.", "This finding highlights the role of dopant connectivity in establishing magnetic topological phases.", "The results suggest that spatial homogeneity is critical for engineering topological magnetic materials."]}}, {"title": "Possible enhancement of superconductivity in ambient-pressure La3Ni2O7 thin films", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/t8s3-v8mt", "authors": "Yichen Hua, Wenxin He, Wei-Qiang Chen, Jian-Jian Miao, Changming Yue", "last_authors": "Jian-Jian Miao, Changming Yue", "summary": "As an unconventional superconducting system capable of reaching 60 K under ambient pressure, the ${\\mathrm{La}}_{3}{\\mathrm{Ni}}_{2}{\\mathrm{O}}_{7}$ thin-film superconductor has recently become a focal point in the field of superconductivity, calling for further theoretical exploration of its possi…", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Important research on nickelate superconductivity, a key area of interest for correlated materials.", "tags": ["nickelates", "superconductivity"], "image": "", "briefing": {"background": "La3Ni2O7은 60K 수준의 높은 전이 온도를 가지는 것으로 보고된 차세대 고온 초전도체 후보 물질로, 구리산화물과는 다른 기전의 초전도 연구가 활발합니다.", "motivation": "최근 La3Ni2O7의 고압 하 초전도성에 관한 논란과 관심이 증대됨에 따라, 박막 상태에서의 물리적 특성과 초전도성 강화 가능성을 이론적으로 탐색하고자 합니다.", "result": "박막 구조에서의 에피택셜 변형과 전기적 특성을 고려할 때, 특정 조건에서 초전도성을 강화할 수 있는 메커니즘과 그에 따른 전자 구조적 변화를 예측했습니다.", "implication": "La3Ni2O7 박막 연구가 상압 초전도체 구현을 위한 핵심적 경로가 될 수 있음을 시사하며, 박막 성장을 통한 물성 튜닝이 유망함을 보여줍니다.", "novelty": "벌크 단결정 위주의 연구에서 박막으로 연구 대상을 확장하여, 구조적 제약을 통한 초전도성 제어의 가능성을 제시했습니다.", "unresolved": "실제 실험적으로 성장된 박막에서의 산소 결함 및 정량적인 격자 변형 효과가 초전도성에 미치는 영향은 추가 검증이 필요합니다.", "future_work": "La3Ni2O7 박막의 합성 실험과 더불어 ARPES를 통한 페르미 표면 측정 및 전자 상관관계 변화에 대한 검증 연구가 요구됩니다.", "concepts": [{"term": "La3Ni2O7", "why_emerged": "구리산화물 이후의 새로운 고온 초전도체 후보물질로서, 니켈 기반의 전자 구조가 가진 상관관계 물성을 탐구하기 위해 주목받았습니다.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "구리산화물(cuprates), 층상형 니켈산염."}, {"term": "상압 초전도체", "why_emerged": "초전도 응용의 가장 큰 걸림돌인 고압 조건을 극복하여 상용화를 앞당기기 위해 제안되었습니다.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "고압 물리학, 초전도 응용 기술."}], "english_summary": ["This study examines the potential for enhanced superconductivity in La3Ni2O7 thin films.", "Theoretical analysis suggests that epitaxial strain and structural modulation can optimize superconducting properties.", "The work provides a framework for understanding nickelate-based superconductivity beyond bulk materials.", "These findings emphasize thin-film engineering as a pathway to ambient-pressure superconductivity."]}}, {"title": "Staggered Dzyaloshinskii-Moriya and the spin-canting angle in centrosymmetric altermagnetic and ferromagnetic phases: Influence on the anomalous Hall effect and Weyl points", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/rjg7-n1tc", "authors": "Mathews Benny, Xujia Gong, Kamil Jamroszczyk, et al.", "last_authors": "Jan Skolimowski, Carmine Autieri", "summary": "We present a simple methodology to compute the anomalous Hall conductivity (AHC) as a function of the canting angles in ferromagnets and altermagnets, starting from a nonmagnetic Hamiltonian obtained from first-principles calculations that preserves the full symmetry of the crystal structure. Magnet…", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Directly relevant to altermagnets and Weyl physics interpretation.", "tags": ["theory", "altermagnet", "Weyl", "Halleffect"], "image": "", "briefing": {"background": "Altermagnet는 자성체와 비자성체의 특징을 동시에 가지며, 스핀 분리된 전자 구조로 인해 기존의 강자성체와는 다른 독특한 위상 물성을 보입니다.", "motivation": "자성체와 알터자성체(altermagnet) 내의 스핀 기울기(canting angle)가 비정상 홀 효과(AHE)와 Weyl 점의 위치에 미치는 영향을 정량적으로 계산하는 방법론이 필요했습니다.", "result": "강자성과 알터자성 상에서 비자성 해밀토니안으로부터 시작하여 스핀 각도에 따른 비정상 홀 전도도를 산출하는 간단한 계산법을 제안했습니다.", "implication": "복잡한 자성 구조를 가진 시스템에서 위상 물성을 예측하고 제어하는 데 있어, 스핀 각도라는 단순한 파라미터를 통해 홀 전도도와 Weyl 점의 변화를 추적할 수 있습니다.", "novelty": "기존의 복잡한 제일원리 계산을 단순화하여 대칭성을 보존하면서도 알터자성체의 특수한 물리 현상을 정량화했다는 점에서 방법론적 가치가 높습니다.", "unresolved": "강한 전자 상관관계가 중요한 강상관 시스템에서는 본 이론적 방법론의 정확도가 제한될 가능성이 있습니다.", "future_work": "본 모델을 실제 알터자성 후보 물질에 적용하여 실험적 비정상 홀 효과 데이터와 비교하고, 위상적 Weyl 점의 전이를 직접 탐색할 예정입니다.", "concepts": [{"term": "알터자성(Altermagnetism)", "why_emerged": "강자성도 반강자성도 아닌, 스핀 분리된 전자 구조를 가져 스핀 수송 효율이 높은 새로운 자성 상태를 기술하기 위해 등장했습니다.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "반강자성, 강자성, 위상 물성."}, {"term": "비정상 홀 효과(AHE)", "why_emerged": "자성 물질 내부의 스핀-궤도 결합과 베리 곡률에 의해 발생하는 횡방향 전도 현상을 이해하기 위해 연구되었습니다.", "origin": "Edwin Hall (1879), 이후 위상 물성 이론으로 정립", "connections": "베리 곡률(Berry curvature), Weyl semimetals."}], "english_summary": ["The paper introduces a method to calculate anomalous Hall conductivity in ferromagnets and altermagnets.", "The approach links spin-canting angles directly to the evolution of Weyl points and Hall effects.", "It provides a simplified framework derived from nonmagnetic Hamiltonians to capture symmetry-protected transport.", "This methodology serves as a useful tool for analyzing topological phases in emerging magnetic materials."]}}, {"title": "Suppression of magnetism in Co3Sn2S2 under external pressure", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/v623-m3y4", "authors": "A. Chmeruk, D. Jones, R. Dwadasi, J. Ebad-Allah, F. Beiuşeanu, F. Schilberth, et al.", "last_authors": "H. Nakamura, C. A. Kuntscher, A. Östlin, and L. Chioncel", "summary": "Magnetic materials with nontrivial band topology combine key concepts of modern solid-state physics and are expected to broaden the range of emergent quantum phases. At the same time, external pressure has proven to be a viable tool in manipulating the band topology and magnetism. Using first-principle simulations combined with optical spectroscopy measurements, the authors show here how the correlation effects are largely responsible for the suppression of the ferromagnetic state in a prototypical Weyl semimetal Co 3 Sn 2 S 2 under external pressure.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Experimental study of pressure effects on a known magnetic Weyl semimetal.", "tags": ["experiment", "Weyl", "topology"], "image": "", "briefing": {"background": "자기적 위상 반금속(magnetic Weyl semimetal)은 위상적 밴드 구조와 자기적 질서가 공존하여, anomalous Hall 효과 등 독특한 양자 수송 현상을 유도합니다. 외부 압력은 격자 상수를 변화시켜 이러한 위상적 특성과 자기적 상태 사이의 상호작용을 제어하는 강력한 실험적 도구입니다.", "motivation": "Co3Sn2S2는 대표적인 강자성 Weyl 반금속으로, 압력 인가 시 자기적 질서가 어떻게 억제되는지에 대한 전자 상관관계의 역할을 규명하고자 합니다.", "re
