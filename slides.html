chnique has been used to mitigate this, but its gauge-invariant status was previously unproven.", "This study analytically proves that NSS is uniquely consistent with gauge invariance in the static long-wavelength limit by solving the Bethe-Salpeter equation.", "The result provides a firm microscopic justification for using NSS in analyzing electromagnetic responses in topological Dirac materials."]}}, {"title": "Generalized Critical-State Analysis of Local Field Screening in High-Pressure Yttrium Polyhydride", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2611.25456", "authors": "A. G. Gavriliuk, I. A. Troyan, A. A. Mironovich, A. G. Ivanova, H. -K. Mao, V. V. Struzhkin", "last_authors": "H. -K. Mao, V. V. Struzhkin", "summary": "We resolve the long-standing controversy over the interpretation of magnetic-flux expulsion in high-pressure superhydrides by measuring the local magnetic field adjacent to yttrium polyhydride at 171 GPa and 4.1 K with a 57 Fe Mössbauer sensor. Nuclear forward scattering tracks the local induction B sensor ​ ( B a ) B_{\\rm sensor}(B_{a}) , which nearly merges with the normal-state line near 1.5 T. Rather than assuming a constant-current Bean state, we solve the critical-state problem for the actual thin-disk geometry using the Shantsev–Clem–Sanchez method and compare generalized field-dependent critical-state models. Both the Kim and exponential laws reproduce the measured virgin branch, whereas the constant- J c J_{c} Bean model fails. The corresponding zero-field critical-current densities, ( 4.38 ± 1.48 ) × 10 11 (4.38\\pm 1.48)\\times 10^{11} and ( 2.45 ± 0.22 ) × 10 11 (2.45\\pm 0.22)\\times 10^{11} A/m 2 , respectively, are consistent in order of magnitude with transport estimates for granular YH 6 . These results establish that the observed flux expulsion is a pinned critical state, not the equilibrium Meissner effect, and demonstrate a general methodology for probing local superconductivity under extreme conditions.", "tier": "B_IMPORTANT_CONDMAT", "score": "7", "reason": "Experimental study of local field screening and critical state in high-pressure superconductivity.", "tags": ["superconductivity", "experiment", "high_pressure", "magnetism"], "image": "https://arxiv.org/html/2611.25456v1/fig2f.png", "briefing": {"background": "고압 하에서 발견되는 수소화물 초전도체는 극한 조건에서의 물성 측정이 어렵고, 자기장 하에서의 자속 튕겨내기 현상이 초전도 Meissner 효과인지 아니면 단순한 자속 핀닝에 의한 것인지 판별하기가 매우 어렵습니다.", "motivation": "YH6와 같은 고압 수소화물에서 측정되는 자기장 튕겨내기 데이터가 기존의 상수 전류 기반의 Bean 모델로는 설명되지 않는 모순을 해결하고자 했습니다.", "result": "57Fe 뫼스바우어 센서를 이용해 YH6의 국소 자기장을 측정하고, 이를 Shantsev-Clem-Sanchez 방법으로 분석하여 자속 튕겨내기가 평형 상태의 Meissner 효과가 아닌 핀닝된 임계 상태(critical state)임을 규명했습니다.", "implication": "고압 초전도체의 자성 측정 데이터를 해석하는 표준적인 방법론을 제시하였으며, 향후 고압 연구에서의 자기적 특성 분석 정확도를 크게 높일 것입니다.", "novelty": "기존 상수 전류 Bean 모델의 한계를 극복하고, 현장 비의존적인 임계 전류 모델을 적용하여 고압 초전도체의 임계 전류 밀도를 정확히 추산했다는 점이 중요합니다.", "unresolved": "시료 내부의 균질성 문제와 입자 경계에서의 자속 역학이 전체 임계 전류 밀도에 미치는 기여를 완전히 분리하는 데는 한계가 있습니다.", "future_work": "더 넓은 압력 범위에서의 측정을 통해 임계 전류의 압력 의존성을 조사하고, 다른 고압 수소화물 시스템으로의 방법론 확장이 기대됩니다.", "concepts": [{"term": "Critical-state model (Bean model)", "why_emerged": "초전도체 내부에 침투한 자기장이 핀닝 센터에 의해 고정되어 발생하는 히스테리시스를 설명하기 위해 제안됨.", "origin": "C. P. Bean (1962).", "connections": "자기 이력 현상, 임계 전류 밀도, 자속 핀닝."}, {"term": "Mössbauer spectroscopy", "why_emerged": "물질 내부의 국소적인 자기장 환경과 원자의 원자가 상태를 정밀하게 탐침하기 위해 필요함.", "origin": "Rudolf Mössbauer (1958).", "connections": "초미세 상호작용, 자기 구조 분석, 고압 물리."}, {"term": "Flux expulsion", "why_emerged": "초전도체의 특성인 반자성(Meissner 효과)과 핀닝된 상태의 자속 분포를 실험적으로 구별하기 위해 중요함.", "origin": "Walther Meissner, Robert Ochsenfeld (1933).", "connections": "초전도성, Type-II 초전도체, 자기장 차폐."}], "english_summary": ["Magnetic flux expulsion in high-pressure yttrium polyhydride is often debated as either the Meissner effect or flux pinning.", "Using 57Fe Mössbauer sensing at 171 GPa, the study analyzes the local magnetic induction to solve the critical-state problem.", "The results show that the observed flux behavior follows generalized critical-state models rather than the constant-current Bean model.", "This work clarifies that flux expulsion is a pinned critical state and establishes a robust methodology for magnetic probing under extreme pressure."]}}, {"title": "Higher-order magnetic hopfions in uniaxial chiral magnets", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2611.25883", "authors": "Vladyslav M. Kuchkin, Nikolai S. Kiselev", "last_authors": "Vladyslav M. Kuchkin, Nikolai S. Kiselev", "summary": "Chiral magnets host hopfions, but their experimentally observed configurations are largely limited to hopfion rings, heliknotons, and their clusters. Here, we show that uniaxial anisotropy stabilizes a diverse family of knotted and linked hopfions with zero and arbitrary positive Hopf indices. We identify their stability regions in the anisotropy -- field parameter space and introduce a systematic construction based on mapping skyrmion braids into three-dimensional magnetic textures. We find that the minimum energy of stable hopfions increases approximately linearly with the Hopf index.", "tier": "B_IMPORTANT_CONDMAT", "score": "7", "reason": "Theoretical study of higher-order magnetic hopfions in chiral magnets, relevant to topological magnetism.", "tags": ["theory", "topologicalmagnetism", "chiralmagnets", "magnetictextures"], "image": "https://arxiv.org/html/2611.25883v1/Fig1_1.png", "briefing": {"background": "카이랄 자성체에서는 비대칭적 교환 상호작용(Dzyaloshinskii-Moriya interaction)으로 인해 스카이머리온이나 호프리온(Hopfion)과 같은 복잡한 위상적 자기 텍스처가 형성됩니다.", "motivation": "기존 연구는 주로 단순한 호프리온 고리나 헬리노톤(heliknoton)에 집중되어 있었으나, 일축 이방성(uniaxial anisotropy)을 고려할 때 더 다양하고 복잡한 위상적 결함이 존재할 가능성을 탐구하고자 했습니다.", "result": "일축 이방성과 외부 자기장의 파라미터 공간에서 Hopf 지수가 0이거나 양의 정수인 다양한 매듭 형태의 호프리온 안정성 영역을 찾아냈습니다.", "implication": "자기 위상 물질에서 정보 저장을 위한 새로운 위상적 비트 후보들을 제안하며, 3차원 자기 텍스처 공학의 설계도를 확장했습니다.", "novelty": "스카이머리온 브레이드 구조를 3차원 호프리온으로 매핑하는 체계적인 구성 방법을 제시하여, 복잡한 3D 자기 구조에 대한 이론적 통찰을 제공합니다.", "unresolved": "실제 실험적으로 이 높은 Hopf 지수를 가진 구조들을 개별적으로 제어하거나 관찰할 수 있는 구체적인 프로토콜은 아직 미지수입니다.", "future_work": "이러한 고차 호프리온의 전류 구동 동역학 및 위상적 홀 효과에 대한 계산 연구가 이어질 것으로 보입니다.", "concepts": [{"term": "Hopfion", "why_emerged": "3차원 공간에서 스카이머리온이 고리 형태로 닫히거나 매듭지어지는 위상학적으로 보호된 자기적 결함을 기술하기 위해 필요함.", "origin": "F. Wilczek and A. Zee (1983 - 수학적 유래), 자기 물질에서는 최근 수년 내 대두.", "connections": "Hopf 불변량, 스카이머리온, 위상 물성."}, {"term": "Chiral magnet", "why_emerged": "반전 대칭성이 깨진 격자 구조에서 나타나는 Dzyaloshinskii-Moriya 상호작용을 통해 비자명한 자기 구조를 구현하기 위해 도입됨.", "origin": "I. Dzyaloshinskii (1958), T. Moriya (1960).", "connections": "DMI 상호작용, 스카이머리온, 위상적 홀 효과."}, {"term": "Hopf index", "why_emerged": "3차원 자기 텍스처의 위상학적 특성을 정량화하고 분류하기 위한 위상적 불변량으로 필요함.", "origin": "Heinz Hopf (1931 - 수학적 유래).", "connections": "위상 위상학, 결속 이론, 3D 자기 구조 안정성."}], "english_summary": ["Chiral magnets host topological textures like hopfions, but their stable configurations are often limited to simple ring structures.", "This study identifies a diverse family of knotted and linked hopfions stabilized by uniaxial anisotropy.", "A systematic construction method using skyrmion braids is introduced to map and predict these 3D magnetic textures.", "The results show that stability is tunable via anisotropy and field parameters, expanding the potential for 3D topological magnetic devices."]}}, {"title": "Josephson effect in bipolar magnetic semiconductors", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2608.24322", "authors": "Polireddi Naveen, Abhiram Soori", "last_authors": "Polireddi Naveen, Abhiram Soori", "summary": "We theoretically investigate equilibrium currents in a one-dimensional Josephson junction incorporating a bipolar magnetic semiconductor (BMS). We show that the intrinsic exchange splitting of the spin-resolved bands enables purely electrical control of the $0$--$\\pi$ transition through gate-tunable modulation of the BMS chemical potential, eliminating the need for an external magnetic field. This provides a viable route toward electrically tunable $\\pi$-junction behavior and highlights the potential of BMS-based Josephson devices for phase-controllable superconducting electronics. Furthermore, in the presence of Rashba spin--orbit coupling, we find an anomalous Josephson effect characterized by a finite equilibrium supercurrent at zero phase difference. This behavior originates from the intrinsic breaking of time-reversal symmetry associated with the spin-polarized electronic structure of the BMS. Interestingly, despite the simultaneous breaking of time-reversal and inversion symmetries---conditions often associated with nonreciprocal superconducting transport---we do not observe a Josephson diode effect. Our results therefore highlight an important distinction between anomalous Josephson transport and superconducting nonreciprocity: the former does not necessarily imply a finite critical-current asymmetry between opposite current directions.", "tier": "B_IMPORTANT_CONDMAT", "score": "7", "reason": "Theoretical study of Josephson effect in magnetic semiconductors with electrical control and anomalous effects; relevant to superconductivity.", "tags": ["superconductivity", "Josephsoneffect", "magneticsemiconductor", "theory", "spintronics"], "image": "https://arxiv.org/html/2608.24322v2/schematic.png", "briefing": {"background": "조셉슨 접합은 두 초전도체가 약하게 결합된 상태로, 위상 차이에 따른 초전도 전류의 흐름을 이용합니다. 최근에는 자성체나 스핀-궤도 결합(SOC)을 접합부에 도입하여 전하 흐름을 외부 자기장 없이 제어하거나 비가역적인 수송 현상을 탐구하는 연구가 활발합니다.", "motivation": "이 연구는 양극성 자기 반도체(BMS)를 조셉슨 접합의 장벽으로 사용하여, 외부 자기장이 아닌 게이트 전압으로 0-pi 전이와 같은 위상 제어 기능을 구현하고자 합니다.", "result": "게이트 전압을 통해 BMS의 화학적 퍼텐셜을 조절함으로써 0-pi 전이를 유도할 수 있음을 보였습니다. 또한, 라쉬바 SOC 하에서 시간 반전 대칭성이 깨져 평형 상태에서도 비영인 전류가 흐르는 이상 조셉슨 효과를 확인했습니다.", "implication": "이러한 소자는 외부 자기장 없이도 위상 제어가 가능하여 초전도 양자 컴퓨팅 및 저전력 스핀트로닉스 소자의 효율적인 설계에 기여할 수 있습니다.", "novelty": "자기적 성질과 전기적 제어 능력을 결합한 BMS 기반 조셉슨 접합에서, 이상 조셉슨 효과는 나타나지만 초전도 다이오드 효과(비상반성)는 반드시 동반되지 않는다는 이론적 구분을 명확히 했습니다.", "unresolved": "초전도 다이오드 효과가 나타나지 않는 물리적 조건을 식별했지만, 실제 실험에서 발생할 수 있는 결함이나 불순물 효과에 대한 고려는 추가 연구가 필요합니다.", "future_work": "실제 BMS 재료를 이용한 실험적 구현 및 나노구조에서의 비평형 상태 전송 특성 연구가 예상됩니다.", "concepts": [{"term": "BMS (양극성 자기 반도체)", "why_emerged": "스핀-업과 스핀-다운 밴드의 정렬을 다르게 하여 스핀 편극 전류를 전기적으로 조절하기 위해 제안됨.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "스핀트로닉스, 조셉슨 접합, 라쉬바 SOC."}, {"term": "0-pi 전이", "why_emerged": "조셉슨 전류의 부호가 바뀌는 현상으로, 스핀 플립 산란이나 자성 불순물에 의해 발생함.", "origin": "초기에는 Bulaevskii 등에 의해 이론화됨.", "connections": "파이-접합, 스핀 밸브."}, {"term": "이상 조셉슨 효과", "why_emerged": "위상 차이가 0일 때도 전류가 흐르는 현상을 통해 위상적 비자명성을 탐구하기 위해 연구됨.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "초전도 다이오드 효과, 시간 반전 대칭성 파괴."}], "english_summary": ["The paper theoretically explores Josephson junctions using a bipolar magnetic semiconductor (BMS) as a barrier.", "Electrical gate-tuning of the BMS enables control of the 0-pi transition without external magnetic fields.", "Anomalous Josephson effects are observed due to broken time-reversal symmetry, but nonreciprocal superconducting transport (Josephson diode effect) is absent.", "The study distinguishes between anomalous Josephson current and superconducting nonreciprocity."]}}, {"title": "Magnetic field induced modulation of heat transport in CrPS4 probed by TaIrTe4 transverse Seebeck thermometry", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2610.19833", "authors": "Krishnaraajan Sundararajan, Sergio Alvarruiz, C\\'edric A. Cordero-Silis, et al.", "last_authors": "Joseph Barker, Bart J. van Wees", "summary": "Understanding and controlling heat flow in low-dimensional magnetic materials is central to thermoelectrics and spin caloritronics. One of the challenges is the absence of sensitive probes of small, field-dependent modulations in thermal transport. Here we demonstrate transverse Seebeck thermometry using exfoliated TaIrTe$_4$ as a probe of thermal conductivity modulated by an external magnetic field on a van der Waals magnet, CrPS$_4$. With a temperature gradient oriented at $45^\\circ$ to its principal crystallographic axes, TaIrTe$_4$ exhibits a transverse thermopower exceeding $200~\\mathrm{\\mu V\\,K^{-1}}$ for 900 nm wide and 30 $\\mu$m long electrodes, enabling precise detection of variations in the local temperature gradients. Exploiting this with CrPS$_4$ in a nonlocal geometry, we resolve distinct field dependent thermal conductivity changes associated with both the spin-flip and spin-flop magnetic transitions which we attribute to variations in the magnon$-$phonon coupling in CrPS$_4$. At 5 K, the transverse Seebeck response is modulated by more than 8$\\%$ by an external magnetic field, demonstrating strong magnetic control of heat transport in CrPS$_4$. This all van der Waals platform offers high sensitivity to modulations of thermal conductivity and a broad adaptability to a wide range of exfoliated magnetic systems.", "tier": "B_IMPORTANT_CONDMAT", "score": "7", "reason": "Experimental study of magnetic field effects on heat transport in a van der Waals magnet.", "tags": ["experiment", "vanderWaals", "magnetism", "thermaltransport", "magnons"], "image": "https://arxiv.org/html/2610.19833v3/Main_SiOx.png", "briefing": {"background": "저차원 자성체에서의 열 수송 제어는 스핀 칼로리트로닉스의 핵심입니다. 하지만 나노미터 규모의 얇은 층에서 발생하는 미세한 열 변화를 감지하는 것은 매우 어렵습니다.", "motivation": "반데르발스 자성체인 CrPS4의 자기적 상전이(스핀-플립/플롭)에 따른 열 전도도 변화를 민감하게 측정할 수 있는 새로운 검출 플랫폼을 마련하고자 합니다.", "result": "TaIrTe4가 가지는 큰 횡방향 제벡 효과를 이용하여 CrPS4의 자기장 의존적 열 전도도 변화를 성공적으로 관측했습니다. 특히 저온에서 8% 이상의 신호 변조를 확인했습니다.", "implication": "TaIrTe4를 이용한 횡방향 제벡 온도계가 저차원 자성체의 열적 특성을 정밀하게 분석하는 강력한 실험 도구로 활용될 수 있음을 증명했습니다.", "novelty": "반데르발스 적층 구조를 사용하여 외부 간섭을 최소화하면서도, 기존 전기적 측정으로는 포착하기 어려웠던 magnon-phonon 결합 기반의 열 전도도 변화를 포착했습니다.", "unresolved": "CrPS4 내부의 정확한 magnon-phonon 결합 모드의 분리 및 정량적 해석은 향후 심화 연구가 필요합니다.", "future_work": "다양한 반데르발스 자성체에 이 온도계 플랫폼을 적용하여 열 수송 특성을 체계적으로 스캔할 것으로 보입니다.", "concepts": [{"term": "횡방향 제벡 효과", "why_emerged": "온도 구배와 수직한 방향으로 발생하는 전압을 측정하여 열전 특성을 파악하기 위해 사용됨.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "스핀 제벡 효과, 비등방성 열전도."}, {"term": "Magnon-phonon 결합", "why_emerged": "자기적 정렬과 격자 진동 사이의 에너지 전달 메커니즘을 이해하기 위해 연구됨.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "열 전도도, 스핀 칼로리트로닉스."}, {"term": "TaIrTe4", "why_emerged": "큰 횡방향 열전 응답을 보이는 전이금속 칼코겐 화합물로서 정밀 탐침으로 적합함.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "반데르발스 재료, 토폴로지 Weyl 반금속."}], "english_summary": ["Demonstrates transverse Seebeck thermometry using TaIrTe4 to measure heat transport in CrPS4.", "The sensor enables precise detection of thermal conductivity changes linked to magnetic spin-flip/spin-flop transitions.", "Observed over 8% modulation in the thermal response at 5 K, highlighting strong magnon-phonon coupling.", "Provides a sensitive, adaptable platform for studying heat transport in van der Waals magnets."]}}, {"title": "Perfumer: A Large Language Model-based Agentic Framework Accelerating Structural Relaxation and Electronic Band Prediction for First-Principle Calculation", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2611.26349", "authors": "Zhiwei Li, Yuhao Zhou, Yikai Yang, et al.", "last_authors": "Jiancheng Lv, Kazunari Matsuda", "summary": "First-principles structural relaxation and band calculations require substantial computation and expertise. Here we present Perfumer, a large language model-based agentic framework that couples Quantum ESPRESSO with two predictive models. Across tested structures, pre-relaxation with Perfumer-relax model followed by QE refinement yielded a 2.75-fold overall speedup over QE alone. Perfumer-band model combines a periodic graph neural network with a latent Hermitian spectral head returns 12 band energies at any requested wavevector, preserving reciprocal lattice periodicity and time-reversal symmetry without constructing Hamiltonian. Trained on 125,153 self-curated band structures, Perfumer-band model reaches a median per-material mean absolute error of 0.157 eV on 2,607 test materials, including lanthanide, actinide and magnetic compounds, from held-out composition families spanning 85 elements, taking about 97 ms per material on two consumer CPU cores. The agent turns natural-language requests into relaxation-to-band workflows, from a single uploaded structure to automatically constructed new candidates and returns predicted properties.", "tier": "B_IMPORTANT_CONDMAT", "score": "7", "reason": "AI/ML framework for accelerating DFT electronic structure and band prediction, highly relevant to user.", "tags": ["methodology", "DFT", "electronicstructure", "AI/ML"], "image": "https://arxiv.org/static/browse/0.3.4/images/arxiv-logo-fb.png", "briefing": {"background": "제일원리 계산(DFT)은 재료 과학의 필수 도구이나, 구조 완화와 밴드 구조 계산은 계산 비용이 매우 높고 전문가의 경험이 많이 요구됩니다.", "motivation": "대규모 언어 모델(LLM)과 에이전트 프레임워크를 결합하여 DFT 계산의 효율성을 높이고, 자동화된 재료 탐색 및 물성 예측을 수행하고자 합니다.", "result": "Perfumer 모델은 기존 QE(Quantum ESPRESSO) 대비 구조 완화 속도를 약 2.75배 향상시켰습니다. 밴드 예측 모델은 수 밀리초 내에 정확한 에너지 대역을 예측합니다.", "implication": "고가의 계산 자원 없이도 복잡한 자기성 재료나 악티나이드 화합물의 밴드 구조를 신속하게 스크리닝할 수 있는 기반이 마련되었습니다.", "novelty": "자연어 기반으로 복잡한 시뮬레이션 워크플로우를 자동화하고, 12만 개 이상의 데이터를 학습하여 자성 재료를 포함한 광범위한 원소 패밀리에 대해 높은 정확도를 달성했습니다.", "unresolved": "데이터가 부족한 희귀 재료 시스템이나 고도의 강상관 효과가 중요한 영역에서의 정확도 검증이 여전히 숙제입니다.", "future_work": "새로운 재료 후보군에 대한 자동 생성 및 실험 데이터와의 실시간 피드백을 통한 고도화가 예상됩니다.", "concepts": [{"term": "구조 완화 (Structural Relaxation)", "why_emerged": "DFT 계산 전 시스템의 총 에너지를 최소화하는 원자 위치를 찾기 위해 필수적임.", "origin": "DFT 초기 개발 시점부터 정립됨.", "connections": "에너지 최적화, 퍼텐셜 에너지 표면."}, {"term": "에이전트 프레임워크 (Agentic Framework)", "why_emerged": "단순 예측을 넘어 목적 달성을 위해 도구(QE 등)를 능동적으로 활용하기 위해 도입됨.", "origin": "최근 LLM 연구에서 파생됨.", "connections": "자동화 과학, 인공지능 강화 학습."}, {"term": "주기적 그래프 신경망 (Periodic GNN)", "why_emerged": "결정 구조의 주기성을 모델링 내에 효과적으로 반영하기 위해 고안됨.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "재료 정보학, 머신러닝 기반 물성 예측."}], "english_summary": ["Introduces Perfumer, an LLM-based agentic framework for accelerating DFT calculations.", "Achieves 2.75x speedup in structural relaxation and fast band structure prediction.", "Maintains high accuracy (0.157 eV MAE) for complex materials including magnetic compounds.", "Enables automated workflows from natural language requests to band property prediction."]}}, {"title": "Thermally driven multiple sliding states and avalanche dynamics in rhombohedral Pb(TaSe2)2 nanoflakes (Materials Today)", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2611.25739", "authors": "Zhuokai Xu, Xiaohui Yang, Zhefeng Lou, et al.", "last_authors": "Ruiya Zhan, Xiao Lin", "summary": "Interlayer sliding in van der Waals materials offers a promising route to control functional properties, yet a comprehensive understanding of the complex collective domain dynamics governing these transitions remains challenging. Here, we investigate thermally driven sliding dynamics in Pb(TaSe2)2 nanoflakes, incorporating transport and atomic-resolution scanning transmission electron microscopy (STEM) measurements. Reducing the flake thickness induces multiple stepwise resistance jumps with enhanced hysteresis, corresponding to transitions between stacking domains accompanied by ripplocations. Statistical analysis of the jumps reveals collective avalanche behavior of domain dynamics with universal power-law scaling, quantifying the domain motion. Harnessing these features, we demonstrate controllable, non-volatile multi-level resistive switching, including write/erase operations, via thermal cycling. These findings provide valuable insights into the sliding dynamics for various 2D materials, with significant implications for the development of slidetronics devices.", "tier": "B_IMPORTANT_CONDMAT", "score": "7", "reason": "Experimental study of sliding dynamics and resistive switching in van der Waals nanoflakes.", "tags": ["vanderWaals", "transport", "experiment", "2Dmaterials"], "image": "https://arxiv.org/html/2611.25739v1/Fig1.png", "briefing": {"background": "반데르발스 물질의 층간 슬라이딩(interlayer sliding)은 원자 층이 미끄러지며 물성이 변화하는 현상으로, 차세대 소자 구현을 위한 핵심 메커니즘으로 주목받고 있습니다.", "motivation": "Pb(TaSe2)2 나노플레이크에서 슬라이딩 도메인이 집합적으로 어떻게 움직이는지, 그리고 이것이 거시적인 저항 변화에 어떤 영향을 미치는지 밝히고자 합니다.", "result": "STEM과 수송 측정을 통해 층 두께 감소가 저항 점프를 유도하며, 이 과정이 도메인 슬라이딩과 '리플로케이션(ripplocations)'에 의한 집합적 눈사태(avalanche) 거동을 보임을 확인했습니다.", "implication": "슬라이딩 도메인의 통계적 거동을 이해함으로써, 비휘발성 저항 변화 소자(슬라이드트로닉스)의 설계 가능성을 제시합니다.", "novelty": "원자 분해능 STEM 관찰과 통계적 수송 분석을 결합하여, 층간 슬라이딩 현상을 거시적 제어가 가능한 물리적 상태로 연결한 점이 중요합니다.", "unresolved": "이러한 저항 점프의 가역성을 장기적인 반복 운용 시에도 얼마나 안정적으로 유지할 수 있는지는 명확하지 않습니다.", "future_work": "다른 층상 구조 물질들로의 확장 및 실제 작동 소자 수준에서의 내구성 테스트가 필요합니다.", "concepts": [{"term": "Ripplocation", "why_emerged": "2D 물질에서 층간 슬라이딩 시 발생하는 국소적인 변형 결함을 설명하기 위해 도입되었습니다.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "반데르발스 에피택시, 층간 결함 동역학"}, {"term": "Avalanche dynamics", "why_emerged": "계가 임계 상태 근처에서 작은 섭동에 대해 대규모 반응을 보이는 현상을 수학적으로 기술하기 위함입니다.", "origin": "Bak, Tang, Wiesenfeld (1987)의 자기조직화 임계성(SOC) 연구에 기원", "connections": "자성 재료의 바크하우젠 효과, 유리질 동역학"}], "english_summary": ["Pb(TaSe2)2 nanoflakes exhibit discrete resistance jumps driven by thermally induced interlayer sliding.", "STEM imaging confirms that these jumps correspond to collective domain dynamics termed ripplocations.", "The observed avalanche behavior follows power-law scaling, offering a path for non-volatile resistive switching.", "This study establishes a fundamental link between domain physics and practical slidetronic device applications."]}}, {"title": "Topological (in)equivalence encoded in zeros of wavefunction overlaps", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2611.25037", "authors": "Carolina Paiva, Bruno Mera, Roni Ilan, Raquel Queiroz", "last_authors": "Roni Ilan, Raquel Queiroz", "summary": "Topological equivalence between two gapped band structures is determined by whether their occupied states can be continuously deformed into one another without closing the energy gap or breaking the protecting symmetries. We show that this relative topology can be read directly from the overlap matrix between the two occupied subspaces, in a way that treats Chern and $\\mathbb{Z}_2$ invariants within a single framework. The determinant of the overlap matrix defines a global section of a line bundle over the Brillouin zone, which vanishes at the momenta where the map between the subspaces fails to be invertible. A singular connection, whose curvature is concentrated at these zeros, assigns each zero an integer charge given by its phase winding. In two-dimensional class A, the total charge equals the difference between the Chern numbers of the two systems. In class AII, time reversal pairs zeros of opposite charge, and the relative $\\mathbb{Z}_2$ invariant is the parity of the total charge in half the Brillouin zone; the Kane-Mele Pfaffian is recovered as a special case. The zeros coincide with the gap closings of an interpolation between the two systems, and crystalline symmetries constrain their positions and charges. We illustrate the construction in the Haldane, Kane-Mele, and Qi-Wu-Zhang models, including cases where rotation symmetry alone enforces the zeros.", "tier": "B_IMPORTANT_CONDMAT", "score": "7", "reason": "Theoretical framework for topological equivalence using wave-function overlaps, relevant to Chern and Z2 invariants.", "tags": ["theory", "topology", "Chernnumber", "Z2invariant", "bandstructure"], "image": "https://arxiv.org/html/2611.25037v1/Haldane_overlap_RQ_row.png", "briefing": {"background": "위상 절연체 및 위상 물질 연구에서 두 밴드 구조가 위상적으로 동일한지 판단하는 문제는 물질의 범주화에 있어 매우 중요합니다.", "motivation": "기존의 복잡한 위상 불변량 계산 대신, 파동함수 오버랩 행렬의 성질을 통해 두 시스템의 위상적 차이를 직접적으로 읽어내고자 합니다.", "result": "오버랩 행렬의 결정값이 Brillouin 영역에서 가지는 영점(zeros)의 위상적 전하(winding number)가 Chern 및 Z2 불변량의 차이를 결정함을 증명했습니다.", "implication": "위상적 상전이 분석 시 전체 대역 구조를 계산하지 않고도 오버랩 정보만으로 위상적 차이를 판별할 수 있는 강력한 도구를 제공합니다.", "novelty": "Chern 절연체와 Z2 위상 절연체를 하나의 수학적 프레임워크로 통합하여 처리했으며, 특히 Kane-Mele Pfaffian을 기하학적 영점으로 재해석했습니다.", "unresolved": "다체 상호작용이 강한 시스템에서의 오버랩 정의와 그 영점의 안정성에 대한 엄밀한 분석이 필요합니다.", "future_work": "강상관 전자계나 복잡한 결정 대칭성을 갖는 실제 물질에 이 이론을 적용하여 위상 특성을 빠르게 계산하는 연구가 기대됩니다.", "concepts": [{"term": "Overlap matrix", "why_emerged": "두 힐베르트 공간 사이의 상태 사영을 정량화하고 위상적 거리를 측정하기 위해 필요합니다.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "Berry curvature, Quantum geometric tensor"}, {"term": "Kane-Mele Pfaffian", "why_emerged": "시간 반전 대칭성이 보호하는 Z2 위상 절연체를 구별하기 위해 도입된 수학적 도구입니다.", "origin": "Kane and Mele (2005)", "connections": "Spin Hall effect, Z2 topological insulators"}], "english_summary": ["A new framework defines topological equivalence between gapped band structures via zeros of the wavefunction overlap matrix.", "The topological charge of these zeros corresponds directly to differences in Chern and Z2 invariants.", "This method unifies diverse topological classification schemes within a single geometric approach.", "The theory successfully recovers established invariants and handles constraints imposed by crystalline symmetries."]}}, {"title": "Topological Bound States in the Continuum", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2611.25493", "authors": "Dan-Na Liu, J. Villavicencio, Pierre A. Pantaleon", "last_authors": "J. Villavicencio, Pierre A. Pantaleon", "summary": "We uncover topological bound states in the continuum in AB-stacked bilayer graphene mass-wall junctions. Valley topology supports interface states propagating along the wall, while a distinct winding of the confinement conditions governs exact decoupling from conducting leads. Tuning the junction length or interlayer bias can merge oppositely charged bound states and remove confinement without changing the valley topology. At generic critical points, the state remains bound and nearby resonance widths open quartically with momentum. These results connect complementary roles of topology in interface propagation and confinement within a conducting continuum.", "tier": "B_IMPORTANT_CONDMAT", "score": "7", "reason": "Theoretical study of topological bound states and valley topology in bilayer graphene.", "tags": ["theory", "graphene", "topological", "bilayer"], "image": "https://arxiv.org/html/2611.25493v1/Figure1.png", "briefing": {"background": "연속체 내 경계 상태(BIC)는 전파가 가능한 연속 상태들 사이에 존재하는 국소화된 모드이며, 위상적 보호를 통해 강한 confinement를 유도할 수 있습니다.", "motivation": "AB-적층 이중층 그래핀의 mass-wall 경계에서 계곡(valley) 위상성 기반의 경계 상태가 어떻게 구속되는지 연구하고자 합니다.", "result": "이중층 그래핀 경계에서 계곡 위상에 의해 전도 리드로부터 분리된 위상적 BIC가 존재하며, 게이트 전압이나 접합부 길이로 이를 제어할 수 있음을 보였습니다.", "implication": "위상적 BIC를 이용하면 외부 전도성 채널과의 간섭 없이도 정보를 보존하거나 제어할 수 있는 소자 원리로 활용 가능합니다.", "novelty": "이중층 그래핀의 valley topology와 BIC 현상을 연결하여, 인터페이스 전파와 구속이라는 두 가지 물리적 역할을 동시에 제어하는 이론적 모델을 구축했습니다.", "unresolved": "현실적인 그래핀 소자 제작 공정에서 발생하는 무질서(disorder)가 이러한 위상적 BIC의 안정성에 미치는 영향은 아직 평가되지 않았습니다.", "future_work": "이러한 위상적 경계 상태를 활용한 비전도성 정보 전달이나 새로운 형태의 계곡 기반 회로 소자 연구가 뒤따라야 합니다.", "concepts": [{"term": "Bound States in the Continuum (BIC)", "why_emerged": "산란 상태와 에너지가 겹침에도 불구하고 붕괴하지 않고 국소화된 상태를 설명하기 위해 필요합니다.", "origin": "Von Neumann and Wigner (1929)", "connections": "Fano resonance, Photonic crystals, Topological waveguides"}, {"term": "Valley topology", "why_emerged": "그래핀의 K, K' 계곡 자유도를 위상적 정보 전달 매체로 활용하기 위해 도입되었습니다.", "origin": "Xiao, Yao, Niu (2007)의 Berry phase 연구에 기원", "connections": "Valleytronics, Topological insulator"}], "english_summary": ["Theoretical discovery of topological bound states in the continuum (BIC) at bilayer graphene mass-wall junctions.", "Valley topology provides robust confinement that decouples these states from the conducting continuum.", "The existence and stability of these BIC are tunable via gate bias and junction length modulation.", "This study bridges the gap between interface propagation physics and localized topological confinement."]}}, {"title": "Two distinct notions of speed in antiferromagnets", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2611.26482", "authors": "Paul Herrgen, Stephan Wust, Christin Schmitt, et al.", "last_authors": "Benjamin Stadtm\\\"uller, Martin Aeschlimann", "summary": "The terahertz resonance frequencies of antiferromagnets characterize their precessional dynamics but do not necessarily imply faster laser-induced quenching of magnetic order. Here, we investigate the distinct roles of magnetic compensation and electronic scattering phase space by comparing ultrafast demagnetization in the antiferromagnetic charge-transfer insulator NiO, the metallic antiferromagnet Mn2Au, and a ferromagnetic Ni reference. The extracted response in Mn2Au is approximately four times faster than in NiO and substantially faster than in Ni. These observations are consistent with exchange-mediated scattering between antiparallel sublattices enabling rapid loss of antiferromagnetic order without requiring net angular-momentum transfer to an external reservoir, provided sufficient electronic scattering phase space is available. In insulating NiO, restricted electronic scattering channels reduces the ultrafast response. Our results distinguish ultrafast demagnetization from exchange-enhanced precession and identify the interplay of spin-flip probability and electronic scattering rate as a key factor governing the nonequilibrium response of compensated magnets.", "tier": "B_IMPORTANT_CONDMAT", "score": "7", "reason": "Experimental study of ultrafast demagnetization in antiferromagnets, relevant to magnetic materials.", "tags": ["experimental", "antiferromagnetism", "ultrafastdynamics"], "image": "https://arxiv.org/static/browse/0.3.4/images/arxiv-logo-fb.png", "briefing": {"background": "반강자성체(Antiferromagnets)는 순 자화값이 0이라 외부 자기장에 둔감하지만, THz 대역의 빠른 스핀 역학을 보여 차세대 스핀트로닉스 소자로 주목받습니다. 이들의 초고속 자기 소거(ultrafast demagnetization) 기작을 이해하는 것은 데이터 저장 및 정보 처리에 핵심적인 난제입니다.", "motivation": "반강자성체의 THz 공명 주파수가 빠르다고 해서 레이저에 의한 자기 질서 소거(quenching) 속도까지 빠르다는 것을 의미하지는 않습니다. 본 연구는 왜 어떤 물질에서는 자기 소거가 더 빠르게 일어나는지, 전자 산란 위상 공간(phase space)과 자기 보상(compensation)의 역할을 규명하고자 합니다.", "result": "금속성 반강자성체인 Mn2Au가 절연체인 NiO나 강자성체 Ni보다 훨씬 빠른 초고속 자기 소거를 보임을 확인했습니다. 이는 외부로의 각운동량 전달 없이도 반평행 부격자(sublattice) 간의 교환 상호작용 매개 산란이 효율적으로 일어날 수 있음을 시사합니다.", "implication": "반강자성 소자의 속도론적 한계는 단순히 THz 공명 주파수가 아니라, 전자 산란 채널의 가용성에 달려 있음을 증명했습니다. 이는 고속 자기 스위칭 소자 설계의 새로운 가이드라인이 될 수 있습니다.", "novelty": "자기 보상 정도와 전자 산란 효율 사이의 정량적 관계를 실험적으로 분리해냈습니다. 특히 NiO와 Mn2Au의 비교를 통해 절연체와 도체에서의 스핀 동역학 차이를 명확히 했습니다.", "unresolved": "전자 산란 과정에서 구체적인 스핀-플립 확률의 미시적 매커니즘은 실험 데이터로만은 완벽히 설명되지 않았습니다.", "future_work": "다른 금속성 반강자성체에서의 산란 위상 공간 조절을 통한 스위칭 속도 극대화 연구 및 광 여기(photo-excitation)에 따른 스핀 궤도 토크(SOT)와의 상관관계 규명.", "concepts": [{"term": "반강자성 초고속 자기 소거", "why_emerged": "기존 강자성체 대비 외부 자기장에 강하고 속도가 빨라 차세대 초고속 메모리 후보로 필요함.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "스핀트로닉스, THz 분광학, 비평형 통계역학."}, {"term": "전자 산란 위상 공간 (Phase space)", "why_emerged": "비평형 상태에서 에너지가 어떻게 분포되고 스핀이 재배열되는지 산란 확률을 계산하기 위해 필요함.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "페르미 액체 이론, 볼츠만 수송 방정식."}], "english_summary": ["Investigated ultrafast demagnetization in Mn2Au, NiO, and Ni.", "Found Mn2Au shows significantly faster quenching than NiO and Ni.", "Proposed that electronic scattering phase space is critical for antiferromagnetic quenching.", "Identified that exchange-mediated scattering enables rapid disorder without angular-momentum transfer."]}}, {"title": "Unusual critical currents in quasi-one-dimensional superconducting aluminum two-width structures in a magnetic field (V.I. Kuznetsov, O.V. Trofimov, Physica B)", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2604.27881", "authors": "V. I. Kuznetsov, O. V. Trofimov", "last_authors": "V. I. Kuznetsov, O. V. Trofimov", "summary": "We measured critical switching and retrapping currents as functions of temperature in the zero field and as functions of a magnetic field perpendicular to the substrate surface at a temperature close to the critical temperature in thin-film long quasi-one-dimensional superconducting aluminum two-width structures consisting of narrow and wide wires with different critical temperatures. It is found that the switching current as a function of the field is nonlocal (dependent on electron transport in the area containing the junction line between the narrow and wide wires). The unusual behavior of the switching current lies in the fact that it is poorly described by the classical Ginzburg-Landau theory. In low and intermediate fields, the switching current is determined mainly by the densities of critical currents in the narrow and wide wires, respectively, near the wire junction line. In high fields, the switching current is due to equilibrium fluctuations of the order parameter.", "tier": "B_IMPORTANT_CONDMAT", "score": "7", "reason": "Experimental study of unusual critical currents in quasi-1D superconducting aluminum structures in a magnetic field.", "tags": ["quasi-1D", "superconductivity", "transport", "experimental"], "image": "https://arxiv.org/html/2604.27881v2/tovfigure1.png", "briefing": {"background": "준일차원(Quasi-1D) 초전도체는 1D적 구속으로 인해 위상 변동이 심하며, 이는 고전적인 긴즈버그-란다우(GL) 이론을 넘어선 특이한 수송 현상을 유발합니다. 초전도 박막 소자에서의 임계 전류 측정은 이러한 비평형 초전도성을 연구하는 표준적인 방법입니다.", "motivation": "서로 다른 폭을 가진 알루미늄 나노 구조물에서 자기장이 가해졌을 때 나타나는 스위칭(switching) 및 재포획(retrapping) 전류의 비정상적인 거동을 실험적으로 분석하고자 했습니다.", "result": "나노 구조의 접합 부위에서 발생하는 임계 전류가 비국소적(nonlocal) 특성을 보임을 발견했습니다. 특히 GL 이론으로 설명되지 않는 고자기장 영역에서의 거동이 질서 파라미터의 열적 변동에 의해 지배됨을 규명했습니다.", "implication": "초전도 나노 회로 설계 시, 폭이 변하는 접합부에서 발생할 수 있는 비국소적 스위칭 현상을 고려해야 하며, 이는 소자의 임계 특성 제어에 중요합니다.", "novelty": "서로 다른 폭을 가진 초전도 구조물의 접합부에서 나타나는 비국소성 및 고자기장 하에서의 열적 요동 효과를 실험적으로 분리하여 제시했습니다.", "unresolved": "왜 고자기장에서의 요동이 특정 구조에서 GL 이론에서 완전히 벗어나는지, 미시적인 초전도 위상 결함과의 구체적인 연관성은 완벽히 밝혀지지 않았습니다.", "future_work": "구조체의 기하학적 형상을 정밀하게 조절하여 위상 변동이 수송에 미치는 영향을 제어하는 실험 연구가 필요합니다.", "concepts": [{"term": "준일차원 초전도체", "why_emerged": "차원 축소에 따른 초전도 양자 위상 요동과 비전형적인 초전도 상전이 연구를 위해 필요함.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "Luttinger liquid, BKT 전이, 초전도 와이어 연구."}, {"term": "긴즈버그-란다우 이론 (GL Theory)", "why_emerged": "초전도체의 상전이와 질서 파라미터의 거동을 거시적으로 기술하기 위해 필요함.", "origin": "Vitaly Ginzburg and Lev Landau (1950)", "connections": "BCS 이론, 런던 방정식."}], "english_summary": ["Studied critical currents in quasi-1D aluminum structures with varying widths.", "Observed non-local behavior of switching currents dependent on wire junctions.", "Found deviations from classical Ginzburg-Landau theory in high magnetic fields.", "Attributed high-field behavior to equilibrium fluctuations of the order parameter."]}}, {"title": "Electron-phonon coupling and electronic transport at the moiré scale in twisted bilayer graphene", "journal": "npj_QuantumMaterials", "source": "Gemini", "link": "https://www.nature.com/articles/s41535-026-00952-x", "authors": "David J. Abramovitch, Marco Bernardi", "last_authors": "David J. Abramovitch, Marco Bernardi", "summary": "Electron-phonon coupling and electronic transport at the moiré scale in twisted bilayer graphene", "tier": "B_IMPORTANT_CONDMAT", "score": "7", "reason": "Investigation of moiré physics and electron-phonon coupling in twisted bilayer graphene.", "tags": ["transport", "graphene", "moiré"], "image": "https://pubads.g.doubleclick.net/gampad/ad?iu=/285/npjquantmats.nature.com/article&sz=728x90&c=375053558&t=pos%3Dtop%26type%3Darticle%26artid%3Ds41535-026-00952-x%26doi%3D10.1038/s41535-026-00952-x%26subjmeta%3D301,639,766,925%26kwrd%3DMaterials+science,Nanoscience+and+technology,Physics", "briefing": {"background": "뒤틀린 이중층 그래핀(TBG)은 모아레 무늬를 통해 전자 밴드 구조를 엔지니어링할 수 있는 플랫폼입니다. 모아레 척도에서의 전자-포논 결합은 초전도성, 상관 절연체 상태 등 강한 상관관계를 이해하는 데 핵심입니다.", "motivation": "TBG 시스템의 전자-포논 결합이 수송 특성에 어떤 영향을 미치는지, 특히 모아레 단위세포 수준에서 이를 시각화하고 해석하고자 합니다.", "result": "제목과 초록 정보가 동일하여 구체적인 수치는 확인하기 어려우나, 모아레 척도에서 전자-포논 상호작용이 전자 수송 특성을 결정짓는 "last_authors": "K. T. Law, Xiao Yan Xu", "summary": "We study an interacting spinless Lieb-Kitaev chain model in the nearly flat-band regime, motivated by the recent observation that Majorana zero modes in the noninteracting Lieb-Kitaev system inherit two decay modes: an ordinary Bogoliubov-de Gennes (BdG) length and a longer geometric length controlled by the quantum metric. By tuning both the interaction strength and quantum metric, we identify a topological superconducting (TSC) phase, an incommensurate charge-density-wave (ICDW)phase, and a commensurate charge-density-wave (CDW) phase. Inside the TSC phase, the QML is enhanced when increasing the interactions. In the ICDW phase, the interactions are modulated by quantum metric to generate an effective chemical potential, leading to a discontinuous incommensurate-to-commensurate (IC-C) transition. We verify these phases and conclusions using low energy effective theory and density-matrix renormalization group (DMRG) calculations.", "tier": "C_MAYBE", "score": "8", "reason": "Theoretical model exploring CDW, topological superconductivity, Majorana modes, and quantum metric.; tier capped to C: formal/generic theory watch", "tags": ["theoretical", "CDW", "topologicalsuperconductivity", "Majorana", "quantummetric"], "image": "https://arxiv.org/html/2611.26327v1/Fig1_Fig2_combined.png", "briefing": {"background": "Lieb-Kitaev 격자는 토폴로지적 초전도체와 위상 절연체를 모델링하는 데 사용되는 중요한 플랫폼이며, 평탄 밴드(flat-band)에서의 상관관계 연구는 물리학의 핵심 과제 중 하나입니다.", "motivation": "상호작용이 있는 Lieb-Kitaev 체인에서 양자 메트릭(quantum metric)이 토폴로지적 초전도성과 전하 밀도 파(CDW) 위상에 미치는 영향을 규명하고자 합니다.", "result": "양자 메트릭이 Majorana 모드의 공간적 분포와 상호작용을 제어하며, 이를 통해 토폴로지적 초전도체와 CDW 위상 사이의 전이를 유도함을 보였습니다.", "implication": "위상물질의 설계를 위해서는 밴드 구조뿐만 아니라 기하학적 정보인 양자 메트릭을 제어해야 함을 시사하며, 이는 Floquet 공학이나 무아레 시스템 설계에도 응용 가능합니다.", "novelty": "일반적인 에너지 밴드론을 넘어 '양자 메트릭'을 직접 제어 변수로 활용하여 토폴로지적 성질과 정렬 상태를 연결한 이론적 프레임워크를 제공합니다.", "unresolved": "모델 시스템에서의 예측이 실제 실험 가능한 강상관 전자계 물질에서 정량적으로 어떻게 구현될지에 대한 실험적 가이드는   headText.appendChild(title);
  headText.appendChild(textEl('p', 'meta', [r.journal, r.source].filter(Boolean).join(' | ')));
  if (r.last_authors || r.authors) { const authors = document.createElement('p'); authors.className = 'authors'; if (r.last_authors) authors.append('Last authors: ' + r.last_authors); if (r.authors) authors.append((r.last_authors ? ' | ' : '') + 'Authors: ' + r.authors); headText.appendChild(authors); }
  appendLabeledText(headText, 'why', 'Filter reason: ', r.reason);
  if (r.tags && r.tags.length) { const tags = document.createElement('div'); tags.className = 'tags'; r.tags.forEach(tag => tags.appendChild(textEl('span', 'tag', '#' + tag))); headText.appendChild(tags); }
  if (r.link) { const link = document.createElement('a'); link.className = 'link'; link.href = r.link; link.target = '_blank'; link.rel = 'noopener noreferrer'; link.textContent = 'Open paper'; headText.appendChild(link); }
  head.appendChild(headText);
  if (r.summary) { const abstract = document.createElement('p'); abstract.className = 'original-abstract'; const strong = textEl('strong', '', 'Original abstract'); abstract.appendChild(strong); abstract.append(r.summary); head.appendChild(abstract); }
  slideEl.appendChild(head);
  const briefing = document.createElement('div');
  briefing.className = 'briefing';
  appendBriefSection(briefing, 'Background', b.background);
  appendBriefSection(briefing, 'Motivation', b.motivation);
  appendBriefSection(briefing, 'Result', b.result);
  appendBriefSection(briefing, 'Implication', b.implication);
  appendBriefSection(briefing, "Why it's important / Novelty", b.novelty);
  appendBriefSection(briefing, 'Unresolved Questions', b.unresolved);
  appendBriefSection(briefing, 'Expected Future Work', b.future_work);
  if (b.concepts && b.concepts.length) {
    const section = document.createElement('section');
    section.className = 'brief-section wide';
    section.appendChild(textEl('h2', '', 'Concepts / Terms'));
    const concepts = document.createElement('div');
    concepts.className = 'concepts';
    b.concepts.forEach(c => {
      const item = document.createElement('div');
      item.className = 'concept';
      item.appendChild(textEl('h3', '', c.term || 'Concept'));
      [['왜 생겼나: ', c.why_emerged], ['누가 만들었나: ', c.origin], ['연결되는 흐름: ', c.connections]].forEach(([label, text]) => { if (!text) return; const p = document.createElement('p'); const bold = textEl('b', '', label); p.appendChild(bold); p.append(text); item.appendChild(p); });
      concepts.appendChild(item);
    });
    section.appendChild(concepts);
    briefing.appendChild(section);
  }
  if (b.english_summary && b.english_summary.length) { const section = document.createElement('section'); section.className = 'brief-section wide'; section.appendChild(textEl('h2', '', 'English Summary')); const ul = document.createElement('ul'); b.english_summary.slice(0, 5).forEach(line => ul.appendChild(textEl('li', '', line))); section.appendChild(ul); briefing.appendChild(section); }
  slideEl.appendChild(briefing);
  counterEl.textContent = `${index + 1} / ${slides.length}`;
  prevBtn.disabled = index === 0;
  nextBtn.disabled = index === slides.length - 1;
}
prevBtn.addEventListener('click', () => { index = Math.max(0, index - 1); render(); });
nextBtn.addEventListener('click', () => { index = Math.min(slides.length - 1, index + 1); render(); });
document.addEventListener('keydown', event => { if (event.key === 'ArrowLeft') prevBtn.click(); if (event.key === 'ArrowRight') nextBtn.click(); });
render();
</script>
</body>
</html>
