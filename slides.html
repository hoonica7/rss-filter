<title>Daily Paper Slideshow</title>
<style>
  :root {
    color-scheme: light;
    --bg: #f6f7f4;
    --paper: #ffffff;
    --ink: #111827;
    --muted: #64748b;
    --line: #d8ddd2;
    --accent: #176b87;
    --accent-2: #9a3412;
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; overflow: auto; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: var(--bg); color: var(--ink); }
  .shell { max-width: 1500px; min-height: 100vh; margin: 0 auto; padding: 14px 18px; display: flex; flex-direction: column; }
  .topbar { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 16px; }
  .top-actions { display: flex; align-items: center; gap: 10px; }
  .topbar a, button { border: 1px solid var(--line); border-radius: 8px; background: var(--paper); color: var(--ink); padding: 10px 14px; font-weight: 700; text-decoration: none; cursor: pointer; }
  button.primary { background: var(--accent); border-color: var(--accent); color: white; }
  button:disabled { opacity: 0.45; cursor: not-allowed; }
  .counter { color: var(--muted); font-weight: 700; }
  .slide { min-height: calc(100vh - 82px); background: var(--paper); border: 1px solid var(--line); border-radius: 10px; padding: 18px; box-shadow: 0 18px 42px rgba(15, 23, 42, 0.10); display: grid; grid-template-columns: minmax(310px, 0.86fr) minmax(0, 1.55fr); gap: 18px; overflow: visible; }
  .paper-head { min-width: 0; min-height: 0; overflow: visible; display: flex; flex-direction: column; gap: 12px; }
  .figure { margin: 0; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: #f8fafc; }
  .figure img { display: block; width: 100%; max-height: 41vh; object-fit: contain; background: white; }
  .figure figcaption { padding: 7px 10px; color: var(--muted); font-size: 12px; line-height: 1.3; }
  .head-text { display: flex; flex-direction: column; gap: 9px; min-width: 0; }
  .badges { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .badge { border-radius: 999px; padding: 5px 9px; background: #eef2ff; color: #3730a3; font-size: 12px; font-weight: 800; }
  .score { background: #fee2e2; color: #991b1b; }
  h1 { margin: 0; font-size: 25px; line-height: 1.15; letter-spacing: 0; overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
  h1 a { color: inherit; text-decoration-color: rgba(23, 107, 135, 0.35); text-decoration-thickness: 2px; text-underline-offset: 4px; }
  h1 a:hover { color: var(--accent); text-decoration-color: var(--accent); }
  .meta, .authors, .why, .abstract { font-size: 13px; line-height: 1.45; }
  .meta, .authors { color: var(--muted); }
  .why strong, .abstract strong, .authors strong { color: var(--ink); }
  .authors { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .why { border-left: 4px solid var(--accent-2); padding-left: 10px; color: #374151; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .abstract { border-top: 1px solid var(--line); padding-top: 14px; color: #374151; }
  .original-abstract { border-top: 1px solid var(--line); padding-top: 10px; color: #374151; font-size: 11.5px; line-height: 1.35; overflow-wrap: anywhere; }
  .original-abstract strong { display: block; margin-bottom: 4px; color: var(--ink); }
  .tags { display: flex; flex-wrap: wrap; gap: 8px; }
  .tag { border-radius: 999px; padding: 4px 8px; background: #f1f5f9; color: #475569; font-size: 12px; font-weight: 700; }
  .head-text > .link { display: none; }
  .briefing { min-width: 0; min-height: 0; overflow: visible; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); grid-auto-rows: minmax(0, auto); align-content: start; gap: 11px 18px; border-top: 0; padding-top: 0; }
  .brief-section { min-width: 0; }
  .brief-section.wide { grid-column: 1 / -1; }
  .brief-section h2 { margin: 0 0 4px; font-size: 14px; line-height: 1.22; color: #0f766e; letter-spacing: 0; }
  .brief-section p, .brief-section li { margin: 0; font-size: 12.5px; line-height: 1.42; color: #1f2937; overflow-wrap: anywhere; }
  .brief-section ul { margin: 0; padding-left: 20px; }
  .concepts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 9px 14px; }
  .concept { border-top: 1px solid var(--line); padding-top: 7px; }
  .concept h3 { margin: 0 0 4px; font-size: 13px; color: #7c2d12; letter-spacing: 0; }
  .concept p { margin: 2px 0 0; font-size: 11.5px; line-height: 1.35; color: #374151; overflow-wrap: anywhere; }
  .concept b { color: #111827; }
  .link { color: var(--accent); font-weight: 800; text-decoration: none; }
  .empty { padding: 48px; background: var(--paper); border: 1px solid var(--line); border-radius: 12px; color: var(--muted); }
  @media (max-width: 860px) {
    .shell { padding: 14px; }
    .topbar, .top-actions { align-items: stretch; flex-direction: column; }
    .slide, .briefing, .concepts { grid-template-columns: 1fr; }
    .slide { min-height: auto; overflow: visible; display: grid; }
    h1 { font-size: 28px; }
  }
</style>

s": ["material", "kagome", "CDW"], "image": "https://arxiv.org/html/2610.11689v1/graph/fig1.png", "briefing": {"background": "카고메 격자 금속에서 전하 밀도 파동(CDW)의 발생 기제는 상호작용과 격자 구조 사이의 복잡한 관계로 인해 활발히 연구되는 분야입니다. 특히 페르미 표면 중첩(nesting)이 주된 원인인지, 아니면 전자-포논 결합(EPC)이 지배적인지에 대한 논쟁이 지속되고 있습니다.", "motivation": "YRu3Si2와 LaRu3Si2는 각각 800K와 400K라는 매우 높은 CDW 전이 온도를 보이는데, 기존의 이론으로는 이들의 기원을 설명하는 데 한계가 있어 이를 규명하고자 했습니다.", "result": "페르미 표면 중첩이 아닌, 특정 모드에 선택적인 전자-포논 결합이 CDW를 유도함을 밝혔습니다. 특히 Ru의 오프-플레인 포논 모드와 Ru-d, Si-p 오비탈 간의 강한 결합이 핵심이며, 비조화(anharmonic) 포논 효과가 CDW 용융 현상을 설명함을 입증했습니다.", "implication": "카고메 금속에서의 CDW 형성이 단순한 전도 전자 모델을 넘어 격자 동역학 및 국소적 결합에 의해 결정됨을 보였으며, 이는 고온 CDW 제어를 위한 이론적 토대를 마련합니다.", "novelty": "머신러닝 기반의 강제장(force field)을 이용한 분자 동역학 시뮬레이션을 통해 비조화 포논 효과를 성공적으로 해석했습니다. 이는 고온 CDW를 갖는 다른 카고메 물질 연구에 강력한 방법론적 프레임워크를 제공합니다.", "unresolved": "비조화 성분이 실제 실험적인 분광학 데이터(예: RIXS, ARPES)에서 나타나는 구체적인 선폭의 비대칭성과 완전히 일치하는지에 대한 검증이 남아 있습니다.", "future_work": "다른 전이 금속 기반 카고메 시스템으로의 확장 연구 및 압력 변화를 통한 격자 강성 제어와 CDW 온도의 상관관계에 대한 추가적인 실험적 검증이 기대됩니다.", "concepts": [{"term": "모드 선택적 전자-포논 결합", "why_emerged": "특정 포논 모드가 전자의 산란을 지배하여 위상적 질서를 유도하는 기제를 설명하기 위해 필요합니다.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "BCS 이론, Peierls 불안정성, 격자 동역학."}, {"term": "비조화 포논 재규격화", "why_emerged": "온도가 올라감에 따라 고조화(harmonic) 근사가 실패하는 시스템의 구조적 안정성을 해석하기 위해 필요합니다.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "격자 동역학, 위상 전이 이론."}], "english_summary": ["YRu3Si2 and LaRu3Si2 exhibit record-high CDW transition temperatures in kagome systems.", "CDW formation is driven by mode-selective electron-phonon coupling rather than Fermi surface nesting.", "Machine-learning-driven molecular dynamics confirm phonon anharmonicity governs the melting of the CDW phase.", "Ru-Ru bond strength influenced by atomic size significantly impacts the CDW transition temperature."]}}, {"title": "Photoenhanced superconductivity and emergent topological phonons by charge-order suppression in a kagome metal", "journal": "PRB_Recent", "source": antum phases in FeGe.", "High-resolution synchrotron X-ray studies highlight the role of structural degrees of freedom in kagome metals."]}}, {"title": "Correlated one-dimensional electron conduction in ferroelastic domain walls through nematic-like charge stripes", "journal": "Science_Advances", "source": "author whitelist", "link": "https://www.science.org/doi/abs/10.1126/sciadv.aee1472?af=R", "authors": "Minho Kang, Gyubin Lee, Wooin Yang, et al.", "last_authors": "Yeongkwan Kim, Chan-Ho Yang", "summary": "One-dimensional electronic transport reveals many-body quantum phenomena and serves as a foundation for quantum devices, sensors, and reconfigurable electronics. Here, we demonstrate that surface-exposed ferroelastic twin walls in epitaxial WO 3 films function as intrinsic one-dimensional channels, confining electrons to screen surface-bound charges induced by flexoelectric polarization. Scanning tunneling microscopy uncovers a self-organized nematic-like phase forming periodic stripes perpendicular to the walls. Conductive atomic force microscopy and angle-resolved photoemission spectroscopy resolve quantized one-dimensional states and reveal conductance enhancements exceeding two orders of magnitude along the twin walls relative to the surrounding semi-insulating surface regions at room temperature. Temperature-dependent transport follows an Efros–Shklovskii variable-range hopping law, with a crossover near 140 K and a localization length of 39 Å—identical to the stripe period—signifying Coulomb-coupled electrons confined within stripe-induced potential wells along the walls. These findings establish WO 3 ferroelastic walls as a tunable platform for engineering one-dimensional correlated electron states.", "tier": "A_MUST_READ", "score": "9", "reason": "author whitelist: Yeongkwan Kim", "tags": ["nematic", "correlated"], "image": "", "briefing": {"background": "강유전체나 강탄성체와 같은 산화물 박막 내의 결함 영역(도메인 벽)은 격자 왜곡으로 인해 국소적인 전자 상태가 변화하며, 이는 새로운 양자 현상을 관찰할 수 있는 플랫폼을 제공합 es of materials. As automated materials discovery advances, systematic, unsupervised extraction of physical information from ambient-air PYS data becomes important. Conventional fixed-exponent analyses and logarithmic transformations suffer from heteroscedasticity, where the variance diverges in low-signal regions and estimation becomes unstable. To address this, we propose an automated, data-driven analysis framework based on the “1/n-Scan method,” which operates directly in the original signal space, removing the geometric bias inherent in log-transform-based approaches. We further integrate a self-diagnostic quality-evaluation system that quantifies the estimation uncertainty using Akaike weights, together with independent residual metrics—the normalized mean absolute error (NMAE), the RMSE-to-MAE ratio (RMR), the Durbin-Watson (DW) statistic, and a macroscopic diagnostic metric ( Δ ​ R 2 \\Delta R^{2} )—that hierarchically distinguish hardware-related data degradation from a physical-model mismatch. Applying the framework to differently doped Si samples and a polycrystalline Au reference in ambient air, we demonstrate autonomous detection, without assumptions on the emission mechanism, of the breakdown of the single-component approximation in heavily doped p-type Si, arising from the overlap of two emission components with different thresholds, as a statistical anomaly—a decrease in DW below its critical value with an auxiliary increase in Δ ​ R 2 \\Delta R^{2} , despite sound NMAE and RMR—independently confirmed by a two-component fit ( Δ ​ AIC ≈ 57 \\Delta\\text{AIC}\\approx 57 , DW recovering from 0.8 to 2.0). For heavily doped n-type Si, the gradual surface evolution was classified as a change within the single-component description. This framework provides a robust, self-diagnosing analysis engine for closed-loop autonomous materials exploration.", "tier": "A_MUST_READ", "score": "9", "reason": "title strong match: photoemission", "tags": ["photoemission"], "image": "https://arxiv.org/html/2610.11331v1/figs/fig2_si_NL9_dense.png", "briefing": {"background": "광전자 방출 수율 분광법(PYS)은 물질의 일함수와 전자 구조를 평가하는 표준 도구이나, 데이터 분석 시 해석의 주관성이 개입되는 경우가 많습니다.", "motivation": "데이터 기반의 자율 소재 탐색 시스템에서 인간의 개입 없이 물리적인 노이즈와 신호를 자동으로 분리하고 해석하는 자동화 프레임워크가 필요했습니다.", "result": "데이터 분석 모델의 모델 불확실성을 평가하는 자율 진단 시스템을 개발했습니다. Akaike 가중치와 잔차 메트릭(NMAE, DW 통계량 등)을 사용하여 장비 노이즈와 실제 물리적 전자 상태 변화를 통계적으로 구분하는 데 성공했습니다.", "implication": "다양한 도핑 농도의 샘플 분석 시 데이터의 왜곡 여부를 자가 진단할 수 있어, 향후 고속 자동화 실험 환경에서 분석 신뢰도를 크게 높일 수 있습니다.", "novelty": "물리적 모델을 미리 가정하지 않고 통계적 편차만을 분석하여 다성분 전자 상태를 감지할 수 있다는 점이 강력한 장점입니다.", "unresolved": "매우 낮은 신호대 잡음비 환경에서도 모델이 동일한 진단 능력을 유지할지에 대해서는 추가 검증이 필요합니다.", "future_work": "고차원 ARPES 데이터 분석이나 다른 대규모 실험 데이터 자동화 분석 파이프라인에 통합될 것으로 예상됩니다.", "concepts": [{"term": "광전자 방출 수율 분광법(PYS)", "why_emerged": "물질의 일함수와 밴드 구조의 에너지 기준점을 측정하기 위해 개발되었습니다.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "ARPES 및 UPS와 같은 고전적 광전자 분광법의 보완적 기법입니다."}, {"term": "Akaike 가중치", "why_emerged": "주어진 데이터에 대해 여러 통계적 모델 중 가장 적합한 모델을 선택하기 위한 기준이 필요했습니다.", "origin": "Hirotugu Akaike에 의해 제안된 정보 이론 기반 통계 방식입니다.", "connections": "모델 선택 이론 및 데이터 과학의 기본 도구입니다."}], "english_summary": ["Introduces an autonomous analysis framework for Photoemission Yield Spectroscopy (PYS).", "Uses a self-diagnostic system with residual metrics to distinguish hardware noise from physical signals.", "Successfully identifies multi-component emission features in doped Si without prior model assumptions.", "Facilitates high-throughput, closed-loop autonomous materials exploration."]}}, {"title": "Demonstration of ultrafast coherent sub-picosecond magnon pulses", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2610.11550", "authors": "Peter Kuba\\v{s}\\v{c}\\'ik, Miina Leivisk\\\"a, Martin Bu\\v{s}ina, et al.", "last_authors": "Helena Reichlova, Luk\\'a\\v{s} N\\'advorn\\'ik", "summary": "Ultrafast magnonics explores routes towards energy-efficient information processing by replacing electrons with pulses of terahertz magnons. The critical, but so far elusive, requirement on the magnon pulses is the combination of high-speed and a long-range propagation while maintaining a well-defined narrow waveform of the pulses. Here, we demonstrate the launching of 0.4-picosecond magnon pulses in the altermagnetic insulator $\\alpha$-Fe$_2$O$_3$ (hematite) using broadband terahertz spin-orbit torques by an adjacent platinum layer. Phase-resolved terahertz transmission reveals that these sub-picosecond pulses travel ballistically, coherently and non-dispersively at a constant velocity of 23 nm/ps, transport angular momentum and retain their temporal waveform shape over 160 nm, with an inferred relaxation length in hundreds of nanometers or more. Beyond establishing $\\alpha$-Fe$_2$O$_3$ as an optimal platform for ultrafast magnonics, our technique introduces a high-resolution, tabletop method to directly extract dispersion relations up to high wavevectors, and explore ultrafast magnon dynamics in altermagnets and other magnetic materials with teraherz-range dynamics.", "tier": "A_MUST_READ", "score": "9", "reason": "Experimental demonstration of coherent magnon transport in the altermagnet hematite; highly relevant.", "tags": ["material", "altermagnet", "magnon", "transport"], "image": "https://arxiv.org/static/browse/0.3.4/images/arxiv-logo-fb.png", "briefing": {"background": "테라헤르츠(THz) 주파수 대역의 초고속 정보 처리를 위해, 기존 전자의 이동 대신 스핀 파동인 마그논을 이용한 저전력 정보 전달 기술이 주목받고 있습니다.", "motivation": "알터자성(Altermagnet) 물질인 hematite에서 마그논이 매우 빠르게, 그리고 손실 없이 먼 거리를 이동할 수 있는지를 실증하고자 했습니다.", "result": "알터자성체 hematite에 Pt 층을 붙여 테라헤르츠 스핀-궤도 토크를 가한 결과, 0.4 피코초의 좁은 마그논 펄스를 생성했습니다. 이 펄스는 23 nm/ps의 속도로 160 nm 이상의 거리까지 분산 없이 탄도적으로 전파됨을 확인했습니다.", "implication": "알터자성체가 고속/고효율 마그논 소자의 유망한 플랫폼임을 입증했으며, 향후 위상/자기 위상 물질의 빠른 동역학 연구에 크게 기여할 것입니다.", "novelty": "알터자성체에서 탄도적인 마그논 수송을 직접 실증했다는 점이 핵심입니다. 특히 ARPES를 통한 전자 구조 연구와 연계하여 자기 위상 물질의 동역학적 특성을 규명하는 연구자에게 매우 중요한 단서가 됩니다.", "unresolved": rs": "Markus Donath, Ralph Claessen", "summary": "Orbital angular momentum (OAM) characterization is central to understanding quantum materials such as valley Hall and Rashba systems and, through its connection to Berry curvature, provides key insight into band topology. Conventional OAM detection via photoemission dichroism, however, is susceptible to interference artifacts and is largely restricted to occupied states. Here, we demonstrate a real-space approach to map the $L_z$ OAM character using scanning tunneling microscopy in triangular atomic monolayers. Unlike photoemission, this method exploits interference effects arising from the $L_z$ orbital phase and the Bloch phase associated with neighboring atoms. This shifts the local density of states (LDOS) maxima to distinct Wyckoff positions between atoms, encoding $L_z$ information into characteristic real-space LDOS patterns. We exemplify this approach in 2D quantum materials with contrasting $L_z$ sequences, namely Tl/Si(111) and In/SiC(0001) monolayers, identifying $L_z$-dependent LDOS accumulation associated with distinct topological phases in both systems. Our results establish $L_z$-dependent charge localization as a proxy to atomic obstruction for energetically isolated states in triangular lattices, including transition-metal dichalcogenides.", "tier": "A_MUST_READ", "score": "9", "reason": "Directly relevant STS methodology for mapping orbital angular momentum and Berry curvature in topological monolayers.", "tags": ["method", "monolayer", "STS"], "image": "https://arxiv.org/html/2610.11633v1/Figure_1.png", "briefing": {"background": "물질의 밴드 위상학을 결정하는 궤도 각운동량(OAM)과 베리 곡률(Berry curvature)은 양자 물질 연구의 핵심입니다. 기존의 ARPES는 간섭 효과로 인해 해석의 한계가 있었습니다.", "motivation": "사진 방출법(ARPES) 대신 실제 공간(real-space)에서 STS를 활용하여 OAM 정보를 추출하는 새로운 비파괴적 매핑 방법을 제안합니다.", "result": "원자 사이의 간섭 패턴이 Lz 궤도 각운동량을 반영하여 국소 상태 밀도(LDOS) 패턴을 변화시킨다는 것을 밝히고 이를 검증했습니다.", "implication": "STS만으로도 위상학적 성질을 추론할 수 있게 되어, 표면 물리학 연구의 정밀도를 크게 높일 수 있습니다." play of these phenomena. The main tools of the study are various types of relativistic calculations based on density functional theory combined with the symmetry analysis on the basis of spin space groups. The consideration is performed on two different levels. On the first level, the atomistic magnetic structure of weak ferromagnetic state is calculated and discussed. Both spin and orbital atomic moments are taken into account. We study the dependence of the WFM moment on the strength of the SOC and obtain a peculiar nonmonotonous type of dependence. We separate the contributions of the SOC of the metal and ligand atoms to WFM. A very interesting result is obtained in quasisymmetry (QS) calculation where only the component of the SOC collinear to the Néel vector is taken into account. In QS calculation the spin WFM is absent while the orbital WFM is present. This result reveals a principal difference in the formation of the spin and orbital magnetic moments. On the second level, the study is focused on the properties of individual electron states. We introduce the notion of the magnetic structure of the electron state (MSES). It is shown how the nonrelativistic collinear spin-MSES of both metal and ligand moments and nonrelativistic compensated orbital-MSES of the ligand moments transform into complex noncollinear 3D MSESs of both spin and orbital nature giving large contributions to WFM. An important role in the formation of MSESs is played by the relativistic splitting of the accidental spin degeneracies at general k points filling the volume of the Brillouin zone. The formation of the regions of avoided crossings in the relativistic band structure is related to the nonmonotonous dependence of the WFM moment as the function of the SOC strength. The importance of the metal-ligand hybridization in the formation of the AM properties is discussed and illustrated by means of the comparison of the LDA and LDA+ U U calculations. Most of the calculations are performed for MnTe, a prototypical material for the class of altermagnets.", "tier": "A_MUST_READ", "score": "9", "reason": "Direct hits on altermagnetism, electronic structure splitting, and MnTe; highly relevant for ARPES interpretation.", "tags": ["material", "topic", "altermagnet"], "image": "https://arxiv.org/html/2605.01780v3/Fig_MnTe_magn_struct.png", "briefing": {"background": "알터마그넷(Altermagnet)은 순자화가 0이면서도 운동량 의존적 스핀 분할을 보이는 새로운 자기 물질군입니다. 기존의 강자성체나 반강자성체와 달리, 비상대론적 스핀 분할이 가능하다는 점이 학계의 큰 관심을 받고 있습니다.", "motivation": "알터마그넷에서 스핀-궤도 결합(SOC)이 발생하는 구체적인 메커니즘과 그로 인한 약한 강자성(WFM) 현상, 그리고 전자 상태의 상대론적 변화를 체계적으로 이해하고자 합니다.", "result": "MnTe를 모델로 하여, SOC가 스핀 WFM과 궤도 WFM에 미치는 비단조적인 영향을 분석했습니다. 특히 스핀과 궤도 자기 모멘트 형성의 근본적인 차이를 규명하고, 전자 상태의 MSES(Magnetic Structure of the Electron State) 개념을 도입하여 SOC에 의한 밴드 갭 닫힘 및 회피 교차를 설명했습니다.", "implication": "알터마그넷의 전자 구조를 해석할 때 SOC의 역할을 보다 정밀하게 분리할 수 있게 되었으며, 이는 ARPES를 통해 측정되는 밴드 분할 패턴을 해석하는 데 필수적인 기초 자료가 됩니다.", "novelty": "기존 단순 스핀 모델을 넘어 궤도 모멘트의 기여를 명확히 분리했고, 메탈-리간드 하이브리다이제이션의 중요성을 DFT 계산으로 입증했습니다.", "unresolved": "실제 실험적 ARPES 결과와 이론적 예측값 사이의 미세한 에너지 정렬 오차에 대한 정량적 일치 문제는 여전히 남은 과제입니다.", "future_work": "다양한 전이금속 화합물에 대해 이 프레임워크를 적용하여 알터마그네틱 페르미 표면의 특성을 예측하고, 실험적으로 관측된 밴드 분할과의 대조가 필요합니다.", "concepts": [{"term": "Altermagnetism", "why_emerged": "기존 반강자성체 분류로는 설명되지 않는 비상대론적 스핀 분할 현상을 설명하기 위해 제안됨.", "origin": "I. I. Mazin 외 (2022년경 본격화)", "connections": "반강자성체, 스핀-궤도 결합, 강자성체와 구별되는 대칭성 파괴."}, {"term": "Weak Ferromagnetism (WFM)", "why_emerged": "반강자성체 내에서 대칭성 허용 시 미세한 스핀 기울어짐(canting)으로 발생하는 순자화를 설명하기 위해.", "origin": "Dzyaloshinskii (1950년대)", "connections": "Dzyaloshinskii-Moriya 상호작용, 자기 이방성."}, {"term": "MSES (Magnetic Structure of the Electron State)", "why_emerged": "단일 밴드 내에서 스핀 및 궤도 모멘트의 비공선적 결합 구조를 상세히 기술하기 위해 도입됨.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "밴드 구조 계산, 자기적 위상 구조."}], "english_summary": ["Analyzes SOC-induced effects in altermagnetic MnTe through detailed DFT calculations.", "Identifies non-monotonic dependence of weak f ivity"], "image": "", "briefing": {"background": "위상 초전도체는 마요라나 페르미온을 구현할 수 있는 후보로 주목받고 있습니다. 이를 위해 기존 자기 위상 물질과 초전도체를 접합하는 연구가 활발합니다.", "motivation": "카고메 자성체의 양자 이상 홀(QAH) 상태와 일반적 s-파 초전도체를 결합하여 위상 초전도성을 구현할 수 있는 이론적 조건을 모색합니다.", "result": "단순 s-파 초전도체와의 근접 효과만으로는 위상 초전도 상태를 얻기 어렵다는 한계를 지적하고, 이를 해결하기 위한 Rashba 상호작용의 역할을 분석했습니다.", "implication": "카고메 격자 기반의 위상 소자를 설계할 때 Rashba SOC의 비대칭적 특성이 필수적인 요소임을 제시합니다.", "novelty": "카고메 자성체의 복잡한 전자 구조와 초전도 근접 효과 사이의 상호작용을 위상적 관점에서 체계화했습니다.", "unresolved": "실제 소재(예: AV3Sb5)에서 이러한 Rashba 효과를 충분히 강하게 유도할 수 있는지에 대한 실험적 구현 가능성은 미지수입니다.", "future_work": "실제 kagome 층을 포함한 이종접합 구조에서의 위상 밴드 구조 시뮬레이션.", "concepts": [{"term": "Topological Superconductivity", "why_emerged": "위상적으로 보호된 엣지 모드를 통해 마요라나 제로 모드를 안정화하기 위해.", "origin": "Fu & Kane (2008)", "connections": "양자 컴퓨팅, 위상 절연체, 마요라나 페르미온."}, {"term": "Rashba Interaction", "why_emerged": "반전 대칭성이 깨진 계면에서 스핀-궤도 결합을 통한 스핀 분할을 설명하기 위해.", "origin": "Rashba (1960)", "connections": "스핀-궤도 토크, 위상 절연체."}], "english_summary": ["Analyzes topological superconductivity in kagome magnets via proximity effects.", "Explains the limitations of s-wave superconductor coupling to QAH systems.", "Highlights the critical role of Rashba SOC in stabilizing the topological phase.", "Provides theoretical insight for designing topological quantum devices with kagome materials."]}}, {"title": "Eight-Unit-Cell Electronic Modulations in Cuprates Originating from Local Molecular Orbitals", "journal": "PRL_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/lvpn-gblk", "authors": "Zhiheng Yao, Sixuan Chen, Jianfa Zhao, et al.", "last_authors": "Shuo Yang, Yayu Wang", "summary": "The pair density wave state with eight-unit-cell ($8{a}_{0}$) periodicity has been widely regarded as the primary order in cuprates, yet its existence and origin remain subjects of intense debate. Using spectroscopic imaging scanning tunneling microscopy, we observe spatial modulations of the electr…", "tier": "B_IMPORTANT_CONDMAT", "score": "9", "reason": "STS study of spatial modulations and electronic order in cuprate superconductors.", "tags": ["method", "material", "STS", "cuprates"], "image": "", "briefing": {"background": "구리 산화물 초전도체(cuprates)는 고온 초전도 현상의 기원을 이해하기 위해 수십 년간 연구되어 왔으며, 특히 전하 밀도 파(CDW)와 쌍 밀도 파(PDW)와 같은 공간적 전자 변조 현상이 초전도성과 어떤 관계를 맺는지 밝히는 것이 핵심 과제입니다.", "motivation": "구리 산화물에서 관찰되는 8단위 격자(8a0) 주기의 전자 변조 현상이 실제 PDW 상태의 발현인지, 아니면 다른 기원에 의한 것인지에 대한 논란을 해결하고자 합니다.", "result": "주사 터널링 현미경(STM) 분광 이미징을 통해 8a0 주기의 변조가 국소 분자 오비탈의 특성과 관련되어 있음을 관찰했습니다.", "implication": "이 결과가 사실이라면 구리 산화물의 전자적 불균일성이 단순히 외부 요인이 아니라 결정 격자 내부의 국소적인 분자 오비탈 물리로부터 유도됨을 시사합니다.", "novelty": "STS를 활용하여 8a0 변조의 마이크로 수준 기원을 식별했다는 점에서 구리 산화물의 복잡한 정렬 현상을 이해하는 데 새로운 시각을 제공합니다.", "unresolved": "이러한 국소 오비탈 변조가 고온 초전도 메커니즘 전반에 어떻게 기여하는지에 대한 직접적인 상관관계는 여전히 규명되어야 합니다.", "future_work": "다른 구리 산화물 물질군과의 비교 연구 및 고자기장 하에서의 STS 측정을 통한 정렬 상태의 변화 추적이 예상됩니다.", "concepts": [{"term": "PDW (Pair Density Wave)", "why_emerged": "쿠퍼 쌍이 비영 위 운동량을 가지는 초전도 상태를 설명하기 위해 필요함.", "origin": "Agterberg 등에 의해 이론적으로 제안됨.", "connections": "CDW, 구리 산화물 내 스트라이프(stripe) 위상."}, {"term": "STS (Scanning Tunneling Spectroscopy)", "why_emerged": "물질 표면의 원자 단위 국소 상태 밀도를 측정하기 위해 발달함.", "origin": "Gerd Binnig과 Heinrich Rohrer에 의해 발명됨.", "connections": "ARPES와 상호보완적이며 전자 상태 밀도 분석에 필수적임."}], "english_summary": ["Investigated the 8-unit-cell electronic modulation in cuprates.", "Used spectroscopic imaging STM to resolve spatial modulations.", "Identified local molecular orbitals as a potential origin of the 8a0 state.", "Provides a microscopic perspective on the controversial PDW state."]}}, {"title": "Microscopic Signatures of Chern Number Sign Reversal in Twisted Bilayer WSe2", "journal": "PRL_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/1jks-ld4b", "authors": "Ke Lv, Ya-Ning Ren, Lin He", "last_authors": "Ya-Ning Ren, Lin He", "summary": "The observation of quantized Chern numbers in twisted transition metal dichalcogenide homobilayers, including 3.7° twisted ${\\mathrm{MoTe}}_{2}$ and 1.23° twisted ${\\mathrm{WSe}}_{2}$, represents a landmark breakthrough in moiré physics. A striking and unresolved paradox to emerge from these studies…", "tier": "B_IMPORTANT_CONDMAT", "score": "9", "reason": "Direct relevance to moir physics, twisted TMDs, and Chern insulators.", "tags": ["material", "moir", "twisted-bilayer", "topological"], "image": "", "briefing": {"background": "뒤틀린 전이금속 칼코겐화물(TMD) 이중층 구조는 모아레 무늬를 통해 밴드 구조를 제어하고, 특히 Chern 절연체와 같은 위상적 상태를 구현하는 데 매우 중요한 플랫폼입니다.", "motivation": "뒤틀린 TMD 호모바이레이어에서 Chern 수의 부호가 바뀌는 현상이 보고되었으나, 이러한 물리적 기원에 대한 해석이 아직 미흡하여 이를 명확히 밝히고자 했습니다.", "result": "뒤틀린 WSe2 모아레 격자 내에서 Chern 수의 부호 역전을 유발하는 미세 구조적 특징을 발견했습니다.", "implication": "Chern 수의 부호 제어는 위상적 홀 효과 등을 활용한 차세대 소자 구현에 직접적으로 기여할 수 있습니다.", "novelty": "모아레 격자의 적층 구조와 위상적 성질 간의 직접적인 연결고리를 미시적으로 제시하여 기존의 모아레 물리 연구의 난제를 다룹니다.", "unresolved": "Chern 절연체 상태의 안정성에 영향을 주는 국소적 변형(strain)의 정량적 기여도는 여전히 논의가 필요합니다.", "future_work": "다양한 트위스트 각도와 외부 전기장에 따른 Chern 절연 상태의 위상 다이어그램 탐구가 이어질 것입니다.", "concepts": [{"term": "Chern Number", "why_emerged": "에너지 밴드의 위상적 특성을 분류하기 위한 불변량으로 필요함.", "origin": "Thouless, Kohmoto, Nightingale, den Nijs (TKNN) 등에 의해 정립됨.", "connections": "양자 홀 효과, 위상 절연체, Berry 곡률."}, {"term": "Moiré Physics", "why_emerged": "원자층 물질을 겹칠 때 발생하는 격자 간섭이 전자 물성을 조절함을 이해하기 위해 대두함.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "뒤틀린 이중층 그래핀, flat-band, 강상관계."}], "english_summary": ["Explored the Chern number sign reversal in twisted bilayer WSe2.", "Revealed microscopic signatures linked to the topological nature of moire bands.", "Addresses a fundamental paradox in topological moire systems.", "Suggests new control mechanisms for topological phases in TMDs."]}}, {"title": "Néel-Antiferromagnet-Proximitized Superconductivity in the NbSe2/MnPS3 Heterostructures", "journal": "PRL_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/xfg2-227f", "authors": "Xinyi Zheng, Ruihuan Duan, Xilin Feng, et al.", "last_authors": "Guangtong Liu, Li Lu", "summary": "Antiferromagnet-superconductor (AFM-SC) hybrids offer a rich but largely unexplored platform for realizing spin-triplet Cooper pairing and chiral topological superconductivity, yet experimental demonstrations remain scarce. Here, we report the modification of superconductivity in ${\\mathrm{NbSe}}_{2…", "tier": "B_IMPORTANT_CONDMAT", "score": "9", "reason": "Proximity effects in NbSe2 heterostructures, highly relevant to 2D superconductivity.", "tags": ["material", "heterostructure", "superconductivity", "2D-materials"], "image": "", "briefing": {"background": "강자성체 또는 반강자성체와 초전도체를 접합하는 이종 구조는 스핀-삼중항(spin-triplet) 초전도성이나 위상적 초전도성을 구현하기 위한 핵심적인 연구 분야입니다.", "motivation": "반강자성 절연체(MnPS3)와 일반 초전도체(NbSe2)의 이종 접합에서 나타나는 초전도성의 변조와 스핀 상호작용을 규명하고자 합니다.", "result": "NbSe2의 초전도 성질이 MnPS3와의 근접 효과(proximity effect)에 의해 반강자성 특성에 민감하게 반응함을 실험적으로 입증했습니다.", "implication": "이종 구조 내의 스핀 교환 상호작용이 2차원 초전도체의 위상적 특성을 제어하는 도구로 사용될 수 있음을 보여줍니다.", "novelty": "NbSe2라는 잘 알려진 2D 초전도체와 자성 물질을 결합하여, 반강자성체 기반의 위상적 초전도성 가능성을 제시했다는 점에서 중요합니다.", "unresolved": "실제로 이 시스템에서 스핀-삼중항 쌍이 생성되었는지에 대한 구체적인 증거는 아직 추가 검증이 필요합니다.", "future_work": "Josephson 접합 실험이나 Tunneling spectroscopy를 통한 스핀 편극 측정이 후속 연구로 예상됩니다.", "concepts": [{"term": "Proximity Effect", "why_emerged": "서로 다른 물성을 가진 물질이 접합했을 때 물성이 전이되는 현상을 설명하기 위해 도입됨.", "origin": "초전도체-정상금속 접합에서 처음 제안됨.", "connections": "조셉슨 효과, 위상 초전도성, Andreev 반사."}, {"term": "NbSe2", "why_emerged": "2차원 전이금속 칼코겐화물 중 전형적인 층상 초전도체로 연구됨.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "CDW, 이징(Ising) 초전도성, 2D 이종구조."}], "english_summary": ["Studied NbSe2/MnPS3 heterostructures to realize antiferromagnet-superconductor proximity.", "Observed modifications in the superconducting state of NbSe2.", "Discusses the potential for spin-triplet pairing in the hybrid system.", "Provides a platform for investigating topological superconductivity in 2D."]}}, {"title": "Observation of Time-Reversal Symmetry Breaking in the sistant to disorder.", "Shows that Tc suppression in these systems can resemble that of conventional s-wave superconductors.", "Provides theoretical insight into the robustness of superconducting states in kagome materials."]}}, {"title": "Anatomy of Spin--Orbit Torques in Monolayer Fe3GeTe2 and Fe3GaTe2: Insights from atomistic and momentum-space decompositions", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2608.05788", "authors": "Gusthavo M. S. Brizolla, Stepan S. Tsirkin, Yaroslav Zhumagulov, Jaroslav Fabian", "last_authors": "Yaroslav Zhumagulov, Jaroslav Fabian", "summary": "We present a systematic first-principles study of the spin-orbit torques in the ferromagnetic monolayers Fe$_3$GeTe$_2$ (FGT) and Fe$_3$GaTe$_2$ (FGaT). Despite sharing the same crystal structure (point group $D_{3h}$) and predominantly Fe~$3d$ spin-polarized bands, the two materials exhibit markedly different current-induced torques. We reveal these differences by computing the full angular dependence of the torkance---the torque per unit applied electric field---using linear-response theory with symmetry-adapted spin--orbit-coupled Wannier functions. FGaT may be viewed as a hole-doped analogue of FGT, since Ga contributes one valence electron fewer than Ge. Although the work functions differ by only about $28$~meV, the band filling near $K$ and $K'$ changes substantially: the density of states at $\\varepsilon_F$ is reduced by a factor of three and its spin polarization reverses from minority in FGT to majority in FGaT. These electronic changes are reflected in the torques resolved by time-reversal parity, sublattice, and momentum. In particular, we identify pronounced hidden torques in FGaT and relate the suppression of its fourth-harmonic Fermi-sea component to the evolution of momentum-space pockets. Finally, we discuss the emergence of such self-torques, which are not captured by the conventional picture of current-induced spin accumulation, within a  et al.", "last_authors": "Qimiao Si, Emilia Morosan", "summary": "Strongly correlated chiral materials have been proposed to host a chiral Weyl-Kondo semimetal (cWKSM) state, in which Kondo hybridization pins chirality-induced Kramers-Weyl point crossings, together with additional symmetry-enforced band crossings, near the Fermi level. Realizing this state requires a material that combines crystal chirality, non-symmorphic symmetry, and Kondo correlations, and currently there are no known materials that combine all these requirements. Here we report evidence for a cWKSM state in CeGaGe, a member of the RXY (R = rare earth; X = Al, Si; Y = Ga, Ge) family. Magnetization measurements confirm long-range antiferromagnetic order below T$_N$ = 4.7 K with a complex, canted magnetic structure. Unique to CeGaGe among the known RXY systems is a structural transition from an achiral tetragonal I4$_{1}$md structure (at high temperatures) to the chiral tetragonal P4$_{3}$ structure (at low temperatures). The structural transition in CeGaGe allows us to highlight the role of chirality in stabilizing the Kramers cWKSM state. Hall resistivity measurements with $H || c$ reveal an anomalous Hall conductivity (AHC) that is constant below the Kondo temperature $T_K \\approx 7$ K and drops sharply above it. This crossover tracks the onset of Kondo coherence rather than the magnetic ordering, which occurs at T$_N$ = 4.7 K. Together with first-principles calculations for the $P4_3$ structure, this identifies the AHC as an intrinsic, Berry-curvature-driven contribution generated by Kondo hybridization, rather than a consequence of extrinsic scattering or dynamic scalar spin chirality. These results establish CeGaGe as a rare experimental platform in which crystal chirality, strong electronic correlations, and non-trivial band topology coexist, providing the first material realization of a Kondo-driven cWKSM state.", "tier": "B_IMPORTANT_CONDMAT", "score": "9", "reason": "Correlated topological semimetal CeGaGe exhibits Berry-curvature-driven anomalous Hall effect and Kondo hybridization.", "tags": ["CeGaGe", "Weylsemimetal", "anomalousHalleffect"], "image": "https://arxiv.org/html/2609.32012v3/Fig1_new1.png", "briefing": {"background": "강한 전자 상관관계가 존재하는 계(correlated electron systems)에서 결정의 키랄성(chirality)과 비대칭성을 활용하여 토폴로지적 밴드 구조를 제어하는 연구가 활발합니다. 특히 'Kondo-Weyl semimetal'은 전자 상관관계와 토폴로지적 특성이 결합된 새로운 양자 상태를 찾으려는 노력의 핵심입니다.", "motivation": "키랄성, 비대칭성, Kondo 상관관계를 동시에 가진 물질은 이론적으로 존재하지만 실험적 증거가 부족합니다. 본 연구는 RXY 계열 중 CeGaGe를 사용하여 이러한 cWKSM 상태의 실현 가능성을 탐구하고자 했습니다.", "result": "CeGaGe가 고온의 사방정계(tetragonal) 구조에서 저온의 키랄성(P4_3) 구조로 상전이함을 발견했습니다. Kondo 온도(Tk) 이하에서 나타나는 비정상 홀 전도도(AHC)를 통해, 이것이 외부적인 산란이 아닌 Kondo 혼성(hybridization)에 의한 내재적 베리 곡률(Berry curvature) 기여임을 증명했습니다.", "implication": "CeGaGe가 결정 키랄성, 강한 상관관계, 토폴로지적 밴드 구조가 공존하는 첫 번째 실험적 플랫폼임을 확립했습니다. 이는 Kondo 물리학과 Weyl 토폴로지의 융합을 연구할 중요한 지표가 됩니다.", "novelty": "키랄 구조 상전이를 통해 Weyl 점을 안정화하고, Kondo 효과가 베리 곡률을 구동한다는 점을 비정상 홀 효과의 온도 의존성으로 명확히 구분해낸 점이 중요합니다.", "unresolved": "자기 구조의 복잡한 캔팅(canting) 상태와 Kondo 격자 간의 상호작용이 구체적으로 어떻게 Weyl 점의 위치를 미세 조정하는지에 대한 전산 모사 보완이 필요합니다.", "future_work": "ARPES를 통한 실제 Weyl 점의 직접적인 관측과 자기장 변화에 따른 홀 전도도의 위상학적 변화 추적이 기대됩니다.", "concepts": [{"term": "Chiral Weyl-Kondo semimetal (cWKSM)", "why_emerged": "상관관계가 강한 시스템에서 키랄 결정 구조가 위상학적 준금속 상태를 어떻게 안정화하는지 설명하기 위해 필요.", "origin": "초록 정보만으로는 특정하기 어려움 (Qimiao Si 그룹의 최근 제안 등으로 추정)", "connections": "Weyl semimetal, Kondo insulator, Kramers-Weyl nodes"}, {"term": "Anomalous Hall Conductivity (AHC)", "why_emerged": "자성 물질에서 자기장 없이도 베리 곡률로 인해 발생하는 홀 효과를 이해하기 위해 필요.", "origin": "Karplus and Luttinger (1954)", "connections": "Berry curvature, Topological Hall effect, Weyl semimetal"}], "english_summary": ["Reported the first experimental evidence of a chiral Weyl-Kondo semimetal (cWKSM) in CeGaGe.", "Identified a temperature-dependent chiral phase transition stabilizing the cWKSM state.", "Demonstrated that Kondo hybridization generates intrinsic Berry-curvature-driven anomalous Hall conductivity.", "Established CeGaGe as a key platform for studying the interplay between crystal chirality and strong correlations."]}}, {"title": "Emergent gold-induced interfacial magnetism in monolayer FePS3", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2610.12041", "authors": "Giuseppe Buccoliero, Anita Polli, Marli dos Reis Cantarino, et al.", "last_authors": "Johann Coraux, Nicholas B. Brookes", "summary": "Owing to their atomically clean interfaces and extreme thinness, two-dimensional (2D) materials are ideal hosts for strong proximity effects, whereby contact with an adjacent material reshapes their ground state. Here, we demonstrate such an effect within a hybrid heterostructure, between the 2D antiferromagnet FePS$_3$ and an ultrathin gold film. Rather than a passive support, the latter profoundly changes the nature of the magnetism in the 2D magnet, inducing a sizeable interfacial moment. Large-area flakes from Au-assisted exfoliation, combined with element-selective X-ray absorption mapping, enable a layer-by-layer study from monolayer to bulk, benchmarked against an inert SiO$_2$ substrate reference. At 9 T and 5 K, the monolayer on gold shows a three-fold enhanced X-ray magnetic circular dichroism relative to SiO$_2$, with a $\\sim$40% reduction of the orbital-to-spin moment ratio. Resonant inelastic X-ray scattering reveals a collapse of the crystal-field (d-d) excitations and a massive spectral-weight transfer to the charge-transfer region, unveiling the microscopic mechanism behind this change. Supported by atomic multiplet calculations, we identify interfacial charge transfer and Fe 3d-Au hybridization as the origin of these effects, which decay over the first three layers and vanish at the pentalayer, establishing layer number combined with substrate engineering as an atomically precise handle.", "tier": "B_IMPORTANT_CONDMAT", "score": "9", "reason": "High relevance: RIXS and XMCD study of magnetism in a 2D van der Waals monolayer heterostructure.", "tags": ["RIXS", "2Dmagnetism", "heterostructure"], "image": "https://arxiv.org/html/2610.12041v1/Figure1.png", "briefing": {"background": "반데르발스(vdW) 자성 물질은 층 두께를 원자 단위로 조절할 수 있어 나노 스케일의 스핀트로닉스 소자로 주목받습니다. 특히 기판과의 계면 효과는 2D 자성을 근본적으로 바꿀 수 있는 핵심 변수입니다.", "motivation": "FePS3는 2D 반강자성체로 잘 알려져 있는데, 금속 기판(Au)과의 접촉이 이 물질의 자기적 특성에 어떤 근접 효과(proximity effect)를 주는지 규명하고자 했습니다.", "result": "Au 기판이 FePS3 단층의 자기 모멘트를 3배 증가시키고 자기적 이방성을 변화시킴을 발견했습니다. RIXS 분석을 통해 d-d 전이의 붕괴와 Fe 3d-Au 궤도 간의 혼성(hybridization)이 이러한 자기적 변화의 핵심 원인임을 밝혔습니다.", "implication": "2D 자성체의 기판 공학이 단순히 지지대 역할을 넘어 물질의 자기적 상태를 재설계(reconstruct)하는 강력한 수단이 될 수 있음을 보여줍니다.", "novelty": "RIXS를 사용하여 계면에서의 전하 이동과 궤도 혼성을 직접적으로 관찰하고, 이것이 bulk가 아닌 박막에서만 나타나는 특이 현상임을 증명했습니다.", "unresolved": "계면의 국소적 구조 변화가 전체 층 구조의 전이 온도(TN)에 미치는 영향은 아직 명확하지 않습니다.", "future_work": "다양한 귀금속 기판에서의 FePS3의 스핀 파동(magnon) 분산 관계 변화 연구 및 광학적 제어 연구.", "concepts": [{"term": "Proximity Effect", "why_emerged": "다른 성질을 가진 물질을 접합시켰을 때 경계면 근처에서 새로운 양자 상태가 유도되는 현상을 설명하기 위해 필요.", "origin": "초전도체-자성체 접합에서 처음 제안됨 (1960년대)", "connections": "van der Waals heterostructures, Spintronics, Interfacial magnetism"}, {"term": "RIXS (Resonant Inelastic X-ray Scattering)", "why_emerged": "원소 선택적으로 전자 상태와 자기 들뜸(excitation)을 동시에 측정하기 위해 필요.", "origin": "1990년대 이후 기술 발전으로 본격화", "connections": "Magnons, Crystal field excitations, Charge transfer"}], "english_summary": ["Demonstrated emergent interfacial magnetism in monolayer FePS3 on Au substrates.", "Observed a 3-fold enhancement of the magnetic moment and modification of orbital-to-spin ratio.", "RIXS revealed significant charge transfer and Fe 3d-Au hybridization at the interface.", "Proposed substrate engineering as a precise control for 2D magnetism."]}}, {"title": "From band reconstruction to Bogoliubov dispersion: How dz2-band enhances iron-based superconductivity", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2610.11484", "authors": "Jingming Yan, Shendong Su, Guihao Jia, et al.", "last_authors": "Qi-Kun Xue, Wei Li", "summary": "Conventional understanding of iron-based superconductivity is usually established based on electronic bands at the Fermi level, leaving deeper bands overlooked as potential factor. Here, we expand this view by demonstrating that a deep-lying dz2 band below the Fermi level can be employed to enhance the superconducting paring strength. By using scanning tunneling microscope to mechanically change the crystal lattice of an iron-based superconductor, we observe an upward shift of the deep-lying dz2 band related feature, leading to hybridization with the primary superconducting bands at the Fermi level. We visualize the novel evidence of this band hybridization and resulting enhanced superconducting gap through quasiparticle interference imaging, providing conclusive evidence that engineering such correlations between deep and pairing-active bands is a potent mechanism for amplifying the superconducting gap. This work refines the conventional view of pairing-relevant electronic structures and establishes band hybridization as an effective way to optimize superconducting materials.", "tier": "B_IMPORTANT_CONDMAT", "score": "9", "reason": "STM study of band hybridization and superconducting gaps in iron-based superconductors; fits core spectroscopic expertise.; demoted from A: broad CM, not direct user/project hit", "tags": ["method", "scanningtunneling", "superconductivity", "electronicstructure"], "image": "https://arxiv.org/static/browse/0.3.4/images/arxiv-logo-fb.png", "briefing": {"background": "철 기반 초전도체(FeSC)의 초전도 짝지음은 일반적으로 페르미 준위 근처의 밴드에 의해 결정된다고 여겨졌습니다. 하지만 실제 고온 초전도 메커니즘을 이해하려면 더 깊은 밴드의 역할도 재평가할 필요가 있습니다.", "motivation": "페르미 준위 아래에 존재하는 dz2 밴드가 실제 초전도 갭 크기에 기여할 가능성을 조사하기 위해 본 연구를 수행했습니다.", "result": "STM을 이용한 기계적 변형(strain)을 통해 dz2 밴드를 페르미 준위로 끌어올렸을 때, 이 밴드가 초전도 밴드와 혼성되면서 초전도 갭이 명확하게 증대되는 것을 QPI(준입자 간섭) 영상으로 확인했습니다.", "implication": "기존의 페르미 면 중심의 초전도 이론을 넘어, '깊은 밴드(deep-lying band)'를 이용한 초전도 물성 최적화 전략을 제시했습니다.", "novelty": "기계적 변형과 STM 결합을 통해 깊은 밴드의 에너지를 조절하고, 그 결과가 갭 증대로 이어짐을 직접 시각화했다는 점이 독창적입니다.", "unresolved": "이러한 밴드 혼성 효과가 특정 도핑 수준에서만 유효한지, 혹은 다른 철 기반 초전도체에서도 보편적인지 확인이 필요합니다.", "future_work": "더 다양한 도핑 범위에서의 변형 실험과 이론적 밴드 혼성 계산을 통한 초전도 짝지음 강도 정량화.", "concepts": [{"term": "Quasiparticle Interference (QPI)", "why_emerged": "STM에서 불순물에 의한 산란 패턴을 분석하여 밴드 구조와 갭 정보를 얻기 위해 도입.", "origin": "Hoffman et al. (Science, 2002)", "connections": "Scanning Tunneling Spectroscopy, Superconducting gap, Band structure"}, {"term": "Band Hybridization", "why_emerged": "두 밴드가 만날 때 교차하지 않고 에너지를 나누어 가지며 새로운 성질을 나타내는 현상을 설명.", "origin": "고체 물리학의 기초 개념", "connections": "Kondo effect, Electronic structure engineering"}], "english_summary": ["Demonstrated that a deep-lying dz2 band can enhance superconducting pairing strength in Fe-based superconductors.", "Used STM-induced strain to shift the dz2 band and induce hybridization with pairing bands.", "Visualized evidence of enhanced superconducting gaps via quasiparticle interference (QPI) imaging.", "Established deep band hybridization as a viable route for optimizing superconducting performance."]}}, {"title": "Symmetry tuning topological states of the axion insulator candidate EuIn2As2 by its noncollinear magnetic order", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2505.22796", "authors": "S. X. M. Riberolles, A. M. Nedi\\'c, B. Kuthanazhi, et al.", "last_authors": "P. P. Orth, B. G. Ueland", "summary": "Topological properties of quantum materials are intimately related to symmetry. Here, we tune the magnetic order of the axion insulator candidate EuIn$_2$As$_2$ from its broken-helix ground state to the field-polarized phase by applying an in-plane magnetic field. Using results from neutron diffraction and magnetization measurements with ab inito theory and symmetry analysis, we assume a commensurate magnetic ground state and predict how th ce (2017) 등에서 2차 위상 절연체 개념으로 정립되었습니다.", "connections": "위상 절연체, 위상 상전이와 연결됩니다."}], "english_summary": ["EuIn2As2 is investigated as a field-tunable axion insulator candidate.", "Neutron diffraction and symmetry analysis predict hinge state evolution under magnetic field.", "Magnetic domain walls are identified as channels for chiral charge transport.", "Theoretical framework bridges noncollinear magnetic order with topological phase transitions."]}}, {"title": "Transducing quantum-spin-ice correlations into Weyl Fermi-arc transport at a synthetic Kondo lattice interface", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2610.12294", "authors": "Tsung-Chi Wu, Michael Terilli, Christian Zaprianov, et al.", "last_authors": "Lin Gu, Mikhail Kareev", "summary": "Quantum spin ice hosts collective excitations and quantum fluctuations that are largely electrically silent because the materials supporting them are insulating. Coupling this magnetic environment to surface-localized Weyl states offers a route to encode its correlations directly into Fermi-arc transport. Experimental access to this regime, however, has remained largely unexplored. Here, we realize a synthetic Kondo lattice interface between the Weyl semimetal $\\mathrm{Eu_2Ir_2O_7}$ and the quantum-spin-ice candidate $\\mathrm{Tb_2Ti_2O_7}$, and demonstrate that quantum-spin-ice correlations are imprinted on Weyl Fermi-arc transport. At ultra-low temperature, electronic transport evolves from a sixfold anisotropic response at low field into a twelvefold response over an intermediate field window, before entering a reentrant sixfold anisotropy at high field. No analogous twelvefold response occurs at the classical-spin-ice interface. The quantum--classical contrast shows that the same itinerant electronic channel acquires qualitatively different symmetry information when interacting with the quantum-fluctuating Tb moments, consistent with an interfacial coupling between the Weyl surf phson diode effect is a reliable indicator of the topological phase.", "Theoretical framework is provided for identifying topological transitions without spectroscopic complexity."]}}, {"title": "Spectroscopic signatures of a Kohn anomaly in a topological crystalline insulator", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/qg8k-y95s", "authors": "Jingwen Li, Arpita Dutta, Kush Saha, et al.", "last_authors": "Manfred Fiebig, Shovon Pal", "summary": "Topological crystalline insulators extend the concept of topological insulators by hosting surface states protected by crystallographic symmetry. Their topological phase transitions arise from spin-orbit-driven band inversion in the bulk electronic structure, reshaping the low-energy electronic envi…", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Relevant spectroscopic study of a topological material.", "tags": ["topological", "spectroscopy", "experimental"], "image": "", "briefing": {"background": "위상 결정 절연체(TCI)는 일반적인 위상 절연체와 달리 결정 대칭성에 의해 보호되는 위상 표면 상태를 가집니다. 전자-격자 결합은 이러한 물질의 위상 안정성에 영향을 줄 수 있어 중요한 연구 대상입니다.", "motivation": "TCI 물질 내에서 벌크 밴드 반전과 관련된 전자가 어떻게 격자 동역학(포논)과 상호작용하는지, 특히 '콘 변칙(Kohn anomaly)'을 통해 확인하고자 합니다.", "result": "분광학적 데이터를 통해 위상 결정 절연체의 위상 전이 과정에서 콘 변칙 신호를 관찰하였으며, 이는 전자-포논 결합이 위상적 성질을 변조할 수 있음을 나타냅니다.", "implication": "TCI의 위상적 특징이 격자 구조와 밀접하게 결합되어 있음을 입증하며, 향후 TCI 물질의 위상성을 격자 변형을 통해 제어할 수 있는 가능성을 보여줍니다.", "novelty": "위상 결정 절연체의 위상 물성을 격자 진동(포논) 관점에서 해석하여 전자-포논 결합의 역할을 직접적으로 밝혀냈습니다.", "unresolved": "관찰된 콘 변칙이 위상 전이의 직접적인 원인인지, 아니면 전이 과정에서 나타나는 부수적인 효과인지에 대한 엄밀한 구분은 추가 연구가 필요합니다.", "future_work": "초고속 분광학을 이용한 시간 분해 포논 측정이나 압력 변화에 따른 TCI의 격자 동역학 연구가 이어질 것으로 보입니다.", "concepts": [{"term": "Kohn Anomaly", "why_emerged": "금속의 페르미 표면 특성이 포논 스펙트럼의 특정 모드에서 이상 현상을 일으키는 것을 기술하기 위해 필요.", "origin": "Walter Kohn (1959).", "connections": "Peierls 불안정성, 전하 밀도 파(CDW), 전자-포논 상호작용과 연결됨."}, {"term": "Topological Crystalline Insulator", "why_emerged": "결정 대칭성에 의해 위상이 보호되  Jin, K. Watanabe, T. Taniguchi, et al.", "last_authors": "G. Fève, G. C. Ménard, O. Maillet, and F. D. Parmentier", "summary": "Heat flow in the Chern Insulator states of the Hofstadter butterfly is obtained in a graphene/hBN moiré for the first time.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Quantized heat flow in moiré graphene, relevant to topological transport.", "tags": ["material", "graphene", "moire", "topological", "transport"], "image": "", "briefing": {"background": "모아레 격자 시스템은 전자 간의 강한 상호작용과 위상적 띠 구조를 동시에 조절할 수 있는 이상적인 실험실입니다. Hofstadter 버터플라이 구조는 자기장 하에서의 위상적 상태를 잘 보여줍니다.", "motivation": "모아레 시스템에서 나타나는 Chern 절연체 상태에서 열 수송(Heat flow) 현상이 양자화되어 나타나는지 확인하고자 합니다.", "result": "그래핀/hBN 모아레 구조에서 Hofstadter 버터플라이를 구현하고, Chern 절연체 상태에서의 열 수송 양자화 현상을 최초로 측정했습니다.", "implication": "위상적 상태에서 전하뿐만 아니라 열(에너지) 또한 양자화된 수송 채널을 가짐을 입증하여, 위상적 열전소자나 양자 정보 처리의 기반을 마련했습니다.", "novelty": "전기적 수송을 넘어 열 수송 분야에서도 모아레 시스템이 위상 물리학의 핵심임을 실험적으로 증명했습니다.", "unresolved": "양자화된 열 수송이 아주 낮은 온도 환경에서 어떤 유체역학적 혹은 다체 효과와 얽히는지에 대한 세밀한 분석이 부족합니다.", "future_work": "더 넓은 온도 범위에서의 열 수송 측정 및 다양한 꼬임각을 가진 모아레 시스템에서의 위상적 특성 조사.", "concepts": [{"term": "Hofstadter Butterfly", "why_emerged": "강한 자기장 하에서 격자 구조를 가진 전자 에너지 스펙트럼이 프랙탈 구조를 가짐을 설명.", "origin": "Douglas Hofstadter, 1976", "connections": "Quantum Hall Effect, Moiré superlattices"}, {"term": "Quantized Heat Flow", "why_emerged": "전하 수송을 넘어 위상적 상태의 정보를 에너지 수송으로 읽어내기 위해 필요.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "Thermal Hall Effect, Chern Insulator"}], "english_summary": ["Reports the first observation of quantized heat flow in the Chern insulator states of a Hofstadter butterfly.", "Utilizes a graphene/hBN moiré superlattice as the experimental platform.", "Demonstrates that topological states can be probed via quantized heat transport.", "Provides experimental insight into the interplay between moiré physics and topological energy transport."]}}, {"title": "Role of the Apical Oxygen in Cuprate High-Temperature Supercon als", "journal": "PRL_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/3p2x-yjyd", "authors": "O. Schweizer, V. Gali, A. Y. Chaou, G. Lemut, P. W. Brouwer, and M. Breitkreiz", "last_authors": "A. Y. Chaou, G. Lemut, P. W. Brouwer, and M. Breitkreiz", "summary": "Bulk–boundary correspondence guarantees the presence of robust, anomalous states on the boundary of topological matter. The edges of a two-dimensional Chern insulator harbor one-dimensional chiral states, which have a conductance n e 2 / h , where n is an integer that is solely determined by the bulk. In this Letter we show that step edges on the surface of three-dimensional topological metals have a robust conductance K e 2 / h , where K is also fixed by the bulk and assumes noninteger values. We explain this prediction on the basis of the topology of gapless systems, exemplify it on a lattice model, and connect to recent experimental observations of enhanced density of states at step edges in topological metals.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Relevant transport and boundary state physics in topological materials.", "tags": ["Chern", "topological", "transport"], "image": "", "briefing": {"background": "위상 절연체나 위상 금속과 같은 위상 물질은 벌크-경계 대응(Bulk-Boundary Correspondence) 원리에 의해 경계면에서 독특한 전도 특성을 보입니다.", "motivation": "기존 2D Chern 절연체 경계의 정수 값 전도도와 달리, 3D 위상 금속 표면의 스텝 엣지(step edge)에서 나타나는 특이한 전도 현상을 이론적으로 규명하고자 합니다.", "result": "3D 위상 금속의 스텝 엣지가 벌크 위상 인자에 의해 결정되는 강건한 전도도 K(정수가 아닐 수 있음)를 가짐을 증명했습니다.", "implication": "위상 물질의 표면 굴곡이나 스텝 엣지가 단순한 결함이 아니라, 벌크 위상에 의해 보호되는 예측 가능한 전도 경로로 작동할 수 있음을 제시합니다.", "novelty": "기존의 정수 양자화된 전도도 개념을 비정수적(noninteger) 위상 전도도로 확장했다는 점이 이론적으로 매우 새로운 관점입니다.", "unresolved": "이러한 비정수 전도도 K가 실제 실험 환경에서의 무질서(disorder)나 표면 산란에 의해 얼마나 영향을 받는지는 더 연구되어야 합니다.", "future_work": "다양한 위상 금속 박막 시편을 이용한 저온 수송 측정(transport measurement)을 통해 이론적 예측값을 실험적으로 검증하는 과정이 예상됩니다.", "concepts": [{"term": "Bulk-Boundary Correspondence", "why_emerged": "위상 불변량(bulk invariant)과 경계의 에너지 상태 간의 관계를 체계화하기 위해 정립되었습니다.", "origin": "Hatsugai 등이 초기 연구를 주도했습니다.", "connections": "위상 절연체, 양자 홀 효과, Weyl 반금속 등 모든 위상 물질 물리학의 근간입니다."}, {"term": "Chern Insulator", "why_emerged": "자기장 없이도 위상적 성질을 구현할 수 있는 물질 시스템으로 제안되었습니다.", "origin": "Haldane이 1988년에 제안했습니다.", "connections": "양자 변칙 홀 효과(QAHE) 및 위상 금속 연구와 직결됩니다."}], "english_summary": ["Theory of anomalous conductance at step edges in 3D topological metals.", "Predicts noninteger quantized conductance fixed by bulk topology.", "Bridges theoretical framework with recent experiments on surface density of states."]}}, {"title": "Switching between Spin and Orbital Hall Currents in a Single System via Ferrovalley Order", "journal": "PRL_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/8rnn-n6tq", "authors": "Zhikuan Wang, Wei Tan, Bin Cui, Zeyu Jiang, Bing Huang", "last_authors": "Zeyu Jiang, Bing Huang", "summary": "The spin Hall and orbital Hall effects are fundamental mechanisms for generating transverse spin and orbital currents. However, their intrinsic entanglement via spin-orbit coupling (SOC) has made the generation of pure spin or orbital Hall current a long-standing challenge. Here, we demonstrate a st…", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Spin and orbital Hall effects, highly relevant to transport and spin-orbit coupling.", "tags": ["topic", "Hall_effect", "spintronics", "spin-orbit_coupling"], "image": "", "briefing": {"background": "스핀 홀 효과(SHE)와 궤도 홀 효과(OHE)는 스핀-궤도 결합(SOC)을 통해 전하 전류를 횡방향의 스핀 혹은 궤도 전류로 변환하는 스핀트로닉스의 핵심 현상입니다. 기존의 물질에서는 SOC로 인해 스핀과 궤도 자유도가 강하게 얽혀 있어, 순수한 스핀 혹은 궤도 전류만을 독립적으로 제어하기가 매우 어렵습니다.", "motivation": "본 연구는 외부 자극이나 내부 질서 변수를 통해 스핀 홀 전류와 궤도 홀 전류 사이의 스위칭을 제어할 수 있는 메커니즘을 탐구하고자 합니다.", "result": "강유전 밸리(Ferrovalley) 질서를 도입함으로써 단일 시스템 내에서 스핀 홀 전류와 궤도 홀 전류 간의 전환이 가능함을 이론적으로 증명했습니다.", "implication": "이 결과는 외부 전기장 등으로 밸리 자유도를 제어하여, 정보 저장 및 처리의 효율을 높일 수 있는 새로운 유형의 밸리트로닉 및 스핀트로닉 소자 설계의 가능성을 제시합니다.", "novelty": "SOC의 강한 얽힘을 극복하고 위상학적 질서(강유전 밸리 ooper problem for two electrons in the first conduction band of the Wigner crystal. Unlike conventional phonon-mediated pairing, the collective mode (boson) energies and single-particle (fermion) dispersion are comparable scales controlled by the electron density, leaving no small parameter for an adiabatic expansion. Moreover, because the magnetic Wigner crystal is not time-reversal invariant, the usual Cooper logarithmic divergence in the pairing susceptibility is absent, so the attraction must exceed a finite threshold for pairing to occur. These unusual features motivate a numerical experiment to see whether the crystal's own vibrations can bind electrons. We obtain the crystalline ground state and its collective mode spectrum within Hartree--Fock and time-dependent Hartree--Fock approximation, and derive the electron--phonon Hamiltonian using the quasiboson approximation. Solving the resulting two-electron problem, we find that phonon-mediated attraction exceeds the pairing threshold, with chiral $p$-wave pairing as the leading instability. Within these approximations, we show that collective modes of a Wigner crystal can indeed favor chiral pairing despite broken time-reversal symmetry. Our results provide an encouraging starting point for developing a full many-body theory to study electronic crystallization and superconductivity.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Theoretical mechanism for pairing in hexalayer graphene, directly motivated by recent STM imaging.", "tags": ["theory", "graphene", "superconductivity", "STM"], "image": "https://arxiv.org/html/2610.10710v1/fig1_bands.png", "briefing": {"background": "자동 브리핑을 생성하지 못했습니다. 초록과 원문 링크를 기준으로 빠르게 확인하세요.", "motivation": "초록 정보만으로는 분야 내부의 구체적 동기를 안정적으로 요약하기 어렵습니다.", "result": "Recent scanning tunneling microscopy has directly imaged electronic crystals in rhombohedral hexalayer graphene, and magnetotransport measurements suggest that superconductivity and charge-density-wave order em
