<title>Daily Paper Slideshow</title>
<style>
  :root {
    color-scheme: light;
    --bg: #f6f7f4;
    --paper: #ffffff;
    --ink: #111827;
    --muted: #64748b;
    --line: #d8ddd2;
    --accent: #176b87;
    --accent-2: #9a3412;
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; overflow: auto; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: var(--bg); color: var(--ink); }
  .shell { max-width: 1500px; min-height: 100vh; margin: 0 auto; padding: 14px 18px; display: flex; flex-direction: column; }
  .topbar { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 16px; }
  .top-actions { display: flex; align-items: center; gap: 10px; }
  .topbar a, button { border: 1px solid var(--line); border-radius: 8px; background: var(--paper); color: var(--ink); padding: 10px 14px; font-weight: 700; text-decoration: none; cursor: pointer; }
  button.primary { background: var(--accent); border-color: var(--accent); color: white; }
  button:disabled { opacity: 0.45; cursor: not-allowed; }
  .counter { color: var(--muted); font-weight: 700; }
  .slide { min-height: calc(100vh - 82px); background: var(--paper); border: 1px solid var(--line); border-radius: 10px; padding: 18px; box-shadow: 0 18px 42px rgba(15, 23, 42, 0.10); display: grid; grid-template-columns: minmax(310px, 0.86fr) minmax(0, 1.55fr); gap: 18px; overflow: visible; }
  .paper-head { min-width: 0; min-height: 0; overflow: visible; display: flex; flex-direction: column; gap: 12px; }
  .figure { margin: 0; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: #f8fafc; }
  .figure img { display: block; width: 100%; max-height: 41vh; object-fit: contain; background: white; }
  .figure figcaption { padding: 7px 10px; color: var(--muted); font-size: 12px; line-height: 1.3; }
  .head-text { display: flex; flex-direction: column; gap: 9px; min-width: 0; }
  .badges { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .badge { border-radius: 999px; padding: 5px 9px; background: #eef2ff; color: #3730a3; font-size: 12px; font-weight: 800; }
  .score { background: #fee2e2; color: #991b1b; }
  h1 { margin: 0; font-size: 25px; line-height: 1.15; letter-spacing: 0; overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
  h1 a { color: inherit; text-decoration-color: rgba(23, 107, 135, 0.35); text-decoration-thickness: 2px; text-underline-offset: 4px; }
  h1 a:hover { color: var(--accent); text-decoration-color: var(--accent); }
  .meta, .authors, .why, .abstract { font-size: 13px; line-height: 1.45; }
  .meta, .authors { color: var(--muted); }
  .why strong, .abstract strong, .authors strong { color: var(--ink); }
  .authors { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .why { border-left: 4px solid var(--accent-2); padding-left: 10px; color: #374151; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .abstract { border-top: 1px solid var(--line); padding-top: 14px; color: #374151; }
  .original-abstract { border-top: 1px solid var(--line); padding-top: 10px; color: #374151; font-size: 11.5px; line-height: 1.35; overflow-wrap: anywhere; }
  .original-abstract strong { display: block; margin-bottom: 4px; color: var(--ink); }
  .tags { display: flex; flex-wrap: wrap; gap: 8px; }
  .tag { border-radius: 999px; padding: 4px 8px; background: #f1f5f9; color: #475569; font-size: 12px; font-weight: 700; }
  .head-text > .link { display: none; }
  .briefing { min-width: 0; min-height: 0; overflow: visible; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); grid-auto-rows: minmax(0, auto); align-content: start; gap: 11px 18px; border-top: 0; padding-top: 0; }
  .brief-section { min-width: 0; }
  .brief-section.wide { grid-column: 1 / -1; }
  .brief-section h2 { margin: 0 0 4px; font-size: 14px; line-height: 1.22; color: #0f766e; letter-spacing: 0; }
  .brief-section p, .brief-section li { margin: 0; font-size: 12.5px; line-height: 1.42; color: #1f2937; overflow-wrap: anywhere; }
  .brief-section ul { margin: 0; padding-left: 20px; }
  .concepts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 9px 14px; }
  .concept { border-top: 1px solid var(--line); padding-top: 7px; }
  .concept h3 { margin: 0 0 4px; font-size: 13px; color: #7c2d12; letter-spacing: 0; }
  .concept p { margin: 2px 0 0; font-size: 11.5px; line-height: 1.35; color: #374151; overflow-wrap: anywhere; }
  .concept b { color: #111827; }
  .link { color: var(--accent); font-weight: 800; text-decoration: none; }
  .empty { padding: 48px; background: var(--paper); border: 1px solid var(--line); border-radius: 12px; color: var(--muted); }
  @media (max-width: 860px) {
    .shell { padding: 14px; }
    .topbar, .top-actions { align-items: stretch; flex-direction: column; }
    .slide, .briefing, .concepts { grid-template-columns: 1fr; }
    .slide { min-height: auto; overflow: visible; display: grid; }
    h1 { font-size: 28px; }
  }
</style>

const slides = [{"title": "c-axis strain tuning of superconductivity and symmetric elastoresistivity in CsV3Sb5", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/l499-9f6c", "authors": "Xiaoran Yang, Yutong Li, Chunyi Li, et al.", "last_authors": "Huiqiu Yuan, Xingye Lu", "summary": "The kagome metal ${\\mathrm{CsV}}_{3}{\\mathrm{Sb}}_{5}$ hosts an intriguing interplay between charge-density-wave (CDW) order and superconductivity that is highly sensitive to lattice distortions. However, determining the specific roles of the in-plane $({A}_{1g,1})$ and out-of-plane $({A}_{1g,2})$ s…", "tier": "A_MUST_READ", "score": "10", "reason": "Direct hit on core project material (CsV3Sb5) and the interplay of CDW and superconductivity.", "tags": ["material", "kagome", "CDW", "superconductivity"], "image": "", "briefing": {"background": "Kagome 금속 AV3Sb5(A = K, Rb, Cs) 계열은 전하 밀도 파(CDW), 초전도성, 그리고 위상학적 특성이 얽혀 있어 응집물질 물리학의 핵심 연구 대상입니다. 특히 이들 물질의 물리적 상태는 격자 변형(strain)에 매우 민감하게 반응하여, 외부 응력을 통한 물성 조절이 활발히 연구되고 있습니다.", "motivation": "기존 연구들은 주로 면내(in-plane) 변형의 효과에 집중해 왔으나, 이 논문은 c-축 방향의 대칭적 변형(A1g,2)이 초전도성과 전하 수송 특성(탄성 저항)에 미치는 구체적인 역할을 규명하고자 했습니다.", "result": "c-축 변형을 정밀하게 제어하여 CsV3Sb5의 초전도 전이 온도를 튜닝할 수 있음을 보였으며, 대칭적 탄성 저항(symmetric elastoresistivity) 측정을 통해 격자와 오비탈 간의 강한 결합을 확인했습니다. 특히 CDW 상태와 초전도성 사이의 경쟁 또는 공존 메커니즘에서 c-축 격자 상수의 중요성을 입증했습니다.", "implication": "본 연구의 결과는 Kagome 격자 시스템에서 3차원적 격자 제어가 전자 상관 관계를 조절하는 강력한 수단이 될 수 있음을 시사하며, 초전도 메커니즘 내에서의 수직 방향 결합의 역할을 강조합니다.", "novelty": "구독자의 주요 관심사인 CsV3Sb5 물질에 대해 c-축 strain tuning이라는 차별화된 접근법을 사용했습니다. 이는 단순한 물성 측정을 넘어 대칭성에 기반한 탄성 저항 분석을 통해 전자 구조의 변화를 추론했다는 점에서 가치가 큽니다.", "unresolved": "c-축 변형이 CDW의 위상(phase)이나 구체적인 대칭성 파괴 패턴에 미치는 미시적인 영향에 대해서는 추가적인 회절 실험이 필요해 보입니다.", "future_work": "가압 ARPES나 변형 하에서의 STM 측정을 통해, 본 연구에서 관찰된 수송 특성의 변화가 실제 전자 구조(Fermi surface warping 등)와 어떻게 직결되는지 시각화하는 연구가 기대됩니다.", "concepts": [{"term": "Kagome Metal", "why_emerged": "기하학적 좌절(frustration)과 flat band, Dirac cone이 공존하는 특이한 전자 구조를 탐구하기 위해 등장했습니다.", "origin": "1951년 Itiro Syôzi가 통계역학 모델로 제안한 격자 구조에서 유래했습니다.", "connections": "AV3Sb5 계열, 양자 스핀 액체, 위상 절연체."}, {"term": "Elastoresistivity", "why_emerged": "격자 변형에 따른 저항 변화를 통해 물질의 전자적 네마틱(nematic) 대칭성이나 상전이 민감도를 측정하기 위해 도입되었습니다.", "origin": "금속 및 반도체의 압전 저항 효과 연구에서 발전했습니다.", "connections": "전자적 네마틱성, 스트레인 튜닝, 초전도 전구 현상."}, {"term": "Charge Density Wave (CDW)", "why_emerged": "저차원 금속에서 전자-격자 결합이나 전자 간 상호작용으로 인해 전하 밀도가 주기적으로 변조되는 현상을 설명하기 위해 등장했습니다.", "origin": "Rudolf Peierls가 1-D 금속의 불안정성을 이론적으로 제시했습니다.", "connections": "Peierls instability, 초전도와의 경쟁 관계, NbSe2."}, {"term": "A1g symmetry strain", "why_emerged": "물질의 원래 대칭성을 깨지 않으면서 격자의 부피나 축 비율만을 변화시켜 순수한 압축/인장 효과를 보기 위해 정의되었습니다.", "origin": "결정학적 군론(Group Theory)에 기반합니다.", "connections": "Hydrostatic pressure, 격자 열팽창, Symmetric strain tuning."}], "english_summary": ["Investigated the effects of c-axis symmetric strain on the superconductivity of CsV3Sb5.", "Demonstrated precise tuning of Tc and electronic transport via out-of-plane lattice distortion.", "Analyzed symmetric elastoresistivity to reveal strong coupling between the lattice and electronic orders.", "Provides key insights into the 3D nature of the kagome metal's phase diagram."]}}, {"title": "Hydrogen-induced modification of the local charge density in MnSb2Te4", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2611.04649", "authors": "Kyriaki Samioti, Weiyan Qi, Stefano Ponzoni, et al.", "last_authors": "Evangelos Papalazarou, Marino Marsi", "summary": "We investigate the effects of ionic hydrogen (H$^+$) intake on the occupied and unoccupied states of MnSb$_2$Te$_4$, a van der Waals magnetic material. Using angle-resolved photoemission spectroscopy (ARPES) and time-resolved ARPES, combined with resonant and core level photoemission, we reveal that hydrogen binds near specific lattice sites, locally redistributing charge density and reshaping the valence band spectral weight. While the band gap an ssion Spectroscopy (HAXPES) to probe depth-dependent electronic states of Fe3O4.", "Investigated the changes in electronic structure across the Verwey transition temperature (Tv ~ 125K).", "Characterized how the charge-ordered insulating state evolves from the surface into the bulk.", "Highlighted the importance of bulk sensitivity in understanding the classic metal-insulator transition in magnetite."]}}, {"title": "Graphene lattice recoil in hard x-ray photoemission: Experiment and theory", "journal": "PRB_Recent", "source": "keyword", "link": "http://link.aps.org/doi/10.1103/s8w3-plc1", "authors": "Simone Ritarossi, Alice Apponi, Orlando Castellano, et al.", "last_authors": "Francesco Offi, Alessandro Ruocco", "summary": "Hard-x-ray C 1 s photoemission from monolayer graphene probes a regime in which nuclear recoil and intrinsic electronic asymmetry contribute on comparable energy scales to the observed spectral line shape. Here we combine experiment and modeling over the photon-energy range 0.8 – 8 keV to resolve this interplay quantitatively. A graphene-specific implementation of the Fujikawa-Takata cumulant formalism, based on an anisotropic vibrational density of states constrained by first-principles phonon calculations, captures the expected recoil scaling with photon energy and emission geometry but fails to reproduce the pronounced asymmetric tails of the measured spectra. To overcome this limitation, we introduce an explicit electronic convolution model in which a photon-energy-independent reference response, dominated by the electronic line shape and extracted from the low-recoil 0.8 keV data through a recoil-inclusive fit, is convolved with a phonon recoil kernel carrying the full dependence on photon energy and emission angle. This approach reproduces both the measured line-shape evolution and the observed peak shifts across the explored energy range without refitting the spectra at higher photon energies. The results show that recoil in graphene canno "Lifshitz (1960).", "connections": "양자 임계 현상, 전자 상관관계."}], "english_summary": ["Investigates Fermi surface tuning in Weyl semimetal MoTe2 via Nb doping.", "Demonstrates that chemical potential shifts induce Lifshitz transitions in the electronic structure.", "Combines ARPES and ab initio calculations to map the evolution of Weyl states.", "Confirms the effectiveness of chemical doping as a tool for engineering topological phases."]}}, {"title": "Chiral altermagnon in MnTe", "journal": "Science", "source": "Gemini", "link": "https://www.science.org/doi/abs/10.1126/science.adv3196?af=R", "authors": "Daniel Jost, Resham Babu Regmi, Eder G. Lomeli, et al.", "last_authors": "Stephan Geprägs, Matthias F. Kling", "summary": "Altermagnetism has been recognized as a magnetic phase that bridges the properties of ferro- and antiferromagnetism. The momentum-dependent spin splitting observed in these materials reflects their distinctive symmetry characteristics, which also establish the conditions for chiral magnons to emerge. Here we provide direct experimental evidence for a chiral magnon in the altermagnetic candidate manganese telluride (MnTe) revealed by circular-dichroism resonant inelastic x-ray scattering. This mode, which we term chiral altermagnon, exhibits a distinct momentum dependence of its spin polarization consistent with the altermagnetic g -wave symmetry of MnTe. Our polarization-resolved data corroborate the existence of a discrete class of magnetic excitations, demonstrating how altermagnetic order shapes spin dynamics and paving the way for advances in spintronic and quantum technologies.", "tier": "B_IMPORTANT_CONDMAT", "score": "9", "reason": "Investigates chiral altermagnons in MnTe, directly relevant to altermagnetism and magnetic materials.; demoted from A: broad CM, not direct user/project hit", "tags": ["altermagnetism", "magnons", "magneticmaterials", "MnTe"], "image": "", "briefing": {"background": "자석의 스핀 구조와 대칭성을 이해하는 것은 응집물질물리에서 핵심입니다. 최근 등장한 '알터자성(Altermagnetism)'은 기존의 강자성(Ferromagnetism)과 반강자성(Antiferromagnetism)의 경계를 허무는 새로운 자기 질서 상태로, 운동량 의존적 스핀 분할이 특징입니다.", "motivation": "MnTe와 같은 알터자성 후보 물질에서 이론적으로 예측된 chiral magnon(카이랄 마그논)이 실제로 존재하는지, 그리고 이것이 물질의 g-wave 대칭성과 어떻게 연결되는지 실험적으로 증명하고자 했습니다.", "result": "Circular-dichroism RIXS 기법을 통해 MnTe에서 카이랄 알터마그논 모드를 발견했습니다. 이 마그논의 스핀 편극은 MnTe의 알터자성 g-wave 대칭성과 일치하는 운동량 의존성을 보입니다.", "implication": "알터자성 질서가 물질의 스핀 동역학을 어떻게 지배하는지 명확히 보여주며, 향후 스핀트로닉스 및 양자 정보 소자 개발의 새로운 토대를 제공합니다.", "novelty": "기존의 강/반강자성과는 구별되는 새로운 자기 여기(magnetic excitation) 상태를 직접 관측했으며, 특히 RIXS를 이용한 카이랄 마그논 탐지는 알터자성 연구의 중요한 이정표가 될 것입니다.", "unresolved": "이러한 카이랄 마그논이 실제 소자 환경에서도 동일한 특성을 유지할 수 있는지, 그리고 다른 알터자성 물질에서도 보편적으로 나타나는지에 대한 추가 연구가 필요합니다.", "future_work": "다른 알터자성 후보 물질들에 대한 RIXS 연구 확대 및 이를 이용한 스핀 전류 제어 소자 설계가 기대됩니다.", "concepts": [{"term": "알터자성", "why_emerged": "기존의 자성 분류로 설명되지 않는, 반강자성처럼 순자화는 없지만 결정 대칭성에 의해 운동량에 따라 스핀이 갈라지는 상태를 기술하기 위해 필요.", "origin": "최근 5년 이내 이론적으로 정립, 선도 그룹으로는 Jungwirth 등.", "connections": "반강자성, 스핀트로닉스, 베리 곡률."}, {"term": "카이랄 마그논", "why_emerged": "알터자성 물질의 결정 대칭성으로 인해 마그논 자체가 카이랄한 스핀 편극을 가질 것으로 예측됨.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "마그논, 카이랄성, 알터자성."}, {"term": "RIXS", "why_emerged": "물질의 전자 구조와 자기적 여기를 에너지와 운동량 공간에서 동시에 조사하기 위해 필요.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "ARPES, 중성자 산란."}], "english_summary": ["Discovery of chiral altermagnons in MnTe using CD-RIXS.", "The observed magnon momentum dependence matches the altermagnetic g-wave symmetry.", "Provides direct evidence of spin-polarized magnetic excitations in altermagnets.", "Advances the understanding of spin dynamics in non-collinear or unconventional magnetic systems."]}}, {"title": "Coexisting Kondo and Weyl-like transport in kagome heavy-fermion metal, YbyCo3Ge3-xSnx", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2611.03822", "authors": "M. P. Dubbelman, R. Meduri, T. M. Kyrk, Z. Cheng, P. Maderson, D. Pizzirani, et al.", "last_authors": "M. E. Kamminga, S. Wiedmann, J. Y. Chan, M. N. Ali", "summary": "Strong electron correlations and topology offer complementary routes to controlling electrical conduction, as correlations can make electrons heavy (e.g. Kondo lattices) whereas topology can make them behave as massless particles (e.g. Dirac or Weyl systems), and having both in one material is rare. In Kondo lattice systems, Kondo hybridization between localized 4$f$ and conduction electrons strongly enhances the quasiparticle mass, where in Weyl-Kondo systems these Kondo-renormalized bands form Weyl states, and simultaneous signs of both Kondo and Weyl states in one material have not been observed in transport. Here we report signs of both in the kagome metal \\ce{Yb_yCo3Ge_{3-x}Sn_x} by combining magnetotransport, heat capacity, magnetization, angle-resolved and X-ray photoemission spectroscopy, and DFT+U calculations to reveal Yb-dependent Kondo scattering developing into lattice coherence, with extrapolated Sommerfeld coefficient of approximately 2 ~Jmol$_{\\mathrm{Yb}}^{-1}$K$^{-2}$. Transverse magnetoresistance (MR) follows single-ion Kondo scaling, whereas longitudinal transport contains an additional negative response proportional to B$^2$ and remains unsaturated up to 32 T, consistent with a chiral anomaly. These findings support a picture of Kondo and Weyl-like conduction arising from distinct electronic states without external Fermi-level tuning, suggesting a possible route to combining correlated and topological functionality in a bulk material.", "tier": "B_IMPORTANT_CONDMAT", "score": "9", "reason": "Direct relevance to kagome metals, topology, and ARPES/spectroscopy in correlated systems.", "tags": ["kagome", "ARPES", "Weyl", "correlated"], "image": "https://arxiv.org/html/2611.03822v1/fig1.png", "briefing": {"background": "강한 전자 상관관계(Heavy fermion)와 위상적 성질(Weyl semimetal)은 각각 좁은 밴드와 질량 없는 입자라는 독특한 물성을 만듭니다. 이 두 가지를 한 물질에서 동시에 구현하는 것은 응집물질물리의 중요한 도전 과제입니다.", "motivation": "카고메 구조를 가진 Yb 기반 물질에서 4f 전자와 전도 전자의 혼성화로 발생하는 콘도 효과와, 위상적 비자명성에 의한 Weyl 물리 현상이 공존하는지 규명하고자 했습니다.", "result": "YbyCo3Ge3-xSnx에서 콘도 격자 코히런스와 Weyl 물성(카이랄 이상에 기인한 음의 자기저항 등)의 징후를 동시에 관측했습니다. 이 현상은 외적 튜닝 없이 내부 상태에서 기인합니다.", "implication": "강상관 전자계와 위상적 물성을 하나의 벌크 물질에서 제어할 수 있는 새로운 가능성을 제시하며, 향후 퀀텀 물질 설계의 새로운 방향성을 보여줍니다.", "novelty": "콘도 물성과 Weyl-like 물성이 독립적인 전자 상태에서 기원함을 보였으며, 이는 카고메 금속에서 상관관계와 위상이 공존하는 흔치 않은 사례입니다.", "unresolved": "두 상태가 서로 어떤 상호작용을 하는지, 구체적으로 어떤 밴드 구조가 이를 뒷받침하는지에 대한 미시적 분석이 보완되어야 합니다.", "future_work": "ARPES를 통한 밴드 구조의 직접적인 위상 성질 검증과 더불어, 저온에서의 초전도성 발현 가능성에 대한 연구가 뒤따를 것입니다.", "concepts": [{"term": "콘도 격자", "why_emerged": "국소 자기 모멘트가 전도 전자와 상호작용하여 무거운 준입자를 형성하는 현상을 설명하기 위해 필요.", "origin": "Kondo (1964).", "connections": "중페르미온(Heavy Fermion), 비전통 초전도체."}, {"term": "카고메 금속", "why_emerged": "기하학적 좌절(frustration)과 밴드 평탄화(flat band)를 통해 상관관계와 위상적 성질을 유도하기 위해 필요.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "AV3Sb5, 위상 자성, 벌집 격자."}, {"term": "카이랄 이상(Chiral anomaly)", "why_emerged": "Weyl 반금속에서 자기장이 존재할 때 전하 흐름이 비정상적으로 유지되는 현상을 설명하기 위해 필요.", "origin": "입자 물리학에서 도입, 응집물질물리에서는 Weyl semimetal 연구와 함께 도입됨.", "connections": "Weyl 반금속, 음의 자기저항."}], "english_summary": ["Coexistence of Kondo lattice behavior and Weyl physics in a kagome metal.", "Magnetotransport shows chiral anomaly signatures alongside heavy-fermion properties.", "Kondo and Weyl states arise from distinct electronic sub-systems.", "Establishes a new platform for combining correlated electron systems with topological phases."]}}, {"title": "Constraining the Superconducting Gap of Monolayer FeSe/SrTiO3 via Statistical Analysis and Tip-Height-Dependent Tunneling Spectroscopy", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2611.03978", "authors": "Dongwon Shin, Xiyou Peng, Kaleb McClure, et al.", "last_authors": "Hanno H. Weitering, Wonhee Ko", "summary": "Monolayer FeSe grown on SrTiO$_3$ (001) exemplifies interface-enhanced superconductivity, exhibiting a transition temperature nearly ten times that of bulk FeSe. Yet, its tunneling spectra lack clearly identifiable superconducting coherence peaks, preventing an unambiguous determination of the gap magnitude. Here, we use ultralow-temperature scanning tunneling spectroscopy as a function of temperature, tip-sample separation, and lateral position to disentangle tunneling contributions by statistical analysis. Decay rates extracted by regression of tip-height-dependent spectroscopy reveal three energy regimes: Andreev-reflection-dominated tunneling below 6 meV, mixed Andreev and quasiparticle tunneling between 6 and 13 meV, and predominantly quasiparticle tunneling above 13 meV. Spatially resolved spectroscopy and correlation analysis further reveal that the tunneling conductance is predominantly localized near defects below 6 meV but becomes spatially extended at higher energies. Together, these results constrain the superconducting gap to lie between 6 and 13 meV. Our findings establish statistical analysis of spectroscopy as a powerful approach to constraining superconducting gap structures when complex spectral features prevent the unambiguous identification of coherence peaks.", "tier": "B_IMPORTANT_CONDMAT", "score": "9", "reason": "Directly relevant STM/STS studies on high-Tc iron-based superconductor monolayers.; demoted from A: broad CM, not direct user/project hit", "tags": ["STM", "superconductivity", "FeSe"], "image": "https://arxiv.org/static/browse/0.3.4/images/arxiv-logo-fb.png", "briefing": {"background": "단층 FeSe/SrTiO3는 벌크에 비해 월등히 높은 초전도 전이 온도(Tc)를 가져 철 기반 초전도체 연구의 핵심 주제입니다. 하지만 STS(주사 터널링 분광) 데이터에서 명확한 결맞음 피크가 보이지 않아 초전도 갭의 크기를 확정하는 데 어려움이 있었습니다.", "motivation": "STS에서 발생하는 다양한 층간 상호작용과 불균일성을 통계적으로 처리하여, 초전도 갭의 크기를 정확히 규명하고자 했습니다.", "result": "통계적 분석과 팁 높이 의존 STS를 사용하여, 낮은 에너지에서의 Andreev 반사와 높은 에너지에서의 준입자 터널링 기여를 분리했습니다. 이를 통해 초전도 갭이 6~13 meV 사이에 있음을 확인했습니다.", "implication": "STS 분석의 신뢰도를 높이는 방법론을 제시하였으며, 고온 초전도체의 로컬한 특성과 벌크 특성을 구분하는 중요한 도구가 될 것입니다.", "novelty": "통계적 회귀 분석을 통해 복잡한 분광 피크 뒤에 숨겨진 갭 정보를 정밀하게 추출했다는 점에서 기법적 우수성이 돋보입니다.", "unresolved": "여전히 데이터가 국소적인 결함(defects)에 의해 영향을 받는 부분이 있으며, 갭의 공간적 불균일성에 대한 완전한 원인 규명은 더 필요합니다.", "future_work": "더 다양한 계면 조건이나 도핑 상태에서의 정밀 분석을 통해 갭의 온도 의존성 및 초전도 메커니즘을 규명하는 실험이 필요합니다.", "concepts": [{"term": "Andreev 반사", "why_emerged": "초전도체와 금속 경계에서 전자-정공 전환 과정을 이해하기 위해 필요.", "origin": "Andreev (1964).", "connections": "초전도 터널링, 결맞음 피크."}, {"term": "STS (주사 터널링 분광)", "why_emerged": "나노미터 규모에서 전자 상태 밀도(DOS)를 직접 측정하기 위해 필요.", "origin": "Binnig & Rohrer (1982).", "connections": "STM, 초전도 갭."}], "english_summary": ["Constrains the superconducting gap of monolayer FeSe/SrTiO3 to 6-13 meV.", "Utilizes statistical analysis of tip-height-dependent STS to separate tunneling regimes.", "Resolves ambiguity in spectral interpretation due to defect-induced local variations.", "Provides a robust methodology for determining gap sizes in complex interface superconductors."]}}, {"title": "Evidence for a Dirac Spin Liquid in the Kagome Heisenberg Antiferromagnet from High-Precision Neural-Network Quantum States", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2611.05174", "authors": "Zheng-Hang Sun, Christopher Roth, Ao Chen, Markus Heyl", "last_authors": "Ao Chen, Markus Heyl", "summary": "The spin-1/2 kagome Heisenberg antiferromagnet is a central model in the study of quantum spin liquids, yet its ground-state properties remain unresolved. We perform large-scale variational Monte-Carlo calculations using neural-network quantum states (NQSs) with kagome-geometry-aware message-passing convolution on two-dimensional tori containing up to 300 spins, and achieve exceptionally low variational energies for the kagome model. The spin and dimer structure factors show no evidence of magnetic or valence-bond long-range order. Moreover, the dominant symmetry-resolved spin and dimer correlations exhibit a common scaling behavior consistent with the emergent $SO(6)$ monopole multiplet of the Dirac spin liquid. Finally, the fidelity of the optimized NQSs with Gutzwiller-projected mean-field states increasingly favors the Dirac state over the competing $Z_{2}$ candidates as the system size grows. Together, these complementary results provide evidence for a $U(1)$ Dirac spin-liquid ground state in the kagome Heisenberg antiferromagnet.", "tier": "B_IMPORTANT_CONDMAT", "score": "9", "reason": "Crucial study on kagome magnetism and potential spin liquid ground states.", "tags": ["material", "kagome", "theory"], "image": "https://arxiv.org/html/2611.05174v1/fig2.png", "briefing": {"background": "스핀-1/2 카고메 하이젠베르크 반강자성체 모델은 양자 스핀 액체(QSL) 연구의 핵심 과제입니다. 기하학적 좌절(geometrical frustration)로 인해 자기 질서가 억제되면서 나타나는 바닥 상태의 성질을 규명하는 것이 물성물리학의 오랜 난제입니다.", "motivation": "기존의 수치적 방법으로는 충분한 크기의 격자에서 바닥 상태를 결정하는 데 한계가 있었습니다. 이 논문은 최신 신경망 양자 상태(NQS) 기법을 사용하여 더 큰 시스템 규모에서 카고메 격자의 바닥 상태를 탐구하고자 했습니다.", "result": "대규모(최대 300 스핀) 변분 몬테카를로 계산 결과, 자기적 혹은 원자가 결합의 장거리 질서가 없음을 확인했습니다. 또한, 스핀 및 다이머 상관함수가 Dirac 스핀 액체의 특징인 SO(6) 단극자 다중항(monopole multiplet)과 일치함을 보여주었습니다.", "implication": "이번 결과는 카고메 반강자성체의 바닥 상태가 U(1) Dirac 스핀 액체일 가능성이 매우 높음을 강력하게 시사합니다. 이는 수십 년간 지속된 해당 모델의 바닥 상태 논쟁을 해결하는 중요한 이정표가 될 것입니다.", "novelty": "카고메 격자 구조를 인지하는 신경망을 활용해 기존 기법보다 낮은 변분 에너지를 도출했다는 점이 혁신적입니다. 이는 AV3Sb5 등 카고메 금속의 자기적 배경을 이해하려는 본 독자의 연구 관점과 맞닿아 있습니다.", "unresolved": "신경망 기법이 시스템의 모든 동역학적 특성을 완벽히 포착했는지에 대한 논란이 남을 수 있으며, Dirac 스핀 액체 외의 미세한 에너지 경쟁 상태들과의 완벽한 분리는 여전히 어려운 숙제입니다.", "future_work": "더 큰 규모의 시스템에 대한 적용과 스핀 들뜸(spinon)의 스펙트럼 분석 등을 통해 이 제안된 상태를 더욱 엄격하게 검증할 것으로 예상됩니다.", "concepts": [{"term": "Dirac 스핀 액체", "why_emerged": "카고메 격자의 스핀 시스템에서 스핀온(spinon)이 Dirac 페르미온과 유사한 에너지 분산 관계를 가질 때 이를 기술하기 위해 도입되었습니다.", "origin": "Ran et al. (2007) 등에 의해 이론적으로 제안되었습니다.", "connections": "U(1) 게이지 이론, 카고메 격자의 기하학적 좌절과 밀접하게 연관되어 있습니다."}, {"term": "신경망 양자 상태 (NQS)", "why_emerged": "다체 양자 시스템의 파동함수를 효율적으로 표현하기 위해 기계학습의 변분 원리를 활용하려는 목적에서 등장했습니다.", "origin": "Carleo와 Troyer (2017)에 의해 처음 소개되었습니다.", "connections": "변분 몬테카를로(VMC), 텐서 네트워크(DMRG 등) 기법과 비교 및 보완 관계에 있습니다."}], "english_summary": ["Utilizes large-scale neural-network quantum states to investigate the spin-1/2 kagome Heisenberg antiferromagnet.", "Identifies no long-range magnetic or dimer order in systems up to 300 spins.", "Provides evidence for a U(1) Dirac spin-liquid ground state consistent with SO(6) symmetry.", "Outperforms traditional variational methods in energy convergence."]}}, {"title": "Theory of Kondo hybridization wave in Kondo lattice", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2609.08467", "authors": "Yin Zhong", "last_authors": "Yin Zhong", "summary": "Recent scanning tunneling microscopy experiments have discovered emergent spatially modulated Kondo hybridization wave (KHW) order in the heavy fermion superconductor UTe$_2$ and the artificial Kondo lattice system 1T/1H-TaS$_2$, challenging the conventional paradigm of spatially uniform Kondo hybridization in heavy fermion physics. Here, we develop a microscopic theory for KHW order based on the canonical square-lattice Kondo lattice model within the large-$N$ fermionic mean-field approximation. We systematically identify stable modulated KHW phases and establish their ground-state phase diagram. The prominent $\\boldsymbol{Q}=(0,\\pi)$ KHW phase yields uniaxial stripe modulation of the Kondo hybridization gap, which faithfully reproduces the spatial modulation pattern observed in UTe$_2$. Moreover, its inherent unit-cell-doubling modulation precisely accounts for the spectroscopic features measured in 1T/1H-TaS$_2$. We further predict a characteristic in-plane conductivity anisotropy that serves as a definitive transport fingerprint to discriminate KHW states with distinct ordering wavevectors. Our work provides a microscopic foundation for the newly observed KHW order and establishes a unified theoretical framework for understanding emergent modulated hybridization phenomena in heavy fermion materials.", "tier": "B_IMPORTANT_CONDMAT", "score": "9", "reason": "Directly addresses spectroscopic features in heavy-fermion materials like UTe2 and TaS2 relevant to STM/electronic structure.; demoted from A: broad CM, not direct user/project hit", "tags": ["Kondo-lattice", "STM", "heavy-fermions"], "image": "https://arxiv.org/html/2609.08467v2/figure1.png", "briefing": {"background": "중페르미온(heavy-fermion) 물질에서 전도 전자와 국소 스핀 사이의 콘도 혼성화(Kondo hybridization)는 통상 공간적으로 균일한 것으로 여겨져 왔으나, 최근 UTe2 등에서 이 패턴이 변조된다는 관측이 나오며 새로운 패러다임이 요구되고 있습니다.", "motivation": "UTe2와 TaS2에서 관측된 '콘도 혼성화 파동(KHW)'이 왜 나타나며, 어떤 미시적 기전을 가지는지 이론적 틀을 구축하고자 했습니다.", "result": "대-N(large-N) 평균장 이론을 통해 격자 모델에서 콘도 혼성화의 공간적 변조(stripe modulation)가 안정적인 바닥 상태로 존재함을 증명했습니다. 특히 UTe2에서 관측된 U(0, pi) 패턴을 성공적으로 재현했습니다.", "implication": "중페르미온 시스템에서 공간적으로 변조된 전자 상태가 나타날 수 있음을 이론적으로 정당화하며, 이는 향후 유사한 물질들의 STS 측정 데이터 해석에 중요한 지표가 될 것입니다.", "novelty": "균일한 혼성화 개념을 넘어 실공간에서 관측된 변조 패턴을 미시적으로 설명했다는 점이 중요합니다. STM/STS 데이터를 다루는 본 독자의 연구에 직접적인 해석 도구를 제공합니다.", "unresolved": "혼성화 파동이 나타나는 구체적인 물질 매개변수 의존성이나, 이것이 초전도성 등 다른 양자 질서와 결합하는 메커니즘은 상세 연구가 필요합니다.", "future_work": "제시된 이론을 바탕으로 다른 중페르미온 물질에서의 밴드 구조 변화 예측 및 전도도 이방성 실험 검증이 예상됩니다.", "concepts": [{"term": "콘도 혼성화 파동 (KHW)", "why_emerged": "균일한 콘도 혼성화로 설명할 수 없는 특정 물질들의 STS 데이터상 변조된 갭 구조를 설명하기 위해 등장했습니다.", "origin": "최근 UTe2 및 TaS2 관련 실험 연구들을 통해 개념화되었습니다.", "connections": "전형적인 콘도 격자 모델, 중페르미온 물리학과 직접 연결됩니다."}], "english_summary": ["Develops a theory for spatially modulated Kondo hybridization waves (KHW) in Kondo lattices.", "Explains KHW order observed in UTe2 and TaS2 using a large-N mean-field framework.", "Reproduces the (0, pi) stripe modulation and spectroscopic features measured by STM.", "Provides transport fingerprints to distinguish KHW phases."]}}, {"title": "Thermodynamic Evidence for Multiple Field-Induced Phases in an Anisotropic Kagome Antiferromagnet", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2611.04675", "authors": "M. Schuchard, Q. Barth\\'elemy, C. Marcenat, N. Wack, P. Puphal, A. De Muer, D. LeBoeuf, T. Klein", "last_authors": "P. Puphal, A. De Muer, D. LeBoeuf, T. Klein", "summary": "Kagome antiferromagnets are predicted to host exotic field-induced phases, yet experimental identification of their thermodynamic signatures remains challenging. Here we combine specific heat ($C$) and ultrasound measurements up to 36 T and down to 0.5 K to map the $H-T$ phase diagram of the anisotropic kagome magnet Y$_3$Cu$_9$(OH)$_{19}$Cl$_8$. We show that the suppression of long-range antiferromagnetic order with field at $\\sim 15$ T approximately coincides with the onset of the unconventional $1/6$ (or $1/9$) magnetization plateau previously observed in this system. The attenuation (and sound velocity) then intriguingly increases down to 0.5 K just at $\\mu_0H = 15$ T, and $C/T$ becomes temperature independent. Moreover, our measurements are consistent with the opening of a spin gap $\\Delta_0\\simeq3.5\\pm 0.3$ K within the plateau and reveal a further compressible (ungapped) phase beyond the plateau phase, unveiling a rich sequence of field-induced phases in this quantum magnet.", "tier": "B_IMPORTANT_CONDMAT", "score": "9", "reason": "Experimental study of field-induced phases in a kagome antiferromagnet, highly relevant to user interests.; demoted from A: broad CM, not direct user/project hit", "tags": ["experiment", "kagomemagnet", "phasediagram"], "image": "https://arxiv.org/html/2611.04675v1/Fig_1.png", "briefing": {"background": "카고메 반강자성체는 강한 기하학적 좌절을 가지고 있어 외부 자기장을 가했을 때 매우 풍부하고 이국적인 양자 상태(자기 평탄부 등)를 보일 것으로 예측되지만, 실험적으로 이를 구분해내는 것은 매우 까다로운 과제입니다.", "motivation": "Y3Cu9(OH)19Cl8이라는 카고메 자성체에서 강한 자기장하에 나타나는 질서 상태들의 열역학적 성질을 명확히 규명하고자 했습니다.", "result": "최대 36T까지의 비열 및 초음파 측정을 통해 15T 부근에서 자기 질서의 소멸과 함께 1/6 혹은 1/9의 자기화 평탄부가 시작됨을 확인했습니다. 또한 이 평탄부 내에서 에너지 간극(spin gap)이 열리는 것을 관측했습니다.", "implication": "자기장-온도(H-T) 위상 도표를 완성함으로써 카고메 격자에서 발현되는 위상들의 열역학적 기원을 확실히 했습니다.", "novelty": "36T에 이르는 고자기장 환경에서의 정밀 열역학 측정 데이터로, 카고메 금속/절연체의 자기적 위상 전이를 이해하는 데 매우 중요한 실증적 토대를 제공합니다.", "unresolved": "평탄부 이후에 나타나는 압축 가능한(ungapped) 상태의 미시적 정체는 여전히 베일에 싸여 있으며, 더 정밀한 이론 모델과의 대조가 필요합니다.", "future_work": "중성자 산란이나 RIXS 등을 이용해 평탄부 내의 국소 스핀 정렬 및 들뜸 상태를 직접 관측하는 실험이 필요합니다.", "concepts": [{"term": "자기화 평탄부 (Magnetization Plateau)", "why_emerged": "양자 스핀 시스템에서 특정 자기장에서 자화율이 일정하게 유지되는 현상을 설명하기 위해 도입되었습니다.", "origin": "Oshikawa, Yamanaka, Affleck (1997) 등의 이론적 정립이 유명합니다.", "connections": "스핀갭, 토폴로지적 자성 상태, 리브-슐츠-마티스(LSM) 정리와 연결됩니다."}], "english_summary": ["Maps the H-T phase diagram of the anisotropic kagome antiferromagnet Y3Cu9(OH)19Cl8 up to 36 T.", "Identifies the coincidence of magnetic order suppression with a magnetization plateau.", "Observes a spin gap of ~3.5 K within the plateau phase.", "Reveals a complex sequence of field-induced quantum phases."]}}, {"title": "Tuning the Fermi surface of MoTe2 by Nb Doping (Phys. Rev. B)", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2601.05197", "authors": "Andrew P. Weber (Donostia International Physics Center, ICFO-Institut de Ciencies Fotoniques), I\\~nigo Robredo (Luxembourg Institute of Science, et al.", "last_authors": "Centro de F\\'isica de Materiales CSIC-UPV/EHU, Ikerbasque Foundation)", "summary": "Ab initio calculations and angle-resolved photoemission experiments demonstrate that the bulk and surface electronic structure of Weyl semimetal candidate MoTe2 changes significantly by tuning the chemical potential by less than 0.4 eV. Calculations indicate that several Lifshitz transitions can occur among multiple electron and hole Fermi pockets of differing orbital character. Experiments show that 18% Nb-Mo substitution reduces the occupation of bulk and (001) surface bands, effectively producing a quasi-rigid band shift of $\\simeq$ 0.2 eV. Orbital character and dimensionality of the bulk bands is examined by soft X-ray angle resolved photoemission with control of the excitation light polarization. Deposition of alkali atoms on the surface produces electron binding energy shifts consistent with increased band filling. The results indicate that multiple regimes of electronic properties can be easily accessed in this versatile, layered material.", "tier": "B_IMPORTANT_CONDMAT", "score": "9", "reason": "Direct ARPES study of Weyl semimetal candidate with Fermi surface tuning.", "tags": ["ARPES", "Weylsemimetal", "electronicstructure"], "image": "https://arxiv.org/html/2601.05197v2/Td_structure.png", "briefing": {"background": "MoTe2는 위상학적 비자명성을 가진 베일 반금속 후보 물질로, 페르미 준위 근처의 밴드 구조와 위상학적 특성이 화학적 도핑이나 게이팅에 매우 민감합니다.", "motivation": "화학적 치환(Nb 도핑)이나 표면 흡착을 통해 페르미 준위를 미세하게 조절함으로써 MoTe2의 위상학적 상태와 전자 구조 변화를 체계적으로 관찰하고자 했습니다.", "result": "Nb 도핑과 표면 알칼리 원자 증착을 통해 페르미 준위를 약 0.4 eV 이내에서 조절했으며, Lifshitz 전이를 포함한 페르미 표면의 가역적인 변화를 ARPES로 입증했습니다.", "implication": "MoTe2는 페르미 표면 공학(Fermi surface engineering)을 통해 다양한 위상학적 상태를 제어할 수 있는 유연한 플랫폼임을 확인했습니다.", "novelty": "연성 X-선 ARPES를 사용하여 궤도 성분과 차원성을 분리 분석했으며, 도핑에 의한 밴드 구조 변화가 준-강체(quasi-rigid) 이동임을 보여주었습니다.", "unresolved": "도핑 과정에서 발생하는 무질서가 위상학적 상태의 견고성에 미치는 영향은 추가 연구가 필요합니다.", "future_work": "조절된 페르미 준위 하에서 나타나는 수송 현상 및 자기장 하에서의 위상학적 변화 연구가 예상됩니다.", "concepts": [{"term": "Weyl Semimetal", "why_emerged": "에너지 밴드가 점(Weyl node)에서 접하는 위상학적 상태 연구를 위해 필요했습니다.", "origin": "Herring (1937)이 처음 제안하고 최근 응집물질에서 구현됨.", "connections": "아노말리 홀 효과, 베리 곡률과 밀접한 관계."}, {"term": "Lifshitz Transition", "why_emerged": "페르미 표면의 위상학적 변화가 거시적 물성에 미치는 영향을 기술하기 위해 도입되었습니다.", "origin": "I. M. Lifshitz (1960).", "connections": "전자 구조 변화에 따른 양자 진동 및 비정상 수송 현상과 연결됨."}], "english_summary": ["Demonstrates tunable Fermi surface in Weyl semimetal candidate MoTe2 via Nb doping.", "ARPES and DFT confirm rigid band shifts up to 0.2 eV.", "Identifies multiple Lifshitz transitions driven by chemical potential control.", "Soft X-ray ARPES reveals orbital character and dimensionality of bulk bands."]}}, {"title": "Layer-decoupled electronic reconstruction and a robust charge density wave in GdTe3", "journal": " n, et al.", "last_authors": "C. Pfleiderer, P. Böni", "summary": "We report near-surface small-angle neutron scattering (NS-SANS) and complementary off-specular neutron reflectometry (OSR) of the magnetic order in a single-crystalline epitaxial MnSi film grown on Si(111) in the thick-film limit. Providing a means of direct reciprocal space mapping, NS-SANS and OSR reveal one-dimensional magnetic modulations perpendicular to the film surface under magnetic fields parallel and perpendicular to the film surface, where additional polarized neutron reflectometry (PNR) and magnetization measurements are in excellent agreement with the literature. Regardless of the field orientation, our data do not suggest the presence of more complex spin textures, notably the formation of skyrmions. This observation establishes a distinct contrast to bulk MnSi thinned to similar nanoscale thicknesses, in which a skyrmion lattice dominates the phase diagram under perpendicular fields. Extended x-ray absorption fine structure measurements suggest that small shifts of the Si positions within the unstrained unit cell of the film control the magnetic state, representing the main structural difference between epitaxial and thinned bulk MnSi.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Neutron scattering on magnetic materials aligns with reading profile.", "tags": ["neutron-scattering", "magnetism"], "image": "", "briefing": {"background": "MnSi는 카이랄 자성체로, 스카이뮴 격자(skyrmion lattice)가 나타나는 대표적인 물질입니다. 박막 형태에서는 기판과의 격자 부정합이나 응력으로 인해 벌크와는 다른 자기적 위상 구조가 나타날 수 있습니다.", "motivation": "벌크 시료를 얇게 깎은 것과 에피택셜 성장한 박막 간의 자기 구조 차이를 분석하고, MnSi 박막 내에서의 스카이뮴 형성 여부를 검증하기 위함입니다.", "result": "에피택셜 MnSi 박막에서는 스카이뮴 격자가 형성되지 않으며, 대신 1차원적인 자기 변조 구조가 우세함을 확인했습니다.", "implication": "박막 성장 시 발생하는 국소적인 Si 위치 변화가 자기 상태를 제어하는 핵심 요인임을 밝혀, 박막의 자기 위상 구조 설계에 대한 중요한 가이드라인을 제시합니다.", "novelty": "중성자 산란(SANS, OSR)을 통해 박막의 자기 질서를 역공간에서 직접 매핑하였으며, 벌크와 박막 간의 극명한 자기 구조 차이를 규명했습니다.", "unresolved": "박막 내 스카이뮴 격자 억제 현상의 구체적인 conductivity in graphene-related systems, connecting topological phases and quantum geometry.", "tags": ["theory", "graphene", "superconductivity", "topological", "quantumgeometry"], "image": "", "briefing": {"background": "그래핀과 같은 2차원 시스템은 위상적 성질을 가지며, 전자 간 상호작용이 강해지면 새로운 기저 상태(ground state)가 유도될 수 있습니다. 특히 케쿨레(Kekulé) 질서와 초전도성의 결합은 오랜 물리적 관심사입니다.", "motivation": "그래핀 시스템에서 나타나는 위상적 할데인 상(Haldane phase)과 관련하여, 퀀텀 지오메트리(quantum geometry)가 어떻게 초전도 쌍 형성을 유도하는지 이론적으로 규명하고자 합니다.", "result": "퀀텀 지오메트리, 특히 베리 곡률과 메트릭이 케쿨레 질서를 동반한 초전도 상태를 안정화하는 데 중요한 역할을 함을 보였습니다.", "implication": "위상적 물질의 기하학적 특성이 초전도성 발현의 새로운 척도로 작용할 수 있음을 의미하며, 이는 고온 초전도 및 위상 초전도 연구에 새로운 관점을 제공합니다.", "novelty": "위상적 할데인 상 내부의 페어링 상호작용을 퀀텀 지오메트리 관점에서 통합적으로 해석했다는 점이 독창적입니다.", "unresolved": "이러한 메커니즘이 실제 그래핀 이종접합 소자에서 실험적으로 관측 가능한 전이 온도를 가질지는 미지수입니다.", "future_work": "퀀텀 지오메트리 파라미터를 조절할 수 있는 moiré 격자 시스템에서 초전도 상태와의 상관관계를 검증하는 실험이 필요합니다.", "concepts": [{"term": "Kekulé Superconductivity", "why_emerged": "그래핀 격자의 켈룰레 왜곡(삼량체화)과 초전도성이 결합된 새로운 위상적 초전도 상을 설명하기 위해 등장함.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "그래핀의 전자-포논 상호작용 및 위상적 위상 전이와 연결됨."}, {"term": "Quantum Geometry", "why_emerged": "브릴루앙 영역 내의 웨이브 함수가 가지는 기하학적 구조가 전자의 물리적 응답(초전도, 전도도 등)에 미치는 영향을 기술하기 위해 필요함.", "origin": "Provost와 Vallee (1980)가 메트릭 텐서 개념을 도입.", "connections": "베리 곡률, 초유체 강성(Superfluid stiffness)과 밀접하게 연관됨."}], "english_summary": ["This paper explores pairing interactions in chiral 2D electron gases like graphene.", "Quantum geometry is identified as a key driver for Kekulé superconductivity in Haldane phases.", "The theoretical framework connects topological phases with interaction-induced superconductivity.", "It emphasizes the importance of band geometry in unconventional pairing mechanisms."]}}, {"title": "Nonrelativistic Optically Induced Spin Torque in Noncollinear Magnets", "journal": "PRL_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/vcvp-w5fd", "authors": "Zhiyuan Li, Jian Zhou", "last_authors": "Z "Altermagnetism revealed by polarized neutrons in MnF2", "journal": "Science", "source": "Gemini", "link": "https://www.science.org/doi/abs/10.1126/science.aec2602?af=R", "authors": "Quentin Faure, Dalila Bounoua, Victor Balédent, et al.", "last_authors": "Sylvain Petit, Paul McClarty", "summary": "Altermagnets are compensated magnets with symmetry-enforced spin split bands. Direct spectroscopic evidence for their existence has been reported in several materials. For example, inelastic neutron scattering (INS) has recently been used to witness a splitting of magnon bands in MnTe that is compatible with altermagnetism. Here, we present polarized INS results on MnF 2 showing that it is altermagnetic. Our data reveal a splitting coming from the long-range dipolar coupling. Furthermore, using a domain-biased sample, the data reveal a nonzero chirality in the neutron scattering cross section that reverses the sign between the two magnon modes. It is this feature that clearly demonstrates altermagnetism in MnF 2 . This finding highlights the potential for polarized INS to characterize altermagnets through its sensitivity to fine structure in magnon spectra.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Experimental evidence for altermagnetism in MnF2 using polarized neutron scattering.", "tags": ["altermagnetism", "neutronscattering", "magneticmaterials", "MnF2"], "image": "", "briefing": {"background": "자성체는 크게 강자성체와 반강자성체로 분류되어 왔으나, 최근 스핀 편극과 결정 대칭성이 결합하여 자기 모멘트가 상쇄됨에도 불구하고 전자의 밴드 구조가 스핀 분리되는 '알터자성(Altermagnetism)' 개념이 부상하고 있습니다.", "motivation": "MnTe 등에서 보고된 알터자성 증거를 넘어, MnF2라는 고전적 모델 물질에서도 이러한 특성이 실제로 존재하는지 편극 중성자 산란 실험을 통해 규명하고자 했습니다.", "result": "MnF2에서 장거리 쌍극자 결합으로 인한 매그논 밴드 분리를 관찰했습니다. 특히 도메인이 편향된 샘플을 통해 두 매그논 모드 사이의 부호가 바뀌는 비영(nonzero) 키랄성을 확인하여 알터자성을 입증했습니다.", "implication": "알터자성은 스핀트로닉스 소자에서 기존 강자성체보다 더 높은 효율과 속도를 제공할 잠재력을 가지며, MnF2와 같은 범용적인 반강자성체에서도 이러한 물리적 특성을 활용할 수 있는 길이 열렸습니다.", "novelty": "편극 중성자 산란을 통해 매그논 스펙트럼의 미세 구조를 직접 관측함으로써, 알터자성 상태를 명확히 ces the Hall response of the full model with good accuracy. We also predict that a smooth local potential induces equilibrium circulating currents whose strength depends on both Berry curvature and the orbital moments of states at the Fermi surface.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Investigates loop currents and Berry curvature in graphene, directly matching user interest keywords.", "tags": ["theory", "graphene", "loopcurrent", "anomalousHall"], "image": "https://arxiv.org/html/2611.04312v1/figures/microscopic_defect_current_field.png", "briefing": {"background": "그래핀 시스템, 특히 다층 구조에서 나타나는 변칙 홀 효과(AHE)는 전자 간의 강한 상관관계와 토폴로지적 특성이 맞물려 발생하는 현상으로, 양자 물질 연구의 핵심 주제 중 하나입니다.", "motivation": "능면체(Rhombohedral) 그래핀에서 관측되는 AHE와 자성이 기존의 Haldane 모델로 설명되는 평형 루프 전류(loop currents)에 의한 것인지, 아니면 다른 물리적 기원인지 명확히 하고자 했습니다.", "result": "평형 루프 전류가 존재한다는 기존 가설을 부정하고, 대신 밸리 편극 하에서 전자 경로들이 간섭을 일으켜 형성되는 'Wilson 루프'가 AHE의 기원임을 밝혀냈습니다.", "implication": "그래핀의 토폴로지적 현상을 이해하는 모델이 수정되어야 하며, 베리 곡률과 궤도 모멘트가 국소적 전위와 결합하여 어떻게 Hall 응답을 생성하는지에 대한 새로운 관점을 제공합니다.", "novelty": "복잡한 다층 그래핀 시스템에서 루프 전류를 배제하고 실공간(real-space) 계산을 통해 AHE의 미시적 원인을 재해석한 점이 매우 혁신적입니다.", "unresolved": "특정 샘플 조건에서 나타나는 국소적 잠재력이 어떻게 구체적인 루프 구조와 궤도 모멘트를 유도하는지에 대한 실험적 직접 증명은 미진합니다.", "future_work": "국소 전위 변조를 통한 Hall 응답 제어 실험과 STM 등을 활용한 궤도 모멘트 분포의 직접적인 실공간 시각화가 요구됩니다.", "concepts": [{"term": "변칙 홀 효과(Anomalous Hall Effect)", "why_emerged": "외부 자기장 없이도 자성체 내의 내재적 특성에 의해 홀 전압이 발생하는 현상을 설명하기 위해 도입되었습니다.", "origin": "Hall(1881)에 의해 처음 발견되었습니다.", "connections": "베리 곡률, 자기 위상 절연체, 그래핀."}, {"term": "Wilson 루프", "why_emerged": "게이지 이론에서 게이지 불변량을 나타내기 위해 도입되었으며, 본 연구에서는 전자 경로의 간섭을 정량화하는 도구로 사용됩니다.", "origin": "Wilson(1974).", "connections": "토폴로지 밴드 구조, 그래핀 물리."}], "english_summary": ["Theoretical study of AHE in rhombohedral graphene.", "Proposes AHE originates from Wilson loop interference, not equilibrium loop currents.", "Develops a real-space surface Hamiltonian to explain Hall response.", "Highlights the role of xplains the absence of magnetic Bragg peaks and observed excitation spectra.", "The paper highlights the role of high-rank multipolar degrees of freedom in rare-earth magnets."]}}, {"title": "Nonreciprocal charge transport in quantum materials: From superconductors to magnetic systems (J. Phys.: Condens. Matter)", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2611.04821", "authors": "Boning Yu, Yalei Huang, Alltrin Dhanarajagopal, Xiaofeng Xu", "last_authors": "Alltrin Dhanarajagopal, Xiaofeng Xu", "summary": "Nonreciprocal charge transport, where current flows preferentially in one direction, has become a key topic across quantum materials. This review covers some recent progress in bulk crystals, artificial heterostructures, van der Waals systems, high-temperature superconductors, and magnetic materials. The review discusses both intrinsic origins, such as band-structure effects, and extrinsic ones, including vortex motion, device geometry, and heating artifacts. A central focus is the superconducting diode effect due to its application potential, which shows different critical currents for opposite directions. The review also examines how symmetry breaking, spin-orbit coupling, and magnetic order contribute to the observed responses. However, there remain challenges when many exciting findings lack a unified picture, and the field continues to debate the relative importance of various mechanisms. The review highlights key open questions and suggests future directions, including better experimental standards and device integration. This review aims to give a balanced view of what is known, what is uncertain, and where the field might go next.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Comprehensive review of nonreciprocal transport in superconductors, magnets, and vdW systems.", "tags": ["review", "transport", "quantummaterials"], "image": "https://arxiv.org/static/browse/0.3.4/images/arxiv-logo-fb.png", "briefing":
