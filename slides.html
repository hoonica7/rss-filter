<!DOCTYPE html>

<meta name='viewport' content='width=device-width, initial-scale=1.0'>
<title>Daily Paper Slideshow</title>
<style>
  :root {
    color-scheme: light;
    --bg: #f6f7f4;
    --paper: #ffffff;
    --ink: #111827;
    --muted: #64748b;
    --line: #d8ddd2;
    --accent: #176b87;
    --accent-2: #9a3412;
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; overflow: auto; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: var(--bg); color: var(--ink); }
  .shell { max-width: 1500px; min-height: 100vh; margin: 0 auto; padding: 14px 18px; display: flex; flex-direction: column; }
  .topbar { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 16px; }
  .top-actions { display: flex; align-items: center; gap: 10px; }
  .topbar a, button { border: 1px solid var(--line); border-radius: 8px; background: var(--paper); color: var(--ink); padding: 10px 14px; font-weight: 700; text-decoration: none; cursor: pointer; }
  button.primary { background: var(--accent); border-color: var(--accent); color: white; }
  button:disabled { opacity: 0.45; cursor: not-allowed; }
  .counter { color: var(--muted); font-weight: 700; }
  .slide { min-height: calc(100vh - 82px); background: var(--paper); border: 1px solid var(--line); border-radius: 10px; padding: 18px; box-shadow: 0 18px 42px rgba(15, 23, 42, 0.10); display: grid; grid-template-columns: minmax(310px, 0.86fr) minmax(0, 1.55fr); gap: 18px; overflow: visible; }
  .paper-head { min-width: 0; min-height: 0; overflow: visible; display: flex; flex-direction: column; gap: 12px; }
  .figure { margin: 0; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: #f8fafc; }
  .figure img { display: block; width: 100%; max-height: 41vh; object-fit: contain; background: white; }
  .figure figcaption { padding: 7px 10px; color: var(--muted); font-size: 12px; line-height: 1.3; }
  .head-text { display: flex; flex-direction: column; gap: 9px; min-width: 0; }
  .badges { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .badge { border-radius: 999px; padding: 5px 9px; background: #eef2ff; color: #3730a3; font-size: 12px; font-weight: 800; }
  .score { background: #fee2e2; color: #991b1b; }
  h1 { margin: 0; font-size: 25px; line-height: 1.15; letter-spacing: 0; overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
  h1 a { color: inherit; text-decoration-color: rgba(23, 107, 135, 0.35); text-decoration-thickness: 2px; text-underline-offset: 4px; }
  h1 a:hover { color: var(--accent); text-decoration-color: var(--accent); }
  .meta, .authors, .why, .abstract { font-size: 13px; line-height: 1.45; }
  .meta, .authors { color: var(--muted); }
  .why strong, .abstract strong, .authors strong { color: var(--ink); }
  .authors { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .why { border-left: 4px solid var(--accent-2); padding-left: 10px; color: #374151; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .abstract { border-top: 1px solid var(--line); padding-top: 14px; color: #374151; }
  .original-abstract { border-top: 1px solid var(--line); padding-top: 10px; color: #374151; font-size: 11.5px; line-height: 1.35; overflow-wrap: anywhere; }
  .original-abstract strong { display: block; margin-bottom: 4px; color: var(--ink); }
  .tags { display: flex; flex-wrap: wrap; gap: 8px; }
  .tag { border-radius: 999px; padding: 4px 8px; background: #f1f5f9; color: #475569; font-size: 12px; font-weight: 700; }
  .head-text > .link { display: none; }
  .briefing { min-width: 0; min-height: 0; overflow: visible; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); grid-auto-rows: minmax(0, auto); align-content: start; gap: 11px 18px; border-top: 0; padding-top: 0; }
  .brief-section { min-width: 0; }
  .brief-section.wide { grid-column: 1 / -1; }
  .brief-section h2 { margin: 0 0 4px; font-size: 14px; line-height: 1.22; color: #0f766e; letter-spacing: 0; }
  .brief-section p, .brief-section li { margin: 0; font-size: 12.5px; line-height: 1.42; color: #1f2937; overflow-wrap: anywhere; }
  .brief-section ul { margin: 0; padding-left: 20px; }
  .concepts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 9px 14px; }
  .concept { border-top: 1px solid var(--line); padding-top: 7px; }
  .concept h3 { margin: 0 0 4px; font-size: 13px; color: #7c2d12; letter-spacing: 0; }
  .concept p { margin: 2px 0 0; font-size: 11.5px; line-height: 1.35; color: #374151; overflow-wrap: anywhere; }
  .concept b { color: #111827; }
  .link { color: var(--accent); font-weight: 800; text-decoration: none; }
  .empty { padding: 48px; background: var(--paper); border: 1px solid var(--line); border-radius: 12px; color: var(--muted); }
  @media (max-width: 860px) {
    .shell { padding: 14px; }
    .topbar, .top-actions { align-items: stretch; flex-direction: column; }
    .slide, .briefing, .concepts { grid-template-columns: 1fr; }
    .slide { min-height: auto; overflow: visible; display: grid; }
    h1 { font-size: 28px; }
  }
</style>

<script>
const slides = [{"title": "Hund's coupling governed orbital-selective superconductivity in Ba1−xKxFe2As2", "journal": "PRB_Recent", "source": "author whitelist", "link": "http://link.aps.org/doi/10.1103/yry8-qdm6", "authors": "Elena Corbae, Rong Zhang, Cong Li, et al.", "last_authors": "Donghui Lu, Zhi-Xun Shen", "summary": "Author(s): Elena Corbae, Rong Zhang, Cong Li, Kunihiro Kihou, Chul-Ho Lee, Makoto Hashimoto, Thomas Devereaux, Oscar Tjernberg, Egor Babaev, Dung-Hai Lee, Vadim Grinenko, Donghui Lu, and Zhi-Xun Shen While the influence of electronic correlations on superconductivity is a defining question, identifying how these correlations manifest in the superconducting state remains difficult. Furthermore, in multiorbital systems, correlations driven by Hund’s coupling can differentiate the behavior of individual orbitals, and how such orbital selectivity governs superconducting pairing has remained largely unexplored experimentally. Here, the authors use angle-resolved photoemission spectroscopy to experimentally determine the superconducting gap of a representative iron-based superconductor as the Hund’s coupling influence increases. They find increased correlation diminishes the superconducting gap in an orbital-selective way, suggesting that Hund’s coupling plays a central role in shaping pairing in multiorbital superconductors. [Phys. Rev. B 113, 224517] Published Fri Jun 12, 2026", "tier": "A_MUST_READ", "score": "10", "reason": "author whitelist: Makoto Hashimoto", "tags": ["angle-resolvedphotoemission", "photoemission", "superconduct"], "image": "", "briefing": {"background": "철 기반 초전도체(FeSC)에서 전자 상관관계가 초전도 상태에 미치는 영향은 오랜 연구 주제입니다. 특히 다중 궤도(multiorbital) 시스템에서는 훈트 결합(Hund's coupling)이 특정 궤도에 선택적으로 영향을 미치며 전자 거동을 결정합니다.", "motivation": "이 연구는 훈트 결합의 강도가 변화할 때, 다중 궤도 시스템에서 훈트 결합이 어떻게 초전도 쌍 결합(pairing)을 조절하는지 실험적으로 규명하고자 했습니다.", "result": "ARPES를 사용하여 Ba1-xKxFe2As2의 초전도 갭을 측정했습니다. 전자 상관관계가 증가함에 따라 특정 궤도에서 초전도 갭이 감소하는 궤도 선택적(orbital-selective) 현상을 확인했습니다.", "implication": "훈트 결합이 다중 궤도 초전도체에서 페어링 메커니즘을 결정짓는 핵심적인 요소임을 입증했습니다.", "novelty": "Makoto Hashimoto를 포함한 전문가 그룹이 ARPES를 통해 훈트 결합에 의한 궤도 선택적 초전도 현상을 직접적으로 관측하여 이론적 예측을 뒷받침했습니다.", "unresolved": "관측된 궤도 선택적 갭 감소가 페어링 상호작용 자체의 변화인지, 아니면 준입자 중량의 재규격화에 따른 결과인지에 대한 구체적인 분리는 추가 연구가 필요합니다.", "future_work": "다른 훈트 금속 시스템에서 유사한 궤도 선택적 거동을 검증하고, 이를 전자 구조 계산(DFT+DMFT)과 결합하여 정량적으로 분석할 예정입니다.", "concepts": [{"term": "훈트 결합", "why_emerged": "다중 궤도 시스템에서 전자 간의 상호작용과 스핀 배열을 설명하기 위해 필요함.", "origin": "Friedrich Hund(1925).", "connections": "강상관 전자계, 궤도 선택적 모트 전이와 밀접함."}, {"term": "궤도 선택적 초전도", "why_emerged": "모든 궤도가 동일하게 초전도에 기여하지 않는 다중 궤도 시스템의 특성을 이해하기 위함.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "아이언 기반 초전도체, 훈트 금속."}], "english_summary": ["Investigates the role of Hund's coupling in iron-based superconductors using ARPES.", "Observes orbital-selective suppression of the superconducting gap in Ba1-xKxFe2As2.", "Provides evidence that Hund's coupling is a primary driver of pairing dynamics in multiorbital systems.", "Highlights the importance of orbital-dependent correlation effects."]}}, {"title": "Suppression of p-Wave Altermagnetism by Localized 4f Electrons in CeNiAsO", "journal": "arXiv_CondMat", "source": "author whitelist", "link": "https://arxiv.org/abs/2606.02422", "authors": "Jiuxiang Zhang, Yueyang Sun, Honglin Zhou, et al.", "last_authors": "Lin Zhao, X. J. Zhou", "summary": "arXiv:2606.02422v2 Announce Type: replace Abstract: Altermagnetism, characterized by momentum-dependent spin splitting and zero net magnetization, has so far been explored mainly in weakly or moderately correlated d-electron systems. How symmetry-allowed altermagnetic band splitting manifests in heavy-fermion materials, where magnetic exchange competes with Kondo correlations, remains unclear. Here we use high-resolution angle-resolved photoemission spectroscopy (ARPES) to investigate CeNiAsO, a Kondo-lattice system that was predicted to be a candidate for p-wave altermagnetism. Fermi surface mapping and polarization-dependent ARPES show that the experimentally observed itinerant bands are mainly derived from Ni 3d orbitals, while resonant photoemission reveals that the Ce 4f states remain predominantly localized with residual c-f hybridization. Ultra-low-temperature measurements reveal no resolvable near-Fermi-level p-wave-like exchange splitting on the Ni 3d-derived conduction bands across the successive antiferromagnetic transitions. These experimental observations cannot be captured by an itinerant-4f band-structure description, which predicts a sizable p-wave splitting in the itinerant bands. When the localized Ce 4f character is incorporated, our band structure calculations indicate that the itinerant Ce 4f band weight is shifted away from the Fermi level and the p-wave-like splitting on the Ni 3d-derived bands is reduced to the few-meV scale. These results establish CeNiAsO as a strongly correlated f-electron setting in which the magnetic symmetry allows p-wave-like band splitting, but localized 4f electrons strongly suppress its observable itinerant single-particle signature.", "tier": "A_MUST_READ", "score": "10", "reason": "author whitelist: X. J. Zhou", "tags": ["ARPES", "angle-resolvedphotoemission", "photoemission", "STS", "altermagnet", "Kondo", "correlated", "ferromagnet"], "image": "https://arxiv.org/html/2606.02422v2/x1.png", "briefing": {"background": "알터자성(Altermagnetism)은 스핀 분할은 있으나 알짜 자화가 없는 새로운 자기 질서로, 최근 강상관 전자계에서 큰 관심을 받고 있습니다. 특히 CeNiAsO와 같은 헤비 페르미온 시스템에서 Kondo 효과와의 경쟁 관계는 물리학적 난제입니다.", "motivation": "p-파 알터자성 후보 물질인 CeNiAsO에서 Kondo 격자와 알터자성 간의 상호작용이 전자 구조에 어떻게 나타나는지 규명하고자 했습니다.", "result": "ARPES 분석 결과, Ni 3d 밴드는 유동적(itinerant)이나 Ce 4f 상태는 국소화(localized)되어 있음을 발견했습니다. p-파 알터자성에서 예측되는 밴드 분할이 실험적으로 거의 관측되지 않았습니다.", "implication": "강한 국소화된 4f 전자가 유동적인 밴드의 알터자성 신호를 억제함을 보여주며, 헤비 페르미온 물질에서 알터자성 구현의 어려움을 시사합니다.", "novelty": "X. J. Zhou 그룹이 ARPES를 통해 강상관 Ce 화합물에서 p-파 알터자성의 실험적 한계를 명확히 규명하였습니다.", "unresolved": "국소화된 f-전자와 유동적 d-전자 ": "2차원 반강자성체에서의 마그논-포논 결합은 향후 스핀트로닉스 소자의 효율적 제어를 위한 중요한 물리적 토대가 될 수 있습니다.", "novelty": "빛과 물질의 상호작용을 이용해 2차원 자성체 내의 집단 들뜸(collective excitations) 사이의 결합을 직접적으로 탐구했다는 점이 주목할 만합니다.", "unresolved": "이 결합이 구체적으로 어떤 미세 구조적 메커니즘을 통해 강화되는지에 대한 상세한 이론적 해석은 여전히 추가 연구가 필요합니다.", "future_work": "온도 변화에 따른 포논 모드 분리 측정 및 자기장 변화에 따른 스핀-격자 결합 제어 연구가 기대됩니다.", "concepts": [{"term": "반데르발스 반강자성체", "why_emerged": "원자 두께 수준에서 자기적 질서를 유지하며 차원성에 따른 자성 변화를 연구하기 위해 사용됨.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "2D 자성, 스핀트로닉스, 격자-스핀 결합."}, {"term": "패러데이 회전", "why_emerged": "자기장 하에서 편광된 빛의 진동면이 회전하는 현상을 통해 물질의 자기적 상태를 비접촉으로 측정하기 위해 사용됨.", "origin": "Michael Faraday에 의해 발견됨.", "connections": "자기 광학 효과, 스핀 분광학."}], "english_summary": ["Probes collective excitations in the 2D VdW antiferromagnet FePS3 using IR magneto-transmission.", "Observes significant changes in the phonon spectrum below the Néel temperature (TN ≈ 118 K).", "Provides evidence for the coupling between magnetic order and lattice vibrations.", "Establishes a foundation for understanding spin-phonon interactions in 2D magnets."]}}, {"title": "Extrinsic spin splitter currents in altermagnets", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/tgqz-6j4l", "authors": "Sanjay Sarkar, Sayan Sarkar, Amit Agarwal", "last_authors": "Sayan Sarkar, Amit Agarwal", "summary": "Author(s): Sanjay Sarkar, Sayan Sarkar, and Amit Agarwal Altermagnets exhibit momentum-dependent spin splitting despite having zero net magnetization. This enables a spin splitter effect in which an external electric field generates transverse spin currents by separating oppositely polarized carriers. Here, we develop a unified semiclassical theory of lin… [Phys. Rev. B 113, 235419] Published Mon Jun 15, 2026", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Theory of altermagnets, a high-interest topic for this user's profile.", "tags": ["theory", "altermagnet", "transport"], "image": "", "briefing": {"background dy correlations, strain, and lattice relaxation in twisted bilayer graphene", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/x2mz-hm8y", "authors": "Lorenzo Crippa, Gautam Rai, Dumitru Călugăru, et al.", "last_authors": "Giorgio Sangiovanni, Tim Wehling", "summary": "Author(s): Lorenzo Crippa, Gautam Rai, Dumitru Călugăru, Haoyu Hu, Jonah Herzog-Arbeitman, B. Andrei Bernevig, Roser Valentí, Giorgio Sangiovanni, and Tim Wehling Here, the authors explain a set of experimental features that, while ubiquitously observed in twisted bilayer graphene samples, have so far eluded a unified theoretical description. A broad range of spectral, response, and thermodynamic properties in twisted bilayer graphene is accurately described microscopically and traced to the interplay of electronic correlations, lattice strain, and structural relaxation. The results are in excellent agreement with multiple recent experiments including scanning tunneling and quantum twisting microscopy experiments. [Phys. Rev. B 113, L241112] Published Wed Jun 17, 2026", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Important experiment/theory synergy for moire systems, directly in profile interest.", "tags": ["graphene", "moire", "STM"], "image": "", "briefing": {"background": "트위스티드 이층 그래핀(TBG)은 모아레 패턴에 의한 플랫 밴드와 강한 전자 상관관계로 인해 초전도성, 절연 상태 등 풍부한 양자 현상을 보입니다.", "motivation": "그동안 실험에서 관측된 복잡한 스펙트럼 및 열역학적 물성들이 이론적으로 통합되지 못하고 분산되어 해석되던 문제를 해결하고자 했습니다.", "result": "전자 상관관계, 격자 변형(strain), 그리고 구조적 완화(relaxation)를 통합 고려한 모델을 통해 TBG의 다양한 물성을 일관되게 설명했습니다.", "implication": "모아레 시스템에서 나타나는 복잡한 다체 현상을 이해하기 위한 이론적 표준 모델을 마련했습니다.", "novelty": "기존 STM 및 양자 트위스팅 현미경(QTM) 데이터와 이론 모델 간의 정량적 일치를 달성하여, 격자 이완이 물성에 미치는 핵심적 역할을 증명했습니다.", "unresolved": "극저온 외의 온도 영역에서의 완벽한 모델링과 도핑 수준에 따른 미세한 전자상 분리 현상은 추가 연구가 필요합니다.", "future_work": "비틀림 각도의 불균일성이 거시적 물성에 미치는 영향에 대한 정밀 계산 및 예측.", "concepts": [{"term": "Moire Physics", "why_emerged": "2D 층 사이의 위상 차이로 발생하는 초격자가 전자 상태를 극적으로 변화시키는 DMAT", "score": "8", "reason": "Fermi surface study of WTe2 Weyl semimetal using transport spectroscopy.", "tags": ["WTe2", "topologicalsemimetal", "transport"], "image": "", "briefing": {"background": "Weyl 반금속(Weyl semimetals)은 위상수학적으로 보호된 밴드 교차점인 Weyl 노드를 가지며, 이는 베리 곡률과 연관된 독특한 전자기적 수송 특성을 유도합니다. Td-WTe2는 제2종 Weyl 반금속 후보 물질로, 밴드 구조의 대칭성 변화가 물리적 특성에 미치는 영향이 큰 관심을 받고 있습니다.", "motivation": "Td-WTe2에서 온도 변화에 따른 페르미 표면(Fermi surface) 위상학적 진화가 전자기적 성질에 어떤 구체적인 영향을 미치는지, 특히 저항 요동 분광법(Resistance fluctuation spectroscopy)을 통해 고해상도로 관측하고자 했습니다.", "result": "온도 변화에 따른 페르미 표면의 위상학적 전이를 저항 요동 신호를 통해 포착하였으며, 이는 대칭성에 의해 보호되는 전자 구조의 미세한 변화를 감지할 수 있음을 보여줍니다.", "implication": "위상 반금속의 페르미 표면 형상을 실험적으로 추적하는 방법론적 진보를 의미하며, ARPES로 확인하기 어려운 미세한 전자 구조 변화를 수송 측정을 통해 제어 가능함을 시사합니다.", "novelty": "전자 구조의 미세한 변화를 민감한 잡음 측정을 통해 밝혀낸 점이 특징이며, Td-WTe2의 위상학적 성질에 대한 고해상도 수송 실험 결과를 제공합니다.", "unresolved": "관찰된 저항 요동이 구체적으로 어떤 밴드 구조상의 위상 변화와 직결되는지에 대한 상세한 미시적 메커니즘은 추가적인 이론적 뒷받침이 필요합니다.", "future_work": "다른 위상 물질로의 확장 연구 및 외부 자기장/응력 하에서의 페르미 표면 변조에 대한 체계적인 수송 연구가 필요합니다.", "concepts": [{"term": "Type-II Weyl Semimetal", "why_emerged": "기존 제1종 Weyl 노드와 달리 에너지와 운동량의 강한 비등방성으로 인해 형성되는 새로운 형태의 위상 노드가 이론적으로 예측되면서 등장했습니다.", "origin": "Soluyanov et al. (2015)에 의해 이론적으로 확립되었습니다.", "connections": "밴드 구조의 로렌츠 대칭성 파괴, 입자-정공 비대칭성."}, {"term": "Resistance Fluctuation Spectroscopy", "why_emerged": "정적인 저항 측정만으로는 파악하기 힘든 전자 구조의 미세한 산란 과정이나 위상학적 전이를 동역학적으로 파악하기 위해 고안되었습니다.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "전자 산란, 상전이 전조 현상 연구."}], "english_summary": ["Investigates the temperature-dependent evolution of Fermi surface topology in Td-WTe2.", "Utilizes resistance fluctuation spectroscopy as a probe for topological band features.", "Confirms that transport measurements can detect subtle topological shifts in Weyl semimetals.", "Provides experimental insights into the electronic structure stability of Type-II Weyl systems."]}}, {"title": "Sommerfeld coefficient enhancement and magnetic short-range order in tituted BiFeO 3 nanodots", "journal": "Science_Advances", "source": "Gemini", "link": "https://doi.org/10.1126/sciadv.aec2861", "authors": "Koomok Lee, Peter Meisenheimer, Paul Stevenson, et al.", "last_authors": "Ramamoorthy Ramesh, Masaki Azuma", "summary": "Electric field–induced magnetization reversal accompanying polarization switching is promising for low–power consumption, nonvolatile, voltage-write, magnetic-read memory applications. Perovskite BiFe 0.9 Co 0.1 O 3 is a room-temperature multiferroic material in which both ferroelectric and weakly ferromagnetic orders coexist, with spontaneous magnetization coupled to the ferroelectric polarization. Here, we report electric field–induced ferroelectric and ferromagnetic domain changes in BiFe 0.9 Co 0.1 O 3 nanodots using a combination of piezoresponse microscopy and scanning nitrogen-vacancy center magnetometry assisted by image analysis techniques to directly observe both ferroic orders on the nanometer scale. The complex ferroelectric domains present in a 190-nanometer structure which can be switched from a net-down to a net-up polarization by scanning with a biased cantilever, accompanied by reversal of both in-plane and out-of-plane components of the magnetization. This directly demonstrates electric field–induced magnetization reversal accompanying 180° polarization switching in a complex structure of a scale relevant to the semiconductor industry, creating a potential path for next generation memory devices.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Demonstrates electric field control of ferromagnetic domains in a multiferroic topological material.", "tags": ["multiferroics", "ferromagnetism", "topologicaldomains", "nanoscaleimaging", "magnetictopologicalmaterials"], "image": "", "briefing": {"background": "다강체(multiferroics) 물질은 강유전성과 강자성이 공존하는 계로, 외부 전기장을 통해 자성 상태를 제어하는 차세대 저전력 스핀트로닉스 메모리 소자의 핵심 후보입니다.", "motivation": "BiFeO3 기반 다강체 박막에서 전기적 분극 스위칭이 어떻게 미세한 자성 도메인 역전을 유도하는지 나노 단위에서 시각화하고 제어 가능성을 검증하고자 합니다.", "result": "BiFe0.9Co0.1O3 나노닷에서 180도 분극 스위칭이 발생할 때, 면내 및 면외 자화 성분이 동시에 반전됨을 스캐닝 질소-공석(NV) 중심 자력계로 확인했습니다.", "implication": "전기장으로 자성 상태를 직접 제어하는 나노 규모 메모리 구현의 가능성을 실험적으로 입증했으며, 이는 차세대 비휘발성 자성 메모리 설계의 이정표가 될 수 있습니다.", "novelty": "기존의 박막 수준 연구를 넘어 190nm 나노닷 구조에서 다강체 성질의 결합을 직접 관측했다는 점에서 소자 응용 가능성을 높였습니다.", "unresolved": "나노닷 크기가 더 작아졌을 때 나타날 수 있는 도메인 벽의 안정성이나 열적 요동에 대한 정보는 부족합니다.", "future_work": "더 작은 크기의 구조체에서 자성 도메인의 동역학을 분석하고, 실제 고속 메모리 소자 구동 실험이 필요합니다.", "concepts": [{"term": "다강체(Multiferroics)", "why_emerged": "강유전성과 강자성을 하나의 물질에서 제어하여 소자의 효율을 극대화하기 위해 필요.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "스핀트로닉스, 강유전체 메모리(FeRAM)."}, {"term": "나노닷(Nanodots)", "why_emerged": "소자의 초소형화와 집적도를 높이기 위한 나노 구조체.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "양자점, 나노자석."}], "english_summary": ["BiFeO3-based nanodots show coupled ferroelectric and ferromagnetic switching.", "Voltage-induced 180-degree polarization reversal drives magnetization change.", "Direct observation using NV center magnetometry confirms nanometer-scale control.", "Provides a scalable path for low-power, nonvolatile magnetic memory devices."]}}, {"title": "Exploring the third dimension in quantum confinement of surface electrons", "journal": "Science_Advances", "source": "Gemini", "link": "https://doi.org/10.1126/sciadv.aed3926", "authors": "Lu Lyu, Tobias Eul, Wei Yao, et al.", "last_authors": "Martin Aeschlimann, Benjamin Stadtmüller", "summary": "Quantum confinement of surface electrons in two-dimensional metal-organic networks offers a powerful route to engineer electronic states for quantum and spintronic technologies. Here, we demonstrate the pivotal role of vertical variations in the surface potential on the quantum confinement of surface electrons. We investigate the confinement of both Shockley surface state and image-potential state electrons with their distinct vertical electron density distributions in a Cu-T4PT network on Cu(111). We find a substantial renormalization of the band mass of the image state, whereas the Shockley state remains almost unchanged. This notable divergence arises from the distinct three-dimensional potential landscape of the Cu-T4PT network, with a strong repulsive potential at the vertical position of the molecular backbone and leaky channels beneath the Cu coordination spheres. Our findings demonstrate the essential role of vertical potential engineering in designing quantum-confined states, thereby advancing control over electronic properties and quantum phenomena at the nanoscale.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Directly concerns quantum confinement, surface electronic states, and 2D materials engineering.", "tags": ["surfacescience", "quantumconfinement", "electronicstructure", "2Dmaterials", "spintronics"], "image": "", "briefing": {"background": "금속 표면의 전자 상태를 제어하는 것은 촉매, 나노 전자 소자 등 표면 과학의 핵심 과제이며, 특히 양자 구속 효과를 이용한 전자 구조 엔지니어링이 중요합니다.", "motivation": "2D 금속-유기 네트워크 구조에서 수직 방향의 전위 변화가 표면 상태(Shockley 상태 및 영상 전위 상태)의 양자 구속에 미치는 영향을 규명하고자 합니다.", "result": "Cu-T4PT 네트워크 구조 내 분자 골격의 척력과 Cu 배위 중심 아래의 누설 채널이 수직적 전자 밀도 분포를 변화시켜, 영상 전위 상태의 밴드 질량을 재규격화함을 발견했습니다.", "implication": "표면의 전자 상태를 수직 방향으로 설계함으로써 2D 물질의 전자적 특성을 정밀하게 제어할 수 있는 새로운 방법론을 제시합니다.", "novelty": "기존의 평면적 구속을 넘어 3차원적 잠재력 분포를 고려한 표면 전자 상태 엔지니어링의 중요성을 실험적으로 증명했습니다.", "unresolved": "다양한 분자 네트워크 구조에서의 범용성이나, 더 복잡한 이종 구조에서의 전자 결맞음 특성은 추가 연구가 필요합니다.", "future_work": "다른 금속-유기 네트워크를 이용한 밴드 갭 공학 및 스핀 의존적 표면 전자 수송 현상 연구.", "concepts": [{"term": "Shockley 표면 상태", "why_emerged": "결정 표면의 퍼텐셜 불연속성으로 인해 발생하는 표면 국한 전자 상태를 설명하기 위해 필요.", "origin": "William Shockley (1939)", "connections": "표면 플라즈몬, 전자 산란."}, {"term": "영상 전위 상태(Image-potential state)", "why_emerged": "금속 표면 외부에서 전자가 거울상 전하에 의해 느끼는 포텐셜에 의해 형성되는 상태를 이해하기 위해 필요.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "표면 전자 상태, 2PPE 분광학."}], "english_summary": ["Vertical potential variations significantly impact surface electron quantum confinement.", "Study of Cu-T4PT networks on Cu(111) reveals distinct behavior of Shockley and image-potential states.", "Substantial band mass renormalization observed in image-potential states due to local potential landscape.", "Demonstrates precise engineering of electronic properties via vertical potential design."]}}, {"title": "Probing and controlling coherent and incoherent dynamics of phase transitions via multipulse excitation", "journal": "Science_Advances", "source": "Gemini", "link": "https://doi.org/10.1126/sciadv.aef8585", "authors": "Feng-Wu Guo, Wen-Hao Liu, Zhi Wang, et al.", "last_authors": "Lin-Wang Wang, Jun-Wei Luo", "summary": "Ultrafast laser pulses can selectively induce either wide-sized coherent or localized incoherent dynamics in solids, yet harnessing these complex dynamics to achieve controlled phase transitions remains challenging. Here, we use real-time time-dependent density functional theory (rt-TDDFT) to investigate a double-pulse laser scheme in VO 2 , elucidating the roles of these two distinct types of dynamics and proposing two more energy-efficient phase transition routes. In the first scenario, a weak initial pulse induces coherent oscillations of V-V dimers. When the second pulse is applied at the dimer stretching time, transient bandgap narrowing enhances carrier excitation, thereby reducing the total laser fluence required for the phase transition. In the second scenario, a stronger but subthreshold first pulse activates localized structural distortions resembling photoinduced polarons. A subsequent long-wavelength pulse promotes accumulation and spatial propagation of the polarons, ultimately triggering a global phase transition. Our findings establish multipulse excitation as an energy-efficient and general approach for controlling structural phase transitions and disentangling distinct ultrafast dynamics in solids.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Investigates ultrafast dynamics and control of phase transitions in VO2, a correlated material.", "tags": ["stronglycorrelatedelectronsystems", "phasetransition", "ultrafastspectroscopy", "VO2", "DFT"], "image": "", "briefing": {"background": "강상관 전자계 물질의 초고속 상전이 제어는 미래 광학 정보 처리 소자의 핵심 기술이며, 특히 이산화바나듐(VO2)의 금속-절연체 상전이 현상이 주요 연구 대상입니다.", "motivation": "단일 펄스가 아닌 다중 펄스(double-pulse) 레이저 조사를 통해 VO2의 상전이 동역학을 보다 효율적이고 정밀하게 제어하고자 합니다.", "result": "실시간 시간 의존 밀도범함수이론(rt-TDDFT)을 통해, 첫 번째 펄스로 V-V 이합체의 결맞음 진동을 유도하거나 극성자(polaron)를 활성화하면 두 번째 펄스에 의한 상전이 임계치를 획기적으로 낮출 수 있음을 보였습니다.", "implication": "강상관 물질의 상전이를 에너지 효율적으로 제어할 수 있는 새로운 광학적 프로토콜을 제시하며, 초고속 스위칭 소자 개발에 기여합니다.", "novelty": "단순한 에너지 주입을 넘어 상전이 경로의 동역학(결맞음 대 비결맞음)을 선택적으로 조절할 수 있는 다중 펄스 제어 전략을 확립했습니다.", "unresolved": "실제 실험적 환경에서의 극성자 공간 전파 속도와 거시적 도메인 형성 과정에 대한 더 세밀한 분석이 필요합니다.", "future_work": "실험적 레이저 펌프-프로브 측정을 통한 시뮬레이션 결과 검증 및 다른 강상관 물질로의 확장.", "concepts": [{"term": "rt-TDDFT", "why_emerged": "강상관 물질의 비평형 동역학을 시간 영역에서 정밀하게 계산하기 위해 필요.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "DFT, 광학적 상전이."}, {"term": "극성자(Polaron)", "why_emerged": "전자와 주변 격자 왜곡의 결합 상태를 설명하기 위해 고체 물리학에서 도입.", "origin": "Solomon Pekar (1946)", "connections": "강상관 전자계, 상전이 동역학."}], "english_summary": ["Multipulse laser excitation offers an energy-efficient route to control phase transitions in VO2.", "Coherent dimer oscillations and localized polarons act as pathways to lower transition thresholds.", "Real-time TDDFT simulations elucidate distinct ultrafast dynamics under double-pulse schemes.", "Provides a universal approach for managing structural phase transitions in solids."]}}, {"title": "Projected altermagnetism by symmetry reduction at surfaces and in thin films", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2606.18964", "authors": "Sopheak Sorn, Charanpreet Singh, Lukasz Plucinski, Gustav Bihlmayer, Yuriy Mokrousov, Wulf Wulfhekel", "last_authors": "Yuriy Mokrousov, Wulf Wulfhekel", "summary": "arXiv:2606.18964v1 Announce Type: new Abstract: Altermagnets are a newly identified class of magnetic materials that combine vanishing net magnetization within the unit cell with spin-split electronic states. Their theoretical description relies on symmetry properties of the bulk band structure. Surfaces and thin films, however, inherently break these symmetries. Here, we investigate the consequences of such symmetry reduction for the electronic structure of bulk altermagnets near the surface and of thin films. When the surface coincides with a symmetry plane of the bulk altermagnetic order, the resulting two-dimensional Brillouin zone exhibits spin-degenerate bands, corresponding to conventional antiferromagnetic behavior. In all other cases, the symmetry of the altermagnetic order is reduced, leading to modified spin splitting. Remarkably, we discover a thin-film geometry of a $g$-wave altermagnet with a particular surface orientation that enables a $d$-wave spin splitting, which is commonly accompanied by the spin-splitter effect, suggesting the functionalization of non-$d$-wave altermagnets by surfaces. Our findings demonstrate that symmetry breaking at surfaces and in thin films fundamentally reshapes altermagnetic spin textures, providing a tunable platform for controlling spin-dependent electronic phenomena.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Altermagnetism is a major interest; study covers symmetry breaking in thin films/surfaces.", "tags": ["altermagnet", "symmetry", "electronicstructure"], "image": "https://arxiv.org/html/2606.18964v1/x1.png", "briefing": {"background": "알터마그넷(Altermagnet)은 순 자화는 0이지만 스핀 분할된 전자 구조를 가져 비통상적인 전자기적 물성을 보이는 차세대 자성체입니다. 벌크에서의 대칭성 논의가 주로 이루어져 왔으나, 실제 소자 응용을 위한 박막이나 표면에서의 거동에 대한 이해가 필요합니다.", "motivation": "벌크 알터마그넷의 대칭성이 표면이나 박막 구조에서 어떻게 변화하고, 결과적으로 전자 구조와 스핀 텍스처에 어떤 영향을 미치는지 규명하고자 합니다.", "result": "표면이 벌크 대칭면과 일치할 경우 스핀 분할이 사라지나, 그렇지 않은 경우 대칭성 파괴를 통해 새로운 스핀 분할이 나타남을 보였습니다. 특히 g-wave 알터마그넷 박막에서 표면 배향을 조절하여 d-wave 스핀 분할을 유도할 수 있음을 확인했습니다.", "implication": "표면 및 계면 엔지니어링을 통해 알터마그넷의 고유한 스핀 특성을 제어하거나 기능화할 수 있는 강력한 토대를 마련했습니다.", "novelty": "알터마그넷의 전자 구조가 기하학적 구조(박막, 표면)에 의해 재구성될 수 있음을 밝혔으며, ARPES 등을 통한 실험적 검증의 이론적 가이드를 제공합니다.", "unresolved": "실제 합성된 박막에서의 결함(defect)이나 층간 상호작용이 이론적 예측치를 얼마나 왜곡시킬지는 추가 연구가 필요합니다.", "future_work": "제안된 표면 배향을 가진 박막 시편을 제작하고 ARPES나 Spin-ARPES를 통해 스핀 분할 텍스처를 실험적으로 직접 관측하는 연구가 필요합니다.", "concepts": [{"term": "알터마그넷", "why_emerged": "강자성체의 자화 제어와 반강자성체의 안정성을 동시에 갖춘 새로운 스핀트로닉스 물질의 필요성 때문입니다.", "origin": "최근 2-3년 내 체계적으로 정립됨 (주로 이론적 예측)", "connections": "반강자성체, 스핀-궤도 결합, 비통상적 홀 효과"}, {"term": "g-wave 알터마그넷", "why_emerged": "알터마그넷의 스핀 분할 대칭성을 분류하기 위한 파라미터로 필요합니다.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "반강자성 스핀 구조, d-wave 스핀 분할"}], "english_summary": ["Analyzes how surface and thin-film symmetry breaking impacts altermagnetic electronic states.", "Demonstrates that surface orientation can tune spin-splitting from g-wave to d-wave character.", "Suggests surfaces as a functional platform for controlling spin textures in altermagnets.", "Provides theoretical predictions for experimental verification via spin-resolved spectroscopy."]}}, {"title": "Strain induced magnetic phase transition and anomalous transport phenomena in RuO2 and MnF2", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2606.18603", "authors": "Xiuxian Yang, Zhangqi Wu, Xiangju Wang, et al.", "last_authors": "Jian Hao, Wanxiang Feng", "summary": "arXiv:2606.18603v1 Announce Type: new Abstract: Collinear antiferromagnets with broken time-reversal symmetry have emerged as a fertile platform for spintronics. Using a general tight-binding model and first-principles calculations, we show that strain engineering provides a simple route to control magnetic phase transition and activate transverse responses in representative altermagnets RuO$_2$ and MnF$_2$. For pristine RuO$_2$ and MnF$_2$ with N\\'eel vector $\\mathbf{n}\\parallel$ [001], symmetry constrains the off-diagonal elements of the Hall conductivity tensor to vanish, thereby forbidding anomalous transport and magneto-optical responses. Shear strain applied along the $ac$ direction preserves the spin symmetry relating the two spin-opposite magnetic sublattices and therefore maintains the altermagnetic phase. By contrast, shear strain applied along the $ab$ direction breaks this spin symmetry and drives a transition from an altermagnetic phase to a partially compensated ferrimagnetic phase in metallic RuO$_2$ and to a fully compensated ferrimagnetic phase in semiconducting MnF$_2$. In addition, the lowered symmetry enables finite anomalous Hall, anomalous Nernst, and anomalous thermal Hall conductivities, as well as magneto-optical rotation angles, which are prohibited in the pristine systems. These responses exhibit a clear strain dependence and become progressively stronger as the strain amplitude increases. Our results establish strain engineering as an effective route to manipulate magnetic phases and functional responses in unconventional antiferromagnets, thereby expanding opportunities for antiferromagnetic spintronics and magneto-optical applications.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Theory predicting strain-induced anomalous transport and phase transitions in altermagnetic materials.", "tags": ["altermagnet", "anomalousHall", "transport", "theory", "magneticmaterials"], "image": "https://arxiv.org/html/2606.18603v1/x1.png", "briefing": {"background": "RuO2와 MnF2 같은 반강자성체는 시간 역전 대칭성이 깨져 있어 스핀트로닉스 분야에서 큰 관심을 받고 있으나, 외부 변수 없이 고유의 상태에서는 전송 물성 측정에 한계가 있습니다.", "motivation": "변형(Strain) 엔지니어링을 통해 이러한 물질의 자기적 위상을 제어하고, 금지된 전송 현상(아노말리 홀 효과 등)을 활성화할 수 있는지 탐구합니다.", "result": "RuO2와 MnF2에 특정 방향(ab 방향)의 전단 변형을 가하면 대칭성이 깨지며 자성 위상이 알터마그네틱에서 페리마그네틱으로 변함을 확인했습니다. 이로 인해 이전에 불가능했던 홀 효과 등이 유도됩니다.", "implication": "단순한 물리적 변형만으로도 반강자성체의 위상과 전송 특성을 능동적으로 제어할 수 있는 효율적인 수단을 제시합니다.", "novelty": "RuO2와 같은 대표적 알터마그넷 후보 물질에서 변형 유도 위상 전이와 그에 따른 수송 특성 변화를 체계적으로 계산하여 실험적 제어 가능성을 입증했습니다.", "unresolved": "실제 박막 기판과의 격자 부정합에 의한 변형량이 충분히 큰지, 그리고 실제 eratures (Tc-inv) remain below Kelvin-range, precluding substantial applications. Here, we report field-modulated inverse-superconducting-transitions above 4He-cooling-limit in Eu-based infinite-layer nickelates (EuxNd1-xNiO2 and EuxPr1-xNiO2) grown on a substrate under both overdoped and underdoped regimes. Paradigmatically, superconductivity with zero-resistance is confined between Tc-inv (2.6-5.4 K) and another higher normal-Tc, rising and decreasing with applied magnetic-field, respectively. Starting from the resistive-state below Tc-inv, the inverse-superconducting-transition is driven by not only temperature-rising, but also current-density, while superconductivity further vanishes at higher temperature and current thresholds. The Kelvin-range inverse superconducting transition is plausibly explained by temperature-induced alternating dominance of effective magnetic-fields arising from Eu2+4f7 related compensations relative to the upper-critical-field. Furthermore, an extended-phenomenological-framework is also supported by reemerged superconductivity below 300 mK under magnetic-field, giving rise to an unprecedented temperature-induced reentrant superconductivity. Our findings establish magnetic-interaction-reconfigured high-Tc systems as fertile platforms for exploring quantum phenomena that reverse thermal-decoherence paradigm, also enabling antithetical-designs to unlock untapped application-scenarios for quantum-phase-transition devices.", "tier": "C_MAYBE", "score": "8", "reason": "Experimental observation of inverse and reentrant superconductivity in nickelate materials.; tier capped to C: formal/generic theory watch", "tags": ["superconductivity", "nickelates", "unconventionalSC", "experiment"], "image": "https://arxiv.org/static/browse/0.3.4/images/arxiv-logo-fb.png", "briefing": {"background": "자동 브리핑을 생성하지 못했습니다. 초록과 원문 링크를 기준으로 빠르게 확인하세요.", "motivation": "초록 정보만으로는 분야 내부의 구체적 동기를 안정적으로 요약하기 어렵습니다.", "result": "arXiv:2606.18683v1 Announce Type: new
