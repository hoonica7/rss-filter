락 지점 부근의 새로운 위상적 상태를 유도할 수 있음을 의미합니다.", "novelty": "니켈산염에서 일반적으로 간과되던 간극 전자 상태의 중요성을 부각시켰으며, 이가 전자 구조에 미치는 영향을 통해 물질 설계의 새로운 변수를 제시했습니다.", "unresolved": "실제 실험적 수송 물성에서 이 이분법적 페르미 면의 기여를 명확히 분리해내는 데에는 추가적인 실험적 검증이 필요합니다.", "future_work": "압력 하에서의 전자 구조 변화와 F 농도 조절을 통한 전이 금속 니켈산염의 초전도성 최적화 연구가 필요합니다.", "concepts": [{"term": "이분법적 전자 시스템 (Dichotomous electronic system)", "why_emerged": "니켈 d-궤도 정공과 간극 전자 밴드 전자가 분리된 역할을 수행하는 상태를 기술하기 위해 도입되었습니다.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "전자 구조 계산, 페르미 면, 자가 도핑"}, {"term": "간극 전자 밴드 (Interstitial E* band)", "why_emerged": "결정 구조 내 비어있는 공간에 존재하는 전자 상태가 전체 밴드 구조를 변형시키는 현상을 설명하기 위함입니다.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "니켈산염 초전도체, 밴드 엔지니어링"}], "english_summary": ["Analyzes the electronic structure of the bilayer nickelate La3Ni2O5F.", "Identifies a 'dichotomous' system with coexisting hole and electron quasiparticles.", "Links the interstitial E* band to self-doping and the emergence of a Dirac point.", "Suggests that pressure or F-insertion can tune these electronic features."]}}, {"title": "Hydrodynamic fluctuations in Luttinger liquids", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2610.37301", "authors": "Alex Levchenko", "last_authors": "Alex Levchenko", "summary": "We develop the theory of hydrodynamic fluctuations for one-dimensional quantum liquids. At low temperatures the relaxation of interacting electrons in a single-channel wire separates into two classes: equilibration, which changes the numbers of right and left movers through backscattering and is exponentially slow, and thermalization, which redistributes energy and momentum at a fixed number of movers at a power-law rate. This separation of time scales gives the electron liquid a two-fluid description analogous to superfluid $^4$He, with the zero mode of the Luttinger liquid as the superfluid component and the gas of thermal excitations as the normal component. Using Onsager reciprocity and the fluctuation-dissipation theorem, we add Langevin fluxes to the two-fluid hydrodynamic equations, including a mutual-friction noise generated by rare backscattering events that has no counterpart in helium. We apply the theory to Coulomb-coupled quantum wires and calculate the dynamic structure factors, which contain a second-sound peak next to the plasmon doublet; the Coulomb drag resistivity, where intrawire equilibration acts as a bottleneck and turns the hydrodynamic drag into an activated temperature dependence; and the near-field heat transfer between the wires. Mode frequencies, spectral weights, linewidths, and the crossover scales of the transport coefficients are expressed through the thermodynamic properties of the liquid and a few dissipative coefficients, providing spectroscopic and transport probes of two-fluid behavior in one-dimensional quantum systems.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Important theoretical contribution to 1D Luttinger liquid transport and thermodynamics, relevant to user's 1D interests.", "tags": ["Luttinger", "transport", "1Dphysics"], "image": "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAsAAAAOCAYAAAD5YeaVAAAAAXNSR0IArs4c6QAAAAZiS0dEAP8A/wD/oL2nkwAAAAlwSFlzAAALEwAACxMBAJqcGAAAAAd0SU1FB9wKExQZLWTEaOUAAAAddEVYdENvbW1lbnQAQ3JlYXRlZCB3aXRoIFRoZSBHSU1Q72QlbgAAAdpJREFUKM9tkL+L2nAARz9fPZNCKFapUn8kyI0e4iRHSR1Kb8ng0lJw6FYHFwv2LwhOpcWxTjeUunYqOmqd6hEoRDhtDWdA8ApRYsSUCDHNt5ul13vz4w0vWCgUnnEc975arX6ORqN3VqtVZbfbTQC4uEHANM3jSqXymFI6yWazP2KxWAXAL9zCUa1Wy2tXVxheKA9YNoR8Pt+aTqe4FVVVvz05O6MBhqUIBGk8Hn8HAOVy+T+XLJfLS4ZhTiRJgqIoVBRFIoric47jPnmeB1mW/9rr9ZpSSn3Lsmir1fJZlqWlUonKsvwWwD8ymc/nXwVBeLjf7xEKhdBut9Hr9WgmkyGEkJwsy5eHG5vN5g0AKIoCAEgkEkin0wQAfN9/cXPdheu6P33fBwB4ngcAcByHJpPJl+fn54mD3Gg0NrquXxeLRQAAwzAYj8cwTZPwPH9/sVg8PXweDAauqqr2cDjEer1GJBLBZDJBs9mE4zjwfZ85lAGg2+06hmGgXq+j3+/DsixYlgVN03a9Xu8jgCNCyIegIAgx13Vfd7vdu+FweG8YRkjXdWy329+dTgeSJD3ieZ7RNO0VAXAPwDEAO5VKndi2fWrb9jWl9Esul6PZbDY9Go1OZ7PZ9z/lyuD3OozU2wAAAABJRU5ErkJggg==", "briefing": {"background": "1차원 양자 액체 내에서의 전하 및 에너지 수송 현상은 고전적인 페르미 액체 이론으로 설명되지 않으며, Luttinger 액체 모델을 통해 기술됩니다. 1차원 구조에서는 입자들이 서로 얽혀 있어 전하와 스핀이 분리되는 독특한 거동을 보입니다.", "motivation": "이 논문은 1차원 전자계에서 낮은 온도일 때 일어나는 입자 간 재분배(thermalization)와 산란(equilibration) 과정의 시간 척도 차이를 밝히고, 이를 superfluid와 유사한 두-유체(two-fluid) 모델로 기술하고자 합니다.", "result": "Luttinger 액체를 superfluid 성분(영 모드)과 정상 성분(열적 여기)으로 구분하는 새로운 유체역학적 기술 방식을 제안했습니다. 특히 쿨롱 결합된 와이어 시스템에서 제2 음향(second sound) 피크와 쿨롱 드래그 비저항의 온도 의존성을 성공적으로 예측했습니다.", "implication": "1차원 시스템의 비평형 열역학을 이해하는 강력한 프레임워크를 제공하며, 나노 와이어 등 차세대 저차원 소자의 열 관리 및 신호 전달 설계에 이론적 기초가 됩니다.", "novelty": "기존 헬륨 액체에서만 보였던 두-유체 거동을 1차원 전자계로 확장하고, 특히 상호 마찰(mutual-friction) 노이즈를 포함하여 전하 재분배 병목 현상을 이론적으로 규명한 점이 독창적입니다.", "unresolved": "이론적 모델은 이상적인 1차원 근사치를 전제로 하므로, 실제 물질의 불순물이나 비균질성이 존재할 때 나타나는 미시적 섭동은 여전히 논의의 여지가 있습니다.", "future_work": "제안된 쿨롱 드래그나 제2 음향 피크를 실제 1차원 와이어(탄소 나노튜브, 반도체 나노와이어 등)에서 정밀 분광학적 관측으로 검증할 필요가 있습니다.", "concepts": [{"term": "Luttinger liquid", "why_emerged": "1차원 전자계에서는 상호작용으로 인해 페르미 액체 이론이 붕괴되어 이를 대체할 새로운 다체 물리 프레임워크가 필요했습니다.", "origin": "Tomonaga와 Luttinger에 의해 이론적 기틀이 마련됨.", "connections": "Spin-charge separation, Bosonization 기법과 밀접하게 연결됨."}, {"term": "Coulomb drag", "why_emerged": "서로 절연된 두 나노와이어 간의 상호작용을 측정하여 전자 간의 운동량 전달을 연구하기 위해 필요합니다.", "origin": "1990년대 초반 2차원 전자 가스 시스템에서 처음 실험적으로 관측됨.", "connections": "다체계의 마찰 계수 및 에너지 전달 연구와 연결됨."}], "english_summary": ["Develops a two-fluid hydrodynamic theory for 1D Luttinger liquids.", "Identifies separate time scales for thermalization and equilibration.", "Predicts second-sound modes and activated Coulomb drag behavior.", "Provides a theoretical framework for spectroscopic signatures of hydrodynamic 1D transport."]}}, {"title": "Large superconducting diode effect indicates nonuniform triplet pairing in UTe2", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2610.36332", "authors": "Zheyu Wu, Daniel Shaffer, Dmitry V. Chichinadze, et al.", "last_authors": "Alex Levchenko, Alexander G. Eaton", "summary": "The superconducting diode effect (SDE) is characterized by unequal critical current magnitudes for opposite-polarity current flow, owing to broken spatial-inversion and time-reversal symmetries. For a superconducting pair wavefunction to spontaneously break inversion symmetry implies the formation of Cooper pairs with nonzero momentum, yielding a nonuniform superconducting state. For singlet superconductors, the formation of such a (FFLO) state has long been understood to provide an escape from high field Pauli pair-breaking -- how and why such an effect might occur for equal spin pairing is an open question. Here we report the observation of a large SDE in bulk specimens of the three-dimensional heavy-fermion triplet superconductor UTe$_2$, with a peak diode efficiency of 33% at the high magnetic field strength of 33.6 T, representing the highest-field observation of the SDE to date. Crucially, this nonreciprocal transport is strictly confined to a narrow field regime where superconductivity coexists with a field-induced spin-polarized state near a first-order metamagnetic phase boundary. The absence of the SDE away from this slender phase-intersection argues strongly against purely extrinsic vortex pinning asymmetries. Instead, our findings indicate spontaneous inversion symmetry breaking accompanied by finite-momentum Cooper pairing. We model this behavior using a phenomenological Ginzburg-Landau theory, demonstrating that the intertwining of magnetic and triplet superconducting orders can stabilize an odd-parity FFLO state.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Experimental study of superconducting diode effect in heavy fermion UTe2; high-quality transport measurement.", "tags": ["superconduct", "transport", "heavyfermion"], "image": "https://arxiv.org/html/2610.36332v1/MainFig1_illustration_note.png", "briefing": {"background": "초전도체에서 시간 반전 및 공간 반전 대칭성이 깨지면 전류의 방향에 따라 임계 전류값이 달라지는 초전도 다이오드 효과(SDE)가 발생합니다. 이는 비등방성 초전도체 연구의 핵심 주제 중 하나입니다.", "motivation": "희토류 기반 중페르미온 물질 UTe2는 삼중항 초전도체 후보 물질입니다. 강한 자기장에서 나타나는 이 물질의 특수한 SDE가 단순한 와류 고정(vortex pinning) 때문인지, 아니면 내부적인 대칭성 파괴에 의한 것인지 규명하고자 했습니다.", "result": "33.6T의 매우 높은 자기장에서 33%라는 큰 SDE 효율을 확인했습니다. 이는 자기장 유도 상전이 경계 근처에서만 나타나며, 외부적 요인이 아닌 비등방성 홀-스핀 쌍 생성(FFLO 상태와 유사한 홀수 패리티 상태)에 기인함을 시사합니다.", "implication": "UTe2가 내부적으로 비등방성 삼중항 초전도성을 가지고 있음을 강력하게 뒷받침하며, 강한 자기장 하에서 초전도-자기 질서의 상호작용을 이해하는 새로운 경로를 제시합니다.", "novelty": "지금까지 관측된 SDE 중 가장 높은 자기장에서의 측정이며, 중페르미온 삼중항 초전도체에서의 FFLO 상태 발현 가능성을 실험적으로 구체화했다는 점이 중요합니다.", "unresolved": "제시된 이론적 모델은 현상론적 Ginzburg-Landau 접근에 의존하고 있어, 실제 미시적 파동 함수의 대칭성을 결정짓는 정확한 증거는 추가적인 위상 민감도 측정이 필요합니다.", "future_work": "저온/강자장 환경에서의 STM/STS를 통한 국소 상태 밀도 관측이나, 위상학적 성질을 직접 검증할 수 있는 광학적 측정이 요구됩니다.", "concepts": [{"term": "Superconducting Diode Effect", "why_emerged": "비등방성 소자 개발 및 초전도 상태의 대칭성 확인을 위한 수단으로 주목받음.", "origin": "최근 수년간 강한 스핀-궤도 결합을 가진 물질에서 활발히 연구됨.", "connections": "Non-reciprocal transport, broken inversion symmetry와 연결됨."}, {"term": "FFLO state", "why_emerged": "강한 자기장에서 전자 쌍의 스핀 정렬에 의한 파괴를 방지하기 위해 유한한 운동량을 가진 쌍 형성이 필요함.", "origin": "Fulde-Ferrell-Larkin-Ovchinnikov에 의해 제안됨.", "connections": "Triplet pairing, nonuniform superconductivity."}], "english_summary": ["Reports a large superconducting diode effect in bulk UTe2 at 33.6 T.", "Links nonreciprocal transport to field-induced phase boundaries.", "Argues for spontaneous inversion symmetry breaking and triplet FFLO-like pairing.", "Provides phenomenological GL modeling of the interplay between magnetism and triplet superconductivity."]}}, {"title": "Magnetic Field Control of the N\\'eel Vector and Magnon Visibility in Altermagnetic MnTe", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2607.08829", "authors": "Tobias Weber, Niclas Heinsdorf, Shane Smolenski, et al.", "last_authors": "Na Hyun Jo, Denis Karaiskaj", "summary": "Altermagnetic order gives rise to momentum-dependent spin splitting of electronic and magnonic excitations even in the absence of a net magnetization. Here, we investigate the magnetic field dependence of the spin-wave spectrum of altermagnetic $\\alpha$-MnTe using inelastic neutron scattering and linear spin-wave theory. An in-plane magnetic field continuously reorients the N\\'eel vector by overcoming the weak crystalline anisotropy, while remaining small compared with the dominant exchange scale. We find that this reorientation leaves the magnon energies and line widths essentially unchanged, but strongly modifies the measured spectral intensity through the transverse-momentum projection. Our results demonstrate a clear separation between the soft orientational degree of freedom of the antiferromagnetic order and the robust exchange-dominated chiral magnon spectrum. This combination establishes $\\alpha$-MnTe as a platform for reconfigurable magnon coupling, in which external fields tune how excitations interact with polarized probes without substantially altering their frequency or coherence.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Direct experimental study (neutron scattering) of an altermagnetic material.", "tags": ["altermagnet", "neutronscattering", "magnon"], "image": "https://arxiv.org/html/2607.08829v2/figures/model_0T.png", "briefing": {"background": "Altermagnetism은 순자화가 없음에도 불구하고 스핀 분할(spin splitting)이 나타나는 자기 질서입니다. 이는 기존의 강자성이나 반강자성과 다른 새로운 물질 상태로, 전자 구조의 위상학적 특성과 밀접하게 연결되어 있습니다.", "motivation": "반강자성체인 MnTe에서 외부 자기장을 통해 네일 벡터(Néel vector)를 재배향할 때, 스핀파(magnon) 스펙트럼과 그 가시성이 어떻게 변화하는지 확인하고자 했습니다.", "result": "자기장 인가에 따라 네일 벡터는 변하지만, 마그논 에너지 자체는 거의 변화하지 않음을 관측했습니다. 대신 스펙트럼 강도가 자기장에 의해 변하는데, 이는 외부 탐침과의 상호작용을 자기장으로 조절할 수 있음을 의미합니다.", "implication": "알터자성체에서의 마그논을 외부 필드로 능동적으로 제어할 수 있는 가능성을 입증하여, 스핀트로닉스 소자 응용을 위한 기초를 마련했습니다.", "novelty": "알터자성체에서의 스핀파 스펙트럼 분리와 외부 필드에 의한 제어 가능성을 직접 증명했으며, 향후 위상학적 마그논 연구에 중요한 데이터를 제공합니다.", "unresolved": "더 높은 에너지 영역에서의 마그논-전자 결합 강도 변화나, 특정 방향으로의 스핀 전류 생성 여부는 추가 연구가 필요합니다.", "future_work": "다른 알터자성 물질 시스템에서의 마그논 수송 특성 조사 및 초고속 레이저 펄스를 이용한 마그논 동역학 관측이 유망합니다.", "concepts": [{"term": "Altermagnetism", "why_emerged": "넷 자기화 없이 스핀 분할이 나타나는 새로운 자기 질서 규명의 필요성.", "origin": "최근 1-2년 사이 이론적으로 정의되고 실험적으로 확인됨.", "connections": "Antiferromagnetism, spin-split band structure."}, {"term": "Néel vector", "why_emerged": "반강자성체에서 자기 질서를 기술하기 위해 필요함.", "origin": "Louis Néel이 1930년대 제안.", "connections": "Spin-wave theory, magnetic anisotropy."}], "english_summary": ["Investigates magnetic field control of the Néel vector in altermagnetic MnTe.", "Finds magnon energies robust against field reorientation.", "Observes modulation of spectral intensity via momentum projection.", "Identifies MnTe as a platform for tunable magnon coupling."]}}, {"title": "Planckian dissipation per unit critical entropy as a coupling-free probe of the strange-metal bath", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2610.35939", "authors": "Dino \\v{S}krgi\\'c, Dejan Stojkovic", "last_authors": "Dino \\v{S}krgi\\'c, Dejan Stojkovic", "summary": "Strange metals pair a resistivity linear in temperature with a specific heat $C/T$ rising logarithmically on cooling. We find that, if electrons scatter off a local critical bath, the coupling cancels in the ratio $Q$ of their coefficients, leaving two measurable numbers: how slowly the bath relaxes, seen in photoemission or optics, and the share of critical entropy that relaxes current. Baths form classes: $Q\\le4.91$ for a conformal bath, as SYK models confirm; 9--15 for the Yukawa--SYK field; and far less for Kondo lattices. LSCO, at $Q\\approx9$, exceeds the conformal bound, pointing to the Yukawa--SYK field.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Connects strange metal physics to photoemission observables; highly relevant to correlated electron systems.", "tags": ["photoemission", "strangemetal", "transport"], "image": "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAsAAAAOCAYAAAD5YeaVAAAAAXNSR0IArs4c6QAAAAZiS0dEAP8A/wD/oL2nkwAAAAlwSFlzAAALEwAACxMBAJqcGAAAAAd0SU1FB9wKExQZLWTEaOUAAAAddEVYdENvbW1lbnQAQ3JlYXRlZCB3aXRoIFRoZSBHSU1Q72QlbgAAAdpJREFUKM9tkL+L2nAARz9fPZNCKFapUn8kyI0e4iRHSR1Kb8ng0lJw6FYHFwv2LwhOpcWxTjeUunYqOmqd6hEoRDhtDWdA8ApRYsSUCDHNt5ul13vz4w0vWCgUnnEc975arX6ORqN3VqtVZbfbTQC4uEHANM3jSqXymFI6yWazP2KxWAXAL9zCUa1Wy2tXVxheKA9YNoR8Pt+aTqe4FVVVvz05O6MBhqUIBGk8Hn8HAOVy+T+XLJfLS4ZhTiRJgqIoVBRFIoric47jPnmeB1mW/9rr9ZpSSn3Lsmir1fJZlqWlUonKsvwWwD8ymc/nXwVBeLjf7xEKhdBut9Hr9WgmkyGEkJwsy5eHG5vN5g0AKIoCAEgkEkin0wQAfN9/cXPdheu6P33fBwB4ngcAcByHJpPJl+fn54mD3Gg0NrquXxeLRQAAwzAYj8cwTZPwPH9/sVg8PXweDAauqqr2cDjEer1GJBLBZDJBs9mE4zjwfZ85lAGg2+06hmGgXq+j3+/DsixYlgVN03a9Xu8jgCNCyIegIAgx13Vfd7vdu+FweG8YRkjXdWy329+dTgeSJD3ieZ7RNO0VAXAPwDEAO5VKndi2fWrb9jWl9Esul6PZbDY9Go1OZ7PZ9z/lyuD3OozU2wAAAABJRU5ErkJggg==", "briefing": {"background": "이상 금속(Strange metal)은 고온 초전도체와 같은 강상관 전자계에서 나타나는 현상으로, 저항이 온도에 선형적으로 비례하며 페르미 액체 이론을 따르지 않는 특징을 보입니다. 이러한 상태의 배후에 있는 물리적 기작을 규명하는 것은 현대 응집물질물리학의 핵심 과제 중 하나입니다.", "motivation": "이상 금속의 거동을 설명하기 위해 제안된 다양한 이론 모델(SYK, 유카와-SYK 등)들이 실험적 관측값과 얼마나 잘 부합하는지 정량적으로 비교할 수 있는 보편적인 척도를 찾고자 합니다.", "result": "비열과 전기 저항 계수 간의 비인 'Q값'을 정의하여, 이를 통해 다양한 산란 모델을 분류했습니다. LSCO 물질에서 관측된 Q값은 등각(conformal) 모델의 한계를 넘어서며, 유카와-SYK 모델에 더 가깝다는 점을 제시했습니다.", "implication": "광전자 분광학(ARPES)이나 광학 측정을 통해 얻은 수치를 이론적 모델과 직접 비교함으로써, 복잡한 강상관 시스템의 전자 산란 기작을 검증하는 새로운 프레임워크를 제공합니다.", "novelty": "커플링 상수(coupling strength)의 영향을 제거한 범용적인 보편 비율(Q)을 제시하여, 실험과 이론을 직접적으로 잇는 정량적 도구를 제공한다는 점이 독창적입니다.", "unresolved": "실제 다양한 강상관 물질군(쿠프레이트 외 다른 시스템)에 대한 범용적인 실험 데이터 확보가 필요하며, 더 복잡한 격자 구조의 영향은 아직 완전히 다뤄지지 않았습니다.", "future_work": "다양한 강상관 물질에 대한 ARPES 및 열역학 데이터와의 정밀 비교 연구가 이어질 것으로 보입니다.", "concepts": [{"term": "Strange metal", "why_emerged": "기존 페르미 액체 이론으로 설명되지 않는 선형 온도 의존 저항을 보이는 물질 상태를 설명하기 위해 필요했습니다.", "origin": "Anderson P.W. 등에 의해 논의되기 시작함.", "connections": "고온 초전도체, 페르미 면의 붕괴, 양자 임계점 현상."}, {"term": "SYK model", "why_emerged": "양자 중력 이론과의 연결성 및 강하게 상호작용하는 다체 시스템의 가해성(solvability)을 찾기 위해 도입되었습니다.", "origin": "Sachdev, Ye, Kitaev에 의해 제안됨.", "connections": "AdS/CFT 대응, 양자 정보 이론, 블랙홀 물리학."}], "english_summary": ["The paper introduces a universal dimensionless ratio Q to characterize strange metal behavior.", "Q is derived from the ratio of resistivity coefficients and specific heat, offering a coupling-independent probe.", "Comparing experimental data (LSCO) to theory suggests a Yukawa-SYK bath is a more suitable model than conformal baths.", "This framework provides a direct way to interpret spectroscopic and transport data in strongly correlated systems."]}}, {"title": "Proximity-Induced Giant Majorana Spin Response in a UTe2-Metal Film Heterostructure", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2610.36053", "authors": "Jushin Tei, Makoto Shimizu, Yukio Tanaka, Satoshi Fujimoto, Takeshi Mizushima", "last_authors": "Satoshi Fujimoto, Takeshi Mizushima", "summary": "We establish an experimentally accessible route to identifying Majorana surface states through their intrinsic Ising spin response, using UTe$_2$ as a concrete platform. The key is to extend the Majorana correlations into an adjacent metallic film via the superconducting proximity effect, thereby making the otherwise surface-localized response accessible to NMR measurements. Remarkably, disorder further sharpens the Majorana signature: impurity scattering suppresses the conventional $p$-wave proximity correlations while preserving the Majorana contribution, yielding a giant Ising-anisotropic enhancement of the NMR relaxation rate. This approach also offers a powerful means to distinguish among candidate pairing symmetries.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "UTe2 superconductor heterostructure and Majorana physics are very relevant to the reader's interest.", "tags": ["superconductor", "Majorana", "heterostructure"], "image": "https://arxiv.org/html/2610.36053v1/Fig1.png", "briefing": {"background": "위상 초전도체 후보 물질인 UTe2는 특이한 초전도 대칭성을 가질 것으로 예상되며, 그 표면에 나타나는 마요라나 준입자는 양자 컴퓨팅의 핵심 요소로 주목받고 있습니다.", "motivation": "마요라나 상태는 표면에 국한되어 있어 내부 벌크 물성을 측정하는 NMR 등으로 검출하기 매우 어렵습니다. 이를 보완할 수 있는 효과적인 측정 방법을 찾고자 합니다.", "result": "UTe2와 금속 박막을 접합하여 근접 효과(proximity effect)를 유도함으로써 마요라나 상태를 금속층으로 확장시켰습니다. 특히 무질서가 있는 환경에서 일반적인 p-파 초전도 상관관계는 억제되지만 마요라나 특징은 살아남아 NMR 신호를 강화함을 보였습니다.", "implication": "NMR과 같은 도구를 사용하여 마요라나 준입자의 존재를 확인하고, 초전도체 내부의 페어링 대칭성을 판별할 수 있는 새로운 경로를 열었습니다.", "novelty": "무질서가 오히려 마요라나 신호를 더 뚜렷하게 만든다는 역설적인 메커니즘을 제시하여 실험적 검증의 가능성을 크게 높였습니다.", "unresolved": "실제 실험에서 구현될 이질 구조(heterostructure)의 계면 품질이 결과에 미치는 영향은 추가 검증이 필요합니다.", "future_work": "UTe2 기반의 박막 소자 제작 및 저온 NMR을 통한 실제 실험적 검증이 기대됩니다.", "concepts": [{"term": "Majorana fermion", "why_emerged": "입자와 반입자가 동일한 성질을 가진 페르미온으로, 위상 양자 컴퓨팅의 비국소적 정보를 저장하는 데 필수적입니다.", "origin": "Ettore Majorana에 의해 이론적으로 예견됨.", "connections": "위상 초전도체, 나노와이어 소자, 비아벨 통계."}, {"term": "Proximity effect", "why_emerged": "초전도 현상이 직접적으로 나타나지 않는 금속에 초전도 쌍을 유도하여 물성을 관찰하기 위해 필요합니다.", "origin": "초기 BCS 이론 발전 과정에서 정립됨.", "connections": "죠셉슨 접합, 안드레예프 반사, 위상 소자."}], "english_summary": ["Proposes an experimental setup using UTe2/metal heterostructures to detect Majorana surface states.", "Uses proximity effect to extend Majorana signatures into an adjacent metal layer for NMR access.", "Disorder helps suppress trivial p-wave pairing while enhancing the Majorana Ising spin response.", "Provides a promising method to identify pairing symmetry and Majorana physics in UTe2."]}}, {"title": "Real-Space Selection Rule for Moir\\'e Exciton-Phonon Coupling", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2610.36782", "authors": "Yixuan Liu, Shiyu Peng, Yifan Wang, Peiyao Qin, Wang Yao, Chen Hu", "last_authors": "Wang Yao, Chen Hu", "summary": "Exciton-phonon coupling (ExPC) governs energy relaxation and exciton dynamics in photoexcited quantum materials. Recent advances have revealed rich and tunable excitonic phenomena in moir\\'e superlattices, yet the microscopic mechanisms underlying the coupling between moir\\'e excitons and moir\\'e phonons remain elusive. Here, we develop a real-space representation for moir\\'e ExPC based on a unified theoretical framework combining the many-body Bethe-Salpeter equation with phonon perturbation theory. Furthermore, we uncover a general real-space selection rule: the spatial matching of a moir\\'e exciton's electron and hole densities with the moir\\'e-phonon-induced potential perturbations determines their individual coupling contributions, while coherent interference between the electron and hole contributions controls the total ExPC. We demonstrate this rule in prototypical WSe2/WS2 moir\\'e heterobilayers, revealing pronounced exciton- and phonon-mode-dependent coupling, including nearly complete suppression of ExPC through destructive electron-hole interference. These findings establish the internal electron-hole spatial configuration of moir\\'e excitons as a key degree of freedom governing the strength and mode selectivity of their coupling to moir\\'e phonons, opening opportunities to engineer ExPC through spatially tailored moir\\'e potentials.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Important contribution to interpreting spectroscopy/exciton physics in moiré heterostructures.", "tags": ["moire", "phonon", "exciton"], "image": "https://arxiv.org/static/browse/0.3.4/images/arxiv-logo-fb.png", "briefing": {"background": "반데르발스 이종접합에서 나타나는 모아레(moiré) 패턴은 전자와 포논의 상호작용을 극도로 정밀하게 제어할 수 있는 플랫폼을 제공합니다.", "motivation": "모아레 초격자 내에서 엑시톤과 포논 간의 결합(ExPC)이 에너지를 완화하고 동역학을 결정하는데, 그 미시적 선택 규칙이 아직 밝혀지지 않아 이를 정립하고자 합니다.", "result": "엑시톤의 전자-정공 밀도 분포와 포논에 의한 퍼텐셜 변화 간의 공간적 중첩이 결합 강도를 결정한다는 실공간 선택 규칙을 수립했습니다.", "implication": "모아레 격자 설계를 통해 전자-정공의 파동함수를 제어함으로써 엑시톤-포논 결합을 원하는 대로 강화하거나 완전히 억제하는 '맞춤형' 광학 소자 설계가 가능해집니다.", "novelty": "복잡한 수치 계산 없이도 실공간 파동함수의 중첩이라는 직관적인 방식으로 ExPC를 이해할 수 있는 일반적인 규칙을 제시했습니다.", "unresolved": "다양한 물질 조합에서의 실험적 데이터와 이론적 모델의 완벽한 일치 여부는 아직 더 많은 시스템에서의 확인이 필요합니다.", "future_work": "다양한 전이금속 칼코겐 화합물 조합을 통한 광학적 특성 제어 및 초고속 분광학 실험이 예상됩니다.", "concepts": [{"term": "Moiré exciton", "why_emerged": "두 층 이상의 격자 불일치로 생긴 주기적 퍼텐셜에 엑시톤이 갇히면서 나타나는 새로운 엑시톤 상태를 설명하기 위함입니다.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "반데르발스 이종접합, 엑시톤 트랩, 모아레 물리학."}, {"term": "Bethe-Salpeter equation", "why_emerged": "고체 내에서 전자와 정공 간의 강한 상호작용(쿨롱 인력)을 포함한 엑시톤의 에너지를 계산하기 위해 필수적입니다.", "origin": "Hans Bethe와 Edwin Salpeter가 제안함.", "connections": "GW 근사, 다체 섭동 이론, 광학 흡수 스펙트럼."}], "english_summary": ["Develops a theoretical framework for real-space moiré exciton-phonon coupling.", "Establishes a selection rule based on spatial matching between exciton electron-hole density and phonon potential.", "Demonstrates that destructive electron-hole interference can nearly suppress exciton-phonon coupling.", "Enables engineering of excitonic dynamics in van der Waals heterostructures through tailored moiré potentials."]}}, {"title": "Spontaneous topological diode effect induced by non-coplanar antiferromagnetic order", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2610.37003", "authors": "Nguyen Duy Khanh, Hirotaka Takagi, Rina Takagi, et al.", "last_authors": "Ryotaro Arita, Shinichiro Seki", "summary": "In non-centrosymmetric bulk materials, electrons flowing in the opposite directions often exhibit different properties. This diode-like effect (i.e., non-reciprocal electron transport) typically originates from relativistic spin-orbit coupling, and its amplitude scales with external magnetic field or magnetization in ferromagnets. Although such rectification is usually absent in antiferromagnets at zero field, recent theories predict that non-coplanar antiferromagnetic order can host large non-reciprocity even without spin-orbit coupling, magnetization or external magnetic fields. This phenomenon - the spontaneous topological diode effect - can potentially be used for efficient electrical readout of antiferromagnetic domains, while it has not been verified for real materials. Here, we report the observation of this effect in a chiral-lattice non-coplanar antiferromagnet CoTa3S6. Nonlinear resistivity measurements reveal the non reciprocal nature of electron transport along the [001] direction at zero field. The observed non-reciprocity exceeds that in typical ferromagnets, whose amplitude is governed by antiferromagnetic order parameter rather than magnetization. First-principles calculations show that the non-coplanar antiferromagnetic order induces asymmetric band dispersions even without spin-orbit coupling, establishing the non-relativistic origin of the observed response. The present findings demonstrate a new mechanism for efficient electrical readout of antiferromagnetic domains, and highlight non-coplanar antiferromagnets as a promising material platform for realizing ferromagnet-like functional responses without relying on spin-orbit coupling or magnetization.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Topological transport in a chiral non-coplanar antiferromagnet; relevant to topological/magnetic interests.", "tags": ["topological", "antiferromagnet", "transport"], "image": "https://arxiv.org/html/2610.37003v1/Fig1.png", "briefing": {"background": "비중심대칭 물질에서 전하 흐름의 방향에 따라 저항이 달라지는 비가역적 전기 수송 현상(다이오드 효과)은 주로 스핀-궤도 결합(SOC)과 외부 자기장에 의존해 왔습니다. 반강자성체는 자화값이 0이므로 이러한 효과를 구현하기 어렵다는 것이 일반적인 물리적 통념이었습니다.", "motivation": "최근 이론 연구들은 비공면(non-coplanar) 반강자성 구조가 SOC나 외부 자기장 없이도 자발적으로 비가역적 수송을 유도할 수 있음을 제시했습니다. 이 연구는 CoTa3S6 물질을 통해 이러한 이론적 예측을 실험적으로 검증하고자 합니다.", "result": "CoTa3S6에서 외부 자기장 없이 [001] 방향의 비선형 저항을 측정하여 자발적 위상 다이오드 효과를 확인했습니다. 제1원리 계산을 통해 이 현상이 SOC에 의존하지 않는 비공면 반강자성 차수로부터 유도된 비대칭 밴드 분산에 기인함을 밝혔습니다.", "implication": "이 결과는 반강자성 도메인을 외부 자기장이나 SOC의 도움 없이 전기적으로 읽어낼 수 있는 새로운 경로를 제시하며, 반강자성 기반 소자 설계에 중요한 플랫폼을 제공합니다.", "novelty": "기존 강자성체 기반 소자의 한계인 외부 자기장 의존성을 극복하고, 자성-위상 물리학(magnetic topological physics)에서 반강자성체의 새로운 활용 가능성을 증명했다는 점이 귀하의 관심사와 잘 부합합니다.", "unresolved": "실제 소자 구현 시 도메인   const badges = document.createElement('div');

  else { title.textContent = r.title || ''; }

  if (r.last_authors || r.authors) { const authors = document.createElement('p'); authors.className = 'authors'; if (r.last_authors) authors.append('Last authors: ' + r.last_authors); if (r.authors) authors.append((r.last_authors ? ' | ' : '') + 'Authors: ' + r.authors); headText.appendChild(authors); }

  if (r.link) { const link = document.createElement('a'); link.className = 'link'; link.href = r.link; link.target = '_blank'; link.rel = 'noopener noreferrer'; link.textContent = 'Open paper'; headText.appendChild(link); }
  head.appendChild(headText);
