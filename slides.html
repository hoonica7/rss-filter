: ["theory", "superconductivity", "graphene", "topological", "quantumgeometry"], "image": "", "briefing": {"background": "그래핀이나 마름모계(rhombohedral) 그래핀과 같은 키랄 2차원 전자 기체 시스템은 모멘텀 공간에서 특이한 소용돌이(vortices) 구조를 가지며, 상호작용에 의해 토폴로지컬한 홀데인 상(Haldane phase)이 유도될 수 있습니다.", "motivation": "반전 대칭성이 보존되는 홀데인 상에서 양자 기하학(Quantum Geometry)적 특성이 초전도 쌍 형성(pairing)에 어떤 영향을 미치는지 분석하고자 했습니다.", "result": "연구진은 시스템의 양자 기하학적 구조에 의해 유도되는 '케쿨레 초전도(Kekulé Superconductivity)' 상태를 발견했습니다. 이는 베리 곡률(Berry curvature)과 양자 메트릭(quantum metric)이 초전도 응축물의 특성을 결정하는 핵심 요소임을 보여줍니다.", "implication": "밴드 토폴로지가 단순히 수송 현상뿐만 아니라, 초전도 질서 매개변수의 대칭성(예: Kekulé 패턴)까지도 지배할 수 있음을 입증했습니다.", "novelty": "독자의 관심사인 베리 곡률, 양자 기하학, 그리고 그래핀 시스템에서의 초전도를 연결한 연구입니다. 특히 토폴로지컬 상에서 기하학적 효과가 초전도 형성을 주도한다는 점이 독창적입니다.", "unresolved": "실제 실험에서 홀데인 상을 안정적으로 구현하고, 이로 인해 유도된 초전도의 케쿨레 대칭성을 검출할 수 있는 구체적인 측정 기법이 논의되어야 합니다.", "future_work": "주사 터널링 현미경(STM)을 이용한 원자 단위의 초전도 갭 매핑을 통해 케쿨레 패턴의 변조를 직접 확인하는 연구가 유망합니다.", "concepts": [{"term": "케쿨레 초전도 (Kekulé Superconductivity)", "why_emerged": "그래핀 격자에서 탄소-탄소 결합 농도가 케쿨레 구조로 주기적으로 변조되면서 나타나는 초전도 상을 설명하기 위해 도입되었습니다.", "origin": "초록 정보만으로는 특정하기 어려움 (Kekulé 벤젠 구조에서 유래).", "connections": "그래핀, 밸리 물리 (Valley physics), 전하 밀도파"}, {"term": "양자 기하학 (Quantum Geometry)", "why_emerged": "파동 함수의 위상뿐만 아니라 힐베르트 공간에서의 거리(metric)가 물리적 성질에 미치는 영향을 설명하기 위해 필요합니다.", "origin": "초록 정보만으로는 특정하기 어려우나, Berry(1984) 이후 확장된 개념.", "connections": "베리 곡률, 양자 메트릭, 플랫 밴드 초전도"}, {"term": "홀데인 상 (Haldane Phase)", "why_emerged": "격자 모델에서 순수한 토폴로지컬 효과에 의해 시간 반전 대칭성이 깨지거나 보존되면서 나타나는 절연 상태를 설명합니다.", "origin": "F. D. M. Haldane (1988).", "connections": "이상 홀 효과 (AHE), 토폴로지컬 절연체, 처수(Chern number)"}], "english_summary": ["Investigates pairing interactions in topological Haldane phases of chiral 2D electron gases.", "Identifies Kekulé superconductivity as a result of the underlying quantum geometry.", "Demonstrates how Berry curvature and quantum metric induce specific superconducting symmetries.", "Links band topology directly to the formation of unconventional superconducting orders in graphene-like systems."]}}, {"title": "Similarity of Fractional Chern Insulators to Fractional Quantum Hall States: Moiré-Enhanced Gaps and Excitation-Spectrum Correspondence", "journal": "PRL_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/l6sm-yzbn", "authors": "Siddhartha Sarkar, Yitong Zhang, Kai Sun", "last_authors": "Yitong Zhang, Kai Sun", "summary": "The excitation spectrum of fractional Chern insulators is identical to their fractional quantum Hall counterparts except for an enhancement factor, making it possible to predict their excitation spectrum from the Landau-level problem.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Theory on fractional Chern insulators and moiré systems, connecting to quantum Hall states.", "tags": ["theory", "fractionalquantumHall", "Cherninsulator", "moirésystems"], "image": "", "briefing": {"background": "강한 자기장 없이도 격자 구조 자체의 위상적 성질을 이용해 분수 양자 홀 효과(FQHE)와 유사한 현상을 구현하는 분수 천 절연체(FCI)는 최근 모아레(Moiré) 시스템의 등장으로 큰 주목을 받고 있습니다.", "motivation": "FCI와 기존 란다우 레벨 기반의 FQH 상태 사이의 구체적인 들뜸 스펙트럼(excitation spectrum)의 정량적 관계와 모아레 시스템에서 나타나는 에너지 갭 강화 현상을 물리적으로 규명하고자 했습니다.", "result": "FCI의 들뜸 스펙트럼이 대응하는 FQH 상태와 구조적으로 동일하며, 단지 모아레 포텐셜에 의한 '강화 인자(enhancement factor)'만큼 차이가 난다는 것을 발견했습니다. 이는 란다우 레벨 문제로부터 FCI의 물리량을 직접 예측할 수 있게 합니다.", "implication": "모아레 천 밴드에서 관측되는 큰 에너지 갭의 근원을 설명하며, 복잡한 격자 계산 없이도 란다우 레벨 물리를 활용해 FCI 시스템을 설계하고 이해할 수 있는 보편적 규칙을 제시합니다.", "novelty": "이론적으로 FCI와 FQH 사이의 스펙트럼 대응성을 명확히 확립했으며, 독자의 관심사인 그래핀/모아레 시스템에서의 위상 상태 제어에 중요한 이론적 근거를 제공합니다.", "unresolved": "실제 실험에서 나타나는 밴드 혼합(band mixing)이나 무질서(disorder)가 이러한 스펙트럼의 유사성을 얼마나 훼손할 수 있는지는 추가 연구가 필요합니다.", "future_work": "다른 충진율(fractional filling)에서의 일반화 및 실험적인 들뜸 스펙트럼 측정(예: 비탄성 산란)을 통한 검증이 기대됩니다.", "concepts": [{"term": "분수 천 절연체 (Fractional Chern Insulator)", "why_emerged": "외부 자기장 없이 격자의 위상적 성질만으로 분수 양자 홀 효과를 구현하기 위해 제안되었습니다.", "origin": "2011년경 여러 이론 그룹에 의해 독립적으로 제안됨.", "connections": "분수 양자 홀 효과(FQHE), 천 수(Chern number), 모아레 초격자."}, {"term": "모아레 시스템 (Moiré Systems)", "why_emerged": "두 층의 격자를 비틀어 쌓음으로써 평탄 밴드(flat band)를 형성하고 강상관 물성을 유도하기 위해 사용됩니다.", "origin": "비틀린 이중층 그래핀 연구에서 본격화됨.", "connections": "마법 각도 그래핀, 강상관 전자계, FCI."}, {"term": "들뜸 스펙트럼 (Excitation Spectrum)", "why_emerged": "바닥 상태뿐만 아니라 시스템의 동역학적 성질과 위상적 안정성을 이해하기 위해 필수적입니다.", "origin": "초록 정보만으로는 특정하기 어려움 (양자 역학의 기본 개념).", "connections": "에너지 갭, 준입자(quasiparticle), 중성 부피 들뜸(neutral bulk excitations)."}], "english_summary": ["Demonstrates a quantitative mapping between the excitation spectra of fractional Chern insulators and fractional quantum Hall states.", "Identifies a moiré-induced enhancement factor that scales the energy gaps in topological flat bands.", "Provides a predictive framework to study FCI properties using established Landau-level physics.", "Validates why moiré systems exhibit robust fractional states due to enhanced energy scales."]}}, {"title": "Spinless Charged Excitation at the Interface between a Conventional Topological Insulator and a Topological Mott Insulator", "journal": "PRL_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/p38y-wyrj", "authors": "Cesar A. Gallegos, Andrew J. Millis, Steven R. White", "last_authors": "Andrew J. Millis, Steven R. White", "summary": "We investigate the interface separating two topologically distinct insulating phases of matter using extensive density-matrix renormalization group calculations to study the triangular-lattice Hofstadter-Hubbard model with a spatially varying interaction strength, chosen to realize both integer quan…", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Theory of interfaces between topological and Mott insulators, involving strongly correlated electrons, highly relevant.", "tags": ["theory", "topologicalinsulator", "Mottinsulator", "stronglycorrelatedelectrons", "DMRG"], "image": "", "briefing": {"background": "위상 절연체(TI)는 밴드 구조에 의해 정의되는 반면, 위상 Mott 절연체(TMI)는 강한 전자 간 상호작용에 의해 위상적 성질이 나타나는 상태입니다.", "motivation": "단순한 비상호작용 위상 상태와 강상관 위상 상태가 만나는 계면(interface)에서 어떤 특이한 양자 상태가 창발되는지 탐구하고자 했습니다.", "result": "DMRG 계산을 통해 두 상의 경계에서 스핀은 없고 전하만 가진 특이한 들뜸(spinless charged excitation)이 존재함을 발견했습니다. 이는 계면의 위상적 전하 이동을 반영합니다.", "implication": "강상관 계면 물리학에서 스핀-전하 분리와 유사한 비전통적 입자의 존재를 시사하며, 새로운 위상 소자 설계의 기초가 될 수 있습니다.", "novelty": "전통적인 TI와 TMI의 결합이라는 독특한 설정을 통해, 독자가 관심을 가지는 1D적 성질(스핀-전하 분리 유사 거동)과 위상 물리를 강상관 관점에서 연결했습니다.", "unresolved": "계면의 거칠기나 실제 물질에서의 스핀-궤도 결합 세기에 따른 안정성 여부는 미지수입니다.", "future_work": "이러한 계면 상태를 STM/STS로 측정할 때 나타날 구체적인 터널링 스펙트럼 예측 연구가 필요합니다.", "concepts": [{"term": "위상 Mott 절연체 (Topological Mott Insulator)", "why_emerged": "전자 간 상호작용이 주도하여 자발적으로 대칭성을 깨거나 위상적 질서를 형성하는 상태를 설명하기 위해 등장했습니다.", "origin": "Raghu et al. (2008) 등에 의해 이론적으로 제안됨.", "connections": "강상관 전자계, 허바드 모델(Hubbard model), 위상 절연체."}, {"term": "DMRG (Density-Matrix Renormalization Group)", "why_emerged": "1차원 및 저차원 강상관 시스템의 바닥 상태 에너지를 매우 정확하게 계산하기 위해 개발되었습니다.", "origin": "Steven R. White (1992).", "connections": "행렬 곱 상태(MPS), 양자 다체계 시뮬레이션."}, {"term": "스핀-전하 분리 (Spin-charge separation)", "why_emerged": "1차원 계에서 전자의 스핀과 전하 자유도가 서로 다른 속도로 이동하는 현상을 설명하기 위해 고안되었습니다.", "origin": "Tomonaga-Luttinger 액체 이론.", "connections": "루팅어 액체, 준입자 붕괴, 계면 들뜸."}], "english_summary": ["Studies the interface between an integer quantum Hall (topological) insulator and a topological Mott insulator.", "Discovers spinless charged excitations localized at the boundary using DMRG calculations.", "Reveals how electronic correlations modify the boundary physics of topological phases.", "Connects topological order with strong correlation effects in a triangular lattice model."]}}, {"title": "Superconducting Proximity Effect in a Strongly Correlated Charge-Transfer Insulator", "journal": "PRL_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/xlxf-y4vg", "authors": "Mengya Ren, Yaoyao Chen, Yi-Xin Dai, et al.", "last_authors": "Yu Zhang, Yeliang Wang", "summary": "Proximity-induced superconductivity in strongly correlated insulators provides a versatile route for engineering quantum states and artificial systems with tailored functionalities. Yet microscopic interplay between superconductivity and correlated insulating states remains poorly understood. Here, …", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Important condensed matter paper on superconducting proximity in strongly correlated insulators.", "tags": ["superconductivity", "stronglycorrelated", "proximityeffect", "insulator"], "image": "", "briefing": {"background": "초전도체와 다른 물질을 접합했을 때 초전도성이 전파되는 근접 효과는 새로운 양자 상태(예: 마요라나 페르미온)를 만드는 핵심 기제입니다.", "motivation": "강한 상관관계가 있는 '전하 이동(charge-transfer) 절연체' 내에서 초전도 쌍이 어떻게 유도되고, 그 내부의 전자 상관계와 어떻게 상호작용하는지 이해하고자 했습니다.", "result": "강상관 절연체에 유도된 초전도 근접 효과가 일반적인 금속/절연체와는 다르며, 절연체의 전자 구조와 상관관계 세기에 의해 초전도 갭과 상태 밀도가 독특하게 변조됨을 확인했습니다.", "implication": "모트(Mott) 혹은 전하 이동 절연체를 기반으로 한 고온 초전도 유관 시스템이나 인공 양자 물질 설계에 중요한 지침을 제공합니다.", "novelty": "단순 밴드 절연체가 아닌, 독자가 관심을 갖는 구리 산화물(cuprates) 등의 물리와 직결된 '전하 이동 절연체'에서의 근접 효과를 다루었다는 점이 핵심입니다.", "unresolved": "실제 실험에서 절연층의 두께가 두꺼워질 때 초전도 결맞음(coherence)이 얼마나 유지될 수 있는가에 대한 정량적 한계.", "future_work": "STM을 이용한 국소적 상태 밀도(LDOS) 측정과 절연체 내의 자기적 질서가 초전도 쌍에 미치는 영향 조사.", "concepts": [{"term": "전하 이동 절연체 (Charge-transfer Insulator)", "why_emerged": "모트 절연체 중에서도 전하 갭이 양이온 사이의 쿨롱 반발력이 아닌 양이온-음이온 간 전하 이동 에너지에 의해 결정되는 물질군을 분류하기 위해 등장했습니다.", "origin": "Zaanen-Sawatzky-Allen (ZSA) 분류 (1985).", "connections": "구리 산화물(Cuprates), 강상관계, 모트 절연체."}, {"term": "초전도 근접 효과 (Superconducting Proximity Effect)", "why_emerged": "초전도체와 인접한 비초전도 물질 사이에 Cooper 쌍이 침투하여 초전도성을 띠게 되는 현상을 이용하기 위함입니다.", "origin": "초기 초전도 연구 역사와 함께 발전.", "connections": "Andreev 반사, 위상 초전도체, Josephson 접합."}, {"term": "강상관 전자계 (Strongly Correlated Systems)", "why_emerged": "전하 간의 강한 밀어내는 힘 때문에 기존의 독립 전자 근사가 통하지 않는 물질들을 설명하기 위해 필요합니다.", "origin": "모트(Mott)의 절연체 연구 등.", "connections": "고온 초전도, 양자 자성, 중성 페르미온."}], "english_summary": ["Investigates the superconducting proximity effect within a strongly correlated charge-transfer insulator.", "Reveals the microscopic interplay between Cooper pair penetration and electronic correlations.", "Suggests a route for engineering artificial quantum states in transition metal oxide heterostructures.", "Highlights the distinct behavior of induced superconductivity compared to conventional band insulators."]}}, {"title": "Terahertz Switching of Two-dimensional Antiferromagnetic Order", "journal": "PRL_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/kj1q-h9pw", "authors": "Chenyu Wang, En Wang, Yaxian Wang, Sheng Meng", "last_authors": "Yaxian Wang, Sheng Meng", "summary": "Identifying the transition pathway for ultrafast switching between distinct antiferromagnetic orders, while holding promise to realize unprecedentedly small and fast spin devices, remains largely unexplored. Herein, we show that rectifying structure with light can serve as a powerful tool to achieve…", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Experimental work on 2D antiferromagnetic switching, relevant to 2D materials and ultrafast phenomena.", "tags": ["antiferromagnetism", "2Dmaterials", "ultrafast", "experiment"], "image": "", "briefing": {"background": "2D 반데르발스 자성체 내에서 스핀 배열을 제어하는 기술은 차세대 초고속 저전력 정보 저장 소자 개발의 핵심 과제입니다.", "motivation": "서로 다른 반강자성 질서 사이의 초고속 스위칭 전이 경로를 규명하고 이를 효과적으로 제어할 수 있는 수단을 찾고자 했습니다.", "result": "테라헤르츠(THz) 빛을 이용하여 구조를 정류(rectifying)함으로써 2D 반강자성 상태 간의 스위칭이 가능하다는 메커니즘을 제시했습니다.", "implication": "광학적 수단을 통해 2D 자성체의 스핀 상태를 비접촉식으로, 그리고 초고속으로 제어할 수 있는 가능성을 열었습니다.", "novelty": "2D AFM 시스템에서 THz 유도 구조 제어라는 새로운 경로를 제안했으며, 이는 독자의 관심사인 알터마그네티즘 및 자성 위상 물질의 동역학 연구와 맞닿아 있습니다.", "unresolved": "실제 실험적 구현 시의 에너지 효율성 및 다양한 2D 자성 소재로의 범용성 확인이 필요합니다.", "future_work": "제시된 THz 스위칭 메커니즘을 다양한 2D 자성체에서 실험적으로 검증하고 스핀 동역학을 실시간으로 관측하는 연구가 예상됩니다.", "concepts": [{"term": "Antiferromagnetic Order", "why_emerged": "인접한 스핀이 반대 방향으로 정렬되어 외부 자기장에 둔감하면서도 빠른 동작이 가능한 자성 소자를 만들기 위해 연구되었습니다.", "origin": "Louis Néel에 의해 이론적으로 확립되었습니다.", "connections": "Néel 온도, 스핀파(magnon), 알터마그네티즘과 밀접한 연관이 있습니다."}, {"term": "Terahertz Switching", "why_emerged": "기존의 자기장이나 전류 기반 스위칭보다 훨씬 빠른 피코초 단위의 제어를 실현하기 위해 등장했습니다.", "origin": "초록 정보만으로는 특정하기 어려우나, 초고속 분광학 분야에서 지속적으로 발전해 왔습니다.", "connections": "Ultrafast optics, Floquet engineering, 자성체 동역학 등과 연결됩니다."}, {"term": "2D Magnetism", "why_emerged": "원자층 두께의 극한 상황에서도 자성이 유지되는지 확인하고 새로운 자성 소자 플랫폼을 찾기 위해 연구되었습니다.", "origin": "2017년 CrI3 및 FePS3 등에서 실험적으로 처음 입증되었습니다.", "connections": "Mermin-Wagner 정리, van der Waals 소재, 층간 교환 상호작용 등과 연결됩니다."}], "english_summary": ["Demonstrates terahertz-induced switching between different 2D antiferromagnetic orders.", "Identifies structural rectification by light as a key pathway for ultrafast control.", "Proposes a new mechanism for non-volatile and high-speed spintronic devices."]}}, {"title": "Giant elastoresistance in magic-angle twisted bilayer graphene", "journal": "Science", "source": "Gemini", "link": "https://www.science.org/doi/abs/10.1126/science.adz0597?af=R", "authors": "Xuetao Ma, Zhaoyu Liu, Jiaqi Cai, et al.", "last_authors": "Jiun-Haw Chu, Matthew Yankowitz", "summary": "Strongly correlated and topological phases in moiré materials are exquisitely sensitive to lattice geometry at both atomic and superlattice length scales. Twist angle, pressure, and strain directly modify the lattice and thus act as highly effective tuning parameters. Here, we examined electrical transport in twisted bilayer graphene subjected to continuous uniaxial strain. Near the magic angle (≈1.1°), devices exhibited a pronounced elastoresistance that depended on band filling and temperature, with a gauge factor more than two orders of magnitude larger than that of conventional metals. In selected doping regimes, the elastoresistance exhibited a Curie-Weiss–like temperature divergence. We discuss possible microscopic origins, including nematic fluctuations and enhanced electronic entropy from fluctuating isospin moments. Our work establishes uniaxial strain as a versatile probe of correlated physics in a moiré material.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Important transport study in moire systems relevant to correlated electronic states.", "tags": ["transport", "graphene", "moire"], "image": "", "briefing": {"background": "마법각 트위스트 이중층 그래핀(MATBG)과 같은 모아레 시스템은 격자의 미세한 변형에 따라 전자 상관관계와 위상적 성질이 크게 변합니다.", "motivation": "단축 변형(uniaxial strain)을 조절 인자로 사용하여 MATBG의 강상관 상태와 네마틱성(nematicity)의 기원을 규명하고자 했습니다.", "result": "마법각 근처에서 일반 금속보다 100배 이상 큰 거대 탄성 저항(giant elastoresistance)을 관측했으며, 특정 영역에서 Curie-Weiss 형태의 온도 의존성을 발견했습니다.", "implication": "관측된 탄성 저항의 발산은 시스템 내부에 강한 네마틱 요동(nematic fluctuations)이나 이소스핀(isospin) 모멘트와 관련된 엔트로피 효과가 존재함을 시사합니다.", "novelty": "독자의 핵심 관심사인 네마틱성과 수송 특성을 변형(strain) 제어를 통해 연결했으며, Jiun-Haw Chu 그룹의 정밀 탄성 저항 측정법을 모아레 시스템에 성공적으로 적용했습니다.", "unresolved": "관측된 네마틱 요동이 실제 대칭성 파괴 상전이로 이어지는지, 그리고 모아레 밴드 구조와 어떻게 직접적으로 결합하는지에 대한 정밀한 분석이 남아있습니다.", "future_work": "변형이 가해진 상태에서의 STM 또는 ARPES 측정을 통해 전자 구조의 국소적, 운동량 공간적 변화를 직접 관찰하는 연구가 기대됩니다.", "concepts": [{"term": "Elastoresistance", "why_emerged": "물질에 가해진 변형에 따른 저항 변화를 통해 전자계의 대칭성 파괴 감수성을 측정하기 위해 도입되었습니다.", "origin": "Jiun-Haw Chu 등에 의해 양자 재료의 네마틱성 측정 도구로 정립되었습니다.", "connections": "Electronic nematicity, Berezinskii-Kosterlitz-Thouless 상전이, 철계 초전도체 등과 연결됩니다."}, {"term": "Magic-angle TBG", "why_emerged": "그래핀의 밴드를 평탄하게 만들어 전자 간의 상관관계를 극대화하기 위해 특정 각도(약 1.1도)를 설정했습니다.", "origin": "2018년 Pablo Jarillo-Herrero 그룹에 의해 초전도 현상이 발견되며 주목받았습니다.", "connections": "Moiré superlattice, Flat band, Unconventional superconductivity와 연결됩니다."}, {"term": "Nematic Fluctuations", "why_emerged": "결정 구조의 대칭성보다 낮은 대칭성을 갖는 전자적 질서가 형성되기 직전의 요동 현상을 이해하기 위해 연구됩니다.", "origin": "액정 이론에서 유래하여 강상관 전자계(구프레이트, 철계 초전도체)로 확장되었습니다.", "connections": "Symmetry breaking, Quantum criticality, Elastoresistance와 밀접합니다."}, {"term": "Isospin Moments", "why_emerged": "그래핀의 스핀과 골짜기(valley) 자유도가 결합하여 형성되는 다중 퇴행 상태를 설명하기 위해 도입되었습니다.", "origin": "초록 정보만으로는 특정하기 어려우나, 모아레 물리 이론에서 널리 쓰이는 개념입니다.", "connections": "Valleytronics, Symmetry-broken insulators, Chern insulators와 연결됩니다."}], "english_summary": ["Reports giant elastoresistance in magic-angle twisted bilayer graphene under strain.", "Shows a Curie-Weiss-like divergence, pointing to strong nematic fluctuations.", "Establishes uniaxial strain as a powerful probe for studying isospin and correlated physics in moiré materials."]}}, {"title": "Electron-phonon coupling and electronic transport at the moiré scale in twisted bilayer graphene", "journal": "npj_QuantumMaterials", "source": "Gemini", "link": "https://www.nature.com/articles/s41535-026-00952-x", "authors": "David J. Abramovitch, Marco Bernardi", "last_authors": "David J. Abramovitch, Marco Bernardi", "summary": "Electron-phonon coupling and electronic transport at the moiré scale in twisted bilayer graphene", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Experimental study of moiré physics, a core interest for the user's broader reading.", "tags": ["graphene", "moire", "transport"], "image": "https://pubads.g.doubleclick.net/gampad/ad?iu=/285/npjquantmats.nature.com/article&sz=728x90&c=1601399369&t=pos%3Dtop%26type%3Darticle%26artid%3Ds41535-026-00952-x%26doi%3D10.1038/s41535-026-00952-x%26subjmeta%3D301,639,766,925%26kwrd%3DMaterials+science,Nanoscience+and+technology,Physics", "briefing": {"background": "모아레 시스템의 독특한 전자 구조는 격자 진동인 포논과의 상호작용을 통해 수송 특성과 열적 성질이 결정됩니다.", "motivation": "트위스트 이중층 그래핀에서 전자-포논 결합이 모아레 초격자 스케일의 전기 수송에 어떤 영향을 미치는지 분석하고자 했습니다.", "result": "초록 정보가 제한적이나, 모아레 스케일에서의 전자-포논 산란 메커니즘을 다루고 수송 계수를 계산/분석한 것으로 보입니다. (구체적 결과 증거는 다소 부족함)", "implication": "모아레 소재의 전기 저항의 온도 의존성이나 전하 수송의 한계를 이해하는 데 중요한 이론적 근거를 제공할 수 있습니다.", "novelty": "전자 간 상관관계에 집중하던 기존 모아레 연구에서 나아가 포논과의 결합을 수송 관점에서 심도 있게 다루었습니다.", "unresolved": "전자-전자 상관관계와 전자-포논 결합이 서로 어떻게 경쟁하거나 협력하여 초전도나 절연 상태에 영향을 주는지에 대한 상세 분석이 필요합니다.", "future_work": "트위스트 각도에 따른 전자-포논 산란율의 실험적 측정 및 다른 모아레 시스템(TMD 등)으로의 확장 연구가 예상됩니다.", "concepts": [{"term": "Electron-Phonon Coupling", "why_emerged": "금속의 전기 저항과 고전적 초전도 현상의 메커니즘을 설명하기 위해 필수적으로 도입되었습니다.", "origin": "BCS 이론의 핵심 요소로, Fröhlich 등에 의해 발전되었습니다.", "connections": "Superconductivity, Peierls transition, Polaron 등과 연결됩니다."}, {"term": "Moiré Scale", "why_emerged": "서로 다른 주기를 가진 격자가 겹쳐질 때 생기는 거시적 주기를 통해 새로운 물리 현상을 유도하기 위해 설정되었습니다.", "origin": "초록 정보만으로는 특정하기 어려우나, 나노 구조 및 2D 소재 적층 연구에서 보편화되었습니다.", "connections": "Superlattice, Folding of Brillouin zone, Flat bands와 연결됩니다."}], "english_summary": ["Investigates the role of electron-phonon coupling in moiré-scale electronic transport.", "Analyzes scattering mechanisms specific to twisted bilayer graphene's superlattice.", "Provides theoretical insight into how lattice vibrations influence charge carrier movement in moiré systems."]}}, {"title": "Layer-decoupled electronic reconstruction and a robust charge density wave in GdTe3", "journal": "npj_QuantumMaterials", "source": "Gemini", "link": "https://www.nature.com/articles/s41535-026-00946-9", "authors": "Xin Zheng, Yunbo Wu, Tongrui Li, et al.", "last_authors": "Shengtao Cui, Zhe Sun", "summary": "Layer-decoupled electronic reconstruction and a robust charge density wave in GdTe 3", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Electronic structure investigation of charge density waves in a rare-earth telluride.", "tags": ["CDW", "electronic_structure"], "image": "https://pubads.g.doubleclick.net/gampad/ad?iu=/285/npjquantmats.nature.com/article&sz=728x90&c=-1121619533&t=pos%3Dtop%26type%3Darticle%26artid%3Ds41535-026-00946-9%26doi%3D10.1038/s41535-026-00946-9%26subjmeta%3D301,639,766%26kwrd%3DMaterials+science,Physics", "briefing": {"background": "희토류 삼텔루라이드(RTe3) 계열은 준2차원 전하 밀도파(CDW)를 연구하기 위한 표준 물질로 간주되어 왔습니다. 특히 이들 물질은 결정 구조의 이방성과 전자 구조 간의 상관관계가 CDW 형성에 미치는 영향을 연구하기에 적합합니다.", "motivation": "GdTe3는 높은 온도에서 형성되는 CDW를 가지고 있으나, 층간 결합의 약화나 전자 구조의 재구성(reconstruction)이 CDW의 안정성과 물성에 어떠한 구체적인 변화를 주는지에 대한 상세한 조사가 필요했습니다.", "result": "연구진은 GdTe3에서 층간 분리(layer-decoupling)에 가까운 전자적 재구성이 일어남에도 불구하고 CDW가 매우 견고하게(robust) 유지됨을 확인했습니다. 이는 특정 층의 전자 구조 변화가 전체 CDW의 거시적인 질서에 미치는 영향이 제한적일 수 있음을 시사합니다.", "implication": "층간 결합을 제어하거나 전자 구조를 인위적으로 조절하더라도 CDW 상태를 유지할 수 있다는 결과는, 향후 2차원 한계 내에서 CDW 장치를 설계할 때 중요한 설계 원리를 제공합니다.", "novelty": "전자 구조의 재구성과 CDW의 공존을 실험적으로 입증했으며, 특히 독자의 관심사인 ARPES를 이용해 GdTe3의 구체적인 페르미 면과 밴드 구조의 변화를 포착했을 가능성이 높습니다. 112 tellurides와 유사한 칼코게나이드 계열의 전하 질서를 다루고 있어 독자의 프로젝트와 연관성이 높습니다.", "unresolved": "초록 정보만으로는 전자 재구성의 정확한 기작(예: 표면 효과 vs 벌크 특성)이나 CDW 파수(wave vector)의 구체적인 변화 여부를 확인하기 어렵습니다.", "future_work": "다른 희토류 원소(R)를 포함한 RTe3 계열과의 비교 연구 및 층의 두께를 조절하며 CDW의 결맞음성(coherence)이 어떻게 변하는지에 대한 후속 연구가 예상됩니다.", "concepts": [{"term": "GdTe3 (Rare-earth tritellurides)", "why_emerged": "준2차원 구조에서 전하 밀도파(CDW) 경쟁과 자성을 연구하기 위한 모델 플랫폼으로 부상했습니다.", "origin": "DiMasi 등에 의해 1990년대 중반 구조적 특징과 CDW 연구가 본격화되었습니다.", "connections": "NbSe3, TaV2Sb5 등 독자의 관심사인 다른 CDW 물질들과 비교 연구가 활발합니다."}, {"term": "Charge Density Wave (CDW)", "why_emerged": "금속의 전자-격자 상호작용으로 인해 전하 밀도가 주기적으로 변조되며 에너지 갭이 생기는 현상을 설명하기 위해 도입되었습니다.", "origin": "루돌프 파이얼스(Rudolf Peierls)가 1D 금속의 불안정성을 제안하며 이론적 토대를 마련했습니다.", "connections": "초전도성, 네마틱 상(nematicity) 등과 경쟁하거나 공존하는 관계에 있습니다."}, {"term": "Layer-decoupled Electronic Reconstruction", "why_emerged": "물질의 층간 결합이 약해지면서 각 층의 전자 구조가 독립적인 2차원적 특성을 가지게 되는 현상을 설명하기 위해 제안되었습니다.", "origin": "초록 정보만으로는 특정하기 어려우나, 전이금속 디칼코게나이드(TMD) 연구에서 널리 논의되는 개념입니다.", "connections": "Van der Waals heterostructures, monolayer 2D materials 연구와 밀접합니다."}], "english_summary": ["Investigates the electronic reconstruction and CDW robustness in the rare-earth tritelluride GdTe3.", "Finds that CDW remains stable despite significant layer-decoupled electronic changes.", "Provides insights into the stability of charge order in quasi-2D materials under structural or electronic perturbation.", "Relevant to ARPES studies of electronic structures in layered chalcogenides."]}}, {"title": "Spin correlations in La3Ni2O7 thin films", "journal": "npj_QuantumMaterials", "source": "Gemini", "link": "https://www.nature.com/articles/s41535-026-00953-w", "authors": "Hengyang Zhong, Bo Hao, Zhijia Zhang, et al.", "last_authors": "Thorsten Schmitt, Xingye Lu", "summary": "Spin correlations in La 3 Ni 2 O 7 thin films", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Study of high-Tc nickelate superconductors relevant to strongly correlated electron systems.", "tags": ["superconductivity", "nickelates", "magnetism"], "image": "https://pubads.g.doubleclick.net/gampad/ad?iu=/285/npjquantmats.nature.com/article&sz=728x90&c=543261882&t=pos%3Dtop%26type%3Darticle%26artid%3Ds41535-026-00953-w%26doi%3D10.1038/s41535-026-00953-w%26subjmeta%3D301,639,766%26kwrd%3DMaterials+science,Physics", "briefing": {"background": "최근 La3Ni2O7 물질이 고압 환경에서 약 80K의 높은 임계 온도(Tc)를 가진 초전도성을 나타낸다는 사실이 발견되어, 구리 산화물(cuprate) 이외의 고온 초전도체 후보로서 큰 관심을 받고 있습니다.", "motivation": "La3Ni2O7의 초전도 메커니즘을 이해하기 위해서는 자성 상관관계(spin correlations)를 파악하는 것이 필수적입니다. 특히 고압 실험의 한계를 넘어 박막(thin film) 형태에서 이러한 상관관계를 측정하고자 했습니다.", "result": "La3Ni2O7 박막에서 나타나는 스핀 상관관계의 특성을 규명했습니다. 이는 니켈레이트 초전도체의 짝짓기 기작(pairing mechanism)에서 자성 플럭추에이션의 역할을 이해하는 핵심 단서가 됩니다.", "implication": "박막 형태에서도 유의미한 스핀 상관관계가 존재함을 확인함으로써, 압력을 가하지 않은 상태에서도 니켈레이트의 초전도성을 유도하거나 제어할 수 있는 가능성을 열어줍니다.", "novelty": "이 연구의 마지막 저자인 Thorsten Schmitt는 RIXS 전문가로, 본 연구에서도 RIXS를 사용하여 니켈레이트의 스핀 여기(excitation)를 정밀하게 관찰했을 가능성이 큽니다. 이는 독자가 관심 있는 RIXS 기반 전자 구조 연구와 직결됩니다.", "unresolved": "박막과 벌크 시료(특히 고압 하) 간의 스핀 상관관계 차이가 얼마나 큰지, 그리고 이것이 실제 초전도 전이 온도에 미치는 구체적인 영향은 아직 명확하지 않습니다.", "future_work": "박막의 두께나 변형(strain)을 조절하여 스핀 상관관계를 튜닝하고, 이를 통해 상압 하에서의 초전도 현상을 구현하려는 시도가 이어질 것으로 보입니다.", "concepts": [{"term": "La3Ni2O7 (Bilayer Nickelate)", "why_emerged": "구리 산화물 초전도체와 유사한 전자 배치를 가진 니켈레이트에서 새로운 고온 초전도 기작을 찾기 위해 등장했습니다.", "origin": "Sun 등에 의해 2023년 고압 하 초전도 현상이 처음 보고되었습니다.", "connections": "Cuprates, LaNiO2 (infinite-layer nickelate), Strongly correlated systems."}, {"term": "Spin Correlations", "why_emerged": "강상관 전자계에서 전자 간의 쿨롱 상호작용으로 인해 발생하는 자성 정렬 및 요동을 설명하기 위해 필요합니다.", "origin": "다체계 물리학(Many-body physics)의 기본 개념으로, 중성자 산란 및 RIXS로 주로 측정됩니다.", "connections": "Superconducting pairing glue, Antiferromagnetism, RIXS."}, {"term": "Nickelate Superconductivity", "why_emerged": "구리 산화물에 국한된 고온 초전도 현상을 다른 전이금속 산화물로 확장하려는 노력의 결과입니다.", "origin": "2019년 NdNiO2 박막에서의 초전도 발견이 시발점이 되었습니다.", "connections": "d-electron systems, Unconventional superconductivity, DFT+DMFT calculations."}], "english_summary": ["Probes spin correlations in thin films of the bilayer nickelate La3Ni2O7.", "Provides experimental evidence for magnetic fluctuations that may serve as the pairing glue for high-Tc superconductivity.", "Likely employs RIXS to map the magnetic excitation spectrum in a 2D-confined geometry.", "Significant for understanding the mechanism of the newly discovered nickelate superconductors."]}}, {"title": "Spin order steers a light–matter condensate", "journal": "Nature_Materials", "source": "Gemini", "link": "https://www.nature.com/articles/s41563-026-02790-5", "authors": "Hui Deng", "last_authors": "Hui Deng", "summary": "Light–matter condensates get a magnetic control knob. In the layered magnet CrSBr, reorienting the spins with a modest field shifts the condensate’s colour by more than 10 meV.", "tier": "B_IMPORTANT_CONDMAT", "score": "7", "reason": "Magnetic control of excitonic states in van der Waals magnet CrSBr.", "tags": ["magnetism", "CrSBr", "excitons"], "image": "https://media.springernature.com/m685/springer-static/image/art%3A10.1038%2Fs41563-026-02790-5/MediaObjects/41563_2026_2790_Fig1_HTML.png", "briefing": {"background": "빛과 물질의 강한 상호작용으로 생성되는 엑시톤-폴라리톤(exciton-polariton) 응축물은 양자 유체 연구의 중요한 플랫폼입니다. 최근에는 이를 자기적으로 제어하려는 시도가 늘고 있습니다.", "motivation": "반데르발스(vdW) 자성체인 CrSBr은 우수한 광학적 특성과 자성을 동시에 가지고 있어, 스핀 질서(spin order)를 이용해 빛-물질 응축물의 특성을 정밀하게 조절할 수 있는 기회를 제공합니다.", "result": "CrSBr 내의 스핀 방향을 외부 자기장으로 재정렬함으로써, 응축물의 에너지(색상)를 10 meV 이상 크게 변화시킬 수 있음을 입증했습니다. 이는 스핀-광자 간의 매우 강력한 결합을 의미합니다.", "implication": "자기장을 통해 빛의 성질을 직접 제어하는 '자기-광학 소자'나 '스핀 기반 양자 정보 처리 장치'의 개발에 중요한 기초 원리가 됩니다.", "novelty": "기존의 다른 물질계에 비해 매우 큰 에너지 이동(>10 meV)을 관찰했다는 점이 혁신적입니다. 독자가 관심을 갖는 vdW 자성체 및 위상 자성체 연구와 광학적 특성 제어라는 측면에서 맞닿아 있습니다.", "unresolved": "응축물의 결맞음성(coherence)이 자기장 변화에 따라 얼마나 유지되는지, 그리고 더 높은 온도에서 작동 가능할지에 대한 의문이 남습니다.", "future_work": "CrSBr 기반의 이종 접합 구조를 제작하여 더욱 복잡한 스핀-빛 상호작용을 구현하거나, 다른 2차원 자성체와의 비교를 통해 제어 범위를 확장하는 연구가 예상됩니다.", "concepts": [{"term": "CrSBr", "why_emerged": "공기 중에서 안정하며 강한 엑시톤-자성 결합을 보이는 2차원 반데르발스 자성체로서 주목받고 있습니다.", "origin": "최근 2D 자성체 연구 붐과 함께 물성이 재발굴되었습니다.", "connections": "Van der Waals magnets, Exciton-polaritons, 2D semiconductor optics."}, {"term": "Light-matter Condensate (Exciton-polariton)", "why_emerged": "반도체 마이크로 공동 내에서 빛과 엑시톤이 결합하여 형성된 하이브리드 입자의 보즈-아인슈타인 응축을 연구하기 위해 도입되었습니다.", "origin": "1990년대 Weisbuch 등에 의해 강결합(strong coupling) 상태가 처음 확인되었습니다.", "connections": "Bose-Einstein Condensation (BEC), Superfluidity, Quantum simulators."}, {"term": "Spin Order Steering", "why_emerged": "전자 구조나 광학적 전이를 전기장이 아닌 자기적 수단으로 제어하려는 욕구에서 비롯되었습니다.", "origin": "초록 정보만으로는 특정하기 어려우나 스핀트로닉스와 광학의 융합 분야에서 발전 중입니다.", "connections": "Magneto-optics, Spin-orbit coupling, Spintronics."}], "english_summary": ["Demonstrates magnetic control of an exciton-polariton condensate in the vdW magnet CrSBr.", "Reports a large energy shift (>10 meV) of the condensate by reorienting spins with an external field.", "Establishes CrSBr as a powerful platform for tunable light-matter interactions and magneto-optical applications.", "Directly links spin ordering in 2D magnets to macroscopic quantum states."]}}, {"title": "Colossal magnetoresistance in the narrow-gap magnetic semiconductor Eu2CdAs2", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/txxb-rcf8", "authors": "Zhiyu Zhou, Zhi-Cheng Wang, Xiyu Chen, et al.", "last_authors": "Guang-Han Cao, Shuai Dong", "summary": "Discovering antiferromagnetic materials with a sizable colossal magnetoresistance (CMR) effect and precisely tuning their responses remain significant challenges in materials science. This work reports the synthesis, phase transitions, and magnetotransport properties of the narrow-gap Zintl arsenide…", "tier": "B_IMPORTANT_CONDMAT", "score": "7", "reason": "Experimental study of colossal magnetoresistance in an antiferromagnetic material, relevant to magnetic materials.", "tags": ["magnetotransport", "antiferromagnet", "newmaterial"], "image": "", "briefing": {"background": "거대 자기저항(CMR) 효과는 외부 자기장에 의해 물질의 전기 저항이 급격히 변하는 현상으로, 주로 망간 산화물과 같은 강자성체에서 연구되어 왔습니다. 최근에는 스핀트로닉스 응용과 기초 물리학 연구를 위해 반강자성체나 좁은 띠간격(narrow-gap)을 가진 자기 반도체에서 이러한 효과를 구현하고 제어하는 것이 중요한 과제로 대두되었습니다.", "motivation": "반강자성 물질에서 상당한 수준의 CMR 효과를 발견하고 그 응용 가능성을 탐색하는 것은 여전히 어려운 과제입니다. 본 연구는 Eu 기반의 Zintl 화합물인 Eu2CdAs2의 합성 및 물성 분석을 통해 새로운 CMR 물질을 제시하고자 합니다.", "result": "연구진은 좁은 띠간격을 가진 Zintl 비소화물인 Eu2CdAs2를 성공적으로 합성하고, 이 물질이 보여주는 상전이와 자기수송 특성을 규명했습니다. 특히 이 물질에서 현저한 CMR 효과가 나타남을 확인하였으며, 이는 반강자성 상태와 밀접하게 연관되어 있음을 보였습니다.", "implication": "반강자성 반도체에서도 강한 자기-수송 상호작용이 일어날 수 있음을 입증함으로써, CMR 현상을 보이는 물질군의 범위를 넓혔습니다. 이는 자성 반도체를 이용한 차세대 자기 센서나 소자 개발에 기여할 수 있습니다.", "novelty": "Eu2CdAs2라는 특정 Zintl 화합물에서 거대 자기저항을 실험적으로 확인했다는 점이 핵심입니다. 독자의 관심사인 자기 위상 물질(magnetic topological materials) 후보군인 Eu 기반 화합물의 전자 구조와 수송 특성 관계를 이해하는 데 중요한 데이터를 제공합니다.", "unresolved": "CMR 현상의 구체적인 미시적 메커니즘(예: 스핀 폴라론 형성 또는 자기장 유도 밴드 변형 등)이 이 물질에서 어떻게 작동하는지는 초록 수준에서는 명확히 설명되지 않았습니다.", "future_work": "ARPES나 STM/STS를 통한 전자 구조 직접 관찰을 통해 자성과 밴드 구조의 상관관계를 규명할 필요가 있으며, 화학적 도핑이나 압력 인가를 통한 CMR 효과의 극대화 연구가 기대됩니다.", "concepts": [{"term": "Colossal Magnetoresistance (CMR)", "why_emerged": "자기장에 의한 급격한 저항 변화를 이용하여 고밀도 자기 기록 장치나 센서를 개발하기 위해 등장했습니다.", "origin": "1950년대에 처음 발견되었으나, 1990년대 망간 산화물 연구를 통해 널리 알려졌습니다.", "connections": "GMR(거대 자기저항), 강자성체, 반강자성체, 스핀트로닉스"}, {"term": "Zintl Phase", "why_emerged": "금속적 결합과 이온/공유 결합의 중간적 성질을 갖는 화합물을 분류하고 이들의 독특한 구조-물성 관계를 이해하기 위해 제안되었습니다.", "origin": "Eduard Zintl (1930년대)", "connections": "열전 소자, 양자 자성체, 위상 절연체 후보 물질"}, {"ter     img.src = r.image; img.alt = 'Figure or article preview image'; img.loading = 'lazy'; img.referrerPolicy = 'no-referrer'; img.onerror = () => figure.remove();
    figure.appendChild(img);
    figure.appendChild(textEl('figcaption', '', 'Figure / article preview image from the source page'));
    head.appendChild(figure);
  }
  const headText = document.createElement('div');
  headText.className = 'head-text';
  const badges = document.createElement('div');
  badges.className = 'badges';
  if (r.score) badges.appendChild(textEl('span', 'badge score', `${r.score}/10`));
  if (r.tier) badges.appendChild(textEl('span', 'badge', r.tier));
  if (r.journal) badges.appendChild(textEl('span', 'badge', r.journal));
  if (r.source) badges.appendChild(textEl('span', 'badge', r.source));
  headText.appendChild(badges);
  const title = document.createElement('h1');
  if (r.link) { const titleLink = document.createElement('a'); titleLink.href = r.link; titleLink.target = '_blank'; titleLink.rel = 'noopener noreferrer'; titleLink.textContent = r.title || ''; title.appendChild(titleLink); }
  else { title.textContent = r.title || ''; }
  headText.appendChild(title);
  headText.appendChild(textEl('p', 'meta', [r.journal, r.source].filter(Boolean).join(' | ')));
  if (r.last_authors || r.authors) { const authors = document.createElement('p'); authors.className = 'authors'; if (r.last_authors) authors.append('Last authors: ' + r.last_authors); if (r.authors) authors.append((r.last_authors ? ' | ' : '') + 'Authors: ' + r.authors); headText.appendChild(authors); }
  appendLabeledText(headText, 'why', 'Filter reason: ', r.reason);
  if (r.tags && r.tags.length) { const tags = document.createElement('div'); tags.className = 'tags'; r.tags.forEach(tag => tags.appendChild(textEl('span', 'tag', '#' + tag))); headText.appendChild(tags); }
  if (r.link) { const link = document.createElement('a'); link.className = 'link'; link.href = r.link; link.target = '_blank'; link.rel = 'noopener noreferrer'; link.textContent = 'Open paper'; headText.appendChild(link); }
  head.appendChild(headText);
  if (r.summary) { const abstract = document.createElement('p'); abstract.className = 'original-abstract'; const strong = textEl('strong', '', 'Original abstract'); abstract.appendChild(strong); abstract.append(r.summary); head.appendChild(abstract); }
  slideEl.appendChild(head);
  const briefing = document.createElement('div');
  briefing.className = 'briefing';
  appendBriefSection(briefing, 'Background', b.background);
  appendBriefSection(briefing, 'Motivation', b.motivation);
  appendBriefSection(briefing, 'Result', b.result);
  appendBriefSection(briefing, 'Implication', b.implication);
  appendBriefSection(briefing, "Why it's important / Novelty", b.novelty);
  appendBriefSection(briefing, 'Unresolved Questions', b.unresolved);
  appendBriefSection(briefing, 'Expected Future Work', b.future_work);
  if (b.concepts && b.concepts.length) {
    const section = document.createElement('section');
    section.className = 'brief-section wide';
    section.appendChild(textEl('h2', '', 'Concepts / Terms'));
    const concepts = document.createElement('div');
    concepts.className = 'concepts';
    b.concepts.forEach(c => {
      const item = document.createElement('div');
      item.className = 'concept';
      item.appendChild(textEl('h3', '', c.term || 'Concept'));
      [['왜 생겼나: ', c.why_emerged], ['누가 만들었나: ', c.origin], ['연결되는 흐름: ', c.connections]].forEach(([label, text]) => { if (!text) return; const p = document.createElement('p'); const bold = textEl('b', '', label); p.appendChild(bold); p.append(text); item.appendChild(p); });
      concepts.appendChild(item);
    });
    section.appendChild(concepts);
    briefing.appendChild(section);
  }
  if (b.english_summary && b.english_summary.length) { const section = document.createElement('section'); section.className = 'brief-section wide'; section.appendChild(textEl('h2', '', 'English Summary')); const ul = document.createElement('ul'); b.english_summary.slice(0, 5).forEach(line => ul.appendChild(textEl('li', '', line))); section.appendChild(ul); briefing.appendChild(section); }
  slideEl.appendChild(briefing);
  counterEl.textContent = `${index + 1} / ${slides.length}`;
  prevBtn.disabled = index === 0;
  nextBtn.disabled = index === slides.length - 1;
}
prevBtn.addEventListener('click', () => { index = Math.max(0, index - 1); render(); });
nextBtn.addEventListener('click', () => { index = Math.min(slides.length - 1, index + 1); render(); });
document.addEventListener('keydown', event => { if (event.key === 'ArrowLeft') prevBtn.click(); if (event.key === 'ArrowRight') nextBtn.click(); });
render();
</script>
</body>
</html>
