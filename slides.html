<title>Daily Paper Slideshow</title>
<style>
  :root {
    color-scheme: light;
    --bg: #f6f7f4;
    --paper: #ffffff;
    --ink: #111827;
    --muted: #64748b;
    --line: #d8ddd2;
    --accent: #176b87;
    --accent-2: #9a3412;
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; overflow: auto; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: var(--bg); color: var(--ink); }
  .shell { max-width: 1500px; min-height: 100vh; margin: 0 auto; padding: 14px 18px; display: flex; flex-direction: column; }
  .topbar { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 16px; }
  .top-actions { display: flex; align-items: center; gap: 10px; }
  .topbar a, button { border: 1px solid var(--line); border-radius: 8px; background: var(--paper); color: var(--ink); padding: 10px 14px; font-weight: 700; text-decoration: none; cursor: pointer; }
  button.primary { background: var(--accent); border-color: var(--accent); color: white; }
  button:disabled { opacity: 0.45; cursor: not-allowed; }
  .counter { color: var(--muted); font-weight: 700; }
  .slide { min-height: calc(100vh - 82px); background: var(--paper); border: 1px solid var(--line); border-radius: 10px; padding: 18px; box-shadow: 0 18px 42px rgba(15, 23, 42, 0.10); display: grid; grid-template-columns: minmax(310px, 0.86fr) minmax(0, 1.55fr); gap: 18px; overflow: visible; }
  .paper-head { min-width: 0; min-height: 0; overflow: visible; display: flex; flex-direction: column; gap: 12px; }
  .figure { margin: 0; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: #f8fafc; }
  .figure img { display: block; width: 100%; max-height: 41vh; object-fit: contain; background: white; }
  .figure figcaption { padding: 7px 10px; color: var(--muted); font-size: 12px; line-height: 1.3; }
  .head-text { display: flex; flex-direction: column; gap: 9px; min-width: 0; }
  .badges { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .badge { border-radius: 999px; padding: 5px 9px; background: #eef2ff; color: #3730a3; font-size: 12px; font-weight: 800; }
  .score { background: #fee2e2; color: #991b1b; }
  h1 { margin: 0; font-size: 25px; line-height: 1.15; letter-spacing: 0; overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
  h1 a { color: inherit; text-decoration-color: rgba(23, 107, 135, 0.35); text-decoration-thickness: 2px; text-underline-offset: 4px; }
  h1 a:hover { color: var(--accent); text-decoration-color: var(--accent); }
  .meta, .authors, .why, .abstract { font-size: 13px; line-height: 1.45; }
  .meta, .authors { color: var(--muted); }
  .why strong, .abstract strong, .authors strong { color: var(--ink); }
  .authors { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .why { border-left: 4px solid var(--accent-2); padding-left: 10px; color: #374151; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .abstract { border-top: 1px solid var(--line); padding-top: 14px; color: #374151; }
  .original-abstract { border-top: 1px solid var(--line); padding-top: 10px; color: #374151; font-size: 11.5px; line-height: 1.35; overflow-wrap: anywhere; }
  .original-abstract strong { display: block; margin-bottom: 4px; color: var(--ink); }
  .tags { display: flex; flex-wrap: wrap; gap: 8px; }
  .tag { border-radius: 999px; padding: 4px 8px; background: #f1f5f9; color: #475569; font-size: 12px; font-weight: 700; }
  .head-text > .link { display: none; }
  .briefing { min-width: 0; min-height: 0; overflow: visible; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); grid-auto-rows: minmax(0, auto); align-content: start; gap: 11px 18px; border-top: 0; padding-top: 0; }
  .brief-section { min-width: 0; }
  .brief-section.wide { grid-column: 1 / -1; }
  .brief-section h2 { margin: 0 0 4px; font-size: 14px; line-height: 1.22; color: #0f766e; letter-spacing: 0; }
  .brief-section p, .brief-section li { margin: 0; font-size: 12.5px; line-height: 1.42; color: #1f2937; overflow-wrap: anywhere; }
  .brief-section ul { margin: 0; padding-left: 20px; }
  .concepts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 9px 14px; }
  .concept { border-top: 1px solid var(--line); padding-top: 7px; }
  .concept h3 { margin: 0 0 4px; font-size: 13px; color: #7c2d12; letter-spacing: 0; }
  .concept p { margin: 2px 0 0; font-size: 11.5px; line-height: 1.35; color: #374151; overflow-wrap: anywhere; }
  .concept b { color: #111827; }
  .link { color: var(--accent); font-weight: 800; text-decoration: none; }
  .empty { padding: 48px; background: var(--paper); border: 1px solid var(--line); border-radius: 12px; color: var(--muted); }
  @media (max-width: 860px) {
    .shell { padding: 14px; }
    .topbar, .top-actions { align-items: stretch; flex-direction: column; }
    .slide, .briefing, .concepts { grid-template-columns: 1fr; }
    .slide { min-height: auto; overflow: visible; display: grid; }
    h1 { font-size: 28px; }
  }
</style>

const slides = [{"title": "Nonreciprocal impurity scattering as a probe for pairing symmetries in kagome superconductors", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/6d8l-gzdq", "authors": "Hong-Min Jiang, Hao Du, Shun-Li Yu", "last_authors": "Hao Du, Shun-Li Yu", "summary": "The superconducting (SC) pairing symmetry and its link to time-reversal symmetry breaking (TRSB) in the vanadium-based kagome superconductors remain unresolved, with ambiguities stemming from sublattice interference and charge-density-wave (CDW) entanglement with superconductivity. Using two represe…", "tier": "A_MUST_READ", "score": "10", "reason": "Directly addresses TRSB and pairing in kagome superconductors, core to the user's primary research interest.", "tags": ["theory", "AV3Sb5", "kagome"], "image": "", "briefing": {"background": "바나듐 기반 카고메 격자 구조를 가진 AV3Sb5(A=K, Rb, Cs) 화합물은 전하 밀도 파동(CDW)과 초전도성이 공존하며, 특히 시간 반전 대칭성 깨짐(TRSB)과 같은 독특한 양자 상태를 보여주어 응집 물리학의 주요 연구 대상으로 부상했습니다.", "motivation": "이 물질들에서 초전도 페어링 대칭성과 TRSB의 연관성은 여전히 논란의 중심에 있습니다. 특히 서브래티스 간섭(sublattice interference)과 CDW가 초전도와 얽혀 있어 실험 데이터의 해석이 모호한 경우가 많습니다. 본 연구는 불순물 산란의 비가역성을 통해 이러한 페어링 대칭성을 명확히 식별할 수 있는 방법을 제안하고자 합니다.", "result": "연구팀은 이론적 모델링을 통해 카고메 초전도체에서 불순물 산란이 비가역적으로 나타나는 현상을 분석했습니다. 특정 페어링 대칭성(예: chiral p-wave 등) 하에서 불순물에 의한 준입자 산란 양상이 방향에 따라 다르게 나타남을 확인하였으며, 이를 통해 TRSB를 수반하는 초전도 상태를 실험적으로 진단할 수 있는 이론적 토대를 마련했습니다.", "implication": "만약 STM/STS 실험에서 본 연구가 예측한 비가역적 산란 패턴이 관측된다면, 이는 카고메 초전도체의 페어링 대칭성을 확정 짓는 결정적인 증거가 될 수 있습니다. 이는 기존의 모호했던 실험 결과들을 정립하는 데 기여할 것입니다.", "novelty": "독자의 주요 관심사인 AV3Sb5 카고메 물질의 TRSB와 페어링 대칭성 문제를 직접적으로 다루고 있습니다. 특히 단순한 대칭성 분석을 넘어 불순물 산란이라는 국소적 프로브를 통해 거시적 초전도 상태를 역추적하는 접근법이 참신합니다.", "unresolved": "이론적 모델에서 가정한 CDW와 초전도의 상호작용 세기가 실제 물질에서 얼마나 정확하게 구현되는지는 추가적인 정밀 검증이 필요합니다.", "future_work": "제시된 이론적 예측을 검증하기 위해 고해상도 STM을 이용한 극저온 불순물 산란 실험이 이어질 것으로 예상됩니다.", "concepts": [{"term": "비가역적 불순물 산란 (Nonreciprocal impurity scattering)", "why_emerged": "물질 내 대칭성이 깨졌을 때 산란 행렬의 원소들이 방향에 따라 달라지는 현상을 설명하기 위해 도입되었습니다.", "origin": "초록 정보만으로는 특정하기 어려우나, 일반적으로 비가역 수송 현상 연구에서 발전했습니다.", "connections": "비가역 수송 현상, 시간 반전 대칭성 깨짐, 불순물 준입자 간섭(QPI)."}, {"term": "카고메 초전도체 (Kagome Superconductor)", "why_emerged": "기하학적 좌절(frustration)이 있는 카고메 격자에서 초전도성이 발견되면서 새로운 물리 현상을 탐구하기 위해 정의되었습니다.", "origin": "AV3Sb5 화합물의 발견 이후 본격적으로 연구되었습니다.", "connections": "전하 밀도 파동(CDW), 위상 초전도체, 바나듐 기반 화합물."}, {"term": "시간 반전 대칭성 깨짐 (TRSB)", "why_emerged": "전하의 흐름이나 자기적 정렬 없이도 나타나는 독특한 양자 상태를 기술하기 위해 중요해졌습니다.", "origin": "루프 전류(loop current) 모델이나 비관습적 초전도 이론에서 주로 논의되었습니다.", "connections": "카이랄 초전도성, 아노말로스 홀 효과, 루프 전류."}, {"term": "서브래티스 간섭 (Sublattice interference)", "why_emerged": "단위 격자 내의 여러 원소 위치(서브래티스)에서 기인한 파동 함수의 간섭 효과를 설명하기 위해 필요합니다.", "origin": "타이트 바인딩 모델링 및 밴드 구조 계산에서 핵심적인 개념입니다.", "connections": "카고메 격자의 전자 구조, 밴드 가중치(spectral weight), QPI 패턴."}], "english_summary": ["The study proposes nonreciprocal impurity scattering as a diagnostic tool for identifying superconducting pairing symmetries in AV3Sb5 kagome systems.", "By analyzing how impurities break symmetries in the presence of TRSB, it provides a theoretical framework to interpret complex STM data.", "The results aim to resolve the long-standing ambiguity between CDW entanglement and intrinsic superconducting properties.", "This is highly relevant for researchers studying time-reversal symmetry breaking and unconventional superconductivity in kagome metals."]}}, {"title": "Electronic Coupling and Charge-Transfer Landscape of Graphene on Ge(001)/Si(001): Multiscale Analysis Assisted by Machine Learning", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2609.37827", "authors": "Pawel Dabrowski, Przemys{\\l}aw Przybysz, Maciej Rogala, et al.", "last_authors": "Jagoda S{\\l}awi\\'nska, Pawel J. Kowalczyk", "summary": "Understanding and controlling charge transfer at graphene-semiconductor interfaces is essential for the integration of two-dimensional materials into silicon-compatible technologies. Here, we combine ultraviolet photoelectron spectroscopy (UPS), Kelvin probe force microscopy (KPFM), angle-resolved photoemission spectroscopy (ARPES), scanning tunneling spectroscopy (STS) and density functional theory (DFT) to resolve work-function modulation and electronic coupling in graphene grown on Ge(001)/Si(001). UPS and KPFM reveal a spatially non-uniform work-function landscape correlated with the nanofaceted morphology of the substrate. ARPES and DFT calculations for the pristine interface consistently indicate n-type doping and electron transfer from Ge to graphene. In contrast, modeling of the oxidized interface predicts a reversal to p-type doping, providing a plausible explanation for the different doping polarities reported in the literature. Machine-learning-assisted classification of the STS data resolves distinct local electronic regimes, ranging from nearly free-standing graphene on nanofacet tops to more strongly coupled inter-facet regions and nanoribbon-like regions with distinct local electronic responses. By identifying the mechanisms governing local graphene-substrate interactions and charge transfer, our study provides guidelines for tailoring the synthesis process and minimizing defect formation during delamination. These insights support the production of high-quality graphene layers for electronic devices and for transfer as protective coatings for air-sensitive materials.", "tier": "A_MUST_READ", "score": "10", "reason": "Uses ARPES and STS to study graphene/semiconductor interfaces; core technique match.", "tags": ["ARPES", "STS", "graphene"], "image": "https://arxiv.org/static/browse/0.3.4/images/arxiv-logo-fb.png", "briefing": {"background": "그래핀을 기존 실리콘 기반 반도체 공정에 통합하기 위해서는 Ge/Si(001)과 같은 기판 위에서 그래핀의 전자 구조와 전하 이동 메커니즘을 정확히 이해하는 것이 필수적입니다.", "motivation": "기존 연구들에서 보고된 그래핀의 도핑 특성(n형 또는 p형)이 서로 상충되는 경우가 많았는데, 이는 계면의 화학적 상태(산화 등)와 나노 구조적 특징에 기인할 가능성이 큽니다. 이를 규명하기 위해 다각도의 분광 실험과 계산이 요구되었습니다.", "result": "ARPES와 DFT를 통해 깨끗한 Ge(001) 위의 그래핀은 n형 도핑을 보임을 확인했습니다. 반면, 계면이 산화될 경우 p형으로 도핑 극성이 반전된다는 것을 밝혀내어 문헌상의 모순을 설명했습니다. 또한, 머신러닝 기반의 STS 데이터 분류를 통해 나노 패싯(facet)의 위치에 따라 그래핀이 기판과 강하게 결합하거나 자유롭게 떠 있는(free-standing) 다양한 국소 전자 상태를 가짐을 입증했습니다.", "implication": "그래핀의 도핑을 기판 산화 제어를 통해 조절할 수 있음을 시사하며, 고품질 그래핀 소자 제작 및 공기 중에서 불안정한 물질의 보호막으로 활용할 수 있는 가이드를 제공합니다.", "novelty": "독자의 주요 관심사인 ARPES와 STS를 결합하여 실제 소자 기판 위의 그래핀 계면을 정밀하게 분석했다는 점이 중요합니다. 특히 머신러닝을 도입하여 복잡한 STS 맵을 해석하고 국소적 상호작용을 분류한 접근 방식이 돋보입니다.", "unresolved": "나노 패싯의 형상을 나노미터 단위에서 제어하여 균일한 도핑을 유도하는 공정 기술 확보가 여전히 과제로 남아 있습니다.", "future_work": "이러한 계면 제어 기술을 활용하여 실제 그래핀 기반 트랜지스터의 특성을 향상시키거나 다른 2D 물질로 확장하는 연구가 가능할 것입니다.", "concepts": [{"term": "ARPES (Angle-Resolved Photoemission Spectroscopy)", "why_emerged": "물질 내 전자의 에너지와 운동량 관계(밴드 구조)를 직접 측정하기 위해 개발되었습니다.", "origin": "1980년대 전후로 고체 물리 연구의 핵심 도구로 정착되었습니다.", "connections": "페르미면 매핑, 밴드 갭 측정, 다체 효과 연구."}, {"term": "STS (Scanning Tunneling Spectroscopy)", "why_emerged": "나노미터 수준의 국소적인 영역에서 전자의 상태 밀도(LDOS)를 측정하기 위해 필요합니다.", "origin": "Gerd Binnig와 Heinrich Rohrer가 STM을 발명한 이후 발전했습니다.", "connections": "LDOS 맵핑, 밴드 갭 분석, 불순물 상태 측정."}, {"term": "전하 이동 (Charge Transfer)", "why_emerged": "서로 다른 두 물질이 만났을 때 계면에서의 화학적 포텐셜 차이로 인해 전자가 이동하는 현상을 설명하기 위해 도입되었습니다.", "origin": "계면 물리 및 반도체 물리학의 기초 개념입니다.", "connections": "도핑, 쇼트키 장벽(Schottky barrier), 일함수."}, {"term": "머신러닝 기반 분류 (Machine-learning-assisted classification)", "why_emerged": "STS 맵과 같이 대량의 복잡한 실험 데이터에서 유의미한 물리적 패턴을 효율적으로 추출하기 위해 도입되었습니다.", "origin": "최근 데이터 집약적 실험 물리학에서 널리 적용되기 시작했습니다.", "connections": "데이터 클러스터링, 노이즈 제거, 위상 구분."}], "english_summary": ["The study elucidates the charge transfer mechanisms at the graphene/Ge/Si(001) interface using a multi-scale approach combining ARPES, STS, and DFT.", "It resolves conflicting reports on doping polarity by showing that pristine interfaces are n-type, while oxidized ones switch to p-type.", "Machine learning helped classify local electronic regimes across the nanofaceted substrate, identifying regions of weak and strong coupling.", "These findings provide critical insights for the integration of graphene into silicon-based electronics and protective coating applications."]}}, {"title": "Magnetic properties and Fermi-surface topology of kagome magnet HoV6Sn6", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2609.36258", "authors": "Tucker Beekmann, Ganesh Pokharel, Wyatt Edward Ackerman, Stephen D. Wilson, David E. Graf, Keshav Shrestha", "last_authors": "David E. Graf, Keshav Shrestha", "summary": "We report a study of the magnetic properties and Fermi-surface topology of the kagome magnet HoV$_6$Sn$_6$ using magnetization and tunnel-diode-oscillator (TDO) measurements. The temperature-dependent magnetization exhibits Curie-Weiss behavior at high temperatures and reveals long-range magnetic order below $T_c$ $\\approx$ 2.4 K. Below Tc, the field-dependent magnetization reveals pronounced magnetic anisotropy, with saturation moments of $\\approx$ 9.5 and 7 $\\mu_B$ /Ho for fields applied along the out-of-plane and in-plane directions, respectively. To probe the Fermi surface, we perform TDO measurements in magnetic fields up to 41.5 T and at temperatures down to 0.35 K. The TDO signal exhibits well-defined quantum oscillations with multiple frequencies extending up to $\\sim$ 9 kT. Angular- and temperature-dependent measurements are used to determine the Fermi-surface geometry and cyclotron effective masses, respectively. To elucidate the electronic structure, we perform first-principles calculations of the electronic bands, density of states (DOS), and Fermi surface. The calculated band structure exhibits flat-band features, van Hove singularities, and Dirac-like crossings near the Fermi level. The DOS near the Fermi level is dominated by the V-d orbitals, indicating that the V kagome layers play a major role in determining the low-energy electronic properties of HoV6Sn6. Our calculations further support a ferromagnetic ground state with the Ho moments oriented along the c axis, consistent with neutron-scattering measurements. The calculated quantum-oscillation frequencies from the Fermi-surface pockets of HoV6Sn6 are in overall good agreement with the experimentally observed frequencies. Our combined experimental and theoretical results provide insight into the magnetic anisotropy and electronic structure of HoV$_6$Sn$_6$ and reveal its multiband Fermi-surface topology.", "tier": "A_MUST_READ", "score": "10", "reason": "Direct hit: Kagome magnet, electronic structure, and Fermi surface studies in a relevant material.", "tags": ["kagome", "experiment", "bandstructure", "Fermisurface"], "image": "https://arxiv.org/html/2609.36258v1/Fig1.png", "briefing": {"background": "HoV6Sn6는 1-6-6 구조를 가진 카고메 자성체로, 바나듐(V) 격자에서 기인하는 위상학적 밴드 구조(플랫 밴드, 디락 교차 등)와 희토류 원소(Ho)에 의한 자기적 성질이 결합된 흥미로운 시스템입니다.", "motivation": "이 물질의 자기적 이방성과 실제 페르미면 구조를 명확히 규명하여, 카고메 격자가 저에너지 물리 특성에 미치는 영향을 이론과 실험의 비교를 통해 이해하고자 했습니다.", "result": "TDO(Tunnel-Diode-Oscillator) 측정을 통해 최대 41.5T의 강한 자기장에서 다수의 양자 진동 주파수(~9 kT)를 관측했습니다. 이를 통해 다중 밴드 페르미면 구조를 매핑하였으며, DFT 계산 결과와 비교하여 V-d 오비탈이 페르미 레벨 근처의 상태를 지배함을 확인했습니다. 또한 2.4K 이하에서 장거리 자기 정렬이 나타나며 강한 자기 이방성이 존재함을 밝혔습니다.", "implication": "HoV6Sn6의 전자 구조가 V 카고메 층에 의해 결정된다는 것을 보여주며, 이는 다른 1-6-6 계열 카고메 물질들의 위상학적 특성을 이해하는 데 중요한 기준이 됩니다.", "novelty": "독자의 관심사인 카고메 금속의 페르미면 구조와 자성을 양자 진동 실험과 DFT로 직접 연결하여 분석했습니다. 특히 고자기장 실험을 통해 매우 정밀한 페르미면 정보를 추출한 점이 핵심입니다.", "unresolved": "관측된 양자 진동 주파수와 DFT 계산 결과 사이의 미세한 차이를 유발하는 상관관계 효과(correlation effects)에 대한 추가 논의가 필요할 수 있습니다.", "future_work": "Ho 이외의 다른 희토류 원소를 치환하여 자기성과 위상 밴드 구조 간의 상호작용이 어떻게 변하는지 탐구하는 연구가 유망할 것입니다.", "concepts": [{"term": "양자 진동 (Quantum Oscillations)", "why_emerged": "강한 자기장 하에서 란다우 레벨 형성에 따른 열역학적 양의 진동을 통해 페르미면의 단면적을 측정하기 위해 사용됩니다.", "origin": "Shubnikov와 de Haas(저항), de Haas와 van Alphen(자화)에 의해 발견되었습니다.", "connections": "SdH 효과, dHvA 효과, 페르미면 매핑."}, {"term": "카고메 자성체 (Kagome Magnet)", "why_emerged": "카고메 격자의 기하학적 특징과 자기 모멘트 간의 상호작용으로  "Provides a clean spectroscopic pathway to analyze the electronic state of nickelate superconductors."]}}, {"title": "Magnetic-Field-Induced Tomonaga-Luttinger Liquid and Bose-Einstein Condensate Phases in an Organic S=1 Haldane Chain", "journal": "PRL_Recent", "source": "keyword", "link": "http://link.aps.org/doi/10.1103/89k5-p261", "authors": "Ivan Jakovac, Mihael S. Grbić, Maxime Dupont, et al.", "last_authors": "Masashi Takigawa, Mladen Horvatić", "summary": "Researchers have gained access to the rich physics of a landmark model magnet by assembling a crystal out of organic magnetic molecules.", "tier": "A_MUST_READ", "score": "9", "reason": "title strong match: Luttinger liquid", "tags": ["Luttinger"], "image": "", "briefing": {"background": "1차원 양자 자성체는 강한 양자 요동으로 인해 독특한 기저 상태를 가집니다. 특히 정수 스핀(S=1)을 가진 Haldane 체인은 바닥 상태에서 갭이 존재하지만, 강한 자기장을 인가하여 이 갭을 닫으면 토모나가-루팅어 액체(TLL)나 보즈-아인슈타인 응축(BEC)과 같은 흥미로운 양자 상전이를 관찰할 수 있습니다.", "motivation": "S=1 Haldane 시스템에서 자기장에 의해 유도되는 TLL 및 BEC 상을 유기 자성 분자 기반의 결정 구조에서 실험적으로 구현하고 검증하고자 하였습니다.", "result": "유기 분자로 조립된 S=1 Haldane 체인 결정에서 자기장 인가를 통해 TLL 상과 BEC 상의 존재를 확인했습니다. 이는 모델 자성체의 물리적 특성을 유기 결정을 통해 성공적으로 재현했음을 의미합니다.", "implication": "유기 자성체가 양자 자성 모델 연구를 위한 훌륭한 플랫폼이 될 수 있음을 보여주며, 고스핀 시스템에서도 TLL 이론이 유효하게 적용됨을 증명했습니다.", "novelty": "S=1/2이 아닌 S=1 Haldane 체인에서 자기장 유도 TLL 상을 유기 소재를 통해 실험적으로 명확히 규명한 점이 독특합니다. 독자의 관심사인 루팅어 액체 물리와 밀접한 연관이 있습니다.", "unresolved": "초록상으로는 유기 결정의 구조적 유연성이 전이 온도나 상경계에 미치는 구체적인 영향에 대해서는 추가 연구가 필요해 보입니다.", "future_work": "다른 스핀 값을 가진 시스템이나 외부 압력을 통한 추가적인 양자 상전이 제어 연구가 기대됩니다.", "concepts": [{"term": "Tomonaga-Luttinger Liquid (TLL)", "why_emerged": "1차원 전자/스핀 시스템에서는 Fermi liquid 이론이 붕괴하므로 이를 설명하기 위해 도입되었습니다.", "origin": "Sin-itiro Tomonaga (1950), Joaquin Mazdak Luttinger (1963)", "connections": "Spin-charge separation, Power-law correlation functions"}, {"term": "Haldane Chain", "why_emerged": "정수 스핀 시스템이 반정수 스핀 시스템과 달리 유한한 에너지 갭을 가진다는 가설을 설명하기 위함입니다.", "origin": "F. Duncan M. Haldane (1983)", "connections": "AKLT model, Topological phases of matter"}, {"term": "Bose-Einstein Condensation (BEC) in magnets", "why_emerged": "자성체의 마그논(magnon)이 자기장에 의해 응축되는 현상을 설명하기 위해 도입되었습니다.", "origin": "초록 정보만으로는 특정하기 어려움 (통상 1990년대 후반~2000년대 초반 확립)", "connections": "Quantum phase transition, Magnon condensation"}], "english_summary": ["Realized magnetic-field-induced TLL and BEC phases in an organic S=1 Haldane chain crystal.", "Demonstrated that organic magnetic molecules can serve as ideal platforms for studying landmark 1D quantum models.", "Confirmed the validity of Tomonaga-Luttinger Liquid theory in higher-spin integer systems under high magnetic fields."]}}, {"title": "Structural Phase Separation Couples to Charge-Density-Wave Formation in Kagome Metal FeGe", "journal": "PRL_Recent", "source": "keyword", "link": "http://link.aps.org/doi/10.1103/tqqs-s1r6", "authors": "Boyang Zhao, Youngjun Ahn, Qinwen Deng, et al.", "last_authors": "Liang Wu, Haidan Wen", "summary": "Temperature-dependent high-resolution synchrotron X-ray diffraction reveals structural Bragg peak splits in FeGe at the charge-density-wave transition temperature suggesting that its quantum states may be manipulated with strain.", "tier": "A_MUST_READ", "score": "9", "reason": "title strong match: kagome metal", "tags": ["kagome"], "image": "", "briefing": {"background": "Kagome 격자 구조를 가진 FeGe는 자성과 전하 밀도 파동(CDW)이 공존하는 드문 재료입니다. 이러한 시스템에서 전자 구조와 격자 구조 사이의 상호작용은 새로운 양자 상태를 이해하는 데 매우 중요합니다.", "motivation": "FeGe에서 CDW가 형성될 때 발생하는 구조적 변화와 그것이 전자 상태에 미치는 영향을 고해상도 X선 회절을 통해 정밀하게 조사하고자 했습니다.", "result": "CDW 전이 온도에서 구조적인 Bragg 피크의 갈라짐(splitting)을 관찰하였으며, 이는 구조적 위상 분리(structural phase separation)가 발생함을 시사합니다.", "implication": "FeGe의 양자 상태가 외부 스트레인(strain)에 의해 민감하게 조절될 수 있음을 보여주며, 스트레인 엔지니어링을 통한 물성 제어 가능성을 제시합니다.", "novelty": "자기 Kagome 금속인 FeGe에서 CDW와 결합된 구조적 위상 분리를 실험적으로 처음 발견했습니다. 이는 독자의 주요 관심사인 Kagome 금속 및 CDW 제어와 직결됩니다.", "unresolved": "구조적 분리가 거시적인 영역에서 일어나는지 아니면 미세한 도메인 수준에서 일어나는지에 대한 공간적 해상도 연구가 더 필요합니다.", "future_work": "단축 응력(uniaxial strain)을 직접 인가하며 CDW 상태의 변화를 관찰하는 ARPES 또는 STM 실험이 뒤따를 것으로 보입니다.", "concepts": [{"term": "Kagome Metal", "why_emerged": "기하학적 좌절(frustration)과 flat band, Dirac cone 등을 통한 특이 물성을 탐구하기 위해 주목받았습니다.", "origin": "초록 정보만으로는 특정하기 어려움 (Kagome 구조 자체는 일본의 대나무 바구니 패턴에서 유래)", "connections": "AV3Sb5, FeGe, CoSn, Berry curvature physics"}, {"term": "Phase Separation", "why_emerged": "물질 내에서 서로 다른 대칭성이나 밀도를 가진 두 상이 공존하는 현상을 설명하기 위해 도입되었습니다.", "origin": "초록 정보만으로는 특정하기 어려움 (열역학적 일반 개념)", "connections": "Colossal magnetoresistance in manganites, CDW domains"}, {"term": "Synchrotron X-ray Diffraction", "why_emerged": "매우 미세한 구조적 변화나 피크 갈라짐을 높은 분해능으로 측정하기 위해 필요합니다.", "origin": "방사광 가속기 기술 발전과 함께 성숙함", "connections": "Crystal structure refinement, In-situ strain measurements"}], "english_summary": ["Identified structural Bragg peak splitting in magnetic kagome metal FeGe at the CDW transition.", "Evidence suggests structural phase separation is coupled to the formation of charge density waves.", "Highlights the potential for manipulating FeGe's quantum states via strain engineering."]}}, {"title": "3/8 charge-density wave instability in the kagome metal CsV3Sb5", "journal": "arXiv_CondMat", "source": "keyword", "link": "https://arxiv.org/abs/2609.38071", "authors": "Luca Buiarelli, Hyeonseo H. Park, Ethan T. Ritz, Rafael M. Fernandes, Turan Birol", "last_authors": "Rafael M. Fernandes, Turan Birol", "summary": "The kagome metal CsV$_3$Sb$_5$ exhibits charge density wave (CDW) and superconducting transitions, both of which are substantially affected by pressure. Recent x-ray diffraction experiments identify a new charge-ordered phase at a pressure coinciding with the dip of the superconducting dome. This CDW phase displays a distinctive wavevector $\\mathbf{Q} = (3/8, 0, 1/2)$ and monoclinic symmetry, in contrast to the $2\\times2\\times 2$ and $2\\times2\\times 4$ orders reported at ambient pressure. In this letter, we show that density functional perturbation theory (DFPT) calculations on a fine reciprocal-space grid predict the leading lattice instability of CsV$_3$Sb$_5$ to be at this wavevector. Finite-displacement calculations reveal that while anharmonic effects stabilize the conventional $L_2^-$ CDW at ambient pressure, the competing $3/8$ instability becomes energetically favorable above $\\sim$1 GPa, consistent with experimental observations. Interestingly, the nesting function displays a peak at the same wavevector. A Landau free energy analysis explains the emergence of the monoclinic distortion observed in x-ray diffraction, in addition to several bond-ordering patterns that may be relevant to the observed trends in the superconducting $T_c$.", "tier": "A_MUST_READ", "score": "9", "reason": "title strong match: kagome metal", "tags": ["kagome", "chargedensitywave", "CDW", "superconduct"], "image": "https://arxiv.org/html/2609.38071v1/Fig1_V2.png", "briefing": {"background": "Kagome 금속 CsV3Sb5는 상압에서 CDW와 초전도성을 동시에 나타내며, 압력이 가해짐에 따라 초전도 임계온도(Tc)가 두 개의 돔(double dome) 형태를 보이는 등 복잡한 상도표를 가집니다.", "motivation": "최근 실험에서 압력 하에 발견된 새로운 CDW 상(Q = 3/8, 0, 1/2)의 기원과 이것이 기존의 상압 CDW 및 초전도성과 어떤 경쟁 관계에 있는지 이론적으로 설명하고자 했습니다.", "result": "밀도 범함수 섭동 이론(DFPT) 계산을 통해 CsV3Sb5의 주요 격자 불안정성이 Q = 3/8 위치에서 발생함을 확인했습니다. 상압에서는 비조화 효과가 기존의 L2- CDW를 안정화시키지만, 약 1 GPa 이상의 압력에서는 3/8 CDW 상이 에너지적으로 더 유리해짐을 보였습니다.", "implication": "실험에서 관찰된 단사정계(monoclinic) 변형과 초전도 Tc의 변화가 이 3/8 CDW 상의 형성과 밀접하게 연관되어 있음을 시사합니다.", "novelty": "실험적으로 보고된 압력 유도 3/8 CDW 상을 제일원리 계산으로 뒷받침하고, 압력에 따른 CDW 상전이 메커니즘을 규명한 점이 돋보입니다. 독자의 핵심 관심사인 CsV3Sb5의 CDW 기원 및 압력 효과를 다룹니다.", "unresolved": "이 3/8 CDW 상이 초전도 페어링에 구체적으로 어떤 영향을 주는지(경쟁 혹은 공존)에 대한 미시적 메커니즘은 추가 논의가 필요합니다.", "future_work": "제시된 결합 정렬(bond-ordering) 패턴을 확인하기 위한 고압 하의 정밀 X선 회절이나 고압 ARPES/STM 연구가 기대됩니다.", "concepts": [{"term": "CsV3Sb5", "why_emerged": "Kagome 격자에서 나타나는 CDW, 초전도, 비정상 홀 효과의 상호작용을 연구하기 위한 대표 물질로 급부상했습니다.", "origin": "Stephen Wilson group 등 (2020년경)", "connections": "AV3Sb5 (A=K, Rb, Cs), Van Hove singularity"}, {"term": "Nesting function", "why_emerged": "Fermi 면의 특정 기하학적 구조가 전하 밀도 파동(CDW) 불안정성을 유도하는지 판단하기 위한 지표입니다.", "origin": "초록 정보만으로는 특정하기 어려움 (Peierls instability 연구에서 파생)", "connections": "Fermi surface nesting, Susceptibility calculation"}, {"term": "Density Functional Perturbation Theory (DFPT)", "why_emerged": "물질의 포논 구조나 격자 불안정성을 제일원리 계산으로 정확히 예측하기 위해 개발되었습니다.", "origin": "Stefano Baroni et al. (1987, 2001)", "connections": "Phonon dispersion, Electron-phonon coupling"}], "english_summary": ["Predicted a 3/8-wavevector CDW instability in CsV3Sb5 using DFPT calculations.", "Showed that while ambient pressure favors the L2- CDW due to anharmonicity, pressure above 1 GPa stabilizes the 3/8 phase.", "Explained the observed monoclinic distortion and correlated the new CDW phase with the superconducting Tc dip/dome under pressure."]}}, {"title": "Quantum metric induced nonlinear transport in the hidden loop-current phase of kagome metal RbV3Sb5", "journal": "arXiv_CondMat", "source": "keyword", "link": "https://arxiv.org/abs/2609.36353", "authors": "Jia-Chen Shi, Shupeng Xu, Utkarsh Khandelwal, et al.", "last_authors": "Steven J. May, Ritesh Agarwal", "summary": "A hidden low-temperature phase with possible loop-current order has been proposed in the kagome metals AV$_3$Sb$_5$ (A=K, Rb or Cs), but its experimental signatures remain subtle and indirect. Here, we use third-order nonlinear transport to probe this hidden phase in RbV$_3$Sb$_5$. At ~35 K, the longitudinal cubic response develops a strong kink and pronounced directional anisotropy with a strong departure from common relaxation time scaling, while the transverse cubic response acquires a magnetic field-odd component at the same temperature. Their coincident onset identifies the third-harmonic response as a sensitive marker of the low-temperature electronic reconstruction with time-reversal broken symmetry. Crucially, we find that the quantum metric quadrupole contributes directly to the longitudinal third-ord "material", "spectroscopy"], "image": "", "briefing": {"background": "1T-TaS2와 같은 층상 전이금속 디칼코게나이드(TMD)는 전하 밀도 파동(CDW) 상전이를 겪으며, 이는 물질의 전자 상태와 전도성에 극적인 변화를 초래합니다.", "motivation": "NC-CDW와 C-CDW 상 사이의 1차 상전이 과정에서 발생하는 전자적 가간섭성(coherence) 붕괴와 그 이력 현상을 분광학적으로 이해하고자 합니다.", "result": "상전이 구간에서의 전자 구조 변화를 관찰하여 저에너지 상태의 붕괴가 상전이와 어떻게 동기화되는지 확인했습니다.", "implication": "강상관 전자계에서 CDW 전이의 동역학적 메커니즘을 밝히고, 상전이 동안 발생하는 전자 상태의 불안정성을 명확히 설명합니다.", "novelty": "CDW 상전이 시 발생하는 이력 현상(hysteretic behavior)을 분광학적으로 포착하여 전자적 위상 안정성에 대한 단서를 제공합니다.", "unresolved": "이러한 가간섭성 붕괴가 정확히 격자 변위와 어떤 시간적/공간적 순서로 일어나는지에 대한 미시적 원리는 추가 검토가 필요합니다.", "future_work": "초고속 분광학(ultrafast spectroscopy)을 이용한 상전이 동역학 연구가 뒤따를 것으로 보입니다.", "concepts": [{"term": "Charge Density Wave (CDW)", "why_emerged": "저차원 금속에서 전자-포논 상호작용에 의한 에너지 안정화를 이해하기 위해 필요합니다.", "origin": "Peierls에 의해 1차원 시스템에서 이론적으로 제안됨.", "connections": "파이얼스 전이, 금속-절연체 전이, 1T-TaS2."}, {"term": "Coherence Collapse", "why_emerged": "상전이 과정에서 준입자(quasiparticle) 상태의 수명과 위상 정보가 어떻게 상실되는지 설명하기 위해 사용됨.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "준입자 분광학, 밴드 갭 열림, 페르미 액체 이론."}], "english_summary": ["Investigated the first-order CDW transition in 1T-TaS2 using spectroscopic techniques.", "Identified hysteretic coherence collapse across the NC-CDW to C-CDW phase transition.", "Clarified the evolution of low-energy electronic structure during the structural and electronic reorganization.", "Provides insights into the stability and phase transition dynamics of correlated TMD systems."]}}, {"title": "Josephson scanning tunneling spectroscopy in superconducting phases coexisting with pair-, charge-, and spin-density waves", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/bpgf-f4bg", "authors": "Alyson Laskowski, Jasmin Bedow, Dirk K. Morr", "last_authors": "Jasmin Bedow, Dirk K. Morr", "summary": "Here, the authors demonstrate that the recent observations in scanning tunneling spectroscopy (STS) experiments of spatial oscillations in the energy position of the superconducting coherence peaks in the cuprate, transition metal dichalcogenide, iron-based, and heavy-fermion superconductors can arise from the possible presence of pair-, charge- or spin-density-wave phases. In all of these phases, the spatial oscillations of the superconducting order parameter can be imaged via the critical Josephson current, measured in Josephson STS experiments.", "tier": "B_IMPORTANT_CONDMAT", "score": "9", "reason": "STS study on density-wave phases in cuprates and TMDs; very relevant methodology and materials.; demoted from A: broad CM, not direct user/project hit", "tags": ["method", "STS", "superconductivity"], "image": "", "briefing": {"background": "고온 초전도체나 TMD 같은 강상관 물질에서는 초전도성과 전하/스핀 밀도 파동이 흔히 공존하는데, 이들의 미시적 결합 원리를 밝히는 것이 현대 응집물질물리의 핵심 과제입니다.", "motivation": "STS에서 관찰되는 초전도 코히런스 피크의 공간적 진동 원인을 밀도 파동의 존재와 연관 지어 해석하고자 합니다.", "result": "조셉슨 터널링 분광(Josephson STS) 기법을 통해 밀도 파동이 초전도 질서 매개변수에 미치는 공간적 영향을 영상화할 수 있음을 이론적으로 입증했습니다.", "implication": "STS 실험 결과에서 나타나는 초전도 특성의 국소적 변동이 단순히 불순물이 아닌, 경쟁하거나 공존하는 밀도 파동 상태로부터 유래할 수 있음을 제시합니다.", "novelty": "기존 STS 연구의 해석 범위를 넓혀 밀도 파동과 초전도성 간의 미시적 연결 고리를 조셉슨 전류의 공간적 진동으로 명확히 규명했습니다.", "unresolved": "실험 데이터의 노이즈와 실제 물질에서의 기하학적 제약 조건 하에서 이 기법이 얼마나 높은 해상도로 밀도 파동을 분리해낼 수 있는지는 실험적 검증이 추가로 필요합니다.", "future_work": "다양한 강상관 물질에서의 Josephson STS 실측 및 밀도 파동 위상(phase)과 초전도 파동 함수 간의 위상 관계 연구.", "concepts": [{"term": "Josephson STS", "why_emerged": "초전도 질서 매개변수의 크기뿐만 아니라 위상적 정보를 미시적으로 추출하기 위해 필요합니다.", "origin": "Brian Josephson이 제안한 조셉슨 효과를 기반으로 한 발전된 주사 터널링 기술.", "connections": "조셉슨 효과, 초전도 질서 매개변수, 밀도 파동."}, {"term": "Pair Density Wave (PDW)", "why_emerged": "초전도 질서 매개변수가 공간적으로 변조되는 상태를 설명하기 위해 도입됨.", "origin": "고온 초전도체 이론 연구 과정에서 2000년대 후반 부각됨.", "connections": "고온 초전도체, 전하 밀도 파동, 강상관 전자계."}], "english_summary": ["Demonstrated that Josephson STS can image spatial oscillations in the superconducting order parameter.", "Proposed that these oscillations result from coexisting pair-, charge-, or spin-density waves.", "Applied to analyze electronic signatures in cuprates, TMDs, and heavy-fermion superconductors.", "Provides a method to link density-wave order with local superconducting properties."]}}, {"title": "Quantum Oscillation and Topology Change of the Uncondensed Landau Fermi Surface in Superconducting CeCoIn5", "journal": "PRL_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/sfxm-n236", "authors": "Sangyun Lee, Ammar Jahin, Duk Y. Kim, et al.", "last_authors": "Shi-Zeng Lin, R. Movshovich", "summary": "Metals typically have multiple Fermi-surface sheets, and when they enter the superconducting state, some electrons on these sheets may remain uncondensed, or their superconducting pairs can be rapidly destroyed by a magnetic field. Detecting uncondensed electrons within the superconducting state pro…", "tier": "B_IMPORTANT_CONDMAT", "score": "9", "reason": "Important experimental study of Fermi surface topology in a heavy fermion superconductor.", "tags": ["experiment", "CeCoIn5", "Fermisurface"], "image": "", "briefing": {"background": "CeCoIn5는 전형적인 중페르미온(heavy fermion) 초전도체로, 강한 전자 상관관계와 자기장 하에서의 페르미 표면 변화가 물리학적 핵심 관심사입니다.", "motivation": "초전도 상태 내부에서 응축되지 않은(uncondensed) 준입자가 자기장에 의해 어떻게 반응하는지, 그리고 그 과정에서 페르미 표면의 위상적 변화가 일어나는지 확인하고자 함.", "result": "양자 진동 측정을 통해 초전도 상태 내에 존재하는 비응축 준입자의 페르미 표면 특성과 자기장에 따른 위상적 변화의 증거를 포착함.", "implication": "중페르미온 시스템에서 초전도성과 자기적 질서가 페르미 표면 구조와 어떻게 상호작용하는지에 대한 이해를 높이며, 강상관계 물질의 위상적 상태 연구에 기여.", "novelty": "초전도체 내부의 비응축 페르미 면을 직접적으로 탐구했다는 점에서 강상관계 전자 구조 연구에 유의미한 데이터 제공.", "unresolved": "자기장 유도 위상 변화의 구체적인 메커니즘과 이것이 비전통적 초전도성(unconventional superconductivity) 메커니즘과 맺는 직접적인 상관관계.", "future_work": "더 높은 자기장 하에서의 페르미 표면 진화 관찰 및 다른 중페르미온 물질과의 비교 연구.", "concepts": [{"term": "중페르미온 (Heavy Fermion)", "why_emerged": "4f 또는 5f 전자들이 전도 전자들과 강력하게 상호작용하여 유효 질량이 극도로 커지는 현상을 설명하기 위해.", "origin": "1970년대 Steglich 등에 의한 CeCu2Si2 발견 이후 정립.", "connections": "Kondo 격자 모델, 비전통적 초전도성."}, {"term": "양자 진동 (Quantum Oscillation)", "why_emerged": "물질 내 페르미 표면의 크기와 모양을 직접적으로 측정하기 위한 강력한 도구.", "origin": "de Haas-van Alphen 효과 등을 통해 정립.", "connections": "Lifshitz-Kosevich 이론, 밴드 구조 계산."}], "english_summary": ["Studies the uncondensed Fermi surface in the heavy fermion superconductor CeCoIn5.", "Uses quantum oscillations to probe electronic structure under magnetic fields.", "Identifies a topological change in the Fermi surface within the superconducting state.", "Highlights the complex interplay between superconductivity and electronic topology."]}}, {"title": "Material-architecture-manufacture integrated strategy for piezoelectric metamaterials with mechanical protection and self-powered sensing", "journal": "Science_Advances", "source": "Gemini", "link": "https://doi.org/10.1126/sciadv.aeg1744", "authors": "Zhicheng Wang, Xiaozhou Xin, Jingfei Wang, Liwu Liu, Yanju Liu, Jinsong Leng", "last_authors": "Yanju Liu, Jinsong Leng", "summary": "The increasingly complex tasks of intelligent equipment have shifted the demand for structural materials from mere lightweight protection to multifunction integration, i.e., high recoverable energy absorption and accurate monitoring. Herein, we presented a material-architecture-manufacture integrated strategy for piezoelectric metamaterials to simultaneously achieve mechanical protection and self-powered sensing. Specifically, an intercalation heterostructure of silane-modified barium titanate (K-BTO)/MXene was constructed to improve the interfacial polarization effect, and an innovative electric field–assisted 4D printing technology could effectively induce the in situ poling of K-BTO. Furthermore, the Kagome lattice–inspired metamaterial (k-CAH) exhibited superior specific energy absorption (0.18 joules per gram), resulting from compression-bend-torsion coordination and multidirection coupling mechanisms. The multimode coupling deformation and local strain amplification mechanism, induced by the geometry design, substantially improved output capacities through activating various piezoelectric response modes at low frequency. With the material-architecture-manufacture synergy, g 33 eff reached up to 1.712 volt-meters per newton. The developed piezoelectric metamaterial system exhibited accurate self-powered sensing of real-time impact and high-efficiency energy harvesting under microvibration conditions, promising for the next-generation smart structural materials.", "tier": "B_IMPORTANT_CONDMAT", "score": "9", "reason": "Explores piezoelectric metamaterials with a Kagome lattice architecture, a direct material interest.; demoted from A: broad CM, not direct user/project hit", "tags": ["kagome", "metamaterials", "piezoelectric", "materialsengineering"], "image": "", "briefing": {"background": "압전 메타물질은 구조적 강도와 에너지 수확 기능을 동시에 갖추도록 설계된 지능형 재료로, 기계적 충격 보호와 자가 발전 센싱을 통합하려는 노력이 활발합니다.", "motivation": "카고메(Kagome) 격자의 기하학적 구조를 활용하여 압전 반응을 극대화하고, 다중 모드 변형을 통해 효율적인 에너지 수확과 감지를 구현하고자 함.", "result": "Kagome 격자 기반의 압전 메타물질(k-CAH)을 설계하여 압축, 굽힘, 비틀림의 결합을 통해 낮은 주파수에서도 높은 압전 출력을 얻는 데 성공함.", "implication": "재료-구조-공정 통합 전략을 통해 복합 기능을 갖춘 차세대 스마트 구조 재료 설계의 새로운 프레임워크를 제시함.", "novelty": "전자 관심 분야인 Kagome 격자 구조를 공학적으로 응용하여 압전 효율을 비약적으로 개선한 사례.", "unresolved": "실제 극한 환경에서의 내구성과 장기적인 압전 응답의 안정성.", "future_work": "초소형 전자 기기에의 통합 및 광대역 주파수 대응을 위한 격자 구조 최적화.", "concepts": [{"term": "카고메 격자 (Kagome Lattice)", "why_emerged": "코너를 공유하는 삼각형들로 이루어진 구조로, 기하학적 좌절(frustration)과 특이한 밴드 분산 관계를 연구하기 위해 도입.", "origin": "일본의 전통 바구니 짜기 문양에서 유래, 고체물리에서는 1950년대에 도입.", "connections": "Dirac 포인트, 위상학적 절연체, 비전통 초전도체."}, {"term": "압전 효과 (Piezoelectric effect)", "why_emerged": "기계적 변형을 전기 에너지로 변환하거나 그 반대의 과정을 구현하기 위해.", "origin": "1880년 퀴리 형제에 의해 발견.", "connections": "강유전체, 에너지 수확, 스마트 센서."}], "english_summary": ["Develops a Kagome-lattice-inspired piezoelectric metamaterial.", "Achieves integration of mechanical protection and self-powered sensing.", "Uses electric-field-assisted 4D printing for effective material poling.", "Demonstrates high piezoelectric output through multimode coupling."]}}, {"title": "Equilibrium Stabilization of a Hidden Phase Like Metallic State in 1T-TaS2", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2605.22292", "authors": "Anil Rajapitamahuni, Suji Park, Houk Jang, Asish K. Kundu, Elio Vescovo, Turgut Yilmaz", "last_authors": "Elio Vescovo, Turgut Yilmaz", "summary": "Electronic phases that lie outside the equilibrium ground state offer a route to explore competing configurations in correlated materials. In 1T-TaS2, ultrafast excitation accesses a metallic hidden phase that is distinct from the commensurate insulating ground state. Here we use angle-resolved photoemission spectroscopy to show that an equivalent electronic configuration is stabilized in exfoliated intermediate-thickness 1T-TaS2 flakes, where it persists up to room temperature before evolving through a different sequence of electronic transitions. This equilibrium hidden-phase-like state hosts a metallic band with finite Fermi-level spectral weight while retaining the characteristic hybridization gaps associated with the star-of-David band folding. These results establish a platform for controlling competing electronic states in layered materials, with implications for both quantum science and phase change technologies.", "tier": "B_IMPORTANT_CONDMAT", "score": "9", "reason": "Direct ARPES observation of a hidden electronic phase in a prototypical CDW material.", "tags": ["ARPES", "CDW", "material"], "image": "https://arxiv.org/html/2605.22292v3/Figure1.png", "briefing": {"background": "1T-TaS2는 전하 밀도 파(CDW)와 강한 전자 상관관계가 복합적으로 나타나는 대표적인 층상 구조 물질로, 비평형 상태의 숨겨진 위상(hidden phase) 연구가 중요함.", "motivation": "초고속 레이저로만 유도되던 숨겨진 금속성 상을 층상 구조 조절(박리)을 통해 열역학적 평형 상태에서 안정화시킬 수 있는지 확인하고자 함.", "result": "중간 두께의 박리된 1T-TaS2 시료에서 실온까지 안정적인 숨겨진 금속성 상을 ARPES로 관측함.", "implication": "초고속 물리 현상으로만 여겨지던 상태를 평형 상태에서 다룰 수 있게 되어, 상변화 소자 및 위상 전자 소자 개발에 새로운 돌파구 마련.", "novelty": "CDW 물질에서 밴드 구조와 페르미 면의 상태를 직접  candidate Ce4Ge7 under magnetic fields and pressure.", "Observed metamagnetic transitions and intrinsic anomalous Hall effect along the b-axis.", "Identified an antiferromagnetic quantum critical point at 10.2 GPa.", "Demonstrated non-Fermi liquid behavior near the critical pressure."]}}, {"title": "Far-field terahertz spectroscopy across the charge-density-wave transition in 2H-NbSe2", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2609.36125", "authors": "Dmitriy Yavorskiy, Adil Rehman, Wojciech Brzezicki, et al.", "last_authors": "Andrzej Wi\\'sniewski, Ashutosh S. Wadge", "summary": "Charge-density-wave (CDW) formation in 2H-NbSe$_2$ modifies the low-energy electronic structure and gives rise to collective excitations coupled to the lattice. Here, we investigate bulk 2H-NbSe$_2$ single crystals using far-field terahertz time-domain spectroscopy (THz-TDS) in reflection geometry across the CDW transition at $T_{\\mathrm{CDW}} \\approx 33$~K. Below $T_{\\mathrm{CDW}}$, the THz response shows a pronounced high-frequency feature near 1.5~THz together with longer-lived sub-THz oscillations. Both responses progressively weaken upon warming and are strongly suppressed across the CDW transition, supporting their association with the CDW state. Using time-dependent Ginzburg--Landau simulations, we reproduce the main features of the experimental THz response, associating the high-frequency response mainly with CDW amplitude dynamics and the sub-THz response with defect-pinned phase dynamics. The $\\sim1.5$~THz feature lies close to the frequency range reported for the Raman CDW amplitude mode, while coupling to lattice degrees of freedom may also influence its spectral position. We also performed complementary angle-resolved photoemission spectroscopy measurements, which reveal momentum-selective redistribution of near-Fermi-level spectral weight across the transition. Together, these results show that far-field THz spectroscopy provides a
