: {"background": "스핀트로닉스는 전자의 스핀을 이용한 정보 전달을 목표로 하지만, 기존의 금속 기반 시스템은 스핀 확산 거리가 매우 짧다는 한계가 있습니다. 광자는 스핀을 먼 거리까지 운반할 수 있으나 비선형성이 부족하여 소자 논리 게이트 구현이 어렵습니다.", "motivation": "전이금속 칼코겐화물(TMDC)을 활용하여 스핀의 장거리 전파와 강한 비선형적 상호작용을 동시에 확보하고자 하는 시도입니다.", "result": "TMDC 기반 도파관(waveguide)을 사용하여 상온에서 스핀을 최대 100 μm까지 전파시켰으며, 이때 높은 폴라리톤 비선형성을 유지함을 보였습니다.", "implication": "광자와 스핀의 장점을 결합하여 상온 동작이 가능한 저전력 초고속 논리 소자의 실현 가능성을 제시합니다.", "novelty": "2D 소재인 TMDC의 엑시톤-폴라리톤 특성을 이용해 기존 스핀트로닉스의 거리 제약을 극복했다는 점이 독자님께서 관심 있는 2D 소재 및 Spintronics 분야에 새로운 응용 가능성을 제공합니다.", "unresolved": "실제 상온에서의 디바이스 구동 시 에너지 소모 및 집적도 측면의 구체적인 성능 지표는 아직 제시되지 않았습니다.", "future_work": "실제 논리 게이트 구현을 위한 소자 설계 및 장거리 전파 효율 최적화 연구가 필요합니다.", "concepts": [{"term": "폴라리톤(Polariton)", "why_emerged": "빛과 물질의 강한 결합 상태를 기술하기 위해 도입되었습니다.", "origin": "John Hopfield (1958년 이론적 제안).", "connections": "엑시톤-폴라리톤, 광자-스핀 결합, 비선형 광학."}, {"term": "TMDC(전이금속 칼코겐화물)", "why_emerged": "우수한 반도체 특성과 층상 구조를 가진 2D 소재가 필요했습니다.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "MoS2, WSe2, 2D 전자계, 엑시톤 물리."}], "english_summary": ["TMDC-based polariton waveguides achieve 100 μm spin propagation at room temperature.", "The system combines the long-distance transport of photons with strong nonlinearities.", "This approach enables potential integration of spin-based information processing with optical logic."]}}, {"title": "Landscape geometry of Majorana zero modes in inhomogeneous superconductors", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2609.18138", "authors": "Guo-Jian Qiao, Zhi-Lei Zhang, Kang Xu, C. P. Sun", "last_authors": "Kang Xu, C. P. Sun", "summary": "Conventional methods for characterizing Majorana zero modes in inhomogeneous superconductors generally cannot be applied directly when the potential profile is unknown. To address this limitation, we propose a real-space approach based on a landscape for the zero-energy spatial dynamics. The landscape geometry determines the number of Majorana zero modes, and the conventional topological phase transition is recovered as a geometric transition of the landscape in the homogeneous limit. Without specifying detailed spatial profiles, the approach yields analytical bounds on Hamiltonian parameters and their spatial gradients that guarantee Majorana zero modes. Application to nanowire--superconductor systems demonstrates the predictive power of this profile-independent criterion and quantifies tolerable electrostatic inhomogeneity for Majorana-device design. Landscape geometry thus offers a dynamical perspective with broad applicability to topological boundary states.", "tier": "C_MAYBE", "score": "8", "reason": "Develops a practical, profile-independent approach for characterizing Majorana zero modes in inhomogeneous superconductors.; tier capped to C: formal/generic theory watch", "tags": ["Majorana", "topologicalsuperconductivity", "superconductivity", "theory", "devicephysics"], "image": "https://arxiv.org/html/2609.18138v2/Fig1.png", "briefing": {"background": "위상 초전도체에서 발생하는 마요라나 영 모드(MZM)는 양자 컴퓨팅의 핵심 자원이지만, 실제 불균일한(inhomogeneous) 환경에서 MZM을 탐지하고 제어하는 것은 이론적으로 난제입니다.", "motivation": "특정 전위 프로파일을 알 수 없는 실제 소자 환경에서도 MZM의 존재를 판별할 수 있는 범용적인 기준이 필요했습니다.", "result": "영 에너지 공간 역학을 기반으로 한 '지형 기하학(landscape geometry)' 접근법을 제시하여, 복잡한 프로파일 정보 없이도 MZM 존재를 보장하는 해석적 경계와 조건을 도출했습니다.", "implication": "불균일성이 존재하는 나노와이어 소자 설계 시 허용 가능한 변동성을 정량화할 수 있어, 위상 양자 소자 제작의 가이드라인을 제공합니다.", "novelty": "기존의 위상 전이 모델이 갖는 제약을 기하학적 관점으로 극복하였으며, 실험적인 노이즈나 불균일성이 강한 실제 위상 초전도체 소자 연구에 직접적인 응용 가능성을 가집니다.", "unresolved": "본 이론은 이상적인 모델링을 가정하고 있으며, 초전도체-반도체 계면의 세부적인 Disorder 성분이 미치는 영향에 대한 심층 분석이 추가로 요구됩니다.", "future_work": "실제 실험 데이터와 결합하여 MZM 분포 지형을 시각화하고 소자 최적화 공정에 적용하는 연구가 기대됩니다.", "concepts": [{"term": "마요라나 영 모드(MZM)", "why_emerged": "위상 초전도체의 경계에서 나타나는 비 아벨 통계성을 가진 준입자가 양자 정보 저장에 유리하기 때문입니다.", "origin": "Ettore Majorana (입자), Kitaev (물성 분야 응용, 2001).", "connections": "위상 초전도체, 양자 컴퓨팅, 키타에프 체인."}, {"term": "지형 기하학(Landscape geometry)", "why_emerged": "해밀토니안의 상세 정보를 모르더라도 상태의 위상적 성질을 추론하기 위해 도입되었습니다.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "위상적 상전이, 위상 지수, 국소 상태 밀도."}], "english_summary": ["A real-space geometric approach characterizes MZM in inhomogeneous superconductors.", "The method predicts MZM existence without requiring specific spatial potential profiles.", "Provides analytical bounds for tolerating electrostatic inhomogeneity in topological devices."]}}, {"title": "One Measurement, Many Fronts in Kitaev and Cluster Chains", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2611.10912", "authors": "Nicholas Musat, Stephan Haas, Rishabh Jha", "last_authors": "Stephan Haas, Rishabh Jha", "summary": "A projective measurement of one site in the ground state of a quantum chain disturbs the chain in two ways: learning the outcome shifts distant expectation values at once, through ground-state correlations, and the measurement erases the correlations between the measured site and the rest. Both changes travel outward. We solve this problem exactly for the Kitaev chain, the cluster chain in a transverse field, and the Kitaev chain with power-law couplings, and we find that far from the measured site every quadratic observable responds through a front. Where the front is and how fast it broadens depend only on the quasiparticle dispersion. How strong it is depends on two operators: how strongly the measured one creates the fastest quasiparticles and how strongly the observed one detects them; if either factor vanishes, the front is weaker and decays faster. One measurement therefore launches many fronts, one per observable, with a common position and width but different decay laws. In the Kitaev chain the density and the bond energy, the two terms of its nearest-neighbor Hamiltonian, respond to one density measurement with decay laws that trade places between the topological and the trivial phase; in the cluster chain, measuring a symmetry-odd spin instead of a symmetry-even one changes the critical decay law at a fixed Hamiltonian; and with power-law couplings the width law itself changes. All decay laws and profiles are obtained in closed form.", "tier": "C_MAYBE", "score": "7", "reason": "Theoretical study of measurement dynamics and correlations in Kitaev topological chains, relevant to Majorana physics.; tier capped to C: formal/generic theory watch", "tags": ["theory", "topological", "Majorana", "Kitaevmodel", "quantummeasurement"], "image": "https://arxiv.org/html/2611.10912v2/fronts.png", "briefing": {"background": "양자 다체 시스템에서 하나의 상태를 측정하는 것은 전체 시스템의 상관관계를 변화시키며, 이 변화가 어떻게 전파되는지 이해하는 것은 양자 정보 이론과 다체 물리학의 중요한 문제입니다.", "motivation": "키타에프 체인과 같은 위상적 모델에서 국소 측정이 시스템 전반의 기대값 변화(front)를 어떻게 유도하는지 정확히 규명하고자 했습니다.", "result": "측정 후 발생하는 전파 현상(front)의 위치, 폭, 붕괴 법칙을 준입자 분산 관계를 통해 폐쇄형 수식으로 도출했습니다.", "implication": "위상적 상과 자명한 상에서 측정 응답이 다르게 나타나는 물리적 원리를 밝혀냈으며, 이는 양자 측정 제어 및 양자 정보 전송 연구의 토대가 됩니다.", "novelty": "위상학적 위상과 자명한 위상 간의 측정 응답 차이를 규명함으로써, 위상 시스템의 동역학적 특성을 측정 기반으로 구분할 수 있는 논리적 기반을 제공합니다.", "unresolved": "이 결과가 1차원 키타에프 체인 이외의 2D/3D 고차원 위상 시스템이나 상호작용이 강한 시스템으로 어떻게 일반화되는지는 여전히 과제입니다.", "future_work": "다양한 위상적 비평형 동역학 시스템에서 본 측정 응답 법칙의 실험적 검증이 요구됩니다.", "concepts": [{"term": "키타에프 체인(Kitaev chain)", "why_emerged": "1차원 위상 초전도체의 가장 간단한 모델로서 MZM을 기술하기 위해 제안되었습니다.", "origin": "Alexei Kitaev (2001년).", "connections": "p-파 초전도체, 마요라나 페르미온, 위상 양자 컴퓨터."}, {"term": "투영 측정(Projective measurement)", "why_emerged": "양자 상태를 붕괴시켜 특정 고유 상태로 강제하는 표준적인 양자 역학 측정 과정입니다.", "origin": "양자역학 초기 정립기(폰 노이만 등).", "connections": "양자 얽힘, 상태 붕괴, 다체 시스템 동역학."}], "english_summary": ["Analyzes how single-site measurements disrupt Kitaev and cluster chains.", "Derives closed-form decay laws for expectation value fronts based on quasiparticle dispersion.", "Reveals distinct dynamical responses between topological and trivial phases."]}}, {"title": "Altermagnetism in a new light", "journal": "Nature_Physics", "source": "Gemini", "link": "https://www.nature.com/articles/s41567-026-03532-9", "authors": "Zhaoju Yang", "last_authors": "Zhaoju Yang", "summary": "Altermagnets host spin-split bands despite zero net magnetization. A photonic crystal now reproduces this symmetry-driven phenomenon using circular polarization as a spin analogue.", "tier": "C_MAYBE", "score": "6", "reason": "Photonic crystal analogue of altermagnetism; discusses symmetry-driven band splitting relevant to user's interests.", "tags": ["altermagnetism", "photonics"], "image": "https://media.springernature.com/m685/springer-static/image/art%3A10.1038%2Fs41567-026-03532-9/MediaObjects/41567_2026_3532_Fig1_HTML.png", "briefing": {"background": "알터마그네티즘(Altermagnetism)은 강자성이나 반강자성과는 다른 제3의 자기 질서로, 순자화값은 0이지만 결정 대칭성에 의해 스핀 분할된 밴드 구조를 가집니다.", "motivation": "전자계의 알터마그네틱 현상을 광결정(Photonic crystal) 구조에서 빛의 원편광을 스핀의 아날로그로 사용하여 모사하고자 함.", "result": "광결정 내에서 스핀-궤도 결합과 유사한 효과를 유도하여 알터마그네틱 특유의 밴드 분할을 재현함.", "implication": "복잡한 고체 물질 내 전자 구조를 광자 결정 시스템을 통해 정밀하게 제어 및 관측할 수 있는 플랫폼을 제시함.", "novelty": "전자 시스템의 핵심 물성을 광학 시스템으로 확장하여, 강상관 전자계에서 연구되는 대칭성 기반의 물리 현상을 광학적 차원에서 구현함.", "unresolved": "실제 고체 물질 내의 복잡한 스핀-궤도 상호작용과 광결정 내 편광 의존적 모사 사이의 정량적 대응 관계.", "future_work": "광결정 플랫폼을 활용한 위상물질의 광학적 시뮬레이션 및 비전통적 스핀-궤도 토크 제어 연구.", "concepts": [{"term": "Altermagnetism", "why_emerged": "기존 강자성/반강자성 분류로 설명되지 않는 대칭성 기반의 스핀 분할 밴드 구조를 설명하기 위해 필요.", "origin": "최근 2020년대 초반, Jungwirth 그룹 등에 의해 확립된 개념.", "connections": "반강자성체, Berry 곡률, 비전통적 자기 정렬."}, {"term": "Photonic crystal", "why_emerged": "빛의 분산을 정밀하게 제어하여 특정 파장대의 전파를 막거나 투과시키기 위한 주기적 구조체로 필요.", "origin": "Yablonovitch와 John이 1987년 제안.", "connections": "토폴로지 광학, 메타물질."}], "english_summary": ["Altermagnetism features spin-split bands despite vanishing net magnetization.", "The paper realizes an altermagnetic analogue in photonic crystals.", "Circular polarization is utilized as an effective spin degree of freedom.", "This approach bridges symmetry-protected electronic states with optical systems."]}}, {"title": "Antiferroelectric hafnia down to the 2D limit", "journal": "Science", "source": "Gemini", "link": "https://www.science.org/doi/abs/10.1126/science.ady5526?af=R", "authors": "Xin Li, Guodong Ren, Haidong Lu, et al.", "last_authors": "Rohan Mishra, Xiaoshan Xu", "summary": "Antiferroelectricity is a material property characterized by alternating electric dipoles spontaneously ordered in antiparallel directions. Antiferroelectrics are promising for energy storage, solid-state cooling, and memory technologies; however, these materials are scarce, and their scalability remains largely unexplored. In this work, we demonstrated that single-crystalline hafnia, a lead-free complementary metal-oxide semiconductor (CMOS)–compatible material, exhibits antiferroelectricity under compressive-strain conditions. We observed antiparallel sublattice polarization and stable double hysteresis in single-crystalline (111)-oriented epitaxial lanthanum (La)–doped hafnia films grown on yttrium-stabilized zirconia and showed that the antipolar orthorhombic phase of hafnia adheres to the Kittel model of antiferroelectricity. Compressive strain strengthens the orthorhombic order in thinner La-doped hafnia films, achieving a very high ordering temperature of 850°C in the two-dimensional limit, highlighting hafnia’s potential for advanced antiferroelectric devices.", "tier": "C_MAYBE", "score": "6", "reason": "Study of 2D limit in dielectric materials, relevant to broader interests in 2D systems.", "tags": ["material", "2Dmaterials", "hafnia"], "image": "", "briefing": {"background": "반강유전체(Antiferroelectric)는 인접한 전기 쌍극자가 반대 방향으로 배열된 물질로, 에너지 저장 및 메모리 소자로서의 잠재력이 큼.", "motivation": "반강유전체 hafnia(HfO2)가 2D 극한 두께에서도 이러한 특성을 유지하는지 확인하고, CMOS 공정 호환성을 검증하고자 함.", "result": "압축 변형이 가해진 La-도핑된 얇은 hafnia 박막이 850°C라는 매우 높은 온도까지 반강유전성을 유지함을 확인함.", "implication": "차세대 비휘발성 메모리 및 초소형 전기소자에 HfO2를 응용할 수 있는 기초 물성을 확보함.", "novelty": "2D 극한 영역에서 반강유전적 차수(Antipolar orthorhombic phase)가 안정적으로 존재함을 입증함.", "unresolved": "두께가 단원자 층으로 극도로 얇아질 때 계면 효과에 따른 반강 let index = 0;

const nextBtn = document.getElementById('next');
function textEl(tag, className, text) { const el = document.createElement(tag); if (className) el.className = className; el.textContent = text || ''; return el; }
function appendLabeledText(parent, className, label, text) { if (!text) return; const el = document.createElement('p'); el.className = className; const strong = textEl('strong', '', label); el.appendChild(strong); el.append(text); parent.appendChild(el); }
function appendBriefSection(parent, title, text, wide = false) { if (!text) return; const section = document.createElement('section'); section.className = 'brief-section' + (wide ? ' wide' : ''); section.appendChild(textEl('h2', '', title)); section.appendChild(textEl('p', '', text)); parent.appendChild(section); }
function render() {

    figure.appendChild(textEl('figcaption', '', 'Figure / article preview image from the source page'));

  }
  const headText = document.createElement('div');
  headText.className = 'head-text';
  const badges = document.createElement('div');
  badges.className = 'badges';
  if (r.score) badges.appendChild(textEl('span', 'badge score', `${r.score}/10`));
  if (r.tier) badges.appendChild(textEl('span', 'badge', r.tier));
  if (r.journal) badges.appendChild(textEl('span', 'badge', r.journal));
  if (r.source) badges.appendChild(textEl('span', 'badge', r.source));
  headText.appendChild(badges);
  const title = document.createElement('h1');
  if (r.link) { const titleLink = document.createElement('a'); titleLink.href = r.link; titleLink.target = '_blank'; titleLink.rel = 'noopener noreferrer'; titleLink.textContent = r.title || ''; title.appendChild(titleLink); }
  else { title.textContent = r.title || ''; }
  headText.appendChild(title);
  headText.appendChild(textEl('p', 'meta', [r.journal, r.source].filter(Boolean).join(' | ')));
  if (r.last_authors || r.authors) { const authors = document.createElement('p'); authors.className = 'authors'; if (r.last_authors) authors.append('Last authors: ' + r.last_authors); if (r.authors) authors.append((r.last_authors ? ' | ' : '') + 'Authors: ' + r.authors); headText.appendChild(authors); }
  appendLabeledText(headText, 'why', 'Filter reason: ', r.reason);
  if (r.tags && r.tags.length) { const tags = document.createElement('div'); tags.className = 'tags'; r.tags.forEach(tag => tags.appendChild(textEl('span', 'tag', '#' + tag))); headText.appendChild(tags); }
  if (r.link) { const link = document.createElement('a'); link.className = 'link'; link.href = r.link; link.target = '_blank'; link.rel = 'noopener noreferrer'; link.textContent = 'Open paper'; headText.appendChild(link); }
  head.appendChild(headText);
  if (r.summary) { const abstract = document.createElement('p'); abstract.className = 'original-abstract'; const strong = textEl('strong', '', 'Original abstract'); abstract.appendChild(strong); abstract.append(r.summary); head.appendChild(abstract); }
  slideEl.appendChild(head);
  const briefing = document.createElement('div');
  briefing.className = 'briefing';
  appendBriefSection(briefing, 'Background', b.background);
  appendBriefSection(briefing, 'Motivation', b.motivation);
  appendBriefSection(briefing, 'Result', b.result);
  appendBriefSection(briefing, 'Implication', b.implication);
  appendBriefSection(briefing, "Why it's important / Novelty", b.novelty);
  appendBriefSection(briefing, 'Unresolved Questions', b.unresolved);

  if (b.concepts && b.concepts.length) {
    const section = document.createElement('section');

    section.appendChild(textEl('h2', '', 'Concepts / Terms'));
