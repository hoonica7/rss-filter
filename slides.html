<title>Daily Paper Slideshow</title>
<style>
  :root {
    color-scheme: light;
    --bg: #f6f7f4;
    --paper: #ffffff;
    --ink: #111827;
    --muted: #64748b;
    --line: #d8ddd2;
    --accent: #176b87;
    --accent-2: #9a3412;
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; overflow: auto; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: var(--bg); color: var(--ink); }
  .shell { max-width: 1500px; min-height: 100vh; margin: 0 auto; padding: 14px 18px; display: flex; flex-direction: column; }
  .topbar { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 16px; }
  .top-actions { display: flex; align-items: center; gap: 10px; }
  .topbar a, button { border: 1px solid var(--line); border-radius: 8px; background: var(--paper); color: var(--ink); padding: 10px 14px; font-weight: 700; text-decoration: none; cursor: pointer; }
  button.primary { background: var(--accent); border-color: var(--accent); color: white; }
  button:disabled { opacity: 0.45; cursor: not-allowed; }
  .counter { color: var(--muted); font-weight: 700; }
  .slide { min-height: calc(100vh - 82px); background: var(--paper); border: 1px solid var(--line); border-radius: 10px; padding: 18px; box-shadow: 0 18px 42px rgba(15, 23, 42, 0.10); display: grid; grid-template-columns: minmax(310px, 0.86fr) minmax(0, 1.55fr); gap: 18px; overflow: visible; }
  .paper-head { min-width: 0; min-height: 0; overflow: visible; display: flex; flex-direction: column; gap: 12px; }
  .figure { margin: 0; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: #f8fafc; }
  .figure img { display: block; width: 100%; max-height: 41vh; object-fit: contain; background: white; }
  .figure figcaption { padding: 7px 10px; color: var(--muted); font-size: 12px; line-height: 1.3; }
  .head-text { display: flex; flex-direction: column; gap: 9px; min-width: 0; }
  .badges { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .badge { border-radius: 999px; padding: 5px 9px; background: #eef2ff; color: #3730a3; font-size: 12px; font-weight: 800; }
  .score { background: #fee2e2; color: #991b1b; }
  h1 { margin: 0; font-size: 25px; line-height: 1.15; letter-spacing: 0; overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
  h1 a { color: inherit; text-decoration-color: rgba(23, 107, 135, 0.35); text-decoration-thickness: 2px; text-underline-offset: 4px; }
  h1 a:hover { color: var(--accent); text-decoration-color: var(--accent); }
  .meta, .authors, .why, .abstract { font-size: 13px; line-height: 1.45; }
  .meta, .authors { color: var(--muted); }
  .why strong, .abstract strong, .authors strong { color: var(--ink); }
  .authors { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .why { border-left: 4px solid var(--accent-2); padding-left: 10px; color: #374151; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .abstract { border-top: 1px solid var(--line); padding-top: 14px; color: #374151; }
  .original-abstract { border-top: 1px solid var(--line); padding-top: 10px; color: #374151; font-size: 11.5px; line-height: 1.35; overflow-wrap: anywhere; }
  .original-abstract strong { display: block; margin-bottom: 4px; color: var(--ink); }
  .tags { display: flex; flex-wrap: wrap; gap: 8px; }
  .tag { border-radius: 999px; padding: 4px 8px; background: #f1f5f9; color: #475569; font-size: 12px; font-weight: 700; }
  .head-text > .link { display: none; }
  .briefing { min-width: 0; min-height: 0; overflow: visible; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); grid-auto-rows: minmax(0, auto); align-content: start; gap: 11px 18px; border-top: 0; padding-top: 0; }
  .brief-section { min-width: 0; }
  .brief-section.wide { grid-column: 1 / -1; }
  .brief-section h2 { margin: 0 0 4px; font-size: 14px; line-height: 1.22; color: #0f766e; letter-spacing: 0; }
  .brief-section p, .brief-section li { margin: 0; font-size: 12.5px; line-height: 1.42; color: #1f2937; overflow-wrap: anywhere; }
  .brief-section ul { margin: 0; padding-left: 20px; }
  .concepts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 9px 14px; }
  .concept { border-top: 1px solid var(--line); padding-top: 7px; }
  .concept h3 { margin: 0 0 4px; font-size: 13px; color: #7c2d12; letter-spacing: 0; }
  .concept p { margin: 2px 0 0; font-size: 11.5px; line-height: 1.35; color: #374151; overflow-wrap: anywhere; }
  .concept b { color: #111827; }
  .link { color: var(--accent); font-weight: 800; text-decoration: none; }
  .empty { padding: 48px; background: var(--paper); border: 1px solid var(--line); border-radius: 12px; color: var(--muted); }
  @media (max-width: 860px) {
    .shell { padding: 14px; }
    .topbar, .top-actions { align-items: stretch; flex-direction: column; }
    .slide, .briefing, .concepts { grid-template-columns: 1fr; }
    .slide { min-height: auto; overflow: visible; display: grid; }
    h1 { font-size: 28px; }
  }
</style>

<script>
const slides = [{"title": "Nonreciprocal impurity scattering as a probe for pairing symmetries in kagome superconductors", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/6d8l-gzdq", "authors": "Hong-Min Jiang, Hao Du, Shun-Li Yu", "last_authors": "Hao Du, Shun-Li Yu", "summary": "The superconducting (SC) pairing symmetry and its link to time-reversal symmetry breaking (TRSB) in the vanadium-based kagome superconductors remain unresolved, with ambiguities stemming from sublattice interference and charge-density-wave (CDW) entanglement with superconductivity. Using two represe…", "tier": "A_MUST_READ", "score": "10", "reason": "Directly relevant to user's projects on kagome metals, TRSB, and CDW entanglement.", "tags": ["theory", "kagome", "TRSB", "superconductivity"], "image": "", "briefing": {"background": "카고메 금속 AV3Sb5(A=K, Rb, Cs) 계열은 특이한 격자 구조로 인해 평탄 밴드, 디락 콘, 반-충전된 반-금속성 등 풍부한 물리 현상을 보입니다. 특히 초전도성과 전하 밀도 파동(CDW)이 공존하며, 시간 역전 대칭성 파괴(TRSB) 가능성이 제기되어 응집 물질 물리 분야의 핵심 연구 주제가 되었습니다.", "motivation": "이들 물질에서 초전도 페어링 대칭성을 규명하는 것은 매우 중요하지만, 서브격자 간섭 효과와 CDW와의 얽힘 때문에 실험적 해석에 모호함이 존재합니다. 본 연구는 불순물 산란의 비가역성(nonreciprocal scattering)을 통해 페어링 대칭성을 명확히 구분할 수 있는 이론적 지표를 제시하고자 합니다.", "result": "연구진은 카고메 격자의 대칭성과 위상적 성질을 반영하여, 특정 페어링 대칭성(예: chiral p-wave 또는 d-wave 등)이 존재할 때 불순물 주변의 준입자 산란 패턴이 비가역적으로 나타남을 보였습니다. 이는 불순물 유도 속박 상태의 공간적 분포와 에너지 분해 산란 강도를 통해 페어링 대칭성을 실험적으로 구별할 수 있음을 의미합니다.", "implication": "만약 STS(주사 터널링 분광법) 실험에서 본 연구가 예측한 비가역적 산란 패턴이 관찰된다면, 카고메 초전도체의 TRSB 성질과 초전도 질서 매개변수의 대칭성을 확정 짓는 강력한 증거가 될 것입니다.", "novelty": "단순한 밀도 상태 분석을 넘어, 불순물에 의한 산란의 '비가역성'을 페어링 대칭성 탐침으로 제안했다는 점이 독창적입니다. 특히 사용자의 관심사인 AV3Sb5 시스템의 CDW-초전도 얽힘 문제를 해결할 수 있는 새로운 경로를 제시합니다.", "unresolved": "이론적 모델에서 가정한 CDW 위상과 실제 재료의 다중 궤도 효과가 복합적으로 작용할 때, 비가역적 신호의 크기가 충분히 측정 가능한 수준인지에 대한 추가 검증이 필요합니다.", "future_work": "CsV3Sb5와 같은 실제 재료에 대해 저온 고분해능 STM/STS를 이용한 불순물 유도 준입자 간섭(QPI) 실험을 통해 이론적 예측을 검증하는 연구가 뒤따를 것으로 예상됩니다.", "concepts": [{"term": "비가역적 불순물 산란 (Nonreciprocal scattering)", "why_emerged": "계의 반전 대칭성이나 시간 역전 대칭성이 깨졌을 때 나타나는 산란의 비대칭성을 활용해 물질의 위상적 성질을 파악하기 위해 도입되었습니다.", "origin": "초록 정보만으로는 특정하기 어려움 (일반적인 산란 이론의 확장)", "connections": "준입자 간섭(QPI), 시간 역전 대칭성 파괴(TRSB), 카고메 격자 대칭성"}, {"term": "카고메 초전도체 (Kagome superconductor)", "why_emerged": "카고메 격자에서 나타나는 특이한 밴드 구조와 상관관계가 초전도성과 결합했을 때의 신기한 양자 현상을 탐구하기 위해 부상했습니다.", "origin": "AV3Sb5 계열의 발견 (2019-2020년경)", "connections": "전하 밀도 파동(CDW), 위상적 초전도성, Frustrated magnetism"}], "english_summary": ["The paper proposes nonreciprocal impurity scattering as a diagnostic tool for identifying pairing symmetries in vanadium-based kagome superconductors.", "Theoretical analysis shows that specific superconducting orders lead to distinct spatial and energy-resolved scattering patterns near impurities.", "This provides a potential experimental path via STM/STS to resolve the long-standing debate on TRSB and pairing in AV3Sb5 systems."]}}, {"title": "Strain-induced Dynamic Spin-Phonon Coupling in Epitaxial RuO2 Films", "journal": "arXiv_CondMat", "source": "author whitelist", "link": "https://arxiv.org/abs/2509.23969", "authors": "In Hyeok Choi, Seung Gyo Jeong, Jae Hyuck Lee, et al.", "last_authors": "Bharat Jalan, Jong Seok Lee", "summary": "Magnetic order parameters in altermagnets can couple to quantized lattice vibration via both piezomagnetic and magnetoelastic effects, leading to the renormalization of phonon dispersion. Here, we demonstrate photo-induced dynamic frequency modulation of THz phonons excited in anisotropically-strained epitaxial RuO2 thin films using ultrafast coherent phonon spectroscopy and time-resolved magneto-optic Kerr effect measurement. A coherent oscillation of a transverse acoustic phonon appears in the sub-THz range with increasing film thickness above 4 nm due to local dislocation arising from the anisotropic strain relaxation, which hosts large non-zero shear strain. Interestingly, this phonon mode exhibits a time-varying mode hardening below ~ 500 K. Furthermore, an en Xiang, Tianren Wang, et al.", "last_authors": "X. J. Zhou, Zhihai Zhu", "summary": "The discovery of spin-density-wave (SDW) order in bilayer nickelates has intensified interest in its interplay with superconductivity. Unlike cuprates, where doping rapidly suppresses the N\\'eel temperature, the SDW transition temperature ($T_{\\mathrm{SDW}}$) in bilayer nickelates is robust against oxygen annealing and even increases under pressure. Here, we combine oxygen annealing with isovalent rare-earth ($A$-site) substitution to effectively apply $c$-axis uniaxial pressure, realizing superconducting bilayer nickelate films with $T_{\\mathrm{SDW}}$ suppressed from 150 K to 70 K. Notably, while SDW order is weakened but remains, a second charge-like anisotropy order is completely eliminated in the superconducting state. Polarization-resolved O $K$-edge X-ray absorption and electronic structure calculations show that strengthened interlayer coupling reconstructs the Fermi surface and weakens the SDW. These findings, consistent with a spin-spinless stripe ground state, provide new insight into the mechanism of density wave formation and their interplay with superconductivity.", "tier": "A_MUST_READ", "score": "9", "reason": "author whitelist: X. J. Zhou", "tags": ["cuprate", "nickelate", "superconduct", "Fermisurface"], "image": "https://arxiv.org/html/2610.01757v1/FIG1.png", "briefing": {"background": "이중층 니켈산염은 고온 초전도체인 큐프레이트와 전자 구조적 유사성으로 인해 연구되고 있으나, 스핀 밀도 파동(SDW)과 같은 경쟁 질서와의 상호작용이 복잡하게 얽혀 있습니다.", "motivation": "이중층 니켈산염에서 SDW와 초전도성 사이의 경쟁 관계를 규명하고, 외부 물리적 변수(압력, 산소 농도)를 통해 특정 전자 질서를 제어하고자 했습니다.", "result": "산소 어닐링과 원자 치환을 통해 c축 단축 압력을 가하여 SDW 온도를 낮추고, 초전도 상태를 저해하던 전하 유형 질서를 완전히 제거했습니다.", "implication": "니켈산염 초전도체에서 경쟁하는 전자 질서들이 서로 분리 가능함을 보였으며, 이는 큐프레이트와는 다른 고유의 초전도 기전을 시사합니다.", "novelty": "이중층 니켈산염에서 계면 결합력 조절을 통해 특정 전자 질서를 선택적으로 억제하여 초전도성을 최적화하는 경로를 제시했습니다.", "unresolved": "압력 하에서 SDW가 왜 완전히 사라지지 않고 잔존하는지에 대한 상세한 미시적 메커니즘은 추가 연구가 필요합니다.", "future_work": "다양한 도핑 수준 및 압력 esult": "de Haas–van Alphen(dHvA) 진동 측정을 통해 해당 물질의 페르미 면 구조를 정밀하게 도출하였으며, 토크 자력계 및 비열 측정을 결합하여 전자 구조적 특성을 규명했습니다.", "implication": "이 결과는 향후 해당 물질에서 나타날 수 있는 초전도성이나 자기적 상태의 기원을 이해하기 위한 가장 기초적이고 필수적인 페르미학(Fermiology) 데이터를 제공합니다.", "novelty": "새로운 가고메 금속 화합물에 대한 정밀한 페르미 면 측정 결과라는 점이 핵심이며, 사용자가 관심을 가지는 AV3Sb5 계열 이외의 가고메 물질 시스템에 대한 전자 구조적 비교 분석을 가능하게 합니다.", "unresolved": "실험 데이터를 통해 구체적인 페르미 면의 기하학적 구조는 확인되었으나, 이 구조가 구체적으로 어떠한 위상학적 비자명성이나 상관관계 효과를 직접적으로 유도하는지에 대해서는 추가 연구가 필요합니다.", "future_work": "ARPES를 통한 밴드 구조 직접 관측 및 DFT 계산과의 정밀한 비교를 통해, dHvA 결과가 시사하는 유효 질량 및 밴드 분산 특성을 상세화할 예정입니다.", "concepts": [{"term": "de Haas–van Alphen (dHvA) 효과", "why_emerged": "금속 내 전자가 자기장에서 만드는 란다우 준위와 페르미 면의 상호작용을 통해 자화율이 주기적으로 변하는 현상을 이용하기 위해.", "origin": "Willem de Haas와 Pieter van Alphen (1930).", "connections": "페르미 면의 궤도 단면적을 측정하는 표준적인 방법으로, 슈브니코프-드 하스(SdH) 진동과 밀접하게 연관됨."}, {"term": "가고메 격자", "why_emerged": "기하학적 좌절(frustration)과 특이한 전자 밴드 구조를 동시에 구현하기 위해.", "origin": "일본의 전통 바구니 짜기 패턴에서 유래, 고체물리학에서는 1950년대부터 연구됨.", "connections": "위상학적 절연체, 비전형적 초전도체, 그리고 평탄 밴드(Flat band) 물리학의 핵심 격자 구조."}], "english_summary": ["Experimental investigation of the kagome metal LuNb6Sn6 using quantum oscillations.", "Determined the Fermi surface topology via de Haas–van Alphen effect and transport measurements.", "Provides foundational electronic structure data for further study of correlation effects in this material."]}}, {"title": "Electronic theory for scanning tunneling microscopy spectra in bilayer nickelate thin films", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/68r6-8v6v", "authors": "Marius Scholten, Steffen Bötzel, Frank Lechermann, Peayush Choubey, Ilya M. Eremin", "last_authors": "Peayush Choubey, Ilya M. Eremin", "summary": "Recent Scanning Tunneling Microscopy (STM) experiments measuring the superconducting gap features in thin films of superconducting bilayer nickelates ${\\mathrm{La}}_{2}{\\mathrm{PrNi}}_{2}{\\mathrm{O}}_{7}$ at ambient pressure a p://link.aps.org/doi/10.1103/19zf-xskg", "authors": "Natsumi Nikaido, Takuya Kawada, Koji Fujiwara, et al.", "last_authors": "Shintaro Takada, Yasuhiro Niimi", "summary": "How collective electronic order responds to strain remains a central question in quantum materials. Here, the authors find that charge density wave (CDW) transitions in NbSe 3 and 2 H -TaSe 2 strongly modulate the acoustoelectric current driven by surface acoustic waves. A simple phenomenological model based on strain-dependent conductivity captures the essential behavior. The work demonstrates acoustoelectric transport as a sensitive probe of CDW physics and opens new avenues for strain-based control of electronic states in van der Waals materials.", "tier": "B_IMPORTANT_CONDMAT", "score": "9", "reason": "Direct hit on NbSe3 and CDW physics; highly relevant to user's quasi-1D and CDW projects.; demoted from A: broad CM, not direct user/project hit", "tags": ["material", "NbSe3", "CDW", "transport"], "image": "", "briefing": {"background": "전하 밀도 파(CDW)는 고체 내에서 전자와 격자가 결합하여 자발적으로 공간적 주기성을 형성하는 상태로, 이 질서가 외부 자극(변형 등)에 어떻게 반응하는지는 양자 물질 연구의 중요한 주제입니다.", "motivation": "잘 알려진 CDW 물질인 NbSe3와 TaSe2에서 외부 압력이나 변형에 따른 전자 수송 현상의 변화를 정량적으로 관측하고자 했습니다.", "result": "표면 음향파(SAW)를 이용한 음향전기 전류(acoustoelectric current) 측정법이 CDW 전이 과정에서 민감하게 반응함을 확인하고, 변형률에 따른 전기 전도도 모델로 이를 성공적으로 기술했습니다.", "implication": "음향전기 측정이 CDW 상태의 상전이를 감지하는 매우 민감한 도구임을 입증하였으며, 향후 van der Waals 물질의 변형 기반 제어 기술의 토대가 됩니다.", "novelty": "기존의 저항 측정 방식보다 더 미세한 CDW 물성 변화를 포착할 수 있다는 방법론적 진보를 보여줍니다. 사용자 관심사인 NbSe3에 대한 실증적 연구입니다.", "unresolved": "이 모델이 다른 종류의 양자 질서(예: 스핀 밀도 파)에도 보편적으로 적용될 수 있는지, 그리고 극저온에서의 미시적 메커니즘은 무엇인지에 대해서는 추가 검증이 필요합니다.", "future_work": "음향전기 전류를 이용한 동적 CDW 상태 조절 실험 및 더욱 다양한 이방성 물질로의 확장 연구가 예상됩니다.", "concepts": [{"term": "전하 밀도 파 (CDW)", "why_emerged": "낮은 차원에서 페르미 면의 중첩(nesting)을 통해 에너지를 낮추려는 전자 시스템의 경향성 때문.", "origin": "Rudolf Peierls (1955).", "connections": "Peierls 불안정성, 1차원 금속, 금속-절연체 상전이."}, {"term": "음향전기 전류 (Acoustoelectric current)", "why_emerged": "표면 음향파가 물질 내의 전하 캐리어와 운동량 전달을 통해 전류를 유도하는 현상을 탐지하고 활용하기 위해.", "origin": "초음파 기반 수송 연구의 일환으로 오랜 기간 정립됨.", "connections": "고주파 장치 및 비파괴적 물질 물성 분석 도구로 응용됨."}], "english_summary": ["Report on the modulation of acoustoelectric current during CDW transitions in NbSe3 and TaSe2.", "Demonstrates that acoustoelectric transport is a sensitive probe for strain-dependent CDW physics.", "Introduces a phenomenological model to explain how lattice strain influences collective electronic order."]}}, {"title": "Observation of Time-Reversal Symmetry Breaking in the Type-I Superconductor YbSb2", "journal": "PRL_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/drzq-lfn5", "authors": "Anshu Kataria, Shashank Srivastava, Dibyendu Samanta, et al.", "last_authors": "Sudeep Kumar Ghosh, Ravi Prakash Singh", "summary": "A hallmark property of unconventional superconductivity has been discovered in a type-I superconductor, whereas it’s normally observed only in type-II materials.", "tier": "B_IMPORTANT_CONDMAT", "score": "9", "reason": "Experimental observation of TRSB in unconventional superconductor, direct user interest.; demoted from A: broad CM, not direct user/project hit", "tags": ["experiment", "unconventionalsuperconductivity", "TRSB"], "image": "", "briefing": {"background": "일반적으로 초전도체에서 시간 반전 대칭성 깨짐(TRSB)은 스핀 삼중항(triplet) 상태를 가지는 비전통적 초전도체나 제2종 초전도체에서 주로 연구되었습니다.", "motivation": "Type-I 초전도체인 YbSb2에서 비전통적 초전도성의 징후인 TRSB가 발견될 수 있는지 확인하고자 함.", "result": "YbSb2가 Type-I 초전도체임에도 불구하고 TRSB의 증거를 관측함.", "implication": "Type-I 초전도체에서도 비전통적 초전도 상태가 존재할 수 있음을 시사하며, 기존 초전도 분류체계에 대한 재고가 필요함.", "novelty": "Type-II가 아닌 고전적인 Type-I 물질에서 TRSB를 확인했다는 점이 독특함. 사용자 관심사인 비전통적 초전도성과 TRSB 연구의 범위를 확장함.", "unresolved": "TRSB를 유발하는 구체적인 초전도 페어링 메커니즘이나 스핀 구조는 명확하지 않음.", "future_work": "초전도 간극의 대칭성을 조사하기 위한 추가적인 위상 민감형 측정이나 저온 ARPES 연구 필요.", "concepts": [{"term": "Type-I 초전도체", "why_emerged": "초전도 현상 초기, 낮은 임계 자기장에서 초전도성이 급격히 사라지는 단순한 물질군을 분류하기 위해 필요.", "origin": "BCS 이론 확립 초기(1950년대).", "connections": "Type-II 초전도체, 마이스너 효과, 런던 침투 깊이."}, {"term": "TRSB (Time-Reversal Symmetry Breaking)", "why_emerged": "비전통적 초전도체의 자기적 특성과 페어링 대칭성을 설명하기 위해 도입됨.", "origin": "초전도 연구 초기부터 논의되었으나, Sr2RuO4 등에서 중요성이 부각됨.", "connections": "카이랄 초전도체, 자기 모멘트, 비전통적 초전도성."}], "english_summary": ["YbSb2 is identified as a rare Type-I superconductor exhibiting time-reversal symmetry breaking.", "The discovery challenges the conventional association of TRSB exclusively with Type-II materials.", "Provides a new candidate for studying unconventional superconductivity in simple metallic systems."]}}, {"title": "Chiral Weyl-Kondo semimetallic state through enhanced correlation in CeGaGe", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2609.32012", "authors": "Arushi, Kevin Allen, Yuan Fang, et al.", "last_authors": "Qimiao Si, Emilia Morosan", "summary": "Strongly correlated chiral materials have been proposed to host a chiral Weyl-Kondo semimetal (cWKSM) state, in which Kondo hybridization pins chirality-induced Kramers-Weyl point crossings, together with additional symmetry-enforced band crossings, near the Fermi level. Realizing this state requires a material that combines crystal chirality, non-symmorphic symmetry, and Kondo correlations, and currently there are no known materials that combine all these requirements. Here we report evidence for a cWKSM state in CeGaGe, a member of the RXY (R = rare earth; X = Al, Si; Y = Ga, Ge) family. Magnetization measurements confirm long-range antiferromagnetic order below T$_N$ = 4.7 K with a complex, canted magnetic structure. Unique to CeGaGe among the known RXY systems is a structural transition from an achiral tetragonal I4$_{1}$md structure (at high temperatures) to the chiral tetragonal P4$_{3}$ structure (at low temperatures). The structural transition in CeGaGe allows us to highlight the role of chirality in stabilizing the Kramers cWKSM state. Hall resistivity measurements with $H || c$ reveal an anomalous Hall conductivity (AHC) that is constant below the Kondo temperature $T_K \\approx 7$ K and drops sharply above it. This crossover tracks the onset of Kondo coherence rather than the magnetic ordering, which occurs at T$_N$ = 4.7 K. Together with first-principles calculations for the $P4_3$ structure, this identifies the AHC as an intrinsic, Berry-curvature-driven contribution generated by Kondo hybridization, rather than a consequence of extrinsic scattering or dynamic scalar spin chirality. These results establish CeGaGe as a rare experimental platform in which crystal chirality, strong electronic correlations, and non-trivial band topology coexist, providing the first material realization of a Kondo-driven cWKSM state.", "tier": "B_IMPORTANT_CONDMAT", "score": "9", "reason": "Direct realization of a Kondo-driven Weyl semimetal with anomalous Hall conductivity in CeGaGe.; demoted from A: broad CM, not direct user/project hit", "tags": ["experiment", "CeGaGe", "Weyl-Kondosemimetal"], "image": "https://arxiv.org/html/2609.32012v2/Fig1_new1.png", "briefing": {"background": "강한 상관관계 전자계에서 Kondo 상호작용과 위상적 밴드 구조가 결합하여 나타나는 특이한 금속 상태에 대한 연구가 활발함.", "motivation": "결정 구조의 카이랄성(Chirality), 비공변성(non-symmorphic) 대칭성, Kondo 상관관계가 공존하는 물질에서 Weyl-Kondo semimetal 상태를 구현하고자 함.", "result": "CeGaGe가 저온에서 카이랄 구조로 상전이하며, Kondo 일관성 온도를 추적하는 이상 홀 효과(AHC)를 관측함.", "implication": "Kondo 혼성화가 Berry 곡률을 생성하여 위상적 성질을 유도하는 cWKSM(chiral Weyl-Kondo semimetal)의 최초 실험적 실현임.", "novelty": "강상관계와 위상 물성이 카이랄 격자 내에서 어떻게 상호작용하는지 보여줌. Weyl-Kondo 물리 연구에 새로운 물질 플랫폼을 제시함.", "unresolved": "복잡한 자기 구조가 cWKSM 상태에 미치는 미세한 영향과 Berry 곡률의 정량적 분포.", "future_work": "ARPES를 통한 Kramers-Weyl 포인트 근처의 전자 구조 직접 관측 및 Kondo 밴드 분리 확인.", "concepts": [{"term": "Weyl-Kondo semimetal", "why_emerged": "강한 전자 상관관계가 있는 물질에서 위상적 밴드 교차를 설명하기 위해 필요.", "origin": "Qimiao Si 그룹 등 강상관계 이론가들에 의해 최근 제안됨.", "connections": "Kondo 효과, Weyl semimetal, Berry 곡률."}, {"term": "이상 홀 효과 (AHC)", "why_emerged": "외부 자기장이 없거나 강자성체에서 전하 캐리어가 자기적 질서와 상호작용하여 나타나는 홀 전압을 설명하기 위해.", "origin": "Edwin Hall이 발견한 고전적 효과의 확장.", "connections": "Berry 위상, 카이랄성, 스핀-궤도 결합."}], "english_summary": ["CeGaGe is identified as the first experimental platform for a Kondo-driven chiral Weyl-Kondo semimetal.", "The transition to a chiral P43 structure enables the stabilization of Kramers-Weyl nodes.", "Anomalous Hall conductivity tracks Kondo coherence, proving Berry-curvature-driven topology."]}}, {"title": "Complex Magnetic Phases and Unconventional Skyrmion Thermodynamics in Magnetically Intercalated Cr1+xTe2Compounds", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2610.00877", "authors": "Clayton Conner, Santosh Karki Chhetri, Avinash Sah, et al.", "last_authors": "Zheng Gai, Guang Bian", "summary": "Chemical intercalation provides a powerful route for tuning the electronic and magnetic properties of transition metal dichalcogenides (TMDs), enabling the emergence of magnetic phases and phenomena that are otherwise inaccessible in their pristine forms. Here, we investigate the structural, electronic, and magnetic properties of magnetically intercalated Cr$_{1+x}$Te$_2$ through a combination of scanning tunneling microscopy, angle-resolved photoemission spectroscopy, magnetization, electrical transport, and Lorentz transmission electron microscopy measurements. We uncover a rich magnetic phase diagram comprising paramagnetic, in-plane spin-fluctuation, out-of-plane ferromagnetic, and field-induced N\\'eel-type skyrmion phases. In particular, Lorentz transmission electron microscopy directly reveals the formation of N\\'eel-type skyrmion textures slightly below the Curie temperature, with their configurations evolving strongly with temperature and magnetic field. The skyrmions exhibit pronounced thermal hysteresis and coexist with stripe domains, indicative of a complex magnetic energy landscape arising from the competition among disorder-induced local Dzyaloshinskii-Moriya interactions, perpendicular magnetic anisotropy, and dipolar interactions. Our results demonstrate that chemical intercalation can profoundly reshape the magnetic interactions and phase behavior of TMDs, establishing Cr$_{1+x}$Te$_2$ as a versatile platform for exploring tunable magnetism, skyrmion physics, and unconventional thermodynamic phenomena in low-dimensional quantum materials.", "tier": "B_IMPORTANT_CONDMAT", "score": "9", "reason": "Spectroscopic study (ARPES/STM) on a magnetic TMD material with skyrmion physics.", "tags": ["ARPES", "STM", "TMD", "magnetism"], "image": "https://arxiv.org/html/2610.00877v1/Fig1_new.png", "briefing": {"background": "TMD(전이금속 디칼코게나이드) 물질은 층상 구조 덕분에 층간 삽입을 통한 물성 제어가 용이하여 새로운 자기 상태 연구에 활용됨.", "motivation": "Cr1+xTe2에서 자기적 층간 삽입이 격자 및 전자 구조, 특히 스카이르미온 형성에 미치는 영향을 조사하고자 함.", "result": "Cr1+xTe2에서 온도와 자기장에 따른 스카이르미온, 줄무늬 도메인 등 복잡한 자기 위상도를 발견함.", "implication": "TMD 기반 자성 물질이 스카이르미온 물리와 위상 자성 소자 연구의 핵심 플랫폼이 될 수 있음을 입증함.", "novelty": "ARPES와 STM을 포함한 종합적인 분석을 통해 구조-자기-전자적 상관관계를 규명함. 스카이르미온 형성의 열역학적 복잡성을 제시함.", "unresolved": "불순물/삽입 원자에 의한 무질서가 스카이르미온 안정성에 미치는 구체적인 메커니즘.", "future_work": "스카이르미온의 동역학적 특성 및 위상적 홀 효과에 대한 상세 분석.", "concepts": [{"term": "Néel-type 스카이르미온", "why_emerged": "스핀 구조의 위상학적 보호를 통한 차세대 정보 저장 소자 연구의 핵심.", "origin": "Tony Skyrme이 입자 물리학에서 제안, 이후 자성체에서 발견.", "connections": "DMI 상호작용, 위상적 홀 효과, 자기 도메인."}, {"term": "Dzyaloshinskii-Moriya (DMI) 상호작용", "why_emerged": "스핀-궤도 결합이 있는 비대칭 환경에서 스핀의 비평형적 정렬을 설명하기 위해 필요.", "origin": "Dzyaloshinskii(1958)와 Moriya(1960).", "connections": "카이랄성, 스카이르미온, 자기 이방성."}], "english_summary": ["Cr1+xTe2 exhibits a versatile phase diagram including Néel-type skyrmions and stripe domains.", "Combined ARPES, STM, and TEM investigations reveal the role of chemical intercalation in tuning magnetic interactions.", "Demonstrates a tunable platform for skyrmion physics and unconventional thermodynamics in TMDs."]}}, {"title": "Highly anisotropic collective modes of altermagnetic superconductors with Bogoliubov Fermi surfaces", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2610.01011", "authors": "Huaisong Zhao, Peng Zou, Xia-Ji Liu, Hui Hu", "last_authors": "Xia-Ji Liu, Hui Hu", "summary": "We investigate collective modes in charge-neutral altermagnetic superconductors with $d$-wave spin-split bands, focusing on the impact of emergent Bogoliubov Fermi surfaces. In the absence of a magnetic field, the BCS state supports collective modes that inherit the underlying $d$-wave symmetry, resulting in pronounced momentum-space anisotropy. The broken time-reversal symmetry further couples these modes to spin-density fluctuations, allowing their signatures to emerge in the spin dynamical structure factor. Upon applying a magnetic field, Bogoliubov Fermi surfaces emerge and qualitatively reshape the collective-mode dynamics through gapless particle-hole excitations and strongly anisotropic Landau damping. The damping is strongest along the momentum-space diagonal, where it can suppress the low-energy phonon mode at small momenta. Remarkably, the suppressed phonon is accompanied by the emergence of an in-gap structure in the Higgs mode and an associated pronounced enhancement of the spin response. These results establish Bogoliubov Fermi surfaces as a mechanism for generating highly anisotropic collective-mode dynamics and identify spin response as a sensitive probe of in-gap Higgs excitations in altermagnetic superconductors.", "tier": "B_IMPORTANT_CONDMAT", "score": "9", "reason": "Relevant study on altermagnets and Bogoliubov FS, linking to the user's interest in altermagnetism.", "tags": ["altermagnet", "superconduct", "Fermisurface"], "image": "https://arxiv.org/html/2610.01011v1/fig1.png", "briefing": {"background": "알터마그네틱(Altermagnetism)은 전통적인 강자성이나 반강자성과 달리, 시간 반전 대칭이 깨져 있으면서도 순자화가 0인 새로운 자기 정렬 상태로, 운동량 공간에서 스핀 분할이 나타나는 것이 특징입니다. 초전도성과 결합할 경우 복잡한 스핀 역학이 발생합니다.", "motivation": "알터마그네틱 초전도체에서 보골류보프 페르미 표면(Bogoliubov Fermi surface)이 생성될 때, 이러한 상태가 집합 모드(collective modes)와 스핀 응답에 어떤 구체적인 영향을 미치는지 규명하고자 합니다.", "result": "자기장이 인가되면 보골류보프 페르미 표면이 나타나며, 이로 인해 모멘텀 공간의 대각선 방향에서 강력한 란다우 댐핑이 발생하여 저에너지 포논 모드를 억제합니다. 동시에 힉스 모드 내부의 구조 변화와 스핀 응답의 증폭이 관찰되었습니다.", "implication": "스핀 역학적 구조 인자(spin dynamical structure factor) 측정이 알터마그네틱 초전도체 내의 보골류보프 페르미 표면과 힉스 모드를 감지하는 강력한 실험적 도구가 될 수 있음을 시사합니다.", "novelty": "알터마그네틱 시스템과 초전도 상태가 결합된 환경에서 보골류보프 페르미 표면이 집합 모드에 미치는 이방성 효과를 체계적으로 분석한 점이 독창적입니다.", "unresolved": "실제 알터마그네틱 후보 물질에서의 구체적인 댐핑 강도 및 물질 의존적 효과에 대한 실험적 검증이 부족합니다.", "future_work": "실제 알터마그네틱 초전도체 물질에서 중성자 산란이나 RIXS를 이용한 스핀 응답 측정 실험이 필요합니다.", "concepts": [{"term": "알터마그네틱", "why_emerged": "순자화가 없음에도 스핀 의존적 밴드 분할을 보여주는 차세대 스핀트로닉스 재료를 찾기 위해 제안됨.", "origin": "최근 5년 이내 이론적 정립(예: Šmejkal et al.)", "connections": "반강자성체, 스핀 분극"}, {"term": "보골류보프 페르미 표면", "why_emerged": "초전도 상태에서 에너지 갭이 닫히며 밴드 접합이 발생할 때 상태 밀도를 이해하기 위해 도입됨.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "BCS 이론, 위상 초전도체"}, {"term": "힉스 모드", "why_emerged": "초전도체 내의 진폭 모드를 기술하기 위해 필요.", "origin": "입자 물리학의 힉스 메커니즘에서 차용", "connections": "조셉슨 플라즈마 모드, 초전도 집합 모드"}], "english_summary": ["Investigates collective modes in altermagnetic superconductors with Bogoliubov Fermi surfaces.", "Identifies strong momentum-dependent damping of phonon modes caused by emergent Fermi surfaces.", "Highlights spin response as a sensitive probe for detecting in-gap Higgs excitations.", "Provides a theoretical framework for anisotropic collective dynamics in novel magnetic superconductors."]}}, {"title": "Stacking-Controlled Altermagnetism and Topological Magnons in Bilayer CrI3", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2610.00479", "authors": "Lu Xiao, Meng-Han Zhang, Dao-Xin Yao", "last_authors": "Meng-Han Zhang, Dao-Xin Yao", "summary": "Stacked van der Waals magnets provide a tunable route to altermagnetism, a compensated magnetic order characterized by momentum-dependent spin splitting, and to the topological magnetic e "Gemini", "link": "http://link.aps.org/doi/10.1103/l1ft-gzyd", "authors": "Lin-Lin Wang", "last_authors": "Lin-Lin Wang", "summary": "The coexistence of surface superconductivity and Fermi arcs in trigonal $γ\\text{−}\\mathrm{PtB}{\\mathrm{i}}_{2}$ has recently attracted attention for possible realization of topological superconductivity. The Fermi arcs on the two different (0001) surface terminations have been associated with the se…", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "First-principles study of Weyl semimetal and topological superconductivity in a real material.", "tags": ["Weylsemimetal", "topologicalsuperconductivity", "DFT", "electronicstructure"], "image": "", "briefing": {"background": "위상 절연체 및 위상 반금속 연구는 베리 곡률과 관련된 비자명한 밴드 구조를 탐구하며, 특히 PtBi2와 같은 소재는 초전도성과 위상적 특성이 공존할 가능성으로 주목받습니다.", "motivation": "트리곤(trigonal) 구조의 PtBi2에서 관찰되는 표면 초전도성과 페르미 아크의 기원을 위상 물리학적 관점에서 해석하고자 합니다.", "result": "제1원리 계산을 통해 이 물질에 위상적 웨일 노달 루프(Weyl nodal loops)와 다중 웨일 포인트가 존재함을 확인했습니다.", "implication": "PtBi2가 위상 초전도체 후보 물질로서 전자 구조적 토대를 갖추고 있음을 이론적으로 강력하게 뒷받침합니다.", "novelty": "단순한 페르미 아크 관측을 넘어, 벌크 전자 구조의 위상적 성질(웨일 루프)과의 상관관계를 구체적인 밴드 구조 계산을 통해 규명했습니다.", "unresolved": "계산상 예측된 위상적 특성이 실제 실험적 ARPES 데이터와 모든 면에서 일치하는지는 추가적인 정밀 측정 연구가 요구됩니다.", "future_work": "위상적 성질에 기인한 에지 상태 및 표면 초전도도의 로컬 측정(STS 등)이 필요할 것으로 보입니다.", "concepts": [{"term": "웨일 노달 루프(Weyl Nodal Loop)", "why_emerged": "밴드 교차점이 점 형태가 아닌 루프 형태를 띠는 위상적 구조를 기술하기 위해 도입되었습니다.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "웨일 반금속, 베리 곡률, 위상 상전이"}, {"term": "페르미 아크(Fermi Arcs)", "why_emerged": "위상 반금속의 표면에서 관찰되는 열린 페르미 면 구조를 설명하기 위해 등장했습니다.", "origin": "Wan et al. (2011)", "connections": "웨일 포인트, 표면 상태, 벌크-경계 대응 원리"}], "english_summary": ["DFT calculations identify Weyl nodal loops and multiple Weyl points in trigonal PtBi2.", "The findings bridge the gap between Fermi arc observations and bulk topological electronic structures.", "PtBi2 is highlighted as a robust platform for investigating topological superconductivity."]}}, {"title": "Giant Rashba splitting in InBi/SbBi chains on InSb(110): Surface reconstruction as a route to spin-split one-dimensional states", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/ly3w-33fy", "authors": "Rohit Yadav, Qirui Cui, Sina Ritter, et al.", "last_authors": "Anna Delin, Rainer Timm", "summary": "Bismuth-induced ( 1 × 2 ) and ( 1 × 3 ) surface reconstructions on InSb(110) exhibit a tunable giant Rashba splitting associated with one-dimensional atomic chain structures. Remarkably, the lower Bi-coverage Bi/InSb(110)- ( 1 × 3 ) phase shows a larger Rashba splitting parameter than the ( 1 × 2 ) phase, revealing a counterintuitive dependence of spin splitting on adsorbate concentration. Combining surface-science experiments and density functional theory, we show that the magnitude of band splitting is governed by the interplay between atomic-scale surface corrugation and spin-orbit coupling from Bi. Our calculations further indicate that, while Bi is essential to induce the Rashba effect, the significant contribution arises from the InSb substrate. The Bi/InSb(110) reconstructed surface consists of Bi chains bonded selectively to In or Sb of the substrate. These results establish Bi/InSb(110) as a platform for engineering the strength of spin splitting and for enabling the ordered growth of InBi nanostructures.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "ARPES-relevant giant Rashba splitting in quasi-1D atomic chain structures.", "tags": ["experiment", "InSb", "Rashba"], "image": "", "briefing": {"background": "표면 재구성과 1차원 원자 체인 구조는 Rashba 효과를 극대화할 수 있는 플랫폼을 제공하며, 이는 스핀 소자 구현에 핵심적입니다.", "motivation": "InSb(110) 표면의 Bi 유도 재구조화에서 나타나는 거대한 Rashba 분할 현상과 그 제어 가능성을 조사하고자 합니다.", "result": "Bi 피복률이 낮을 때 오히려 더 큰 Rashba 분할이 나타나는 역설적 현상을 발견했으며, 이는 표면 굴곡과 기판의 기여가 상호작용하기 때문임을 밝혀냈습니다.", "implication": "표면 재구성을 통해 스핀 분할 강도를 엔지니어링할 수 있는 새로운 전략을 제시하며, 향후 1차원 나노구조 개발에 기여합니다.", "novelty": "단순히 흡착물이 스핀 분할을 유도하는 것이 아니라, 기판(InSb)과 흡착물(Bi)의 상호작용 및 구조적 재배치가 스핀 물리량에 결정적임을 증명했습니다.", "unresolved": "나노 스케일에서의 스핀-전하 분리 현상과 1차원 Luttinger liquid 거동과의 직접적인 연관성은 추가 연구가 필요합니다.", "future_work": "Spin-resolved ARPES를 통한 스핀 방향성 측정 및 다양한 흡착 원자에 따른 Rashba 분할의 체계적 연구가 예상됩니다.", "concepts": [{"term": "Rashba 분할", "why_emerged": "구조적 반전 대칭성 깨짐에 의해 전자 밴드가 스핀에 따라 에너지적으로 분리되는 현상을 설명하기 위해 도입되었습니다.", "origin": "Rashba (1960)", "connections": "스핀-궤도 결합, 강자성/비자성 계면, 스핀트로닉스"}, {"term": "InSb(110) 표면 재구성", "why_emerged": "원자 규모의 표면 안정화 과정을 통해 결정 구조의 대칭성을 변형시키기 위해 활용됩니다.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "표면 물리, 나노구조 성장, 위상 절연체 박막"}], "english_summary": ["Bi chains on InSb(110) exhibit giant tunable Rashba splitting.", "Lower Bi coverage surprisingly yields larger spin splitting, attributed to surface corrugation and substrate effects.", "The study establishes a platform for engineering spin-split 1D states via surface reconstruction."]}}, {"title": "Metallic electro-optic effects in topological chiral crystals", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/1vvf-8rvx", "authors": "C. O. Ascencio, D. J. P. de Sousa, Tony Low", "last_authors": "D. J. P. de Sousa, Tony Low", "summary": "Topological chiral crystals have emerged as a fertile material platform for investigating optical phenomena derived from the distinctive Fermi surface Berry curvature and orbital magnetic moment textures around multifold chiral band crossings pinned at the time-reversal invariant momenta. In this wo…", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Discusses Fermi surface Berry curvature in topological chiral crystals; highly relevant to user.", "tags": ["theory", "material", "berry-curvature"], "image": "", "briefing": {"background": "위상학적 카이랄 결정(topological chiral crystals)은 시간 반전 대칭이 깨지지 않은 환경에서도 고유한 기하학적 위상과 결합된 특이한 밴드 교차점을 가집니다. 이는 비자명한 베리 곡률과 궤도 자기 모멘트를 유도하여 광학적 반응을 제어할 수 있는 플랫폼을 제공합니다.", "motivation": "위상학적 카이랄 결정에서 페르미 표면 부근의 베리 곡률과 궤도 자기 모멘트가 광학적 응답에 구체적으로 어떤 기여를 하는지 이론적으로 규명하고자 합니다.", "result": "금속성 위상학적 카이랄 결정에서 관찰되는 전기광학적 효과(electro-optic effects)가 밴드 구조의 베리 곡률 텍스처와 직접적인 상관관계가 있음을 보여주었습니다.", "implication": "이러한 결정 구조를 활용하여 특정 주파수 영역에서 거대한 광학적 응답을 이끌어낼 수 있으며, 이는 차세대 위상 소자 구현에 활용될 수 있음을 시사합니다.", "novelty": "다중 밴드 교차가 발생하는 지점에서의 기하학적 특성이 거시적인 광학적 물성으로 변환되는 메커니즘을 상세히 다루었으며, 이는 베리 곡률 기반 물리 연구와 직접 연결됩니다.", "unresolved": "실제 실험적 환경에서의 산란 효과나 비평형 상태에서의 광학적 반응에 대한 고려가 추가적으로 필요합니다.", "future_work": "실제 실험적으로 광학 응답을 측정할 수 있는 특정 화합물군을 제안하고, 펨토초 분해능의 광학 측정을 통한 검증이 기대됩니다.", "concepts": [{"term": "베리 곡률", "why_emerged": "밴드 구조의 위상학적 성질을 기술하기 위해 도입됨.", "origin": "Michael Berry (1984).", "connections": "양자 홀 효과, 위상 절연체, 이상 홀 효과와 연결."}, {"term": "카이랄 결정", "why_emerged": "거울 대칭이 결여된 결정 구조에서 발생하는 위상학적 특성을 연구하기 위해.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "위상 반금속, Weyl 페르미온 물리와 밀접."}], "english_summary": ["Explores optical effects in topological chiral crystals driven by Fermi surface Berry curvature.", "Identifies the role of multifold band crossings in determining optical responses.", "Links geometric band properties to electro-optic phenomena.", "Offers insights for designing optoelectronic devices using topological materials."]}}, {"title": "Relativistic reconstruction of the altermagnetic spin texture in bilayer V2WS4", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/gw94-m7sc", "authors": "Yihang Bai, Chaoran Niu, Yaxin Pan, Bing Wang, Jun-Hyung Cho", "last_authors": "Bing Wang, Jun-Hyung Cho", "summary": "Bilayers composed of two ferromagnetic Chern-insulating ${\\mathrm{V}}_{2}{\\mathrm{WS}}_{4}$ monolayers coupled antiferromagnetically between the layers have recently been identified as a promising platform for realizing an altermagnetic state characterized by a $d$-wave spin texture. In this work, w…", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Theoretical study of d-wave spin textures in a promising altermagnetic bilayer candidate.", "tags": ["theory", "altermagnetism", "spintexture"], "image": "", "briefing": {"background": "알터자성(Altermagnetism)은 시간 반전 대칭과 공간 반전 대칭이 동시에 깨져 있으면서도 순자화가 0인, 반강자성과 강자성의 특징을 모두 가진 새로운 자기상입니다. 기존의 반강자성과 달리 스핀 분할(spin-splitting)이 특징입니다.", "motivation": "V2WS4 이중층 구조에서 d-wave 스핀 텍스처가 어떻게 구현되는지, 그리고 상대론적 효과가 이 상태의 재구성에 어떤 영향을 미치는지 밝히고자 합니다.", "result": "V2WS4 이중층에서 층간 반강자성 결합이 d-wave 유형의 스핀 텍스처를 형성하며, 상대론적 효과가 이 텍스처를 재구성함을 이론적으로 입증했습니다.", "implication": "알터자성 후보 물질로서의 가치를 재확인했으며, 스핀트로닉스 응용 가능성을 높였습니다.", "novelty": "이중층 구조에서의 위상적이고 자기적인 정밀한 스핀 제어 메커니즘을 규명했다는 점이 독창적입니다.", "unresolved": "실제 실험에서의 스핀 분할 크기 측정 및 도메인 구조의 안정성에 대한 실증적 증거가 부족합니다.", "future_work": "ARPES를 이용한 밴드 스핀 분할 직접 관측 및 수송 특성 연구가 필요합니다.", "concepts": [{"term": "알터자성", "why_emerged": "스핀-궤도 결합 없이도 밴드 분할이 발생하는 새로운 자기상을 정의하기 위해.", "origin": "Jungwirth 등 (최근 제안).", "connections": "반강자성, 자성 위상 물질과 관련."}, {"term": "d-wave 스핀 텍스처", "why_emerged": "알터자성체에서 나타나는 특유의 비등방성 스핀 분할 형태를 기술하기 위해.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "자기적 위상물질, 스핀트로닉스."}], "english_summary": ["Investigates altermagnetism in V2WS4 bilayer structures.", "Calculates the relativistic reconstruction of the d-wave spin texture.", "Confirms the emergence of altermagnetic state with zero net magnetization.", "Provides theoretical foundation for spin-splitting observation in this candidate material."]}}, {"title": "Two-gap to single-gap transition and two-dome-like superconductivity in alkali-metal intercalated bilayer PdTe2", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/w6jy-7tk6", "authors": "Yu-Lin Han, Shu-Xiang Qiao, Kai-Yue Jiang, et al.", "last_authors": "C. S. Ting, Hong-Yan Lu", "summary": "${\\mathrm{PdTe}}_{2}$ has been synthesized with controllable thickness down to the monolayer limit. Based on first-principles calculations within the fully anisotropic Migdal–Eliashberg framework, this work reveals that alkali-metal intercalation markedly enhances the weak superconductivity of bilay…", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "First-principles study of unconventional superconductivity in a 2D material.", "tags": ["superconductivity", "2Dmaterials", "DFT", "electronicstructure"], "image": "", "briefing": {"background": "PdTe2는 위상학적 특성과 초전도성이 공존하는 물질로 주목받고 있습니다. 층상 구조 물질에서 알칼리 금속 삽입(intercalation)은 전자 구조를 크게 변화시켜 초전도 상태를 제어하는 강력한 도구입니다.", "motivation": "알칼리 금속 삽입이 이중층 PdTe2의 초전도성에 미치는 변화를 이해하고, 다중 갭에서 단일 갭으로의 전이 과정을 탐구하고자 합니다.", "result": "알칼리 금속 삽입이 이중층 PdTe2의 초전도 갭 구조를 변화시키며, 전하 밀도 변화에 따른 두 개의 초전도 돔(dome) 구조가 나타남을 보였습니다.", "implication": "층상 초전도체의 전자 농도 제어를 통한 고온 초전도 연구나 상전이 제어에 중요한 단서를 제공합니다.", "novelty": "이중층 시스템에서 Migdal-Eliashberg 이론을 적용하여 갭 전이와 돔 구조를 상세히 기술한 점이 우수합니다.", "unresolved": "삽입된 알칼리 금속의 정확한 배치와 그로 인한 구조적 왜곡이 위상학적 성질을 어떻게 변화시키는지 명확하지 않습니다.", "future_work": "ARPES를 통한 페르미 표면 변화 관측 및 저온 수송 측정으로 초전도 갭 전이 확인 필요.", "concepts": [{"term": "Migdal-Eliashberg 이론", "why_emerged": "강한 전자-포논 상호작용을 포함하는 초전도성을 미시적으로 기술하기 위해.", "origin": "A. B. Migdal (1958), G. M. Eliashberg (1960).", "connections": "BCS 이론의 확장, 강상관계 전자계 연구."}, {"term": "알칼리 금속 삽입", "why_emerged": "층상 물질의 층간 결합을 제어하여 전자 상태를 튜닝하기 위해.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "흑연 삽입 화합물, 이철계 초전도체 등."}], "english_summary": ["Examines superconductivity in alkali-intercalated bilayer PdTe2.", "Uses Migdal-Eliashberg theory to model the superconducting gap transitions.", "Reports a two-gap to single-gap transition and dual superconducting domes.", "Highlights electronic structure tuning as a pathway for enhanced superconductivity."]}}, {"title": "Z2 topological signatures of the optical bound on maximal Berry curvature: Application to two-dimensional time-reversal-symmetric insulators", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/l6dk-qwwg", "authors": "Pok Man Chiu", "last_authors": "Pok Man Chiu", "summary": "Unlike broken time-reversal-symmetric (TRS) systems with a well-defined Chern number, directly measuring the bulk ${Z}_{2}$ invariant and Berry curvature (if nonzero) in topological insulators and their higher-order topological families remains an unsolved problem. Here, based on the refined trace-d…", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Relates Berry curvature to Z2 topological invariants; core interest for topological insulators.", "tags": ["theory", "topology", "berry-curvature"], "image": "", "briefing": {"background": "위상 절연체는 시간 반전 대칭성(TRS)을 가지며 Z2 위상 불변량으로 특성화됩니다. Chern 절연체와 달리 직접적인 관측이 어려워 위상적 성질을 실험적으로 확인하는 것이 중요한 난제입니다.", "motivation": "기존의 Z2 위상 불변량과 Berry 곡률 사이의 직접적인 측정 연결 고리를 찾는 이론적 모델을 제안하고자 합니다.", "result": "광학적 바운드를 통해 Berry 곡률의 적분과 Z2 불변량 사이의 관계를 정량화하였으며, 이를 2차원 TRS 절연체에 적용하는 프레임워크를 제시했습니다.", "implication": "위상 절연체의 광학적 특성(예: 원편광 이색성)을 측정함으로써 벌크 Z2 위상 특성을 비파괴적으로 프로빙할 수 있는 가능성을 열었습니다.", "novelty": "Berry 곡률의 '광학적 바운드'라는 개념을 Z2 위상 불변량 측정과 연결하여, ARPES나 광학 실험에서의 측정 가능성을 이론적으로 정립했습니다.", "unresolved": "실제 복잡한 다체계(many-body) 환경이나 강한 전자 상관관계가 존재하는 물질에서의 섭동 효과에 대한 정밀한 분석이 필요합니다.", "future_work": "제안된 광학적 지표를 실제 Topological Insulator 박막 시료에 대한 광학 실험으로 검증하는 연구가 기대됩니다.", "concepts": [{"term": "Z2 Topological Invariant", "why_emerged": "시간 반전 대칭을 가진 시스템에서 위상적 띠 구조를 분류하기 위해 도입되었습니다.", "origin": "Kane과 Mele(2005)에 의해 정립되었습니다.", "connections": "Quantum Spin Hall 효과, 위상 절연체 이론과 직접적으로 연결됩니다."}, {"term": "Berry Curvature", "why_emerged": "전자의 띠 구조가 가진 기하학적 위상 성질을 기술하기 위해 필요합니다.", "origin": "Berry(1984)의 위상적 위상(geometric phase) 연구에서 유래했습니다.", "connections": "이상 홀 효과, 궤도 자기 모멘트, 위상적 수송 현상과 연결됩니다."}], "english_summary": ["Establishes a theoretical link between Berry curvature bounds and Z2 topological invariants in TRS insulators.", "Provides a framework for interpreting optical responses as signatures of the Z2 invariant.", "Offers a potential pathway for non-invasive experimental topological characterization."]}}, {"title": "Emergent Gauge Fields and Linear Dichroism in Spin-Textured Altermagnets", "journal": "PRL_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/phr7-1zy5", "authors": "Andrea Maiani", "last_authors": "Andrea Maiani", "summary": "Spin textures are ubiquitous in antiferromagnets, yet their consequences for altermagnets remain largely unexplored. We show that smooth spatial variations of the Néel order act on itinerant electrons as emergent gauge fields that couple to the altermagnetic sublattice-odd channel. For a coplanar spin helix, this channel generates two responses that vanish when it is removed: a momentum-resolved sublattice-odd spectral structure and a net interband linear dichroism whose principal axes are controlled by the helix wave vector, so the optical response can be steered by the magnetic texture. The dichroism exhibits two distinct regimes separated by a crossover: at low frequencies the absorption axis is locked to the crystal axes, while at high frequencies it tracks the helix. Anisotropic dc transport provides a complementary quantitative signature, and all signatures are robust to weak intrinsic spin-orbit coupling. Our results identify polarization-resolved optics and sublattice-sensitive spectroscopy as direct probes of textured altermagnetic states and suggest a route to direction-selective electronic and optical functionality in altermagnets.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Altermagnetism with emergent gauge fields and experimental observable (dichroism).", "tags": ["altermagnetism", "theory", "electronicstructure", "dichroism"], "image": "", "briefing": {"background": "알터마그네틱(Altermagnets)은 기존의 강자성이나 반강자성과 달리 시간 반전 대칭성이 깨져 있으면서도 스핀 분할된 띠 구조를 가지는 새로운 자기 상입니다.", "motivation": "알터마그네틱 물질 내에서 자기적 텍스처(spin texture)가 전자 구조와 광학적 반응에 어떤 영향을 미치는지 규명하고자 합니다.", "result": "자기 나선(spin helix) 구조가 emergent gauge field로 작용하여 아격자-홀수(sublattice-odd) 채널을 활성화하고, 이로 인해 선형 이색성(linear dichroism)이 나타남을 보였습니다.", "implication": "알터마그네틱 물질의 자기적 도메인이나 텍스처를 편광 분해 분광법으로 직접 시각화하거나 제어할 수 있는 기반이 마련되었습니다.", "novelty": "알터마그네트의 고유한 스핀-궤도 결합 없는 띠 분할 성질과 자기적 텍스처를 광학적으로 연결했다는 점이 독창적입니다.", "unresolved": "실제 물질의 결정 구조 내에서 자기 나선이 유도되는 에너지 기작과 고온에서의 안정성이 완벽히 밝혀지지 않았습니다.", "future_work": "다양한 altermagnetic candidate 물질에 대한 실제 편광 분해 분광 실험 및 도메인 제어 연구가 필요합니다.", "concepts": [{"term": "Altermagnetism", "why_emerged": "기존 반강자성 분류 체계로는 설명되지 않는 고유한 스핀-반전 대칭성 파괴를 기술하기 위해 등장했습니다.", "origin": "최근 3-4년 내 이론적 연구가 활발히 진행되어 정립되었습니다.", "connections": "비상반성 홀 효과(Non-collinear Hall effect), 스핀 분할 밴드 구조와 연결됩니다."}, {"term": "Linear Dichroism", "why_emerged": "물질 내의 이방성(anisotropy)을 광학적으로 측정하기 위해 사용됩니다.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "전자 구조의 띠 분할, 결정 대칭성 파괴 연구와 관련이 깊습니다."}], "english_summary": ["Introduces the concept of emergent gauge fields in textured altermagnets.", "Predicts sublattice-odd spectral signatures and steerable linear dichroism.", "Suggests polarization-resolved spectroscopy as a direct probe for altermagnetic textures.", "Provides a framework for direction-selective electronic and optical device functionality."]}}, {"title": "Interlayer-Correlated Fractional Quantum Hall State in a Trilayer Electron System", "journal": "PRL_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/4bpx-3mwm", "authors": "Chengyu Wang, C. T. Tai, N. Toemtrisna, et al.", "last_authors": "K. W. Baldwin, M. Shayegan", "summary": "In multilayer quantum Hall systems, when the layer separation is sufficiently small, the interplay between intralayer and interlayer Coulomb interactions can lead to exotic, multicomponent, many-body states. A particular example is the even-denominator fractional quantum Hall state at total filling …", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Fractional quantum Hall in a multilayer system, relevant to correlated 2D physics.", "tags": ["quantumHall", "correlated", "2Dmaterials"], "image": "", "briefing": {"background": "다층 양자 홀 시스템은 층간 결합과 쿨롱 상호작용의 상호작용으로 인해 단일 층에서 볼 수 없는 이국적인 다체계 상태를 형성합니다.", "motivation": "3중층 시스템에서 층간 상관관계가 짝수 분모 분수 양자 홀 상태(even-denominator FQH)에 미치는 영향을 연구하고자 합니다.", "result": "3중층 시스템에서 층 urface) 구조를 유지하거나 변화시키는지는 강상관 전자계 물리학의 핵심 연구 주제입니다.", "motivation": "CeCoIn5는 전형적인 강상관 중페르미온 초전도체로, 자기장을 인가했을 때 응축되지 않은 전자의 페르미 면이 어떻게 변하는지, 그리고 이것이 초전도 상태와 어떤 위상학적 관계를 맺는지 확인하고자 합니다.", "result": "자기장 하에서 응축되지 않은 전자들의 페르미 면이 위상학적 변화(topology change)를 겪는다는 것을 양자 진동(quantum oscillation) 측정을 통해 확인했습니다.", "implication": "초전도체 내부의 준입자 상태가 단순히 초전도 갭에 의해 가려지는 것이 아니라, 외부 변수에 따라 고유한 위상학적 특성을 유지하거나 변화시킬 수 있음을 시사합니다.", "novelty": "초전도 상태 내의 잔류 페르미 면을 추적함으로써 강상관 계의 전자기적 응답과 위상학적 물성을 직접 연결했다는 점이 귀하의 관심사인 전자 구조 및 강상관 계 연구와 깊게 맞닿아 있습니다.", "unresolved": "이러한 위상학적 변화가 실제 초전도 메커니즘(페어링 대칭성 등)에 미치는 직접적인 피드백 효과는 여전히 분석이 필요합니다.", "future_work": "더 높은 자기장 영역에서의 양자 진동 측정 및 이론적 모델링을 통한 위상학적 상전이의 상세 기작 규명.", "concepts": [{"term": "Quantum Oscillation", "why_emerged": "금속의 페르미 면 크기와 형태를 실험적으로 결정하기 위한 필수 도구.", "origin": "de Haas-van Alphen 효과 (1930년), Landau에 의해 이론화됨.", "connections": "페르미 액체 이론, Shubnikov-de Haas 효과와 연결됨."}, {"term": "Heavy Fermion", "why_emerged": "f-전자와 전도 전자 사이의 강한 교환 상호작용으로 인한 거대한 유효 질량 현상을 설명하기 위해.", "origin": "초기 연구들은 1970년대 CeAl3 등에서 발견되며 시작됨.", "connections": "Kondo 격자 모델, 비전통적 초전도성과 밀접함."}], "english_summary": ["Studied uncondensed Fermi surface behavior in superconducting CeCoIn5.", "Used quantum oscillations to observe topological changes in the Fermi surface under magnetic fields.", "Provides evidence for the persistence and evolution of quasiparticles in heavy fermion superconductors."]}}, {"title": "Role of the Apical Oxygen in Cuprate High-Temperature Superconductors", "journal": "PRL_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/d9cc-jnst", "authors": "Samuel Vadnais, Rémi Duchesne, Kristjan Haule, A.-M. S. Tremblay, David Sénéchal, Benjamin Bacq-Labreuil", "last_authors": "David Sénéchal, Benjamin Bacq-Labreuil", "summary": "Scanning tunneling microscopy measurements exploiting the natural superstructure modulation of the cuprate superconductor ${\\mathrm{Bi}}_{2}{\\mathrm{Sr}}_{2}{\\mathrm{CaCu}}_{2}{\\mathrm{O}}_{8+δ}$ (Bi-2212) have rrents and their efficient conversion into pure spin currents remains a fundamental challenge in spintronics. Here, we report a spin-axis dynamic locking (SADL) effect in altermagnets that pins the high and dynamically robust spin polarizatio…", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Addresses spin currents in altermagnets, a material class of direct interest to the user.", "tags": ["material", "altermagnetism", "spintronics"], "image": "", "briefing": {"background": "알터마그넷(Altermagnets)은 일반적인 강자성체나 반강자성체와 달리, 자성 질서가 비자기적 위상학적 특성과 결합하여 스핀 분극된 전류를 생성할 수 있는 새로운 물질군입니다.", "motivation": "스핀트로닉스 응용을 위해 알터마그넷 내에서 어떻게 스핀 분극 전류를 생성하고 이를 효율적으로 조절할 수 있을지 연구하는 것이 목표입니다.", "result": "스핀-축 동적 잠금(SADL) 효과를 보고하였으며, 이를 통해 알터마그넷 내에서 강력하고 안정적인 스핀 분극 상태를 유지할 수 있음을 규명했습니다.", "implication": "알터마그넷 기반의 차세대 스핀트로닉 소자에서 전기적으로 스핀 전류를 제어하는 매우 효율적인 경로를 제시합니다.", "novelty": "최근 주목받는 알터마그넷의 물성을 스핀트로닉스 응용과 직접 연결한 연구로, 귀하의 위상학적 자성 물질 관심사와 부합합니다.", "unresolved": "실제 실험적 구현을 위해서는 SADL 효과를 입증할 수 있는 구체적인 물질 후보군과 측정법이 명확히 제시되어야 합니다.", "future_work": "SADL 효과를 검증할 수 있는 실험적 수송 측정(transport measurement) 및 관련 물질의 밴드 구조 계산.", "concepts": [{"term": "Altermagnetism", "why_emerged": "시간 반전 대칭성은 깨지지만 격자 대칭으로 인해 알짜 자성이 없는 물질의 스핀 분극 특성을 설명하기 위해.", "origin": "최근 2-3년 내 체계적으로 정립됨 (예: Jungwirth 등).", "connections": "반강자성체, 스핀-궤도 결합, 강자성체 사이의 가교."}, {"term": "Spin-Axis Dynamic Locking", "why_emerged": "전류 흐름에 따라 스핀의 방향이 동적으로 고정되어 안정성을 높이기 위해.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "스핀-궤도 토크(SOT), 알터마그네틱 스핀 수송 이론."}], "english_summary": ["Introduces the spin-axis dynamic locking (SADL) effect in altermagnets.", "Demonstrates a mechanism to generate and pin highly spin-polarized currents.", "Offers a new pathway for all-electrical control in altermagnetic spintronics."]}}, {"title": "Step-Edge Anomaly in Topological Metals", "journal": "PRL_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/3p2x-yjyd", "authors": "O. Schweizer, V. Gali, A. Y. Chaou, G. Lemut, P. W. Brouwer, and M. Breitkreiz", "last_authors": "A. Y. Chaou, G. Lemut, P. W. Brouwer, and M. Breitkreiz", "summary": "Bulk–boundary correspondence guarantees the presence of robust, anomalous states on the boundary of topological matter. The edges of a two-dimensional Chern insulator harbor one-dimensional chiral states, which have a conductance n e 2 / h , where n is an integer that is solely determined by the bulk. In this Letter we show that step edges on the surface of three-dimensional topological metals have a robust conductance K e 2 / h , where K is also fixed by the bulk and assumes noninteger values. We explain this prediction on the basis of the topology of gapless systems, exemplify it on a lattice model, and connect to recent experimental observations of enhanced density of states at step edges in topological metals.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Discusses bulk-boundary correspondence and anomalous states in topological metals, highly relevant to ARPES/STM.", "tags": ["theory", "topological-metals", "electronic-structure"], "image": "", "briefing": {"background": "위상 절연체와 같은 위상 물질의 가장자리는 벌크 상태의 위상 불변량에 의해 결정되는 강건한 상태(bulk-boundary correspondence)를 가집니다. 일반적으로 2차원 Chern 절연체는 정수 단위의 전도도를 보입니다.", "motivation": "3차원 위상 금속 표면에 존재하는 '단차(step-edge)'가 벌크 특성에 의해 결정되는 전도도를 가지는지, 그리고 이 값이 정수가 아닌 유리수 형태(K)로 나타날 수 있는지 이론적으로 규명하고자 했습니다.", "result": "위상 금속 표면의 단차에서 벌크 상태에 의해 고정된 비정수 전도도 K를 가지는 강건한 전도성 상태가 존재함을 보였습니다.", "implication": "위상 금속의 표면 단차를 정밀하게 제어하여 전자 소자의 전기적 특성을 튜닝할 수 있는 물리적 기초를 제공하며, STM을 이용한 단차 근처의 밀도 상태 관측 결과를 뒷받침합니다.", "novelty": "기존 정수 양자화 전도도와 달리 위상 금속에서 비정수 전도도가 벌크에 의해 강건하게 고정된다는 점을 제시하여 ARPES 및 STM 연구자들에게 새로운 표면 상태 해석 프레임워크를 제공합니다.", "unresolved": "실제 실험적 소자에서 결함이나 불순물이 이 비정수 전도도를 얼마나 보존하거나 교란할지에 대한 구체적인 정량적 한계는 미지수입니다.", "future_work": "다양한 위상 금속 물질에서의 정밀한 전송 측정과 단차 구조가 국소적 전자 상태에 미치는 영향을 STM으로 매핑하는 연구가 필요합니다.", "concepts": [{"term": "Bulk-boundary correspondence", "why_emerged": "벌크의 위상적 성질이 왜 표면에서 독특한 전도 현상으로 발현되는지 설명하기 위해 필요함.", "origin": "Hasan & Kane, Rev. Mod. Phys. 82, 3045 (2010) 등에 의해 체계화됨.", "connections": "Chern 절연체, 위상 절연체의 에지 상태 이론과 직접적으로 연결됨."}, {"term": "Topological Metals", "why_emerged": "전통적인 밴드 이론으로 설명되지 않는 위상적 비자명성을 가진 금속 상태를 분류하기 위해 도입됨.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "Weyl/Dirac 반금속, nodal-line 금속과 밀접함."}], "english_summary": ["The paper investigates step-edge states in 3D topological metals.", "It proves the existence of robust, non-integer conductance fixed by bulk topology.", "The findings provide a theoretical explanation for increased DOS observed at step edges.", "This links bulk topological invariants directly to observable boundary transport phenomena."]}}, {"title": "Nonlinear directional emission on monolayer MoS2 by optical orbit-orbit coupling", "journal": "Science_Advances", "source": "Gemini", "link": "https://www.science.org/doi/abs/10.1126/sciadv.aei3860?af=R", "authors": "Xianglong Wang, Xinghao Wang, Xueli Jiang, et al.", "last_authors": "Dong Wu, Jincheng Ni", "summary": "Controlling the direction of light emission on the subwavelength scale is a key to manipulating light and improving efficiency in optical sensing and quantum information processing. In functional metasurfaces, photonic spin angular momentum is widely used to control the propagation of light emission by geometric phase, but it is challenging to accomplish using monolayer materials because of lacking optical resonance in atomic thickness. Furthermore, the manipulation of the optical geometric phase based on spin angular momentum beams typically offers only two tunable states. Here, we report optical control of free-space routing of second harmonic generation in monolayer MoS 2 assisted by photonic orbital angular momenta. The experimental directionality of the second harmonic light can reach 0.84. Moreover, we can dynamically route the second harmonic generation signal on the engineered monolayer MoS 2 with four directions, showing high-order information encryption. HE) in antiferromagnetic (AF) systems without net magnetization is of considerable interest for fundamental physics and spintronic applications. Of particular interest is the two-dimensional van der Waals antiferromagnet iron telluride (FeTe), which has an unusual magnetically compensated bicollinear AF structure and claimed Kondo interactions that cause strong band renormalization. Here, we investigate the AHE in epitaxial FeTe thin films grown by molecular beam epitaxy. A large anomalous Hall conductivity is exhibited below the Néel temperature ( T N ∼ 60 kelvins) and, notably, becomes nonlinear at high magnetic fields within a narrow temperature window around 49 kelvins, deviating from conventional AHE scaling behavior versus the longitudinal conductivity. The accompanying field-induced canted magnetic moment activates these AHE responses by tuning the Berry curvature derived from FeTe’s topological band structure once the zero-field symmetry constraint is lifted. The unconventional scaling of AHE highlights the intricate interplay between antiferromagnetism, topology, and electronic transport in FeTe.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Directly relevant study of anomalous Hall scaling in magnetic materials, involving transport in antiferromagnets.", "tags": ["material", "transport", "anomalousHalleffect"], "image": "", "briefing": {"background": "반강자성체(AFM)는 순자화가 없음에도 불구하고 베리 곡률에 의해 비정상 홀 효과(AHE)가 나타날 수 있어 차세대 스핀트로닉스 소자로 주목받고 있습니다.", "motivation": "van der Waals 반강자성체인 FeTe 박막에서 나타나는 독특한 자기 구조와 AHE 간의 상관관계 및 그 스케일링 특성을 조사하고자 했습니다.", "result": "FeTe 박막의 특정 온도 영역에서 자장에 따른 비선형 AHE를 발견했으며, 이는 자기장에 의한 자구 회전이 베리 곡률을 변화시켜 유도됨을 확인했습니다.", "implication": "반강자성체의 위상적 전자 구조와 수송 현상이 외부 자장에 의해 어떻게 정밀하게 제어될 수 있는지 보여주며, AFM 기반 spintronics 소자 설계에 중요한 통찰을 줍니다.", "novelty": "기존의 선형적인 AHE 스케일링에서 벗어난 FeTe만의 비선형성을 보였으며, 반강자성체 내 위상적 밴드 구조와 수송 현상의 결합을 실험적으로 규명했습니다.", "unresolved": "관찰된 'Kondo 상호작용'이 실제로 밴드 재규격화에 미치는 미시적 기여와 자기적 정렬의 상세한 동역학은 여전히 토론의 여지가 있습니다.", "future_work": "다양한 두께의 FeTe 박막이나 다른 112 계열 화합물에서의 온도/자장 의존성 ARPES 연구를 통해 베리 곡률의 직접적 변화를 관측할 필요가 있습니다.", "concepts": [{"term": "Anomalous Hall Effect (AHE)", "why_emerged": "전하 수송에서 자기적 성질이 베리 곡률을 통해 어떻게 기여하는지 이해하기 위해 필요.", "origin": "Hall (1881), Karplus-Luttinger (1954).", "connections": "Berry phase, 스핀-궤도 결합, 위상 물질."}, {"term": "Bicollinear Antiferromagnet", "why_emerged": "FeTe 등에서 나타나는 특이한 자기 배열을 분류하기 위해 사용.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "철 기반 초전도체, 반강자성 스핀트로닉스."}], "english_summary": ["Investigates AHE in epitaxial FeTe thin films.", "Observes non-monotonic scaling of AHE linked to magnetic-field-induced canted moments.", "Attributes AHE to topological band structure changes under symmetry breaking.", "Highlights the interplay between antiferromagnetic order and Berry curvature."]}}, {"title": "Altermagnetism produces pair emission and absorption from dark excitons and magnons in La2O3Mn2Se2", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2609.36128", "authors": "Birender Singh, Xian Xu, Sabrina R. Hatt, et al.", "last_authors": "Huiwen Ji, Kenneth S. Burch", "summary": "Altermagnets’ (AMs) non-relativistic spin splitting enables novel states, spintronic and magneto-optical devices, though their optical signatures remain elusive. Here, we report exciton-magnon emission and absorption: optical sidebands from a spin-forbidden dark exciton, a direct consequence of altermagnetic symmetry. Combined optical spectroscopy and first-principles calculations reveal that La 2 ​ O 3 ​ Mn 2 ​ Se 2 \\text{La}{\\vphantom{\\text{X}}}_{\\smash[t]{\\text{2}}}\\text{O}{\\vphantom{\\text{X}}}_{\\smash[t]{\\text{3}}}\\text{Mn}{\\vphantom{\\text{X}}}_{\\smash[t]{\\text{2}}}\\text{Se}{\\vphantom{\\text{X}}}_{\\smash[t]{\\text{2}}} is an altermagnetic insulator, hosting a strongly bound, spin-forbidden dark exciton and a higher-energy bright exciton. Photoluminescence (PL) and absorption reveal mirror-image sidebands, Stokes-shifted
