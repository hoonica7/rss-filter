and filling and temperature, with a gauge factor more than two orders of magnitude larger than that of conventional metals. In selected doping regimes, the elastoresistance exhibited a Curie-Weiss–like temperature divergence. We discuss possible microscopic origins, including nematic fluctuations and enhanced electronic entropy from fluctuating isospin moments. Our work establishes uniaxial strain as a versatile probe of correlated physics in a moiré material.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Important electronic transport study in moire heterostructures relevant to correlated electron systems.", "tags": ["moire", "graphene", "transport"], "image": "", "briefing": {"background": "매직각 트위스트 이중층 그래핀(MATBG)은 전자 간 강한 상관관계가 나타나는 대표적인 모아레 물질로, 격자 변형에 극도로 민감합니다.", "motivation": "MATBG에서 격자 왜곡(변형)이 전자 구조와 상관관계 상태에 미치는 영향을 규명하고, 이를 수송 현상을 통해 관찰하고자 합니다.", "result": "매직각 부근에서 일반 금속보다 100배 이상 큰 거대 탄성저항(elastoresistance)을 확인했으며, 이는 네마틱 요동(nematic fluctuations)에 기인할 가능성이 큼을 보였습니다.", "implication": "일축 변형이 MATBG의 강상관 물리 상태를 탐구하는 효과적인 외부 튜닝 파라미터이자 강력한 탐침임을 입증했습니다.", "novelty": "네마틱 요동과 전자 엔트로피의 관점에서 거대 탄성저항을 해석하여 MATBG의 물리적 기원을 명확히 했습니다.", "unresolved": "탄성저항의 퀴리-바이스 거동이 네마틱 상태에 의한 것인지, 혹은 다른 전자적 자유도에 의한 것인지에 대한 추가 검증이 필요합니다.", "future_work": "변형 하에서의 STS 측정 등을 통한 국소 상태 밀도 및 네마틱 질서 변수의 직접 관측이 요구됩니다.", "concepts": [{"term": "탄성저항 (Elastoresistance)", "why_emerged": "격자 변형에 따른 전자 수송 특성 변화를 감지하기 위해 사용됩니다.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "네마틱 감수성, 페르미 면 왜곡과 연결됩니다."}, {"term": "네마틱 요동", "why_emerged": "회전 대칭성이 깨진 상태에서 나타나는 전자적 질서 변화를 설명하기 위해 필요합니다.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "철계 초전도체, 페르미 면 이방성과 관련됩니다."}], "english_summary": ["The study reports giant elastoresistance in magic-angle twisted bilayer graphene (MATBG).", "The elastoresistance exhibits a Curie-Weiss-like divergence near the magic angle.", "This response is linked to nematic fluctuations and enhanced electronic entropy.", "Uniaxial strain is established as a versatile experimental probe for correlated moiré physics."]}}, {"title": "A Quantum Many-Body Approach for Orbital Magnetism in Correlated Multiband Electron Systems", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2601.14372", "authors": "Mengxing Ye", "last_authors": "Mengxing Ye", "summary": "Orbital magnetism is a purely quantum phenomenon that reflects intrinsic electronic properties of solids, yet its microscopic description in interacting multiband systems remains incomplete. We develop a general quantum many-body framework for orbital magnetic responses based on the Luttinger--Ward functional. Starting from the Dyson equation, we reformulate the thermodynamic potential in a weak magnetic field and construct a controlled expansion in powers of $B$ applicable to correlated electron systems. A key technical advance is a modified ``Fourier'' representation using noncommutative coordinates, which allows the thermodynamic potential to be expressed in an effective momentum space where the magnetic field acts perturbatively. This formulation makes analytic progress possible within the Moyal algebra. As an application, we derive the spontaneous orbital magnetization for approximations whose skeleton diagrams contain no fermion loop enclosing magnetic flux (e.g., Hartree--Fock, self-consistent RPA, and single-site dynamical mean-field theory). Vertex corrections consistent with the self-energy are included automatically, without a separate diagrammatic analysis, and the result is expressed entirely in terms of the zero-field Hamiltonian renormalized by the self-energy. For frequency-dependent but Hermitian self-energies, we generalize the orbital magnetic moment and Berry curvature to momentum-frequency space and identify two gauge-invariant contributions built from these quantities. For frequency-independent self-energies the result reduces to the familiar geometric formula for noninteracting systems. This framework provides a unified foundation for computing orbital magnetic responses in correlated multiband materials.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Advanced many-body theory for orbital magnetism and Berry curvature in correlated multiband electron systems.", "tags": ["theory", "stronglycorrelated", "orbitalmagnetism", "Berrycurvature", "Luttinger-Ward"], "image": "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAsAAAAOCAYAAAD5YeaVAAAAAXNSR0IArs4c6QAAAAZiS0dEAP8A/wD/oL2nkwAAAAlwSFlzAAALEwAACxMBAJqcGAAAAAd0SU1FB9wKExQZLWTEaOUAAAAddEVYdENvbW1lbnQAQ3JlYXRlZCB3aXRoIFRoZSBHSU1Q72QlbgAAAdpJREFUKM9tkL+L2nAARz9fPZNCKFapUn8kyI0e4iRHSR1Kb8ng0lJw6FYHFwv2LwhOpcWxTjeUunYqOmqd6hEoRDhtDWdA8ApRYsSUCDHNt5ul13vz4w0vWCgUnnEc975arX6ORqN3VqtVZbfbTQC4uEHANM3jSqXymFI6yWazP2KxWAXAL9zCUa1Wy2tXVxheKA9YNoR8Pt+aTqe4FVVVvz05O6MBhqUIBGk8Hn8HAOVy+T+XLJfLS4ZhTiRJgqIoVBRFIoric47jPnmeB1mW/9rr9ZpSSn3Lsmir1fJZlqWlUonKsvwWwD8ymc/nXwVBeLjf7xEKhdBut9Hr9WgmkyGEkJwsy5eHG5vN5g0AKIoCAEgkEkin0wQAfN9/cXPdheu6P33fBwB4ngcAcByHJpPJl+fn54mD3Gg0NrquXxeLRQAAwzAYj8cwTZPwPH9/sVg8PXweDAauqqr2cDjEer1GJBLBZDJBs9mE4zjwfZ85lAGg2+06hmGgXq+j3+/DsixYlgVN03a9Xu8jgCNCyIegIAgx13Vfd7vdu+FweG8YRkjXdWy329+dTgeSJD3ieZ7RNO0VAXAPwDEAO5VKndi2fWrb9jWl9Esul6PZbDY9Go1OZ7PZ9z/lyuD3OozU2wAAAABJRU5ErkJggg==", "briefing": {"background": "강상관 전자계에서 궤도 자기 모멘트는 물질의 본질적인 전자 구조를 반영하는 중요한 양자 현상이지만, 상호작용이 존재하는 다중 밴드 시스템에서 이를 미시적으로 기술하는 것은 이론적으로 매우 복잡한 난제였습니다.", "motivation": "기존의 비상호작용 이론을 넘어, 강상관 전자계에서 자기장에 대한 응답과 Berry 곡률 효과를 체계적으로 포함할 수 있는 통합된 다체론적 프레임워크를 구축하고자 했습니다.", "result": "Luttinger-Ward 범함수 체계 위에서 Moyal 대수를 이용한 섭동 전개 방식을 도입하여, 자기장이 가해진 다중 밴드 시스템의 열역학적 포텐셜을 효과적인 운동량 공간에서 유도했습니다. 특히, 스켈레톤 도표 내에 페르미온 루프가 없는 근사(DMFT 등) 하에서 정점 보정(vertex correction)이 자동으로 포함되는 공식을 도출했습니다.", "implication": "이 프레임워크는 강상관 물질(예: 카고메 금속이나 니켈레이트 등)의 전자 구조 데이터에서 궤도 자기 응답을 계산할 때, 복잡한 다이어그램 분석 없이도 일관된 물리량을 얻을 수 있게 해줍니다.", "novelty": "비가환 좌표계와 Moyal 대수를 사용하여 자기장 하의 섭동 전개를 명료하게 정의한 점이 기술적 핵심이며, 비상호작용 이론의 기하학적 공식을 상관관계가 포함된 밴드 구조로 성공적으로 확장했습니다.", "unresolved": "논문에서 언급된 특정 근사(스켈레톤 도표 내 루프 부재)를 넘어, 더 강한 상관관계가 존재하는 시스템에서의 복잡한 도표 기여도를 어떻게 완벽하게 포함할지에 대한 논의는 여전히 과제로 남아 있습니다.", "future_work": "실제 강상관 다중 밴드 물질의 DFT+DMFT 전자 구조 계산에 본 프레임워크를 적용하여, 비자명한 궤도 자기 특성을 갖는 후보 물질을 탐색하는 연구가 이어질 것입니다.", "concepts": [{"term": "Luttinger-Ward 범함수", "why_emerged": "상호작용하는 다체계에서 열역학적 포텐셜을 자체 일관적인 방식으로 기술하기 위해 필요함.", "origin": "J. M. Luttinger와 J. C. Ward (1960).", "connections": "DMFT(동역학적 평균장 이론)의 기본 토대이자 강상관 계의 그린 함수 기법."}, {"term": "궤도 자기 모멘트", "why_emerged": "전자 스핀 외에 전자의 궤도 운동이 생성하는 자성을 결정하기 위함.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "Berry 곡률, 비정상 홀 효과(AHE)."}, {"term": "Moyal 대수", "why_emerged": "비가환적인 양자역학적 연산자들을 곱하는 과정에서 발생하는 위상적/기하학적 구조를 처리하기 위해 필요함.", "origin": "J. E. Moyal (1949).", "connections": "비가환 기하학, 란다우 준위 물리."}], "english_summary": ["Develops a many-body framework for orbital magnetism using the Luttinger-Ward functional.", "Uses noncommutative Moyal algebra to handle magnetic fields in correlated multiband systems.", "Successfully derives orbital responses that include self-energy and vertex corrections automatically.", "Unified approach applicable to DMFT and other advanced electronic structure calculations."]}}, {"title": "Altermagnetism in moir\\'e quasicrystals", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2611.20952", "authors": "Zi-Ming Wang, Rui Chen, Dong-Hui Xu", "last_authors": "Rui Chen, Dong-Hui Xu", "summary": "Altermagnetism is a collinear compensated magnetic phase with zero net magnetization and momentum-dependent spin polarization. Quasicrystalline altermagnetism extends altermagnetism beyond periodic crystals, with noncrystallographic symmetries allowing high-order spin polarization patterns. Here, we propose a symmetry-based approach to realizing quasicrystalline altermagnetism by twisting collinear magnetic layers. Specifically, we demonstrate that the $30^{\\circ}$-twisted honeycomb lattice bilayers form the dodecagonal quasicrystals supporting an $i$-wave altermagnetic phase. We further find that $45^{\\circ}$-twisted bilayers preserving fourfold rotational symmetry support a mirror-driven $l$-wave phase with eight nodal lines. We characterize these altermagnetic patterns through plane-wave-projected spin-resolved spectral functions and spin-resolved conductances. Our work provides a systematic route to high-angular-order quasicrystalline altermagnetism through twist engineering.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Altermagnetism in moire systems is a high-interest emerging topic in electronic structure.", "tags": ["altermagnetism", "moire", "quasicrystals"], "image": "https://arxiv.org/html/2611.20952v1/Fig1.PNG", "briefing": {"background": "알터자성(Altermagnetism)은 스핀 보상(넷 자화 0)을 가지면서도 운동량 의존적 스핀 분극을 보이는 새로운 자기 위상입니다. 이를 결정 구조를 넘어선 꼬임(twist) 기반의 시스템으로 확장하려는 시도가 주목받고 있습니다.", "motivation": "주기적인 결정을 넘어 준결정(quasicrystal) 구조에서 높은 각도로 스핀 분극 패턴을 제어할 수 있는 새로운 경로를 모색하고자 했습니다.", "result": "30도 및 45도 꼬임 이중층을 통해 십이면체 및 4회 대칭을 갖는 준결정 구조를 제안했습니다. 이를 통해 $i$-wave 및 $l$-wave 형태의 알터자성 위상이 발현됨을 보였습니다.", "implication": "단순한 결정성 물질을 넘어 모아레 준결정(moire quasicrystal)에서도 스핀 정보를 제어할 수 있는 새로운 플랫폼이 확보되었습니다.", "novelty": "결정학적 대칭성을 제한하지 않는 준결정 구조를 활용하여 기존 알터자성보다 고차원의 스핀 분극 패턴을 '꼬임 공학(twist engineering)'으로 구현 가능하다는 점을 입증했습니다.", "unresolved": "실제 실험적으로 이 준결정 구조 내의 스핀 분극을 ARPES 등을 통해 직접 관측하는 것은 매우 도전적인 과제입니다.", "future_work": "이러한 준결정 알터자성체에서의 비정상 홀 효과나 토폴로지적 특성에 대한 심층 연구가 필요합니다.", "concepts": [{"term": "알터자성(Altermagnetism)", "why_emerged": "강자성과 반강자성의 장점을 모두 갖춘 새로운 자성 위상의 필요성.", "origin": "최근 2~3년 내 이론적으로 급부상, 다수의 연구 그룹(예: Libor Šmejkal 등).", "connections": "반강자성, 비정상 홀 효과, 스핀-궤도 결합."}, {"term": "모아레 준결정", "why_emerged": "주기성이 없는 구조에서 복잡한 에너지 밴드와 물성을 구현하기 위해.", "origin": "D. Shechtman(준결정 초기 발견), 모아레 물리학의 발전과 결합됨.", "connections": "트위스트 전자공학, 밴드 엔지니어링."}], "english_summary": ["Extends altermagnetism to moire quasicrystalline systems using twist engineering.", "Proposes 30-degree and 45-degree twisted bilayer structures to support i-wave and l-wave altermagnetism.", "Demonstrates high-order spin polarization patterns in systems lacking traditional periodic crystal symmetry.", "Provides a design principle for tunable spin-split bands in non-periodic moire materials."]}}, {"title": "Band splitting in the altermagnet CrSb", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2602.15131", "authors": "Vladimir P. Mineev", "last_authors": "Vladimir P. Mineev", "summary": "Altermagnets are a class of metallic magnets characterized by spin-split electron bands. Like an- tiferromagnets they lack spontaneous bulk magnetisation. The initial description of the momentum dependent spin splitting of electron bands in altermagnets was based on the spin groups approach, which is valid when relativistic interactions are neglected. Then the spin-orbit coupling has been taken into account according with time-reversal-odd, even-parity irreducible representations of cen- trosymmetric point groups formally considered by R.M.Fernandes et al, Phys.Rev.B 109, 024404 (2024). The problem of electron band splitting should be discussed based on crystal symmetry of concrete altermagnet material. Here, the band spin-splitting in hexagonal altermagnet CrSb is established using magnetic groups formalism that allows to find the additional spin splitting missed in frame of exchange approximation. Another type of spin splitting takes place in so called hidden altermagnets. This type materials do not possess symmetry in respect of space and time inversion but are symmetric in respect of the product of these operations known as toroid symmetry. There is demonstrated the real space spin splitting in materials with toroid symmetry.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Theory on band splitting in the altermagnet CrSb, directly relevant to electronic structure and altermagnetism.", "tags": ["altermagnetism", "bandstructure", "theory", "CrSb"], "image": "https://arxiv.org/html/2602.15131v4/Fig1.png", "briefing": {"background": "알터자성체는 스핀-궤도 결합(SOC)의 유무와 상관없이 고유한 스핀 분극을 갖는 밴드 구조를 가집니다. 하지만 실제 물질에서 대칭성에 기반한 스핀 분할을 정확히 예측하는 것은 여전히 중요한 연구 주제입니다.", "motivation": "CrSb와 같은 육방정계 알터자성체에서 기존의 교환 근사만으로는 설명되지 않는 밴드 분할을 자기군 이론을 통해 명확히 밝히고자 했습니다.", "result": "자기군(magnetic group) 형식주의를 통해 CrSb의 스핀 분할을 재해석하였으며, 특히 교환 근사에서 누락되었던 추가적인 스핀 분할 성분을 식별했습니다. 또한, 토로이드(toroid) 대칭을 갖는 '숨겨진 알터자성체(hidden altermagnets)'에서의 실공간 스핀 분할 가능성을 제시했습니다.", "implication": "알터자성 물질을 분류하고 그 전자 구조를 이해할 때, 단순 교환 상호작용뿐만 아니라 보다 엄밀한 대칭성 분석이 필수적임을 보여주었습니다.", "novelty": "특정 물질(CrSb)을 대상으로 자기군 이론을 엄밀하게 적용하여 기존 이론적 공백을 메웠으며, 토로이드 대칭이라는 새로운 관점을 도입했습니다.", "unresolved": "실제 ARPES 실험에서 이러한 미세한 밴드 분할을 분리해낼 수 있는 에너지 해상도가 확보되는지가 실험적 관건입니다.", "future_work": "제안된 토로이드 대칭성을 갖는 물질군에서 실공간 스핀 분할을 검증하기 위한 저온 스핀-편향 STM/STS 연구가 필요합니다.", "concepts": [{"term": "자기군(Magnetic Group)", "why_emerged": "시간 반전 대칭이 깨진 자기 구조를 기술하기 위해 일반 결정군을 확장함.", "origin": "L. Landau, E. Lifshitz 등.", "connections": "알터자성, 비정상 홀 효과 대칭 분석."}, {"term": "토로이드 대칭(Toroid symmetry)", "why_emerged": "공간 반전과 시간 반전이 각각 깨지면서도 그 곱에 대해서는 대칭을 유지하는 특수한 물리 상태를 기술하기 위해.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "다중 강성(Multiferroics), 숨겨진 알터자성."}], "english_summary": ["Analyzes spin-split bands in CrSb using magnetic group formalism.", "Identifies additional spin splitting missing in the exchange-only approximation.", "Introduces the concept of hidden altermagnets characterized by toroid symmetry.", "Suggests that toroid symmetry leads to real-space spin splitting."]}}, {"title": "Current-driven chiral RKKY interaction in altermagnets", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2611.19574", "authors": "Anirban Kundu", "last_authors": "Anirban Kundu", "summary": "The Dzyaloshinskii--Moriya (DM) interaction between magnetic moments usually requires spin--orbit coupling and broken inversion symmetry. We show that in a spin-split metal without spin--orbit coupling a charge current generates a DM interaction between localized spins. Using Keldysh Green's functions (GFs) with a drifting Fermi sea, we compute the Ruderman--Kittel--Kasuya--Yosida (RKKY) interaction between two magnetic impurities in a two-dimensional $d$-wave altermagnet with an additional exchange splitting. To linear order in the current, the correction is a Fermi-surface term, and all its components are obtained in closed form in terms of Bessel functions, valid for arbitrary values of the two independent spin splittings, $\\beta$ and $J_\\perp$. The induced DM vector points along the spin-quantization axis, which in the present model is the out-of-plane direction $\\hat{\\mathbf{z}}$. At long distance it decays as $1/R$, one power more slowly than the equilibrium coupling. In the altermagnet it vanishes for bonds along the nodal directions, where the two spin bands are degenerate, and, for a diagonal current, has opposite signs on bonds along the two crystal axes. This $d$-wave signature reverses with the N\\'eel vector and with the current, and distinguishes the altermagnet from a ferromagnet. The current also generates symmetric couplings that are odd in the impurity separation. In low-density two-dimensional conductors, the DM coupling can reach a few percent of the equilibrium exchange.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Relevant theoretical study on altermagnets with direct relevance to current experimental interests.", "tags": ["altermagnet", "theory", "transport"], "image": "https://arxiv.org/html/2611.19574v1/fig3a.png", "briefing": {"background": "알터마그넷(Altermagnet)은 스핀 분할된 밴드 구조를 가지면서도 순자화가 0인 새로운 자기 위상으로, 최근 spintronics 분야에서 큰 주목을 받고 있습니다. 기존의 강자성체와 달리 강한 스핀-궤도 결합 없이도 특이한 수송 현상을 유도할 수 있는 가능성 때문에 연구가 활발합니다.", "motivation": "알터마그넷 시스템에서 전류(charge current)가 흐를 때 스핀-궤도 결합 없이도 국부적 스핀들 사이에 Dzyaloshinskii-Moriya (DM) 상호작용이 유도될 수 있는지를 이론적으로 규명하고자 했습니다.", "result": "전류가 흐를 때 페르미 표면 항을 통해 DM 상호작용이 유도됨을 확인했습니다. 특히 d-wave 대칭성을 가진 알터마그넷에서 전류 방향과 N\\'eel 벡터에 따라 DM 벡터의 부호가 바뀌는 독특한 특징을 발견했으며, 이는 강자성체와 명확히 구분되는 지표가 됩니다.", "implication": "알터마그넷에서 스핀-궤도 결합 없이도 전류를 이용해 자성 구조를 동역학적으로 제어할 수 있음을 의미합니다. 이는 미래의 저전력 스핀 소자 설계에 중요한 이론적 토대를 제공합니다.", "novelty": "외부 자기장이나 스핀-궤도 결합 없이 오직 전류의 흐름만으로 DM 상호작용을 제어할 수 있다는 점이 핵심입니다. 사용자 관심사인 알터마그넷의 대칭성과 수송 특성 간의 관계를 구체적인 수식(Bessel 함수)으로 도출했다는 점이 중요합니다.", "unresolved": "이 연구는 이론적 모델에 기반하고 있으며, 실제 알터마그넷 물질에서의 실험적인 DM 상호작용 측정과 그 크기 검증이 필요합니다.", "future_work": "실제 알터마그넷 화합물에서의 비평형 상태 스핀 동역학 시뮬레이션 및 이 효과를 검출할 수 있는 광학적 또는 전자기적 실험 설계.", "concepts": [{"term": "Altermagnet", "why_emerged": "강자성체의 스핀 분할 특성과 반강자성체의 무자화 특성을 동시에 갖는 물질군을 분류하기 위해 등장.", "origin": "최근 2-3년 내 이론적으로 체계화됨 (Smejkal et al. 등).", "connections": "반강자성체, 스핀-궤도 토크, 위상 물질."}, {"term": "RKKY interaction", "why_emerged": "금속 내 전도 전자를 매개로 국부적인 자기 모멘트들이 서로 상호작용하는 원리를 설명하기 위해.", "origin": "Ruderman, Kittel, Kasuya, Yosida (1950년대).", "connections": "거대 자기 저항, 스핀 유리, Kondo 효과."}, {"term": "DM interaction", "why_emerged": "반강자성체에서 자기 모멘트가 완벽하게 상쇄되지 않는 비스듬한 정렬을 설명하기 위해.", "origin": "Igor Dzyaloshinskii (1958), Toru Moriya (1960).", "connections": "스카이뮴, 비전통적 자성, 스핀-궤도 결합."}], "english_summary": ["The paper investigates the current-driven DM interaction in d-wave altermagnets without spin-orbit coupling.", "A closed-form expression for the induced RKKY-like interaction is derived using Keldysh Green's functions.", "The DM vector exhibits distinct nodal signatures and current-direction dependency, distinguishing altermagnets from ferromagnets.", "The results suggest a viable path for controlling magnetic textures via electrical currents in altermagnetic materials."]}}, {"title": "Electronic and magnetic properties of small one-dimensional Wigner crystals from an ab initio approach", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2607.26858", "authors": "Daniele Lagasco, Jan Arjan Berger", "last_authors": "Daniele Lagasco, Jan Arjan Berger", "summary": "We present an ab initio method to study the electronic properties of small one-dimensional Wigner crystals. In particular, we focus on the calculation of the electronic charge distribution. Our theoretical studies are motivated by the experimental observation of few-electron Wigner crystals in a carbon nanotube [Science 364, 870 (2019)]. We model the experimental setup by confining electrons in a one-dimensional potential well with hard-wall boundary conditions. We represent the Hamiltonian of the system in a basis of Slater determinants and perform full configuration interaction to ensure we capture all the electron correlation for a given basis set. As the one-particle basis set we use particle-in-a-box wave functions which by construction satisfy the boundary conditions. With our approach, we obtain accurate electronic density profiles of small one-dimensional Wigner crystals. These profiles clearly show the localisation of the electrons. Moreover, we calculate the exchange coupling constant of the Wigner dimer by mapping our ab initio method on a Heisenberg Hamiltonian. We obtain a reasonable agreement with a result in the literature.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Ab initio study of electronic/magnetic properties in quasi-1D Wigner crystals, relevant to user's 1D material interests.", "tags": ["1Dmaterials", "Wignercrystal", "abinitio", "electronicstructure", "magnetism", "carbonnanotubes", "theory"], "image": "https://arxiv.org/html/2607.26858v2/Figures/heatmap_2el_lambda188.png", "briefing": {"background": "저차원 시스템에서의 전자 상관관계는 양자 도약과 전하 고정(localization) 현상을 이해하는 핵심입니다. 특히 1차원 구조에서는 전자 간의 쿨롱 반발력이 지배적이 되어 고전적인 배열을 갖는 위그너 결정(Wigner crystal) 상태가 안정화될 수 있습니다.", "motivation": "탄소 나노튜브와 같은 1차원 한정 구조에서 관찰되는 소수 전자 위그너 결정의 전자 밀도 분포와 자기적 특성을 엄밀한 ab initio 계산으로 분석하고자 했습니다.", "result": "Slater 결정식 기반의 전 환경 배치 상호작용(Full Configuration Interaction) 방법을 사용하여 전자 밀도 프로파일을 정확히 도출했습니다. 이를 통해 1차원 포텐셜 내에서의 전자 국소화 현상을 입증하고, 위그너 이량체의 교환 결합 상수를 성공적으로 계산했습니다.", "implication": "1차원 시스템에서의 상관된 전자 상태를 제1원리 계산으로 정밀하게 묘사할 수 있음을 보여주었으며, 이는 나노 소자의 양자 상태 제어 연구에 정량적 지표를 제공합니다.", "novelty": "경계 조건을 엄격히 만족하는 입자-상자 파동함수 기저를 사용하여 상관관계를 온전히 포착했다는 점이 특징입니다. quasi-1D 물질의 전자 상관 연구를 진행하는 사용자에게 기초적인 계산 방법론적 통찰을 제공합니다.", "unresolved": "계산 규모의 한계로 인해 매우 작은 수의 전자를 가진 시스템에 국한되어 있으며, 무한히 긴 1차원 사슬(Luttinger liquid 영역)로의 외삽은 추가 연구가 필요합니다.", "future_work": "더 긴 나노튜브 시스템으로의 확장 및 Luttinger 액체 모델과의 상관관계 정밀 분석.", "concepts": [{"term": "Wigner Crystal", "why_emerged": "낮은 밀도에서 전자의 운동 에너지보다 쿨롱 에너지가 지배적일 때 형성되는 결정형 상태를 설명하기 위해.", "origin": "Eugene Wigner (1934).", "connections": "양자상전이, 도핑된 Mott 절연체, 2D 물질."}, {"term": "Full Configuration Interaction (FCI)", "why_emerged": "전자 상관관계(electron correlation)를 오차 없이 계산하기 위한 가장 엄밀한 수치적 기법.", "origin": "양자화학의 표준적 방법론(20세기 중반).", "connections": "DFT+DMFT, ab initio 계산."}], "english_summary": ["An ab initio method is applied to model small 1D Wigner crystals in confinement potentials.", "Full configuration interaction captures electron correlation, revealing precise charge localization profiles.", "Exchange coupling constants are mapped to a Heisenberg Hamiltonian with good agreement to previous literature.", "The study bridges the gap between quantum chemical calculation methods and experimental 1D nanowire electronic structure."]}}, {"title": "Electrostatic and magnetic control of the anomalous Josephson phase in ferromagnetic hybrid junctions", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2611.21593", "authors": "D. Rana, O. S. Kurapati, N. Vanjarapu, et al.", "last_authors": "E. Prada, S. Vaitiek\\.{e}nas", "summary": "We report phase-sensitive measurements of Josephson junctions formed in InAs nanowires with epitaxial ferromagnetic EuS and superconducting Al shells. Using a superconducting interferometer, we observe a continuous, hysteretic anomalous phase shift under axial magnetic-field sweeps. A remanent phase bias persists at zero applied field and depends on magnetic history. Electrostatic gating strongly modifies the magnitude of the phase response, revealing its sensitivity t
