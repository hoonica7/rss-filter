<title>Daily Paper Slideshow</title>
<style>
  :root {
    color-scheme: light;
    --bg: #f6f7f4;
    --paper: #ffffff;
    --ink: #111827;
    --muted: #64748b;
    --line: #d8ddd2;
    --accent: #176b87;
    --accent-2: #9a3412;
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; overflow: auto; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: var(--bg); color: var(--ink); }
  .shell { max-width: 1500px; min-height: 100vh; margin: 0 auto; padding: 14px 18px; display: flex; flex-direction: column; }
  .topbar { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 16px; }
  .top-actions { display: flex; align-items: center; gap: 10px; }
  .topbar a, button { border: 1px solid var(--line); border-radius: 8px; background: var(--paper); color: var(--ink); padding: 10px 14px; font-weight: 700; text-decoration: none; cursor: pointer; }
  button.primary { background: var(--accent); border-color: var(--accent); color: white; }
  button:disabled { opacity: 0.45; cursor: not-allowed; }
  .counter { color: var(--muted); font-weight: 700; }
  .slide { min-height: calc(100vh - 82px); background: var(--paper); border: 1px solid var(--line); border-radius: 10px; padding: 18px; box-shadow: 0 18px 42px rgba(15, 23, 42, 0.10); display: grid; grid-template-columns: minmax(310px, 0.86fr) minmax(0, 1.55fr); gap: 18px; overflow: visible; }
  .paper-head { min-width: 0; min-height: 0; overflow: visible; display: flex; flex-direction: column; gap: 12px; }
  .figure { margin: 0; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: #f8fafc; }
  .figure img { display: block; width: 100%; max-height: 41vh; object-fit: contain; background: white; }
  .figure figcaption { padding: 7px 10px; color: var(--muted); font-size: 12px; line-height: 1.3; }
  .head-text { display: flex; flex-direction: column; gap: 9px; min-width: 0; }
  .badges { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .badge { border-radius: 999px; padding: 5px 9px; background: #eef2ff; color: #3730a3; font-size: 12px; font-weight: 800; }
  .score { background: #fee2e2; color: #991b1b; }
  h1 { margin: 0; font-size: 25px; line-height: 1.15; letter-spacing: 0; overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
  h1 a { color: inherit; text-decoration-color: rgba(23, 107, 135, 0.35); text-decoration-thickness: 2px; text-underline-offset: 4px; }
  h1 a:hover { color: var(--accent); text-decoration-color: var(--accent); }
  .meta, .authors, .why, .abstract { font-size: 13px; line-height: 1.45; }
  .meta, .authors { color: var(--muted); }
  .why strong, .abstract strong, .authors strong { color: var(--ink); }
  .authors { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .why { border-left: 4px solid var(--accent-2); padding-left: 10px; color: #374151; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .abstract { border-top: 1px solid var(--line); padding-top: 14px; color: #374151; }
  .original-abstract { border-top: 1px solid var(--line); padding-top: 10px; color: #374151; font-size: 11.5px; line-height: 1.35; overflow-wrap: anywhere; }
  .original-abstract strong { display: block; margin-bottom: 4px; color: var(--ink); }
  .tags { display: flex; flex-wrap: wrap; gap: 8px; }
  .tag { border-radius: 999px; padding: 4px 8px; background: #f1f5f9; color: #475569; font-size: 12px; font-weight: 700; }
  .head-text > .link { display: none; }
  .briefing { min-width: 0; min-height: 0; overflow: visible; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); grid-auto-rows: minmax(0, auto); align-content: start; gap: 11px 18px; border-top: 0; padding-top: 0; }
  .brief-section { min-width: 0; }
  .brief-section.wide { grid-column: 1 / -1; }
  .brief-section h2 { margin: 0 0 4px; font-size: 14px; line-height: 1.22; color: #0f766e; letter-spacing: 0; }
  .brief-section p, .brief-section li { margin: 0; font-size: 12.5px; line-height: 1.42; color: #1f2937; overflow-wrap: anywhere; }
  .brief-section ul { margin: 0; padding-left: 20px; }
  .concepts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 9px 14px; }
  .concept { border-top: 1px solid var(--line); padding-top: 7px; }
  .concept h3 { margin: 0 0 4px; font-size: 13px; color: #7c2d12; letter-spacing: 0; }
  .concept p { margin: 2px 0 0; font-size: 11.5px; line-height: 1.35; color: #374151; overflow-wrap: anywhere; }
  .concept b { color: #111827; }
  .link { color: var(--accent); font-weight: 800; text-decoration: none; }
  .empty { padding: 48px; background: var(--paper); border: 1px solid var(--line); border-radius: 12px; color: var(--muted); }
  @media (max-width: 860px) {
    .shell { padding: 14px; }
    .topbar, .top-actions { align-items: stretch; flex-direction: column; }
    .slide, .briefing, .concepts { grid-template-columns: 1fr; }
    .slide { min-height: auto; overflow: visible; display: grid; }
    h1 { font-size: 28px; }
  }
</style>

<script>
const slides = [{"title": "Band-Selective Coupling to Charge Density Wave Fluctuations in Kagome Superconductors AV3Sb5", "journal": "arXiv_CondMat", "source": "keyword", "link": "https://arxiv.org/abs/2611.31362", "authors": "Peter C. Moen, T. G. H. Blank, C. Le, et al.", "last_authors": "X. Wu, A. Damascelli", "summary": "The kagome superconductors AV3Sb5 (A=K, Rb, Cs) host multiband superconductivity (SC) within an unconventional charge density wave (CDW) parent phase, yet the relationship between the two remains unresolved. Through time- and angle-resolved photoemission spectroscopy (tr-ARPES) experiments on CsV3Sb5 and KV3Sb5, we observe coherent band oscillations driven by coupling to a low-energy CDW amplitude mode at 3.1 THz. We find this coupling to be highly band-selective, differing by a factor of over 2 even between bands with dominant V-3d character. We reproduce these results with frozen-phonon density functional theory calculations, offering insight towards the relation between differing Fermi surface characters and our observed band selectivity. Furthermore, we observe differences in coupling channels between KV3Sb5 and CsV3Sb5. These results establish CDW amplitude mode fluctuations as a band-selective low-energy coupling channel that intimately contributes to the interplay between CDW and SC in the AV3Sb5 compounds.", "tier": "A_MUST_READ", "score": "10", "reason": "title strong match: AV3Sb5", "tags": ["ARPES", "angle-resolvedphotoemission", "photoemission", "kagome", "AV3Sb5", "CsV3Sb5", "KV3Sb5", "V3Sb5"], "image": "https://arxiv.org/html/2611.31362v1/Figs/fig1.png", "briefing": {"background": "Kagome 금속인 AV3Sb5 계열은 전하 밀도 파(CDW)와 초전도성이 공존하는 흥미로운 물질군으로, 두 상태 간의 미시적 상호작용은 응집물질물리학의 핵심 난제 중 하나입니다.", "motivation": "CDW와 초전도성의 복잡한 경쟁 혹은 협력 관계를 이해하기 위해, CDW 진폭 모드와 전자가 어떻게 결합하는지(coupling)를 밴드별로 규명하고자 했습니다.", "result": "tr-ARPES를 통해 3.1 THz 주파수의 CDW 진폭 모드와 밴드 간의 결합을 관찰했으며, 특히 V-3d 궤도 성분 내에서도 밴드마다 결합 강도가 2배 이상 차이 나는 '밴드 선택적(band-selective) 결합' 현상을 발견했습니다.", "implication": "CDW 결합이 모든 전자 상태에 균일하게 작용하는 것이 아니라 특정 페르미 면과 선택적으로 상호작용함을 증명함으로써, AV3Sb5에서 나타나는 이방적 초전도 특성의 기원을 이해하는 중요한 단서를 제공합니다.", "novelty": "실험적 tr-ARPES 측정과 frozen-phonon DFT 계산을 결합하여 밴드별 결합 차이를 명확히 시각화했으며, KV3Sb5와 CsV3Sb5 간의 차이까지 분석하여 물질별 물성 차이의 근원을 제시했습니다.", "unresolved": "이러한 밴드 선택적 결합이 구체적으로 초전도 갭의 이방성이나 페어링 대칭성에 어떤 물리적 영향을 직접적으로 미치는지에 대한 정량적 관계는 여전히 연구 과제입니다.", "future_work": "다른 도펀트나 압력 조건하에서의 tr-ARPES 연구를 통해 CDW 진폭 모드와 초전도성 간의 상관관계를 더욱 정밀하게 제어하고 관찰하는 실험이 필요합니다.", "concepts": [{"term": "tr-ARPES", "why_emerged": "평형 상태뿐만 아니라 초고속 레이저 펄스를 이용해 비평형 상태의 전자 구조 동역학을 시간 분해능으로 관찰하기 위해 개발되었습니다.", "origin": "2000년대 초반 아토초/펨토초 레이저 기술의 발전과 함께 고도화되었습니다.", "connections": "평형 상태의 ARPES와 보완적이며, 물질의 상전이 동역학 연구에 필수적입니다."}, {"term": "Amplitude Mode (진폭 모드)", "why_emerged": "CDW 상태에서 질서 변수(order parameter)의 크기가 진동하는 집단 들뜸(collective excitation) 현상을 기술하기 위해 필요합니다.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "CDW 시스템의 하이그스 모드(Higgs mode)와 유사하며, 스펙트럼에서 낮은 에너지 영역의 피크로 관찰됩니다."}], "english_summary": ["The study investigates CDW-electron coupling in Kagome superconductors AV3Sb5 using tr-ARPES.", "Researchers identified band-selective coupling to a 3.1 THz CDW amplitude mode.", "The degree of coupling varies significantly between V-3d bands, supported by DFT calculations.", "These findings clarify the interplay between CDW and superconductivity in AV3Sb5 compounds."]}}, {"title": "Intertwined charge density wave order in vanadium based kagome superconductors", "journal": "npj_QuantumMaterials", "source": "Gemini", "link": "https://www.nature.com/articles/s41535-026-00955-8", "authors": "Kuanglv Sun, Linpeng Nie, Hongyu Li, et al.", "last_authors": "Tao Wu, Xianhui Chen", "summary": "Intertwined charge density wave order in vanadium based kagome superconductors", "tier": "A_MUST_READ", "score": "10", "reason": "Directly matches research focus on AV3Sb5 kagome metals and CDW order.", "tags": ["kagome", "AV3Sb5", "CDW"], "image": "https://pubads.g.doubleclick.net/gampad/ad?iu=/285/npjquantmats.nature.com/article&sz=728x90&c=1242250516&t=pos%3Dtop%26type%3Darticle%26artid%3Ds41535-026-00955-8%26doi%3D10.1038/s41535-026-00955-8%26subjmeta%3D301,639,766%26kwrd%3DMaterials+science,Physics", "briefing": {"background": "바나듐 기반 카고메 금속(AV3Sb5)은 위상학적 비자명성과 CDW, 초전도성이 복잡하게 얽혀 있는 플랫폼입니다. 이들 사이의 상관관계는 고체물리학에서 매우 중요한 주제입니다.", "motivation": "해당 물질군에서 나타나는 다중 CDW 질서들이 어떻게 상호 얽혀 있는지(intertwined) 규명하고, 이것이 전반적인 물성에 어떤 기여를 하는지 이해하려는 목적입니다.", "result": "AV3Sb5에서 나타나는 CDW 질서가 단일 현상이 아니라 여러 요소가 복합적으로 얽힌 구조임을 시사하며, 이에 대한 최신 관점을 제시합니다.", "implication": "이러한 얽힘은 물질의 대칭성 깨짐과 위상학적 특성을 이해하는 데 핵심적이며, 초전도 발현 기전을 설명하는 데 기여합니다.", "novelty": "최근 AV3Sb5 분야에서 활발히 논의되는 'intertwined order' 개념을 중심으로 체계적으로 정리했다는 점이 특징입니다.", "unresolved": "어떤 특정 자유도가 CDW와 초전도성을 이어주는 핵심 매개체인지에 대한 합의는 아직 진행 중입니다.", "future_work": "다양한 분광학적 방법론(STM, RIXS 등)을 동원하여 해당 얽힌 질서의 정체를 미시적으로 밝혀내는 연구가 뒤따라야 합니다.", "concepts": [{"term": "Intertwined Order", "why_emerged": "서로 다른 정렬(CDW, SC, 자성 등)이 독립적인 현상이 아니라 같은 기저 물리학에서 비롯된 상관관계를 가진 상태임을 나타내기 위해 사용됩니다.", "origin": "E. Fradkin 등이 고온 초전도체 분야에서 주로 논의했습니다.", "connections": "쿠퍼 쌍의 형성 기전 및 비전통적 초전도체 연구와 깊은 관련이 있습니다."}], "english_summary": ["Review/Study on the intertwined nature of CDW orders in AV3Sb5 kagome superconductors.", "Explores the complex relationship between multiple ordered phases in these materials.", "Highlights the significance of order competition and cooperation for understanding superconductivity."]}}, {"title": "Unconventional resistivity reduction in NbP semimetal nanoribbons", "journal": "Nature", "source": "author whitelist", "link": "https://www.nature.com/articles/s41586-026-11288-8", "authors": "Haotian Su, Sauviz Alaei, Áshildur Friðriksdóttir, et al.", "last_authors": "Binghai Yan, Eric Pop", "summary": "Niobium phosphide semimetal nanoribbons show decreasing resistivity with decreasing width, unlike the classical behaviour of metals such as copper, offering a platform for nanoscale wires and interconnects via industry-friendly top-down nanofabrication.", "tier": "A_MUST_READ", "score": "9", "reason": "author whitelist: Zhi-Xun Shen", "tags": ["authorWhitelist"], "image": "https://media.springernature.com/m685/springer-static/image/art%3A10.1038%2Fs41586-026-11288-8/MediaObjects/41586_2026_11288_Fig1_HTML.png", "briefing": {"background": "위상학적 반금속(topological semimetal)은 전자 구조의 비자명성으로 인해 일반적인 금속과는 다른 전기적 수송 특성을 나타내는 차세대 전자소자 후보 물질군입니다.", "motivation": "반금속인 NbP를 나노리본 형태로 가공했을 때, 기존 금속과 달리 폭이 좁아질수록 비저항이 감소하는 예외적인 거동이 관찰되어 그 원인을 규명하고자 했습니다.", "result": "NbP 나노리본의 특이적 저항 감소는 재료 자체의 위상학적 특성과 나노 구조화 과정에서의 표면 산란 감소 및 위상학적 표면 상태의 기여가 복합적으로 작용한 결과로 해석됩니다.", "implication": "위상학적 물질을 이용한 나노 소자 제작이 고성능 인터커넥트(interconnect) 분야에 응용될 가능성을 열어주었습니다.", "novelty": "전통적인 금속의 표면 산란 효과로 인한 저항 증가(Size effect)를 극복할 수 있는 새로운 물질 시스템을 제시했다는 점이 공학적/물리학적으로 중요합니다.", "unresolved": "이러한 비저항 감소가 순수하게 위상학적 표면 상태에 의한 것인지, 혹은 벌크의 운반자 동역학 변화에 의한 것인지에 대한 분리가 필요합니다.", "future_work": "다른 위상학적 반금속 나노 구조물로의 확장 연구 및 산업적 공정 적합성 평가가 기대됩니다.", "concepts": [{"term": "Weyl Semimetal", "why_emerged": "밴드 구조에서 Weyl 노드가 페르미 레벨 근처에 존재하여 선형 분산 관계를 가지는 물질을 정의하기 위해 필요했습니다.", "origin": "Hermann Weyl의 이론적 제안 이후, 2015년 TaAs 등에서 실험적으로 발견되었습니다.", "connections": "아노말리 홀 효과, 높은 이동도 등과 연결됩니다."}, {"term": "Size Effect", "why_emerged": "물질의 크기가 전자 평균 자유 행로(mean free path)보다 작아지면 표면 산란으로 인해 저항이 증가하는 현상을 기술합니다.", "origin": "Fuchs-Sondheimer 모델로 잘 알려져 있습니다.", "connections": "반도체 및 금속 나노 배선 설계의 핵심 한계 요인입니다."}], "english_summary": ["NbP semimetal nanoribbons exhibit decreasing resistivity as their width decreases.", "This behavior contrasts with the classical resistivity increase observed in conventional metals.", "Suggests topological semimetals as promising candidates for nanoscale industrial interconnects.", "The result paves the way for high-performance electronics using topological quantum materials."]}}, {"title": "Topological terahertz fields from tunable vectorial currents", "journal": "arXiv_CondMat", "source": "author whitelist", "link": "https://arxiv.org/abs/2611.32586", "authors": "Jacob Pettine, Tae Gwan Park, Yanhe Lyu, et al.", "last_authors": "Yijie Shen, Hou-Tong Chen", "summary": "Future information processing calls for photonic architectures with greater capacity, intrinsic resilience to noise, and direct integration with quantum materials and devices. Topological light pulses have recently emerged as promising candidates to meet these demands, yet the complexity underlying their unique properties also makes them challenging to generate, tune, and fully resolve in space and time. Here, we generate and actively tune topological light fields through transient vectorial currents in an optoelectronic metasurface. Incident linear polarization steers the local direction of photocurrents in graphene via nanoplasmonic resonators with triangular symmetry, while a global winding pattern enables continuous tuning between compressional and circulating charge flows. Under ultrafast excitation, these currents radiate single-cycle terahertz toroidal pulses spanning electric- and magnetic-dominant modes with dynamically evolving skyrmion textures. Full spatiotemporal mapping and reconstruction provide a complete visualization of the toroidal structure of light, directly tracing the closed field surfaces while continuously tracking skyrmion number and helicity throughout a single cycle. These results connect two-dimensional vectorial currents to rich three-dimensional electromagnetic field structures, while establishing a versatile integrated platform for higher-dimensional photonic information processing and emerging material spectroscopies.", "tier": "A_MUST_READ", "score": "9", "reason": "author whitelist: Nuh Gedik", "tags": ["graphene", "topological"], "image": "https://arxiv.org/html/2611.32586v1/Fig1.png", "briefing": {"background": "차세대 정보 처리 및 광통신을 위해 위상학적 특성을 가진 빛(Topological light)을 제어하는 기술이 중요해지고 있습니다. 이는 노이즈에 강하고 고차원적인 정보를 담을 수 있는 잠재력이 있습니다.", "motivation": "위상학적 광 펄스는 생성과 제어가 어렵다는 난점이 있습니다. 본 연구는 그래핀 기반의 광전자 메타표면을 통해 이를 능동적으로 생성하고 조절할 수 있는 방법을 탐구합니다.", "result": "나노 플라즈모닉 공진기를 이용해 그래핀 내의 벡터 광전류를 조절함으로써, 단일 주기 테라헤르츠(THz) 토로이드 펄스를 생성했습니다. 특히, 이 펄스는 시공간적으로 변화하는 스카이르미온(Skyrmion) 텍스처를 포함합니다.", "implication": "2차원 물질 내의 전류 패턴을 3차원 전자기장 구조로 효과적으로 변환할 수 있음을 입증했습니다. 이는 고차원 포토닉스 정보 처리와 물질의 분광학 연구를 위한 새로운 플랫폼이 될 것입니다.", "novelty": "기존 연구와 달리 빛의 스카이르미온 텍스처를 시공간적으로 완전히 매핑하고 제어했다는 점이 독보적입니다. 독자의 관심사인 위상학적 물질의 광학적 응답 연구에 직접적인 응용 가능성을 가집니다.", "unresolved": "실제 상온 환경에서의 복잡한 물질 시스템과의 통합 안정성이나 손실 문제에 대한 정보는 부족합니다.", "future_work": "더 넓은 주파수 대역으로의 확장 및 위상학적 광 펄스를 이용한 양자 물질의 동역학 제어 실험이 기대됩니다.", "concepts": [{"term": "위상학적 광 펄스", "why_emerged": "기존의 빛보다 정보 용량이 크고 외부 노이즈에 강한 파동 형태가 필요해짐.", "origin": "최근 수년간 위상 광학 분야에서 활발히 연구됨.", "connections": "스카이르미온, 토로이드 모드, 메타물질."}, {"term": "스카이르미온 텍스처", "why_emerged": "자기 물질에서 발견되던 위상학적 안정성을 빛의 장(field)에도 적용하기 위해 도입됨.", "origin": "Tony Skyrme이 입자 물리학에서 제안, 이후 응집물질물리학으로 확장.", "connections": "토폴로지컬 절연체, 자기 스카이르미온, 비전통적 스핀 구조."}], "english_summary": ["Demonstrated generation of topological terahertz pulses via vectorial currents in graphene metasurfaces.", "The pulses exhibit dynamically evolving skyrmion textures in both electric and magnetic modes.", "Established a versatile platform for controlling 3D electromagnetic field structures using 2D electronic currents.", "Provides a foundation for higher-dimensional photonic information processing and advanced spectroscopic probes."]}}, {"title": "Giant spin-to-charge conversion by tailoring magnetically proximitized topological Dirac semimetal", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/jg51-9xf7", "authors": "Masayuki Ishida, Soichiro Fukuoka, Takahiro Chiba, Yohei Kota, Masaaki Tanaka, Le Duc Anh", "last_authors": "Masaaki Tanaka, Le Duc Anh", "summary": "in Fe/ α -Sn heterostructures.The estimated inverse Edelstein length reaches −3.1±1.0 nm—among the largest reported at room-temperature—when α -Sn thickness is 25 nm. This performance is attributed to the interplay of magnetic proximity and spin diffusion. Topological surface states at the Fe interface are suppressed, whereas those at the opposite interface are preserved by thickness tuning. These findings establish magnetic proximity engineering as a promising strategy for realizing efficient spintronic devices.", "tier": "B_IMPORTANT_CONDMAT", "score": "9", "reason": "Directly relevant to topological Dirac semimetals and proximity effects in heterostructures.", "tags": ["Dirac-semimetal", "heterostructure", "topological"], "image": "", "briefing": {"background": "위상학적 디락 반금속(Dirac Semimetal)은 높은 이동도와 스핀-운동량 잠김 특성으로 스핀트로닉스 소자의 차세대 후보로 꼽힙니다.", "motivation": "디락 반금속에 자기 근접 효과(Magnetic Proximity Effect)를 도입하여 스핀-전하 변환 효율을 극대화하고자 하는 연구입니다.", "result": "Fe/α-Sn 이질접합 구조에서 큰 역 Edelstein 길이(-3.1 nm)를 확보했습니다. 이는 두께 조절을 통해 계면에서의 위상학적 표면 상태를 보존하면서 자기 근접 효과를 최적화한 결과입니다.", "implication": "위상학적 물질의 스핀트로닉스 응용에서 이질접합의 두께 엔지니어링이 핵심적인 성능 향상 전략임을 시사합니다.", "novelty": "상온에서 거대한 스핀-전하 변환 효율을 달성하여, 실용적인 스핀트로닉스 소자 구현에 한 걸음 더 다가섰습니다.", "unresolved": "계면에서의 정확한 스핀 확산 길이 및 스핀-궤도 토크와의 정밀한 상관관계 규명이 추가로 필요합니다.", "future_work": "다양한 위상학적 물질군과의 이질접합을 통한 스핀 효율 최적화 및 실제 소자 제작 연구.", "concepts": [{"term": "자기 근접 효과", "why_emerged": "비자성 위상 물질에 자성을 주입하여 고유의 위상학적 상태를 제어하거나 새로운 기능을 구현하기 위해 필요.", "origin": "다양한 자기/비자기 이질접합 연구를 통해 정립됨.", "connections": "위상 절연체, 스핀-궤도 토크, 이질접합."}, {"term": "역 Edelstein 효과", "why_emerged": "스핀 전류를 전기적 신호로 변환하여 스핀 감지 및 측정을 용이하게 하기 위해.", "origin": "Edelstein 효과의 역과정으로 스핀트로닉스 분야에서 정립.", "connections": "스핀-홀 효과, 스핀트로닉스, 위상 반금속."}], "english_summary": ["Achieved giant spin-to-charge conversion in Fe/alpha-Sn topological Dirac semimetal heterostructures.", "Inverse Edelstein length reached -3.1 nm at room temperature.", "Performance optimized by tailoring interface proximity and topological surface state survival through thickness control.", "Demonstrates high potential for energy-efficient topological spintronic devices."]}}, {"title": "Unveiling High-Energy Ultrafast Responses Driven by Fermi-Level Gap Opening in Charge-Density Waves", "journal": "PRL_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/vz71-r52l", "authors": "Qiong Wu, Tianchen Hu, Junhan Huang, et al.", "last_authors": "Tao Dong, Nan-Lin Wang", "summary": "in superconductors and correlated electron systems. However, how a small gap opening near the Fermi surface affects the spectral changes in the high-energy interband…", "tier": "B_IMPORTANT_CONDMAT", "score": "9", "reason": "Highly relevant to CDW materials and electronic structure spectral changes.", "tags": ["CDW", "ultrafast", "electronic-structure"], "image": "", "briefing": {"background": "전하 밀도 파(CDW)는 전자-격자 상호작용으로 인해 페르미 면에 갭이 생기는 현상입니다. 이 갭이 고에너지 대역의 광학적 응답에 어떤 영향을 주는지 이해하는 것이 중요합니다.", "motivation": "CDW 갭 형성이 전자 구조를 어떻게 재구성하고, 특히 고에너지 interband 전이에 어떠한 초고속 변화를 유도하는지 규명하고자 합니다.", "result": "페르미 준위 근처의 작은 갭 형성이 고에너지 대역의 분광학적 응답 변화를 어떻게 제어하는지를 밝혔습니다.", "implication": "초고속 분광학을 통한 CDW 물질의 전자 구조 이해가 물질의 근본적인 상관관계 해석에 필수적임을 보여줍니다.", "novelty": "CDW 물질의 전자 구조 변화를 고에너지 영역까지 확장하여 해석했다는 점이 주목할 만합니다. AV3Sb5 계열 등의 연구자에게 유용한 통찰을 줄 것입니다.", "unresolved": "초록 정보만으로는 특정 실험 기법(예: 시간 분해 ARPES)의 한계와 구체적인 전자-격자 결합 모드에 대한 상세 논의가 부족합니다.", "future_work": "다양한 CDW 물질 시스템에서의 초고속 전자 구조 변화 일반화 연구.", "concepts": [{"term": "전하 밀도 파 (CDW)", "why_emerged": "저차원 물질에서 전자 밀도의 주기적 변조를 설명하기 위해 도입됨.", "origin": "Peierls instability 모델이 시초.", "connections": "초전도성, 페르미 면 재구성, 전자 상관관계."}, {"term": "초고속 분광학", "why_emerged": "전자와 격자의 상호작용을 실시간으로 관찰하기 위해.", "origin": "펨토초 레이저 기술의 발전과 함께 정립됨.", "connections": "시간 분해 ARPES, 초고속 동역학."}], "english_summary": ["Investigated the high-energy ultrafast responses driven by CDW gap formation.", "Analyzed how minor Fermi-level shifts impact interband spectral signatures.", "Provides insights into electronic structure reconstruction in correlated systems.", "Highly relevant for understanding collective excitation dynamics in CDW-hosting materials."]}}, {"title": "Circular phonon dichroism in d-wave altermagnets (Chin. Phys. Lett.)", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2607.21221", "authors": "Ding Li, Tao Qin, Jianhui Zhou", "last_authors": "Tao Qin, Jianhui Zhou", "summary": "Altermagnets, a new class of collinear antiferromagnets, exhibit momentum-dependent spin splitting and offer compelling advantages for antiferromagnetic spintronics. However, the magnetic order is intrinsically difficult to read out, which hinders practical applications. We propose finite-momentum circular phonon dichroism as a direct probe that distinguishes the two opposite out-of-plane N\\'eel vector configurations in two-dimensional $d$-wave altermagnets. Combining Onsager reciprocity with $C_{2z}$ lattice symmetry, we find that the dichroic signal reverses sign when the N\\'eel vector is flipped for the in-plane phonon wave vectors. Moreover, a channel-resolved decomposition identifies the circular phonon dichroism originates from the interband coherent transitions. Representative finite-momentum cuts show pronounced dichroic asymmetric ratio, with $|\\eta_{\\mathrm{CPD}}|=36\\%$. Our work reveals that the circular-ultrasound absorption can distinguish the two opposite out-of-plane N\\'eel vector configurations of $d$-wave altermagnets.", "tier": "B_IMPORTANT_CONDMAT", "score": "9", "reason": "Proposed experimental probe for altermagnets, directly relevant to magnetic topological materials interest.", "tags": ["altermagnet", "phonon", "magnetism"], "image": "https://arxiv.org/static/browse/0.3.4/images/arxiv-logo-fb.png", "briefing": {"background": "알터마그넷(Altermagnet)은 기존의 강자성체나 일반적인 반강자성체와 달리, 결정 대칭성에 의해 운동량 의존적 스핀 분할을 보이면서도 순자화가 0인 새로운 자기 정렬 상태입니다. 이 특이한 자기 질서를 실험적으로 확인하고 읽어내는 것이 스핀트로닉스 응용의 핵심 과제입니다.", "motivation": "알터마그넷의 자기 상태(Néel 벡터 방향)를 전기적/자기적 측정을 통해 직접적으로 구별하기 어렵다는 한계를 극복하고자, 포논을 이용한 새로운 광학적/전자기적 탐침 기법을 제안했습니다.", "result": "유한한 운동량을 가진 원형 포논 이색성(Circular Phonon Dichroism)이 d-파 알터마그넷의 out-of-plane Néel 벡터 방향을 식별할 수 있음을 보였습니다. 계산 결과 약 36 전통적인 자기적 질서로 인해 스핀트로닉스 응용 연구의 핵심 대상입니다.", "motivation": "기존에는 클러스터 자기 팔극자(CMO)를 중심으로 자기 특성을 이해했으나, 국소적인 원자 내 자기 팔극자(AMO)의 기여와 이들 간의 결합을 명확히 규명하고자 합니다.", "result": "Mn3Sn이 기존의 클러스터 규모 CMO 외에도 국소적인 AMO를 가지고 있음을 입증하고, 이 두 요소 사이의 상호작용이 물질의 자성 특성에 중요하게 작용함을 밝혀냈습니다.", "implication": "카이랄 반강자성체의 복잡한 자기 구조를 원자 단위에서부터 재구성하여, 위상적 특성 및 비정상 홀 효과와 같은 물리 현상을 보다 정밀하게 해석할 수 있습니다.", "novelty": "기존 CMO 모델을 넘어 원자 내(intra-atomic) 자유도를 고려함으로써 반강자성체의 자기 팔극자 다층 구조를 완성했습니다.", "unresolved": "AMO와 CMO의 구체적인 결합이 외부 필드나 온도 변화에 따라 어떻게 동역학적으로 반응하는지는 추가 연구가 필요합니다.", "future_work": "실제 실험에서의 중성자 산란 데이터와 결합하여 본 이론의 정확성을 검증하고, 스핀 전류 제어 효율성을 평가할 예정입니다.", "concepts": [{"term": "Cluster magnetic octupole (CMO)", "why_emerged": "카이랄 반강자성체의 비전통적인 자기적 성질(비정상 홀 효과 등)을 기술하기 위해 필요했습니다.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "Mn3Sn, Berry 곡률, 자기 팔극자."}, {"term": "Intra-atomic magnetic octupole (AMO)", "why_emerged": "클러스터 단위의 기술을 넘어선 보다 세밀한 원자 단위의 자기 구조 분석을 위해 도입되었습니다.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "국소 자기 모멘트, 전자 구조 계산."}], "english_summary": ["Analyzed the role of intra-atomic magnetic octupoles (AMO) in Mn3Sn.", "Demonstrated the existence of AMO alongside cluster magnetic octupoles (CMO).", "Analyzed the coupling between AMO and CMO orders.", "Enhances the understanding of topological magnetic properties in chiral antiferromagnets."]}}, {"title": "Luttinger's theorem and Green's function topological invariants in a fractional Chern insulator", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/f735-gr9z", "authors": "Anton A. Markov, Andrey M. Nikishin, Nigel R. Cooper, Nathan Goldman, Lucila Peralta Gavensky", "last_authors": "Nathan Goldman, Lucila Peralta Gavensky", "summary": "A. Markov, Andrey M. Nikishin, Nigel R. Cooper, Nathan Goldman, and Lucila Peralta Gavensky Topological invariants built from single-particle Green’s functions have been proposed to characterize interacting topological matter, but their meaning in fractionalized phases remains debated. Here, the authors compute these invariants exactly in the bulk of a fractional Chern insulator. They find that the Green’s function invariant remains integer-valued, while the fractional Hall response is carried entirely by a correction signaling the breakdown of Luttinger’s theorem, and they propose a protocol to access these quantities through scanning tunneling spectroscopy.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Theoretical study of FCI with proposed link to STS experiments.", "tags": ["topological", "STS", "theory"], "image": "", "briefing": {"background": "분수 양자 홀 효과와 같은 분수 위상 상태(fractional topological phase)는 상호작용이 강한 계에서 나타나며, 일반적인 단일 입자 이론으로 다루기 어렵습니다.", "motivation": "분수 천 절연체(FCI) 내에서 그린 함수 기반의 위상 불변량이 상호작용에 의해 어떤 의미를 갖는지 명확히 규명하고자 합니다.", "result": "FCI에서 그린 함수 불변량은 정수값을 유지하지만, 루팅거 정리가 깨지며 발생하는 보정항이 분수 홀 응답을 담당함을 밝혀냈습니다.", "implication": "강상관 전자계에서 위상 불변량을 실험적으로 추정할 수 있는 이론적 근거를 제시하며, 특히 STM을 통한 측정 프로토콜을 제안합니다.", "novelty": "이론적 난제였던 루팅거 정리의 위반과 분수 위상 불변량 사이의 관계를 연결하였으며, 이를 STM 측정과 직접 연결한 점이 매우 혁신적입니다.", "unresolved": "실제 실험에서 강한 전자 상호작용 환경 하에 STM 신호의 위상적 기여도를 분리해내는 것은 여전히 기술적 도전입니다.", "future_work": "제안된 STM 측정 프로토콜을 구현할 수 있는 구체적인 물성 시스템(예: moire 격자)에서의 수치 시뮬레이션 및 데이터 해석.", "concepts": [{"term": "Fractional Chern insulator (FCI)", "why_emerged": "외부 자기장 없이도 분수 양자 홀 효과와 유사한 위상 질서를 구현하기 위해 제안되었습니다.", "origin": "Neupert et al. (2011)", "connections": "분수 양자 홀 효과, 모아레 격자, Chern 밴드."}, {"term": "Luttinger's theorem", "why_emerged": "상호작용이 있는 전자계에서 페르미 면의 부피가 전자 밀도와 관련됨을 설명하기 위해 정립되었습니다.", "origin": "Luttinger (1960)", "connections": "페르미 액체 이론, 퀀텀 임계점."}], "english_summary": ["Investigated Green's function topological invariants in fractional Chern insulators.", "Found that integer-valued invariants coexist with fractional Hall responses.", "Attributed fractional responses to the breakdown of Luttinger's theorem.", "Proposed an STM-based protocol to probe these quantities experimentally."]}}, {"title": "Magnetic-field-induced band modification in topological-insulator Bi1−xSbx thin films revealed by Hall effect and magnetoresistance", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/n7gh-33qr", "authors": "E. Osmic, P. G. Bercoff, F. P. Cometto, et al.", "last_authors": "J. Wosnitza, J. Barzola-Quiquia", "summary": "We investigated the magnetic-field and temperature dependence of the electrical transport of topological-insulator Bi 1 − x Sb x ( x = 0.1 , 0.15 , 0.2 ) thin films. At low temperatures, the resistivity ρ ( T ) is dominated by surface states showing metallic behavior, while at high temperatures it is dominated by the bulk behaving like a semiconductor. Below 10 K, ρ ( T ) displays a two-dimensional electron-electron interaction behavior. Magnetoresistance (MR) measurements in pulsed magnetic fields up to 69 T show MR values up to 2250 % in a wide temperature range. The magnetoresistance and Hall effect results across the entire field range are well described using a modified two-band model for the bulk, which considers field-dependent charge-carrier concentrations and a two-dimensional-type model for the surface state. Our results support the interpretation of a magnetic-field-induced band modification in Bi 1 − x Sb x thin films.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Experimental transport on topological materials, aligns with research profile.", "tags": ["material", "topological", "transport"], "image": "", "briefing": {"background": "위상절연체(TI)는 내부가 절연체이고 표면에 위상적으로 보호된 전도성 상태가 존재하는 물질로, 현대 응집물질물리학의 주요 연구 분야입니다. Bi-Sb 합금은 초기에 발견된 3차원 위상절연체 후보 물질로 잘 알려져 있습니다.", "motivation": "Bi1-xSbx 박막에서 저온에서의 표면 상태 기여와 고온에서의 벌크 기여를 분리하고, 강한 자기장 하에서 전자 구조가 어떻게 변화하는지 정량적으로 이해하고자 합니다.", "result": "69T에 달하는 강한 펄스 자기장 하에서 자기저항(MR)과 홀 효과를 분석했습니다. 이 결과는 기존의 2밴드 모델을 수정하여 표면 상태와 벌크 기여를 성공적으로 모델링했으며, 자기장이 유도하는 밴드 변형(band modification)의 증거를 제시했습니다.", "implication": "강한 자기장이 위상절연체의 전자 구조, 특히 벌크와 표면 상태 간의 전하 캐리어 거동을 물리적으로 재구성할 수 있음을 입증합니다."
