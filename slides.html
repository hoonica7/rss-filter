<title>Daily Paper Slideshow</title>
<style>
  :root {
    color-scheme: light;
    --bg: #f6f7f4;
    --paper: #ffffff;
    --ink: #111827;
    --muted: #64748b;
    --line: #d8ddd2;
    --accent: #176b87;
    --accent-2: #9a3412;
  }
  * { box-sizing: border-box; }
  body { margin: 0; height: 100vh; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: var(--bg); color: var(--ink); }
  .shell { max-width: 1500px; height: 100vh; margin: 0 auto; padding: 14px 18px; display: flex; flex-direction: column; }
  .topbar { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 16px; }
  .top-actions { display: flex; align-items: center; gap: 10px; }
  .topbar a, button { border: 1px solid var(--line); border-radius: 8px; background: var(--paper); color: var(--ink); padding: 10px 14px; font-weight: 700; text-decoration: none; cursor: pointer; }
  button.primary { background: var(--accent); border-color: var(--accent); color: white; }
  button:disabled { opacity: 0.45; cursor: not-allowed; }
  .counter { color: var(--muted); font-weight: 700; }
  .slide { height: calc(100vh - 82px); background: var(--paper); border: 1px solid var(--line); border-radius: 10px; padding: 18px; box-shadow: 0 18px 42px rgba(15, 23, 42, 0.10); display: grid; grid-template-columns: minmax(310px, 0.86fr) minmax(0, 1.55fr); gap: 18px; overflow: hidden; }
  .paper-head { min-width: 0; min-height: 0; overflow: hidden; display: flex; flex-direction: column; gap: 12px; }
  .figure { margin: 0; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: #f8fafc; }
  .figure img { display: block; width: 100%; max-height: 41vh; object-fit: contain; background: white; }
  .figure figcaption { padding: 7px 10px; color: var(--muted); font-size: 12px; line-height: 1.3; }
  .head-text { display: flex; flex-direction: column; gap: 9px; min-width: 0; }
  .badges { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .badge { border-radius: 999px; padding: 5px 9px; background: #eef2ff; color: #3730a3; font-size: 12px; font-weight: 800; }
  .score { background: #fee2e2; color: #991b1b; }
  h1 { margin: 0; font-size: 25px; line-height: 1.15; letter-spacing: 0; overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
  h1 a { color: inherit; text-decoration-color: rgba(23, 107, 135, 0.35); text-decoration-thickness: 2px; text-underline-offset: 4px; }
  h1 a:hover { color: var(--accent); text-decoration-color: var(--accent); }
  .meta, .authors, .why, .abstract { font-size: 13px; line-height: 1.45; }
  .meta, .authors { color: var(--muted); }
  .why strong, .abstract strong, .authors strong { color: var(--ink); }
  .authors { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .why { border-left: 4px solid var(--accent-2); padding-left: 10px; color: #374151; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .abstract { border-top: 1px solid var(--line); padding-top: 14px; color: #374151; }
  .original-abstract { margin-top: auto; border-top: 1px solid var(--line); padding-top: 10px; color: #374151; font-size: 11.5px; line-height: 1.35; max-height: 20vh; overflow: auto; }
  .original-abstract strong { display: block; margin-bottom: 4px; color: var(--ink); }
  .tags { display: flex; flex-wrap: wrap; gap: 8px; }
  .tag { border-radius: 999px; padding: 4px 8px; background: #f1f5f9; color: #475569; font-size: 12px; font-weight: 700; }
  .head-text > .link { display: none; }
  .briefing { min-width: 0; min-height: 0; overflow: auto; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); grid-auto-rows: minmax(0, auto); align-content: start; gap: 11px 18px; border-top: 0; padding-top: 0; }
  .brief-section { min-width: 0; }
  .brief-section.wide { grid-column: 1 / -1; }
  .brief-section h2 { margin: 0 0 4px; font-size: 14px; line-height: 1.22; color: #0f766e; letter-spacing: 0; }
  .brief-section p, .brief-section li { margin: 0; font-size: 12.5px; line-height: 1.42; color: #1f2937; overflow-wrap: anywhere; }
  .brief-section ul { margin: 0; padding-left: 20px; }
  .concepts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 9px 14px; }
  .concept { border-top: 1px solid var(--line); padding-top: 7px; }
  .concept h3 { margin: 0 0 4px; font-size: 13px; color: #7c2d12; letter-spacing: 0; }
  .concept p { margin: 2px 0 0; font-size: 11.5px; line-height: 1.35; color: #374151; overflow-wrap: anywhere; }
  .concept b { color: #111827; }
  .link { color: var(--accent); font-weight: 800; text-decoration: none; }
  .empty { padding: 48px; background: var(--paper); border: 1px solid var(--line); border-radius: 12px; color: var(--muted); }
  @media (max-width: 860px) {
    body { height: auto; overflow: auto; }
    .shell { padding: 14px; }
    .topbar, .top-actions { align-items: stretch; flex-direction: column; }
    .slide, .briefing, .concepts { grid-template-columns: 1fr; }
    .slide { height: auto; overflow: visible; display: grid; }
    h1 { font-size: 28px; }
  }
</style>

<script>
const slides = [{"title": "Electronic Origin of Delicate Antiferromagnetism in FexNbS2", "journal": "PRL_Recent", "source": "author whitelist", "link": "http://link.aps.org/doi/10.1103/99yr-nqbx", "authors": "Wenxin Li, Jonathan T. Reichanadter, Shan Wu, et al.", "last_authors": "Jeffrey B. Neaton, Yu He", "summary": "Author(s): Wenxin Li, Jonathan T. Reichanadter, Shan Wu, Ji Seop Oh, Rourav Basak, Shannon C. Haley, Siqi Wang, Joshua E. Chaparro Mata, Elio Vescovo, Donghui Lu, Makoto Hashimoto, Christoph Klewe, Suchismita Sarker, Jessica L. McChesney, Alex Frañó, James G. Analytis, Robert J. Birgeneau, Jeffrey B. Neaton, and Yu He A combination of ARPES, XAS, and DFT shows a dramatic eV-scale electronic restructuring in Fe x NbS 2 , similar to what happens in correlated oxides, and suggests electronic correlations play a central role in the magnetism of Fe-intercalated transition-metal dichalcogenides. [Phys. Rev. Lett. 136, 216503] Published Wed May 27, 2026", "tier": "A_MUST_READ", "score": "10", "reason": "author whitelist: Donghui Lu", "tags": ["ARPES", "STS", "correlated", "ferromagnet", "antiferromagnet"], "image": "", "briefing": {"background": "전이금속 칼코겐 화합물(TMD)에 3d 전이금속을 삽입(intercalation)하면 자성이 유도되는데, 이 과정에서 전자 상관관계가 자성 형성에 기여하는 물리적 기작은 오랫동안 응집물질물리학의 주요 연구 주제였습니다.", "motivation": "Fe가 삽입된 NbS2(FexNbS2) 시스템에서 나타나는 섬세한 반강자성 상태가 전자 상관관계에 의해 어떻게 결정되는지, 그리고 그 전자 구조적 기원을 명확히 규명하고자 함입니다.", "result": "ARPES, XAS, DFT 분석을 통해 Fe 삽입 시 eV 단위의 거대한 전자 구조 재구성(restructuring)이 발생함을 확인했으며, 이는 강상관계 산화물에서 관찰되는 현상과 유사함을 밝혀냈습니다.", "implication": "TMD 내부의 자성이 단순한 국소 모멘트 모델이 아니라, 강한 전자 상관관계가 내포된 복합적인 전자 상태임을 시사합니다.", "novelty": "TMD 내 자성 현상을 이해하는 데 있어 전자 상관관계의 역할을 직접적으로 입증했으며, 이는 Fe-TMD 계열의 자기적 복잡성을 해석하는 중요한 근거가 됩니다.", "unresolved": "eV 단위의 재구성이 구체적으로 어떤 다체 상호작용에 의해 극소한 반강자성 에너지 척도로 이어지는지에 대한 상세한 미시적 메커니즘은 여전히 숙제입니다.", "future_work": "다른 3d 전이금속 삽입 TMD와의 비교 연구를 통해 전자 상관관계와 격자 대칭성 파괴 간의 상관관계를 탐구할 것으로 예상됩니다.", "concepts": [{"term": "Intercalation", "why_emerged": "층상 구조 물질 사이의 반데르발스 틈에 이온이나 원자를 삽입하여 물리적/화학적 물성을 변조하기 위해 필요함.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "TMD의 전기적, 자기적 성질 제어, 2D 이질 구조 연구와 연결됨."}, {"term": "X-ray Absorption Spectroscopy (XAS)", "why_emerged": "원소 선택적 전자 구조 및 화학적 결합 상태를 조사하기 위해 개발됨.", "origin": "1970년대 방사광 가속기 기술 발전과 함께 확립됨.", "connections": "ARPES와 결합하여 전자 밴드 구조와 원자가 상태를 동시에 분석하는 데 활용됨."}], "english_summary": ["Explores electronic restructuring in Fe-intercalated NbS2 using ARPES and XAS.", "Identifies eV-scale electronic changes indicative of strong electronic correlations.", "Suggests that correlations are central to the delicate antiferromagnetic order in FexNbS2."]}}, {"title": "Symmetry-Broken Ground State and Phonon-Mediated Superconductivity in Kagome CsV3Sb5", "journal": "PRL_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/4r8x-j3nd", "authors": "Manex Alkorta, Martin Gutierrez-Amigo, Đorđe Dangić, et al.", "last_authors": "Maia G. Vergniory, Ion Errea", "summary": "Author(s): Manex Alkorta, Martin Gutierrez-Amigo, Đorđe Dangić, Chunyu Mark Guo, Philip J. W. Moll, Maia G. Vergniory, and Ion Errea The newly discovered family of nonmagnetic kagome metals ${\\mathrm{AV}}_{3}{\\mathrm{Sb}}_{5}$ ($\\mathrm{A}=\\mathrm{K}$, Rb, or Cs) provides a unique platform for exploring the interplay between charge-density wave (CDW) order, superconductivity, nontrivial topology, and spontaneous time-reversal sym… [Phys. Rev. Lett. 136, 206401] Published Fri May 22, 2026", "tier": "A_MUST_READ", "score": "10", "reason": "Direct hit: theory on kagome CsV3Sb5 with CDW, superconductivity, and TRSB.", "tags": ["kagome", "CsV3Sb5", "CDW", "superconductivity", "TRSB", "topological", "theory", "phonon"], "image": "", "briefing": {"background": "AV3Sb5(A=K, Rb, Cs) Kagome 금속은 전하밀도파(CDW), 초전도성, 그리고 시간-역전 대칭성 파괴(TRSB)가 공존하는 독특한 물성으로 인해 강상관계 물리학의 뜨거운 감자입니다.", "motivation": "Kagome 격자에서 발생하는 CDW와 초전도성 간의 미시적 상호작용, 특히 격자 진동(포논)이 이들 상태의 형성에 어떤 역할을 하는지 이론적으로 규명하고자 합니다.", "result": "Kagome 물질의 대칭성 깨진 바닥 상태를 포논 모드와 연결하여 해석하였으며, 포논 매개 초전도성 기작이 해당 시스템의 저에너지 물성을 설명할 수 있음을 제시합니다.", "implication": "CDW와 초전도성의 경쟁 또는 공존이 전자-포논 상호작용을 통해 제어될 수 있으며, 이는 Kagome 메탈의 위상적 성질과 긴밀히 연관되어 있음을 의미합니다.", "novelty": "실험적으로 관측된 TRSB 및 CDW와 이론적 포논 계산을 접목하여 Kagome 금속의 초전도 기작에 대한 이론적 통찰을 제공합니다.", "unresolved": "포논 매개 기작만으로 관측되는 TRSB(특히 비전통적 자성 혹은 루프 전류) 현상을 완벽하게 설명하기에는 여전히 이론적 논란이 존재합니다.", "future_work": "포논 스펙트럼의 직접 측정(IXS)이나 더 정교한 다체 계산을 통한 CDW-초전도성 위상 도표의 세밀화 연구가 요구됩니다.", "concepts": [{"term": "Charge-Density Wave (CDW)", "why_emerged": "저차원 전자계에서 페르미 표면의 네스팅이나 강한 전자-포논 결합에 의해 자발적으로 발생하는 주기적 전하 밀도 변조를 설명하기 위해 필요함.", "origin": "Peierls에 의해 1950년대에 이론적 기초가 마련됨.", "connections": "Kagome 금속의 밴드 평탄화 및 위상적 특성과 연관됨."}, {"term": "Time-Reversal Symmetry Breaking (TRSB)", "why_emerged": "물질 내에서 비자성임에도 불구하고 자기적 신호가 관측되는 현상을 기술하기 위해 필요함.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "루프 전류 모델, 위상 초전도체, 이상 홀 효과와 연결됨."}], "english_summary": ["Investigates the interplay of CDW, superconductivity, and TRSB in AV3Sb5 kagome metals.", "Demonstrates the role of phonons in the formation of the symmetry-broken ground state.", "Provides a theoretical framework for phonon-mediated superconductivity in these kagome materials."]}}, {"title": "Nodeless superconducting gap and electron-boson coupling in (La,Pr,Sm) 3 Ni 2 O 7 films", "journal": "Science", "source": "Gemini", "link": "https://doi.org/10.1126/science.adw8329", "authors": "Jianchang Shen, Guangdi Zhou, Yu Miao, et al.", "last_authors": "Junfeng He, Zhuoyu Chen", "summary": "The discovery of superconductivity in Ruddlesden-Popper (RP) bilayer nickelate films under ambient pressure provides an opportunity to directly investigate electronic energy scales of the superconducting state and the pairing mechanism. We report angle-resolved photoemission spectroscopy measurements of superconducting (La,Pr,Sm) 3 Ni 2 O 7 thin films by developing an ultra-high vacuum cryogenic sample quenching and transfer technique. A superconducting gap of ~18 meV with coherence peaks is observed along the Brillouin zone diagonal. The finite gap persists across the entire Brillouin zone, revealing the absence of gap nodes. A kink is observed in the energy-momentum dispersion at ~70 meV below Fermi level, indicating an electron-boson coupling. The simultaneous observation of a nodeless superconducting gap and electron-boson coupling provides insight into the pairing symmetry and gluing mechanism in RP bilayer nickelates.", "tier": "A_MUST_READ", "score": "10", "reason": "ARPES study of unconventional superconductivity in nickelate films, directly relevant to core interests.", "tags": ["ARPES", "superconductivity", "nickelates", "electronicstructure", "unconventionalsuperconductivity"], "image": "", "briefing": {"background": "Ruddlesden-Popper 이층 니켈레이트(La,Pr,Sm)3Ni2O7은 구리산화물 초전도체와 유사한 전자 구조를 가질 것으로 기대되며, 상압 환경에서의 초전도 발견은 이 분야의 새로운 이정표입니다.", "motivation": "초전도 상태의 에너지 갭 구조와 전자-보존 상호작용의 기원을 파악하여 니켈레이트의 초전도 매커니즘을 밝히고자 합니다.", "result": "ARPES 측정 결과, Brillouin zone 대각선 방향을 따라 노드(node)가 없는 ~18 meV의 초전도 갭과 70 meV에서 나타나는 킨크(kink)를 발견하였습니다.", "implication": "니켈레이트가 구리산화물과는 다른 노드 없는 갭 구조를 가짐을 확인하였으며, 킨크 현상은 전자와 보존(포논 등) 사이의 강력한 결합을 통한 페어링 메커니즘을 뒷받침합니다.", "novelty": "초고진공 시료 급냉(quenching) 기술을 도입하여 깨끗한 초전도 갭 데이터를 확보하였고, 전자-보존 결합의 구체적인 에너지 척도를 제시했습니다.", "unresolved": "발견된 전자-보존 결합이 정확히 어떤 포논 모드 혹은 스핀 플럭추에이션에 기인하는지, 그리고 이 갭 구조가 전체 밴드에 대해 보편적인지는 추가 검증이 필요합니다.", "future_work": "온도 변화에 따른 갭의 진화와 도핑 농도에 따른 전자 구조의 변화를 추적하여 상전이의 상세 물성을 연구할 것입니다.", "concepts": [{"term": "Ruddlesden-Popper (RP) phase", "why_emerged": "일반적인 페로브스카이트 구조를 층상으로 쌓아 이방성 물성을 유도하기 위한 결정 구조 분류법임.", "origin": "Ruddlesden과 Popper가 1950년대에 제안함.", "connections": "고온 초전도체, 고성능 촉매, 강유전체 연구에 널리 활용됨."}, {"term": "Electron-Boson Coupling", "why_emerged": "전자들이 어떻게 서로 페어링하여 초전도를 형성하는지 그 매개체를 찾기 위해 도입된 다체 물리학적 개념임.", "origin": "BCS 이론(1957)의 전자-포논 결합에서 기원함.", "connections": "밴드 구조의 킨크(Kink)를 통해 실험적으로 분석됨."}], "english_summary": ["Reports ARPES observation of a nodeless superconducting gap in RP bilayer n  "origin": "Joaquin Luttinger(1963).", "connections": "초전도성, 1D 나노와이어, 스핀-전하 분리."}, {"term": "곤도 효과", "why_emerged": "금속 내 자기 불순물에 의한 저온 저항의 이상 현상을 설명하기 위해.", "origin": "곤도 준(1964).", "connections": "강상관 전자계, 중페르미온(Heavy Fermion) 물리."}], "english_summary": ["Analyzed the Kondo lattice embedded in a 1D Luttinger liquid environment.", "Used bosonization techniques to derive solutions for impurity-bulk interaction.", "Clarifies the influence of spin-charge separation on impurity scattering behaviors.", "Provides a theoretical framework for studying correlated magnetic impurities in 1D systems."]}}, {"title": "Emergence of a distinct density wave state in ultrathin VSe2 films", "journal": "PRB_Recent", "source": "author whitelist", "link": "http://link.aps.org/doi/10.1103/w4s8-fckc", "authors": "Sen Liao, Xiuhua Chen, Yuzhe Wang, et al.", "last_authors": "Donglai Feng, Juan Jiang", "summary": "Author(s): Sen Liao, Xiuhua Chen, Yuzhe Wang, Rui Xu, Jianghao Yao, Yilin Wang, Donglai Feng, and Juan Jiang Dimensionality critically governs correlated states, often inducing emergent ground states in reduced dimensions. While ${\\mathrm{VSe}}_{2}$ has been studied extensively, its monolayer ground state remains controversial. Here, we resolve these issues by investigating the thickness-dependent evolutio… [Phys. Rev. B 113, 195142] Published Thu May 21, 2026", "tier": "A_MUST_READ", "score": "9", "reason": "author whitelist: Donglai Feng", "tags": ["monolayer", "correlated"], "image": "", "briefing": {"background": "VSe2는 전이금속 디칼코게나이드(TMD) 물질로, 층상 구조의 차원에 따라 전자 상관관계와 전하 밀도 파(CDW) 상태가 민감하게 변하는 물질입니다.", "motivation": "단층(monolayer) VSe2의 기저 상태에 대한 학계의 논란(강자성 유무 및 CDW 특성)을 두께 의존성 연구를 통해 명확히 해결하고자 함.", "result": "두께 변화에 따른 전자 구조의 진화를 추적하여 VSe2 박막 내에서 독특한 CDW 상태가 발현됨을 관측함.", "implication": "2차원 물질에서 차원성이 어떻게 correlated state를 유도하는지 보여주며, 향후 소자 설계의 지침이 됨.", "novelty": "Donglai Feng 그룹의 정밀한 ARPES 역량을 바탕으로 논란이 많았던 VSe2의 기저 상태를 실험적으로 명확히 규명함.", "unresolved": "관측된 CDW 상태가 정확히 어떤 위상적 특성이나 /10.1126/science.ads0189", "authors": "Yu Zheng, Quanxin Hu, Xin Yu, et al.", "last_authors": "Chi-Ming Yim, Hong Ding", "summary": "Magnetic fields can penetrate a superconductor in the form of quantum vortices, which consist of a core singularity with circulating currents. London’s quantization implies that there is one core singularity per quantum of magnetic flux in single-component superconductors. Here, we report signatures of quantum vortex core fractionalization on the potassium-terminated surface of a multiband superconductor KFe 2 As 2 . The observed splitting of single integer-flux vortices into several fractional vortices results in a disparity between the numbers of flux quanta and vortex cores. These fractional vortices often arrange in chains, which calculations show are characterized by a ℂP 2 skyrmionic topological invariant; this constitutes a different type of topological defect: the chiral skyrmion. The disparate natures of integer and fractional vortices comprising skyrmions lead to distinct spectroscopic signatures.", "tier": "A_MUST_READ", "score": "9", "reason": "author whitelist: Hong Ding", "tags": ["superconduct", "topological"], "image": "", "briefing": {"background": "초전도체 내부의 자기장 침투 상태인 양자 소용돌이(vortex)는 통상적으로 한 개의 양자화된 자속을 가지며, 그 코어 내부의 상태는 초전도 성질을 반영합니다.", "motivation": "다중 밴드 초전도체인 KFe2As2에서 나타나는 독특한 소용돌이 구조가 단순한 정수형 자속인지, 혹은 분할된 양자 상태를 갖는지 확인하고자 함.", "result": "단일 정수 자속이 여러 개의 분획 소용돌이(fractional vortices)로 쪼개지는 현상을 관찰하였으며, 이들이 스카이뮴(skyrmion) 구조를 형성함을 발견.", "implication": "초전도체 내에서 위상학적 결함이 단순히 소용돌이에 그치지 않고 고차 위상 구조(skyrmion)로 발전할 수 있음을 시사.", "novelty": "Hong Ding 그룹의 정밀한 STM 관측을 통해 분획 소용돌이와 스카이뮴 결합 상태를 실험적으로 입증함.", "unresolved": "이러한 분획화가 KFe2As2의 특정 밴드 구조와 어떻게 직접적으로 연결되는지에 대한 이론적 미세 기작.", "future_work": "유사한 위상적 특성을 가진 다른 다중 밴드 초전도체 및 철 기반 초전도체에서의 스카이뮴 매핑.", "concepts": [{"term": "Quantum vortex core fractionalization", "why_emerged": "다중 밴드 초전도체에서 코어의 에너지가 분할되거나 위상학적으로 나뉠 가능성을 설명하기 위해 등장.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "위상 초전도체, Majorana Fermions 연구."}, {"term": "Skyrmion", "why_emerged": "비자성 물질 내에서도 복잡한 스핀 혹은 위상학적 질서가 꼬인 상태를 기술하기 위해 고안됨.", "origin": "Tony Skyrme이 입자 물리학에서 처음 제안.", "connections": "자기적 스카이뮴, 위상 위상 전이."}], "english_summary": ["Observed quantum vortex core fractionalization in the multiband superconductor KFe2As2.", "Fractional vortices arrange into ℂP2 skyrmionic topological structures.", "Revealed disparate nature between integer and fractional vortices through spectroscopy.", "Provides evidence for exotic topological defects in superconducting materials."]}}, {"title": "Femtosecond modulation of electron correlations in a Luttinger liquid", "journal": "Science_Advances", "source": "keyword", "link": "https://doi.org/10.1126/sciadv.aec7494", "authors": "Na Li, Umang Mehta, Matin Lebrat, et al.", "last_authors": "Rahul Nandkishore, Margaret M. Murnane", "summary": "Luttinger liquids emerge in one-dimensional metals with strong electron interactions, exhibiting intriguing near-equilibrium properties such as spin-charge separation and power-law correlations. Although these interactions suggest fast, distinctive out-of-equilibrium dynamics, such phenomena remain largely unexplored on ultrashort timescales. Here, we use femtosecond laser excitation to weakly deplete the electron density in the Luttinger band of Li 0.9 Mo 6 O 17 and track the response via time- and angle-resolved photoemission spectroscopy. By fitting the measured electron distributions to a finite-temperature Luttinger liquid model, we observe a fast drop in the Luttinger exponent, quantifying the strength of electron interactions. Subsequently, unlike hot electrons in conventional Fermi liquids that slowly relax within picoseconds via electron-phonon coupling, hot electrons in Li 0.9 Mo 6 O 17 relax within a short time of ~100 femtoseconds, through the excitation of a nonequilibrium collective plasmon. The extremely fast evolution of the Luttinger exponent and electron temperature—including a tens of femtosecond time lag between excitation, recovery, and plasmon-driven modulation—reveals previously unidentified pathways for modulating quantum many-body interactions in low-dimensional materials.", "tier": "A_MUST_READ", "score": "9", "reason": "title strong match: Luttinger liquid", "tags": ["angle-resolvedphotoemission", "photoemission", "spin-chargeseparation", "Luttinger", "phonon"], "image": "", "briefing": {"background": "1차원 금속에서는 럿팅어 액체(Luttinger liquid) 이론이 지배적이며, 전하와 스핀이 분리되는 독특한 특성을 가짐.", "motivation": "강상관 1차원 물질인 Li0.9Mo6O17에서 초고속 레이저 펄스를 이용해 전자 상관관계를 동적으로 변조하고 그 완화 과정을 관찰하고자 함.", "result": "럿팅어 지수(Luttinger exponent)의 급격한 변화를 확인했으며, 페르미 액체와 달리 플라즈몬 여기를 통한 100fs 수준의 매우 빠른 완화를 발견함.", "implication": "저차원 물질에서 양자 다체 상호작용을 초고속으로 제어할 수 있는 가능성을 제시.", "novelty": "TR-ARPES를 사용하여 강상관 1차원 계의 비평형 동역학을 실시간으로 추적한 주목할 만한 연구.", "unresolved": "플라즈몬 여기와 럿팅어 상태 완화 사이의 상세한 결합 기작.", "future_work": "다른 quasi-1D 물질로의 확장 및 특정 파장의 빛을 이용한 양자 상태 제어 최적화.", "concepts": [{"term": "Luttinger liquid", "why_emerged": "1차원계에서 상호작용하는 전자들의 페르미 액체 이론이 파탄 남에 따라 이를 대체하기 위해 제안됨.", "origin": "Joaquin Luttinger가 1963년에 제안.", "connections": "스핀-전하 분리, 1D 탄소 나노튜브, 양자 와이어."}, {"term": "Spin-charge separation", "why_emerged": "1차원 시스템에서 전자가 가진 전하와 스핀 정보가 각기 다른 속도로 전파됨을 기술하기 위해 등장.", "origin": "1980년대 럿팅어 액체 이론의 핵심 결과로 실험 확립.", "connections": "구리산화물, 1차원 강상관 시스템."}], "english_summary": ["Studied the out-of-equilibrium dynamics of a Luttinger liquid in Li0.9Mo6O17.", "Used time-resolved ARPES to observe the modulation of the Luttinger exponent.", "Identified a ~100 fs relaxation pathway driven by nonequilibrium plasmons.", "Demonstrates fast modulation of many-body interactions in 1D quantum systems."]}}, {"title": "Supercurrent effect in a charge density wave intertwined superconductor", "journal": "Nature_Communications", "source": "Gemini", "link": "https://www.nature.com/articles/s41467-026-73778-7", "authors": "Zhen Zhu, Wei Cheng, Dang Liu, et al.", "last_authors": "Hao Zheng, Jinfeng roscopy", "unconventionalsuperconductivity"], "image": "", "briefing": {"background": "니켈산염(Nickelate)은 구리산염 초전도체와 유사한 전자 구조를 가지고 있어 고온 초전도 메커니즘을 이해하기 위한 중요한 플랫폼으로 주목받고 있습니다. 특히 La4Ni3O10은 삼중층 구조를 가지며, 전하 밀도 파(CDW)와 같은 상관관계가 전자 상태에 미치는 영향을 밝히는 것이 주요 연구 과제입니다.", "motivation": "이 연구는 La4Ni3O10의 전하 밀도 파 전이 과정에서 나타나는 전기 역학적 특성, 특히 층간 결합의 변화가 어떻게 물질의 전도성을 제어하는지 규명하고자 했습니다.", "result": "편광 분해 적외선 분광법을 통해 CDW 질서가 형성될 때 물질 내 전자적 층간 결합(layer decoupling)이 일어남을 확인했습니다. 평면 내에서는 금속성을 유지하지만 수직 방향으로는 절연체 성질이 강화되는 이방성 변화를 관측했습니다.", "implication": "니켈산염의 삼중층 구조 내에서 상관관계에 의한 전자적 국소화가 어떻게 발생하는지 보여주며, 이는 향후 니켈산염 초전도 연구에서 전도성을 최적화하는 데 중요한 통찰을 제공합니다.", "novelty": "삼중층 니켈산염의 CDW 상에서의 전자 이방성을 분광학적으로 직접 관측한 것으로, 기존의 단순한 DFT 예측을 넘어선 실제 물질의 전자 구조 변화를 입증했습니다.", "unresolved": "CDW 형성의 근본적인 기원과 이 현상이 초전도 상태와 어떻게 경쟁하거나 협력하는지에 대해서는 추가적인 연구가 필요합니다.", "future_work": "온도 및 도핑 수준을 달리한 정밀한 ARPES 측정을 통해 페르미 표면의 재구성을 확인하고 초전도성과의 연관성을 탐구할 것으로 예상됩니다.", "concepts": [{"term": "전하 밀도 파(CDW)", "why_emerged": "저차원 금속에서 전자-포논 상호작용이나 전자 상관관계로 인해 전하 밀도가 주기적으로 재배열되는 상태가 에너지를 낮추는 데 유리하기 때문에 나타납니다.", "origin": "Peierls에 의해 1차원 금속 시스템에서 이론적으로 처음 제안되었습니다.", "connections": "Kagome 금속 AV3Sb5에서의 CDW, 층상 물질의 초전도성 연구와 깊은 관련이 있습니다."}, {"term": "적외선 분광법", "why_emerged": "물질 내의 저에너지 전자 여기(excitation)와 광학적 전도도를 분석하여 전하 캐리어의 거동을 파악하기 위해 사용됩니다.", "origin": "고전적인 광학 이론에 기반하며 응집물질물리학에서 보편적으로 사용됩니다.", "connections": "전자 구조를 보는 ARPES와 상호 보완적인 정보를 제공합니다."}], "english_summary": ["Investigated the charge-density-wave (CDW) phase of the trilayer nickelate La4Ni3O10 using polarization-resolved infrared spectroscopy.", "Observed a significant electronic decoupling between layers upon the onset of CDW order.", "The material exhibits metallic in-plane conductivity while becoming increasingly insulating in the out-of-plane direction.", "Provides insights into how correlated electronic orders modify the dimensionality and conductivity of nickelate systems."]}}, {"title": "Cavity-driven attractive interactions in quantum materials", "journal": "Nature", "source": "Gemini", "link": "https://www.nature.com/articles/s41586-026-10609-1", "authors": "F. Helmrich, H. S. Adlong, M. Kroner, et al.", "last_authors": "A. İmamoğlu, T. F. Nova", "summary": "Nature, Published online: 27 May 2026; doi:10.1038/s41586-026-10609-1 A broadband, sub-wavelength time-domain microscope is described, enabling the observation that terahertz light trapped within a cavity can mediate attractive interactions in a tunable van der Waals material.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Experimental demonstration of cavity-mediated interactions in vdW materials, highly relevant to quantum materials interests.", "tags": ["material", "vanderWaals", "spectroscopy"], "image": "https://media.springernature.com/m685/springer-static/image/art%3A10.1038%2Fs41586-026-10609-1/MediaObjects/41586_2026_10609_Fig1_HTML.png", "briefing": {"background": "양자 물질에서 빛과 물질의 상호작용을 극대화하기 위해 광학 공동(cavity)을 활용하는 연구가 활발합니다. 이는 물질 내부의 전자 상호작용을 외부에서 직접 제어할 수 있는 새로운 수단으로 주목받고 있습니다.", "motivation": "외부에서 유도된 광학적 공동 상태가 실제 van der Waals(vdW) 물질 내의 전자들 사이에 인력을 유도하여 상전이 등을 제어할 수 있는지 확인하고자 했습니다.", "result": "테라헤르츠(THz) 공동 내에 갇힌 빛이 튜닝 가능한 vdW 물질에서 전자들 사이에 매개되는 인력을 유도할 수 있음을 실험적으로 증명했습니다.", "implication": "빛을 통해 물질의 근본적인 상호작용을 변조할 수 있음을 의미하며, 이는 광학적으로 유도된 초전도성이나 강자성 등의 새로운 상태를 제어하는 발판이 됩니다.", "novelty": "빛과 물질의 강결합을 통해 단순한 여기를 넘어 실질적인 전자 상호작용의 부호를 변화시키거나 조절했다는 점에서 매우 혁신적입니다.", "unresolved": "이러한 인력 유도가 얼마나 넓은 온도 범위나 물질 종류에서 지속 가능한지, 실제 에너지 효율은 어느 정도인지가 과제로 남아있습니다.", "future_work": "다른 강상관 물질에 적용하여 빛으로 유도된 초전도 상전이 연구가 이어질 것으로 보입니다.", "concepts": [{"term": "공동 양자 전기역학(Cavity QED)", "why_emerged": "빛과 물질 간의 상호작용을 제어하고 극대화하여 새로운 양자 위상을 창출하기 위해 필요합니다.", "origin": "Serge Haroche와 David Wineland 등이 광학 공동 내 원자 제어 연구로 노벨상을 수상하며 확립되었습니다.", "connections": "Floquet 공학 및 빛 유도 위상 제어 연구와 연결됩니다."}, {"term": "van der Waals 물질", "why_emerged": "단일 층 단위로 분리가 가능하고 적층을 통해 새로운 물성을 구현할 수 있는 유연한 물리 플랫폼입니다.", "origin": "2004년 그래핀의 분리 성공 이후 본격적으로 연구되기 시작했습니다.", "connections": "모아레 격자, 토폴로지 물질 설계 등에 활용됩니다."}], "english_summary": ["Demonstrates that terahertz light trapped in a cavity can mediate attractive interactions within a van der Waals material.", "Utilized a novel broadband, sub-wavelength time-domain microscope for real-time observation.", "Provides a pathway for cavity-mediated control of quantum phases in material systems.", "Offers a new experimental paradigm for light-induced manipulation of electronic correlations."]}}, {"title": "In-plane anomalous Hall effect in a low-dimensional system", "journal": "Nature_Materials", "source": "Gemini", "link": "https://www.nature.com/articles/s41563-026-02611-9", "authors": "I-Hsuan Kao, Ravi Kumar Bandapelli, Zhenhong Cui, et al.", "last_authors": "Jyoti Katoch, Simranjeet Singh", "summary": "Nature Materials, Published online: 28 May 2026; doi:10.1038/s41563-026-02611-9 A gate-tunable magnetization-driven in-plane anomalous Hall effect is realized in a low-symmetry heterostructure of TaIrTe4 and layered ferromagnetic insulator Cr2Ge2Te6.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Direct relevance to anomalous Hall effect and van der Waals heterostructures.", "tags": ["anomalous_hall", "heterostructure", "topological"], "image": "https://media.springernature.com/m685/springer-static/image/art%3A10.1038%2Fs41563-026-02611-9/MediaObjects/41563_2026_2611_Fig1_HTML.png", "briefing": {"background": "위상 절연체나 위상 반금속과 같은 위상 물질에서 비정상 홀 효과(Anomalous Hall Effect)는 물질의 위상적 성질과 자성을 이해하는 핵심 지표입니다. 최근에는 이를 평면 내(in-plane)에서 제어하려는 시도가 늘고 있습니다.", "motivation": "낮은 대칭성을 가진 heterostructure를 설계하여 자화 방향에 따른 평면 내 비정상 홀 효과를 게이트 전압으로 제어할 수 있는지 확인하고자 했습니다.", "result": "TaIrTe4와 Cr2Ge2Te6 이종접합 구조에서 게이트 전압을 통해 조절 가능한 자화 주도형 평면 내 비정상 홀 효과를 구현했습니다.", "implication": "위상 물질의 Berry 곡률 분포와 자화 간의 복잡한 상호작용을 게이트로 제어할 수 있음을 보여주며, 이는 차세대 스핀트로닉스 소자 개발에 중요한 기초 자료가 됩니다.", "novelty": "저차원 이종접합에서 비정상 홀 효과의 자유도를 평면 내로 확장하고, 이를 외부 게이트로 제어 가능하다는 점이 중요합니다.", "unresolved": "이 효과가 물질의 국소적 결함에 얼마나 민감하게 반응하는지, 보다 넓은 밴드 구조에서의 Berry 곡률 영향은 무엇인지 명확하지 않습니다.", "future_work": "다른 위상 물질과의 조합을 통한 대칭성 제어 연구 및 소자 최적화가 예상됩니다.", "concepts": [{"term": "비정상 홀 효과(AHE)", "why_emerged": "외부 자기장 없이도 물질의 자화와 Berry 곡률에 의해 전압이 생성되는 현상을 이해하기 위해 필요합니다.", "origin": "Edwin Hall이 처음 발견했으며, 이후 위상적 성질과 결부되어 Karplus와 Luttinger 등에 의해 이론화되었습니다.", "connections": "위상 반금속, 자기적 위상 물질의 핵심 측정 지표입니다."}, {"term": "Berry 곡률(Berry Curvature)", "why_emerged": "운동량 공간에서의 파동함수의 기하학적 위상을 설명하고, 이상 홀 전도도와 같은 수송 현상을 계산하기 위해 도입되었습니다.", "origin": "Michael Berry가 1984년 도입하였습니다.", "connections": "위상적 수송 현상, 비정상 홀 효과, 궤도 자기 모멘트와 직접 연결됩니다."}], "english_summary": ["Realized a gate-tunable, in-plane anomalous Hall effect (AHE) in a van der Waals heterostructure.", "The system consists of the topological material TaIrTe4 and the ferromagnetic insulator Cr2Ge2Te6.", "Demonstrates that magnetization-driven transport properties can be controlled via external electric fields.", "Highlights the potential for manipulating topological electronic states in low-symmetry heterostructures."]}}, {"title": "Probing the quantum metric of 3D topological insulators", "journal": "Nature_Materials", "source": "Gemini", "link": "https://www.nature.com/articles/s41563-026-02617-3", "authors": "Giacomo Sala, Emanuele Longo, Maria Teresa Mercaldo, et al.", "last_authors": "Carmine Ortix, Andrea D. Caviglia", "summary": "Nature Materials, Published online: 22 May 2026; doi:10.1038/s41563-026-02617-3 The quantum metric of a surface Dirac cone is found to contribute to the nonlinear magnetoresistance of thin films of the 3D topological insulator Sb2Te3.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Relevant topological insulator study involving surface Dirac cones.", "tags": ["topological_insulator", "quantum_metric", "Dirac"], "image": "https://media.springernature.com/m685/springer-static/image/art%3A10.1038%2Fs41563-026-02617-3/MediaObjects/41563_2026_2617_Fig1_HTML.png", "briefing": {"background": "위상 절연체(TI)의 표면 상태는 위상적으로 보호된 Dirac 원뿔을 형성하며, 이는 전하 nd superconducting states.", "The relationship between superconducting anisotropy and resistive anisotropy is analyzed theoretically.", "The results offer insights into symmetry breaking in correlated electronic systems."]}}, {"title": "Electron-phonon couplings within density functional theory and beyond: Methods and application to FeSe", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/f3l8-rktd", "authors": "Xingding Li, Zhiyuan Cai, Shixu Liu, et al.", "last_authors": "Xin-Gao Gong, Ji-Hui Yang", "summary": "Author(s): Xingding Li, Zhiyuan Cai, Shixu Liu, Haozhe Li, Yuting Sun, Xin-Gao Gong, and Ji-Hui Yang Semilocal functionals are widely recognized as insufficient for capturing electronic structure of quantum materials due to inadequate treatment of electronic correlations, necessitating beyond-semilocal approaches. However, such beyond-semilocal functionals currently lack a scheme to compute electro… [Phys. Rev. B 113, 184521] Published Thu May 28, 2026", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Electron-phonon coupling calculation in FeSe, highly relevant for understanding ARPES spectra in iron superconductors.", "tags": ["material", "FeSe", "superconductivity", "method"], "image": "", "briefing": {"background": "철 기반 초전도체(Fe-based superconductors)는 전자-포논 결합(EPC)이 초전도 전이 온도와 전자 상태에 미치는 영향이 매우 크지만, 표준 DFT(밀도범함수이론) 근사로는 FeSe와 같은 강상관 전자계 물질의 전자 구조를 정밀하게 묘사하기 어렵습니다.", "motivation": "기존 반-지역적(semilocal) 범함수로는 상관관계가 강한 FeSe의 전자 상태와 그에 따른 포논 결합을 충분히 설명할 수 없어, 이를 넘어서는 고급 범함수 체계에서 EPC를 계산하는 새로운 방법론을 개발하고자 함.", "result": "고급 범함수 수준에서 FeSe의 전자 구조를 반영한 전자-포논 결합 계산을 수행할 수 있는 체계적 스킴을 제안함.", "implication": "향후 FeSe 및 유사 초전도체에서 ARPES 데이터로 관측되는 킨크(kink) 구조나 전자 상태의 밴드 수정을 더욱 정밀한 이론적 모델로 해석할 수 있는 토대를 마련함.", "novelty": "기존 DFT 방법론의 한계를 극복하여 FeSe의 강상관 특성을 더 잘 보존하면서도 전자-포논 결합을 도출했다는 점이 중요함.", "unresolved": "FeSe 내의 네마틱성(nematicity)이나 자기적 변동이 전자-포논 결합과 얽히는 양상을 완벽히 분리해내었는지는 추가 검증이 필요함.", "future_work": "다른 철 기반 초전도체 물질로의 적용 및 초전도  STM/STS로 정밀 관측하여 CDW 갭의 형성 과정을 실증적으로 확인하고자 함.", "result": "CDW 상태에서 관측되는 0 mV 근처의 딥(dip) 구조가 CDW 전이 온도 직후 사라지는 것을 관측하여, 해당 갭이 CDW와 직접 연관됨을 확인함.", "implication": "VSe2의 CDW 상태가 전형적인 금속-절연체 전이의 특성을 반영함을 실증하며, 유사한 전이 금속 화합물 내 CDW 물성 해석의 기준점을 제공함.", "novelty": "STM/STS를 통해 CDW의 온도 의존적인 에너지 갭 발현을 직접 시각화 및 분광학적으로 규명함.", "unresolved": "관측된 갭이 순수하게 전자의 페르미 면 중첩(nesting)에 의한 것인지, 아니면 전자 상관관계에 의한 다체 효과인지에 대해서는 추가 논의가 필요함.", "future_work": "자기장 하에서의 CDW 갭 변화 측정(마그네토-STS)을 통한 스핀-궤도 결합 및 자기적 영향 연구.", "concepts": [{"term": "Incommensurate CDW", "why_emerged": "격자 상수와 정수배 관계가 아닌 주기를 가지는 전하 밀도 변조 현상을 설명하기 위해 등장.", "origin": "Peierls, Fröhlich (1950년대)", "connections": "Peierls 전이, 페르미 면 네스팅(nesting)과 깊은 연관이 있음."}, {"term": "Scanning Tunneling Spectroscopy (STS)", "why_emerged": "물질 표면의 상태 밀도(DOS)를 원자 단위에서 국소적으로 측정하기 위해 개발됨.", "origin": "Binnig, Rohrer (1980년대 초)", "connections": "ARPES와 상보적으로 전자 구조 연구에 필수적으로 사용됨."}], "english_summary": ["STM/STS study investigates the energy gap associated with the incommensurate CDW in 1T-VSe2.", "Observation shows a distinct dip structure near 0 mV in the tunneling spectrum within the CDW state.", "The disappearance of this feature above the transition temperature confirms the CDW-gap correlation.", "Provides direct spectroscopic evidence of the CDW phase evolution in this TMD material."]}}, {"title": "Gate-tunable spin texture in a Dirac-semimetal–ferromagnetic-semiconductor heterostructure", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/rl21-3spb", "authors": "Saurav Islam, Emma Steinebronn, Kaijie Yang, et al.", "last_authors": "Chaoxing Liu, Nitin Samarth", "summary": "Author(s): Saurav Islam, Emma Steinebronn, Kaijie Yang, Bimal Neupane, Juan Chamorro, Tanya Berry, Supriya Ghosh, K. Andre Mkhoyan, Tyrel M. McQueen, Yuanxi Wang, Olle Heinonen, Chaoxing Liu, and Nitin Samarth We use a concerted theory-experiment effort to investigate the formation of chiral real space spin texture when the archetypal Di ini", "link": "http://link.aps.org/doi/10.1103/dh99-3xkn", "authors": "Jeppe Jon Cederholm, Zhian Xu, Yanfeng Guo, et al.", "last_authors": "Andrew T. Boothroyd, Henrik Jacobsen", "summary": "Author(s): Jeppe Jon Cederholm, Zhian Xu, Yanfeng Guo, Martin Ovesen, Thomas Olsen, Kristine M. L. Krighaar, Chrystalla Knekna, Jian Rui Soh, Youngro Lee, Navid Qureshi, Jose Alberto Rodriguez Velamazan, Eric Ressouche, Andrew T. Boothroyd, and Henrik Jacobsen We use spherical neutron polarimetry to determine the ground state magnetic structure of ${\\mathrm{Mn}}_{3}\\mathrm{Sn}$. We find that ${\\mathrm{Mn}}_{3}\\mathrm{Sn}$ adopts an inverse triangular structure with spins parallel to $〈100〉$ (type III) rather than spins parallel to $〈110〉$ (type IV). Densi… [Phys. Rev. B 113, 174437] Published Tue May 26, 2026", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Important neutron scattering study on Mn3Sn, a key material for topological transport.", "tags": ["magnetic", "Mn3Sn", "neutron-scattering"], "image": "", "briefing": {"background": "Mn3Sn은 위상 자성체(magnetic topological material)로, 비공선형(non-collinear) 반강자성 구조 덕분에 큰 비정상 홀 효과(AHE)를 나타내어 spintronics 응용 연구의 핵심 물질입니다.", "motivation": "기존 연구들 사이에서 Mn3Sn의 기저 상태 자기 구조에 대해 논란이 있어 왔으며, 특히 스핀의 정확한 방향을 결정하는 것이 위상 물성을 해석하는 데 필수적이었습니다.", "result": "구형 중성자 편극 측정(spherical neutron polarimetry)을 통해 Mn3Sn이 기존에 논의되던 type IV 구조가 아닌, 스핀이 방향을 향하는 type III 역삼각형(inverse triangular) 구조를 가짐을 규명했습니다.", "implication": "자기 구조의 확정은 Mn3Sn에서 관찰되는 Berry 곡률 기반 수송 현상을 이론적으로 모델링하는 데 있어 중요한 제약 조건이자 출발점이 됩니다.", "novelty": "최첨단 중성자 산란 기술을 활용해 위상 수송 현상의 핵심인 자기 질서의 세부 사항을 명확히 함으로써, 자기 위상 물질 연구의 정밀도를 한 단계 높였습니다.", "unresolved": "이 구조가 온도의 변화나 국소적인 결함에 따라 어떻게 미세하게 재구성되는지에 대한 정보는 추가적인 연구가 필요합니다.", "future_work": "확정된 구조를 바탕으로 한 밀도범함수 이론(DFT) 계산과 더불어, 외부 자기장 하에서의 자기 도메인 거동에 관한 연구가 이어질 것으로 보입니다.", "concepts": [{"term": "구형 중성자 편극 측정", "why_emerged": "자기 모멘트의 벡터 방향을 3차원으로 정밀하게 분해하기 위해 필요합니다.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "중성자 회절, 자기 구조 분석"}, ty.", "tags": ["topological-insulator", "heterostructure", "magnetism"], "image": "", "briefing": {"background": "위상 절연체(TI) 표면 상태와 자성 물질을 결합하는 자기 근접 효과(magnetic proximity effect)는 양자 이상 홀 효과 등 위상 물성을 제어하는 핵심 기술입니다.", "motivation": "복합 이종 구조(heterostructure)에서 자성 근접 효과가 어떻게 위상 절연체의 수송 특성에 영향을 미치는지, 특히 다층 구조에서의 계면 효과를 확인하고자 했습니다.", "result": "Cr2Ge2Te6/(Bi,Sb)2Te3/Eu3Fe5O12 이종 구조를 제작하여, 위상 절연체 양측의 서로 다른 자성 물질로부터 유도된 페리자성체와 유사한 계면 자기 특성을 확인했습니다.", "implication": "여러 자성층을 적층함으로써 위상 절연체의 전자 구조를 정밀하게 튜닝할 수 있는 설계 전략을 제시합니다.", "novelty": "단순 이중층을 넘어선 3층 이상의 복합 구조를 통해 자성 근접 효과를 능동적으로 활용하는 설계 가능성을 보여주었습니다.", "unresolved": "각 계면에서의 스핀 전하 변환 효율과 밴드 갭 열림의 구체적인 크기에 대해서는 추가적인 ARPES 검증이 필요합니다.", "future_work": "이러한 이종 구조에서의 anomalous Hall 효과 정밀 분석 및 자성 도메인 관측 연구가 이어질 것으로 보입니다.", "concepts": [{"term": "자기 근접 효과", "why_emerged": "비자성 물질인 위상 절연체에 자성을 부여하여 위상학적 변화를 유도하기 위해 필요합니다.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "위상 절연체, 양자 이상 홀 효과, spintronics"}, {"term": "페리자성체 계면", "why_emerged": "강한 자기적 질서와 위상 절연체의 표면 상태 사이의 상호작용을 제어하기 위한 구조적 환경으로 필요합니다.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "자기 이종 구조, 스핀-궤도 결합"}], "english_summary": ["Magnetic topological insulator heterostructures are essential for controlling topological transport.", "The authors investigated Cr2Ge2Te6/(Bi,Sb)2Te3/Eu3Fe5O12 trilayers.", "Proximity-induced ferrimagnetic-like interface properties were identified via magnetotransport.", "This approach demonstrates a strategy to engineer topological states using multiple magnetic interfaces."]}}, {"title": "Quantum anomalous Hall effect in chiral semimetals", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/r9sx-whxr", "authors": "Peng-Yi Liu, Yu-Hao Wan, Qing-Feng Sun", "last_authors": "Yu-Hao Wan, Qing-Feng Sun", "summary": "Author(s): Peng-Yi Liu, Yu-Hao Wan, and Qing-Feng Sun The quantum anomalous Hall (QAH) effect is conventionally understood to exist only in Chern insulators, while a recent study has shown that ferromagnetic metals can also host the QAH effect. Between insulators and metals, we demonstrate that QAH can persist even in a chiral semimetal, where conducti… [Phys. Rev. B 113, 205425] Published Tue May 26, 2026", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Relevant to topological semimetals and anomalous Hall physics of interest.", "tags": ["topological", "anomalousHall", "semimetals"], "image": "", "briefing": {"background": "양자 비정상 홀 효과(QAH)는 주로 밴드 절연체인 체른 절연체에서만 나타난다고 알려져 왔으며, 위상학적 비자명성을 가진 상태에서 양자화된 홀 전도도를 구현하는 것을 목표로 합니다.", "motivation": "기존에는 절연체나 강자성 금속으로 국한되었던 QAH 효과가 카이럴 반금속(chiral semimetal)이라는 더 넓은 위상학적 물질군에서도 존재할 수 있는지 이론적으로 확인하고자 합니다.", "result": "카이럴 반금속 시스템에서도 QAH 효과가 지속될 수 있음을 증명하였으며, 이는 물질의 위상학적 특성이 금속성과 절연성 사이의 경계에서도 강건하게 유지됨을 시사합니다.", "implication": "위상학적 물질 설계의 범위를 카이럴 반금속까지 확장하여, 비전통적인 물질에서의 위상학적 전송 현상 연구에 새로운 가능성을 제시합니다.", "novelty": "기존 QAH 연구가 Chern insulator에 집중된 반면, 반금속 상태에서의 구현 가능성을 제시하여 topological semimetal에 관심 있는 독자에게 중요한 이론적 기반을 제공합니다.", "unresolved": "실제 실험에서 이러한 효과를 관찰하기 위한 최적의 물질 후보군과 비정상적인 전송 현상을 압도하는 산란 효과의 억제 방법이 과제로 남아 있습니다.", "future_work": "실제 카이럴 반금속 후보 물질을 대상으로 한 전송 측정 실험과, 보다 복잡한 전자 구조 하에서의 QAH 안정성 계산이 필요합니다.", "concepts": [{"term": "Quantum Anomalous Hall Effect", "why_emerged": "외부 자기장 없이 물질 내부의 자기 모멘트와 스핀-궤도 결합에 의해 양자화된 홀 전도도를 구현하기 위해 필요.", "origin": "Haldane(1988)의 이론적 모델 제시 이후, 2013년 Xue Qikun 연구팀 등에 의해 실험적으로 최초 관찰됨.", "connections": "Chern insulator, Topological Insulator, Anomalous Hall Effect."}, {"term": "Chiral Semimetal", "why_emerged": "Weyl 반금속 등에서 위상학적 노드(node)와 카이럴리티가 전송 특성에 미치는 영향을 연구하기 위해 필요.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "Weyl semimetals, Berry curvature, Chiral anomaly."}], "english_summary": ["Demonstrates that the Quantum Anomalous Hall (QAH) effect is not limited to Chern insulators or ferromagnetic metals.", "Establishes that chiral semimetals can host robust QAH effects.", "Expands the theoretical scope of topological transport phenomena in semimetallic systems."]}}, {"title": "Self-consistent Coulomb interactions from constrained dynamical mean-field theory", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/yb1w-8cxm", "authors": "Antik Sihi, Subhasish Mandal, Kristjan Haule", "last_authors": "Subhasish Mandal, Kristjan Haule", "summary": "Author(s): Antik Sihi, Subhasish Mandal, and Kristjan Haule Here, the authors develop constrained dynamical mean-field theory, a self-consistent first-principles approach for determining screened Coulomb interactions in correlated materials. The method incorporates local vertex corrections within the same many-body framework used to compute electronic spectra, yielding interaction strengths that enable excellent agreement with photoemission experiments across Mott insulators, correlated metals, altermagnets, and unconventional superconductors. [Phys. Rev. B 113, L201116] Published Fri May 29, 2026", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "DMFT development benchmarked against photoemission for correlated metals and altermagnets.", "tags": ["method", "photoemission", "DMFT", "altermagnetism"], "image": "", "briefing": {"background": "강상관 전자계 물질에서 전자 간의 쿨롱 상호작용은 물질의 기저 상태(Mott 절연체, 초전도체 등)를 결정하는 핵심 요소이며, 이를 제일원리적으로 계산하는 것은 매우 어렵습니다.", "motivation": "기존 DMFT 계산의 정확도를 높이기 위해, 전자 스펙트럼 계산과 동시에 스크리닝된 쿨롱 상호작용을 자가 정합적으로 결정하는 새로운 방법론 개발이 필요했습니다.", "result": "Constrained DMFT(cDMFT) 프레임워크 내에서 정점 보정(vertex correction)을 도입하여, 강상관 금속, Altermagnet, 초전도체 등 다양한 물질의 광전자 분광(PES) 결과와 매우 일치하는 값을 도출했습니다.", "implication": "알터마그네틱(altermagnetic) 물질 및 비전통적 초전도체 연구에서 전자 구조를 훨씬 더 정확하게 예측할 수 있는 도구를 제공합니다.", "novelty": "기존 상호작용 매개변수를 실험값에 의존하던 방식에서 벗어나, 제일원리 계산만으로 PES 데이터를 성공적으로 모사할 수 있게 된 점이 독보적입니다.", "unresolved": "계산 비용이 매우 높을 것으로 예상되며, 훨씬 더 복잡한 격자 구조를 가진 대규모 시스템으로의 확장성이 검증되어야 합니다.", "future_work": "실제 kagome 격자 물질(AV3Sb5 등)이나 복잡한 전이 금속 화합물에 적용하여 전자 상관관계 해석의 정확도를 높이는 연구가 예상됩니다.", "concepts": [{"term": "Constrained DMFT", "why_emerged": "DMFT 내에서 물질 의존적인 쿨롱 상호작용(U) xfoliated sheets of chromium trichloride (CrCl 3 ), where magnon interactions are strong, and develop a technique to measure the collective magnon dynamics though nearby nitrogen-vacancy centers in diamond. Thermal magnetic fluctuations generated by monolayer CrCl 3 increase upon decreasing temperature; this anomalous trend may be a consequence of the damping rate of a low-energy magnon sound mode that sharpens as magnon interactions increase with increasing temperature. By measuring the magnetic fluctuations emitted by thin multilayer CrCl 3 in the presence of a variable-frequency drive field, we obtain spectroscopic evidence for this two-dimensional magnon sound mode.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Experimental study of magnon hydrodynamics in a 2D ferromagnet, relevant to quantum magnetism.", "tags": ["magnetism", "magnon", "2Dmaterials", "ferromagnet", "quantummaterials"], "image": "", "briefing": {"background": "강상관 전자계에서 입자 간의 강한 상호작용은 개별 입자의 거동을 넘어선 집단적 거동을 유도합니다. 자성체 내부의 스핀파인 '마그논' 역시 입자 간 충돌이 빈번한 유체역학적(hydrodynamic) 체제에서 독특한 집단 모드로 존재할 수 있다는 가설이 제기되어 왔습니다.", "motivation": "원자층 수준으로 얇은 CrCl3 자성체에서 마그논 간의 강한 상호작용이 일어날 때, 마그논이 유체처럼 행동하는지(마그논 유체역학) 실험적으로 증명하고자 했습니다.", "result": "질소-공공(NV) 센터 현미경을 이용해 CrCl3에서 마그논 소리 모드(magnon sound mode)에 해당하는 저에너지 집단 모드를 관측하였습니다.", "implication": "마그논을 단순한 준입자가 아닌 유체역학적 관점에서 제어할 수 있음을 보였으며, 이는 에너지 소산이 적은 스핀 기반 정보 처리 소자 개발에 활용 가능합니다.", "novelty": "2차원 물질에서 마그논 유체역학적 거동을 실험적으로 직접 포착한 것은 매우 드문 사례로, 저차원 자성 연구의 새로운 돌파구가 될 수 있습니다.", "unresolved": "온도가 올라감에 따라 마그논 상호작용이 강화되는 구체적인 미시적 메커니즘과 마그논 유체에서의 점성 등 수송 계수에 대한 상세 측정은 추가 연구가 필요합니다.", "future_work": "NV 센터 기술을 활용하여 다양한 2D 자성체에서의 스핀 유체역학 거동 탐색 및 외부 필드 제어를 통한 마그논 소리 모드의 인위적 조절 연구가 예상됩니다.", "concepts": [{"term": "Magnon Hydrodynamics", "why_emerged": "마그논 간 상호작용이 산란보다 빈번할 때 나타나는 집단 거동을 기술하기 위해 필요함.", "origin": "최근 이론적 예측 (초록 정보만으로는 특정하기 어려움).", "connections": "전자 유체역학, 스핀 수송, 강상관 자성."}, {"term": "NV Center in Diamond", "why_emerged": "나노미터 해상도에서 극도로 미세한 자기장 및 um materials on demand.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Theory of light-matter interaction inducing topological phases (Weyl, TI) in real material (HgTe), fits Floquet interest.", "tags": ["theory", "topologicalmaterials", "HgTe", "light-matterinteraction", "Floquetengineering", "QED-DFT"], "image": "", "briefing": {"background": "물질을 강한 빛(광자장) 속에 두면 빛과 물질의 결합(light-matter coupling)으로 인해 물질의 전자 상태가 근본적으로 재구성됩니다. 이 과정을 통해 원래 위상학적 성질이 없는 물질을 위상 물질로 바꾸거나, 기존의 위상 상태를 제어하는 Floquet 엔지니어링 연구가 활발합니다.", "motivation": "레이저 펄스 등 비평형 상태를 만드는 대신, 광학 캐비티 내의 정적 진공 요동(vacuum fluctuations)을 활용하여 HgTe와 같은 물질에 위상학적 상태를 안정적으로 유도하고자 했습니다.", "result": "QED-DFT 계산을 통해 광학 캐비티 안의 광자장이 HgTe의 대칭성을 깨뜨려 바일(Weyl) 반금속, 절점선(nodal-line) 위상 물질, 위상 절연체 상태 등을 유도할 수 있음을 증명했습니다.", "implication": "광자 환경(cavity design)을 바꾸는 것만으로 물질의 위상 상태를 온디맨드로 엔지니어링할 수 있는 '구조 기반 양자 소자'의 가능성을 제시합니다.", "novelty": "기존의 동적인 레이저 구동 방식과 달리 광학 캐비티를 이용한 정적인 '결합 상태(dressed states)'를 통해 위상 물질을 제어했다는 점이 핵심입니다.", "unresolved": "이러한 정적인 광자장 결합이 실제로 물질의 구조적 안정성을 얼마나 보장하는지, 실험적으로 구현할 때 요구되는 극저온 및 나노 광학 공정의 난이도가 과제입니다.", "future_work": "실제 광학 캐비티 안에 HgTe를 배치하여 전기 전송 측정이나 ARPES를 통한 위상 밴드 구조의 변화를 실시간으로 확인하는 실험이 필요합니다.", "concepts": [{"term": "Floquet Engineering", "why_emerged": "주기적인 빛의 자극을 통해 물질의 유효 해밀토니안을 재구성하여 새로운 양자 상태를 창출하기 위해 필요함.", "origin": "이론물리학에서 오랜 기원을 가지며, 최근 고체물리 분야에서 광범위하게 적용됨.", "connections": "비평형 양자 통계, 위상 절연체, 레이저 분광학."}, {"term": "QED-DFT", "why_emerged": "양자 전기역학적 효과(광자-전자 결합)를 포함한 상태의 물질 특성을 정밀하게 계산하기 위해 고안됨.", "origin": "최근 계산 물리학 분야의 발전된 방법론.", "connections": "DFT(밀도범함수이론), 양자 전기역학, light-matter interaction."}], "english_summary": ["Theoretical study on inducing topological phases in bulk HgTe using photonic structures.", "Utilizes QED-DFT to demonstrate that photon field-matter hybridization drives topological transitions.", "Proposes an alternative to laser-driven Floquet engineering by using steady-state vacuum fluctuations.", "Enables on-demand creation of Weyl, nodal-line, and topological insulator phases."]}}, {"title": "Spin glass in quantum paraelectric KTaO 3 : Supercritical CO 2 -induced monoclinic phase", "journal": "Science_Advances", "source": "Gemini", "link": "https://doi.org/10.1126/sciadv.aed5419", "authors": "Yuning Liang, Qun Xu", "last_authors": "Yuning Liang, Qun Xu", "summary": "Inducing magnetism in d 0 nonmagnetic oxides is a central challenge in condensed matter physics and a bottleneck for developing advanced spintronic devices. KTaO 3 epitomizes this challenge: Despite having strong spin-orbit coupling, its functionality is hindered by a stable nonmagnetic cubic phase. Here, we report the unlocking of magnetism in KTaO 3 via supercritical carbon dioxide (SC CO 2 ), which induces a stable monoclinic phase that has, until now, remained undiscovered. Experimentally, we demonstrate that this monoclinic phase has spontaneous magnetic moments, driving the system into a spin-glass state. Monte Carlo simulations pinpoint the origin of this glassy behavior to interfacial phase frustration, arising from the coupling between ferromagnetic facets and an antiferromagnetic bulk. To our knowledge, this work not only presents the first observation of a magnetic phase in KTaO 3 but also reveals a peculiar phenomenon of SC CO 2 –induced interfacial phase frustration, establishing a versatile strategy for engineering complex magnetic states in quantum paraelectric.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Inducing magnetism and spin glass in a quantum paraelectric oxide, relevant for quantum materials.", "tags": ["magnetism", "quantumparaelectric", "spinglass", "functionalmaterials", "oxides"], "image": "", "briefing": {"background": "d0 산화물은 자성이 없어 스핀트로닉스 응용에 한계가 있는데, 이를 극복하기 위해 결정 구조를 변형하거나 결함을 도입하여 자성을 유도하는 연구가 활발합니다.", "motivation": "강한 스핀-궤도 결합(SOC)을 가진 KTaO3가 입방정계 비자성 상태로 고정되어 있어, 이를 자성 상태로 전환할 수 있는 새로운 상을 찾고자 했습니다.", "result": "초임계 이산화탄소(SC-CO2) 처리를 통해 새로운 단사정계 상을 유도하였으며, 이 상에서 강자성 면과 반강자성 벌크 간의 상 충돌(frustration)에 의한 스핀 글래스 상태를 확인했습니다.", "implication": "초임계 유체를 사용하여 물질의 상을 정밀하게 제어하고 새로운 자기적 상태를 엔지니어링할 수 있는 범용적인 전략을 제시했습니다.", "novelty": "기존에 존재하지 않던 KTaO3의 단사정계 상을 발견하고, 외부 유체를 이용해 양자 상유전체에 자성을 발현시킨 최초의 사례입니다.", "unresolved": "초임계 이산화탄소 처리 과정에서 발생하는 미세한 원자단위의 격자 변형이나 산소 공공의 정밀한 역할은 아직 명확히 규명되지 않았습니다.", "future_work": "유도된 단사정계 상의 안정성 평가 및 스핀 글래스 상태에서의 수송 현상 측정, 타 양자 물질로의 적용 가능성 탐구가 필요합니다.", "concepts": [{"term": "양자 상유전체 (Quantum paraelectric)", "why_emerged": "양자 요동으로 인해 강유전 상전이가 억제된 물질을 연구하기 위해 필요합니다.", "origin": "Barrett (1952) 등에 의해 개념화되었습니다.", "connections": "SrTiO3, KTaO3와 같은 페로브스카이트 산화물 연구의 핵심입니다."}, {"term": "스핀 글래스 (Spin glass)", "why_emerged": "자기 모멘트들이 무질서하게 배치되어 상호작용이 경쟁하는 시스템의 복잡한 자기적 정렬을 설명하기 위해 필요합니다.", "origin": "Edwards와 Anderson (1975)이 통계물리적 모델을 제안했습니다.", "connections": "상 충돌(frustration) 개념과 직결되며 비균질한 자기 정렬 연구의 기초가 됩니다."}], "english_summary": ["KTaO3 is a d0 quantum paraelectric material typically lacking magnetism.", "Supercritical CO2 treatment induces a previously unknown monoclinic phase.", "The phase transition creates interfacial frustration between ferromagnetic and antiferromagnetic regions.", "Experimental results confirm a spin-glass state, providing a new pathway for engineering magnetism in oxides."]}}, {"title": "Author Correction: Hidden states and dynamics of fractional fillings in twisted MoTe2 bilayers", "journal": "Nature", "source": "Gemini", "link": "https://www.nature.com/articles/s41586-026-10717-y", "authors": "Yiping Wang, Jeongheon Choe, Eric Anderson, et al.", "last_authors": "Xiaodong Xu, X.-Y. Zhu", "summary": "Nature, Published online: 29 May 2026; doi:10.1038/s41586-026-10717-y Author Correction: Hidden states and dynamics of fractional fillings in twisted MoTe 2 bilayers", "tier": "B_IMPORTANT_CONDMAT", "score": "7", "reason": "Correction to a significant study on fractional states in twisted moire bilayers, a key user interest.", "tags": ["twistedbilayer", "MoTe2", "moire"], "image": "https://pubads.g.doubleclick.net/gampad/ad?i  A. Ritchie, and Sanjeev Kumar The authors show here how electrostatic coupling and spin physics reshape the 7/3 fractional quantum Hall state in an uncoupled GaAs bilayer system. Gate tuning balances an incompressible integer state ( ν =1) and a fragile fractional composite-fermion state ( ν =4/3), producing a double-minimum structure in longitudinal resistance within a single 7/3 Hall plateau. Tilt-angle measurements reveal that the evolution and merger of two minima are controlled by interlayer charge redistribution, composite-fermion spin polarization, and electron interactions. [Phys. Rev. B 113, 205433] Published Thu May 28, 2026", "tier": "B_IMPORTANT_CONDMAT", "score": "7", "reason": "Important experimental observation of fractional quantum Hall physics.", "tags": ["experiment", "quantumHall"], "image": "", "briefing": {"background": "GaAs 이중 양자우물 구조는 전하 및 스핀 간의 상호작용을 정밀하게 제어할 수 있어 분수 양자홀 효과의 심층 연구에 중요한 플랫폼입니다.", "motivation": "nu=7/3 분수 양자홀 상태가 이중 우물 구조의 정전기적 결합 및 스핀 물리와 어떻게 결합하여 나타나는지 규명하고자 했습니다.", "result": "누설되는 전하 재분배와 복합 페르미온 스핀 편극에 의해 7/3 홀 plateau 내에서 이중 최소 구조가 나타남을 확인했습니다.", "implication": "분수 양자홀 상태가 단순한 전하 계층을 넘어 스핀과 층간 결합의 복합적 결과물임을 보여주며, 양자 상태 제어의 단초를 제공합니다.", "novelty": "단일 plateau 내에서 정전기적 게이트 튜닝을 통해 두 최소점이 병합되는 과정을 정밀하게 추적했습니다.", "unresolved": "복합 페르미온의 정확한 스핀 구조 및 7/3 상태에서의 층간 결합 강도에 따른 위상적 안정성 문제.", "future_work": "더 낮은 온도에서의 틸트 각도 의존성 측정 및 더 복잡한 이중 우물 시스템으로의 확장.", "concepts": [{"term": "분수 양자홀 효과 (FQHE)", "why_emerged": "강한 자기장 하에서 전자-전자 상호작용으로 발생하는 새로운 준입자 상태를 설명하기 위해 필요합니다.", "origin": "Tsui, Stormer, Laughlin (1982)에 의해 발견 및 이론화되었습니다.", "connections": "토폴로지적 위상, 애니온, 양자 정보 저장 연구와 연결됩니다."}, {"term": "복합 페르미온 (Composite Fermion)", "why_emerged": "분수 양자홀 상태를 정수 양자홀 효과의 관점에서 해석하기 위해 도입되었습니다.", "origin": "Jain (1989)에 의해 제안되었습니다.", "connections": "Chern-Simons 이론 및 분수 양자홀 현상을 이해하는 표준 이론입니다."}], "english_summary": ["Investigates the 7/3 fractional quantum Hall state in GaAs double quantum wells.", "Electrostatic coupling and spin physics crea
