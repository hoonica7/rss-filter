위상상을 탐색하기 위해 연구됩니다.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "AV3Sb5, Frustrated magnetism"}, {"term": "Vison", "why_emerged": "Z2 위상 질서에서 나타나는 소용돌이 형태의 준입자(excitation)를 설명하기 위해 도입되었습니다.", "origin": "T. Senthil, M.P.A. Fisher (2000)", "connections": "Z2 gauge theory, Fractionalization"}, {"term": "Hidden variables", "why_emerged": "직접 관찰 가능한 변수 외에 시스템의 물성을 결정하는 하위 자유도를 정의하기 위해 사용됩니다.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "Emergent degrees of freedom, Effective field theory"}], "english_summary": ["Proposes a hidden Z2 topological order in bilayer kagome antiferromagnets.", "Uses a mapping of spin dimer states to pseudospin variables to derive an effective Balents-Fisher-Girvin model.", "Predicts that topological anyons (visons) can be observed in specific symmetry-selected experimental channels.", "Suggests a new pathway for identifying elusive topological states disguised within hidden internal degrees of freedom."]}}, {"title": "Large superconducting diode effect indicates nonuniform triplet pairing in UTe2", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2610.36332", "authors": "Zheyu Wu, Daniel Shaffer, Dmitry V. Chichinadze, et al.", "last_authors": "Alex Levchenko, Alexander G. Eaton", "summary": "The superconducting diode effect (SDE) is characterized by unequal critical current magnitudes for opposite-polarity current flow, owing to broken spatial-inversion and time-reversal symmetries. For a superconducting pair wavefunction to spontaneously break inversion symmetry implies the formation of Cooper pairs with nonzero momentum, yielding a nonuniform superconducting state. For singlet superconductors, the formation of such a (FFLO) state has long been understood to provide an escape from high field Pauli pair-breaking -- how and why such an effect might occur for equal spin pairing is an open question. Here we report the observation of a large SDE in bulk specimens of the three-dimensional heavy-fermion triplet superconductor UTe$_2$, with a peak diode efficiency of 33% at the high magnetic field strength of 33.6 T, representing the highest-field observation of the SDE to date. Crucially, this nonreciprocal transport is strictly confined to a narrow field regime where superconductivity coexists with a field-induced spin-polarized state near a first-order metamagnetic phase boundary. The absence of the SDE away from this slender phase-intersection argues strongly against purely extrinsic vortex pinning asymmetries. Instead, our findings indicate spontaneous inversion symmetry breaking accompanied by finite-momentum Cooper pairing. We model this behavior using a phenomenological Ginzburg-Landau theory, demonstrating that the intertwining of magnetic and triplet superconducting orders can stabilize an odd-parity FFLO state.", "tier": "B_IMPORTANT_CONDMAT", "score": "9", "reason": "Observation of large superconducting diode effect in the heavy-fermion triplet superconductor UTe2.", "tags": ["UTe2", "heavyfermion", "superconductivity", "transport"], "image": "https://arxiv.org/html/2610.36332v2/MainFig1_illustration_note.png", "briefing": {"background": "슈퍼컨덕팅 다이오드 효과(SDE)는 순방향과 역방향의 임계 전류가 다르게 나타나는 현상으로, 공간 반전 대칭성과 시간 반전 대칭성이 동시에 깨져야 발생합니다. 최근 UTe2는 강력한 스핀-트리플릿 초전도체 후보 물질로 주목받고 있습니다.", "motivation": "UTe2의 고자기장 초전도 상태에서 대칭성 깨짐의 양상을 확인하고, 비균일 초전도 상태(FFLO 등)의 존재 가능성을 실험적으로 검증하고자 했습니다.", "result": "33.6T의 매우 높은 자기장 영역에서 최대 33% 효율의 거대한 SDE를 관측했습니다. 이 효과는 초전도와 자기 유도 스핀 편극 상태가 공존하는 좁은 영역에서만 나타났으며, 이는 단순한 소용돌이 핀닝(vortex pinning) 효과가 아닌 자발적인 반전 대칭성 깨짐과 유한 운동량 쿠퍼 쌍(finite-momentum pairing) 형성을 시사합니다.", "implication": "UTe2의 고자기장 초전도 상태가 홀수 패리티(odd-parity) FFLO 상태일 가능성을 강력하게 지지하며, 자기 질서와 트리플릿 초전도가 얽혀 있음을 보여줍니다.", "novelty": "UTe2에서 거대한 SDE를 발견하고 이를 트리플릿 초전도와 연관 지어 해석한 점이 중요합니다. 사용자의 관심사인 트리플릿 초전도, 무거운 페르미온(heavy fermion), 고자기장 물성에 정확히 부합하는 결과입니다.", "unresolved": "SDE가 나타나는 정확한 미시적 메커니즘과 메타자성(metamagnetic) 전이 경계에서의 스핀 상태에 대한 더 깊은 이해가 필요합니다.", "future_work": "유한 운동량 쿠퍼 쌍을 직접 확인하기 위한 고자기장 주사 터널링 현미경(STM) 실험이나 공간적으로 변조된 갭 구조 측정 등이 필요할 것으로 보입니다.", "concepts": [{"term": "Superconducting Diode Effect (SDE)", "why_emerged": "비가역적인 초전도 전류 수송을 통해 차세대 초전도 소자를 개발하려는 목적으로 연구됩니다.", "origin": "Teruo Ono et al. (2020, Nb/V/Ta superlattice)", "connections": "Non-reciprocal transport, Inversion symmetry breaking"}, {"term": "Triplet Pairing", "why_emerged": "스핀이 평행한 전자 쌍을 형성하여 강한 자기장에서도 초전도를 유지하는 상태를 설명하기 위해 필요합니다.", "origin": "Balian, Werthamer (1963) / He-3 연구에서 발전", "connections": "UTe2, p-wave superconductivity, Topological superconductivity"}, {"term": "FFLO state", "why_emerged": "강한 자기장 하에서 쿠퍼 쌍이 유한한 운동량을 가져 초전도 질서 파라미터가 공간적으로 진동하는 상태를 설명하기 위해 제안되었습니다.", "origin": "Fulde, Ferrell (1964) / Larkin, Ovchinnikov (1964)", "connections": "Finite-momentum pairing, High-field superconductivity"}, {"term": "Heavy Fermion", "why_emerged": "f-전자와 전도 전자 간의 강한 혼성으로 인해 유효 질량이 매우 무거워지는 현상을 설명하기 위해 도입되었습니다.", "origin": "K. Andres, J.E. Graebner, H.R. Ott (1975)", "connections": "Kondo effect, Strong correlation, UTe2"}], "english_summary": ["Observed a large superconducting diode effect (33% efficiency) in bulk UTe2 at high magnetic fields (33.6 T).", "The effect is localized near the metamagnetic phase boundary where superconductivity and spin polarization coexist.", "The results suggest spontaneous inversion symmetry breaking and the formation of a finite-momentum (FFLO) state.", "Provides evidence for an unconventional odd-parity triplet superconducting state intertwined with magnetic order."]}}, {"title": "RIXS study of strain-tuned coupled valence and spin-state transition in epitaxial (Pr0.85Y0.15)0.7Ca0.3CoO3 films", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2611.00540", "authors": "Yiu-Fung Chiu, Jaewon Choi, Nileena Nandakumaran, et al.", "last_authors": "Ke-Jin Zhou, Stefano Agrestini", "summary": "Strain-tuned $(\\mathrm{Pr}_{0.85}\\mathrm{Y}_{0.15})_{0.7}\\mathrm{Ca}_{0.3}\\mathrm{CoO}_{3}$ thin films provide a model system for controlling coupled valence, spin-state, structural and metal-insulator transitions (VSSTs) in perovskite cobaltite materials. Here, we use Co $L_{2,3}$ and Pr $M_{4,5}$ X-ray Absorption Spectroscopy (XAS), along with Co $L_{3}$ edge Resonant Inelastic X-ray Scattering (RIXS), to probe the local electronic structure across the strain-controlled VSST in epitaxial (Pr,Y,Ca)CoO$_{3}$ thin films. In compressively strained films on YAlO$_{3}$ (YAO) substrates, cooling through the transition produces Pr$^{4+}$-like spectral weight, suppresses Co$^{4+}$-like character, and favors predominantly low-spin Co$^{3+}$. The changes at the Pr and Co edges are quantitatively consistent with a reduction of approximately 0.15 holes per Co in the Co--O network. By contrast, tensile-strained thin films on La$_{0.18}$Sr$_{0.82}$Al$_{0.59}$Ta$_{0.41}$O$_{3}$ (LSAT) substrates have nearly temperature-independent spectra. Multiplet calculations reproduce the principal XAS lineshapes and local $dd$ excitations at high energy loss. Additionally, low-energy RIXS intensity recovered above the transition is consistent with a combination of Co$^{4+}$-like local excitations and a broader particle--hole continuum associated with the metallic phase. These results provide element-resolved evidence for charge compensation between the Pr and Co--O sublattices and support cooperative coupling among charge-transfer, spin-state, and lattice structure at the strain-controlled VSST.", "tier": "B_IMPORTANT_CONDMAT", "score": "9", "reason": "Experimental RIXS study on a strongly correlated perovskite cobaltite, directly uses a key technique.; demoted from A: broad CM, not direct user/project hit", "tags": ["RIXS", "stronglycorrelated", "perovskite", "spectroscopy"], "image": "https://arxiv.org/html/2611.00540v1/Fig1.png", "briefing": {"background": "페로브스카이트 코발트 산화물은 스핀 상태, 원자가, 결정 구조 및 금속-절연체 전이(VSST)가 복합적으로 얽힌 흥미로운 물성을 보이며, 특히 변형(strain)을 통해 이를 제어하려는 시도가 활발합니다.", "motivation": "에피택셜하게 성장된 (Pr,Y)CaCoO3 박막에서 변형에 따라 유도되는 원자가 및 스핀 상태 전이의 미시적 메커니즘과 Pr 및 Co 부격자 간의 전하 보상 과정을 원소별로 명확히 규명하고자 하였습니다.", "result": "RIXS와 XAS 분석을 통해 압축 변형된 박막에서 냉각 시 Pr4+가 형성되고 Co4+ 성분이 억제되며 저스핀 Co3+ 상태가 우세해짐을 확인했습니다. 이는 Co-O 네트워크에서 Co당 약 0.15개의 홀이 감소하는 것과 일치하며, 인장 변형 박막에서는 이러한 변화가 거의 나타나지 않음을 보였습니다.", "implication": "Pr 부격자와 Co-O 부격자 사이의 전하 이동이 VSST의 핵심이며, 전하 이동, 스핀 상태, 격자 구조가 협동적으로 결합되어 있음을 입증했습니다.", "novelty": "RIXS 기술을 사용하여 Co와 Pr의 전자 구조 변화를 각각 분리하여 측정함으로써, 복합적인 상전이 과정에서 각 원소의 구체적인 기여도를 정량적으로 제시했다는 점이 독자의 RIXS 및 강상관 전자계 관심사와 잘 맞습니다.", "unresolved": "전이 과정에서의 동역학적 특성이나 금속상에서 관찰된 입자-구멍 연속체(particle-hole continuum)의 상세한 기여 분리에 대한 추가 연구가 필요할 수 있습니다.", "future_work": "다양한 온도 및 도핑 조건에서의 시간 분해 RIXS 실험이나 이론적 계산을 통한 전하 이동 경로의 정밀화가 기대됩니다.", "concepts": [{"term": "RIXS (Resonant Inelastic X-ray Scattering)", "why_emerged": "고체 내의 전하, 스핀, 궤도, 격자 여기를 에너지와 운동량 분해능을 가지고 동시에 관찰하기 위해 개발되었습니다.", "origin": "초록 정보만으로는 특정하기 어려움 (1970년대 중반 개념 정립 후 3세대 방사광 가속기와 함께 발전)", "connections": "ARPES, 중성자 산란, X-선 흡수 분광법(XAS)"}, {"term": "VSST (Valence and Spin-State Transition)", "why_emerged": "코발트 화합물에서 온도나 압력에 따라 원자가와 스핀 상태가 동시에 변하는 현상을 설명하기 위해 제안되었습니다.", "origin": "초록 정보만으로는 특정하기 어려움 (코발트 산화물 연구 분야에서 확립됨)", "connections": "금속-절연체 전이 (MIT), 전하 이동 (Charge Transfer)"}, {"term": "Spin State (High-Spin vs Low-Spin)", "why_emerged": "결정장 이론 내에서 d-전자의 전자 간 척력과 결정장 분리 에너지 사이의 경쟁을 설명하기 위해 도입되었습니다.", "origin": "Bethe, Van Vleck (결정장 이론)", "connections": "Hund의 법칙, 결정장 이론, 자기적 상전이"}], "english_summary": ["RIXS and XAS study on strain-tuned (Pr,Y,Ca)CoO3 epitaxial films reveals element-specific electronic changes across VSST.", "Compressive strain induces Pr4+ formation and favors low-spin Co3+ states, indicating a 0.15 hole reduction per Co.", "Results provide quantitative evidence for cooperative coupling between charge-transfer, spin-state, and lattice structure.", "Multiplet calculations and low-energy RIXS data support the existence of a metallic phase particle-hole continuum."]}}, {"title": "Spin splitting without symmetry: a nearly compensated ferrimagnet and the origin of altermagnetism", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2609.12931", "authors": "Jaekyung Jang, Joo Yull Rhee", "last_authors": "Jaekyung Jang, Joo Yull Rhee", "summary": "The spin splitting of collinear altermagnets is usually attributed to the crystal symmetry relating the opposite-spin sublattices --- a rotation or mirror in place of the translation or inversion of a conventional antiferromagnet. We show that this symmetry organizes the splitting but does not produce it; its origin is the anisotropic arrangement of the magnetic orbitals and their ligands, which also fixes the symmetry itself. Two results establish this. A triclinic ($P1$) \\ce{Mn} oxide, a fully compensated ferrimagnet whose two inequivalent sublattices are related by no symmetry, is spin split throughout the Brillouin zone; repositioning the same ligands, atom for atom, to restore an inversion centre relating the two metal sites collapses the splitting to a residual two orders of magnitude smaller, so the splitting follows from the arrangement rather than the symmetry. Symmetry, we show formally, can only ever reverse or forbid a splitting that already exists: it cannot create one between sublattices an arrangement has left electronically identical, nor where the underlying orbitals carry no anisotropy to arrange in the first place. Organizing the analysis through an operation-resolved symmetry hierarchy and reading the crystal classes as a single axis, the enforced nodal planes fall from two to one to zero across the orthorhombic, monoclinic, and triclinic classes while the arrangement-generated splitting persists to the base. The altermagnet and the fully compensated ferrimagnet are thus the two ends of one axis --- the same splitting, organized by symmetry at one end and unorganized at the other --- and the search for compensated spin-split magnets is a search over orbital arrangements rather than symmetry labels.", "tier": "B_IMPORTANT_CONDMAT", "score": "9", "reason": "Theoretical investigation of the electronic origin of spin splitting in altermagnets beyond crystal symmetry.", "tags": ["theory", "altermagnetism", "electronicstructure"], "image": "https://arxiv.org/html/2609.12931v2/ac_plane_Heatmap_Band18.png", "briefing": {"background": "교대자성(Altermagnetism)은 총 자화량이 0이면서도 운동량 공간에서 스핀 분할이 일어나는 새로운 자성 상태로, 보통 결정 대칭성에 의해 설명되어 왔습니다.", "motivation": "스핀 분할의 근본 원인이 단순히 전체적인 결정 대칭성에 있는 것인지, 아니면 국소적인 궤도 및 리간드 배열에서 기인하는 것인지를 이론적으로 규명하고자 했습니다.", "result": "대칭성이 전혀 없는(P1) 삼사정계 Mn 산화물에서도 전 Brillouin 영역에서 스핀 분할이 나타남을 보였으며, 리간드 위치를 조정해 반전 대칭을 복원하면 스핀 분할이 급격히 사라짐을 증명했습니다.", "implication": "교대자성적 스핀 분할의 본질은 '대칭성'이 아니라 '자기 궤도와 리간드의 이종 이방성 배열'이며, 대칭성은 이 분할을 조직하거나 금지하는 역할만 수행합니다.", "novelty": "교대자성 연구의 패러다임을 대칭성 분석에서 궤도 배열(orbital arrangement) 중심으로 전환해야 함을 시사하며, 독자가 관심을 갖는 교대자성 및 위상 물질의 탐색 범위를 넓혀줍니다.", "unresolved": "대칭성이 없는 물질에서 나타나는 이러한 스핀 분할을 실제 실험적으로 어떻게 정밀하게 측정하고 제어할 것인지가 과제로 남습니다.", "future_work": "삼사정계 또는 대칭성이 낮은 자성체에 대한 ARPES나 수송 실험을 통한 스핀 분할 검증이 필요합니다.", "concepts": [{"term": "Altermagnetism (교대자성)", "why_emerged": "강자성과 반강자성의 장점을 동시에 갖는(자화량은 0이나 스핀 분할은 존재) 물질군을 분류하기 위해 제안되었습니다.", "origin": "L. Šmejkal, J. Sinova, and T. Jungwirth (2022년경)", "connections": "Antiferromagnetism, Spin-splitting, Berry curvature"}, {"term": "Spin Splitting (스핀 분할)", "why_emerged": "전자 구조 내에서 상방 스핀과 하방 스핀의 에너지 준위가 차이 나는 현상을 설명하기 위해 필요합니다.", "origin": "초록 정보만으로는 특정하기 어려움 (Zeeman 효과 및 SOC 연구 역사와 결부)", "connections": "Rashba 효과, Zeeman 효과, 교대자성"}, {"term": "Triclinic (P1) symmetry", "why_emerged": "결정 구조 중 가장 대칭성이 낮은 상태를 정의하기 위해 사용됩니다.", "origin": "결정학의 기본 분류", "connections": "Inversion symmetry, Crystal systems"}], "english_summary": ["The study argues that spin splitting in magnets originates from anisotropic orbital arrangements rather than crystal symmetry.", "A triclinic P1 Mn oxide shows robust spin splitting despite lacking any sublattice-relating symmetry.", "Symmetry is shown to only reverse or forbid pre-existing arrangement-generated splitting.", "The finding unifies altermagnets and compensated ferrimagnets as different ends of the same orbital-arrangement axis."]}}, {"title": "Symmetry-Based Transport Criterion and Robust Design for RuO2-type Altermagnets", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2611.01944", "authors": "Zhaoqing Li, Yi Liu, Yizheng Wu, Zhe Yuan", "last_authors": "Yizheng Wu, Zhe Yuan", "summary": "Altermagnetism combines vanishing net magnetization with momentum-dependent spin splitting, enabling spin-transport functionalities without ferromagnetism. Although rutile RuO$_2$ has been proposed as a d-wave altermagnet, its magnetic ground state remains highly controversial. Moreover, existing transport verifications suffer from severe ambiguity due to the entanglement of spin-splitting effects and time-reversal-even spin-Hall contributions. Here, we introduce a two-pronged strategy to break the current verification impasse. First, we establish a definitive, symmetry-based transport criterion: by identifying specific crystallographic geometries where the spin-Hall background is strictly forbidden, we provide a zero-background window for unambiguous altermagnetic detection. Concurrently, to bypass the uncertain bulk energetics, we propose the RuO$_2$/MnO$_2$ superlattice as a prototypical platform to robustly enforce the d-wave altermagnetic order via interfacial magnetic proximity. Within this platform, symmetry-resolved spin-transport analysis reveals unconventional responses, including collinear spin currents enabling field-free magnetization switching and sizable spin-polarized charge currents. By combining a universal transport criterion with a robustly engineered material platform, our work transcends the debates over bulk properties, providing an actionable, definitive experimental roadmap for verifying d-wave altermagnetism.", "tier": "B_IMPORTANT_CONDMAT", "score": "9", "reason": "Provides experimental roadmap for verifying altermagnetism in prototypical RuO2 systems.", "tags": ["altermagnetism", "RuO2", "transport"], "image": "https://arxiv.org/static/browse/0.3.4/images/arxiv-logo-fb.png", "briefing": {"background": "RuO2는 대표적인 d-wave 교대자성체 후보물질이지만, 그 자기적 기저 상태와 수송 현상 해석(스핀 홀 효과와의 혼재)을 둘러싼 논란이 지속되고 있습니다.", "motivation": "RuO2계 물질에서 교대자성 특유의 스핀 분할 효과를 스핀 홀 효과와 같은 배경 신호로부터 명확히 분리하여 검증할 수 있는 방법론을 제시하고자 합니다.", "result": "스핀 홀 배경 신호가 완전히 금지되는 특정 결정학적 기하 구조를 이론적으로 도출하여 '제로 배경' 측정 창을 제시하였고, RuO2/MnO2 초격자 구조를 통해 교대자성 질서를 강제하는 설계를 제안했습니다.", "implication": "제시된 수송 기준을 따르면 RuO2의 교대자성 여부를 실험적으로 확정할 수 있으며, 필드 없이 자화 반전이 가능한 스핀 전류 생성 메커니즘을 활용할 수 있습니다.", "novelty": "기존 실험의 모호성을 제거할 수 있는 구체적인 수송 실험 가이드를 제공하며, 초격자 설계를 통해 물질의 불확실한 벌크 물성을 극복하려 했다는 점이 독자의 수송 및 위상 반금속 관심사와 연결됩니다.", "unresolved": "제안된 RuO2/MnO2 초격자를 원자 단위에서 정밀하게 성장시키고 계면 효과를 제어하는 공정상의 난제가 남아있습니다.", "future_work": "특정 기하 구조에서의 홀 효과 측정 및 RuO2 기반 박막/초격자 소자의 제작과 스핀 수송 특성 분석이 기대됩니다.", "concepts": [{"term": "d-wave Altermagnetism", "why_emerged": "스핀 분할의 대칭성이 운동량 공간에서 d-wave 초전도체와 유사한 대칭성을 갖는 자성체를 기술하기 위해 도입되었습니다.", "origin": "초록 정보만으로는 특정하기 어려움 (Šmejkal et al. 등의 교대자성 분류)", "connections": "RuO2, Momentum-dependent spin splitting"}, {"term": "Spin-Hall Effect (SHE)", "why_emerged": "전하 전류로부터 수직 방향의 스핀 전류를 생성하는 현상을 설명하기 위해 발견되었습니다.", "origin": "Dyakonov and Perel (1971), Hirsch (1999)", "connections": "Spin-orbit coupling, Anomalous Hall Effect"}, {"term": "Magnetic Proximity Effect", "why_emerged": "자성체와 비자성체(또는 다른 자성체) 계면에서 자기적 질서가 전이되는 현상을 활용하기 위해 연구되었습니다.", "origin": "초록 정보만으로는 특정하기 어려움 (박막 및 계면 물리 분야)", "connections": "Exchange bias, Superlattices"}], "english_summary": ["The paper provides a definitive symmetry-based transport criterion to distinguish altermagnetism from spin-Hall effects in RuO2.", "Identifies specific geometries where spin-Hall contributions are strictly forbidden, creating a zero-background window.", "Proposes RuO2/MnO2 superlattices to robustly enforce d-wave altermagnetic order via magnetic proximity.", "The strategy aims to resolve ongoing controversies regarding RuO2's magnetic ground state and transport signatures."]}}, {"title": "Theory of the Ferroaxial Charge Density Wave in 1T-TiSe2", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2611.03478", "authors": "Ilaria Maccari, Rafael M. Fernandes, Fernando de Juan, Maria N. Gastiasoro", "last_authors": "Ilaria Maccari, Rafael M. Fernandes, Fernando de Juan, Maria N. Gastiasoro", "summary": "Recent experiments using strain to probe the charge-density wave (CDW) of 1T-TiSe$_2$ have uncovered additional transitions and broken symmetries inside the CDW state. The elastocaloric effect reveals a second transition below $T_\\mathrm{CDW}$, which elastoresistivity shows to be associated with ferroaxial order, breaking all vertical mirror symmetries while preserving inversion. In addition, at even lower temperatures, a diverging nematic susceptibility has been reported through elastoresistivity. In this work, we argue that this rich phenomenology cannot be explained by the standard $L_1^-$ CDW order parameter, and instead requires the existence of a secondary CDW order parameter. Based on symmetry, microscopic, and diffraction considerations, we propose this subleading CDW to have $L_2^-$ symmetry. By analyzing the Landau theory of coupled $L_1^-$ and $L_2^-$ orders in the presence of strain, we reproduce the phase boundaries observed in the elastocaloric measurements and the emergence of ferroaxial order below the CDW transition. Moreover, the model supports a third threefold-rotational symmetry breaking transition at lower temperatures, consistent with the reported divergence of the nematic susceptibility.", "tier": "B_IMPORTANT_CONDMAT", "score": "9", "reason": "Directly relevant theory of CDW and nematicity in a transition metal dichalcogenide, mirroring kagome metal interests.", "tags": ["theory", "1T-TiSe2", "chargedensitywave"], "image": "https://arxiv.org/html/2611.03478v1/Fig4.png", "briefing": {"background": "1T-TiSe2는 CDW(전하밀도파) 상태 내에서 여러 대칭성이 깨어지는 현상을 보이는 대표적인 물질로, 최근의 정밀한 변형률 측정 실험들을 통해 단순한 단일 CDW 이상의 복잡한 상전이들이 보고되고 있습니다.", "motivation": "기존의 단일 L1- 대칭 CDW 이론으로는 1T-TiSe2에서 관측되는 이차적인 상전이와 네마틱 감수율의 발산, 특히 ferroaxial(강축) 질서의 출현을 설명할 수 없어 이를 해결하고자 함.", "result": "L1-과 L2- 대칭을 가진 두 개의 CDW 질서 변수가 결합된 란다우 이론을 제시하였으며, 이를 통해 변형률 하에서 관측된 위상 경계와 강축 질서의 발현을 성공적으로 재현함.", "implication": "TiSe2의 CDW 상태가 단순한 전하 변조를 넘어 다중 대칭성 파괴가 얽힌 복합적인 상임을 시사하며, 이는 Kagome 금속 등 다른 상관 전자계 물질의 대칭성 분석에도 중요한 방법론적 틀을 제공함.", "novelty": "CDW 질서 내의 숨겨진 대칭성(L2-)을 규명하고 이를 통해 네마틱성과 강축 질서를 통합적으로 설명했다는 점이 핵심임. Kagome 금속에서의 TRSB나 네마틱 연구와 방법론적으로 깊은 연관성을 가짐.", "unresolved": "이론적 제안이 구체적인 미시적 상호작용(예: 전자-포논 결합의 상세 기작)에 얼마나 부합하는지는 추가 연구가 필요함.", "future_work": "제시된 L2- 질서 변수를 직접 관측하기 위한 비탄성 X-선 산란이나 특정 대칭성에 민감한 분광학적 실험이 뒤따라야 할 것임.", "concepts": [{"term": "Ferroaxial order", "why_emerged": "물질의 회전 대칭성 파괴를 정량적으로 기술하기 위해 도입됨.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "반전 대칭성 보존, 텐서 질서 변수."}, {"term": "L1-, L2- symmetry", "why_emerged": "CDW 시스템의 복합적인 대칭성 파괴를 그룹 이론적으로 분류하기 위해 필요.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "란다우 이론, 질서 변수 결합."}], "english_summary": ["1T-TiSe2 exhibits complex symmetry breaking within the CDW phase.", "The standard single order parameter model fails to explain recent elastocaloric and elastoresistivity data.", "A dual-order parameter model involving L1- and L2- symmetries is proposed.", "The theory successfully predicts the ferroaxial order and nematic susceptibility divergence.", "This provides a framework for analyzing secondary transitions in correlated electron systems."]}}, {"title": "Thermal Hall tomography of superconducting topology in rhombohedral graphene", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2608.12586", "authors": "Kumar Ghosh", "last_authors": "Kumar Ghosh", "summary": "Chiral superconductors should carry Majorana modes along their edges, yet three decades of work on  토폴로지를 가지며, 이는 강한 비선형 광학 반응과 연관되어 있습니다.", "motivation": "CoSi와 같은 키랄 물질에서 발생하는 2차 및 3차 조화파 생성(SHG, THG)의 원형 이색성(circular dichroism)이 위상 전자 상태를 어떻게 반영하는지 이론적으로 규명하고자 합니다.", "result": "SHG와 THG 모두에서 1에 가까운 강한 원형 이색성이 관찰되며, 특히 스펙트럼 폭 확장에 대한 반응성에서 두 차수 간의 극명한 차이가 있음을 확인했습니다.", "implication": "비선형 광학 응답을 통해 키랄 위상 물질의 전자 구조 및 토폴로지 특성을 비파괴적으로 정밀하게 조사할 수 있는 가능성을 제시합니다.", "novelty": "CoSi에서 SHG/THG의 차별화된 이색적 반응을 이론적으로 모델링하여 위상적 특성을 광학적으로 탐지하는 새로운 지표를 제공합니다.", "unresolved": "실제 실험적 스펙트럼 데이터와 이론적 모델의 정량적 일치 여부는 추가 검증이 필요합니다.", "future_work": "실제 CoSi 단결정 시료를 이용한 초고속 레이저 기반 비선형 광학 실험을 통해 이론적 예측치를 입증할 필요가 있습니다.", "concepts": [{"term": "키랄 위상 반금속", "why_emerged": "결정 내 대칭성이 파괴되어 발생하는 위상학적 비자명 전자 상태를 연구하기 위해 필요합니다.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "Weyl semimetal, Berry curvature, optical chirality"}, {"term": "원형 이색성 (CD)", "why_emerged": "좌우 원형 편광에 대한 물질의 흡수 또는 반응 차이를 통해 키랄성을 측정하기 위해 필요합니다.", "origin": "Aimé Cotton (1895)", "connections": "Kramers-Kronig relations, chiral optical responses"}], "english_summary": ["Theoretical study of SHG and THG circular dichroism in chiral semimetal CoSi.", "Results show robust circular dichroism of order unity in both harmonic generation processes.", "Spectral broadening sensitivity differs significantly between SHG and THG responses.", "Suggests non-linear optical probes as tools for identifying topological electronic states."]}}, {"title": "Defect-nucleated charge density wave in monolayer 1H−NbSe2", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/d1k3-m1sl", "authors": "Fangjun Cheng, Xinyu Liu, Matthew Toole, et al.", "last_authors": "Badih Assaf, Xiaolong Liu", "summary": "Reduced dimensionality is generally expected to enhance charge density wave (CDW) order. However, experimental results in monolayer ${\\mathrm{NbSe}}_{2}$ appear conflicting: while optical measurements reveal CDW signatures up to 145 K on oxide substrates, scanning tunneling microscopy (STM) studies …", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Direct experimental study on CDW dynamics in monolayer NbSe2.", "tags": ["CDW", "STM", "NbSe2", "monolayer"], "image": "", "briefing": {"background": "전하밀도파(CDW)는 저차원 물질에서 흔히 나타나는 전자-격자 결합 현상이지만, 차원이 낮아질수록 기판과의 상호작용과 결함의 영향이 지배적으로 변합니다.", "motivation": "단층 NbSe2에서 광학적으로 관찰되는 높은 CDW 전이 온도와 STM으로 관찰되는 불일치 현상 사이의 간극을 결함의 관점에서 이해하고자 합니다.", "result": "단층 NbSe2에서의 CDW 질서가 결정 결함(defect)에 의해 핵생성(nucleation)됨을 STM을 통해 직접 관찰했습니다.", "implication": "단층 물질의 위상적/구조적 질서가 본질적인 물성뿐만 아니라 시료 내 결함 분포에 크게 좌우됨을 시사합니다.", "novelty": "NbSe2 단층에서 상충되던 기존 실험 데이터의 모순을 '결함 유도 핵생성'이라는 메커니즘으로 해결했습니다.", "unresolved": "결함의 밀도와 유형이 CDW의 장거리 질서 형성에 미치는 정량적 임계값은 아직 불분명합니다.", "future_work": "제어된 결함 도입을 통한 STM 측정을 통해 CDW 핵생성 밀도와 전이 온도의 상관관계에 대한 연구가 요구됩니다.", "concepts": [{"term": "전하밀도파 (CDW)", "why_emerged": "저차원 금속에서 전자 밀도가 주기적으로 변조되는 바닥 상태를 설명하기 위해 필요합니다.", "origin": "Rudolf Peierls (1955)", "connections": "Peierls transition, Fermi surface nesting"}, {"term": "단층 NbSe2", "why_emerged": "2차원 초전도체와 CDW의 상호작용을 연구하기 위한 대표적인 플랫폼입니다.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "van der Waals materials, 2D superconductivity"}], "english_summary": ["Investigated the discrepancy between optical and STM studies of CDW in monolayer NbSe2.", "Demonstrated that CDW order is nucleated by structural defects in monolayer NbSe2.", "Resolves long-standing confusion regarding CDW signatures in reduced dimensions.", "Highlights the crucial role of defects in defining the physical state of 2D monolayers."]}}, {"title": "Flat band in the multiband metal MnSb2", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/cp97-khvn", "authors": "Carl Jonas Linnemann, Davide Ceresoli, Kim-Khuong Huynh, Martin Bremholm", "last_authors": "Kim-Khuong Huynh, Martin Bremholm", "summary": "We report the realization of a metallic flat band in the marcasite compound ${\\mathrm{MnSb}}_{2}$. The material was synthesized under high pressure, and its crystal structure was established by x-ray diffraction. Electrical and thermoelectric transport measurements reveal signatures of a flat band n…", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Identification of metallic flat bands in a real material; highly relevant to electronic structure interests.", "tags": ["material", "MnSb2", "flatband"], "image": "", "briefing": {"background": "플랫 밴드(flat band)는 전자 간 상호작용을 극대화하여 초전도, 자기적 질서 등 강상관 전자 현상을 유도할 수 있는 이상적인 전자 구조입니다.", "motivation": "마카사이트(marcasite) 구조의 MnSb2에서 고압 합성을 통해 새로운 플랫 밴드 금속 상태를 발견하고 그 특성을 확인하고자 합니다.", "result": "MnSb2를 고압 합성하였으며, 전기 및 열전 수송 측정을 통해 플랫 밴드 유래의 특징적인 물성을 확인했습니다.", "implication": "MnSb2가 강상관 물리 현상을 연구할 수 있는 새로운 물질군이 될 가능성이 높습니다.", "novelty": "고압 합성을 통해 새로운 플랫 밴드 물질을 성공적으로 구현했으며, 수송 현상을 통해 이를 입증했습니다.", "unresolved": "플랫 밴드가 어떤 특정 궤도에 기인하는지, 그리고 전자 간 상호작용에 의한 구체적인 기저 상태(ground state)가 무엇인지는 추가 연구가 필요합니다.", "future_work": "ARPES를 통한 직접적인 밴드 구조 관측과 저온에서의 비정상 수송 현상에 대한 상세 연구가 필요합니다.", "concepts": [{"term": "플랫 밴드", "why_emerged": "상호작용 효과를 극대화할 수 있는 분산이 없는 전자 에너지 대역을 기술하기 위해 필요합니다.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "Moiré physics, heavy fermions, high-Tc superconductivity"}, {"term": "마카사이트 구조", "why_emerged": "전이 금속 화합물에서 다양한 자기적, 전기적 물성을 나타내는 독특한 결정 구조 중 하나입니다.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "FeS2 pyrite-marcasite polymorphism"}], "english_summary": ["Reported the discovery of a metallic flat band in the high-pressure synthesized compound MnSb2.", "Electrical and thermoelectric transport measurements confirm signatures of a flat band.", "MnSb2 represents a new candidate for studying strong electronic correlation effects.", "Future ARPES studies are warranted to map the flat band electronic structure."]}}, {"title": "Magnetism and symmetry of superconducting gap in LaFeAsO from dynamical mean-field theory", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/gfr4-g54x", "authors": "S. L. Skornyakov, V. I. Anisimov, A. A. Katanin", "last_authors": "V. I. Anisimov, A. A. Katanin", "summary": "By employing a combined method of density functional theory and dynamical mean field theory $(\\mathrm{DFT}+\\mathrm{DMFT})$ we investigate the effect of electronic correlations on the magnetic and superconducting properties of the iron-based parent compound LaFeAsO. We find that the static nonlocal s…", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "DFT+DMFT study of iron pnictide superconductivity is very relevant.", "tags": ["superconductivity", "DMFT", "iron-pnictide"], "image": "", "briefing": {"background": "철 기반 초전도체(Iron-based superconductors, FeSCs)는 높은 전이 온도와 강한 전자 상관관계로 인해 고온 초전도 메커니즘을 규명하는 핵심 대상입니다. 특히 LaFeAsO는 FeSC의 효시 격인 물질로, 전자 간의 상호작용이 어떻게 자성과 초전도성을 이끄는지 이해하는 것이 연구의 핵심 과제입니다.", "motivation": "기존의 DFT만으로는 3d 전자의 강한 상관관계를 기술하는 데 한계가 있어, 이를 개선하기 위해 DFT+DMFT(Dynamical Mean-Field Theory) 결합 방식을 사용하여 전자 상관효과가 자성과 초전도 갭의 대칭성에 미치는 영향을 구체적으로 분석하고자 합니다.", "result": "LaFeAsO 모체 화합물에서 전자 상관관계가 자성 상태와 초전도 갭 구조에 미치는 영향을 정량화했습니다. 특히 비국소적인 효과(nonlocal effects)가 스핀 밀도 파동(SDW)과 초전도 쌍 형성 메커니즘에 기여함을 확인했습니다.", "implication": "강한 상관계 시스템에서 전자 간 상호작용이 어떻게 페르미 표면의 nesting과 갭 구조를 변화시키는지 이해함으로써, 철 기반 초전도체의 비전통적 초전도 기원을 더 정확히 규명할 수 있습니다.", "novelty": "철 pnictide 화합물 연구에 최신 DMFT 계산 기법을 도입하여, 단순히 평균장 근사를 넘어서는 강상관계 전자의 동역학적 특성을 설명했다는 점에서 가치가 있습니다.", "unresolved": "초전도성 자체의 전이 온도(Tc)를 완전하게 정량적으로 예측하는 데에는 여전히 실험치와 이론치 사이의 보완이 필요합니다.", "future_work": "도핑에 따른 전자 상관효과의 변화 분석 및 다른 철 계열 화합물로의 모델 확장이 기대됩니다.", "concepts": [{"term": "DFT+DMFT", "why_emerged": "기존 DFT가 강한 전자 상관관계를 가진 계에서 밴드 구조를 과소평가하거나 다체 효과를 다루지 못하는 한계를 극복하기 위해 제안됨.", "origin": "Kotliar, Savrasov 등 2000년대 초반 개발.", "connections": "LDA+U법의 발전형이며, 강상관계 물질 연구의 표준적인 수치해석 도구로 자리 잡음."}, {"term": "Iron-pnictide", "why_emerged": "구리 산화물 이후 가장 높은 Tc를 보이는 물질군으로서 고온 초전도 현상의 보편성을 연구하기 위해 중요해짐.", "origin": "2008년 Hosono 그룹에 의해 LaFeAsO 초전도 발견.", "connections": "cuprates 및 중페르미온 초전도체와 함께 비전통적 초전도 연구의 3대 핵심 분야."}], "english_summary": ["Investigated electronic correlations in LaFeAsO using DFT+DMFT.", "Analyzed the influence of strong correlations on magnetism and superconducting gaps.", "Provided insights into the role of nonlocal effects in pnictide superconductivity.", "Advanced the understanding of the superconducting mechanism in FeSCs."]}}, {"title": "d-wave altermagnetism and nonlinear transport in Dirac semimetals", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/kz4s-11k6", "authors": "Xin-Mei Wei, Zi-Ming Wang, Dong-Hui Xu", "last_authors": "Zi-Ming Wang, Dong-Hui Xu", "summary": "Altermagnets combine compensated collinear magnetic order with momentum-dependent spin splitting. A key question is how such spin splitting can arise from electronic interactions in a spin-degenerate Dirac semimetal and what spin-resolved transport signatures it produces. We address this issue using…", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Altermagnetism in Dirac semimetals is a relevant topic for this profile.", "tags": ["altermagnetism", "Diracsemimetal"], "image": "", "briefing": {"background": "알터자성(Altermagnetism)은 스핀 보상(compensated) 상태임에도 불구하고 운동량 공간에서 비자명한 스핀 분할(spin splitting)을 보이는 새로운 자성 상태입니다. 이는 기존의 강자성이나 반강자성과는 다른 대칭성 기반의 물리 현상을 탐구하는 분야입니다.", "motivation": "스핀 분극이 없는 디락 반금속(Dirac semimetal) 시스템에서 전자 상호작용을 통해 어떻게 알터자성적 스핀 분할이 발현될 수 있는지, 그리고 이것이 비선형 수송 현상에 어떤 영향을 주는지 규명하고자 합니다.", "result": "디락 반금속에서의 전자 상호작용이 알터자성 순서를 유도할 수 있음을 이론적으로 보였으며, 이로 인해 유도되는 특이한 비선형 수송(nonlinear transport) 신호를 제시했습니다.", "implication": "알터자성이 반금속 상태의 위상적 물성과 결합할 경우 새로운 스핀트로닉스 소자 구현 가능성을 제시하며, 비선형 응답을 통해 숨겨진 자성 상태를 탐지할 수 있음을 시사합니다.", "novelty": "기존의 전형적인 자성체 논의를 넘어, 위상 물질인 디락 반금속과 알터자성 사이의 직접적인 상관관계를 다루어 이 분야 연구자의 분석 범위를 넓힙니다.", "unresolved": "실제 실험적 재료 시스템에서 이러한 비선형 수송 효과가 배경 노이즈와 분리되어 관측될 수 있는지에 대한 정량적 추정이 필요합니다.", "future_work": "알터자성 디락 반금속 후보 물질의 제안 및 저온에서의 비선형 전기 전도도 측정 실험.", "concepts": [{"term": "Altermagnetism", "why_emerged": "강자성(자화 있음)과 반강자성(스핀 보상됨)의 경계를 허무는 대칭성 기반의 새로운 스핀 구조를 기술하기 위해 제안됨.", "origin": "Jungwirth 등 최근 제안 (2022년경).", "connections": "반강자성 스핀트로닉스 및 비전통적 자성체 연구와 연결."}, {"term": "Dirac Semimetal", "why_emerged": "페르미 준위 근처에서 선형적인 에너지 분산(Dirac cone)을 가지는 물질들의 위상적 특성을 연구하기 위해 도입.", "origin": "초록 정보만으로는 특정하기 어려움 (이론 및 실험적 발전은 2010년대 중반 이후 본격화).", "connections": "Weyl semimetal, 위상 절연체 연구의 연장선."}], "english_summary": ["Investigated d-wave altermagnetism in Dirac semimetals.", "Analyzed the emergence of spin splitting from electronic interactions.", "Proposed nonlinear transport signatures for altermagnetism detection.", "Connects topological semimetal physics with novel altermagnetic orders."]}}, {"title": "Chiral Casimir-Polder Force from Chiral Anomaly in Weyl Semimetals", "journal": "PRL_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/gny7-xz9s", "authors": "Liang Chen, Xu-Feng Zhao, Xun-Lei Ding, Kai Chang", "last_authors": "Xun-Lei Ding, Kai Chang", "summary": "We propose a novel chiral-discriminatory Casimir-Polder interaction between chiral molecules and Weyl semimetals, originating from the chiral anomaly. This interaction is uniquely governed by the molecule’s electric dipole moment, enabling chiral discrimination even when the optical rotatory strengt…", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Theory on Weyl semimetals, chiral anomaly, and a measurable force, relevant to topological materials.", "tags": ["theory", "topologicalsemimetal", "Weyl", "chiral"], "image": "", "briefing": {"background": "바일 반금속(Weyl Semimetals)은 위상학적 비자명성을 가진 물질로, 입자와 반입자의 분리가 일어나는 바일 노드(Weyl nodes)를 가집니다. 여기서 발생하는 카이랄 변칙(chiral anomaly)은 전자기적 응답뿐만 아니라 분자-물질 상호작용에서도 독특한 현상을 야기할 수 있습니다.", "motivation": "바일 반금속에서 나타나는 카이랄 변칙이 진공 중 분자-표면 사이의 카이랄 Casimir-Polder 힘에 어떠한 영향을 미치는지 규명하고, 이를 통한 카이랄 분자 식별 가능성을 타진하고자 합니다.", "result": "카이랄 분자와 바일 반금속 사이의 카이랄 Casimir-Polder 상호작용을 제안했습니다. 이 힘은 분자의 전기 쌍극자 모멘트에 의해 지배되며, 기존의 광회전 강도(optical rotatory strength)에 의존하던 방식보다 훨씬 효율적인 카이랄 판별 능력을 보입니다.", "implication": "위상적 물질인 바일 반금속을 고감도 카이랄 센싱 소자나 분자 필터링 장치로 활용할 수 있는 이론적 기반을 제공합니다.", "novelty": "위상 물리 개념인 '카이랄 변칙'을 Casimir-Polder 힘이라는 원자 수준의 물리적 힘과 연결한 독창적인 접근 방식입니다.", "unresolved": "실제 실험실 환경에서 이 힘을 분리 측정하는 데 필요한 분자 증착 및 위상 물질 기판의 표면 제어 정밀도가 과제로 남습니다.", "future_work": "바일 반금속 기반의 분자 분리 실험 시스템 고안 및 측정 시뮬레이션.", "concepts": [{"term": "Chiral Anomaly", "why_emerged": "입자 물리에서 나타나는 양자 변칙 현상을 고체 물질 내의 위상적 결함(바일 노드)에서 재해석하기 위해 도입.", "origin": "Adler-Bell-Jackiw (ABJ) 변칙에 기원.", "connections": "자기저항(negative magnetoresistance) 측정과 긴밀히 연관."}, {"term": "Casimir-Polder Force", "why_emerged": "진공에서의 양자 요동에 의해 중성 분자와 표면 사이에 작용하는 유효 힘을 기술하기 위해 제안.", "origin": "Casimir and Polder (1948).", "connections": "반데르발스 힘의 양자 전기역학적 확장."}], "english_summary": ["Proposed a chiral-discriminatory Casimir-Polder force in Weyl semimetals.", "Linked the force to the chiral anomaly within the material.", "Demonstrated the potential for high-efficiency chiral sensing.", "Provides a novel application of topological semimetals in surface science."]}}, {"title": "Chirality-Resolved Spectroscopy of Caroli–de Gennes–Matricon States in Multiband FeTe1−xSex Superconductors", "journal": "PRL_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/wrds-99zb", "authors": "T. Rõõm, A. Glezer Moshe, R. Nagarajan, et al.", "last_authors": "Seongshik Oh, G. Blumberg", "summary": "Terahertz magneto-optics is established as a direct probe of helical vortex-core excitations, providing dynamical evidence for multiband CdGM states in iron-based superconductors.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Spectroscopy of vortex states in a relevant high-Tc material with topological implications.", "tags": ["magneto-optics", "FeTeSe", "superconductivity"], "image": "", "briefing": {"background": "초전도체 내의 소용돌이(vortex) 코어에는 Caroli-de Gennes-Matricon(CdGM) 상태라고 불리는 속박된 준입자 상태들이 존재합니다. 이는 초전도체의 에너지 갭 내부에 위치하며 소용돌이의 구조와 초전도 대칭성을 이해하는 데 필수적입니다.", "motivation": "FeTe1-xSex와 같은 철 기반 초전도체는 다중 밴드 특성을 가지고 있어, 소용돌이 코어 내부의 준입자 상태가 단순한 s-파 초전도체와 어떻게 다른지
