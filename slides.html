<title>Daily Paper Slideshow</title>
<style>
  :root {
    color-scheme: light;
    --bg: #f6f7f4;
    --paper: #ffffff;
    --ink: #111827;
    --muted: #64748b;
    --line: #d8ddd2;
    --accent: #176b87;
    --accent-2: #9a3412;
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; overflow: auto; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: var(--bg); color: var(--ink); }
  .shell { max-width: 1500px; min-height: 100vh; margin: 0 auto; padding: 14px 18px; display: flex; flex-direction: column; }
  .topbar { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 16px; }
  .top-actions { display: flex; align-items: center; gap: 10px; }
  .topbar a, button { border: 1px solid var(--line); border-radius: 8px; background: var(--paper); color: var(--ink); padding: 10px 14px; font-weight: 700; text-decoration: none; cursor: pointer; }
  button.primary { background: var(--accent); border-color: var(--accent); color: white; }
  button:disabled { opacity: 0.45; cursor: not-allowed; }
  .counter { color: var(--muted); font-weight: 700; }
  .slide { min-height: calc(100vh - 82px); background: var(--paper); border: 1px solid var(--line); border-radius: 10px; padding: 18px; box-shadow: 0 18px 42px rgba(15, 23, 42, 0.10); display: grid; grid-template-columns: minmax(310px, 0.86fr) minmax(0, 1.55fr); gap: 18px; overflow: visible; }
  .paper-head { min-width: 0; min-height: 0; overflow: visible; display: flex; flex-direction: column; gap: 12px; }
  .figure { margin: 0; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: #f8fafc; }
  .figure img { display: block; width: 100%; max-height: 41vh; object-fit: contain; background: white; }
  .figure figcaption { padding: 7px 10px; color: var(--muted); font-size: 12px; line-height: 1.3; }
  .head-text { display: flex; flex-direction: column; gap: 9px; min-width: 0; }
  .badges { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .badge { border-radius: 999px; padding: 5px 9px; background: #eef2ff; color: #3730a3; font-size: 12px; font-weight: 800; }
  .score { background: #fee2e2; color: #991b1b; }
  h1 { margin: 0; font-size: 25px; line-height: 1.15; letter-spacing: 0; overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
  h1 a { color: inherit; text-decoration-color: rgba(23, 107, 135, 0.35); text-decoration-thickness: 2px; text-underline-offset: 4px; }
  h1 a:hover { color: var(--accent); text-decoration-color: var(--accent); }
  .meta, .authors, .why, .abstract { font-size: 13px; line-height: 1.45; }
  .meta, .authors { color: var(--muted); }
  .why strong, .abstract strong, .authors strong { color: var(--ink); }
  .authors { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .why { border-left: 4px solid var(--accent-2); padding-left: 10px; color: #374151; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .abstract { border-top: 1px solid var(--line); padding-top: 14px; color: #374151; }
  .original-abstract { border-top: 1px solid var(--line); padding-top: 10px; color: #374151; font-size: 11.5px; line-height: 1.35; overflow-wrap: anywhere; }
  .original-abstract strong { display: block; margin-bottom: 4px; color: var(--ink); }
  .tags { display: flex; flex-wrap: wrap; gap: 8px; }
  .tag { border-radius: 999px; padding: 4px 8px; background: #f1f5f9; color: #475569; font-size: 12px; font-weight: 700; }
  .head-text > .link { display: none; }
  .briefing { min-width: 0; min-height: 0; overflow: visible; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); grid-auto-rows: minmax(0, auto); align-content: start; gap: 11px 18px; border-top: 0; padding-top: 0; }
  .brief-section { min-width: 0; }
  .brief-section.wide { grid-column: 1 / -1; }
  .brief-section h2 { margin: 0 0 4px; font-size: 14px; line-height: 1.22; color: #0f766e; letter-spacing: 0; }
  .brief-section p, .brief-section li { margin: 0; font-size: 12.5px; line-height: 1.42; color: #1f2937; overflow-wrap: anywhere; }
  .brief-section ul { margin: 0; padding-left: 20px; }
  .concepts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 9px 14px; }
  .concept { border-top: 1px solid var(--line); padding-top: 7px; }
  .concept h3 { margin: 0 0 4px; font-size: 13px; color: #7c2d12; letter-spacing: 0; }
  .concept p { margin: 2px 0 0; font-size: 11.5px; line-height: 1.35; color: #374151; overflow-wrap: anywhere; }
  .concept b { color: #111827; }
  .link { color: var(--accent); font-weight: 800; text-decoration: none; }
  .empty { padding: 48px; background: var(--paper); border: 1px solid var(--line); border-radius: 12px; color: var(--muted); }
  @media (max-width: 860px) {
    .shell { padding: 14px; }
    .topbar, .top-actions { align-items: stretch; flex-direction: column; }
    .slide, .briefing, .concepts { grid-template-columns: 1fr; }
    .slide { min-height: auto; overflow: visible; display: grid; }
    h1 { font-size: 28px; }
  }
</style>

const slides = [{"title": "Anisotropic spin splitting in -MnTe epilayers on InP(111)A and Si(111) substrates", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2610.40850", "authors": "Zofia Kopacz-Maj, Ali Akbar, Aleksandr Kazakov, et al.", "last_authors": "Tomasz Wojtowicz, Valentine V. Volobuev", "summary": "$\\alpha$-MnTe has emerged as a prototypical altermagnetic material, combining compensated antiferromagnetic order with momentum-dependent spin splitting. Here, we investigate the structural and electronic properties of epitaxial $\\alpha$-MnTe layers grown by molecular beam epitaxy on InP(111)A and Si(111) substrates. The crystalline and surface quality of the epilayers was characterised by reflection high-energy electron diffraction (RHEED), atomic force microscopy (AFM), and X-ray diffraction (XRD), confirming the formation of high-quality, single-phase films. The transport measurements were performed, confirming an antiferromagnetic transition and weak ferromagnetism. The electronic structure was studied using angle-resolved photoemission spectroscopy (ARPES). At 90 K, both samples exhibit relativistic anisotropic valence band splitting, which is substantially larger along the $\\Gamma$-K direction, reaching approximately 300 meV, than along $\\Gamma$-M, where values of about 150~meV are observed. The magnitude and momentum dependence of the splitting are very similar for $\\alpha$-MnTe grown on the two different substrates, indicating the robustness of the altermagnetic electronic structure with respect to the epitaxial environment.", "tier": "A_MUST_READ", "score": "10", "reason": "ARPES study of altermagnetic spin splitting in MnTe; direct match for user specialty.", "tags": ["method", "material", "topic"], "image": "https://arxiv.org/html/2610.40850v1/Fig1_growth_structure_.png", "briefing": {"background": "반강자성체는 자화가 상쇄되어 외부 자기장에서의 효과가 작지만, 최근 '알터마그네틱(Altermagnetism)' 개념이 등장하며 비자성 결정 구조를 유지하면서도 스핀 갈림(spin splitting)과 그에 따른 수송 특성을 가질 수 있다는 사실이 밝혀졌습니다.", "motivation": "alpha-MnTe는 알터마그네틱의 대표적인 후보 물질로, 실제 박막 성장에서 기판의 영향과 상관없이 고유한 스핀 갈림 특성이 유지되는지 확인하고자 했습니다.", "result": "InP 및 Si 기판 위에 성장시킨 alpha-MnTe 박막이 모두 고품질의 결정성을 보였으며, ARPES 측정을 통해 감마-K 방향에서 약 300 meV, 감마-M 방향에서 약 150 meV의 이방성 밸런스 밴드 갈림을 관찰했습니다.", "implication": "알터마그네틱 스핀 갈림이 기판의 종류에 의존하지 않고 물질 고유의 특성으로 강건하게 나타남을 입증하여, 향후 소자 응용 가능성을 높였습니다.", "novelty": "ARPES를 사용하여 알터마그네틱의 핵심인 운동량 의존적 스핀 갈림을 직접 관측했다는 점과, 다양한 기판 위에서도 물질 고유의 위상적 전자 구조가 보존됨을 확인했습니다.", "unresolved": "이번 연구에서는 박막의 품질과 전자 구조의 대칭성에 집중하였으며, 이 스핀 갈림이 실제 비평형 수송 현상이나 구체적인 알터마그네틱 스핀 전류 발생에 미치는 영향은 추가 규명이 필요합니다.", "future_work": "스핀 토크(spin-torque) 전달 효율 측정 및 광학적 제어를 통한 알터마그네틱 스핀 자유도 조절 실험이 이어질 것으로 예상됩니다.", "concepts": [{"term": "Altermagnetism", "why_emerged": "기존의 강자성체와 반강자성체의 분류를 넘어, 결정 대칭성에 의해 스핀이 갈라지는 새로운 자기 정렬 상태를 설명하기 위해 등장했습니다.", "origin": "최근 2-3년 내 체계적인 이론적 정립이 이루어졌으며(예: Libor Smejkal 등), 실험적으로는 MnTe 등이 대표적인 물질로 연구되고 있습니다.", "connections": "반강자성체, 스핀 밸리 물리학, 비자성체 기반의 스핀트로닉스 소자 연구와 밀접하게 연결됩니다."}, {"term": "Spin splitting", "why_emerged": "밴드 구조에서 스핀에 따라 에너지 준위가 나뉘는 현상을 기술하기 위해 필요합니다.", "origin": "고체 물리학의 기초적인 라쉬바(Rashba) 및 드레셀하우스(Dresselhaus) 효과 등에서 유래합니다.", "connections": "스핀-궤도 결합(SOC), 베리 곡률, 양자 홀 효과와 연결됩니다."}], "english_summary": ["Characterized alpha-MnTe epilayers on InP and Si substrates for altermagnetic properties.", "Direct observation of anisotropic valence band splitting via ARPES (300 meV at K, 150 meV at M).", "Confirmed robustness of the altermagnetic electronic structure against epitaxial environments.", "Provides experimental evidence for momentum-dependent spin splitting in compensated antiferromagnets."]}}, {"title": "Observation of light-induced Haldane gap in graphene", "journal": "arXiv_CondMat", "source": "author whitelist", "link": "https://arxiv.org/abs/2610.42115", "authors": "Fei Wang, Xuanxi Cai, Wanying Chen, et al.", "last_authors": "Zhiyuan Sun, Shuyun Zhou", "summary": "Symmetry and topology, encoded in electronic wavefunctions, play a central role in the electronic properties and emergent phenomena of quantum materials. While these properties are conventionally determined by the equilibrium Hamiltonian, strong optical fields offer a fundamentally different route by reshaping the Hamiltonian on ultrafast timescales, turning symmetry and topology into dynamically controllable degrees of freedom. Graphene provides a paradigmatic platform for realizing this concept, where circularly polarized light has long been predicted to dynamically break time-reversal symmetry (TRS) and open a topologically nontrivial gap at the Dirac point. Despite extensive experimental efforts, direct observation of this Dirac gap-the defining spectroscopic signature of the dynamical TRS-breaking induced topological phase-has remained missing. Here we directly observe this light-induced Dirac gap in monolayer graphene. Time- and angle-resolved photoemission spectroscopy reveals that the gap emerges simultaneously with the optical field and exclusively under circularly polarized driving, directly linking its opening to dynamical TRS breaking. Together with Floquet theory, we identify the gap with a light-induced Haldane mass and reveal the associated nontrivial Floquet Berry curvature and Chern topology. By demonstrating dynamical TRS breaking in a prototypical non-magnetic material, our results establish optical driving as a route to ultrafast engineering of symmetry and topology, opening opportunities for dynamically tunable quantum matter beyond equilibrium.", "tier": "A_MUST_READ", "score": "10", "reason": "author whitelist: Shuyun Zhou", "tags": ["angle-resolvedphotoemission", "photoemission", "Dirac", "Berrycurvature", "Chern", "graphene", "monolayer", "topological"], "image": "https://arxiv.org/html/2610.42115v1/Statement.png", "briefing": {"background": "평형 상태의 고체에서는 결정 대칭성과 토폴로지가 밴드 구조를 결정하지만, 강한 빛을 가하면 플로케(Floquet) 공학을 통해 밴드 구조를 동적으로 재구성하여 새로운 토폴로지 상태를 유도할 수 있습니다.", "motivation": "그래핀에 원형 편광을 가하면 시간 역전 대칭(TRS)이 깨지면서 o Castellano, et al.", "last_authors": "Francesco Offi, Alessandro Ruocco", "summary": "Hard-x-ray C 1 s photoemission from monolayer graphene probes a regime in which nuclear recoil and intrinsic electronic asymmetry contribute on comparable energy scales to the observed spectral line shape. Here we combine experiment and modeling over the photon-energy range 0.8 – 8 keV to resolve this interplay quantitatively. A graphene-specific implementation of the Fujikawa-Takata cumulant formalism, based on an anisotropic vibrational density of states constrained by first-principles phonon calculations, captures the expected recoil scaling with photon energy and emission geometry but fails to reproduce the pronounced asymmetric tails of the measured spectra. To overcome this limitation, we introduce an explicit electronic convolution model in which a photon-energy-independent reference response, dominated by the electronic line shape and extracted from the low-recoil 0.8 keV data through a recoil-inclusive fit, is convolved with a phonon recoil kernel carrying the full dependence on photon energy and emission angle. This approach reproduces both the measured line-shape evolution and the observed peak shifts across the explored energy range without refitting the spectra at higher photon energies. The results show that recoil in graphene cannot be described by a baseline treatment in which the phonon recoil kernel is combined only with symmetric lifetime broadening, but must be treated together with the intrinsic many-body electronic response of the C 1 s line.", "tier": "A_MUST_READ", "score": "9", "reason": "title strong match: photoemission", "tags": ["photoemission", "graphene", "monolayer"], "image": "", "briefing": {"background": "광전자 분광법(photoemission spectroscopy)에서 광자가 방출될 때 반동(recoil) 효과는 고에너지 영역(Hard X-ray)에서 에너지 손실과 스펙트럼 모양을 결정짓는 핵심 요소입니다.", "motivation": "그래핀과 같은 2차원 물질에서 하드 X선 광전자 분광(HAXPES)을 수행할 때, 원자 핵의 반동과 전자 간의 다체 효과가 섞여 나타나는 스펙트럼의 비대칭성을 정확히 분리하고 모델링하고자 함.", "result": "기존의 Fujikawa-Takata 누적량 형식만으로는 비대칭성을 설명하기 어려웠으나, 전자 반응의 고유한 형상과 포논 반동 커널을 분리하여 합성(convolution)함으로써 실험 데이터를 성공적으로 재현함.", "implication": "고에너지 광전자 분광에서 물질 고유의 전자 상태(many-body response)를 정확히 추출하기 위해서는 단순히 포논 반동 효과만을 고려하는 것이 아니라 전자적 비대칭성을 통합적으로 처리해야 함을 보여줌.", "novelty": "0.8~8 keV의 넓은 에너지 범위에서 그래핀의 C 1s 코어 레벨 스펙트럼을 정량적으로 분석하여, 반동 효과와 전자적 기여도를 성공적으로 분리해냄.", "unresolved": "이 모델이 다른 2차원 탄소 동소체나 더 복잡한 van der Waals 이질 구조에서도 보편적으로 적용 가능한지는 추가 검증이 필요함.", "future_work": "다른 2차원 물질 및 더 복잡한 결정 구조에 본 기법을 적용하여 다체 효과와 반동의 상호작용을 체계적으로 분류하는 연구.", "concepts": [{"term": "Hard X-ray Photoemission (HAXPES)", "why_emerged": "표면 민감도가 높은 기존 ARPES와 달리 시료의 벌크 전자 구조를 더 깊게 들여다보기 위해 등장함.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "기존의 soft X-ray ARPES와 상호 보완적이며, 고에너지 분해능을 위해 점차 활용도가 높아짐."}, {"term": "Fujikawa-Takata cumulant formalism", "why_emerged": "광전자 방출 과정에서 나타나는 비대칭적인 에너지 손실 스펙트럼을 수학적으로 해석하기 위해 도입됨.", "origin": "Fujikawa와 Takata에 의해 제안된 이론적 틀.", "connections": "X선 분광학에서 다체 효과를 고려한 스펙트럼 분석의 표준적인 모델 중 하나임."}], "english_summary": ["Investigates the interplay between nuclear recoil and electronic asymmetry in C 1s HAXPES of graphene.", "Demonstrates that standard recoil formalisms fail to capture observed spectral asymmetry.", "Proposes a new convolution model separating photon-energy independent electronic response and phonon recoil kernels.", "Achieves excellent agreement with experimental data from 0.8 to 8 keV without parameter refitting."]}}, {"title": "Tuning the Fermi surface of MoTe2 by Nb doping", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/nqff-vzcg", "authors": "Andrew P. Weber, Iñigo Robredo, Philipp Rüßmann, et al.", "last_authors": "J. Enrique Ortega, Julen Ibañez-Azpiroz", "summary": "Ab initio calculations and angle-resolved photoemission experiments demonstrate that the bulk and surface electronic structure of Weyl semimetal candidate ${\\mathrm{MoTe}}_{2}$ changes significantly by tuning the chemical potential by le ted magnets with symmetry-enforced spin split bands. Direct spectroscopic evidence for their existence has been reported in several materials. For example, inelastic neutron scattering (INS) has recently been used to witness a splitting of magnon bands in MnTe that is compatible with altermagnetism. Here, we present polarized INS results on MnF 2 showing that it is altermagnetic. Our data reveal a splitting coming from the long-range dipolar coupling. Furthermore, using a domain-biased sample, the data reveal a nonzero chirality in the neutron scattering cross section that reverses the sign between the two magnon modes. It is this feature that clearly demonstrates altermagnetism in MnF 2 . This finding highlights the potential for polarized INS to characterize altermagnets through its sensitivity to fine structure in magnon spectra.", "tier": "B_IMPORTANT_CONDMAT", "score": "9", "reason": "Experimental investigation of altermagnetism using neutrons, highly relevant.", "tags": ["altermagnetism", "MnF2", "neutron-scattering"], "image": "", "briefing": {"background": "알터마그네틱(Altermagnetic)은 강자성과 반강자성의 특징을 모두 가지면서도 대칭성에 의해 강제된 스핀 분할 밴드를 가진 새로운 자기 질서입니다. 이를 검증하기 위해서는 스핀 동역학의 미세 구조를 관찰할 수 있는 고정밀 분광학적 방법이 필요합니다.", "motivation": "MnF2가 알터마그네틱 성질을 띠는지 여부를 편극 중성자 산란을 통해 실험적으로 입증하고자 합니다.", "result": "편극 비탄성 중성자 산란(INS)을 통해 MnF2의 마그논 밴드 분할을 관찰하였으며, 특히 도메인 편향 시료에서 키랄성(chirality)이 관측되어 알터마그네틱 상태를 확증했습니다.", "implication": "스핀 분할의 대칭성을 직접 관측함으로써 알터마그네틱 재료를 구분하는 명확한 기준을 제시했습니다.", "novelty": "편극 중성자 산란이 스핀 구조와 동역학을 얼마나 정밀하게 분리할 수 있는지 보여주었으며, 이는 altermagnetism 연구의 표준적인 실험 도구가 될 것입니다.", "unresolved": "쌍극자 결합에 의한 스핀 분할과 대칭성에 의한 본질적 알터마그네틱 분할의 정량적 기여도를 완벽히 분리하는 것은 여전히 도전 과제입니다.", "future_work": "다른 알터마그네틱 후보군에 대해 편극 INS를 적용하여 재료 라이브러리를 확장할 것으로 예상됩니다.", "concepts": [{"term": "알터마그네틱 (Altermagnetism)", "why_emerged": "기존의 반강자성 분류로는 설명되지 않는 비-자성(non-relativistic) 스핀 분할 현상을 이해하기 위해 제안되었습니다.", "origin": "최근 이론(예: Jungwirth 등)에서 체계화", "connections": "반강자성, 스핀트로닉스, 베리 곡률"}, {"term": "편극 중성자 산란 -curvature dipole. Consequently, the Berry curvature quadrupole (BCQ) can provide a contribution to the nonlinear Hall response, scaling as $\\tau^2$, where $\\tau$ denotes the relaxation time. We derive a gauge-covariant Wannier interpolation formula that enables efficient evaluation of the BCQ directly from first-principles Wannier tight-binding Hamiltonians. Applying this framework to $\\mathrm{KV_2Se_2O}$, we calculate the momentum-space distribution of the BCQ and the associated chemical potential dependent nonlinear conductivity. The momentum-resolved analysis reveals that the dominant contribution originates from spin-orbit coupling induced avoided arossings, directly linking the gap structure to the sign-changing nonlinear response. Our work establishes a general first-principles route to higher-order quantum-geometric responses in altermagnets, opening avenues for exploring nonlinear Hall effects in next-generation spintronic and magnetoelectronic devices.", "tier": "B_IMPORTANT_CONDMAT", "score": "9", "reason": "Direct hit on altermagnetism, Berry curvature, and anomalous Hall effect in a specific compound.", "tags": ["theory", "KV2Se2O", "altermagnetism"], "image": "https://arxiv.org/html/2610.41274v1/fig1_ab2_centerlines_bpanel_aligned.png", "briefing": {"background": "알터마그네틱(Altermagnetism)은 순 자화가 0이면서도 시간 반전 대칭성이 깨져 있어 운동량에 따른 스핀 분할이 발생하는 새로운 자기 질서입니다. 이는 차세대 스핀트로닉스 분야에서 큰 관심을 받고 있습니다.", "motivation": "알터마그네틱 물질에서 전형적인 1차 비선형 홀 효과가 대칭성에 의해 금지되는 경우, 베리 곡률 사중극자(BCQ)에 의한 3차 비선형 홀 효과가 나타날 수 있는지 이론적으로 규명하고자 합니다.", "result": "제1원리 계산을 바탕으로 KV2Se2O 물질에서의 BCQ 분포를 계산하였으며, 스핀-궤도 결합에 의한 밴드 교차점이 부호가 바뀌는 비선형 전도도 응답의 원천임을 확인했습니다.", "implication": "알터마그네틱 시스템에서 고차원 양자 기하학적 수송 현상을 설계하고 제어할 수 있는 이론적 방법론을 제시하였습니다.", "novelty": "베리 곡률 사중극자를 효율적으로 계산하기 위한 게이지 공변 워니어 보간법을 도입했으며, 구체적인 알터마그네틱 물질에서의 비선형 홀 응답을 예측했습니다.", "unresolved": "실제 실험적 측정 데이터와 비교한 계산 결과의 검증이 여전히 필요하며, 고차 비선형 응답을 정밀하게 분리해내는 실험적 노력이 뒤따라야 합니다.", "future_work": "다른 알터마그네틱 화합물로의 확장 연구 및 비선형 홀 효과를 활용한 소자 응용 연구 oreover, spin-orbit coupling enables symmetry-selective interactions through which the ferromagnetic moment controls the altermagnetic domain manifold, with its out-of-plane and in-plane components biasing the time-reversal ($Z_2$) and orientational ($Z_3$) sectors, respectively. Our results reveal how two symmetry-distinct magnetic orders can retain separate ordering tendencies while remaining strongly coupled, providing a route towards internal control of altermagnetic domain states.", "tier": "B_IMPORTANT_CONDMAT", "score": "9", "reason": "Investigation of altermagnetism and ferromagnetism in doped MnTe, a key material of interest.; demoted from A: broad CM, not direct user/project hit", "tags": ["material", "altermagnetism", "ferromagnetism"], "image": "https://arxiv.org/html/2610.40870v1/fig1_20261019.png", "briefing": {"background": "강자성과 알터마그네틱은 모두 시간 반전 대칭성을 깨뜨리지만, 서로 다른 결정 대칭성 변환 특성을 가져 이 둘의 공존과 상호작용은 근본적인 학술적 주제입니다.", "motivation": "Cr이 도핑된 MnTe 시스템에서 강자성 질서와 알터마그네틱 질서가 어떻게 상호작용하며 공존할 수 있는지 실험적으로 규명하고자 했습니다.", "result": "Cr 도핑 농도를 조절하여 두 자기 질서를 제어할 수 있음을 확인했습니다. 알터마그네틱이 먼저 형성되면 강자성 전이는 크로스오버로 변하며, 강자성이 먼저 형성되면 알터마그네틱의 잔류 자기를 억제합니다.", "implication": "두 대칭성이 서로 다른 자기 질서를 정밀하게 제어하여 알터마그네틱 도메인 상태를 조작할 수 있는 가능성을 보여주었습니다.", "novelty": "서로 다른 대칭성 범주(Z2, Z3)에 속하는 두 자기 질서가 강하게 결합되어 서로의 도메인 상태를 결정짓는 메커니즘을 최초로 보고했습니다.", "unresolved": "이러한 복합 질서가 나노 스케일에서 어떻게 국부적으로 분포하는지에 대한 직접적인 이미징 데이터가 추가로 필요합니다.", "future_work": "도메인 벽에서의 수송 현상 연구 및 외부 필드를 통한 도메인 엔지니어링 실험이 예상됩니다.", "concepts": [{"term": "상호작용하는 자기 질서", "why_emerged": "서로 다른 대칭성을 가진 자기 질서 간의 경쟁과 협력 관계를 이해하여 새로운 물리적 상태를 찾기 위함.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "자기 이력 현상, 도메인 제어, 다강체 물리."}], "english_summary": ["Demonstrates coexistence of ferromagnetism and altermagnetism in Cr-doped MnTe.", "The two orders exhibit strong mutual coupling despite different symmetry properties.", "Ferromagnetic transitions and altermagnetic remanence are heavily influenced by the onset of the competing order.", "This system allows for the control of altermagnetic domain states via ferromagnetic alignment."]}}, {"title": "Spontaneous Circular Dichroism and Memory Effect from Surface Defects in Altermagnetic MnTe", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2610.41797", "authors": "Benjamin F. Mead, Isaiah Gray, Seng Huat Lee, et al.", "last_authors": "Matthew Brahlek, Liang Wu", "summary": "Altermagnetism has emerged as a new class of magnetism with vanishing magnetization and macroscopic time reversal symmetry breaking. Hexagonal MnTe is a g-wave altermagnet with a 307 K N\\'eel temperature, large spin splitting, and an anomalous Hall effect. However, the relationship between altermagnetism and the anomalous Hall effect in MnTe remains debated. Here, using optical magnetic circular dichroism, we observe hysteresis and a memory effect in a MnTe bulk crystal below 250 K. No hysteresis is seen after polishing the bulk crystal and in thin films. We conclude that the hysteresis in magnetic circular dichroism in the bulk crystal is from surface defects. The similar temperature dependence and a sign change between circular dichroism and the anomalous Hall effect indicate that the origin of the anomalous Hall effect in transport is likely not intrinsic.", "tier": "B_IMPORTANT_CONDMAT", "score": "9", "reason": "Directly explores circular dichroism and anomalous Hall in a high-interest altermagnet material MnTe.", "tags": ["experiment", "MnTe", "altermagnetism"], "image": "https://arxiv.org/html/2610.41797v1/Fig1_edit_map.png", "briefing": {"background": "MnTe는 대표적인 알터마그네틱 후보 물질로, 수송 실험에서 나타나는 비정상 홀 효과(AHE)의 기원이 본질적인지 외부 요인에 의한 것인지에 대한 논란이 있습니다.", "motivation": "MnTe의 자기원형이색성(MCD)과 비정상 홀 효과 사이의 관계를 조사하여, 실험에서 관찰되는 자기 이력 현상이 어디서 기인하는지 밝히고자 했습니다.", "result": "벌크 단결정에서 관찰된 자기 이력 현상은 표면 결함 때문이며, 연마 후에는 사라짐을 확인했습니다. 따라서 MnTe의 비정상 홀 효과는 고유(intrinsic) 특성이 아닐 가능성이 큽니다.", "implication": "알터마그네틱 물질의 수송 측정 결과를 해석할 때 표면 상태와 결함의 영향을 엄격히 배제해야 함을 시사합니다.", "novelty": "그  topological device applications."]}}, {"title": "Electric field controlled nonlinear anomalous Nernst effect in two-dimensional time-reversal symmetric systems", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/b8np-tryj", "authors": "Ying-Li Wu, Xiao-Qin Yu", "last_authors": "Ying-Li Wu, Xiao-Qin Yu", "summary": "Here, the authors demonstrate that an applied direct electric field lifts the symmetry constraint on the nonlinear anomalous Nernst effect, enabling this effect in time-reversal symmetric 2D systems with crystallographic symmetries beyond a single mirror symmetry. They propose an alternating temperature gradient, rather than a steady one, as a driving force, allowing experimental detection via second-harmonic measurements. This finding broadens the material platform for quantum-geometry-induced transverse thermoelectric effects and provides an alternative route for thermoelectric energy harvesting.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Theory on nonlinear anomalous Nernst effect in 2D systems, related to Berry curvature and anomalous Hall.", "tags": ["anomalousNernsteffect", "Berrycurvature", "2Dmaterials", "time-reversalsymmetry", "theory"], "image": "", "briefing": {"background": "비선형 응답(Nonlinear response) 연구는 반전 대칭성이 깨진 계에서 Berry 곡률 분포에 의해 발생하는 흥미로운 수송 현상을 탐구하는 분야입니다.", "motivation": "시간 반전 대칭성이 존재하는 계에서 대칭성 제약 때문에 발생하기 어려웠던 비선형 anomalous Nernst 효과를 전기장 인가를 통해 가능하게 하려는 목적입니다.", "result": "전기장이 특정 결정 대칭성을 깨뜨려 비선형 anomalous Nernst 효과를 유도하며, 교류 온도 기울기를 사용해 2차 고조파로 이를 감지할 수 있음을 이론적으로 보였습니다.", "implication": "시간 반전 대칭 물질에서도 양자 기하학적 효과를 통한 열전 수송 제어가 가능해지며, 이는 열전 에너지 수확 소자 설계의 새로운 경로를 제공합니다.", "novelty": "보통 Berry 곡률 관련 효과는 자성 물질(TRSB)에서 주로 연구되었으나, 비자성 시스템에서 전기장과 교류 기법을 활용해 수송 현상을 유도했다는 점이 독창적입니다.", "unresolved": "실제 실험에서 발생하는 노이즈와 다른 열전 효과(예: Seebeck)로부터 비선형 성분을 명확히 분리해내는 정밀 측정 기법이 요구됩니다.", "future_work": "실제 2D 물질에서의 실험적 측정 및 Berry 곡률에 의한 수송 특성 계산을 통한 정량적 비교.", "concepts": [{"term": "Anomalous Nernst Effect", "why_emerged": "자성 물질에서 자기장 없이 발생하는 횡방향 열전 효과를 이해하기 위해.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "Anomalous Hall 효과, Berry 곡률, 열전 수송"}, {"term": "Berry Curvature", "why_emerged": "결정 내 전자 파동함수의 기하학적 위상 성질을 설명하기 위해.", "origin": "Berry (1984)", "connections": "Anomalous Hall 효과, 궤도 자기 모멘트"}], "english_summary": ["Proposes electric field control of nonlinear anomalous Nernst effect.", "Enables the effect in time-reversal symmetric 2D systems.", "Utilizes alternating temperature gradients for second-harmonic detection.", "Expands the scope of quantum-geometry-induced thermoelectric harvesting."]}}, {"title": "Raman spectroscopy of the van der Waals altermagnet Co1/4NbSe2", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/f173-1z4x", "authors": "Dushyanthini Balasundaram, Bishal Thapa, Resham Babu Regmi, Nirmal J. Ghimire, Igor I. Mazin, Patrick M. Vora", "last_authors": "Igor I. Mazin, Patrick M. Vora", "summary": "We investigate the influence of Co intercalation and altermagnetic order on the lattice dynamics of the layered compound ${\\mathrm{Co}}_{1/4}{\\mathrm{NbSe}}_{2}$. Polarization-resolved Raman spectroscopy, supported by density-functional theory, enables identification of six Raman-active phonons. Co …", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Strong material interest: intercalated NbSe2 altermagnet. Electronic structure and phonon identification.", "tags": ["experiment", "NbSe2", "altermagnetism"], "image": "", "briefing": {"background": "NbSe2는 전하 밀도 파동(CDW)과 초전도성이 공존하는 대표적인 vdW 물질이며, 여기에 자성 원자를 삽입하여 자성적 위상을 탐구하는 것이 최신 트렌드입니다.", "motivation": "Co가 삽입된 NbSe2에서 나타나는 '알터자성(altermagnetism)'의 특성을 격자 동역학적 관점에서 분석하고 위상 변화를 파악하고자 합니다.", "result": "편광 분해 라만 분광법을 통해 6개의 라만 활성 포논 모드를 식별하였으며, DFT 계산과 비교하여 알터자성 상태가 격자 진동에 미치는 영향을 확인했습니다.", "implication": "알터자성 물질은 스핀 분극된 밴드를 가지면서도 거시적 자화는 없어, 스핀트로닉스와 초고속 데이터 처리에 유망한 후보가 될 수 있습니다.", "novelty": "최근 주목받는 알터자성 이론을 실제 vdW 물질(Co-NbSe2)에 적용하여 라만 분광으로 검증했다는 점에서 리더의 관심사와 밀접합니다.", "unresolved": "알터자성 순서가 CDW 상태와 어떤 직접적인 경쟁/협력 관계를 갖는지에 대한 명확한 메커니즘은 추가 규명이 필요합니다.", "future_work": "온도 변화에 따른 포논 변화를 통해 CDW와 알터자성 간의 상호작용을 정밀 관측하고 ARPES를 통한 밴드 구조 분극 측정.", "concepts": [{"term": "Altermagnetism", "why_emerged": "강자성체와 반강자성체의 장점을 모두 가진 새로운 자성 위상을 정의하기 위해.", "origin": "Šmejkal 등 (2022)", "connections": "반강자성체, 스핀 분극, 비점근적 밴드 구조"}, {"term": "Raman Spectroscopy", "why_emerged": "물질의 진동 모드를 통해 결정 구조 및 대칭성을 비파괴적으로 분석하기 위해.", "origin": "Raman (1928)", "connections": "격자 동역학, CDW 모드, 구조 상전이"}], "english_summary": ["Investigates the altermagnet Co1/4NbSe2 using polarization-resolved Raman spectroscopy.", "Identifies six Raman-active phonons in the layered structure.", "Integrates DFT calculations to explain the impact of Co intercalation.", "Contributes to understanding lattice dynamics in the emerging field of altermagnets."]}}, {"title": "Transparency-controlled multiple charge transfer in superconducting junctions with local shot-noise scanning tunneling spectroscopy", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/81fz-49c6", "authors": "Yudai Sato, Maialen Ortego Larrazabal, Jian-Feng Ge, et al.", "last_authors": "Milan P. Allan, Jiasen Niu", "summary": "Charge transport in superconducting junctions at finite voltages is governed by Andreev reflections, including multiple Andreev reflections, which are processes that enable multiple charge transfer, a hallmark that shot noise can directly quantify. Since the effective charge extracted from shot-noise measurements varies with the transparency of the junction, systematic control of transparency is essential but experimentally challenging. Here, we present shot-noise scanning tunneling microscopy measurements enabled by a newly developed amplifier, allowing access to different transparency regimes. We perform shot-noise measurements on Pb(111) with tunable transparency at 2.2 K and observe that the shot noise evolves from a single-electron tunneling regime to multiple charge-transfer regimes as transparency increases. Our results are quantitatively consistent with theoretical simulations of Andreev reflections and multiple Andreev reflections for a single-channel system. These results establish junction transparency as the key parameter governing the evolution of charge transport and demonstrate that noise STM is a powerful platform for investigating microscopic charge transport mechanisms with controlled junction transparency at the atomic scale.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "STM/STS shot-noise analysis on superconducting junctions; highly relevant technique.", "tags": ["STS", "superconductivity", "transport"], "image": "", "briefing": {"background": "초전도체 접합에서의 전하 수송은 Andreev 반사(AR)와 그 연쇄 과정인 다중 Andreev 반사(MAR)에 의해 결정됩니다. 이를 실험적으로 정밀하게 측정하는 것은 초전도 상태의 미세한 거동을 파악하는 데 필수적입니다.", "motivation": "접합부의 투명도(transparency)를 체계적으로 제어하면서 동시에 쇼트 노이즈(shot-noise)를 측정하는 것은 실험적으로 매우 어려웠기에, 이를 구현할 수 있는 새로운 STM 플랫폼이 필요했습니다.", "result": "새로운 증폭기를 도입한 노이즈 STM을 통해 Pb(111) 표면에서 투명도를 조절하며 단일 전자 터널링부터 MAR에 의한 다중 전하 수송까지의 전이를 관측했습니다.", "implication": "쇼트 노이즈 분석이 원자 단위에서 접합부의 미세 전하 수송 메커니즘을 밝히는 강력한 도구임을 입증했습니다.", "novelty": "투명도 조절이 가능한 노이즈 STM 플랫폼을 성공적으로 구현하여, 이론적으로만 알려졌던 단일 채널 다중 전하 수송 체계를 실험적으로 검증했습니다.", "unresolved": "다채널 효과가 개입되는 복잡한 접합부에서의 미세한 노이즈 분해능 및 이론과의 정량적 일치 범위에 대한 추가 검증이 필요합니다.", "future_work": "더 복잡한 강상관 물질이나 위상 초전도체 후보 물질의 계면에서 비정상적인 전하 수송 현상을 탐구할 계획입니다.", "concepts": [{"term": "Multiple Andreev Reflections (MAR)", "why_emerged": "초전도체 접합부에서 전압이 갭 전압보다 낮을 때 일어나는 다중 전하 전송 과정을 설명하기 위해 필요함.", "origin": "Klapwijk et al. (1982)에 의해 정립됨.", "connections": "Andreev 반사(AR) 이론의 확장판."}, {"term": "Shot-noise STM", "why_emerged": "터널링 전류의 통계적 노이즈를 측정하여 전류의 운반체 전하량 및 수송 메커니즘을 규명하기 위해 필요함.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "전자 수송 이론 및 나노 접합부의 전도도 양자화 연구와 연관됨."}], "english_summary": ["Developed a noise-sensitive STM platform with tunable junction transparency.", "Observed the evolution from single-electron tunneling to Multiple Andreev Reflections (MAR).", "Quantitative agreement with theoretical simulations on Pb(111) junctions.", "Establishes noise-STM as a powerful tool for atomic-scale charge transport analysis."]}}, {"title": "Chiral Casimir-Polder Force from Chiral Anomaly in Weyl Semimetals", "journal": "PRL_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/gny7-xz9s", "authors": "Liang Chen, Xu-Feng Zhao, Xun-Lei Ding, Kai Chang", "last_authors": "Xun-Lei Ding, Kai Chang", "summary": "We propose a novel chiral-discriminatory Casimir-Polder interaction between chiral molecules and Weyl semimetals, originating from the chiral anomaly. This interaction is uniquely governed by the molecule’s electric dipole moment, enabling chiral discrimination even when the optical rotatory strengt…", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Theory of chiral anomaly in Weyl semimetals with potential for experimental chiral discrimination.", "tags": ["theory", "Weylsemimetal", "chiralanomaly", "electrodynamics"], "image": "", "briefing": {"background": "Weyl 반금속(Weyl Semimetal)은 에너지 밴드가 교차하는 Weyl 노드를 가지며, 이로 인해 위상학적 특성과 관련된 변칙적인 물리 현상이 나타납니다.", "motivation": "Weyl 반금속의 고유한 키랄 변칙(chiral anomaly)이 분자와 표면 사이의 카시미르-폴더(Casimir-Polder) 힘에 어떤 비대칭적 영향을 미치는지 이론적으로 규명하고자 했습니다.", "result": "Weyl 반금속의 키랄 변칙에 의해 유도되는, 키랄 분자와의 새로운 키랄 차별적 카시미르-폴더 상호작용을 제안했습니다.", "implication": "일반적인 광학적 활성 강도가 낮더라도 물질의 키랄성을 구분할 수 있는 새로운 물리적 메커니즘을 제시했습니다.", "novelty": "위상학적 물질의 키랄 변칙을 분자 수준의 상호작용(카시미르 효과)과 직접 연결한 이론적 발견입니다.", "unresolved": "실제 실험적 환경에서 다른 반 데르 발스 힘과 이 미세한 키랄 힘을 어떻게 분리하여 검출할지에 대한 구체적인 방법론이 남았습니다.", "future_work": "특정 Weyl 반금속 후보 물질에서의 힘 측정 시뮬레이션 및 분자 키랄성 센서로서의 응용 가능성 연구.", "concepts": [{"term": "Chiral Anomaly", "why_emerged": "Weyl 반금속에서 전기장과 자기장이 평행할 때 위상 전하의 보존이 깨지는 현상을 설명하기 위해 필요함.", "origin": "입자 물리학(Adler-Bell-Jackiw anomaly)에서 유래.", "connections": "Weyl 반금속의 자기 저항(Chiral Magnetic Effect)과 직접 연결됨."}, {"term": "Casimir-Polder Force", "why_emerged": "진공의 영점 에너지로 인해 원자나 분자와 표면 사이에 발생하는 미세한 인력을 설명하기 위해 필요함.", "origin": "Casimir와 Polder (1948)가 처음 제안함.", "connections": "van der Waals 힘과 현대적 양자 전기역학 연구."}], "english_summary": ["Theoretical proposal of chiral-discriminatory Casimir-Polder force.", "Interaction originates from the chiral anomaly in Weyl semimetals.", "Enables chiral sensing based on electric dipole moments.", "Expands the application of topological materials to molecular physics."]}}, {"title": "Chirality-Resolved Spectroscopy of Caroli–de Gennes–Matricon States in Multiband FeTe1−xSex Superconductors", "journal": "PRL_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/wrds-99zb", "authors": "T. Rõõm, A. Glezer Moshe, R. Nagarajan, et al.", "last_authors": "Seongshik Oh, G. Blumberg", "summary": "Terahertz magneto-optics is established as a direct probe of helical vortex-core excitations, providing dynamical evidence for multiband CdGM states in iron-based superconductors.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Experimental study of vortex states and multiband superconductivity in iron-based superconductors.", "tags": ["superconductivity", "iron-basedsuperconductor", "magneto-optics", "vortexphysics", "electronicstructure"], "image": "", "briefing": {"background": "철 기반 초전도체(FeSC)는 다중 밴드 초전도체로, 소용돌이(vortex) 코어 내부에 결합 상태인 Caroli-de Gennes-Matricon (CdGM) 상태가 존재합니다.", "motivation": "다중 밴드 FeTe1-xSex의 소용돌이 코어 내부에서 나타나는 동역학적 특성을 파악하고, 이것이 어떤 물리적 상태를 반영하는지 조사하고자 했습니다.", "result": "테라헤르츠 자기 광학 분광법을 사용하여 FeTe1-xSex의 나선형 소용돌이 코어 들뜸(helical vortex-core excitations)을 관측했습니다.", "implication": "FeSC의 소용돌이 코어 구조가 단순하지 않고 다중 밴드 성질을 내포하고 있음을 입증했습니다.", "novelty": "테라헤르츠 분광학을 통해 vortex-core 상태를 동역학적으로 분해(chirality-resolved)했다는 점이 독창적입니다.", "unresolved": "다양한 도핑 수준 및 온도에서의 CdGM 상태의 상세한 밴드 기여도 분리.", "future_work": "타 FeSC 물질로의 확장 연구 및 소용돌이 내부의 위상학적 상태와 초전도성 간의 관계 규명.", "concepts": [{"term": "CdGM states", "why_emerged": "초전도체 소용돌이 코어 내부의 전자들이 구속되어 나타나는 에너지 준위를 설명하기 위해 필요함 nic, magnetic, and lattice degrees of freedom are often strongly intertwined in quantum materials, giving rise to competing ordered states and emergent collective phenomena. Understanding how these interactions evolve across symmetry-breaking transitions is essential for identifying new mechanisms of electronic ordering. Here, we show that the antiferromagnet chromium antimonide provides an ideal platform to investigate this interplay and uncover short-range charge-order fluctuations at the M point of the Brillouin zone, q * = ( 1 2 0 ) , persisting well above the Néel temperature, T N . These fluctuations collapse upon entering the magnetically ordered phase, revealing a direct competition between charge and spin order parameters. At T N , the phonon dispersion at q * develops a pronounced Kohn-like anomaly, signaling strong electron-phonon coupling in the vicinity of the magnetic transition. Below T N , exchange striction markedly renormalizes the associated soft phonon mode by ∼6 milli–electron volts, corresponding to the largest spin-phonon coupling reported to date. First-principles calculations show that the relevant phonon branch is unstable at the harmonic level only in the absence of magnetic order, highlighting the remarkable sensitivity of the lattice to magnetic symmetry breaking. The suppression of charge correlations upon magnetic ordering, together with the abrupt reconstruction of the phonon spectrum at T N , demonstrates an exceptional coupling between charge, spin, and lattice degrees of freedom in chromium antimonide. With its chemically simple structure and symmetry-protected altermagnetic state, chromium antimonide emerges as a model system for exploring giant spin-phonon coupling, competing electronic instabilities, and emergent broken symmetries in altermagnetic materials.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Studies competing charge/spin instabilities and magnetoelastic coupling in a magnetic material.", "tags": ["magnetism", "chargeorder", "spinorder", "stronglycorrelated", "CrSb"], "image": "", "briefing": {"background": "양자 물질에서 전자, 스핀, 격자 자유도는 서로 강하게 얽혀(entangled) 있으며, 이들 간의 경쟁은 새로운 창발적 현상(emergent phenomena)을 유도하는 물리적 근원입니다.", "motivation": "CrSb(크롬 안티모니드)라는 반강자성 시스템에서 자기적 질서와 전하 질서, 그리고 격자 진동이 어떻게 상호작용하는지 규명하고자 했습니다.", "result": "CrSb에서 자기적 질서가 형성되기 전에도 전하 질서 요동(fluctuations)이 존재함을 발견했으며, Neel 온도에서 스핀과 전하 질서가 강하게 경쟁하며 격자 변형을 유도하는 '거대 자기탄성 결합'을 확인했습니다.", "implication": "단순한 구조의 CrSb가 altermagnetism과 강한 스핀-포논 결합을 연구하는 이상적인 모델 시스템임을 입증했습니다.", "novelty": "스핀-포논 결합의 크기가 이례적으로 크며, altermagnetism과 전하 질서 간의 경쟁을 명확히 규명했다는 점에서 주목됩니다.", "unresolved": "전하 질서 요동이 구체적으로 어떤 에너지 스케일에서 시스템의 위상적 물성에 영향을 미치는지에 대한 세부 메커니즘은 추가 연구가 필요합니다.", "future_work": "ARPES를 통한 전자 구조의 변화 관측 및 더 높은 정밀도의 중성자 산란 실험이 요구됩니다.", "concepts": [{"term": "Altermagnetism", "why_emerged": "반강자성과 강자성의 특징을 모두 가지면서도 결정 대칭성에 의해 독특한 전자 구조(분리된 스핀 밴드)를 가지는 상태를 설명하기 위해 등장했습니다.", "origin": "Recent developments (2020년대 초반)에 의해 이론적으로 정립 및 명명되었습니다.", "connections": "반강자성, 비상반적 수송, 스핀-궤도 결합."}, {"term": "Kohn anomaly", "why_emerged": "금속 내 페르미 표면의 nesting 효과로 인한 포논 분산 관계의 급격한 변화를 설명하기 위해 필요했습니다.", "origin": "W. Kohn (1959)에 의해 이론적으로 예측되었습니다.", "connections": "전하 밀도 파동(CDW), 전자-포논 결합."}], "english_summary": ["Reveals competing charge and spin instabilities in CrSb, an altermagnetic candidate.", "Identifies giant magnetoelastic coupling and strong electron-phonon interaction at the Néel temperature.", "Demonstrates that charge fluctuations persist above TN and are suppressed upon magnetic ordering.", "Establishes CrSb as a model system for exploring emergent phenomena in altermagnetic materials."]}}, {"title": "Rashba-induced intersubband interference in high-harmonic generation", "journal": "Science_Advances", "source": "Gemini", "link": "https://www.science.org/doi/abs/10.1126/sciadv.aeh3388?af=R", "authors": "Hongbin Zhan, Chen Qian, Tong Wu, et al.", "last_authors": "Ya Bai, Ruifeng Lu", "summary": "High-harmonic spectroscopy is exquisitely sensitive to the electronic structure and dynamics of quantum materials, yet quantum interference between spin-orbit-split bands has remained experimentally elusive. We observe this interference between Rashba-split bands in bismuth tellurium iodide (BiTeI) driven by strong mid-infrared laser fields. The sixth harmonic exhibits intensity-scaling kinks and an M-shaped ellipticity dependence. Theoretical simulations attribute these features to spin-orbit–mediated multichannel quantum interference, which arises from Landau-Zener-Stückelberg–type intersubband tunneling between Rashba-split bands. The suppression of harmonic yield under linearly polarized pulses arises from destructive interference among electron-hole recombination pathways, whereas increasing ellipticity modifies their relative phase and induces a distinct spectral redshift. These results establish high-harmonic spectroscopy as a probe of spin-textured band dynamics and ultrafast spin-polarized currents.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Connects Rashba spin-orbit coupling to high-harmonic generation spectroscopy.", "tags": ["Rashba", "spectroscopy", "spin-orbitcoupling"], "image": "", "briefing": {"background": "고조파 분광법은 강한 레이저 펄스를 이용해 물질 내부의 전자 구조와 초고속 동역학을 탐구하는 강력한 도구입니다. 특히 스핀-궤도 결합에 의해 갈라진 밴드 사이의 양자 간섭을 관측하는 것은 복잡한 전자 구조를 이해하는 데 핵심적이지만, 실험적으로 구현하기 매우 까다롭습니다.", "motivation": "BiTeI와 같이 강한 Rashba 스핀-궤도 결합을 가진 물질에서 고조파 발생(HHG) 과정을 통해 스핀 갈라짐 밴드 간의 양자 간섭 현상을 직접적으로 증명하고자 했습니다.", "result": "BiTeI의 6차 고조파 강도와 타원율 의존성에서 나타나는 독특한 킹(kink) 현상을 발견했습니다. 이는 Rashba 밴드 사이의 Landau-Zener-Stückelberg 유형의 터널링에 의한 다채널 양자 간섭으로 설명됩니다.", "implication": "고조파 분광법이 단순히 밴드 구조를 보는 것을 넘어, 스핀이 정렬된 밴드의 동역학이나 초고속 스핀 전류를 직접 관측하는 정밀한 도구로 활용될 수 있음을 시사합니다.", "novelty": "스핀-궤도 결합 물질에서의 HHG를 통해 스핀-텍스처 밴드 동역학을 직접적으로 규명했다는 점이 중요하며, 향후 ARPES 등 정적 분석과 보완적으로 사용될 가능성이 큽니다.", "unresolved": "초고속 과정에서 발생하는 산란 효과가 간섭 현상에 미치는 미세한 영향은 완벽히 분리되지 않았으며, 더 복잡한 스핀 구조를 가진 물질에 대한 일반화가 필요합니다.", "future_work": "더 다양한 위상학적 물질이나 강상관 물질로의 확장 연구 및 레이저 파라미터 변화에 따른 스핀 전류 제어 실험이 예상됩니다.", "concepts": [{"term": "Rashba-split bands", "why_emerged": "역전 대칭성이 깨진 계면이나 물질 내부에서 스핀-궤도 결합에 의해 에너지가 스핀 상태에 따라 갈라지는 현상을 설명하기 위해 도입됨.", "origin": "Rashba와 Sheka(1959년)에 의해 처음 제안됨.", "connections": "스핀-운동량 고정(spin-momentum locking), 위상 절연체 표면 상태와 밀접하게 연결됨."}, {"term": "High-harmonic generation (HHG)", "why_emerged": "원자/분자 단위의 초고속 전자 동역학을 실시간으로 추적하기 위해 등장함.", "origin": "1980년대 후반 가스 원자에서 처음 관측됨.", "connections": "양자 터널링, 극초단 레이저 펄스 분광법과 결합하여 응집물질 물리학의 차세대 탐침으로 부상함."}, {"term": "Landau-Zener-Stückelberg tunneling", "why_emerged": "두 에너지 준위가 교차하거나 가까울 때, 외부 장에 의해 전자가 비단열적으로 이동하는 확률을 기술하기 위해 필요함.", "origin": "Landau(1932년), Zener(1932년), Stückelberg(1932년)가 독립적으로 정립함.", "connections": "반도체 양자점, 초전도 큐비트, 최근에는 강한 광장을 받는 고체 내부 전자 동역학에 널리 적용됨."}], "english_summary": ["High-harmonic spectroscopy reveals quantum interference between Rashba-split bands in BiTeI.", "The observed intensity kinks and ellipticity dependence signify intersubband tunneling.", "This approach establishes HHG as a probe for ultrafast spin-polarized currents.", "It provides insights into spin-textured band dynamics beyond traditional static spectroscopy."]}}, {"title": "Tunneling spectroscopy of topological insulator Josephson junctions", "journal": "Science_Advances", "source": "Gemini", "link": "https://www.science.org/doi/abs/10.1126/sciadv.aeg0687?af=R", "authors": "Jakob Schluck, Ella Nikodem, Anton Montag, et al.", "last_authors": "Fabian Hassler, Yoichi Ando", "summary": "In the seminal proposal by Fu and Kane, the superconducting proximity effect is used to realize topological superconductivity in the topological surface state (TSS) of a 3D topological insulator (TI). In a Josephson junction made on the TI surface, the spin-momentum locking of the TSS guarantees the existence of spin nondegenerate, perfectly transmitted Andreev modes. These modes lead to gap closing as a function of the superconducting phase difference φ. Here, we report the observation of highly transmissive Andreev modes in a TI Josephson junction, probed via tunnel contacts and φ controlled by a flux loop. Within our experimental resolution, they could indicate a gap closing and reopening. This phenomenon is observed for a wide range of chemical potentials, supporting its TSS origin. Under an applied magnetic field, highly transmissive modes are observed locally, matching theoretical predictions for Josephson vortices in the TSS. Our results support the fundamental role of spin-momentum locking in the Andreev physics in the TSS.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Tunneling spectroscopy on topological insulator Josephson junctions, highly relevant to user's interests.", "tags": ["spectroscopy", "topologicalinsulator", "superconductivity", "Josephsonjunction"], "image": "", "briefing": {"background": "Fu와 Kane의 제안 이후, 3차원 위상 절연체 표면 상태(TSS)와 초전도체를 결합하여 위상 초전도성을 구현하고 마요라나 페르미온을 탐구하려는 시도가 활발합니다. Josephson 접합에서의 Andreev 모드는 그 핵심 증거가 됩니다.", "motivation": "위상 절연체 Josephson 접합에서 TSS의 스핀-운동량 고정 특성으로 인해 발생하는 고투과 Andreev 모드를 직접 실험적으로 관측하고 검증하고자 했습니다.", "result": "터널링 분광법을 통해 위상 절연체 접합에서 위상차(φ)에 의존하는 고투과 Andreev 모드를 관측했습니다. 이는 자기장 하에서 Josephson 와동의 거동과 일치하며 TSS 기원임을 뒷받침합니다.", "implication": "위상 절연체 표면의 위상 초전도성 구현 가능성을 실증적으로 강화하며, 향후 토폴로지 양자 연산의 기반이 되는 Josephson 접합 소자 연구에 중요한 이정표가 됩니다.", "novelty": "TSS의 스핀-운동량 고정이 실제 실험에서 초전도 근접 효과에 어떻게 기여하는지를 국소적으로 직접 관측했다는 점에서 높은 가치가 있습니다.", "unresolved": "실험적 분해능의 한계로 인해 간극이 닫히고 다시 열리는 현상을 완벽하게 확인하지는 못했으며, 더 정밀한 도핑 제어가 필요합니다.", "future_work": "저온 환경에서의 마요라나 결합 상태(bound state) 직접 감지 실험 및 외부 자기장 하에서의 위상적 결함 연구가 예상됩니다.", "concepts": [{"term": "Andreev modes", "why_emerged": "초전도체와 일반 금속(혹은 TSS) 계면에서 전자-정공 변환 과정으로 인해 발생하는 에너지 준위를 기술하기 위해 필요함.", "origin": "Andreev(1964년)에 의해 이론적 정립.", "connections": "Josephson 접합의 위상차-전류 관계, 위상 초전도체에서의 마요라나 모드 형성과 직결됨."}, {"term": "Spin-momentum locking", "why_emerged": "위상 절연체 표면에서 전자의 운동량 방향과 스핀 방향이 일대일로 대응되는 독특한 기하학적 구조를 설명하기 위해 등장함.", "origin": "Hasan, Kane 등 위상 물질 초기 이론가들에 의해 확립됨.", "connections": "위상 절연체, 스핀 홀 효과, 비산란성 전류 수송."}, {"term": "Josephson junction", "why_emerged": "두 초전도체 사이의 위상차에 따른 전류 흐름을 연구하기 위해 필요함.", "origin": "Josephson(1962년)이 이론적으로 예측함.", "connections": "SQUID, 양자 컴퓨터의 큐비트 소자, 위상 초전도성 실험의 핵심 플랫폼."}], "english_summary": ["Experimental observation of highly transmissive Andreev modes in TI Josephson junctions.", "Results match predictions for spin-momentum-locked surface state transport.", "Supports the realization of topological superconductivity via proximity effects.", "Magnetic field measurements confirm the TSS origin through Josephson vortex behavior."]}}, {"title": "Current-driven transient dynamics of magnetic-octupole domain walls in noncollinear antiferromagnets", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2610.42065", "authors": "Myoung-Woo Yoo, Axel Hoffmann", "last_authors": "Myoung-Woo Yoo, Axel Hoffmann", "summary": "Current-driven magnetic-octupole domain walls in noncollinear antiferromagnets are promising for fast spintronic devices, yet their transient dynamics are not yet fully understood. Here, we investigate spin-orbit-torque-driven domain-wall motion in Mn$_\\text{3}$Sn using a multipole micromagnetic framework. The three symmetry-related 60{\\deg} walls exhibit equivalent current-driven dynamics, unlike their field-driven motion. For a representative 60{\\deg} wall, the post-pulse motion is governed by relaxation of the current-induced rotation of the surrounding octupole domains, with a characteristic time of approximately 33 ps quantitatively captured by a uniform-domain analytic model. By resolving spatially nonuniform texture dynamics beyond this analytic description, the simulations further reveal an additional slow relaxation in a composite 180{\\deg} wall associated with the relative motion of its constituent walls. The post-pulse response also varies systematically with the exchange stiffness and magnetic anisotropies. These results identify distinct domain and internal-coordinate relaxation channels and establish the intrinsic time scales governing pulse-controlled positioning of magnetic-octupole domain walls in antiferromagnetic spintronic devices.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Detailed simulation of domain walls in Mn3Sn, a key kagome altermagnet material of interest.", "tags": ["simulation", "Mn3Sn", "altermagnetism"], "image": "https://arxiv.org/html/2610.42065v1/Fig1.png", "briefing": {"background": "Mn3Sn과 같은 비공선형 반강자석은 카고메 격자 구조에서 발생하는 자성 옥튜폴(magnetic octupole)과 앨터자성(altermagnetism) 특성으로 인해 차세대 초고속 스핀트로닉스 재료로 주목받고 있습니다.", "motivation": "Mn3Sn 내 자성 옥튜폴 도메인 벽이 전류(스핀-궤도 토크)에 의해 어떻게 움직이는지, 특히 펄스 인가 후의 과도적 동역학을 정량적으로 이해하고자 했습니다.", "result": "마이크로자기 시뮬레이션을 통해 60도 및 180도 도메인 벽의 동역학을 분석했습니다. 펄스 후 도메인 회전의 완화 시간(약 33ps)을 도출하고, 도메인 내의 복잡한 텍스처 변화를 식별했습니다.", "implication": "Mn3Sn 기반 소자의 초고속 제어를 위한 물리적 시간 척도를 제시하였으며, 스핀트로닉스 소자의 효율적인 설계를 가능하게 합니다.", "novelty": "기존의 정적 혹은 단순화된 모델을 넘어, 공간적으로 불균일한 텍스처 동역학을 다루어 펄스 제어의 내재적 물리 한계를 명확히 규명했습니다.", "unresolved": "실제 실험에서의 샘플 결함이나 거칠기가 시뮬레이션 결과에 미치는 구체적인 영향은 여전히 연구가 필요합니다.", "future_work": "초고속 자기 광학 커 효과(MOKE) 실험을 통한 시뮬레이션 결과 검증 및 교환 강성(exchange stiffness) 변화에 따른 최적화 연구가 예상됩니다.", "concepts": [{"term": "Magnetic octupole", "why_emerged": "비공선형 반강자석에서 자화가 0임에도 불구하고 발생하는 고차 자성 모멘트를 설명하기 위해 필요함.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "이상 홀 효과(AHE), Mn3Sn의 비정상 홀 전도성 연구와 깊은 관련."}, {"term": "Altermagnetism", "why_emerged": "강자성과 반강자성의 장점을 모두 갖춘 새로운 자기 질서 형태를 분류하기 위해 최근 등장함.", "origin": "Šmejkal, Jungwirth 등에 의해 최근 이론적으로 정립됨.", "connections": "비교차 대칭성, 스핀 분할 밴드 구조, 초고속 스핀트로닉스."}, {"term": "Spin-orbit torque (SOT)", "why_emerged": "전류를 이용해 자성체의 자화 방향을 효율적으로 뒤집거나 이동시키기 위한 메커니즘으로 필요함.", "origin": "2010년대 초중반 Miron 등 다양한 연구팀에 의해 실험적 증명.", "connections": "스핀-궤도 결합, 전이금속/중금속 이중층 구조, 초고속 메모리 소자."}], "english_summary": ["Micromagnetic simulation of current-driven domain-wall dynamics in Mn3Sn.", "Identifies a 33 ps relaxation time for magnetic-octupole domain-wall motion.", "Resolves spatial texture dynamics in composite 180-degree domain walls.", "Provides intrinsic timescales for pulse-controlled antiferromagnetic spintronics."]}}, {"title": "Emergent Skyrmion Hall Effect in d-wave Altermagnets at Finite Temperature", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2608.27107", "authors": "Tingting Liu, Bingyu Sun, Fengyue Zhu, et al.", "last_authors": "Yang Liu, Minghui Qin", "summary": "Altermagnets combine compensated magnetic order with unconventional symmetry-dependent responses, offering a promising platform for spintronic applications. Here, we show that a voltage-controlled magnetic-anisotropy gradient drives altermagnetic (ATM) skyrmions in a nearly rectilinear, Hall-free manner in the absence of thermal fluctuations, owing to their strongly compensated gyrotropic response. Thermal magnons qualitatively modify this behavior by increasing the longitudinal drag through magnon--skyrmion scattering and generating a transverse reaction force through handedness-dependent skew scattering. Owing to the anisotropic altermagnetic magnon band structure, the relative transport weights of the two magnon handednesses are interchanged between propagation along the $x$ and $y$ directions, resulting in transverse skyrmion drifts of opposite sign. By contrast, along the high-symmetry direction, the two magnon handednesses remain degenerate and their transverse contributions cancel, preserving Hall-free motion even at finite temperature. We thus uncover a thermally emergent anisotropic skyrmion Hall effect whose direction-dependent magnitude and sign originate from the intrinsic symmetry-dependent magnon spectrum, making it a generic finite-temperature dynamical feature of ATM skyrmions. Our results establish a low-power route toward electrically controlled and thermally tunable ATM skyrmion transport.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Relevant to altermagnetism and transport phenomena in magnetic materials.", "tags": ["altermagnet", "transport", "magnetic"], "image": "https://arxiv.org/html/2608.27107v2/fig3.png", "briefing": {"background": "알터자성은 스핀 편극 밴드 구조를 가지면서도 순 자기 모멘트가 0인 새로운 형태의 자성 물질로, 기존의 강자성체나 반강자성체와는 다른 독특한 대칭성을 가집니다. 이는 스핀트로닉스 분야에서 새로운 응용 가능성을 제시하며, 특히 토폴로지적 스핀 구조인 스커미온과 결합될 때 그 동역학은 큰 관심을 받고 있습니다.", "motivation": "이전 연구들은 알터자성체에서 스커미온이 열 요동이 없는 이상적인 상황에서는 '홀 효과' 없이 직진 운동을 할 것이라고 예측했습니다. 하지만 실제 물질에서 온도는 항상 존재하며, 유한 온도에서 마그논(스핀파의 양자)과 같은 열적 여기들이 스커미온의 동역학에 어떤 영향을 미칠지는 명확히 이해되지 않았습니다.", "result": "이 논문은 d-파 알터자성체에서 유한 온도 시 열적 마그논이 스커미온 전송에 질적으로 다른 영향을 미친다는 것을 보여줍니다. 마그논-스커미온 산란과 스큐 산란으로 인해, 특정 방향으로 전파될 때 이방적인 스커미온 홀 효과가 열적으로 발생합니다. 고대칭 방향에서는 두 마그논 손대칭성의 기여가 상쇄되어 홀 효과가 나타나지 않지만, 다른 방향에서는 스커미온 홀 효과의 방향과 크기가 마그논 밴드 구조에 따라 달라집니다.", "implication": "이 결과는 알터자성 스커미온 전송이 전기적으로 제어될 수 있을 뿐만 아니라 온도에 의해 조절될 수 있는 새로운 저전력 스핀트로닉스 기술의 길을 열 수 있음을 의미합니다. 스커미온 홀 효과의 이방성은 알터자성체의 고유한 마그논 스펙트럼에서 비롯되므로, 알터자성 스커미온의 일반적인 유한 온도 동역학적 특징으로 간주될 수 있습니다.", "novelty": "이 연구는 d-파 알터자성체에서 '열적으로 유도되는 이방적인 스커미온 홀 효과'를 예측하며, 이는 이전에는 알려지지 않은 유한 온도에서의 동역학적 특성입니다. 알터자성이라는 새로운 물질군과 스커미온의 동역학적 특성을 연결하고, 마그논 스펙트럼의 대칭성이 운송 현상에 미치는 영향을 밝혀냈다는 점에서 중요하며, 사용자 관심사인 알터자성과 자성 물질의 운송 현상에 직접적으로 관련됩니다.", "unresolved": "이 연구는 이론적 예측이므로, d-파 알터자성체에서 스커미온을 안정적으로 형성하고 이러한 열적 이방성 스커미온 홀 효과를 실험적으로 검증하는 것이 필요합니다. 구체적인 물질 후보군이나 실험적 구현의 어려움에 대한 논의는 초록에서 찾아보기 어렵습니다.", "future_work": "제안된 이론적 예측을 실험적으로 검증하기 위한 노력이 필요합니다. 다양한 알터자성체의 대칭성이나 스커미온 유형에 대한 추가적인 이론적 탐구가 이루어질 수 있습니다. 또한, 이러한 원리를 활용한 저전력 스핀트로닉스 소자 개발 연구가 이어질 것으로 예상됩니다.", "concepts": [{"term": "Altermagnet", "why_emerged": "강자성체의 스핀 편극 밴드 구조와 반강자성체의 보상된 자기 정렬을 동시에 갖는 물질에 대한 새로운 분류가 필요하여 등장했습니다. 이는 스핀트로닉스 분야에서 새로운 응용 가능성을 제시합니다.", "origin": "2020년대 초반에 이론적으로 예측되고 실험적으로 확인되기 시작한 비교적 새로운 개념입니다.", "connections": "강자성, 반강자성, 스핀트로닉스, 자기 토폴로지 물질."}, {"term": "Skyrmion Hall Effect", "why_emerged": "스커미온이 전류에 의해 움직일 때, 진행 방향에 수직한 방향으로 휘어지는 현상으로, 스커미온 기반 소자 개발 시 스커미온의 이동 제어에 중요한 역할을 합니다. 이는 스커미온의 토폴로지적 특성으로 인해 발생합니다.", "origin": "자기 스커미온의 발견 이후 스커미온 다이내믹스 연구 과정에서 이론적으로 예측되고 실험적으로 관찰되었습니다.", "connections": "자기 스커미온, 토폴로지적 특성, 홀 효과, 스핀-궤도 토크."}, {"term": "Magnon", "why_emerged": "자기 정렬된 시스템(강자성체, 반강자성체 등)에서 스핀 파동의 양자화된 준입자로, 자기적 여기를 설명하고 온도 효과나 자성체 내 상호작용을 이해하는 데 필수적입니다.", "origin": "Felix Bloch가 강자성체의 저온 특성을 설명하기 위해 스핀 파동 개념을 제안하면서 시작되었고, 나중에 양자화되어 마그논으로 불리게 되었습니다.", "connections": "스핀 파동, 포논, 준입자, 강자성, 반강자성, 스핀트로닉스."}, {"term": "d-wave Altermagnet", "why_emerged": "알터자성체의 스핀 편극 밴드 구조가 k 공간에서 특정 대칭(d-wave)을 가질 때 나타나는 특성을 설명하기 위해 필요합니다. 이는 알터자성체의 다양한 종류와 그에 따른 물리적 특성 차이를 분류하고 이해하는 데 중요합니다.", "origin": "알터자성 개념이 정립되면서 다양한 결정 대칭에 따른 밴드 구조의 스핀 분리 패턴을 설명하기 위해 도입되었습니다.", "connections": "알터자성, 밴드 구조, 대칭성, 스핀 편극."}], "english_summary": ["This paper theoretically investigates skyrmion transport in d-wave altermagnets, a novel magnetic phase.", "It finds that thermal magnons qualitatively modify skyrmion dynamics, leading to a thermally emergent anisotropic skyrmion Hall effect.", "This Hall effect's direction and magnitude are determined by the intrinsic altermagnetic magnon band structure and handedness-dependent magnon-skyrmion scattering.", "The results establish a low-power route toward electrically controlled and thermally tunable altermagnetic skyrmion transport.", "This work provides insights into finite-temperature dynamic features of altermagnetic skyrmions for spintronic applications."]}}, {"title": "Mirror-symmetry engineering of altermagnetism based on monolayer hexagonal lattices", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2610.41589", "authors": "Han-Bing Li, Zhi-Gang Shao", "last_authors": "Han-Bing Li, Zhi-Gang Shao", "summary": "Altermagnetism (AM) is a novel collinear antiferromagnetic phase characterized by spin-polarized bands and zero net magnetization. However, realizing AM in monolayer hexagonal lattices is strongly constrained by lattice symmetry. Here, we propose a mirror-symmetry-based design principle and implementation scheme for realizing AM based on monolayer hexagonal lattices and validate it using holey graphyne (HGY) as a representative system. By examining hydrogenated nonmetal units X–H (X = B, C, N, P, and S) introduced along the mirror-symmetry axis and extending the analysis to N–F, we identify the configurations that form two antiparallel spin sublattices related by mirror reflection. The N–H structure forms a stable altermagnetic ground state, with a momentum-dependent spin splitting up to 148.2 meV. The magnetism originates from π \\pi – π \\pi superexchange interactions, and H/F functionalization stabilizes intrinsic AM by regulating the local charge distribution. Our work offers insights into the design of light-element altermagnetic materials. Keywords: altermagnetism, spin splitting, two-dimensional, hexagonal lattices, mirror-symmetry", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Proposes a design principle for altermagnetism in 2D hexagonal lattices, directly relevant to user interests.", "tags": ["theory", "altermagnetism", "monolayer"], "image": "https://arxiv.org/html/2610.41589v1/Fig1.png", "briefing": {"background": "알터자성은 스핀트로닉스 응용에 매우 유망한 새로운 자성 위상입니다. 그러나 단층 육각형 격자 구조와 같은 저차원 물질에서 알터자성을 구현하는 것은 물질의 대칭성 제약으로 인해 매우 어렵습니다.", "motivation": "단층 육각형 격자에서 알터자성을 안정적으로 구현하기 위한 효과적인 설계 원리와 방법론이 부족한 상황이었습니다. 특히 가벼운 원소 기반의 2D 알터자성 물질을 디자인하는 원리에 대한 필요성이 있었습니다.", "result": "이 논문은 단층 육각형 격자에서 거울 대칭을 기반으로 알터자성을 구현하는 설계 원리를 제안하고, 이를 Holey Graphyne (HGY)에 적용하여 검증했습니다. 거울 대칭 축을 따라 수소화된 비금속 단위(X-H)를 도입함으로써 거울 대칭으로 연결된 반평행 스핀 부분 격자를 형성할 수 있음을 보였습니다. 특히 N-H 구조는 안정적인 알터자성 기저 상태를 형성하며, 최대 148.2 meV의 큰 스핀 분리를 나타냅니다.", "implication": "이 연구는 단층 육각형 격자와 같은 2D 시스템에서 가벼운 원소 기반의 알터자성 물질을 설계할 수 있는 구체적인 전략을 제공합니다. 이는 기능화(수소화 또는 불소화)를 통해 국부적인 전하 분포를 조절함으로써 고유한 알터자성을 안정화시킬 수 있음을 시사하며, 새로운 2D 스핀트로닉스 소자 개발에 기여할 수 있습니다.", "novelty": "단층 육각형 격자에서 알터자성을 구현하는 데 있어 대칭성 제약을 거울 대칭 엔지니어링으로 극복하는 이론적 설계 원리를 제안했다는 점에서 독창적입니다. 가벼운 원소와 2D 물질을 활용한 알터자성 연구는 사용자 관심사인 2D 물질과 알터자성 분야에 직접적으로 관련됩니다. 높은 스핀 분리 에너지를 예측한 점도 주목할 만합니다.", "unresolved": "이 연구는 이론적인 예측에 기반하고 있습니다. 제안된 N-H 기능화된 HGY와 같은 2D 알터자성 물질의 실제 합성 및 실험적 검증이 필요합니다. 이러한 구조를 안정적으로 합성하는 과정에서의 실제적인 어려움은 초록에서 다루어지지 않았습니다.", "future_work": "제안된 2D 알터자성 물질의 실험적 합성과 특성 분석이 뒤따라야 할 것입니다. 다른 기능화 방식이나 육각형 격자 유형에 대한 추가적인 이론적 계산 또는 DFT 연구가 가능하며, 이러한 시스템의 스핀 수송 특성에 대한 연구도 중요합니다.", "concepts": [{"term": "Altermagnetism (AM)", "why_emerged": "기존의 강자성체와 반강자성체로는 설명할 수 없는 새로운 형태의 자기 질서를 기술하기 위해 제안되었습니다. 넷 자기 모멘트는 없으나 스핀 편극 밴드를 가지는 특징으로 스핀트로닉스 응용 가능성을 제시합니다.", "origin": "2020년대 초반에 이론적으로 예측되고 실험적으로 확인되기 시작한 비교적 새로운 개념입니다.", "connections": "강자성, 반강자성, 스핀 편극, 스핀트로닉스, 자기 토폴로지."}, {"term": "Monolayer hexagonal lattices", "why_emerged": "그래핀과 같은 2차원 물질은 독특한 전자적, 광학적, 역학적 특성으로 인해 새로운 양자 현상 및 소자 개발에 활용됩니다. 이러한 육각형 격자 구조는 특정 대칭성을 가지며, 스핀트로닉스나 토폴로지 물질 연구에 중요합니다.", "origin": "그래핀의 발견 이후 2차원 물질 연구가 활발해지면서 광범위하게 연구되었습니다.", "connections": "그래핀, 2D 물질, 반데르발스 헤테로구조, 육각형 보론 질화물."}, {"term": "Spin splitting", "why_emerged": "스핀-궤도 상호작용이나 자기적 대칭성 파괴에 의해 전자의 에너지 밴드가 스핀 업/다운 상태에 따라 분리되는 현상입니다. 스핀트로닉스에서 스핀을 제어하고 활용하는 데 핵심적인 개념입니다.", "origin": "밴드 이론 및 스핀-궤도 상호작용 연구에서 자연스럽게 파생되었으며, Rashba 효과, Zeeman 효과 등 다양한 형태로 나타납니다.", "connections": "스핀-궤도 상호작용, 밴드 구조, Rashba 효과, Zeeman 효과, 스핀 편극."}, {"term": "Superexchange interaction", "why_emerged": "직접적인 교환 상호작용이 약하거나 불가능한 경우, 비자성 이온을 매개로 인접한 자성 이온들 사이에 발생하는 간접적인 교환 상호작용을 설명하기 위해 도입되었습니다. 많은 산화물과 화합물에서 자기 질서를 결정하는 주요 메커니즘입니다.", "origin": "Hendrick van Vleck와 Philip W. Anderson에 의해 발전되었습니다.", "connections": "교환 상호작용, 자기 질서, 전이 금속 산화물, 반강자성."}], "english_summary": ["This theoretical study proposes a mirror-symmetry-based design principle for realizing altermagnetism in monolayer hexagonal lattices.", "It demonstrates that introducing hydrogenated nonmetal units (e.g., N-H) along the mirror-symmetry axis can induce stable altermagnetic states in holey graphyne.", "The N-H structure exhibits a large momentum-dependent spin splitting (up to 148.2 meV) driven by pi-pi superexchange interactions.", "This work offers a viable route to engineering intrinsic altermagnetism in light-element 2D materials.", "It has implications for designing novel 2D spintronic devices."]}}, {"title": "Preparation of a Laughlin-like fractional Chern insulator on a superconducting quantum processor", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2610.41017", "authors": "Kamil Dutkiewicz, B\\'arbara Andrade, Geza Giedke, Tobias Grass", "last_authors": "Geza Giedke, Tobias Grass", "summary": "Fractional Chern insulators (FCIs) are lattice analogues of fractional quantum Hall states, hosting topological order and fractionalized anyonic excitations. Their realization poses a demanding target for quantum simulation. Here, we realize a bosonic FCI on an IBM Nighthawk superconducting quantum processor using classically optimized variational circuits. We target a Laughlin-like state that is an exact zero-energy ground state of a long-range parent Hamiltonian on a torus, eliminating physical edges and providing a favorable geometry for accessing fractional quantum Hall physics in a small system. On a $4\\times4$ qubit lattice, we prepare both the four-boson FCI ground state and a three-boson state hosting two quasiholes. Measurements of particle densities and correlations reproduce the characteristic structure of the target states, while reconstructed chiral magnetization currents resolve the circulating current pattern associated with the quasiholes. The preparation of these strongly correlated topological states with shallow circuits establishes a route toward the digital simulation and manipulation of fractionalized excitations, including measurements of topological invariants and anyonic braiding.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Demonstration of fractional Chern insulator state on quantum processor; directly relevant to topological phases.", "tags": ["topological", "Cherninsulator", "superconducting"], "image": "https://arxiv.org/html/2610.41017v1/fig2.png", "briefing": {"background": "분수 양자 홀(FQH) 상태는 토폴로지적 질서와 분수화된 여기(애니온)를 가지는 이국적인 물질 상태입니다. 분수 Chern 절연체(FCIs)는 이러한 FQH 상태의 격자 아날로그로서, 강한 자기장 없이도 토폴로지적 위상을 연구할 수 있는 플랫폼을 제공합니다. 이러한 상태를 양자 프로세서에서 구현하고 제어하는 것은 응집 물질 물리학 및 양자 컴퓨팅 분야의 핵심 목표입니다.", "motivation": "FCIs와 같은 강상관 토폴로지 상태를 시뮬레이션하는 것은 고전적인 컴퓨터로는 매우 계산 비용이 많이 듭니다. 양자 프로세서를 활용한 양자 시뮬레이션은 이러한 난제를 극복하고, 분수화된 여기를 더 깊이 이해하고 제어할 수 있는 길을 열 수 있습니다.", "result": "이 논문은 IBM Nighthawk 초전도 양자 프로세서에서 고전적으로 최적화된 변분 회로를 사용하여 보손성 Laughlin-like FCI를 성공적으로 구현했습니다. 4x4 큐비트 격자에서 4보손 FCI 기저 상태와 2개의 유사정공(quasiholes)을 포함하는 3보손 상태를 모두 준비했습니다. 입자 밀도 및 상관 관계 측정과 재구성된 카이랄 자화 전류는 대상 상태의 특징적인 구조와 유사정공과 관련된 순환 전류 패턴을 재현함을 확인했습니다.", "implication": "이 결과는 양자 하드웨어에서 분수화된 여기를 디지털로 시뮬레이션하고 조작하는 데 중요한 진전을 보여줍니다. 이는 토폴로지 불변량(예: Chern 수)을 직접 측정하고 애니온 엮음(braiding)을 수행하는 새로운 가능성을 열어주며, 이는 토폴로지 양자 컴퓨팅에 필수적인 단계입니다.", "novelty": "초전도 양자 프로세서에서 Laughlin-like FCI 및 유사정공을 직접적으로 실험적으로 구현했다는 점에서 매우 새롭습니다. 이는 양자 시뮬레이션의 어려운 목표 중 하나이며, 적은 깊이의 회로로 강상관 토폴로지 상태를 성공적으로 준비한 것은 기술적인 성과입니다. 이는 사용자 관심사인 토폴로지 위상, Majorana 물리학(애니온 및 토폴로지 양자 컴퓨팅과 관련)에 직접적으로 관련됩니다.", "unresolved": "초록에는 시스템 크기나 충실도(fidelity)에 대한 명시적인 한계가 언급되어 있지 않지만, 현재의 양자 프로세서는 여전히 제한적인 크기와 안정성을 가집니다. 더 큰 시스템으로 확장하고 더 높은 일관성 시간을 달성하는 것이 향후 과제가 될 것입니다. 'Laughlin-like'라는 표현은 라플린 상태의 모든 특성을 직접 에뮬레이션한 것이 아니라 유사한 특성을 가진 상태임을 의미할 수 있습니다.", "future_work": "더 큰 큐비트 격자로 시뮬레이션을 확장하고, 더 복잡한 상태를 구현하기 위한 회로 깊이와 충실도를 개선하는 것이 필요합니다. 토폴로지 불변량(예: Chern 수)의 직접 측정 및 애니온 엮음의 실험적 시연이 다음 목표가 될 것입니다. 다른 유형의 FCIs 또는 FQH 상태를 탐구하는 연구도 가능합니다.", "concepts": [{"term": "Fractional Chern Insulators (FCIs)", "why_emerged": "강력한 자기장 없이도 양자 홀 효과와 유사한 분수 양자 홀 상태를 격자 시스템에서 구현하기 위해 제안되었습니다. 이는 토폴로지적 질서와 분수화된 여기를 연구하는 새로운 플랫폼을 제공합니다.", "origin": "2010년대 초반에 이론적으로 예측되었습니다.", "connections": "분수 양자 홀 효과, Chern insulator, 토폴로지 물질, 양자 시뮬레이션."}, {"term": "Topological order", "why_emerged": "Landau의 대칭성 파괴 이론으로 설명할 수 없는 새로운 형태의 물질 상태를 기술하기 위해 도입되었습니다. 이 상태는 국소적인 섭동에 강인하며 분수화된 여기(애니온)를 가집니다.", "origin": "Frank Wilczek의 애니온 개념과 Xiao-Gang Wen의 양자 스핀 액체 연구에서 발전되었습니다.", "connections": "양자 홀 효과, 분수 양자 홀 효과, 애니온, 위상 양자 컴퓨팅, Majorana physics."}, {"term": "Fractionalized anyonic excitations", "why_emerged": "2차원 시스템에서만 존재할 수 있는 양자 통계가 페르미온/보손과는 다른 준입자(애니온)를 설명하기 위해 필요합니다. 분수 양자 홀 상태와 같은 토폴로지적 질서를 갖는 물질에서 전하와 스핀이 분수화된 형태로 나타납니다.", "origin": "Frank Wilczek이 애니온 개념을 제안하였으며, 분수 양자 홀 효과의 실험적 발견과 함께 그 중요성이 부각되었습니다.", "connections": "양자 홀 효과, 토폴로지 위상, 위상 양자 컴퓨팅, 보존, 페르미온."}, {"term": "Superconducting quantum processor", "why_emerged": "양자 컴퓨팅을 실현하기 위한 주요 하드웨어 플랫폼 중 하나로, 초전도 회로를 사용하여 큐비트를 구현하고 제어함으로써 양자 알고리즘을 실행하거나 양자 시뮬레이션을 수행할 수 있도록 하기 위해 개발되었습니다.", "origin": "IBM, Google 등 주요 연구 기관과 기업에서 활발히 개발 중인 양자 컴퓨터 기술입니다.", "connections": "큐비트, 양자 컴퓨팅, 양자 시뮬레이션, 초전도."}], "english_summary": ["This work demonstrates the realization of a bosonic Laughlin-like Fractional Chern Insulator (FCI) on an IBM superconducting quantum processor.", "Using classically optimized variational circuits, they prepared both the four-boson FCI ground state and a three-boson state with two quasiholes on a 4x4 qubit lattice.", "Characteristic particle densities, correlations, and chiral magnetization currents associated with quasiholes were successfully reproduced.", "This study establishes a promising route for digital simulation and manipulation of fractionalized excitations.", "It signifies progress towards measuring topological invariants and performing anyonic braiding for topological quantum computing."]}}, {"title": "Quantum-Geometric Subgap Second-Harmonic Generation in PT-Symmetric Antiferromagnetic Insulators", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2610.41167", "authors": "Shakeel Ahmad, Fei Xue", "last_authors": "Shakeel Ahmad, Fei Xue", "summary": "Although quantum geometry plays an established role in electronic transport and optical responses, the contribution of the time-reversal-odd Riemannian connection to fully subgap responses remains less explored. Here we identify intrinsic second-harmonic generation in PT-symmetric antiferromagnets, predominantly governed by the real sector of the interband Hermitian connection and arising entirely from virtual interband transitions. In bilayer MnBi$_2$Te$_4$, the response persists in trivial phases but is enhanced in the layer-Chern phase and reverses sign with N\\'eel order, offering a probe of quantum geometry and phase-sensitive readout of antiferromagnetic order without mobile carriers or real excitations.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Investigates quantum geometry and topological phases in MnBi2Te4 bilayers, a material of direct interest.", "tags": ["theory", "MnBi2Te4", "topological"], "image": "https://arxiv.org/html/2610.41167v1/figure01.png", "briefing": {"background": "양자 기하학(quantum geometry)은 전하 수송 및 광학적 응답에서 중요한 역할을 하는 것으로 알려져 있습니다. 특히 자기 질서가 있는 절연체에서 전하 캐리어나 실제 여기(excitation) 없이 자기 질서를 탐지하고, 물질의 근본적인 양자 기하학적 특성을 이해하는 것은 응집물질 물리학에서 중요한 과제입니다. 2차 조화파 발생(SHG)과 같은 비선형 광학 효과는 물질의 대칭성 및 전자 구조에 대한 민감한 정보를 제공할 수 있습니다.", "motivation": "시간 역전 대칭이 깨진(time-reversal-odd) 리만 연결(Riemannian connection)이 서브갭(subgap) 응답에 기여하는 바는 아직 충분히 탐구되지 않았습니다. 이 연구는 PT 대칭을 가지는 반강자성 절연체, 특히 이중층 MnBi2Te4에서 양자 기하학이 어떻게 고유한 2차 조화파 발생(SHG)을 유도하는지 이론적으로 조사하여, 이러한 미탐구 영역을 밝히고자 합니다. 전하 이동 없이 자기 질서를 탐지하는 새로운 방법을 모색하는 것이 주요 동기입니다.", "result": "이 연구는 PT 대칭 반강자성체에서 고유한 2차 조화파 발생(SHG)이 발생하는 것을 이론적으로 밝혀냈습니다. 이 SHG는 주로 밴드 간 헤르미트 연결(interband Hermitian connection)의 실수부에 의해 지배되며, 가상 밴드 간 전이(virtual interband transitions)에서 기인합니다. 특히 이중층 MnBi2Te4에서는 이러한 SHG 응답이 위상학적으로 자명한(trivial) 상에서도 존재하지만, 레이어-천(layer-Chern) 상에서 더욱 증폭되며, 네엘(Néel) 질서에 따라 신호의 부호가 반전되는 것을 발견했습니다.", "implication": "이 결과는 전하 캐리어나 실제 여기 없이도 물질의 양자 기하학적 특성을 비접촉식으로 탐지할 수 있는 새로운 방법을 제공합니다. 또한 반강자성 질서의 네엘 벡터(Néel vector) 방향에 대한 위상 민감(phase-sensitive) 정보를 얻을 수 있어, 절연체 반강자성체의 미시적 자기 질서를 연구하는 강력한 도구가 될 수 있음을 시사합니다. 이는 MnBi2Te4와 같은 자기 위상 물질 연구에 중요한 의미를 가집니다.", "novelty": "이 연구는 시간 역전 대칭이 깨진 양자 기하학적 연결(Riemannian connection)이 서브갭 광학 응답에 미치는 영향을 명확히 규명했습니다. 특히 MnBi2Te4와 같은 PT 대칭 반강자성 절연체에서 양자 기하학에 의해 유도되는 고유한 2차 조화파 발생(SHG)을 제안하며, 이는 이동 전하 캐리어나 실제 여기 없이 반강자성 질서와 양자 기하학을 동시에 탐지할 수 있는 새로운 비접촉 방식입니다. 이는 독자의 관심사인 MnBi2Te4 물질에서 자기 질서 및 위상학적 특성을 연구하는 데 중요한 새 관점을 제시합니다.", "unresolved": "이 연구는 이론적 제안이므로, 제안된 2차 조화파 발생(SHG) 신호를 실험적으로 검증하는 것이 필요합니다. 특히 서브갭 응답이 위상학적으로 자명한(trivial) 상에서도 나타난다고 하지만, 실제 실험에서 신호 크기가 충분히 커서 쉽게 관측될 수 있을지는 미지수입니다. 또한, '주로 실수부에 의해 지배된다'고 언급된 밴드 간 헤르미트 연결의 다른 잠재적 기여에 대한 추가 탐구가 필요할 수 있습니다.", "future_work": "제안된 양자 기하학적 2차 조화파 발생(SHG)을 이중층 MnBi2Te4 및 유사한 PT 대칭 반강자성 물질에서 실험적으로 검증하는 것이 가장 시급합니다. 또한, 다양한 자기 질서 및 위상학적 상전이 조건 하에서 SHG 신호의 변화를 체계적으로 연구하여 반강자성 질서의 다이나믹스와 양자 기하학의 상호작용을 심도 있게 이해할 수 있습니다. 나아가, 다른 종류의 비선형 광학 응답과의 연관성을 탐색하는 것도 흥미로운 후속 연구가 될 것입니다.", "concepts": [{"term": "양자 기하학 (Quantum Geometry)", "why_emerged": "물질의 전자기적 특성, 특히 위상학적 특성을 이해하는 데 밴드 구조의 국소적인 기하학적 특성이 중요하다는 인식이 생기면서 등장했습니다. 전자의 운동은 밴드 구조 내에서 단순한 에너지뿐만 아니라 밴드간의 기하학적 연결성(예: 베리 접속)에 의해 영향을 받기 때문입니다.", "origin": "베리 위상(Berry phase) 개념과 관련이 깊으며, 이를 일반화하고 확장하여 밴드 공간의 미터법(metric)과 곡률(curvature)을 포함하는 개념으로 발전했습니다. 초기 개념은 마이클 베리(Michael Berry)의 베리 위상(1984)에서 출발했지만, 양자 기하학이라는 포괄적인 용어는 이후 응집물질 물리학에서 베리 곡률(Berry curvature), 양자 미터법(quantum metric) 등을 포함하는 넓은 의미로 정착되었습니다.", "connections": "베리 위상, 베리 곡률, 양자 미터법, 홀 효과(Hall effect, 특히 이상 홀 효과), 다이아마그네티즘(diamagnetism), 비선형 광학(nonlinear optics) 등 다양한 전송 및 광학 현상과 밀접하게 연결됩니다."}, {"term": "2차 조화파 발생 (Second-Harmonic Generation, SHG)", "why_emerged": "물질의 비선형 광학적 특성을 연구하고, 특정 대칭성을 가진 물질을 탐지하며, 초고속 광학 스위칭 등 응용 분야를 위해 중요하게 연구되었습니다. 물질에 입사된 빛의 주파수와는 다른, 정수배의 주파수를 가진 빛이 방출되는 현상입니다.", "origin": "1961년 피터 프랑켄(Peter Franken) 등이 루비 레이저를 사용하여 처음으로 실험적으로 관찰했습니다.", "connections": "3차 조화파 발생(Third-Harmonic Generation, THG)과 같은 고차 비선형 광학 현상, 라만 산란(Raman scattering), 물질의 결정 대칭성 분석, 계면 연구 등에 활용됩니다."}, {"term": "PT 대칭 반강자성 절연체 (PT-Symmetric Antiferromagnetic Insulators)", "why_emerged": "반강자성체에서 네엘(Néel) 질서가 시간 역전 대칭(T)을 깨뜨리지만, 공간 반전(P)과 시간 역전(T) 연산의 결합된 대칭(PT)은 유지되는 경우입니다. 이러한 물질은 독특한 위상학적 특성이나 광학적 특성을 가질 수 있어 새로운 기능성 물질 탐색에 중요합니다 ctric field also drives a spin current, the spin splitter effect, and a nearly forward scattering event that flips spin moves an electron to the other spin band at almost unchanged velocity. We show that the spin current shares the protection of the charge current only when the fluctuations conserve spin. Solving the Boltzmann equation with the full collision operator, including its change with the magnetic order, we find that forward flips equalize the two spin populations at equal energy at the quasiparticle rate, which in two dimensions grows linearly with the correlation length, whereas spin conserving fluctuations relax the spin current at a rate comparable to the charge relaxation rate. Fluctuations with the same resistivity can thus move the spin splitter ratio in opposite directions. Energy conservation protects the part of the spin current that follows the band shift of the occupied states, and the splitting blocks forward flips once the spin Fermi lines lie farther apart than the inverse correlation length. A disorder series at fixed reduced temperature measures the initial fall of the ratio with the magnetic resistivity independent of the order amplitude, and the growth of this slope toward the transition identifies spin flip critical fluctuations.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Investigates critical scattering and spin currents in altermagnets, highly relevant to user interest in magnetism.", "tags": ["theory", "altermagnetism", "transport"], "image": "https://arxiv.org/html/2610.41419v1/figures/fig_prl_xi.png", "briefing": {"background": "자동 브리핑을 생성하지 못했습니다. 초록과 원문 링크를 기준으로 빠르게 확인하세요.", "motivation": "초록 정보만으로는 분야 내부의 구체적 동기를 안정적으로 요약하기 어렵습니다.", "result": "Near a magnetic transition, critical fluctuations scatter electrons strongly, but the charge current survives, because long wavelength fluctuations barely turn the electron velocity. In an altermagnet the electric field also drives a spin current, the spin splitter effect, a   else { title.textContent = r.title || ''; }

  if (r.link) { const link = document.createElement('a'); link.className = 'link'; link.href = r.link; link.target = '_blank'; link.rel = 'noopener noreferrer'; link.textContent = 'Open paper'; headText.appendChild(link); }
