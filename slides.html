<title>Daily Paper Slideshow</title>
<style>
  :root {
    color-scheme: light;
    --bg: #f6f7f4;
    --paper: #ffffff;
    --ink: #111827;
    --muted: #64748b;
    --line: #d8ddd2;
    --accent: #176b87;
    --accent-2: #9a3412;
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; overflow: auto; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: var(--bg); color: var(--ink); }
  .shell { max-width: 1500px; min-height: 100vh; margin: 0 auto; padding: 14px 18px; display: flex; flex-direction: column; }
  .topbar { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 16px; }
  .top-actions { display: flex; align-items: center; gap: 10px; }
  .topbar a, button { border: 1px solid var(--line); border-radius: 8px; background: var(--paper); color: var(--ink); padding: 10px 14px; font-weight: 700; text-decoration: none; cursor: pointer; }
  button.primary { background: var(--accent); border-color: var(--accent); color: white; }
  button:disabled { opacity: 0.45; cursor: not-allowed; }
  .counter { color: var(--muted); font-weight: 700; }
  .slide { min-height: calc(100vh - 82px); background: var(--paper); border: 1px solid var(--line); border-radius: 10px; padding: 18px; box-shadow: 0 18px 42px rgba(15, 23, 42, 0.10); display: grid; grid-template-columns: minmax(310px, 0.86fr) minmax(0, 1.55fr); gap: 18px; overflow: visible; }
  .paper-head { min-width: 0; min-height: 0; overflow: visible; display: flex; flex-direction: column; gap: 12px; }
  .figure { margin: 0; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: #f8fafc; }
  .figure img { display: block; width: 100%; max-height: 41vh; object-fit: contain; background: white; }
  .figure figcaption { padding: 7px 10px; color: var(--muted); font-size: 12px; line-height: 1.3; }
  .head-text { display: flex; flex-direction: column; gap: 9px; min-width: 0; }
  .badges { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .badge { border-radius: 999px; padding: 5px 9px; background: #eef2ff; color: #3730a3; font-size: 12px; font-weight: 800; }
  .score { background: #fee2e2; color: #991b1b; }
  h1 { margin: 0; font-size: 25px; line-height: 1.15; letter-spacing: 0; overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
  h1 a { color: inherit; text-decoration-color: rgba(23, 107, 135, 0.35); text-decoration-thickness: 2px; text-underline-offset: 4px; }
  h1 a:hover { color: var(--accent); text-decoration-color: var(--accent); }
  .meta, .authors, .why, .abstract { font-size: 13px; line-height: 1.45; }
  .meta, .authors { color: var(--muted); }
  .why strong, .abstract strong, .authors strong { color: var(--ink); }
  .authors { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .why { border-left: 4px solid var(--accent-2); padding-left: 10px; color: #374151; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .abstract { border-top: 1px solid var(--line); padding-top: 14px; color: #374151; }
  .original-abstract { border-top: 1px solid var(--line); padding-top: 10px; color: #374151; font-size: 11.5px; line-height: 1.35; overflow-wrap: anywhere; }
  .original-abstract strong { display: block; margin-bottom: 4px; color: var(--ink); }
  .tags { display: flex; flex-wrap: wrap; gap: 8px; }
  .tag { border-radius: 999px; padding: 4px 8px; background: #f1f5f9; color: #475569; font-size: 12px; font-weight: 700; }
  .head-text > .link { display: none; }
  .briefing { min-width: 0; min-height: 0; overflow: visible; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); grid-auto-rows: minmax(0, auto); align-content: start; gap: 11px 18px; border-top: 0; padding-top: 0; }
  .brief-section { min-width: 0; }
  .brief-section.wide { grid-column: 1 / -1; }
  .brief-section h2 { margin: 0 0 4px; font-size: 14px; line-height: 1.22; color: #0f766e; letter-spacing: 0; }
  .brief-section p, .brief-section li { margin: 0; font-size: 12.5px; line-height: 1.42; color: #1f2937; overflow-wrap: anywhere; }
  .brief-section ul { margin: 0; padding-left: 20px; }
  .concepts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 9px 14px; }
  .concept { border-top: 1px solid var(--line); padding-top: 7px; }
  .concept h3 { margin: 0 0 4px; font-size: 13px; color: #7c2d12; letter-spacing: 0; }
  .concept p { margin: 2px 0 0; font-size: 11.5px; line-height: 1.35; color: #374151; overflow-wrap: anywhere; }
  .concept b { color: #111827; }
  .link { color: var(--accent); font-weight: 800; text-decoration: none; }
  .empty { padding: 48px; background: var(--paper); border: 1px solid var(--line); border-radius: 12px; color: var(--muted); }
  @media (max-width: 860px) {
    .shell { padding: 14px; }
    .topbar, .top-actions { align-items: stretch; flex-direction: column; }
    .slide, .briefing, .concepts { grid-template-columns: 1fr; }
    .slide { min-height: auto; overflow: visible; display: grid; }
    h1 { font-size: 28px; }
  }
</style>

const slides = [{"title": "Topological superconductivity on a kagome magnet coupled to a Rashba superconductor", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/7nt6-s5rw", "authors": "Koji Kudo, Ryota Nakai, Hiroki Isobe, Kentaro Nomura", "last_authors": "Hiroki Isobe, Kentaro Nomura", "summary": "A quantum anomalous Hall system is predicted to realize topological superconductivity when proximity coupled to an $s$-wave superconductor. A kagome magnet with chiral magnetic ordering exhibits the quantum anomalous Hall effect; however, superconducting proximity to an ordinary $s$-wave superconduc…", "tier": "A_MUST_READ", "score": "10", "reason": "Directly links kagome magnets, QAH effect, and topological superconductivity; central to user projects.", "tags": ["material", "kagome", "topologicalsuperconductivity"], "image": "", "briefing": {"background": "양자 이상 홀(Quantum Anomalous Hall, QAH) 상태와 초전도체의 결합은 마요라나 페르미온을 구현할 수 있는 위상 초전도체를 생성하는 주요 경로 중 하나입니다. 특히 카고메 격자 자성체는 강한 스핀-궤도 결합과 특유의 기하학적 구조 덕분에 QAH 효과를 나타낼 가능성이 커 연구의 중심에 있습니다.", "motivation": "일반적인 s-파 초전도체와 카고메 자성체를 결합할 경우, 카고메 자성체의 카이랄 자기 정렬(chiral magnetic ordering)과 초전도 상태 사이의 정합성 문제로 인해 위상 초전도 상태를 안정적으로 유도하기 어렵다는 한계가 있었습니다.", "result": "본 연구는 Rashba 초전도체와 카고메 자성체를 결합함으로써 이 문제를 해결할 수 있음을 이론적으로 제시했습니다. Rashba 스핀-궤도 결합이 존재하는 초전도체와 결합할 경우, 카고메 자성체의 위상적 전자 구조가 초전도 쌍과 효과적으로 섞여 안정적인 위상 초전도 상태가 유도될 수 있음을 확인했습니다.", "implication": "이 결과는 카고메 격자 기반의 자성체 시스템이 위상 양자 컴퓨팅의 기초가 되는 마요라나 제로 모드를 구현하는 새로운 플랫폼이 될 수 있음을 시사합니다.", "novelty": "기존의 단순 s-파 근접 효과를 넘어 Rashba 효과를 도입하여 카고메 자성체의 자기적 특성과 초전도성을 조화시켰다는 점이 독창적입니다. 독자의 관심사인 카고메 자성체와 위상 초전도체의 교차점에 위치한 연구입니다.", "unresolved": "이론적 모델링이므로 실제 Rashba 초전도체-카고메 자성체 계면에서의 실험적 구현 가능성 및 계면 산란 효과 등에 대한 검증이 필요합니다.", "future_work": "실제 후보 물질 쌍을 선정하여 근접 효과에 의한 갭 형성을 ARPES나 STM으로 측정하는 실험적 연구가 뒤따를 것으로 예상됩니다.", "concepts": [{"term": "카고메 자성체 (Kagome Magnet)", "why_emerged": "기하학적 좌절(frustration)과 강한 상관관계가 얽혀 나타나는 독특한 양자 상태를 탐구하기 위해 주목받았습니다.", "origin": "초록 정보만으로는 특정하기 어려움 (전통적인 결정학 용어에서 유래)", "connections": "양자 이상 홀 효과, 위상 절연체, 스핀 액체"}, {"term": "Rashba 초전도체", "why_emerged": "반전 대칭성이 깨진 계면이나 물질에서 스핀-궤도 결합을 통해 특이한 초전도 쌍을 유도하기 위해 필요해졌습니다.", "origin": "Emmanuel Rashba (Rashba 효과)", "connections": "비중심대칭 초전도체, 스핀-궤도 결합"}, {"term": "위상 초전도체 (Topological Superconductor)", "why_emerged": "위상적으로 보호받는 마요라나 페르미온을 생성하여 결함에 강한 양자 컴퓨팅을 구현하기 위해 제안되었습니다.", "origin": "Alexei Kitaev (유사 모델 제안)", "connections": "마요라나 제로 모드, 양자 전산"}], "english_summary": ["The study proposes realizing topological superconductivity by coupling a kagome magnet to a Rashba superconductor.", "Rashba spin-orbit coupling helps overcome barriers to inducing superconductivity in chiral magnetic systems.", "The setup provides a potential platform for hosting Majorana bound states in kagome lattice systems."]}}, {"title": "Mode-selective electron-phonon coupling drives charge density waves in the kagome metals YRu3Si2 and LaRu3Si2", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2610.11689", "authors": "Wenqian Tu, Run Lv, Dingfu Shao, Yuping Sun, Wenjian Lu", "last_authors": "Yuping Sun, Wenjian Lu", "summary": "YRu 3 Si 2 and LaRu 3 Si 2 host the highest charge density wave (CDW) transition temperatures ever reported in kagome metals, T CDW ≈ 800 T_{\\mathrm{CDW}}\\approx 800 and 400 K, with propagation vectors Q CDW ≈ ( 1 / 2 , 0 , 0 ) Q_{\\mathrm{CDW}}\\approx(1/2,0,0) and ( 1 / 4 , 0 , 0 ) (1/4,0,0) , respectively. The microscopic mechanism behind these record values has remained unresolved. Here, we combine anharmonic phonon renormalization extracted from molecular dynamics driven by a machine-learned force field with mode-resolved electron-phonon coupling (EPC) analysis to identify this mechanism. The CDW is driven by mode-selective EPC: the Ru out-of-plane phonon modes couple the Ru- d x ​ z / d y ​ z d_{xz}/d_{yz} and Si- p x / p y p_{x}/p_{y} orbitals, and the phonon linewidth peaks sharply at Q CDW Q_{\\mathrm{CDW}} , while the ier": "A_MUST_READ", "score": "9", "reason": "title strong match: kagome metal", "tags": ["kagome"], "image": "", "briefing": {"background": "카고메 격자 물질은 기하학적 좌절(frustration)과 전자 간의 상관관계로 인해 전하 밀도 파동(CDW), 자기적 질서, 초전도성 등 다양한 양자 현상이 얽혀 나타납니다. 최근 AV3Sb5 및 FeGe와 같은 카고메 금속에서 이러한 현상들의 상호작용을 이해하는 것이 고체 물리학의 핵심 화두 중 하나입니다.", "motivation": "FeGe는 카고메 금속 중 드물게 반강자성(AFM)과 CDW가 공존하는 물질입니다. 본 연구는 FeGe에서 전하 밀도 파동이 형성될 때 결정 구조가 어떻게 변하며, 이러한 구조적 변화가 전자 상태와 어떻게 결합되는지를 고해상도로 관찰하고자 했습니다.", "result": "고해상도 싱크로트론 X선 회절(XRD) 실험을 통해 CDW 전이 온도에서 브래그 피크(Bragg peak)가 갈라지는 현상을 발견했습니다. 이는 FeGe에서 CDW 형성과 함께 구조적 상분리(structural phase separation)가 발생함을 시사합니다.", "implication": "구조적 피크 분리는 외부 변형(strain)을 가함으로써 이 물질의 CDW 상태나 관련 양자 상태를 조절할 수 있는 가능성을 열어줍니다. 즉, 구조적 변수를 통해 전자적 물성을 제어하는 '스트레인트로닉스(straintronics)' 적용 가능성을 보여줍니다.", "novelty": "자기적 질서를 가진 카고메 금속 FeGe에서 CDW와 결합된 미세한 구조적 변형과 상분리를 직접적으로 입증했다는 점이 중요합니다. 독자의 주요 관심사인 CsV3Sb5 등 다른 카고메 물질과의 비교 연구에 중요한 데이터가 됩니다.", "unresolved": "초록 정보만으로는 이러한 구조적 상분리가 자기적 도메인(magnetic domain)과 구체적으로 어떤 공간적 상관관계를 갖는지 완전히 설명하기 어렵습니다.", "future_work": "실제 스트레인을 가한 상태에서의 ARPES나 STM 실험을 통해, 구조적 변화가 페르미 면과 전자 밴드 구조에 구체적으로 어떤 영향을 주는지 확인하는 후속 연구가 예상됩니다.", "concepts": [{"term": "FeGe (Iron Germanate)", "why_emerged": "카고메 격자 구조를 가지면서도 자성과 CDW가 공존하는 독특한 물성을 탐구하기 위해 주목받았습니다.", "origin": "초록 정보만으로는 특정하기 어려움 (전통적인 이원계 화합물이나 최근 카고메 물성으로 재조명됨)", "connections": "AV3Sb5 (A=K, Rb, Cs) 카고메 금속, 반강자성체, CDW 시스템"}, {"term": "Charge-Density-Wave (전하 밀도 파동)", "why_emerged": "금속-절연체 전이 및 저차원 전자계의 불안정성을 설명하기 위해 제안되었습니다.", "origin": "Rudolf Peierls (이론적 예측)", "connections": "전자-포논 결합, 페르미 면 네스팅(nesting), 카고메 금속"}, {"term": "Structural Phase Separation (구조적 상분리)", "why_emerged": "단일 결정 내에서 서로 다른 대칭성이나 격자 상수를 가진 영역이 공존하는 현상을 설명하기 위함입니다.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "강상관 전자계의 불균일성, 도메인 형성, 스트레인 효과"}, {"term": "Synchrotron X-ray diffraction", "why_emerged": "매우 미세한 격자 변형이나 낮은 강도의 회절 피크를 정밀하게 측정하기 위해 강력한 X선원이 필요했습니다.", "origin": "방사광 가속기 기술의 발전", "connections": "고해상도 구조 분석, 시간 분해 rm for engineering one-dimensional correlated electron states.", "tier": "A_MUST_READ", "score": "9", "reason": "author whitelist: Yeongkwan Kim", "tags": ["nematic", "correlated"], "image": "", "briefing": {"background": "1차원 전자계는 러팅저 액체(Luttinger liquid)나 스핀-전하 분리와 같은 특이한 양자 현상을 보이며, 양자 소자 구현의 기초가 됩니다. 최근에는 벌크 물질 내부나 표면의 도메인 경계(domain wall)를 활용해 이러한 1차원 채널을 형성하려는 시도가 활발합니다.", "motivation": "강탄성(ferroelastic) 도메인 벽이 반절연성 산화물인 WO3 박막에서 안정적인 1차원 전도 채널로 기능할 수 있는지, 그리고 그 내부의 전자 상태가 어떤 상관관계를 갖는지 규명하고자 했습니다.", "result": "WO3의 강탄성 쌍정 벽(twin wall)이 표면 전하를 차폐하며 1차원 전도 채널이 됨을 확인했습니다. STM을 통해 벽과 수직한 방향의 '네마틱 유사(nematic-like)' 전하 스트라이프를 발견했으며, ARPES로 양자화된 1차원 상태를 직접 관측했습니다. 전도도는 주변보다 100배 이상 높았습니다.", "implication": "WO3 도메인 벽이 1차원 상관 전자 상태를 연구할 수 있는 새로운 플랫폼임을 입증했습니다. 특히 온도에 따른 전도도 변화가 Efros-Shklovskii 가변 거리 호핑 법칙을 따르며, 이는 쿨롱 상호작용이 중요한 역할을 함을 의미합니다.", "novelty": "STM과 ARPES를 결합하여 도메인 벽에서의 1차원 양자 상태를 직접 시각화하고 측정했다는 점이 매우 뛰어납니다. 독자가 관심 있는 네마틱 질서와 1차원 전도 특성(Luttinger liquid 후보군)이 모두 포함된 논문입니다.", "unresolved": "극저온에서 러팅저 액체 거동의 명확한 증거(멱법칙 스펙트럼 함수 등)를 확보하는 것이 과제로 남아 있습니다.", "future_work": "도메인 벽의 밀도를 조절하거나 외부 전장을 통해 1차원 채널을 실시간으로 재구성(reconfigurable)하는 소자 응용 연구가 기대됩니다.", "concepts": [{"term": "Ferroelastic domain walls (강탄성 도메인 벽)", "why_emerged": "결정 구조의 대칭성이 깨지며 발생하는 서로 다른 변형 상태 사이의 경계를 정의하기 위해 도입되었습니다.", "origin": "K. Aizu (1969년 강탄성 개념 정립)", "connections": "강유전성 도메인 벽, 다강성 물질, 나노 스케일 전도성 채널"}, {"term": "Nematic-like charge stripes (네마틱 유사 전하 스트라이프)", "why_emerged": "회전 대칭성은 깨지되 병진 대칭성은 부분적으로 유지되는 전자 질서를 설명하기 위해 등장했습니다.", "origin": "S. A. Kivelson et al. (고온 초전도체에서 제안)", "connections": "전자 네마틱성, 고온 초전도체, 강상관 전자계"}, {"term": "Efros-Shklovskii variable-range hopping (ES-VRH)", "why_emerged": "무질서한 계에서 전자 간 쿨롱 상호작용이 존재할 때의 호핑 전도 메커니즘을 설명하기 위해 제안되었습니다.", "origin": "A. L. Efros, B. I. Shklovskii (1975년)", "connections": "Anderson 국소화, 쿨롱 갭(Coulomb gap), 모트 호핑(Mott hopping)"}, {"term": "Flexoelectric polarization (플렉소 전기 분극)", "why_emerged": "불균일한 변형(strain gradient)이 물질 내부의 전기적 분극을 유도하는 현상을 설명하기 위함입니다.", "origin": "V. S. Mashkevich, K. B. Tolpygo (1950년대 이론적 제안)", "connections": "압전 효과(Piezoelectricity), 도메인 벽 전도성"}], "english_summary": ["Ferroelastic twin walls in WO3 act as 1-dimensional electronic channels via flexoelectric screening.", "STM reveals periodic, nematic-like charge stripes perpendicular to the walls.", "ARPES directly resolves quantized 1D states with significant conductance enhancement at room temperature.", "Transport data follows ES-VRH, indicating Coulomb-coupled localized states within stripe-induced potentials."]}}, {"title": "Data-Driven Variable-Exponent Analysis for Photoemission Yield Spectroscopy: An Autonomous Self-Diagnosing Framework Based on Integrated Residual Metrics", "journal": "arXiv_CondMat", "source": "keyword", "link": "https://arxiv.org/abs/2610.11331", "authors": "Shinjiro Yagyu, Takahiro Nagata, Yoshiyuki Nakajima", "last_authors": "Takahiro Nagata, Yoshiyuki Nakajima", "summary": "Photoemission yield spectroscopy (PYS) is widely used for evaluating the electronic states of materials. As automated materials discovery advances, systematic, unsupervised extraction of physical information from ambient-air PYS data becomes important. Conventional fixed-exponent analyses and logarithmic transformations suffer from heteroscedasticity, where the variance diverges in low-signal regions and estimation becomes unstable. To address this, we propose an automated, data-driven analysis framework based on the “1/n-Scan method,” which operates directly in the original signal space, removing the geometric bias inherent in log-transform-based approaches. We further integrate a self-diagnostic quality-evaluation system that quantifies the estimation uncertainty using Akaike weights, together with independent residual metrics—the normalized mean absolute error (NMAE), the RMSE-to-MAE ratio (RMR), the Durbin-Watson (DW) statistic, and a macroscopic diagnostic metric ( Δ ​ R 2 \\Delta R^{2} )—that hierarchically distinguish hardware-related data degradation from a physical-model mismatch. Applying the framework to differently doped Si samples and a polycrystalline Au reference in ambient air, we demonstrate autonomous detection, without assumptions on the emission mechanism, of the breakdown of the single-component approximation in heavily doped p-type Si, arising from the overlap of two emission components with different thresholds, as a statistical anomaly—a decrease in DW below its critical value with an auxiliary increase in Δ ​ R 2 \\Delta R^{2} , despite sound NMAE and RMR—independently confirmed by a two-component fit ( Δ ​ AIC ≈ 57 \\Delta\\text{AIC}\\approx 57 , DW recovering from 0.8 to 2.0). For heavily doped n-type Si, the gradual surface evolution was classified as a change within the single-component description. This framework provides a robust, self-diagnosing analysis engine for closed-loop autonomous materials exploration.", "tier": "A_MUST_READ", "score": "9", "reason": "title strong match: photoemission", "tags": ["photoemission"], "image": "https://arxiv.org/html/2610.11331v1/figs/fig2_si_NL9_dense.png", "briefing": {"background": "광전자 방출 수율 분광법(PYS)은 물질의 일함수나 가전자대 상단 상태를 측정하는 도구로, 대기 중에서 수행 가능해 재료 스크리닝에 유용합니다. 하지만 측정 데이터에서 물리적 정보를 추출할 때 기존의 수동적 방법은 분석가의 주관이 개입되거나 통계적 오류가 발생하기 쉽습니다.", "motivation": "자율적인 신소재 탐색을 위해, 사전 가정 없이 PYS 데이터에서 물리적 파라미터를 정확하게 추출하고 데이터의 품질을 스스로 진단할 수 있는 데이터 기반 프레임워크가 필요했습니다.", "result": "1/n-Scan법이라는 새로운 데이터 분석 알고리즘을 제안했습니다. 이 방법은 로그 변환 없이 원래 신호 영역에서 작동하여 편향을 줄이고, 아카이케 가중치와 여러 잔차 지표(DW, NMAE 등)를 사용해 물리 모델의 일치 여부와 하드웨어 노이즈를 구분해냅니다.", "implication": "고도핑된 Si와 같은 복잡한 시스템에서 단일 성분 모델이 깨지는 지점을 자동으로 감지할 수 있습니다. 이는 ARPES를 포함한 광전자 분광 데이터 분석의 자동화 및 신뢰성 향상에 기여할 수 있습니다.", "novelty": "데이터 분석의 '자가 진단(self-diagnosing)' 기능을 도입하여 모델 미스매치와 하드웨어 결함을 통계적으로 구별해낸 점이 독창적입니다. 광전자 분광법(ARPES 포함) 전반의 데이터 해석 방법론에 관심이 있는 연구자에게 유용합니다.", "unresolved": "이 프레임워크가 PYS를 넘어 다차원 데이터인 ARPES의 밴드 분산 및 스펙트럼 가중치 분석에도 직접 적용 가능한지는 추가 검증이 필요합니다.", "future_work": "폐쇄 루프(closed-loop) 형태의 자 guish between different magnetic domains and order symmetries like d-wave and g-wave.", "Shows that while altermagnetic spin splitting is SOC-independent, SOC is necessary to convert these signatures into observable charge currents.", "Provides a theoretical foundation for all-optical magnetic readout in compensated altermagnets."]}}, {"title": "Spin-orbit coupling effects in altermagnets: Interplay of weak spin and orbital ferromagnetism with relativistic splitting of electron states (Phys. Rev. B)", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2605.01780", "authors": "L. M. Sandratskii, K. Carva, V. M. Silkin", "last_authors": "K. Carva, V. M. Silkin", "summary": "The novel class of collinear compensated magnets, dubbed altermagnets, has attracted immense research attention by the property of nonrelativistic spin splitting. More recently, the properties of altermagnets caused by relativistic spin-orbit coupling (SOC) became the topic of many investigations. The aim of the paper is to contribute to a deeper understanding of the formation of relativistic effects in altermagnets. The focus of the paper is on the phenomena of weak ferromagnetism (WFM) and relativistic modification of the electron states including the interplay of these phenomena. The main tools of the study are various types of relativistic calculations based on density functional theory combined with the symmetry analysis on the basis of spin space groups. The consideration is performed on two different levels. On the first level, the atomistic magnetic structure of weak ferromagnetic state is calculated and discussed. Both spin and orbital atomic moments are taken into account. We study the dependence of the WFM moment on the strength of the SOC and obtain a peculiar nonmonotonous type of dependence. We separate the contributions of the SOC of the metal and ligand atoms to WFM. A very interesting result is obtained in quasisymmetry (QS) calculation where only the component of the SOC collinear to the Néel vector is taken into account. In QS calculation the spin WFM is absent while the orbital WFM is present. This result reveals a principal difference in the formation of the spin and orbital magnetic moments. On the second level, the study is focused on the properties of individual electron states. We introduce the notion of the magnetic structure of the electron state (MSES). It is shown how the nonrelativistic collinear spin-MSES of both metal and ligand moments and nonrelativistic compensated orbital-MSES of the ligand moments transform into complex noncollinear 3D MSESs of both spin and orbital nature giving large contributions to WFM. An important role in the formation of MSESs is played by the relativistic splitting of the accidental spin degeneracies at general k points filling the volume of the Brillouin zone. The formation of the regions of avoided crossings in the relativistic band structure is related to the nonmonotonous dependence of the WFM moment as the function of the SOC strength. The importance of the metal-ligand hybridization in the formation of the AM properties is discussed and illustrated by means of the comparison of the LDA and LDA+ U U calculations. Most of the calculations are performed for MnTe, a prototypical material for the class of altermagnets.", "tier": "A_MUST_READ", "score": "9", "reason": "Detailed electronic structure study of altermagnets (MnTe) with focus on SOC and band splitting.", "tags": ["theory", "altermagnet", "bandstructure"], "image": "https://arxiv.org/html/2605.01780v3/Fig_MnTe_magn_struct.png", "briefing": {"background": "알터마그넷(Altermagnet)은 순 자화가 0이면서도 운동량 공간에서 비상대론적인 스핀 분할을 갖는 새로운 자성 상태입니다. 최근에는 이러한 비상대론적 특성에 더해 상대론적 효과인 스핀-궤도 결합(SOC)이 밴드 구조와 자기적 성질에 어떤 영향을 미치는지에 대한 연구가 활발히 진행되고 있습니다.", "motivation": "본 연구는 대표적 알터마그넷 후보 물질인 MnTe를 대상으로 SOC가 유도하는 약강자성(Weak Ferromagnetism, WFM)의 형성 기작과 전자 상태의 상대론적 변형을 깊이 있게 이해하고자 수행되었습니다.", "result": "밀도범함수이론(DFT) 계산 결과, SOC 세기에 따른 WFM 모멘트의 비단조  "Strain-engineered long-distance supercurrent in an altermagnetic CrSb based-Josephson junction", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2610.11341", "authors": "Yifan Gao, Jin Yan, Junjie Wei, et al.", "last_authors": "Xincheng Xie, Ming Liu", "summary": "Altermagnetic materials, characterized by vanishing net magnetization and momentum-dependent spin splitting, provide a unique platform for realizing unconventional superconducting states without the detrimental stray fields. Here, we demonstrate long-distance Josephson supercurrent transport through epitaxial thin films of the strained altermagnet CrSb. We observe a dissipationless supercurrent across a lateral spacer distance of 150 nm in a CrSb-based Josephson junction, exceeding the conventional spin-singlet coherence length by nearly two orders of magnitude. This supercurrent is further accompanied by a well-defined magnetic-field-induced quantum interference pattern, providing direct evidence for genuine Josephson coupling. Our results reveal altermagnets as a promising route toward generating long-distance supercurrents without macroscopic magnetic stray fields, opening new opportunities for superconducting spintronic applications.", "tier": "A_MUST_READ", "score": "9", "reason": "Direct interest: altermagnetism and supercurrent transport in a real material system (CrSb).", "tags": ["transport", "altermagnet", "superconductivity"], "image": "https://arxiv.org/html/2610.11341v1/fig1.png", "briefing": {"background": "알터마그넷은 자기 부유장(Stray field)이 없으면서도 스핀 분할된 밴드를 가지고 있어, 초전도체와의 결합을 통해 특이한 양자 현상을 구현하기에 적합한 후보로 꼽힙니다.", "motivation": "자기적 질서가 초전도 전류를 방해하는 일반적인 현상을 넘어, 알터마그넷의 특수한 스핀 구조를 이용해 장거리 조셉슨 초전류를 구현할 수 있는지 확인하고자 했습니다.", "result": "에피택셜하게 성장된 스트레인(Strain)이 인가된 CrSb 알터마그넷 박막을 사용하여 150 nm 거리에서도 소산 없는 초전류(Supercurrent) 전송을 확인했습니다. 이는 통상적인 스핀-싱글렛 결맞음 길이보다 약 100배 긴 거리입니다. 또한, 자기장에 따른 양자 간섭 패턴을 관찰하여 실제 조셉슨 결합이 일어남을 증명했습니다.", "implication": "알터마그넷이 초전도 스핀트로닉스 소자에서 긴 거리의 정보 전달 , we expand this view by demonstrating that a deep-lying dz2 band below the Fermi level can be employed to enhance the superconducting paring strength. By using scanning tunneling microscope to mechanically change the crystal lattice of an iron-based superconductor, we observe an upward shift of the deep-lying dz2 band related feature, leading to hybridization with the primary superconducting bands at the Fermi level. We visualize the novel evidence of this band hybridization and resulting enhanced superconducting gap through quasiparticle interference imaging, providing conclusive evidence that engineering such correlations between deep and pairing-active bands is a potent mechanism for amplifying the superconducting gap. This work refines the conventional view of pairing-relevant electronic structures and establishes band hybridization as an effective way to optimize superconducting materials.", "tier": "B_IMPORTANT_CONDMAT", "score": "10", "reason": "Direct hit: STM/STS study of band hybridization and pairing in iron-based superconductors.; demoted from A: broad CM, not direct user/project hit", "tags": ["STM", "STS", "Fe-basedSC", "electronicstructure"], "image": "https://arxiv.org/static/browse/0.3.4/images/arxiv-logo-fb.png", "briefing": {"background": "철 기반 초전도체(Fe-based SC)의 메커니즘은 주로 페르미 준위 근처의 전자 밴드($d_{xz}, d_{yz}, d_{xy}$)에 집중되어 왔으며, 더 깊은 곳에 위치한 밴드의 역할은 무시되어 왔습니다.", "motivation": "페르미 준위 아래 깊숙이 위치한 $d_{z^2}$ 밴드를 페르미 준위 쪽으로 이동시켜 주된 초전도 밴드와 하이브리드화(Hybridization) 시켰을 때 초전도 페어링 강도에 어떤 영향을 주는지 탐구했습니다.", "result": "주사 터널링 현미경(STM)을 이용해 격자에 기계적 변형을 가함으로써 $d_{z^2}$ 밴드를 위로 이동시켰습니다. 그 결과, 페르미 준위의 밴드와 하이브리드화가 일어나며 초전도 갭(Superconducting gap)이 눈에 띄게 커지는 현상을 QPI(Quasiparticle Interference) 이미징을 통해 시각적으로 입증했습니다.", "implication": "페르미 준위의 밴드뿐만 아니라 깊은 밴드와의 상관관계를 엔지니어링함으로써 초전도 특성을 최적화하거나 향상시킬 수 있는 새로운 경로를 제시합니다.", "novelty": "STM/STS를 이용한 직접적인 밴드 조작과 그에 따른 보골류보프(Bogoliubov) 분산 변화를 관찰했다는 점이 혁신적입니다. 독자분의 주요 관심사인 STM/STS 및 철 기반 초전도체 연구와 직결됩니다.", "unresolved": "이러한 밴드 하이브리드화가 PORTANT_CONDMAT", "score": "9", "reason": "Direct experimental study of topological Chern insulators and edge transport.", "tags": ["experiment", "topological", "transport"], "image": "", "briefing": {"background": "천 절연체(Chern insulator)와 양자 이상 홀 효과(QAH)는 외부 자기장 없이도 시료 가장자리를 따라 소산 없는 전하 운송이 가능한 상태를 제공합니다. MnBi2Te4는 자성과 위상 기하학적 특성이 결합된 대표적인 고체 물질로, 차세대 저전력 전자 소자 구현을 위한 핵심 후보군으로 연구되고 있습니다.", "motivation": "이론적으로 천 절연체의 카이랄 가장자리 상태(chiral edge states)는 불순물이나 기하학적 결함에 의한 역산란에 면역이 있어야 합니다. 본 연구는 실제 MnBi2Te4 소자에서 인위적으로 설계된 기하학적 결함(engineered geometric defects)이 존재할 때도 이 가장자리 운송이 견고하게 유지되는지를 실험적으로 증명하고자 했습니다.", "result": "자기장 유도 Chern 절연체 상태인 MnBi2Te4 소자에서 기하학적 결함이 있음에도 불구하고 카이랄 가장자리 운송이 견고하게 유지됨을 확인했습니다. 이는 국부적인 섭동이나 결함이 전하의 단방향 흐름을 방해하지 못한다는 QAH 상태의 위상적 보호(topological protection)를 실험적으로 입증한 것입니다.", "implication": "실제 소자 제작 과정에서 발생할 수 있는 공정 결함이나 재료의 불완전성에도 불구하고 위상적 양자 상태를 이용한 전하 운송이 신뢰성 있게 유지될 수 있음을 시사합니다. 이는 견고한 양자 소자 설계의 물리적 토대가 됩니다.", "novelty": "단순한 QAH 관찰을 넘어, 인위적인 결함을 도입하여 운송 특성의 강건성(robustness)을 정량적으로 테스트했다는 점이 중요합니다. 독자께서 관심을 가지시는 자기적 위상 재료 및 수송 특성 연구와 밀접하게 연관됩니다.", "unresolved": "결함의 크기나 종류가 극단적으로 커질 경우 위상 상태가 무너지는 임계점에 대한 상세한 연구가 필요하며, 온도 상승에 따른 위상 보호 효율의 감소 메커니즘도 규명되어야 합니다.", "future_work": "더 높은 온도에서 작동하는 천 절연체 구현 및 다양한 형태의 나노 구조 결함 내에서의 양자 간섭 효과에 대한 후속 연구가 예상됩니다.", "concepts": [{"term": "Chern Insulator", "why_emerged": "자기장 없이 양자 홀 효과를 구현하기 위해 자성과 밴드 위상학을 결합하는 과정에서 제안되었습니다.", "origin": "Haldane (1988)", "connections": "Quantum Anomalous Hall Effect, Topological Insulators"}, {"term": "Chiral Edge States", "why_emerged": "벌크가 절연체일 때 경계면에서만 나타나는 단방향 전하 흐름을 설명하기 위해 도입되었습니다.", "origin": "초록 정보만으로는 특정하기 어려움 (Wen, Halperin 등)", "connections": "Bulk-boundary correspondence, Dissipationless transport"}, {"term": "MnBi2Te4", "why_emerged": "고유한 자성을 가진 최초의 위상 절연체를 찾아 양자 이상 홀 효과를 더 높은 온도에서 구현하기 위해 발견되었습니다.", "origin": "초록 정보만으로는 특정하기 어려움 (2019년경 여러 그룹 동시 발표)", "connections": "Intrinsic magnetic topological insulator, Axion insulator"}, {"term": "Topological Protection", "why_emerged": "계의 위상학적 불변량이 변하지 않는 한 국부적인 변형에도 물리량이 유지되는 성질을 설명하기 위해 사용됩니다.", "origin": "Thouless, Haldane, Kosterlitz (1980년대)", "connections": "Backscattering immunity, Robustness against disorder"}], "english_summary": ["Demonstrates robust chiral edge transport in MnBi2Te4-based Chern insulators.", "Uses engineered geometric defects to test the immunity of edge states to backscattering.", "Confirms the experimental feasibility of using topological protection for robust quantum devices.", "Provides direct evidence of unidirectional transport stability in magnetic topological materials."]}}, {"title": "Observation of Time-Reversal Symmetry Breaking in the Type-I Superconductor YbSb2", "journal": "PRL_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/drzq-lfn5", "authors": "Anshu Kataria, Shashank Srivastava, Dibyendu Samanta, et al.", "last_authors": "Sudeep Kumar Ghosh, Ravi Prakash Singh", "summary": "A hallmark property of unconventional superconductivity has been discovered in a type-I superconductor, whereas it’s normally observed only in type-II materials.", "tier": "B_IMPORTANT_CONDMAT", "score": "9", "reason": "Experimental observation of time-reversal symmetry breaking in an unconventional superconductor.", "tags": ["experiment", "unconventionalsuperconductivity", "TRSB", "YbSb2"], "image": "", "briefing": {"background": "시간 반전 대칭성 깨짐(Time-Reversal Symmetry Breaking, TRSB)은 초전도체가 비전통적(unconventional)인 페어링 메커니즘을 가지고 있음을 보여주는 강력한 증거입니다. 보통 이러한 현상은 강한 전자 상관관계를 가진 Type-II 초전도체에서 주로 발견되어 왔습니다.", "motivation": "전통적인 BCS 이론으로 설명되는 Type-I 초전도체는 대개 s-wave 페어링을 하며 시간 반전 대칭성을 유지합니다. 본 연구는 Type-I 초전도체로 알려진 YbSb2에서 예외적으로 TRSB가 나타나는지 탐구하여 초전도 현상의 새로운 카테고리를 확인하고자 했습니다.", "result": "실험을 통해 Type-I 초전도체인 YbSb2에서 시간 반전 대칭성이 깨졌음을 확인했습니다. 이는 Type-I 시스템에서도 비전통적인 초전도 상태가 존재할 수 있음을 보여주는 이례적인 결과입니다.", "implication": "기존의 Type-I 및 Type-II 초전도체 분류 체계와 페어링 대칭성 간의 고정관념을 깨는 결과입니다. YbSb2는 비전통적 초전도성을 연구하기 위한 새로운 플랫폼이 될 수 있습니다.", "novelty": "Type-I 초전도체에서 TRSB를 관측했다는 사실 자체가 매우 드문 사례이며, 독자의 관심사인 비전통적 초전도 및 TRSB 연구 주제와 직접적으로 부합합니다.", "unresolved": "YbSb2에서 TRSB가 발생하는 구체적인 미시적 메커니즘(예: 다중 밴드 효과 혹은 스핀-궤도 결합의 역할)은 아직 명확히 밝혀지지 않았습니다.", "future_work": "Muon spin relaxation (μSR) 등을 이용한 정밀한 자기장 분포 측정 및 페어링 대칭성(order parameter)의 대칭성 분석을 위한 추가 실험이 필요합니다.", "concepts": [{"term": "Time-Reversal Symmetry Breaking (TRSB)", "why_emerged": "초전도 페어링이 단순한 s-wave가 아닌 복소수 성분을 가진 위상학적 혹은 비전통적 상태인지 판별하기 위해 중요해졌습니다.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "Unconventional superconductivity, Muon spin relaxation (μSR), Sr2RuO4"}, {"term": "Type-I Superconductor", "why_emerged": "임계 자기장 이하에서 자기장을 완전히 배제(마이스너 효과)하고, 혼합 상태(vortex state) 없이 바로 상전도 상태로 전이하는 물질을 분류하기 위해 정의되었습니다.", "origin": "Abrikosov (1950년대 분류)", "connections": "Meissner effect, Critical magnetic field"}, {"term": "YbSb2", "why_emerged": "희토류 기반 화합물 중에서 특이한 전자 구조나 초전도 특성을 가진 물질을 탐색하는 과정에서 주목받았습니다.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "Heavy fermion candidate, Topological semimetal candidate"}, {"term": "Unconventional Superconductivity", "why_emerged": "전통적인 phonon-mediated BCS 이론으로 설명되지 않는 초전도 현상을 설명하기 위해 등장했습니다.", "origin": "1970-80년대 (Cuprates, Heavy fermions 발견 이후)", "connections": "High-Tc superconductors, Chiral superconductivity"}], "english_summary": ["Reports the observation of time-reversal symmetry breaking (TRSB) in YbSb2.", "The material is a Type-I superconductor, where TRSB is rarely observed compared to Type-II.", "Indicates a possible unconventional superconducting state in a classically categorized system.", "Challenges the standard pairing paradigms for Type-I superconductors."]}}, {"title": "Protection of Unconventional Superconductivity from Disorder", "journal": "PRL_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/3cn5-hb8z", "authors": "Sofie Castro Holbæk, Morten H. Christensen, Andreas Kreisel, and Brian M. Andersen", "last_authors": "Sofie Castro Holbæk, Morten H. Christensen, Andreas Kreisel, and Brian M. Andersen", "summary": "Several realizations of d -wave superconductivity on the Lieb and kagome lattices exhibit remarkably weak T c -suppression, resembling the behavior of conventional s-wave superconductors.", "tier": "B_IMPORTANT_CONDMAT", "score": "9", "reason": "Theory on unconventional superconductivity and disorder on kagome lattices, highly relevant.", "tags": ["theory", "unconventionalsuperconductivity", "kagome", "disorder"], "image": "", "briefing": {"background": "일반적으로 d-wave와 같은 비전통적 초전도체는 비자성 불순물(disorder)에 매우 취약하여 초전도 전이 온도(Tc)가 급격히 하락합니다(Abrikosov-Gorkov 이론). 이는 초전도 소자 개발이나 물질 응용에서 큰 장애물입니다.", "motivation": "최근 Lieb 및 Kagome 격자 구조를 가진 일부 물질들이 d-wave 초전도성을 가짐에도 불구하고 불순물에 대해 마치 s-wave 초전도체처럼 강한 내성을 보이는 현상이 관찰되었습니다. 본 연구는 이러한 '기하학적 보호'의 이론적 근거를 제시하고자 했습니다.", "result": "이론적 계산을 통해 Lieb 및 Kagome 격자의 특이한 밴드 구조와 궤도 구성이 d-wave 초전도 상태를 무질서로부터 보호할 수 있음을 보여주었습니다. 특정 대칭성 하에서 무질서에 의한 산란이 억제되어 Tc 하락이 미미하게 나타나는 메커니즘을 규명했습니다.", "implication": "비전통적 초전도체라도 격자 기하학을 잘 선택하면 무질서에 강한 소자를 만들 수 있음을 시사합니다. 특히 AV3Sb5와 같은 Kagome 금속의 초전도 특성을 이해하는 데 중요한 틀을 제공합니다.", "novelty": "무질서와 비전통적 초전도의 상충 관계가 격자 구조(Kagome, Lieb)에 의해 극복될 수 있다는 점을 강조했습니다. Kagome 금속(AV3Sb5) 연구를 하시는 독자께 매우 직접적인 영감을 주는 이론 연구입니다.", "unresolved": "실제 실험 물질에서 나타나는 다른 형태의 복합적인 무질서(결함, 전위 등)에 대해서도 동일한 보호 기작이 작동하는지는 추가 검증이 필요합니다.", "future_work": "Kagome 초전도체에서 불순물 농도를 제어하며 Tc의 변화를 측정하는 정밀한 실험과 비교 연구가 기대됩니다.", "concepts": [{"term": "Kagome Lattice", "why_emerged": "좌절 자성(frustrated magnetism)과 플랫 밴드(flat band) 등 특이한 양자 현상을 구현하기 위한 구조로 주목받았습니다.", "origin": "I. Syôzi (1951)", "connections": "AV3Sb5, Frustrated magnetism, Flat bands, Dirac cones"}, {"term": "d-wave Superconductivity", "why_emerged": "구리 산화물 초전도체 등에서 강한 전자 상관관계에 의한 이성분 페어링을 설명하기 위해 도입되었습니다.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "High-temperature superconductivity, Node in gap function"}, {"term": "Abrikosov-Gorkov Theory", "why_emerged": "초전도체 내의 불순물이 전이 온도(Tc)에 미치는 영향을 정량적으로 설명하기 위해 제안되었습니다.", "origin": "Abrikosov and Gor'kov (1960)", "connections": "Pair breaking, Anderson's theorem"}, {"term": "Lieb Lattice", "why_emerged": "플랫 밴드와 강자성을 연구하기 위한 이론적 모델로 제시되었으며, 최근 인공 격자에서 실현되고 있습니다.", "origin": "Elliott Lieb (1989)", "connections": "Flat band ferromagnetism, Photonic lattices"}], "english_summary": ["Theorizes how unconventional d-wave superconductivity is protected from disorder on Lieb and kagome lattices.", "Explains why some materials show weak Tc suppression despite non-magnetic impurities, violating standard expectations.", "Attributes this robustness to the specific orbital and geometric structure of the lattice.", "Directly relevant to understanding the superconductivity in kagome metals like AV3Sb5."]}}, {"title": "Anatomy of Spin--Orbit Torques in Monolayer Fe3GeTe2 and Fe3GaTe2: Insights from atomistic and momentum-space decompositions", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2608.05788", "authors": "Gusthavo M. S. Brizolla, Stepan S. Tsirkin, Yaroslav Zhumagulov, Jaroslav Fabian", "last_authors": "Yaroslav Zhumagulov, Jaroslav Fabian", "summary": "We present a systematic first-principles study of the spin-orbit torques in the ferromagnetic monolayers Fe$_3$GeTe$_2$ (FGT) and Fe$_3$GaTe$_2$ (FGaT). Despite sharing the same crystal structure (point group $D_{3h}$) and predominantly Fe~$3d$ spin-polarized bands, the two materials exhibit markedly different current-induced torques. We reveal these differences by computing the full angular dependence of the torkance---the torque per unit applied electric field---using linear-response theory with symmetry-adapted spin--orbit-coupled Wannier functions. FGaT may be viewed as a hole-doped analogue of FGT, since Ga contributes one valence electron fewer than Ge. Although the work functions differ by only about $28$~meV, the band filling near $K$ and $K'$ changes substantially: the density of states at $\\varepsilon_F$ is reduced by a factor of three and its spin polarization reverses from minority in FGT to majority in FGaT. These electronic changes are reflected in the torques resolved by time-reversal parity, sublattice, and momentum. In particular, we identify pronounced hidden torques in FGaT and relate the suppression of its fourth-harmonic Fermi-sea component to the evolution of momentum-space pockets. Finally, we discuss the emergence of such self-torques, which are not captured by the conventional picture of current-induced spin accumulation, within a symmetry-based phenomenological framework. Our results provide microscopic insight into current-induced torques in two-dimensional ferromagnets and offer guidance for defect and van der Waals engineering of layered magnetic materials.", "tier": "B_IMPORTANT_CONDMAT", "score": "9", "reason": "Direct momentum-space analysis of electronic structure in relevant vdW magnetic materials.", "tags": ["theory", "material", "ferromagnetism"], "image": "https://arxiv.org/html/2608.05788v2/fig1.png", "briefing": {"background": "2차원 반데르발스(vdW) 강자성체는 원자층 수준의 얇은 두께에서도 자성을 유지하며, 이를 전류로 제어하는 스핀-궤도 토크(SOT) 기술은 차세대 스핀트로닉스 소자의 핵심 원리입니다. 특히 Fe3GeTe2(FGT)와 같은 금속성 vdW 자성체는 높은 전도성과 조절 가능한 전자 구조 덕분에 SOT 연구의 중심에 있습니다.", "motivation": "FGT와 결정 구조가 거의 같으면서도 Ge 대신 Ga가 들어간 Fe3GaTe2(FGaT)는 FGT보다 높은 자성 전이 온도를 보이는 등 흥미로운 특성을 가집니다. 본 연구는 이 두 물질이 유사한 밴드 구조를 가짐에도 불구하고 왜 서로 다른 SOT 거동(torkance)을 보이는지 미시적인 관점에서 규명하고자 합니다.", "result": "제1원리 계산과 워니어 함수(Wannier function) 분석을 통해, FGaT를 FGT의 홀 도핑 버전으로 해석할 수 있음을 보였습니다. 비록 일함수 차이는 미미하지만, 브릴루앙 영역의 K/K' 점 근처에서 밴드 채움(band filling)이 변하고 상태 밀도(DOS)의 스핀 극성이 반전됨을 확인했습니다. 또한, FGaT에서 운동량 공간의 포켓 변화로 인해 '숨겨진 토크(hidden torques)'가 발현됨을 밝혀냈습니다.", "implication": "단순한 원소 교체(Ge -> Ga)만으로도 2차원 자성체의 SOT 효율과 대칭성을 극적으로 바꿀 수 있음을 시사합니다. 이는 vdW 이종접합 구조에서 밴드 엔지니어링을 통해 스핀 소자의 성능을 최적화할 수 있는 설계 지침을 제공합니다.", "novelty": "단순한 거시적 관찰을 넘어, SOT를 시간 반전 대칭성, 부격자(sublattice), 운동량 공간으로 분해하여 분석했습니다. 특히 사용자 관심사인 운동량 공간(ARPES 연계 가능성)에서의 밴드 구조 변화와 토크의 상관관계를 명확히 짚어냈다는 점이 중요합니다.", "unresolved": "계산 결과는 단일층(monolayer)을 기준으로 하며, 실제 다층 구조나 기판과의 계면 효과, 그리고 실제 소자 제작 시 발생할 수 있는 결함이 SOT에 미치는 영향은 추가 검증이 필요합니다.", "future_work": "실험적으로 도핑 농도를 조절하거나 게이트 전압을 이용해 페르미 준위를 이동시키면서 SOT의 변화를 직접 측정하는 연구가 뒤따를 것으로 예상됩니다.", "concepts": [{"term": "Spin-Orbit Torque (SOT)", "why_emerged": "전기적 신호로 자화 방향을 효율적으로 제어하기 위해 스핀-궤도 결합을 이용하는 방식이 필요해짐.", "origin": "2010년대 초반 Miron 및 Liu 등에 의해 실험적으로 중요성이 입증됨.", "connections": "Spin Hall Effect, Rashba Effect, Magnetic Random Access Memory (MRAM)"}, {"term": "Torkance", "why_emerged": "인가된 전기장 단위당 발생하는 토크의 양을 정량화하여 물질 고유의 SOT 효율을 비교하기 위함.", "origin": "선형 응답 이론 프레임워크 내에서 정의됨.", "connections": "Linear response theory, Kubo formula, Spin conductivity"}, {"term": "Wannier functions", "why_emerged": "블로흐 파동함수를 국소화된 기저로 변환하여 복잡한 고체 물리 계산(특히 Berry curvature 관련)을 효율적으로 수행하기 위함.", "origin": "1937년 Gregory Wannier가 제안함.", "connections": "Tight-binding model, Berry phase, First-principles calculations"}, {"term": "Hidden torques", "why_emerged": "거시적인 자화 방향이나 대칭성만으로는 설명되지 않는, 국소적인 부격자 수준에서 발생하는 토크를 설명하기 위함.", "origin": "본 논문 등 최근의 대칭성 기반 미시 분석 연구들에서 강조됨.", "connections": "Sublattice symmetry, Spin-orbit coupling, Inversion symmetry breaking"}], "english_summary": ["Comparative first-principles study of spin-orbit torques (SOT) in monolayer Fe3GeTe2 and Fe3GaTe2.", "Identified that FGaT acts as a hole-doped version of FGT, leading to substantial changes in band filling near K points and a reversal of DOS spin polarization.", "Revealed 'hidden torques' in FGaT and linked SOT variations to momentum-space pocket evolution.", "Provides microscopic insights for defect and van der Waals engineering of layered magnetic materials."]}}, {"title": "Chiral Weyl-Kondo semimetallic state through enhanced correlation in CeGaGe", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2609.32012", "authors": "Arushi, Kevin Allen, Yuan Fang, et al.", "last_authors": "Qimiao Si, Emilia Morosan", "summary": "Strongly correlated chiral materials have been proposed to host a chiral Weyl-Kondo semimetal (cWKSM) state, in which Kondo hybridization pins chirality-induced Kramers-Weyl point crossings, together with additional symmetry-enforced band crossings, near the Fermi level. Realizing this state requires a material that combines crystal chirality, non-symmorphic symmetry, and Kondo correlations, and currently there are no known materials that combine all these requirements. Here we report evidence for a cWKSM state in CeGaGe, a member of the RXY (R = rare earth; X = Al, Si; Y = Ga, Ge) family. Magnetization measurements confirm long-range antiferromagnetic order below T$_N$ = 4.7 K with a complex, canted magnetic structure. Unique to CeGaGe among the known RXY systems is a structural transition from an achiral tetragonal I4$_{1}$md structure (at high temperatures) to the chiral tetragonal P4$_{3}$ structure (at low temperatures). The structural transition in CeGaGe allows us to highlight the role of chirality in stabilizing the Kramers cWKSM state. Hall resistivity measurements with $H || c$ reveal an anomalous Hall conductivity (AHC) that is constant below the Kondo temperature $T_K \\approx 7$ K and drops sharply above it. This crossover tracks the onset of Kondo coherence rather than the magnetic ordering, which occurs at T$_N$ = 4.7 K. Together with first-principles calculations for the $P4_3$ structure, this identifies the AHC as an intrinsic, Berry-curvature-driven contribution generated by Kondo hybridization, rather than a consequence of extrinsic scattering or dynamic scalar spin chirality. These results establish CeGaGe as a rare experimental platform in which crystal chirality, strong electronic correlations, and non-trivial band topology coexist, providing the first material realization of a Kondo-driven cWKSM state.", "tier": "B_IMPORTANT_CONDMAT", "score": "9", "reason": "Experimental evidence for a novel Weyl-Kondo state in a chiral correlated material, relevant to topological semimetals.", "tags": ["material", "Weylsemimetal", "Kondoeffect"], "image": "https://arxiv.org/html/2609.32012v3/Fig1_new1.png", "briefing": {"background": "무거운 페르미온(Heavy Fermion) 시스템에서 나타나는 강한 전자 상관관계와 위상 기하학적 특성이 결합된 'Weyl-Kondo 반금속'은 현대 고체 물리학의 최전선 연구 주제입니다. 특히 결정 구조 자체에 거울 대칭성이 없는 카이랄(chiral) 물질에서 이러한 상태를 구현하는 것은 매우 드문 사례입니다.", "motivation": "이론적으로 예측된 카이랄 Weyl-Kondo 반금속(cWKSM) 상태를 실제 물질에서 확인하기 위해서는 결정 카이랄성, 비점진적 대칭성, 콘도 상관관계가 모두 필요합니다. 본 연구는 이 조건들을 만족하는 CeGaGe 물질에서 위상 상태의 증거를 찾고자 합니다.", "result": "CeGaGe가 저온에서 카이랄 구조(P43)로 전이됨을 확인하였으며, 콘도 온도(Tk ~ 7K) 이하에서 이상 홀 전도도(AHC)가 일정하게 유지되다가 Tk 위에서 급격히 감소하는 현상을 발견했습니다. 이는 AHC가 자기 정렬(Tn = 4.7K)이 아닌 콘도 하이브리드화에 의한 베리 곡률(Berry curvature)에서 기인함을 시사합니다.", "implication": "콘도 상호작용이 카이랄 구조에 의해 유도된 Weyl 점들을 페르미 준위 근처에 고정(pinning)시킬 수 있음을 실험적으로 보여주었습니다. 이는 강상관 물질에서 위상 상태를 설계하고 제어할 수 있는 새로운 경로를 제시합니다.", "novelty": "결정 카이랄성과 콘도 효과가 결합된 최초의 '카이랄 Weyl-Kondo 반금속' 후보 물질을 제시했다는 점에서 매우 혁신적입니다. 사용자 관심사인 Berry curvature와 Anomalous Hall 효과가 핵심적인 역할을 합니다.", "unresolved": "물질 내부의 복잡한 비공선(non-collinear) 자기 구조가 이상 홀 효과에 미칠 수 있는 미세한 영향에 대해서는 추가적인 중성자 산란 실험 등이 필요할 수 있습니다.", "future_work": "ARPES를 이용해 페르미 준위 근처의 Weyl 노드와 콘도 공명 피크를 직접 관찰하고, 압력이나 화학적 치환을 통해 콘도 상호작용의 세기를 조절하며 위상 전이를 연구할 것으로 보입니다.", "concepts": [{"term": "Weyl-Kondo Semimetal", "why_emerged": "콘도 하이브리드화에 의해 밴드 폭이 매우 좁아지면서 Weyl 점이 페르미 준위에 가깝게 형성되는 상태를 설명하기 위함.", "origin": "2017년 Qimiao Si 교수 그룹 등에 의해 이론적으로 제안됨.", "connections": "Heavy fermion, Weyl semimetal, Berry curvature, Strong correlation"}, {"term": "Chirality (Crystal)", "why_emerged": "거울 대칭성이나 반전 대칭성이 없는 구조에서 나타나는 고유한 물리 현상(예: Kramers-Weyl fermions)을 연구하기 위함.", "origin": "결정학의 기본 개념에서 출발함.", "connections": "Non-centrosymmetric crystals, Gyrotropic effects, Topologically protected states"}, {"term": "Kondo Hybridization", "why_emerged": "국소화된 f-전자와 전도 전자 사이의 상호작용으로 인해 형성되는 무거운 준입자 상태를 설명하기 위함.", "origin": "1960년대 Jun Kondo의 이론을 바탕으로 다체 물리 분야에서 발전함.", "connections": "Heavy fermion, Kondo insulator, Many-body resonance"}, {"term": "Anomalous Hall Conductivity (AHC)", "why_emerged": "외부 자기장 없이도 물질 내부의 자성이나 베리 곡률에 의해 발생하는 홀 효과를 설명하기 위함.", "origin": "1881년 Edwin Hall이 발견, 현대적 해석은 베리 위상과 연결됨.", "connections": "Berry curvature, Topology, Ferromagnetism"}], "english_summary": ["Discovery of a chiral Weyl-Kondo semimetal (cWKSM) state in CeGaGe through enhanced electronic correlations.", "Anomalous Hall conductivity tracks the onset of Kondo coherence rather than magnetic ordering, indicating an intrinsic Berry-curvature origin.", "First material realization combining crystal chirality, non-symmorphic symmetry, and Kondo hybridization to pin Weyl nodes near the Fermi level.", "Established CeGaGe as a platform for studying the interplay between topology and strong correlations."]}}, {"title": "Emergent gold-induced interfacial magnetism in monolayer FePS3", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2610.12041", "authors": "Giuseppe Buccoliero, Anita Polli, Marli dos Reis Cantarino, et al.", "last_authors": "Johann Coraux, Nicholas B. Brookes", "summary": "Owing to their atomically clean interfaces and extreme thinness, two-dimensional (2D) materials are ideal hosts for strong proximity effects, whereby contact with an adjacent material reshapes their ground state. Here, we demonstrate such an effect within a hybrid heterostructure, between the 2D antiferromagnet FePS$_3$ and an ultrathin gold film. Rather than a passive support, the latter profoundly changes the nature of the magnetism in the 2D magnet, inducing a sizeable interfacial moment. Large-area flakes from Au-assisted exfoliation, combined with element-selective X-ray absorption mapping, enable a layer-by-layer study from monolayer to bulk, benchmarked against an inert SiO$_2$ substrate reference. At 9 T and 5 K, the monolayer on gold shows a three-fold enhanced X-ray magnetic circular dichroism relative to SiO$_2$, with a $\\sim$40% reduction of the orbital-to-spin moment ratio. Resonant inelastic X-ray scattering reveals a collapse of the crystal-field (d-d) excitations and a massive spectral-weight transfer to the charge-transfer region, unveiling the microscopic mechanism behind this change. Supported by atomic multiplet calculations, we identify interfacial charge transfer and Fe 3d-Au hybridization as the origin of these effects, which decay over the first three layers and vanish at the pentalayer, establishing layer number combined with substrate engineering as an atomically precise handle.", "tier": "B_IMPORTANT_CONDMAT", "score": "9", "reason": "Utilizes RIXS and MCD to study magnetism in a vdW monolayer/heterostructure, highly relevant to user profile.; demoted from A: broad CM, not direct user/project hit", "tags": ["method", "material", "vanderWaals"], "image": "https://arxiv.org/html/2610.12041v1/Figure1.png", "briefing": {"background": "2차원 반데르발스(vdW) 물질은 층간 결합이 약해 서로 다른 물질을 쌓아 '이종접합'을 만들기 쉽습니다. 이때 인접한 층 사이의 전자적 상호작용인 '근접 효과(proximity effect)'를 통해 원래 물질에는 없던 새로운 물성을 유도할 수 있습니다.", "motivation": "대표적인 2차원 반강자성 절연체인 FePS3를 금속인 금(Au) 기판 위에 놓았을 때, 계면에서 발생하는 전하 이동과 하이브리드화가 FePS3의 자성 및 전자 구조에 어떤 변화를 일으키는지 규명하고자 합니다.", "result": "Au 기판 위에 놓인 FePS3 단일층은 산화규소(SiO2) 기판 위에서보다 약 3배 강한 X-선 자기 원이색성(XMCD) 신호를 보였으며, 이는 계면에서 유도된 자기 모멘트가 발생했음을 의미합니다. 특히 RIXS 측정 결과, 결정장(crystal-field) 들뜸이 사라지고 전하 이동(charge-transfer) 영역으로 스펙트럼 강도가 크게 이동하는 것을 관찰했습니다.", "implication": "금속 기판과의 단순한 접촉만으로도 절연체인 2D 자성체의 스핀 및 궤도 모멘트 비율을 조절하고 자성을 강화할 수 있음을 보여줍니다. 이는 RIXS를 이용해 vdW 계면의 전자 구조 변화를 정밀하게 추적할 수 있음을 입증한 사례이기도 합니다.", "novelty": "사용자의 주요 관심사인 RIXS와 MCD 기술을 사용하여 vdW 단일층의 자성 변화를 미시적으로 분석했습니다. 특히 '금(Au) 보조 박리법'으로 얻은 대면적 시편을 활용해 층수별(1층~5층) 변화를 명확히 제시한 점이 돋보입니다.", "unresolved": "Au 기판과의 강력한 하이브리드화가 FePS3의 본질적인 반강자성 질서를 완전히 파괴하는지, 아니면 새로운 종류의 자성 상태를 형성하는지에 대한 추가적인 이론적/실험적 고찰이 필요합니다.", "future_work": "다른 전도성 기판이나 초전도체 기판을 이용한 근접 효과 연구, 그리고 이러한 계면 자성이 스핀 수송 특성에 미치는 영향에 대한 연구가 기대됩니다.", "concepts": [{"term": "RIXS (Resonant Inelastic X-ray Scattering)", "why_emerged": "물질 내 전하, 스핀, 궤도, 격자 들뜸을 원소 선택적으로 정밀하게 관측하기 위해 발전함.", "origin": "1970-80년대 싱크로트론 방사광 기술 발전과 함께 보급됨.", "connections": "ARPES, Neutron scattering, Electronic structure, Magnons"}, {"term": "Proximity Effect", "why_emerged": "서로 다른 대칭성이나 물성을 가진 물질이 접촉했을 때 계면에서 나타나는 새로운 양자 현상을 설명하기 위함.", "origin": "초전도성 연구에서 처음 중요하게 다뤄짐.", "connections": "Superconductivity, Spintronics, Topological insulators"}, {"term": "Charge Transfer", "why_emerged": "서로 다른 일함수를 가진 두 물질이 만날 때 페르미 준위를 맞추기 위해 전하가 이동하는 현상을 설명하기 위함.", "origin": "반도체 물리 및 화학 결합 이론의 기초 개념.", "connections": "Work function, Interfacial dipole, Redox reactions"}, {"term": "XMCD (X-ray Magnetic Circular Dichroism)", "why_emerged": "원소별로 스핀 모멘트와 궤도 모멘트를 구분하여 측정하고 자성체의 자기적 특성을 분석하기 위함.", "origin": "1987년 G. Schütz 등에 의해 처음 시연됨.", "connections": "X-ray absorption spectroscopy, Spin-orbit coupling, Ferromagnetism"}], "english_summary": ["Demonstrated gold-induced interfacial magnetism in monolayer FePS3 via proximity effects.", "Observed a 3-fold enhancement of XMCD and a reduction in the orbital-to-spin moment ratio on Au substrate.", "RIXS revealed a collapse of crystal-field excitations and massive spectral-weight transfer due to Fe 3d-Au hybridization.", "Showcases layer-number and substrate engineering as a tool for controlling 2D magnetism at the atomic scale."]}}, {"title": "Large spin splitting metallic altermagnets from machine-learned design rules", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2609.14051", "authors": "Ali Sufyan, Brahim Marfoua, J. Andreas Larsson, Rickard Armiento, Erik van Loon", "last_authors": "Rickard Armiento, Erik van Loon", "summary": "Altermagnets combine compensated magnetic order with momentum-dependent spin splitting, providing spin-polarized electronic states without a net magnetization. Metallic $d$-wave altermagnets are particularly promising because they can support time-reversal-odd spin currents in linear response, yet experimentally validated bulk realizations remain scarce. Here, we use high-throughput density-functional-theory data to relate the magnitude of altermagnetic band splitting to compositional, structural, and DFT-derived magnetic descriptors. An interpretable gradient-boosted model identifies two candidate-prioritization criteria: compact unit cells and magnetic sublattices that sustain sizable local moments. Guided by these trends, we screen tetragonal $A_2XY$ Heusler compounds in space group $P4/mmm$. Among 307 structures, symmetry identifies 169 altermagnetic arrangements, of which 157 remain metallic altermagnets in DFT. Sixteen realize an altermagnetic collinear ground state, of which 15 are dynamically and mechanically stable and 10 also lie on or below the calculated thermodynamic hull. Six candidates exceed the CrSb splitting obtained under the same computational protocol, led by Co$_2$AlSc ($\\Delta_\\mathrm{max}=2.24$~eV) and Fe$_2$AlGe ($2.07$~eV). A Julliere-model estimate gives a tunneling magnetoresistance of up to $203\\%$ at the Fermi level for Co$_2$AlSc. These results identify a chemically tunable family of metallic $d$-wave altermagnets and demonstrate how interpretable machine learning can guide targeted first-principles searches.", "tier": "B_IMPORTANT_CONDMAT", "score": "9", "reason": "Identifies new metallic altermagnets with large spin splitting, a high priority for the user.", "tags": ["theory", "material", "altermagnetism"], "image": "https://arxiv.org/html/2609.14051v2/figure1.png", "briefing": {"background": "알터마그넷(Altermagnetism)은 순 자화가 없는 반강자성적 대칭성과 강자성처럼 큰 스핀 분열(spin splitting)이 가능한 운동량 공간 대칭성을 동시에 갖는 새로운 자기 상태입니다. 이는 차세대 스핀트로닉스 구현을 위해 필수적이지만, 실험적으로 확인된 금속성 알터마그넷 후보는 여전히 부족한 실정입니다.", "motivation": "이 연구는 기계 학습(ML) 설계 규칙을 활용하여 대규모 스핀 분열을 보이는 새로운 금속성 알터마그넷 후보 물질을 효율적으로 탐색하고 우선순위를 정하는 것을 목표로 합니다.", "result": "고처리량 DFT 데이터를 바탕으로 경사 부스팅(Gradient-boosted) 모델을 구축하여, 조밀한 단위 셀과 큰 국부 자기 모멘트가 큰 스핀 분열의 핵심 지표임을 확인했습니다. 이를 통해 P4/mmm 공간군을 갖는 Heusler 화합물 A2XY 계열에서 157개의 금속성 알터마그넷 후보를 도출했으며, 특히 Co2AlSc와 Fe2AlGe는 CrSb보다 큰 약 2.24 eV 및 2.07 eV의 거대한 스핀 분열을 나타냄을 보였습니다.", "implication": "예측된 물질들은 높은 터널 자기저항(TMR, 최대 203%)을 가질 것으로 추정되어, 실제 스핀 전자 소자 응용에 있어 매우 유망한 재료 플랫폼을 제공합니다.", "novelty": "단순한 대칭성 분석을 넘어 기계 학습을 통해 구체적인 화학적/구조적 설계 규칙을 제시했다는 점이 독창적입니다. 특히 독자께서 관심 있는 ARPES를 통해 직접 관측 가능한 거대 스핀 분열 후보군을 구체적으로 명시했습니다.", "unresolved": "이 연구는 이론적 예측에 기반하고 있으므로, 실제 박막 또는 벌크 결정 성장 후 ARPES 등을 통한 전자 구조 검증이 필요합니다.", "future_work": "제시된 Heusler 화합물 후보들에 대한 실험적 합성 및 스핀 분열 에너지 크기의 직접적인 측정, 그리고 실제 TMR 소자 제작이 뒤따를 것으로 예상됩니다.", "concepts": [{"term": "알터마그넷 (Altermagnet)", "why_emerged": "강자성(큰 스핀 분열)과 반강자성(순 자화 없음)의 장점을 동시에 갖는 자성체를 설명하기 위해 등장했습니다.", "origin": "최근 2022년경 Libor Šmejkal 등에 의해 이론적 체계가 확립되었습니다.", "connections": "반강자성 스핀트로닉스, 베리 곡률(Berry curvature), 이상 홀 효과와 밀접한 관련이 있습니다."}, {"term": "Heusler 화합물", "why_emerged": "다양한 원소 조합을 통해 금속, 반도체, 위상 물질 등 폭넓은 물성을 구현할 수 있는 화학적 유연성 때문에 주목받았습니다.", "origin": "1903년 Friedrich Heusler가 특정 합금에서 자성이 나타남을 발견하며 시작되었습니다.", "connections": "반금속(Half-metal), 위상 반금속, 형상 기억 합금 연구와 연결됩니다."}, {"term": "스핀 분열 (Spin splitting)", "why_emerged": "서로 다른 스핀 상태가 다른 에너지를 가질 때 이를 활용해 스핀 전류를 제어하기 위해 필요합니다.", "origin": "전통적으로는 제이만 효과나 라쉬바 효과로 설명되었으나, 알터마그넷에서는 결정 대칭성에 의해 발생합니다.", "connections": "ARPES 측정의 핵심 대상이며, 자성 메모리 소자의 효율을 결정합니다."}, {"term": "TMR (터널 자기저항)", "why_emerged": "자기 저장 장치(MRAM)의 읽기 성능을 극대화하기 위해 높은 저항 변화율이 필요했습니다.", "origin": "1975년 Julliere에 의해 처음 보고되었습니다.", "connections": "스핀 터널링, 자성 접합(MTJ) 기술과 직결됩니다."}], "english_summary": ["Identified new metallic altermagnets with giant spin splitting up to 2.24 eV using machine learning and DFT.", "Established design rules favoring compact unit cells and large local moments for maximal band splitting.", "Screened A2XY Heusler compounds, finding Co2AlSc and Fe2AlGe as top-tier candidates for spintronics.", "Predicted high TMR values (up to 203%), highlighting their potential for next-generation magnetic devices."]}}, {"title": "Pressure-induced Lifshitz and quantum phase transitions in electron-doped cuprate superconductor (PNAS)", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2512.11439", "authors": "Jinyu Zhao, Shu Cai, Zhaoyu Liu, et al.", "last_authors": "Richard L Greene, Liling Sun", "summary": "We report the first observations of a pressure-induced Lifshitz transition coupled with a quantum phase transition in electron-doped cuprate superconductor Pr0.87LaCe0.13CuO4 (PLCCO), by combining high-pressure electrical resistance, Hall coefficient and synchrotron X-ray diffraction (XRD) measurements at low temperatures. Our low-temperature Hall coefficient measurements reveal that the Hall coefficient decreases continuously and reaches zero at about 10 GPa (critical pressure of Pc1). Upon further compression beyond Pc1, Hall coefficient unexpectedly changes its sign from negative to positive, signaling a reconstruction of the Fermi surface from electron-dominated to hole-dominated topology. Concurrently, the superconducting transition temperature (Tc) exhibits a monotonic suppression, vanishing completely at 17.6 GPa (critical pressure of Pc2), where the system enters a non-superconducting metallic state. Our low temperature XRD measurements unequivocally demonstrate the absence of any structural phase transition across Pc1 and Pc2. Therefore, the sign change in RH at Pc1 is associated with a Lifshitz transition, which is never found in the compressed bulk electron- or hole-doped cuprate superconductors. Moreover, the quantum phase transition observed at Pc2 contrasts sharply with known high-pressure behavior of hole-doped cuprates, uncovering a fundamental difference on how pressure tunes the ground states of electron- versus hole-doped systems. These findings provide crucial insights into the different pressure responses on the interplay among Fermi surface topology, electronic correlations, and superconductivity between these two kinds of cuprate superconductors.", "tier": "B_IMPORTANT_CONDMAT", "score": "9", "reason": "Direct observation of Lifshitz transition and Fermi surface reconstruction in a cuprate via transport and XRD.; demoted from A: broad CM, not direct user/project hit", "tags": ["experiment", "cuprate", "Fermisurface"], "image": "https://arxiv.org/static/browse/0.3.4/images/arxiv-logo-fb.png", "briefing": {"background": "구리 산화물(Cuprates) 초전도체는 전자 도핑형과 홀 도핑형이 있으며, 외부 압력은 이들의 전자 구조와 초전도 전이 온도(Tc)를 조절하는 중요한 변수입니다. 특히 페르미 면의 위상학적 변화인 립쉬츠 전이는 물리적 특성의 급격한 변화를 유도합니다.", "motivation": "전자 도핑형 구리 산화물인 Pr0.87LaCe0.13CuO4(PLCCO)에서 압력에 의한 페르미 면 재구성과 양자 상전이 현상을 명확히 규명하고자 하였습니다.", "result": "고압 전기 저항 및 홀 계수 측정을 통해 약 10 GPa에서 홀 계수가 음수에서 양수로 바뀌는 '립쉬츠 전이(Lifshitz transition)'를 발견했습니다. 또한 17.6 GPa에서 초전도성이 사라지며 비초전도 금속 상태로 전이되는 양자 상전이를 관측했으며, 저온 XRD를 통해 구조적 상전이가 없음을 확인했습니다.", "implication": "전자 도핑형 시스템에서도 압력만으로 페르미 면을 전자 중심에서 홀 중심으로 재구성할 수 있음을 보여주며, 이는 홀 도핑형 구리 산화물과는 근본적으로 다른 압력 응답 특성임을 시사합니다.", "novelty": "압축된 벌크 구리 산화물 초전도체에서 압력 유도 립쉬츠 전이를 직접적으로 관측한 최초의 사례 중 하나이며, 전자-홀 대칭성 문제를 이해하는 데 중요한 데이터를 제공합니다.", "unresolved": "페르미 면 재구성이 일어나는 구체적인 미시적 메커니즘(예: 특정 자기 질서와의 결합 여부)은 추가 연구가 필요합니다.", "future_work": "고압 환경에서의 ARPES나 양자 진동(Quantum Oscillations) 측정을 통해 재구성된 페르미 면의 구체적인 형상을 확인할 필요가 있습니다.", "concepts": [{"term": "립쉬츠 전이 (Lifshitz transition)", "why_emerged": "압력이나 도핑에 의해 페르미 면의 연결성이 끊어지거나 새로운 포켓이 생기는 위상 변화를 설명하기 위해 제안되었습니다.", "origin": "1960년 이브게니 립쉬츠(I. M. Lifshitz)가 이론적으로 제안했습니다.", "connections": "밴드 구조 계산, 홀 효과의 급격한 변화, 상태 밀도(DOS)의 특이점과 연결됩니다."}, {"term": "전자 도핑형 구리 산화물", "why_emerged": "전통적인 홀 도핑형 초전도체와의 비교 연구를 통해 고온 초전도 메커니즘의 보편성을 이해하기 위해 연구되었습니다.", "origin": "초록 정보만으로는 특정하기 어려우나, 1980년대 후반 NCCO 계열 발견이 기점입니다.", "connections": "반강자성 절연체 상태, 페르미 면 재구성, 스핀 변동 이론과 관련됩니다."}, {"term": "홀 계수 (Hall coefficient)", "why_emerged": "물질 내 주된 전하 운반자(carrier)의 종류(전자 또는 홀)와 농도를 측정하기 위해 필수적입니다.", "origin": "1879년 에드윈 홀(Edwin Hall)에 의해 발견되었습니다.", "connections": "반도체 물리, 페르미 면 위상학, 수송 특성 연구의 기본 도구입니다."}, {"term": "양자 상전이 (Quantum Phase Transition)", "why_emerged": "절대 영도에서 온도가 아닌 압력이나 자기장 같은 물리량에 의해 발생하는 상전이를 다루기 위해 필요합니다.", "origin": "초록 정보만으로는 특정하기 어려우나 현대 응집물질물리의 핵심 개념입니다.", "connections": "양자 임계 현상, 비페르미 액체(Non-Fermi liquid) 거동과 깊은 연관이 있습니다."}], "english_summary": ["Observed a pressure-induced Lifshitz transition in electron-doped cuprate PLCCO at ~10 GPa.", "Hall coefficient sign change indicates Fermi surface reconstruction from electron- to hole-dominated topology.", "Identified a quantum phase transition at 17.6 GPa where superconductivity vanishes into a metallic state.", "Demonstrated that electron-doped cuprates have a distinct high-pressure response compared to hole-doped counterparts."]}}, {"title": "Transducing quantum-spin-ice correlations into Weyl Fermi-arc transport at a synthetic Kondo lattice interface", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2610.12294", "authors": "Tsung-Chi Wu, Michael Terilli, Christian Zaprianov, et al.", "last_authors": "Lin Gu, Mikhail Kareev", "summary": "Quantum spin ice hosts collective excitations and quantum fluctuations that are largely electrically silent because the materials supporting them are insulating. Coupling this magnetic environment to surface-localized Weyl states offers a route to encode its correlations directly into Fermi-arc transport. Experimental access to this regime, however, has remained largely unexplored. Here, we realize a synthetic Kondo lattice interface between the Weyl semimetal $\\mathrm{Eu_2Ir_2O_7}$ and the quantum-spin-ice candidate $\\mathrm{Tb_2Ti_2O_7}$, and demonstrate that quantum-spin-ice correlations are imprinted on Weyl Fermi-arc transport. At ultra-low temperature, electronic transport evolves from a sixfold anisotropic response at low field into a twelvefold response over an intermediate field window, before entering a reentrant sixfold anisotropy at high field. No analogous twelvefold response occurs at the classical-spin-ice interface. The quantum--classical contrast shows that the same itinerant electronic channel acquires qualitatively different symmetry information when interacting with the quantum-fluctuating Tb moments, consistent with an interfacial coupling between the Weyl surface states and the transverse, multipolar degrees of freedom, in addition to the longitudinal, dipolar contribution. Our work establishes synthetic Kondo lattice interfaces as a route for transducing frustrated quantum magnetism with multipole correlations into distinct Weyl Fermi-arc transport responses.", "tier": "B_IMPORTANT_CONDMAT", "score": "9", "reason": "Study of Weyl surface states and Fermi-arc transport in a magnetic Kondo lattice heterostructure.; demoted from A: broad CM, not direct user/project hit", "tags": ["material", "Weylsemimetal", "transport"], "image": "https://arxiv.org/html/2610.12294v1/Fig1.png", "briefing": {"background": "양자 스핀 아이스(Quantum Spin Ice)는 좌절된 자성 시스템에서 나타나는 독특한 양자 상태이지만, 절연체인 경우가 많아 전하 수송을 통해 그 상관관계를 직접 측정하기 어렵습니다. 반면 바일 반금속(Weyl Semimetal)은 표면에 페르미 아크라는 특이한 전자 상태를 가집니다.", "motivation": "바일 반금속(Eu2Ir2O7)과 양자 스핀 아이스 후보 물질(Tb2Ti2O7) 사이의 인공 곤도 격자(Kondo lattice) 인터페이스를 구축하여, 자성 시스템의 양자 상관관계를 전자 수송 신호로 변환해 관측하고자 했습니다.", "result": "초저온 영역에서 인터페이스의 전자 수송 특성이 자기장에 따라 6회 대칭에서 12회 대칭으로 변하는 것을 발견했습니다. 이는 바일 표면 상태가 Tb 스핀의 다극자(multipolar) 자유도 및 양자 요동과 결합했음을 나타내는 신호로 해석됩니다.", "implication": "전기적으로 '조용한' 자성 양자 요동을 바일 페르미 아크 수송 신호를 통해 증폭하고 검출할 수 있는 새로운 실험적 플랫폼을 제시했습니다.", "novelty": "바일 반금속의 위상적 표면 상태를 이용해 양자 스핀 아이스의 정보를 읽어내는 'Transduction(변환)' 개념을 실현했다는 점이 매우 참신하며, 독자의 관심사인 위상 반금속과 자성 결합 연구에 부합합니다.", "unresolved": "12회 대칭성이 나타나는 구체적인 미시적 산란 메커니즘과 다극자 결합의 강도에 대한 정량적 분석이 더 필요합니다.", "future_work": "다른 양자 스핀 액체 후보 물질이나 위상 절연체 인터페이스로의 확장 연구, 그리고 이종 구조의 스핀 동역학 연구가 기대됩니다.", "concepts": [{"term": "바일 페르미 아크 (Weyl Fermi-arc)", "why_emerged": "바일 반금속의 벌크 에너지 밴드에 존재하는 바일 노드(Weyl node)의 쌍을 표면에서 연결하기 위해 나타나는 비폐쇄적 페르미 면입니다.", "origin": "2011년 Wan 등에 의해 이론적으로 예측되었고 TaAs 등에서 실험적으로 확인되었습니다.", "connections": "바일 반금속, 위상 표면 상태, 비정상 홀 효과와 연결됩니다."}, {"term": "양자 스핀 아이스 (Quantum Spin Ice)", "why_emerged": "고전적 스핀 아이스에 양자 요동을 도입하여 창발적 게이지장과 '광자(photon)' 같은 여기 상태를 연구하기 위해 등장했습니다.", "origin": "파이로클로르(pyrochlore) 구조 물질 연구에서 발전했습니다.", "c ibutes to the debate on the existence and nature of pair density wave states.", "Connects atomic-scale electronic structure to large-scale periodic orders."]}}, {"title": "Flavor-Polarized Chern Insulator in the Half-Filled Rhombohedral Graphene Moiré Superlattice", "journal": "PRL_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/h96k-q32d", "authors": "Zaizhe Zhang, Xi Chen, Kenji Watanabe, Takashi Taniguchi, Zhida Song, Xiaobo Lu", "last_authors": "Zhida Song, Xiaobo Lu", "summary": "At an even filling, a rhombohedral octalayer graphene moiré superlattice with electric-field-tunable chirality hosts a robust Chern insulating state.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Important moiré heterostructure experiment in topological insulators.", "tags": ["graphene", "moire", "topological"], "image": "", "briefing": {"background": "모아레 격자는 그래핀 층을 겹쳐 격자 상수를 조절함으로써 강한 상관관계와 위상적 성질을 유도하는 플랫폼입니다. 특히 롬보헤드럴(rhombohedral) 적층 구조는 전기장을 통해 밴드 구조를 정교하게 제어할 수 있는 특징이 있습니다.", "motivation": "반충전(half-filling) 상태의 8층 그래핀 모아레 격자에서 전기장으로 조절 가능한 위상 절연체 상태를 구현하고 그 특성을 확인하고자 함.", "result": "전기장으로 조절 가능한 카이랄성을 갖는 8층 롬보헤드럴 그래핀 모아레 초격자에서 강건한 '플레이버 분극(flavor-polarized) 천 절연체' 상태를 관측함.", "implication": "모아레 시스템이 위상적 양자 상태를 생성하고 제어하는 유연한 실험실임을 증명하며, 분수 양자 홀 효과와 같은 더 복잡한 위상 현상 연구의 발판이 됨.", "novelty": "기존의 꼬인 이중층 그래핀을 넘어 다층 시스템에서의 위상적 상태 제어를 보여줌으로써, 전자 상관관계와 위상 물리학 간의 새로운 연결고리를 제공함.", "unresolved": "플레이버 분극이 발생하는 정확한 미시적 에너지 분해 메커니즘과 그 안정성에 영향을 미치는 외부 요인의 상관관계.", "future_work": "다른 도핑 수준이나 더 높은 자기장에서의 위상적 물성 탐구 및 실제 디바이스 응용을 위한 위상적 스위칭 가능성 테스트.", "concepts": [{"term": "Chern Insulator", "why_emerged": "외부 자기장 없이도 자발적인 위상적 양자 홀 상태를 구현하기 위해 필요.", "origin": "Haldane (1988), 벌집 격자 모델에서 제안.", "connections": "양자 홀 효과, 위상 절연체, 아노말리 홀 효과."}, {"term": "Moiré Superlattice", "why_emerged": "원자층 물질의 주기성을 물리적으로 제어하여 전자 상관관계를 극대화하기 위해.", "origin": "Santos et al. (2007), 꼬인 이중층 그래핀 모델.", "connections": "트위스트 일렉트로닉스, 강상관 전자계."}], "english_summary": ["Demonstrates a Chern insu
