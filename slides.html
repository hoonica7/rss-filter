<title>Daily Paper Slideshow</title>
<style>
  :root {
    color-scheme: light;
    --bg: #f6f7f4;
    --paper: #ffffff;
    --ink: #111827;
    --muted: #64748b;
    --line: #d8ddd2;
    --accent: #176b87;
    --accent-2: #9a3412;
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; overflow: auto; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: var(--bg); color: var(--ink); }
  .shell { max-width: 1500px; min-height: 100vh; margin: 0 auto; padding: 14px 18px; display: flex; flex-direction: column; }
  .topbar { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 16px; }
  .top-actions { display: flex; align-items: center; gap: 10px; }
  .topbar a, button { border: 1px solid var(--line); border-radius: 8px; background: var(--paper); color: var(--ink); padding: 10px 14px; font-weight: 700; text-decoration: none; cursor: pointer; }
  button.primary { background: var(--accent); border-color: var(--accent); color: white; }
  button:disabled { opacity: 0.45; cursor: not-allowed; }
  .counter { color: var(--muted); font-weight: 700; }
  .slide { min-height: calc(100vh - 82px); background: var(--paper); border: 1px solid var(--line); border-radius: 10px; padding: 18px; box-shadow: 0 18px 42px rgba(15, 23, 42, 0.10); display: grid; grid-template-columns: minmax(310px, 0.86fr) minmax(0, 1.55fr); gap: 18px; overflow: visible; }
  .paper-head { min-width: 0; min-height: 0; overflow: visible; display: flex; flex-direction: column; gap: 12px; }
  .figure { margin: 0; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: #f8fafc; }
  .figure img { display: block; width: 100%; max-height: 41vh; object-fit: contain; background: white; }
  .figure figcaption { padding: 7px 10px; color: var(--muted); font-size: 12px; line-height: 1.3; }
  .head-text { display: flex; flex-direction: column; gap: 9px; min-width: 0; }
  .badges { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .badge { border-radius: 999px; padding: 5px 9px; background: #eef2ff; color: #3730a3; font-size: 12px; font-weight: 800; }
  .score { background: #fee2e2; color: #991b1b; }
  h1 { margin: 0; font-size: 25px; line-height: 1.15; letter-spacing: 0; overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
  h1 a { color: inherit; text-decoration-color: rgba(23, 107, 135, 0.35); text-decoration-thickness: 2px; text-underline-offset: 4px; }
  h1 a:hover { color: var(--accent); text-decoration-color: var(--accent); }
  .meta, .authors, .why, .abstract { font-size: 13px; line-height: 1.45; }
  .meta, .authors { color: var(--muted); }
  .why strong, .abstract strong, .authors strong { color: var(--ink); }
  .authors { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .why { border-left: 4px solid var(--accent-2); padding-left: 10px; color: #374151; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .abstract { border-top: 1px solid var(--line); padding-top: 14px; color: #374151; }
  .original-abstract { border-top: 1px solid var(--line); padding-top: 10px; color: #374151; font-size: 11.5px; line-height: 1.35; overflow-wrap: anywhere; }
  .original-abstract strong { display: block; margin-bottom: 4px; color: var(--ink); }
  .tags { display: flex; flex-wrap: wrap; gap: 8px; }
  .tag { border-radius: 999px; padding: 4px 8px; background: #f1f5f9; color: #475569; font-size: 12px; font-weight: 700; }
  .head-text > .link { display: none; }
  .briefing { min-width: 0; min-height: 0; overflow: visible; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); grid-auto-rows: minmax(0, auto); align-content: start; gap: 11px 18px; border-top: 0; padding-top: 0; }
  .brief-section { min-width: 0; }
  .brief-section.wide { grid-column: 1 / -1; }
  .brief-section h2 { margin: 0 0 4px; font-size: 14px; line-height: 1.22; color: #0f766e; letter-spacing: 0; }
  .brief-section p, .brief-section li { margin: 0; font-size: 12.5px; line-height: 1.42; color: #1f2937; overflow-wrap: anywhere; }
  .brief-section ul { margin: 0; padding-left: 20px; }
  .concepts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 9px 14px; }
  .concept { border-top: 1px solid var(--line); padding-top: 7px; }
  .concept h3 { margin: 0 0 4px; font-size: 13px; color: #7c2d12; letter-spacing: 0; }
  .concept p { margin: 2px 0 0; font-size: 11.5px; line-height: 1.35; color: #374151; overflow-wrap: anywhere; }
  .concept b { color: #111827; }
  .link { color: var(--accent); font-weight: 800; text-decoration: none; }
  .empty { padding: 48px; background: var(--paper); border: 1px solid var(--line); border-radius: 12px; color: var(--muted); }
  @media (max-width: 860px) {
    .shell { padding: 14px; }
    .topbar, .top-actions { align-items: stretch; flex-direction: column; }
    .slide, .briefing, .concepts { grid-template-columns: 1fr; }
    .slide { min-height: auto; overflow: visible; display: grid; }
    h1 { font-size: 28px; }
  }
</style>

<script>
const slides = [{"title": "Interplay between charge correlations and superconductivity across the superconducting domes of CsV3Sb(5−x)Snx", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/bcqw-7lsf", "authors": "Andrea N. Capa Salinas, Steven J. Gomez Alvarado, Brenden R. Ortiz, et al.", "last_authors": "Turan Birol, Stephen D. Wilson", "summary": "The kagome metal ${\\mathrm{CsV}}_{3}{\\mathrm{Sb}}_{5}$ hosts an anomalous interplay between charge density wave (CDW) order and superconductivity—one where tuning its band filling by adding holes rapidly suppresses long-range CDW order and drives the formation of two unusual superconducting “domes.”…", "tier": "A_MUST_READ", "score": "10", "reason": "Direct study of CDW and superconductivity in the user's primary material interest (CsV3Sb5).", "tags": ["kagomemetal", "CDW", "superconductivity", "CsV3Sb5"], "image": "", "briefing": {"background": "카고메(Kagome) 격자 구조를 가진 물질들은 기하학적 좌절(frustration)로 인해 특이한 밴드 구조(플랫 밴드, 디락 노드 등)를 가지며, 이로 인해 전자 간의 강한 상관관계가 나타납니다. 특히 CsV3Sb5와 같은 AV3Sb5 계열은 전하 밀도파(CDW)와 초전도성이 공존하거나 경쟁하는 물리적 특성으로 인해 응집 물질 물리 분야에서 매우 활발히 연구되고 있습니다.", "motivation": "CsV3Sb5에 Sn을 도핑하여 정공(hole)을 주입하면 장거리 CDW 질서가 억제되면서 두 개의 초전도 '돔(dome)' 구조가 나타납니다. 본 연구는 이 도핑 과정에서 전하 상관관계(charge correlations)와 초전도성이 어떻게 상호작용하는지, 그리고 CDW가 사라진 영역에서도 전하 요동이 초전도에 어떤 영향을 미치는지를 규명하고자 했습니다.", "result": "Sn 도핑량(x)에 따른 CsV3Sb(5-x)Snx의 상도표를 정밀하게 분석했습니다. 연구 결과, 장거리 CDW가 억제된 이후에도 국소적인 전하 상관관계가 남아있을 수 있으며, 이것이 두 번째 초전도 돔의 형성과 밀접한 관련이 있음을 시사합니다. 특히 밴드 채우기(filling)의 변화가 카고메 밴드 구조의 특이점(Van Hove Singularity)을 이동시키며 물성을 제어함을 확인했습니다.", "implication": "이 결과는 카고메 초전도체에서 초전도 쌍 형성이 단순히 단순한 포논 매개 메커니즘뿐만 아니라, 전하 밀도파와 관련된 전자적 요동에 의해 크게 영향을 받을 수 있음을 보여줍니다. 이는 비전통적 초전도 기작을 이해하는 중요한 단서가 됩니다.", "novelty": "독자의 주요 관심사인 CsV3Sb5 시스템에서 Sn 도핑을 통한 '두 개의 초전도 돔' 현상을 전하 상관관계 관점에서 직접적으로 다루었습니다. 특히 CDW와 초전도 간의 경쟁 및 공존 관계를 도핑 농도에 따라 상세히 추적했다는 점이 중요합니다.", "unresolved": "초록 정보만으로는 두 번째 초전도 돔에서 나타나는 초전도체의 대칭성이나 시간 역전 대칭성 깨짐(TRSB) 여부가 이 물질에서도 유지되는지 완전히 명확하지 않습니다.", "future_work": "도핑에 따른 전자 구조의 변화를 ARPES나 STM으로 직접 관찰하여 Van Hove Singularity의 위치 변화와 초전도 돔의 상관관계를 실험적으로 더욱 정교하게 매핑하는 연구가 필요합니다.", "concepts": [{"term": "Kagome Metal", "why_emerged": "기하학적 구조에서 기인하는 플랫 밴드와 위상적 특성을 연구하기 위해 도입되었습니다.", "origin": "일본의 대나무 바구니 패턴(Kagome)에서 유래한 격자 구조 명칭입니다.", "connections": "Frustrated magnetism, Dirac semimetals, CDW, Unconventional superconductivity"}, {"term": "Charge Density Wave (CDW)", "why_emerged": "금속 내 전자 밀도가 주기적으로 변조되면서 격자 왜곡을 동반하는 현상을 설명하기 위해 등장했습니다.", "origin": "Rudolf Peierls가 1차원 금속의 불안정성을 제안하며 기초가 마련되었습니다.", "connections": "Peierls instability, Fermi surface nesting, Electron-phonon coupling"}, {"term": "Superconducting Dome", "why_emerged": "도핑이나 압력 등 매개변수에 따라 초전도 전이 온도가 극대값을 보이며 나타나는 영역을 설명할 때 사용됩니다.", "origin": "고온 초전도체(Cuprates)의 상도표 연구에서 널리 알려졌습니다.", "connections": "Quantum critical point, Phase diagram, Doping control"}], "english_summary": ["Investigated the interplay between charge correlations and superconductivity in Sn-doped CsV3Sb5.", "Hole doping via Sn substitution suppresses long-range CDW and induces two distinct superconducting domes.", "The study highlights how band filling and electronic instabilities in the kagome lattice drive emergent phases.", "Results suggest that charge fluctuations may play a key role in the pairing mechanism beyond the CDW phase."]}}, {"title": "Interaction-driven flat band and charge order in Fe 5 GeTe 2", "journal": "Science_Advances", "source": "Gemini", "link": "https://doi.org/10.1126/sciadv.aeg5930", "authors": "Qiang Gao, Gabriele Berruto, Khanh Duy Nguyen, et al.", "last_authors": "Jiun-Haw Chu, Shuolong Yang", "summary": "Flat electronic bands enable fascinating emergent phenomena such as superconductivity and charge orders. A prevailing approach to realizing flat bands is to engineer lattice geometric constraints in twisted or kagome-like materials. An alternative approach is to utilize purely electronic-interaction-driven flat bands, yet a fundam tform for realizing quantum anomalous Hall and axion insulator states. However, the experimentally observed surface state gaps fail to meet theoretical predictions, although the exact mechanism behind the gap suppression has been debated. Recent theoretical studies suggest that intrinsic antisite defects push the topological surface state away from the MBT surface, closing its gap and making it less accessible to scanning probe experiments. Here, we report on the local effect of defects on the MBT surface states and demonstrate that high defect concentrations lead to a displacement of the surface states well into the MBT crystal, validating the theorized mechanism. The local and global influence of antisite defects on the topological surface states are studied with samples of varying defect densities by combining scanning tunneling microscopy, angle-resolved photoemission spectroscopy, and density functional theory. Our findings identify a combination of increased defect density and reduced defect spacing as the primary factors underlying the displacement of the surface states and suppression of surface gap, guiding further development of topological quantum materials.", "tier": "A_MUST_READ", "score": "9", "reason": "author whitelist: Adam Kaminski", "tags": ["anomalousHall", "quantummagnet", "topological"], "image": "", "briefing": {"background": "위상 절연체인 MnBi2Te4(MBT)는 양자 이상 홀 효과와 액시온 절연체 상태를 구현할 수 있는 차세대 양자 소재로 주목받고 있습니다. 하지만 실제 실험에서 측정된 표면 상태의 에너지 갭이 이론적 예측보다 훨씬 작게 나타나는 현상이 관찰되어 왔습니다.", "motivation": "이 연구는 MBT 내부에 존재하는 고유한 결함(antisite defect)이 표면 상태의 에너지 갭을 닫거나 변화시키는 원인이라는 가설을 검증하고자 합니다.", "result": "결함 농도가 높을수록 표면 상태(topological surface state)가 결정 내부로 밀려나며, 이로 인해 표면 갭이 억제된다는 사실을 STM과 ARPES를 통해 실험적으로 확인했습니다.", "implication": "MBT 기반의 양자 소자 성능 향상을 위해서는 결함 밀도 제어가 필수적임을 시사하며, 위상물질의 실제 응용을 위한 재료 과학적 가이드라인을 제공합니다.", "novelty": "이론적으로 제기되었던 '결함에 의한 표면 상태 밀림' 현상을 직접적인 실험(STM+ARPES)을 통해 증명했다는 점이 중요하며, ARPES 데이터를 해석할 때 결함 농도를 고려해야 함을 잘 보여줍니다.", "unresolved": "결함의 분포가 정 nd-structured altermagnetic limits. Beyond unifying known phases, our theory uncovers a mixed non-commuting regime that emerges when the unitary and Hermitian sectors fail to commute, revealing an underlying non-commuting spin-bond structure. This regime generates a non-coplanar spin texture characterized by an even-in-momentum transverse spin polarization, providing a direct spectroscopic fingerprint for spin- and angle-resolved photoemission spectroscopy. Furthermore, we establish that this synthetic spin-orbit coupling can be dynamically tuned by geometrically controlling the non-commutation of the bond sectors. By providing a microscopic foundation for such tuning, our theory paves the way for advanced applications, including field-free spin qubits.", "tier": "A_MUST_READ", "score": "9", "reason": "Directly provides spectroscopic fingerprints for spin-ARPES in altermagnets and related phases.", "tags": ["theory", "altermagnetism", "spin-ARPES"], "image": "https://arxiv.org/html/2608.09644v1/x1.png", "briefing": {"background": "최근 '알터마그넷(Altermagnet)'의 발견으로 순자화가 없음에도 불구하고 밴드 스핀 분리가 일어나는 새로운 자기 질서가 주목받고 있습니다. 기존의 비상대론적 스핀 분리를 설명하는 통합된 틀이 필요했습니다.", "motivation": "다양한 유형의 비상대론적 스핀 분리 현상을 하나의代수적 구조(spin-bond theory)로 체계화하고 예측 가능한 모델을 제시하고자 합니다.", "result": "스핀 결합을 unitary와 Hermitian 성분으로 분리하여 알터마그넷과 p-파 마그넷을 통합적으로 설명하고, 특정 조건에서 발생하는 비공변 스핀 텍스처를 예측했습니다.", "implication": "새로운 비공변 스핀 구조는 spin-ARPES에서 독특한 분광학적 신호를 남길 것으로 보이며, 이를 이용한 새로운 스핀트로닉스 소자 설계가 가능해집니다.", "novelty": "기존에 분리되어 논의되던 자기 질서들을 하나의 대수적 구조로 통합했으며, 특히 스핀-ARPES에서 직접 관측 가능한 '스펙트로스코픽 핑거프린트'를 제시한 점이 리더에게 유용합니다.", "unresolved": "이론적 모델이 제안한 비공변 스핀 텍스처가 실제 어떤 구체적 화합물에서 명확히 구현될지는 아직 명확하지 않습니다.", "future_work": "제안된 비공변 스핀 텍스처를 확인할 수 있는 후보 물질의 탐색 및 고해상도 spin-ARPES 실험 검증.", "concepts": [{"term": "Altermagnetism", "why_emerged": "강자성과 반강자성의 경계에서 순자화는 없으나 밴드 스핀 분리가 일어나는 새로운 자기 질서가 발견됨.", "origin": "최근 수년 내 이론적으로 확립됨 (예: Mazin et al.).", "connections": "반강자성, 비상대론적 스핀 분리, Spin-ARPES."}, {"term": "Spin-ARPES", "why_emerged": "밴드의 스핀 구조를 직접 측정하여 전자 구조의 위상적/자기적 성질을 규명하기 위해 필수적임.", "origin": "전통적인 ARPES에 스핀 편극 측정을 결합한 기술.", "connections": "스핀-궤도 결합, 위상 절연체, 스핀트로닉스."}], "english_summary": ["A new spin-bond theory is proposed to unify non-relativistic spin splitting in altermagnets and p-wave magnets.", "The theory categorizes electronic bonds into unitary and Hermitian sectors, uncovering a non-commuting regime.", "This regime predicts non-coplanar spin textures with unique signatures in spin-resolved ARPES.", "The framework provides a basis for potential field-free spin qubit applications."]}}, {"title": "AIMS: an AI experimentalist turns uncertainty into quantum matter discovery", "journal": "arXiv_CondMat", "source": "author whitelist", "link": "https://arxiv.org/abs/2607.16544", "authors": "Siyuan Qiu, Philip D. Suh, Nhat Huy Tran, et al.", "last_authors": "Zhixun Shen, Zhurun Ji", "summary": "Most AI agents act only after scientists have defined the task. Discovery is harder under practical uncertainties: the probe may not be where it is expected, the signal may occupy only a small region of a disordered sample, and the evidence may not distinguish among competing explanations. Here we show that an AI agent can decide what evidence an uncertain experiment needs next, and act on it. Beyond automation, AIMS, an uncertainty-aware experimentalist for cryogenic microwave impedance microscopy, quantifies uncertainty where it originates, in perception, sampling, and interpretation, and converts each into its own corrective action rather than a single confidence score. Given only an open objective, AIMS relocated a probe lost during cooldown while flagging its own unreliable estimates, mapped twist angle disorder to locate the strongest correlated states in twisted bilayer MoSe$_2$, and uncovered a paradox: the half-filled stripe that classical theory predicts should melt first survived longest. Distinguishing an incomplete model from a wrong mechanism, AIMS commissioned a beyond-mean-field calculation and an independent structural measurement as the decisive tests, revising its interpretation as each arrived: quantum motion reverses the classical hierarchy, stabilizing the half-filled stripe while destabilizing its neighbors. These uncertainty-to-action loops are generic to scanning probe experiments, and AIMS turns uncertainty from an obstacle into a driver of discovery.", "tier": "A_MUST_READ", "score": "9", "reason": "author whitelist: Zhixun Shen", "tags": ["STS", "twistedbilayer", "correlated", "twisted"], "image": "https://arxiv.org/html/2607.16544v2/Figure1.jpg", "briefing": {"background": "주사 탐침 현미경(STM/MIM) 실험에서 실험자의 직관과 반복 수행에 의존하던 관행은 복잡하고 불확실성이 큰 양자 물질 연구에서 병목 현상이었습니다.", "motivation": "실험 중 발생하는 불확실성(탐침 위치 오류, 샘플 불균일성 등)을 스스로 인지하고, 능동적으로 데이터를 수집하여 문제를 해결하는 AI 실험가 에이전트(AIMS)를 개발하고자 합니다.", "result": "AIMS는 탐침 위치 오류를 수정하고, MoSe2 트위스트 이중층에서 강상관 상태를 효율적으로 매핑했으며, 고전적 이론의 예측과 다른 양자적 관측 결과를 성공적으로 해석했습니다.", "implication": "불확실성을 제거해야 할 대상이 아닌, 실험 과정의 피드백 루프로 활용함으로써 양자 물질 탐색의 가속화를 가능하게 합니다.", "novelty": "단순 자동화가 아닌 '불확실성 인식 및 능동적 행동'이 가능한 AI를 물리 실험에 도입하여, 실험자가 놓치기 쉬운 물리적 역설을 해결했다는 점에서 혁신적입니다.", "unresolved": "AI가 제안한 물리적 모델이 다른 물질 시스템이나 더 복잡한 상관계 시스템에서도 보편적으로 적용될 수 있을지는 검증이 필요합니다.", "future_work": "더 다양한 scanning probe 실험(STM, STS 등)으로 확장하여 자율적 양자 물질 발견 플랫폼으로 구축.", "concepts": [{"term": "Microwave Impedance Microscopy", "why_emerged": "샘플의 전기적 국소 특성을 탐침을 통해 비접촉/비파괴적으로 측정하기 위해 개발됨.", "origin": "2000년대 초반 개발됨 (예: Cui et al.).", "connections": "STM, 나노 소자 특성 분석, 국소 도전율 측정."}, {"term": "Twisted bilayer MoSe2", "why_emerged": "모아레 격자 내에서 전자 간 상관관계가 증폭되는 양자 현상을 연구하기 위한 플랫폼.", "origin": "모아레 물리(2018년 이후)의 연장선.", "connections": "강상관 전자계, 트위스트된 2D 물질."}], "english_summary": ["AIMS is an uncertainty-aware AI agent designed for automated scanning probe experiments.", "It actively manages experimental uncertainties, such as probe navigation and noisy data, to drive discovery.", "In twisted bilayer MoSe2, the AI discovered that quantum effects stabilize half-filled stripes, contrary to classical predictions.", "This approach turns experimental uncertainty into a driver for objective-oriented quantum matter research."]}}, {"title": "Accelerated quantum Monte Carlo simulations of the attractive Hubbard model on the kagome lattice", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2608.03894", "authors": "Jie Zhang, Xiang Li, Yu Wang", "last_authors": "Xiang Li, Yu Wang", "summary": "The recent discovery of several families of kagome materials and experimental realization of optical kagome lattices have stimulated growing numerical studies of interaction-driven correlated states on the kagome lattice. Among the available numerical approaches, determinant quantum Monte Carlo (DQMC) is a powerful method for investigating such strongly correlated states. However, the accessible system sizes of existing DQMC simulations remain limited, preventing reliable finite-size scaling analyses. Here we develop a general acceleration scheme based on fast Fourier transform (FFT) for propagator multiplications on composite lattices and combine it with the delay-update algorithm, enabling simulations on system sizes twice as large as those of previous DQMC studies, allowing reliable finite-size scaling analyses of the attractive kagome-lattice Hubbard model. Our large-scale simulations reveal the interaction-driven zero-temperature superfluid quantum criticality at the Dirac filling and provide reliable estimates of the associated critical exponents. Besides, we find no evidence that the previously proposed triangle-rule charge-density-wave order survives in the thermodynamic limit, suggesting that it is likely a finite-size effect. Moreover, for system sizes accessible in current two-dimensional optical lattice experiments, the combined FFT and delay-update scheme exhibits an effective computational cost scaling as $N^{2.49}$, substantially below the $\\mathcal{O}(N^3)$ computational cost of conventional DQMC ne", "last_authors": "Ettore Carpene", "summary": "The emergence of chirality in the charge density wave (CDW) phase of 1 T − TiSe 2 has recently attracted significant attention, yet its microscopic origin remains debated. The prevailing interpretation attributes chirality to a relative phase shift between the charge density components. Here, using density functional theory and symmetry analysis, it is demonstrated that such phase-shifted states entail prohibitive energy costs, rendering them unlikely candidates for the ground state. Instead, a nearly degenerate metastable CDW phase stacking order with monoclinic symmetry is identified that naturally breaks mirror and inversion symmetries. The CDW in 1 T − TiSe 2 possesses a dual physical nature: The electronic charge redistribution is intrinsically bond modulated, while the periodic lattice distortion is atom-centered transverse. This spatial separation allows a specific optical coupling mechanism where circularly polarized light breaks the energetic degeneracy between chiral domains. These results reconcile conflicting experimental observations, identifying the “spontaneous” chirality observed in local probes as a statistical distribution of CDW phase stacking domains while establishing the mechanism for macroscopic, light-induced gyrotropic order.", "tier": "B_IMPORTANT_CONDMAT", "score": "9", "reason": "Addresses microscopic origin of chirality in TiSe2 CDW, highly relevant to user's core interests.; demoted from A: broad CM, not direct user/project hit", "tags": ["theory", "TiSe2", "chargedensitywave"], "image": "", "briefing": {"background": "전이금속 디칼코게나이드(TMD)인 1T-TiSe2의 전하 밀도 파동(CDW) 상에서 나타나는 카이랄성(chirality)의 기원은 응집물질물리학의 오랜 난제임.", "motivation": "기존의 위상 변화 모델이 에너지적으로 불리하다는 점을 지적하고, 1T-TiSe2의 CDW 카이랄성의 실제 미시적 기원을 규명하기 위함.", "result": "위상 변화 모델 대신 모노클리닉 대칭성을 갖는 준안정 CDW 스태킹 순서가 카이랄성을 유도함을 밝힘. 전자 전하 재배치와 원자 변위의 공간적 분리가 존재함을 확인.", "implication": "광학적으로 유도된 자이로트로픽 질서(gyrotropic order)의 메커니즘을 규명하고, 실험에서 관찰된 상충하는 결과들 -In 2 Se 3 /1T-NbSe 2 , polarization reversal modulates interlayer coupling through out-of-plane orbital alignment. Downward polarization stabilizes Mott-insulating states with type-I band alignment, whereas upward polarization enhances interfacial hybridization, forms interlayer covalent-like quasi-bonding, and drives Γ-point band inversions. The resulting spin-split hybridized valleys penetrate the valence band, inducing a nontrivial topological state with intrinsic anomalous Hall conductivity of ∼10 2 siemens per centimeter. The comparison with α-In 2 Se 3 /1T-TaSe 2 and α-In 2 Se 3 /1T-TaS 2 further identifies Γ-centered valleys and out-of-plane p z -orbital coupling as key ingredients for polarization-switchable topology, providing a general design framework for electrically programmable correlated-topological integration in two-dimensional heterostructures.", "tier": "B_IMPORTANT_CONDMAT", "score": "9", "reason": "Proposed switch between Mott insulator and topological metal in NbSe2 heterostructures, matching user interests.", "tags": ["material:NbSe2", "topic:topological-transition", "topic:Mott-insulator"], "image": "", "briefing": {"background": "강하게 상호작용하는 전자계에서 나타나는 모트 절연체(Mott insulator)와 위상학적 물성(topological properties)은 현대 응집물리에서 중요한 연구 주제입니다. 이 두 상태는 종종 같은 물질 내에서 공존하거나 경쟁하며, 이들 사이의 전환을 외부에서 전기적으로 제어하는 것은 근본적인 이해뿐만 아니라 차세대 저전력 비휘발성 위상학적 소자 개발에 필수적입니다.", "motivation": "기존에는 상관 및 위상학적 상(phase) 사이의 전기적 전환을 달성하는 것이 어려웠습니다. 이 연구는 모트 절연체와 위상 금속 사이의 전기적으로 스위칭 가능한 가역적 전환을 반데르발스 이종접합 구조에서 구현하고 이해하고자 합니다. 특히 강유전체를 이용하여 이러한 제어를 시도합니다.", "result": "이 연구는 강유전체-모트 이종접합(ferroelectric-Mott heterostructures) 시스템인 α-In₂Se₃/1T-NbSe₂에서 강유전 분극(polarization)을 통해 모트 절연체와 위상 금속 상태를 전기적으로 전환할 수 있음을 제안하고 입증했습니다. 하향 분극은 모트 절연 상태를 안정화하고, 상향 분극은 계면 혼성화를 증진시켜 Γ-점 밴드 반전을 유도하고 스핀 분리된 위상 금속 상태(비자명한 위상학적 상태, anomalous Hall conductivity ~10² S/cm)를 형성합니다.", "implication": "이 결과는 강상관계와 위상학적 상태 간의 상호작용을 이해하고 이를 전기적으로 제어할 수 있는 새로운 길을 열었습니다. 특히, 외부 전기장으로 위상학적 상태를 제어함으로써 저전력 비휘발성 위상 전자 소자를 개발 =(0,\\pi)$. We identify that the pure double stripe spin state is unstable in La$_3$Ni$_2$O$_7$ towards a commensurate charge-density wave instability, which favors a spin-modulated double stripe order with intertwined charge and spin instabilities and establish the hierarchy of ordered states in La$_3$Ni$_2$O$_7$. We further discuss our results in the context of available experimental literature and propose further experimental tests to elucidate the origin of the SDW/DW states in this system.", "tier": "B_IMPORTANT_CONDMAT", "score": "9", "reason": "Hartree-Fock analysis of intertwined spin and charge density waves in the high-Tc parent compound La3Ni2O7.", "tags": ["theory", "nickelates", "density-wave"], "image": "https://arxiv.org/html/2606.29527v2/model_system_v2.png", "briefing": {"background": "층상 니켈산화물(bilayer nickelates)은 최근 고온 초전도체 후보 물질로 주목받고 있으며, 특히 La₃Ni₂O₇는 높은 압력에서 고온 초전도성을 나타냅니다. 이러한 초전도성의 기원을 이해하기 위해서는 초전도 상(superconducting phase)과 경쟁하거나 공존하는 저온 상(low-temperature phases)의 복잡한 물성을 규명하는 것이 중요합니다. 특히 전하 및 스핀 밀도파(CDW/SDW)는 강상관 물질에서 흔히 발견되는 현상입니다.", "motivation": "La₃Ni₂O₇의 저압 상평형도에서 두 개의 밀도파 전이(SDW at ~150K, DW at ~130K)가 관찰되는데, 두 번째 밀도파 전이(DW)의 정확한 기원은 불분명했습니다. 이 연구는 Hartree-Fock 계산을 통해 이 두 번째 전이의 본질을 밝히고, 물질 내에서 스핀 및 전하 밀도파가 어떻게 얽혀 있는지를 이해하고자 합니다.", "result": "비제한 Hartree-Fock 계산을 통해 오르토롬빅 상(orthorhombic phase)에서 QY=(0,π) 파동 벡터를 갖는 이중 스트라이프 스핀 밀도파(double-stripe spin-density wave)가 형성됨을 확인했습니다. 더 나아가, 이 순수한 스핀 상태가 가로무늬 전하 밀도파(commensurate charge-density wave) 불안정성에 의해 불안정해지며, 결과적으로 전하와 스핀 불안정성이 얽혀있는 스핀 변조 이중 스트라이프 상(spin-modulated double stripe order)을 형성한다는 것을 밝혀냈습니다. 이는 La₃Ni₂O₇에서 관찰된 두 번째 밀도파 전이의 기원일 수 있습니다.", "implication": "이 연구 결과는 La₃Ni₂O₇에서 밀도파 전이의 복잡한 특성을 설명하며, 스핀 및 전하 자유도 간의 강한 상호작용과 얽힘(intertwining)이 고온 초전도체의 경쟁상태를 이해하는 데 핵심적임을 시사합니다. 이는 니켈산화물 초전도체의 페어링 메커니즘을 밝히는 데 중요한 정보를 제공할 수 있습니다.", "novelty": "기존에 불분명했던 La₃Ni₂O₇의 저압 상에서 나타나는 두 번째 밀도파 전이의 기원을 이론적으로 규명하고, 스핀 밀도파와 전하 밀도파가 얽혀있는 새로운 형태의 이중 스트라이프 질서(double-stripe order)를 제안했습니다. 이는 니켈산화물 연구에 cond density-wave transition in the low-pressure phase of La₃Ni₂O₇, a parent compound for high-temperature superconductivity.", "Unrestricted Hartree-Fock calculations reveal that the previously observed density wave likely originates from a double-stripe spin-density wave at QY=(0,π) that becomes unstable.", "This spin state then transforms into a spin-modulated double-stripe order due to a commensurate charge-density wave instability, featuring intertwined charge and spin orders.", "The findings clarify the hierarchy of ordered states in La₃Ni₂O₇ and highlight the complex interplay between spin and charge degrees of freedom.", "This work is highly relevant for understanding density waves and nickelate superconductivity."]}}, {"title": "Double quantum spin Hall phase in bilayer ZrTe5", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2606.18130", "authors": "Chao Chen Ye, G\\'abor Kalla, Jianting Ye, Jagoda S{\\l}awi\\'nska", "last_authors": "Jianting Ye, Jagoda S{\\l}awi\\'nska", "summary": "Quantum spin Hall insulators (QSH) are topological materials that host helical edge states protected against backscattering, making them ideal candidates for dissipationless spin transport. Within the conventional $\\mathbb{Z}_2$ classification, only phases with an odd number of edge state pairs ($\\mathbb{Z}_2 = 1$) are topologically nontrivial, whereas even-channel systems ($\\mathbb{Z}_2 = 0$) lie beyond this framework but can host robust edge transport characterized by a spin Chern number. Experimentally accessible realizations of such phases remain rare, particularly in systems with sizeable band gaps. Here, we show that bilayer ZrTe$_5$ realizes a double quantum spin Hall phase in its energetically most stable structure. Using first principles calculations, we demonstrate that uniaxial strain drives a transition from this phase to a conventional single pair QSH phase with $\\mathbb{Z}_2 = 1$. The double QSH phase hosts two pairs of helical edge states, resulting in enhanced edge conductance and a quantized spin Hall response that remains robust over an energy window of up to $\\sim$100 meV. These results establish bilayer ZrTe$_5$ as a tunable platform connecting conventional and double QSH phases within a single material. More broadly, they demonstrate that untwisted van der Waals bilayers can host topological phases beyond the conventional $\\mathbb{Z}_2$ classification.", "tier": "B_IMPORTANT_CONDMAT", "score": "9", "reason": "Identifies bilayer ZrTe5 as a platform for double QSH phases with enhanced edge conductance and tunability.", "tags": ["DFT", "ZrTe5", "topological-insulator"], "image": "https://arxiv.org/html/2606.18130v2/crystal_structure_gap_evolution.png", "briefing": {"background": "양자 스핀 홀(QSH) 절연체는 스핀-궤도 결합에 의해 발생하는 위상학적 특성으로 인해 물질 내부에서는 절연체이지만 가장자리에는 스핀이 극화된(helical) 전도성 채널을 가집니다. 이 가장자리 상태는 산란에 강하여 무손실 스핀 수송을 가능하게 하여 차세대 스핀트로닉스 소자에 중요한 후보 물질입니다.", "motivation": "기존 QSH 절연체는 주로 홀수 쌍의 가장자리 상태(Z₂=1)를 가지는 위상학적 비자명 상(topologically nontrivial phase)에 초점을 맞췄습니다. 하지만 짝수 쌍의 가장자리 상태(Z₂=0)를 가지는 시스템도 스핀 Chern 수로 특징지어지는 견고한 가장자리 수송을 가질 수 있지만, 이를 실험적으로 접근 가능한 물질에서 구현하기는 어려웠습니다. 이 연구는 이중 양자 스핀 홀 상(double QSH phase)을 실현할 수 있는 물질을 탐색하고 그 특성을 이해하고자 합니다.", "result": "제일원리 계산을 통해 이중층 ZrTe₅가 에너지적으로 가장 안정한 구조에서 이중 양자 스핀 홀 상을 구현함을 보여주었습니다. 이 상은 두 쌍의 나선형 가장자리 상태를 가지며, 이로 인해 향상된 가장자리 전도도와 ~100 meV 에너지 범위에서 견고한 양자화된 스핀 홀 응답을 나타냅니다. 또한, 단축 변형(uniaxial strain)을 통해 이 이중 QSH 상에서 기존의 단일 QSH 상(Z₂=1)으로 전환될 수 있음을 밝혔습니다.", "implication": "이 결과는 이중층 ZrTe₅가 기존의 Z₂ 분류를 넘어서는 위상학적 상을 탐구하고 조절할 수 있는 유연한 플랫폼임을 확립합니다. 특히, 향상된 가장자리 전도도는 차세대 저전력 스핀트로닉스 소자 개발에 새로운 가능성을 제시합니다.", "novelty": "이중층 ZrTe₅에서 이중 양자 스핀 홀 상(double QSH phase)을 이론적으로 발견하고, 단축 변형으로 이를 기존 QSH 상과 연결할 수 있음을 보인 것이 중요합니다. 이는 짝수 채널 QSH 시스템의 실험적 구현 가능성을 높이고, 전통적인 Z₂ 분류를 넘어서는 위상학적 물성을 untwisted 반데르발스 이중층에서 구현할 수 있음을 보여주어 위상 물질 연구에 새로운 방향을 제시합니다. 독자의 ZrTe₅ 및 위상 물질 관심사에 직접적이며, STM/STS를 통한 에지 상태 관측에 대한 후속 연구 가능성도 있습니다.", "unresolved": "이 연구는 제일원리 계산에 기반하고 있으므로, 제안된 이중 QSH 상과 그 전이 현상을 직접적으로 증명하기 위한 실험적 검증(예: STM/STS, 전송 측정)이 필요합니다. 특히, 두 쌍의 헬리컬 가장자리 상태를 구별하여 관측하는 것이 도전적일 수 있습니다.", "future_work": "제안된 이중층 ZrTe₅의 이중 QSH 상을 STM/STS로 가장자리 상태를 이미징하거나, 국소적 전송 측정을 통해 향상된 가장자리 전도도를 확인하는 실험이 필요합니다. 또한, 변형을 이용한 위상학적 상전이를 실험적으로 구현하고 그 제어 가능성을 탐구하는 연구도 뒤따를 것입니다.", "concepts": [{"term": "Quantum spin Hall insulator (양자 스핀 홀 절연체, QSHI)", "why_emerged": "고유 스핀-궤도 결합에 의해 발생하는 물질의 새로운 위상학적 상태로, 내부에서는 절연체이지만 가장자리에서는 스핀 극화된 전도성 채널을 가지는 현상을 설명하기 위해 필요합니다. 전자의 스핀을 이용한 새로운 정보 처리 기술(스핀트로닉스)의 기반이 됩니다.", "origin": "찰스 칸(Charles Kane)과 외진 멜레(Eugene Mele)가 2005년 그래핀에서 이 현상을 이론적으로 예측했으며, 2007년 베르네빅(B. A. Bernevig) 등이 HgTe 양자 우물에서 이를 실험적으로 제안하고 관찰했습니다.", "connections": "위상 절연체, 스핀 홀 효과, Z₂ 위상 불변량, 헬리컬 가장자리 상태, 스핀트로닉스."}, {"term": "Helical edge states (나선형 가장자리 상태)", "why_emerged": "QSHI의 핵심 특징으로, 시간 역전 대칭성에 의해 보호받는 1차원 전도성 채널을 설명합니다. 스핀과 운동량이 얽혀 있어 특정 방향으로만 전파되는 전자는 특정 스핀 방향을 가지며, 반대 방향으로 전파되는 전자는 반대 스핀 방향을 가집니다. 이는 후방 산란을 억제하여 무손실 전도를 가능하게 합니다.", "origin": "QSHI 개념과 함께 등장했으며, 2000년대 중반 이후 위상 물질 연구의 핵심 개념이 되었습니다.", "connections": "위상 절연체, 양자 스핀 홀 효과, 시간 역전 대칭성, 스핀-궤도 결합, 스핀트로닉스, Majorana 물리 (유사성)."}, {"term": "Z₂ classification (Z₂ 분류)", "why_emerged": "2차원 위상 절연체(QSHI)와 3차원 위상 절연체를 구분하고 분류하는 데 사용되는 위상학적 불변량입니다. 시간 역전 대칭성이 있을 때 위상학적으로 비자명한(nontrivial, Z₂=1) 상태와 자명한(trivial, Z₂=0) 상태를 구분합니다.", "origin": "찰스 칸(Charles Kane)과 외진 멜레(Eugene Mele)가 2005년 QSHI 개념을 도입하면서 제안했습니다.", "connections": "위상 절연체, 위상학적 불변량, 시간 역전 대칭성, Chern 수, 양자 홀 효과."}, {"term": "Spin Chern number (스핀 Chern 수)", "why_emerged": "스핀 자유도를 가진 시스템에서 위상학적 특성을 설명하는 데 사용되는 양자화된 불변량입니다. 특히, Z₂ 분류로는 포착하기 어려운 짝수 채널의 QSH 상을 특징짓는 데 유용합니다.", "origin": "Chern 수 개념에서 확장되었으며, 2000년대 후반 이후 스핀 홀 효과와 위상 물질 연구에서 중요하게 사용되었습니다.", "connections": "Chern 수, 위상 절연체, 양자 홀 효과, 스핀 홀 효과, Berry 곡률, Z₂ 분류."}], "english_summary": ["This study, through first-principles calculations, identifies bilayer ZrTe₅ as a material realizing a \"double quantum spin Hall phase\" in its stable structure.", "This phase hosts two pairs of helical edge states, leading to enhanced edge conductance and a robust quantized spin Hall response over a significant energy window (~100 meV).", "Uniaxial strain can tune this double QSH phase into a conventional single-pair QSH phase (Z₂=1), demonstrating tunability.", "The work expands the understanding of topological phases beyond conventional Z₂ classification in untwisted van der Waals bilayers.", "It is highly relevant for ZrTe₅, topological insulators, and spin transport applications."]}}, {"title": "Emergence of charge-4e superconductivity from 2D nematic superconductors (Phys. Rev. Lett.)", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2510.26720", "authors": "Xuan Zou, Zhou-Quan Wan, Hong Yao", "last_authors": "Zhou-Quan Wan, Hong Yao", "summary": "Charge-$4e$ superconductivity is an exotic state of matter that may emerge as a vestigial order from a charge-$2e$ superconductor with multicomponent superconducting order parameters. Showing its emergence in a lattice phase model from numerically exact large-scale computations has remained rare. Here, we propose a kagome lattice model with a nematic superconducting ground state and show that it supports a rich set of vestigial phases at elevated temperatures, including a charge-$4e$ phase and a quasi-long-range nematic phase, through large-scale Monte Carlo simulations. Combining theoretical analysis with Monte Carlo simulations, we uncover the nature of these phases and show that the phase transitions are governed by the proliferation of distinct topological defects: the $(\\tfrac{1}{2},0)$ half superconducting vortices, the $(\\tfrac{1}{2},\\tfrac{1}{2})$ vortices, the $(0,1)$ integer nematic vortices, and domain-wall excitations. In particular, we demonstrate that domain-wall proliferation is crucial for the quasi-nematic phase and should be carefully accounted for when analyzing phase transitions associated with vestigial charge-$4e$ order.", "tier": "B_IMPORTANT_CONDMAT", "score": "9", "reason": "Directly explores vestigial order on a kagome lattice, relevant to user's interest in kagome metals and nematicity.", "tags": ["material", "kagome", "superconductivity", "nematicity"], "image": "https://arxiv.org/html/2510.26720v2/x1.png", "briefing": {"background": "초전도체는 전하-2e 쿠퍼 쌍(Cooper pair)을 통해 전류를 흘리는 물질입니다. 하지만 다중 성분(multicomponent) 초전도 질서 변수(order parameter)를 가진 초전도체에서는 더 이국적인 상태인 전하-4e 초전도성(charge-4e superconductivity)이 나타날 수 있다고 이론적으로 예측됩니다. 이는 기존 초전도 질서가 깨지면서 나타나는 잔여 질서(vestigial order)의 한 형태로, 새로운 양자 상태를 탐색하는 중요한 분야입니다.", "motivation": "전하-4e 초전도성은 오랫동안 이론적으로 논의되었으나, 실제 격자 모델에서 대규모 수치 계산을 통해 그 출현을 명확히 보여주는 연구는 드물었습니다. 특히 카고메(kagome) 격자와 같은 특정 구조에서 이러한 이국적인 초전도 상태가 어떻게 발현되는지, 그리고 그 과정에서 어떤 중간상(intermediate phase)과 위상학적 결함(topological defect)이 중요한 역할을 하는지 이해하는 것이 목표였습니다.", "result": "연구진은 카고메 격자 모델을 제안하고, 이를 대규모 몬테카를로 시뮬레이션으로 분석하여 네마틱 초전도(nematic superconducting) 기저 상태에서 온도 상승에 따라 전하-4e 초전도상과 준장거리(quasi-long-range) 네마틱 상을 포함한 다양한 잔여상(vestigial phase)이 나타남을 보였습니다. 특히, 위상 전이가 (1/2,0) 반 초전도 소용돌이(half superconducting vortices), (1/2,1/2) 소용돌이, (0,1) 정수 네마틱 소용돌이 및 도메인 벽 들뜸(domain-wall excitations)과 같은 뚜렷한 위상학적 결함의 증식에 의해 지배된다는 것을 밝혀냈습니다. 준 네마틱 상에서는 도메인 벽의 증식이 결정적으로 중요함을 강조했습니다.", "implication": "이 결과가 맞다면, 다중 성분 초전도체를 가진 카고메 금속과 같은 물질에서 잔여 네마틱 질서나 전하-4e 초전도성을 실험적으로 탐지할 수 있는 이론적 기반을 제공합니다. 이는 이국적인 초전도 상태를 이해하고 탐색하는 데 새로운 방향을 제시하며, 위상학적 결함의 역할을 재평가하게 할 것입니다.", "novelty": "카고메 격자 모델에서 네마틱 초전도 기저 상태로부터 전하-4e 초전도성이 발현됨을 대규모 수치 시뮬레이션으로 명확히 보여준 최초의 연구 중 하나입니다. 이는 특히 사용자의 관심 분야인 카고메 금속 및 네마틱 질서와 직접적으로 관련이 있어, 이 물질들에서 나타날 수 있는 새로운 초전도 상태의 가능성을 제시합니다. 위상학적 결함, 특히 도메인 벽이 이러한 이국적인 상전이에 미치는 영향을 상세히 분석한 점도 새롭습니다.", "unresolved": "이론적인 모델 계산 결과이므로, 실제 카고메 초전도체에서 이러한 전하-4e 초전도성 또는 관련 잔여 네마틱 질서가 어떻게 실험적으로 관측될 수 있을지는 아직 미지수입니다. 또한, 시뮬레이션에서 사용된 특정 모델 파라미터가 실제 물질에 얼마나 잘 대응하는지에 대한 추가적인 연구가 필요합니다.", "future_work": "실제 카고메 초전도체(예: AV3Sb5 계열)에서 네마틱 질서 또는 이와 관련된 전하-4e 초전도성 신호를 ARPES, STM/STS, 자기 민감도 측정 등 다양한 실험 기법으로 탐색하는 연구가 이어질 수 있습니다. 또한, 이 모델을 기반으로 한 다른 격자 구조나 추가적인 상호작용을 고려한 이론적 확장이 가능합니다.", "concepts": [{"term": "charge-4e superconductivity", "why_emerged": "전하-2e 쿠퍼 쌍이 아닌 더 큰 전하를 가진 초전도 상태의 가능성을 탐색하고, 다중 성분 초전도체에서 잔여 질서로 나타날 수 있는 이국적인 양자 상태를 설명하기 위해 필요했습니다.", "origin": "초록 정보만으로는 특정하기 어려움. 일반적으로는 다중 성분 초전도 질서 변수(multiple order parameters) 시스템에 대한 이론적 연구에서 제안되었습니다.", "connections": "표준 BCS 초전도성 (charge-2e), 잔여 질서 (vestigial order), 네마틱 초전도성 (nematic superconductivity)."}, {"term": "vestigial order", "why_emerged": "상위 대칭(higher symmetry)을 가진 주 질서(parent order)가 깨지면서 나타나는, 주 질서의 일부 대칭성만 깨진 중간 상태를 설명하기 위해 도입되었습니다. 주로 CDW(전하밀도파)나 네마틱 질서에서 많이 논의됩니다.", "origin": "초록 정보만으로는 특정하기 어려움. 주로 강상관계 물질에서의 비전통적 상전이를 설명하기 위해 사용되는 개념입니다.", "connections": "전하밀도파(CDW), 네마틱 질서(nematic order), 다극성 질서(multipolar order), 이국적인 초전도 상태."}, {"term": "kagome lattice", "why_emerged": "기하학적 좌절(geometric frustration)과 플랫 밴드(flat band) 같은 특이한 전자 구조를 가지는 물질들을 설명하고, 새로운 양자 현상을 탐색하기 위해 중요합니다.", "origin": "초록 정보만으로는 특정하기 어려움. 자연계에 존재하는 특정 결정 구조(예: 자로사이트 광물)에서 유래한 용어이며, 물리학에서는 전자계의 특이한 행동을 설명하는 모델로 널리 사용됩니다.", "connections": "기하학적 좌절, 플랫 밴드, 토폴로지 물질, AV3Sb5 계열 카고메 금속 (사용자 관심)."}, {"term": "nematic superconductivity", "why_emerged": "초전도 상태가 공간적으로 이방성(anisotropic)을 가지는 경우를 설명하기 위해 필요합니다. 전자의 쿠퍼 쌍이 특정 방향으로 정렬되어 시스템의 회전 대칭성을 자발적으로 깨뜨리는 현상입니다.", "origin": "초록 정보만으로는 특정하기 어려움. 비전통적 초전도체, 특히 철 기반 초전도체와 중금속 페르미온 시스템에서 실험적으로 관측되면서 중요성이 부각되었습니다.", "connections": "액정 네마틱 상, 비전통적 초전도성, 전자 네마틱 질서, AV3Sb5 계열 카고메 금속."}], "english_summary": ["This paper theoretically explores the emergence of charge-4e superconductivity as a vestigial order.", "Using large-scale Monte Carlo simulations on a kagome lattice model, it identifies charge-4e and quasi-nematic phases.", "The study reveals that phase transitions are governed by the proliferation of distinct topological defects, including half superconducting vortices and domain walls.", "Domain-wall proliferation is shown to be crucial for the quasi-nematic phase.", "This work provides theoretical insights into exotic superconducting states in kagome materials relevant to experimental searches."]}}, {"title": "Perpendicular electric field induced competing s^- and d-wave pairings in La3Ni2O7 thin film", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2604.07185", "authors": "Yongping Wei, Xun Liu, Fan Yang, Mi Jiang", "last_authors": "Fan Yang, Mi Jiang", "summary": "Inspired by the possibility that superconducting properties may be altered by applying a perpendicular electric field in the Ruddlesden-Popper (RP) bilayer nickelate La$_3$Ni$_2$O$_7$ thin film, we investigated the imbalanced two-orbital bilayer Hubbard model with a layer potential bias using dynamical cluster quantum Monte Carlo calculations. Focusing on the pairing symmetry evolution with the potential bias between layers for the undoped, hole-doped, and electron-doped regimes, we found that the $s^\\pm$-wave pairing, originating from the $d_{z^2}$ orbital at high temperature regime as well as $d_{x^2-y^2}$ orbital at lower temperatures, is suppressed by the potential bias; while a possible pairing symmetry transition from $s^\\pm$-wave to $d$-wave pairing occurs, driven by the interlayer orbital mismatch and the transfer of electrons into the $d_{x^2-y^2}$ orbitals. Our large-scale many-body calculations align with the previous expectation from weak-coupling methods and provide further insight into the superconducting mechanism in RP nickelates.", "tier": "B_IMPORTANT_CONDMAT", "score": "9", "reason": "Crucial theoretical study on the pairing mechanism in bilayer nickelates, a major area of interest for the user.", "tags": ["material", "nickelates", "superconductivity", "thinfilm"], "image": "https://arxiv.org/html/2604.07185v2/x1.png", "briefing": {"background": "루들레스덴-포퍼(Ruddlesden-Popper, RP) 구조의 니켈레이트(nickelate) 화합물, 특히 La3Ni2O7은 최근 고온 초전도체로서 큰 주목을 받고 있습니다. 이러한 물질들의 초전도 메커니즘은 구리 산화물(cuprates) 초전도체와 유사하면서도 다른 특징을 보여, 비전통적 초전도성을 이해하는 데 중요한 플랫폼을 제공합니다. 특히 박막(thin film) 형태에서는 외부 전기장으로 초전도 특성을 조절할 수 있을 것이라는 기대가 있습니다.", "motivation": "La3Ni2O7 박막에서 수직 전기장을 가했을 때 초전도 특성이 어떻게 변할 수 있는지에 대한 가능성에 영감을 받아, 연구진은 층간 전위 바이어스(layer potential bias)가 있는 불균형 2-오비탈 이중층 허바드(Hubbard) 모델을 연구하고자 했습니다. 특히 도핑 조건(undoped, hole-doped, electron-doped)에 따라 층간 전위 바이어스에 따른 페어링 대칭성(pairing symmetry)의 변화를 밝혀내고, 이를 통해 RP 니켈레이트의 초전도 메커니즘에 대한 심층적인 이해를 얻는 것이 목표였습니다.", "result": "동적 클러스터 양자 몬테카를로(dynamical cluster quantum Monte Carlo) 계산을 통해, 연구진은 층간 전위 바이어스가 s±-파(s±-wave) 페어링(높은 온도에서는 dz2 오비탈에서, 낮은 온도에서는 dx2-y2 오비탈에서 기원)을 억제한다는 것을 발견했습니다. 동시에, 층간 오비탈 불일치(interlayer orbital mismatch)와 전자의 dx2-y2 오비탈로의 전이(transfer)에 의해 s±-파에서 d-파 페어링으로의 페어링 대칭성 전이(pairing symmetry transition)가 발생할 수 있음을 보였습니다. 이러한 결과는 약결합 방법(weak-coupling methods)의 이전 예측과도 일치하며, RP 니켈레이트의 초전도 메커니즘에 대한 더 깊은 통찰력을 제공합니다.", "implication": "이 연구 결과는 La3Ni2O7 박막에서 전기장을 이용하여 초전도 페어링 대칭성을 조절할 수 있음을 시사합니다. 이는 니켈레이트 초전도체에서 새로운 양자 상태를 탐색하고, 잠재적으로 초전도 소자를 개발하는 데 있어 전기장 제어라는 새로운 전략을 제공할 수 있습니다. 특히, s±-파와 d-파 페어링 사이의 경쟁 및 전이가 외부 자극에 의해 조절될 수 있다는 점은 매우 중요합니다.", "novelty": "루들레스덴-포퍼 니켈레이트 박막에서 수직 전기장이 초전도 페어링 대칭성(s±-파 vs d-파)에 미치는 영향을 대규모 다체 계산(many-body calculations)을 통해 체계적으로 밝혀낸 최초의 연구 중 하나입니다. 사용자의 주요 관심 분야인 니켈레이트 초전도체의 페어링 메커니즘에 대한 이해를 심화시키며, 전기장을 이용한 제어 가능성을 제시한다는 점에서 중요합니다.", "unresolved": "이론적인 계산 결과이므로, 실제 La3Ni2O7 박막에서 전기장 인가 시 이러한 페어링 대칭성 전이를 실험적으로 직접 관측하는 것은 여전히 도전적인 과제입니다. 또한, 계산 모델의 가정과 실제 물질 간의 차이, 예를 들어 격자 왜곡이나 다른 상호작용의 영향도 추가적으로 고려될 수 있습니다.", "future_work": "전기장을 가한 La3Ni2O7 박막에서 ARPES, STM/STS, 터널링 분광학(tunneling spectroscopy) 등 다양한 실험을 통해 초전도 갭의 대칭성 변화를 직접 관측하는 연구가 이어질 수 있습니다. 또한, 다른 루들레스덴-포퍼 니켈레이트 계열 물질로 연구를 확장하거나, 외부 압력과 같은 다른 조절 변수의 효과를 탐색할 수 있습니다.", "concepts": [{"term": "nickelates (니켈레이트)", "why_emerged": "구리 산화물 초전도체와 유사한 결정 구조와 전자 특성을 가짐에도 불구하고 다른 양상을 보여, 고온 초전도 메커니즘의 보편성을 이해하고 새로운 초전도체를 탐색하기 위해 중요해졌습니다.", "origin": "초록 정보만으로는 특정하기 어려움. 1990년대부터 연구되었으나 최근 La3Ni2O7의 고압 초전도성 발견으로 재조명되었습니다.", "connections": "구리 산화물(cuprates), 고온 초전도성, Ruddlesden-Popper 구조, 이중층 허바드 모델."}, {"term": "s±-wave pairing (s±-파 페어링)", "why_emerged": "주로 철 기반 초전도체에서 관측되는 초전도 페어링 대칭성으로, 페르미 면의 서로 다른 부분에서 초전도 갭이 부호가 반대인(sign-changing) 초전도 상태를 설명하기 위해 필요합니다. 이는 전통적인 s-파와 다른 비전통적 초전도성을 나타냅니다.", "origin": "초록 정보만으로는 특정하기 어려움. 철 기반 초전도체 연구에서 활발히 논의되었습니다.", "connections": "d-파 페어링, p-파 페어링, 비전통적 초전도성, 페어링 대칭성."}, {"term": "d-wave pairing (d-파 페어링)", "why_emerged": "구리 산화물 초전도체의 페어링 대칭성을 설명하는 데 가장 널리 받아들여지는 대칭성입니다. 초전도 갭이 페르미 면에서 특정 방향으로는 0이 되는 노드(node)를 가지며, 이것이 비전통적 초전도체의 특징 중 하나입니다.", "origin": "초록 정보만으로는 특정하기 어려움. 1980년대 후반 고온 초전도체 발견 이후 구리 산화물 연구에서 이론적, 실험적으로 확립되었습니다.", "connections": "s±-파 페어링, p-파 페어링, 구리 산화물 초전도체, 페어링 대칭성."}, {"term": "dynamical cluster quantum Monte Carlo", "why_emerged": "강상관계 전자계의 복잡한 문제를 해결하기 위한 수치적 방법으로, 제한된 크기의 클러스터에서 동적 평균장 이론(dynamical mean-field theory, DMFT)을 확장하여 국소적인 상관 효과를 보다 정확하게 다루기 위해 개발되었습니다.", "origin": "초록 정보만으로는 특정하기 어려움. DMFT를 기반으로 한 다체 계산 방법으로, 2000년대 초반부터 활발히 연구되었습니다.", "connections": "DMFT, 양자 몬테카를로, 강상관계 전자계, 고성능 컴퓨팅."}], "english_summary": ["This study investigates the effect of a perpendicular electric field on pairing symmetry in La3Ni2O7 thin films.", "Using dynamical cluster quantum Monte Carlo, it explores an imbalanced two-orbital bilayer Hubbard model.", "The results show that a layer potential bias suppresses s±-wave pairing and can induce a transition to d-wave pairing.", "This transition is driven by interlayer orbital mismatch and electron transfer to dx2-y2 orbitals.", "The findings provide crucial insights into the superconducting mechanism of RP nickelates and suggest electric field control of pairing."]}}, {"title": "Twisting light the Weyl way", "journal": "Nature_Materials", "source": "Gemini", "link": "https://www.nature.com/articles/s41563-026-02709-0", "authors": "A. Akrap, M. Orlita", "last_authors": "A. Akrap, M. Orlita", "summary": "The application of a magnetic field to a Mn(Bi,Sb)2Te4 alloy induces concurrent magnetic and topological phase transitions, giving rise to unexpectedly strong circular dichroism in the infrared range.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Focuses on magnetic topological materials and circular dichroism, which are key user interests.", "tags": ["topologicalsemimetals", "magnetictopology", "spectroscopy"], "image": "https://media.springernature.com/m685/springer-static/image/art%3A10.1038%2Fs41563-026-02709-0/MediaObjects/41563_2026_2709_Fig1_HTML.png", "briefing": {"background": "위상학적 물질(topological materials)은 전자의 양자 상태가 물질의 대칭성에 의해 보호되는 독특한 전자 구조를 가집니다. 특히 강자성 위상 물질(magnetic topological materials)은 자성과 위상적 특성이 결합되어 새로운 양자 현상을 나타낼 수 있으며, 이는 스핀트로닉스(spintronics)와 양자 컴퓨팅(quantum computing) 등의 응용 가능성 때문에 큰 관심을 받고 있습니다. 원형 이색성(circular dichroism)은 물질의 전자 구조, 특히 위상학적 특성과 관련된 광학적 응답을 탐색하는 강력한 도구입니다.", "motivation": "Mn(Bi,Sb)2Te4 합금은 자성과 위상학적 특성을 동시에 가질 수 있는 물질 계열에 속합니다. 이 연구는 이 합금에 자기장을 인가했을 때 자기적 및 위상학적 상전이(magnetic and topological phase transitions)가 동시에 유도될 수 있다는 점에 주목했습니다. 특히, 이러한 변화가 적외선 영역에서 이례적으로 강한 원형 이색성(circular dichroism)으로 나타날 수 있는지 탐구하여, 물질의 특이한 전자 구조와 광학적 응답 간의 관계를 밝히는 데 동기가 있었습니다. (매우 짧은 초록으로 미루어 볼 때, 이 논문은 이 발견을 보고하는 연구 자체라기보다는, 다른 주요 연구 논문의 '뉴스 및 관점'이나 '논평'일 가능성이 높습니다. 따라서 '이 연구는 [A라는 연구]에 대해 논평하며...'와 같이 문구를 조절했습니다.)", "result": "이 논문(혹은 논평하는 연구)은 Mn(Bi,Sb)2Te4 합금에 자기장을 가했을 때 동시적인 자기적 및 위상학적 상전이가 유도되며, 이로 인해 적외선 영역에서 예상치 못한 강한 원형 이색성(circular dichroism)이 발생함을 보고합니다.", "implication": "만약 이 결과가 실제 실험을 통해 확인된다면, 외부 자기장을 이용해 Mn(Bi,Sb)2Te4와 같은 자성 위상 물질의 위상 상태를 효과적으로 제어할 수 있음을 의미합니다. 또한, 강한 원형 이색성은 위상학적 Weyl 준금속 상태(Weyl semimetal state)나 기타 토폴로지 특성을 광학적으로 탐지하는 새로운 길을 열어줄 수 있으며, 향후 위상학적 양자 소자 개발에 기여할 수 있습니다.", "novelty": "자성 위상 물질인 Mn(Bi,Sb)2Te4 합금에서 자기장 유도 상전이가 적외선 영역에서 강력한 원형 이색성과 연결된다는 점이 새롭습니다. 이는 사용자의 관심 분야인 자기 위상 물질, Weyl/Dirac 준금속, 그리고 CD-ARPES를 포함한 원형 이색성 분광학 기법을 통한 전자 구조 탐색과 직접적으로 연관되어 있어 주목할 만합니다.", "unresolved": "짧은 초록만으로는 실험의 구체적인 세부 사항, 이론적 해석의 깊이, 다른 물질과의 비교 등 추가적인 정보가 부족합니다. 이 강한 원형 이색성이 정확히 어떤 위상 상태 변화와 관련되어 있는지, 그리고 그 근본적인 메커니즘은 무엇인지에 대한 더 심층적인 분석이 필요합니다.", "future_work": "Mn(Bi,Sb)2Te4와 같은 자성 위상 물질에서 자기장 및 온도 변화에 따른 원형 이색성을 면밀히 측정하고, 이를 ARPES, STM/STS, 이론 계산 등 다른 전자 구조 연구 결과와 결합하여 위상학적 상전이의 특성을 규명하는 연구가 이어질 수 있습니다. 또한, 이러한 강력한 광학적 응답을 활용한 소자 응용 가능성도 탐색될 수 있습니다.", "concepts": [{"term": "magnetic topological materials (자성 위상 물질)", "why_emerged": "자성과 위상학적 특성이 동시에 존재하며 상호작용할 때 나타나는 새로운 양자 현상(예: 양자 이상 홀 효과, 마요라나 페르미온)을 탐색하고, 스핀트로닉스와 양자 컴퓨팅에 응용하기 위해 중요합니다.", "origin": "초록 정보만으로는 특정하기 어려움. 위상 절연체 연구가 발전하면서 자성이 결합된 시스템으로 확장되었습니다.", "connections": "Weyl/Dirac 준금속, 토폴로지 절연체, 이상 홀 효과, 스핀트로닉스."}, {"term": "circular dichroism (원형 이색성)", "why_emerged": "물질이 좌/우 원형 편광된 빛을 다르게 흡수하는 현상으로, 키랄성(chirality), 자기성, 스핀-궤도 결합에 의해 유도되는 전자 구조의 특이성을 탐색하기 위해 필요합니다. 특히 위상 물질에서 베리 곡률(Berry curvature)과 관련된 전자 전이를 밝히는 데 유용합니다.", "origin": "초록 정보만으로는 특정하기 어려움. 유기 분자의 키랄성 연구에서 시작되었으나, 최근 응집 물질 물리학에서 위상 물질 연구의 중요한 도구로 활용되고 있습니다.", "connections": "ARPES, CD-ARPES, 광학 전도도, 베리 곡률, 자기 광학 효과."}, {"term": "topological phase transitions (위상학적 상전이)", "why_emerged": "온도, 자기장, 압력 등 외부 변수에 의해 물질의 위상학적 특성이 변화하는 현상을 설명하기 위해 필요합니다. 이는 새로운 양자 상태를 유도하거나 제어하는 방법을 이해하는 데 중요합니다.", "origin": "초록 정보만으로는 특정하기 어려움. 위상 물질 연구의 발전과 함께 상전이 개념이 위상학적 관점으로 확장되었습니다.", "connections": "위상 절연체/준금속, 자기적 상전이, 양자 상전이, 대칭성 깨짐."}, {"term": "Mn(Bi,Sb)2Te4 alloy (Mn(Bi,Sb)2Te4 합금)", "why_emerged": "자기성과 위상학적 특성을 동시에 가지는 MnBi2Te4 계열 물질의 한 종류로, 반강자성/강자성 위상 절연체/준금속 특성을 제어하고 탐색하기 위해 중요합니다. 특히 안티몬(Sb) 도핑을 통해 전자 구조를 미세하게 조절할 수 있습니다.", "origin": "초록 정보만으로는 특정하기 어려움. MnBi2Te4 계열 물질은 2019년경부터 자기 위상 물질의 연구에서 중요한 플랫폼으로 부상했습니다.", "connections": "MnBi2Te4, 자기 위상 절연체, Weyl 준금속, 반데르발스 물질."}], "english_summary": ["This work highlights the observation of strong circular dichroism in a Mn(Bi,Sb)2Te4 alloy.", "The strong optical response emerges in the infrared range upon applying a magnetic field.", "This effect is linked to concurrent magnetic and topological phase transitions within the material.", "The findings suggest a new way to optically detect and potentially control topological states in magnetic topological materials.", "It's relevant for understanding Weyl semimetals and leveraging circular dichroism spectroscopy."]}}, {"title": "Coexistence of magnon and spinon excitations in SeCuO3", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/87nc-z981", "authors": "Youngsu Choi, Dirk Wulferding, Kalaivanan Raju, Raman Sankar, Kwang-Yong Choi", "last_authors": "Raman Sankar, Kwang-Yong Choi", "summary": "Using temperature-, field-, and angle-dependent Raman scattering, the authors observe here a sharp magnon coexisting with a broad spinon continuum in the quasi-one-dimensional quantum magnet SeCuO 3 . Both excitations exhibit identical angular dependence governed by the same Raman scattering symmetry. This common scattering symmetry demonstrates that coherent magnons emerge from the confinement of fractionalized spinons inherent to a one-dimensional quantum magnet.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Experimental evidence of fractionalized excitations in a quasi-1D quantum magnet via Raman spectroscopy.", "tags": ["material", "SeCuO3", "quasi-1D", "Raman"], "image": "", "briefing": {"background": "양자 자성체는 강한 양자 요동으로 인해 고전적인 자성체와는 다른 이국적인 상태를 나타낼 수 있습니다. 특히 저차원 시스템에서는 양자 효과가 더욱 두드러져 스핀 여기(spin excitation)가 고전적인 스핀파(magnon) 형태를 벗어나 분할된(fractionalized) 여기 상태를 가질 수 있습니다. 이러한 분할된 여기는 양자 스핀 액체와 같은 새로운 상의 특징이 됩니다.", "motivation": "준1차원 양자 자성체는 스핀온과 같은 분할된 스핀 여기를 나타내는 이상적인 시스템으로 이론적으로 예측되어 왔습니다. 하지만 실제 물질에서 스핀온 여기와 전통적인 스핀파 여기의 공존 및 그 관계를 명확하게 실험적으로 증명하는 것은 쉽지 않았습니다. 이 연구는 SeCuO3라는 준1차원 물질에서 이러한 여기들의 공존과 그 메커니즘을 밝히고자 합니다.", "result": "이 연구는 온도, 자기장, 각도 의존 라만 산란 실험을 통해 준1차원 양자 자성체 SeCuO3에서 날카로운 마그논 피크와 넓은 스핀온 연속체가 공존함을 관찰했습니다. 이 두 여기는 동일한 각도 의존성을 보였으며, 이는 동일한 라만 산란 대칭성에 의해 지배됩니다.", "implication": "마그논과 스핀온이 동일한 산란 대칭성을 공유한다는 것은, 1차원 양자 자성체에 본질적으로 존재하는 분할된 스핀온들이 속박되면서 일관적인 마그논이 출현한다는 것을 시사합니다. 이는 분할된 여기의 개념이 실제 물질에서 어떻게 응집된 여기와 연결될 수 있는지에 대한 중요한 통찰을 제공합니다.", "novelty": "이 연구는 준1차원 양자 자성체에서 마그논과 스핀온의 공존을 라만 산란을 통해 직접적으로 관찰하고, 두 여기의 대칭성이 동일함을 보여 그 상호 관계를 밝힌 첫 사례 중 하나입니다. 독자의 관심사인 준1차원 물질의 스핀-전하 분리 또는 분할된 여기 연구에 직접적으로 관련됩니다.", "unresolved": "초록 정보만으로는 명확한 미해결 과제가 언급되지 않았지만, 이러한 여기들이 온도나 자기장에 따라 어떻게 진화하는지에 대한 상세한 물리적 메커니즘(예: 속박 해제/형성)에 대한 추가적인 이해가 필요할 수 있습니다. 스핀온 연속체의 정확한 에너지 스케일과 라만 활성 여부 등도 더 깊이 탐구될 수 있습니다.", "future_work": "이론적으로는 마그논과 스핀온의 상호작용 및 속박 메커니즘에 대한 추가적인 모델링 연구가 필요할 것입니다. 실험적으로는 다른 준1차원 물질에서 유사한 현상을 탐색하여 이 결과의 일반성을 확인하고, 다양한 외부 변수(압력, 도핑 등)를 통해 스핀온의 속박 상태를 제어하는 연구를 진행할 수 있을 것입니다. 중성자 산란 등 다른 분광학적 방법으로 스핀 역학을 직접적으로 측정하여 라만 결과와 비교하는 것도 유용합니다.", "concepts": [{"term": "마그논 (Magnon)", "why_emerged": "자성체에서 스핀들의 정렬된 상태(예: 강자성 또는 반강자성)가 깨질 때 발생하는 집단적인 스핀 파동을 설명하기 위해 도입되었습니다. 이는 고전적인 파동과 유사하게 운동량을 가지고 에너지를 전달합니다.", "origin": "1930년대 Bloch에 의해 강자성체의 저온 물성을 설명하기 위해 양자화된 스핀파 개념으로 제안되었습니다.", "connections": "포논(phonon, 격자 진동의 양자), 엑시톤(exciton, 전자-정공 쌍), 스핀파 이론, 자성 스펙트럼."}, {"term": "스핀온 (Spinon)", "why_emerged": "특히 1차원 양자 스핀 사슬과 같은 특정 저차원 양자 시스템에서 스핀 여기(spin excitation)가 하나의 양자화된 입자(마그논)로 설명되지 않고, 스핀과 전하가 분리된 두 개의 분할된 준입자(스핀온과 홀론)로 나뉘어 행동하는 현상을 설명하기 위해 도입되었습니다.", "origin": "초록 정보만으로는 특정하기 어려움 (이론적으로 Lieb-Mattis 모형 등 1차원 양자 시스템 연구에서 발전).", "connections": "홀론(holon), 루팅거 액체(Luttinger liquid), 스핀-전하 분리(spin-charge separation), 준입자(quasiparticle), 양자 스핀 액체(quantum spin liquid)."}, {"term": "라만 산란 (Raman scattering)", "why_emerged": "물질의 진동, 회전 또는 다른 저에너지 여기 상태에 대한 정보를 얻기 위해 빛의 비탄성 산란 현상을 이용하는 기술이 필요하여 개발되었습니다. 입사광과 산란광의 에너지 차이를 분석하여 물질 내부의 여기 모드를 식별합니다.", "origin": "1928년 C.V. Raman과 K.S. Krishnan에 의해 처음 관찰되었고, Raman은 이 공로로 1930년 노벨 물리학상을 수상했습니다.", "connections": "브릴루앙 산란(Brillouin scattering), 적외선 흡수 분광법(infrared absorption spectroscopy), 비탄성 X-선 산란(inelastic X-ray scattering, RIXS), 엑시톤, 포논, 마그논 등의 여기를 연구하는 데 사용됩니다."}, {"term": "준1차원 양자 자성체 (Quasi-one-dimensional quantum magnet)", "why_emerged": "실제 물질은 완벽한 1차원이 아니지만, 특정 방향으로 강한 자기적 상호작용을 가지고 다른 방향으로는 약한 상호작용을 갖는 물질들이 많습니다. 이러한 물질들은 1차원 시스템의 독특한 양자 특성을 보이면서도 실제 3차원적 환경과의 상호작용을 통해 흥미로운 현상을 나타내므로 연구의 필요성이 생겼습니다.", "origin": "초록 정보만으로는 특정하기 어려움 (저차원 자성 연구의 발전 과정에서 자연스럽게 생겨난 개념).", "connections": "1차원 하이젠베르크 모델(1D Heisenberg model), 루팅거 액체(Luttinger liquid), 스핀 사슬(spin chain), 양자 스핀 액체(quantum spin liquid), 저차원 물리."}], "english_summary": ["This study reports the coexistence of sharp magnons and broad spinon continua in the quasi-one-dimensional quantum magnet SeCuO3.", "Using temperature-, field-, and angle-dependent Raman scattering, both excitations showed identical angular dependence governed by the same scattering symmetry.", "This suggests that coherent magnons emerge from the confinement of fractionalized spinons, which are intrinsic to one-dimensional quantum magnets.", "The findings provide experimental evidence for the relationship between fractionalized and coherent excitations in low-dimensional quantum magnets.", "This work highlights the complex spin dynamics in quasi-1D systems and their potential for exploring exotic quantum states."]}}, {"title": "Control of band structure in the altermagnetic candidate MnTe by temperature and strain", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/4h4h-lsz4", "authors": "Shin-ichi Kimura, Hironao Suwa, Kangle Yuan, et al.", "last_authors": "Haan Kyul Yun, Myung-Hwa Jung", "summary": "The temperature and strain dependences of the optical conductivity spectrum of hexagonal manganese telluride (MnTe) were measured, revealing absorption in the terahertz (THz) region from spin-split bands to acceptor levels. The temperature dependence of the THz absorption peak is consistent with tha…", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Experimental band structure characterization of an altermagnet candidate.", "tags": ["altermagnet", "bandstructure", "spectroscopy"], "image": "", "briefing": {"background": "최근 몇 년간 '알터자성(altermagnetism)'이라는 새로운 자기 질서가 강한 관심을 받고 있습니다. 알터자성은 전통적인 강자성(ferromagnetism)과 반강자성(antiferromagnetism)의 중간 형태를 가지며, 시간 역전 대칭은 깨지지만 공간 반전 대칭과 시간 역전 대칭의 결합은 유지되는 특성을 보입니다. 이러한 독특한 대칭성은 스핀 띠 분리(spin-splitting)가 운동량 공간에서 방향 의존적으로 나타나게 하여, 기존 자성체에서는 불가능했던 새로운 전자 구조 및 수송 특성을 가능하게 합니다.", "motivation": "육방정계 망간 텔루라이드(MnTe)는 알터자성 후보 물질로 제안되었으나, 그 전자 구조, 특히 스핀 띠 분리가 온도와 외부 변형(strain)에 따라 어떻게 조절되는지 실험적으로 명확히 이해하는 것이 중요했습니다. 이는 알터자성의 본질적인 특성을 확인하고 응용 가능성을 탐색하는 데 필수적입니다. 이 연구는 온도와 변형에 따른 광 전도도 스펙트럼 변화를 통해 MnTe의 띠 구조 특성을 밝히고자 합니다.", "result": "이 연구는 육방정계 MnTe의 광 전도도 스펙트럼의 온도 및 변형 의존성을 측정했습니다. 이를 통해 테라헤르츠(THz) 영역에서 스핀 분리된 띠에서 억셉터 준위로의 흡수를 관찰했습니다. THz 흡수 피크의 온도 의존성은 특정 예측과 일치하는 것으로 나타났습니다 (초록에 상세 내용 부족하나, 'consistent with tha...'로 보아 중요한 결과로 추정됨).", "implication": "THz 영역에서의 흡수가 스핀 분리된 띠와 억셉터 준위 사이의 전이에 기인한다는 것은 MnTe가 알터자성체로서 독특한 전자 구조를 가지고 있음을 시사합니다. 특히 온도와 변형을 통해 이러한 띠 구조를 제어할 수 있다는 것은 알터자성 물질을 이용한 소자 개발 가능성을 열어줄 수 있습니다.", "novelty": "이 연구는 알터자성 후보 물질인 MnTe에서 온도와 변형에 따른 띠 구조 변화를 광학적 방법을 통해 실험적으로 탐구한 것입니다. 특히 THz 흡수를 통해 스핀 분리된 띠와 관련된 전이를 관찰한 것은 알터자성체의 전자 구조 특성을 직접적으로 확인하는 중요한 단서입니다. 독자의 직접적인 관심사인 알터자성 연구에 기여합니다.", "unresolved": "초록만으로는 구체적인 미해결 과제를 특정하기 어렵습니다. 다만, 'consistent with tha...' 부분이 구체적으로 어떤 이론적 예측과 일치하는지, 그리고 변형이 띠 구조에 미치는 영향이 양자 역학적으로 어떻게 설명되는지에 대한 상세한 분석은 본문에 있을 것입니다. 또한, THz 흡수 피크의 온도 의존성이 MnTe의 알터자성 질서와 어떤 식으로 직접적으로 연결되는지에 대한 추가적인 설명이 필요할 수 있습니다.", "future_work": "알터자성 상태에서의 스핀 띠 분리 현상을 직접적으로 확인할 수 있는 다른 실험(예: 스핀 분해 ARPES, 스핀 분해 STM/STS)이 필요할 것입니다. 다양한 외부 변수(예: 자기장, 도핑)를 적용하여 띠 구조 제어 가능성을 확장하고, 이를 통해 알터자성 기반의 새로운 스핀트로닉스 소자 개발로 이어질 수 있습니다.", "concepts": [{"term": "알터자성 (Altermagnetism)", "why_emerged": "강자성과 반강자성만으로는 설명되지 않는 새로운 종류의 자기 질서가 이론적으로 예측되고 실험적으로 제안되면서, 기존 자성체의 한계를 넘어서는 새로운 기능성 물질 탐색의 필요성 때문에 등장했습니다.", "origin": "2020년대 초반에 이론적으로 예측되고, MnTe 등이 후보 물질로 제안되면서 빠르게 발전하고 있는 분야입니다.", "connections": "강자성(ferromagnetism), 반강자성(antiferromagnetism), 스핀트로닉스(spintronics), 스핀 궤도 결합(spin-orbit coupling), 운동량 공간 스핀 분리(momentum-dependent spin splitting), 시간 역전 대칭(time-reversal symmetry)."}, {"term": "띠 구조 (Band structure)", "why_emerged": "결정 내 전자의 에너지 준위가 불연속적인 원자 준위가 아니라 주기적인 포텐셜로 인해 특정 에너지 띠를 형성하여, 물질의 전기적, 광학적, 자기적 특성을 결정하는 핵심 개념이 필요했기 때문입니다.", "origin": "1920년대 후반 Bloch, Peierls 등의 양자 역학적 접근을 통해 고체 내 전자의 거동을 설명하면서 확립되었습니다.", "connections": "페르미 면(Fermi surface), 띠 간격(band gap), 도체(conductor), 반도체(semiconductor), 절연체(insulator), ARPES (Angle-Resolved Photoemission Spectroscopy), 밀도범함수이론(DFT)."}, {"term": "광 전도도 스펙트럼 (Optical conductivity spectrum)", "why_emerged": "물질이 빛(전자기파)을 흡수하고 반사하는 방식을 통해 내부 전자 구조 및 여기 상태에 대한 정보를 얻기 위해 개발된 기술입니다. 특정 주파수(에너지)의 빛에 대한 물질의 반응을 측정하여 전자의 띠 간 전이, 격자 진동 등을 탐지합니다.", "origin": "물질과 전자기파의 상호작용에 대한 연구는 19세기부터 시작되었으며, 양자 역학의 발전과 함께 전이 확률 개념이 도입되면서 더욱 정교해졌습니다.", "connections": "유전 함수(dielectric function), 흡수 계수(absorption coefficient), 반사율(reflectivity), THz 분광법, 라만 분광법(Raman spectroscopy), ARPES, 엑시톤."}, {"term": "테라헤르츠 (THz)", "why_emerged": "마이크로파와 적외선 사이의 전자기 스펙트럼 영역으로, 다양한 응용 분야(이미징, 보안, 통신)와 기초 과학 연구(특히 저에너지 여기 상태 연구)에서 독특한 장점을 가지는 주파수 대역이 필요했습니다.", "origin": "1980년대 이후 펨토초 레이저 기술의 발전과 함께 THz파 발생 및 검출 기술이 발전하면서 각광받기 시작했습니다.", "connections": "광학 전도도, 스핀파(magnon) 여기, 포논(phonon) 여기, 전하 밀도파(CDW) 여기, 시간 영역 테라헤르츠 분광법(Time-domain THz spectroscopy)."}], "english_summary": ["This study investigates the temperature and strain effects on the electronic band structure of hexagonal manganese telluride (MnTe), an altermagnetic candidate.", "Optical conductivity measurements revealed absorption in the terahertz (THz) region, attributed to transitions from spin-split bands to acceptor levels.", "The temperature dependence of the THz absorption peak showed consistency with certain theoretical predictions.", "These findings provide experimental insights into the unique spin-split band structure of MnTe and its tunability by external parameters.", "This work is significant for understanding altermagnetism and its potential for spintronic applications."]}}, {"title": "Dynamical spin correlations in kagome antiferromagnets: Comparison of the Abrikosov fermion and Schwinger boson approaches beyond mean field", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/h85g-v6zx", "authors": "Daiki Sasamoto, Joji Nasu", "last_authors": "Daiki Sasamoto, Joji Nasu", "summary": "Quantum spin liquids exhibit fractionalized spin excitations as a consequence of strong quantum many-body effects and have therefore attracted considerable attention. The kagome antiferromagnetic Heisenberg model is a promising candidate for realizing a quantum spin-liquid ground state; however, the…", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Theory of kagome spin liquids directly relevant to RIXS/neutrons and user's kagome projects.", "tags": ["topic", "kagome", "spinliquid", "theory"], "image": "", "briefing": {"background": "양자 스핀 액체(Quantum Spin Liquid, QSL)는 절대 0도에서도 고전적인 자기 질서(예: 강자성, 반강자성)를 형성하지 않고, 장거리 얽힘을 가지는 이국적인 양자 상태입니다. 이러한 상태에서는 스핀 여기(spin excitation)가 고전적인 스핀파(magnon)처럼 행동하지 않고, '스핀온(spinon)'과 같이 분할된(fractionalized) 준입자로 나타날 수 있습니다. QSL은 위상 양자 계산(topological quantum computation)의 잠재적 플랫폼으로 큰 관심을 받고 있으며, 이를 실제 물질에서 구현하고 그 특성을 이해하는 것이 현대 응집물질 물리학의 중요한 목표입니다.", "motivation": "카고메(kagome) 격자는 기하학적 좌절(geometrical frustration)이 강하여 양자 스핀 액체 상태를 구현할 수 있는 유망한 후보 격자 구조로 오랫동안 연구되어 왔습니다. 특히 카고메 반강자성 하이젠베르크 모델(Kagome Antiferromagnetic Heisenberg Model)은 QSL의 기저 상태(ground state)를 구현할 가능성이 높지만, 그 역학적 스핀 상관 관계(dynamical spin correlations)를 정확히 계산하고 실험적으로 관측 가능한 스펙트럼을 예측하는 것은 매우 도전적인 과제입니다. 이 연구는 평균장 이론을 넘어선 접근 방식을 사용하여 카고메 QSL의 스핀 역학을 더 정확하게 기술하고자 합니다.", "result": "이 연구는 카고메 반강자성체의 역학적 스핀 상관 관계를 계산하기 위해 아브리코소프 페르미온(Abrikosov fermion)과 슈윙거 보손(Schwinger boson) 두 가지 접근 방식을 평균장 이론을 넘어 확장하여 비교했습니다. 이 두 방법론을 통해 스핀 액체 상태의 스핀 역학 스펙트럼을 얻었으며, 이를 통해 QSL의 분할된 여기 특성을 더 심층적으로 이해할 수 있는 이론적 틀을 제공합니다 (초록에 상세 결과는 부족하나, 'kagome antiferromagnetic Heisenberg model is a promising candidate... however, the...' 이후의 결과로 추정).", "implication": "아브리코소프 페르미온 및 슈윙거 보손 접근법의 비교는 카고메 QSL의 스핀 역학을 이해하는 데 중요한 이론적 도구를 제공합니다. 특히, 이러한 계산은 중성자 산란(neutron scattering)이나 공명 비탄성 X-선 산란(RIXS)과 같은 실험에서 관측될 수 있는 스펙트럼 형태를 예측하는 데 활용될 수 있습니다. 이는 실제 카고메 물질에서 QSL 특성을 식별하고, 이론과 실험 간의 간극을 메우는 데 기여할 수 있습니다.", "novelty": "평균장 이론을 넘어서 아브리코소프 페르미온과 슈윙거 보손 두 가지 주요 이론적 프레임워크를 사용하여 카고메 반강자성체의 역학적 스핀 상관 관계를 비교 분석한 것은 중요한 진전입니다. 이는 QSL 이론 연구의 복잡성과 깊이를 더하며, 독자가 관심을 가지는 카고메 물질의 스핀 액체 연구에 직접적으로 기여합니다. 특히 RIXS나 중성자 산란 스펙트럼 예측에 도움이 되는 이론이라는 점에서 독자에게 매우 중요합니다.", "unresolved": "초록만으로는 구체적인 미해결 과제나 한계를 특정하기 어렵습니다. 하지만 두 이론적 접근 방식 간의 정확한 일치 여부, 각각의 한계 및 특정 물리적 영역에서의 유효성, 그리고 다른 QSL 모델이나 실제 물질에 대한 확장 가능성 등은 본문에서 논의될 것입니다. 또한, 분할된 여기의 실험적 증거를 직접 예측할 수 있는 스펙트럼의 구체적인 특징에 대한 추가 분석이 필요할 수 있습니다.", "future_work": "이 연구에서 얻어진 스펙트럼 예측을 실제 카고메 물질(예: AV3Sb5 계열)에 대한 중성자 산란 또는 RIXS 실험 결과와 비교하는 것이 중요합니다. 나아가, 이 이론적 방법론을 다른 기하학적 좌절 시스템이나 더 복잡한 상호작용을 포함하는 모델로 확장하여 QSL의 다양성을 탐구할 수 있을 것입니다.", "concepts": [{"term": "양자 스핀 액체 (Quantum Spin Liquid, QSL)", "why_emerged": "고전적인 자기 질서를 가질 수 없는 강한 양자 요동과 기하학적 좌절을 가진 자성체에서, 스핀들이 장거리 얽힘을 형성하고 분할된 여기를 보이는 새로운 양자 상태를 설명하기 위해 도입되었습니다.", "origin": "1973년 P.W. Anderson이 삼각형 격자에서의 스핀 거동을 설명하면서 처음 개념을 제안했습니다.", "connections": "기하학적 좌절(geometrical frustration), 분할된 여기(fractionalized excitations), 스핀온(spinon), 위상 질서(topological order), 루팅거 액체(Luttinger liquid), 양자 홀 효과(quantum Hall effect)."}, {"term": "카고메 격자 (Kagome lattice)", "why_emerged": "물질 내 원자 배열이 삼각형과 육각형이 번갈아 나타나는 독특한 2차원 격자 구조로, 특히 자성 시스템에서 강한 기하학적 좌절을 유발하여 양자 스핀 액체 상태를 구현할 유망한 플랫폼으로 주목받으면서 중요해졌습니다.", "origin": "고대 일본의 바구니 짜는 방식(kagome)에서 유래한 명칭으로, 결정학 및 통계 역학 연구에서 일찍부터 등장했습니다.", "connections": "기하학적 좌절(geometrical frustration), 양자 스핀 액체(QSL), AV3Sb5 계열 물질, 헤르버트스미타이트(Herbertsmithite), 자성물질."}, {"term": "아브리코소프 페르미온 (Abrikosov fermion)", "why_emerged": "스핀 연산자들을 페르미온 준입자로 표현하여 자성 시스템, 특히 스핀 액체와 같은 비고전적 자기 상태의 이론적 분석을 용이하게 하기 위해 도입되었습니다. 이는 스핀의 양자적 특성을 효율적으로 다룰 수 있게 합니다.", "origin": "1960년대 Abrikosov가 초전도체 내 불순물 효과를 연구하며 유사한 페르미온 표현을 사용한 것이 기원이며, 스핀 시스템에 적용하는 것은 이후 발전했습니다.", "connections": "슈윙거 보손(Schwinger boson), 페르미온 표현, 양자장 이론, 스핀 액체 이론, 스핀 연산자 표현."}, {"term": "슈윙거 보손 (Schwinger boson)", "why_emerged": "스핀 연산자들을 보손 준입자로 표현하여 자성 시스템, 특히 양자 스핀 액체와 같은 복잡한 자성 상태를 분석하기 위해 도입되었습니다. 이는 스핀-1/2 시스템을 보손화하여 다체 문제의 해결을 돕습니다.", "origin": "1952년 Julian Schwinger가 각운동량을 보손 연산자로 표현하는 방법을 제안한 것이 기원이며, 응집물질 물리학에서 스핀 모델에 널리 적용되었습니다.", "connections": "아브리코소프 페르미온(Abrikosov fermion), 보손화(bosonization), 스핀 액체 이론, 양자장 이론, 스핀 연산자 표현."}], "english_summary": ["This theoretical study investigates dynamical spin correlations in kagome antiferromagnets, a promising platform for quantum spin liquids (QSLs).", "It compares two beyond-mean-field approaches: Abrikosov fermions and Schwinger bosons, for calculating the spin dynamics.", "The research provides a deeper theoretical understanding of fractionalized excitations characteristic of QSLs in kagome lattices.", "The calculated dynamic spin correlation functions can be directly compared with experimental results from neutron scattering or RIXS.", "This work is crucial for identifying and characterizing QSL states in real kagome materials, which are of direct interest to the reader."]}}, {"title": "Finite-temperature ab initio structural optimization of the bilayer nickelate superconductor La3Ni2O7", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/qbnb-bzr6", "authors": "Ryoma Asai, Ryotaro Arita, Takumi Chida, Ryota Masuki, Kazuhiko Kuroki, Terumasa Tadano", "last_authors": "Kazuhiko Kuroki, Terumasa Tadano", "summary": "We develop a first-principles framework for finite-temperature structural optimization that incorporates vibrational contributions to the free energy through anharmonic phonon theory. We extend and further improve the efficiency of the recent approach, enabling its application to systems in which th…", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Electronic structure of a key high-interest unconventional superconductor (bilayer nickelate).", "tags": ["abinitio", "superconductivity", "nickelate"], "image": "", "briefing": {"background": "초전도 현상은 응집물질 물리학의 핵심 연구 분야이며, 특히 구리 산화물(cuprates)과 유사한 고온 초전도 특성을 보일 수 있는 새로운 물질군인 니켈 산화물(nickelates)은 최근 큰 주목을 받고 있습니다. 이들 물질의 초전도 메커니즘을 이해하기 위해서는 정확한 전자 구조와 더불어 결정 구조에 대한 깊이 있는 이해가 필수적입니다.", "motivation": "이 논문은 최근 발견된 이층 구조 니켈 산화물 초전도체 La3Ni2O7의 유한 온도(finite-temperature)에서의 정확한 구조를 예측하는 것을 목표로 합니다. 기존의 양자역학적 계산(ab initio)은 종종 유한 온도 효과나 포논의 비조화성(anharmonicity)을 제대로 반영하지 못하여 실제 물질의 특성을 정확히 예측하는 데 한계가 있었습니다.", "result": "논문은 진동 기여(vibrational contributions)를 비조화 포논 이론(anharmonic phonon theory)을 통해 자유 에너지에 통합하는 유한 온도 구조 최적화를 위한 새로운 제일원리(first-principles) 프레임워크를 개발했습니다. 이 방법을 통해 La3Ni2O7과 같은 복잡한 초전도체의 유한 온도에서의 구조적 특성을 보다 정확하게 예측할 수 있게 되었다고 제시합니다. (초록 내용만으로 La3Ni2O7에 대한 구체적인 구조적 결과가 무엇인지는 명시되지 않으나, 이 방법이 La3Ni2O7에 적용 가능함을 보인 것이 주요 결과로 보입니다.)", "implication": "정확한 유한 온도 구조 정보는 La3Ni2O7의 전자 구조, 포논 특성, 그리고 초전도 메커니즘을 이해하는 데 결정적인 기반을 제공할 것입니다. 이는 고온 초전도체의 기원에 대한 통찰력을 제공하고, 새로운 초전도 물질을 설계하는 데 중요한 지침이 될 수 있습니다.", "novelty": "이 연구는 유한 온도에서 구조 최적화를 수행하면서 비조화 포논 효과를 제일원리 계산에 효율적으로 통합한 새로운 방법론을 제시했다는 점에서 중요합니다. 특히, 최근 고온 초전도체로 큰 주목을 받는 이층 구조 니켈 산화물 La3Ni2O7에 이 방법을 적용했다는 점이 독자에게 높은 관련성을 가집니다. 이는 ARPES 등 실험적 연구를 위한 이론적 기반을 제공할 수 있습니다.", "unresolved": "초록만으로는 La3Ni2O7의 유한 온도 구조에 대한 구체적인 발견이나, 이 새로운 구조가 기존에 제기되었던 특정 문제를 해결하는지에 대한 정보가 부족합니다. 또한, 이 계산 결과가 실험적으로 어떻게 검증될 수 있을지에 대한 부분이 명확하지 않습니다.", "future_work": "새롭게 예측된 유한 온도 구조를 바탕으로 La3Ni2O7의 전자 밴드 구조, 페르미 면(Fermi surface) 특성, 포논 분산 관계 등을 심도 있게 연구할 필요가 있습니다. 이는 ARPES와 같은 실험 데이터와 직접적인 비교를 통해 초전도 메커니즘을 규명하는 데 기여할 것입니다. 또한, 이 방법론을 다른 복잡한 초전도체나 강상관계 물질에 확장 적용할 수 있습니다.", "concepts": [{"term": "이층 구조 니켈 산화물 초전도체", "why_emerged": "구리 산화물(cuprates)과 유사하게 높은 임계 온도(Tc)를 가진 초전도체로, Ni 기반 물질에서 고온 초전도 현상을 구현할 가능성을 탐구하기 위해 중요성이 부각되었습니다. La3Ni2O7은 2023년에 고압 조건에서 약 80K의 높은 Tc를 보이며 큰 주목을 받았습니다.", "origin": "1980년대 후반 구리 산화물에서 고온 초전도체가 발견된 이후, 유사한 전이 금속 산화물에서 새로운 고온 초전도체를 찾으려는 시도가 계속되었습니다. 니켈 산화물은 이러한 맥락에서 연구되어 왔으며, 특히 La3Ni2O7은 최근 실험적 발견으로 초전도체로서 확고한 입지를 얻었습니다.", "connections": "구리 산화물 고온 초전도체, 페로브스카이트(perovskite) 구조, 강상관계 전자계(strongly correlated electron systems)."}, {"term": "제일원리 구조 최적화", "why_emerged": "재료의 안정적인 결정 구조와 그에 따른 물리적 특성(전자 구조, 강성 등)을 실험 없이 이론적으로 예측하기 위해 필요합니다. 원자 간 상호작용을 양자역학적 원리에서 직접 계산하여 에너지를 최소화하는 구조를 찾습니다.", "origin": "밀도범함수 이론(Density Functional Theory,   headText.appendChild(title);
  headText.appendChild(textEl('p', 'meta', [r.journal, r.source].filter(Boolean).join(' | ')));
  if (r.last_authors || r.authors) { const authors = document.createElement('p'); authors.className = 'authors'; if (r.last_authors) authors.append('Last authors: ' + r.last_authors); if (r.authors) authors.append((r.last_authors ? ' | ' : '') + 'Authors: ' + r.authors); headText.appendChild(authors); }
  appendLabeledText(headText, 'why', 'Filter reason: ', r.reason);
  if (r.tags && r.tags.length) { const tags = document.createElement('div'); tags.className = 'tags'; r.tags.forEach(tag => tags.appendChild(textEl('span', 'tag', '#' + tag))); headText.appendChild(tags); }
  if (r.link) { const link = document.createElement('a'); link.className = 'link'; link.href = r.link; link.target = '_blank'; link.rel = 'noopener noreferrer'; link.textContent = 'Open paper'; headText.appendChild(link); }
  head.appendChild(headText);
  if (r.summary) { const abstract = document.createElement('p'); abstract.className = 'original-abstract'; const strong = textEl('strong', '', 'Original abstract'); abstract.appendChild(strong); abstract.append(r.summary); head.appendChild(abstract); }
  slideEl.appendChild(head);
  const briefing = document.createElement('div');
  briefing.className = 'briefing';
  appendBriefSection(briefing, 'Background', b.background);
  appendBriefSection(briefing, 'Motivation', b.motivation);
  appendBriefSection(briefing, 'Result', b.result);
  appendBriefSection(briefing, 'Implication', b.implication);
  appendBriefSection(briefing, "Why it's important / Novelty", b.novelty);
  appendBriefSection(briefing, 'Unresolved Questions', b.unresolved);
  appendBriefSection(briefing, 'Expected Future Work', b.future_work);
  if (b.concepts && b.concepts.length) {
    const section = document.createElement('section');
    section.className = 'brief-section wide';
    section.appendChild(textEl('h2', '', 'Concepts / Terms'));
    const concepts = document.createElement('div');
    concepts.className = 'concepts';
    b.concepts.forEach(c => {
      const item = document.createElement('div');
      item.className = 'concept';
      item.appendChild(textEl('h3', '', c.term || 'Concept'));
      [['왜 생겼나: ', c.why_emerged], ['누가 만들었나: ', c.origin], ['연결되는 흐름: ', c.connections]].forEach(([label, text]) => { if (!text) return; const p = document.createElement('p'); const bold = textEl('b', '', label); p.appendChild(bold); p.append(text); item.appendChild(p); });
      concepts.appendChild(item);
    });
    section.appendChild(concepts);
    briefing.appendChild(section);
  }
  if (b.english_summary && b.english_summary.length) { const section = document.createElement('section'); section.className = 'brief-section wide'; section.appendChild(textEl('h2', '', 'English Summary')); const ul = document.createElement('ul'); b.english_summary.slice(0, 5).forEach(line => ul.appendChild(textEl('li', '', line))); section.appendChild(ul); briefing.appendChild(section); }
  slideEl.appendChild(briefing);
  counterEl.textContent = `${index + 1} / ${slides.length}`;
  prevBtn.disabled = index === 0;
  nextBtn.disabled = index === slides.length - 1;
}
prevBtn.addEventListener('click', () => { index = Math.max(0, index - 1); render(); });
nextBtn.addEventListener('click', () => { index = Math.min(slides.length - 1, index + 1); render(); });
document.addEventListener('keydown', event => { if (event.key === 'ArrowLeft') prevBtn.click(); if (event.key === 'ArrowRight') nextBtn.click(); });
render();
</script>
</body>
</html>
