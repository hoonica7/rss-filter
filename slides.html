<title>Daily Paper Slideshow</title>
<style>
  :root {
    color-scheme: light;
    --bg: #f6f7f4;
    --paper: #ffffff;
    --ink: #111827;
    --muted: #64748b;
    --line: #d8ddd2;
    --accent: #176b87;
    --accent-2: #9a3412;
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; overflow: auto; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: var(--bg); color: var(--ink); }
  .shell { max-width: 1500px; min-height: 100vh; margin: 0 auto; padding: 14px 18px; display: flex; flex-direction: column; }
  .topbar { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 16px; }
  .top-actions { display: flex; align-items: center; gap: 10px; }
  .topbar a, button { border: 1px solid var(--line); border-radius: 8px; background: var(--paper); color: var(--ink); padding: 10px 14px; font-weight: 700; text-decoration: none; cursor: pointer; }
  button.primary { background: var(--accent); border-color: var(--accent); color: white; }
  button:disabled { opacity: 0.45; cursor: not-allowed; }
  .counter { color: var(--muted); font-weight: 700; }
  .slide { min-height: calc(100vh - 82px); background: var(--paper); border: 1px solid var(--line); border-radius: 10px; padding: 18px; box-shadow: 0 18px 42px rgba(15, 23, 42, 0.10); display: grid; grid-template-columns: minmax(310px, 0.86fr) minmax(0, 1.55fr); gap: 18px; overflow: visible; }
  .paper-head { min-width: 0; min-height: 0; overflow: visible; display: flex; flex-direction: column; gap: 12px; }
  .figure { margin: 0; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: #f8fafc; }
  .figure img { display: block; width: 100%; max-height: 41vh; object-fit: contain; background: white; }
  .figure figcaption { padding: 7px 10px; color: var(--muted); font-size: 12px; line-height: 1.3; }
  .head-text { display: flex; flex-direction: column; gap: 9px; min-width: 0; }
  .badges { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .badge { border-radius: 999px; padding: 5px 9px; background: #eef2ff; color: #3730a3; font-size: 12px; font-weight: 800; }
  .score { background: #fee2e2; color: #991b1b; }
  h1 { margin: 0; font-size: 25px; line-height: 1.15; letter-spacing: 0; overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
  h1 a { color: inherit; text-decoration-color: rgba(23, 107, 135, 0.35); text-decoration-thickness: 2px; text-underline-offset: 4px; }
  h1 a:hover { color: var(--accent); text-decoration-color: var(--accent); }
  .meta, .authors, .why, .abstract { font-size: 13px; line-height: 1.45; }
  .meta, .authors { color: var(--muted); }
  .why strong, .abstract strong, .authors strong { color: var(--ink); }
  .authors { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .why { border-left: 4px solid var(--accent-2); padding-left: 10px; color: #374151; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .abstract { border-top: 1px solid var(--line); padding-top: 14px; color: #374151; }
  .original-abstract { border-top: 1px solid var(--line); padding-top: 10px; color: #374151; font-size: 11.5px; line-height: 1.35; overflow-wrap: anywhere; }
  .original-abstract strong { display: block; margin-bottom: 4px; color: var(--ink); }
  .tags { display: flex; flex-wrap: wrap; gap: 8px; }
  .tag { border-radius: 999px; padding: 4px 8px; background: #f1f5f9; color: #475569; font-size: 12px; font-weight: 700; }
  .head-text > .link { display: none; }
  .briefing { min-width: 0; min-height: 0; overflow: visible; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); grid-auto-rows: minmax(0, auto); align-content: start; gap: 11px 18px; border-top: 0; padding-top: 0; }
  .brief-section { min-width: 0; }
  .brief-section.wide { grid-column: 1 / -1; }
  .brief-section h2 { margin: 0 0 4px; font-size: 14px; line-height: 1.22; color: #0f766e; letter-spacing: 0; }
  .brief-section p, .brief-section li { margin: 0; font-size: 12.5px; line-height: 1.42; color: #1f2937; overflow-wrap: anywhere; }
  .brief-section ul { margin: 0; padding-left: 20px; }
  .concepts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 9px 14px; }
  .concept { border-top: 1px solid var(--line); padding-top: 7px; }
  .concept h3 { margin: 0 0 4px; font-size: 13px; color: #7c2d12; letter-spacing: 0; }
  .concept p { margin: 2px 0 0; font-size: 11.5px; line-height: 1.35; color: #374151; overflow-wrap: anywhere; }
  .concept b { color: #111827; }
  .link { color: var(--accent); font-weight: 800; text-decoration: none; }
  .empty { padding: 48px; background: var(--paper); border: 1px solid var(--line); border-radius: 12px; color: var(--muted); }
  @media (max-width: 860px) {
    .shell { padding: 14px; }
    .topbar, .top-actions { align-items: stretch; flex-direction: column; }
    .slide, .briefing, .concepts { grid-template-columns: 1fr; }
    .slide { min-height: auto; overflow: visible; display: grid; }
    h1 { font-size: 28px; }
  }
</style>

<script>
const slides = [{"title": "Nonreciprocal impurity scattering as a probe for pairing symmetries in kagome superconductors", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/6d8l-gzdq", "authors": "Hong-Min Jiang, Hao Du, Shun-Li Yu", "last_authors": "Hao Du, Shun-Li Yu", "summary": "The superconducting (SC) pairing symmetry and its link to time-reversal symmetry breaking (TRSB) in the vanadium-based kagome superconductors remain unresolved, with ambiguities stemming from sublattice interference and charge-density-wave (CDW) entanglement with superconductivity. Using two represe…", "tier": "A_MUST_READ", "score": "10", "reason": "Directly addresses pairing symmetry and TRSB in vanadium-based kagome superconductors, the user's primary project.", "tags": ["material", "kagome", "CDW", "superconductivity"], "image": "", "briefing": {"background": "AV3Sb5(A=K, Rb, Cs)와 같은 바나듐 기반 카고메 초전도체는 전하 밀도파(CDW)와 초전도성이 공존하는 독특한 물리적 특성을 보입니다. 특히 시간 반전 대칭성 깨짐(TRSB)과 관련된 물리 현상이 관찰되고 있으나, 초전도 페어링 대칭성(pairing symmetry)과 TRSB 사이의 구체적인 상관관계는 여전히 논란의 중심에 있습니다.", "motivation": "카고메 격자 특유의 부격자 간섭(sublattice interference)과 CDW의 복잡한 얽힘 때문에 기존의 실험적 접근으로는 초전도 페어링 상태를 명확히 구분하기 어렵습니다. 본 연구는 비가역적 불순물 산란(nonreciprocal impurity scattering)을 활용해 이러한 모호성을 해결할 수 있는 이론적 프로브를 제안하고자 합니다.", "result": "연구팀은 두 가지 대표적인 오더 파라미터 후보군에 대해 계산을 수행하여, 불순물에 의한 산란 패턴이 페어링 대칭성에 따라 비가역적인 특징을 보인다는 점을 발견했습니다. 이는 불순물 근처의 전자 구조 변화를 통해 초전도 상태의 위상학적 성질과 대칭성을 직접적으로 감별할 수 있음을 시사합니다.", "implication": "이 결과가 사실로 확인될 경우, 복잡한 카고메 시스템에서 STM/STS를 이용한 국소적 전자 구조 측정이 페어링 대칭성을 결정짓는 강력한 도구가 될 수 있습니다. 특히 TRSB가 수반되는 초전도 상태를 판별하는 데 결정적인 근거를 제공할 것입니다.", "novelty": "카고메 금속의 고유한 부격자 자유도를 고려한 불순물 산란 이론을 제시했다는 점이 혁신적입니다. 사용자의 주요 관심사인 CsV3Sb5 계열의 TRSB 및 초전도 기작 규명과 직결되는 내용입니다.", "unresolved": "이론적 모델인 만큼 실제 실험(예: 특정 원자 불순물이 도핑된 샘플)에서 관찰되는 STS 신호가 모델의 예측과 얼마나 정밀하게 일치할지는 추가적인 검증이 필요합니다.", "future_work": "향후 실제 바나듐 기반 카고메 초전도체 시료에 자기적/비자기적 불순물을 주입한 뒤, 저온 STM을 통해 제안된 비가역적 산란 신호를 검출하는 실험이 이어질 것으로 예상됩니다.", "concepts": [{"term": "비가역적 불순물 산란 (Nonreciprocal scattering)", "why_emerged": "산란의 방향성에 따라 산란 강도가 달라지는 현상으로, 시스템의 대칭성 깨짐을 민감하게 반영하기 위해 도입되었습니다.", "origin": "초록 정보만으로는 특정하기 어려움 (일반적 산란 이론의 확장)", "connections": "시간 반전 대칭성 깨짐(TRSB), 앤더슨 정리, 부격자 간섭"}, {"term": "카고메 초전도체 (Kagome superconductor)", "why_emerged": "기하학적 좌절(frustration)이 있는 격자 구조에서 나타나는 특이한 전자 상태(플랫 밴드, 디락 점 등)와 초전도성의 상호작용을 연구하기 위해 주목받았습니다.", "origin": "AV3Sb5 계열은 2020년경 Stephen Wilson 그룹 등에 의해 본격적으로 보고됨", "connections": "AV3Sb5, 전하 밀도파(CDW), 루프 전류, 밴드 위상학"}, {"term": "페어링 대칭성 (Pairing symmetry)", "why_emerged": "쿠퍼 쌍이 형성될 때 파동함수의 공간적/스핀적 대칭성을 분류하여 초전도 기작을 이해하기 위해 필수적입니다.", "origin": "BCS 이론 이후 고온 초전도체 연구(d-wave 등)를 통해 확장됨", "connections": "s-wave, d-wave, p+ip pairing, 갭 이방성"}, {"term": "시간 반전 대칭성 깨짐 (TRSB)", "why_emerged": "외부 자기장 없이도 시스템 자체의 위상적 성질이나 비전통적 페어링에 의해 대칭성이 깨지는 현상을 설명하기 위해 중요합니다.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "뮤온 스핀 회전(muSR), 자발적 전류, 위상 초전도체"}], "english_summary": ["Proposes nonreciprocal impurity scattering as a diagnostic tool for pairing symmetry in V-based kagome superconductors.", "Addresses the challenge of identifying TRSB and superconducting order parameters amidst CDW entanglement.", "Theoretical calculations suggest that specific scattering patterns near impurities can distinguish between candidate pairing states.", "Directly relevant to understanding the exotic electronic phase diagram of AV3Sb5 materials."]}}, {"title": "Nonvolatile optical switching of surface metallicity in 1T-TaSe2", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2512.21628", "authors": "Junde Liu, Liwen Su, Pei Liu, et al.", "last_authors": "Xun Shi, Yugui Yao", "summary": "The surface of a quantum material provides a distinct electronic environment in which reconstruction can stabilize states absent from the bulk. However, whether light can persistently reconfigure this surface-bulk electronic contrast remains unclear. Here we demonstrate nonvolatile and reversible optical i rg/abs/2605.13226", "authors": "Peiwei You, Ryan Pederson, Kieron Burke, E. K. U. Gross", "last_authors": "Kieron Burke, E. K. U. Gross", "summary": "The recently developed conditional probability density functional theory (CP-DFT) yields direct access to the exchange-correlation hole of a system, an important correlation function that is not available in standard DFT. We present the first results for extended materials with periodic boundary conditions. We validate CP-DFT for weakly correlated Na and Si. We apply it to a stretched hydrogen chain, the prototype of strong correlation. When applied to the Kagome material CsV$_3$Sb$_5$, we find $d$-orbital correlations that are missing in standard DFT, implying an enhanced finding probability between two separated electrons and a local charge density wave related modulation.", "tier": "A_MUST_READ", "score": "9", "reason": "New DFT method reveals missing d-orbital correlations and CDW modulations in kagome CsV3Sb5.", "tags": ["material", "method", "kagome"], "image": "https://arxiv.org/html/2605.13226v2/figure-Kagome.png", "briefing": {"background": "표준 DFT는 전자 간의 다체 상관관계(many-body correlation)를 완벽히 기술하기 어렵습니다. 특히 CsV3Sb5와 같은 카고메 금속에서 나타나는 전하 밀도 파동(CDW)과 전자 상관 효과는 표준 DFT 근사로 파악되지 않는 경우가 많습니다.", "motivation": "기존 DFT에서 접근 불가능한 '교환-상관 홀(exchange-correlation hole)'을 직접 관찰하여 강한 상관관계를 가진 계의 전자 구조를 더 정확하게 기술하고자 합니다.", "result": "CP-DFT를 통해 CsV3Sb5의 d-오비탈 간의 누락되었던 상관관계를 밝혔으며, 이것이 국소적 CDW 변조와 연결됨을 확인했습니다.", "implication": "표준 DFT에서 놓치던 전자 간의 상호작용을 포착함으로써, 카고메 금속의 복잡한 물리적 상태를 이론적으로 더 정밀하게 예측할 수 있는 길이 열렸습니다.", "novelty": "실제 고체 결정 구조에서 CP-DFT를 적용한 첫 사례로, 특히 독자 관심사인 AV3Sb5 계열의 전자 상관 문제를 해결하는 데 새로운 계산적 도구를 제공합니다.", "unresolved": "CP-DFT 계산 비용이 표준 DFT보다 크며, 대규모 계에 대한 범용적인 최적화가 필요합니다.", "future_work": "다른 강상관 물질에 대한 적용 확대 및 전하 밀도 파동의 미시적 기원 연구에 활용될 것으로 보입니다.", "concepts": [{"term": "CP-DFT", "why_emerged": "표준 DFT의 국소 밀도 근사나 일반 경사 근사가 다체 상관관계를 충분히 반영하지 못하기 때문입니다.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "밀도 함수 이론(DFT), 다체 물리 ations at high-symmetry points without SOC with respect to SSG. This scheme can be directly applied to collinear magnets whose magnetic structures have already been determined experimentally or theoretically. Applying it to 488 collinear magnets from MAGNDATA with experimentally determined magnetic structures, we identify 26 materials that are trivial by MSG but are expected to inherit topology protected by SSG symmetry. We showcase Dirac nodal lines and boundary states predicted by SSG but invisible to MSG in FePSe 3 . On the other hand, we predict 224 collinear magnetic ground-state structures from 1,483 stoichiometric paramagnetic structures in Inorganic Crystal Structure Database belonging to space group No. 166 or No. 221 utilizing the symmetry-reduction hierarchy from a space group for the paramagnetic phase to SSG and then from SSG to MSG. 24 materials are identified as magnetic topological materials, including the experimentally confirmed magnetic Weyl semimetal Co 3 Sn 2 S 2 , magnetic topological insulator MnBi 2 Te 4 , and magnetic Weyl nodal-line semimetal Fe 3 Sn 2 , whose computed magnetic structures and magnetic moments are in good agreement with experimental results. Our work demonstrates the predictive power of the approach combining SSG and MSG over the approaches based on either group alone. The results of high-throughput calculations are expected to extend the magnetic topological materials pool, facilitating future experimental realizations of more magnetic topological materials.", "tier": "A_MUST_READ", "score": "9", "reason": "Predictive framework for magnetic topological materials and altermagnets using symmetry indicators.", "tags": ["theory", "altermagnet", "topological", "materialdiscovery"], "image": "https://arxiv.org/html/2601.05142v2/rtp.png", "briefing": {"background": "자기적 물질의 대칭성을 기술할 때 기존의 자기 공간군(MSG)만으로는 완벽하지 않으며, 최근 스핀 공간군(SSG)의 도입으로 자기적 위상 물질 분류가 고도화되고 있습니다.", "motivation": "스핀-궤도 결합(SOC)의 크기에 따라 변화하는 대칭성과 그에 따른 위상적 성질을 체계적으로 분류 l": "PRL_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/phr7-1zy5", "authors": "Andrea Maiani", "last_authors": "Andrea Maiani", "summary": "Spin textures are ubiquitous in antiferromagnets, yet their consequences for altermagnets remain largely unexplored. We show that smooth spatial variations of the Néel order act on itinerant electrons as emergent gauge fields that couple to the altermagnetic sublattice-odd channel. For a coplanar spin helix, this channel generates two responses that vanish when it is removed: a momentum-resolved sublattice-odd spectral structure and a net interband linear dichroism whose principal axes are controlled by the helix wave vector, so the optical response can be steered by the magnetic texture. The dichroism exhibits two distinct regimes separated by a crossover: at low frequencies the absorption axis is locked to the crystal axes, while at high frequencies it tracks the helix. Anisotropic dc transport provides a complementary quantitative signature, and all signatures are robust to weak intrinsic spin-orbit coupling. Our results identify polarization-resolved optics and sublattice-sensitive spectroscopy as direct probes of textured altermagnetic states and suggest a route to direction-selective electronic and optical functionality in altermagnets.", "tier": "B_IMPORTANT_CONDMAT", "score": "9", "reason": "Theory on emergent gauge fields and linear dichroism in altermagnets, a direct user interest.", "tags": ["altermagnetism", "theory", "magneticmaterials", "electronicstructure"], "image": "", "briefing": {"background": "알터자성(Altermagnetism)은 최근 발견된 새로운 자기적 위상으로, 기존의 강자성이나 반강자성과 달리 특정 방향성을 가진 스핀 구조가 비편향적인 전자 구조 변화를 유도합니다.", "motivation": "알터자성체의 자기적 질서가 미세한 공간적 변조(스핀 텍스처)를 가질 때, 전도 전자에 미치는 영향과 광학적 반응을 이론적으로 밝히고자 했습니다.", "result": "나선형 스핀 구조가 전도 전자에 '창발적 게이지 장(emergent gauge field)'으로 작용하며, 이것이 서브격자 간의 이색성(linear dichroism)을 유도함을 보였습니다.", "implication": "알터자성체를 기반으로 한 방향 선택적 광학 소자나 스핀트로닉스 소자 개발의 이론적 근거를 제공합니다.", eight", "why_emerged": "물질의 전자 상태 밀도와 전이 확률이 결합된 에너지를 분석하기 위해 필요.", "origin": "고체 물리학의 기초적인 분광학 개념.", "connections": "상관관계가 강한 전자계에서 에너지가 어떻게 재분배되는지 추적하는 핵심 지표."}, {"term": "Electronic Reconstruction", "why_emerged": "구조 상전이나 도핑 변화에 따른 페르미 표면 및 전자 에너지 구조의 급격한 변화를 설명하기 위함.", "origin": "구리 산화물 초전도체 연구에서 초기 확립.", "connections": "상전이 현상, 밴드 이론, 상관관계 물리학."}], "english_summary": ["Investigated the electronic structure of La3Ni2O7 across the 544K tilt-free structural transition.", "Observed significant spectral weight transfer and electronic reconstruction at low energies.", "Results link the structural phase to the reorganization of Ni 3d z^2 states.", "Provides a key ambient-pressure reference for understanding the high-Tc superconducting mechanism."]}}, {"title": "Hidden Angular Momentum Loop Currents in Symmetric Crystals", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2609.38317", "authors": "Rule Yi, Vincent P. Flynn, Benedetta Flebus", "last_authors": "Vincent P. Flynn, Benedetta Flebus", "summary": "Loop-current order has been invoked to explain unconventional electronic phases, with the crystal lattice usually regarded as a passive host for the underlying collective dynamics. Here we show that circulating currents can originate in the lattice itself, sustained by quantum and thermal fluctuations. We develop a microscopic description of angular momentum exchange that separates transfer between sites from crystalline restoring torques and reveals how circulation can emerge in a symmetry-preserving equilibrium state. In a two-dimensional elastic lattice preserving time-reversal, inversion, and fourfold rotational symmetries, we uncover opposite current loops on neighboring plaquettes while the mean angular momentum vanishes at every site. These currents are sustained by zero-point fluctuations in the phonon vacuum and persist at finite temperature. We trace their origin to directional elastic interactions in locally symmetry-lowered environments, with the higher crystal symmetry organizing the resulting currents into a compensated pattern of circulation. Our results extend the physics of equilibrium loop currents to lattice dynamics, revealing that elastic geometry can organize fluctuations into persistent angular momentum circulation without electronic or magnetic order, external driving, or spontaneous symmetry breaking.", "tier": "B_IMPORTANT_CONDMAT", "score": "9", "reason": "Directly relevant to user interest in loop currents and symmetry-breaking phases in quantum materials.; demoted from A: broad CM, not direct user/project hit", "tags": ["theory", "loopcurrents", "latticedynamics"], "image": "https://arxiv.org/html/2609.38317v1/Phonon_AM_Fig1_alt2.png", "briefing": {"background": "물질 내의 루프 전류는 보통 전자적인 상관관계나 자기적 질서의 결과로 간주되어 왔으며, 초전도성이나 비전통적 상태의 기원으로 자주 언급됩니다.", "motivation": "격자 자체가 단순히 수동적인 배경이 아니라, 격자 역학의 요동만으로도 루프 전류가 생성될 수 있는지 이론적으로 규명하고자 함.", "result": "시간 반전 및 공간 반전 대칭성을 유지하는 탄성 격자에서, 영점 진동(zero-point fluctuations)에 의해 원자 단위가 아닌 plaquette 단위의 루프 전류가 상쇄되는 형태로 존재함을 보였습니다.", "implication": "전자적 질서 없이도 결정 격자의 기하학적 구조만으로 비자명한 각운동량 순환이 나타날 수 있음을 보여주며, 이는 새로운 위상적 혹은 응집 상태 연구의 토대가 될 수 있습니다.", "novelty": "기존 루프 전류 연구가 전자적 자유도에 집중했던 것과 달리, 격자 진동(phonon)의 기하학적 배치를 통한 새로운 전류 기원을 제시했습니다.", "unresolved": "이러한 격자 기반 루프 전류가 실제 물질의 실험적 신호(예: 자기장 분포)로 어떻게 검출될 수 있는지 구체적인 실험적 타당성 규명이 필요합니다.", "future_work": "실제 phonon mode가 지배적인 특정 물질계에서의 루프 전류 신호 예측 및 중성자 산란 실험과의 연계.", "concepts": [{"term": "Loop Current", "why_emerged": "시메트리 파괴나 비전통적 초전도 현상을 설명하기 위해 고안된 전류 흐름 모형.", "origin": "Varma 등에 의해 cuprate 연구에서 초기 제안.", "connections": "비전통적 초전도성, 시간 반전 대칭성 파괴."}, {"term": "Zero-point Fluctuations", "why_emerged": "양자역학적으로 정지 상태인 절대영도에서도 에너지가 존재함을 설명하기 위해 필요.", "origin": "양자역학의 초기 정립기(Heisenberg 등).", "connections": "양자 격자 역학, Casimir 효과."}], "english_summary": ["Proposed that loop currents can emerge from lattice fluctuations alone.", "Demonstrated that angular momentum circulation persists in symmetric elastic lattices.", "The currents are sustained by phonon vacuum fluctuations without symmetry breaking.", "Expands the concept of loop currents beyond purely electronic or magnetic orders."]}}, {"title": "Resonances control when multiterminal Josephson currents reduce to two-terminal couplings", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2609.40346", "authors": "A. Bar{\\i}\\c{s} \\\"Ozg\\\"uler", "last_authors": "A. Bar{\\i}\\c{s} \\\"Ozg\\\"uler", "summary": "Multiterminal Josephson junctions, in which one weak link couples three or more superconductors, are studied as hosts of topological Andreev bands, multi-pair supercurrents and tunable circuit elements. Their currents are modeled both as pairwise networks of two-terminal couplings and through genuinely multiterminal processes such as quartets. We ask how accurate the pairwise description is and what controls its error. In a microscopic scattering model of planar junctions, we compare exact currents with the best pairwise approximation, which allows arbitrary nonsinusoidal couplings. In ensembles of disordered three- and four-terminal junctions, the pairwise terms capture nearly all of the energy variation, yet the median current error ranges from 8.0 to 21.2 percent, about twice the energy error, because currents weigh the multiterminal harmonics more strongly. Designed devices extend the comparison to sixteen terminals. We identify a mechanism that controls this error. A normal-region mode near the Fermi level that couples to three or more terminals produces large nonpairwise currents, and detuning it with a gate suppresses them. Shifting only this mode, selected from normal-state properties, predicts the gate dependence of the error in eight three- and four-terminal devices without fitting currents. Finite-gap calculations in two clean devices confirm a drop from tens of percent near resonance to below one percent. An analytic single-level model gives a sufficient detuning for pairwise accuracy at any terminal count. Planar junctions thus inherit the resonant and cotunneling regimes known from quantum dots, and normal-state properties identify the mode that selects between them.", "tier": "B_IMPORTANT_CONDMAT", "score": "9", "reason": "Theoretical study of multiterminal Josephson junctions, relevant to topological superconductivity.", "tags": ["theory", "superconductivity", "topological", "Josephsonjunction"], "image": "https://arxiv.org/html/2609.40346v1/fig_ensemble_headline.png", "briefing": {"background": "다단자 조셉슨 접합은 위상 초전도체나 고차원적 양자 회로 소자로서 주목받고 있으며, 그 내부의 초전류 흐름을 제어하는 것이 핵심 연구 과제입니다.", "motivation": "다단자 접합에서의 초전류를 여러 개의 2단자 결합의 합으로 근사할 수 있는지, 만약 안 된다면 무엇이 그 오차를 결정하는지 규명하고자 함.", "result": "접합부 페르미 준위 근처의 모드(mode)가 공명을 일으킬 때 다단자 효과가 지배적으로 나타나며, 게이트 전압을 통해 이를 조절하면 2단자 근사 모델로의 전환이 가능함을 밝혔습니다.", "implication": "다단자 조셉슨 접합을 이용한 소자 설계 시, 공명 모드를 관리함으로써 원하는 전송 특성을 예측 가능하고 정교하게 제어할 수 있습니다.", "novelty": "복잡한 다단자 시스템의 동작 원리를 단순한 공명 현상으로 환원하여, 정상 상태 특성만으로 게이트 의존성을 예측할 수 있는 실용적인 가이드라인을 제시했습니다.", "unresolved": "매우 많은 단자(16개 이상)가 연결된 복잡한 시스템에서 외부 노이즈나 무질서가 이 공명 모드 제어 효율을 얼마나 저하시키는지에 대한 추가 연구가 필요합니다.", "future_work": "실제 초전도 접합 소자에서 게이트 전압을 이용한 초전류 비선형성 제어 실험.", "concepts": [{"term": "Multiterminal Josephson Junction", "why_emerged": "3개 이상의 초전도체가 결합된 시스템에서 양자 위상 상태를 조절하기 위해.", "origin": "초전도 소자 물리학 분야의 최근 확장 연구.", "connections": "위상 초전도체, Andreev 밴드, Quartets."}, {"term": "Andreev Bands", "why_emerged": "초전도-정상상태 계면에서 발생하는 전자-정공 결합 상태를 설명하기 위해.", "origin": "Andreev (1964).", "connections": "Andreev 반사, 조셉슨 효과."}], "english_summary": ["Analyzed the accuracy of pairwise approximations in multiterminal Josephson junctions.", "Identified that resonances near the Fermi level control non-pairwise current components.", "Demonstrated that gate tuning can suppress these non-pairwise currents.", "Provides a method to predict device performance using only normal-state properties."]}}, {"title": "The role of the apical oxygen in cuprate high-temperature superconductors", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2601.16017", "authors": "Samuel Vadnais, R\\'emi Duchesne, Kristjan Haule, A. -M. S. Tremblay, David S\\'en\\'echal, Benjamin Bacq-Labreuil", "last_authors": "David S\\'en\\'echal, Benjamin Bacq-Labreuil", "summary": "Scanning tunneling microscopy measurements exploiting the natural superstructure modulation of the cuprate superconductor Bi$_2$Sr$_2$CaCu$_2$O$_{8+\\delta}$ (Bi-2212) have revealed a possible correlation between the Cu-apical-O distance $\\delta_{\\mathrm{api}}$ and the superconducting order parameter $m_{\\mathrm{SC}}$, as reported recently by O'Mahony et al. (Proc. Natl. Acad. Sci. 119, e2207449119 (2022)). These observations were interpreted as evidence for a direct link between superconductivity and the charge-transfer gap, and more broadly revived the long-standing question of the role of apical oxygens in cuprate superconductivity. Using a combination of density-functional theory and cluster dynamical mean-field theory, we compute from first principles the variations of $m_{\\mathrm{SC}}$ induced solely by apical oxygen displacement in Bi$_2$Sr$_2$CuO$_{6+\\delta}$, Bi-2212, and HgBa$_2$CuO$_{4+\\delta}$. The quantitative agreement between our calculations and experiments allows us to unambiguously attribute the observed variations of $m_{\\mathrm{SC}}$ to changes in $\\delta_{\\mathrm{api}}$. We demonstrate, however, that these variations of $m_{\\mathrm{SC}}$ originate predominantly from changes in the effective hole-doping of the CuO$_2$ planes, with negligible effect on the charge-transfer gap. The modest magnitude of the $m_{\\mathrm{SC}}$ modulation induced by apical-oxygen displacement alone therefore warrants caution in interpreting correlations between $T_c$ and $\\delta_{\\mathrm{api}}$ inferred from comparisons across different cuprate compounds. Our work demonstrates that the present ab initio framework can quantitatively resolve the influe 26-00938-9", "authors": "Marco Magnaterra, Karolin Hopfer, Christoph J. Sahle, et al.", "last_authors": "Jeroen van den Brink, Markus Grüninger", "summary": "RIXS observation of bond-directional excitations in the Kitaev material Na 2 IrO 3", "tier": "B_IMPORTANT_CONDMAT", "score": "9", "reason": "Direct use of RIXS on a relevant magnetic topological material class.", "tags": ["RIXS", "Na2IrO3", "Kitaev"], "image": "https://pubads.g.doubleclick.net/gampad/ad?iu=/285/npjquantmats.nature.com/article&sz=728x90&c=-795372360&t=pos%3Dtop%26type%3Darticle%26artid%3Ds41535-026-00938-9%26doi%3D10.1038/s41535-026-00938-9%26subjmeta%3D301,638,639,766%26kwrd%3DChemistry,Materials+science,Physics", "briefing": {"background": "Kitaev 자성 물질은 엑조틱한 양자 스핀 액체 상태를 구현하기 위한 핵심 후보군입니다. 벌집 격자 구조에서 이리듐(Ir) 이온의 강한 스핀-궤도 결합(SOC)은 결합 방향에 따라 특정 스핀 성분이 결합되는 Kitaev 상호작용을 유도합니다.", "motivation": "Na2IrO3에서 Kitaev 스핀 액체와 연관된 고유한 여기(excitation) 모드를 직접 관측하여 이론적 예측인 결합 방향성(bond-directional) 상호작용을 실험적으로 규명하고자 했습니다.", "result": "RIXS(공명 비탄성 X선 산란)를 통해 Kitaev 상호작용의 특징인 결합 방향성 여기를 성공적으로 관측하였습니다.", "implication": "이 결과는 Kitaev 물질 내의 자기적 상호작용이 단순한 하이젠베르크 모델을 넘어 비등방적 성분을 포함하고 있음을 직접적으로 입증합니다.", "novelty": "RIXS가 가진 높은 에너지 분해능과 운동량 분해능을 활용해, 기존 중성자 산란으로 보기 어려웠던 저에너지 자성 여기의 이방성을 직접 시각화했습니다.", "unresolved": "실험적 결과가 Kitaev 모델의 엄밀한 기저 상태인지, 아니면 다른 비등방성 교환 상호작용과 결합된 결과인지에 대한 정량적 분석이 추가로 필요합니다.", "future_work": "온도 변화에 따른 여기 모드의 진화 관찰과 압력 변화를 통한 자기적 정렬 상태의 제어 실험이 기대됩니다.", "concepts": [{"term": "RIXS", "why_emerged": "물질의 전자 구조와 집단 여기를 에너지, 운동량 분해능으로 동시에 탐구하기 위해 필요.", "origin": "1970년대 이론적 제안 후 2000년대 후반 고휘도 방사광 가속기 발달로 실험적 실현.", "connections": "ARPES와 상호보완적이며 자성 및 궤도 여기 연구에 필수적."}, {"term": "Kitaev interaction", "why_emerged": "강한 SOC를 가진 Mott 절연체에서 스핀의 비등방적 결합을 설명하기 위해 제안.", "origin": "Alexei Kitaev (2006).", "connections": "양자 스핀 액체, 위상학적 양자 컴퓨팅 연구의 근간."}], "english_summary": ["The study utilizes RIXS to investigate bond-directional magnetic excitations in Na2IrO3.", "Experimental findings confirm the presence of Kitaev-type interactions in the honeycomb lattice.", "The research provides direct evidence of the anisotropic exchange mechanism essential for quantum spin liquids.", "The approach highlights the power of RIXS in probing directional physics in correlated iridates."]}}, {"title": "Electrical control of perpendicular altermagnets", "journal": "Nature_Materials", "source": "Gemini", "link": "https://www.nature.com/articles/s41563-026-02764-7", "authors": "Mingzhong Wu", "last_authors": "Mingzhong Wu", "summary": "An altermagnet/Dirac semimetal heterostructure enables electrical switching and reading of an altermagnetic Néel vector oriented perpendicular to the film, a configuration previously forbidden by magnetic symmetry.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Directly involves altermagnets and Dirac semimetals, topics specifically highlighted in the user profile.", "tags": ["material", "altermagnetism", "topologicalsemimetal"], "image": "https://media.springernature.com/m685/springer-static/image/art%3A10.1038%2Fs41563-026-02764-7/MediaObjects/41563_2026_2764_Fig1_HTML.png", "briefing": {"background": "Altermagnet는 자성체이면서도 강한 비등방성 덕분에 역전 대칭성과 시간 역전 대칭성이 결합된 새로운 자기 질서(Néel 벡터)를 가집니다. 이는 기존 강자성/반강자성과는 다른 전하-스핀 수송 특성을 보입니다.", "motivation": "기존에는 자기 대칭성 문제로 제어하기 어려웠던 수직 배향 Altermagnet의 Néel 벡터를 전기적으로 제어하고 읽어내기 위해 연구되었습니다.", "result": "Altermagnet/Dirac semimetal 이종 접합 구조를 통해 외부 자기장 없이 전기적 방법으로 수직 Néel 벡터를 스위칭하고 상태를 검출하는 데 성공했습니다.", "implication": "Altermagnet 기반의 차세대 비휘발성 메모리 소자 개발 가능성을 높이며, topological semimetal과의 시너지를 입증했습니다.", "novelty": "대칭성으로 금지되었던 구성을 디락 반금속과의 이종 접합을 통해 극복했다는 점에서 Altermagnet의 실용적 응용의 돌파구를 마련했습니다.", "unresolved": "이종 접합 계면에서 일어나는 스핀-궤도 토크(SOT)의 상세한 효율 및 동작 속도 한계가 과제로 남아있습니다.", "future_work": "실제 스핀트로닉 소자 단위에서의 집적도 향상 및 저전력 스위칭 최적화 연구가 수행될 것입니다.", "concepts": [{"term": "Altermagnetism", "why_emerged": "강자성과 반강자성 사이의 새로운 자성 상태로서 스핀 분극된 밴드 구조를 가지면서 알짜 자기 모멘트가 없는 물질을 분류하기 위해 제안.", "origin": "최근 2-3년 내 이론적 체계화 (Jungwirth et al.).", "connections": "위상학적 자성체, 스핀트로닉스 응용."}, {"term": "Dirac semimetal", "why_emerged": "위상학적으로 보호받는 Dirac 노드를 가지며 특이한 홀 효과 등을 나타내는 물질 연구를 위해 필요.", "origin": "2010년대 중반 실험적 발견 (Cd3As2, Na3Bi 등).", "connections": "위상 절연체, 비상관 전자 계의 Weyl semimetal로의 연결."}], "english_summary": ["Electrical control of perpendicular Néel vector is achieved in an altermagnet/Dirac semimetal heterostructure.", "The configuration overcomes symmetry-imposed limitations on switching altermagnetic orders.", "The study demonstrates a novel interface-mediated method for non-volatile spintronic applications.", "Altermagnets are highlighted as promising candidates for future quantum materials research."]}}, {"title": "Ab initio quantum embedding description of magic-angle twisted bilayer graphene at even-integer fillings", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/mp1d-6nnl", "authors": "Raehyun Kim, Woochang Kim, Kevin D. Stubbs, Steven G. Louie, Lin Lin", "last_authors": "Steven G. Louie, Lin Lin", "summary": "The correlated phase diagram of magic-angle twisted bilayer graphene (MATBG) is very sensitive to both material parameters and modeling choices. To limit the impact of these factors, here, the authors propose an embedding workflow for modeling MATBG and other moiré materials that incorporates automatic gauge fixing and is consistent with a b i n i t i o density functional theory. Using this workflow, the authors find that in MATBG, the Hartree-Fock ground state at ν = − 2 is a fragile semimetal with intervalley coherence.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "High-level electronic structure study of MATBG, a core interest for the user.", "tags": ["theory", "graphene", "moiré"], "image": "", "briefing": {"background": "Magic-angle twisted bilayer graphene(MATBG)은 두 층 사이의 뒤틀림 각도가 조절될 때 발생하는 플랫 밴드(flat band)에서 강한 전자 상관관계에 의한 초전도성, 상관 절연체 상태가 나타나는 모델 시스템입니다.", "motivation": "기존 DFT 모델링의 계산 비용 및 가우지 고정 문제로 인해 MATBG의 상관 위상도 해석이 일관되지 않는 문제를 해결하고자 했습니다.", "result": "자동 가우지 고정(gauge fixing)을 포함하는 양자 임베딩 워크플로우를 도입하여, ν = -2에서 강한 상관 관계를 가진 취약한 반금속(fragile semimetal) 상태를 도출했습니다.", "implication": "복잡한 모아레 시스템에서 ab initio 수준의 정밀한 해석이 가능함을 보였으며, 매직 앵글 물리 연구의 이론적 엄밀성을 높였습니다.", "novelty": "DFT의 정확도와 상관계 연구의 효율성을 동시에 잡은 임베딩 방법을 제안하여 기존 논란이 많았던 기저 상태 해석에 새로운 기준을 제시했습니다.", "unresolved": "이 워크플로우가 더 넓은 범위의 도핑 영역(ν 값)에서도 동일하게 높은 예측력을 가지는지 검증이 필요합니다.", "future_work": "다른 뒤틀린 2D 이종 구조(예: twisted transition metal dichalcogenides)로의 확장 적용 및 다체 문제에 대한 추가적인 동역학적 분석이 필요합니다.", "concepts": [{"term": "Magic-angle twisted bilayer graphene", "why_emerged": "이층 그래핀을 약 1.1도 비틀었을 때 나타나는 극도로 평평한 전자 에너지 밴드를 연구하기 위해 탄생.", "origin": "Pablo Jarillo-Herrero 그룹 (2018).", "connections": "모아레 격자, 강상관 전자계, 고온 초전도 연구."}, {"term": "Quantum embedding", "why_emerged": "큰 시스템 전체를 계산하는 대신 핵심 영역만 정밀하게 다루고 나머지는 환경으로 처리하여 복잡도를 줄이기 위해 제안.", "origin": "DMFT(Dynamical Mean Field Theory)의 현대적 발전과 연계된 계산 화학/물리학의 주요 기법.", "connections": "DFT+DMFT, Hubbard 모델."}], "english_summary": ["An automated quantum embedding workflow is developed to model MATBG electronic structures.", "The method improves consistency with ab initio DFT by incorporating automatic gauge fixing.", "Calculations identify the ground state at ν = -2 as a fragile semimetal with intervalley coherence.", "The approach provides a robust framework for investigating correlated phases in moiré materials."]}}, {"title": "Electronic theory for scanning tunneling microscopy spectra in bilayer nickelate thin films", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/68r6-8v6v", "authors": "Marius Scholten, Steffen Bötzel, Frank Lechermann, Peayush Choubey, Ilya M. Eremin", "last_authors": "Peayush Choubey, Ilya M. Eremin", "summary": "Recent Scanning Tunneling Microscopy (STM) experiments measuring the superconducting gap features in thin films of superconducting bilayer nickelates ${\\mathrm{La}}_{2}{\\mathrm{PrNi}}_{2}{\\mathrm{O}}_{7}$ at ambient pressure and compressive strain paved the way to study the Cooper-pairing models and…", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Electronic theory specifically modeling STM spectra in superconducting bilayer nickelates, a key material class.", "tags": ["STM", "nickelate", "superconductivity"], "image": "", "briefing": {"background": "이중층 니켈산염(bilayer nickelate, La3Ni2O7 등)은 고온 초전도성을 나타내는 차세대 강상관 전자계 물질로 주목받고 있습니다. 초전도 기작을 이해하기 위해 전자 구조의 국소적 상태밀도(LDOS)를 측정하는 STM은 필수적인 도구입니다.", "motivation": "최근 La2PrNi2O7 박막에서의 STM 실험 결과가 발표됨에 따라, 관측된 초전도 갭 구조를 이론적으로 정량화하고 어떤 쿠퍼 쌍 모델(Cooper-pairing model)이 적합한지 검증하기 위한 전자 이론이 요구되었습니다.", "result": "이 연구는 이중층 니켈산염의 전자 구조를 바탕으로 STM 스펙트럼의 이론적 모델을 구축하여, 실험적으로 관측된 국소 상태밀도 특징들이 어떤 전자적 상태와 관련되어 있는지 해석했습니다.", "implication": "이 모델을 통해 실험적 데이터와 이론적 쿠퍼 쌍 대칭성을 직접 비교함으로써, 니켈산염 초전도체의 기작이 d-wave인지 s-wave인지 혹은 다른 이색적인 상태인지 판별할 수 있는 토대를 마련했습니다.", "novelty": "최근 주목받는 니켈산염 분야에서 STM 실험 데이터와 이론적 모델링을 연결하는 구체적인 프레임워크를 제시했다는 점이 중요합니다.", "unresolved": "이론적 모델은 이상적인 결정 구조를 기반으로 하므로, 실제 박막에서 존재하는 원자 결함, 국소적 격자 왜곡 등이 STM 스펙트럼에 미치는 영향은 여전히 논의의 여지가 있습니다.", "future_work": "실제 실험 데이터와 계산된 스펙트럼의 정밀한 피팅을 통해 최적의 짝짓기 파라미터를 추출하고, 압력 변화에 따른 갭 변화를 모델링할 예정입니다.", "concepts": [{"term": "Bilayer Nickelates", "why_emerged": "구리 산화물 초전도체와 유사한 구조를 가지면서 전자 상관관계가 조절 가능한 새로운 물질군으로 발견되었습니다.", "origin": "최근 La3Ni2O7의 고압 초전도성 보고(2023)로 본격화됨.", "connections": "cuprate superconductors, strongly correlated electrons."}, {"term": "STM/STS", "why_emerged": "물질 표면의 전자 상태를 원자 단위의 공간 분해능으로 측정하여 갭 구조와 국소적인 전자 상태를 직접 확인하기 위해 필요합니다.", "origin": "Binnig and Rohrer(1982).", "connections": "LDOS, quasiparticle interference (QPI)."}], "english_summary": ["Provides a theoretical framework for interpreting STM spectra in bilayer nickelates.", "Aims to clarify Cooper-pairing symmetry by modeling LDOS features.", "Crucial for identifying the superconducting mechanism in La2PrNi2O7 thin films.", "Bridges the gap between microscopic theory and scanning tunneling microscopy experiments."]}}, {"title": "Metallic electro-optic effects in topological chiral crystals", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/1vvf-8rvx", "authors": "C. O. Ascencio, D. J. P. de Sousa, Tony Low", "last_authors": "D. J. P. de Sousa, Tony Low", "summary": "Topological chiral crystals have emerged as a fertile material platform for investigating optical phenomena derived from the distinctive Fermi surface Berry curvature and orbital magnetic moment textures around multifold chiral band crossings pinned at the time-reversal invariant momenta. In this wo…", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Studies topological chiral crystals and multifold fermions through Berry curvature effects.", "tags": ["theory", "Berry-curvature", "semimetals"], "image": "", "briefing": {"background": "위상학적 카이랄 결정(topological chiral crystals)은 결정 구조의 대칭성으로 인해 강한 베리 곡률과 궤도 자기 모멘트를 가지며, 이는 일반적인 물질과는 다른 독특한 광학적 응답을 유도합니다.", "motivation": "반전 대칭성이 없는 카이랄 결정에서 다중 폴드 페르미온(multifold fermions) 주위의 베리 곡률이 어떻게 전기 광학 효과(electro-optic effect)를 유도하고 제어할 수 있는지 규명하고자 했습니다.", "result": "이 연구는 외부 전기장에 의해 유도되는 베리 곡률의 변화가 카이랄 결정의 광학적 응답에 어떻게 반영되는지 이론적으로 입증했습니다.", "implication": "위상 물질을 이용한 초고속 광학 소자나 차세대 광검출기 설계 시, 위상학적 특성을 활용한 새로운 동작 원리를 제공합니다.", "novelty": "카이랄 위상 물질의 페르미 면과 베리 곡률이라는 고전적 관심사를 전기 광학적 응답이라는 실제 소자 관점으로 연결했습니다.", "unresolved": "실제 실험적인 전기 광학 측정 데이터와의 정량적 비교 및 소자 규모에서의 층간 효과 등에 대한 구체적인 평가는 추가 연구가 필요합니다.", "future_work": "다양한 카이랄 결정 물질에서의 구체적인 전기 광학 응답 계산 및 실험적 검증을 위한 타겟 물질 제안.", "concepts": [{"term": "Topological Chiral Crystals", "why_emerged": "결정 구조가 반전 대칭성을 잃으면서 위상학적으로 비자명한 전자 상태(multifold fermions)가 형성되기 때문입니다.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "Weyl semimetals, Berry curvature, multifold fermions."}, {"term": "Berry Curvature", "why_emerged": "운동량 공간에서 파동함수의 기하학적 위상 성질을 기술하여 전자 수송 현상을 이해하기 위해 필요합니다.", "origin": "Michael Berry (1984).", "connections": "Anomalous Hall effect, topological insulators."}], "english_summary": ["Explores elect ags": ["quantumHall", "topological", "superfluidity"], "image": "", "briefing": {"background": "양자 홀 효과는 강한 자기장에서 전자들이 집단적으로 거동하는 현상으로, 다층 구조에서는 층 간 상호작용에 의해 복잡한 위상적 질서가 형성될 수 있습니다.", "motivation": "뉴트럴(neutral)한 엑시톤이 응축된 상태에서 초유체성과 위상적 질서가 공존할 수 있는 물리적 조건을 탐구하고자 합니다.", "result": "ν=1/3 층을 가진 삼층 양자 홀 시스템에서 애니온 엑시톤 응축이 발생하여 초유체성과 위상적 질서가 동시에 나타나는 상을 예측했습니다.", "implication": "위상적 질서와 초유체성이 얽힌 새로운 유형의 양자 상태(Anyon Superfluid)의 존재 가능성을 확인했습니다.", "novelty": "단순한 양자 홀 상태를 넘어, 애니온 통계가 초유체적 거동과 결합하는 이국적인 물성을 다층 vdW 구조에서 이론적으로 제시했습니다.", "unresolved": "이러한 응축 상태를 관찰하기 위한 구체적인 온도 조건과 실험적 신호(수송 측정 등)의 명확한 특성은 미해결 과제입니다.", "future_work": "고도로 제어된 삼층 그래핀 또는 반도체 이종접합에서 저온 수송 측정을 통한 상태 검증이 요구됩니다.", "concepts": [{"term": "애니온 (Anyon)", "why_emerged": "2차원 시스템에서 보존이나 페르미온이 아닌, 통계적으로 중간적인 거동을 하는 준입자를 설명하기 위해 필요함.", "origin": "Frank Wilczek (1982)", "connections": "분수 양자 홀 효과, 위상적 양자 컴퓨터"}, {"term": "엑시톤 응축", "why_emerged": "전자와 정공 쌍이 보스-아인슈타인 응축과 유사한 거동을 보일 때 나타나는 집단 현상을 이해하기 위해 필요함.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "초유체성, 양자 홀 이종구조"}], "english_summary": ["Investigates trilayer quantum Hall systems at filling factor ν=1/3.", "Predicts an anyon-exciton condensate phase in these systems.", "Highlights the coexistence of superfluidity and topological order.", "Provides a theoretical model for new exotic quantum phases in layered vdW structures."]}}, {"title": "Cooperative Quantum Optical Effects of Moiré Exciton Superlattices", "journal": "PRL_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/sp3h-pkqx", "authors": "Haowei Xu, Wang Yao, Ju Li", "last_authors": "Wang Yao, Ju Li", "summary": "The unique properties of two-dimensional moiré systems have been widely studied from many perspectives. However, relatively little work has investigated how the real-space structure of moiré systems can directly engender novel properties and functionalities. In this Letter, we explore how intriguing…", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Moiré sy   headText.appendChild(badges);
  const title = document.createElement('h1');
  if (r.link) { const titleLink = document.createElement('a'); titleLink.href = r.link; titleLink.target = '_blank'; titleLink.rel = 'noopener noreferrer'; titleLink.textContent = r.title || ''; title.appendChild(titleLink); }
  else { title.textContent = r.title || ''; }
  headText.appendChild(title);
  headText.appendChild(textEl('p', 'meta', [r.journal, r.source].filter(Boolean).join(' | ')));
  if (r.last_authors || r.authors) { const authors = document.createElement('p'); authors.className = 'authors'; if (r.last_authors) authors.append('Last authors: ' + r.last_authors); if (r.authors) authors.append((r.last_authors ? ' | ' : '') + 'Authors: ' + r.authors); headText.appendChild(authors); }
  appendLabeledText(headText, 'why', 'Filter reason: ', r.reason);
  if (r.tags && r.tags.length) { const tags = document.createElement('div'); tags.className = 'tags'; r.tags.forEach(tag => tags.appendChild(textEl('span', 'tag', '#' + tag))); headText.appendChild(tags); }
  if (r.link) { const link = document.createElement('a'); link.className = 'link'; link.href = r.link; link.target = '_blank'; link.rel = 'noopener noreferrer'; link.textContent = 'Open paper'; headText.appendChild(link); }
  head.appendChild(headText);
  if (r.summary) { const abstract = document.createElement('p'); abstract.className = 'original-abstract'; const strong = textEl('strong', '', 'Original abstract'); abstract.appendChild(strong); abstract.append(r.summary); head.appendChild(abstract); }
  slideEl.appendChild(head);
  const briefing = document.createElement('div');
  briefing.className = 'briefing';
  appendBriefSection(briefing, 'Background', b.background);
  appendBriefSection(briefing, 'Motivation', b.motivation);
  appendBriefSection(briefing, 'Result', b.result);
  appendBriefSection(briefing, 'Implication', b.implication);
  appendBriefSection(briefing, "Why it's important / Novelty", b.novelty);
  appendBriefSection(briefing, 'Unresolved Questions', b.unresolved);
  appendBriefSection(briefing, 'Expected Future Work', b.future_work);
  if (b.concepts && b.concepts.length) {
    const section = document.createElement('section');
    section.className = 'brief-section wide';
    section.appendChild(textEl('h2', '', 'Concepts / Terms'));
    const concepts = document.createElement('div');
    concepts.className = 'concepts';
    b.concepts.forEach(c => {
      const item = document.createElement('div');
      item.className = 'concept';
      item.appendChild(textEl('h3', '', c.term || 'Concept'));
      [['왜 생겼나: ', c.why_emerged], ['누가 만들었나: ', c.origin], ['연결되는 흐름: ', c.connections]].forEach(([label, text]) => { if (!text) return; const p = document.createElement('p'); const bold = textEl('b', '', label); p.appendChild(bold); p.append(text); item.appendChild(p); });
      concepts.appendChild(item);
    });
    section.appendChild(concepts);
    briefing.appendChild(section);
  }
  if (b.english_summary && b.english_summary.length) { const section = document.createElement('section'); section.className = 'brief-section wide'; section.appendChild(textEl('h2', '', 'English Summary')); const ul = document.createElement('ul'); b.english_summary.slice(0, 5).forEach(line => ul.appendChild(textEl('li', '', line))); section.appendChild(ul); briefing.appendChild(section); }
  slideEl.appendChild(briefing);
  counterEl.textContent = `${index + 1} / ${slides.length}`;
  prevBtn.disabled = index === 0;
  nextBtn.disabled = index === slides.length - 1;
}
prevBtn.addEventListener('click', () => { index = Math.max(0, index - 1); render(); });
nextBtn.addEventListener('click', () => { index = Math.min(slides.length - 1, index + 1); render(); });
document.addEventListener('keydown', event => { if (event.key === 'ArrowLeft') prevBtn.click(); if (event.key === 'ArrowRight') nextBtn.click(); });
render();
</script>
</body>
</html>
