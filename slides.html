ition suppresses mobility and reverses carrier type from hole-like to electron-like. The Al/Si ratio thus serves as a chemical knob that primarily modulates the Fermi level via compositional band filling, while off-stoichiometry-induced chemical disorder plays a subordinate role in determining the AHE mechanism. These results position off-stoichiometric PrAlSi as a tunable platform where subtle compositional variation reversibly switches the AHE mechanism.", "tier": "B_IMPORTANT_CONDMAT", "score": "9", "reason": "Direct study on Weyl semimetals relevant to anomalous Hall and transport experiments.", "tags": ["experiment", "Weylsemimetal", "anomalousHall"], "image": "https://arxiv.org/static/browse/0.3.4/images/arxiv-logo-fb.png", "briefing": {"background": "자기적 Weyl 반금속에서 나타나는 비정상 홀 효과(AHE)는 내인성(intrinsic) Berry 곡률 효과와 외인성(extrinsic) 산란 기작이 경쟁하는 복합적인 현상입니다.", "motivation": "PrAlSi 화합물에서 화학적 조성(Al/Si 비율) 조절을 통해 단일 물질 내에서 AHE의 지배적인 기작을 가역적으로 전환할 수 있는지 실험적으로 증명하고자 합니다.", "result": "Al/Si 비율을 미세하게 조절함으로써 AHC(비정상 홀 전도도)가 170에서 1413까지 변화하는 아치형 비단조성 변화를 발견했습니다. 특히 중간 조성에서는 외인성 곁산란(skew-scattering)이 지배적이나, 양 끝단 조성에서는 내인성 Berry 곡률이 지배적인 가역적 crossover를 확인했습니다.", "implication": "화학적 조성 조절(band filling 및 disorder)만으로 양자 수송 현상의 메커니즘을 제어할 수 있는 물질 플랫폼을 구축했습니다.", "novelty": "하나의 물질 계열에서 화학적 '노브(knob)'를 통해 내인성-외인성-내인성으로 AHE 메커니즘을 가역적으로 스위칭한 점이 핵심입니다. 이는 Weyl semimetal 기반 소자 설계에 중요한 통찰을 줍니다.", "unresolved": "Al/Si 비율 변화가 밴드 구조의 페르미 준위를 정확히 어떻게 이동시키는지에 대한 더 구체적인 ARPES 데이터나 DFT 계산과의 비교는 아직 상세히 정립되지 않았습니다.", "future_work": "조성 변화에 따른 정확한 전자 구조 변화를 관찰하기 위해 ARPES 실험을 통해 밴드 구조와 Berry 곡률의 변화를 직접 추적할 계획입니다.", "concepts": [{"term": "Anomalous Hall Effect", "why_emerged": "강자성체에서 외부 자기장 외에도 자화에 비례하여 발생하는 홀 전압을 설명하기 위해 도입되었습니다.", "origin": "E. H. Hall에 의해 처음 보고되었으며, 이후 Karplus와 Luttinger가 이론적으로 정립했습니다.", "connections": "Berry 곡률, Weyl 반금속, 자기 위상 물질과 깊게 연결됩니다."}, {"term": "Skew-scattering", "why_emerged": "비정상 홀 효과의 기작 중 산란 중심에 의한 비대칭 산란을 기술하기 위해 필요합니다.", "origin": "Smit(1955)에 의해 제안되었습니다.", "connections": "외인성(extrinsic) 수송 메커니즘의 대표적 기작으로 내인성 효과와 구분됩니다."}], "english_summary": ["Demonstrated a reversible crossover of AHE mechanism in PrAlSi via Al/Si ratio tuning.", "The system transitions from intrinsic to extrinsic and back to intrinsic AHE regimes.", "Identified that composition-driven Fermi level shifting is the primary control knob.", "Positions off-stoichiometric PrAlSi as a tunable platform for AHE research."]}}, {"title": "Spin textures at the Fermi surface of ferromagnets and associated torque", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2610.18800", "authors": "T. Valet, J. Li, H. Jaffr\\`es, V. Cros, M. Chshiev, R. Raimondi", "last_authors": "H. Jaffr\\`es, V. Cros, M. Chshiev, R. Raimondi", "summary": "We establish theoretically that transverse spin textures are generically induced by the spin-orbit interaction at the Fermi surface of centrosymmetric ferromagnetic metals. We confirm this prediction with {\\em ab initio} computations for Fe, Co and Ni. By symmetry, this cannot be associated with spin-orbit torques under a uniform current. However, a new {\\em current-gradient-induced} torque emerges in nanoscale geometries. For a series of Ni-based bilayers, the computed Ni thickness dependence of the current-gradient-induced torque is in quantitative agreement with measurements previously attributed to orbital torques. We discuss how this opens a new avenue for the electrical control of magnetic orders, possibly also including the N\\'eel vector of metallic altermagnets.", "tier": "B_IMPORTANT_CONDMAT", "score": "9", "reason": "Ab initio study of Fermi surface spin textures in ferromagnets and altermagnets.", "tags": ["altermagnetism", "Fermi-surface", "DFT"], "image": "https://arxiv.org/html/2610.18800v1/Fig1.png", "briefing": {"background": "최근 전이금속 산화물 및 합금에서 스핀-궤도 상호작용(SOI)에 의해 유도되는 페르미 표면의 스핀 텍스처는 스핀-궤도 토크(SOT) 기술의 핵심 요소로 떠오르고 있습니다.", "motivation": "중심대칭(centrosymmetric) 강자성체에서도 스핀-궤도 상호작용에 의해 횡방향 스핀 텍스처가 유도될 수 있음을 이론적으로 증명하고, 이를 실험 결과와 비교하고자 합니다.", "result": "Fe, Co, Ni와 같은 일반적인 강자성체에서도 페르미 표면의 횡방향 스핀 텍스처가 존재함을 입증했습니다. 또한, 균일한 전류가 아닌 '전류 기울기(current-gradient)'에 의해 발생하는 새로운 토크 기작을 제안하여, 기존에 궤도 토크(orbital torque)로 해석되던 실험 결과를 재해석했습니다.", "implication": "알터자성체(altermagnets)를 포함한 다양한 자성 물질에서 전기적 자기 질서 제어를 위한 새로운 물리적 메커니즘을 제공합니다.", "novelty": "기존에 비중심대칭 구조에서만 고려되던 스핀-궤도 토크 기작을 일반적인 강자성체로 확장하였으며, 특히 알터자성체의 Neel 벡터 제어 가능성을 제시했다는 점에서 매우 현대적입니다.", "unresolved": "제안된 전류 기울기 유도 토크가 구체적인 나노 소자 구조에서 궤도 토크와 완전히 구별되는지, 혹은 혼재되어 있는지 실험적으로 완전히 분리하는 과제가 남았습니다.", "future_work": "알터자성체 박막 구조에서 실제 전류 기울기 토크를 측정하여 이론적 예측을 검증하는 실험 연구가 요구됩니다.", "concepts": [{"term": "Altermagnetism", "why_emerged": "강자성도 반강자성도 아닌, 결정 대칭성에 기반한 비자기 보상 반강자성 상태를 기술하기 위해 등장했습니다.", "origin": "최근(2020년대 초) 신흥 자성 물질 분야에서 이론적으로 활발히 제안되었습니다.", "connections": "스핀-궤도 토크, 비전통적 자성 금속, Berry 곡률 연구와 연결됩니다."}, {"term": "Spin-Orbit Torque (SOT)", "why_emerged": "외부 자기장 없이 전류를 이용해 효율적으로 자화 방향을 반전시키기 위한 spintronics의 핵심 기술입니다.", "origin": "Miron et al. (2011) 등의 연구가 시발점이 되었습니다.", "connections": "Rashba 효과, Spin Hall 효과와 연결됩니다."}], "english_summary": ["Theoretically established that transverse spin textures exist in centrosymmetric ferromagnets.", "Identified a current-gradient-induced torque mechanism in nanoscale geometries.", "Reinterpreted existing Ni-based bilayer torque measurements as current-gradient-driven.", "Presents a pathway for electrical control of Neel vectors in metallic altermagnets."]}}, {"title": "Superconductivity from altermagnetic fluctuations: the crucial role of sublattice polarization", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2610.16507", "authors": "Mats Barkman, Andreas Kreisel, Brian M. Andersen", "last_authors": "Andreas Kreisel, Brian M. Andersen", "summary": "Unconventional superconductivity in correlated systems often appears in the vicinity of a magnetically ordered state. This situation is also relevant for altermagnets, characterized by a nonrelativistic spin-split electronic structure in the presence of N\\'eel order. Many proposed altermagnetic candidates, however, never cross the magnetic instability. We study superconductivity arising from altermagnetic fluctuations in such systems and show that the sublattice polarization (SLP) of the normal-state bands plays a pivotal role in determining the superconducting state. SLP, an inherent property of altermagnetic band structures that persists even without magnetic order, prevents Cooper pairs from forming between different sublattices. This suppresses pairing mediated by the nearest-neighbor antiferromagnetic exchange, which favors spin-singlet superconductivity, and leaves longer-range same-sublattice bonds dominant. When the next-nearest-neighbor exchange is ferromagnetic, as expected for frustration-free N\\'eel order, this results in spin-triplet superconductivity. This mechanism is fundamentally different from that in altermagnets with long-range N\\'eel order, where the spin-split Fermi surfaces favor equal-spin pairing. Finally, when longer-range interactions in the disordered phase instead favor singlet pairing, SLP leads to singlet states with characteristic properties distinct from nearest-neighbor pairing states.", "tier": "B_IMPORTANT_CONDMAT", "score": "9", "reason": "Theoretical study on altermagnetic fluctuations and unconventional superconductivity, highly relevant to user's interests.", "tags": ["altermagnetism", "unconventionalsuperconductivity", "theory", "electronicstructure"], "image": "https://arxiv.org/html/2610.16507v1/FIG1_lieb_lattice.png", "briefing": {"background": "강한 상관계 시스템에서 비전통적 초전도성은 흔히 자기 정렬 상태 근처에서 나타납니다. 최근 주목받는 알터마그넷(Altermagnet)은 비상대론적 스핀 분리 전자 구조를 가지며, 이는 자기 정렬이 없더라도 존재할 수 있는 독특한 특성입니다.", "motivation": "알터마그넷 후보 물질 중 다수는 실제 자기 정렬 임계값에 도달하지 못하는 경우가 많습니다. 본 연구는 이러한 비정렬 상태의 알터마그넷적 요동이 어떻게 초전도 쌍 형성을 매개하는지 규명하고자 합니다.", "result": "정상 상태 밴드의 부격자 편극(Sublattice Polarization, SLP)이 초전도 상태를 결정하는 핵심 요소임을 밝혀냈습니다. SLP는 서로 다른 부격자 간의 쿠퍼 쌍 형성을 rs. Magnetization rotation changes the elastic modulus of NbMnTe$_2$ by up to 36\\%, while lattice entropy substantially enhances the near-room-temperature magnetocaloric response of NbMnS$_2$ and NbMnSe$_2$. In NbMnSe$_2$, rotation restores a mirror-protected crossing, continuously closes an a", "implication": "필터가 이 논문을 통과시킨 이유는 관련 키워드, 저자, 또는 Gemini relevance score 때문입니다.", "novelty": "First-principles study of 2D noncollinear ferrimagnets with strong spin-lattice-charge coupling and spintronic potential.", "unresolved": "원문 확인 후 열린 질문을 판단해야 합니다.", "future_work": "후속 실험, 독립 재현, 관련 물질/조건 확장이 가능한지 확인하세요.", "concepts": [], "english_summary": ["The detailed AI briefing was unavailable for this paper.", "Use the abstract, score reason, and original link for a quick first pass."]}}, {"title": "Double circular dichroism high harmonic spectroscopy: An ultrafast probe for topological photocurrents", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2604.21121", "authors": "Osamah Sufyan, Ofer Neufeld", "last_authors": "Osamah Sufyan, Ofer Neufeld", "summary": "ABSTRACT: Understanding optical responses of topological matter is a central problem for enabling optoelectronic applications based on topological physics, which is of fundamental concern for photocurrents control and spectroscopy. Currently, schemes for sensing ultrafast photocurrents and separating their bulk/surface contributions are lacking but are crucial for exploring topological ultrafast physics. We introduce here double circular dichroism (DCD) harmonic spectroscopy as an all-optical probe of ultrafast dynamics in topological materials. In this scheme, pump and probe pulses are circular with helicities that are independently controlled, yielding the circular dichroism of the circular dichroism — a time-resolved response evaluating how probe-induced dichroism depends on pump helicity. While DCD vanishes in symmetric systems, it survives in broken time-reversal symmetry materials including Chern insulators. We theoretically demonstrate this concept through simulations in a Haldane nanoflake, where a pump laser manipulates chiral current-carrying states, and intense probe pulses drive harmonic emission. We show that DCD originates from both bulk and edge-localized states, but these have opposite signs, similar magnitudes, and a different amplitude scaling. Moreover, edge-associated DCD is connected with the outermost atomic layer of exponentially-localized protected modes, and is relatively robust to bulk/edge interference. Hence, DCD could allow efficient separation of bulk/edge contributions to photocurrents. Variation of the electronic structure and laser parameters further reveals anomalies that might be useful for probing topological attributes of photocurrents and material phase in select harmonics. This is especially apparent in the oscillatory behavior of HHG DCD with respect to the electronic band structure manipulation which varies greatly across the phase transition and becomes stable and non-oscillatory in topologically-trivial phases. Further probing pump-probe delay we show that DCD oscillates on attosecond timescales, which could serve as an ultrafast probe of topological photocurrents and their associated coherence. Overall, our work introduces DCD as a potentially powerful approach for disentangling bulk/boundary photo-responses in broken-symmetry quantum and topological matter, and could also be implemented in other pump-probe spectroscopies based on photoelectrons and absorption, as well as chiral systems.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Proposes a new circular dichroism-based spectroscopic probe for topological states, relevant to user's CD interests.", "tags": ["method", "circulardichroism", "topology"], "image": "https://arxiv.org/html/2604.21121v2/setup_final.png", "briefing": {"background": "자동 브리핑을 생성하지 못했습니다. 초록과 원문 링크를 기준으로 빠르게 확인하세요.", "motivation": "초록 정보만으로는 분야 내부의 구체적 동기를 안정적으로 요약하기 어렵습 oups shows that the EEE is allowed in a wide range of magnetic and nonmagnetic systems, including ferromagnets, antiferromagnets, and altermagnets. The EEE plays two distinct roles: it generates spin polarization where the linear Edelstein effect (EE) is symmetry-forbidden, as in centrosymmetric materials; and it adds a new gate-tunable component, generally non-collinear with the conventional one, where the EE is already present. The two fields then act as independent knobs and raise the control dimension of the spin polarization from one to two. Our microscopic theory traces the EEE to band-geometric quantities, which are strongly enhanced near small band gaps. First-principles calculations predict pronounced effects in the centrosymmetric ferromagnet MnSe2, where the linear EE is symmetry-forbidden. In the nonmagnet SnSe where the EE and EEE coexist, the two knobs cover an extended region of the spin sphere. Our findings establish the EEE as a symmetry-guided, gate-tunable route to electrical spin manipulation and open avenues for multistate spintronics in 2D quantum materials.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Theoretical proposal of electric Edelstein effect in 2D magnetic materials, with altermagnetism relevance.", "tags": ["theory", "spintronics", "2Dmaterials", "altermagnetism", "DFT"], "image": "https://arxiv.org/html/2610.17535v1/rotate.png", "briefing": {"background": "자동 브리핑을 생성하지 못했습니다. 초록과 원문 링크를 기준으로 빠르게 확인하세요.", "motivation": "초록 정보만으로는 분야 내부의 구체적 동기를 안정적으로 요약하기 어렵습니다.", "result": "We propose the electric Edelstein effect (EEE) in two-dimensional (2D) systems, where crossed out-of-plane and in-plane electric fields generate a spin polarization. The gate field converts the Edelstein response from a material-fixed spin polarization into a gate-tunable one. A symmetry analysis over all magnetic layer point groups shows that the EEE is allowed in a wide range of magnetic and nonmagnetic systems, including ferromagnets, antiferromag eason, and original link for a quick first pass."]}}, {"title": "Evidence of an anisotropic Griffiths phase in a two-dimensional van der Waals magnet", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2610.17315", "authors": "Anupam K. Singh, Dhananjay Nair, Holger Meyerheim, Stuart S. P. Parkin, Banabir Pal", "last_authors": "Stuart S. P. Parkin, Banabir Pal", "summary": "Over the last decade, the emerging field of two-dimensional van der Waals magnetism has focused mainly on long-range-ordered magnetic phases. Disordered magnetic phases, however, remain largely unexplored. Here, we report a highly anisotropic Griffiths phase driven by self-intercalation in the van der Waals magnet Fe5GeTe2. We find evidence of short-range-ordered ferromagnetic clusters embedded in a paramagnetic matrix, which dominate the magnetic response between the Curie temperature and a higher characteristic Griffiths temperature. An anomalous power-law divergence in the magnetic susceptibility, universal Lee Yang scaling, and distinct entropy anomalies provide further evidence for this phase. Strikingly, the non-analytic Griffiths response emerges exclusively under in-plane magnetic fields, whereas out-of-plane fields abruptly alter this behavior. This directional dependence indicates that the local magnetic interactions within nanoscale clusters are closely coupled to the layered lattice geometry. Our findings establish a regime of dimensionally constrained, disorder-driven magnetism and identify self-intercalated van der Waals magnets as a platform for investigating the interplay between magnetic disorder, anisotropy, and reduced dimensionality.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Experimental study of a 2D vdW magnet with anisotropic Griffiths phase; relevant to quantum materials.", "tags": ["experiment", "magnetism", "vanderWaals", "2Dmaterials"], "image": "https://arxiv.org/static/browse/0.3.4/images/arxiv-logo-fb.png", "briefing": {"b , "link": "https://arxiv.org/abs/2604.25146", "authors": "Kaedon Cleland-Host, Vedran Jelic, Stefanie Adams, et al.", "last_authors": "Sheng H. Lee, Tyler L. Cocker", "summary": "Atomic-scale disorder shapes the potential energy landscape traversed by photocarriers, while the carriers themselves also dynamically reshape this landscape. However, resolving ultrafast photocarrier motion at atomic length scales has remained a central challenge in materials science. Here, we demonstrate that lightwave-driven terahertz scanning tunnelling microscopy (THz-STM) provides access to these dynamics by probing the ultrafast evolution of local electronic structure following resonant interband excitation. We introduce a generalized inversion protocol that reconstructs the time-dependent differential conductance directly from measured THz-STM data, enabling quantitative analysis of the photoexcited electronic structure without prior knowledge of the sample's properties. Applying this approach to the photoexcited GaAs(110) surface, we image the resulting femtosecond carrier dynamics by tracking the transient photocurrents produced by ultrafast shifts in the energy alignment of surface and bulk electronic states near individual surface defects. The reconstructed dynamics reveal time-dependent band bending induced by the photocarriers and highlight three key mechanisms that contribute to the ultrafast tunnel current response. Critically, terahertz time-domain sampling of the tip near-field, which both captures the waveform and demonstrates its invariance under sample photoexcitation, allows the intrinsic sample dynamics to be disentangled from the coherent sub-cycle dynamics induced by the terahertz driving field. We establish a new regime of ultrafast tunnelling spectroscopy that captures transient electronic structure and dynamic band alignment with unprecedented spatio-temporal resolution, which has significant implications for understanding carrier transport, defect-mediated proce ther condensed matter realizations of chiral fermions. These efforts were dramatically accelerated by the subsequent discovery of a profound link between low-energy topological and lattice chirality in structurally chiral crystals. Though TSMs are well understood in the limit of perfect translation symmetry, real solid-state materials host defects and disorder, and may even be rendered amorphous down to all but the smallest system length scales. Previous theoretical studies have concluded that chiral TSMs transition into trivial diffusive metals at moderate disorder scales, raising concerns that chiral TSM states may only be accessible in highly crystalline samples. In this work, we in contrast identify large families of chiral TSMs that instead persist under strong structural disorder even into the amorphous regime. We show that amorphous chiral TSM phases can be stabilized in particular by the presence of long-range order in the local structural chirality. We present extensive analytic and numerical calculations demonstrating the existence of both Weyl and higher-charge chiral fermions in amorphous metals whose topology and spin and orbital angular momentum textures are tunable via the interplay of average symmetry and geometry. To distinguish and generate new realizations of strongly disordered chiral fermions, we introduce an analytic approach grounded in symmetry group theory. We then introduce an amorphous Wilson loop numerical method to identify chiral fermions in metals with 3D structural disorder. Our findings bridge the crystalline and strongly disordered regimes of chiral TSMs, and indicate a clear route toward engineering geometry-enforced topology in noncrystalline materials and metamaterials.", "tier": "B_IMPORTANT_CONDMAT", "score": "7", "reason": "Extends Weyl/chiral fermion concepts to amorphous systems, relevant to topological semimetal research.", "tags": ["theory", "Weylsemimetals", "topology"], "image": "https://arxiv.org/html/2512.19791v2/flow_     figure.appendChild(img);
    figure.appendChild(textEl('figcaption', '', 'Figure / article preview image from the source page'));
    head.appendChild(figure);
  }
  const headText = document.createElement('div');
  headText.className = 'head-text';
  const badges = document.createElement('div');
  badges.className = 'badges';
  if (r.score) badges.appendChild(textEl('span', 'badge score', `${r.score}/10`));
  if (r.tier) badges.appendChild(textEl('span', 'badge', r.tier));
  if (r.journal) badges.appendChild(textEl('span', 'badge', r.journal));
  if (r.source) badges.appendChild(textEl('span', 'badge', r.source));
  headText.appendChild(badges);
  const title = document.createElement('h1');
  if (r.link) { const titleLink = document.createElement('a'); titleLink.href = r.link; titleLink.target = '_blank'; titleLink.rel = 'noopener noreferrer'; titleLink.textContent = r.title || ''; title.appendChild(titleLink); }
  else { title.textContent = r.title || ''; }
  headText.appendChild(title);
  headText.appendChild(textEl('p', 'meta', [r.journal, r.source].filter(Boolean).join(' | ')));
  if (r.last_authors || r.authors) { const authors = document.createElement('p'); authors.className = 'authors'; if (r.last_authors) authors.append('Last authors: ' + r.last_authors); if (r.authors) authors.append((r.last_authors ? ' | ' : '') + 'Authors: ' + r.authors); headText.appendChild(authors); }
  appendLabeledText(headText, 'why', 'Filter reason: ', r.reason);
  if (r.tags && r.tags.length) { const tags = document.createElement('div'); tags.className = 'tags'; r.tags.forEach(tag => tags.appendChild(textEl('span', 'tag', '#' + tag))); headText.appendChild(tags); }
  if (r.link) { const link = document.createElement('a'); link.className = 'link'; link.href = r.link; link.target = '_blank'; link.rel = 'noopener noreferrer'; link.textContent = 'Open paper'; headText.appendChild(link); }
  head.appendChild(headText);
  if (r.summary) { const abstract = document.createElement('p'); abstract.className = 'original-abstract'; const strong = textEl('strong', '', 'Original abstract'); abstract.appendChild(strong); abstract.append(r.summary); head.appendChild(abstract); }
  slideEl.appendChild(head);
  const briefing = document.createElement('div');
  briefing.className = 'briefing';
  appendBriefSection(briefing, 'Background', b.background);
  appendBriefSection(briefing, 'Motivation', b.motivation);
  appendBriefSection(briefing, 'Result', b.result);
  appendBriefSection(briefing, 'Implication', b.implication);
  appendBriefSection(briefing, "Why it's important / Novelty", b.novelty);
  appendBriefSection(briefing, 'Unresolved Questions', b.unresolved);
  appendBriefSection(briefing, 'Expected Future Work', b.future_work);
  if (b.concepts && b.concepts.length) {
    const section = document.createElement('section');
    section.className = 'brief-section wide';
    section.appendChild(textEl('h2', '', 'Concepts / Terms'));
    const concepts = document.createElement('div');
    concepts.className = 'concepts';
    b.concepts.forEach(c => {
      const item = document.createElement('div');
      item.className = 'concept';
      item.appendChild(textEl('h3', '', c.term || 'Concept'));
      [['왜 생겼나: ', c.why_emerged], ['누가 만들었나: ', c.origin], ['연결되는 흐름: ', c.connections]].forEach(([label, text]) => { if (!text) return; const p = document.createElement('p'); const bold = textEl('b', '', label); p.appendChild(bold); p.append(text); item.appendChild(p); });
      concepts.appendChild(item);
    });
    section.appendChild(concepts);
    briefing.appendChild(section);
  }
  if (b.english_summary && b.english_summary.length) { const section = document.createElement('section'); section.className = 'brief-section wide'; section.appendChild(textEl('h2', '', 'English Summary')); const ul = document.createElement('ul'); b.english_summary.slice(0, 5).forEach(line => ul.appendChild(textEl('li', '', line))); section.appendChild(ul); briefing.appendChild(section); }
  slideEl.appendChild(briefing);
  counterEl.textContent = `${index + 1} / ${slides.length}`;
  prevBtn.disabled = index === 0;
  nextBtn.disabled = index === slides.length - 1;
}
prevBtn.addEventListener('click', () => { index = Math.max(0, index - 1); render(); });
nextBtn.addEventListener('click', () => { index = Math.min(slides.length - 1, index + 1); render(); });
document.addEventListener('keydown', event => { if (event.key === 'ArrowLeft') prevBtn.click(); if (event.key === 'ArrowRight') nextBtn.click(); });
render();
</script>
</body>
</html>
