<!DOCTYPE html>

<title>Daily Paper Slideshow</title>
<style>
  :root {
    color-scheme: light;
    --bg: #f6f7f4;
    --paper: #ffffff;
    --ink: #111827;
    --muted: #64748b;
    --line: #d8ddd2;
    --accent: #176b87;
    --accent-2: #9a3412;
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; overflow: auto; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: var(--bg); color: var(--ink); }
  .shell { max-width: 1500px; min-height: 100vh; margin: 0 auto; padding: 14px 18px; display: flex; flex-direction: column; }
  .topbar { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 16px; }
  .top-actions { display: flex; align-items: center; gap: 10px; }
  .topbar a, button { border: 1px solid var(--line); border-radius: 8px; background: var(--paper); color: var(--ink); padding: 10px 14px; font-weight: 700; text-decoration: none; cursor: pointer; }
  button.primary { background: var(--accent); border-color: var(--accent); color: white; }
  button:disabled { opacity: 0.45; cursor: not-allowed; }
  .counter { color: var(--muted); font-weight: 700; }
  .slide { min-height: calc(100vh - 82px); background: var(--paper); border: 1px solid var(--line); border-radius: 10px; padding: 18px; box-shadow: 0 18px 42px rgba(15, 23, 42, 0.10); display: grid; grid-template-columns: minmax(310px, 0.86fr) minmax(0, 1.55fr); gap: 18px; overflow: visible; }
  .paper-head { min-width: 0; min-height: 0; overflow: visible; display: flex; flex-direction: column; gap: 12px; }
  .figure { margin: 0; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: #f8fafc; }
  .figure img { display: block; width: 100%; max-height: 41vh; object-fit: contain; background: white; }
  .figure figcaption { padding: 7px 10px; color: var(--muted); font-size: 12px; line-height: 1.3; }
  .head-text { display: flex; flex-direction: column; gap: 9px; min-width: 0; }
  .badges { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .badge { border-radius: 999px; padding: 5px 9px; background: #eef2ff; color: #3730a3; font-size: 12px; font-weight: 800; }
  .score { background: #fee2e2; color: #991b1b; }
  h1 { margin: 0; font-size: 25px; line-height: 1.15; letter-spacing: 0; overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
  h1 a { color: inherit; text-decoration-color: rgba(23, 107, 135, 0.35); text-decoration-thickness: 2px; text-underline-offset: 4px; }
  h1 a:hover { color: var(--accent); text-decoration-color: var(--accent); }
  .meta, .authors, .why, .abstract { font-size: 13px; line-height: 1.45; }
  .meta, .authors { color: var(--muted); }
  .why strong, .abstract strong, .authors strong { color: var(--ink); }
  .authors { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .why { border-left: 4px solid var(--accent-2); padding-left: 10px; color: #374151; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .abstract { border-top: 1px solid var(--line); padding-top: 14px; color: #374151; }
  .original-abstract { border-top: 1px solid var(--line); padding-top: 10px; color: #374151; font-size: 11.5px; line-height: 1.35; overflow-wrap: anywhere; }
  .original-abstract strong { display: block; margin-bottom: 4px; color: var(--ink); }
  .tags { display: flex; flex-wrap: wrap; gap: 8px; }
  .tag { border-radius: 999px; padding: 4px 8px; background: #f1f5f9; color: #475569; font-size: 12px; font-weight: 700; }
  .head-text > .link { display: none; }
  .briefing { min-width: 0; min-height: 0; overflow: visible; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); grid-auto-rows: minmax(0, auto); align-content: start; gap: 11px 18px; border-top: 0; padding-top: 0; }
  .brief-section { min-width: 0; }
  .brief-section.wide { grid-column: 1 / -1; }
  .brief-section h2 { margin: 0 0 4px; font-size: 14px; line-height: 1.22; color: #0f766e; letter-spacing: 0; }
  .brief-section p, .brief-section li { margin: 0; font-size: 12.5px; line-height: 1.42; color: #1f2937; overflow-wrap: anywhere; }
  .brief-section ul { margin: 0; padding-left: 20px; }
  .concepts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 9px 14px; }
  .concept { border-top: 1px solid var(--line); padding-top: 7px; }
  .concept h3 { margin: 0 0 4px; font-size: 13px; color: #7c2d12; letter-spacing: 0; }
  .concept p { margin: 2px 0 0; font-size: 11.5px; line-height: 1.35; color: #374151; overflow-wrap: anywhere; }
  .concept b { color: #111827; }
  .link { color: var(--accent); font-weight: 800; text-decoration: none; }
  .empty { padding: 48px; background: var(--paper); border: 1px solid var(--line); border-radius: 12px; color: var(--muted); }
  @media (max-width: 860px) {
    .shell { padding: 14px; }
    .topbar, .top-actions { align-items: stretch; flex-direction: column; }
    .slide, .briefing, .concepts { grid-template-columns: 1fr; }
    .slide { min-height: auto; overflow: visible; display: grid; }
    h1 { font-size: 28px; }
  }
</style>

const slides = [{"title": "Deep learning approach for ARPES and time-resolved ARPES: Gradient attention U-net for denoising and reconstruction", "journal": "PRB_Recent", "source": "keyword", "link": "http://link.aps.org/doi/10.1103/53wd-bg7k", "authors": "Gongyi Cheng, Ziyang Guo, Zhengcong Yan, et al.", "last_authors": "Shijing Tan, Bing Wang", "summary": "Data analysis in angle-resolved photoemission spectroscopy (ARPES) and time-resolved ARPES usually employs derivative-based methods, such as second derivative and maximum curvature, to enhance spectral visibility. Despite their widespread use, these methods are prone to noise amplification and the i…", "tier": "A_MUST_READ", "score": "10", "reason": "title strong match: ARPES", "tags": ["ARPES", "angle-resolvedphotoemission", "photoemission"], "image": "", "briefing": {"background": "ARPES 데이터는 측정 특성상 필연적으로 노이즈가 포함되며, 특히 tr-ARPES와 같이 시간 분해능이 필요한 경우 데이터 획득 시간이 짧아 데이터 품질(S/N 비)이 낮아지는 문제가 발생합니다.", "motivation": "기존의 2차 미분법이나 최대 곡률법(maximum curvature)은 노이즈를 과도하게 증폭시켜 분석의 정밀도를 떨어뜨리는 단점이 있어, 이를 보완할 딥러닝 기반의 효율적인 데이터 복원 기술이 필요해졌습니다.", "result": "Gradient Attention U-net이라는 신경망 모델을 도입하여 ARPES 및 tr-ARPES 데이터의 노이즈를 효과적으로 제거하고 분산 구조를 재구성했습니다.", "implication": "낮은 강도의 신호에서도 고품질의 밴드 구조 정보를 추출할 수 있게 되어, 데이터 획득 시간을 단축하거나 기존 한계 이상의 정밀한 분석이 가능해질 것입니다.", "novelty": "데이터 처리 단계에서 딥러닝(U-net)을 도입함으로써 물리적 모델링 없이도 데이터의 시각적 명료도를 극대화한 점이 핵심입니다.", "unresolved": "신경망이 노이즈 제거 과정에서 미세한 물리적 특징(small feature)을 과도하게 평활화하거나 허위 신호를 생성할 가능성에 대한 철저한 검증이 필요합니다.", "future_work": "다른 물질 시스템이나 더 복잡한 위상 구조를 가진 물질의 데이터에 대한 일반화 성능 평가 및 신경망 구조 최적화.", "concepts": [{"term": "Gradient Attention U-net", "why_emerged": "이미지의 미세한 구조(gradient) 정보를 보존하면서 노이즈를 분리하기 위해 고안됨.", "origin": "의료 영상 분야의 U-net 구조를 물리 데이터 처리에 최적화한 것.", "connections": "이미지 세그멘테이션, 컴퓨터 비전 기반 데이터 분석."}, {"term": "Maximum Curvature Method", "why_emerged": "분산 데이터의 밴드 경로를 찾기 위해 가장 보편적으로 사용되는 수학적 접근.", "origin": "ARPES 분석 기법의 표준으로 자리 잡음.", "connections": "2차 미분법, 에너지 분포 곡선(EDC) 분석."}], "english_summary": ["Introduces a Gradient Attention U-net model to denoise and reconstruct ARPES/tr-ARPES data.", "Addresses limitations of derivative-based methods which amplify noise.", "Enables high-quality spectral visibility from low S/N ratio data.", "Provides a robust deep learning tool for efficient ARPES data analysis."]}}, {"title": "Unified First-Principles Formula for Time-Resolved ARPES Spectra of Coherent and Incoherent Excitons beyond the Dilute Limit", "journal": "PRL_Recent", "source": "keyword", "link": "http://link.aps.org/doi/10.1103/zhs1-rv1k", "authors": "Gianluca Stefanucci, Enrico Perfetto", "last_authors": "Gianluca Stefanucci, Enrico Perfetto", "summary": "Despite major experimental progresses in time-resolved and angle-resolved photoemission spectroscopy, a quantitative, microscopic framework for interpreting exciton-induced modifications of electronic band structures—applicable even beyond the low-density limit—is still lacking. Here, we close this gap by introducing a unified approach that links the dynamics of coherent and incoherent excitons to distinct and experimentally observable excitonic sidebands. Our central result is a general, first-principles formula for time-resolved photoemission spectra, applicable across a broad range of temperatures, excitation densities, and pump-probe delays. This advance provides a predictive tool for quantitatively tracking excitonic dynamics in complex materials.", "tier": "A_MUST_READ", "score": "10", "reason": "title strong match: ARPES", "tags": ["ARPES", "angle-resolvedphotoemission", "photoemission", "bandstructure"], "image": "", "briefing": {"background": "빛으로 들뜬 물질 내에서 엑시톤(exciton)은 전자 구조를 급격하게 변화시키며, tr-ARPES는 이를 직접 관찰하는 핵심 도구입니다.", "motivation": "기존의 해석 모델은 저밀도 한계(dilute limit)를 가정하는 경우가 많아, 고밀도 여기 상태나 복잡한 엑시톤 동역학을 다루는 데 한계가 있었습니다.", "result": "coherent 및 incoherent 엑시톤의 동역학을 통합적으로 설명할 수 있는 제1원리 기반의 공식(formula)을 유도하였습니다.", "implication": "펌프-프로브 지연 시간이나 온도 변화에 따른 엑시톤 관련 밴드 변화를 정량적으로 예측하고 해석할 수 있는 이론적 l."}, {"term": "Multiorbital Electron Correlations", "why_emerged": "단일 밴드 모델로는 설명할 수 없는 전이금속 산화물의 복잡한 상전이를 다루기 위해 필요함.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "Hund's metal, DMFT."}], "english_summary": ["Addresses multiorbital correlations in La3Ni2O7.", "Proposes an orbital-selective correlation framework for the phase diagram.", "Provides theoretical predictions directly relevant for spectroscopic interpretations."]}}, {"title": "Pseudogap and strange metal states in the square-lattice Hubbard model: A comprehensive study", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/4kld-1x5d", "authors": "Arata Tanaka", "last_authors": "Arata Tanaka", "summary": "To clarify the origin of the pseudogap and strange metal states as well as their mutual relationship in cuprate superconductors, a comprehensive study on the spectral function, Fermi surface, resistivity, and dynamical spin susceptivity of the Hubbard model on the square lattice has been conducted b…", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Directly relevant to understanding cuprate/strongly correlated electronic structure.", "tags": ["cuprate", "superconductivity", "Hubbardmodel"], "image": "", "briefing": {"background": "구리 산화물 초전도체의 의사갭(pseudogap)과 이상 금속(strange metal) 상태는 응집물질물리학에서 수십 년간 풀리지 않은 핵심 난제입니다.", "motivation": "허바드 모델(Hubbard model)을 활용하여 의사갭과 이상 금속 상태의 기원 및 이들 간의 상관관계를 체계적으로 분석하고자 했습니다.", "result": "스펙트럼 함수, 페르미 면, 저항율 등의 데이터를 통해 의사갭 상태와 이상 금속 상태가 서로 어떻게 진화하고 연결되는지에 대한 포괄적인 그림을 제시했습니다.", "implication": "강상관 전자계에서 의사갭이 단순한 갭이 아니라 스핀 및 전하 동역학과 긴밀히 연결된 물리적 상태임을 확인하였습니다.", "novelty": "광범위한 수치적 시뮬레이션을 통해 기존 이론들 간의 충돌을 정리하고, Hubbard model 기반의 통일된 이해를 시도했다는 점이 중요합니다.", "unresolved": "계산 모델이 실제 복잡한 산화물 화합물의 모든 상호작용을 충분히 포함하지 못할 수 있다는 한계가 있습니다.", "future_work": "제시된 모델을 기반으로 한 ARPES 스펙트럼의 구체적 시뮬레이션 및 실험 데이터와의 정밀 비교가 필요합니다.", "concepts": [{"term": "Pseudogap", "why_emerged": "초전도 전이 온도 위에서 페르미 면의 일부가 사라지거나 상태 밀도가 감소하는 비정상적인 현상을 설명하기 위해 필요함.", "origin": "1980년대 후반 cuprate 발견 직후 보고됨.", "connections": "Superconducting dome, Charge density wave, Mott insulator."}, {"term": "Strange metal", "why_emerged": "상온 근처에서 저항이 온도에 선형적으로 비례하는(T-linear) 비관습적인 금속성 상태를 설명하기 위해 필요함.", "origin": "1990년대 초 cuprate 물성 연구에서 정립.", "connections": "Quantum criticality, Fermi liquid theory violation."}], "english_summary": ["Provides a comprehensive study of the pseudogap and strange metal phases.", "Utilizes the square-lattice Hubbard model to unify spectroscopic and transport data.", "Clarifies the relationship between spectral functions and strange metal resistivity."]}}, {"title": "Room-temperature two-dimensional ferromagnetism, large magnetic anisotropy, and anomalous Hall effect: From supported to freestanding monolayers GdM2 (M=Cu, Ag, Au)", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/csml-jn4q", "authors": "Jia-wan Li, Xunwu Hu, Dao-Xin Yao, Yusheng Hou", "last_authors": "Dao-Xin Yao, Yusheng Hou", "summary": "Here, the authors demonstrate that decoupling rare-earth Gd M 2 ( M =Cu, Ag, and Au) monolayers from metallic substrates transforms low-temperature supported surface alloys into room-temperature ferromagnets. Substrate removal enhances magnetic exchange interactions through charge redistribution, and eliminating structural buckling further modifies the competing exchange interactions. Freestanding GdAu 2 exhibits perpendicular magnetic anisotropy and a symmetry-tunable anomalous Hall effect, providing a platform for two-dimensional magnetic and topological spintronics.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Important experimental work on 2D magnets and AHE in monolayers.", "tags": ["monolayer", "AHE", "ferromagnetism"], "image": "", "briefing": {"background": "2차원 자성체는 스핀트로닉스 소자 구현을 위한 핵심 물질로, 퀴리 온도를 실온까지 끌어올리는 것과 기판과의 상호작용 제어가 주요 연구 과제입니다.", "motivation": "GdM2 (M=Cu, Ag, Au) 단원자층이 기판에 결합되어 있을 때 낮은 퀴리 온도를 보임에 따라, 이를 박리(freestanding)시켰을 때의 자성 특성 변화를 규명하고자 함. ecise electronic structure engineering in vdW heterostructures."]}}, {"title": "Surface-dominant transport in Weyl semimetal NbAs nanowires for next-generation interconnects", "journal": "Science", "source": "Gemini", "link": "https://www.science.org/doi/abs/10.1126/science.adx3027?af=R", "authors": "Yeryun Cheon, Mehrdad T. Kiani, Yi-Hsin Tu, et al.", "last_authors": "Ching-Tzu Chen, Judy J. Cha", "summary": "Ongoing demands for smaller and more energy-efficient electronic devices necessitate alternative interconnect materials with lower electrical resistivity at reduced dimensions. We report the synthesis of Weyl semimetal niobium arsenide (NbAs) nanowires through thermomechanical nanomolding with single crystallinity and controlled diameters down to 40 nanometers. The resistivity of NbAs nanowires decreases with decreasing diameter, and 40-nanometer-diameter nanowires exhibited a room-temperature resistivity of 10.5 ± 1.9 microhm·centimeters, which is ~70% lower than their bulk counterpart. Calculations attribute this resistivity reduction to surface-dominant conduction with a long carrier lifetime at finite temperatures. Further characterization of nanowires and bulk crystals revealed high breakdown current density, stability, and thermal conductivity. These properties highlight the potential of NbAs nanowires as next-generation interconnects that could surpass the limitations of current copper-based interconnects.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Weyl semimetal transport in a specific material, highly relevant topic for the user.", "tags": ["Weylsemimetal", "NbAs", "transport"], "image": "", "briefing": {"background": "반도체 소자의 미세화가 진행됨에 따라 구리(Cu) 기반의 기존 인터커넥트 재료는 크기가 줄어들수록 전기 저항이 급격히 증가하는 치명적인 한계에 직면해 있습니다. 이를 해결하기 위해 새로운 전도성 메커니즘을 가진 차세대 재료 탐색이 활발히 진행 중입니다.", "motivation": "Weyl 반금속인 NbAs는 위상학적 특성상 표면 상태에서의 고전도성 특성을 가질 것으로 예상됩니다. 본 연구는 NbAs 나노와이어를 제작하여 저차원에서 표면 전도성이 저항 감소에 기여할 수 있는지 확인하고자 했습니다.", "result": "지름 40nm 수준의 NbAs 나노와이어에서 벌크 reveals the coexistence of long-range order and paramagnetic spins.", "Highlights the role of chemical substitution in modulating complex magnetism in trimer-based oxides.", "Provides insights into correlated electron systems with competing magnetic interactions."]}}, {"title": "Effective long-range attraction of moiré excitons under the influence of atomic reconstructions and anisotropic screening", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/mvpg-r83h", "authors": "Nils-Erik Schütte, Carl Emil Mørch Nielsen, Niclas Götting, Alexander Steinhoff, Gabriel Bester, Christopher Gies", "last_authors": "Gabriel Bester, Christopher Gies", "summary": "The moiré pattern, which emerges due to a relative rotation between two monolayers of transition metal dichalcogenides, features a long lattice period for small twist angles. The resulting band-structure modulation acts as an effective potential for interlayer excitons, which can realize correlated many-body phenomena. Here, we aim for a material-realistic modeling of the interlayer exciton-exciton interaction, taking into account lattice reconstructions and an exciton-exciton potential that incorporates the highly anisotropic screening imposed by the two-dimensional bilayer and the dielectric background. We find strong modifications of the on-site interaction induced by the change of the moiré potential during lattice reconstructions, while for long-range interactions on the length scale of the moiré period, anisotropic dielectric screening leads to a crossover from a repulsive to an attractive interaction. The interaction potential and hopping amplitudes serve as parameters for a Bose-Hubbard model on the moiré lattice, which we use to explain the correlated behavior of interlayer excitons.", "tier": "B_IMPORTANT_CONDMAT", "score": "7", "reason": "Relevant to moiré/2D systems; good to keep up with developments in correlated vdW heterostructures.", "tags": ["moire", "correlated", "vdW
