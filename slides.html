<!DOCTYPE html>

<title>Daily Paper Slideshow</title>
<style>
  :root {
    color-scheme: light;
    --bg: #f6f7f4;
    --paper: #ffffff;
    --ink: #111827;
    --muted: #64748b;
    --line: #d8ddd2;
    --accent: #176b87;
    --accent-2: #9a3412;
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; overflow: auto; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: var(--bg); color: var(--ink); }
  .shell { max-width: 1500px; min-height: 100vh; margin: 0 auto; padding: 14px 18px; display: flex; flex-direction: column; }
  .topbar { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 16px; }
  .top-actions { display: flex; align-items: center; gap: 10px; }
  .topbar a, button { border: 1px solid var(--line); border-radius: 8px; background: var(--paper); color: var(--ink); padding: 10px 14px; font-weight: 700; text-decoration: none; cursor: pointer; }
  button.primary { background: var(--accent); border-color: var(--accent); color: white; }
  button:disabled { opacity: 0.45; cursor: not-allowed; }
  .counter { color: var(--muted); font-weight: 700; }
  .slide { min-height: calc(100vh - 82px); background: var(--paper); border: 1px solid var(--line); border-radius: 10px; padding: 18px; box-shadow: 0 18px 42px rgba(15, 23, 42, 0.10); display: grid; grid-template-columns: minmax(310px, 0.86fr) minmax(0, 1.55fr); gap: 18px; overflow: visible; }
  .paper-head { min-width: 0; min-height: 0; overflow: visible; display: flex; flex-direction: column; gap: 12px; }
  .figure { margin: 0; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: #f8fafc; }
  .figure img { display: block; width: 100%; max-height: 41vh; object-fit: contain; background: white; }
  .figure figcaption { padding: 7px 10px; color: var(--muted); font-size: 12px; line-height: 1.3; }
  .head-text { display: flex; flex-direction: column; gap: 9px; min-width: 0; }
  .badges { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .badge { border-radius: 999px; padding: 5px 9px; background: #eef2ff; color: #3730a3; font-size: 12px; font-weight: 800; }
  .score { background: #fee2e2; color: #991b1b; }
  h1 { margin: 0; font-size: 25px; line-height: 1.15; letter-spacing: 0; overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
  h1 a { color: inherit; text-decoration-color: rgba(23, 107, 135, 0.35); text-decoration-thickness: 2px; text-underline-offset: 4px; }
  h1 a:hover { color: var(--accent); text-decoration-color: var(--accent); }
  .meta, .authors, .why, .abstract { font-size: 13px; line-height: 1.45; }
  .meta, .authors { color: var(--muted); }
  .why strong, .abstract strong, .authors strong { color: var(--ink); }
  .authors { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .why { border-left: 4px solid var(--accent-2); padding-left: 10px; color: #374151; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .abstract { border-top: 1px solid var(--line); padding-top: 14px; color: #374151; }
  .original-abstract { border-top: 1px solid var(--line); padding-top: 10px; color: #374151; font-size: 11.5px; line-height: 1.35; overflow-wrap: anywhere; }
  .original-abstract strong { display: block; margin-bottom: 4px; color: var(--ink); }
  .tags { display: flex; flex-wrap: wrap; gap: 8px; }
  .tag { border-radius: 999px; padding: 4px 8px; background: #f1f5f9; color: #475569; font-size: 12px; font-weight: 700; }
  .head-text > .link { display: none; }
  .briefing { min-width: 0; min-height: 0; overflow: visible; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); grid-auto-rows: minmax(0, auto); align-content: start; gap: 11px 18px; border-top: 0; padding-top: 0; }
  .brief-section { min-width: 0; }
  .brief-section.wide { grid-column: 1 / -1; }
  .brief-section h2 { margin: 0 0 4px; font-size: 14px; line-height: 1.22; color: #0f766e; letter-spacing: 0; }
  .brief-section p, .brief-section li { margin: 0; font-size: 12.5px; line-height: 1.42; color: #1f2937; overflow-wrap: anywhere; }
  .brief-section ul { margin: 0; padding-left: 20px; }
  .concepts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 9px 14px; }
  .concept { border-top: 1px solid var(--line); padding-top: 7px; }
  .concept h3 { margin: 0 0 4px; font-size: 13px; color: #7c2d12; letter-spacing: 0; }
  .concept p { margin: 2px 0 0; font-size: 11.5px; line-height: 1.35; color: #374151; overflow-wrap: anywhere; }
  .concept b { color: #111827; }
  .link { color: var(--accent); font-weight: 800; text-decoration: none; }
  .empty { padding: 48px; background: var(--paper); border: 1px solid var(--line); border-radius: 12px; color: var(--muted); }
  @media (max-width: 860px) {
    .shell { padding: 14px; }
    .topbar, .top-actions { align-items: stretch; flex-direction: column; }
    .slide, .briefing, .concepts { grid-template-columns: 1fr; }
    .slide { min-height: auto; overflow: visible; display: grid; }
    h1 { font-size: 28px; }
  }
</style>

<script>
const slides = [{"title": "Superconducting state with broken time-reversal symmetry and collective modes in the kagome superconductors AV3Sb5 (A=K, Cs, Rb)", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/sk88-7gky", "authors": "Xinloong Han, Jun Zhan, Jiangping Hu, Fu-chun Zhang, Xianxin Wu", "last_authors": "Fu-chun Zhang, Xianxin Wu", "summary": "Author(s): Xinloong Han, Jun Zhan, Jiangping Hu, Fu-chun Zhang, and Xianxin Wu We comprehensively study the unconventional pairing and collective modes in the multiband kagome superconductors $A{\\mathrm{V}}_{3}{\\mathrm{Sb}}_{5}$ ($A=\\mathrm{K},\\mathrm{Cs},\\mathrm{Rb}$). By solving gap equations at zero temperature, we identify a transition from normal $(s++/s±)$-wave pairing t… [Phys. Rev. B 114, 024503] Published Wed Jul 01, 2026", "tier": "A_MUST_READ", "score": "10", "reason": "Direct study of unconventional superconductivity and TRSB in the user's primary kagome materials.", "tags": ["theory", "material", "kagome"], "image": "", "briefing": {"background": "카고메 격자 구조를 가진 AV3Sb5 (A=K, Rb, Cs) 물질군은 최근 응집물질 물리학에서 가장 주목받는 시스템 중 하나입니다. 이 물질들은 카고메 구조 특유의 플랫 밴드, 디락 콘, 그리고 van Hove 특이점이 공존하며, 전하 밀도파(CDW)와 초전도 현상이 얽혀 있어 비정상적인 양자 상태를 탐구하기에 이상적입니다.", "motivation": "AV3Sb5의 초전도 상태가 대칭성을 깨뜨리는 방식, 특히 시간 반전 대칭성(TRSB)을 깨는지 여부와 그에 따른 집단 모드(collective modes)의 성질을 규명하여 이 물질의 비전통적 초전도 기작을 이해하고자 합니다.", "result": "이론적 계산을 통해 일반적인 (s++/s±) 파동 초전도 상태에서 시간 반전 대칭성이 깨진 s+id 파동 상태로의 전이를 확인했습니다. 또한, 멀티밴드 특성으로 인해 발생하는 Leggett 모드와 Higgs 모드와 같은 집단 밴드 여기 현상을 분석하여 실험적으로 관찰 가능한 지표를 제시했습니다.", "implication": "만약 AV3Sb5에서 s+id 파동 초전도가 확립된다면, 이는 카고메 금속이 단순한 초전도체가 아니라 위상학적으로 비자명한 성질을 가진 물질임을 입증하며, 루프 전류나 비정상적인 홀 효과와의 연관성을 설명하는 핵심 단서가 될 것입니다.", "novelty": "사용자의 주요 관심사인 AV3Sb5 계열에서 TRSB 초전도 가능성을 다성분 변수와 집단 모드 관점에서 포괄적으로 다루었습니다. 특히 초전도 갭의 대칭성 변화에 따른 물리적 응답을 예측한 점이 중요합니다.", "unresolved": "이론적 예측인 s+id 상태가 실제 실험(예: 뮤온 스핀 회전, 초정밀 ARPES 등)에서 나타나는 TRSB 신호와 정량적으로 일치하는지, 그리고 CDW와의 경쟁/공존 관계가 초전도 대칭성에 미치는 영향이 완전히 해소되지 않았습니다.", "future_work": "실험적으로 집단 모드를 관측하기 위한 테라헤르츠 분광학이나 라만 산란 실험이 이어질 것으로 보이며, 다양한 도핑이나 압력 하에서의 위상 변화 연구가 기대됩니다.", "concepts": [{"term": "Kagome Superconductor", "why_emerged": "카고메 격자에서 나타나는 강한 전자 상관관계와 위상적 특성이 결합된 초전도를 연구하기 위해 정의됨.", "origin": "AV3Sb5 계열의 발견(2019-2020년경 Stephen Wilson 그룹 등)으로 본격화됨.", "connections": "Frustrated magnetism, Flat band physics, CDW"}, {"term": "Time-Reversal Symmetry Breaking (TRSB)", "why_emerged": "초전도체 내에서 자발적인 자기장이 발생하거나 위상 차이가 생기는 비전통적 초전도를 구분하기 위해 필요함.", "origin": "초록 정보만으로는 특정하기 어려움 (BCS 이론 이후 비전통적 초전도 연구에서 확립됨)", "connections": "Chiral superconductivity, Muon Spin Relaxation (muSR), Loop currents"}, {"term": "Collective Modes (Higgs/Leggett)", "why_emerged": "초전도 질서 매개변수의 진동(Higgs)이나 밴드 간 위상 진동(Leggett)을 통해 초전도 상태의 대칭성을 파악하기 위해 사용됨.", "origin": "P. W. Higgs(1964) 및 A. J. Leggett(1966)", "connections": "Multiband superconductivity, Raman spectroscopy"}], "english_summary": ["The study identifies a transition to a time-reversal symmetry-breaking s+id-wave superconducting state in kagome AV3Sb5.", "Comprehensive analysis of collective modes, such as Higgs and Leggett modes, provides experimental signatures for the pairing symmetry.", "The multiband nature of the kagome lattice plays a critical role in stabilizing unconventional superconducting orders.", "The findings link electronic correlations with topological phenomena in the AV3Sb5 family."]}}, {"title": "Direct Visualization of Gate-Tunable Flat Bands in Twisted Double Bilayer Graphene", "journal": "PRL_Recent", "source": "author whitelist", "link": "http://link.aps.org/doi/10.1103/3vg5-vkzy", "authors": "Souvik Sasmal, Ryan Muzzio, Ahmed Khalifa, et al.", "last_authors": "Shubhayu Chatterjee, Jyoti Katoch", "summary": "Author(s): Souvik Sasmal, Ryan Muzzio, Ahmed Khalifa, Paulina Majchrzak, Alfred J. H. Jones, I-Hsuan Kao, Kenji Watanabe, Takashi Taniguchi, Simranjeet Singh, Eli Rotenberg, Aaron Bostwick, Chris Jozwiak, Søren Ulstrup, Shubhayu Chatterjee, and Jyoti Katoch The evolution of moiré minibands under varying carrier density and displacement field may be directly visualized using microfocused angle-resolved photoemission spectroscopy. [Phys. Rev. Lett. 137, 016402] Published Tue Jun 30, 2026", "tier": "A_MUST_READ", "score": "10", "reason": "author whitelist: Eli Rotenberg", "tags": ["angle-resolvedphotoemission", "photoemission", "graphene", "moir", "twisted", "flatband"], "image": "", "briefing": {"background": "트위스트 이차원 물질(Moire system)은 두 층 사이의 각도를 조절하여 전자의 유효 질량이 무한대가 되는 '플랫 밴드'를 형성할 수 있습니다. 이는 강상관 물리 현상을 연구하는 최적의 플랫폼입니다.", "motivation": "트위스트 이중 이층 그래핀(TDBG)에서 게이트 전압과 수직 전기장(displacement field)에 의해 플랫 밴드가 어떻게 변하는지 실제 운동량 공간에서 직접 시각화하는 것이 목표입니다.", "result": "마이크로 포커스 ARPES(micro-ARPES)를 사용하여 TDBG의 모아레 미니밴드 구조를 직접 관찰했습니다. 전하 밀도와 변위장에 따라 밴드 구조가 실시간으로 재구성되는 과정을 시각화하는 데 성공했습니다.", "implication": "이론적으로만 예측되었던 게이트 조절 가능 플랫 밴드를 직접 실험으로 증명함으로써, TDBG에서 나타나는 절연체 상태나 초전도 유사 현상의 물리적 기원을 더 정확하게 이해할 수 있게 되었습니다.", "novelty": "Eli Rotenberg 등 ARPES 전문가 그룹이 참여한 연구로, 극소 부위의 전자 구조를 측정하는 micro-ARPES 기술을 트위스트 소자에 적용하여 나노 스케일의 밴드 제어를 직접 확인했다는 점이 독보적입니다.", "unresolved": "플랫 밴드 내에서의 전자-전자 산란 효과가 ARPES 스펙트럼의 선폭(linewidth)에 미치는 구체적인 영향이나, 상관 관계가 강해질 때의 밴드 갭 형성 기작은 추가 연구가 필요합니다.", "future_work": "더 낮은 온도에서의 측정이나, 다른 트위스트 각도를 가진 소자에서의 밴드 진화 연구, 그리고 상관 상태(correlated states) 진입 시의 전자 구조 변화 측정이 기대됩니다.", "concepts": [{"term": "Twisted Double Bilayer Graphene (TDBG)", "why_emerged": "단층 그래핀보다 더 복잡한 대칭성과 전기장 조절 기능을 부여하기 위해 고안됨.", "origin": "초록 정보만으로는 특정하기 어려움 (2019년경 MIT 등 여러 그룹에서 동시 다발적 연구)", "connections": "Flat bands, Correlated insulators, Quantum valley Hall effect"}, {"term": "micro-ARPES", "why_emerged": "수 마이크로미터 크기의 작은 모아레 소자나 불균일한 시료의 국소 전자 구조를 측정하기 위해 개발됨.", "origin": "Advanced Light Source (ALS) 등 방사광 가속기 시설", "connections": "Nano-ARPES, Scanning tunneling spectroscopy (STS)"}, {"term": "Displacement Field", "why_emerged": "이층 구조 시료에서 층간 전위차를 유도하여 밴드 갭이나 위상적 특성을 제어하기 위해 사용됨.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "Gate-tunability, Bandgap engineering"}], "english_summary": ["Direct visualization of moire minibands in TDBG using micro-focused ARPES.", "Demonstration of gate-tunable flat bands under varying carrier density and displacement fields.", "The study confirms the high degree of control over electronic states in twisted graphene heterostructures.", "Provides a fundamental experimental basis for understanding correlated phases in TDBG."]}}, {"title": "Erratum: Long-lived coherence between incoherent excitons revealed by time-resolved angle-resolved photoemission spectroscopy: An exact solution [Phys. Rev. B 111, 235124 (2025)]", "journal": "PRB_Recent", "source": "keyword", "link": "http://link.aps.org/doi/10.1103/lsxs-hqns", "authors": "Zhenlin Zhang, Wei Hu, Enrico Perfetto, Gianluca Stefanucci", "last_authors": "Enrico Perfetto, Gianluca Stefanucci", "summary": "Author(s): Zhenlin Zhang, Wei Hu, Enrico Perfetto, and Gianluca Stefanucci [Phys. Rev. B 113, 239904] Published Wed Jun 24, 2026", "tier": "A_MUST_READ", "score": "9", "reason": "title strong match: angle-resolved photoemission", "tags": ["angle-resolvedphotoemission", "photoemission"], "image": "", "briefing": {"background": "시간 분해 광전자 분광법(TR-ARPES)은 빛에 의해 들뜬 전자 상태(엑시톤 등)의 동역학을 실시간으로 관찰하는 강력한 도구입니다. 엑시톤 간의 결맞음(coherence)은 양자 정보 및 광전 소자 응용에서 매우 중요합니다.", "motivation": "2025년에 발표된 기존 논문 '비결맞음 엑시톤 사이의 장기 생존 결맞음'에 관한 수치적 또는 수식적 오류를 바로잡기 위함입니다.", "result": "비결맞음 엑시톤들 사이에서 나타나는 결맞음 현상에 대한 '엄밀해(Exact solution)'의 오류를 수정하여 보고했습니다.", "implication": "이론적 모델의 정확성을 확보함으로써, TR-ARPES 실험 데이터를 해석할 때 엑시톤 수명과 결맞음 시간을 오인하지 않도록 해줍니다.", "novelty": "TR-ARPES 데이터 해석의 이론적 기반을 견고히 하는 정정 보도입니다. 비평형 상태의 다체 물리 계산에서 정확한 해를 제공하는 것은 해당 분야의 신뢰성에 필수적입니다.", "unresolved": "에라툼의 특성상 새로운 물리적 의문보다는 기존 계산의 수정에 집중되어 있습니다.", "future_work": "수정된 엄밀해를 바탕으로 실제 반도체나 2D 물질에서의 엑시톤 결맞음 실험 데이터를 재해석하는 작업이 필요할 수 있습니다.", "concepts": [{"term": "Time-resolved ARPES (TR-ARPES)", "why_emerged": "평형 상태를 넘어선 전자의 여기 상태와 이완 과정을 직접 관찰하기 위해 등장함.", "origin": "초록 정보만으로는 특정하기 어려움 (1990년대 이후 레이저 기술 생하는 이 현상을 통해 CrSb가 운동량에 의존하는 스핀 분할 밴드 구조를 가지고 있음을 실험적으로 뒷받침하는 증거를 제시했습니다.", "implication": "이번 연구 결과는 CrSb가 이론적 예측대로 알터마그네틱 성질을 보유하고 있음을 보여주며, 이는 순수 자기 모멘트가 없는 물질에서도 강한 스핀 전류를 생성하거나 제어할 수 있는 가능성을 확인한 것입니다.", "novelty": "알터마그네티즘의 핵심인 k-dependent spin polarization을 안드레예프 반사라는 수송 현상적 도구로 입증한 것이 참신하며, 이는 독자의 주요 관심사인 ARPES를 통한 전자 구조 분석과 상호 보완적인 매우 중요한 데이터입니다.", "unresolved": "안드레예프 반사는 계면의 상태에 민감하므로, 실제 벌크 내부의 스핀 분할 정도와 계면에서의 특성 차이에 대한 추가적인 정밀 분석이 필요할 수 있습니다.", "future_work": "CrSb의 특정 결정 방향에 따른 스핀 분할의 이방성을 더 상세히 측정하고, 이를 활용한 스핀 토크 소자 등의 응용 연구가 이어질 것으로 예상됩니다.", "concepts": [{"term": "알터마그네티즘 (Altermagnetism)", "why_emerged": "반강자성체처럼 자화량은 없으면서 강자성체처럼 스핀 분할이 일어나는 물리적 특성을 설명하기 위해 등장했습니다.", "origin": "최근 Libor Šmejkal 등에 의해 이론적으로 정립됨", "connections": "강자성, 반강자성, 비정상 홀 효과(AHE)"}, {"term": "안드레예프 반사 (Andreev Reflection)", "why_emerged": "금속/초전도체 계면에서 전하가 전달될 때 스핀 편극도를 측정하는 수단으로 사용됩니다.", "origin": "Alexander F. Andreev (1964)", "connections": "쿠퍼 쌍, 근접 효과(Proximity effect), 스핀 편극"}, {"term": "CrSb (크롬 안티모니)", "why_emerged": "고온에서 안정적인 자성 구조를 가지며 알터마그네티즘을 연구하기에 적합한 대칭성을 가졌기 때문입니다.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "NiAs형 구조, 알터마그네틱 후보 물질"}, {"term": "스핀 편극 (Spin Polarization)", "why_emerged": "전하 흐름에서 특정 스핀 방향이 우세한 정도를 정량화하여 스핀트로닉스 성능을 평가하기 위해 필요합니다.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "스핀 주입, 거대 자기저항(GMR)"}], "english_summary": ["This study probes the momentum-dependent spin polarization in the altermagnetic candidate CrSb using Andreev reflection spectroscopy.", "The experimental results provide evidence for the existence of spin-splitted band structures despite zero net magnetization.", "The findings confirm the potential of CrSb for high-efficiency spin current generation in spintronic applications.", "It bridges the gap between theoretical predictions of altermagnetism and transport-based experimental verification."]}}, {"title": "Direct Observation of Sublattice-Dependent Magnetic Ordering and Strong Electron-Magnon Coupling in Fe5GeTe2", "jour "특정 초전도체 시스템에서 양자 소용돌이 핵의 분획화 현상과 이로 인한 스커미온 형성을 실험적으로 관측하는 데 성공했습니다.", "implication": "초전도성과 위상 자성 구조가 결합된 새로운 양자 상태를 확인한 것으로, 이는 위상 양자 컴퓨팅이나 새로운 형태의 자속 소자 개발에 중요한 기초가 됩니다.", "novelty": "Hong Ding 교수 등 저명한 연구진이 참여한 연구로, 초전도체 내 위상 결함의 내부 구조를 고해상도로 밝혀냈다는 점에서 매우 높은 가치를 지닙니다. 사용자의 관심사인 마요라나 물리나 비관습적 초전도체와도 접점이 큽니다.", "unresolved": "이러한 현상이 나타나는 구체적인 물질적 조건(대칭성 파괴의 종류 등)과 스커미온의 안정성에 대한 추가 연구가 필요합니다.", "future_work": "다양한 외부 자기장 및 온도 조건에서의 스커미온 상도표 작성과 STS(주사 터널링 분광법)를 이용한 국소 전자 구조 정밀 측정이 이어질 것으로 보입니다.", "concepts": [{"term": "Vortex Core Fractionalization", "why_emerged": "표준적인 초전도 현상을 넘어서는 위상학적 여기 상태를 설명하기 위해 도입되었습니다.", "origin": "초록 정보만으로는 특정하기 어려움 (이론적으로는 70-80년대부터 논의됨)", "connections": "Skyrmion, Multicomponent Superconductors, Fractional Quantum Hall Effect."}, {"term": "Skyrmion (스커미온)", "why_emerged": "입자처럼 행동하는 소용돌이 형태의 안정적인 위상 구조를 설명하기 위해 등장했습니다.", "origin": "Tony Skyrme (입자물리학 모델)", "connections": "위상 자성체, 스핀트로닉스, 초전도 소용돌이 동역학."}], "english_summary": ["Direct observation of quantum vortex core fractionalization in a superconducting system.", "Reporting the formation of skyrmion-like topological structures within the vortex lattice.", "Authored by key figures (Hong Ding) in electronic structure and superconductivity research.", "Opens new avenues for braiding topological excitations in superconductors."]}}, {"title": "Realization of strongly correlated 2D honeycomb boron", "journal": "Science_Advances", "source": "author whitelist", "link": "https://www.science.org/doi/abs/10.1126/sciadv.aee3116?af=R", "authors": "Takemi Kato, Tomonori Nakamura, Kosuke Nakayama, et al.", "last_authors": "Yoshinori Okada, Takafumi Sato", "summary": "Science Advances, Volume 12, Issue 27, July 2026.", "tier": "A_MUST_READ", "score": "9", "reason": "author whitelist: Takafumi Sato", "tags": ["correlated"], "image": "", "briefing": {"background": "붕소(Boron)는 탄소처럼 다양한 2D 구조(보로핀)를 형성할 수 있지만, 탄소의 그래핀처럼 안정적인 벌집 격자(Honeycomb lattice)를 구현하면서 동시에 강한 전자 상관관계(Strong correlation)를 갖게 하는 것은 어 Eric D. Bauer, et al.", "last_authors": "Gertrud Zwicknagl, Andrea Severing", "summary": "Author(s): Martin Sundermann, Joe D. Thompson, Eric D. Bauer, Chun-Fu Chang, Sheng-Huai Chen, Chang-Yang Kuo, Liu Hao Tjeng, Gertrud Zwicknagl, and Andrea Severing The nature of cerium’s 4 f electron is key to understanding the mechanism of pressure-induced quantum criticality in the heavy-fermion ferromagnet CeRh 6 Ge 4 . Combining core-level photoemission and polarized x-ray absorption spectroscopy with simulations based on the single-impurity Anderson model, the authors demonstrate here that Kondo hybridization admixes higher-lying crystal field states into a multiorbital ground state with a 4 f occupancy n f ~ 0.9, which also accounts for the dynamical spin response. The results establish the importance of Kondo hybridization and the resulting multiorbital ground state as essential components for a model of quantum criticality. [Phys. Rev. B 113, 245149] Published Mon Jun 29, 2026", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Core-level photoemission study of Kondo hybridization in a heavy-fermion ferromagnet.", "tags": ["photoemission", "CeRh6Ge4", "heavyfermion"], "image": "", "briefing": {"background": "CeRh6Ge4는 강자성체임에도 불구하고 압력을 가하면 초전도성이 나타나거나 양자 임계 현상을 보이는 독특한 헤비 페르미온 물질로, 세륨(Ce) 4f 전자의 역할이 핵심입니다.", "motivation": "이 물질의 압력 유도 양자 임계성(quantum criticality)의 근본 원인인 4f 전자의 Kondo 혼성화 특성과 다중 궤도(multiorbital) 기반의 기저 상태를 규명하고자 했습니다.", "result": "광전자 분광법(photoemission)과 X선 흡수 분광법을 통해 4f 전자 점유율이 약 0.9임을 확인하고, Kondo 혼성화가 높은 에너지의 결정장 상태를 기저 상태에 혼합시킨다는 것을 입증했습니다.", "implication": "강자성 양자 임계 물질에서 Kondo 혼성화가 양자 임계성을 형성하는 핵심 메커니즘임을 명확히 함으로써, 유사한 헤비 페르미온 계의 이론 모델링에 필수적인 기초를 제공합니다.", "novelty": "CeRh6Ge4의 4f 전자 상태를 다중 궤도 관점에서 상세히 분석하여, 양자 임계 현상을 다룰 때 단일 궤도 모델이 아닌 Kondo 혼성화와 다중 궤도 효과를 반드시 고려해야 함을 보였습니다.", "unresolved": "4f 전자들의 동적 스핀 응답과 관련된 미세한 상관관계가 양자 임계점 근처의 초전도성 발현과 어떻게 구체적으로 연결되는지는 여전히 상세 연구가 필요합니다.", "future_work": "압력 변화에 따른 전자 구조 변화를 관측하기 위한 고압 하에서의 RIXS나 ARPES 측정 등이
