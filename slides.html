시킬 수 있습니다.", "motivation": "NdZnAl11O19 물질 내 위치적 무질서(positional disorder)가 자기적 성질 및 고립된 스핀(orphan spins)의 동역학에 미치는 영향을 이해하고자 합니다.", "result": "비탄성 중성자 산란을 통해 결정 전기장(CEF) 여기를 관측하고, ac 자화율 측정을 통해 고립된 스핀에 의한 자기장 유도 완화 현상을 확인했습니다.", "implication": "무질서가 단순한 산란원이 아닌, 고립된 스핀을 통한 새로운 자기적 완화 채널을 형성할 수 있음을 보여줍니다.", "novelty": "중성자 산란과 ac 자화율을 결합하여 frustrated magnet에서 무질서의 역할을 규명한 점이 돋보이며, 이는 귀하의 자성 물질 연구 범위에 포함됩니다.", "unresolved": "고립된 스핀과 매트릭스 스핀 사이의 미시적인 상호작용 강도는 아직 명확하지 않습니다.", "future_work": "다른 무질서도가 도입된 frustrated 시스템에서의 유사한 동역학 추적 실험이 요구됩니다.", "concepts": [{"term": "고립된 스핀 (Orphan spins)", "why_emerged": "무질서로 인해 자기적 네트워크에서 결합되지 못한 개별 스핀 상태를 설명하기 위해 도입되었습니다.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "좌절된 자성체, 스핀 동역학, 자기장 유도 완화"}, {"term": "결정 전기장 (CEF)", "why_emerged": "결정 내 이온 주변의 국소적 대칭성이 전자 궤도 상태를 분리하는 현상을 설명하기 위해 필수적입니다.", "origin": "Hans Bethe(1929)", "connections": "희토류 자성, 중성자 분광학"}], "english_summary": ["Investigation of positional disorder in NdZnAl11O19 using neutron scattering.", "Evidence of field-induced spin relaxation associated with orphan spins.", "Links CEF excitations to magnetic relaxation behavior in frustrated systems.", "Highlights the role of disorder in modulating magnetic ground states."]}}, {"title": "Strain-gradient tuning of linear photogalvanic effect in monolayer 2H−WTe2", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/k4zr-zxzl", "authors": "Jia Liu, Pei-Xu Cao, Yue Wang, et al.", "last_authors": "Ming Yang, Wu-Ming Liu", "summary": "By combining density-functional theory, nonequilibrium Green's function transport calculations, and ab initio molecular dynamics (AIMD) simulations, we investigate the linear photogalvanic effect (LPGE) of monolayer $2H\\text{−}{\\mathrm{WTe}}_{2}$ under two strain-gradient schemes: in-plane lattice g…", "tier": "B_IMPORTANT_CONDMAT", "score": "7", "reason": "Study of WTe2 monolayer electronic properties via DFT and transport is relevant.", "tags": ["WTe2", "monolayer", "transport"], "image": "", "briefing": {"background": "WTe2와 같은 전이금속 디칼코게나이드(TMD) 단층은 고유한 비중심대칭성으로 인해 강한 비선형 광전 효과를 보일 수 있습니다.", "motivation": "단층 2H-WTe2에 가해지는 변형(strain) 구배가 선형 광전 효과(LPGE)를 어떻게 제어하고 튜닝할 수 있는지 이론적으로 조사하고자 합니다.", "result": "DFT 및 비평형 그린 함수 계산을 통해 변형 구배가 LPGE의 크기와 방향을 제어할 수 있음을 확인했습니다.", "implication": "변형 공학을 통해 위상 물질의 광전 소자 성능을 최적화할 수 있는 이론적 근거를 제공합니다.", "novelty": "WTe2에 특화된 다중 스케일 계산 접근법을 통해 변형이 광전 특성에 미치는 정량적 효과를 제시하여 귀하의 2D 재료 관련 관심사와 부합합니다.", "unresolved": "실제 실험적 구현 시 가해지는 변형 구배의 균일성과 고정밀 측정 여부가 관건입니다.", "future_work": "실제 단층 WTe2 소자에서의 굴곡 및 변형 하에서의 광응답 측정 실험이 필요합니다.", "concepts": [{"term": "선형 광전 효과 (LPGE)", "why_emerged": "비중심대칭 결정에서 빛의 편광에 따라 전류가 유도되는 비선형 응답을 설명하기 위해 필요합니다.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "위상 반금속, Berry curvature, 광전자 소자"}, {"term": "비평형 그린 함수 (NEGF)", "why_emerged": "전압이 인가된 나노 소자에서의 양자 수송 현상을 계산하기 위해 필수적인 기법입니다.", "origin": "Meir, Wingreen(1992)", "connections": "DFT 계산, 나노 전자 소자 시뮬레이션"}], "english_summary": ["Theoretical study of LPGE in monolayer 2H-WTe2 under strain gradients.", "Utilizes DFT and NEGF transport calculations.", "Demonstrates the tunability of photoelectric response via strain engineering.", "Suggests pathway for high-performance topological photoelectric devices."]}}, {"title": "Strain-induced magnetic phase transitions and anomalous transport phenomena in RuO2 and MnF2", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/x9ng-pz7c", "authors": "Xiuxian Yang, Zhangqi Wu, Xiangju Wang, et al.", "last_authors": "Wanxiang Feng, Yinwei Li", "summary": "a fertile platform for spintronics. Using a general tight-binding model and first-principles calculations, we show that strain engineering provides a simple route to control magnetic phase transitions and activate transver…", "tier": "B_IMPORTANT_CONDMAT", "score": "7", "reason": "Study of magnetic phase transitions in relevant materials with anomalous transport.", "tags": ["material", "transport", "magnetism"], "image": "", "briefing": {"background": "RuO2와 같은 반강자성체는 스핀트로닉스 소자 구현을 위한 차세대 소재로 주목받고 있습니다. 특히 최근에는 교류 자기적 성질을 갖는 '알터자성(altermagnetism)' 개념이 대두되면서, 이들의 자기적 상태를 외부 자극으로 제어하려는 시도가 활발합니다.", "motivation": "변형(strain) 공학을 통해 RuO2와 MnF2 같은 물질의 자기적 위상을 제어하고, 이로 인해 유도되는 비정상 수송 현상을 이론적으로 규명하고자 합니다.", "result": "타이트 바인딩 모델 및 제일원리 계산을 통해, 결정 격자에 가해지는 변형이 자기적 위상 전이를 유발하고 횡방향 수송 현상을 활성화할 수 있음을 보였습니다.", "implication": "자기적 위상을 전기적/기계적 방법으로 가역적으로 조절함으로써, 차세대 스핀-궤도 토크 소자나 비정상 홀 효과 기반의 소자 설계에 기여할 수 있습니다.", "novelty": "외부 변형을 통해 복잡한 자기 구조를 효과적으로 제어하는 경로를 제시했으며, 알터자성 및 위상학적 물리 현상에 관심이 많은 독자에게 관련 소자 응용 가능성을 제공합니다.", "unresolved": "이론적 계산 위주로 진행되었으므로, 실제 박막이나 단결정 샘플에서 균일한 변형을 인가하여 실험적으로 구현하는 과정에서의 정밀한 제어 여부가 숙제로 남습니다.", "future_work": "실제 실험적 변형 인가 장치를 통한 수송 특성 측정 및 고온 환경에서의 자기적 위상 안정성 연구가 기대됩니다.", "concepts": [{"term": "알터자성 (Altermagnetism)", "why_emerged": "기존 반강자성체와 강자성체의 범주를 넘어, 자화는 0이지만 스핀 분리된 밴드 구조를 갖는 새로운 자기 상태를 설명하기 위해 제안됨.", "origin": "최근 2020년대 초반, 일련의 이론 물리학자 그룹에 의해 정립됨.", "connections": "반강자성 스핀트로닉스, 비정상 홀 효과, 스핀 분리 밴드 구조."}, {"term": "변형 공학 (Strain Engineering)", "why_emerged": "박막이나 반데르발스 이종접합에서 격자 상수를 미세하게 조절하여 물리적 성질을 튜닝하기 위해 필요함.", "origin": "반도체 이종접합 연구에서 기원함.", "connections": "밴드갭 제어, 위상 전이, 초전도 임계온도 조절."}], "english_summary": ["Explores strain-induced magnetic phase transitions in RuO2 and MnF2.", "Uses first-principles calculations to model transveral transport phenomena.", "Proposes strain engineering as a route to control altermagnetic-like properties.", "Suggests implications for tunable spintronic device applications."]}}, {"title": "Two-dimensional superconductivity in layered-structure single-crystalline LO0.5F0.5BiS2 (L=La, Ce, Pr)", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/34rp-qtld", "authors": "Ying Wang, Changsheng Chen, Johan Chang, Lei Shu", "last_authors": "Johan Chang, Lei Shu", "summary": "The series of layered superconductors $L(\\mathrm{O}, \\mathrm{F}){\\mathrm{BiS}}_{2}$ $(\\mathrm{L}=\\mathrm{La}, \\mathrm{Ce}, \\mathrm{Pr}, \\mathrm{Nd})$, with alternating stacking $L(\\mathrm{O}, \\mathrm{F})$ and superconducting ${\\mathrm{BiS}}_{2}$ bilayers, has attracted much attention since their dis…", "tier": "B_IMPORTANT_CONDMAT", "score": "7", "reason": "Layered superconductor research fits into broader interest in unconventional superconducting systems.", "tags": ["material", "superconductivity"], "image": "", "briefing": {"background": "BiS2 기반 초전도체는 독특한 층상 구조와 밴드 구조를 가지며, 비전통적 초전도체 연구의 중요한 플랫폼 중 하나입니다. 특히 희토류 원소 L을 포함한 시스템은 구조적 이방성으로 인해 2차원적 초전도 현상이 관찰됩니다.", "motivation": "L(O,F)BiS2 시스템에서 화학적 도핑과 이종 구조가 초전도 특성에 미치는 영향을 단결정 수준에서 명확히 밝히고자 합니다.", "result": "단결정 샘플 성장을 통해 해당 물질 계열에서 나타나는 2차원적 초전도 전이와 그 이방성 전기적 특성을 확인했습니다.", "implication": "이러한 층상 구조 물질은 초전도와 자기적 질서의 공존이나 위상학적 상태 연구에 유리하여, 비전통적 초전도 기작을 연구하는 실험 물리학자들에게 중요한 소재 후보를 제공합니다.", "novelty": "단결정 성장을 통해 다결정 샘플에서 나타날 수 있는 불순물 효과를 배제하고 고유한 2차원 초전도 특성을 직접적으로 규명했습니다.", "unresolved": "초전도 전이 온도(Tc)를 높이기 위한 도핑 농도의 최적화와 정확한 페르미 표면의 특성(ARPES 데이터 등과의 연계)이 아직 충분히 논의되지 않았습니다.", "future_work": "ARPES를 이용한 전자 구조 매핑과 초전도 갭의 대칭성 결정 실험이 필요합니다.", "concepts": [{"term": "BiS2 층상 초전도체", "why_emerged": "철계 초전도체 이후 유사한 층상 구조를 가진 신규 초전도체 탐색의 일환으로 발견됨.", "origin": "2012년경 Bi4O4S3 발견으로 주목받음.", "connections": "철계 초전도체, 층상 구조, 비전통적 초전도."}], "english_summary": ["Presents growth and characterization of single-crystalline L(O,F)BiS2.", "Identifies 2D superconductivity in the BiS2 bilayer system.", "Analyzes structural anisotropy of layered superconductors.", "Provides foundational data for further unconventional superconductivity research."]}}, {"title": "Asymmetric and Scalable Electronic Hysteresis Induced by Ratchetlike Charge Injections in van der Waals Heterostructures", "journal": "PRL_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/vg1s-h4x6", "authors": "Linshang Chen, Rui Mei, Heng Wu, et al.", "last_authors": "Kostya S. Novoselov, Yanmeng Shi", "summary": "in intrinsically nonpolar graphene/hexagonal boron nitride (hBN) heterostructures and widely exploited to realize electrically switchable superconductivity, correlated insulators, and neuromorphic functionalities. The origi…", "tier": "B_IMPORTANT_CONDMAT", "score": "7", "reason": "Van der Waals heterostructure study with implications for correlated electronic phases.", "tags": ["graphene", "heterostructures", "transport"], "image": "", "briefing": {"background": "반데르발스 이종접합(vdW heterostructures)은 그래핀과 hBN 등의 조합을 통해 새로운 전자적 위상을 구현하는 연구 분야입니다. 특히 이러한 구조에서의 히스테리시스 현상은 소자 응용뿐만 아니라 강상관계 물리학의 국소적 상태를 이해하는 데 핵심적입니다.", "motivation": "비극성(nonpolar) 이종접합 구조에서 발생하는 독특한 전하 주입 기반의 비대칭적 히스테리시스가 어떤 물리적 기원을 갖는지 규명하고자 합니다.", "result": "Ratchet-like 전하 주입 메커니즘이 이종접합 내의 전하 분포를 불균일하게 만들고, 이것이 확장 가능한 전자적 히스테리시스를 생성함을 밝혔습니다.", "implication": "이 효과는 차세대 뉴로모픽 컴퓨팅 소자나 전기적으로 제어 가능한 상관계 위상 소자의 구현에 응용될 수 있습니다.", "novelty": "반데르발스 물질에서 나타나는 비선형적 전하 이력을 물리적 모델로 체계화했으며, 이는 비평형 상태의 전자 수송을 이해하는 데 중요한 통찰을 줍니다.", "unresolved": "주입된 전하가 실제 격자나 전자 상태에 미치는 미시적인 구조적 변형의 영향은 여전히 논의의 여지가 있습니다.", "future_work": "STM/STS를 이용한 이종접합 내부의 전하 분포 국소화 이미징 및 동역학적 특성 측정.", "concepts": [{"term": "반데르발스 이종접합", "why_emerged": "서로 다른 2차원 물질을 원자 단위로 적층하여 새로운 물성을 창출하기 위해 개발됨.", "origin": "안드레 가임, 콘스탄틴 노보셀로프 팀의 그래핀 연구에서 출발.", "connections": "모아레 격자, 강상관계, 전자 소자."}, {"term": "뉴로모픽 기능", "why_emerged": "기존 폰 노이만 구조의 한계를 극복하기 위해 생물학적 신경망의 시냅스 동작을 모사하는 전자 소자의 필요성 증대.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "비휘발성 메모리, 히스테리시스, 멤리스터."}], "english_summary": ["Investigates asymmetric electronic hysteresis in vdW heterostructures.", "Identifies ratchet-like charge injection as the underlying mechanism.", "Discusses scalability and relevance to neuromorphic functionalities.", "Offers insights into non-equilibrium transport in graphene/hBN systems."]}}, {"title": "Electrically Switchable Bright-Dark Excitons in Ferrovalley Bilayers", "journal": "PRL_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/l34q-m644", "authors": "Yun-Xi Qi (戚云西), Jun-Ding Zheng (郑君鼎), Song-Chuan Zhou (周嵩川), et al.", "last_authors": "Wen-Yi Tong (童文旖), Chun-Gang Duan (段纯刚)", "summary": "The realization of exciton-based quantum memories is fundamentally hindered by the trade-off between optical accessibility in bright states and long coherence lifetimes in dark states. While interlayer excitons offer promising lifetimes, their optical selection rules are typically locked by crystal …", "tier": "B_IMPORTANT_CONDMAT", "score": "7", "reason": "Relevant study on ferrovalley physics in bilayer systems.", "tags": ["valleytronics", "2Dmaterials"], "image": "", "briefing": {"background": "밸리트로닉스(valleytronics)는 전자의 밸리 자유도를 정보 운반체로 활용하여 차세대 소자를 구현하려는 연구 분야입니다. 광학적으로 활성인 bright exciton은 상태 읽기가 용이하나 수명이 짧고, dark exciton은 긴 수명을 갖지만 상태를 읽기 어렵다는 상충 관계가 실용화의 걸림돌이었습니다.", "motivation": "이 논문은 2층 구조(bilayer) 페로밸리(ferrovalley) 시스템에서 외부 전기장을 통해 bright 상태와 dark 상태 사이를 효율적으로 스위칭할 수 있는 메커니즘을 탐구하고자 합니다.", "result": "대칭성 조절을 통해 밸리 편극된 bright/dark 엑시톤을 전기적으로 제어할 수 있음을 제시하며, 밸리 자유도와 광학적 특성 사이의 결합을 능동적으로 바꿀 수 있는 플랫폼을 제안했습니다.", "implication": "엑시톤 기반의 양자 메모리 및 정보 처리 소자 개발에 있어 긴 수명과 높은 가독성을 동시에 확보할 수 있는 새로운 설계 원리를 제공합니다.", "novelty": "외부 전기장만으로 엑시톤의 광학적 선택 규칙을 능동적으로 변경하여 밸리 기반 양자 정보의 저장과 인출을 용이하게 만든 점이 핵심입니다.", "unresolved": "실제 실험적 구현에서 발생할 수 있는 샘플 결함이나 소자 공정 중 발생하는 무질서(disorder)가 밸리 보존에 미치는 영향은 추가 검증이 필요합니다.", "future_work": "실제 2차원 물질 기반의 헤테로구조를 제작하여 전기장 제어에 따른 엑시톤 발광 강도 및 수명 변화를 분광학적으로 관측하는 실험 연구가 뒤따라야 할 것입니다.", "concepts": [{"term": "밸리트로닉스", "why_emerged": "전하와 스핀 외에 에너지 밴드의 극점(valley)을 정보 단위로 활용하여 저전력, 고속 소자를 구현하기 위해 등장했습니다.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "2차원 반도체(MoS2 등), 위상 물질, Berry 곡률과 밀접한 관련이 있습니다."}, {"term": "Ferrovalley", "why_emerged": "밸리 간의 에너지 축퇴를 깨뜨려 특정 밸리에 전자를 축적하거나 흐르게 하기 위한 자발적 대칭성 파괴 상태가 필요했기 때문입니다.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "강자성체, 비반전 대칭성 파괴와 연결되어 비정상 홀 효과 등을 유도합니다."}], "english_summary": ["Explores electrically switchable exciton states in ferrovalley bilayers.", "Addresses the trade-off between optical accessibility and lifetime of excitons.", "Proposes an active switching mechanism to enhance valleytronic memory performance."]}}, {"title": "Emergence of a Symmetry-Broken Chern Insulator near a Moiré Kondo Breakdown", "journal": "PRL_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/szcj-44xj", "authors": "Wanghao Tian, Bowen Shen, Lizhong Li, et al.", "last_authors": "Jie Shan, Kin Fai Mak", "summary": "A new class of topological states emerging near a Kondo breakdown in a moiré Kondo lattice system reveals a connection between the chiral Kondo interaction and the formation of topologically nontrivial states at fractional moiré fillings—an observation that has not been reported in previous heavy-fermion systems.", "tier": "B_IMPORTANT_CONDMAT", "score": "7", "reason": "Topological phase in moiré systems is relevant to broader quantum materials interests.", "tags": ["moiré", "topology", "Kondo"], "image": "", "briefing": {"background": "모아레 격자 시스템은 격자 불일치를 통해 강상관 전자계 물성을 유도하는 강력한 도구입니다. 특히 Kondo 효과와 모아레 격자가 결합하면 heavy-fermion 물리와 위상 상태가 조화롭게 나타나는 새로운 양자 상이 발견되고 있습니다.", "motivation": "모아레 콘도 격자에서 나타나는 콘도 붕괴(Kondo breakdown) 부근에서 발생하는 새로운 위상학적 상태를 규명하고자 합니다.", "result": "부분 모아레 충전(fractional moiré filling) 영역에서 chiral Kondo 상호작용이 위상학적으로 비자명한 Chern 절연체 상태를 유도함을 보고했습니다.", "implication": "기존 heavy-fermion 시스템에서는 볼 수 없었던 위상 물리 현상이 모아레 시스템에서 실현 가능함을 보여주며, 강상관 위상 물질의 범위를 확장합니다.", "novelty": "모아레 격자의 콘도 붕괴가 위상학적 비자명성과 연결되는 경로를 규명했다는 점에서 강상관 위상 물성 연구의 중요한 진전입니다.", "unresolved": "이 위상학적 상태의 안정성과 온도에 따른 위상 전이 거동에 대한 상세한 메커니즘은 여전히 미해결 상태입니다.", "future_work": "STS를 통한 국소 상태 밀도 측정이나 비정상 홀 효과 측정 등 위상 불변량을 직접 검증할 수 있는 추가적인 실험적 접근이 요구됩니다.", "concepts": [{"term": "콘도 붕괴(Kondo breakdown)", "why_emerged": "강상관 전자계에서 국소 모멘트와 전도 전자 사이의 콘도 스크리닝이 깨지는 임계 현상을 기술하기 위해 도입되었습니다.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "Heavy-fermion 임계점, 퀀텀 임계 물리와 연결됩니다."}, {"term": "Chern 절연체", "why_emerged": "외부 자기장 없이도 위상학적 밴드 구조를 통해 양자화된 홀 전도도를 구현하기 위해 연구됩니다.", "origin": "Duncan Haldane(1988)", "connections": "양자 비정상 홀 효과, 위상학적 밴드 구조와 연결됩니다."}], "english_summary": ["Reports a symmetry-broken Chern insulator in moiré Kondo lattice systems.", "Identifies a link between chiral Kondo interactions and non-trivial topology.", "Observes unique topological states at fractional fillings distinct from heavy-fermion systems."]}}, {"title": "Odd-Parity Magnons in the Haldane-Hubbard Model from Topological Exciton Condensation", "journal": "PRL_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/q1cs-j5py", "authors": "Rintaro Eto, Johannes Knolle", "last_authors": "Rintaro Eto, Johannes Knolle", "summary": "Collective excitations in condensed matter can carry nontrivial topology and provide information about quantum phases beyond their ground-state properties. At the same time, the recent emergence of altermagnetism and related nonrelativistic spin-split electronic states raises the question of how unconventional magnetic symmetry is encoded in their collective excitations. Here, we uncover a continuous evolution from topological excitons to odd-parity magnons across an interaction-driven magnetic transition in the paradigmatic Haldane-Hubbard model. In the paramagnetic phase, our newly found sharp topological excitons soften and condense into a collinear Néel state, where they evolve into Goldstone magnons displaying characteristic f -wave spin splitting. The topology of these collective modes is tied to the underlying electronic topology, such that an electron bandgap closing enforces a magnon bandgap closing, changing the magnon topology. Our results establish a direct connection between topological collective excitations and nonrelativistic odd-parity spin splittings, with potential realizations in Floquet-driven materials and cold atomic gases.", "tier": "B_IMPORTANT_CONDMAT", "score": "7", "reason": "Connects altermagnetism and topology to Hubbard-type physics.", "tags": ["altermagnetism", "topological", "magnons"], "image": "", "briefing": {"background": "알터자기(Altermagnetism)는 최근 주목받는 자기 질서로, 비상대론적 스핀 분리가 나타나면서도 자화는 0인 독특한 상태입니다. 기존 강자성/반강자성과는 다른 위상학적 특성을 이해하는 것이 중요합니다.", "motivation": "Haldane-Hubbard 모델을 통해 자성 상태 변화에 따른 집단 여기(magnon)의 위상학적 거동과 알터자기의 비전통적 대칭성이 어떻게 연관되는지 탐구합니다.", "result": "상호작용에 의해 상자성체에서 네엘(Néel) 상태로 전이되는 과정에서, 위상학적 엑시톤이 f-파 스핀 분리를 갖는 골드스톤 마그논(magnon)으로 진화함을 발견했습니다.", "implication": "전자 밴드의 위상학적 특성이 집단 여기인 마그논의 위상학적 특성으로 직접 전이됨을 확인하여, 자성 물질의 위상 물리 이해에 새로운 지평을 열었습니다.", "novelty": "비상대론적 스핀 분리(알터자기)가 마그논의 위상학적 밴드 구조와 직접 연결됨을 이론적으로 규명하여 향후 Floquet 물질 연구 등에 중요한 기반을 제공합니다.", "unresolved": "현 이론은 모델 시스템에 기반하고 있으므로, 실제 물질에서 이러한 마그논 위상 전이를 관측하기 위한 실험적 탐색이 구체화되어야 합니다.", "future_work": "중성자 산란(neutron scattering)이나 RIXS를 사용하여 실제 알터자기 물질에서의 마그논 분산 관계 및 위상학적 간극 관측을 시도해야 합니다.", "concepts": [{"term": "알터자기(Altermagnetism)", "why_emerged": "강자성과 반강자성 사이의 제3의 자기 상태로서, 자기 모멘트 합은 0이지만 전자 밴드에 스핀 분리가 발생하는 상태를 기술하기 위해 등장했습니다.", "origin": "최근 5년 이내 활발한 연구 시작(예: Šmejkal et al.)", "connections": "반강자성, 스핀-궤도 결합, 비반전 대칭성 파괴와 연결됩니다."}, {"term": "Haldane-Hubbard 모델", "why_emerged": "위상학적 비자명성을 가진 격자 모델(Haldane)에 전자 상관관계(Hubbard)를 도입하여 상호작용에 의한 위상 변화를 연구하기 위해 필요했습니다.", "origin": "Haldane(1988) 및 Hubbard(1963) 모델의 결합", "connections": "위상 절연체, 강상관 전자계와 연결됩니다."}], "english_summary": ["Links topological excitons to odd-parity magnons in the Haldane-Hubbard model.", "Shows continuous evolution of collective modes during a magnetic phase transition.", "Establishes a connection between electronic band topology and magnon topology in altermagnets."]}}, {"title": "Probing Bilayer Topological Order with Layer-Resolved Transport", "journal": "PRL_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/fd6s-x6k3", "authors": "Hongquan Liu, J. I. A. Li, D. E. Feldman", "last_authors": "J. I. A. Li, D. E. Feldman", "summary": "A. Li, and D. E. Feldman Shot noise has been used to measure fractional charges of anyons. The value of the charge imposes constraints on fractional statistics but does not determine it. This limitation is particularly important in multi-component systems. For example, the zero charge of neutral anyons in bilayer graphene g…", "tier": "B_IMPORTANT_CONDMAT", "score": "7", "reason": "Transport study on topological order in bilayer graphene systems.", "tags": ["graphene", "topological", "transport"], "image": "", "briefing": {"background": "위상학적 물질에서 분수 통계(fractional statistics)와 애니온의 성질을 규명하는 것은 현대 응집물질물리학의 핵심 과제 중 하나입니다. 특히 이중층 그래핀과 같은 다성분계 시스템에서는 전하뿐만 아니라 중성 입자의 기여가 섞여 있어 해석이 복잡합니다.", "motivation": "기존의 샷 노이즈(shot noise) 측정은 분수 전하를 측정할 수 있으나, 애니온의 위상학적 통계 성질을 직접적으로 결정짓지는 못한다는 한계가 있습니다. 이를 극복하기 위해 이중층 그래핀 시스템에서 층별로 분해된(layer-resolved) 수송 측정을 제안합니다.", "result": "이중층 그래핀의 위상학적 질서 내에서 나타나는 중성 애니온의 존재를 층별 수송 특성을 통해 구별하고, 기존의 전하 기반 측정 방식이 가졌던 제약을 극복할 수 있는 방법을 제시합니다.", "implication": "다성분계 양자 홀 시스템에서 분수 통계와 위상학적 질서를 보다 정밀하게 판별할 수 있는 실험적 토대를 마련합니다.", "novelty": "기존의 총괄적인 수송 측정을 넘어 층별(layer-resolved) 수송 데이터를 활용해 다성분계 애니온의 위상학적 성질을 분리해냈다는 점에서 위상학적 질서 연구에 새로운 방법론을 제시합니다.", "unresolved": "실제 실험에서 층 간의 결합(interlayer coupling)이 강할 경우 층별 수송 데이터를 얼마나 명확하게 분리할 수 있을지에 대한 정밀한 제어 방안이 남아있습니다.", "future_work": "다른 이중층 위상학적 절연체나 무아레 시스템에 대한 확장 실험 및 구체적인 수송 측정 프로토콜 개발이 예상됩니다.", "concepts": [{"term": "Shot Noise", "why_emerged": "전하의 불연속성(입자성)으로 인해 발생하는 전류의 요동을 측정하여 하전 입자의 유효 전하를 알아내기 위함.", "origin": "Schottky (1918)에 의해 초기 제안.", "connections": "분수 양자 홀 효과에서의 준입자 전하 측정과 직결됨."}, {"term": "Anyons", "why_emerged": "2차원 계에서 보손도 페르미온도 아닌 위상학적 통계를 따르는 입자의 존재를 기술하기 위해 필요.", "origin": "Leinaas와 Myrheim (1977), Wilczek (1982).", "connections": "위상학적 양자 컴퓨터 및 분수 양자 홀 효과와 연결."}], "english_summary": ["Layer-resolved transport is proposed as a probe for topological order in bilayer systems.", "Addresses the limitations of standard shot noise measurements in identifying fractional statistics.", "Distinguishes neutral anyonic contributions in multi-component topological phases.", "Provides a method to overcome the ambiguity of charge-only transport data."]}}, {"title": "Strain-Tunable Competing Polar Orders in NbOCl2", "journal": "PRL_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/tzk8-nqby", "authors": "Yanfei Hou, Jun-Jie Zhang, Linyuan Chen, et al.", "last_authors": "Liang Fang, Lu You", "summary": "a broad range of emergent functionalities in complex oxides yet remain largely unexplored in two-dimensional van der Waals materials. Here, we report direct evidence for the coexistence of polar and antip…", "tier": "B_IMPORTANT_CONDMAT", "score": "7", "reason": "Experimental study on competing orders in van der Waals materials.", "tags": ["vanderWaals", "electronic-structure"], "image": "", "briefing": {"background": "자동 브리핑을 생성하지 못했습니다. 초록과 원문 링크를 기준으로 빠르게 확인하세요.", "motivation": "초록 정보만으로는 분야 내부의 구체적 동기를 안정적으로 요약하기 어렵습니다.", "result": "a broad range of emergent functionalities in complex oxides yet remain largely unexplored in two-dimensional van der Waals materials. Here, we report direct evidence for the coexistence of polar and antip…", "implication": "필터가 이 논문을 통과시킨 이유는 관련 키워드, 저자, 또는 Gemini relevance score 때문입니다.", "novelty": "Experimental study on competing orders in van der Waals materials.", "unresolved": "원문 확인 후 열린 질문을 판단해야 합니다.", "future_work": "후속 실험, 독립 재현, 관련 물질/조건 확장이 가능한지 확인하세요.", "concepts": [], "english_summary": ["The detailed AI briefing was unavailable for this paper.", "Use the abstract, score reason, and original link for a quick first pass."]}}, {"title": "Topological Multicomponent Superconductivity with Sizable s-Wave Admixture in Twisted Bilayer Cuprates", "journal": "PRL_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/6cyn-zbpm", "authors": "Yu-Hang Li, Congjun Wu, Wang Yang", "last_authors": "Congjun Wu, Wang Yang", "summary": "An investigation of three-component superconductivity in twisted bilayer cuprates shows that s-wave pairing does not preclude chiral topological superconductivity.", "tier": "B_IMPORTANT_CONDMAT", "score": "7", "reason": "Topological superconductivity and unconventional pairing in moire/twisted systems are relevant.", "tags": ["superconductivity", "twistedbilayer", "topological"], "image": "", "briefing": {"background": "고온 초전도체인 구리산화물(cuprates)은 전통적으로 d-파동 페어링을 갖는 것으로 알려져 있으나, 최근 뒤틀린(twisted) 이중층 구조를 통해 새로운 위상학적 위상과 초전도 상태를 엔지니어링하려는 시도가 활발합니다.", "motivation": "뒤틀린 이중층 구리산화물에서 다성분(multicomponent) 초전도성이 나타날 때, s-파동 성분의 혼입이 위상학적 상태를 파괴하지 않는지, 혹은 오히려 위상학적 성질과 공존할 수 있는지를 확인하고자 합니다.", "result": "이중층 구리산화물의 뒤틀린 구조에서 s-파동 혼입이 존재하더라도 카이랄 위상 초전도성(chiral topological superconductivity)이 유지될 수 있음을 이론적으로 보였습니다.", "implication": "위상학적 초전도성을 구현하기 위해 반드시 순수한 페어링 대칭성만 필요한 것은 아니며, 무아레 시스템의 대칭성 조절을 통해 위상적 성질을 유도할 수 있음을 시사합니다.", "novelty": "기존 구리산화물의 강상관 전자 물성과 뒤틀린 무아레 격자의 위상학적 기하학을 결합하여 새로운 초전도 위상을 예측했다는 점이 독창적입니다.", "unresolved": "이러한 초전도 상태가 실제 실험적으로 구현되었을 때 나타나는 엣지 상태나 분수 양자 홀 유사 현상의 구체적인 증거는 아직 제시되지 않았습니다.", "future_work": "뒤틀린 이중층 구리산화물의 저온 수송 측정 및 STM을 통한 초전도 갭 구조의 맵핑이 필요합니다.", "concepts": [{"term": "Twisted Bilayer Cuprates", "why_emerged": "뒤틀림 각도를 조절하여 밴드 구조를 변형하고 상관관계를 제어하기 위해.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "뒤틀린 이중층 그래핀(TBG)의 성공 이후 다른 상관계로의 확장."}, {"term": "Chiral Topological Superconductivity", "why_emerged": "에너지 갭 내에 엣지 모드를 가지며 위상학적으로 보호받는 초전도 상태를 이해하기 위해.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "마요라나 페르미온, 위상학적 양자 컴퓨터."}], "english_summary": ["Investigates three-component superconductivity in twisted bilayer cuprates.", "Demonstrates that s-wave admixture does not preclude chiral topological superconductivity.", "Combines moire lattice engineering with unconventional cuprate pairing.", "Suggests new routes to topological states in correlated materials via twisting."]}}, {"title": "Ultrasensitive Strain Modulation of Terahertz Magnons at a Magnetic Phase Transition", "journal": "PRL_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/wk6v-1x5s", "authors": "Lichen Wang, Sajna Hameed, Yiran Liu, et al.", "last_authors": "Matteo Minola, Bernhard Keimer", "summary": "Motivated by the prospect of strain control of terahertz (THz) magnons, we have used resonant x-ray diffraction and Raman scattering to investigate the magnetic ground state and excitations of the layered Mott insulator Ca 2 RuO 4 under uniaxial strain. We discovered a strain-induced phase transition between two antiferromagnetic states that differ in the sign of the interlayer exchange interaction. Although this interaction is weak and partially frustrated, the corresponding magnon energies of the two states differ by more than 10% ( ∼ 0.3 THz ). Our theoretical analysis explains this surprising observation by tracing the origin of both the sign reversal of the interlayer coupling and the magnon energy to the spin-orbital composition of the Ru valence electrons. The extreme strain sensitivity of the THz magnon energy near a magnetic phase transition opens up pathways toward a new generation of “transition-edge” magnonic devices.", "tier": "B_IMPORTANT_CONDMAT", "score": "7", "reason": "Relevant spectroscopy and magnetic dynamics in a correlated oxide system.", "tags": ["spectroscopy", "magnons", "correlated-electrons"], "image": "", "briefing": {"background": "강한 전자 상관관계가 존재하는 Mott 절연체에서 스핀-궤도 결합은 자기적 성질을 결정짓는 핵심 요소입니다. Ca2RuO4와 같은 물질은 구조적 왜곡과 외부 변형에 극도로 민감하여 자기적 상태와 여기(excitation)를 제어하기 위한 연구가 활발히 진행 중입니다.", "motivation": "단축 변형(uniaxial strain)을 통해 THz 대역의 마그논(magnon) 에너지를 정밀하게 조절하고, 그 근본적인 메커니즘을 규명하고자 수행되었습니다.", "result": "단축 변형에 의해 층간 교환 상호작용의 부호가 바뀌며 두 반강자성 상태 사이의 상전이가 유도됨을 발견했습니다. 이 과정에서 마그논 에너지가 10% 이상 변화함을 확인했습니다.", "implication": "자기 상전이점 근처에서 마그논의 에너지가 변형에 매우 민감하게 반응하므로, 차세대 마그논 소자(magnonic devices) 설계에 중요한 기초 원리를 제공합니다.", "novelty": "외부 변형을 사용하여 THz 마그논을 직접 제어하고, 이를 스핀-궤도 복합체 관점에서 이론적으로 깔끔하게 설명했다는 점이 주목할 만합니다.", "unresolved": "이러한 현상이 다른 루테네이트 계열 물질이나 더 복잡한 자기 구조에서도 유사한 효율로 나타나는지는 아직 확인되지 않았습니다.", "future_work": "실제 나노 구조 소자에서 변형을 인가하여 스핀 파동의 전파를 제어하는 마그논 트랜지스터 구현 연구가 필요합니다.", "concepts": [{"term": "마그논 (Magnon)", "why_emerged": "자기 정렬 물질 내 스핀의 집단적 들뜸 현상을 양자화하여 이해하기 위해 도입되었습니다.", "origin": "Felix Bloch (1930년), 스핀 파동 이론으로 제안.", "connections": "스핀 파동(Spin wave), 비탄성 중성자 산란(INS), RIXS."}, {"term": "단축 변형 (Uniaxial Strain)", "why_emerged": "결정 구조의 대칭성을 깨뜨려 전자의 에너지 준위와 자기적 상호작용을 외부에서 미세 조정하기 위해 사용됩니다.", "origin": "고체 물리 실험의 표준 기법으로, 특정 연구자의 제안보다는 수십 년에 걸쳐 고도화됨.", "connections": "압전 효과, 구조적 상전이, 전자 상관계."}], "english_summary": ["Investigated Ca2RuO4 Mott insulator under uniaxial strain using resonant X-ray diffraction and Raman spectroscopy.", "Identified a strain-induced phase transition between two antiferromagnetic states.", "Demonstrated that magnon energies are highly tunable (~0.3 THz) due to modified interlayer exchange.", "Provided a theoretical link between spin-orbital composition and strain-dependent magnon dynamics."]}}, {"title": "Angular Momentum Hall Effect of Axial Ferrons in Ferroelectrics", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2611.32331", "authors": "Xiyin Ye, Tao Yu", "last_authors": "Xiyin Ye, Tao Yu", "summary": "Phonon thermal and angular-momentum (AM) Hall effects are known in non-ferroelectric insulators, yet whether terahertz soft modes of displacive ferroelectrics, i.e., ``ferrons\", share them remains open. We report axial ferrons that hold polarization-momentum locking in uniaxial ferroelectrics and show that both effects exist: a longitudinal temperature gradient drives a transverse AM flow without any field, whereas an out-of-plane magnetic field switches on the thermal Hall response. Two competitive channels emerge for the AM Hall effect: self-radiated magnetic fields hybridize two branches into circular modes whose momentum-locked Berry curvature deflects opposite magnetic moments to opposite edges, while temperature-gradient-induced mode quantum coherence adds a magnetic-moment dipole that leads to an opposite transverse AM current. An out-of-plane magnetic field breaks the exact polarization-momentum locking and yields a polarization Hall current. Numerical calculations show these effects are significant in both LiNbO$_3$ and van der Waals ferroelectrics. Edge magnetization or polarization accumulation can switch adjacent magnets or ferroelectrics, enabling low-power magnetoelectric functionality by thermal current in the future.", "tier": "B_IMPORTANT_CONDMAT", "score": "7", "reason": "Interesting interplay of Berry curvature, thermal effects, and van der Waals ferroelectrics.", "tags": ["Berrycurvature", "Halleffect", "vanderWaals"], "image": "https://arxiv.org/html/2611.32331v1/Fig1.png", "briefing": {"background": "강유전체(ferroelectrics)의 격자 진동 모드인 포논은 열 전도뿐만 아니라 최근 스핀 및 궤도 각운동량(angular momentum)과의 결합 연구가 활발합니다. Berry 곡률과 위상학적 특성이 이들 수송 현상에 미치는 영향은 차세대 소자 연구의 핵심 분야입니다.", "motivation": "강유전체의 비평형 상태인 '페론(ferrons)'이 비강유전체 절연체처럼 열 및 각운동량 홀 효과를 나타낼 수 있는지 규명하고자 했습니다.", "result": "축 방향 페론(axial ferrons)이 열 구배에 의해 transverse 각운동량 흐름을 생성함을 이론적으로 보였습니다. 또한 외부 자기장에 의한 편극 홀 전류 유도 가능성을 제시했습니다.", "implication": "열 흐름을 통해 자기적 상태나 편극 상태를 제어할 수 있는 저전력 마그네토일렉트릭(magnetoelectric) 소자 구현의 길을 열었습니다.", "novelty": "van der Waals 강유전체에서도 이러한 효과가 유의미함을 수치적으로 제시하여, 저차원 자성 소자 응용 가능성을 보여주었습니다.", "unresolved": "실제 실험에서 열 구배에 의한 미세한 각운동량 홀 전류를 직접 측정하는 기술적 난제가 남아있습니다.", "future_work": "LiNbO3나 vdW 강유전체 박막을 이용한 각운동량 수송 실험 데이터 확보가 필요합니다.", "concepts": [{"term": "각운동량 홀 효과 (AM Hall Effect)", "why_emerged": "열 구배가 스핀/궤도 각운동량을 횡방향으로 이동시키는 현상을 기술하기 위해 필요합니다.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "스핀 홀 효과(SHE), 열 홀 효과(Thermal Hall Effect)."}, {"term": "Berry 곡률 (Berry Curvature)", "why_emerged": "운동량 공간에서 위상학적 성질을 이해하고, 전자/포논 수송의 횡방향 움직임을 설명하기 위해 도입되었습니다.", "origin": "Michael Berry (1984년).", "connections": "위상 절연체, 이상 홀 효과, anomalous Hall effect."}], "english_summary": ["Proposed and analyzed the angular momentum (AM) Hall effect in uniaxial ferroelectrics via axial ferrons.", "Found that longitudinal temperature gradients drive transverse AM flow without external fields.", "Identified competitive channels for AM current based on mode-locked Berry curvature and thermal coherence.", "Calculations suggest strong effects in LiNbO3 and vdW ferroelectrics for potential magnetoelectric applications."]}}, {"title": "Contribution to the GdTe3 magnetic phase diagram from electronic transport measurements", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2611.32401", "authors": "A. A. Sinchenko, P. D. Grigoriev, A. Hadj-Azzem, E. Pachoud, E. Lorenzo, P. Monceau", "last_authors": "E. Lorenzo, P. Monceau", "summary": "Magnetic phase diagrams of the three antiferromagnetic (AFM) transitions of GdTe$_3$ that occur at zero magnetic field at $T_{N1}=12$ K, $T_{N2}=10.5$ K and $T_1=7$ K are investigated by means of resistance measurements in a magnetic field oriented along the three crystallographic directions. With the magnetic field applied in the basal plane we found re-entrance of an intermediate phase which may be a result of the coupling between the $T_{N2}$ AFM and the charge density wave with possibly a ferroaxial order. A spin flop transition is also observed at a temperature that presumably converges towards a triple point in vicinity of 2.5-3.0 T and $T$ between $T_1$ and $T_{N2}$. Our results help complete a complex phase diagram of GdTe$_3$ and advance a method for investigating magnetic ordering via transport measurements -- a technique applicable to many other compounds.", "tier": "B_IMPORTANT_CONDMAT", "score": "7", "reason": "Transport study on RTe3 compounds relating to CDW and magnetic order.", "tags": ["CDW", "magnetism", "transport"], "image": "https://arxiv.org/html/2611.32401v1/RT_IVs.png", "briefing": {"background": "RTe3(R=희토류) 계열 물질은 전하밀도파(CDW)와 자기 질서가 공존하며 나타나는 독특한 상호작용으로 인해 많은 관심을 받고 있습니다. 특히 자기장 하에서의 상평형도 조사는 강상관 전자계의 물성을 이해하는 핵심 지표입니다.", "motivation": "GdTe3의 다중 반강자성 상전이와 CDW 사이의 복잡한 결합 관계를 자기장 하에서의 전기 저항 측정을 통해 정밀하게 규명하고자 했습니다.", "result": "자기장 인가 시 중간 상의 재진입 현상과 스핀 플롭(spin flop) 전이를 관찰했습니다. 이는 CDW와 자기 질서가 서로 강하게 결합되어 있음을 시사합니다.", "implication": "전기 수송 측정이 자기 구조 변화를 추적하는 효과적인 도구임을 입증했으며, GdTe3의 복합적인 위상도를 완성하는 기초 자료가 됩니다.", "novelty": "CDW와 자기 질서가 얽힌 3중점(triple point) 부근의 상 행동을 실험적으로 확인하여, 해당 물질의 상평형도를 정교화했습니다.", "unresolved": "관찰된 중간 상이 정확히 어떤 ferroaxial order를 갖는지에 대한 미시적 원자 수준의 증거는 추가 연구가 필요합니다.", "future_work": "중성자 산란 연구를 통해 이번 저항 측정에서 발견된 상전이의 자기 구조적 근거를 직접 확인해야 합니다.", "concepts": [{"term": "전하밀도파 (CDW)", "why_emerged": "낮은 차원에서 전자와 격자가 결합하여 주기적인 밀도 변조를 형성하는 바닥 상태를 설명하기 위해 도입되었습니다.", "origin": "Rudolf Peierls (1955년).", "connections": "페르미 표면 중첩(nesting), 고온 초전도체, 1D 도체."}, {"term": "스핀 플롭 전이 (Spin Flop Transition)", "why_emerged": "반강자성체에서 자기장을 인가할 때 자기 모멘트가 외부 자기장 방향으로 재정렬되는 비선형적인 상전이를 설명하기 위해 필요합니다.", "origin": "Louis Néel (1930년대).", "connections": "반강자성, 자기 이방성, 제만 에너지."}], "english_summary": ["Investigated the magnetic phase diagram of GdTe3 using magnetotransport measurements.", "Observed complex phase behavior including re-entrant phases and spin-flop transitions under magnetic fields.", "Evidence suggests strong coupling between the antiferromagnetic order and charge density waves.", "Validated transport measurement as a powerful tool for mapping magnetic phase diagrams in correlated systems."]}}, {"title": "Emergent Electric-Field-Tunable p-Wave Magnetism in Twisted Bilayer NiPS3", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2611.32103", "authors": "Jiaran Su, Jin-Xin Hu, Qi Sun, et al.", "last_authors": "Lede Xian, Lijun Zhang", "summary": "A perpendicular electric field can reorient a momentum-space spin texture without changing the local magnetic configuration. In this Letter, we investigate this mechanism in a $21^\\circ$-twisted $\\mathrm{NiPS}_3$ bilayer with zigzag order and coplanar, nonparallel layer N\\'eel vectors. In the ideal nonrelativistic limit, an antiunitary in-plane half-translation enforces opposite-spin pairing at opposite momenta, while a layer-exchanging twofold operation pins the leading $p$-wave spin splitting to a crystallographic direction. A perpendicular layer bias lifts this orientational constraint while preserving the antiunitary symmetry, allowing a transverse component of the splitting vector. First-principles calculations show gate-dependent reorientation and deformation of spin-resolved isoenergy contours. Wannier-based linear-response calculations further reveal field-activated diagonal spin conductivities and a polarity-dependent tilt in the angular profile of the transverse spin-current response. The spin-texture axis, dispersion axes, and transport-response axis are distinct quantities governed by the same symmetry reduction. These results identify layer bias as a route to controlling odd-parity spin textures and spin-current anisotropy, provided that the coplanar magnetic state remains stable.", "tier": "B_IMPORTANT_CONDMAT", "score": "7", "reason": "Relevant theoretical study on twisted magnetism and spin textures in a magnetic material.", "tags": ["twisted", "magnetism", "topological"], "image": "https://arxiv.org/html/2611.32103v1/Fig1.png", "briefing": {"background": "자성 반데르발스 물질(van der Waals magnets)은 층간 결합이 약해 게이트 전압이나 층간 뒤틀림(twist)을 통해 스핀 구조를 정밀하게 제어할 수 있는 플랫폼으로 주목받고 있습니다.", "motivation": "NiPS3 이층 구조에서 21도 뒤틀림을 도입했을 때, 외부 전기장(수직 바이어스)이 기존의 지그재그 자성 상태를 유지하면서도 어떻게 스핀 텍스처와 전하 수송 특성을 변조할 수 있는지 이론적으로 규명하고자 했습니다.", "result": "수직 전기장이 스핀 분리(spin splitting)의 방향성 제약을 해제하여 횡방향 스핀 전류 및 대각선 스핀 전도도를 유도할 수 있음을 보였습니다.", "implication": "전기장 제어를 통해 비전통적인 p-파(p-wave) 스핀 텍스처를 능동적으로 조절할 수 있음을 시사하며, 이는 차세대 스핀트로닉스 소자 응용 가능성을 보여줍니다.", "novelty": "외부 자기장 없이 오직 수직 전기장만으로 자성 물질의 스핀 텍스처 대칭성을 낮추고 수송 특성을 변조하는 새로운 제어 기법을 제시했습니다.", "unresolved": "이론적 모델은 이상적인 환경을 가정하고 있으며, 실제 소자 구현 시 발생하는 결함이나 층간 상호작용의 복잡성에 대한 고려가 필요합니다.", "future_work": "실제 실험적 환경에서 전기장을 이용한 스핀 전류의 측정과 자성 상태의 안정성 유지를 확인하는 후속 연구가 요구됩니다.", "concepts": [{"term": "p-wave magnetism", "why_emerged": "운동량 공간에서 스핀 상태가 비대칭적으로 분리되는 현상을 기술하기 위해 필요합니다.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "토폴로지 초전도체 및 비전통적 자성체 연구와 연결됩니다."}, {"term": "NiPS3", "why_emerged": "2차원 반데르발스 반강자성체로서 스핀-격자 결합이 강해 자성 연구의 표준 물질로 사용됩니다.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "반데르발스 자성체, 엑시톤-마그논 결합 연구와 연결됩니다."}], "english_summary": ["Investigated 21-degree twisted bilayer NiPS3 with zigzag antiferromagnetic order.", "Showed that a perpendicular electric field modulates odd-parity spin textures without disturbing the base magnetic configuration.", "Identified gate-tunable spin-current anisotropy and diagonal spin conductivity.", "Provides a theoretical pathway for manipulating spin textures in 2D magnetic systems via layer bias."]}}, {"title": "Facet-Driven Electronic Modulation in Self-Aligned Phosphorus Nanoarrays (Small)", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2606.18907", "authors": "M. Bassotti, M. Tallarida, J. Dai, et al.", "last_authors": "A. Verdini, F. Schiller", "summary": "Two-dimensional (2D) materials often require specific substrate terminations for epitaxial stabilization, yet the search for suitable templates has largely focused on low-index metal surfaces, which may not provide the optimal conditions for the growth of new phases. Here, we show that crystal-facet engineering on curved Cu surfaces enables the stabilization, within a single preparation step, of two distinct phosphorus surface phases with different electronic properties. Hexagonal phosphorus adlayer forms on Cu(111) terraces, whereas a previously unreported skewed-square P overlayer is stabilized on Cu(513) facets. By combining complementary microscopy and spectroscopy techniques with theoretical calculations, we show the quasi-semiconducting character of the P-derived electronic states of the skewed-P overlayer, in contrast to the case of hexagonal phosphorene. The coexistence of these two competing structures gives rise to electronic P band modulation overlayer across the substrate while, locally, self-aligned nanoarrays of alternating hexagonal and skewed-square phosphorus al strain and its sensitivity to the Hubbard U parameter", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2611.32265", "authors": "Rashmi Ranjan Routaray, Ali Ghojavand, Eric Bousquet", "last_authors": "Ali Ghojavand, Eric Bousquet", "summary": "In correlated two-dimensional magnets the balance between competing electronic and magnetic phases is often set by the strength of the on-site Coulomb interaction, so that the predicted ground state can hinge on a parameter that is not uniquely defined. Monolayer CrS$_2$ lies squarely in this regime, hosting several energetically close polymorphs whose character ranges from non-magnetic semiconducting to magnetically ordered metallic. We therefore investigate, using DFT$+U$ within the generalized gradient approximation, the structural, magnetic, and electronic properties of the 1H, 1T, 1T$'$, and 1T$''$ polymorphs of monolayer CrS$_2$ under varying Hubbard interactions ($U=0$--$8$~eV) and biaxial strain ($-10\\%$ to $+10\\%$). The 1T-derived structures remain metallic and magnetic throughout, with $U$ acting mainly as a spectral renormalization. The 1H phase behaves differently, passing from a non-magnetic semiconductor through an antiferromagnetic semiconducting regime before metallizing, so that the gap closes as $U$ increases while the local Cr moment grows monotonically. Biaxial tensile strain at fixed $U$ induces a similar sequence of transitions. Along both tuning pathways, the two inequivalent nearest-neighbor Cr--Cr exchange channels progressively separate and cross, with the parallel-spin channel becoming dominant, accompanied by a breathing-type bond disproportionation. Independent calculations with a localized-orbital implementation reproduce the overall evolution but yield shifted critical values of $U$ and of strain, demonstrating the robustness of the phase diagram while highlighting the implementation dependence of the transition thresholds.", "tier": "B_IMPORTANT_CONDMAT", "score": "7", "reason": "First-principles study of electronic and magnetic phases in a correlated 2D material under strain.", "tags": ["DFT+U", "2Dmaterial", "monolayer", "magnetism", "correlated", "electronicstructure", "CrS2"], "image": "https://arxiv.org/html/2611.32265v1/fig/fig-1_6.png", "briefing": {"background": "2차원 자성 물질은 강한 전자 상관관계로 인해 구조적/자기적 위상이 외부 파라미터에 매우 민감하며, 이론적 계산의 정확도 확보가 필수적입니다.", "motivation": "CrS2 단일층의 다형체(polymorphs)들이 Hubbard U 파라미터와 변형(strain)에 따라 어떻게 자기적/전자적 상태가 변하는지 정량적으로 이해하고자 했습니다.", "result": "Hubbard U와 변형률이 CrS2의 위상 안정성에 결정적인 역할을 하며, 특히 1H 구조의 경우 반도체-금속 전이를 유도함을 발견했습니다.", "implication": "DFT+U 계산 시 파라미터 선택의 중요성을 강조하며, 2차원 자성 물질의 설계 및 실험적 위상 제어의 가이드라인을 제공합니다.", "novelty": "다양한 polymorph에 대한 체계적인 위상 도표를 구성하고, 계산 방식의 차이가 결과에 미치는 영향을 명확히 분석했습니다.", "unresolved": "DFT+U의 고질적 한계인 U 값 설정의 모호함이 여전히 존재하며, 실험적으로 정확히 구현 가능한 임계값의 정밀도는 추가 연구가 필요합니다.", "future_work": "실제 실험 데이터(ARPES, RIXS 등)와 계산 결과를 직접 비교하여 Hubbard U의 최적값을 검증하는 연구가 뒤따를 것입니다.", "concepts": [{"term": "DFT+U", "why_emerged": "DFT의 표준 근사가 가진 강한 상관관계 물질의 오차(밴드갭 과소평가 등)를 보정하기 위해 필요합니다.", "origin": "Anisimov et al. (1991)", "connections": "강상관계 전자계, Mott 절연체 연구와 연결됩니다."}, {"term": "Polymorph", "why_emerged": "동일한 원소 구성이라도 배열에 따라 다른 물성을 가질 수 있어 이를 구분하기 위해 필요합니다.", "origin": "고체화학 일반 개념", "connections": "구조적 상전이, 2D 재료의 다형체 연구와 연결됩니다."}], "english_summary": ["Performed DFT+U calculations on monolayer CrS2 polymorphs under strain.", "Mapped the magnetic and electronic phase diagram as a function of Hubbard U.", "Identified transition regimes where structural strain and U induce metallization in the 1H phase.", "Highlighted the sensitivity of predicted ground states to computational implementation."]}}, {"title": "From Fermions to Vortices: Microscopic Simulations of Phase Ordering in a d-Wave Superconductor", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2611.32916", "authors": "Ali Rayat, Gia-Wei Chern", "last_authors": "Ali Rayat, Gia-Wei Chern", "summary": "Describing bath-induced superconducting phase ordering directly from a microscopic fermionic Hamiltonian remains a formidable challenge. Here we develop a microscopic framework for this problem using the recently introduced adiabatic variational principle (AVP) and demonstrate its application to a two-dimensional $d$-wave superconductor. The central construction maps evolving, spatially inhomogeneous bond-pairing fields onto constrained Bogoliubov-de Gennes states, with the associated Lagrange multipliers determining the thermodynamic driving forces. This enables dissipative evolution of the superconducting order while retaining its microscopic electronic structure, without assuming a phenomenological Ginzburg-Landau free-energy functional. Starting from disordered pairing configurations, we resolve the emergence of phase coherence through vortex-antivortex annihilation and the accompanying evolution of local electronic spectra. Vortex decay and dynamical scaling recover the characteristic kinetics of two-dimensional phase ordering, providing a nontrivial benchmark of the framework. The solver-independent AVP formulation opens a route to microscopic studies of dissipative ordering and metastability in superconductors with intertwined stripe and pair-density-wave orders.", "tier": "B_IMPORTANT_CONDMAT", "score": "7", "reason": "Microscopic electronic structure approach to d-wave SC phase ordering; relevant to correlated systems.", "tags": ["superconduct"], "image": "https://arxiv.org/html/2611.32916v1/mapping.png", "briefing": {"background": "전통적으로 초전도체의 상전이 및 상 정렬 과정은 긴즈버그-란다우 이론과 같은 현상론적 모델로 기술되어 왔으나, 미시적 전자 구조가 어떻게 거시적 위상 질서로 이어지는지를 직접 기술하는 것은 여전히 난제로 남아 있습니다.", "motivation": "임의의 초전도 상태에서 미시적인 페르미온 해밀토니언으로부터 직접적인 소산 동역학을 유도하여, 복잡한 상전이 과정을 설명하고자 함.", "result": "새로운 단열 변분 원리(AVP)를 도입하여 d-파 초전도체에서 보텍스-안티보텍스 소멸 과정을 미시적 전자 구조와 결합하여 성공적으로 시뮬레이션함.", "implication": "페어 밀도 파동(PDW)이나 스트라이프 상과 같이 전자 상관관계가 강한 시스템에서 나타나는 비평형 상 정렬 과정을 미시적 기반에서 연구할 수 있는 강력한 이론적 틀을 제공함.", "novelty": "기존의 현상론적 접근을 탈피하여 보텍스 동역학을 미시적 페르미온 상태와 직접 연결했으며, 특히 다체 물리에서 관심 있는 복잡한 질서 변수 간의 경쟁 연구에 활용 가능함.", "unresolved": "계산 복잡도로 인해 더 큰 시스템이나 3차원 구조에서의 상세한 동역학 시뮬레이션은 여전히 도전 과제임.", "future_work": "실제 스트라이프 상이 관찰되는 퀴프레이트나 기타 강상관계 시스템의 상전이 동역학 연구로 확장 예정.", "concepts": [{"term": "Bogoliubov-de Gennes (BdG) 방정식", "why_emerged": "비균질하거나 보텍스가 존재하는 시스템에서 초전도성을 다루기 위한 평균장 이론의 확장.", "origin": "Nikolay Bogoliubov(1958).", "connections": "BCS 이론, 초전도 보텍스 격자 물리."}, {"term": "단열 변분 원리 (AVP)", "why_emerged": "비평형 상태에서 미시적 해밀토니언의 변화를 시간에 따라 추적하기 위해.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "시간 의존적 슈뢰딩거 방정식, 비평형 통계역학."}, {"term": "쌍 밀도 파동 (Pair Density Wave, PDW)", "why_emerged": "일반적인 초전도성과 달리 초전도 오더 파라미터가 공간적으로 변조되는 상태를 설명하기 위해.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "퀴프레이트 고온 초전도체, 공간적 이질성."}], "english_summary": ["Develops a microscopic framework for d-wave superconductivity using adiabatic variational principle.", "Maps evolving inhomogeneous pairing fields onto Bogoliubov-de Gennes states without phenomenological assumptions.", "Successfully simulates vortex-antivortex annihilation and phase ordering kinetics.", "Enables future microscopic studies of intertwined stripe and pair-density-wave phases."]}}, {"title": "Graphene Josephson diodes from asymmetric disorder (2D Mater.)", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2606.17673", "authors": "Ivan Villani, Luca Chirolli, Matteo Carrega, et al.", "last_authors": "Stefan Heun, Sergio Pezzini", "summary": "Josephson diodes are non-reciprocal superconducting devices characterized by different switching currents depending on the current flow direction. They recently attracted considerable theoretical and experimental attention, in view of their possible application as rectifying elements in the field of superconducting electronics, and as probes to investigate symmetry breaking mechanisms in mesoscopic systems. In this work, we show that graphene Josephson junctions provide rectification of supercurrent with an efficiency exceeding 20%. The effect appears applying a mT out-of-plane magnetic field and is enhanced close to the nodes of the Fraunhofer interference pattern. Our findings are consistent with a theoretical model that considers long-range scattering potentials in the junction as the symmetry-breaking mechanism, which yields supercurrent rectification in highly transparent junctions. While graphene stands out as an ultra-clean transmission medium, our work shows that unavoidable residual disorder is sufficient to promote this effect.", "tier": "B_IMPORTANT_CONDMAT", "score": "7", "reason": "Graphene-based non-reciprocal transport and superconducting diodes are relevant to the broad topological/topological-interface interests.", "tags": ["graphene", "superconductivity", "Josephson-junction"], "image": "https://arxiv.org/html/2606.17673v2/fig1_v11_260727.png", "briefing": {"background": "조셉슨 다이오드는 전류의 방향에 따라 초전류(supercurrent)의 임계값이 달라지는 비가역적 특성을 보이며, 초전도 소자의 정류기 및 대칭성 깨짐 탐지기로 주목받고 있습니다.", "motivation": "그래핀과 같은 초전도 접합에서 미세한 구조적 불균일성(disorder)이 어떻게 이러한 비가역적 수송 현상을 유도할 수 있는지 규명하고자 함.", "result": "그래핀 조셉슨 접합에서 잔류 무질서(residual disorder)가 대칭성을 깨뜨려 20% 이상의 효율을 가진 조셉슨 다이오드 효과를 유도함을 실험적, 이론적으로 증명함.", "implication": "초전도 다이오드 현상을 위해 반드시 복잡한 위상 물질이 필요한 것은 아니며, 그래핀과 같은 상대적으로 단순한 시스템에서도 무질서 제어를 통해 기능성 소자 구현이 가능함을 시사함.", "novelty": "초전도 소자에서 '깨끗함'의 대명사인 그래핀조차도 내재된 불균일성이 비대칭적 수송 현상의 핵심 요인이 될 수 있음을 입증함.", "unresolved": "다이오드 효율의 정밀 제어 방식 및 실제 상용 회로 구현을 위한 재현성 확보.", "future_work": "조절 가능한 게이트 전압을 통해 정류 효과를 극대화하거나 스위칭하는 연구.", "concepts": [{"term": "조셉슨 다이오드 효과", "why_emerged": "초전도체에서 비가역적 수송 특성을 활용한 비전통적 전자 소자 개발 필요성.", "origin": "초록 정보만으로는 특정하기 어려움 (최근 5년 내 활발).", "connections": "비상반성 수송, 대칭성 깨짐."}, {"term": "프라운호퍼 간섭 패턴", "why_emerged": "조셉슨 접합을 통과하는 자기장에 따른 전류 특성을 측정하여 접합의 공간적 전류 밀도 분포를 확인하기 위해.", "origin": "Josephson(1962).", "connections": "초전도 양자 간섭계(SQUID), 위상 감응형 수송."}], "english_summary": ["Demonstrates graphene Josephson junctions as non-reciprocal superconducting diodes.", "Achieves rectification efficiency exceeding 20% with out-of-plane magnetic fields.", "Identifies long-range scattering potentials due to residual disorder as the symmetry-breaking mechanism.", "Shows that high-transparency graphene can host diode effects without specialized topological materials."]}}, {"title": "Ground state and thermal phase diagrams of the magnetized spin-1/2 XXZ antiferromagnet on the triangular lattice", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2611.31412", "authors": "Owan Cho, Seungho Lee, Hyun-Yong Lee, SungBin Lee", "last_authors": "Hyun-Yong Lee, SungBin Lee", "summary": "The spin-1/2 XXZ antiferromagnet on the triangular lattice in a magnetic field is a paradigmatic frustrated quantum magnet, yet its ground-state phase diagram at generic anisotropy and its thermal phase structure remain incompletely understood. Here, using infinite density-matrix renormalization group, infinite projected entangled-pair operator, and exponential tensor renormalization group methods, supported by exact diagonalization, we resolve both issues. At zero temperature, we map the phase diagram continuously from the Ising limit to the Heisenberg point and find that the nonclassical $\\Psi$ supersolid is a stable phase just below saturation at all anisotropies studied: it borders the one-third-magnetization up-up-down plateau directly in the strongly easy-axis regime and the semiclassical $V$ phase toward the Heisenberg point. In the strongly easy-axis regime, we uncover an intrinsically finite-temperature bond-nematic phase above the zero-temperature plateau--$\\Psi$ boundary, in which the three bond directions become spontaneously inequivalent without transverse spin coherence or three-sublattice order. A hard-core-boson mapping reveals its origin: once thermal fluctuations destroy phase coherence, the field-doped holes settle on domain walls of the local up-up-down order, which are stabilized by quantum kink delocalization and aligned by its $Z_3$ registry. Our results call for reexamining high-field states in triangular-lattice cobaltates such as Na$_2$BaCo(PO$_4$)$_2$ and K$_2$Co(SeO$_3$)$_2$.", "tier": "B_IMPORTANT_CONDMAT", "score": "7", "reason": "Solid theory work on frustrated magnets relevant to cobaltates.", "tags": ["magnetism", "frustration"], "image": "https://arxiv.org/html/2611.31412v1/figure2.png", "briefing": {"background": "삼각 격자 상의 자기 시스템은 기하학적 좌절(frustration)로 인해 복잡한 바닥 상태와 양자 위상을 나타내며, 이는 코발트 화합물 등의 강상관계 물질 연구의 핵심 주제입니다.", "motivation": "XXZ 이방성을 가진 스핀-1/2 삼각 격자 반강자성체의 자기장 하에서의 위상 다이어그램이 여전히 불분명하여 이를 정밀하게 규명하고자 함.", "result": "고도화된 수치 계산 기법(DMRG, PEPS 등)을 통해 자기장-온도 상 다이어그램을 재구성하고, 특히 '본드 네마틱(bond-nematic)' 상과 '슈퍼솔리드' 상의 존재를 확인함.", "implication": "기존에 알려진 삼각 격자 코발트 물질들의 고자기장 상태를 해석하는 새로운 이론적 이정표를 제시함.", "novelty": "강한 이방성 영역에서 열적 요동에 의해 위상이 결정되는 본드 네마틱 상의 기원을 하드코어 보존의 국소적 도메인 벽 배열로 규명함.", "unresolved": "실제 코발트 화합물에서 이 모델 예측치와 실험적 관측값 간의 정량적 오차 범위.", "future_work": "제시된 모델을 기반으로 나트륨/칼륨계 코발트 화합물의 중성자 산란 실험 결과 재해석 및 신규 물질 탐색.", "concepts": [{"term": "본드 네마틱 상", "why_emerged": "회전 대칭성은 깨지지만 자기적 질서나 병진 대칭성은 유지되는 이국적인 상태를 설명하기 위해.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "액정 물리, 네마틱 초전도체, 자기 좌절."}, {"term": "삼각 격자 좌절", "why_emerged": "삼각형 구조에서는 스핀이 모두 반강자성적으로 정렬될 수 없어 에너지가 최소화되는 복잡한 바닥 상태를 형성하기 때문.", "origin": "Anderson(1973).", "connections": "양자 스핀 액체, 다강체(multiferroics)."}, {"term": "슈퍼솔리드", "why_emerged": "고체처럼 병진 대칭성이 깨지면서 동시에 유체처럼 초유체성을 가지는 물질 상태를 설명하기 위해.", "origin": "Andreev & Lifshitz(1969).", "connections": "보스-아인슈타인 응축, 양자 결정."}], "english_summary": ["Maps the ground-state and thermal phase diagrams of spin-1/2 XXZ antiferromagnets on triangular lattices.", "Identifies a bond-nematic phase and a stable Psi-supersolid phase using advanced numerical methods.", "Attributes bond-nematic order to the alignment of field-doped holes on domain walls.", "Provides theoretical guidance for investigating high-field states in cobaltate compounds like Na2BaCo(PO4)2."]}}, {"title": "Intrinsic spin accumulation in the magnetic spin Hall effect (Phys. Rev. B)", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2509.24719", "authors": "Atsuo Shitade", "last_authors": "Atsuo Shitade", "summary": "The magnetic spin Hall effect is a time-reversal-odd phenomenon in which spin current is induced by the charge current. In the presence of a spin-orbit coupling and/or noncolinear magnetism, however, spin current is not uniquely defined. Instead, we study an intrinsic response of spin to an electric field gradient that describes the spin accumulation at the boundaries of magnetic systems. We derive a generic formula expressed by Bloch wave functions and apply it to a minimal model for representative altermagnets, RuO$_{2}$ and MnF$_{2}$. Our results show that the intrinsic spin accumulation can be nonzero in magnetic insulators in sharp contrast to the magnetic spin Hall conductivity.", "tier": "B_IMPORTANT_CONDMAT", "score": "7", "reason": "Relevant theory for altermagnets like RuO2, which are of interest in magnetic topological materials.", "tags": ["altermagnetism", "spin-Hall-effect", "theory"], "image": "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAsAAAAOCAYAAAD5YeaVAAAAAXNSR0IArs4c6QAAAAZiS0dEAP8A/wD/oL2nkwAAAAlwSFlzAAALEwAACxMBAJqcGAAAAAd0SU1FB9wKExQZLWTEaOUAAAAddEVYdENvbW1lbnQAQ3JlYXRlZCB3aXRoIFRoZSBHSU1Q72QlbgAAAdpJREFUKM9tkL+L2nAARz9fPZNCKFapUn8kyI0e4iRHSR1Kb8ng0lJw6FYHFwv2LwhOpcWxTjeUunYqOmqd6hEoRDhtDWdA8ApRYsSUCDHNt5ul13vz4w0vWCgUnnEc975arX6ORqN3VqtVZbfbTQC4uEHANM3jSqXymFI6yWazP2KxWAXAL9zCUa1Wy2tXVxheKA9YNoR8Pt+aTqe4FVVVvz05O6MBhqUIBGk8Hn8HAOVy+T+XLJfLS4ZhTiRJgqIoVBRFIoric47jPnmeB1mW/9rr9ZpSSn3Lsmir1fJZlqWlUonKsvwWwD8ymc/nXwVBeLjf7xEKhdBut9Hr9WgmkyGEkJwsy5eHG5vN5g0AKIoCAEgkEkin0wQAfN9/cXPdheu6P33fBwB4ngcAcByHJpPJl+fn54mD3Gg0NrquXxeLRQAAwzAYj8cwTZPwPH9/sVg8PXweDAauqqr2cDjEer1GJBLBZDJBs9mE4zjwfZ85lAGg2+06hmGgXq+j3+/DsixYlgVN03a9Xu8jgCNCyIegIAgx13Vfd7vdu+FweG8YRkj rchia, Erik Linn\\'er, Massimo Capone", "last_authors": "Erik Linn\\'er, Massimo Capone", "summary": "The multichannel fluctuating field (MCFF) approach treats selected collective fluctuations in interacting quantum lattice models nonperturbatively, but has so far been applied only to single-band systems. Here, we extend MCFF theory to multiorbital systems, accounting for the orbital structure of charge and spin instabilities. We apply it to the half-filled two-orbital Kanamori-Hubbard model with repulsive intra-orbital interaction $U$, and both positive and negative Hund's coupling $J$, addressing the competing orders and their interplay. The ability to selectively retain individual fluctuation channels and control their interplay allows us to disentangle their respective contributions and identify the mechanisms underlying competing instabilities. The model features a simple competition between charge density wave and antiferromagnetic fluctuations in the vicinity of $J=U$, and a more intricate competition between antiferromagnetic, orbital, and spin-orbital fluctuations near $J=0$, where the model acquires a higher SU(4) symmetry. The proposed multiorbital extension thus provides a computationally inexpensive and efficient framework for exploring how orbital and spin character shape competing collective fluctuations.", "tier": "B_IMPORTANT_CONDMAT", "score": "7", "reason": "Theory on competing orders (CDW, AFM, orbital) in multiorbital Hubbard model, highly relevant.", "tags": ["theory", "CDW", "stronglycorrelated"], "image": "https://arxiv.org/html/2611.32983v1/Illustration_OrderParameters.png", "briefing": {"background": "강상관 전자계에서 전하 밀도파(CDW), 반강자성(AFM), 궤도 정렬 등 다양한 질서 변수들이 서로 경쟁하며 물질의 기저 상태를 결정하는 현상은 오랜 난제입니다.", "motivation": "기존 단일 밴드에 국한되었던 다채널 요동 장(MCFF) 이론을 다궤도 시스템으로 확장하여, 강상관 물질의 복잡한 물리적 불안정성을 규명하고자 했습니다.", "result": "반 채움 2궤도 Kanamori-Hubbard 모델에서 J/U 비에 따른 CDW와 AFM, 궤도 정렬 간의 경쟁 메커니즘을 효율적으로 분리하여 해석했습니다.", "implication": "복잡한 강상관 물질의 상도에서 어떤 요동이 지배적인지 계산  problem. Near Tc, this reference problem illustrates how the magnetoelectric coupling modifies the superconducting order parameter, while below Tc it provides a simple setting for describing the phase response, Pearl screening, and the interaction with a vortex. We then turn to the main problem of this work, a single N\\'eel domain wall, and derive analytical expressions for its equilibrium phase profile, spontaneous current, magnetic field, and vortex-wall interaction energy.We show that the N\\'eel wall acts as an extended magnetoelectric source and produces a vorticity-selective pinning landscape controlled by the competition between the wall width and the effective screening length. We further demonstrate that sufficiently strong magnetoelectric coupling can render a bound vortex-antivortex pair energetically favorable relative to the vortex-free state, even in the absence of an applied magnetic field. Our results provide an analytical framework for understanding magnetoelectric vortex pinning and vortex-antivortex nucleation by N\\'eel domain walls in spin-orbit coupled superconducting films.", "tier": "B_IMPORTANT_CONDMAT", "score": "7", "reason": "Theory of magnetoelectric phenomena in superconducting films, relevant to magnetism/superconductivity.", "tags": ["superconductivity", "magnetism", "domainwalls"], "image": "https://arxiv.org/html/2611.32379v1/neel_domain_wall_setup-3D_01.png", "briefing": {"background": "강자성체와 초전도체가 접합된 계에서 스핀-궤도 결합에 의해 발생하는 자성-전기적 결합(magnetoelectric coupling)은 초전도 상태에 비자명한 영향을 미칩니다.", "motivation": "박막 초전도체에서 N\\'eel 도메인 벽이 초전도 질서 변수와 보텍스 거동에 미치는 영향을 이론적으로 규명하고자 했습니다.", "result": "도메인 벽이 자발적 전류와 보텍스-반보텍스 쌍 생성을 유도하는 원동력이 되며, 보텍스 핀닝에 선택적으로 기여함을 증명했습니다.", "implication": "초전도 소자에서 도메인 벽을 이용해 보텍스 상태를 능동적으로 제어할 수 있는 가능성을 제시합니다.", "novelty": "외부 자기장 없이도 보텍스-반보텍스 쌍이 에너지적으로 유리해질 수 있음을 보여준 점이 흥미롭습니다.", "unresolved": "도메인 벽의 폭과 초전도 상관 길이에 따른 정량적 상도 작성은 여전히 복잡한 문제로 남아 있습니다.", "future_work": "자성층과 초전도층의 접합 시 발생하는 근접 효과가 실제 위상 초전도 후보 물질에서 어떻게 나타나는지 연구할 예정입니다.", "concepts": [{"term": "N\\'eel 도메인 벽", "why_emerged": "자성 박막에서 자기 모멘트가 면 내에서 회전하며 변하는 자성 구조를 기술하기 위해 필요합니다.", "origin": "Louis N\\'eel (1955).", "connections": "Bloch 벽, 스핀-궤도 토크."}, {"term": "Pearl 차폐 (Pearl screening)", "why_emerged": "초전도 박막이 침투 깊이보다 얇을 때 자기장 분포가 어떻게 변하는지 설명하기 위해 필요합니다.", "origin": "J. Pearl (1964).", "connections": "보텍스 역학, 런던 방정식."}], "english_summary": ["Studies superconducting response to N\\'eel domain walls in proximity-coupled films.", "Shows magnetoelectric coupling induces spontaneous currents and vortex-antivortex pairs.", "Provides an analytical model for vortex pinning controlled by domain wall features.", "Proposes domain walls as a tool for controlling vortex states in superconducting heterostructures."]}}, {"title": "Mixing and Preserving Properties of Non-van der Waals 2D Materials in Sandwich-like Heterostructures", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2611.32723", "authors": "Anastasiia Nihei, Rico Friedrich", "last_authors": "Anastasiia Nihei, Rico Friedrich", "summary": "Heterostructure interfaces created by stacking two-dimensional (2D) materials outline an appealing route towards achieving advanced electronic and magnetic functionalities at the nanoscale. Non-van der Waals (non-vdW) sandwich-like heterostructures (HSs) are build out of non-vdW 2D materials derived from non-layered crystals and establish a new frontier enabling strong interfacial coupling. Employing ab initio density functional theory (DFT), we investigate two classes of such trilayer HSs: purely non-vdW assemblies and hybrid vdW/non-vdW/vdW stacks. We show that non-vdW sandwiches undergo pronounced geometric reconstruction forming chemically bonded interfaces with large absolute binding energies up to an order of magnitude larger than those of conventional vdW HSs. These strong interactions drive extensive electronic hybridization, band gap renormalization, and tunable interlayer magnetic coupling. ], "english_summary": ["Investigated non-vdW 2D material sandwich heterostructures using DFT.", "Identified strong chemical bonding and electronic hybridization in non-vdW assemblies.", "Demonstrated that vdW encapsulation protects intrinsic electronic properties while allowing doping.", "Established a versatile platform design for tuning interfacial coupling strength."]}}, {"title": "Non-integer high harmonic generation from many-body nonadiabatic gating", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2611.31383", "authors": "Mingyao Guo, Luting Wang, Murali Suganya, et al.", "last_authors": "Yao Wang, David Hsieh", "summary": "High harmonic generation (HHG) in solids typically produces a rigid frequency comb locked to exact integer multiples of the drive photon energy. In strongly correlated materials, however, the light field can dynamically transform the electronic state on the timescale of harmonic generation itself, potentially violating this rule. Here, we report giant blueshifted, non-integer HHG in a cuprate Mott insulator Sr$_2$CuO$_3$ produced by mid-infrared excitations. Concurrent transient reflectivity measurements and time-dependent exact-diagonalization simulations of a driven Hubbard model support a many-body temporal gating mechanism that suppresses light emission on the trailing edge of the pulse, thereby blueshifting radiated harmonics in the frequency domain. Our findings establish HHG emission energy as a sensitive probe of quantum many-body dynamics and pave the way for exploration and manipulation of correlated electronic phases of matter with strong-field spectroscopy.", "tier": "B_IMPORTANT_CONDMAT", "score": "7", "reason": "HHG study of correlated cuprate Mott insulators with direct experimental relevance.", "tags": ["spectroscopy", "Mott", "cuprate"], "image": "https://arxiv.org/html/2611.31383v1/Fig2.png", "briefing": {"background": "강상관 전자계에서 강한 레이저 펄스를 이용해 고차 조화파(HHG)를 생성하면 물질 내부의 다체 전자 상태를 초고속으로 실시간 관측 mmetrically stacked graphene moir\\'{e} superlattices provide a reconfigurable platform for chiral phonons. We observe a finite degree of circular polarization for both chiral interlayer shear phonons and intralayer optical phonons. A chiral-phonon Raman-tensor model attributes this response to interfacial $C_{2}$-symmetry breaking together with Raman resonance within the van Hove singularity region. Reversing either the twist sense or the stacking order inverts the degree of circular polarization through the spatial transformations linking the corresponding stacking geometries. By tuning the excitation energy and twist angle, we achieve nearly full-range control of the degree of circular polarization of interlayer shear phonons, from $-1$ to $1$, while gate-induced interlayer potential redistribution enables substantial and reversible in situ modulation. These results establish asymmetrically stacked graphene moir\\'{e} superlattices as a versatile platform for generating and controlling chiral phonons, with implications for optoelectronic and quantum technologies.", "tier": "B_IMPORTANT_CONDMAT", "score": "7", "reason": "Chiral phonons in moire superlattices relevant to advanced spectroscopy.", "tags": ["graphene", "phonons", "spectroscopy"], "image": "https://arxiv.org/html/2611.32466v1/Fig2.png", "briefing": {"background": "카이랄 포논은 격자 진동이 각운동량을 가짐으로써 위상적 특성이나 광학적 선택 규칙을 제어할 수 있는 새로운 자유도를 제공하는 분야입니다.", "motivation": "비대칭적으로 적층된 그래핀 무아레 초격자에서 카이랄 포논을 원하는 대로 생성하고 제어할 수 있는 플랫폼을 구축하고자 했습니다.", "result": "Helicity-resolved Raman 분광법을 통해 층간 전단 포논(shear phonons)의 카이랄성을 확인하고, 적층 순서나 트위스트 각도를 통해 이를 0에서 1 사이로 자유롭게 변조함을 보였습니다.", "implication": "무아레 초격자를 통한 고체 내 포논의 위상적/광학적 자유도를 정교하게 제어함으로써 양자 정보 소자 응용 가능성을 열었습니다.", "novelty": "무아레 시스템에서 포논의 카이랄성을 게이트 전압이나 적층 구조로 reconfigurable하게 제어할 수 있음을 실험적으로 입증했습니다.", "unresolved": "카이랄 포논과 관련된 비정상 홀 효과나 열전 현상 등 실제 물성으로의 연결은 추가적인 실험적 탐색이 필요합니다.", "future_work": "카이랄 포논을 이용한 초전도성 제어 연구 또는 이종 구조 내에서의 포논-광자 결합 강도 최적화.", "concepts": [{"term": "Chiral Phonons", "why_emerged": "진동 모드가 갖는 각운동량을 통해 광학적 선택 규칙과 비등방적 거동을 제어하기 위해 필요함.", "origin": "Zhang et al. (2015, 초기 제안 및 관측).", "connections": "Berry 곡률, 위상 포노닉스."}, {"term": "Moiré Superlattice", "why_emerged": "두 층 이상의 원자층을 겹쳐 격자 상수를 조절함으로써 전자 밴드 구조를 인위적으로 설계하기 위해 필요함.", "origin": "Bistritzer and MacDonald (2011, twisted bilayer graphene).", "connections": "강상관 전자계, 초전도, 양자 위상 물질."}], "english_summary": ["Demonstrated reconfigurable chiral phonons in asymmetrically stacked graphene moiré superlattices.", "Used helicity-resolved Raman spectroscopy to observe circular polarization of interlayer and intralayer phonons.", "Achieved in situ control of chiral phonon degrees using twist angle and gate-induced potential.", "Highlighted the platform's potential for optoelectronic and quantum information technologies."]}}, {"title": "Reversible Self-Assembly of a P-Ir(100)-P Trilayer on Ir(111)", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2611.32706", "authors": "M. Bassotti, J. Sivianes, J. Dai, et al.", "last_authors": "A. Verdini, F. Schiller", "summary": "Adsorbate-induced surface reconstructions offer a route to engineer low-dimensional materials with atomic arrangements and electronic properties fundamentally different from those of their parent substrates. Here, we demonstrate how phosphorus adsorption on Ir(111) drives the formation of an incommensurate P-Ir-P trilayer, in which a square Ir(100)-like atomic lattice emerges from the underlying hexagonal crystal. This transformation illustrates how strong adsorbate-substrate interactions can stabilize unconventional atomic coordination within an ultrathin metallic structure. Remarkably, the process is reversible, allowing the system to switch between distinct structural phases through phosphorus deposition and thermal annealing. The resulting trilayer exhibits a two-dimensional, semimetal-like electronic structure dominated by Ir 5d states. Our findings establish adsorbate-dr ough surface chemistry."]}}, {"title": "Scanning Gate Microscopy Modulation of Supercurrent in Graphene Josephson Junctions (Appl. Phys. Lett.)", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2607.26689", "authors": "Ivan Villani, Samuele Fracassi, Niccol\\`o Traverso Ziani, et al.", "last_authors": "Sergio Pezzini, Stefan Heun", "summary": "Graphene Josephson junctions (JJs) represent an excellent platform for quantum technologies, thanks to the combination of high carrier mobility, ballistic transport, and gate-tunable critical currents, preserved even under quantizing magnetic fields. Investigating the spatial distribution of supercurrent flow could be crucial for elucidating transport mechanisms and advancing the engineering of these devices. In this work, we employ a scanning gate microscope to investigate supercurrent transport in hexagonal boron nitride-encapsulated graphene JJs. We study the supercurrent modulation as a function of tip voltage bias and tip-to-sample distance and provide a complete characterization of the tip-induced modulation. Our experimental results are quantitatively consistent with numerical simulations and pave the way toward local mapping and manipulation of gate-tunable superconducting phenomena with unprecedented spatial resolution.", "tier": "B_IMPORTANT_CONDMAT", "score": "7", "reason": "Local scanning gate probe of supercurrent in graphene, relevant to vdW heterostructure experimental techniques.", "tags": ["graphene", "superconduct", "transport", "scanning-gate-microscopy"], "image": "https://arxiv.org/html/2607.26689v2/Fig1_v6_260728.png", "briefing": {"background": "그래핀 기반 조셉슨 접합(JJ)은 고이동도 및 게이트 조절 가능성으로 양자 소자 응용의 핵심 플랫폼이지만, 접합 내부의 국소적인 초전류 흐름을 시각화하는 것은 여전히 실험적 도전 과제입니다.", "motivation": "스캐닝 게이트 현미경(SGM)을 사용하여 hBN으로 캡슐화된 그래핀 조셉슨 접합 내에서 초전류의 공간적 분포와 게이트 조절 특성을 정밀하게 분석하고자 했습니다.", "result": "팁의 전압과 거리 변화에 따른 초전류 변조를 성공적으로 측정하였으며, 이는 수치 시뮬레이션 결과와 정량적으로 일치함을 보였습니다.", "implication": "초전류의 국소적 경로를 매핑하 ing as a magnetization-free readout mechanism for spintronic devices.", "Establishes compensated ferrimagnets as building blocks for future spintronics."]}}, {"title": "Stacking-Directed Polarization and Excitonic Engineering in MoS2/MoSe2 van der Waals Heterostructures", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2606.22014", "authors": "Mohammed El Amine Miloudi, Oliver K\\\"uhn", "last_authors": "Mohammed El Amine Miloudi, Oliver K\\\"uhn", "summary": "The stacking-dependent polarization and excitonic response of MoS$_2$/MoSe$_2$ heterostructures were investigated using GW+BSE many-body perturbation theory. While homobilayer MoS$_2$ exhibited a switchable interlayer dipole driven by registry-induced symmetry breaking, the MoS$_2$/MoSe$_2$ hetero-interface remained pinned by the intrinsic chemical potential mismatch between sulfur and selenium. In 2L-MoS$_2$/MoSe$_2$ trilayers, the stacking sequence enabled a deterministic control of photogenerated electrons between the central and bottom MoS$_2$ layers, governed by internal electric fields and quasiparticle band-edge shifts of 60--70~meV. Our calculations predicted a 36~meV interlayer excitonic shift, in remarkable agreement with recent experiments. These results elucidate the microscopic link between atomic registry and many-body interactions, establishing transition metal dichalcogenide trilayers as a potential platform for sliding ferroelectricity and programmable optoelectronic functionalities.", "tier": "B_IMPORTANT_CONDMAT", "score": "7", "reason": "Study of vdW heterostructures and excitonic engineering with relevance to electronic structure.", "tags": ["vanderWaals", "heterostructure", "electronicstructure"], "image": "https://arxiv.org/html/2606.22014v4/Figures/ex1.jpg", "briefing": {"background": "반데르발스(vdW) 이종접합은 층간 적층 구조와 원자 정렬을 조절하여 소재의 전자 구조와 광학적 특성을 튜닝할 수 있는 차세대 플랫폼입니다.", "motivation": "MoS2/MoSe2 이종접합에서 적층 방식이 층간 쌍극자 모멘트와 엑시톤 반응에 미치는 영향을 규명하고, 이를 통해 광전자 소자 구현 가능 ion parity. Their sensitivity to noise is expected to decrease exponentially with increasing separation between the Majoranas, a suppression known as topological protection [ 1 ] . Kitaev chains engineered in quantum dot–superconductor arrays provide a tunable platform in which separated Majorana zero modes can emerge at the ends of the chain [ 1 , 2 ] , even in two-site chains [ 3 ] . These minimal-chain modes are known as poor man’s Majoranas and retain characteristic Majorana properties, including near-zero energy and equal electron–hole character, but have only limited protection [ 3 , 4 , 5 ] . A key outstanding challenge is to move beyond identifying such modes in electrical transport measurements and achieve coherent qubit control in the time domain. Here, we demonstrate a Majorana parity qubit by realizing coherent coupling between two-site Kitaev chains [ 3 , 6 , 7 , 8 ] . Since total fermion parity is conserved, the system separates into global even and odd parity manifolds. We observe coherent parity oscillations in both manifolds with equal oscillation frequencies at the Majorana sweet spot, as predicted for isolated Majorana zero modes [ 6 ] . We further show that the oscillation frequency and coherence depend systematically on inter-chain coupling and quantum-dot detunings, in close agreement with our model for short, partially protected chains. Our results establish the first coherent control of a Majorana qubit, encoded in the fermion parity of Majorana zero modes in minimal Kitaev chains.", "tier": "C_MAYBE", "score": "8", "reason": "Experimental realization of coherent Majorana-like qubit control, high relevance to topological superconductor research.; tier capped to C: formal/generic theory watch", "tags": ["Majorana", "superconduct", "topological"], "image": "https://arxiv.org/html/2607.09511v2/Fig1.png", "briefing": {"background": "토폴로지 양자 컴퓨팅을 위해 마요라나 제로 모드(MZM)를 활용한 위상 보호 큐빗 구현이 현대 응집물질물리의 주요 과제입니다.", "motivation": "정적인 측정(전기적 수송)을 넘어, 최소화된 키타예프 체인에서 시간 영역의 간섭성(coherence) 제어를 증명하고자 합니다.", "result": "두 개의 2-사이트 키타예프 체인을 결합하여 페르미 패리티를 이용한 양자 상태 제어를 실현하고, 간섭성 패리티 진동을 관측하였습니다.", "implication": "마요라나 기반 큐빗의 실질적인 조작 가능성을 보여주며, fault-tolerant 양자 컴퓨팅으로 나아가는 중요한 이정표가 될 것입니다.", "novelty": "전통적인 MZM 측정에서 벗어나 시간 영역의 코히어런트 제어를 최초로 성공시킨 사례로, 독자 프로필의 토폴로지 물질 응용 연구와 직결됩니다.", "unresolved": "현재의 시스템은 보호 기능이 제한적이며, 더 긴 체인으로 확장했을 때의 위상 보호 능력을 검증해야 합니다.", "future_work": "더 긴 사슬 구조로의 확장 및 게이트 조작을 통한 고차원 큐빗 연산 연구가 이어질 것입니다.", "concepts": [{"term": "Kitaev Chain", "why_emerged": "1차원 전자 시스템에서 위상 초전도 상태와 마요라나 페르미온을 구현하기 위한 이론적 모델.", "origin": "Alexei Kitaev, 2001년.", "connections": "토폴로지 초전도체, 양자점 어레이, 마요라나 제로 모드."}, {"term": "Majorana Parity Qubit", "why_emerged": "전자 패리티를 정보의 단위로 사용하여 외부 노이즈로부터 정보를 보호하기 위해 제안됨.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "토폴로지 보호, 비국소적 정보 저장."}], "english_summary": ["Demonstrated coherent parity oscillations in coupled Kitaev chains.", "Realized the first coherent control of a Majorana parity qubit.", "Confirmed parity conservation in minimal-chain Majorana systems.", "Establishes a path toward fault-tolerant topological quantum computation."]}}, {"title": "Coherent parity oscillations in coupled minimal Kitaev chains", "journal": "Nature", "source": "Gemini", "link": "https://www.nature.com/articles/s41586-026-11309-6", "authors": "Francesco Zatelli, Bart Roovers, Nick van Loo, et al.", "last_authors": "Michael Wimmer, Leo P. Kouwenhoven", "summary": "Coherent time-resolved rotations between parity states encoded by four poor man’s Majoranas are demonstrated in two coupled minimal Kitaev chains, providing a foundation for topologically protected qubits in longer chains.", "tier": "C_MAYBE", "score": "7", "reason": "Coherent parity oscillations between Majorana states in artificial Kitaev chains.; tier capped to C: formal/generic theory watch", "tags": ["Majorana", "topological-physics", "experiment"], "image": "https://media.springernature.com/m685/springer-static/image/art%3A10.1038%2Fs41586-026-11309-6/MediaObjects/41586_2026_11309_Fig1_HTML.png", "briefing": {"background": "위상 양자 컴퓨팅을 위해 마요라나 구속 상태(Majorana Bound States)를 이용한 위상적으로 보호되는 큐비트를 구현하려는 노력이 지속되고 있습니다.", "motivation": "단일 마요라나 상태를 제어하는 것을 넘어, 여러 개의 'poor man's Majorana' 상태를 결합한 시스템에서 양자 정보의 기본 단위인 패리티(parity) 상태를 어떻게 조작할 수 있는지 실증하고자 함.", "result": "두 개의 결합된 최소 키타예프 사슬(minimal Kitaev chains)에서 네 개의 마요라나 모드 사이의 코히런트한 패리티 진동을 성공적으로 관측함.", "implication": "이 결과는 더 긴 사슬 시스템으로 확장하여 오류 방지 큐비트를 설계하는 데 필요한 기본적인 제어 기술과 토폴로지적 보호 메커니즘을 증명함.", "novelty": "실제 실험적 플랫폼에서 마요라나 기반 큐비트의 패리티 상태 제어를 위한 시간 분해 측정 기술을 보여준 점이 중요함.", "unresolved": "실제 위상 큐비트로서의 긴 결맞음 시간 확보 및 복잡한 대규모 시스템에서의 비가환 브레이딩 실현은 여전히 도전 과제임.", "future_work": "더 긴 키타예프 사슬을 구축하고, 다중 큐비트 게이트 연산을 위한 마요라나 브레이딩 실험으로 나아갈 것으로 예상됨.", "concepts": [{"term": "Majorana Bound States", "why_emerged": "입자와 반입자가 동일한 성질을 갖는 준입자로, 위상적으로 보호된 양자 정보를 저장하는 데 유리함.", "origin": "Ettore Majorana가 1937년 제안, 응집물질물리에서는 Alexei Kitaev가 2001년 제안.", "connections": "Kitaev chain, topological quantum computing."}, {"term": "Poor man's Majorana", "why_emerged": "복잡한 토폴로지적 초전도체 대신, 양자점과 초전도체의 결합을 통해 마요라나 특성을 모사하기 위해 고안됨.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "Kitaev chain, superconducting proximity effect."}], "english_summary": ["Demonstrates coherent parity oscillations in coupled minimal Kitaev chains.", "Uses four Majorana bound states to encode and control parity-based quantum information.", "Provides experimental foundation for building topological qubits in longer chains.", "Validates time-resolved control of topological protected states."]}}, {"title": "Classification of spin space groups and crystal magnetic orders", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2611.33099", "authors": "Zheng Zhang, Peiyuan Wang, Y. X. Zhao", "last_authors": "Peiyuan Wang, Y. X. Zhao", "summary": "Spin space groups (SSGs) describe magnetic crystals in the limit of negligible spin-orbit coupling, where spatial and spin rotations decouple. Although algebraic enumerations of SSGs exist, their abstract mathematical approaches obscure the physical meaning of the resulting classifications, leaving the direct correspondence between SSGs and real-space magnetic orders unestablished. Here, we present a physically motivated framework for enumerating and classifying SSGs based on their translation holonomy---the image of the spatial lattice translation group under the spin homomorphism. The three classes of abelian images in $SO(3)$ divide SSGs into three basic translation types. Translation holonomy constrains the spin operations associated with point-group elements, yielding a complete enumeration of SSGs organized by a physical hierarchy. Within this framework, translation holonomy classifies SSGs and magnetic orders into 17 universal spin-lattice types, each with unambiguous Bragg-peak geometries and polarization signatures in neutron diffraction. Beyond organizing known magnetic orders, this framework directly predicts four universal physical phenomena: (i) exact magnetization compensation enforced by certain spin-lattice types; (ii) an exact group-theoretic criterion for the emergence of noncommuting Brillouin zones; (iii) a new type of 3Q magnetic order with vanishing octupoles; and (iv) the realization of strictly collinear momentum-space spin textures protected by reflection-staggered coplanar spin lattices. We also construct a spin space group database organized according to this physical hierarchy.", "tier": "C_MAYBE", "score": "7", "reason": "Theoretical framework classifying spin space groups and magnetic orders, with implications for neutron diffraction.; tier capped to C: formal/generic theory watch", "tags": ["theory", "quantummagnetism", "crystalstructure", "neutronscattering"], "image": "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAsAAAAOCAYAAAD5YeaVAAAAAXNSR0IArs4c6QAAAAZiS0dEAP8A/wD/oL2nkwAAAAlwSFlzAAALEwAACxMBAJqcGAAAAAd0SU1FB9wKExQZLWTEaOUAAAAddEVYdENvbW1lbnQAQ3JlYXRlZCB3aXRoIFRoZSBHSU1
