<!DOCTYPE html>

<meta charset='UTF-8'>
<meta name='viewport' content='width=device-width, initial-scale=1.0'>
<title>Daily Paper Slideshow</title>
<style>
  :root {
    color-scheme: light;
    --bg: #f6f7f4;
    --paper: #ffffff;
    --ink: #111827;
    --muted: #64748b;
    --line: #d8ddd2;
    --accent: #176b87;
    --accent-2: #9a3412;
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; overflow: auto; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: var(--bg); color: var(--ink); }
  .shell { max-width: 1500px; min-height: 100vh; margin: 0 auto; padding: 14px 18px; display: flex; flex-direction: column; }
  .topbar { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 16px; }
  .top-actions { display: flex; align-items: center; gap: 10px; }
  .topbar a, button { border: 1px solid var(--line); border-radius: 8px; background: var(--paper); color: var(--ink); padding: 10px 14px; font-weight: 700; text-decoration: none; cursor: pointer; }
  button.primary { background: var(--accent); border-color: var(--accent); color: white; }
  button:disabled { opacity: 0.45; cursor: not-allowed; }
  .counter { color: var(--muted); font-weight: 700; }
  .slide { min-height: calc(100vh - 82px); background: var(--paper); border: 1px solid var(--line); border-radius: 10px; padding: 18px; box-shadow: 0 18px 42px rgba(15, 23, 42, 0.10); display: grid; grid-template-columns: minmax(310px, 0.86fr) minmax(0, 1.55fr); gap: 18px; overflow: visible; }
  .paper-head { min-width: 0; min-height: 0; overflow: visible; display: flex; flex-direction: column; gap: 12px; }
  .figure { margin: 0; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: #f8fafc; }
  .figure img { display: block; width: 100%; max-height: 41vh; object-fit: contain; background: white; }
  .figure figcaption { padding: 7px 10px; color: var(--muted); font-size: 12px; line-height: 1.3; }
  .head-text { display: flex; flex-direction: column; gap: 9px; min-width: 0; }
  .badges { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .badge { border-radius: 999px; padding: 5px 9px; background: #eef2ff; color: #3730a3; font-size: 12px; font-weight: 800; }
  .score { background: #fee2e2; color: #991b1b; }
  h1 { margin: 0; font-size: 25px; line-height: 1.15; letter-spacing: 0; overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
  h1 a { color: inherit; text-decoration-color: rgba(23, 107, 135, 0.35); text-decoration-thickness: 2px; text-underline-offset: 4px; }
  h1 a:hover { color: var(--accent); text-decoration-color: var(--accent); }
  .meta, .authors, .why, .abstract { font-size: 13px; line-height: 1.45; }
  .meta, .authors { color: var(--muted); }
  .why strong, .abstract strong, .authors strong { color: var(--ink); }
  .authors { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .why { border-left: 4px solid var(--accent-2); padding-left: 10px; color: #374151; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .abstract { border-top: 1px solid var(--line); padding-top: 14px; color: #374151; }
  .original-abstract { border-top: 1px solid var(--line); padding-top: 10px; color: #374151; font-size: 11.5px; line-height: 1.35; overflow-wrap: anywhere; }
  .original-abstract strong { display: block; margin-bottom: 4px; color: var(--ink); }
  .tags { display: flex; flex-wrap: wrap; gap: 8px; }
  .tag { border-radius: 999px; padding: 4px 8px; background: #f1f5f9; color: #475569; font-size: 12px; font-weight: 700; }
  .head-text > .link { display: none; }
  .briefing { min-width: 0; min-height: 0; overflow: visible; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); grid-auto-rows: minmax(0, auto); align-content: start; gap: 11px 18px; border-top: 0; padding-top: 0; }
  .brief-section { min-width: 0; }
  .brief-section.wide { grid-column: 1 / -1; }
  .brief-section h2 { margin: 0 0 4px; font-size: 14px; line-height: 1.22; color: #0f766e; letter-spacing: 0; }
  .brief-section p, .brief-section li { margin: 0; font-size: 12.5px; line-height: 1.42; color: #1f2937; overflow-wrap: anywhere; }
  .brief-section ul { margin: 0; padding-left: 20px; }
  .concepts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 9px 14px; }
  .concept { border-top: 1px solid var(--line); padding-top: 7px; }
  .concept h3 { margin: 0 0 4px; font-size: 13px; color: #7c2d12; letter-spacing: 0; }
  .concept p { margin: 2px 0 0; font-size: 11.5px; line-height: 1.35; color: #374151; overflow-wrap: anywhere; }
  .concept b { color: #111827; }
  .link { color: var(--accent); font-weight: 800; text-decoration: none; }
  .empty { padding: 48px; background: var(--paper); border: 1px solid var(--line); border-radius: 12px; color: var(--muted); }
  @media (max-width: 860px) {
    .shell { padding: 14px; }
    .topbar, .top-actions { align-items: stretch; flex-direction: column; }
    .slide, .briefing, .concepts { grid-template-columns: 1fr; }
    .slide { min-height: auto; overflow: visible; display: grid; }
    h1 { font-size: 28px; }
  }
</style>

const slides = [{"title": "Energy- and momentum-resolved Cooper-pair emission from a cuprate superconductor", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2611.09857", "authors": "Henry Amir, Jack Zwettler, Ka Ho Wong, et al.", "last_authors": "Dirk K. Morr, Fahad Mahmood", "summary": "Superconductivity arises from Cooper pairing, but conventional photoemission probes electrons individually rather than as pairs. Here we report the observation of Cooper-pair emission from an optimally doped cuprate superconductor using two-electron angle-resolved photoemission (2e-ARPES). Below the superconducting transition, we observe a distinct two-electron emission peak at zero pair binding energy and zero pair momentum that disappears in the normal state, revealing the characteristic fingerprint of a Cooper pair. Unexpectedly, the joint energy distribution broadens markedly along the relative-energy axis as temperature decreases, while the total energy width remains nearly unchanged. This anomalous behavior cannot be explained by instrumental resolution, static disorder or thermal broadening, and instead points to scattering processes involving collective excitations of the superconductor. Our results establish 2e-ARPES as a probe of both Cooper-pair emission and the many-body dynamics of the superconducting state.", "tier": "A_MUST_READ", "score": "10", "reason": "Direct hit: novel multi-electron photoemission (2e-ARPES) experiment on a superconducting material.", "tags": ["ARPES", "superconductivity", "experiment"], "image": "https://arxiv.org/html/2611.09857v2/fig1_v8.png", "briefing": {"background": "초전도 현상의 핵심인 쿠퍼 쌍(Cooper pair)은 전하 운반체이나, 기존의 ARPES는 단일 전자만을 관측할 수 있어 쿠퍼 쌍의 직접적인 에너지 및 운동량 상태를 분석하는 데 한계가 있었습니다.", "motivation": "단일 전자 분광법의 한계를 극복하고, 쿠퍼 쌍의 방출 과정을 직접 관측하여 초전도체의 다체계 역학을 밝히기 위해 2e-ARPES(이전자 광전자 분광법)를 도입했습니다.", "result": "최적 도핑된 구리 산화물 초전도체에서 초전도 상태로 전이될 때만 나타나는 제로 바인딩 에너지 및 제로 운동량의 이전자 방출 피크를 관측했습니다. 온도 저하에 따라 상대 에너지 축에서 피크 폭이 넓어지는 특이 현상을 발견했습니다.", "implication": "2e-ARPES가 초전도 상태 내의 쿠퍼 쌍뿐만 아니라 집단적 들뜸(collective excitation)과 관련된 다체계 상호작용을 연구하는 강력한 도구가 될 수 있음을 증명했습니다.", "novelty": "기존 ARPES로는 불가능했던 쿠퍼 쌍의 직접적인 에너지-운동량 분해능 관측을 최초로 구현했습니다. 이는 귀하가 관심을 가지는 초전도체의 전자 구조 및 강상관 물리 연구에 매우 중요한 진전입니다.", "unresolved": "온도가 낮아짐에 따라 나타나는 상대 에너지 분포의 급격한 확장의 물리적 기원이 아직 완전히 규명되지 않았으며, 격자 결함이나 열적 영향으로 완벽히 설명되지 않는 잔여 의문이 존재합니다.", "future_work": "다른 초전도체 물질군에 대한 2e-ARPES 적용 및 피크 폭 확장에 기여하는 집단적 들뜸의 구체적인 성분(예: 스핀 들뜸 등) 분석이 필요합니다.", "concepts": [{"term": "2e-ARPES", "why_emerged": "단일 전자 ARPES가 초전도 쿠퍼 쌍의 결합 상태를 직접적으로 보여주지 못하기 때문.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "기존 ARPES 기술과 coincidence detection 기법의 결합."}, {"term": "Cooper-pair emission", "why_emerged": "BCS 이론에서 초전도성의 근간인 전자쌍의 거동을 직접 실험적으로 확인하기 위함.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "BCS 이론, 고온 초전도체의 쌍 형성 메커니즘 연구."}], "english_summary": ["Demonstrated the first 2e-ARPES measurement on an optimally doped cuprate.", "Detected direct Cooper-pair emission peaks appearing below the superconducting transition.", "Observed anomalous peak broadening at lower temperatures indicating collective excitation scattering.", "Established 2e-ARPES as a tool for probing many-body dynamics in superconductors."]}}, {"title": "Magneto-ARPES as a direct probe of Berry Curvature and the Orbital Magnetic Moment", "journal": "arXiv_CondMat", "source": "keyword", "link": "https://arxiv.org/abs/2611.30968", "authors": "Seohyun Kong, Bernd Braunecker, Luke C. Rhodes", "last_authors": "Bernd Braunecker, Luke C. Rhodes", "summary": "The Berry curvature and orbital magnetic moment are central to the understanding of electronic transport phenomena such as the anomalous Hall effect, yet measuring these quantities directly with momentum resolution remains experimentally challenging. Here we show that angle-resolved photoemission spectroscopy measurements in a weak magnetic field (magneto-ARPES) provide a direct route to both quantities. We develop an analytic theory ory-based and large-scale facilities. Its extension to time-resolved measurements has recently enabled major advances, ranging from the femtosecond imaging of exciton wavefunctions to dark-field photoelectron microscopy of light-induced dynamics and strong light-matter interactions. However, the rapid acquisition of high-dimensional data sets (including electron in-plane momenta $k_x$ and $k_y$, kinetic energy $E_\\mathrm{kin}$, time $\\Delta t$, and more) poses substantial challenges for data handling and analysis. A typical workflow encompasses data acquisition, exploratory visualization, calibration and targeted feature extraction, with data management ideally guided by FAIR principles. Here, we present momipy, a Python package that streamlines the momentum microscopy data analysis workflow efficiently and at low computational cost. Among other features, momipy provides interactive 4D data visualization, energy and momentum calibration, space-charge correction, and a broad selection of multidimensional data analysis routines, including binning, momentum-map extraction and time-, energy- and momentum-resolved model fitting. momipy is accompanied by a selection of interactive example scripts, supporting adoption of momipy by both experienced researchers and users new to momentum microscopy.", "tier": "A_MUST_READ", "score": "9", "reason": "Tool for ARPES/momentum microscopy, directly relevant to the user's primary experimental expertise.", "tags": ["method", "ARPES", "photoemission"], "image": "https://arxiv.org/html/2611.25888v2/fig1_v12.png", "briefing": {"background": "운동량 현미경(Momentum microscopy)은 광전자 분광법의 한 갈래로, 전자 구조의 밴드 구조를 kx, ky 평면 전체에 걸쳐 한 번에 측정할 수 있는 강력한 실험 기법입니다. 시간 분해(time-resolved) 측정과 결합할 경우 엑시톤 동역학이나 빛에 의한 전자 상태 변화를 실시간으로 관찰할 수 있게 해줍니다.", "motivation": "운동량 현미경은 4차원 이상의 고차원 데이터를 생성하는데, 기존의 분석 도구들은 이러한 대용량 데이터를 다루고 교정하며 통찰력 있는 정보를 추출하는 데 계산 복잡도가 높고 접근성이 떨어지는 문제가 있었습니다.", "result": "연구진은 Python 기반 분석 패키지인 'momipy'를 개발했습니다. 이 도구는 대용량 데이터 시각화, 에너지 및 운동량 교정, 공간 전하(space-charge) 효과 보정, 다차원 피팅 루틴을 포함하여 연구자가 효율적으로 데이터를 분석할 수 있는 통합 환경을 제공합니다.", "implication": "운동량 현미경을 사용하는 실험 연구자들에게 분석의 진입 장벽을 낮추고, 데이터 처리의 표준화(FAIR 원칙 준수)를 도와 실험 데이터로부터 물리적 결론을 도출하는 속도를 크게 향상시킬 것으로 예상됩니다.", "novelty": "데이터 처리의 병목 현상을 해결하기 위한 오픈소스 라이브러리를 제안했으며, 특히 ARPES 및 운동량 현미경 사용자들에게 실질적인 워크플로우 효율성을 제공합니다.", "unresolved": "소프트웨어의 범용성 측면에서 모든 사용자 정의 실험 구성(특수한 빔라인 구성 등)에 즉각 대응 가능한지 여부와 장기적인 유지보수 계획은 지켜봐야 합니다.", "future_work": "더 다양한 사용자 데이터셋에 대한 검증 및 커뮤니티 기반의 기능 확장과 최적화가 지속될 것으로 보입니다.", "concepts": [{"term": "Momentum Microscopy", "why_emerged": "기존 ARPES의 제한된 시야각 문제를 해결하고 3D 밴드 구조의 전체적인 k-space를 한꺼번에 시각화하기 위해 필요했습니다.", "origin": "최근 10~20년간 광전자 분광 장비의 발전과 함께 고도화됨.", "connections": "기존의 각분해광전자분광(ARPES), 광전자 방출 전자 현미경(PEEM)과 긴밀히 연결됨."}, {"term": "Space-charge correction", "why_emerged": "초고속 펄스 레이저 사용 시 광전자 밀도가 너무 높으면 전자 간 척력으로 인해 운동량 및 에너지 해상도가 저하되기 때문입니다.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "시간 분해 광전자 분광(TR-ARPES)의 필수적인 데이터 처리 과정."}], "english_summary": ["Momentum microscopy provides efficient electronic band mapping in 4D space.", "The momipy Python package streamlines complex data workflows for this technique.", "Key features include interactive visualization, calibration, and space-charge correction.", "This tool significantly lowers the barrier for analyzing high-dimensional photoemission data."]}}, {"title": "Berry curvature induced anomalous Hall and Nernst effects in the conical ferromagnet CeMn2Ge2", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/w894-8jgw", "authors": "Yuzhao Tang, Zhiyang Chen, Bangyong Yan, et al.", "last_authors": "Jun Hu, Baomin Wang", "summary": "The anomalous Hall effect (AHE) and its thermoelectric counterpart, the anomalous Nernst effect (ANE), are sensitive probes of electronic states associated with Berry curvature (BC) in magnetic materials. In this work, we report on the AHE and ANE in single-crystalline ${\\mathrm{CeMn}}_{2}{\\mathrm{G…", "tier": "B_IMPORTANT_C ets using a Green's function formalism.", "Dual Fano resonance is identified as a unique spectral fingerprint of impurity-altermagnet coupling.", "Landau quantization exhibits nodal spin contrast, offering a path for spin-resolved STS imaging.", "Provides a theoretical framework for identifying altermagnetic orders via scanning tunneling spectroscopy."]}}, {"title": "Universal scaling of the spin Hall effect", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/hqwc-c7hj", "authors": "Atsuo Shitade, Naoto Nagaosa", "last_authors": "Atsuo Shitade, Naoto Nagaosa", "summary": "In the spin Hall effect, an electric field drives a transverse flow of spin that accumulates at the edges. Because spin current has no unique definition when spin-orbit coupling is present, the authors calculate here the spin accumulation coefficient instead, taking interband and impurity effects into account for Dirac electrons. As with the anomalous Hall effect, they find three regimes as the electric conductivity varies, including the dirty regime with a new scaling exponent of 0.6.", "tier": "B_IMPORTANT_CONDMAT", "score": "9", "reason": "Theoretical study on universal scaling of spin Hall effect in Dirac electrons, connecting to anomalous Hall.", "tags": ["theory", "Halleffect", "spinHalleffect", "Diracmaterials", "topological"], "image": "", "briefing": {"background": "스핀 홀 효과(SHE)는 전기장이 인가될 때 전류와 수직 방향으로 스핀 전류가 흐르는 현상으로, 스핀-궤도 결합이 중요한 양자 재료의 핵심 물성입니다.", "motivation": "스핀-궤도 결합 하에서 스핀 전류를 정의하는 모호함과 불순물 산란이 스핀 홀 전도도에 미치는 보편적인 스케일링 특성을 명확히 하기 위함입니다.", "result": "디락 전자계에서 전기 전도도에 따라 세 가지 영역이 존재함을 규명했으며, 특히 불순물이 많은 'dirty' 영역에서 스핀 홀 전도도가 새로운 스케일링 지수 0.6을 가짐을 발견했습니다.", "implication": "이상 홀 효과(AHE)와 유사한 물리적 논리 체계 내에서 스핀 홀 효과의 보편적인 거동을 해석할 수 있게 되어, 위상 재료의 전도 현상을 통합적으로 이해할 수 있습니다.", "novelty": "복잡한 디락 물질에서 스핀 전류의 정의 문제를 스핀 축적 계수 계산으로 우회하여, 전도도-전류 관계의 새로운 보편적 스케일링 법칙을 제시했습니다.", "unresolved": "다양한 디락 물질의 밴드 곡률(Berry curvature)이 스케일링 지수 0.6의 보편성에 미치는 영향은 실험적 확인이 더 필요합
