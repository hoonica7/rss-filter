<title>Daily Paper Slideshow</title>
<style>
  :root {
    color-scheme: light;
    --bg: #f6f7f4;
    --paper: #ffffff;
    --ink: #111827;
    --muted: #64748b;
    --line: #d8ddd2;
    --accent: #176b87;
    --accent-2: #9a3412;
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; overflow: auto; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: var(--bg); color: var(--ink); }
  .shell { max-width: 1500px; min-height: 100vh; margin: 0 auto; padding: 14px 18px; display: flex; flex-direction: column; }
  .topbar { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 16px; }
  .top-actions { display: flex; align-items: center; gap: 10px; }
  .topbar a, button { border: 1px solid var(--line); border-radius: 8px; background: var(--paper); color: var(--ink); padding: 10px 14px; font-weight: 700; text-decoration: none; cursor: pointer; }
  button.primary { background: var(--accent); border-color: var(--accent); color: white; }
  button:disabled { opacity: 0.45; cursor: not-allowed; }
  .counter { color: var(--muted); font-weight: 700; }
  .slide { min-height: calc(100vh - 82px); background: var(--paper); border: 1px solid var(--line); border-radius: 10px; padding: 18px; box-shadow: 0 18px 42px rgba(15, 23, 42, 0.10); display: grid; grid-template-columns: minmax(310px, 0.86fr) minmax(0, 1.55fr); gap: 18px; overflow: visible; }
  .paper-head { min-width: 0; min-height: 0; overflow: visible; display: flex; flex-direction: column; gap: 12px; }
  .figure { margin: 0; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: #f8fafc; }
  .figure img { display: block; width: 100%; max-height: 41vh; object-fit: contain; background: white; }
  .figure figcaption { padding: 7px 10px; color: var(--muted); font-size: 12px; line-height: 1.3; }
  .head-text { display: flex; flex-direction: column; gap: 9px; min-width: 0; }
  .badges { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .badge { border-radius: 999px; padding: 5px 9px; background: #eef2ff; color: #3730a3; font-size: 12px; font-weight: 800; }
  .score { background: #fee2e2; color: #991b1b; }
  h1 { margin: 0; font-size: 25px; line-height: 1.15; letter-spacing: 0; overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
  h1 a { color: inherit; text-decoration-color: rgba(23, 107, 135, 0.35); text-decoration-thickness: 2px; text-underline-offset: 4px; }
  h1 a:hover { color: var(--accent); text-decoration-color: var(--accent); }
  .meta, .authors, .why, .abstract { font-size: 13px; line-height: 1.45; }
  .meta, .authors { color: var(--muted); }
  .why strong, .abstract strong, .authors strong { color: var(--ink); }
  .authors { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .why { border-left: 4px solid var(--accent-2); padding-left: 10px; color: #374151; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .abstract { border-top: 1px solid var(--line); padding-top: 14px; color: #374151; }
  .original-abstract { border-top: 1px solid var(--line); padding-top: 10px; color: #374151; font-size: 11.5px; line-height: 1.35; overflow-wrap: anywhere; }
  .original-abstract strong { display: block; margin-bottom: 4px; color: var(--ink); }
  .tags { display: flex; flex-wrap: wrap; gap: 8px; }
  .tag { border-radius: 999px; padding: 4px 8px; background: #f1f5f9; color: #475569; font-size: 12px; font-weight: 700; }
  .head-text > .link { display: none; }
  .briefing { min-width: 0; min-height: 0; overflow: visible; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); grid-auto-rows: minmax(0, auto); align-content: start; gap: 11px 18px; border-top: 0; padding-top: 0; }
  .brief-section { min-width: 0; }
  .brief-section.wide { grid-column: 1 / -1; }
  .brief-section h2 { margin: 0 0 4px; font-size: 14px; line-height: 1.22; color: #0f766e; letter-spacing: 0; }
  .brief-section p, .brief-section li { margin: 0; font-size: 12.5px; line-height: 1.42; color: #1f2937; overflow-wrap: anywhere; }
  .brief-section ul { margin: 0; padding-left: 20px; }
  .concepts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 9px 14px; }
  .concept { border-top: 1px solid var(--line); padding-top: 7px; }
  .concept h3 { margin: 0 0 4px; font-size: 13px; color: #7c2d12; letter-spacing: 0; }
  .concept p { margin: 2px 0 0; font-size: 11.5px; line-height: 1.35; color: #374151; overflow-wrap: anywhere; }
  .concept b { color: #111827; }
  .link { color: var(--accent); font-weight: 800; text-decoration: none; }
  .empty { padding: 48px; background: var(--paper); border: 1px solid var(--line); border-radius: 12px; color: var(--muted); }
  @media (max-width: 860px) {
    .shell { padding: 14px; }
    .topbar, .top-actions { align-items: stretch; flex-direction: column; }
    .slide, .briefing, .concepts { grid-template-columns: 1fr; }
    .slide { min-height: auto; overflow: visible; display: grid; }
    h1 { font-size: 28px; }
  }
</style>

<script>
const slides = [{"title": "Monolayer van der Waals kagome lattice for high-temperature flat-band physics", "journal": "Nature_Physics", "source": "author whitelist", "link": "https://www.nature.com/articles/s41567-026-03492-0", "authors": "Hyungkun Bong, Choongjae Won, Seongyong Lee, et al.", "last_authors": "Kyle M. Shen, Mingu Kang", "summary": "The experimental realization of intrinsic 2D kagome materials with controllable flat bands has remained challenging. Now a van der Waals kagome material family is shown to host an isolated, gate-tunable flat band down to the monolayer limit.", "tier": "A_MUST_READ", "score": "10", "reason": "author whitelist: Chris Jozwiak", "tags": ["kagome", "vanderWaals", "monolayer", "flatband"], "image": "https://media.springernature.com/m685/springer-static/image/art%3A10.1038%2Fs41567-026-03492-0/MediaObjects/41567_2026_3492_Fig1_HTML.png", "briefing": {"background": "카고메(Kagome) 격자는 기하학적 좌절과 전자 간의 상호작용으로 인해 평평한 에너지 밴드(flat band)를 형성하며, 이는 강상관 물리 현상을 연구하는 데 매우 중요한 플랫폼입니다.", "motivation": "기존의 카고메 물질들은 주로 벌크 형태였으며, 게이트 전압으로 밴드 구조를 정밀하게 제어하거나 극한의 2차원 한계(단일층)에서 평평한 밴드의 물리적 성질을 탐구하는 데 한계가 있었습니다.", "result": "연구진은 새로운 van der Waals(vdW) 카고메 물질군을 발견하여 단일층 한계까지 박리하는 데 성공했으며, 해당 물질이 고온에서도 안정적인 고립된 평평한 밴드를 가지고 있음을 확인했습니다. 또한, 게이트 조절을 통해 이 평평한 밴드의 충전 상태를 제어할 수 있음을 보여주었습니다.", "implication": "단일층 카고메 격자에서 고립된 평평한 밴드를 구현함으로써, 모트 절연체, 비전통적 초전도성, 위상 현상 등을 2차원 리미트에서 전기적으로 제어하며 연구할 수 있는 새로운 토대를 마련했습니다.", "novelty": "기존의 AV3Sb5 계열과는 다른 새로운 vdW 카고메 시스템을 통해 '단일층' 및 '게이트 제어 가능성'을 동시에 확보했다는 점이 독보적입니다. 독자분의 주요 관심사인 카고메 금속 및 평평한 밴드 물리와 직결되는 연구입니다.", "unresolved": "초록상으로는 해당 물질의 구체적인 화학 조성이나 전하 밀도 파동(CDW)과 같은 경쟁 질서의 존재 여부에 대한 상세 정보가 부족하며, 실제 초전도 전이 온도가 어느 정도인지 명시되지 않았습니다.", "future_work": "해당 단일층 물질을 이용한 소자 제작 및 저온 ARPES/STM 측정을 통해 평평한 밴드에서 기인하는 자성이나 초전도성과 같은 다체 물리 현상을 직접 관찰하는 연구가 이어질 것으로 보입니다.", "concepts": [{"term": "카고메 격자 (Kagome lattice)", "why_emerged": "기하학적 구조에 의한 파동 함수의 간섭을 통해 에너지 전파가 억제된 평평한 밴드를 만들기 위해 도입되었습니다.", "origin": "전통적인 일본 바구니 패턴에서 유래되었으며 고체물리에서는 1950년대부터 이론적으로 연구되었습니다.", "connections": "AV3Sb5 (A=K, Rb, Cs), 양자 스핀 액체, 위상 절연체"}, {"term": "평평한 밴드 (Flat band)", "why_emerged": "전자의 운동 에너지가 극소화되어 전자 간 상호작용(Coulomb interaction)이 지배적인 물리 현상을 유도하기 위해 필요합니다.", "origin": "초록 정보만으로는 특정하기 어려움 (격자 기하학의 기본 특성)", "connections": "모트 절연체, 고온 초전도, 마법 각도 트위스트 이중층 그래핀"}, {"term": "van der Waals (vdW) 물질", "why_emerged": "층간 결합이 약해 단일층으로 쉽게 분리할 수 있고, 다양한 층상 구조를 쌓아 새로운 물성을 디자인하기 위해 중요해졌습니다.", "origin": "그래핀의 발견 이후 2차원 물질 연구의 핵심으로 부상했습니다.", "connections": "박리법(Exfoliation), 헤테로 구조, TMD"}, {"term": "게이트 가변성 (Gate-tunable)", "why_emerged": "화학적 도핑 없이도 외부 전압만으로 전하 밀도를 조절하여 물질의 상도표(Phase diagram)를 탐색하기 위해 필요합니다.", "origin": "반도체 트랜지스터 기술에서 유래되었습니다.", "connections": "전계 효과 트랜지스터(FET), 양자 홀 효과"}], "english_summary": ["Demonstrated intrinsic 2D vdW kagome materials down to the monolayer limit.", "Observed isolated, gate-tunable flat bands stable at high temperatures.", "Enables precise control of electron filling in kagome flat bands via electrostatic gating.", "Provides a robust platform for investigating strongly correlated phenomena in 2D."]}}, {"title": "Correlation-enhanced electron-phonon coupling in FeSe/SrTiO3 at a magic angle", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/whx6-mq31", "authors": "Qiang Zou, Antik Sihi, Basu Dev Oli, et al.", "last_authors": "Lian Li, Subhasish Mandal", "summary": "Here, the authors combine first-principles dynamical mean-field theory (DMFT), epitaxial materials design, angle-resolved photoemission spectroscopy, and scanning tunneling microscopy/spectroscopy to show that superconductivity in monolayer FeSe/SrTiO 3 is maximized at a magic FeSe 4 tetrahedral angle. They demonstrate that strong electronic correlations, captured by DMFT, substantially enhance electron-phonon coupling within the FeSe layer and produce a superconducting dome. These findings reveal the microscopic origin of enhanced superconductivity and suggest a route for engineering h acteristic surface states arising from bulk-surface connectivity of the material. Our work shows that termination-dependent surface contributions are essential for the reliable spectroscopic identification of altermagnetism and for assessing its presence across the family of layered materials.", "tier": "A_MUST_READ", "score": "10", "reason": "Experimental ARPES study on an altermagnet, direct hit for user interests.", "tags": ["ARPES", "altermagnetism", "electronicstructure", "experiment", "fermiology"], "image": "https://arxiv.org/html/2610.23375v1/Fig1.png", "briefing": {"background": "알테르자성체(altermagnet)는 총 자화(net magnetization)는 0이지만 특정 공간-시간 반전(spacetime inversion) 대칭의 파괴로 인해 스핀 분할된 밴드 구조를 가지는 새로운 종류의 자성 물질입니다. 이는 스핀트로닉스와 같은 미래 기술에 활용될 잠재력을 가지고 있어 활발히 연구되고 있습니다.", "motivation": "ARPES는 물질의 전자 구조를 직접적으로 연구하는 강력한 도구이지만, 표면 민감성 때문에 bulk 밴드와 표면 상태를 구별하기 어렵다는 문제가 있습니다. 특히 CoNb4Se8과 같은 층상 삽입 화합물에서는 서로 다른 표면 종결(termination)을 가진 도메인이 공존할 수 있어, 관찰된 스펙트럼이 bulk 알테르자성 특성을 반영하는지 아니면 표면 효과인지를 명확히 규명하는 것이 중요합니다.", "result": "이 연구는 마이크로-ARPES와 DFT 계산을 활용하여 층상 알테르자성체 CoNb4Se8의 개별 도메인을 조사했습니다. 그 결과, Co-종결 및 Se-종결된 두 가지 뚜렷한 표면 종결을 식별하고, 각 종결에 따른 특유의 표면 상태(surface states)를 확인했습니다. 이러한 표면 상태가 bulk 밴드와 어떻게 연결되는지도 밝혔습니다.", "implication": "이번 연구 결과는 층상 물질에서 알테르자성 특성을 ARPES로 신뢰성 있게 식별하기 위해서는 표면 종결에 따른 효과를 반드시 고려해야 함을 시사합니다. 표면 종결에 대한 이해 없이는 관찰된 스핀 분할이 물질의 본질적인 알테르자성 때문인지 표면 효과 때문인지 오인할 수 있습니다.", "novelty": "사용자 관심 분야인 ARPES와 알테르자성체를 직접적으로 다루는 실험 연구입니다. 특히, 알테르자성체의 ARPES 연구에서 표면 종결의 중요성을 명확히 보여주어, 향후 알테르자성체 및 기타 층상 물질의 전자 구조 연구에 중요한 방법론적 지침을 제공합니다. 이는 기존 ARPES 연구의 표면 효과 해석에 대한 일반적인 난제를 해결하는 데 기여합니다.", "unresolved": "초록에는 언급되지 않았지만, CoNb4Se8의 특정 표면 종결에서만 알테르자성 특성이 더욱 뚜렷하게 나타나는지, 아니면 두 종결 모두에서 bulk 알테르자성 신호를 관찰할 수 있지만 표면 상태가 복잡성을 가중시키는 것인지에 대한 더 깊은 논의가 필요할 수 있습니다. 또한, 이러한 표면 상태가 알테르자성의 기능적 특성에 어떤 영향을 미치는지에 대한 추가 연구가 필요할 수 있습니다.", "future_work": "다양한 층상 알테르자성체에 대해 표면 종결 효과를 체계적으로 연구하고, 표면 종결을 정밀하게 제어하여 알테르자성 특성을 조절하는 방법을 탐색할 수 있습니다. 또한, 스핀 분해 ARPES(spin-ARPES)를 통해 각 표면 종결에서의 스핀 특성을 직접적으로 측정하는 연구가 뒤따를 수 있습니다.", "concepts": [{"term": "Altermagnet (알테르자성체)", "why_emerged": "강자성체(ferromagnet)나 반강자성체(antiferromagnet)의 고유한 한계를 넘어선 새로운 종류의 자성 물질을 탐색하는 과정에서, 자화가 0이면서도 스핀 분극된 밴드를 가질 수 있는 물질을 이해하기 위해 필요해졌습니다. 이는 스핀트로닉스 응용에 새로운 가능성을 제공합니다.", "origin": "2019년 Čejchan et al.에 의해 처음 제안되었고, 2022년 Šmejkal et al.에 의해 본격적으로 이론적 틀이 제시되었습니다. 실험적으로는 RuO2에서 처음 관찰되었습니다.", "connections": "강자성체, 반강자성체, 스핀 궤도 결합(spin-orbit coupling), 비대칭 스핀 분극, 스핀트로닉스."}, {"term": "Fermiology (페르미올로지)", "why_emerged": "금속의 저온 전자기적 특성(예: 비열, 전기 전도도, 자기 감수율 등)을 이해하고 예측하기 위해 전자 구조의 핵심 요소인 페르미면(Fermi surface)의 형태와 위상을 연구하는 것이 중요했기 때문입니다.", "origin": "1930년대 아놀드 좀머펠트(Arnold Sommerfeld)의 자유 전자 모델과 양자 역학의 발전을 통해 페르미 통계(Fermi-Dirac statistics)가 확립된 이후, 1950년대 이후 드 하스-반 알펜 효과(de Haas-van Alphen effect)와 같은 실험적 기법을 통해 본격적으로 발전했습니다.", "connections": "페르미면, ARPES, 양자 진동 현상(quantum oscillations), 밴드 구조, 전자-포논 결합."}, {"term": "Surface termination (표면 종결)", "why_emerged": "결정성 물질의 표면은 bulk와 다른 원자 배열을 가질 수 있으며, 어떤 원자층이 표면을 구성하느냐에 따라 표면의 물리화학적 특성이 크게 달라지기 때문에 이를 구분하고 이해할 필요가 생겼습니다. 특히 층상 물질에서 중요합니다.", "origin": "초록 정보만으로는 특정하기 어려움. 재료 과학 및 표면 과학 분야에서 오랜 기간 동안 연구되어 온 개념입니다.", "connections": "표면 상태(surface states), 표면 재구성(surface reconstruction), 성장 모드, 촉매 작용, ARPES, STM."}, {"term": "Micro-ARPES (마이크로-ARPES)", "why_emerged": "일반적인 ARPES는 비교적 넓은 영역을 측정하여 평균적인 전자 구조 정보를 제공하지만, 물질 표면에 미세한 도메인이나 불균일성이 존재할 경우 각기 다른 영역의 특성을 구별하기 어려웠습니다. 이를 해결하기 위해 작은 측정 스팟을 이용하는 기술이 필요했습니다.", "origin": "2000년대 중반 이후 싱크로트론 방사광원에서 높은 공간 분해능을 갖는 빔라인과 검출기 기술이 발전하면서 가능해졌습니다.", "connections": "ARPES, 공간 분해 ARPES(spatial-resolution ARPES), 표면 이질성(surface inhomogeneity), 도메인 구조."}], "english_summary": ["This study uses micro-ARPES and DFT to investigate the electronic structure of the layered altermagnet CoNb4Se8.", "It reveals two distinct surface terminations, Co- and Se-terminated, each exhibiting characteristic surface states.", "The research highlights that reliable identification of altermagnetism via ARPES necessitates careful consideration of these termination-dependent surface contributions.", "These findings are crucial for distinguishing intrinsic bulk altermagnetic features from surface effects in layered materials.", "The work provides a methodological framework for future ARPES studies on altermagnets and other layered systems."]}}, {"title": "Scanning tunneling microscopy study of the charge order landscape in CsCr3Sb5", "journal": "PRB_Recent", "source": "author whitelist", "link": "http://link.aps.org/doi/10.1103/x4xb-hrjh", "authors": "Jiakang Zhang, Xiangqi Liu, Shiyuan Wang, et al.", "last_authors": "Dong-Lai Feng, Ya-Jun Yan", "summary": "Recently, a chromium-based kagome metal $\\mathrm{CsC}{\\mathrm{r}}_{3}\\mathrm{S}{\\mathrm{b}}_{5}$ has attracted significant attention due to the coexistence of density-wave-like (DW-like) orders and unconventional superconductivity; however, the nature of the DW-like orders remains elusive. Here, we …", "tier": "A_MUST_READ", "score": "9", "reason": "author whitelist: Dong-Lai Feng", "tags": ["scanningtunneling", "kagome", "unconventionalsuperconductivity", "superconduct"], "image": "", "briefing": {"background": "카고메 금속(kagome metal)은 기하학적 좌절(geometric frustration) 구조를 가지며, 위상학적 특성, 전하 밀도파(CDW) 및 비전통적 초전도(unconventional superconductivity)와 같은 흥미로운 물리 현상을 보이는 물질군입니다. 특히 AV3Sb5 (A=Cs, Rb, K) 계열에서 이러한 현상들이 관찰되어 활발히 연구 중입니다. 최근에는 크롬(Cr) 기반 카고메 금속에서도 유사한 현상이 발견되어 주목받고 있습니다.", "motivation": "CsCr3Sb5는 최근 전하 밀도파와 유사한(DW-like) 질서와 비전통적 초전도가 공존하는 것으로 밝혀져 많은 관심을 받고 있습니다. 그러나 이 DW-like 질서의 정확한 특성(본질)은 아직 명확히 밝혀지지 않아, 이를 미시적인 관점에서 이해하는 것이 중요합니다.", "result": "이 연구는 주사 터널링 현미경(STM)을 사용하여 CsCr3Sb5의 전하 질서(charge order) 현상을 탐구합니다. (초록이 잘려 있어 구체적인 결과는 명시하기 어렵지만, 일반적으로 STM은 물질의 표면 전자 구조와 국소적인 질서를 원자 분해능으로 관찰할 수 있으므로, CsCr3Sb5의 DW-like 질서의 공간적 분포, 대칭성, 그리고 그 기원에 대한 중요한 단서를 제공할 것으로 예상됩니다.)", "implication": "만약 이 연구가 CsCr3Sb5에서 관찰되는 전하 질서의 본질(예: 대칭성, 주기성, 위상 등)을 규명한다면, 카고메 금속에서 전하 질서와 비전통적 초전도가 어떻게 상호작용하는지에 대한 이해를 크게 진전시킬 수 있습니다. 이는 특히 CsV3Sb5와 같은 바나듐 기반 카고메 금속과의 비교를 통해 새로운 통찰을 제공할 것입니다.", "novelty": "사용자 관심 분야인 카고메 금속(특히 AV3Sb5 계열의 유사 물질), 전하 밀도파, 그리고 STM/STS를 이용한 전자 구조 연구에 직접적으로 해당됩니다. CsV3Sb5와 비슷한 계열인 CsCr3Sb5에 대한 STM 연구는 DW-like 질서의 미시적 특성을 밝히는 데 매우 중요하며, 이는 동라이 펑(Dong-Lai Feng) 그룹의 이전 AV3Sb5 연구와 연결될 수 있어 주목할 만합니다.", "unresolved": "초록이 잘려 있어 구체적인 내용 파악이 어렵습니다. 이 DW-like 질서가 V 기반 카고메에서 발견된 CDW와 동일한 종류인지, 아니면 다른 대칭성을 갖는지 등 그 정확한 특성이 무엇인지는 초록만으로는 알 수 없습니다. 또한, 이 질서가 초전도와 어떻게 경쟁하거나 협력하는지에 대한 메커니즘도 추가적으로 연구되어야 합니다.", "future_work": "STM/STS를 통해 밝혀진 전하 질서의 미시적 특성을 바탕으로, ARPES나 X선 회절과 같은 벌크 민감(bulk sensitive) 기법을 사용하여 전하 질서의 3차원적 특성과 전자 구조에 미치는 영향을 연구할 수 있습니다. 또한, 외부 자기장이나 압력 하에서의 STM 연구를 통해 전하 질서와 초전도의 상호작용을 더욱 심층적으로 이해할 수 있습니다.", "concepts": [{"term": "Kagome metal (카고메 금속)", "why_emerged": "기하학적 좌절을 유발하는 독특한 격자 구조(별 모양 육각형)를 가진 물질군으로, 비정상적인 전자 특성(예: 평탄 밴드, 디락점, 위상학적 특성)을 보이며, 전하 밀도파 및 초전도 현상과 연관되어 양자 물질 연구의 새로운 장을 열었습니다.", "origin": "초록 정보만으로는 특정하기 어려움. 1990년대부터 자성 물질 연구에서 기하학적 좌절을 가진 격자로서 이론적으로 중요하게 다루어졌으며, 최근 AV3Sb5 계열에서 다양한 양자 현상이 발견되면서 고체물리학 분야에서 큰 주목을 받기 시작했습니다.", "connections": "기하학적 좌절, 디락 물질, 위상 물질, 전하 밀도파(CDW), 비전통적 초전도, 루프 전류(loop current), 비대칭성 자화(TRSB), CsV3Sb5."}, {"term": "Charge order / Density-wave-like order (전하 질서 / 밀도파 유사 질서)", "why_emerged": "물질 내 전자의 국소적인 밀도가 주기적으로 변조되는 현상으로, 전자-포논 결합, 전자-전자 상호작용 등 다양한 원인에 의해 발생하며, 초전도와 같은 다른 양자 현상과 밀접하게 연관되어 있습니다.", "origin": "1930년대 루돌프 파이얼스(Rudolf Peierls)가 1차원 금속에서 예측한 파이얼스 전이(Peierls transition)가 전하 밀도파의 시초로 볼 수 있으며, 이후 2차원 및 3차원 시스템에서 발견되었습니다.", "connections": "전하 밀도파(CDW), 스핀 밀도파(SDW), 페이얼스 전이, 밴드 갭 형성, 초전도 경쟁/협력, 격자 왜곡."}, {"term": "Unconventional superconductivity (비전통적 초전도)", "why_emerged": "BCS 이론으로 설명되는 전통적인 초전도체와 달리, 전자-포논 상호작용이 아닌 다른 메커니즘(예: 전자-전자 상호작용, 스핀 플럭츄에이션)에 의해 쿠퍼 쌍이 형성되는 초전도 현상을 설명하기 위해 필요합니다. 높은 임계 온도(Tc)나 비표준적인 페어링 대칭성을 가지는 경우가 많습니다.", "origin": "1979년 유기 초전도체에서 발견된 이후, 중(重)페르미온(heavy fermion) 초전도체, 고온 초전도체(구리 산화물, 철 기반 초전도체) 등 다양한 물질에서 관찰되었습니다.", "connections": "BCS 이론, 구리 산화물 초전도체, 철 기반 초전도체, 중페르미온 물질, 스핀 플럭츄에이션, 비표준 페어링 대칭(d-wave, p-wave), 카고메 초전도체."}, {"term": "Scanning tunneling microscopy (STM, 주사 터널링 현미경)", "why_emerged": "물질의 표면 구조와 전자 상태를 원자 분해능으로 직접 이미징하고 측정하기 위한 강력한 도구가 필요했습니다. 이는 벌크 측정만으로는 알 수 없는 국소적인 특성을 밝히는 데 필수적입니다.", "origin": "1981년 게르트 비닝(Gerd Binnig)과 하인리히 로러(Heinrich Rohrer)가 IBM 취리히 연구소에서 개발했으며, 이 공로로 1986년 노벨 물리학상을 수상했습니다.", "connections": "주사 터널링 분광법(STS), 원자 분해능 이미징, 표면 과학, 국소 전자 상태, 전하 밀도파, 위상 물질."}], "english_summary": ["This STM study investigates the elusive charge order in the chromium-based kagome metal CsCr3Sb5, which coexists with unconventional superconductivity.", "STM provides atomic-scale insight into the spatial distribution and nature of the density-wave-like orders.", "Understanding this charge order is crucial for unraveling its interplay with unconventional superconductivity in kagome systems.", "The findings will likely offer comparisons with the extensively studied AV3Sb5 kagome materials.", "This research contributes to the broader understanding of charge order and superconductivity in frustrated quantum materials."]}}, {"title": "Coherent phonons in photoexcited semiconductors from first principles", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2610.22901", "authors": "Yuhui Qiu, Rong-Tian Pang, Meng-Xue Guan, Jin-Jian Zhou", "last_authors": "Meng-Xue Guan, Jin-Jian Zhou", "summary": "Coherent phonons are phase-locked lattice vibrations that provide a sensitive probe of nonequilibrium dynamics in materials. Existing first-principles equation-of-motion (EOM) approaches have successfully described coherent phonons in metals and semimetals, but their extension to semiconductors requires treating the long-lived electron--hole plasma created by above-gap excitation. Here we extend the first-principles EOM framework to photoexcited semiconductors by incorporating the residual plasma force that shifts the lattice equilibrium together with the plasma-induced renormalization of the electronic structure. For monolayer MoTe$_2$, the calculated carrier-density-dependent Te displacement agrees with constrained density-functional perturbation theory only when the renormalized band structure is included. We then show that increasing the photoexcited carrier density enhances both the initial total force and the plasma-shifted equilibrium position of the $A_{1g}$ mode, producing larger coherent lattice oscillations. This density-controlled response appears in both the atomic displacement and the coherent-phonon-induced band renormalization, providing complementary signatures for ultrafast reflectivity and time- and angle-resolved photoemission spectroscopy.", "tier": "A_MUST_READ", "score": "9", "reason": "Directly relates to time- and angle-resolved photoemission spectroscopy (ARPES) and band renormalization in 2D materials.", "tags": ["ARPES", "electronicstructure", "phonon", "2Dmaterial", "theory", "ultrafast"], "image": "https://arxiv.org/html/2610.22901v1/fig1.png", "briefing": {"background": "물질이 빛을 흡수하여 들뜬 상태(photoexcited state)가 되면 전자와 격자(phonon)는 복잡하게 상호작용하며 에너지와 운동량을 교환합니다. 특히 결맞는 포논(coherent phonons)은 이러한 비평형 역학(nonequilibrium dynamics)을 민감하게 탐지할 수 있는 도구로, 초고속 현상을 이해하는 데 중요합니다. 금속이나 반금속에서는 잘 연구되었지만, 반도체에서는 광여기(photoexcitation)로 인한 장수명 전자-정공 플라즈마 때문에 해석이 더 복잡합니다.", "motivation": "기존의 제일원리(first-principles) 운동 방정식(EOM) 접근 방식은 금속 및 반금속의 결맞는 포논을 성공적으로 설명했지만, 밴드 갭 이상의 여기(excitation)로 인해 장수명 전자-정공 플라즈마가 생성되는 반도체에서는 이를 다루기 위한 확장된 이론적 틀이 필요했습니다. 특히 플라즈마에 의한 격자 평형점 이동 및 전자 구조 재규격화 효과를 정확히 반영하는 것이 중요했습니다.", "result": "이 연구는 제일원리 운동 방정식 프레임워크를 광여기된 반도체에 적용할 수 있도록 확장했습니다. 잔류 플라즈마 힘(residual plasma force)을 통합하여 격자 평형점을 이동시키고, 플라즈마 유도 전자 구조 재규격화(plasma-induced renormalization)를 포함시켰습니다. 단일층 MoTe2에 대한 계산에서, 재규격화된 밴드 구조를 포함할 때만 캐리어 밀도 의존적인 Te 원자 변위가 제한된 DFT 결과와 일치함을 보여주었습니다. 또한, 광여기 캐리어 밀도가 증가할수록 초기 총 힘과 A1g 모드의 플라즈마로 인해 이동된 평형 위치가 모두 증가하여 더 큰 결맞는 격자 진동을 유도함을 보였습니다.", "implication": "이 결과는 광여기된 반도체에서 결맞는 포논을 정확하게 모델링하고 해석하기 위해서는 플라즈마 효과로 인한 격자 평형점 변화와 전자 밴드 구조의 재규격화를 필수적으로 고려해야 함을 의미합니다. 이는 초고속 반사율(ultrafast reflectivity) 및 시간 분해 ARPES(time-resolved ARPES)와 같은 실험 데이터를 해석하는 데 중요한 지침을 제공할 것입니다.", "novelty": "ARPES, 2D 물질, 전자 구조, 초고속 현상 등 사용자 관심사와 밀접하게 관련된 이론 연구입니다. 특히, 반도체에서 광여기된 결맞는 포논에 대한 제일원리 EOM 접근 방식을 확장하여, 플라즈마 효과가 원자 변위와 밴드 재규격화에 미치는 영향을 체계적으로 설명한 것이 새로운 점입니다. 이는 시간 분해 ARPES 데이터의 정확한 해석에 결정적인 기여를 합니다.", "unresolved": "초록에 명시된 주요 미해결 과제는 없습니다. 하지만, 이 모델이 모든 종류의 반도체 물질(예: 강한 스핀-궤도 결합을 가진 물질)에서 일관되게 적용될 수 있는지, 그리고 다른 결맞는 포논 모드(예: E2g 모드)에 대해서도 동일한 현상이 관찰되는지에 대한 추가적인 검증이 필요할 수 있습니다. 또한, 플라즈마의 수명과 관련된 동역학적 측면을 더 깊이 탐구할 필요가 있을 수 있습니다.", "future_work": "이 확장된 제일원리 EOM 프레임워크를 다양한 2D 반도체 및 위상 물질에 적용하여, 초고속 여기 후 전자-포논 상호작용 및 밴드 동역학을 예측하고 시간 분해 ARPES 실험 결과와 비교 검증할 수 있습니다. 또한, 결맞는 포논을 이용한 물질 특성 제어(Floquet engineering) 가능성을 탐색하는 데 활용될 수 있습니다.", "concepts": [{"term": "Coherent phonons (결맞는 포논)", "why_emerged": "초고속 레이저 펄스로 물질을 여기시킬 때, 격자 진동이 일정한 위상 관계를 유지하며 함께 진동하는 현상입니다. 이는 물질의 비평형 동역학, 전자-포논 상호작용, 구조적 상전이 등을 연구하는 데 매우 민감한 탐침 역할을 합니다.", "origin": "1980년대 후반부터 펨토초 레이저 기술의 발전과 함께 광학적으로 유도된 결맞는 격자 진동이 관찰되기 시작했습니다.", "connections": "초고속 분광학, 시간 분해 ARPES, 전자-포논 결합, 격자 동역학, 비평형 상태, Floquet 엔지니어링."}, {"term": "Photoexcited semiconductors (광여기된 반도체)", "why_emerged": "반도체에 밴드 갭 이상의 에너지를 가진 빛을 조사하면, 전자가 가전자대(valence band)에서 전도대(conduction band)로 여기되어 전자-정공 쌍(electron-hole pair)을 생성합니다. 이러한 비평형 상태의 반도체는 광전자학, 태양 에너지 변환, 초고속 소자 등 다양한 분야에서 중요하며, 그 동역학을 이해하는 것이 필수적입니다.", "origin": "초록 정보만으로는 특정하기 어려움. 반도체 물리학의 기초적인 개념이며, 20세기 중반부터 반도체 다이오드, 태양 전지 등의 발전과 함께 활발히 연구되었습니다.", "connections": "전자-정공 플라즈마, 밴드 갭, 초고속 현상, 캐리어 동역학, 광전 효과."}, {"term": "First-principles equation-of-motion (제일원리 운동 방정식)", "why_emerged": "물질의 특성을 예측하고 설명하기 위해 경험적인 매개변수 없이 양자 역학의 기본 원리(예: 슈뢰딩거 방정식)만을 사용하여 계산하는 방법입니다. 특히 시간 의존적인 현상이나 비평형 동역학을 다룰 때, 시스템의 시간에 따른 진화를 직접 시뮬레이션하기 위해 운동 방정식 형태로 접근하는 것이 필요합니다.", "origin": "초록 정보만으로는 특정하기 어려움. 1960년대부터 널리 사용된 제일원리 계산(DFT 등)을 동역학적 문제에 확장 적용한 것으로, 최근 초고속 현상 연구에 활발히 적용되고 있습니다.", "connections": "밀도 범함수 이론(DFT), 시간 의존 밀도 범함수 이론(TDDFT), 전자-포논 결합, 분자 동역학, 양자 동역학."}, {"term": "Plasma-induced renormalization of electronic structure (플라즈마 유도 전자 구조 재규격화)", "why_emerged": "광여기된 전자-정공 플라즈마는 물질 내에 존재하는 정적인 밴드 구조를 변화시킬 수 있습니다. 전자의 스크리닝 효과나 격자와의 상호작용 변화 등으로 인해 밴드 갭이 변하거나 밴드 폭이 달라지는 등 전자 구조가 '재규격화'되는 현상을 설명하고 예측하기 위해 필요합니다.", "origin": "초록 정보만으로는 특정하기 어려움. 들뜬 상태의 물질에서 캐리어-캐리어 상호작용 및 캐리어-격자 상호작용을 다루는 반도체 물리학 및 응집물질 물리학의 개념입니다.", "connections": "밴드 갭 변화, 드레스업 효과, 스크리닝 효과, 전자-전자 상호작용, 시간 분해 ARPES, 페르미 액체 이론."}], "english_summary": ["This theoretical study extends the first-principles equation-of-motion framework to describe coherent phonons in photoexcited semiconductors.", "It incorporates the effects of residual electron-hole plasma force and plasma-induced electronic structure renormalization on lattice dynamics.", "For monolayer MoTe2, accurate prediction of Te displacement requires including the renormalized band structure.", "Increasing photoexcited carrier density enhances the initial driving force and shifts the equilibrium position for the A1g mode, leading to larger coherent oscillations.", "These findings offer crucial insights for interpreting ultrafast reflectivity and time-resolved ARPES data in semiconductors."]}}, {"title": "Engineering nonrelativistic spin splitting in semiconductors by altermagnetic proximity", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2610.23773", "authors": "Sing Lam Wong, Marcel Franz", "last_authors": "Sing Lam Wong, Marcel Franz", "summary": "Altermagnets combine vanishing net magnetization with momentum-dependent, nonrelativistic spin splitting, offering functionalities attractive for spintronics and quantum devices. Their practical use, however, is constrained by the limited availability of materials that simultaneously possess the required altermagnetic symmetry, semiconducting electronic structure, and weak spin-orbit coupling. Here we show that these requirements can instead be separated between constituent materials through proximity engineering. We develop an analytical theory for a hrm{e}_{\\rm D}^{\\prime} . By combining energy conservation with the graphene dispersion and in-plane momentum conservation, we obtain a quadratic equation for the scattered photon energy within the model considered. This relation is the main kinematic result of the work. We identify inverse Compton-like scattering by the transfer of energy from the carrier to the photon, subject to the simultaneous conservation of energy and in-plane momentum. We also discuss how this process differs kinematically from Doppler-shifted emission, Čerenkov-like radiation, harmonic generation, photon drag, and other nonlinear optical processes. Finally, we propose a time-resolved pump–probe arrangement in which the scattered photon spectrum is the primary observable, while time- and angle-resolved photoemission spectroscopy (TR-ARPES) provides an independent probe of the nonequilibrium carrier distribution. These results provide a kinematic framework for analysing inverse Compton-like scattering in graphene and for identifying the conditions under which energy can be transferred from energetic Dirac carriers to photons.", "tier": "A_MUST_READ", "score": "9", "reason": "ARPES kinematics on Dirac carriers in graphene, proposing TR-ARPES, highly relevant.", "tags": ["ARPES", "graphene", "Dirac", "spectroscopy", "TR-ARPES"], "image": "https://arxiv.org/html/2610.23358v1/ics_trarpes_schematic_pi_updated.png", "briefing": {"background": "그래핀과 같은 디락 물질에서 전자는 빛의 속도 c와 다른 특성 속도 v_F를 가지며 상대론적이지 않은 디락 방정식을 따릅니다. 이는 광자와 전자의 상호작용, 특히 산란 현상에서 진공에서의 상호작용과는 다른 독특한 운동학적(kinematic) 특성을 보일 수 있음을 의미합니다. 이러한 상호작용을 이해하는 것은 물질의 전자 구조와 동역학을 탐구하는 데 중요합니다.", "motivation": "표준 콤프턴 산란 공식은 진공에서의 광자와 전자 상호작용을 설명하며, 그래핀의 디락 운반체에 단순히 c 대신 v_F를 대입하여 적용할 수 없습니다. 이 논문은 그래핀의 디락 운반체에 의한 콤프턴 산란 및 역 콤프턴 산란의 운동학을 명확히 이해하고 설명하는 것을 목표로 합니다.", "result": "연구진은 그래핀의 디락 운반체에 의한 콤프턴 유사 산란(Compton-like scattering) 및 역 콤프턴 유사 산란(inverse Compton-like scattering)의 운동학을 분석했습니다. 에너지 보존과 그래핀의 분산 관계, 평면 내 운동량 보존을 결합하여, 산란된 광자 에너지에 대한 이차 방정식을 도출했습니다. 특히, 운반체로부터 광자로 에너지가 전달되는 역 콤프턴 유사 산란 과정을 식별하고, 이 과정이 도플러 편이 방출, 체렌코프 유사 복사, 고조파 생성 등 다른 비선형 광학 과정과 운동학적으로 어떻게 다른지 논의했습니다.", "implication": "이 결과는 그래핀과 같은 디락 물질에서 고에너지 디락 운반체로부터 광자로 에너지가 전달되는 역 콤프턴 유사 산란 과정을 분석하기 위한 운동학적 틀을 제공합니다. 이는 TR-ARPES와 같은 실험을 통해 비평형 운반체 분포를 탐구하고, 광자 스펙트럼을 측정하여 디락 물질의 동역학을 이해하는 데 중요한 기반이 될 수 있습니다.", "novelty": "독자는 ARPES, 특히 TR-ARPES에 강한 관심을 가지고 있으며, 그래핀과 디락 물질은 독자의 주요 관심사 중 하나입니다. 이 논문은 그래핀의 독특한 디락 운반체와 광자 간의 상호작용(특히 역 콤프턴 산란)에 대한 운동학적 프레임워크를 제공하며, 이를 TR-ARPES와 같은 시간 분해 광전자 분광법으로 탐지하는 방법을 제안합니다. 이는 TR-ARPES를 통해 그래핀의 비평형 운반체 동역학을 연구하는 새로운 실험적 방향을 제시한다는 점에서 독자에게 매우 중요합니다.", "unresolved": "제안된 역 콤프턴 유사 산란 과정 및 운동학적 예측을 실험적으로 검증하는 것이 필요합니다. 특히, TR-ARPES를 통한 비평형 운반체 분포 측정과 동시에 산란된 광자 스펙트럼을 측정하는 실험적 설정이 실제로 가능한지, 그리고 신호가 충분히 강할지 확인해야 합니다.", "future_work": "제안된 시간 분해 펌프-프로브(pump-probe) 설정을 사용하여 그래핀에서 역 콤프턴 유사 산란을 직접 실험적으로 관찰하고, 산란된 광자 스펙트럼과 TR-ARPES 데이터를 비교하여 운동학적 모델을 검증해야 합니다. 이 프레임워크를 다른 디락/바일 반금속(Weyl/Dirac semimetals) 또는 토폴로지 물질(topological materials)로 확장하는 연구도 가능할 것입니다.", "concepts": [{"term": "Dirac carriers (디락 운반체)", "why_emerged": "그래핀과 같은 특정 물질에서 전자의 거동이 마치 질량이 없는 상대론적 입자처럼 디락 방정식을 따르는 것을 설명하기 위해 필요했습니다. 이들은 선형 분산 관계를 가지며 독특한 수송 및 광학적 특성을 보입니다.", "origin": "P.A.M. Dirac이 상대론적 양자 역학에서 전자를 설명하기 위해 디락 방정식을 제안했으며, 그래핀에서 이러한 \"디락 페르미온\" 거동이 실험적으로 확인되었습니다.", "connections": "그래핀, 디락점(Dirac point), Weyl 페르미온, 토폴로지 반금속, 질량 없는 페르미온, 선형 분산."}, {"term": "Inverse Compton Scattering (역 콤프턴 산란)", "why_emerged": "에너지가 낮은 광자가 에너지가 높은 전자에 의해 산란되어 에너지를 얻고 파장이 짧아지는 현상을 설명하기 위해 필요합니다. 천체 물리학에서 많이 사용되지만, 물질 물리에서도 전자의 동역학을 연구하는 데 응용될 수 있습니다.", "origin": "아서 콤프턴(Arthur Compton)이 엑스선과 전자 간의 상호작용을 통해 콤프턴 효과를 발견했으며, 역 콤프턴 산란은 이의 역과정입니다.", "connections": "콤프턴 산란, 광자와 물질 상호작용, 에너지 보존, 운동량 보존, 고에너지 물리학, 천체 물리학, TR-ARPES."}, {"term": "Graphene (그래핀)", "why_emerged": "탄소 원자가 육각형 벌집 격자로 배열된 2차원 물질로, 뛰어난 전기적, 기계적, 광학적 특성 때문에 새로운 전자 소자 및 물질 과학 연구의 혁신을 가져올 것으로 기대되어 연구되었습니다. 특히 디락 페르미온 거동을 보이는 최초의 물질 중 하나입니다.", "origin": "2004년 Andre Geim과 Konstantin Novoselov에 의해
