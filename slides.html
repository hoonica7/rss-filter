<title>Daily Paper Slideshow</title>
<style>
  :root {
    color-scheme: light;
    --bg: #f6f7f4;
    --paper: #ffffff;
    --ink: #111827;
    --muted: #64748b;
    --line: #d8ddd2;
    --accent: #176b87;
    --accent-2: #9a3412;
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; overflow: auto; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: var(--bg); color: var(--ink); }
  .shell { max-width: 1500px; min-height: 100vh; margin: 0 auto; padding: 14px 18px; display: flex; flex-direction: column; }
  .topbar { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 16px; }
  .top-actions { display: flex; align-items: center; gap: 10px; }
  .topbar a, button { border: 1px solid var(--line); border-radius: 8px; background: var(--paper); color: var(--ink); padding: 10px 14px; font-weight: 700; text-decoration: none; cursor: pointer; }
  button.primary { background: var(--accent); border-color: var(--accent); color: white; }
  button:disabled { opacity: 0.45; cursor: not-allowed; }
  .counter { color: var(--muted); font-weight: 700; }
  .slide { min-height: calc(100vh - 82px); background: var(--paper); border: 1px solid var(--line); border-radius: 10px; padding: 18px; box-shadow: 0 18px 42px rgba(15, 23, 42, 0.10); display: grid; grid-template-columns: minmax(310px, 0.86fr) minmax(0, 1.55fr); gap: 18px; overflow: visible; }
  .paper-head { min-width: 0; min-height: 0; overflow: visible; display: flex; flex-direction: column; gap: 12px; }
  .figure { margin: 0; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: #f8fafc; }
  .figure img { display: block; width: 100%; max-height: 41vh; object-fit: contain; background: white; }
  .figure figcaption { padding: 7px 10px; color: var(--muted); font-size: 12px; line-height: 1.3; }
  .head-text { display: flex; flex-direction: column; gap: 9px; min-width: 0; }
  .badges { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .badge { border-radius: 999px; padding: 5px 9px; background: #eef2ff; color: #3730a3; font-size: 12px; font-weight: 800; }
  .score { background: #fee2e2; color: #991b1b; }
  h1 { margin: 0; font-size: 25px; line-height: 1.15; letter-spacing: 0; overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
  h1 a { color: inherit; text-decoration-color: rgba(23, 107, 135, 0.35); text-decoration-thickness: 2px; text-underline-offset: 4px; }
  h1 a:hover { color: var(--accent); text-decoration-color: var(--accent); }
  .meta, .authors, .why, .abstract { font-size: 13px; line-height: 1.45; }
  .meta, .authors { color: var(--muted); }
  .why strong, .abstract strong, .authors strong { color: var(--ink); }
  .authors { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .why { border-left: 4px solid var(--accent-2); padding-left: 10px; color: #374151; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .abstract { border-top: 1px solid var(--line); padding-top: 14px; color: #374151; }
  .original-abstract { border-top: 1px solid var(--line); padding-top: 10px; color: #374151; font-size: 11.5px; line-height: 1.35; overflow-wrap: anywhere; }
  .original-abstract strong { display: block; margin-bottom: 4px; color: var(--ink); }
  .tags { display: flex; flex-wrap: wrap; gap: 8px; }
  .tag { border-radius: 999px; padding: 4px 8px; background: #f1f5f9; color: #475569; font-size: 12px; font-weight: 700; }
  .head-text > .link { display: none; }
  .briefing { min-width: 0; min-height: 0; overflow: visible; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); grid-auto-rows: minmax(0, auto); align-content: start; gap: 11px 18px; border-top: 0; padding-top: 0; }
  .brief-section { min-width: 0; }
  .brief-section.wide { grid-column: 1 / -1; }
  .brief-section h2 { margin: 0 0 4px; font-size: 14px; line-height: 1.22; color: #0f766e; letter-spacing: 0; }
  .brief-section p, .brief-section li { margin: 0; font-size: 12.5px; line-height: 1.42; color: #1f2937; overflow-wrap: anywhere; }
  .brief-section ul { margin: 0; padding-left: 20px; }
  .concepts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 9px 14px; }
  .concept { border-top: 1px solid var(--line); padding-top: 7px; }
  .concept h3 { margin: 0 0 4px; font-size: 13px; color: #7c2d12; letter-spacing: 0; }
  .concept p { margin: 2px 0 0; font-size: 11.5px; line-height: 1.35; color: #374151; overflow-wrap: anywhere; }
  .concept b { color: #111827; }
  .link { color: var(--accent); font-weight: 800; text-decoration: none; }
  .empty { padding: 48px; background: var(--paper); border: 1px solid var(--line); border-radius: 12px; color: var(--muted); }
  @media (max-width: 860px) {
    .shell { padding: 14px; }
    .topbar, .top-actions { align-items: stretch; flex-direction: column; }
    .slide, .briefing, .concepts { grid-template-columns: 1fr; }
    .slide { min-height: auto; overflow: visible; display: grid; }
    h1 { font-size: 28px; }
  }
</style>

const slides = [{"title": "Electronic Origin of Delicate Antiferromagnetism in FexNbS2", "journal": "PRL_Recent", "source": "author whitelist", "link": "http://link.aps.org/doi/10.1103/99yr-nqbx", "authors": "Wenxin Li, Jonathan T. Reichanadter, Shan Wu, et al.", "last_authors": "Jeffrey B. Neaton, Yu He", "summary": "Author(s): Wenxin Li, Jonathan T. Reichanadter, Shan Wu, Ji Seop Oh, Rourav Basak, Shannon C. Haley, Siqi Wang, Joshua E. Chaparro Mata, Elio Vescovo, Donghui Lu, Makoto Hashimoto, Christoph Klewe, Suchismita Sarker, Jessica L. McChesney, Alex Frañó, James G. Analytis, Robert J. Birgeneau, Jeffrey B. Neaton, and Yu He A combination of ARPES, XAS, and DFT shows a dramatic eV-scale electronic restructuring in Fe x NbS 2 , similar to what happens in correlated oxides, and suggests electronic correlations play a central role in the magnetism of Fe-intercalated transition-metal dichalcogenides. [Phys. Rev. Lett. 136, 216503] Published Wed May 27, 2026", "tier": "A_MUST_READ", "score": "10", "reason": "author whitelist: Donghui Lu", "tags": ["ARPES", "STS", "correlated", "ferromagnet", "antiferromagnet"], "image": "", "briefing": {"background": "Fe가 인터칼레이션(intercalation)된 전이금속 디칼코게나이드(TMD) 화합물은 자성 및 전자 상관관계가 복잡하게 얽혀 있는 물질군으로, 전형적인 강자성 혹은 반강자성 거동이 전자 구조에 어떤 영향을 미치는지 연구하는 것은 강상관 전자계 물리학의 핵심 과제 중 하나입니다.", "motivation": "FexNbS2 물질에서 나타나는 미묘한 반강자성 상태의 근본적인 전자적 기원을 밝히기 위해, 에너지 레벨에서의 전자 구조 재구성(restructuring) 여부를 체계적으로 규명하고자 했습니다.", "result": "ARPES, XAS, DFT 분석을 통해 산화물계 강상관 물질과 유사한 eV 단위의 전자 구조 재구성을 확인했습니다. 이는 전자 상관관계가 자성 형성에 결정적인 역할을 함을 시사합니다.", "implication": "TMD 기반 자성 물질에서도 강상관 전자계와 유사한 물리 현상이 발생할 수 있음을 보여주며, 기존의 밴드 이론만으로는 설명하기 어려웠던 Fe-TMD의 자성을 이해하는 새로운 패러다임을 제시합니다.", "novelty": "Donghui Lu 등 저명한 연구자들이 ARPES와 XAS를 병행하여 Fe-TMD의 상관관계 물리학을 eV 에너지 스케일에서 입증한 연구로, 귀하의 ARPES 기반 correlated material 연구 관심사에 부합합니다.", "unresolved": "eV 스케일의 재구성이 구체적으로 어떤 국소적인 다체 효과(many-body effect)에 기인하는지에 대한 미시적 메커니즘은 여전히 정교한 추가 연구가 필요합니다.", "future_work": "저온 환경에서의 고해상도 STS 측정을 통해 전자 구조 재구성이 표면 혹은 국소적인 불순물 상태와 어떻게 연결되는지 추가적인 분석이 기대됩니다.", "concepts": [{"term": "Intercalation", "why_emerged": "호스트 층상 물질 사이에 다른 원자를 삽입하여 물리적 성질을 변조하기 위해 필요함.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "TMD의 위상 물성 및 자기적 상태 변조."}, {"term": "Electronic Correlation", "why_emerged": "밴드 이론만으로 설명되지 않는 자기 정렬 및 절연체-금속 전이 현상을 설명하기 위해 도입됨.", "origin": "Hubbard, Mott 등 20세기 중반 확립", "connections": "Hubbard 모델, DMFT 이론."}], "english_summary": ["Investigated the electronic structure of FexNbS2 using ARPES, XAS, and DFT.", "Identified a massive eV-scale electronic restructuring characteristic of correlated electron systems.", "Suggests electronic correlations drive the delicate antiferromagnetism in Fe-intercalated TMDs.", "Provides a strong link between TMD magnetism and correlated oxide physics."]}}, {"title": "Deciphering the absence of charge density waves in the V-based kagome metal CsV6Sb6", "journal": "PRB_Recent", "source": "keyword", "link": "http://link.aps.org/doi/10.1103/3vlt-zz94", "authors": "Rongxiao Du, Yunfan Yang, Wenxin Lv, et al.", "last_authors": "Hechang Lei, Jianbo Hu", "summary": "Author(s): Rongxiao Du, Yunfan Yang, Wenxin Lv, Junhong Yu, Hang Zhang, Hechang Lei, and Jianbo Hu While charge density waves (CDWs) are a hallmark of the kagome metal $\\mathrm{Cs}{\\mathrm{V}}_{3}{\\mathrm{Sb}}_{5}$, their absence in the bilayer counterpart $\\mathrm{Cs}{\\mathrm{V}}_{6}{\\mathrm{Sb}}_{6}$ remains a notable exception, with the underlying mechanism yet to be elucidated. Here, integrat… [Phys. Rev. B 113, 245119] Published Tue Jun 09, 2026", "tier": "A_MUST_READ", "score": "9", "reason": "title strong match: kagome metal", "tags": ["kagome", "chargedensitywave", "CDW"], "image": "", "briefing": {"background": "Kagome 금속 AV3Sb5(A=K, Rb, Cs)는 전하 밀도 파동(CDW)과 초전도 현상이 공존하는 독특한 물질군으로, 이 물질들의 구조적 변화나 조성 변화가 물성에 미치는 영향은 kagome 물리 연구의 핵심 주제입니다.", "motivation": "CsV3Sb5와 구조적으로 유사하지만 CDW가 나타나지 않는 이중층(bilayer) 구조의 CsV6Sb6에서 왜 CDW가 억제되는지에 대한 물리적 근거를 찾고자 했습니다.", "result":  Saini, T. Mizokawa", "summary": "Author(s): K. Fujinuma, T. Hara, M. Emi, N. Katayama, H. Sawa, X. Zhao, K. Takubo, G. Tomassucci, F. Minati, A. Barinov, K. Ozawa, N. L. Saini, and T. Mizokawa The electronic structure of ${\\mathrm{VSe}}_{2}$ with $4×4×3.18$ charge density wave (CDW) transition has been studied by means of angle-resolved photoemission spectroscopy (ARPES) and scanning photoemission microscopy (SPEM). The partial depletion of the Fermi surfaces is observed in the CDW phase … [Phys. Rev. B 113, 235112] Published Fri Jun 05, 2026", "tier": "A_MUST_READ", "score": "9", "reason": "title strong match: angle-resolved photoemission", "tags": ["ARPES", "angle-resolvedphotoemission", "photoemission", "chargedensitywave", "CDW", "Fermisurface"], "image": "", "briefing": {"background": "전이금속 디칼코게나이드(TMD)인 VSe2는 저온에서 전하 밀도 파동(CDW) 상태를 보이며, 이 과정에서 전자 구조의 재구성이 발생합니다. CDW 형성의 기원과 페르미 면의 변화를 정확히 파악하는 것은 강상관 전자계에서 격자와 전자 결합의 물리를 이해하는 데 핵심적입니다.", "motivation": "VSe2의 CDW 상태에서 V 3d 및 Se 4p 오비탈이 전자 구조 재구성에 어떻게 기여하는지 ARPES 및 공간 분해능이 높은 SPEM을 활용해 실험적으로 규명하고자 했습니다.", "result": "CDW 상전이 이후 페르미 면의 부분적인 소멸(partial depletion)을 관찰하였으며, V 3d 및 Se 4p 전자 상태가 CDW 전이에 따라 어떻게 재구성되는지를 밝혀냈습니다.", "implication": "VSe2의 CDW 발생 메커니즘을 페르미 면의 Nesting 및 오비탈 간의 상호작용 관점에서 구체화할 수 있게 되었으며, 이는 다른 TMD 물질의 유사 상전이 연구에도 중요한 참고점이 됩니다.", "novelty": "SPEM을 병행하여 CDW 도메인 구조와 전자 상태의 상관관계를 직접적으로 관찰했다는 점이 본 연구의 가치를 높입니다.", "unresolved": "페르미 면의 부분 소멸 외에 이 과정에서 전자-격자 결합의 정확한 강도나, 다른 잠재적 밴드 재구성이 CDW와 맺는 미세한 상관관계는 완전히 설명되지 않았습니다.", "future_work": "저온 환경에서 CDW 도메인 경계에 따른 국소적인 전자 구조 변화를 더 정밀하게 분석하는 연구가 필요할 것입니다.", "concepts": [{"term": "Charge Density Wave (CDW)", "why_emerged": "저차원 물질에서 전자-격자 상호작용으로 인해 전자 밀도가 주기적으로 변조되는 기저 상태가 나타나기 때문입니다.", "origin": "Peierls(1955)가 1차원 금속 체인에서 이론적으로 제시했습니다.", "connections": "Kagome 금속(AV3Sb5)의 CDW 및 NbSe3와 같은 quasi-1D 물질 연구와 맥을 같이합니다."}, {"term": "ARPES", "why_emerged": "고체 내부의 전자 에너지-운동량 분산 관계(밴드 구조)를 직접 측정할 수 있는 가장 강력한 실험 도구입니다.", "origin": "초록 정보만으로는 특정하기 어려움 (1960년대 광전효과 기초 연구에 기인).", "connections": "다양한 topological 재료의 밴드 토폴로지 검증에 필수적으로 사용됩니다."}, {"term": "SPEM", "why_emerged": "균일하지 않은 샘플의 국소 영역(도메인 등)에 대한 전자 구조 정보를 얻기 위해 필요합니다.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "최근 CDW 도메인 연구 등 국소적 물리량 관측에 활발히 사용됩니다."}], "english_summary": ["Analyzed the electronic structure of VSe2 undergoing CDW using ARPES and SPEM.", "Observed partial Fermi surface depletion in the CDW phase.", "Identified critical roles of V 3d and Se 4p orbitals in band reconstruction.", "Provided spatial insight into the CDW phase through photoemission microscopy."]}}, {"title": "Crossed Surface Flat Bands in Three-Dimensional Superconducting Altermagnets", "journal": "PRL_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/65q6-5wxl", "authors": "Yuri Fukaya, Bo Lu, Keiji Yada, Yukio Tanaka, Jorge Cayao", "last_authors": "Yukio Tanaka, Jorge Cayao", "summary": "Author(s): Yuri Fukaya, Bo Lu, Keiji Yada, Yukio Tanaka, and Jorge Cayao Higher dimensional topological phases in three-dimensional superconducting altermagnets characterized by zero-energy surface crossed flat bands indicate the interplay between altermagnetic and superconducting symmetries. [Phys. Rev. Lett. 136, 226001] Published Thu Jun 04, 2026", "tier": "A_MUST_READ", "score": "9", "reason": "Theory predicting topological phases and flat bands in superconducting altermagnets, highly relevant for ARPES.", "tags": ["theory", "altermagnetism", "superconductivity", "topological", "flatbands", "surfacestates"], "image": "", "briefing": {"background": "Altermagnetism(교대 자성)은 순자성 모멘트가 0이면서도 결정 회전 대칭성에 의해 자성 분할(spin splitting)이 나타나는 새로운 자기 질서입니다. 이를 초전도체와 결합하면 위상학적 특성과 새로운 에너지 밴드 구조가 나타날 가능성이 제기되고 있습니다.", "motivation": "3차원 초전도 Altermagnet에서 나타나는 표면 상태(Surface State)가 위상학적으로 어떤 특성을 갖는지, 특히 Flat band의 형성을 규명하고자 합니다.", "result": "Altermagnetic 대칭성과 초전도 대칭성이 상호작용할 때, 표면에 0 에너지에서 교차하는 Flat band가 형성됨을 이론적으로 증명했습니다.", "implication": "Altermagnet/초전도체 이종 접합이나 도핑된 Altermagnet에서 새로운 위상학적 준입자(quasiparticles)를 제어할 수 있는 가능성을 제시합니다.", "novelty": "Altermagnetism의 새로운 위상학적 성질을 초전도성과 연결하여 Flat band라는 구체적인 실험 관측 지표를 제안했습니다.", "unresolved": "이론적으로 예측된 Flat band가 실제 실험(ARPES 등)에서 표면의 복잡한 구조나 결함에 의해 어떻게 왜곡될지는 불분명합니다.", "future_work": "실제 해당 특성을 보이는 후보 물질을 찾고 저온 ARPES를 통해 표면 Flat band의 분산을 확인하는 실험이 요구됩니다.", "concepts": [{"term": "Altermagnetism", "why_emerged": "기존의 강자성(Ferromagnetism)과 반강자성(Antiferromagnetism) 분류로 설명되지 않는 독특한 비-상대론적 스핀 분할이 필요했기 때문입니다.", "origin": "최근 2020년대 들어 주목받기 시작한 개념으로, 특정 결정 대칭성을 갖는 반강자성체에서 제안되었습니다.", "connections": "Anomalous Hall effect 및 Topological semimetal 연구와 연결됩니다."}, {"term": "Flat Band", "why_emerged": "밴드의 분산이 없는(운동량에 무관한) 에너지는 높은 상태 밀도를 유도하여 강한 상관관계를 유발하기 때문입니다.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "Moire 시스템이나 Kagome 격자의 물리와 깊게 연관되어 있습니다."}], "english_summary": ["Investigated topological phases in 3D superconducting altermagnets.", "Predicted the emergence of zero-energy crossed surface flat bands.", "Highlighted the interplay between altermagnetic and superconducting symmetries.", "Provides theoretical grounds for identifying topological superconductivity in altermagnetic materials."]}}, {"title": "Orbital altermagnetism on the kagome lattice and possible application to AV3Sb5", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/wdmg-v8d3", "authors": "Anzumaan R. Chakraborty, Fan Yang, Turan Birol, Rafael M. Fernandes", "last_authors": "Turan Birol, Rafael M. Fernandes", "summary": "Author(s): Anzumaan R. Chakraborty, Fan Yang, Turan Birol, and Rafael M. Fernandes Altermagnets, which encompass a broad landscape of materials, are compensated collinear magnetic phases in which the antiparallel magnetic moments are related by a crystalline rotation. Here, we argue that collinear altermagneticlike states can also be realized in lattices with an odd number of subl… [Phys. Rev. B 113, 214431] Published Wed Jun 10, 2026", "tier": "B_IMPORTANT_CONDMAT", "score": "10", "reason": "Direct hit on kagome metals, AV3Sb5, and altermagnetism/TRSB.; demoted from A: broad CM, not direct user/project hit", "tags": ["theory", "AV3Sb5", "altermagnetism"], "image": "", "briefing": {"background": "Kagome 금속(AV3Sb5)은 CDW, TRSB(시간 반전 대칭 파괴), 초전도 등 복합적인 물리 현상을 보여 연구의 중심에 있습니다. 특히 이들의 자기적 특성과 위상학적 상태를 설명하기 위한 새로운 메커니즘이 필요합니다.", "motivation": "Kagome 격자의 독특한 기하학적 구조가 어떻게 Altermagnetism과 같은 새로운 상태를 허용하는지, 그리고 이것이 AV3Sb5에 어떻게 적용될 수 있는지 이론적으로 탐색합니다.", "result": "짝수 개가 아닌 홀수 개의 서브격자를 가진 Kagome 격자에서도 특정 결정 대칭 조건 하에 Altermagnetic 상태가 가능함을 보였습니다.", "implication": "AV3Sb5에서 보고된 TRSB의 기원을 자기 모멘트가 0인 Altermagnetic 상태의 관점에서 해석할 수 있는 새로운 경로를 열어주었습니다.", "novelty": "기존 Altermagnetism 이론을 Kagome 시스템으로 확장하여, Kagome 금속의 복잡한 실험 결과를 해석할 새로운 이론적 틀을 제공합니다.", "unresolved": "이 제안된 상태가 AV3Sb5의 실제 실험에서 관찰되는 물리적 지표와 어느 정도 정량적으로 일치하는지는 여전히 검증이 필요합니다.", "future_work": "이러한 대칭성 파괴를 검출할 수 있는 RIXS나 자성 감도 측정 등의 추가적인 이론적 예측 모델링이 필요합니다.", "concepts": [{"term": "Kagome Lattice", "why_emerged": "기하학적 좌절(frustration)이 강한 격자 구조로, 비전형적인 전자 상태와 위상학적 물리 현상이 나타나기 때문입니다.", "origin": "전통적인 결정 구조 용어입니다.", "connections": "AV3Sb5 물질군과 위상학적 자성체 연구의 핵심 기반입니다."}, {"term": "Time Reversal Symmetry Breaking (TRSB)", "why_emerged": "초전도 상태나 CDW 상태에서 비자성임에도 불구하고 자기장이 감지되는 이상 현상을 설명하기 위해 필요합니다.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "Kagome 금속(AV3Sb5)에서 루프 전류(loop current) 모델과 연결되어 활발히 논의됩니다."}], "english_summary": ["Theoretical study on orbital altermagnetism in kagome lattices.", "Demonstrates that altermagnetic states can emerge in lattices with odd number of sublattices.", "Discusses application to the AV3Sb5 series.", "Provides a potential mechanism for symmetry breaking observed in kagome metals."]}}, {"title": "Probing d-wave superconducting gap of the high-Tc cuprate Bi2Sr2Ca2Cu3O10+δ by resonant inelastic x-ray scattering", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/4tm5-f5mj", "authors": "Kunhao Li, Qizhi Li, Changwei Zou, et al.", "last_authors": "Yi Lu, Yingying Peng", "summary": "Author(s): Kunhao Li, Qizhi Li, Changwei Zou, Jaewon Choi, Chaohui Yin, Mirian Garcia-Fernandez, Stefano Agrestini, Shilong Zhang, Chengtian Lin, Xingjiang Zhou, Ke-Jin Zhou, Yi Lu, and Yingying Peng The superconducting gap is a characteristic feature of high-${T}_{\\mathrm{c}}$ superconductors and provides crucial information on the pairing mechanism underlying high-temperature superconductivity. Here, we employ high-resolution resonant inelastic x-ray scattering (RIXS) at the Cu ${L}_{3}$ edge … [Phys. Rev. B 113, 224510] Published Mon Jun 08, 2026", "tier": "B_IMPORTANT_CONDMAT", "score": "9", "reason": "RIXS study of high-Tc cuprates directly aligns with interests.", "tags": ["RIXS", "cuprate", "superconduct"], "image": "", "briefing": {"background": "고온 초전도체인 구리산화물(cuprates)에서 초전도 상태의 대칭성과 페어링 메커니즘을 밝히는 것은 응집물질물리학의 핵심 과제입니다. 특히 초전도 갭의 구조를 직접 관측하는 것은 고온 초전도 현상의 근원을 이해하는 데 필수적입니다.", "motivation": "본 연구는 RIXS(공명 비탄성 X선 산란) 기술을 활용하여 Bi2223 시스템의 초전도 갭을 직접 측정함으로써, 기존의 ARPES나 STS 측정과 비교 가능한 보완적 정보를 얻고자 합니다.", "result": "Cu L3 엣지에서의 고분해능 RIXS 측정을 통해 Bi2223 화합물의 d-파 초전도 갭 구조에 대한 정보를 성공적으로 추출하였습니다.", "implication": "RIXS가 단순히 스핀이나 전하 여기를 측정하는 것을 넘어, 초전도 페어링 에너지 갭의 모멘텀 의존성을 연구하는 강력한 도구가 될 수 있음을 입증했습니다.", "novelty": "기존 ARPES와 달리 표면 상태에 덜 민감하고 벌크 특성을 잘 반영하는 RIXS를 이용해 다층 구리산화물의 갭 구조를 심도 있게 분석했습니다.", "unresolved": "RIXS 데이터의 에너지 분해능 한계로 인해 d-파 갭의 노드(node) 근처 미세 구조를 완벽하게 분리하는 데 어려움이 있었을 가능성이 있습니다.", "future_work": "더 높은 분해능의 RIXS를 사용하여 초전도 갭의 이방성 및 도핑 농도에 따른 변화를 추가로 추적해야 합니다.", "concepts": [{"term": "RIXS", "why_emerged": "물질 내의 전하, 스핀, 궤도 여기를 비탄성 산란을 통해 조사하기 위해 필요함.", "origin": "1970년대 이론적 제안 후, 2000년대 이후 X선 분광기 성능 향상으로 정착됨.", "connections": "ARPES(운동량 분해), 중성자 산란과 상호 보완적 관계."}, {"term": "d-wave pairing", "why_emerged": "구리산화물 초전도체의 비전통적 페어링 메커니즘을 설명하기 위해 도입됨.", "origin": "1980년대 후반 고온 초전도체 발견 직후 제안됨.", "connections": "고온 초전도, 스핀 요동 매개 페어링 이론."}], "english_summary": ["The study utilizes high-resolution Cu L3-edge RIXS to investigate the superconducting gap of Bi2223.", "RIXS provides bulk-sensitive insight into the superconducting pairing mechanism in high-Tc cuprates.", "The results offer important spectroscopic evidence on the d-wave symmetry of the superconducting gap in multi-layered cuprate systems."]}}, {"title": "Broadband and high-speed terahertz wireless sensing via vertical-transport Dirac-source detector", "journal": "Science_Advances", "source": "Gemini", "link": "https://doi.org/10.1126/sciadv.aeg2196", "authors": "Xiaokai Pan, Yiming Wang, Hangxiang Wang, et al.", "last_authors": "Wei Lu, Lin Wang", "summary": "In the realm of wireless sensing, it is envisioned that sensing and communication functionalities will coexist and be fully integrated within a unified system. Future sensing systems thus necessitate detectors capable of operating at higher frequency bands—ranging from millimeter wave to terahertz (THz)—while delivering wider bandwidths, faster response rates, and enhanced functional integration. Dirac-source (DS) detectors use Dirac semimetals as hot-electron sources to capitalize on the low density of states (DOS) near the Dirac point, thereby effectively suppressing the formation of metal-induced gap states. Furthermore, when this architecture incorporates the inherent interlayer vertical electron transport of vertical van der Waals (vdW) heterostructures, it shows great promise for realizing low-power, post–Moore era sensing devices with superior injection and transport efficiencies. Here, we report a DS detector composed of the completely vertical gold/zirconium pentatelluride/graphene/gold structure (Au/ZrTe 5 /graphene/Au) heterojunction, which harnesses strong localized fields to achieve high thermionic emission. The detector manifests outstanding performance in terms of remarkable responsivity, exceeds a peak of 1600 V/W from 0.02 to 0.5 THz at room temperature, has a fast response time less than 20 ns, and notably is capable for heterodyne mixing with intermediate frequency (IF) bandwidth larger than ±26.5 gigahertz. Our results not only shed a fresh light on DS dynamics in the terahertz region but also highlight the transformative potential of semimetal electronics for applications in wireless energy harvesting, communication, and imaging.", "tier": "B_IMPORTANT_CONDMAT", "score": "9", "reason": "Utilizes Dirac semimetals, graphene, and vdW heterostructures for terahertz electronics and transport.", "tags": ["Diracsemimetal", "graphene", "vanderWaalsheterostructure", "electronictransport", "optoelectronics"], "image": "", "briefing": {"background": "테라헤르츠(THz) 대역은 통신 및 센싱 분야에서 차세대 주파수로 주목받지만, 상온에서 효율적으로 작동하는 검출기 개발은 기술적 난제였습니다.", "motivation": "디락 준금속(Dirac semimetals)의 낮은 상태 밀도와 vdW 이종접합의 수직 수송 효율을 결합하여 고감도, 고속의 테라헤르츠 검출기를 구현하고자 합니다.", "result": "Au/ZrTe5/graphene/Au 수직 이종접합을 이용해 0.02~0.5 THz 대역에서 1600 V/W의 높은 응답도와 20 ns 미만의 빠른 응답 속도를 달성했습니다.", "implication": "위상 물질인 디락 준금속이 차세대 광전자 소자, 특히 테라헤르츠 센싱 및 통신 분야에서 실질적인 응용 가능성이 높음을 보여줍니다.", "novelty": "ZrTe5와 그래핀을 수직으로 적층한 구조에서 디락 입자의 수송 특성을 최적화하여 고효율 테라헤르츠 하드웨어를 구현했습니다.", "unresolved": "이러한 소자를 대면적 공정으로 확장하여 양산 체제를 구축하는 것은 여전히 공학적 과제로 남아있습니다.", "future_work": "온-칩 통합을 통한 다기능성 통신 센싱 시스템 구축 및 더 넓은 주파수 대역으로의 확장 연구.", "concepts": [{"term": "Dirac Semimetal", "why_emerged": "위상학적으로 보호된 밴드 교차를 가진 물질의 특이적 수송 현상을 활용하기 위해.", "origin": "ZrTe5 등에서 실험적으로 입증됨 (2010년대 중반).", "connections": "위상 절연체, 그래핀, 베리 곡률."}, {"term": "Van der Waals Heterostructure", "why_emerged": "원자층 수준의 깨끗한 계면을 통해 서로 다른 물리적 특성을 결합하기 위해.", "origin": "Andre Geim 그룹 (2013).", "connections": "2D 소재, 모아레 물리학, 소자 집적화."}], "english_summary": ["A vertical Dirac-source detector based on ZrTe5/graphene heterostructures is developed.", "The device achieves high responsivity (1600 V/W) and fast response times in the THz regime.", "This demonstrates the potential of semimetal electronics for future wireless sensing and communication."]}}, {"title": "Single-particle tunneling spectrum with a robust superconducting gap in La 2 PrNi 2 O 7 thin films at  상태 밀도의 변화가 초전도성에 미치는 영향을 명확히 규명합니다.", "novelty": "등방성 압력이 아닌 단축 압력을 사용하여 격자 왜곡이 전자 구조에 미치는 영향을 제어함으로써, 등방성 실험에서는 볼 수 없었던 이방성 물리 현상을 포착했습니다.", "unresolved": "이 시스템에서 발생하는 CDW가 초전도를 방해하는지, 아니면 특정 모드에서 협력하는지에 대한 미시적 메커니즘은 여전히 논의의 여지가 있습니다.", "future_work": "압력 하에서의 CD-ARPES 혹은 RIXS를 이용해 페르미 면의 변화와 CDW 갭의 닫힘 과정을 직접 관찰하는 연구가 요구됩니다.", "concepts": [{"term": "Remeika stannides", "why_emerged": "금속 화합물에서 CDW와 초전도성의 상호작용을 연구하기 위한 결정 구조적으로 흥미로운 물질군으로 발굴됨.", "origin": "Remeika et al. (1980년대 초반)", "connections": "La3Co4Sn13, 초전도-CDW 상호작용"}, {"term": "전하 밀도 파(CDW)", "why_emerged": "격자의 주기적 변형과 전하 밀도의 재배치가 결합하여 에너지 밴드 갭을 형성하는 전자 질서 상태를 설명하기 위해 필요함.", "origin": "Peierls (1955)", "connections": "Peierls 전이, 전자-격자 상호작용"}], "english_summary": ["The study investigates La3Co4Sn13 under uniaxial pressure.", "It focuses on the interplay between charge density wave (CDW) order and superconductivity.", "Uniaxial pressure serves as a tuning parameter to resolve the competition between these electronic orders."]}}, {"title": "Layer-dependent control of spin Hall effect in antiferromagnetic topological insulator", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/cyqr-7sgt", "authors": "Sheng Pan, Xin Chen, Hong-Fei Huang, Jie-Xiang Yu", "last_authors": "Hong-Fei Huang, Jie-Xiang Yu", "summary": "Author(s): Sheng Pan, Xin Chen, Hong-Fei Huang, and Jie-Xiang Yu The spin Hall effect (SHE), a key mechanism for generating spin currents, is typically uniform in bulk materials. In topological materials, however, the layer degree of freedom offers a novel avenue to control spin transport. Here, we demonstrate a layer-resolved SHE in the intrinsic antiferromagnet… [Phys. Rev. B 113, 224416] Published Thu Jun 04, 2026", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Layer-resolved spin transport study in an antiferromagnetic topological insulator.", "tags": ["topological", "antiferromagnet", "transport"], "image": "", "briefing": {"background": "위상 절연체와 반강 ive measurements, is crucial for the establishment of the precise pairing symmetry of the superconductor.… [Phys. Rev. B 113, 214510] Published Fri Jun 05, 2026", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Significant experiment on unconventional superconductor Sr2RuO4.", "tags": ["superconduct", "unconventionalsuperconductivity"], "image": "", "briefing": {"background": "Sr2RuO4는 고온 초전도체인 구리 산화물과 유사한 층상 페로브스카이트 구조를 가져, 오랫동안 비전통적 초전도성의 후보로 연구되어 온 물질입니다. 특히 초전도 상태의 페어링 대칭성(pairing symmetry)을 규명하는 것이 물리학계의 핵심 난제였습니다.", "motivation": "Sr2RuO4의 페어링 대칭성을 결정하기 위해 위상 민감도(phase-sensitive) 측정이 필수적이며, 이를 구현하기 위해 고품질의 Josephson 접합 소자를 제작하여 물리적 신호를 분석하고자 했습니다.", "result": "Al/Ti/Sr2RuO4 램프형 Josephson 접합을 통해 단일 도메인 양자 진동을 관측하였으며, 이를 기반으로 카이랄 표면 전류를 검출하였습니다.", "implication": "이 연구 결과는 Sr2RuO4의 페어링 대칭성을 둘러싼 기존 논쟁에 중요한 실험적 단서를 제공하며, 시스템의 초전도 상태가 카이랄 성질을 띠고 있음을 시사합니다.", "novelty": "Sr2RuO4의 복잡한 초전도 페어링을 직접적인 위상 민감도 측정으로 접근했다는 점에서 고무적이며, 이는 단결정의 결함 문제를 해결하는 데 중요한 진전을 의미합니다.", "unresolved": "실험적 결과가 이론적 모델과 정량적으로 완전히 일치하는지, 그리고 시스템 내부의 불순물 효과를 완벽히 배제했는지에 대한 논의가 추가로 필요합니다.", "future_work": "다른 결정 방향에서의 위상 측정 및 초전도 상태의 비등방성 변화를 추적하는 후속 정밀 분광 실험이 이어질 것으로 예상됩니다.", "concepts": [{"term": "Josephson 접합", "why_emerged": "두 초전도체 사이의 위상차를 직접 측정하기 위해 고안된 전자 소자입니다.", "origin": "Brian D. Josephson (1962).", "connections": "SQUID, 양자 간섭 소자, 위상 민감도 측정."}, {"term": "카이랄 초전도성", "why_emerged": "Sr2RuO4의 시간 반전 대칭성 깨짐과 관련된 이국적인 페어링을 설명하기 위해 등장했습니다.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "시간 반전 대칭성 깨짐, 위상 초전도체, 페어링 대칭성."}], "english_summary": ["The paper investigates the superconducting pairing symmetry of Sr2RuO4.", "Josephson junction phase-sensitive measurements are utilized to probe the order parameter.", "Observation of single-domain quantum oscillations provides evidence for chiral surface currents.", "These findings clarify aspects of the long-standing debate on the unconventional superconductivity of this material."]}}, {"title": "Reciprocal-space electromagnetic induction hin nanotubes of semiconducting transition metal dichalcogenides offer a platform for exploring quantum phenomena at the one-dimensional limit and for realizing nanoscale transistor channels. However, conventional syntheses produce only large-diameter (>10 nm), multiwalled tubes with uncontrolled chiralities. We report the synthesis of single-walled molybdenum disulfide (MoS 2 ) nanotubes with diameters approaching 1 nm, achieved through spatially confined reactions inside boron nitride (BN) nanotubes. The confined geometry stabilizes otherwise inaccessible, highly strained MoS 2 nanotubes, yielding structurally well-defined armchair configurations. Their bandgaps shrink systematically with decreasing diameter, in accordance with long-standing theoretical predictions. The insulating BN sheath simultaneously provides an intrinsic gate-all-around architecture, thereby promising access to truly nanoscale transistor channels.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Significant 1D TMD study with bandgap characterization relevant to user's quasi-1D and 2D material interests.", "tags": ["TMD", "nanotube", "one-dimensional", "electronicstructure"], "image": "", "briefing": {"background": "TMD 물질은 2D에서 1D로 차원이 줄어들 때 양자 구속 효과로 인해 밴드 구조가 급격히 변하며, 이를 제어하여 나노 소자 채널로 활용하려는 연구가 활발함.", "motivation": "기존 대구경의 다중벽 나노튜브와 달리, 1nm 수준의 단일벽 MoS2 나노튜브를 합성하여 물리적 한계를 탐구하고 이론적 예측을 검증하고자 함.", "result": "BN 나노튜브 내부에 1nm 직경의 단일벽 MoS2 나노튜브를 안정적으로 성장시키는 데 성공함.", "implication": "나노 규모에서 밴드갭 엔지니어링이 가능함을 입증하였으며, BN-MoS2 계면을 이용한 이상적인 나노 트랜지스터 구조를 제시함.", "novelty": "공간 제약 합성법을 통해 이전에는 접근 불가능했던 고변형 MoS2 구조를 실현했으며, 밴드갭과 직경 간의 관계를 최초로 실험적으로 입증함.", "unresolved": "대량 생산의 가능성과 고정된 chirality 제어의 정밀도 문제가 남아 있음.", "future_work": "다양한 TMD 물질에의 적용 및 이를 활용한 단일 튜브 기반 전자 소자 특성 측정.", "concepts": [{"term": "Transition Metal Dichalcogenides (TMD)", "why_emerged": "그래핀의 한계를 넘는 밴드갭을 가진 2D 반도체 물질을 찾기 위해.", "origin": "Mattheiss (1973)", "connections": "MoS2, 반데르발스 헤테로구조, 엑시톤 물리학."}, {"term": "Quantum confinement", "why_emerged": "차원이 축소될 때 전자의 파동함수가 갇히며 나타나는 에너지 준위 변화를 설명하기 위해.", "origin": "Efrim and Brus (1980s)", "connections": "밴드갭 조절, 양자 점, 1D 물리학."}], "english_summary": ["Synthesized single-walled MoS2 nanotubes at the 1-nm diameter limit.", "Used confined growth inside boron nitride nanotubes for stabilization.", "Demonstrated systematic bandgap tuning with diameter reduction.", "Provides a path for nanoscale transistor channel engineering."]}}, {"title": "Symmetry-locked six-state control of altermagnetism via sliding ferroelectricity", "journal": "Science_Advances", "source": "Gemini", "link": "https://doi.org/10.1126/sciadv.aec5229", "authors": "Wei Sun, Wenxuan Wang, Changhong Yang, Shifeng Huang, Zhenxiang Cheng", "last_authors": "Shifeng Huang, Zhenxiang Cheng", "summary": "Altermagnetic multiferroics offer a promising route to low-power spintronics by enabling spin splitting without net magnetization, extending beyond conventional spin-orbit coupling. However, achieving deterministic electric control has remained elusive. Here, a six-state platform for high-dimensional magnetoelectric coupling in altermagnets is established by exploiting the nondegenerate transition paths of sliding ferroelectrics as a symmetry-engineering knob, thereby transcending the conventional binary (up/down) paradigm of sliding ferroelectricity. First-principles calculations on bilayer manganese phosphorus trisulfide reveal a spin-polarization symmetry-locking mechanism. Polarization switching along the three nondegenerate paths not only reverses the spin splitting but also rotates its spin-splitting texture in 120° increments, yielding six nonvolatile, electrically addressable altermagnetic states. Furthermore, direct correspondence is established between the spin-splitting texture and the nonlinear Hall response, providing unique electrical fingerprints for each state. This work establishes a paradigm for electric field–driven reconstruction of momentum-space spin geometry, providing a versatile platform for controlling quantum phenomena in altermagnetic spintronics.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "High-interest altermagnetism control in a real vdW bilayer system via polarization and spin-splitting.", "tags": ["material", "altermagnet", "ferroelectric"], "image": "", "briefing": {"background": "스핀-궤도 결합(SOC)을 통해 스핀 분극을 제어하는 기존의 spintronics와 달리, 최근 altermagnetism은 순자화(net magnetization)가 0임에도 스핀 분극이 발생하는 새로운 자기 질서로 주목받고 있습니다.", "motivation": "Altermagnet에서 전기적 제어를 통해 스핀 상태를 결정론적으로 조절하는 방법론을 개발하기 위해, 슬라이딩 강유전체(sliding ferroelectricity)라는 자유도를 도입하고자 했습니다.", "result": "이중층 MnPS3에서 슬라이딩 강유전체 경로를 활용하여 6가지의 비휘발성 altermagnet 상태를 생성할 수 있음을 이론적으로 보였습니다. 편극 방향에 따라 스핀 분극 텍스처가 120도씩 회전함을 확인했습니다.", "implication": "운동량 공간의 스핀 구조를 전기장으로 직접 재구성할 수 있어, 차세대 저전력 스핀 소자 구현에 중요한 기초 플랫폼이 될 것입니다.", "novelty": "이진법(up/down)에 국한되었던 기존의 강유전체 제어 패러다임을 6상태 시스템으로 확장하고, 이를 altermagnetism과 결합하여 비선형 Hall 응답으로 검출 가능하다는 점을 제안했습니다.", "unresolved": "이론적 계산(DFT)에 의존한 결과이므로, 실제 이중층 MnPS3에서 강유전체 슬라이딩과 altermagnetism의 결합을 실험적으로 관측하는 것이 남은 과제입니다.", "future_work": "실제 van der Waals 이중층 물질의 합성과 전기적 스위칭을 통한 비선형 Hall 전류 측정 실험이 필요합니다.", "concepts": [{"term": "Altermagnetism", "why_emerged": "기존 강자성체와 반강자성체의 한계를 넘어, 순자화는 없지만 스핀 분할이 일어나는 새로운 자기 위상 규명이 필요했음", "origin": "최근 3~4년 내 이론적 정립 및 RuO2 등에서 실험적 근거 확보", "connections": "반강자성 스핀트로닉스, 비전통적 스핀 분할"}, {"term": "Sliding Ferroelectricity", "why_emerged": "2차원 물질의 적층 순서 변화(슬라이딩)를 통해 전기적 분극을 유도하여 반데르발스 이종접합의 대칭성을 제어하기 위해", "origin": "van der Waals 이중층에서의 자발 분극 제어로 최근 주목받음", "connections": "moiré 시스템, 이중층 강유전성"}, {"term": "Spin-Splitting Texture", "why_emerged": "운동량 공간에서 스핀 분포의 비대칭성을 직관적으로 시각화하고 제어하기 위해", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "Rashba 효과, Weyl semimetal"}], "english_summary": ["Altermagnetic multiferroics offer a way to control spin splitting without net magnetization.", "The paper proposes a six-state platform using sliding ferroelectricity in bilayer MnPS3.", "Polarization switching enables rotation of spin-splitting textures in 120-degree increments.", "This mechanism allows for electrically addressable altermagnetic states detectable via nonlinear Hall responses."]}}, {"title": "All optical excitation of spin polarization in d-wave altermagnets", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2408.05187", "authors": "Marius Weber, Stephan Wust, Luca Haag, et al.", "last_authors": "Benjamin Stadtm\\\"uller, Hans Christian Schneider", "summary": "arXiv:2408.05187v3 Announce Type: replace Abstract: The recently discovered altermagnets exhibit collinear magnetic order with zero net magnetization but with unconventional spin-polarized d/g/i-wave band structures, expanding the known paradigms of ferromagnets and antiferromagnets. In addition to novel current-driven electronic transport effects, the unconventional time-reversal symmetry breaking in these systems also makes it possible to obtain a spin response to \\emph{linearly polarized} fields in the optical frequency domain. We show through ab-initio calculations of the prototypical d-wave altermagnet RuO$_2$, with a symmetry combining twofold spin rotation with fourfold lattice rotation, $[C_2\\|C_{4z}]$, that there is an optical analogue of a spin splitter effect, as the coupling to a linearly polarized exciting laser field makes the d-wave character of the altermagnet directly visible. By magneto-optical measurements on RuO$_2$ films of different thicknesses ranging from $2$ to $8\\,$nanometers, we demonstrate the predicted connection of the linear polarization of an ultrashort pump pulse to the sign and magnitude of the optically excited electronic spin polarization in the ultrathin RuO$_2$ films. The possibility of exciting and controlling an electronic spin polarization by linearly polarized optical pulses in a compensated system is a unique consequence of the altermagnetic material properties. Our experimental results therefore establish an optical pump-probe based protocol for detection of altermagnetic characteristics in ultrathin RuO$_2$ films, but our all-optical approach should apply more generally to materials in this altermagnetic symmetry class.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Direct relevance of TRSB and altermagnetism to user's interest in magnetic topological materials.", "tags": ["altermagnet", "TRSB", "magneto-optics"], "image": "https://arxiv.org/html/2408.05187v3/x1.png", "briefing": {"background": "Altermagnet은 시간반전대칭성(TRSB)이 깨진 collinear 자기 구조를 가지며, 비전통적인 스핀 분극을 보입니다. 이를 외부 자극으로 제어하는 방법이 spintronics 연구의 핵심입니다.", "motivation": "전류를 이용한 기존의 제어 방식 외에, 선편광된 광원을 사용하여 altermagnet의 스핀 분극 상태를 광학적으로 들뜨게 하고 검출할 수 있는지 확인하고자 했습니다.", "result": "d-파 altermagnet인 RuO2에서 선편광된 레이저 펄스가 스핀 분할 효과를 광학적으로 유도할 수 있음을 증명했습니다. 박막 두께에 따른 스핀 분극 변화를 통해 이론적 모델을 검증했습니다.", "implication": "Altermagnet의 자기적 특성을 광학적 펌프-프로브 측정을 통해 비파괴적이고 정밀하게 검출할 수 있는 프로토콜을 확보했습니다.", "novelty": "Altermagnet의 대칭성([C2||C4z])과 선편광 사이의 연결 고리를 실험적으로 입증하여, 자기장 없이 광학적으로 스핀 상태를 제어할 수 있는 가능성을 제시했습니다.", "unresolved": "단일 결정 물질에서의 정밀한 스핀 동역학 및 다양한 altermagnet 물질군으로의 일반화 여부가 검토되어야 합니다.", "future_work": "더 넓은 범위의 altermagnetic 물질에서 광학적 스핀 주입 효율 및 릴랙세이션 시간을 측정하는 후속 연구가 예상됩니다.", "concepts": [{"term": "d-wave Altermagnet", "why_emerged": "RuO2와 같은 물질의 전자 구조에서 d-파 형태의 스핀 분할을 이해하기 위해 필요", "origin": "최근 2-3년 내 altermagnet 이론적 발전 과정에서 정립", "connections": "비전통적 반강자성, RuO2 물성 연구"}, {"term": "TRSB", "why_emerged": "시간반전대칭성이 깨져야 순자화가 없어도 스핀이 분극된 상태를 유지할 수 있기 때문에", "origin": "물리학의 고전적 대칭성 개념", "connections": "자기 위상 물질, 위상 절연체"}, {"term": "Magneto-optics", "why_emerged": "자기 질서를 광학적 응답으로 비접촉식으로 측정하기 위해", "origin": "Faraday, Kerr 효과 연구로부터 확립", "connections": "펌프-프로브 분광학, MOKE"}], "english_summary": ["Altermagnets allow for spin responses to linearly polarized optical fields.", "RuO2 serves as a d-wave altermagnet model with [C2||C4z] symmetry.", "Experimental demonstration shows optical excitation of spin polarization in ultrathin RuO2 films.", "The study establishes an all-optical protocol for detecting altermagnetic characteristics."]}}, {"title": "Anisotropic marginal Fermi liquid for Coulomb interacting generalized Weyl fermions (Phys. Rev. B)", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2602.17666", "authors": "Gabriel Malav\\'e, Rodrigo Soto-Garrido, Bitan Roy, Vladimir Juri\\v{c}i\\'c", "last_authors": "Bitan Roy, Vladimir Juri\\v{c}i\\'c", "summary": "arXiv:2602.17666v2 Announce Type: replace Abstract: Owing to the power-law anisotropy in the quasiparticle dispersion, yielding an enhanced density of states, the effects of long range Coulomb interaction get amplified in three-dimensional generalized Weyl semimetals, characterized by integer monopole charge $n>1$ of the underlying Weyl nodes. Using a Wilsonian renormalization group approach controlled by a large-$N$ expansion with $N$ as the number of Weyl fermion flavors and a gauge-consistent regularization fixed by the Ward-Takahashi identity, we uncover for $n\\ge 2$ an extended interaction-dominated scaling regime with intrinsically anisotropic dynamic Coulomb screening, a finite fermionic anomalous dimension, and a power-law suppression of the quasiparticle residue, yielding an \\emph{anisotropic} marginal non-Fermi liquid at intermediate energies. Ultimately, the effective fine structure constant flows to zero, albeit only logarithmically slowly, so the marginal Fermi liquid phenomenology emerges as a broad crossover, controlled by a slowly running coupling. By contrast, for $n=1$ the system retains an isotropic marginal Weyl-liquid character. These predictions can be tested via scaling in thermodynamics (specific heat and compressibility), direction-dependent optical conductivity, and by anisotropic broadening of the single-particle spectral function in angle-resolved photoemission spectroscopy.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Direct relevance to Weyl semimetals, electronic structure, and ARPES o l 노드에서의 물성 연구를 위해", "origin": "다중 Weyl semimetal 이론 연구들", "connections": "위상 반금속, Berry curvature"}, {"term": "Renormalization Group (RG)", "why_emerged": "다양한 에너지 스케일에서 발생하는 복잡한 상호작용 효과를 체계적으로 계산하기 위해", "origin": "Kenneth Wilson (1970년대)", "connections": "임계 현상, 강상관 전자계"}], "english_summary": ["The study examines generalized Weyl semimetals with integer monopole charge n > 1.", "Long-range Coulomb interactions induce anisotropic marginal non-Fermi liquid behavior.", "Key findings include power-law suppression of quasiparticle residue and anisotropic screening.", "Results predict direction-dependent signatures in ARPES spectral functions and thermodynamic properties."]}}, {"title": "Propagation and localization of spin excitations at altermagnetic domain walls", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2606.10604", "authors": "Oksana Peschanska, Jeroen van den Brink, Volodymyr P. Kravchuk", "last_authors": "Jeroen van den Brink, Volodymyr P. Kravchuk", "summary": "arXiv:2606.10604v1 Announce Type: new Abstract: Altermagnets (A$\\ell$Ms) are spin-compensated materials in which opposite-spin sublattices are connected by a symmetry that causes a spin splitting in their elementary excitations. As there is a strong effect of altermagnetism on domain wall properties, it is quite natural to also expect an enrichment of the physics of magnetic excitations at A$\\ell$M domain walls. Here, we consider the propagation of spin eigen-excitations along domain walls in easy-axial $d$-wave A$\\ell$Ms. Investigating the presence of bound states localized on a domain wall, we find that the effect of the A$\\ell$M on the bound states strongly depends on the orientation of the domain wall relative to the crystallographic directions. If the domain wall is oriented along a nodal direction [100] or [010], A$\\ell$M does not change the number of bound states; however, it leads to a nonlinear dispersion and a tilt of the wavefront. The effect of A$\\ell$M is strongest when the domain wall is oriented along the directions [110] or [$\\bar{1}$10], i.e., along the directions of the strongest A$\\ell$M splitting in the magnon spectrum. In this case, (i) the additional gapped bound states appear, (ii) degeneracy of the eigenstates with respect to their polarization (right-handed or left-handed precession of the N{\\'e}el vector) is removed, and (iii) the localization area of the bound states strongly depends on the eigenfrequency. The latter may lead to strong localization of the bound state at the domain wall. We further consider the influence of a static magnetic field that is applied along the easy axis, and find that the magnetic field induces an asymmetry between the localization regions on opposite sides of the domain wall and sets an upper limit on the absolute value of the propagating eigenstate's wave vector.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Theoretical study of altermagnetism and spin excitation localization.", "tags": ["altermagnetism", "magnons", "theory"], "image": "https://arxiv.org/html/2606.10604v1/x1.png", "briefing": {"background": "알터마그네틱(Altermagnetic)은 기존의 강자성(Ferromagnetism)이나 반강자성(Antiferromagnetism)으로 분류되지 않는 새로운 자기적 위상으로, 대칭성에 의해 스핀 분할된 에너지 밴드 구조를 갖습니다. 이 물질 내의 도메인 벽(domain wall)은 스핀 구조의 불연속성으로 인해 독특한 자기 들뜸(magnon) 모드를 생성할 수 있어 스핀트로닉스 응용 연구의 핵심 영역입니다.", "motivation": "이 논문은 d-파 알터마그네틱 도메인 벽에서 스핀 들뜸이 어떻게 전파되고 국소화(localization)되는지를 이론적으로 규명하고자 합니다.", "result": "도메인 벽의 결정학적 방향에 따라 알터마그네틱 효과가 크게 달라짐을 발견했습니다. 특정 방향([110])에서는 새로운 갭이 있는 속박 상태가 나타나고 스핀 편극에 따른 축퇴가 깨지며, 자기장에 의해 국소화 영역의 비대칭성이 유도됨을 보였습니다.", "implication": "알터마그네틱 도메인 벽을 이용한 정밀한 스핀파 제어 및 정보를 전달하는 스핀트로닉 소자 설계의 물리적 토대를 제공합니다.", "novelty": "기존 반강자성 도메인 벽 연구와 달리 알터마그네틱 고유의 스핀 분할 대칭성이 스핀 들뜸의 위상학적 성질에 직접적인 영향을 준다는 점을 정량적으로 입증했습니다.", "unresolved": "실제 실험적 환경에서의 결함이나 온도 변화에 따른 들뜸의 감쇠 효과는 고려되지 않았습니다.", "future_work": "실제 알터마그네틱 물질(예: MnTe 등)에서 브릴루앙 광산란이나 RIXS를 이용한 도메인 벽 마그논 분산 측정 연구가 필요합니다.", "concepts": [{"term": "Altermagnetism", "why_emerged": "순 스핀 자화는 없으나 비상관 대칭성으로 인해 에너지 밴드에서 스핀 분할이 일어나는 물질을 설명하기 위해 도입됨", "origin": "초록 정보만으로는 특정하기 어려움 (최근 2-3년 내 학계에 널리 퍼짐)", "connections": "반강자성, 스핀-궤도 결합, 비상관성 대칭(Non-relativistic spin-splitting)"}, {"term": "Magnons", "why_emerged": "자기 정렬 물질 내의 집단적인 스핀 들뜸을 입자적으로 기술하기 위해 사용", "origin": "Felix Bloch (1930)", "connections": "스핀파, 양자 자성, 비탄성 중성자 산란"}], "english_summary": ["The paper investigates spin excitations in d-wave altermagnetic domain walls.", "The localization of bound states is found to be highly dependent on the crystallographic orientation of the domain wall.", "Altermagnetism breaks the polarization degeneracy and introduces new gapped bound states.", "External magnetic fields further tune the localization and wave propagation characteristics."]}}, {"title": "Extrinsic anomalous Hall effect in altermagnets", "journal": "npj_QuantumMaterials", "source": "Gemini", "link": "https://www.nature.com/articles/s41535-026-00895-3", "authors": "Alexander Osin, Alex Levchenko, Maxim Khodas", "last_authors": "Alex Levchenko, Maxim Khodas", "summary": "npj Quantum Materials, Published online: 30 May 2026; doi:10.1038/s41535-026-00895-3 Extrinsic anomalous Hall effect in altermagnets", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Theoretical treatment of transport in altermagnets, relevant to user's anomalous Hall interests.", "tags": ["theory", "altermagnetism", "anomalousHalleffect"], "image": "https://pubads.g.doubleclick.net/gampad/ad?iu=/285/npjquantmats.nature.com/article&sz=728x90&c=-88272436&t=pos%3Dtop%26type%3Darticle%26artid%3Ds41535-026-00895-3%26doi%3D10.1038/s41535-026-00895-3%26subjmeta%3D301,639,766%26kwrd%3DMaterials+science,Physics", "briefing": {"background": "비정상 홀 효과(Anomalous Hall Effect)는 자성 물질에서 자화나 Berry 곡률에 의해 전하 수송이 휘어지는 현상입니다. 알터마그네틱은 순 자화가 0임에도 불구하고 Berry 곡률의 기여로 인해 수송 특성이 나타날 수 있어, 물질의 위상학적 성질을 규명하는 핵심 도구로 주목받습니다.", "motivation": "순수한 격자 기여(intrinsic) 외에 불순물 산란과 같은 외부적(extrinsic) 요인이 알터마그네틱의 비정상 홀 효과에 미치는 영향을 lon)과 연관됩니다."}], "english_summary": ["Herbertsmithite is investigated as a prime candidate for a quantum spin liquid ground state.", "Impurity spins are successfully utilized as local probes to monitor spin dynamics.", "The study provides evidence for spinon-mediated dynamics, supporting the realization of a quantum spin liquid."]}}, {"title": "Anisotropic electron-phonon coupling and chiral phonons in the van der Waals room temperature ferromagnet Fe5GeTe2", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/fylb-8xlx", "authors": "Smrutiranjan Mekap, Andrzej Ptok, Jyoti Saini, Changgu Lee, Subhasis Ghosh, Anushree Roy", "last_authors": "Subhasis Ghosh, Anushree Roy", "summary": "Author(s): Smrutiranjan Mekap, Andrzej Ptok, Jyoti Saini, Changgu Lee, Subhasis Ghosh, and Anushree Roy The layered van der Waals ${\\mathrm{Fe}}_{5}{\\mathrm{GeTe}}_{2}$ (F5GT) compound exhibits room-temperature ferromagnetism, making it a promising candidate for technological applications. In our study, combined temperature, wavelength, and polarization-dependent Raman measurements, along with ab init… [Phys. Rev. B 113, 214304] Published Thu Jun 04, 2026", "tier": "B_IMPORTANT_CONDMAT", "score": "7", "reason": "Experimental Raman study of electron-phonon coupling in a magnetic van der Waals material.", "tags": ["phonon", "vanderWaals", "magnetism"], "image": "", "briefing": {"background": "반데르발스(van der Waals) 자성체는 층상 구조의 특성 덕분에 소자 응용 가능성이 높으며, 특히 상온 강자성을 보이는 물질은 차세대 스핀트로닉스 분야에서 핵심적인 연구 대상입니다.", "motivation": "Fe5GeTe2(F5GT)의 상온 강자성 특성과 전자-포논 상호작용 사이의 상관관계를 규명하여, 물질의 물리적 성질이 격자 진동과 어떻게 결합되어 있는지 이해하고자 함.", "result": "라만 분광법과 제1원리 계산을 통해 F5GT의 비등방성 전자-포논 결합을 확인하고, 특정 모드에서 키랄 포논(chiral phonon)의 거동을 관찰함.", "implication": "강자성 반데르발스 물질에서의 위상적 포논 특성이 스핀-격자 결합에 미치는 영향을 이해함으로써 자성 소재의 제어 가능성을 넓힘.", "novelty": "상온 강자성체인 F5GT에서 비등방성 전자-포논 결합과 키랄 포논의 공존을 실험적으로 입증한 점이 특징이며, 이는 위상 자성 물질 연구자들에게 중요한 피드백을 제공함.", "unresolved": "키랄 포논이 실제 강자성 정렬의 스위칭이나 동역학에 구체적으로 어떻게 기여하
