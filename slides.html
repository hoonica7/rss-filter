<title>Daily Paper Slideshow</title>
<style>
  :root {
    color-scheme: light;
    --bg: #f6f7f4;
    --paper: #ffffff;
    --ink: #111827;
    --muted: #64748b;
    --line: #d8ddd2;
    --accent: #176b87;
    --accent-2: #9a3412;
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; overflow: auto; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: var(--bg); color: var(--ink); }
  .shell { max-width: 1500px; min-height: 100vh; margin: 0 auto; padding: 14px 18px; display: flex; flex-direction: column; }
  .topbar { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 16px; }
  .top-actions { display: flex; align-items: center; gap: 10px; }
  .topbar a, button { border: 1px solid var(--line); border-radius: 8px; background: var(--paper); color: var(--ink); padding: 10px 14px; font-weight: 700; text-decoration: none; cursor: pointer; }
  button.primary { background: var(--accent); border-color: var(--accent); color: white; }
  button:disabled { opacity: 0.45; cursor: not-allowed; }
  .counter { color: var(--muted); font-weight: 700; }
  .slide { min-height: calc(100vh - 82px); background: var(--paper); border: 1px solid var(--line); border-radius: 10px; padding: 18px; box-shadow: 0 18px 42px rgba(15, 23, 42, 0.10); display: grid; grid-template-columns: minmax(310px, 0.86fr) minmax(0, 1.55fr); gap: 18px; overflow: visible; }
  .paper-head { min-width: 0; min-height: 0; overflow: visible; display: flex; flex-direction: column; gap: 12px; }
  .figure { margin: 0; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: #f8fafc; }
  .figure img { display: block; width: 100%; max-height: 41vh; object-fit: contain; background: white; }
  .figure figcaption { padding: 7px 10px; color: var(--muted); font-size: 12px; line-height: 1.3; }
  .head-text { display: flex; flex-direction: column; gap: 9px; min-width: 0; }
  .badges { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .badge { border-radius: 999px; padding: 5px 9px; background: #eef2ff; color: #3730a3; font-size: 12px; font-weight: 800; }
  .score { background: #fee2e2; color: #991b1b; }
  h1 { margin: 0; font-size: 25px; line-height: 1.15; letter-spacing: 0; overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
  h1 a { color: inherit; text-decoration-color: rgba(23, 107, 135, 0.35); text-decoration-thickness: 2px; text-underline-offset: 4px; }
  h1 a:hover { color: var(--accent); text-decoration-color: var(--accent); }
  .meta, .authors, .why, .abstract { font-size: 13px; line-height: 1.45; }
  .meta, .authors { color: var(--muted); }
  .why strong, .abstract strong, .authors strong { color: var(--ink); }
  .authors { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .why { border-left: 4px solid var(--accent-2); padding-left: 10px; color: #374151; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .abstract { border-top: 1px solid var(--line); padding-top: 14px; color: #374151; }
  .original-abstract { border-top: 1px solid var(--line); padding-top: 10px; color: #374151; font-size: 11.5px; line-height: 1.35; overflow-wrap: anywhere; }
  .original-abstract strong { display: block; margin-bottom: 4px; color: var(--ink); }
  .tags { display: flex; flex-wrap: wrap; gap: 8px; }
  .tag { border-radius: 999px; padding: 4px 8px; background: #f1f5f9; color: #475569; font-size: 12px; font-weight: 700; }
  .head-text > .link { display: none; }
  .briefing { min-width: 0; min-height: 0; overflow: visible; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); grid-auto-rows: minmax(0, auto); align-content: start; gap: 11px 18px; border-top: 0; padding-top: 0; }
  .brief-section { min-width: 0; }
  .brief-section.wide { grid-column: 1 / -1; }
  .brief-section h2 { margin: 0 0 4px; font-size: 14px; line-height: 1.22; color: #0f766e; letter-spacing: 0; }
  .brief-section p, .brief-section li { margin: 0; font-size: 12.5px; line-height: 1.42; color: #1f2937; overflow-wrap: anywhere; }
  .brief-section ul { margin: 0; padding-left: 20px; }
  .concepts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 9px 14px; }
  .concept { border-top: 1px solid var(--line); padding-top: 7px; }
  .concept h3 { margin: 0 0 4px; font-size: 13px; color: #7c2d12; letter-spacing: 0; }
  .concept p { margin: 2px 0 0; font-size: 11.5px; line-height: 1.35; color: #374151; overflow-wrap: anywhere; }
  .concept b { color: #111827; }
  .link { color: var(--accent); font-weight: 800; text-decoration: none; }
  .empty { padding: 48px; background: var(--paper); border: 1px solid var(--line); border-radius: 12px; color: var(--muted); }
  @media (max-width: 860px) {
    .shell { padding: 14px; }
    .topbar, .top-actions { align-items: stretch; flex-direction: column; }
    .slide, .briefing, .concepts { grid-template-columns: 1fr; }
    .slide { min-height: auto; overflow: visible; display: grid; }
    h1 { font-size: 28px; }
  }
</style>

const slides = [{"title": "Moiré-Modulated Γ Valley in Twisted Bilayer and Twisted Double-Bilayer MoTe2", "journal": "PRL_Recent", "source": "author whitelist", "link": "http://link.aps.org/doi/10.1103/wnyd-m5sr", "authors": "Wanying Chen, Hongyun Zhang, Jinxi Lu, et al.", "last_authors": "Chong Wang, Shuyun Zhou", "summary": "Angle-Resolved Photoemission Spectroscopy measurements on twisted bilayer and double-bilayer MoTe₂, combined with theory, reveal remote electronic bands that follow twist-induced lattice relaxation, establishing a direct link between atomic reconstruction and electronic structure in moiré semiconductors.", "tier": "A_MUST_READ", "score": "10", "reason": "author whitelist: Shuyun Zhou", "tags": ["angle-resolvedphotoemission", "photoemission", "moir", "twistedbilayer", "twisted"], "image": "", "briefing": {"background": "트위스트된 2차원 전이금속 디칼코게나이드(TMD) 시스템은 모아레(moiré) 포텐셜을 통해 전자 구조를 제어할 수 있어 양자 이상 홀 효과나 상관 전자계 연구의 핵심 플랫폼으로 자리 잡았습니다.", "motivation": "트위스트 각도에 따른 원자 구조의 재구성(lattice relaxation)이 실제 전자 밴드 구조, 특히 감마(Γ) 밸리의 원격 밴드들에 어떤 구체적인 영향을 미치는지 직접적인 실험적 증명이 필요했습니다.", "result": "Shuyun Zhou 교수 연구팀은 ARPES 측정을 통해 MoTe2의 트위스트 이중층 및 이중-이중층 구조에서 모아레 주기에 의해 변조된 전자 밴드를 관측하였으며, 이것이 격자 이완(relaxation) 모델과 일치함을 확인했습니다.", "implication": "원자 수준의 구조적 변형이 거시적인 모아레 전자 밴드 형성에 결정적인 역할을 함을 입증함으로써, 이론적 모델의 정확성을 높이고 맞춤형 밴드 구조 설계의 기반을 마련했습니다.", "novelty": "ARPES를 활용하여 모아레 반도체의 감마 밸리에서 격자 재구성의 직접적인 전자적 시그니처를 포착한 점이 돋보이며, 이는 독자의 ARPES 및 모아레 시스템 관심사와 밀접하게 연결됩니다.", "unresolved": "감마 밸리 이외의 K 밸리 등 다른 에너지 영역에서의 재구성 효과와 이것이 전체 위상학적 성질에 미치는 영향에 대한 추가 연구가 필요합니다.", "future_work": "다양한 트위스트 각도 및 외부 변형(strain)을 가한 상태에서의 ARPES 측정을 통해 밴드 구조를 능동적으로 제어하는 연구가 기대됩니다.", "concepts": [{"term": "Moiré-Modulated Bands", "why_emerged": "두 층 사이의 미세한 각도 차이가 거대한 주기의 초격자 포텐셜을 만들어 전자 밴드를 재조합하기 때문에 등장했습니다.", "origin": "초록 정보만으로는 특정하기 어려움 (비틀린 그래핀 연구에서 확산됨)", "connections": "Flat bands, Van Hove singularities, Moiré excitons"}, {"term": "Lattice Relaxation", "why_emerged": "트위스트 시스템에서 원자들이 에너지 최적화를 위해 국소적으로 위치를 재조정하며 밴드 구조를 왜곡시키기 때문에 중요해졌습니다.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "Atomic reconstruction, Strain engineering, Pseudo-magnetic fields"}], "english_summary": ["Observed moiré-modulated electronic bands in twisted MoTe2 using ARPES.", "Established a direct link between twist-induced lattice relaxation and electronic structure.", "Revealed remote electronic bands at the Γ valley matching structural reconstruction models.", "Highlighted the importance of atomic-scale deformation in moiré semiconductor physics."]}}, {"title": "Anomalous Hall Response Induced by Correlated Disorder in the Breathing Kagome Lattice Mn3Sn", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2609.09699", "authors": "Tsung-Han Yang, Seng Huat Lee, Hengxin Tan, et al.", "last_authors": "Zhiqiang Mao, Qiang Zhang", "summary": "Macroscopic transport tensors are generally constrained by the average crystallographic and magnetic symmetries of a material. In the kagome antiferromagnetic Weyl semimetals Mn X 3 + δ {}_{3+\\delta}X ( X = X= Sn or Ge), previous studies showed that the anomalous Hall conductivity σ y ​ x \\sigma_{yx} is forbidden by the average P ​ 6 3 / m ​ m ​ c P6_{3}/mmc structure and coplanar inverse-triangular magnetic order. Here we report that nearly stoichiometric Mn 3 Sn nevertheless exhibits a finite σ y ​ x \\sigma_{yx} with large hysteresis, together with enhanced σ z ​ x \\sigma_{zx} and σ y ​ z \\sigma_{yz} , in the inverse-triangular phase below T N1 ≈ 440 ​ K T_{\\mathrm{N1}}\\approx 440~\\mathrm{K} , whereas all AHE components vanish in the amplitude-modulated conical phase below T N2 ≈ 280 ​ K T_{\\mathrm{N2}}\\approx 280~\\mathrm{K} . Total scattering and magnetic pair distribution function analysis reveal correlated orthorhombic distortions and noncoplanar Mn moments. First-principles calculations show that this coupled lattice-spin distortion activates the average symmetry forbidden σ y ​ x \\sigma_{yx} within the inverse-triangular phase. Its disappearance below T N2 T_{\\mathrm{N2}} indicates that the correlated disorder must cooperate with a long-range inverse-triangular antiferromagnetic order capable of supporting Berry curvature. Our results establish correlated disorder as an active symmetry-breaking degree of freedom that enables topological transport inaccessible from the Bragg-average structure alone.", "tier": "A_MUST_READ", "score": "10", "reason": "Direct hit: Kagome lattice, Weyl semimetal, Anomalous Hall Effect, and Berry curvature studies.", "tags": ["experiment", "Mn3Sn", "kagome"], "image": "https://arxiv.org/html/2609.09699v1/AvgStrs_v7_rasterized.png", "briefing": {"background": "Mn3Sn과 같은 카고메 반강자성체는 바일 준금속(Weyl semimetal) 성질과 베리 곡률(Berry curvature)에 기인한 거대한 이상 홀 효과(AHE)를 보여 주목받아 왔습니다.", "motivation": "Mn3Sn의 평균적인 결정 구조와 자기 대칭성으로는 특정 방향의 홀 전도도(σyx)가 금지되어야 함에도 불구하고, 실제 실험에서 관측되는 이상 현상의 원인을 규명하고자 했습니다.", "result": "산란 실험과 자기 쌍분포 함수(mPDF) 분석을 통해, '상관된 무질서(correlated disorder)'인 사방정계 왜곡과 비공면(noncoplanar) 자기 모멘트가 대칭성을 깨뜨려 금지된 이상 홀 응답을 활성화함을 밝혔습니다.", "implication": "무질서가 단순히 물성을 저하시키는 요인이 아니라, 평균 구조에서 불가능한 위상학적 수송 특성을 유도하는 새로운 자유도로 활용될 수 있음을 시사합니다.", "novelty": "카고메 격자의 'Breathing' 모드와 상관된 무질서가 위상 수송에 미치는 영향을 연결한 점이 혁신적이며, 독자의 카고메 및 위상 물질 관심사에 직접 부합합니다.", "unresolved": "이러한 상관된 무질서를 인위적으로 제어하여 홀 응답의 크기와 방향을 조절할 수 있는 구체적인 공정 방법은 아직 미지수입니다.", "future_work": "다른 카고메 계열(Mn3Ge 등)에서도 유사한 무질서 유도 위상 효과가 나타나는지 확인하고, 이를 이용한 스핀트로닉스 소자 응용 연구가 가능합니다.", "concepts": [{"term": "Correlated Disorder", "why_emerged": "단순한 무작위 무질서와 달리, 국소적인 대칭성을 일관되게 깨뜨려 새로운 물리 현상을 유도하는 현상을 설명하기 위해 등장했습니다.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "Symmetry breaking, Local structure distortion, mPDF analysis"}, {"term": "Inverse-triangular phase", "why_emerged": "카고메 격자 Mn3Sn에서 거대한 이상 홀 효과를 발생시키는 특수한 자기 구조를 설명하기 위해 필요합니다.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "Non-collinear antiferromagnetism, Weyl nodes, Berry curvature"}], "english_summary": ["Identified correlated orthorhombic di  and optical properties of Na3Bi, one of the earliest discovered topological Dirac semimetals, using density functional theory. The hexagonal phase of Na3Bi is found to be both mechanically and dynamically stable, exhibiting moderate elastic anisotropy with a universal anisotropy index of 0.832. The compound displays a moderate machinability index of 2.386 alongside a low hardness value of 2.005, consistent with its predominantly brittle, covalently bonded character accompanied by a slight metallic contribution. Its comparatively low Debye temperature of 181.39K points to a mechanically soft lattice with loosely bound atoms. Electronic structure calculations confirm semimetallic behavior, with well-defined Dirac points pinned at the Fermi level and a Fermi surface composed of point-like pockets. Optical analysis across a wide spectral range reveals non-selective, moderate reflectivity of 40 to 45% and, in the visible region, an unusually high refractive index reaching between 2 and 4.5. Na3Bi is additionally found to be an efficient absorber of ultraviolet radiation. Together, these findings establish a comprehensive baseline for the mechanical, thermal, and optical behavior of hexagonal Na3Bi and point to its potential relevance for acoustic damping, UV-sensing, and optoelectronic applications", "tier": "B_IMPORTANT_CONDMAT", "score": "9", "reason": "Direct focus on the electronic structure and Fermi surface of a prototypical topological Dirac semimetal.; demoted from A: broad CM, not direct user/project hit", "tags": ["theory", "Na3Bi", "Dirac-semimetal"], "image": "https://arxiv.org/static/browse/0.3.4/images/arxiv-logo-fb.png", "briefing": {"background": "Na3Bi는 위상적 성질을 띠는 초기 Dirac 반금속 연구의 대표적인 물질로서, 전자의 위상적 특성과 결합된 고유 물성을 이해하는 것이 중요합니다.", "motivation": "Na3Bi의 기계적, 열적, 광학적 성질에 대한 통합적인 제일원리 데이터를 제공하여 응용 가능성을 타진하고자 합니다.", "result": "DFT 계산을 통해 육방정계 Na3Bi가 구조적/역학적으로 안정하며, Dirac 점이 페르미 준위에 정확히 위치함을 재확인했습니다.", "implication": "Na3Bi가 단순한 위상적 특성을 넘어 UV 센서 및 광학적 응용 분야에 x", "authors": "Florian Bärtl, Nadia Stegani, Federico Caglieris, et al.", "last_authors": "Hannes Kühne, Vadim Grinenko", "summary": "Four- or higher-order fermionic condensates can form in non-BCS multicomponent superconductors. Here, the authors present spectroscopic evidence for pairing correlations that appear well above the superconducting critical temperature in the highly overdoped Ba 1 − x K x Fe 2 As 2 system with broken time-reversal symmetry (BTRS). The NMR and μ SR findings show that multicomponent superconductivity appears homogeneously throughout the entire sample volume and that the BTRS state is unrelated to conventional spin magnetism.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Strong experimental paper on TRSB in superconductors; relevant to kagome physics.", "tags": ["superconductivity", "NMR", "TRSB"], "image": "", "briefing": {"background": "고온 초전도체, 특히 철 기반 초전도체에서 초전도 상태가 나타나기 전의 정상 상태에서 일어나는 전자쌍 형성(pairing)과 시간 반전 대칭성 깨짐(TRSB)의 근원을 밝히는 것은 응집물질물리학의 핵심 과제입니다.", "motivation": "Ba1−xKxFe2As2 화합물에서 관측된 TRSB 상태가 통상적인 자기 질서와 연관된 것인지, 혹은 다성분 초전도체에서 나타나는 고차 페르미온 응축 현상인지 규명하고자 했습니다.", "result": "NMR 및 μSR 실험을 통해 초전도 전이 온도(Tc)보다 높은 온도에서부터 페어링 상관관계가 존재함을 확인했으며, 이 TRSB 상태가 일반적인 스핀 자성과는 독립적인 현상임을 보였습니다.", "implication": "이 물질이 다성분 초전도체로서 고차 페르미온 응축을 포함하고 있음을 시사하며, 이는 비BCS 초전도 이론 확립에 중요한 증거가 됩니다.", "novelty": "벌크 샘플 전체에서 균일하게 나타나는 TRSB와 스핀 자성과의 무관함을 명확히 하여, kagome 금속 등에서 논의되는 TRSB의 기원을 이해하는 데 중요한 비교 분석 프레임워크를 제공합니다.", "unresolved": "이러한 고차 응축이 구체적으로 어떤 다성분 질서 변수와 결합되어 발생하는지에 대한 미시적 메커니즘은 여전히 숙제로 남아 있습니다.", "future_work": "다른 다성분 초전도체 후보군에서의 고온 페어링 상관관계 추적 및 상세한 이론적 다성분 질서 변수 모델링이 필요합니다.", "concepts": [{"term": "TRSB", "why_emerged": "초전도체 내부에서 시간 반전 대칭이 깨지면 자기장이 생성되거나 위상학적 상태가 유도될 수 있기 때문입니다.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "뮤온 스핀 회전(μSR), 초전도 질서 변수, 다성분 초전도체."}, {"term": "고차 페르미온 응축", "why_emerged": "BCS 이론의 쌍(pair) 응축을 넘어선 더 복잡한 다입자 상태를 기술하기 위해 필요합니다.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "다성분 초전도체, 비BCS 물리."}], "english_summary": ["NMR and muSR study of Ba1−xKxFe2As2 reveals pairing correlations above Tc.", "The observed time-reversal symmetry breaking (TRSB) is shown to be distinct from conventional spin magnetism.", "Evidence suggests the presence of multi-component superconductivity and higher-order fermionic condensates.", "The result provides a clear distinction between superconducting order and magnetic order in Fe-based systems."]}}, {"title": "Spin-orbit coupling effects in altermagnets: Interplay of weak spin and orbital ferromagnetism with relativistic splitting of electron states", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/dyg2-5578", "authors": "L. M. Sandratskii, K. Carva, V. M. Silkin", "last_authors": "K. Carva, V. M. Silkin", "summary": "The novel class of collinear compensated magnets, dubbed altermagnets, has attracted immense research attention by the property of nonrelativistic spin splitting. More recently, the properties of altermagnets caused by relativistic spin-orbit coupling (SOC) became the topic of many investigations. T…", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Altermagnetism is a key emerging field with high relevance to electronic structure.", "tags": ["altermagnet", "spin-orbit", "electronic-structure"], "image": "", "briefing": {"background": "알터자성(Altermagnetism)은 강자성이나 반강자성과는 구별되는 새로운 자기 질서 상태로, 비상대론적 스핀 분리를 특징으로 하여 차세대 스핀트로닉스 재료로 주목받고 있습니다.", "motivation": "알터자성체에서 스핀-궤도 결합(SOC)이 전자 상태의 상대론적 분리에 어떤 영향을 미치는지, 그리고 약한 스핀/궤도 강자성과 어떻게 상호작용하는지 분석하고자 합니다.", "result": "알터자성체의 고유한 비상대론적 스핀 분리 효과가 SOC와 결합하여 전자 구조에 어떻게 복잡성을 더하는지 체계적으로 분석했습니다.", "implication": "알터자성체의 전자 구조 제어 및 스핀 수송 특성을 활용한 소자 설계에 있어 SOC의 역할을 정확히 고려해야 함을 의미합니다.", "novelty": "단순한 이론적 정의를 넘어, 실제 물질 전자 구조에서의 SOC 역할을 분석함으로써 알터자성체의 물성을 현실적으로 이해하는 기반을 마련했습니다.", "unresolved": "SOC가 알터자성체의 특정한 위상학적 위상이나 전이 온도에 미치는 정량적인 영향은 추가적인 연구가 필요합니다.", "future_work": "다양한 알터자성 후보 물질에 대한 ARPES 및 제일원리 계산을 통한 SOC 효과의 실험적 검증.", "concepts": [{"term": "알터자성", "why_emerged": "보상된 자기 질서를 유지하면서도 전도 전자의 스핀 분리를 가능하게 하여 효율적인 스핀 흐름 제어를 위해 등장했습니다.", "origin": "최근 수년 내 이론적으로 제안됨(주로 노벨 이론가 그룹 등).", "connections": "반강자성, 강자성, 스핀트로닉스, 베리 곡률."}, {"term": "스핀-궤도 결합 (SOC)", "why_emerged": "전자의 스핀과 궤도 운동 간의 상호작용이 물질의 에너지 밴드 구조를 변형시키는 핵심 원인이기 때문입니다.", "origin": "원자 물리학의 기초 이론으로 확립됨.", "connections": "위상 절연체, 스핀 홀 효과, 알터자성."}], "english_summary": ["Altermagnets exhibit non-relativistic spin splitting, a property distinct from standard ferro- or antiferromagnets.", "This paper explores the role of relativistic spin-orbit coupling (SOC) in altermagnetic electronic structures.", "Interplay between weak spin/orbital ferromagnetism and SOC is analyzed for its effect on electron states.", "The findings provide a deeper understanding of how SOC modifies the band structure of altermagnets."]}}, {"title": "Superconductivity mediated by nematic fluctuations: The dispersion of collective modes", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/dn6s-8b5y", "authors": "Kazi Ranjibul Islam, Andrey Chubukov", "last_authors": "Kazi Ranjibul Islam, Andrey Chubukov", "summary": "We analyze the spectrum of collective modes in a superconductor, in which pairing is mediated by long-range nematic fluctuations. Previous experimental and theoretical studies have found that a superconducting gap in such a system is highly anisotropic and at any finite $T<{T}_{c}$ vanishes on fo…", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Nematicity is a direct area of interest for kagome physics.", "tags": ["nematic", "superconductivity"], "image": "", "briefing": {"background": "네마틱(nematic) 변동은 전자 계의 회전 대칭성을 자발적으로 깨는 현상으로, 많은 비전통적 초전도체에서 초전도 쌍 형성을 매개하는 중요한 기작으로 추정됩니다.", "motivation": "네마틱 변동에 의해 매개되는 초전도체에서 집단 여기 모드(collective modes)의 분산 관계를 규명하여 초전도 gap 구조와의 연관성을 확인하고자 합니다.", "result": "네마틱 변동에 의해 초전도 gap이 강하게 이방성을 띠며, 특정 온도 이하에서 노드(node)가 발생할 수 있음을 이론적으로 해석했습니다.", "implication": "네마틱 변동이 존재하는 물질에서 관측되는 이방성 초전도 gap의 미시적 근거를 제공하며, 실험 데이터와 이론을 연결하는 가교가 됩니다.", "novelty": "Kagome 금속과 같은 물질에서 나타나는 네마틱성과 초전도 현상의 복합적 기원을 이해하는 데 이론적 기틀을 마련했습니다.", "unresolved": "이러한 모드들이 실제 ARPES나 STM 데이터에서 어떻게 실험적으로 분해되어 나타날지에 대한 구체적인 계산 값은 추가 확인이 필요합니다.", "future_work": "다양한 이방성 초전도체에서의 비탄성 중성자 산란 혹은 RIXS를 통한 집단 모드 관측.", "concepts": [{"term": "네마틱 변동", "why_emerged": "전자 계의 결정 구조 대칭성과 전자 질서 변수의 대칭성이 일치하지 않는 현상을 기술하기 위해 도입되었습니다.", "origin": "철 기반 초전도체 연구에서 광범위하게 확립됨.", "connections": "전자 네마틱 상태, 초전도 페어링, 이방성."}, {"term": "집단 모드(Collective modes)", "why_emerged": "많은 전자들이 상호작용할 때 개별 입자가 아닌 계 전체가 함께 움직이는 에너지 여기 상태를 설명하기 위해 필요합니다.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "Goldstone 모드, 힉스 모드, 초전도 질서."}], "english_summary": ["Analysis of collective modes in superconductors mediated by long-range nematic fluctuations.", "The study shows that such mediation leads to highly anisotropic superconducting gaps.", "Superconducting gaps in this framework vanish at nodes at finite T.", "Provides a theoretical foundation for understanding nematic-fluctuation-induced pairing."]}}, {"title": "Competing Ordering Modes in the Distorted Quantum Kagome Material Clinoatacamite Cu2Cl(OH)3", "journal": "PRL_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/xmh8-68vk", "authors": "L. Stödter, C. Kastner, H. O. Jeschke, et al.", "last_authors": "U. K. Rößler, S. Süllow", "summary": "We have studied the magnetic properties of clinoatacamite Cu 2 Cl ( OH ) 3 , the parent compound of the quantum spin liquid candidate herbertsmithite and a long-standing puzzle among frustrated quantum magnets. As we reveal using density-functional theory, clinoatacamite belongs to the class of distorted kagome antiferromagnets with the kagome plane being embedded into a low-symmetry crystal structure. By means of thermodynamic measurements, muon spin rotation and relaxation, as well as neutron diffraction on single crystals, we find in zero magnetic field complex behavior below T I = 18.1 K which unfolds in three temperature regions I–III. We propose this complexity in multicritical clinoatacamite to arise from the competition of antiferromagnetic ordering modes from the underconstrained manifold of modes, which can lead to a metamagnetic texture in zero field.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Study of a kagome system using DFT; directly relevant to user's kagome interests.", "tags": ["material", "kagome", "DFT", "magnetism"], "image": "", "briefing": {"background": "카고메 격자 시스템은 기하학적 좌절(geometrical frustration)로 인해 양자 스핀 액체나 독특한 자기적 위상을 구현할 수 있는 후보 물질로 주목받고 있습니다.", "motivation": "카고메 물질군인 헤르베르트스미스석(herbertsmithite)의 모물질인 클리노아타카마이트(clinoatacamite)에서 관측되는 복잡한 자기적 성질의 원인을 규명하고자 합니다.", "result": "DFT 계산을 통해 이 물질이 왜곡된 카고메 반강자성체임을 확인하였으며, 저온에서 나타나는 세 가지 자기적 전이 영역이 서로 다른 반강자성 모드들 간의 경쟁으로 발생함을 보였습니다.", "implication": "좌절된 자성 시스템에서 무자기장 상태임에도 불구하고 메타자성(metamagnetic) 질서가 복잡하게 얽힐 수 있음을 시사합니다.", "novelty": "기존에 풀리지 않던 카고메 자성체의 복잡한 상태도를 정밀한 단결정 실험과 DFT 이론의 결합으로 체계화했다는 점에서 가치가 있습니다.", "unresolved": "왜곡된 카고메 구조에서 각 자기 모드가 어떻게 정확히 공간적 텍스처를 형성하는지에 대한 미시적 영상화는 여전히 과제로 남아 있습니다.", "future_work": "중성자 산란을 통한 자기 구조의 정밀도 향상 및 국소적 프로브(NMR 등)를 통한 자기 질서의 공간적 분포 규명이 필요합니다.", "concepts": [{"term": "기하학적 좌절", "why_emerged": "격자 구조상 스핀들이 모든 상호작용을 동시에 만족시킬 수 없는 상태가 발생하여 장거리 질서 형성을 방해하기 위해 필요함.", "origin": "Anderson 등 초기 스핀 액체 연구에서 정립됨.", "connections": "카고메 격자, 스핀 액체, 자기적 경쟁"}, {"term": "메타자성 텍스처", "why_emerged": "자기장에서 발생하는 급격한 자화 변화 현상을 넘어서, 제로 필드에서도 복잡한 자기 모드들의 결합으로 발생하는 공간적 자기 구조를 설명하기 위해 사용됨.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "반강자성 질서, 자기적 위상 전이"}], "english_summary": ["Clinoatacamite is identified as a distorted kagome antiferromagnet via DFT.", "The compound shows complex magnetic ordering below 18.1 K.", "Three distinct magnetic regimes are driven by competing antiferromagnetic modes.", "Results suggest a zero-field metamagnetic texture arises from this frustration."]}}, {"title": "Electronic Tuning of the Soft-Phonon Transport Anomaly in Ta2Ni(SxSe1−x)5", "journal": "PRL_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/l5xq-2yrt", "authors": "Yuan-Shan Zhang, Masahiko Isobe, Hidenori Takagi, Dennis Huang", "last_authors": "Hidenori Takagi, Dennis Huang", "summary": "Tuning the electronic structure of the excitonic insulator candidate Ta 2 NiSe 5 via sulfur substitution reveals that its highly directional phonon transport anomaly is directly driven by electronic fluctuations, suggesting that electronic interactions and lattice effects cooperatively contribute to its phase transition.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Electronic fluctuations and transport in a key excitonic insulator candidate.", "tags": ["experiment", "material", "Ta2NiSe5", "excitonicinsulator"], "image": "", "briefing": {"background": "Ta2NiSe5는 들뜬 상태의 전자-정공 쌍이 응축되어 형성되는 엑시톤 절연체 후보 물질로, 전자와 격자 간의 강한 상호작용이 핵심 연구 대상입니다.", "motivation": "이 물질에서 나타나는 특이한 포논 수송 이상 현상이 전자적 요인과 격자적 요인 중 어느 것에 의해 지배되는지 파악하고자 했습니다.", "result": "황(S) 치환을 통해 전자 구조를 튜닝한 결과, 방향성을 가진 포논 수송 이상이 전자적 요동(fluctuation)에 의해 직접적으로 유도됨을 입증했습니다.", "implication": "엑시톤 절연체 상전이에서 격자 뒤틀림뿐만 아니라 전자적 상호작용이 주도적인 역할을 한다는 강력한 증거를 제공합니다.", "novelty": "전자-포논 결합의 동역학적 기원을 밝혀내어, 상관관계가 강한 물질에서 격자와 전자의 협동 현상을 구체화했습니다.", "unresolved": "전자적 요동이 포논 모드를 구체적으로 어떻게 변조하는지에 대한 비탄성 산란 차원의 상세한 메커니즘은 추가 연구가 필요합니다.", "future_work": "초고속 분광학을 이용한 전자 및 포논의 실시간 결합 거동 관찰 연구가 예상됩니다.", "concepts": [{"term": "엑시톤 절연체", "why_emerged": "전자와 정공 사이의 인력이 충분히 클 때, 이들이 결합하여 기저 상태가 되는 상을 설명하기 위해 도입됨.", "origin": "Knox (1963) 등이 제안.", "connections": "전자-정공 쌍, 상전이, 격자 결합"}, {"term": "포논 수송 이상", "why_emerged": "상전이 전후 격자의 진동 모드가 비정상적으로 변화하는 현상을 해석하기 위해 필요함.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "전자-포논 결합, 격자 역학"}], "english_summary": ["Ta2NiSe5 is studied as an excitonic insulator candidate via sulfur substitution.", "Electronic tuning reveals that directional phonon transport anomalies are electronically driven.", "The study highlights the cooperative nature of electronic and lattice effects.", "Results confirm the pivotal role of electronic fluctuations in the phase transition."]}}, {"title": "Giant Thermopower Changes Related to the Resistivity Maximum and Colossal Magnetoresistance in EuCd2P2", "journal": "PRL_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/95x8-3wtb", "authors": "Judith Grafenhorst, Sarah Krebber, Kristin Kliemt, Cornelius Krellner, Elena Hassinger, Ulrike Stockert", "last_authors": "Elena Hassinger, Ulrike Stockert", "summary": "The electronic properties of materials exhibiting giant thermopower with a thermopower that exceeds 2000 μV/K, such as EuCd 2 P 2 , are strongly temperature dependent.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Significant study of transport and magnetism in a relevant correlated/topological material candidate.", "tags": ["transport", "EuCd2P2", "magnetoresistance"], "image": "", "briefing": {"background": "Eu계 화합물은 자성과 전도성이 강하게 결합되어 있어 거대 자기저항이나 특이한 열전 효과가 나타나는 대표적인 강상관 전자계입니다.", "motivation": "EuCd2P2에서 관측되는 2000 uV/K 이상의 거대 열전 성능과 전기 저항 극대점 사이의 상관관계를 조사하고자 했습니다.", "result": "거대 열전 성능과 거대 자기저항 효과가 동일한 온도 영역에서 발생하는 상관관계를 확인하였으며, 이는 전자 수송 특성이 온도에 따라 매우 민감하게 변하기 때문입니다.", "implication": "자기적 질서와 운반자 산란 사이의 강한 결합이 열전 성능을 극대화할 수 있음을 입증하며, 기능성 재료로서의 잠재력을 보입니다.", "novelty": "열전 효과와 자기적 수송 현상의 결합을 통해 Eu 기반 화합물에서의 비전통적 수송 메커니즘을 강조했습니다.", "unresolved": "이러한 거대 열전 성능의 구체적인 산란 기작이나 밴드 구조상의 기여도는 본 연구만으로는 불충분합니다.", "future_work": "각분해 광전자 분광법(ARPES)을 통해 자기적 질서 변화에 따른 밴드 구조 변화를 직접 관측하는 연구가 필요합니다.", "concepts": [{"term": "거대 열전 효과", "why_emerged": "열을 전기로 전환하는 효율을 높이기 위해, 전하 운반자의 엔트로피 수송이 극대화되는 현상을 찾기 위해 연구됨.", "origin": "Seebeck 효과의 응용 범위 내에서 연구됨.", "connections": "거대 자기저항, 전자-스핀 산란"}, {"term": "거대 자기저항(CMR)", "why_emerged": "자기적 질서 변화에 따라 전기 저항이 획기적으로 변하는 현상을 정보 저장 및 센서에 활용하기 위해 연구됨.", "origin": "망가나이트(Manganite) 연구에서 대중화됨.", "connections": "이중 교환 상호작용, 스핀 정렬"}], "english_summary": ["EuCd2P2 exhibits giant thermopower exceeding 2000 uV/K.", "The study correlates giant thermopower with the resistivity maximum.", "Colossal magnetoresistance is intrinsically linked to these temperature-dependent electronic properties.", "The results suggest strong coupling between magnetic order and charge transport."]}}, {"title": "Terahertz Magneto-Photocurrents in the Topological Insulator Bi2Se3 Probe Its Topological Surface States", "journal": "PRL_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/yvbq-rdkz", "authors": "Chihun In, Genaro Bierhance, Deepti Jain, et al.", "last_authors": "Seongshik Oh, Tobias Kampfrath", "summary": "We study ultrafast magneto-photocurrents in a three-dimensional topological insulator. For this purpose, we excite ( In r Bi 1 − r ) 2 Se 3 thin films with a femtosecond laser pulse in the presence of an external magnetic field B ext up to 0.3 T parallel to the film plane. The resulting in-plane photocurrent is measured by detecting the emitted terahertz electromagnetic pulse. It is proportional and perpendicular to B ext . Strikingly, for r ≥ 4 % , we observe an abrupt photocurrent reduction, which is strongly correlated with the indium-induced quenching of the topological surface states. The rise time, decay time, and amplitude of the terahertz magneto-photocurrent can consistently be explained by the following scenario: optically excited spin-polarized electrons propagate toward the film surface where the accumulated spin is converted into an in-plane charge current due to spin-velocity locking. Our results are highly relevant for contact-free probing of spin-charge conversion in systems without spontaneous magnetic order and without having to add invasive spin-source layers.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Experimental probe of topological surface states in Bi2Se3 using magneto-photocurrents.", "tags": ["experiment", "material", "Bi2Se3", "topologicalinsulator"], "image": "", "briefing": {"background": "위상 절연체(Topological Insulator)의 표면 상태는 스핀-운동량 잠김(spin-momentum locking) 현상을 보이며, 이는 차세대 스핀트로닉스 소자의 효율적인 스핀-전하 변환 매개체로 주목받고 있습니다.", "motivation": "기존의 스핀-전하 변환 측정은 외부 강자성체를 접합해야 하는 등 침습적인 방식이 많아, 이를 극복하기 위한 비접촉식 광학적 측정 기술 개발이 필요했습니다.", "result": "테라헤르츠 분광법을 이용하여 Bi2Se3 박막에서 외부 자기장에 의해 유도된 광전류를 측정했습니다. 특히 인듐(In) 도핑으로 위상 표면 상태가 소멸됨에 따라 광전류가 급격히 감소함을 관측하여, 해당 신호가 위상 표면 상태에서 기인함을 입증했습니다.", "implication": "강자성체 층 없이도 위상 절연체의 스핀-전하 변환 효율을 비접촉 방식으로 검증할 수 있는 강력한 실험적 플랫폼을 제시합니다.", "novelty": "외부 자기장 하에서 테라헤르츠 발광을 통해 위상 표면 상태를 직접적으로 탐지했다는 점이 중요하며, 자기적 질서가 없는 재료에서도 스핀 역학을 연구할 수 있는 방법론을 제공합니다.", "unresolved": "인듐 도핑에 의한 표면 상태 소멸 과정에서의 미시적 전자 구조 변화 및 불순물 산란 효과가 전체 광전류 신호에 미치는 정량적 영향은 완전히 규명되지 않았습니다.", "future_work": "다양한 위상 재료들에 대해 이 기법을 적용하여 스핀-전하 변환 효율을 체계적으로 비교 연구할 것으로 예상됩니다.", "concepts": [{"term": "Spin-momentum locking", "why_emerged": "위상 절연체의 표면에서 시간 반전 대칭성과 위상적 보호에 의해 전자 스핀이 운동량에 고정되는 현상이 필요함.", "origin": "Hasan & Kane, Rev. Mod. Phys. (2010) 등에서 이론적으로 확립.", "connections": "위상 절연체, 스핀 홀 효과, Rashba 효과와 밀접함."}, {"term": "Terahertz magneto-photocurrent", "why_emerged": "펨토초 레이저 펄스로 생성된 초고속 광전류의 동역학을 비침습적으로 측정하기 위해.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "광-스핀 전류 변환, THz 분광학."}], "english_summary": ["Demonstrates a non-invasive THz probe for spin-charge conversion in Bi2Se3.", "Identifies the THz magneto-photocurrent as a direct signature of topological surface states.", "Shows suppression of the photocurrent signal upon quenching of TSS via Indium doping.", "Provides a contact-free method for studying spin physics in topological materials."]}}, {"title": "Eight-unit-cell electronic modulations in cuprates originating from local molecular orbitals", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2609.09615", "authors": "Zhiheng Yao, Sixuan Chen, Jianfa Zhao, et al.", "last_authors": "Shuo Yang, Yayu Wang", "summary": "The pair density wave (PDW) state with eight-unit-cell (8a0) periodicity has been widely regarded as the primary order in cuprates, yet its existence and origin remain subjects of intense debate. Using spectroscopic imaging scanning tunneling microscopy, we observe spatial modulations of the electronic states with approximately 8a0 periodicity in both the superconducting and insulating regimes of hole-doped Ca2CuO2Cl2 cuprate. We find that the 8a0 spatial patterns are generated by the formation of molecular orbitals by doped holes, which organize into 4a0*4a0 plaquettes as the basic unit. Our results identify the 4a0 molecular orbital as the fundamental electronic building block in cuprates, while the 8a0 PDW represents a spatial subharmonic that emerges at sufficiently high doping.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "High-interest material (cuprates) and technique (STM) regarding spatial electronic modulations and PDW states.", "tags": ["experiment", "cuprates", "STM"], "image": "https://arxiv.org/static/browse/0.3.4/images/arxiv-logo-fb.png", "briefing": {"background": "구리 산화물 초전도체(cuprates)에서는 초전도 상태와 경쟁하거나 공존하는 다양한 전자적 질서가 관측되며, 이 중 8단위 격자 주기성을 가진 PDW(Pair Density Wave) 상태의 기원이 큰 관심사입니다.", "motivation": "PDW의 기원이 단순한 이론적 모델인지, 혹은 더 근본적인 구조적/전자적 빌딩 블록에서 비롯된 현상인지 규명하고자 했습니다.", "result": "Ca2CuO2Cl2 샘플에서 STM을 통해 8a0 주기성을 관측했습니다. 이 8a0 패턴은 기본적으로 4a0 크기의 분자 궤도(molecular orbital) 결합체가 플라켓(plaquette) 구조로 배열되어 형성되는 것임을 시사합니다.", "implication": "구리 산화물의 복잡한 전자적 질서가 원자 수준의 국소적 분자 궤도 구조로부터 상향식으로 조직될 수 있음을 보여줍니다.", "novelty": "PDW의 기원을 고차원적 질서가 아닌 더 기본 단위인 분자 궤도로부터 설명하려는 시도로, STM을 통한 고해상도 시각화가 이 모델의 강력한 근거를 제공합니다.", "unresolved": "이 분자 궤도 구조가 도핑 농도 변화에 따라 정확히 어떻게 진화하며, 실제 초전도 전이 온도(Tc)와 어떤 직접적인 상관관계를 가지는지는 여전히 의문입니다.", "future_work": "다른 도핑 수준의 구리 산화물이나 다양한 전이금속 산화물에서 동일한 4a0 분자 궤도 단위체가 관측되는지 확인하는 후속 연구가 필요합니다.", "concepts": [{"term": "Pair Density Wave (PDW)", "why_emerged": "초전도 질서 매개변수가 공간적으로 진동하는 상태를 설명하기 위해 필요함.", "origin": "Agterberg 등, 다수의 이론적 제안.", "connections": "스트라이프(Stripe) 질서, 초전도-절연체 전이."}, {"term": "Spectroscopic imaging STM", "why_emerged": "원자 수준의 지형과 전자 상태의 밀도를 동시에 매핑하여 공간적 불균일성을 연구하기 위해.", "origin": "Davis et al., Nature (2002) 등 초기 Cuprate 연구.", "connections": "Quasiparticle interference, 고온 초전도체 연구의 표준 도구."}], "english_summary": ["Investigates the 8a0 spatial periodicity in Ca2CuO2Cl2 cuprates using STM.", "Proposes that 4a0 molecular orbitals are the fundamental electronic building blocks.", "Identifies the 8a0 PDW as a spatial subharmonic of these plaquette units.", "Offers a new perspective on the origin of electronic modulations in cuprates."]}}, {"title": "Emergent Electronic Bond-Order Wave in a Quasi-One-Dimensional Chain", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2609.09383", "authors": "Honghao Wang, Tristan R. Cao, Pedro Schlottmann, Gang Cao", "last_authors": "Pedro Schlottmann, Gang Cao", "summary": "Collective order is notoriously difficult to stabilize in one dimension, where strong fluctuations suppress symmetry-breaking states. Here we report the emergence of an electronic bond-order wave (BOW) in the quasi-one-dimensional (1D) material Ba9Rh8O24, in which structural bonds become active electronic degrees of freedom that overcome 1D fluctuations to establish long-range order. Single-crystal X-ray diffraction uncovers a striking inversion of inequivalent Rh-Rh bonds across a transition TA = 180 K, where short and long bonds interchange their identities rather than undergoing conventional Peierls dimerization. This bond inversion coincides with a heat-capacity anomaly and a profound reorganization of the dielectric response with strong suppression of dielectric loss upon cooling. The BOW exhibits strongly nonlinear, frequency-dependent I-V characteristics, clockwise hysteresis, and nonvolatile memristive switching. These findings uncover an unprecedented transformation from a dynamic bond liquid to a rigid yet electrically reconfigurable BOW, establishing bond-centered electronic order as a new organizing principle for 1D quantum matter.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Interesting quasi-1D electronic order study with experimental bond inversion evidence.", "tags": ["quasi-one-dimensional", "electronic-order"], "image": "https://arxiv.org/static/browse/0.3.4/images/arxiv-logo-fb.png", "briefing": {"background": "준 1차원 물질은 강한 양자 요동으로 인해 장거리 질서가 형성되기 어려우나, 특정 상황에서는 이 요동을 극복하고 독특한 전자적 결합 질서가 나타나기도 합니다.", "motivation": "Ba9Rh8O24에서 관측된 구조적 이상 현상이 단순한 구조 변환인지, 전자적 자유도와 결합된 새로운 양자 상태인지 규명하고자 했습니다.", "result": "온도 하강에 따라 Rh-Rh 결합의 긴/짧은 주기가 반전되는 '결합 반전(bond inversion)' 현상을 발견했습니다. 이는 통상적인 Peierls 전이와는 다르며, 전자적 Bond-Order Wave(BOW)의 발현으로 해석됩니다.", "implication": "1차원 시스템에서 결합(bond) 자체가 전자적 자유도로서 장거리 질서를 이끄는 핵심임을 시사하며, 이는 향후 메모리 소자 등 차세대 기능성 소재 설계에 영감을 줄 수 있습니다.", "novelty": "전통적인 격자 왜곡 기반의 Peierls 전이가 아닌, 전자 결합의 재구성을 통한 고유한 질서화 방식을 제안했다는 점이 독창적입니다.", "unresolved": "이러한 BOW 상태가 물질 전체의 초전도성이나 자성 등 다른 물리적 특성과 어떤 상호작용을 하는지, 그리고 전기적 스위칭의 미시적 원리가 완전히 밝혀지지 않았습니다.", "future_work": "압력이나 자기장 등 외부 요인을 가했을 때 이 BOW 질서가 어떻게 변하는지, 그리고 전하 밀도 파(CDW)와 어떻게 구별되는지 연구할 필요가 있습니다.", "concepts": [{"term": "Bond-Order Wave (BOW)", "why_emerged": "전자 밀도(CDW)가 아닌 결합 강도나 대칭성의 공간적 주기성을 설명하기 위해.", "origin": "1D Hubbard 모델 등에서 이론적으로 예측됨.", "connections": "Peierls 전이, 전자적 결정화."}, {"term": "Quasi-one-dimensional system", "why_emerged": "차원성이 낮아질수록 강한 상관관계 효과와 양자 요동을 극대화하기 위해.", "origin": "전통적 고체물리학 연구 대상.", "connections": "Luttinger liquid, spin-charge separation."}], "english_summary": ["Reports an emergent electronic bond-order wave (BOW) in Ba9Rh8O24.", "Observes an inversion of Rh-Rh bonds distinct from conventional Peierls dimerization.", "Demonstrates nonlinear I-V characteristics and memristive behavior.", "Establishes bond-centered order as a novel principle in 1D quantum matter."]}}, {"title": "Evidence for rare-region physics in the structural and electronic degrees of freedom of the nickelate La2-xSrxNiO4 (Phys. Rev. Mater.)", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2512.23655", "authors": "R. J. Spieker, B. Krohnke, D. Zhai, A. Lopez Benet, M. Spai\\'c, X. He, et al.", "last_authors": "M. J. Krogstad, R. Osborn, D. Pelc, M. Greven", "summary": "We present a diffuse neutron and x-ray scattering study of structural as well as spin- and charge-density-wave fluctuations in the electrical insulator La$_{2-x}$Sr$_x$NiO$_4$. This lamellar nickelate is an isostructural analogue of the high-temperature cuprate superconductor La$_{2-x}$Sr$_x$CuO$_4$, for which recent experiments uncovered evidence for unusual structural and superconducting fluctuations indicative of rare-region physics due to inherent inhomogeneity unrelated to common point disorder effects. We find closely analogous nanoscale orthorhombic fluctuation behavior in La$_{2-x}$Sr$_x$NiO$_4$, including exponential scaling of the diffuse scattering intensity and power-law scaling of the characteristic length with relative temperature. Moreover, our neutron and x-ray scattering data reveal similar behavior for short-range magnetic and charge fluctuations above the respective ordering temperatures. These observations indicate that rare-region effects are a generic feature of perovskite-related structures and lead to universal fluctuations of both structural and electronic degrees of freedom over extended temperature ranges.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Experimental study of nickelates and CDW fluctuations using neutron/X-ray scattering; very relevant to high-Tc interests.", "tags": ["experimental", "material", "nickelate", "CDW", "neutron-scattering"], "image": "https://arxiv.org/static/browse/0.3.4/images/arxiv-logo-fb.png", "briefing": {"background": "La2-xSr xNiO4는 고온 초전도체 La2-xSr xCuO4와 구조적으로 유사한 층상 니켈산염으로, 전하 및 스핀 밀도 파동(CDW/SDW)과 같은 강한 전자 상관관계 현상을 연구하는 모델 시스템입니다. 고온 초전도체에서 관찰된 무질서와는 무관한 '희귀 영역(rare-region)' 물리학은 물질 내 불균일성이 거시적 상태에 미치는 영향을 이해하는 핵심 주제입니다.", "motivation": "최근 고온 초전도체에서 발견된 희귀 영역 물리 현상이 니켈산염과 같은 유사한 페로브스카이트 구조체에서도 보편적으로 나타나는 현상인지 확인하고자 함.", "result": "중성자 및 X선 산란 실험을 통해 La2-xSr xNiO4에서 나노 스케일의 사방정계 변동과 전하/스핀 밀도 파동의 보편적인 희귀 영역 물리 특성을 확인함.", "implication": "페로브스카이트 계열 물질의 전자적, 구조적 비균질성이 외부 불순물이 아닌 내부적인 희귀 영역 물리에서 기인한 보편적인 현상임을 시사함.", "novelty": "니켈산염과 고온 초전도체의 유사성을 통해 희귀 영역 물리라는 개념을 전이금속 산화물 전반으로 확장했으며, 이는 상관 전자계의 불균일성을 이해하는 새로운 시각을 제공함.", "unresolved": "이러한 희귀 영역 물리 현상이 초전도성과 같은 물리적 상 전이에 미치는 구체적인 메커니즘은 여전히 불분명함.", "future_work": "다른 페로브스카이트 구조 물질들에서의 희귀 영역 관찰 및 이 현상이 양자 상 전이에 미치는 영향에 대한 이론적 모델링 필요.", "concepts": [{"term": "Rare-region physics", "why_emerged": "계의 불균일성으로 인해 특정 영역에서 국소적인 질서가 나타나 전체 물리량을 지배하는 현상을 설명하기 위해 도입됨.", "origin": "Griffiths 등(1969)의 희석된 자성체 연구에서 기원함.", "connections": "Griffiths 상, 강상관 전자계의 비균질성 연구와 연결됨."}, {"term": "Charge-Density-Wave (CDW)", "why_emerged": "전자와 격자 사이의 강한 상호작용으로 인해 전자 밀도가 주기적으로 재배열되는 현상을 기술하기 위함.", "origin": "Peierls(1955)에 의해 이론적으로 제시됨.", "connections": "니켈산염, 큐프레이트, 그리고 최근의 Kagome 금속 AV3Sb5 연구의 핵심 주제."}], "english_summary": ["The study investigates La2-xSrxNiO4 using neutron and X-ray scattering techniques.", "It uncovers evidence of rare-region physics in both structural and electronic degrees of freedom.", "The results suggest that such fluctuations are a generic feature of perovskite-related materials.", "This finding links the nanoscale inhomogeneity observed in high-Tc cuprates to a broader class of correlated oxides."]}}, {"title": "Light-Driven Ultrafast Control of Time-Reversal Symmetry in SrTiO3", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2609.09497", "authors": "In Hyeok Choi, Sergei Urazhdin, Shivasheesh Varshney, Seung Gyo Jeong, Bharat Jalan, Keith A. Nelson", "last_authors": "Bharat Jalan, Keith A. Nelson", "summary": "Light-driven control of material symmetry enables the engineering of phenomena forbidden in equilibrium. Although electromagnetic fields have been used to break time-reversal symmetry, its dynamic control on ultrafast timescales in nonmagnetic insulating oxides remains virtually unexplored. Here, we demonstrate simultaneous magnetic symmetry lowering and timereversal-symmetry breaking in cubic SrTiO3 driven by an off-resonant, elliptically polarized THz pulse. Second harmonic generation (SHG) polarimetry reveals emergent SHG circular dichroism inconsistent with third-order nonlinear processes under cubic m3m symmetry. The SHG polar patterns exhibit mirror-symmetry breaking, indicating a transient reduction to tetragonal 4/mm'm' magnetic symmetry. Furthermore, the SHG response scales linearly with the angular momentum of THz pulse, providing direct evidence for THz-field-induced timereversal-symmetry breaking. These results establish a direct pathway for ultrafast symmetry control in non-magnetic oxides, enabling dynamic manipulation of emergent phases on ultrafast timescales.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Ultrafast time-reversal symmetry manipulation in oxide materials with experimental SHG evidence.", "tags": ["symmetry", "ultrafast", "SrTiO3"], "image": "https://arxiv.org/static/browse/0.3.4/images/arxiv-logo-fb.png", "briefing": {"background": "시간 반전 대칭성(TRS)은 평형 상태의 물질 물성을 규정하는 핵심 요소입니다. 이를 외부에서 제어하는 것은 새로운 양자 위상이나 비평형 상태를 창출하는 중요한 전략이지만, 강유전체와 같은 비자성 산화물에서 이를 초고속으로 조절하는 것은 매우 도전적인 과제입니다.", "motivation": "기존의 정적인 제어를 넘어, 초고속 테라헤르츠(THz) 펄스를 사용하여 비자성 산화물 SrTiO3의 TRS를 동적으로 파괴하고 제어하고자 함.", "result": "타원 편광된 THz 펄스를 가해 SrTiO3의 대칭성을 낮추고, 제2고조파 발생(SHG) 측정 결과 자기적 대칭성이 4/mm'm'으로 일시적 변환됨을 입증함.", "implication": "자기적 질서가 없는 물질에서도 빛을 이용해 일시적인 자기적 상태를 생성할 수 있음을 보여주며, 이는 빛을 통한 양자 소재 제어의 새로운 패러다임을 제시함.", "novelty": "비자성 물질인 SrTiO3에서 THz 펄스의 각운동량을 이용하여 직접적인 TRS 파괴를 유도했다는 점이 핵심이며, 이는 Floquet 공학 연구에 중요한 단서를 제공함.", "unresolved": "이러한 대칭성 파괴가 나타나는 물리적 메커니즘의 상세한 미시적 과정과 얼마나 긴 시간 동안 안정적으로 유지될 수 있는지에 대한 심화 연구가 필요함.", "future_work": "다른 비자성 및 위상 물질에 대한 적용 가능성 탐색 및 초고속 동역학 제어 실험.", "concepts": [{"term": "Time-Reversal Symmetry (TRS)", "why_emerged": "시간 방향을 뒤집어도 물리학 법칙이 변하지 않는 대칭성을 정의하기 위해 필요함.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "위상 절연체, 자기 물질, 홀 효과 등 응집물리학 전반의 핵심 대칭성."}, {"term": "Second Harmonic Generation (SHG)", "why_emerged": "물질의 비선형 광학 응답을 통해 대칭성 변화를 극도로 민감하게 감지하기 위해 사용됨.", "origin": "Franken 등(1961)에 의해 실험적으로 증명됨.", "connections": "반전 대칭성 파괴 연구 및 강유전체 도메인 영상화에 주로 쓰임."}], "english_summary": ["Ultrafast control of time-reversal symmetry in SrTiO3 via THz pulses.", "Elliptically polarized light induces a transient reduction to 4/mm'm' magnetic symmetry.", "SHG polarimetry confirms linear scaling with the angular momentum of the THz pulse.", "This work provides a framework for light-driven symmetry engineering in non-magnetic materials."]}}, {"title": "Momentum-resolved quantum noise spectroscopy using ensembles of diamond quantum sensors", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2609.09571", "authors": "Zeeshawn Kazi, Kai-Hung Cheng, Jared Rovny, Nathalie P. de Leon", "last_authors": "Jared Rovny, Nathalie P. de Leon", "summary": "Spatiotemporal fluctuations across multiple scales govern and characterize the emergent properties, phase boundaries, and low-energy excitations of strongly correlated matter. However, capturing these dynamics has remained a major experimental challenge, as conventional probes typically offer either high spatial or temporal resolution, but not both simultaneously. Here, we leverage high-fidelity wide-field imaging of dense diamond nitrogen vacancy center ensembles to measure the momentum and frequency power spectral density of magnetic fluctuations. To access spatial wavevectors below the diffraction limit, we tune the sensing volume continuously through optical depletion. This approach enables study of equilibrium and driven fluctuations across three orders of magnitude in spatial scale and tunable frequency bands, providing a direct means to map low-energy, long-wavelength fluctuations in correlated systems.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "New spectroscopic method relevant to observing correlations in quantum materials.", "tags": ["experiment", "correlated-electrons", "spectroscopy"], "image": "https://arxiv.org/html/2609.09571v1/fig1.png", "briefing": {"background": "상관 전자계 내에서의 시공간적 변동은 양자 위상의 발현과 밀접하게 연관되어 있습니다. 그러나 일반적인 분광법으로는 공간적 분해능과 시간적 분해능을 동시에 확보하기 어려워 복잡한 동역학을 완전히 이해하는 데 한계가 있었습니다.", "motivation": "다이아몬드 질소-공석(NV) 중심을 활용하여 상관 물질의 미세한 자기적 변동을 운동량과 주파수 공간에서 분해하여 분석하는 새로운 분광 기술 개발.", "result": "NV 중심 앙상블을 활용해 회절 한계 미만의 공간적 분해능을 확보하고, 넓은 범위의 주파수 대역에서 자기적 변동 파워 스펙트럼 밀도를 정밀하게 측정함.", "implication": "강상관 물질의 저에너지 장파장 변동을 직접 매핑할 수 있는 강력한 도구를 확보함으로써, 미해결된 양자 동역학 연구에 크게 기여할 수 있음.", "novelty": "기존의 분광법으로는 도달하기 어려웠던 시공간 해상도를 다이아몬드 센서 어레이를 통해 극복했다는 점이 높게 평가됨.", "unresolved": "현재는 자기적 변동에 집중되어 있어, 다른 형태의 전자적 변동(전하 등)에 대한 일반화 여부는 추가 검증이 필요함.", "future_work": "양자 임계점 근처에서의 자기적 변동 정밀 측정 및 실제 강상관 물질로의 시료 적용.", "concepts": [{"term": "Quantum Noise Spectroscopy", "why_emerged": "양자 시스템 내부의 미세한 동적 변동을 잡음 신호 분석을 통해 추출하기 위해 고안됨.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "양자 컴퓨팅 센서 기술 및 강상관 물질의 요동 분석."}, {"term": "Nitrogen-Vacancy (NV) Center", "why_emerged": "다이아몬드 격자 결함을 이용한 나노 스케일의 자기장 정밀 측정 장치가 필요하여 개발됨.", "origin": "Gruber 등(1997)이 단일 NV 중심을 감지함.", "connections": "양자 감지 기술(Quantum Sensing) 및 고체 물리 연구의 핵심 도구."}], "english_summary": ["Development of momentum-resolved quantum noise spectroscopy using NV centers.", "The method overcomes the trade-off between spatial and temporal resolution.", "Allows tracking of magnetic fluctuations across three orders of magnitude in spatial scale.", "Provides a direct mapping tool for low-energy excitations in correlated quantum matter."]}}, {"title": "Nonlocality can generate /T scaling without criticality in high Tc strange metals", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2608.03013", "authors": "Jian Xian Sim", "last_authors": "Jian Xian Sim", "summary": "Photoemission spectroscopy on high T c T_{c} superconductors find a puzzling nodal self-energy with ω / T \\omega/T scaling and an exponent varying continuously with doping. We propose a mechanism: nonlocality induced by poorly screened effective repulsions V α ​ ( r ) ∼ 1 / r α V_{\\alpha}(r)\\sim 1/r^{\\alpha} , where a continuously doping-dependent exponent 1 ≤ α ≤ 3 1\\leq\\alpha\\leq 3 interpolates between the Mott insulating and Fermi liquid limits. We develop a phenomenology of hydrodynamic screening, finding a scale-covariant quasiparticle decay rate Γ ⁡ ( ω , T ) ∝ T γ ​ Φ ​ ( ω / T ) \\Gamma(\\omega,T)\\propto T^{\\gamma}\\Phi(\\omega/T) in energy ω \\omega and temperature T T , with γ = 2 − 1 α \\gamma=2-\\frac{1}{\\alpha} for nonlocal 1 < α < 2 1<\\alpha<2 . Our results naturally capture the optimally doped to overdoped regimes, whereas the underdoped regime is qualitatively distinct. In our theory, spectroscopy-fitted exponents directly probe the charged fluid’s effective spatial nonlocality, providing a way to falsify the theory by comparing photoemission spectroscopy against electron energy loss spectroscopy. More broadly, nonlocality cautions us to not immediately infer quantum critical phenomena when ω / T \\omega/T scaling is experimentally observed.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Relevant to high-Tc strange metals and ARPES interpretation regarding scaling without criticality.", "tags": ["spectroscopy", "superconductivity", "theory"], "image": "https://arxiv.org/html/2608.03013v2/falsifyexpt.png", "briefing": {"background": "High-Tc 초전도체와 같은 '이상 금속(strange metals)'은 페르미 액체 이론으로 설명되지 않는 특이한 전기적 및 자기적 특성을 보인다. 특히, 저온에서 저항이 온도에 선형적으로 비례하는(rho ~ T) 특성은 양자 임계점과 관련이 있을 것으로 널리 여겨져 왔다. 이러한 이상 금속 상태를 이해하는 것은 고온 초전도 메커니즘을 밝히는 데 중요하며, 응집 물질 물리학의 오랜 난제 중 하나이다. ARPES와 같은 분광학 실험은 이러한 물질의 전자 구조 및 동역학을 탐구하는 핵심 도구이다.", "motivation": "ARPES 실험에서 고온 초전도체의 자기 에너지가 (omega/T) 스케일링을 보이며, 도핑에 따라 지수가 연속적으로 변하는 현상이 관찰되었다. 기존에는 이러한 (omega/T) 스케일링이 양자 임계 현상의 특징으로 해석되는 경향이 있었다. 이 논문은 양자 임계점 없이도 이러한 스케일링이 발생할 수 있는 새로운 메커니즘을 제안하고자 한다.", "result": "이 논문은 제대로 차폐되지 않은(poorly screened) 유효 반발력 V_alpha(r) ~ 1/r^alpha 에 의해 유도되는 '비국소성(nonlocality)'이 ARPES에서 관찰되는 (omega/T) 스케일링을 생성할 수 있다고 제안한다. 여기서 alpha는 모트 절연체와 페르미 액체 한계를 연결하는 도핑 의존적 지수이다. 수력학적 차폐(hydrodynamic screening) 이론을 개발하여, 준입자 붕괴율 감마(omega, T)가 T^gamma * Phi(omega/T) 형태로 스케일링하며, 여기서 감마 = 2 - 1/alpha 임을 보인다. 이는 최적 도핑에서 과도 도핑 영역의 실험 결과를 잘 설명하며, 언더도핑 영역은 질적으로 다르다.", "implication": "만약 이 이론이 옳다면, ARPES 스펙트럼에서 얻은 스케일링 지수는 물질 내 '전하 유체(charged fluid)'의 유효 공간적 비국소성을 직접적으로 반영하는 것이 된다. 이는 (omega/T) 스케일링이 항상 양자 임계 현상을 의미하는 것은 아니며, 비국소성 상호작용과 같은 다른 기원도 가능함을 시사한다. 이는 고온 초전도체의 이상 금속 상태에 대한 이해를 재구성할 수 있다.", "novelty": "기존에는 (omega/T) 스케일링을 양자 임계성과 연관 지어 해석하는 것이 일반적이었으나, 이 논문은 '비국소성'이라는 새로운 관점에서 이를 설명한다. 이는 ARPES 해석에 중요한 새로운 틀을 제공하며, 특히 ARPES에 강한 관심을 가진 독자에게 매우 중요하다. 양자 임계 현상 없이도 이상 금속의 핵심 특징 중 하나를 설명할 수 있다는 점에서 새로운 통찰을 준다.", "unresolved": "초록 정보만으로는 언더도핑 영역에 대한 설명이 질적으로 다르다는 점 외에 구체적인 한계나 해결되지 않은 질문은 명시되지 않았다. 이론적 제안이므로 실험적 검증이 필요하다.", "future_work": "이 이론은 광전자 분광학(photoemission spectroscopy) 결과와 전자 에너지 손실 분광학(electron energy loss spectroscopy, EELS) 결과를 비교하여 이론을 검증할 수 있는 방법을 제시한다. 추가적으로, 언더도핑 영역의 특이성을 설명할 수 있는 후속 이론적 또는 실험적 연구가 필요할 것이다.", "concepts": [{"term": "Strange metals (이상 금속)", "why_emerged": "고온 초전도체와 같은 특정 물질에서 페르미 액체 이론이 설명할 수 없는 이상 전도 특성(예: T에 선형적인 저항)이 관찰되어, 이러한 물질군을 지칭하고 그 물리적 특성을 이해하기 위해 필요했다.", "origin": "초록 정보만으로는 특정하기 어려움. 주로 고온 초전도체를 비롯한 강상관 물질 연구에서 광범위하게 사용되는 개념이다.", "connections": "페르미 액체(Fermi liquid), 양자 임계성(quantum criticality), 고온 초전도(high-Tc superconductivity), 비정상 전송(unconventional transport)."}, {"term": "ARPES (Angle-resolved photoemission spectroscopy, 각분해 광전자 분광학)", "why_emerged": "물질의 전자 구조, 특히 페르미 표면의 모양과 전자 밴드 분산을 직접 측정하여 고체 물질의 전자적 특성을 이해하는 데 필수적인 실험 기법이다.", "origin": "1960년대 후반부터 발전하기 시작했으며, 특히 싱크로트론 방사선원의 발달과 함께 고체 물리학에서 핵심적인 도구가 되었다.", "connections": "전자 밴드 구조, 페르미 표면, 자기 에너지(self-energy), 준입자(quasiparticle), 밴드갭, CDW, 초전도 갭 측정 등 다양한 전자 구조 관련 연구와 연결된다."}, {"term": "omega/T scaling (오메가/T 스케일링)", "why_emerged": "이상 금속 상태에서 관찰되는 특정 동역학적 특성을 설명하기 위해 사용되는 개념으로, 전자의 산란율이나 자기 에너지 같은 물리량이 주파수(omega)와 온도(T)의 비율에만 의존하는 현상이다. 이는 양자 임계점에서 자주 나타나는 특성으로 여겨졌다.", "origin": "초록 정보만으로는 특정하기 어려움. 이상 금속과 양자 임계 현상 연구에서 널리 논의되었다.", "connections": "양자 임계점, 이상 금속, 자기 에너지, 동역학적 스케일링."}, {"term": "Nonlocality (비국소성)", "why_emerged": "입자 간 상호작용이 국소적이지 않고(즉, 거리에 따라 즉각적으로 사라지지 않고) 원거리까지 영향을 미치는 경우를 설명하기 위해 필요한 개념이다. 특히 이 논문에서는 전하 유체의 유효 반발력이 장거리 특성을 가질 때 발생한다.", "origin": "물리학에서 비국소성 개념은 양자 역학의 초기부터 논의되었지만, 응집 물질 맥락에서는 다양한 상호작용 모델에서 나타난다.", "connections": "유효 상호작용, 차폐 효과(screening effect), 양자장론, 강상관 전자계."}], "english_summary": ["This paper proposes a new mechanism for the puzzling `omega/T` scaling of nodal self-energy observed in high-Tc strange metals via photoemission spectroscopy.", "It suggests that nonlocality, arising from poorly screened effective repulsions `V_alpha(r) ~ 1/r^alpha`, can generate this scaling without requiring quantum criticality.", "The theory develops a phenomenology of hydrodynamic screening, showing a scale-covariant quasiparticle decay rate with a doping-dependent exponent.", "This provides an alternative explanation for the `omega/T` scaling, suggesting that spectroscopic exponents directly probe the spatial nonlocality of the charged fluid.", "The authors propose comparing photoemission spectroscopy with electron energy loss spectroscopy to falsify the theory and caution against immediately inferring quantum critical phenomena from `omega/T` scaling."]}}, {"title": "Orbital-selective electronic modes induced by doping and originating from distinct spin excitations: an essential feature of orbital-selective Mott transition", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2609.09741", "authors": "Masanori Kohno", "last_authors": "Masanori Kohno", "summary": "The nature of the orbital-selective Mott transition (OSMT) remains elusive. This study shows that, by doping an orbitally degenerate spin-1 antiferromagnetic insulator in the Kanamori-Hubbard model, electronic modes emerge in the band gap in an orbital-selective manner, exhibiting momentum-shifted spin-mode dispersion relations. Electronic modes originating from conventional spin excitations, including the low-energy one, appear in the doped orbital, while those from inter-orbital spin excitations appear in the undoped orbital. These emergent modes constitute an essential feature of the OSMT.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Strongly correlated electron physics regarding orbital-selective electronic modes and Mott transitions.", "tags": ["theory", "Mott-insulator", "electronic-structure"], "image": "https://arxiv.org/html/2609.09741v1/AkwPRL.jpg", "briefing": {"background": "강상관 전자계에서는 전자의 스핀, 전하, 궤도 자유도가 복잡하게 얽혀 다양한 양자 현상을 만들어낸다. 모트 절연체는 전자 간 강한 쿨롱 반발력 때문에 전하 이동이 억제되어 생기는 절연체이며, 그 중 궤도 선택적 모트 전이(OSMT)는 다중 궤도 시스템에서 특정 궤도의 전자는 국소화되어 모트 절연체 상태를 유지하고 다른 궤도의 전자는 금속성을 띠는 현상을 말한다. 이러한 현상을 이해하는 것은 강상관 물질의 복잡한 물성을 밝히는 데 중요하다.", "motivation": "궤도 선택적 모트 전이(OSMT)의 본질은 아직 완전히 규명되지 않았다. 이 연구는 도핑이 주입된 상황에서 OSMT가 어떻게 발생하는지, 그리고 이 과정에서 어떤 새로운 전자 모드(electronic modes)가 생겨나는지를 Kanamori-Hubbard 모델을 통해 이론적으로 탐구하여 OSMT의 핵심 특징을 밝히고자 한다.", "result": "Kanamori-Hubbard 모델에서 궤도적으로 축퇴된 스핀-1 반강자성 절연체에 도핑을 가할 때, 밴드 갭 내에 궤도 선택적인 방식으로 전자 모드들이 출현하며, 이들은 운동량-시프트된 스핀 모드 분산 관계를 보임을 발견했다. 특히, 도핑된 궤도에서는 기존 스핀 여기(spin excitations)에서 유래한 전자 모드들이 나타나고, 도핑되지 않은 궤도에서는 궤도 간 스핀 여기(inter-orbital spin excitations)에서 유래한 모드들이 나타남을 보였다. 이러한 새로운 전자 모드들이 OSMT의 본질적인 특징임을 제안한다.", "implication": "이 결과는 OSMT의 미시적 메커니즘에 대한 중요한 통찰을 제공한다. 도핑된 강상관 물질에서 관찰되는 복잡한 전자 구조를 이해하는 데 새로운 틀을 제시하며, 궤도 선택성이 어떻게 전자 모드의 출현과 연결되는지 보여준다. 이는 강상관 물질의 전자 구조를 이해하고 제어하는 데 기여할 수 있다.", "novelty": "이 연구는 궤도 선택적 모트 전이에서 도핑이 유도하는 전자 모드의 기원을 명확히 밝히고, 궤도 선택적 스핀 여기와의 직접적인 연관성을 제시한다. 이는 OSMT에 대한 이론적 이해를 심화시키는 새로운 발견이다. 독자가 강상관 전자계 및 전자 구조에 관심을 가지고 있으므로, 이 연구는 해당 분야의 핵심 개념에 대한 새로운 관점을 제공할 것이다.", "unresolved": "이론적인 연구이므로, 제안된 궤도 선택적 전자 모드와 그 기원을 실험적으로 검증하는 것이 필요하다. 특정 물질 시스템에 대한 구체적인 예측이나 실험적 매칭은 초록에 명시되어 있지 않다.", "future_work": "제안된 궤도 선택적 전자 모드를 ARPES나 EELS와 같은 분광학적 방법으로 탐지하는 실험적 연구가 뒤따를 수 있다. 또한, Kanamori-Hubbard 모델 외의 다른 강상관 모델에서 유사한 현상이 발생하는지 탐구하거나, 특정 실제 물질 시스템에 이 이론을 적용하여 예측을 제공하는 연구가 이어질 수 있다.", "concepts": [{"term": "Orbital-selective Mott transition (궤도 선택적 모트 전이, OSMT)", "why_emerged": "다중 궤도를 가지는 강상관 물질에서 일부 궤도만 모트 절연체 상태가 되고 다른 궤도는 금속성 또는 다른 전도성을 보이는 현상을 설명하기 위해 필요했다. 모든 궤도가 동시에 전이하지 않는 특성을 포착한다.", "origin": "1990년대 후반부터 다중 궤도 강상관 물질, 특히 전이 금속 산화물 연구에서 이론적으로 제안되고 실험적으로 논의되기 시작했다.", "connections": "모트 절연체(Mott insulator), 강상관 전자계(strongly correlated electron systems), 다중 궤도 효과, 궤도 정렬(orbital ordering)."}, {"term": "Mott insulator (모트 절연체)", "why_emerged": "기존의 띠 이론(band theory)으로 설명할 수 없는, 부분적으로 채워진 띠를 가짐에도 불구하고 절연체 특성을 보이는 물질(예: NiO)을 설명하기 위해 필요했다. 전자 간의 강한 쿨롱 상호작용이 전하 이동을 억제하는 현상이다.", "origin": "네빌 모트(Nevill Mott) 경이 1949년에 이 개념을 제안했다.", "connections": "띠 이론, 쿨롱 상호작용, 강상관 전자계, 금속-절연체 전이, 허바드 모델(Hubbard model)."}, {"term": "Kanamori-Hubbard model (카나모리-허바드 모델)", "why_emerged": "단일 궤도 허바드 모델의 한계를 넘어, 다중 궤도 시스템에서 전자 간의 쿨롱 상호작용(특히 훈트 규칙)을 고려하여 강상관 현상을 설명하기 위해 개발되었다. 궤도 축퇴(orbital degeneracy)와 같은 실제 물질의 복잡성을 반영한다.", "origin": "1960년대에 카나모리 준지로(J. Kanamori) 등이 개발했다.", "connections": "허바드 모델, 훈트 커플링(Hund's coupling), 강상관 전자계, 궤도 자유도."}, {"term": "Spin excitations (스핀 여기)", "why_emerged": "물질 내 전자의 스핀 상태 변화를 동반하는 에너지 여기를 설명하기 위해 필요한 개념이다. 자성 물질이나 강상관 물질에서 스핀 파동(magnons)과 같은 집단 여기를 포함한다.", "origin": "양자 역학 및 고체 물리학에서 스핀의 개념이 정립된 후, 자성 연구와 함께 발전했다.", "connections": "매그논(magnon), 스핀 파동, 자성 질서, 중성자 산란(neutron scattering), 스핀 자유도."}], "english_summary": ["This study investigates the nature of the orbital-selective Mott transition (OSMT) in the presence of doping using the Kanamori-Hubbard model.", "It reveals that doping an orbitally degenerate spin-1 antiferromagnetic insulator induces orbital-selective electronic modes within the band gap.", "These emergent modes exhibit momentum-shifted spin-mode dispersion relations, originating from conventional spin excitations in doped orbitals and inter-orbital spin excitations in undoped orbitals.", "The paper suggests that these distinct electronic modes constitute an essential feature of OSMT, clarifying its microscopic mechanism.", "This theoretical work provides new insights into understanding and potentially controlling the complex electronic structures in doped strongly correlated materials."]}}, {"title": "Quantum Phase Transitions and Fractional Quantized Anomalous Hall Insulators in Rhombohedral Graphene", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2609.09422", "authors": "Zach Hadjri, Xinlei Yue, Tonghang Han, et al.", "last_authors": "Ady Stern, Long Ju", "summary": "Fractional quantum anomalous Hall effect (FQAHE) has been discovered in twisted MoTe$_2$ and rhombohedral graphene/hBN moir\\'e superlattices. Such van der Waals heterostructures feature a tuning knob of gate displacement field $D$, which is absent from the conventional fractional quantum Hall systems in two-dimensional electron gases. $D$ plays a critical role in engineering FQAHE and other emergent quantum states and provides an exciting new opportunity to explore their quantum phase transitions. However, the microscopic details of such transitions and temperature-dependent transport have remained mostly elusive. Here we report systematic resistance measurements in rhombohedral pentalayer graphene/hBN moir\\'e superlattices. We found that the displacement field-driven phase transitions between Composite Fermi liquid, Fermi liquid, Fractional Chern insulators, and insulating states are described by semi-circle relations of the longitudinal and transverse resistivities (or conductivities), largely unexplored in the fractional quantum Hall systems. This agrees with a spatially separated two-phase picture for the phase transitions and further indicates a new insulator phase--fractional quantized anomalous Hall insulator. By comparing the temperature-dependence of longitudinal resistance with the thermal activation model, we estimated the transport gap sizes in three fractional Chern insulator states. Our work shed light on the quantum and temperature evolutions of fractional Chern insulator states--providing necessary background for anyon-braiding and gate-defined junctions in rhombohedral graphene.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Experimental study on fractional quantum Hall effects in graphene heterostructures.", "tags": ["graphene", "heterostructure", "quantum-hall"], "image": "https://arxiv.org/static/browse/0.3.4/images/arxiv-logo-fb.png", "briefing": {"background": "양자 홀 효과(Quantum Hall effect)는 강한 자기장 하에서 2차원 전자계의 전도도가 양자화되는 현상으로, 위상학적 개념과 깊이 연관되어 있다. 특히 분수 양자 홀 효과(Fractional Quantum Hall Effect, FQHE)는 전하가 분수 값을 가지는 준입자(anyons)의 존재를 시사하며, 뫼비우스 뒤틀린 그래핀(twisted bilayer graphene)이나 다른 반 데르 발스 이종 구조(van der Waals heterostructures)에서 분수 양자 이상 홀 효과(Fractional Quantum Anomalous Hall Effect, FQAHE)가 관찰되면서 큰 관심을 받고 있다. 이는 자기장 없이도 위상학적 상태를 구현할 수 있는 가능성을 열어준다.", "motivation": "FQAHE는 뒤틀린 MoTe2나 롬보헤드럴 그래핀/hBN 뫼비우스 초격자(moiré superlattices)와 같은 반 데르 발스 이종 구조에서 발견되었는데, 이 시스템들은 게이트 변위장(displacement field, D)이라는 추가적인 제어 변수가 있다. D는 FQAHE 및 다른 양자 상태를 조절하는 데 중요하지만, 이러한 양자 상전이의 미시적 세부 사항과 온도 의존적 수송 특성은 아직 잘 알려져 있지 않다. 이 연구는 롬보헤드럴 펜타레이어 그래핀/hBN 시스템에서 D에 의한 양자 상전이를 체계적으로 탐구하여 이러한 간극을 메우고자 한다.", "result": "롬보헤드럴 펜타레이어 그래핀/hBN 뫼비우스 초격자에서 체계적인 저항 측정 실험을 수행하여, 변위장 D에 의해 구동되는 상전이(복합 페르미 액체, 페르미 액체, 분수 체른 절연체, 절연체 상태 사이)가 종방향 및 횡방향 저항(또는 전도도)의 반원 관계(semi-circle relations)로 설명됨을 발견했다. 이는 분수 양자 홀 시스템에서 거의 탐구되지 않은 현상이다. 이러한 결과는 상전이가 공간적으로 분리된 두 상(two-phase) 그림과 일치하며, 새로운 절연체 상인 '분수 양자 이상 홀 절연체(fractional quantized anomalous Hall insulator)'의 존재를 시사한다. 또한, 온도 의존적 종방향 저항을 열 활성화 모델과 비교하여 세 가지 분수 체른 절연체 상태의 수송 갭 크기를 추정했다.", "implication": "이 연구는 롬보헤드럴 그래핀 시스템에서 변위장에 의한 FQAHE 및 관련 양자 상전이에 대한 미시적인 이해를 심화시킨다. 상전이가 '반원 관계'로 설명되고 '분수 양자 이상 홀 절연체'라는 새로운 상이 제안됨으로써, 이러한 위상학적 상태의 근본적인 물리적 특성을 밝히는 데 기여한다. 이는 애니온 꼬임(anyon-braiding) 및 게이트 정의 접합(gate-defined junctions) 연구에 필요한 배경 지식을 제공한다.", "novelty": "기존 분수 양자 홀 시스템에서 잘 탐구되지 않았던 변위장(D)에 의한 양자 상전이의 미시적 메커니즘을 밝히고, 상전이가 종/횡방향 저항의 '반원 관계'로 설명 mary": ["This experimental study reports systematic resistance measurements in rhombohedral pentalayer graphene/hBN moiré superlattices.", "It investigates displacement field-driven quantum phase transitions between various states, including Composite Fermi liquid and Fractional Chern insulators.", "The authors discovered that these transitions are described by novel semi-circle relations of longitudinal and transverse resistivities, pointing to a spatially separated two-phase picture.", "A new phase, the fractional quantized anomalous Hall insulator, is proposed, and transport gap sizes for fractional Chern insulator states are estimated.", "This work sheds light on the quantum and temperature evolutions of fractional Chern insulator states, providing a foundation for anyon-braiding and gate-defined junctions."]}}, {"title": "Quantum oscillations of helical edge states of periodically deformed 2D topological insulator in magnetic field", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2609.04359", "authors": "A. V. Tsvetkova, P. D. Grigoriev, Ya. I. Rodionov", "last_authors": "P. D. Grigoriev, Ya. I. Rodionov", "summary": "We study edge-state transport in a two-dimensional topological insulator with a periodically deformed edge subjected to a uniform magnetic field. Zeeman coupling breaks time-reversal symmetry and enables elastic backscattering, producing oscillations of the forbidden-band widths. In the strong-field regime, the gaps can close completely at discrete field values. In the weak-field regime, we identify an important class of periodic deformations for which the dominant semiclassical scattering is controlled by complex infinity rather than by the nearest turning points. We develop a semiclassical treatment of this process and establish its agreement with perturbation theory and direct numerical calculations. The gap modulation should produce observable oscillations of the edge conductance. Unlike conventional magnetic quantum oscillations, which are periodic in inverse field, the predicted oscillations are periodic in the magnetic field itself, with a period determined by the Fermi velocity and effective g-factor", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Transport theory for topological insulators in magnetic fields with experimental implications.", "tags": ["topological", "transport", "theory"], "image": "https://arxiv.org/static/browse/0.3.4/images/arxiv-logo-fb.png", "briefing": {"background": "2차원 위상 절연체(2D Topological Insulator, 2D TI)는 물질 내부(bulk)는 절연체이지만 경계면(edge)에는 시간 역전 대칭성(Time-Reversal Symmetry, TRS)에 의해 보호되는 전도성 채널, 즉 헬리컬 엣지 상태(helical edge states)를 가지는 물질입니다. 이 엣지 상태는 스핀과 운동량이 고정되어 있어 후방산란이 억제되므로 높은 전도성을 보이며, 외부 교란에 매우 강인한 특성을 가집니다. 이러한 독특한 전자 구조는 새로운 양자 현상 연구 및 스핀트로닉스 응용 가능성 때문에 큰 관심을 받고 있습니다.", "motivation": "기존의 2D TI 연구는 주로 완벽한 경계면을 가정했지만, 실제 물질에서는 경계면이 주기적으로 변형될 수 있습니다. 또한, 자기장은 시간 역전 대칭성을 파괴하여 헬리컬 엣지 상태의 강인성을 약화시키고 후방산란을 유도할 수 있습니다. 이 연구는 주기적으로 변형된 2D TI의 엣지 상태가 자기장 하에서 어떻게 전송 특성을 보이는지, 특히 새로운 형태의 양자 진동이 나타날 수 있는지 이론적으로 탐구하여 이러한 복합적인 상황에서의 물리를 이해하고자 합니다.", "result": "이 연구는 균일한 자기장 하에서 주기적으로 변형된 2D TI 엣지 상태의 수송을 이론적으로 분석했습니다. 자기장으로 인한 제만 커플링(Zeeman coupling)은 시간 역전 대칭성을 깨뜨리고 탄성 후방산란을 가능하게 하여, 금지된 밴드 폭(forbidden-band widths)의 진동을 유발합니다. 강한 자기장 영역에서는 특정 자기장 값에서 밴드 갭이 완전히 닫힐 수 있음을 발견했습니다. 약한 자기장 영역에서는 특정 주기적 변형의 경우, 지배적인 반고전적 산란이 가장 가까운 터닝 포인트가 아닌 '복소 무한대(complex infinity)'에 의해 제어됨을 확인했습니다. 중요한 결과는 이러한 밴드 갭 변조가 엣지 전도도의 관측 가능한 진동을 생성한다는 것입니다. 이 진동은 기존의 자기 양자 진동(역자기장에 주기적인)과 달리, 자기장 그 자체에 대해 주기적이며, 그 주기는 페르미 속도와 유효 g-인자(g-factor)에 의해 결정됩니다.", "implication": "만약 이 연구에서 예측된 자기장 자체에 주기적인 양자 진동이 실험적으로 관측된다면, 이는 위상 물질에서 새로운 종류의 양자 진동 메커니즘이 작동함을 증명하는 것이 됩니다. 이는 헬리컬 엣지 상태의 특성, 특히 페르미 속도와 g-인자를 새로운 방식으로 탐색하고 이해하는 데 중요한 통찰력을 제공할 수 있습니다. 또한, 주기적으로 변형된 경계면이 위상 물질의 전자 수송에 미치는 영향을 보다 심도 있게 이해하는 데 기여할 것입니다.", "novelty": "이 논문의 가장 큰 참신성은 2D TI의 주기적으로 변형된 엣지에서 나타나는 새로운 유형의 양자 진동을 예측했다는 점입니다. 일반적인 양자 진동(예: Shubnikov-de Haas, de Haas-van Alphen)은 역자기장(1/B)에 대해 주기적인 반면, 이 연구는 자기장(B) 자체에 대해 주기적인 진동을 예측합니다. 이는 사용자님의 관심 분야인 위상 물질의 수송 특성 연구에 새로운 실험적 방향을 제시할 수 있습니다.", "unresolved": "이 연구는 이론적인 예측에 기반하고 있으므로, 이러한 독특한 자기장 주기적 양자 진동이 실험적으로 실제로 관측되는지 여부가 가장 중요한 미해결 과제입니다. 주기적으로 변형된 2D TI 엣지를 실험적으로 구현하는 방법, 그리고 '복소 무한대'에 의해 제어되는 산란 메커니즘을 증명하는 것이 쉽지 않을 수 있습니다.", "future_work": "향후 연구는 이 이론적 예측을 실험적으로 검증하는 데 초점을 맞출 것입니다. 고품질의 2D TI 시료에서 주기적으로 변형된 엣지를 정밀하게 제작하고, 저온 및 강한 자기장 환경에서 엣지 전도도 측정을 통해 자기장 주기적 진동을 탐지하는 실험적 노력이 필요합니다. 또한, 다양한 형태의 엣지 변형이나 불순물 효과를 고려한 추가적인 이론 연구도 기대됩니다.", "concepts": [{"term": "2D topological insulator (2D TI)", "why_emerged": "양자 스핀 홀 효과(Quantum Spin Hall effect)와 같은 특이한 양자 현상을 설명하고, 스핀트로닉스 응용을 위한 새로운 물질군을 탐색하기 위해 등장했습니다. 벌크는 절연체이지만 경계면은 스핀에 따라 전파 방향이 다른 전도성 채널을 가집니다.", "origin": "초록 정보만으로는 특정하기 어려움. 2005년 Kane과 Mele가 그래핀에서 예측하고, 2007년 Bernevig, Hughes, Zhang가 HgTe 양자 우물에서 예측 및 실험적으로 관측되었습니다.", "connections": "3D 위상 절연체, 양자 홀 효과, 시간 역전 대칭성, 헬리컬 엣지 상태, Chern insulator, Weyl/Dirac 반금속."}, {"term": "Helical edge states", "why_emerged": "2D TI의 독특한 전도성을 설명하기 위해 필요합니다. 이 상태에서는 전자의 스핀 방향이 운동량 방향과 고정(spin-momentum locking)되어 있어, 시간 역전 대칭성이 유지되는 한 후방산란이 금지되어 전도성이 매우 높습니다.", "origin": "2D TI 개념이 정립되면서 함께 발전했습니다.", "connections": "2D topological insulator, quantum spin Hall effect, spin-momentum locking, backscattering suppression, one-dimensional conduction."}, {"term": "Zeeman coupling", "why_emerged": "자기장이 전자의 스핀 자기 모멘트와 상호작용하여 에너지 준위에 변화를 주는 현상을 설명하기 위해 사용됩니다. 이는 자기장이 전자의 스핀에 미치는 직접적인 영향을 나타냅니다.", "origin": "Pieter Zeeman이 자기장 하에서 원자 스펙트럼 선의 분리 현상(Zeeman effect, 1896)을 발견한 것에서 유래했습니다. 이론적으로는 양자역학의 스핀-자기장 상호작용 항으로 기술됩니다.", "connections": "g-factor, 스핀, 자기장 효과, 시간 역전 대칭성 파괴, 스핀 분리."}, {"term": "Quantum oscillations (양자 진동)", "why_emerged": "강한 자기장 하에서 물질의 전자 특성(예: 전기 저항, 자화율)이 주기적으로 진동하는 현상을 설명합니다. 이는 자기장으로 인해 전자의 에너지가 란다우 준위로 양자화되기 때문에 나타나는 현상입니다.", "origin": "Shubnikov-de Haas 효과(저항 진동)와 de Haas-van Alphen 효과(자화 진동)가 대표적이며, Landau가 1930년에 이론적으로 설명했습니다.", "connections": "Landau levels, Fermi surface, Shubnikov-de Haas effect, de Haas-van Alphen effect, Berry phase, 사이클로트론 운동. 이 논문은 기존 1/B 주기가 아닌 B 주기의 새로운 형태를 제시합니다."}], "english_summary": ["This theoretical paper investigates edge state transport in 2D topological insulators with periodically deformed edges under a uniform magnetic field.", "Zeeman coupling, breaking time-reversal symmetry, enables elastic backscattering and induces oscillations in the forbidden-band widths.", "A key prediction is a novel type of quantum oscillation in edge conductance, which is periodic in the magnetic field itself, unlike conventional oscillations.", "The period of these predicted oscillations is determined by the Fermi velocity and effective g-factor.", "This work proposes a new experimental signature for periodically deformed 2D TIs and offers insights into probing their edge state properties."]}}, {"title": "Spectroscopic signatures of mode-selective electron-phonon coupling in transient reflectivity change on charge-density-wave TiSe2", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2609.10348", "authors": "Yu Mizukoshi, Muneaki Hase", "last_authors": "Yu Mizukoshi, Muneaki Hase", "summary": "We report on time- and spectrally resolved pump-probe spectroscopy measurement on the charge-density wave (CDW) state of TiSe$_2$ at helium temperatures. The non-oscillatory component of the spectrally resolved signals exhibit a sign reversal near 1.5 eV, which was interpreted as a redshift of the optical transition energy originated from the interband transition between the Se $p$-based valence band to the Ti $d$-derived conduction band. Furthermore, the oscillatory components exhibit distinct spectral dependences between the optical phonons and the CDW-derived modes, suggesting the mode-selective coupling.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Direct relevance to CDW materials and electron-phonon coupling studies, likely of high interest for experimental feedback.", "tags": ["CDW", "spectroscopy", "TiSe2"], "i eration in Quantum and Functional Materials", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2605.30584", "authors": "Xiaoyu Guo, Chang Jae Roh, Youngjun Ahn", "last_authors": "Chang Jae Roh, Youngjun Ahn", "summary": "Second harmonic generation (SHG) has evolved from a probe of noncentrosymmetric crystals into a symmetry-resolved optical method for identifying order parameters in quantum and functional materials. In particular, polarization-resolved rotational anisotropy (RA) measurements of SHG can connect nonlinear susceptibility tensors to the crystallographic and magnetic point groups of the underlying materials. This capability is especially powerful when the ordered state is weak, spatially confined, multipolar, magnetic, or hidden from conventional linear probe techniques. In this review article, we established a systematic symmetry-based framework for understanding RA-SHG and provide a comprehensive overview of RA-SHG studies across a broad range of condensed matter systems. We begin with basic theoretical background for the multipole origins of SHG radiation, the construction of nonlinear susceptibility tensors, and a group-theoretical framework connecting tensor components to order parameters. We then review the applications of RA-SHG to polar materials, magnetic orders, and other hidden electronic orders. Finally, we outline challenges and future research directions for using SHG to reveal, image, and control hidden, intertwined, and nonequilibrium phases in quantum and functional materials.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Review of SHG as a technique to detect hidden electronic/magnetic orders in quantum materials.", "tags": ["method", "spectroscopy", "symmetry"], "image": "https://arxiv.org/static/browse/0.3.4/images/arxiv-logo-fb.png", "briefing": {"background": "자동 브리핑을 생성하지 못했습니다. 초록과 원문 링크를 기준으로 빠르게 확인하세요.", "motivation": "초록 정보만으로는 분야 내부의 구체적 동기를 안정적으로 요약하기 어렵습니다.", "result": "Second harmon
