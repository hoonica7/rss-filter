<title>Daily Paper Slideshow</title>
<style>
  :root {
    color-scheme: light;
    --bg: #f6f7f4;
    --paper: #ffffff;
    --ink: #111827;
    --muted: #64748b;
    --line: #d8ddd2;
    --accent: #176b87;
    --accent-2: #9a3412;
  }
  * { box-sizing: border-box; }
  body { margin: 0; height: 100vh; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: var(--bg); color: var(--ink); }
  .shell { max-width: 1500px; height: 100vh; margin: 0 auto; padding: 14px 18px; display: flex; flex-direction: column; }
  .topbar { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 16px; }
  .top-actions { display: flex; align-items: center; gap: 10px; }
  .topbar a, button { border: 1px solid var(--line); border-radius: 8px; background: var(--paper); color: var(--ink); padding: 10px 14px; font-weight: 700; text-decoration: none; cursor: pointer; }
  button.primary { background: var(--accent); border-color: var(--accent); color: white; }
  button:disabled { opacity: 0.45; cursor: not-allowed; }
  .counter { color: var(--muted); font-weight: 700; }
  .slide { height: calc(100vh - 82px); background: var(--paper); border: 1px solid var(--line); border-radius: 10px; padding: 18px; box-shadow: 0 18px 42px rgba(15, 23, 42, 0.10); display: grid; grid-template-columns: minmax(310px, 0.86fr) minmax(0, 1.55fr); gap: 18px; overflow: hidden; }
  .paper-head { min-width: 0; min-height: 0; overflow: hidden; display: flex; flex-direction: column; gap: 12px; }
  .figure { margin: 0; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: #f8fafc; }
  .figure img { display: block; width: 100%; max-height: 41vh; object-fit: contain; background: white; }
  .figure figcaption { padding: 7px 10px; color: var(--muted); font-size: 12px; line-height: 1.3; }
  .head-text { display: flex; flex-direction: column; gap: 9px; min-width: 0; }
  .badges { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .badge { border-radius: 999px; padding: 5px 9px; background: #eef2ff; color: #3730a3; font-size: 12px; font-weight: 800; }
  .score { background: #fee2e2; color: #991b1b; }
  h1 { margin: 0; font-size: 25px; line-height: 1.15; letter-spacing: 0; overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
  h1 a { color: inherit; text-decoration-color: rgba(23, 107, 135, 0.35); text-decoration-thickness: 2px; text-underline-offset: 4px; }
  h1 a:hover { color: var(--accent); text-decoration-color: var(--accent); }
  .meta, .authors, .why, .abstract { font-size: 13px; line-height: 1.45; }
  .meta, .authors { color: var(--muted); }
  .why strong, .abstract strong, .authors strong { color: var(--ink); }
  .authors { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .why { border-left: 4px solid var(--accent-2); padding-left: 10px; color: #374151; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .abstract { border-top: 1px solid var(--line); padding-top: 14px; color: #374151; }
  .original-abstract { margin-top: auto; border-top: 1px solid var(--line); padding-top: 10px; color: #374151; font-size: 11.5px; line-height: 1.35; max-height: 20vh; overflow: auto; }
  .original-abstract strong { display: block; margin-bottom: 4px; color: var(--ink); }
  .tags { display: flex; flex-wrap: wrap; gap: 8px; }
  .tag { border-radius: 999px; padding: 4px 8px; background: #f1f5f9; color: #475569; font-size: 12px; font-weight: 700; }
  .head-text > .link { display: none; }
  .briefing { min-width: 0; min-height: 0; overflow: auto; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); grid-auto-rows: minmax(0, auto); align-content: start; gap: 11px 18px; border-top: 0; padding-top: 0; }
  .brief-section { min-width: 0; }
  .brief-section.wide { grid-column: 1 / -1; }
  .brief-section h2 { margin: 0 0 4px; font-size: 14px; line-height: 1.22; color: #0f766e; letter-spacing: 0; }
  .brief-section p, .brief-section li { margin: 0; font-size: 12.5px; line-height: 1.42; color: #1f2937; overflow-wrap: anywhere; }
  .brief-section ul { margin: 0; padding-left: 20px; }
  .concepts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 9px 14px; }
  .concept { border-top: 1px solid var(--line); padding-top: 7px; }
  .concept h3 { margin: 0 0 4px; font-size: 13px; color: #7c2d12; letter-spacing: 0; }
  .concept p { margin: 2px 0 0; font-size: 11.5px; line-height: 1.35; color: #374151; overflow-wrap: anywhere; }
  .concept b { color: #111827; }
  .link { color: var(--accent); font-weight: 800; text-decoration: none; }
  .empty { padding: 48px; background: var(--paper); border: 1px solid var(--line); border-radius: 12px; color: var(--muted); }
  @media (max-width: 860px) {
    body { height: auto; overflow: auto; }
    .shell { padding: 14px; }
    .topbar, .top-actions { align-items: stretch; flex-direction: column; }
    .slide, .briefing, .concepts { grid-template-columns: 1fr; }
    .slide { height: auto; overflow: visible; display: grid; }
    h1 { font-size: 28px; }
  }
</style>

const slides = [{"title": "Electronic Origin of Delicate Antiferromagnetism in FexNbS2", "journal": "PRL_Recent", "source": "author whitelist", "link": "http://link.aps.org/doi/10.1103/99yr-nqbx", "authors": "Wenxin Li, Jonathan T. Reichanadter, Shan Wu, et al.", "last_authors": "Jeffrey B. Neaton, Yu He", "summary": "Author(s): Wenxin Li, Jonathan T. Reichanadter, Shan Wu, Ji Seop Oh, Rourav Basak, Shannon C. Haley, Siqi Wang, Joshua E. Chaparro Mata, Elio Vescovo, Donghui Lu, Makoto Hashimoto, Christoph Klewe, Suchismita Sarker, Jessica L. McChesney, Alex Frañó, James G. Analytis, Robert J. Birgeneau, Jeffrey B. Neaton, and Yu He A combination of ARPES, XAS, and DFT shows a dramatic eV-scale electronic restructuring in Fe x NbS 2 , similar to what happens in correlated oxides, and suggests electronic correlations play a central role in the magnetism of Fe-intercalated transition-metal dichalcogenides. [Phys. Rev. Lett. 136, 216503] Published Wed May 27, 2026", "tier": "A_MUST_READ", "score": "10", "reason": "author whitelist: Donghui Lu", "tags": ["ARPES", "STS", "correlated", "ferromagnet", "antiferromagnet"], "image": "", "briefing": {"background": "전이금속 디칼코게나이드(TMD)에 3d 금속을 삽입하는 구조는 자성 및 전하 밀도 파동의 물리적 현상을 제어할 수 있는 매력적인 플랫폼입니다. 특히 Fe 삽입 NbS2는 자성 발현 메커니즘을 이해하는 것이 난제로 남아 있었습니다.", "motivation": "Fe삽입 NbS2에서의 반강자성 상태가 국소적인 국부 모멘트 모델로 설명될지, 아니면 강한 전자 상관관계에 의한 집단적인 전자 구조 재구성에 기인하는지 규명하고자 함.", "result": "ARPES, XAS 및 DFT 분석을 통해 Fe 삽입에 따른 eV 단위의 대규모 전자 구조 재구성을 확인했으며, 이는 상관관계가 강한 산화물에서 관찰되는 현상과 유사함.", "implication": "TMD 계열의 자기적 특성이 단순히 격자 내 삽입 이온의 독립적인 동작이 아니라, 호스트 물질과의 강한 전자적 상관관계에 의해 결정됨을 시사함.", "novelty": "TMD 물질에서 산화물 수준의 전자 상관관계가 자성 조절의 핵심 요소임을 실험적으로 입증하여, 향후 자성 TMD 설계를 위한 새로운 프레임워크를 제공함.", "unresolved": "Fe 농도 및 분포에 따른 자기적 상전이의 미세한 균질성 문제와, 이 전자 구조 재구성이 초전도성과의 경쟁 혹은 협력 관계에 미치는 영향은 미해결 과제임.", "future_work": "저온 STS 등을 통해 Fe 원자 배열의 국부적인 전자 구조 불균일성을 측정하고, 섭동이 가해진 상태에서의 자성 안정성을 탐구할 필요가 있음.", "concepts": [{"term": "전자 상관관계", "why_emerged": "전자 간 쿨롱 반발력이 무시할 수 없을 만큼 커질 때 단일 입자 모델의 한계를 극복하기 위해 필요.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "허바드 모델, 모트 절연체 연구와 밀접하게 연결됨."}, {"term": "XAS", "why_emerged": "원소 선택적 궤도 및 산화 상태 정보를 얻기 위해 필요.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "ARPES와 상호보완적이며 전자 구조와 자성 발현을 연결하는 분석 도구임."}], "english_summary": ["Investigated Fe-intercalated NbS2 using ARPES, XAS, and DFT.", "Evidence of eV-scale electronic restructuring driven by correlations.", "Supports the role of electronic correlations in magnetism of intercalated TMDs.", "Provides a framework for understanding magnetic TMDs through a strongly correlated lens."]}}, {"title": "Symmetry-Broken Ground State and Phonon-Mediated Superconductivity in Kagome CsV3Sb5", "journal": "PRL_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/4r8x-j3nd", "authors": "Manex Alkorta, Martin Gutierrez-Amigo, Đorđe Dangić, et al.", "last_authors": "Maia G. Vergniory, Ion Errea", "summary": "Author(s): Manex Alkorta, Martin Gutierrez-Amigo, Đorđe Dangić, Chunyu Mark Guo, Philip J. W. Moll, Maia G. Vergniory, and Ion Errea The newly discovered family of nonmagnetic kagome metals ${\\mathrm{AV}}_{3}{\\mathrm{Sb}}_{5}$ ($\\mathrm{A}=\\mathrm{K}$, Rb, or Cs) provides a unique platform for exploring the interplay between charge-density wave (CDW) order, superconductivity, nontrivial topology, and spontaneous time-reversal sym… [Phys. Rev. Lett. 136, 206401] Published Fri May 22, 2026", "tier": "A_MUST_READ", "score": "10", "reason": "Direct hit: kagome metal CsV3Sb5, CDW, superconductivity, and time-reversal symmetry breaking.", "tags": ["kagomemetal", "CsV3Sb5", "CDW", "superconductivity", "TRSB", "phonon"], "image": "", "briefing": {"background": "CsV3Sb5와 같은 카고메 금속은 CDW 상태, 초전도성, 그리고 위상적 성질이 얽혀 있는 현대 응집물질물리의 핵심 연구 대상임.", "motivation": "카고메 격자에서 나타나는 CDW와 초전도성, 특히 시간 역전 대칭성 깨짐(TRSB)이 격자 진동(포논) 및 전자적 상호작용과 어떻게 결합되는지 명확히 하고자 함.", "result": "카고메 물질의 대칭성 깨진 바닥 상태와 포논 매개 초전도성의 연관성을 시뮬레이션 및 이론적 분석을 통해 심층적으로 다룸.", "implication": "AV3Sb5 계열의 초전도 CeSb2", "journal": "arXiv_CondMat", "source": "author whitelist", "link": "https://arxiv.org/abs/2605.30074", "authors": "Xiaoxiao Wang, Xiaoyang Chen, Suppanut Sangphet, et al.", "last_authors": "Haichao Xu, Donglai Feng", "summary": "arXiv:2605.30074v1 Announce Type: new Abstract: The origin of quasi-one-dimensional (q1D) ferromagnetic (FM) excitations in the candidate spin-triplet superconductor CeSb$_2$ has remained unclear. Here we report an electronic mechanism for emergent q1D magnetism in the quasi-two-dimensional lattice of CeSb$_2$, revealed by angle-resolved photoemission spectroscopy (ARPES). High-resolution ARPES resolves no spin-density-wave gap on the dispersive Fermi pockets, disfavoring a nesting-driven mechanism for the q1D FM excitations. Instead, resonant ARPES reveals a pronounced selective enhancement of Ce 4$f$ spectral weight on the $C_2$-distributed Fermi pockets aligned with the Ce ladder. This observation signifies band-selective Kondo coupling that generates strongly anisotropic magnetic exchange interactions, which can naturally account for both the q1D ferromagnetic excitations and the competing magnetic orders. Our results identify a band-selective Kondo coupling mechanism for emergent low-dimensional magnetism in correlated $f$-electron systems.", "tier": "A_MUST_READ", "score": "10", "reason": "author whitelist: Donglai Feng", "tags": ["ARPES", "angle-resolvedphotoemission", "photoemission", "quasi-one-dimensional", "Kondo", "superconduct", "correlated", "ferromagnet"], "image": "https://arxiv.org/html/2605.30074v1/x1.png", "briefing": {"background": "강상관계 전자계에서 4f 전자(희토류 원소)와 전도 전자 사이의 상호작용인 Kondo 효과는 자기적 질서와 초전도성의 경쟁 및 공존을 결정짓는 핵심 기제입니다.", "motivation": "스핀-삼중항(spin-triplet) 초전도체 후보 물질인 CeSb2에서 관찰되는 준-1차원(q1D) 강자성 여기의 기원을 명확히 규명하고자 함입니다.", "result": "ARPES 측정 결과, 전형적인 SDW(스핀 밀도파) 갭이 관찰되지 않아 중첩(nesting) 기제는 부정되었으며, 대신 밴드 선택적 Kondo 결합이 1차원적 강자성 교환 상호작용을 유도함을 밝혀냈습니다.", "implication": "f-전자계에서 밴드 구조의 이방성과 Kondo 결합이 어떻게 저차원 자기 질서를 창발시키는 ure and physical properties are currently under intensive study. On the contrary, while hundreds of odd-parity magnets and the promising properties have been predicted in theory, experimental studies are scarce. Specifically, the magnetic structure and transport properties of candidates NiI2 and Ga3Ru4Al12 have been reported, yet the characteristic band structure and particularly the odd-parity spin symmetry remain elusive. Here we demonstrate experimentally the deterministic p-wave spin symmetry and resistance anisotropy switching for the prototype odd-parity magnet, CeNiAsO. Angle-resolved photoemission spectroscopy (ARPES) reveals two cleaved terminations with distinct surface band structure. By compensating the polar surface, we achieve intrinsic bulk band structure, for which the spin splitting can be well described by the p-wave magnetic structure through first-principles calculation. The bulk spin polarization measured by spin-resolved ARPES exhibits symmetry with only one degenerate plane, fingerprint of p-wave magnetism. We further demonstrate giant resistance anisotropy and switching between high-resistance and low-resistance states through modest field-induced domain selection, highlighting its potential for antiferromagnetic spin memory devices. The structural similarity between CeNiAsO and 1111-type Fe-based superconductors stimulates further exploration on the interplay between p-wave magnetism, superconductivity and band topology.", "tier": "A_MUST_READ", "score": "10", "reason": "Direct ARPES study of odd-parity p-wave magnetism in a material similar to iron-pnictide superconductors.", "tags": ["ARPES", "CeNiAsO", "altermagnetism", "p-wave-magnet"], "image": "https://arxiv.org/static/browse/0.3.4/images/arxiv-logo-fb.png", "briefing": {"background": "반전성 대칭성 깨짐과 시간 반전 대칭성 깨짐이 공존하는 자기계에서 나타나는 '홀수 패리티(odd-parity)' 자성은 고효율 스핀-전하 변환 및 위상 초전도체 구현에 핵심적입니다.", "motivation": "이론적으로 예측된 홀수 패리티 자성 물질들이 많음에도 불구하고, 실물질에서의 특징적인 밴드 구조와 스핀 대칭성이 실험적으로 확인되지 않아 이를 검증하고 d to the ions. The fate of the collective charge excitations in the intermediate regime is an outstanding question. This problem is especially important for strongly correlated systems such as the layered cuprates, where unconventional superconductivity and other emergent phenomena arise from valence electrons on the border between Mott localization and itinerancy. Using resonant inelastic X-ray scattering, we track this evolution in the prototypical electron-doped cuprate Nd2-xCexCuO4. We find a continuous transformation of the low-energy charge response: from an acoustic plasmon in the metallic regime, to a gapped hybrid mode at intermediate doping, and finally to a nearly dispersionless 139 meV excitation at half filling. Remarkably, the 139 meV excitation has approximately twice the energy of the oxygen breathing phonon responsible for the dispersion kink observed in angle-resolved photoemission spectroscopy, and is consistent with a putative 2-phonon excitation observed in Raman spectroscopy. These results establish a unified picture of collective charge excitations across the phase diagram of electron-doped cuprates, showing that such modes persist across the Mott transition via strong coupling to lattice degrees of freedom and revealing a missing link in the charge dynamics of carrier doped Mott insulators.", "tier": "A_MUST_READ", "score": "10", "reason": "author whitelist: Zhi-Xun Shen", "tags": ["angle-resolvedphotoemission", "photoemission", "unconventionalsuperconductivity", "cuprate", "superconduct", "correlated", "Mott", "phonon"], "image": "https://arxiv.org/static/browse/0.3.4/images/arxiv-logo-fb.png", "briefing": {"background": "금속의 플라즈몬과 절연체의 격자 진동(포논) 사이의 영역은 강상관 물질의 전하 동역학을 이해하는 중요한 열쇠이나, 그 전이 과정은 여전히 논쟁적입니다.", "motivation": "전자 도핑된 큐프레이트 Nd2-xCexCuO4에서 도핑 수준에 따른 전하 여기(charge excitation)의 진화 과정을 관측하여 Mott 전이 부근의 물리를 규명하고자 함입니다.", "result": "금속 영역의 음향 플라즈몬이 도핑이 감소함에 따라 간극(gap)을 가진 하이브리드 모드로 변하며, 결국 Mott 절연체 상태에서 격자 진동과 결합된 국부적 여기 모드로 진화함을 확인했습니다. ts on the Lieb lattice", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2605.30061", "authors": "Vanuildo S. de Carvalho, Hermann Freire, Rodrigo G. Pereira", "last_authors": "Hermann Freire, Rodrigo G. Pereira", "summary": "arXiv:2605.30061v1 Announce Type: new Abstract: We investigate the metal-insulator transition driven by the onsite repulsive interaction $U$ in an altermagnetic Hubbard model defined on a Lieb lattice. Using the slave-rotor approach at half filling, we find that the system exhibits a cascade of interaction-driven phase transitions. As $U$ increases, the system evolves from a normal metal to an altermagnetic metal, then to an altermagnetic insulator, and eventually to an altermagnetic Mott insulator characterized by the complete suppression of the quasiparticle weight. These phases are supported by the calculation of the electronic spectral function, which features spin-split bands in both the metallic and insulating regimes. However, the spin splitting becomes substantially suppressed in the Mott insulating phase. Our results suggest that the observation of spin splitting in the spectral function of $d$-wave altermagnets with a Lieb-lattice-like structure may be limited to the weak-to-moderate correlation regime.", "tier": "A_MUST_READ", "score": "9", "reason": "Directly relevant theory of spectral functions in altermagnets, essential for ARPES interpretation.", "tags": ["theory", "material", "altermagnetism"], "image": "https://arxiv.org/html/2605.30061v1/x1.png", "briefing": {"background": "알터자성(Altermagnetism)은 시간 역전 대칭은 깨지면서도 순자화는 0인 독특한 자기 위상으로, 최근 전이 금속 화합물 등에서 많은 주목을 받고 있습니다.", "motivation": "Lieb 격자 구조를 가진 알터자성체에서 전자 상관관계(U)가 증가함에 따라 금속-절연체 전이와 알터자성 특성이 어떻게 변화하는지 이론적으로 규명하고자 합니다.", "result": "Slave-rotor 방법을 통해 금속에서 알터자성 금속, 절연체, 그리고 밴드 분할이 억제된 Mott 절연체로 이어지는 전이 과정을 밝혀냈습니다.", "implication": "강한 상관관계 영역에서는 알터자성 특유의 밴드 분할이 약화될 수 있음을 시사하며, 실험 관측 시 상관관계의 세기를 고려해야 함을 보여줍니다.", "novelty": "ARPES 등을 통해 알터자성을 측정할 때 "STEM 및 EMCD를 사용하여 MnTe가 완벽한 P63/mmc 대칭성을 가진 g-wave 알터마그넷이 아니라, 국소적인 반전 대칭성 깨짐 왜곡이 존재함을 밝혔습니다. 이는 스핀-공간군(SSG)을 낮추어 d-wave 성분과 s-wave(순자화) 성분을 유도합니다.", "implication": "MnTe의 알터마그네틱 특성은 격자 구조와 밀접하게 연관되어 있으며, 국소적인 격자 왜곡이 스핀 분할을 제어하는 '노브(knob)' 역할을 할 수 있음을 시사합니다.", "novelty": "알터마그네틱 시스템에서 격자 왜곡과 자기적 질서의 공존을 원자 수준에서 시각화한 최초의 사례 중 하나이며, 이는 향후 spintronics 및 다강체 메모리 응용 연구에 중요한 단서를 제공합니다.", "unresolved": "국소 왜곡이 장거리 자기 질서의 기하학적 분포나 스핀 전류 생성 효율에 구체적으로 어떤 통계적 영향을 미치는지에 대한 정량적 분석은 미비합니다.", "future_work": "다른 알터마그네틱 후보 물질들에 대한 유사한 원자 단위 조사 및 외부 필드 인가 시 격자 왜곡의 가역적 제어 가능성을 탐구할 것으로 예상됩니다.", "concepts": [{"term": "알터마그네티즘", "why_emerged": "기존 반강자성체와 강자성체의 분류를 넘어, 대칭성에 의해 스핀 분할이 발생하는 새로운 위상학적/자기적 상태를 분류하기 위해 필요했습니다.", "origin": "최근 수년간의 이론적 정립(특정 저자보다는 분야 전체의 발전), 대표적으로 Šmejkal et al.의 연구들이 주도.", "connections": "반강자성 스핀트로닉스, 베리 곡률, 스핀-공간군(SSG) 이론."}, {"term": "EMCD (Electron Magnetic Chiral Dichroism)", "why_emerged": "TEM 내에서 나노미터 규모의 자기적 원소 특정 정보를 얻기 위해 개발된 기법입니다.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "XMCD의 투과전자현미경 버전으로, 자기적 도메인 영상화 및 전자 구조 분석에 활용."}], "english_summary": ["Atomic-scale investigation of MnTe using STEM and EMCD.", "Reveals that MnTe hosts local inversion-breaking distortions.", "Distortions lower the spin-space-group symmetry, inducing d-wave and s-wave spin splitting components.", "Confirms local lattice symmetry acts as a control parameter for altermagnetic properties.", "Provides vital insights for multiferroic memory and spintronic applications."]}}, {"title": "Cavity-driven attractive interactions in quantum materials", "journal": "Nature", "source": "Gemini", "link": "https://www.nature.com/articles/s41586-026-10609-1", "authors": "F. Helmrich, H. S. Adlong, M. Kroner, et al.", "last_authors": "A. İmamoğlu, T. F. Nova", "summary": "Nature, Published online: 27 May 2026; doi:10.1038/s41586-026-10609-1 A broadband, sub-wavelength time-domain microscope is described, enabling the observation that terahertz light trapped within a cavity can mediate a perties via transport measurements."]}}, {"title": "Oxygen-centred planar orbitals in the electronic structure and spin-density-wave reconstruction of multilayer nickelates", "journal": "Nature_Physics", "source": "Gemini", "link": "https://www.nature.com/articles/s41567-026-03286-4", "authors": "Christine C. Au-Yeung, Xinglong Chen, S. Smit, et al.", "last_authors": "J. F. Mitchell, A. Damascelli", "summary": "Nature Physics, Published online: 21 May 2026; doi:10.1038/s41567-026-03286-4 The potential similarities in the superconductivity in nickelates and cuprates is a topic of debate. Now a distinct likeness is observed in the electronic properties of these materials, which hints that the microscopic mechanisms may be related.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "High-impact study on electronic structure and correlated phenomena in nickelates, relevant to cuprate analogies.", "tags": ["nickelates", "electronicstructure", "superconductivity"], "image": "https://media.springernature.com/m685/springer-static/image/art%3A10.1038%2Fs41567-026-03286-4/MediaObjects/41567_2026_3286_Fig1_HTML.png", "briefing": {"background": "니켈레이트(nickelates)는 큐프레이트(cuprates) 고온 초전도체와 유사한 전자 구조를 가지고 있어, 초전도 현상의 보편적인 미시적 기원과 짝을 이루는 메커니즘을 밝히기 위한 핵심 물질군으로 연구되고 있습니다.", "motivation": "니켈레이트와 큐프레이트 간의 전자적 유사성이 실제로 물리적 성질과 초전도 메커니즘에서 얼마나 일치하는지 규명하는 것이 주요 과제입니다.", "result": "산소 중심의 평면 오비탈이 니켈레이트의 전자 구조 및 스핀 밀도 파동(SDW) 재구성에서 결정적인 역할을 함을 확인했습니다.", "implication": "이 결과는 니켈레이트와 큐프레이트의 전자적 물리량이 유사하다는 점을 강력하게 지지하며, 고온 초전도의 기원이 이들 물질 간의 공통된 전자적 특징에 있음을 시사합니다.", "novelty": "Damascelli 그룹의 고정밀 전자 구조 분석을 통해 니켈레이트의 핵심 오비탈 성질을 밝혀냈으며, 이는 ARPES 기반 연구자들에게 물질의 대응 관계를 재평가하게 하는 중요한 정보입니다.", "unresolved": "이러한 전자적 유사성이 실제 초전도 전이 온도까지 연결되는 정확한 결합 상수의 정량적 일치 여부는 아직 더 검증이 필요합니다.", "future_work": "다른 다층 니켈레이트 계열에서의 유사한 평면 오비탈 기여도 조사 및 도핑에 따른 전자 구조 변화를 관찰하는 RIXS/ARPES 연구가 기대됩니다.", "concepts": [{"term": "스핀 밀도 파동(SDW)", "why_emerged": "금속 내 전자들이 스핀 배열에 따라 공간적으로 주기적인 변조를 일으키는 현상을 설명하기 위해 도입되었습니다.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "반강자성 질서, 고온 초전도체에서의 가상적 전이 현상과 밀접"}, {"term": "큐프레이트(Cuprate) 초전도체", "why_emerged": "구리 산화물 기반의 고온 초전도 현상을 이해하기 위해 필요했습니다.", "origin": "Bednorz와 Müller(1986)", "connections": "니켈레이트, 강상관 전자계, d-파동 대칭성"}], "english_summary": ["Explores electronic similarities between nickelates and cuprates.", "Identifies oxygen-centered planar orbitals as key to electronic structure.", "Suggests shared microscopic mechanisms for superconductivity.", "Highlights importance of SDW reconstruction in multilayer nickelates."]}}, {"title": "Bulk thermal conductance of the 5/2 and 7/3 fractional quantum Hall states in the Corbino geometry", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/3mm9-47h9", "authors": "F. Boivin, M. Petrescu, Z. Berkson-Korenberg, K. W. West, L. N. Pfeiffer, and G. Gervais", "last_authors": "Z. Berkson-Korenberg, K. W. West, L. N. Pfeiffer, and G. Gervais", "summary": "Author(s): F. Boivin, M. Petrescu, Z. Berkson-Korenberg, K. W. West, L. N. Pfeiffer, and G. Gervais The peculiar 5/2 fractional quantum Hall state is a promising platform for fault-tolerant quantum computation, provided that the exact nature of its wave function can be understood. Here, using an exceptionally high-electron-mobility device patterned in the Corbino geometry, the authors report measurements of the pure bulk thermal conductance in the 5/2 and 7/3 fractional quantum Hall states. The data reveal a strong violation of the Wiedemann–Franz law, in agreement with a recent study published in N a t u r e , and suggest that the underlying wave function at filling factor 5/2 is particle–hole symmetric. [Phys. Rev. B 113, L201301] Published Thu May 21, 2026", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Important experiment on fractional quantum Hall states; consistent with broad interests.", "tags": ["experiment", "quantumHall"], "image": "", "briefing": {"background": "분수 양자 홀 효과(FQHE) 상태, 특히 5/2 상태는 비 alous Hall effect, 스핀트로닉스 소자, 스핀-궤도 결합"}, {"term": "Spin Filtering", "why_emerged": "강자성체를 통해 스핀이 편향된 전류를 생성하거나 검출하기 위해 고안된 물리학적 과정임.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "Magnetic tunnel junctions, 라쉬바 효과, 스핀 전달 토크"}], "english_summary": ["Proposed a mechanism for AMR at metal-ferromagnet interfaces based on scattering.", "Shows that interfacial Rashba and exchange interactions drive spin filtering.", "Provides an alternative to the bulk spin Hall effect origin for AMR.", "Enables better design and tuning of spintronic devices through interface engineering."]}}, {"title": "Electronic Layer Decoupling Driven by Density-Wave Order in La4Ni3O10", "journal": "PRL_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/qgl1-zh9f", "authors": "Ziqiang Guan (管梓强), Sophia F. R. TenHuisen, M. Tepie, et al.", "last_authors": "Christopher C. Homes, Matteo Mitrano", "summary": "Author(s): Ziqiang Guan (管梓强), Sophia F. R. TenHuisen, M. Tepie, Yifeng Zhao (赵祎峰), Ezra Day-Roberts, Harrison LaBollita, Alexander M. Young, Xiaomeng Cui (崔宵萌), Xinglong Chen (陈幸龙), Filippo Glerean, Carl Audric Guia, Mark P. M. Dean, Philip Kim, J. F. Mitchell, Antia S. Botana, Christopher C. Homes, and Matteo Mitrano We probe the density-wave transition of the trilayer nickelate ${\\mathrm{La}}_{4}{\\text{Ni}}_{3}{\\mathrm{O}}_{10}$ with polarization-resolved infrared spectroscopy. The low-energy electrodynamics is strongly anisotropic, with metallic in-plane and insulating out-of-plane character. In the ordered ph… [Phys. Rev. Lett. 136, 216501] Published Tue May 26, 2026", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Experimental study of density-wave order and anisotropic electrodynamics in a nickelate, relevant to CDW.", "tags": ["nickelate", "densitywave", "CDW", "spectroscopy", "unconventionalsuperconductivity"], "image": "", "briefing": {"background": "니켈산염(Nickelates)은 구리산염 초전도체와 유사한 전자 구조를 가지고 있어, 고온 초전도 기작을 연구하는 중요한 물질군입니다. 특히 삼중층 구조인 La4Ni3O10은 전하 밀도파(CD aki", "last_authors": "Y. Tokura, M. Kawasaki", "summary": "Author(s): N. Takahara, K. S. Takahashi, N. Nagaosa, Y. Tokura, and M. Kawasaki Oxide heterostructures provide excellent playgrounds to investigate novel transport phenomena emerging at interfaces due to broken inversion symmetry, in stark contrast to constituent compounds. Here, we fabricate ${\\mathrm{GdTiO}}_{3}/{\\mathrm{EuTiO}}_{3}$ heterostructures, where a two-dimensional … [Phys. Rev. Lett. 136, 206304] Published Tue May 19, 2026", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Experimental study of nonreciprocal transport at a polar-magnetic oxide heterostructure interface.", "tags": ["heterostructure", "transport", "magneticmaterials", "oxide", "experiment"], "image": "", "briefing": {"background": "산화물 이종접합(Oxide Heterostructures)은 계면에서의 대칭성 파괴를 통해 벌크 물질에서는 볼 수 없는 새로운 양자 현상을 유도할 수 있는 플랫폼입니다. 특히 강자성과 극성(polar)이 결합된 계면은 비가역적 수송 현상을 관찰하기에 최적의 장소입니다.", "motivation": "GdTiO3와 EuTiO3의 계면에서 형성되는 2차원 전자 가스의 비대칭적 수송 특성을 조사하여, 비가역적 전도(nonreciprocal conduction)의 기원을 이해하고자 합니다.", "result": "이종접합 계면에서 거대한 비가역적 수송 현상을 관측했습니다. 이는 inversion symmetry와 time-reversal symmetry가 동시에 깨진 환경에서 나타나는 스핀-궤도 상호작용과 자성 간의 상호작용에 기인함을 보였습니다.", "implication": "이러한 거대 비가역성은 미래의 스핀트로닉스 소자나 정류기(rectifier) 응용에 중요한 물리적 토대가 될 수 있습니다.", "novelty": "강자성과 극성 대칭성 파괴가 공존하는 계면에서의 비가역적 수송 현상을 직접 실험적으로 규명했다는 점이 탁월합니다.", "unresolved": "비가역적 수송을 유도하는 전자 상태의 구체적인 페르미 표면 구조와 Berry 곡률의 기여도에 대한 정량적 분석이 추가로 필요합니다.", "future_work": "다양한 게이트 전압을 이용한 페르미 레벨 튜닝 및 ARPES를 통한 계면 전자 구조의 직접적인 관측 연구가 예상됩니다.", "concepts": [{"term": "비가역적 전도 (Nonreciprocal Conduction)", "why_emerged": "전류의 방향에 따라 저항이 달라지는 현상을 기술하기 위해 필요했습니다.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "Rashba 효과, 강자성체, 비대칭적인 산화물 계면 물성과 연결됩니다."}, {"term": "대칭성 파괴 (Symmetry Breaking)", "why_emerged": "물질의 위상적 성질이나 비가역적 수송 현상을 설명하기 위한 근본 원리입니다.", "origin": "고체 물리학의 기초적인 대칭성 이론(Curie, Neumann 등)에 기반합니다.", "connections": "위상 절연체, 비가역 초전도체, 강유전성 소자 연구와 직결됩니다."}], "english_summary": ["We report gigantic nonreciprocal conduction in GdTiO3/EuTiO3 oxide heterostructures.", "The interface hosts a two-dimensional electron gas with broken inversion and time-reversal symmetry.", "The observed nonreciprocity is attributed to the interplay between magnetism and interfacial Rashba-like spin-orbit coupling.", "This system provides a promising platform for developing novel spintronic and rectifying devices."]}}, {"title": "Magnetochiral Anisotropy in Josephson Diode Effect of All-Metallic Lateral Junctions with Interfacial Rashba Spin-Orbit Coupling", "journal": "PRL_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/n9g9-99wl", "authors": "Maximilian Mangold, Lorenz Bauriedl, Johanna Berger, et al.", "last_authors": "Christoph Strunk, Dhavala Suri", "summary": "Author(s): Maximilian Mangold, Lorenz Bauriedl, Johanna Berger, Chang Yu-Cheng, Thomas N. G. Meier, Matthias Kronseder, Pertti Hakonen, Christian H. Back, Christoph Strunk, and Dhavala Suri We explore the role of interfacial Rashba spin-orbit coupling (SOC) for the Josephson diode effect in all-metal diffusive Josephson junctions. Devices with Fe/Pt and Cu/Pt weak links between Nb leads reveal a Josephson diode effect in an in-plane magnetic field with magnetochiral anisotropy accordin… [Phys. Rev. Lett. 136, 206002] Published Wed May 20, 2026", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Experimental study of Josephson diode effect and Rashba SOC in metallic junctions, relevant to superconductivity.", "tags": ["superconductivity", "spin-orbitcoupling", "transport", "experiment"], "image": "", "briefing": {"background": "조셉슨 다이오드 효과(Josephson Diode Effect)는 초전도 접합에서 전류 방향에 따라 임계 전류가 달라지는 비가역적 현상입니다. 이는 시간 역전 대칭성과 반전 대칭성이 깨진 시스템에서 스핀-궤도 결합(SOC)의 도움으로 발생합니다.", "motivation": "금속 접합(all-metallic junctions)에서의 계면 Rashba SOC가 조셉슨 다이오드 효과를 어떻게 제어하는지 실험적으로 검증하고자 합니다.", "result": "Nb 초전도체를 리드로 사용하고 Fe/Pt, Cu/Pt를 약한 연결체로 사용한 접합에서 외부 자기장에 따른 조셉슨 다이오드 효과를 관측했습니다. 이는 Rashba SOC에 기인한 magnetochiral anisotropy로 설명됩니다.", "implication": "초전도 소자에서 자기장 제어가 가능한 비가역적 회로를 구현할 수 있는 가능성을 열어주며, 위상 초전도성 연구에도 유용한 정보를 제공합니다.", "novelty": "복잡한 위상 물질이 아닌 표준적인 금속 접합 구조에서 인터페이스 Rashba SOC를 통한 조셉슨 다이오드 효과를 확인했다는 점이 중요합니다.", "unresolved": "이러한 금속 접합에서의 조셉슨 다이오드 효과가 얼마나 큰 크기까지 구현 가능하며, 노이즈 환경에서 얼마나 안정적으로 작동하는지에 대한 연구가 필요합니다.", "future_work": "이러한 접합 구조를 이용한 논리 회로 소자 제작이나, 다른 스핀-궤도 결합 물질과의 비교 연구가 이어질 것입니다.", "concepts": [{"term": "조셉슨 다이오드 효과", "why_emerged": "초전도 회로에서 전류의 정류 작용을 구현하기 위해 필요했습니다.", "origin": "최근 수년 내 이론적으로 예측되고 실험적으로 입증되었습니다 (초록 정보만으로는 특정하기 어려움).", "connections": "Rashba SOC, 시간 역전 대칭성 파괴, 위상 초전도성 연구와 연결됩니다."}, {"term": "Rashba 스핀-궤도 결합", "why_emerged": "계면에서 반전 대칭성이 깨질 때 스핀과 운동량의 결합을 설명하기 위해 필요합니다.", "origin": "Emmanuel Rashba (1960년대 초반).", "connections": "위상 절연체, 스핀 홀 효과, 강자성/초전도체 이종접합 물성과 밀접합니다."}], "english_summary": ["We observe the Josephson diode effect in all-metal diffusive Josephson junctions with interfacial Rashba SOC.", "Devices using Fe/Pt and Cu/Pt weak links show nonreciprocal critical currents under in-plane magnetic fields.", "The effect is consistent with magnetochiral anisotropy driven by Rashba spin-orbit coupling.", "These findings demonstrate a pathway for controlling superconducting circuits using interfacial effects."]}}, {"title": "Probing Site-Specific Magnetism in Time-Reversal-Odd Antiferromagnet via Electric Field-Induced Nonreciprocal Directional Dichroism", "journal": "PRL_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/75rk-xz8t", "authors": "Koei Matsumoto, Takeshi Hayashida, Tsuyoshi Kimura", "last_authors": "Takeshi Hayashida, Tsuyoshi Kimura", "summary": "Author(s): Koei Matsumoto, Takeshi Hayashida, and Tsuyoshi Kimura We investigated the optical absorption spectra of the time-reversal-odd antiferromagnet ${\\mathrm{ErCrO}}_{3}$ under an applied electric field ($\\mathbf{E}$). This material, with its two distinct magnetic sites (${\\mathrm{Er}}^{3+}$ and ${\\mathrm{Cr}}^{3+}$), exhibits successive antiferromagnetic (A… [Phys. Rev. Lett. 136, 216703] Published Thu May 28, 2026", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Experimental study of time-reversal-odd antiferromagnetism, potentially related to TRSB.", "tags": ["antiferromagnetism", "TRSB", "spectroscopy", "magneticmaterials"], "image": "", "briefing": {"background": "시간 반전 대칭성이 깨진(TRSB) 반강자성체는 스핀 텍스처와 위상학적 물성 연구에서 핵심적인 대상입니다. 물질 내 자성 이온의 국소적 자기 구조를 비파괴적으로 프로빙하는 것은 매우 도전적인 과제입니다.", "motivation": "ErCrO3와 같은 다중 자기 사이트(Er, Cr)를 가진 반강자성체에서 외부 전기장에 의한 광학적 비가역 현상을 통해 사이트별 자기 상태를 분리해 관측하고자 했습니다.", "result": "외부 전기장을 인가했을 때 유도되는 비가역적 방향성 이색성(Nonreciprocal Directional Dichroism)을 측정하여, Er3+와 Cr3+ 사이트가 각각 자기 질서에 어떻게 기여하는지 구분해냈습니다.", "implication": "자기적으로 복잡한 시스템에서 특정 이온의 자기 기여도를 전기장 제어를 통해 분리할 수 있음을 보였으며, 이는 TRSB 물질의 미시적 이해를 높입니다.", "novelty": "외부 자기장이 아닌 외부 전기장 인가를 통해 자기 비가역성을 프로빙했다는 점이 독특합니다. 독자의 관심사인 TRSB 및 자기 위상 물질 연구의 실험적 툴로서 가치가 있습니다.", "unresolved": "전기장 유도 효과가 미시적으로 격자 왜곡과 어떻게 결합하는지에 대한 정량적 분리는 추가 연구가 필요합니다.", "future_work": "다른 TRSB 후보 물질(kagome 금속 등)에 대한 전기장 기반의 비선형 광학 분광법 적용이 기대됩니다.", "concepts": [{"term": "비가역적 방향성 이색성 (NDD)", "why_emerged": "물질 내의 반전 대칭성과 시간 반전 대칭성의 깨짐을 동시에 탐지하기 위해 필요.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "비선형 광학, 자기 전기 효과(Magnetoelectric effect)."}, {"term": "시간 반전 대칭성 깨짐 (TRSB)", "why_emerged": "위상 절연체나 초전도체에서 새로운 위상학적 상태를 정의하는 핵심 특성.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "Kagome 금속 AV3Sb5, Weyl 반금속."}], "english_summary": ["Investigated ErCrO3 using electric field-induced nonreciprocal directional dichroism.", "Successfully separated magnetic contributions from distinct Er3+ and Cr3+ sites.", "Demonstrates a novel approach to probe site-specific magnetism in TRSB antiferromagnets.", "Highlights the potential of electric fields in manipulating and observing magnetic order."]}}, {"title": "Magnon hydrodynamics in an atomically thin ferromagnet", "journal": "Science", "source": "Gemini", "link": "https://doi.org/10.1126/science.adp2397", "authors": "Ruolan Xue, Nikola Maksimovic, Pavel E. Dolgirev, et al.", "last_authors": "Eugene Demler, Amir Yacoby", "summary": "Strong interactions between particles can lead to emergent collective excitations. Spin waves, known as magnons, have been predicted to reach a strongly interacting hydrodynamic regime, where they form a slow collective density mode. In this work, we isolate exfoliated sheets of chromium trichloride (CrCl 3 ), where magnon interactions are strong, and develop a technique to measure the collective magnon dynamics though nearby nitrogen-vacancy centers in diamond. Thermal magnetic fluctuations generated by monolayer CrCl 3 increase upon decreasing temperature; this anomalous trend may be a consequence of the damping rate of a low-energy magnon sound mode that sharpens as magnon interactions increase with increasing temperature. By measuring the magnetic fluctuations emitted by thin multilayer CrCl 3 in the presence of a variable-frequency drive field, we obtain spectroscopic evidence for this two-dimensional magnon sound mode.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Experimental study of magnon hydrodynamics in an atomically thin ferromagnet.", "tags": ["2Dmaterials", "magnetism", "magnons", "stronglycorrelatedelectrons", "experiment"], "image": "", "briefing": {"background": "원자층 두께의 강자성체에서 스핀파(마그논)의 거동은 저차원 자성 연구의 핵심입니다. 특히 마그논 간의 상호작용이 강해질 때 나타나는 유체역학적(hydrodynamic) 거동은 새로운 수송 현상을 이해하는 열쇠가 됩니다.", "motivation": "CrCl3 단층 및 다층 구조에서 마그논 상호작용이 강한 유체역학적 영역을 확인하고, 이를 실시간으로 관측할 수 있는 기법을 개발하고자 했습니다.", "result": "NV-center를 이용한 나노 스케일 자기장 측정법을 통해 CrCl3의 마그논 유체역학적 특성을 측정했습니다. 특정 온도 구간에서 마그논 음향 모드(magnon sound mode)의 감쇠율 변화가 관측되었습니다.", "implication": "2D 자성체에서 마그논이 입자처럼 충돌하며 유체처럼 흐르는(hydrodynamic) 상태를 실험적으로 증명함으로써 마그논 트랜지스터 등 차세대 스핀트로닉스 가능성을 열었습니다.", "novelty": "2D 물질인 CrCl3에서 마그논 유체역학적 거동을 최초로 입증했습니다. 이는 강한 전자 상관계 및 2D 자성 연구자들에게 중요한 레퍼런스가 됩니다.", "unresolved": "온도 변화에 따른 마그논 감쇠율의 비정상적 경향성에 대한 이론적 정합성이 아직 더 정밀하게 다듬어질 필요가 있습니다.", "future_work": "다른 2D 반데르발스 자성체에서의 마그논 점성 및 수송 특성 측정.", "concepts": [{"term": "마그논 유체역학 (Magnon hydrodynamics)", "why_emerged": "마그논 간 충돌 빈도가 매우 높을 때 입자적 거동이 유체 흐름과 유사해지기 때문에 필요.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "전자 유체역학(Electron hydrodynamics), 그래핀."}, {"term": "NV-center (질소-공공 센터)", "why_emerged": "나노 스케일에서 미세한 자기장의 공간적 분포를 고감도로 측정하기 위해 필요.", "origin": "다이아몬드 결함 연구를 통해 2000년대 이후 발전.", "connections": "양자 센싱, 자기 현미경."}], "english_summary": ["Observed magnon hydrodynamics in atomically thin CrCl3.", "Utilized nitrogen-vacancy centers in diamond as a sensitive probe for thermal magnetic fluctuations.", "Identified evidence of a two-dimensional magnon sound mode in the hydrodynamic regime.", "Provides insight into collective magnon dynamics in strongly interacting 2D magnetic systems."]}}, {"title": "Multiple photon field–induced topological states in bulk HgTe", "journal": "Science_Advances", "source": "Gemini", "link": "https://doi.org/10.1126/sciadv.aea5823", "authors": "Dongbin Shin, I-Te Lu, Benshu Fan, et al.", "last_authors": "Peizhe Tang, Angel Rubio", "summary": "Strong light-matter interactions can be exploited to modify properties of quantum materials both in and out of thermal equilibrium. Recent studies suggest that electromagnetic fields in photonic structures can hybridize with condensed matter systems, resulting in photon field–dressed collective quantum. Here, we show that photon fields in photonic structures, including optical cavities and waveguides, induce emergent topological phases in solids through polarization-mediated symmetry-breaking mechanisms. Using state-of-the-art quantum electrodynamic density functional theory calculations, we demonstrate that strong light-matter coupling can reconfigure both the electronic and ionic structures of HgTe, driving the system into Weyl, nodal-line, or topological insulator phases. These phases depend on the relative orientation of the sample in the coupling strength. In contrast with laser-dri ure design.", "Advances beyond traditional Floquet engineering by utilizing vacuum fluctuations."]}}, {"title": "Spin glass in quantum paraelectric KTaO 3 : Supercritical CO 2 -induced monoclinic phase", "journal": "Science_Advances", "source": "Gemini", "link": "https://doi.org/10.1126/sciadv.aed5419", "authors": "Yuning Liang, Qun Xu", "last_authors": "Yuning Liang, Qun Xu", "summary": "Inducing magnetism in d 0 nonmagnetic oxides is a central challenge in condensed matter physics and a bottleneck for developing advanced spintronic devices. KTaO 3 epitomizes this challenge: Despite having strong spin-orbit coupling, its functionality is hindered by a stable nonmagnetic cubic phase. Here, we report the unlocking of magnetism in KTaO 3 via supercritical carbon dioxide (SC CO 2 ), which induces a stable monoclinic phase that has, until now, remained undiscovered. Experimentally, we demonstrate that this monoclinic phase has spontaneous magnetic moments, driving the system into a spin-glass state. Monte Carlo simulations pinpoint the origin of this glassy behavior to interfacial phase frustration, arising from the coupling between ferromagnetic facets and an antiferromagnetic bulk. To our knowledge, this work not only presents the first observation of a magnetic phase in KTaO 3 but also reveals a peculiar phenomenon of SC CO 2 –induced interfacial phase frustration, establishing a versatile strategy for engineering complex magnetic states in quantum paraelectric.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Inducing and studying spin glass magnetism in a quantum paraelectric oxide, highly relevant CM.", "tags": ["spinglass", "quantumparaelectric", "magnetism", "materialsscience", "oxides"], "image": "", "briefing": {"background": "d0 산화물은 전통적으로 자성이 없는 절연체로 여겨져 왔으나, 스핀트로닉스 소자 응용을 위해 자성을 유도하려는 노력이 응집물질물리학의 중요한 과제입니다. 특히 KTaO3는 강한 스핀-궤도 결합(SOC)을 가지고 있어 자성 구현 시 잠재력이 크지만, 상온에서 안정한 입방정계(cubic) 구조가 비자성 상태를 강하게 유지한다는 한계가 있었습니다.", "motivation": "본 연구는 외부 자극인 초임계 이  (2024)] revealed striking inverse-current (1/I) quantum oscillations in quasi-one-dimensional charge-density-wave (CDW) insulators and proposed an intrinsic Floquet sideband mechanism arising from the sliding condensate. Here we develop the complete theoretical framework underlying this proposal. We provide an exact Floquet diagonalization of the uniformly sliding CDW, yielding split gap edges and a ladder of Floquet sidebands with explicit unitary transformation and spectral functions. Using this exact solution, we formulate weak-probe tunneling spectroscopy and show that the local Floquet spectrum naturally yields 1/I oscillations as successive sideband edges cross a fixed contact chemical potential. Matching the observed oscillation period to theory reveals that the macroscopic current must percolate through a highly localized coherent filament, with effective channel number N_eff ~ 480, nearly two orders of magnitude smaller than the geometric chain count N_geom ~ 3 x 10^4. This filamentary confinement is essential: achieving the required sliding frequency uniformly across the bulk would demand prohibitively large currents and induce thermal dephasing. Furthermore, using a segmented multiterminal model, we show that inelastic phase-slip dephasing near the contacts explains the observed suppression of oscillation visibility on outer voltage probes. We also contrast the persistent-current-driven multiterminal geometry with a homogeneous voltage-biased two-terminal reference calculation. Our results establish a rigorous nonequilibrium transport framework for the observed 1/I oscillations and highlight a universal spatial-to-temporal conversion mechanism in which the insulating gap protects Floquet coherence, offering a design principle for intrinsically driven quantum devices.", "tier": "C_MAYBE", "score": "8", "reason": "Theoretical framework for sliding CDW transport and Floquet sidebands in quasi-1D materials, highly relevant to user.; tier capped to C: formal/ roximate those of the BM model with realistic parameters. Importantly, charge concentration also leads to Berry curvature concentration at $\\Gamma$, generating a small parameter $s$ that yields analytic tractability. We show that, rather surprisingly, the model hosts nearly decoupled flavor moments without any extra degrees of freedom. These moments are non-local due to topology-enforced power-law tails, yet have parametrically small overlap. We further develop a diagrammatic expansion in which the self energy can be computed exactly to leading order in $s^2$ in the fluctuating moment regime. At charge neutrality, we find a \"Mott semimetal\", with large flavor entropy and a Mott gap everywhere in the BZ except for the vicinity of the $\\Gamma$ point. Away from neutrality, the Mott semimetal gaps out in a spectrally imbalanced manner, with one Mott band having zero $Z_k$ at the $\\Gamma$ point. The model accurately reproduces results from finite temperature thermodynamic measurements, leads to new experimental predictions, and resolves the problem of the emergence of Hubbard physics in isolated topological bands.", "tier": "C_MAYBE", "score": "8", "reason": "Significant theory on twisted bilayer graphene combining topology and Hubbard physics.; tier capped to C: formal/generic theory watch", "tags": ["graphene", "topology", "Berry-curvature"], "image": "https://arxiv.org/static/browse/0.3.4/images/arxiv-logo-fb.png", "briefing": {"background": "자동 브리핑을 생성하지 못했습니다. 초록과 원문 링크를 기준으로 빠르게 확인하세요.", "motivation": "초록 정보만으로는 분야 내부의 구체적 동기를 안정적으로 요약하기 어렵습니다.", "result": "arXiv:2408.16761v3 Announce Type: replace Abstract: Twisted bilayer graphene (TBG) has elements in common with two paradigmatic examples of strongly correlated physics: quantum Hall physics and Hubbard physics. On one hand, TBG hosts flat topological Landau-level-like bands which exhibits quantum anomalous Hall effects. On the other hand, these bands have concentrated charge density and show signs of extens aldwin, M. Shayegan", "last_authors": "A. Gupta, L. N. Pfeiffer, K. W. Baldwin, M. Shayegan", "summary": "arXiv:2605.30129v1 Announce Type: new Abstract: Disorder-induced localization of electrons and electron-electron interaction are among the most fundamental problems in condensed matter physics. In two-dimensional electron systems, extensive studies have led to the emergence of a scaling picture, characterized by a set of universal critical exponents that govern the transitions between the integer quantum Hall plateaus. From the temperature dependence of the plateau-to-plateau transitions, experiments primarily report k ~ 0.42, implying a dynamic exponent z = 1, consistent with a theoretical picture where electrons have a long-range (1/r) interaction. Theory also predicts that z = 2 for short-range electron interaction, but an experimental verification has remained elusive. Here, we directly probe the influence of Coulomb interaction on these transitions using a bilayer electron system confined to a GaAs double quantum well device. The two layers are in close proximity, with an interlayer distance approximately equal to the magnetic length at the relevant magnetic fields. By tuning the electron density in the top layer, we access both insulating and metallic phases of the electrons in this layer as a function of magnetic field, allowing in-situ control of the unscreened and screened interaction strengths in the bottom layer as it goes through its plateau-to-plateau transitions. In the unscreened case, we measure k ~ 0.42 consistent with the widely reported value. More importantly, when screening is introduced, k is reduced to ~ 0.22, implying z = 2. Our results provide direct experimental evidence for the role of electron-electron interaction in determining critical behavior in the quantum Hall regime, and demonstrate screening as a powerful tuning parameter for engineering quantum criticality.", "tier": "C_MAYBE", "score": "7", "reason": "Experimental investigat
