esult": "모아레 Kondo 격자 시스템에서 Kondo 상호작용과 분수 충진율에서의 위상적 비자명한 상태 형성 사이의 구체적인 연결 고리를 발견했습니다.", "implication": "모아레 시스템이 강상관 전자계의 Kondo 물리학을 연구하는 강력한 도구임을 입증하며, 위상적 Chern 절연체가 모아레 Kondo 상호작용으로부터 파생될 수 있음을 보여줍니다.", "novelty": "기존 벌크 무거운 페르미온 물질과는 다른 모아레 격자만의 고유한 위상적 상태 발현 기전을 제시하며, 특히 Chern 절연체와의 연결성은 전자 구조 조절 측면에서 매우 혁신적입니다.", "unresolved": "이러한 상태가 분수 충진율 전반에 걸쳐 보편적으로 나타나는지, 혹은 특정 시스템 파라미터에 민감한지에 대한 정량적 분석이 추가로 필요합니다.", "future_work": "다양한 모아레 각도 및 층간 상호작용 조절을 통한 위상적 물성의 정밀 제어 실험 및 이론적 다체 계산 연구가 예상됩니다.", "concepts": [{"term": "Moiré Kondo Lattice", "why_emerged": "모아레 패턴을 통해 형성된 좁은 밴드 내의 국소화된 전자와 전도 전자 사이의 상호작용을 연구하기 위해 도입됨.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "Kondo 격자 모델, 중성 페르미온(Heavy fermion), 강상관 전자계"}, {"term": "Chern Insulator", "why_emerged": "외부 자기장 없이도 자발적인 시간 반전 대칭성 깨짐에 의해 위상적으로 보호되는 전도 채널을 구현하기 위해 제안됨.", "origin": "Haldane(1988)", "connections": "양자 변칙 홀 효과(QAHE), 위상적 절연체, Berry 곡률"}], "english_summary": ["Explores topological states near Kondo breakdown in moiré systems.", "Identifies a link between chiral Kondo interactions and Chern insulator formation.", "Demonstrates unique physics not seen in traditional heavy-fermion materials.", "Highlights the potential of moiré platforms for simulating complex correlated states."]}}, {"title": "Evolution of the Superfluid Density in Infinite-Layer Nickelates", "journal": "PRL_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/25gn-bfgw", "authors": "Bai Yang Wang, Shannon P. Harvey, Kyuho Lee, et al.", "last_authors": "Srinivas Raghu, Harold Y. Hwang", "summary": "An experiment enables the first systematic, absolute superfluid-density measurement across the full superconducting dome of an infinite-layer nickelate.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Important experiment on unconventional nickelate superconductors.", "tags": ["nickelate", "superconductivity", "experiment"], "image": "", "briefing": {"background": "무한층(infinite-layer) 니켈산염은 구리산염 고온 초전도체와 유사한 전자 구조를 가지고 있어, 비전통적 초전도 현상의 기원을 밝히는 데 핵심적인 물질군으로 주목받고 있습니다.", "motivation": "니켈산염 시스템에서 초전도 상태의 본질을 이해하기 위해서는 초전도 돔 전체에 걸친 초유체 밀도(superfluid density)와 같은 핵심적인 물리량의 정량적 측정이 필수적입니다.", "result": "니켈산염 초전도 돔 전역에 걸친 절대적인 초유체 밀도를 체계적으로 측정한 첫 사례입니다.", "implication": "초전도 전이 온도와 초유체 밀도 사이의 상관관계를 통해 니켈산염의 초전도 기전이 구리산염의 BCS-BEC 크로스오버와 유사한지 혹은 다른 강상관 특징을 갖는지 판단할 근거를 제공합니다.", "novelty": "박막 샘플 제작의 어려움을 극복하고 초전도 돔 전반에 걸친 절대값 데이터를 확보한 실험적 성과가 탁월하며, 니켈산염 초전도 연구의 벤치마크가 될 것입니다.", "unresolved": "측정된 초유체 밀도가 실제 시스템의 국소적 불균일성이나 격자 결함으로부터 얼마나 독립적인지에 대한 검증이 필요합니다.", "future_work": "다른 도핑 수준이나 압력 조건에서의 초유체 밀도 비교, 이론적 모델과의 정량적 대조 연구가 진행될 것으로 보입니다.", "concepts": [{"term": "Superfluid Density", "why_emerged": "초전도 상태의 응축된 전자 쌍의 밀도를 정의하고 초전도체 특성을 정량화하기 위해 필요함.", "origin": "London(1935)", "connections": "런던 관통 깊이(London penetration depth), 비전통적 초전도성, BCS 이론"}, {"term": "Infinite-Layer Nickelate", "why_emerged": "구리산염과 유사한 3d9 전자 구성을 가지면서도 조절 가능한 강상관 시스템을 탐구하기 위해 합성됨.", "origin": "Li et al.(2019)", "connections": "구리산염(cuprates), Mott 절연체, 전자 도핑된 초전도체"}], "english_summary": ["Provides the first systematic measurement of absolute superfluid density in nickelates.", "Covers the entire superconducting dome of infinite-layer nickelates.", "Crucial for understanding the nature of unconventional superconductivity in these materials.", "Facilitates comparison with cuprate superconductors."]}}, {"title": "Gossamer Superconductivity in Moiré WSe2 Bilayer", "journal": "PRL_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/mvnb-m6fd", "authors": "Hui-Ke Jin, Guangyue Ji, Zhan Wang, Jie Wang, Fu-Chun Zhang", "last_authors": "Jie Wang, Fu-Chun Zhang", "summary": "Moiré transition metal dichalcogenides have served as a versatile platform for simulating Hubbard physics. Recent experiments have identified robust superconductivity in moiré bilayer ${\\mathrm{WSe}}_{2}$ for certain twist angles. Here, we propose the gossamer nature of the superconductivity recentl…", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Highly relevant moiré physics on TMD platforms; aligns with broad interests.", "tags": ["moiré", "superconductivity", "TMD"], "image": "", "briefing": {"background": "WSe2와 같은 전이금속 디칼코게나이드(TMD)의 모아레 시스템은 강상관 Hubbard 모델을 시뮬레이션할 수 있는 매우 깨끗한 플랫폼입니다.", "motivation": "최근 모아레 WSe2에서 관찰된 초전도 현상이 기존의 일반적인 초전도체와 달리 강한 상관관계 속에 있는 'Gossamer' 성질을 띠고 있는지 이론적으로 규명하고자 합니다.", "result": "모아레 WSe2에서 발견된 초전도 현상이 'Gossamer' 초전도 특성을 나타냄을 이론적으로 제시했습니다.", "implication": "이 물질이 강하게 상관된 상태와 초전도 상태 사이의 경계에 있음을 시사하며, Hubbard 물리 기반의 새로운 초전도 메커니즘 이해에 기여합니다.", "novelty": "모아레 TMD 시스템을 단순히 Hubbard 시뮬레이터로 보는 것을 넘어, 더 세부적인 초전도 전이 양상을 규명한 점이 돋보입니다.", "unresolved": "실험적인 위상(phase) 다이어그램과의 정확한 정량적 일치 여부는 실험적 관측의 개선에 따라 검증이 필요합니다.", "future_work": "Gossamer 초전도성임을 확인할 수 있는 비열이나 특정 대역의 터널링 분광(STS) 신호 예측 및 실험적 검증이 기대됩니다.", "concepts": [{"term": "Gossamer Superconductivity", "why_emerged": "Mott 절연체와 가까운 경계에서 나타나는 초전도로, 전자쌍이 매우 희박하고 비정상적인 특성을 갖는 상태를 묘사하기 위해 등장함.", "origin": "Laughlin(2002)", "connections": "Mott 절연체, 도핑된 Mott 시스템, 고온 초전도체"}, {"term": "Moiré TMD Bilayer", "why_emerged": "TMD의 강한 스핀-궤도 결합과 모아레 패턴의 격자 변조를 결합하여 이색적인 강상관 상태를 구현하기 위해 도입됨.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "Hubbard 모델, 페르미온 시스템, 엑시톤 절연체"}], "english_summary": ["Theoretical proposal identifying 'gossamer' superconductivity in moiré WSe2 bilayers.", "Explains the superconducting state near the Mott insulating boundary.", "Reinforces the utility of TMD moiré platforms for exploring correlated electronic phases.", "Provides a theoretical framework for interpreting experimental superconducting features."]}}, {"title": "Spinless Charged Excitation at the Interface between a Conventional Topological Insulator and a Topological Mott Insulator", "journal": "PRL_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/p38y-wyrj", "authors": "Cesar A. Gallegos, Andrew J. Millis, Steven R. White", "last_authors": "Andrew J. Millis, Steven R. White", "summary": "We investigate the interface separating two topologically distinct insulating phases of matter using extensive density-matrix renormalization group calculations to study the triangular-lattice Hofstadter-Hubbard model with a spatially varying interaction strength, chosen to realize both integer quan…", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Important theory paper for topological insulators and Mott physics with potential experimental implications.", "tags": ["topological-insulator", "Mott", "Hubbard"], "image": "", "briefing": {"background": "위상 절연체와 모트 절연체는 각각 대칭성 보호 위상과 강한 전자 상관관계에 의해 발생하는 서로 다른 절연 상태입니다. 이 두 상태의 경계면에서는 비정상적인 전하 및 스핀 상태가 발현될 수 있어, 위상 전자 물리학의 핵심 연구 대상입니다.", "motivation": "서로 다른 위상적 성질을 가진 두 절연체 사이의 경계면에서 나타나는 전자 상태의 특성을 미시적으로 규명하고자 합니다.", "result": "삼각 격자 호프스태터-허바드 모델을 사용하여 경계면에 스핀이 없는(spinless) 전하 여기 상태가 존재함을 수치적으로 확인하였습니다.", "implication": "위상적으로 다른 물질 간의 접합부에서 전하 전달 현상과 위상적 전이를 제어할 수 있는 새로운 가능성을 제시합니다.", "novelty": "DMRG(밀도 행렬 재규격화군)를 통해 대규모 다체 시스템의 경계면 현상을 정밀하게 시뮬레이션함으로써, 강한 상관관계와 위상적 성질이 결합된 시스템의 복잡한 물리적 기원을 밝혔습니다.", "unresolved": "실제 실험적으로 이 경계면을 제작하고 스핀 없는 전하 여기를 측정할 수 있는 구체적인 물질 후보군에 대한 논의는 부족합니다.", "future_work": "해당 여기 상태의 동역학적 특성과 위상적 성질을 검증하기 위한 추가적인 수치 계산 및 1D/2D 이질 접합 구조에 대한 연구가 필요합니다.", "concepts": [{"term": "Hofstadter-Hubbard 모델", "why_emerged": "강한 자기장 하의 격자 위상 물리와 전자 상관관계를 동시에 다루기 위해 필요합니다.", "origin": "Douglas Hofstadter (1976), 초록 정보만으로는 특정하기 어려움", "connections": "양자 홀 효과, Chern 절연체 연구와 직결됨"}, {"term": "Topological Mott Insulator", "why_emerged": "위상적 성질과 모트 물리(전자 상관관계)가 공존하는 새로운 절연 상태를 정의하기 위해 등장했습니다.", "origin": "Raghu et al. (2008)", "connections": "위상 절연체, 스핀 액체 이론과 연결"}], "english_summary": ["Investigates the interface between conventional topological insulators and topological Mott insulators.", "Utilizes extensive DMRG calculations on the Hofstadter-Hubbard model.", "Demonstrates the emergence of spinless charged excitations at the interface.", "Provides a theoretical framework for controlling interface states in strongly correlated topological systems."]}}, {"title": "Giant elastoresistance in magic-angle twisted bilayer graphene", "journal": "Science", "source": "Gemini", "link": "https://www.science.org/doi/abs/10.1126/science.adz0597?af=R", "authors": "Xuetao Ma, Zhaoyu Liu, Jiaqi Cai, et al.", "last_authors": "Jiun-Haw Chu, Matthew Yankowitz", "summary": "Strongly correlated and topological phases in moiré materials are exquisitely sensitive to lattice geometry at both atomic and superlattice length scales. Twist angle, pressure, and strain directly modify the lattice and thus act as highly effective tuning parameters. Here, we examined electrical transport in twisted bilayer graphene subjected to continuous uniaxial strain. Near the magic angle (≈1.1°), devices exhibited a pronounced elastoresistance that depended on band filling and temperature, with a gauge factor more than two orders of magnitude larger than that of conventional metals. In selected doping regimes, the elastoresistance exhibited a Curie-Weiss–like temperature divergence. We discuss possible microscopic origins, including nematic fluctuations and enhanced electronic entropy from fluctuating isospin moments. Our work establishes uniaxial strain as a versatile probe of correlated physics in a moiré material.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "High-impact experiment on correlated moire systems relevant to the broad user profile.", "tags": ["moire", "graphene", "transport"], "image": "", "briefing": {"background": "모아레 초격자 구조는 마술 각도(magic angle) 근처에서 강한 전자 상관관계와 평탄 밴드를 형성하여 초전도, 네마틱 상태 등 다양한 양자 현상을 보입니다. 이러한 물리적 성질은 격자 구조에 극도로 민감합니다.", "motivation": "마술 각도 뒤틀린 이중층 그래핀(MATBG)에서 일축 압력(uniaxial strain)이 물리적 상태를 어떻게 제어하는지 탐구하고자 합니다.", "result": "MATBG에서 거대한 탄성 저항(elastoresistance)을 발견하였으며, 이는 일반적인 금속보다 100배 이상 큽니다. 특정 도핑 영역에서 큐리-바이스 법칙을 따르는 발산 거동을 보였습니다.", "implication": "일축 압력을 통해 모아레 시스템의 네마틱 요동과 전자 엔트로피를 직접 조절할 수 있음을 보여주며, 강상관 전자계의 새로운 제어 도구로 활용 가능합니다.", "novelty": "모아레 시스템에서의 네마틱 요동을 탄성 저항 측정을 통해 직접 관측한 중요한 실험적 성과입니다. 전자-격자 결합이 이 시스템의 상관 물리에서 핵심임을 입증했습니다.", "unresolved": "관측된 탄성 저항의 미세한 기원이 네마틱 요동인지 아니면 단순히 등스핀(isospin) 모멘트의 요동에 의한 것인지에 대한 논쟁이 남아있습니다.", "future_work": "다양한 변형률을 인가한 상태에서의 STM/STS 측정을 통해 국소적인 전자 구조 변화를 관찰하는 실험이 요구됩니다.", "concepts": [{"term": "Elastoresistance (탄성 저항)", "why_emerged": "격자 변형에 따른 전기적 저항의 변화를 측정하여 전자 네마틱성 등을 탐색하기 위해 사용됩니다.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "철계 초전도체의 전자 네마틱성 연구와 연결"}, {"term": "Nematic fluctuations (네마틱 요동)", "why_emerged": "회전 대칭성이 깨지는 현상과 관련하여 전자 시스템의 불안정성을 설명하기 위해 필요합니다.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "큐레이트, 철계 초전도체, 그리고 강상관 계열의 양자 임계점 현상"}], "english_summary": ["Reports giant elastoresistance in magic-angle twisted bilayer graphene.", "Demonstrates that uniaxial strain acts as a powerful tuning parameter for correlated phases.", "Observes Curie-Weiss temperature dependence, suggesting electronic nematic fluctuations.", "Provides evidence that electronic entropy is significantly modulated by lattice strain."]}}, {"title": "A Quantum Many-Body Approach for Orbital Magnetism in Correlated Multiband Electron Systems", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2601.14372", "authors": "Mengxing Ye", "last_authors": "Mengxing Ye", "summary": "Orbital magnetism is a purely quantum phenomenon that reflects intrinsic electronic properties of solids, yet its microscopic description in interacting multiband systems remains incomplete. We develop a general quantum many-body framework for orbital magnetic responses based on the Luttinger--Ward functional. Starting from the Dyson equation, we reformulate the thermodynamic potential in a weak magnetic field and construct a controlled expansion in powers of $B$ applicable to correlated electron systems. A key technical advance is a modified ``Fourier'' representation using noncommutative coordinates, which allows the thermodynamic potential to be expressed in an effective momentum space where the magnetic field acts perturbatively. This formulation makes analytic progress possible within the Moyal algebra. As an application, we derive the spontaneous orbital magnetization for approximations whose skeleton diagrams contain no fermion loop enclosing magnetic flux (e.g., Hartree--Fock, self-consistent RPA, and single-site dynamical mean-field theory). Vertex corrections consistent with the self-energy are included automatically, without a separate diagrammatic analysis, and the result is expressed entirely in terms of the zero-field Hamiltonian renormalized by the self-energy. For frequency-dependent but Hermitian self-energies, we generalize the orbital magnetic moment and Berry curvature to momentum-frequency space and identify two gauge-invariant contributions built from these quantities. For frequency-independent self-energies the result reduces to the familiar geometric formula for noninteracting systems. This framework provides a unified foundation for computing orbital magnetic responses in correlated multiband materials.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Quantum many-body framework for orbital magnetism and Berry curvature in correlated multiband systems.", "tags": ["theory", "stronglycorrelated", "Berrycurvature", "magnetism", "electronicstructure"], "image": "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAsAAAAOCAYAAAD5YeaVAAAAAXNSR0IArs4c6QAAAAZiS0dEAP8A/wD/oL2nkwAAAAlwSFlzAAALEwAACxMBAJqcGAAAAAd0SU1FB9wKExQZLWTEaOUAAAAddEVYdENvbW1lbnQAQ3JlYXRlZCB3aXRoIFRoZSBHSU1Q72QlbgAAAdpJREFUKM9tkL+L2nAARz9fPZNCKFapUn8kyI0e4iRHSR1Kb8ng0lJw6FYHFwv2LwhOpcWxTjeUunYqOmqd6hEoRDhtDWdA8ApRYsSUCDHNt5ul13vz4w0vWCgUnnEc975arX6ORqN3VqtVZbfbTQC4uEHANM3jSqXymFI6yWazP2KxWAXAL9zCUa1Wy2tXVxheKA9YNoR8Pt+aTqe4FVVVvz05O6MBhqUIBGk8Hn8HAOVy+T+XLJfLS4ZhTiRJgqIoVBRFIoric47jPnmeB1mW/9rr9ZpSSn3Lsmir1fJZlqWlUonKsvwWwD8ymc/nXwVBeLjf7xEKhdBut9Hr9WgmkyGEkJwsy5eHG5vN5g0AKIoCAEgkEkin0wQAfN9/cXPdheu6P33fBwB4ngcAcByHJpPJl+fn54mD3Gg0NrquXxeLRQAAwzAYj8cwTZPwPH9/sVg8PXweDAauqqr2cDjEer1  Dong-Hui Xu", "last_authors": "Rui Chen, Dong-Hui Xu", "summary": "Altermagnetism is a collinear compensated magnetic phase with zero net magnetization and momentum-dependent spin polarization. Quasicrystalline altermagnetism extends altermagnetism beyond periodic crystals, with noncrystallographic symmetries allowing high-order spin polarization patterns. Here, we propose a symmetry-based approach to realizing quasicrystalline altermagnetism by twisting collinear magnetic layers. Specifically, we demonstrate that the $30^{\\circ}$-twisted honeycomb lattice bilayers form the dodecagonal quasicrystals supporting an $i$-wave altermagnetic phase. We further find that $45^{\\circ}$-twisted bilayers preserving fourfold rotational symmetry support a mirror-driven $l$-wave phase with eight nodal lines. We characterize these altermagnetic patterns through plane-wave-projected spin-resolved spectral functions and spin-resolved conductances. Our work provides a systematic route to high-angular-order quasicrystalline altermagnetism through twist engineering.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Directly links altermagnetism and moiré systems, highly relevant to topical interest.", "tags": ["altermagnetism", "moiré", "quasicrystals"], "image": "https://arxiv.org/html/2611.20952v1/Fig1.PNG", "briefing": {"background": "알터마그네티즘(Altermagnetism)은 순 자화는 0이지만 운동량 공간에서 스핀 분극이 발생하는 비자성 및 강자성 사이의 새로운 자기 질서입니다. 모아레 초격자는 층간 비틀림을 통해 전자 구조를 정교하게 제어할 수 있는 플랫폼으로 주목받고 있습니다.", "motivation": "결정 격자 내의 주기성을 넘어, 준결정(Quasicrystal) 구조와 모아레 패턴을 결합하여 기존보다 더 높은 각도의 스핀 분극 패턴을 유도할 수 있는지 탐구하고자 합니다.", "result": "30도 비틀린 벌집 격자 이중층에서 12회 대칭성을 가진 준결정을 구현하고, 여기서 i-wave 알터마그네틱 위상을 확인했습니다. 또한 45도 비틀림에서 8개의 노달 라인을 가진 mirror-driven l-wave 위상을 제안했습니다.", "implication": "트위스트 공학(Twist engineering)이 알터마그네틱 위상을 제어하고 새로운 고차 스핀 분극 패턴을 생성하는 강력한 도구가 될 수 있음을 보여줍니다.", "novelty": "기존 결정성 물질에 국한되었던 알터마그네티즘의 개념을 준결정 및 모아레 시스템으로 확장하여, 위상공학적 설계 가능성을 제시했습니다.", "unresolved": "실제 실험적 합성을 통한 모아레 준결정 구조에서의 스핀-분해  spectroscopic evolution across the first-order valence transition is consistently interpreted in terms of the variation of $\\Delta'$.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Relevant to core-level spectroscopy (XPS/XAS) interpretation in strongly correlated rare-earth systems.", "tags": ["photoemission", "correlation", "spectroscopy"], "image": "https://arxiv.org/html/2611.19781v1/Fig1.jpg", "briefing": {"background": "희토류 화합물에서 발생하는 가전자 변동 및 양자 가전자 임계 현상은 강상관 전자계의 핵심 연구 분야입니다. 이를 이해하기 위해 X선 흡수 및 광전자 분광법을 사용하지만, 이론적 파라미터인 전하 이동 에너지(Delta)의 물리적 기원이 명확하지 않았습니다.", "motivation": "분광법에서 사용되는 현상론적 Delta 파라미터와 저에너지 물성 이론의 핵심인 f-d 쿨롱 상호작용(Ufd) 간의 관계를 규명하고자 합니다.", "result": "전하 이동 에너지가 d-전자의 점유도에 의존하는 f-d 쿨롱 상호작용 항을 포함함을 유도했습니다(Delta'). 이를 통해 YbInCu4의 일차 가전자 전이 과정을 성공적으로 해석했습니다.", "implication": "희토류 화합물의 분광 데이터 분석 시, 단순한 전하 이동 에너지가 아닌 가전자 의존적인 물리량을 고려해야 함을 입증했습니다.", "novelty": "현상론적으로만 다루어지던 전하 이동 에너지에 미시적인 f-d 쿨롱 상호작용의 물리적 의미를 부여한 점이 학술적 진보입니다.", "unresolved": "다른 희토류 계열 화합물에서의 보편적 적용 가능성과 d-전자 분포가 복잡한 경우의 정량적 분석.", "future_work": "다양한 Yb, Ce 기반 강상관 시스템의 XPS/XAS 데이터 재해석 및 가전자 전이 물질의 이론적 모델링 고도화.", "concepts": [{"term": "f-d 쿨롱 상호작용", "why_emerged": "국소 f-전자와 전도대 d-전자 간의 상관관계를 기술하기 위해 도입.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "가전자 변동, Kondo 효과, Mott 물성."}, {"term": "가전자 전이", "why_emerged": "온도나 압력에 따라 희토류 이온의 가전자가 비연속적으로 변하는 현상을 이해하기 위해.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "YbInCu4, 양자 임계점, 강상관 금속."}], "english_summary": ["Develops a spectroscopic framework for f-d Coulomb interactions in rare-earth systems.", "Relates empirical charge-transfer energy to f-d Coulomb contributions.", "Successfully interprets the valence transition in YbInCu4 using XAS and XPS data.", "Proposes a modified charge-transfer energy parameter (Delta') for correlated materials."]}}, {"title": "Current-driven chiral RKKY interaction in altermagnets", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2611.19574", "authors": "Anirban Kundu", "last_authors": "Anirban Kundu", "summary": "The Dzyaloshinskii--Moriya (DM) interaction between magnetic moments usually requires spin--orbit coupling and broken inversion symmetry. We show that in a spin-split metal without spin--orbit coupling a charge current generates a DM interaction between localized spins. Using Keldysh Green's functions (GFs) with a drifting Fermi sea, we compute the Ruderman--Kittel--Kasuya--Yosida (RKKY) interaction between two magnetic impurities in a two-dimensional $d$-wave altermagnet with an additional exchange splitting. To linear order in the current, the correction is a Fermi-surface term, and all its components are obtained in closed form in terms of Bessel functions, valid for arbitrary values of the two independent spin splittings, $\\beta$ and $J_\\perp$. The induced DM vector points along the spin-quantization axis, which in the present model is the out-of-plane direction $\\hat{\\mathbf{z}}$. At long distance it decays as $1/R$, one power more slowly than the equilibrium coupling. In the altermagnet it vanishes for bonds along the nodal directions, where the two spin bands are degenerate, and, for a diagonal current, has opposite signs on bonds along the two crystal axes. This $d$-wave signature reverses with the N\\'eel vector and with the current, and distinguishes the altermagnet from a ferromagnet. The current also generates symmetric couplings that are odd in the impurity separation. In low-density two-dimensional conductors, the DM coupling can reach a few percent of the equilibrium exchange.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Theory of altermagnets with direct relevance to transport and magnetic topological materials.", "tags": ["altermagnet", "transport", "RKKY"], "image": "https://arxiv.org/html/2611.19574v1/fig3a.png", "briefing": {"background": "Dzyaloshinskii-Moriya(DM) 상호작용은 일반적으로 강한 스핀-궤도 결합(SOC)과 반전 대칭 파괴가 필수적입니다. 알터마그네트는 이러한 일반적인 조건 없이도 스핀 분극을 가질 수 있는 독특한 자기 구조입니다.", "motivation": "스핀-궤도 결합이 없는 알터마그네트에서 전하 전류가 국소 스핀 간의 DM 상호작용을 어떻게 유도하는지 연구하고자 합니다.", "result": "스핀 분극된 금속에서 전류가 DM 상호작용을 생성함을 보였으며, 이는 전통적인 DM 상호작용과 달리 전류 방향과 닐 벡터에 따라 제어 가능합니다.", "implication": "알터마그네트를 활용하여 외부 전류로 스핀 구조를 능동적으로 제어할 수 있는 새로운 스핀트로닉스 소자 응용 가능성을 열었습니다.", "novelty": "SOC가 없는 상태에서 전류를 통해 DM 상호작용을 생성한다는 점은 매우 이례적이며, 알터마그네트만의 독특한 d-wave 대칭성에 기반한 결과입니다.", "unresolved": "실제 실험에서의 신호 분리(다른 잡음과의 구분) 및 이 효과의 크기가 소자 운용에 충분히 큰지 여부.", "future_work": "알터마그네틱 박막에서의 전류 유도 스핀 토크 측정 및 자성 도메인 제어 실험.", "concepts": [{"term": "RKKY 상호작용", "why_emerged": "금속 내 국소 자성 불순물 간의 상호작용을 매개하는 전도 전자의 역할을 설명하기 위해.", "origin": "Ruderman, Kittel, Kasuya, Yosida (1950년대).", "connections": "스핀 글라스, 거대자기저항(GMR), 알터마그네티즘."}, {"term": "DM 상호작용", "why_emerged": "반강자성체 등에서 나타나는 비대칭적인 스핀 정렬을 설명하기 위해.", "origin": "Dzyaloshinskii (1958), Moriya (1960).", "connections": "카이랄 자성, 스카이르미온, 스핀-궤도 결합."}], "english_summary": ["Demonstrates current-induced DM interaction in altermagnets without spin-orbit coupling.", "Derived using Keldysh Green's functions for a 2D d-wave altermagnet.", "DM interaction scales as 1/R and is tunable by current and Neel vector orientation.", "Provides a mechanism for current-driven spin control distinct from ferromagnets."]}}, {"title": "Electrostatic and magnetic control of the anomalous Josephson phase in ferromagnetic hybrid junctions", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2611.21593", "authors": "D. Rana, O. S. Kurapati, N. Vanjarapu, et al.", "last_authors": "E. Prada, S. Vaitiek\\.{e}nas", "summary": "We report phase-sensitive measurements of Josephson junctions formed in InAs nanowires with epitaxial ferromagnetic EuS and superconducting Al shells. Using a superconducting interferometer, we observe a continuous, hysteretic anomalous phase shift under axial magnetic-field sweeps. A remanent phase bias persists at zero applied field and depends on magnetic history. Electrostatic gating strongly modifies the magnitude of the phase d anomalous Josephson phase in InAs/EuS/Al hybrid nanowire junctions.", "Demonstrated gate-tunable control of the anomalous phase via the Rashba spin-orbit coupling.", "Exhibited hysteretic magnetic phase control linked to the ferromagnet's remanence.", "Establishes a platform for electrostatically modulating topological phases in 1D systems."]}}, {"title": "Excitonic magnetism and competing valence bond solid instabilities in d4 ruthenium compounds", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2611.20682", "authors": "Aleksandra Krajewska, Tomohiro Takayama, Hidenori Takagi", "last_authors": "Tomohiro Takayama, Hidenori Takagi", "summary": "Spin-orbit entangled $d^4$ Mott insulators serve as a rich playground for unconventional magnetism and competing quantum electronic ground states. Intra-ionic spin-orbit coupling $\\lambda_{\\rm{SOC}}$ generates a non-magnetic $J_{\\rm{eff}} = 0$ singlet ground state separated from an excited $J_{\\rm{eff}} = 1$ triplet. The effective intra-atomic gap ${\\Delta}_{\\rm{eff}}$ between the ground state and lowest excited state is determined by $\\lambda_{\\rm{SOC}}$ and non-cubic crystal field ${\\Delta}_{\\rm{cf}}$. The intersite magnetic exchange $J_{\\rm{ex}}$ induces dispersion of the excited $J_{\\rm{eff}} = 1$ triplet. When the triplet bandwidth $W_{\\rm{t}}$ overcomes ${\\Delta}_{\\rm{eff}}$, the system undergoes long-range magnetic ordering which is viewed as a condensation of spin-orbit excitons and called excitonic magnetism. In this review, we systematically survey representative $d^4$ ruthenium compounds across four distinct structural connectivities of Ru-ligand octahedra, from K$_2$RuCl$_6$ with isolated octahedra, corner-sharing perovskite Ca$_2$RuO$_4$, edge-sharing honeycombs, to corner-sharing pyrochlores, and map them onto a conceptual parameter axis of $W_{\\rm{t}} / {\\Delta}_{\\rm{eff}}$. We demonstrate that $d^4$ ruthenium compounds not only represent evolution from a $J_{\\ onse vanishes for an ideal nonpolar reference. The stored polarization is read out as a reversal of sign and not as a difference of current. Sweeping the field is a second route to the same parity. In the ideal symmetric limit the transconductance passes through zero at the field that cancels the polarization, 1.07 V/nm, at a single temperature. Both routes are limited by the symmetry of the device more than by the band structure. Stacking also renormalizes the landscape, so the polar one is not a translated copy of the nonpolar reference. Absolute offsets follow the exchange-correlation functional. The symmetry relations do not.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Direct relevance to valley physics in transition metal dichalcogenide bilayers.", "tags": ["TMD", "bandstructure", "ferroelectric"], "image": "https://arxiv.org/html/2611.19705v1/figure1.png", "briefing": {"background": "전이금속 디칼코게나이드(TMD) 이중층에서의 계곡(valley) 자유도는 정보를 저장하고 처리하는 새로운 도구로 주목받고 있으며, 특히 층간 적층 구조에 따른 대칭성 제어가 핵심 과제입니다.", "motivation": "WSe2 이중층에서 강유전성 적층 구조(R-stacking)가 대칭성을 파괴하여 계곡 전자 구조를 어떻게 재구성하고 제어할 수 있는지 규명하고자 했습니다.", "result": "R-적층 구조가 K-계곡에서의 층간 터널링을 완전히 차단하고, 강유전성 분극에 의해 K-계곡의 이중항이 분리되는 현상을 확인했습니다.", "implication": "외부 전기장(변위장)만으로 계곡의 전자 구조를 스위칭하거나 제어할 수 있는 고효율 계곡 전자 소자 구현의 길을 열었습니다.", "novelty": "적층 방식에 의한 대칭성 파괴가 물리적 장벽(tunneling)을 만드는 원리를 규명하고, 이를 통한 계곡 에너지 레벨의 가역적 제어를 증명했습니다.", "unresolved": "이상적인 대칭성 한계와 실제 소자의 비균일성 사이의 차이를 완전히 메우기 위한 재료의 결함 제어가 과제로 남았습니다.", "future_work": "강유전성 적층을 활용한 계곡 편극(valley polarization) 소자 제작 및 광학적 측정을 통한 계곡 간 이동 시간 단축 연구가 기대됩니다.", "concepts": [{"term": "Valley landscape", "why_emerged": "TMD의 에너지 밴드에서 서로 다른 계곡(K, Γ 등)의 에너지 위치를 공간적으로 묘사하기 위해 필요합니다.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "Berry curvature, transition metal dichalcogenides, valleytronics"}, {"term": "R-stacking (Rhombohedral)", "why_emerged": "이중층 구조에서 층간 대칭성을 깨어 독특한 밴드 토폴로지를 유도하기 위해 설정되는 적층 방식입니다.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "Moire physics, ork opens an avenue toward compact, monolithic transverse thermopiles capable of volt-scale generation free from interfacial parasitic dissipation.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Experimental realization of Nernst effect in Weyl ferromagnet Co2TiGe, relevant to topological semimetals.", "tags": ["experiment", "Weylsemimetal", "topological"], "image": "https://arxiv.org/static/browse/0.3.4/images/arxiv-logo-fb.png", "briefing": {"background": "위상적 자기 물질에서 나타나는 비정상 네른스트 효과(ANE)는 온도 구배로부터 수직한 방향으로 전압을 생성할 수 있어 차세대 열전 소자로 주목받고 있습니다. 기존에는 n형과 p형 재료를 금속 연결재로 이어야 하는 복잡한 구조가 필수적이었으나, 이는 열 손실과 집적도 저하를 야기했습니다.", "motivation": "금속 연결재 없이도 n-p 접합과 유사하게 전압을 쌓을 수 있는 '양극성 비정상 네른스트 효과(BANE)' 패러다임을 제안하고, 이를 구현할 수 있는 물질을 탐색하고자 했습니다.", "result": "머신러닝 기반 스크리닝을 통해 249개의 BANE 후보 물질을 발굴하였으며, 그중 Weyl 강자성체인 Co2TiGe 단결정을 통해 약 225K에서 비정상 네른스트 신호의 부호가 반전되는 현상을 실험적으로 확인했습니다.", "implication": "금속 인터커넥트 없이도 전압을 대폭 증폭시킬 수 있는 일체형 횡방향 열전 모듈 설계가 가능해지며, 고집적 고효율 열전 소자 개발의 새로운 이정표가 될 것입니다.", "novelty": "플랫 밴드와 Weyl 노드의 상호작용에 의한 화학 퍼텐셜 이동이 Mott 관계식을 통해 네른스트 신호의 극성 반전을 유도한다는 점을 이론 및 실험적으로 입증하였습니다.", "unresolved": "상온 근처에서 극성 반전이 발생하는 Co2TiGe의 정확한 전자 구조 변화와 다양한 온도 범위에서의 전송 현상 간의 정량적 상관관계가 추가로 규명되어야 합니다.", "future_work": "발굴된 다른 BANE 물질들의 합성 및 성능 최적화, 그리고 이를 활용한 실제 볼트 단위 출력 열전 발전기의 소자 구현이 예상됩니다.", "concepts": [{"term": "비정상 네른스트 효과 (ANE)", "why_emerged": "강자성체 등에서 자화에 의해 발생하는 횡방향 열전 현상을 활용하여 열 에너지를 전기로 변환하기 위해 필요합니다.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "비정상 홀 효과(AHE), 베리 곡률(Berry Curvature)"}, {"term": "Weyl 강자성체", "why_emerged": "위상적 밴드 구조와 강자성 질서가 공존하여 거대한 비정상 홀 효과와 네른스트 효과를 나타내기 위해 필요합니다.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "위상 반금속, 베리 곡률, 자성 위상 물질"}, {"term": "Mott 관계식", "why_emerged": "열전 계수와 전기 전도도 사이의 열역학적 관계를 이해하여 페르미 준위 근처의 전자 상태 밀도 변화를 추론하기 위해 필요합니다.", "origin": "Nevill Mott", "connections": "Seebeck 효과, 전도도 텐서"}], "english_summary": ["Proposed a bipolar anomalous Nernst effect (BANE) paradigm to eliminate metallic interconnects in thermopiles.
