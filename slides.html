<title>Daily Paper Slideshow</title>
<style>
  :root {
    color-scheme: light;
    --bg: #f6f7f4;
    --paper: #ffffff;
    --ink: #111827;
    --muted: #64748b;
    --line: #d8ddd2;
    --accent: #176b87;
    --accent-2: #9a3412;
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; overflow: auto; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: var(--bg); color: var(--ink); }
  .shell { max-width: 1500px; min-height: 100vh; margin: 0 auto; padding: 14px 18px; display: flex; flex-direction: column; }
  .topbar { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 16px; }
  .top-actions { display: flex; align-items: center; gap: 10px; }
  .topbar a, button { border: 1px solid var(--line); border-radius: 8px; background: var(--paper); color: var(--ink); padding: 10px 14px; font-weight: 700; text-decoration: none; cursor: pointer; }
  button.primary { background: var(--accent); border-color: var(--accent); color: white; }
  button:disabled { opacity: 0.45; cursor: not-allowed; }
  .counter { color: var(--muted); font-weight: 700; }
  .slide { min-height: calc(100vh - 82px); background: var(--paper); border: 1px solid var(--line); border-radius: 10px; padding: 18px; box-shadow: 0 18px 42px rgba(15, 23, 42, 0.10); display: grid; grid-template-columns: minmax(310px, 0.86fr) minmax(0, 1.55fr); gap: 18px; overflow: visible; }
  .paper-head { min-width: 0; min-height: 0; overflow: visible; display: flex; flex-direction: column; gap: 12px; }
  .figure { margin: 0; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: #f8fafc; }
  .figure img { display: block; width: 100%; max-height: 41vh; object-fit: contain; background: white; }
  .figure figcaption { padding: 7px 10px; color: var(--muted); font-size: 12px; line-height: 1.3; }
  .head-text { display: flex; flex-direction: column; gap: 9px; min-width: 0; }
  .badges { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .badge { border-radius: 999px; padding: 5px 9px; background: #eef2ff; color: #3730a3; font-size: 12px; font-weight: 800; }
  .score { background: #fee2e2; color: #991b1b; }
  h1 { margin: 0; font-size: 25px; line-height: 1.15; letter-spacing: 0; overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
  h1 a { color: inherit; text-decoration-color: rgba(23, 107, 135, 0.35); text-decoration-thickness: 2px; text-underline-offset: 4px; }
  h1 a:hover { color: var(--accent); text-decoration-color: var(--accent); }
  .meta, .authors, .why, .abstract { font-size: 13px; line-height: 1.45; }
  .meta, .authors { color: var(--muted); }
  .why strong, .abstract strong, .authors strong { color: var(--ink); }
  .authors { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .why { border-left: 4px solid var(--accent-2); padding-left: 10px; color: #374151; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .abstract { border-top: 1px solid var(--line); padding-top: 14px; color: #374151; }
  .original-abstract { border-top: 1px solid var(--line); padding-top: 10px; color: #374151; font-size: 11.5px; line-height: 1.35; overflow-wrap: anywhere; }
  .original-abstract strong { display: block; margin-bottom: 4px; color: var(--ink); }
  .tags { display: flex; flex-wrap: wrap; gap: 8px; }
  .tag { border-radius: 999px; padding: 4px 8px; background: #f1f5f9; color: #475569; font-size: 12px; font-weight: 700; }
  .head-text > .link { display: none; }
  .briefing { min-width: 0; min-height: 0; overflow: visible; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); grid-auto-rows: minmax(0, auto); align-content: start; gap: 11px 18px; border-top: 0; padding-top: 0; }
  .brief-section { min-width: 0; }
  .brief-section.wide { grid-column: 1 / -1; }
  .brief-section h2 { margin: 0 0 4px; font-size: 14px; line-height: 1.22; color: #0f766e; letter-spacing: 0; }
  .brief-section p, .brief-section li { margin: 0; font-size: 12.5px; line-height: 1.42; color: #1f2937; overflow-wrap: anywhere; }
  .brief-section ul { margin: 0; padding-left: 20px; }
  .concepts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 9px 14px; }
  .concept { border-top: 1px solid var(--line); padding-top: 7px; }
  .concept h3 { margin: 0 0 4px; font-size: 13px; color: #7c2d12; letter-spacing: 0; }
  .concept p { margin: 2px 0 0; font-size: 11.5px; line-height: 1.35; color: #374151; overflow-wrap: anywhere; }
  .concept b { color: #111827; }
  .link { color: var(--accent); font-weight: 800; text-decoration: none; }
  .empty { padding: 48px; background: var(--paper); border: 1px solid var(--line); border-radius: 12px; color: var(--muted); }
  @media (max-width: 860px) {
    .shell { padding: 14px; }
    .topbar, .top-actions { align-items: stretch; flex-direction: column; }
    .slide, .briefing, .concepts { grid-template-columns: 1fr; }
    .slide { min-height: auto; overflow: visible; display: grid; }
    h1 { font-size: 28px; }
  }
</style>

<script>
const slides = [{"title": "Electronic Origin of Delicate Antiferromagnetism in FexNbS2", "journal": "PRL_Recent", "source": "author whitelist", "link": "http://link.aps.org/doi/10.1103/99yr-nqbx", "authors": "Wenxin Li, Jonathan T. Reichanadter, Shan Wu, et al.", "last_authors": "Jeffrey B. Neaton, Yu He", "summary": "Author(s): Wenxin Li, Jonathan T. Reichanadter, Shan Wu, Ji Seop Oh, Rourav Basak, Shannon C. Haley, Siqi Wang, Joshua E. Chaparro Mata, Elio Vescovo, Donghui Lu, Makoto Hashimoto, Christoph Klewe, Suchismita Sarker, Jessica L. McChesney, Alex Frañó, James G. Analytis, Robert J. Birgeneau, Jeffrey B. Neaton, and Yu He A combination of ARPES, XAS, and DFT shows a dramatic eV-scale electronic restructuring in Fe x NbS 2 , similar to what happens in correlated oxides, and suggests electronic correlations play a central role in the magnetism of Fe-intercalated transition-metal dichalcogenides. [Phys. Rev. Lett. 136, 216503] Published Wed May 27, 2026", "tier": "A_MUST_READ", "score": "10", "reason": "author whitelist: Donghui Lu", "tags": ["ARPES", "STS", "correlated", "ferromagnet", "antiferromagnet"], "image": "", "briefing": {"background": "Fe가 삽입된 전이금속 디칼코게나이드(TMDC) 화합물은 자성과 전자 상관관계가 복잡하게 얽혀 있는 물질계입니다. 이 계열은 강자성이나 반강자성 상태를 보이며, 전자 구조의 변화가 물리적 특성을 결정짓는 핵심 기제로 작용합니다.", "motivation": "Fe_xNbS_2에서 나타나는 반강자성 특성이 어떻게 전자 구조의 재구성과 연결되는지, 특히 강상관계 물질에서 보이는 전자 구조 변화와 유사성이 있는지 확인하고자 했습니다.", "result": "ARPES와 XAS 및 DFT 계산을 통해 eV 규모의 상당한 전자 구조 재구성을 확인했습니다. 이는 Fe 삽입이 단순히 격자 왜곡에 그치는 것이 아니라, 강상관계 산화물과 유사한 전자 상관관계의 핵심적 역할을 수행함을 시사합니다.", "implication": "TMDC 계열에서도 강상관계 물질과 유사한 물리적 기제를 찾아냈다는 점은, 향후 유사한 전이금속 화합물에서 상관관계 기반의 자성 제어를 연구할 수 있는 중요한 물리적 근거를 제공합니다.", "novelty": "ARPES와 STS 등의 직접적인 전자 구조 관찰을 통해 Fe_xNbS_2의 자성 기원이 단순한 밴드 모델을 넘어선 강한 전자 상관관계에 있음을 밝혀내었으며, 귀하의 주관심사인 상관관계 전자계 연구에 중요한 데이터포인트입니다.", "unresolved": "전자 상관관계가 구체적으로 어떤 미시적 파라미터(예: Hubbard U)에 의해 자성을 안정화하는지에 대한 정량적 상세 기제는 추가 연구가 필요합니다.", "future_work": "다양한 Fe 도핑 농도에 따른 전자 구조 진화의 체계적인 매핑과, STS를 이용한 국소 상태 밀도와 자성 발현 사이의 연관성 연구가 기대됩니다.", "concepts": [{"term": "Electronic Correlation", "why_emerged": "금속 내 전자들이 독립적이지 않고 서로 상호작용할 때 발생하는 물리 현상을 설명하기 위해 도입되었습니다.", "origin": "Mott 등에 의해 초기 이론이 정립되었습니다.", "connections": "Hubbard 모델, Mott 절연체, 고온 초전도체 연구와 밀접합니다."}, {"term": "Fe-intercalated TMDC", "why_emerged": "반데르발스 층 사이의 빈 공간에 전이금속을 삽입하여 물성을 제어하기 위해 고안되었습니다.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "층상 물질의 자성/초전도성 제어 연구."}], "english_summary": ["Fe_xNbS_2 shows eV-scale electronic restructuring via ARPES/XAS/DFT.", "Results suggest electronic correlations drive magnetism in Fe-intercalated TMDCs.", "Evidence points to physics similar to correlated oxides rather than simple itinerant magnetism.", "Provides a foundation for controlling magnetic properties in 2D-layered materials via correlation effects."]}}, {"title": "Symmetry-Broken Ground State and Phonon-Mediated Superconductivity in Kagome CsV3Sb5", "journal": "PRL_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/4r8x-j3nd", "authors": "Manex Alkorta, Martin Gutierrez-Amigo, Đorđe Dangić, et al.", "last_authors": "Maia G. Vergniory, Ion Errea", "summary": "Author(s): Manex Alkorta, Martin Gutierrez-Amigo, Đorđe Dangić, Chunyu Mark Guo, Philip J. W. Moll, Maia G. Vergniory, and Ion Errea The newly discovered family of nonmagnetic kagome metals ${\\mathrm{AV}}_{3}{\\mathrm{Sb}}_{5}$ ($\\mathrm{A}=\\mathrm{K}$, Rb, or Cs) provides a unique platform for exploring the interplay between charge-density wave (CDW) order, superconductivity, nontrivial topology, and spontaneous time-reversal sym… [Phys. Rev. Lett. 136, 206401] Published Fri May 22, 2026", "tier": "A_MUST_READ", "score": "10", "reason": "Direct hit: Kagome metal CsV3Sb5, CDW, superconductivity, and TRSB.", "tags": ["kagomemetals", "CsV3Sb5", "CDW", "superconductivity", "time-reversalsymmetrybreaking", "phonon", "unconventionalsuperconductivity"], "image": "", "briefing": {"background": "Kagome 금속 AV_3Sb_5 (A=K, Rb, Cs)는 전하밀도파(CDW), 초전도성, 위상적 특성이 공존하는 계로, 최근 응집물질물리학의 가장 뜨거운 화두 중 하나입니다.", "motivation": "이 물질계에서 관측되는 CDW 상태와 초전도성 사이의 상호작용, 그리고 자발적 시간 반전 대칭성 깨짐(TRSB)의 미시적 기원을 이해하고자 했습니다.", "result": "대칭성 깨짐을 동반한 바닥 상태와 포논 매개 초전도성의 연관성을 분석했습니다. CDW와 위상적 성질이 물질의 초전도성에 미치는 영향을 이론적/계산적 기법으로 규명했습니다.", "implication": "이러한 물질계에서의 초전도성은 단순한 BCS 이론을 넘어 위상적 질서와 CDW가 결합된 복합적인 양상임을 시사하며, 비전통적 초전도성 연구의 새로운 모델이 됩니다.", "novelty": "귀하의 주요 관심사인 Kagome 금속에서의 TRSB와 CDW의 상관관계를 다루며, 포논 매개 기제에 초점을 맞춰 초전도성을 재해석했다는 점에서 매우 중요한 참고 자료입니다.", "unresolved": "실험적으로 관측되는 TRSB의 구체적인 형태와 포논-전자 결합이 위상적 밴드 구조를 어떻게 수정하는지에 대한 정량적 합의는 여전히 논쟁적입니다.", "future_work": "포논과 CDW의 상호작용을 직접적으로 관측할 수 있는 고해상도 RIXS 혹은 극저온에서의 ARPES 측정이 필수적입니다.", "concepts": [{"term": "Kagome Lattice", "why_emerged": "기하학적 좌절(frustration)이 풍부한 전자 구조를 설계하기 위해 도입되었습니다.", "origin": "수학적인 패턴으로서의 기원은 일본의 바구니 짜기 전통에서 유래했습니다.", "connections": "디락 점(Dirac points), 평탄 밴드(flat bands), 위상적 절연체."}, {"term": "Time-Reversal Symmetry Breaking (TRSB)", "why_emerged": "자기적 질서가 없어도 나타나는 위상적 현상을 설명하기 위해 도입되었습니다.", "origin": "반강자성이나 카이랄 질서 등 다양한 물리적 기원으로 설명됩니다.", "connections": "홀 효과(Hall effect), 카이랄 초전도체, Berry 곡률."}], "english_summary": ["Examines the interplay of CDW, superconductivity, and TRSB in AV_3Sb_5 kagome metals.", "Probes phonon-mediated superconductivity in the presence of broken symmetry ground states.", "Highlights the unique electronic platform provided by kagome geometry.", "Connects topological features with unconventional superconducting phases."]}}, {"title": "Berry-Curvature Activation by Orbital Flux in a Kagome Altermagnet", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2606.04984", "authors": "Meysam Bagheri Tagani, Carmine Autieri", "last_authors": "Meysam Bagheri Tagani, Carmine Autieri", "summary": "arXiv:2606.04984v1 Announce Type: new Abstract: We investigate topological electronic responses in a kagome altermagnetic metal hosting a compensated coplanar $120^\\circ$ magnetic texture. Using a minimal tight-binding model incorporatin link.aps.org/doi/10.1103/ycfy-kbxj", "authors": "Francisco Meirinhos, Michael Turaev, Michael Kajan, Tim Bode, Johann Kroha", "last_authors": "Tim Bode, Johann Kroha", "summary": "Author(s): Francisco Meirinhos, Michael Turaev, Michael Kajan, Tim Bode, and Johann Kroha We provide a theoretical framework to describe the nonequilibrium temporal dynamics of correlated electron systems for realistic system parameters and the consequent, often exponentially long timescales. It is based on an entirely integrodifferential formulation of time-dependent dynamical mean-fiel… [Phys. Rev. Lett. 136, 216502] Published Tue May 26, 2026", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Theoretical study of Kondo dynamics in heavy fermions, relevant to ultrafast experiments and DMFT.", "tags": ["heavyfermion", "Kondoeffect", "stronglycorrelated", "ultrafastphysics", "DMFT", "theory"], "image": "", "briefing": {"background": "강상관계 전자계(Heavy Fermion)는 전자 간 강한 쿨롱 상호작용으로 인해 비통상적인 저에너지 물성을 보이며, 이를 이해하기 위해 평형 상태뿐만 아니라 비평형 동역학 연구가 필수적입니다.", "motivation": "테라헤르츠 펌프를 이용한 강상관계 물질의 동역학 연구를 위해, 신뢰도 높은 시간 의존적 이론 프레임워크를 정립하고자 합니다.", "result": "적분 미분 방정식을 기반으로 한 시간 의존적 동적 평균장 이론(td-DMFT) 프레임워크를 개발하여 강상관계 전자계의 장기적인 시간 동역학을 기술합니다.", "implication": "초고속 분광학(Ultrafast spectroscopy) 실험 데이터를 이론적으로 해석할 수 있는 강력한 도구를 제공하여 DMFT 기반의 강상관계 이론을 확장합니다.", "novelty": "강상관계 시스템에서 나타나는 비평형 상태의 매우 긴 시간 척도를 계산 가능하게 만든 이론적 진전입니다.", "unresolved": "이 프레임워크가 모든 종류의 강상관계 물질(예: Kondo 격자 외 시스템)에 범용적으로 적용되는지는 추가 검증이 필요합니다.", "future_work": "실제 초고속 펌프-프로브 실험 데이터와 이론 계산 결과의 직접적인 비교.", "concepts": [{"term": "시간 의존적 DMFT", "why_emerged": "강상관계 시스템의 비평형 시간 동역학을 계산하기 위해 기존 정적 DMFT를 확장.", "origin": "Georges et al. (1996)의 DMFT 기반 확장.", "connections": "비평형 통계역학, 강상관계 전자계."}, {"term": "콘도 에코", "why_emerged": "강상관계 시스템에서 펌프 이후 응답이 특정 시간 뒤에 다시 나타나는 현상을 기술하기 위해 필요.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "양자 결맞음, 스핀 역학."}], "english_summary": ["Presents a theoretical framework for non-equilibrium dynamics in correlated d": "선형 응답만으로는 포착하기 어려운 대칭성 파괴 정보를 얻기 위해 필요.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "비선형 홀 효과, 제2고조파 발생(SHG)."}], "english_summary": ["Altermagnets possess spin-split bands despite net zero magnetization.", "The paper investigates the nonlinear optomagnetic response of d-wave altermagnets.", "Proposed optical signatures serve as a probe for identifying altermagnetic states.", "This work provides a framework for optical control and detection in altermagnetic spintronics."]}}, {"title": "Confined growth of armchair MoS 2 nanotubes at the 1-nm limit", "journal": "Science", "source": "Gemini", "link": "https://doi.org/10.1126/science.aee3446", "authors": "Yusuke Nakanishi, Ryosuke Senga, Shinpei Furusawa, et al.", "last_authors": "Yasumitsu Miyata, Kazu Suenaga", "summary": "Atomically thin nanotubes of semiconducting transition metal dichalcogenides offer a platform for exploring quantum phenomena at the one-dimensional limit and for realizing nanoscale transistor channels. However, conventional syntheses produce only large-diameter (>10 nm), multiwalled tubes with uncontrolled chiralities. We report the synthesis of single-walled molybdenum disulfide (MoS 2 ) nanotubes with diameters approaching 1 nm, achieved through spatially confined reactions inside boron nitride (BN) nanotubes. The confined geometry stabilizes otherwise inaccessible, highly strained MoS 2 nanotubes, yielding structurally well-defined armchair configurations. Their bandgaps shrink systematically with decreasing diameter, in accordance with long-standing theoretical predictions. The insulating BN sheath simultaneously provides an intrinsic gate-all-around architecture, thereby promising access to truly nanoscale transistor channels.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Materials science on 1D MoS2 nanotubes for quantum phenomena and nanoscale electronics.", "tags": ["material", "1Dmaterials", "MoS2", "nanotubes", "electronicstructure"], "image": "", "briefing": {"background": "전이금속 디칼코게나이드(TMD)는 층상 구조 물질로, 이를 1차원 나노튜브 형태로 합성하면 독특한 양자 구속 효과와 전자 구조 변화를 유도할 수 있어 차세대 전자 소자 후보로 꼽힙니다.", "motivation": "기존의 나노튜브 합성법으로는 제어 불가능한 다중벽 구조나 큰 직경만 얻을 수 있어, 1nm 수준의 단일벽 나노튜브를 정밀하게 합성하고자 했습니다.", "result": "BN 나노튜브를 템플릿(공간 제한)으로 사용하여 1nm 직경의 단일벽 MoS2 나노튜브 합성에 성공했습니다.", "implication": "구조적으로 정의된 1차원 반도체 채널을 확보함으로써, 이론으로만 예측되던 직경에 따른 밴드갭 변화를 실험적으로 확인하고 나노 트랜지스터를 구현할 수 있습니다.", "novelty": "공간 제어 기술을 통해 기존에는 불안정하여 존재할 수 없었던 고도로 변형된 MoS2 구조를 안정화시켰다는 점이 핵심입니다.", "unresolved": "대량 생산 가능성 및 실제 장치 내에서의 이동도(mobility) 측정 등 전기적 특성 평가는 추가 연구가 필요합니다.", "future_work": "다양한 TMD 물질로의 확장 및 해당 나노튜브를 이용한 실제 트랜지스터 소자 성능 최적화.", "concepts": [{"term": "공간 제한 성장(Confined growth)", "why_emerged": "나노 규모에서 안정하지 않은 구조를 합성하기 위한 물리적 가이드가 필요함.", "origin": "탄소 나노튜브 연구 초기부터 활용됨.", "connections": "반데르발스 이질접합, 나노튜브 합성."}, {"term": "MoS2", "why_emerged": "실리콘을 대체할 수 있는 2차원 반도체 물질로서의 가치 때문.", "origin": "오래전부터 알려진 광물이나, 2010년대 전후로 2D 소재로 주목받음.", "connections": "TMD, 밴드갭 엔지니어링."}], "english_summary": ["Synthesis of single-walled MoS2 nanotubes with diameters near 1 nm.", "Utilized boron nitride nanotubes as templates for spatial confinement.", "Confirmed diameter-dependent bandgap tuning as predicted by theory.", "The BN sheath provides an ideal gate-all-around architecture for nanoscale transistors."]}}, {"title": "Symmetry-locked six-state control of altermagnetism via sliding ferroelectricity", "journal": "Science_Advances", "source": "Gemini", "link": "https://doi.org/10.1126/sciadv.aec5229", "authors": "Wei Sun, Wenxuan Wang, Changhong Yang, Shifeng Huang, Zhenxiang Cheng", "last_authors": "Shifeng Huang, Zhenxiang Cheng", "summary": "Altermagnetic multiferroics offer a promising route to low-power spintronics by enabling spin splitting without net magnetization, extending beyond conventional spin-orbit coupling. However, achieving deterministic electric control has remained elusive. Here, a six-state platform for high-dimensional magnetoelectric coupling in altermagnets is established by exploiting the nondegenerate transition paths of sliding ferroelectrics as a symmetry-engineering knob, thereby transcending the conventional binary (up/down) paradigm of sliding ferroelectricity. First-principles calculations on bilayer manganese phosphorus trisulfide reveal a spin-polarization symmetry-locking mechanism. Polarization switching along the three nondegenerate paths not only reverses the spin splitting but also rotates its spin-splitting texture in 120° increments, yielding six nonvolatile, electrically addressable altermagnetic states. Furthermore, direct correspondence is established between the spin-splitting texture and the nonlinear Hall response, providing unique electrical fingerprints for each state. This work establishes a paradigm for electric field–driven reconstruction of momentum-space spin geometry, providing a versatile platform for controlling quantum phenomena in altermagnetic spintronics.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Directly relevant to altermagnetism, anomalous Hall, and magnetic materials, with experimental implications.", "tags": ["altermagnetism", "spintronics", "multiferroic", "anomalousHall", "theory", "MnPS3"], "image": "", "briefing": {"background": "알터마그네틱 물질은 전력을 적게 소모하면서도 높은 성능을 낼 수 있는 차세대 스핀트로닉스 소자로 주목받고 있으며, 외부 필드를 통해 자기 상태를 제어하는 것이 핵심 과제입니다.", "motivation": "알터마그네틱 상태를 전기적으로 결정론적(deterministic)으로 제어하기 위해, 슬라이딩 강유전체(sliding ferroelectricity)라는 메커니즘을 결합하려 했습니다.", "result": "MnPS3 이중층 물질에서 슬라이딩 강유전체를 통해 6가지의 비휘발성 알터마그네틱 상태를 스위칭할 수 있음을 이론적으로 증명했습니다.", "implication": "전기장을 통해 스핀 분리 텍스처를 회전시키고 이를 홀 응답으로 읽어냄으로써, 다진법(multi-state) 메모리 및 로직 소자의 가능성을 제시합니다.", "novelty": "단순 '켜짐/꺼짐'의 2진법 제어를 넘어 120도 회전 대칭성을 활용한 다중 상태 제어를 구현했다는 점이 독보적입니다.", "unresolved": "실제 실험적인 샘플에서의 스위칭 안정성, 극저온 또는 상온에서의 구동 가능성 등에 대한 실험적 증거는 아직 부족합니다.", "future_work": "실제 MnPS3 등을 이용한 소자 제작 및 전기적 저항 측정(비선형 홀 응답 확인)을 통한 검증.", "concepts": [{"term": "슬라이딩 강유전체", "why_emerged": "반데르발스 층상 구조에서 층간 이동에 의한 분극 현상을 제어하기 위해 등장.", "origin": "최근 2D 물질 연구 분야에서 활발히 정의됨.", "connections": "스핀-궤도 토크, 반데르발스 이질구조."}, {"term": "비선형 홀 응답", "why_emerged": "기존 홀 효과가 나타나지 않는 물질에서 대칭성 정보를 추출하기 위함.", "origin": "이론적으로는 오래되었으나 최근 알터마그네틱 연구에서 핵심 지표로 사용.", "connections": "Berry 곡률, 스핀 텍스처."}], "english_summary": ["Proposes a six-state control mechanism for altermagnetism in bilayer MnPS3.", "Utilizes sliding ferroelectricity to switch spin-splitting textures via electric fields.", "Establishes a correspondence between spin-splitting states and nonlinear Hall response.", "Provides a foundation for multi-state altermagnetic spintronics devices."]}}, {"title": "Critical Berezinskii-Kosterlitz-Thouless dynamics in the archetypal two-dimensional spin system Ba2CuSi2O6Cl2", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/bhxh-74xx", "authors": "K. M. Ranjith, Maxime Dupont, Steffen Krämer, et al.", "last_authors": "Hidekazu Tanaka, Mladen Horvatić", "summary": "Author(s): K. M. Ranjith, Maxime Dupont, Steffen Krämer, Sylvain Capponi, Edmond Orignac, Nicolas Laflorencie, Nobuyuki Kurita, Hidekazu Tanaka, and Mladen Horvatić We study the spin dynamics in the quasi-2D spin-$1/2$ dimer compound ${\\mathrm{Ba}}_{2}{\\mathrm{CuSi}}_{2}{\\mathrm{O}}_{6}{\\mathrm{Cl}}_{2}$, which exhibits a magnetic field-induced Bose-Einstein condensate (BEC) of triplons. Using nuclear magnetic resonance spin-lattice relaxation rate (${T}_{1}^{−… [Phys. Rev. B 113, 224409] Published Tue Jun 02, 2026", "tier": "B_IMPORTANT_CONDMAT", "score": "7", "reason": "High-quality experimental study on a low-dimensional quantum magnet.", "tags": ["magnetism", "experiment"], "image": "", "briefing": {"background": "2차원 양자 자성체에서 저온의 위상적 물리 현상을 이해하는 것은 응집물질물리에서 중요한 주제입니다. 특히 베레진스키-코스털리츠-사울레스(BKT) 전이는 2차원 시스템에서 대칭성 깨짐 없이도 위상적 결함(보텍스)의 결합을 통해 상전이가 일어나는 독특한 메커니즘을 제공합니다.", "motivation": "본 연구는 2차원 스핀-1/2 이량체 화합물인 Ba2CuSi2O6Cl2가 자기장 하에서 트립론(triplon) 보스-아인슈타인 응축(BEC) 상태를 보인다는 점에 착안하여, 이 시스템에서의 임계 동역학 특성을 규명하고자 했습니다.", "result": "핵자기공명(NMR)을 통한 스핀-격자 이완율 측정을 통해, 해당 물질의 임계 영역에서 BKT 물리학이 지배하는 스핀 동역학적 특성을 실험적으로 확인하였습니다.", "implication": "2차원 양자 자석에서 단순한 자기적 정렬을 넘어 위상적 상전이와 관련된 동역학적 특징이 실제로 어떻게 구현되는지에 대한 명확한 실험적 증거를 제시합니다.", "novelty": "실제 실험 물질(Ba2CuSi2O6Cl2)에서 BKT 유형의 임계 현상을 검증했다는 점이 중요하며, 이는 저차원 양자 자성체 연구의 실험적 정밀도를 높이는 데 기여합니다.", "unresolved": "이 시스템에서 나타나는 특정 파라미터 영역에서의 편차나 다른 2차원 자성체와의 정량적 차이에 대한 이론적 완결성은 여전히 보완이 필요합니다.", "future_work": "더 넓은 자기장 및 온도 영역에서의 정밀한 중성자 산란 연구를 통해 트립론의 분산 관계를 직접 확인하는 작업이 기대됩니다.", "concepts": [{"term": "BKT 전이", "why_emerged": "Mermin-Wagner 정리에 의해 2차원에서는 장거리 질서가 형성될 수 없으나, 실제 실험에서 위상적 상전이가 관측됨에 따라 도입되었습니다.", "origin": "V. Berezinskii (1970), J. Kosterlitz and D. Thouless (1973).", "connections": "2차원 XY 모델, 초유체 필름, 보텍스-반보텍스 쌍."}, {"term": "트립론 보스-아인슈타인 응축", "why_emerged": "양자 이량체 시스템의 스핀 들뜸(triplet)이 자기장에서 에너지가 낮아져 응축될 수 있다는 이론이 제시되었습니다.", "origin": "T. Giamarchi, C. Rüegg, O. Tchernyshyov (2008) 등.", "connections": "양자 위상 상전이, 스핀-액체 상태, 112 telluride 등 관련 자성 재료 연구."}], "english_summary": ["Studied spin dynamics in the 2D spin-1/2 dimer system Ba2CuSi2O6Cl2.", "Used NMR spin-lattice relaxation rate to probe critical dynamics.", "Evidence of Berezinskii-Kosterlitz-Thouless type critical behavior.", "Confirms the role of field-induced triplon BEC in 2D quantum magnets."]}}, {"title": "Evolution of charge density wave soft phonon modes in PdxErTe3", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/7ky1-nmyx", "authors": "Avishek Maity, Stephan Rosenkranz, Raymond Osborn, et al.", "last_authors": "Ian R. Fisher, Frank Weber", "summary": "Author(s): Avishek Maity, Stephan Rosenkranz, Raymond Osborn, Rolf Heid, Ayman H. Said, Ahmet Alatas, Joshua A. W. Straquadine, Matthew J. Krogstad, Anisha G. Singh, Ian R. Fisher, and Frank Weber Here, the authors use diffuse and inelastic x-ray scattering to investigate the dynamics of orthogonal charge density waves (CDWs) in Pd x ErTe 3 . Strong diffuse scattering and phonon softening persist at wave vector q a (|| a * ) equal in magnitude to the ordering vector q c (|| c * ) of the primary CDW, although small intercalation already suppresses the secondary CDW order near q a . The authors demonstrate that diffuse scattering and phonon softening at q a is coupled to fluctuations of the onset of the primary CDW for all intercalation levels. [Phys. Rev. B 113, 224101] Published Mon Jun 01, 2026", "tier": "B_IMPORTANT_CONDMAT", "score": "7", "reason": "Detailed experimental study of CDW dynamics and phonon softening in telluride systems.", "tags": ["CDW", "inelasticscattering", "phonon"], "image": "", "briefing": {"background": "전하 밀도 파동(CDW)은 결정 격자와 전자 상태가 자발적으로 변조되는 현상으로, 저차원 금속 재료에서 흔히 관측됩니다. 이러한 변조는 격자 진동인 포논의 소프트 모드(soft mode)와 밀접하게 연관되어 있습니다.", "motivation": "직교하는 두 CDW가 존재하는 PdxErTe3 시스템에서 이들의 상호작용과 포논 연화(phonon softening) 현상을 정밀하게 분석하여, 서로 다른 CDW 벡터가 어떻게 연결되는지 밝히고자 했습니다.", "result": "비탄성 X-선 산란을 통해 q_a 방향의 확산 산란과 포논 연화가 q_c 방향의 일차 CDW와 밀접하게 결합되어 있음을 확인했습니다. 미량의 팔라듐 삽입이 제이차 CDW를 억제함에도 불구하고 연동은 유지됩니다.", "implication": "CDW 시스템에서의 다중 순서 매개변수 간의 경쟁 및 협력 관계를 격자 동역학 관점에서 이해하는 데 중요한 기여를 합니다.", "novelty": "다중 CDW 벡터를 가진 계에서 격자 동역학적 커플링을 직접적으로 관측하여 CDW의 형성과 억제 기제에 대한 물리적 직관을 제공합니다.", "unresolved": "팔라듐 도핑 농도에 따른 정확한 상전이 억제 임계값 및 국소적인 불균질성이 전역적인 전자 상태에 미치는 구체적인 영향.", "future_work": "다양한 도핑 수준에서 CDW 갭의 직접적인 관측을 위한 ARPES 연구를 통해 포논 소프트 모드와 전자 구조 변화의 상관관계를 추적할 필요가 있습니다.", "concepts": [{"term": "CDW 소프트 모드", "why_emerged": "CDW 전이 시 특정 모드의 포논 에너지가 0으로 수렴하는 격자 불안정성을 설명하기 위해 필요합니다.", "origin": "Peierls, Fröhlich 등 (1950년대).", "connections": "Peierls 전이, 페르미 면 중첩(nesting), 초전도체와의 경쟁."}, {"term": "비탄성 X-선 산란", "why_emerged": "중성자 산란이 어려운 미세 시료나 희토류 화합물에서 포논 분산을 측정하기 위해 발전했습니다.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "IXS, 분광학, 포논 분산 관계 연구."}], "english_summary": ["Investigated orthogonal CDW dynamics in PdxErTe3 using X-ray scattering.", "Observed strong phonon softening coupled with primary CDW ordering.", "Demonstrated that lattice fluctuations remain even when one CDW is suppressed.", "Highlights the complex inter-dependency of competing order parameters in tellurides."]}}, {"title": "Experimental observation of 5f valence fluctuations by high-resolution x-ray absorption spectroscopy in UPd2Cd20", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/g9y8-7lq9", "authors": "Y. Hirose, F. Honda, H. Doto, et al.", "last_authors": "J. Kolorenč, L. Havela", "summary": "Author(s): Y. Hirose, F. Honda, H. Doto, N. Kawamura, K.O. Kvashnina, L. Amidani, K. Uhlířová, J. Kolorenč, and L. Havela Uranium ${L}_{3}$ and ${M}_{4}$ X-ray absorption spectra, taken in a high-energy resolution fluorescence detection mode on a heavy-fermion antiferromagnet ${\\mathrm{UPd}}_{2}{\\mathrm{Cd}}_{20}$, display two absorption edges, each associated with a different valence state, namely $5{f}^{2}$ and $5{f}… [Phys. Rev. B 113, L241103] Published Tue Jun 02, 2026", "tier": "B_IMPORTANT_CONDMAT", "score": "7", "reason": "Spectroscopic study of heavy fermion materials; aligns with general research interests.", "tags": ["heavyfermion", "spectroscopy", "magnetism"], "image": "", "briefing": {"background": "우라늄 기반의 중페르미온 화합물은 5f 전자의 국소성(localized)과 유동성(itinerant) 사이의 경쟁으로 인해 비전형적인 초전도성과 자기적 특성을 나타내며, 이들의 원자가 상태(valence state)를 규명하는 것이 물성 이해의 핵심입니다.", "motivation": "UPd2Cd20 화합물에서 관측되는 중페르미온 상태의 기원을 5f 원자가 변동과 연관 지어 이해하기 위해 최신 X-선 흡수 분광법을 도입했습니다.", "result": "고해상도 X-선 흡수 분광 실험을 통해 해당 물질에서 5f^2와 5f^3의 서로 다른 원자가 상태가 공존하고 있음을 확인했습니다.", "implication": "이 물질이 단순한 국소 모멘트 모델이 아닌, 5f 전자의 혼성 및 원자가 변동이 중요한 역할을 하는 강상관 전자 계임을 시사합니다.", "novelty": "헤비 페르미온 시스템에서 원자가 변동의 직접적인 분광학적 증거를 제시하여, 해당 물질의 자기적 정렬 기제 해석에 새로운 근거를 마련했습니다.", "unresolved": "원자가 변동이 저온에서의 자기적 순서나 잠재적 초전도성과 어떻게 정량적으로 연결되는지에 대한 직접적인 증명.", "future_work": "온도 변화에 따른 분광 스펙트럼 변화를 측정하여 Kondo 온도를 포함한 전이 과정의 동역학적 분석이 필요합니다.", "concepts": [{"term": "5f 원자가 변동", "why_emerged": "우라늄 화합물에서 전자가 국소 궤도와 전도 대역 사이를 오가며 발생하는 다체 효과를 설명하기 위해 필요합니다.", "origin": "중페르미온 이론 연구자들에 의해 정립됨.   if (r.link) { const link = document.createElement('a'); link.className = 'link'; link.href = r.link; link.target = '_blank'; link.rel = 'noopener noreferrer'; link.textContent = 'Open paper'; headText.appendChild(link); }
  head.appendChild(headText);
  if (r.summary) { const abstract = document.createElement('p'); abstract.className = 'original-abstract'; const strong = textEl('strong', '', 'Original abstract'); abstract.appendChild(strong); abstract.append(r.summary); head.appendChild(abstract); }
  slideEl.appendChild(head);
  const briefing = document.createElement('div');
  briefing.className = 'briefing';
  appendBriefSection(briefing, 'Background', b.background);
  appendBriefSection(briefing, 'Motivation', b.motivation);
  appendBriefSection(briefing, 'Result', b.result);
  appendBriefSection(briefing, 'Implication', b.implication);
  appendBriefSection(briefing, "Why it's important / Novelty", b.novelty);
  appendBriefSection(briefing, 'Unresolved Questions', b.unresolved);
  appendBriefSection(briefing, 'Expected Future Work', b.future_work);
  if (b.concepts && b.concepts.length) {
    const section = document.createElement('section');
    section.className = 'brief-section wide';
    section.appendChild(textEl('h2', '', 'Concepts / Terms'));
    const concepts = document.createElement('div');
    concepts.className = 'concepts';
    b.concepts.forEach(c => {
      const item = document.createElement('div');
      item.className = 'concept';
      item.appendChild(textEl('h3', '', c.term || 'Concept'));
      [['왜 생겼나: ', c.why_emerged], ['누가 만들었나: ', c.origin], ['연결되는 흐름: ', c.connections]].forEach(([label, text]) => { if (!text) return; const p = document.createElement('p'); const bold = textEl('b', '', label); p.appendChild(bold); p.append(text); item.appendChild(p); });
      concepts.appendChild(item);
    });
    section.appendChild(concepts);
    briefing.appendChild(section);
  }
  if (b.english_summary && b.english_summary.length) { const section = document.createElement('section'); section.className = 'brief-section wide'; section.appendChild(textEl('h2', '', 'English Summary')); const ul = document.createElement('ul'); b.english_summary.slice(0, 5).forEach(line => ul.appendChild(textEl('li', '', line))); section.appendChild(ul); briefing.appendChild(section); }
  slideEl.appendChild(briefing);
  counterEl.textContent = `${index + 1} / ${slides.length}`;
  prevBtn.disabled = index === 0;
  nextBtn.disabled = index === slides.length - 1;
}
prevBtn.addEventListener('click', () => { index = Math.max(0, index - 1); render(); });
nextBtn.addEventListener('click', () => { index = Math.min(slides.length - 1, index + 1); render(); });
document.addEventListener('keydown', event => { if (event.key === 'ArrowLeft') prevBtn.click(); if (event.key === 'ArrowRight') nextBtn.click(); });
render();
</script>
</body>
</html>
