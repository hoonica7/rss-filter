<title>Daily Paper Slideshow</title>
<style>
  :root {
    color-scheme: light;
    --bg: #f6f7f4;
    --paper: #ffffff;
    --ink: #111827;
    --muted: #64748b;
    --line: #d8ddd2;
    --accent: #176b87;
    --accent-2: #9a3412;
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; overflow: auto; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: var(--bg); color: var(--ink); }
  .shell { max-width: 1500px; min-height: 100vh; margin: 0 auto; padding: 14px 18px; display: flex; flex-direction: column; }
  .topbar { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 16px; }
  .top-actions { display: flex; align-items: center; gap: 10px; }
  .topbar a, button { border: 1px solid var(--line); border-radius: 8px; background: var(--paper); color: var(--ink); padding: 10px 14px; font-weight: 700; text-decoration: none; cursor: pointer; }
  button.primary { background: var(--accent); border-color: var(--accent); color: white; }
  button:disabled { opacity: 0.45; cursor: not-allowed; }
  .counter { color: var(--muted); font-weight: 700; }
  .slide { min-height: calc(100vh - 82px); background: var(--paper); border: 1px solid var(--line); border-radius: 10px; padding: 18px; box-shadow: 0 18px 42px rgba(15, 23, 42, 0.10); display: grid; grid-template-columns: minmax(310px, 0.86fr) minmax(0, 1.55fr); gap: 18px; overflow: visible; }
  .paper-head { min-width: 0; min-height: 0; overflow: visible; display: flex; flex-direction: column; gap: 12px; }
  .figure { margin: 0; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: #f8fafc; }
  .figure img { display: block; width: 100%; max-height: 41vh; object-fit: contain; background: white; }
  .figure figcaption { padding: 7px 10px; color: var(--muted); font-size: 12px; line-height: 1.3; }
  .head-text { display: flex; flex-direction: column; gap: 9px; min-width: 0; }
  .badges { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .badge { border-radius: 999px; padding: 5px 9px; background: #eef2ff; color: #3730a3; font-size: 12px; font-weight: 800; }
  .score { background: #fee2e2; color: #991b1b; }
  h1 { margin: 0; font-size: 25px; line-height: 1.15; letter-spacing: 0; overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
  h1 a { color: inherit; text-decoration-color: rgba(23, 107, 135, 0.35); text-decoration-thickness: 2px; text-underline-offset: 4px; }
  h1 a:hover { color: var(--accent); text-decoration-color: var(--accent); }
  .meta, .authors, .why, .abstract { font-size: 13px; line-height: 1.45; }
  .meta, .authors { color: var(--muted); }
  .why strong, .abstract strong, .authors strong { color: var(--ink); }
  .authors { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .why { border-left: 4px solid var(--accent-2); padding-left: 10px; color: #374151; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .abstract { border-top: 1px solid var(--line); padding-top: 14px; color: #374151; }
  .original-abstract { border-top: 1px solid var(--line); padding-top: 10px; color: #374151; font-size: 11.5px; line-height: 1.35; overflow-wrap: anywhere; }
  .original-abstract strong { display: block; margin-bottom: 4px; color: var(--ink); }
  .tags { display: flex; flex-wrap: wrap; gap: 8px; }
  .tag { border-radius: 999px; padding: 4px 8px; background: #f1f5f9; color: #475569; font-size: 12px; font-weight: 700; }
  .head-text > .link { display: none; }
  .briefing { min-width: 0; min-height: 0; overflow: visible; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); grid-auto-rows: minmax(0, auto); align-content: start; gap: 11px 18px; border-top: 0; padding-top: 0; }
  .brief-section { min-width: 0; }
  .brief-section.wide { grid-column: 1 / -1; }
  .brief-section h2 { margin: 0 0 4px; font-size: 14px; line-height: 1.22; color: #0f766e; letter-spacing: 0; }
  .brief-section p, .brief-section li { margin: 0; font-size: 12.5px; line-height: 1.42; color: #1f2937; overflow-wrap: anywhere; }
  .brief-section ul { margin: 0; padding-left: 20px; }
  .concepts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 9px 14px; }
  .concept { border-top: 1px solid var(--line); padding-top: 7px; }
  .concept h3 { margin: 0 0 4px; font-size: 13px; color: #7c2d12; letter-spacing: 0; }
  .concept p { margin: 2px 0 0; font-size: 11.5px; line-height: 1.35; color: #374151; overflow-wrap: anywhere; }
  .concept b { color: #111827; }
  .link { color: var(--accent); font-weight: 800; text-decoration: none; }
  .empty { padding: 48px; background: var(--paper); border: 1px solid var(--line); border-radius: 12px; color: var(--muted); }
  @media (max-width: 860px) {
    .shell { padding: 14px; }
    .topbar, .top-actions { align-items: stretch; flex-direction: column; }
    .slide, .briefing, .concepts { grid-template-columns: 1fr; }
    .slide { min-height: auto; overflow: visible; display: grid; }
    h1 { font-size: 28px; }
  }
</style>

<script>
const slides = [{"title": "Moiré-Modulated Γ Valley in Twisted Bilayer and Twisted Double-Bilayer MoTe2", "journal": "PRL_Recent", "source": "author whitelist", "link": "http://link.aps.org/doi/10.1103/wnyd-m5sr", "authors": "Wanying Chen, Hongyun Zhang, Jinxi Lu, et al.", "last_authors": "Chong Wang, Shuyun Zhou", "summary": "Angle-Resolved Photoemission Spectroscopy measurements on twisted bilayer and double-bilayer MoTe₂, combined with theory, reveal remote electronic bands that follow twist-induced lattice relaxation, establishing a direct link between atomic reconstruction and electronic structure in moiré semiconductors.", "tier": "A_MUST_READ", "score": "10", "reason": "author whitelist: Shuyun Zhou", "tags": ["angle-resolvedphotoemission", "photoemission", "moir", "twistedbilayer", "twisted"], "image": "", "briefing": {"background": "이차원 전이금속 디칼코게나이드(TMD)를 특정 각도로 비틀어 쌓으면 모아레(Moiré) 초격자가 형성되며, 이는 전자 구조의 변조와 플랫 밴드(flat band) 형성을 유도하여 상관 관계가 강한 물리적 현상을 탐구할 수 있는 장을 제공합니다.", "motivation": "비틀린 이중층 및 이중-이중층 MoTe2에서 모아레 퍼텐셜이 감마(Γ) 밸리의 전자 구조에 어떤 영향을 미치는지, 특히 원자 수준의 구조적 재배열(lattice relaxation)이 실제 에너지 밴드에 어떻게 반영되는지 규명하고자 했습니다.", "result": "ARPES 측정과 이론적 계산을 병행하여, 비틀림에 의한 격자 이완 현상이 원격 전자 밴드(remote bands)의 형성과 직접적인 연관이 있음을 확인했습니다. 이는 원자 구조의 재구성이 반도체성 모아레 시스템의 전자 구조를 결정하는 핵심 요소임을 입증합니다.", "implication": "단순한 기하학적 비틀림을 넘어, 격자 이완 효과를 정밀하게 제어함으로써 모아레 시스템의 전자 밴드를 더욱 정교하게 엔지니어링할 수 있는 가능성을 제시합니다.", "novelty": "ARPES 분야의 권위자인 Shuyun Zhou 그룹의 연구로, MoTe2 모아레 시스템에서 감마 밸리의 전자 구조와 격자 이완 사이의 직접적인 연결 고리를 실험적으로 명확히 보여주었다는 점에서 독자(ARPES 전문가)에게 매우 중요합니다.", "unresolved": "격자 이완이 밴드 갭의 크기나 위상적 특성(topology)에 미치는 구체적인 정량적 영향에 대해서는 추가적인 연구가 필요할 수 있습니다.", "future_work": "비틀림 각도에 따른 밴드 구조의 진화 과정을 실시간으로 추적하거나, 게이트 전압을 통한 도핑 조절 하에서의 전자 구조 변화 관측이 기대됩니다.", "concepts": [{"term": "Moiré potential", "why_emerged": "두 격자 구조가 겹칠 때 발생하는 장주기 간섭 무늬가 전자의 거동에 새로운 주기적 퍼텐셜을 제공하기 때문입니다.", "origin": "초록 정보만으로는 특정하기 어려우나, 그래핀/hBN 적층 구조 등에서 널리 확립됨", "connections": "Flat bands, Mott insulators, Superconductivity in twisted bilayer graphene"}, {"term": "Lattice relaxation", "why_emerged": "비틀린 적층 구조에서 원자들이 에너지를 최소화하기 위해 평형 위치에서 미세하게 이동하는 현상을 설명하기 위해 도입되었습니다.", "origin": "재료 과학 및 고체 물리 전반", "connections": "Atomic reconstruction, Strain engineering, Band structure modulation"}, {"term": "Γ valley", "why_emerged": "브릴루앙 영역의 중심점으로, TMD 반도체의 광학적 및 수송 특성을 이해하는 데 필수적인 지점입니다.", "origin": "결정학 및 밴드 구조 이론", "connections": "Direct bandgap, Valence band maximum (VBM), Spin-orbit coupling"}], "english_summary": ["ARPES study on twisted bilayer and double-bilayer MoTe2 reveals the impact of moiré potentials.", "The research establishes a direct link between twist-induced lattice relaxation and electronic band modulation.", "Remote electronic bands are observed to follow the atomic reconstruction patterns.", "This provides critical insights for engineering electronic states in moiré semiconductor systems."]}}, {"title": "High-Temperature ferromagnetism from site-selective filling in (Fe,Ni)6-2", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2609.11862", "authors": "Tyler L. Werner (Department of Applied Physics, Yale University, New Haven, et al.", "last_authors": "Kavli Energy Nanosciences Institute at Berkeley, Yu He (Department of Applied Physics", "summary": "The discovery of high-temperature ferromagnetism in the metallic van der Waals (vdW) system Fe$_N$GeTe$_2$ has brought two-dimensional (2D) magnets into technologically relevant temperature scales. Specifically at N = 5, dilution of magnetic moments by nickel substitution counterintuitively achieves a record high Curie temperature of 478~K. Unraveling the origin of this nickel-substitution-induced enhancement is complicated by the compound's structural complexity, coexistent itinerant and local magnetic contributions, and mesoscopic compositional domains. Through coordinated structural and electronic characterization, we identify that the high-T$_C$ magnetic phase arises from a strain-stabilized Fe$_6$GeTe$_2$ nano-precipitate. Combining first-principles calculations and spin- and angle-resolved photoemission spectroscopy (ARPES), we uncover a site-specific electronic landscape in which interior iron atoms primarily host localized moments while the outer iron atoms neighboring the tellurium layers produce spin-polarized itinerant carriers that cross the vdW gap. The large energy cost associated with homogeneous nickel substitution is found to favor the spontaneous precipitation of the crystallographically and electronically ``clean'' high-T$_C$ phase. Finally, we compare metal-rich vdW magnets with binary magnetic alloys, and discuss the unifying roles of nano-precipitates in stabilizing otherwise unattainable bulk phases. Our work provides mechanistic insights into the record-high T$_C$ ferromagnetism in (Fe,Ni)$_{5+\\delta}$GeTe$_2$, establishing a rigorous foundation for the atomic engineering of vdW magnetic metals informed by direct electronic signatures.", "tier": "A_MUST_READ", "score": "10", "reason": "Direct relevance: uses ARPES to study electronic signatures in vdW magnetic systems.", "tags": ["ARPES", "vanderWaals", "ferromagnet"], "image": "https://arxiv.org/html/2609.11862v1/version/Figures/Fig1_06_11_2025.png", "briefing": {"background": "Fe5GeTe2와 같은 vdW 자성체는 상온에 가까운 퀴리 온도(Tc)를 가져 차세대 스핀트로닉스 소재로 주목받고 있으나, 특정 조건에서 Tc가 급격히 상승하는 원인은 명확하지 않았습니다.", "motivation": "Ni이 치환된 (Fe,Ni)5GeTe2에서 나타나는 기록적인 고온 강자성(478 K)의 기원을 나노 수준의 구조적, 전자적 관점에서 규명하고자 했습니다.", "result": "고온 강자성 상이 스트레인에 의해 안정화된 Fe6GeTe2 나노 석출물(nano-precipitate)에서 기인함을 밝혀냈습니다. Spin-ARPES를 통해 내부 Fe 원자는 국성 자기 모멘트를, 외부 Fe 원자는 층간 스핀 편극 순회 전자를 제공하는 부위별 특성을 확인했습니다.", "implication": "단순한 균일 합금화보다 나노 규모의 상 분리나 석출물 제어가 vdW 자성체의 Tc를 높이는 새로운 전략이 될 수 있음을 시사합니다.", "novelty": "독자의 주요 관심사인 ARPES와 vdW 자성체를 결합하여, 거시적인 물성(고온 강자성)의 기원을 미시적인 전자 상태와 부위별 점유(site-selective filling)를 통해 설명해낸 점이 돋보입니다.", "unresolved": "이러한 고 Tc 나노 석출물을 거시적인 박막 형태에서 균일하게 대량으로 합성할 수 있는 공정 기술 개발이 남아 있습니다.", "future_work": "나노 석출물의 크기 및 분포  structure; highly relevant.", "tags": ["angle-resolvedphotoemission", "monolayer", "graphene"], "image": "", "briefing": {"background": "SnTe는 위상 결정 절연체(TCI)의 대표적인 물질로, 이를 단일 원자층 수준인 2차원으로 줄였을 때 나타나는 구조적 변형과 그에 따른 전자 구조 변화는 응집 물질 물리의 중요한 주제입니다.", "motivation": "그래핀 기판 위에 성장시킨 단층 SnTe의 puckered(주름진) 구조를 확인하고, 이 시스템의 전자 구조를 직접적으로 관측하는 것을 목표로 했습니다.", "result": "Momentum microscopy(ARPES의 변형)를 통해 단층 SnTe의 전자 밴드를 직접 측정하는 데 성공했습니다. 관측된 밴드 구조는 이론적으로 예측된 짝수 층 puckered 구조의 특징과 일치함을 확인했습니다.", "implication": "단층 SnTe의 안정적인 성장과 전자 구조 측정이 가능함을 입증함으로써, 2D 한계에서의 위상 특성 및 강유전성 제어 연구에 중요한 발판을 마련했습니다.", "novelty": "전통적인 ARPES보다 향상된 모멘텀 공간 매핑(momentum microscopy)을 사용하여 2D 단층 SnTe의 미세한 전자 구조를 직접 시각화했다는 점이 독자의 관심사에 부합합니다.", "unresolved": "그래핀 기판과의 전하 이동(charge transfer)이 SnTe 고유의 물성에 미치는 영향과, 홀수 층/짝수 층에 따른 위상적 차이의 실험적 검증이 남아 있습니다.", "future_work": "층수 조절에 따른 위상 상전이 관측 및 외부 전장을 이용한 전자 구조 튜닝 실험이 이어질 것으로 보입니다.", "concepts": [{"term": "Momentum microscopy", "why_emerged": "넓은 범위의 k-공간을 한 번에 정밀하게 매핑하여 전자 구조를 빠르게 파악하기 위해 개발된 ARPES의 발전된 형태입니다.", "origin": "초록 정보만으로는 특정하기 어려움 (최근 상용화 및 확산)", "connections": "ARPES, Photoelectron spectroscopy, k-space mapping"}, {"term": "Puckered structure", "why_emerged": "흑린(black phosphorus)처럼 평면 구조가 아닌 지그재그 형태로 주름진 구조를 가지며, 이는 이방성 물성을 유도합니다.", "origin": "초록 정보만으로는 특정하기 어려움 (결정 구조학)", "connections": "Anisotropy, Ferroelectricity, Group IV chalcogenides"}, {"term": "Topological Crystalline Insulator (TCI)", "why_emerged": "시간 역전 대칭성이 아닌 결정 격자의 대칭성에 의해 보호되는 새로운 형태의 위상 절연체를 정의하기 위해 등장했습니다.", "origin": "Liang Fu (2011)", "connections": "SnTe, Mirror symmetry, Surface states"}], "english_summary": ["Direct ARPES observation of the electronic structure of monolayer SnTe on graphene.", "Momentum microscopy confirms the even-layer puckered structural symmetry.", "The study reconciles experimental band mapping with first-principles calculations.", "Provides a baseline for studying 2D topological crystalline insulators and ferroelectricity."]}}, {"title": "Distinct lattice and charge excitations in AV3Sb5 kagome superconductors", "journal": "npj_QuantumMaterials", "source": "author whitelist", "link": "https://www.nature.com/articles/s41535-026-00937-w", "authors": "Dongjin Oh, Stefan Enzner, Lennart Klebl, et al.", "last_authors": "Stephen D. Wilson, Riccardo Comin", "summary": "Distinct lattice and charge excitations in AV 3 Sb 5 kagome superconductors", "tier": "A_MUST_READ", "score": "9", "reason": "author whitelist: Riccardo Comin", "tags": ["kagome", "superconduct"], "image": "https://pubads.g.doubleclick.net/gampad/ad?iu=/285/npjquantmats.nature.com/article&sz=728x90&c=1834446906&t=pos%3Dtop%26type%3Darticle%26artid%3Ds41535-026-00937-w%26doi%3D10.1038/s41535-026-00937-w%26subjmeta%3D301,639,766%26kwrd%3DMaterials+science,Physics", "briefing": {"background": "AV3Sb5 계열의 카고메 금속은 전하 밀도 파(CDW), 시간 반전 대칭 깨짐(TRSB), 비전형적 초전도성 등 풍부한 물리 현상을 보여주며, 이들의 전자 및 격자 구조를 이해하는 것은 응집물질물리학의 중요한 과제입니다.", "motivation": "기존 연구에서 관측된 복잡한 물리적 상태의 기원을 격자 진동과 전하 여기의 관점에서 분리하여 분석하고자 합니다.", "result": "이 논문은 AV3Sb5 화합물에서 격자 및 전하 들뜸(excitation)의 별도 기여를 구별해내는 데 성공했습니다.", "implication": "격자 구조와 전자 상태의 상관관계가 명확해짐에 따라, CDW 전이와 초전도성 발생 메커니즘을 보다 정밀하게 모델링할 수 있게 됩니다.", "novelty": "Riccardo Comin 그룹의 고해상도 분광학 기법을 통해 카고메 시스템 내의 개별 들뜸 모드를 선택적으로 관측한 점이 중요합니다.", "unresolved": "격자 왜곡이 구체적으로 전자 상관관계를 어떻게 강화하거나 억제하는지에 대한 미세한 메커니즘은 여전히 불명확합니다.", "future_work": "저온 환경에서의 시간 분해(time-resolved) 분광학을 통한 CDW 전이 직후의 동역학 관찰이 예상됩니다.", "concepts": [{"term": "Kagome lattice", "why_emerged": "기하학적 좌절(frustration)이 물리적 상태에 미치는 영향을 연구하기 위해 도입됨", "origin": "수학적 기하학에서 유래, 응집물질물리학에서는 2000년대 이후 위상물질 연구와 결합", "connections": "Berry 곡률, 비정상 홀 효과, 위상 절연체"}, {"term": "CDW", "why_emerged": "전자와 격자 간의 강한 결합으로 인해 전자 밀도가 주기적으로 변조되는 현상을 설명하기 위함", "origin": "Peierls, 1955년", "connections": "슈퍼유동, 모트 절연체, 전자-포논 결합"}], "english_summary": ["Study of AV3Sb5 kagome superconductors focusing on lattice and charge excitations.", "Successfully disentangled the contributions of lattice vibrations from electronic charge signals.", "Provides crucial insights into the interplay between CDW order and superconductivity.", "Advances the understanding of the complex phase diagram in V-based kagome systems."]}}, {"title": "Ultrafast RIXS of orbital-resolved valence-band reshaping in photoexcited graphite", "journal": "Science_Advances", "source": "Gemini", "link": "https://doi.org/10.1126/sciadv.aeg6983", "authors": "Marco Malvestuto, Antonio Caretta, Simone Laterza, et al.", "last_authors": "Benedikt Maurer, Claudia Draxl", "summary": "Ultrafast photoexcitation can drive solids far from equilibrium by dynamically renormalizing their electronic structure, yet direct time-domain access to bulk band-structure reshaping with orbital and momentum selectivity has remained limited. Here, we show in photoexcited graphite that femtosecond carbon K -edge resonant inelastic x-ray scattering (RIXS), used in the time domain, provides a momentum- and orbital-selective spectroscopic fingerprint of transient valence-band reshaping. Momentum- and orbital-selective measurements along the K → M contour disentangle π and σ contributions and reveal a structured redistribution of spectral weight emerging within ∼70 femtoseconds and evolving on picosecond timescales. Nonequilibrium first-principles RIXS calculations performed within a frozen-lattice approximation show that the earliest response is dominated by electronic correlations and transient screening. At longer delays, the dynamics become strongly momentum dependent: Near K , the signal reflects the decay of the electronic contribution to the renormalized band structure under a hot-phonon bottleneck, whereas at the M -point van Hove singularity, it reveals a characteristic spectroscopic signature consistent with electron-phonon–driven band red shift and lifetime broadening induced by strongly coupled optical phonons. A three-temperature model constrained by the orbital-resolved tr-RIXS data captures the ensuing energy cascade through a hot-p er out of equilibrium. How the order parameter relaxes back to equilibrium depends both on the structure of the superconducting gap and on the nature of quasiparticle scattering. We report the discovery of an ultrasonic attenuation peak inside the superconducting state of the kagome superconductor CsV$_3$Sb$_5$. This peak is the natural consequence of the order parameter relaxation time matching the ultrasonic drive frequency near $T_{\\rm c}$. From the measured frequency dependence of the peak, we extract a microscopic scattering time of $\\tau_N = 25$ ps. This timescale is two orders of magnitude longer than the elastic scattering time as determined by resistivity measurements, but is comparable to the inelastic scattering time determined by thermal transport. Within the conventional framework of order-parameter relaxation, this implies that elastic scattering is ineffective at relaxing the superconducting condensate, consistent with a sign-preserving $s$-wave state obeying Anderson's theorem.", "tier": "B_IMPORTANT_CONDMAT", "score": "10", "reason": "Direct experimental study on CsV3Sb5 kagome superconductor dynamics.; demoted from A: broad CM, not direct user/project hit", "tags": ["kagome", "superconduct", "transport"], "image": "https://arxiv.org/html/2609.11686v1/structure_and_strains.png", "briefing": {"background": "카고메 금속 CsV3Sb5에서 초전도 현상과 CDW(전하밀도파)의 상호작용은 복잡한 전자 구조와 관련되어 큰 관심사입니다. 초전도 질서 변수(order parameter)가 외부 자극에 대해 어떻게 복구되는지는 그 대칭성과 산란 메커니즘을 밝히는 중요한 척도입니다.", "motivation": "초음파를 이용한 시간 가변적인 변형(strain)을 CsV3Sb5에 가하여, 평형 상태에서 벗어난 초전도 질서 변수의 이완 과정을 관찰하고자 했습니다.", "result": "초전도 전이 온도 근처에서 초음파 감쇠 피크를 관찰했으며, 이를 통해 25 ps의 미세 산란 시간(scattering time)을 추출했습니다. 이는 탄성 산란 시간보다 훨씬 길고 비탄성 산란 시간과 유사합니다.", "implication": "이 결과는 탄성 산란이 초전도 응축 상태를 완화하는 데 비효율적임을 시사하며, 이는 앤더슨 정리를 따르는 부호 변화가 없는(sign-preserving) s-파 초전도 상태와 부합합니다.", "novelty": "카고메 초전도체에서 초음파 감쇠 측정을 통해 초전도 응답의 동역학적 특성을 시간 척도 단위로 정량화했습니다. 특히 비탄성 산란이 지배적인 역할을 한다는 점은 향후 ARPES나 RIXS를 통한 갭 대칭성 연구의 중요한 토대가 됩니다.", " rom Lieb to kagome lattices", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/gcdq-mdgr", "authors": "Teng-Fei Ying, Hugo U. R. Strand, Benjamin T. Zhou, and Erik G. C. P. van Loon", "last_authors": "Teng-Fei Ying, Hugo U. R. Strand, Benjamin T. Zhou, and Erik G. C. P. van Loon", "summary": "We investigate the magnetic orders and excitations in a half-filled Hubbard model that continuously interpolates between the Lieb and kagome lattices. Using the self-consistent Hartree-Fock approximation combined with the Bethe-Salpeter equation in the random phase approximation, we map the U − t ′ phase diagram of the Lieb-kagome lattices and compute real-frequency transverse spin susceptibilities, i.e., the magnon spectra. Dynamical mean-field theory and exact diagonalization are used as complementary checks of static magnetic phases. In particular, besides gapless Goldstone magnons, the symmetry-broken ferrimagnetic and antiferromagnetic phases also exhibit gapped Higgs magnon bands, which originate from amplitude fluctuations in the order parameter characterizing spontaneous symmetry breaking.", "tier": "B_IMPORTANT_CONDMAT", "score": "9", "reason": "Direct relevance to kagome lattice and correlated electron systems.; demoted from A: broad CM, not direct user/project hit", "tags": ["kagome", "Hubbard", "magnon"], "image": "", "briefing": {"background": "다중 궤도 Hubbard 모델은 전자 상관 관계가 강한 물질에서 발생하는 자성 및 밴드 구조를 이해하기 위한 표준 이론 틀입니다.", "motivation": "Lieb 격자와 Kagome 격자 사이의 연속적인 보간 모델을 설정하여, 격자 구조 변화가 마그논(magnon) 스펙트럼과 자기적 들뜸 모드에 어떤 영향을 미치는지 밝히고자 합니다.", "result": "Lieb-Kagome 보간 격자에서 마그논 스펙트럼을 계산하고, 자발적 대칭성 깨짐에 의한 Goldstone 마그논 외에도 진폭 변동에 의한 Higgs 마그논 모드가 존재함을 증명했습니다.", "implication": "강한 상관관계가 있는 격자 시스템에서 스핀 들뜸의 기원을 이론적으로 명확히 규명하고, Kagome 금속에서의 자성 기저 상태를 예측하는 데 기여합니다.", "novelty": "Kagome 격자의 위상적 특성과 Hubbard 모델의 상관관계 효과를 통합하여 마그논 밴드 구조의 변화를 체계적으로 분석했습니다.", "unresolved": "실제 화합물에서의 강한 스핀-궤도 결합(SOC) 효과와 복잡한 궤도 배열을 이 모델에 완전히 반영하기에는 한계가 있습니다.", "futu ng a strong interlayer exchange coupling, and their potential similarities with cuprate superconductors, has made this a very active topic in condensed matter physics. In the present paper we study the strongly correlated one-orbital ($d_{x^2-y^2}$) bilayer $t$-$J_\\perp$-$V$ model for nickelates, where $V$ denotes the Coulomb interactions, using a controlled large-$N$ expansion at and beyond the mean-field level. Focusing on the out-of-plane spin exchange interaction ($J_\\perp$), we find that it triggers both out-of-plane $s$-wave superconductivity and an out-of-plane bond-order phase ($z$-BOP) instability. The $z$-BOP gives rise to a complex $z$-axis hopping dominated by its imaginary component, which drives out-of-plane currents and induces in-plane ones, spontaneously forming on the vertical plaquettes a loop-current state that breaks time-reversal symmetry. Competition between this loop-current phase and superconductivity yields a dome-shaped superconducting region, with optimal superconductivity occurring near the $z$-BOP quantum critical point. The resulting phase diagram features a pure loop-current region, a low-doping coexistence phase, a pure superconducting state at higher doping, and a correlated metallic state.", "tier": "B_IMPORTANT_CONDMAT", "score": "9", "reason": "Theory on competing loop currents and superconductivity in nickelates, connecting to cuprates and TRSB.", "tags": ["theory", "loopcurrent", "superconductivity", "nickelates", "cuprates", "correlated"], "image": "https://arxiv.org/html/2609.10926v1/Tc_zBOP_susceptibilties.png", "briefing": {"background": "니켈산염은 고온 초전도체인 구리산염과 구조적 유사성을 가져 강상관 전자계 연구의 핵심 주제입니다. 특히 층간 결합이 강한 이중층 니켈산염에서의 초전도 기원 규명은 큰 도전 과제입니다.", "motivation": "이중층 니켈산염 모델에서 강한 층간 교환 상호작용이 어떻게 초전도성과 다른 질서 상태(예: 루프 전류)를 경쟁하게 만드는지 이론적으로 밝히고자 합니다.", "result": "t-J-V 모델을 통해 층간 결합이 '루프 전류 상태(loop-current state)'와 초전도성을 유도함을 보였으며, 이들 사이의 경쟁이 도핑에 따른 초전도 돔 구조를 형성함을 발견했습니다.", "implication": "니켈산염의 초전도 현상이 구리산염과 유사한 루프 전류 및 시간 반전 대칭성 파괴 ecule-localized states and more dispersive bands, and we show that each can be compactly described by an anisotropic tight-binding Hamiltonian that yields band-resolved hopping anisotropies. We further show theoretically the wide tunability in the inter-site hopping and Coulomb interaction based on dielectric and screening environment, and show two experimental realizations using Ag(100) and Au(111) substrates. On Ag(100), orbital hybridization between molecular frontier states and the substrate drives finite spectral weight at the Fermi level and local interfacial polarization. This hybridization enhances the effective intermolecular hopping roughly thirty-fold, drastically reducing $U/t$. Complementary angle-resolved photoemission spectroscopy resolves substantial interfacial charge redistribution and enhanced bandwidth of the HOMO band, consistent with theoretical predictions. These results clarify how metal substrates and gates convert H$_2$Nc from isolated molecules into a tunable 2D lattice, and highlight molecular superlattices as a promising platform in which the effective interaction parameters can be engineered over a wide range.", "tier": "B_IMPORTANT_CONDMAT", "score": "9", "reason": "Excellent match: combines ARPES, STS, and molecular lattice electronic structure studies.", "tags": ["ARPES", "STS", "electronic-structure", "molecular-lattice"], "image": "https://arxiv.org/static/browse/0.3.4/images/arxiv-logo-fb.png", "briefing": {"background": "반데르발스 모아레 시스템 외에도 분자 자기 조립(molecular assembly)을 통해 전자 밴드를 인위적으로 설계하는 연구는 퀀텀 물질 엔지니어링의 새로운 지평입니다.", "motivation": "H2Nc(Metal-free naphthalocyanine) 분자 격자를 기판 위에서 조립했을 때, 분자 간 홉핑(hopping)과 전자 상관 관계(U/t)가 기판에 의해 어떻게 조절되는지 연구하고자 합니다.", "result": "기판(Ag, Au)에 따라 분자 간 홉핑이 30배 가량 강화될 수 있음을 보였으며, ARPES와 STS를 통해 이를 실험적으로 확인했습니다.", "implication": "분자 조립 방식을 통해 유효 상호작용 파라미터(U/t)를 광범위하게 제어할 수 있으며, 이는 강상관 전자계 연구를 위한 새로운 퀀텀 플랫폼을 제공합니다.", "novelty": "ARPES/STS/DFT를 결합하여 분자 격자의 밴드 구조와 기판 유도 효과를 정밀하게 규명했으며, 이는 강상관 전자계 조절에 대한 새로운  "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "Berry 곡률, 비정상 홀 효과."}, {"term": "RKKY 상호작용", "why_emerged": "금속 내 전도 전자를 매개로 국소 자기 모멘트 간 상호작용을 설명하기 위해 필요.", "origin": "Ruderman, Kittel, Kasuya, Yosida (1950s).", "connections": "희토류 자성, Kondo 효과."}], "english_summary": ["PrGaSi shows an unexpected decoupling of spin and orbital magnetic moments.", "The material exhibits coexistence of RKKY-mediated magnetism and Weyl electronic states.", "This challenges the conventional paradigm of 4f electronic behavior in rare-earth intermetallics."]}}, {"title": "Distinguishing apparent and hidden altermagnetism via uniaxial strain in CsV2Te2O", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/nsgk-xxcy", "authors": "San-Dong Guo, Cheng-Xiang Chai, Dun-Cheng Liang, Feng-Ren Fan, Yang Liu", "last_authors": "Feng-Ren Fan, Yang Liu", "summary": "Hidden altermagnetism was theoretically proposed and then experimentally confirmed in the metal ${\\mathrm{Cs}}_{1−δ}{\\mathrm{V}}_{2}{\\mathrm{Te}}_{2}\\mathrm{O}$, which exhibits two nearly degenerate ground-state magnetic configurations ($C$ type and $G$ type), corresponding, respectively, to apparen…", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Directly relevant altermagnetism study using uniaxial strain to resolve magnetic configuration.", "tags": ["altermagnetism", "strain", "CsV2Te2O"], "image": "", "briefing": {"background": "알터마그네티즘(Altermagnetism)은 강자성이나 반강자성으로 분류되지 않는 제3의 자기 질서로, 비자성체와 같이 순자화는 0이지만 대칭성 파괴에 의해 스핀 분할된 밴드 구조를 가집니다.", "motivation": "Cs1-δV2Te2O 물질에서 기저 상태의 자기 구성(C-type vs G-type)이 거의 축퇴되어 있어, 외관상 나타나는 성질과 숨겨진 자기 구조를 구별하기 어렵다는 점을 해결하고자 합니다.", "result": "일축 압력(uniaxial strain)을 가함으로써 에너지 준위의 변화를 유도해 C형과 G형 알터마그네틱 상태를 실험적으로 구분할 수 있는 방법을 이론적으로 제시했습니다.", "implication": "자기 대칭성을 정밀하게 제어하거나 판별하는 기술이 확보되어, 알터마그넷 기반의 차세대 스핀트로닉스 소자 구현 가능성을 높입니다.", "novelty": "이론적 예측에 머물기 쉬운 알터마그네티즘을 실제 물질(CsV2Te2O)에서 압력이라는 외적 섭동을 통해 구체적으로 판별하는 프로토콜을 제안했습니다.", "unresolved": "실제 실험적 압력 하에서 밴드 구조의 변화를 ARPES 등으로 직접 관측하는 데이터는 아직 제시되지 않았습니다.", "future_work": "압력을 가한 상태에서의 ARPES 측정을 통해 스핀 분할 밴드의 변화를 직접 확인하는 실험이 필요합니다.", "concepts": [{"term": "Altermagnetism", "why_emerged": "비자성/반강자성 경계를 허물고 스핀-궤도 결합 없이도 밴드 분할을 가능하게 하기 위해 도입됨.", "origin": "최근 2020년대 초반 이론적으로 확립됨 (Smejkal et al.).", "connections": "반강자성, 강자성, Berry curvature, 스핀트로닉스."}, {"term": "Uniaxial strain", "why_emerged": "물질의 격자 대칭성을 물리적으로 변형시켜 전자 구조를 직접적으로 튜닝하기 위해 사용됨.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "압전 소자, nematicity 연구, 밴드 구조 엔지니어링."}], "english_summary": ["Cs1-δV2Te2O exhibits nearly degenerate magnetic ground states (C-type and G-type).", "The paper proposes uniaxial strain as a control parameter to distinguish these hidden magnetic configurations.", "Strain-induced symmetry reduction allows for the clear identification of the specific altermagnetic order.", "This provides a practical pathway for characterizing altermagnets in real materials."]}}, {"title": "Dual Hall effects in the altermagnet Ta2Te2O with strain-induced valley switching effect", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/yqgb-td6q", "authors": "Hanbo Sun, Chao Wu, Pengqiang Dong, Yanchao She, Ping Li", "last_authors": "Yanchao She, Ping Li", "summary": "Strain engineering serves as an effective approach for tuning diverse properties in quantum materials and electronic devices. One may establish a dual Hall effect based on the systematic response to the uniaxial strain induced symmetry reduction in multifunctional materials. Here, we predict a stabl…", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Direct connection to altermagnetism interest.", "tags": ["altermagnet", "Halleffect"], "image": "", "briefing": {"background": "알터마그네틱 물질은 고유의 대칭성 파괴로 인해 비자성체임에도 불구하고 밴드 구조에서의 스핀 분할이 일어나며, 이는 비전통적인 홀 효과를 유도할 수 있습니다.", "motivation": "일축 압력을 통해 대칭성을 제어하고, 이로 인해 유도되는 이중 홀 효과(dual Hall effect)와 밸리 스위칭 현상을 연구하고자 합니다.", "result": "Ta2Te2O 물질에서 압력에 의한 결정 구조의 변화가 밸리(valley) 간의 스핀 분할을 제어하여 홀 전도도를 정밀하게 조절할 수 있음을 예측했습니다.", "implication": "알터마그넷을 이용한 밸리트로닉스 및 자기 소자 분야에서 외부 물리적 자극을 통한 정보 제어 가능성을 시사합니다.", "novelty": "알터마그네티즘과 밸리트로닉스를 결합하여, 압력에 의한 '밸리 스위칭'을 제어 변수로 도입했다는 점이 독창적입니다.", "unresolved": "실제 구현 시 압력에 따른 밸리 간 산란(scattering) 정도에 대한 정량적 분석은 추가 연구가 필요합니다.", "future_work": "실험적인 저온 수송 측정 및 해당 물질의 밸리 분할을 확인하기 위한 ARPES 연구가 필요합니다.", "concepts": [{"term": "Valley switching", "why_emerged": "에너지 밴드의 국소 최소점인 '밸리'를 정보 비트로 활용하여 데이터 처리 속도를 높이기 위해.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "Graphene, TMDC, 스핀-밸리 결합."}, {"term": "Dual Hall effects", "why_emerged": "일반적인 홀 효과 외에 스핀이나 밸리 자유도에 의해 유도되는 추가적인 홀 반응을 분리해내기 위해 필요함.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "Anomalous Hall effect, Spin Hall effect, Berry curvature."}], "english_summary": ["Predicts the existence of dual Hall effects in the altermagnet Ta2Te2O.", "Uniaxial strain is utilized to break crystal symmetry and induce valley switching.", "The study demonstrates effective control of electronic transport properties via strain engineering.", "Suggests a potential route for altermagnet-based valleytronics devices."]}}, {"title": "Edge states of a Bi2Se3 nanosheet in a perpendicular magnetic field", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/5xrk-zq8m", "authors": "S. P. J. Koenis, L. Maisel Licerán, H. T. C. Stoof", "last_authors": "L. Maisel Licerán, H. T. C. Stoof", "summary": "Conventional wisdom dictates that the conducting edge states of two-dimensional topological insulators of the ${\\mathrm{Bi}}_{2}{\\mathrm{Se}}_{3}$ family are protected by time-reversal symmetry. However, theoretical bulk calculations and a recent experiment show that the edge states persist in the p…", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Topological insulator study relevant to understanding edge state resilience.", "tags": ["topological", "Bi2Se3"], "image": "", "briefing": {"background": "위상 절연체(TI)는 물질 내부와 달리 표면에서 전도성을 띠는 엣지 상태(edge state)가 존재하며, 이는 시간 반전 대칭성에 의해 강력하게 보호됩니다.", "motivation": "통념상 시간 반전 대칭성에 의해 보호된다고 알려진 Bi2Se3 가족 물질의 엣지 상태가 자기장 하에서도 왜 사라지지 않고 지속되는지 규명하고자 합니다.", "result": "수직 자기장이 가해진 상태에서도 Bi2Se3 나노시트의 엣지 상태가 여전히 존재할 수 있음을 이론적 모델링을 통해 확인했습니다.", "implication": "위상학적 보호가 예상보다 훨씬 강력하거나, 자기장 하에서도 유지되는 비전통적인 메커니즘이 작용함을 시사합니다.", "novelty": "기존에 '당연히 보호될 것'이라 여겨지던 위상적 경계 상태의 한계를 자기장 상황에서 재조명하여 학계의 통념을 재검토했습니다.", "unresolved": "실제 실험에서 관측된 데이터가 자기장의 세기와 어떻게 정량적으로 일치하는지에 대한 미시적 기작은 추가 논의가 필요합니다.", "future_work": "고자기장 하에서의 저온 수송 특성 측정 및 엣지 상태의 파동함수 구조에 대한 더 정밀한 분석이 요구됩니다.", "concepts": [{"term": "Bi2Se3 family", "why_emerged": "3차원 위상 절연체의 대표적인 모델 물질로서, 넓은 밴드갭과 간단한 표면 상태를 가져 실험적 검증이 용이함.", "origin": "2009년경 Hsieh et al. 등에 의해 실험적으로 확립됨.", "connections": "Z2 invariant, Dirac cone, Spin-momentum locking."}, {"term": "Edge states", "why_emerged": "위상 절연체의 벌크(bulk)와 진공 사이의 경계에서 나타나는 위상학적 특이 상태를 정의하기 위해.", "origin": "Kane & Mele(2005) 등 위상 절연체 이론의 태동과 함께 등장.", "connections": "Quantum Hall effect, Topological insulator, Time-reversal symmetry."}], "english_summary": ["Investigates the robustness of Bi2Se3 edge states under perpendicular magnetic fields.", "Challenges the conventional view that edge states are solely protected by time-reversal symmetry.", "Theoretical modeling explains the persistence of conducting channels in high magnetic fields.", "Provides insights into the stability of topological phases in real experimental environments."]}}, {"title": "Interface-localized states mediate ultrafast cooling of hot electrons in epitaxial graphene", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/l7qv-85gw", "authors": "R. Stefanuik, A. Kuklin, T. Leitner, et al.", "last_authors": "H. Rensmo, R. Knut", "summary": "In this study, we use time- and angle-resolved photoelectron spectroscopy to investigate electron relaxation dynamics in an epitaxially grown graphene monolayer on SiC. Our findings reveal significantly faster relaxation of photoexcited electrons in non-hydrogen-intercalated epitaxial graphene compared to that for previously reported hydrogen-intercalated graphene structures. The differences in relaxation time are modeled by a combination of density function theory in conjunction with nonadiabatic molecular dynamics, providing a comprehensive explanation of electron relaxation pathways. This study highlights the critical influence of substrate interactions on the relaxation mechanisms in graphene, offering different perspectives for tailoring graphene electronic properties through controlled intercalation techniques.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Direct TR-ARPES experimental study of electron dynamics in graphene.", "tags": ["TR-ARPES", "graphene", "dynamics"], "image": "", "briefing": {"background": "그래핀은 높은 이동도로 주목받지만, 소자 응용을 위해서는 들뜬 전자들의 에너지 완화 경로를 이해하는 것이 필수적입니다. 기판과의 상호작용은 이러한 동역학에 큰 영향을 미칩니다.", "motivation": "에피택셜 그래핀(SiC 기판 위 성장)에서 수소 삽입 여부에 따라 전자 완화 속도가 달라지는 근본 원인을 규명하고자 합니다.", "result": "비수소 삽입 그래핀에서는 계면 국소 상태(interface-localized states)가 존재하여 핫 전자들의 냉각 속도를 가속화함을 TR-ARPES와 비단열 분자 동역학 계산을 통해 밝혀냈습니다.", "implication": "기판과의 계면 제어를 통해 그래핀의 초고속 전자 응답 특성을 능동적으로 조절할 수 있는 설계 원리를 제시합니다.", "novelty": "TR-ARPES를 활용해 기판 계면 상태가 전하 캐리어 동역학에 직접적으로 미치는 기여를 실험적으로 분리해냈다는 점이 핵심입니다.", "unresolved": "계면 상태의 정확한 공간적 분포와 수소 삽입이 정확히 어떤 국소 포논 모드를 억제하는지에 대한 세부 데이터는 추가 연구가 필요합니다.", "future_work": "다양한 삽입 원자를 이용한 계면 엔지니어링을 통해 그래핀 기반 광전자 소자의 성능 최적화 연구가 기대됩니다.", "concepts": [{"term": "TR-ARPES", "why_emerged": "물질 내의 들뜬 상태를 시간 분해능을 가지고 직접 관측하기 위해 필요합니다.", "origin": "90년대 후반 기술 발전으로 확립.", "connections": "상관관계 전자계 연구, 비평형 상태의 quasiparticle 동역학 측정."}, {"term": "핫 전자(Hot electrons)", "why_emerged": "광 여기 후 격자보다 높은 에너지를 가진 전자의 비평형 상태를 기술하기 위해 필요합니다.", "origin": "초기 고체물리 반도체 연구.", "connections": "전자-포논 산란, 에너지 완화 경로."}], "english_summary": ["Investigated electron relaxation in epitaxial graphene on SiC using TR-ARPES.", "Identified that interface-localized states significantly accelerate hot electron cooling.", "Showed that hydrogen intercalation suppresses these channels, slowing down relaxation.", "Combined TR-ARPES with nonadiabatic molecular dynamics to confirm findings."]}}, {"title": "Interplay of flat-band and Anderson localization in disordered moiré superlattices", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/zdy6-y6bt", "authors": "Qian Liu, Xiaoshuang Xia, Junjie Wang, et al.", "last_authors": "Daohong Song, Yi Liang", "summary": "Disorder in moiré superlattices simultaneously degrades flat-band localization and induces Anderson localization, yet how these two regimes interact has remained unclear. Here, we introduce a combined framework linking localization‐length scaling with differential probability density analysis to map…", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Directly relevant to moiré physics and strongly correlated electronic structure.", "tags": ["moiré", "localization", "correlated-electrons"], "image": "", "briefing": {"background": "모아레 초격자 시스템은 평탄 밴드(flat-band)에서의 강한 상관관계 효과를 연구하는 플랫폼입니다. 그러나 실제 물질에는 항상 무질서(disorder)가 존재합니다.", "motivation": "평탄 밴드에서 발생하는 국소화 현상과 무질서에 의한 앤더슨 국소화가 어떻게 상호작용하고 경쟁하는지 규명하고자 합니다.", "result": "국소화 길이 스케일링과 확률 밀도 분석을 결합하여 무질서가 평탄 밴드의 특성을 어떻게 변형시키는지 보여주는 통합 프레임워크를 개발했습니다.", "implication": "모아레 시스템에서 관측되는 상관관계 현상의 강건성을 이해하고, 소자 구현 시 무질서의 영향을 예측할 수 있습니다.", "novelty": "단순 현상론적 접근이 아니라 두 국소화 메커니즘의 상호작용을 정량적으로 매핑했다는 점이 이론적으로 중요합니다.", "unresolved": "실제 실험적 모아레 시스템에서 발생하는 국소적 전위 변동을 완전히 반영하는지에 대한 검증이 필요합니다.", "future_work": "이 프레임워크를 기반으로 꼬인 이중층 그래핀이나 전이금속 디칼코게나이드 모아레 소자의 물리적 한계를 탐구할 예정입니다.", "concepts": [{"term": "평탄 밴드(Flat-band)", "why_emerged": "운동 에너지가 억제되어 전자 간 상호작용이 지배적인 상태를 설명하기 위해 도입.", "origin": "초기 강상관계 물리.", "connections": "모아레 엑시톤, 상관관계 절연체, 초전도."}, {"term": "앤더슨 국소화", "why_emerged": "무질서가 존재하는 시스템에서 파동 함수의 국소화를 설명하기 위해 도입.", "origin": "Philip W. Anderson (1958).", "connections": "비전도성 상태, 무질서 시스템의 전송 현상."}], "english_summary": ["Explored the competition between flat-band localization and Anderson localization in moiré superlattices.", "Developed a combined framework using localization-length scaling and probability density analysis.", "Quantified how disorder degrades the correlated states characteristic of moiré systems.", "Provides a foundation for understanding the robustness of quantum states in disordered moiré materials."]}}, {"title": "Layer-selective proximity symmetry breaking enables anomalous and nonlinear Hall responses in 1H−NbX2 (X=S, Se, Te)", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/bmwn-9jk5", "authors": "Yusuf Wicaksono, Toshikaze Kariyado", "last_authors": "Yusuf Wicaksono, Toshikaze Kariyado", "summary": "Nonlinear Hall responses provide an electrical probe of Berry-curvature dipoles, but they are symmetry forbidden in many pristine two-dimensional metals. We show that layer-selective magnetic proximity provides a symmetry-controlled route to induce and tune anomalous and nonlinear Hall responses in …", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Strong relevance to topological materials, Berry curvature, and dichalcogenides.", "tags": ["NbX2", "topology", "Berry-curvature"], "image": "", "briefing": {"background": "비선형 홀 효과는 시간 반전 대칭이 깨진 시스템에서 베리 곡률 다이폴(Berry curvature dipole)을 측정하는 강력한 도구입니다.", "motivation": "대칭성으로 인해 비선형 홀 응답이 금지된 2차원 금속 시스템에서, 이를 유도하고 제어할 수 있는 방법을 찾고자 합니다.", "result": "1H-NbX2 층상 구조에서 자기 근접 효과(magnetic proximity effect)를 층별로 선택적으로 적용하여 비선형 홀 효과를 유도 및 제어할 수 있음을 입증했습니다.", "implication": "자기적 위상 물질의 비선형 전송 특성을 전기적으로 제어하는 새로운 설계 방식을 제공합니다.", "novelty": "NbX2와 같은 112형 텔루라이드/칼코게나이드 시스템에서 층간 대칭성 파괴를 통해 위상 물성을 엔지니어링했다는 점에서 독창적입니다.", "unresolved": "실제 실험에서 층 선택적인 자기 근접 효과를 구현하는 기술적 난이도가 높으며, 다층 구조에서의 자기적 균일성 확보가 과제입니다.", "future_work": "실험적 층상 소자 제조와 자기장 하에서의 전기적 수송 측정 연구가 필요합니다.", "concepts": [{"term": "베리 곡률 다이폴", "why_emerged": "비선형 홀 효과의 기원을 운동량 공간의 베리 곡률 분포와 연결하기 위해 도입.", "origin": "Fu (2015).", "connections": "비선형 응답, 위상 물질, 전송 현상."}, {"term": "자기 근접 효과", "why_emerged": "비자성 물질에 자기적 질서를 주입하여 새로운 위상 상태를 창출하기 위해 도입.", "origin": "초기 초전도-강자성체 연구.", "connections": "반이상 홀 효과, 위상 절연체."}], "english_summary": ["Investigated symmetry-controlled Hall responses in 2D 1H-NbX2 metals.", "Proposed layer-selective magnetic proximity as a method to induce non-linear Hall effects.", "Demonstrated that Berry curvature dipoles can be tuned through symmetry breaking.", "Offers a new pathway for electrical control of topological transport in transition metal dichalcogenides."]}}, {"title": "Magnetoelastoresistivity in FeSe", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/qq37-26x6", "authors": "M. Wissmann, L. Fanfarillo, X.-C. Hong, et al.", "last_authors": "G. Seibold, F. Caglieris", "summary": "FeSe stands out among iron-based superconductors due to its extended nematic phase without the onset of long-range magnetic order. While strain-dependent electrical resistivity has been extensively explored to probe nematicity, its influence on magnetotransport properties remains less understood. In this work, we present measurements of the magnetoelastoresistivity in FeSe as a function of temperature and applied magnetic field. Using a minimal multiband Boltzmann model for transport we derive analytical expressions that capture the magnetic behavior of the whole set of experimental data both in the paramagnetic and in the nematic phase. These findings indicate that a multiband framework can robustly describe the magnetoelasto-transport properties in FeSe and arguably in other iron-based superconductors.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Direct relevance to nematicity and FeSe physics.", "tags": ["FeSe", "nematicity", "transport"], "image": "", "briefing": {"background": "철 기반 초전도체(FeSe)는 장거리 자기 질서 없이 네마틱(nematic) 상이 길게 지속되는 독특한 물성을 보여주며, 전자-격자 결합과 네마틱 요동의 기원을 연구하는 핵심 모델 시스템입니다.", "motivation": "기존에는 변형률에 따른 전기 저항 변화(elastoresistivity) 연구가 주로 이루어졌으나, 자기장 하에서의 수송 현상(magnetoelastoresistivity)에 대한 이해가 부족하여 이를 통합적으로 설명하고자 합니다.", "result": "FeSe의 자기-탄성-수송 특성을 다중 밴드(multiband) 볼츠만 수송 모델로 성공적으로 기술하였으며, 상자성 상과 네마틱 상 전반에 걸쳐 실험 데이터를 일관되게 설명했습니다.", "implication": "FeSe뿐만 아니라 다른 철 기반 초전도체에서도 다중 밴드 물리 모델이 네마틱 및 자기적 거동을 이해하는 강력한 도구가 될 수 있음을 시사합니다.", "novelty": "자기장과 탄성 변형을 동시에 결합한 수송 측정 기법을 도입하여 FeSe의 네마틱 위상에 대한 미시적 이해를 높였으며, ARPES와 같은 분광학적 데이터와의 비교 연구 기반을 마련했습니다.", "unresolved": "이 모델이 네마틱 상의 미시적인 파라미터(예: 오비탈 분리도 등)를 얼마나 정량적으로 정확히 추론할 수 있는지에 대한 추가 검증이 필요합니다.", "future_work": "다른 Fe-based 초전도체로의 모델 적용 및 변형률 제어 하에서의 자기 저항 이방성 연구가 기대됩니다.", "concepts": [{"term": "네마틱성(Nematicity)", "why_emerged": "결정 구조의 회전 대칭성이 깨지면서 전자 구조가 비등방성을 띠는 현상을 기술하기 위해 도입되었습니다.", "origin": "액정 물리학에서 차용되었으나, 강상관 전자계에서는 2000년대 중반 철 기반 초전도체 연구에서 본격화되었습니다.", "connections": "전자 네마틱 위상, 스핀-오비탈 결합, 강상관 전자계의 비등방성."}, {"term": "Magnetoelastoresistivity", "why_emerged": "탄성 변형과 자기장이 전자 수송에 미치는 영향을 동시에 측정하여 산란 메커니즘과 페르미 표면의 이방성을 규명하기 위함입니다.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "압전 소자를 이용한 변형률 제어, 자기 저항(Magnetoresistance)."}], "english_summary": ["Investigates the magnetoelastoresistivity in FeSe under magnetic fields and strain.", "Uses a multiband Boltzmann model to fit transport data across paramagnetic and nematic phases.", "Demonstrates that multiband effects are crucial for understanding transport in iron-based superconductors.", "Provides a robust framework for interpreting nematicity-related transport phenomena."]}}, {"title": "NMR evidence of pairing fluctuations above Tc and absence of spin magnetism in the time-reversal symmetry-breaking state of Ba1−xKxFe2As2", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/928z-jgcx", "authors": "Florian Bärtl, Nadia Stegani, Federico Caglieris, et al.", "last_authors": "Hannes Kühne, Vadim Grinenko", "summary": "Four- or higher-order fermionic condensates can form in non-BCS multicomponent superconductors. Here, the authors present spectroscopic evidence for pairing correlations that appear well above the superconducting critical temperature in the highly overdoped Ba 1 − x K x Fe 2 As 2 system with broken time-reversal symmetry (BTRS). The NMR and μ SR findings show that multicomponent superconductivity appears homogeneously throughout the entire sample volume and that the BTRS state is unrelated to conventional spin magnetism.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Important experiment on TRSB in pnictide superconductors.", "tags": ["superconductivity", "TRSB", "NMR"], "image": "", "briefing": {"background": "Ba1-xKxFe2As2와 같은 Pnictide 계열은 도핑에 따라 초전도성과 자기 질서가 경쟁하며, 일부 영역에서는 시간 반전 대칭성 깨짐(TRSB)이 보고되어 초전도 상태의 대칭성에 대한 논의가 활발합니다.", "motivation": "초전도 전이 온도(Tc) 이상에서 나타나는 페어링 요동과 TRSB 상태가 스핀 자기 모멘트와 관련이 있는지 명확히 밝히고자 합니다.", "result": "NMR 및 μSR 실험을 통해 Tc보다 높은 온도에서 균일한 페어링 상관관계가 존재함을 확인하였으며, TRSB 상태가 통상적인 스핀 자기 정렬과는 무관함을 증명했습니다.", "implication": "다성분(multicomponent) 초전도체에서의 페어링 메커니즘이 비-BCS 형태의 고차 페르미온 응축으로 설명될 가능성이 높음을 시사합니다.", "novelty": "전체 시료 부피에서 나타나는 균일한 TRSB 현상을 규명하여, 국부적인 결함에 의한 효과가 아닌 물질 고유의 다성분 초전도 특성임을 입증했습니다.", "unresolved": "다성분 초전도체의 구체적인 질서 변수(order parameter)의 결합 형태와 물리적 기원은 여전히 미스터리로 남아 있습니다.", "future_work": "고해상도 ARPES를 통해 Tc 이상에서의 갭 구조(pseudogap 또는 fluctuation gap)를 직접 관측하는 연구가 필요합니다.", "concepts": [{"term": "시간 반전 대칭성 깨짐 (TRSB)", "why_emerged": "초전도 상태에서 자기장이 외부 자기장 없이도 자발적으로 발생하는 현상을 설명하기 위해 도입되었습니다.", "origin": "초전도 이론 초기부터 거론되었으나 실험적 확립은 2000년대 Sr2RuO4 연구 등에서 본격화되었습니다.", "connections": "카이랄 초전도성, 다성분 초전도, μSR 분석."}, {"term": "Ba1-xKxFe2As2", "why_emerged": "철 기반 초전도 연구에서 홀 도핑(hole doping)에 따른 상도(phase diagram)를 연구하는 표준 물질입니다.", "origin": "2008년 철 기반 초전도체 발견 직후 주요 연구 대상이 되었습니다.", "connections": "Pnictide 초전도체, 자기적 요동, 스핀 밀도 파동(SDW)."}], "english_summary": ["Provides spectroscopic evidence of pairing correlations above Tc in overdoped Ba1-xKxFe2As2.", "Uses NMR and μSR to confirm that the time-reversal symmetry breaking (BTRS) state is bulk and non-magnetic.", "Supports the existence of multicomponent superconductivity and non-BCS fermionic condensates.", "Separates TRSB signatures from conventional spin-based magnetism."]}}, {"title": "Spin-orbit coupling effects in altermagnets: Interplay of weak spin and orbital ferromagnetism with relativistic splitting of electron states", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/dyg2-5578", "authors": "L. M. Sandratskii, K. Carva, V. M. Silkin", "last_authors": "K. Carva, V. M. Silkin", "summary": "The novel class of collinear compensated magnets, dubbed altermagnets, has attracted immense research attention by the property of nonrelativistic spin splitting. More recently, the properties of altermagnets caused by relativistic spin-orbit coupling (SOC) became the topic of many investigations. T…", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "High-relevance theory on altermagnets with direct implications for electronic splitting.", "tags": ["altermagnet", "spin-orbit"], "image": "", "briefing": {"background": "알터마그넷(Altermagnet)은 비상대론적 스핀 분리를 통해 스핀 분극된 페르미 표면을 가지는 새로운 자기 상으로, 강자성체와 반강자성체의 특성을 동시에 가집니다.", "motivation": "알터마그넷에서 스핀-오비탈 결합(SOC)이 전자 상태의 릴레이티비스틱(relativistic) 분리에 어떤 영향을 미치는지 이론적으로 정립하고자 합니다.", "result": "SOC가 알터마그넷의 미세한 스핀 및 오비탈 강자성체적 특성과 어떻게 상호작용하는지 분석하고, 이를 통해 전자 상태의 분리 현상을 재해석했습니다.", "implication": "알터마그넷의 전자 구조를 이해할 때 SOC의 효과를 반드시 고려해야 하며, 이는 향후 spintronics 소자 설계의 이론적 토대가 됩니다.", "novelty": "단순한 비상대론적 분리를 넘어, SOC가 알터마그넷의 고유한 대칭성과 결합할 때 발생하는 물리적 효과를 명확히 했습니다.", "unresolved": "실제 복잡한 격자 구조를 가진 altermagnet 물질에서 SOC에 의한 미세한 밴드 변화가 RIXS나 ARPES 측정으로 확인 가능한 수준인지에 대한 정량적 분석이 부족합니다.", "future_work": "다양한 altermagnet 물질군에 대한 계산을 확장하고, 실험적으로 관측 가능한 스핀-텍스처 변화를 예측하는 연구가 필요합니다.", "concepts": [{"term": "알터마그넷(Altermagnet)", "why_emerged": "강자성체와 반강자성체의 분류를 넘어서는 새로운 스핀 대칭성을 가진 물질을 기술하기 위해 제안되었습니다.", "origin": "최근 1-2년 내 이론적으로 급부상한 개념입니다.", "connections": "스핀-스플리팅, Berry curvature, 반강자성 spintronics."}, {"term": "스핀-오비탈 결합(SOC)", "why_emerged": "전자의 스핀과 궤도 운동 사이의 상호작용이 전자 구조와 자기적 특성에 미치는 효과를 설명하기 위해 도입되었습니다.", "origin": "원자 물리학의 Dirac 방정식에서 기원합니다.", "connections": "Rashba 효과, 위상 절연체, 스핀 홀 효과."}], "english_summary": ["Analyzes the impact of spin-orbit coupling (SOC) on altermagnets.", "Examines the interplay between weak spin/orbital ferromagnetism and relativistic electron splitting.", "Provides a theoretical framework for relativistic band splitting in collinear compensated magnets.", "Enhances the understanding of electronic structures in altermagnetic materials."]}}, {"title": "Superconductivity mediated by nematic fluctuations: The dispersion of collective modes", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/dn6s-8b5y", "authors": "Kazi Ranjibul Islam, Andrey Chubukov", "last_authors": "Kazi Ranjibul Islam, Andrey Chubukov", "summary": "We analyze the spectrum of collective modes in a superconductor, in which pairing is mediated by long-range nematic fluctuations. Previous experimental and theoretical studies have found that a superconducting gap in such a system is highly anisotropic and at any finite $T<{T}_{c}$ vanishes on fo…", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Relevant to nematicity and unconventional superconductivity.", "tags": ["superconductivity", "nematicity", "theory"], "image": "", "briefing": {"background": "네마틱 요동(nematic fluctuations)은 전자 시스템의 회전 대칭성이 자발적으로 깨질 때 나타나며, 이는 철 기반 초전도체 등 비전통적 초전도 현상의 핵심 기제로 주목받고 있습니다.", "motivation": "기존 연구들은 네마틱 요동이 매개하는 초전도체에서 간극이 매우 이방적이며 온도에 따라 특정 지점에서 0이 됨을 보였으나, 이러한 시스템 내의 집단 들뜸 모드(collective modes)의 분산 관계에 대한 상세한 분석이 필요했습니다.", "result": "네마틱 요동에 의해 매개되는 초전도체 내의 집단 들뜸 모드 스펙트럼을 체계적으로 분석하여 이들의 분산 관계를 규명했습니다.", "implication": "이론적 결과가 실험적으로 관측될 경우, 네마틱 초전도체의 동역학적 특성을 이해하고 초전도 메커니즘을 규명하는 데 중요한 척도가 될 것입니다.", "novelty": "네마틱 요동과 관련된 초전도체의 복잡한 이방적 간극 구조 하에서 집단 들뜸의 정량적 분산을 다룬 점에서 이론적으로 중요합니다.", "unresolved": "초록의 내용만으로는 특정 물질계에 대한 직접적인 실험 데이터와의 비교나 강결합 영역에서의 상세한 보정은 명확하지 않습니다.", "future_work": "ARPES나 RIXS와 같은 실험 기법을 통해 해당 집단 들뜸 모드의 에너지 분산을 직접 관측하는 연구가 이어질 것으로 보입니다.", "concepts": [{"term": "네마틱 요동", "why_emerged": "전자계의 회전 대칭성이 깨지는 전이 근처에서 나타나는 강한 전자 상관관계를 설명하기 위해 도입됨.", "origin": "초록 정보만으로는 특정하기 어려움 (비전통적 초전도체 분야에서 수십 년간 연구됨).", "connections": "철 기반 초전도체, 페르미 표면 변형, 이방성 초전도체."}, {"term": "집단 들뜸 모드", "why_emerged": "다체 시스템에서 전자들이 협동하여 나타내는 들뜸을 이해하기 위해 필요.", "origin": "Landau Fermi liquid theory 등에 기반을 둠.", "connections": "Goldstone 모드, 힉스 모드, 초전도체 내의 진폭 모드."}], "english_summary": ["Analyzes collective mode spectra in superconductors mediated by nematic fluctuations.", "Addresses the highly anisotropic superconducting gap structure.", "Provides theoretical insight into the dispersion of modes at finite temperature.", "Relevant to understanding the interplay between nematicity and unconventional superconductivity."]}}, {"title": "Three-dimensional zigzag correlations in the van der Waals Kitaev magnet RuBr3", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/zwvv-5594", "authors": "H. Gretarsson, R. Iwazaki, F. Sato, et al.", "last_authors": "B. Keimer, H. Suzuki", "summary": "Van der Waals materials can be exfoliated into ultrathin sheets, suggesting that their magnetism should also be two-dimensional. Using resonant x-ray scattering, the authors reveal here a different picture in the Kitaev magnet RuBr 3 : zigzag magnetic correlations exhibit spectral weight redistribution along the interlayer direction. Bromine’s spatially extended 4 p orbitals strengthen interlayer magnetic interactions. The results demonstrate that an exfoliable crystal can host three-dimensional magnetism, challenging a common assumption about layered quantum materials and showing how ligand chemistry controls magnetic dimensionality.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Important X-ray scattering study on magnetic dimensionality in Kitaev magnets.", "tags": ["Kitaev", "vanderWaals", "magnetism"], "image": "", "briefing": {"background": "반데르발스 물질은 층상 구조 덕분에 2차원 자기학의 이상적인 플랫폼으로 간주되지만, 층간 상호작용이 무시될 수 있는지에 대해서는 늘 논쟁이 있습니다.", "motivation": "RuBr3는 키타예프 자성체 후보 물질로서 2차원 층상 구조를 가짐에도 불구하고, 실제 자성 차원이 어떻게 발현되는지에 대한 실험적 규명이 필요했습니다.", "result": "공명 X선 산란 실험을 통해 RuBr3 내의 지그재그 자기 상관관계가 층간 방향으로도 상당한 스펙트럼 가중치를 가짐을 발견했습니다.", "implication": "반데르발스 물질이라 하더라도 리간드 화학(Br의 4p 궤도 확장성)에 따라 강한 3차원 자성이 나타날 수 있음을 보였습니다.", "novelty": "키타예프 물질의 2차원 가정에 의문을 제기하고, 실제 물질의 자성 차원이 층간 상호작용에 의해 결정됨을 실험적으로 명확히 입증했습니다.", "unresolved": "이러한 3차원 자기 구조가 이 물질의 양자 스핀 액체 후보 상태에 어떤 영향을 미치는지 구체적으로 규명되어야 합니다.", "future_work": "층간 결합을 제어하거나 다른 할로겐 원자로 치환했을 때의 자기적 위상 변화 연구가 예상됩니다.", "concepts": [{"term": "키타예프 자성체", "why_emerged": "벌집 격자에서 강한 스핀-궤도 결합을 통해 양자 스핀 액체를 구현하기 위해 제안됨.", "origin": "Alexei Kitaev (2006).", "connections": "스핀-궤도 결합, 5d 전이금속 화합물, 양자 스핀 액체."}, {"term": "공명 X선 산란", "why_emerged": "특정 원소의 전자가 특정 에너지의 X선과 공명하여 자기적 정보를 민감하게 추출하기 위해 필요.", "origin": "1990년대 이후 자기 구조 연구에 널리 도입됨.", "connections": "중성자 산란, 자기 차수 결정."}], "english_summary": ["Investigates the magnetic dimensionality of the van der Waals Kitaev magnet RuBr3.", "Resonant x-ray scattering reveals 3D zigzag magnetic correlations.", "Challenges the assumption of purely 2D magnetism in exfoliated quantum materials.", "Highlights the role of spatially extended ligand 4p orbitals in interlayer interactions."]}}, {"title": "Emergent Surface Altermagnetism", "journal": "PRL_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/hw4l-jknk", "authors": "Yuzhong Hu, Pan Zhou, Baoru Pan, Songmin Liu, Binchang Zhou, Lizhong Sun", "last_authors": "Binchang Zhou, Lizhong Sun", "summary": "Research on altermagnetism has thus far primarily focused on spin-polarized bulk electronic states in magnetic materials. In this work, we advance the field by introducing the concept of surface altermagnetism (SAM), wherein altermagnetic spin polarization emerges at the surfaces of collinear antife…", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Introduces surface altermagnetism in magnetic materials, directly relevant to user's interests.", "tags": ["altermagnetism", "magneticmaterials", "theory", "surfacephysics"], "image": "", "briefing": {"background": "알터자성(Altermagnetism)은 최근 자성학에서 새롭게 분류된 위상으로, 벌크 상태에서 특정 대칭성에 의해 스핀 분극이 발생하는 비자성적(antiferromagnetic) 질서를 의미합니다.", "motivation": "기존 알터자성 연구가 주로 벌크 전자 상태에 집중되어 있었으나, 표면이라는 불연속적인 환경에서의 자기적 특성에 대한 이해가 부족했습니다.", "result": "공선형 반강자성체의 표면에서 알터자성 스핀 분극이 창발(emergent)할 수 있음을 이론적으로 증명했습니다.", "implication": "표면 알터자성은 비자성 물질을 이용한 스핀트로닉스 소자 구현에 새로운 설계 지침을 제공할 수 있습니다.", "novelty": "표면 효과를 통해 알터자성이라는 개념을 확장하였으며, 이는 표면 감도가 높은 ARPES 연구자에게 직접적으로 관련이 있습니다.", "unresolved": "이론적 제안 단계이며, 실제 물질 표면에서의 실험적 관측(Spin-resolved ARPES 등)이 뒷받침되어야 합니다.", "future_work": "표면 알터자성 효과를 극대화할 수 있는 특정 결정면이나 물질 후보군에 대한 정밀한 전자구조 계산이 필요합니다.", "concepts": [{"term": "알터자성", "why_emerged": "강자성도 반강자성도 아닌 제3의 자기 위상을 설명하기 위해 제안됨.", "origin": "최근 수년 내 이론적으로 급부상 (Jungwirth 등).", "connections": "반강자성, 스핀 분극, 베리 곡률."}, {"term": "공선형 반강자성체", "why_emerged": "스핀이 일직선상에서 반대로 배열되는 가장 기본적인 반강자성 유형을 정의하기 위해 필요.", "origin": "Louis Néel (1930년대).", "connections": "자기 구조 분석, 중성자 회절."}], "english_summary": ["Introduces the concept of surface altermagnetism (SAM).", "Demonstrates that altermagnetic spin polarization emerges at the surfaces of collinear antiferromagnets.", "Extends the study of altermagnetism beyond bulk electronic states.", "Opens new possibilities for surface-based spintronic applications."]}}, {"title": "Engineering Quantum Criticality in the Integer Quantum Hall Regime through a Screening Layer", "journal": "PRL_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/7vkh-q7rd", "authors": "C. T. Tai, P. T. Madathil, A. Gupta, L. N. Pfeiffer, K. W. Baldwin, and M. Shayegan", "last_authors": "A. Gupta, L. N. Pfeiffer, K. W. Baldwin, and M. Shayegan", "summary": "A universal scaling exponent κ ≈ 0 . 42 corresponds to a dynamic exponent z = 1 in the integer quantum Hall regime in a bilayer GaAs quantum well device.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Experimental measurement of scaling and quantum criticality in the quantum Hall regime of semiconductor bilayers.", "tags": ["experiment", "quantumHall", "criticality"], "image": "", "briefing": {"background": "양자 홀 효과(QHE) 영역에서의 양자 임계 현상은 강상관 전자계의 보편적 거동을 이해하는 핵심 문제 중 하나입니다.", "motivation": "이중층 GaAs 양자 우물 구조에서 스크리닝 층을 도입하여 양자 홀 영역의 임계적 거동과 유니버설 스케일링 지수를 실험적으로 규명하고자 했습니다.", "result": "이중층 구조에서 동적 지수 z=1인 상태에 대응하는 보편적 스케일링 지수 κ ≈ 0.42를 관측했습니다.", "implication": "이 결과는 양자 홀 체제 내의 다양한 상전이 모델을 검증하고, 강상관 2차원 시스템의 양자 임계성에 대한 이론적 이해를 심화합니다.", "novelty": "이중층 GaAs 시스템의 정밀한 제어를 통해 실험적으로 얻기 어려운 양자 홀 영역의 보편적 임계 지수를 명확히 도출했다는 점이 중요합니다.", "unresolved": "이러한 보편적 거동이 다른 2차원 물질 시스템이나 더 높은 전하 밀도에서도 동일하게 적용되는지 여부는 추가 연구가 필요합니다.", "future_work": "다양한 스크리닝 환경에서의 스케일링 특성 비교 및 복합 이중층 시스템에서의 양자 상전이 연구가 예상됩니다.", "concepts": [{"term": "Quantum Criticality", "why_emerged": "절대 영도 근처의 양자 상전이에서 열적 요동 대신 양자 요동이 지배적인 영역을 설명하기 위해 필요함.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "Kondo 격자 모델, 중페르미온 시스템, 스케일링 이론과 밀접하게 연결됨."}, {"term": "Integer Quantum Hall Regime", "why_emerged": "2차원 전자 가스에 강한 자기장이 걸렸을 때 홀 저항이 양자화되는 현상을 이해하기 위해 도입됨.", "origin": "Klaus von Klitzing (1980).", "connections": "위상 절연체, Berry 위상, 토폴로지 전자 상태와 연결됨."}], "english_summary": ["Experimental investigation of quantum criticality in bilayer GaAs quantum well devices.", "Identified a universal scaling exponent κ ≈ 0.42 associated with a dynamic exponent z = 1.", "Provides insight into the critical behavior of the integer quantum Hall regime."]}}, {"title": "Imaging topological polar structures in marginally twisted 2D semiconductors", "journal": "Science_Advances", "source": "Gemini", "link": "https://doi.org/10.1126/sciadv.aed8555", "authors": "Thi-Hai-Yen Vu, Daniel Bennett, Gayani Nadeera Pallewela, et al.", "last_authors": "Michael S. Fuhrer, Mark T. Edmonds", "summary": "Moiré superlattices formed in van der Waals heterostructures by twisting, lattice mismatch and strain present an opportunity for creating metamaterials with unique properties absent in the individual layers. Ferroelectricity for example, arises from broken inversion symmetry in twisted and strained bilayers of 2D semiconductors with stacking domains of alternating out-of-plane polarization. However, the individual contributions of twist and strain to the formation of topological polar nanostructures remain unclear and experimentally challenging to resolve. Inversion symmetry breaking is predicted to generate in-plane polarization along the domain walls, forming topologically non-trivial Bloch-type merons (half-skyrmions) in twisted systems and Néel-type merons in strained systems. Here we utilize angle-resolved vector piezoresponse force microscopy to spatially resolve polarization components and topological polar nanostructures in marginally twisted bilayer WSe 2 , providing experimental evidence of topologically non-trivial meron/antimeron structures. This approach can be used to distinguish Bloch-type, Néel-type and hybrid structures, allowing us to quantify the separate contributions of strain and twist in a moiré superlattice, opening pathways for exploring twist-induced topology in engineered nano-devices.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Experimental imaging of topological polar structures in twisted bilayer WSe2 van der Waals heterostructure.", "tags": ["2Dmaterials", "moire", "topology", "WSe2", "ferroelectricity"], "image": "", "briefing": {"background": "반데르발스 이종접합의 모아레 패턴은 격자 불일치나 뒤틀림을 통해 새로운 물리적 현상을 유도할 수 있는 메타물질 플랫폼을 제공합니다.", "motivation": "뒤틀린 WSe2 이중층에서 나타나는 강유전성과 그 기저에 있는 위상학적 극성 구조(메론/안티메론)에 대한 뒤틀림과 변형의 개별 기여도를 분리하고자 했습니다.", "result": "벡터 압전 응답 현미경을 통해 뒤틀린 WSe2 내의 블로흐형 및 닐형 메론 구조를 시공간적으로 분해하여 관측했습니다.", "implication": "모아레 격자에서의 위상학적 극성 구조를 정밀하게 제어하고 식별할 수 있음을 입증하여, 토폴로지 기반 나노 소자 설계의 길을 열었습니다.", "novelty": "위상학적 메론 구조를 직접 이미징하여 변형과 뒤틀림이 각각 위상학적 상태에 미치는 영향을 실험적으로 정량화한 점이 독창적입니다.", "unresolved": "극저온이나 외부 자기장 조건 하에서의 위상학적 안정성 및 전환 메커니즘에 대해서는 추가 검증이 필요합니다.", "future_work": "위상학적 극성 나노 구조를 이용한 차세대 정보 저장 및 비휘발성 메모리 소자 응용 연구.", "concepts": [{"term": "Moiré Superlattice", "why_emerged": "두 2차원 층을 겹쳤을 때 주기적 간섭 패턴이 생기면서 전자 구조가 근본적으로 변화하는 현상을 기술하기 위해 필요함.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "뒤틀린 이중층 그래핀, 2차원 강유전체, 평탄 밴드 물리학."}, {"term": "Meron", "why_emerged": "위상학적으로 비자명한 2차원 스핀 또는 극성 텍스처를 기술하기 위해 도입된 반-스카이미온 개념.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "스카이미온, 위상학적 솔리톤, 비반전 대칭성."}], "english_summary": ["Imaging of topological polar nanostructures in twisted bilayer WSe2.", "Experimental resolution of Bloch-type and Néel-type merons using vector piezoresponse force microscopy.", "Distinguished the individual impacts of strain and twist on topological properties.", "Opens pathways for designing twist-induced topological nano-devices."]}}, {"title": "Subnanometer control and electrochemical mapping of a Pt monolayer catalyst for boosting ethanol oxidation", "journal": "Science_Advances", "source": "Gemini", "link": "https://doi.org/10.1126/sciadv.aeh8316", "authors": "Jia-Wei Zhu, Ming Zhang, Ji-Chun Wang, et al.", "last_authors": "Xiaoqing Huang, Yang Yang", "summary": "Strain engineering with atomical precision is considered the ultimate strategy for enhancing nanocatalyst activity. Although methods for strain modulation, such as elemental doping, core-shell structures, and defect engineering, have achieved substantial success, they inevitably alter catalyst composition, complicating the interpretation of strain effects. Herein, we developed a combined mechanically controlled break junction (MCBJ) and scanning electrochemical microscopy (SECM) method, enabling subnanometer control on the nanocatalyst structure and visual monitoring of electrochemical activity under continuous strain modulation without altering the material’s composition. As proof of principle, we prepared a monolayer of platinum (Pt) catalyst on a gold surface and applied continuous tensile strain to it using the MCBJ module. In situ x-ray diffraction and finite element simulations confirmed that the lattice spacing of the Pt monolayer catalyst was controlled with atomic precision. Electrochemical mapping using SECM revealed that the catalytic activity of the Pt monolayer catalyst follows a volcano-type trend with increasing strain, with optimal electrocatalytic activity for ethanol oxidation at 1.0% tensile strain. Density functional theory calculations and quasi–in situ x-ray photoelectron spectroscopy analysis indicate that tensile strain elevates the d-band center of Pt, enhancing the adsorption of both reactants and intermediates while facilitating charge transfer processes, resulting in enhanced performance in the final. This work provides an experimental method for studying the independent impact of strain engineering on the material performance, with both atomic precision and dynamic visualization, offering insights for the design of advanced electrocatalysts.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Uses scanning probe techniques and DFT to study electronic structure and strain effects in a Pt monolayer catalyst.", "tags": ["STS", "monolayer", "catalysis", "strainengineering", "DFT"], "image": "", "briefing": {"background": "촉매 성능 향상을 위한 변형 공학(Strain engineering)은 재료의 조성 변화 없이 물리적 특성을 미세 조정할 수 있는 강력한 방법입니다.", "motivation": "Pt 단일층 촉매에서 조성 변화 없이 오직 변형(Strain)만이 촉매 활성에 미치는 영향을 원자 정밀도로 측정하고자 했습니다.", "result": "MCBJ와 SECM을 결합하여 1% 인장 변형에서 Pt 촉매의 d-밴드 중심 이동이 에탄올 산화 활성을 극대화함을 확인했습니다.", "implication": "변형 효과를 독립적으로 분리해 냄으로써, 향후 고효율 전기화학 촉매 설계 시 구조적 변형을 정교하게 이용할 수 있는 근거를 마련했습니다.", "novelty": "조성 변화라는 교란 요인 없이 기계적으로 변형을 정밀 제어하면서 실시간 전기화학 활성 매핑을 시도한 실험 방법론의 혁신성.", "unresolved": "장기적인 촉매 내구성 관점에서 지속적인 변형이 가해질 때 발생하는 구조적 결함에 대한 영향은 불분명합니다.", "future_work": "다양한 귀금속 단일층에 대한 변형-활성 관계의 데이터베이스화 및 실용적인 연료전지 촉매 개발.", "concepts": [{"term": "d-band center", "why_emerged": "전이금속 표면의 흡착 에너지와 촉매 활성을 결정하는 전자 구조적 인자를 설명하기 위해 도입됨.", "origin": "Hammer & Nørskov (1995).", "connections": "Sabatier 원리, 표면 반응성, 밀도 범함수 이론(DFT)."}, {"term": "MCBJ (Mechanically Controllable Break Junction)", "why_emerged": "원자 수준의 접점이나 단일층에 변형을 가하거나 물리적 성질을 측정하기 위해 고안된 나노 공학 기술.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "주사 터널링 현미경(STM), 나노 역학, 단일 분자 전도도 측정."}], "english_summary": ["Subnanometer strain control of Pt monolayer catalysts using MCBJ technique.", "Identified that 1% tensile strain optimizes ethanol oxidation activity.", "DFT and spectroscopy reveal that tensile strain shifts the d-band center.", "Provides a methodology to isolate strain effects from compositional changes in catalysts."]}}, {"title": "A Unified Theory of Collective Magnon and Orbiton Excitations in Altermagnets", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2609.10708", "authors": "Bishal Das, Chanchal K. Barman, Aftab Alam", "last_authors": "Chanchal K. Barman, Aftab Alam", "summary": "Altermagnetism has recently emerged as a distinct collinear magnetic phase exhibiting momentum-dependent spin-splitting despite vanishing net magnetization, as a consequence of inequivalent non-magnetic environments. Lately, it has been proposed that strong electronic correlations may yield spontaneous altermagnetism due to orbital ordering even for equivalent non-magnetic environments. While previous studies have largely focused on the electronic structure, a unified understanding of the collective excitations associated with these two different microscopic mechanisms stabilizing altermagnetism remains absent. Here, we develop an extended Kugel'-Khomskiĭ spin-orbital model on a decorated square lattice that simultaneously incorporates inequivalent non-magnetic environments and correlation-driven orbital ordering within a common theoretical framework. Employing a self-consistent mean-field spin-wave orbital-wave formalism, we demonstrate the emergence of mutually unhybridized but interdependent magnon and orbiton excitations exhibiting characteristic chiral-splitting. We show that the splitting originates from two distinct microscopic contributions: a lattice-dependent term arising from inequivalent non-magnetic environments and an orbital-order-induced exchange-anisotropy term that survives even for crystallographically equivalent non-magnetic environments. The proposed framework therefore unifies the collective excitation spectra associated with both crystalline symmetry-mediated and orbitally-ordered altermagnetism. We further investigate the finite-temperature evolution of the coupled spin-orbital system, revealing the breakdown of spin-wave and orbital-wave approximations through spurious first-order transitions, while complementary classical Monte Carlo simulations recover the expected continuous second-order behaviour. Our work establishes a unified microscopic framework for understanding collective spin-wave and orbital-wave excitations in altermagnets and highlights the decisive role of the non-magnetic lattice environment in controlling their thermodynamic properties.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Unified theory of collective excitations in altermagnets, a direct user interest.", "tags": ["theory", "altermagnetism", "magnons", "orbitons"], "image": "https://arxiv.org/html/2609.10708v1/figs/fig1.png", "briefing": {"background": "알터마그네틱(Altermagnetism)은 순 자화값은 0이지만 운동량 의존적 스핀 분할이 나타나는 새로운 자기 상입니다. 이는 기존의 강자성(스핀 분극)이나 반강자성(스핀 분할 없음)과는 구분되는 물성입니다.", "motivation": "알터마그네틱을 안정화하는 두 가지 미시적 기전인 '비대칭 비자기 환경'과 '상관관계에 의한 궤도 정렬'을 통합하여, 이들의 집단 들뜸(magnon, orbiton)을 단일 프레임워크에서 이해하고자 함.", "result": "스핀-궤도 모델을 통해 매그논과 오비톤이 서로 혼성되지는 않으나 서로 의존적인 관계임을 밝혔으며, 격자 구조와 궤도 정렬이라는 두 원인이 각각 어떻게 카이랄 스핀 분할에 기여하는지 규명함.", "implication": "알터마그네틱의 열역학적 특성과 집단 들뜸 현상을 미시적으로 해석할 수 있는 통일된 이론적 토대를 마련함.", "novelty": "기존에 분리되어 연구되던 구조적 알터마그네틱과 상관관계 기반 알터마그네틱을 하나의 스핀-궤도 모델로 통합했다는 점이 중요함. 사용자 관심사인 전자 구조의 근본적인 이해에 기여함.", "unresolved": "평균장 근사치에서 발생하는 spurious한 1차 상전이 문제와 실제 물질에서의 정확한 스펙트럼 재현 여부.", "future_work": "실제 알터마그 s creates synthetic Weyl monopoles in momentum-bias space that transfer the Chern mismatch. We demonstrate two consequences: a direct transition between insulating Chern phases and a reentrant compensated metal in which Lifshitz transitions bound the metallic window while internal Weyl events reconstruct the band topology. Consequently, the fixed-filling Hall response remains continuous and nonquantized even as integer Chern number is transferred between bands. Berry-flux, TKNN, and interface calculations independently verify the mechanism and its multichannel chiral signature. We outline realizations in Moire and anomalous-Hall heterostructures, establishing flux mismatch as an experimentally accessible route to electrically programmable Chern phases and chiral transport.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Theory on controlling topological states, Weyl points, and Chern numbers in moiré heterostructures.", "tags": ["theory", "topology", "moire", "heterostructure", "Weyl", "Chern", "transport"], "image": "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAsAAAAOCAYAAAD5YeaVAAAAAXNSR0IArs4c6QAAAAZiS0dEAP8A/wD/oL2nkwAAAAlwSFlzAAALEwAACxMBAJqcGAAAAAd0SU1FB9wKExQZLWTEaOUAAAAddEVYdENvbW1lbnQAQ3JlYXRlZCB3aXRoIFRoZSBHSU1Q72QlbgAAAdpJREFUKM9tkL+L2nAARz9fPZNCKFapUn8kyI0e4iRHSR1Kb8ng0lJw6FYHFwv2LwhOpcWxTjeUunYqOmqd6hEoRDhtDWdA8ApRYsSUCDHNt5ul13vz4w0vWCgUnnEc975arX6ORqN3VqtVZbfbTQC4uEHANM3jSqXymFI6yWazP2KxWAXAL9zCUa1Wy2tXVxheKA9YNoR8Pt+aTqe4FVVVvz05O6MBhqUIBGk8Hn8HAOVy+T+XLJfLS4ZhTiRJgqIoVBRFIoric47jPnmeB1mW/9rr9ZpSSn3Lsmir1fJZlqWlUonKsvwWwD8ymc/nXwVBeLjf7xEKhdBut9Hr9WgmkyGEkJwsy5eHG5vN5g0AKIoCAEgkEkin0wQAfN9/cXPdheu6P33fBwB4ngcAcByHJpPJl+fn54mD3Gg0NrquXxeLRQAAwzAYj8cwTZPwPH9/sVg8PXweDAauqqr2cDjEer1GJBLBZDJBs9mE4zjwfZ85lAGg2+06hmGgXq+j3+/DsixYlgVN03a9Xu8jgCNCyIegIAgx13Vfd7vdu+FweG8YRkjXdWy329+dTgeSJD3ieZ7RNO0VAXAPwDEAO5VKndi2fWrb9jWl9Esul6PZbDY9Go1OZ7PZ9z/lyuD3OozU2wAAAABJRU5ErkJggg==", "briefing": {"background": "모아레 격자나 이종 접합 구조에서 위상적 상태를 전기적으로 제어하는 것은 양자 exhibit momentum-dependent spin splitting without net magnetization, making them promising platforms for spintronic applications. While the symmetry and multipolar origins of nonrelativistic altermagnetic spin splitting (NRASS) are well established, the role of electronic correlations and spin-lattice coupling (SLC) in controlling NRASS remain unexplored. In particular, SLC provides a direct pathway for tuning altermagnetism through lattice degrees of freedom. Here we first investigate the role of electronic correlations on altermagnetic strength in NiAs-type material CrSb using density functional theory (DFT), DFT+$U$, and dynamical mean-field theory (DMFT). We find that increasing electronic correlations substantially enhance NRASS and drive the stabilization of an incommensurate spin-spiral (SS) state, while dynamical correlations further amplify the spin splitting through quasiparticle renormalization of the Cr-$3d$ states. We find that the NRASS remains 12.5\\% larger in DFT+DMFT than in DFT. By evaluating SLC in next step, we establish its direct connection to the evolution of NRASS and identify SLC as a microscopic descriptor between electronic correlation and enhanced altermagnetism in CrSb. Investigating it in another NiAs-type compound MnTe, we show that the SLC-NRASS correlation is generic across AMs and establish SLC as a microscopic descriptor of altermagnetic strength. Our results provide a unified framework for tuning altermagnetism through the interplay between the electronic correlations and lattice degrees of freedom.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Theory of electronic correlations and altermagnetic spin splitting in CrSb, relevant for experimental spectroscopy.", "tags": ["topic", "altermagnet", "electronic-structure"], "image": "https://arxiv.org/html/2609.11346v1/fig-1.png", "briefing": {"background": "알터마그네틱에서의 스핀 분할은 그동안 주로 대칭성 관점에서 이해되었으나, 전자 상관관계와 격자 결합이 이 물성을 어떻게 강화하거나 조절하는지는 아직 불분명함.", "motivation": "CrSb와 같은 NiAs 구조 물질에서 전자 상관관계와 스핀-격자 결합이 알터마그네틱 스핀 분할(NRASS)에 미치는 영향을 규명하고자 함.", "result": "DFT+DMFT 계산을 통해 상관관계가 강해질수록 스핀 분할이 강화됨을 확인했으며, 스핀-격자 결합이 이 현상을 매개하는 핵심적인 미시적 서술자(descriptor)임을 밝힘.", "implication": "알터마그네틱의 강도를 격자 변형이나 전자 상관관계 조절을 통해 엔지니어링할 수 있는 가이드라인을 제공함.", "novelty": "DFT+DMFT라는 고급 계산 기법을 도입하여 강상관 효과를 정밀하게 다뤘다는 점이 사용자 프로필(DFT+DMFT 관심)에 매우 부합함.", "unresolved": "실제 실험 스펙트럼(ARPES 등)에서 나타나는 quasiparticle renormalization 계수와의 정량적 일치 여부.", "future_work": "다른 NiAs 계열 물질에서의 스핀-격자 결합 강도와 스핀 분할 간의 상관관계 추가 검증.", "concepts": [{"term": "NRASS", "why_emerged": "비상대론적 상황에서도 나타나는 알터마그네틱 스핀 분할을 명명하기 위해 사용.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "알터마그네틱, 스핀-궤도 결합"}, {"term": "DFT+DMFT", "why_emerged": "강상관 전자계에서 전자 간 상호작용의 동역학적 효과를 포함하기 위해 필요.", "origin": "Anisimov et al. (1997).", "connections": "강상관 전자계, Mott 전이"}, {"term": "Spin-Lattice Coupling", "why_emerged": "자기 정렬과 격자 변형 사이의 피드백 루프를 이해하기 위해 필요.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "포논, 자기구조"}, {"term": "NiAs-type structure", "why_emerged": "많은 전이금속 화합물에서 나타나는 일반적인 구조적 틀.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "자기 재료, 구조 물성"}], "english_summary": ["Electronic correlations significantly enhance altermagnetic spin splitting in CrSb.", "DFT+DMFT approach reveals the critical role of dynamical correlations in quasiparticle renormalization.", "Spin-lattice coupling is established as a microscopic descriptor for tuning altermagnetic strength.", "The study provides a unified framework for optimizing altermagnetic properties via lattice and correlation engineering."]}}, {"title": "Electrodynamic Signatures of Bogoliubov Fermi Surfaces in Moir\\'e Graphene", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2603.24766", "authors": "Ke Wang, Qijin Chen, Rufus Boyack, K. Levin", "last_authors": "Rufus Boyack, K. Levin", "summary": "Understanding the superfluid stiffness \\(D_s\\) is a central problem in flat-band superconductivity. It is often interpreted together with spectroscopic probes such as tunneling, since both ultimately reflect the same superconducting quasiparticles. Their relationship is nevertheless complicated in flat bands, where quantum-geometric contributions to \\(D_s\\) must be included. The situation in moir\\'e graphene is particularly complex: tunneling experiments in some cases reveal an evolution between V- and U-shaped spectra together with a quite universal finite zero-bias conductance (ZBC). These two phenomena along with others have been argued to suggest the presence of a Bogoliubov Fermi surface (BFS), often generated by finite-momentum pair-density-wave (PDW) superconductivity. In this paper we calculate the superfluid stiffness in the presence of such a PDW. Virtual interband processes provide the familiar positive geometric contribution that gives phase rigidity to the flat-band condensate, allowing superconductivity to survive even in the presence of a BFS. At the same time, the multiband PDW pair structure enables the gapless BFS quasiparticles to respond to a phase gradient despite the negligible ordinary flat-band velocity. Their resulting counterflow reduces the stiffness even at zero temperature. As an experimentally accessible consequence, we predict a correlated evolution of the residual ZBC and the low-temperature stiffness: enhanced zero-bias spectral weight should accompany reduced phase rigidity. Observation of this correlation would support the presence of a BFS and indicate that the residual zero-energy states are intrinsic.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Relevant study on moire systems, superconductivity, and Bogoliubov Fermi surfaces.", "tags": ["graphene", "superconductivity", "moire"], "image": "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAsAAAAOCAYAAAD5YeaVAAAAAXNSR0IArs4c6QAAAAZiS0dEAP8A/wD/oL2nkwAAAAlwSFlzAAALEwAACxMBAJqcGAAAAAd0SU1FB9wKExQZLWTEaOUAAAAddEVYdENvbW1lbnQAQ3JlYXRlZCB3aXRoIFRoZSBHSU1Q72QlbgAAAdpJREFUKM9tkL+L2nAARz9fPZNCKFapUn8kyI0e4iRHSR1Kb BFS) on superfluid stiffness in moiré graphene.", "Identifies that BFS quasiparticles reduce superfluid stiffness even in flat-band systems.", "Predicts a correlated evolution between residual zero-bias conductance and phase rigidity.", "Suggests that observed spectral features in experiments are intrinsic to the PDW superconducting state."]}}, {"title": "Emergent chiral symmetry breaking in moir\\'e domain wall networks redirects topological boundary states in bilayer graphene", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2602.23570", "authors": "Xue Yan, Kaiyun Chen, Yuan Yan, et al.", "last_authors": "Christian Brandl, Jefferson Zhe Liu", "summary": "Lattice-mismatched bilayer graphene self-organizes into a moir\\'e network of one-dimensional domain walls that conduct electrons with low dissipation, attractive for low-power electronics. We show these channels are not always straight: as the lattice relaxes to minimize strain, the network can spontaneously curve into chiral morphology. Atomistic simulations map a phase diagram in which the strain-flexibility balance selects one of three stable domain wall morphologies-straight, mono-chiral, or dual-chiral. Electronic structure calculations show that this morphology controls where low-energy electrons accumulate: straight channels concentrate states at the domain-wall-connecting nodes, while chiral channels shift that weight onto the domain walls themselves. This network geometric switch lets the same moir\\'e material support either localized electronic hot spots or directional conducting channels-two strategies for guiding electrons in low-power graphene devices.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Relevant topological study on moiré graphene and domain wall physics.", "tags": ["graphene", "topological", "moire"], "image": "https://arxiv.org/static/browse/0.3.4/images/arxiv-logo-fb.png", "briefing": {"background": "격자 불일치가 있는 이중층 그래핀은 스스로 도메인 벽 네트워크를 형성하며, formation (CDW) – an important physical phenomenon that is responsible for driving various sharp changes in material transport properties including metal-insulator transitions [ 13 , 14 , 15 , 16 ] . We derive an effective Ginzburg-Landau theory including uncharted contributions and, as a highlight, discover a general criterion for both CDW formation and commensurability transitions where underlying electron-phonon interactions manifest purely as electronic quantum geometric enhancements/suppressions. We benchmark our framework in a class of transition-metal dichalcogenides and resolve a longstanding puzzle where well-established purely kinetic CDW criteria fail in describing the correct ordering wavevector [ 17 , 18 , 19 , 20 ] . Besides rendering robust criteria and fundamental insights that are immediately relevant to several experimental charge ordering systems [ 21 , 22 , 23 ] , our theory can also be applied directly to other phonon-mediated phases such as superconductivity, and can be used as an important tool to explore the interplay between various such states. More generally, our framework provides a recipe for investigating the role of quantum geometry in phase transitions.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Theory of charge density wave formation, a direct user interest (CDW), tied to real materials.", "tags": ["theory", "CDW", "quantumgeometry", "TMD", "superconductivity"], "image": "https://arxiv.org/html/2609.10678v1/fig1_v3.png", "briefing": {"background": "전하 밀도 파동(CDW)은 전이금속 디칼코게나이드(TMD) 등에서 금속-절연체 전이를 유도하는 핵심 현상이나, 기존의 운동학적 기준만으로는 실제 전이 파수를 설명하는 데 한계가 있었습니다.", "motivation": "최근 주목받는 '양자 기하학(Quantum Geometry)' 개념을 Ginzburg-Landau 이론에 통합하여 CDW 형성 및 일치성(commensurability) 전이를 새롭게 해석하고자 했습니다.", "result": "CDW 형성 과정에 양자 기하학적 요소가 필수적으로 개입함을 밝히고, 기존 키네틱 모델이 실패했던 전이 파수 문제를 해결하는 새로운 기준을 제시했습니다.", "implication": "단순 전자-포논 결합을 넘어 양자 기하학이 물질의 상전이에 미치는 지배적인 역할을 확인했으며, 향후 초전도 및 다양한 상전이 연구의 보편적 프레임워크로 활용될 수 있습니다.", "novelty": "AV3Sb5 같은 카고메   if (r.link) { const link = document.createElement('a'); link.className = 'link'; link.href = r.link; link.target = '_blank'; link.rel = 'noopener noreferrer'; link.textContent = 'Open paper'; headText.appendChild(link); }
