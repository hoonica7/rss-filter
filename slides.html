<!DOCTYPE html>

<head>
<meta charset='UTF-8'>
<meta name='viewport' content='width=device-width, initial-scale=1.0'>
<title>Daily Paper Slideshow</title>
<style>
  :root {
    color-scheme: light;
    --bg: #f6f7f4;
    --paper: #ffffff;
    --ink: #111827;
    --muted: #64748b;
    --line: #d8ddd2;
    --accent: #176b87;
    --accent-2: #9a3412;
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; overflow: auto; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: var(--bg); color: var(--ink); }
  .shell { max-width: 1500px; min-height: 100vh; margin: 0 auto; padding: 14px 18px; display: flex; flex-direction: column; }
  .topbar { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 16px; }
  .top-actions { display: flex; align-items: center; gap: 10px; }
  .topbar a, button { border: 1px solid var(--line); border-radius: 8px; background: var(--paper); color: var(--ink); padding: 10px 14px; font-weight: 700; text-decoration: none; cursor: pointer; }
  button.primary { background: var(--accent); border-color: var(--accent); color: white; }
  button:disabled { opacity: 0.45; cursor: not-allowed; }
  .counter { color: var(--muted); font-weight: 700; }
  .slide { min-height: calc(100vh - 82px); background: var(--paper); border: 1px solid var(--line); border-radius: 10px; padding: 18px; box-shadow: 0 18px 42px rgba(15, 23, 42, 0.10); display: grid; grid-template-columns: minmax(310px, 0.86fr) minmax(0, 1.55fr); gap: 18px; overflow: visible; }
  .paper-head { min-width: 0; min-height: 0; overflow: visible; display: flex; flex-direction: column; gap: 12px; }
  .figure { margin: 0; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: #f8fafc; }
  .figure img { display: block; width: 100%; max-height: 41vh; object-fit: contain; background: white; }
  .figure figcaption { padding: 7px 10px; color: var(--muted); font-size: 12px; line-height: 1.3; }
  .head-text { display: flex; flex-direction: column; gap: 9px; min-width: 0; }
  .badges { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .badge { border-radius: 999px; padding: 5px 9px; background: #eef2ff; color: #3730a3; font-size: 12px; font-weight: 800; }
  .score { background: #fee2e2; color: #991b1b; }
  h1 { margin: 0; font-size: 25px; line-height: 1.15; letter-spacing: 0; overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
  h1 a { color: inherit; text-decoration-color: rgba(23, 107, 135, 0.35); text-decoration-thickness: 2px; text-underline-offset: 4px; }
  h1 a:hover { color: var(--accent); text-decoration-color: var(--accent); }
  .meta, .authors, .why, .abstract { font-size: 13px; line-height: 1.45; }
  .meta, .authors { color: var(--muted); }
  .why strong, .abstract strong, .authors strong { color: var(--ink); }
  .authors { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .why { border-left: 4px solid var(--accent-2); padding-left: 10px; color: #374151; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .abstract { border-top: 1px solid var(--line); padding-top: 14px; color: #374151; }
  .original-abstract { border-top: 1px solid var(--line); padding-top: 10px; color: #374151; font-size: 11.5px; line-height: 1.35; overflow-wrap: anywhere; }
  .original-abstract strong { display: block; margin-bottom: 4px; color: var(--ink); }
  .tags { display: flex; flex-wrap: wrap; gap: 8px; }
  .tag { border-radius: 999px; padding: 4px 8px; background: #f1f5f9; color: #475569; font-size: 12px; font-weight: 700; }
  .head-text > .link { display: none; }
  .briefing { min-width: 0; min-height: 0; overflow: visible; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); grid-auto-rows: minmax(0, auto); align-content: start; gap: 11px 18px; border-top: 0; padding-top: 0; }
  .brief-section { min-width: 0; }
  .brief-section.wide { grid-column: 1 / -1; }
  .brief-section h2 { margin: 0 0 4px; font-size: 14px; line-height: 1.22; color: #0f766e; letter-spacing: 0; }
  .brief-section p, .brief-section li { margin: 0; font-size: 12.5px; line-height: 1.42; color: #1f2937; overflow-wrap: anywhere; }
  .brief-section ul { margin: 0; padding-left: 20px; }
  .concepts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 9px 14px; }
  .concept { border-top: 1px solid var(--line); padding-top: 7px; }
  .concept h3 { margin: 0 0 4px; font-size: 13px; color: #7c2d12; letter-spacing: 0; }
  .concept p { margin: 2px 0 0; font-size: 11.5px; line-height: 1.35; color: #374151; overflow-wrap: anywhere; }
  .concept b { color: #111827; }
  .link { color: var(--accent); font-weight: 800; text-decoration: none; }
  .empty { padding: 48px; background: var(--paper); border: 1px solid var(--line); border-radius: 12px; color: var(--muted); }
  @media (max-width: 860px) {
    .shell { padding: 14px; }
    .topbar, .top-actions { align-items: stretch; flex-direction: column; }
    .slide, .briefing, .concepts { grid-template-columns: 1fr; }
    .slide { min-height: auto; overflow: visible; display: grid; }
    h1 { font-size: 28px; }
  }
</style>

<script>
const slides = [{"title": "Monolayer van der Waals kagome lattice for high-temperature flat-band physics", "journal": "Nature_Physics", "source": "author whitelist", "link": "https://www.nature.com/articles/s41567-026-03492-0", "authors": "Hyungkun Bong, Choongjae Won, Seongyong Lee, et al.", "last_authors": "Kyle M. Shen, Mingu Kang", "summary": "The experimental realization of intrinsic 2D kagome materials with controllable flat bands has remained challenging. Now a van der Waals kagome material family is shown to host an isolated, gate-tunable flat band down to the monolayer limit.", "tier": "A_MUST_READ", "score": "10", "reason": "author whitelist: Chris Jozwiak", "tags": ["kagome", "vanderWaals", "monolayer", "flatband"], "image": "https://media.springernature.com/m685/springer-static/image/art%3A10.1038%2Fs41567-026-03492-0/MediaObjects/41567_2026_3492_Fig1_HTML.png", "briefing": {"background": "카고메 격자(Kagome lattice)는 기하학적 좌절(frustration)로 인해 에너지가 거의 일정한 플랫 밴드(flat band)를 형성할 수 있으며, 이는 강상관 현상이나 위상수학적 상태를 연구하는 데 핵심적입니다. 특히 AV3Sb5와 같은 카고메 금속은 CDW, 초전도 등 다양한 물성으로 주목받아 왔습니다.", "motivation": "기존의 대규모 벌크 카고메 물질들은 층간 결합이나 밴드 조절의 한계로 인해, 순수한 2차원 극한에서의 플랫 밴드 물리와 게이트 전압을 이용한 물성 제어를 실험적으로 구현하는 데 어려움이 있었습니다.", "result": "본 연구는 단층(monolayer) 한계까지 밴드 구조가 유지되는 새로운 반데르발스(vdW) 카고메 물질군을 제시했습니다. 특히 이 물질들은 단층에서도 고립되고 게이트 조절이 가능한 플랫 밴드를 보유하고 있음을 확인했습니다.", "implication": "단층 극한에서의 플랫 밴드 구현은 외부 전하 주입(gating)을 통해 상관 관계의 세기를 극적으로 조절할 수 있음을 의미하며, 이는 고온에서 발현되는 새로운 양자 상(quantum phases)을 탐색할 수 있는 이상적인 플랫폼을 제공합니다.", "novelty": "카고메 격자의 플랫 밴드 물리를 벌크가 아닌 단층 vdW 시스템에서 구현했다는 점이 핵심입니다. 독자의 관심사인 CsV3Sb5 등과 비교하여, 2차원 극한에서의 순수한 전자 구조 제어 가능성을 열었다는 점에서 매우 높은 가치를 지닙니다.", "unresolved": "해당 플랫 밴드에서 구체적으로 어떤 대칭성 파괴 상태(예: 초전도, 자성)가 나타나는지에 대한 실험적 확증이 더 필요합니다.", "future_work": "게이트 전압에 따른 전도 특성 변화 측정과 극저온 ARPES/STM을 통한 다체 상호작용(many-body interaction)의 직접적인 관찰이 예상됩니다.", "concepts": [{"term": "Kagome lattice (카고메 격자)", "why_emerged": "기하학적 구조에 의해 전자 파동함수의 간섭이 발생하여 플랫 밴드를 형성할 수 있는 특이 구조로 주목받았습니다.", "origin": "일본의 대나무 바구니 패턴에서 유래, 1950년대 이치로 쇼지가 통계역학 모델로 제안.", "connections": "AV3Sb5 (A=K, Rb, Cs), 위상 절연체, 좌절 자성체."}, {"term": "Flat band (플랫 밴드)", "why_emerged": "밴드의 분산이 없으면 유효 질량이 무한대가 되어 전자 간 상호작용이 지배적인 강상관 현상을 유도하기 위해 필요합니다.", "origin": "초록 정보만으로는 특정하기 어려움 (주로 카고메나 모아레 격자에서 연구됨).", "connections": "비관습 초전도체, 위상학적 플랫 밴드, 모아레 트위스트 시스템."}, {"term": "Van der Waals material (반데르발스 물질)", "why_emerged": "층간 결합이 약해 단층으로 박리가 가능하고, 다양한 이종 접합 구조를 만들기 위해 필수적입니다.", "origin": "2004년 그래핀의 발견 이후 가속화됨.", "connections": "그래핀, TMD, 전하 밀도 파(CDW)."}, {"term": "Gate-tunability (게이트 조절성)", "why_emerged": "화학적 도핑 없이도 캐리어 농도를 조절하여 상도표(phase diagram)를 연속적으로 탐색하기 위해 필요합니다.", "origin": "반도체 FET 기술에서 유래.", "connections": "전기장 효과, 모토 절연체-금속 전이."}], "english_summary": ["Discovery of a new vdW kagome material family that maintains flat bands down to the monolayer limit.", "Demonstrates gate-tunable isolated flat bands, ideal for high-temperature correlated physics.", "Overcomes the limitations of bulk kagome systems regarding dimensionality and electronic control.", "Provides a platform for investigating interaction-driven phases in a pure 2D kagome lattice."]}}, {"title": "Time-resolved ARPES in pumped excitonic systems: Floquet physics induced by excitonic fields", "journal": "PRB_Recent", "source": "keyword", "link": "http://link.aps.org/doi/10.1103/18mz-pmgh", "authors": "Amir Eskandari-asl, Adolfo Avella", "last_authors": "Amir Eskandari-asl, Adolfo Avella", "summary": "We develop a theoretical framework based on the dynamical projective operatorial approach (DPOA) to study the time-resolved and angle-resolved photoemission spectroscopy (TR-ARPES) of pumped excitonic systems. Including Coulomb electron-electron interactions at the Hartree-Fock level, our formalism captures the formation of excitonic bound states under the application of pump pulses. Considering a prototypical two-dimensional two-band semiconductor, we analyze the equilibrium phase diagram, which shows the expected transition from nd the conventional BCS paradigm.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Important transport study on high-Tc cuprates investigating the pseudogap origin.", "tags": ["experiment", "cuprate", "superconductivity"], "image": "", "briefing": {"background": "고온 초전도체 구리 산화물에서 유사 갭(pseudogap)의 기원은 수십 년간 응집물질물리학의 난제로, 이것이 초전도성과 독립적인 상태인지 아니면 초전도 현상의 전조(preformed pair)인지 논란이 많았습니다.", "motivation": "Bi-2212 및 Bi-2223 단결정의 자기 수송 현상을 정밀 분석하여, 유사 갭과 초전도 요동(fluctuation)이 서로 다른 물리적 기원을 갖는지 분리해내고자 했습니다.", "result": "자기 수송 특성 분석 결과, 유사 갭과 초전도 요동은 서로 다른 현상임을 확인했습니다. 특히 유사 갭이 BCS-BEC 크로스오버 영역에서의 '미리 형성된 쿠퍼 쌍(preformed Cooper pairs)'으로부터 기인한다는 강력한 증거를 제시했습니다.", "implication": "고온 초전도체의 이론적 모델링이 기존의 BCS 이론을 넘어, 더 확장된 강상관 전자계 프레임워크를 수용해야 함을 강력히 시사합니다.", "novelty": "자기장 하에서의 수송 특성을 통해 두 현상을 실험적으로 구별해냈다는 점이 핵심입니다. 특히 ARPES 결과와 함께 읽을 때 고온 초전도체의 상도(phase diagram) 이해를 돕는 중요한 실험적 제약 조건을 제공합니다.", "unresolved": "왜 유사 갭 상태가 특정한 도핑 영역에서 지배적인지, 그리고 이 '미리 형성된 쿠퍼 쌍'이 장거리 초전도 위상 일관성(phase coherence)을 얻지 못하게 방해하는 구체적인 요인은 무엇인지에 대한 미시적 기전은 여전히 의문입니다.", "future_work": "다른 도핑 수준의 구리 산화물에 대한 보완적인 분광학적 연구(예: RIXS 또는 STM)를 통해 수송 특성에서 나타난 결과를 미시적 전자 구조 관점에서 검증할 필요가 있습니다.", "concepts": [{"term": "Pseudogap", "why_emerged": "초전도 전이 온도 이상에서 상태 밀도가 감소하는 현상을 설명하기 위해 도입됨.", "origin": "1990년대 초반 Alloul 등에 의해 NMR 실험으로 본격적인 주목을 받음.", "connections": "Cuprate의 정상 상태(normal state), 페르미 면 재구성(Fermi surface reconstruction), 스핀 밀도 파동(SDW) 등과 연결됨."}, {"term": "Superconducting fluctuations", "why_emerged": "전이 온도 근처에서 초전도체의 위상이 요동치며 나타나는 비정상적인 수송 현상을 이해하기 위해 필요함.", "origin": "Aslamazov-Larkin 이론 등을 통해 확립됨.", "connections": "Nernst 효과, Diamagnetism, 상전이 이론 등과 밀접."}], "english_summary": ["Magnetotransport study on Bi-2212 and Bi-2223 cuprates.", "Distinguished pseudogap from superconducting fluctuations experimentally.", "Pseudogap is identified as originating from preformed Cooper pairs in the BCS-BEC crossover regime.", "Provides critical constraints for theoretical models of high-Tc superconductivity beyon DW 전이의 세부적인 메커니즘을 밝혔습니다.", "implication": "CDW 시스템에서의 격자 불안정성이 어떻게 전자 상태의 변화와 결합되는지에 대한 구조적 이해를 제공합니다.", "novelty": "실제 합성된 물질의 국소적 구조 왜곡을 PDF로 정밀하게 분석하여 거시적인 CDW 특성과 직접 연결한 점이 돋보입니다.", "unresolved": "이 구조적 변화가 전자 밴드 구조의 변화에 미치는 직접적인 상관관계나 페르미 면의 재구성에 대한 ARPES 데이터는 추가 연구가 필요합니다.", "future_work": "온도에 따른 원자 위치 변화가 전자 상태 밀도에 미치는 영향을 DFT 계산 및 분해능 높은 분광학적 실험으로 검증하는 것이 필요합니다.", "concepts": [{"term": "Atomic Pair Distribution Function (PDF)", "why_emerged": "결정 구조가 비주기적일 때 일반적인 회절법으로 해석하기 어려운 국소 구조 정보를 얻기 위해 도입됨.", "origin": "Egami 등 1970년대 연구자들이 무질서한 시스템 분석을 위해 정립.", "connections": "X선 산란 데이터로부터 국소 환경을 역산하는 역문제 풀이와 연결됨."}, {"term": "Charge Density Wave (CDW)", "why_emerged": "1차원 혹은 저차원 시스템에서 에너지 이득을 위해 발생하는 자발적 전자 밀도 변조 설명 필요.", "origin": "Peierls, 1955년 Peierls 불안정성으로 이론화.", "connections": "Kagome 금속(AV3Sb5)의 CDW 및 고온 초전도체와의 상관관계 연구로 이어짐."}], "english_summary": ["Analyzed structural transitions in RPt2Si2 (R=Pr, Nd) using atomic pair distribution function (PDF).", "Demonstrated the link between complex structural distortions and charge-density-wave (CDW) ordering.", "Provides detailed structural modeling to explain the electronic phase transitions in these compounds.", "Highlights the sensitivity of the CDW ground state to local lattice lattice instability."]}}, {"title": "Mott insulating interface in cuprate-based p−n bilayers", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/kxk6-55jg", "authors": "Maxime Dion, Guo-zhen Zhu, Guillaume Hardy, Gianluigi A. Botton, Patrick Fournier", "last_authors": "Gianluigi A. Botton, Patrick Fournier", "summary": "The p - n junction is at the heart of the first great technological revolution. Here, the authors fabricate and characterize such a junction made entirely out of cuprates superconductors thin films. They observe a charge transfer between n -type Pr 1 . 85 Ce 0 . 15 CuO 4 and p -type La 1 . 85 Sr 0 . 15 CuO 4 , from which a Mott insulating layer emerges at the atomically sharp interface. They first assess the quality of the structure through x-ray diffraction and scanning transmission electron microscopy and then they explore the nature of the insulating interface arising from strong electron correlations with various electrical transport experiments.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Experimental study of cuprate interfaces and emergent Mott physics; relevant to unconventional superconductivity.", "tags": ["material", "cuprate", "Mottinsulator"], "image": "", "briefing": {"background": "구리 산화물(Cuprate)은 고온 초전도체의 모체 물질이며, 강한 전자 상관관계에 의해 Mott 절연체 상태를 유지합니다. 서로 다른 도핑 상태의 Cuprate를 접합하여 계면에서의 전자 특성을 제어하는 기술은 소자 응용 및 물리 연구에 필수적입니다.", "motivation": "p형과 n형 Cuprate 박막을 접합한 p-n 접합 구조에서 나타나는 전하 이동 현상이 어떤 전자적 상태를 유도하는지 규명하고자 합니다.", "result": "Pr1.85Ce0.15CuO4와 La1.85Sr0.15CuO4 계면에서 원자 단위로 날카로운 Mott 절연체 층이 생성됨을 확인했습니다.", "implication": "강한 상관관계 물질의 계면 공학을 통해 새로운 전자적 상을 인위적으로 설계할 수 있음을 입증합니다.", "novelty": "서로 다른 부호의 전하 캐리어를 가진 Cuprate 계면에서 Mott 절연체 층이 emergent 현상으로 나타난 점이 주목됩니다.", "unresolved": "이 계면 절연체의 에너지 갭 크기와 기원이 단순한 전하 이동 때문인지, 혹은 계면에서의 대칭성 파괴에 의한 국소화인지에 대한 정밀한 분광학적 데이터가 부족합니다.", "future_work": "ARPES나 STS를 사용하여 계면 내부의 전자 상태 밀도와 갭 구조를 직접 측정할 필요가 있습니다.", "concepts": [{"term": "Mott Insulator", "why_emerged": "강한 전자 간 척력으로 인해 띠 이론으로는 도체여야 할 물질이 부도체가 되는 현상 설명.", "origin": "Nevill Mott, 1949년 제안.", "connections": "Cuprate의 모체 상태 및 밴드 구조 계산(DFT+DMFT)의 주요 연구 대상."}, {"term": "Cuprate p-n Junction", "why_emerged": "반도체 p-n 접합과 유사한 원리로 강상관 물질의 전기적 제어를 시도하기 위해.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "전이금속 산화물 이종접합(Oxide Heterostructure) 연구 분야."}], "english_summary": ["Fabricated p-n junctions using n-type and p-type cuprate superconductors.", "Observed an emergent Mott insulating layer at the atomically sharp interface.", "Characterized the system via STEM and electrical transport to confirm the interface nature.", "Demonstrates the potential for interface engineering in strongly correlated electron systems."]}}, {"title": "Nonmagnetic-magnetic transitions in rutile RuO2", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/57ck-wr34", "authors": "Yue-Fei Hou, Siyuan Liu, Wanxiang Feng, et al.", "last_authors": "Gui-Bin Liu, Ping Zhang", "summary": "Rutile ${\\mathrm{RuO}}_{2}$ has recently attracted great interest, as its magnetic ground state remains controversial. Experimental studies have reported either nonmagnetic (NM) or altermagnetic (AM) ground states in different crystalline samples of ${\\mathrm{RuO}}_{2}$, highlighting the need for a …", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Investigates controversial altermagnetic ground state in RuO2, a key interest for the user.", "tags": ["material", "altermagnetism", "RuO2"], "image": "", "briefing": {"background": "RuO2는 최근 Altermagnetism(교대 자성) 후보 물질로 주목받고 있으나, 실험적으로 자성 유무에 대한 논란이 지속되고 있습니다. 이는 전자 구조 연구에서 매우 중요한 논쟁 주제입니다.", "motivation": "RuO2에서 보고된 상반된 자기적 특성(비자성 vs 교대 자성)의 원인을 규명하고 실제 물질 상태에서의 안정성을 이해하고자 합니다.", "result": "결정 샘플에 따라 나타나는 서로 다른 자기적 상태의 기원을 분석하여, RuO2가 비자성 상태와 교대 자성 상태 사이의 민감한 경쟁 환경에 있음을 시사합니다.", "implication": "Altermagnetism 후보 물질들의 특성이 표면 상태나 결정 결함에 의해 민감하게 반응할 수 있음을 보여줍니다.", "novelty": "논란이 많은 Altermagnetism 분야에서 RuO2의 자기적 불안정성을 명확히 함으로써, 자기 토폴로지 물질 연구자들에게 중요한 단서를 제공합니다.", "unresolved": "왜 특정 샘플에서만 AM 상태가 나타나는지, 외부 스트레스나 결함 농도에 따른 결정적 인자가 무엇인지는 명확히 밝혀지지 않았습니다.", "future_work": "고순도 시료를 이용한 정밀한 중성자 산란 실험이나 저온 자기 광학 측정, ARPES를 통한 밴드 분리(band splitting) 직접 관찰이 필요합니다.", "concepts": [{"term": "Altermagnetism", "why_emerged": "전통적인 강자성체도, 반강자성체도 아닌 밴드 구조 분리를 보이는 새로운 자기 질서 필요성.", "origin": "Jungwirth 등 최근 연구 그룹들에 의해 정립.", "connections": "반강자성 금속, 스핀 분극된 전도성 물질 연구와 직결됨."}, {"term": "Rutile RuO2", "why_emerged": "높은 전기 전도성과 자기적 잠재력으로 인해 차세대 스핀트로닉스 재료로 연구됨.", "origin": "오래전부터 알려진 구조이나 최근 토폴로지 물질로 재조명.", "connections": "반강자성 금속, 스핀 분극 전하 수송 실험."}], "english_summary": ["Investigates the controversial magnetic ground state of rutile RuO2.", "Explores the transition between nonmagnetic and altermagnetic states.", "Addresses inconsistencies in existing experimental reports on RuO2 magnetism.", "Suggests the ground state is sensitive to sample-specific conditions."]}}, {"title": "Positive pressure effect on the superconducting transition in an infinite-layer nickelate La0.8Sr0.2NiO2 thin film", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/4h3v-tjwz", "authors": "Jianping Sun, Wenjie Sun, Wenfeng Wu, et al.", "last_authors": "Yuefeng Nie, Jinguang Cheng", "summary": "The discovery of infinite-layer nickelate superconductors has generated great enthusiasm for exploring new nickelate superconductors with higher ${T}_{\\mathrm{c}}$ and further elucidating their superconducting mechanism. In this work, we systematically investigate the pressure effect on both the nor…", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Experimental investigation of nickelate superconductivity under pressure.", "tags": ["material", "nickelate", "superconductivity"], "image": "", "briefing": {"background": "무한층(infinite-layer) 니켈산염은 구리산염 고온 초전도체와 구조적 유사성으로 인해 비전통적 초전도 메커니즘을 규명하는 핵심 후보군입니다.", "motivation": "La0.8Sr0.2NiO2 박막에서 압력이 초전도 전이 온도(Tc)와 전자 상태에 미치는 영향을 규명하여 초전도성 강화 및 메커니즘을 이해하고자 합니다.", "result": "La0.8Sr0.2NiO2 박막에 양의 압력을 가했을 때 초전도 전이 현상이 어떻게 변하는지에 대한 체계적인 데이터를 확보했습니다.", "implication": "니켈산염 초전도체에서 압력 제어를 통한 Tc 조절 가능성을 확인하였으며, 향후 구리산염과 유사한 초전도 물성 강화 전략 수립에 기여할 수 있습니다.", "novelty": "최근 주목받는 니켈산염 박막의 압력 의존성을 실험적으로 조사하여 전자 구조와 격자 결합 간의 상관관계를 탐색했다는 점이 중요합니다.", "unresolved": "구체적인 Tc 변화 양상이나 페르미 면의 압력에 따른 진화에 대한 상세한 미시적 메커니즘은 후속 연구가 필요합니다.", "future_work": "더 높은 압력 범위에서의 초전도성 확인 및 ARPES를 통한 페르미 면의 압력 의존적 변화 직접 관측이 필요합니다.", "concepts": [{"term": "Infinite-layer nickelates", "why_emerged": "구리산염과 유사한 3d 전자 구조를 가지면서 초전도성을 구현할 수 있는 후보 물질로 제안됨.", "origin": "Harold Hwang 그룹에서 2019년 Nature에 처음 보고.", "connections": "Cuprate superconductivity, Mott physics."}, {"term": "Pressure effect", "why_emerged": "물질의 격자 상수를 미세 조정하여 전자 상관 론적 분석이 필요합니다.", "future_work": "ARPES를 통한 스핀 재배향 전후의 페르미 면 및 베리 곡률 분포 직접 측정.", "concepts": [{"term": "Spin Reorientation Transition (SRT)", "why_emerged": "온도나 외부 장에 따라 자화 방향이 변화하며 물질의 수송 및 자기적 특성이 급격히 바뀌는 현상을 이해하기 위해 필요.", "origin": "자성체 연구의 고전적 주제로 초록 정보만으로는 특정하기 어려움.", "connections": "Magnetic anisotropy, Anomalous Hall effect."}, {"term": "Van der Waals ferromagnet", "why_emerged": "원자층 수준에서 박리가 가능하여 자성과 위상 물성을 동시에 갖는 2D 소자 응용을 위해 등장.", "origin": "Gong et al. (2017)의 CrI3 연구 등이 이 분야를 촉발함.", "connections": "2D magnets, Spintronics."}], "english_summary": ["Explored the interplay between spin reorientation and topological transport in Fe4GeTe2.", "Analyzed how magnetic anisotropy modulation affects topological charge transport.", "Demonstrated the tunability of magnetotransport through spin orientation control.", "Relevant for designing topological spintronic devices using vdW materials."]}}, {"title": "Ultrafast critical slowing of spin dynamics and emergent nonequilibrium Fano interference in Fe3GeTe2", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/7x47-qmbd", "authors": "Anupama Chauhan, Sidhanta Sahu, Satyabrata Bera, et al.", "last_authors": "Siddhartha Lal, N. Kamaraju", "summary": "${\\mathrm{Fe}}_{3}{\\mathrm{GeTe}}_{2}$ is a prototypical metallic van der Waals ferromagnet with itinerant magnetism and a highly tunable Curie temperature, yet how electronic excitations couple to spin and lattice degrees of freedom across its magnetic transition remains largely unexplored. Here, w…", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Dynamics in a key vdW ferromagnet Fe3GeTe2; high relevance for itinerant magnetism and van der Waals systems.", "tags": ["material", "vanderWaals", "magnetism", "dynamics"], "image": "", "briefing": {"background": "Fe3GeTe2는 이동성 강자성(itinerant magnetism)을 나타내는 vdW 물질로, 자기 전이 부근에서의 스핀, 전자, 격자 자유도 간의 복잡한 동역학 연구가 활발합니다.", "motivation": "Fe3GeTe2의 자기 전이 영역에서 전자 여기와 스핀, 격자 자유도가 어떻게 결합하는지 초고속 ological insulator.", "tags": ["experiment", "MnBi2Te4", "topological"], "image": "", "briefing": {"background": "위상 절연체인 MnBi2Te4는 자기적 질서와 위상적 비자명성이 공존하는 재료로, 양자 변칙 홀 효과 등을 구현하기 위한 핵심 플랫폼입니다.", "motivation": "이론적으로 예측된 Chern 절연체의 키랄 가장자리 상태가 실제 소자 환경에서 불순물에 의한 후방 산란을 얼마나 효과적으로 방어하는지 실험적으로 증명하고자 합니다.", "result": "기하학적 결함을 인위적으로 도입한 MnBi2Te4 소자에서 자기장에 의해 유도된 Chern 절연체 상태의 가장자리 전달이 외부 섭동에도 매우 견고함을 관측했습니다.", "implication": "위상 보호된 가장자리 상태를 이용한 저전력, 고효율 정보 소자 및 양자 정보 처리 소자 개발에 실질적인 가이드라인을 제공합니다.", "novelty": "결함이 존재하는 환경에서도 위상학적 보호가 어떻게 발현되는지를 직접적으로 확인했다는 점이 중요하며, 이는 향후 자기 위상 재료의 응용 연구에 필수적인 데이터입니다.", "unresolved": "결함의 종류와 밀도가 가장자리 상태의 위상적 보호를 완전히 상실하게 만드는 임계점에 대한 상세한 연구가 필요합니다.", "future_work": "더 복잡한 기하학적 구조 내에서의 키랄 상태 거동 연구 및 나노 소자 패터닝 기술의 최적화.", "concepts": [{"term": "Chern 절연체", "why_emerged": "외부 자기장 없이도 자발적인 위상 상태를 가질 수 있는 재료 연구의 필요성 때문.", "origin": "Haldane 모델(1988).", "connections": "양자 홀 효과, 위상 절연체, MnBi2Te4 자기 박막."}, {"term": "키랄 가장자리 상태", "why_emerged": "위상학적으로 보호받는 단방향 전하 전달 통로의 필요성 때문.", "origin": "양자 홀 효과의 Edge state 이론.", "connections": "양자 변칙 홀 효과, 비산란 전도."}], "english_summary": ["MnBi2Te4 devices demonstrate robust chiral edge transport.", "The study examines resilience against impurity-induced backscattering.", "Engineered geometric defects reveal the topological protection of edge states.", "This finding supports the viability of topological insulators for future electronic applications."]}}, {"title": "Eight-Unit-Cell Electronic Modulations in Cuprates Originating from Local Molecular Orbitals", "journal": "PRL_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/lvpn-gblk", "authors": "Zhiheng Yao, Sixuan Chen, Jianfa Zhao, et al.", "last_authors": "Shuo Yang, Yayu Wang", "summary": "The pair density wave state with eight-unit-cell ($8{a}_{0}$) periodicity has been widely regarded as the primary order in cuprates, yet its existence and origin remain subjects of intense debate. Using spectroscopic imaging scanning tunneling microscopy, we observe spatial modulations of the electr…", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "STM study of electronic modulations in cuprates; directly relevant to spectroscopy and unconventional SC.", "tags": ["STM", "cuprate", "electronic-structure"], "image": "", "briefing": {"background": "구리 산화물(Cuprates) 고온 초전도체에서 나타나는 여러 전자적 모듈레이션은 초전도성과 경쟁하거나 공존하는 기저 상태를 이해하는 핵심 열쇠입니다.", "motivation": "구리 산화물에서 반복적으로 관찰되는 8 단위 셀(8a0) 주기성을 가진 전자 변조의 물리적 기원을 밝히고자 합니다.", "result": "STM을 통해 관찰된 8a0 변조가 국부적인 분자 궤도(local molecular orbitals) 구조에서 유래한다는 증거를 제시했습니다.", "implication": "이러한 모듈레이션이 단순히 외부적인 불순물 효과가 아니라, 재료 내부의 전자 배치 및 원자 스케일의 상호작용에서 비롯된 본질적인 특성임을 시사합니다.", "novelty": "구리 산화물 내 전하 밀도 파(CDW)와 Pair Density Wave(PDW) 간의 관계를 전자 구조적 관점에서 규명하여, 기존의 '8a0 주기성' 논란을 새로운 각도에서 해석했습니다.", "unresolved": "이러한 분자 궤도 기반의 모듈레이션이 초전도 전이 온도(Tc)나 실제 초전도 메커니즘과 직접적으로 어떻게 연결되는지에 대한 미시적 메커니즘.", "future_work": "다양한 도핑 수준에서의 8a0 모듈레이션 변화 측정 및 이론적인 분자 궤도 모델링 고도화.", "concepts": [{"term": "Pair Density Wave (PDW)", "why_emerged": "초전도 질서 매개변수가 공간적으로 주기성을 가지는 새로운 초전도 상태 연구를 위해.", "origin": "초전도 이론의 확장.", "connections": "구리 산화물, 가고메 금속, CDW."}, {"term": "Spectroscopic Imaging STM", "why_emerged": "재료의 에너지 의존적 국부 상태 밀도를 원자 스케일에서 시각화하기 위해.", "origin": "J.C. Davis 그룹 등의 선구적 연구.", "connections": "전자 구조 분석, 준입자 간섭 매핑(QPI)."}], "english_summary": ["STM study on 8a0 electronic modulations in cuprates.", "Research suggests these periodicities originate from local molecular orbitals.", "Findings provide insights into the complex ground states of copper-oxide superconductors.", "The result helps clarify the debate surrounding the origin of periodic charge/pair orders."]}}, {"title": "Flavor-Polarized Chern Insulator in the Half-Filled Rhombohedral Graphene Moiré Superlattice", "journal": "PRL_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/h96k-q32d", "authors": "Zaizhe Zhang, Xi Chen, Kenji Watanabe, Takashi Taniguchi, Zhida Song, Xiaobo Lu", "last_authors": "Zhida Song, Xiaobo Lu", "summary": "At an even filling, a rhombohedral octalayer graphene moiré superlattice with electric-field-tunable chirality hosts a robust Chern insulating state.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Robust Chern insulator in graphene moiré; significant for quantum Hall and vdW interests.", "tags": ["experiment", "graphene", "topological"], "image": "", "briefing": {"background": "그래핀 모아레 격자 시스템은 전자 간의 강한 상관관계를 유도하여 위상 절연체 및 초전도체와 같은 창발적 물성을 연구하는 플랫폼으로 주목받고 있습니다.", "motivation": "능형(rhombohedral) 8층 그래핀 모아레 구조에서 전기장을 이용해 밴드 구조를 제어하고 새로운 위상 상태를 탐색하고자 합니다.", "result": "홀 충전(half-filling) 조건에서 전기장 조절을 통해 나타나는 강력한 Chern 절연체 상태를 확인했습니다.", "implication": "다층 그래핀 시스템의 층 수와 적층 구조를 공학적으로 설계하여 양자 상태를 제어할 수 있음을 입증했습니다.", "novelty": "단순 이중층이 아닌 능형 다층 시스템에서 위상학적 상태를 제어했다는 점이 독특하며, 이는 밴드 구조 엔지니어링의 확장 가능성을 보여줍니다.", "unresolved": "해당 상태가 어떠한 종류의 전자 상관관계에 의해 정확히 안정화되는지, 그리고 다체 효과의 구체적인 기여도.", "future_work": "더 높은 차수의 그래핀 적층 구조에서 위상적 전이 현상 연구 및 외부 자기장 유무에 따른 위상 모드 비교.", "concepts": [{"term": "능형(Rhombohedral) 그래핀", "why_emerged": "Bernal 적층과는 다른 독특한 전자 구조와 평평한 밴드(flat band)를 구현하기 위해.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "모아레 초격자, 위상적 상전이."}, {"term": "모아레 초격자", "why_emerged": "두 층 이상의 격자를 겹쳐서 새로운 장주기 격자 구조를 만들어 전자 물성을 제어하기 위해.", "origin": "Bistritzer와 MacDonald(2011).", "connections": "마법 각도 그래핀, 꼬임 그래핀."}], "english_summary": ["Robust Chern insulator observed in rhombohedral octalayer graphene moiré.", "The system is tunable via external electric fields.", "Provides a platform for exploring electronic correlation in multilayer vdW systems.", "Demonstrates high degree of control over topological phases in moiré superlattices."]}}, {"title": "Insulating Out-of-Plane Transport in Anisotropic Metals: The Case of Sr2RuO4 and Related Layered Oxides", "journal": "PRL_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/lch5-7zp4", "authors": "Sophie Beck, Matthew Shammami, Lorenzo Van Muñoz, Jason Kaye, Antoine Georges, Jernej Mravlje", "last_authors": "Antoine Georges, Jernej Mravlje", "summary": "We reveal a mechanism that may explain the nonmetallic out-of-plane resistivity in layered metals. By carefully examining how the Drude-Boltzmann expression for the c -axis conductivity emerges out of the Kubo formula, we find, besides the standard metallic term proportional to the carrier lifetime τ , a non-Drude contribution proportional to 1 / τ . The Drude behavior breaks down when 1 / τ > 2 η * , the crossover value η * being small (and hence observable) when the c -axis velocities vary rapidly with the distance from the Fermi surface. We consider the Hund metal Sr 2 RuO 4 as a test case, which we study within a realistic dynamical mean-field theory approach. The non-Drude behavior observed experimentally in c -axis transport is reproduced and explained by our considerations, showing that earlier invoked extrinsic mechanisms that involve either impurities or phonons are unnecessary. Although the small value of η * arises from a peculiar accidental cancellation due to destructive interference, characteristic of body-centered tetragonal lattices, we emphasize and discuss the generality of this mechanism.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Addresses transport in Sr2RuO4, a key unconventional superconductor and layered oxide.", "tags": ["theory", "material", "superconductivity"], "image": "", "briefing": {"background": "Sr2RuO4와 같은 층상 구조 물질에서 평면 밖(c-축) 전기 전도도는 온도에 따라 금속적인 거동을 보일 것으로 기대되나, 실험적으로는 비금속적인(insulating) 거동을 보이는 경우가 많아 이론적 난제로 남아 있었습니다.", "motivation": "이 논문은 c-축 방향으로의 비금속적 전도 현상이 외부 요인(불순물, 포논 등) 때문인지, 아니면 물질 고유의 전자 구조적 기원인지 규명하고자 합니다.", "result": "Kubo 공식에서 유도된 c-축 전도도가 일반적인 Drude항 외에 캐리어 수명(τ)의 역수에 비례하는 비Drude항을 가짐을 밝혔습니다. 특히 전자 속도가 페르미 표면 근처에서 급격히 변할 때 Drude 모델이 붕괴함을 증명했습니다.", "implication": "Sr2RuO4에서 관측된 이상한 c-축 수송 현상이 외부 잡음이 아닌, 층상 구조와 Hund 금속 특성에서 기인한 고유 현상임을 입증했습니다.", "novelty": "기존에 불순물 산란 등 외부 요인으로 치부되던 문제를 오직 고유한 전자 구조 특성(밴드 구조의 분산과 Hund 금속성)만으로 설명해낸 점에서 매우 dy of topological phases in moiré TMDs, a significant area of interest.", "tags": ["experiment", "WSe2", "moire"], "image": "", "briefing": {"background": "뒤틀린(twisted) 전이금속 디칼코게나이드(TMD) 이중층에서는 모아레 격자로 인한 강한 상관관계와 위상적 밴드 구조가 나타나며, Chern 넘버의 발현이 핵심 연구 대상입니다.", "motivation": "실험적으로 Chern 넘버가 관측되지만, 위상적 부호가 바뀌는 경계나 그 원리에 대한 이해가 부족하여 이를 미시적으로 검증하고자 합니다.", "result": "뒤틀린 WSe2 시스템에서 Chern 넘버의 부호 반전과 관련된 미시적 서명을 성공적으로 포착하여 그 물리적 기전을 규명했습니다.", "implication": "모아레 격자 시스템에서의 위상적 전이와 상태의 제어 가능성을 입증하여 양자 위상 공학의 기초를 닦았습니다.", "novelty": "뒤틀린 TMD 시스템의 Chern 넘버에 대한 기존 패러다임의 모순을 해결하고, 미시적 상태의 변화를 실험적으로 직접 추적했다는 점에서 가치가 큽니다.", "unresolved": "부호 반전이 일어나는 임계점 근처에서의 정확한 상관관계 상태(correlated state)의 성격은 추가적인 이론적 정립이 필요합니다.", "future_work": "다양한 비틀림 각도와 외부 전기장 제어를 통해 Chern 넘버를 인위적으로 조절하는 실험이 뒤따를 것입니다.", "concepts": [{"term": "Chern Number", "why_emerged": "밴드의 위상적 기하학적 특성(Berry 곡률의 적분)을 정량화하기 위해 필요함.", "origin": "Chern, Weil (1940년대 수학적 정의), Thouless et al. (1982년 고체물리 적용).", "connections": "Quantum Anomalous Hall Effect, Topological insulators."}, {"term": "Moiré Physics", "why_emerged": "두 층을 겹쳐 격자 상수를 크게 늘림으로써 강한 전자 상관효과를 유도하기 위해 필요함.", "origin": "중요한 연구는 2018년 전후로 폭발적으로 확립됨.", "connections": "Twisted bilayer graphene, TMD homobilayers."}], "english_summary": ["Examines microscopic signatures of Chern number sign reversal in twisted WSe2.", "Addresses a fundamental paradox in moiré-based topological phase observations.", "Provides experimental evidence for the nature of topological transitions in TMD bilayers.", "Advances understanding of phase control in moiré lattice systems."]}}, {"title": "Néel-Antiferromagnet-Proximitized Superconductivity in the NbSe2/MnPS3 Heterostructures", "journal": "PRL_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/xfg2-227f", "authors": "Xinyi Zheng, Ruihuan Duan, Xilin Feng, et al.", "last_authors": "Guangtong Liu, Li Lu", "summary": "Antiferromagnet-superconductor (AFM-SC) hybrids offer a rich but largely unexplored platform for realizing spin-triplet Cooper pairing and chiral topological superconductivity, yet experimental demonstrations remain scarce. Here, we report the modification of superconductivity in ${\\mathrm{NbSe}}_{2…", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Superconductivity in vdW heterostructures with topological implications; relevant material NbSe2.", "tags": ["experiment", "NbSe2", "superconductivity"], "image": "", "briefing": {"background": "반강자성체(AFM)와 초전도체(SC)의 이종 접합은 스핀-삼중항 쿠퍼 쌍(spin-triplet pairing)과 카이럴 위상 초전도성(chiral topological superconductivity)을 구현할 수 있는 후보 플랫폼으로 주목받고 있습니다.", "motivation": "기존 연구에서 AFM-SC 이종 구조의 위상적 성질을 실험적으로 증명하는 데 어려움이 많았기에, NbSe2(초전도체)와 MnPS3(반강자성 절연체) 접합을 통해 근접 효과가 어떻게 나타나는지 규명하고자 함.", "result": "NbSe2의 초전도 성질이 MnPS3와의 이종 접합을 통해 변화함을 확인하였으며, 이는 반강자성 층이 인접한 초전도 층의 전자 구조를 변조할 수 있음을 시사함.", "implication": "반강자성체-초전도체 이종 구조가 위상 초전도성 탐색을 위한 유효한 실험적 플랫폼이 될 수 있음을 보여주며, 향후 스핀트로닉스 소자 응용 가능성을 제시함.", "novelty": "NbSe2와 같이 익숙한 vdW 초전도체를 사용해 근접 효과를 연구함으로써 복잡한 위상 초전도체 탐색에 구체적인 물리적 토대를 마련함.", "unresolved": "실제 스핀-삼중항 성분이나 카이럴 위상 초전도성의 명확한 서명(signature)을 입증하기 위한 추가적인 위상적 측정(예: 에지 전류 측정 등)이 부족함.", "future_work": "저온에서의 자세한 수송 현상 분석 및 스핀 편극 연구를 통해 초전도 상태의 위상적 성질을 직접 증명하는 실험이 필요함.", "concepts": [{"term": "근접 효과 (Proximity Effect)", "why_emerged": "서로 다른 물질을 접합했을 때 계면을 통해 파동함수가 침투하여 물리적 성질이 전이되는 현상을 이해하기 위해 필요.", "origin": "초기 BCS 이론 이후 1960년대 실험적으로 확립됨.", "connections": "조셉슨 접합, 스핀-궤도 결합 시스템에서의 초전도-자성 이종구조."}], "english_summary": ["Explores NbSe2/MnPS3 van der Waals heterostructures to investigate AFM-SC coupling.", "Demonstrates modification of superconductivity through magnetic proximity effects.", "Aims to realize chiral topological superconductivity in vdW systems.", "Highlights the potential of AFM-SC hybrids for exotic quantum phases."]}}, {"title": "Gate-tunable chiral spin mode in WSe2/WS2 moiré superlattices", "journal": "Science", "source": "Gemini", "link": "https://www.science.org/doi/abs/10.1126/science.adq6530?af=R", "authors": "Zhexu Shan, Wenjian Su, Kenji Watanabe, et al.", "last_authors": "Yuanfeng Xu, Yanhao Tang", "summary": "The interplay between many-body and spin-orbit coupling (SOC) effects can lead to previously unobserved phenomena in solids. Chiral spin modes (CSMs) are collective spin excitations that arise from such interplay and connect states with opposite chirality. Here, we report a gate-tunable CSM that occurs between conduction SOC-split minibands in near-0°-twisted WSe 2 /WS 2 bilayers. This mode manifests as a sharp resonance with giant Raman efficiency in the pseudovector-symmetry channel of the Raman spectra. By varying the filling, the CSM transitions from a chiral spin exciton to an excitonic polaron. The spin-flip nature is directly confirmed by the Zeeman effect, and the filling dependence indicates a charge-transfer insulator at unity filling. Our results demonstrate that transition metal–dichalcogenide moiré superlattices are a fertile platform for exploring exotic low-lying collective excitations.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Significant experiment on chiral modes in moiré superlattices, a listed user interest.", "tags": ["experiment", "WSe2/WS2", "moiresystems"], "image": "", "briefing": {"background": "전이금속 디칼코게나이드(TMD) 모아레 초격자는 전자 간의 강한 상호작용과 스핀-궤도 결합이 결합하여 풍부한 물리 현상을 창출하는 장을 제공함.", "motivation": "WSe2/WS2 비틀림 이중층에서 나타나는 카이럴 스핀 모드(CSM)의 실체와 게이트 전압에 의한 제어 가능성을 조사하고자 함.", "result": "근접 0도 비틀림 이중층에서 전도대 스핀-궤도 결합 갈라짐 대역 사이의 카이럴 스핀 모드를 발견했으며, 전하 주입에 따라 스핀 엑시톤에서 엑시톤 폴라론으로 변환됨을 확인.", "implication": "모아레 시스템이 단순한 전자적 구조 연구를 넘어 집단적 스핀 들뜸(collective spin excitations)을 제어할 수 있는 플랫폼임을 입증함.", "novelty": "거대한 라만 효율을 통해 카이럴 스핀 모드를 관찰했으며, 제만 효과를 이용해 스핀 플립 성질을 명확히 규명함.", "unresolved": "이러한 카이럴 스핀 모드가 장거리 양자 얽힘이나 기타 위상적 정렬과 어떻게 연관되는지는 아직 충분히 탐구되지 않음.", "future_work": "다른 비틀림 각도에서의 모아레 물리 연구 및 초고속 분광학을 이용한 스핀 동역학 측정.", "concepts": [{"term": "카이럴 스핀 모드 (CSM)", "why_emerged": "모아레 시스템 내 강한 스핀-궤도 결합과 다체 효과의 상호작용을 설명하기 위해 도입.", "origin": "본 연구에서 실험적으로 보고 ical exploration of Fermi sea topology, highly relevant to electronic structure and STS.", "tags": ["theory", "topology", "Fermisurface"], "image": "", "briefing": {"background": "페르미 면(Fermi surface)은 금속의 전기적 성질을 결정하는 핵심 요소이며, 최근에는 이 면의 위상학적 구조가 수송 현상과 밀접하게 연관되어 있음이 밝혀지고 있습니다.", "motivation": "기존의 파동함수 기반 위상학 연구를 넘어, 페르미 바다(Fermi sea)의 기하학적 구조가 가지는 고유한 위상학적 성질을 체계적으로 분류하고자 합니다.", "result": "오일러 지표(Euler characteristic)를 활용하여 페르미 면 내에 숨겨진 미세 위상 구조를 정의하고, 이것이 전도도 양자화에 기여함을 입증하였습니다.", "implication": "전자 구조 계산 및 STS 측정에서 페르미 면의 복잡한 기하학적 특징이 왜 물리적으로 중요한지를 정량적으로 해석할 수 있게 됩니다.", "novelty": "STS나 ARPES를 통해 관측되는 페르미 면의 미세 구조를 이론적으로 해석하는 틀을 제공하여 독자의 데이터 분석에 새로운 관점을 제공합니다.", "unresolved": "현실 물질의 복잡한 밴드 구조(예: V3Sb5 등)에 이 이론을 적용했을 때 관측 가능한 신호로 어떻게 구체화되는지에 대한 추가 연구가 필요합니다.", "future_work": "실제 토폴로지 물질의 페르미 면 지도를 통한 오일러 지표 실험적 검증.", "concepts": [{"term": "오일러 지표 (Euler characteristic)", "why_emerged": "다양체의 위상학적 분류를 위해 사용", "origin": "레온하르트 오일러 (18세기)", "connections": "가우스-보네 정리, 위상 불변량"}, {"term": "페르미 바다", "why_emerged": "다체 전자 시스템의 바닥 상태를 기술하기 위해 필요", "origin": "디락과 페르미", "connections": "페르미 액체 이론, 란다우 준입자"}], "english_summary": ["Analyzes the topological structure of the Fermi sea using the Euler characteristic.", "Links geometric properties of the Fermi surface to conductance quantization.", "Provides a new theoretical perspective on electronic structure topology.", "Offers potential implications for interpreting STS and ARPES data."]}}, {"title": "Highly uniaxial stress-tunable orbital-driven magnetism in CrAs", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/js3k-4d9x", "authors": "Kousuke Ishida, Hsiao-Yi Chen, Shumpei Seto, et al.", "last_authors": "Yusuke Nomura, Yoshinori Onose", "summary": "CrAs undergoes a first-order helimagnetic transition accompanied by a huge lattice distortion whose microscopic mechanism remains unresolved. Here, the authors demonstrate through stress-strain measurements that the helimagnetic transition in   headText.appendChild(title);
  headText.appendChild(textEl('p', 'meta', [r.journal, r.source].filter(Boolean).join(' | ')));
  if (r.last_authors || r.authors) { const authors = document.createElement('p'); authors.className = 'authors'; if (r.last_authors) authors.append('Last authors: ' + r.last_authors); if (r.authors) authors.append((r.last_authors ? ' | ' : '') + 'Authors: ' + r.authors); headText.appendChild(authors); }
  appendLabeledText(headText, 'why', 'Filter reason: ', r.reason);
  if (r.tags && r.tags.length) { const tags = document.createElement('div'); tags.className = 'tags'; r.tags.forEach(tag => tags.appendChild(textEl('span', 'tag', '#' + tag))); headText.appendChild(tags); }
  if (r.link) { const link = document.createElement('a'); link.className = 'link'; link.href = r.link; link.target = '_blank'; link.rel = 'noopener noreferrer'; link.textContent = 'Open paper'; headText.appendChild(link); }
  head.appendChild(headText);
  if (r.summary) { const abstract = document.createElement('p'); abstract.className = 'original-abstract'; const strong = textEl('strong', '', 'Original abstract'); abstract.appendChild(strong); abstract.append(r.summary); head.appendChild(abstract); }
  slideEl.appendChild(head);
  const briefing = document.createElement('div');
  briefing.className = 'briefing';
  appendBriefSection(briefing, 'Background', b.background);
  appendBriefSection(briefing, 'Motivation', b.motivation);
  appendBriefSection(briefing, 'Result', b.result);
  appendBriefSection(briefing, 'Implication', b.implication);
  appendBriefSection(briefing, "Why it's important / Novelty", b.novelty);
  appendBriefSection(briefing, 'Unresolved Questions', b.unresolved);
  appendBriefSection(briefing, 'Expected Future Work', b.future_work);
  if (b.concepts && b.concepts.length) {
    const section = document.createElement('section');
    section.className = 'brief-section wide';
    section.appendChild(textEl('h2', '', 'Concepts / Terms'));
    const concepts = document.createElement('div');
    concepts.className = 'concepts';
    b.concepts.forEach(c => {
      const item = document.createElement('div');
      item.className = 'concept';
      item.appendChild(textEl('h3', '', c.term || 'Concept'));
      [['왜 생겼나: ', c.why_emerged], ['누가 만들었나: ', c.origin], ['연결되는 흐름: ', c.connections]].forEach(([label, text]) => { if (!text) return; const p = document.createElement('p'); const bold = textEl('b', '', label); p.appendChild(bold); p.append(text); item.appendChild(p); });
      concepts.appendChild(item);
    });
    section.appendChild(concepts);
    briefing.appendChild(section);
  }
  if (b.english_summary && b.english_summary.length) { const section = document.createElement('section'); section.className = 'brief-section wide'; section.appendChild(textEl('h2', '', 'English Summary')); const ul = document.createElement('ul'); b.english_summary.slice(0, 5).forEach(line => ul.appendChild(textEl('li', '', line))); section.appendChild(ul); briefing.appendChild(section); }
  slideEl.appendChild(briefing);
  counterEl.textContent = `${index + 1} / ${slides.length}`;
  prevBtn.disabled = index === 0;
  nextBtn.disabled = index === slides.length - 1;
}
prevBtn.addEventListener('click', () => { index = Math.max(0, index - 1); render(); });
nextBtn.addEventListener('click', () => { index = Math.min(slides.length - 1, index + 1); render(); });
document.addEventListener('keydown', event => { if (event.key === 'ArrowLeft') prevBtn.click(); if (event.key === 'ArrowRight') nextBtn.click(); });
render();
</script>
</body>
</html>
