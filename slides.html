wave states, as well as two odd-parity $p$-wave channels. We veri…", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Theory of finite-momentum superconductivity in an altermagnetic metal; directly relevant to user's interests.", "tags": ["theory", "altermagnetism", "superconductivity"], "image": "", "briefing": {"background": "알터마그네티즘(Altermagnetism)은 순 자화값은 없으면서도 스핀 분할된 밴드 구조를 갖는 새로운 자성 분류로, 초전도와의 결합이 최근 큰 관심을 받고 있습니다.", "motivation": "사각 격자 위 알터마그네틱 금속에서 인접 격자 간 인력 상호작용이 있을 때 발생하는 초전도 페어링 불안정성을 분석하고자 합니다.", "result": "알터마그네티즘 특유의 대칭성으로 인해 단일항(singlet)과 삼중항(triplet) 페어링이 혼합되며, 유한 운동량(finite-momentum)을 갖는 초전도 상태가 안정화될 수 있음을 확인했습니다.", "implication": "알터마그넷이 FFLO 상태와 유사한 유한 운동량 초전도를 구현하는 새로운 경로가 될 수 있음을 보여줍니다.", "novelty": "알터마그네틱 스핀 분할이 페어링 채널(s-wave, d-wave, p-wave) 간의 혼합을 유도하여 비전형적인 초전도상을 만든다는 점을 이론적으로 구체화했습니다. 이는 독자의 관심사인 알터마그네티즘 및 비전형 초전도체와 밀접합니다.", "unresolved": "실제 알터마그네틱 물질(예: RuO2 등)에서의 구체적인 매개 변수를 적용한 실험적 검증이 남아 있습니다.", "future_work": "조셉슨 접합이나 STM을 이용한 페어링 대칭성 및 유한 운동량 페어링의 직접적인 측정 연구가 예상됩니다.", "concepts": [{"term": "Altermagnetism", "why_emerged": "강자성(FM)과 반강자성(AFM)의 특징을 동시에 가지며, 실공간 대칭성에 의해 스핀 분할이 일어나는 자성을 분류하기 위해 정의되었습니다.", "origin": "L. Šmejkal, J. Sinova, T. Jungwirth 등에 의해 최근 체계화되었습니다.", "connections": "스핀 트로닉스, 비정상 홀 효과, 비전형 초전도와 연결됩니다."}, {"term": "Finite-momentum superconductivity", "why_emerged": "쿠퍼 쌍이 0이 아닌 총 운동량을 가져 공간적으로 변조된 질서 파라미터를 갖는 상태를 설명하기 위해 제안되었습니다.", "origin": "Fulde-Ferrell (1964) 및 Larkin-Ovchinnikov (1964)에 의해 제안되었습니다(FFLO 상태).", "connections": "강한 자기장 하의 초전도체, 공간 불균일 초전도, 알터마그네틱 초전도와 관련됩니다."}], "english_summary": ["Analyzes pairing instabilities in an altermagnetic metal on a square lattice.", "Discovers singlet-triplet mixing driven by altermagnetic spin splitting.", "Identifies the emergence of finite-momentum superconductivity as a stable ground state.", "Provides a theoretical framework for unconventional pairing in altermagnets."]}}, {"title": "Magnetic symmetry implications of the zero- and applied-field Hall effect of UNi4B", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/89wz-m23z", "authors": "Z. W. Riedel, W. S. Simeth, S. M. Thomas, F. Ronning, E. D. Bauer", "last_authors": "F. Ronning, E. D. Bauer", "summary": "The authors report here two finite zero-field Hall resistivity tensor components associated with the debated magnetic ground state of the noncollinear antiferromagnet UNi 4 B. For a commensurate magnetic structure, the finite Hall resistivity components cannot be explained by the formation of magnetic domains but are compatible with a monoclinic magnetic symmetry lower than that of previously proposed magnetic ordering models. Additional field-dependent Hall resistivity data collected up to 16 T suggest a notable intrinsic contribution to the anomalous Hall effect.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Study of anomalous Hall effect and magnetic symmetry in a real heavy-fermion-like system.", "tags": ["anomalous-Hall", "magnetism", "heavy-fermion"], "image": "", "briefing": {"background": "비공선형(non-collinear) 반강자성체에서 나타나는 홀 효과는 물질의 자기 구조와 위상학적 특성을 이해하는 핵심 도구입니다.", "motivation": "오랫동안 논란이 되어온 무거운 페르미온 시스템 UNi4B의 자기 기저 상태를 홀 저항 측정을 통해 규명하고자 합니다.", "result": "영자기장(zero-field)에서 유한한 홀 저항 텐서 성분을 발견했으며, 이는 기존 모델보다 낮은 단사정계(monoclinic) 자기 대칭성을 시사합니다. 또한 강한 자기장에서 내인성(intrinsic) 비정상 홀 효과의 기여를 확인했습니다.", "implication": "UNi4B의 자기 구조가 이전에 제안된 것보다 더 낮은 대칭성을 가짐을 증명하며, 비정상 홀 효과가 자기 대칭성 분석의 강력한 도구임을 보여줍니다.", "novelty": "UNi4B라는 특정 무거운 페르미온 시스템에서 대칭성 분석을 통해 자기 구조에 대한 중요한 제약을 가했다는 점이 중요합니다. 독자의 관심사인 AHE, TRSB, 무거운 페르미온 물질 연구와 직결됩니다.", "unresolved": "관측된 홀 효과의 정확한 베리 곡률 기여도와 단사정계 대칭성 붕괴의 미시적 원인에 대한 추가 연구가 필요합니다.", "future_work": "중성자 산란이나 자기 토크 측정을 통한 정밀한 자기 구조 결정 및 다른 무거운 페르미온 좌절 자성체로의 연구 확대가 기대됩니다.", "concepts": [{"term": "Anomalous Hall Effect (AHE)", "why_emerged": "자성체에서 외부 자기장 없이 혹은 자화에 비례하여 나타나는 홀 효과를 설명하기 위해 발견되었습니다.", "origin": "Edwin Hall (1881)에 의해 처음 관찰되었습니다.", "connections": "베리 곡률, 스핀-궤도 결합, 위상학적 물질 연구와 밀접하게 연관됩니다."}, {"term": "Heavy Fermion system", "why_emerged": "강하게 상관된 f-전자 시스템에서 유효 질량이 전자의 수백 배에 달하는 준입자 거동을 설명하기 위해 도입되었습니다.", "origin": "Steglich et al. (1979)의 CeCu2Si2 연구 등에서 확립되었습니다.", "connections": "Kondo 효과, 비전형 초전도, 양자 임계 현상과 관련됩니다."}], "english_summary": ["Observes zero-field Hall resistivity in the non-collinear antiferromagnet UNi4B.", "Suggests a lower monoclinic magnetic symmetry than previously proposed models.", "Identifies a significant intrinsic contribution to the anomalous Hall effect up to 16 T.", "Refines the understanding of the magnetic ground state in this heavy-fermion candidate."]}}, {"title": "Magnetism and symmetry of superconducting gap in LaFeAsO from dynamical mean-field theory", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/gfr4-g54x", "authors": "S. L. Skornyakov, V. I. Anisimov, A. A. Katanin", "last_authors": "V. I. Anisimov, A. A. Katanin", "summary": "By employing a combined method of density functional theory and dynamical mean field theory $(\\mathrm{DFT}+\\mathrm{DMFT})$ we investigate the effect of electronic correlations on the magnetic and superconducting properties of the iron-based parent compound LaFeAsO. We find that the static nonlocal s…", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Relevant DFT+DMFT study on iron pnictides, directly comparable to ARPES/STS data.", "tags": ["theory", "pnictides", "superconductivity"], "image": "", "briefing": {"background": "철 기반 초전도체(FeSC)는 구리 산화물 초전도체와 더불어 고온 초전도 현상을 이해하는 데 핵심적인 물질군입니다. 특히 LaFeAsO는 이 물질군의 전형적인 모물질로, 전자 간의 상관관계(electronic correlation)가 자성과 초전도성 발현에 어떤 역할을 하는지 규명하는 것이 주요 과제입니다.", "motivation": "기존의 밀도 범함수 이론(DFT)만으로는 강한 전자 상관관계를 충분히 설명하기 어렵습니다. 본 연구는 DFT와 동적 평균장 이론(DMFT)을 결합하여 LaFeAsO의 상관관계가 정적 비국소 자화율 및 초전도 갭의 대칭성에 미치는 영향을 정량적으로 조사하고자 했습니다.", "result": "DFT+DMFT 계산을 통해 전자 상관관계가 자성 모멘트와 초전도 갭 형성에 미치는 정교한 영향을 확인했습니다. 특히 정적 비국소 자화율을 통해 특정 대칭성을 가진 초전도 갭의 안정성을 논의하며, LaFeAsO의 자기적 요동과 초전도 상태 간의 연결 고리를 명확히 했습니다.", "implication": "LaFeAsO와 같은 pnictide계 물질에서 전자 상관관계가 단순한 '섭동' 이상으로 초전도 대칭성을 결정하는 핵심 요소임을 시사합니다. 이는 ARPES로 측정된 전자 구조와 실험적인 초전도 갭 대칭성 데이터를 해석하는 이론적 기반을 제공합니다.", "novelty": "DFT와 DMFT를 결합하여 비국소 자화율을 계산함으로써, 단순히 국소적인 물리량을 넘어 실제 물질의 결정 구조 내에서의 자성 요동을 더 정확하게 묘사했습니다. 이는 사용자님의 관심사인 pnictide계 전자 구조 분석에 직접적인 이론적 참조가 됩니다.", "unresolved": "초록 정보에 따르면 이론적 계산 결과와 특정 실험 데이터(예: 특정 온도에서의 전도도 변화) 간의 완전한 일치 여부는 추가적인 비교 검증이 필요해 보입니다.", "future_work": "다른 pnictide계 및 chalcogenide계 초전도체로 이 방법론을 확장하여, 물질별로 상이한 초전도 전이 온도(Tc)의 원인을 상관관계 관점에서 비교 연구할 것으로 기대됩니다.", "concepts": [{"term": "DFT+DMFT", "why_emerged": "밴드 구조 계산(DFT)이 설명하지 못하는 강한 상관관계 시스템의 다체 효과를 다루기 위해 등장했습니다.", "origin": "Gabriel Kotliar, Antoine Georges 등이 1990년대 초 제안함.", "connections": "Hubbard model, Dynamical Mean-Field Theory, Tight-binding model"}, {"term": "LaFeAsO", "why_emerged": "2008년 Hosono 그룹에 의해 발견된 최초의 고온 철 기반 초전도체 모물질입니다.", "origin": "Hideo Hosono (Tokyo Institute of Technology, 2008)", "connections": "Iron-based superconductors, pnictides, 1111 structure"}, {"term": "Superconducting Gap Symmetry", "why_emerged": "초전도 페어링의 메커니즘(음향자 또는 자기적 요동 등)을 구별하기 위해 필수적인 지표입니다.", "origin": "초록 정보만으로는 특정하기 어려움 (BCS 이론 및 그 후속 확장 연구)", "connections": "s-wave, d-wave, s+- symmetry, ARPES"}], "english_summary": ["The study investigates electronic correlations in LaFeAsO using a combined DFT+DMFT approach.", "It focuses on the impact of these correlations on magnetic susceptibility and superconducting gap symmetry.", "Results highlight the importance of nonlocal static susceptibility in determining the superconducting properties.", "The findings provide a theoretical framework to interpret ARPES and STS data on iron pnictides."]}}, {"title": "Propagation and localization of spin excitations at altermagnetic domain walls", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/zgw5-99k2", "authors": "Oksana Peschanska, Jeroen van den Brink, Volodymyr P. Kravchuk", "last_authors": "Jeroen van den Brink, Volodymyr P. Kravchuk", "summary": "Altermagnets ( AMs ) are spin-compensated materials in which opposite-spin sublattices are connected by a symmetry that causes a spin splitting in their elementary excitations. As there is a strong effect of altermagnetism on domain wall properties, it is quite natural to also expect an enrichment of the physics of magnetic excitations at AM domain walls. Here, we consider the propagation of spin eigenexcitations along domain walls in easy-axial d -wave AMs . Investigating the presence of bound states localized on a domain wall, we find that the effect of the AM on the bound states strongly depends on the orientation of the domain wall relative to the crystallographic directions. If the domain wall is oriented along a nodal direction [100] or [010], AM does not change the number of bound states; however, it leads to a nonlinear dispersion and a tilt of the wavefront. The effect of AM is strongest when the domain wall is oriented along the directions [110] or [ 1 ¯ 10 ] , i.e., along the directions of the strongest AM splitting in the magnon spectrum. In this case, (i) the additional gapped bound states appear, (ii) degeneracy of the eigenstates with respect to their polarization (right-hand or left-hand precession of the Néel vector) is removed, and (iii) the localization area of the bound states strongly depends on the eigenfrequency. The latter may lead to strong localization of the bound state at the domain wall. We further consider the influence of a static magnetic field that is applied along the easy axis and find that the magnetic field induces an asymmetry between the localization regions on opposite sides of the domain wall and sets an upper limit on the absolute value of the propagating eigenstate's wave vector.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Altermagnetism is a major interest; study of domain wall spin excitations is highly relevant.", "tags": ["altermagnetism", "spin-dynamics"], "image": "", "briefing": {"background": "알터자성(Altermagnetism)은 순 자화량은 0이지만 대칭성으로 인해 밴드 구조에서 스핀 갈라짐이 나타나는 새로운 자성 상태입니다. 최근 이 물질의 도메인 벽(domain wall)에서 나타나는 독특한 물리적 현상이 연구의 화두가 되고 있습니다.", "motivation": "알터자성체 내부의 도메인 벽이 스핀 여기(마그논)의 전파와 국소화에 어떤 영향을 미치는지, 특히 도메인 벽의 방향성에 따라 이러한 효과가 어떻게 달라지는지 규명하는 것이 목표입니다.", "result": "도메인 벽의 방향에 따라 현격한 차이가 발견되었습니다. [100] 방향일 때는 파면의 기울어짐 정도만 나타나지만, [110] 방향(알터자성 분열이 최대인 방향)일 때는 (1) 새로운 갭을 가진 구속 상태가 나타나고, (2) 스핀 편극에 따른 축퇴가 깨지며, (3) 주파수에 따라 국소화 영역이 강하게 변하는 현상이 확인되었습니다.", "implication": "알터자성체의 도메인 벽을 스핀파 제어를 위한 '도파관'으로 활용할 수 있는 가능성을 제시합니다. 특히 특정 방향의 도메인 벽을 통해 특정 에너지의 마그논만 선택적으로 가둘 수 있습니다.", "novelty": "알터자성 특유의 d-wave 대칭성이 자성 여기의 국소화에 미치는 비등방적 효과를 최초로 상세히 분석했습니다. 이는 사용자님의 관심사인 알터자성 및 위상 자성체 연구와 밀접하게 연관됩니다.", "unresolved": "이러한 이론적 예측을 실제 알터자성체(예: RuO2, MnTe)에서 중성자 산란이나 마그논 분광법으로 관측할 수 있을지에 대한 실험적 증명이 남아 있습니다.", "future_work": "외부 자기장이나 스트레인을 이용해 도메인 벽의 위치를 제어하고, 그에 따른 스핀 수송 특성의 변화를 연구하는 실험적 시도가 이어질 것으로 보입니다.", "concepts": [{"term": "Altermagnetism", "why_emerged": "강자성과 반강자성의 장점을 동시에 갖춘(스핀 분열이 있으나 알짜 자화가 없는) 물질군을 분류하기 위해 등장했습니다.", "origin": "Libor Šmejkal, Tomas Jungwirth 등 (2022년경 체계화)", "connections": "Antiferromagnetism, Spin-orbit coupling, d-wave symmetry"}, {"term": "Domain Wall", "why_emerged": "자성체 내에서 자화 방향이 서로 다른 영역 사이의 경계면으로, 소자 소형화 및 데이터 저장 기술에 중요합니다.", "origin": "Felix Bloch (1932) 등", "connections": "Magnon, Magnetic skyrmion, Spintronics"}, {"term": "Magnon Bound State", "why_emerged": "자성체 내부의 결함이나 경계면에 속박되어 특정 에너지를 갖는 스핀파 상태를 설명하기 위해 필요합니다.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "Spin waves, Surface states, Localization"}], "english_summary": ["The paper explores spin excitation propagation and localization at altermagnetic domain walls.", "The effect of altermagnetism on bound states is highly sensitive to the domain wall orientation relative to crystallographic axes.", "Domain walls along the [110] direction exhibit gapped bound states and broken polarization degeneracy.", "The findings suggest potential for controlling spin waves using altermagnetic domain wall properties."]}}, {"title": "Transparency-controlled multiple charge transfer in superconducting junctions with local shot-noise scanning tunneling spectroscopy", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/81fz-49c6", "authors": "Yudai Sato, Maialen Ortego Larrazabal, Jian-Feng Ge, et al.", "last_authors": "Milan P. Allan, Jiasen Niu", "summary": "Charge transport in superconducting junctions at finite voltages is governed by Andreev reflections, including multiple Andreev reflections, which are processes that enable multiple charge transfer, a hallmark that shot noise can directly quantify. Since the effective charge extracted from shot-noise measurements varies with the transparency of the junction, systematic control of transparency is essential but experimentally challenging. Here, we present shot-noise scanning tunneling microscopy measurements enabled by a newly developed amplifier, allowing access to different transparency regimes. We perform shot-noise measurements on Pb(111) with tunable transparency at 2.2 K and observe that the shot noise evolves from a single-electron tunneling regime to multiple charge-transfer regimes as transparency increases. Our results are quantitatively consistent with theoretical simulations of Andreev reflections and multiple Andreev reflections for a single-channel system. These results establish junction transparency as the key parameter governing the evolution of charge transport and demonstrate that noise STM is a powerful platform for investigating microscopic charge transport mechanisms with controlled junction transparency at the atomic scale.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Methodological relevance to STS and fundamental interest in superconducting transport.", "tags": ["experiment", "STS", "superconductivity"], "image": "", "briefing": {"background": "초전도 접합에서의 전하 수송은 안드레예프 반사(Andreev reflection)라는 과정에 의해 지배됩니다. 특히 접합의 투과도(transparency)에 따라 한 번에 이동하는 전하의 양이 결정되는데, 이를 측정하기 위해 산탄 잡음(shot noise) 분석이 중요합니다.", "motivation": "기존의 주사 터널링 현미경(STM)은 투과도를 정밀하게 조절하면서 동시에 발생하는 미세한 산탄 잡음을 측정하는 데 기술적 한계가 있었습니다.", "result": "새로운 증폭기를 장착한 'shot-noise STM'을 통해 Pb(111) 단결정에서 투과도를 연속적으로 조절하며 측정한 결과, 단일 전자 터널링에서 다중 전하 전송(Multiple Andreev Reflection, MAR) 체제로의 진화를 관찰했습니다. 이는 이론적 시뮬레이션과 완벽하게 일치했습니다.", "implication": "원자 단위의 극한적 분해능으로 접합부의 투과도를 제어하며 전하 수송의 양자적 거동을 직접 관측할 수 있게 되었습니다. 이는 비전통 초전도체의 짝짓기 메커니즘이나 마요라나 구속 상태의 전하 특성을 규명하는 데 강력한 도구가 될 것입니다.", "novelty": "실험적으로 매우 까다로운 '가변 투과도 산탄 잡음 STS'를 구현하여, 초전도 접합 수송 이론을 원자 스케일에서 실험적으로 검증했다는 점이 독보적입니다. 사용자님의 STS 연구 관심사에 직접적인 기술적 진보를 보여줍니다.", "unresolved": "초록상으로는 Pb와 같은 단순 초전도체 외에, 사용자님의 관심사인 Kagome 금속이나 구리 산화물과 같은 복잡한 시스템에서도 동일한 정밀도가 확보될지는 아직 미지수입니다.", "future_work": "위상 초전도체나 다중 밴드 초전도체에 이 기술을 적용하여, 국소적인 전하 전송 매커니즘과 유효 전하량(effective charge)을 측정하는 연구가 진행될 것으로 보입니다.", "concepts": [{"term": "Shot-noise STS", "why_emerged": "단순한 밀도 측정(dI/dV)을 넘어, 전하 전송의 통계적 요동을 통해 실제 운반되는 전하의 단위를 알기 위해 등장했습니다.", "origin": "최근 10-15년 사이 STM 기술 발전과 함께 구현됨", "connections": "Andreev reflection, Quasiparticle, Fano factor"}, {"term": "Multiple Andreev Reflection (MAR)", "why_emerged": "초전도-일반 금속-초전도 접합에서 바이어스 전압이 갭 에너지보다 작을 때도 전류가 흐르는 현상을 설명하기 위해 제안되었습니다.", "origin": "Klapwijk, Free, and Barbis (1982)", "connections": "Andreev reflection, Josephson junction, Transparency"}, {"term": "Junction Transparency", "why_emerged": "터널링 장벽의 두께나 높이에 따라 전자 구조가 접합을 통과할 확률이 달라지는 정도를 나타냅니다.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "Tunneling current, Transmission coefficient, Landauer formula"}], "english_summary": ["The study demonstrates transparency-controlled multiple charge transfer in Pb(111) superconducting junctions.", "A newly developed amplifier enables high-precision shot-noise measurements using STM.", "The results show a transition from single-electron tunneling to multiple Andreev reflection as transparency increases.", "This provides a powerful platform for atomic-scale investigation of microscopic charge transport mechanisms."]}}, {"title": "d-wave altermagnetism and nonlinear transport in Dirac semimetals", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/kz4s-11k6", "authors": "Xin-Mei Wei, Zi-Ming Wang, Dong-Hui Xu", "last_authors": "Zi-Ming Wang, Dong-Hui Xu", "summary": "Altermagnets combine compensated collinear magnetic order with momentum-dependent spin splitting. A key question is how such spin splitting can arise from electronic interactions in a spin-degenerate Dirac semimetal and what spin-resolved transport signatures it produces. We address this issue using…", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Directly links altermagnetism and Dirac semimetals, two key topics in the user's profile.", "tags": ["theory", "altermagnetism", "Diracsemimetals"], "image": "", "briefing": {"background": "알터마그네티즘(Altermagnetism)은 순 자화값은 0이면서도 결정 구조의 대칭성 덕분에 운동량 공간에서 스핀 분할이 일어나는 새로운 자성 상태로, 강자성과 반강자성의 장점을 동시에 가집니다. 최근 위상 반금속(Dirac/Weyl semimetals)과의 결합을 통해 새로운 양자 수송 현상을 찾으려는 시도가 활발합니다.", "motivation": "스핀 축퇴가 있는 디락 반금속에서 전자 간 상호작용이 어떻게 d-파동 형태의 알터마그네틱 스핀 분할을 유도하는지, 그리고 이것이 실제 측정 가능한 비선형 수송 신호로 어떻게 나타나는지 이론적으로 규명하고자 했습니다.", "result": "이 연구는 디락 반금속 모델에서 상호작용에 의해 유도된 d-파동 알터마그네티즘이 독특한 스핀 분해 밴드 구조를 형성함을 보였습니다. 특히, 시간 반전 대칭성 깨짐과 관련된 비선형 홀 효과(nonlinear Hall effect) 및 스핀 분해 수송 특성이 시스템의 위상적 성질과 밀접하게 연결됨을 입증했습니다.", "implication": "알터마그네틱 디락 반금속이 차세대 스핀트로닉스 소자에서 외부 자기장 없이도 스핀 전류를 생성하고 제어할 수 있는 플랫폼이 될 수 있음을 시사합니다.", "novelty": "독자의 관심사인 알터마그네티즘과 디락 반금속을 결합하여, 단순한 선형 응답을 넘어선 비선형 수송 관점에서의 물리적 청사진을 제시했다는 점이 중요합니다. 이는 실험적으로 비선형 수송 측정을 통해 알터마그네틱 상태를 검증할 수 있는 근거를 제공합니다.", "unresolved": "제시된 모델은 유효 해밀토니안에 기반하므로, 실제 후보 물질(예: RuO2, MnTe 등)의 구체적인 격자 구조와 궤도 자유도가 상호작용에 미치는 영향을 포함한 더 복잡한 계산이 필요합니다.", "future_work": "ARPES를 통한 직접적인 스핀 분할 관측과 비선형 홀 전도도 측정을 결합한 실험적 검증 연구가 뒤따를 것으로 예상됩니다.", "concepts": [{"term": "알터마그네티즘 (Altermagnetism)", "why_emerged": "기존 반강자성체의 스핀 축퇴를 깨면서도 강자성체처럼 거시적 자화가 없는 자성체를 설명하기 위해 등장했습니다.", "origin": "Libor Šmejkal, Jairo Sinova, Tomáš Jungwirth 등이 최근 이론적으로 확립했습니다.", "connections": "반강자성, 스핀 분할, 비선형 홀 효과, 스핀 홀 효과."}, {"term": "디락 반금속 (Dirac semimetal)", "why_emerged": "선형적인 에너지 분산 관계를 갖는 3차원 물질에서 질량 없는 페르미온의 동역학을 연구하기 위해 필요했습니다.", "origin": "2010년대 초반 Na3Bi, Cd3As2 등의 발견으로 실험적으로 확립되었습니다.", "connections": "베리 곡률, 위상 절연체, 바일 반금속."}, {"term": "비선형 수송 (Nonlinear transport)", "why_emerged": "전압의 제곱에 비례하는 홀 효과 등 선형 응답으로 설명할 수 없는 대칭성 깨짐을 감지하기 위해 연구됩니다.", "origin": "Fu (2015) 등이 베리 곡률 쌍극자(Berry curvature dipole) 개념을 통해 이론적 기초를 닦았습니다.", "connections": "반전 대칭성 깨짐, 베리 곡률 쌍극자, 광전류 효과."}], "english_summary": ["Investigates the emergence of d-wave altermagnetism in spin-degenerate Dirac semimetals through electronic interactions.", "Identifies unique spin-resolved transport signatures and nonlinear Hall effects arising from the altermagnetic phase.", "Provides a theoretical framework for utilizing altermagnetic Dirac semimetals in field-free spintronic applications.", "Highlights the connection between momentum-dependent spin splitting and topological Berry curvature effects."]}}, {"title": "Directional Transport by Topological Pump of Localized Moiré Bulk States", "journal": "PRL_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/cxsy-gshw", "authors": "Dan Yao, Zhonghao Fu, Hailong He, et al.", "last_authors": "Manzhu Ke, Zhengyou Liu", "summary": "The discovery of directional and robust wave manipulation has become a crucial goal in the field of science and technology. Topological pump, as an efficient form of directed energy transport protected by nontrivial topology, has been intensively studied in condensed matter and materials physics. Co…", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Explores topological transport in moiré systems, relevant for topological and moiré materials.", "tags": ["moire", "topologicaltransport", "condensedmattertheory"], "image": "", "briefing": {"background": "위상 펌프(Topological pump)는 시스템 매개변수의 주기적인 단열 변화를 통해 양자화된 function appendBriefSection(parent, title, text, wide = false) { if (!text) return; const section = document.createElement('section'); section.className = 'brief-section' + (wide ? ' wide' : ''); section.appendChild(textEl('h2', '', title)); section.appendChild(textEl('p', '', text)); parent.appendChild(section); }
function render() {
  slideEl.replaceChildren();
  if (!slides.length) { slideEl.className = 'empty'; slideEl.textContent = 'No papers passed the filters in this run.'; counterEl.textContent = '0 / 0'; prevBtn.disabled = true; nextBtn.disabled = true; return; }
  slideEl.className = 'slide';
  const r = slides[index];
  const b = r.briefing || {};
  const head = document.createElement('div');
  head.className = 'paper-head';
  if (r.image) {
    const figure = document.createElement('figure');
    figure.className = 'figure';
    const img = document.createElement('img');
    img.src = r.image; img.alt = 'Figure or article preview image'; img.loading = 'lazy'; img.referrerPolicy = 'no-referrer'; img.onerror = () => figure.remove();
    figure.appendChild(img);
    figure.appendChild(textEl('figcaption', '', 'Figure / article preview image from the source page'));
    head.appendChild(figure);
  }
  const headText = document.createElement('div');
  headText.className = 'head-text';
  const badges = document.createElement('div');
  badges.className = 'badges';
  if (r.score) badges.appendChild(textEl('span', 'badge score', `${r.score}/10`));
  if (r.tier) badges.appendChild(textEl('span', 'badge', r.tier));
  if (r.journal) badges.appendChild(textEl('span', 'badge', r.journal));
  if (r.source) badges.appendChild(textEl('span', 'badge', r.source));
  headText.appendChild(badges);
  const title = document.createElement('h1');
  if (r.link) { const titleLink = document.createElement('a'); titleLink.href = r.link; titleLink.target = '_blank'; titleLink.rel = 'noopener noreferrer'; titleLink.textContent = r.title || ''; title.appendChild(titleLink); }
  else { title.textContent = r.title || ''; }
  headText.appendChild(title);
  headText.appendChild(textEl('p', 'meta', [r.journal, r.source].filter(Boolean).join(' | ')));
  if (r.last_authors || r.authors) { const authors = document.createElement('p'); authors.className = 'authors'; if (r.last_authors) authors.append('Last authors: ' + r.last_authors); if (r.authors) authors.append((r.last_authors ? ' | ' : '') + 'Authors: ' + r.authors); headText.appendChild(authors); }
  appendLabeledText(headText, 'why', 'Filter reason: ', r.reason);
  if (r.tags && r.tags.length) { const tags = document.createElement('div'); tags.className = 'tags'; r.tags.forEach(tag => tags.appendChild(textEl('span', 'tag', '#' + tag))); headText.appendChild(tags); }
  if (r.link) { const link = document.createElement('a'); link.className = 'link'; link.href = r.link; link.target = '_blank'; link.rel = 'noopener noreferrer'; link.textContent = 'Open paper'; headText.appendChild(link); }
  head.appendChild(headText);
  if (r.summary) { const abstract = document.createElement('p'); abstract.className = 'original-abstract'; const strong = textEl('strong', '', 'Original abstract'); abstract.appendChild(strong); abstract.append(r.summary); head.appendChild(abstract); }
  slideEl.appendChild(head);
  const briefing = document.createElement('div');
  briefing.className = 'briefing';
  appendBriefSection(briefing, 'Background', b.background);
  appendBriefSection(briefing, 'Motivation', b.motivation);
  appendBriefSection(briefing, 'Result', b.result);
  appendBriefSection(briefing, 'Implication', b.implication);
  appendBriefSection(briefing, "Why it's important / Novelty", b.novelty);
  appendBriefSection(briefing, 'Unresolved Questions', b.unresolved);
  appendBriefSection(briefing, 'Expected Future Work', b.future_work);
  if (b.concepts && b.concepts.length) {
    const section = document.createElement('section');
    section.className = 'brief-section wide';
    section.appendChild(textEl('h2', '', 'Concepts / Terms'));
    const concepts = document.createElement('div');
    concepts.className = 'concepts';
    b.concepts.forEach(c => {
      const item = document.createElement('div');
      item.className = 'concept';
      item.appendChild(textEl('h3', '', c.term || 'Concept'));
      [['왜 생겼나: ', c.why_emerged], ['누가 만들었나: ', c.origin], ['연결되는 흐름: ', c.connections]].forEach(([label, text]) => { if (!text) return; const p = document.createElement('p'); const bold = textEl('b', '', label); p.appendChild(bold); p.append(text); item.appendChild(p); });
      concepts.appendChild(item);
    });
    section.appendChild(concepts);
    briefing.appendChild(section);
  }
  if (b.english_summary && b.english_summary.length) { const section = document.createElement('section'); section.className = 'brief-section wide'; section.appendChild(textEl('h2', '', 'English Summary')); const ul = document.createElement('ul'); b.english_summary.slice(0, 5).forEach(line => ul.appendChild(textEl('li', '', line))); section.appendChild(ul); briefing.appendChild(section); }
  slideEl.appendChild(briefing);
  counterEl.textContent = `${index + 1} / ${slides.length}`;
  prevBtn.disabled = index === 0;
  nextBtn.disabled = index === slides.length - 1;
}
prevBtn.addEventListener('click', () => { index = Math.max(0, index - 1); render(); });
nextBtn.addEventListener('click', () => { index = Math.min(slides.length - 1, index + 1); render(); });
document.addEventListener('keydown', event => { if (event.key === 'ArrowLeft') prevBtn.click(); if (event.key === 'ArrowRight') nextBtn.click(); });
render();
</script>
</body>
</html>
