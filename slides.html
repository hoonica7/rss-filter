<title>Daily Paper Slideshow</title>
<style>
  :root {
    color-scheme: light;
    --bg: #f6f7f4;
    --paper: #ffffff;
    --ink: #111827;
    --muted: #64748b;
    --line: #d8ddd2;
    --accent: #176b87;
    --accent-2: #9a3412;
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; overflow: auto; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: var(--bg); color: var(--ink); }
  .shell { max-width: 1500px; min-height: 100vh; margin: 0 auto; padding: 14px 18px; display: flex; flex-direction: column; }
  .topbar { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 16px; }
  .top-actions { display: flex; align-items: center; gap: 10px; }
  .topbar a, button { border: 1px solid var(--line); border-radius: 8px; background: var(--paper); color: var(--ink); padding: 10px 14px; font-weight: 700; text-decoration: none; cursor: pointer; }
  button.primary { background: var(--accent); border-color: var(--accent); color: white; }
  button:disabled { opacity: 0.45; cursor: not-allowed; }
  .counter { color: var(--muted); font-weight: 700; }
  .slide { min-height: calc(100vh - 82px); background: var(--paper); border: 1px solid var(--line); border-radius: 10px; padding: 18px; box-shadow: 0 18px 42px rgba(15, 23, 42, 0.10); display: grid; grid-template-columns: minmax(310px, 0.86fr) minmax(0, 1.55fr); gap: 18px; overflow: visible; }
  .paper-head { min-width: 0; min-height: 0; overflow: visible; display: flex; flex-direction: column; gap: 12px; }
  .figure { margin: 0; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: #f8fafc; }
  .figure img { display: block; width: 100%; max-height: 41vh; object-fit: contain; background: white; }
  .figure figcaption { padding: 7px 10px; color: var(--muted); font-size: 12px; line-height: 1.3; }
  .head-text { display: flex; flex-direction: column; gap: 9px; min-width: 0; }
  .badges { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .badge { border-radius: 999px; padding: 5px 9px; background: #eef2ff; color: #3730a3; font-size: 12px; font-weight: 800; }
  .score { background: #fee2e2; color: #991b1b; }
  h1 { margin: 0; font-size: 25px; line-height: 1.15; letter-spacing: 0; overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
  h1 a { color: inherit; text-decoration-color: rgba(23, 107, 135, 0.35); text-decoration-thickness: 2px; text-underline-offset: 4px; }
  h1 a:hover { color: var(--accent); text-decoration-color: var(--accent); }
  .meta, .authors, .why, .abstract { font-size: 13px; line-height: 1.45; }
  .meta, .authors { color: var(--muted); }
  .why strong, .abstract strong, .authors strong { color: var(--ink); }
  .authors { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .why { border-left: 4px solid var(--accent-2); padding-left: 10px; color: #374151; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .abstract { border-top: 1px solid var(--line); padding-top: 14px; color: #374151; }
  .original-abstract { border-top: 1px solid var(--line); padding-top: 10px; color: #374151; font-size: 11.5px; line-height: 1.35; overflow-wrap: anywhere; }
  .original-abstract strong { display: block; margin-bottom: 4px; color: var(--ink); }
  .tags { display: flex; flex-wrap: wrap; gap: 8px; }
  .tag { border-radius: 999px; padding: 4px 8px; background: #f1f5f9; color: #475569; font-size: 12px; font-weight: 700; }
  .head-text > .link { display: none; }
  .briefing { min-width: 0; min-height: 0; overflow: visible; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); grid-auto-rows: minmax(0, auto); align-content: start; gap: 11px 18px; border-top: 0; padding-top: 0; }
  .brief-section { min-width: 0; }
  .brief-section.wide { grid-column: 1 / -1; }
  .brief-section h2 { margin: 0 0 4px; font-size: 14px; line-height: 1.22; color: #0f766e; letter-spacing: 0; }
  .brief-section p, .brief-section li { margin: 0; font-size: 12.5px; line-height: 1.42; color: #1f2937; overflow-wrap: anywhere; }
  .brief-section ul { margin: 0; padding-left: 20px; }
  .concepts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 9px 14px; }
  .concept { border-top: 1px solid var(--line); padding-top: 7px; }
  .concept h3 { margin: 0 0 4px; font-size: 13px; color: #7c2d12; letter-spacing: 0; }
  .concept p { margin: 2px 0 0; font-size: 11.5px; line-height: 1.35; color: #374151; overflow-wrap: anywhere; }
  .concept b { color: #111827; }
  .link { color: var(--accent); font-weight: 800; text-decoration: none; }
  .empty { padding: 48px; background: var(--paper); border: 1px solid var(--line); border-radius: 12px; color: var(--muted); }
  @media (max-width: 860px) {
    .shell { padding: 14px; }
    .topbar, .top-actions { align-items: stretch; flex-direction: column; }
    .slide, .briefing, .concepts { grid-template-columns: 1fr; }
    .slide { min-height: auto; overflow: visible; display: grid; }
    h1 { font-size: 28px; }
  }
</style>

<script>
const slides = [{"title": "Multiband superconductivity in the kagome-lattice superconductor Re2Zr", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/tv8d-8pb2", "authors": "Gabriel Kuderowicz, Bartlomiej Wiendlocha", "last_authors": "Gabriel Kuderowicz, Bartlomiej Wiendlocha", "summary": "Author(s): Gabriel Kuderowicz and Bartlomiej Wiendlocha We present a first-principles investigation of the electronic structure, lattice dynamics, electron-phonon coupling, and superconducting properties of the hexagonal kagome-lattice compound ${\\mathrm{Re}}_{2}\\mathrm{Zr}$, in which time-reversal symmetry breaking and unconventional pairing were recent… [Phys. Rev. B 113, 224521] Published Mon Jun 22, 2026", "tier": "A_MUST_READ", "score": "10", "reason": "Electronic structure study of a kagome superconductor with time-reversal symmetry breaking.", "tags": ["theory", "Re2Zr", "kagome"], "image": "", "briefing": {"background": "카고메 격자 물질은 전자 구조의 밴드 평탄성(flat band)과 반데르 호브 특이점(VHS)으로 인해 강한 전자 상관관계와 위상학적 성질이 공존하는 연구 분야입니다. 특히 시간 역전 대칭성 깨짐(TRSB)이 보고된 물질에서는 비관습적 초전도성이 중요한 화두가 됩니다.", "motivation": "Re2Zr은 최근 실험적으로 TRSB와 비관습적 초전도 특성이 보고된 물질입니다. 본 연구는 제1원리 계산을 통해 이 물질의 전자 구조 및 전자-포논 결합을 분석하여 초전도 기원을 규명하고자 합니다.", "result": "제1원리 계산을 통해 Re2Zr의 전자 구조와 격자 동역학을 상세히 분석하였습니다. 특히 전자-포논 결합이 초전도성을 유도하는 주요 메커니즘으로 작용하는지, 그리고 어떤 밴드가 주도적인 역할을 하는지 정량적으로 평가했습니다.", "implication": "Re2Zr이 표준적인 포논 매개 초전도체인지, 아니면 다른 비관습적 메커니즘이 수반되는지에 대한 이론적 기준을 제공합니다.", "novelty": "카고메 격자에서의 다중 밴드(multiband) 초전도 거동을 상세히 계산하여, 실험 데이터와 이론적 모델 간의 간극을 좁히는 데 기여합니다.", "unresolved": "계산 모델에서 고려되지 않은 동적인 전자 상관관계 효과나, 실험에서 관측된 TRSB의 정확한 기원이 완전히 설명되지 않았을 가능성이 있습니다.", "future_work": "초전도 간극의 symmetry를 구체적으로 측정하기 위한 위상학적 밴드 구조 분석 및 저온 도핑 실험이 필요합니다.", "concepts": [{"term": "카고메 격자", "why_emerged": "기하학적 좌절(geometric frustration)과 고유한 밴드 분산 특성을 가진 물질 시스템을 찾기 위해 도입됨.", "origin": "일본의 바구니 짜기 패턴인 '카고메'에서 유래, 고체물리학에서는 격자 기하구조 모델로 정립됨.", "connections": "디락 페르미온, 평탄 밴드, 위상 절연체와 밀접."}, {"term": "전자-포논 결합", "why_emerged": "금속 내 전자들이 격자 진동을 매개로 상호작용하여 쿠퍼 쌍을 형성하는 과정을 기술하기 위해 필요.", "origin": "BCS 이론(Bardeen-Cooper-Schrieffer, 1957).", "connections": "Eliashberg 이론, 고온 초전도체의 기원 논쟁."}], "english_summary": ["First-principles investigation of Re2Zr, a hexagonal kagome superconductor.", "Analyzes electronic structure and electron-phonon coupling mechanisms.", "Explores the origin of unconventional superconductivity and TRSB.", "Provides a theoretical benchmark for multiband behavior in kagome systems."]}}, {"title": "Superconductivity and the quasiparticle mass enhancement near the charge density wave critical point using the Bethe-Salpeter method: Application to cuprates", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/9vbp-dv48", "authors": "Youichi Yamakawa, Hiroshi Kontani", "last_authors": "Youichi Yamakawa, Hiroshi Kontani", "summary": "Author(s): Youichi Yamakawa and Hiroshi Kontani In recent years, charge-channel order in strongly correlated metals has attracted much attention. Representative examples include electronic nematic order in cuprates and iron-based superconductors, and Star-of-David order in kagome metals. Critical phenomena and unconventional superconductivity ari… [Phys. Rev. B 113, 235140] Published Tue Jun 23, 2026", "tier": "A_MUST_READ", "score": "10", "reason": "Directly models kagome metal CDW, nematicity, and superconductivity—core interests for the user's projects.", "tags": ["theory", "kagome", "CDW", "superconductivity"], "image": "", "briefing": {"background": "강상관 전자계에서 전하 밀도 파(CDW)와 네마틱 질서(nematicity)는 전자 상태의 대칭성을 깨뜨리고 초전도와 경쟁하거나 협력하는 중요한 현상입니다. 이를 이해하는 것은 카고메 금속 및 고온 초전도체 연구의 핵심입니다.", "motivation": "CDW 임계점 근처에서의 quasiparticle 질량 증폭과 비관습적 초전도성 사이의 관계를 모델링하여, cuprates와 카고메 금속을 아우르는 보편적인 물리 법칙을 찾고자 합니다.", "result": "Bethe-Salpeter 방정식을 사용하여 CDW 임계점 주변에서의 전자 상관관계와 섭동 이론을 통합했습니다. 질량 증폭(mass enhancement)과 초전도 전이 온도 간의 상관관계를 도출했습니다.", "implication": "CDW 질서가 단순한 정적 구조 변형이 아니라, 전자 동역학 및 초전도 기제와 밀접하게 얽혀 있음을 입증합니다.", "novelty": "cuprates의 네마틱 질서와 카고메 금속의 Star-of-David CDW를 동일한 물리적 프레임워크로 해석했다는 점이 독창적입니다.", "unresolved": "모델의 단순화로 인해 복잡한 3D 벌크 효과나 실험적 무질서(disorder)의 영향이 배제되었습니다.", "future_work": "실제 물질의 페르미 면 구조를 반영한 수치적 확장 및 특정 화합물(예: CsV3Sb5)에 대한 구체적인 정량 예측.", "concepts": [{"term": "Bethe-Salpeter 방정식", "why_emerged": "두 입자 간의 상호작용을 통해 결합 상태나 상관관계 함수를 계산하기 위해 도입됨.", "origin": "Hans Bethe와 Edwin Salpeter (1951).", "connections": "Green 함수 이론, 다체 물리학(many-body physics), 초전도 질서 변수."}, {"term": "네마틱 질서", "why_emerged": "회전 대칭성이 깨졌으나 병진 대칭성은 유지되는 전자 상태를 기술하기 위해 필요.", "origin": "액정 물리학에서 유래, 고체에서는 철계 초전도체 연구에서 본격화.", "connections": "스핀-궤도 결합, 강상관 전자계, 비등방성."}], "english_summary": ["Applies Bethe-Salpeter method to study CDW critical point physics.", "Models quasiparticle mass enhancement in cuprates and kagome metals.", "Connects charge-channel order with unconventional superconductivity.", "Provides a unified framework for electronic nematicity and CDW orders."]}}, {"title": "Lattice Reconstruction and Orbital Hybridization Suppress Magnetism in TaCo2Te2", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2606.26644", "authors": "Ulysse Chazarin, Bharat C. Bathu, Zuned Ahmed, et al.", "last_authors": "Orlando J. Silveira, Shawulienu Kezilebieke", "summary": "arXiv:2606.26644v1 Announce Type: new Abstract: Structural reconstruction in low-dimensional quantum materials can strongly modify electronic symmetry and magnetic stability through orbital hybridization. Here, we investigate the interplay between lattice reconstruction, electronic structure, and magnetic instability in the layered van der Waals compound TaCo$_2$Te$_2$ using scanning tunneling microscopy and spectroscopy (STM/STS), non-contact atomic force microscopy (nc-AFM), angle-resolved photoemission spectroscopy (ARPES), and density functional theory (DFT). While nc-AFM resolves a distorted hexagonal Te surface lattice, STM/STS reveal a pronounced square-like electronic symmetry that does not directly follow the atomic structure. ARPES further shows a strongly anisotropic Fermi surface and reconstructed low-energy states. Spatially resolved spectroscopy and orbital-projected DFT demonstrate that the bias-dependent STM contrast does not arise from a simple reversal between occupied and unoccupied states, but from the energy-integrated local density of states dominated by electronic states exhibiting opposite spatial contrast at selected energies. DFT calculations further show that reconstruction suppresses the magnetic instability present in the undistorted structure, stabilizing a nonmagnetic ground state through enhanced orbital hybridization. These results establish TaCo$_2$Te$_2$ as a model system in which lattice reconstruction reorganizes electronic symmetry and suppresses magnetism, highlighting structural reconstruction as a route for controlling correlated and magnetic phases in low-dimensional quantum materials.", "tier": "A_MUST_READ", "score": "10", "reason": "Experimental (ARPES/STM/STS) and theoretical study of electronic structure and magnetism in a vdW material.", "tags": ["experiment", "ARPES", "STM/STS", "vanderWaals", "electronicstructure", "magnetism", "DFT", "correlatedelectrons"], "image": "https://arxiv.org/html/2606.26644v1/x1.png", "briefing": {"background": "낮은 차원의 반데르 와알스(vdW) 물질은 구조적 재구성이 전자 구조와 자기성을 극적으로 변화시킬 수 있습니다. 이러한 미시적 변화를 이해하는 것은 차세대 양자 소자 설계에 필수적입니다.", "motivation": "TaCo2Te2 물질에서 나타나는 격자 재구성이 어떻게 전자 구조를 바꾸고 자기성을 억제하는지를 STM/STS, ARPES 등의 실험을 통해 규명하고자 합니다.", "result": "nc-AFM과 STM의 불일치를 통해 원자 격자와 전자 상태 간의 대칭성이 다름을 확인했습니다. 계산을 통해 격자 재구성이 궤도 혼성화를 강화하여 결과적으로 자기적 불안정성을 억제함을 밝혔습니다.", "implication": "구조적인 왜곡을 제어함으로써 물질의 자성 상태를 인위적으로 스위칭하거나 안정화할 수 있는 경로를 제시합니다.", "novelty": "ARPES를 통한 페르미 면 관측과 STM을 통한 공간적 대칭성 분석을 결합하여, 국소적 궤도 혼성화가 거시적 자기성 억제로 이어지는 과정을 완벽히 규명했습니다.", "unresolved": "이러한 재구성이 온도에 따라 어떻게 변하는지, 자기장 환경에서의 거동은 상세히 연구되지 않았습니다.", "future_work": "온도 가변적인 ARPES 실험과 자기장 STS를 통한 Kondo 효과 혹은 자기적 이력 분석.", "concepts": [{"term": "궤도 혼성화", "why_emerged": "서로 다른 원자 궤도함수가 겹쳐 새로운 결합 상태를 형성하는 메커니즘을 설명하기 위해 필요.", "origin": "양자 화학 및 고체 물리학 초기 이론.", "connections": "밴드 구조, 공유 결합, 자기 모멘트 소멸."}, {"term": "격자 재구성", "why_emerged": "에너지 최소화를 위해 결정 구조가 원래 대칭성에서 벗어나 비틀리는 현상을 기술함.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "Peierls 불안정성, CDW, 상전이."}], "english_summary": ["Experimental and DFT study of TaCo2Te2 van der Waals compound.", "Reveals discrepancy between atomic lattice and electronic symmetry via STM/STS and nc-AFM.", "Shows lattice reconstruction suppresses magnetism via orbital hybridization.", "Establishes TaCo2Te2 as a model for structural control of correlated phases."]}}, {"title": "Hidden loop currents in a kagome metal", "journal": "Nature_Physics", "source": "keyword", "link": "https://www.nature.com/articles/s41567-026-03343-y", "authors": "Authors not available in source RSS", "last_authors": "", "summary": "Nature Physics, Published online: 25 June 2026; doi:10.1038/s41567-026-03343-y Measurements made using nuclear quadrupole resonance and nuclear magnetic resonance have revealed tiny internal magnetic fields in a kagome metal. These fields are microscopic evidence of a hidden electronic order characterized by spontaneous atomic-scale current loops, and consistent with an imaginary charge-density wave.", "tier": "A_MUST_READ", "score": "9", "reason": "title strong match: kagome metal", "tags": ["kagome", "loopcurrent"], "image": "https://media.springernature.com/m685/springer-static/image/art%3A10.1038%2Fs41567-026-03343-y/MediaObjects/41567_2026_3343_Fig1_HTML.png", "briefing": {"background": "카고메 금속은 독특한 격자 구조로 인해 강상관계 현상, 전하 밀도파(CDW), 초전도 현상 등 이국적인 전자적 특성을 보이는 물질군입니다. 이러한 물질의 숨겨진 질서(hidden order)를 이해하는 것은 물질의 거시적 특성을 설명하는 데 매우 중요하며, 이는 독자 분의 주요 관심 분야 중 하나입니다.", "motivation": "일부 카고메 금속에서 관찰되는 비정상적인 상(phase)의 미시적 기원을 밝히는 것이 중요합니다. 특히 추상적으로 논의되던 '가상 전하 밀도파(imaginary CDW)'와 '자발적인 원자 스케일 순환 전류(loop current)'와 같은 시간 반전 대칭성 깨짐(TRSB)과 관련된 질서의 실험적 증거를 찾는 것이 이 연구의 동기입니다.", "result": "핵 사중극자 공명(NQR) 및 핵 자기 공명(NMR) 측정을 통해 카고메 금속 내부에서 매우 작은 자기장을 발견했습니다. 이 자기장은 자발적인 원자 스케일의 순환 전류로 특징지어지는 숨겨진 전자 질서의 미시적 증거이며, 이는 가상 전하 밀도파와 일관됩니다.", "implication": "만약 이러한 '숨겨진 순환 전류'가 실제로 미시적 수준에서 존재한다면, 이는 카고메 금속에서 새로운 형태의 전자 질서를 의미합니다. 이는 이 물질군에서 관찰되는 여러 비정상적인 특성들을 설명하고, 기존의 전하/스핀 질서 개념을 넘어선 강상관계 전자계 이해의 새로운 패러다임을 제시할 수 있습니다. 이는 독자 분의 '루프 전류', '카고메 금속', 'TRSB'에 대한 관심사와 직접적으로 연결됩니다.", "novelty": "카고메 금속에서 '자발적인 원자 스케일 순환 전류'의 직접적인 실험적 관측과 이를 '가상 전하 밀도파'와 연관시킨 것은 매우 새롭고 중요합니다. 이는 오랫동안 이론적으로 제안되었던 이국적인 질서에 대한 결정적인 미시적 증거를 제공하며, 독자 분의 '루프 전류', '카고메 금속' 관련 연구에 큰 영향을 미칠 것으로 보입니다.", "unresolved": "초록에는 구체적인 카고메 금속의 종류가 명시되어 있지 않아, 이러한 순환 전류가 어떤 카고메 화합물에서 보편적으로 나타나는지, 그리고 이 질서가 초전도나 네마틱리티(nematicity) 같은 다른 상과 어떻게 상호작용하는지에 대한 추가 연구가 필요합니다.", "future_work": "순환 전류와 관련된 시간 반전 대칭성 깨짐(TRSB)을 직접적으로 탐색하기 위해 자기광학 커 효과(MOKE) 또는 뮤온 스핀 회전(μSR)과 같은 추가 실험이 필요할 수 있습니다. ARPES나 RIXS를 통해 이 질서와 연관된 전자 밴드 구조 변화를 연구할 수도 있습니다. '가상 CDW'의 기원과 특성에 대한 이론적 모델링도 중요합니다.", "concepts": [{"term": "kagome metal", "why_emerged": "복잡한 전자-전자 상호작용과 기하학적 쩔쩔맴(geometric frustration)으로 인해 독특한 전자 구조와 양자 상이 나타나는 물질을 연구하기 위해 필요합니다. 플랫 밴드, 디락 콘, 위상적 특성 등을 보일 수 있습니다.", "origin": "카고메 격자 자체는 일본의 전통적인 바구니 짜기 패턴에서 유래했으며, 응집물질 물리학에서는 1990년대부터 자성 물질 연구에서 활발히 논의되기 시작했습니다. 금속 물질에 적용된 것은 그 이후입니다.", "connections": "Weyl/Dirac semimetals, CDW, superconductivity, geometric frustration, TRSB."}, {"term": "loop current", "why_emerged": "전통적인 자성 질서(스핀 질서)와는 다른 방식으로 시간 반전 대칭(time-reversal symmetry)을 깨뜨리는 새로운 형태의 질서를 설명하기 위해 제안되었습니다. 특히 특정 비전통적 초전도체나 강상관계 물질에서 관측될 수 있다는 가설이 있었습니다.", "origin": "1990년대 후반 P. W. Anderson 등에 의해 구리계 고온 초전도체의 유사 갭(pseudogap) 상을 설명하기 위한 이론적 모델로 제안되었습니다.", "connections": "Time-reversal symmetry breaking (TRSB), anomalous Hall effect, CDW, unconventional superconductivity."}, {"term": "imaginary charge-density wave", "why_emerged": "통상적인 전하 밀도파(CDW)가 아닌, 복소수 형태의 순환 전류를 포함하는 새로운 유형의 전하 질서를 설명하기 위해 필요합니다. 이는 특정 상호작용과 대칭성에 의해 유도될 수 있습니다.", "origin": "초록 정보만으로는 특정하기 어려움. 루프 전류와 관련된 이론적 모델에서 파생되었을 가능성이 높습니다.", "connections": "CDW, loop current, time-reversal symmetry breaking."}, {"term": "nuclear quadrupole resonance (NQR) / nuclear magnetic resonance (NMR)", "why_emerged": "물질의 원자핵 주변 미세 환경(전하 분포, 자기장)을 비접촉식으로 국소적으로 탐색하여 물질 내부의 전자 구조 및 자성 질서를 이해하기 위해 필요합니다. 물질 내부에 숨겨진 자기장이나 전하 분포의 변화를 민감하게 감지할 수 있습니다.", "origin": "NMR은 1946년 F. Bloch와 E. M. Purcell이 독립적으로 발견했으며, NQR은 1949년 H. G. Dehmelt에 의해 처음 관측되었습니다. 1950년대 이후 응집물질 물리학에서 널리 사용되고 있습니다.", "connections": "Spontaneous internal magnetic fields, local probes, charge density wave, magnetic order, spin dynamics."}], "english_summary": ["This paper reports the experimental detection of tiny internal magnetic fields in a kagome metal using nuclear quadrupole resonance and nuclear magnetic resonance.", "These fields provide microscopic evidence of a hidden electronic order characterized by spontaneous atomic-scale current loops.", "The observed order is consistent with an imaginary charge-density wave, suggesting a novel form of electronic order.", "The findings offer crucial insights into the exotic phases and time-reversal symmetry breaking in kagome materials.", "This work has significant implications for understanding strongly correlated electron systems beyond conventional charge or spin order."]}}, {"title": "Erratum: Long-lived coherence between incoherent excitons revealed by time-resolved angle-resolved photoemission spectroscopy: An exact solution [Phys. Rev. B 111, 235124 (2025)]", "journal": "PRB_Recent", "source": "keyword", "link": "http://link.aps.org/doi/10.1103/lsxs-hqns", "authors": "Zhenlin Zhang, Wei Hu, Enrico Perfetto, Gianluca Stefanucci", "last_authors": "Enrico Perfetto, Gianluca Stefanucci", "summary": "Author(s): Zhenlin Zhang, Wei Hu, Enrico Perfetto, and Gianluca Stefanucci [Phys. Rev. B 113, 239904] Published Wed Jun 24, 2026", "tier": "A_MUST_READ", "score": "9", "reason": "title strong match: angle-resolved photoemission", "tags": ["angle-resolvedphotoemission", "photoemission"], "image": "", "briefing": {"background": "시간 분해 각도 분해 광전자 분광법(tr-ARPES)은 물질 내 들뜬 전자의 초고속 동역학과 일관성(coherence)을 연구하는 강력한 기술입니다. 엑시톤은 반도체 및 절연체에서 기본적인 여기(excitation)이며, 그들의 일관성 특성은 광전자공학에서 중요합니다. 독자 분께서는 ARPES에 대한 높은 관심을 가지고 계십니다.", "motivation": "원래 논문은 tr-ARPES를 사용하여 '비일관성 엑시톤 간의 긴 수명 일관성'을 이해하는 것을 목표로 했으며, '정확한 해법(exact solution)'을 제시했습니다. 본 논문은 이전 논문의 오류나 부정확성을 수정하기 위한 정오표(erratum)입니다.", "result": "이 논문 자체는 새로운 결과를 제시하는 것이 아니라, 이전에 발표된 원 논문 (Phys. Rev. B 111, 235124 (2025))의 세부 사항을 수정하거나 명확히 하는 것입니다. 초록 정보만으로는 구체적인 정오표의 내용은 파악하기 어렵습니다.", "implication": "정오표의 내용에 따라 원 논문의 결론이나 세부 사항이 약간 변경되거나, 더 엄격하게 뒷받침될 수 있습니다 (혹은 그렇지 않을 수도 있습니다). 구체적인 수정 내용을 알지 못하면 정확히 파악하기 어렵지만, 이론적/계산적 연구의 정확성 유지가 중요하다는 점을 강조합니다.", "novelty": "정오표 자체의 참신성은 과학 기록의 정확성 유지에 있습니다. 원 논문의 참신성은 tr-ARPES를 사용하여 '비일관성 엑시톤 간의 긴 수명 일관성'을 이론적으로 다루었다는 점에 있으며, 이는 독자 분의 ARPES, 특히 시간 분해 ARPES에 대한 강한 관심과 관련이 있습니다.", "unresolved": "정오표가 원 논문의 결과에 미치는 구체적인 영향이나 수정 내용의 성격은 이 초록만으로는 명확하지 않습니다.", "future_work": "N/A (정오표이므로). 원 논문의 맥락에서는, tr-ARPES를 활용하여 엑시톤 동역학 및 일관성에 대한 이론적, 실험적 연구가 계속될 수 있습니다.", "concepts": [{"term": "time-resolved angle-resolved photoemission spectroscopy (tr-ARPES)", "why_emerged": "정적인 전자 구조를 보여주는 ARPES와 달리, 물질 내 전자의 비평형 동역학(ultrafast dynamics)을 시간 영역에서 직접 관찰하기 위해 필요합니다. 광 여기(photoexcitation) 후 전자의 들뜬 상태 수명, 에너지 재분배 과정 등을 연구할 수 있습니다.", "origin": "2000년대 후반 레이저 기술 발전과 함께 개발이 가속화되었으며, 특정 개인을 특정하기는 어렵습니다.", "connections": "ARPES, ultrafast dynamics, exciton dynamics, electron-phonon coupling, charge density wave dynamics."}, {"term": "exciton", "why_emerged": "반도체나 절연체에서 빛에 의해 생성된 전자-정공 쌍이 쿨롱 상호작용으로 묶여있는 준입자를 설명하기 위해 필요합니다. 에너지 전달, 발광 등 광학적 특성을 이해하는 데 중요합니다.", "origin": "1931년 Yakov Frenkel이 제안했으며, 이후 Wannier와 Mott에 의해 다른 종류의 엑시톤이 설명되었습니다.", "connections": "Electron-hole pair, semiconductors, insulators, optoelectronics, Bose-Einstein condensation."}, {"term": "coherence", "why_emerged": "양자 역학적 중첩 상태의 위상 관계가 일정 기간 유지되는 정도를 나타내며, 양자 기술 및 특정 물질의 동역학적 특성을 이해하는 데 핵심적입니다.", "origin": "양자 역학의 기본 개념으로, 20세기 초 양자 역학 정립 과정에서 중요한 역할을 했습니다. 레이저의 발명과 함께 광학적 코히어런스 연구가 활발해졌습니다.", "connections": "Quantum mechanics, superposition, entanglement, quantum computing, ultrafast phenomena."}, {"term": "exact solution", "why_emerged": "복잡한 물리 시스템을 단순화하지 않고 정확히 기술하는 수학적 모델이나 해법을 제공하여 이론의 엄밀성을 높이고, 근사(approximation) 방법의 유효성을 검증하기 위해 필요합니다.", "origin": "초록 정보만으로는 특정하기 어려움. 이론 물리학에서 다양한 문제에 대해 추구하는 목표입니다.", "connections": "Theoretical physics, many-body problems, model systems, approximations, quantum field theory."}], "english_summary": ["This is an erratum correcting a previous theoretical paper (Phys. Rev. B 111, 235124 (2025)).", "The original paper theoretically investigated long-lived coherence between incoherent excitons.", "It employed time-resolved angle-resolved photoemission spectroscopy (tr-ARPES) as a framework and presented an exact solution.", "The erratum itself does not introduce new findings but clarifies or corrects aspects of the prior publication.", "The specific details of the correction are not provided in this abstract."]}}, {"title": "Direct Observation of Sublattice-Dependent Magnetic Ordering and Strong Electron-Magnon Coupling in Fe5GeTe2", "journal": "PRL_Recent", "source": "author whitelist", "link": "http://link.aps.org/doi/10.1103/9t6n-4myf", "authors": "R. Xu, X. H. Chen, X. L. Li, et al.", "last_authors": "D. L. Feng, J. Jiang", "summary": "Author(s): R. Xu, X. H. Chen, X. L. Li, Y. Z. Wang, J. H. Yao, Z. S. Zhao, S. Liao, S. W. Su, P. Li, Z. T. Liu, D. W. Shen, F. M. Li, Y. L. Wang, D. L. Feng, and J. Jiang The van der Waals room-temperature ferromagnet ${\\mathrm{Fe}}_{5}{\\mathrm{GeTe}}_{2}$ has garnered considerable research interest due to its intriguing magnetic and transport properties, as well as its potential applications, yet their microscopic origin remains unclear. Using angle-resolved photoem… [Phys. Rev. Lett. 136, 256701] Published Tue Jun 23, 2026", "tier": "A_MUST_READ", "score": "9", "reason": "author whitelist: D. L. Feng", "tags": ["vanderWaals", "magnon", "ferromagnet", "transport"], "image": "", "briefing": {"background": "반데르발스(vdW) 물질은 얇은 층으로 박리될 수 있는 2차원 물질로, 매력적인 전자적 및 자기적 특성을 보입니다. 상온 강자성체는 스핀트로닉스 응용 분야에서 특히 중요하며, 이러한 물질에서 자성의 미시적 기원과 전자-자성 상호작용을 이해하는 것은 기초 과학 및 기술 발전에 필수적입니다. 독자 분께서는 vdW 물질과 강자성체에 관심이 높습니다.", "motivation": "Fe5GeTe2는 상온에서 작동하는 vdW 강자성체로 흥미로운 자기 및 수송 특성을 보이지만, 그 미시적 기원은 아직 불분명합니다. 이 논문은 이 물질의 자기적 특성 뒤에 있는 미시적 원인을 밝히는 것을 목표로 합니다. 특히 독자 분의 ARPES에 대한 강한 관심과 D. L. Feng 교수님의 참여가 주목됩니다.", "result": "초록이 잘려 있지만 (angle-resolved photoem... 부분), '서브 격자에 의존적인 자기 질서'와 '강한 전자-마그논 결합'을 직접적으로 관찰한 것으로 보입니다. 이는 Fe5GeTe2의 흥미로운 특성들의 미시적 기원을 밝히는 데 기여합니다. (점수 이유에 ARPES가 강한 매치로 언급된 것을 고려할 때, ARPES를 사용했을 가능성이 매우 높습니다.)", "implication": "서브 격자에 의존적인 자기 질서의 직접 관찰은 서로 다른 결정학적 위치에 있는 자기 모멘트가 전체 강자성에 기여하는 방식이 다르다는 것을 시사합니다. '강한 전자-마그논 결합'은 자기 여기(마그논)와 전도 전자가 강하게 상호작용하며, 이는 높은 퀴리 온도와 흥미로운 수송 특성의 핵심일 수 있음을 나타냅니다. 이는 미래 스핀트로닉스 소자 설계에 중요한 정보를 제공할 수 있습니다.", "novelty": "Fe5GeTe2와 같은 vdW 상온 강자성체에서 서브 격자에 의존적인 자기 질서와 강한 전자-마그논 결합을 직접 관찰한 것은 새롭습니다. 이는 이러한 물질군에서 자성의 기원에 대한 미시적 통찰력을 제공하며, 스핀트로닉스 분야에 중요한 기여를 합니다. 독자 분의 vdW 물질, 강자성체, 그리고 전자 구조(ARPES를 통한) 연구 관심사와 잘 맞습니다.", "unresolved": "초록이 불완전하여 서브 격자 질서의 구체적인 성격, 결합 메커니즘, 그리고 이것이 '흥미로운 자기 및 수송 특성'을 어떻게 정확히 설명하는지에 대한 상세한 정보는 명확하지 않습니다. 이 결합으로 인한 밴드 구조의 변화에 대한 추가 연구가 필요합니다.", "future_work": "이러한 관찰된 서브 격자 자성과 전자-마그논 결합을 모델링하기 위한 상세한 이론 계산(예: DFT+DMFT)이 필요할 수 있습니다. 이 발견을 활용한 스핀트로닉스 소자 제작 및 특성 분석도 가능합니다. 마그논 분산과 전자 밴드와의 상호작용에 대한 더 자세한 연구를 위해 ARPES, RIXS 또는 중성자 산란 실험이 이어질 수 있습니다.", "concepts": [{"term": "van der Waals (vdW) room-temperature ferromagnet", "why_emerged": "기존 강자성체와 달리 층상 구조를 가지며, 2차원 극한에서도 강자성을 유지하여 스핀트로닉스 및 소형화된 자기 소자 개발에 활용될 수 있는 물질을 찾기 위해 필요합니다. 상온에서 작동하는 것이 중요합니다.", "origin": "2017년 2차원 강자성체 발견 이후 연구가 폭발적으로 증가했으며, FeGeTe 계열은 이 분야의 선두 주자 중 하나입니다.", "connections": "2D materials, spintronics, exfoliation, low-dimensional magnetism, magnetic topological materials."}, {"term": "sublattice-dependent magnetic ordering", "why_emerged": "복잡한 결정 구조를 가진 자성 물질에서 자성 원자들의 위치(서브 격자)에 따라 자기 모멘트의 크기나 방향이 다르게 정렬될 때, 이를 명확히 설명하기 위해 필요한 개념입니다. 물질의 전체적인 자기적 특성을 결정합니다.", "origin": "초록 정보만으로는 특정하기 어려움. 자성 물질 연구에서 보편적으로 나타나는 현상입니다.", "connections": "Ferrimagnetism, antiferromagnetism, complex magnetic structures, magnetic anisotropy."}, {"term": "electron-magnon coupling", "why_emerged": "전자의 운동과 스핀 파동(magnon) 사이의 상호작용을 설명하기 위해 필요합니다. 이는 물질의 자기 저항, 홀 효과, 열전 효과 등 전기적/열적 수송 특성에 큰 영향을 미칠 수 있습니다.", "origin": "초록 정보만으로는 특정하기 어려움. 스핀트로닉스 및 자성 수송 현상 연구에서 중요한 개념입니다.", "connections": "Spintronics, anomalous Hall effect, magnetoresistance, magnetic excitations, strong electron correlation."}, {"term": "angle-resolved photoemission spectroscopy (ARPES)", "why_emerged": "고체 물질의 전자 밴드 구조와 페르미 면을 직접적으로 측정하여 물질의 전기적, 자기적, 광학적 특성을 이해하는 데 핵심적인 실험 기법입니다.", "origin": "1960년대 초반 광전자 분광학의 발전과 함께 시작되었으며, 1970년대 이후 단결정 물질의 밴드 구조를 연구하는 표준 기법으로 자리 잡았습니다.", "connections": "Electronic band structure, Fermi surface, many-body interactions, topological materials, high-temperature superconductivity, CD-ARPES, magneto-ARPES."}], "english_summary": ["This paper investigates the microscopic origin of intriguing magnetic and transport properties in the van der Waals room-temperature ferromagnet Fe5GeTe2.", "The study reports the direct observation of sublattice-dependent magnetic ordering within the material.", "It also reveals strong electron-magnon coupling, which could explain its high Curie temperature and transport features.", "These findings provide crucial microscopic insights into the fundamental magnetism of vdW ferromagnets.", "The results have significant implications for spintronics and the design of novel magnetic devices."]}}, {"title": "Ultrafast Magneto-Optical Fingerprints of Altermagnetism in MnTe", "journal": "PRL_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/nyy3-h8wr", "authors": "Xu Yang, Xingkai Cheng, Zhuo Deng, et al.", "last_authors": "Junwei Liu, Zhao-Hua Cheng", "summary": "Author(s): Xu Yang, Xingkai Cheng, Zhuo Deng, Yu-Han Gao, Qing-Lin Yang, Zheng Chang, Peng-Tao Yang, Hong-Mei Feng, Xiang-Qun Zhang, Wei He, Junwei Liu, and Zhao-Hua Cheng Recently identified altermagnets exhibit a distinctive dual-space nature: they possess spin-split electronic bands akin to ferromagnets in momentum space while maintaining the fully compensated magnetization of antiferromagnets in real space. This inherent duality, originating from the same crystal … [Phys. Rev. Lett. 136, 256702] Published Wed Jun 24, 2026", "tier": "A_MUST_READ", "score": "9", "reason": "Directly addresses altermagnetism in a real material, a key interest for the user.", "tags": ["experiment", "MnTe", "altermagnetism"], "image": "", "briefing": {"background": "최근 '알터자성체'(altermagnet)라는 새로운 자성 물질 분류가 제안되었습니다. 이들은 운동량 공간에서는 강자성체처럼 스핀 분리된 전자 띠 구조를 가지지만, 실제 공간에서는 반강자성체처럼 총 자화가 상쇄되어 0이 되는 독특한 이중적 특성을 보입니다. 이러한 특성은 결정 대칭성에 의해 발생하며, 강자성체와 반강자성체의 장점을 모두 가질 잠재력 때문에 큰 관심을 받고 있습니다.", "motivation": "이 연구의 동기는 이론적으로 제안된 알터자성체의 독특한 운동량 공간 스핀 분리 특성을 실제 물질에서 실험적으로 확인하는 것입니다. 특히 망간 텔루라이드(MnTe)와 같은 특정 물질에서 알터자성적 특성을 발현하는지 초고속 자기-광학 기법을 통해 직접적인 증거를 찾고자 했습니다.", "result": "이 논문은 MnTe에서 알터자성체의 초고속 자기-광학적 특징(fingerprints)을 발견했다고 보고합니다. 이 결과는 MnTe가 알터자성체임을 실험적으로 확인하는 중요한 증거를 제공하며, 알터자성체의 독특한 스핀-운동량 커플링 특성이 실제 물질에서 관측될 수 있음을 보여줍니다. 초록 정보만으로는 구체적인 발견 내용은 제한적이나, 제목과 초록에서 '초고속 자기-광학적 특징'을 통해 이를 증명했음을 시사합니다.", "implication": "만약 이 결과가 맞다면, MnTe는 알터자성 연구를 위한 중요한 모델 물질이 될 것이며, 초고속 자기-광학 기술은 알터자성체의 특성을 조사하는 효과적인 실험 도구가 될 것입니다. 이는 알터자성 재료의 새로운 물성 연구 및 잠재적인 스핀트로닉스 응용 분야 발전에 기여할 수 있습니다.", "novelty": "이 연구는 알터자성체의 '초고속 자기-광학적 특징'을 MnTe라는 실제 물질에서 최초로 실험적으로 관측한 것으로 보입니다. 이는 알터자성이라는 새로운 개념을 실험적으로 뒷받침하며, 사용자에게는 '알터자성'이라는 핵심 관심사를 실제 물질과 실험 기법 ('초고속 자기-광학'은 사용자 관심 기법은 아니지만, ARPES나 magneto-ARPES와 같은 전자 구조 연구와 연관될 수 있음)으로 연결한다는 점에서 매우 중요합니다.", "unresolved": "초록만으로는 구체적인 미해결 과제나 한계를 파악하기 어렵습니다. 추가적인 이론적, 실험적 연구를 통해 MnTe의 알터자성 특성을 더욱 정량적으로 이해하고, 다른 알터자성 후보 물질에도 이 방법을 적용하여 일반성을 검증해야 할 것입니다.", "future_work": "향후 연구에서는 MnTe의 알터자성 특성을 다양한 외부 변수(온도, 압력 등)에서 자세히 조사하고, 이 초고속 자기-광학 기술을 다른 알터자성 후보 물질에 적용하여 알터자성체 패밀리의 특성을 체계적으로 밝힐 수 있을 것입니다. 또한, ARPES나 CD-ARPES 같은 전자 구조 측정과 결합하여 운동량 공간의 스핀 분리 밴드를 직접 관찰하는 후속 연구가 필요할 수 있습니다.", "concepts": [{"term": "Altermagnetism (알터자성)", "why_emerged": "기존의 강자성(ferromagnetism)과 반강자성(antiferromagnetism)으로는 설명할 수 없는 새로운 유형의 자성 질서와 그에 따른 독특한 전자 구조 및 수송 특성을 설명하기 위해 등장했습니다. 특히 스핀트로닉스 분야에서 반강자성체의 장점(제로 자화, 외부 자기장에 둔감)과 강자성체의 장점(스핀 분리 밴드, 스핀 전류 생성)을 결합하려는 요구에서 중요해졌습니다.", "origin": "2020년대 초반 이론적으로 처음 제안되었으며, 체코 과학자들이 초기 개념 정립에 기여한 것으로 알려져 있습니다.", "connections": "강자성, 반강자성, 비자성(non-magnetic)과 함께 자성 분류의 네 번째 유형으로 분류됩니다. 스핀트로닉스, 자기 토폴로지 물질, 자기수송 현상(예: 이상 홀 효과) 연구와 밀접하게 관련되어 있습니다."}, {"term": "Spin-split electronic bands (스핀 분리 전자 띠)", "why_emerged": "자성체 내부에서 전자의 스핀 업(spin-up)과 스핀 다운(spin-down) 상태가 다른 에너지 준위를 가지는 현상을 설명하기 위해 필요합니다. 이는 강자성체에서 전도 전자와 상호작용하는 국소 자화에 의해 발생하며, 스핀 업/다운 전자의 밀도 불균형을 야기하여 스핀 전류 생성에 중요한 역할을 합니다.", "origin": "자성 이론의 발전과 함께 정립된 개념으로, 1930년대 이후 블로흐(Bloch)나 스토너(Stoner)와 같은 연구자들이 강자성체의 전자 구조를 설명하면서 중요하게 다루기 시작했습니다.", "connections": "강자성, 스핀-궤도 결합, 제이만 효과(Zeeman effect), 스핀트로닉스, 이상 홀 효과, 그리고 알터자성체의 핵심 특징 중 하나입니다."}, {"term": "Ultrafast magneto-optics (초고속 자기-광학)", "why_emerged": "물질의 자성 상태 변화를 피코초(picosecond) 또는 펨토초(femtosecond) 스케일의 매우 짧은 시간 내에 탐지하고 제어하려는 요구에서 발전했습니다. 이는 자화 동역학(magnetization dynamics) 연구와 고속 정보 저장 기술 개발에 필수적입니다.", "origin": "1980년대 후반부터 레이저 기술의 발전과 함께 등장하기 시작했으며, 특히 1990년대 이후 자화 반전(magnetization reversal) 연구에서 활발히 사용되었습니다.", "connections": "테라헤르츠(THz) 분광학, 펌프-프로브(pump-probe) 기술, 시간 분해 ARPES, 스핀트로닉스, 자기 기록 매체 연구와 연관됩니다."}, {"term": "Momentum space (운동량 공간)", "why_emerged": "결정 내 전자의 파동적 특성을 설명하고, 주기적인 격자 구조 내에서 전자의 행동을 이해하기 위해 필요합니다. 특히 고체 물리학에서 띠 구조(band structure)를 통해 물질의 전기적, 광학적 특성을 예측하는 데 필수적인 개념입니다.", "origin": "1920년대 양자 역학과 고체 물리학의 발전과 함께 블로흐 정리(Bloch's theorem) 등에 의해 확립되었습니다. 브릴루앙 존(Brillouin zone) 개념이 운동량 공간의 핵심입니다.", "connections": "실제 공간(real space)과 푸리에 변환으로 연결되며, 띠 이론(band theory), 페르미 면(Fermi surface), ARPES, 전하 밀도파(CDW) 등의 개념과 밀접하게 관련되어 있습니다."}], "english_summary": ["This experimental study reports ultrafast magneto-optical fingerprints of altermagnetism in MnTe.", "Altermagnets exhibit unique spin-split electronic bands in momentum space while maintaining compensated magnetization in real space.", "The findings provide direct experimental evidence for altermagnetic properties in a real material.", "This establishes MnTe as a promising candidate for altermagnetic research and validates ultrafast magneto-optics as a characterization tool.", "It contributes to understanding this new class of magnetic materials for future spintronic applications."]}}, {"title": "Nodeless superconducting gap and electron-boson coupling in (La,Pr,Sm) 3 Ni 2 O 7 films", "journal": "Science", "source": "Gemini", "link": "https://doi.org/10.1126/science.adw8329", "authors": "Jianchang Shen, Guangdi Zhou, Yu Miao, et al.", "last_authors": "Junfeng He, Zhuoyu Chen", "summary": "The discovery of superconductivity in Ruddlesden-Popper bilayer nickelate films under ambient pressure provides an opportunity to directly investigate electronic energy scales of the superconducting state and the pairing mechanism. We report angle-resolved photoemission spectroscopy measurements of superconducting (La,Pr,Sm) 3 Ni 2 O 7 thin films by developing an ultrahigh-vacuum cryogenic sample quenching and transfer technique. A superconducting gap of ~18 milli–electron volts with coherence peaks is observed along the Brillouin zone diagonal. The finite gap persists across the entire Brillouin zone, revealing the absence of gap nodes. A kink is observed in the energy-momentum dispersion at ~70 milli–electron volts below the Fermi level, indicating an electron-boson coupling. The simultaneous observation of a nodeless superconducting gap and electron-boson coupling provides insight into the pairing symmetry and gluing mechanism in Ruddlesden-Popper bilayer nickelates.", "tier": "A_MUST_READ", "score": "9", "reason": "ARPES study of nodeless superconducting gap and electron-boson coupling in nickelate films.", "tags": ["ARPES", "superconductivity", "nickelates", "electronicstructure", "quantummaterials", "experiment"], "image": "", "briefing": {"background": "구리 기반 초전도체(cuprates)와 유사한 결정 구조를 가지는 니켈 기반 산화물(nickelates)은 오랫동안 고온 초전도체의 후보 물질로 주목받아 왔습니다. 최근 상압에서 루드레스덴-포퍼(Ruddlesden-Popper) 구조의 이중층 니켈레이트 박막[(La,Pr,Sm)3Ni2O7]에서 초전도성이 발견되면서, 그 페어링 메커니즘과 전자 구조를 직접적으로 탐구할 새로운 기회가 열렸습니다.", "motivation": "이 연구의 동기는 최근 발견된 니켈레이트 초전도체의 초전도 상태에서의 전자 에너지 스케일과 페어링 메커니즘을 직접적으로 조사하는 것입니다. 특히 각도 분해 광전자 분광법(ARPES)을 사용하여 초전도 갭의 대칭성(노드 존재 여부)과 전자-보손 결합의 증거를 찾아 초전도성 발현의 근본적인 이해를 돕고자 했습니다.", "result": "연구팀은 초고진공 극저온 시료 급랭 및 전송 기술을 개발하여 초전도 니켈레이트 박막에 대한 ARPES 측정을 성공적으로 수행했습니다. 그 결과, 다음과 같은 주요 발견을 보고했습니다. 첫째, 브릴루앙 존 대각선을 따라 약 18밀리전자볼트(meV) 크기의 초전도 갭과 코히어런스 피크를 관찰했습니다. 둘째, 이 갭은 브릴루앙 존 전체에 걸쳐 유한하게 존재하며, 이는 갭 노드(gap nodes)가 없음을 의미합니다. 셋째, 페르미 준위 아래 약 70meV 지점에서 에너지-운동량 분산에 킨크(kink)가 관찰되었는데, 이는 전자-보손 결합이 존재함을 시사합니다.", "implication": "노드가 없는 초전도 갭과 전자-보손 결합의 동시 관찰은 루드레스덴-포퍼 이중층 니켈레이트의 페어링 대칭(pairing symmetry)과 페어링 메커니즘(gluing mechanism)에 대한 중요한 단서를 제공합니다. 이는 이들 물질의 초전도성이 기존 고온 초전도체인 큐프레이트와는 다른 특성을 가질 수 있음을 시사하며, 새로운 유형의 초전도체 개발 가능성을 열어줍니다.", "novelty": "이 논문은 루드레스덴-포퍼 이중층 니켈레이트 박막에서 초전도 갭과 전자-보손 결합을 ARPES로 직접 측정한 최초의 연구 중 하나입니다. 특히 '노드가 없는' 갭 구조와 관찰된 '전자-보손 결합'은 이 물질이 기존의 고온 초전도체(d-파형 갭)와 구별되는 독특한 초전도성을 가진다는 점에서 중요합니다. 사용자의 'ARPES'와 '니켈레이트', '초전도성'에 대한 강한 관심을 직접적으로 충족시킵니다.", "unresolved": "전자-보손 결합을 유발하는 특정 보손(예: 포논, 마그논 등)의 정체는 초록에서 명확히 밝히지 않고 있습니다. 또한, 노드가 없는 갭이 s-파형 대칭을 의미하는지 또는 다른 복잡한 대칭을 의미하는지에 대한 추가적인 이론적, 실험적 검증이 필요합니다.", "future_work": "향후 연구에서는 전자-보손 결합에 관여하는 보손의 물리적 기원을 명확히 밝히고, 초전도 갭의 이방성(anisotropy)을 보다 상세히 매핑하여 페어링 대칭을 규명해야 합니다. 또한, 이 ARPES 기술을 다른 니켈레이트 초전도체나 관련 양자 물질에 적용하여 초전도성 발현의 보편적 원리를 탐구할 수 있을 것입니다.", "concepts": [{"term": "ARPES (Angle-Resolved Photoemission Spectroscopy, 각도 분해 광전자 분광법)", "why_emerged": "물질 내 전자의 운동량-에너지 관계, 즉 띠 구조(band structure)와 페르미 면(Fermi surface)을 직접적으로 측정하여 물질의 전기적, 자기적, 광학적 특성을 이해하는 데 필수적인 실험 기법입니다.", "origin": "1960년대 초반에 광전자 분광학 기술이 개발되었고, 1970년대 이후 단색화된 X선 및 자외선 광원, 고분해능 전자 에너지 분석기의 발전과 함께 각도 분해 능력이 향상되면서 고체 전자 구조 연구의 핵심 도구로 자리 잡았습니다.", "connections": "전자 띠 구조, 페르미 면, 초전도 갭, 전하 밀도파(CDW), 베리 곡률(Berry curvature), 위상 물질 연구에 광범위하게 사용됩니다. RIXS, STM/STS와 함께 사용자 관심 분야의 핵심 실험 기법입니다."}, {"term": "Ruddlesden-Popper nickelates (루드레스덴-포퍼 니켈레이트)", "why_emerged": "구리 기반 초전도체(cuprates)와 유사한 결정 구조와 전자적 특성을 가지면서도 3d 전이 금속인 니켈을 포함하여, 구리 기반 초전도체의 페어링 메커니즘을 이해하고 새로운 고온 초전도체를 탐색하기 위한 대안 물질군으로 주목받았습니다.", "origin": "1990년대부터 연구되기 시작했으나, 2019년 스트론튬이 도핑된 NdNiO2에서 초전도성이 발견되면서 큰 주목을 받았고, 최근 이중층 (La,Pr,Sm)3Ni2O7에서 상압 초전도성이 발견되며 연구가 활발해졌습니다.", "connections": "고온 초전도체, 큐프레이트, 스핀 전하 분리, 강상관 전자계, 산화물 계면 초전도체 연구와 관련이 깊습니다."}, {"term": "Superconducting gap (nodeless) (초전도 갭, 노드가 없는)", "why_emerged": "초전도 상태에서 전자가 페어링되어 형성되는 에너지 갭을 설명하기 위해 필요합니다. '노드가 없는'(nodeless) 갭은 갭이 페르미 면의 모든 방향에서 유한한 값을 가지며 0이 되는 지점이 없음을 의미합니다. 이는 초전도체의 페어링 대칭을 분류하는 중요한 기준입니다.", "origin": "초전도 갭 개념은 BCS 이론(1957년)에 의해 확립되었습니다. 갭의 대칭성과 노드 유무는 이후 d-파형 대칭 큐프레이트 초전도체 연구를 통해 중요성이 부각되었습니다.", "connections": "BCS 이론, 페어링 대칭(s-파, d-파 등), 준입자 여기(quasiparticle excitation), 열전도율, 핵자기 공명(NMR) 등 초전도체의 다양한 물성과 관련됩니다."}, {"term": "Electron-boson coupling (전자-보손 결합)", "why_emerged": "전자들 간의 인력을 매개하여 초전도성을 유발하거나, 다른 양자 현상(예: 전하 밀도파)을 설명하기 위해 도입되었습니다. 특히 포논(phonon) 매개 초전도성(BCS 이론)이나 다른 비정상적인 초전도성에서 중요한 역할을 합니다.", "origin": "BCS 이론(Bardeen, Cooper, Schrieffer, 1957)이 포논 매개 전자-전자 인력을 통해 초전도성을 설명하면서 정립되었으며, 이후 마그논(magnon)이나 스핀 플럭츄에이션(spin fluctuation) 등 다양한 보손이 결합에 관여할 수 있음이 제안되었습니다.", "connections": "BCS 이론, 초전도성, 전하 밀도파(CDW), 띠 구조의 '킨크'(kink) 현상, 포논, 마그논, 스핀 플럭츄에이션 등 강상관 전자계와 관련된 다양한 물리적 현상과 연결됩니다."}], "english_summary": ["This ARPES study investigates the superconducting state of (La,Pr,Sm)3Ni2O7 thin films, a recently discovered nickelate superconductor.", "A nodeless superconducting gap of ~18 meV with coherence peaks is observed across the entire Brillouin zone, suggesting an s-wave like pairing symmetry.", "A kink in the energy-momentum dispersion at ~70 meV below the Fermi level indicates the presence of electron-boson coupling.", "These findings provide crucial insights into the pairing symmetry and gluing mechanism in these bilayer nickelates, distinguishing them from other unconventional superconductors.", "The study utilized a novel ultrahigh-vacuum cryogenic sample quenching and transfer technique for high-quality ARPES measurements."]}}, {"title": "Floquet-Engineered Chern Insulator in two-dimensional dx2-y2-Wave Altermagnets (Phys. Rev. B)", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2606.26632", "authors": "Hosein Cheraghchi", "last_authors": "Hosein Cheraghchi", "summary": "arXiv:2606.26632v1 Announce Type: new Abstract: We investigate Floquet-engineered topological phases in two-dimensional $d_{x^2-y^2}$-wave altermagnets irradiated by circularly polarized light in the off-resonant regime. These materials exhibit large momentum-dependent spin-splitting governed by distinctive magnetic symmetries. Using a lattice model combined with Floquet theory, we demonstrate that irradiation induces the light-tunable quantum anomalous Hall phases with the Chern numbers up to $\\pm 3$. The resultant phase diagram is verified by calculating the anomalous Hall conductivity and also the edge modes inside the band gap of a nanoribbon version of the altermagnet. Our findings establish d-wave altermagnets as promising platforms for realizing nonequilibrium topological states of matter. The low-energy continuum limit of the lattice-based Floquet Hamiltonian results in a linear and higher-order-in-momentum spin-orbit couplings, and also a Zeeman-like magnetization, all arising from light-induced virtual photon processes. The resulting higher-order spin-orbit coupling generates the additional gapless Dirac points which, together with the high-symmetry gap-closings, yield enhanced Berry curvature and high Chern numbers. The light irradiation effectively breaks the static $d_{x^2-y^2}$-wave magnetic symmetry mixing in an isotropic photo-induced $s$-wave correction.", "tier": "A_MUST_READ", "score": "9", "reason": "Theory of Floquet engineering topological states in altermagnets, connecting multiple strong user interests.", "tags": ["theory", "Floquetengineering", "altermagnetism", "Cherninsulator", "anomalousHall", "Berrycurvature", "topological"], "image": "https://arxiv.org/html/2606.26632v1/x1.png", "briefing": {"background": "알터자성체는 운동량 공간에서 스핀 분리된 띠 구조를 가지면서도 총 자화가 상쇄되는 새로운 유형의 자성 물질입니다. 한편, 플로케 공학(Floquet engineering)은 주기적인 외부장(예: 원형 편광된 빛)을 사용하여 물질의 양자 상태를 변형하고 새로운 토폴로지 특성을 유도하는 강력한 방법입니다. 이 두 개념을 결합하여 비평형(nonequilibrium) 상태에서 새로운 토폴로지 물질을 구현하려는 시도가 활발합니다.", "motivation": "이 연구의 동기는 d(x^2-y^2)-파형 알터자성체에 원형 편광된 빛을 조사했을 때 플로케 공학을 통해 어떤 새로운 토폴로지 상(phase)이 유도될 수 있는지 이론적으로 탐구하는 것입니다. 특히 알터자성체의 독특한 자기 대칭성을 활용하여 Chern insulator와 같은 양자 이상 홀(quantum anomalous Hall) 상을 구현하고 그 특성을 밝히고자 했습니다.", "result": "이론적 모델과 플로케 이론을 사용하여, 원형 편광된 빛을 조사하면 2차원 d(x^2-y^2)-파형 알터자성체에서 '빛으로 조절 가능한 양자 이상 홀 상'(light-tunable quantum anomalous Hall phases)이 유도됨을 입증했습니다. 이 상은 최대 ±3의 높은 Chern 수(Chern numbers)를 가질 수 있습니다. 연구는 이상 홀 전도도(anomalous Hall conductivity) 계산과 나노리본 가장자리 모드(edge modes)를 통해 이 상다이어그램을 검증했습니다. 또한, 빛 조사는 선형 및 고차 운동량 스핀-궤도 결합(spin-orbit couplings)과 제이만(Zeeman) 유사 자화를 유도하며, 이는 추가적인 갭 없는 디락점(Dirac points)과 향상된 베리 곡률(Berry curvature), 높은 Chern 수로 이어집니다. 빛 조사는 정적인 d(x^2-y^2)-파형 자기 대칭을 효과적으로 깨뜨리고 등방성 s-파형 보정(s-wave correction)을 유도합니다.", "implication": "이 연구 결과는 d-파형 알터자성체가 비평형 토폴로지 물질을 구현하기 위한 유망한 플랫폼임을 입증합니다. 플로케 공학을 통해 알터자성체의 고유한 특성을 활용하여 높은 Chern 수를 갖는 Chern insulator를 구현할 수 있다면, 새로운 기능성 양자 장치 개발이나 고효율 스핀트로닉스 응용 분야에 기여할 수 있습니다.", "novelty": "알터자성체와 플로케 공학을 결합하여 Chern insulator를 이론적으로 제안한 독창적인 연구입니다. 특히 d-파형 알터자성체의 대칭성을 활용하여 빛으로 조절 가능한 양자 이상 홀 상과 높은 Chern 수를 달성했다는 점이 새롭습니다. 사용자의 'Floquet engineering', 'altermagnetism', 'Chern insulator', 'anomalous Hall', 'Berry curvature', 'topological' 등 여러 핵심 관심사를 한 번에 연결하는 매우 흥미로운 이론적 제안입니다.", "unresolved": "이것은 이론적 제안이므로, 실제 d(x^2-y^2)-파형 알터자성체를 찾아 빛 조사를 통해 이러한 토폴로지 상을 실험적으로 구현하는 것이 큰 과제로 남아 있습니다. 이론 모델의 가정을 실제 물질의 복잡성에 적용할 때 발생할 수 있는 문제점들도 고려해야 합니다.", "future_work": "실험적으로 d(x^2-y^2)-파형 알터자성체를 탐색하고, 이 물질에서 원형 편광된 빛을 사용하여 플로케 엔지니어링을 실험적으로 구현하는 후속 연구가 필요합니다. 또한, 다른 유형의 플로케 유도 토폴로지 상을 알터자성체에서 탐구하거나, 이러한 토폴로지 알터자성체의 실제 소자 응용 가능성을 모색할 수 있습니다.", "concepts": [{"term": "Floquet Engineering (플로케 공학)", "why_emerged": "물질의 고유한 특성을 외부에서 인가하는 주기적인 시간 변조장(예: 강한 레이저 빛)을 통해 능동적으로 '재설계'하거나 새로운 양자 상태를 유도하여, 기존에는 불가능했던 새로운 물리적 현상이나 토폴로지 상을 구현하기 위해 등장했습니다.", "origin": "플로케 이론(Floquet theory)은 1883년 프랑스의 가스통 플로케(Gaston Floquet)에 의해 주기 함수 계수를 갖는 선형 미분 방정식 해법으로 처음 제시되었습니다. 고체 물리학에서 2000년대 후반부터 강한 빛으로 물질의 전자 구조를 조절하는 개념으로 활발히 적용되기 시작했습니다.", "connections": "시간 결정(time crystal), 토폴로지 절연체/초전도체, 폰 노이만 물리학, 펌프-프로브(pump-probe) 실험, 비평형 양자 물질 연구와 밀접하게 관련됩니다."}, {"term": "Chern Insulator (Chern 절연체)", "why_emerged": "외부 자기장 없이도 양자 홀 효과(Quantum Hall effect)와 유사하게 정량화된 홀 전도도를 보이는 물질을 설명하기 위해 필요합니다. 이는 물질의 띠 구조가 가지는 고유한 위상적 특성(Chern 수)에 의해 발생하며, 에너지 갭 내부에 자가전도성(chiral) 가장자리 모드를 가집니다.", "origin": "1988년 할데인(F. D. M. Haldane)이 그래핀과 유사한 격자 모델에서 처음 이론적으로 제안했으며, 이후 위상 물질 연구의 중요한 한 축을 형성했습니다. '양자 이상 홀 효과'(Quantum Anomalous Hall effect, QAH)를 보이는 물질군입니다.", "connections": "양자 홀 효과, 위상 절연체/반금속, 베리 곡률, 이상 홀 효과, 스핀-궤도 결합, 강자성/알터자성 물질과 관련이 깊습니다."}, {"term": "d(x^2-y^2)-wave Altermagnets (d(x^2-y^2)-파형 알터자성체)", "why_emerged": "알터자성체는 다양한 결정 대칭과 스핀 배열에 따라 여러 종류가 있을 수 있습니다. d(x^2-y^2)-파형은 특정 궤도 대칭을 가지는 알터자성체로, 운동량 공간에서 스핀 분리 밴드가 d-파형 대칭성을 보이는 경우를 설명하기 위해 필요합니다. 이는 특정 자기 대칭군에 의해 결정됩니다.", "origin": "알터자성 개념이 제안된 이후, 다양한 대칭성을 가진 알터자성체의 유형을 분류하고 각 유형의 전자 구조 및 수송 특성을 예측하는 과정에서 이론적으로 연구되었습니다. 특정 물질군에서 나타날 것으로 예측됩니다.", "connections": "알터자성, 스핀 대칭성, 띠 구조 계산, 고차 다극자(multipole) 질서, 결정장 이론과 관련됩니다."}, {"term": "Anomalous Hall Conductivity (이상 홀 전도도)", "why_emerged": "강자성체나 다른 자성 물질에서 외부 자기장 없이도 발생하는 홀 효과를 설명하기 위해 필요합니다. 이는 물질 내의 스핀-궤도 결합에 의해 발생하는 베리 곡률(Berry curvature)과 밀접하게 관련되어 있으며, 전자의 스핀이 아니라 운동량 공간에서의 위상적 특성에 의해 발생합니다.", "origin": "이상 홀 효과는 1881년 에드윈 홀(Edwin H 도를 가지지만, 외부 자기장 없이 자체적인 자기 질서(강자성)에 의해 발생하는 양자 홀 효과를 설명하기 위해 필요했습니다.", "origin": "D. J. Thouless, M. Kohmoto, M. P. Nightingale, and M. den Nijs (1982)의 TKNN 논문에서 수학적 기반이 제시되었고, 자기적 재료에서의 구현 가능성은 F. D. M. Haldane (1988)이 최초로 제안했습니다.", "connections": "양자 홀 효과, 위상 절연체, 자기 위상 물질, Berry 곡률, Chern 수."}, {"term": "Kagome", "why_emerged": "독특한 격자 구조로 인해 강한 전자 상관관계, 위상학적 특성, 플랫 밴드(flat band) 등 흥미로운 물리 현상을 나타내어 새로운 양자 상태를 탐구하기 위해 중요합니다.", "origin": "일본 전통 바구니 짜기 패턴에서 유래한 기하학적 구조를 의미하며, 물리학에서는 오래전부터 스핀 액체(spin liquid)나 특이한 자기 질서 연구에 사용되어 왔습니다. 최근에는 AV3Sb5 계열의 카고메 금속에서 CDW, 초전도, 위상학적 특성이 발견되며 큰 주목을 받고 있습니다.", "connections": "AV3Sb5 계열, 플랫 밴드, 스핀 액체, 전자 상관관계, 위상학적 물질."}, {"term": "Berry curvature", "why_emerged": "블로흐 전자가 운동량 공간에서 Adiabatic하게 변화할 때 얻는 위상학적 위상(Berry phase)을 설명하고, 비정상 홀 효과(Anomalous Hall Effect)와 같은 현상을 이해하는 데 핵심적인 개념입니다.", "origin": "Michael Berry가 1984년 양자역학의 Adiabatic 과정에서 나타나는 위상을 설명하기 위해 도입했습니다.", "connections": "Berry 위상, Chern 수, 위상 절연체/반금속, 비정상 홀 효과, 스핀 홀 효과."}, {"term": "Topological phase transition", "why_emerged": "물질의 전자 구조가 변화하여 위상학적 특성(예: Chern 수, Z2 불변량)이 바뀌는 현상을 설명하기 위해 필요합니다. 이는 외부 자극(자기장, 압력, 온도 등)에 의해 유도될 수 있습니다.", "origin": "위상 물질의 개념과 함께 발전했으며, 특정 매개변수가 임계점을 지날 때 밴드 반전(band inversion) 등이 일어나 위상학적 특성이 변하는 것을 의미합니다. 초록 정보만으로는 특정하기 어려움.", "connections": "위상 절연체/반금속, 밴드 반전, 양자 상전이, Chern 수, Z2 불변량."}], "english_summary": ["This paper proposes a symmetry framework for reversibly switching topological states in magnetic topological insulators.", "It leverages continuous in-plane spin rotation, governed by magnetic point group constraints on Berry curvature.", "Using a 2D kagome ferromagnetic Chern insulator, simulations show a 60-degree in-plane magnetization rotation reverses the Chern number sign via a trivial state.", "This mechanism operates with small magnetic fields and on ultrafast timescales, offering an efficient, low-energy paradigm for topological state manipulation.", "This is highly relevant for future spintronics and quantum computing applications."]}}, {"title": "Emergent Dynamical Kondo Coherence and Competing Magnetic Order in a Correlated Kagome Flat-Band Metal CsCr6Sb6", "journal": "PRL_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/f8b9-q54m", "authors": "Xiangqi Liu, Xuefeng Zhang, Jiachen Jiao, et al.", "last_authors": "Gang Li, Yanfeng Guo", "summary": "Author(s): Xiangqi Liu, Xuefeng Zhang, Jiachen Jiao, Renjie Zhang, Kaiwen Chen, Ying Wang, Yunguan Ye, Zhenhai Yu, Chengyu Jiang, Xia Wang, Bei Jiang, Yaobo Huang, Lei Shu, Baiqing Lv, Gang Li, and Yanfeng Guo Correlated kagome metals host unique electronic states that enable exotic quantum phenomena. In the recently emerged ${\\mathrm{CsCr}}_{6}{\\mathrm{Sb}}_{6}$, these manifest through Kondo behavior from localized $\\mathrm{Cr}\\text{−}3d$ electrons and unprecedented band flattening near the Fermi level. … [Phys. Rev. Lett. 136, 256601] Published Tue Jun 23, 2026", "tier": "B_IMPORTANT_CONDMAT", "score": "10", "reason": "Direct hit on kagome metals and electronic structure correlations relevant to the user's primary projects.; demoted from A: broad CM, not direct user/project hit", "tags": ["material", "kagome", "Kondo", "electronicstructure"], "image": "", "briefing": {"background": "강한 전자 상관관계를 보이는 카고메 금속은 플랫 밴드(flat band)와 같은 독특한 전자 구조를 가지며, 이는 이국적인 양자 현상과 관련이 있습니다. 이러한 물질에서 국소 자기 모멘트와 전도 전자의 상호작용은 콘도(Kondo) 효과와 같은 흥미로운 현상을 유발할 수 있습니다.", "motivation": "최근 발견된 CsCr6Sb6는 카고메 구조를 가지는 상관관계 금속으로, 국소화된 Cr-3d 전자에 의한 콘도 거동과 페르미 준위 근처의 유례없는 밴드 평탄화(band flattening)를 보입니다. 이 물질에서 이러한 특성들이 어떻게 나타나고, 서로 경쟁하는 자기 질서와 어떻게 상호작용하는지 이해하는 것이 중요합니다.", "result": "초록은 구체적인 결과를 자세히 언급하고 있지 않지만, CsCr6Sb6에서 국소화된 Cr-3d 전자에 의한 콘도 거동과 페르미 준위 근처의 밴드 평탄화가 동시에 나타난다는 점을 밝힌 것으로 보입니다. 제목으로 미루어 짐작컨대, 동역학적 콘도 결맞음(Dynamical Kondo Coherence)과 경쟁하는 자기 질서(Competing Magnetic Order) 사이의 상호작용을 연구하여 그 발현 메커니즘을 규명했을 가능성이 높습니다.", "implication": "CsCr6Sb6에서 콘도 효과와 밴드 평탄화, 그리고 경쟁하는 자기 질서 간의 상호작용이 명확히 밝혀졌다면, 이는 새로운 양자 상태를 탐색하고 상관관계 카고메 금속의 물리적 특성을 이해하는 데 중요 도로 인해 거대하고 광대역의 중적외선 원형 이색성(circular dichroism)이 발생함을 밝혔습니다.", "implication": "이 결과가 옳다면, 입자-정공 대칭성 깨짐은 Weyl 반금속에서 강한 원형 이색성을 유도하는 중요한 메커니즘이며, 이를 통해 Weyl 노드의 특성과 위상학적 전이 현상을 비접촉 방식으로 효율적으로 연구할 수 있습니다. 이는 차세대 광학 소자 및 위상학적 물질 연구에 새로운 방향을 제시할 수 있습니다.", "novelty": "자기적 Weyl 반금속 Mn(Bi1−xSbx)2Te4에서 입자-정공 대칭성 깨짐으로 인한 거대하고 광대역의 중적외선 원형 이색성을 실험적으로 발견했다는 점이 새롭습니다. 사용자의 관심사인 CD-ARPES 및 자기적 Weyl 반금속과 직접적으로 연관되어 있어, 향후 CD-ARPES 실험 설계에 중요한 시사점을 제공할 수 있습니다.", "unresolved": "초록 정보만으로는 구체적인 입자-정공 대칭성 깨짐의 원인(예: 자성, 밴드 구조의 미세 조정)이나, 이 거대 CD 신호가 다른 비 위상학적 효과와 어떻게 구분되는지에 대한 상세한 설명은 알 수 없습니다. 중적외선 영역에서의 CD 측정이 구체적으로 어떤 밴드 구조 정보를 제공하는지에 대한 심층적인 분석도 필요합니다.", "future_work": "관찰된 거대 CD 신호의 기원을 심층적으로 이해하기 위한 이론 계산(예: DFT+광학 시뮬레이션), 다양한 Weyl 반금속 물질에서 유사한 현상 탐색, 그리고 CD-ARPES를 활용하여 Weyl 노드의 스핀-운동량 결합(spin-momentum locking)과 키랄리티(chirality)를 직접 측정하는 연구 등이 뒤따를 수 있습니다.", "concepts": [{"term": "Weyl semimetal", "why_emerged": "디락(Dirac) 반금속의 밴드 겹침이 대칭성 깨짐에 의해 두 개의 Weyl 노드로 분리될 때 나타나는 위상 물질로, 독특한 페르미 아크(Fermi arc) 표면 상태와 키랄(chiral) 특성을 설명하기 위해 필요합니다.", "origin": "Weyl 페르미온은 H. Weyl이 1929년 이론적으로 제안했으며, 고체 물질에서의 Weyl 반금속은 X. Wan 등 (2011)과 H. Weng 등 (2015)에 의해 이론적으로 예측되었고, TaAs에서 최초로 실험적으로 발견되었습니다 (S. Y. Xu 등, 2015).", "connections": "디락 반금속, 위상 절연체, 페르미 아크, 키랄성, 비정상 홀 효과, 자기 저항."}, {"term": "Circular Dichroism (CD)", "why_emerged": "빛의 원형 편광(좌회전/우회전)에 대한 물질의 흡수 또는 반사 차이를 측정하여 물질의 키랄성(chirality)이나 특정 자기 질서(예: 스핀-궤도 결합)에 대한 정보를 얻기 위해 사용됩니다.", "origin": "19세기 중반 Fresnel과 Biot에 의해 처음 관찰되었으며, 현대 분광학에서는 유기 화학 및 생화학 분야에서 분자의 키랄 구조 분석에 널리 사용됩니다. 최근에는 응집 물질 물리학에서 자기적 위상 물질 연구에 활용됩니다. 초록 정보만으로는 특정하기 어려움.", "connections": "CD-ARPES, 키랄성, 자기 위상 물질, 광학 활성, 스핀-궤도 결합."}, {"term": "Particle-hole symmetry breaking", "why_emerged": "전자 시스템에서 전자 밴드(particle band)와 정공 밴드(hole band)의 대칭성이 깨지는 현상을 설명하기 위해 필요합니다. 이는 종종 밴드 구조의 비대칭성, 불순물, 상호작용 또는 자기 질서와 관련이 있으며, 특이한 물리적 응답을 유도할 수 있습니다.", "origin": "다양한 고체 물질 시스템에서 관찰되며, 특히 강한 상관관계 물질이나 자성 시스템에서 중요합니다. 초록 정보만으로는 특정하기 어려움.", "connections": "강한 전자 상관관계, Weyl 반금속, 스카이르미온, 비대칭 밴드 구조."}, {"term": "Magnetic Weyl semimetal", "why_emerged": "자체적인 자성 질서(예: 강자성)를 통해 Weyl 노드를 생성하거나 제어하는 위상 반금속을 설명하기 위해 필요합니다. 이는 시간 반전 대칭이 깨지면서 나타나는 Weyl 노드의 새로운 특성과 응용 가능성을 탐구하는 데 중요합니다.", "origin": "이론적으로 제안되었으며, Co3Sn2S2, Mn(Bi1-xSbx)2Te4 등 실제 물질에서 발견되었습니다. 초록 정보만으로는 특정하기 어려움.", "connections": "Weyl 반금속, 강자성, 시간 반전 대칭 깨짐, 자기 위상 물질, 비정상 홀 효과."}], "english_summary": ["This paper reports on giant and broadband circular dichroism observed in the magnetic Weyl semimetal Mn(Bi1−xSbx)2Te4.", "The phenomenon arises from the breaking of particle-hole symmetry, leading to different Fermi velocities for particle and hole bands.", "The large circular dichroism is found in the mid-infrared range, providing a powerful spectroscopic tool.", "This work offers insights into the unique electronic structure and topological properties of magnetic Weyl semimetals.", "It has direct relevance to CD-ARPES and topological magnetism studies."]}}, {"title": "Large anomalous Hall conductivity and topological Hall effect in the kagome helimagnet MgMn6Ge6", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/9jwn-z1b2", "authors": "Jie Du, Zhonghua Ma, Hang Li, et al.", "last_authors": "Yong-Chang Lau, Wenhong Wang", "summary": "Author(s): Jie Du, Zhonghua Ma, Hang Li, Xiaodong Zhou, Jie Chen, Tao Zhu, Yong-Chang Lau, and Wenhong Wang Magnetic kagome materials have emerged as a new platform for exploring exotic topological transport phenomena. The anomalous Hall effect, a phenomenon prevalently observed in various magnetic kagome materials, is commonly explained using Berry-curvature concepts. Here we report that ${\\mathrm{MgMn}}… [Phys. Rev. B 113, 245146] Published Fri Jun 26, 2026", "tier": "B_IMPORTANT_CONDMAT", "score": "9", "reason": "Direct interest in kagome magnets, anomalous Hall effect, and topological transport phenomena.", "tags": ["material", "kagome", "anomalousHall", "topologicaltransport"], "image": "", "briefing": {"background": "자성 카고메 물질(magnetic kagome materials)은 특이한 전자 구조와 이로 인한 양자 수송 현상(topological transport phenomena)을 연구하는 데 있어 최근 각광받는 물질군입니다. 특히, 격자의 기하학적 얽힘(geometric frustration)과 강한 스핀-궤도 결합(spin-orbit coupling)으로 인해 예상치 못한 자성 및 위상학적 특성이 나타날 수 있습니다.", "motivation": "많은 자성 카고메 물질에서 이상 홀 효과(AHE)가 관찰되며, 이는 주로 베리 곡률(Berry curvature) 개념으로 설명됩니다. 하지만 MgMn6Ge6와 같은 특정 카고메 물질에서는 복잡한 자성 구조(예: 헬리컬 자성)가 존재하여 단순한 AHE 설명으로는 부족하고, 위상학적 홀 효과(THE)와 같은 더 복잡한 현상이 나타날 수 있습니다. 이 연구는 MgMn6Ge6에서 이러한 현상을 탐구하는 것이 목표입니다.", "result": "이 연구는 MgMn6Ge6라는 카고메 헬리자성체(kagome helimagnet)에서 큰 이상 홀 전도도(anomalous Hall conductivity)와 위상학적 홀 효과(topological Hall effect, THE)를 관찰했습니다. 이는 기존 베리 곡률 기반의 AHE 설명만으로는 충분하지 않으며, 복잡한 스핀 구조(헬리컬 자성)가 수송 현상에 중요한 역할을 한다는 것을 시사합니다.", "implication": "MgMn6Ge6에서 관찰된 큰 AHE와 THE는 카고메 물질에서 스핀 구조와 전자 밴드 구조 간의 복잡한 상호작용을 이해하는 데 중요한 통찰력을 제공합니다. 이러한 현상들은 향후 위상학적 양자 컴퓨팅이나 스핀트로닉스 소자 개발에 활용될 가능성이 있습니다.", "novelty": "MgMn6Ge6는 헬리자성(helimagnetism)과 카고메 격자 구조가 결합된 새로운 물질 시스템으로, 여기서 큰 AHE와 THE가 관찰되었다는 점이 새롭습니다. 특히, 베리 곡률뿐만 아니라 스칼라 스핀 카이랄리티(scalar spin chirality)에 의해 유도되는 THE가 자성 카고메 물질에서 명확히 관찰되었다는 점은 위상학적 수송 현상 연구에 새로운 방향을 제시합니다. 이는 독자의 주요 관심사인 카고메 금속, AHE, 위상학적 수송 현상과 직접적으로 관련됩니다.", "unresolved": "초록 정보만으로는 MgMn6Ge6의 정확한 헬리컬 자성 구조나 이 구조가 AHE 및 THE에 어떻게 기여하는지에 대한 상세한 물리적 메커니즘이 완전히 밝혀졌는지 알기 어렵습니다. 또한, THE의 정량적인 기여도를 다른 AHE 기여도와 명확히 분리하는 데 어려움이 있을 수 있습니다.", "future_work": "향후 이 물질의 스핀 구조를 중성자 산란(neutron scattering)이나 STM/STS(독자 관심사) 등을 통해 직접적으로 확인하고, ARPES(독자 관심사)를 통해 전자 밴드 구조와 베리 곡률 분포를 상세히 연구하여 AHE 및 THE의 근원적인 메커니즘을 밝히는 후속 연구가 필요할 것입니다. 또한, 외부 조건(온도, 압력, 자기장) 변화에 따른 AHE/THE 거동 연구도 중요합니다.", "concepts": [{"term": "Kagome materials (카고메 물질)", "why_emerged": "기하학적 얽힘(geometric frustration)과 이로 인한 특이한 전자 상태(플랫 밴드, 디락 콘 등) 및 자성 특성(스핀 액체, 위상학적 자성 등)을 연구하기 위해 필요했습니다.", "origin": "17세기 일본의 대나무 바구니 짜는 방식인 '카고메' 무늬에서 유래한 격자 구조로, 결정 구조에서 삼각형과 육각형이 번갈아 배열된 2차원 격자를 지칭합니다. 특정 물질군으로 연구되기 시작한 것은 응집물질물리학의 발전과 함께입니다.", "connections": "AV3Sb5 계열 물질(독자 관심사), 플랫 밴드 물리학, 양자 스핀 액체, 위상학적 물질."}, {"term": "Anomalous Hall effect (이상 홀 효과, AHE)", "why_emerged": "강자성체 등 자성 물질에서 나타나는 홀 효과가 외부 자기장에 비례하는 일반적인 홀 효과와 다르게 자화에 비례하는 부분이 관찰되어, 그 원인을 설명하기 위해 필요했습니다.", "origin": "1881년 Edwin Hall이 최초로 발견했고, 19세기 말부터 20세기 초에 걸쳐 많은 실험적, 이론적 연구가 이루어졌습니다. 양자론적 설명은 2000년대 초반에 베리 곡률과 관련하여 정립되었습니다.", "connections": "베리 곡률(Berry curvature), 스핀-궤도 결합(spin-orbit coupling), 자기 스커미온(magnetic skyrmion), 위상학적 물질, 양자 홀 효과(Quantum Hall effect)."}, {"term": "Topological Hall effect (위상학적 홀 효과, THE)", "why_emerged": "스핀 구조의 위상학적 특성, 예를 들어 스칼라 스핀 카이랄리티(scalar spin chirality)에 의해 발생하는 전자의 추가적인 실공간 베리 위상(real-space Berry phase)으로 인한 홀 효과를 설명하기 위해 도입되었습니다.", "origin": "2000년대 초반 스핀 카이랄리티와 관련된 이론적 제안이 있었고, 이후 자기 스커미온(magnetic skyrmion) 물질 등에서 실험적으로 관찰되기 시작했습니다.", "connections": "자기 스커미온, 스칼라 스핀 카이랄리티, 베리 위상, 위상학적 스핀 구조, 자성 위상학적 물질."}, {"term": "Helimagnet (헬리자성체)", "why_emerged": "원자 스핀 모멘트가 단순히 평행하거나 반평행하게 정렬되지 않고 나선형(helical)으로 배열되는 자성 구조를 설명하기 위해 필요했습니다.", "origin": "특정 물질군에서 나선형 스핀 구조가 중성자 회절(neutron diffraction) 등을 통해 실험적으로 밝혀지면서 개념이 확립되었습니다.", "connections": "스핀 밀도파(spin density wave, SDW), 자기 얽힘(magnetic frustration), 자성 스커미온(magnetic skyrmion)."}], "english_summary": ["This study reports the observation of a large anomalous Hall conductivity and a topological Hall effect in the kagome helimagnet MgMn6Ge6.", "The findings suggest that complex spin configurations, beyond simple Berry curvature, play a crucial role in its topological transport phenomena.", "This material system provides a new platform to explore the interplay between helimagnetism, kagome lattice, and exotic transport.", "It sheds light on the fundamental mechanisms of topological transport driven by complex spin textures.", "The results are relevant for understanding and potentially utilizing topological properties in spintronics and quantum computing."]}}, {"title": "Block-Type Antiferromagnetism in Single Chain Quasi-One-Dimensional K3Fe2Se4", "journal": "PRL_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/g8zx-gc2t", "authors": "Fei Gao, Nikhil Dhale, Ling-Fang Lin, et al.", "last_authors": "Elbio Dagotto, Bing Lv", "summary": "Author(s): Fei Gao, Nikhil Dhale, Ling-Fang Lin, Keith M. Taddei, Yang Zhang, Clarina Dela Cruz, Elbio Dagotto, and Bing Lv One-dimensional (1D) structures provide a unique platform to study the correlated quantum interactions and phase transitions such as unconventional magnetism and superconducting states. Here, we report that iron chalcogenide ${\\mathrm{K}}_{3}{\\mathrm{Fe}}_{2}{\\mathrm{Se}}_{4}$ exhibits an unusual bl… [Phys. Rev. Lett. 136, 256706] Published Wed Jun 24, 2026", "tier": "B_IMPORTANT_CONDMAT", "score": "9", "reason": "Experimental discovery in quasi-1D iron chalcogenide, directly matching the user's specific interests.; demoted from A: broad CM, not direct user/project hit", "tags": ["experiment", "quasi-1D", "iron-chalcogenide"], "image": "", "briefing": {"background": "준-1차원(quasi-1D) 물질은 전자가 특정 방향으로만 자유롭게 움직일 수 있는 제한된 차원성으로 인해 강한 전자-전자 상호작용(correlated quantum interactions)이 지배적인 특이한 양자 현상들을 나타냅니다. 이는 비전형적인 자성, 초전도성, 스핀-전하 분리(spin-charge separation) 등 일반적인 3차원 물질에서는 보기 어려운 현상들을 연구하기 위한 독특한 플랫폼을 제공합니다. 독자에게는 Luttinger liquid, spin-charge separation 등과 함께 관심 주제입니다.", "motivation": "철 기반 칼코게나이드(iron-chalcogenide)는 고온 초전도체와 유사한 강한 전자 상관관계(strong electron correlations)를 보이는 물질군입니다. 특히 준-1차원 구조에서는 예상치 못한 자성 질서가 나타날 수 있습니다. 이 연구는 K3Fe2Se4라는 새로운 준-1차원 철 칼코게나이드 물질에서 나타나는 비정상적인 자성 상태를 탐구하고 그 특성을 밝히는 것을 목표로 합니다.", "result": "이 연구는 준-1차원 철 칼코게나이드 K3Fe2Se4에서 \"블록형 반강자성(block-type antiferromagnetism)\"이라는 특이한 자성 질서를 발견했습니다. 이 자성 질서는 철(Fe) 스핀들이 이합체(dimers)를 형성하고, 이 이합체들이 사슬을 따라 반강자성적으로 정렬되는 형태를 띠는 것으로 밝혀졌습니다.", "implication": "블록형 반강자성이라는 새로운 자성 질서의 발견은 준-1차원 물질에서 스핀 상호작용이 어떻게 발현될 수 있는지에 대한 우리의 이해를 확장시킵니다. 이는 강한 전자 상관관계 시스템에서 새로운 유형의 자성 질서와 양자 상전이(quantum phase transitions)를 탐색하는 데 중요한 단서가 될 수 있습니다.", "novelty": "K3Fe2Se4에서 발견된 \"블록형 반강자성\"은 기존에 잘 알려진 반강자성 질서와는 다른 새로운 형태의 자성 질서로, 준-1차원 철 칼코게나이드라는 독자의 관심 물질군에서 나타났다는 점에서 주목할 만합니다. 이는 준-1차원 물질의 비전형적인 자성에 대한 연구에 새로운 방향을 제시합니다. 독자의 관심사인 준-1차원 물질, 철 칼코게나이드와 직접적으로 연결됩니다.", "unresolved": "초록 정보만으로는 블록형 반강자성 질서가 형성되는 미시적인 원리(예: 특정 스핀 교환 상호작용의 역할)나 이 자성 질서가 다른 전자적 특성(예: 수송 특성)에 미치는 영향에 대한 상세한 설명은 알기 어렵습니다. 또한, 더 낮은 온도나 다른 조건에서 추가적인 상전이가 있을 가능성도 남아있습니다.", "future_work": "향후 ARPES(독자 관심사), STM/STS(독자 관심사) 등 다양한 실험 기법을 통해 K3Fe2Se4의 전자 밴드 구조와 스핀 질서 간의 상호작용을 심층적으로 연구할 필요가 있습니다. 또한, 이론적인 계산을 통해 블록형 반강자성 질서의 안정성을 예측하고 다른 준-1차원 철 칼코게나이드 물질에서도 유사한 현상이 나타나는지 탐색할 수 있습니다.", "concepts": [{"term": "Quasi-one-dimensional materials (준-1차원 물질)", "why_emerged": "특정 방향으로 전자의 자유로운 움직임이 강하게 제한되어 3차원 물질과는 다른 독특한 양자 현상(Luttinger liquid, 스핀-전하 분리 등)을 연구하기 위해 필요했습니다.", "origin": "1970년대 이후 전도성 유기 고분자, 칼코게나이드 사슬 물질 등에서 발견되며 연구가 활성화되었습니다.", "connections": "Luttinger liquid, 스핀-전하 분리, NbSe3, Peierls instability."}, {"term": "Iron chalcogenides (철 칼코게나이드)", "why_emerged": "철 기반 고온 초전도체와 유사하게 강한 전자 상관관계와 다양한 자성, 초전도 특성을 보이는 물질군으로, 새로운 양자 현상을 탐구하기 위해 중요성이 부각되었습니다.", "origin": "철 기반 초전도체가 발견되면서 관련 물질군에 대한 연구가 활발해졌습니다.", "connections": "철 기반 초전도체, 강한 전자 상관관계, 자성."}, {"term": "Antiferromagnetism (반강자성)", "why_emerged": "물질 내 인접한 원자 스핀 모멘트들이 서로 반대 방향으로 정렬되어 전체적으로는 순 자화가 0이 되는 자성 상태를 설명하기 위해 도입되었습니다.", "origin": "20세기 초, 자기장 하에서 자화율이 특정 온도 이상에서 증가하는 현상(네엘 온도)을 설명하기 위해 Louis Néel이 제안했습니다.", "connections": "Néel 온도, 스핀 격자, 강자성, 페리자성, 스핀파."}, {"term": "Dimer (이합체)", "why_emerged": "두 개의 원자나 분자가 결합하여 하나의 단위체를 형성하는 구조를 설명하기 위해 필요했습니다. 특히 스핀 시스템에서는 두 개의 스핀이 강하게 상호작용하여 단일 스핀 단위처럼 행동하는 경우를 지칭합니다.", "origin": "화학 및 물리학에서 널리 사용되는 개념입니다. (초록 정보만으로는 특정하기 어려움)", "connections": "스핀 이합체, 분자 결합, 쿠퍼 쌍(초전도에서)."}], "english_summary": ["This paper reports the discovery of an unusual \"block-type antiferromagnetism\" in the quasi-one-dimensional iron chalcogenide K3Fe2Se4.", "In this novel magnetic order, Fe spins form dimers, and these dimers then align antiferromagnetically along the chains.", "This finding expands our understanding of exotic magnetism in strongly correlated, low-dimensional systems.", "It offers a new platform for exploring quantum phase transitions and spin interactions in quasi-1D materials.", "The research contributes to the field of unconventional magnetism and iron-based compounds, relevant to the user's interests in quasi-1D materials and correlated systems."]}}, {"title": "Observation of Altermagnetic Order Switching in Bulk MnTe by Polarized Neutron Diffraction", "journal": "PRL_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/yklc-9n6t", "authors": "Zheyuan Liu, Shinichiro Asai, Shingo Takahashi, Hiraku Saito, Taro Nakajima, Takatsugu Masuda", "last_authors": "Taro Nakajima, Takatsugu Masuda", "summary": "Author(s): Zheyuan Liu, Shinichiro Asai, Shingo Takahashi, Hiraku Saito, Taro Nakajima, and Takatsugu Masuda Altermagnetic order, characterized by the Néel vector, breaks time-reversal symmetry (TRS) even in the nonrelativistic limit. Although spin-polarized and anomalous transport phenomena emerge with this order, they are mutually compensated by TRS-connected antiphase domains with opposite Néel vectors.… [Phys. Rev. Lett. 136, 256704] Published Tue Jun 23, 2026", "tier": "B_IMPORTANT_CONDMAT", "score": "9", "reason": "Experimental study of altermagnetism, a core interest; uses polarized neutron diffraction to probe order.", "tags": ["material", "altermagnetism", "neutrondiffraction"], "image": "", "briefing": {"background": "최근 \"알터자성(altermagnetism)\"은 자성 질서를 설명하는 새로운 패러다임으로 부상하고 있습니다. 이는 강자성(ferromagnetism)과 반강자성(antiferromagnetism)의 중간 형태로, 시공간 역전 대칭(time-reversal symmetry, TRS)을 깨지만, 전체 자화는 0이라는 점에서 반강자성과 유사합니다. 그러나 특정 결정 구조에서 스핀 분극화된 전자 밴드가 나타나 강자성과 유사한 전자적 특성을 보일 수 있어 새로운 스핀트로닉스 소자 개발에 잠재력이 있습니다. 독자의 핵심 관심사입니다.", "motivation": "알터자성은 이론적으로 스핀 분극화된(spin-polarized) 밴드 구조와 이상 수송 현상(anomalous transport phenomena)을 나타내지만, 일반적으로 시공간 역전 대칭으로 연결된 역위상 도메인(antiphase domains)들이 존재하여 거시적으로 이러한 효과들이 상쇄되는 문제가 있습니다. 따라서 알터자성 질서를 거시적으로 제어할 수 있는 방법을 찾는 것이 중요한 과제였습니다.", "result": "이 연구는 벌크 MnTe 물질에서 편광 중성자 회절(polarized neutron diffraction) 기법을 사용하여 알터자성 질서를 거시적으로 제어할 수 있음을 실험적으로 입증했습니다. 이는 네엘 벡터(Néel vector)로 특징지어지는 알터자성 질서의 스위칭(switching)을 성공적으로 관찰했다는 것을 의미합니다.", "implication": "알터자성 질서의 거시적 제어 가능성은 알터자성체의 잠재력을 실질적인 스핀트로닉스 소자에 활용할 수 있는 중요한 단계를 마련합니다. 이제 알터자성 물질에서 스핀 분극화된 수송 현상을 이용한 새로운 메모리 소자나 논리 소자 개발 가능성을 높였습니다.", "novelty": "알터자성 질서가 특정 물질에서 존재한다는 이론적, 실험적 증거는 있었지만, 이 연구는 편광 중성자 회절을 통해 벌크 MnTe에서 알터자성 질서 자체를 거시적으로 \"스위칭(switching)\"할 수 있음을 직접적으로 보여주었다는 점에서 매우 중요하고 새롭습니다. 이는 독자의 핵심 관심사인 알터자성을 실험적으로 제어할 수 있음을 입증한 첫 걸음이며, 독자 관심사인 중성자 산란(neutron scattering) 기법을 사용했다는 점도 관련성이 높습니다.", "unresolved": "초록 정보만으로는 알터자성 질서 스위칭에 사용된 구체적인 외부 제어 방법(예: 자기장, 전기장, 응력 등)과 그 메커니즘이 상세히 설명되어 있지 않습니다. 또한, 스위칭 효율이나 반복 가능성 등 실제 소자 응용을 위한 추가적인 특성 평가가 필요합니다.", "future_work": "향후 이 스위칭 메커니즘을 상세히 이해하기 위한 이론적 연구와 더불어, ARPES(독자 관심사)나 STM/STS(독자 관심사) 등을 활용하여 스위칭 전후의 전자 밴드 구조 변화와 스핀 분극화를 직접 측정하는 실험이 이루어져야 합니다. 또한, MnTe 외 다른 알터자성 물질에서도 유사한 제어가 가능한지 탐색하고, 스핀트로닉스 소자 응용 가능성을 평가하는 연구가 진행될 것입니다.", "concepts": [{"term": "Altermagnetism (알터자성)", "why_emerged": "강자성체와 반강자성체의 한계를 넘어, 전체 자화는 없지만 스핀 분극화된 밴드 구조를 통해 스핀트로닉스에 활용될 수 있는 새로운 자성 질서를 설명하기 위해 제안되었습니다. 기존 자성 분류로 설명할 수 없는 물질의 특성을 설명하기 위해 필요했습니다.", "origin": "2020년대 초에 이론적으로 제안되었고, 최근 실험적 증거들이 나타나고 있는 비교적 새로운 개념입니다.", "connections": "강자성, 반강자성, 스핀트로닉스, 시간 역전 대칭(TRS) 파괴, 스핀-궤도 결합, 전자의 스핀 분극화."}, {"term": "Néel vector (네엘 벡터)", "why_emerged": "반강자성체에서 인접한 두 아격자(sublattice)의 스핀 모멘트 방향을 나타내어, 거시적인 자화는 없지만 미시적인 스핀 질서를 설명하기 위해 필요했습니다.", "origin": "1930년대 Louis Néel이 반강자성을 설명하며 도입한 개념입니다.", "connections": "반강자성, 스핀 질서, 자기 구조."}, {"term": "Time-reversal symmetry (시간 역전 대칭, TRS)", "why_emerged": "물리 법칙이 시간의 흐름을 반대로 했을 때에도 동일하게 유지되는 대칭성을 설명하기 위해 필요합니다. 물질의 자성 유무와 깊은 관련이 있습니다.", "origin": "양자역학의 기본 대칭성 중 하나로, Wigner 등에 의해 정립되었습니다.", "connections": "대칭성, 자성(강자성은 TRS를 깬다), 위상학적 물질, Weyl/Dirac semimetals."}, {"term": "Polarized neutron diffraction (편광 중성자 회절)", "why_emerged": "물질의 결정 구조뿐만 아니라 미시적인 자기 구조, 특히 스핀 배열을 비파괴적으로 정밀하게 분석하기 위해 필요했습니다. 중성자는 자기 모멘트를 가지고 있어 시료의 자기 모멘트와 상호작용합니다.", "origin": "1950년대 이후 중성자 산란 실험 기술이 발전하면서 자기 구조 연구에 핵심적인 도구로 자리 잡았습니다.", "connections": "중성자 산란, 자기 구조, 스핀 배열, 결정 구조, 자기상전이."}], "english_summary": ["This study experimentally demonstrates the macroscopic control of altermagnetic order in bulk MnTe using polarized neutron diffraction.", "Altermagnetism, a new magnetic class breaking time-reversal symmetry with zero net magnetization, is a core interest for novel spintronic devices.", "The ability to switch the Néel vector of altermagnetic order addresses a key challenge in utilizing its spin-polarized transport properties.", "This finding represents a crucial step towards practical applications of altermagnets in spintronics.", "It leverages a technique (neutron diffraction) and addresses a topic (altermagnetism) directly relevant to the reader's strong interests."]}}, {"title": "Field-free Josephson diode and tunable ϕ0-junction in chiral kagome antiferromagnets", "journal": "npj_QuantumMaterials", "source": "Gemini", "link": "https://www.nature.com/articles/s41535-026-00907-2", "authors": "Jin-Xing Hou, Chuang Li, Lun-Hui Hu, Song-Bo Zhang", "last_authors": "Lun-Hui Hu, Song-Bo Zhang", "summary": "npj Quantum Materials, Published online: 17 June 2026; doi:10.1038/s41535-026-00907-2 Field-free Josephson diode and tunable ϕ 0 -junction in chiral kagome antiferromagnets", "tier": "B_IMPORTANT_CONDMAT", "score": "9", "reason": "Direct relevance to kagome magnetism and potential topological physics.; demoted from A: broad CM, not direct user/project hit", "tags": ["kagome", "antiferromagnetism", "Josephson"], "image": "https://pubads.g.doubleclick.net/gampad/ad?iu=/285/npjquantmats.nature.com/article&sz=728x90&c=-1985367744&t=pos%3Dtop%26type%3Darticle%26artid%3Ds41535-026-00907-2%26doi%3D10.1038/s41535-026-00907-2%26subjmeta%3D301,639,766%26kwrd%3DMaterials+science,Physics", "briefing": {"background": "조셉슨 접합(Josephson Junction)은 초전도체 사이의 위상차를 이용해 전류를 제어하는 양자 소자의 핵심 요소입니다. 최근에는 특정 방향으로 전류가 더 잘 흐르는 조셉슨 다이오드 효과(JDE)와 위상 편이($\\phi_0$)가 발생하는 접합에 대한 연구가 활발하며, 이는 비휘발성 메모리나 양자 컴퓨팅 소자 구현에 중요합니다.", "motivation": "일반적으로 조셉슨 다이오드 효과를 구현하려면 외부 자기장을 인가하거나 복잡한 적층 구조가 필요합니다. 본 연구는 카고메 격자 구조를 가진 반강자성체(Kagome Antiferromagnet)가 가진 고유의 카이랄성과 자기 구조를 이용해 외부 자기장 없이도(field-free) 이러한 현상을 구현할 수 있는지 탐구합니다.", "result": "카이랄 카고메 반강자성체를 이용한 조셉슨 접합에서 외부 자기장 없이 작동하는 조셉슨 다이오드 효과와 조절 가능한 $\\phi_0$-접합이 나타남을 보였습니다. 이는 격자의 대칭성과 자기적 정렬이 결합하여 시간 반전 대칭성을 깨뜨림으로써 가능해집니다.", "implication": "자기장 장치 없이도 작동하는 초전도 다이오드 소자를 구현할 수 있는 재료적 플랫폼을 제시했습니다. 이는 소자 소형화와 저전력 구동에 유리하며, 카고메 금속 기반의 초전도 양자 회로 설계에 기여할 수 있습니다.", "novelty": "사용자의 주요 관심사인 카고메 격자($AV_3Sb_5$ 등)의 물성을 초전도 소자 물리와 직접 연결했습니다. 특히 'Field-free' 조건에서의 JDE는 실제 응용 측면에서 매우 강력한 차별점입니다.", "unresolved": "이론적 모델링 중심의 결과로 보이며, 실제 실험에서 카고메 반강자성체의 도메인 제어나 접합 계면에서의 스핀 산란 효과가 다이오드 효율에 미치는 영향은 추가 확인이 필요합니다.", "future_work": "실제 카고메 자성체 후보 물질을 이용한 조셉슨 접합 제작 및 수송 특성 측정이 필요하며, 카이랄성에 따른 위상 편이의 정밀한 튜닝 메커니즘을 실험적으로 검증해야 합니다.", "concepts": [{"term": "Josephson diode effect (JDE)", "why_emerged": "비가역적 초전도 전류 수송을 통해 차세대 초전도 전자 소자를 구현하기 위해 등장했습니다.", "origin": "초록 정보만으로는 특정하기 어려우나, 최근 2~3년 내 초전도 스핀트로닉스 분야에서 급부상했습니다.", "connections": "비가역적 수송 현상, 비중심대칭 초전도체, 카이랄 자성체와 연결됩니다."}, {"term": "$\\phi_0$-junction", "why_emerged": "위상차가 0이 아닌 상태에서도 초전도 전류가 흐르는 현상을 설명하고 제어하기 위해 제안되었습니다.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "변칙적 조셉슨 효과(Anomalous Josephson Effect), 스핀-궤도 결합, 자기 모멘트와 관련이 있습니다."}, {"term": "Chiral kagome antiferromagnets", "why_emerged": "카고메 격자 특유의 기하학적 좌절(frustration)과 카이랄 자기 정렬이 결합할 때 나타나는 위상적 물성을 연구하기 위해 도입되었습니다.", "origin": "초록 정보만으로는 특정하기 어려우나 Mn3Sn 등에서 활발히 연구됨", "connections": "변칙 홀 효과(AHE), 위상적 홀 효과, Weyl 반금속 특성과 연결됩니다."}], "english_summary": ["Demonstrates field-free Josephson diode effect and tunable $\\phi_0$-junctions in chiral kagome antiferromagnets.", "Exploits the intrinsic symmetry breaking and magnetic order of the kagome lattice to achieve non-reciprocal transport.", "Provides a theoretical framework for integrating kagome materials into superconducting quantum electronics.", "Highlights the potential of using kagome magnetism for magnetic-field-free quantum device control."]}}, {"title": "Floquet topological state induced by light-driven band inversion in SnTe", "journal": "Nature_Physics", "source": "Gemini", "link": "https://www.nature.com/articles/s41567-026-03341-0", "authors": "F. Chassot, A. Pulkkinen, G. Kremer, et al.", "last_authors": "J. H. Dil, C. Monney", "summary": "Nature Physics, Published online: 25 June 2026; doi:10.1038/s41567-026-03341-0 Floquet engineering could, in principle, induce a topological phase in semiconductors, but clear evidence has been lacking. Now it is shown in SnTe that femtosecond light pulses briefly create a topological state that is absent at equilibrium.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Direct experimental evidence of light-induced band inversion and topological phases in a real material.", "tags": ["experiment", "SnTe", "Floquetengineering"], "image": "https://media.springernature.com/m685/springer-static/image/art%3A10.1038%2Fs41567-026-03341-0/MediaObjects/41567_2026_3341_Fig1_HTML.png", "briefing": {"background": "플로케 엔지니어링(Floquet Engineering)은 주기적인 빛 조사를 통해 물질의 전자 구조를 동적으로 변조하는 기술입니다. 이를 통해 평형 상태에서는 존재하지 않는 위상 상태를 인공적으로 유도하려는 시도가 지속되어 왔습니다.", "motivation": "이론적으로는 반도체에서 위상 절연체 상태를 유도할 수 있음이 알려져 있었으나, 실제 물질에서 빛에 의한 '밴드 반전(Band Inversion)'과 그에 따른 위상 상태 형성을 명확히 관찰한 실험 증거는 부족했습니다.", "result": "SnTe(주석 텔루라이드)에 펨토초 레이저 펄스를 가하여 평형 상태에서는 존재하지 않는 '밴드 반전'을 유도하고, 결과적으로 플로케 위상 상태(Floquet topological state)가 형성됨을 실험적으로 확인했습니다.", "implication": "빛을 이용해 물질의 위상학적 성질을 초고속으로 켜고 끌 수 있음을 입증했습니다. 이는 초고속 위상 스위치나 광제어 양자 소자 개발의 토대가 됩니다.", "novelty": "사용자의 관심 물질인 SnTe(위상 결정 절연체 후보)를 대상으로, 플로케 엔지니어링의 핵심인 '밴드 반전'을 실제 재료에서 구현했다는 점에서 높은 가치를 가집니다.", "unresolved": "유도된 위상 상태의 지속 시간이 매우 짧기 때문에(펨토초 단위), 이를 실제 소자 응용에 활용하기 위한 결맞음 유지 시간 연장 및 제어 기술이 숙제로 남습니다.", "future_work": "시간 분해 ARPES(tr-ARPES) 등을 통한 밴드 구조의 정밀한 매핑과 다른 위상 물질(Weyl/Dirac 반금속 등)로의 확장 연구가 예상됩니다.", "concepts": [{"term": "Floquet engineering", "why_emerged": "평형 상태의 물리적 한계를 넘어 외부 구동(driving)을 통해 물질의 물성을 능동적으로 제어하기 위해 등장했습니다.", "origin": "Shirley (1965) 등의 수학적 이론에서 출발하여 최근 고체 물리 실험으로 확장됨", "connections": "시간 분해 분광학, 주기적 섭동 이론, 비평형 통계 역학과 연결됩니다."}, {"term": "Band inversion", "why_emerged": "물질이 위상적으로 자명한 상태에서 자명하지 않은 상태로 전이되는 핵심 기전으로 정의되었습니다.", "origin": "Bernevig, Hughes, and Zhang (2006) - BHZ 모델", "connections": "위상 절연체, 스핀-궤도 결합, 밴드 갭 전이와 연결됩니다."}, {"term": "SnTe (Tin Telluride)", "why_emerged": "대표적인 위상 결정 절연체(Topological Crystalline Insulator)로서 대칭성에 의해 보호되는 표면 상태를 연구하기 위해 중요해졌습니다.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "IV-VI 반도체, 결정 대칭성 보호 위상 상태, 열전 소자와 연결됩니다."}], "english_summary": ["Experimentally demonstrates a light-driven Floquet topological state in the semiconductor SnTe.", "Identifies band inversion induced by femtosecond pulses as the key mechanism for the phase transition.", "Provides clear evidence for dynamic control of topological properties in a real material platform.", "Opens pathways for ultrafast opto-topological switching and non-equilibrium quantum phase engineering."]}}, {"title": "Controlled pairing symmetries in a Fermi-Hubbard ladder with band flattening", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/npvx-jbc8", "authors": "João P. Mendonça, S. Biswas, M. Dziurawiec, et al.", "last_authors": "M. M. Maśka, T. Grass", "summary": "Author(s): João P. Mendonça, S. Biswas, M. Dziurawiec, U. Bhattacharya, K. Jachymski, M. Aidelsburger, M. Lewenstein, M. M. Maśka, and T. Grass The competition between interactions in systems with slow electrons can drive unusual collective behavior. Here, the authors study a microscopic ladder model featuring both diagonal hopping pathways and complex loop-like electron exchange interactions. They demonstrate that while both mechanisms independently suppress ordinary metallic behavior, they stabilize completely distinct spatial patterns of electron pairing. These findings offer a theoretical framework for engineering specific superconducting states by tuning the competition between pairing mechanisms in platforms like twisted bilayer graphene or cold atoms. [Phys. Rev. B 113, L241119] Published Wed Jun 24, 2026", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Relevant to moire/twisted systems and strongly correlated superconductivity.", "tags": ["superconductivity", "Hubbard", "twistedsystems"], "image": "", "briefing": {"background": "평평한 에너지 밴드(Flat band)를 가진 시스템에서는 전자 간의 쿨롱 상호작용이 지배적이 되어 평범한 금속 상태가 억제되고, 비정상적인 초전도나 자기적 질서가 나타나기 쉽습니다. 이는 뒤틀린 이중층 그래핀(Twisted Bilayer Graphene) 연구의 핵심이기도 합니다.", "motivation": "허바드 사다리(Hubbard ladder) 모델에서 대각선 호핑(hopping)과 복잡한 루프 형태의 전자 교환 상호작용이 경쟁할 때, 전자의 페어링 대칭성(Pairing symmetry)이 어떻게 결정되는지 미시적으로 규명하고자 했습니다.", "result": "대각선 호핑과 루프 교환 상호작용이 각각 독립적으로 금속성을 억제하지만, 서로 완전히 다른 공간적 전자 페어링 패턴(대칭성)을 안정화시킨다는 것을 발견했습니다. 즉, 상호작용의 경쟁을 조절하여 원하는 초전도 상태를 선택할 수 있음을 보였습니다.", "implication": "뒤틀린 시스템이나 차가운 원자(cold atoms) 격자에서 특정 초전도 상태를 엔지니어링하기 위한 이론적 가이드를 제공합니다.", "novelty": "밴드 평탄화(band flattening)와 루프 교환(loop exchange) 상호작용을 연결했다는 점이 독특합니다. 특히 사용자가 관심을 갖는 '루프 전류(loop current)'나 '뒤틀린 시스템'의 물리와 밀접한 관련이 있습니다.", "unresolved": "이론적 사다리 모델의 결과가 실제 2D moire 시스템의 복잡한 물리(변형, 다중 밴드 효과 등)에 얼마나 직접적으로 투영될 수 있을지에 대한 검증이 필요합니다.", "future_work": "이러한 경쟁 상호작용을 구현할 수 있는 구체적인 물질 후보군 탐색 및 차가운 원자 시스템에서의 시뮬레이션 실험이 기대됩니다.", "concepts": [{"term": "Fermi-Hubbard ladder", "why_emerged": "강상관 전자계의 물성을 단순화하면서도 1D와 2D의 중간적 특성을 연구하기 위해 도입되었습니다.", "origin": "1990년대 구프라트(cuprates) 연구 과정에서 널리 사용됨", "connections": "고온 초전도체, 스핀 액체, 밀도파(Density waves)와 연결됩니다."}, {"term": "Band flattening", "why_emerged": "전자의 운동 에너지를 억제하여 상대적으로 상호작용 에너지를 극대화함으로써 강상관 현상을 유도하기 위해 필요합니다.", "origin": "최근 moire 시스템(예: Magic-angle twisted bilayer graphene)에서 급부상", "connections": "비상관 전이(Mott transition), 초전도성, moire 초격자와 연결됩니다."}, {"term": "Loop-like exchange", "why_emerged": "단순한 인접 상호작용을 넘어 다체 상호작용이 물리적 대칭성 파괴에 미치는 영향을 설명하기 위해 제안되었습니다.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "루프 전류 상태, 비공진 X선 산란, 복잡한 자기 질서와 연결됩니다."}], "english_summary": ["Studies controlled pairing symmetries in a Fermi-Hubbard ladder with band flattening effects.", "Identifies distinct pairing patterns stabilized by the competition between diagonal hopping and loop-like exchange.", "Suggests a theoretical framework for engineering specific superconducting states in moiré lattices and cold atom platforms.", "Highlights how tuning specific interaction pathways can drive unusual collective electronic behaviors."]}}, {"title": "Decisive role of an extra Fe sublattice: Frustration, criticality, and skyrmions in the van der Waals ferromagnets Fe5GeTe2 versus Fe3GeTe2", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/v9rm-l6vb", "authors": "Jyoti Saini, Ankita Tiwari, Pawan Kumar Srivastava, Changgu Lee, Subhasis Ghosh", "last_authors": "Changgu Lee, Subhasis Ghosh", "summary": "Author(s): Jyoti Saini, Ankita Tiwari, Pawan Kumar Srivastava, Changgu Lee, and Subhasis Ghosh The van der Waals magnets ${\\mathrm{Fe}}_{3}{\\mathrm{GeTe}}_{2}$ and ${\\mathrm{Fe}}_{5}{\\mathrm{GeTe}}_{2}$, chemically similar yet magnetically distinct, provide an ideal platform for probing how structural complexity governs emergent magnetic order, anisotropy, and topological textures. ${\\mat… [Phys. Rev. B 113, 214451] Published Tue Jun 23, 2026", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Highly relevant van der Waals magnet with topical magnetic textures.", "tags": ["vanderWaals", "magnetism", "topological"], "image": "", "briefing": {"background": "반데르발스(vdW) 자성체는 층간 구조 변화를 통해 자기적 이방성과 위상학적 특성을 제어할 수 있는 플랫폼으로 주목받고 있습니다.", "motivation": "Fe3GeTe2와 Fe5GeTe2는 화학적으로 유사하지만 자기적 거동이 크게 다릅니다. 추가된 Fe 부격자가 이러한 자기적 차이와 스카이르미온 같은 위상학적 텍스처 형성에 미치는 영향을 규명하고자 합니다.", "result": "Fe5GeTe2에서 추가된 Fe 원자층이 자기적 좌절(frustration)을 유도하고, 이것이 임계 거동 및 스카이르미온과 같은 위상학적 텍스처의 기원이 됨을 제안합니다.", "implication": "vdW 자성체에서 원자 단위의 적층 구조를 설계함으로써 스카이르미온 등 위상학적 자기 상태를 엔지니어링할 수 있는 가능성을 제시합니다.", "novelty": "구조적 복잡성이 어떻게 거 gedin, Sophia F. R. TenHuisen, et al.", "last_authors": "Berit H. Goodge, Julia A. Mundy", "summary": "The discovery of superconductivity in square-planar nickelates has offered a rich materials platform to explore the origins of high-temperature superconductivity. However, experimental investigations have largely been limited to the infinite-layer R NiO 2 ( R , rare earth) nickelates. We constructed a phase diagram of multilayer square-planar Nd n +1 Ni n O 2 n +2 compounds and found signatures of superconductivity for dimensionality n = 4 to 8. Upon decreasing n , the superconducting anisotropy evolves owing to 4 f electron effects, and electronic structure characteristics approach cuprate-like behavior. Magnetic fluctuations persist from within the superconducting regime and into the overdoped, nonsuperconducting regime. The superconducting regime overlaps with that of chemically doped infinite-layer nickelates, demonstrating underlying commonalities as well as differences across varying structural realizations of square-planar nickelates. Our work establishes this layered template for creating new nickel-based superconductors.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Experimental study of unconventional superconductivity in nickelates, connecting to cuprates.", "tags": ["superconductivity", "nickelates", "quantummaterials", "experiment"], "image": "", "briefing": {"background": "니켈산염은 구리산염(cuprate)과 유사한 구조적·전자적 특성을 가지고 있어 고온 초전도 기작을 연구하는 차세대 물질로 주목받고 있습니다.", "motivation": "단층 무한층(infinite-layer) 니켈산염을 넘어 다층(multilayer) 화합물에서 초전도성 발현 조건과 구리산염과의 유사성을 규명하고자 합니다.", "result": "Nd(n+1)Ni(n)O(2n+2) 화합물에서 n=4~8 범위의 초전도성을 발견했으며, 층수가 줄어들수록 전자 구조가 구리산염과 유사해짐을 확인했습니다.", "implication": "다층 니켈산염이 구리산염과 유사한 고온 초전도 연구의 새로운 플랫폼임을 입증했습니다.", "novelty": "초전도성 유지가 가능한 니켈산염 구조의 폭을 넓혔으며, 자기적 변동성이 초전도 영역과 어떻게 겹치는지 보여주어 상관관계 연구의 범위를 확장했습니다.", "unresolved": "구리산염과 대등한 수준의 Tc(임계온도) 달성 여부 및 정확한 초전도 기작.", "future_work": "도핑 제어를 통한 상도표의 완성 및 구리산염과의 직접적인 자기적·전자적 성질 비교 연구.", " magnetism and Berry curvature.", "tags": ["theory", "altermagnetism", "anomalousHall", "Berrycurvature", "Dirac", "experimentalproposal"], "image": "https://arxiv.org/html/2606.26239v1/Figure/strain_stress.png", "briefing": {"background": "알터마그넷(Altermagnetism)은 최근 자기 질서의 새로운 범주로 주목받고 있으며, 기존의 강자성(순자화 발생)이나 반강자성(시간반전 대칭성 보존)과 달리 시간반전 대칭성이 깨지면서도 순자화가 상쇄되는 독특한 자기적 성질을 갖습니다. 이 계에서 베리 곡률과 관련된 위상적 특성을 실험적으로 측정하는 것은 어려운 과제입니다.", "motivation": "알터마그넷의 깨진 대칭성과 위상적 특성을 검증하기 위해, 기존의 자성 측정 방식 외에 '홀 점성(Hall viscosity)'이라는 새로운 지표를 제안하여 물질의 위상적 성질을 규명하고자 함.", "result": "제로 자기장에서 알터마그넷의 홀 점성 텐서가 강자성체나 일반 반강자성체와 명확히 구분됨을 보였으며, d-파 및 g-파 알터마그넷 모델에서 디락 점이나 리프시츠 전이와 같은 전자 구조적 특징에 강하게 반응함을 확인.", "implication": "자기 광학적 방법이 어려운 절연체 알터마그넷의 경우, 자기 음향 측정(magneto-acoustic measurement)을 통해 홀 점성을 관측함으로써 위상적 특성을 실험적으로 검증할 수 있는 새로운 길을 제시함.", "novelty": "운동량 공간의 베리 곡률과 대비되는 '변형 공간(strain-space)의 베리 곡률 모노폴' 개념을 도입하여 알터마그넷의 위상적 성질을 물리화함. 독자 연구 관심사인 자기 위상 물질 및 베리 곡률 연구와 직접적인 연관이 있음.", "unresolved": "실제 물질에서 음향 측정을 통한 홀 점성의 정량적 추출이 실험적으로 얼마나 정밀하게 이루어질 수 있는지에 대한 난제.", "future_work": "특정 알터마그넷 화합물에서의 음향학적 실험 제안 및 비전형적 자기 정렬이 수반된 홀 점성의 실험적 데이터 확보.", "concepts": [{"term": "알터마그넷", "why_emerged": "강자성도 반강자성도 아닌 제3의 자기 상태 규명 필요성.", "origin": "최근 2-3년 내 이론적으로 급격히 정립(Šmejkal et al. 등).", "connections": "반강자성, 위상 반금속, 베리 곡률."}, {"term": "홀 점성", "why_emerged": "양자 유체나 위상 물질에서의 응답 함수를 기술하기 위해 필요.", "origin": "Avron et al. (1995).", "connections": "양자 홀 효과, 위상 유체, 탄성 응답."}], "english_summary": ["The paper introduces Hall viscosity as a key probe for altermagnetic materials at zero magnetic field.", "The authors show that the Hall viscosity tensor distinguishes altermagnets from ferro- and antiferromagnets.", "A strain-space Berry curvature monopole is linked to electronic spectrum features like Dirac points.", "Magneto-acoustic measurements are proposed as a novel experimental technique to characterize insulating altermagnets."]}}, {"title": "Observation of a saddle-loop van Hove singularity", "journal": "npj_Qu   briefing.className = 'briefing';
  appendBriefSection(briefing, 'Background', b.background);
  appendBriefSection(briefing, 'Motivation', b.motivation);
  appendBriefSection(briefing, 'Result', b.result);
  appendBriefSection(briefing, 'Implication', b.implication);
  appendBriefSection(briefing, "Why it's important / Novelty", b.novelty);
  appendBriefSection(briefing, 'Unresolved Questions', b.unresolved);
  appendBriefSection(briefing, 'Expected Future Work', b.future_work);
  if (b.concepts && b.concepts.length) {
    const section = document.createElement('section');
    section.className = 'brief-section wide';
    section.appendChild(textEl('h2', '', 'Concepts / Terms'));
    const concepts = document.createElement('div');
    concepts.className = 'concepts';
    b.concepts.forEach(c => {
      const item = document.createElement('div');
      item.className = 'concept';
      item.appendChild(textEl('h3', '', c.term || 'Concept'));
      [['왜 생겼나: ', c.why_emerged], ['누가 만들었나: ', c.origin], ['연결되는 흐름: ', c.connections]].forEach(([label, text]) => { if (!text) return; const p = document.createElement('p'); const bold = textEl('b', '', label); p.appendChild(bold); p.append(text); item.appendChild(p); });
      concepts.appendChild(item);
    });
    section.appendChild(concepts);
    briefing.appendChild(section);
  }
  if (b.english_summary && b.english_summary.length) { const section = document.createElement('section'); section.className = 'brief-section wide'; section.appendChild(textEl('h2', '', 'English Summary')); const ul = document.createElement('ul'); b.english_summary.slice(0, 5).forEach(line => ul.appendChild(textEl('li', '', line))); section.appendChild(ul); briefing.appendChild(section); }
  slideEl.appendChild(briefing);
  counterEl.textContent = `${index + 1} / ${slides.length}`;
  prevBtn.disabled = index === 0;
  nextBtn.disabled = index === slides.length - 1;
}
prevBtn.addEventListener('click', () => { index = Math.max(0, index - 1); render(); });
nextBtn.addEventListener('click', () => { index = Math.min(slides.length - 1, index + 1); render(); });
document.addEventListener('keydown', event => { if (event.key === 'ArrowLeft') prevBtn.click(); if (event.key === 'ArrowRight') nextBtn.click(); });
render();
</script>
</body>
</html>
