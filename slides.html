<title>Daily Paper Slideshow</title>
<style>
  :root {
    color-scheme: light;
    --bg: #f6f7f4;
    --paper: #ffffff;
    --ink: #111827;
    --muted: #64748b;
    --line: #d8ddd2;
    --accent: #176b87;
    --accent-2: #9a3412;
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; overflow: auto; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: var(--bg); color: var(--ink); }
  .shell { max-width: 1500px; min-height: 100vh; margin: 0 auto; padding: 14px 18px; display: flex; flex-direction: column; }
  .topbar { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 16px; }
  .top-actions { display: flex; align-items: center; gap: 10px; }
  .topbar a, button { border: 1px solid var(--line); border-radius: 8px; background: var(--paper); color: var(--ink); padding: 10px 14px; font-weight: 700; text-decoration: none; cursor: pointer; }
  button.primary { background: var(--accent); border-color: var(--accent); color: white; }
  button:disabled { opacity: 0.45; cursor: not-allowed; }
  .counter { color: var(--muted); font-weight: 700; }
  .slide { min-height: calc(100vh - 82px); background: var(--paper); border: 1px solid var(--line); border-radius: 10px; padding: 18px; box-shadow: 0 18px 42px rgba(15, 23, 42, 0.10); display: grid; grid-template-columns: minmax(310px, 0.86fr) minmax(0, 1.55fr); gap: 18px; overflow: visible; }
  .paper-head { min-width: 0; min-height: 0; overflow: visible; display: flex; flex-direction: column; gap: 12px; }
  .figure { margin: 0; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: #f8fafc; }
  .figure img { display: block; width: 100%; max-height: 41vh; object-fit: contain; background: white; }
  .figure figcaption { padding: 7px 10px; color: var(--muted); font-size: 12px; line-height: 1.3; }
  .head-text { display: flex; flex-direction: column; gap: 9px; min-width: 0; }
  .badges { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .badge { border-radius: 999px; padding: 5px 9px; background: #eef2ff; color: #3730a3; font-size: 12px; font-weight: 800; }
  .score { background: #fee2e2; color: #991b1b; }
  h1 { margin: 0; font-size: 25px; line-height: 1.15; letter-spacing: 0; overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
  h1 a { color: inherit; text-decoration-color: rgba(23, 107, 135, 0.35); text-decoration-thickness: 2px; text-underline-offset: 4px; }
  h1 a:hover { color: var(--accent); text-decoration-color: var(--accent); }
  .meta, .authors, .why, .abstract { font-size: 13px; line-height: 1.45; }
  .meta, .authors { color: var(--muted); }
  .why strong, .abstract strong, .authors strong { color: var(--ink); }
  .authors { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .why { border-left: 4px solid var(--accent-2); padding-left: 10px; color: #374151; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .abstract { border-top: 1px solid var(--line); padding-top: 14px; color: #374151; }
  .original-abstract { border-top: 1px solid var(--line); padding-top: 10px; color: #374151; font-size: 11.5px; line-height: 1.35; overflow-wrap: anywhere; }
  .original-abstract strong { display: block; margin-bottom: 4px; color: var(--ink); }
  .tags { display: flex; flex-wrap: wrap; gap: 8px; }
  .tag { border-radius: 999px; padding: 4px 8px; background: #f1f5f9; color: #475569; font-size: 12px; font-weight: 700; }
  .head-text > .link { display: none; }
  .briefing { min-width: 0; min-height: 0; overflow: visible; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); grid-auto-rows: minmax(0, auto); align-content: start; gap: 11px 18px; border-top: 0; padding-top: 0; }
  .brief-section { min-width: 0; }
  .brief-section.wide { grid-column: 1 / -1; }
  .brief-section h2 { margin: 0 0 4px; font-size: 14px; line-height: 1.22; color: #0f766e; letter-spacing: 0; }
  .brief-section p, .brief-section li { margin: 0; font-size: 12.5px; line-height: 1.42; color: #1f2937; overflow-wrap: anywhere; }
  .brief-section ul { margin: 0; padding-left: 20px; }
  .concepts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 9px 14px; }
  .concept { border-top: 1px solid var(--line); padding-top: 7px; }
  .concept h3 { margin: 0 0 4px; font-size: 13px; color: #7c2d12; letter-spacing: 0; }
  .concept p { margin: 2px 0 0; font-size: 11.5px; line-height: 1.35; color: #374151; overflow-wrap: anywhere; }
  .concept b { color: #111827; }
  .link { color: var(--accent); font-weight: 800; text-decoration: none; }
  .empty { padding: 48px; background: var(--paper); border: 1px solid var(--line); border-radius: 12px; color: var(--muted); }
  @media (max-width: 860px) {
    .shell { padding: 14px; }
    .topbar, .top-actions { align-items: stretch; flex-direction: column; }
    .slide, .briefing, .concepts { grid-template-columns: 1fr; }
    .slide { min-height: auto; overflow: visible; display: grid; }
    h1 { font-size: 28px; }
  }
</style>

const slides = [{"title": "Pressure tuning of electronic correlations and flat bands in CsCr3Sb5", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/pqbc-87xb", "authors": "Maria Chatzieleftheriou, Jonas B. Profe, Ying Li, Roser Valentí", "last_authors": "Ying Li, Roser Valentí", "summary": "${\\mathrm{CsCr}}_{3}{\\mathrm{Sb}}_{5}$ is a newly identified strongly correlated kagome superconductor, characterized by non-Fermi-liquid behavior at elevated temperatures and intertwined charge and spin density wave order below ${T}_{\\text{DW}}≈54\\phantom{\\rule{0.222222em}{0ex}}\\mathrm{K}$. Under e…", "tier": "A_MUST_READ", "score": "10", "reason": "Direct hit on kagome metals; explores flat bands and correlations in a system related to AV3Sb5.", "tags": ["material", "CsCr3Sb5", "kagome"], "image": "", "briefing": {"background": "Kagome 격자 구조를 가진 금속 화합물은 평탄한 에너지 띠(flat bands)와 반-페르미 액체(non-Fermi liquid) 거동이 결합되어 강한 전자 상관관계를 나타내는 차세대 양자 물질 연구의 핵심 플랫폼입니다.", "motivation": "AV3Sb5 계열의 kagome 금속에서 관찰되는 전하 밀도 파동(CDW) 및 초전도성이 다른 원소 조합(CsCr3Sb5)에서도 어떻게 구현되는지, 특히 압력에 따른 전자 상관관계 변화와 평탄 띠의 역할을 규명하고자 합니다.", "result": "CsCr3Sb5에서 나타나는 CDW 및 스핀 밀도 파동(SDW)의 뒤섞인 질서와 압력에 따른 전자 구조의 진화 과정을 분석하였습니다.", "implication": "이 물질은 기존 AV3Sb5 계열과는 다른 전자 구조적 특성을 보여주며, kagome 금속의 초전도성과 위상 물성을 이해하는 데 새로운 변수를 제공합니다.", "novelty": "Ying Li와 Roser Valentí 연구진이 CsCr3Sb5를 대상으로 압력 제어를 통해 평탄 띠와 상관관계의 상호작용을 파헤친 점이 주목할 만합니다.", "unresolved": "압력 하에서 나타나는 비-페르미 액체 거동의 상세한 미시적 기원과 초전도성과의 직접적인 상관관계는 추가 연구가 필요합니다.", "future_work": "실험적 ARPES 측정을 통한 페르미 표면 및 띠 구조 검증과, 압력 환경에서의 고온 초전도성 정밀 측정.", "concepts": [{"term": "Flat bands", "why_emerged": "입자 간의 운동 에너지가 억제되어 상관관계 효과가 극대화되는 에너지 상태를 기술하기 위해 필요.", "origin": "Kagome 격자의 기하학적 간섭으로 인해 이론적으로 예견됨.", "connections": "강상관 전자계, 비-페르미 액체, Moire 초격자."}, {"term": "Kagome metals", "why_emerged": "기하학적 좌절(geometrical frustration)이 유도하는 위상 물성과 상관관계 물성을 연구하기 위해 도입.", "origin": "고전적 격자 기하학에서 유래.", "connections": "AV3Sb5, Weyl 반금속, 상위 위상 물질."}], "english_summary": ["Investigates the electronic correlations and flat bands in the newly discovered kagome superconductor CsCr3Sb5.", "Analyzes the interplay of CDW and SDW orders under pressure tuning.", "Provides theoretical insights into the distinct non-Fermi liquid behavior compared to standard AV3Sb5 materials.", "Highlights the potential of Cr-based kagome systems for studying strongly correlated electronic phases."]}}, {"title": "Tunable electron-plasmon coupling in the layered transition metal dichalcogenide ZrSe2−xTex", "journal": "PRB_Recent", "source": "author whitelist", "link": "http://link.aps.org/doi/10.1103/mkfk-8k2t", "authors": "Tongrui Li, Yuzhe Wang, Haoyuan Yan, et al.", "last_authors": "Donglai Feng, Juan Jiang", "summary": "Electron-plasmon coupling, in which carriers are dressed by collective electronic oscillations, represents an important many-body interaction in solids. Here, using angle-resolved photoemission spectroscopy, we report the tunable electron-plasmon coupling in the layered transition metal dichalcogeni…", "tier": "A_MUST_READ", "score": "10", "reason": "author whitelist: Donglai Feng", "tags": ["angle-resolvedphotoemission", "photoemission"], "image": "", "briefing": {"background": "고체 물리학에서 전자와 격자 진동(포논)뿐만 아니라 집단적 전자 진동인 플라즈몬 간의 결합은 물질의 광학적 성질과 전자 수송 특성을 결정짓는 중요한 다체 상호작용입니다.", "motivation": "전이금속 디칼코게나이드(TMD) 화합물에서 전자-플라즈몬 결합 강도를 외부 변수나 조성 변화로 제어하여 전자 상태의 동역학을 이해하고자 합니다.", "result": "ZrSe2-xTex 박막에서 조성 제어를 통해 전자와 플라즈몬 간의 결합 세기를 성공적으로 조절하였으며, 이를 ARPES를 통해 직접 관측하였습니다.", "implication": "플라즈몬 결합을 제어함으로써 물질의 전자 유효 질량을 변화시키거나 비평형 상태의 전자 구조를 공학적으로 설계할 수 있는 가능성을 제시합니다.", "novelty": "Donglai Feng 그룹의 정밀한 ARPES 측정을 통해 전자 구조 속에서 플라즈몬 결합의 명확한 시그니처를 포착했다는 점이 중요합니다.", "unresolved": "결합 강도의 변화가 정확히 어떤 스크리닝 효과와 관련되는지, 그리고 위상적 특성에 미치는 정량적 영향은 추가적인 이론 모델링이 필요합니다.", "future_work": "다양한 도핑 수준 및 온도 조건에서의 결합 강도 진화 연구, 시분해 ARPES를 통한 플라즈몬 여기 동역학 연구.", "concepts": [{"term": "Electron-plasmon coupling", "why_emerged": "전자들이 집단적 진동과 상호작용할 때 발생하는 에너지 손실 및 rized Weyl semimetals within these altermagnetic materials.", "The findings suggest a new mechanism for the quantum crystal valley Hall effect.", "This provides a potential framework for future spintronic and valleytronic devices."]}}, {"title": "Room-temperature two-dimensional ferromagnetism, large magnetic anisotropy, and anomalous Hall effect: From supported to freestanding monolayers GdM2 (M=Cu, Ag, Au)", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/csml-jn4q", "authors": "Jia-wan Li, Xunwu Hu, Dao-Xin Yao, Yusheng Hou", "last_authors": "Dao-Xin Yao, Yusheng Hou", "summary": "Here, the authors demonstrate that decoupling rare-earth Gd M 2 ( M =Cu, Ag, and Au) monolayers from metallic substrates transforms low-temperature supported surface alloys into room-temperature ferromagnets. Substrate removal enhances magnetic exchange interactions through charge redistribution, and eliminating structural buckling further modifies the competing exchange interactions. Freestanding GdAu 2 exhibits perpendicular magnetic anisotropy and a symmetry-tunable anomalous Hall effect, providing a platform for two-dimensional magnetic and topological spintronics.", "tier": "B_IMPORTANT_CONDMAT", "score": "9", "reason": "Directly relevant study of anomalous Hall effect and 2D magnetism in monolayer materials.; demoted from A: broad CM, not direct user/project hit", "tags": ["material", "anomalousHall", "monolayer"], "image": "", "briefing": {"background": "2차원 자성체는 스핀트로닉스 소자 구현을 위한 핵심 재료이나, 일반적으로 낮은 큐리 온도와 자성 이방성 부족이 실용화의 걸림돌로 작용함.", "motivation": "기존 금속 기판 위에서 성장한 GdM2 단층 물질이 겪는 구조적 제약과 자성 특성 저하 문제를 기판 분리(decoupling)를 통해 해결하고자 함.", "result": "GdAu2 단층을 기판에서 분리할 때 상온 강자성이 발현되며, 수직 자기 이방성과 대칭성에 의해 제어 가능한 이상 홀 효과가 나타남을 확인함.", "implication": "기판 분리 및 구조적 변형 조절이 2차원 자성체의 위상학적 특성을 튜닝하는 강력한 수단이 될 수 있음을 시사함.", "novelty": "Gd 기반 희토류 합금의 자성 성질을 2차원 한계(monolayer limit)에서 상온까지 끌어올렸다는 점에서 실험적 가치가 큼.", "unresolved": "실제 자유 독립(freestanding) 상태를 유지하기 위한 실험적 공 ": "카이랄 자성 상태 하에서 콘도 산란이 비상반적 저항 및 이상 홀 효과에 비선형적으로 기여함을 증명함.", "implication": "복잡한 자성 구조 내의 강한 상관 전자계 연구에 콘도 물리를 결합하여 새로운 수송 특성 예측이 가능해짐.", "novelty": "전통적인 콘도 효과 연구를 비상반적 transport라는 최신 트렌드와 결합하여 자성 상관 계의 새로운 분석 도구를 제공함.", "unresolved": "강한 자성 상관관계가 지배적인 실제 물질(예: 카이랄 격자 자성체)에서의 실험적 정량 검증은 부족함.", "future_work": "카이랄 자성체 물질에서 비상반적 저항의 온도 의존성을 측정하여 콘도 산란 기여도를 분리하는 실험 필요.", "concepts": [{"term": "Kondo Effect", "why_emerged": "금속 내 자성 불순물이 저온에서 전기 저항을 오히려 증가시키는 이상 현상을 설명하기 위해 등장.", "origin": "Jun Kondo (1964년).", "connections": "강한 상관 전자계, Heavy fermion 물리와 밀접한 관련."}, {"term": "Nonreciprocal Response", "why_emerged": "반전 대칭이 깨진 시스템에서 전류 방향에 따라 저항이 다른 현상을 통해 물질의 기하학적/위상학적 성질을 알아내기 위해 필요.", "origin": "최근 10년 사이 비통상적인 위상 물질 연구에서 활발히 논의됨.", "connections": "다이오드 효과, 카이랄 스핀 구조와 연결됨."}], "english_summary": ["The paper investigates the Kondo effect within systems exhibiting nonreciprocal electronic transport.", "It demonstrates how chiral magnetic states influence Kondo scattering and anomalous Hall responses.", "The analysis provides a theoretical bridge between strongly correlated systems and nonreciprocal physics.", "This framework could help interpret complex transport phenomena in chiral magnets."]}}, {"title": "NMR Evidence for Spontaneous Electronic Chiral Order in URhSn", "journal": "PRL_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/1vjx-4jfv", "authors": "Y. Tokunaga, T. Ishitobi, H. Sakai, S. Kambe, H. Harima, A. Nakamura, A. Maurya, D. Li, Y. Homma, F. Honda, D. Aoki, and Y. Shimizu", "last_authors": "Y. Homma, F. Honda, D. Aoki, and Y. Shimizu", "summary": "The first direct evidence of spontaneous electronic chiral order in URhSn, a strongly correlated material without an inherently chiral lattice structure, fundamentally challenges the prevailing notion that electronic chirality requires a chiral crystal framework.", "tier": "B_IMPORTANT_CONDMAT", "score": "9", "reason": "NMR evidence for spontaneous electronic chiral order, related to TRSB and loop current.; demoted from A: broad CM, not direct user/project hit", "tags": ["experiment", "NMR", "chiralorder", "TRSB", "stronglycorrelated"], "image": "", "briefing": {"background": "강상관계 물질에서 격자 구조의 대칭성 없이도 전자 상태의 자발적 대칭성 깨짐(특히 시간 반전 대칭성 깨짐, TRSB)이 나타나는 현상은 응집물질물리학의 중요한 난제 중 하나입니다. 루프 전류(loop current) 모델 등이 이와 관련하여 논의되곤 합니다.", "motivation": "URhSn 물질에서 결정 구조는 비대칭적이지 않음에도 불구하고, 자발적인 전자적 카이랄 질서가 존재하는지 확인하여 전자 물성과 구조적 대칭성 사이의 상관관계를 규명하고자 했습니다.", "result": "NMR 측정을 통해 URhSn에서 구조적 카이랄성이 없음에도 자발적인 전자적 카이랄 질서가 형성됨을 직접적으로 증명했습니다.", "implication": "전자적 카이랄 질서가 반드시 모 격자의 카이랄성에 의존할 필요는 없다는 점을 시사하며, 강상관계 물질 내 새로운 위상학적 상태나 양자 질서의 가능성을 열어줍니다.", "novelty": "구조적 카이랄성이 없는 물질에서 전자적 카이랄 질서를 NMR로 직접 검출했다는 점이 핵심이며, 이는 TRSB나 카이랄 질서를 연구하는 사용자에게 구조적 제약을 넘어서는 전자 상태 연구의 중요성을 환기합니다.", "unresolved": "전자적 카이랄 질서의 미시적 기원과 그에 따른 물리적 특성(예: 비전통적 초전도성과의 연관성)에 대해서는 추가적인 규명이 필요합니다.", "future_work": "이 전자적 카이랄 질서가 강상관 시스템의 다른 자유도와 어떻게 결합하는지, 그리고 외부 장에 의해 어떻게 제어될 수 있는지에 대한 후속 연구가 예상됩니다.", "concepts": [{"term": "자발적 전자적 카이랄 질서", "why_emerged": "격자 구조와 무관하게 전자들의 집단적 상호작용으로 생성되는 대칭성 깨짐 상태를 설명하기 위해 필요함.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "시간 반전 대칭성 깨짐(TRSB), 루프 전류 모델, 위상학적 상태."}, {"term": "NMR (Nuclear Magnetic Resonance)", "why_emerged": "국소적인 자기적 환경과 전자 상태를 프로빙하여 위상학적 혹은 자성 질서를 탐지하기 위해 필수적임.", "origin": "Isidor Rabi(1938), Bloch 및 Purcell(1946).", "connections": "강상관계 물질, TRSB 탐지, 스핀 민감도 연구."}], "english_summary": ["The study provides the first direct NMR evidence of spontaneous electronic chiral order in URhSn.", "The material lacks intrinsic structural chirality, challenging the dependency of electronic chirality on the crystal framework.", "This finding suggests that electronic degrees of freedom can spontaneously break symmetry in strongly correlated systems.", "It opens new pathways for identifying exotic quantum orders without structural template constraints."]}}, {"title": "Surface-dominant transport in Weyl semimetal NbAs nanowires for next-generation interconnects", "journal": "Science", "source": "Gemini", "link": "https://doi.org/10.1126/science.adx3027", "authors": "Yeryun Cheon, Mehrdad T. Kiani, Yi-Hsin Tu, et al.", "last_authors": "Ching-Tzu Chen, Judy J. Cha", "summary": "Ongoing demands for smaller and more energy-efficient electronic devices necessitate alternative interconnect materials with lower electrical resistivity at reduced dimensions. We report the synthesis of Weyl semimetal niobium arsenide (NbAs) nanowires through thermomechanical nanomolding with single crystallinity and controlled diameters down to 40 nanometers. The resistivity of NbAs nanowires decreases with decreasing diameter, and 40-nanometer-diameter nanowires exhibited a room-temperature resistivity of 10.5 ± 1.9 microhm·centimeters, which is ~70% lower than their bulk counterpart. Calculations attribute this resistivity reduction to surface-dominant conduction with a long carrier lifetime at finite temperatures. Further characterization of nanowires and bulk crystals revealed high breakdown current density, stability, and thermal conductivity. These properties highlight the potential of NbAs nanowires as next-generation interconnects that could surpass the limitations of current copper-based interconnects.", "tier": "B_IMPORTANT_CONDMAT", "score": "9", "reason": "Experimental transport in Weyl semimetal nanowires, directly relevant to topological materials interest.", "tags": ["Weylsemimetal", "NbAs", "nanowires", "transport", "topologicalmaterials"], "image": "", "briefing": {"background": "위상학적 물질인 바일 반금속(Weyl semimetal)은 벌크 상태에서의 특이한 전자 구조와 더불어 표면 상태에서의 높은 전도성으로 차세대 전자 소자 및 상호 연결(interconnect) 재료로서 주목받고 있습니다.", "motivation": "기존 구리 기반 상호 연결 재료의 크기 감소에 따른 저항 증가 문제를 해결하기 위해, 표면 전도성이 우수한 바일 반금속 NbAs 나노와이어의 물리적 특성을 검증하고자 했습니다.", "result": "열역학적 나노몰딩 기법으로 40nm 직경의 단결정 NbAs 나노와이어를 합성하였으며, 크기가 작아질수록 비저항이 오히려 감소하는 표면 우세 전도 현상을 관찰했습니다.", "implication": "NbAs 나노와이어가 기존 구리를 대체할 저전력, 고성능 상호 연결 재료로 활용될 수 있음을 보여주며, 위상학적 물질의 소자 응용 가능성을 크게 높였습니다.", "novelty": "위상학적 물질인 바일 반금속을 실제 나노 스케일 소자(상호 연결)로 구현하여 벌크보다 우수한 전도성을 확보했다는 점에서 실용적인 돌파구입니다.", "unresolved": "나노와이어의 직경을 더 줄였을 때 위상학적 표면 상태의 보존 여부와 양자 제한 효과와의 경쟁 관계는 여전히 연구가 필요합니다.", "future_work": "실제 CMOS 공정과의 호환성 평가 및 다양한 위상학적 나노 구조물로의 확장 연구가 진행될 것으로 보입니다.", "concepts": [{"term": "바일 반금속 (Weyl Semimetal)", "why_emerged": "에너지 밴드가 바일 점(Weyl node)에서 교차하며 위상학적 비자명성을 띠는 새로운 양자 상태를 연구하기 위해 필요함.", "origin": "Wan et al. (2011) 예측, TaAs 계열 등에서 실험적 발견.", "connections": "위상학적 절연체, 페르미 아크, 카이랄 아노말리."}, {"term": "표면 우세 전도", "why_emerged": "나노 구조체에서 벌크 산란을 최소화하고 표면의 위상학적 상태를 활용해 전도도를 높이기 위해 필요함.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "토폴로지, 위상학적 표면 상태, 나노 소자 물리학."}], "english_summary": ["NbAs Weyl semimetal nanowires were synthesized via thermomechanical nanomolding.", "Resistivity decreases as diameter decreases, reaching 10.5 microhm-cm at 40 nm.", "Performance is attributed to surface-dominant conduction, outperforming bulk counterparts.", "NbAs is proposed as a potential next-generation interconnect material for electronics."]}}, {"title": "Van der Waals template–encoded soft epitaxy of tellurium enabled by atomic layer deposition", "journal": "Science_Advances", "source": "Gemini", "link": "https://doi.org/10.1126/sciadv.aef1430", "authors": "Changhwan Kim, Hyeon Cho, Chuqiao Shi, et al.", "last_authors": "Bonggeun Shong, Joonki Suh", "summary": "Van der Waals (vdW) epitaxy can integrate lattice-mismatched crystals with atomically sharp, pristine interfaces. However, translating this concept to atomic layer deposition (ALD), a standard for low-temperature, layer-by-layer growth, remains challenging because precursors adsorb transiently on chemically inert vdW basal planes, leading to physisorption-limited nucleation and poor crystalline ordering. Here, we introduce diffusion-steered epitaxial ALD (Epi-ALD), redefining vdW surfaces as programmable kinetic-thermodynamic landscapes and demonstrate highly crystalline tellurium at 150°C. Epi-ALD couples surface-potential-encoded physisorption with long-range diffusion to promote ordered nucleation and epitaxial alignment. This “soft” pathway enables strain-free tellurium epitaxy with a pristine vdW gap (∼1.4 angstrom) despite lattice mismatch (>3.6%) and generalizes across multiple vdW templates. Retaining hallmark advantages of ALD including scalability and uniformity, we further program in-plane orientation through vdW symmetry engineering to achieve quasi-single-crystalline tellurium films with pronounced anisotropy and a chiral anomaly signature. Our work establishes a universal, low-thermal-budget approach for integrating vdW materials and expands the scope of epitaxy within the ALD paradigm.", "tier": "B_IMPORTANT_CONDMAT", "score": "9", "reason": "vdW epitaxy of tellurium films with chiral anomaly signature, highly relevant to topological materials.", "tags": ["vanderWaals", "2Dmaterials", "tellurium", "chiralanomaly", "epitaxy"], "image": "", "briefing": {"background": "반데르발스(vdW) 물질은 층간 결합이 약해 이종 구조 적층에 유리하지만, 기존 증착 방식(ALD 등)으로는 원자 단위의 정밀한 에피택셜 성장이 어려워 신소재 개발에 제약이 있었습니다.", "motivation": "vdW 표면의 운동학적-열역학적 성질을 제어하는 확산 기반 ALD 기법(Epi-ALD)을 통해 Tellurium 박막을 고품질로 성장시켜 카이랄 아노말리 등 위상학적 특성을 구현하고자 했습니다.", "result": "150도 저온 환경에서 strain-free하고 결정성이 우수한 Tellurium 박막을 구현했으며, 이를 통해 카이랄 아노말리(chiral anomaly) 신호를 성공적으로 관측했습니다.", "implication": "vdW 물질의 범용적인 적층 성장 기술을 확보함으로써, 향후 다양한 위상학적 물질을 기반으로 한 소자 제작의 새로운 플랫폼을 제공합니다.", "novelty": "화학적으로 비활성인 vdW 표면에서 원자 층 증착(ALD)을 성공적으로 구현했다는 점과, 이를 통해 카이랄 아노말리 같은 물리 현상을 소자 수준에서 제어할 수 있게 된 점이 중요합니다.", "unresolved": "이 성장 기법이 다른 복잡한 위상학적 물질이나 강상관계 물질 시스템에서도 동일하게 높은 결정성을 유지하며 적용될 수 있는지는 추가 검증이 필요합니다.", "future_work": "다양한 vdW 물질로의 기술 확장 및 이 성장 기술을 이용한 신규 위상학적 소자 연구가 기대됩니다.", "concepts": [{"term": "카이랄 아노말리 (Chiral Anomaly)", "why_emerged": "바일 반금속의 위상학적 특성으로, 자기장과 전기장이 평행할 때 전하 보존 법칙이 깨지는 현상을 설명하기 위해 필요함.", "origin": "Adler-Bell-Jackiw(ABJ) 아노말리(입자물리학)가 고체 물리에서 구현됨.", "connections": "바일 반금속, 음의 자기저항, Berry 곡률."}, {"term": "원자 층 증착 (ALD)", "why_emerged": "나노 스케일에서 두께를 원자 단위로 정밀하게 제어하며 균일한 박막을 형성하기 위해 필요함.", "origin": "Tuomo Suntola(1974).", "connections": "반도체 공정, 박막 기술, vdW 에피택시."}], "english_summary": ["Diffusion-steered epitaxial ALD (Epi-ALD) is introduced for vdW template-encoded growth.", "High-quality tellurium films are grown at 150°C with pristine van der Waals gaps.", "The films exhibit pronounced anisotropy and a clear signature of the chiral anomaly.", "This approach enables universal, low-thermal-budget integration of vdW materials."]}}, {"title": "Electron orbitals choose a direction", "journal": "Nature_Physics", "source": "Gemini", "link": "https://www.nature.com/articles/s41567-026-03358-5", "authors": "Pochang Chen, Md Shafayat Hossain", "last_authors": "Pochang Chen, Md Shafayat Hossain", "summary": "Orbital order is difficult to isolate because it often intertwines with lattice and magnetic transitions. Now, a study on an intermetallic compound reveals a surface 5d-orbital order through its electronic band structure and real-space fingerprints.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Electronic structure study of orbital order in intermetallic compounds, relevant for nematicity discussions.", "tags": ["orbitalorder", "bandstructure", "intermetallics"], "image": "https://media.springernature.com/m685/springer-static/image/art%3A10.1038%2Fs41567-026-03358-5/MediaObjects/41567_2026_3358_Fig1_HTML.png", "briefing": {"background": "고체 물리학에서 궤도 정렬(orbital order)은 전자 시스템의 비등방성을 결정짓는 핵심 요소이나, 대개 격자 변형이나 자기적 전이와 복잡하게 얽혀 있어 순수한 궤도 자유도를 분리해 관찰하기가 매우 어렵습니다.", "motivation": "본 연구는 상호작용이 강한 금속 간 화합물(intermetallic)에서 다른 외부 요인의 간섭을 최소화한 상태로 5d-궤도의 정렬 현상을 전자 구조와 실공간 정보로 식별하고자 했습니다.", "result": "표면에서의 5d-궤도 정렬을 확인하였으며, 전자 밴드 구조와 실공간에서의 핑거프린트를 통해 궤도 선택적 방향성을 명확히 입증했습니다.", "implication": "궤도 정렬이 시스템의 물리적 성질(네마틱성 등)에 어떻게 기여하는지 근본적으로 이해할 수 있는 단서를 제공하며, 차후 상관관계가 강한 물질에서의 궤도 제어 가능성을 시사합니다.", "novelty": "복합적인 상전이 속에서 궤도 정렬만을 분리하여 관찰하는 실험적 접근을 선보였으며, 이는 AV3Sb5 등의 카고메 금속에서 보이는 네마틱 현상이나 궤도 편향성을 연구하는 독자에게 중요한 방법론적 토대가 rs.", "tags": ["experiment", "material", "nickelates", "superconductivity"], "image": "", "briefing": {"background": "La3Ni2O7 이중층 니켈산염(bilayer nickelates)은 고온 초전도성을 나타낼 수 있는 물질로 주목받고 있으며, 외부 변수(압력, 변형)에 따른 전자 상태 제어가 연구의 핵심입니다.", "motivation": "이 물질이 정수압 하에서 초전도성 및 금속-비금속 전이 특성이 어떻게 변화하는지를 탐구하여 물질의 제어 가능성을 확인하고자 했습니다.", "result": "적절한 정수압 환경에서 페르미 액체(Fermi liquid) 성질의 금속성에서 비-페르미 액체(non-Fermi liquid) 응답으로의 전이를 확인하였습니다.", "implication": "에피택셜 박막 공정 및 압력 제어를 통해 이중층 니켈산염의 전자 상태를 미세 조정(tuning)할 수 있음을 입증했습니다.", "novelty": "박막 기반의 정밀한 압력 제어를 통해 니켈산염의 초전도 매커니즘 탐색을 위한 구체적인 실험 경로를 제시했습니다.", "unresolved": "관찰된 비-페르미 액체 성질이 정확히 어떤 전자 간 상호작용에서 기인하는지, 그리고 압력 범위 확장에 따른 임계 온도의 변화 양상은 불분명합니다.", "future_work": "더 높은 압력 범위에서의 수송 측정 및 해당 전자 상태에서의 자기적 성질 규명을 위한 RIXS 측정 등이 요구됩니다.", "concepts": [{"term": "Fermi Liquid", "why_emerged": "강한 상호작용을 하는 전자 시스템을 준입자(quasiparticle) 개념으로 설명하기 위해 도입됨.", "origin": "Lev Landau", "connections": "Non-Fermi liquid, Kondo effect"}, {"term": "Bilayer Nickelates", "why_emerged": "구리산염 초전도체와 유사한 구조를 가지면서도 3d 전자를 사용하여 고온 초전도 기원을 탐구하고자 함.", "origin": "최근 2-3년 내 합성 및 실험 연구", "connections": "Cuprates, La3Ni2O7-delta"}], "english_summary": ["Investigated La3Ni2O7 thin films under hydrostatic pressure.", "Observed a tunable transition from Fermi liquid to non-Fermi liquid metallicity.", "Highlights the effectiveness of strain and pressure control in tuning nickelate electronic states.", "Provides a foundation for exploring exotic quantum states in bilayer nickelates."]}}, {"title": "H-linear magnetoresistance in the T2 resistivity regime of overdoped infinite-layer nickelate La1xSrxNiO2", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/stvg-vbqs", "authors": "Yong-Cheng Pan, Tommy Kotte, Toni Helm, Motoki Osada, Atsushi Tsukazaki, Yu-Te Hsu", "last_authors": "Atsushi Tsukazaki, Yu-Te Hsu", "summary": "We report a systematic magnetotransport study on high-crystallinity ${\\mathrm{La}}_{1−x}{\\mathrm{Sr}}_{x}{\\mathrm{NiO}}_{2 1103/m9lb-4vhx", "authors": "Ryutaro Okuma, Yuita Fujisawa, Natsumi Maekawa, et al.", "last_authors": "Yoshinori Okada, Daichi Ueta", "summary": "${\\mathrm{CeTe}}_{3}$ is a van der Waals antiferromagnet composed of magnetic ${[\\mathrm{CeTe}]}^{+}$ layers coupled to highly conducting ${\\mathrm{Te}}^{0.5−}$ square nets. Its simple quasi-two-dimensional electronic structure and cleavable nature make it an appealing platform for exploring correla…", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Magnetic order in CeTe3, a vdW metal related to materials often studied for CDW/ARPES.", "tags": ["experiment", "material", "vanderWaals", "magnetism"], "image": "", "briefing": {"background": "CeTe3는 전하 밀도 파(CDW)와 자기적 질서가 공존할 수 있는 층상 구조 물질로, 전자 구조의 단순함과 박리 용이성 덕분에 강상관 전자계 연구의 플랫폼으로 주목받습니다.", "motivation": "이 물질에서 자기적 상전이와 전하 질서가 어떻게 얽혀 있는지, 특히 복잡한 자기 구조의 성격과 그 변동성을 규명하고자 합니다.", "result": "CeTe3에서 고도로 요동치는 double-q 자기 질서가 존재함을 확인했습니다.", "implication": "단순한 층상 구조에서도 복합적인 자기 질서가 발현될 수 있음을 보여주며, 향후 CDW와 자기적 질서 간의 경쟁 또는 협력 관계 연구에 중요한 기초 자료를 제공합니다.", "novelty": "vdW 물질에서의 복잡한 자기적 다중-q 질서를 다루었다는 점에서 층상 자성체 연구에 기여하며, 특히 RTe3 계열 연구자들에게 자기 구조적 통찰을 제공합니다.", "unresolved": "이러한 자기적 요동이 전자 구조에 구체적으로 어떤 영향을 주는지에 대한 실험적(ARPES 등) 데이터와 이론적 모델링이 더 필요합니다.", "future_work": "온도 변화에 따른 자기 구조의 상세 진화와 CDW 전이 온도와의 상관관계를 규명하기 위한 중성자 산란 실험이 이어질 것으로 보입니다.", "concepts": [{"term": "Double-q magnetic order", "why_emerged": "단일 파동 벡터(q)로 설명되지 않는 자기 구조를 이해하기 위해 도입되었습니다.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "스핀 밀도 파, 다강체 물질의 비공선적 자기 구조와 연관됨."}, {"term": "Van der Waals metal", "why_emerged": "박리가 가능한 2차원 적층 구조를 가지면서 전도성을 띠는 물질의 물리적 성질을 탐구하기 위해 정의되었습니다.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "그래핀, 전이금속 칼코겐화합물(TMDC) 등과 함께 2D 물리 연구의 핵심 물질군임."}], "english_summary": ["CeTe3 is investigated as a platform for studying correlation in layered magnets.", "The study reports evidence of highly fluctuating double-q magnetic order.", "This provides insights into the interplay between magnetism and electronic structure in vdW metals."]}}, {"title": "Identifying the origin of out-of-plane spin polarization in the noncollinear antiferromagnet Mn3Ge", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/kpj1-yrwh", "authors": "Mingxing Wu, Kouta Kondou, Taishi Chen, Satoru Nakatsuji, YoshiChika Otani", "last_authors": "Satoru Nakatsuji, YoshiChika Otani", "summary": "Noncollinear antiferromagnets Mn 3 X ( X =Sn, Ge) possess out-of-plane spin polarization that enables field-free magnetization switching. However, its microscopic origin remains under debate, specifically whether it arises from the antiferromagnetic order dependent magnetic spin Hall effect or antiferromagnetic order independent spin swapping. To address this issue here, the authors comparatively evaluate the spin torques in single-crystal Mn 3 Ge/Py bilayers with different crystallographic orientations using spin-torque ferromagnetic resonance technique. Their results reveal that both mechanisms coexist with comparable magnitudes, responsible for the out-of-plane spin polarization.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Direct investigation of spin dynamics in Mn3Ge, closely related to the user's interest in topological semimetals.", "tags": ["Mn3Ge", "antiferromagnet", "spinHall"], "image": "", "briefing": {"background": "Mn3Ge와 같은 비공선적 반강자성체는 위상학적 특성에 기반한 거대한 비정상 홀 효과를 보여 차세대 스핀트로닉스 소자 후보로 꼽힙니다.", "motivation": "Mn3Ge의 평면 밖 스핀 편극 현상이 자기적 질서에 의존하는지(자기 스핀 홀 효과), 아니면 질서와 무관한 스핀 교환에 의한 것인지 명확히 구별하고자 했습니다.", "result": "Mn3Ge/Py 이중층 구조를 통해 두 메커니즘이 비슷한 크기로 공존하며, 스핀 편극 현상의 공동 원인이 됨을 밝혀냈습니다.", "implication": "반강자성체 기반 소자 설계 시 이들 메커니즘의 기여도를 고려해야 하며, 스핀 토크 제어 효율을 높이는 데 기여합니다.", "novelty": "Mn3Ge의 위상학적 스핀 물리학의 기원을 분리하여 정량화했다는 점에서 실험적 엄밀함이 돋보입니다.", "unresolved": "소자 구조 내의 계면 효과가 두 기작의 상대적 비율에 미치는 영향은 추가 규명이 필요합니다.", "future_work": "보다 다양한 비공선적 반강자성 물질로 대상을 확대하여 해당 기작의 보편성을 검증할 것입니다.", "concepts": [{"term": "Noncollinear antiferromagnet", "why_emerged": "스핀이 일직선으로 배열되지 않는 복잡한 자기 구조를 이해하고 활용하기 위해 필요했습니다.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "Mn3Sn, Mn3Ge 등 베리 곡률과 관련된 위상학적 물리와 깊이 연결됨."}, {"term": "Spin torque FMR", "why_emerged": "박막 계면에서 발생하는 스핀 토크를 정밀하게 측정하기 위한 강력한 실험 기법입니다.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "스핀 홀 효과 측정, 자기 동역학 연구."}], "english_summary": ["Mn3Ge is a noncollinear antiferromagnet known for field-free switching.", "The study distinguishes between magnetic spin Hall effect and spin swapping mechanisms.", "Experimental results show both mechanisms coexist and contribute to out-of-plane spin polarization."]}}, {"title": "Raman spectroscopy of the van der Waals topological magnet GdGaI", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/n87n-h8p5", "authors": "Nan Jiang, Yijin Zhang, Yujie Xia, et al.", "last_authors": "Tomoki Machida, Yasuhiro Niimi", "summary": "We report polarization-resolved Raman spectroscopy of a van der Waals compound $\\mathrm{GdGaI}$ that is a candidate for excitonic insulators. By combining the symmetry analysis with density functional theory calculations, we identify six Raman-active phonons. The spectra exhibit only the expected an…", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Experimental Raman study on a van der Waals topological magnet candidate.", "tags": ["method", "GdGaI", "topological-magnet"], "image": "", "briefing": {"background": "GdGaI와 같은 vdW 물질은 독특한 자기적/위상학적 성질을 가지며, 특히 엑시톤 절연체 후보물질로서 전자 상호작용 연구의 장이 됩니다.", "motivation": "GdGaI의 결정 대칭성과 포논 모드를 분석하여 이 물질의 위상학적 특성을 뒷받침할 구조적 정보를 얻고자 했습니다.", "result": "편광 분해 라만 분광법을 통해 6개의 라만 활성 포논 모드를 식별하고 이론적 DFT 계산과 일치함을 확인했습니다.", "implication": "이 물질의 위상학적 성질 및 엑시톤 절연체 거동을 연구하기 위한 실험적 지표를 확보했습니다.", "novelty": "vdW 위상학적 자성체의 포논 대칭성을 명확히 하여 후속적인 구조 및 전자 상태 연구의 기준점을 제시했습니다.", "unresolved": "실험 결과가 엑시톤 절연체의 특성을 완전히 증명하는 것은 아니며, 추가적인 전자 구조 측정(ARPES 등)이 요구됩니다.", "future_work": "온도 의존적 라만 측정을 통해 위상학적 전이나 자기적 질서 변화와 관련된 소프트 모드 탐색이 예상됩니다.", "concepts": [{"term": "R 서 엑시톤(exciton)은 강한 쿨롱 상호작용으로 형성되며, 주변 매질의 유전 환경에 극도로 민감합니다. 이를 통해 반데르발스 헤테로구조의 유전 차폐 효과를 간접적으로 측정할 수 있습니다.", "motivation": "압력을 가하여 층간 거리를 정밀하게 조절함으로써, 2D 반도체 WSe2 엑시톤의 리드버그(Rydberg) 시리즈를 통해 유전 차폐 정도를 정량화하고자 함.", "result": "압력 변화에 따른 엑시톤 에너지 준위 변화를 관측하여, 헤테로구조 내에서의 효과적인 유전 상수를 추출함.", "implication": "반데르발스 헤테로구조의 밴드갭 엔지니어링 및 광학 소자 설계를 위한 필수적인 유전 상수 제어 기술을 확보함.", "novelty": "압력-튜닝 기법을 통해 정밀한 유전 환경 변화를 구현했다는 점이 강점이며, 이는 2D 물질의 전자 구조 및 다체 상호작용 연구에 유용함.", "unresolved": "다양한 층(layer) 구성이나 서로 다른 기판에서의 압력 의존성에 대한 일반화된 모델은 추가 검증이 필요함.", "future_work": "더 복잡한 모아레(moire) 격자 시스템에서의 유전 차폐 현상 및 상관 전자 상태와의 관계 연구.", "concepts": [{"term": "Rydberg Series", "why_emerged": "엑시톤의 들뜬 상태들이 에너지 스펙트럼에서 수소 원자와 유사한 계단식 구성을 가짐을 설명하기 위해.", "origin": "초록 정보만으로는 특정하기 어려움 (물리학 전반의 엑시톤 이론).", "connections": "Wannier-Mott 엑시톤, 유전 차폐, 광학 전도도."}, {"term": "Dielectric Screening", "why_emerged": "물질 내부의 전하들이 외부 전기장을 차단하거나 상호작용을 약화시키는 정도를 기술하기 위해.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "Coulomb 상호작용, 밴드갭 재규격화, 헤테로구조."}], "english_summary": ["Pressure-tuned spectroscopy is used to study excitons in WSe2 heterostructures.", "The Rydberg series of excitons serves as a sensitive probe for dielectric environment changes.", "Experimental results quantify the dielectric screening effects in van der Waals stacks.", "This provides a framework for controlling excitonic properties via pressure and structural design."]}}, {"title": "Spin-Triplet Paired Wigner Crystal Stabilized by Quantum Geometry", "journal": "PRL_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/ksxq-1l4q", "authors": "Dmitry Zverevich, Alex Levchenko, Ilya Esterlis", "last_authors": "Alex Levchenko, Ilya Esterlis", "summary": "We have used variational states to analyze the effects of band geometry on the two-dimensional Wigner crystal with one and two electrons per unit cell. At sufficiently low electron densities, we find that increasing Berry curvature drives a transition into a crystalline state composed of spin-triple…", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Theoretical analysis of Wigner crystal stability driven by Berry curvature and quantum geometry.", "tags": ["theory", "Berrycurvature", "quantumgeometry", "stronglycorrelated", "Wignercrystal"], "image": "", "briefing": {"background": "위그너 결정(Wigner Crystal)은 전자 간 쿨롱 반발력이 운동 에너지보다 지배적인 저밀도 극한에서 전자들이 격자 형태로 배열하는 강상관 전자계의 고전적 상태입니다.", "motivation": "밴드 구조의 기하학적 특성, 특히 베리 곡률과 양자 기하학이 이러한 위그너 결정의 안정성과 위상적 성질에 어떤 영향을 미치는지 이론적으로 규명하고자 했습니다.", "result": "낮은 전자 밀도에서 베리 곡률이 증가함에 따라, 단순한 위그너 결정보다 스핀-삼중항(spin-triplet) 쌍을 형성한 상태가 에너지적으로 더 안정해짐을 확인했습니다.", "implication": "강상관 계에서 위상 기하학적 인자가 새로운 자기적/초전도적 질서를 유도할 수 있음을 시사하며, 이는 위상 물질 연구의 새로운 돌파구가 될 수 있습니다.", "novelty": "베리 곡률이 위그너 결정의 위상 및 스핀 상태를 제어할 수 있다는 점을 변분법적 접근을 통해 제시하였으며, 이는 위상적 물성을 다루는 본 연구자의 관심사와 직결됩니다.", "unresolved": "실제 실험적 구현을 위한 구체적인 물질 시스템이나 구체적인 베리 곡률의 크기 임계값에 대해서는 논의가 더 필요합니다.", "future_work": "실제 고체 물질 시스템에서 이러한 스핀-삼중항 위그너 결정을 관측하기 위한 최적의 재료 탐색 및 ARPES를 이용한 밴드 구조 검증이 필요합니다.", "concepts": [{"term": "위그너 결정", "why_emerged": "전자 간 상호작용이 지배적인 영역에서의 전자 배열 문제를 해결하기 위해 도입됨", "origin": "Eugene Wigner, 1934년 제안", "connections": "강상관 계, 쿨롱 액체-고체 상전이"}, {"term": "양자 기하학", "why_emerged": "파동함수의 중첩 구조가 단순한 밴드 에너지 이상의 물리적 효과(베리 곡률 등)를 설명하기 위해 필요함", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "베리 곡률, 퀀텀 헬(QHE), 평탄 밴드 물성"}], "english_summary": ["Analyzed 2D Wigner crystals using variational states focused on band geometry.", "Found that high Berry curvature stabilizes spin-triplet paired crystalline states.", "Provides a theoretical link between quantum geometry and unconventional order in strongly correlated electrons."]}}, {"title": "Unconventional Altermagnetism in Quasicrystals: A Hyperspatial Projective Construction", "journal": "PRL_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/hx9n-v1yg", "authors": "Yiming Li, Mingxiang Pan, Jun Leng, Yuxiao Chen, Huaqing Huang", "last_authors": "Yuxiao Chen, Huaqing Huang", "summary": "Altermag cience.aed9202", "authors": "Mengze Zhao, Zhibin Zhang, Xin Sui, et al.", "last_authors": "Xiaobo Lu, Kaihui Liu", "summary": "Rhombohedral (ABC)–stacked graphene has emerged as a platform for exploring correlated and topological physics. However, its large-scale, pure-phase synthesis has been hindered by intrinsic thermodynamic metastability and kinetic instability. In this work, we introduce a step geometry–guided epitaxial strategy to deterministically control interlayer slip, enabling the synthesis of pure-phase rhombohedral graphene. Using this approach, we obtained pure (phase purity > 99%) rhombohedral graphene with an area reaching 160 micrometers by 80 micrometers and thickness ranging from ~15 layers to ~120 nanometers. The resulting samples establish the first comprehensive reference dataset of Raman fingerprints and intrinsic band structures from few-layer films to ~200-layer bulk. Electronic transport measurements reveal a layer-antiferromagnetic state and the quantum anomalous Hall effect, enabling scalable exploration of next-generation quantum science and technology applications.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Experimental work on rhombohedral graphene, quantum anomalous Hall, correlated and topological physics.", "tags": ["graphene", "topological", "correlated", "anomalousHall", "transport"], "image": "", "briefing": {"background": "능면체 적층(Rhombohedral, ABC) 그래핀은 밴드 구조의 평탄함 덕분에 강상관 및 위상 물리 연구의 핵심 플랫폼으로 주목받고 있습니다.", "motivation": "능면체 적층 그래핀은 열역학적 불안정성 때문에 대면적 고품질 시료 합성이 어려워 이를 해결할 새로운 합성 전략이 필요했습니다.", "result": "계단 기하학(step geometry)을 이용한 에피택셜 성장법을 통해 순도 99% 이상의 대면적 능면체 그래핀을 성공적으로 합성했습니다.", "implication": "고품질 시료 확보를 통해 그동안 가설로만 존재하던 능면체 그래핀의 층간 반강자성 및 양자 변칙 홀 효과 등을 체계적으로 관측할 수 있게 되었습니다.", "novelty": "합성 공정의 제어를 통해 위상적 특성이 잘 발현되는 순수 상태의 그래핀을 확보했다는 점이 중요하며, 이는 저차원 물질 연구자들에게 매우 가치 있는 레퍼런스 데이터입니다.", "unresolved": "합성된 시료의 층수에 따른 밴드 구조 변화와 전하 도핑에 따른 위상적 전이의 상세한 경계는 추가 연구가 필요합니다.", "future_work": "확보된 고품질 시료를 이용한 다양한 게이트 조절 하의       [['왜 생겼나: ', c.why_emerged], ['누가 만들었나: ', c.origin], ['연결되는 흐름: ', c.connections]].forEach(([label, text]) => { if (!text) return; const p = document.createElement('p'); const bold = textEl('b', '', label); p.appendChild(bold); p.append(text); item.appendChild(p); });
      concepts.appendChild(item);
    });
    section.appendChild(concepts);
    briefing.appendChild(section);
  }
  if (b.english_summary && b.english_summary.length) { const section = document.createElement('section'); section.className = 'brief-section wide'; section.appendChild(textEl('h2', '', 'English Summary')); const ul = document.createElement('ul'); b.english_summary.slice(0, 5).forEach(line => ul.appendChild(textEl('li', '', line))); section.appendChild(ul); briefing.appendChild(section); }
  slideEl.appendChild(briefing);
  counterEl.textContent = `${index + 1} / ${slides.length}`;
  prevBtn.disabled = index === 0;
  nextBtn.disabled = index === slides.length - 1;
}
prevBtn.addEventListener('click', () => { index = Math.max(0, index - 1); render(); });
nextBtn.addEventListener('click', () => { index = Math.min(slides.length - 1, index + 1); render(); });
document.addEventListener('keydown', event => { if (event.key === 'ArrowLeft') prevBtn.click(); if (event.key === 'ArrowRight') nextBtn.click(); });
render();
</script>
</body>
</html>
