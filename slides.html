<!DOCTYPE html>
<html lang='en'>
<head>
<meta charset='UTF-8'>
<meta name='viewport' content='width=device-width, initial-scale=1.0'>
<title>Daily Paper Slideshow</title>
<style>
  :root {
    color-scheme: light;
    --bg: #eef2f7;
    --paper: #ffffff;
    --ink: #111827;
    --muted: #64748b;
    --line: #dbe3ef;
    --accent: #2563eb;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: var(--bg);
    color: var(--ink);
  }
  .shell { max-width: 1180px; margin: 0 auto; padding: 24px; }
  .topbar { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 16px; }
  .topbar a, button {
    border: 1px solid var(--line);
    border-radius: 8px;
    background: var(--paper);
    color: var(--ink);
    padding: 10px 14px;
    font-weight: 700;
    text-decoration: none;
    cursor: pointer;
  }
  button.primary { background: var(--accent); border-color: var(--accent); color: white; }
  button:disabled { opacity: 0.45; cursor: not-allowed; }
  .counter { color: var(--muted); font-weight: 700; }
  .slide {
    min-height: calc(100vh - 154px);
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: clamp(22px, 4vw, 48px);
    box-shadow: 0 20px 50px rgba(15, 23, 42, 0.10);
    display: flex;
    flex-direction: column;
    gap: 18px;
  }
  .badges { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .badge { border-radius: 999px; padding: 6px 10px; background: #eef2ff; color: #3730a3; font-size: 13px; font-weight: 800; }
  .score { background: #fee2e2; color: #991b1b; }
  h1 { margin: 0; font-size: clamp(30px, 5vw, 58px); line-height: 1.05; letter-spacing: 0; max-width: 18ch; }
  .meta, .authors, .why, .abstract { font-size: clamp(15px, 1.8vw, 19px); line-height: 1.55; }
  .meta, .authors { color: var(--muted); }
  .why strong, .abstract strong, .authors strong { color: var(--ink); }
  .abstract {
    border-top: 1px solid var(--line);
    padding-top: 18px;
    max-width: 88ch;
  }
  .tags { display: flex; flex-wrap: wrap; gap: 8px; }
  .tag { border-radius: 999px; padding: 5px 9px; background: #f1f5f9; color: #475569; font-size: 13px; font-weight: 700; }
  .link { color: var(--accent); font-weight: 800; text-decoration: none; }
  .controls { display: flex; justify-content: space-between; gap: 12px; margin-top: 16px; }
  .empty { padding: 48px; background: var(--paper); border: 1px solid var(--line); border-radius: 12px; color: var(--muted); }
  @media (max-width: 720px) {
    .shell { padding: 14px; }
    .topbar, .controls { align-items: stretch; flex-direction: column; }
    h1 { max-width: none; }
    .slide { min-height: auto; }
  }
</style>
<link rel='icon' href='favicon.svg' type='image/svg+xml'></head>

abs/2605.19659", "authors": "Sofie Helene Ursin, Mathias Kl\\\"aui, Kjetil M. D. Hals", "last_authors": "Mathias Kl\\\"aui, Kjetil M. D. Hals", "summary": "arXiv:2605.19659v1 Announce Type: new Abstract: Altermagnets have recently attracted considerable interest due to their unique symmetry-governed spintronic properties. Here, we investigate phonon-induced magnon spin currents in a two-dimensional altermagnet. Starting from a microscopic theory of the coupled magnon-phonon system, we derive the nonequilibrium magnon distribution generated by selective phonon excitations. We show that the resulting spin currents exhibit a pronounced d-wave symmetry with respect to the phonon momentum. Moreover, the spin current along the altermagnetic directions can be completely reversed by tuning the phonon frequency. These findings establish altermagnets as promising platforms for realizing highly tunable, phonon-driven coherent terahertz magnon spin currents.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Explores phonon-induced spin currents in altermagnets, a direct interest for this profile.", "tags": ["theory", "topic", "altermagnetism"]}, {"title": "Zero-net-magnetization hybrid magnet", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2605.19445", "authors": "San-Dong Guo, Shi-Hao Zhang", "last_authors": "San-Dong Guo, Shi-Hao Zhang", "summary": "arXiv:2605.19445v1 Announce Type: new Abstract: Zero-net-magnetization magnets possess ultradense and ultrafast application potential, benefiting from their intrinsic zero stray field and terahertz dynamics characteristics. Herein, we propose the concept of zero-net-magnetization hybrid magnet, in which magnetic atoms with opposite spin polarization are partially coupled via spatial inversion ($P$) symmetry, partially via rotation/mirror ($C/M$) symmetry or partially without any symmetry correlation. From a local perspective and neglecting the interactions between local regions, hybrid magn nd opens a near-complete $\\sim66\\mathrm{meV}$ gap at the Fermi level. Crucially, discrete phase slips can be triggered by tunneling electrons above a $\\sim 20\\mathrm{meV}$ threshold, allowing imaging of stripe dynamics at the atomic scale. These results highlight the importance of correlation physics driving stripe-like orders in lanthanum nickelates with striking similarities to the cuprates.", "tier": "C_MAYBE", "score": "9", "reason": "Directly relevant spin-polarized STM study of stripes and gaps in a trilayer nickelate superconductor.; demoted from A: broad CM, not direct user/project hit; tier capped to C: formal/generic theory watch", "tags": ["STM", "La4Ni3O10", "nickelate"]}, {"title": "Low energy excitations in A-site ordered SmBaMn2O6", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2507.23383", "authors": "Mirian Garcia Fernandez, Abhishek Nag, Stefano Agrestini, et al.", "last_authors": "Taka-hisa Arima, Kejin Zhou", "summary": "arXiv:2507.23383v2 Announce Type: replace Abstract: The electron in a solid can be considered a bound state of the three independent, fundamental degrees of freedom creating quasi-particles: spinons, carrying the electron spin; plasmons carrying the collective charge mode and orbitons carrying its orbital degree of freedom. These fundamental degrees of freedom could form ordering states in which dynamics or collective motions could occurr and manifest as low-energy excitations. The exotic properties that appear in the materials exhibiting these electronic orderings are associated with these low-energy excitations. Although the orbital order (OO) and its coupling to the spin system creates very interesting phenomena, the microscopic origin of OO has been much less explored than other electronic properties as it is very difficult to directly access experimental information from OO. Due to the recent improvement in energy resolution and flux, soft x-ray resonant inelastic scattering (RIXS) allows generate a net total magnetic moment via a direct piezomagnetic effect, which is distinct from semiconductor that typically requires carrier doping in addition to strain. This provides an experimental strategy for distinguishing the G-type antiferromagnetic configuration, in which the total magnetic moment remains zero under uniaxial strain. Our work presents an isostructural $d$-wave altermagnetic $\\mathrm{RbCr_2Se_2O}$ analogous to $\\mathrm{KV_2Se_2O}$, $\\mathrm{Rb_{1-\\delta}V_2Te_2O}$ and $\\mathrm{Cs_{1-\\delta}V_2Te_2O}$, which can facilitate further experimental verification. Furthermore, these results are universal across materials of this family $\\mathrm{XCr_2Y_2O}$ (X=K, Rb, Cs; Y=S, Se, Te), thus expanding the family of altermagnets.", "tier": "C_MAYBE", "score": "9", "reason": "Prediction of robust altermagnetism in specific real compounds; high relevance for ARPES spin-splitting studies.; demoted from A: broad CM, not direct user/project hit; tier capped to C: formal/generic theory watch", "tags": ["theory", "XCr2Y2O", "altermagnetism"]}, {"title": "Coherent terahertz magnon-phonon three-wave mixing in a layered antiferromagnet", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2605.20067", "authors": "Liangyue Li, Na Wu, Zhengwang Lin, et al.", "last_authors": "Angel Rubio, Qi Zhang", "summary": "arXiv:2605.20067v1 Announce Type: new Abstract: The coherent nonlinear dynamics between collective excitations, such as magnons and phonons, drive emergent phenomena in quantum materials, yet their direct observation remains a central challenge. Here, using double-terahertz-pump optical-probe spectroscopy, we report the direct observation of coherent magnon-phonon three-wave mixing in the layered antiferromagnetic insulator FePS$_{3}$. We resolve both second- and third-order nonlinear responses of antiferromagnetic magnons and identify a suite of nonlinear couplings in two-dimensional (2D) coherent spectra, including definitive sum- and difference-frequency generation between magnons and phonons. These results lay the groundwork for exploiting coherent nonlinearities to entangle magnetic and vibrational excitations, opening avenues for quantum control and hybrid quantum technologies in the terahertz regime.", "tier": "C_MAYBE", "score": "8", "reason": "Experimental spectroscopy on a vdW antiferromagnet (FePS3) focusing on collective excitations.; tier capped to C: formal/generic theory watch", "tags": ["experiment", "material", "spectroscopy", "magnon"]}, {"title": "Dissipation-Shaped Quantum Geometry in Nonlinear Transport (Phys. Rev. Lett.)", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2511.16422", "authors": "Zhichao Guo, Xing-Yuan Liu, Hua Wang, Li-kun Shi, Kai Chang", "last_authors": "Li-kun Shi, Kai Chang", "summary": "arXiv:2511.16422v2 Announce Type: replace Abstract: The theory of the intrinsic nonlinear Hall effect, a key probe of quantum geometry, is plagued by conflicting expressions for the conductivity that is independent of the dissipation strength (rate, $\\Gamma^0$). We clarify the origin of this ambiguity by demonstrating that the \"intrinsic\" response is not universal, but is inextricably linked to the dissipation mechanism that establishes the non-equilibrium steady state (NESS). We establish a benchmark by solving the exact NESS density matrix for a generic Bloch system coupled to a featureless fermionic bath. Our exact $\\Gamma^0$ conductivity decomposes into two parts: (i) a geometric contribution, $\\sigma^{\\text{geo}}$, whose form recovers the intraband quantum metric contribution ($\\sim\\partial_k g$), providing an exact derivation that clarifies inconsistencies in the literature, and (ii) a novel, purely kinetic contribution, $\\sigma^{\\text{kin}} \\propto v^3 f^{(4)}_0$, which is absent when dissipation is modeled by white-noise disorder (e.g., a constant-$\\Gamma$ Green's function model). The discrepancy in $\\sigma^{\\text{kin}}$ between these distinct physical mechanisms is a proof that the $\\Gamma^0$ nonlinear conductivity is not a unique property of the Bloch Hamiltonian, but is contingent on the physical system-bath coupling.", "tier": "C_MAYBE", "score": "8", "reason": "Examines the role of quantum geometry and Berry curvature in nonlinear Hall transport.; tier capped to C: formal/generic theory watch", "tags": ["theory", "quantum-geometry", "Hall-effect", "Berry-curvature"]}, {"title": "Footprints of the Kitaev spin liquid in the Fano lineshapes of the Raman active optical phonons (Phys. Rev. B)", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2108.08878", "authors": "Kexin Feng, Swetlana Swarup, Natalia B. Perkins", "last_authors": "Swetlana Swarup, Natalia B. Perkins", "summary": "arXiv:2108.08878v5 Announce Type: replace Abstract: We develop a theoretical description of the Raman spectroscopy in the spin-phonon coupled Kitaev system and show that it can provide intriguing observable signatures of fractionalized excitations characteristic of the underlying spin liquid phase. In particular, we obtain the explicit form of the phonon modes and construct the coupling Hamiltonians based on $D_{3d}$ symmetry. We then systematically compute the Raman intensity and show that the spin-phonon coupling renormalizes phonon propagators and generates the salient Fano linshape. We find that the temperature evolution of the Fano lineshape displays two crossovers, and the low temperature crossover shows pronounced magnetic field dependence. We thus identify the observable effect of the Majorana fermions and the $Z_2$ gauge fluxes encoded in the Fano lineshape. Our results explain several phonon Raman scattering experiments in the candidate material $\\alpha$-RuCl$_3$.", "tier": "C_MAYBE", "score": "8", "reason": "Probes Majorana fermions in the Kitaev candidate RuCl3 via spin-phonon coupling.; tier capped to C: formal/generic theory watch", "tags": ["material", "spin-liquid", "Majorana", "Raman"]}, {"title": "Harnessing hidden quantum metric response in a 2D magnet via nonlocal photovoltaic effect", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2605.19238", "authors": "Yong Tan, Qian Hu, Rui-Chun Xiao, et al.", "last_authors": "Lixia Zhao, Kaiyou Wang", "summary": "arXiv:2605.19238v1 Announce Type: new Abstract: The quantum geometry of Bloch wavefunctions underpins a wealth of emergent phenomena in quantum materials. Its imaginary part, the Berry curvature, has long been recognized as a key source for hallmark effects such as quantum Hall and topological phenomena, etc. The real part of quantum geometry, the quantum metric, has recently garnered considerable attention due to predictions of a range of unconventional nonlinear and nonequilibrium responses. Such responses usually vanish in centrosymmetric systems, largely restricting relevant studies to non-centrosymmetric materials. Here we challenge this convention by revealing that the vanished quantum metric response can survive in a hidden form. Using a non-local photovoltaic scheme in a layered magnetic semiconductor, we spatially separate mutually compensating photocurrents and thereby detect such hidden quantum metric response. We demonstrate this effect across distinct magnetic states and down to the ultrathin limit. Moreover, we realize reconfigurable, nonvolatile and probabilistic photodetection enabled by the quantum metric response. These results not only fundamentally expand the material landscape for quantum geometric physics, but also open new gateway to harvest the quantum geometric contributions for state-of-the-art nonvolatile reprogrammable sensing and computing applications.", "tier": "C_MAYBE", "score": "8", "reason": "Significant study of quantum geometry and metric in 2D magnets; closely related to Berry curvature.; tier capped to C: formal/generic theory watch", "tags": ["experiment", "magnetism", "quantumgeometry"]}, {"title": "Itinerant Nature of Spin-Density-Wave Order in Ruddlesden-Popper Nickelates", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2605.20148", "authors": "Jiong Mei, Tianyang Xie, Kun Jiang", "last_authors": "Tianyang Xie, Kun Jiang", "summary": "arXiv:2605.20148v1 Announce Type: new Abstract: The nature of magnetism in layered Ruddlesden-Popper nickelates remains a central open question, particularly in light of recent observations of spin-wave-like magnetic excitations in metallic multilayer compounds. Here, we develop a unified itinerant description of spin-density-wave (SDW) order and magnetic excitations in La$_3$Ni$_2$O$_7$ and La$_4$Ni$_3$O$_{10}$. The essential ingredient is the multilayer mirror structure of the NiO$_2$ blocks, which organizes the low-energy electronic states into mirror-even and mirror-odd sectors. We show that dominant interband nesting between mirror-opposite bands drives a mirror-selective itinerant SDW instability, whose collective modes naturally reproduce the experimentally observed spin-wave-like spectra. In La$_4$Ni$_3$O$_{10}$, the SDW further induces a secondary mirror-even charge density wave, yielding intertwined spin and charge textures. Our results demonstrate that magnetism in multilayer nickelates is fundamentally itinerant rather than local-moment in origin, and establish mirror-selective interband SDW order as a unifying organizing principle for magnetic correlations in these systems.", "tier": "C_MAYBE", "score": "8", "reason": "Detailed electronic structure analysis of spin/charge density waves in relevant nickelate superconductors.; tier capped to C: formal/generic theory watch", "tags": ["theory", "La3Ni2O7", "nickelates"]}, {"title": "Nearly perfect Fermi surface nesting in hole-doped La3Ni2O7 enables bulk superconductivity without pressure or strain", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2605.19297", "authors": "Chengliang Xia, Jiale Chen, Hongquan Liu, Hanghui Chen", "last_authors": "Hongquan Liu, Hanghui Chen", "summary": "arXiv:2605.19297v1 Announce Type: new Abstract: The discovery of high-temperature superconductivity in Ruddlesden-Popper nickelates has drawn great attention. However, unlike cuprates and iron-based superconductors, Ruddlesden-Popper nickelates exhibit superconductivity either under high pressure in bulk samples or under compressive strain in thin films. Genuine bulk superconductivity under ambient pressure has remained elusive in these materials, precluding key measurements such as specific heat and superfluid density. In this work, we combine density-functional-theory, dynamical-mean-field-theory, and random-phase-approximation to solve the superconducting gap equation for bulk hole-doped bilayer nickelate La$_{3-x}$Sr$_x$Ni$_2$O$_7$ at ambient pressure. We find that hole doping induces a Ni-$d_{3z^2-r^2}$-derived $\\gamma$ pocket on the Fermi surface, and serves as a tuning parameter for both its size and \\textit{shape}. As $x$ approaches 0.4, the $\\gamma$ pocket evolves from circular to diamond-shaped and expands to span half of the Brillouin zone, resulting in nearly perfect Fermi surface nesting with the optimal nesting vector $\\textbf{Q} = (\\pi, \\pi)$. This, in turn, strongly enhances antiferromagnetic spin fluctuations and substantially increases the leading superconducting eigenvalue to a level at which superconductivity becomes experimentally observable. Our work provides both a robust mechanism and an experimentally feasible route to inducing the long-sought bulk superconductivity in La$_3$Ni$_2$O$_7$ without pressure or strain.", "tier": "C_MAYBE", "score": "8", "reason": "Uses DFT+DMFT to describe a mechanism for bulk nickelate superconductivity via Fermi surface nesting.; tier capped to C: formal/generic theory watch", "tags": ["theory", "material", "nickelate"]}, {"title": "Quantum-Critical, Spin-Fluctuation-driven Residual Resistivity and Emergent Universal Correlations in the Fermi-Liquid Regime of Heavy-Fermion Superconductors", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2109.14032", "authors": "M. ElMassalami, P. B. Castro, M. B. Silva Neto", "last_authors": "P. B. Castro, M. B. Silva Neto", "summary": "arXiv:2109.14032v2 Announce Type: replace Abstract: We investigate correlations within the unconventional Fermi-liquid (FL) regime of quantum-critical (QC) heavy-fermion superconductors (HFSs) by tracking the pressure dependence of three quantities: the temperature-independent, SF-driven residual resistivity, $\\rho^{ sf}_{0}(P)$; the FL scattering coefficient, $A(P)$; and the superconducting transition temperature, $T_c(P)$. The first two define the spin-fluctuation contribution to the resistivity, $\\rho(T)=\\rho^{sf}_0+AT^2$. Using experimental data from archetypal heavy-fermion systems, we identify three robust empirical correlations: $\\ln(\\frac{T_c}{\\theta}) \\propto A^{-1/2}$, $A \\propto (\\rho^{sf}_0)^2$, and $\\ln(\\frac{T_c}{\\theta}) \\propto \\big(\\rho^{sf}_0\\big)^{-1}$ ($\\theta$ is a characteristic temperature scale). Absent in conventional FL superconductors, these relationships indicate that QC fluctuations not only mediate inelastic scattering and Cooper pairing, but also generate an effective elastic channel responsible for $\\rho^{sf}_0$. We explicitly calculate $\\rho^{sf}_0$ on the high-pressure side of the quantum critical point (QCP) and introduce a characteristic length scale, $\\ell \\sim \\big(\\rho^{sf}_0\\big)^{-1}$, that captures the spatial extent of fluctuation-induced scattering. Within this regime, and within the Migdal--Eliashberg framework combined with Boltzmann transport theory, we derive analytic expressions for $T_c(\\ell)$ and $A(\\ell)$, together with their interrelations, which are consistent with the observed empirical trends. These findings highlight the quantum-critical FL regime in HFSs as an intrinsically correlated phase, governed by fluctuations and marked by unconventional transport and pairing mechanisms.", "tier": "C_MAYBE", "score": "8", "reason": "Explores scaling relations in heavy-fermion superconductors, relevant to quantum criticality.; tier capped to C: formal/generic theory watch", "tags": ["material", "heavy-fermion", "superconductivity", "transport"]}, {"title": "The Ultrafast Superconducting Diode Effect", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2605.19675", "authors": "E. Wang, M. Chavez-Cervantes, J. Satapathy, et al.", "last_authors": "E. Demler, A. Cavalleri", "summary": "arXiv:2605.19675v1 Announce Type: new Abstract: Nonreciprocal transport is generally observed in superconductors in which time reversal and inversion symmetries are simultaneously broken. This effect, which may become one of the backbones for future superconducting electronics, arises because of asymmetric vortex transport in a magnetic field. However, vortex transport is also intrinsically dissipative and limited in speed. Here, we report on the discovery of ultrafast non-reciprocal transport in centrosymmetric superconductors. For NbN films biased with a quasi-DC supercurrent, picosecond current pulses with the same sign as the bias experience resistive impedance, whereas pulses of opposite polarity encounter an inductive response. Strikingly, the effect is at least three orders of magnitude faster than in conventional superconducting diodes, limited only by ultrafast current-induced depairing. We demonstrate rectification of a 100 GHz signal, with dissipation levels of a few fJ per cycle. We foresee potential for superconducting logic elements, operating at THz bit rates with aJ energy dissipation per operation.", "tier": "C_MAYBE", "score": "8", "reason": "Reports discovery of an ultrafast non-reciprocal transport effect in superconducting NbN films.; tier capped to C: formal/generic theory watch", "tags": ["experiment", "material", "superconductivity"]}, {"title": "Vortex order in magnetic frustrated GeNi2O4 and GeCo2O4 spinels", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2605.20029", "authors": "K. Beauvois, J. Robert, M. Songvilay, J. Ollivier, B. F{\\aa}k, E. Ressouche, et al.", "last_authors": "P. Manuel, S. DeBrion, P. Strobel, V. Simonet", "summary": "arXiv:2605.20029v1 Announce Type: new Abstract: In the search for new spin textures based on singular magnetic objects like Bloch-points or vortices, spinel compounds emerge as an interesting playground due to the interplay between magnetic anisotropy and complex interactions that extend well beyond first neighbors on a pyrochlore lattice. Based on an exploration of the exchange interaction phase diagrams of members of the Ge$B_2$O$_4$ family with $B$=Co and Ni, we show, using simultaneous modeling of inelastic neutron scattering measurements and single-crystal neutron diffraction data, that a 2-$k$ magnetic structure may be stabilized in these compounds. This leads to a short period spin vortex crystal, a variant induced by the magnetic anisotropy of the 3-$k$ Bloch-point structure predicted for isotropic spins. Our study rationalizes the formation of these multi-$k$ spin textures in frustrated antiferromagnets, as well as their anisotropy-dependent evolution.", "tier": "C_MAYBE", "score": "8", "reason": "Neutron scattering study of frustrated magnetic orders in spinel compounds.; tier capped to C: formal/generic theory watch", "tags": ["neutronscattering", "material", "frustratedmagnetism"]}, {"title": "Effect of spin-dependent tunneling and intervalley scattering in magnetic-semiconductor van der Waals heterostructures on exciton and trion polarization", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2605.09088", "authors": "V. N. Mantsevich", "last_authors": "V. N. Mantsevich", "summary": "arXiv:2605.09088v2 Announce Type: replace Abstract: We present a theoretical analysis of valley pseudospin control in the transition metal dichalcogenide (TMD) monolayer by utilizing the magnetic proximity effect of 2D magnetic layer and, propose self-consistent analysis of photoluminescence (PL) polarization peculiarities in TMD/magnetic material van der Waals heterostructures. We attribute observed peculiarities to the interplay between spin-dependent interlayer charge transfer and intervalley scattering of excitons and trions. The ratio between the electron tunneling timescale and the exciton and trion intervalley scattering lifetimes and radiative lifetimes determine the PL dynamics. A possibility to switch PL polarization sign due to the quasi-particles dynamics under circularly polarized laser excitations is revealed. We also discuss generalization of the proposed model due to the careful analysis of both intervalley and intravalley scattering processes between bright and dark excitons. Obtained results allow a long-distance manipulation of exciton and trion behaviors and open the possibilities for the effective control under spin and valley pseudospin in multilayer magnetic-semiconductor van der Waals heterostructures.", "tier": "C_MAYBE", "score": "7", "reason": "Theoretical analysis of vdW heterostructures and spin/valley control in TMDs.; tier capped to C: formal/generic theory watch", "tags": ["theory", "vanderWaals", "TMD"]}, {"title": "Hidden weak-pairing superconductivity of non-interacting anyons obeying 13 statistics", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2605.19036", "authors": "Zheng-Duo Fan, Ashvin Vishwanath, Zijian Wang", "last_authors": "Ashvin Vishwanath, Zijian Wang", "summary": "arXiv:2605.19036v1 Announce Type: new Abstract: We show that a non-interacting gas of charge-$e/3$ anyons with exchange statistics $\\theta=-\\pi/3$ can superconduct through a hidden weak-pairing mechanism. Such an anyon gas arises naturally in doped fractional Chern insulators at filling $1/3$ or $2/3$, where projective lattic let index = 0;
const slideEl = document.getElementById('slide');
const counterEl = document.getElementById('counter');
const prevBtn = document.getElementById('prev');
const nextBtn = document.getElementById('next');

function textEl(tag, className, text) {
  const el = document.createElement(tag);
  if (className) el.className = className;
  el.textContent = text || '';
  return el;
}

function render() {
  slideEl.replaceChildren();
  if (!slides.length) {
    slideEl.className = 'empty';
    slideEl.textContent = 'No papers passed the filters in this run.';
    counterEl.textContent = '0 / 0';
    prevBtn.disabled = true;
    nextBtn.disabled = true;
    return;
  }
  slideEl.className = 'slide';
  const r = slides[index];
  const badges = document.createElement('div');
  badges.className = 'badges';
  if (r.score) badges.appendChild(textEl('span', 'badge score', `${r.score}/10`));
  if (r.tier) badges.appendChild(textEl('span', 'badge', r.tier));
  if (r.journal) badges.appendChild(textEl('span', 'badge', r.journal));
  if (r.source) badges.appendChild(textEl('span', 'badge', r.source));
  slideEl.appendChild(badges);

  slideEl.appendChild(textEl('h1', '', r.title));
  slideEl.appendChild(textEl('p', 'meta', [r.journal, r.source].filter(Boolean).join(' | ')));

  if (r.last_authors || r.authors) {
    const authors = document.createElement('p');
    authors.className = 'authors';
    authors.textContent = '';
    if (r.last_authors) authors.append('Last authors: ' + r.last_authors);
    if (r.authors) authors.append((r.last_authors ? ' | ' : '') + 'Authors: ' + r.authors);
    slideEl.appendChild(authors);
  }

  if (r.reason) {
    const why = document.createElement('p');
    why.className = 'why';
    const strong = textEl('strong', '', 'Why: ');
    why.appendChild(strong);
    why.append(r.reason);
    slideEl.appendChild(why);
  }

  if (r.tags && r.tags.length) {
    const tags = document.createElement('div');
    tags.className = 'tags';
    r.tags.forEach(tag => tags.appendChild(textEl('span', 'tag', '#' + tag)));
    slideEl.appendChild(tags);
  }

  if (r.summary) {
    const abstract = document.createElement('p');
    abstract.className = 'abstract';
    const strong = textEl('strong', '', 'Abstract: ');
    abstract.appendChild(strong);
    abstract.append(r.summary);
    slideEl.appendChild(abstract);
  }

  if (r.link) {
    const link = document.createElement('a');
    link.className = 'link';
    link.href = r.link;
    link.target = '_blank';
    link.rel = 'noopener noreferrer';
    link.textContent = 'Open paper';
    slideEl.appendChild(link);
  }

  counterEl.textContent = `${index + 1} / ${slides.length}`;
  prevBtn.disabled = index === 0;
  nextBtn.disabled = index === slides.length - 1;
}

prevBtn.addEventListener('click', () => { index = Math.max(0, index - 1); render(); });
nextBtn.addEventListener('click', () => { index = Math.min(slides.length - 1, index + 1); render(); });
document.addEventListener('keydown', event => {
  if (event.key === 'ArrowLeft') prevBtn.click();
  if (event.key === 'ArrowRight') nextBtn.click();
});
render();
</script>
