호작용과 집단 모드를 기술하기 위해 필요.", "origin": "Hans Bethe, Edwin Salpeter (1951).", "connections": "전자-포논 상호작용, 초전도 응답 함수."}, {"term": "게이지 불변성(Gauge invariance)", "why_emerged": "전자기장에서 물리적 관측량이 선택한 게이지에 의존하지 않아야 한다는 근본적인 물리적 요구.", "origin": "Hermann Weyl (1918).", "connections": "Maxwell 방정식, Ward-Takahashi 항등식."}], "english_summary": ["Investigated the electromagnetic response of Dirac superconductors using the Bethe-Salpeter equation.", "Proved that normal-state subtraction (NSS) is consistent with gauge invariance in the static long-wavelength limit.", "Justified the role of vertex corrections in canceling unphysical contributions.", "Provided a theoretical foundation for common computational data processing in Dirac materials."]}}, {"title": "Generalized Critical-State Analysis of Local Field Screening in High-Pressure Yttrium Polyhydride", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2611.25456", "authors": "A. G. Gavriliuk, I. A. Troyan, A. A. Mironovich, A. G. Ivanova, H. -K. Mao, V. V. Struzhkin", "last_authors": "H. -K. Mao, V. V. Struzhkin", "summary": "We resolve the long-standing controversy over the interpretation of magnetic-flux expulsion in high-pressure superhydrides by measuring the local magnetic field adjacent to yttrium polyhydride at 171 GPa and 4.1 K with a 57 Fe Mössbauer sensor. Nuclear forward scattering tracks the local induction B sensor ​ ( B a ) B_{\\rm sensor}(B_{a}) , which nearly merges with the normal-state line near 1.5 T. Rather than assuming a constant-current Bean state, we solve the critical-state problem for the actual thin-disk geometry using the Shantsev–Clem–Sanchez method and compare generalized field-dependent critical-state models. Both the Kim and exponential laws reproduce the measured virgin branch, whereas the constant- J c J_{c} Bean model fails. The corresponding zero-field critical-current densities, ( 4.38 ± 1.48 ) × 10 11 (4.38\\pm 1.48)\\times 10^{11} and ( 2.45 ± 0.22 ) × 10 11 (2.45\\pm 0.22)\\times 10^{11} A/m 2 , respectively, are consistent in order of magnitude with transport estimates for granular YH 6 . These results establish that the observed flux expulsion is a pinned critical state, not the equilibrium Meissner effect, and demonstrate a general methodology for probing local superconductivity under extreme conditions.", "tier": "B_IMPORTANT_CONDMAT", "score": "7", "reason": "Advanced characterization of high-pressure superconductivity; relevant to experimental condensed matter.", "tags": ["superconductivity", "high-pressure"], "image": "https://arxiv.org/html/2611.25456v1/fig2f.png", "briefing": {"background": "고압 하에서 나타나는 수소화물 초전도체(superhydrides)는 매우 높은 임계 온도를 보이지만, 자기장 차폐 현상이 메이스너 효과인지 아니면 고정된 임계 상태(critical state)인지에 대한 논란이 지속되어 왔습니다.", "motivation": "고압 환경에서 뫼스바우어 센서를 이용해 시료 근처의 국소 자기장을 정밀 측정함으로써, 기존의 단순 모델(Bean 모델)이 설명하지 못하는 flux expulsion 현상을 정확히 규명하고자 했습니다.", "result": "Bean 모델 대신 Shantsev-Clem-Sanchez 방법을 적용한 일반화된 임계 상태 모델이 실험 데이터를 성공적으로 설명함을 보였습니다. 관측된 현상은 평형 상태인 메이스너 효과가 아니라 임계 전류에 의해 자기장이 고정된 상태임을 확인했습니다.", "implication": "고압 초전도체 연구에서 flux expulsion 분석 시 반드시 적절한 임계 상태 모델을 적용해야 함을 강조하며, 초전도 특성 판단의 오류를 줄일 수 있습니다.", "novelty": "171 GPa라는 극한 환경에서 뫼스바우어 분광법으로 국소 자기장을 직접 추적하여, 고압 초전도체의 자기적 거동에 대한 오랜 논쟁을 종식하는 정밀 데이터를 제시했습니다.", "unresolved": "시료의 다결정성이나 입자 크기 분포가 임계 전류 밀도 도출에 미치는 영향을 완전히 배제하기는 어렵습니다.", "future_work": "다른 고압 수소화물 시스템에 동일한 방법론을 적용하여 임계 전류 밀도의 일반적 특성을 조사할 예정입니다.", "concepts": [{"term": "임계 상태 모델(Critical-state model)", "why_emerged": "제2종 초전도체 내부에 자기장이 침투할 때 발생하는 고정(pinning) 현상을 설명하기 위해 도입.", "origin": "C. P. Bean (1962).", "connections": "Bean 모델, Kim 모델, 자속 흐름(Flux flow)."}, {"term": "뫼스바우어 분광법(Mössbauer spectroscopy)", "why_emerged": "핵준위 전이를 이용하여 극도로 정밀한 에너지 측정과 자기장 정보를 얻기 위해.", "origin": "Rudolf Mössbauer (1958).", "connections": "핵 자기 공명, 고압 물리학."}, {"term": "수소화물 초전도체(Superhydrides)", "why_emerged": "상온 초전도체를 찾기 위해 수소를 고압으로 압축하여 금속화하려는 시도에서 탄생.", "origin": "Ashcroft의 예측 이후 현대 고압 실험 물리에서 활발히 연구.", "connections": "BCS 이론, 고압 물리학."}], "english_summary": ["Resolved controversy over magnetic-flux expulsion in high-pressure Yttrium polyhydrides.", "Utilized 57Fe Mössbauer sensors to map local induction at 171 GPa.", "Proved the observed flux expulsion is a pinned critical state, not the Meissner effect.", "Demonstrated that generalized critical-state models accurately fit the experimental data."]}}, {"title": "Magnetic field induced modulation of heat transport in CrPS4 probed by TaIrTe4 transverse Seebeck thermometry", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2610.19833", "authors": "Krishnaraajan Sundararajan, Sergio Alvarruiz, C\\'edric A. Cordero-Silis, et al.", "last_authors": "Joseph Barker, Bart J. van Wees", "summary": "Understanding and controlling heat flow in low-dimensional magnetic materials is central to thermoelectrics and spin caloritronics. One of the challenges is the absence of sensitive probes of small, field-dependent modulations in thermal transport. Here we demonstrate transverse Seebeck thermometry using exfoliated TaIrTe$_4$ as a probe of thermal conductivity modulated by an external magnetic field on a van der Waals magnet, CrPS$_4$. With a temperature gradient oriented at $45^\\circ$ to its principal crystallographic axes, TaIrTe$_4$ exhibits a transverse thermopower exceeding $200~\\mathrm{\\mu V\\,K^{-1}}$ for 900 nm wide and 30 $\\mu$m long electrodes, enabling precise detection of variations in the local temperature gradients. Exploiting this with CrPS$_4$ in a nonlocal geometry, we resolve distinct field dependent thermal conductivity changes associated with both the spin-flip and spin-flop magnetic transitions which we attribute to variations in the magnon$-$phonon coupling in CrPS$_4$. At 5 K, the transverse Seebeck response is modulated by more than 8$\\%$ by an external magnetic field, demonstrating strong magnetic control of heat transport in CrPS$_4$. This all van der Waals platform offers high sensitivity to modulations of thermal conductivity and a broad adaptability to a wide range of exfoliated magnetic systems.", "tier": "B_IMPORTANT_CONDMAT", "score": "7", "reason": "Interesting transport study in vdW magnetic materials using telluride probes.", "tags": ["transport", "van_der_waals", "magnonics"], "image": "https://arxiv.org/html/2610.19833v3/Main_SiOx.png", "briefing": {"background": "저차원 자성 재료에서의 열 수송은 열전 및 스핀 칼로리트로닉스 응용에 핵심적이나, 이를 정밀하게 측정할 수 있는 감도 높은 프로브가 부족한 상태입니다.", "motivation": "외부 자기장에 의한 자성체(CrPS4)의 미세한 열 전도도 변화를 비국소(nonlocal) 기하학 구조에서 정밀하게 검출하고자 합니다.", "result": "TaIrTe4를 횡방향 제베크(transverse Seebeck) 프로브로 사용하여, CrPS4의 스핀-플립 및 스핀-플롭 자기 전이 시 발생하는 열 전도도의 변화를 성공적으로 분해했습니다.", "implication": "TaIrTe4와 같은 반데르발스 재료를 이용하면 자기장에 의해 조절되는 열 수송 현상을 초고감도로 탐지할 수 있으며, 이는 차세대 스핀 칼로리트로닉 소자 개발의 기반이 됩니다.", "novelty": "기존에 다루기 어려웠던 van der Waals 자성체에서의 자성-격자 결합(magnon-phonon coupling) 효과를 횡방향 열전 응답으로 직접 시각화한 점이 독창적입니다.", "unresolved": "CrPS4 내의 구체적인 마그논-포논 상호작용의 미시적 기작에 대한 정량적 분석은 여전히 연구가 필요합니다.", "future_work": "다양한 박리(exfoliated) 자성 재료들에 이 프로빙 플랫폼을 확장하여 일반적인 자성-열 수송 거동을 체계적으로 분류할 예정입니다.", "concepts": [{"term": "횡방향 제베크 효과 (Transverse Seebeck Effect)", "why_emerged": "온도 구배와 평행하지 않은 방향에서 기전력을 측정하여 열 수송의 비등방성 변화를 감지하기 위해 고안됨.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "비정상 네른스트 효과(Anomalous Nernst Effect), 스핀 칼로리트로닉스."}, {"term": "마그논-포논 결합 (Magnon-Phonon Coupling)", "why_emerged": "자성체 내에서 스핀 파동(마그논)과 격자 진동(포논) 간의 상호작용이 열 에너지 흐름을 어떻게 조절하는지 설명하기 위해 필요.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "열 전도도 비등방성, 자기적 열전 소자."}], "english_summary": ["Demonstrated transverse Seebeck thermometry using TaIrTe4 as a sensitive probe.", "Resolved field-dependent thermal conductivity in van der Waals magnet CrPS4.", "Linked thermal modulation to spin-flip/spin-flop transitions and magnon-phonon coupling.", "Provided an all-vdW platform for future spin-caloritronic characterization."]}}, {"title": "Nonuniform superconducting states from Majorana flat bands (Phys. Rev. B)", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2605.03859", "authors": "Sushanth Varada, Aksel Kobia{\\l}ka, Ankita Bhattacharya, Patric Holmvall, Annica M. Black-Schaffer", "last_authors": "Patric Holmvall, Annica M. Black-Schaffer", "summary": "Zero-energy flat bands within the superconducting gap can give rise to competing ordered phases. We investigate such phases in topological superconductors based on the magnetic adatom platform hosting a flat band of Majorana edge states. Our self-consistent calculations of the superconducting order parameter show the emergence of both a pair density wave with edge-localized amplitude modulations, often a bond wave order, and a phase crystal characterized by longer-wavelength edge-localized phase modulations. Both these states lower the free energy by gapping out the Majorana flat band, but use different mechanisms tied to the underlying topology. In fact, at zero temperature the uniform superconducting solution with Majorana flat band never survives. Instead, a pair density wave appears when sufficient Majorana modes exist with oppositely signed topological winding numbers, while a phase crystal appears in regions of the phase diagram where one non-trivial winding number is heavily dominating. A crossover region connects these two states with modulations in both amplitude and phase. At finite temperatures, the pair density wave survives up to around 80% of the bulk superconducting transition temperature, while the phase crystal only appears at lower temperatures and the crossover region is also strongly suppressed. Our findings establish the ubiquity of emergent nonuniform superconducting phases and their temperature-dependent behavior in topological superconductors.", "tier": "B_IMPORTANT_CONDMAT", "score": "7", "reason": "Theoretical study of non-uniform superconductivity and Majorana flat bands in topological superconductors, with experimental connections.", "tags": ["theory", "Majorana", "topologicalsuperconductor", "flatband", "superconductivity"], "image": "https://arxiv.org/html/2605.03859v2/Experimental_setup_schematic.png", "briefing": {"background": "위상 초전도체의 Majorana 평탄 밴드(flat band)는 높은 상태 밀도로 인해 시스템이 에너지를 낮추려는 불안정성을 가지며, 이는 다양한 비균일 초전도 질서(nonuniform superconducting order)를 유도합니다.", "motivation": "자기 흡착 원자가 존재하는 위상 초전도체에서 Majorana 평탄 밴드가 형성될 때, 이 시스템이 균일한 초전도 상태를 유지하는지 아니면 다른 질서로 전이되는지 규명하고자 합니다.", "result": "Majorana 평탄 밴드를 가진 시스템은 균일 초전도 상태보다 pair density wave나 phase crystal 형태의 비균일 질서 상태가 에너지적으로 더 안정함을 보였습니다.", "implication": "위상 초전도체에서 발견되는 특이한 초전도 양상은 Majorana 평탄 밴드와 깊은 연관이 있으며, 이를 통해 위상 질서와 초전도성의 경쟁 관계를 이해할 수 있습니다.", "novelty": "Majorana 평탄 밴드를 '제거(gapping out)'하는 에너지 최소화 메커니즘을 파동 함수 위상과 결합하여 이론적으로 증명했습니다.", "unresolved": "이러한 비균일 상태가 실제 실험에서 관찰되는 구체적인 스펙트럼적 특징(예: STM dI/dV 패턴)에 대한 명확한 예측은 추가적인 시뮬레이션이 필요합니다.", "future_work": "이러한 질서 파라미터의 공간적 변조를 실험적으로 관찰하기 위한 STM/STS 연구가 필요합니다.", "concepts": [{"term": "Majorana 평탄 밴드 (Majorana Flat Band)", "why_emerged": "위상 초전도체 가장자리나 특정 결함 근처에서 에너지 비용 없이 존재하는 양자 상태를 설명하기 위해 필요함.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "위상 초전도성, 비국소 Majorana 페르미온."}, {"term": "Pair Density Wave (PDW)", "why_emerged": "초전도 질서 파라미터가 공간적으로 진동하며 평균값이 0이 될 수 있는 비균일 초전도 상태를 기술하기 위해 필요함.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "고온 초전도체, 질서 파라미터 경쟁."}], "english_summary": ["Showed that Majorana flat bands in topological superconductors induce nonuniform phases.", "Identified pair density waves and phase crystals as competing ground states.", "Demonstrated that uniform superconducting states are unstable against these modulations.", "Linked topological winding numbers to the emergence of specific modulated order."]}}, {"title": "Origin and hole-density dependence of the intrinsic spin Hall conductivity in inorganic halide perovskites", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2611.25488", "authors": "Thanh Tung Huynh, Yuefeng Yin, Weiyao Zhao, et al.", "last_authors": "Julie Karel, Nikhil V. Medhekar", "summary": "Metal halide perovskites have spin-orbit coupling among the strongest in semiconductors, yet whether their centrosymmetric bulk phases can convert charge current into spin current, and what controls the response, is unknown. Here we identify, from first-principles calculations on the four all-inorganic compounds CsBX3 (B = Pb, Sn; X = Br, I), the factors that govern their intrinsic spin Hall conductivity. The conductivity arises from the spin Berry curvature of the spin-orbit-split halide-p bands, 1.1-2.6 eV below the valence band maximum, and exceeds that of III-V and group-IV semiconductors when the Fermi level lies inside them. Because the valence band maximum is an s-p singlet, shifted only in second order, these contributions cancel in the undoped compounds, which respond like conventional semiconductors. With hole doping the response recovers, and at densities reachable by electric double-layer gating CsPbI3 attains the spin Hall conductivity of p-GaAs. The response is therefore determined by the position of the halide-p bands relative to the valence band maximum, not by the atomic spin-orbit constant, a criterion that applies to any semiconductor with an orbital-singlet band edge. These results point to CsPbI3 as a candidate gate-controlled source of spin current for perovskite spin-orbit torque devices.", "tier": "B_IMPORTANT_CONDMAT", "score": "7", "reason": "First-principles study of spin Hall effects; relevant to electronic structure and topological physics.", "tags": ["Berrycurvature", "electronicstructure", "spintronics"], "image": "https://arxiv.org/static/browse/0.3.4/images/arxiv-logo-fb.png", "briefing": {"background": "무기물 할라이드 페로브스카이트는 강한 스핀-궤도 결합(SOC)을 가지고 있어 스핀트로닉스 응용 가능성이 크지만, 전하-스핀 변환 효율을 결정짓는 미시적 메커니즘은 잘 알려져 있지 않습니다.", "motivation": "반전 대칭성을 가진 벌크 페로브스카이트가 스핀 홀 효과(SHE)를 보일 수 있는지, 그리고 도핑이 이 현상에 어떤 영향을 주는지 조사하고자 합니다.", "result": "CsBX3(B=Pb, Sn)에서 내재적(intrinsic) 스핀 홀 전도도는 할라이드-p 밴드 내의 스핀 베리 곡률(Berry curvature)에 의해 결정되며, 정공 도핑 시 스핀 홀 전도도가 급격히 회복됨을 확인했습니다.", "implication": "스핀 홀 전도도가 밴드 끝단(VBM)의 오비탈 특성에 의존하므로, 향후 게이트 제어를 통해 스핀 전류원을 정밀하게 설계할 수 있는 가능성을 제시합니다.", "novelty": "스핀 홀 전도도가 원자 단위의 SOC 상수보다는 밴드 구조의 위치와 오비탈 특성에 의해 결정된다는 범용적인 설계 원리를 도출했습니다.", "unresolved": "제안된 이론적 예측이 실험적인 스핀-오비탈 토크(SOT) 측정으로 완전히 검증되지는 않았습니다.", "future_work": "CsPbI3 등의 페로브스카이트 박막을 이용한 실제 게이트 제어 스핀 홀 효과 소자 구현 및 측정.", "concepts": [{"term": "스핀 베리 곡률 (Spin Berry Curvature)", "why_emerged": "스핀-궤도 결합이 있는 시스템에서 전자의 파동 함수 기하학적 위상에 의한 비정상적인 전하/스핀 흐름을 계산하기 위해 도입됨.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "스핀 홀 효과, 비정상 홀 효과."}, {"term": "할라이드 페로브스카이트 (Halide Perovskites)", "why_emerged": "뛰어난 광전 특성과 강한 스핀-궤도 결합을 결합하여 차세대 반도체 및 스핀트로닉스 재료로 활용하기 위해 연구됨.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "태양전지, 위상 절연체 유사체."}], "english_summary": ["Analyzed intrinsic spin Hall conductivity in inorganic halide perovskites via first-principles.", "Identified spin Berry curvature of halide-p bands as the primary source of SHE.", "Established hole doping as a mechanism to tune the spin Hall response.", "Proposed CsPbI3 as a candidate for gate-tunable spintronic devices."]}}, {"title": "Sliding-ferroelectric control of dipolar and quadrupolar excitons in R-stacked WSe2", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2611.26158", "authors": "Asmund Ottesen, Shun Feng, Edoardo Lopriore, et al.", "last_authors": "Oleg V. Yazyev, Andras Kis", "summary": "A fundamental property of interlayer excitons is their dipolar character, enabling electrical tunability, enhanced exciton-exciton interactions and extended lifetime. It is important for studying collective phenomena and realizing novel optoelectronic devices. However, in homo- or heterostructures based on two-dimensional semiconductors, the magnitude and orientation of the dipole moment are commonly locked due to spatially confined charges and nature of the band transition. Here, we use gate-dependent photoluminescence of few-layer R-WSe2 to harness sliding ferroelectricity for controlling the exciton dipole configuration of emerging layer-hybridised excitons. The sliding-ferroelectric control enables a pronounced on/off switching of the diffusive transport of hybrid dipolar excitons, while further facilitating gradual and abrupt dipole reconfigurations with emerging quadrupolar excitons. Our optical probe reveals intermediate states of vertically aligned interfacial polarisation with magnitudes that confirm cumulative polarisation in multilayers. Overall, our work presents sliding ferroelectricity as a powerful tool to tune interlayer coupling and layer hybridisation. These results represent a step toward ferroelectric-controlled exciton interconnects and novel multi-bit optical memories.", "tier": "B_IMPORTANT_CONDMAT", "score": "7", "reason": "Experimental study of exciton control in van der Waals heterostructures, relevant to broader interests.", "tags": ["method", "material", "topic"], "image": "https://arxiv.org/static/browse/0.3.4/images/arxiv-logo-fb.png", "briefing": {"background": "2차원 반도체 반데르발스 이종접합에서 층간 엑시톤은 쌍극자 모멘트를 가져 외부 전기장으로 제어가 가능하지만, 일반적으로 적층 구조에 의해 그 방향과 크기가 고정되어 있어 자유로운 조절이 어렵습니다.", "motivation": "R-적층 WSe2 다층 구조에서 슬라이딩 강유전성(sliding ferroelectricity)을 활용하여 엑시톤의 쌍극자 및 사극자 상태를 능동적으로 제어할 수 있는지 확인하고자 합니다.", "result": "게이트 전압을 통해 층간 하이브리드 엑시톤의 쌍극자 구성을 변화시키고, 확산 수송을 on/off하거나 사극자 엑시톤으로의 재구성을 유도하는 데 성공했습니다.", "implication": "슬라이딩 강유전성이 층간 결합과 하이브리드화를 조절하는 강력한 도구임을 입증하며, 향후 엑시톤 기반의 광학적 메모리 및 인터커넥트 소자 개발에 기여할 것입니다.", "novelty": "기존에 고정되어 있던 엑시톤의 물리적 상태를 강유전적 슬라이딩을 통해 다단계로 제어할 수 있다는 점이 독창적이며, van der Waals 이종접합 소자 설계에 새로운 자유도를 제공합니다.", "unresolved": "다양한 두께 및 적층 각도에 따른 엑시톤 동역학의 정량적 변화에 대한 보편적인 모델 정립이 필요합니다.", "future_work": "강유전 제어를 활용한 실질적인 멀티비트 광학적 메모리 소자 제작 및 상온 동작 가능성에 대한 후속 연구가 기대됩니다.", "concepts": [{"term": "Sliding Ferroelectricity", "why_emerged": "반데르발스 층 사이의 상대적 위치 변화가 전기적 분극을 유도할 수 있다는 사실이 발견되면서 새로운 강유전성 제어 기제로 주목받음.", "origin": "초록 정보만으로는 특정하기 어려움 (최근 2D 물질 연구에서 활발히 논의됨).", "connections": "층간 결합, 2D 적층 구조, 전기적 극성 제어."}, {"term": "Interlayer Excitons", "why_emerged": "이종접합에서 전자와 정공이 서로 다른 층에 위치하게 되어 수명이 길어지고 전기장 조절이 용이해짐.", "origin": "초록 정보만으로는 특정하기 어려움 (반도체 물리학의 고전적 개념).", "connections": "반데르발스 이종접합, 엑시톤 응축, optoelectronics."}], "english_summary": ["Demonstrates gate-tunable control of interlayer excitons in R-stacked WSe2.", "Utilizes sliding ferroelectricity to reconfigure exciton dipole and quadrupolar states.", "Achieves on/off switching of diffusive transport and multi-level control.", "Paves the way for ferroelectric-controlled excitonic logic and memory devices."]}}, {"title": "Thermally driven multiple sliding states and avalanche dynamics in rhombohedral Pb(TaSe2)2 nanoflakes (Materials Today)", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2611.25739", "authors": "Zhuokai Xu, Xiaohui Yang, Zhefeng Lou, et al.", "last_authors": "Ruiya Zhan, Xiao Lin", "summary": "Interlayer sliding in van der Waals materials offers a promising route to control functional properties, yet a comprehensive understanding of the complex collective domain dynamics governing these transitions remains challenging. Here, we investigate thermally driven sliding dynamics in Pb(TaSe2)2 nanoflakes, incorporating transport and atomic-resolution scanning transmission electron microscopy (STEM) measurements. Reducing the flake thickness induces multiple stepwise resistance jumps with enhanced hysteresis, corresponding to transitions between stacking domains accompanied by ripplocations. Statistical analysis of the jumps reveals collective avalanche behavior of domain dynamics with universal power-law scaling, quantifying the domain motion. Harnessing these features, we demonstrate controllable, non-volatile multi-level resistive switching, including write/erase operations, via thermal cycling. These findings provide valuable insights into the sliding dynamics for various 2D materials, with significant implications for the development of slidetronics devices.", "tier": "B_IMPORTANT_CONDMAT", "score": "7", "reason": "Study of interlayer sliding and domain dynamics in 2D van der Waals materials.", "tags": ["vanderWaals", "transport", "domaindynamics"], "image": "https://arxiv.org/html/2611.25739v1/Fig1.png", "briefing": {"background": "반데르발스 물질의 층간 슬라이딩은 구조적 위상 변화를 통해 물성을 제어할 수 있는 유망한 방법이나, 그 과정에서 일어나는 복잡한 도메인 동역학에 대한 이해가 부족합니다.", "motivation": "Pb(TaSe2)2 나노플레이크에서 발생하는 층간 슬라이딩과 그에 따른 저항 변화 과정을 원자 단위의 STEM 및 수송 측정을 통해 규명하고자 합니다.", "result": "두께 감소에 따라 단계적 저항 변화가 관찰되며, 이는 슬라이딩 도메인들의 집단적인 눈사태(avalanche) 동역학과 관련이 있음을 통계적으로 확인했습니다.", "implication": "슬라이딩 동역학의 보편적 법칙을 이해함으로써, 2D 물질 기반의 비휘발성 저항 스위칭 및 '슬라이드트로닉스(slidetronics)' 소자의 기초를 마련했습니다.", "novelty": "나노 스케일의 구조적 전이와 거시적 수송 특성을 결합하여 슬라이딩 도메인의 동역학을 통계 물리학적 관점에서 해석한 점이 중요합니다.", "unresolved": "다양한 환경 변수(압력, 자기장) 하에서의 슬라이딩 동역학 변화와 제어 가능성에 대한 연구가 추가로 필요합니다.", "future_work": "온도 사이클링 이외의 외부 자극을 통한 슬라이딩 도메인 정밀 제어 및 대면적 소자 구현 실험.", "concepts": [{"term": "Slidetronics", "why_emerged": "층간 미끄러짐을 통해 전자적 상태를 제어하는 차세대 비휘발성 소자 개념.", "origin": "초록 정보만으로는 특정하기 어려움 (최근 2D 슬라이딩 연구에서 파생).", "connections": "위상 변화 메모리, 2D 도메인 동역학."}, {"term": "Avalanche Dynamics", "why_emerged": "복잡계에서 도메인이 개별적으로 움직이지 않고 집단적으로 연쇄 반응을 일으키는 현상을 기술하기 위해 도입됨.", "origin": "초록 정보만으로는 특정하기 어려움 (통계 물리학의 임계 현상 개념).", "connections": "거듭제곱 법칙(Power-law), 히스테리시스, 자기장 내 도메인 벽 이동."}], "english_summary": ["Investigates thermally driven interlayer sliding in Pb(TaSe2)2 nanoflakes.", "Identifies collective avalanche dynamics of stacking domains using transport and STEM.", "Observes universal power-law scaling in domain motion during resistance jumps.", "Demonstrates multi-level non-volatile resistive switching via thermal cycling."]}}, {"title": "Topological Bound States in the Continuum", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2611.25493", "authors": "Dan-Na Liu, J. Villavicencio, Pierre A. Pantaleon", "last_authors": "J. Villavicencio, Pierre A. Pantaleon", "summary": "We uncover topological bound states in the continuum in AB-stacked bilayer graphene mass-wall junctions. Valley topology supports interface states propagating along the wall, while a distinct winding of the confinement conditions governs exact decoupling from conducting leads. Tuning the junction length or interlayer bias can merge oppositely charged bound states and remove confinement without changing the valley topology. At generic critical points, the state remains bound and nearby resonance widths open quartically with momentum. These results connect complementary roles of topology in interface propagation and confinement within a conducting continuum.", "tier": "B_IMPORTANT_CONDMAT", "score": "7", "reason": "Theoretical study of topological bound states in graphene; relevant to topological materials profile.", "tags": ["topological", "graphene", "theory"], "image": "https://arxiv.org/html/2611.25493v1/Figure1.png", "briefing": {"background": "연속체 내 경계 상태는 보통 도파관이나 특정 전위 장벽에서 존재하는데, 위상학적 특성을 결합하여 더 견고하고 제어 가능한 속박 상태를 구현하려는 연구가 활발합니다.", "motivation": "AB-적층 이중층 그래핀의 질량벽(mass-wall) 접합에서 계면의 위상학적 특성이 어떻게 연속체 내 속박 상태를 유도하고 제어하는지 이론적으로 분석합니다.", "result": "계면의 valley 위상학이 도선으로부터의 분리를 유도하며, 접합 길이와 층간 바이어스를 통해 속박 상태의 가둠을 정밀하게 제어할 수 있음을 보였습니다.", "implication": "위상학적 속박 상태가 전도성 연속체 내에서 안정적으로 존재함을 확인하여, 저전력 위상학적 소자 설계의 이론적 토대를 제공합니다.", "novelty": "위상학적 개념을 그래핀의 계면 전파 및 속박 상태와 성공적으로 연결하였으며, 특히 층간 바이어스로 속박 조건을 변경할 수 있다는 점이 응용 측면에서 매우 흥미롭습니다.", "unresolved": "실제 실험적 환경에서의 무질서(disorder)나 불순물이 이러한 위상학적 상태의 안정성에 미치는 영향은 향후 검증이 필요합니다.", "future_work": "제안된 속박 상태를 실험적으로 관찰하기 위한 STS(주사 터널링 분광법) 기반의 측정 및 소자 제작.", "concepts": [{"term": "Bound States in the Continuum (BIC)", "why_emerged": "연속적인 에너지 스펙트럼 내에 존재함에도 불구하고 외부로 퍼져나가지 않는 속박 상태를 기술하기 위해 필요.", "origin": "von Neumann and Wigner (1929년 이론적 제안).", "connections": "위상 절연체, 파동 가이드, 공진기."}, {"term": "Valley Topology", "why_emerged": "그래핀의 K/K' 계곡(valley) 자유도가 갖는 위상학적 불변량을 활용해 독특한 전도 특성을 구현하기 위해 도입.", "origin": "초록 정보만으로는 특정하기 어려움 (최근 그래핀 valleytronics 분야).", "connections": "Berry curvature, 계곡 홀 효과(Valley Hall Effect)."}], "english_summary": ["Identifies topological bound states in the continuum in AB-stacked bilayer graphene junctions.", "Valley topology enables stable confinement against conducting leads.", "Demonstrates tuning of confinement via junction length and interlayer bias.", "Connects interface propagation with topological confinement physics."]}}, {"title": "Two distinct notions of speed in antiferromagnets", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2611.26482", "authors": "Paul Herrgen, Stephan Wust, Christin Schmitt, et al.", "last_authors": "Benjamin Stadtm\\\"uller, Martin Aeschlimann", "summary": "The terahertz resonance frequencies of antiferromagnets characterize their precessional dynamics but do not necessarily imply faster laser-induced quenching of magnetic order. Here, we investigate the distinct roles of magnetic compensation and electronic scattering phase space by comparing ultrafast demagnetization in the antiferromagnetic charge-transfer insulator NiO, the metallic antiferromagnet Mn2Au, and a ferromagnetic Ni reference. The extracted response in Mn2Au is approximately four times faster than in NiO and substantially faster than in Ni. These observations are consistent with exchange-mediated scattering between antiparallel sublattices enabling rapid loss of antiferromagnetic order without requiring net angular-momentum transfer to an external reservoir, provided sufficient electronic scattering phase space is available. In insulating NiO, restricted electronic scattering channels reduces the ultrafast response. Our results distinguish ultrafast demagnetization from exchange-enhanced precession and identify the interplay of spin-flip probability and electronic scattering rate as a key factor governing the nonequilibrium response of compensated magnets.", "tier": "B_IMPORTANT_CONDMAT", "score": "7", "reason": "Important insights into ultrafast dynamics of antiferromagnets; relevant for magnetic materials research.", "tags": ["antiferromagnet", "ferromagnet"], "image": "https://arxiv.org/static/browse/0.3.4/images/arxiv-logo-fb.png", "briefing": {"background": "반강자성체(antiferromagnet)는 자성 메모리 등 차세대 스핀트로닉스 소자의 후보 물질로 주목받고 있으며, 그 초고속 동역학(ultrafast dynamics)을 이해하는 것이 정보 처리 속도 향상의 핵심입니다.", "motivation": "반강자성체의 테라헤르츠 공명 주파수(precessional frequency)가 높다고 해서 반드시 외부 자극에 대한 자성 소멸(demagnetization) 속도도 빠른 것은 아닙니다. 본 연구는 공명 주파수와 자성 소멸 속도라는 두 가지 다른 '속도'의 개념을 명확히 구분하고자 합니다.", "result": "금속성 반강자성체 Mn2Au는 절연체인 NiO보다 자성 소멸이 약 4배 빠르며, 강자성체 Ni보다도 빠릅니다. 이는 반강자성체에서 외부로의 각운동량 전달 없이도 전자 산란(electronic scattering)을 통해 반평행한 부격자들 간의 교환 상호작용으로 자성을 빠르게 잃을 수 있음을 보여줍니다.", "implication": "초고속 자성 스위칭 소자를 설계할 때, 단순한 공명 주파수보다는 전자 산란 경로(scattering phase space)가 충분히 확보된 금속성 시스템을 선택하는 것이 중요함을 시사합니다.", "novelty": "반강자성체의 초고속 demagnetization 속도가 단순히 스핀 세차운동 주파수에 의존하는 것이 아니라, 전자 산란 및 재료의 금속/절연체 성질에 의해 지배됨을 규명했습니다.", "unresolved": "실제 다양한 반강자성 재료군에서 전자 산란율과 스핀-플립 확률의 미세한 상관관계를 정량화하는 연구가 추가로 필요합니다.", "future_work": "다른 금속성 반강자성체나 도핑된 반강자성 절연체에서의 초고속 동역학 비교 연구.", "concepts": [{"term": "Ultrafast demagnetization", "why_emerged": "펨토초 레이저 펄스를 이용해 자성 재료의 정렬 상태를 제어하기 위해 필수적으로 연구되는 분야입니다.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "Femtomagnetism, spin-lattice coupling."}, {"term": "Magnetic compensation", "why_emerged": "반강자성체의 부격자 자화가 상쇄되어 전체 자화가 0이 되는 특성을 설명하기 위해 등장했습니다.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "Ferrimagnetism, antiferromagnetic spintronics."}], "english_summary": ["Distinguishes between precession speed and laser-induced demagnetization speed in antiferromagnets.", "Shows metallic Mn2Au demagnetizes faster than insulating NiO due to available electronic scattering phase space.", "Identifies electronic scattering and spin-flip probability as key drivers for ultrafast magnetic quenching.", "Suggests metallic antiferromagnets are superior for ultrafast spin-based information processing."]}}, {"title": "Umklapp-enhanced high-Tc topological superconductivity mediated by magnons in p-wave magnets", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2611.25015", "authors": "Kristoffer Leraand, Asle Sudb{\\o}", "last_authors": "Kristoffer Leraand, Asle Sudb{\\o}", "summary": "We show that magnon exchange can induce nodal topological superconductivity in a microscopic model of a $p$-wave magnet. Solving the weak-coupling multiband gap equation for itinerant electrons exchange-coupled to localized spins, we find a nodal $p$-wave gap and a critical temperature that rises sharply as the Fermi surface approaches the magnetic Brillouin-zone boundary. In this regime, small-reduced-momentum magnons can scatter electrons between Fermi-surface segments on opposite sides of the zone. These Umklapp processes enhance pairing because the contributions from different sites in the magnetic unit cell cancel less in their electron-magnon vertices than in those for ordinary scattering at comparable reduced momenta. Momentum-resolved winding numbers predict zero-energy Majorana flat bands at symmetry-preserving edges where the bulk nodes project to distinct momenta.", "tier": "B_IMPORTANT_CONDMAT", "score": "7", "reason": "Relevant theoretical study on topological superconductivity and itinerant electron-magnon coupling in magnetic systems.", "tags": ["superconductivity", "topological", "magnons"], "image": "https://arxiv.org/html/2611.25015v1/fig1_model_overview.png", "briefing": {"background": "위상 초전도체는 마요라나 페르미온을 구현할 수 있는 후보 물질로, 특히 자성체와 결합된 시스템에서 어떻게 초전도 상태가 유도되고 위상적 성질이 나타나는지에 대한 이론적 연구가 활발합니다.", "motivation": "자성체 내의 마그논(magnon)이 유효한 매개체로 작용하여 전자들 사이의 쌍형성(pairing)을 유도할 수 있는지, 그리고 이것이 고온 초전도성을 이끌어낼 수 있는지 확인하고자 합니다.", "result": "p-파 자성체에서 마그논 교환을 통해 마디(nodal)를 가진 p-파 초전도성이 유도됨을 보였습니다. 특히 페르미 표면이 자기 브릴루앙 영역 경계에 근접할 때 움클랍(Umklapp) 산란 과정이 효율적인 쌍형성을 유도하여 임계 온도(Tc)를 높임을 확인했습니다.", "implication": "자기적 질서가 있는 시스템에서 위상 초전도성을 유도하기 위한 구체적인 조건(페르미 표면 위치 및 마그논 분산 관계)을 제시합니다.", "novelty": "움클랍 과정이 마그논 매개 초전도성을 강화하여 고온 위상 초전도성을 달성할 수 있음을 이론적으로 증명했습니다.", "unresolved": "실제 실험적으로 검증 가능한 특정 물질 후보군에 대한 정량적 예측은 아직 부족합니다.", "future_work": "제시된 이론을 바탕으로 실제 자성 위상 물질에서의 전이 온도 및 갭 구조 측정.", "concepts": [{"term": "Umklapp scattering", "why_emerged": "결정 격자의 주기성 때문에 전자 산란 시 운동량 보존 법칙이 역격자 벡터만큼 차이가 날 수 있음을 설명하기 위해 도입되었습니다.", "origin": "Rudolf Peierls (1929)", "connections": "Electron-phonon coupling, resistivity, superconductivity."}, {"term": "Majorana flat bands", "why_emerged": "위상 초전도체의 경계에서 나타나는 제로 에너지 상태의 특이성을 기술하기 위해 사용됩니다.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "Topological insulators, p-wave superconductivity."}], "english_summary": ["Proposes magnon exchange as a mechanism for p-wave topological superconductivity.", "Finds that Umklapp processes significantly enhance Tc when the Fermi surface nears the magnetic Brillouin-zone boundary.", "Predicts the existence of zero-energy Majorana flat bands at system edges.", "Links electronic pairing in magnets directly to magnetic Brillouin-zone topology."]}}, {"title": "Unusual critical currents in quasi-one-dimensional superconducting aluminum two-width structures in a magnetic field (V.I. Kuznetsov, O.V. Trofimov, Physica B)", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2604.27881", "authors": "V. I. Kuznetsov, O. V. Trofimov", "last_authors": "V. I. Kuznetsov, O. V. Trofimov", "summary": "We measured critical switching and retrapping currents as functions of temperature in the zero field and as functions of a magnetic field perpendicular to the substrate surface at a temperature close to the critical temperature in thin-film long quasi-one-dimensional superconducting aluminum two-width structures consisting of narrow and wide wires with different critical temperatures. It is found that the switching current as a function of the field is nonlocal (dependent on electron transport in the area containing the junction line between the narrow and wide wires). The unusual behavior of the switching current lies in the fact that it is poorly described by the classical Ginzburg-Landau theory. In low and intermediate fields, the switching current is determined mainly by the densities of critical currents in the narrow and wide wires, respectively, near the wire junction line. In high fields, the switching current is due to equilibrium fluctuations of the order parameter.", "tier": "B_IMPORTANT_CONDMAT", "score": "7", "reason": "Experimental study of critical currents in quasi-one-dimensional superconducting aluminum structures.", "tags": ["experiment", "superconductivity", "quasi-1Dmaterials", "transport"], "image": "https://arxiv.org/html/2604.27881v2/tovfigure1.png", "briefing": {"background": "준 1차원 초전도체(quasi-1D superconductor)의 임계 전류 연구는 나노 규모 소자의 전하 수송과 위상학적 물리 현상(예: 위상적 절연체/초전도체 접합)을 이해하는 데 기초가 됩니다.", "motivation": "서로 다른 너비와 임계 온도를 가진 알루미늄 배선이 연결된 구조에서, 자기장이 인가되었을 때 발생하는 비국소적(nonlocal) 임계 전류 거동을 탐구하고자 합니다.", "result": "좁은 와이어와 넓은 와이어의 접합부에서 발생하는 임계 전류는 고전적인 긴즈부르크-란다우(Ginzburg-Landau) 이론만으로는 충분히 설명되지 않음을 확인했습니다. 낮은 자기장에서는 국부적 임계 전류 밀도가, 높은 자기장에서는 차수 매개변수(order parameter)의 평형 요동이 지배합니다.", "implication": "초전도 소자의 설계 시 나노 구조의 기하학적 형상이 자기장 응답 및 전류 전송 특성에 결정적인 영향을 미침을 보여줍니다.", "novelty": "준 1차원 초전도 구조에서 자기장 인가 시 나타나는 임계 전류의 비국소적 거동을 실험적으로 규명했습니다.", "unresolved": "고전적 이론을 넘어선 정확한 미시적 메커니즘을 설명하기 위한 개선된 이론 모델이 필요합니다.", "future_work": "다양한 두께와 너비 조합을 가진 소자 제작을 통해 기하학적 요인이 임계 전류에 미치는 영향을 체계적으로 분류.", "concepts": [{"term": "Ginzburg-Landau theory", "why_emerged": "초전도 현상의 전이 근처에서 차수 매개변수의 거동을 기술하기 위해 현상학적으로 등장했습니다.", "origin": "Vitaly Ginzburg and Lev Landau (1950)", "connections": "BCS theory, macroscopic quantum phenomena."}, {"term": "Retrapping current", "why_emerged": "초전도 상태에서 상전도 상태로 전이된 후, 다시 초전도 상태로 돌아올 때의 전류 임계점을 정의하기 위해 필요합니다.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "Phase slip centers, vortex dynamics."}], "english_summary": ["Investigates critical currents in quasi-1D superconducting Al wires with varying widths.", "Observes nonlocal behavior in switching current dependent on the junction between different wire widths.", "Finds Ginzburg-Landau theory insufficient to describe high-field critical current behavior.", "Attributes high-field critical currents to equilibrium fluctuations of the order parameter."]}}, {"title": "Quantum Metric Control of Topological Superconductivity and Incommensurate Charge Density Wave in an Interacting Lieb-Kitaev Chain Model", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2611.26327", "authors": "Jiale Xuan, Grant Z. X. Yang, K. T. Law, Xiao Yan Xu", "last_authors": "K. T. Law, Xiao Yan Xu", "summary": "We study an interacting spinless Lieb-Kitaev chain model in the nearly flat-band regime, motivated by the recent observation that Majorana zero modes in the noninteracting Lieb-Kitaev system inherit two decay modes: an ordinary Bogoliubov-de Gennes (BdG) length and a longer geometric length controlled by the quantum metric. By tuning both the interaction strength and quantum metric, we identify a topological superconducting (TSC) phase, an incommensurate charge-density-wave (ICDW)phase, and a commensurate charge-density-wave (CDW) phase. Inside the TSC phase, the QML is enhanced when increasing the interactions. In the ICDW phase, the interactions are modulated by quantum metric to generate an effective chemical potential, leading to a discontinuous incommensurate-to-commensurate (IC-C) transition. We verify these phases and conclusions using low energy effective theory and density-matrix renormalization group (DMRG) calculations.", "tier": "C_MAYBE", "score": "8", "reason": "Connects quantum metric to CDW and topological superconductivity; relevant to experimental electronic structure studies.; tier capped to C: formal/generic theory watch", "tags": ["CDW", "topological", "superconduct"], "image": "https://arxiv.org/html/2611.26327v1/Fig1_Fig2_combined.png", "briefing": {"background": "위상 초전도체(TSC)와 전하 밀도 파(CDW)는 강상관계 물질 연구의 핵심 주제로, 특히 평탄 밴드(flat-band) 구조에서 나타나는 양자 기하학적 특성이 이들의 위상적 성질을 어떻게 규제하는지가 중요한 연구 과제입니다.", "motivation": "Lieb-Kitaev 모델에서 Majorana 영 모드의 감쇠 길이가 양자 메트릭(Quantum Metric)에 의해 제어된다는 이전 연구를 바탕으로, 상호작용이 존재하는 시스템에서 양자 메트릭이 위상 초전도 상태와 전하 밀도 파 상태를 어떻게 변조하는지 탐구하고자 합니다.", "result": "상호작용과 양자 메트릭의 조절을 통해 위상 초전도(TSC), 비통약 CDW(ICDW), 통약 CDW(CDW) 상을 식별했습니다. 특히 ICDW 상에서는 양자 메트릭이 유효 화학 포텐셜을 생성하여 비통약-통약 전이를 유도함을 밝혀냈습니다.", "implication": "양자 메트릭이 위상적 질서와 CDW 사이의 경쟁과 협력을 제어하는 핵심 파라미터임을 입증하여, 향후 위상 물질의 상태 제어 가능성을 시사합니다.", "novelty": "이론적으로 Majorana 모드의 기하학적 길이 제어를 상호작용 시스템으로 확장하고, 이를 DMRG를 통해 검증함으로써 위상 물질의 미시적 이해도를 높였습니다.", "unresolved": "실제 실험적 물질계에서 양자 메트릭을 직접적으로 정밀하게 튜닝하는 방법과, 이 이론이 예측하는 상 경계에서의 신호를 ARPES 등으로 관측하기 위한 구체적인 물질 후보군 제시는 아직 부족합니다.", "future_work": "실제 2D 또는 1D 위상 물질계에서 이 이론적 모델을 검증하기 위한 밴드 구조 설계 및 그에 따른 수송 현상 연구가 필요합니다.", "concepts": [{"term": "Quantum Metric", "why_emerged": "파동 함수의 기하학적 구조에서 거리를 정의하기 위해 도입됨", "origin": "Provost와 Vallee (1980), Berry curvature와 밀접한 관련", "connections": "Berry curvature, Quantum Geometry, Flat-band physics"}, {"term": "Lieb-Kitaev chain", "why_emerged": "격자 구조상에서 위상 초전도성과 Majorana 모드의 생성을 연구하기 위한 모델 시스템", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "Kitaev wire, topological superconductivity, flat-band systems"}], "english_summary": ["Investigated an interacting Lieb-Kitaev chain model in the flat-band regime.", "Identified phase transitions between TSC, ICDW, and CDW states controlled by quantum metric.", "Showed that quantum metric modulates interaction to induce an effective chemical potential.", "Validated phase behaviors using DMRG and low-energy effective field theories."]}}, {"title": "Exciton-driven Floquet engineering from first principles", "journal": "npj_QuantumMaterials", "source": "Gemini", "link": "https://www.nature.com/articles/s41535-026-00951-y", "authors": "Ruipeng Li, Benshu Fan, Umberto De Giovannini, Hannes Hübener, Angel Rubio", "last_authors": "Hannes Hübener, Angel R
