<title>Daily Paper Slideshow</title>
<style>
  :root {
    color-scheme: light;
    --bg: #f6f7f4;
    --paper: #ffffff;
    --ink: #111827;
    --muted: #64748b;
    --line: #d8ddd2;
    --accent: #176b87;
    --accent-2: #9a3412;
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; overflow: auto; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: var(--bg); color: var(--ink); }
  .shell { max-width: 1500px; min-height: 100vh; margin: 0 auto; padding: 14px 18px; display: flex; flex-direction: column; }
  .topbar { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 16px; }
  .top-actions { display: flex; align-items: center; gap: 10px; }
  .topbar a, button { border: 1px solid var(--line); border-radius: 8px; background: var(--paper); color: var(--ink); padding: 10px 14px; font-weight: 700; text-decoration: none; cursor: pointer; }
  button.primary { background: var(--accent); border-color: var(--accent); color: white; }
  button:disabled { opacity: 0.45; cursor: not-allowed; }
  .counter { color: var(--muted); font-weight: 700; }
  .slide { min-height: calc(100vh - 82px); background: var(--paper); border: 1px solid var(--line); border-radius: 10px; padding: 18px; box-shadow: 0 18px 42px rgba(15, 23, 42, 0.10); display: grid; grid-template-columns: minmax(310px, 0.86fr) minmax(0, 1.55fr); gap: 18px; overflow: visible; }
  .paper-head { min-width: 0; min-height: 0; overflow: visible; display: flex; flex-direction: column; gap: 12px; }
  .figure { margin: 0; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: #f8fafc; }
  .figure img { display: block; width: 100%; max-height: 41vh; object-fit: contain; background: white; }
  .figure figcaption { padding: 7px 10px; color: var(--muted); font-size: 12px; line-height: 1.3; }
  .head-text { display: flex; flex-direction: column; gap: 9px; min-width: 0; }
  .badges { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .badge { border-radius: 999px; padding: 5px 9px; background: #eef2ff; color: #3730a3; font-size: 12px; font-weight: 800; }
  .score { background: #fee2e2; color: #991b1b; }
  h1 { margin: 0; font-size: 25px; line-height: 1.15; letter-spacing: 0; overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
  h1 a { color: inherit; text-decoration-color: rgba(23, 107, 135, 0.35); text-decoration-thickness: 2px; text-underline-offset: 4px; }
  h1 a:hover { color: var(--accent); text-decoration-color: var(--accent); }
  .meta, .authors, .why, .abstract { font-size: 13px; line-height: 1.45; }
  .meta, .authors { color: var(--muted); }
  .why strong, .abstract strong, .authors strong { color: var(--ink); }
  .authors { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .why { border-left: 4px solid var(--accent-2); padding-left: 10px; color: #374151; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .abstract { border-top: 1px solid var(--line); padding-top: 14px; color: #374151; }
  .original-abstract { border-top: 1px solid var(--line); padding-top: 10px; color: #374151; font-size: 11.5px; line-height: 1.35; overflow-wrap: anywhere; }
  .original-abstract strong { display: block; margin-bottom: 4px; color: var(--ink); }
  .tags { display: flex; flex-wrap: wrap; gap: 8px; }
  .tag { border-radius: 999px; padding: 4px 8px; background: #f1f5f9; color: #475569; font-size: 12px; font-weight: 700; }
  .head-text > .link { display: none; }
  .briefing { min-width: 0; min-height: 0; overflow: visible; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); grid-auto-rows: minmax(0, auto); align-content: start; gap: 11px 18px; border-top: 0; padding-top: 0; }
  .brief-section { min-width: 0; }
  .brief-section.wide { grid-column: 1 / -1; }
  .brief-section h2 { margin: 0 0 4px; font-size: 14px; line-height: 1.22; color: #0f766e; letter-spacing: 0; }
  .brief-section p, .brief-section li { margin: 0; font-size: 12.5px; line-height: 1.42; color: #1f2937; overflow-wrap: anywhere; }
  .brief-section ul { margin: 0; padding-left: 20px; }
  .concepts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 9px 14px; }
  .concept { border-top: 1px solid var(--line); padding-top: 7px; }
  .concept h3 { margin: 0 0 4px; font-size: 13px; color: #7c2d12; letter-spacing: 0; }
  .concept p { margin: 2px 0 0; font-size: 11.5px; line-height: 1.35; color: #374151; overflow-wrap: anywhere; }
  .concept b { color: #111827; }
  .link { color: var(--accent); font-weight: 800; text-decoration: none; }
  .empty { padding: 48px; background: var(--paper); border: 1px solid var(--line); border-radius: 12px; color: var(--muted); }
  @media (max-width: 860px) {
    .shell { padding: 14px; }
    .topbar, .top-actions { align-items: stretch; flex-direction: column; }
    .slide, .briefing, .concepts { grid-template-columns: 1fr; }
    .slide { min-height: auto; overflow: visible; display: grid; }
    h1 { font-size: 28px; }
  }
</style>

<script>
const slides = [{"title": "Floquet dressing of bulk metallic bands in 2H-NbSe2", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2610.04958", "authors": "Cong Li, Qirui Cui, Maciej Dendzik, et al.", "last_authors": "Wentao Zhang, Oscar Tjernberg", "summary": "Floquet dressing offers a route to controlling electronic states through periodic optical driving. Its realization in solids has centred primarily on topological-insulator surface states, semiconductors and two-dimensional Dirac semimetals. Extending this control to bulk metals would enable manipulation of the itinerant states underlying metallic transport and collective order. Yet strong screening and rapid scattering have long cast doubt on its feasibility in bulk metals, while photoelectron dressing complicates its identification. Here we identify Floquet dressing of the overlapping, bulk-derived metallic bands of 2H-NbSe2 using time- and angle-resolved photoemission spectroscopy. Photon-shifted replicas in a sparse unoccupied-state window retain the parent-band dispersions and appear only during pump--probe overlap. Rotating the pump's linear polarization at fixed probe polarization redistributes replica weight between momentum-space branches. With a common parameter set, a model accounting for the optical fields inside and outside the solid captures this redistribution through coherent Floquet--Volkov interference more closely than either pathway alone or their incoherent intensity sum. These findings extend Floquet dressing to the itinerant bulk bands of a multiband metal without relying on the observation of energy gaps opened by hybridization between parent bands and their photon-dressed replicas, providing a basis for exploring how coherent optical dressing couples to metallic transport and collective electronic phases.", "tier": "A_MUST_READ", "score": "10", "reason": "Direct hit: time-resolved ARPES study of Floquet dressing in the bulk bands of NbSe2.", "tags": ["tr-ARPES", "NbSe2", "Floquetengineering"], "image": "https://arxiv.org/html/2610.04958v1/Fig1_BandandFS.png", "briefing": {"background": "주기적인 광학 드라이빙을 통해 고체의 전자 상태를 제어하는 플로케 공학(Floquet engineering)은 주로 위상 절연체나 반도체 등 전하 밀도가 낮은 시스템에서 연구되어 왔습니다. 반면 금속의 경우, 강한 스크리닝 효과와 빠른 산란 과정으로 인해 벌크 밴드에서 일관된 플로케 상태를 구현하고 관찰하는 것이 어렵다고 여겨져 왔습니다.", "motivation": "본 연구는 대표적인 층상 금속이자 초전도체인 2H-NbSe2의 벌크 전도띠에서 플로케 드레싱(Floquet dressing)이 가능한지 확인하고, 광전자에 의한 일시적 효과(Volkov states)와 진정한 플로케 상태를 구분하여 그 기작을 규명하고자 했습니다.", "result": "시간 분해 광전자 분광법(tr-ARPES)을 통해 2H-NbSe2의 벌크 밴드에서 광자에 의해 에너지가 이동된 복제 밴드(photon-shifted replicas)를 관찰했습니다. 이 복제 밴드는 펌프광의 편광 방향에 따라 운동량 공간에서의 강도 분포가 달라지며, 이는 고체 내부와 외부의 광학 장을 모두 고려한 플로케-볼코프 간섭(Floquet-Volkov interference) 모델로 잘 설명됨을 보였습니다.", "implication": "이 결과는 플로케 제어가 저밀도 시스템을 넘어 일반적인 금속의 벌크 전도띠까지 확장될 수 있음을 시사합니다. 이는 향후 빛을 이용해 금속의 수송 특성이나 전하 밀도파(CDW), 초전도와 같은 집단적 전자 상태를 실시간으로 제어할 수 있는 기반이 됩니다.", "novelty": "금속의 강한 차폐를 뚫고 벌크 밴드에서 플로케 드레싱을 명확히 확인했다는 점이 핵심입니다. 특히 독자님의 주요 관심사인 NbSe2를 대상으로 tr-ARPES를 활용해 플로케 상태의 증거를 제시한 논문으로, 단순한 표면 효과가 아님을 입증한 것이 중요한 진전입니다.", "unresolved": "플로케 드레싱에 의해 유도된 유효 해밀토니안이 실제 금속의 초전도 전이 온도나 CDW 갭 크기에 어떠한 물리적 변화를 가하는지에 대한 직접적인 수송 측정 결과는 아직 부족합니다.", "future_work": "더 강한 펌프 필드를 사용하여 밴드 간 혼성(hybridization)에 의한 에너지 갭 형성을 직접 관찰하고, 이를 통해 비평형 상태에서의 위상학적 상전이를 유도하는 연구가 이어질 것으로 보입니다.", "concepts": [{"term": "Floquet dressing", "why_emerged": "강한 주기적 외력을 받는 양자계의 유효 해밀토니안을 기술하여 새로운 전자 상태를 설계하기 위해 등장했습니다.", "origin": "Gaston Floquet의 수학적 정리를 양자역학 및 광-물질 상호작용에 응용한 것에서 유래했습니다.", "connections": "Floquet topological insulator, Light-induced superconductivity"}, {"term": "tr-ARPES", "why_emerged": "펌프-프로브 기법을 결합하여 고체 내부 전자 구조의 초고속 동역학을 운동량 공간에서 직접 관찰하기 위해 개발되었습니다.", "origin": "1980-90년대 레이저 기술과 광전자 분광학의 결합으로 시작되었습니다.", "connections": "Ultrafast dynamics, Non-equilibrium physics"}, {"term": "Volkov states", "why_emerged": "강한 전자기장 속에서 자유롭게 가속되는 전자의 상태를 기술하기 위해 도입되었으며, ARPES에서는 시료 밖으로 방출된 광전자가 펌프광과 상호작용하는 배경 신호로 작용합니다.", "origin": "Dmitrii Volkov가 1935년에 이론적으로 제안했습니다.", "connections": "Laser-assisted photoelectric effect (LAPE)"}, {"term": "2H-NbSe2", "why_emerged": "전하 밀도파(CDW)와 초전도체가 공존하며 층상 구조를 가진 대표적인 전이금속 디칼코게나이드(TMD)로, 다체 물리 연구의 표준 물질입니다.", "origin": "초록 정보만으로는 특정하기 어려우나 1960-70년대부터 집중 연구되었습니다.", "connections": "Charge density wave, Ising superconductivity"}], "english_summary": ["Demonstrated Floquet dressing of bulk metallic bands in 2H-NbSe2 using tr-ARPES.", "Identified photon-shifted replicas that maintain the parent band dispersion during pump-probe overlap.", "Validated a Floquet-Volkov interference model to explain polarization-dependent intensity redistribution.", "Extends Floquet engineering from semiconductors/topological insulators to itinerant bulk states in metals."]}}, {"title": "ToF-PAX-RIXS: A Time-of-Flight Spectrometer for combined ARPES and RIXS", "journal": "arXiv_CondMat", "source": "keyword", "link": "https://arxiv.org/abs/2610.03993", "authors": "Chafic Fawaz, Tom Lacmannn, Yaryna Lytvynenko, et al.", "last_authors": "Hans-Joachim Elmers, Martin Beye", "summary": "We present ToF-PAX-RIXS, a compact instrument that combines time-of-flight momentum-microscopy angle-resolved photoemission spectroscopy (ARPES) with resonant inelastic X-ray scattering (RIXS). The latter is based on photoelectron spectrometry for analysis of X-rays (PAX). The two techniques are implemented with a single multimode electron-optical column, allowing measurements to be performed sequentially on the same sample under identical experimental conditions. In ARPES mode, the instrument records the photoemission intensity as a function of kinetic energy and two in-plane momentum components. In PAX-RIXS mode, scattered soft X-ray photons are absorbed in a thin metallic converter, and the generated photoelectrons are analyzed in energy and position of emission on the converter. The electron kinetic energy retains the spectral information of the scattered photons, while the position is related to the scattering angle and therefore to the momentum transfer, enabling simultaneous access to a finite momentum-transfer interval. We describe the mechanical design, converter assembly, scattering geometry, and multimode electron optics of the instrument. Its PAX-RIXS performance is benchmarked at the Cu $L_3$ edge using CaCuO$_2$, with Au, Ag, and Pt converters. The measured spectra reproduce the principal features obtained with a conventional grating RIXS spectrometer, and deconvolution yields an effective reconstructed energy resolution better than $120$~meV under the present conditions. Finally, combined ARPES and PAX-RIXS measurements on the same Ca-doped YBa$_2$Cu$_3$O$_{6.45}$ sample demonstrate the capability of the instrument to correlate electronic structure and collective excitations within a common compact platform.", "tier": "A_MUST_READ", "score": "10", "reason": "title strong match: ARPES", "tags": ["ARPES", "angle-resolvedphotoemission", "photoemission", "RIXS"], "image": "https://arxiv.org/html/2610.03993v1/MM_PEEM_v3.png", "briefing": {"background": "고체 물리 연구에서 전자 구조를 측정하는 ARPES와 집단적 여기(excitation)를 측정하는 RIXS는 서로 보완적인 정보를 제공합니다. 하지만 일반적으로 두 장비는 별개의 시스템으로 구축되어 있어, 동일한 샘플의 동일한 영역에서 두 데이터를 완벽하게 대응시키기 어려웠습니다.", "motivation": "하나의 전자 광학 시스템 내에서 ARPES와 RIXS를 동시에 수행할 수 있는 소형 장비를 개발하여, 전자 구조와 스핀/전하/격자 여기 사이의 상관관계를 보다 정밀하게 분석하고자 했습니다.", "result": "ToF-PAX-RIXS라는 새로운 장비를 개발했습니다. PAX(광전자 분광을 이용한 엑스선 분석) 기법을 사용하여 기존의 거대한 RIXS 분광기 없이도 콤팩트한 설계를 구현했으며, 시간 분해능이 있는 운동량 현미경(Momentum microscopy)을 결합해 시료의 전자 구조(ARPES)와 산란된 엑스선 정보(RIXS)를 순차적으로 측정하는 데 성공했습니다.", "implication": "단일 셋업에서 ARPES로 페르미면을 확인하고 RIXS로 보존적 여기(magnon, phonon 등)를 측정할 수 있게 되어, 고온 초전도체나 양자 자성체 연구에서 전자 구조와 상호작용 간의 인과관계를 밝히는 데 강력한 도구가 될 것입니다.", "novelty": "기존 RIXS의 거대한 회절 격자 분광기 대신 금속 컨버터를 이용한 PAX 방식을 채택하여 운동량 현미경과 통합했다는 점이 독창적입니다. 특히 독자님의 관심사인 RIXS와 ARPES를 한 번에 해결할 수 있는 실험적 진보입니다.", "unresolved": "현재 재구성된 에너지 분해능은 약 120 meV 수준으로, 최첨단 전용 RIXS 분광기(수십 meV 이하)에 비해 아직 낮아 미세한 여기 모드를 구분하는 데 한계가 있습니다.", "future_work": "컨버터 재질 최적화와 전자 광학계 개선을 통해 에너지 분해능을 높이고 , Pt) can generate an anomalous Hall effect (AHE) despite vanishing net magnetization, enabled by broken time-reversal and inversion symmetries. However, strong in-plane anisotropy has limited studies of the AFM-AHE and electronic applications to coplanar spin configurations. Non-coplanar spin textures in these systems have been realized only in low temperature spin-glass states or at interfaces with heavy metals. Here, we report an intrinsic non-coplanar spin configuration persisting up to 400 K in cubic-phase Mn3Ge, originating from coexisting symmetric and antisymmetric exchange interactions. Competing magnetic states associated with this non-coplanar spin configuration give rise to an unconventional AHE with a magnetic-field-induced sign reversal and a hump-like feature. Our findings establish a platform for non-coplanar magnetism in AFM spintronics.", "tier": "A_MUST_READ", "score": "9", "reason": "Direct hit: intrinsic non-coplanar spin textures and unconventional anomalous Hall in kagome Mn3Ge.", "tags": ["kagome", "anomalous-Hall", "Mn3Ge", "magnetism"], "image": "https://arxiv.org/static/browse/0.3.4/images/arxiv-logo-fb.png", "briefing": {"background": "반강자성체(AFM) 기반의 스핀트로닉스는 자성 노이즈가 적고 빠른 응답 속도를 가지나, 전압 제어 및 신호 생성이 어렵다는 난제가 있습니다.", "motivation": "카고메 격자 Mn3Ge에서 비공면(non-coplanar) 스핀 구조가 나타날 경우, 이를 통해 자성체임에도 강한 이상 홀 효과(AHE)를 구현하고 제어하고자 했습니다.", "result": "상온(400K)까지 유지되는 비공면 스핀 구조를 발견했으며, 이를 통해 외부 자기장에 의해 이상 홀 효과의 극성이 반전되는 현상을 확인했습니다.", "implication": "AFM 기반의 논리 소자나 비휘발성 메모리 개발에 있어서, 스핀 구조의 위상적 성질을 활용한 새로운 작동 원리를 제시합니다.", "novelty": "기존 Mn3Ge 연구가 주로 공면(coplanar) 구조에 집중된 반면, 이번 연구는 상온 비공면 구조를 직접 관측하고 제어함으로써 실용적 스핀트로닉스 가능성을 대폭 높였습니다.", "unresolved": "비공면 상태와 공면 상태 사이의 경쟁 메커니즘을 결정짓는 미세한 에너지 장벽이나 스핀-궤도 결합(SOC)의 상세 기여도는 추가 규명이 필요합니다.", "future_work": "이러한 비공면 스핀 구조가 실제 디바이스에서 전류에 의해 얼마나 효율적으로 스위칭될 수 있는지에 대한 후속 연구가 기대됩니다.", "concepts": [{"term": "비공면 스핀 구조", "why_emerged": "격자 구조와 자기 모멘트가 서로 다른 평면에 존재하여 스핀 텍스처를 형성, 위상적 홀 효과 등을 유도하기 위해.", "origin": "비자명한 베리 곡률을 연구 nfirm the presence and effects of inequivalent Sb sites for both the samples. In contrast to the T = Cu \\textit{T}=\\text{Cu} compound, which follows expected temperature-dependent core-level sharpening, the T = Ag T=\\text{Ag} compound exhibits an anomalous low-temperature broadening in the CDW phase. The analysis of Sb 3 d spectra suggests Sb square nets are linked to CDW phenomena in T = Ag compound. Temperature-dependent ultraviolet photoemission spectroscopic studies on T = Ag show a small decrement in spectral DOS at the ϵ F \\epsilon_{F} for the temperature below the CDW transition temperature. We believe that our core-level studies on these compounds will be valuable to the scientific community by providing a comparative understanding of the electronic structures of CDW and non-CDW systems, clarifying the role of local electronic environments in CDW formation, and establishing a spectroscopic benchmark for future studies of related quantum materials.", "tier": "A_MUST_READ", "score": "9", "reason": "Photoemission and transport study of CDW and Dirac fermions in Sb-based square net compounds.", "tags": ["photoemission", "LaTSb2", "CDW"], "image": "https://arxiv.org/html/2610.04290v1/Structure.png", "briefing": {"background": "안티모니(Sb) 기반의 사각형 격자 구조(square net)를 가진 화합물들은 전하밀도파(CDW)와 디락 페르미온의 상호작용이 일어나는 독특한 양자 물질 계열입니다. 이 계열은 위상학적 성질과 전자 상관관계 연구의 주요 플랫폼입니다.", "motivation": "LaTSb2(T=Cu, Ag) 시스템에서 Cu와 Ag의 차이에 따른 전자 구조 및 CDW 발현 기작을 자기저항과 광전자 분광법(PES)을 통해 비교 분석하고자 함.", "result": "Ag 화합물에서만 CDW 징후가 발견되었으며, Sb 사각형 격자가 CDW 형성에 결정적임을 확인했습니다. DFT+U 계산을 통해 Cu와 Ag의 d-오비탈 전자가 전자 구조에 미치는 영향을 규명했습니다.", "implication": "동일한 결정 구조 내에서 원소 치환을 통해 CDW 발생 여부를 제어할 수 있음을 보여주며, 향후 Sb 기반 양자 물질의 전자 구조 설계에 대한 기준점을 제공합니다.", "novelty": "CDW 시스템과 비-CDW 시스템의 전자 구조 차이를 체계적으로 비교했으며, 특히 코어 레벨 스펙트럼 분석을 통해 CDW 전이 시 발생하는 국소적인 전자 환경 변화를 관찰한 점이 돋보입니다.", "unresolved": "CDW 위상 내에서의 정확한 페르미 표면 재구성과 그에 따른 위상학적 특성 변화가 완벽히 규명되지 않았습니다.", "future_work": "저온 환경에서의 고분해능 ARPES를 통한 페르미 표면 갭 개구(gap opening) 관찰 및 더 넓은 범위의 전이 금속 치환 연구.", "concepts": [{"term": "Sb square net", "why_emerged": "사각형 격자 구조는 디락 점과 같은 위상학적 밴드 구조를 형성하기에 유리한 기하학적 환경을 제공함.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "ZrSiS, HfSiS 등 층상 안티모니드 계열"}, {"term": "Charge Density Wave (CDW)", "why_emerged": "전자와 격자 사이의 상호작용으로 인해 전하 밀도가 주기적으로 변조되는 바닥 상태를 설명하기 위함.", "origin": "Peierls, 1955", "connections": "AV3Sb5, NbSe3, 1T-TaS2 등"}, {"term": "DFT+U", "why_emerged": "표준 DFT가 강상관 전자계에서 d-오비탈의 국소화 및 전자 상관관계를 과소평가하는 문제를 보정하기 위함.", "origin": "Anisimov et al., 1991", "connections": "Hubbard 모델, LDA+U, 동역학적 평균장 이론(DMFT)"}], "english_summary": ["Comparative study of LaCuSb2 and LaAgSb2 using transport and PES.", "Ag-compound shows CDW signature linked to Sb square nets.", "DFT+U calculations reveal distinct local electronic environments for T=Cu vs T=Ag.", "Establishes a spectroscopic benchmark for Sb-based quantum materials."]}}, {"title": "Reply to \"Comment on 'Topography of Fermi arcs in t-PtBi2 using high-resolution angle-resolved photoemission spectroscopy'\"", "journal": "arXiv_CondMat", "source": "keyword", "link": "https://arxiv.org/abs/2610.02239", "authors": "Adam Kaminski, Paul C. Canfield, Benjamin Schrunk", "last_authors": "Paul C. Canfield, Benjamin Schrunk", "summary": "In a recent work [1] we demonstrated that the Fermi arcs in t-PtBi2 are indeed disconnected segments of the Fermi surface. We showed that the surface state band crosses EF between Weyl points and is has finite band gap at all other momenta until it merges with bulk bands. We did not find evidence of a superconducting gap in the spectra down to 3K. In recent Comment, Sergey Borisenko reanalyzed data from repository posted with our paper and concluded that a superconducting gap with i-wave symmetry is present in our data up to temperatures of 19K. We argue that this claim arises from incorrect identification of the location of Fermi arc and confusion between band gap and superconducting gap. This error was compounded by the fact that Author of the Comment analyzed data from interpolated images used for mapping the Fermi surface that are not suitable for extraction of energy gap on meV scale. This fact was previously communicated to the Author of the Comment during e-mail exchange. We maintain that our conclusion of absence of a superconducting gap above 3 K are valid and consistent with recent STM measurements performed on the same samples, which found surface superconductivity with Tc = 3K, below the temperature at which the data for our ARPES paper was measured.", "tier": "A_MUST_READ", "score": "9", "reason": "title strong match: angle-resolved photoemission", "tags": ["ARPES", "angle-resolvedphotoemission", "photoemission", "STM", "Weyl", "superconduct", "Fermisurface"], "image": "https://arxiv.org/html/2610.02239v2/fig1.png", "briefing": {"background": "위상학적 반금속 후보 물질로 알려진 t-PtBi2의 전자 구조와 초전도성 사이의 상관관계는 최근 학계의 주요 논쟁거리입니다.", "motivation": "저자들이 앞서 발표한 t-PtBi2의 ARPES 연구 결과에 대해 제기된 초전도성 갭 해석 관련 비판에 대해 반박하고 논리적 근거를 제시하기 위함.", "result": "제기된 비판이 Fermi arc의 위치 식별 오류와 밴드 갭을 초전도 갭으로 잘못 해석한 결과임을 논증하고, 3K 이상의 온도에서 초전도 갭이 없다는 원 저자의 결론을 재확인함.", "implication": "t-PtBi2의 물리적 특성을 해석할 때 ARPES 데이터 분석 시 밴드 구조의 고유한 gap과 초전도 gap을 명확히 구분해야 함을 시사함.", "novelty": "기존 연구자와 비판자 간의 데이터 분석 방식 차이를 공개적으로 다루어 실험 데이터 해석의 엄밀성을 강조함.", "unresolved": "초전도 전이 온도(Tc) 이하에서의 상세한 갭 구조와 벌크/표면 초전도성의 명확한 경계.", "future_work": "더 낮은 온도에서의 초고분해능 ARPES 측정 및 다양한 표면 처리 기법을 통한 데이터 품질 검증.", "concepts": [{"term": "Fermi Arc", "why_emerged": "Weyl 반금속에서 벌크의 Weyl 점을 잇는 비연속적인 표면 페르미 상태를 설명하기 위해 도입됨.", "origin": "Wan et al., 2011", "connections": "Weyl 반금속, TaAs, TaP"}, {"term": "i-wave symmetry", "why_emerged": "전통적인 s, p, d-wave와 다른, 특정 위상학적 화합물에서 제안되는 특이한 초전도 갭 대칭성을 일컬음.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "Unconventional superconductivity"}, {"term": "Superconducting gap", "why_emerged": "초전도 상태에서 페르미 준위 주변의 전자 상태 밀도가 사라지는 현상을 정의하기 위함.", "origin": "BCS 이론(Bardeen, Cooper, Schrieffer), 1957", "connections": "Eliashberg theory, ARPES spectroscopic signature"}], "english_summary": ["A rebuttal regarding the ARPES spectral analysis of t-PtBi2.", "Clarifies that Fermi arcs are disconnected surface states and no superconducting gap above 3K is observed.", "Attributes the contradictory claim to misinterpretation of spectral data and band gap vs superconducting gap confusion.", "Affirms consistency between ARPES results and recent STM measurements."]}}, {"title": "Significant modulation of acoustoelectric current associated with charge density wave transitions", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/19zf-xskg", "authors": "Natsumi Nikaido, Takuya Kawada, Koji Fujiwara, et al.", "last_authors": "Shintaro Takada, Yasuhiro Niimi", "summary": "How collective electronic order responds to strain remains a central question in quantum materials. Here, the authors find that charge density wave (CDW) transitions in NbSe 3 and 2 H -TaSe 2 strongly modulate the acoustoelectric current driven by surface acoustic waves. A simple phenomenological model based on strain-dependent conductivity captures the essential behavior. The work demonstrates acoustoelectric transport as a sensitive probe of CDW physics and opens new avenues for strain-based control of electronic states in van der Waals materials.", "tier": "B_IMPORTANT_CONDMAT", "score": "10", "reason": "Direct match for project interests: CDW transitions in NbSe3 and TaSe2 investigated via transport.; demoted from A: broad CM, not direct user/project hit", "tags": ["NbSe3", "TaSe2", "CDW", "transport"], "image": "", "briefing": {"background": "CDW 물질의 집단적 전자 상태는 온도와 압력에 민감하게 반응합니다. 이를 변형(strain)을 통해 제어하는 것은 양자 물질의 새로운 기능적 소자를 개발하는 데 핵심입니다.", "motivation": "표면 음향파(SAW)를 이용하여 NbSe3 및 2H-TaSe2의 CDW 상태를 변형시키고, 이에 따른 전류 변화를 측정하여 CDW 물리량을 탐색하고자 함.", "result": "변형에 따른 전기전도도 변화를 통해 CDW 전이가 음향전기 전류(acoustoelectric current)를 크게 변조함을 발견함.", "implication": "변형(strain)을 통한 동적 제어 기술이 양자 물질의 물성 조절 및 소자 응용에 매우 유효한 수단임을 증명함.", "novelty": "기존의 정적인 물리적 제어 방식에서 벗어나 SAW를 이용한 비파괴적, 동적인 방식으로 CDW 물성을 성공적으로 조절 및 측정함.", "unresolved": "변형의 크기가 임계치에 도달했을 때 발생하는 CDW 도메인 구조의 재배열 및 동역학적 특성.", "future_work": "다른 층상 물질로의 확장 및 변형에 의한 CDW 위상 전이의 실시간 영상화 기술 개발.", "concepts": [{"term": "Acoustoelectric current", "why_emerged": "표면 음향파의 전파로 인해 전자와 격자간의 상호작용으로 생성되는 전류를 측정하기 위함.", "origin": "Parmenter, 1953", "connections": "Surface Acoustic Waves(SAW), electron-phonon coupling"}, {"term": "NbSe3", "why_emerged": "매우 낮은 온도까지 CDW가 지속되며 준1차원적 성질을 보여 CDW 물성 연구의 표준 모델로 사용됨.", "origin": "Monceau et al., 1977", "connections": "Sliding CDW, Peierls transition"}, {"term": "Strain-based control", "why_emerged": "물질의 격자 구조를 미세하게 왜곡함으로써 전자 구조 및 상관관계를 능동적으로 제어하기 위함.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "Strain engineering, van der Waals materials"}], "english_summary": ["Investigation of strain response in CDW materials NbSe3 and 2H-TaSe2.", "Uses surface acoustic waves (SAW) to modulate acoustoelectric current.", "Phenomenological model links conductivity changes to CDW state modulation.", "Proposes acoustoelectric transport as a sensitive probe for CDW physics."]}}, {"title": "Protection of Unconventional Superconductivity from Disorder", "journal": "PRL_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/3cn5-hb8z", "authors": "Sofie Castro Holbæk, Morten H. Christensen, Andreas Kreisel, and Brian M. Andersen", "last_authors": "Sofie Castro Holbæk, Morten H. Christensen, Andreas Kreisel, and Brian M. Andersen", "summary": "Several realizations of d -wave superconductivity on the Lieb and kagome lattices exhibit remarkably weak T c -suppression, resembling the behavior of conventional s-wave superconductors.", "tier": "B_IMPORTANT_CONDMAT", "score": "10", "reason": "Direct relevance to kagome lattice superconductivity and unconventional materials of interest.; demoted from A: broad CM, not direct user/project hit", "tags": ["kagome", "unconventionalsuperconductivity"], "image": "", "briefing": {"background": "일반적으로 비전통 초전도체는 불순물에 의한 산란에 매우 취약하다고 알려져 있습니다(Anderson 정리의 위배). 카고메 격자 시스템에서도 유사한 논의가 진행되어 왔습니다.", "motivation": "카고메 및 Lieb 격자에서 나타나는 d-파 초전도성이 왜 불순물에 의한 Tc 억제 효과에 대해 기존 s-파 초전도체처럼 강한 내성을 보이는지 이론적 근거를 찾고자 함.", "result": "특정 격자 기하학적 구조가 불순물 존재 하에서도 초전도 질서 변수의 위상적 안정성을 강화하여 Tc의 급격한 감소를 방지할 수 있음을 보임.", "implication": "카고메 금속(AV3Sb5 등)의 초전도성이 비전통적임에도 불구하고 결함에 강할 수 있는 근본적인 이유를 설명하며, 물질 설계의 기준을 제시함.", "novelty": "비전통 초전도성의 '불순물 내성'을 기하학적 구조(격자 위상)와 결부시켜 설명한 점이 특징적이며, 이는 실제 실험에서 관찰되는 비정상적인 강건함을 이해하는 데 중요함.", "unresolved": "실제 실험적 불순물의 종류와 농도에 따른 미세한 차이를 정량적으로 완전히 규명하지는 못함.", "future_work": "실제 카고메 초전도체 샘플에서 의도적인 결함 도입을 통한 Tc 억제 실험 및 다중 밴드 효과 고려.", "concepts": [{"term": "d-wave superconductivity", "why_emerged": "상관관계가 강한 전자 시스템에서 스핀 흔들림(spin fluctuations)에 의한 쌍 결합을 설명하기 위해 도입.", "origin": "구리 산화물 고온 초전도체 연구를 통해 정립됨.", "connections": "고온 초전도체, 카고메 금속, 비전통적 초전도성."}, {"term": "Anderson Theorem", "why_emerged": "s-파 초전도체가 비자성 불순물에 대해 Tc가 거의 변하지 않는 현상을 설명하기 위해.", "origin": "P.W. Anderson (1959).", "connections": "비전통 초전도성, 불순물 산란 효과."}], "english_summary": ["Investigates the robustness of d-wave superconductivity against disorder in kagome and Lieb lattices.", "Shows that specific lattice geometry can protect the superconducting state from Tc suppression.", "Provides a theoretical framework to explain why some unconventional superconductors behave like conventional ones regarding impurity tolerance.", "Offers insights into the stability of superconductivity in kagome metals like AV3Sb5."]}}, {"title": "Proximity-induced charge density waves in a moir\\'e heterobilayer", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2609.15775", "authors": "Christopher T. S. Cheung, Arash A. Mostofi, Johannes Lischner", "last_authors": "Arash A. Mostofi, Johannes Lischner", "summary": "Twisted heterobilayers of two-dimensional materials have emerged as a platform for studying emergent phases of matter. In this work, we investigate charge density waves (CDW) in a twisted NbSe 2 /MoSe 2 bilayer using first-principles calculations. We observe CDW formation in both layers, even though MoSe 2 does not feature a CDW in its monolayer form. Moreover, we find that the CDW is highly non-uniform with different types of CDWs coexisting in the moiré unit cells of both layers. The amplitude of the CDW also varies in the moiré unit cell. We assess different mechanisms of CDW formation in the MoSe 2 layer and conclude that the dominant one is the steric repulsion between Se atoms across the van der Waals gap. The strength of this effect is highly sensitive to the stacking, explaining the moiré variation of the CDW amplitude. Furthermore, the amplitude of induced CDWs are amplified compared to that expected from untwisted bilayers. This is due to the localization of electrons in the low-energy stacking regions in the NbSe 2 layer. Our work demonstrates that novel broken-symmetry phases can be induced and enhanced in twisted heterobilayers through proximity effects.", "tier": "B_IMPORTANT_CONDMAT", "score": "10", "reason": "Direct hit: CDW in twisted NbSe2/MoSe2 bilayer, combining project materials and phenomena.; demoted from A: broad CM, not direct user/project hit", "tags": ["theory", "NbSe2", "CDW"], "image": "https://arxiv.org/html/2609.15775v2/kbm/a0=3.42/hol_paper.png", "briefing": {"background": "반데르발스 이종접합에서 층간 쌓임(stacking) 방식에 따라 전자적 물성이 획기적으로 변하는 모아레 물리학이 주목받고 있습니다.", "motivation": "모아레 격자 내의 국소적 환경 변화가 단일 층에서는 나타나지 않는 전하 밀도 파(CDW)를 유도하거나 증폭할 수 있는지 확인하고자 함.", "result": "NbSe2/MoSe2 뒤틀린 이종구조에서 기하학적 쌓임에 의한 층간 Se-Se 반발력이 MoSe2 층의 CDW 형성을 유도함을 밝힘.", "implication": "단일 층에서는 CDW가 없는 물질도 이종구조를 통해 새로운 대칭성 깨짐 위상으로 유도할 수 있음을 시사함.", "novelty": "CDW의 비균질성과 모아레 단위세포 내 국소적 전자 밀도 변조를 계산적으로 명확히 규명했으며, 근접 효과(proximity effect)를 통한 상 제어 가능성을 보여줌.", "unresolved": "저온 환경에서의 실제적인 전도도 변화나 위상적 특성이 실험적으로 충분히 검증되지 않음.", "future_work": "STM/STS를 이용한 모아레 단위세포 내 실제 CDW 공간 분포 측정 및 이종접합 밴드 엔지니어링.", "concepts": [{"term": "Moiré Superlattic y Fermion) 시스템과 깊은 연관."}, {"term": "Kagome MOF", "why_emerged": "기하학적 좌절을 가진 kagome 격자를 화학적 합성을 통해 구현하여 강한 상관관계를 유도하기 위해 필요.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "kagome 금속(AV3Sb5), 양자 스핀 액체 연구와 연결."}], "english_summary": ["Atomic-scale mechanical control of Kondo coupling is achieved in a 2D kagome MOF.", "The vertical position of the MOF relative to the Ag(111) substrate modulates the Kondo screening strength.", "This approach demonstrates reversible tuning of Mott insulating and Kondo-screened states.", "The result offers a pathway for designing spintronic devices via direct atomic-scale manipulation."]}}, {"title": "Modulation of Spin-Orbit Coupling, Spin Textures, and Rashba-Edelstein Response in Chiral Tellurium: A First-Principles Study", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2503.01685", "authors": "Sonam Phuntsho", "last_authors": "Sonam Phuntsho", "summary": "Chiral semiconductors such as elemental tellurium (Te) exhibit unconventional spin textures and large charge-to-spin conversion efficiencies, yet the influence of introducing elements on these properties remains underexplored. Here, we address this gap by investigating how substituting Te with lighter (S, Se) or heavier (Sb) elements systematically modifies the spin-orbit-driven phenomena in chiral Te, including the band structure, spin Berry curvature, and Rashba-Edelstein response. The objective is to determine whether elemental substitution strategies can be leveraged to optimize collinear spin textures, enhance spin accumulation, and possibly extend spin lifetimes all crucial aspects for magnet-free spintronics. Using density functional theory calculations implemented in Quantum ESPRESSO, combined with tight-binding interpolation in PAOFLOW, we map out the element-dependent electronic states and quantify their associated spin transport coefficients. Our findings reveal that lighter elements shift the Fermi level to regions of pronounced spin splitting, thereby increasing the magnitude of spin-current conversion, whereas heavier elements can introduce or remove near-degenerate bands that strongly affect spin-orbit coupling. In both scenarios, the fundamental chirality of Te remains robust, preserving the radial or ''collinear'' spin-momentum locking. These results not only confirm that introducing elements is a potent and feasible route for tuning spin-orbit phenomena but also offer practical guidelines for experimental efforts aiming to engineer chiral semiconductors for spin devices. By correlating element identity with specific spin-texture enhancements, this study paves the way for rationally designing next-generation spintronic components free from external magnetic fields.", "tier": "B_IMPORTANT_CONDMAT", "score": "9", "reason": "DFT study of spin textures and band structure in chiral Te/Se/Sb, highly relevant to ARPES.", "tags": ["theory", "material", "bandstructure"], "image": "https://arxiv.org/static/browse/0.3.4/images/arxiv-logo-fb.png", "briefing": {"background": "카이랄(chiral) 반도체는 결정 구조의 대칭성 파괴로 인해 독특한 스핀-궤도 결합(SOC)과 스핀 질감을 가지며, 이는 차세대 스핀트로닉스 응용의 핵심 요소입니다.", "motivation": "카이랄 텔루륨(Te)에 다른 원소들을 치환했을 때, 이들의 스핀 질감과 Rashba-Edelstein 응답이 어떻게 변화하는지 체계적으로 분석하여 최적의 소재 설계 가이드라인을 확보하고자 함.", "result": "가벼운 원소 치환은 Fermi 준위를 조절하여 스핀 전류 변환 효율을 높이고, 무거운 원소는 밴드 축퇴도를 변화시켜 SOC 강도를 제어함을 확인함. 카이랄 대칭성은 치환 후에도 강건하게 유지됨.", "implication": "자기장 없이도 효율적인 스핀 변환이 가능한 카이랄 소재를 원소 치환을 통해 설계할 수 있는 실무적 지침을 제시함.", "novelty": "단순한 계산을 넘어 원소 조합에 따른 스핀 텍스처 변화를 체계적으로 매핑하여 실험적 접근성을 높임. ARPES를 통해 밴드 구조와 스핀 질감을 확인하려는 연구자들에게 유용한 DFT 예측 자료가 될 것임.", "unresolved": "다양한 치환 원소들이 실제 합성 과정에서 결정성에 미치는 영향과 결함에 의한 물성 저하 문제는 추가 연구가 필요함.", "future_work": "예측된 원소 조합의 실제 박막 합성 및 ARPES를 통한 스핀 질감 측정 검증.", "concepts": [{"term": "Rashba-Edelstein 효과", "why_emerged": "스핀-궤도 결합을 가진 계면이나 소재에서 전류를 흘렸을 때 스핀 편극이 유도되는 현상을 이해하기 위해 필요.", "origin": "Rashba (1960년), Edelstein (1990년).", "connections": "스핀-궤도 토크(SOT), 위상 절연체 표면 상태와 연관."}, {"term": "스핀 베리 곡률", "why_emerged": "운동량 공간에서 전자들의 스핀 상태가 기하학적으로 어떻게 분포하는지 정량화하기 위해 도입.", "origin": "Berry (1984년), 응집물질물리 분야로 확장.", "connections": "이상 홀 효과(AHE), 비정상 홀 전도와 밀접."}], "english_summary": ["DFT study of element substitution in chiral tellurium to tune spin-orbit coupling.", "Lighter elements enhance spin-current conversion by shifting the Fermi level.", "Heavier elements modulate spin-orbit coupling via band degeneracy changes.", "The intrinsic chirality and collinear spin-momentum locking remain robust upon substitution.", "Provides guidelines for designing magnet-free spintronic materials."]}}, {"title": "Paramagnon softening upon doping in oxychloride cuprate superconductors", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2610.05160", "authors": "Chafic Fawaz, L\\'eo Gaspard, Laura Chaix, et al.", "last_authors": "Benjamin Lenz, Matteo d'Astuto", "summary": "Understanding how magnetic excitations and exchange interactions evolve with doping is crucial for deciphering the physics that shapes the phase diagram of high-temperature cuprate superconductors. Here, we clearly determine the behavior of the paramagnon dispersion in the oxychloride cuprate Na$_{x}$Ca$_{2-x}$CuO$_2$Cl$_2$ up to the highest doping level. We find that the paramagnon bandwidth, defined by the energy at the $X$ zone boundary $(0.5,0,0)$, remains unchanged within experimental uncertainty, even though it exhibits significant broadening. In contrast, along the nodal direction $\\Gamma-M$ (\\textit{i.e.}, from $(0,0,0)$ to $(0.5,0.5,0)$), the paramagnon energy shows a marked softening with doping, with a shift of up to $\\Delta E\\sim150$ meV at the midpoint of the zone for the highest doping, which is about half of its initial value in the antiferromagnetic phase. Calculations of the dynamical spin structure factor for a one-band Hubbard model, including hopping terms up to the third-nearest neighbor ($t^{\\prime\\prime}$), explain this behavior and accurately reproduce the observed wave vector dependence and directional variation in the Brillouin zone.", "tier": "B_IMPORTANT_CONDMAT", "score": "9", "reason": "Experimental paramagnon dispersion in cuprates; highly relevant to user interest in spectroscopy and unconventional superconductivity.", "tags": ["RIXS", "cuprates", "superconductivity"], "image": "https://arxiv.org/html/2610.05160v1/structure.png", "briefing": {"background": "고온 초전도체인 구리 산화물(Cuprates)에서 마그논(magnon)과 파라마그논(paramagnon)은 전자 쌍 형성의 매개체로 의심받으며, 이들의 에너지가 도핑에 따라 어떻게 변화하는지를 밝히는 것이 고온 초전도 메커니즘 규명의 핵심입니다.", "motivation": "Na-doped 구리 산화물(Na_xCa_2-xCuO_2Cl_2)에서 도핑 농도가 증가함에 따라 파라마그논 분산 관계가 어떻게 변하는지 정량적으로 측정하고자 함.", "result": "파라마그논의 대역폭은 유지되지만, nodal 방향(Gamma-M)에서 에너지가 크게 낮아지는(softening) 현상을 발견함. 이는 Hubbard 모델 계산 결과와 잘 부합함.", "implication": "도핑에 따른 스핀 들뜸 에너지의 변화가 전자 상관관계 모델(Hubbard 모델) 내에서 잘 설명됨을 확인하여, 초전도 메커니즘 연구의 정당성을 뒷받침함.", "novelty": "RIXS를 사용하여 고도핑 영역까지 파라마그논의 변화를 추적했다는 점이 중요함. 특히 nodal 방향의 softening은 초전도와 스핀 자유도 간의 강력한 결합을 시사함.", "unresolved": "파라마그논 분산의 softening이 고온 초전도 전이 온도(Tc)의 구체적인 크기에 기여하는 직접적인 관계는 여전히 해석의 여지가 있음.", "future_work": "다른 도핑 범위와 다른 종류의 구리 산화물에서의 비교 연구를 통한 보편적 법칙 확립.", "concepts": [{"term": "파라마그논(Paramagnon)", "why_emerged": "반강자성 질서가 사라진 영역에서도 존재하는 자기 들뜸(magnetic excitation)을 기술하기 위해 필요.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "스핀 액체, 고온 초전도에서의 쿠퍼 쌍 매개체 후보."}, {"term": "RIXS", "why_emerged": "공명 X-선 산란을 통해 물질의 에너지, 운동량, 편극 정보를 한 번에 얻어 다체 물성을 연구하기 위해 개발.", "origin": "Ament et al. (2011년 리뷰로 대중화).", "connections": "중성자 산란(INS)과 상호보완적이며, 최근 구리 산화물 연구의 주력 장비."}], "english_summary": ["Investigated paramagnon dispersion in Na-doped oxychloride cuprates using RIXS.", "Paramagnon bandwidth remains constant, but nodal softening is significant at high doping.", "Observed energy softening aligns with theoretical predictions from the one-band Hubbard model.", "Supports the understanding of evolution of magnetic interactions in high-Tc superconductors."]}}, {"title": "Relaxation-driven flat bands and topology in moir\\'e transition metal dichalcogenide heterobilayers", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2608.08917", "authors": "Mitchell Luskin, Max Geier, Liang Fu, Ziyan Zhu", "last_authors": "Liang Fu, Ziyan Zhu", "summary": "Moir\\'e transition metal dichalcogenide (TMD) heterobilayers are commonly modeled by a continuum theory that yields topologically trivial bands, in contrast to their homobilayer counterparts which host topological bands and fractional Chern insulators (FCI). We show this conclusion is an artifact of neglecting the pseudomagnetic field generated by lattice relaxation, an effect intrinsic to every moir\\'e material. We develop a continuum model that resolves relaxation into three channels: a modified moir\\'e potential with higher Fourier harmonics, a pseudoelectric (scalar deformation) potential, and a pseudomagnetic (vector) potential. Using WSe$_2$/WS$_2$ as a prototype, we find that the pseudomagnetic field alone gaps the third and fourth valence bands with Chern numbers $\\pm 1$ over a broad range of twist angle and lattice mismatch, while the moir\\'e potential correction and pseudoelectric potential narrow the bandwidth and enhance the bandgaps, which survive many-body interactions using neural-network variational Monte Carlo calculations. Relaxation also smoothens the Berry curvature and quantum metric relative to the rigid model, moving the band closer to the ideal Chern limit, beneficial for the quantum anomalous Hall effect, FCI states, and flat-band superconductivity when filled to higher bands. Our work establishes a new framework that connects first-principles calculations, through the continuum model, to many-body observables. Using this framework, we show moir\\'e heterobilayers as a new class of topological materials whose topology is driven entirely by intrinsic lattice relaxation.", "tier": "B_IMPORTANT_CONDMAT", "score": "9", "reason": "Study of Berry curvature and topological bands in moiré TMDs, highly relevant to user's 2D heterostructure interests.; demoted from A: broad CM, not direct user/project hit", "tags": ["theory", "WSe2/WS2", "moiré"], "image": "https://arxiv.org/html/2608.08917v2/fig1_schematic.png", "briefing": {"background": "모아레(Moiré) TMD 헤테로구조는 강력한 상관관계 물리와 위상학적 현상을 연구하는 플랫폼으로 주목받고 있습니다. 그러나 기존 연속체 모델은 실험적으로 관측되는 위상학적 특성을 설명하는 데 한계가 있었습니다.", "motivation": "기존 모델이 TMD 헤테로구조에서 위상학적 밴드를 과소평가하는 원인을 찾고, 격자 이완 효과가 시스템의 위상학적 상태에 미치는 영향을 규명하고자 합니다.", "result": "격자 이완에 의한 유사 자기장(pseudomagnetic field) 효과를 모델에 통합함으로써, WSe2/WS2와 같은 헤테로구조에서 위상학적 자명(trivial) 상태가 아닌 Chern 수 ±1을 갖는 위상학적 밴드가 형성됨을 보였습니다.", "implication": "TMD 헤테로구조가 격자 이완만으로도 위상학적 밴드를 가질 수 있음을 입증하며, 양자 이상 홀 효과 및 분수 Chern 절연체(FCI) 연구를 위한 새로운 설계 원리를 제공합니다.", "novelty": "격자 이완 효과를 무시했던 기존 모델의 결함을 수정하고, 밴드 구조와 위상학적 성질을 결정짓는 핵심 기제로 '격자 이완'을 새롭게 정립했습니다.", "unresolved": "실제 실험적 밴드 구조와 이론적 예측 사이의 미세한 정량적 차이는 여전히 존재하며, 다양한 적층 구조에서의 일반화가 필요합니다.", "future_work": "Neural-network VMC를 넘어서는 고도화된 다체 물리 계산 및 실제 ARPES 실험을 통한 밴드 위상학 직접 관측이 요구됩니다.", "concepts": [{"term": "Pseudomagnetic field", "why_emerged": "격자 변형이 전자의 궤도 운동에 미치는 효과를 자기장과 유사한 게이지 필드로 기술하기 위해 도입됨.", "origin": "그래핀의 변형 물리학 연구에서 정립됨.", "connections": "변형 공학(Strain engineering), Berry 곡률, 모아레 물리."}, {"term": "Fractional Chern Insulator", "why_emerged": "분수 양자 홀 효과의 격자 버전으로, 외부 자기장 없이 위상학적 평탄 밴드에서 발생하는 다체 상태를 찾기 위해 필요함.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "양자 이상 홀 효과, 모아레 평탄 밴드, 위상학적 상태."}], "english_summary": ["Moiré TMD heterobilayers are modeled to include lattice relaxation effects.", "Lattice relaxation generates pseudomagnetic fields that drive topological band formation.", "WSe2/WS2 is shown to support Chern bands due to intrinsic relaxation, not just rigid potential.", "The model connects DFT, continuum mechanics, and many-body physics for topological TMDs."]}}, {"title": "Strong metamagnetic switching and anisotropic magnetotransport in the distorted kagome magnet Tb6Ti4Al43", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2610.06732", "authors": "Lipika, Sneh, Shobha Singh, et al.", "last_authors": "Rie Umetsu, Kaustuv Manna", "summary": "We report a comprehensive investigation of the magnetic, electrical, and thermodynamic properties of single crystalline Tb6Ti4Al43, in which Tb atoms form a distorted kagome lattice embedded within a complex Ti-Al framework. Tb6Ti4Al43 exhibits pronounced magnetic anisotropy and antiferromagnetic ordering at approximately 19 K. For magnetic field applied along the c-axis, a strong metamagnetic switching is observed, accompanied by a clear asymmetric hysteresis at low temperatures, while for field applied along the ab plane, a spin-flop transition is observed. The effect of field induced magnetic states is strongly reflected in magnetotransport measurements, giving rise to pronounced anomalies in magnetoresistance and an anomalous Hall contribution. A significant intrinsic contribution to the anomalous Hall conductivity is observed, highlighting the Berry curvature effects arising from the system's momentum-space topology. Our results highlight the interplay of spin, charge, and lattice degrees of freedom in Tb6Ti4Al43 and establish this distorted kagome antiferromagnet as a promising platform for field-tunable multifunctional behaviour, including electrically readable magnetic switching, spin manipulation, and magneto-mechanical functionalities.", "tier": "B_IMPORTANT_CONDMAT", "score": "9", "reason": "Kagome lattice, Berry curvature/anomalous Hall, and metamagnetism; direct relevance to user profile.", "tags": ["kagome", "anomalous_hall", "Berry_curvature", "transport"], "image": "https://arxiv.org/html/2610.06732v1/fig1.jpg", "briefing": {"background": "카고메 격자 시스템은 전자 간의 강한 상관관계와 위상학적 밴드 구조가 만나는 지점으로, 이상 홀 효과와 같은 특이한 수송 현상이 활발히 연구되고 있습니다.", "motivation": "Tb6Ti4Al43이라는 새로운 화합물의 자기적 구조와 수송 특성 사이의 상관관계를 조사하고, 왜곡된 카고메 격자가 위상학적 물성에 미치는 영향을 분석하고자 합니다.", "result": "c축 방향의 강력한 메타자기적 스위칭과 ab면의 스핀-플롭 전이를 확 neration in Dirac altermagnets through Klein tunneling", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/1gzp-yq6h", "authors": "Tomas T. Osterholt, Lumen Eek, Cristiane Morais Smith, Rembert A. Duine", "last_authors": "Cristiane Morais Smith, Rembert A. Duine", "summary": "Altermagnets have recently emerged as a new platform for spintronics applications, offering spin-split electronic bands despite vanishing net magnetization. Here, we investigate spin-current generation in Dirac altermagnets and identify Klein tunneling as an efficient mechanism for enhancing spin tr…", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Relevant theoretical study of Dirac physics and spin transport in altermagnets.", "tags": ["theory", "altermagnet", "Diracsemimetal"], "image": "", "briefing": {"background": "알터마그넷(Altermagnet)은 순자화(net magnetization)가 0임에도 불구하고 시간 반전 대칭성이 깨져 있어 운동량 의존적 스핀 분할(spin-splitting)이 나타나는 새로운 자기 질서 상태입니다. 이는 기존의 강자성체와 반강자성체의 장점을 모두 가진 차세대 스핀트로닉스 재료로 주목받고 있습니다.", "motivation": "디락 알터마그넷 시스템에서 클라인 터널링(Klein tunneling) 현상이 스핀 전류 생성 효율에 미치는 영향을 규명하고자 합니다.", "result": "디락 알터마그넷 구조에서 클라인 터널링을 이용해 스핀 전류 생성을 효과적으로 증폭시킬 수 있음을 이론적으로 입증했습니다.", "implication": "알터마그넷 기반의 저전력 스핀트로닉스 소자 설계에 있어 중요한 물리적 메커니즘을 제공하며, 토폴로지 물질의 수송 특성 제어 가능성을 시사합니다.", "novelty": "알터마그넷의 고유한 스핀 분할 특성과 디락 반금속의 상대론적 전자 특성을 결합하여 스핀 전류 효율을 최적화한 점이 핵심입니다.", "unresolved": "실제 실험적 재료에서 클라인 터널링을 제어하기 위한 포텐셜 장벽 형성의 정밀도 문제가 남아 있습니다.", "future_work": "다양한 디락 알터마그넷 후보 물질에서의 실험적 검증 및 복잡한 격자 구조에서의 스핀 전류 투과율 연구가 필요합니다.", "concepts": [{"term": "알터마그넷", "why_emerged": "기존 강자성체의 누설 자기장 문제와 반강자성체의 스핀 제어 어려움을 동시에 극복하기 위해 등장.", "origin": "최근 수년간의 이론적 발견으로 확립됨 (예: Mazin et al., 2021).", "connections": "반강자성 스핀트로닉스, 베리 곡률, 비전통적 자성체."}, {"term": "클라인 터널링", "why_emerged": "상대론적 디락 입자가 포텐셜 장벽을 100% 투과하는 현상을 이해하기 위해 필요.", "origin": "Oskar Klein (1929).", "connections": "그래핀의 전자 수송, 토폴로지 절연체 표면 상태."}, {"term": "디락 반금속", "why_emerged": "선형 분산 관계를 갖는 준입자가 위상학적 특성을 보이기 때문.", "origin": "Young et al. (2012) 등.", "connections": "바일 반금속, 베리 위상, 토폴로지 물질."}], "english_summary": ["Altermagnets exhibit spin-split bands without net magnetization.", "The study focuses on enhancing spin-current generation using Klein tunneling in Dirac altermagnets.", "Results show that Klein tunneling effectively boosts spin transport in these systems.", "This mechanism offers a path for low-power spintronic devices."]}}, {"title": "Phonon-renormalized noncollinear RKKY interaction in Rashba altermagnets", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/9yd4-qyzj", "authors": "Bui D. Hoi", "last_authors": "Bui D. Hoi", "summary": "Altermagnets, characterized by time-reversal symmetry breaking without net magnetization and momentum-dependent spin-split bands, offer a promising platform for spintronics due to their anisotropic spin textures and potential for tunable magnetic interactions. Here, we theoretically investigate the …", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Theoretical investigation of magnetic interactions in altermagnets, a high-interest material class.", "tags": ["theory", "altermagnet", "magnetism"], "image": "", "briefing": {"background": "알터마그넷은 시간 반전 대칭성을 깨뜨리면서도 순자화가 없는 독특한 자기 구조를 가져, 스핀 의존적 수송 현상과 자기적 상호작용의 비등방성을 연구하는 최전선 분야입니다.", "motivation": "알터마그넷 내부에서 나타나는 라쉬바(Rashba) 효과와 스핀 분할이 격자 진동인 포논과 결합하여 RKKY(Ruderman-Kittel-Kasuya-Yosida) 상호작용을 어떻게 변형시키는지 이론적으로 규명하고자 합니다.", "result": "포논이 알터마그넷의 자기적 상호작용에 기여하여 비공선형(noncollinear) RKKY 상호작용을 재규격화함을 밝혔습니다.", "implication": "알터마그넷의 자기 질서 안정성 및 스위칭 특성을 포논 엔지니어링을 통해 제어할 수 있는 가능성을 제시합니다.", "novelty": "단순 전자 모델을 넘어 포논과의 상호작용을 고려하여 RKKY 상호작용의 비등방성을 설명했다는 점에서 이론적 깊이가 큽니다.", "unresolved": "포논 결합 강도에 따른 상호작용 변화를 실제 알터마그넷 물질에서 정량적으로 측정하는 방법은 미완성입니다.", "future_work": "구체적인 알터마그넷 후보군(예: RuO2, MnTe)에 대한 포논 스펙트럼 분석 및 자기 교환 에너지 계산.", "concepts": [{"term": "RKKY 상호작용", "why_emerged": "금속 내 전도 전자들이 국소 자기 모멘트 사이의 매개체 역할을 하여 발생하는 자기적 결합을 설명하기 위해 도입.", "origin": "Ruderman, Kittel, Kasuya, Yosida (1954).", "connections": "희토류 금속 자성, GMR(거대 자기저항), 금속-절연체 전이."}, {"term": "라쉬바 효과", "why_emerged": "구조적 반전 대칭성이 깨진 시스템에서 스핀-궤도 결합에 의한 밴드 분할을 기술하기 위해 필요.", "origin": "Rashba (1960).", "connections": "스핀-궤도 토크(SOT), 토폴로지 절연체 표면 상태."}], "english_summary": ["Altermagnets possess unique anisotropic spin textures despite zero net magnetization.", "This study investigates phonon-renormalized RKKY interactions within Rashba altermagnets.", "The theory reveals that phonons significantly modify noncollinear magnetic coupling.", "Findings suggest potential for phonon-mediated control of altermagnetic orders."]}}, {"title": "Spin-density wave of ferrimagnetic building blocks masking the ferromagnetic quantum critical point in NbFe2", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/lcrw-ptwv", "authors": "T. Poulis, G. Mani, J. Sturt, W. J. Duncan, H. Thoma, V. Hutanu, et al.", "last_authors": "A. Neubauer, C. Pfleiderer, F. M. Grosche, and P. G. Niklowitz", "summary": "Ferromagnetic quantum critical points can be masked by emerging modulated magnetic order. Here, the authors use neutron diffraction to show that the example of NbFe 2 provides the first case, where the masking modulated order is a longitudinal spin-density wave. The latter has a large-wavelength incommensurate modulation of its low average moment and is formed from ferrimagnetic building blocks with antiparallel ferromagnetic sheets. The findings can serve as a test case for magnetic quantum order-by-disorder models.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Neutron scattering study of quantum criticality in an interesting metallic system.", "tags": ["neutronscattering", "quantumcriticality", "magnetism"], "image": "", "briefing": {"background": "강자성 양자 임계점(ferromagnetic QCP) 근처에서 자기 모멘트가 변조된 상태가 형성되면 진정한 양자 임계성을 가리는 현상이 나타납니다. 이를 이해하는 것은 상관 전자계 물리에서 핵심적인 난제입니다.", "motivation": "NbFe2 물질에서 관찰되는 강자성 임계 거동이 왜 예상과 다르게 나타나는지, 그 배후에 숨겨진 자기 질서를 규명하고자 합니다.", "result": "중성자 회절 분석을 통해 NbFe2의 강자성 QCP가 종방향 스핀 밀도 파동(longitudinal spin-density wave)에 의해 마스킹되고 있음을 확인했습니다.", "implication": "자기 순서가 단순 강자성에서 변조된 상태로 전환되는 과정이 양자 임계 현상의 해석을 어떻게 바꾸는지 보여주며, order-by-disorder 모델의 검증 사례를 제공합니다.", "novelty": "페리자성 빌딩 블록에서 기인한 인커멘수레이트(incommensurate) 구조를 입증하여 강자성 금속의 물리적 이해를 심화했습니다.", "unresolved": "해당 스핀 밀도 파동이 왜 저온에서 강자성보다 우세하게 나타나는지에 대한 미시적 메커니즘은 추가 연구가 필요합니다.", "future_work": "압력이나 도핑을 통해 스핀 밀도 파동과 강자성 상태 사이의 상도(phase diagram)를 더 정밀하게 제어하는 연구.", "concepts": [{"term": "스핀 밀도 파동 (SDW)", "why_emerged": "전도 전자들이 주기적인 스핀 정렬을 형성하여 바닥 상태 에너지를 낮추는 현상을 설명하기 위해 도입.", "origin": "Overhauser (1962).", "connections": "크로뮴(Cr), 고온 초전도체(cuprates), 페르미 표면 중첩."}, {"term": "강자성 양자 임계점", "why_emerged": "절대 영도에서 자기적 위상 전이가 일어날 때 나타나는 비페르미 액체 거동을 이해하기 위해 필요.", "origin": "Hertz-Millis-Moriya 이론으로 체계화됨.", "connections": "중중 페르미온 시스템, 비전통적 초전도성."}, {"term": "Order-by-disorder", "why_emerged": "유효 모델에서 축퇴된 상태들이 양자 혹은 열적 요동에 의해 하나의 질서 상태로 선택되는 과정을 기술.", "origin": "Villain et al. (1980).", "connections": "기하학적 좌절(frustration), 이징 모델."}], "english_summary": ["Ferromagnetic QCPs are often obscured by modulated magnetic orders.", "Neutron diffraction shows NbFe2 is masked by a longitudinal spin-density wave.", "The order arises from ferrimagnetic building blocks with incommensurate modulation.", "This study serves as a critical test case for order-by-disorder models."]}}, {"title": "Unconventional spin-valve effect in altermagnets induced by Rashba spin-orbit coupling and triplet superconductivity", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/9my8-21z2", "authors": "Saumen Acharjee, Aklanta Dihingia, Nayanav Sonowal, Abyoy Anan Kashyap", "last_authors": "Nayanav Sonowal, Abyoy Anan Kashyap", "summary": "We theoretically investigate spin-dependent transport in altermagnet/triplet-superconductor/altermagnet (AM/TSC/AM) junctions in the presence of interfacial Rashba spin-orbit coupling (RSOC). Within a microscop "Ferrovalley Order", "why_emerged": "특정 물질에서 밸리 간의 에너지 축퇴가 깨져 자발적인 밸리 편극이 일어나는 현상을 이용하기 위해 도입됨.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "밸리트로닉스, Berry 곡률, 비정상 홀 효과."}, {"term": "Orbital Hall Effect", "why_emerged": "스핀뿐만 아니라 궤도 각운동량의 수송이 물질의 물리적 성질에 중요한 역할을 한다는 점을 규명하기 위해 등장.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "스핀 홀 효과, 스핀-궤도 결합, 궤도 토크."}], "english_summary": ["Proposed a method to switch between spin and orbital Hall currents in a single system.", "Utilizes ferrovalley order to break the entanglement caused by spin-orbit coupling.", "Provides a path toward highly controllable spintronic and valleytronic devices.", "Demonstrates the role of topological Berry curvature in modulating transverse currents."]}}, {"title": "Nonmonotonic scaling of the anomalous Hall effect in a bicollinear antiferromagnet", "journal": "Science_Advances", "source": "Gemini", "link": "https://www.science.org/doi/abs/10.1126/sciadv.aef9859?af=R", "authors": "Ruifeng Wang, Chi Fang, Ilya Kostanovski, et al.", "last_authors": "Naoto Nagaosa, Stuart S. P. Parkin", "summary": "An anomalous Hall effect (AHE) in antiferromagnetic (AF) systems without net magnetization is of considerable interest for fundamental physics and spintronic applications. Of particular interest is the two-dimensional van der Waals antiferromagnet iron telluride (FeTe), which has an unusual magnetically compensated bicollinear AF structure and claimed Kondo interactions that cause strong band renormalization. Here, we investigate the AHE in epitaxial FeTe thin films grown by molecular beam epitaxy. A large anomalous Hall conductivity is exhibited below the Néel temperature ( T N ∼ 60 kelvins) and, notably, becomes nonlinear at high magnetic fields within a narrow temperature window around 49 kelvins, deviating from conventional AHE scaling behavior versus the longitudinal conductivity. The accompanying field-induced canted magnetic moment activates these AHE responses by tuning the Berry curvature derived from FeTe’s topological band structure once the zero-field symmetry constraint is lifted. The unconventional scaling of AHE highlights the intricate interplay between antiferromagnetism, topology, and electronic transport in FeTe.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Relevant topological magnetism and transport in a magnetic material system.", "tags": ["magnetism", "topological", "Hall_effect"], "image": "", "briefing": {"background": "반강자석(AFM)에서의 비정상 홀 효과(AHE)는 순자화값이 0임에도 불구하고 Berry 곡률의 비대칭성에 의해 나타나며, 차세대 스핀트로닉스의 핵심 연구 분야입니다.", "motivation": "철 텔루라이드(FeTe)의 이중 선형(bicollinear) 반강자성 구조에서 발생하는 홀 효과의 이상 스케일링 거동과 그 물리적 원인을 규명하고자 했습니다.", "result": "49K 부근에서 자기장 유도에 의한 이중 선형 자기 구조의 변형(canted moment)이 Berry 곡률을 재조정하여 홀 효과가 비선형적으로 변하는 현상을 규명했습니다.", "implication": "AFM 물질에서 자기 구조의 미세한 변화가 어떻게 위상학적 수송 특성을 극적으로 변화시키는지 증명하였으며, 이는 위상 자기 물질 설계에 가이드라인을 제공합니다.", "novelty": "전형적인 AHE 스케일링을 따르지 않는 FeTe 박막의 비단조적(nonmonotonic) 거동을 자기 대칭성 깨짐과 Berry 곡률의 상호작용으로 명확히 설명했습니다.", "unresolved": "49K 근처의 좁은 온도 범위에서만 나타나는 특이 거동의 열역학적 안정성 및 다른 반강자석 물질로의 일반화 여부.", "future_work": "다양한 외부 스트레인(strain)을 통한 자기 구조 조절 및 홀 응답 극대화 연구.", "concepts": [{"term": "Bicollinear Antiferromagnet", "why_emerged": "FeTe와 같은 철 기반 화합물의 독특한 자기적基상태를 분류하고 그에 따른 전자 구조 특성을 이해하기 위해 필요.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "철 기반 초전도체, 자기 정렬, 위상 밴드 구조."}, {"term": "Berry Curvature", "why_emerged": "결정 격자의 대칭성과 위상적 성질이 전자의 수송 특성에 미치는 기하학적 위상(Phase)을 설명하기 위해 등장.", "origin": "Michael Berry (1984년)", "connections": "비정상 홀 효과, 위상 불변량, Bloch 전자."}], "english_summary": ["Investigated nonmonotonic anomalous Hall effect scaling in FeTe antiferromagnetic thin films.", "Identified that field-induced canted magnetic moments tune the Berry curvature.", "Highlights the interplay between antiferromagnetic symmetry breaking and topological electronic transport.", "Demonstrates a deviation from conventional scaling laws near the Néel temperature."]}}, {"title": "A thermodynamic reference for field-induced phenomena in -RuCl3: two coexisting polymorphs account for multiple magnetic phase transitions", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2605.13444", "authors": "Hamza Nasir, Daniel Balazs, Muhammad Nauman, et al.", "last_authors": "Young-June Kim, K. A. Modic", "summary": "The majority of research on $\\alpha$-RuCl$_3$ has focused on applying in-plane magnetic fields to suppress the antiferromagnetic order and induce a quantum spin liquid (QSL). However, interpreting field-induced phenomena has been complicated by the material's temperature- and sample-size-dependent crystal structure and its sensitivity to strain-induced stacking disorder. Here, we isolate the monoclinic ($C2/m$) phase in nanogram-scale single crystals, providing the opportunity to study Kitaev physics in a new setting. We perform high-resolution magnetotropic susceptibility measurements on a structurally well-defined crystal within several crystal planes. Mapping the antiferromagnetic (AFM) phase boundary as a function of temperature, magnetic field, and field orientation, we find that the monoclinic phase diagram closely resembles that of rhombohedral crystals, but is systematically shifted to higher transition temperatures and critical fields. We find that the critical fields coincide quantitatively with anomalies observed across the $\\sim$7-11~T field range, where Kitaev spin liquid physics has been widely reported across numerous independent studies and experimental techniques. Our study shows that these anomalies arise from the magnetic phase boundaries of coexisting monoclinic and rhombohedral structural domains, rather than an exotic phase. These results provide a thermodynamic reference against which past studies can determine their structural composition, and toward which future studies can look for genuine signatures of spin-liquid phenomena beyond the close vicinity of the AFM boundary under in-", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "r
