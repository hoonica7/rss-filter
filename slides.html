<title>Daily Paper Slideshow</title>
<style>
  :root {
    color-scheme: light;
    --bg: #f6f7f4;
    --paper: #ffffff;
    --ink: #111827;
    --muted: #64748b;
    --line: #d8ddd2;
    --accent: #176b87;
    --accent-2: #9a3412;
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; overflow: auto; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: var(--bg); color: var(--ink); }
  .shell { max-width: 1500px; min-height: 100vh; margin: 0 auto; padding: 14px 18px; display: flex; flex-direction: column; }
  .topbar { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 16px; }
  .top-actions { display: flex; align-items: center; gap: 10px; }
  .topbar a, button { border: 1px solid var(--line); border-radius: 8px; background: var(--paper); color: var(--ink); padding: 10px 14px; font-weight: 700; text-decoration: none; cursor: pointer; }
  button.primary { background: var(--accent); border-color: var(--accent); color: white; }
  button:disabled { opacity: 0.45; cursor: not-allowed; }
  .counter { color: var(--muted); font-weight: 700; }
  .slide { min-height: calc(100vh - 82px); background: var(--paper); border: 1px solid var(--line); border-radius: 10px; padding: 18px; box-shadow: 0 18px 42px rgba(15, 23, 42, 0.10); display: grid; grid-template-columns: minmax(310px, 0.86fr) minmax(0, 1.55fr); gap: 18px; overflow: visible; }
  .paper-head { min-width: 0; min-height: 0; overflow: visible; display: flex; flex-direction: column; gap: 12px; }
  .figure { margin: 0; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: #f8fafc; }
  .figure img { display: block; width: 100%; max-height: 41vh; object-fit: contain; background: white; }
  .figure figcaption { padding: 7px 10px; color: var(--muted); font-size: 12px; line-height: 1.3; }
  .head-text { display: flex; flex-direction: column; gap: 9px; min-width: 0; }
  .badges { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .badge { border-radius: 999px; padding: 5px 9px; background: #eef2ff; color: #3730a3; font-size: 12px; font-weight: 800; }
  .score { background: #fee2e2; color: #991b1b; }
  h1 { margin: 0; font-size: 25px; line-height: 1.15; letter-spacing: 0; overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
  h1 a { color: inherit; text-decoration-color: rgba(23, 107, 135, 0.35); text-decoration-thickness: 2px; text-underline-offset: 4px; }
  h1 a:hover { color: var(--accent); text-decoration-color: var(--accent); }
  .meta, .authors, .why, .abstract { font-size: 13px; line-height: 1.45; }
  .meta, .authors { color: var(--muted); }
  .why strong, .abstract strong, .authors strong { color: var(--ink); }
  .authors { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .why { border-left: 4px solid var(--accent-2); padding-left: 10px; color: #374151; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .abstract { border-top: 1px solid var(--line); padding-top: 14px; color: #374151; }
  .original-abstract { border-top: 1px solid var(--line); padding-top: 10px; color: #374151; font-size: 11.5px; line-height: 1.35; overflow-wrap: anywhere; }
  .original-abstract strong { display: block; margin-bottom: 4px; color: var(--ink); }
  .tags { display: flex; flex-wrap: wrap; gap: 8px; }
  .tag { border-radius: 999px; padding: 4px 8px; background: #f1f5f9; color: #475569; font-size: 12px; font-weight: 700; }
  .head-text > .link { display: none; }
  .briefing { min-width: 0; min-height: 0; overflow: visible; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); grid-auto-rows: minmax(0, auto); align-content: start; gap: 11px 18px; border-top: 0; padding-top: 0; }
  .brief-section { min-width: 0; }
  .brief-section.wide { grid-column: 1 / -1; }
  .brief-section h2 { margin: 0 0 4px; font-size: 14px; line-height: 1.22; color: #0f766e; letter-spacing: 0; }
  .brief-section p, .brief-section li { margin: 0; font-size: 12.5px; line-height: 1.42; color: #1f2937; overflow-wrap: anywhere; }
  .brief-section ul { margin: 0; padding-left: 20px; }
  .concepts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 9px 14px; }
  .concept { border-top: 1px solid var(--line); padding-top: 7px; }
  .concept h3 { margin: 0 0 4px; font-size: 13px; color: #7c2d12; letter-spacing: 0; }
  .concept p { margin: 2px 0 0; font-size: 11.5px; line-height: 1.35; color: #374151; overflow-wrap: anywhere; }
  .concept b { color: #111827; }
  .link { color: var(--accent); font-weight: 800; text-decoration: none; }
  .empty { padding: 48px; background: var(--paper); border: 1px solid var(--line); border-radius: 12px; color: var(--muted); }
  @media (max-width: 860px) {
    .shell { padding: 14px; }
    .topbar, .top-actions { align-items: stretch; flex-direction: column; }
    .slide, .briefing, .concepts { grid-template-columns: 1fr; }
    .slide { min-height: auto; overflow: visible; display: grid; }
    h1 { font-size: 28px; }
  }
</style>

 study on twisted bilayer and double-bilayer MoTe2.", "Identifies the link between twist-induced lattice relaxation and electronic band structure.", "Provides experimental evidence for remote band modulation in moiré semiconductors.", "Demonstrates precise control over moiré-modulated electronic properties."]}}, {"title": "Visualizing Berry curvature in a Floquet-Chern insulator", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2609.17500", "authors": "Younsik Kim, Rishi Acharya, Hannah E. Aguirre, Lucca Figari, Daniel P. Shoemaker, Fahad Mahmood", "last_authors": "Daniel P. Shoemaker, Fahad Mahmood", "summary": "Circularly polarized light can open a topological gap in a gapless Dirac system, creating a Floquet-Chern insulator. However, its Berry curvature has not been directly resolved. Here we use circular-dichroism time- and angle-resolved photoemission spectroscopy (Tr-ARPES) to map the light-induced Berry curvature of Floquet-Bloch states on the surface of Bi$_2$Se$_3$. By comparing spectra for opposite helicities of the mid-infrared pump, we isolate the induced geometric response. We observe alternating-sign Berry-curvature features at Floquet gaps that repeat at intervals set by the pump photon energy and redistribute with pump field strength in agreement with calculations for a periodically driven Dirac Hamiltonian. Both the induced Berry-curvature and the Floquet Dirac gap decay faster than the replica intensity, showing that spectral replicas can persist even after coherent Floquet hybridization weakens. These results establish momentum-resolved Berry-curvature mapping as a direct probe of light-induced topology and coherent Floquet band formation.", "tier": "A_MUST_READ", "score": "10", "reason": "Direct hit; uses TR-ARPES to measure Berry curvature in topological materials under Floquet driving.", "tags": ["ARPES", "topological", "Berrycurvature"], "image": "https://arxiv.org/html/2609.17500v1/fig1.png", "briefing": {"backg ay, Laure Thomarat, Kuldeep Kargeti, et al.", "last_authors": "Chandra Shekhar, Victor Balédent", "summary": "We investigate the pressure-induced evolution of crystal structure and magnetism in the kagome ferromagnet ${\\mathrm{Fe}}_{3}{\\text{Sn}}_{2}$ by combining x-ray diffraction, x-ray emission spectroscopy, x-ray magnetic circular dichroism, and spin-polarized density functional theory calculations. X-r…", "tier": "A_MUST_READ", "score": "9", "reason": "title strong match: kagome metal", "tags": ["circulardichroism", "kagome", "topological", "ferromagnet"], "image": "", "briefing": {"background": "Fe3Sn2는 kagome 격자 구조를 가진 강자성체로, 위상적 전자 구조와 강한 자기 이방성으로 인해 위상적 홀 효과 등의 비자명한 물성이 관찰되는 핵심 물질입니다.", "motivation": "압력이 물질의 결정 구조와 자기적 정렬을 어떻게 변화시키는지 규명하여, 구조적 왜곡이 kagome 밴드 구조와 위상적 성질에 미치는 영향을 이해하고자 합니다.", "result": "압력 증가에 따른 결정 구조의 변화와 X-ray 자기 원형 이색성(XMCD)을 통해 자기 모멘트의 변화를 확인했습니다. 특히 구조적 전이와 자기적 성질 간의 강한 상관관계를 실험적으로 입증했습니다.", "implication": "Kagome 금속에서 외부 변수(압력)를 이용해 자기적·위상적 상태를 튜닝할 수 있는 가능성을 제시하며, 이는 양자 상태 제어 연구의 토대가 됩니다.", "novelty": "구조적 연구와 자기적 특성 분석을 결합하여 Fe3Sn2의 압력 하 위상적 진화를 통합적으로 해석한 점이 중요합니다.", "unresolved": "압력에 따른 위상적 밴드 구조의 직접적인 전이 과정과 그에 따른 전자 수송 현상의 구체적인 변화는 여전히 추가 연구가 필요합니다.", "future_work": "저온에서의 고압 수송 현상 측정 및 ARPES를 통한 압력 인가 상태에서의 밴드 구조 관찰이 기대됩니다.", "concepts": [{"term": "Kagome lattice", "why_emerged": "기하학적 좌절과 평탄한 밴드 구조를 통해 강한 상관관계 효과를 유도하기 위해 필요.", "origin": "일본의 바구니 짜기 패턴에서 유래, 고체물리에서는 2000년대 초반부터 집중 조명됨.", "connections": "Flat band, Dirac fermion, Superconductivity."}, {"term": "XMCD", "why_emerged": "원소 선택적으로 자성 정보를 얻고 궤도 및 스핀 모멘트를 분리 측정하기 위해 개발됨.", "origin": "1980년대 후반 독일의 Schütz 등.", "connections": "X-ray magnetic absorption, Berry curvature studies."}], "english_summary": ["Investigated structural and magnetic phase transitions in Fe3Sn2 kagome ferromagnet under pressure.", "Used XRD, XES, and XMCD to monitor changes in magnetic moments and crystal symmetry.", "Demonstrated that pressure acts as an effective tuning parameter for topological s": "Marco Malvestuto, Antonio Caretta, Simone Laterza, et al.", "last_authors": "Benedikt Maurer, Claudia Draxl", "summary": "Ultrafast photoexcitation can drive solids far from equilibrium by dynamically renormalizing their electronic structure, yet direct time-domain access to bulk band-structure reshaping with orbital and momentum selectivity has remained limited. Here, we show in photoexcited graphite that femtosecond carbon K -edge resonant inelastic x-ray scattering (RIXS), used in the time domain, provides a momentum- and orbital-selective spectroscopic fingerprint of transient valence-band reshaping. Momentum- and orbital-selective measurements along the K → M contour disentangle π and σ contributions and reveal a structured redistribution of spectral weight emerging within ∼70 femtoseconds and evolving on picosecond timescales. Nonequilibrium first-principles RIXS calculations performed within a frozen-lattice approximation show that the earliest response is dominated by electronic correlations and transient screening. At longer delays, the dynamics become strongly momentum dependent: Near K , the signal reflects the decay of the electronic contribution to the renormalized band structure under a hot-phonon bottleneck, whereas at the M -point van Hove singularity, it reveals a characteristic spectroscopic signature consistent with electron-phonon–driven band red shift and lifetime broadening induced by strongly coupled optical phonons. A three-temperature model constrained by the orbital-resolved tr-RIXS data captures the ensuing energy cascade through a hot-phonon reservoir dominated by the E 2 g and A 1 ′ modes. These results establish time-domain RIXS as a complementary probe of transient band-structure renormalization and mode-selective energy flow in quantum materials.", "tier": "B_IMPORTANT_CONDMAT", "score": "9", "reason": "RIXS on valence-band reshaping in graphite, highly relevant electronic structure spectroscopy.; demoted from A: broad CM, not di  Dirac systems offer a versatile platform for quantum-geometric non-linear transport. Hexagonal warping in topological insulator (TI) surface states generates rich momentum-space geometric textures. However, mirror and time-reversal symmetries strictly constrain both the Berry curvature and quantum metric dipoles to zero. Here, we show that proximity-coupling a hexagonally warped TI to a d-wave altermagnet lifts spatial mirror symmetry via the interplay of C_{3v} warping and d-wave spin-splitting. This symmetry breaking enables finite Berry curvature dipole components, which, however, remain heavily suppressed near charge neutrality, establishing the intrinsic quantum metric dipole as the sole driver of the non-linear Hall response. This scattering-independent response vanishes at \\mu = 0 and exhibits odd parity under chemical potential inversion. Importantly, rotating the altermagnetic orientation angle \\phi continuously tunes quantum metric dipole and induces a sign reversal, peaking near \\phi=0 and vanishing at \\phi = \\pi/4. Our findings highlight TI-altermagnet interfaces as ideal candidates for gate- and orientation-tunable quantum metric spintronics.", "tier": "B_IMPORTANT_CONDMAT", "score": "9", "reason": "Directly links altermagnetism and topological insulators to nonlinear Hall transport effects.", "tags": ["altermagnet", "topologicalinsulator", "Halleffect", "transport"], "image": "https://arxiv.org/html/2609.17001v1/Fig1.png", "briefing": {"background": "위상 절연체 표면 상태는 육각형 휨(hexagonal warping) 효과로 인해 독특한 기하학적 텍스처를 가지지만, 대칭성 제약으로 인해 선형 응답 영역에서 홀 효과가 제한되는 문제가 있습니다.", "motivation": "위상 절연체 표면을 d-파동 알터자성체와 결합하여 대칭성을 깨뜨릴 때 발생하는 비선형 홀 효과의 기하학적 기원을 이론적으로 탐구하고자 했습니다.", "result": "알터자성체와의 결합이 거울 대칭성을 깨뜨려 양자 메트릭 쌍극자(quantum metric dipole)를 유도하고, 이것이 비선형 홀 전도도를 결정하는 주된 요인임을 밝혀냈습니다.", "implication": "알터자성체-위상 절연체 인터페이스를 이용해 게이트 전압이나 자성 배향으로 제어 가능한 새로운 비선형 홀 소자 설계가 가능합니다.", "novelty": "알터자성체의 d-파동 대칭성이 위상 절연체의 비선형 홀 전도도에 미치는 영향을 규명하여 양자 기하학적 스핀트로닉스 분야에 중요한 통찰을 제공합니다.", "unresolved": "실제 실험에서 구현될 수 있는 특정 물질 조합에서의 최적화된 비선형 홀 신호 강도와 산란 효과의 완전한 분리는 여전히 과제입니다.", "future_work": "알터자성체와의 근접 효과가 극대화되는 구체적인 물질 후보군 선정 및 나노 장치 제작을 통한 실험적 검증이 예상됩니다.", "concepts": [{"term": "Altermagnetism", "why_emerged": "기존의 강자성이나 반강자성과 달리, 스핀 갈라짐이 운동량 공간에서 대칭적으로 나타나는 새로운 자기 질서 필요성으로 등장했습니다.", "origin": "Jungwirth 등 (2022)에 의해 개념 정립", "connections": "비상대론적 스핀 갈라짐, 고속 스핀트로닉스 소자와 연결됨."}, {"term": "Quantum Metric Dipole", "why_emerged": "비선형 전송 현상에서 베리 곡률과 독립적으로 물리량을 결정짓는 기하학적 양을 기술하기 위해 도입되었습니다.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "비선형 홀 효과, 비선형 광전도도와 직접적인 상관관계."}], "english_summary": ["Studies nonlinear Hall effect in warped topological insulator surface states coupled to altermagnets.", "Shows that d-wave altermagnetism breaks mirror symmetry, enabling a quantum metric dipole.", "Identifies the quantum metric dipole as the intrinsic driver for the nonlinear Hall response.", "Proposes an orientation-tunable quantum spintronic platform."]}}, {"title": "Optical manifestations of loop currents in Haldane's model and in time-reversal-breaking superconductors", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2608.22083", "authors": "Azzam S. Alzahrani, Victor M. Yakovenko", "last_authors": "Azzam S. Alzahrani, Victor M. Yakovenko", "summary": "We present a theoretical study of optical manifestations of loop currents in Haldane's model and in time-reversal-breaking superconductors. For Haldane's model, we calculate the expectation value of loop currents in terms of model parameters and relate it with the integrated optical spectral weight for the frequency-dependent ac Hall conductivity. Thus, experimental measurements of the latter can provide information about the presence and magnitude of steady loop currents in the system. Then we elaborate on loop currents in a chiral superconductor on the honeycomb lattice, studied earlier by Brydon et al. (2019). We demonstrate that a sharp optical absorption peak in the ac ": "알터자성체의 특성인 비상대론적 스핀 갈라짐 위에 상대론적 SOC가 더해지면서 궤도 강자성 등 부차적인 자기 효과가 유도됨을 밝힘.", "implication": "알터자성체에서 나타나는 수송 현상이나 광학적 성질을 정확히 해석하기 위해서는 SOC의 보정 효과를 반드시 고려해야 함을 보여줌.", "novelty": "순수 알터자성 효과와 SOC에 의한 효과를 명확히 구분하여, 실제 물질 연구에서 물리 현상을 해석하는 이론적 지침을 제공함.", "unresolved": "다양한 결정 구조를 가진 알터자성체들에 대한 일반화된 해석은 여전히 추가 연구가 필요함.", "future_work": "구체적인 알터자성 화합물에 대한 정밀한 DFT+SOC 계산 및 실험적 증명 수행.", "concepts": [{"term": "상대론적 스핀 갈라짐", "why_emerged": "전자의 스핀-궤도 결합(SOC)에 의해 시간 반전 대칭성이 깨지거나 대칭성이 낮은 격자에서 발생하는 현상을 이해하기 위해 필요함.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "Rashba 효과, Dresselhaus 효과, 스핀-궤도 토크."}, {"term": "궤도 강자성", "why_emerged": "자성체 내에서 전자 궤도 각운동량의 불균형으로 인해 발생하는 자기적 성질을 구분하기 위해 필요함.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "이상 홀 효과, 스핀-궤도 결합, 자기 이방성."}], "english_summary": ["Analyzes the interplay between relativistic spin-orbit coupling (SOC) and the intrinsic spin splitting in altermagnets.", "Shows that SOC induces weak spin and orbital ferromagnetism, supplementing the nonrelativistic spin splitting.", "Provides crucial insights for interpreting transport and spectroscopic data in real altermagnetic materials."]}}, {"title": "Strain engineering of the intrinsic anomalous Hall and Nernst effects in altermagnetic MnTe at realistic doping levels", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/fc77-6rh4", "authors": "Weiwei Chen, Ziyu Zhou, Jie Meng, Weiyi Wang, Ye Yang, Zhongjun Li", "last_authors": "Ye Yang, Zhongjun Li", "summary": "Hexagonal MnTe has emerged as a prototypical $g$-wave altermagnet, hosting time-reversal symmetry breaking in momentum space despite a vanishing net magnetization. While this symmetry breaking theoretically allows for an intrinsic anomalous Hall effect, experimentally observed signals have remained …", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Directly relates to altermagnetism and transport phenomena in magnetic materials.", "tags": ["altermagnetism", "anomalous-Hall", "transport"], "image": "", "briefing": {"background": "알터마그네틱(altermagnetism)은 순 자화(net magnetization)가 0임에도 불구하고 운동량 공간에서 시간 반전 대칭성이 깨진 새로운 자기 위상입니다. 이는 기존의 강자성체와 반강자성체의 특성을 넘어선 새로운 자기 물성 연구 분야입니다.", "motivation": "MnTe는 대표적인 g-파 알터마그네틱 물질로 알려져 있으나, 이론적으로 예측된 고유 비정상 홀 효과(AHE)가 실험에서는 명확히 관찰되지 않는 문제가 있어 이를 규명하고자 합니다.", "result": "변형(strain) 공학을 통해 MnTe의 전자 구조를 조절하여 도핑 수준에 따른 고유 비정상 홀 효과와 비정상 네른스트 효과(ANE)를 효과적으로 제어할 수 있음을 이론적으로 보였습니다.", "implication": "알터마그네틱 물질에서 전자기적 수송 특성을 변형을 통해 튜닝할 수 있음을 시사하며, 이는 향후 차세대 스핀트로닉스 소자 설계에 중요한 지침이 됩니다.", "novelty": "실제 도핑 수준을 고려한 변형 공학적 접근을 통해 알터마그네틱의 비정상 수송 현상을 구체적으로 분석한 점이 독창적입니다.", "unresolved": "이론적 계산 결과가 실제 박막 제작 과정에서의 결함이나 도핑 불균일성에 의해 어떻게 영향을 받을지는 추가 연구가 필요합니다.", "future_work": "변형이 인가된 MnTe 박막 샘플을 직접 제작하여 수송 측정 및 ARPES를 통한 전자 구조 변화 검증이 필요합니다.", "concepts": [{"term": "알터마그네틱", "why_emerged": "순 자화가 0이면서 시간 반전 대칭성이 깨진 새로운 자기 구조를 기술하기 위해 제안되었습니다.", "origin": "최근 2020년대 초반 Smejkal 등의 연구 그룹에 의해 체계화되었습니다.", "connections": "강자성, 반강자성, 비정상 홀 효과와 연결됩니다."}, {"term": "비정상 홀 효과", "why_emerged": "자기 물질에서 자기장에 의존하지 않는 전자의 수송 현상을 설명하기 위해 도입되었습니다.", "origin": "Edwin Hall이 발견한 고전적 홀 효과와 구별되며, Karplus와 Luttinger가 이론적 기원을 제시했습니다.", "connections": "베리 곡률, 스핀-궤도 결합과 직접적인 연관이 있습니다."}], "english_summary": ["MnTe is identified as a prototype g-wave altermagnet with broken time-reversal symmetry.", "The paper investigates how strain engineering modifies intrinsic anomalous Hall and Nernst effects.", "Results show significant control over transport properties via strain at realistic doping levels.", "This work provides a pathway for tuning altermagnetic spintronics devices."]}}, {"title": "Symmetry-protected coexistence of a nodal surface and multiple types of Weyl fermions in CBT-B30", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/mh37-nxby", "authors": "Xiao-Jing Gao, Yanfeng Ge, Yan Gao", "last_authors": "Yanfeng Ge, Yan Gao", "summary": "The coexistence of topological states with different dimensionalities in a s d magnetoresistance in chiral metal halide semiconductors.", "Showed that chirality modulates interfacial tunneling barriers at room temperature.", "Demonstrated that CISS-MR surpasses Julliere model limits for spin valves."]}}, {"title": "Imaging topological polar structures in marginally twisted 2D semiconductors", "journal": "Science_Advances", "source": "Gemini", "link": "https://doi.org/10.1126/sciadv.aed8555", "authors": "Thi-Hai-Yen Vu, Daniel Bennett, Gayani Nadeera Pallewela, et al.", "last_authors": "Michael S. Fuhrer, Mark T. Edmonds", "summary": "Moiré superlattices formed in van der Waals heterostructures by twisting, lattice mismatch and strain present an opportunity for creating metamaterials with unique properties absent in the individual layers. Ferroelectricity for example, arises from broken inversion symmetry in twisted and strained bilayers of 2D semiconductors with stacking domains of alternating out-of-plane polarization. However, the individual contributions of twist and strain to the formation of topological polar nanostructures remain unclear and experimentally challenging to resolve. Inversion symmetry breaking is predicted to generate in-plane polarization along the domain walls, forming topologically non-trivial Bloch-type merons (half-skyrmions) in twisted systems and Néel-type merons in strained systems. Here we utilize angle-resolved vector piezoresponse force microscopy to spatially resolve polarization components and topological polar nanostructures in marginally twisted bilayer WSe 2 , providing experimental evidence of topologically non-trivial meron/antimeron structures. This approach can be used to distinguish Bloch-type, Néel-type and hybrid structures, allowing us to quantify the separate contributions of strain and twist in a moiré superlattice, opening pathways for exploring twist-induced topology in engineered nano-devices.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Experimental study of topological polar str  algorithmic improvements, we are able to consider spatial volumes, corresponding to 20808 electrons, that allow us to access energy scales of direct relevance to experiments. Using constrained random phase approximation (cRPA) estimates of short-ranged interactions combined with a Coulomb tail, we are able to successfully confront numerical and experimental estimates of the Fermi velocity renormalization, thus fixing the parameters of microscopic Hamiltonian to exactly reproduce the experimental data. Subsequent comparison of the QMC results with perturbation theory not only show the non-Fermi liquid character of graphene, but also prove the importance of lattice-scale physics and higher-order perturbative corrections beyond RPA for the quantitative description of the experimental data for the Fermi velocity renormalization in suspended graphene. The same Monte Carlo technique is subsequently employed to investigate electrical transport by computing the renormalization of the optical conductivity in freestanding graphene. The large lattice sizes and low temperatures accessible in our QMC simulations enable a clear resolution of the Dirac plateau in the spectral function, even in the presence of interactions. We demonstrate that, despite the strong renormalization of the single-particle dispersion, the optical conductivity remains essentially constant, in agreement with current experimental observations. This finding points toward the possibility of extending the theorem on the absence of optical conductivity renormalization for the Hubbard model on the hexagonal lattice to the case of long-range interactions.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "High-quality QMC simulation of graphene electronic structure and transport, relevant to 2D materials.", "tags": ["graphene", "QMC", "electronicstructure"], "image": "https://arxiv.org/html/2104.09655v3/polarization_all_paper.png", "briefing": {"background": "그래핀은 디락 페르미온을 가지는 2차원 물질로서, 전자 간 상호작용이 전자 구조와 수송 특성에 미치는 영향을 연구하는 중요한 모델 시스템입니다. 특히 실험적 측정값과 이론적 계산 사이의 불일치를 해결하는 것이 정밀 물리학의 핵심 과제입니다.", "motivation": "기존의 섭동 이론이나 단순한 RPA 방식으로는 자유롭게 떠 있는(free-standing) 그래핀의 페르미 속도 재규격화(renormalization)와 같은 실험적 관측치를 정확히 설명하는 데 한계가 있어, 더 정교한 QMC 수치 해석이 필요했습니다.", "result": "대규모 QMC 시뮬레이션을 통해 2만 개 이상의 전자를 고려하고, cRPA 상호작용 파라미터를 결합하여 실험과 정량적으로 일치하는 페르미 속도 결과를 도출했습니다. 또한, 상호작용이 강함에도 불구하고 광학 전도도가 일정하게 유지된다는 것을 확인했습니다.", "implication": "그래핀의 비페르미 액체적 성질을 확인하고, 격자 스케일 물리학과 고차 섭동 항의 중요성을 입증했습니다. 이는 Hubbard 모델에서 광학 전도도 재규격화가 없다는 정리가 장거리 상호작용으로 확장될 수 있음을 시사합니다.", "novelty": "실험적 에너지 스케일에 도달하는 초대규모 QMC를 사용하여 이론과 실험 사이의 오랜 간극을 메웠으며, 특히 강한 전자 상관관계하에서도 광학 전도도가 유지되는 이유를 수치적으로 강력하게 뒷받침했습니다.", "unresolved": "장거리 쿨롱 상호작용이 완전한 비페르미 액체로의 전이에 미치는 엄밀한 한계 조건이나, 실제 실험 환경에서의 기판 효과(substrate effects)를 완벽히 배제했을 때의 극한 상황에 대한 완전한 규명은 여전히 과제입니다.", "future_work": "더 복잡한 기하학적 구조나 다른 2차원 Dirac 물질(예: 꼬인 이중층 그래핀)로의 확장, 그리고 도핑된 그래핀에서의 수송 현상에 대한 QMC 연구가 기대됩니다.", "concepts": [{"term": "QMC (Quantum Monte Carlo)", "why_emerged": "강한 상관관계를 가진 다체 전자 시스템의 바닥 상태나 열역학적 성질을 섭동 이론 없이 수치적으로 엄밀하게 계산하기 위해 필요합니다.", "origin": "Metropolis 등 1950년대 통계 물리학 발전에 뿌리를 두며, Hubbard 모델 등 격자 모델에 적용된 것은 1980년대 초반 (Blankenbecler, Scalapino, Sugar 등).", "connections": "DMFT, Exact Diagonalization 등과 함께 응집물질 물리학의 핵심 수치 계산 방법론."}, {"term": "Fermi velocity renormalization", "why_emerged": "그래핀의 전자 간 상호작용이 디락 점 근처에서 입자의 분산을 수정하여 유효 질량이나 속도에 변화를 주는 현상을 이해하기 위함입니다.", "origin": "Gonzalez, Guinea, Vozmediano에 의해 1990년대 중반 이론적으로 예견되었습니다.", "connections": "비페르미 액체(Non-Fermi Liquid) 이론, 쿨롱 상호작용 연구와 밀접."}, {"term": "cRPA (constrained Random Phase Approximation)", "why_emerged": "다체 시스템에서 유효 상호작용 파라미터(예: U)를 계산할 때, 스크리닝 효과를 체계적으로 분리하여 계산하기 위해 고안되었습니다.", "origin": "Aryasetiawan 등(2004)에 의해 체계적으로 정립되었습니다.", "connections": "DFT+DMFT 방법론의 핵심 구성 요소."}], "english_summary": ["Large-scale QMC simulations successfully match experimental Fermi velocity renormalization in graphene.", "The study highlights the critical role of lattice-scale physics and higher-order perturbative corrections.", "Results confirm the absence of optical conductivity renormalization under long-range Coulomb interactions.", "Provides a definitive link between advanced numerical techniques and transport measurements in 2D materials."]}}, {"title": "Electrical Probing of Sub-N\\'eel Spin Dynamics in Two-Dimensional Antiferromagnets Using Graphene Heterostructures", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2609.16725", "authors": "Adri\\'an Garc\\'ia-Mart\\'in (Dpto. F\\'isica de la Materia Condensada, Universidad Aut\\'onoma de Madrid, calle Francisco Tom\\'as y Valiente 7, et al.", "last_authors": "Spain, Condensed Matter Physics Center)", "summary": "Low-dimensional antiferromagnetic van der Waals materials have emerged as a versatile platform for exploring exotic spin dynamics and magnetic phases, yet electrically accessing these phenomena remains a major challenge because of their vanishing net magnetization and highly insulating nature. Here, we demonstrate that graphene can act as an ultrasensitive electrical transducer of hidden spin dynamics in two-dimensional antiferromagnets. By integrating graphene with the van der Waals antiferromagnet FePS$_3$, low-temperature transport measurements combined with magnetic-field and gate-voltage control reveal multiple resistance anomalies well below the N\\'eel temperature. Their distinct temperature, magnetic-field, and carrier-density dependences enable us to associate these anomalies with magnon excitations and with a low-temperature magnetic reconfiguration of the antiferromagnetic state, both of which remain largely inaccessible to conventional magnetometry. Density functional theory calculations further show that competing antiferromagnetic spin configurations in FePS$_3$ are nearly degenerate in energy while producing markedly different electronic responses in the adjacent graphene layer. The pronounced electrostatic tunability of these signatures demonstrates th   if (r.link) { const link = document.createElement('a'); link.className = 'link'; link.href = r.link; link.target = '_blank'; link.rel = 'noopener noreferrer'; link.textContent = 'Open paper'; headText.appendChild(link); }
