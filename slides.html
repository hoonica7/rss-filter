<title>Daily Paper Slideshow</title>
<style>
  :root {
    color-scheme: light;
    --bg: #f6f7f4;
    --paper: #ffffff;
    --ink: #111827;
    --muted: #64748b;
    --line: #d8ddd2;
    --accent: #176b87;
    --accent-2: #9a3412;
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; overflow: auto; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: var(--bg); color: var(--ink); }
  .shell { max-width: 1500px; min-height: 100vh; margin: 0 auto; padding: 14px 18px; display: flex; flex-direction: column; }
  .topbar { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 16px; }
  .top-actions { display: flex; align-items: center; gap: 10px; }
  .topbar a, button { border: 1px solid var(--line); border-radius: 8px; background: var(--paper); color: var(--ink); padding: 10px 14px; font-weight: 700; text-decoration: none; cursor: pointer; }
  button.primary { background: var(--accent); border-color: var(--accent); color: white; }
  button:disabled { opacity: 0.45; cursor: not-allowed; }
  .counter { color: var(--muted); font-weight: 700; }
  .slide { min-height: calc(100vh - 82px); background: var(--paper); border: 1px solid var(--line); border-radius: 10px; padding: 18px; box-shadow: 0 18px 42px rgba(15, 23, 42, 0.10); display: grid; grid-template-columns: minmax(310px, 0.86fr) minmax(0, 1.55fr); gap: 18px; overflow: visible; }
  .paper-head { min-width: 0; min-height: 0; overflow: visible; display: flex; flex-direction: column; gap: 12px; }
  .figure { margin: 0; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: #f8fafc; }
  .figure img { display: block; width: 100%; max-height: 41vh; object-fit: contain; background: white; }
  .figure figcaption { padding: 7px 10px; color: var(--muted); font-size: 12px; line-height: 1.3; }
  .head-text { display: flex; flex-direction: column; gap: 9px; min-width: 0; }
  .badges { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .badge { border-radius: 999px; padding: 5px 9px; background: #eef2ff; color: #3730a3; font-size: 12px; font-weight: 800; }
  .score { background: #fee2e2; color: #991b1b; }
  h1 { margin: 0; font-size: 25px; line-height: 1.15; letter-spacing: 0; overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
  h1 a { color: inherit; text-decoration-color: rgba(23, 107, 135, 0.35); text-decoration-thickness: 2px; text-underline-offset: 4px; }
  h1 a:hover { color: var(--accent); text-decoration-color: var(--accent); }
  .meta, .authors, .why, .abstract { font-size: 13px; line-height: 1.45; }
  .meta, .authors { color: var(--muted); }
  .why strong, .abstract strong, .authors strong { color: var(--ink); }
  .authors { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .why { border-left: 4px solid var(--accent-2); padding-left: 10px; color: #374151; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .abstract { border-top: 1px solid var(--line); padding-top: 14px; color: #374151; }
  .original-abstract { border-top: 1px solid var(--line); padding-top: 10px; color: #374151; font-size: 11.5px; line-height: 1.35; overflow-wrap: anywhere; }
  .original-abstract strong { display: block; margin-bottom: 4px; color: var(--ink); }
  .tags { display: flex; flex-wrap: wrap; gap: 8px; }
  .tag { border-radius: 999px; padding: 4px 8px; background: #f1f5f9; color: #475569; font-size: 12px; font-weight: 700; }
  .head-text > .link { display: none; }
  .briefing { min-width: 0; min-height: 0; overflow: visible; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); grid-auto-rows: minmax(0, auto); align-content: start; gap: 11px 18px; border-top: 0; padding-top: 0; }
  .brief-section { min-width: 0; }
  .brief-section.wide { grid-column: 1 / -1; }
  .brief-section h2 { margin: 0 0 4px; font-size: 14px; line-height: 1.22; color: #0f766e; letter-spacing: 0; }
  .brief-section p, .brief-section li { margin: 0; font-size: 12.5px; line-height: 1.42; color: #1f2937; overflow-wrap: anywhere; }
  .brief-section ul { margin: 0; padding-left: 20px; }
  .concepts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 9px 14px; }
  .concept { border-top: 1px solid var(--line); padding-top: 7px; }
  .concept h3 { margin: 0 0 4px; font-size: 13px; color: #7c2d12; letter-spacing: 0; }
  .concept p { margin: 2px 0 0; font-size: 11.5px; line-height: 1.35; color: #374151; overflow-wrap: anywhere; }
  .concept b { color: #111827; }
  .link { color: var(--accent); font-weight: 800; text-decoration: none; }
  .empty { padding: 48px; background: var(--paper); border: 1px solid var(--line); border-radius: 12px; color: var(--muted); }
  @media (max-width: 860px) {
    .shell { padding: 14px; }
    .topbar, .top-actions { align-items: stretch; flex-direction: column; }
    .slide, .briefing, .concepts { grid-template-columns: 1fr; }
    .slide { min-height: auto; overflow: visible; display: grid; }
    h1 { font-size: 28px; }
  }
</style>

<script>
const slides = [{"title": "Correlation-driven origin of shallow electron pocket in Co1/3TaS2 revealed by ARPES and cluster perturbation theory", "journal": "PRB_Recent", "source": "keyword", "link": "http://link.aps.org/doi/10.1103/6y9w-lx94", "authors": "Wojciech Sas, Yuki Utsumi Boucher, Seyed Ashkan Moghadam Ziabari, et al.", "last_authors": "Ivo Batistić, Petar Popčević", "summary": "We investigate the electronic structure and Fermi surface of ${\\mathrm{Co}}_{1/3}{\\mathrm{TaS}}_{2}$ using angle-resolved photoemission spectroscopy (ARPES) combined with theoretical modeling beyond standard density functional theory ($\\mathrm{DFT}+\\mathrm{U}$). A shallow electron pocket, the so-cal…", "tier": "A_MUST_READ", "score": "10", "reason": "title strong match: ARPES", "tags": ["ARPES", "angle-resolvedphotoemission", "photoemission", "Fermisurface"], "image": "", "briefing": {"background": "전이금속 디칼코게나이드(TMD) 계열 화합물은 층상 구조와 그 사이의 인터칼레이션(intercalation)을 통해 풍부한 물성을 나타내며, 전자 간의 강한 상관관계가 물성을 결정짓는 핵심 요소입니다.", "motivation": "Co1/3TaS2에서 관측되는 전자 구조, 특히 페르미 준위 근처의 전자 주머니(electron pocket) 기원을 표준 DFT 계산만으로는 충분히 설명하기 어려워 상관관계를 고려한 접근이 필요했습니다.", "result": "ARPES 측정과 Cluster Perturbation Theory를 결합하여, 해당 전자 주머니가 단순한 밴드 이론이 아닌 강한 전자 상관관계에 의해 유도됨을 확인했습니다.", "implication": "상관관계가 특정 물질의 밴드 구조를 변형시키는 메커니즘을 정밀하게 규명함으로써, TMD 화합물의 전자 구조 해석에 상관관계 모델링의 중요성을 입증했습니다.", "novelty": "기존 DFT가 간과하기 쉬운 상관관계 효과를 직접적으로 ARPES 데이터와 매칭하여 전자 주머니의 기원을 확정 지었다는 점이 주목할 만합니다.", "unresolved": "이 상관관계가 실제 물질의 자기적 특성이나 향후 전이 온도 등에 어떻게 구체적으로 기여하는지에 대한 상세 분석은 추가적인 연구가 필요합니다.", "future_work": "이러한 전자 상관관계가 실제 transport 특성이나 특정 위상학적 상태와 결합되는지에 대한 연구가 이어질 것으로 보입니다.", "concepts": [{"term": "Cluster Perturbation Theory", "why_emerged": "표준 DFT가 강한 상관관계 시스템의 밴드 정렬을 정확히 기술하지 못하기 때문에 이를 보완하기 위해 도입되었습니다.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "DMFT(Dynamical Mean Field Theory)와 유사한 목적의 계산 기법."}, {"term": "Intercalation", "why_emerged": "층상 구조 사이에 원자나 분자를 삽입하여 전자 밀도를 조절하고 물성을 제어하기 위해 필요합니다.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "TMD의 도핑 및 물성 튜닝 연구와 직접 연결됨."}], "english_summary": ["Investigated the electronic structure of Co1/3TaS2 using ARPES.", "The shallow electron pocket originates from electron correlations beyond DFT+U.", "Combined ARPES results with cluster perturbation theory for verification.", "Demonstrates the necessity of sophisticated many-body approaches in TMDs."]}}, {"title": "Correlated Insulator at the Surface of the Polar Metal Ca3Ru2O7", "journal": "PRL_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/x9gh-xxwb", "authors": "Daniel Halliday, Izidor Benedičič, Andela Zivanovic, et al.", "last_authors": "Phil D. C. King, Peter Wahl", "summary": "We investigate the electronic structure at the surface of the correlated oxide Ca 3 Ru 2 O 7 , a low-symmetry ruthenate oxide which hosts an unconventional polar-metal phase. From a combination of angle-resolved photoemission spectroscopy and scanning tunneling spectroscopy measurements, we demonstrate that the surface hosts an insulating phase, a distinct departure from metallicity within the bulk. Utilizing quantitative low-energy electron diffraction in conjunction with electronic structure calculations, we show how this results from a combined surface structure relaxation and the impact of marked electronic correlations in this system. Our findings highlight the proximity of Ca 3 Ru 2 O 7 to an insulating metallic state, and illustrate how subtle structural distortions can control its emergent electronic phases.", "tier": "A_MUST_READ", "score": "10", "reason": "Direct hits with ARPES/STS on a correlated electronic system.", "tags": ["ARPES", "STS", "correlated-oxides"], "image": "", "briefing": {"background": "Ca3Ru2O7은 구조적 왜곡을 동반한 극성 금속(polar metal)으로, 벌크 상태와 표면 상태 간의 물성 차이가 전형적인 상관관계 산화물 연구의 핵심 과제입니다.", "motivation": "벌크와는 다르게 표면에서 나타나는 절연체적 특성이 어떤 원인으로 발생하는지 ARPES와 STS를 통해 규명하고자 했습니다.", "result": "표면 구조의 이완(relaxation)과 강한 전자 상관관계의 결합이 표면에 절연체 상을 유도함을 증명했습니다.", "implication": "표면 왜곡만으로도 물질의 상전이가 발생할 수 있음을 보였으며, 이는 2차원 또는 표면 기반 소자 설계 시 구조 제어의 중요성을 시사합니다.", "novelty": "ARPES와 STS를 상호보완적으로 활용하여 금속-절연체 전이의 국소적, 전자적 기원을 동시에 파악했다는 점에서 정밀도가 높습니다.", "unresolved": "표면 절연체 상태가 내부 벌크 금속상과의 계면에서 어떤 식으로 변하며, 위상학적 특성을 내포하는지에 대한 연구는 미흡합니다.", "future_work": "표면 왜곡을 인위적으로 조절하여 절연체에서 금속으로의 스위칭 연구가 진행될 수 있습니다.", "concepts": [{"term": "Polar Metal", "why_emerged": "대칭성이 깨진 구조를 가진 금속으로, 비전통적 물리 현상을 탐구하기 위해 주목받고 있습니다.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "강상관 전자계의 위상학적 물성 연구와 결합."}, {"term": "Scanning Tunneling Spectroscopy (STS)", "why_emerged": "국소적인 밀도 상태를 직접 측정하여 전자 구조의 균질성을 확인하기 위해 필수적입니다.", "origin": "Binnig and Rohrer(1980년대 초)", "connections": "ARPES의 운동량 공간 측정과 상호보완적으로 활용."}], "english_summary": ["Studied the surface of Ca3Ru2O7 using ARPES and STS.", "Identified an insulating surface phase distinct from the metallic bulk.", "Revealed that surface relaxation and correlations drive this insulator phase.", "Highlights structural control of emergent electronic phases."]}}, {"title": "Direct observation of flat bands in near-magic-angle twisted bilayer CVD graphene", "journal": "arXiv_CondMat", "source": "author whitelist", "link": "https://arxiv.org/abs/2609.02403", "authors": "Gianluigi Baiardi, Alex Boschi, Giulia Piccinini, et al.", "last_authors": "Sergio Pezzini, Camilla Coletti", "summary": "Advances in chemical vapor deposition (CVD) growth have driven graphene crystal quality to unprecedented levels, yet it is still unknown whether this route can realize the fragile flat-band and correlated states of the magic-angle (MA) twisted bilayer graphene (TBG). Here, we report on the experimental observation by room-temperature nano-angle-resolved photoemission spectroscopy (nano-ARPES) of flat bands in a TBG sample close to the MA, assembled via a grow-and-stack protocol based on low-pressure CVD of graphene on copper. Our study indicates electronic bands fully comparable to those measured in exfoliation-based samples and determines the size of en, Xiao-Bin Qiang", "last_authors": "Rui Chen, Xiao-Bin Qiang", "summary": "We investigate the topological phases, joint density of states (JDOS), optical conductivities, and magneto-optical responses of a two-dimensional $d$-wave altermagnet with spin-orbit coupling and Zeeman splitting. The system hosts gapped Dirac points at the high-symmetry points $\\Gamma$, $\\textrm{M}$, $\\textrm{X}$, and $\\textrm{Y}$. We show that the JDOS exhibits kinks at the corresponding Dirac gap frequencies and pronounced peaks at Van Hove singularities, whose positions can be tuned by the altermagnetic order. These features are reflected in the optical conductivities, with complementary signatures in their real and imaginary parts. In particular, the Van Hove signatures in the transverse optical conductivity disappear in the absence of $d$-wave altermagnetism, revealing an altermagnet-induced optical signature of the Van Hove singularity. Finally, the Faraday and Kerr rotations exhibit characteristic features inherited from the optical conductivity. Our results establish optical and magneto-optical spectroscopy as sensitive probes of Dirac gaps and Van Hove singularities in altermagnetic topological systems.", "tier": "A_MUST_READ", "score": "10", "reason": "Directly addresses spectroscopy of altermagnets and Van Hove singularities in topological systems.", "tags": ["altermagnetism", "topological", "spectroscopy"], "image": "https://arxiv.org/html/2608.20986v3/E_C_together_v8.png", "briefing": {"background": "알터마그네티즘(Altermagnetism)은 기존의 강자성이나 반강자성과 달리, 격자 대칭성에 의해 스핀 분리된 밴드 구조를 가지며 순 자화가 없는 새로운 자기 질서 상태입니다. 이러한 상태에서 위상학적 특성과 전자 구조가 어떻게 상호작용하는지 규명하는 것은 현대 응집물질물리학의 주요 과제입니다.", "motivation": "알터마그네틱 시스템에서 나타나는 밴드 구조의 특징인 반 후브 특이점(Van Hove singularity)과 디락 갭(Dirac gap)을 광학적 분광학을 통해 검출할 수 있는 명확한 신호를 찾고자 합니다.", "result": "이론적 모델링을 통해 광전도도(Optical conductivity)와 자기광학적 반응(Faraday/Kerr rotation)에서 알터마그네틱 질서에 의한 반 후브 특이점의 뚜렷한 신호를 확인했으며, 이는 알터마그네틱 질서가 사라지면 횡방향 광전도도에서 해당 신호가 소멸됨을 보였습니다.", "imp rxiv.org/html/2609.02567v1/Fig1.png", "briefing": {"background": "카고메 격자의 기하학적 구조는 토폴로지 밴드와 강한 연관이 있습니다. 이를 인공적인 나노 구조물(supramolecular)로 구현하면 천연 결정보다 제어 가능한 상태에서 물리 현상을 직접 관찰할 수 있습니다.", "motivation": "분자 조립 기법을 이용해 원자 수준에서 제어된 이원자 카고메 격자를 만들고, 그 가장자리(edge) 상태를 직접 STM으로 관측하여 bulk-edge correspondence를 검증하고자 합니다.", "result": "Trip-Phz 분자를 이용하여 이원자 카고메 격자를 형성하고, Zigzag 가장자리에서 토폴로지적 가장자리 상태를 STM으로 직접 관측하는 데 성공했습니다.", "implication": "분자 자기 조립 기술이 토폴로지 물질 설계의 강력한 플랫폼이 될 수 있음을 증명하며, 그래핀의 가장자리 상태와 유사한 현상이 복합 격자에서도 구현됨을 보여줍니다.", "novelty": "STM을 통한 실공간 관측은 이론적 예측(Zak phase, bulk-edge correspondence)을 실험적으로 확증하는 강력한 증거를 제공하며, 이는 카고메 금속의 국소 상태 연구에 유용한 방법론입니다.", "unresolved": "표면 기판(Pb(111))과의 상호작용이 관측된 가장자리 상태에 얼마나 기여하는지, 자유 상태(isolated)에서의 물리와 어떻게 다른지에 대한 보완 연구가 필요합니다.", "future_work": "도핑이나 외부 게이트 전압을 통해 이 인공 격자의 토폴로지 특성을 변화시키는 실험이 이어질 것으로 예상됩니다.", "concepts": [{"term": "Bulk-Edge Correspondence", "why_emerged": "벌크의 토폴로지 불변량과 경계면의 유도 상태 간의 관계를 설명하기 위해 필수적.", "origin": "Hatsugai 등이 1993년에 퀀텀 홀 효과와 관련하여 정립.", "connections": "위상 절연체, Zak phase, 토폴로지 밴드 이론."}, {"term": "Zak Phase", "why_emerged": "1차원 시스템에서의 기하학적 위상(Berry phase)을 나타내어 토폴로지 특성을 결정하기 위해 도입.", "origin": "J. Zak이 1989년에 제안.", "connections": "Su-Schrieffer-Heeger(SSH) 모델, 밴드 반전."}], "english_summary": ["STM visualization of zigzag edge states in an artificial diatomic kagome lattice.", "Utilizes self-assembled supramolecular technology to study quantum materials.", "Provides evidence for bulk-edge correspondence in non-planar pi-conjugated molecules.", "Establishes a new platform for exploring geometric effects in electronic band structures."]}}, {"title": "Optical conductivity of topological semimetal Nb2n+1SinTe4n+2 (Phys. Rev. B)", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2604.19166", "authors": "Seongjin Ahn", "last_authors": "Seongjin Ahn", "summary": "We study the linear optical conductivity of the Nb$_{2n+1}$Si$_n$Te$_{4n+2}$ family of layered van der Waals materials, whic d": "에너지 밴드가 점이 아닌 선을 따라 교차하는 위상학적 상태를 설명하기 위해 필요합니다.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "Weyl semimetals, topological insulators와 연결됨."}, {"term": "Drude weight", "why_emerged": "금속성 물질 내 전하 운반체의 응답을 정량화하기 위해 정의되었습니다.", "origin": "Paul Drude (1900년)", "connections": "Optical conductivity, Fermi liquid theory와 밀접함."}], "english_summary": ["Analyzes the optical conductivity of the Nb2n+1Si_nTe4n+2 van der Waals family.", "Shows strong anisotropy in Drude weight due to the quasi-1D nodal-line state.", "Identifies direction-dependent slopes for interband conductivity.", "Confirms that zero-temperature analytical results hold at finite experimental temperatures."]}}, {"title": "Berry-curvature-driven anomalous Hall and Nernst effects in the kagome permanent magnets RCo5", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/jhff-xgwg", "authors": "Weian Guo, Pengyu Zheng, Rui Liu, Yiran Peng, Ying Yang, Zhiping Yin", "last_authors": "Ying Yang, Zhiping Yin", "summary": "Kagome lattice materials have attracted considerable attention due to their intriguing topological properties and potential applications in next-generation quantum and spintronic technologies. In particular, rare-earth permanent magnets with kagome structure provide an ideal platform that combines r…", "tier": "B_IMPORTANT_CONDMAT", "score": "9", "reason": "Strong relevance to kagome magnets and anomalous Hall effects.", "tags": ["kagome", "anomalousHall", "topological"], "image": "", "briefing": {"background": "카고메 격자 물질은 전자의 기하학적 좌절과 위상학적 밴드 구조가 결합되어 비전통적 물리 현상이 나타나는 핵심 연구 분야입니다.", "motivation": "희토류 기반 RCo5 카고메 영구자석이 가지는 강한 자성과 위상학적 특성이 결합된 anomalous Hall 및 Nernst 효과를 연구하고자 합니다.", "result": "카고메 구조의 기하학적 특성과 베리 곡률(Berry curvature)이 이들 물질의 수송 현상을 결정짓는 핵심 기제임을 밝히고 있습니다.", "implication": "카고메 자석이 향후 차세대 양자 스핀트로닉스 소자 구현을 위한 플랫폼으로 유망함을 제시합니다.", "novelty": "기존의 전형적인 카고메 금속(AV3Sb5 등)을 넘어 희토류 영구자석으로 카고메 물리학의 범위를 확장했습니다.", "unresolved": "강한 자기적 상호작용 속에서 베리 곡률이 구체적 기반 그래핀의 3차원 확장판으로서의 공유 결합 DSM을 실현했다는 점에서 위상물질의 범위를 확장했습니다.", "unresolved": "실제 물질의 페르미 준위 조절 및 결함에 의한 수송 특성 변화에 대한 정밀한 분석이 추가되어야 합니다.", "future_work": "이 물질에서의 양자 진동 측정 및 비정상 홀 효과 등 위상학적 수송 특성에 대한 후속 연구가 예상됩니다.", "concepts": [{"term": "디랙 반금속", "why_emerged": "에너지 밴드가 선형적으로 만나는 디랙 점을 통해 질량이 없는 페르미온을 고체 내에서 구현하기 위해 도입됨.", "origin": "2010년대 초반 위상 절연체 연구로부터 파생.", "connections": "그래핀, 위상 절연체, Weyl 반금속."}, {"term": "스핀리스(Spinless)", "why_emerged": "복잡한 스핀-궤도 결합 효과를 배제하고 위상학적 성질만을 분리하여 이해하기 위해 모델링됨.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "공유 결합 모델, 위상 밴드 구조."}], "english_summary": ["The authors report the material realization of 3D spinless, covalent-type Dirac semimetals.", "This provides a 3D analog to graphene, distinct from traditional spin-orbit-coupled Dirac semimetals.", "The study expands the class of topological materials by focusing on covalent bonding stabilization."]}}, {"title": "Terahertz Magneto-Photocurrents in the Topological Insulator Bi2Se3 Probe Its Topological Surface States", "journal": "PRL_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/yvbq-rdkz", "authors": "Chihun In, Genaro Bierhance, Deepti Jain, et al.", "last_authors": "Seongshik Oh, Tobias Kampfrath", "summary": "We study ultrafast magneto-photocurrents in a three-dimensional topological insulator. For this purpose, we excite ( In r Bi 1 − r ) 2 Se 3 thin films with a femtosecond laser pulse in the presence of an external magnetic field B ext up to 0.3 T parallel to the film plane. The resulting in-plane photocurrent is measured by detecting the emitted terahertz electromagnetic pulse. It is proportional and perpendicular to B ext . Strikingly, for r ≥ 4 % , we observe an abrupt photocurrent reduction, which is strongly correlated with the indium-induced quenching of the topological surface states. The rise time, decay time, and amplitude of the terahertz magneto-photocurrent can consistently be explained by the following scenario: optically excited spin-polarized electrons propagate toward the film surface where the accumulated spin is converted into an in-plane charge current due to spin-velocity locking. Our results are highly relevant for contact-free probing of spin-charge conversion in systems without spontaneous magnetic order and without having to add invasive spin-source layers.", "tier": "B_IMPORTANT_CONDMAT", "score": "9", "reason": "Experimental probe of topological surface states in Bi2Se3, a core material of interest.", "tags": ["experiment", "material", "topological-insulator"], "image": "", "briefing": {"background": "위상 절연체(TI)의 표면 상태는 스핀과 운동량이 고정된(spin-momentum locking) 독특한 구조를 가집니다. 이를 비침습적으로 측정하는 것은 TI의 소자 응용을 위해 매우 중요합니다.", "motivation": "Bi2Se3 표면 상태의 스핀-전하 변환 능력을 자기장 하에서 테라헤르츠(THz) 광전류 측정을 통해 직접적으로 탐구하고자 합니다.", "result": "외부 자기장에 반응하는 테라헤르츠 광전류가 표면 스핀 상태와 직접적으로 연관되어 있음을 확인했으며, 인듐 도핑으로 표면 상태를 억제했을 때 광전류가 급격히 감소함을 증명했습니다.", "implication": "접촉 없이도 위상 절연체의 스핀 수송 특성을 평가할 수 있는 효율적인 광학적 프로빙 기법을 확립했습니다.", "novelty": "복잡한 소자 제작 없이도 광학적 방식으로 TI의 스핀-전하 변환 효율을 측정했다는 점이 매력적이며, 자기 위상 물질 연구에 응용 가능합니다.", "unresolved": "인듐 도핑 외의 다른 결함 제어 방식에서도 동일한 광전류 거동이 나타나는지에 대한 체계적 비교가 필요합니다.", "future_work": "다양한 위상 절연체 및 강자성/TI 이질 구조에서 THz 자기-광전류 측정 기술을 확장 적용할 것으로 보입니다.", "concepts": [{"term": "스핀-운동량 잠김", "why_emerged": "위상 절연체의 표면에서 전자의 운동량 방향에 따라 스핀 방향이 고정되어 있음을 설명하기 위해 도입됨.", "origin": "Hasan & Kane(2010)의 위상 절연체 리뷰 논문 등에서 정립.", "connections": "스핀-궤도 결합, 위상 절연체, 스핀트로닉스."}, {"term": "테라헤르츠 광전류", "why_emerged": "펨토초 레이저 펄스를 이용해 고속의 전자 동역학 및 스핀 변환 과정을 직접적으로 측정하기 위해 사용됨.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "초고속 분광학, 시간 분해 ARPES."}], "english_summary": ["The paper uses THz magneto-photocurrents to probe the topological surface states of Bi2Se3 thin films.", "Results show that the photocurrent is linked to spin-momentum locking and is suppressed by indium doping.", "This technique provides a non-invasive way to study spin-charge conversion in topological materials."]}}, {"title": "Anomalous vortex shape in a frustrated superconductor hosting chiral multicomponent order parameters", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2306.06711", "authors": "Yuita Fujisawa, Anjana Krishnadas, Tomonori Nakamura, et al.", "last_authors": "Tadashi Machida, Yoshinori Okada", "summary": "Multicomponent chiral superconductors can host spatially separated superconducting components within a single Abrikosov vortex, leading to unconventional, anisotropic vortex shapes forbidden in conventional single-component superconductors. Here, using spectroscopic scanning tunneling microscopy at 0.3 K, we investigate the mixed state of the spinel superconductor LiTi2O4 (Tc = 13 K). In the low-field regime, where vortex-vortex interactions are minimized and the intrinsic single-vortex shape is preserved, reasonably isolated triangular Abrikosov vortices are directly visualized with high statistical significance. Remarkably, the vortex orientation is locked to crystallographic domains rather than the magnetic-field direction, revealing a hidden chirality selectivity embedded in the zero-field electronic state.", "tier": "B_IMPORTANT_CONDMAT", "score": "9", "reason": "High-interest STM/STS study of chiral Abrikosov vortices in the spinel superconductor LiTi2O4.", "tags": ["STM", "superconductor", "chirality"], "image": "https://arxiv.org/static/browse/0.3.4/images/arxiv-logo-fb.png", "briefing": {"background": "다성분(multicomponent) 초전도체는 단일 성분이 아닌 복수의 오더 파라미터가 공존하며, 이로 인해 자기장 하에서 형성되는 아브리코소프 와류(vortex) 구조가 기존 초전도체와 다르게 왜곡되거나 이방성을 보일 수 있습니다.", "motivation": "스피넬 초전도체 LiTi2O4에서 와류의 기하학적 형태를 직접 관찰하여 이 물질이 다성분 초전도성을 가지고 있는지, 그리고 그에 따른 키랄성(chirality)이 존재하는지 확인하고자 함.", "result": "극저온 STM을 통해 LiTi2O4의 와류를 관찰한 결과, 와류의 방향이 자기장 방향이 아닌 결정학적 도메인에 고정되어 있음을 확인하였습니다.", "implication": "이 결과는 영자기장 상태에서 내재된 전자적 키랄성이 존재함을 강력히 시사하며, 해당 물질이 기존 단일 성분 초전도 이론을 넘어선 물리적 성질을 가짐을 나타냅니다.", "novelty": "자기장 방향과 독립적인 와류 배향성을 직접 시각화함으로써, 초전도체 내 숨겨진 키랄 오더 파라미터와 결정 구조 간의 상관관계를 명확히 규명하였습니다.", "unresolved": "와류 내부의 구체적인 다성분 오더 파라미터의 결합 방식이나, 키랄성을 유도하는 미시적 메커니즘은 여전히 추가적인 이론적 모델링이 필요합니다.", "future_work": "키랄성을 직접 입증하기 위한 편광 의존적인 초전도 분광 실험이나, 다른 자기적 상태와의 결합을 탐구하는 실험이 뒤따라야 할 것입니다.", "concepts": [{"term": "Abrikosov vortex", "why_emerged": "제2종 초전도체에서 자기장이 침투할 때 양자화된 자기 다발을 유지하기 위해 형성됨.", "origin": "Alexei Abrikosov (1957).", "connections": "Ginzburg-Landau 이론, 초전도체 상태도."}, {"term": "Chiral superconductor", "why_emerged": "시간 반전 대칭성이 깨진 초전도 상태에서 위상학적 성질을 이해하기 위해 도입됨.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "위상학적 초전도체, TRSB(시간 반전 대칭 파괴)."}], "english_summary": ["Investigated vortex shapes in spinel LiTi2O4 superconductor using low-temperature STM.", "Observed that vortex orientation is locked to crystallographic domains, suggesting chiral order.", "Evidence points towards a multicomponent superconducting state beyond conventional theory.", "Vortex structure provides direct proof of hidden electronic chirality in the zero-field state."]}}, {"title": "Charge-Transfer Electronic Structure of NiX2 (X = S, Se)", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2609.02148", "authors": "Atsushi Hariki, Takaki Okauchi, Daisuke Takegami, et al.", "last_authors": "Takashi Mizokawa, Jan Kunes", "summary": "We investigate the electronic structures of NiS$_2$ and NiSe$_2$ using density functional theory combined with dynamical mean-field theory (DFT+DMFT). A realistic electronic structure within DFT+DMFT was determined by optimizing the double-counting correction to reproduce experimental valence-band photoemission spectra. The validity of the present model is further confirmed by its successful description of the Ni 2$p$ core-level photoemission and Ni $L$-edge x-ray absorption spectra of NiS$_2$. Our results reveal a smaller charge-transfer energy than previously assumed, resulting in substantial ligand-to-Ni charge transfer and a reduced Ni local moment. We clarify how the relative position and interaction between the Ni upper Hubbard band and  across the series."]}}, {"title": "Composition-dependent bulk properties of intercalated transition metal dichalcogenides Co1/3(1)NbS2", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2603.26069", "authors": "Woonghee Cho, Kiwan Nam, Yeochan An, et al.", "last_authors": "Kee Hoon Kim, Je-Geun Park", "summary": "We report a systematic study of the composition-dependent bulk properties in $Co_{1/3(1\\pm\\delta)}NbS_{2}$ single crystals across a series of precisely controlled cobalt compositions with -4%<$\\delta$<8%. By tuning the cobalt stoichiometry, we find that the topological Hall effect is critically sensitive to the intercalant cobalt composition and is completely suppressed when the cobalt composition exceeds $\\delta$=+4%. We observe that the longitudinal conductivity is also strongly influenced by the cobalt composition, reaching its maximum value just before the disappearance of the topological Hall effect. Furthermore, heat capacity measurements reveal distinct Sommerfeld coefficients ($\\gamma$) across different compositions, which exhibit a clear linear scaling with the inverse of the ordinary Hall coefficient ($R_H^{-1}$). These results demonstrate that composition tuning in $Co_{1/3(1\\pm\\delta)}NbS_{2}$ systematically modifies the low-energy electronic degree of freedom, moving beyond a simple dilute impurity picture. Finally, we use the microscopic spin Hamiltonian to explain the stability of experimentally observed M-point modulation vector and the corresponding triple-Q magnetic order. Our findings highlight that the topological properties of this system are highly tunable through precise control of the intercalant concentration, offering a new perspective on the competition between electronic and magnetic orders in intercalated transition-metal dichalcogenides.", "tier": "B_IMPORTANT_CONDMAT", "score": "9", "reason": "Direct hit on topological Hall effect and magnetic TMDs in an experimental single-crystal study." linear magnets with broken time-reversal symmetry, offering novel opportunities for spintronics beyond conventional magnets. Rather than from net magnetization, as in ferromagnets, the unconventional time-reversal symmetry breaking of altermagnets originates from antiferroic magnetic dipoles locked to higher-order multipoles. Here we report the direct visualization of a $g$-wave altermagnetic multipole in the canonical altermagnet CrSb. Combining high-energy synchrotron X-ray diffraction with valence electron density (VED) analysis, we uncover a pronounced directional anisotropy of the VED distribution alternating between Cr sublattices. This evidences the antiferroic order of electric hexadecapoles predicted in $g$-wave altermagnets. Its coexistence with antiferroic magnetic dipoles induces ferroic magnetic multipoles, as probed by polarized neutron diffraction. We further identify a microscopic model of altermagnetism that directly relates the $g$-wave multipole and the $g$-wave spin splitting. Through direct observation and quantification of multipoles, this study provides a real-space fingerprint of altermagnetism and establishes a general probe of hidden multipole order in quantum materials.", "tier": "B_IMPORTANT_CONDMAT", "score": "9", "reason": "Direct experimental observation of altermagnetic multipoles in CrSb, high relevance to user interests.", "tags": ["altermagnet", "material", "magnetism"], "image": "https://arxiv.org/html/2609.01969v1/Fig1.png", "briefing": {"background": "알터마그넷(Altermagnet)은 기존의 강자성(net magnetization 있음)이나 반강자성(time-reversal symmetry가 유지됨)과는 다르게, 자화가 없으면서도 시간-반전 대칭성이 깨져 있어 스핀 분할(spin splitting)이 나타나는 새로운 자기 질서 상태입니다.", "motivation": "알터마그넷의 핵심인 '비자성 다중극자(multipole) 질서'를 실제 물질에서 직접 시각화하여 이론적 예측을 검증하고자 했습니다.", "result": "고에너지 싱크로트론 X-선 회절과 원자가 전자 밀도 분석을 통해 CrSb에서 g-파형(g-wave) 알터마그넷의 특징인 전기 16극자(hexadecapole)의 반강자성 배열을 직접 관찰했습니다.", "implication": "알터마그네티즘이 단순히 이론적 개념에 머물지 않고 실제 결정 구조 내의 전하 분포와 자기적 다중극자의 상호작용임을 입증하여, 향후 숨겨진 질서를 찾는 새로운 실  graphene", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/q528-6vj2", "authors": "Elias Andrade, Alejandro Jimeno-Pozo, Pierre A. Pantaleón, Francisco Guinea, Gerardo G. Naumis", "last_authors": "Francisco Guinea, Gerardo G. Naumis", "summary": "Two-dimensional systems with flat bands support correlated phases such as superconductivity. While twisted moiré systems, like twisted bilayer graphene, have revealed such states, they remain complex to control. Here, we study monolayer graphene under uniaxial periodic strain, which forms a quasi-on…", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Correlated phases and superconductivity in strained 2D systems.", "tags": ["graphene", "superconductivity", "correlated"], "image": "", "briefing": {"background": "평탄한 에너지 밴드(flat bands)를 갖는 2차원 시스템은 전자 간 상호작용이 극대화되어 초전도나 자기 정렬 등 창발적 현상이 나타나는 핵심 플랫폼임.", "motivation": "모아레 격자 시스템의 복잡한 제어성을 극복하고자, 상대적으로 구현이 용이한 주기적 변형(strain)을 통한 그래핀의 상관 물리 유도.", "result": "단층 그래핀에 주기적인 단축 변형을 가함으로써 준-일차원적인 전하 텍스처를 형성하고, 이를 통해 초전도성이 발현될 가능성을 확인.", "implication": "복잡한 뒤틀림(twist) 공정 없이도 변형 공학(strain engineering)만으로 2차원 물질의 강상관 물성을 설계할 수 있음을 시사.", "novelty": "모아레가 아닌 변형을 이용한 밴드 평탄화 전략을 제시하여 초전도 구현의 새로운 플랫폼 가능성을 확장함.", "unresolved": "변형이 가해진 실제 샘플에서의 전하 밀도 파(CDW)와 초전도성 사이의 경쟁 관계가 명확히 기술되지 않음.", "future_work": "실제 STM을 이용한 로컬 상태 밀도 측정 및 초전도 전이 온도 계산을 통한 실험적 검증 필요.", "concepts": [{"term": "Flat bands", "why_emerged": "운동 에너지는 억제되고 상호작용 에너지가 지배적인 상태를 구현하기 위해 필수적.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "트위스트 이층 그래핀, 고온 초전도체 등 강상관 시스템과 밀접."}, {"term": "Strain engineering", "why_emerged": "외부 자극을 통해 물질의 대칭성을 깨뜨리고 전자 밴드 구조를 능동적으로 제어하기 위함.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "반도체 이종접합, 2D 물질 밴드갭 엔지니어링에 활용."}], "english_summary": ["We investigate correlation-driven phases in periodically strained monolayer graphene.", "The study shows that strain-induced flat bands support charge textures and superconductivity.", "This provides a scalable alternative to twisted moire systems for studying strongly correlated electrons."]}}, {"title": "Light-induced topological phase transitions and anomalous thermal transport in d-wave altermagnets", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/8x4v-gf3y", "authors": "Ayesha Maryam, Muzamil Shah, Kashif Sabeeh, Reza Asgari", "last_authors": "Kashif Sabeeh, Reza Asgari", "summary": "We study intrinsic thermal transport and Floquet-engineered topology in a two-dimensional d -wave altermagnetic topological insulator powered by linearly polarized light. We analyze the anomalous Hall, Nernst, and thermal Hall conductivities, as well as their spin-resolved equivalents, and develop closed-form formulas for the Berry curvature using an analytically calculated high-frequency effective Hamiltonian. We demonstrate that linearly polarized light, in contrast to conventional antiferromagnets, breaks the symmetry connecting spin sectors in altermagnets, allowing a series of spin-selective topological phase transitions from a quantum spin Hall state to a spin-polarized Chern insulator and finally to a trivial phase. The Nernst response shows substantial thermal activation and significant sensitivity to the gap size in the Chern domain, but both the electrical and thermal Hall responses become quantized and meet the anomalous Wiedemann-Franz law. Every anomalous transport coefficient exhibits a distinctive d -wave dependence on the polarization angle, reversing sign under orthogonal rotation and vanishing at symmetry-restoring directions. Our findings show a path to all-optical regulation of topological and caloritronic responses beyond traditional magnetic systems and establish thermal transport as a sensitive probe of altermagnetic order.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Direct relevance to altermagnets and transport properties.", "tags": ["altermagnet", "transport", "topological"], "image": "", "briefing": {"backgrou  에너지적 우위 관계는 추가 검증이 필요합니다.", "future_work": "더 높은 도핑 영역에서의 전이 현상과 실제 카고메 격자 시스템에 대한 파동함수 해석 적용이 기대됩니다.", "concepts": [{"term": "t-J 모델", "why_emerged": "모트 절연체 근처의 강한 상관관계를 다루기 위해 하버드 모델에서 이중 점유를 금지하여 유도됨.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "cuprates, high-Tc superconductivity"}, {"term": "루프 전류", "why_emerged": "평면 내에서 시간에 따른 궤도 전류가 발생하여 자기적 질서를 형성할 가능성을 설명하기 위해 제안됨.", "origin": "C.M. Varma (2006)", "connections": "TRSB, topological orders in kagome metals"}, {"term": "페이즈 스트링", "why_emerged": "도핑된 전자가 반강자성 배경을 이동할 때 발생하는 양자역학적 위상 인자를 정확히 계산하기 위해 도입됨.", "origin": "Zheng-Yu Weng", "connections": "Mott insulator physics"}], "english_summary": ["Constructed a variational wave function for the t-J model incorporating phase-string sign structures.", "Investigated the electronic states of single-hole and two-hole-doped Mott insulators.", "Identified signatures of minimal loop currents and cat states as key features.", "Provides a theoretical framework relevant to TRSB in correlated kagome and cuprate systems."]}}, {"title": "Observation of charge dressing in Bi4Te3 topological insulator thin films: A terahertz and infrared spectroscopic study", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/6kv9-46kx", "authors": "Veronica Stopponi, Johannes Schmidt, Andrea Perucchi, et al.", "last_authors": "Stefano Lupi, Paola Di Pietro", "summary": "Bi 4 Te 3 has been first realized as an element of the adaptive series ( Bi 2 ) m ( Bi 2 Te 3 ) n —deriving from stacking metallic Bi and topological insulator Bi 2 Te 3 blocks—and studied for its promising thermoelectric properties. Recently, Bi 4 Te 3 has also been found as a topological insulator hosting a complex band structure with three Dirac cones in k space. Here we report measurements of the optical conductivity of five Bi 4 Te 3 thin films with thickness varying from 11 to 32 nm. This extensive study, based on terahertz time-domain spectroscopy and Fourier-transform infrared spectroscopy, provides a broadband optical conductivity. By employing a Kramers-Kronig constrained Drude-Lorentz model, the spectral contributions to the optical conductivity of each sample have been singled out. In contrast to an ideal topological insulator—with perfectly insulating bulk—in Bi 4 Te 3 far-infrared and mid-infrared bands indicate the presence of localized massive carriers, which dope the bulk system, as also observed in chemically compensated single crystals of other bismuth-based topological insulators. In addition, the localized bulk charges strongly renormalize the electronic mass. The charge dressing enhances as the thickness increases, indicating a trivial metallic behavior of Bi 4 Te 3 thin films. This study elucidates the inner relationship between the optical properties of a topological insulator like Bi 4 Te 3 and its complex band structure, since the detection of the topological massless carriers by optical measurements is prevented by the occurrence of novel and unusual conductive properties.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Direct spectroscopic investigation of a topological insulator.", "tags": ["topological", "spectroscopy"], "image": "", "briefing": {"background": "위상 절연체(TI)는 내부가 절연체이고 표면이 금속성 상태를 유지하는 물질로, 벌크의 전도성이 낮을수록 위상 표면 상태를 관측하기 유리합니다.", "motivation": "Bi4Te3 박막이 복잡한 밴드 구조와 3개의 디락 콘을 가진다는 점에 주목하여, 실제 박막 내에서의 광학적 특성과 자유 전하의 거동을 분광학적으로 규명하고자 했습니다.", "result": "광학 전도도 측정 결과, 이상적인 위상 절연체와 달리 벌크 내에 국소화된 대질량 전하(massive carriers)가 존재하여 시스템 전체를 금속성으로 변화시킨다는 사실을 확인했습니다.", "implication": "위상 절연체 소자 제작 시 벌크의 도핑이나 결함으로 인한 '전하 드레싱(charge dressing)' 효과가 위상적 표면 상태의 측정을 방해할 수 있음을 시사합니다.", "novelty": "박막 두께를 조절하며 광학 전도도를 상세히 분석함으로써 위상 절연체의 표면 상태 관측이 왜 어려운지, 벌크의 기여가 어떻게 나타나는지를 체계적으로 설명했습니다.", "unresolved": "벌크의 국소화된 전하가 정확히 어떤 결정 결함이나 화학적 불균일성에 기인하는지에 대한 미시적 기원은 명확하지 않습니다.", "future_work": "도핑 제어를 통해 벌크 전도성을 억제하여 위상 상태를 회복시키는 최적화 실험이 필요합니다.", "concepts": [{"term": "전하 드레싱", "why_emerged": "전자가 주변 환경과 상호작용하여 유효 질량이 변하고 상태가 변하는 물리적 현상을 설명하기 위해 도입됨.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "Many-body interaction, effective mass renormalization"}, {"term": "Bi4Te3", "why_emerged": "열전 소자 및 위상적 특성을 가진 복합 블록 구조(Bi2, Bi2Te3 적층) 물질로서 주목됨.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "Topological insulators, Bi2Te3 family"}], "english_summary": ["Studied the optical conductivity of Bi4Te3 thin films using THz and FTIR spectroscopy.", "Revealed that bulk localized massive carriers dominate the electronic response.", "Observed mass renormalization effects that increase with film thickness.", "Indicates that bulk metallicity masks the topological surface states in these thin films."]}}, {"title": "Observation of subharmonic charge-density-wave correlations in La-based cuprates", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/djbs-mcz5", "authors": "J.-S. Lee, S. A. Kivelson, H. Lee, et al.", "last_authors": "M. Fujita, C.-C. Kao", "summary": "Suggestive but indirect evidence for pair-density-wave correlations has been reported in several high- T c cuprates, yet a bulk-sensitive scattering signature of the expected subharmonic charge response has remained elusive. Here, the authors use resonant soft x-ray scattering to identify a reproducible subharmonic charge density wave response near half the primary charge-ordering wave vector in two La-based cuprates. The response emerges in the stripe-ordered, layer-decoupled superconducting regime, where charge, spin, and superconducting correlations are intertwined.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Important X-ray scattering study on charge-density waves and correlations in cuprates.", "tags": ["CDW", "cuprate", "scattering"], "image": "", "briefing": {"background": "쿠프레이트(Cuprates) 초전도체에서는 초전도 상태와 경쟁하거나 공존하는 전하 밀도 파(CDW)가 흔히 발견되며, 이는 스트라이프(stripe) 상과 밀접한 관련이 있습니다.", "motivation": "간접적인 증거는 많았지만, 벌크 민감도가 높은 X-선 산란을 통해 CDW의 보조적인 성분인 서브하모닉(subharmonic) 응답을 직접 관측하고자 했습니다.", "result": "La 기반 쿠프레이트에서 주(primary) 전하 정렬 파동벡터의 절반 지점에서 재현 가능한 서브하모닉 CDW 응답을 포착했습니다.", "implication": "이러한 응답은 쿠프레이트 내에서 전하, 스핀, 초전도 상관관계가 서로 얽혀있음을 강력하게 뒷받침하며, 페어 밀도 파(PDW) 모델의 근거가 될 수 있습니다.", "novelty": "지금까지 관측이 어려웠던 서브하모닉 성분을 고해상도 공명 연성 X-선 산란으로 성공적으로 포착했다는 점에서 큰 의미가 있습니다.", "unresolved": "이 서브하모닉 응답이 초전도와 직접적인 관련이 있는지, 아니면 단순히 스트라이프 질서의 부차적인 물리적 현상인지에 대해서는 논쟁의 여지가 있습니다.", "future_work": "자기장 하에서의 변화를 관측하여 초전도와의 상관관계를 더욱 명확히 규명하는 실험이 필요합니다.", "concepts": [{"term": "서브하모닉 전하 밀도 파", "why_emerged": "기본 CDW 파동벡터 외에 시스템의 복잡한 정렬(스트라이프 등)로 인해 발생하는 배음 성분을 설명하기 위해 필요함.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "Pair-density-wave (PDW), stripe order"}, {"term": "공명 연성 X-선 산란", "why_emerged": "특정 원소의 궤도에 공명하여 전하/궤도 정렬을 민감하게 감지하기 위해 사용됨.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "Resonant elastic X-ray scattering (REXS)"}, {"term": "페어 밀도 파", "why_emerged": "초전도 질서 파라미터가 공간적으로 변조되는 상태를 설명하기 위해 제안됨.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "Cuprate superconductivity, intertwined order"}], "english_summary": ["Identified subharmonic charge-density-wave responses in La-based cuprates using resonant soft X-ray scattering.", "Observed signals at roughly half the primary charge-ordering wave vector.", "The results emerge in the stripe-ordered, superconducting regime.", "Provides evidence for intertwined charge, spin, and superconducting correlations."]}}, {"title": "Orientation-resolved magneto-optical conductivity and topological response in Rashba altermagnets", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/r1mk-glf1", "authors": "Chang Liu, Sha-Sha Ke, Yong Guo, Xiao-Tao Zu, Sean Li, Hai-Feng Lü", "last_authors": "Sean Li, Hai-Feng Lü", "summary": "Altermagnetism represents a novel magnetic phase combining zero net magnetization with momentum-dependent spin splitting. Here, we theoretically investigate the Landau levels and magneto-optical conductivity in $d$-wave altermagnets, explicitly incorporating the orientation of the
