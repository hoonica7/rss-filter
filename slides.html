<title>Daily Paper Slideshow</title>
<style>
  :root {
    color-scheme: light;
    --bg: #f6f7f4;
    --paper: #ffffff;
    --ink: #111827;
    --muted: #64748b;
    --line: #d8ddd2;
    --accent: #176b87;
    --accent-2: #9a3412;
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; overflow: auto; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: var(--bg); color: var(--ink); }
  .shell { max-width: 1500px; min-height: 100vh; margin: 0 auto; padding: 14px 18px; display: flex; flex-direction: column; }
  .topbar { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 16px; }
  .top-actions { display: flex; align-items: center; gap: 10px; }
  .topbar a, button { border: 1px solid var(--line); border-radius: 8px; background: var(--paper); color: var(--ink); padding: 10px 14px; font-weight: 700; text-decoration: none; cursor: pointer; }
  button.primary { background: var(--accent); border-color: var(--accent); color: white; }
  button:disabled { opacity: 0.45; cursor: not-allowed; }
  .counter { color: var(--muted); font-weight: 700; }
  .slide { min-height: calc(100vh - 82px); background: var(--paper); border: 1px solid var(--line); border-radius: 10px; padding: 18px; box-shadow: 0 18px 42px rgba(15, 23, 42, 0.10); display: grid; grid-template-columns: minmax(310px, 0.86fr) minmax(0, 1.55fr); gap: 18px; overflow: visible; }
  .paper-head { min-width: 0; min-height: 0; overflow: visible; display: flex; flex-direction: column; gap: 12px; }
  .figure { margin: 0; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: #f8fafc; }
  .figure img { display: block; width: 100%; max-height: 41vh; object-fit: contain; background: white; }
  .figure figcaption { padding: 7px 10px; color: var(--muted); font-size: 12px; line-height: 1.3; }
  .head-text { display: flex; flex-direction: column; gap: 9px; min-width: 0; }
  .badges { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .badge { border-radius: 999px; padding: 5px 9px; background: #eef2ff; color: #3730a3; font-size: 12px; font-weight: 800; }
  .score { background: #fee2e2; color: #991b1b; }
  h1 { margin: 0; font-size: 25px; line-height: 1.15; letter-spacing: 0; overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
  h1 a { color: inherit; text-decoration-color: rgba(23, 107, 135, 0.35); text-decoration-thickness: 2px; text-underline-offset: 4px; }
  h1 a:hover { color: var(--accent); text-decoration-color: var(--accent); }
  .meta, .authors, .why, .abstract { font-size: 13px; line-height: 1.45; }
  .meta, .authors { color: var(--muted); }
  .why strong, .abstract strong, .authors strong { color: var(--ink); }
  .authors { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .why { border-left: 4px solid var(--accent-2); padding-left: 10px; color: #374151; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .abstract { border-top: 1px solid var(--line); padding-top: 14px; color: #374151; }
  .original-abstract { border-top: 1px solid var(--line); padding-top: 10px; color: #374151; font-size: 11.5px; line-height: 1.35; overflow-wrap: anywhere; }
  .original-abstract strong { display: block; margin-bottom: 4px; color: var(--ink); }
  .tags { display: flex; flex-wrap: wrap; gap: 8px; }
  .tag { border-radius: 999px; padding: 4px 8px; background: #f1f5f9; color: #475569; font-size: 12px; font-weight: 700; }
  .head-text > .link { display: none; }
  .briefing { min-width: 0; min-height: 0; overflow: visible; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); grid-auto-rows: minmax(0, auto); align-content: start; gap: 11px 18px; border-top: 0; padding-top: 0; }
  .brief-section { min-width: 0; }
  .brief-section.wide { grid-column: 1 / -1; }
  .brief-section h2 { margin: 0 0 4px; font-size: 14px; line-height: 1.22; color: #0f766e; letter-spacing: 0; }
  .brief-section p, .brief-section li { margin: 0; font-size: 12.5px; line-height: 1.42; color: #1f2937; overflow-wrap: anywhere; }
  .brief-section ul { margin: 0; padding-left: 20px; }
  .concepts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 9px 14px; }
  .concept { border-top: 1px solid var(--line); padding-top: 7px; }
  .concept h3 { margin: 0 0 4px; font-size: 13px; color: #7c2d12; letter-spacing: 0; }
  .concept p { margin: 2px 0 0; font-size: 11.5px; line-height: 1.35; color: #374151; overflow-wrap: anywhere; }
  .concept b { color: #111827; }
  .link { color: var(--accent); font-weight: 800; text-decoration: none; }
  .empty { padding: 48px; background: var(--paper); border: 1px solid var(--line); border-radius: 12px; color: var(--muted); }
  @media (max-width: 860px) {
    .shell { padding: 14px; }
    .topbar, .top-actions { align-items: stretch; flex-direction: column; }
    .slide, .briefing, .concepts { grid-template-columns: 1fr; }
    .slide { min-height: auto; overflow: visible; display: grid; }
    h1 { font-size: 28px; }
  }
</style>

ddresses the elusive pairing symmetry in AV3Sb5 kagome superconductors.", "Proposes nonreciprocal impurity scattering as a diagnostic tool for pairing states.", "Aims to disentangle the complex interplay between CDW and superconductivity.", "Provides a theoretical framework for future STM and transport measurements."]}}, {"title": "Strain-induced Dynamic Spin-Phonon Coupling in Epitaxial RuO2 Films", "journal": "arXiv_CondMat", "source": "author whitelist", "link": "https://arxiv.org/abs/2509.23969", "authors": "In Hyeok Choi, Seung Gyo Jeong, Jae Hyuck Lee, et al.", "last_authors": "Bharat Jalan, Jong Seok Lee", "summary": "Magnetic order parameters in altermagnets can couple to quantized lattice vibration via both piezomagnetic and magnetoelastic effects, leading to the renormalization of phonon dispersion. Here, we demonstrate photo-induced dynamic frequency modulation of THz phonons excited in anisotropically-strained epitaxial RuO2 thin films using ultrafast coherent phonon spectroscopy and time-resolved magneto-optic Kerr effect measurement. A coherent oscillation of a transverse acoustic phonon appears in the sub-THz range with increasing film thickness above 4 nm due to local dislocation arising from the anisotropic strain relaxation, which hosts large non-zero shear strain. Interestingly, this phonon mode exhibits a time-varying mode hardening below ~ 500 K. Furthermore, an optical phonon oscillation emerges in magnetization dynamics of the photo-induced non-equilibrium state, and it becomes significantly softened near the critical temperature, while there is no observable magneto-optic signal in fully-strain-relaxed films. Such notable dynamic frequency modulations in acoustic and optical phonons offer an opportunity to manipulate phonons in the THz range through the spin-phonon coupling controlled by epitaxial design, which can inspire the new class of altermagnetic applications in the ultrafast quantum opto-spintronics.", "tier": "A_MUST_READ", "score": "10", "reason": "author whitelist: Changyoung Kim", "tags": ["STS", "altermagnet", "phonon"], "image": "https://arxiv.org/static/browse/0.3.4/images/arxiv-logo-fb.png", "briefing": {"background": "알터자성(Altermagnet)은 비자성체와 자성체의 중간적인 성질을 띠며, 역전 대칭과 시간 역전 대칭이 동시에 깨진 독특한 자기 위상입니다. 이들은 스핀-격자 결합을 통해 양자 소자 응용 가능성을 가집니다.", "motivation": "이방성 변형이 가해진 RuO2 에피택셜 박막에서 스핀-격자 결합이 THz 포논 모드와 어떻게 동적으로 상호작용하는지 규명하고자 합니다.", "result": "초고속 분광학을 사용하여 변형된 RuO2 박막에서 THz 포논 모드의 주파수 변조를 관찰했으며, 임계 온도 근처에서 광학 포논이 연화(softening)되는 현상을 확인했습니다.", "implication": "에피택셜 설계와 strain 제어를 통해 THz 영역의 포논을 스핀-격자 결합으로 제어할 수 있음을 입증하여, 초고속 양자 스핀트로닉스 구현 가능성을 높였습니다.", "novelty": "알터자성체에서 포논 주파수가 온도와 자기적 상태에 따라 가변적으로 변조됨을 직접 관찰했다는 점이 중요합니다.", "unresolved": "완전히 변형이 이완된 막에서는 신호가 관찰되지 않아, 격자 결함(dislocation)이 신호 발생에 미치는 물리적 기여도를 완전히 배제하기 어렵습니다.", "future_work": "다른 알터자성체 후보 물질들로 실험을 확장하고, 포논-스핀 결합을 정밀하게 제어하는 소자 구조 연구가 예상됩니다.", "concepts": [{"term": "알터자성 (Altermagnet)", "why_emerged": "강자성이나 반강자성과는 다른, k-공간에서 비대칭적인 스핀 분할을 가지는 새로운 자기 위상을 기술하기 위해 도입.", "origin": "최근 5년 내 이론적으로 제안됨(예: Šmejkal et al.)", "connections": "반강자성, 비반전 대칭성, 스핀-궤도 결합"}, {"term": "Coherent Phonon Spectroscopy", "why_emerged": "펨토초 단위의 레이저 펄스를 사용하여 물질 내 격자 진동을 실시간으로 추적하기 위해 개발.", "origin": "1980년대 후반~90년대 초반 초고속 분광학의 발전과 함께 정립됨", "connections": "초고속 시간 분해 분광, Raman 산란, 자기 광학 커 효과(MOKE)"}], "english_summary": ["Investigates spin-phonon coupling in altermagnetic RuO2 thin films.", "Demonstrates time-varying THz phonon frequency modulation via epitaxial strain.", "Observes phonon softening near the magnetic critical temperature.", "Proposes epitaxial engineering for ultrafast opto-spintronic applications."]}}, {"title": "Triple-well ferroelectricity and a kagomelike Chern flat band in two-dimensional multiferroic CuVP2Se6", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/jkkw-5bzw", "authors": "Brian Anchico, Jingyi Duan, Haojie Sun, Minjun Wang, Mikhail Talanov, Wei Jiang", "last_authors": "Mikhail Talanov, Wei Jiang", "summary": "Two-dimensional multiferroics that host nontrivial topological bands offer a rich platform for correlated and tunable quantum phenomena, yet such materials remain rare. Here, using first-principles calculations, we reveal that monolayer ${\\mathrm{CuVP}}_{2}{\\mathrm{Se}}_{6}$ unites a tunable triple-…", "tier": "A_MUST_READ", "score": "9", "reason": "Combines kagome physics, Chern bands, and flat band electronic structure in a real 2D material.", "tags": ["DFT", "kagome", "flatband"], "image": "", "briefing": {"background": "다강체(multiferroic)는 전기적 분극과 자기적 질서가 공존하는 물질로, 위상적 밴드 구조와 결합하면 양자 정보 처리에 유용한 플랫폼이 될 수 있습니다.", "motivation": "2차원 다강체 물질에서 카고메 격자와 유사한 구조를 가진 전자 밴드 구조가 어떤 위상적 특성을 나타내는지 조사하고자 합니다.", "result": "DFT 계산을 통해 CuVP2Se6 단층이 삼중 우물형 강유전성과 카고메 유사 Chern 플랫 밴드를 동시에 가짐을 확인했습니다.", "implication": "이 물질은 강유전성과 토폴로지 특성을 동시에 제어할 수 있어, 위상적 상관 전자계 연구를 위한 새로운 2D 플랫폼이 될 것입니다.", "novelty": "다강체 특성과 카고메 기반의 평탄 밴드(flat band) 물리가 단일 2D 물질에서 발견되었다는 점이 매우 고무적입니다.", "unresolved": "계산 결과가 실제 물질의 실험적 합성과 ARPES 측정을 통해 검증될 필요가 있습니다.", "future_work": "박리법을 통한 시료 준비 및 ARPES를 이용한 밴드 분산 구조 직접 측정과 수송 특성 연구가 필요합니다.", "concepts": [{"term": "카고메 유사 Chern 플랫 밴드", "why_emerged": "카고메 격자의 위상적 특성과 상호작용이 강한 플랫 밴드를 결합하여 강상관 위상 상태를 구현하기 위해 필요함.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "분수 양자 홀 효과, 강상관 전자계, Berry 곡률"}, {"term": "다강체 (Multiferroic)", "why_emerged": "전기적(분극) 특성과 자기적(자화) 특성을 하나의 물질에서 제어하여 새로운 메모리 소자 등을 만들기 위함.", "origin": "1960년대 구소련 연구진의 선구적 연구", "connections": "강유전체, 강자성체, 자기-전기 효과(Magnetoelectric effect)"}], "english_summary": ["Identifies CuVP2Se6 as a 2D multiferroic with kagome-like Chern flat bands.", "Uses DFT to predict the coexistence of ferroelectricity and topological band structures.", "Highlights the potential for tuning correlated quantum phenomena in 2D systems.", "Suggests a new platform for exploring the intersection of multiferroics and band topology."]}}, {"title": "Magnetic-Field-Induced Tomonaga-Luttinger Liquid and Bose-Einstein Condensate Phases in an Organic S=1 Haldane Chain", "journal": "PRL_Recent", "source": "keyword", "link": "http://link.aps.org/doi/10.1103/89k5-p261", "authors": "Ivan Jakovac, Mihael S. Grbić, Maxime Dupont, et al.", "last_authors": "Masashi Takigawa, Mladen Horvatić", "summary": "Researchers have gained access to the rich physics of a landmark model magnet by assembling a crystal out of organic magnetic molecules.", "tier": "A_MUST_READ", "score": "9", "reason": "title strong match: Luttinger liquid", "tags": ["Luttinger"], "image": "", "briefing": {"background": "저차원 양자 자성체에서 스핀 사슬(Spin chain) 모델은 상호작용하는 전자들의 집합적 들뜸을 이해하는 핵심 플랫폼입니다. 특히 정수 스핀 사슬에서의 Haldane 갭과 비정수 스핀 사슬에서의 Tomonaga-Luttinger 액체(TLL) 거동은 강상관 전자계의 근본적인 문제 중 하나입니다.", "motivation": "유기 분자 기반의 S=1 Haldane 사슬 물질에서 자기장을 가해 시스템의 에너지 준위를 제어하고, 이를 통해 TLL 및 보즈-아인슈타인 응축(BEC) 상태로의 전이를 실험적으로 관측하고자 했습니다.", "result": "외부 자기장을 사용하여 Haldane 갭을 닫고, 고전적인 자성 상태가 아닌 양자 임계 상태인 TLL과 BEC 상을 성공적으로 유도하고 그 특성을 확인했습니다.", "implication": "잘 제어된 유기 분자 자성체가 복잡한 양자 상전이를 연구하는 깨끗한 모델 시스템이 될 수 있음을 보여주며, 저차원 강상관 물질의 양자 상태 제어 가능성을 입증했습니다.", "novelty": "Haldane 사슬 물질에서 TLL과 BEC라는 서로 다른 양자 위상 간의 경쟁과 전이를 실험적으로 명확히 분리해낸 점이 중요하며, 이는 저차원 물질의 비페르미 액체 거동 연구에 중요한 기초 데이터가 됩니다.", "unresolved": "이러한 상전이가 구체적으로 어떤 미시적 스핀 상호작용의 비등방성에 의해 결정되는지에 대한 완벽한 정량적 설명은 추가적인 이론 모델링이 필요합니다.", "future_work": "더 낮은 온도와 더 강한 자기장에서 나타날 수 있는 다른 양자 위상들을 탐색하고, 비공명 비탄성 산란을 통한 동역학적 특성 분석이 예상됩니다.", "concepts": [{"term": "Tomonaga-Luttinger Liquid", "why_emerged": "1차원 시스템에서는 페르미 액체 이론이 붕괴되어 전하와 스핀이 분리되는 현상을 설명하기 위해 도입되었습니다.", "origin": "Tomonaga(1950)와 Luttinger(1963)에 의해 제안됨.", "connections": "스핀-전하 분리, 1차원 양자 와이어 연구와 직결됨."}, {"term": "Haldane Gap", "why_emerged": "정수 스핀 사슬이 무질서한 상태(disordered state)를 가지며 에너지 갭이 존재하는 이유를 설명하기 위해 필요했습니다.", "origin": "F.D.M. Haldane(1983)이 제안.", "connections": "토폴로지적 절연체 및 SPT(Symmetry Protected Topological) 상과 연결됨."}], "english_summary": ["The study explores a S=1 organic Haldane chain magnet under external magnetic fields.", "Researchers successfully induced Tomonaga-Luttinger Liquid and Bose-Einstein Condensate phases.", "The work provides a clean experimental platform to study quantum phase transitions in low-dimensional systems.", "Results demonstrate the high tunability of organic molecular magnets for quantum state engineering."]}}, {"title": "Structural Phase Separation Couples to Charge-Density-Wave Formation in Kagome Metal FeGe", "journal": "PRL_Recent", "source": "keyword", "link": "http://link.aps.org/doi/10.1103/tqqs-s1r6", "authors": "Boyang Zhao, Youngjun Ahn, Qinwen Deng, et al.", "last_authors": "Liang Wu, Haidan Wen", "summary": "Temperature-dependent high-resolution synchrotron X-ray diffraction reveals structural Bragg peak splits in FeGe at the charge-density-wave transition temperature suggesting that its quantum states may be manipulated with strain.", "tier": "A_MUST_READ", "score": "9", "reason": "title strong match: kagome metal", "tags": ["kagome"], "image": "", "briefing": {"background": "Kagome 금속 AV3Sb5 계열에서 관측되는 전하밀도파(CDW)는 전자-격자 결합과 전자 상관관계의 미묘한 균형에 의해 결정됩니다. 특히 FeGe와 같은 자성 Kagome 물질에서는 CDW와 자기적 정렬의 상호작용이 전자 구조 연구의 핵심입니다.", "motivation": "FeGe에서 발생하는 CDW 전이 온도에서 구조적 상분리가 동반되는지, 그리고 이것이 물질의 양자 상태 제어와 어떤 관계가 있는지 밝히고자 했습니다.", "result": "고분해능 싱크로트론 X선 회절을 통해 CDW 전이 시 발생하는 구조적 Bragg 피크의 갈라짐(split)을 관측하여, CDW 형성이 구조적 왜곡 및 상분리와 밀접하게 연결되어 있음을 증명했습니다.", "implication": "Kagome 격자의 왜곡이 전자 구조를 직접적으로 수정할 수 있음을 의미하며, 스트레인이나 외부 응력을 통해 시스템의 양자 위상을 조절할 수 있는 경로를 제시합니다.", "novelty": "FeGe에서 구조적 불연속성을 정밀하게 포착했다는 점은 이 물질의 CDW가 단순한 전자적 현상이 아닌 구조적 자유도를 강하게 수반함을 시사하며, 이는 향후 ARPES나 STM 연구 시 격자 효과를 반드시 고려해야 함을 의미합니다.", "unresolved": "관측된 구조적 상분리가 CDW의 근본 원인인지 아니면 CDW로 인한 결과물인지에 대한 선후 관계는 아직 명확하지 않습니다.", "future_work": "스트레인을 가한 상태에서의 ARPES 측정을 통해 구조 왜곡이 페르미 표면 및 밴드 구조에 미치는 영향을 직접 측정하는 것이 필요합니다.", "concepts": [{"term": "Kagome Metal", "why_emerged": "기하학적 좌절(frustration)이 존재하는 격자에서 평탄한 밴드(flat band)와 반-디락(semi-Dirac) 포인트를 구현하기 위해 연구됨.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "AV3Sb5, FeGe 등 위상 물리와 상관계 물질의 교차점."}, {"term": "Charge-Density-Wave (CDW)", "why_emerged": "전자 밀도가 공간적으로 주기적인 변조를 일으키는 바닥 상태를 설명하기 위해 도입됨.", "origin": "Peierls(1955)가 1차원 금속 불안정성으로 제안.", "connections": "전자-포논 결합, 페르미 표면 중첩(nesting)."}], "english_summary": ["High-resolution synchrotron X-ray diffraction reveals structural Bragg peak splitting in FeGe.", "Structural phase separation occurs concurrently with CDW formation.", "The result suggests strong coupling between lattice distortions and electronic order in Kagome metals.", "Potential for strain-based manipulation of quantum states in FeGe is highlighted."]}}, {"title": "Altermagnetism produces pair emission and absorption from dark excitons and magnons in La2O3Mn2Se2", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2609.36128", "authors": "Birender Singh, Xian Xu, Sabrina R. Hatt, et al.", "last_authors": "Huiwen Ji, Kenneth S. Burch", "summary": "Altermagnets’ (AMs) non-relativistic spin splitting enables novel states, spintronic and magneto-optical devices, though their optical signatures remain elusive. Here, we report exciton-magnon emission and absorption: optical sidebands from a spin-forbidden dark exciton, a direct consequence of altermagnetic symmetry. Combined optical spectroscopy and first-principles calculations reveal that La 2 ​ O 3 ​ Mn 2 ​ Se 2 \\text{La}{\\vphantom{\\text{X}}}_{\\smash[t]{\\text{2}}}\\text{O}{\\vphantom{\\text{X}}}_{\\smash[t]{\\text{3}}}\\text{Mn}{\\vphantom{\\text{X}}}_{\\smash[t]{\\text{2}}}\\text{Se}{\\vphantom{\\text{X}}}_{\\smash[t]{\\text{2}}} is an altermagnetic insulator, hosting a strongly bound, spin-forbidden dark exciton and a higher-energy bright exciton. Photoluminescence (PL) and absorption reveal mirror-image sidebands, Stokes-shifted in emission and anti-Stokes-shifted in absorption, symmetric about the dark exciton, whose energy shifts and spectral shapes match the magnon energy scale and density of states measured independently by inelastic neutron scattering. The PL intensity tracks the full equal-time spin-spin correlator, combining static and dynamical contributions, and rules out alternative processes. This directly couples PL to magnetism, with potential for magneto-optical devices. These results establish exciton-magnon spectroscopy as a new route for optically identifying and exploiting AMs.", "tier": "A_MUST_READ", "score": "9", "reason": "Optical and neutron scattering evidence for altermagnetism and exciton-magnon sidebands in a new insulator.", "tags": ["material", "altermagnetism", "neutronscattering", "spectroscopy"], "image": "https://arxiv.org/html/2609.36128v2/Figure1.png", "briefing": {"background": "Altermagnetism(AM)은 강자성도 반강자성도 아닌 새로운 자기적 위상으로, 결정 대칭성에 의해 스핀 분할이 일어나는 물질입니다. 이를 광학적으로 식별하는 것은 스핀트로닉스 구현을 위해 필수적입니다.", "motivation": "La2O3Mn2Se2에서 나타나는 독특한 광학 사이드밴드 현상을 통해 altermagnetism의 증거를 찾고, 이를 엑시톤-마그논 상호작용과 연결하고자 했습니다.", "result": "PL 및 흡수 분광학을 통해 엑시톤-마그논 사이드밴드를 관측했으며, 이들의 에너지가 비탄성 중성자 산란으로 확인된 마그논 에너지와 일치함을 보였습니다.", "implication": "광학 분광학이 altermagnet을 식별하는 강력한 도구가 될 수 있음을 입증하며, 스핀-금지 암흑 엑시톤의 존재가 altermagnetic 대칭성과 직접 연결됨을 확인했습니다.", "novelty": "AM 물질의 스핀 분할을 광학적인 방법(엑시톤-마그논 결합)으로 입증했다는 점은 전자 구조 연구자들에게 새로운 측정 기법(광학적 AM 탐지)을 제공합니다.", "unresolved": "엑시톤과 마그논 사이의 결합 강도가 정확히 어떤 스핀-궤도 상호작용 또는 교환 상호작용에 기인하는지에 대한 이론적 미세 조정이 필요합니다.", "future_work": "이 물질을 이용한 초고속 스핀트로닉 소자 테스트 및 다른 AM 물질로의 스펙트럼 확장 적용이 예상됩니다.", "concepts": [{"term": "Altermagnetism", "why_emerged": "반강자성과 유사한 자기 정렬을 가지면서도 스핀 분할을 보이는 새로운 자기 상태를 분류하기 위해 필요.", "origin": "最近의 이론적 연구들(Jungwirth, MacDonald 등 그룹)에 의해 정립.", "connections": "스핀-궤도 토크, 비상대론적 스핀 분할."}, {"term": "Exciton-Magnon Spectroscopy", "why_emerged": "빛과 자기적 들뜸(마그논)의 결합을 통해 물질의 자성 정보를 광학적으로 추출하기 위해 필요.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "강상관 전자계의 광학 분광학, 엑시톤 극성자(exciton-polariton)."}], "english_summary": ["La2O3Mn2Se2 is identified as a new altermagnetic insulator.", "Exciton-magnon sidebands in optical spectra confirm the altermagnetic symmetry.", "Optical spectroscopy matches inelastic neutron scattering data for magnon energies.", "The study establishes optical methods for identifying and exploiting altermagnets."]}}, {"title": "Selective suppression of electronic orders via interlayer coupling in superconducting bilayer nickelate thin films", "journal": "arXiv_CondMat", "source": "author whitelist", "link": "https://arxiv.org/abs/2610.01757", "authors": "Ziao Han, Lifen Xiang, Tianren Wang, et al.", "last_authors": "X. J. Zhou, Zhihai Zhu", "summary": "The discovery of spin-density-wave (SDW) order in bilayer nickelates has intensified interest in its interplay with superconductivity. Unlike cuprates, where doping rapidly suppresses the N\\'eel temperature, the SDW transition temperature ($T_{\\mathrm{SDW}}$) in bilayer nickelates is robust against oxygen annealing and even increases under pressure. Here, we combine oxygen annealing with isovalent rare-earth ($A$-site) substitution to effectively apply $c$-axis uniaxial pressure, realizing superconducting bilayer nickelate films with $T_{\\mathrm{SDW}}$ suppressed from 150 K to 70 K. Notably, while SDW order is weakened but remains, a second charge-like anisotropy order is completely eliminated in the superconducting state. Polarization-resolved O $K$-edge X-ray absorption and electronic structure calculations show that strengthened interlayer coupling reconstructs the Fermi surface and weakens the SDW. These findings, consistent with a spin-spinless stripe ground state, provide new insight into the mechanism of density wave formation and their interplay with superconductivity.", "tier": "A_MUST_READ", "score": "9", "reason": "author whitelist: X. J. Zhou", "tags": ["cuprate", "nickelate", "superconduct", "Fermisurface"], "image": "https://arxiv.org/html/2610.01757v1/FIG1.png", "briefing": {"background": "구리 산화물(cuprate)과 유사한 결정 구조 및 전자 배치를 가진 니켈레이트(nickelate)는 새로운 고온 초전도체 후보로 큰 관심을 받고 있습니다. 특히 이층(bilayer) 니켈레이트 시스템에서는 압력이나 도핑에 의해 초전도와 스핀 밀도 파동(SDW) 사이의 복잡한 경쟁과 공존이 나타나며, 이를 이해하는 것이 초전도 메커니즘 규명의 핵심입니다.", "motivation": "구리 산화물과 달리 이층 니켈레이트의 SDW는 압력에 의해 오히려 전이 온도가 상승하는 등 독특한 강인함을 보입니다. 본 연구는 산소 어닐링과 희토류 원소 치환을 통한 화학적 압력(c-축 유축 압력 효과)을 결합하여, SDW를 효과적으로 제어하고 초전도 상태와의 상관관계를 규명하고자 했습니다.", "result": "연구팀은 SDW 전이 온도를 150K에서 70K까지 낮추는 데 성공했으며, 초전도 상태에서 특정 전하형 이방성 질서(charge-like anisotropy order)가 완전히 사라짐을 확인했습니다. X-선 흡수 분광법(XAS)과 전자 구조 계산을 통해 층간 결합(interlayer coupling)이 강화되면서 페르미면이 재구성되고 이것이 SDW를 약화시키는 기작임을 밝혔습니다.", "implication": "강화된 층간 결합이 전자 질서를 선택적으로 억제할 수 있음을 보여주며, 이는 니켈레이트의 바닥 상태가 'spin-spinless stripe' 모델과 일치함을 시사합니다. 이는 초전도와 밀도 파동 간의 층간 결합 매개적 상호작용을 이해하는 새로운 틀을 제공합니다.", "novelty": "이층 니켈레이트 박막에서 층간 결합의 정밀 제어를 통해 전자 구조를 변조하고, 이를 초전도 및 다른 질서들의 경쟁 관계와 연결 지은 점이 돋보입니다. 특히 저명한 ARPES 전문가인 X. J. Zhou 그룹의 참여로 전자 구조적 해석의 신뢰도가 높으며, 사용자의 관심사인 니켈레이트 전자 구조와 직접 연관됩니다.", "unresolved": "SDW는 약화되었지만 여전히 초전도와 공존하고 있으며, 완전히 제거되었을 때의 순수 초전도 상(pure superconducting phase)의 특성에 대해서는 추가 연구가 필요합니다.", "future_work": "강화된 층간 결합 하에서 페르미면의 변화를 ARPES 등을 통해 직접 관측하고, 다양한 치환 농도에 따른 양자 임계점 부근의 물성 변화를 탐색할 것으로 보입니다.", "concepts": [{"term": "Spin-density-wave (SDW)", "why_emerged": "전자들 사이의 상호작용으로 인해 스핀 밀도가 공간적으로 주기적인 변조를 일으키는 현상을 설명하기 위해 등장했습니다.", "origin": "A. Overhauser (1962년 제안)", "connections": "반강자성, 구리 산화물 초전도체, 페르미면 네스팅(nesting)"}, {"term": "Interlayer coupling", "why_emerged": "다층 구조 물질에서 층 사이의 전자적/자기적 교환 상호작용이 전체 물성에 미치는 영향을 이해하기 위해 중요해졌습니다.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "층간 터널링, 결합된 양자 우물, 3차원 전자 구조 형성"}, {"term": "Spin-spinless stripe", "why_emerged": "강상관 계에서 스핀과 전하의 공간적 분리 현상을 설명하기 위한 특수한 질서 형태입니다.", "origin": "초록 정보만으로는 특정하기 어려움 (스트라이프 이론의 변형)", "connections": "전하 밀도 파동(CDW), 구리 산화물의 스트라이프 질서"}, {"term": "Chemical pressure", "why_emerged": "외부 장비 없이 격자 상수를 조절하여 물리적 압력 효과를 모방하기 위해 도입된 실험적 방법입니다.", "origin": "고체화학 및 재료과학 초창기부터 활용", "connections": "이소발렌트 치환, 격자 변형, 상도표 제어"}], "english_summary": ["The study demonstrates selective suppression of electronic orders in bilayer nickelate thin films using oxygen annealing and A-site substitution.", "Strengthened interlayer coupling is identified as the key mechanism for Fermi surface reconstruction and the weakening of SDW order.", "A charge-like anisotropy order is completely eliminated in the superconducting state, while SDW persists with a reduced transition temperature.", "The results support a spin-spinless stripe ground state model, providing insights into the interplay between density waves and superconductivity."]}}, {"title": "Stacking-Controlled Altermagnetism and Topological Magnons in Bilayer CrI3", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2610.00479", "authors": "Lu Xiao, Meng-Han Zhang, Dao-Xin Yao", "last_authors": "Meng-Han Zhang, Dao-Xin Yao", "summary": "Stacked van der Waals magnets provide a tunable route to altermagnetism, a compensated magnetic order characterized by momentum-dependent spin splitting, and to the topological magnetic excitations that such order can host. In bilayer CrI$_3$, first-principles calculations and linear spin-wave theory reveal stacking-controlled altermagnetic order and associated magnon band topology. Combining band-representation analysis with calculations of the dynamic structure factor relevant to inelastic neutron scattering, we further characterize the chirally split topological magnons and quantify their energy corrections and lifetimes using a many-body Green's-function approach. The interlayer magnetic ground state is highly sensitive to the stacking geometry, thereby controlling the magnon band topology and transport responses. We further show that magnon--magnon interactions renormalize the magnon dispersion and dynamic structure factor, with a particular focus on magnon decay. Using van der Waals bilayer CrI$_3$ as a representative platform, our results establish stacking engineering as a structural route for tuning altermagnetism and associated topological magnon excitations, opening avenues toward stacking-controlled spintronic and magnonic devices.", "tier": "A_MUST_READ", "score": "9", "reason": "Combines altermagnetism, vdW magnets, and topological excitations with relevance to neutron scattering.", "tags": ["theory", "material", "altermagnetism"], "image": "https://arxiv.org/html/2610.00479v1/c1a.png", "briefing": {"background": "알터마그네티즘(Altermagnetism)은 총 자화가 0임에도 불구하고 모멘텀 공간에서 스핀 분할이 발생하는 제3의 자성 상태입니다. 2차원 반데르발스(vdW) 자성체는 이러한 새로운 자성 상태와 그에 따른 위상적 여기 현상을 연구하기에 최적인 플랫폼입니다.", "motivation": "Bilayer CrI3와 같은 적층형 vdW 자성체에서 적층 구조(stacking)가 어떻게 알터마그네틱 질서를 유도하고, 그에 수반되는 위상 마그논(topological magnon)의 특성을 결정하는지 이론적으로 규명하고자 했습니다.", "result": "제1원리 계산과 선형 스핀파 이론을 통해 Bilayer CrI3의 적층 방식이 알터마그네틱 질서를 제어함을 확인했습니다. 또한, 스핀-스플릿된 위상 마그논의 존재를 예측하고, 다체 그린 함수를 사용하여 마그논 간 상호작용에 의한 에너지 보정 및 수명(decay)을 정밀하게 계산했습니다.", "implication": "적층 구조 엔지니어링이 알터마그네티즘과 위상 마그논의 물성을 튜닝하는 실질적인 방법임을 입증했습니다. 이는 차세대 스핀트로닉스 및 마그노닉 소자 설계에 중요한 가이드라인을 제공합니다.", "novelty": "알터마그네티즘을 위상 마그논 및 그 다체 상호작용(magnon-magnon interaction)과 연결시킨 점이 매우 참신합니다. 특히 비탄성 중성자 산란(INS)으로 관측 가능한 동적 구조 인자를 계산하여 실험적 검증 가능성을 높였습니다.", "unresolved": "이론적 예측인 만큼, 실제 실험에서 다양한 적층 구조를 원자 단위로 제어하며 알터마그네틱 스핀 분할을 직접 관측하는 과제가 남아 있습니다.", "future_work": "실제 CrI3 샘플에 대한 비탄성 중성자 산란 실험이나 광학적 수단을 통한 위상 마그논 모드의 검증이 기대됩니다.", "concepts": [{"term": "Altermagnetism", "why_emerged": "강자성(FM)의 스핀 분할과 반강자성(AFM)의 순자화 0 특성을 동시에 갖는 새로운 자성 분류가 필요해지면서 등장했습니다.", "origin": "L. Šmejkal, J. Sinova, T. Jungwirth 등 (최근 2-3년 내 정립)", "connections": "스핀 홀 효과, 자기 수송 현상, 위상 자기학"}, {"term": "Topological Magnon", "why_emerged": "전자계의 위상 절연체 개념을 자성체의 스핀 파(spin wave) 여기로 확장하기 위해 연구되었습니다.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "베리 곡률, 마그논 홀 효과, 가장자리 모드"}, {"term": "Stacking Engineering", "why_emerged": "2차원 물질을 쌓는 각도나 방식을 조절하여 층간 상호작용을 바꾸고 새로운 물리 현상을 유도하기 위해 사용됩니다.", "origin": "모아레(Moiré) 물리 및 트위스트로닉스 확산과 함께 중요성 증대", "connections": "트위스트 바이레이어 그래핀, 반데르발스 헤테로 구조"}, {"term": "Dynamic Structure Factor", "why_emerged": "물질 내의 여기 상태(마그논, 포논 등)가 중성자나 X-선과 어떻게 상호작용하는지 정량화하기 위해 도입되었습니다.", "origin": "Van Hove (1954 니다.", "implication": "LuNb6Sn6가 Kagome 격자 특유의 전자 구조를 실제로 보유하고 있음을 실험적으로 증명하였으며, 다른 Kagome 시스템과의 비교 연구를 위한 기초 데이터를 제공합니다.", "novelty": "LuNb6Sn6라는 새로운 Kagome 화합물에 대해 가장 정밀한 실험적 페르미면 지도를 제시했다는 점이 중요합니다. 사용자의 관심사인 Kagome 금속의 전자 구조 연구와 직접적으로 맞닿아 있습니다.", "unresolved": "초록에는 명시되지 않았으나, 이 물질에서 전하 밀도 파동(CDW)이나 초전도성과 같은 집단 현상이 나타나는지, 그리고 위상적 특성과의 연결고리가 무엇인지에 대한 심층 연구가 필요합니다.", "future_work": "ARPES를 통한 직접적인 밴드 구조 관측과 외부 압력 또는 도핑에 따른 페르미면 변화 연구가 뒤따를 것으로 예상됩니다.", "concepts": [{"term": "Kagome Metal", "why_emerged": "기하학적 좌절(frustration)이 있는 격자에서 나타나는 독특한 양자 상태를 탐구하기 위해 중요해졌습니다.", "origin": "일본의 대나무 바구니 패턴에서 유래, 고체 물성에서는 1950년대부터 이론적 관심", "connections": "플랫 밴드, 위상 반금속, 분수 양자 홀 효과"}, {"term": "de Haas–van Alphen (dHvA) oscillations", "why_emerged": "강한 자기장 하에서 물질의 자기화가 주기적으로 변하는 현상을 통해 페르미면의 단면적을 측정하기 위해 사용됩니다.", "origin": "W. J. de Haas, P. M. van Alphen (1930)", "connections": "양자 진동, 페르미면, 사이클로트론 운동"}, {"term": "Fermiology", "why_emerged": "금속의 전기적, 자기적 성질을 결정하는 페르미면의 모양과 전자들의 거동을 체계적으로 연구하기 위해 확립된 분야입니다.", "origin": "현대 고체물리학의 정립과 함께 발전", "connections": "ARPES, 양자 진동, 볼츠만 수송 이론"}, {"term": "Torque magnetometry", "why_emerged": "매우 작은 샘플이나 강한 비등방성을 가진 물질의 자기적 전이를 정밀하게 측정하기 위해 개발되었습니다.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "자기 비등방성, 캔틸레버 측정, 양자 진동 관측"}], "english_summary": ["The study provides a comprehensive investigation of the fermiology in the new kagome metal LuNb6Sn6.", "Using de Haas-van Alphen oscillations and torque magnetometry, multiple Fermi pockets and their effective masses were mapped.", "The experimental data confirm the kagome-related electronic structure predicted for this compound.", "This work establishes a foundational electronic profile for LuNb6Sn6, aiding in the search for collective electronic orders in this class of materials."]}}, {"title": "First-principles study of Weyl nodal loops and multiple Weyl points in trigonal PtBi2", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/l1ft-gzyd", "authors": "Lin-Lin Wang", "last_authors": "Lin-Lin Wang", "summary": "The coexistence of surface superconductivity and Fermi arcs in trigonal $γ\\text{−}\\mathrm{PtB}{\\mathrm{i}}_{2}$ has recently attracted attention for possible realization of topological superconductivity. The Fermi arcs on the two different (0001) surface terminations have been associated with the se…", "tier": "B_IMPORTANT_CONDMAT", "score": "9", "reason": "DFT of Weyl semimetal with Fermi arcs and topological superconductivity, strong user interest.; demoted from A: broad CM, not direct user/project hit", "tags": ["Weylsemimetal", "topologicalsuperconductivity", "DFT", "electronicstructure", "material"], "image": "", "briefing": {"background": "Weyl 준금속은 벌크의 에너지 밴드가 특정 점(Weyl point)에서 교차하며, 표면에서 페르미 아크(Fermi arc)라 불리는 독특한 상태를 형성하는 위상 물질입니다. 특히 PtBi2와 같은 물질은 이러한 위상 구조와 초전도성이 공존할 가능성 때문에 위상 초전도체 구현을 위한 유력한 후보로 거론됩니다.", "motivation": "최근 삼방정계(trigonal) γ-PtBi2에서 표면 초전도성과 페르미 아크가 동시에 관찰되어 주목받았으나, 이 물질의 벌크 밴드 구조에서 정확히 어떤 Weyl 노드나 루프가 페르미 아크를 생성하는지에 대한 이론적 규명이 필요했습니다.", "result": "제1원리 계산(DFT)을 통해 γ-PtBi2 내부의 복잡한 Weyl 노달 루프(nodal loops)와 다수의 Weyl 포인트의 존재를 확인했습니다. 특히 서로 다른 (0001) 표면 종단(termination)에서 관찰되는 페르미 아크가 벌크의 위상적 특징과 어떻게 연결되는지 구체적으로 매핑하였습니다.", "implication": "γ-PtBi2가 단순한 Weyl 준금속을 넘어, 초전도성과 결합된 다중 Weyl 노드 시스템임을 시사합니다. 이는 이 물질이 Weyl 노드 기인의 위상 초전도 현상을 연구하기 위한 플랫폼이 될 수 있음을 의미합니다.", "novelty": "기존의 다른 상과 차별화되는 삼방정계 구조에서의 Weyl 물리 및 페르미 아크 형성 메커니즘을 상세히 밝혔으며, 이는 독자의 관심사인 ARPES를 통한 페르미 아크 관측 데이터 해석에 직접적인 이론적 토대를 제공합니다.", "unresolved": "계산된 Weyl 구조가 실제 실험에서 관찰된 초전도 임계 온도나 갭의 비등방성과 어떻게 정량적으로 연결되는지에 대해서는 추가 연구가 필요합니다.", "future_work": "ARPES를 통한 계산된 Weyl 노드 및 노달 루프의 실험적 검증과, 이 물질의 위상 초전도 특성을 확인하기 위한 수송 특성 연구가 기대됩니다.", "concepts": [{"term": "Weyl Nodal Loop", "why_emerged": "밴드 교차가 점이 아닌 선(고리) 형태로 나타나는 위상 상태를 설명하기 위해 등장했습니다.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "Weyl semimetal, Berry phase, Nodal line semimetal"}, {"term": "Fermi Arc", "why_emerged": "Weyl 준금속의 표면에서 불연속적인 페르미 면이 나타나는 독특한 위상적 특성을 설명하기 위해 제  급격히 감소한다고 알려져 있습니다(Abrikosov-Gor'kov 이론). 하지만 최근 일부 격자 구조에서는 이러한 민감도가 낮게 관찰되는 예외적인 상황이 보고되고 있습니다.", "motivation": "Lieb 격자와 kagome 격자(예: AV3Sb5 계열)에서 d-wave 초전도성이 관찰됨에도 불구하고 무질서에 의한 Tc 억제가 매우 약하게 나타나는 원인을 이론적으로 설명하고자 했습니다.", "result": "특정 격자 기하학(Lieb, Kagome)에서 d-wave 초전도 상태가 무질서에 대해 s-wave와 유사한 수준의 보호(protection)를 받는다는 것을 입증했습니다. 이는 밴드 구조의 특수한 대칭성과 파동함수의 국소적 성질 때문임을 밝혀냈습니다.", "implication": "kagome 금속과 같은 물질에서 d-wave 초전도체가 비정상적으로 깨끗하지 않은 샘플에서도 살아남을 수 있는 근거를 마련했습니다. 이는 해당 물질들의 초전도 메커니즘 해석에 중요한 전환점을 제공합니다.", "novelty": "독자의 핵심 관심사인 kagome 격자(CsV3Sb5 등)의 초전도 현상을 다루며, 무질서가 비전통적 초전도를 반드시 파괴하지 않을 수 있다는 새로운 시각을 제시합니다.", "unresolved": "본 이론 모델이 실제 AV3Sb5 계열의 복잡한 멀티 오비탈 효과나 CDW(전하 밀도 파)와의 경쟁 상태에서도 동일하게 적용되는지 확인이 필요합니다.", "future_work": "실제 kagome 금속 샘플에 제어된 불순물을 주입하여 Tc 변화를 측정하는 실험을 통해 이 이론적 예측을 검증할 필요가 있습니다.", "concepts": [{"term": "Kagome Lattice", "why_emerged": "기하학적 좌절(frustration)과 특이한 전자 구조(flat band, Dirac cone)를 연구하기 위해 도입되었습니다.", "origin": "일본의 전통 대나무 바구니 패턴에서 유래", "connections": "AV3Sb5, Frustrated magnetism, Flat bands"}, {"term": "d-wave Superconductivity", "why_emerged": "쿠퍼 쌍의 파동함수가 각운동량을 가져 이방성 갭을 형성하는 비전통적 초전도를 설명하기 위해 등장했습니다.", "origin": "Cuprates 연구 과정에서 확립됨", "connections": "High-Tc superconductors, Unconventional pairing, Phase-sensitive tests"}, {"term": "Tc-suppression", "why_emerged": "불순물이 초전도 임계 온도에 미치는 영향을 정량화하여 초전도체의 대칭성을 판별하기 위해 사용됩니다.", "origin": "Abrikosov and Gor'kov (1960)", "connections": "Anderson's theorem, Pair breaking, Impurity scattering"}, {"term": "Lieb Lattice", "why_emerged": "플랫 밴드와 강자성 현상을 이론적으로 연구하기 위해 고안된 격자 모델입니다.", "origin": "Elliott Lieb (1989)", "connections": "Flat-band ferromagnetism, Photonic lattices"}], "english_summary": ["The paper explains why d-wave superconductivity on Lieb and kagome lattices is unexpectedly robust against disorder.", "It challenges the conventional wisdom that non-s-wave pairing is always fragile in the presence of impurities.", "The protection mechanism is linked to the specific lattice geometry and its electronic wavefunctions.", "This provides a key insight for understanding the superconducting state in kagome metals like AV3Sb5."]}}, {"title": "Spin-Axis Dynamic Locking", "journal": "PRL_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/6ypc-bbs7", "authors": "Zhiheng Lv, Jiangtao Cai, Dengpan Ma, Yan Xing, Zhifeng Liu", "last_authors": "Yan Xing, Zhifeng Liu", "summary": "The all-electrical realization of highly spin-polarized currents and their efficient conversion into pure spin currents remains a fundamental challenge in spintronics. Here, we report a spin-axis dynamic locking (SADL) effect in altermagnets that pins the high and dynamically robust spin polarizatio…", "tier": "B_IMPORTANT_CONDMAT", "score": "9", "reason": "Direct relevance to altermagnetism, a key interest, discussing a new spintronic effect.; demoted from A: broad CM, not direct user/project hit", "tags": ["altermagnetism", "spintronics", "magneticmaterials"], "image": "", "briefing": {"background": "알터마그네티즘(Altermagnetism)은 강자성(순자화 있음)과 반강자성(순자화 없음)의 장점을 동시에 가진 새로운 자성 분류로, 알터마그넷 내의 전자는 운동량에 의존하는 거대한 스핀 분할(spin splitting)을 경험합니다.", "motivation": "스핀트로닉스 구현을 위해 높은 스핀 편극 전류를 생성하고 이를 효율적으로 제어하는 것이 필수적이나, 동적인 환경에서도 안정적으로 스핀 축을 유지하는 것은 어려운 과제였습니다.", "result": "알터마그넷에서 스핀 축이 특정 방향으로 고정되어 동적으로 안정적인 높은 스핀 편극을 유지하는 'Spin-Axis Dynamic Locking (SADL)' 효과를 이론적으로 보고했습니다.", "implication": "이 효과를 이용하면 외부 교란이나 소자 동작 중에도 스핀 정보의 손실 없이 고효율의 스핀 전류를 전달할 수 있어, 차세대 알터마그네틱 스핀트로닉스 소자 설계의 핵심 원리가 될 수 있습니다.", "novelty": "독자의 관심사인 알터마그네티즘의 새로운 물리적 효과를 제안하였으며, 기존의 자성체에서는 보기 힘든 '동적 잠금' 현상을 통해 스핀 제어의 새로운 경로를 제시했습니다.", "unresolved": "RuO2나 MnTe와 같은 실제 후보 물질에서 SADL 효과가 나타나는 온도 범위와 실험적 관측 방법(예: 스핀 토크 측정)에 대한 구체화가 필요합니다.", "future_work": "후보 알터마그넷 박막에서의 스핀 수송 실험 및 SADL 효과에 의한 비정상 홀 효과(AHE) 등의 변화 측정 연구가 뒤따를 것으로 보입니다.", "concepts": [{"term": "Altermagnetism", "why_emerged": "반강자성처럼 순자화가 없으면서도 강자성처럼 스핀 분할이 일어나는 제3의 자성을 설명하기 위해 등장했습니다.", "origin": "L. Šmejkal, J. Sinova, T. Jungwirth 등 (2022년경 본격화)", "connections": "Antiferromagnetism, Spin-splitting, RuO2, MnTe"}, {"term": "Spin-Axis Dynamic Locking", "why_emerged": "동적인 스핀 수송 과정에서 스핀의 방향성을 안정적으로 유지하는 메커니즘을 설명하기 위해 본 논문에서 제안되었습니다.", "origin": "Zhiheng Lv et al. (본 논문 저자)", "connections": "Spin polarization, Spintronics, Angular momentum transfer"}, {"term": "Spin Current", "why_emerged": "전하의 이동 없이 스핀 정보만을 전달하여 저전력 차세대 소자를 구현하기 위해 연구됩니다.", "origin": "Mott (1936)의 기초 개념에서 발전", "connections": "Spin Hall effect, Giant Magnetoresistance (GMR)"}, {"term": "Momentum-dependent Spin Splitting", "why_emerged": "알터마그넷에서 나타나는 핵심 특징으로, 전자의 운동 방향에 따라 스핀 에너지 차이가 발생하는 현상입니다.", "origin": "알터마그네티즘 이론 정립과 함께 강조됨", "connections": "Fermi surface warping, Spin-orbit coupling (analogy)"}], "english_summary": ["The paper introduces the Spin-Axis Dynamic Locking (SADL) effect in altermagnetic materials.", "SADL pins the spin polarization axis, making it robust against dynamical fluctuations during transport.", "This effect enables the efficient generation and conversion of highly spin-polarized currents in spintronic devices.", "The study expands the functional potential of altermagnets beyond basic spin-splitting properties."]}}, {"title": "Chiral Weyl-Kondo semimetallic state through enhanced correlation in CeGaGe", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2609.32012", "authors": "Arushi, Kevin Allen, Yuan Fang, et al.", "last_authors": "Qimiao Si, Emilia Morosan", "summary": "Strongly correlated chiral materials have been proposed to host a chiral Weyl-Kondo semimetal (cWKSM) state, in which Kondo hybridization pins chirality-induced Kramers-Weyl point crossings, together with additional symmetry-enforced band crossings, near the Fermi level. Realizing this state requires a material that combines crystal chirality, non-symmorphic symmetry, and Kondo correlations, and currently there are no known materials that combine all these requirements. Here we report evidence for a cWKSM state in CeGaGe, a member of the RXY (R = rare earth; X = Al, Si; Y = Ga, Ge) family. Magnetization measurements confirm long-range antiferromagnetic order below T$_N$ = 4.7 K with a complex, canted magnetic structure. Unique to CeGaGe among the known RXY systems is a structural transition from an achiral tetragonal I4$_{1}$md structure (at high temperatures) to the chiral tetragonal P4$_{3}$ structure (at low temperatures). The structural transition in CeGaGe allows us to highlight the role of chirality in stabilizing the Kramers cWKSM state. Hall resistivity measurements with $H || c$ reveal an anomalous Hall conductivity (AHC) that is constant below the Kondo temperature $T_K \\approx 7$ K and drops sharply above it. This crossover tracks the onset of Kondo coherence rather than the magnetic ordering, which occurs at T$_N$ = 4.7 K. Together with first-principles calculations for the $P4_3$ structure, this identifies the AHC as an intrinsic, Berry-curvature-driven contribution generated by Kondo hybridization, rather than a consequence of extrinsic scattering or dynamic scalar spin chirality. These results establish CeGaGe as a rare experimental platform in which crystal chirality, strong electronic correlations, and non-trivial band topology coexist, providing the first material realization of a Kondo-driven cWKSM state.", "tier": "B_IMPORTANT_CONDMAT", "score": "9", "reason": "Discovery of a chiral Weyl-Kondo semimetal with Berry-curvature driven anomalous Hall effect in CeGaGe.; demoted from A: broad CM, not direct user/project hit", "tags": ["material", "Weylsemimetal", "Kondo", "anomalousHall"], "image": "https://arxiv.org/html/2609.32012v2/Fig1_new1.png", "briefing": {"background": "강한 전자 상관관계(Strong correlation)와 위상 밴드 구조가 결합된 물질은 비전통적인 물리 현상을 탐구하는 현대 응집물질 물리학의 핵심 분야입니다. 특히 Kondo 격자 시스템은 국부적인 모멘트와 전도 전자의 혼성화로 인해 흥미로운 바닥 상태를 형성합니다.", "motivation": "구조적 카이랄성(chirality), 비중심대칭성(non-symmorphic symmetry), 그리고 Kondo 상관관계라는 세 가지 요소를 동시에 만족하며 '카이랄 Weyl-Kondo 반금속(cWKSM)' 상태를 구현할 수 있는 물질을 탐색하고자 했습니다.", "result": "CeGaGe 화합물이 고온의 사방정계 구조에서 저온의 카이랄 P4_3 구조로 상전이하며, Kondo 일관성(coherence)이 시작되는 온도에서 Berry 곡률에 의한 비정상 홀 효과(AHE)가 발현됨을 관측했습니다.", "implication": "CeGaGe가 Kondo 혼성화에 의해 유도된 고유의 Berry 곡률을 가진 cWKSM의 최초 물질적 실현임을 보여주며, 위상 물성과 강상관 물성이 만나는 지점을 제시합니다.", "novelty": "구조적 카이랄성이 어떻게 Kondo 격자에서 Kramers Weyl 점을 안정화하고 위상적 물성을 유도하는지 실질적인 실험 증거를 제시했다는 점에서 독보적입니다.", "unresolved": "자기 구조의 복잡성이 상세하게 완전히 분해되지 않았으며, 자기적 질서와 위상 밴드 구조 사이의 미시적 결합 상세 과정은 추가 연구가 필요합니다.", "future_work": "ARPES를 통한 밴드 구조 직접 관측 및 자기 구조의 미시적 해석을 위한 중성자 산란 실험이 기대됩니다.", "concepts": [{"term": "Weyl-Kondo Semimetal (cWKSM)", "why_emerged": "Kondo 격자 시스템에서 전자 상관관계와 위상적 밴드 교차를 동시에 이해하기 위해 필요함.", "origin": "초록 정보만으로는 특정하기 어려움 (주로 Qimiao Si 그룹의 이론적 제안 배경).", "connections": "Kondo 효과, Berry 곡률, Weyl 반금속."}, {"term": "Anomalous Hall Effect (AHE)", "why_emerged": "강자성이나 카이랄 물질에서 자성 불순물 없이 Berry 곡률에 의해 전도 전자가 휘어지는 현상을 설명하기 위함.", "origin": "Karplus와 Luttinger (1954).", "connections": "Berry 위상, 비정상 Nernst 효과, 자성 위상 물질."}], "english_summary": ["Discovery of the first chiral Weyl-Kondo semimetal candidate in CeGaGe.", "The material exhibits a structural transition to a chiral P4_3 phase at low temperatures.", "Anomalous Hall conductivity emerges upon entering the Kondo coherence regime.", "Evidence suggests the AHE is driven by intrinsic Berry curvature from Kondo hybridization.", "Establishes a platform connecting crystal chirality, correlations, and band topology."]}}, {"title": "Complex Magnetic Phases and Unconventional Skyrmion Thermodynamics in Magnetically Intercalated Cr1+xTe2Compounds", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2610.00877", "authors": "Clayton Conner, Santosh Karki Chhetri, Avinash Sah, et al.", "last_authors": "Zheng Gai, Guang Bian", "summary": "Chemical intercalation provides a powerful route for tuning the electronic and magnetic properties of transition metal dichalcogenides (TMDs), enabling the emergence of magnetic phases and phenomena that are otherwise inaccessible in their pristine forms. Here, we investigate the structural, electronic, and magnetic properties of magnetically intercalated Cr$_{1+x}$Te$_2$ through a combination of scanning tunneling microscopy, angle-resolved photoemission spectroscopy, magnetization, electrical transport, and Lorentz transmission electron microscopy measurements. We uncover a rich magnetic phase diagram comprising paramagnetic, in-plane spin-fluctuation, out-of-plane ferromagnetic, and field-induced N\\'eel-type skyrmion phases. In particular, Lorentz transmission electron microscopy directly reveals the formation of N\\'eel-type skyrmion textures slightly below the Curie temperature, with their configurations evolving strongly with temperature and magnetic field. The skyrmions exhibit pronounced thermal hysteresis and coexist with stripe domains, indicative of a complex magnetic energy landscape arising from the competition among disorder-induced local Dzyaloshinskii-Moriya interactions, perpendicular magnetic anisotropy, and dipolar interactions. Our results demonstrate that chemical intercalation can profoundly reshape the magnetic interactions and phase behavior of TMDs, establishing Cr$_{1+x}$Te$_2$ as a versatile platform for exploring tunable magnetism, skyrmion physics, and unconventional thermodynamic phenomena in low-dimensional quantum materials.", "tier": "B_IMPORTANT_CONDMAT", "score": "9", "reason": "Experimental study using ARPES, STM, and transport on intercalated TMDs with rich magnetic phases.", "tags": ["ARPES", "STM", "TMD", "skyrmions", "magnetism"], "image": "https://arxiv.org/html/2610.00877v1/Fig1_new.png", "briefing": {"background": "전이금속 디칼코게나이드(TMD)는 화학적 삽입을 통해 전자적·자기적 성질을 정밀하게 제어할 수 있는 플랫폼으로, 차세대 스핀트로닉스 재료로서 주목받고 있습니다.", "motivation": "Cr1+xTe2에서 삽입 원자 농도 조절을 통해 나타나는 다양한 자기적 위상과 스커미온과 같은 위상적 스핀 구조의 형성 기원을 파악하고자 했습니다.", "result": "Lorentz TEM을 통해 N\\'eel형 스커미온을 직접 관측했으며, 재료 내 불균일성(disorder)과 DMI(Dzyaloshinskii-Moriya) 상호작용 간의 복잡한 경쟁이 스커미온 안정화에 기여함을 보였습니다.", "implication": "TMD 기반의 자기 구조 엔지니어링이 가능함을 입증하며, 스커미온 제어 및 비전통적인 자기 상전이 연구의 중요한 모델 시스템이 됩니다.", "novelty": "ARPES와 STM을 결합하여 전자 구조와 스핀 위상을 동시에 다뤘으며, 스커미온 형성과 관련된 에너지를 실험적으로 조명했습니다.", "unresolved": "불균일성이 스커미온 위상에 미치는 구체적인 영향과, 온도-자기장 의존성의 미세한 메커니즘은 추가적인 이론 모델링이 필요합니다.", "future_work": "자기장의 방향과 크기에 따른 스커미온의 동역학적 특성 연구가 이어질 것으로 예상됩니다.", "concepts": [{"term": "N\\'eel-type Skyrmion", "why_emerged": "스핀이 반지름 방향으로 회전하는 위상학적 스핀 텍스처를 이해하기 위해 필요함.", "origin": "Bogdanov와 Yablonskii (1989) 이론적 제안.", "connections": "Dzyaloshinskii-Moriya Interaction(DMI), 위상 홀 효과."}, {"term": "Chemical Intercalation", "why_emerged": "2D 층상 구조 사이에 원자를 넣어 캐리어 농도나 자기적 환경을 의도적으로 바꾸기 위함.", "origin": "초록 정보만으로는 특정하기 어려움 (TMD 연구의 일반적 방법론).", "connections": "도핑, 층간 결합 엔지니어링, 자성 TMD."}], "english_summary": ["Systematic study of magnetically intercalated Cr1+xTe2 using multimodal probes.", "Uncovered a rich phase diagram including paramagnetic, ferromagnetic, and N\\'eel-type skyrmion phases.", "Direct imaging of skyrmions via Lorentz TEM below the Curie temperature.", "Complex magnetic behavior arises from the competition between DMI and local disorder.", "Establishes Cr1+xTe2 as a platform for tunable magnetism and skyrmion physics."]}}, {"title": "Imaging Surface Magnetization in Altermagnetic MnTe Films", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2605.25241", "authors": "Ling-Jie Zhou, Senlei Li, Zi-Jie Yan, et al.", "last_authors": "Hailong Wang, Chunhui Rita Du", "summary": "Altermagnets with pronounced spin-splitting band structure, unconventional magnetic and crystal symmetries, and exotic magneto-transport properties have received immense interest in cutting-edge spintronics, materials science, and condensed matter physics research. Microscopic imaging of spontaneous magnetic domains and phases in altermagnets constitutes an important step for investigating their underlying material properties, mechanisms, and spin behaviors. Taki ortant' topics with spintronics relevance.", "tags": ["altermagnetism", "Diracsemimetal", "spintronics", "theory"], "image": "", "briefing": {"background": "알터자성(Altermagnetism)은 강자성이나 반강자성과 달리, 순자화는 0이면서도 전자의 밴드가 스핀 분리(spin-split)되어 있는 새로운 자기 위상으로, 차세대 스핀트로닉스 재료로 급부상 중입니다.", "motivation": "본 연구는 알터자성체에서 클라인 터널링(Klein tunneling) 현상이 스핀 전류 생성에 어떻게 기여할 수 있는지 이론적으로 탐구하고자 했습니다.", "result": "디락 알터자성체에서 클라인 터널링이 전자의 스핀 편극과 전류 흐름을 증폭시킬 수 있는 효율적인 기전임을 증명했습니다.", "implication": "이는 외부 자기장 없이도 효율적인 스핀 전류 제어가 가능함을 보여주며, 에너지 효율적인 스핀트로닉스 소자 설계에 중요한 이론적 기반을 제공합니다.", "novelty": "알터자성체라는 최신 소재와 디락 준금속의 위상학적 성질(클라인 터널링)을 결합하여 새로운 스핀 전류 제어 방식을 제안했다는 점에서 매우 혁신적입니다.", "unresolved": "실제 디락 알터자성 후보 물질에서의 구체적인 스핀 전류 전달 효율과 불순물 산란의 영향은 추가적인 연구가 필요합니다.", "future_work": "실제 소재(예: 특정 디락 알터자성체)를 대상으로 한 소자 시뮬레이션 및 초고속 스핀 역학 실험으로 이어질 것으로 예상됩니다.", "concepts": [{"term": "Altermagnetism", "why_emerged": "순자화가 없어도 스핀 분리된 밴드 구조를 가지는 시스템의 독특한 대칭성을 체계적으로 정의할 필요성에 의해 등장함.", "origin": "Libor Smejkal et al. (2022)", "connections": "강자성, 반강자성, 스핀-궤도 토크, 스핀트로닉스."}, {"term": "Klein Tunneling", "why_emerged": "디락 입자가 전위 장벽을 100% 투과하는 상대론적 양자 효과를 이해하고 이를 소자에 응용하기 위해 발전됨.", "origin": "Oskar Klein (1929)", "connections": "그래핀, 디락 준금속, 입자 물리."}], "english_summary": ["The study investigates spin-current generation in Dirac altermagnets.", "Klein tunneling is identified as a mechanism for enhancing spin currents.", "The findings suggest potential for high-efficiency spin-logic applications.", "This links relativistic quantum effects with spintronics in magnetic materials."]}}, {"title": "Metallic electro-optic effects in topological chiral crystals", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/1vvf-8rvx", "authors": "C. O. Ascencio, D. J. P. de Sousa, Tony Low", "last_authors": "D. J. P. de Sousa, Tony Low", "summary": "Topological chiral crystals have emerged as a fertile material platform for investigating optical phenomena derived from the distinctive Fermi surface Berry  topological systems.", "Highlights the potential for light-matter interaction control in chiral topological materials."]}}, {"title": "Odd-parity altermagnetism induced reconstruction of the Chern insulating phase in the Haldane-Hubbard model", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/rtby-yhj8", "authors": "Minghuan Zeng, Zheng Qin, Ling Qin, et al.", "last_authors": "Dong-Hui Xu, Rui Wang", "summary": "Odd-parity altermagnetism (ALM) extends compensated collinear magnetism beyond the even-parity spin splitting of conventional altermagnets, but its role in correlated topological phases remains largely unexplored. Using the cluster slave-spin method, we show that the odd-parity ALM appearing in the …", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Connects altermagnetism and Chern insulators, both high priority topics.", "tags": ["topic:altermagnetism", "topic:Chern-insulator", "method:theory"], "image": "", "briefing": {"background": "알터자성(Altermagnetism)은 최근 물성 물리학에서 급부상한 분야로, 시간 반전 대칭이 깨져 있으면서도 순자화값이 0인 독특한 자기적 상태입니다. 특히 스핀 분할(spin-splitting)이 운동량 공간에서 비대칭적으로 나타나 위상학적 위상과 결합 시 새로운 물리 현상을 생성합니다.", "motivation": "기존 짝-패리티(even-parity) 알터자성과 달리 홀수-패리티(odd-parity) 알터자성이 강력한 상관관계를 가진 위상학적 절연체 상태(Chern insulator)에 미치는 영향을 탐구하고자 합니다.", "result": "클러스터 슬레이브-스핀(cluster slave-spin) 기법을 통해 홀수-패리티 알터자성이 핼데인-허바드 모델의 Chern 절연체 위상을 어떻게 재구성하는지 보였습니다.", "implication": "알터자성이 위상학적 위상 전이를 유도하는 능동적 자유도가 될 수 있음을 시사하며, 새로운 위상 자성 물질 설계에 기여합니다.", "novelty": "알터자성과 Chern 절연체라는 두 뜨거운 주제를 결합하여 상관관계 시스템에서의 위상적 변조 가능성을 이론적으로 입증했습니다.", "unresolved": "모델 시스템에서 도출된 결과로, 실제 물질 내에서 홀수-패리티 알터자성을 구현하고 제어하는 구체적인 화합물 예시는 아직 부족합니다.", "future_work": "해당 위상을 가진 실제 결정 구조 예측 및 이를 관측하기 위한 스핀 분해 ARPES 분석 제안.", "concepts": [{"term": "알터자성 (Altermagnetism)", "why_emerged": "전통적인 강자성체나 반강자성체로 분류되지 않는 새로운 자기적 위상을 기술하기 위해 필요함.", "origin": "Recent theoretical works (e.g., Libor Šmejkal, 2022)", "connections": "Spin-split bands without net magnetization."}, {"term": "Chern 절연체", "why_emerged": "자기장 없이도 양자 홀 효과를 나타내는 물질을 설명하기 위해 도입됨.", "origin": "Haldane (1988)", "connections": "Topological insulators, Quantum anomalous Hall effect."}, {"term": "클러스터 슬레이브-스핀", "why_emerged": "강한 전자 상관관계 시스템에서 금속-절연체 전이를 비섭동론적으로 다루기 위해 사용됨.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "Slave-boson theories, DMFT."}], "english_summary": ["Explores odd-parity altermagnetism in correlated topological insulators.", "Uses cluster slave-spin method to study the reconstruction of Chern insulating phases.", "Demonstrates how altermagnetic spin-splitting influences topological order.", "Advances understanding of the interplay between altermagnetism and non-trivial topology."]}}, {"title": "Probing La-based nickelates with Ni0.16em0ex1s core-level photoelectron spectroscopy", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/fkvs-lfjm", "authors": "Daisuke Takegami, Naoki Ito, Koto Fujinuma, et al.", "last_authors": "Berit H. Goodge, Atsushi Hariki", "summary": "We present a comparative Ni core level photoemission study of La 3 Ni 2 O 7 , Nd 3 Ni 2 O 7 , and LaNiO 3 using both the Ni 2 p and the Ni 1 s . We address the challenges in analyzing the widely investigated Ni 2 p spectra arising from the substantial overlap in energy of the Ni 2 p with the La 3 d . We show that, on the other hand, the deep Ni 1 s core level does provide a clean view on the intrinsic electronic excitations and we highlight its potential to resolve detailed differences in the electronic structure within the strongly correlated Ruddlesden-Popper series La n + 1 Ni n O 3 n + 1 .", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Core-level photoemission spectroscopy on La-based nickelates, highly relevant to user's spectroscopic focus.", "tags": ["PES", "photoemission", "nickelates"], "image": "", "briefing": {"background": "La 기반 니켈산염(Ruddlesden-Popper nickelates)은 고온 초전도체인 큐프레이트와 유사한 전자 구조를 가져 초전도 메커니즘을 밝히는 핵심 물질군입니다. 하지만 Ni 2p X-선 광전자 분광법(XPS)은 La 3d 피크와의 강한 겹침 때문에 전자 상태를 정밀하게 분석하는 데 기술적 한계가 있었습니다.", "motivation": "La-Ni-O 시스템에서 Ni 2p 스펙트럼의 분석 난제를 극복하고, 전자 구조의 상세한 차이를 규명하기 위한 새로운 분광학적 접근법(Ni 1s PES)의 유효성을 검증하고자 합니다.", "result": "Ni 1s 스펙트럼이 Ni 2p보다 La 3d의 간섭 없이 순수한 전자 여기 상태를 제공하며, Ruddlesden-Popper 시리즈 간의 미세한 차이를 구분하는 데 더 적합함을 보여주었습니다.", "implication": "향후 La 기반 및 유사한 니켈산염의 전자 상태 분석에서 표준적인 분광학적 방법론으로 Ni 1s 측정이 중요하게 자리 잡을 것입니다.", "novelty": "광전자 분광법(PES)의 고질적인 데이터 해석 문제에 대한 실질적인 솔루션을 제시하였으며, 이는 독자분이 중요하게 생각하는 전자 구조 분석 연구에 직접적인 방법론적 기여를 합니다.", "unresolved": "Ni 1s 측정을 위한 고에너지 X-선 소스(Hard X-ray) 접근성의 제약이 있을 수 있습니다.", "future_work": "다양한 도핑 수준의 니켈산염에 대한 Ni 1s 스펙트럼 데이터베이스 구축 및 DFT+DMFT 결과와의 정밀 비교.", "concepts": [{"term": "Ruddlesden-Popper 시리즈", "why_emerged": "층상 페로브스카이트 구조를 가진 산화물을 체계적으로 분류하기 위해 사용됨.", "origin": "Ruddlesden and Popper (1950s)", "connections": "Cuprate superconductors, nickelates."}, {"term": "코어 레벨 광전자 분광법 (Core-level PES)", "why_emerged": "원자 고유의 내각 전자의 결합 에너지를 측정하여 화학적 상태와 국소 전자 구조를 조사하기 위해 사용됨.", "origin": "Siegbahn (1960s)", "connections": "XPS, Electronic structure study."}, {"term": "Ni 2p vs Ni 1s", "why_emerged": "특정 에너지 대역에서 타 원소와의 신호 간섭(overlap)을 피하고 분해능을 높이기 위한 비교 연구.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "Hard X-ray Photoemission Spectroscopy (HAXPES)."}], "english_summary": ["Comparative Ni core-level photoelectron spectroscopy of La-based nickelates.", "Addresses the signal overlap issue between Ni 2p and La 3d states.", "Identifies Ni 1s core level as a cleaner probe for intrinsic electronic excitations.", "Provides a robust spectroscopic methodology for future studies of Ruddlesden-Popper nickelates."]}}, {"title": "Significant modulation of acoustoelectric current associated with charge density wave transitions", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/19zf-xskg", "authors": "Natsumi Nikaido, Takuya Kawada, Koji Fujiwara, et al.", "last_authors": "Shintaro Takada, Yasuhiro Niimi", "summary": "How collective electronic order responds to strain remains a central question in quantum materials. Here, the authors find that charge density wave (CDW) transitions in NbSe 3 and 2 H -TaSe 2 strongly modulate the acoustoelectric current driven by surface acoustic waves. A simple phenomenological model based on strain-dependent conductivity captures the essential behavior. The work demonstrates acoustoelectric transport as a sensitive probe of CDW physics and opens new avenues for strain-based control of electronic states in van der Waals materials.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Experimental study of CDW in NbSe3; highly relevant to user interest in quasi-1D materials/CDW.", "tags": ["CDW", "NbSe3", "transport", "experimental"], "image": "", "briefing": {"background": "전하 밀도 파(CDW)는 양자 물질에서 전자와 격자가 결합하여 발생하는 집단적 전자 질서입니다. 이를 정밀하게 제어하거나 탐지하는 것은 응집물질물리학의 핵심 과제 중 하나입니다.", "motivation": "NbSe3와 같은 저차원 재료에서 CDW 상태가 변형(strain)에 어떻게 반응하는지, 그리고 이를 음향 전기적(acoustoelectric) 방식으로 측정할 수 있을지 확인하고자 했습니다.", "result": "표면 탄성파(SAW)를 통해 유도된 음향 전기 전류가 NbSe3 및 2H-TaSe2의 CDW 전이 온도 부근에서 강하게 변조됨을 발견했습니다. 변형에 따른 전도도 변화를 기반으로 한 현상론적 모델이 실험 결과를 잘 설명합니다.", "implication": "음향 전기 수송 측정이 CDW 물성을 조사하는 민감한 탐침이 될 수 있으며, 향후 van der Waals 물질의 전자 상태를 변형으로 제어하는 기술적 기반이 될 수 있습니다.", "novelty": "CDW 시스템에서 변형과 전자 수송의 결합을 음향 전기적 방법으로 명확히 규명했으며, 이는 구조적 변형이 전자 질서를 조절하는 새로운 경로를 제시합니다.", "unresolved": "실험적 결과는 현상론적 모델과 잘 맞으나, 미시적인 관점에서의 변형과 CDW 진폭/위상 간의 상관관계에 대한 완벽한 해석은 추가 연구가 필요합니다.", "future_work": "음향 전기적 탐침을 이용하여 다른 위상물질이나 강상관 전자계에서 스트레인 엔지니어링을 통한 물성 제어 실험이 진행될 것으로 보입니다.", "concepts": [{"term": "CDW (Charge Density Wave)", "why_emerged": "저차원 물질에서 전자-격자 결합으로 인한 에너지 이득 때문에 나타나는 주기적 전자 밀도 변조 상태.", "origin": "1950년대 Peierls에 의해 이론적으로 예견됨.", "connections": "Peierls 전이, 저차원 금속, 비전통적 초전도체와의 상관관계."}, {"term": "Acoustoelectric current", "why_emerged": "표면 탄성파가 전도성 물질의 전하 캐리어를 끌고 가면서 발생하는 전류 현상을 이용한 비파괴적 탐지 기법.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "반도체 이종접합의 수송 측정, SAW 디바이스."}, {"term": "NbSe3", "why_emerged": "대표적인 준-1차원 금속으로 복수의 CDW 전이를 보이는 모델 시스템.", "origin": "1970년대 전이금속 칼코겐 화합물의 저차원적 특성 연구에서 확립.", "connections": "Peierls 절연체, 비선형 수송 현상."}], "english_summary": ["The authors investigated the coupling between CDW transitions and acoustoelectric currents in NbSe3 and 2H-TaSe2.", "Surface acoustic waves (SAWs) were used as a sensitive probe to detect CDW transitions via strain-modulated transport.", "A phenomenological model based on strain-dependent conductivity successfully explains the observed data.", "This work provides a new avenue for strain-based control of electronic states in van der Waals materials."]}}, {"title": "Emergent Gauge Fields and Linear Dichroism in Spin-Textured Altermagnets", "journal": "PRL_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/phr7-1zy5", "authors": "Andrea Maiani", "last_authors": "Andrea Maiani", "summary": "Spin textures are ubiquitous in antiferromagnets, yet their consequences for altermagnets remain largely unexplored. We show that smooth spatial variations of the Néel order act on itinerant electrons as emergent gauge fields that couple to the altermagnetic sublattice-odd channel. For a coplanar spin helix, this channel generates two responses that vanish when it is removed: a momentum-resolved sublattice-odd spectral structure and a net interband linear dichroism whose principal axes are controlled by the helix wave vector, so the optical response can be steered by the magnetic texture. The dichroism exhibits two distinct regimes separated by a crossover: at low frequencies the absorption axis is locked to the crystal axes, while at high frequencies it tracks the helix. Anisotropic dc transport provides a complementary quantitative signature, and all signatures are robust to weak intrinsic spin-orbit coupling. Our results identify polarization-resolved optics and sublattice-sensitive spectroscopy as direct probes of textured altermagnetic states and suggest a route to direction-selective electronic and optical functionality in altermagnets.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Theory on emergent gauge fields and linear dichroism in altermagnets, directly relevant.", "tags": ["theory", "altermagnetism", "spectroscopy"], "image": "", "briefing": {"background": "알터자성(Altermagnetism)은 최근 발견된 자성 위상으로, 일반적인 강자성이나 반강자성과 달리 스핀 분할(spin splitting)이 운동량 공간에서 나타나는 독특한 전자 구조를 가집니다.", "motivation": "알터자성체에서 나타나는 스핀 텍스처(spin textures)가 외부 장이나 빛에 대해 어떤 독특한 응답을 보이는지 이론적으로 규명하고자 했습니다.", "result": "알터자성체 내의 자성 질서가 공간적으로 변화(스핀 헬릭스)할 경우, 이것이 전자에게 등가 게이지 장(emergent gauge fields)으로 작용함을 증명했습니다. 이로 인해 편광에 의존하는 선형 이색성(linear dichroism)이 발생함을 보였습니다.", "implication": "알터자성체의 자기적 질서를 빛의 편광을 통해 제어하거나 측정할 수 있는 새로운 가능성을 제시합니다.", "novelty": "알터자성체에서의 스핀 텍스처와 등가 게이지 장의 상호작용을 처음으로 해석했으며, 특히 편광 분해 분광법이 알터자성체를 직접적으로 탐지하는 수단이 될 수 있음을 시사합니다.", "unresolved": "이론적으로 제안된 효과의 실제 크기가 실험적 측정 한계 내에 있는지, 그리고 샘플의 결함이 이 현상을 어느 정도 상쇄할지에 대한 구체적인 정량 분석이 필요합니다.", "future_work": "알터자성체 박막에서의 고분해능 ARPES나 편광 분해 광학 측정을 통한 실험적 검증이 예상됩니다.", "concepts": [{"term": "Altermagnetism", "why_emerged": "강자성과 반강자성 범주에 들어가지 않는 새로운 자기 정렬 유형을 기술하기 위해 제안됨.", "origin": "최근 2-3년 내 이론적 체계가 정립됨(예: Jungwirth et al.).", "connections": "스핀 분할, 비상반성 수송, 반강자성 스핀트로닉스."}, {"term": "Emergent Gauge Field", "why_emerged": "입자의 운동이 자성 텍스처의 공간적 변화와 결합할 때, 이를 유효한 전자기장의 형태(벡터 포텐셜)로 이해하기 위해 도입됨.", "origin": "Berry 위상 관련 연구들에서 파생.", "connections": "스핀 궤도 토크, 위상 수송 현상."}, {"term": "Linear Dichroism", "why_emerged": "물질의 이방성 광학 흡수를 측정하여 전자 구조의 대칭성을 파악하기 위해 사용됨.", "origin": "전통적인 결정학 및 광학 물리학.", "connections": "ARPES 편광 의존성, 자기 광학 효과."}], "english_summary": ["Theory explores the consequences of spin textures in altermagnetic materials.", "Spatial variations in Néel order act as emergent gauge fields on itinerant electrons.", "These fields induce sublattice-sensitive spectral structures and interband linear dichroism.", "Optical polarization control and spectroscopy are proposed as direct probes of altermagnetic states."]}}, {"title": "Interlayer-Correlated Fractional Quantum Hall State in a Trilayer Electron System", "journal": "PRL_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/4bpx-3mwm", "authors": "Chengyu Wang, C. T. Tai, N. Toemtrisna, et al.", "last_authors": "K. W. Baldwin, M. Shayegan", "summary": "In multilayer quantum Hall systems, when the layer separation is sufficiently small, the interplay between intralayer and interlayer Coulomb interactions can lead to exotic, multicomponent, many-body states. A particular example is the even-denominator fractional quantum Hall state at total filling …", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Experimental study of interlayer-correlated fractional quantum Hall state in trilayer system.", "tags": ["experiment", "quantumHall", "correlated"], "image": "", "briefing": {"background": "다층 양자 홀 시스템에서 층 간의 거리가 매우 가까우면 각 층 내의 상호작용과 층 간의 쿨롱 상호작용이 복합적으로 작용하여 강하게 상관된 다성분 양자 다체 상태가 형성됩니다.", "motivation": "3층 전자 시스템에서 층 간 상관관계가 어떤 새로운 분수 양자 홀 효과(FQHE)를 만들어내는지 탐구하고자 했습니다.", "result": "층 간 결합이 강한 3층 시스템에서 짝수 분모 분수 양자 홀 상태(even-denominator fractional quantum Hall state)가 나타남을 실험적으로 관찰했습니다.", "implication": "다층 시스템에서 제어 가능한 양자 다체 상태를 구현함으로써, 복잡한 위상 물성 연구 및 위상 양자 컴퓨터 소자 구현에 기여할 수 있습니다.", "novelty": "3층 시스템이라는 고도로 제어된 구조에서 이전에 관측되지 않았던 interlayer-correlated FQHE 상태를 발견한 것이 핵심입니다.", "unresolved": "해당 상태의 구체적인 파동함수와 층 간의 전하 분포 특성에 대한 심층적인 분석이 아직 논의 단계입니다.", "future_work": "샘플 구조의 추가 최적화와 더 낮은 온도/더 높은 자기장에서의 정밀 수송 측정이 예상됩니다.", "concepts": [{"term": "Fractional Quantum Hall State", "why_emerged": "강한 자기장 하에서 전자 간의 강한 쿨롱 상호작용으로 인해 정수 배가 아닌 분수 배의 홀 전도도를 나타내는 상태를 기술하기 위해 필요함.", "origin": "1982년 Tsui, Störmer, Laughlin.", "connections": "Laughlin 파동함수, 애니온(Anyon), 위상적 질서."}, {"term": "Even-denominator FQHE", "why_emerged": "통상적인 FQHE와 달리 짝수 분모에서 나타나는 상태는 훨씬 더 이국적인(비가환 등) 물성을 가질 가능성이 있어 관심의 대상이 됨.", "origin": "1987년 Willett et al. (5/2 상태).", "connections": "Moore-Read 파동함수, 비가환 통계, 위상 양자 연산."}], "english_summary": ["Experimental study of an interlayer-correlated fractional quantum Hall state in a trilayer system.", "The interplay between intralayer and interlayer Coulomb interactions generates complex many-body states.", "An even-denominator fractional quantum Hall state is observed.", "This provides insights into tunable multilayer quantum Hall physics."]}}, {"title": "Observation of Time-Reversal Symmetry Breaking in the Type-I Superconductor YbSb2", "journal": "PRL_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/drzq-lfn5", "authors": "Anshu Kataria, Shashank Srivastava, Dibyendu Samanta, et al.", "last_authors": "Sudeep Kumar Ghosh, Ravi Prakash Singh", "summary": "A hallmark property of unconventional superconductivity has been discovered in a type-I superconductor, whereas it’s normally observed only in type-II materials.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Experimental observation of TRSB and unconventional superconductivity in YbSb2.", "tags": ["experiment", "unconventionalsuperconductivity", "TRSB", "material:YbSb2"], "image": "", "briefing": {"background": "전통적인 초전도체는 BCS 이론에 따라 시간 반전 대칭성(TRS)을 유지하지만, 일부 비전통적 초전도체에서는 초전도 상태에서 TRS가 깨지는 현상(TRSB)이 관찰되어 스핀 삼중항(spin-triplet) 등 이색적인 메커니즘이 논의됩니다.", "motivation": "일반적으로 비전통적 초전도성은 제2종 초전도체에서 나타나는데, 이 연구는 상대적으로 흔한 제1종 초전도체인 YbSb2에서 TRSB 증거를 찾아 초전도성 범주를 확장하고자 했습니다.", "result": "YbSb2의 초전도 상태에서 시간 반전 대칭성이 깨짐을 실험적으로 확인했습니다.", "implication": "제1종 초전도체에서도 이색적인 초전도 메커니즘이 존재할 수 있음을 시사하며, 초전도체 분류 체계의 재검토가 필요할 수 있습니다.", "novelty": "TRSB가 제2종 초전도체의 전유물이 아니라는 점을 규명하여 비전통적 초전도체 연구의 새로운 사례를 제공했습니다.", "unresolved": "제1종 초전도체에서 TRSB를 유발하는 구체적인 마이크로스코픽 메커니즘이 명확히 규명되지 않았습니다.", "future_work": "YbSb2의 자기 구조 정밀 분석 및 초전도 페어링 대칭성(pairing symmetry)에 대한 이론적 연구가 필요합니다.", "concepts": [{"term": "TRSB", "why_emerged": "초전도 페어링 상태가 스핀 삼중항 등 자성을 띠는 경우를 구분하기 위해 필요.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "뮤온 스핀 회전(muSR) 실험, 카이랄 초전도체."}, {"term": "제1종 초전도체", "why_emerged": "임계 자기장 이하에서 완전한 마이스너 효과를 보이 ": "비아벨 위상 질서", "why_emerged": "입자의 순서에 따라 시스템의 상태가 변하는 독특한 통계를 가지는 양자 상태를 이해하기 위해 필요.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "Moore-Read 상태, 위상 양자 컴퓨터."}], "english_summary": ["Experimental detection of e/4 quasiparticles at the ν=1/2 filling factor.", "Evidence points towards non-Abelian topological order in GaAs quantum wells.", "Crucial validation for potential topological quantum computing hardware.", "Utilizes shot-noise measurement technique in quantum point contacts."]}}, {"title": "Quantized Heat Flow in the Hofstadter Butterfly", "journal": "PRL_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/pggy-t8bg", "authors": "A. Zhang, G. Aissani, Q. Dong, Y. Jin, K. Watanabe, T. Taniguchi, et al.", "last_authors": "G. Fève, G. C. Ménard, O. Maillet, and F. D. Parmentier", "summary": "Heat flow in the Chern Insulator states of the Hofstadter butterfly is obtained in a graphene/hBN moiré for the first time.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Study of quantized heat flow in graphene/hBN moiré, relevant to moiré systems and topological physics.", "tags": ["graphene", "moir", "topological", "transport"], "image": "", "briefing": {"background": "모아레 격자 시스템은 격자 불일치나 비틀림을 통해 새로운 전자 밴드 구조를 유도하며, 여기서 발생하는 Hofstadter 나비 모양의 스펙트럼은 위상 물리학 연구의 중요한 실험장이 됩니다.", "motivation": "그래핀/hBN 모아레 시스템의 밴드 구조에서 나타나는 위상적 상태인 Chern 절연체의 열 전도 특성을 실험적으로 밝히고자 했습니다.", "result": "Hofstadter 나비 구조 내의 Chern 절연체 상태에서 열 흐름이 양자화되어 있음을 최초로 관측했습니다.", "implication": "위상적 상태에서 전하와 열의 수송 특성을 정밀하게 제어할 수 있음을 보여주며, 향후 위상 열전 소자 개발에 기여할 것입니다.", "novelty": "모아레 시스템 내 위상 상태의 열적 물성을 직접적으로 측정하여, 위상 수송 현상의 범위를 전하에서 열 영역으로 확장했습니다.", "unresolved": "열 수송 측정의 정밀도를 제한하는 기생 열 효과(parasitic heat effects)에 대한 보정 연구가 지속되어야 합니다.", "future_work": "더 넓은 범위의 모아레 물질 및 비평형 상태에서의 열 수송 연구.", "concepts": [{"term": "Hofstadter 나비", "why_emerged": "격자 전위와 자기장의 상호작용으로 인해 형성되는 프랙탈 에너지 스펙트럼을 기술하기 위해 필요.", "origin": "Douglas Hofstadter (1976)", "connections": "Chern 절연체, 자기장 하의 2차원 Bloch
