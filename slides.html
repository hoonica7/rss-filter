<title>Daily Paper Slideshow</title>
<style>
  :root {
    color-scheme: light;
    --bg: #f6f7f4;
    --paper: #ffffff;
    --ink: #111827;
    --muted: #64748b;
    --line: #d8ddd2;
    --accent: #176b87;
    --accent-2: #9a3412;
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; overflow: auto; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: var(--bg); color: var(--ink); }
  .shell { max-width: 1500px; min-height: 100vh; margin: 0 auto; padding: 14px 18px; display: flex; flex-direction: column; }
  .topbar { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 16px; }
  .top-actions { display: flex; align-items: center; gap: 10px; }
  .topbar a, button { border: 1px solid var(--line); border-radius: 8px; background: var(--paper); color: var(--ink); padding: 10px 14px; font-weight: 700; text-decoration: none; cursor: pointer; }
  button.primary { background: var(--accent); border-color: var(--accent); color: white; }
  button:disabled { opacity: 0.45; cursor: not-allowed; }
  .counter { color: var(--muted); font-weight: 700; }
  .slide { min-height: calc(100vh - 82px); background: var(--paper); border: 1px solid var(--line); border-radius: 10px; padding: 18px; box-shadow: 0 18px 42px rgba(15, 23, 42, 0.10); display: grid; grid-template-columns: minmax(310px, 0.86fr) minmax(0, 1.55fr); gap: 18px; overflow: visible; }
  .paper-head { min-width: 0; min-height: 0; overflow: visible; display: flex; flex-direction: column; gap: 12px; }
  .figure { margin: 0; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: #f8fafc; }
  .figure img { display: block; width: 100%; max-height: 41vh; object-fit: contain; background: white; }
  .figure figcaption { padding: 7px 10px; color: var(--muted); font-size: 12px; line-height: 1.3; }
  .head-text { display: flex; flex-direction: column; gap: 9px; min-width: 0; }
  .badges { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .badge { border-radius: 999px; padding: 5px 9px; background: #eef2ff; color: #3730a3; font-size: 12px; font-weight: 800; }
  .score { background: #fee2e2; color: #991b1b; }
  h1 { margin: 0; font-size: 25px; line-height: 1.15; letter-spacing: 0; overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
  h1 a { color: inherit; text-decoration-color: rgba(23, 107, 135, 0.35); text-decoration-thickness: 2px; text-underline-offset: 4px; }
  h1 a:hover { color: var(--accent); text-decoration-color: var(--accent); }
  .meta, .authors, .why, .abstract { font-size: 13px; line-height: 1.45; }
  .meta, .authors { color: var(--muted); }
  .why strong, .abstract strong, .authors strong { color: var(--ink); }
  .authors { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .why { border-left: 4px solid var(--accent-2); padding-left: 10px; color: #374151; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .abstract { border-top: 1px solid var(--line); padding-top: 14px; color: #374151; }
  .original-abstract { border-top: 1px solid var(--line); padding-top: 10px; color: #374151; font-size: 11.5px; line-height: 1.35; overflow-wrap: anywhere; }
  .original-abstract strong { display: block; margin-bottom: 4px; color: var(--ink); }
  .tags { display: flex; flex-wrap: wrap; gap: 8px; }
  .tag { border-radius: 999px; padding: 4px 8px; background: #f1f5f9; color: #475569; font-size: 12px; font-weight: 700; }
  .head-text > .link { display: none; }
  .briefing { min-width: 0; min-height: 0; overflow: visible; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); grid-auto-rows: minmax(0, auto); align-content: start; gap: 11px 18px; border-top: 0; padding-top: 0; }
  .brief-section { min-width: 0; }
  .brief-section.wide { grid-column: 1 / -1; }
  .brief-section h2 { margin: 0 0 4px; font-size: 14px; line-height: 1.22; color: #0f766e; letter-spacing: 0; }
  .brief-section p, .brief-section li { margin: 0; font-size: 12.5px; line-height: 1.42; color: #1f2937; overflow-wrap: anywhere; }
  .brief-section ul { margin: 0; padding-left: 20px; }
  .concepts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 9px 14px; }
  .concept { border-top: 1px solid var(--line); padding-top: 7px; }
  .concept h3 { margin: 0 0 4px; font-size: 13px; color: #7c2d12; letter-spacing: 0; }
  .concept p { margin: 2px 0 0; font-size: 11.5px; line-height: 1.35; color: #374151; overflow-wrap: anywhere; }
  .concept b { color: #111827; }
  .link { color: var(--accent); font-weight: 800; text-decoration: none; }
  .empty { padding: 48px; background: var(--paper); border: 1px solid var(--line); border-radius: 12px; color: var(--muted); }
  @media (max-width: 860px) {
    .shell { padding: 14px; }
    .topbar, .top-actions { align-items: stretch; flex-direction: column; }
    .slide, .briefing, .concepts { grid-template-columns: 1fr; }
    .slide { min-height: auto; overflow: visible; display: grid; }
    h1 { font-size: 28px; }
  }
</style>

const slides = [{"title": "Superconducting state with broken time-reversal symmetry and collective modes in the kagome superconductors AV3Sb5 (A=K, Cs, Rb)", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/sk88-7gky", "authors": "Xinloong Han, Jun Zhan, Jiangping Hu, Fu-chun Zhang, Xianxin Wu", "last_authors": "Fu-chun Zhang, Xianxin Wu", "summary": "Author(s): Xinloong Han, Jun Zhan, Jiangping Hu, Fu-chun Zhang, and Xianxin Wu We comprehensively study the unconventional pairing and collective modes in the multiband kagome superconductors $A{\\mathrm{V}}_{3}{\\mathrm{Sb}}_{5}$ ($A=\\mathrm{K},\\mathrm{Cs},\\mathrm{Rb}$). By solving gap equations at zero temperature, we identify a transition from normal $(s++/s±)$-wave pairing t… [Phys. Rev. B 114, 024503] Published Wed Jul 01, 2026", "tier": "A_MUST_READ", "score": "10", "reason": "Direct hit: addresses TRSB and unconventional pairing in the user's primary kagome project materials.", "tags": ["theory", "kagome", "superconductivity", "TRSB"], "image": "", "briefing": {"background": "Kagome 격자 구조를 가진 AV3Sb5 계열 화합물은 전하 밀도 파동(CDW)과 초전도성이 공존하며, 특히 시간 반전 대칭성 깨짐(TRSB)의 징후가 관찰되어 비전통적 초전도체 후보로 주목받고 있습니다. 이 물질의 물리적 기원을 이해하는 것은 위상 물질 및 강상관 전자계 연구의 핵심 과제입니다.", "motivation": "본 연구는 AV3Sb5에서 나타날 수 있는 비전통적 페어링(pairing) 대칭성과 이로 인해 발생하는 집단 모드(collective modes)를 이론적으로 규명하여, 실험적으로 관찰된 TRSB 초전도 상태의 성질을 설명하고자 합니다.", "result": "영온도 갭 방정식을 통해 일반적인 s-파 페어링에서 시간 반전 대칭성이 깨진 초전도 상태로의 전이를 확인했습니다. 특히 다중 밴드 Kagome 구조에서 나타나는 페어링 메커니즘과 그에 따른 집단적 들뜸 현상을 상세히 분석했습니다.", "implication": "만약 본 연구의 이론적 예측이 맞다면, AV3Sb5는 단순한 초전도체가 아닌 다중 밴드 효과와 위상적 성질이 결합된 고도로 복잡한 페어링 상태를 가졌음을 의미하며, 이는 향후 Kagome 초전도체 제어에 중요한 지침을 제공합니다.", "novelty": "독자의 주된 관심사인 AV3Sb5 물질의 TRSB와 집단 모드를 구체적인 다중 밴드 모델로 다루었다는 점이 핵심입니다. 특히 초전도 전이 과정에서의 대칭성 변화를 정밀하게 추적했습니다.", "unresolved": "이론적으로 제시된 특정 집단 모드가 실제 RIXS나 다른 분광학적 실험에서 어느 정도의 신호 강도로 관찰될 수 있을지에 대한 정량적 확인이 더 필요합니다.", "future_work": "실제 ARPES나 STM 실험 데이터와의 정밀한 비교를 통해 예측된 페어링 대칭성을 확정하고, 외부 압력이나 도핑에 따른 상도표 변화를 연구할 필요가 있습니다.", "concepts": [{"term": "Kagome lattice", "why_emerged": "기하학적 좌절(frustration)과 특이한 밴드 구조(플랫 밴드, 디락 점)를 유도하기 위해 도입되었습니다.", "origin": "일본의 전통 대나무 바구니 패턴에서 유래되었습니다.", "connections": "CDW, 비전통적 초전도, 루프 전류 등과 밀접한 관련이 있습니다."}, {"term": "TRSB (Time-Reversal Symmetry Breaking)", "why_emerged": "비전통적 초전도체의 페어링 대칭성을 구분하는 핵심 지표로 중요해졌습니다.", "origin": "초록 정보만으로는 특정하기 어려우나, 초전도 연구의 고전적 화두입니다.", "connections": "루프 전류, 자성 초전도체, 위상 초전도체와 연결됩니다."}, {"term": "Collective modes", "why_emerged": "초전도 상태의 대칭성과 동역학적 특성을 이해하기 위해 필요한 개념입니다.", "origin": "초록 정보만으로는 특정하기 어려우나, 다체 물리 이론의 기초입니다.", "connections": "힉스 모드(Higgs mode), 레게트 모드(Leggett mode) 등과 관련이 있습니다."}, {"term": "Multiband superconductivity", "why_emerged": "실제 물질의 복잡한 페르미면 구조를 반영하여 초전도성을 설명하기 위해 필요합니다.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "MgB2, 철계 초전도체 등에서 중요하게 다뤄집니다."}], "english_summary": ["Investigates unconventional pairing and collective modes in AV3Sb5 kagome superconductors.", "Identifies a transition to a time-reversal symmetry-breaking (TRSB) superconducting state.", "Uses zero-temperature gap equations to model multiband interactions.", "Provides theoretical framework for understanding the nature of superconductivity in kagome metals."]}}, {"title": "Direct Visualization of Gate-Tunable Flat Bands in Twisted Double Bilayer Graphene", "journal": "PRL_Recent", "source": "author whitelist", "link": "http://link.aps.org/doi/10.1103/3vg5-vkzy", "authors": "Souvik Sasmal, Ryan Muzzio, Ahmed Khalifa, et al.", "last_authors": "Shubhayu Chatterjee, Jyoti Katoch", "summary": "Author(s): Souvik Sasmal, Ryan Muzzio, Ahmed Khalifa, Paulina Majchrzak, Alfred J. H. Jones, I-Hsuan Kao, Kenji Watanabe, Takashi Taniguchi, Simranjeet Singh, Eli Rotenberg, Aaron Bostwick, Chris Jozwiak, Søren Ulstrup, Shubhayu Chatterjee, and Jyoti Katoch The evolution of moiré minibands under varying carrier density and displacement field may be directly visualized using microfocused angle-resolved photoemission spectroscopy. [Phys. Rev. Lett. 137, 016402] Published Tue Jun 30, 2026", "tier": "A_MUST_READ", "score": "10", "reason": "author whitelist: Eli Rotenberg", "tags": ["angle-resolvedphotoemission", "photoemission", "graphene", "moir", "twisted", "flatband"], "image": "", "briefing": {"background": "비틀린 이중층 그래핀(Twisted Bilayer Graphene)과 같은 모아레(moiré) 시스템은 밴드 구조를 극적으로 평탄화하여 강상관 현상을 유도할 수 있어 활발히 연구되고 있습니다. 특히 게이트 전압을 통한 전자 구조 조절은 이 분야의 핵심 기술입니다.", "motivation": "비틀린 이중 적층 그래핀(TDBG)에서 게이트 전압과 변위장(displacement field)에 따라 모아레 미니밴드가 어떻게 진화하는지를 실험적으로 직접 시각화하여 확인하고자 했습니다.", "result": "마이크로 포커스 ARPES(micro-ARPES)를 사용하여, 외부 게이트 전압에 따라 조절되는 플랫 밴드(flat bands)의 실시간 변화를 성공적으로 직접 관찰했습니다.", "implication": "게이트 전압을 통해 나노스케일 장치 내부의 전자 구조를 직접 조작하고 확인했다는 점은, 모아레 시스템을 이용한 양자 소자 설계에 있어 강력한 도구를 확보했음을 의미합니다.", "novelty": "독자의 관심사인 ARPES 기술을 활용하여, 단순한 이론적 예측이 아닌 실제 소자 구동 환경에서의 밴드 튜닝을 '직접 시각화'했다는 점이 가장 큰 차별점입니다. Eli Rotenberg 그룹의 고해상도 micro-ARPES 역량이 돋보입니다.", "unresolved": "플랫 밴드 내부에서 발생하는 상관 관계 유도 갭(correlation-induced gaps)의 미세한 변화를 완전히 분해하기 위해서는 더 높은 에너지 분해능이 요구될 수 있습니다.", "future_work": "다양한 비틀림 각도와 다른 2D 물질 조합에 대해서도 게이트 튜닝 하의 밴드 구조 맵핑을 확장할 것으로 기대됩니다.", "concepts": [{"term": "Twisted Double Bilayer Graphene (TDBG)", "why_emerged": "단순 이중층보다 게이트를 통한 밴드 구조 제어가 용이하여 등장했습니다.", "origin": "초록 정보만으로는 특정하기 어려우나, 모아레 물리학의 발전 과정에서 파생되었습니다.", "connections": "Twisted Bilayer Graphene, Moore physics, Flat bands"}, {"term": "micro-ARPES", "why_emerged": "작은 크기의 소자나 불균일한 샘플의 전자 구조를 나노미터~마이크로미터 단위에서 측정하기 위해 개발되었습니다.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "Synchrotron radiation, Nano-ARPES, Device physics"}, {"term": "Flat bands", "why_emerged": "전자의 운동 에너지를 억제하여 전자 간 상호작용(상관 관계)이 지배적인 환경을 만들기 위해 필요합니다.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "Mott insulator, Superconductivity, Moiré patterns"}, {"term": "Gate-tunability", "why_emerged": "화학적 도핑 없이 전하 밀도를 실시간으로 조절하여 상전이를 관찰하기 위해 필수적입니다.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "Field-effect transistors, Quantum Hall effect"}], "english_summary": ["Directly visualizes gate-tunable flat bands in twisted double bilayer graphene using micro-ARPES.", "Demonstrates the evolution of moiré minibands under varying carrier density and displacement fields.", "Proves the effectiveness of in situ electronic structure manipulation in moiré systems.", "Key contribution from a whitelisted ARPES expert (Eli Rotenberg)."]}}, {"title": "Realization of strongly correlated 2D honeycomb boron", "journal": "Science_Advances", "source": "author whitelist", "link": "https://doi.org/10.1126/sciadv.aee3116", "authors": "Takemi Kato, Tomonori Nakamura, Kosuke Nakayama, et al.", "last_authors": "Yoshinori Okada, Takafumi Sato", "summary": "Borophene, a two-dimensional (2D) boron sheet, has recently gained considerable attention as a postgraphene material owing to its unique properties, such as intrinsic metallic character, lightest element monolayer structure, and high-frequency phonons. These features, together with its theoretically predicted high density of states, make borophene an excellent platform for investigating various quantum phenomena. However, the realization of emergent phenomena is hindered by fabrication challenges and inherently weak electronic correlations within the s and p electron system. Here, we demonstrate a strongly correlated 2D electronic state derived from a honeycomb boron lattice exposed at the surface of ternary boride LaRh 3 B 2 . Using angle-resolved photoemission spectroscopy, we uncover the extended saddle-point van Hove singularity near the Fermi level, which is linked to the substantial lattice expansion and many-body interaction. Moreover, scanning tunneling microscopy reveals the electronic nematicity, which likely originates from the saddle-point instability. Our findings open a pathway to exploring the exotic correlated phenomena in boron-based 2D systems.", "tier": "A_MUST_READ", "score": "10", "reason": "author whitelist: Takafumi Sato", "tags": ["angle-resolvedphotoemission", "pho  "ferromagnet", "transport"], "image": "", "briefing": {"background": "Fe5GeTe2는 실온 강자성을 보이는 층상 물질로, 스핀트로닉스 응용 가능성이 높으나 강자성 및 전자적 물성의 근원이 명확하지 않아 오랫동안 연구되었습니다.", "motivation": "D. L. Feng 그룹의 ARPES 역량을 활용하여 이 물질의 격자-자기-전자적 상호작용의 근본 원인을 규명하고자 합니다.", "result": "아격자(sublattice)에 의존하는 자기적 정렬과 강한 전자-마그논 결합(electron-magnon coupling)을 ARPES를 통해 직접 관측했습니다.", "implication": "밴드 구조의 변화가 자기적 정렬과 밀접하게 결합되어 있음을 보임으로써, Fe5GeTe2의 복잡한 물성을 이해하는 새로운 물리적 틀을 제공합니다.", "novelty": "D. L. Feng 그룹의 고분해능 ARPES를 통해 전자-마그논 상호작용을 시각화했다는 점이 핵심입니다. 특히 강상관 전자계와 자성 물질에 관심 있는 독자에게 중요한 연구입니다.", "unresolved": "마그논 모드와 결합하는 전자 밴드의 상세한 상호작용 기작, 그리고 도핑이나 온도 변화에 따른 위상 전이와의 연결 고리가 추가 논의되어야 합니다.", "future_work": "다양한 마그논 분산 관계를 확인하기 위한 비탄성 중성자 산란(INS)과의 상호 보완 연구 및 소자 기반의 자기 조절 실험이 기대됩니다.", "concepts": [{"term": "Electron-Magnon Coupling", "why_emerged": "자기적 들뜸(마그논)이 전자 밴드 구조에 미치는 영향을 이해하기 위해 도입됨.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "전자-포논 결합, 강상관 계의 밴드 재규격화."}, {"term": "Fe5GeTe2", "why_emerged": "실온에서 강자성을 유지하는 2차원 층상 물질 연구의 필요성.", "origin": "2010년대 후반부터 주목받는 2D 자성체 연구의 일환.", "connections": "Fe3GeTe2, 반데르발스 자성체, 위상 강자성."}], "english_summary": ["Direct observation of sublattice-dependent magnetic ordering in Fe5GeTe2 via ARPES.", "Reveals significant electron-magnon coupling driving the material's properties.", "Elucidates the microscopic origin of the room-temperature ferromagnetism.", "Provides key insights for 2D van der Waals magnetic systems."]}}, {"title": "Observation of quantum vortex core fractionalization and skyrmion formation in a superconductor", "journal": "Science", "source": "author whitelist", "link": "https://doi.org/10.1126/science.ads0189", "authors": "Yu Zheng, Quanxin Hu, Xin Yu, et al.", "last_authors": "Chi-Ming Yim, Hong Ding", "summary": "Magnetic fields can penetrate a superconductor in the form of quantum vortices, which consist of a core singularity with circulating currents. London’s quantization implies that there is one core singularity per quantum of magnetic 4"], "image": "", "briefing": {"background": "준 1차원(Quasi-1D) 물질은 전자가 일정한 방향으로만 제한되어 운동하기 때문에 강력한 전자 상관관계와 스핀-전하 분리, 특이한 자성 상전이 등을 연구하기에 매우 적합한 플랫폼입니다.", "motivation": "철 기반 초전도체와 연관된 철 칼코겐 화합물 계열에서 K3Fe2Se4가 보이는 비정상적인 블록형 반강자성 상태를 규명하고자 합니다.", "result": "K3Fe2Se4에서 새로운 블록형 반강자성 정렬을 발견하였으며, 이는 저차원 구조에서 나타나는 전자 상관관계가 자성 구조에 미치는 강력한 영향임을 보여줍니다.", "implication": "1차원 철-칼코겐 사슬 구조가 만드는 자성 상태가 물질의 전자적 특성과 어떻게 연결되는지 보여주며, 향후 비전통적 초전도체 연구의 새로운 모델을 제공합니다.", "novelty": "일반적인 2D 철 칼코겐 층 구조가 아닌 1D 사슬 구조에서 구현된 반강자성 상태를 발견하여, 저차원 자성물질 연구의 새로운 사례를 구축했습니다.", "unresolved": "이러한 블록형 반강자성이 초전도 상태와 어떤 연관성을 가지는지, 혹은 압력이나 도핑을 통해 초전도성을 유도할 수 있는지에 대한 정보가 부족합니다.", "future_work": "고압하에서의 구조적, 자기적 변화 측정 및 도핑에 따른 전자 상태 변화를 관찰하는 실험이 요구됩니다.", "concepts": [{"term": "블록형 반강자성", "why_emerged": "철 기반 층상 물질이나 사슬 구조에서 나타나는 스핀 배열이 단순히 인접한 스핀이 반대인 상태가 아니라, 특정 블록 단위로 정렬되는 현상을 정의하기 위해 필요했습니다.", "origin": "초록 정보만으로는 특정하기 어려움 (주로 철 칼코겐 화합물 연구에서 빈번하게 등장).", "connections": "KxFe2-ySe2, 전자 상관관계, 스핀 정렬."}, {"term": "준 1차원 물질", "why_emerged": "낮은 차원에서의 강한 전자 상호작용(Luttinger liquid 등)을 연구하기 위해 구조적으로 한 방향으로만 전자가 잘 흐르게 만든 물질들이 필요했습니다.", "origin": "1970년대 전도성 고분자 및 금속 체인 연구에서 체계화.", "connections": "Luttinger 액체, Peierls 전이, 이방성 전도도."}], "english_summary": ["Discovery of block-type antiferromagnetism in quasi-1D K3Fe2Se4.", "Explores correlated quantum interactions within a 1D iron-chalcogenide structure.", "Provides a model system for unconventional magnetism in low-dimensional materials."]}}, {"title": "Revisiting the Charge-Density-Wave Superlattice of 1T−TiSe2", "journal": "PRL_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/btvb-ngy5", "authors": "Wei Wang, Patrick Liu, Lijun Wu, et al.", "last_authors": "Alfred Zong, Yimei Zhu", "summary": "Author(s): Wei Wang, Patrick Liu, Lijun Wu, Jing Tao, Genda Gu, Binghai Yan, Alfred Zong, and Yimei Zhu A number of intriguing phenomena, including exciton condensation, orbital ordering, and emergence of chirality, have been proposed to accompany charge tates.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "High-impact overview of FQAH and Chern insulators in moiré materials, a key interest area.", "tags": ["moiré", "topology", "anomalousHall"], "image": "https://media.springernature.com/m685/springer-static/image/art%3A10.1038%2Fs41563-026-02649-9/MediaObjects/41563_2026_2649_Fig1_HTML.png", "briefing": {"background": "위상 절연체와 분수 양자 홀 효과는 외부 자기장 없이도 위상학적 질서를 구현할 수 있는 시스템입니다. 무아레(moiré) 격자 시스템은 강한 상관관계와 평탄한 밴드를 설계할 수 있어 분수 첸 절연체(Fractional Chern Insulator)를 구현하는 이상적인 플랫폼으로 주목받고 있습니다.", "motivation": "외부 자기장 없이 구현되는 분수 양자 변칙 홀 효과(FQAHE)의 메커니즘을 이해하고, 이를 통해 비-아벨(non-Abelian) 위상 상태와 같은 새로운 양자 상태로 나아가기 위한 이론적/실험적 경로를 체계화하고자 합니다.", "result": "무아레 시스템에서의 FQAHE 발현 메커니즘을 요약하고, 관련 실험적 증거들을 종합하여 향후 위상 양자 컴퓨팅 등에 활용 가능한 토폴로지 상태 탐색의 이정표를 제시했습니다.", "implication": "무아레 재료가 단순한 물리적 호기심을 넘어, 저전력 전자기기나 위상 양자 연산 소자 구현을 위한 플랫폼으로서 강력한 후보임을 뒷받침합니다.", "novelty": "외부 자기장 없이 분수 위상 상태를 달성하는 경로를 제시함으로써, 기존 양자 홀 효과가 가진 자기장 의존성 문제를 극복할 가능성을 열었습니다.", "unresolved": "실제 장치에서의 결함 제어, 더 높은 온도에서의 구현, 그리고 비-아벨 상태의 확정적 관측은 여전히 도전 과제로 남아 있습니다.", "future_work": "실험적인 비-아벨 통계 증명과 이 효과를 활용한 양자 소자 설계 및 스케일링 연구가 필요합니다.", "concepts": [{"term": "분수 첸 절연체", "why_emerged": "분수 양자 홀 효과를 자기장 없이 고체 결정 내에서 구현하기 위해 등장했습니다.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "분수 양자 홀 효과, 위상 절연체, 무아레 밴드 공학."}, {"term": "무아레 시스템", "why_emerged": "이종 구조에서 원자 격자의 불일치로 발생하는 평탄한 밴드를 통해 강한 상관관계를 유도하기 위해 필요합니다.", "origin": "트위스트 이층 그래핀 연구가 촉발.", "connections": "강상관계 물리학, 초전도성, 위상 물성."}], "english_summary": ["This perspective reviews the realization of FQAHE in moiré materials.", "It highlights the role of moiré lattices in creating flat topological bands at zero magnetic field.", "The paper maps out potential paths towards non-Abelian topological states.", "It serves as a comprehensive guide for future research in fractional Chern insulators."]}}, {"title": "High-Chern-number orbital magnetism in twisted rhombohedral graphene", "journal": "Nature_Materials", "source": ct correlation between the number of layers and the Chern number (C=n).", "Reports electrical and magnetic switching of these topological states.", "Offers a new pathway for controllable topological devices."]}}, {"title": "Tangled up in spin", "journal": "Nature_Physics", "source": "Gemini", "link": "https://www.nature.com/articles/s41567-026-03364-7", "authors": "Meigan Aronson", "last_authors": "Meigan Aronson", "summary": "Nature Physics, Published online: 01 July 2026; doi:10.1038/s41567-026-03364-7 Neutron scattering measurements on a strongly correlated metal show hints of quantum entanglement in the strange metal state.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Neutron scattering on a strange metal investigating entanglement; highly relevant to correlated electron physics.", "tags": ["neutron-scattering", "strange-metal", "strongly-correlated"], "image": "https://media.springernature.com/m685/springer-static/image/art%3A10.1038%2Fs41567-026-03364-7/MediaObjects/41567_2026_3364_Fig1_HTML.png", "briefing": {"background": "강상관계 금속(Strange metal)은 페르미 액체 이론을 따르지 않는 특이한 금속 상태로, 많은 고온 초전도체의 모상태로 알려져 있습니다. 이 상태에서의 양자 얽힘(Quantum entanglement) 연구는 강상관계 물리학의 핵심 난제 중 하나입니다.", "motivation": "중성자 산란을 통해 강상관계 금속의 동역학적 특성을 측정함으로써, 이 물질 내에 양자 얽힘이 존재하는지 실증적으로 확인하고자 합니다.", "result": "중성자 산란 데이터가 강상관계 금속 상태에서 양자 얽힘의 존재를 암시하는 신호를 보여주었음을 보고했습니다.", "implication": "strange metal의 복잡한 물성을 양자 정보론적 관점에서 해석할 수 있는 실마리를 제공합니다.", "novelty": "전통적인 응집물질 물리 기법인 중성자 산란을 사용하여 현대적인 양자 얽힘 문제를 접근했다는 점이 독특합니다.", "unresolved": "측정된 신호가 정확히 어떤 종류의 얽힘을 의미하는지, 그리고 전체 시스템의 거시적 물성과 어떻게 연결되는지에 대한 이론적 해석이 추가로 필요합니다.", "future_work": "더 정밀한 중성자 산란 데이터 해석과 이론 모델(예: SYK 모델 등)과의 정량적 비교가 이어질 것입니다.", "concepts": [{"term": "강상관계 금속 (Strange Metal)", "why_emerged": "저항이 온도에 선형적으로 비례하는 등 페르미 액체 이론으로 설명 불가능한 금속 상태를 설명하기 위해 등장했습니다.", "origin": "고온 초전도체 구리산화물 연구에서 널리 사용.", "connections": "양자 임계점, 페르미 액체, 고온 초전도."}, {"term": "중성자 산란", "why_emerged": "물질 내 원자의 자기적 모멘트와 격자 동역학을 동시에 관측하기 위해 필요합니다.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "스핀 파동, 자기 구조, 강상관계."}], "english_summary": ["Investigates quantum entanglement in strange metal states.", "Uses neutron scattering as a primary diagnostic tool.", "Provides empirical hints of entanglement in strongly correlated systems.", "Bridges the gap between correlation physics and quantum information."]}}, {"title": "DC spin current driven by low-frequency light in altermagnets", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/3j6x-397h", "authors": "Yihua Xiao, Ruizhi Dong, Xiaomu Wang, Ruixiang Fei", "last_authors": "Xiaomu Wang, Ruixiang Fei", "summary": "Author(s): Yihua Xiao, Ruizhi Dong, Xiaomu Wang, and Ruixiang Fei Efficient generation of DC spin-polarized currents via light is a promising route toward ultrafast spintronics, yet remains challenging. Here, we show that altermagnets, a class of antiferromagnets with symmetry-driven spin splitting, can generate DC spin currents via the nonlinear spin Hall effect.… [Phys. Rev. B 114, 014405] Published Wed Jul 01, 2026", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Directly explores altermagnets and a specific experimental observable (nonlinear spin Hall effect).", "tags": ["theory", "altermagnetism", "spintronics"], "image": "", "briefing": {"background": "알터마그넷(Altermagnet)은 기존의 강자성체나 일반적인 반강자성체와 달리, 비전통적인 자기 대칭성을 통해 에너지 밴드에서 스핀 분할을 나타내는 새로운 자기 상태입니다. 이는 차세대 스핀트로닉스의 핵심 소재로 주목받고 있습니다.", "motivation": "초고속 스핀트로닉스를 위해 빛을 이용하여 효율적으로 DC 스핀 전류를 생성하는 방법이 필요하며, 알터마그넷의 고유한 스핀 분할 특성이 이를 실현할 수 있을지 규명하고자 함.", "result": "알터마그넷 내에서 비선형 스핀 홀 효과(Nonlinear Spin Hall Effect)를 통해 외부 자기장 없이도 저주파 광 조사를 통해 DC 스핀 편극 전류를 유도할 수 있음을 이론적으로 제시함.", "implication": "알터마그넷 기반의 소자가 광학적 제어를 통해 외부 자기장 없이 작동 가능한 초고속 스핀트로닉스 플랫폼으로 활용될 수 있음을 시사함.", "novelty": "알터마그넷의 대칭성 기반 스핀 분할과 비선형 수송 현상을 결합하여 광학적 스핀 전류 생성 가능성을 논리적으로 연결함.", "unresolved": "이론적인 제안으로, 실제 물질에서의 광학적 응답 크기나 도핑에 의한 효과는 구체적으로 계산되지 않음.", "future_work": "실제 알터마그넷 물질에서 시간 분해 광전자 분광법(TR-ARPES)을 이용한 스핀 동역학 검증이 필요함.", "concepts": [{"term": "알터마그넷(Altermagnet)", "why_emerged": "기존 반강자성체의 스핀 상쇄 문제를 극복하고 스핀 분할된 밴드 구조를 통해 스핀트로닉스 응용을 위해 등장.", "origin": "최근 2020년대 초반 이론적으로 확립됨.", "connections": "반강자성체, 스핀 홀 효과, 비상반적 수송 현상."}, {"term": "비선형 스핀 홀 효과(Nonlinear Spin Hall Effect)", "why_emerged": "선형 응답을 넘어 외부 자계 없이도 베리 곡률(Berry curvature) 쌍극자 등을 통해 비선형 수송을 유도하기 위해 필요.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "비선형 아노말리 홀 효과, 베리 곡률."}], "english_summary": ["Altermagnets exhibit symmetry-driven spin-split bands, offering a new playground for spintronics.", "The authors show that low-frequency light induces DC spin currents via the nonlinear spin Hall effect.", "This mechanism functions without external magnetic fields, enabling ultrafast optical control.", "The theoretical framework establishes a pathway for altermagnet-based spintronic devices."]}}, {"title": "Flat-band driven Kondo breakdown and reentrant effects in heavy-fermion moiré superlattices", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/85vr-blw1", "authors": "Fabian Eickhoff, Jian-Xin Zhu, Benedikt Fauseweh", "last_authors": "Jian-Xin Zhu, Benedikt Fauseweh", "summary": "Author(s): Fabian Eickhoff, Jian-Xin Zhu, and Benedikt Fauseweh Moiré superlattices (MSLs) in van der Waals heterostructures have demonstrated their incredible power in driving emergent electronic phenomena, some of which are reminiscent of those usually only observed in bulk strongly correlated quantum materials. With the recent discovery of van der Waals $f$-e… [Phys. Rev. B 113, 235153] Published Fri Jun 26, 2026", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Combines moiré physics with heavy fermions; highly relevant for correlated electronic structure.", "tags": ["theory", "material", "moiré"], "image": "", "briefing": {"background": "무아레 초격자(Moiré superlattices)는 반데르발스 층상 물질을 쌓아 인위적으로 평탄 밴드(flat band)를 생성, 강한 전자 상관관계를 제어할 수 있는 플랫폼을 제공함.", "motivation": "무아레 계에서 나타나는 강상관 현상과 ority material class; predicts specific transport signatures in junctions.", "tags": ["theory", "material", "altermagnetism"], "image": "", "briefing": {"background": "조셉슨 다이오드 효과는 초전도 접합에서 전류-전압 특성이 방향에 따라 달라지는 비대칭 현상으로, 양자 컴퓨팅 및 소자 효율화에 중요함.", "motivation": "알터마그넷의 특수한 스핀 구조가 라쉬바(Rashba) 상호작용과 결합할 때, 외부 자기장 없이도 강한 초전도 다이오드 효과를 유도할 수 있는지 확인하고자 함.", "result": "알터마그넷 접합에서 3000%를 초과하는 효율의 횡방향 조셉슨 다이오드 효과를 이론적으로 예측함.", "implication": "자기장 없이 작동하는 초전도 회로 소자로서 알터마그넷이 고효율 비대칭 수송을 지원할 수 있음을 증명.", "novelty": "알터마그넷의 스핀 분할과 횡방향 조셉슨 전류의 결합을 통해 극도로 높은 다이오드 효율을 제시함.", "unresolved": "이러한 거대 다이오드 효과가 실제 실험 환경에서의 온도 변동이나 접합 결함에 얼마나 강건할지는 미지수임.", "future_work": "알터마그넷-초전도체 이종 접합 샘플 제작 및 저온 조셉슨 터널링 측정.", "concepts": [{"term": "조셉슨 다이오드 효과(Josephson diode effect)", "why_emerged": "초전도 기반의 비상반적 전하 수송을 구현하여 에너지 소모가 적은 소자를 만들기 위해 필요.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "초전도체, 비상반적 수송, 알터마그넷."}, {"term": "라쉬바 스핀-궤도 결합(Rashba SOC)", "why_emerged": "구조적 반전 대칭성 깨짐을 통해 전자의 스핀을 궤도 운동과 연결하기 위해 사용.", "origin": "Rashba 등 1960년대.", "connections": "토폴로지컬 절연체, 스핀트로닉스."}], "english_summary": ["The study predicts a giant field-free transverse Josephson diode effect in altermagnet-based junctions.", "By incorporating Rashba spin-orbit coupling, the diode efficiency exceeds 3000%.", "The mechanism involves generating transverse supercurrents through longitudinal phase bias.", "This suggests altermagnets as ideal components for low-power, non-reciprocal superconducting electronics."]}}, {"title": "Kagome edge states under lattice termination, spin-orbit coupling, and magnetic order", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/f46x-c84r", "authors": "Sajid Sekh, Annica M. Black-Schaffer, Andrzej Ptok", "last_authors": "Annica M. Black-Schaffer, Andrzej Ptok", "summary": "Author(s): Sajid Sekh, Annica M. Black-Schaffer, and Andrzej Ptok We study the edge state properties of a two-dimensional kagome lattice using a tight-binding approach, focusing on , "link": "http://link.aps.org/doi/10.1103/6w55-56wk", "authors": "Martin Sundermann, Joe D. Thompson, Eric D. Bauer, et al.", "last_authors": "Gertrud Zwicknagl, Andrea Severing", "summary": "Author(s): Martin Sundermann, Joe D. Thompson, Eric D. Bauer, Chun-Fu Chang, Sheng-Huai Chen, Chang-Yang Kuo, Liu Hao Tjeng, Gertrud Zwicknagl, and Andrea Severing The nature of cerium’s 4 f electron is key to understanding the mechanism of pressure-induced quantum criticality in the heavy-fermion ferromagnet CeRh 6 Ge 4 . Combining core-level photoemission and polarized x-ray absorption spectroscopy with simulations based on the single-impurity Anderson model, the authors demonstrate here that Kondo hybridization admixes higher-lying crystal field states into a multiorbital ground state with a 4 f occupancy n f ~ 0.9, which also accounts for the dynamical spin response. The results establish the importance of Kondo hybridization and the resulting multiorbital ground state as essential components for a model of quantum criticality. [Phys. Rev. B 113, 245149] Published Mon Jun 29, 2026", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Photoemission and X-ray absorption study of Kondo hybridization in a heavy-fermion ferromagnet.", "tags": ["spectroscopy", "material", "heavyfermion"], "image": "", "briefing": {"background": "CeRh6Ge4와 같은 강자성 중페르미온 물질은 압력 하에서 초전도성을 보이며, 이 과정에서 양자 임계점 부근의 4f 전자 거동과 콘도(Kondo) 효과가 핵심적인 역할을 합니다.", "motivation": "이 물질의 압력 유도 양자 임계성을 이해하기 위해 Ce 4f 전자 상태의 혼성화와 결정장(crystal field) 영향을 규명하고자 했습니다.", "result": "콘도 혼성화가 고에너지 결정장 상태를 다중 궤도 기저 상태로 혼합하며, 이는 약 0.9 정도의 4f 전자 점유율을 가짐을 확인했습니다.", "implication": "강자성 양자 임계 모델을 구축할 때 단순히 단일 궤도 모델이 아닌 다중 궤도 콘도 혼성화 효과를 반드시 고려해야 함을 보여줍니다.", "novelty": "핵심 레벨 광전자 분광법(PES)과 편광 X선 흡수 분광법(XAS)을 결합해 강자성 중페르미온의 기저 상태 특성을 실험적으로 명확히 규명했습니다.", "unresolved": "4f 전자의 동적 스핀 응답과 관련된 미세한 에너지 손실 메커니즘의 완벽한 모델링.", "future_work": "더 넓은 압력 범위에서의 추가적인 온도 의존성 분광 연구가 필요합니다.", "concepts": [{"term": "콘도 효과", "why_emerged": "비자성 금속 내 자성 uce alter… [Phys. Rev. Lett. 136, 256709] Published Thu Jun 25, 2026", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Specific Interest: Establishment of altermagnetism mechanisms in multiferroic systems.", "tags": ["theory", "material", "altermagnetism"], "image": "", "briefing": {"background": "얼터마그네틱(Altermagnetic) 물질은 일반적인 강자성이나 반강자성과 달리, 시간 반전 대칭성은 깨지되 스핀과 격자 구조의 결합을 통해 비자성 도체에서도 특이한 스핀 분열을 나타내는 새로운 자성 위상입니다.", "motivation": "반강축(Antiferroaxial) 질서가 얼터마그네틱 특성과 결합하여 다강성(multiferroic) 메커니즘을 형성할 수 있는지, 그리고 이것이 범용적인 물리 현상인지 탐구하고자 합니다.", "result": "반강축의 회전 왜곡이 얼터마그네틱 스핀 구조를 유도하는 일반적인 메커니즘임을 이론적으로 정립하였습니다. 이는 다강성 시스템에서 자성과 전기적 특성이 어떻게 연결되는지를 보여줍니다.", "implication": "다강성 물질 연구의 새로운 패러다임을 제시하며, 반강축 질서를 제어함으로써 새로운 기능성 스핀트로닉스 소자 개발의 가능성을 열었습니다.", "novelty": "기존 얼터마그네틱 연구의 범위를 반강축이라는 새로운 자유도로 확장하여, 다양한 결정 구조에서 나타날 수 있는 보편적인 메커니즘을 도출했습니다.", "unresolved": "이러한 반강축 얼터마그네틱 상태를 실제 물질에서 실험적으로 식별하고 제어하는 구체적인 방법론은 아직 부족합니다.", "future_work": "반강축 얼터마그네틱 성질을 가진 후보 물질들을 예측하고, 광학적 분광법이나 산란 실험을 통해 이를 검증하는 연구가 필요합니다.", "concepts": [{"term": "Antiferroaxial order", "why_emerged": "입체적인 격자 구조의 회전적 왜곡이 평행하지 않은 축을 따라 배열되는 질서를 정의하기 위해 등장했습니다.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "Multiferroics, Altermagnetism, Magnetic point groups"}, {"term": "Altermagnetism", "why_emerged": "강자성이나 일반 반강자성으로 분류되지 않는 독특한 스핀 분열(spin splitting)을 가진 자성체들을 통합적으로 이해하기 위해 제안되었습니다.", "origin": "Libor Šmejkal, Jairo Sinova 외 (최근 물리 학계에서 정립)", "connections": "Spintronics, Non-collinear antiferromagnetism"}], "english_summary": ["Establishes antiferroaxial altermagnetism as a broad, generic multiferroic mechanism.", "Connects counterrotating structural distortions to the induction of altermagnetic spin splitting.", "Provides a theoretical framework for understanding the interplay between axial order and magnetic symmetry.", "Opens new pathways for designing multifunctional spintronic devices via antiferroaxial control."]}}, {"title": "Landau Theory for Pair Density Modulation in Fe(Te,Se) Flakes", "journal": "PRL_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/n7xg-dbfz", "authors": "Po-Jui Chen, Piers Coleman", "last_authors": "Po-Jui Chen, Piers Coleman", "summary": "Author(s): Po-Jui Chen and Piers Coleman Motivated by recent scanning tunneling microscopy (STM) experiments reporting a pair-density modulation (PDM) in flakes of ${\\mathrm{FeTe}}_{0.55}{\\mathrm{Se}}_{0.45}$, we develop a Landau theory to elucidate its physical origin. We analyze the PDM in terms of screw and glide symmetries, interpretin… [Phys. Rev. Lett. 137, 016501] Published Mon Jun 29, 2026", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Landau theory for STM-observed pair-density modulation in iron chalcogenides.", "tags": ["topic", "unconventionalsuperconductivity", "STM"], "image": "", "briefing": {"background": "Fe(Te,Se)는 철 기반 초전도체 중 하나로, STM 실험을 통해 초전도 갭의 공간적 변조(Pair Density Modulation)가 보고되었습니다. 이는 초전도체 내에서 쿠퍼 쌍의 밀도가 불균일하게 분포하는 현상입니다.", "motivation": "STM으로 관찰된 Fe(Te,Se)의 pair density modulation(PDM) 현상의 물리적 기원을 대칭성 분석과 Landau 이론을 통해 설명하고자 합니다.", "result": "결정의 나사(screw) 및 미끄럼(glide) 대칭성을 기반으로 PDM을 해석하는 Landau 이론적 모델을 구축하였습니다. 이를 통해 실험에서 관찰된 패턴이 대칭성 파괴와 어떻게 연관되는지 설명했습니다.", "implication": "철 기반 초전도체에서 나타나는 복잡한 전자적 질서와 초전도성의 경쟁 및 공존을 이해하는 데 중요한 이론적 토대를 제공합니다.", "novelty": "현상학적 모델링에 그치지 않고 구체적인 결정 대칭성을 바탕으로 STM 데이터를 체계적으로 해석했다는 점에서 학술적 가치가 높습니다.", "unresolved": "이 PDM이 초전도성의 경쟁 요인인지, 아니면 공존하는 질서인지에 대한 실험적 확증이 추가로 필요합니다.", "future_work": "온도 변화에 따른 STM 관측과 다른 분광학적 기법을 통해 이 현상이 상전이와 어떻게 연결되는지 연구할 예정입니다.", "concepts": [{"term": "Pair Density Modulation (PDM)", "why_emerged": "초전도체 내에서 쿠퍼 쌍의 질서 매개변수가 공간적으로 주기적인 변조를 일으키는 현상을 기술하기 위해 필요합니다.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "Pair Density Wave(PDW), Iron-based superconductors, STM/STS"}, {"term": "Landau Theory", "why_emerged": "상전이 근처에서 질서 매개변수의 에너지 관점을 통해 시스템의 상태를 보편적으로 기술하기 위해 사용됩니다.", "origin": "Lev Landau (1937)", "connections": "Ginzburg-Landau theory, Phase transitions"}], "english_summary": ["Develops a Landau theory to explain pair density modulation in Fe(Te,Se) flakes.", "Uses screw and glide symmetries to elucidate the physical origin of observed spatial variations.", "Bridges the gap between STM-observed patterns and underlying crystalline symmetries.", "Provides insight into the nature of unconventional order in iron chalcogenide superconductors."]}}, {"title": "Observation of Altermagnetic Order Switching in Bulk MnTe by Polarized Neutron Diffraction", "journal": "PRL_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/yklc-9n6t", "authors": "Zheyuan Liu, Shinichiro Asai, Shingo Takahashi, Hiraku Saito, Taro Nakajima, Takatsugu Masuda", "last_authors": "Taro Nakajima, Takatsugu Masuda", "summary": "Author(s): Zheyuan Liu, Shinichiro Asai, Shingo Takahashi, Hiraku Saito, Taro Nakajima, and Takatsugu Masuda Altermagnetic order, characterized by the Néel vector, breaks time-reversal symmetry (TRS) even in the nonrelativistic limit. Although spin-polarized and anomalous transport phenomena emerge with this order, they are mutually compensated by TRS-connected antiphase domains with opposite Néel vectors.… [Phys. Rev. Lett. 136, 256704] Published Tue Jun 23, 2026", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Experimental study of altermagnetic switching in a prototypical material; highly relevant secondary interest.", "tags": ["material", "altermagnetism", "neutronscattering", "TRS"], "image": "", "briefing": {"background": "알터마그네티즘(Altermagnetism)은 강자성(스핀 정렬)과 반강자성(스핀 상쇄)의 경계에 있는 새로운 자기 질서입니다. 상대론적 효과 없이도 시간 역전 대칭성(TRS)을 깨고 스핀 분할된 밴드 구조를 가지는데, 이는 자성체 연구의 새로운 패러다임입니다.", "motivation": "알터마그네틱 물질에서 나타나는 anomalous transport 특성은 반대 방향의 닐 벡터(Néel vector)를 가진 도메인들에 의해 상쇄되는 문제가 있습니다. 이를 제어(switching)하는 것은 스핀트로닉스 응용의 핵심입니다.", "result": "벌크 MnTe 물질에서 편광 중성자 회절을 통해 알터마그네틱 도메인 제어 및 닐 벡터 스위칭을 실험적으로 관찰하였습니다.", "implication": "알터마그네틱 도메인 상태를 외부에서 제어할 수 있음을 증명함으로써, 향후 비휘발성 메모리나 스핀 전류 제어 장치로의 발전 가능성을 제시합니다.", "novelty": "이론적으로 round": "KTaO3 기반의 산화물 계면은 스핀-궤도 결합이 강하고 초전도성이 나타나는데, 이 초전도 현상의 기원과 결정 방위(orientation)에 따른 의존성이 오랜 연구 주제였습니다.", "motivation": "결정 방향에 따라 초전도 전이 온도(Tc)가 극명하게 변하는 현상을 이해하고, 이를 관통하는 보편적인 물리적 지표를 찾고자 했습니다.", "result": "LaAlO3/KTaO3 계면에서 Tc가 결정 기하학적 파라미터(각도)와 선형적인 관계(linear scaling)를 가짐을 발견하였습니다.", "implication": "계면의 구조적 대칭성이 초전도성에 결정적인 역할을 하며, 이를 통해 초전도성 제어의 가이드라인을 제공할 수 있습니다.", "novelty": "복잡한 계면 초전도 현상을 기하학적 파라미터와의 선형 관계로 단순화하여 모델링할 수 있음을 보여주었습니다.", "unresolved": "선형 관계의 구체적인 미시적 물리 메커니즘(왜 선형인가)에 대한 이론적 뒷받침이 추가로 필요합니다.", "future_work": "다른 산화물 계면 시스템으로의 확장 및 해당 파라미터 조절을 통한 Tc 향상 연구.", "concepts": [{"term": "산화물 계면 초전도", "why_emerged": "두 절연체 계면에서 나타나는 전도성 전자 가스(2DEG)의 기원을 이해하고 초전도 현상을 제어하기 위해.", "origin": "Ohtomo and Hwang (2004, SrTiO3/LaAlO3).", "connections": "2DEG, LaAlO3/KTaO3, 스핀-궤도 결합."}], "english_summary": ["Discovery of linear scaling between Tc and crystal orientation at KTaO3 interfaces.", "Identifies geometric parameters as key drivers of interfacial superconductivity.", "Provides a unifying insight into orientation-dependent superconducting phases.", "Useful for engineering superconducting quantum devices."]}}, {"title": "Orbital Altermagnetism in Two Dimensions", "journal": "PRL_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/l8fc-dp36", "authors": "Mingxiang Pan, Feng Liu, Huaqing Huang", "last_authors": "Feng Liu, Huaqing Huang", "summary": "Author(s): Mingxiang Pan, Feng Liu, and Huaqing Huang We introduce the concept of orbital altermagnetism , a symmetry-protected magnetic order of pure orbital degrees of freedom. It is characterized with ordered antiparallel orbital magnetic moments in real space but momentum-dependent orbital band splittings, analogous to spin altermagnetism. Using a m… [Phys. Rev. Lett. 137, 016702] Published Tue Jun 30, 2026", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Introduces orbital altermagnetism concept; highly relevant to user's altermagnetism and orbital degrees interest.", "tags": ["topic", "altermagnetism", "2Dmaterials"], "image": "", "briefing": {"background": "기존 알터마그네티즘이 '스핀'의 자유도에 집중했다면, 궤도 자기 모멘트가 반평행하게 정렬된 '궤도 알터마그네티즘'은 궤도 물리와 위상 물리를 결합하려는 시도입니다.", "motivation": "스핀 자유도 없이 궤도 자유도만으로도 알터마그네틱 효과(시간 역전 대칭성 깨짐 및 밴드 분할)를 구현할 수 있는 시스템을 제안하고자 했습니다.", "result": "2차원 물질 모델을 통해 궤도 알터마그네티즘을 정의하고, 실제 밴드 구조에서의 분할 현상을 증명하였습니다.", "implication": "스핀-궤도 결합이 약하거나 없는 물질에서도 궤도 제어를 통해 위상학적 성질을 유도할 수 있는 새로운 가능성을 열었습니다.", "novelty": "기존 스핀 중심의 알터마그네티즘 개념을 '궤도' 영역으로 확장하여 이론적 토대를 마련하였습니다.", "unresolved": "실제 실험에서 이러한 궤도 알터마그네틱 상태를 측정하기 위한 구체적인 분광학적 방법론(예: CD-ARPES 활용 등)은 과제로 남습니다.", "future_work": "실제 물질 기반의 제1원리 계산 및 궤도 알터마그네티즘을 나타낼 후보 물질 탐색.", "concepts": [{"term": "궤도 알터마그네티즘", "why_emerged": "스핀 정렬 없이도 밴드 분할을 구현하기 위해 궤도 자유도를 활용하고자 함.", "origin": "초록 정보만으로는 특정하기 어려움 (본 논문이 핵심 개념 정립).", "connections": "알터마그네티즘, 궤도 자유도, Berry 곡률."}], "english_summary": ["Introduction of 'orbital altermagnetism' in 2D systems.", "Distinguishes purely orbital-based magnetic order from spin-based altermagnetism.", "Predicts momentum-dependent band splittings driven by orbital symmetry.", "Opens new paths for orbitronics and topological physics."]}}, {"title": "Orbital magnetoresistance in the antiferromagnet CoO driven by dynamic orbital angular momentum", "journal": "Science", "source": "Gemini", "link": "https://doi.org/10.1126/science.adw1808", "authors": "Christin Schmitt, Sachin Krishnia, Mahmoud Zeer, et al.", "last_authors": "Yuriy Mokrousov, Mathias Kläui", "summary": "Recent predictions of orders of magnitude larger orbital current effects compared with spin currents have attracted considerable interest. However, orbital currents must first be converted into spin currents to interact with the static magnetization dominated by spin angular momentum in conventional magnets. By using a magnet dominated by orbital angular momentum (OAM), we demonstrate a 70-fold enhancement in orbital Hall magnetoresistance in cobalt II oxide/copper (CoO/Cu*), compared with spin Hall magnetoresistance in cobalt II oxide/platinum (CoO/Pt). This arises from interactions between dynamic OAM from surface-oxidized Cu* and static OAM in the antiferromagnetic insulator CoO. Our results show how by using OAM-dominated materials, we can harness the benefits of giant orbital currents that have not been possible using conventional spin-dominated magnets.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Significant exploration of orbital angular momentum and transport in a correlated antiferromagnetic insulator.", "tags": ["antiferromagnetism", "orbital-currents", "magnetoresistance"], "image": "", "briefing": {"background": "스핀트로닉스 분야에서 전자 스핀의 흐름(spin current)을 이용한 소자 제어가 연구되어 왔으나, 최근에는 스핀보다 더 큰 효과를 낼 수 있는 궤도 각운동량(OAM) 전류에 대한 관심이 급증하고 있습니다.", "motivation": "기존의 스핀 의존적인 자성체에서는 OAM 전류가 스핀 전류로 변환되어야만 상호작용이 가능했습니다. 본 연구는 OAM이 지배적인 물질(CoO)을 직접 활용하여 효율적인 OAM 전류 제어가 가능한지 확인하고자 했습니다.", "result": "CoO/Cu* 이질구조에서 CoO/Pt 구조 대비 70배 향상된 궤도 홀 자기저항(Orbital Hall Magnetoresistance)을 관측했습니다.", "implication": "스핀 전류 변환 과정의 손실을 피하고, 궤도 각운동량 자체를 직접 활용하여 차세대 저전력 스핀트로닉스 소자의 효율을 극대화할 수 있음을 보여줍니다.", "novelty": "기존 스핀 중심의 자기저항 연구를 넘어 궤도 각운동량이 직접적인 수송 현상을 지배하는 새로운 물리적 영역을 실험적으로 입증했습니다.", "unresolved": "표면 산화된 Cu에서 발생하는 동적 궤도 각운동량의 구체적인 미세 메커니즘과 CoO 계면에서의 상세한 결합 특성은 추가적인 규명이 필요합니다.", "future_work": "다양한 궤도 지배 물질 탐색 및 이를 활용한 초고속 비휘발성 메모리 소자 제작 및 특성 평가가 기대됩니다.", "concepts": [{"term": "Orbital Hall Magnetoresistance", "why_emerged": "궤도 전류가 자기저항 변화에 미치는 효과를 정량화하기 위해 정의됨.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "스핀 홀 효과(Spin Hall Effect)와 대칭적인 개념."}, {"term": "Orbital Angular Momentum (OAM)", "why_emerged": "스핀 자기 모멘트 외에도 전자의 궤도 운동에 의한 자기 모멘트가 수송 현상에 미치는 기여를 이해하기 위해 필요.", "origin": "고전적인 원자 물리학에서 기원.", "connections": "궤도 홀 효과, 스핀-궤도 결합(SOC)."}], "english_summary": ["Demonstrates a 70-fold enhancement in magnetoresistance using OAM-dominated CoO instead of spin-dominated materials.", "Utilizes the interaction between dynamic OAM from Cu* and static OAM in the antiferromagnetic insulator CoO.", "Proposes OAM-based transport as a more efficient alternative to conventional spin current mechanisms.", "Provides a scalable platform for future orbital-based spintronic devices."]}}, {"title": "Superconducting phase diagram of multilayer square-planar nickelates", "journal": "Science", "source": "Gemini", "link": "https://doi.org/10.1126/science.adp4440", "authors": "Grace A. Pan, Dan Ferenc Segedin, Sophia F. R. TenHuisen, et al.", "last_authors": "Berit H. Goodge, Julia A. Mundy", "summary": "The discovery of superconductivity in square-planar nickelates has offered a rich materials platform to explore the origins of high-temperature superconductivity. However, experimental investigations have largely been limited to the infinite-layer R NiO 2 ( R , rare earth) nickelates. We constructed a phase diagram of multilayer square-planar Nd n +1 Ni n O 2 n +2 compounds and found signatures of superconductivity for dimensionality n = 4 to 8. Upon decreasing n , the superconducting anisotropy evolves owing to 4 f electron effects, and electronic structure characteristics approach cuprate-like behavior. Magnetic fluctuations persist from within the superconducting regime and into the overdoped, nonsuperconducting regime. The superconducting regime overlaps with that of chemically doped infinite-layer nickelates, demonstrating underlying commonalities as well as differences across varying structural realizations of square-planar nickelates. Our work establishes this layered template for creating new nickel-based superconductors.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "High-impact experimental study on square-planar nickelates, a key class of unconventional superconductors.", "tags": ["nickelates", "superconductivity", "phasediagram"], "image": "", "briefing": {"background": "구리산화물(Cuprate) 고온 초전도체의 기원을 이해하기 위해, 전자 구조적으로 유사한 층상 구조 니켈산염(Nickelates) 연구가 활발히 진행되고 있습니다.", "motivation": "지금까지 니켈산염 연구는 주로 무한층 구조(RNiO2)에 집중되어 왔습니다. 연구팀은 층의 수(n)
