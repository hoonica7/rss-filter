<!DOCTYPE html>

<title>Daily Paper Slideshow</title>
<style>
  :root {
    color-scheme: light;
    --bg: #f6f7f4;
    --paper: #ffffff;
    --ink: #111827;
    --muted: #64748b;
    --line: #d8ddd2;
    --accent: #176b87;
    --accent-2: #9a3412;
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; overflow: auto; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: var(--bg); color: var(--ink); }
  .shell { max-width: 1500px; min-height: 100vh; margin: 0 auto; padding: 14px 18px; display: flex; flex-direction: column; }
  .topbar { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 16px; }
  .top-actions { display: flex; align-items: center; gap: 10px; }
  .topbar a, button { border: 1px solid var(--line); border-radius: 8px; background: var(--paper); color: var(--ink); padding: 10px 14px; font-weight: 700; text-decoration: none; cursor: pointer; }
  button.primary { background: var(--accent); border-color: var(--accent); color: white; }
  button:disabled { opacity: 0.45; cursor: not-allowed; }
  .counter { color: var(--muted); font-weight: 700; }
  .slide { min-height: calc(100vh - 82px); background: var(--paper); border: 1px solid var(--line); border-radius: 10px; padding: 18px; box-shadow: 0 18px 42px rgba(15, 23, 42, 0.10); display: grid; grid-template-columns: minmax(310px, 0.86fr) minmax(0, 1.55fr); gap: 18px; overflow: visible; }
  .paper-head { min-width: 0; min-height: 0; overflow: visible; display: flex; flex-direction: column; gap: 12px; }
  .figure { margin: 0; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: #f8fafc; }
  .figure img { display: block; width: 100%; max-height: 41vh; object-fit: contain; background: white; }
  .figure figcaption { padding: 7px 10px; color: var(--muted); font-size: 12px; line-height: 1.3; }
  .head-text { display: flex; flex-direction: column; gap: 9px; min-width: 0; }
  .badges { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .badge { border-radius: 999px; padding: 5px 9px; background: #eef2ff; color: #3730a3; font-size: 12px; font-weight: 800; }
  .score { background: #fee2e2; color: #991b1b; }
  h1 { margin: 0; font-size: 25px; line-height: 1.15; letter-spacing: 0; overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
  h1 a { color: inherit; text-decoration-color: rgba(23, 107, 135, 0.35); text-decoration-thickness: 2px; text-underline-offset: 4px; }
  h1 a:hover { color: var(--accent); text-decoration-color: var(--accent); }
  .meta, .authors, .why, .abstract { font-size: 13px; line-height: 1.45; }
  .meta, .authors { color: var(--muted); }
  .why strong, .abstract strong, .authors strong { color: var(--ink); }
  .authors { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .why { border-left: 4px solid var(--accent-2); padding-left: 10px; color: #374151; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .abstract { border-top: 1px solid var(--line); padding-top: 14px; color: #374151; }
  .original-abstract { border-top: 1px solid var(--line); padding-top: 10px; color: #374151; font-size: 11.5px; line-height: 1.35; overflow-wrap: anywhere; }
  .original-abstract strong { display: block; margin-bottom: 4px; color: var(--ink); }
  .tags { display: flex; flex-wrap: wrap; gap: 8px; }
  .tag { border-radius: 999px; padding: 4px 8px; background: #f1f5f9; color: #475569; font-size: 12px; font-weight: 700; }
  .head-text > .link { display: none; }
  .briefing { min-width: 0; min-height: 0; overflow: visible; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); grid-auto-rows: minmax(0, auto); align-content: start; gap: 11px 18px; border-top: 0; padding-top: 0; }
  .brief-section { min-width: 0; }
  .brief-section.wide { grid-column: 1 / -1; }
  .brief-section h2 { margin: 0 0 4px; font-size: 14px; line-height: 1.22; color: #0f766e; letter-spacing: 0; }
  .brief-section p, .brief-section li { margin: 0; font-size: 12.5px; line-height: 1.42; color: #1f2937; overflow-wrap: anywhere; }
  .brief-section ul { margin: 0; padding-left: 20px; }
  .concepts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 9px 14px; }
  .concept { border-top: 1px solid var(--line); padding-top: 7px; }
  .concept h3 { margin: 0 0 4px; font-size: 13px; color: #7c2d12; letter-spacing: 0; }
  .concept p { margin: 2px 0 0; font-size: 11.5px; line-height: 1.35; color: #374151; overflow-wrap: anywhere; }
  .concept b { color: #111827; }
  .link { color: var(--accent); font-weight: 800; text-decoration: none; }
  .empty { padding: 48px; background: var(--paper); border: 1px solid var(--line); border-radius: 12px; color: var(--muted); }
  @media (max-width: 860px) {
    .shell { padding: 14px; }
    .topbar, .top-actions { align-items: stretch; flex-direction: column; }
    .slide, .briefing, .concepts { grid-template-columns: 1fr; }
    .slide { min-height: auto; overflow: visible; display: grid; }
    h1 { font-size: 28px; }
  }
</style>

<script>
const slides = [{"title": "Tuning the Fermi surface of MoTe2 by Nb doping", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/nqff-vzcg", "authors": "Andrew P. Weber, Iñigo Robredo, Philipp Rüßmann, et al.", "last_authors": "J. Enrique Ortega, Julen Ibañez-Azpiroz", "summary": "Ab initio calculations and angle-resolved photoemission experiments demonstrate that the bulk and surface electronic structure of Weyl semimetal candidate ${\\mathrm{MoTe}}_{2}$ changes significantly by tuning the chemical potential by less than 0.4 eV. Calculations indicate that several Lifshitz tra…", "tier": "A_MUST_READ", "score": "10", "reason": "Direct hit: ARPES and DFT study of the electronic structure and Fermi surface of a Weyl semimetal.", "tags": ["ARPES", "MoTe2", "Weylsemimetal", "Fermisurface"], "image": "", "briefing": {"background": "Weyl 준금속(Weyl semimetals)은 고체 내에서 질량이 없는 Weyl 페르미온 입자를 모사하며, 위상적으로 보호된 표면 상태(Fermi arc)와 독특한 수송 특성을 보입니다. MoTe2는 특히 Type-II Weyl 준금속의 후보물질로 주목받고 있으며, 전자의 에너지 밴드 구조가 페르미 준위 근처에서 어떻게 구성되는지에 따라 그 위상적 성질이 결정됩니다.", "motivation": "MoTe2의 위상적 특성을 실제 응용에 활용하기 위해서는 화학 포텐셜(chemical potential)을 조절하여 Weyl 점(Weyl points)의 위치나 페르미 면의 형상을 제어하는 것이 필수적입니다. 본 연구는 Nb 도핑을 통해 전자 구조를 미세 조정(tuning)하고 그에 따른 변화를 ARPES와 DFT로 확인하고자 했습니다.", "result": "Nb 도핑을 통해 화학 포텐셜을 0.4 eV 미만의 범위에서 조절함으로써 MoTe2의 벌크 및 표면 전자 구조가 크게 변화함을 확인했습니다. 계산 결과 여러 번의 리프시츠 전이(Lifshitz transitions)가 발생하며, 이는 페르미 면의 위상적 연결 상태가 변함을 의미합니다.", "implication": "단순한 도핑만으로도 MoTe2의 전자 구조를 정밀하게 제어할 수 있음을 입증했습니다. 이는 Weyl 준금속의 위상적 상태를 원하는 대로 설계하거나, 특정 에너지에서 나타나는 양자 수송 현상을 극대화하는 데 기여할 수 있습니다.", "novelty": "실험(ARPES)과 이론(DFT)을 결합하여 0.4 eV라는 매우 좁은 에너지 창 안에서 발생하는 복잡한 페르미 면의 변화와 리프시츠 전이를 상세히 규명했다는 점이 중요합니다. 사용자 관심사인 ARPES를 이용한 Weyl 준금속 제어 연구의 전형적인 사례입니다.", "unresolved": "도핑에 의한 무질서(disorder) 효과가 Weyl 페르미온의 산란이나 수명(lifetime)에 미치는 구체적인 영향에 대해서는 추가적인 검증이 필요해 보입니다.", "future_work": "도핑된 MoTe2에서의 Weyl arc 관찰 및 자기 수송(magnetotransport) 측정을 통해 베리 곡률(Berry curvature) 관련 효과가 어떻게 변하는지 확인하는 후속 연구가 예상됩니다.", "concepts": [{"term": "Weyl semimetal", "why_emerged": "상대론적 디락 방정식을 만족하는 질량 없는 입자를 고체 물리 내에서 구현하기 위해 등장함.", "origin": "Hermann Weyl (1929년 이론적 제시)", "connections": "Dirac semimetal, Topological Insulator, Fermi arc"}, {"term": "Lifshitz transition", "why_emerged": "외부 압력이나 도핑에 의해 페르미 면의 위상(topology)이 갑자기 변하는 현상을 설명하기 위함.", "origin": "Ilya Lifshitz (1960년)", "connections": "Fermi surface topology, Van Hove singularity"}, {"term": "ARPES", "why_emerged": "물질 내부 전자들의 에너지와 운동량 관계(밴드 구조)를 직접 측정하기 위해 필수적인 도구로 발전함.", "origin": "초록 정보만으로는 특정하기 어려움 (광전효과에 기반)", "connections": "Photoemission, Fermi surface mapping"}, {"term": "Nb doping", "why_emerged": "반도체나 반금속의 전하 운반자 농도를 조절하여 물리적 성질을 튜닝하기 위해 널리 사용됨.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "Chemical potential tuning, Hole doping"}], "english_summary": ["Demonstrated significant tuning of MoTe2 electronic structure via Nb doping within a 0.4 eV range.", "Combined ARPES experiments and DFT calculations to map the evolving Fermi surface.", "Identified multiple Lifshitz transitions induced by chemical potential shifts.", "Provides a pathway for controlling topological features in Type-II Weyl semimetals."]}}, {"title": "Cooperative concurrence of 4f and 3d flat bands in the kagome heavy-fermion metal YbCr6Ge6", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/zdzj-bln9", "authors": "Wenxin Lv (吕文欣), Pengcheng Ma (马鹏程), Tianqi Wang (王天琦), et al.", "last_authors": "Zhonghao Liu (刘中灏), Hechang Lei (雷和畅)", "summary": "Flat-band (FB) systems originating from special lattice geometry like in kagome metals as well as localized orbitals in materials such as heavy-fermion (HF) compounds have attracted intensive interest due to their band topology and strong electron correlation effects, leading to emergent quantum sta…", "tier": "A_MUST_READ", "score": "9", "reason": "Strongly relevant: Kagome lattice, flat bands, and heavy-fermion electronic structure.", "tags": ["kagome", "flatbands", "heavyfermion", "electronicstructure"], "image": "", "briefing": {"background": "카고메(Kagome) 격자는 기하학적 좌절(frustration)로 인해 전자 에너지 밴드에서 '플랫 밴드(flat band)'를 형성하기 쉽습니다. 한편, 4f 전자를 가진 희토류 기반 화합물은 강한 전자 상관관계에 의해 '무거운 페르미온(heavy fermion)' 상태를 형성합니다. 이 두 가지 효과가 결합되면 매우 독특한 양자 상태가 나타날 수 있습니다.", "motivation": "본 연구는 YbCr6Ge6라는 카고메 격자 물질에서 Cr의 3d 전자에서 기인한 기하학적 플랫 밴드와 Yb의 4f 전자에서 기인한 상관관계 플랫 밴드가 어떻게 공존하고 상호작용하는지 탐구하는 것을 목표로 합니다.", "result": "YbCr6Ge6에서 3d 전자의 카고메 플랫 밴드와 4f 전자의 국부적 밴드가 동시에 존재(cooperative concurrence)함을 발견했습니다. 이는 기하학적 위상과 강한 상관관계가 한 시스템 내에서 조화롭게 나타날 수 있음을 보여줍니다.", "implication": "단순한 카고메 금속이나 일반적인 무거운 페르미온 계를 넘어, 두 물리적 기원이 다른 플랫 밴드가 결합된 새로운 유형의 강상관 위상 물질 연구의 장을 열었습니다.", "novelty": "3d 전자의 격자 유래 플랫 밴드와 4f 전자의 국부 오비탈 유래 플랫 밴드의 '협동적 결합'을 명시적으로 제시했다는 점이 매우 참신하며, 사용자 관심사인 카고메 금속(AV3Sb5 등) 연구와도 깊은 연관이 있습니다.", "unresolved": "두 종류의 플랫 밴드 사이의 혼성(hybridization) 강도와 그것이 실제 초전도나 자기적 질서로 이어지는지에 대한 상세한 기작은 아직 논의의 여지가 있습니다.", "future_work": "극저온/고자기장 ARPES를 통한 곤도(Kondo) 산란 연구나 중성자 산란을 통한 자기 구조 분석이 뒤따를 것으로 보입니다.", "concepts": [{"term": "Kagome lattice", "why_emerged": "삼각형과 육각형이 교차하는 기하 구조로 인해 파동함수의 상쇄 간섭(destructive interference)이 발생, 플랫 밴드를 형성하기 쉬움.", "origin": "일본의 바구니 패턴(Kagome)에서 유래", "connections": "Flat bands, Frustration, Quantum Spin Liquid"}, {"term": "Heavy-fermion metal", "why_emerged": "국부적인 f-전자와 전도 전자 사이의 상호작용(Kondo effect)으로 인해 전자의 유효 질량이 매우 커지는 현상을 설명.", "origin": "Steglich et al. (1979년 CeCu2Si2에서 발견)", "connections": "Kondo lattice, Strong correlation, Unconventional superconductivity"}, {"term": "Flat band", "why_emerged": "에너지 분산이 거의 없는 밴드에서 전자 간의 쿨롱 상호작용이 극대화되어 다양한 창발적 현상이 나타남.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "Superconductivity, Wigner crystal, Fractional Quantum Hall Effect"}, {"term": "Cooperative concurrence", "why_emerged": "서로 다른 기원의 물리적 현상이 한 물질에서 동시에 나타나 서로를 강화하거나 보완하는 상태를 지칭.", "origin": "본 연구진이 강조한 표현으로 보임", "connections": "Multiferroics, Interplay of degrees of freedom"}], "english_summary": ["Explored the coexistence of 3d and 4f flat bands in the kagome heavy-fermion metal YbCr6Ge6.", "Identified geometry-induced flat bands from Cr-kagome lattice and correlation-induced bands from Yb 4f orbitals.", "Discussed the synergy between band topology and strong electron correlations.", "Provides a platform for studying emergent quantum states in kagome systems with f-electrons."]}}, {"title": "Graphene lattice recoil in hard x-ray photoemission: Experiment and theory", "journal": "PRB_Recent", "source": "keyword", "link": "http://link.aps.org/doi/10.1103/s8w3-plc1", "authors": "Simone Ritarossi, Alice Apponi, Orlando Castellano, et al.", "last_authors": "Francesco Offi, Alessandro Ruocco", "summary": "Hard-x-ray C 1 s photoemission from monolayer graphene probes a regime in which nuclear recoil and intrinsic electronic asymmetry contribute on comparable energy scales to the observed spectral line shape. Here we combine experiment and modeling over the photon-energy range 0.8 – 8 keV to resolve this interplay quantitatively. A graphene-specific implementation of the Fujikawa-Takata cumulant formalism, based on an anisotropic vibrational density of states constrained by first-principles phonon calculations, captures the expected recoil scaling with photon energy and emission geometry but fails to reproduce the pronounced asymmetric tails of the measured spectra. To overcome this limitation, we introduce an explicit electronic convolution model in which a photon-energy-independent reference response, dominated by the electronic line shape and extracted from the low-recoil 0.8 keV data through a recoil-inclusive fit, is convolved with a phonon recoil kernel carrying the full dependence on photon energy and emission angle. This approach reproduces both the measured line-shape evolution and the observed peak shifts across the explored energy range without refitting the spectra at higher photon energies. The results show that recoil in graphene cannot be described by a baseline treatment in which the phonon recoil kernel is combined only with symmetric lifetime broadening, but must be treated together with the intrinsic many-body electronic response of the C 1 s line.", "tier": "A_MUST_READ", "score": "9", "reason": "title strong match: photoemission", "tags": ["photoemission", "graphene", "monolayer"], "image": "", "briefing": {"background": "경엑스선 광전자 분광법(HAXPES)은 높은 에너지의 X선을 사용하여 물질 깊숙한 곳의 정보를 얻을 수 있는 장점이 있지만, 방출되는 전자의 운동 에너지가 커짐에 따라 원자핵이 반동(recoil)을 겪으며 스펙트럼이 왜곡되는 문제가 발생합니다. 특히 그래핀처럼 가벼운 원자로 이루어진 물질에서는 이 효과가 더 두드러집니다.", "motivation": "단일층 그래핀의 C 1s 코어 수준(core-level) HAXPES 측정 시 발생하는 격자 반동 효과와 고유한 전자적 비대칭성(electronic asymmetry) 사이의 정량적 관계를 규명하고자 했습니다.", "result": "표준적인 모델(Fujikawa-Takata cumulant formalism)만으로는 실험에서 관찰된 강한 비대칭 꼬리(asymmetric tails)를 완벽히 설명할 수 없음을 확인했습니다. 이에 연구팀은 광자 에너지에 독립적인 전자적 응답 함수와 격자 반동 커널을 결합한 새로운 '전자적 컨볼루션 모델'을 도입하여 실험 결과를 완벽하게 재현했습니다.", "implication": "가벼운 원소로 구성된 저차원 물질의 HAXPES 데이터를 해석할 때, 단순한 수명 확장(lifetime broadening)뿐만 아니라 다체 전자 응답과 격자 반동의 결합을 반드시 고려해야 함을 시사합니다.", "novelty": "0.8 keV에서 8 keV에 이르는 광범위한 에너지 영역에서 그래핀의 반동 효과를 정량적으로 모델링했다는 점이 돋보입니다. 광전자 분광법(ARPES/PES)에 관심이 높은 사용자에게 분광학적 분석의 정밀도를 높이는 중요한 방법론적 진보를 제공합니다.", "unresolved": "다양한 기판(substrate) 위에서의 그래핀이나 다른 2D 물질에서도 이 모델이 동일하게 적용되는지에 대한 추가 검증이 필요합니다.", "future_work": "다른 경원소 기반 2D 물질(h-BN 등)에 대한 HAXPES 연구와 더 정교한 다체 효과 계산과의 비교가 기대됩니다.", "concepts": [{"term": "Lattice recoil", "why_emerged": "고에너지 광전자가 방출될 때 운동량 보존 법칙에 의해 원자핵이 반대 방향으로 밀려나며 발생하는 에너지 손실을 설명하기 위함.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "HAXPES, Doppler broadening, Phonon excitation"}, {"term": "HAXPES", "why_emerged": "기존 소트프 X선 기반 PES보다 더 깊은 측정 깊이(bulk sensitivity)를 확보하기 위해 고안됨.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "XPS, Synchrotron radiation, Bulk electronic structure"}, {"term": "Many-body electronic response", "why_emerged": "전자 방출 시 남겨진 정공(hole)과 주변 전자들 사이의 상호작용으로 인해 스펙트럼이 비대칭적으로 변하는 현상을 설명.", "origin": "Doniach and Sunjic (1970년 등)", "connections": "Singularity index, Core-level spectroscopy"}, {"term": "Cumulant formalism", "why_emerged": "다체계의 물리량을 계산할 때 복잡한 고차 상관 함수를 효과적으로 전개하기 위한 수학적 기법.", "origin": "Fujikawa and Takata (광전자 분광 분야 적용)", "connections": "Green's function, Spectral function"}], "english_summary": ["Investigated the interplay between lattice recoil and electronic asymmetry in monolayer graphene using HAXPES (0.8–8 keV).", "Found that standard phonon recoil models fail to capture the asymmetric line shapes of C 1s spectra.", "Introduced an electronic convolution model combining photon-energy-independent many-body response with a recoil kernel.", "Demonstrated that recoil in light-atom systems must be treated alongside intrinsic many-body electronic effects."]}}, {"title": "Time-reversal-symmetry-breaking spin injection from a compensated magnet", "journal": "Nature", "source": "Gemini", "link": "https://www.nature.com/articles/s41586-026-11227-7", "authors": "Jone Mencos, Antonin Badura, Eoin Dolan, et al.", "last_authors": "Helena Reichlova, Fèlix Casanova", "summary": "Experiments show that altermagnetic Mn5Si3 generates spin currents despite zero net magnetization, demonstrating a central prediction of altermagnetic spintronics.", "tier": "B_IMPORTANT_CONDMAT", "score": "9", "reason": "Experimental demonstration of altermagnetic spin injection in Mn5Si3; directly addresses user interest in altermagnetism and TRSB.; demoted from A: broad CM, not direct user/project hit", "tags": ["material", "altermagnetism", "spintronics"], "image": "https://media.springernature.com/m685/springer-static/image/art%3A10.1038%2Fs41586-026-11227-7/MediaObjects/41586_2026_11227_Fig1_HTML.png", "briefing": {"background": "스핀트로닉스 분야에서 기존의 강자성체는 자화 누설 문제로 고밀도 소자 구현에 한계가 있었습니다. 반강자성체는 자화가 없지만 스핀 분극 전류를 생성하기 어렵다는 단점이 있는데, 이를 극복하기 위해 제안된 '알터마그네틱(Altermagnetism)'은 스핀-궤도 결합 없이도 대칭성 기반의 스핀 분할을 제공합니다.", "motivation": "알터마그네틱 물질인 Mn5Si3에서 순 자화가 0임에도 불구하고 시간 반전 대칭성 깨짐(TRSB)을 활용한 스핀 전류 생성 가능성을 실험적으로 검증하고자 했습니다.", "result": "Mn5Si3에서 순 자화가 없는 상태에서도 스핀 주입이 가능함을 입증하여, 알터마그네틱이 실제 스핀트로닉스 응용의 핵심 자원이 될 수 있음을 보였습니다.", "implication": "알터마그네틱 물질이 강자성체의 효율성과 반강자성체의 안정성을 동시에 갖춘 차세대 스핀트로닉 소자의 플랫폼이 될 수 있음을 강력하게 시사합니다.", "novelty": "순 자화가 없는 물질에서 스핀 주입을 직접 관측했다는 점이 중요하며, 이는 독자께서 관심을 가지시는 자기 위상 물질 및 TRSB 연구와 맥을 같이 합니다.", "unresolved": "실제 소자 환경에서의 구체적인 스핀 주입 효율이나 다른 알터마그네틱 물질로의 보편적 확장성에 대해서는 추가 연구가 필요합니다.", "future_work": "다양한 알터마그네틱 후보 물질에서의 스핀 전류 생성 효율 측정 및 실제 논리 소자(logic device) 구현 가능성 탐색.", "concepts": [{"term": "알터마그네틱", "why_emerged": "강자성과 반강자성의 한계를 극복하고 스핀 분극 전류와 제로 자화라는 특성을 동시에 얻기 위해 제안됨.", "origin": "최근 수년 내 이론적으로 정립되었으며, 2020년대 초반부터 실험적 후보 물질 탐색이 활발히 진행됨.", "connections": "반강자성 스핀트로닉스, 비상반성 자기 수송 현상."}, {"term": "시간 반전 대칭성 깨짐 (TRSB)", "why_emerged": "물질의 위상적 성질과 자성적 비등방성을 이해하는 핵심 물리량임.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "위상 절연체, 자기 위상 물질, 위상 초전도체."}], "english_summary": ["Mn5Si3 demonstrates spin current generation despite zero net magnetization.", "Experimental proof of TRSB-driven spin injection in altermagnets.", "Bridges the gap between antiferromagnetic stability and ferromagnetic spin functionality.", "Provides a concrete platform for future altermagnetic spintronics."]}}, {"title": "Chiral altermagnon in MnTe", "journal": "Science", "source": "Gemini", "link": "https://www.science.org/doi/abs/10.1126/science.adv3196?af=R", "authors": "Daniel Jost, Resham Babu Regmi, Eder G. Lomeli, et al.", "last_authors": "Stephan Geprägs, Matthias F. Kling", "summary": "Altermagnetism has been recognized as a magnetic phase that bridges the properties of ferro- and antiferromagnetism. The momentum-dependent spin splitting observed in these materials reflects their distinctive symmetry characteristics, which also establish the conditions for chiral magnons to emerge. Here we provide direct experimental evidence for a chiral magnon in the altermagnetic candidate manganese telluride (MnTe) revealed by circular-dichroism resonant inelastic x-ray scattering. This mode, which we term chiral altermagnon, exhibits a distinct momentum dependence of its spin polarization consistent with the altermagnetic g -wave symmetry of MnTe. Our polarization-resolved data corroborate the existence of a discrete class of magnetic excitations, demonstrating how altermagnetic order shapes spin dynamics and paving the way for advances in spintronic and quantum technologies.", "tier": "B_IMPORTANT_CONDMAT", "score": "9", "reason": "Important experimental work on altermagnetic materials relevant to magnetic topological physics.", "tags": ["altermagnetism", "MnTe", "magnon"], "image": "", "briefing": {"background": "반강자성체 내부의 스핀 들뜸인 마그논(magnon)은 전통적으로 비자성적이거나 대칭성이 높습니다. 알터마그네틱은 스핀 대칭성이 낮아 운동량에 의존하는 스핀 구조를 가지며, 이로 인해 독특한 성질을 갖는 마그논이 존재할 것으로 예측되었습니다.", "motivation": "MnTe라는 알터마그네틱 후보 물질에서 이론적으로 예측된 '카이랄 알터마그논(chiral altermagnon)'을 직접 관측하여 물질의 대칭성과 스핀 동역학 간의 관계를 증명하고자 했습니다.", "result": "CD-RIXS(원편광 이색성 공명 비탄성 X선 산란)를 통해 MnTe에서 스핀 편극이 운동량에 의존하는 카이랄 알터마그논 모드를 관측했습니다.", "implication": "알터마그네틱의 g-wave 대칭성이 스핀 동역학을 어떻게 제어하는지 실험적으로 확립되었으며, 이는 자기 위상 물질 내 스핀 모드 제어에 큰 이정표가 됩니다.", "novelty": "CD-RIXS라는 정밀한 실험 기법을 사용해 알터마그네틱 특유의 마그논 구조를 시각화했으며, 이는 독자의 ARPES/RIXS 기반 전자 구조 연구와 깊은 연관이 있습니다.", "unresolved": "이러한 카이랄 마그논이 실제 정보 저장 및 전달 소자에서 어떤 효율을 보일지는 아직 불분명합니다.", "future_work": "다른 알터마그네틱 화합물에서의 카이랄 마그논 관측 및 이를 이용한 스핀 파동 제어 기술 개발.", "concepts": [{"term": "카이랄 알터마그논", "why_emerged": "알터마그네틱의 비대칭 스핀 구조가 마그논 들뜸에 투영되어 발생하는 운동량 의존적 스핀 편극 현상을 설명하기 위해 필요.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "스핀 파동, 위상 마그노닉스, 스핀-궤도 토크."}, {"term": "CD-RIXS", "why_emerged": "물질 내부의 미세한 스핀 및 궤도 들뜸을 에너지와 운동량 공간에서 동시에 관측하기 위해 고안됨.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "공명 비탄성 X선 산란, 자기적 들뜸 분광학."}], "english_summary": ["Direct experimental observation of chiral magnons in MnTe.", "Utilizes circular-dichroism RIXS to reveal momentum-dependent spin polarization.", "Confirms altermagnetic g-wave symmetry influence on spin dynamics.", "Paves the way for utilizing altermagnetic orders in quantum technologies."]}}, {"title": "Subcycle videography of Landau–Zener–Majorana transitions in graphene", "journal": "Nature", "source": "Gemini", "link": "https://www.nature.com/articles/s41586-026-11214-y", "authors": "V. Eggers, G. Inzani, M. Meierhofer, et al.", "last_authors": "R. Huber, U. Höfer", "summary": "An experimental concept enabling attosecond-precision, subcycle band-structure videography covering the entire first Brillouin zone is demonstrated and used to visualize the lightwave-driven electron motion of Landau–Zener–Majorana transitions in graphene.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Experimental band-structure videography mapping transitions in graphene; relevant to electronic structure and Floquet engineering.", "tags": ["spectroscopy", "graphene", "bandstructure"], "image": "https://media.springernature.com/m685/springer-static/image/art%3A10.1038%2Fs41586-026-11214-y/MediaObjects/41586_2026_11214_Fig1_HTML.png", "briefing": {"background": "고체 물리학에서 펨토초 단위의 빠른 전자 동역학을 시간 분해능으로 관측하는 것은 매우 어렵습니다. 특히 강한 빛에 의해 발생하는 밴드 구조 변화와 전이 현상을 직접 관찰하는 기술은 차세대 고속 소자 설계의 근간이 됩니다.", "motivation": "그래핀 내에서 빛에 의해 유도된 란다우-제너-마요라나(LZM) 전이를 서브사이클(subcycle) 수준의 정밀도로 실시간 기록(videography)하고자 했습니다.", "result": "전체 브릴루앙 영역에 걸쳐 attosecond 수준의 정밀도로 밴드 구조의 변화를 시각화하여, 전자들이 빛에 의해 어떻게 움직이는지 직접 관찰하는 데 성공했습니다.", "implication": "강한 빛-물질 상호작용 하의 전자 상태 변화를 실시간으로 제어하고 관측하는 '플로케(Floquet) 엔지니어링' 연구에 혁신적인 도구가 될 것입니다.", "novelty": "밴드 구조를 '비디오'처럼 찍어냈다는 점이 큰 기술적 도약이며, 독자가 관심 갖는 플로케 공학의 실험적 구현과 직결됩니다.", "unresolved": "실험 조건의 강한 레이저 펄스가 물질 자체의 고유한 성질(위상학적 불변량 등)을 파괴하지 않고 얼마나 효과적으로 튜닝할 수 있는지에 대한 엄밀한 검증이 필요합니다.", "future_work": "위상 반금속 및 기타 강상관 물질에 이 기술을 적용하여 플로케 위상 상태 변화 실시간 관측.", "concepts": [{"term": "란다우-제너-마요라나 전이", "why_emerged": "두 에너지 준위 사이의 비단열적 전이 확률을 설명하기 위해 필요.", "origin": "Landau(1932), Zener(1932), Majorana(1932).", "connections": "양자 제어, 비단열 동역학, 플로케 물리학."}, {"term": "플로케 엔지니어링", "why_emerged": "주기적으로 변하는 외부장을 이용해 물질의 밴드 구조나 위상학적 특성을 인위적으로 조절하기 위해 도입됨.", "origin": "Floquet(1883), 현대 고체 물리학 적용은 201 erpolation, and Kubo formalism, they map the torque across the magnetization sphere. They reveal hidden torques on mirror-related Fe atoms up to 30 times the net torque, whose cancellation could be lifted through van der Waals engineering.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Electronic structure analysis of important vdW ferromagnets Fe3GeTe2 and Fe3GaTe2.", "tags": ["DFT", "Fe3GeTe2", "vdWferromagnet"], "image": "", "briefing": {"background": "Fe3GeTe2(FGT) 계열은 대표적인 2차원 강자성체로, 층 내 자성 질서와 전기적 제어가 가능하여 스핀-궤도 토크(SOT) 연구의 핵심 물질입니다.", "motivation": "무거운 원소 없이도 강한 스핀-궤도 결합(SOC) 효과를 나타내는 Fe3GeTe2와 Fe3GaTe2에서, 원자 수준 및 운동량 공간(momentum-space)에서의 SOT 기작을 상세히 분해하고자 했습니다.", "result": "수평 거울 대칭성으로 인해 전체 SOT가 상쇄되는 지점이 존재하며, 자화 방향을 기울일 때 강한 각도 의존성이 나타남을 확인했습니다.", "implication": "vdW 공학을 통해 거울 대칭성을 깨뜨리면 숨겨진 강력한 스핀 토크를 추출할 수 있음을 제시했습니다.", "novelty": "DFT 및 Kubo formalism을 통해 원자 단위의 스핀 토크 분해를 수행함으로써, FGT 계열 물질의 SOT 최적화 전략을 구체화했습니다.", "unresolved": "실제 소자 구현 시 발생하는 결함이나 층간 상호작용이 이론적 계산 값에 미치는 영향은 여전히 변수로 남아있습니다.", "future_work": "계산된 토크의 물리적 현상을 입증하기 위한 전기적 측정 실험이 수반되어야 합니다.", "concepts": [{"term": "Spin-Orbit Torque (SOT)", "why_emerged": "전류를 사용하여 자성체의 자화를 효율적으로 제어하기 위함.", "origin": "2010년대 초반 위상학적 절연체/강자성체 계면 연구에서 부상.", "connections": "스핀홀 효과, 자성 메모리(MRAM), Rashba 효과."}, {"term": "Kubo Formalism", "why_emerged": "선형 응답 이론을 통해 외부 전기장에 대한 물질의 응답(전도도, 토크 등)을 계산하기 위함.", "origin": "료고 쿠보(Ryogo Kubo)가 1957년 제안.", "connections": "Berry 곡률, 비정상 홀 효과, 수송 현상."}], "english_summary": ["Theoretical study of SOT in Fe3GeTe2 and Fe3GaTe2 using DFT and Kubo formalism.", "Mirror symmetry identified as a limiting factor for net spin torque.", "Hidden torques on mirror-related Fe atoms are 30 times larger than the net effect.", "Proposes van der Waals engineering to lift symmetry-imposed cancellations."]}}, {"title": "Controllable quantum spin Hall phases in Bi2Te3-family van der Waals heterobilayers", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi 중층의 브릴루앙 존 구석(corner) 근처에서 디락 마그논의 특성을 관찰했습니다. 기판과의 상호작용으로 격자 대칭성이 깨져 갭이 열리기는 하지만, 국소적인 계곡 위상(valley topology)은 유지됨을 확인했습니다.", "implication": "위상학적 보호를 받는 마그논 전송을 통해 저전력 스핀트로닉스 소자 구현 가능성을 제시합니다.", "novelty": "실제 자성 박막 시스템에서 디락 마그논의 존재를 실험적으로 증명했다는 점이 핵심이며, 위상학적 자성체 연구와 관련이 깊습니다.", "unresolved": "기판과의 상호작용이 구체적으로 마그논의 수명에 미치는 영향이나 외부 제어를 통한 갭 크기 조절의 정밀도는 추가 연구가 필요합니다.", "future_work": "다른 3d 자성 박막에서의 디락 마그논 탐색 및 실제 온-칩 마그논 소자로의 응용 가능성 평가.", "concepts": [{"term": "디락 마그논 (Dirac magnons)", "why_emerged": "스핀파의 분산 관계가 선형적인 디락 콘 형태를 띨 경우, 높은 이동도와 위상학적 특성을 가질 것으로 기대되기 때문입니다.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "그래핀의 디락 전자, 위상 절연체, 스핀트로닉스"}, {"term": "계곡 위상 (Valley topology)", "why_emerged": "브릴루앙 존 내의 서로 다른 계곡(valley)에서의 전자기적 특성을 위상학적으로 정의하기 위해 도입되었습니다.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "밸리트로닉스, 위상학적 상태"}], "english_summary": ["Experimental observation of Dirac magnons in epitaxial Co bilayer on Ru(0001).", "Demonstrates that Dirac physics persists even when sublattice symmetry is broken.", "Local valley topology remains intact despite the opening of a magnon gap.", "Highlights potential for developing topological magnon-based on-chip devices."]}}, {"title": "Raman spectroscopy of the van der Waals altermagnet Co1/4NbSe2", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/f173-1z4x", "authors": "Dushyanthini Balasundaram, Bishal Thapa, Resham Babu Regmi, Nirmal J. Ghimire, Igor I. Mazin, Patrick M. Vora", "last_authors": "Igor I. Mazin, Patrick M. Vora", "summary": "We investigate the influence of Co intercalation and altermagnetic order on the lattice dynamics of the layered compound ${\\mathrm{Co}}_{1/4}{\\mathrm{NbSe}}_{2}$. Polarization-resolved Raman spectroscopy, supported by density-functional theory, enables identification of six Raman-active phonons. Co …", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Experimental study of an altermagnet in a vdW system related to the user's NbSeX interests.", "tags": ["experiment", "altermagnetism", "NbSe2", "Raman"], "image": "", "briefing": {"background": "최근 자성체 연구에서 강자성, 반강자성을 넘어선 '알터마그넷(altermagnet)'이라는 새로운 자기 질서가 주목받고 있습니다. 이는 스핀-분극된 밴드를 가지면서도 순수 자화가 없는 독특한 상태입니다.", "motivation": "Co가 삽입된 층상 구조 화합물 Co1/4NbSe2에서 알터마그네틱 질서와 격자 동역학 간의 상관관계를 라만 분광법으로 규명하고자 합니다.", "result": "편광 분광 분석과 DFT 계산을 결합하여 총 6개의 라만 활성 포논 모드를 식별하고 알터마그네틱 상태가 격자 진동에 미치는 영향을 분석했습니다.", "implication": "반 데르 발스 물질 기반의 알터마그넷 연구를 위한 기초 실험 자료를 제공하며, NbSe2 기반의 자성 물리 이해를 넓혔습니다.", "novelty": "알터마그네틱 물질로 제안된 후보군에서 실험적인 격자 동역학 데이터를 확보했다는 점이 중요합니다.", "unresolved": "알터마그네틱 질서가 격자 구조를 어떻게 미세하게 왜곡하는지에 대한 직접적인 증거는 추가적인 고해상도 측정 등이 필요합니다.", "future_work": "알터마그네틱 위상과 초전도성 등 다른 양자 상태와의 경쟁 및 공존 가능성 연구.", "concepts": [{"term": "알터마그넷 (Altermagnet)", "why_emerged": "강자성/반강자성의 범주에 들지 않으면서도 스핀 분리된 밴드 구조를 갖는 새로운 자기 물질의 분류가 필요해짐에 따라 등장했습니다.", "origin": "최근 이론적 제안이 활발하며, 특정 물질군에서 실험적 증거가 축적되는 단계입니다.", "connections": "반강자성, 비자성 스핀 분극, 위상 반강자성체"}, {"term": "라만 분광법 (Raman spectroscopy)", "why_emerged": "물질의 격자 진동(포논)을 비파괴적으로 분석하여 상전이 및 구조적 정보를 얻기 위해 필수적입니다.", "origin": "C.V. Raman이 발견(1928).", "connections": "적외선 분광법, 격자 동역학, 강상관 전자계 연구"}], "english_summary": ["Study of lattice dynamics in Co1/4NbSe2 using polarization-resolved Raman spectroscopy.", "Identified six Raman-active phonon modes in the presence of altermagnetic order.", "Combined experimental data with DFT calculations to map structural and magnetic influence.", "Provides experimental insight into vdW-based altermagnets."]}}, {"title": "Revealing charge transfer in defect-engineered 4Hb−TaS2", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/tls3-873z", "authors": "Siavash Karbasizadeh, Wooin Yang, Wonhee Ko, et al.", "last_authors": "Tom Berlijn, Sai Mu", "summary": "We present a comprehensive first-principles investigation of defects in $4{H}_{b}\\text{−}{\\mathrm{TaS}}_{2}$. In this layered transition metal dichalcogenide, charge transfer between alternating Mott-insulating 1T and metallic 1H layers gives rise to exotic quantum phases such as the Kondo effect an…", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "DFT study of 4Hb-TaS2, a highly relevant layered material with Mott and metallic layers.", "tags": ["DFT", "TaS2", "Kondoeffect"], "image": "", "briefing": {"background": "4Hb-TaS2는 전이금속 디칼코게나이드(TMD) 중에서도 Mott 절연체(1T 층)와 금속성(1H 층) 층이 교대로 쌓인 물질로, 층간 전하 이동에 의한 복합적인 양자 현상을 연구하는 모델 시스템입니다.", "motivation": "이 물질 내의 결함(defect)이 층간 전하 이동과 Kondo 효과 같은 상관관계 물성에 어떤 영향을 주는지 이론적으로 규명하고자 합니다.", "result": "제1원리 계산을 통해 결함 구조에 따른 전하 분포 변화를 확인하였으며, 1T 층과 1H 층 사이의 전하 이동이 Kondo 효과와 같은 exotic한 현상을 발생시키는 메커니즘을 밝혔습니다.", "implication": "결함 제어를 통해 층상 물질의 양자 상태를 튜닝할 수 있는 물리적 근거를 제공합니다.", "novelty": "DFT 계산을 통해 4Hb-TaS2의 복잡한 층간 전하 거동을 시각화하고 물리적 기원을 밝혔다는 점에서 가치가 있습니다.", "unresolved": "실제 실험에서 발생하는 무작위 결함 분포가 Kondo 온도나 전하 밀도 파(CDW) 질서에 미치는 정량적 영향은 아직 논쟁의 여지가 있습니다.", "future_work": "실험적인 STM/STS 측정과 결합하여 결함이 유도하는 전자 상태 밀도의 국소적 변화 검증.", "concepts": [{"term": "4Hb-TaS2", "why_emerged": "1T 층(Mott 절연체)과 1H 층(금속성)의 이종 접합이 하나의 결정 내에 존재하는 희귀한 구조로서 학문적 가치가 높습니다.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "전이금속 디칼코게나이드(TMD), Mott 물리, 초전도체"}, {"term": "Kondo 효과 (Kondo effect)", "why_emerged": "금속 내의 자성 불순물이 전도 전자와 상호작용하여 저온에서 저항이 상승하는 현상을 설명하기 위해 등장했습니다.", "origin": "Jun Kondo (1964).", "connections": "강상관 전자계, 중페르미온(Heavy fermion), 양자 불순물 문제"}], "english_summary": ["First-principles investigation of defect-engineered 4Hb-TaS2.", "Explores charge transfer between Mott-insulating 1T and metallic 1H layers.", "Links charge transfer mechanisms to exotic phenomena such as the Kondo effect.", "Theoretical framework for defect-mediated quantum state engineering in layered TMDs."]}}, {"title": "Transparency-controlled multiple charge transfer in superconducting junctions with local shot-noise scanning tunneling spectroscopy", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/81fz-49c6", "authors": "Yudai Sato, Maialen Ortego Larrazabal, Jian-Feng Ge, et al.", "last_authors": "Milan P. Allan, Jiasen Niu", "summary": "Charge transport in superconducting junctions at finite voltages is governed by Andreev reflections, including multiple Andreev reflections, which are processes that enable multiple charge transfer, a hallmark that shot noise can directly quantify. Since the effective charge extracted from shot-noise measurements varies with the transparency of the junction, systematic control of transparency is essential but experimentally challenging. Here, we present shot-noise scanning tunneling microscopy measurements enabled by a newly developed amplifier, allowing access to different transparency regimes. We perform shot-noise measurements on Pb(111) with tunable transparency at 2.2 K and observe that the shot noise evolves from a single-electron tunneling regime to multiple charge-transfer regimes as transparency increases. Our results are quantitatively consistent with theoretical simulations of Andreev reflections and multiple Andreev reflections for a single-channel system. These results establish junction transparency as the key parameter governing the evolution of charge transport and demonstrate that noise STM is a powerful platform for investigating microscopic charge transport mechanisms with controlled junction transparency at the atomic scale.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Advanced STM/STS study of charge transport in superconductors; highly relevant spectroscopic method.", "tags": ["experiment", "STM/STS", "superconductivity"], "image": "", "briefing": {"background": "초전도 접합에서의 전하 수송은 Andreev 반사(AR)를 통해 이루어지며, 전압이 커지면 여러 개의 전자가 쌍으로 넘어가는 다중 Andreev 반사(MAR) 과정이 일어납니다. 이를 이해하는 것은 초전도 소자의 미세 물리 규명에 필수적입니다.", "motivation": "접합의 투명도(transparency)에 따라 달라지는 전하 수송의 변화를 관측하기 위해, 투명도를 정밀하게 제어할 수 있는 새로운 STM 기반의 샷 노이즈(shot-noise) 측정 플랫폼이 필요했습니다.", "result": "새로 개발한 앰프를 사용하여 Pb(111) 표면에서 접합 투명도를 조절하며 샷 노이즈를 측정했습니다. 그 결과, 투명도가 증가함에 따라 단일 전자 터널링 영역에서 다중 전하 수송 영역으로 전이되는 과정을 실험적으로 확인했습니다.", "implication": "접합 투명도가 초전도 미세 수송 메커니즘을 결정짓는 핵심 변수임을 입증했으며, 향후 다양한 나노 구조물에서의 전하 수송 메커니즘을 원자 단위에서 정밀 제어할 수 있는 가능성을 열었습니다.", "novelty": "기존 STM의 정밀도를 유지하면서 초전도 접합의 투명도를 체계적으로 제어하는 'Noise STM' 플랫폼을 구현하여 MAR 과정을 정량적으로 검증했다는 점이 핵심입니다.", "unresolved": "이번 실험은 단일 채널 시스템에서의 검증에 집중되어 있으며, 복잡한 다중 채널 환경이나 위상 초전도체와 같은 보다 복잡한 물리 시스템에 대한 적용은 추가 연구가 필요합니다.", "future_work": "위상 초전도체나 비전통적 초전도체에서의 샷 노이즈 측정을 통해 쿠퍼 쌍의 분리나 마요라나 준입자 관련 물리 현상을 관찰하는 후속 연구가 기대됩니다.", "concepts": [{"term": "Andreev 반사", "why_emerged": "금속-초전도체 계면에서 전하가 어떻게 초전도체로 들어가는지 설명하기 위해 필요.", "origin": "A. F. Andreev (1964)", "connections": "다중 Andreev 반사, 초전도체 근접 효과"}, {"term": "샷 노이즈 (Shot Noise)", "why_emerged": "전하의 이산적 특성으로 인한 전류의 시간적 변동을 측정하여 입자의 전하량을 파악하기 위해.", "origin": "W. Schottky (1918)", "connections": "분수 전하, 전도도 양자화"}], "english_summary": ["Developed a shot-noise scanning tunneling microscopy technique with tunable junction transparency.", "Successfully observed the transition from single-electron tunneling to multiple Andreev reflection regimes in Pb(111).", "Confirms junction transparency as the primary driver for microscopic charge transport in superconductors.", "Provides a powerful atomic-scale platform for studying charge transport mechanisms."]}}, {"title": "d-wave altermagnetism and nonlinear transport in Dirac semimetals", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/kz4s-11k6", "authors": "Xin-Mei Wei, Zi-Ming Wang, Dong-Hui Xu", "last_authors": "Zi-Ming Wang, Dong-Hui Xu", "summary": "Altermagnets combine compensated collinear magnetic order with momentum-dependent spin splitting. A key question is how such spin splitting can arise from electronic interactions in a spin-degenerate Dirac semimetal and what spin-resolved transport signatures it produces. We address this issue using…", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Investigates altermagnetism in Dirac semimetals, a topic directly relevant to current electronic structure research.", "tags": ["theory", "altermagnetism", "Diracsemimetals"], "image": "", "briefing": {"background": "알터자성(Altermagnetism)은 자화가 상쇄되면서도 운동량 공간에서 스핀 분리가 일어나는 새로운 자기 질서입니다. 이를 일반적인 Dirac 반금속과 결합하여 비선형 수송 현상을 탐구하는 것이 최근의 주요 과제입니다.", "motivation": "Dirac 반금속 시스템 내에서 전자 상호작용이 어떻게 알터자성 스핀 분할을 유도하고, 이것이 어떤 독특한 비선형 수송 신호를 생성하는지 이론적으로 규명하고자 했습니다.", "result": "이론적 모델을 통해 Dirac 반금속에서의 전자 상호작용이 알터자성 질서를 유도할 수 있음을 보였으며, 이로 인한 스핀 분리된 전자 구조와 그에 따른 비선형 응답 함수를 도출했습니다.", "implication": "알터자성이 위상 물질에서 새로운 비선형 홀 효과나 전류 응답을 생성할 수 있음을 제시하여, 스핀트로닉스 소자 개발에 새로운 설계 원리를 제공합니다.", "novelty": "위상 물질의 대표주자인 Dirac 반금속과 최신 연구 주제인 알터자성을 결합하여, 대칭성 기반의 비선형 수송 신호를 이론적으로 예측했다는 점이 주목됩니다.", "unresolved": "실제 실험에서 이러한 비선형 수송 효과를 확실하게 분리해 낼 수 있는 재료 후보군과 구체적인 측정 기법은 아직 확립되지 않았습니다.", "future_work": "예측된 비선형 수송 신호를 검증할 수 있는 특정 Dirac 반금속 재료에서의 수송 측정 및 밴드 구조 계산.", "concepts": [{"term": "알터자성 (Altermagnetism)", "why_emerged": "강자성체와 반강자성체의 특성을 모두 가지면서 운동량 의존 스핀 분리가 가능한 상태를 정의하기 위해.", "origin": "Libor Smejkal et al. (2022)", "connections": "비공선형 반강자성, 스핀트로닉스"}, {"term": "Dirac 반금속", "why_emerged": "위상적으로 보호된 무질량 디락 페르미온을 가진 전자 구조를 설명하기 위해.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "Weyl 반금속, 베리 곡률, 이상 홀 효과"}], "english_summary": ["Investigates the emergence of d-wave altermagnetism in Dirac semimetals.", "Connects electron interactions to momentum-dependent spin splitting in spin-degenerate systems.", "Predicts unique non-linear transport signatures resulting from altermagnetic splitting.", "Provides a theoretical framework for future spintronic devices using topological materials."]}}, {"title": "Altermagnetism in Folded Iron Chain Systems", "journal": "PRL_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/6327-7256", "authors": "Ling-Fang Lin, Yang Zhang, Satoshi Okamoto, Adriana Moreo, Lun-Hui Hu, Elbio Dagotto", "last_authors": "Lun-Hui Hu, Elbio Dagotto", "summary": "Altermagnetism—moment-compensated magnetism with momentum-dependent spin splitting—has s.org/doi/10.1103/wrds-99zb", "authors": "T. Rõõm, A. Glezer Moshe, R. Nagarajan, et al.", "last_authors": "Seongshik Oh, G. Blumberg", "summary": "Terahertz magneto-optics is established as a direct probe of helical vortex-core excitations, providing dynamical evidence for multiband CdGM states in iron-based superconductors.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "High-quality spectroscopic study of vortex states in a relevant unconventional superconductor.", "tags": ["spectroscopy", "superconductivity", "iron-based"], "image": "", "briefing": {"background": "초전도체 내부에 자속(vortex)이 형성될 때, 그 중심부에는 초전도성이 파괴된 영역이 존재하며 여기서 국부적인 준입자 상태인 Caroli-de Gennes-Matricon(CdGM) 상태가 나타납니다.", "motivation": "철 기반 초전도체 FeTe1-xSex의 다중 밴드 환경에서 발생하는 CdGM 상태의 동역학적 특성을 이해하고 헬리컬(helical) 기원을 밝히고자 함.", "result": "테라헤르츠 자기 광학 분광법을 통해 와류 코어 내의 헬리컬 여기 상태를 직접 관측하고, 이것이 다중 밴드 특성에 기인한 CdGM 상태임을 증명함.", "implication": "초전도 와류 코어 내의 전자 구조를 이해함으로써, 위상 초전도체 후보 물질 연구 및 와류 기반 양자 정보 소자 설계에 중요한 물리적 토대를 제공함.", "novelty": "기존의 STM 측정 방식에서 벗어나 테라헤르츠 자기 광학이라는 동역학적 도구를 사용하여 와류 코어의 chirality를 성공적으로 분해 관측함.", "unresolved": "FeTe1-xSex의 구체적인 페르미 면 구조에 따른 CdGM 상태의 밴드 간 혼성 강도에 대한 세부 정량화가 필요함.", "future_work": "다른 다중 밴드 고온 초전도체 시스템으로 본 측정 기법을 확장하고, 와류 동역학 제어 실험 수행.", "concepts": [{"term": "CdGM states", "why_emerged": "와류 코어 내부의 속박된 준입자 에너지를 설명하기 위해 등장함.", "origin": "Caroli, de Gennes, Matricon (1964).", "connections": "Andreev reflection, Majorana bound states."}, {"term": "Helical vortex-core excitations", "why_emerged": "와류 내 전자의 스핀-궤도 결합 및 chirality를 고려한 여기 상태를 기술하기 위함.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "Spin-orbit coupling, Topological superconductivity."}], "english_summary": ["Investigated CdGM states in FeTe1-xSex superconductors using THz magneto-optics.", "Demonstrated helical vortex-core excitations as dynamic evidence of multiband superconductivity.", "Successfully achieved chirality-resolved spectroscopy of vortex states.", "Provides new insights into the electronic structure of vortex cores in iron-based materials."]}}, {"title": "Exciton-Based Sensing of Remote Electron Correlations in 2D Heterostructures", "journal": "PRL_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/246f-2p98", "authors": "Tobias M. R. Wolf, Tian Xie, Chenhao Jin, Allan H. MacDonald", "last_authors": "Chenhao Jin, Allan H. MacDonald", "summary": "Many monolayer transition metal dichalcogenides, including ${\\mathrm{MoS}}_{2}$, ${\\mathrm{MoSe}}_{2}$, ${\\mathrm{WS}}_{2}$, and ${\\mathrm{WSe}}_{2}$, are direct band gap two-dimensional (2D) semiconductors with sharp optical resonances at excitonic bound state frequencies. Recent adjacent-layer sen…", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Important experimental work on 2D electronic correlations.", "tags": ["2Dmaterials", "heterostructure", "correlations"], "image": "", "briefing": {"background": "2D 전이금속 디칼코게나이드(TMD)는 강한 엑시톤 효과를 가지며, 이 엑시톤은 주변 전자기 환경 변화에 매우 민감하게 반응함.", "motivation": "인접한 층이나 환경에서의 전자 상관관계(electron correlation)가 멀리 떨어져 있는 층의 엑시톤 광학적 특성에 미치는 영향을 원격으로 감지하고자 함.", "result": "TMD 헤테로구조에서 원격 전자 상관관계가 엑시톤 공명 주파수 및 선폭에 미치는 영향을 통해 상관관계 상태를 감지하는 센서로서의 가능성을 제시함.", "implication": "별도의 복잡한 전기적 접촉 없이 광학적 방식만으로 2D 물질 내의 강상관 전자 상태(Mott 절연체, Wigner 결정 등)를 비파괴적으로 탐지할 수 있음.", "novelty": "엑시톤이 일종의 '나노 센서' 역할을 하여 직접적인 접촉 없이도 원거리의 상관 물성을 측정할 수 있는 새로운 실험적 도구를 확립함.", "unresolved": "엑시톤-전자 상관관계의 결합 강도에 대한 상세한 미시적 메커니즘과 감도 한계.", "future_work": "모아레 격자 시스템에서의 다양한 상관 상(correlated phases)에 대한 비접촉 광학적 탐사 적용.", "concepts": [{"term": "Excitonic bound state", "why_emerged": "2D 반도체에서 전자와 정공이 쿨롱 상호작용으로 묶여 형성되는 여기자를 설명하기 위해 필요함.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "Wannier-Mott excitons, Optical spectroscopy."}, {"term": "2D Heterostructures", "why_emerged": "서로 다른 2D 물질을 쌓아 새로운 물리적 특성을 창출하기 위해 등장함.", "origin": "Andre Geim 그룹 (2010년대 초).", "connections": "Moire physics, Van der Waals interactions."}], "english_summary": ["Explored exciton-based sensing in 2D TMD heterostructures.", "Proposed using excitonic optical resonances to probe remote electron correlations.", "Enabled non-invasive detection of correlated electronic states in adjacent layers.", "Showcased the potential for optical characterization of complex phases in moire systems."]}}, {"title": "Excitonic Stark Response Induced by Quantum Capacitance in van der Waals Heterostructures", "journal": "PRL_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/3jqj-6ldy", "authors": "Xiangzhi Hong, Yongkang Jian, Yang Chen, et al.", "last_authors": "Baigeng Wang, Erfu Liu", "summary": "Precise electrostatic control in van der Waals heterostructures is commonly described by a geometric capacitor model, which assumes that the internal electric field is fully determined by external gate voltages. Here, we show that this description breaks down in the presence of interfacial charge tr…", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Experimental study of vdW heterostructures with direct relevance to electronic structure.", "tags": ["vanderWaals", "heterostructure", "spectroscopy"], "image": "", "briefing": {"background": "반데르발스 헤테로구조에서 게이트 전압을 통한 정전기적 제어는 고전적인 기하학적 커패시터 모델을 주로 사용해왔음.", "motivation": "인접 층 간의 전하 이동이 발생하는 환경에서 기존 기하학적 커패시터 모델의 한계를 극복하고 엑시톤의 Stark 효과를 규명하고자 함.", "result": "양자 커패시턴스(quantum capacitance) 효과로 인해 내부 전기장이 게이트 전압만으로 결정되지 않으며, 이것이 엑시톤 Stark 응답에 비선형적 영향을 줌을 밝힘.", "implication": "고정밀 나노 소자 설계 시 양자 커패시턴스를 반드시 고려해야 함을 시사하며, vdW 헤테로구조의 정전기적 물성 제어에 대한 새로운 표준을 제시함.", "novelty": "기존 모델의 오차 원인인 양자 커패시턴스를 엑시톤 Stark 효과 분광법으로 정량화하여 전기적, 광학적 물성 사이의 연결 고리를 명확히 함.", "unresolved": "전하 이동이 일어나는 계면에서의 정확한 전하 밀도 프로파일에 대한 추가적 모델링 필요.", "future_work": "다양한 층수의 vdW 물질 조합에 따른 양자 커패시턴스 최적화 및 광학적 스위칭 소자 개발.", "concepts": [{"term": "Quantum capacitance", "why_emerged": "저차원 시스템에서 전하 밀도 변화에 따른 화학적 포텐셜 변화를 기술하기 위해 등장함.", "origin": "Luryi (1988).", "connections": "Density of states, Coulomb blockade."}, {"term": "Excitonic Stark effect", "why_emerged": "외부 전기장에 의해 엑시톤의 ed": "금속 내 자성 불순물이 극저온에서 전기 저항을 갑자기 증가시키는 현상을 설명하기 위해 제안되었습니다.", "origin": "준 콘도(Jun Kondo, 1964년).", "connections": "앤더슨 불순물 모델, 근접 효과, 비페르미 액체."}, {"term": "모아레 초격자", "why_emerged": "2D 층상 물질을 서로 다른 각도로 쌓아 새로운 전자 구조와 상관관계를 유도하기 위해 고안되었습니다.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "트위스티드 이중층 그래핀, 강상관 절연체, 초전도."}], "english_summary": ["The authors investigate Kondo effect in rhombohedral graphene superlattices.", "The moire superlattice serves as a tunable platform for strong electron correlations.", "Experimental evidence of Kondo physics is observed in these artificial lattice structures.", "This extends the study of Kondo lattice systems to synthetic 2D van der Waals architectures."]}}, {"title": "Orbitally Tuned Composite-Fermion Pairing Transitions in Bilayer Graphene", "journal": "PRL_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/ftsj-hlsw", "authors": "Ravi Kumar, Tomer Firon, André Haug, et al.", "last_authors": "David F. Mross, Yuval Ronen", "summary": "The effective interaction between composite fermions, set entirely by the Coulomb potential and the underlying electronic Landau level orbitals, can stabilize exotic fractional quantum Hall states. In particular, half-filled Landau levels with different orbital character can host either metallic or …", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "High-interest quantum Hall and correlated states in moire bilayer graphene systems.", "tags": ["graphene", "quantumHall", "correlated"], "image": "", "briefing": {"background": "분수 양자 홀 효과(FQHE)는 강한 상관관계를 가진 2차원 전자계에서 복합 페르미온(composite fermions) 개념을 통해 이해됩니다.", "motivation": "이중층 그래핀의 하프 필링(half-filling) 란다우 레벨에서 궤도 특성에 따른 금속성 또는 절연체 거동의 미시적 기원을 규명하고자 합니다.", "result": "쿨롱 상호작용과 란다우 궤도 성질이 결합하여 복합 페르미온의 쌍 생성 전이를 유도하며, 이것이 시스템의 전도성을 결정함을 보였습니다.", "implication": "궤도 엔지니어링을 통해 분수 양자 홀 상태를 능동적으로 제어할 수 있는 가능성을 제시합니다.", "novelty": "궤도 자유도가 복합 페르미온 간의 유효 상호작용에 미치는 영향을 명확히 규명했다는 점이 독창적입니다.", "unresolved": "실제 실험적 측정치와 이론적 모델 간의 정밀한 정량적 일치 여부.", "future_work": "상이한 궤도 특성을 가진 란다우 레벨에서의 분수 양자 홀 상태 안정성 탐색.", "concepts": [{"term": "복합 페르미온", "why_emerged": "분수 양자 홀 효과 내 전자의 강한 상호작용을 비상호작용하는 유사 입자의 문제로 변환하기 위해 도입되었습니다.", "origin": "자이언 제인(Jainendra K. Jain, 1989년).", "connections": "란다우 레벨, 체른-사이먼스 이론, 분수 양자 홀 효과."}, {"term": "하프 필링 란다우 레벨", "why_emerged": "자기장 하에서 전자가 차지하는 에너지 준위의 절반이 채워진 상태로, 강한 상관관계 효과가 극대화되는 지점입니다.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "Fermi sea, Composite fermion liquid."}], "english_summary": ["The study examines orbital-dependent pairing transitions of composite fermions in bilayer graphene.", "Coulomb interactions and Landau level orbital characters dictate the ground state phase.", "These interactions drive transitions between metallic and fractional quantum Hall states.", "The work provides a framework for orbital-tuned quantum phase transitions."]}}, {"title": "Altermagnetism revealed by polarized neutrons in MnF2", "journal": "Science", "source": "Gemini", "link": "https://www.science.org/doi/abs/10.1126/science.aec2602?af=R", "authors": "Quentin Faure, Dalila Bounoua, Victor Balédent, et al.", "last_authors": "Sylvain Petit, Paul McClarty", "summary": "Altermagnets are compensated magnets with symmetry-enforced spin split bands. Direct spectroscopic evidence for their existence has been reported in several materials. For example, inelastic neutron scattering (INS) has recently been used to witness a splitting of magnon bands in MnTe that is compatible with altermagnetism. Here, we present polarized INS results on MnF 2 showing that it is altermagnetic. Our data reveal a splitting coming from the long-range dipolar coupling. Furthermore, using a domain-biased sample, the data reveal a nonzero chirality in the neutron scattering cross section that reverses the sign between the two magnon modes. It is this feature that clearly demonstrates altermagnetism in MnF 2 . This finding highlights the potential for polarized INS to characterize altermagnets through its sensitivity to fine structure in magnon spectra.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Experimental identification of altermagnetic order via neutron scattering.", "tags": ["altermagnetism", "MnF2", "neutronscattering"], "image": "", "briefing": {"background": "알터자성(Altermagnetism)은 자화율이 0이지만, 대칭성에 의해 에너지 밴드가 스핀 분할되는 새로운 자기 상입니다.", "motivation": "MnF2라는 표준적인 반강자성체에서 알터자성 특성을 실험적으로 명확히 입증하고자 합니다.", "result": "편극 중성자 산란(INS)을 통해 MnF2의 스핀 파(magnon) 모드에서 Chirality가 있음을 확인하고, 이것이 알터자성임을 증명했습니다.", "implication": "알터자성이 특이한 물질이 아닌, 일반적인 자기 결정 대칭성 내에 폭넓게 존재할 수 있음을 강력히 시사합니다.", "novelty": "중성자 산란 실험에서 밴드 분할과 카이랄성을 동시에 검출하여 알터자성을 확인한 것은 큰 실험적 성과입니다.", "unresolved": "알터자성체에서의 비정상 홀 효과와 같은 수송 특성에 대한 구체적인 기여도.", "future_work": "다른 알터자성 후보 물질에 대한 편극 중성자 산란을 통한 계통적인 검증.", "concepts": [{"term": "알터자성", "why_emerged": "강자성(스핀 편극)과 반강자성(자화율 0)의 장점만 가진 새로운 자기 상태가 이론적으로 예견되었습니다.", "origin": "유라이, 쳉고스 등(2022년경).", "connections": "스핀-궤도 결합, 비정상 홀 효과, 반강자성."}, {"term": "편극 중성자 산란", "why_emerged": "중성자의 스핀을 이용해 물질 내 자기적 모멘트의 방향 및 카이랄성 정보를 획득하기 위해 필수적입니다.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "Magnon, Spin structure factor."}], "english_summary": ["Polarized inelastic neutron scattering confirms altermagnetism in MnF2.", "The study identifies spin splitting in magnon bands forced by magnetic symmetry.", "Nonzero chirality in the scattering cross section is evidence of altermagnetic order.", "This highlights the utility of polarized neutron techniques for characterization."]}}, {"title": "Room-temperature topological spin textures via cobalt substitution in a kagome antiferromagnet", "journal": "npj_QuantumMaterials", "source": "Gemini", "link": "https://www.nature.com/articles/s41535-026-00947-8", "authors": "Shaohua Fan, Zinan Zhao, Baochun Wu, et al.", "last_authors": "Xingye Lu, Jinbo Yang", "summary": "Room-temperature topological spin textures via cobalt substitution in a kagome antiferromagnet", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": " 으로 입증함.", "unresolved": "압력 하에서 관측된 플랫 밴드가 실제 전자 상관관계의 강화로 이어지는지, 혹은 다른 토폴로지적 성질을 유도하는지는 추가적인 ARPES 측정 등이 필요.", "future_work": "압력 하에서의 수송 특성 측정과 고압 저온 상태에서의 정밀한 구조 해석.", "concepts": [{"term": "Flat-band", "why_emerged": "밴드 분산이 거의 없는 상태로, 전자 간 상호작용이 지배적인 영역을 설명하기 위해 필요.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "강상관 전자계, 란다우 준위, 비전통적 초전도."}, {"term": "Itinerant Ferromagnetism", "why_emerged": "국소 자기 모멘트가 아닌 전도 전자의 집합적 움직임에 의한 자성을 기술하기 위해 사용됨.", "origin": "Stoner(1938).", "connections": "Stoner 기준(Stoner criterion), 밴드 자성."}], "english_summary": ["Investigated SmCrGe3 under pressure as a clean tuning method.", "Observed the interplay between flat-band instability and magnetic suppression.", "Pressure effectively tunes the itinerant magnetic state in this hexagonal compound.", "Provides experimental evidence for pressure-driven electronic structural shifts."]}}, {"title": "Propagation and localization of spin excitations at altermagnetic domain walls", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/zgw5-99k2", "authors": "Oksana Peschanska, Jeroen van den Brink, Volodymyr P. Kravchuk", "last_authors": "Jeroen van den Brink, Volodymyr P. Kravchuk", "summary": "Altermagnets ( AMs ) are spin-compensated materials in which opposite-spin sublattices are connected by a symmetry that causes a spin splitting in their elementary excitations. As there is a strong effect of altermagnetism on domain wall properties, it is quite natural to also expect an enrichment of the physics of magnetic excitations at AM domain walls. Here, we consider the propagation of spin eigenexcitations along domain walls in easy-axial d -wave AMs . Investigating the presence of bound states localized on a domain wall, we find that the effect of the AM on the bound states strongly depends on the orientation of the domain wall relative to the crystallographic directions. If the domain wall is oriented along a nodal direction [100] or [010], AM does not change the number of bound states; however, it leads to a nonlinear dispersion and a tilt of the wavefront. The effect of AM is strongest when the domain wall is oriented along the directions [110] or [ 1 ¯ 10 ] , i.e., along the directions of the strongest AM splitting in the magnon spectrum. In this case, (i) the additional gapped bound states appear, (ii) degeneracy of the eigenstates with respect to their polarization (right-hand or left-hand precession of the Néel vector) is removed, and (iii) the localization area of the bound states strongly depends on the eigenfrequency. The latter may lead to strong localization of the bound state at the domain wall. We further consider the influence of a static magnetic field that is applied along the easy axis and find that the magnetic field induces an asymmetry between the localization regions on opposite sides of the domain wall and sets an upper limit on the absolute value of the propagating eigenstate's wave vector.", "tier": "B_IMPORTANT_CONDMAT", "score": "7", "reason": "Theory of spin dynamics in altermagnets, a class specifically listed as important to the user.", "tags": ["theory", "altermagnetism", "spin-dynamics"], "image": "", "briefing": {"background": "알터마그넷(Altermagnet)은 순자화가 0임에도 불구하고 스핀 분할된 전자 구조를 가지는 새로운 자기 물질군으로, 최근 차세대 스핀트로닉스 재료로 주목받고 있습니다.", "motivation": "알터마그넷 내부의 도메인 벽(domain wall)에서 나타나는 스핀 여기(spin excitation) 특성이 도메인 벽의 결정학적 방향에 따라 어떻게 변하는지 이론적으로 규명하고자 합니다.", "result": "도메인 벽 방향에 따라 스핀 여기의 속박 상태(bound states)가 결정됨을 보였습니다. 특히 [110] 방향에서는 알터마그넷 고유의 분할 효과로 인해 새로운 갭이 있는 상태가 나타나고 편극에 따른 축퇴가 제거됩니다.", "implication": "알터마그넷 도메인 벽을 제어함으로써 스핀파(magnon)의 전파와 국소화 특성을 정밀하게 조절할 수 있음을 시사합니다.", "novelty": "기존 강자성체와 다른 알터마그넷만의 독특한 대칭성이 도메인 벽의 동역학에 미치는 영향을 체계적으로 분석한 첫 사례 중 하나입니다.", "unresolved": "실제 실험적 환경에서 도메인 벽의 안정성이나 불순물에 의한 산란 효과는 고려되지 않았습니다.", "future_work": "실제 알터마그넷 화합물에서의 도메인 벽 구조를 관측하고, 외부 자기장 하에서 스핀파의 수송 특성을 측정하는 실험이 필요합니다.", "concepts": [{"term": "알터마그넷 (Altermagnet)", "why_emerged": "기존의 강자성(순자화 있음)이나 반강자성(스핀 보상됨) 범주로 설명되지 않는, 스핀-궤도 결합 없이 스핀 분할이 일어나는 새로운 자기 질서를 설명하기 위해 필요했습니다.", "origin": "최근 2~3년 내 여러 이론 그룹에 의해 정립되었습니다.", "connections": "반강자성체, 스핀트로닉스, 자기적 위상 물질과 깊게 연관됩니다."}, {"term": "스핀 여기 (Spin excitation)", "why_emerged": "자기 물질의 기저 상태에서 벗어난 자기 모멘트의 동역학적 변화(마그논)를 이해하기 위해 필수적입니다.", "origin": "Bloch(1930)에 의한 스핀파 이론이 시초입니다.", "connections": "중성자 산란, RIXS 등 에너지 및 운동량 분해 측정법과 연결됩니다."}], "english_summary": ["Altermagnets exhibit spin-split excitations despite vanishing net magnetization.", "The paper investigates magnon dynamics at domain walls in d-wave altermagnets.", "Domain wall orientation significantly modulates the localization and degeneracy of magnon bound states.", "Stronger splitting effects occur along [110] crystallographic directions.", "Results provide a theoretical framework for controlling spin-wave propagation in altermagnetic devices."]}}, {"title": "Chiral Casimir-Polder Force from Chiral Anomaly in Weyl Semimetals", "journal": "PRL_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/gny7-xz9s", "authors": "Liang Chen, Xu-Feng Zhao, Xun-Lei Ding, Kai Chang", "last_authors": "Xun-Lei Ding, Kai Chang", "summary": "We propose a novel chiral-discriminatory Casimir-Polder interaction between chiral molecules and Weyl semimetals, originating from the chiral anomaly. This interaction is uniquely governed by the molecule’s electric dipole moment, enabling chiral discrimination even when the optical rotatory strengt…", "tier": "B_IMPORTANT_CONDMAT", "score": "7", "reason": "Theoretical link between chiral anomaly and Weyl semimetals relevant to user.", "tags": ["Weylsemimetals", "topological", "chiralanomaly"], "image": "", "briefing": {"background": "바일 반금속(Weyl semimetal)은 위상학적 비자명성을 가진 물질로, 입자와 반입자가 분리된 바일 노드를 가지며 카이랄 변칙(chiral anomaly)이라는 독특한 전자기적 성질을 보입니다.", "motivation": "바일 반금속의 카이랄 변칙이 진공 에너지인 카시미르-폴더 힘(Casimir-Polder force)에 어떻게 기여할 수 있는지 탐구하고자 합니다.", "result": "카이랄 분자와 바일 반금속 사이에 카이랄 변칙에서 기인한 새로운 형태의 카시미르-폴더 힘이 작용함을 제안했습니다.", "  or artificial periodicity. The method resolves fine spectral features and fractal dimensions universally across aperiodic systems. For twisted Penrose bilayers, angle-resolved certified spectra identify a magic angle at θ ≈ 27.22 8 ° , where ring-worm interference produces twist-controlled confinement. Across one- and two-dimensional quasicrystals, the results show how fractal spectral geometry organizes localization: lower box-counting dimension correlates with larger inverse participation ratio in substitution chains, while dodecagonal tilings exhibit compactly supported and algebraically confined critical modes. The framework also scales to three dimensions, delivering contamination-free, high-resolution spectra for a quasicrystal arising in acoustic metamaterials. Further examples involving quantum walks, continuum superlattices, longer-range hopping, and inhomogeneous magnetic fields demonstrate the broad reach of certified spectral computation as a route to predictive spectral design in aperiodic media.", "tier": "B_IMPORTANT_CONDMAT", "score": "7", "reason": "Important methodological advancement for understanding spectra of moiré and quasicrystalline systems.", "tags": ["moiré", "quasicrystals", "spectroscopy"], "image": "", "briefing": {"background": "모아레 격자나 준결정(quasicrystal) 시스템은 비주기성으로 인해 에너지 스펙트럼이 프랙탈 구조(Cantor spectrum)를 띄며, 수치적 해석 시 계산상의 오류가 발생하기 쉽습니다.", "motivation": "준결정 시스템의 스펙트럼 계산 시 발생하는 수치적 오염(spectral pollution)을 제거하고 정확한 상태 밀도를 얻기 위한 계산 프레임워크가 필요했습니다.", "result": "유한한 크기의 시스템을 무한한 시스템으로 근사할 때 발생하는 오류를 엄밀하게 통제하는 스펙트럼 계산 방법을 도입했습니다.", "implication": "이 방법을 통해 모아레 준결정 등에서 발생하는 '매직 앵글' 현상과 상태의 국소화 특성을 매우 높은 정밀도로 예측할 수 있게 되었습니다.", "novelty": "기존의 불완전한 유한 패치 대각화 방식을 벗어나, 무한 시스템의 스펙트럼을 엄밀한 오차 범위 내에서 계산할 수 있게 된 것이 핵심입니다.", "unresolved": "계산 복잡도가 매우 높을 것으로 예상되며, 아주 복잡한 다체 상호작용이 포함된 시스템으로의 확장은 여전히 도전적인 과제입니다.", "future_work": "강상관 계를 포함하는 실제 모아레 물질에서의 전자 구조 계산에 이 프레임워크를 적용할 예정입니다.", "concepts": [{"term": "Cantor 스펙트럼", "why_emerged": "준결정이나 쿼시주기적 전위 내의
