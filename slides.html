학(TQC) 프레임워크를 2D 층군(layer groups)에 맞게 적용하여 8872개의 2D 물질 엔트리를 분석했습니다. 그 결과 4073개의 위상학적 또는 'obstructed' 엔트리를 발견했으며, 이 중 905개가 위상 절연체(topological insulators)이고 1003개가 'obstructed atomic insulators'였습니다. 이는 2D 위상 물질 라이브러리를 크게 확장시킨 결과이며, 상세한 특성을 포함하는 2D-TQCDB 데이터베이스를 구축했습니다.", "implication": "새로 발견된 2D 위상 물질들은 스핀트로닉스, 양자 컴퓨팅, 그리고 다양한 양자 기술의 잠재적 재료로서 활용될 수 있습니다. 2D-TQCDB 데이터베이스와 공개된 방법론은 다른 연구자들이 새로운 2D 위상 물질을 발견하고 특성을 연구하는 데 중요한 자원이 될 것입니다.", "novelty": "기존 3D 위상 양자 화학을 2D 층군에 맞게 확장하여 대규모 2D 물질 데이터베이스에 적용, 4000개 이상의 잠재적 2D 위상 물질을 식별했습니다. 이는 2D 위상 물질 탐색에 대한 체계적이고 자동화된 접근 방식을 제공하며, 2D 물질 및 위상 물질에 대한 독자의 광범위한 관심사와 잘 맞습니다.", "unresolved": "이론 및 계산 기반의 예측이므로, 이 물질들의 위상학적 특성과 엣지 상태가 실험적으로 검증되어야 합니다. 또한, 예측된 물질 중 일부는 실제 합성 및 안정성에 어려움이 있을 수 있습니다.", "future_work": "2D-TQCDB에 있는 물질들 중 유망한 후보들을 선택하여 ARPES, STM/STS와 같은 실험 기법으로 밴드 구조와 엣지 상태를 직접 탐색하고, 실제 양자 소자에 적용하기 위한 추가적인 연구가 필요할 것입니다. 특히 ARPES는 예측된 위상 밴드 구조를 검증하는 데 매우 유용합니다.", "concepts": [{"term": "Topological Quantum Chemistry (TQC)", "why_emerged": "물질의 결정 구조 대칭과 전자 밴드 구조 사이의 관계를 체계적으로 분석하여 위상학적 특성을 예측하고 분류하기 위한 이론적 프레임워크의 필요성 때문에 등장했습니다.", "origin": "Barry Bradlyn, Luis Elcoro, Nicolas Regnault, A. George R. Smith, B. Andrei Bernevig 등에 의해 2017년 경에 정립되었습니다.", "connections": "Topological Insulators, Topological Semimetals, Symmetry Indicators, Band Theory, Space Groups/Layer Groups."}, {"term": "Layer Group", "why_emerged": "2D 물질은 3D 결정과 달리 층 내의 대칭은 유지하지만 층 간의 주기성을 가지지 않으므로, 3D 공간군(space group) 대신 2D 평면 대칭을 설명하기 위한 그룹이 필요하여 도입되었습니다.", "origin": "결정학에서 2D 구조의 대칭을 설명하기 위해 사용되어 왔습니다.", "connections": "Space Group, Crystal Symmetry, 2D Materials, Point Group."}, {"term": "Topological Insulator (TI)", "why_emerged": "벌크 내부에서는 절연체이지만 스핀-궤도 결합에 의해 보호되는 전도성 표면/엣지 상태를 가지는 물질을 설명하기 위해 등장했습니다. 기존의 밴드 이론으로는 설명할 수 없는 새로운 양자 상태를 나타냅니다.", "origin": "Kane와 Mele (2005)의 이론적 제안, Hasan과 Moore (2010), Qi와 Zhang (2011) 등의 리뷰. 실험적으로는 BiSb, Bi2Se3 등에서 확인되었습니다.", "connections": "Spin-Orbit Coupling, Time-Reversal Symmetry, Quantum Spin Hall Effect, Dirac Cones, Weyl Semimetals."}, {"term": "Obstructed Atomic Insulator", "why_emerged": "위상 절연체와 유사하게 벌크는 절연체이지만, 그 밴드 구조가 원자 오비탈의 위치와는 다른 공간에 국한된 (obstructed) 전하 중심을 가지는 물질을 설명하기 위해 도입되었습니다. 이는 기존의 위상 절연체 분류 체계만으로는 완전히 설명할 수 없는 새로운 유형의 위상 상태입니다.", "origin": "초록 정보만으로는 특정하기 어려움. Topological Quantum Chemistry 프레임워크 내에서 위상 물질을 더 세분화하는 과정에서 등장했습니다.", "connections": "Topological Insulators, Wannier Centers, Topological Quantum Chemistry, Hybrid Wannier Functions."}], "english_summary": ["This study extends the topological quantum chemistry framework to 2D layer groups to identify 2D topological materials.", "By analyzing 8872 entries from computational databases, it discovered 4073 topological or obstructed materials, including 905 topological insulators.", "A new Topological 2D Materials Database (2D-TQCDB) was created, providing detailed electronic and topological properties.", "This work significantly expands the known library of 2D topological materials and offers publicly available tools for future discoveries.", "It provides a systematic, computational approach to accelerate the discovery of materials for quantum technologies."]}}, {"title": "Observation of thermally stable polar metallic state in perovskite nitride CeWN 3", "journal": "Science_Advances", "source": "Gemini", "link": "https://doi.org/10.1126/sciadv.aeh6191", "authors": "Xubin Ye, Shaoxuan Zheng, Zhaoliang Chen, et al.", "last_authors": "Zhen Chen, Youwen Long", "summary": "Polar metals offer substantial potential for exotic quantum phenomena and multifunctional applications. However, the existence of a polar metal is fundamentally challenging owing to the screening of dipole-dipole interactions by conducting electrons. Specifically, a high-temperature–stabilized polar metal remains to be discovered. In this study, we report a thermally stable polar-metal state in perovskite cerium tungsten nitride. Synchrotron x-ray diffraction and electron microscopy reveal a polar Pna 2 1 structure, while second-harmonic generation demonstrates that the polar response persists up to 850 kelvins in argon. Electrical resistivity and optical conductivity measurements demonstrate metallic transport behavior, consistent with the itinerant electronic contribution derived from specific heat analysis. First-principles calculations reveal that the polar distortion and metallic conductivity originate from tungsten-centered nitrogen octahedra, where the off-center displacements of hexavalent tungsten ions govern polarity and hybridization between tungsten 5d and nitrogen 2p states contributes to itinerant carriers. This study establishes a record-high-temperature polar metal, opening a promising avenue for exploring robust polar and metallic materials in perovskite nitrides.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Reports a thermally stable polar metallic state in a perovskite nitride with experimental characterization.", "tags": ["newmaterial", "perovskite", "polarmetal", "transport", "electronicproperties", "experimental"], "image": "", "briefing": {"background": "강유전체와 같은 극성(polar) 물질은 전기 쌍극자 모멘트를 가지며, 도체(metal)는 자유 전자를 가집니다. 일반적으로 도체에서 자유 전자가 쌍극자 상호작용을 차폐(screening)하여 극성 상태를 억제하므로, 극성 금속(polar metal)은 존재하기 어렵거나 불안정할 것으로 예상되었습니다. 그러나 극성 금속은 이국적인 양자 현상과 다기능 응용 가능성 때문에 중요하게 연구되고 있습니다.", "motivation": "극성 금속의 존재 자체가 도전적이며, 특히 높은 온도에서 안정적으로 존재하는 극성 금속은 극히 드뭅니다. 이 연구는 기존의 난제를 극복하고 열적으로 안정적인 극성 금속 상태를 보이는 새로운 물질을 발견하고 그 메커니즘을 이해하고자 합니다.", "result": "이 연구는 페로브스카이트 세륨 텅스텐 질화물(CeWN3)에서 열적으로 안정적인 극성 금속 상태를 발견했습니다. 싱크로트론 X선 회절 및 전자 현미경으로 극성 Pna2_1 구조를 확인했고, 2차 조화파 생성(second-harmonic generation) 측정을 통해 850켈빈(K)까지 극성 반응이 지속됨을 입증했습니다. 전기 저항 및 광학 전도도 측정은 금속성 전송 거동을 보였고, 제일원리 계산은 텅스텐 중심 질소 팔면체의 중심 이탈 변위가 극성을 유발하고, 텅스텐 5d와 질소 2p 상태 간의 혼성화가 전도성 전하를 제공함을 밝혔습니다.", "implication": "CeWN3는 기존 기록을 뛰어넘는 최고 온도의 극성 금속으로, 이는 극성 금속의 안정성에 대한 기존의 이해를 확장시킵니다. 이러한 물질은 강유전성, 압전성, 초전도와 같은 다른 이국적인 양자 현상과 결합될 가능성이 있으며, 새로운 다기능 재료 설계에 영감을 줄 수 있습니다.", "novelty": "850K라는 매우 높은 온도까지 극성 상태를 유지하는 열적으로 안정적인 극성 금속(CeWN3)을 발견했습니다. 이는 극성 금속 분야에서 기록적인 성과이며, 극성 금속이 고온에서도 안정할 수 있음을 실험적으로 증명한 중요한 발견입니다. 새로운 재료로서 사용자의 'new material' 및 'electronic properties' 관심사에 부합합니다.", "unresolved": "이 물질의 극성과 금속성이 결합된 상태에서 나타날 수 있는 잠재적인 이국적인 양자 현상(예: 강유전성 금속성, 비대칭 전도 등)에 대한 추가적인 탐색이 필요합니다. 또한, 이 물질의 박막 성장 및 소자 응용 가능성에 대한 연구가 필요합니다.", "future_work": "ARPES나 RIXS와 같은 정밀한 전자 구조 측정 기법을 사용하여 CeWN3의 페르미 면과 밴드 구조를 자세히 연구하고, 극성 상태와 전도 메커니즘 간의 상호작용을 더 깊이 이해하는 것이 중요합니다. 자기장 하에서의 수송 특성 연구를 통해 이 물질의 다른 기능성도 탐색할 수 있습니다.", "concepts": [{"term": "Polar Metal", "why_emerged": "극성(dipole moment)과 금속성(free electrons)이 동시에 존재하는 물질을 찾고 이해하려는 필요성 때문에 등장했습니다. 이는 일반적으로 자유 전자의 차폐 효과로 인해 존재하기 어렵다고 여겨졌던 특이한 상태입니다.", "origin": "1960년대 초부터 D. Khomskii, G. King-Smith, D. Vanderbilt 등에 의해 이론적으로 논의되었고, 최근 실험적으로 발견되기 시작했습니다.", "connections": "Ferroelectrics, Multiferroics, Dielectrics, Superconductivity (일부 강유전성 금속에서 초전도성이 나타나기도 합니다)."}, {"term": "Perovskite Nitride", "why_emerged": "다양한 화학적 유연성과 구조적 다양성으로 인해 초전도체, 강유전체, 강자성체 등 다양한 기능성 재료를 탐색하는 데 중요한 페로브스카이트 구조를 질화물(nitride) 시스템에 적용하여 새로운 특성을 가진 물질을 개발하기 위해 사용됩니다.", "origin": "페로브스카이트 구조 자체는 L.A. Perovski가 1837년에 발견한 광물 명칭에서 유래했으며, 질화물 페로브스카이트는 비교적 최근에 활발히 연구되고 있습니다.", "connections": "Perovskite Oxides, Nitride Semiconductors, Multiferroic Materials, High-Tc Superconductors."}, {"term": "Second-Harmonic Generation (SHG)", "why_emerged": "물질의 비선형 광학 특성을 이용해 결정 내 반전 대칭이 깨져 있는지 확인하고, 특히 극성 재료의 존재 및 그 온도의존성을 연구하기 위해 비파괴적으로 정량적인 정보를 얻는 기술이 필요하여 등장했습니다. 반전 대칭이 없는 물질에서만 0이 아닌 SHG 신호가 발생합니다.", "origin": "Peter Franken 등이 1961년에 처음으로 레이저를 이용한 SHG를 관찰했습니다.", "connections": "Nonlinear Optics, Ferroelectrics, Centrosymmetry, Chiral Materials."}, {"term": "First-principles calculations", "why_emerged": "실험 없이도 물질의 기본적인 물리적, 화학적 특성을 예측하고 이해하기 위한 이론적 도구가 필요하여 개발되었습니다. 경험적 매개변수 없이 양자 역학의 기본 원리만을 사용하여 물질의 전자 구조 및 특성을 계산합니다.", "origin": "1920년대 양자 역학의 발전 이후, 밀도 범함수 이론(DFT)이 Hohenberg와 Kohn (1964) 및 Kohn과 Sham (1965)에 의해 정립되면서 현대적인 제일원리 계산의 기반이 마련되었습니다.", "connections": "Density Functional Theory (DFT), Band Structure, Electronic Properties, Materials Design, Ab-initio calculations."}], "english_summary": ["This study reports the observation of a thermally stable polar metallic state in perovskite nitride CeWN3.", "Synchrotron X-ray diffraction and second-harmonic generation confirm a polar Pna2_1 structure with polarity persisting up to 850 K.", "Electrical and optical conductivity measurements, consistent with first-principles calculations, demonstrate metallic transport behavior.", "The polar distortion and metallic conductivity originate from off-center tungsten displacements and W-N orbital hybridization.", "This work establishes a record-high-temperature polar metal, opening new avenues for robust polar and metallic materials."]}}, {"title": "(Sub)nanoscale Visualization of Reconstruction-Driven Moir\\'e Exciton Localization and Delocalization", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2609.34104", "authors": "Medha Dandu, Sriram Sankar, Giovanny Espitia, et al.", "last_authors": "Archana Raja, Sandhya Susarla", "summary": "Spectral fingerprints in optical absorption and emission have typically been used as a signature of exciton localization in twisted moir\\'e bilayers. However, the mechanism by which excitons become confined to specific stacking sites and their associated optical signature is experimentally unresolved. Here, we directly visualize in real space how tuning the change in extent of structural reconstruction leads to localization and delocalization of moir\\'e excitons in the WSe2/WS2 moir\\'e superlattice. Using cryogenic monochromated electron energy loss spectroscopy, together with first-principles GW-Bethe Salpeter equation calculations and optical spectroscopy, we uncover the physical mechanism that drives the correlation between twist-angle-dependent structural transformations, the real-space localization of moir\\'e excitons, and their optical signatures. Surprisingly, and in contrast to the prevailing understanding, we show that the emergence of new moir\\'e exciton resonances in the optical spectra alone is insufficient to establish exciton localization. Instead, the extent of structural reconstruction and external strain drives exciton localization, leading to new design principles for engineering moir\\'e excitons and strain-aware quantum optoelectronic devices.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Experimental visualization of moiré exciton localization in WSe2/WS2 van der Waals heterostructure.", "tags": ["moire", "vanderWaals", "2Dmaterials", "excitons", "experimental"], "image": "https://arxiv.org/static/browse/0.3.4/images/arxiv-logo-fb.png", "briefing": {"background": "이차원 물질을 겹쳐서 비틀면 모아레(moire) 초격자가 형성되며, 이는 전하, 스핀, 엑시톤 등 준입자의 거동에 강력한 영향을 미칩니다. 특히, 모아레 엑시톤은 양자 광전자 공학에서 새로운 기능을 구현할 수 있는 잠재력 때문에 활발히 연구되고 있습니다. 엑시톤 국소화(localization)는 이러한 모아레 엑시톤의 핵심적인 특성 중 하나입니다.", "motivation": "기존에는 광학 흡수 및 방출 스펙트럼의 특징을 모아레 엑시톤 국소화의 지표로 사용해 왔습니다. 하지만 엑시톤이 특정 적층(stacking) 위치에 어떻게 갇히는지, 그리고 그와 관련된 광학적 특성(optical signature)이 무엇인지에 대한 물리적 메커니즘은 실험적으로 명확히 밝혀지지 않았습니다.", "result": "이 연구는 WSe2/WS2 모아레 초격자에서 구조적 재구성(structural reconstruction)의 정도를 조절함으로써 모아레 엑시톤의 국소화 및 비국소화(delocalization)가 어떻게 유도되는지를 실공간(real space)에서 직접 시각화했습니다. 저온 단색화 전자 에너지 손실 분광법(cryogenic monochromated EELS)과 제일원리 계산을 통해, 비틀림 각도에 따른 구조적 변형, 모아레 엑시톤의 실공간 국소화, 그리고 그들의 광학적 특성 사이의 상관관계를 구동하는 물리적 메커니즘을 밝혀냈습니다. 특히, 광학 스펙트럼에서 새로운 모아레 엑시톤 공명(resonance)이 나타나는 것만으로는 엑시톤 국소화를 확립하기에 불충분하다는 기존의 이해와 상반되는 결과를 보여주었습니다.", "implication": "이 결과가 맞다면, 엑시톤 국소화가 단순히 광학적 특성 변화만으로 설명될 수 없으며, 구조적 재구성과 외부 변형(strain)이 엑시톤 국소화를 유도하는 핵심적인 요인임을 시사합니다. 이는 모아레 엑시톤 및 변형-감지 양자 광전자 소자를 설계하는 새로운 원칙을 제시합니다.", "novelty": "모아레 엑시톤의 국소화/비국소화 메커니즘을 실공간에서 직접 시각화한 것은 매우 참신한 접근입니다. 특히, 기존의 광학 스펙트럼 해석에 대한 통념을 뒤집고, 구조적 재구성과 변형의 역할을 명확히 규명했다는 점에서 중요합니다. 이는 독자가 관심을 가지는 2D 물질 및 반데르발스 이종접합(van der Waals heterostructures) 분야에서 새로운 통찰력을 제공하며, 양자 광전자 공학 분야에 기여합니다.", "unresolved": "이 초록에서 직접적으로 언급된 미해결 과제는 없으나, 구조적 재구성과 변형을 통한 엑시톤 엔지니어링의 새로운 설계 원칙이 제안된 만큼, 이를 다양한 모아레 물질 시스템에 적용하고 최적화하는 과정에서 추가적인 의문과 도전이 발생할 수 있습니다.", "future_work": "구조적 재구성 및 외부 변형을 제어하여 모아레 엑시톤을 정밀하게 제어하고, 이를 기반으로 하는 새로운 양자 광전자 소자 설계 및 구현에 대한 연구가 활발히 진행될 것으로 예상됩니다. 또한, 다른 2D 물질 조합이나 더 복잡한 모아레 시스템에서 이 메커니즘이 어떻게 작동하는지 탐구하는 연구도 중요할 것입니다.", "concepts": [{"term": "Moiré Excitons (모아레 엑시톤)", "why_emerged": "두 개의 유사하지만 약간 비틀리거나 격자 상수가 다른 2차원 물질을 겹칠 때 발생하는 주기적인 전위(potential) 환경에서 형성되는 엑시톤입니다. 이 주기적인 전위는 엑시톤의 에너지와 공간적 분포를 조절하며 독특한 광학적, 전자적 특성을 나타내기 때문에 양자 정보 기술 및 광전자 소자 응용을 위해 중요하게 연구됩니다.", "origin": "초록 정보만으로는 특정하기 어려움. 모아레 초격자 개념 자체는 결정학에서 오래되었으나, 2D 물질에서 모아레 엑시톤에 대한 연구는 그래핀 및 전이금속 디칼코게나이드(TMD) 이종접합의 등장과 함께 최근 활발해졌습니다.", "connections": "엑시톤, 모아레 초격자, 2D 물질 이종접합, 양자점(quantum dots)."}, {"term": "Structural Reconstruction (구조적 재구성)", "why_emerged": "두 개의 층이 겹쳐진 이종접합이나 비틀린 이중층 구조에서, 전체 시스템의 에너지를 최소화하기 위해 원자들이 이상적인 격자 위치에서 벗어나 재배열되는 현상입니다. 이는 특히 모아레 초격자 시스템에서 비틀림 각도가 작을 때 중요하게 나타나며, 전자 구조 및 엑시톤 특성에 큰 영향을 미칩니다.", "origin": "초록 정보만으로는 특정하기 어려움. 재료 과학 및 표면 과학 분야에서 오랜 연구 주제였으나, 2D 물질 모아레 시스템에서는 최근 몇 년간 그 중요성이 부각되었습니다.", "connections": "격자 변형(lattice strain), 모아레 초격자, 계면 에너지(interfacial energy), 에너지 최소화."}, {"term": "Exciton Localization (엑시톤 국소화)", "why_emerged": "엑시톤이 물질 내의 특정 결함이나 전위, 또는 이종접합 구조의 주기적인 포텐셜 우물(potential well)에 공간적으로 제한되어 움직이지 못하게 되는 현상입니다. 엑시톤이 국소화되면 발광 효율이 높아지거나 독특한 양자 광학적 특성을 나타낼 수 있어 양자 광원이나 단일 광자원(single-photon emitter) 등의 응용에 중요합니다.", "origin": "초록 정보만으로는 특정하기 어려움. 엑시톤 자체는 보어(Bohr)가 1930년대에 처음 제안했으며, 이후 반도체 물리학에서 엑시톤의 국소화 현상은 다양한 맥락에서 연구되었습니다.", "connections": "엑시톤, 양자 구속(quantum confinement), 불순물/결함 포텐셜, 모아레 포텐셜."}, {"term": "Cryogenic Monochromated Electron Energy Loss Spectroscopy (저온 단색화 전자 에너지 손실 분광법, EELS)", "why_emerged": "재료의 전자 구조, 원자 구성, 화학적 결합 등을 나노스케일 이하의 공간 분해능으로 분석하고 싶을 때 필요합니다. 특히 저온 환경에서 측정함으로써 열 진동 효과를 줄여 더 선명한 스펙트럼을 얻고, 민감한 샘플의 손상을 최소화할 수 있습니다. 단색화된 전자빔은 에너지 분해능을 극대화하여 미세한 전자 전이를 관찰할 수 있게 합니다.", "origin": "EELS는 1940년대부터 개발되기 시작했으며, 1960년대 이후 TEM(투과전자현미경)에 통합되어 발전했습니다. 단색화 기술과 저온 기술은 현대 EELS의 발전과 함께 꾸준히 향상되었습니다.", "connections": "투과전자현미경(TEM), 전자 에너지 손실 분광법(EELS), 전자 구조 분석, 원자 분해능 이미징, 나노분광학."}], "english_summary": ["This study directly visualizes the localization and delocalization of moiré excitons in WSe2/WS2 superlattices in real space.", "It reveals that the extent of structural reconstruction, influenced by twist angle and strain, is the key mechanism driving exciton behavior.", "Challenging previous understanding, the work shows that new exciton resonances in optical spectra alone are insufficient to establish exciton localization.", "The findings provide new design principles for engineering moiré excitons and strain-aware quantum optoelectronic devices.", "The research utilized cryogenic monochromated electron energy loss spectroscopy and first-principles calculations to uncover these correlations."]}}, {"title": "2D Theoretically Twistable Material Database (Science)", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2411.09741", "authors": "Yi Jiang, Urko Petralanda, Hanqi Pi, et al.", "last_authors": "Leslie M. Schoop, B. Andrei Bernevig", "summary": "The study of twisted two-dimensional (2D) materials, where twisting layers create moir\\'e superlattices, has created opportunities for investigating topological phases and strongly correlated physics. The broader potential of a seemingly infinite set of twistable 2D materials remains largely unexplored. Here, we define ''theoretically twistable materials'' as single- or multi-layer structures that allow for the construction of simple continuum models of their moir\\'e structures. Our high-throughput algorithm systematically searches for theoretically twistable semimetals and insulators based on the Topological 2D Materials Database (2D-TQCDB). By analyzing key electronic properties, we identify thousands of candidate materials, propose representative twistable materials, and provide examples of crystal growth and exfoliation for several of them. Our results provid rnal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2609.35602", "authors": "Yuan Fang, Kuan-Sen Lin, Mounica Mahankali, et al.", "last_authors": "Emilia Morosan, Qimiao Si", "summary": "Chiral Weyl--Kondo semimetals (cWKSM) provide a setting in which chiral Weyl quasiparticles emerge in the immediate vicinity of the Fermi energy from a Kondo-driven reconstruction of the strongly correlated electronic states in chiral heavy fermion systems (K.-S. Lin et al., arXiv:2602.22185). A defining characteristic of this strongly correlated topological state is the Kramers chiral Weyl fermions in the low-energy quasiparticle states. Recently, experiments in CeGaGe have emerged as a concrete realization of the proposed effect (Arushi et al., preprint). Motivated by these findings, here we go beyond the materials-specific effects by constructing a prototype Kondo lattice model; it incorporates only the essential couplings that respect the associated tetragonal crystalline symmetries. This simplification allows us to robustly demonstrate the symmetry-enforced Kramers Weyl fermions and related topological nodal states in the spectrum of heavy quasiparticles. Furthermore, the simplification provides a tractable setting to determine the salient features in the system's nonlinear optical response, the circular photogalvanic effect, in chiral Weyl--Kondo semimetals. Both analytical and numerical calculations identify sharp peaks in the frequency domain as signatures of the Kondo-driven chiral Weyl nodes; the sharpness of the spectrum reflects the resonant nature of the underlying strongly correlated electronic excitations. Thus, cWKSM provides a unique setting to spectroscopically identify topological fermions that are induced by strong electron correlations. As such, our results are expected to bring about much needed new insights into the understanding of strongly correlated gapless topological matter.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "
