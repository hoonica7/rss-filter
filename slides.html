<title>Daily Paper Slideshow</title>
<style>
  :root {
    color-scheme: light;
    --bg: #f6f7f4;
    --paper: #ffffff;
    --ink: #111827;
    --muted: #64748b;
    --line: #d8ddd2;
    --accent: #176b87;
    --accent-2: #9a3412;
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; overflow: auto; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: var(--bg); color: var(--ink); }
  .shell { max-width: 1500px; min-height: 100vh; margin: 0 auto; padding: 14px 18px; display: flex; flex-direction: column; }
  .topbar { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 16px; }
  .top-actions { display: flex; align-items: center; gap: 10px; }
  .topbar a, button { border: 1px solid var(--line); border-radius: 8px; background: var(--paper); color: var(--ink); padding: 10px 14px; font-weight: 700; text-decoration: none; cursor: pointer; }
  button.primary { background: var(--accent); border-color: var(--accent); color: white; }
  button:disabled { opacity: 0.45; cursor: not-allowed; }
  .counter { color: var(--muted); font-weight: 700; }
  .slide { min-height: calc(100vh - 82px); background: var(--paper); border: 1px solid var(--line); border-radius: 10px; padding: 18px; box-shadow: 0 18px 42px rgba(15, 23, 42, 0.10); display: grid; grid-template-columns: minmax(310px, 0.86fr) minmax(0, 1.55fr); gap: 18px; overflow: visible; }
  .paper-head { min-width: 0; min-height: 0; overflow: visible; display: flex; flex-direction: column; gap: 12px; }
  .figure { margin: 0; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: #f8fafc; }
  .figure img { display: block; width: 100%; max-height: 41vh; object-fit: contain; background: white; }
  .figure figcaption { padding: 7px 10px; color: var(--muted); font-size: 12px; line-height: 1.3; }
  .head-text { display: flex; flex-direction: column; gap: 9px; min-width: 0; }
  .badges { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .badge { border-radius: 999px; padding: 5px 9px; background: #eef2ff; color: #3730a3; font-size: 12px; font-weight: 800; }
  .score { background: #fee2e2; color: #991b1b; }
  h1 { margin: 0; font-size: 25px; line-height: 1.15; letter-spacing: 0; overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
  h1 a { color: inherit; text-decoration-color: rgba(23, 107, 135, 0.35); text-decoration-thickness: 2px; text-underline-offset: 4px; }
  h1 a:hover { color: var(--accent); text-decoration-color: var(--accent); }
  .meta, .authors, .why, .abstract { font-size: 13px; line-height: 1.45; }
  .meta, .authors { color: var(--muted); }
  .why strong, .abstract strong, .authors strong { color: var(--ink); }
  .authors { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .why { border-left: 4px solid var(--accent-2); padding-left: 10px; color: #374151; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .abstract { border-top: 1px solid var(--line); padding-top: 14px; color: #374151; }
  .original-abstract { border-top: 1px solid var(--line); padding-top: 10px; color: #374151; font-size: 11.5px; line-height: 1.35; overflow-wrap: anywhere; }
  .original-abstract strong { display: block; margin-bottom: 4px; color: var(--ink); }
  .tags { display: flex; flex-wrap: wrap; gap: 8px; }
  .tag { border-radius: 999px; padding: 4px 8px; background: #f1f5f9; color: #475569; font-size: 12px; font-weight: 700; }
  .head-text > .link { display: none; }
  .briefing { min-width: 0; min-height: 0; overflow: visible; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); grid-auto-rows: minmax(0, auto); align-content: start; gap: 11px 18px; border-top: 0; padding-top: 0; }
  .brief-section { min-width: 0; }
  .brief-section.wide { grid-column: 1 / -1; }
  .brief-section h2 { margin: 0 0 4px; font-size: 14px; line-height: 1.22; color: #0f766e; letter-spacing: 0; }
  .brief-section p, .brief-section li { margin: 0; font-size: 12.5px; line-height: 1.42; color: #1f2937; overflow-wrap: anywhere; }
  .brief-section ul { margin: 0; padding-left: 20px; }
  .concepts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 9px 14px; }
  .concept { border-top: 1px solid var(--line); padding-top: 7px; }
  .concept h3 { margin: 0 0 4px; font-size: 13px; color: #7c2d12; letter-spacing: 0; }
  .concept p { margin: 2px 0 0; font-size: 11.5px; line-height: 1.35; color: #374151; overflow-wrap: anywhere; }
  .concept b { color: #111827; }
  .link { color: var(--accent); font-weight: 800; text-decoration: none; }
  .empty { padding: 48px; background: var(--paper); border: 1px solid var(--line); border-radius: 12px; color: var(--muted); }
  @media (max-width: 860px) {
    .shell { padding: 14px; }
    .topbar, .top-actions { align-items: stretch; flex-direction: column; }
    .slide, .briefing, .concepts { grid-template-columns: 1fr; }
    .slide { min-height: auto; overflow: visible; display: grid; }
    h1 { font-size: 28px; }
  }
</style>

<script>
const slides = [{"title": "Deep learning approach for ARPES and time-resolved ARPES: Gradient attention U-net for denoising and reconstruction", "journal": "PRB_Recent", "source": "keyword", "link": "http://link.aps.org/doi/10.1103/53wd-bg7k", "authors": "Gongyi Cheng, Ziyang Guo, Zhengcong Yan, et al.", "last_authors": "Shijing Tan, Bing Wang", "summary": "Data analysis in angle-resolved photoemission spectroscopy (ARPES) and time-resolved ARPES usually employs derivative-based methods, such as second derivative and maximum curvature, to enhance spectral visibility. Despite their widespread use, these methods are prone to noise amplification and the i…", "tier": "A_MUST_READ", "score": "10", "reason": "title strong match: ARPES", "tags": ["ARPES", "angle-resolvedphotoemission", "photoemission"], "image": "", "briefing": {"background": "각도분해 광전자 분광법(ARPES)과 시분해 ARPES(TR-ARPES)는 고체 내 전자의 에너지-운동량 관계를 직접 측정하는 강력한 도구이지만, 실험 데이터에 수반되는 노이즈와 낮은 신호 대 잡음비(S/N)가 정밀한 밴드 구조 분석을 방해하는 고질적인 문제가 있습니다.", "motivation": "기존의 데이터 처리 방식인 2차 미분(Second derivative)이나 최대 곡률(Maximum curvature) 기법은 밴드를 선명하게 보여주지만, 노이즈를 증폭시키고 데이터의 정량성을 훼손하는 한계가 있어 이를 극복할 딥러닝 기반의 새로운 복원 알고리즘이 필요했습니다.", "result": "연구진은 Gradient Attention U-net(GAU-net)이라는 딥러닝 모델을 개발하여 ARPES 데이터의 노이즈를 효과적으로 제거하고 밴드 구조를 정밀하게 재구성하는 데 성공했습니다. 이 모델은 가짜 신호를 최소화하면서 실제 물리적 전이 구조를 복원하는 데 탁월한 성능을 보입니다.", "implication": "ARPES 데이터 분석의 정확도가 대폭 향상되어, 그동안 노이즈에 묻혀 식별하기 어려웠던 미세한 밴드 갭이나 복잡한 페르미 표면의 특징을 명확히 규명할 수 있게 됩니다.", "novelty": "기존 U-net 구조에 기울기 주의(Gradient Attention) 메커니즘을 결합하여 밴드의 에지를 더 잘 보존하도록 설계되었습니다. 특히 독자가 관심을 갖는 Kagome 금속이나 CDW 물질의 미세한 밴드 변형 분석에 즉각적으로 활용될 수 있는 도구입니다.", "unresolved": "학습 데이터셋의 범위를 벗어난 극단적인 비선형 노이즈나 실험 장비 특유의 아티팩트가 존재할 경우 모델의 일반화 성능이 어느 정도일지에 대한 추가 검증이 필요합니다.", "future_work": "다양한 물질계(예: 위상 반금속, 다강체)의 실험 데이터에 이 모델을 적용하여 표준화된 ARPES 전처리 파이프라인으로 구축하는 연구가 기대됩니다.", "concepts": [{"term": "Gradient Attention U-net", "why_emerged": "이미지 복원에 강한 U-net 구조를 물리 데이터의 특성인 기울기 변화에 더 민감하게 반응하도록 개선하기 위해 등장했습니다.", "origin": "본 연구진(Cheng et al.)이 제안함", "connections": "컴퓨터 비전의 U-net, ARPES 2차 미분법"}, {"term": "Denoising (탈잡음)", "why_emerged": "측정 장비의 열적 잡음이나 검출기 한계로 발생하는 배경 노이즈를 제거하여 신호의 명확성을 높이기 위해 필요합니다.", "origin": "신호 처리 분야의 고전적 개념", "connections": "위너 필터, 웨이브렛 변환, 딥러닝 기반 복원"}], "english_summary": ["A novel deep learning framework, Gradient Attention U-net (GAU-net), is proposed for denoising and reconstructing ARPES and TR-ARPES data.", "The method overcomes the limitations of traditional derivative-based analysis, such as noise amplification and loss of quantitative accuracy.", "GAU-net enhances spectral visibility and captures fine band structures more effectively than conventional filters.", "This approach provides a robust tool for extracting precise electronic structure information from noisy experimental datasets."]}}, {"title": "Unified First-Principles Formula for Time-Resolved ARPES Spectra of Coherent and Incoherent Excitons beyond the Dilute Limit", "journal": "PRL_Recent", "source": "keyword", "link": "http://link.aps.org/doi/10.1103/zhs1-rv1k", "authors": "Gianluca Stefanucci, Enrico Perfetto", "last_authors": "Gianluca Stefanucci, Enrico Perfetto", "summary": "Despite major experimental progresses in time-resolved and angle-resolved photoemission spectroscopy, a quantitative, microscopic framework for interpreting exciton-induced modifications of electronic band structures—applicable even beyond the low-density limit—is still lacking. Here, we close this gap by introducing a unified approach that links the dynamics of coherent and incoherent excitons to distinct and experimentally observable excitonic sidebands. Our central result is a general, first-principles formula for time-resolved photoemission spectra, applicable across a broad range of temperatures, excitation densities, and pump-probe delays. This advance provides a predictive tool for quantitatively tracking excitonic dynamics in complex materials.", "tier": "A_MUST_READ", "score": "10", "reason": "title strong match: ARPES", "tags": ["ARPES", "angle-resolvedphotoemission", "photoemission", "bandstructure"], "image": "", "briefing": {"background": "시분해 ARPES(TR-ARPES)는 펌프-프로브 방식을 통해 비평형 상태의 전자 동역학을 관찰할 수 있지만, 엑시톤(exciton)과 같은 다체 상호작용이 밴드 구조에 미치는 영향을 정량적으로 해석하기 위한 이론적 틀이 부족했습니다.", "motivation": "특히 엑시톤 밀도가 낮은 영역을 넘어선 고밀도 또는 불응집(incoherent) 엑시톤 상태가 밴드 구조에 만드는 사이드밴드(sideband) 변화를 설명할 수 있는 보편적인 제1원리 계산 공식이 없었습니다.", "result": "연구진은 온도, 여기 밀도, 시간 지연 등 광범위한 조건에서 응집 및 불응집 엑시톤의 역학을 기술할 수 있는 통합된 제1원리 공식을 도출했습니다. 이를 통해 TR-ARPES 스펙트럼에서 관측되는 엑시톤 유도 사이드밴드의 기원을 규명했습니다.", "implication": "이 공식을 통해 복잡한 양자 재료에서 광유기된 엑시톤의 생성, 확산, 소멸 과정을 실험적으로 관측되는 밴드 위치와 강도 변화를 통해 직접적으로 추적할 수 있게 되었습니다.", "novelty": "희박 극한(dilute limit)을 넘어선 영역까지 적용 가능한 범용성을 확보했으며, 2D 물질이나 위상 절연체 내의 엑시톤 물성 분석에 강력한 이론적 도구를 제공합니다.", "unresolved": "강상관 전자계(Strongly correlated systems)에서 전자-전자 산란이 극도로 강할 때 이 공식의 근사법이 얼마나 정확하게 유지될지에 대한 논의가 남아 있습니다.", "future_work": "전이금속 디칼코게나이드(TMD)와 같은 실제 2D 반도체 물질의 TR-ARPES 실험 결과와 이 공식을 결합하여 엑시톤 수명을 정밀하게 계산하는 연구가 진행될 것으로 보입니다.", "concepts": [{"term": "Excitonic Sidebands", "why_emerged": "빛에 의해 형성된 엑시톤이 원래의 전자 밴드 주변에 새로운 에너지 상태를 형성하기 때문에 이를 설명하기 위해 도입되었습니다.", "origin": "초록 정보만으로는 특정하기 어려움 (고체물리 다체 이론에서 유래)", "connections": "Floquet 사이드밴드, 전자-정공 상호작용"}, {"term": "Incoherent Excitons", "why_emerged": "위상이 정렬되지 않은 채 존재하는 엑시톤들의 통계적 거동이 실제 물질의 비평형 특성에 큰 영향을 미치기 때문에 중요합니다.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "엑시톤 응축, 볼츠만 수송 방정식"}], "english_summary": ["A unified first-principles formula is developed to interpret exciton-induced modifications in TR-ARPES spectra.", "The theory accounts for both coherent and incoherent excitons beyond the dilute density limit.", "It links excitonic dynamics directly to observable spectral features like excitonic sidebands across various temperatures and densities.", "This framework provides a predictive tool for tracking many-body excitonic physics in complex quantum materials."]}}, {"title": "Direct evidence of light-induced phase-fluctuations in cuprates via time-resolved ARPES", "journal": "npj_QuantumMaterials", "source": "keyword", "link": "https://www.nature.com/articles/s41535-026-00919-y", "authors": "D. Armanno, F. Goto, J.-M. Parent, et al.", "last_authors": "N. Gauthier, F. Boschini", "summary": "Direct evidence of light-induced phase-fluctuations in cuprates via time-resolved ARPES", "tier": "A_MUST_READ", "score": "10", "reason": "title strong match: ARPES", "tags": ["ARPES", "cuprate"], "image": "https://pubads.g.doubleclick.net/gampad/ad?iu=/285/npjquantmats.nature.com/article&sz=728x90&c=-1144681787&t=pos%3Dtop%26type%3Darticle%26artid%3Ds41535-026-00919-y%26doi%3D10.1038/s41535-026-00919-y%26subjmeta%3D301,639,766%26kwrd%3DMaterials+science,Physics", "briefing": {"background": "구리 산화물(Cuprates) 초전도체에서 초전도성은 쿠퍼 쌍의 형성(Pairing)과 이들의 위상 결맞음(Phase coherence)이라는 두 단계로 이해됩니다. 빛을 쬐어 초전도 상태를 조절하려는 시도에서 이 두 요소 중 무엇이 더 지배적인지 규명하는 것은 중요한 과제입니다.", "motivation": "기존 연구들에서는 빛에 의한 초전도 억제가 단순히 준입자(quasiparticle)의 산란 때문인지, 아니면 위상 요동(phase fluctuation)의 증가 때문인지 명확히 구분하는 데 어려움이 있었습니다.", "result": "TR-ARPES를 통해 구리 산화물에 강한 빛을 조사했을 때 발생하는 전자 구조의 변화를 추적한 결과, 시스템의 위상 요동이 직접적으로 유도된다는 명확한 증거를 확보했습니다.", "implication": "비평형 상태에서 초전도성을 제어할 때 쿠퍼 쌍 자체를 파괴하는 것보다 위상의 안정성을 조절하는 것이 핵심적인 기작임을 시사하며, 이는 광유기 초전도 현상의 이해를 돕습니다.", "novelty": "위상 요동을 TR-ARPES 데이터를 통해 직접적으로 증명했다는 점이 혁신적이며, 독자의 관심사인 비정형 초전도체 및 시간 분해 분석과 완벽히 일치하는 주제입니다.", "unresolved": "유도된 위상 요동이 얼마나 오랫동안 지속되는지, 그리고 이 현상이 모든 도핑 농도의 구리 산화물에서 보편적으로 나타나는지에 대한 추가 데이터가 필요합니다.", "future_work": "다양한 펌프 광의 파장 및 세기에 따른 위상 요동의 상관관계를 조사하고, 이를 이용해 초전도 전이 온도를 제어하는 실험적 시도가 이어질 것입니다.", "concepts": [{"term": "Phase Fluctuations (위상 요동)", "why_emerged": "저차원이나 강상관 물질에서 질서 매개변수의 크기는 존재하지만 위상이 정렬되지 않아 거시적 양자 상태가 깨지는 현상을 설명하기 위해 등장했습니다.", "origin": "V. J. Emery and S. A. Kivelson (1995) 등이 구리 산화물에 대해 강조함", "connections": "KT 전이, 베레진스키-코스털리츠-사울리스(BKT) 물리학"}, {"term": "Light-induced phase", "why_emerged": "평형 상태에서 존재하지 않는 새로운 상이나 숨겨진 상태를 빛을 이용한 여기(excitation)를 통해 구현하기 위해 제안되었습니다.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "광유기 초전도, Floquet 상태"}], "english_summary": ["This study provides direct TR-ARPES evidence for light-induced phase fluctuations in cuprate superconductors.", "The results differentiate between the suppression of the superconducting gap and the loss of phase coherence.", "Findings suggest that phase fluctuations play a critical role in the non-equilibrium response of high-Tc materials to optical pumping.", "The work clarifies the mechanism behind light-induced changes in the superconducting state of cuprates."]}}, {"title": "Emergent anomalous Hall effect from surface states in altermagnetic MnTe thin films", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/5d3f-y218", "authors": "Yufei Zhao, Saswata Mandal, Chao-Xing Liu, Binghai Yan", "last_authors": "Chao-Xing Liu, Binghai Yan", "summary": "Transport measurements on thin films of the prototypical altermagnet MnTe have yielded conflicting reports including the anomalous Hall effect (AHE) with opposite signs and resistivity independent of thickness. In this work, we resolve these discrepancies by disentangling the bulk and surface contri…", "tier": "A_MUST_READ", "score": "9", "reason": "Experimental study of anomalous Hall effect from surface states in altermagnetic thin films.", "tags": ["experiment", "altermagnetism", "anomalousHall", "thinfilms", "surfacestates"], "image": "", "briefing": {"background": "알터마그네티즘(Altermagnetism)은 강자성체처럼 큰 스핀 분할(spin-splitting)을 가지면서도 반강자성체처럼 순 자화(net magnetization)가 0인 새로운 자기 상입니다. MnTe는 이러한 성질을 가진 대표적인 후보 물질로 주목받아 왔으나, 실험적으로 측정된 비정상 홀 효과(AHE)의 부호가 연구마다 다르거나 박막 두께에 따른 비저항 거동이 일정하지 않는 등 데이터 해석에 혼란이 있었습니다.", "motivation": "MnTe 박막에서 관찰되는 비정상 홀 효과의 물리적 기원을 명확히 규명하고, 기존 실험들 사이의 데이터 불일치를 해결하기 위해 벌크(bulk)와 표면(surface)의 기여도를 분리하여 분석하고자 했습니다.", "result": "MnTe 박막의 수송 특성을 분석한 결과, 관찰된 비정상 홀 효과가 벌크 상태뿐만 아니라 표면 상태(surface states)에서 유래한 기여가 혼재되어 있음을 밝혀냈습니다. 특히 표면 상태의 기여를 통해 두께에 무관한 비저항과 실험적 부호 반전 현상을 일관되게 설명할 수 있었습니다.", "implication": "알터마 호 검증."}], "english_summary": ["High-quality RuO2 single crystals were investigated to clarify the debated magnetic nature of this altermagnet candidate.", "Transport measurements revealed a T-squared resistivity dependence, characteristic of a Fermi-liquid state.", "The susceptibility data and metallic behavior support a paramagnetic ground state in the bulk.", "The results challenge existing altermagnetic interpretations for bulk RuO2 and highlight the importance of sample quality."]}}, {"title": "High-throughput discovery and strain engineering of altermagnetic monolayers", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/821z-nv3s", "authors": "Wen-Ti Guo, Junqi Xu, Xinqi Liu, Huaiqiang Wang, Jianzhou Zhao, Haijun Zhang", "last_authors": "Jianzhou Zhao, Haijun Zhang", "summary": "As a newly classified magnetic phase, altermagnetism integrates characteristics of conventional antiferromagnetism and ferromagnetism, exhibiting zero net magnetization and anisotropic spin-splitting. Two-dimensional altermagnets, in particular, offer significant potential for spintronic transport a…", "tier": "A_MUST_READ", "score": "9", "reason": "Computational discovery and engineering of 2D altermagnets, a direct user interest.", "tags": ["altermagnetism", "2Dmaterials", "computationalmaterialsscience", "spintronics"], "image": "", "briefing": {"background": "2차원 자성체는 원자 층 수준에서 자성을 제어할 수 있어 차세대 스핀 트로닉스 구현을 위한 핵심 플랫폼입니다. 특히 알터마그네티즘을 2차원 시스템에 구현하면 외부 자기장 없이도 효율적인 스핀 주입 및 제어가 가능할 것으로 기대됩니다.", "motivation": "고처리량(high-throughput) 계산 기법을 활용하여 아직 발견되지 않은 2차원 알터마그네틱 물질들을 대량으로 탐색하고, 스트레인 엔지니어링을 통해 이들의 성능을 최적화하는 전략을 제시하고자 했습니다.", "result": "방대한 데이터베이스 스크리닝을 통해 다수의 안정적인 알터마그네틱 단층(monolayer) 물질들을 새롭게 발굴했습니다. 또한, 물리적인 스트레인을 가함으로써 스핀 분할의 크기와 방향을 정밀하게 제어할 수 있음을 이론적으로 증명했습니다.", "implication": "실험가들에게 새로운 2차원 자성 연구 후보군을 제공하며, 스트레인을 이용한 나노 스케일 스핀 제어 소자의 기초 설계 원리를 제시했습니다.", "novelty": "2차원 알터마그넷에 대한 체계적인 라이브러리를 구축하고, 조절 파라미터로서 스트레인의 유효성을 입증했습니다. 독자의 관심사인 2D 소재 및 스핀 ains.", "The results demonstrate a new class of topological defects characterized by a CP^2 invariant.", "The study links multiband superconductivity to complex topological magnetic structures."]}}, {"title": "Collective Magnetic Excitations in a Photo-excited Electron-doped Cuprate Superconductor", "journal": "arXiv_CondMat", "source": "author whitelist", "link": "https://arxiv.org/abs/2511.22054", "authors": "Daniel Jost, Jiarui Li, Jordyn Hales, et al.", "last_authors": "Yao Wang, Wei-Sheng Lee", "summary": "Elucidating the microscopic behavior of cuprates under ultrafast photoexcitation offers critical insights into their highly correlated out-of-equilibrium states. Although quasiparticle dynamics have been investigated extensively, the behavior of collective magnetic excitations remains comparatively unexplored. Here, we use time-resolved resonant inelastic X-ray scattering (trRIXS) at the Cu $L_3$-edge to track the collective magnetic excitations (paramagnons) in an optimally electron-doped cuprate driven out-of-equilibrium by a femtosecond pump laser pulse. Upon pumping, we observed an anti-Stokes signal associated with paramagnon generation, which modifies the paramagnon dispersion near the zone center, although the bandwidth remained unchanged. Moreover, the spectral weight exhibits a momentum-dependent variation across the Brillouin zone. The light-driven boost of the paramagnon population and the resulting spectral-weight transfer could provide new leverage to manipulate the properties of cuprates.", "tier": "A_MUST_READ", "score": "9", "reason": "author whitelist: Zhi-Xun Shen", "tags": ["RIXS", "cuprate", "superconduct", "correlated", "magnon"], "image": "https://arxiv.org/static/browse/0.3.4/images/arxiv-logo-fb.png", "briefing": {"background": "구리 산화물(Cuprates)은 고온 초전도의 핵심 물질로, 강한 전자 상관관계에 의한 자기적 들뜸(magnon)이 초전도 메커니즘과 깊이 연관되어 있습니다.", "motivation": "비평형 상태에서 펨토초 레이저를 이용해 파라마그논(paramagnon)과 같은 집단 자기 들뜸이 어떻게 변화하는지 관찰하고자 했습니다.", "result": "전자 도핑된 구리 산화물에  spin angular momentum in conventional magnets. By using a magnet dominated by orbital angular momentum (OAM), we demonstrate a 70-fold enhancement in orbital Hall magnetoresistance in cobalt II oxide/copper (CoO/Cu*), compared with spin Hall magnetoresistance in cobalt II oxide/platinum (CoO/Pt). This arises from interactions between dynamic OAM from surface-oxidized Cu* and static OAM in the antiferromagnetic insulator CoO. Our results show how by using OAM-dominated materials, we can harness the benefits of giant orbital currents that have not been possible using conventional spin-dominated magnets.", "tier": "B_IMPORTANT_CONDMAT", "score": "9", "reason": "Experimental study of orbital magnetoresistance in an antiferromagnet, highly relevant to user.", "tags": ["magnetism", "antiferromagnet", "orbitalphysics", "transport", "materials"], "image": "", "briefing": {"background": "스핀트로닉스는 스핀 전류를 정보 전달의 매개체로 활용하지만, 최근에는 스핀보다 효율이 높을 것으로 기대되는 '궤도 전류(orbital current)'가 새로운 물리적 화두로 떠오르고 있습니다.", "motivation": "기존의 스핀 홀 자기저항(SMR)은 스핀 중심의 자기적 상호작용에 의존했으나, 궤도 각운동량(OAM)이 지배적인 물질을 활용해 궤도 홀 자기저항의 효율을 극대화하고자 했습니다.", "result": "CoO/Cu* 이질구조에서 CoO/Pt 대비 70배 향상된 궤도 홀 자기저항을 확인했으며, 이는 표면 산화된 Cu에서 생성된 동적 궤도 각운동량과 CoO의 정적 궤도 각운동량 사이의 상호작용에 기인함을 밝혔습니다.", "implication": "궤도 각운동량을 직접 제어함으로써 기존 스핀 기반 소자보다 훨씬 효율적인 궤도 기반 자기 소자 구현의 가능성을 열었습니다.", "novelty": "궤도 전류가 물질 내부의 궤도 각운동량과 직접적으로 결합하여 거대한 수송 신호를 생성함을 실증했으며, 이는 궤도 물리학의 실용적 활용 가능성을 크게 높였습니다.", "unresolved": "CoO/Cu* 계면에서 일어나는 산화 과정의 정밀 제어와 소자화 공정의 재현성 문제가 남아 있습니다.", "future_work": "다양한 궤도 강자성체 혹은 반강자성체를 활용한 후속 소자 연구와, 궤도 전류가 전자 구조에 미치는 영향을 살피는 분광학적 연구가 기대됩니다.", "concepts": [{"term": "Orbital Hall Magnetoresistance (OHM)", "why_emerged": "스핀 전류보다 높은 궤도 전류를 활용하여 자기적 상태를 감지하고 조작하기 위해 제안되었습니다.", "origin": "Go et al. (2018) 등의 이론적 예측이 최근 실험적으로 확인되는 추세입니다.", "connections": "스핀 홀 효과, 이방성 자기저항, 스핀-궤도 결합."}], "english_summary": ["Experimental demonstration of giant orbital Hall magnetoresistance in CoO/Cu*.", "Achieved 70-fold enhancement compared to conventional spin Hall magnetoresistance.", "Utilizes interaction between dynamic OAM and static OAM of the antiferromagnetic insulator.", "Suggests OAM-dominated materials as a high-efficiency alternative to spin-based magnets."]}}, {"title": "Dirac magnons in a thin elemental itinerant ferromagnet", "journal": "Science_Advances", "source": "Gemini", "link": "https://doi.org/10.1126/sciadv.aed9835", "authors": "Khalil Zakeri, Christopher Hins, Robin R. Neumann, Alexander Mook, Arthur Ernst", "last_authors": "Alexander Mook, Arthur Ernst", "summary": "A distinct difference between graphene—an atomic layer of carbon—and conventional semiconductors is that its electrons behave as massless Dirac fermions, giving rise to unprecedented physical properties. Magnetically ordered solids host magnons, quasiparticles associated with magnetic degrees of freedom. While Dirac magnons have recently been predicted in specific insulating or rare-earth magnets, their existence in thin 3d magnets remains elusive because of the complex nature of itinerant magnetism and dimensionality effects. Here, we demonstrate the presence of Dirac magnons in a thin itinerant elemental ferromagnet. By investigating atomically designed hexagonal close-packed cobalt films, we establish that magnons in such structures resemble the Dirac electrons in graphene. We explain the physical nature of these Dirac magnons and discuss the consequences of symmetry, dimensionality, magnetic interactions, the number of atomic layers, and cobalt’s itinerant magnetism on the properties of the Dirac points. Our results pave the way for finding and engineering Dirac magnons in a variety of low-dimensional layered 3d ferromagnets and metamaterials.", "tier": "B_IMPORTANT_CONDMAT", "score": "9", "reason": "Dirac magnons in a thin itinerant ferromagnet, highly relevant to Dirac physics and magnetic topological materials.; demoted from A: broad CM, not direct user/project hit", "tags": ["Diracphysics", "magnons", "ferro  "score": "9", "reason": "Directly relevant to altermagnetism and d-wave textures of interest.", "tags": ["altermagnet", "phonon", "Berrycurvature"], "image": "https://arxiv.org/html/2607.13923v1/x1.png", "briefing": {"background": "알터마그넷(altermagnet)은 스핀-궤도 결합(SOC) 없이도 시간 반전 대칭성을 깨는 자성 상태를 가져 독특한 전송 현상을 보입니다. 이 물질 내에서의 격자 진동(포논)은 스핀과 궤도 자유도를 매개하는 중요한 요소입니다.", "motivation": "상대론적 효과인 SOC 없이도 알터마그넷의 d-파(d-wave) 궤도 자성 텍스처를 포논으로 전이시켜, 포논 수준에서 새로운 각운동량 관련 물리 현상을 구현하고자 했습니다.", "result": "본-오펜하이머 근사 내에서 전자-포논 결합을 통해 d-파 궤도 자성 모멘트 텍스처가 축방향 포논(axial phonons)으로 전이됨을 이론적으로 보였습니다.", "implication": "알터마그넷을 기반으로 열 구배를 통해 각운동량 전류를 제어하는 '각운동량 제벡/스플리터 효과'를 실현할 가능성을 제시합니다.", "novelty": "SOC가 없는 상태에서 포논의 각운동량 텍스처를 유도했다는 점이 독창적이며, 알터마그네틱 물질의 새로운 기능성 구현 가능성을 열었습니다.", "unresolved": "제시된 이론적 모델의 실험적 검증 방법(예: 비탄성 중성자 산란 등)에 대한 구체적인 시나리오가 추가로 필요합니다.", "future_work": "특정 알터마그네틱 물질에서의 포논 분산 관계 계산 및 열전소자로서의 응용 가능성에 대한 후속 계산이 기대됩니다.", "concepts": [{"term": "Altermagnet", "why_emerged": "기존 강자성/반강자성으로 분류되지 않는 비상식적인 자성 위상을 설명하기 위해", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "시간 반전 대칭성 파괴, Berry curvature, 반강자성"}, {"term": "Axial phonons", "why_emerged": "포논의 각운동량 자유도를 연구하기 위해", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "Berry curvature, phonon Hall effect"}], "english_summary": ["Demonstrated that axial phonons can host d-wave angular momentum textures in altermagnets.", "Proposed mechanism relies on electron-phonon coupling via molecular Berry curvature without SOC.", "Predicts angular-momentum Seebeck and splitter effects in altermagnets.", "Expands the functional scope of altermagnetic materials to phononic systems."]}}, {"title": "Multiplet-Selective Photoelectron Diffraction from an Altermagnet", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2605.31531", "authors": "L. Plucinski", "last_authors": "L. Plucinski", "summary": "Direct real-space probes of altermagnetic order remain scarce. Here we introduce multiplet-selective photoelectron diffraction (PED), a methodology in which different regions of a transition-metal core-level multiplet act as distinct photoemission source waves. Using multiple-scattering calculations for the metallic altermagnet candidate CrSb, we show that selected Cr $3p$ multiplet features with predominantly $Y_1^{+1}$ and $Y_1^{-1}$ character generate robust diffraction asymmetries sensitive to altermagnetic domains. We demonstrate that both circularly and linearly polarized light provide access to the effect, while suitable combinations of domains, light polarizations, and multiplet-energy windows suppress nonmagnetic diffraction backgrounds. The proposed approach can be implemented using standard momentum-resolved photoemission instrumentation and establishes core-level PED as a practical route toward domain-resolved studies of altermagnets.", "tier": "B_IMPORTANT_CONDMAT", "score": "9", "reason": "Methodological development for altermagnets with direct photoemission application.", "tags": ["photoemission", "altermagnet", "method"], "image": "https://arxiv.org/html/2605.31531v2/Figures/Fig1_concept_V06.png", "briefing": {"background": "알터마그넷의 자성 도메인을 실공간에서 직접 관찰하는 것은 매우 어렵습니다. 기존의 스핀 편극 ARPES 등은 표면 상태에 국한되거나 자성 도메인을 구별하는 데 한계가 있었습니다.", "motivation": "표준적인 광전자 분광법(PES) 장비를 사용하여 알터마그네틱 물질의 복잡한 자성 도메인을 효과적으로 분별하고 시각화할 수 있는 새로운 분석 기법을 정립하고자 했습니다.", "result": "전이금속의 코어 레벨 멀티플렛(multiplet) 구조 중 특정 에너지를 선택해 광전자 회절(PED) 실험을 수행하면, 빛의 편광 상태와 도메인에 따라 비대칭성이 나타남을 계산으로 증명했습니다.", "implication": "알터마그넷 연구에 있어 표준적인 ARPES 장비를 활용한 도메인 이미징이 가능해지며, 알터마그네틱 순서의 직접적인 검증 경로를 확보하게 됩니다.", "novelty": "코어 레벨 멀티플렛 구조와 광전자 회절을 결합하여 알터마그넷 도메인을 직접 탐지하는 방법론을 제시한 점이 중요합니다.", "unresolved": "실제 시료(CrSb 등)에서 비자성 회절 배경 노이즈를 얼마나 효과적으로 억제할 수 있을지에 대한 실험적 최적화가 관건입니다.", "future_work": "실제 실험실 환경에서 알터마그네틱 시료를 대상으로 한 멀티플렛 선택적 PED 실험 수행이 필요합니다.", "concepts": [{"term": "Photoelectron Diffraction (PED)", "why_emerged": "결정 구조 내 원자의 상대적 위치 및 도메인 정보를 얻기 위해", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "ARPES, LEED, 다중 산란 이론"}, {"term": "Multiplet", "why_emerged": "강상관 전자계에서 다전자 상태의 복잡한 에너지 준위 구조를 설명하기 위해", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "Core-level spectroscopy, RIXS"}], "english_summary": ["Introduced multiplet-selective photoelectron diffraction (PED) for domain-resolved altermagnet study.", "Utilized Cr 3p core-level multiplets as photoemission source waves.", "Calculated diffraction asymmetries using multiple-scattering models for CrSb.", "Provides a practical, standard-instrument-compatible route to observe altermagnetic order."]}}, {"title": "Coexistence of liquid-like disordered state and weak ferromagnetism in a s = 1 kagome lattice", "journal": "npj_QuantumMaterials", "source": "Gemini", "link": "https://www.nature.com/articles/s41535-026-00917-0", "authors": "J. Khatua, Taeyun Kim, Chanhyeon Lee, et al.", "last_authors": "Hiroyuki Nojiri, Kwang-Yong Choi", "summary": "Coexistence of liquid-like disordered state and weak ferromagnetism in a s = 1 kagome lattice", "tier": "B_IMPORTANT_CONDMAT", "score": "9", "reason": "Kagome magnetism study relevant to magnetic topological materials interest.", "tags": ["kagome", "magnetism", "disorder"], "image": "https://pubads.g.doubleclick.net/gampad/ad?iu=/285/npjquantmats.nature.com/article&sz=728x90&c=-773719160&t=pos%3Dtop%26type%3Darticle%26artid%3Ds41535-026-00917-0%26doi%3D10.1038/s41535-026-00917-0%26subjmeta%3D119,639,766,997%26kwrd%3DCondensed-matter+physics,Magnetic+properties+and+materials", "briefing": {"background": "카고메 격자는 기하학적 좌절(geometrical frustration)로 인해 양자 스핀 액체나 비정상 홀 효과와 같은 이국적인 물성이 발현되기 쉬운 플랫폼입니다. 특히 S=1 시스템은 S=1/2에 비해 덜 탐구되었으나, 양자화된 격자 구조와 자기적 상호작용 간의 경쟁이 연구의 핵심입니다.", "motivation": "본 연구는 S=1 카고메 격자 시스템에서 나타나는 비정상적인 자기적 상태와 무질서한 액체와 유사한 상태가 어떻게 공존하는지를 규명하고자 합니다.", "result": "액체와 같은 스핀 무질서 상태와 약한 강자성이 공존함을 실험적으로 관찰하였습니다.", "implication": "카고메 격자 내의 자기적 상호작용이 단일 위상으로 고정되지 않고, 국소적인 무질서와 전역적인 약한 강자성이 공존할 수 있음을 보여줍니다.", "novelty": "카고메 금속(AV3Sb5 등)에 관심을 가진 독자에게, 스핀 상태의 복잡한 공존 현상은 자기적 위상 전이와 기하학적 좌절의 상호작용을 이해하는 새로운 실마리를 제공합니다.", "unresolved": "이러한 무질서 상태가 구조적인 결함에 기인한 것인지, 아니면 순수한 양자적 스핀 액체 거동인지에 대한 명확한 구분은 추가적인 조사가 필요합니다.", "future_work": "저온 극저온 물리 측정 및 중성자 산란을 통한 스핀 동역학의 직접적인 관찰이 필요합니다.", "concepts": [{"term": "카고메 격자", "why_emerged": "기하학적으로 엇갈린 삼각형 격자가 스핀 좌절을 유도하여 이국적인 바닥 상태를 생성하기 위해 제안됨.", "origin": "Ito, K. (1951년경 광물 구조 연구에서 유래).", "connections": "양자 스핀 액체, AV3Sb5, 비정상 홀 효과와 밀접."}, {"term": "기하학적 좌절", "why_emerged": "모든 인접한 스핀이 반강자성 결합을 동시에 만족할 수 없는 구조적 제약을 설명하기 위해 필요.", "origin": "G. H. Wannier (1950년 triangular lattice antiferromagnet 연구).", "connections": "카고메 금속, 스핀 얼음, 전하 밀도 파동(CDW)."}], "english_summary": ["Investigates an S=1 kagome lattice system.", "Identifies the coexistence of a liquid-like disordered spin state and weak ferromagnetism.", "Provides insights into how geometric frustration and magnetic order interact in higher-spin systems."]}}, {"title": "Fractional high-Chern insulator in twisted rhombohedral graphene", "journal": "Nature", "source": "Gemini", "link": "https://www.nature.com/articles/s41586-026-10762-7", "authors": "Zexu Li, Wenxuan Wang, Fajie Wang, et al.", "last_authors": "Zhida Song, Xiaobo Lu", "summary": "A rich variety of both integer and fractional high-Chern insulators are observed in a moiré system composed of Bernal bilayer graphene and rhombohedral tetralayer graphene.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "High-impact experimental study of moiré systems and topological physics.", "tags": ["moiré", "graphene", "topological"], "image": "https://media.springernature.com/m685/springer-static/image/art%3A10.1038%2Fs41586-026-10762-7/MediaObjects/41586_2026_10762_Fig1_HTML.png", "briefing": {"background": "모아레 초격자(moiré superlattice) 시스템은 층간 비틀림 각도를 조절하여 전자 상관관계를 인위적으로 제어할 수 있게 함으로써, 강한 전자 상관관계와 위상적 물성을 연구하는 핵심 플랫폼으로 자리 잡았습니다.", "motivation": "베르날 이중층과 능면체 사중층 그래핀을 조합한 모아레 구조에서 나타나는 고-천(high-Chern) 위상 상태 및 분수 상태를 탐구하고자 합니다.", "result": "이 시스템에서 정수 및 분수 천 절연체(Fractional Chern Insulator)를 실험적으로 관측하였습니다.", "implication": "강한 상관관계와 위상적 밴드 구조가 결합하여 분수 양자 홀 효과와 유사한 물리적 현상이 0 자기장 근처에서도 구현될 수 있음을 시사합니다.", "novelty": "위상적 밴드 공학 및 모아레 시스템에서 분수 상태를 발견함으로써, 자기장이 없는 환경에서의 양자 통계 물리학 연구를 앞당겼습니다.", "unresolved": "분수 상태를 유도하는 구체적인 전자 상관관계의 상호작용 메커니즘과 그 안정성에 대해서는 정교한 이론적 모델링이 미흡합니다.", "future_work": "국소 상태 밀도 측정(STS)을 통한 위상 에지 모드의 직접적인 영상화 및 분수화된 준입자의 통계 특성 연구가 예상됩니다.", "concepts": [{"term": "분수 천 절연체", "why_emerged": "외부 자기장 없이도 분수 양자 홀 상태를 구현하기 위해 강한 상관관계와 위상적 밴드를 결합한 시스템.", "origin": "초록 정보만으로는 특정하기 어려움 (주요 이론가: Haldane, Qi 등).", "connections": "분수 양자 홀 효과, 모아레 그래핀, 위상 절연체."}, {"term": "모아레 초격자", "why_emerged": "이질적인 2D 층을 겹쳐 격자 상수를 키우고 전자 밴드를 평탄하게 만들어 상관관계 효과를 극대화하기 위해 필요.", "origin": "Bistritzer와 MacDonald (2011년 비틀린 이중층 그래핀 제안).", "connections": "꼬인 이중층 그래핀, 초전도성, 위상 물성."}], "english_summary": ["Explores moiré systems using Bernal bilayer and rhombohedral tetralayer graphene.", "Reports the observation of both integer and fractional high-Chern insulators.", "Demonstrates high-Chern number states in a tunable moiré platform.", "Advances the field of zero-magnetic-field topological physics."]}}, {"title": "Pseudo point nodal superconducting gap in spin-triplet UTe2", "journal": "Nature_Communications", "source": "Gemini", "link": "https://www.nature.com/articles/s41467-026-75566-9", "authors": "S. Hosoi, K. Imamura, M. M. Bordelon, et al.", "last_authors": "I. Vekhter, Y. Matsuda", "summary": "The authors report thermal conductivity measurements on UTe2 down to 50 mK. From the data, they argue that UTe2 exhibits a fully-gapped state with a pseudo point-nodal structure, where gap minima along the b axis approach but never reach zero.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Important study on unconventional superconductivity in a heavy fermion system with relevance to pairing symmetry.", "tags": ["superconductivity", "UTe2", "electronicstructure"], "image": "https://pubads.g.doubleclick.net/gampad/ad?iu=/285/nature_communications/article&sz=728x90&c=-1237100102&t=pos%3Dtop%26type%3Darticle%26artid%3Ds41467-026-75566-9%26doi%3D10.1038/s41467-026-75566-9%26subjmeta%3D1003,119,2792,301,639,766%26kwrd%3DSuperconducting+properties+and+materials,Topological+matter", "briefing": {"background": "UTe2는 중페르미온 시스템 중 초전도성과 자기적 변동이 강하게 결합된 후보 물질로, 특히 스핀-삼중항(spin-triplet) 초전도성 구현 가능성 때문에 큰 주목을 받고 있습니다.", "motivation": "열전도도 측정을 통해 UTe2의 초전도 갭 구조를 파악하고, 이것이 어떤 유형의 쌍을 이루는지 확인하고자 합니다.", "result": "열전도도 데이터 분석을 통해 UTe2가 완전한 갭(fully-gapped)을 가지며, b축 방향으로 gap minima가 존재하지만 0은 아닌 '유사 점 노드(pseudo point-nodal)' 구조를 가짐을 밝혔습니다.", "implication": "전통적인 노드 기반의 스핀-삼중항 모델과 달리, 이 물질의 초전도 상태는 독특한 갭 구조를 가짐을 시사합니다.", "novelty": "UTe2의 갭 구조를 구체화함으로써, 스핀-삼중항 초전도성 논쟁에 새로운 실험적 기준을 제시합니다.", "unresolved": "이러한 갭 구조가 왜 발생하는지에 대한 미시적 원리와 결정장 효과와의 연관성은 여전히 활발한 토론 대상입니다.", "future_work": "위상적 표면 상태와의 상관관계 및 초전도 상태의 고자기장 응답에 대한 추가 연구가 기대됩니다.", "concepts": [{"term": "스핀-삼중항 초전도성", "why_emerged": "스핀 대칭성이 깨진 초전도 상태를 설명하기 위해, 스핀 S=1인 쿠퍼 쌍 모델이 필요함.", "origin": "Leggett (1975년 He-3 superfluid 모델을 거시적 초전도에 적용).", "connections": "UTe2, 토폴로지 초전도체, 마요라나 준입자."}, {"term": "열전도도 측정", "why_emerged": "저온에서 준입자 여기 상태를 분석하여 초전도 갭의 노드 구조(노드가 0인지 아닌지)를 판단하기 위해 사용.", "origin": "Bardeen, Rickayzen, Tewordt (1959년 BCS 이론 기반의 열수송 모델).", "connections": "강상관 전자계, 초전도체 갭 분광학."}], "english_summary": ["Analyzes thermal conductivity in UTe2 at millikelvin temperatures.", "Proposes a fully-gapped state with pseudo point-nodal structures.", "Challenges conventional nodal models of triplet superconductivity in this compound."]}}, {"title": "Charged moiré phonons in twisted bilayer graphene", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/z93l-2chl", "authors": "Alejandro Ramos-Alonso, Héctor Ochoa", "last_authors": "Alejandro Ramos-Alonso, Héctor Ochoa", "summary": "Moiré phonons describe collective vibrations of a moiré superlattice produced by long-wavelength relative displacements of the constituent layers. Despite coming from the backfolding of the acoustic phonons of the individual layers, many of these modes become infrared active when the system is doped…", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Study of moiré phonons in twisted bilayer graphene, a key interest.", "tags": ["experiment", "graphene", "moire", "twistedbilayer", "phonons"], "image": "", "briefing": {"background": "모아레 초격자는 서로 다른 격자 상수를 가진 이층 물질이 겹쳐질 때 생기는 긴 파장의 주기적 패턴으로, 최근 트위스트 이층 그래핀(TBG) 등에서 강한 상관관계와 초전도 현상을 규명하는 핵심 플랫폼이 되었습니다.", "motivation": "모아레 초격자 내에서 발생하는 집단적 원자 진동 모드(모아레 포논)가 어떻게 전하와 결합하여 물리적 현상을 유도하는지 이론적으로 분석하고자 합니다.", "result": "도핑된 모아레 초격자에서 모아레 포논이 전하와 결합하여 적외선 활성(infrared active) 모드로 변환됨을 보였으며, 이는 평면 내 변위가 전하 밀도 변동을 유도함을 의미합니다.", "implication": "이 결과는 모아레 시스템에서 포논과 전자 간의 강한 결합을 실험적으로 탐지할 수 있는 광학적 척도를 제시하며, 초전도 메커니즘 규명에 중요한 단서가 됩니다.", "novelty": "기존의 격자 포논과는 다른 '모아레 규모'의 새로운 동역학 모드를 정의하고, 이를 전하와 결합하여 관측 가능한 형태로 제시했다는 점이 독창적입니다.", "unresolved": "실제 실험적 적외선 분광학 데이터와의 정량적 일치 여부와 특정 도핑 농도에서의 모드 분리 현상이 완전히 규명되지 않았습니다.", "future_work": "적외선 분광학 및 STM을 이용한 모아레 포논의 직접적인 관측 연구가 이어져야 합니다.", "concepts": [{"term": "모아레 포논", "why_emerged": "긴 파장의 모아레 격자로 인해 밴드 구조가 접히면서 새로운 저에너지 포논 모드가 형성되어 연구의 필요성이 대두됨.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "트위스트 이층 그래핀, 전자-포논 결합, 모아레 초격자 물성"}], "english_summary": ["Explores collective vibrational modes in moiré superlattices known as moiré phonons.", "Demonstrates that these modes become infrared active upon doping due to charge-phonon coupling.", "Suggests these modes can be used to probe electronic correlations in twisted bilayer graphene."]}}, {"title": "Effect of applied pressure on the nonrelativistic spin splitting of the altermagnet FeSb2: A first-principles study", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/ddf5-krnh", "authors": "Shalika R. Bhandari, R. Tamang, Keshav Shrestha, Samy Brahimi, Samir Lounis, D. P. Rai", "last_authors": "Samir Lounis, D. P. Rai", "summary": "We have investigated the pressure-dependent electronic structure, phonon stability, and anomalous Hall response of the recently discovered altermagnet FeSb 2 from density functional theory (DFT) and Wannier function analysis. From density functional perturbation theory (DFPT) calculations, we have found that FeSb 2 remains dynamically stable up to 10 GPa, evidenced by positive phonon frequencies. Our spin-polarized band structure reveals that the crossing nodes between the spin-up and spin-down bands near the Fermi energy occur precisely at the Γ and Z high-symmetry points. The Fermi crossing is mostly exhibited by band-24, band-25, and band-26. The nonrelativistic spin-splitting (NRSS) along M ′ - Γ -M and A-Z- A ′ high symmetry paths is attributed to the symmetry operation [ C 2 | | C 2 y t ] and broken time-reversal symmetry ( T ). Significant changes in the band structure are observed under applied pressure, as evidenced by the shift of the crossing node between bands 24 and 26 toward higher energies. The NRSS exhibited by band-24 along M ′ − Γ -M symmetry is notably small. Although the strength of NRSS associated with band-26 along the A-Z- A ′ path is substantial, it decreases under applied pressure. We have calculated and presented the anomalous Hall conductivity (AHC) over the energy range from − 1.5 to 1.5 eV. The pronounced positive AHC peak at ambient pressure becomes spectrally broadened, and changes sign at 10 GPa as a result of pressure-induced modifications to the band structure and the associated redistribution of Berry curvature near the Fermi level. Furthermore, we quantify the orbital magnetization within the modern theory framework, which reaches a magnitude of 0.29 μ B at zero pressure. Our results identify FeSb 2 as a tunable altermagnetic candidate, where applied pressure can modulate both topological transport and dynamical stability, opening new avenues for strain-engineered Hall responses in compensated magnetic systems.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "DFT study of altermagnet FeSb2 under pressure, including anomalous Hall response.", "tags": ["DFT", "altermagnetism", "anomalousHall", "electronicstructure"], "image": "", "briefing": {"background": "알터자성(altermagnetism)은 강자성과 반강자성의 중간적 성질을 띠며, 시간 반전 대칭이 깨져 있으면서도 자화가 상쇄되는 새로운 자기 질서 상태로 최근 응집물질물리학의 주요 화두입니다.", "motivation": "알터자성체 후보 물질인 FeSb2의 전자 구조와 자기적 특성이 외부 압력에 따라 어떻게 변하는지 DFT 계산을 통해 검증하고자 합니다.", "result": "FeSb2는 10 GPa 압력까지 동역학적으로 안정하며, 압력 인가 시 밴드 구조 변형으로 인해 이상 홀 효과(AHE)가 부호가 바뀌는 등 비자명한 변화를 보임을 확인했습니다.", "implication": "압력을 조절함으로써 알터자성의 스핀 분리 및 토폴로지 수송 현상을 엔지니어링할 수 있는 가능성을 제시합니다.", "novelty": "FeSb2를 압력 가변적인 알터자성 플랫폼으로 제안하였으며, 베리 곡률의 재분배를 통해 홀 전도성을 제어할 수 있음을 이론적으로 증명했습니다.", "unresolved": "압력 변화에 따른 실제 실험적 수송 현상 데이터와의 비교가 필요하며, 10 GPa 이상의 고압 영역에서의 안정성 여부가 불분명합니다.", "future_work": "FeSb2의 압력 하 고압 연구(고압-ARPES, 고압-홀 측정)를 통해 이론적 예측치를 검증해야 합니다.", "concepts": [{"term": "알터자성", "why_emerged": "강자성과 반강자성 범주에 들어가지 않는, 스핀-궤도 결합 없이도 스핀 분리가 일어나는 새로운 자기 질서 규명이 필요함.", "origin": "최근 1-2년 내 이론적으로 급부상, 특정 학파에 기인함.", "connections": "이상 홀 효과, 베리 곡률, 자기 위상 물질"}, {"term": "이상 홀 효과", "why_emerged": "자성 물질 내에서 전자의 베리 곡률로 인해 자기장 없이도 발생하는 수송 현상을 설명하기 위함.", "origin": "Hall (1879) 현상의 확장으로, Karplus-Luttinger (1954) 이론이 기초.", "connections": "Berry phase, Band topology"}], "english_summary": ["Investigates the pressure dependence of electronic structure and anomalous Hall response in the altermagnet FeSb2.", "Finds that pressure can tune the band crossing nodes and sign-invert the anomalous Hall conductivity.", "Confirms structural stability up to 10 GPa, highlighting potential for strain-engineered magnetic transport."]}}, {"title": "Emergent surface resonance from charge density wave symmetry breaking in TiSe2", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/lsxz-7hbr", "authors": "Turgut Yilmaz, Yi Sheng Ng, Muhammad Awais Fiaz, et al.", "last_authors": "Hui-Qiong Wang, Jin-Cheng Zheng", "summary": "Surface confined electronic states provide a fertile ground for discovering emergent phenomena that have no counterpart in the bulk, offering new routes to manipulate correlations, symmetry breaking, and dimensionality at the atomic scale. Here, we show that charge density wave (CDW) symmetry breaki…", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Study of CDW-induced symmetry breaking in a prominent transition metal dichalcogenide.", "tags": ["experiment", "material", "CDW"], "image": "", "briefing": {"background": "TiSe2는 전하 밀도파(CDW)가 발생하는 대표적인 전이금속 디칼코게나이드(TMDC) 물질로, 벌크와 표면에서 나타나는 전자 구조 변화는 상관관계 물성 연구의 핵심입니다.", "motivation": "TiSe2의 표면에서 발생하는 CDW 대칭성 깨짐이 전자 상태에 미치는 영향을 규명하고, 이것이 표면 공명 상태에 어떻게 기여하는지 분석하고자 합니다.", "result": "CDW로 인한 표면 대칭성 깨짐이 새로운 표면 공명 상태(surface resonance)를 생성하며, 이는 단순한 벌크의 투영 결과가 아닌 독특한 표면 기원의 현상임을 밝혀냈습니다.", "implication": "표면 밴드 구조를 통해 CDW의 위상(phase)과 대칭성 정보를 비파괴적으로 읽어낼 수 있는 가능성을 보여줍니다.", "novelty": "벌크 CDW 현상이 표면의 전자 구조와 어떻게 결합하여 새로운 준입자 상태를 만드는지 원자 규모에서 명확히 분리해냈습니다.", "unresolved": "해당 표면 공명 상태가 온도 변화나 도핑에 따라 어떻게 진화하는지에 대한 동역학적 정보는 부족합니다.", "future_work": "온도 가변 ARPES 및 STM/STS를 통해 CDW 전이 전후의 표면 상태 변화를 상세히 추적할 필요가 있습니다.", "concepts": [{"term": "전하 밀도파 (CDW)", "why_emerged": "저차원 금속 시스템에서 전자의 주기적 밀도 변화와 격자 왜곡이 결합하여 생기는 절연 상태를 설명하기 위해 도입됨.", "origin": "Peierls (1955)에 의해 1차원 금속에 대해 제안됨.", "connections": "페르미면 중첩, 격자 왜곡, 엑시톤 절연체"}, {"term": "표면 공명 상태", "why_emerged": "표면의 불연속성으로 인해 벌크 상태와 결합하면서 발생하는 전자 상태가 표면 물성을 지배하는 경우가 많아 연구됨.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "표면 물리학, ARPES, 국소 상태 밀도(LDOS)"}], "english_summary": ["Studies surface-confined electronic states emerging from CDW symmetry breaking in TiSe2.", "Identifies a specific surface resonance distinct from bulk projections.", "Provides insights into how structural and electronic symmetry breaking modulates surface states in TMDCs."]}}, {"title": "Low-temperature spin dynamics and absence of magnetic order in layered α−RuI3", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/kxbj-gp8z", "authors": "Hank C. H. Wu, Benjamin M. Huddart, Francis L. Pratt, Danrui Ni, Robert J. Cava, Stephen J. Blundell", "last_authors": "Robert J. Cava, Stephen J. Blundell", "summary": "Quantum spin liquids are long-sought for their elusive, never-frozen magnetic states. In layered α -RuI 3 , magnetic Ru ions form a honeycomb network related to the Kitaev material α -RuCl 3 , yet muon spin relaxation reveals a strikingly different low-temperature behaviour. The authors show here that the spins remain dynamically fluctuating down to 50 mK and find evidence for 2D spin diffusion, supporting the view that α -RuI 3 is a promising candidate for hosting a quantum spin liquid state.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Experimental study of a Kitaev candidate material with 2D spin liquid signatures.", "tags": ["experiment", "spinliquid", "Kitaevmaterial"], "image": "", "briefing": {"background": "양자 스핀 액체(QSL)는 극저온에서도 자기 질서가 형성되지 않고 양자 얽힘이 지배하는 상태로, 분자 스핀 액체 후보 물질인 Kitaev 물질 연구의 핵심입니다.", "motivation": "α-RuCl3가 성공적인 Kitaev 후보 물질로 알려진 것과 달리, 구조적으로 유사한 α-RuI3의 자성 동역학이 실제로는 어떤 상태인지 규명하고자 했습니다.", "result": "뮤온 스핀 완화(μSR) 실험을 통해 50 mK의 극저온까지 자기적 질서가 형성되지 않음을 발견했으며, 2차원 스핀 확산 거동을 확인했습니다.", "implication": "α-RuI3가 단순한 자성체가 아닌 양자 스핀 액체 후보군으로서 중요한 가치를 지님을 시사합니다.", "novelty": "Ru 기반 허니컴 격자에서 α-RuCl3와는 다른 스핀 동역학적 특성을 실증적으로 확인하여 스핀 액체 연구 범위를 확장했습니다.", "unresolved": "이 물질이 구체적으로 어떤 종류의 양자 스핀 액체 상태에 속하는지는 이론적으로 명확하지 않습니다.", "future_work": "중성자 산란 실험을 통한 스핀 여기 스펙트럼 분석 및 Kitaev 상호작용의 강도 측정.", "concepts": [{"term": "양자 스핀 액체", "why_emerged": "기본적인 자기 질서가 억제된 상황에서 양자 역학적 변동이 지배하는 상태를 탐색하기 위해 제안됨.", "origin": "Anderson (1973).", "connections": "Kitaev 모델, 고온 초전도체, 프러스트레이션 자성체."}, {"term": "μSR (뮤온 스핀 완화)", "why_emerged": "미세한 자기적 환경 변화와 동역학적 스핀 상태를 비파괴적으로 탐구하기 위해 개발됨.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "NMR, 중성자 산란, 자성체의 동역학 연구."}], "english_summary": ["Layered α-RuI3 is investigated using muon spin relaxation.", "The material shows no magnetic ordering down to 50 mK.", "Evidence for 2D spin diffusion is identified.", "α-RuI3 is suggested as a new candidate for a quantum spin liquid state."]}}, {"title": "Optical probing of Wigner crystallization in monolayer WSe2 via diffraction of longitudinal excitons", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/yt7r-p9jj", "authors": "Artem N. Abramov, Emil Chiglintsev, Tatiana Oskolkova, et al.", "last_authors": "Vasily Kravtsov, Ivan V. Iorsh", "summary": "Monolayer transition metal dichalcogenides (TMDs) are characterized by relatively large carrier effective masses and suppressed screening of the Coulomb interaction, which substantially enhances the correlation effects in these structures. The direct band gap enables effective optical probing of the…", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Experimental optical probing of Wigner crystallization in a monolayer TMD.", "tags": ["experiment", "2Dmaterials", "monolayer", "correlatedelectrons"], "image": "", "briefing": {"background": "전이금속 디칼코게나이드(TMD) 단층은 큰 유효 질량과 약한 스크리닝 효과로 인해 강한 전자 상관 관계를 보여, 위그너 결정(Wigner crystallization) 연구의 플랫폼으로 주목받습니다.", "motivation": "TMD 단층 내에서 전자 간 쿨롱 상호작용이 지배적인 상태인 위그너 결정을 광학적으로 탐지하고 그 특성을 확인하고자 했습니다.", "result": "종축 엑시톤(longitudinal excitons)의 회절 현상을 이용하여 2차원 전자계 내의 위그너 결정 형성을 광학적으로 탐지했습니다.", "implication": "복잡한 수송 측정 없이도 빛을 통해 강상관 전자 상태를 비파괴적으로 프로빙할 수 있는 가능성을 보여줍니다.", "novelty": "TMD의 밴드갭 특성을 활용하여 강상관 전자계의 위그너 결정화를 광학적 회절로 직접 증명했습니다.", "unresolved": "다양한 밀도 영역에서의 위그너 결정 안정성 및 위상 전이 경계에 대한 상세 지도는 여전히 과제입니다.", "future_work": "외부 자기장이나 층간 전위를 이용한 위그너 결정의 제어 및 동역학 연구.", "concepts": [{"term": "위그너 결정", "why_emerged": "낮은 밀도에서 쿨롱 상호작용이 운동 에너지를 압도할 때 전자들이 격자 형태로 배열되는 상태를 설명하기 위해 제안됨.", "origin": "Eugene Wigner (1934).", "connections": "강상관 전자계, 2D 물질, 분수 양자 홀 효과."}, {"term": "TMD (전이금속 디칼코게나이드)", "why_emerged": "반도체 성질과 강한 스핀-궤도 결합을 가진 2D 물질로서 새로운 밴드 구조 물리학을 탐색하기 위해 연구됨.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "MoS2, WSe2, 모아레 격자, 엑시톤 물리학."}], "english_summary": ["Monolayer WSe2 exhibits strong electronic correlations due to suppressed screening.", "The study utilizes optical diffraction of longitudinal excitons.", "Wigner crystallization is detected via this optical probe.", "This provides a non-invasive tool to study correlated electron phases in TMDs."]}}, {"title": "Pseudogap and strange metal states in the square-lattice Hubbard model: A comprehensive study", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/4kld-1x5d", "authors": "Arata Tanaka", "last_authors": "Arata Tanaka", "summary": "To clarify the origin of the pseudogap and strange metal states as well as their mutual relationship in cuprate superconductors, a comprehensive study on the spectral function, Fermi surface, resistivity, and dynamical spin susceptivity of the Hubbard model on the square lattice has been conducted b…", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Theoretical study of pseudogap and strange metal in cuprates, relevant for electronic structure.", "tags": ["theory", "cuprates", "superconductivity", "Hubbardmodel", "Fermisurface"], "image": "", "briefing": {"background": "구리 산화물 초전도체(cuprates)에서 관측되는 가짜 갭(pseudogap)과 기묘한 금속(strange metal) 상태는 페르미 액체 이론을 벗어나는 난제로, 강상관 물리 연구의 핵심입니다.", "motivation": "허바드 모델(Hubbard model)을 기반으로 가짜 갭과 기묘한 금속 상태의 미시적 기원과 이들 간의 상관관계를 이론적으로 규명하고자 했습니다.", "result": "스펙트럼 함수, 페르미 면, 저항률, 스핀 감수성을 포괄적으로 분석하여 두 현상의 연관성을 도출했습니다.", "implication": "구리 산화물의 복잡한 상도(phase diagram)를 단일 허바드 모델 체계에서 통합적으로 이해할 수 있는 단서를 제공합니다.", "novelty": "종합적인 수치 계산을 통해 가짜 갭과 기묘한 금속 상태를 하나의 이론적 프레임워크 내에서 분석한 점이 중요합니다.", "unresolved": "계산 모델의 한계로 인해 실험에서 관측되는 초전도 상태와의 완벽한 정량적 일치는 여전히 연구가 필요합니다.", "future_work": "도핑 변화에 따른 더 정밀한 위상 분석 및 비고전적 초전도 기제와의 구체적 비교.", "concepts": [{"term": "가짜 갭 (Pseudogap)", "why_emerged": "초전도 임계 온도 이상에서 페르미 면의 일부분이 사라지며 상태 밀도가 감소하는 현상을 설명하기 위해 도입됨.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "Cuprates, 스핀 밀도파, 페르미 면 재구성."}, {"term": "기묘한 금속 (Strange Metal)", "why_emerged": "온도에 비례하는 선형 저항이 관측되는, 기존 금속 이론(페르미 액체)으로 설명되지 않는 금속 상태를 지칭.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "양자 임계점, 강상관 전자계, 비-페르미 액체."}], "english_summary": ["The square-lattice Hubbard model is used to investigate the pseudogap and strange metal phases.", "Comprehensive analysis of spectral functions, resistivity, and spin susceptibility is performed.", "The study provides a unified framework to understand the origin of these non-Fermi liquid states.", "This offers deeper insights into the phase diagram of cuprate superconductors."]}}, {"title": "Skyrmion generation via Laguerre-Gaussian beam irradiation in frustrated magnets", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/9d9c-clp5", "authors": "Reivienne Jei Laxamana, Satoru Hayami", "last_authors": "Reivienne Jei Laxamana, Satoru Hayami", "summary": "Since their discovery, the study of magnetic skyrmions has been on the rise. In this paper, we discuss our investigations on the light-induced mechanisms for skyrmion generation in a centrosymmetric triangular magnetic lattice with competing ${J}_{1}\\text{−}{J}_{3}$ interactions, and easy-axis aniso…", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Theory on light-induced skyrmion generation in frustrated magnets, relevant to magnetic textures.", "tags": ["skyrmions", "magnetism", "frustratedmagnets", "optics"], "image": "", "briefing": {"background": "자기 스카이르미온(Skyrmion)은 위상학적으로 안정된 자기 소용돌이 구조로, 차세대 정보 저장 및 처리를 위한 정보 단위로 주목받고 있습니다. 주로 Dzyaloshinskii-Moriya 상호작용이 지배적인 비중심대칭 물질에서 연구되어 왔으나, 최근에는 좌절된 자성체(frustrated magnets)에서의 생성 기전이 연구의 핵심으로 떠올랐습니다.", "motivation": "외부 자기장 외에 빛(레이저)을 이용해 비중심대칭 자성체에서 스카이르미온을 효율적으로 생성하거나 제어할 수 있는 물리적 메커니즘을 밝히고자 합니다.", "result": "Laguerre-Gaussian 빔의 궤도 각운동량을 활용하여 J1-J3 상호작용과 자기 이방성을 가진 삼각형 격자에서 스카이르미온을 생성할 수 있음을 이론적으로 규명했습니다.", "implication": "빛의 위상학적 특성을 이용해 자기적 정보를 초고속으로 제어할 수 있는 '광-스핀트로닉스' 소자 개발의 이론적 토대를 제공합니다.", "novelty": "외부 자기장의 정적 제어에서 벗어나, 광학적 각운동량을 이용해 동적으로 위상학적 자기 구조를
