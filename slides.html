<title>Daily Paper Slideshow</title>
<style>
  :root {
    color-scheme: light;
    --bg: #f6f7f4;
    --paper: #ffffff;
    --ink: #111827;
    --muted: #64748b;
    --line: #d8ddd2;
    --accent: #176b87;
    --accent-2: #9a3412;
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; overflow: auto; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: var(--bg); color: var(--ink); }
  .shell { max-width: 1500px; min-height: 100vh; margin: 0 auto; padding: 14px 18px; display: flex; flex-direction: column; }
  .topbar { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 16px; }
  .top-actions { display: flex; align-items: center; gap: 10px; }
  .topbar a, button { border: 1px solid var(--line); border-radius: 8px; background: var(--paper); color: var(--ink); padding: 10px 14px; font-weight: 700; text-decoration: none; cursor: pointer; }
  button.primary { background: var(--accent); border-color: var(--accent); color: white; }
  button:disabled { opacity: 0.45; cursor: not-allowed; }
  .counter { color: var(--muted); font-weight: 700; }
  .slide { min-height: calc(100vh - 82px); background: var(--paper); border: 1px solid var(--line); border-radius: 10px; padding: 18px; box-shadow: 0 18px 42px rgba(15, 23, 42, 0.10); display: grid; grid-template-columns: minmax(310px, 0.86fr) minmax(0, 1.55fr); gap: 18px; overflow: visible; }
  .paper-head { min-width: 0; min-height: 0; overflow: visible; display: flex; flex-direction: column; gap: 12px; }
  .figure { margin: 0; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: #f8fafc; }
  .figure img { display: block; width: 100%; max-height: 41vh; object-fit: contain; background: white; }
  .figure figcaption { padding: 7px 10px; color: var(--muted); font-size: 12px; line-height: 1.3; }
  .head-text { display: flex; flex-direction: column; gap: 9px; min-width: 0; }
  .badges { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .badge { border-radius: 999px; padding: 5px 9px; background: #eef2ff; color: #3730a3; font-size: 12px; font-weight: 800; }
  .score { background: #fee2e2; color: #991b1b; }
  h1 { margin: 0; font-size: 25px; line-height: 1.15; letter-spacing: 0; overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
  h1 a { color: inherit; text-decoration-color: rgba(23, 107, 135, 0.35); text-decoration-thickness: 2px; text-underline-offset: 4px; }
  h1 a:hover { color: var(--accent); text-decoration-color: var(--accent); }
  .meta, .authors, .why, .abstract { font-size: 13px; line-height: 1.45; }
  .meta, .authors { color: var(--muted); }
  .why strong, .abstract strong, .authors strong { color: var(--ink); }
  .authors { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .why { border-left: 4px solid var(--accent-2); padding-left: 10px; color: #374151; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .abstract { border-top: 1px solid var(--line); padding-top: 14px; color: #374151; }
  .original-abstract { border-top: 1px solid var(--line); padding-top: 10px; color: #374151; font-size: 11.5px; line-height: 1.35; overflow-wrap: anywhere; }
  .original-abstract strong { display: block; margin-bottom: 4px; color: var(--ink); }
  .tags { display: flex; flex-wrap: wrap; gap: 8px; }
  .tag { border-radius: 999px; padding: 4px 8px; background: #f1f5f9; color: #475569; font-size: 12px; font-weight: 700; }
  .head-text > .link { display: none; }
  .briefing { min-width: 0; min-height: 0; overflow: visible; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); grid-auto-rows: minmax(0, auto); align-content: start; gap: 11px 18px; border-top: 0; padding-top: 0; }
  .brief-section { min-width: 0; }
  .brief-section.wide { grid-column: 1 / -1; }
  .brief-section h2 { margin: 0 0 4px; font-size: 14px; line-height: 1.22; color: #0f766e; letter-spacing: 0; }
  .brief-section p, .brief-section li { margin: 0; font-size: 12.5px; line-height: 1.42; color: #1f2937; overflow-wrap: anywhere; }
  .brief-section ul { margin: 0; padding-left: 20px; }
  .concepts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 9px 14px; }
  .concept { border-top: 1px solid var(--line); padding-top: 7px; }
  .concept h3 { margin: 0 0 4px; font-size: 13px; color: #7c2d12; letter-spacing: 0; }
  .concept p { margin: 2px 0 0; font-size: 11.5px; line-height: 1.35; color: #374151; overflow-wrap: anywhere; }
  .concept b { color: #111827; }
  .link { color: var(--accent); font-weight: 800; text-decoration: none; }
  .empty { padding: 48px; background: var(--paper); border: 1px solid var(--line); border-radius: 12px; color: var(--muted); }
  @media (max-width: 860px) {
    .shell { padding: 14px; }
    .topbar, .top-actions { align-items: stretch; flex-direction: column; }
    .slide, .briefing, .concepts { grid-template-columns: 1fr; }
    .slide { min-height: auto; overflow: visible; display: grid; }
    h1 { font-size: 28px; }
  }
</style>

<script>
const slides = [{"title": "Berry-curvature-driven anomalous Hall and Nernst effects in the kagome permanent magnets RCo5", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/jhff-xgwg", "authors": "Weian Guo, Pengyu Zheng, Rui Liu, Yiran Peng, Ying Yang, Zhiping Yin", "last_authors": "Ying Yang, Zhiping Yin", "summary": "Kagome lattice materials have attracted considerable attention due to their intriguing topological properties and potential applications in next-generation quantum and spintronic technologies. In particular, rare-earth permanent magnets with kagome structure provide an ideal platform that combines r…", "tier": "A_MUST_READ", "score": "9", "reason": "Kagome magnets, Berry curvature, and anomalous Hall effect are strong user interests.", "tags": ["kagome", "anomalous_Hall", "Berry_curvature", "magnetic_material", "topological_material"], "image": "", "briefing": {"background": "카고메 격자 구조는 이론적으로 플랫 밴드, 디락 점, 반 호브 특이점을 포함하여 강력한 전자 상관관계와 위상학적 현상을 동시에 연구할 수 있는 플랫폼입니다. 특히 자성을 띠는 카고메 물질은 비정상 홀 효과(AHE)나 비정상 네른스트 효과(ANE)와 같은 위상 수송 현상을 연구하는 데 매우 중요합니다.", "motivation": "희토류-코발트계 영구자석인 RCo5 화합물은 산업적으로 널리 사용되지만, 이들의 카고메 격자 구조에서 기인하는 베리 곡률(Berry curvature)이 수송 특성에 구체적으로 어떤 영향을 주는지에 대해서는 이해가 부족했습니다.", "result": "연구진은 RCo5 시스템에서 AHE와 ANE가 외인성 산란보다는 베리 곡률에 의한 내인성(intrinsic) 기여에 의해 지배된다는 것을 밝혀냈습니다. 특히 이 물질들이 가지는 강력한 자성과 카고메 밴드 구조가 결합되어 거대한 위상 수송 계수를 나타냄을 확인했습니다.", "implication": "전통적인 영구자석 소재가 고성능 위상 물질로서의 잠재력을 가지고 있음을 시사하며, 이는 에너지 하베스팅(열전 효과)이나 스핀트로닉스 소자 설계에 새로운 경로를 제시합니다.", "novelty": "사용자의 주요 관심사인 카고메 금속과 베리 곡률 기반 수송 현상을 연결하는 연구입니다. 기존의 순수 물리적 관심 대상이었던 카고메 물질을 실제 산업용 영구자석(RCo5) 시스템으로 확장했다는 점이 독창적입니다.", "unresolved": "다양한 희토류 원소(R)의 종류에 따라 국소 모멘트와 카고메 전도 전자 간의 상호작용이 구체적으로 어떻게 변하는지에 대한 상세한 연구가 더 필요합니다.", "future_work": "ARPES를 통한 직접적인 카고메 밴드 및 베리 곡률 매핑 연구가 기대되며, 이를 통해 이론적 예측과 실험적 수송 계수 사이의 정량적 일치를 확인할 필요가 있습니다.", "concepts": [{"term": "카고메 격자 (Kagome Lattice)", "why_emerged": "기하학적 좌절(frustration)과 특이한 밴드 구조를 동시에 구현하기 위해 도입되었습니다.", "origin": "전통적인 일본 바구니 패턴에서 유래, 고체물리에서는 1951년 Syozi에 의해 제안됨.", "connections": "플랫 밴드, 디락 페르미온, 스핀 액체, 비정상 홀 효과."}, {"term": "베리 곡률 (Berry Curvature)", "why_emerged": "파동함수의 위상학적 성질이 전자의 운동에 미치는 유효 자기장을 설명하기 위해 필요합니다.", "origin": "1984년 Michael Berry에 의해 제안된 베리 위상의 미분 형태.", "connections": "비정상 홀 효과, 위상 절연체, 바일 반금속."}, {"term": "비정상 네른스트 효과 (ANE)", "why_emerged": "온도 구배에 의해 자성체에서 수직 방향으로 전압이 발생하는 현상을 설명하기 위해 연구됩니다.", "origin": "1880년대 Ettingshausen과 Nernst에 의해 발견된 효과의 자성체 버전.", "connections": "열전 효과, 비정상 홀 효과, 스핀 제베크 효과."}, {"term": "영구자석 (Permanent Magnet)", "why_emerged": "외부 자기장 없이도 강한 자성을 유지하는 소재가 모터나 발전기 등에 필수적이기 때문입니다.", "origin": "천연 자석에서 시작하여 현대의 희토류 화합물로 발전.", "connections": "강자성, 결정자기 이방성, 보자기력."}], "english_summary": ["Investigates the anomalous Hall and Nernst effects in RCo5 kagome permanent magnets.", "Identifies that the topological transport is primarily driven by intrinsic Berry curvature.", "Links industrial magnetic materials with fundamental kagome lattice physics.", "Suggests potential for high-performance topological spintronics and energy harvesting."]}}, {"title": "Hierarchy of quantum corrections to resistivity of a γ−Al2O3/SrTiO3 two-dimensional electron gas", "journal": "PRB_Recent", "source": "author whitelist", "link": "http://link.aps.org/doi/10.1103/6xfk-zwrl", "authors": "Jiwon Yang, Akira Endo, Daisuke Shiga, et al.", "last_authors": "Hiroshi Kumigashira, Mikk Lippmaa", "summary": "A resistance upturn that occurs in SrTiO 3 -based two-dimensional electron gases at low temperatures is often attributed to Kondo scattering of carriers from localized spins. We show that the low-temperature transport behavior of the electron gas that forms at the γ − Al 2 O 3 / SrTiO 3 interface is governed by a whole hierarchy of quantum corrections in addition to the Kondo contribution. Upon cooling, the resistance shows a typical Kondo-like upturn, but then decreases due to weak antilocalization, and finally vanishes at the superconducting transition. When superconductivity is suppressed by applying a magnetic field or by reducing the carrier density, a logarithmic correction due to electron-electron interactions appears at millikelvin temperatures. These results show that the low-temperature resistance behavior cannot be accounted for by a Kondo-only interpretation, but requires consideration of several quantum corrections.", "tier": "A_MUST_READ", "score": "9", "reason": "author whitelist: Daisuke Shiga", "tags": ["Kondo", "transport"], "image": "", "briefing": {"background": "SrTiO3(STO) 기반의 2차원 전자 가스(2DEG)는 초전도성, 자기 저항, 그리고 근원적인 물리 계층 구조를 연구하기에 매우 적합한 시스템입니다. 특히 낮은 온도에서 나타나는 저항의 상승(upturn) 현상은 전통적으로 콘도 효과(Kondo effect)로 설명되어 왔습니다.", "motivation": "STO 기반 2DEG의 저온 수송 특성이 단순히 콘도 효과 때문인지, 아니면 다른 양자 보정 효과들이 복합적으로 작용하는 것인지 명확히 규명하고자 했습니다.", "result": "γ-Al2O3/SrTiO3 계면의 저항 행동이 콘도 산란뿐만 아니라, 약한 안티로컬라이제이션(WAL), 그리고 밀리켈빈 온도에서의 전자-전자 상호작용(Altshuler-Aronov) 보정에 의한 계층적 구조를 가짐을 입증했습니다. 즉, 온도가 내려감에 따라 저항이 올라갔다가 WAL에 의해 다시 내려가고, 최종적으로 초전도 전이로 사라지는 복잡한 거동을 보입니다.", "implication": "STO 기반 산화물 계면 연구에서 저온 저항 상승을 무조건 콘도 효과로만 해석해서는 안 되며, 다양한 양자 간섭 효과를 동시에 고려해야 함을 시사합니다.", "novelty": "저항 upturn 현상을 다각적인 양자 보정 이론으로 분해하여 설명함으로써, STO 2DEG의 수송 물리에 대한 정교한 이해를 제공합니다. 저자의 화이트리스트(Daisuke Shiga) 연구로 신뢰도가 높습니다.", "unresolved": "콘도 산란을 일으키는 국소 스핀의 실제 물리적 기원(예: 산소 빈자리 등)을 직접적으로 증명하는 과제가 남아 있습니다.", "future_work": "게이트 전압 조절이나 산소 분압 제어를 통해 각 양자 보정 항의 강도를 독립적으로 조절하는 실험이 필요합니다.", "concepts": [{"term": "2차원 전자 가스 (2DEG)", "why_emerged": "계면이나 박막 구조에서 전자의 운동을 2차원으로 제한하여 새로운 양자 현상을 관찰하기 위해 생성됩니다.", "origin": "반도체 헤테로 구조(GaAs/AlGaAs)에서 처음 정립됨.", "connections": "양자 홀 효과, 모스펫(MOSFET), 산화물 계면 물리."}, {"term": "콘도 효과 (Kondo Effect)", "why_emerged": "금속 내의 자성 불순물이 전도 전자와 상호작용하여 저온에서 저항이 증가하는 현상을 설명하기 위해 등장했습니다.", "origin": "1964년 Jun Kondo가 이론적으로 설명.", "connections": "스핀 산란, 강상관 전자계, 단일 단자 분자 소자."}, {"term": "약한 안티로컬라이제이션 (WAL)", "why_emerged": "강한 스핀-궤도 결합이 있는 시스템에서 양자 간섭에 의해 전도성이 향상되는 현상을 설명합니다.", "origin": "1980년대 초반 양자 보정 이론의 발전과 함께 정립됨.", "connections": "스핀-궤도 결합, 위상 절연체, 위크 로컬라이제이션."}, {"term": "Altshuler-Aronov 효과", "why_emerged": "무질서한 금속에서 전자 간의 쿨롱 상호작용이 상태 밀도를 변화시켜 저항에 미치는 영향을 설명하기 위해 제안되었습니다.", "origin": "1979년 B. L. Altshuler와 A. G. Aronov에 의해 제안됨.", "connections": "전자-전자 상호작용, 무질서계, 양자 보정."}], "english_summary": ["Reveals a hierarchy of quantum corrections to resistivity in γ-Al2O3/SrTiO3 2DEG.", "Identifies contributions from Kondo scattering, weak antilocalization, and electron-electron interactions.", "Challenges the simplified Kondo-only interpretation of low-temperature resistance upturns.", "Demonstrates the interplay between multiple quantum effects and superconductivity in oxide interfaces."]}}, {"title": "Momentum dependent spin-density-wave gaps in bilayer and trilayer nickelates", "journal": "PRB_Recent", "source": "author whitelist", "link": "http://link.aps.org/doi/10.1103/sbk6-zh3b", "authors": "Jun Shu, Jun Shen, Xiaoxiang Zhou, et al.", "last_authors": "Dong-Lai Feng, Ge He", "summary": "Resolving where a density-wave gap opens in momentum space is pivotal for identifying the microscopic origin of instabilities in layered nickelates. Using polarization- and symmetry-resolved electronic Raman scattering, we map the momentum dependence of the spin-density-wave (SDW) gap in trilayer ${…", "tier": "A_MUST_READ", "score": "9", "reason": "author whitelist: Dong-Lai Feng", "tags": ["nickelate"], "image": "", "briefing": {"background": "니켈레이트(Nickelates)는 구리 산화물 초전도체(Cuprates)와 유사한 전자 구조를 가져 고온 초전도 기전을 이해하는 핵심 물질로 주목받고 있습니다. 최근 무한 층상(infinite-layer) 및 층상(layered) 니켈레이트에서 초전도가 발견되면서 그 연구 가치가 더욱 높아졌습니다.", "motivation": "이층(bilayer, La3Ni2O7) 및 삼층(trilayer, La4Ni3O10) 니켈레이트에서 나타나는 스핀 밀도 파동(SDW) 갭의 운동량 공간 분포를 정밀하게 파악하여 전자적 불안정성의 기원을 이해하고자 했습니다.", "result": "라만 산란(Raman scattering) 실험을 통해 니켈레이트의 SDW 갭이 운동량 공간에서 특정한 방향성을 가지고 열린다는 것을 확인했습니다. 특히 편광 및 대칭 분석을 통해 갭의 크기와 분포를 매핑하는 데 성공했습니다.", "implication": "SDW 갭의 운동량 의존성은 페르미면 네스팅(nesting)이나 특정 전자 상관관계의 역할을 암시하며, 이는 향후 압력 하에서 나타나는 초전도 상태와의 경쟁 또는 공존 관계를 규명하는 기초 he understanding of Berry curvature and antiferromagnetic domain physics. Here, we focus on a noncollinear antiperovskite antiferromagnet Mn 3 NiN as a model system, successfully grown as a single-crystal epitaxial thin film. Combining multiple experiments supported by theoretical calculations, we probe the Berry curvature associated with antiferromagnetic Γ 4g domains in Mn 3 NiN and its strong connection to an AHE. We directly image the antiferromagnetic domains driving the intrinsic Berry curvature with high-resolution Sagnac MOKE (magneto-optical Kerr-effect) microscopy, controlling spatial distribution and dynamics by varying temperature and applied magnetic fields. Our findings provide critical advancement of the fundamental understanding and wide tunability of Berry curvature in noncollinear antiferromagnets important for realization in potential spintronic applications.", "tier": "B_IMPORTANT_CONDMAT", "score": "9", "reason": "Direct relevance to Berry curvature, anomalous Hall effect, and noncollinear antiferromagnets.", "tags": ["material", "Berrycurvature", "anomalousHall"], "image": "", "briefing": {"background": "비공선형 반강자성체(noncollinear antiferromagnets)는 자성 구조의 대칭성으로 인해 강자성체와 유사한 수송 특성(이상 홀 효과, AHE)을 나타낼 수 있어, 차세대 스핀트로닉스 분야에서 매우 중요한 연구 대상입니다.", "motivation": "반강자성 도메인과 베리 곡률의 상관관계를 직접 영상화하고, 이를 통해 비공선형 반강자성체의 AHE를 제어하는 메커니즘을 규명하고자 합니다.", "result": "Mn3NiN 박막을 제작하여, Sagnac MOKE 현미경을 통해 반강자성 Γ4g 도메인이 유도하는 베리 곡률과 이상 홀 효과의 직접적인 상관관계를 확인했습니다.", "implication": "반강자성 소자의 도메인 제어가 가능함을 보였으며, 이는 베리 곡률을 활용한 자성 스위칭 소자 개발의 핵심적인 근거를 제공합니다.", "novelty": "비공선형 반강자성 도메인을 직접 시각화하고, 베리 곡률과의 연관성을 정량적으로 연결했다는 점에서 학술적 가치가 높습니다.", "unresolved": "고온 환경에서의 도메인 안정성 및 대면적 소자 구현 시 발생하는 결함 문제에 대한 추가적인 논의가 필요합니다.", "future_work": "전기적 펄스를 이용한 도메인 스위칭 구현 및 실제 소자 동작 환경에서의 위상 물성 최적화 연구가 예상됩니다.", "concepts": [{"term": "이상 홀 효과 (AHE)", "why_emerged": "자성체에서 자기장에 의한 정상 홀 효과 외에 자화 자체에 기인한 전압 출력을 이해하기 위함.", "origin": "Edwin Hall (1881년 처음 발견).", "connections": "베리 곡률, 스핀-궤도 결합, 카이랄 자성."}, {"term": "비공선형 반강자성체", "why_emerged": "스핀이 일직선으로 정렬되지 않아 고유한 위상학적 특성을 보이는 자성체를 탐색하기 위함.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "Mn3NiN, 안티페로브스카이트, 베리 곡률."}], "english_summary": ["Direct imaging of antiferromagnetic domains in Mn3NiN is achieved using Sagnac MOKE.", "The study reveals the intrinsic link between antiferromagnetic Γ4g domains and Berry curvature-induced anomalous Hall effect.", "The findings provide a pathway for controlling transport properties in noncollinear antiferromagnetic spintronic devices."]}}, {"title": "Antidots measure anyonic charge in graphene", "journal": "Nature_Physics", "source": "Gemini", "link": "https://www.nature.com/articles/s41567-026-03428-8", "authors": "Authors not available in source RSS", "last_authors": "", "summary": "Anyons are fractionally charged quasiparticles of the quantum Hall effect, and could one day power topological quantum computers. Trapping and measuring anyons remains difficult, but quasiparticle charges have now been measured using a gate-defined antidot in bilayer graphene. For hole-conjugate states, the parity of downstream integer edge modes sets the observed charge.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Quantum Hall anyon study in graphene; directly matches user's interest in QH and 2D materials.", "tags": ["transport", "graphene", "quantumHall"], "image": "https://media.springernature.com/m685/springer-static/image/art%3A10.1038%2Fs41567-026-03428-8/MediaObjects/41567_2026_3428_Fig1_HTML.png", "briefing": {"background": "양자 홀 효과(Quantum Hall Effect) 시스템에서는 분수 전하를 가진 준입자인 애니온(anyon)이 존재하며, 이는 위상 양자 컴퓨터의 핵심 요소로 주목받고 있습니다.", "motivation": "기존에는 이 애니온의 전하를 직접적으로 포착하고 측정하는 데 큰 어려움이 있었으며, 이를 효과적으로 측정하기 위한 플랫폼이 필요했습니다.", "result": "이중층 그래핀(bilayer graphene)에 게이트로 정의된 '안티도트(antidot)' 구조를 설계하여 애니온의 분수 전하를 성공적으로 측정했습니다.", "implication": "홀 공액 상태(hole-conjugate states)에서 하류로 흐르는 정수 에지 모드(integer edge modes)의 패리티가 관측되는 전하를 결정함을 증명하여, 2D 재료에서의 위상적 준입자 제어 기술을 확보했습니다.", "novelty": "그래핀이라는 잘 제어된 시스템에서 안티도트라는 도구를 활용해 위상적 분수 전하를 직접 측정한 점이 중요하며, 이는 나아가 위상 양자 연산의 실현 가능성을 높입니다.", "unresolved": "안티도트 구조 내에서의 미세한 정전기적 포텐셜 분포가 에지 상태의 결맞음성에 미치는 영향은 추가 규명이 필요합니다.", "future_work": "안티도트를 다중으로 연결하여 애니온의 통계적 특성(braiding)을 직접 관측하거나 양자 얽힘을 제어하는 실험이 뒤따를 것으로 보입니다.", "concepts": [{"term": "애니온 (Anyon)", "why_emerged": "2차원 시스템에서 입자 교환 시 페르미온이나 보존과 다른 위상적 위상(phase)을 가지는 입자의 필요성 때문입니다.", "origin": "Leinaas와 Myrheim (1977)에 의해 이론적으로 제안되었습니다.", "connections": "분수 양자 홀 효과, 위상 양자 컴퓨터, 복소 평면 위상."}, {"term": "안티도트 (Antidot)", "why_emerged": "2차원 전자 가스 내에 작은 구멍을 만들어 국소적인 터널링이나 에지 상태 간섭을 유도하기 위해 필요합니다.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "Aharonov-Bohm 효과, 에지 상태 터널링, 양자 간섭."}], "english_summary": ["Anyons with fractional charge represent key building blocks for topological quantum computing.", "Researchers utilized a gate-defined antidot in bilayer graphene to measure these quasiparticles.", "The charge parity is determined by the downstream integer edge modes in hole-conjugate states.", "This experiment demonstrates a controlled platform for investigating topological phases in 2D materials."]}}, {"title": "La substitution studies on the heavy-fermion superconductor CeRh2As2", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/f79y-ssdx", "authors": "Sushma Lakshmi Ravi Sankar, Manuel Brando, Jochen Wosnitza, Seunghyun Khim", "last_authors": "Jochen Wosnitza, Seunghyun Khim", "summary": "CeRh 2 As 2 has been receiving considerable attention due to its unusual two-phase superconductivity. The superconducting (SC) phase appears at T c = 0.35 K in an ordered state (phase I) of the Ce − 4 f moments, which develops below T 0 = 0.55 K. The microscopic nature of phase I has not been fully established yet. We report a single-crystal study of the effect of La substitution on these low-temperature phases in Ce 1 − x La x Rh 2 As 2 up to x = 0.1 . The lattice parameters increase monotonically with x , corresponding to an effective negative pressure of approximately − 0.3 GPa for x = 0.1 . While the Ce 3 + local valence state and the non-Fermi-liquid behavior are preserved, the resistivity coherence maximum T max * ≈ 45 K in the pristine sample shifts to lower temperatures with increasing x , indicating a suppression of the Kondo energy scale upon lattice expansion. On the other hand, both T c and T 0 are rapidly suppressed to below 0.1 K for x > 0.05 . Notably, such a rapid decrease of T c under moderate negative pressure is unexpected, but is rather consistent with a substitution-induced disorder effect which leads to strong pair breaking in unconventional superconductors. The observed fragility of phase I under both pressure and disorder may imply its itinerant origin.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Experimental study on heavy-fermion superconductor CeRh2As2, relevant to unconventional superconductivity.", "tags": ["heavy_fermion", "unconventional_superconductivity", "experiment"], "image": "", "briefing": {"background": "CeRh2As2는 희토류 기반 중페르미온 물질로, 두 개의 서로 다른 초전도 상(superconducting phases)이 공존하는 매우 특이한 현상을 보여 물리학계의 큰 주목을 받고 있습니다.", "motivation": "이 물질에서 나타나는 위상 I(Phase I)의 미시적 기원과 초전도 상태의 결합 원리를 밝히기 위해 화학적 치환 효과를 조사하고자 했습니다.", "result": "란타넘(La)을 Ce 자리에 치환하여 격자 상수를 늘리는 실험(음의 압력 효과)을 수행한 결과, Kondo 에너지 스케일이 낮아지고 초전도 전이 온도(Tc)와 자기적 질서 온도(T0)가 급격히 억제됨을 확인했습니다.", "implication": "이러한 결과는 해당 상이 단순히 정적인 국소 모드에 기반한 것이 아니라, 전자적 유동성(itinerant origin)을 띠고 있으며 불순물에 매우 취약하다는 것을 강력하게 시사합니다.", "novelty": "CeRh2As2의 두 위상 초전도성이라는 미해결 난제에 대해 치환 실험을 통한 실험적 증거를 제시하였으며, 비전통적 초전도체에서의 불순물 효과를 명확히 보여주었습니다.", "unresolved": "두 개의 초전도 상이 공존하는 근본적인 메커니즘과, 각 상의 정확한 대칭성(order parameter symmetry)은 여전히 논쟁의 중심에 있습니다.", "future_work": "보다 정밀한 극저온 열용량 측정이나 RIXS 혹은 ARPES를 통해 페르미 표면의 변화를 직접 추적하는 후속 연구가 필요합니다.", "concepts": [{"term": "중페르미온 (Heavy-fermion)", "why_emerged": "f-전자와 전도 전자 사이의 강한 Kondo 상호작용으로 인해 유효 질량이 극도로 커지는 현상을 설명하기 위해 필요합니다.", "origin": "1970년대 후반부터 실험적으로 발견 및 체계화되었습니다.", "connections": "Kondo 격자 모델, 비페르미 액체, 비전통적 초전도성."}, {"term": "Kondo 에너지 스케일", "why_emerged": "자기 불순물과 전도 전자 사이의 산란이 결맞음 상태로 전이되는 특성 온도를 정의하기 위해 필요합니다.", "origin": "Jun Kondo (1964)의 이론적 접근이 시초입니다.", "connections": "Kondo 효과, 페르미 액체 이론, 자기적 질서의 억제."}], "english_summary": ["CeRh2As2 exhibits unusual two-phase superconductivity in a heavy-fermion regime.", "La-substitution studies reveal a rapid suppression of Tc and T0 due to disorder and lattice expansion.", "Results suggest that the superconducting phase has an itinerant character rather than purely local.", "The observed fragility confirms the sensitivity of these unconventional superconductors to pair breaking."]}}, {"title": "Nonlinear Hall effect in topological Dirac semimetals in a parallel magnetic field", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/7slj-8529", "authors": "Maxim Dzero, Maxim Khodas, Alex Levchenko, Vladyslav Kozii", "last_authors": "Alex Levchenko, Vladyslav Kozii", "summary": "We compute the second-harmonic response of two-dimensional topological Dirac semimetals subjected to an in-plane magnetic field. The quantum kinetic equation for the Wigner distribution function is derived and then solved to compute the second-order electric-field contributions to the current densit…", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Theoretical study of nonlinear Hall effect in topological Dirac semimetals, direct user interest.", "tags": ["theory", "Dirac_semimetal", "topological_material", "Hall_effect", "magnetic_field"], "image": "", "briefing": {"background": "위상적 디락 반금속(topological Dirac semimetals)은 그 대칭성과 위상적 성질로 인해 선형 응답을 넘어선 비선형 수송 현상에 대한 연구가 활발합니다.", "motivation": "평행 자기장이 인가된 조건에서 디락 반금속의 2차 조화(second-harmonic) 전기적 응답을 이론적으로 정밀하게 계산하고자 했습니다.", "result": "양자 운동 방정식(quantum kinetic equation)을 기반으로 Wigner 분포 함수를 해결하여, 2차 전기장 성분이 전류 밀도에 기여하는 바를 도출했습니다.", "implication": "자기장에 의해 유도된 Berry 곡률(Berry curvature)과 밴드 구조의 변화가 비선형 홀 효과(Nonlinear Hall effect)의 크기와 방향을 제어할 수 있음을 이론적으로 확증했습니다.", "novelty": "외부 자기장 환경에서의 비선형 전송 특성을 해석함으로써, 향후 실험적 관측을 위한 명확한 수치적 예측을 제공했습니다.", "unresolved": "이론 계산에서는 이상적인 디락 포인트 근방의 페르미 준위 근처만을 주로 고려하고 있어, 실제 시료의 도핑이나 disorder가 미칠 구체적 영향은 제한적입니다.", "future_work": "실제 디락 반금속 물질(예: Cd3As2 등)에서의 전기 수송 실험을 통해 이 이론을 검증하고 Berry 곡률을 역으로 추적하는 연구가 필요합니다.", "concepts": [{"term": "비선형 홀 효과 (Nonlinear Hall effect)", "why_emerged": "시간 반전 대칭성이 깨지지 않아도 Berry 곡률의 쌍극자 모멘트에 의해 비선형적인 전압 응답이 나타나는 현상을 설명하기 위해 필요합니다.", "origin": "Sodemann과 Fu (2015)에 의해 이론적 기초가 마련되었습니다.", "connections": "Berry 곡률, 비정상 홀 효과, 위상 반금속."}, {"term": "디락 반금속 (Dirac semimetal)", "why_emerged": "3차원 공간에서 전도대와 가전도대가 디락 포인트에서 만나는 위상적 특징을 갖는 물질을 분류하기 위해 필요합니다.", "origin": "Young et al. (2012) 등 초기 이론적 제안 이후 실험적으로 확인되었습니다.", "connections": "Weyl 반금속, 위상 절연체, 페르미 아크."}], "english_summary": ["The authors compute the second-harmonic response of 2D topological Dirac semimetals.", "A quantum kinetic approach is used to derive the nonlinear Hall response under in-plane magnetic fields.", "The findings provide a link between Berry curvature dynamics and second-order transport coefficients.", "The study serves as a theoretical basis for experimental investigation in magnetic topological materials."]}}, {"title": "Orbital piezomagnetic polarizability of pure insulating altermagnets in two dimensions", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/zpbm-qr7d", "authors": "Beryl Bell, J. W. F. Venderbos", "last_authors": "Beryl Bell, J. W. F. Venderbos", "summary": "The distinctive symmetry properties of pure altermagnets make them natural candidates for piezomagnetism. Previous work motivated by the piezomagnetic properties of altermagnets has primarily focused on the spin magnetization response to applied strain. In this paper we study orbital piezomagnetic e…", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Theoretical study of piezomagnetic properties in altermagnets, a strong user interest.", "tags": ["theory", "altermagnetism", "2D_materials", "magnetism"], "image": "", "briefing": {"background": "알터마그네틱(Altermagnetism)은 기존의 강자성(Ferromagnetism)이나 반강자성(Antiferromagnetism)으로 분류되지 않는 새로운 자기 질서 상태로, 스핀이 정렬되어 있으면서도 자화가 상쇄되어 외부 자기장 반응은 작지만, 특정 대칭성을 깨뜨려 스핀 분할 밴드 구조를 가지는 물질군입니다.", "motivation": "기존 알터마그네틱 연구가 주로 스핀 자기 모멘트의 변형 반응에 집중된 반면, 이 논문은 알터마그네틱이 가지는 독특한 결정 대칭성이 어떻게 '궤도(Orbital)' 자유도와 결합하여 압전자기(Piezomagnetism) 효과를 유도하는지 탐구하고자 했습니다.", "result": "2차원 순수 절연체 알터마그네틱에서 궤도 기여를 포함한 압전자기 편극율(Orbital piezomagnetic polarizability)을 이론적으로 계산하였으며, 이를 통해 변형률에 따른 궤도 자기 모멘트 변화가 어떻게 나타나는지 규명했습니다.", "implication": "알터마그네틱에서 스핀뿐만 아니라 궤도 자유도가 물리적 반응을 지배할 수 있음을 보여주며, 향후 궤도 정보를 제어하는 차세대 spintronics/orbitronics 소자 개발의 이론적 기반이 됩니다.", "novelty": "기존 연구와 달리 스핀이 아닌 궤도 편극에 주목했다는 점이 차별점이며, 알터마그네틱의 대칭성을 이용한 기능성 제어 가능성을 확장했습니다.", "unresolved": "실제 실험에서 궤도 압전자기 효과만을 순수하게 분리하여 측정하기 위한 실험적 설계와 검증 방법은 여전히 과제로 남아 있습니다.", "future_work": "다양한 2D 알터마그네틱 후보 물질에 대한 제1원리 계산을 확장하고, 전기적 혹은 기계적 변형을 통한 궤도 자기 특성 제어 실험이 필요합니다.", "concepts": [{"term": "알터마그네틱(Altermagnetism)", "why_emerged": "기존의 자성 분류에 속하지 않는 스핀-분할 밴드 구조를 설명하기 위해 제안됨.", "origin": "최근 수년 내 이론적 체계가 정립된 분야로 특정 1인보다는 이론 물리학 커뮤니티에서 확립.", "connections": "반강자성체, 스핀-궤도 결합, 비자성체 스핀 분할."}, {"term": "압전자기(Piezomagnetism)", "why_emerged": "결정 구조의 변형(변형률)과 자기적 반응(자화) 사이의 선형 결합을 설명하기 위해.", "origin": "대칭성 원리에 기초한 고전적 고체물리학 개념.", "connections": "압전 효과(Piezoelectricity), 자기변형(Magnetostriction)."}], "english_summary": ["Investigates the orbital piezomagnetic response in 2D insulating altermagnets.", "Highlights how symmetry-protected orbital degrees of freedom respond to strain.", "Expands the understanding of altermagnetism beyond spin-only magnetization.", "Provides a theoretical framework for future orbitronics applications."]}}, {"title": "Polarization engineering of the orbital Hall conductivity in the two-dimensional ferroelectric higher-order topological insulators Tl2S and SnS", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/nqkg-2sj7", "authors": "Yingjie Hu, Heng Gao, Yabei Wu, Wei Ren", "last_authors": "Yabei Wu, Wei Ren", "summary": "Ferroelectric higher-order topological insulators (HOTIs) exhibit versatile physical properties arising from the interplay between ferroelectric polarization and band topology. This work investigates the topological origin of two classes of two-dimensional (2D) ferroelectric HOTIs with out-of-plane …", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Theory on 2D ferroelectric higher-order topological insulators with orbital Hall conductivity.", "tags": ["topological_insulator", "2D_material", "theory", "transport"], "image": "", "briefing": {"background": "강유전체(Ferroelectric)와 위상 절연체(Topological Insulator)의 결합은 물질의 내부 대칭성을 전기장으로 제어하여 위상학적 상태를 스위칭할 수 있는 차세대 양자 소자 구현을 위한 핵심 주제입니다.", "motivation": "2차원 강유전체 고차 위상 절연체(HOTI)에서 강유전성 편극(Polarization) 방향이 위상학적 성질과 결합할 때, 어떻게 전하 및 궤도 홀 전도도(Orbital Hall conductivity)가 조절되는지 확인하고자 했습니다.", "result": "Tl2S와 SnS 물질을 예로 들어, out-of-plane 편극을 조절함에 따라 궤도 홀 전도도가 유의미하게 변하는 메커니즘을 규명하였으며, 이를 통해 위상학적 상태의 전기적 제어 가능성을 입증했습니다.", "implication": "전기장을 사용하여 위상학적 위상을 전환하고, 이를 통해 궤도 홀 전류를 정밀하게 제어할 수 있는 저전력 논리 소자 구현 가능성을 제시합니다.", "novelty": "단순 위상 절연체가 아닌 강유전성이 결합된 고차 위상 절연체에서 '궤도 홀 전도도'의 조절을 제안한 점이 주목할 만합니다.", "unresolved": "실제 상온에서의 안정적인 강유전성 유지와 실험적 샘플 제작 시 발생하는 결함이 위상학적 보호에 미치는 영향은 추가 연구가 필요합니다.", "future_work": "제안된 이론을 바탕으로 한 실제 소자 제작과 수송 측정(Transport measurement)을 통한 궤도 홀 전류의 직접적인 확인이 요구됩니다.", "concepts": [{"term": "고차 위상 절연체(HOTI)", "why_emerged": "일반적인 위상 절연체의 벌크-경계 대응 원리를 확장하여 1차원 이하의 모서리나 0차원 꼭짓점에서 상태를 설명하기 위해.", "origin": "Bernevig, Zhang 등이 제안한 위상 절연체 이론의 발전형.", "connections": "위상학적 불변량, 벌크-경계 대응(Bulk-Boundary Correspondence)."}, {"term": "궤도 홀 전도도(Orbital Hall Conductivity)", "why_emerged": "전자의 스핀뿐만 아니라 궤도 각운동량 또한 외부 전기장에 의해 횡방향으로 이동할 수 있다는 사실을 기술하기 위해.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "스핀 홀 효과(Spin Hall Effect), Berry 곡률."}], "english_summary": ["Explores orbital Hall conductivity in 2D ferroelectric HOTIs (Tl2S, SnS).", "Demonstrates polarization-dependent control of topological electronic phases.", "Connects ferroelectric switching with orbital transport properties.", "Paves the way for electrically tunable topological spintronics."]}}, {"title": "Spin-Hall angle temperature dependence in NiFe/MnBi2Te4 heterostructures", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/8ndt-kt7c", "authors": "A. S. Pakhomov, V. V. Yurlov, P. N. Skirdkov, et al.", "last_authors": "A. I. Chernov, K. A. Zvezdin", "summary": "Pairing a ferromagnet with the MnBi 2 Te 4 offers a promising route to efficient spin-to-charge conversion, but how well it performs across temperature had remained unmapped. Combining ferromagnetic resonance with inverse spin-Hall voltage measurements from 20–290 K, the authors show here that the spin-Hall angle stays nearly constant below approximately 130 K, then becomes unreliable as spin rectification and shifting damping take over. The results establish the material as a robust platform for cryogenic spin-orbit and topological spintronics.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Experimental study of spin-Hall effect in MnBi2Te4 heterostructures, relevant to topological spintronics.", "tags": ["heterostructure", "topological_material", "magnetic_material", "spin_Hall", "spintronics", "experimental"], "image": "", "briefing": {"background": "위상 자성체(Magnetic Topological Insulators)인 MnBi2Te4는 그 자체로 양자 이상 홀 효과를 나타낼 수 있는 물질로, 강자성체와의 이질 구조(Heterostructure)를 통해 스핀-전하 변환 효율을 극대화하려는 spintronics 연구가 활발합니다.", "motivation": "MnBi2Te4와 강자성체 계면에서의 스핀 홀 효과(Spin Hall Effect) 효율이 온도에 따라 어떻게 변하는지 규명하여, 실제 극저온 소자에서의 안정적인 작동 조건을 확인하고자 했습니다.", "result": "20-290K 온도 범위에서 측정 결과, 130K 이하에서는 스핀 홀 각(Spin-Hall angle)이 거의 일정하게 유지되나, 그 이상에서는 스핀 정류(Spin rectification) 등의 노이즈로 인해 측정이 불안정함을 발견했습니다.", "implication": "MnBi2Te4 기반 위상 spintronics 소자가 극저온 영역에서 신뢰성 있는 스핀-전하 변환 장치로 사용될 수 있음을 실험적으로 증명했습니다.", "novelty": "기존에는 이론적 예측이나  방법론은 키랄성이나 베리 곡률과 연관된 고체 광학 실험(CD-ARPES 등)의 해석을 비약적으로 발전시킬 수 있는 표준이 될 수 있습니다.", "novelty": "기존 계산의 난점이었던 게이지 불변성 문제와 엑시톤 효과를 통합하여, 고체 물리학에서 보다 정교한 카이랄 광학 예측이 가능해졌습니다.", "unresolved": "계산 비용이 매우 높으며, 스핀-궤도 결합이 극도로 강한 시스템에서의 정확도는 추가 검증이 필요합니다.", "future_work": "다양한 위상 물질 및 강상관계 2D 자성 물질에 대한 적용을 통해 광학 응답과 밴드 기하학의 연관성을 심화 연구할 계획입니다.", "concepts": [{"term": "GW-BSE", "why_emerged": "고체에서의 다체 효과와 엑시톤의 결합 에너지를 정밀하게 계산하기 위함.", "origin": "Lars Hedin (1965) - GW, Salpeter & Bethe (1951) - BSE", "connections": "다체 섭동 이론, DFT, 광학 스펙트럼."}, {"term": "원형 이색성(CD)", "why_emerged": "편광된 빛에 대한 물질의 선택적 흡수를 통해 비대칭성을 파악하기 위함.", "origin": "Aimé Cotton (1896)", "connections": "카이랄성, 자기 구조, 위상학적 밴드."}], "english_summary": ["Develops a gauge-invariant GW-BSE framework for circular dichroism.", "Accurately accounts for exciton effects in periodic chiral systems.", "Demonstrates applicability to chiral 2D perovskites.", "Provides a foundation for interpreting chiroptical and CD-ARPES measurements."]}}, {"title": "Heterostructuring as Gateway to Electron Doping of Nickelate Superconductors", "journal": "PRL_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/qp4p-x6g3", "authors": "Chao Deng, Motoharu Kitatani, Guiwen Jiang, et al.", "last_authors": "Karsten Held, Liang Si", "summary": "Intercalation-driven self-doping is a general mechanism for engineering high-temperature superconductivity and emergent quantum states in Ruddlesden–Popper phase correlated oxides.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Unconventional nickelate superconductivity and correlated oxides, relevant heterostructuring.", "tags": ["superconductivity", "nickelates", "correlatedelectrons", "heterostructures"], "image": "", "briefing": {"background": "니켈산염(Nickelate) 초전도체는 쿠퍼산화물과 유사한 전자 구조를 가지면서도 독특한 물성을 보여주어 차세대 고온 초전도 후보로 주목받고 있습니다. 이 물질의 물성을 제어하기 위한 전자 도핑은 매우 중요한 연구 분야입니다.", "motivation": "Ruddlesden–Popper 상의 산화물에서 격자 간 삽입을 통한 자체 도핑(self-doping) 메커니즘을 규명하고, 이를 활용해 니켈산염 초전도체의 전자 농도를
