<title>Daily Paper Slideshow</title>
<style>
  :root {
    color-scheme: light;
    --bg: #f6f7f4;
    --paper: #ffffff;
    --ink: #111827;
    --muted: #64748b;
    --line: #d8ddd2;
    --accent: #176b87;
    --accent-2: #9a3412;
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; overflow: auto; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: var(--bg); color: var(--ink); }
  .shell { max-width: 1500px; min-height: 100vh; margin: 0 auto; padding: 14px 18px; display: flex; flex-direction: column; }
  .topbar { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 16px; }
  .top-actions { display: flex; align-items: center; gap: 10px; }
  .topbar a, button { border: 1px solid var(--line); border-radius: 8px; background: var(--paper); color: var(--ink); padding: 10px 14px; font-weight: 700; text-decoration: none; cursor: pointer; }
  button.primary { background: var(--accent); border-color: var(--accent); color: white; }
  button:disabled { opacity: 0.45; cursor: not-allowed; }
  .counter { color: var(--muted); font-weight: 700; }
  .slide { min-height: calc(100vh - 82px); background: var(--paper); border: 1px solid var(--line); border-radius: 10px; padding: 18px; box-shadow: 0 18px 42px rgba(15, 23, 42, 0.10); display: grid; grid-template-columns: minmax(310px, 0.86fr) minmax(0, 1.55fr); gap: 18px; overflow: visible; }
  .paper-head { min-width: 0; min-height: 0; overflow: visible; display: flex; flex-direction: column; gap: 12px; }
  .figure { margin: 0; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: #f8fafc; }
  .figure img { display: block; width: 100%; max-height: 41vh; object-fit: contain; background: white; }
  .figure figcaption { padding: 7px 10px; color: var(--muted); font-size: 12px; line-height: 1.3; }
  .head-text { display: flex; flex-direction: column; gap: 9px; min-width: 0; }
  .badges { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .badge { border-radius: 999px; padding: 5px 9px; background: #eef2ff; color: #3730a3; font-size: 12px; font-weight: 800; }
  .score { background: #fee2e2; color: #991b1b; }
  h1 { margin: 0; font-size: 25px; line-height: 1.15; letter-spacing: 0; overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
  h1 a { color: inherit; text-decoration-color: rgba(23, 107, 135, 0.35); text-decoration-thickness: 2px; text-underline-offset: 4px; }
  h1 a:hover { color: var(--accent); text-decoration-color: var(--accent); }
  .meta, .authors, .why, .abstract { font-size: 13px; line-height: 1.45; }
  .meta, .authors { color: var(--muted); }
  .why strong, .abstract strong, .authors strong { color: var(--ink); }
  .authors { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .why { border-left: 4px solid var(--accent-2); padding-left: 10px; color: #374151; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .abstract { border-top: 1px solid var(--line); padding-top: 14px; color: #374151; }
  .original-abstract { border-top: 1px solid var(--line); padding-top: 10px; color: #374151; font-size: 11.5px; line-height: 1.35; overflow-wrap: anywhere; }
  .original-abstract strong { display: block; margin-bottom: 4px; color: var(--ink); }
  .tags { display: flex; flex-wrap: wrap; gap: 8px; }
  .tag { border-radius: 999px; padding: 4px 8px; background: #f1f5f9; color: #475569; font-size: 12px; font-weight: 700; }
  .head-text > .link { display: none; }
  .briefing { min-width: 0; min-height: 0; overflow: visible; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); grid-auto-rows: minmax(0, auto); align-content: start; gap: 11px 18px; border-top: 0; padding-top: 0; }
  .brief-section { min-width: 0; }
  .brief-section.wide { grid-column: 1 / -1; }
  .brief-section h2 { margin: 0 0 4px; font-size: 14px; line-height: 1.22; color: #0f766e; letter-spacing: 0; }
  .brief-section p, .brief-section li { margin: 0; font-size: 12.5px; line-height: 1.42; color: #1f2937; overflow-wrap: anywhere; }
  .brief-section ul { margin: 0; padding-left: 20px; }
  .concepts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 9px 14px; }
  .concept { border-top: 1px solid var(--line); padding-top: 7px; }
  .concept h3 { margin: 0 0 4px; font-size: 13px; color: #7c2d12; letter-spacing: 0; }
  .concept p { margin: 2px 0 0; font-size: 11.5px; line-height: 1.35; color: #374151; overflow-wrap: anywhere; }
  .concept b { color: #111827; }
  .link { color: var(--accent); font-weight: 800; text-decoration: none; }
  .empty { padding: 48px; background: var(--paper); border: 1px solid var(--line); border-radius: 12px; color: var(--muted); }
  @media (max-width: 860px) {
    .shell { padding: 14px; }
    .topbar, .top-actions { align-items: stretch; flex-direction: column; }
    .slide, .briefing, .concepts { grid-template-columns: 1fr; }
    .slide { min-height: auto; overflow: visible; display: grid; }
    h1 { font-size: 28px; }
  }
</style>

: kagome metal", "tags": ["kagome"], "image": "", "briefing": {"background": "Kagome 금속 FeGe는 전하 밀도 파동(CDW)과 자기적 정렬이 공존하는 흥미로운 물질로, 이러한 상태가 결정 구조와 어떻게 연결되어 있는지가 물리적 규명의 핵심입니다.", "motivation": "FeGe의 CDW 전이 온도에서 나타나는 물리적 특성을 결정 구조의 미세한 변화와 연관 지어 설명하고자 합니다.", "result": "고해상도 싱크로트론 X-선 회절을 통해 CDW 전이 온도에서 구조적인 브래그 피크(Bragg peak) 분리를 확인하여 구조적 상분리가 발생함을 밝혀냈습니다.", "implication": "FeGe의 양자 상태가 스트레인(strain)과 같은 외부 자극으로 제어 가능함을 시사하며, Kagome 물질의 위상 물리 연구에 새로운 변수를 제시합니다.", "novelty": "구조적 상분리가 CDW 형성과 직접적으로 결합되어 있음을 명확히 실증하여, 물질의 물리적 상태를 구조적 관점에서 제어할 수 있는 근거를 마련했습니다.", "unresolved": "구조적 변화와 전자 구조 변화 사이의 미세한 인과관계 및 스트레인이 실제 위상학적 상태를 어떻게 변화시키는지에 대한 정밀한 측정 데이터가 더 필요합니다.", "future_work": "다양한 스트레인 조건 하에서의 ARPES 또는 전송 측정을 통해 상전이의 가역성과 전자 구조 변화를 관측할 것으로 예상됩니다.", "concepts": [{"term": "Charge-Density-Wave (CDW)", "why_emerged": "전자와 격자 사이의 상호작용으로 인해 전자 밀도가 주기적인 변조를 일으키는 현상을 설명하기 위해 도입됨.", "origin": "Peierls (1955년).", "connections": "Kagome 격자, 페르미 면 불안정성, 초전도체와의 경쟁/협력 관계."}, {"term": "Bragg Peak Split", "why_emerged": "결정 구조의 대칭성이 깨지거나 도메인이 형성될 때 회절 패턴의 변화를 감지하기 위해 사용됨.", "origin": "X-선 회절(XRD) 기술의 기본 원리.", "connections": "결정 구조 상전이, 격자 왜곡(Lattice distortion)."}], "english_summary": ["High-resolution synchrotron XRD reveals structural Bragg peak splitting in FeGe at the CDW transition.", "This indicates structural phase separation is coupled to the CDW formation.", "The findings suggest potential for manipulating the material's quantum states via strain engineering."]}}, {"title": "Correlated one-dimensional electron conduction in ferroelastic domain walls through nematic-like charge stripes", "journal": "Science_Advances", "source": "author whitelist", "link": "https://www.science.org/doi/abs/10.1126/sciadv.aee1472?af=R", "authors": "Minho Kang, Gyubin Lee, Wooin Yang, et al.", "last_authors": "Yeongkwan Kim, Chan-Ho Yang", "summary": "One-dimensional electronic transport reveals many-body quantum phenomena and serves as a foundation for quantum devices, sensors, and reconfigurable electronics. Here, we demonstrate that surface-exposed ferroelastic twin walls in epitaxial WO 3 films function as intrinsic one-dimensional channels, confining electrons to screen surface-bound charges induced by flexoelectric polarization. Scanning tunneling microscopy uncovers a self-organized nematic-like phase forming periodic stripes perpendicular to the walls. Conductive atomic force microscopy and angle-resolved photoemission spectroscopy resolve quantized one-dimensional states and reveal conductance enhancements exceeding two orders of magnitude along the twin walls relative to the surrounding semi-insulating surface regions at room temperature. Temperature-dependent transport follows an Efros–Shklovskii variable-range hopping law, with a crossover near 140 K and a localization length of 39 Å—identical to the stripe period—signifying Coulomb-coupled electrons confined within stripe-induced potential wells along the walls. These findings establish WO 3 ferroelastic walls as a tunable platform for engineering one-dimensional correlated electron states.", "tier": "A_MUST_READ", "score": "9", "reason": "author whitelist: Yeongkwan Kim", "tags": ["nematic", "correlated"], "image": "", "briefing": {"background": "1차원 전자 수송은 강한 상관관계가 있는 전자계의 물리 현상을 연구하고 차세대 소자 개발을 위한 핵심 기초 분야입니다. 특히 산화물 박막의 도메인 벽과 같은 결함 구조는 전자 구속을 통해 흥미로운 양자 상태를 생성할 수 있는 플랫폼으로 주목받고 있습니다.", "motivation": "WO3 박막의 페로탄성(ferroelastic) 쌍정 경계(twin wall)가 전자 수송을 위한 1차원 채널로 기능할 수 있는지, 그리고 그 안에서 나타나는 네마틱 전하 줄무늬와 전자 상관관계의 관계를 규명하고자 했습니다.", "result": "WO3 쌍정 경계가 1차원 전자 채널로 작동하며, 주위보다 100배 이상 높은 전도성을 보임을 확인했습니다. 또한, 스캐닝 터널링 현미경(STM)을 통해 1차원 채널에 수직으로 형성된 네마틱 전하 줄무늬와 쿨롱 상호작용에 의한 전자 국소화 현상을 관찰했습니다.", "implication": "강상관 전자계 연구에서 페로탄성 도메인 벽을 이용해 1차원 전자 상태를 제어하고 공학적으로 설계할 수 있는 가능성을 열었습니다.", "novelty": "기존의 인위적인 나노 와이어 제작 방식과 달리, 소재 내부의 구조적 결함(쌍정 경계)을 활용하여 자가 조직화된 네마틱 줄무늬와 결합된 1차원 전도 채널을 구현했다는 점이 독창적입니다.", "unresolved": "140K 부근에서의 수송 특성 변화에 대한 미시적 원인과 이 1차원 채널이 나타내는 다체 물리 현상의 정확한 위상적 성질은 추가 연구가 필요합니다.", "future_work": "이러한 1차원 채널 내에서의 초전도성 또는 자기적 질서 유도 가능성을 탐색하고, 외부 전기장이나 스트레인 제어를 통한 전도성 가변 소자 제작이 기대됩니다.", "concepts": [{"term": "네마틱 상(Nematic phase)", "why_emerged": "결정 대칭성을 자발적으로 깨뜨려 회전 대칭성만 사라지는 상태를 기술하기 위해 필요함", "origin": "액정 물리학에서 유래하였으나 고체 물성에서는 전자의 자발적 비등방성 상태로 정의됨", "connections": "철계 초전도체, 카고메 금속(AV3Sb5)의 CDW 상태와 밀접한 관련이 있음"}, {"term": "Efros–Shklovskii (ES) 도약 전도", "why_emerged": "쿨롱 상호작용이 전자 국소화에 미치는 영향을 설명하기 위해 필요함", "origin": "A. L. Efros와 B. I. Shklovskii가 1975년에 제안함", "connections": "Mott 가변 범위 도약 전도(VRH)의 확장판으로 강상관 1차원 시스템에서 자주 관찰됨"}], "english_summary": ["WO3 epitaxial films exhibit 1D electronic transport along ferroelastic twin walls.", "Scanning tunneling microscopy reveals a nematic-like stripe phase coupled to the twin walls.", "Conductance enhancement and Efros-Shklovskii hopping behavior demonstrate strong electron correlations.", "This provides a new platform for engineering tunable 1D quantum electronic states."]}}, {"title": "Remote magnon sensing detects the universal phase stiffness jump in Bi2Sr2CaCu2O8+", "journal": "arXiv_CondMat", "source": "author whitelist", "link": "https://arxiv.org/abs/2610.08934", "authors": "Yue Sun, Mai Nguyen, Naiyuan James Zhang, et al.", "last_authors": "Joseph Orenstein, Xiaodong Xu", "summary": "Phase stiffness governs macroscopic quantum coherence in superfluids and superconductors, providing a sensitive probe of condensate depletion, fluctuations, and phase transitions. However quantitative and spatially resolved measurements remain challenging. Here we report a contactless, local, all-optical measurement of superconducting phase stiffness using propagating antiferromagnetic magnons as remote sensors. In CrSBr, strong exciton-magnon coupling enables optical excitation and detection of magnon wavepackets and precise determination of their group velocity. When CrSBr is interfaced with underdoped Bi$_2$Sr$_2$CaCu$_2$O$_{8+\\delta}$, we find that the magnon group velocity is substantially enhanced below the superconducting transition and quantitatively encodes the phase stiffness through Meissner screening currents. Using this capability, we identify a parallel-field-induced Berezinskii-Kosterlitz-Thouless transition through direct observation of the universal phase-stiffness jump, revealing a field-controlled route to expose intrinsic two-dimensional phase-ordering physics in a bulk cuprate. Our work establishes propagating magnons as local probes of superconducting electrodynamics and phase-coherent phenomena in low-dimensional quantum materials.", "tier": "A_MUST_READ", "score": "9", "reason": "author whitelist: Makoto Hashimoto", "tags": ["cuprate", "superconduct", "magnon", "ferromagnet", "antiferromagnet"], "image": "https://arxiv.org/html/2610.08934v1/Figure_1_v4.png", "briefing": {"background": "고온 초전도체의 위상 강성(phase stiffness)은 매크로 양자 결맞음의 척도로, 초전도 전이와 유동적 특성을 이해하는 데 필수적이나, 이를 국소적이고 비파괴적으로 측정하는 것은 매우 어렵습니다.", "motivation": "반강자성체 CrSBr의 마그논(magnon)이 초전도체와 결합했을 때, 그 분산 관계 변화를 통해 초전도체의 위상 강성을 비접촉식으로 정밀하게 측정하려는 것이 연구의 핵심 동기입니다.", "result": "CrSBr의 마그논 전파 속도가 Bi2Sr2CaCu2O8+ 초전도 전이 온도 이하에서 위상 강성에 따라 변함을 확인했습니다. 이를 통해 2차원 위상 질서의 전형적인 특징인 Berezinskii-Kosterlitz-Thouless (BKT) 전이를 직접 관측하는 데 성공했습니다.", "implication": "반강자성 마그논이 초전도체의 위상적 전기 역학을 탐구하는 강력하고 새로운 국소 탐침(remote sensor)이 될 수 있음을 입증했습니다.", "novelty": "기존의 물리적 접촉이나 거시적 측정 대신 광학적으로 여기된 마그논을 이용한 비접촉식 측정 방식을 도입하여, 벌크 초전도체 내의 국소적 위상 물리학을 규명했다는 점이 혁신적입니다.", "unresolved": "CrSBr과 초전도체 사이의 계면 결합력의 크기에 따른 신호 감도 최적화 문제와 다양한 강상관 물질에 대한 적용 가능성이 남아있습니다.", "future_work": "다른 강상관 초전도체나 토폴로지 재료 시스템에 이 센싱 기법을 적용하여 위상적 상전이 및 와류 동역학 연구를 확장할 예정입니다.", "concepts": [{"term": "위상 강성(Phase Stiffness)", "why_emerged": "위상(phase) 변동에 대한 초전도 에너지 비용을 정의하기 위해 필요함", "origin": "초전도 현상학 이론(Ginzburg-Landau)의 기본 개념임", "connections": "초유체 밀도, BKT 전이, 쿠퍼 쌍의 결맞음과 직접적인 연관이 있음"}, {"term": "BKT 전이(Berezinskii-Kosterlitz-Thouless transition)", "why_emerged": "2차원 시스템에서 일반적인 롱레인지 오더 대신 와류-반와류 쌍의 결합으로 나타나는 위상 전이를 기술하기 위해 필요함", "origin": "V. Berezinskii, J. M. Kosterlitz, D. J. Thouless에 의해 정립됨", "connections": "2D 평면의 초전도 박막이나 층상 구조물질에서의 위상 질서 연구 핵심 이론"}], "english_summary": ["Magnons in CrSBr act as remote sensors for phase stiffness in Bi2Sr2CaCu2O8+.", "Group velocity of antiferromagnetic magnons encodes the superconducting phase stiffness.", "Direct observation of the universal phase-stiffness jump indicates a BKT-like transition.", "This work introduces a contactless optical probe for local superconducting electrodynamics."]}}, {"title": "Mapping Strain and Spatial-Modulation Phase from Local Wave Vectors in Scanning Tunneling Microscopy", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2610.10255", "authors": "Xinze Yang, Sandra Sajan, Maria N. Gastiasoro, Miguel M. Ugeda, Eduardo H. da Silva Neto", "last_authors": "Miguel M. Ugeda, Eduardo H. da Silva Neto", "summary": "Spatially varying lattice distortions can produce local changes in electronic properties that are obscured by measurements averaging over extended regions. With its atomic-scale spatial resolution, scanning tunneling microscopy (STM) provides, in principle, a means of quantifying such distortions locally. A widely used approach for extracting local strain from STM images is the Lawler–Fujita (LF) algorithm [Lawler et al. , Nature 466 , 347 (2010)], which determines the displacement field from the phase of the lattice modulation and subsequently obtains the strain by differentiation. However, this approach requires two-dimensional phase unwrapping, which can fail in regions where the phase is ill-defined, particularly near topological defects such as edge dislocations. Here, we introduce an alternative approach that circumvents these limitations by directly measuring the local wave vector in real space. We derive the relationship between the local wave vector, strain, and the phase gradient, and show that the local wave vector mapping (LWM) algorithm remains robust even when the phase itself is ill-defined. This makes the method particularly well suited for imaging the phase-gradient textures associated with vortices and other topological defects. We benchmark the algorithm using simulated data containing known lattice distortions and artificially generated vortices. Finally, we apply the method to experimental STM data and resolve the charge density wave (CDW) incommensurabilities, lattice distortions, and CDW phase vortices in 4 ​ H ​ a ​ – ​ NbSe 2 \\mathrm{4Ha}\\textrm{\\,--\\,}\\mathrm{NbSe}_{2} and 2 ​ H ​ – ​ NbSe 2 \\mathrm{2H}\\textrm{\\,--\\,}\\mathrm{NbSe}_{2} . The physical implications of these observations were recently reported by S. Sajan, X. Yang, et al. [arXiv:2607.20335 (2026)]. The program package and the example usage is publicly available at the GitHub: https://github.com/jsntxyang/LocalWavevectorMeasuremnt .", "tier": "B_IMPORTANT_CONDMAT", "score": "10", "reason": "New algorithm for analyzing CDW and lattice distortions directly relevant to AV3Sb5 and NbSe2 experiments.; demoted from A: broad CM, not direct user/project hit", "tags": ["method", "material", "topic"], "image": "https://arxiv.org/html/2610.10255v1/Fig_Process_V2.png", "briefing": {"background": "STM은 원자 단위의 분해능을 갖지만, 위상 이미지에서 국소적인 변형이나 CDW의 결함 구조를 정확히 분리해내는 데에는 위상 언래핑(phase unwrapping) 알고리즘의 한계가 존재해왔습니다.", "motivation": "기존 Lawler-Fujita 알고리즘의 위상 언래핑 실패 문제를 극복하고, 실제 공간에서 국소 파동 벡터(local wave vector)를 직접 측정하여 CDW와 격자 변형을 정밀하게 매핑하고자 했습니다.", "result": "파동 벡터 매핑(LWM) 알고리즘을 개발하여 위상적 결함(보텍스 등) 주변에서도 격자 왜곡을 왜곡 없이 측정할 수 있음을 증명하고, NbSe2 시스템에 적용하여 CDW 위상 보텍스를 성공적으로 시각화했습니다.", "implication": "AV3Sb5나 NbSe2와 같이 CDW와 위상 결함이 공존하는 시스템에서 숨겨진 물리량을 추출할 수 있는 강력한 분석 도구를 제공합니다.", "novelty": "기존 위상 기반 분석법의 근본적 한계를 극복하고 실시간 공간에서 로컬 파동 벡터를 직접 추출하여 위상적 결함을 로버스트하게 해석할 수 있게 한 점이 큰 기술적 진보입니다.", "unresolved": "알고리즘의 성능이 STM 이미지의 S/N 비에 얼마나 민감한지에 대한 추가적인 정량적 평가가 필요할 수 있습니다.", "future_work": "카고메 금속(AV3Sb5)의 CDW-위상 결함 상호작용 및 초전도 상태와의 상관관계 연구에 활용할 것으로 예상됩니다.", "concepts": [{"term": "CDW(Charge Density Wave)", "why_emerged": "전  an effective single-band model accurately captures the low-energy electronic structure, reproducing key experimental features from ARPES and STS d ​ I / d ​ V dI/dV spectra, including a characteristic Van Hove singularity. While static DFT+ U U fails to describe the correlated metallic nature of the system, DFT+DMFT successfully accounts for the spectral weight redistribution and dynamic correlations. By defining the cRPA target subspace directly within the isolated Nb- d z 2 d_{z^{2}} band, we obtain a renormalized local interaction of U cRPA = 1.138 ​ eV U_{\\mathrm{cRPA}}=1.138\\penalty\\ \\mathrm{eV} . This interaction stabilizes a strongly correlated metallic state that remains robust upon cooling. Remarkably, this minimal single-band model captures a spectral broadening similar to that previously reported in more elaborate treatments - incorporating larger local interactions ( U ∼ 1.8 ​ eV U\\sim 1.8\\penalty\\ \\mathrm{eV} , derived from a multiorbital cRPA construction), intersite Coulomb terms ( V V ), and electron-phonon coupling - demonstrating that a consistently downfolded local interaction alone can already capture key aspects of the experimentally observed low-energy behavior of monolayer 1 ​ H ​ - ​ NbS 2 1\\mathrm{H}\\text{-}\\mathrm{NbS}_{2} .", "tier": "B_IMPORTANT_CONDMAT", "score": "9", "reason": "Highly relevant DFT+DMFT study of Nb-based monolayer, directly compared to ARPES and STS spectra.", "tags": ["ARPES", "STS", "NbS2", "monolayer"], "image": "https://arxiv.org/html/2610.06912v2/crystal_structure.png", "briefing": {"background": "전이금속 디칼코게나이드(TMD)의 단층 구조는 낮은 차원성과 강한 스핀-궤도 결합으로 인해 상관 전자 효과를 연구하는 중요한 플랫폼입니다.", "motivation": "단층 1H-NbS2에서 관찰된 금속성 밴드와 Van Hove 특이점이 강한 전자 상관관계에 의해 어떻게 결정되는지, 그리고 실험적 분광 데이터와 어떻게 부합하는지 확인하고자 합니다.", "result": "DFT+DMFT 분석을 통해 Nb-dz2 밴드의 상관관계가 중요하며, 정교한 단일 밴드 모델이 실험적인 ARPES 및 STS dI/dV 분광 특성을 잘 재현함을 확인했습니다.", "implication": "복잡한 다궤도 효과나 전자-포논 결합을 명시적으로 계산하지 않고도, 적절히 재규격화된 국소 상호작용(U)만으로 저에너지 전자 구조의 핵심 물성을 설명할 수 있음을 증명했습니다.", "novelty": "NbS2 시스템에서 DFT+U의 한계를 극복하고 DMFT의 효용성을 보였으며, ARPES와 STS 데이터를 이론적으로 통합 해석하는 가이드라인을 제시했습니다.", "unresolved": "매우 낮은 온도에서의 잠재적인 전하 밀도 파동(CDW)이나 초전도 기저 상태와의 정밀한 상관관계는 추가 연구가 필요합니다.", "future_work": "도핑 변화에 따른 상관관계 변화 연구 및 압력 하에서의 전자 물성 변화 계산.", "concepts": [{"term": "DFT+DMFT", "why_emerged": "DFT가 다루기 어려운 강한 전자 상관관계를 동역학적 평균장 이론(DMFT)으로 보완하여 강상관계 금속의 분광학적 특성을 설명하기 위해 필요.", "origin": "Kotliar et al.(2006) 리뷰 논문 등을 통해 확립.", "connections": "Hubbard 모델, 상관 전자계, ARPES 비교."}, {"term": "Van Hove 특이점", "why_emerged": "상태 밀도(DOS)가 발산하는 지점으로, 페르미 준위 근처에 위치할 경우 자성이나 초전도 등 양자 상전이를 유발하는 주요 인자로 작용.", "origin": "Leon Van Hove(1953).", "connections": "페르미 면, 토폴로지 변화, 다체 효과."}], "english_summary": ["Study of monolayer 1H-NbS2 using cRPA and DFT+DMFT.", "Reveals that a minimal single-band model with effective U accounts for experimental ARPES/STS data.", "Shows dynamic correlations are essential for capturing spectral weight redistribution.", "Simplifies the description of strongly correlated metals in TMD systems."]}}, {"title": "Multiorbital Anisotropy and Magnetic Excitations in Trilayer Nickelate Pr4Ni3O10", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2610.09210", "authors": "Ziqiang Guan, Sophia F. R. TenHuisen, Xuefei Guo, et al.", "last_authors": "Mark P. M. Dean, Matteo Mitrano", "summary": "Rare-earth substitution strongly modifies the structure, metallicity, and superconducting behavior of Ruddlesden-Popper (RP) nickelates, but its impact on their magnetic interactions remains unclear. Here, we combine x-ray absorption spectroscopy (XAS) and resonant inelastic x-ray scattering (RIXS) to resolve the multiorbital electronic structure and magnetic excitations of Pr$_4$Ni$_3$O$_{10}$. The absence of an overlapping rare-earth resonance provides direct access to the Ni $L_3$ edge, while polarization-dependent measurements at the Ni $L$- and O $K$-edges resolve distinct planar and out-of-plane Ni-O hybridization channels. Mome IXS.", "Identifies that multilayer architecture is the primary driver of magnetic interactions.", "Finds robust intra-trilayer exchange coupling independent of rare-earth substitution.", "Provides key insights into electronic and magnetic structure of RP nickelates."]}}, {"title": "Peierls Transition and Magnetism in a Dirac Semimetal: CaMnBi2", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2511.03721", "authors": "Aashish Sapkota, Niraj Aryal, Xiao Hu, et al.", "last_authors": "John M. Tranquada, Igor A. Zaliznyak", "summary": "Dirac semimetals of the form $A$Mn$X_2$ ($A =$ alkaline-earth or divalent rare earth; $X =$ Bi, Sb) host conducting square-net Dirac-electron layers of $X$ atoms interleaved with antiferromagnetic Mn$X$ layers. Hypervalent pnictogen square nets have long been predicted to host an electronically driven Peierls instability, whereas low-temperature anomalies in CaMnBi$_2$ near $T^{*}\\sim 50$~K have previously been discussed in terms of possible magnetic canting, TRS breaking, and a resulting Weyl-semimetal (WSM) state. Here we use polarized and unpolarized neutron diffraction, x-ray diffraction, and density functional theory (DFT) to investigate this transition in single-crystal CaMnBi$_2$. We observe a coupled structural/magnetic symmetry-lowering transition at $T^{*}=46(2)$ K from a tetragonal lattice with C-type antiferromagnetism to an orthorhombic phase with unit-cell doubling along the $c$ axis, minimal impact on magnetism, and no measurable uniform spin canting ($\\lesssim 2^\\circ$). Superlattice peak intensities and the lattice distortion reveal a continuous second-order transition governed by a single primary order parameter. The refined displacement pattern corresponds to a zigzag bond-order-wave (BOW) modulation of in-plane Bi--Bi bonds, providing direct diffraction evidence for a Peierls-type instability of the Dirac-electron Bi layer anticipated by Hoffmann and co-workers [W. Tremel and R. Hoffmann, J. Am. Chem. Soc. 109, 124 (1987); G. A. Papoian and R. Hoffmann, Angew. Chem. Int. Ed. 39, 2408 (2000)]. These results identify the $T^{*}$ anomaly as an intrinsic Dirac-electron-driven Peierls/BOW transition of the Bi square net.", "tier": "B_IMPORTANT_CONDMAT", "score": "9", "reason": "Dirac semimetal CaMnBi2 study showing a Peierls-type structural transition and its impact on electronic properties.; demoted from A: broad CM, not direct user/project hit", "tags": ["neutron-diffraction", "CaMnBi2", "Dirac-semimetal"], "image": "https://arxiv.org/html/2511.03721v2/Fig1abc_with_Peierls_de.png", "briefing": {"background": "CaMnBi2와 같은 AMnBi2 화합물은 Dirac 전자 층과 반강자성 MnBi 층이 번갈아 쌓인 구조를 가지며, 위상 물질 연구의 핵심 플랫폼입니다. 특히 pnictogen 원자로 이루어진 2차원 사각 격자(square-net)는 페이얼스 불안정성(Peierls instability)이 예측되어 왔습니다.", "motivation": "CaMnBi2의 저온 특이 현상(T*~50 K)이 자기적 뒤틀림이나 Weyl 준금속 상태와 관련이 있는지, 혹은 이론적으로 예견된 구조적 페이얼스 전이인지를 명확히 규명하기 위해 연구되었습니다.", "result": "중성자 및 X-선 회절 실험을 통해 T*=46 K에서 사방정계로의 대칭성 깨짐과 단위세포가 c축 방향으로 2배가 되는 구조적 전이를 확인했습니다. 이는 자기적 canting이 아닌, Bi 원자 층의 지그재그 본드(bond-order-wave) 변조에 의한 페이얼스 전이임이 입증되었습니다.", "implication": "이 결과는 CaMnBi2의 저온 anomaly가 자기적 기원이 아니라 Dirac 전자에 의해 유도된 구조적 불안정성에서 비롯됨을 확립하며, Dirac 준금속의 물성이 구조적 자유도와 밀접하게 연동됨을 보여줍니다.", "novelty": "Hoffmann 등이 수십 년 전 예측했던 Dirac 층의 페이얼스 불안정성을 회절 실험으로 직접 증명했다는 점이 핵심이며, 위상 물질의 구조적/전자적 상관관계를 연구하는 데 중요한 벤치마크가 됩니다.", "unresolved": "페이얼스 전이와 Dirac 준금속 사이의 미세한 에너지 결합 정도 및 이 변조가 위상적 표면 상태에 미치는 구체적인 영향은 향후 과제로 남습니다.", "future_work": "저온에서의 전자 구조 변화를 ARPES 등을 통해 직접 관측하여 페이얼스 갭 개방 여부를 확인하고, 이 구조적 변조가 위상 불변량에 미치는 영향을 계산하는 연구가 필요합니다.", "concepts": [{"term": "Peierls Instability", "why_emerged": "1차원 금속 시스템에서 격자 왜곡을 통해 전체 전자 에너지를 낮추려는 경향을 설명하기 위해 도입.", "origin": "Rudolf Peierls (1955).", "connections": "Kagome 금속의 CDW 전이, 1D 사슬 물질의 금속-절연체 전이."}, {"term": "Dirac Semimetal", "why_emerged": "에너지 띠가 선형으로 교차하는 지점이 보호된 시스템을 기술하기 위해.", "origin": "Young et al. (2012).", "connections": "Weyl 준금속, 위상 절연체."}], "english_summary": ["CaMnBi2 exhibits a structural transition at 46 K characterized by unit-cell doubling.", "The transition is identified as a Peierls-type bond-order-wave in the Bi square net.", "Experimental evidence refutes previous claims of magnetic canting as the origin of the anomaly.", "The study highlights the coupling between Dirac electrons and lattice instability."]}}, {"title": "Quantum-vortex excitons beyond band topology", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2610.10175", "authors": "Jin-Hyung Choi, Sang-Hoon Han, Young-Kwon Han, Jun-Won Rhim, Sun-Woo Kim, Joshua J. P. Thompson", "last_authors": "Sun-Woo Kim, Joshua J. P. Thompson", "summary": "Optically exciting a typical low-dimensional semiconductor produces a nodeless \\(s\\)-type exciton as its lowest-energy bound state. Here, we explain how Coulomb phase matching stabilises a quantum-vortex exciton as the lowest bound state in flat Chern bands. Using a prototypical Yin--Yang kagome lattice, we demonstrate that increasing the spin--orbit coupling drives a transition of the lowest exciton from a quantum-vortex state to a zero-winding state, while leaving the band Chern numbers unchanged. We trace this behaviour to a gauge-invariant combination of exciton phase differences and Bloch-overlap phases that can reduce the Coulomb energy. By comparing states with identical wavefunction amplitudes, we isolate this phase contribution and show that it is sufficient to drive the reversal in exciton ordering. We classify exciton topology by the momentum-space wavefunction winding relative to the conduction--valence Chern-number difference,connecting the competing states to circular-polarisation selection rules. We then show that the resulting reordering can be tracked directly in the optical absorption spectrum, through the transition from a dark vortex exciton to a bright zero-winding exciton. These findings establish a microscopic link between exciton topology, Coulomb binding, and optical response that extends beyond the information contained in the underlying electronic band Chern numbers.", "tier": "B_IMPORTANT_CONDMAT", "score": "9", "reason": "Study of excitons on kagome lattices with connection to optical responses.", "tags": ["material", "topic"], "image": "https://arxiv.org/html/2610.10175v1/kagfig1_2.png", "briefing": {"background": "Kagome 격자와 같은 2차원 위상 격자 시스템에서는 평탄띠(flat band) 내에서의 상관 관계가 중요합니다. 엑시톤(exciton) 연구는 위상학적 띠 구조 내에서 입자-홀 결합이 어떻게 형성되는지 이해하는 데 필수적입니다.", "motivation": "일반적인 엑시톤은 s-상태(nodeless)를 갖지만, 위상학적으로 자명하지 않은 Chern 띠에서는 엑시톤 파동함수의 위상적 꼬임(winding)이 엑시톤 에너지 준위에 어떤 변화를 주는지 규명하고자 했습니다.", "result": "Kagome 격자에서 스핀-궤도 결합 강도에 따라 엑시톤이 '양자 와류(quantum-vortex)' 상태에서 '제로-와인딩' 상태로 전이함을 발견했습니다. 이는 Coulomb 위상 정합(phase matching)과 Bloch 겹침 위상의 상호작용 결과입니다.", "implication": "엑시톤의 위상적 성질이 단순한 띠 구조의 Chern 수뿐만 아니라, Coulomb 상호작용과 결합하여 광학적 선택 규칙 및 흡수 스펙트럼을 결정함을 입증했습니다.", "novelty": "위상 물질의 광학적 응답을 엑시톤의 '와인딩'이라는 개념으로 분류하여, 띠 위상학과 엑시톤 물성 사이의 새로운 직접적 연결 고리를 제시했습니다.", "unresolved": "실제 실험적 Kagome 물질에서의 구체적인 광학 흡수 피크와 이 이론적 모델 간의 정량적 일치 여부는 아직 증명되지 않았습니다.", "future_work": "이 이론을 검증하기 위해 Kagome 물질에 대한 저온 광학 분광학 실험과 원편광 분광 실험이 이어져야 합니다.", "concepts": [{"term": "Quantum-vortex exciton", "why_emerged": "Chern 띠 내에서 엑시톤 파동함수의 위상적 꼬임이 엑시톤의 에너지를 낮추는 효과를 기술하기 위해.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "위상 절연체 엑시톤, Flat-band 상관관계."}, {"term": "Chern band", "why_emerged": "시간 반전 대칭성이 깨진 위상 격자에서 비자명한 Berry 곡률을 가진 띠를 정의하기 위해.", "origin": "Thouless et al. (TKNN, 1982).", "connections": "양자 홀 효과, Kagome 금속."}], "english_summary": ["Identifies quantum-vortex excitons in flat Chern bands of Kagome lattices.", "Shows Coulomb energy-driven phase transitions in exciton states controlled by spin-orbit coupling.", "Links exciton topology to observable optical absorption spectra.", "Establishes a microscopic connection between exciton winding and band Chern numbers."]}}, {"title": "Realization of quantum spin Hall insulator superlattice with emergent multigap-like helical edge states (Advanced Materials, e75159 (2026))", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2609.25732", "authors": "Hui Guo, Xianghe Han, Fang Qin, et al.", "last_authors": "Hui Chen, Hong-Jun Gao", "summary": "The functional quantum spin Hall insulators (QSHI), protected by time-reversal symmetry against single-particle backscattering, hold great promise for dissipationless quantum electronics. Realization of QSHI with gapped helical edge states, which would enable deterministic on/off switching of the edge-channel conductance, is a key requirement for programmable topological circuits. Here, we report realization of superlattice-modulated QSHI HfTe5 hosting emergent multigap-like helical edge states. Using scanning tunneling microscopy and spectroscopy, we identify a reconstruction-induced periodic superlattice modulation in epitaxial monolayer HfTe5 and directly observe multiple gap-like features in the edge channel, accompanied by a series of sharp peaks in the density of states. Combined with theoretical modelling, we attribute the observed edge gap to the finite-width coupling between the two edges significantly enhanced by the superlattice modulation, whereas the sharp peaks are the manifestations of mini-gaps opening at the reduced Brillouin zone boundaries by the periodic modulation of spin-orbit coupling. Notably, these sharp peaks exhibit clear Zeeman splitting under magnetic fields, consistent with the helical nature of the topological edge states. Our results establish a viable route to engineering gapped helical edge states in QSHI and provide a promising platform for topological devices with desired on/off switchability.", "tier": "B_IMPORTANT_CONDMAT", "score": "9", "reason": "STM/STS study of topological edge states in a superlattice-modulated monolayer HfTe5.", "tags": ["STM", "HfTe5", "topological"], "image": "https://arxiv.org/static/browse/0.3.4/images/arxiv-logo-fb.png", "briefing": {"background": "양자 스핀 홀 절연체(QSHI)는 ["nickelate", "STM", "superconductivity"], "image": "", "briefing": {"background": "최근 발견된 이중층 니켈산염 초전도체의 미시적 초전도 갭 구조를 이해하는 것은 물질의 초전도 기제를 밝히는 데 필수적입니다. STS는 국소적인 전자 상태 밀도(LDOS)를 측정하여 갭의 대칭성과 강도를 직접 볼 수 있는 강력한 도구입니다.", "motivation": "La2PrNi2O7 박막에서 관측된 STS 데이터를 해석하기 위한 이론적 프레임워크가 필요하며, 특히 Cooper 쌍 형성 모델을 검증하려는 목적이 있습니다.", "result": "이론적 모델링을 통해 박막의 압축 변형(compressive strain)이 STS 스펙트럼의 갭 특성에 미치는 영향을 분석하고, 실험 결과와 이론적 예측 간의 일관성을 도출했습니다.", "implication": "STS 스펙트럼의 해석을 통해 해당 물질의 초전도 갭 대칭성을 추론할 수 있게 하며, 이는 고온 초전도 니켈산염의 메커니즘 논쟁을 종식시키는 중요한 단서가 됩니다.", "novelty": "실험 데이터(STS)를 기반으로 한 이론적 해석을 통해 니켈산염의 초전도 상태를 직접적으로 연결하여, 향후 유사 물질 연구의 가이드라인을 제시합니다.", "unresolved": "실제 실험상의 나노미터 수준 불균일성이나 표면 효과가 STS 데이터에 미치는 영향은 완전히 배제되지 않았습니다.", "future_work": "더 넓은 범위의 도핑 및 변형 조건에서의 STS 스펙트럼 시뮬레이션 및 ARPES와의 정량적 비교 분석이 예상됩니다.", "concepts": [{"term": "Cooper-pairing models", "why_emerged": "전자들이 서로 인력을 통해 짝을 이루어 초전도 상태를 만드는 현상을 기술하기 위해 도입됨.", "origin": "BCS(Bardeen, Cooper, Schrieffer) 이론(1957).", "connections": "s-wave, d-wave 대칭성, 고온 초전도 이론."}, {"term": "STS (Scanning Tunneling Spectroscopy)", "why_emerged": "물질 표면의 원자 수준에서의 국소적 전자 상태 밀도를 측정하기 위해 개발됨.", "origin": "Gerd Binnig과 Heinrich Rohrer(1982).", "connections": "STM(Scanning Tunneling Microscopy), 전자 상태 밀도(DOS) 측정."}], "english_summary": ["Developed theoretical framework for STS spectra in bilayer nickelate thin films.", "Analyzed the effects of compressive strain on Cooper-pairing signatures.", "Bridges experimental STS data with microscopic superconducting gap models for La2PrNi2O7."]}}, {"title": "Large anomalous Hall effect in α-MnTe thin films grown on SrF2(111)", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/4hdt-17r9", "authors": "Sara Bey, Shelby S. Fields, Nicholas G. Combs, et al.", "last_authors": "Xinyu Liu, Badih A. Assaf", "summary": "α-MnTe is a prototypical altermagnet exhibiting a strong anomalous Hall effect (AHE), despite having a nearly vanishing magnetization. ${\\mathrm{SrF} "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/h16z-tqcl", "authors": "Xu Zhang", "last_authors": "Xu Zhang", "summary": "Using the determinant Quantum Monte Carlo method, we investigate the interplay among doping, interlayer tunneling, and on-site Hund's coupling in stabilizing superconductivity (SC) in a two-orbital model for the bilayer nickelate ${\\text{La}}_{3}{\\text{Ni}}_{2}{\\text{O}}_{7}$. With realistic dispers…", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Computational study on nickelate superconductivity; high relevance to current unconventional SC interests.", "tags": ["nickelate", "superconductivity", "theory"], "image": "", "briefing": {"background": "층상 구조 니켈산염(La3Ni2O7)은 80K 이상의 높은 임계 온도를 보여주어 차세대 고온 초전도체 후보로 주목받고 있습니다.", "motivation": "이 물질에서 초전도성을 유도하는 미시적 메커니즘을 밝히기 위해 층간 터널링과 Hund 결합의 역할을 정량적으로 분석하고자 합니다.", "result": "결정식 양자 몬테카를로(DQMC) 계산을 통해 도핑 농도와 층간 결합 강도가 초전도 쌍 형성에 미치는 상관관계를 규명하였습니다.", "implication": "니켈산염의 초전도 현상이 단순한 전자-포논 상호작용이 아닌 강한 전자 상관관계에 기반함을 시사하며, 물질 설계의 가이드라인을 제공합니다.", "novelty": "기존 연구의 고질적 난제인 '부호 문제(sign problem)'가 없는 유효 모델을 구성하여 계산의 신뢰도를 높였습니다.", "unresolved": "실제 화합물에서의 격자 왜곡이나 산소 결함 등이 초전도 상태에 미치는 영향은 완전히 반영되지 않았습니다.", "future_work": "더욱 현실적인 다중 궤도 모델링과 실험적인 ARPES를 통한 페르미 표면 검증이 필요합니다.", "concepts": [{"term": "Hund's coupling", "why_emerged": "다중 궤도를 가진 전자계에서 전자 간 교환 상호작용의 에너지 이득을 설명하기 위해 도입되었습니다.", "origin": "Friedrich Hund", "connections": "강상관 전자계에서 궤도 선택적 모트 절연체(OSMI) 현상과 밀접하게 연관됨."}, {"term": "Sign-problem-free", "why_emerged": "양자 몬테카를로법에서 페르미온의 음의 확률 가중치로 인한 수치적 발산 문제를 해결하기 위해 필요합니다.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "몬테카를로 시뮬레이션의 정확도와 계산 효율성을 결정짓는 핵심 이론적 기법."}], "english_summary": ["Investigates superconductivity in bilayer La3Ni2O7 using determinant Quantum Monte Carlo.", "Analyzes the competition between interlayer tunneling and on-site Hund's coupling.", "Provides insights into electronic pairing mechanisms without the sign problem.", "Suggests strong electron correlations  "english_summary": ["Reported Spin-Axis Dynamic Locking (SADL) in altermagnets.", "SADL allows for robust spin polarization control via electrical means.", "Advances the feasibility of altermagnetism in high-performance spintronic devices."]}}, {"title": "Ambipolar metal-insulator transition in bilayer MoSe2", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2610.09036", "authors": "Ha-Leem Kim, Hyungbin Lim, Terry Wu, et al.", "last_authors": "Eric Y. Ma, Feng Wang", "summary": "When Coulomb interactions dominate kinetic energy, dilute two-dimensional carriers form a Wigner solid. Both its melting and disorder-driven localization can drive density-tuned metal-insulator transitions, but their relative roles and interplay have been debated for decades. Atomically thin semiconductors offer a new test because transport and scanning tunneling microscopy can probe the same material, yet poor contacts impede transport where correlations are strongest. Here we introduce contact-free radio-frequency reflectometry that senses sheet resistance through capacitive gate coupling. It resolves the electron and previously inaccessible hole transitions in the same bilayer MoSe2 device, whose carriers share disorder but not mass. Their critical densities differ fourfold yet correspond to comparable Coulomb-to-kinetic-energy ratios, where tunneling microscopy finds solid-liquid coexistence. Magnetoresistance peaks sharply at each transition, reflecting a Pomeranchuk-like, field-driven expansion of the Wigner solid against the correlated liquid. Our results demonstrate interaction-driven transitions in high-quality two-dimensional semiconductors, opening quantitative transport in contact-limited systems.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Transport and STM investigation of interaction-driven transitions and Wigner solid formation in MoSe2.", "tags": ["experiment", "STM", "correlated"], "image": "https://arxiv.org/static/browse/0.3.4/images/arxiv-logo-fb.png", "briefing": {"background": "2차원 반도체 물질 내에서 캐리어 농도가 낮아지면 쿨롱 상호작용이 지배적이 되어 전자가 격자처럼 배열되는 '위그너 고체(Wigner Solid)'가 형성됩니다. 이를 관측하기 위해서는 순도가 높고 정밀한 제어가 필요한데, 기존의 수송 측정법은 접촉 저항 문제가 걸림돌이었습니다.", "motivation": "접촉 저항의 영향을 피할 수 있는 무접촉 방식의 RF 반사 측정법(RF reflectometry)을 개발하여, 이중층 MoSe2에서 전자와 정공 모두에 대한 금속-절연체 전이(MIT)를 관측하고자 하였습니다.", "result": "이중층 MoSe2에서 전자와 정공 각각의 MIT를 측정했으며, 위그너 고체와 액체 상태가 공존하는 영역을 확인했습니다. 또한, 자기장 하에서 위그너 고체가 팽창하는 포메란추크 효과를 관측했습니다.", "implication": "접촉 제한 없이 2D 반도체의 강상관 상태를 측정할 수 있는 기술을 확보했으며, MIT 메커니즘을 명확히 규명했습니다.", "novelty": "정공(hole) 시스템에 대한 접근이 매우 어려웠던 기존 한계를 극복하고, 전자-정공 대칭성 및 차이를 동시에 탐구한 점이 탁월합니다.", "unresolved": "샘플 간의 미세한 불순물(disorder) 차이가 MIT 임계값에 미치는 정량적인 영향을 완전히 분리하기 어렵습니다.", "future_work": "더 넓은 영역의 전이 물질군에 이 RF 측정법을 적용하고, 위그너 고체 상에서의 위상적 성질 연구.", "concepts": [{"term": "Wigner Solid", "why_emerged": "전자들 사이의 반발력이 운동 에너지보다 월등히 커질 때 격자 구조를 형성하는 상태를 설명하기 위해.", "origin": "Eugene Wigner (1934).", "connections": "강상관 전자계, 2D 전자 가스(2DEG), 분수 양자 홀 효과와 연결됨."}, {"term": "RF Reflectometry", "why_emerged": "낮은 캐리어 농도에서 오옴 접촉(ohmic contact)의 저항이 너무 높아 직접적인 전류 측정 불가능.", "origin": "양자점 소자 연구에서 정전용량 감지를 위해 주로 활용됨.", "connections": "커패시턴스 분광학 및 무접촉 수송 측정 기법."}], "english_summary": ["Introduced non-contact RF reflectometry for 2D semiconductor transport.", "Observed MIT and Wigner solid formation in bilayer MoSe2 for both electrons and holes.", "Revealed field-driven expansion of the Wigner solid, confirming interaction-driven transitions."]}}, {"title": "Anomalous Hall enhancement in fully compensated non-collinear antiferromagnetic Cr-doped Mn3Sn", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2610.09727", "authors": "Ying Zhang, Xin Chen, Hang Xie, Ziyan Luo, Yihong Wu, Lei Shen", "last_authors": "Yihong Wu, Lei Shen", "summary": "The non-collinear antiferromagnet (AFM), Mn 3 ​ Sn \\mathrm{Mn}_{3}\\mathrm{Sn} , exhibits ultrafast spin dynamics and negligible stray fields, making it a promising candidate meters. Our analysis begins by tracking the energy-dependent flows of fermion-fermion interactions. The interaction couplings go towards divergence at a critical energy scale, signaling quantum critical behavior. Such behavior is characterized by a certain fixed point (FP) whose characteristics depends intimately on structural parameters $d_{0,1,2,3}$ that cluster the microscopic model into rotationally symmetric and asymmetric cases. Then, we identify two stable FPs in the rotationally symmetric and nine additional FPs in asymmetric case dubbed FP$_{1-10}$. Their boundary conditions are approximately demarcated and established by linear and plane fitting techniques in the structural parameter space. Furthermore, we examine distinct interaction-driven instabilities nearby these FPs by incorporating the relevant external source terms and computing their susceptibilities. It indicates that the charge density wave and superconductivity become dominant at FP$_{2,4,5,6,8}$ and FP$_{1,9,10}$, while the $x$-current and bond density prevail at FP$_3$ and FP$_7$, respectively. In addition to these leading states, several underlying subordinate instabilities are presented as well. These results would be helpful to further study the low-energy critical behavior in 2D kagom\\'{e} QBCP and related materials.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Theoretical analysis of interaction-driven instabilities like CDW and superconductivity in kagome semimetals with TRSB.", "tags": ["theory", "kagome-semimetal", "CDW"], "image": "https://arxiv.org/html/2509.05558v3/fig1.png", "briefing": {"background": "2차원 카고메 금속과 같은 강한 상관관계 시스템에서 밴드 교차점(QBCP) 근처의 전자 상호작용은 CDW나 초전도성과 같은 다양한 양자 위상 변화를 유도합니다.", "motivation": "시간 반전 대칭이 깨진(TRSB) 카고메 세미메탈의 2차원 QBCP에서 가능한 16가지 페르미온 상호작용이 어떻게 경쟁하고 최종적으로 어떤 질서 매개변수를 유도하는지 체계적으로 분석하고자 합니다.", "result": "구조적 파라미터에 따라 11개의 서로 다른 고정점(Fixed Point)을 식별했습니다. 이를 통해 어떤 영역에서 CDW, 초전도성, 혹은 스핀 전류 및 본드 밀도 파가 우세하게 나타나는지 이론적 경계를 명확히 했습니다.", "implication": ble multi-dimensional irreducible ordering channels. We find distinct Landau theories for tetragonal, trigonal/hexagonal, and cubic symmetry. Similar to the case of spin-nematic fluids, we find two natural outcomes: a collapse to a lower-symmetry collinear phase or a genuinely coplanar or non-coplanar order where the order parameters form a mutually orthogonal set in spin space -- reminiscent of the $A$ and $B$ phases in ${}^3$He. We show in general that this symmetry-broken phase realizes the spin space group associated with the spatial representation of the order parameter sharing the same parent space group as the paramagnetic phase. This provides a direct link between the Landau and spin space group approaches. We calculate key observables using this Landau approach, including net magnetization, spin conductivity, multipolar moments, and piezomagnetism, connecting our results to constraints from the underlying spin space group. Examples of coplanar and non-coplanar magnetic orders for each case are worked out in detail. Finally, we discuss the relationship of the lower-symmetry collinear phases to the usual collinear spin groups, as well as connections to atomic altermagnetism, superfluid ${}^3$He and electronic nematic phases.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Explores Landau theory for magnetism beyond altermagnetism, including nematic phases and observables.", "tags": ["theory", "magnetism", "altermagnetism", "nematicity"], "image": "https://arxiv.org/html/2610.10523v1/1_N1N2N3.png", "briefing": {"background": "자성 물질의 상전이 연구에서 Landau 이론은 대칭성 분석을 통해 질서 매개변수의 형성 과정을 설명하는 핵심적인 방법론입니다.", "motivation": "최근 주목받는 '알터자성(Altermagnetism)'을 넘어, 더 복잡한 공면(coplanar) 및 비공면(non-coplanar) 자기 구조를 포함하는 일반적인 Landau 이론을 구축하고자 합니다.", "result": "정사면체, 삼각/육각, 입방 대칭성에 대해 4차 항까지의 자유 에너지를 유도했습니다. 특히 스핀 공간에서 3He의 A상 및 B상과 유사한 직교 질서 매개변수 구조가 자연스럽게 발생함을 보였습니다.", "implication": "자기 위상 전이 시 스핀 전달이나 비정상 홀 효과와 같은 관측 가능량을 대칭성 기반에서 훨씬 체계적으로 해석할 수 있게 됩니다.", "novelty": "기존의 공선형(collinear) 자성을 넘어선 다차원 질서 매개변수를 대칭성 그룹 이론과 연결하여, 알터자성 및 네마틱 위상을 포괄하는 통합적 관점을 제시합니다.", "unresolved": "실제 복잡한 자기 구조를 가진 물질에서의 실험 데이터와 이론적 자유 에너지 파라미터 간의 직접적인 정량적 매핑은 아직 과제로 남아있습니다.", "future_work": "새로 예측된 비공면 자기 위상의 특정 물성을 실험적으로 확인하기 위한 중성자 산란이나 광학 측정 제안이 필요합니다.", "concepts": [{"term": "Altermagnetism", "why_emerged": "공선형 자성이면서도 스핀 분리된 밴드 구조를 가지는 새로운 자성 상태를 설명하기 위해 필요했습니다.", "origin": "풍부한 이론적 제안이 있으나 최근 개념이 정립됨", "connections": "강자성, 반강자성과는 다른 대칭성 기반의 스핀 분리 현상."}, {"term": "Landau Theory", "why_emerged": "상전이 근처에서 자유 에너지를 질서 매개변수의 멱급수로 전개하여 현상을 이해하기 위해 필요합니다.", "origin": "Lev Landau", "connections": "모든 종류의 상전이 현상 설명에 필수적인 현상론적 도구."}], "english_summary": ["Generalized Landau theory for non-relativistic magnetic systems including coplanar and non-coplanar orders.", "Constructed symmetry-allowed free energies for various crystallographic point groups up to quartic order.", "Established links between Landau theory and spin space groups for magnetic observables.", "Provides a theoretical framework for beyond-altermagnetism phases and electronic nematicity."]}}, {"title": "Magnetic Order from First-Principles Linear Response", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2610.10412", "authors": "Yaroslav Zhumagulov, Emiliano Cruz-Aranda, Denis Kochan, Oleg V. Yazyev", "last_authors": "Denis Kochan, Oleg V. Yazyev", "summary": "The magnetic order of a material is usually predicted by comparing the energies of trial spin configurations, a strategy that cannot reach orders outside the chosen set and rapidly becomes intractable as the number of magnetic sites grows. We show that the order can instead be identified directly from the paramagnetic state: the leading eigenmodes of its self-consistent magnetization response, obtained with spin--orbit coupling at arbitrary wavevector within the primitive cell, determine both the ordering wavevector and the pattern of moments, with no candidate configurations. With no prior assumption about rmagnetic KV2Se2O, ferrimagnets, and spiral NiI2.", "Enables unbiased, systematic discovery of complex magnetic orders in quantum materials."]}}, {"title": "Magnon Polarization Textures and Transport in Antiferromagnets and Altermagnets", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2610.09035", "authors": "Konstantin S. Denisov, Igor \\v{Z}uti\\'c", "last_authors": "Konstantin S. Denisov, Igor \\v{Z}uti\\'c", "summary": "Antiferromagnets (AFMs) host magnons that can exhibit fully circular, elliptic and linear polarizations of sublattice magnetization dynamics. We analyze theoretically different momentum-space magnon polarization textures and magnon transport in collinear AFMs and altermagnets (AMs). The sensitivity of the polarization texture to a magnon momentum direction determines two regimes of magnon polarization kinetics: The Dyakonov-Perel relaxation or its dephasing due to asynchronous Larmor precession. For an easy-axis AFM, magnetic field parallel to the N{\\'e}el vector leads to the suppression of the magnetic dipolar interaction-induced Dyakonov-Perel relaxation, accompanied by the increase in the magnon spin-diffusion length and its counter-intuitive growth with temperature. For a perpendicular orientation, instead, relaxation of circular polarization of magnons is enhanced due to Larmor precession. Finally, extremely anisotropic relaxation of magnon polarization is predicted for AMs or AFMs having Dzyaloshinskii-Morya interaction.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Relevant theory on altermagnetism and magnon transport, focusing on momentum-space textures and relaxation.", "tags": ["theory", "altermagnet", "magnon"], "image": "https://arxiv.org/html/2610.09035v1/Fig1_L.png", "briefing": {"background": "반강자성체(AFM)와 최근 주목받는 알터자성체(Altermagnet)에서 스핀 자유도를 정보 전달에 활용하기 위한 마그논(magnon)의 거동 이해가 중요해지고 있습니다.", "motivation": "마그논의 편극(polarization)이 운동량에 따라 어떤 질감을 갖는지, 그리고 외부 자기장 및 DMI 상호작용 하에서 어떻게 완화되는지 이론적으로 규명하고자 합니다.", "result": "마그논 편극 질감이 운동량 방향에 따라 변하며, 특정 자기장 방향에서 다이아코노프-페렐(Dyakonov-Perel) 완화가 억제되어 스핀 확산 거리가 증가할 수 있음을 보였습니다.", "implication": "알터자성체나 AFM을 이용한 스핀트로닉스 소자에서 마그논의 수명과 수송 특성을 자기장으로 제어할 수 있는 가능성을 제시합니다.", "novelty": "알터자성체에서의 극단적인 이방성 마그논 완화를 예측하였으며, 이는 위상학적 스핀 구조 및 자성 위상과 연관되어 향후 마그논 기반 정보 처리 기술에 응용될 수 있습니다.", "unresolved": "실제 복잡한 격자 구조나 다중 밴드 효과가 있는 알터자성체에서의 정량적인 실험적 검증이 부족합니다.", "future_work": "DMI가 강한 실제 알터자성체 물질에서 비탄성 중성자 산란이나 마그논 분광법을 통한 실험적 확인이 필요합니다.", "concepts": [{"term": "알터자성체", "why_emerged": "기존 강자성/반강자성의 경계를 넘어, 시간에 반전 대칭성이 깨져있으되 순자화가 없는 새로운 자성 상태를 탐구하기 위해 필요함.", "origin": "최근 2020년대 초반 루테늄 산화물 등에서 이론적으로 제안됨.", "connections": "반강자성체, 비상반성 수송, 베리 곡률과 연결됨."}, {"term": "다이아코노프-페렐 완화", "why_emerged": "전도 전자의 스핀이 운동량에 따라 변하는 유효 자기장에 의해 완화되는 현상을 설명하기 위해 제안됨.", "origin": "1971년 Dyakonov와 Perel에 의해 제안됨.", "connections": "스핀-궤도 결합(SOC), 전자 스핀 수송, 라시바(Rashba) 효과와 연결됨."}], "english_summary": ["Theoretical analysis of magnon polarization textures in antiferromagnets and altermagnets.", "Identified that magnon spin-diffusion length can be enhanced by suppressing Dyakonov-Perel relaxation.", "Predicted highly anisotropic relaxation mechanisms in altermagnets with DMI.", "Suggests routes for controlling magnon transport via magnetic field orientation."]}}, {"title": "Origin of superconductivity in bilayer nickelates: a Quantum Monte Carlo study for a sign-problem-free effective model (Phys. Rev. B)", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2512.09025", "authors": "Xu Zhang", "last_authors": "Xu Zhang", "summary": "Using determinant Quantum Monte Carlo, we investigate the interplay between doping, inter-layer tunneling and onsite Hund's coupling in stabilizing superconductivity (SC) in a two-orbital model for the bilayer nickelate $\\text{La}_3\\text{Ni}_2\\text{O}_7$. With realistic dispersion and for certain values of the interaction parameters, the auxiliary-field-decoupled fermion Hamiltonian has Kramers anti-unitary symmetries which guarantee the absence of a sign problem. The same anti-unitary symmetries can also be used to show there is a second instability towards $(\\pi,\\pi)$ inter-layer bond order (BO) in the strong interaction limit. We indicate the possible connection between this bond order and the enigmatic density wave state observed in experiment, and clarify the decisive role played by the inter-layer tunneling in the competition between SC and BO. Finally, possible directions on how to enhance the SC transition temperature and stabilize the SC phase are also discussed.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "QMC study of bilayer nickelate superconductivity and its competition with inter-layer bond order.", "tags": ["QMC", "La3Ni2O7", "superconductivity"], "image": "https://arxiv.org/html/2512.09025v2/FSBD.png", "briefing": {"background": "La3Ni2O7 이중층 니켈산염에서의 고온 초전도 현상은 도핑과 전자 상관관계의 복잡한 상호작용으로 인해 큰 주목을 받고 있습니다.", "motivation": "이 물질의 초전도성과 경쟁하거나 공존하는 기저 상태(Bond Order 등)의 기원을 QMC 기법을 통해 규명하고자 합니다.", "result": "이중층 니켈산염의 효과적인 모델에서 초전도성과 (π,π) 층간 결합 차수(Bond Order) 간의 경쟁을 확인하였으며, 층간 터널링이 이 경쟁의 결정적 요인임을 밝혔습니다.", "implication": "층간 터널링을 조절함으로써 초전도 전이 온도를 높이거나 특정 상태를 안정화할 수 있는 설계 원리를 제공합니다.", "novelty": "부호 문제(sign-problem)가 없는 효율적인 모델을 통해 니켈산염의 전이 현상을 계산하여 실험에서 관측된 밀도파(density wave) 상태와의 연결 고리를 제시했습니다.", "unresolved": "실제 La3Ni2O7의 격자 왜곡이나 궤도 선택적 상관관계가 모델에 미치는 세부 영향은 여전히 논쟁적입니다.", "future_work": "보다 현실적인 Hubbard 모델 기반의 계산과 고압 하에서의 구조적 변화를 고려한 시뮬레이션이 필요합니다.", "concepts": [{"term": "부호 문제", "why_emerged": "QMC 시뮬레이션에서 확률 가중치가 음수가 되어 통계적 정확도가 급격히 떨어지는 고질적인 병목 현상임.", "origin": "초기 QMC 연구들에서 통계물리학적 난제로 식별됨.", "connections": "페르미온 시스템, Hubbard 모델, 강력한 전자 상관계와 연결됨."}, {"term": "층간 결합 차수 (Bond Order)", "why_emerged": "이중층 구조에서 전자들이 층간 결합을 형성하며 발생하는 공간적 질서를 설명하기 위해 도입됨.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "밀도파(CDW/SDW), 초전도 경쟁, 고온 초전도 위상도와 연결됨."}], "english_summary": ["Investigated superconductivity and inter-layer bond order in bilayer La3Ni2O7 using Determinant QMC.", "Demonstrated that inter-layer tunneling is the key parameter competing with superconductivity.", "Connected the bond order state to experimental observations of enigmatic density waves.", "Identified parameter conditions for stabilizing the superconducting phase."]}}, {"title": "Paramagnon softening upon doping in oxychloride cuprate superconductors", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2610.05160", "authors": "Chafic Fawaz, L\\'eo Gaspard, Laura Chaix, et al.", "last_authors": "Benjamin Lenz, Matteo d'Astuto", "summary": "Understanding how magnetic excitations and exchange interactions evolve with doping is crucial for deciphering the physics that shapes the phase diagram of high-temperature cuprate superconductors. Here, we clearly determine the behavior of the paramagnon dispersion in the oxychloride cuprate Na$_{x}$Ca$_{2-x}$CuO$_2$Cl$_2$ up to the highest doping level. We find that the paramagnon bandwidth, defined by the energy at the $X$ zone boundary $(0.5,0,0)$, remains unchanged within experimental uncertainty, even though it exhibits significant broadening. In contrast, along the nodal direction $\\Gamma-M$ (\\textit{i.e.}, from $(0,0,0)$ to $(0.5,0.5,0)$), the paramagnon energy shows a marked softening with doping, with a shift of up to $\\Delta E\\sim150$ meV at the midpoint of the zone for the highest doping, which is about half of its initial value in the antiferromagnetic phase. Calculations of the dynamical spin structure factor for a one-band Hubbard model, including hopping terms up to the third-nearest neighbor ($t^{\\prime\\prime}$), explain this behavior and accurately reproduce the observed wave vector dependence and directional variation in the Brillouin zone.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Important study on the evolution of magnetic excitations in unconventional cuprate superconductors.", "tags": ["cuprates", "paramagnons", "Hubbard"], "image": "https://arxiv.org/html/2610.05160v2/structure.png", "briefing": {"background": "구리 산화물(cuprate) 고온 초전도체에서 도핑에 따른 자기 들뜸(paramagnon)의 진화는 초전도 메커니즘을 이해하는 핵심 정보입니다.", "motivation": "옥시염화물 구리 산화물(Na-CCOC)의 도핑 수준에 따른 파라마그논 분산 관계의 변화를 실험적으로 확인하고자 합니다.", "result": "파라마그논 대역폭은 도핑에 관계없이 일정하지만, 마디 방향(nodal direction)에서 강한 에너지 연화(softening)가 나타남을 관측했습니다.", "implication": "Hubbard 모델 계산이 실험 결과를 재현함을 통해, 강하게 상관된 전자계에서의 스핀 들뜸 거동이 도핑에 의해 어떻게 제어되는지 확인했습니다.", "novelty": "비교적 깨끗한 시스템인 옥시염화물 구리 산화물에서 도핑에 따른 파라마그논의 이방성 연화를 명확히 규명하였습니다.", "unresolved": "이 연화가 초전도 쌍 형성에 직접적으로 기여하는지 여부와 다른 고온 초전도체군과의 정량적 차이점은 여전히 연구가 필요합니다.", "future_work": "ARPES를 이용한 전자 구조 변화와 파라마그논의 상호작용을 직접적으로 비교하는 연구가 후속되어야 합니다.", "concepts": [{"term": "파라마그논", "why_emerged": "반강자성 질서가 사라진 영역에서도 잔류하는 스핀 들뜸을 설명하기 위해 도입됨.", "origin": "구리 산화물 고온 초전도체 연구 초기부터 논의됨.", "connections": "스핀 요동, Hubbard 모델, 쿠퍼 쌍 형성 기제와 연결됨."}, {"term": "에너지 연화 (Softening)", "why_emerged": "계의 불안정성이 증가하거나 상전이가 일어날 때 들뜸 에너지가 0으로 향하는 현상을 설명하기 위해 사용됨.", "origin": "격자 동역학 연구에서 유래.", "connections": "위상 전이, 스핀 밀도파, 초전도와 연결됨."}], "english_summary": ["Studied paramagnon dispersion in Na-CCOC across the doping phase diagram.", "Observed significant energy softening along the nodal direction despite unchanged bandwidth.", "Validated one-band Hubbard model predictions including third-nearest neighbor hopping.", "Provides insight into magnetic excitation evolution in unconventional cuprate superconductors."]}}, {"title": "Regulating oxygen content and superconductivity in La3Ni2O7+ (The Innovation Physics)", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2605.04562", "authors": "Peiyue Ma, Jingyuan Li, Xing Huang, et al.", "last_authors": "Hualei Sun, Meng Wang", "summary": "The synthesis of high-quality Ruddlesden-Popper (RP) nickelates remains challenging due to variations in oxygen content and the prevalence of intergrown RP phases. Precisely controlling the stoichiometry and characterizing the resulting physical properties are essential for understanding the mechanism of high-$T_c$ superconductivity in these materials. In this work, we synthesize a series of La$_3$Ni$_2$O$_{7+\\delta}$ samples with systematically controlled oxygen content and perform comprehensive structural and compositional analyses. Precise oxygen tuning enables us to tailor the microstructure, yielding a pure bilayer phase, a mixture of bilayer and hybrid single-layer-bilayer phases, and a predominantly bilayer phase containing trilayer intergrowths. High-pressure transport measurements reveal distinct superconducting transitions with contrasting $T_c$ values, corresponding to the bilayer phase, the hybrid phase, and trilayer inclusions. Notably, we find that oxygen content not only governs the phase purity$-$i.e., the presence of intergrowth phases$-$but also directly modulates the upper critical field ($H_{c2}$) of the bilayer superconductivity. By establishing a phase diagram of $T_c$ and $H_{c2}$ as functions of oxygen content in La$_3$Ni$_2$O$_{7+\\delta}$, this work advances synthetic control and provides new insights into the superconducting mechanism of RP nickelates.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Direct experimental synthesis and transport study of unconventional superconductivity in high-Tc nickelates.", "tags": ["material", "superconductivity", "nickelate"], "image": "https://arxiv.org/html/2605.04562v2/Fig0.png", "briefing": {"background": "La3Ni2O7은 최근 고압 환경에서 80K 수준의 고온 초전도성을 보이는 것으로 알려지며 니켈계 초전도체 연구의 핵심 물질로 부상했습니다. 그러나 Ruddlesden-Popper(RP) 구조의 특성상 산소 함량 조절과 상 순도 유지가 매우 어려워 물리적 성질의 재현성에 논란이 있었습니다.", "motivation": "이 연구는 산소 함량(delta)에 따른 미세구조 변화가 실제 초전도 전이 온도(Tc)와 상한 임계 자기장(Hc2)에 미치는 영향을 체계적으로 규명하여, 물질 합성을 최적화하고 초전도 메커니즘을 규명하고자 수행되었습니다.", "result": "산소 함량을 정밀 제어하여 순수한 이중층 구조부터 단일층/이중층 혼합상, 삼중층이 포함된 구조까지 성공적으로 합성했습니다. 고압 수송 측정 결과, 각 상에 따라 초전도 특성과 Hc2가 명확히 구분됨을 확인했습니다.", "implication": "La3Ni2O7의 초전도성이 구조적 순도와 산소 공공 함량에 극도로 민감함을 입증했습니다. 이는 향후 고압 연구에서 결과의 재현성을 확보하기 위한
