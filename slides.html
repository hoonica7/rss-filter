<!DOCTYPE html>

<head>
<meta charset='UTF-8'>
<meta name='viewport' content='width=device-width, initial-scale=1.0'>
<title>Daily Paper Slideshow</title>
<style>
  :root {
    color-scheme: light;
    --bg: #f6f7f4;
    --paper: #ffffff;
    --ink: #111827;
    --muted: #64748b;
    --line: #d8ddd2;
    --accent: #176b87;
    --accent-2: #9a3412;
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; overflow: auto; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: var(--bg); color: var(--ink); }
  .shell { max-width: 1500px; min-height: 100vh; margin: 0 auto; padding: 14px 18px; display: flex; flex-direction: column; }
  .topbar { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 16px; }
  .top-actions { display: flex; align-items: center; gap: 10px; }
  .topbar a, button { border: 1px solid var(--line); border-radius: 8px; background: var(--paper); color: var(--ink); padding: 10px 14px; font-weight: 700; text-decoration: none; cursor: pointer; }
  button.primary { background: var(--accent); border-color: var(--accent); color: white; }
  button:disabled { opacity: 0.45; cursor: not-allowed; }
  .counter { color: var(--muted); font-weight: 700; }
  .slide { min-height: calc(100vh - 82px); background: var(--paper); border: 1px solid var(--line); border-radius: 10px; padding: 18px; box-shadow: 0 18px 42px rgba(15, 23, 42, 0.10); display: grid; grid-template-columns: minmax(310px, 0.86fr) minmax(0, 1.55fr); gap: 18px; overflow: visible; }
  .paper-head { min-width: 0; min-height: 0; overflow: visible; display: flex; flex-direction: column; gap: 12px; }
  .figure { margin: 0; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: #f8fafc; }
  .figure img { display: block; width: 100%; max-height: 41vh; object-fit: contain; background: white; }
  .figure figcaption { padding: 7px 10px; color: var(--muted); font-size: 12px; line-height: 1.3; }
  .head-text { display: flex; flex-direction: column; gap: 9px; min-width: 0; }
  .badges { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .badge { border-radius: 999px; padding: 5px 9px; background: #eef2ff; color: #3730a3; font-size: 12px; font-weight: 800; }
  .score { background: #fee2e2; color: #991b1b; }
  h1 { margin: 0; font-size: 25px; line-height: 1.15; letter-spacing: 0; overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
  h1 a { color: inherit; text-decoration-color: rgba(23, 107, 135, 0.35); text-decoration-thickness: 2px; text-underline-offset: 4px; }
  h1 a:hover { color: var(--accent); text-decoration-color: var(--accent); }
  .meta, .authors, .why, .abstract { font-size: 13px; line-height: 1.45; }
  .meta, .authors { color: var(--muted); }
  .why strong, .abstract strong, .authors strong { color: var(--ink); }
  .authors { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .why { border-left: 4px solid var(--accent-2); padding-left: 10px; color: #374151; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .abstract { border-top: 1px solid var(--line); padding-top: 14px; color: #374151; }
  .original-abstract { border-top: 1px solid var(--line); padding-top: 10px; color: #374151; font-size: 11.5px; line-height: 1.35; overflow-wrap: anywhere; }
  .original-abstract strong { display: block; margin-bottom: 4px; color: var(--ink); }
  .tags { display: flex; flex-wrap: wrap; gap: 8px; }
  .tag { border-radius: 999px; padding: 4px 8px; background: #f1f5f9; color: #475569; font-size: 12px; font-weight: 700; }
  .head-text > .link { display: none; }
  .briefing { min-width: 0; min-height: 0; overflow: visible; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); grid-auto-rows: minmax(0, auto); align-content: start; gap: 11px 18px; border-top: 0; padding-top: 0; }
  .brief-section { min-width: 0; }
  .brief-section.wide { grid-column: 1 / -1; }
  .brief-section h2 { margin: 0 0 4px; font-size: 14px; line-height: 1.22; color: #0f766e; letter-spacing: 0; }
  .brief-section p, .brief-section li { margin: 0; font-size: 12.5px; line-height: 1.42; color: #1f2937; overflow-wrap: anywhere; }
  .brief-section ul { margin: 0; padding-left: 20px; }
  .concepts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 9px 14px; }
  .concept { border-top: 1px solid var(--line); padding-top: 7px; }
  .concept h3 { margin: 0 0 4px; font-size: 13px; color: #7c2d12; letter-spacing: 0; }
  .concept p { margin: 2px 0 0; font-size: 11.5px; line-height: 1.35; color: #374151; overflow-wrap: anywhere; }
  .concept b { color: #111827; }
  .link { color: var(--accent); font-weight: 800; text-decoration: none; }
  .empty { padding: 48px; background: var(--paper); border: 1px solid var(--line); border-radius: 12px; color: var(--muted); }
  @media (max-width: 860px) {
    .shell { padding: 14px; }
    .topbar, .top-actions { align-items: stretch; flex-direction: column; }
    .slide, .briefing, .concepts { grid-template-columns: 1fr; }
    .slide { min-height: auto; overflow: visible; display: grid; }
    h1 { font-size: 28px; }
  }
</style>

<script>
const slides = [{"title": "Intracycle Interference in Strong-Field Photoemission from a Tungsten Needle Tip", "journal": "PRL_Recent", "source": "keyword", "link": "http://link.aps.org/doi/10.1103/t87j-1ngl", "authors": "Timo Wirth, Jonas Heimerl, Stefan Meier, Peter Hommelhoff", "last_authors": "Stefan Meier, Peter Hommelhoff", "summary": "Electrons photoemitted by strong laser fields can rescatter, generating attosecond high harmonics. Spectral peaks arise from inter- and intracycle interference of coherent electron wave packets. While intercycle interference is well known, intracycle interference of plateau electrons has not been ob…", "tier": "A_MUST_READ", "score": "9", "reason": "title strong match: photoemission", "tags": ["photoemission"], "image": "", "briefing": {"background": "강한 레이저 장(strong field) 하에서 금속 표면의 전자는 터널링을 통해 방출되며, 방출된 전자가 다시 금속으로 돌아와 산란되는 재산란(rescattering) 과정을 거칩니다. 이 과정은 고차 조화파 생성 및 아토초(attosecond) 물리 연구의 기초가 됩니다.", "motivation": "레이저 펄스의 여러 주기 사이의 간섭(intercycle interference)은 잘 알려져 있으나, 단일 주기 내의 간섭(intracycle interference)에 의한 고에너지 '플래토(plateau)' 전자의 거동은 텅스텐 침상 팁(needle tip) 실험에서 명확히 관찰된 바가 적어 이를 규명하고자 했습니다.", "result": "텅스텐 나노팁에서의 강장 광전자 방출 실험을 통해, 재산란된 전자 파동 함수들 사이의 주기에 따른 간섭 패턴을 성공적으로 분리하고 관찰하였습니다. 특히 플래토 영역 전자의 에너지 스펙트럼에서 나타나는 미세한 진동 구조가 주 내 간섭(intracycle interference)에 기인함을 확인했습니다.", "implication": "고체 물리적 환경(나노 팁)에서 전자 파동의 위상 제어 가능성을 입증하였으며, 이는 나노 규모의 아토초 전자 소자 및 광전자 분광법의 시간 분해능을 극한으로 끌어올리는 데 기여할 수 있습니다.", "novelty": "기존 원자/분자 기체 실험에서 주로 다루던 주 내 간섭 현상을 실제 금속 나노 구조물에서 구현하고 증명했다는 점이 독창적입니다. 독자의 관심사인 광전자 방출(photoemission)의 양자 역학적 미세 기작을 다룹니다.", "unresolved": "실험에서 관찰된 간섭 가시성(visibility)이 이론적 예측보다 낮을 수 있으며, 이는 나노팁 표면의 불균일성이나 열적 효과에 의한 것인지 추가 확인이 필요합니다.", "future_work": "레이저의 파장이나 펄스 모양을 정밀하게 변조하여 전자 방출 타이밍을 제어하고, 이를 활용한 초고속 전자 회로 및 분광 기술로의 응용이 기대됩니다.", "concepts": [{"term": "Intracycle Interference", "why_emerged": "단일 광주기 내에서 서로 다른 경로로 방출된 전자 파동 함수들이 간섭을 일으켜 에너지 스펙트럼에 영향을 주기 때문에 도입되었습니다.", "origin": "강장 물리 및 아토초 과학 분야의 이론적 연구에서 제안됨", "connections": "Intercycle interference, Attosecond pulse generation"}, {"term": "Rescattering", "why_emerged": "방출된 전자가 외부 전기장에 의해 가속되어 다시 모체로 돌아와 충돌하는 현상을 설명하기 위해 도입되었습니다.", "origin": "P. B. Corkum (1993) 등이 제안한 Three-step model", "connections": "High-harmonic generation (HHG), Above-threshold ionization (ATI)"}, {"term": "Tungsten Needle Tip", "why_emerged": "강한 국부 전기장을 형성하여 낮은 레이저 출력으로도 강장 물리 현상을 관찰하기 위한 시료로 선택되었습니다.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "Field emission, Tip-enhanced spectroscopy"}, {"term": "Plateau Electrons", "why_emerged": "광전자 스펙트럼에서 에너지가 완만하게 유지되다 급격히 떨어지는 고에너지 영역의 전자를 지칭합니다.", "origin": "강장 광이온화 연구에서 발견됨", "connections": "Elastic scattering, Quiver energy"}], "english_summary": ["Observed intracycle interference of plateau electrons in strong-field photoemission from tungsten tips.", "Identified sub-cycle electron wave packet dynamics using high-resolution photoelectron spectroscopy.", "Demonstrated the coherence of rescattered electrons in a solid-state nanostructure environment.", "Provides insights for developing attosecond-scale electron control in metallic systems."]}}, {"title": "Electronic structure, quasiparticle renormalizations, and magnetic correlations in the alternating single-layer bilayer nickelate La5Ni3O11", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/4dmx-knsn", "authors": "I. V. Leonov", "last_authors": "I. V. Leonov", "summary": "Using the $\\mathrm{DFT}\\phantom{\\rule{0.16em}{0ex}}+$ dynamical mean-field theory ($\\mathrm{DFT}+\\mathrm{DMFT}$) method, we study the normal-state electronic structure, orbital-dependent quasiparticle renormalizations, Fermi surface, and magnetic correlations in the recently discovered alternating s…", "tier": "B_IMPORTANT_CONDMAT", "score": "9", "reason": "High relevance to nickelate electronic structure and ARPES interpretation.", "tags": ["nickelate", "electronicstructure", "DMFT"], "image": "", "briefing": {"background": "최근 무한 층(infinite-layer) 및 Ruddlesden-Popper(RP) 구조의 니켈레이트에서 초전도성이 발견되면서, 구리 산화물 초전도체와 유사하면서도 다른 전자 구조적 특성을 이해하는 것이 중요해졌습니다.", "motivation": "단일층(n=1)과 이중층(n=2) 구조가 번갈아 나타나는 새로운 니켈 산화물 La5Ni3O11의 전자 구조, 오비탈 의존적 준입자 재규격화, 그리고 자기적 상관관계를 DFT+DMFT 방법으로 분석하고자 합니다.", "result": "La5Ni3O11에서 강한 전자 상관관계로 인한 유효 질량 증가(재규격화)를 확인하였으며, 페르미 면의 형상과 니켈 3d 오비탈의 점유 상태를 도출했습니다. 특히 층 간의 구조적 차이가 자기적 불안정성에 미치는 영향을 분석했습니다.", "implication": "서로 다른 층 구조가 혼합된 시스템에서의 전자 상관관계를 이해함으로써, 니켈레이트 초전도 메커니즘에서 층의 개수와 적층 방식이 수행하는 역할을 규명하는 데 도움을 줍니다.", "novelty": "흔치 않은 단일-이중층 교대 구조인 La5Ni3O11에 집중하여, 기존 단일 성분계 니켈레이트와 차별화된 전자 구조 데이터를 제공합니다. 독자의 관심사인 ARPES 데이터 해석 및 DFT+DMFT 계산과 밀접한 관련이 있습니다.", "unresolved": "계산 결과가 실제 실험(특히 저온 ARPES나 중성자 산란)과 어느 정도 일치하는지 확인하기 위한 고품질 단결정 데이터가 필요합니다.", "future_work": "이 물질에서의 도핑 효과에 따른 상도표 변화 조사 및 초전도 발현 가능성에 대한 추가 연구가 예상됩니다.", "concepts": [{"term": "DFT+DMFT", "why_emerged": "밀도범함수이론(DFT)이 설명하지 못하는 강상관 전자계의 동역학적 효과와 국부적 상관관계를 정확히 계산하기 위해 도입되었습니다.", "origin": "Anisimov, Kotliar, Georges 등 (1990년대 후반)", "connections": "Strongly correlated systems, Hubbard model"}, {"term": "Nickelate (La5Ni3O11)", "why_emerged": "구리 산화물 초전도체의 대안으로서 새로운 고온 초전도 후보 물질군을 탐색하는 과정에서 발견되었습니다.", "origin": "최근 결정 구조 합성 연구를 통해 보고됨", "connections": "Ruddlesden-Popper phases, Unconventional superconductivity"}, {"term": "Quasiparticle Renormalization", "why_emerged": "전자 간의 상호작용으로 인해 전자의 유효 질량이 무거워지는 현상을 정량화하기 위해 사용됩니다.", "origin": "Landau's Fermi liquid theory", "connections": "Effective mass, Self-energy"}, {"term": "Fermi Surface", "why_emerged": "금속의 전기적, 자기적 성질을 결정하는 운동량 공간상의 에너지 경계를 이해하기 위해 필수적입니다.", "origin": "Felix Bloch, Rudolf Peierls 등", "connections": "ARPES, Quantum oscillations"}], "english_summary": ["Investigated the electronic structure of the alternating single-layer/bilayer nickelate La5Ni3O11 using DFT+DMFT.", "Calculated orbital-dependent quasiparticle renormalizations and identified magnetic correlation patterns.", "Revealed how the mixed-layer stacking influences the Fermi surface topology.", "Provides a theoretical baseline for interpreting future ARPES and transport experiments on this compound."]}}, {"title": "Fermi-surface-driven linear magnetoresistance in the kagome magnet TbMn6Sn6", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/grzw-y5lz", "authors": "Sicheng Zhou, Ruihuan Duan, Jie Pang, et al.", "last_authors": "Guangtong Liu, Li Lu", "summary": "Here, the authors identify a Fermi surface driven mechanism for positive linear magnetoresistance in the kagome ferrimagnet TbMn 6 Sn 6 . Measurements on multiple nanoflake devices reveal pronounced linear magnetoresistance, with substantial device-to-device variations in both its slope and the quadratic-to-linear crossover field. Combining magnetotransport experiments with first-principles-based semiclassical calculations, the authors demonstrate how the relaxation time and small shifts in chemical potential govern these variations. These findings provide insight into the microscopic origin of linear magnetoresistance and, in particular, its emergence at relatively low crossover fields.", "tier": "B_IMPORTANT_CONDMAT", "score": "9", "reason": "Direct study of kagome magnets using transport and Fermi surface analysis; excellent match.", "tags": ["kagome", "transport", "fermisurface"], "image": "", "briefing": {"background": "카고메(Kagome) 격자 물질은 기하학적 좌절(frustration)과 위상학적 밴드 구조(플랫 밴드, 디락 점)로 인해 독특한 수송 특성을 나타내며, 최근 TbMn6Sn6와 같은 자성 카고메 금속이 주목받고 있습니다.", "motivation": "TbMn6Sn6에서 관찰되는 선형 자기저항(Linear Magnetoresistance, LMR)의 미시적 기원을 밝히고, 왜 시료마다 수송 특성(기울기 및 전이 자기장)이 다르게 나타나는지 규명하고자 합니다.", "result": "나노 박막 소자 실험과 반고전적(semiclassical) 계산을 결합하여, LMR이 양자 한계(quantum limit)가 아닌 페르미 면 구조 자체에서 기인함을 보였습니다. 특히 완화 시간(relaxation time)과 화학 포텐셜의 미세한 변화가 LMR의 거동을 결정하는 핵심 요소임을 확인했습니다.", "implication": "카고메 자성체에서 나타나는 특이한 수송 현상을 페르미 면의 기하학적 특성과 산란 메커니즘으로 설명할 수 있음을 입증하여, 위상 물질의 소자 응용 시 성능 조절 지표를 제공합니다.", "novelty": "TbMn6Sn6의 LMR을 단순한 위상적 효과로만 치부하지 않고, 페르미 면 기반의 수치 계산을 통해 장치 간 편차까지 성공적으로 설명했다는 점이 우수합니다. 독자의 핵심 관심사인 카고메 금속 및 수송 특성 연구와 직결됩니다.", "unresolved": "화학 포텐셜의 미세한 이동이 구체적으로 어떤 결함이나 도핑에 의해 유도되는지, 그리고 베리 곡률(Berry curvature)과의 정량적 연결 고리는 더 탐구되어야 합니다.", "future_work": "게이트 전압이나 화학적 도핑을 통해 화학 포텐셜을 정밀하게 조절하며 LMR의 변화를 관찰하는 실험이 유효할 것입니다.", "concepts": [{"term": "Kagome Magnet", "why_emerged": "자성 원자가 카고메 격자를 이룰 때 발생하는 위상적 전자 구조와 자기적 정렬의 상호작용을 연구하기 위해 도입되었습니다.", "origin": "전통적 격자 구조 연구에서 유래, 최근 위상 물성 연구로 재조명", "connections": "TbMn6Sn6, Mn3Sn, Berry curvature"}, {"term": "Linear Magnetoresistance (LMR)", "why_emerged": "일반적인 금속의 이차함수적 자기저항과 달리 자기장에 선형으로 비례하는 특이 현상을 설명하기 위해 연구됩니다.", "origin": "Piotr Kapitza (초기 관찰), Abrikosov (양자 한계 이론)", "connections": "Quantum limit, Fermi surface topology"}, {"term": "Relaxation Time", "why_emerged": "전자가 산란되어 평형 상태로 돌아가는 평균적인 시간을 의미하며, 수송 계수를 결정하는 핵심 변수입니다.", "origin": "Drude model", "connections": "Mean free path, Conductivity"}, {"term": "Semiclassical Calculation", "why_emerged": "양자역학적 밴드 구조를 바탕으로 전자의 운동을 고전적인 방정식으로 기술하여 실제 수송 특성을 예측하기 위해 사용됩니다.", "origin": "Boltzmann transport theory", "connections": "Drude-Sommerfeld model, Hall effect"}], "english_summary": ["Identified a Fermi-surface-driven mechanism for linear magnetoresistance (LMR) in the kagome magnet TbMn6Sn6.", "Combined nanodevice transport measurements with semiclassical calculations to explain device-to-device variations.", "Attributed the LMR and its crossover field to relaxation time and minor shifts in chemical potential.", "Demonstrated that electronic structure details, rather than just quantum limits, govern the transport in this topological material."]}}, {"title": "Unveiling High-Energy Ultrafast Responses Driven by Fermi-Level Gap Opening in Charge-Density Waves", "journal": "PRL_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/vz71-r52l", "authors": "Qiong Wu, Tianchen Hu, Junhan Huang, et al.", "last_authors": "Tao Dong, Nan-Lin Wang", "summary": "Ultrafast pump-probe spectroscopy is indispensable for investigating interactions, collective excitations, and nonequilibrium dynamics in superconductors and correlated electron systems. However, how a small gap opening near the Fermi surface affects the spectral changes in the high-energy interband…", "tier": "B_IMPORTANT_CONDMAT", "score": "9", "reason": "Highly relevant to CDW studies and ultrafast spectroscopy on correlated systems.", "tags": ["CDW", "ultrafast", "spectroscopy"], "image": "", "briefing": {"background": "전하 밀도 파동(CDW)은 고체 내 전자 밀도가 주기적으로 변조되는 현상으로, 페르미 준위 근처에서 에너지 갭을 형성합니다. 초고속 펌프-프로브 분광학은 이러한 갭의 동역학과 전하-격자 간의 상호작용을 비평형 상태에서 탐구하는 핵심 도구입니다.", "motivation": "기존 연구들은 주로 페르미 준위 근처의 저에너지 동역학에 집중해 왔습니다. 본 연구는 페르미 준위에서의 작은 갭 형성이 어떻게 고에너지 대역(high-energy interband)의 광학적 응답에 영향을 미치는지 규명하고자 합니다.", "result": "CDW 형성에 따른 페르미 준위 갭 개방이 고에너지 전이 스펙트럼의 변화와 직접적으로 연결됨을 발견했습니다. 이는 저에너지의 전자 구조 변화가 광범위한 에너지 대역의 비평형 응답을 구동할 수 있음을 시사합니다.", "implication": "고에너지 대역의 광학적 신호를 통해 CDW 상태의 질서 매개변수(order parameter)를 역으로 추적할 수 있는 새로운 진단 경로를 제시합니다.", "novelty": "저에너지 갭 물리와 고에너지 분광 응답 사이의 상관관계를 명확히 규명했다는 점이 혁신적입니다. 독자의 관심사인 kagome 금속(AV3Sb5) 내 CDW 동역학 해석에도 중요한 통찰을 제공할 수 있습니다.", "unresolved": "실험적으로 관찰된 고에너지 변화가 특정 밴드 구조의 변형 때문인지, 아니면 다체 상호작용의 변화 때문인지에 대한 정밀한 이론적 구분이 더 필요합니다.", "future_work": "다양한 온도 및 펌프 광 에너지 조건에서 실험을 반복하여, CDW 전이의 범용적인 고에너지 지문을 확립할 필요가 있습니다.", "concepts": [{"term": "Charge-Density Wave (CDW)", "why_emerged": "금속-절연체 전이 및 저차원 전자계의 불안정성을 설명하기 위해 도입되었습니다.", "origin": "Rudolf Peierls (1930년대 이론적 예측)", "connections": "Kagome 금속, Peierls transition, 고온 초전도체 비정상성"}, {"term": "Ultrafast Pump-Probe Spectroscopy", "why_emerged": "전자와 격자의 상호작용이 일어나는 펨토초 단위의 시분해능을 확보하기 위해 개발되었습니다.", "origin": "초록 정보만으로는 특정하기 어려움 (레이저 기술 발전에 기인)", "connections": "Floquet 엔지니어링, 비평형 상전이, TR-ARPES"}, {"term": "Fermi-Level Gap Opening", "why_emerged": "전자 계의 에너지를 낮추기 위한 구조적/자기적 대칭성 파괴의 결과로 발생합니다.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "금속-절연체 전이, 초전도 갭, Mott 절연체"}, {"term": "Interband Transition", "why_emerged": "고체의 전자 밴드 간 에너지 차이를 측정하여 전체적인 전자 구조를 이해하기 위해 사용됩니다.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "광학 전도도(Optical Conductivity), 유전 함수"}], "english_summary": ["Investigates the link between low-energy Fermi-level gap opening and high-energy optical responses in CDW systems.", "Demonstrates that ultrafast dynamics at high energy scales are driven by the emergence of the CDW gap.", "Provides a new perspective for tracking order parameters in correlated electron systems using high-energy probes."]}}, {"title": "Room-temperature topological spin textures via cobalt substitution in a kagome antiferromagnet", "journal": "npj_QuantumMaterials", "source": "Gemini", "link": "https://www.nature.com/articles/s41535-026-00947-8", "authors": "Shaohua Fan, Zinan Zhao, Baochun Wu, et al.", "last_authors": "Xingye Lu, Jinbo Yang", "summary": "Room-temperature topological spin textures via cobalt substitution in a kagome antiferromagnet", "tier": "B_IMPORTANT_CONDMAT", "score": "9", "reason": "Topological spin textures in kagome systems are highly relevant to research interests.; demoted from A: broad CM, not direct user/project hit", "tags": ["kagome", "topological", "antiferromagnet"], "image": "https://pubads.g.doubleclick.net/gampad/ad?iu=/285/npjquantmats.nature.com/article&sz=728x90&c=-1272202507&t=pos%3Dtop%26type%3Darticle%26artid%3Ds41535-026-00947-8%26doi%3D10.1038/s41535-026-00947-8%26subjmeta%3D301,639,766%26kwrd%3DMaterials+science,Physics", "briefing": {"background": "Kagome 격자는 기하학적 좌절 구조로 인해 변칙 홀 효과, 비자명한 위상 질서 등 독특한 물리 현상을 보입니다. 특히 위상 자기 구조(Topological spin textures)는 차세대 스핀트로닉스 소자의 후보로 주목받고 있습니다.", "motivation": "Kagome 반강자성체에서 상온 수준에서도 안정적으로 존재하는 위상 자기 구조를 찾아내고, 이를 제어하는 방법을 탐구하고자 합니다.", "result": "Kagome 반강자성체에 코발트(Co)를 치환함으로써 상온에서도 유지되는 위상 자기 구조를 구현하는 데 성공했습니다.", "implication": "극저온에 국한되었던 Kagome 위상 자성 연구를 상온 영역으로 확장하여 실제 소자 응용 가능성을 높였습니다.", "novelty": "치환(substitution)을 통해 자성체의 위상적 성질을 상온에서 조절했다는 점이 핵심이며, 독자의 주요 관심사인 AV3Sb5 계열과 비교 연구할 가치가 높습니다.", "unresolved": "치환된 코발트가 미세 구조 내에서 정확히 어떤 자기적 상호작용 변화를 유도하여 위상 구조를 안정화하는지에 대한 원자 단위의 이해가 보완되어야 합니다.", "future_work": "실시간 자기 현미경(magnetic microscopy)을 통한 스핀 텍스처의 동역학 관찰 및 전기적 제어 실험이 기대됩니다.", "concepts": [{"term": "Kagome Lattice", "why_emerged": "삼각형과 육각형이 교차하는 기하학적 구조를 통해 자기 좌절(frustration)을 연구하기 위해 도입되었습니다.", "origin": "I. Syôzi (1951년 통계역학 모델 제안)", "connections": "AV3Sb5, Weyl 반금속, 스핀 액체"}, {"term": "Topological Spin Texture", "why_emerged": "스핀 배열 자체가 위상적인 꼬임(winding)을 가져 외부 교란에 안정한 정보를 저장하기 위해 연구됩니다.", "origin": "Skyrme (1962, 입자 물리 모델), Bogdanov & Yablonskii (1989, 자성체 적용)", "connections": "Skyrmion, Meron, Anomalous Hall Effect"}, {"term": "Antiferromagnet (AFM)", "why_emerged": "인접한 스핀이 반대 방향으로 정렬되어 전체 자화가 0이 되는 자성 상태를 설명하기 위해 정의되었습니다.", "origin": "Louis Néel (1930년대 초)", "connections": "Néel temperature, 스핀 파동, 반강자성 스핀트로닉스"}, {"term": "Cobalt Substitution", "why_emerged": "자성체의 이온 반경이나 전자 배치를 조절하여 자기 이방성 및 교환 상호작용을 튜닝하기 위해 널리 쓰이는 기법입니다.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "도핑 제어, 큐리/네엘 온도 조절"}], "english_summary": ["Achieves room-temperature topological spin textures in a kagome antiferromagnet via cobalt substitution.", "Expands the stability range of topological magnetic phases, making them suitable for practical spintronic applications.", "Demonstrates chemical tuning as an effective tool for engineering topological properties in kagome systems."]}}, {"title": "Magnetic anisotropy, first-order metamagnetic transitions, and weak antilocalization in the candidate topological semimetal Tb2Zn17", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/ytfq-5c74", "authors": "Rajesh Swami, Papul Sahu, Sonali S Pradhan, V. Kanchana, Z. Hossain", "last_authors": "V. Kanchana, Z. Hossain", "summary": "Tb 2 Zn 17 crystallizes in the rhombohedral Th 2 Zn 17 -type structure (space group R 3 ¯ m ), a structure type known to accommodate atomic disorder. Here, the authors highlight the role of disorder-induced scattering in magnetotransport measurements, which exhibit signatures of weak antilocalization. This compound shows multiple first-order field-induced metamagnetic transitions, strong magnetic anisotropy, crystal electric field effects, and possible spin canting within its antiferromagnetic state. First-principles calculations predict multiple electron and hole Fermi pockets, along with mirror-symmetry-protected nodal rings, suggesting Tb 2 Zn 17 as a promising rare-earth-based magnetic topological semimetal.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Experimental study of a magnetic topological semimetal, well-aligned with interest in topological materials.", "tags": ["topological", "transport", "semimetal"], "image": "", "briefing": {"background": "희토류 기반 화합물은 강한 자기 모멘트와 전자 밴드의 위상적 성질이 결합될 수 있어 위상 반금속(topological semimetal) 연구의 중요한 플랫폼입니다.", "motivation": "Tb2Zn17 화합물의 결정 구조 내 무질서(disorder)가 자기 수송 특성과 위상적 상태에 미치는 영향을 규명하고자 합니다.", "result": "수송 측정에서 약한 반국소화(Weak Antilocalization, WAL) 현상을 관찰했으며, DFT 계산을 통해 거울 대칭으로 보호되는 노달 링(nodal rings)의 존재를 예측했습니다. 또한 다단계 메타자성 전이를 확인했습니다.", "implication": "Tb2Zn17이 무질서에도 불구하고 위상적 특성을 유지하는 자기 위상 반금속 후보임을 입증했습니다.", "novelty": "무질서가 존재하는 계에서 WAL과 노달 링 구조를 연결 지었으며, 독자의 관심사인 베리 곡률 및 자기 위상 재료 연구와 직결됩니다.", "unresolved": "실험적으로 관찰된 WAL이 순수하게 위상적 기원인지, 아니면 강한 스핀-궤도 결합에 의한 단순한 산란 효과인지 추가적인 검증(예: 각도 의존성 수송 측정)이 필요합니다.", "future_work": "ARPES를 통한 직접적인 노달 링 관측과 자기장에 따른 밴드 구조 변화의 실시간 추적이 필요합니다.", "concepts": [{"term": "Weak Antilocalization (WAL)", "why_emerged": "강한 스핀-궤도 결합이나 위상적 보호로 인해 전자의 후방 산란이 억제되어 전도도가 증가하는 현상을 설명하기 위해 등장했습니다.", "origin": "Hikami, Larkin, and Nagaoka (1980)", "connections": "위상 절연체, Rashba 효과, 스핀-궤도 결합"}, {"term": "Metamagnetic Transition", "why_emerged": "외부 자기장에 의해 자화가 불연속적으로 급격히 변화하는 현상을 설명하기 위해 도입되었습니다.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "자성 이방성, Spin-flop 전이"}, {"term": "Nodal Ring", "why_emerged": "밴드 교차점이 점(Weyl point)이 아닌 고리(ring) 형태를 띠는 위상 반금속 상태를 정의하기 위해 사용됩니다.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "Topological Semimetal, Mirror symmetry protection"}, {"term": "Magnetic Anisotropy", "why_emerged": "결정 구조에 따라 특정 방향으로 자화가 정렬되기 쉬운 에너지를 설명하기 위해 물리적으로 중요합니다.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "Crystal Electric Field (CEF), 스핀 오리엔테이션"}], "english_summary": ["Identifies Tb2Zn17 as a candidate magnetic topological semimetal featuring mirror-protected nodal rings.", "Reports signatures of weak antilocalization and multiple first-order metamagnetic transitions.", "Highlights the coexistence of disorder-induced scattering and robust topological transport properties."]}}, {"title": "Manipulating anomalous transport via crystal symmetry in two-dimensional altermagnets", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/zhyr-jrf7", "authors": "Dan Li, Shuaiyu Wang, Jiabing Chen, et al.", "last_authors": "Xiaodong Zhou, Xiao-Ping Li", "summary": "Anomalous transports, including the anomalous Hall effect (AHE) and anomalous Nernst effect (ANE), are typical manifestations of time-reversal-symmetry-breaking responses in materials. In general, the two Hall states with opposite Hall conductivities can be regarded as time-reversal pairs coupled to…", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Anomalous transport in altermagnets is highly relevant to current magnetism and Berry curvature interests.", "tags": ["anomalousHall", "altermagnet", "symmetry"], "image": "", "briefing": {"background": "최근 발견된 알터마그넷(Altermagnet)은 순 자화량은 없으나 운동량 공간에서 스핀 분할을 가지는 새로운 자성 상태입니다. 이는 강자성체의 수송 특성과 반강자성체의 미세 구조적 장점을 동시에 활용할 수 있는 잠재력을 가집니다.", "motivation": "2차원 알터마그넷에서 결정 대칭성이 비정상 홀 효과(AHE) 및 비정상 너른스트 효과(ANE)와 같은 비정상 수송 현상을 어떻게 제어하는지 규명하고자 하였습니다.", "result": "연구진은 특정 결정 대칭성 조작을 통해 알터마그넷의 비정상 수송 특성을 변조할 수 있음을 보였습니다. 특히 시간 역전 대칭성이 깨진 상태에서 베리 곡률(Berry curvature)에 의해 유도되는 홀 반응이 결정 구조적 요소와 결합하는 방식을 구체화했습니다.", "implication": "알터마그넷 기반 스핀트로닉스 소자에서 외부 자기장 없이도 대칭성 제어(예: 스트레인, 적층 구조 변경)를 통해 수송 특성을 효율적으로 스위칭할 수 있는 경로를 제시합니다.", "novelty": "알터마그네티즘과 베리 곡률 기반 수송 현상을 2차원 극한에서 연결했다는 점이 중요하며, 이는 독자의 관심사인 알터마그넷 및 베리 곡률 물리와 직접적으로 맞닿아 있습니다.", "unresolved": "계산 모델이 실제 특정 재료에서 실험적으로 어느 정도의 크기로 구현될지에 대한 정량적 확인이 필요합니다.", "future_work": "실제 2차원 알터마그넷 후보 물질에 대한 실험적 검증 및 스트레인을 이용한 대칭성 조작 실험이 기대됩니다.", "concepts": [{"term": "Altermagnetism", "why_emerged": "강자성체와 반강자성체의 특성을 동시에 갖는 제3의 자성 분류를 정의하기 위해 등장했습니다.", "origin": "Libor Šmejkal 등에 의해 최근 이론적으로 정립되었습니다.", "connections": "Antiferromagnetism, Berry curvature, Spin-splitting"}, {"term": "Anomalous Hall Effect (AHE)", "why_emerged": "외부 자기장이 없는 자성체에서 나타나는 홀 전도도를 설명하기 위해 필요했습니다.", "origin": "Edwin Hall (1881)", "connections": "Berry curvature, Time-reversal symmetry breaking"}], "english_summary": ["Investigates the control of AHE and ANE via crystal symmetry in 2D altermagnets.", "Identifies the symmetry requirements for manipulating Berry curvature-induced transport.", "Provides a theoretical framework for symmetry-protected anomalous transport in altermagnetic systems."]}}, {"title": "Pressure-tuned interlayer coupling and structural control of the ground state in 1T−IrTe2", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/bszx-hzm6", "authors": "Rongqi Wu, Ye Yang, Zhiwei Wang, et al.", "last_authors": "Jianjun Ying, Xianhui Chen", "summary": "Layered quantum materials often host multiple nearly degenerate electronic states whose balance is highly sensitive to lattice symmetry and interlayer coupling. $1T−{\\mathrm{IrTe}}_{2}$ is a representative example, where superconductivity emerges in close proximity to a charge-ordered state. Here, w…", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Direct relevance to electronic phase competition in 112-related tellurides.", "tags": ["material", "superconductivity"], "image": "", "briefing": {"background": "1T-IrTe2는 전하 밀도파(CDW)와 초전도성이 경쟁하거나 공존하는 전형적인 양자 물질로, 층간 결합과 격자 대칭성이 물리적 상태 결정에 핵심적인 역할을 합니다.", "motivation": "압력을 조절 인자로 사용하여 1T-IrTe2의 층간 결합 강도를 변화시킴으로써 전하 질서 상태와 초전도 상태 사이의 균형이 어떻게 변하는지 조사하고자 했습니다.", "result": "압력을 통해 층간 결합을 강화하면 구조적 상전이가 억제되고 기저 상태가 전하 질서 상태에서 초전도 상태로 전이됨을 확인했습니다. 특히 압력이 격자 대칭성을 변화시켜 전자 구조를 재구성함을 보였습니다.", "implication": "층간 결합의 미세 조절이 층상 구조 물질의 전자 상도(phase diagram)를 근본적으로 바꿀 수 있음을 시사하며, 이는 다른 112 계열 텔루라이드 연구에도 적용될 수 있습니다.", "novelty": "압력이라는 외부 변수를 통해 IrTe2의 복잡한 구조-물성 상관관계를 명확히 규명했으며, 독자의 관심사인 CDW, 초전도 및 112 텔루라이드(TaNiTe2 등) 물리와 매우 밀접합니다.", "unresolved": "고압 상태에서의 전자 구조 변화를 ARPES 등으로 직접 관찰하여 이론적 예측과 비교하는 과정이 추가로 필요할 수 있습니다.", "future_work": "다른 전이금속 디칼코게나이드 및 텔루라이드 계열에서 유사한 층간 결합 제어를 통한 물성 최적화 연구가 예상됩니다.", "concepts": [{"term": "1T-IrTe2", "why_emerged": "강한 스핀-궤도 결합과 전하 질서-초전도 경쟁을 연구하기 위한 모델 물질로 주목받았습니다.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "CDW, Superconductivity, TMDC"}, {"term": "Interlayer coupling", "why_emerged": "층상 물질의 2차원성과 3차원성 사이의 크로스오버를 이해하기 위해 중요합니다.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "van der Waals materials, Pressure tuning"}], "english_summary": ["Explores the pressure-induced transition from charge order to superconductivity in 1T-IrTe2.", "Demonstrates that interlayer coupling strength is a critical tuning knob for the ground state.", "Reveals the structural control of electronic phases in layered telluride systems."]}}, {"title": "Emergence of a Symmetry-Broken Chern Insulator near a Moiré Kondo Breakdown", "journal": "PRL_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/szcj-44xj", "authors": "Wanghao Tian, Bowen Shen, Lizhong Li, et al.", "last_authors": "Jie Shan, Kin Fai Mak", "summary": "A new class of topological states emerging near a Kondo breakdown in a moiré Kondo lattice system reveals a connection between the chiral Kondo interaction and the formation of topologically nontrivial states at fractional moiré fillings—an observation that has not been reported in previous heavy-fermion systems.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Relevant study on topological insulators and moiré systems in heavy-fermion contexts.", "tags": ["moiré", "topology", "Kondo"], "image": "", "briefing": {"background": "모아레(Moiré) 격자 시스템은 강한 전자 상관관계와 위상 수학적 특성을 결합하여 무거운 페르미온(heavy fermion) 및 위상 절연체 상태를 연구할 수 있는 새로운 플랫폼입니다.", "motivation": "모아레 콘도 격자(moiré Kondo lattice) 시스템에서 콘도 붕괴(Kondo breakdown) 임계점 근처에서 나타날 수 있는 새로운 위상 상태를 탐색하고자 했습니다.", "result": "콘도 붕괴 근처의 분수 모아레 충진율(fractional filling)에서 대칭성이 깨진 처언 절연체(Chern insulator) 상태가 창발됨을 발견했습니다. 이는 카이랄 콘도 상호작용이 위상적으로 넌트리비얼한 상태 형성에 기여함을 보여줍니다.", "implication": "강상관 계의 Kondo 물리와 위상 물리학을 연결하는 새로운 메커니즘을 제시하며, 모아레 시스템이 고전적인 무거운 페르미온 시스템 이상의 풍부한 위상 상도를 가짐을 증명합니다.", "novelty": "기존의 무거운 페르미온 시스템에서 보고되지 않았던 '콘도 붕괴 근처의 대칭성 깨진 처언 절연체'를 발견한 점이 매우 혁신적이며, 독자의 관심사인 moiré 시스템, Kondo, 위상 상태와 완벽히 일치합니다.", "unresolved": "이러한 상태의 국소적인 전자 구조 변화를 STM 등을 통해 직접 시각화하는 연구가 보완되어야 합니다.", "future_work": "다양한 모아레 충진율에서의 위상 전이 연구 및 다른 전이금속 디칼코게나이드 기반 모아레 격자로의 확장이 예상됩니다.", "concepts": [{"term": "Chern Insulator", "why_emerged": "외부 자기장 없이 고유의 밴드 위상에 의해 양자 홀 효과를 나타내는 상태를 설명하기 위해 등장했습니다.", "origin": "F. D. M. Haldane (1988)", "connections": "Quantum Hall Effect, Berry curvature"}, {"term": "Kondo Breakdown", "why_emerged": "무거운 페르미온 계에서 국소 모멘트와 전도 전자의 결합이 해제되는 양자 임계 현상을 설명하기 위해 필요합니다.", "origin": "P. Coleman, Q. Si 등에 의해 논의됨", "connections": "Heavy fermion, Quantum criticality"}], "english_summary": ["Reports a symmetry-broken Chern insulator emerging near a moiré Kondo breakdown.", "Links chiral Kondo interactions to the formation of topological states at fractional fillings.", "Provides a new bridge between heavy-fermion physics and moiré-based topology."]}}, {"title": "Evolution of the Superfluid Density in Infinite-Layer Nickelates", "journal": "PRL_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/25gn-bfgw", "authors": "Bai Yang Wang, Shannon P. Harvey, Kyuho Lee, et al.", "last_authors": "Srinivas Raghu, Harold Y. Hwang", "summary": "An experiment enables the first systematic, absolute superfluid-density measurement across the full superconducting dome of an infinite-layer nickelate.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Important experiment on unconventional nickelate superconductors.", "tags": ["nickelate", "superconductivity", "experiment"], "image": "", "briefing": {"background": "무한층(infinite-layer) 니켈레이트(NdNiO2 등)는 구리 산화물 초전도체와 유사한 전자 구조를 가지고 있어 고온 초전도 메커니즘을 규명하는 핵심 후보 물질군입니다.", "motivation": "니켈레이트 초전도체 전체 초전도 돔(superconducting dome) 영역에서 절대 초전도 유체 밀도(superfluid density)를 체계적으로 측정하여, 이들의 초전도성이 구리 산화물과 얼마나 유사한지 혹은 다른지 정량적으로 이해하고자 합니다.", "result": "무한층 니켈레이트의 초전도 상태 전반에 걸쳐 초전도 유체 밀도의 진화 양상을 최초로 체계적으로 측정해 냈습니다.", "implication": "니켈레이트 초전도체의 기본 물성이 기존 고온 초전도체와 어떠한 물리적 공통점이나 차별점을 갖는지 확인하여, 비전통적 초전도 이론 정립에 중요한 데이터를 제공합니다.", "novelty": "니켈레이트 분야에서 그간 부족했던 절대 초전도 유체 밀도 측정 데이터를 확보함으로써, 구리 산화물과의 상관관계를 정밀하게 비교할 수 있는 기틀을 마련했습니다.", "unresolved": "초전도 유체 밀도 변화의 미시적 원인이 되는 전자 상관관계의 강도나 스핀/전하 자유도의 정확한 역할은 추가 연구가 필요합니다.", "future_work": "도핑 농도 및 압력 변화에 따른 유체 밀도의 미세한 변화와 비상관적인 상(normal state) 성질 간의 결합을 규명하는 연구가 예상됩니다.", "concepts": [{"term": "Infinite-layer nickelates", "why_emerged": "구리 산화물과 등전자 구조(isoelectronic)를 가져 고온 초전도 연구의 새로운 플랫폼으로 등장함.", "origin": "2019년 Stanford대 Harold Hwang 그룹에 의해 처음 발견됨.", "connections": "Cuprates, Mott insulators, 3d transition metal oxides."}, {"term": "Superfluid density", "why_emerged": "초전도 응축(condensate)의 양을 나타내며, 초전도 메커니즘과 에너지 갭의 특성을 이해하는 핵심 지표임.", "origin": "London 형제 등에 의해 초전도 현상 초기부터 확립됨.", "connections": "London penetration depth, Uemura scaling, BCS theory."}], "english_summary": ["The paper provides the first systematic absolute superfluid density measurement in infinite-layer nickelates.", "Measurements cover the entire superconducting dome of the material.", "Results offer critical insights into the similarities and differences between nickelates and cuprate superconductors.", "The findings constrain theoretical models of superconductivity in correlated nickelate systems."]}}, {"title": "Ultrasensitive Strain Modulation of Terahertz Magnons at a Magnetic Phase Transition", "journal": "PRL_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/wk6v-1x5s", "authors": "Lichen Wang, Sajna Hameed, Yiran Liu, et al.", "last_authors": "Matteo Minola, Bernhard Keimer", "summary": "Motivated by the prospect of strain control of terahertz (THz) magnons, we have used resonant x-ray diffraction and Raman scattering to investigate the magnetic ground state and excitations of the layered Mott insulator Ca 2 RuO 4 under uniaxial strain. We discovered a strain-induced phase transition between two antiferromagnetic states that differ in the sign of the interlayer exchange interaction. Although this interaction is weak and partially frustrated, the corresponding magnon energies of the two states differ by more than 10% ( ∼ 0.3 THz ). Our theoretical analysis explains this surprising observation by tracing the origin of both the sign reversal of the interlayer coupling and the magnon energy to the spin-orbital composition of the Ru valence electrons. The extreme strain sensitivity of the THz magnon energy near a magnetic phase transition opens up pathways toward a new generation of “transition-edge” magnonic devices.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Important experimental study on magnetic phase transitions and excitations in a correlated insulator.", "tags": ["magnetism", "magnons", "experiment"], "image": "", "briefing": {"background": "강상관 전자계에서 자성 기저 상태와 여기(excitation)는 전자-격자 결합을 통해 외부 스트레인에 매우 민감하게 반응하며, 이는 차세대 스핀트로닉스 소자 개발의 핵심 연구 분야입니다.", "motivation": "초록 정보만으로는 분야 내부의 구체적 동기를 안정적으로 요약하기 어렵습니다.", "result": "Motivated by the prospect of strain control of terahertz (THz) magnons, we have used resonant x-ray diffraction and Raman scattering to investigate the magnetic ground state and excitations of the layered Mott insulator Ca 2 RuO 4 under uniaxial strain. We discovered a strain-induced phase transition between two antiferromagnetic states that differ in the sign of the interlayer exchange interaction. Although this interaction is weak and partially frustrated, the corresponding magnon energies of the two states differ by more than 10% ( ∼ 0.3 THz ). Our theoretical analysis explains this surprising observation by tracing the origin of both the sign reversal of the interlayer coupling and the magnon energy to the spin-orbital composition of the Ru valence electrons. The extreme strain sensitivity of the THz magnon energy near a magnetic phase transition opens up pathways toward a new genera", "implication": "필터가 이 논문을 통과시킨 이유는 관련 키워드, 저자, 또는 Gemini relevance score 때문입니다.", "novelty": "Important experimental study on magnetic phase transitions and excitations in a correlated insulator.", "unresolved": "원문 확인 후 열린 질문을 판단해야 합니다.", "future_work": "후속 실험, 독립 재현, 관련 물질/조건 확장이 가능한지 확인하세요.", "concepts": [{"term": "Ca2RuO4", "why_emerged": "강한 스핀-궤도 결합과 전자 상관관계가 얽혀 있는 전형적인 Mott 절연체로, 격자 변형에 의한 상전이 연구에 적합함.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "Ruthenates, Mott physics, spin-orbit coupling."}, {"term": "Magnons", "why_emerged": "자기 정렬된 시스템에서 스핀의 집단적인 들뜸(excitation)을 기술하기 위해 도입됨.", "origin": "Bloch(1930)에 의해 이론적으로 제안됨.", "connections": "Spin waves, THz spectroscopy, antiferromagnetism."}], "english_summary": ["Study of magnetic ground state and THz magnons in Ca2RuO4 under uniaxial strain.", "Discovery of a strain-induced phase transition between two antiferromagnetic states with different interlayer coupling signs.", "Observed ~10% magnon energy difference (0.3 THz) between the phases.", "The sensitivity stems from the strain-tuned spin-orbital composition of Ru valence electrons.", "Demonstrates the potential for strain-engineered magnonic transition-edge devices."]}}, {"title": "Giant elastoresistance in magic-angle twisted bilayer graphene", "journal": "Science", "source": "Gemini", "link": "https://www.science.org/doi/abs/10.1126/science.adz0597?af=R", "authors": "Xuetao Ma, Zhaoyu Liu, Jiaqi Cai, et al.", "last_authors": "Jiun-Haw Chu, Matthew Yankowitz", "summary": "Strongly correlated and topological phases in moiré materials are exquisitely sensitive to lattice geometry at both atomic and superlattice length scales. Twist angle, pressure, and strain directly modify the lattice and thus act as highly effective tuning parameters. Here, we examined electrical transport in twisted bilayer graphene subjected to continuous uniaxial strain. Near the magic angle (≈1.1°), devices exhibited a pronounced elastoresistance that depended on band filling and temperature, with a gauge factor more than two orders of magnitude larger than that of conventional metals. In selected doping regimes, the elastoresistance exhibited a Curie-Weiss–like temperature divergence. We discuss possible microscopic origins, including nematic fluctuations and enhanced electronic entropy from fluctuating isospin moments. Our work establishes uniaxial strain as a versatile probe of correlated physics in a moiré material.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Important experiment on correlated electron systems in twisted bilayer graphene.", "tags": ["graphene", "moire", "electronic-structure"], "image": "", "briefing": {"background": "매직 앵글 뒤틀린 이중층 그래핀(MATBG)은 평탄 밴드(flat band)에서 발생하는 강상관 현상과 위상 물성을 연구하는 가장 뜨거운 플랫폼 중 하나입니다.", "motivation": "MATBG 시스템에서 격자 구조의 작은 변화(스트레인)가 전자 상태와 상관관계에 미치는 영향을 규명하여, 네마틱(nematic) 변동이나 아이소스핀(isospin) 효과를 이해하고자 합니다.", "result": "매직 앵글 부근에서 매우 큰 일렉트로레지스턴스(elastoresistance)를 발견했으며, 이는 특정 도핑 구간에서 큐리-바이스(Curie-Weiss) 법칙을 따르는 발산 거동을 보입니다.", "implication": "스트레인이 MATBG의 강상관 물성을 제어하는 강력한 실험적 도구임을 증명하며, 네마틱 질서나 전자 엔트로피의 역할을 규명하는 단서를 제공합니다.", "novelty": "일반 금속보다 수백 배 큰 게이지 인자를 보여주어 강상관 시스템의 네마틱 변동성에 대한 직접적인 척도로 스트레인을 활용할 수 있음을 입증했습니다.", "unresolved": "큐리-바이스 거동의 기저에 있는 정확한 아이소스핀 유체나 네마틱 변동의 미시적 기원은 향후 분석이 필요합니다.", "future_work": "다양한 도핑 및 자기장 하에서의 일렉트로레지스턴스 측정을 통한 위상 및 상관관계의 깊은 연관성 연구가 이어질 것입니다.", "concepts": [{"term": "Elastoresistance", "why_emerged": "물질의 변형률에 따른 전기 저항 변화를 측정하여 전자 구조의 이방성 및 네마틱 변동을 탐지하기 위해 필요함.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "Nematicity, tr itude for short-range interactions and by factors of two to three for long-range interactions. This enhancement is generic across Abelian fractional Chern insulator states and follows a universal enhancement factor within each hierarchy. In the Landau-level framework, we identify the amplification of pseudopotentials as the microscopic origin of the observed enhancement. More generally, in a Chern band system where the pseudopotential decomposition is not well defined, we find a sharp scaling distinction: in the strongly screened regime, the ν = 1 / 3 gap scales cubically with gate distance d s in the LLL and vortexable Chern bands, but linearly in higher-vortexable Chern bands. The activation of this leading O ( d s ) term by deviating from ideal quantum geometry is the key origin of the gap enhancement, and this criterion remains meaningful even without rotational symmetry. We further examined non-Abelian states and found that within finite-size resolution, this wave-function construction method can also be used to manipulate and enhance the gap for certain interaction parameters. We further discuss experimental implications of our findings in twisted bilayer MoTe 2 .", "tier": "B_IMPORTANT_CONDMAT", "score": "7", "reason": "Theoretical work on fractional Chern insulators and flat bands of interest to user.", "tags": ["theory", "Chern", "fractional"], "image": "", "briefing": {"background": "분수 양자 홀 효과와 유사한 분수 천 절연체(FCI)를 구현하기 위해 평탄한 밴드(Flat band)에서의 다체 상호작용 연구가 중요합니다.", "motivation": "기존의 가장 낮은 란다우 준위(LLL) 모델에서 벗어나, 더 큰 에너지 갭을 가지는 강건한 분수 상태를 설계할 수 있는 새로운 평탄 밴드 조건을 찾고자 합니다.", "result": "낮은 란다우 준위보다 더 큰 여기 갭을 제공하는 '높은 와류화(higher vortexability)'를 가진 모아레 밴드 조건을 발견했습니다.", "implication": "이상적인 양자 기하학에서 벗어남으로써 분수 천 절연체의 갭을 두 자릿수 이상 증폭시킬 수 있음을 입증하여, 향후 위상 양자 컴퓨터 구현의 실현 가능성을 높였습니다.", "novelty": "LLL 근사치를 탈피하여 파동함수의 기하학적 특성을 조절하는 것이 갭 강화의 핵심임을 밝혀냈습니다.", "unresolved": "실제 실험에서 구현되는 모아레 물질(예: MoTe2)에서의 격자 왜곡이나 불균일성이 이 이론적 예측을 얼마나 유지할지 불확실합니다.", "future_work": "비틀린 이중층 MoTe2에  "Electron hydrodynamics is an emerging framework that describes dynamics of interacting electron systems as conventional fluids. Although evidence for hydrodynamic-like transport has been reported in a variety of two-dimensional materials, precise quantitative measurement of the core parameter, electron viscosity, remains challenging. In this work, we demonstrate that magnetoresistance in Corbino-shaped graphene devices offers a simultaneous ohmmeter and viscosometer capability, allowing us to disentangle the individual ohmic and viscous contributions to transport, even near viscous-ohmic crossover. In both monolayer and bilayer graphene, the effective electron-electron scattering rate scales linearly with temperature, deviating markedly from the T 2 dependence expected in conventional Fermi liquids. Instead, it is consistent with a recently identified tomographic fluid regime, theoretically predicted to be generic for two-dimensional electron systems.", "tier": "B_IMPORTANT_CONDMAT", "score": "7", "reason": "Interesting experimental study of hydrodynamics in 2D electron systems.", "tags": ["2D-materials", "hydrodynamics"], "image": "", "briefing": {"background": "강하게 상호작용하는 전자계는 고전적인 액체처럼 거동하며 이를 전자 유체역학(electron hydrodynamics)이라고 함.", "motivation": "2차원 전자계에서의 핵심 매개변수인 '전자 점성(electron viscosity)'을 정량적으로 측정할 방법이 부족함.", "result": "코르비노(Corbino) 형상의 그래핀 소자에서 자기저항을 측정하여 옴의 법칙과 점성 기여도를 성공적으로 분리함.", "implication": "전자-전자 산란율이 페르미 액체 이론과 달리 온도에 선형적으로 비례함을 확인하여 '토모그래피적 유체(tomographic fluid)' 이론을 뒷받침함.", "novelty": "자기저항을 이용해 점성도를 정량화하는 새로운 측정법(viscosometer)을 제시함.", "unresolved": "토모그래피적 유체 체계가 모든 2차원 시스템에서 보편적으로 나타나는지에 대한 추가 증거.", "future_work": "다른 2차원 물질에서의 유체역학적 거동 탐색 및 점성 제어 연구.", "concepts": [{"term": "전자 유체역학", "why_emerged": "전자들 사이의 충돌이 빈번한 시스템에서 기존의 단일 입자 기반 수송 이론이 한계에 직면.", "origin": "Gurzhi (1968) 등에 의해 이론적 기반 마련.", "connections": "유체역학, 2D 재료의 비저항 측정."}, {"term": "코르비노 형상", "why_emerged": "가장자리 효과를 최소화하고 균일한 전류 흐름을 유도하기 위해 필요.", "origin": "오르모 코르비노(Orso Mario       [['왜 생겼나: ', c.why_emerged], ['누가 만들었나: ', c.origin], ['연결되는 흐름: ', c.connections]].forEach(([label, text]) => { if (!text) return; const p = document.createElement('p'); const bold = textEl('b', '', label); p.appendChild(bold); p.append(text); item.appendChild(p); });
      concepts.appendChild(item);
    });
    section.appendChild(concepts);
    briefing.appendChild(section);
  }
  if (b.english_summary && b.english_summary.length) { const section = document.createElement('section'); section.className = 'brief-section wide'; section.appendChild(textEl('h2', '', 'English Summary')); const ul = document.createElement('ul'); b.english_summary.slice(0, 5).forEach(line => ul.appendChild(textEl('li', '', line))); section.appendChild(ul); briefing.appendChild(section); }
  slideEl.appendChild(briefing);
  counterEl.textContent = `${index + 1} / ${slides.length}`;
  prevBtn.disabled = index === 0;
  nextBtn.disabled = index === slides.length - 1;
}
prevBtn.addEventListener('click', () => { index = Math.max(0, index - 1); render(); });
nextBtn.addEventListener('click', () => { index = Math.min(slides.length - 1, index + 1); render(); });
document.addEventListener('keydown', event => { if (event.key === 'ArrowLeft') prevBtn.click(); if (event.key === 'ArrowRight') nextBtn.click(); });
render();
</script>
</body>
</html>
