<title>Daily Paper Slideshow</title>
<style>
  :root {
    color-scheme: light;
    --bg: #f6f7f4;
    --paper: #ffffff;
    --ink: #111827;
    --muted: #64748b;
    --line: #d8ddd2;
    --accent: #176b87;
    --accent-2: #9a3412;
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; overflow: auto; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: var(--bg); color: var(--ink); }
  .shell { max-width: 1500px; min-height: 100vh; margin: 0 auto; padding: 14px 18px; display: flex; flex-direction: column; }
  .topbar { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 16px; }
  .top-actions { display: flex; align-items: center; gap: 10px; }
  .topbar a, button { border: 1px solid var(--line); border-radius: 8px; background: var(--paper); color: var(--ink); padding: 10px 14px; font-weight: 700; text-decoration: none; cursor: pointer; }
  button.primary { background: var(--accent); border-color: var(--accent); color: white; }
  button:disabled { opacity: 0.45; cursor: not-allowed; }
  .counter { color: var(--muted); font-weight: 700; }
  .slide { min-height: calc(100vh - 82px); background: var(--paper); border: 1px solid var(--line); border-radius: 10px; padding: 18px; box-shadow: 0 18px 42px rgba(15, 23, 42, 0.10); display: grid; grid-template-columns: minmax(310px, 0.86fr) minmax(0, 1.55fr); gap: 18px; overflow: visible; }
  .paper-head { min-width: 0; min-height: 0; overflow: visible; display: flex; flex-direction: column; gap: 12px; }
  .figure { margin: 0; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: #f8fafc; }
  .figure img { display: block; width: 100%; max-height: 41vh; object-fit: contain; background: white; }
  .figure figcaption { padding: 7px 10px; color: var(--muted); font-size: 12px; line-height: 1.3; }
  .head-text { display: flex; flex-direction: column; gap: 9px; min-width: 0; }
  .badges { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .badge { border-radius: 999px; padding: 5px 9px; background: #eef2ff; color: #3730a3; font-size: 12px; font-weight: 800; }
  .score { background: #fee2e2; color: #991b1b; }
  h1 { margin: 0; font-size: 25px; line-height: 1.15; letter-spacing: 0; overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
  h1 a { color: inherit; text-decoration-color: rgba(23, 107, 135, 0.35); text-decoration-thickness: 2px; text-underline-offset: 4px; }
  h1 a:hover { color: var(--accent); text-decoration-color: var(--accent); }
  .meta, .authors, .why, .abstract { font-size: 13px; line-height: 1.45; }
  .meta, .authors { color: var(--muted); }
  .why strong, .abstract strong, .authors strong { color: var(--ink); }
  .authors { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .why { border-left: 4px solid var(--accent-2); padding-left: 10px; color: #374151; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .abstract { border-top: 1px solid var(--line); padding-top: 14px; color: #374151; }
  .original-abstract { border-top: 1px solid var(--line); padding-top: 10px; color: #374151; font-size: 11.5px; line-height: 1.35; overflow-wrap: anywhere; }
  .original-abstract strong { display: block; margin-bottom: 4px; color: var(--ink); }
  .tags { display: flex; flex-wrap: wrap; gap: 8px; }
  .tag { border-radius: 999px; padding: 4px 8px; background: #f1f5f9; color: #475569; font-size: 12px; font-weight: 700; }
  .head-text > .link { display: none; }
  .briefing { min-width: 0; min-height: 0; overflow: visible; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); grid-auto-rows: minmax(0, auto); align-content: start; gap: 11px 18px; border-top: 0; padding-top: 0; }
  .brief-section { min-width: 0; }
  .brief-section.wide { grid-column: 1 / -1; }
  .brief-section h2 { margin: 0 0 4px; font-size: 14px; line-height: 1.22; color: #0f766e; letter-spacing: 0; }
  .brief-section p, .brief-section li { margin: 0; font-size: 12.5px; line-height: 1.42; color: #1f2937; overflow-wrap: anywhere; }
  .brief-section ul { margin: 0; padding-left: 20px; }
  .concepts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 9px 14px; }
  .concept { border-top: 1px solid var(--line); padding-top: 7px; }
  .concept h3 { margin: 0 0 4px; font-size: 13px; color: #7c2d12; letter-spacing: 0; }
  .concept p { margin: 2px 0 0; font-size: 11.5px; line-height: 1.35; color: #374151; overflow-wrap: anywhere; }
  .concept b { color: #111827; }
  .link { color: var(--accent); font-weight: 800; text-decoration: none; }
  .empty { padding: 48px; background: var(--paper); border: 1px solid var(--line); border-radius: 12px; color: var(--muted); }
  @media (max-width: 860px) {
    .shell { padding: 14px; }
    .topbar, .top-actions { align-items: stretch; flex-direction: column; }
    .slide, .briefing, .concepts { grid-template-columns: 1fr; }
    .slide { min-height: auto; overflow: visible; display: grid; }
    h1 { font-size: 28px; }
  }
</style>

const slides = [{"title": "Experimental Signatures of a Memory-Dressed Cooper-Pair Field in Antinodal ARPES", "journal": "arXiv_CondMat", "source": "keyword", "link": "https://arxiv.org/abs/2607.03937", "authors": "Udomsilp Pinsook", "last_authors": "Udomsilp Pinsook", "summary": "Antinodal angle-resolved photoemission spectroscopy (ARPES) in cuprate superconductors reveals a broad incoherent background alongside a temperature-dependent superconducting contribution. We show that both features are naturally captured by a single family of parabolic cylinder functions (PCFs). First, the broad antinodal background in Bi 2 Sr 2 CaCu 2 O 8+δ is well described by a primitive PCF branch of the form e − z 2 / 4 D − 1 / 2 ( z ) e^{-z^{2}/4}D_{-1/2}(z) . Second, a superconductivity-associated component isolated via time-resolved ARPES subtraction follows a distinct D 3 / 2 D_{3/2} branch. Third, the same D 3 / 2 D_{3/2} structure is recovered in equilibrium temperature differences and across doping series. These findings motivate the minimal decomposition ρ ⁡ ( E , T ) = ρ BG ​ ( E , T ) + ρ SC ​ ( E , T ) \\rho(E,T)=\\rho_{\\rm BG}(E,T)+\\rho_{\\rm SC}(E,T) , where the superconductivity-associated spectral weight scales as A SC ​ ( T ) ∝ | Δ ⁡ ( T ) | 2 A_{\\rm SC}(T)\\propto|\\Delta(T)|^{2} . Dynamically, these branches originate from a Cooper-pair field with finite temporal memory: a smooth memory kernel generates a leading Gaussian temporal envelope exp ( − t 2 / 2 τ G 2 ) \\exp(-t^{2}/2\\tau_{G}^{2}) at short times, while algebraic many-body prefactors select the PCF branch index. If the finite-memory and algebraic incoherent dressing is formally removed, the resulting structure connects to the standard Bogoliubov/BCS spectrum. The main conclusion is that the incoherent antinodal continuum and the longer-lived superconductivity-associated component are distinct projections of a common memory-dressed pair field.", "tier": "A_MUST_READ", "score": "10", "reason": "title strong match: ARPES", "tags": ["ARPES", "angle-resolvedphotoemission", "photoemission", "cuprate", "superconduct"], "image": "https://arxiv.org/html/2607.03937v2/BG.jpg", "briefing": {"background": "구리 산화물(Cuprate) 고온 초전도체에서 안티노달(Antinodal) 영역의 ARPES 스펙트럼은 명확한 준입자 피크보다는 넓고 비일관적인(incoherent) 배경 신호와 온도가 낮아짐에 따라 나타나는 초전도 성분이 뒤섞여 있어 분석이 까다롭습니다.", "motivation": "안티노달 영역에서 관찰되는 넓은 배경 신호와 초전도 관련 성분을 단일한 수학적 틀(Parabolic Cylinder Functions, PCF)로 설명하고, 이들의 동역학적 기원을 규명하고자 했습니다.", "result": "Bi2212의 안티노달 스펙트럼을 분석하여, 배경 신호는 D_{-1/2} PCF 분기로, 초전도 성분은 D_{3/2} PCF 분기로 매우 잘 묘사됨을 보였습니다. 특히 초전도 스펙트럼 가중치가 초전도 갭의 제곱(|Δ|^2)에 비례하며, 이는 유한한 '기억 시간(memory)'을 가진 쿠퍼 쌍 필드(Cooper-pair field)에서 기인함을 제안했습니다.", "implication": "안티노달의 비일관적인 연속체와 초전도 성분이 별개의 현상이 아니라, 동일한 '기억 효과가 입혀진(memory-dressed)' 쌍 필드의 서로 다른 투영(projection)임을 시사합니다. 이는 초전도 메커니즘 해석에 있어 보골리우보프-BCS 이론의 확장된 틀을 제공합니다.", "novelty": "복잡한 안티노달 스펙트럼을 PCF라는 단일 함수군으로 계통화했다는 점이 독창적입니다. 특히 사용자의 관심사인 ARPES를 통해 초전도 쌍의 시간적 비국소성(temporal non-locality)을 직접적으로 연결했다는 점에서 높은 가치가 있습니다.", "unresolved": "이러한 '메모리 커널(memory kernel)'이 형성되는 구체적인 미시적 산란 과정(예: 스핀 플락츄에이션 등)과의 직접적인 연결은 아직 이론적 과제로 남아 있습니다.", "future_work": "다른 구리 산화물 군이나 도핑 농도에 따른 PCF 분기 인덱스의 변화를 추적하여 이 모델의 보편성을 검증할 필요가 있습니다.", "concepts": [{"term": "Antinodal ARPES", "why_emerged": "브릴루앙 영역의 (π, 0) 부근에서 초전도 갭이 최대가 되며, 전자 간 상호작용과 비일관적 산란이 가장 강하게 나타나기 때문에 중요하게 다뤄집니다.", "origin": "초창기 구리 산화물 ARPES 연구들(Damascelli et al. 등)에서 노달(Nodal) 영역과 대비되는 핵심 영역으로 정의됨.", "connections": "노달 준입자, 초전도 갭 비등방성, 의사갭(Pseudogap)."}, {"term": "Memory-Dressed Pair Field", "why_emerged": "표준 BCS 이론의 즉각적인 쌍 형성과 달리, 강한 상관관계 시스템에서의 지연된 상호작용 효과를 설명하기 위해 도입되었습니다.", "origin": "초록 정보만으로는 특정하기 어려우나, 비평형 통계 역학의 메모리 함수 개념을 초전도 필드에 적용한 것임.", "connections": "비-마르코프(Non-Markovian) 동역학, 강상관 전자계 스펙트럼 함수."}, {"term": "Parabolic Cylinder Functions (PCF)", "why_emerged": "가우시안 감쇠와 대수적(algebraic) 거동이 공존하는 복잡한 파형을 수학적으로 간결하게 기술하기 위해 사용되었습니다.", "origin": "수학적으로는 19세기 후반 Whittaker 등에 의해 정의되었으나, 본 논문에서는 ARPES 피팅 함수로 도입됨.", "connections": "조화 진동자 파동 함수, 비상관 산란 배경 모델링."}], "english_summary": ["Identifies that antinodal ARPES spectra in cuprates can be unified using Parabolic Cylinder Functions (PCF).", "Proposes that both the incoherent background and the superconducting peak originate from a memory-dressed Cooper-pair field.", "Shows that the superconducting spectral weight scales linearly with the square of the gap function.", "Provides a bridge between the standard BCS framework and the complex many-body continuum observed in strong-correlation systems."]}}, {"title": "Hysteretic Coherence Collapse Across the First Order CDW Transition in 1T-TaS2", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2609.07923", "authors": "Turgut Yilmaz, Anil Rajapitamahuni, Asish K. Kundu, Menka Jain, Elio Vescovo", "last_authors": "Menka Jain, Elio Vescovo", "summary": "The first order phase transition between the nearly commensurate (NC-CDW) and commensurate (C-CDW) charge density wave phases in 1T-TaS2 underpins its exotic electronic behavior, yet the spectroscopic evolution of the low energy electronic structure across this transition remains crucial to understand. Using angle resolved photoemission spectroscopy (ARPES), we investigate the low temperature C-CDW phase, characterized by a flat band commonly associated with the lower Hubbard band and a distinct in-gap state located closer to the Fermi level. Photon energy dependent measurements distinguish these two low energy features through their different spectral weight evolution. Temperature dependent ARPES across heating and cooling cycles reveals that the in-gap state undergoes an abrupt collapse upon heating into the NC-CDW phase and re-emerges sharply upon cooling back into the C-CDW phase. This pronounced thermal hysteresis provides direct spectroscopic evidence of the first order nature of the transition. Furthermore, the disappearance and recovery of the in-gap state closely track the corresponding changes in resistivity, highlightin A_MUST_READ", "score": "9", "reason": "author whitelist: Riccardo Comin", "tags": ["kagome", "superconduct"], "image": "https://pubads.g.doubleclick.net/gampad/ad?iu=/285/npjquantmats.nature.com/article&sz=728x90&c=1635754209&t=pos%3Dtop%26type%3Darticle%26artid%3Ds41535-026-00937-w%26doi%3D10.1038/s41535-026-00937-w%26subjmeta%3D301,639,766%26kwrd%3DMaterials+science,Physics", "briefing": {"background": "AV3Sb5(A=K, Rb, Cs) 카고메 금속은 전하 밀도 파(CDW), 시간 반전 대칭 깨짐(TRSB), 초전도성 등 다양한 양자 상태가 공존하여 현재 응집물질물리학에서 가장 뜨거운 연구 주제임.", "motivation": "카고메 격자에서 나타나는 격자 변위(lattice)와 전자적 비대칭(charge) 기여분을 명확히 분리하여 이해하고자 함.", "result": "초록 정보만으로는 상세 결과 확인이 어려우나, 제목상 카고메 초전도체 내의 격자 구조와 전하 여기(excitation) 상태가 각각 뚜렷하게 구분되는 특성을 가지고 있음을 강조함.", "implication": "CDW 형성의 기원이 격자에 의한 것인지 전자 상호작용에 의한 것인지에 대한 오랜 논쟁에 단서를 제공하며, 이는 카고메 금속의 위상학적 특성과 초전도성 메커니즘을 규명하는 데 핵심적인 역할을 함.", "novelty": "Riccardo Comin 그룹의 높은 수준의 분광학 기법을 통해 카고메 금속의 미세한 여기 상태를 구분해냈다는 점이 주목됨.", "unresolved": "격자 여기와 전하 여기의 상호작용이 구체적으로 어떻게 위상학적 밴드 구조의 변화를 유도하는지는 여전히 추가 연구가 요구됨.", "future_work": "격자 왜곡에 따른 밴드 구조 변화의 직접적인 매핑과, 이들이 어떻게 초전도 쌍을 유도하는지에 대한 이론적, 실험적 검증.", "concepts": [{"term": "Kagome Metal", "why_emerged": "기하학적 좌절(frustration)과 밴드 평탄함(flat band)에 의한 강상관 물리 현상을 탐색하기 위해 도입됨.", "origin": "일본의 전통 바구니 짜기 패턴에서 유래, 물리계에서는 90년대 이후 위상 물질 연구와 함께 부상.", "connections": "Flat band magnetism, topological semimetals, CDW."}, {"term": "Charge Excitation", "why_emerged": "전자들 사이의 상호작용으로 발생하는 집단적 전하 밀도 진동을 이해하기 위해 필요.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "Plasmon, CDW, superconductivity."}], "english_summary": ["AV3Sb5 kagome superconductors are known for complex interplay between charge density waves and superconductivity.", "The authors differentiate between lattice and charge excitations in this material family.", "The findings offer insights into the competing orders within the kagome lattice.", "This work contributes to the broader understanding of electronic correlations in topological kagome metals."]}}, {"title": "Kagomelike Bands in Graphene/WSe2 Heterostructure Realized by Strong Interlayer Hybridization", "journal": "PRL_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/jw4w-2jbm", "authors": "Ruo-Han Zhang, Jiang-Hui Pan, Ya-Ning Ren, et al.", "last_authors": "Ji Feng, Lin He", "summary": "In two-dimensional (2D) van der Waals (vdW) structures, the twist angle between adjacent layers has emerged as a pivotal parameter for engineering electronic band structures. This is vividly exemplified by the discovery of an extensive array of correlated and topological phases in 2D moiré systems. …", "tier": "B_IMPORTANT_CONDMAT", "score": "10", "reason": "Kagomelike bands in graphene/WSe2 heterostructure, highly relevant to kagome metals and moiré systems.; demoted from A: broad CM, not direct user/project hit", "tags": ["kagome", "graphene", "moir", "heterostructure", "2Dmaterials", "bandstructure", "topological", "correlated"], "image": "", "briefing": {"background": "반데르발스 이종접합에서 층간 회전각(twist angle)을 조절하여 모아레(moiré) 패턴을 생성하고, 이를 통해 전자 밴드 구조를 엔지니어링하는 분야는 강상관 및 위상 전자 상태를 연구하는 핵심 플랫폼입니다.", "motivation": "그래핀과 WSe2 이종접합에서 층간 상호작용을 극대화하여 평탄 밴드나 특이한 격자 구조(카고메)가 유도될 수 있는지 탐구하고자 합니다.", "result": "강한 층간 혼성화를 통해 그래핀/WSe2 시스템에서 카고메 격자와 유사한 밴드 분산이 형성됨을 확인하였습니다.", "implication": "복잡한 금속 없이도 모아레 초격자 내에서 카고메 금속의 핵심 물리적 특성(평탄 밴드, 위상 기하학적 특성 등)을 제어할 수 있는 가능성을 제시합니다.", "novelty": "실제 카고메 금속(AV3Sb5 등)과 달리 모아레 시스템 내에서 카고메 물성을 구현하여, 위상 전자 상태 연구의 유연성을 크게 높였습니다.", "unresolved": "이러한 카고메 밴드 유도가 실제 초전도성이나 CDW와 같은 강상관 현상으로 어떻게 이어지는지에 대한 실험적 증거는 아직 부족합니다.", "future_work": "저온 환경에서의 수송 측정 및 ARPES를 통한 밴드 구조의 직접 관측 및 강상관 현상 유도 실험이 예상됩니다.", "concepts": [{"term": "카고메 격자", "why_emerged": "특이한 위상학적 상태와 평탄 밴드 유도를 위해 필요", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "AV3Sb5, 위상 자성체"}, {"term": "모아레 시스템", "why_emerged": "밴드 구조를 인위적으로 조정하기 위해", "origin": "Pablo Jarillo-Herrero (2018년 비틀린 이중층 그래핀 실험)", "connections": "강상관 전자계, 초전도성"}], "english_summary": ["Engineering electronic bands in graphene/WSe2 heterostructures via moiré superlattices.", "Observation of kagome-like band dispersion through strong interlayer hybridization.", "Provides a tunable platform to simulate kagome physics in 2D van der Waals materials."]}}, {"title": "Electric-field switching of g-wave phonon chirality in ferroelectric BaTiO3", "journal": "Nature_Materials", "source": "Gemini", "link": "https://www.nature.com/articles/s41563-026-02737-w", "authors": "Michael Grimes, Hiroki Ueda, Clifford J. Allington, et al.", "last_authors": "Shih-Wen Huang, Urs Staub", "summary": "Electric-field switching of g-wave phonon chirality in ferroelectric BaTiO3 membranes is demonstrated using circularly dichroic resonant inelastic X-ray scattering.", "tier": "B_IMPORTANT_CONDMAT", "score": "9", "reason": "Uses circularly dichroic RIXS to study chiral phonons; strong match for spectroscopy interests.", "tags": ["RIXS", "BaTiO3", "phononchirality"], "image": "https://media.springernature.com/m685/springer-static/image/art%3A10.1038%2Fs41563-026-02737-w/MediaObjects/41563_2026_2737_Fig1_HTML.png", "briefing": {"background": "포논(phonon)은 결정 격자의 진동이며, 최근에는 단순한 에너지 전달을 넘어 위상학적 성질이나 카이랄성(chirality)을 가진 포논에 대한 연구가 활발합니다.", "motivation": "강유전체인 BaTiO3 박막에서 전기장을 이용해 포논의 카이랄성(g-wave)을 실시간으로 제어할 수 있는지 확인하고자 합니다.", "result": "원편광 분해 공명 비탄성 X선 산란(CD-RIXS)을 통해 BaTiO3의 g-wave 포논 카이랄성이 외부 전기장에 의해 스위칭됨을 입증했습니다.", "implication": "포논의 위상학적 자유도를 정보 소자나 양자 제어 기술에 활용할 수 있는 단초를 제공합니다.", "novelty": "CD-RIXS라는 강력한 분광 기법을 사용하여 격자 진동의 카이랄성을 직접 관측하고 제어했다는 점이 본 연구의 핵심입니다.", "unresolved": "이러한 포논 스위칭 현상이 전자기적 소자의 성능 향상에 실질적으로 어떻게 기여할지에 대한 메커니즘은 추가 연구가 필요합니다.", "future_work": "다양한 강유전체 물질에서의 포논 카이랄성 확장 연구 및 동역학적 측정.", "concepts": [{"term": "CD-RIXS", "why_emerged": "물질의 전자 및 격자 상태를 원편광 분해능으로 관측하기 위해", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "공명 비탄성 X선 산란, 포논 분광학"}, {"term": "포논 카이랄성", "why_emerged": "격자 진동의 위상학적 성질을 이해하고 제어하기 위해", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "카이랄 포논, 위상학적 물질"}], "english_summary": ["Demonstration of electric-field switching of g-wave phonon chirality in BaTiO3.", "Utilized circularly dichroic resonant inelastic X-ray scattering (CD-RIXS).", "Establishes a method to control phonon degrees of freedom in ferroelectric materials."]}}, {"title": "Fermi surface studies of altermagnetic CrSb from Shubnikov–de Haas oscillations", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/j77q-p4ch", "authors": "Sajal Naduvile Thadathil, Beat Valentin Schwarze, Jaafar Ansari, et al.", "last_authors": "Jochen Wosnitza, Toni Helm", "summary": "The authors present here results from electrical magnetotransport measurements on microstructures of altermagnetic CrSb in pulsed fields up to 68 T. They study the temperature and field-orientation dependence of magnetic quantum oscillations in combination with first-principles calculations. The observed frequency spectrum agrees well with density functional theory calculations that take spin-orbit coupling into account, without invoking significant a d h o c band shifts. The findings validate the predicted electronic band structure of CrSb hosting multiple semimetallic bands and a locally alternating spin polarization.", "tier": "B_IMPORTANT_CONDMAT", "score": "9", "reason": "Direct experimental study on an altermagnet, highly relevant to topical magnetic materials interests.", "tags": ["altermagnetism", "transport", "Fermisurface"], "image": "", "briefing": {"background": "알터자성(altermagnetism)은 강자성이나 반강자성과는 다른 새로운 자기 질서로, 스핀이 실공간에서 교대로 배열되면서도 비자명한 밴드 분리를 보이는 상태입니다.", "motivation": "이론적으로 예측된 CrSb의 알터자성 밴드 구조를 실제 페르미 표면 측정(SdH 진동)을 통해 검증하고자 합니다.", "result": "68 T의 강한 펄스 자기장 하에서 SdH 진동을 측정하여, CrSb의 페르미 표면이 SOC를 포함한 DFT 계산 결과와 잘 일치함을 확인했습니다.", "implication": "알터자성이 이론적 예측을 넘어 실제 물질에서 실험적으로 완벽히 구현됨을 입증하여 차세대 스핀트로닉스 재료로서의 가능성을 높였습니다.", "novelty": "아드 혹(ad hoc) 밴드 수정 없이 알터자성 밴드 구조가 재현됨으로써 해당 이론의 견고함을 확립했습니다.", "unresolved": "알터자성체에서의 Berry 곡률과 관련된 수송 현상(예: 비정상 홀 효과)의 정량적 분석은 추가 실험이 필요합니다.", "future_work": "광학 the strong electron-lattice coupling in excitonic insulator candidates."]}}, {"title": "Kinetic Kagome Magnetism: From Self-Trapping RVB Polarons to Semiclassical Correlations", "journal": "PRL_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/zbxv-vtq8", "authors": "Yufei Pei, Shuai A. Chen, Claudio Castelnovo, Roderich Moessner", "last_authors": "Claudio Castelnovo, Roderich Moessner", "summary": "A study of the counter-Nagaoka problem of a single hole in an infinite- U Hubbard model on the kagome lattice reveals a new type of polaron, a resonating-valence-bond polaron that morphs into semiclassical order as polarization is reduced.", "tier": "B_IMPORTANT_CONDMAT", "score": "9", "reason": "Theoretical study of kinetic magnetism and polarons on the kagome lattice.; demoted from A: broad CM, not direct user/project hit", "tags": ["theory", "kagome", "Hubbardmodel", "magnetism", "polaron"], "image": "", "briefing": {"background": "카고메 격자는 기하학적 좌절(geometrical frustration)로 인해 흥미로운 자기적, 위상적 상태를 보여주며, 강한 전자 상관관계 연구의 주요 플랫폼입니다. 특히 허바드 모델 하에서 전자의 움직임과 자기적 정렬 간의 상호작용은 복잡한 다체 물리학 문제를 야기합니다.", "motivation": "카고메 격자 내 단일 정공(single hole)이 존재할 때 발생하는 '반-나가오카(counter-Nagaoka)' 문제를 해결하고, 전자가 만드는 폴라론(polaron)의 특성을 규명하고자 했습니다.", "result": "새로운 유형의 RVB 폴라론(resonating-valence-bond polaron)을 발견했으며, 분극이 감소함에 따라 이것이 준고전적인 자기적 질서로 변화함을 보였습니다.", "implication": "강한 상관관계 전자계에서 전하의 움직임이 국소적인 자기 질서에 미치는 영향을 이해하고, 카고메 금속에서의 비전통적 상태를 설명하는 이론적 기틀을 제공합니다.", "novelty": "기존의 나가오카 강자성 상태와는 다른, 카고메 격자 특유의 기하학적 좌절을 반영한 새로운 폴라론 메커니즘을 이론적으로 정립했습니다.", "unresolved": "실제 AV3Sb5와 같은 카고메 물질에서 관찰되는 복잡한 CDW 및 초전도 상태와 본 이론적 폴라론 모델 사이의 정량적 연결 고리는 아직 명확하지 않습니다.", "future_work": "본 모델을 격자 왜곡(lattice distortion)이나 스핀-궤도 결합(SOC)이 포함된 모델로 확장하여 실제 물질과의 정합성을 테스트할 예정입니다.", "concepts": [{"term": "RVB (Resonating Valence Bond)", "why_emerged": "고온 초전도체나 좌절된 자성체에서 전자의 비국소적인 짝짓기 상태를 설명하기 위해 도입되었습니다.", "origin": "P. W. Anderson (1973)", "connections": "스핀 액체, 고온 초전도 이론, 도핑된 Mott 절연체 연구와 밀접하게 연결됩니다."}, {"term": "Polaron", "why_emerged": "전자가 격자 진동이나 자기적 환경과 상호작용하며 자신의 움직임을 스스로 제한하는 준입자 상태를 기술하기 위해 필요합니다.", "origin": "Lev Landau (1933)", "connections": "전자-포논 결합, 자기 폴라론, 강상관 전자계의 유효 질량 증가 현상."}], "english_summary": ["Analyzes single-hole dynamics in a Hubbard-model kagome lattice.", "Identifies a unique resonating-valence-bond (RVB) polaron state.", "Shows a transition from polaron behavior to semiclassical magnetic order as polarization decreases.", "Provides a theoretical framework for kinetic magnetism in frustrated geometries."]}}, {"title": "Altermagnetism from the viewpoint of chemistry (Chem. Soc. Rev. (2026))", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2609.06159", "authors": "Nayana Devaraj, Anumita Bose, Md Afsar Reja, Arka Bandyopadhyay, Awadhesh Narayan", "last_authors": "Arka Bandyopadhyay, Awadhesh Narayan", "summary": "Magnetism has been a central theme of research in chemistry, physics, and materials science, with chemical composition and bonding playing key roles in determining magnetic behavior. Altermagnets are a newly identified class of magnetic materials that combine features of conventional ferromagnets and antiferromagnets, arising from specific symmetry and electronic-structure motifs. In this review, we present a chemistry-driven viewpoint on altermagnetism, highlighting how crystal chemistry, bonding, and electronic structure enable this unconventional magnetic order. We begin by introducing the fundamental concepts required to understand altermagnets, with an emphasis on symmetry considerations, orbital character, and electronic-structure signatures. We then survey the diverse material families in which altermagnetism has been identified, including pnictides, oxides, and metal-organic and covalent-organic frameworks, drawing attention to coordination environments and structure–property relationships that favor altermagnetic order. We subsequently present experimental approaches which are useful for the characterization of altermagnetic materials. We examine ab initio materials discovery as a promising strategy for identifying new altermagnets, emphasizing how chemical constraints, such as symmetry and bonding, can guide computational searches. Other than their intrinsic importance, altermagnets provide interesting possibilities for technology. For this reason, we highlight possible applications that may be enabled through altermagnetic materials, along with their coupling with existing orders such as ferroelectricity and superconductivity. In conclusion, we point out some challenges and prospects, where chemically-based design guidelines can play an important role towards advancing altermagnetism research. In summary, this review offers an account of recent developments in altermagnetism, from basic concepts to the current state-of-the-art.", "tier": "B_IMPORTANT_CONDMAT", "score": "9", "reason": "Highly relevant chemistry-focused review of symmetry and electronic structure in altermagnets.", "tags": ["material", "altermagnetism", "symmetry"], "image": "https://arxiv.org/html/2609.06159v1/Magnets_model_mag.png", "briefing": {"background": "알터자성(Altermagnetism)은 강자성과 반강자성의 특징을 모두 가지면서도, 비전통적인 자기 질서로 인해 독특한 수송 현상과 위상적 성질을 유도할 수 있어 최근 응집물질물리학에서 가장 뜨거운 화두입니다.", "motivation": "물리학적 관점 위주로 다뤄지던 알터자성을 화학적 결합, 결정 구조, 대칭성이라는 관점에서 체계적으로 재정리하여 새로운 물질 발견의 가이드라인을 제시하고자 합니다.", "result": "결정 화학, 배위 환경, 전자 구조와 알터자성 사이의 상관관계를 정의하고, 알려진 물질군과 향후 잠재적 물질 후보군을 분류했습니다.", "implication": "알터자성 물질을 실험적으로 구현하거나 설계할 때 화학적 직관을 활용할 수 있게 되며, 강유전성 및 초전도체와의 결합 연구를 가속화할 것입니다.", "novelty": "물리학적 모델링을 넘어 화학적 합성 지향적 관점으로 알터자성을 접근하여, 실험적 물질 개발을 위한 실질적인 설계 원칙을 마련했습니다.", "unresolved": "다양한 후보 물질들에 대해 실제 실험적인 자기 구조 분석 및 알터자성 특유의 신호 포착이 아직 완전히 검증되지 않은 사례들이 많습니다.", "future_work": "제시된 화학적 가이드라인에 기반한 고효율 알터자성 물질 합성 및 비전통적 스핀트로닉 소자로의 응용 연구가 기대됩니다.", "concepts": [{"term": "Altermagnetism", "why_emerged": "반강자성처럼 순 자기모멘트가 없지만, 스핀-분리된 밴드 구조를 가져 강자성과 같은 물리적 효과를 내는 물질의 필요성 때문에 등장했습니다.", "origin": "L. Smejkal et al. (2022/2024)", "connections": "비상반성(non-reciprocal) 수송, 스핀-분할 전자 구조, 스핀트로닉스."}, {"term": "Symmetry-based design", "why_emerged": "특정 물리적 성질을 유도하기 위해 필수적인 결정학적 대칭 조건을 충족하는 물질을 효율적으로 찾기 위해 필요합니다.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "위상 절연체 탐색, 자성 재료 공학, 결정장 이론."}], "english_summary": ["Provides a comprehensive chemistry-focused review of altermagnetism.", "Highlights the role of crystal chemistry, bonding, and symmetry in enabling unconventional magnetic order.", "Surveys diverse material families and experimental characterization methods.", "Discusses potentials for technology by coupling altermagnetism with other electronic orders."]}}, {"title": "Anderson Lattice in Incommensurate Nb3Cl8/Graphene van der Waals Heterostructures", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2506.21837", "authors": "Yuchen Gao, Wenjie Zhou, Fan Yang, et al.", "last_authors": "Youguo Shi, Yu Ye", "summary": "The periodic Anderson model}, traditionally realized in rare-earth compounds with limited tunability, have hindered systematic exploration of correlated quantum phenomena. Here, we introduce a strategy for {realizing and }engineering {this model} in incommensurate van der Waals heterostructures by coupling a Mott insulator (Nb$_3$Cl$_8$) with itinerant electrons (from monolayer graphene), circumventing strict lattice-matching requirements. Through magnetotransport and slave spin mean-field calculations, we demonstrate the hybridization gap ($\\Delta\\approx30$ meV), gate-tunable metal-insulator transition, and band-selective electron effective mass enhancement, hallmarks of Kondo coherence. The heterostructure exhibits a nearly order-of-magnitude enhancement in the effective electron mass between hybridized and conventional graphene-like regimes, alongside in-plane magnetic field-induced metal-insulator transitions. Top gate-temperature phase mapping reveals competing correlated states, including insulating and hidden-order phases. This work establishes an electrically tunable van der Waals platform for studying correlated states generated by coupling a Mott-insulating layer to an itinerant-electron system, providing a materials route for exploring low-dimensional correlated quantum phases.", "tier": "B_IMPORTANT_CONDMAT", "score": "9", "reason": "Transport evidence for gate-tunable Kondo coherence and mass enhancement in Nb3Cl8/graphene heterostructures.", "tags": ["experiment", "vdW-heterostructure", "Kondo", "Nb3Cl8", "graphene"], "image": "https://arxiv.org/html/2506.21837v2/figure1-final.png", "briefing": {"background": "반데르발스(vdW) 이종접합은 서로 다른 물리적 성질을 가진 층들을 적층하여 자연계에 존재하지 않는 새로운 양자 상태를 창조하는 플랫폼입니다.", "motivation": "희토류 화합물에서 주로 관찰되던 앤더슨 격자(Kondo lattice) 현상을, 층상 구조 물질을 활용하여 전기적으로 튜닝 가능한 형태로 구현하고자 했습니다.", "result": "Nb3Cl8(Mott 절연체)과 그래핀(금속) 이종접합에서 30 meV 규모의 혼성화 갭과 Kondo 일관성 상태를 입증했으며, 게이트 전압을 통한 금속-절연체 전이를 구현했습니다.", "implication": "강상관 전자계와 이종접합 기술을 결합하여, Kondo 물리와 같은 다체 현상을 초전도체/위상 물질 연구처럼 실험적으로 용이하게 조절할 수 있는 새 장을 열었습니다.", "novelty": "격자 부정합(incommensurate) 조건을 극복하면서도 앤더슨 격자 모델의 핵심인 밴드 선택적 유효 질량 증대를 확인한 것은 Kondo 물리학의 새로운 실험적 접근입니다.", "unresolved": "관찰된 '숨겨진 질서(hidden order)'의 정확한 물리적 정체와 이종접합 계면에서의 상세한 상호작용 메커니즘은 추가 규명이 필요합니다.", "future_work": "이러한 vdW 이종접합을 이용하여 Kondo 상태와 초전도성 또는 위상 상태 간의 경쟁과 공존을 연구하는 후속 실험이 이어질 것입니다.", "concepts": [{"term": "Kondo Coherence", "why_emerged": "금속 내 불순물 스핀이 전도 전자들과 집단적으로 반응하여 단일 입자 특성이 아닌 새로운 상관 상태를 형성하는 것을 설명하기 위해 필요합니다.", "origin": "Jun Kondo (1964) / P. Nozières (1974)", "connections": "Heavy fermion, Kondo 격자 모델, Kondo 절연체."}, {"term": "Anderson Lattice Model", "why_emerged": "국소화된 f-오비탈 전자와 전도 전자 사이의 혼성화를 기술하여 중페르미온계 등의 물리 현상을 설명하기 위해 도입되었습니다.", "origin": "P. W. Anderson (1961)", "connections": "Mott 절연체, Kondo 효과, 비전통적 초전도성."}], "english_summary": ["Realizes the Anderson lattice model in incommensurate Nb3Cl8/graphene heterostructures.", "Demonstrates gate-tunable Kondo coherence, hybridization gaps, and mass enhancement.", "Provides a platform to explore correlated states by coupling Mott insulators to itinerant electrons.", "Observes metal-insulator transitions induced by magnetic fields and electrostatic doping."]}}, {"title": "Decorated electronic kagome lattice in twisted bilayer germanene", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2609.08750", "authors": "Dennis J. Klaassen, Rian A. M. Ligthart, Andr\\'es R. Botello Mendez, et al.", "last_authors": "Zeila Zanolli, Harold J. W. Zandvliet", "summary": "Artificial kagome lattices provide a route to electronic flat bands, geometric frustration, and correlation driven phases, but their realization in atomically controlled two-dimensional materials remains scarce. Here, we show that commensurate twisted bilayer germanene on Ge2Pt produces two electronically distinct large-angle moir\\'e phases. Scanning tunneling microscopy measurements and density functional theory calculations reveal that commensurate twisted bilayers that are odd under an exchange of sublattices are semiconducting, whereas the twisted bilayers with an even parity are metallic. The twisted bilayers with an even parity host an empty state resonance that exhibits an emergent decorated kagome structure with a C3 symmetry. These results establish large-angle twisted germanene as a platform for engineering kagome-like electronic states in a buckled two-dimensional material.", "tier": "B_IMPORTANT_CONDMAT", "score": "9", "reason": "Direct relevance of artificial kagome electronic structure studied via STM.", "tags": ["kagome", "STM", "twisted"], "image": "https://arxiv.org/static/browse/0.3.4/images/arxiv-logo-fb.png", "briefing": {"background": "가고메(Kagome) 격자는 기하학적 좌절(frustration)과 전자적 플랫 밴드를 구현하기 위한 핵심 구조로, 강상관 전자계 물리학에서 매우 중요한 연구 대상입니다. 하지만 원자 단위로 정밀하게 제어된 가고메 격자를 인공적으로 구현하는 것은 여전히 도전 과제입니다.", "motivation": "트위스트된 이층 저머넨(twisted bilayer germanene) 구조가 가진 모아레 패턴을 활용하여 전자적으로 가고메 격자와 유사한 구조를 유도할 수 있는지 확인하고자 함.", "result": "STM과 DFT 계산을 통해 트위스트 각도와 격자 대칭성에 따라 저머넨 이층 구조가 반도체성 혹은 금속성을 띠며, 특정 대칭성에서 가고메 격자 형태의 공명 상태(decorated kagome structure)가 나타남을 확인.", "implication": "트위스트 이층 저머넨이 인공적인 가고메 전자 구조를 구현할 수 있는 새로운 플랫폼이 될 수 있음을 시사함.", "novelty": "기존 AV3Sb5 계열의 벌크 가고메 물질과 달리, 트위스트 2D 물질을 통해 가고메 격자를 엔지니어링할 수 있는 가능성을 제시함.", "unresolved": "이 가고메 형태의 공명 상태가 실제 강상관 상(예: 초전도나 CDW)으로 전이되는지에 대한 직접적인 증거는 부족함.", "future_work": "저온 환경에서의 STS 측정을 통해 해당 가고메 밴드에서의 다체 효과나 위상학적 특성 규명 필요.", "concepts": [{"term": "가고메 격자 (Kagome lattice)", "why_emerged": "기하학적 좌절을 통해 양자 스핀 액체나 특이한 전자 상태를 연구하기 위해 필요함.", "origin": "수학적인 패턴으로서의 유래는 일본 전통 바구니 짜기에서 왔으며, 물리학에서는 Anderson 등에 의해 제안됨.", "connections": "AV3Sb5 시리즈, 허니컴 격자, 플랫 밴드 물리."}, {"term": "모아레 패턴 (Moire pattern)", "why_emerged": "이층 구조의 격자 불일치나 트위스트로 인해 거대한 주기성이 발생하며, 이를 통해 밴드 구조를 제어할 수 있음.", "origin": "물리학적으로는 그래핀 모아레 연구에서 획기적으로 발전함 (Jarillo-Herrero et al.).", "connections": "트위스트 이층 그래핀, 벌크 모아레 물질."}], "english_summary": ["Twisted bilayer germanene produces distinct moire phases controlled by lattice symmetry.", "STM and DFT reveal the emergence of a decorated kagome electronic structure in even-parity bilayers.", "The results demonstrate a tunable 2D platform for engineering kagome physics without conventional synthesis."]}}, {"title": "Discovery of Superconductivity in a Bulk Moire Superlattice Material", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2609.06622", "authors": "Subham Naik, Paul Monson, Susanta Manna, et al.", "last_authors": "Rahul Sharma, Gohil S. Thakur", "summary": "Moire materials provide a versatile platform realizing emergent electronic states arising from enhanced correlation due to flat bands. A variety of phenomena including superconductivity, low dimensional ferromagnetism, Mott insulating phase, topological phenomena have been reported in such systems. To date, moire phenomena have been predominantly explored in artificially assembled low-dimensional van der Waals heterostructures, where relative twist and lattice alignment are controlled during device fabrication. Recently, intrinsically grown bulk moire crystals have emerged as a complementary materials platform, in which lattice mismatch between constituent layers generates a coherent moire superlattice throughout the bulk crystal. Here we report the evidence of bulk superconductivity in single crystals of a recently reported bulk Moire materials (Sr6TaS8)1+x(TaS2)8 under ambient pressure conditions. The material exhibits a superconducting transition at Tc = 2.5 K, evidenced consistently by electrical transport, magnetic susceptibility, and heat-capacity measurements on single-crystal and polycrystalline samples. Transport measurements reveal a pronounced anomaly near 270 K, suggestive of a charge-density-wave transition in this moire system. The observation of bulk superconductivity establishes superconductivity as an emergent phase in this intrinsically synthesized moire material and highlights bulk moire crystals as a promising platform for investigating correlated quantum phenomena beyond artificially assembled two-dimensional heterostructures.", "tier": "B_IMPORTANT_CONDMAT", "score": "9", "reason": "Observation of bulk superconductivity and charge-density-wave transitions in a newly synthesized bulk moire crystal.; demoted from A: broad CM, not direct user/project hit", "tags": ["material", "moire", "superconduct"], "image": "https://arxiv.org/static/browse/0.3.4/images/arxiv-logo-fb.png", "briefing": {"background": "모아레 초격자는 인공적 vdW 이종접합에서 주로 탐구되어 왔으나, 최근에는 합성 과정에서 자연스럽게 모아레 패턴이 형성되는 벌크 물질이 새로운 플랫폼으로 주목받고 있습니다.", "motivation": "새로 합성된 벌크 모아레 물질인 (Sr6TaS8)1+x(TaS2)8에서 강상관 전자계 현상(초전도, CDW)이 발현되는지 확인하고자 함.", "result": "2.5 K에서 벌크 초전도성을 관측하고, 270 K 근처에서 전하밀도파(CDW)로 추정되는 이상 현상을 전기적·자기적 측정으로 확인.", "implication": "복잡한 소자 제작 없이도 벌크 결정 내에 내재된 모아레 초격자를 통해 강상관 물리학을 연구할 수 있는 새로운 물질군의 가능성을 제시함.", "novelty": "인공 이종접합이 아닌 벌크 결정에서 초전도와 CDW가 동시에 관측된 모아레 기반의 신규 물질 발견.", "unresolved": "해당 물질의 구체적인 CDW 구조와 초전도성과의 미시적인 연관성은 아직 미지수임.", "future_work": "ARPES를 통한 페르미 표면 및 밴드 구조 관측, CDW의 기원 규명 및 압력에 따른 물성 변화 연구.", "concepts": [{"term": "벌크 모아레 물질 (Bulk Moire materials)", "why_emerged": "2D 이종접합 소자 제작의 한계를 극복하고 결정 내 주기적 모아레 잠재력을 활용하기 위해.", "origin": "최근 2-3년 내에 연구가 본격화된 신생 분야.", "connections": "vdW 이종접합, 층상 구조 화합물."}, {"term": "전하밀도파 (CDW)", "why_emerged": "전자와 격자 간의 상호작용으로 인해 전하 밀도가 주기적으로 변조되는 상태를 이해하기 위해.", "origin": "Peierls instability 연구에서 확립됨.", "connections": "AV3Sb5, 전이금속 디칼코게나이드(TMD)."}], "english_summary": ["Evidence of bulk superconductivity (Tc=2.5 K) and CDW transitions in (Sr6TaS8)1+x(TaS2)8.", "Highlights bulk moire crystals as a scalable platform for studying correlated quantum states.", "Consistent results across transport, magnetization, and heat capacity measurements."]}}, {"title": "Fermi-surface studies of altermagnetic CrSb from Shubnikov-de Haas oscillations", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2602.24033", "authors": "Sajal Naduvile Thadathil, Beat Valentin Schwarze, Jaafar Ansari, et al.", "last_authors": "Joachim Wosnitza, Toni Helm", "summary": "Within the family of altermagnets, CrSb is a metallic, collinearly ordered material that exhibits particularly strong symmetry-induced spin splitting in its band structure. In this study, we combine electrical magnetotransport measurements up to 68 T on microfabricated single-crystalline CrSb with first-principles calculations to investigate its Fermi surface. Notably, we study the temperature and field-orientation dependence of magnetic quantum oscillations observed in the magnetoresistance. The observed frequency spectrum agrees well with results from density-functional-theory calculations that take spin-orbit coupling into account, without invoking significant ad hoc band shifts. Our results confirm the predicted electronic band structure of altermagnetic CrSb and highlight the importance of high magnetic fields for accurately mapping the Fermi surfaces of unconventional emergent materials.", "tier": "B_IMPORTANT_CONDMAT", "score": "9", "reason": "Experimental Fermi surface mapping of a key altermagnet; highly complementary to ARPES interests.", "tags": ["altermagnetism", "Fermisurface", "magnetotransport", "CrSb"], "image": "https://arxiv.org/html/2602.24033v2/L1_PF_RVsB.png", "briefing": {"background": "알터자성(Altermagnetism)은 시간 역전 대칭성이 깨져 있으면서도 결정학적 대칭성에 의해 스핀 분할이 일어나는 새로운 자기 질서 유형으로, 최근 Spintronics 분야에서 폭발적인 관심을 받고 있음.", "motivation": "CrSb의 알터자성 특성이 예상된 밴드 구조와 일치하는지 슈브니코프-드 하스(SdH) 진동을 통해 실험적으로 검증하고자 함.", "result": "68 T의 고자기장에서 수행된 자기 양자 진동 측정 결과가 DFT 계산 결과와 잘 일치함을 확인하여, CrSb의 알터자성 밴드 구조를 실험적으로 입증.", "implication": "알터자성 물질의 페르미 표면 해석에 있어 ad-hoc 수정 없이 계산이 잘 맞음을 보임으로써 해당 이론의 신뢰도를 확보함.", "novelty": "최신 이론인 알터자성을 실제 물질인 CrSb에서 고자기장 수송 측정을 통해 직접적으로 검증한 연구.", "unresolved": "알터자성 상태에서의 세밀한 스핀 편극 분포나 페르미 표면의 이방성에 대한 심층적인 실험 데이터는 추가 연구 필요.", "future_work": "Spin-resolved ARPES를 통한 직접적인 스핀 스플리팅 측정 및 관련 Spintronics 소자 응용 연구.", "concepts": [{"term": "알터자성 (Altermagnetism)", "why_emerged": "강자성과 반강자성의 장점을 모두 가진 새로운 자기 질서체로서 스핀트로닉스 응용 가능성 때문에 대두됨.", "origin": "Jungwirth 등 최근 연구진들에 의해 이론적 체계가 정립됨.", "connections": "반강자성, 스핀-궤도 결합(SOC), 비점성적 밴드 스플리팅."}, {"term": "SdH 진동 (Shubnikov-de Haas oscillations)", "why_emerged": "자기장 하에서 페르미 표면의 단면적을 직접 측정하여 전자 구조를 규명하기 위해 필요.", "origin": "1930년 Shubnikov와 de Haas에 의해 실험적으로 발견됨.", "connections": "자기 양자 진동, 페르미 표면 매핑."}], "english_summary": ["Experimental verification of altermagnetic CrSb band structure using SdH oscillations.", "High-field data up to 68 T aligns well with DFT calculations including spin-orbit coupling.", "Confirms symmetry-induced spin splitting in the Fermi surface of metallic CrSb."]}}, {"title": "First-Principles Study of Magnetism, Electronic Structure, and Bonding in Nb-Mn-Ge Kagome Compounds", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2609.06362", "authors": "Wei-Shen Tee, Shiya Chen, Weiyi Xia, Peter Minch, Cai-Zhuang Wang, Vladimir Antropov", "last_authors": "Cai-Zhuang Wang, Vladimir Antropov", "summary": "In this work, we systematically investigate the magnetic ground states, electronic structures, and bonding characteristics of the computationally predicted stable NbMn6Ge6, NbMn6Ge5, and NbMn6Ge4 using first-principles calculations. Our results show that structurally stable NbMn6Ge6 has a collinear antiferromagnetic configuration, while the metastable rhombohedral NbMn6Ge5 and NbMn6Ge4 favor ferromagnetic ground states. Magnetic moments on Mn atoms are nearly localized, suggesting the applicability of a generalized spin Hamiltonian. Magnetic anisotropy in AFM NbMn6Ge6 and FM NbMn6Ge5 has uniaxial behavior, while FM NbMn6Ge4 has in-plane anisotropy. Charge density difference and electron localization function analyses further show charge redistribution and bonding features within the Mn-Ge Kagome network and between adjacent structural layers. Electronic structures near the Fermi level show no features suitable for topological magnetism studies. Experimental synthesis, structural characterization, and magnetic measurements are required to verify our predictions.", "tier": "B_IMPORTANT_CONDMAT", "score": "9", "reason": "DFT study of magnetic ground states and electronic structure in new Nb-Mn-Ge kagome compounds.; demoted from A: broad CM, not direct user/project hit", "tags": ["DFT", "kagome", "electronicstructure"], "image": "https://arxiv.org/static/browse/0.3.4/images/arxiv-logo-fb.png", "briefing": {"background": "카고메 격자 구조를 가진 화합물은 전자 구조에서 밴드 평탄화(flat band)와 디랙 점(Dirac point)을 구현할 수 있어 위상학적 물리 현상 연구의 핵심 소재입니다.", "motivation": "최근 AV3Sb5 등 카고메 금속의 위상학적 성질에 대한 관심이 높아짐에 따라, Nb-Mn-Ge 계열의 새로운 화합물들이 구조적으로 안정한지, 그리고 그 전자적/자기적 특성이 무엇인지 체계적으로 탐구할 필요가 있었습니다.", "result": "NbMn6Ge6는 반강자성 상태를 선호하며, NbMn6Ge5와 NbMn6Ge4는 준안정적인 강자성 상태를 가짐을 확인했습니다. 또한, 페르미 준위 근처에서 위상학적 자성 연구에 적합한 특출난 전자 구조적 특징은 발견되지 않았습니다.", "implication": "이 물질들은 위상학적 물성보다는 국소 자기 모멘트를 가진 강자성체 혹은 반강자성체로서의 물리적 성질 연구에 더 적합할 가능성을 시사합니다.", "novelty": "이론적 예측을 통해 새로운 Nb-Mn-Ge 화합물의 자기적 기저 상태 tance anomalies are linked to orbital magnetic domain configurations.", "In-plane magnetic field dependence highlights the role of spin-valley coupling.", "Domain formation is tunable via gate-voltage and magnetic field history."]}}, {"title": "Nearly Isotropic Vortex Solid in (La,Pr)3Ni2O7 Thin Films", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2609.07510", "authors": "Yaolong Bian, Yaqi Chen, Heng Wang, et al.", "last_authors": "Zhuoyu Chen, Jinglei Zhang", "summary": "The discovery of superconductivity in bulk bilayer nickelates has established a new platform for exploring high- T c T_{c} superconductivity beyond the cuprates. The role of the Ni 3 ​ d z 2 3d_{z^{2}} -derived γ \\gamma band in the superconductivity of bilayer nickelates remains unresolved. By performing simultaneous resistance and diamagnetism measurements on (La,Pr) 3 Ni 2 O 7 thin films, we map the vortex melting phase diagram for both in-plane and out-of-plane magnetic fields. For H | c H\\parallel c , the geometric confinement effect gives rise to pancake vortices. Remarkably, the anisotropy parameter of the vortex melting field γ H m ≡ H m a ​ b / H m c \\gamma_{H_{m}}\\equiv H_{m}^{ab}/H_{m}^{c} decreases monotonically with decreasing temperature and approaches unity at low temperatures. Within the anisotropic Ginzburg–Landau scaling, H m a ​ b / H m c = ρ s a ​ b / ρ s c H_{m}^{ab}/H_{m}^{c}=\\sqrt{\\rho_{s}^{ab}/\\rho_{s}^{c}} tracks the superfluid-density anisotropy. Such a vortex solid implies a nearly isotropic superfluid density, which is irreconcilable with the strictly two-dimensional 3 ​ d x 2 − y 2 3d_{x^{2}-y^{2}} -derived bands, but naturally explained by a substantial interlayer superfluid contribution from the 3 ​ d z 2 3d_{z^{2}} -derived γ \\gamma band. Our results provide thermodynamic evidence for a substantial contribution of the γ \\gamma band to superconductivity in bilayer nickelate thin films.", "tier": "B_IMPORTANT_CONDMAT", "score": "9", "reason": "Evidence for 3d_{z^2} band contribution to superconductivity in bilayer nickelates; high electronic-structure relevance.", "tags": ["experiment", "nickelates", "superconductivity"], "image": "https://arxiv.org/html/2609.07510v1/fig.1.png", "briefing": {"background": "닉네이트(Nickelates) 초전도체는 구리 산화물과 유사한 전자 구조를 가지면서도 다중 궤도 특성을 가져 고온 초전도성 기원 연구의 핵심입니다.", "motivation": "이층 니켈화물에서 Ni 3d z^2 궤도(감마 밴드)가 초전도성에 얼마나 기여하는지, 단순 2D x^2-y^2 모델만으로 충분한지 확인하고자 했습니다.", "result": "와류 고체 상태의 이방성 측정 결과, 초전도 유체 밀도가 거의 등방적임을 발견했습니다. 이는 3d z^2 궤도의 층간 결합 기여가 필수적임을 의미합니다.", "implication": "이층 니켈화물의 초전도성은 단순 2차원 평면 모델이 아닌, 입체적인 궤도 결합에 기반하고 있음을 강력하게 시사합니다.", "novelty": "열역학적 와류 상태 측정을 통해 간접적으로 층간 밴드의 기여를 증명했다는 점이 중요하며, 이는 닉네이트 물리학의 새로운 표준 모델을 제시합니다.", "unresolved": "실제 전자 구조 계산과 결합한 구체적인 궤도 혼성 메커니즘의 세부 사항은 추가적인 해석이 필요합니다.", "future_work": "ARPES를 통해 직접적인 감마 밴드의 페르미 면과 궤도 혼성 정도를 관측하는 실험이 필요합니다.", "concepts": [{"term": "와류 고체 (Vortex solid)", "why_emerged": "제2종 초전도체 내부의 자속선이 어떻게 정렬되는지 이해하기 위해 필요.", "origin": "Abrikosov에 의해 1957년 이론화.", "connections": "핀닝(pinning) 현상, 초전도 이방성 측정."}, {"term": "감마 밴드 (γ-band)", "why_emerged": "니켈화물의 복잡한 d-궤도 특성을 기술하기 위해 사용.", "origin": "닉네이트 초전도 연구 초기부터 등장.", "connections": "d_z^2 궤도, 층간 결합, 고온 초전도성."}], "english_summary": ["Investigation of vortex melting in (La,Pr)3Ni2O7 thin films.", "Observed nearly isotropic superfluid density suggests strong interlayer contribution.", "Provides thermodynamic evidence for Ni 3d_z^2 band contribution to superconductivity.", "Challenges purely 2D electronic models in bilayer nickelates."]}}, {"title": "Observation of multipartite spin entanglement in a cuprate chain", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2609.08134", "authors": "S. F. R. TenHuisen, Z. Shen, V. Bhartiya, V. Menon, P. Sharma, H. Padma, et al.", "last_authors": "M. P. M. Dean, V. Bisogni, Y. Wang, M. Mitrano", "summary": "Quantum materials are believed to host highly entangled states of matter, but probing and quantifying such entanglement has long remained experimentally elusive. Here, we use resonant inelastic X-ray scattering (RIXS) as a probe of multipartite spin entanglement. By projecting the RIXS cross section onto the appropriate spin excitation channel, we show that the Quantum Fisher Information can be extracted directly from the measured spin fluctuation spectrum. We detect at least 7-partite spin entanglement in the model one-dimensional cuprate Sr$_2$CuO$_3$, revealing one of the largest entanglement depths yet reported in a solid. The observed entanglement depth agrees with Hubbard-model expectations and persists to elevated temperatures. Our results establish RIXS as an experimental probe of many-body spin entanglement and provide a platform for extensions to charge and orbital sectors and nonequilibrium settings.", "tier": "B_IMPORTANT_CONDMAT", "score": "9", "reason": "RIXS study of a 1D cuprate; directly aligns with technical and material class interests.", "tags": ["method", "RIXS", "material", "cuprate", "topic", "entanglement"], "image": "https://arxiv.org/html/2609.08134v1/figures/Fig1.png", "briefing": {"background": "양자 물질에서 다체 얽힘(entanglement)은 초전도와 같은 특이 물성을 이해하는 핵심 요소이지만, 이를 실험적으로 직접 정량화하는 것은 매우 어렵습니다.", "motivation": "RIXS(공명 비탄성 X선 산란) 스펙트럼을 분석하여 물질 내의 스핀 얽힘 깊이를 직접 측정할 수 있는 방법론을 구축하고자 했습니다.", "result": "Sr2CuO3라는 1차원 구리 산화물 모델 시스템에서 Quantum Fisher Information을 추출하여 최소 7-파트 스핀 얽힘을 관측했습니다.", "implication": "RIXS가 이제 단순한 들뜸 에너지 측정 도구를 넘어 다체 얽힘을 정량화하는 강력한 분석 플랫폼으로 활용될 수 있음을 보여줍니다.", "novelty": "RIXS를 통해 솔리드 스테이트 물질에서 직접적인 얽힘 깊이를 측정했다는 점이 획기적이며, 향후 전하 및 궤도 섹터로의 확장이 기대됩니다.", "unresolved": "1차원 모델 시스템 외에 더 복잡한 2차원 강상관 전자계에서도 동일한 분석이 얼마나 정밀하게 적용될 수 있는지는 추가 연구가 필요합니다.", "future_work": "비평형 상태에서의 얽힘 동역학 연구 및 전하/궤도 자유도에 대한 얽힘 분석으로의 확장.", "concepts": [{"term": "RIXS", "why_emerged": "물질의 전하, 스핀, 궤도 자유도를 에너와 운동량 분해능으로 동시에 탐색하기 위해 개발되었습니다.", "origin": "20세기 후반 개발 시작, 최근 싱크로트론 기술 발전으로 고해상도 측정 가능.", "connections": "INS(중성자 산란)와 상보적 관계, ARPES와 결합하여 전자 구조와 atures of a ferro-Josephson effect in twisted graphene", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2608.25257", "authors": "Ruiheng Su, Zhenxiang Gao, Christopher Coleman, et al.", "last_authors": "Allan H. MacDonald, Joshua Folk", "summary": "When a spin-polarized current is driven across a magnetic domain wall, the resulting spin-transfer torque may, beyond a critical threshold, set the wall's moments into precession. This precession modulates the Berry curvature experienced by electrons traversing the wall, producing an electromotive force that is topological in nature and proportional to the precession frequency, mapping precisely onto the DC Josephson effect and leading to the name ferro-Josephson effect. We report signatures consistent with this effect in a twisted graphene van der Waals heterostructure, where spin and valley textures are linked by exchange, Hund's coupling, and spin-orbit interactions. Tuned to fillings where the isospin degeneracy is spontaneously broken, the samples develop a sharp peak in the longitudinal resistance within a fraction of a millitesla of $B_\\parallel=0$---a peak that disappears as the current is reduced toward zero. In differential resistance the feature resolves into sharp resonances that disperse with $B_\\parallel$ on microtesla and picoampere scales. We argue that these arise from the current-driven precession of spin-domain-wall moments, in competition with the in-plane anisotropy set by a minuscule applied field, and that they establish nonlinear transport as a sensitive probe of isospin domain-wall dynamics at energy scales far below $k_BT$.", "tier": "B_IMPORTANT_CONDMAT", "score": "9", "reason": "Experimental signatures of ferro-Josephson effect in twisted graphene with spin/valley textures.; demoted from A: broad CM, not direct user/project hit", "tags": ["graphene", "twistedbilayer", "vanderWaals", "Berrycurvature", "topological", "transport", "spinphysics", "experimental"], " Nowack", "summary": "Superconductivity in stoichiometric FeTe opens access to the FeTe endpoint of the Fe(Se,Te) phase diagram, yet the nature of its superconducting pairing state remains unresolved. In this work, we combine scanning superconducting quantum interference device (SQUID) microscopy, electrical transport, scanning tunneling microscopy and spectroscopy (STM/S), and mean-field calculations to investigate the local superfluid response and pairing state of FeTe thin films with tunable stoichiometry. Even in stoichiometric FeTe, we observe micrometer-scale spatial variations in both superfluid stiffness and superconducting transition temperature $T_c$, while the London penetration depth remains non-saturating down to 0.02$T_c$ and follows a power-law temperature dependence with an exponent of approximately 1-1.5. Together with a V-shaped low-energy density of states and two-gap modeling, these results indicate a superconducting state with gap nodes or deep minima, consistent with either a $d$-wave or nodal $s$-wave superconducting state. Our findings establish stoichiometric FeTe as a distinct superconducting regime that departs from the trend toward more isotropic gaps at intermediate Se/Te compositions, providing a new benchmark for modern microscopic theories of iron-chalcogenide superconductivity. Our work also reveals a crossover from weak to rapid suppression of $T_c$ as superfluid stiffness decreases, connecting FeTe to the broader phenomenology observed in unconventional superconductors.", "tier": "B_IMPORTANT_CONDMAT", "score": "9", "reason": "Experimental STM and transport study on an iron-chalcogenide superconductor, highly relevant to electronic spectroscopy interests.", "tags": ["method", "STM", "material", "FeTe", "superconductivity"], "image": "https://arxiv.org/html/2609.08116v1/Fig1_main_new.png", "briefing": {"background": "철 기반 초전도체(Fe-based superconductors)는 스핀 및 궤도 자유도가 결합된 다중 밴드 시스템으로, 전자 상관관계와 초전도 대칭성 간의 상호작용을 연구하는 핵심 분야입니다.", "motivat le crystal XRD reveals no evidence of interstitial nickel, confirming a close-to-stoichiometric composition. This work establishes a reliable benchmark for the crystal structure of stoichiometric NiTe$_{2}$, offering a reference for future studies on its physical properties.", "tier": "B_IMPORTANT_CONDMAT", "score": "9", "reason": "Synthesis and structural characterization of NiTe2 single crystals, a direct user material interest.; demoted from A: broad CM, not direct user/project hit", "tags": ["materialsynthesis", "structuralcharacterization", "telluride", "112tellurides"], "image": "https://arxiv.org/html/2608.02334v2/1.png", "briefing": {"background": "NiTe2는 112 계열의 전이금속 칼코겐 화합물로서, 위상학적 전자 구조와 초전도성, 자기적 특성이 복합적으로 나타날 가능성이 있어 주목받는 소재입니다.", "motivation": "기존 연구에서 논란이 되었던 NiTe2의 화학양론적 조성과 구조적 결함을 해결하고, 고품질 단결정을 합성하여 물리적 특성 연구의 표준을 마련하고자 했습니다.", "result": "화학 기상 수송법을 통해 니켈 인터스티셜(interstitial)이 없는 고순도 NiTe2 단결정을 합성하고 그 구조를 정밀하게 규명했습니다.", "implication": "향후 해당 물질에 대한 ARPES 및 수송 측정 결과가 샘플 결함에 의한 아티팩트가 아님을 보장하는 신뢰성 높은 기준을 제공합니다.", "novelty": "고해상도 XRD를 통해 니켈 농도가 완벽히 제어되었음을 검증함으로써, 물리적 성질 연구를 위한 신뢰도 높은 모재를 확보했습니다.", "unresolved": "합성된 순수 샘플에서의 위상학적 표면 상태나 초전도/자기적 물성의 정밀 측정은 이번 논문의 범위를 벗어나 있습니다.", "future_work": "확보된 고품질 결정을 활용하여 ARPES를 통한 전자 구조 매핑과 저온 환경에서의 수송 특성 연구가 이어져야 합니다.", "concepts": [{"term": "112 tellurides", "why_emerged": "NiTe2 및 유사 화합물군(Ni/Pd/PtTe2)이 갖는 전이금속과 칼코겐의 1:2 조성비를 지칭합니다.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "전이금속 디칼코게나이드(TMD), 위상학적 반금속."}, {"term": "Chemical Vapor Transport (CVT)", "why_emerged": "낮은 온도에서 고순도의 단결정을 얻기 위해 휘발성 전달체를 사용하는 일반적인 합성법입니다.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "결정 성장 기법, 단결정 재료 과학."}], "english_summary": ["Reported the synthesis of stoichiometric NiTe2 single crystals using chemical vapor transport.", "Performed precise structural characterization via powder and high-resolution single-crystal X-ray diffraction.", "Confirmed the absence of interstitial nickel, establishing a benchmark for physical property studies.", "Provides a foundation for future electronic structure and topological studies."]}}, {"title": "Three-Dimensional Fermiology and Thickness-Tuned Magnetotransport in Single-Crystalline Antimony Flakes", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2609.06561", "authors": "Mikhail Gaponov, Jicheng Wang, Liang Zha, Rui Wu", "last_authors": "Liang Zha, Rui Wu", "summary": "The extreme magnetoresistance of compensated semimetals is governed by both the Fermi-surface geometry and carrier relaxation, but these contributions are difficult to disentangle in finite-size structures. Here, we combine longitudinal and Hall magnetotransport measurements with temperature- and angle-dependent Shubnikov--de Haas oscillations in single-crystalline Sb flakes grown by chemical vapor deposition (CVD), with thicknesses ranging from 110 to 783 nm. As thickness increases, the non-saturating MR at 2 K and 14 T rises nearly 30-fold, reaching $7.13\\times10^{5}\\%$, while the primary frequency $F_{\\alpha}$ remains approximately 99 T without any systematic shift. A joint three-channel analysis of $\\rho_{xx}(B)$ and $\\rho_{xy}(B)$ reveals that this evolution is driven by an increase in the mobility of a nearly compensated electron--hole pair, rather than by a reconstruction of the primary pockets. Angle-dependent measurements confirm the existence of a closed three-dimensional $\\alpha$ pocket, and a reproducible high-frequency sector (335-377 T) is consistent with the electron $\\beta$ orbit of the $L$-point pockets in bulk Sb. Together, the transport and quantum-oscillation results show that thickness tunes extreme MR through dimension-dependent scattering while preserving bulk-like fermiology.", "tier": "B_IMPORTANT_CONDMAT", "score": "9", "reason": "Investigation of three-dimensional fermiology and mobility-driven magnetoresistance in single-crystalline antimony flakes.; demoted from A: broad CM, not direct user/project hit", "tags": ["material", "fermiology", "transport"], "image": "https://arxiv.org/html/2609.06561v1/figures/Fig01_Samples.png", "briefing": {"background": "보상된 반금속(compensated semimetal)에서 나타나는 극단적인 자기저항(extreme magnetoresistance)은 페르미 표면의 기하학적 구조와 운반자의 산란 특성에 의해 결정됩니다. 그러나 마이크로/나노 스케일 시료에서는 크기 효과로 인해 이 두 기여도를 분리하기 어렵습니다.", "motivation": "안티모니(Sb) 박막에서 두께 변화가 자기저항 특성에 미치는 영향을 규명하고, 이것이 페르미 표면의 재구성에 의한 것인지 운반자의 이동도(mobility) 변화에 의한 것인지 파악하고자 했습니다.", "result": "안티모니 박막의 두께를 증가시킬 때 자기저항은 급격히 상승하지만, 양자 진동 주파수는 일정하게 유지됨을 확인했습니다. 이는 페르미 표면 구조(bulk-like fermiology)는 그대로 유지되면서 두께에 따른 운반자 이동도 변화가 극단적 자기저항을 유도함을 의미합니다.", "implication": "반금속 박막 소자에서 자기저항을 제어할 때 페르미 표면의 구조적 변화 없이도 소자의 크기 및 산란 환경 제어를 통해 전자기적 특성을 튜닝할 수 있음을 보여줍니다.", "novelty": "CVD로 성장시킨 단결정 안티모니 박막을 사용하여 3차원 페르미 면 구조를 정밀하게 분석했으며, 극단적 자기저항의 원인을 이동도 효과로 명확히 분리해냈다는 점에서 물리적 통찰을 제공합니다.", "unresolved": "박막 내부의 구체적인 산란 기구(scattering mechanism)가 두께에 따라 어떻게 변하는지에 대한 미시적 원리는 명확히 규명되지 않았습니다.", "future_work": "다른 반금속 계열 박막에서의 유사한 두께 의존성 연구와 산란 기구 규명을 위한 온도/두께 의존적 이동도 분석이 기대됩니다.", "concepts": [{"term": "극단적 자기저항 (Extreme MR)", "why_emerged": "외부 자기장에 따라 저항이 비정상적으로 크게 변하는 현상을 이해하고 소자에 응용하기 위해 중요해짐.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "보상된 반금속(WTe2, Cd3As2 등)의 기본 물리 특성."}, {"term": "Shubnikov–de Haas(SdH) 진동", "why_emerged": "물질 내부의 페르미 표면 단면적을 실험적으로 결정하기 위해 필수적인 방법.", "origin": "L. V. Shubnikov와 W. J. de Haas에 의해 1930년 발견.", "connections": "양자 진동, 페르미올로지 분석의 표준 도구."}], "english_summary": ["Investigated thickness-dependent magnetotransport in CVD-grown antimony flakes.", "Extreme magnetoresistance increases significantly with thickness while the Fermi surface remains bulk-like.", "Transport analysis attributes the MR enhancement to mobility changes rather than Fermi surface reconstruction.", "Confirms 3D alpha pocket and beta orbits via angle-dependent quantum oscillations."]}}, {"title": "g-wave altermagnetic order parameter in hematite", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2609.08693", "authors": "Tianren Wang, Yuehong Li, Yu Feng, et al.", "last_authors": "Jaewon Choi, Qisi Wang", "summary": "Altermagnets combine the vanishing net magnetization of antiferromagnets with momentum-dependent spin splitting. Magnon band splitting provides a direct probe of altermagnetic order and may enable chirality-selective magnon transport, yet the momentum-space symmetry of this splitting has not been determined quantitatively. Here we use inelastic neutron scattering to map the momentum dependence of altermagnetic magnon splitting in hematite ($\\alpha$-Fe$_2$O$_3$). The splitting vanishes along nodal directions and reaches maxima off the nodes, revealing the $g$-wave symmetry of the altermagnetic order parameter. These results agree with linear spin-wave theory calculations based on the altermagnetic model, which further identify the nondegenerate branches as magnons of opposite chirality and trace the splitting to symmetry-inequivalent long-range exchange interactions. Our results provide the first quantitative determination of the momentum-space symmetry of altermagnetic chiral magnons. These findings, together with hematite's high magnetic ordering temperature and low magnon damping, establish it as a promising platform for low-dissipation, symmetry-selective magnonic applications.", "tier": "B_IMPORTANT_CONDMAT", "score": "9", "reason": "Quantitative neutron scattering study of altermagnetic symmetry, a core interest topic.", "tags": ["experiment", "hematite", "altermagnetism"], "image": "https://arxiv.org/html/2609.08693v1/fig_overall.png", "briefing": {"background": "알터자성(Altermagnetism)은 반강자성체처럼 순 자화는 0이지만, 스핀-궤도 결합 없이도 운동량 의존적인 스핀 분할(momentum-dependent spin splitting)을 보이는 새로운 자성 상태입니다.", "motivation": "알터자성체 후보 물질인 적철석(Hematite)에서 이론적으로 예측된 알터자성 질서 매개변수의 대칭성을 실험적으로 정량화하고자 했습니다.", "result": "비탄성 중성자 산란(INS)을 통해 적철석의 마그논 분산 관계를 매핑하고, 이것이 g-wave 대칭성을 가짐을 확인했습니다. 이는 스핀 분할이 노드 방향에서 사라지고 비노드 방향에서 최대가 됨을 의미합니다.", "implication": "알터자성 모델을 실험적으로 강력하게 뒷받침하며, 적철석   slideEl.className = 'slide';
  const r = slides[index];
  const b = r.briefing || {};
  const head = document.createElement('div');
  head.className = 'paper-head';
  if (r.image) {
    const figure = document.createElement('figure');
    figure.className = 'figure';
    const img = document.createElement('img');
    img.src = r.image; img.alt = 'Figure or article preview image'; img.loading = 'lazy'; img.referrerPolicy = 'no-referrer'; img.onerror = () => figure.remove();
    figure.appendChild(img);
    figure.appendChild(textEl('figcaption', '', 'Figure / article preview image from the source page'));
    head.appendChild(figure);
  }
  const headText = document.createElement('div');
  headText.className = 'head-text';
  const badges = document.createElement('div');
  badges.className = 'badges';
  if (r.score) badges.appendChild(textEl('span', 'badge score', `${r.score}/10`));
  if (r.tier) badges.appendChild(textEl('span', 'badge', r.tier));
  if (r.journal) badges.appendChild(textEl('span', 'badge', r.journal));
  if (r.source) badges.appendChild(textEl('span', 'badge', r.source));
  headText.appendChild(badges);
  const title = document.createElement('h1');
  if (r.link) { const titleLink = document.createElement('a'); titleLink.href = r.link; titleLink.target = '_blank'; titleLink.rel = 'noopener noreferrer'; titleLink.textContent = r.title || ''; title.appendChild(titleLink); }
  else { title.textContent = r.title || ''; }
  headText.appendChild(title);
  headText.appendChild(textEl('p', 'meta', [r.journal, r.source].filter(Boolean).join(' | ')));
  if (r.last_authors || r.authors) { const authors = document.createElement('p'); authors.className = 'authors'; if (r.last_authors) authors.append('Last authors: ' + r.last_authors); if (r.authors) authors.append((r.last_authors ? ' | ' : '') + 'Authors: ' + r.authors); headText.appendChild(authors); }
  appendLabeledText(headText, 'why', 'Filter reason: ', r.reason);
  if (r.tags && r.tags.length) { const tags = document.createElement('div'); tags.className = 'tags'; r.tags.forEach(tag => tags.appendChild(textEl('span', 'tag', '#' + tag))); headText.appendChild(tags); }
  if (r.link) { const link = document.createElement('a'); link.className = 'link'; link.href = r.link; link.target = '_blank'; link.rel = 'noopener noreferrer'; link.textContent = 'Open paper'; headText.appendChild(link); }
  head.appendChild(headText);
  if (r.summary) { const abstract = document.createElement('p'); abstract.className = 'original-abstract'; const strong = textEl('strong', '', 'Original abstract'); abstract.appendChild(strong); abstract.append(r.summary); head.appendChild(abstract); }
  slideEl.appendChild(head);
  const briefing = document.createElement('div');
  briefing.className = 'briefing';
  appendBriefSection(briefing, 'Background', b.background);
  appendBriefSection(briefing, 'Motivation', b.motivation);
  appendBriefSection(briefing, 'Result', b.result);
  appendBriefSection(briefing, 'Implication', b.implication);
  appendBriefSection(briefing, "Why it's important / Novelty", b.novelty);
  appendBriefSection(briefing, 'Unresolved Questions', b.unresolved);
  appendBriefSection(briefing, 'Expected Future Work', b.future_work);
  if (b.concepts && b.concepts.length) {
    const section = document.createElement('section');
    section.className = 'brief-section wide';
    section.appendChild(textEl('h2', '', 'Concepts / Terms'));
    const concepts = document.createElement('div');
    concepts.className = 'concepts';
    b.concepts.forEach(c => {
      const item = document.createElement('div');
      item.className = 'concept';
      item.appendChild(textEl('h3', '', c.term || 'Concept'));
      [['왜 생겼나: ', c.why_emerged], ['누가 만들었나: ', c.origin], ['연결되는 흐름: ', c.connections]].forEach(([label, text]) => { if (!text) return; const p = document.createElement('p'); const bold = textEl('b', '', label); p.appendChild(bold); p.append(text); item.appendChild(p); });
      concepts.appendChild(item);
    });
    section.appendChild(concepts);
    briefing.appendChild(section);
  }
  if (b.english_summary && b.english_summary.length) { const section = document.createElement('section'); section.className = 'brief-section wide'; section.appendChild(textEl('h2', '', 'English Summary')); const ul = document.createElement('ul'); b.english_summary.slice(0, 5).forEach(line => ul.appendChild(textEl('li', '', line))); section.appendChild(ul); briefing.appendChild(section); }
  slideEl.appendChild(briefing);
  counterEl.textContent = `${index + 1} / ${slides.length}`;
  prevBtn.disabled = index === 0;
  nextBtn.disabled = index === slides.length - 1;
}
prevBtn.addEventListener('click', () => { index = Math.max(0, index - 1); render(); });
nextBtn.addEventListener('click', () => { index = Math.min(slides.length - 1, index + 1); render(); });
document.addEventListener('keydown', event => { if (event.key === 'ArrowLeft') prevBtn.click(); if (event.key === 'ArrowRight') nextBtn.click(); });
render();
</script>
</body>
</html>
