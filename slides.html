<!DOCTYPE html>
<html lang='en'>
<head>
<meta charset='UTF-8'>
<meta name='viewport' content='width=device-width, initial-scale=1.0'>
<title>Daily Paper Slideshow</title>
<style>
  :root {
    color-scheme: light;
    --bg: #f6f7f4;
    --paper: #ffffff;
    --ink: #111827;
    --muted: #64748b;
    --line: #d8ddd2;
    --accent: #176b87;
    --accent-2: #9a3412;
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: var(--bg); color: var(--ink); }
  .shell { max-width: 1320px; margin: 0 auto; padding: 24px; }
  .topbar { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 16px; }
  .topbar a, button { border: 1px solid var(--line); border-radius: 8px; background: var(--paper); color: var(--ink); padding: 10px 14px; font-weight: 700; text-decoration: none; cursor: pointer; }
  button.primary { background: var(--accent); border-color: var(--accent); color: white; }
  button:disabled { opacity: 0.45; cursor: not-allowed; }
  .counter { color: var(--muted); font-weight: 700; }
  .slide { min-height: calc(100vh - 154px); background: var(--paper); border: 1px solid var(--line); border-radius: 10px; padding: 28px; box-shadow: 0 20px 50px rgba(15, 23, 42, 0.10); display: flex; flex-direction: column; gap: 20px; }
  .paper-head { display: grid; grid-template-columns: minmax(300px, 0.9fr) minmax(0, 1.35fr); gap: 28px; align-items: start; }
  .figure { margin: 0; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: #f8fafc; }
  .figure img { display: block; width: 100%; max-height: 440px; object-fit: contain; background: white; }
  .figure figcaption { padding: 10px 12px; color: var(--muted); font-size: 13px; line-height: 1.4; }
  .head-text { display: flex; flex-direction: column; gap: 13px; min-width: 0; }
  .badges { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .badge { border-radius: 999px; padding: 6px 10px; background: #eef2ff; color: #3730a3; font-size: 13px; font-weight: 800; }
  .score { background: #fee2e2; color: #991b1b; }
  h1 { margin: 0; font-size: 36px; line-height: 1.12; letter-spacing: 0; overflow-wrap: anywhere; }
  .meta, .authors, .why, .abstract { font-size: 16px; line-height: 1.58; }
  .meta, .authors { color: var(--muted); }
  .why strong, .abstract strong, .authors strong { color: var(--ink); }
  .why { border-left: 4px solid var(--accent-2); padding-left: 12px; color: #374151; }
  .abstract { border-top: 1px solid var(--line); padding-top: 14px; color: #374151; }
  details.abstract-details summary { cursor: pointer; color: var(--accent); font-weight: 800; margin-bottom: 8px; }
  .tags { display: flex; flex-wrap: wrap; gap: 8px; }
  .tag { border-radius: 999px; padding: 5px 9px; background: #f1f5f9; color: #475569; font-size: 13px; font-weight: 700; }
  .briefing { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px 24px; border-top: 1px solid var(--line); padding-top: 22px; }
  .brief-section { min-width: 0; }
  .brief-section.wide { grid-column: 1 / -1; }
  .brief-section h2 { margin: 0 0 7px; font-size: 17px; line-height: 1.3; color: #0f766e; letter-spacing: 0; }
  .brief-section p, .brief-section li { margin: 0; font-size: 15px; line-height: 1.62; color: #1f2937; }
  .brief-section ul { margin: 0; padding-left: 20px; }
  .concepts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
  .concept { border-top: 1px solid var(--line); padding-top: 11px; }
  .concept h3 { margin: 0 0 6px; font-size: 16px; color: #7c2d12; letter-spacing: 0; }
  .concept p { margin: 4px 0 0; font-size: 14px; line-height: 1.56; color: #374151; }
  .concept b { color: #111827; }
  .link { color: var(--accent); font-weight: 800; text-decoration: none; }
  .controls { display: flex; justify-content: space-between; gap: 12px; margin-top: 16px; }
  .empty { padding: 48px; background: var(--paper); border: 1px solid var(--line); border-radius: 12px; color: var(--muted); }
  @media (max-width: 860px) {
    .shell { padding: 14px; }
    .topbar, .controls { align-items: stretch; flex-direction: column; }
    .paper-head, .briefing, .concepts { grid-template-columns: 1fr; }
    .slide { min-height: auto; }
    h1 { font-size: 28px; }
  }
</style>
<link rel='icon' href='favicon.svg' type='image/svg+xml'></head>

  <div class='topbar'><a href='briefing.html'>Back to Briefing</a><div class='counter' id='counter'></div></div>

</main>
<script>
const slides = [{"title": "Distinct lattice and charge excitations in AV3Sb5 kagome superconductors", "journal": "arXiv_CondMat", "source": "keyword", "link": "https://arxiv.org/abs/2605.20573", "authors": "Dongjin Oh, Stefan Enzner, Lennart Klebl, et al.", "last_authors": "Stephen D. Wilson, Riccardo Comin", "summary": "arXiv:2605.20573v1 Announce Type: new Abstract: The kagome superconductor family AV3Sb5 (A=Cs, Rb, K) provides a rich platform for exploring diverse electronic symmetry breaking phenomena, including superconductivity and various forms of density wave orders. Although these compounds share the identical lattice structure in the normal state, they exhibit distinct forms of symmetry breaking upon entering the charge density wave (CDW) phase, and the microscopic origin of which remain elusive. Here, we investigate the lattice and charge degrees of freedom in AV3Sb5 using angle-resolved polarized Raman spectroscopy. Our comprehensive polarization-resolved measurements reveal that the lifting of the twofold-degeneracy of the E2g phonon mode in the CDW phase-previously reported only in CsV3Sb5 with a 3 GHz splitting-also appears ubiquitously in the other two compounds. In contrast, the collective CDW excitations exhibit markedly different polarization dependences depending on the alkali-metal species. These distinct behaviors in the lattice and charge channels provide crucial insight into the enigmatic material-dependent symmetry breaking phenomena that appear in the CDW phase. Furthermore, our experiments, together with first-principles calculations and an effective Hamiltonian model, shed light on the nature of the charge order structure in AV3Sb5 kagome superconductors.", "tier": "A_MUST_READ", "score": "10", "reason": "title strong match: AV3Sb5", "tags": ["kagome", "AV3Sb5", "CsV3Sb5", "V3Sb5", "chargedensitywave", "CDW", "superconduct", "phonon"], "image": "https://arxiv.org/html/2605.20573v1/x1.png", "briefing": {"background": "Kagome 격자 구조를 가진 AV3Sb5 (A=Cs, Rb, K) 계열 물질은 상온에서는 동일한 구조를 공유하지만, 저온에서 전하 밀도 파동(CDW)과 초전도성이 나타나며 복잡한 전자적 대칭성 붕괴 현상을 보입니다.", "motivation": "이 물질들은 거시적으로 유사해 보임에도 불구하고, CDW 상에서의 대칭성 붕괴 양상이 물질마다 다르게 보고되었습니다. 본 연구는 라만 분광법을 통해 격자 진동(포논)과 전하 집단 여기의 차이를 규명하고자 했습니다.", "result": "편광 분해 라만 분광 실험을 통해, 이전에 CsV3Sb5에서만 보고되었던 E2g 포논 모드의 겹침 이탈(splitting)이 Rb와 K 화합물에서도 공통적으로 나타남을 확인했습니다. 반면, CDW와 관련된 집단 여기(collective excitations)는 알칼리 금속의 종류에 따라 확연히 다른 편광 의존성을 보였습니다.", "implication": "격자 구조의 뒤틀림은 AV3Sb5 계열에서 보편적인 특성이지만, 실제 전하 질서의 미세 구조와 대칭성 붕괴 채널은 이온의 종류에 따라 민감하게 변한다는 것을 시사합니다.", "novelty": "독자의 주요 관심사인 kagome 금속(AV3Sb5)에서 CDW의 물질별 차이점을 격자와 전하 채널로 분리하여 설명했다는 점이 중요하며, 특히 포논 분리의 보편성을 입증하여 구조적 전이의 공통 분모를 찾아냈습니다.", "unresolved": "알칼리 금속 이온의 크기나 화학적 포텐셜 차이가 구체적으로 어떻게 서로 다른 CDW 여기 상태를 유도하는지에 대한 정량적 메커니즘은 추가 연구가 필요합니다.", "future_work": "이러한 물질별 CDW 여기의 차이가 초전도 임계 온도(Tc)나 비정상 홀 효과(AHE)와 같은 수송 특성에 어떤 영향을 미치는지 연결하는 연구가 기대됩니다.", "concepts": [{"term": "E2g 포논 모드", "why_emerged": "카고메 격자 내 바나듐(V) 원자들의 면내 진동을 설명하기 위해 도입된 대칭성 모드입니다.", "origin": "군론(Group Theory) 기반의 결정 구조 분석에서 유래함.", "connections": "CDW 전이 시 발생하는 격자 변형과 밀접하게 연관되어 에너지 쪼개짐이 발생합니다."}, {"term": "CDW Collective Excitations", "why_emerged": "전하 밀도 파동 상태에서 나타나는 진폭 모드(Higgs-like)나 위상 모드(Phason)를 설명하기 위해 필요합니다.", "origin": "Fröhlich 및 전하 밀도 파동 이론가들에 의해 정립됨.", "connections": "물질의 대칭성 붕괴 양상을 직접적으로 반영하는 동역학적 지표입니다."}], "english_summary": ["Investigated lattice and charge excitations in AV3Sb5 (A=Cs, Rb, K) kagome superconductors using Raman spectroscopy.", "Identified universal E2g phonon mode splitting across all three compounds in the CDW phase.", "Found distinct material-dependent polarization behaviors for collective CDW excitations.", "Combined experimental results with DFT calculations to clarify the charge order structure."]}}, {"title": "Observation of spin-free interatomic orbital angular momentum in a chiral crystal", "journal": "arXiv_CondMat", "source": "author whitelist", "link": "https://arxiv.org/abs/2605.21124", "authors": "Dongjin Oh, Sungsoo Hahn, Chiara Pacella, et al.", "last_authors": "Domenico Di Sante, Changyoung Kim", "summary": "arXiv:2605.21124v1 Announce Type: new Abstract: The inherent spin-orbit interaction of electrons inevitably couples spin to the orbital angular momentum (OAM), posing a fundamental challenge to spin-free orbital transport. Here, we propose a novel strategy to achieve spin-decoupled OAM states in crystalline solids. Using angle-resolved photoemission spectroscopy (ARPES), we resolve well-isolated s-orbital bands in a chiral Te crystal, clearly separated from the p-orbital manifold. Combined circular dichroism ARPES and first-principles calculations reveal that these bands host OAM arising exclusively from interatomic hopping, with no intra-atomic contribution. Spin-resolved ARPES further confirms the absence of SAM, providing decisive evidence of spin-free OAM states. These findings establish the existence of OAM without spin polarization in crystalline solids and highlight the essential role of inter-atomic OAM. This work provides a general framework for designing spinless OAM states, opening an opportunity toward pure orbital currents for orbitronics.", "tier": "A_MUST_READ", "score": "10", "reason": "author whitelist: Changyoung Kim", "tags": ["ARPES", "angle-resolvedphotoemission", "photoemission", "circulardichroism", "transport"], "image": "https://arxiv.org/html/2605.21124v1/Fig.1.png", "briefing": {"background": "일반적으로 고체 내 전자 상태에서 궤도 각운동량(OAM)은 스핀-궤도 결합(SOC)을 통해 스핀과 강력하게 얽혀 있어, 스핀 없는 순수한 궤도 제어가 어렵습니다.", "motivation": "원자 내부의 오비탈 특성이 아닌, 원자 간 도약(interatomic hopping)에 의해서만 발생하는 '스핀 없는 OAM' 상태를 카이랄(chiral) 결정 구조에서 구현하고 직접 관측하고자 했습니다.", "result": "카이랄 텔루륨(Te) 결정에서 p-오비탈 밴드와 완전히 분리된 s-오비탈 밴드를 ARPES로 분해해냈습니다. CD-ARPES 측정 결과, s-오비탈 밴드임에도 강한 OAM 신호가 검출되었으며, Spin-resolved ARPES를 통해 이 상태에 스핀 분극이 전혀 없음을 증명했습니다.", "implication": "스핀-궤도 결합의 간섭 없이 순수하게 궤도 각운동량만을 이용하는 '오비트로닉스(orbitronics)' 장치 구현을 위한 새로운 물질 플랫폼을 제시했습니다.", "novelty": "김창영 교수 그룹의 연구로, 원자 간 도약에 기인한 OAM(interatomic OAM)을 실험적으로 명확히 분리해낸 첫 사례입니다. 독자의 관심사인 ARPES 및 CD-ARPES 방법론이 핵심적으로 사용되었습니다.", "unresolved": "이러한 스핀 없는 OAM 상태가 실제 소자에서 전류로 변환될 때의 산란 효율이나 안정성에 대한 추가 검증이 필요합니다.", "future_work": "카이랄 구조를 가진 다른 반도체나 준금속 시스템에서 원자 간 OAM의 보편성을 확인하고, 이를 이용한 궤도 홀 효과(Orbital Hall Effect) 실험이 이어질 것으로 보입니다.", "concepts": [{"term": "Spin-free OAM", "why_emerged": "스핀 소모 없이 정보 처리가 가능한 차세대 오비트로닉스 구현을 위해 스핀과 분리된 궤도 자유도가 필요했습니다.", "origin": "최근 오비트로닉스 이론 분야에서 제안됨.", "connections": "Spin Hall Effect와 대비되는 Orbital Hall Effect의 핵심 물리량입니다."}, {"term": "CD-ARPES", "why_emerged": "전자 상태의 궤도 각운동량(OAM)이나 베리 곡률의 부호를 실험적으로 판별하기 위해 도입되었습니다.", "origin": "원편광 빛의 이색성을 광전자 분광법에 결합하여 발전함.", "connections": "위상 절연체나 카이랄 물질의 전자 구조 분석에 필수적인 도구입니다."}], "english_summary": ["Observed spin-decoupled interatomic orbital angular momentum (OAM) in chiral Tellurium crystals.", "Used ARPES and CD-ARPES to resolve s-orbital bands hosting OAM without intra-atomic contributions.", "Confirmed the absence of spin polarization using spin-resolved ARPES.", "Established a framework for generating pure orbital currents without spin interference."]}}, {"title": "Occupation Dynamics of Floquet-Volkov States and Spectral Sum Rule (Nano Lett. (2026))", "journal": "arXiv_CondMat", "source": "author whitelist", "link": "https://arxiv.org/abs/2605.21339", "authors": "Xuanxi Cai, Changhua Bao, Benshu Fan, et al.", "last_authors": "Wenhui Duan, Shuyun Zhou", "summary": "arXiv:2605.21339v1 Announce Type: new Abstract: Time-periodic light fields can dress electronic states in quantum materials, forming Floquet states whose dynamic occupation determines transient material properties. Here by using time- and angle-resolved photoemission spectroscopy (TrARPES), we reveal the transient occupation of Floquet-Volkov states in two semiconductors, black phosphorus and MoSe$_2$. While the occupation of the light-induced sidebands, directly reflected by TrARPES spectral weight, strongly depends on the driving field, we find that the total spectral weight obtained by summing up all sidebands is conserved upon below-gap driving. Our work provides critical insights into the Floquet population dynamics, which are essential for light-field tailoring of transient material properties.", "tier": "A_MUST_READ", "score": "10", "reason": "author whitelist: Shuyun Zhou", "tags": ["ARPES", "angle-resolvedphotoemission", "photoemission"], "image": "https://arxiv.org/html/2605.21339v1/x1.png", "briefing": {"background": "강한 전자기장을 물질에 가하면 전자 상태가 주기적으로 변조되는 플로케(Floquet) 상태가 형성되며, 이를 통해 물질의 물성을 나노초 미만의 짧은 시간 동안 제어할 수 있습니다.", "motivation": "플로케 상태 중 하나인 Floquet-Volkov 상태의 실제 전하 점유(occupation)가 어떻게 이루어지는지, 그리고 전체적인 상태 강도가 보존되는지(Sum rule)를 실제 물질에서 확인하고자 했습니다.", "result": "TrARPES를 사용하여 흑린(Black Phosphorus)과 MoSe2에서 광유도 사이드밴드의 점유 양상을 관측했습니다. 개별 사이드밴드의 강도는 전자기장의 세기에 따라 변하지만, 모든 사이드밴드의 강도를 합치면 원래 상태의 강도와 같다는 '분광 합규칙(spectral sum rule)'을 실증했습니다.", "implication": "Floquet 엔지니어링 시 발생하는 복잡한 사이드밴드 생성 과정에서도 전체 전자 수나 상태 밀도의 총합은 보존된다는 근본적인 물리 원칙을 확인시켜 줍니다.", "novelty": "추상적 이론에 머물던 Floquet-Volkov 점유 역학을 주슈운(Shuyun Zhou) 교수 그룹이 TrARPES를 통해 실제 반도체 물질에서 정밀하게 측정해냈다는 점이 돋보입니다. 독자가 관심을 갖는 '실제 물질의 Floquet 제어'에 부합합니다.", "unresolved": "에너지 갭 이상의 펌프 에너지를 가했을 때(above-gap driving) 나타나는 다체 상호작용 효과에 대해서는 아직 합규칙의 적용 범위가 명확하지 않습니다.", "future_work": "강상관 전자계나 위상 물질에서 Floquet 상태의 점유 역학을 조절하여 위상 전이를 유도하는 연구로 확장될 가능성이 높습니다.", "concepts": [{"term": "Floquet-Volkov States", "why_emerged": "강한 고전적 전자기장 하에서 자유 전자 또는 반도체의 전자 상태가 드레스(dressed)되는 현상을 기술하기 위해 도입되었습니다.", "origin": "Floquet 이론과 Volkov 파동함수 해법의 결합.", "connections": "TrARPES에서 관찰되는 광유도 사이드밴드(Lishapes)의 물리적 기원입니다."}, {"term": "Spectral Sum Rule", "why_emerged": "계의 상호작용이나 외부 변조에 상관없이 전체 분광 강도가 보존되어야 한다는 물리적 일관성을 검증하기 위해 필요합니다.", "origin": "양자역학적 교환 관계 및 보존 법칙에서 유래.", "connections": "다체 물리 및 비평형 통계 물리에서 데이터의 신뢰성을 확인하는 중요한 척도입니다."}], "english_summary": ["Investigated Floquet-Volkov state occupation dynamics in black phosphorus and MoSe2 using TrARPES.", "Demonstrated that the total spectral weight is conserved across all light-induced sidebands (Sum Rule).", "Showed that while individual sideband intensity depends on driving field strength, the integrated weight remains constant.", "Provided fundamental insights into the non-equilibrium population of Floquet states in real materials."]}}, {"title": "Tuning the low-energy band structure in twisted bilayer WSe2", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2605.20671", "authors": "T. -H. -Y. Vu, O. J. Clark, N. H. Jo, J. Blyth, Q. Li, C. Jozwiak, et al.", "last_authors": "S. L. Harmer, E. Rotenberg, M. S. Fuhrer, M. T. Edmonds", "summary": "arXiv:2605.20671v1 Announce Type: new Abstract: Tuning the electronic structures of two-dimensional (2D) material-based heterostructures is of crucial importance for their use in functional next-generation electronics. Here, through angle-resolved photoemission spectroscopy with nanoscale spatial resolution (nano-ARPES), we systematically track the evolution of the near-Fermi-level electronic structure of bilayer WSe2 over a large range of twist angle. While the momentum positioning of the valence band maxima is independent of twist angle, we find that the energetic separation between the hole bands at the K point of the Brillouin zone and the higher binding-energy hole band at {\\Gamma} can be varied in excess of 100 meV. We explore the mechanisms underpinning this evolution and discuss the implications for tuning both the size of the band gaps, and the efficiency of the spin-dependent electron-phonon coupling channels in homobilayer transition metal dichalcogenide devices.", "tier": "A_MUST_READ", "score": "10", "reason": "Direct hit: Nano-ARPES study of the electronic structure in twisted bilayer WSe2.", "tags": ["method", "ARPES", "material", "twisted-bilayer"], "image": "https://arxiv.org/static/browse/0.3.4/images/arxiv-logo-fb.png", "briefing": {"background": "2차원 전이금속 디칼코게나이드(TMD)는 층의 개수와 적층 방식에 따라 전자 구조가 크게 변하며, 특히 두 층 사이의 비틀림 각도(twist angle)를 조절하여 모아레( ions of a polaritonic Luttinger liquid by engineered cross-Kerr nonlinearity", "journal": "PRB_Recent", "source": "keyword", "link": "http://link.aps.org/doi/10.1103/yjtj-c22v", "authors": "Nabaneet Sharma, Anushree Dey, Bimalendu Deb", "last_authors": "Anushree Dey, Bimalendu Deb", "summary": "Author(s): Nabaneet Sharma, Anushree Dey, and Bimalendu Deb We study correlation properties of polaritons at zero temperature in a multiconnected Jaynes-Cummings lattice on a superconducting circuit quantum electrodynamics platform with engineered cross-Kerr nonlinearity that mimics attractive nearest-neighbor interaction. A multiconnected Jaynes-Cummings la… [Phys. Rev. B 113, 174520] Published Mon May 18, 2026", "tier": "A_MUST_READ", "score": "9", "reason": "title strong match: Luttinger liquid", "tags": ["Luttinger", "superconduct"], "image": "", "briefing": {"background": "러팅거 액체(Luttinger liquid)는 1차원 상호작용 계에서 페르미 액체 이론이 붕괴하고 집단적 들뜸 현상이 나타나는 독특한 상태입니다.", "motivation": "초전도 회로 양자 역학(Circuit QED) 플랫폼에서 인위적으로 설계된 상호작용을 통해 폴라리톤(polariton) 기반의 러팅거 액체 상관관계를 제어하고자 했습니다.", "result": "제어된 cross-Kerr 비선형성을 이용해 인접한 입자 간의 인력(attractive interaction)을 모사함으로써 폴라리톤 시스템에서 러팅거 액체의 상관 특성을 조절할 수 있음을 보였습니다.", "implication": "고체 물리 시스템이 아닌 초전도 회로 등의 양자 시뮬레이터를 통해 1차원 강상관 계의 물리를 정밀하게 탐구할 수 있는 경로를 제시합니다.", "novelty": "Cross-Kerr 비선형성을 활용하여 인력적 상호작용을 엔지니어링하고 이를 러팅거 액체 프레임워크와 연결한 점이 독창적입니다.", "unresolved": "실제 실험적 구현에서의 결맞음 시간(coherence time) 유지 및 비평형 상태에서의 안정성 문제가 남아있을 수 있습니다.", "future_work": "다양한 네트워크 구조의 Jaynes-Cummings 격자에서 다체 위상 상태를 탐색하는 연구가 이어질 것으로 보입니다.", "concepts": [{"term": "Luttinger liquid", "why_emerged": "1차원 계에서 전자 간 상호작용이 지배적일 때 페르미 액체와 다른 물리를 설명하기 위해 제안되었습니다.", "origin": "J. M. Luttinger (1963), F. D. M. Haldane (1981)", "connections": "스핀-전하 분리, 1차원 양자 자성, 탄소 나노튜브"}, {"term": "Cross-Kerr nonlinearity", "why_emerged": "서로 다른 모드의 광자 또는 폴라리톤 간의 유효한 상호작용을 유도하여 비선형 양자 광학 현상을 제어하기 위해 필요합니다.", "origin": "양자 광학 분야 (Kerr 효과의 확장)", "connections": "양자 게이트, 광자 간 상호작용, 비선형 광학"}, {"term": "Circuit QED", "why_emerged": "초전도 큐비트와 공진기 사이의 결합을 통해 양자 전기역학을 칩 위에서 구현하기 위해 등장했습니다.", "origin": "Yale 그룹 (A. Blais, R. J. Schoelkopf 등, 2004)", "connections": "양자 컴퓨팅, 초전도 물리, 폴라리톤"}, {"term": "Jaynes-Cummings lattice", "why_emerged": "빛과 물질의 결합 모델인 Jaynes-Cummings 모델을 격자 형태로 확장하여 강상관 광자계를 연구하기 위해 도입되었습니다.", "origin": "Jaynes & Cummings (단일 모델), 이후 격자 모델로 확장", "connections": "모트 절연체 상태, 폴라리톤 전이, 양자 시뮬레이션"}], "english_summary": ["Study of polaritonic Luttinger liquid correlations in a circuit QED platform.", "Use of engineered cross-Kerr nonlinearity to mimic attractive nearest-neighbor interactions.", "Control over correlation properties in multiconnected Jaynes-Cummings lattices at zero temperature.", "Demonstration of quantum simulation for 1D many-body physics using superconducting circuits."]}}, {"title": "Phase and electronic structure control of altermagnetic α−MnTe thin films via epitaxy on InP (111)", "journal": "PRB_Recent", "source": "author whitelist", "link": "http://link.aps.org/doi/10.1103/vwgc-ltkz", "authors": "Yuzhe Wang, Shiwu Su, Min Ge, et al.", "last_authors": "Donglai Feng, Juan Jiang", "summary": "Author(s): Yuzhe Wang, Shiwu Su, Min Ge, Pengxu Ran, Tongrui Li, Xianglin Li, Sen Liao, Yu Liang, Jiaqin Wen, Jianghao Yao, Jiexiong Sun, Haoyuan Yan, Rui Xu, Shengtao Cui, Zhe Sun, Donglai Feng, and Juan Jiang Tailoring altermagnetism in $α\\text{−}\\mathrm{MnTe}$ thin films via molecular beam epitaxy (MBE) enables the investigation of emergent quantum states and their underlying physical mechanisms. Here, we report a systematic study of MnTe thin film growth on InP (111) substrates. Crucially, the substrat… [Phys. Rev. B 113, 205139] Published Wed May 20, 2026", "tier": "A_MUST_READ", "score": "9", "reason": "author whitelist: Donglai Feng", "tags": ["altermagnet"], "image": "", "briefing": {"background": "알터마그네티즘(Altermagnetism)은 강자성(FM)처럼 밴드 분할이 일어나면서도 반강자성(AFM)처럼 넷 자화가 0인 새로운 마그네틱 분류로, 고속 스핀트로닉스 응용에 유리합니다.", "motivation": "유망한 알터마그네틱 후보 물질인 alpha-MnTe 박막을 분자선 에피택시(MBE) 방식으로 성장시키고, 기판과의 관계를 통해 그 상(phase)과 전자 구조를 제어하는 기술을 확보하고자 했습니다.", "result": "InP(111) 기판 위에서 alpha-MnTe 박막의 에피택셜 성장에 성공했으며, 기판의 변형이나 계면 효과를 통해 알터마그네틱 물성을 조절할 수 있는 가능성을 확인했습니다.", "implication": "고품질 알터마그네틱 박막 제작 공정을 확립함으로써, 이를 이용한 스핀 분할 효과 기반의 양자 상태 연구와 소자 개발이 가속화될 것입니다.", "novelty": "ARPES 전문가인 Donglai Feng 교수가 참여한 연구로, 박막의 성장 조건에 따른 전자 구조 변화를 정밀하게 추적했다는 점에서 독자의 관심사와 일치합니다.", "unresolved": "실제 스핀 분할(spin splitting)의 크기를 직접적으로 정량화하기 위한 스핀 분해(Spin-resolved) ARPES 측정이 더 필요해 보입니다.", "future_work": "에피택셜 변형(strain)을 이용한 알터마그네틱 스핀-분할 에너지 극대화 및 실제 소자에서의 스핀 수송 특성 측정.", "concepts": [{"term": "Altermagnetism", "why_emerged": "순자화가 없으면서도 교환 상호작용에 의한 큰 스핀 분할을 가지는 자성체를 정의하기 위해 최근에 제안되었습니다.", "origin": "L. Šmejkal, J. Sinova, T. Jungwirth 등 (2022년경 본격화)", "connections": "반강자성, 강자성, 비정상 홀 효과"}, {"term": "alpha-MnTe", "why_emerged": "고전적인 반강자성체로 알려졌으나, 최근 대칭성 분석을 통해 알터마그네틱 특성이 나타날 수 있는 대표 물질로 주목받고 있습니다.", "origin": "전통적인 자성 반도체 연구 분야", "connections": "NiAs 구조, 자성 반도체, 스핀 분할"}, {"term": "MBE (Molecular Beam Epitaxy)", "why_emerged": "원자층 단위로 정밀하게 박막을 성장시켜 고순도 및 특정 결정 방향을 가진 시료를 얻기 위해 필수적인 기술입니다.", "origin": "J. R. Arthur, A. Y. Cho (1960년대 후반)", "connections": "박막 성장, 양자 우물, 에피택시"}, {"term": "Epitaxy", "why_emerged": "기판의 결정 구조를 따라 박막을 성장시켜 격자 변형을 유도하거나 특정 결정상을 안정화하기 위해 사용됩니다.", "origin": "결정 성장학 분야", "connections": "격자 부정합, 스트레인 엔지니어링, 이종 접합"}], "english_summary": ["Epitaxial growth and control of altermagnetic alpha-MnTe thin films on InP(111).", "Demonstration of phase and electronic structure tailoring via substrate-driven epitaxy.", "High-quality thin film fabrication using MBE for investigating emergent quantum states.", "Relevant for altermagnetic spintronics and spin-splitting physics studies."]}}, {"title": "Fingerprints of Preformed Pairs in Two-Electron Angle-Resolved Photoemission Spectroscopy", "journal": "PRL_Recent", "source": "keyword", "link": "http://link.aps.org/doi/10.1103/4c3d-1bm7", "authors": "Janez Bonča, Andrea Damascelli, Mona Berciu", "last_authors": "Andrea Damascelli, Mona Berciu", "summary": "Author(s): Janez Bonča, Andrea Damascelli, and Mona Berciu We use variational exact diagonalization (VED) to calculate the two-electron removal spectral weight for the Hubbard-Holstein model, starting from the ground state with two electrons on a one-dimensional chain. We argue that this spectral weight provides a valuable proxy for the intensity of 2eARPES… [Phys. Rev. Lett. 136, 196504] Published Thu May 14, 2026", "tier": "A_MUST_READ", "score": "9", "reason": "title strong match: angle-resolved photoemission", "tags": ["ARPES", "angle-resolvedphotoemission", "photoemission", "Hubbard"], "image": "", "briefing": {"background": "기존의 ARPES는 단일 전자 제거(1-electron removal)를 측정하여 밴드 구조를 파악하지만, 초전도체의 Cooper 쌍이나 강상관 계의 전자 간 상관관계를 직접적으로 보기에는 한계가 있었습니다. 이를 극복하기 위해 두 개의 전자를 동시에 방출시켜 측정하는 2eARPES(two-electron ARPES) 기술이 이론적, 실험적으로 제안되어 왔습니다.", "motivation": "초전도 현상이 나타나기 전 전이 온도 이상의 온도에서도 전자들이 쌍을 이루고 있다는 'preformed pairs' 가설은 고온 초전도 메커니즘의 핵심 쟁점 중 하나입니다. 이 논문은 2eARPES를 통해 이러한 preformed pairs의 존재를 입증할 수 있는 구체적인 분광학적 지표(fingerprint)를 제시하고자 합니다.", "result": "Hubbard-Holstein 모델에 대해 변분 엄밀 대각화(VED) 방법을 적용하여 2개 전자 제거 스펙트럼 강도를 계산했습니다. 연구 결과, 전자가 쌍을 이루고 있을 때 2eARPES 신호에서 특정 에너지와 운동량 영역에 강한 강도가 집중되는 '지문'과 같은 특징이 나타남을 확인했습니다. 이는 단일 전자 ARPES로는 구별하기 어려운 상관 상태를 명확히 보여줍니다.", "implication": "2eARPES가 단순한 이론적 호기심을 넘어, 강상관 물질 내의 전자 쌍 형성과 거동을 직접 관찰할 수 있는 강력한 실험 도구가 될 수 있음을 시사합니다. 특히 BCS 이론과 preformed pair 시나리오를 실험적으로 판별할 수 있는 기준을 제공합니다.", "novelty": "이론적으로 구현하기 어려운 2개 전자 스펙트럼 계산을 Hubbard-Holstein 모델(전자-음향자 상호작용 포함)에서 정밀하게 수행했으며, 실제 2eARPES 실험에서 관측 가능한 물리량을 구체적으로 예측했다는 점이 중요합니다. 사용자께서 관심 있는 ARPES의 차세대 확장 기술이라는 점에서도 주목할 가치가 큽니다.", "unresolved": "1차원 체인 모델에서의 결과이므로, 고차원 시스템(2D cuprates 등)으로 확장했을 때 실험적 노이즈나 복잡한 밴드 구조 속에서도 이 '지문'이 얼마나 선명하게 유지될지는 추가 연구가 필요합니다.", "future_work": "실제 구리 산화물이나 철 기반 초전도체 시료에 대해 2eARPES 실험을 수행하여 본 논문에서 제시된 이론적 예측값과 비교 분석하는 연구가 뒤따를 것으로 보입니다.", "concepts": [{"term": "2eARPES", "why_emerged": "단일 입자 분석만으로는 파악하기 힘든 전자 간의 짝지음(pairing)이나 직접적인 상관관계를 측정하기 위해 등장했습니다.", "origin": "초록 정보만으로는 특정하기 어려우나, 최근 싱크로트론 광원 및 검출기 기술의 발전으로 실험적 시도가 활발해짐.", "connections": "기존 ARPES, Coincidence Spectroscopy, 다체 물리학(Many-body physics)"}, {"term": "Preformed Pairs", "why_emerged": "고온 초전도체의 가파른 상전이 온도 위에서 나타나는 의사갭(pseudogap) 상태를 설명하기 위한 가설로 제안되었습니다.", "origin": "V.J. Emery와 S.A. Kivelson 등에 의해 고온 초전도체 맥락에서 널리 논의됨.", "connections": "BCS-BEC crossover, Pseudogap, High-Tc superconductivity"}, {"term": "Hubbard-Holstein Model", "why_emerged": "전자 간의 쿨롱 반발력(Hubbard)과 전자-격자 진동 상호작용(Holstein)을 동시에 고려하여 고체 내의 복합적인 상관관계를 묘사하기 위해 만들어졌습니다.", "origin": "J. Hubbard와 T. Holstein의 모델을 결합함.", "connections": "Polaron physics, Strong correlation, CDW"}, {"term": "Variational Exact Diagonalization (VED)", "why_emerged": "힐베르트 공간의 크기가 기하급수적으로 커지는 다체계 문제에서, 물리적으로 중요한 기저 상태 부근의 공간만을 효율적으로 탐색하여 정밀한 해를 구하기 위해 고안되었습니다.", "origin": "초록 정보만으로는 특정하기 어려우나, 전산 물리학의 수치 해석 기법으로 발전함.", "connections": "DMRG, Quantum Monte Carlo, Lanczos method"}], "english_summary": ["Calculates two-electron removal spectral weights for the 1D Hubbard-Holstein model using variational exact diagonalization.", "Identifies specific fingerprints in 2eARPES intensity that signal the presence of preformed electron pairs.", "Proposes 2eARPES as a definitive tool to distinguish between different pairing mechanisms in correlated systems.", "Provides theoretical grounding for interpreting upcoming two-electron photoemission experiments in superconductors."]}}, {"title": "Fragility of Topology under Electronic Correlations in Iron Chalcogenides", "journal": "PRL_Recent", "source": "author whitelist", "link": "http://link.aps.org/doi/10.1103/tq1k-g4lb", "authors": "Younsik Kim, Junseo Yoo, Sehoon Kim, et al.", "last_authors": "Minjae Kim, Changyoung Kim", "summary": "Author(s): Younsik Kim, Junseo Yoo, Sehoon Kim, Sungsoo Hahn, Kiyohisa Tanaka, Li Yu, Minjae Kim, and Changyoung Kim The interplay between electronic correlations and topology is a central topic in the study of quantum materials. In this Letter, we investigate the impact of the orbital-selective Mott phase (OSMP) on the topological properties of ${\\mathrm{FeTe}}_{1−x}{\\mathrm{Se}}_{x}$ (FTS), an iron chalcogenide … [Phys. Rev. Lett. 136, 196502] Published Tue May 12, 2026", "tier": "A_MUST_READ", "score": "9", "reason": "author whitelist: Changyoung Kim", "tags": ["Mott", "topological"], "image": "", "briefing": {"background": "FeTeSe(FTS)와 같은 철 기반 칼코겐 화합물은 위상학적 표면 상태(topological surface states)와 초전도성이 공존하여 마요라나 제로 모드 탐색의 핵심 후보지로 꼽힙니다. 그러나 이들은 강한 전자 상관관계(electronic correlation)를 지닌 물질이기도 하여, 이러한 상관관계가 위상 구조에 어떤 영향을 주는지 이해하는 것이 필수적입니다.", "motivation": "철 기반 초전도체에서 흔히 나타나는 궤도 선택적 모트 상(Orbital-selective Mott phase, OSMP)이 물질의 위상학적 보호를 받는 밴드 구조를 파괴하거나 변형시킬 수 있는지 그 '취약성'을 조사하는 것이 목표입니다.", "result": "연구진은 FTS에서 전자 상관관계가 증가함에 따라 특정 궤도의 국소화(localization)가 발생하는 OSMP가 위상학적 상태를 불안정하게 만든다는 것을 발견했습니다. 즉, 강한 상관관계가 위상학적 불변성을 깨뜨릴 수 있는 '취약성(fragility)'을 유도한다는 결과를 도출했습니다.", "implication": "단순한 밴드 계산(DFT)으로 예측된 위상 구조가 실제 강상관 물질에서는 모트 물리(Mott physics)에 의해 붕괴될 수 있음을 시사합니다. 이는 위상 물질 설계 시 상관관계의 세기를 정밀하게 제어해야 함을 의미합니다.", "novelty": "위상 물성과 OSMP라는 두 가지 핵심 물리 현상을 결합하여 FeTeSe 시스템의 실제 물리적 한계를 지적했습니다. 특히 김창영 교수 그룹의 연구로, ARPES와 같은 실험적 데이터와 결합된 깊이 있는 분석이 예상됩니다.", "unresolved": "OSMP에 의해 위상 상태가 붕괴되는 구체적인 임계 상관관계의 세기가 Fe/Te/Se 조성비에 따라 어떻게 정밀하게 변화하는지는 추가적인 정량적 연구가 필요해 보입니다.", "future_work": "다른 철 기반 초전도체나 모트 절연체 근처의 위상 물질에서도 유사한 위상 붕괴 현상이 나타나는지 탐색하는 실험 및 DFT+DMFT 계산이 이어질 것으로 보입니다.", "concepts": [{"term": "Orbital-selective Mott phase (OSMP)", "why_emerged": "다중 궤도 시스템에서 모든 궤도가 동시에 절연체가 되지 않고, 특정 궤도만 먼저 모트 절연 상태로 전이되는 현상을 설명하기 위해 등장했습니다.", "origin": "철 기반 초전도체의 다중 궤도 특성을 설명하는 과정에서 중요하게 대두됨.", "connections": "Hund's metal, Electronic correlation, Mott insulator"}, {"term": "FeTe1-xSex (FTS)", "why_emerged": "철 기반 초전도체 중 구조가 단순하면서도 강한 상관관계와 위상학적 특성을 동시에 지녀 양자 소자 응용 가능성이 높습니다.", "origin": "철 기반 초전도체 발견(2008년) 이후 칼코겐 계열 연구로 확산됨.", "connections": "Topological superconductor, Majorana zero mode, ARPES"}, {"term": "Fragile Topology", "why_emerged": "외부 섭동이나 상관관계에 의해 위상학적 보호가 쉽게 깨질 수 있는 상태를 정의하기 위해 사용됩니다.", "origin": "최근 위상 물질 연구에서 견고한(robust) 위상 대비 개념으로 사용됨.", "connections": "Topological invariants, Symmetry protected topological phase"}, {"term": "Electronic Correlation", "why_emerged": "독립 입자 근사가 설명하지 못하는 전자 간의 강한 상호작용으로 인한 비자명한 현상(자성, 모트 절연체 등)을 이해하기 위해 필수적인 개념입니다.", "origin": "다체계 물리학의 기본 개념.", "connections": "Hubbard model, Mott physics, Superconductivity"}], "english_summary": ["Investigates the impact of orbital-selective Mott phases (OSMP) on the topological properties of FeTeSe.", "Discovers that electronic correlations can destabilize and lead to the 'fragility' of topological states in iron chalcogenides.", "Highlights the conflict between Mott localization and topological protection in multi-orbital systems.", "Suggests that correlation effects must be carefully considered when designing topological quantum materials based on FTS."]}}, {"title": "Commensurate-incommensurate Mott transition without magnetic field: emergence of nematic Luttinger liquid in XXZ chain", "journal": "arXiv_CondMat", "source": "keyword", "link": "https://arxiv.org/abs/2510.05988", "authors": "Julien Fitouchi, Natalia Chepiga", "last_authors": "Julien Fitouchi, Natalia Chepiga", "summary": "arXiv:2510.05988v2 Announce Type: replace Abstract: We investigate the zero-magnetization phase diagram of a spin-1/2 chain with competing ferromagnetic nearest-neighbor and antiferromagnetic next-nearest-neighbor exchange couplings in the strongly interacting regime. Using density matrix renormalization group (DMRG) simulations, we discover two successive commensurate-incommensurate transitions of the non-conformal Pokrovsky-Talapov universality class, occurring (even) at zero magnetic field. The first transition marks the condensation of bound pairs of magnons into a critical phase with central charge $c=2$, emerging from a gapped period-4 phase. At the second transition, an incommensurate quadrupolar (or nematic) Luttinger liquid forms out of a gapped phase separation state, via the pairwise condensation of domain walls. We argue that both transitions involve the same underlying incommensurate nematic Luttinger liquid, and that the $c=2$ phase can be understood as a coexistence of a conventional (single-magnon type) and quadrupolar (two-magnon type) Luttinger liquids. Our results demonstrate that frustration alone is sufficient to drive continuous commensurate-incommensurate transitions of Mott type and stabilise incommensurate quasi-long-range order without doping.", "tier": "A_MUST_READ", "score": "9", "reason": "title strong match: Luttinger liquid", "tags": ["nematic", "Luttinger", "Mott", "magnon", "ferromagnet", "antiferromagnet"], "image": "https://arxiv.org/html/2510.05988v2/x1.png", "briefing": {"background": "1차원 계에서 상충하는 상호작용(frustration)이 존재할 때, 계는 고정된 주기를 가진 상(commensurate)과 그렇지 않은 상(incommensurate) 사이에서 전이를 일으킵니다. 보통은 외부 자기장이나 도핑으로 이를 유도하지만, 이론적으로 순수하게 상호작용만으로 가능할지는 중요한 연구 주제입니다.", "motivation": "강하게 상호작용하는 spin-1/2 XXZ 체인에서 자기장 없이도 발생하는 '네마틱 루팅거 액체(nematic Luttinger liquid)' 상과 이와 관련된 C-I(Commensurate-Incommensurate) 전이의 존재를 증명하고자 합니다.", "result": "DMRG 계산을 통해, 강한 좌절(frustration)이 있는 시스템에서 자기장이 없는 상태임에도 불구하고 두 번의 연속적인 C-I 전이가 발생함을 발견했습니다. 특히 '네마틱 루팅거 액체'라고 불리는 사중극자(quadrupolar) 상태가 형성되며, 이 상태가 단일 매그논과 이중 매그논 루팅거 액체가 공존하는 $c=2$ 상으로 나타남을 보였습니다.", "implication": "자기장 없이도 좌절 작용만으로 모트 전이 형태의 연속적인 C-I 전이를 일으킬 수 있음을 입증했습니다. 이는 1차원 양자 자성체에서 새로운 유형의 준장거리 질서(quasi-long-range order)를 안정화하는 메커니즘을 제공합니다.", "novelty": "네마틱 루팅거 액체가 외부 필드 없이 안정화될 수 있음을 보인 점과, Pokrovsky-Talapov 유니버설 클래스에 속하는 전이임을 명확히 한 점이 새롭습니다. 사용자 프로필의 루팅거 액체 및 네마틱성에 직접 부합하는 결과입니다.", "unresolved": "이러한 네마틱 루팅거 액체 상이 실제 준1차원 물질(예: 특정 구리 산화물 체인)에서 실험적으로 관측될 수 있는지, 유한한 온도 효과가 이 상을 얼마나 약화시킬지가 과제로 남습니다.", "future_work": "본 모델을 구현할 수 있는 실제 1차원 자성 물질 후보를 탐색하고, 비탄성 중성자 산란(INS) 등을 통해 $c=2$ 상의 들뜸 스펙트럼을 검증하는 연구가 필요합니다.", "concepts": [{"term": "Nematic Luttinger Liquid", "why_emerged" _emerged": "투과전자현미경(TEM)에서 전자와 시료 간의 비탄성 산란을 통해 화학적/전자적 정보를 얻기 위해 도입됨.", "origin": "1940년대 Hillier와 Baker에 의해 초기 개념 정립.", "connections": "오비탈 점유율 및 원자가 상태 분석에 필수적이며 ARPES와 상호보완적 정보 제공."}], "english_summary": ["Develops an atomic-resolution electron linear dichroism method using EELS.", "Utilizes momentum transfer selection to probe local orbital occupancy at atomic columns.", "Provides a powerful tool for real-space mapping of electronic structures.", "Overcomes traditional spatial resolution limits in orbital spectroscopy."]}}, {"title": "Oxygen-centred planar orbitals in the electronic structure and spin-density-wave reconstruction of multilayer nickelates", "journal": "Nature_Physics", "source": "Gemini", "link": "https://www.nature.com/articles/s41567-026-03286-4", "authors": "Christine C. Au-Yeung, Xinglong Chen, S. Smit, et al.", "last_authors": "J. F. Mitchell, A. Damascelli", "summary": "Nature Physics, Published online: 21 May 2026; doi:10.1038/s41567-026-03286-4 The potential similarities in the superconductivity in nickelates and cuprates is a topic of debate. Now a distinct likeness is observed in the electronic properties of these materials, which hints that the microscopic mechanisms may be related.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Electronic structure and CDW in nickelates/cuprates, relevant to unconventional superconductivity.", "tags": ["electronicstructure", "CDW", "nickelates", "unconventionalsuperconductivity"], "image": "https://media.springernature.com/m685/springer-static/image/art%3A10.1038%2Fs41567-026-03286-4/MediaObjects/41567_2026_3286_Fig1_HTML.png", "briefing": {"background": "니켈산염(Nickelates)과 구리산염(Cuprates)은 고온 초전도체로서 유사한 물리적 특성을 가질 것으로 기대되며, 전하 밀도 파동(CDW)과 전자 구조 간의 상관관계가 핵심 연구 주제입니다.", "motivation": "두 물질 계열의 전자 구조 및 초전도 기제 사이의 유사성을 규명하여 공통적인 미시적 근원을 찾고자 함.", "result": "니켈산염에서 산소 중심의 평면 오비탈이 전자 구조와 스핀 밀도 파동(SDW) 재구성에서 중요한 역할을 함을 관측함.", "implication": "니켈산염과 구리산염 간의 물리적 유사성을 확인하여 초전도 현상의 보편적인 기제(mechanism)에 대한 새로운 통찰을 제공함.", "novelty": "니켈산염 다층막에서 확인된 특이한 전자 구조적 특징은 구리산염의 물리량과 직접적인 비교 가능성을 제시함.", "unresolved": "관찰된 산소 평면 오비탈의 기여가 실제 초전도 전이 온도에 어떤 영향을 미치는지에 대한 정량적 관계.", "future_work": "관련된 니켈산염 물질에서의 초전도성 강화 방안 및 이와 유사한 전자 구조를 가진 다른 전이 금속 산화물 탐색.", "concepts": [{"term": "CDW (Charge Density Wave)", "why_emerged": "저차원 물질에서 전자-격자 상호작용으로 인해 전하 밀도가 주기적으로 변조되는 바닥 상태로 등장.", "origin": "Peierls, Frohlich 등에 의해 이론화됨.", "connections": "고온 초전도체 및 카고메 금속에서의 경쟁 상태(competing order)로 활발히 연구됨."}, {"term": "SDW (Spin Density Wave)", "why_emerged": "금속 내 전자의 스핀 밀도가 주기적으로 변조되어 나타나는 자기적 질서 현상.", "origin": "Overhauser에 의해 제안됨.", "connections": "니켈산염의 전자 구조 재구성 및 초전도성과의 상관관계를 이해하는 핵심 개념."}], "english_summary": ["Investigates the electronic similarity between multilayer nickelates and cuprates.", "Identifies oxygen-centered planar orbitals as key contributors to electronic structure.", "Observes spin-density-wave reconstruction linked to these orbital characteristics.", "Suggests a shared microscopic mechanism for superconductivity in these materials."]}}, {"title": "Accessing dirty-regime anomalous Hall effect in pure ferromagnetic metals", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/26cn-khsq", "authors": "Tengfei Ma, Lingsong Huang, Ning Jiang, et al.", "last_authors": "Wenyu Xing, Weibo Gao", "summary": "Author(s): Tengfei Ma, Lingsong Huang, Ning Jiang, Yaoxiang Jiang, Guixin He, Shifeng Zhao, Cong Wang, Wenyu Xing, and Weibo Gao The anomalous Hall effect (AHE) in the dirty regime of pure ferromagnetic metals is challenging to access without doping. Here, the authors use cluster beam deposition to tune structural disorder in ferromagnetic nanogranular CoFe films, reaching a low- conductivity metallic state and enabling systematic study of the AHE in the dirty regime. The AHE is dominated by the intrinsic mechanism and follows the predicted scaling σ AHE ≈ σ x x 1 . 6 . This work fills a key experimental gap and establishes a disorder-based platform for engineering the AHE. [Phys. Rev. B 113, 174428] Published Tue May 19, 2026", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Experimental anomalous Hall study in metallic system.", "tags": ["anomalousHall", "ferromagnet"], "image": "", "briefing": {"background": "강자성 금속에서의 비정상 홀 효과(AHE)는 Berry curvature와 밀접하게 연관되어 있으며, 깨끗한(clean) 극한과 더러운(dirty) 극한에서의 거동 차이를 이해하는 것이 중요합니다.", "motivation": "도핑 없이 무질서(disorder)를 제어하여 더러운 극한 상태의 AHE를 관측함으로써 AHE의 기원(내재적 vs 외재적)을 명확히 규명하고자 함.", "result": "클러스터 빔 증착법으로 제작된 CoFe 박막을 통해 저전도성 상태에 도달하였으며, AHE가 내재적(intrinsic) 기제에 의해 지배되고 σ_AHE ≈ σ_xx^1.6 관계를 따름을 확인함.", "implication": "무질서 조절을 통해 비정상 홀 효과를 공학적으로 설계할 수 있는 가능성을 열었으며, AHE 기제 연구를 위한 새로운 플랫폼을 제공함.", "novelty": "불순물 도핑 없이 나노 입자 구조 제어라는 접근 방식을 통해 AHE의 스케일링 법칙을 검증한 점이 새로움.", "unresolved": "더러운 극한에서의 내재적 기제와 측면 점프(side-jump) 기제 간의 상세한 상호작용 분리.", "future_work": "다양한 강자성 금속 시스템으로의 확장 및 이를 이용한 위상 홀 소자 개발.", "concepts": [{"term": "Anomalous Hall Effect (AHE)", "why_emerged": "강자성 물질에서 자기장뿐만 아니라 자화에 의해 발생하는 홀 전압을 설명하기 위해 등장.", "origin": "Karplus와 Luttinger에 의해 이론적 기초 확립.", "connections": "Berry curvature, 위상 전자 구조, 스핀-궤도 결합(SOC)과 밀접하게 연결됨."}, {"term": "Intrinsic Mechanism", "why_emerged": "산란 과정이 없는 밴드 구조 자체의 Berry curvature가 홀 전도도에 기여하는 효과를 정의하기 위함.", "origin": "Karplus와 Luttinger에 의해 제안.", "connections": "위상 반금속 및 강자성 시스템의 AHE 연구에서 필수적인 물리량."}], "english_summary": ["Explores anomalous Hall effect (AHE) in the dirty metallic regime.", "Uses cluster beam deposition to control structural disorder in CoFe nanogranular films.", "Confirms AHE is dominated by the intrinsic mechanism in the low-conductivity state.", "Establishes a disorder-based platform for tuning the anomalous Hall effect."]}}, {"title": "Critical structural parameter determining magnetic phases in the Fe2Mo3O8 altermagnet system", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/dqg4-6l7n", "authors": "Trevor A. Tyson, Sizhan Liu, Sandun Amarasinghe, et al.", "last_authors": "Sa ld.", "The result suggests magnetic phase changes are driven by electronic rather than structural transformations."]}}, {"title": "Current-induced magneto-optical Kerr effect as a probe of Dirac carriers in Bi1−xSbx alloy", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/lg8r-3wg5", "authors": "Ryota Miyazaki, Shunzhen Wang, Guanxiong Qu, et al.", "last_authors": "Masashi Kawaguchi, Masamitsu Hayashi", "summary": "Author(s): Ryota Miyazaki, Shunzhen Wang, Guanxiong Qu, Yukihiro Marui, Yuta Kobayashi, Masashi Kawaguchi, and Masamitsu Hayashi We study the current-induced magneto-optical Kerr effect (MOKE) in ${\\mathrm{Bi}}_{1−x}{\\mathrm{Sb}}_{x}$ semimetalic alloys. The MOKE signal is found to be the largest in pure Bi ($x=0$), exceeding that of transition metals by nearly four orders of magnitude, and decreases monotonically with increa… [Phys. Rev. B 113, L180406] Published Mon May 18, 2026", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Experimental probe of Dirac semimetal electronic properties.", "tags": ["Dirac", "spectroscopy", "topological"], "image": "", "briefing": {"background": "Bi1-xSbx 합금은 위상학적 절연체 및 디락 준금속(Dirac semimetal) 특성을 연구하기 위한 대표적인 시스템으로, 전자 수송 특성과 스핀 상태를 제어하는 연구가 활발합니다.", "motivation": "전류 유도 자성 광학 커 효과(MOKE)를 이용하여 비스무트 합금 내 디락 전하 캐리어의 거동을 비파괴적으로 탐구하고자 하였습니다.", "result": "순수 Bi(x=0)에서 MOKE 신호가 전이 금속보다 4배 이상 크게 관측되었으며, Sb 도핑 농도가 증가할수록 이 신호가 단조롭게 감소함을 발견했습니다.", "implication": "디락 준금속의 비자성 상태에서도 큰 광학적 반응을 유도할 수 있음을 보여주며, 이는 차세대 스핀트로닉스 소자 응용 가능성을 시사합니다.", "novelty": "Bi계 물질의 특이한 디락 캐리어가 가지는 큰 MOKE 응답을 정량적으로 증명하여, 전자 구조와 연관된 광학적 탐지 기법의 유효성을 입증했습니다.", "unresolved": "Sb 농도 증가에 따른 신호 감소의 정밀한 메커니즘과 디락 콘(Dirac cone) 구조 변화 간의 상관관계는 추가 분석이 필요합니다.", "future_work": "다양한 위상 물질로의 응용 및 스핀-전하 변환 효율 최적화 연구가 이어질 것입니다.", "concepts": [{"term": "디락 준금속", "why_emerged": "그래핀의 디락 페르미온을 3차원 물질로 확장하여 위상 물성을 연구하기 위해 도입되었습니다.", "origin": "Na3Bi, Cd3As2 등의 발견 이후 2010년대 중반부터 본격화되었습니다.", "connections": "위상 위상학적 절연체, 웨일 준금속(Wey ts, the long-ranged correlations generically modify the nature of the magnetic quantum phase transition from second order to first order. The only exception are non-centrosymmetric ferromagnets with a strong spin-orbit interaction, where the correlations change the order of the transition in 2-d systems, but not in 3-d ones. In helimagnets, spin-wave systems, and Neel antiferromagnets their effect is even weaker and does not change the order of the transition if the ordering wave number is sufficiently large, except in flat-band systems. In systems with quenched disorder the transition generically is of second order, but the correlations modify the critical behavior. These conclusions are reached by very simple considerations that are based entirely on the single-particle excitations in the nonmagnetic phase and their modifications by a field conjugate to the order parameter, augmented by renormalization-group considerations.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Theory of phase transitions in altermagnets and magnetic nematics, directly relevant to the user's material interests.", "tags": ["theory", "altermagnet", "nematicity"], "image": "https://arxiv.org/html/2602.23554v2/fig_0.png", "briefing": {"background": "금속 자성체에서 전하와 스핀의 상호작용은 양자 상전이의 성질을 결정하는 핵심 요소이며, 특히 최근 주목받는 알터자성체(altermagnet) 등에서 이러한 상관관계가 중요해지고 있습니다.", "motivation": "다양한 종류의 금속 자성체에서 자성 질서 파라미터와 전도 전자가 결합할 때 나타나는 장거리 상관관계가 양자 임계 현상에 미치는 영향을 이론적으로 체계화하고자 했습니다.", "result": "대부분의 금속 자성체(강자성체, 반강자성체, 알터자성체 등)에서 영온도 장거리 상관관계가 일반적이며, 이것이 양자 상전이의 차수를 2차에서 1차로 변화시킬 수 있음을 증명했습니다.", "implication": "금속 자성체의 양자 상전이 범용 이론을 제시하며, 알터자성체나 자성 네마틱 물질에서 관측되는 임계 현상의 이상 현상을 설명할 수 있습니다.", "novelty": "알터자성체와 같은 최신 자성 물질을 포함하여 금속 자성체의 보편적인 임계 행동을 다루고 있어, 위상 및 자성 물질 연구자에게 이론적 토대를 제공합니다.", "unresolved": "계 내의 불순물(quenched disorder)이 존재하는 환경에서 2차 상전이가 유지되는 구체적인 물리적 배경과 실험 데이터와의 정량적 일치 여부는 논란의 여지가 있을 수 있습니다.", "future_work": "실제 알터자성체 화합물에서 양자 임계점 부근의 민감도와 상전이 차수를 검증하기 위한 중성자 산란 실험이 예상됩니다.", "concepts": [{"term": "Altermagnet", "why_emerged": "강자성도 반강자성도 아닌, 스핀 분리된 밴드 구조를 갖는 새로운 자성 상태를 분류하기 위해 필요했습니다.", "origin": "최근 이론적 제안 및 실험적 관측 (2020년대)", "connections": "스핀-궤도 결합, 비상반적 수송 현상."}, {"term": "Quantum Phase Transition", "why_emerged": "온도가 아닌 압력, 자기장 등의 파라미터 변화로 인해 절대 영도에서 일어나는 상전이를 기술하기 위해 도입되었습니다.", "origin": "Sachdev 등 (1990년대)", "connections": "양자 임계점, 강상관 전자계."}], "english_summary": ["Theoretical framework for long-range correlations in metallic magnets.", "Shows coupling to conduction electrons generically shifts quantum phase transitions to first-order.", "Applicable to various magnets including altermagnets and magnetic nematics.", "Provides a universal perspective on magnetic quantum criticality."]}}, {"title": "Unconventional Magnetism: Symmetry Classification, Hybrid-parity and Unconstrained-parity Classes", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2605.21336", "authors": "Xun-Jiang Luo, Dan Li, Rui-Chun Xiao, et al.", "last_authors": "Mingliang Tian, Yugui Yao", "summary": "arXiv:2605.21336v1 Announce Type: new Abstract: Unconventional magnetism has emerged as a transformative frontier in condensed matter physics. Such phases are characterized by substantial non-relativistic spin splitting (NSS) in symmetry-compensated magnets. They have been classified by the parity of their spin textures under momentum inversion, leading to the paradigms of altermagnets (even-parity) and odd-parity magnets. However, the full symmetry landscape remains largely unexplored. In this Letter, we present a systematic classification framework for unconventional magnetism based on the representation theory of the spin textures and the associated parity properties. Within this framework, we predict two previously unidentified classes beyond the established pure-parity categories: hybrid-parity magnets (HPMs) and unconstrained-parity magnets (UPMs), where the spin textures exhibit contrasting parities among their Cartesian components and the parity of the spin textures is ill-defined, respectively. We derive universal symmetry criteria that categorize HPMs into three distinct types. Importantly, by combining the spin splitting characteristics of altermagnets and odd-parity magnets, HPMs can enable the coexistence of the spin current and Edelstein effects. Taking FePO4 as an example, we perform first-principles calculations to demonstrate this coexistence. Finally, we discuss the potential applications of HPMs in spintronic devices. Our work provides a comprehensive symmetry classification of unconventional magnetism and establishes HPMs as a promising platform for multi-functional spintronics.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Symmetry classification of altermagnets and unconventional magnets with material-specific calculations.", "tags": ["topic", "altermagnetism", "theory"], "image": "https://arxiv.org/html/2605.21336v1/x1.png", "briefing": {"background": "자성체에서 비상대론적 스핀 분할(NSS)을 유도하는 '알터마그넷(Altermagnet)' 연구는 스핀트로닉스 분야에서 매우 중요한 화두입니다. 기존에는 스핀 텍스처의 패리티에 따라 분류되었으나, 더 복잡한 대칭성 구조에 대한 이해가 필요합니다.", "motivation": "기존의 패리티 기반 분류체계(even-parity, odd-parity)를 넘어, 대칭성이 더 복잡한 새로운 자성체 클래스를 정의하고 이를 통합적인 이론 틀로 정립하고자 함.", "result": "하이브리드 패리티 자성체(HPM)와 비제약 패리티 자성체(UPM)라는 새로운 범주를 제안함. 특히 HPM은 스핀 전류와 에델슈타인 효과가 동시에 나타날 수 있음을 이론적으로 증명함.", "implication": "다기능성 스핀트로닉스 소자 구현을 위한 물질 후보군이 확장됨. FePO4를 예시로 실제 가능성을 계산으로 보여주어 실험적 탐색의 지표를 제시함.", "novelty": "기존 알터마그넷 연구가 단순 패리티 분류에 치중했다면, 본 연구는 스핀 텍스처 성분별 패리티 분석을 통해 새로운 물리 현상을 도출해낸 이론적 진보임.", "unresolved": "HPM으로 제안된 물질들의 실제 실험적 관측(예: ARPES를 통한 스핀 분할 직접 측정)이 아직 부족함.", "future_work": "제안된 HPM 후보 물질들의 실험적 합성 및 ARPES, 스핀 분해 측정 등을 통한 스핀 텍스처 검증.", "concepts": [{"term": "Altermagnetism", "why_emerged": "강자성이나 반강자성과는 다른, 결정 대칭성에 의해 유도되는 스핀 분할 현상을 설명하기 위해 등장함.", "origin": "최근 2-3년 내 체계적으로 정립됨 (주로 류보우 쉐미코프 그룹 등).", "connections": "스핀-궤도 결합 없이 발생하는 스핀 분할, 비상대론적 스핀 분할."}, {"term": "Hybrid-parity magnets", "why_emerged": "기존의 단순 패리티 분류로 설명되지 않는 혼합된 스핀 텍스처 대칭성을 분류하기 위해 도입됨.  "authors": "Bohao Li, Yunze Ouyang, Fengcheng Wu", "last_authors": "Yunze Ouyang, Fengcheng Wu", "summary": "Author(s): Bohao Li, Yunze Ouyang, and Fengcheng Wu Here, the authors develop a framework that variationally decomposes Bloch bands into generalized Landau levels (LLs), enabling a quantitative characterization of their effective LL nature. Applied to twisted bilayer MoTe 2 , the first band is dominated by the generalized zeroth LL, supporting Abelian fractional Chern insulators. The second band, at specific twist angles, is dominated by the generalized first LL and exhibits numerical evidence consistent with a non-Abelian Moore–Read state. [Phys. Rev. B 113, 195129] Published Mon May 18, 2026", "tier": "B_IMPORTANT_CONDMAT", "score": "7", "reason": "Important topological study of fractional Chern insulators in moire systems.", "tags": ["moire", "topological", "Chern"], "image": "", "briefing": {"background": "무아레(moire) 격자 시스템에서 나타나는 분수 첸 절연체(Fractional Chern Insulator)는 강상관계 전자 물리학의 핵심 연구 대상이며, 비가환(non-Abelian) 상태는 양자 컴퓨팅에 중요한 응용 가치를 가집니다.", "motivation": "트위스티드 MoTe2의 에너지 밴드가 어떻게 분수 위상 상태를 지원하는지 일반화된 란다우 준위(LL) 관점에서 이론적 체계를 구축하고자 합니다.", "result": "MoTe2의 첫 번째 밴드는 아벨(Abelian) 분수 첸 절연체를, 두 번째 밴드는 비가환(non-Abelian) Moore-Read 상태를 지원할 수 있음을 이론적으로 밝혔습니다.", "implication": "무아레 물질이 분수 양자 홀 효과를 연구하기 위한 강력한 플랫폼임을 확인했습니다.", "novelty": "Bloch 밴드를 일반화된 란다우 준위로 분해하는 새로운 변분 프레임워크를 적용하여 비가환 상태의 가능성을 제시했습니다.", "unresolved": "실제 실험적 확인을 위해서는 매우 정밀한 트위스트 각도 제어와 극저온 환경에서의 검증이 요구됩니다.", "future_work": "해당 이론적 예측을 실험적으로 입증하기 위한 정밀한 전자 구조 측정이나 전송 실험이 예상됩니다.", "concepts": [{"term": "분수 첸 절연체", "why_emerged": "자기장 없이도 분수 양자 홀 효과와 유사한 위상 상태를 구현하려는 목표에서 발생함", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "분수 양자 홀 효과, 무아레 물질, 강상관계 전자계"}, {"term": "비가환 Moore-Read 상태", "why_emerged": "위상 양자 컴퓨팅에 활용 가능한 비가환 통계(non-Abelian statistics)를 가진 준입자를 찾기 위해 필요함", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "양자 컴퓨팅, 분수 양자 홀 상태, 위상 물질"}], "english_summary": ["Proposes a generalized Landau-leve  산란을 통한 자기 구조의 직접 결정 및 ARPES/magneto-ARPES를 통한 전자 구조의 자기장 의존성 관찰이 필요합니다.", "concepts": [{"term": "메타자성", "why_emerged": "강한 자기장 하에서 자기 구조가 급격히 변하는 현상을 설명하기 위해 필요.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "스핀-플립(spin-flip) 전이, 자기 이방성."}, {"term": "RAlGe 계열", "why_emerged": "Weyl 반금속 후보 물질 탐색 과정에서 파생됨.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "위상 반금속, 베리 곡률, 이상 홀 효과."}], "english_summary": ["Investigated anisotropic metamagnetism and magnetotransport in TbAlGe.", "TbAlGe is a member of the RAlGe family with high magnetic ordering temperature.", "Identified magnetic field-induced phase transitions affecting transport properties.", "Results provide key insights for magnetic topological materials research."]}}, {"title": "Elliptical orbit motion of moiré exciton wave packets in twisted van der Waals heterobilayers", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/npj1-54hc", "authors": "J. Rubstein, Andrey Chaves, T. A. S. Pereira, R. N. Costa Filho, F. M. Peeters, D. R. da Costa", "last_authors": "F. M. Peeters, D. R. da Costa", "summary": "Author(s): J. Rubstein, Andrey Chaves, T. A. S. Pereira, R. N. Costa Filho, F. M. Peeters, and D. R. da Costa Twisted heterobilayers of transition metal dichalcogenides exhibit a moiré pattern that translates into a honeycomb lattice of single-particle gap minima, thus resulting in a superlattice potential for excitons. The quasiparticle associated with the Bloch state of such excitons is known as a moiré e… [Phys. Rev. B 113, 195428] Published Mon May 18, 2026", "tier": "B_IMPORTANT_CONDMAT", "score": "7", "reason": "Relevant study on twisted vdW systems and moiré potentials.", "tags": ["moire", "vanderWaals", "excitons"], "image": "", "briefing": {"background": "밴드갭을 가진 반도체 물질을 꼬아서 만든 층상 구조(van der Waals heterobilayers)는 모아레 패턴을 형성하며, 이로 인해 생성된 주기적인 잠재 우물이 엑시톤을 가둡니다.", "motivation": "모아레 격자에 갇힌 엑시톤의 역학을 기술하기 위해, 고전적 입자 모델을 넘어선 양자 역학적 파동 패킷의 거동을 이해하고자 합니다.", "result": "모아레 격자 내 oach to anomalous Hall effect in 2D materials.", "tags": ["anomalousHall", "multiferroic", "2Dmaterial"], "image": "", "briefing": {"background": "이상 홀 효과(AHE)는 자성 물질에서 Berry 곡률에 의해 발생하는데, 이를 외부 전기장(강유전체 스위칭)으로 제어할 수 있다면 차세대 비휘발성 메모리 소자로 활용할 수 있습니다.", "motivation": "AHE 제어를 위한 일반적인 대칭성 설계 기준이 부족하여, 강유전체와 결합된 시스템에서 이를 실현하기 위한 엄밀한 기준을 정립하고자 합니다.", "result": "2차원 다강체 시스템에서 강유전체 스위칭을 통해 이상 홀 효과를 반전시키기 위한 대칭성 기준을 수립하고, 후보 물질을 제안했습니다.", "implication": "대칭성 분석을 통해 실험적으로 구현 가능한 강유전체-강자성 다강체 설계 가이드라인을 제공합니다.", "novelty": "전통적인 자성 제어 방식 대신 대칭성 기반의 논리적인 설계를 도입하여 재료 탐색 효율을 높였습니다.", "unresolved": "실제 합성된 2D 물질에서 예측된 강유전성과 강자성의 공존 및 스위칭 온도가 실온에 도달할지는 미지수입니다.", "future_work": "제안된 물질의 박리 및 소자화, 수송 측정을 통한 AHE 스위칭 실험이 다음 단계입니다.", "concepts": [{"term": "이상 홀 효과", "why_emerged": "자성 물질 내에서 전자가 베리 곡률의 영향을 받아 횡방향으로 편향되는 현상.", "origin": "Hall이 발견했으나, 내재적인 기원은 Karplus와 Luttinger(1954)에 의해 정립됨.", "connections": "베리 곡률, 자기 위상 절연체, 스핀 홀 효과."}, {"term": "다강체", "why_emerged": "전기적 성질(강유전성)과 자기적 성질(강자성)을 동시에 조절하기 위한 새로운 물리 시스템.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "자기전기 효과, 스핀트로닉스."}], "english_summary": ["Developed symmetry criteria for ferroelectric control of the anomalous Hall effect (AHE).", "Focuses on 2D multiferroic systems for low-power electronic switching.", "Provides material validation guidelines based on symmetry analysis.", "Facilitates the design of ferroelectric-switched topological quantum devices."]}}, {"title": "Fixed points and critical temperature near quantum critical points in d-wave cuprate superconductors", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/qfwt-y132", "authors": "Qi-Qi Yue, Yi-Sheng Fu, Jing Wang", "last_authors": "Yi-Sheng Fu, Jing Wang", "summary": "Author(s): Qi-Qi Yue, Yi-Sheng Fu, and Jing Wang We study the critical behavior driven by potential quantum critical points (QCPs) termed as ${τ}_{0,x,y,z}$-type QCPs beneath the superconducting dome of the $d$-wave cuprate superconductors. To comprehensive
