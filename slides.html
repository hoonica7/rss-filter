<title>Daily Paper Slideshow</title>
<style>
  :root {
    color-scheme: light;
    --bg: #f6f7f4;
    --paper: #ffffff;
    --ink: #111827;
    --muted: #64748b;
    --line: #d8ddd2;
    --accent: #176b87;
    --accent-2: #9a3412;
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; overflow: auto; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: var(--bg); color: var(--ink); }
  .shell { max-width: 1500px; min-height: 100vh; margin: 0 auto; padding: 14px 18px; display: flex; flex-direction: column; }
  .topbar { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 16px; }
  .top-actions { display: flex; align-items: center; gap: 10px; }
  .topbar a, button { border: 1px solid var(--line); border-radius: 8px; background: var(--paper); color: var(--ink); padding: 10px 14px; font-weight: 700; text-decoration: none; cursor: pointer; }
  button.primary { background: var(--accent); border-color: var(--accent); color: white; }
  button:disabled { opacity: 0.45; cursor: not-allowed; }
  .counter { color: var(--muted); font-weight: 700; }
  .slide { min-height: calc(100vh - 82px); background: var(--paper); border: 1px solid var(--line); border-radius: 10px; padding: 18px; box-shadow: 0 18px 42px rgba(15, 23, 42, 0.10); display: grid; grid-template-columns: minmax(310px, 0.86fr) minmax(0, 1.55fr); gap: 18px; overflow: visible; }
  .paper-head { min-width: 0; min-height: 0; overflow: visible; display: flex; flex-direction: column; gap: 12px; }
  .figure { margin: 0; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: #f8fafc; }
  .figure img { display: block; width: 100%; max-height: 41vh; object-fit: contain; background: white; }
  .figure figcaption { padding: 7px 10px; color: var(--muted); font-size: 12px; line-height: 1.3; }
  .head-text { display: flex; flex-direction: column; gap: 9px; min-width: 0; }
  .badges { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .badge { border-radius: 999px; padding: 5px 9px; background: #eef2ff; color: #3730a3; font-size: 12px; font-weight: 800; }
  .score { background: #fee2e2; color: #991b1b; }
  h1 { margin: 0; font-size: 25px; line-height: 1.15; letter-spacing: 0; overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
  h1 a { color: inherit; text-decoration-color: rgba(23, 107, 135, 0.35); text-decoration-thickness: 2px; text-underline-offset: 4px; }
  h1 a:hover { color: var(--accent); text-decoration-color: var(--accent); }
  .meta, .authors, .why, .abstract { font-size: 13px; line-height: 1.45; }
  .meta, .authors { color: var(--muted); }
  .why strong, .abstract strong, .authors strong { color: var(--ink); }
  .authors { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .why { border-left: 4px solid var(--accent-2); padding-left: 10px; color: #374151; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .abstract { border-top: 1px solid var(--line); padding-top: 14px; color: #374151; }
  .original-abstract { border-top: 1px solid var(--line); padding-top: 10px; color: #374151; font-size: 11.5px; line-height: 1.35; overflow-wrap: anywhere; }
  .original-abstract strong { display: block; margin-bottom: 4px; color: var(--ink); }
  .tags { display: flex; flex-wrap: wrap; gap: 8px; }
  .tag { border-radius: 999px; padding: 4px 8px; background: #f1f5f9; color: #475569; font-size: 12px; font-weight: 700; }
  .head-text > .link { display: none; }
  .briefing { min-width: 0; min-height: 0; overflow: visible; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); grid-auto-rows: minmax(0, auto); align-content: start; gap: 11px 18px; border-top: 0; padding-top: 0; }
  .brief-section { min-width: 0; }
  .brief-section.wide { grid-column: 1 / -1; }
  .brief-section h2 { margin: 0 0 4px; font-size: 14px; line-height: 1.22; color: #0f766e; letter-spacing: 0; }
  .brief-section p, .brief-section li { margin: 0; font-size: 12.5px; line-height: 1.42; color: #1f2937; overflow-wrap: anywhere; }
  .brief-section ul { margin: 0; padding-left: 20px; }
  .concepts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 9px 14px; }
  .concept { border-top: 1px solid var(--line); padding-top: 7px; }
  .concept h3 { margin: 0 0 4px; font-size: 13px; color: #7c2d12; letter-spacing: 0; }
  .concept p { margin: 2px 0 0; font-size: 11.5px; line-height: 1.35; color: #374151; overflow-wrap: anywhere; }
  .concept b { color: #111827; }
  .link { color: var(--accent); font-weight: 800; text-decoration: none; }
  .empty { padding: 48px; background: var(--paper); border: 1px solid var(--line); border-radius: 12px; color: var(--muted); }
  @media (max-width: 860px) {
    .shell { padding: 14px; }
    .topbar, .top-actions { align-items: stretch; flex-direction: column; }
    .slide, .briefing, .concepts { grid-template-columns: 1fr; }
    .slide { min-height: auto; overflow: visible; display: grid; }
    h1 { font-size: 28px; }
  }
</style>

const slides = [{"title": "Microscopic signatures of an imaginary charge density wave in a kagome metal", "journal": "Nature_Physics", "source": "keyword", "link": "https://www.nature.com/articles/s41567-026-03339-8", "authors": "S. Suetsugu, F. Hori, M. Shibata, et al.", "last_authors": "H. Kontani, Y. Matsuda", "summary": "Nature Physics, Published online: 17 June 2026; doi:10.1038/s41567-026-03339-8 Whether imaginary charge density waves and their associated loop currents exist has remained an open question. Now signatures of this state have been observed in kagome metal CsV3Sb5, revealing spontaneous time-reversal symmetry breaking.", "tier": "A_MUST_READ", "score": "9", "reason": "title strong match: kagome metal", "tags": ["kagome", "CsV3Sb5", "V3Sb5", "chargedensitywave", "loopcurrent", "time-reversalsymmetrybreaking"], "image": "https://media.springernature.com/m685/springer-static/image/art%3A10.1038%2Fs41567-026-03339-8/MediaObjects/41567_2026_3339_Fig1_HTML.png", "briefing": {"background": "카고메 격자 금속인 AV3Sb5(A = K, Rb, Cs) 계열은 저온에서 전하 밀도 파(CDW)와 초전도 현상을 동시에 보여주어 응집물질 물리학의 핵심 연구 대상이 되었습니다. 특히 이 물질에서 관찰되는 시간 반전 대칭성 깨짐(TRSB)의 근원이 일반적인 자성 때문인지, 아니면 독특한 전자 흐름인 '루프 전류(loop current)' 때문인지에 대한 논쟁이 지속되어 왔습니다.", "motivation": "이론적으로 제시되었으나 실험적으로 확인하기 어려웠던 '허수 전하 밀도 파(imaginary CDW)'와 그로 인한 루프 전류 상태가 실제로 CsV3Sb5에 존재하는지 마이크로 수준에서 직접적인 증거를 찾고자 했습니다.", "result": "본 연구는 CsV3Sb5에서 허수 전하 밀도 파의 미시적 신호를 포착하는 데 성공했습니다. 이는 자성 불순물이 없는 상태에서 자발적인 시간 반전 대칭성 깨짐이 발생함을 의미하며, 카고메 금속의 CDW가 단순한 원자 변위가 아닌 복소수 질서 매개변수(complex order parameter)를 가짐을 시사합니다.", "implication": "이 결과가 사실로 확인될 경우, 카고메 금속의 특이한 양자 홀 효과나 자발적 TRSB를 루프 전류 모델로 설명할 수 있는 강력한 근거가 됩니다. 또한, 이는 강상관 전자계에서 새로운 유형의 양자 상(phase)을 정의하는 중요한 사례가 됩니다.", "novelty": "기존의 거시적인 수송 측정이나 뮤온 스핀 회전(muSR)을 넘어, 허수 CDW의 직접적인 미시적 신호를 보고했다는 점이 혁신적입니다. 독자의 주요 관심사인 CsV3Sb5의 TRSB 및 루프 전류 논쟁에 종지부를 찍을 수 있는 중요한 연구입니다.", "unresolved": "허수 CDW 상태가 초전도 상과 정확히 어떤 메커니즘으로 경쟁하거나 공존하는지에 대한 상세한 기작은 아직 완전히 규명되지 않았습니다.", "future_work": "다른 카고메 금속(예: ScV6Sn6)에서도 유사한 허수 CDW 신호가 나타나는지 확인하여 이 현상의 보편성을 검증하고, 압력이나 도핑에 따른 상도표 변화를 연구할 필요가 있습니다.", "concepts": [{"term": "Imaginary Charge Density Wave (iCDW)", "why_emerged": "전하 밀도가 단순한 공간적 변조를 넘어, 전하의 흐름(전류)에 위상차를 유도하여 시간 반전 대칭성을 깨뜨리는 상태를 설명하기 위해 등장했습니다.", "origin": "Haldane 및 Varma 등에 의한 이론적 제안이 배경이 됨", "connections": "Loop current, Time-reversal symmetry breaking, Chiral CDW"}, {"term": "Kagome Metal (CsV3Sb5)", "why_emerged": "기하학적 좌절(frustration)과 특이한 밴드 구조(flat band, Dirac cone, van Hove singularity)가 결합되어 나타나는 신물성을 연구하기 위해 주목받았습니다.", "origin": "2019~2020년경 Stephen Wilson 그룹 등에 의해 CsV3Sb5의 물성이 보고됨", "connections": "Unconventional superconductivity, Weyl semimetal, Flat band physics"}, {"term": "Loop Current", "why_emerged": "고온 초전도체나 특정 양자 계에서 순전하 이동은 없지만 국소적인 폐회로 전류가 돌아 자성을 띠는 현상을 설명하기 위해 고안되었습니다.", "origin": "Chandra Varma가 구리 산화물 초전도체의 의갭(pseudogap) 상태를 설명하기 위해 제안", "connections": "Orbital angular momentum, TRSB, Quantum anomalous Hall effect"}, {"term": "Time-Reversal Symmetry Breaking (TRSB)", "why_emerged": "외부 자기장 없이 물질 내부의 자체적인 질서에 의해 시간이 거꾸로 흐르는 대칭성이 깨지는 현상을 구분하기 위해 필요합니다.", "origin": "통계역학 및 고체물리학의 기본 대칭성 논의에서 유래", "connections": "Ferromagnetism, Non-collinear magnetism, Berry phase"}], "english_summary": ["Provides microscopic evidence for imaginary charge density waves (iCDW) in the kagome metal CsV3Sb5.", "Identifies spontaneous time-reversal symmetry breaking linked to loop current orders.", "Offers a potential resolution to the long-standing debate over the nature of the CDW phase in AV3Sb5 materials.", "Connects the complex order parameter of CDW to the anomalous electronic properties of kagome lattices."]}}, {"title": "Observation of momentum dependent charge density wave gap in EuTe4", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/n72p-lpt6", "authors": "Iftakhar Bin Elius, Nathan Valadez, Gyanendra Dhakal, et al.", "last_authors": "Dariusz Kaczorowski, Madhab Neupane", "summary": "Author(s): Iftakhar Bin Elius, Nathan V  the reader profile.", "tags": ["altermagnet", "material", "theory"], "image": "", "briefing": {"background": "알터자성(Altermagnetism)은 자화가 0이면서도 전자의 스핀이 모멘텀(k)에 의존하여 분리되는 새로운 자기 위상입니다. 이는 강자성과 반강자성의 장점을 모두 갖추고 있어 미래 스핀트로닉스 핵심 소재로 평가받습니다.", "motivation": "벌크 상태뿐만 아니라 박막 구조에서도 CrSb와 같은 알터자성체의 특성이 유지되는지, 특히 초박막 환경에서의 전자 구조 변화를 이론적으로 조사하고자 합니다.", "result": "CrSb 박막에서 순 자화가 없음에도 불구하고 상당한 수준의 스핀 분할이 유지됨을 확인하여, 알터자성 현상이 저차원 구조에서도 건재함을 입증했습니다.", "implication": "향후 나노 규모 스핀트로닉스 소자에 CrSb를 활용할 수 있는 이론적 토대가 마련되었으며, 스핀-궤도 토크 소자 등에 응용 가능합니다.", "novelty": "최근 주목받는 알터자성 분야에서 CrSb의 고온 안정성과 박막 유지 특성을 다루어, 응용성을 구체화한 점이 주목할 만합니다.", "unresolved": "박막 두께가 더욱 얇아졌을 때 나타나는 표면 상태나 산화 등에 의한 특성 저하 문제는 여전히 해결해야 할 과제입니다.", "future_work": "실제 CrSb 박막 성장을 통한 ARPES 등을 활용한 실험적 스핀 분할 검증이 기대됩니다.", "concepts": [{"term": "Altermagnetism", "why_emerged": "강자성과 반강자성으로 분류되지 않는, k-의존 스핀 분할을 갖는 자기 위상을 설명하기 위해 제안됨.", "origin": "초록 정보만으로는 특정하기 어려움 (최근 Libor Šmejkal 등이 주도적 연구).", "connections": "스핀-궤도 결합, 베리 곡률, 비전통적 스핀트로닉스."}, {"term": "Néel temperature", "why_emerged": "반강자성체가 상자성체로 상전이하는 임계 온도를 정의하기 위해 도입됨.", "origin": "Louis Néel, 1930년대 연구.", "connections": "자기 정렬, 상전이 물리."}], "english_summary": ["Investigated the altermagnetic properties of ultrathin CrSb slabs.", "Confirms momentum-dependent spin splitting without net magnetization in low dimensions.", "Highlights the potential for spintronic applications in ultrathin layers.", "CrSb remains a promising candidate due to its high Néel temperature of ~700 K."]}}, {"title": "Boosted magnetic fluctuations at the onset of superconductivity in UTe2 beyond 40 T", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/3hzr-5qcs", "authors": "T. Thebault, K. Somesh, G. Lapertot, M. Nardone, A. Zitouni, M. Barragan, et al.", "last_authors": "D. Aoki, G. Knebel, D. Braithwaite, and W. Knafo", "summary": "Author(s): T. Thebault, K. Somesh, G. Lapertot, M. Nardone, A. Zitouni, M. Barragan, J. Béard, J. Billette, F. Lecouturier-Dupouy, S. Tardieu, D. Aoki, G. Knebel, D. Braithwaite, and W. Knafo Multiple triplet-candidate unconventional superconducting phases have been reported in the heavy-fermion compound UTe 2 . Here, the authors find an enhancement of the electrical resistivity Fermi liquid coefficient A at a metamagnetic transition preceding the onset of superconductivity in magnetic fields higher than 40 T. The enhancement of A is attributed to a magnetic fluctuation mode probably in play for the mechanism of this superconducting phase. [Phys. Rev. B 113, L220503] Published Mon Jun 15, 2026", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Unconventional superconductivity and magnetic fluctuations in heavy-fermion systems.", "tags": ["superconductivity", "heavy-fermion"], "image": "", "briefing": {"background": "중페르미온(heavy-fermion) 물질 UTe2는 스핀-삼중항 초전도체 후보 물질로 주목받고 있으며, 강한 전자 상관관계와 자기적 비등방성이 초전도 상태와 밀접하게 얽혀 있습니다.", "motivation": "UTe2의 높은 자기장 영역(40T 이상)에서 발생하는 메타자기적 전이와 초전도성 사이의 상관관계를 규명하여, 해당 영역에서의 초전도 기작을 이해하고자 합니다.", "result": "40T 이상의 자기장에서 전기저항의 페르미 액체 계수(A)가 급격히 증가함을 발견했으며, 이는 초전도상을 매개하는 자기적 요동(magnetic fluctuations)이 강화되었음을 시사합니다.", "implication": "고자기장 환경에서의 초전도성이 전형적인 포논 매개가 아닌 자기적 요동에 의해 주도될 가능성이 높음을 뒷받침합니다.", "novelty": "초고자기장 영역에서의 수송 특성을 통해 UTe2의 다중 초전도상 기원과 자기적 요동의 역할을 직접적으로 연결했다는 점이 중요합니다.", "unresolved": "강화된 자기적 요동 모드의 정확한 미시적 성질과 이 요동이 어떻게 페르미 표면의 재구성과 결합하는지는 명확하지 않습니다.", "future_work": "중성자 산란 연구나 고자기장 하에서의 RIXS 측정을 통해 자기적 요동 모드의 구체적인 스펙트럼 분석이 필요합니다.", "concepts": [{"term": "중페르미온(Heavy-fermion)", "why_emerged": "f-전자와 전도 전자의 혼성화로 인해 유효질량이 수백 배 커지는 현상을 설명하기 위해 도입되었습니다.", "origin": "1970년대 후반부터 관측되어 1980년대 Steglich 등에 의해 확립됨.", "connections": "근도체-초전도체 전이, 자기적 정렬과 초전도성의 공존 연구와 밀접."}, {"term": "메타자기적 전이(Metamagnetic transition)", "why_emerged": "자기장에 따라 자화율이 급격히 변하는 현상을 설명하기 위해 필요합니다.", "origin": "초기 자성 이론에서 제안됨.", "connections": "페르미 표면의 리프시츠 전이나 양자 임계점 현상과 자주 동반됨."}], "english_summary": ["UTe2 shows multiple unconventional superconducting phases in high magnetic fields.", "Resistivity Fermi liquid coefficient A increases near the 40T metamagnetic transition.", "The enhancement indicates that magnetic fluctuations drive the high-field superconductivity.", "Provides evidence for the mechanism behind triplet-candidate superconducting phases."]}}, {"title": "Interplay between many-body correlations, strain, and lattice relaxation in twisted bilayer graphene", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/x2mz-hm8y", "authors": "Lorenzo Crippa, Gautam Rai, Dumitru Călugăru, et al.", "last_authors": "Giorgio Sangiovanni, Tim Wehling", "summary": "Author(s): Lorenzo Crippa, Gautam Rai, Dumitru Călugăru, Haoyu Hu, Jonah Herzog-Arbeitman, B. Andrei Bernevig, Roser Valentí, Giorgio Sangiovanni, and Tim Wehling Here, the authors explain a set of experimental features that, while ubiquitously observed in twisted bilayer graphene samples, have so far eluded a unified theoretical description. A broad range of spectral, response, and thermodynamic properties in twisted bilayer graphene is accurately described microscopically and traced to the interplay of electronic correlations, lattice strain, and structural relaxation. The results are in excellent agreement with multiple recent experiments including scanning tunneling and quantum twisting microscopy experiments. [Phys. Rev. B 113, L241112] Published Wed Jun 17, 2026", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "STM and spectroscopy on twisted bilayer graphene are highly relevant to the broader reader profile.", "tags": ["scanningtunneling", "graphene", "twistedbilayer"], "image": "", "briefing": {"background": "꼬인 이중층 그래핀(TBG)은 마법 각도 근처에서 상관관계에 의한 평탄한 밴드가 형성되어 초전도 및 상관 절연체 상태를 보입니다. 그러나 시료 간의 불일치와 실험적 관측치를 통합적으로 설명하는 이론이 부족했습니다.", "motivation": "TBG에서 공통적으로 관측되지만 이론적 정립이 어려웠던 스펙트럼, 열역학적 특성들을 격자 변형과 전자 상관관계를 포함한 모델로 통합 설명하고자 합니다.", "result": "전자 상관관계, 격자 변형(strain), 구조적 이완(relaxation) 효과를 결합한 미시적 계산을 통해 STM 및 양자 트위스팅 현미경(QTM) 데이터와 정량적으로 일치하 폴로지 특성을 탐구하는 중요한 도구입니다.", "motivation": "TaIrTe4와 같은 반전 대칭성이 깨진 위상 반금속에서 궤도 기여를 통한 비선형 평면 홀 효과가 실온에서 어떻게 구현되는지, 그 미시적 메커니즘을 밝히고자 했습니다.", "result": "TaIrTe4의 평면 자기장에 의한 비선형 평면 홀 효과가 Berry-connection-polarizability dipole(BCP dipole)이라는 궤도 메커니즘을 통해 설명됨을 증명했습니다.", "implication": "실온에서 위상 물질의 비선형 수송 특성을 활용한 새로운 궤도 기반 스핀트로닉스 소자 설계의 가능성을 보여줍니다.", "novelty": "실온 동작 가능한 비선형 홀 효과를 위상 반금속에서 직접 관측했으며, 특히 궤도 기여(orbital mechanism)에 주목했다는 점에서 관심 분야인 베리 곡률 물리와 직결됩니다.", "unresolved": "BCP dipole의 기여가 다른 소산형(dissipative) 메커니즘과 어떻게 정량적으로 분리되는지에 대한 세부 해석은 여전히 복잡한 문제입니다.", "future_work": "다른 비자성 위상 물질로의 확장 및 궤도 기반 비선형 응답을 활용한 고속 위상 전자 소자 응용 연구.", "concepts": [{"term": "Berry-connection-polarizability dipole", "why_emerged": "비선형 수송 현상에서 베리 곡률만으로 설명되지 않는 궤도 성분의 응답을 기술하기 위해 필요.", "origin": "최근 수년간 강상관 전자계 및 위상 물리 분야에서 이론적으로 정립됨.", "connections": "베리 곡률, 비선형 홀 효과, 궤도 자기 모멘트."}, {"term": "Nonlinear Planar Hall Effect", "why_emerged": "선형 응답을 넘어선 비선형 대칭성 파괴 연구를 통해 물질의 위상 구조를 이해하기 위해 도입됨.", "origin": "위상 반금속 연구가 활발해지며 실험적으로 관측됨.", "connections": "이상 홀 효과, 위상 반금속, 베리 곡률 다이폴."}], "english_summary": ["TaIrTe4 shows room-temperature intrinsic nonlinear planar Hall effect.", "The effect originates from an orbital mechanism via Berry-connection-polarizability dipole.", "This links topological semimetal properties to orbital-based spintronics.", "Provides a robust platform for studying nonlinear transport in topological matter."]}}, {"title": "Electric field–induced ferromagnetic domain change by ferroelectric topological domain switching in Co-substituted BiFeO 3 nanodots", "journal": "Science_Advances", "source": "Gemini", "link": "https://doi.org/10.1126/sciadv.aec2861", "authors": "Koomok Lee, Peter Meisenheimer, Paul Stevenson, et al.", "last_authors": "Ramamoorthy Ramesh, Masaki Azuma", "summary": "Electric field–induced magnetization reversal accompanying polarization switching is promising for low–power consumption, nonvolatile, voltage-write, magnetic-read memory applications. Perovskite B Se 2 , the authors demonstrate the presence of RLEs prior to the QSL ground state. [Phys. Rev. B 113, L220407] Published Wed Jun 17, 2026", "tier": "B_IMPORTANT_CONDMAT", "score": "7", "reason": "Quantum spin liquid evidence in triangular lattices is relevant to the reader's broader research interests.", "tags": ["spinliquid", "magnetism", "material"], "image": "", "briefing": {"background": "삼각 격자(triangular lattice) 기반의 물질들은 기하학적 좌절(frustration)로 인해 양자 스핀 액체(QSL)와 같은 이국적인 기저 상태가 나타날 가능성이 높아 응집물질 물리 연구의 핵심 대상입니다.", "motivation": "이론적으로 예측된 로톤-유사 들뜸(roton-like excitations, RLEs)이 실제 QSL 후보 물질인 YbCuSe2에서 존재하는지 확인하고자 합니다.", "result": "열용량과 뮤온 스핀 완화(muon spin relaxation) 측정을 통해 YbCuSe2가 QSL 기저 상태로 들어가기 전 온도 영역에서 RLE의 존재를 실험적으로 증명했습니다.", "implication": "QSL 상태의 형성 과정에서 RLE가 중요한 중간 단계임을 시사하며, 스핀 액체 이론의 검증을 강화합니다.", "novelty": "기존에는 주로 자기 정렬 물질에서만 관찰되었던 RLE를 QSL 물질에서 최초로 보고했다는 점이 중요합니다.", "unresolved": "RLE가 QSL의 양자 얽힘 정도를 얼마나 정량적으로 반영하는지에 대한 이론적 해석이 더 필요합니다.", "future_work": "중성자 산란(neutron scattering) 실험을 통한 RLE의 분산 관계 규명과 비탄성 산란 연구가 기대됩니다.", "concepts": [{"term": "Roton-like excitations (RLEs)", "why_emerged": "좌절된 자성체에서 들뜸 스펙트럼의 국소적 최소점이 에너지적으로 중요하게 작용하기 때문입니다.", "origin": "Landau(초유체)에서 유래, 자성체 적용은 최근 이론 연구들", "connections": "초유체 헬륨, 퀀텀 스핀 액체, 비탄성 중성자 산란"}, {"term": "Quantum spin liquid (QSL)", "why_emerged": "강한 자기적 좌절로 인해 절대 영도에서도 자기 정렬이 일어나지 않는 상태를 설명하기 위해 필요합니다.", "origin": "Anderson(1973)", "connections": "고온 초전도체, 위상학적 질서"}], "english_summary": ["Experimental identification of roton-like excitations (RLEs) in the triangular-lattice QSL candidate YbCuSe2.", "Evidence obtained through heat capacity and muon spin relaxation measurements.", "Connects the observed RLEs to the physics of the QSL ground state formation.", "First report of RLEs in a material with a QSL ground state rather than magnetic order."]}}, {"title": "Revisiting the symmetry and optical phonons of altermagnetic α-MnTe", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/do   if (r.last_authors || r.authors) { const authors = document.createElement('p'); authors.className = 'authors'; if (r.last_authors) authors.append('Last authors: ' + r.last_authors); if (r.authors) authors.append((r.last_authors ? ' | ' : '') + 'Authors: ' + r.authors); headText.appendChild(authors); }
  appendLabeledText(headText, 'why', 'Filter reason: ', r.reason);
  if (r.tags && r.tags.length) { const tags = document.createElement('div'); tags.className = 'tags'; r.tags.forEach(tag => tags.appendChild(textEl('span', 'tag', '#' + tag))); headText.appendChild(tags); }
  if (r.link) { const link = document.createElement('a'); link.className = 'link'; link.href = r.link; link.target = '_blank'; link.rel = 'noopener noreferrer'; link.textContent = 'Open paper'; headText.appendChild(link); }
  head.appendChild(headText);
  if (r.summary) { const abstract = document.createElement('p'); abstract.className = 'original-abstract'; const strong = textEl('strong', '', 'Original abstract'); abstract.appendChild(strong); abstract.append(r.summary); head.appendChild(abstract); }
  slideEl.appendChild(head);
  const briefing = document.createElement('div');
  briefing.className = 'briefing';
  appendBriefSection(briefing, 'Background', b.background);
  appendBriefSection(briefing, 'Motivation', b.motivation);
  appendBriefSection(briefing, 'Result', b.result);
  appendBriefSection(briefing, 'Implication', b.implication);
  appendBriefSection(briefing, "Why it's important / Novelty", b.novelty);
  appendBriefSection(briefing, 'Unresolved Questions', b.unresolved);
  appendBriefSection(briefing, 'Expected Future Work', b.future_work);
  if (b.concepts && b.concepts.length) {
    const section = document.createElement('section');
    section.className = 'brief-section wide';
    section.appendChild(textEl('h2', '', 'Concepts / Terms'));
    const concepts = document.createElement('div');
    concepts.className = 'concepts';
    b.concepts.forEach(c => {
      const item = document.createElement('div');
      item.className = 'concept';
      item.appendChild(textEl('h3', '', c.term || 'Concept'));
      [['왜 생겼나: ', c.why_emerged], ['누가 만들었나: ', c.origin], ['연결되는 흐름: ', c.connections]].forEach(([label, text]) => { if (!text) return; const p = document.createElement('p'); const bold = textEl('b', '', label); p.appendChild(bold); p.append(text); item.appendChild(p); });
      concepts.appendChild(item);
    });
    section.appendChild(concepts);
    briefing.appendChild(section);
  }
  if (b.english_summary && b.english_summary.length) { const section = document.createElement('section'); section.className = 'brief-section wide'; section.appendChild(textEl('h2', '', 'English Summary')); const ul = document.createElement('ul'); b.english_summary.slice(0, 5).forEach(line => ul.appendChild(textEl('li', '', line))); section.appendChild(ul); briefing.appendChild(section); }
  slideEl.appendChild(briefing);
  counterEl.textContent = `${index + 1} / ${slides.length}`;
  prevBtn.disabled = index === 0;
  nextBtn.disabled = index === slides.length - 1;
}
prevBtn.addEventListener('click', () => { index = Math.max(0, index - 1); render(); });
nextBtn.addEventListener('click', () => { index = Math.min(slides.length - 1, index + 1); render(); });
document.addEventListener('keydown', event => { if (event.key === 'ArrowLeft') prevBtn.click(); if (event.key === 'ArrowRight') nextBtn.click(); });
render();
</script>
</body>
</html>
