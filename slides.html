<title>Daily Paper Slideshow</title>
<style>
  :root {
    color-scheme: light;
    --bg: #f6f7f4;
    --paper: #ffffff;
    --ink: #111827;
    --muted: #64748b;
    --line: #d8ddd2;
    --accent: #176b87;
    --accent-2: #9a3412;
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; overflow: auto; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: var(--bg); color: var(--ink); }
  .shell { max-width: 1500px; min-height: 100vh; margin: 0 auto; padding: 14px 18px; display: flex; flex-direction: column; }
  .topbar { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 16px; }
  .top-actions { display: flex; align-items: center; gap: 10px; }
  .topbar a, button { border: 1px solid var(--line); border-radius: 8px; background: var(--paper); color: var(--ink); padding: 10px 14px; font-weight: 700; text-decoration: none; cursor: pointer; }
  button.primary { background: var(--accent); border-color: var(--accent); color: white; }
  button:disabled { opacity: 0.45; cursor: not-allowed; }
  .counter { color: var(--muted); font-weight: 700; }
  .slide { min-height: calc(100vh - 82px); background: var(--paper); border: 1px solid var(--line); border-radius: 10px; padding: 18px; box-shadow: 0 18px 42px rgba(15, 23, 42, 0.10); display: grid; grid-template-columns: minmax(310px, 0.86fr) minmax(0, 1.55fr); gap: 18px; overflow: visible; }
  .paper-head { min-width: 0; min-height: 0; overflow: visible; display: flex; flex-direction: column; gap: 12px; }
  .figure { margin: 0; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: #f8fafc; }
  .figure img { display: block; width: 100%; max-height: 41vh; object-fit: contain; background: white; }
  .figure figcaption { padding: 7px 10px; color: var(--muted); font-size: 12px; line-height: 1.3; }
  .head-text { display: flex; flex-direction: column; gap: 9px; min-width: 0; }
  .badges { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .badge { border-radius: 999px; padding: 5px 9px; background: #eef2ff; color: #3730a3; font-size: 12px; font-weight: 800; }
  .score { background: #fee2e2; color: #991b1b; }
  h1 { margin: 0; font-size: 25px; line-height: 1.15; letter-spacing: 0; overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
  h1 a { color: inherit; text-decoration-color: rgba(23, 107, 135, 0.35); text-decoration-thickness: 2px; text-underline-offset: 4px; }
  h1 a:hover { color: var(--accent); text-decoration-color: var(--accent); }
  .meta, .authors, .why, .abstract { font-size: 13px; line-height: 1.45; }
  .meta, .authors { color: var(--muted); }
  .why strong, .abstract strong, .authors strong { color: var(--ink); }
  .authors { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .why { border-left: 4px solid var(--accent-2); padding-left: 10px; color: #374151; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .abstract { border-top: 1px solid var(--line); padding-top: 14px; color: #374151; }
  .original-abstract { border-top: 1px solid var(--line); padding-top: 10px; color: #374151; font-size: 11.5px; line-height: 1.35; overflow-wrap: anywhere; }
  .original-abstract strong { display: block; margin-bottom: 4px; color: var(--ink); }
  .tags { display: flex; flex-wrap: wrap; gap: 8px; }
  .tag { border-radius: 999px; padding: 4px 8px; background: #f1f5f9; color: #475569; font-size: 12px; font-weight: 700; }
  .head-text > .link { display: none; }
  .briefing { min-width: 0; min-height: 0; overflow: visible; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); grid-auto-rows: minmax(0, auto); align-content: start; gap: 11px 18px; border-top: 0; padding-top: 0; }
  .brief-section { min-width: 0; }
  .brief-section.wide { grid-column: 1 / -1; }
  .brief-section h2 { margin: 0 0 4px; font-size: 14px; line-height: 1.22; color: #0f766e; letter-spacing: 0; }
  .brief-section p, .brief-section li { margin: 0; font-size: 12.5px; line-height: 1.42; color: #1f2937; overflow-wrap: anywhere; }
  .brief-section ul { margin: 0; padding-left: 20px; }
  .concepts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 9px 14px; }
  .concept { border-top: 1px solid var(--line); padding-top: 7px; }
  .concept h3 { margin: 0 0 4px; font-size: 13px; color: #7c2d12; letter-spacing: 0; }
  .concept p { margin: 2px 0 0; font-size: 11.5px; line-height: 1.35; color: #374151; overflow-wrap: anywhere; }
  .concept b { color: #111827; }
  .link { color: var(--accent); font-weight: 800; text-decoration: none; }
  .empty { padding: 48px; background: var(--paper); border: 1px solid var(--line); border-radius: 12px; color: var(--muted); }
  @media (max-width: 860px) {
    .shell { padding: 14px; }
    .topbar, .top-actions { align-items: stretch; flex-direction: column; }
    .slide, .briefing, .concepts { grid-template-columns: 1fr; }
    .slide { min-height: auto; overflow: visible; display: grid; }
    h1 { font-size: 28px; }
  }
</style>

<script>
const slides = [{"title": "Photoemission tomography of excitons: Momentum-space signatures of correlated electron-hole wave functions", "journal": "PRB_Recent", "source": "keyword", "link": "http://link.aps.org/doi/10.1103/z2w9-2q3c", "authors": "Siegfried Kaidisch, Amir Kleiner, Sivan Refaely-Abramson, Peter Puschnig, Christian S. Kern", "last_authors": "Peter Puschnig, Christian S. Kern", "summary": "The momentum-space signatures of excitons can be experimentally accessed through time-resolved (pump-probe) photoelectron spectroscopy. In this work, we develop a computational framework for exciton photoemission orbital tomography (exPOT) in periodic systems, enabling the simulation and interpretation of experimental observables within many-body perturbation theory. By connecting the G W + Bethe-Salpeter equation (BSE) approach to photoemission tomography, our formalism captures exciton photoemission in periodic systems, explicitly incorporating photoemission matrix element effects induced by the light-matter interaction via the probe pulse. The correlated nature of electrons and holes introduces distinct consequences for excitonic photoemission. Using the prototypical two-dimensional material hexagonal boron nitride, we demonstrate these effects, including a dependence of the photoemission angular distribution on the pump pulse polarization. Moreover, our framework extends to excitons with finite center-of-mass momentum, making it well-suited to studying momentum-dark excitons. This provides valuable insights into the microscopic nature of excitonic phenomena in quantum materials.", "tier": "A_MUST_READ", "score": "9", "reason": "title strong match: photoemission", "tags": ["photoemission", "correlated"], "image": "", "briefing": {"background": "고체 물질 내의 엑시톤(exciton)은 전자-정공 쌍의 강한 상관관계를 가진 준입자로, 물질의 광학적, 전자적 특성을 결정짓는 핵심 요소입니다. 시간 분해 광전자 분광법(TR-ARPES)은 이를 관측하는 강력한 도구이지만, 데이터 해석을 위한 이론적 모델링이 복잡합니다.", "motivation": "기존의 ARPES 해석 방식만으로는 엑시톤의 상관관계가 반영된 복잡한 운동량 공간 서명(momentum-space signature)을 상세히 기술하기 어려워, 이를 이론적으로 해석할 계산 체계가 필요했습니다.", "result": "GW 근사 및 베테-살페터 방정식(BSE)을 광전자 분광 토모그래피(photoemission tomography)와 결합하여 엑시톤의 광방출 과정을 시뮬레이션할 수 있는 프레임워크를 개발했습니다.", "implication": "운동량 공간에서 엑시톤의 파동함수 구조를 직접 해석할 수 있게 되어, 실험 데이터와 이론적 모델 간의 간극을 좁히고 엑시톤 동역학 이해도를 높였습니다.", "novelty": "엑시톤의 광전자 방출 시 매트릭스 원소 효과를 명시적으로 고려했으며, 특히 운동량-암흑(momentum-dark) 엑시톤 연구로 확장이 가능하다는 점에서 ARPES 기반 상관계 물리학 연구에 큰 진전을 가져옵니다.", "unresolved": "실제 복잡한 3차원 결정 구조에서 다체 상호작용이 강하게 일어날 때의 계산 비용과 수렴성 문제가 완전히 해결되지 않았습니다.", "future_work": "다양한 저차원 양자 물질로의 적용 및 펌프-프로브 펄스의 위상과 편광에 따른 엑시톤 응답의 상세 분석.", "concepts": [{"term": "엑시톤 광전자 토모그래피(exPOT)", "why_emerged": "엑시톤 상태의 파동함수 정보를 운동량 공간에서 시각화하기 위해 제안되었습니다.", "origin": "본 논문에서 제안한 계산 방법론.", "connections": "ARPES 매트릭스 원소 분석법, GW+BSE 다체 이론."}, {"term": "운동량-암흑 엑시톤(Momentum-dark excitons)", "why_emerged": "광학적으로 직접 여기되지 않는 큰 운동량의 엑시톤을 연구하기 위해 필요합니다.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "간접 밴드갭 반도체, 비탄성 산란 실험."}], "english_summary": ["Established a computational framework for exciton photoemission tomography.", "Integrates GW+BSE approach to simulate momentum-space exciton signatures.", "Captures light-matter interaction and matrix element effects accurately.", "Enables interpretation of momentum-dark excitons and polarization dependencies."]}}, {"title": "Intracycle Interference in Strong-Field Photoemission from a Tungsten Needle Tip", "journal": "PRL_Recent", "source": "keyword", "link": "http://link.aps.org/doi/10.1103/t87j-1ngl", "authors": "Timo Wirth, Jonas Heimerl, Stefan Meier, Peter Hommelhoff", "last_authors": "Stefan Meier, Peter Hommelhoff", "summary": "Electrons photoemitted by strong laser fields can rescatter, generating attosecond high harmonics. Spectral peaks arise from inter- and intracycle interference of coherent electron wave packets. While intercycle interference is well known, intracycle interference of plateau electrons has not been ob…", "tier": "A_MUST_READ", "score": "9", "reason": "title strong match: photoemission", "tags": ["photoemission"], "image": "", "briefing": {"background": "강한 레이저 장 하에서의 광전자 방출은 전자 파동 패킷의 간섭 현상을 유발하며, 이는 아토초 물리학의 기초가 됩니다. 고조파 발생과 같은 비선형 광학 현상은 전자 재산란(rescattering) 과정과 밀접합니다.", "motivation": "주기 간(intercycle) 간섭은 잘 알려져 있으나, 하나의 레이저 주기 내에서 발생하는 전자들의 간섭(intracycle interference)인 ' plateau' 영역 전자의 거동은 명확히 규명되지 않았습니다.", "result": "텅스텐 나노 팁에서의 강한 장 광전자 방출 실험을 통해 주기 내 간섭의 직접적인 증거와 그 스펙트럼적 특징을 확인했습니다.", "implication": "금속 팁에서의 전자 방출 과정을 아토초 시간 척도에서 제어하고 이해할 수 있는 토대를 마련했습니다.", "novelty": "지금까지 관측이 어려웠던 주기 내 간섭 현상을 텅스텐 나노 팁 시스템에서 분리해내어, 고체 표면에서의 강한 장 물리학 연구에 새로운 관점을 제시합니다.", "unresolved": "팁의 기하학적 구조가 미치는 국소적 장 강화 효과와 간섭 패턴의 미세한 상관관계.", "future_work": "더 복잡한 나노 구조체에서의 시간 분해 전자 파동 패킷 제어 실험.", "concepts": [{"term": "주기 내 간섭(Intracycle interference)", "why_emerged": "강한 레이저 장에서 전자 파동 패킷이 재산란될 때 발생하는 위상 정보를 기술하기 위해 필요합니다.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "고조파 생성(HHG), 강한 장 물리학."}], "english_summary": ["Investigated intracycle interference in strong-field photoemission.", "Conducted experiments on tungsten needle tips.", "Identified spectral signatures of plateau electrons due to interference.", "Advances understanding of attosecond electron dynamics in solids."]}}, {"title": "A Perspective on Topological Charge Density Wave Materials", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2611.13360", "authors": "Chun-Tung Lien, Nidhish Thiruthukkal Puthenveettil, Alexander A. Balandin, Md Shafayat Hossain", "last_authors": "Alexander A. Balandin, Md Shafayat Hossain", "summary": "Charge density waves are among the earliest known ordered states in quantum materials, yet they have re-emerged at the center of modern discussions of topology, symmetry breaking, and collective dynamics. In several material classes, charge-density-wave order reshapes electronic bands, boundary states, defect structures, and electromagnetic responses in ways that invite a topological interpretation. Real-space imaging has shown that incommensurate order can form networks of phase defects rather than uniform modulations. Boundary-resolved spectroscopy has revealed in-gap modes whose existence and spatial structure track the charge-density-wave order, although such observations remain confined to a single material family. In Weyl materials, density-wave gaps have been linked to axion-like magnetoelectric response, placing the charge-density-wave phase within a dynamical-field description of the effective action. In kagome metals, charge order is intertwined with Berry curvature, unconventional symmetry breaking, and superconductivity. These developments have led to the term \"topological charge density wave,\" but the phrase describes several physically distinct phenomena. We distinguish three meanings: (i) topology of the order parameter and its defects, (ii) topology of the charge-density-wave-reconstructed electronic structure and its boundary modes, and (iii) axion-like electromagnetic response generated by density-wave order. The experimental and theoretical support for these three meanings differs substantially. This Perspective traces the development of these ideas, clarifies the evidence behind each class, identifies unresolved questions and points of debate, and outlines experimental criteria for establishing topology in charge-density-wave states.", "tier": "A_MUST_READ", "score": "9", "reason": "Directly addresses topological CDW, kagome, and electronic structure order relevant to AV3Sb5 materials.", "tags": ["material", "topic"], "image": "https://arxiv.org/static/browse/0.3.4/images/arxiv-logo-fb.png", "briefing": {"background": "전하 밀도 파(CDW)는 고체 물리학의 고전적인 정렬 상태이나, 최근 위상 물리학(topology)과 결합하며 새로운 전성기를 맞고 있습니다. 특히 카고메 금속 등에서 관찰되는 현상은 기존 이론의 확장을 요구합니다.", "motivation": "'위상적 CDW'라는 용어가 학계에서 광범위하게 쓰이지만 물리적 의미가 혼재되어 있어, 이를 세 가지 체계적 관점으로 정리하고 비판적으로 검토할 필요가 있었습니다.", "result": "위상적 CDW를 (1) 질서 매개변수의 위상, (2) 재구성된 전자 구조의 위상, (3) 액시온 유사 전자기 응답의 세 가지 카테고리로 분류하여 이론적 혼란을 정리했습니다.", "implication": , orbital-dependent quasiparticle renormalizations, Fermi surface, and magnetic correlations in the recently discovered alternating s…", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "High-quality DFT+DMFT study on nickelates, relevant to broader strongly correlated interests.", "tags": ["nickelates", "electronicstructure", "DMFT"], "image": "", "briefing": {"background": "니켈산화물은 고온 초전도체인 구리산화물(cuprate)의 전자 구조와 유사한 점이 많아 차세대 고온 초전도체 후보 물질로 활발히 연구되고 있습니다.", "motivation": "최근 발견된 La5Ni3O11 물질의 정규 상태에서의 전자 구조, 궤도 의존적 준입자 재규격화, 그리고 자기적 상관관계를 이해하기 위해 이 연구가 수행되었습니다.", "result": "DFT+DMFT 계산을 통해 이 물질의 Fermi 표면 구조와 강한 전자 상관관계에 의한 준입자 질량 강화 현상을 밝혀냈습니다.", "implication": "La5Ni3O11의 전자적 특성이 구리산화물 및 다른 니켈산화물과 어떻게 연결되는지 파악함으로써 초전도 메커니즘 규명의 단서를 제공합니다.", "novelty": "DFT+DMFT라는 정밀한 다체 물리 계산법을 활용해 복잡한 적층 구조를 가진 니켈산화물의 상관관계를 체계적으로 분석했습니다.", "unresolved": "이론적 계산 결과가 실제 실험(ARPES 등)과 얼마나 정밀하게 일치하는지는 추가적인 실험 검증이 필요합니다.", "future_work": "실제 단결정 시료를 이용한 ARPES 실험을 통해 계산된 페르미 표면과 밴드 구조를 실험적으로 입증해야 합니다.", "concepts": [{"term": "DFT+DMFT", "why_emerged": "기존 DFT만으로는 강한 상관관계에 의한 전자 국소화 및 다체 효과를 기술하기 어려워 고안됨.", "origin": "Georges, Kotliar, Krauth, Rozenberg 등이 1996년 리뷰 논문을 통해 체계화함.", "connections": "LDA+DMFT, Hubbard 모델, 구리산화물 초전도 이론과 깊게 연결됨."}, {"term": "준입자 재규격화", "why_emerged": "상호작용하는 전자계에서 입자가 원래 질량보다 무거워지는 현상을 기술하기 위해 필요.", "origin": "Landau의 페르미 액체 이론에서 확립됨.", "connections": "유효 질량, 전자 상관관계, 무거운 페르미온 물질."}], "english_summary": ["Investigates the electronic structure of the nickelate La5Ni3O11 using DFT+DMFT.", "Calculates orbital-dependent quasiparticle renormalization and magnetic correlations.", "Provides theoretical insight into the strongly correlated nature of this nickelate.", "Aims to understand the link between electronic structure and potential superconductivity."]}}, {"title": "Evidence for multiband superconductivity in 2H-NbSeS", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/pncd-sn59", "authors": "K. Yadav, M. Lamba, K. Bhatta source": "Gemini", "link": "http://link.aps.org/doi/10.1103/gmtx-h1gs", "authors": "Daniel E. Parker, Patrick Ledwith, Eslam Khalaf, et al.", "last_authors": "Amir Yacoby, Ashvin Vishwanath", "summary": "In contrast to the fractional quantum Hall (FQH) effect, where electron density fixes the applied magnetic field, fractional Chern insulators (FCIs) can realize FQH states in comparatively weak or even zero magnetic fields. Previous theoretical work highlighted magic-angle graphene as a promising FC…", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Important experiment on topological phases in moire systems.", "tags": ["graphene", "moire", "Cherninsulator"], "image": "", "briefing": {"background": "꼬인 이중층 그래핀(TBG)은 마법 각도에서 발생하는 평탄한 밴드(flat band)를 통해 강력한 전자 상관관계와 위상적 성질을 동시에 보여주는 시스템입니다.", "motivation": "외부 자기장이 없는 상태(zero-field) 혹은 약한 자기장에서 분수 첸 절연체(FCI) 상태를 구현하고 그 특성을 확인하고자 합니다.", "result": "뒤틀린 이중층 그래핀 시스템에서 자기장 제어를 통해 분수 첸 절연체 위상을 구현할 수 있음을 실험적으로 입증했습니다.", "implication": "고가의 자기장 설비 없이도 위상 상태를 제어할 수 있는 가능성을 열어주며, 비아벨 통계 입자 연구에 기여합니다.", "novelty": "FQH 효과의 아날로그인 FCI를 모아레 시스템에서 구현하여, 강한 자기장 없이도 위상 질서를 연구할 수 있는 플랫폼을 제시했습니다.", "unresolved": "이러한 위상 상태가 가지는 정확한 들뜸(excitation) 구조와 분수 통계 특성에 대한 직접적인 확인이 더 필요합니다.", "future_work": "국소 상태 밀도 측정 및 수송 실험을 통해 FCI의 분수 엣지 상태를 추가 검증해야 합니다.", "concepts": [{"term": "분수 첸 절연체 (FCI)", "why_emerged": "외부 자기장 없이도 분수 양자 홀 효과와 같은 위상적 상태를 구현하기 위해 고안됨.", "origin": "2011년경 이론적으로 제안됨(Neupert, Sheng, 등).", "connections": "분수 양자 홀 효과(FQH), 베리 곡률, 평탄한 밴드."}, {"term": "마법 각도 그래핀", "why_emerged": "두 층의 그래핀을 특정 각도로 꼬았을 때 밴드가 평탄해지며 강한 상관관계 효과가 극대화되는 현상을 이용하기 위해 나옴.", "origin": "Pablo Jarillo-Herrero 그룹(2018)에 의해 실험적으로 발견.", "connections": "모아레 초격자, 초전도성, 위상 절연체."}], "english_summary": ["Demonstrates the realization of fractional Chern insulators in twisted bilayer graphene.", "Achieves states at zero or low magnetic fields using moiré superlattices.", "Connects the fractional quantum Hall effect physics to van der Waals systems.", "Highlights the potential of moiré systems for topological phase engineering."]}}, {"title": "Ligand-mediated origin of altermagnetic spin splitting", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/s83n-w474", "authors": "Luigi Camerano, Federico Bisti, Gianni Profeta", "last_authors": "Federico Bisti, Gianni Profeta", "summary": "Altermagnets host spin-split electronic bands despite zero net magnetization, opening new routes for spintronics beyond conventional ferromagnets. Going beyond symmetry-based classifications, which specify allowed terms but not their hierarchy, here we use first-principles calculations and Wannier Hamiltonian engineering to uncover the microscopic bonding contributions of altermagnetic spin splitting in the g -wave altermagnet Co 1 / 4 NbSe 2 . We show that the splitting is captured by a short-range tight-binding model, establishing its local origin. By selectively controlling hopping channels, we demonstrate that the dominant contribution arises not from direct magnetic-ion hopping, but from ligand-mediated hybridization that transfers anisotropy to itinerant states. This identifies ligand-assisted coupling as a dominant mechanism driving altermagnetic spin splitting in intercalated metals, providing a microscopic bridge between minimal models and material-specific electronic structure calculations in altermagnets.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Important electronic structure theory for altermagnets.", "tags": ["altermagnetism", "electronicstructure"], "image": "", "briefing": {"background": "알터마그네틱(Altermagnetism)은 순자화가 0임에도 불구하고 결정 대칭성에 의해 전자 밴드 구조에서 스핀 갈라짐(spin splitting)이 나타나는 새로운 자기 질서 상태입니다. 이는 기존의 강자성이나 반강자성을 넘어선 차세대 스핀트로닉스 응용 가능성으로 주목받고 있습니다.", "motivation": "대칭성 분석만으로는 스핀 갈라짐의 크기와 위계를 정량화하기 어려웠습니다. 연구진은 Co1/4NbSe2를 모델로 하여 알터마그네틱 스핀 갈라짐의 미시적 기원을 명확히 규명하고자 했습니다.", "result": "스핀 갈라짐의 핵심이 직접적인 자기 이온 간의 호핑(hopping)이 아니라, 리간드 매개 혼성 결합(ligand-mediated hybridization)에 의해 발생함을 입증했습니다. 이는 단거리 타이트 바인딩 모델로 기술 가능합니다.", "implication": "알터마그네틱의 특성을 결정하는 핵심이 리간드와의 상호작용임을 밝힘으로써, 향후 재료 설계를 통해 스핀 분리도를 정밀하게 제어할 수 있는 이론적 기반을 마련했습니다.", "novelty": "기존의 추상적인 대칭성 논의를 벗어나, 실제 재료에서의 물리적 호핑 경로를 직접적으로 연결했다는 점에서 의미가 큽니다.", "unresolved": "리간드 매개 메커니즘이 다른 계열의 알터마그네틱 물질에서도 동일하게 지배적인지 여부는 추가적인 연구가 필요합니다.", "future_work": "다양한 intercalated 시스템에서 리간드 환경을 변형시켜 알터마그네틱 스핀 갈라짐의 크기를 최적화하는 실험적 시도가 기대됩니다.", "concepts": [{"term": "알터마그네틱", "why_emerged": "기존 강자성과 반강자성의 한계를 넘어 스핀 분극된 전류를 얻기 위해 등장.", "origin": "최근 2020년대 들어 주목받기 시작, 특정 비상대론적 결정 대칭성에 기초함.", "connections": "반강자성체, 스핀트로닉스, 베리 곡률과 연결됨."}, {"term": "리간드 매개 결합", "why_emerged": "금속 이온 간의 직접적인 교환 상호작용만으로 설명되지 않는 자기적 특성을 이해하기 위해 필요.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "초교환 상호작용(Superexchange), 하이브리다이제이션."}], "english_summary": ["Altermagnetism provides spin-split bands without net magnetization.", "Investigated Co1/4NbSe2 using first-principles calculations.", "Ligand-mediated hybridization is the primary driver of spin splitting.", "Tight-binding model successfully captures local electronic anisotropy."]}}, {"title": "Sondheimer magneto-oscillations as a probe of Fermi surface reconstruction in underdoped cuprates", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/73v3-nbrg", "authors": "Alexander Nikolaenko, Carsten Putzke, Philip J. W. Moll, Subir Sachdev, Pavel A. Nosov", "last_authors": "Subir Sachdev, Pavel A. Nosov", "summary": "Determining the Fermi surface (FS) volume in underdoped cuprates is crucial for understanding the nature of the strongly correlated pseudogap phase. Conventional quantum oscillation techniques, typically used for this purpose, are inapplicable in this high-temperature regime due to thermal and disor…", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Important electronic structure and Fermi surface probe in unconventional superconductors relevant to user interests.", "tags": ["cuprate", "superconductivity", "Fermisurface"], "image": "", "briefing": {"background": "언더도핑된 구리 산화물(Cuprates)에서 페르미 표면(FS)의 구조는 유사갭(pseudogap) 상태를 이해하기 위한 핵심 단서입니다. 하지만 이 영역은 온도가 높고 불순물에 의한 산란이 강해 기존의 양자 진동 측정 기술을 적용하기 어렵습니다.", "motivation": "고온 영역에서도 적용 가능한 새로운 페르미 표면 측정 기법을 통해 구리 산화물의 재구성된 페르미 표면을 분석하고자 합니다.", "result": "Sondheimer magneto-oscillations을 활용하여 기존 기술로 관측이 어려웠던 영역에서 페르미 표면의 특성을 성공적으로 추출해냈습니다.", "implication": "구리 산화물의 유사갭 상에서 발생하는 전자 구조의 재구성이 페르미 표면의 변화와 밀접하게 관련되어 있음을 직접적으로 증명할 수 있습니다.", "novelty": "양자 진동 측정의 한계를 극복하는 새로운 실험적 탐침을 제시함으로써, 강한 상관계 전자 계의 복잡한 상태를 탐구하는 새로운 길을 열었습니다.", "unresolved": "제시된 측정 방법이 모든 언더도핑 영역의 화합물에 대해 동일한 신뢰도를 보장하는지에 대한 추가 검증이 필요합니다.", "future_work": "다양한 구리 산화물 시스템에서 Sondheimer 진동을 측정하여 유사갭 폐쇄와 연관된 페르미 표면 변화의 범용성을 확인할 것으로 보입니다.", "concepts": [{"term": "Sondheimer magneto-oscillations", "why_emerged": "기존의 드 하스-판 알펜 효과 측정의 한계를 극복하기 위해 제안됨.", "origin": "E. H. Sondheimer가 전도도 진동 이론으로 정립.", "connections": "양자 진동, 페르미 표면 측정, 수송 현상."}, {"term": "유사갭(Pseudogap)", "why_emerged": "구리 산화물에서 초전도 이전 단계의 비정상적인 전자 상태를 설명하기 위해 등장.", "origin": "1990년대 초반 NMR 및 광전자 분광법 실험으로 확립됨.", "connections": "페르미 표면 재구성, 도핑, 초전도 질서."}], "english_summary": ["Sondheimer magneto-oscillations applied to probe cuprate Fermi surfaces.", "Overcomes thermal/disorder limitations of conventional quantum oscillations.", "Provides insight into FS reconstruction in the pseudogap phase.", "Valuable technique for studying strongly correlated superconductors."]}}, {"title": "Two-dimensional weak localization in trilayer Ruddlesden-Popper nickelates", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/2ymd-9zt7", "authors": "Hyo-Bin Ahn, Xinglong Chen, Yu Zhang, et al.", "last_authors": "Daniel Phelan, Ulrich Welp", "summary": "Ruddlesden-Popper (RP) nickelates superconduct when pressure suppresses intertwined charge- and spin-density waves. Here, we employ measurements of quantum corrections to magnetoconductivity as a probe of the dimensionality, phase coherence, and scattering mechanisms urities in quantum materials."]}}, {"title": "Evolution of the Superfluid Density in Infinite-Layer Nickelates", "journal": "PRL_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/25gn-bfgw", "authors": "Bai Yang Wang, Shannon P. Harvey, Kyuho Lee, et al.", "last_authors": "Srinivas Raghu, Harold Y. Hwang", "summary": "An experiment enables the first systematic, absolute superfluid-density measurement across the full superconducting dome of an infinite-layer nickelate.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Important experimental transport study on unconventional superconducting nickelates.", "tags": ["superconductivity", "nickelates", "transport"], "image": "", "briefing": {"background": "무한층(infinite-layer) 니켈레이트는 구리 산화물(cuprates)과 유사한 전자 구조를 가져 고온 초전도체 후보로 주목받고 있으나, 그 초전도성 기원과 메커니즘은 여전히 논쟁 중입니다.", "motivation": "초전도 도핑 영역(dome) 전체에 걸쳐 초유체 밀도(superfluid density)를 절대값으로 측정하여 니켈레이트 초전도체의 물리적 성질을 규명하고자 합니다.", "result": "체계적인 수송 측정(transport measurement)을 통해 니켈레이트의 초유체 밀도 변화를 처음으로 도출했습니다.", "implication": "초유체 밀도 데이터는 전자 상관관계와 캐리어 농도 사이의 상관관계를 보여주며, 니켈레이트가 구리 산화물과 같은 강상관 전자계 초전도체인지 확인하는 핵심 지표가 됩니다.", "novelty": "니켈레이트 시스템에서 초전도 돔 전체의 초유체 밀도를 직접적으로 정량화한 최초의 실험적 시도입니다.", "unresolved": "이 데이터가 구리 산화물처럼 'BCS-BEC 크로스오버' 관점의 상한선인지, 혹은 도핑에 따른 전자 질량의 변화인지에 대한 해석은 추가 분석이 필요합니다.", "future_work": "더 넓은 온도 및 자기장 범위에서의 정밀 측정과, 도핑에 따른 전자 구조 변화를 확인하는 ARPES 연구가 뒤따를 것으로 보입니다.", "concepts": [{"term": "Superfluid Density", "why_emerged": "초전도 상태에서 Cooper 쌍을 형성하여 에너지를 잃지 않고 흐르는 전하 운반체의 밀도를 정의하기 위해 도입되었습니다.", "origin": "London, Gorter, Casimir 등에 의해 1930년대 제안", "connections": "Uemura 관계식, 상전이 온도, 강상관 전자계 초전도성"}, {"term": "Infinite-Layer Nickelates", "why_emerged": "구리 산화물과 유사한 3d 전자 구조를 가지면서도 도핑 제어가 가능한 새로운 고온 초전도 물질을 찾기 위해 합성되었습니다.", "origin": "2019년 Stanford 대학의 Harold Hwang 그룹에 의해 처음 초전도성 보고", "connections": "Cuprates, Mott insulator, 2D 페로브스카이트"}], "english_summary": ["Systematic measurement of superfluid density in infinite-layer nickelates.", "Covers the full superconducting dome to elucidate the nature of superconductivity.", "Provides key transport data comparing nickelates to cuprate high-Tc superconductors.", "Establishes a baseline for understanding the pairing mechanism in these materials."]}}, {"title": "Equivalence of pseudogap and pairing energy in a cuprate high-temperature superconductor", "journal": "Science", "source": "Gemini", "link": "https://www.science.org/doi/abs/10.1126/science.adt3444?af=R", "authors": "Jiasen Niu, Maialen Ortego Larrazabal, Thomas Gozlinski, et al.", "last_authors": "Ingmar Swart, Milan P. Allan", "summary": "The pseudogap stands out in the phase diagram of the cuprate high-temperature superconductors because its origin and relationship to superconductivity remain elusive. The origin of the pseudogap has been debated, with competing hypotheses attributing it to preformed electron pairs or local order, such as charge density waves. We present unambiguous evidence supporting the pairing scenario, using local shot-noise spectroscopy measurements in Bi 2 Sr 2 CaCu 2 O 8+δ . Our data demonstrate that the pseudogap energy coincides with the onset of electron pairing and is spatially heterogeneous with values reaching up to 70 milli–electron volts. Our results exclude a pure local order origin of the pseudogap, link the pseudogap to Cooper pair formation, and suggest that the limiting factor for higher critical temperature in cuprates is phase coherence.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "High-impact research on cuprate superconductors within user's interest in unconventional superconductivity.", "tags": ["superconductivity", "cuprate", "electronicstructure"], "image": "", "briefing": {"background": "구리 산화물 고온 초전도체의 가파른 상전이 온도보다 높은 온도에서 나타나는 '의사갭(pseudogap)'은 초전도와 경쟁하는지 혹은 파생되는지 여부가 수십 년간 고체 물리학의 최대 난제였습니다.", "motivation": "의사갭의 기원이 '사전 형성된 쿠퍼 쌍(preformed pairs)'인지 '국소적 전하 질서(charge order)'인지 명확히 판별하고자 합니다.", "result": "Bi2Sr2CaCu2O8+d 결정에서 국소 샷 노이즈 분광법을 통해 의사갭 에너지가 쿠퍼 쌍 형성과 일치함을 확인했습니다.", "implication": "의사갭이 전하 질서와 같은 외부 요인이 아닌, 초전도와 직접 연결된 쿠퍼 쌍 형성의 결과임을 강력히 시사하며 위상 간섭의 중요성을 강조합니다.", "novelty": "샷 노이즈 측정을 통해 의사갭과 쿠퍼 쌍 형성의 공간적 상관관계를 입증하여, 기존의 경쟁적 질서 가설에 큰 타격을 주었습니다.", "unresolved": "위상 일치성(phase coherence)이 왜 초전도 온도 이상에서는 결여되어 있는지, 그 구체적인 파괴 기제는 여전히 연구 과제입니다.", "future_work": "위상 결맞음(phase coherence)을 제어할 수 있는 저차원 구조 혹은 변형(strain) 엔지니어링을 통한 Tc 극대화 실험이 예상됩니다.", "concepts": [{"term": "Pseudogap", "why_emerged": "초전도 온도 이상에서 페르미 준위 주변의 상태 밀도가 감소하는 현상을 설명하기 위해 도입되었습니다.", "origin": "1990년대 초반 NMR 및 분광학 데이터에서 관찰", "connections": "전하 질서, 쿠퍼 쌍 결성, 고온 초전도체"}, {"term": "Shot-Noise Spectroscopy", "why_emerged": "전하 운반체의 유효 전하를 측정하여 초전도 쌍의 존재 여부를 직접 확인하기 위해 필요합니다.", "origin": "Schottky의 1918년 이론에 기초, 최근 STM 기술과 결합", "connections": "전하량 측정, 결맞음 상태 분석"}], "english_summary": ["Investigates the origin of the pseudogap in cuprate high-Tc superconductors.", "Uses local shot-noise spectroscopy in Bi2212 to confirm the pairing scenario.", "Proves that pseudogap energy coincides with the onset of electron pairing.", "Suggests that phase coherence limits the maximum Tc in cuprates."]}}, {"title": "Artificial spin ice on the CaVO lattice: a tricritical bridge from square to kagome", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2611.01397", "authors": "F. Museur, G. M. Macauley, S. Nilsson, V. Scagnoli, P. M. Derlet, L. J. Heyderman", "last_authors": "S. Nilsson, V. Scagnoli, P. M. Derlet, L. J. Heyderman", "summary": "Artificial spin ices (ASIs) are arrays of interacting nanomagnets in which phase transitions can be imaged and controlled. Studies of the thermodynamic have focused mainly on the square and kagome lattices, and on their variants. Here we study artificial spin ice on the CaVO lattice, formed of squares and octagons. At fixed lattice constant, the ratio $r$ of the square and octagon link lengths tunes the interactions strongly while changing the geometry only slightly. Magnetic force microscopy and Monte Carlo simulations show a continuous bridge from square-ice-like to kagome-like behavior. At small $r$ the system has a single ordering transition, whereas at large $r$ it passes from a correlated paramagnet to charge order and then long-range order. The two regimes meet in a multicritical region, accurately modeled by a Blume-Capel model of the octagon toroidal moments. From this picture, we design a comparative magnetometry protocol that unambiguously separates interaction effects from single-nanomagnet effects in thermally active samples. Finally, the charge-ordered region maps onto a tunable dimer model, with a Coulomb phase and pinch points along the line between two ordered dimer phases. The CaVO ASI thus provides access to a rich phase diagram only through geometric tuning, without requiring extreme experimental conditions.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Relevant kagome-related geometry and magnetic frustration in a tunable model system.", "tags": ["kagome", "magnetism", "artificial-spin-ice"], "image": "https://arxiv.org/html/2611.01397v2/Fig1.png", "briefing": {"background": "인공 스핀 얼음(ASI)은 나노 자석 배열을 통해 복잡한 자기 상전이와 물리적 현상을 설계하고 시각화하는 연구 분야입니다. 주로 사각 격자나 카고메 격자의 기하학적 좌절 현상을 연구하여 통계 역학적 모델을 검증하는 데 사용됩니다.", "motivation": "본 연구는 CaVO 격자라는 사각과 팔각형이 결합된 새로운 기하학적 구조에서 격자 상수 비율(r)을 조절함으로써, 사각 얼음에서 카고메 얼음으로 이어지는 연속적인 상전이 경로를 탐색하고자 했습니다.", "result": "r 값에 따른 기하학적 튜닝만으로 사각-카고메 간의 자기적 상전이 양상을 연속적으로 브릿지할 수 있음을 확인했습니다. 또한, 전하 정렬 영역이 쿨롱 상과 핀치 포인트(pinch point)를 포함하는 다이머 모델과 매핑됨을 보였습니다.", "implication": "극단적인 실험 조건 없이도 구조적 설계(geometric tuning)만으로 복잡한 자기 위상도를 제어할 수 있는 플랫폼을 확보했습니다.", "novelty": "기존 ASI 연구가 고정된 격자 구조에 집중했던 것과 달리, 단일 격자 내에서 기하학적 매개변수를 통해 물리적 상태를 연속적으로 튜닝했다는 점이 중요합니다. 귀하의 연구 관심사인 카고메 격자의 자성 및 좌절 현상을 이해하는 데 훌륭한 모델 시스템을 제공합니다.", "unresolved": "실제 나노 자석들 간의 장거리 상호작용이 매우 미세하게 조절될 때 나타나는 동역학적 특성에 대한 완전한 이해는 아직 부족합니다.", "future_work": "본 플랫폼을 활용하여 열적 활성 샘플에서의 동역학적 완화 과정(relaxation)과 외부 자기장 인가에 따른 상전이의 비평형 특성을 연구할 것으로 예상됩니다.", Y. Shemerliuk, S. Selter, et al.", "last_authors": "H. -J. Grafe, K. M. Ranjith", "summary": "We report a comprehensive investigation of the magnetic properties and spin dynamics of the chain-like van der Waals antiferromagnet AgCrP 2 S 6 using magnetization, magnetic susceptibility, and 31 P nuclear magnetic resonance (NMR). The magnetic susceptibility exhibits a broad maximum near T max ≈ 250 T_{\\rm max}\\approx 250 K, characteristic of strong short-range antiferromagnetic correlations in a low-dimensional system. A classical Fisher-chain analysis gives an effective intrachain exchange scale J / k B ≈ 140 J/k_{B}\\approx 140 K, while a quantum S = 3 / 2 S=3/2 nearest-neighbor-chain calculation yields J / k B ≈ 114 J/k_{B}\\approx 114 K. A constrained AF–FM zig-zag-chain calculation is also compatible with the susceptibility, supporting a dominant quasi-one-dimensional antiferromagnetic exchange scale of order 10 2 10^{2} K. Low-temperature magnetization measurements reveal pronounced magnetic anisotropy, with a spin-flop transition near μ 0 ​ H sf ≈ 6.5 \\mu_{0}H_{\\rm sf}\\approx 6.5 T for fields applied along the b b -axis, identifying the easy axis of the ordered state. 31 P NMR measurements provide microscopic insight into both static and dynamic spin correlations. The paramagnetic spectra exhibit a Pake doublet arising from dipolar coupling within the structural P–P dimer. The K K – χ \\chi relation displays two distinct linear regimes separated near T ∗ ≈ 250 T^{\\ast}\\approx 250 K, with different slopes indicating a change in the effective transferred hyperfine couplings. At high temperatures, the spin-lattice relaxation rate is nearly temperature independent and significantly exceeds the exchange-narrowed estimate based on the scalar hyperfine coupling. This discrepancy indicates that the relaxation is governed by the full anisotropic hyperfine form factor, including transverse and possibly off-diagonal tensor components, together with finite- q q spin fluctuations. Upon cooling toward the Néel temperature T N ≈ 20 T_{\\rm N}\\approx 20 K, the relaxation rate increases due to the growth of spin correlations and exhibits critical enhancement near the transition. Below T N T_{\\rm N} , the relaxation follows 1 / T 1 ∝ T 5 1/T_{1}\\propto T^{5} , consistent with magnon-mediated relaxation in the ordered state. The temperature dependence of the internal hyperfine field yields a critical exponent β ≈ 0.36 \\beta\\approx 0.36 , consistent with three-dimensional universality. Together, these results establish AgCrP 2 S 6 as a quasi-one-dimensional S = 3 / 2 S=3/2 antiferromagnet embedded in a layered van der Waals host, in which local probes directly resolve the crossover from correlated intrachain spin dynamics to anisotropic three-dimensional magnetic order. More broadly, AgCrP 2 S 6 provides a useful van der Waals platform for studying dimensional crossover, correlated spin dynamics, and hyperfine-coupling evolution in low-dimensional antiferromagnets.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Experimental study of quasi-1D van der Waals antiferromagnet, relevant to correlated spin dynamics.", "tags": ["experiment", "quasi-1D", "vanderWaals", "antiferromagnetism", "correlatedelectronsystems", "NMR"], "image": "https://arxiv.org/html/2611.14444v1/Fig1.png", "briefing": {"background": "반데르발스(vdW) 물질은 층상 구조 덕분에 저차원 물리 현상을 연구하기 용이합니다. 그중 사슬형(chain-like) 자성체는 1차원적인 스핀 동역학이 고온에서 발현되다가 온도가 낮아짐에 따라 3차원 정렬로 넘어가는 차원 교차(dimensional crossover) 현상을 연구하는 데 핵심적입니다.", "motivation": "AgCrP2S6 물질이 가지는 1차원적 사슬 구조 내의 스핀 교환 에너지와 저온에서의 3차원 반강자성 정렬 사이의 상관관계를 NMR과 자성 측정을 통해 미시적으로 규명하고자 했습니다.", "result": "고온에서는 강한 1차원 반강자성 상관관계가 나타나고, 약 20K 근방에서 3차원 정렬이 일어남을 확인했습니다. NMR을 통해 스핀 격자 완화율(1/T1)의 온도 변화를 측정하여 차원 교차와 마그논 기여를 정밀하게 분석했습니다.", "implication": "AgCrP2S6가 저차원 반강자성체와 3차원 질서 사이의 전이를 연구할 수 있는 우수한 반데르발스 플랫폼임을 입증했습니다.", "novelty": "준-1차원 자성체에서 나타나는 스핀 동역학을 미시적 프로브(NMR)로 직접 추적하고 차원 교차의 구체적인 메커니즘을 제시했습니다. 112 계열 telluride 등을 연구하는 귀하 nd noise measurements. We identify a series of distinct Chern insulators spanning a broad and continuous range of doping densities incommensurate with the underlying moir\\'e lattice; the states exhibit current-induced broadband noise and memory effects as well as pronounced gate hysteresis. Systematic magnetic field, temperature and gate dependence studies further support the emergence of a spontaneously charge-ordered state that acts as a parental state for the observed Chern insulators. The absence of Chern insulators at nearby integer fillings also distinguishes the observed state from the reported reentrant or extended quantum (anomalous) Hall states. Altogether, our results establish experimental evidence of AHCs in mRG and open the door for further exploration of the collective dynamics in this new state of matter.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Experimental evidence for anomalous Hall crystals in moiré graphene, relevant to Berry curvature.", "tags": ["experiment", "graphene", "moire", "anomalousHall", "Berrycurvature", "transport", "Chern"], "image": "https://arxiv.org/static/browse/0.3.4/images/arxiv-logo-fb.png", "briefing": {"background": "모아레(moire) 초격자 구조를 가진 2차원 물질은 강한 전자 상관관계와 밴드 구조 변조를 통해 분수 양자 홀 효과, Chern 절연체 등 다양한 양자 상태를 구현할 수 있어 현대 응집물질 물리학의 핵심 연구 대상입니다.", "motivation": "이론적으로 예측된 '이상 홀 결정(AHC)' 상태가 모아레 마름모꼴 그래핀(mRG)에서 관찰되는 Chern 절연체 현상을 설명할 수 있을 것으로 기대되었으나, 이를 직접 증명할 실험적 증거가 부족하여 이를 규명하고자 했습니다.", "result": "전기 수송 측정과 노이즈 분석을 통해, 모아레 격자와 비공약(incommensurate) 관계를 갖는 도핑 영역에서도 Chern 절연체 특성이 나타남을 확인했습니다. 특히 전류 유도 노이즈, 메모리 효과, 게이트 이력 현상 등을 통해 AHC가 Chern 절연체의 모태 상태로 존재함을 실험적으로 입증했습니다.", "implication": "자발적인 전하 결정화가 어떻게 양자화된 홀 효과를 생성하는지에 대한 이해를 높였으며, 향후 강상관 전자계에서 새로운 집단적 양자 동역학을 연구하는 기반이 될 것입니다.", "novelty": "Berry 곡률이 큰 모아레 그래핀에서 자발적 전자 결정화와 위상학적 성질의 결합을 직접적으로 증명했다는 점에서 중요합니다. 특히 Berry 곡률과 위상학적 상태를 추적하는 연구자들에게 매우 흥미로운 발견입니다.", "unresolved": "AHC와 관련된 전하 정렬의 미세한 공간적 구조와, 왜 특정 도핑 범위에서만 이러한 상태가 더 뚜렷하게 발현되는지에 대한 구체적인 메커니즘은 추가 연구가 필요합니다.", "future_work": "AHC 상태에서의 집단적 들뜸(collective excitations) 연구 및 이 상태를 제어하기 위한 외부 변수(전기장, 변형률 등)의 영향에 대한 후속 실험이 기대됩니다.", "concepts": [{"term": "이상 홀 결정 (Anomalous Hall Crystal)", "why_emerged": "외부 자기장 없이도 자발적인 전자 질서(결정화)를 통해 홀 효과를 생성하는 상태를 설명하기 위해 필요했습니다.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "Chern 절연체, Wigner 결정, 베리 곡률(Berry curvature)"}, {"term": "모아레 마름모꼴 그래핀 (mRG)", "why_emerged": "그래핀 층간 적층 각도에 따른 모아레 무늬가 전자 밴드 구조를 변조하여 강상관 현상을 유도하기 위해 사용됩니다.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "뒤틀린 이중층 그래핀(TBG), 플랫 밴드(Flat band)"}], "english_summary": ["Experimental identification of anomalous Hall crystals in moiré rhombohedral graphene.", "The system exhibits quantized Hall effects without an external magnetic field, driven by spontaneous charge ordering.", "Combined transport and noise measurements confirm the emergence of a parental state for observed Chern insulators.", "Results distinguish this phase from standard reentrant quantum Hall states."]}}, {"title": "Field-free transverse response in altermagnet and topological insulator heterojunctions (Mater. Quantum. Technol. (2026))", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2611.04937", "authors": "Bijay Kumar Sahoo, Abhiram Soori", "last_authors": "Bijay Kumar Sahoo, Abhiram Soori", "summary": "We theoretically investigate the transport properties of a topological insulator (TI) connected to two-dimensional altermagnetic (AM) leads in the absence of an external magnetic field. Exploiting the intrinsic time-reversal symmetry breaking of altermagnets, we report the emergence of a field-free transverse differential conductivity in the resulting AM-TI-AM heterostructure. Our analysis reveals that this transverse response is highly sensitive to the orientation of the N\\'eel vector: a finite transverse conductivity manifests when the N\\'eel vector possesses an out-of-plane component, whereas it strictly vanishes for in-plane orientations ($\\theta = \\pi/2$) under symmetric chemical potentials ($\\mu_t = \\mu_b$) due to the restoration of symmetry between the $k_y$ and $-k_y$ momentum channels. Conversely, when asymmetric chemical potentials are applied ($\\mu_t \\neq \\mu_b$), this symmetry is broken, yielding a finite transverse response even for an in-plane N\\'eel vector. Furthermore, we demonstrate that while the longitudinal differential conductivity exhibits Fabry-P\\'erot-type oscillations as a function of the TI's chemical potential, the transverse conductivity displays a distinct antisymmetric dependence. Notably, the oscillatory behavior of the longitudinal conductivity persists even at finite temperatures. Spatially, the transverse current contribution decays exponentially with position inside the TI region. We also find that both the longitudinal and transverse differential conductivities exhibit periodic oscillations with the junction parameter $\\chi_t=\\chi_b$. These findings provide a fundamental understanding of field-free transverse responses in spin-momentum locked surface states, highlighting the potential of AM-TI heterojunctions for next-generation spintronic applications.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Combines altermagnetism and topological insulator transport relevant to spintronics and experimental interpretation.", "tags": ["altermagnet", "topological-insulator", "transport"], "image": "https://arxiv.org/html/2611.04937v2/Schem_AMTI.jpg", "briefing": {"background": "알터마그넷(Altermagnet)은 기존의 강자성체나 반강자성체와 달리, 시간 반전 대칭성이 깨져있으면서도 순 자기 모멘트가 0인 새로운 자기 정렬 상태로, 스핀트로닉스 분야에서 큰 주목을 받고 있습니다.", "motivation": "위상 절연체(TI)와 알터마그넷(AM)을 접합했을 때, 외부 자기장 없이도 스핀-운동량 잠김(spin-momentum locking) 현상을 활용한 비자성 트랜스버스 수송 특성을 이론적으로 예측하고자 했습니다.", "result": "AM-TI-AM 접합에서 알터마그넷의 Nèel 벡터 방향에 따라 외부 자기장 없이도 횡방향(transverse) 미분 전도도가 나타남을 보였습니다. 특히 Nèel 벡터가 면 외(out-of-plane) 성분을 가질 때 횡방향 응답이 극대화됨을 입증했습니다.", "implication": "알터마그넷의 고유한 대칭성 파괴를 이용하면 에너지 소모가 적고 외부 자기장이 필요 없는 고효율 스핀 소자 설계가 가능함을 시사합니다.", "novelty": "기존 스핀트로닉스 소자가 강한 외부 자기장을 필요로 했던 한계를 넘어, 알터마그넷의 내재적 스핀 텍스처를 활용해 위상 절연체 표면 상태의 수송을 제어했다는 점이 독창적입니다.", "unresolved": "이론적 모델에서 가정된 이상적인 접합부의 경계면 상태가 실제 실험적으로 제작된 헤테로 구조에서 얼마나 정밀하게 구현될 수 있는지에 대한 물리적 검증이 필요합니다.", "future_work": "실제 실험에서 알터마그넷 박막을 위상 절연체 위에 증착하여 횡방향 저항을 측정하는 실험이 필수적입니다.", "concepts": [{"term": "알터마그넷 (Altermagnet)", "why_emerged": "순 자기 모멘트 없이도 밴드 구조 내의 스핀 분할을 구현하여 자기적 기능성을 소자에 통합하기 위해 필요했습니다.", "origin": "최근 2-3년 내 이론적으로 급부상, 초록 정보만으로는 특정자 명시 어려움", "connections": "반강자성체, 시간 반전 대칭성 파괴, 비상호성 수송"}, {"term": "스핀-운동량 잠김 (Spin-Momentum Locking)", "why_emerged": "위상 절연체 표면에서 전자의 스핀과 운동량 방향이 고정되어 후방 산란이 억제되는 현상을 설명하기 위해 제안되었습니다.", "origin": "2D 위상 절연체 및 Bi2Se3 등 연구에서 2000년대 후반 확립", "connections": "위상 절연체, 표면 상태, 라쉬바 효과(Rashba effect)"}], "english_summary": ["Theoretical investigation of field-free transverse response in altermagnet-topological insulator heterojunctions.", "The transverse conductivity is controlled by the orientation of the Nèel vector and chemical potential asymmetry.", "The study demonstrates potential for spin-momentum locked transport without external magnetic fields.", "Results provide a blueprint for next-generation spintronic devices utilizing altermagnetic materials."]}}, {"title": "From Growth to Devices: Oxygen-Controlled Superconductivity in BSCCO Thin Films", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2611.14231", "authors": "Sohini Guin, Ramesh Kumar Guin, Pankaj Bhardwaj, Laxmipriya Nanda, Rajib Sarkar, Dhavala Suri", "last_authors": "Rajib Sarkar, Dhavala Suri", "summary": "Realizing device-compatible high-$T_c$ superconductors requires simultaneous control of oxygen stoichiometry and tolerance to nanofabrication. Here, we investigate sputtered Bi$_2$Sr$_2$Ca$_{n-1}$Cu$_n$O$_{2n+4+\\delta}$ (BSCCO) thin films and establish a direct link between annealing conditions, oxygen incorporation, and superconducting transport. By independently varying the annealing temperature and duration, we identify an optimal annealing condition of $860\\,^{\\circ}$C for 3\\,h, which yields the highest superconducting transition temperature and the narrowest transition among the investigated samples. X-ray diffraction, electron microscopy, and X-ray photoemission spectroscopy reveal a non-monotonic evolution of lattice oxygen, which governs hole doping in the CuO$_2$ planes and produces the characteristic dome-like dependence of $T_c$ on doping concentration. We further translate these optimized films into micro-devices to assess fabrication-induced effects, via micro-bridges as well as a planar Josephson junction. We demonstrate devices fabricated via both lift-off and focused ion beam (FIB) patterning methods -- proving the fabrication compatibility of these films. Importantly, we demonstrate their air-stability for extended periods of time (2 months). The combined insights offer practical guidelines for integrating cuprate thin films into superconducting electronics and quantum device architectures.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Experimental study of cuprate superconductivity, uses photoemission, relevant to unconventional superconductivity.", "tags": ["experiment", "cuprates", "superconductivity", "photoemission", "transport"], "image": "https://arxiv.org/html/2611.14231v1/Fig1_R.png", "briefing": {"background": "고온 초전도체인 BSCCO는 강력한 물리적 특성에도 불구하고 박막 제작 및 산소량 제어가 어려워 소자 응용에 한계가 있었습니다.", "motivation": "산소 함량에 따라 초전도 특성이 민감하게 변하는 BSCCO 박막을 안정적으로 제작하고, 나노 공정(nanofabrication)을 견딜 수 있는 최적의 성장 조건을 찾고자 했습니다.", "result": "860도에서 3시간 동안의 어닐링이 최적의 초전도 전이 온도와 좁은 전이 폭을 제공함을 확인했습니다. 또한, 이 박막으로 만든 마이크로 브릿지 및 조셉슨 접합 소자가 2개월 이상 공기 중에서 안정적으로 작동함을 증명했습니다.", "implication": "BSCCO 박막의 상용화 가능성을 높였으며, 양자 소자 아키텍처에 고온 초전도체 박막을 통합할 수 있는 표준화된 가이드라인을 제시했습니다.", "novelty": "단순한 박막 성장을 넘어 실제 소자 공정 호환성과 장기적인 공기 안정성을 입증했다는 점에서 응용 물리학적 가치가 매우 높습니다.", "unresolved": "CuO2 평면 내의 구체적인 국소 도핑 균일도와 나노 공정 시 발생하는 국소적 산소 결함 문제에 대한 정밀 분석이 추가로 필요합니다.", "future_work": "이러한 고품질 박막을 이용한 Josephson 소자의 위상학적 연구나 초전도 큐비트 소자로의 응용이 뒤따를 것으로 보입니다.", "concepts": [{"term": "산소 화학양론 (Oxygen Stoichiometry)", "why_emerged": "고온 초전도체에서 캐리어(홀) 농도를 결정하는 핵심 요소로서, 초전도 전이 온도 Tc를 제어하기 위해 반드시 정밀하게 제어되어야 합니다.", "origin": "Cuprate 연구 초기(1980년대 후반)부터 중요성 확립", "connections": "도핑(Doping), CuO2 평면, 상전이(Phase transition)"}, {"term": "조셉슨 접합 (Josephson Junction)", "why_emerged": "초전도체 사이의 위상 차를 통해 전하가 터널링하는 현상을 이용해 초정밀 자기장 센서(SQUID)나 양자 소자를 만들기 위해 개발되었습니다.", "origin": "Brian Josephson, 1962년 예측", "connections": "초전도성, 위상 일관성(Phase coherence), 양자 간섭"}], "english_summary": ["Establishment of growth protocols for oxygen-controlled BSCCO thin films.", "Identified optimal annealing conditions to achieve high superconducting transition temperatures.", "Demonstrated compatibility with nanofabrication and long-term air stability for electronic devices.", "Provides a practical pathway for integrating cuprate superconductors into quantum architectures."]}}, {"title": "Hidden Coherence and Controlled Quasihole Motion in a Fermionic Laughlin State on a Superconducting Quantum Processor", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2611.10687", "authors": "Kui Zhao, Hao Wu, Lei-Yi-Nan Liu, et al.", "last_authors": "Jian Cui, Heng Fan", "summary": "Fractional quantum Hall (FQH) states support fractionalized excitations and geometric phases, yet experimentally resolving the many-body coherence encoded in their wave functions remains challenging. Here, we prepare a three-electron $\\nu=1/3$ Laughlin state on the Haldane sphere using seven superconducting qubits and reconstruct its many-body density matrix. Through Read's composite-boson construction, we reveal vortex-dressed coherence that remains appreciable over a larger separation range than electron coherence. The extended profile is suppressed in a Fock-diagonal reference constructed from the measured populations, demonstrating its dependence on off-diagonal many-body coherence. We further prepare a one-flux-added quasihole and characterize its fractional charge response against finite-size benchmarks. Controlled quasihole motion yields an effective geometric-phase signature from the reconstructed dominant-eigenstate trajectory. These complementary measurements provide microscopic access to the coherent structure and quasihole response of a finite fermionic Laughlin state, demonstrating an experimental route to probing strongly correlated FQH wave functions on programmable quantum processors.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Experimental study of fractional quantum Hall physics on a quantum platform; relevant to correlated systems.", "tags": ["quantum-hall", "strongly-correlated", "quantum-simulation"], "image": "https://arxiv.org/html/2611.10687v2/fig1_laughlin_21923.png", "briefing": {"background": "분수 양자 홀(FQH) 효과는 강한 전자 상관관계로 인해 나타나는 위상학적 상태로, 분수 전하와 통계적 성질을 가지는 준입자(quasihole)를 포함합니다. 그러나 실제 실험에서 이들의 다체 파동함수와 코히런스를 직접 관측하는 것은 매우 어렵습니다.", "motivation": "초전도 큐비트 기반 양자 프로세서를 이용해 Haldane 구(sphere) 위의 Laughlin 상태를 재현하고, 기존 물리 실험에서 접근하기 어려웠던 다체 파동함수의 코히런스 구조와 준입자의 동역학적 특성을 직접 탐구하고자 합니다.", "result": "7개의 초전도 큐비트를 이용해 $\\nu=1/3$ Laughlin 상태를 구현하고 밀도 행렬을 재구성했습니다. Read의 복합 보존 구성을 통해 전자 코히런스보다 더 넓게 퍼져 있는 보텍스-드레스드 코히런스를 확인했으며, 준입자를 인위적으로 생성하여 기하학적 위상 및 분수 전하 응답 특성을 측정했습니다.", "implication": "프로그래밍 가능한 양자 프로세서가 복잡한 강상관 양자 상태(FQH)를 시뮬레이션하고 그 내부 정보를 마이크로 단위로 추출하는 강력한 도구가 될 수 있음을 보여줍니다.", "novelty": "이론적으로만 다루어지던 FQH 파동함수의 다체 코히런스 구조를 실험적으로 직접 재구성했다는 점이 핵심입니다. 사용자 관심 분야인 강상관 전자계의 위상학적 성질을 양자 컴퓨팅 플랫폼에서 검증했다는 점에서 의의가 있습니다.", "unresolved": "현재는 7큐비트 규모의 유한한 시스템에 국한되어 있어, 실제 물질에서의 열역학적 극한으로의 확장 가능성과 잡음이 다체 위상에 미치는 영향은 여전히 숙제입니다.", "future_work": "더 큰 규모의 시스템으로 확장하여 더 높은 위상 차수의 상태를 구현하고, 양자 오류 정정 환경에서 이러한 위상 상태의 안정성을 테스트할 것으로 예상됩니다.", "concepts": [{"term": "Laughlin 상태", "why_emerged": "분수 양자 홀 효과의 미시적 파동함수를 설명하기 위해 도입되었습니다.", "origin": "Robert Laughlin (1983년 제안).", "connections": "분수 전하, 위상학적 질서, 차노스-시몬스 이론과 연결됨."}, {"term": "Haldane 구", "why_emerged": "유한한 크기의 시스템에서 주기적 경계 조건을 구현하고, 횡방향 운동량 보존을 다루기 위해 필요합니다.", "origin": "F. D. M. Haldane (1983년 제안).", "connections": "토로이달 경계 조건과 더불어 양자 홀 효과의 수치적 시뮬레이션에서 표준으로 사용됨."}, {"term": "다체 코히런스", "why_emerged": "단일 입자가 아닌 시스템 전체의 양자 얽힘과 비국소적 상관관계를 이해하기 위해 도입되었습니다.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "양자 정보 이론, 밀도 행렬 재구성(Quantum State Tomography)과 연결됨."}], "english_summary": ["Realized a fractional quantum Hall Laughlin state on a 7-qubit superconducting processor.", "Used density matrix reconstruction to reveal long-range vortex-dressed coherence.", "Demonstrated controlled quasihole motion and captured the geometric phase signature.", "Validates quantum processors as a platform for probing strongly correlated many-body wavefunctions."]}}, {"title": "Hidden interfacial magnetism in RuO2 heterostructures revealed by a superconducting spin switch", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2611.13579", "authors": "Tetsuma Mandokoro, Hisakazu Matsuki, Shutaro Karube, et al.", "last_authors": "F. Sebastian Bergeret, Teruo Ono", "summary": "RuO$_2$, once the flagship altermagnetic candidate, is now believed to be nonmagnetic in the bulk, yet weak, static and spatially inhomogeneous magnetism emerges at its surfaces and interfaces. Where this magnetism resides, what stabilises it, and whether it is connected to these states remain open questions. Here we address these questions at the Nb/RuO$_2$ interface using a superconducting spin switch. A GdN/Nb/RuO$_2$ trilayer allows interfacial exchange-field alignment to tune the superconducting transition temperature of Nb, probing interfacial magnetism inaccessible to conventional magnetometry. The switch reveals a hidden magnetic subsystem, which we attribute to a thin RuO$_x$ redox layer formed as Nb scavenges oxygen from RuO$_2$. This layer behaves as a weak and magnetically hard ferromagnet with vacancy-induced anisotropy. Furthermore, supercurrent amplifies the switching efficiency, making the probe sensitivity tunable in situ. Superconducting spin switches thus emerge as a quantitative low-temperature probe of hidden magnetism at buried interfaces.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Addresses altermagnetism/RuO2 interfacial physics using superconducting probes, highly relevant to electronic properties.", "tags": ["material", "topic"], "image": "https://arxiv.org/static/browse/0.3.4/images/arxiv-logo-fb.png", "briefing": {"background": "RuO2는 한때 알터자성(altermagnetism)의 대표 후보 물질로 주목받았으나, 실제 벌크에서는 자성이 없다는 사실이 밝혀지며 표면이나 계면에서의 기원 불명 자성에 대한 연구가 중요해졌습니다.", "motivation": "Nb/RuO2 계면에서 나타나는 약하고 불균일한 자성의 기원을 밝히고, 이것이 기존 자력계로 측정하기 어려운 buried interface에서 어떻게 발현되는지 탐구하고자 합니다.", "result": "초전도 스핀 스위치를 사용하여 RuO2 계면의 자성을 탐측했습니다. Nb가 RuO2로부터 산소를 포획하여 형성된 RuOx 산화층이 국소적인 강자성체 역할을 하며, 이것이 계면 자성의 근본 원인임을 밝혀냈습니다.", "implication": "숨겨진 계면 자성을 초전도체 근접 효과를 통해 정밀하게 제어하고 측정할 수 있음을 입증했습니다. 이는 스핀트로닉스 소자 설계 시 계면 제어의 중요성을 시사합니다.", "novelty": "기존 자력계가 감지하지 못하는 buried interface의 자성을 초전도 스핀 스위치라는 양자 감응형 도구로 밝혀냈습니다. 알터자성 연구의 혼란을 정리하고 계면 공학적 접근을 제시했습니다.", "unresolved": "RuOx 층의 산소 결함 구조와 형성 메커니즘이 정확히 어떻게 자성을 유도하는지에 대한 원자 수준의 정밀한 모델은 추가 연구가 필요합니다.", "future_work": "다양한 전이금속 산화물 계면으로 확장하여 산소 포획을 통한 계면 자성 엔지니어링 및 스핀트로닉스 소자 최적화 실험이 기대됩니다.", "concepts": [{"term": "알터자성 (Altermagnetism)", "why_emerged": "자성체 분류에서 반강자성도 강자성도 아닌 새로운 대칭성을 가진 자성 상태를 기술하기 위해 필요합니다.", "origin": "최근 수년간 체계화됨 (J. Železný 등).", "connections": "비교차적 스핀 분할, 베리 곡률, 이상 홀 효과와 연결됨."}, {"term": "초전도 스핀 스위치", "why_emerged": "계면의 스핀 상태 변화를 초전도 전이 온도 변화로 민감하게 검출하기 위해 고안되었습니다.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "초전도 근접 효과, 조셉슨 접합, 스핀 밸브와 연결됨."}], "english_summary": ["Investigated interfacial magnetism in Nb/RuO2 heterostructures using superconducting spin switches.", "Identified a RuOx redox layer formed by oxygen scavenging as the source of hidden interfacial magnetism.", "Demonstrated that superconducting spin switches act as sensitive probes for buried magnetic interfaces.", "Clarifies the nature of 'hidden' magnetism in the previously claimed altermagnetic candidate RuO2."]}}, {"title": "Hybridization-brightened interlayer excitons in multilayer WSe2 controlled by sliding ferroelectricity", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2611.13264", "authors": "Youngki Yeo, Idan Kizel, Dror Hershkovitz, et al.", "last_authors": "Jing-Yang You, Moshe Ben Shalom", "summary": "Interlayer excitons (IXs) combine spatially separated electron and hole wavefunctions with electrically tunable dipole moments, but their reduced wavefunction overlap generally limits optical emission, particularly for high-energy states. Here we report a bright, spectrally narrow high-energy interlayer exciton (h-IX) near 2.23 eV in few-layer WSe2 and investigate how its optical activity evolves with layer number and sliding-ferroelectric polarization. In pristine 2H-WSe2, we observe thickness-dependent brightening of high-energy exciton emission. GW-BSE calculations reveal mixed intralayer and interlayer configurations with enhanced optical weight, suggesting that multilayer hybridization contributes to the observed brightening. In parallel-stacked 3L/3L WSe2 containing a sliding-ferroelectric interface, the h-IX exhibits polarization-dependent energies and Stark responses that distinguish Pup and Pdown domains. Electric-field-driven domain-wall motion produces hysteretic transfer of spectral weight between the two h-IX branches, enabling optical tracking of ferroelectric switching. These results establish multilayer hybridization as a route to optically active high-energy interlayer excitons and sliding ferroelectricity as a complementary degree of freedom for controlling their energy, dipole and emission.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Experimental study on 2D materials (WSe2) and ferroelectricity, within the user's scope of van der Waals materials.", "tags": ["WSe2", "ferroelectricity", "excitons"], "image": " . Haverkort, L. H. Tjeng", "summary": "We performed temperature-dependent X-ray absorption spectroscopy (XAS) and X-ray magnetic circular dichroism (XMCD) measurements on the disordered phase of Ba$_3$CoNb$_2$O$_9$ to determine the local electronic structure of the Co$^{2+}$ ions. We employed the line-fitting inverse partial fluorescence yield (iPFY) method to obtain reliable spectra from this insulating material. From the comparison between the experimental spectra and full multiplet cluster calculations we were able to constrain the local crystal-field environment and assess the spin-orbit-entangled nature of the Co$^{2+}$ ground state. In this chemically disordered system, the Co$^{2+}$ ions retain on average an effectively cubic crystal-field environment that supports a $J_\\mathrm{eff} = 1/2$ ground state. These results further establish that Ba$_3$CoNb$_2$O$_9$ is a promising platform for investigating the effect of disorder on $J_\\mathrm{eff} = 1/2$ magnetism.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Spectroscopic study (XMCD) of electronic structure and J_eff magnetism in a real material.", "tags": ["experiment", "spectroscopy", "electronicstructure", "magnetism", "stronglycorrelated"], "image": "https://arxiv.org/html/2611.14072v1/struc_geo.png", "briefing": {"background": "강상관 전자계에서 3d 전이금속 화합물은 스핀-궤도 결합(SOC)과 결정장(Crystal Field)의 상호작용으로 인해 흥미로운 자기적 바닥 상태를 나타냅니다. 특히 Co2+ 이온은 고스핀 상태에서 국소적인 전자 구조에 따라 다양한 자기적 성질을 보입니다.", "motivation": "화학적으로 무질서한(disordered) 페로브스카이트 구조인 Ba3CoNb2O9 시스템에서 Co2+ 이온의 국소 전자 구조와 자기적 바닥 상태를 규명하고자 함.", "result": "XAS와 XMCD 측정을 통해 Co2+가 대략적인 입방(cubic) 결정장 내에 존재하며, J_eff = 1/2 상태를 형성하고 있음을 입증함.", "implication": "Ba3CoNb2O9 시스템이 무질서가 J_eff = 1/2 자성에 미치는 영향을 연구하기 위한 유망한 플랫폼임을 확인.", "novelty": "iPFY 방법론을 통해 시료의 무질서함에도 불구하고 신뢰성 있는 분광 데이터를 확보하였으며, 다체 문제에 기반한 클러스터 계산으로 이를 검증함.", "unresolved": "화학적 무질서가 국소적인 스핀 물리량에 미치는 정확한 공간적 분포와 상호작용은 추가 연구가 필요함.", "future_work": "도핑이나 외부 변수를 통한 무질서의 제어 및 그에 따른 자기적 전이 현상 연구.", "concepts": [{"term": "XMCD", "why_emerged": "원소 선택적으로 자기 모멘트의 성분(궤도 및 스핀)을 분리하여 측정하기 위해 필요함.", "origin": "Schütz et al. (1987)에 의해 실험적으로 확립됨.", "connections": "XAS 분광학, 자기 이방성 연구, 전자 구조 계산."}, {"term": "J_eff = 1/2", "why_emerged": "강한 스핀-궤도 결합을 가진 시스템에서 궤도와 스핀이 얽혀 형성되는 효과적인 1/2 자유도를 이해하기 위해 도입됨.", "origin": "Kim et al. (2008)의 Sr2IrO4 연구에서 널리 알려짐.", "connections": "스핀-궤도 모트 절연체, Kitaev 물질, 위상 자성체."}], "english_summary": ["Investigated the local electronic structure of Co2+ in Ba3CoNb2O9 using XAS and XMCD.", "Confirmed a J_eff = 1/2 ground state within an effectively cubic crystal-field environment.", "Demonstrated that chemical disorder does not preclude the emergence of J_eff physics.", "Establishes this material as a viable platform for studying disorder in quantum magnets."]}}, {"title": "Magnetization-free quantum anomalous Hall effect in altermagnetic weak topological insulators (Phys. Rev. B)", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2611.13508", "authors": "Yanmiao Han, Yu-Hao Wan, Peng-Yi Liu, Rundong Zhao, Qing-Feng Sun", "last_authors": "Rundong Zhao, Qing-Feng Sun", "summary": "The quantum anomalous Hall (QAH) effect is usually realized through ferromagnetism or magnetic dop ing, which limits material choices and often results in low mobility, disorder sensitivity, and low operating temperatures. Here, we propose a mechanism to achieve the QAH phase without net magnetization, using altermagnetic exchange on a weak topological insulator (WTI). The altermagnetic order selectively gaps the Dirac cone at the Z point, while hybridization between the top and bottom surfaces of the WTI thin film opens a trivial gap at the point, generating a Chern number C = 1 phase with a single chiral edge channel. We verify the topological transition through both a minimal thin-film model and a slab geometry, and compute the associated Hall response. As altermagnets and layered WTIs already exist experimentally, this mechanism offers a promising a {"title": "Particle-hole asymmetry and a fluctuating pair-density-wave state in a lightly doped Mott insulator on the square lattice", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2611.14101", "authors": "Hao-Xin Wang, Zheng-Yuan Yue, Wen-Yuan Liu, Zheng-Cheng Gu", "last_authors": "Wen-Yuan Liu, Zheng-Cheng Gu", "summary": "Whether a lightly doped Mott insulator on the square lattice supports robust d d -wave superconductivity remains a central question in strongly correlated physics and in the microscopic theory of cuprate superconductivity. Experiments and numerical studies reveal a pronounced particle–hole asymmetry, pointing to a delicate competition among d d -wave superconductivity, pair-density-wave (PDW), stripe, charge-density-wave (CDW), and antiferromagnetic correlations. Here we combine large-scale density-matrix renormalization group (DMRG) and finite-size projected entangled pair states (PEPS) to study the square-lattice t t - J J model at low doping, δ ≤ 0.1 \\delta\\leq 0.1 , while tuning the next-nearest-neighbor hopping t ′ t^{\\prime} from the electron-like ( t ′ > 0 t^{\\prime}>0 ) to the hole-like ( t ′ < 0 t^{\\prime}<0 ) regime. We uncover a pronounced particle-hole-asymmetric reorganization of the low-energy state. The electron-like side supports robust, nearly uniform d d -wave pairing, whereas decreasing t ′ t^{\\prime} induces a period-two plaquette modulation and ultimately produces, on the hole-like side, a charge-dominated state with a strongly suppressed static pairing amplitude. This evolution is supported by DMRG calculations on open strips and PEPS calculations on open square lattices up to 16 × 16 16\\times 16 sites that preserve C 4 C_{4} symmetry at the Hamiltonian level. On these squares, both methods find that the pair correlations of the hole-like state select the plaquette momenta ( π , 0 ) (\\pi,0) and ( 0 , π ) (0,\\pi) and decay within a few lattice spacings, while the dominant charge-density modulation forms a bidirectional checkerboard whose period extrapolates to about 4 ​ a 0 4a_{0} , close to that observed in lightly doped Bi-2201. These observations establish a fluctuating plaquette PDW in the lightly doped hole-like regime, in which local pairs carry finite momentum but lack phase coherence. Our results firmly establish particle-hole asymmetry as a central organizing principle for competing pairing tendencies in the lightly doped t t - J J model. The suppression of uniform pairing on the hole-like side further motivates investigating whether material-specific processes (such as extended Cu-O molecular-orbital dynamics beyond a strict Zhang-Rice singlet description, correlated hopping, and lattice coupling) enhance pair mobility and global superconducting coherence.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Theory of cuprate superconductivity, CDW, and PDW, highly relevant to strongly correlated systems.", "tags": ["theory", "cuprates", "superconductivity", "CDW", "stronglycorrelated"], "image": "https://arxiv.org/html/2611.14101v1/pairing_sector_summary_schematic_candidate_v2.png", "briefing": {"background": "구리 산화물 고온 초전도체는 도핑된 모트 절연체로서, 초전도 현상과 전하 밀도 파(CDW), 스핀 밀도 파 등이 복잡하게 얽혀 있음. 특히 정공-입자 비대칭성이 물성 이해의 핵심임.", "motivation": "t-J 모델을 사용하여 정공 도핑된 모트 절연체에서 입자-정공 비대칭성에 따른 초전도성과 전하 질서의 경쟁 기작을 규명하고자 함.", "result": "입자-정공 비대칭성에 따라 전자 측은 d-wave 초전도성이 견고하지만, 정공 측은 전하 위주의 checkerboard 질서와 파동성 쌍 밀도 파(PDW)가 우세함을 발견함.", "implication": "Bi-2201과 같은 실제 물질에서 관찰되는 전하 질서 현상이 강한 상관관계에 의한 PDW 요동과 밀접함을 이론적으로 뒷받침함.", "novelty": "DMRG와 PEPS를 결합하여 16x16 격자 규모에서 C4 대칭성을 유지하며 PDW의 존재를 입증함.", "unresolved": "물질 특이적인 전하 이동이나 격자 커플링이 어떻게 PDW를 안정화하고 초전도성을 강화하는지에 대한 상세한 미시적 과정.", "future_work": "보다 현실적인 Hubbard 모델에 가까운 Hamiltonian으로 확장하여 물질별 전이온도 차이 규명.", "concepts": [{"term": "Pair-Density-Wave (PDW)", "why_emerged": "초전도 쌍(Cooper pair)이 유한한 운동량을 가져 공간적으로 변조된 질서를 설명하기 위해 제안됨.", "origin": "초록 정보만으로는 특정하기 어려움 (Agterberg, Berg 등 2000년대 후반 연구로 유명).", "connectio bital states and orbital hybridization in quantum materials.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Excellent experimental spectroscopic visualization of orbital states in a quantum magnetic material.", "tags": ["experiment", "electronic-structure", "magnetism"], "image": "https://arxiv.org/static/browse/0.3.4/images/arxiv-logo-fb.png", "briefing": {"background": "Ising 자성체는 강한 자기 이방성으로 인해 1차원적인 스핀 거동을 보이는 물질군입니다. Ca3Co2O6는 삼각형 격자 구조 내에 Co 이온이 두 가지 다른 국소 환경(팔면체 및 삼각기둥)을 가지며, 이로 인해 나타나는 복잡한 자기적 정렬과 궤도 상태의 기원은 현대 응집물질물리학에서 중요한 연구 대상입니다.", "motivation": "기존의 결정장 이론(CEF)만으로는 Co 이온의 궤도 상태와 이방성을 완벽히 설명할 수 없다는 한계가 있었기에, 이를 실공간에서 직접 시각화하여 전자 상태의 국소적 성질을 규명하고자 했습니다.", "result": "싱크로트론 X-선 회절과 원자가 전자 밀도(VED) 분석을 통해 삼각기둥 부위의 Co 3d 상태가 CEF 효과 외에 Co 3d-O 2p-Co 4p 하이브리드화에 의해 크게 영향을 받음을 확인했습니다.", "implication": "단순한 모델링을 넘어 실공간에서 오비탈 하이브리드화를 시각화할 수 있음을 입증했으며, 향후 복잡한 양자 자성체 연구의 실험적 벤치마크로 활용될 것입니다.", "novelty": "VED 분석을 통해 고정밀 실공간 오비탈 분포를 도출한 점이 핵심이며, 이는 전자 구조를 직접 관측하는 본 독자의 관심사와 맞닿아 있습니다.", "unresolved": "이번 분석이 실온 또는 저온에서의 특정 자기 상태를 완벽히 대변하는지에 대한 정밀한 온도 의존성 비교는 추가 연구가 필요합니다.", "future_work": "다양한 온도 및 자기장 조건에서의 VED 분석을 수행하여 자기 상전이 전후의 전자 상태 변화를 추적할 것으로 예상됩니다.", "concepts": [{"term": "Valence Electron Density (VED)", "why_emerged": "물질 내 결합 전자와 오비탈의 실공간 분포를 실험적으로 도출하기 위해 필요함.", "origin": "X-선 회절 분석법의 발전과 함께 고도화됨.", "connections": "전자 밀도 함수 이론(DFT) 결과와 직접 비교되는 정량적 도구."}, {"term": "Crystal Electric Field (CEF)", "why_emerged": "이온 주위의 이웃 이온들이 만드는 전기장이 중심 이온의 오비탈 에너지 준위를 분리하는 효과를 설명하기 위함.", "origin": "Hans Bethe (1929).", "connections": "하이브리드화 효과, 스핀-오비탈 결합."}], "english_summary": ["Direct real-space visualization of Co 3d states in Ca3Co2O6 using VED analysis.", "Identified distinct orbital characters for octahedral and trigonal-prismatic Co sites.", "Demonstrated that CEF effects alone are insufficient to describe the observed anisotropy.", "Confirmed the importance of ligand-mediated Co 3d-O 2p-Co 4p hybridization.", "Establishes a robust methodology for probing , "last_authors": "Jeil Jung, Hongki Min", "summary": "Extending moir\\'{e} graphene beyond twisted bilayers, helical trilayer graphene has emerged as a supermoir\\'{e} platform hosting topological bands and correlated electronic states. Here we establish a domain-resolved framework for helical multilayer graphene that links supermoir\\'{e} relaxation to low-energy electronic structure and valley topology. Real-space lattice calculations show that relaxation reconstructs the system into locally periodic single-moir\\'{e} domains, enabling a local continuum description. Within each domain, downfolding the first-shell model yields effective Hamiltonians near the Dirac points that reveal how the low-energy spectrum decomposes into folded Dirac sectors. The resulting valley Chern topology is domain-dependent and includes gate-tunable responses, as independently corroborated by real-space lattice calculations. Our results identify folded Dirac sectors as the organizing principle of thicker helical graphene stacks, with local stacking families determining the band character and valley topology.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Detailed study on moire systems and topology, relevant to user's broader interest in topological materials.", "tags": ["graphene", "moire", "topological"], "image": "https://arxiv.org/html/2604.19608v2/Fig1.png", "briefing": {"background": "다층 그래핀 시스템은 뒤틀림(twist)을 통해 모아레 패턴을 만들고, 이를 통해 위상학적 밴드나 강상관 현상을 제어할 수 있는 플랫폼을 제공합니다. 헬리컬 다층 그래핀은 이러한 초모아레(super-moiré) 물성을 연구하는 확장된 형태입니다.", "motivation": "헬리컬 다층 그래핀에서 나타나는 격자 이완이 국소적인 모아레 도메인을 형성하고, 이것이 시스템의 전반적인 밸리 위상학에 어떤 영향을 미치는지 이해하고자 했습니다.", "result": "시스템이 국소적으로 주기적인 단일 모아레 도메인으로 재구성됨을 보였으며, 각 도메인 내의 '접힌 디락 섹터(folded Dirac sectors)'가 위상학적 밸리 Chern 수를 결정하는 조직 원리임을 규명했습니다.", "implication": "다층 그래핀의 복잡한 밴드 구조를 제어할 수 있는 물리적 기전을 제공하며, 게이트 조절을 통한 위상학적 스위칭 가능성을 보여줍니다.", "novelty": "단순 적층 구조가 아닌 초모아레 시스템에서의 밸리 위상학적 구조를 도메인 단위로 체계화한 점이 학술적 가치가 큽니다.", "unresolved": "도메인 경계에서의 전자 산란이 수송 특성에 구
