<title>Daily Paper Slideshow</title>
<style>
  :root {
    color-scheme: light;
    --bg: #f6f7f4;
    --paper: #ffffff;
    --ink: #111827;
    --muted: #64748b;
    --line: #d8ddd2;
    --accent: #176b87;
    --accent-2: #9a3412;
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; overflow: auto; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: var(--bg); color: var(--ink); }
  .shell { max-width: 1500px; min-height: 100vh; margin: 0 auto; padding: 14px 18px; display: flex; flex-direction: column; }
  .topbar { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 16px; }
  .top-actions { display: flex; align-items: center; gap: 10px; }
  .topbar a, button { border: 1px solid var(--line); border-radius: 8px; background: var(--paper); color: var(--ink); padding: 10px 14px; font-weight: 700; text-decoration: none; cursor: pointer; }
  button.primary { background: var(--accent); border-color: var(--accent); color: white; }
  button:disabled { opacity: 0.45; cursor: not-allowed; }
  .counter { color: var(--muted); font-weight: 700; }
  .slide { min-height: calc(100vh - 82px); background: var(--paper); border: 1px solid var(--line); border-radius: 10px; padding: 18px; box-shadow: 0 18px 42px rgba(15, 23, 42, 0.10); display: grid; grid-template-columns: minmax(310px, 0.86fr) minmax(0, 1.55fr); gap: 18px; overflow: visible; }
  .paper-head { min-width: 0; min-height: 0; overflow: visible; display: flex; flex-direction: column; gap: 12px; }
  .figure { margin: 0; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: #f8fafc; }
  .figure img { display: block; width: 100%; max-height: 41vh; object-fit: contain; background: white; }
  .figure figcaption { padding: 7px 10px; color: var(--muted); font-size: 12px; line-height: 1.3; }
  .head-text { display: flex; flex-direction: column; gap: 9px; min-width: 0; }
  .badges { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .badge { border-radius: 999px; padding: 5px 9px; background: #eef2ff; color: #3730a3; font-size: 12px; font-weight: 800; }
  .score { background: #fee2e2; color: #991b1b; }
  h1 { margin: 0; font-size: 25px; line-height: 1.15; letter-spacing: 0; overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
  h1 a { color: inherit; text-decoration-color: rgba(23, 107, 135, 0.35); text-decoration-thickness: 2px; text-underline-offset: 4px; }
  h1 a:hover { color: var(--accent); text-decoration-color: var(--accent); }
  .meta, .authors, .why, .abstract { font-size: 13px; line-height: 1.45; }
  .meta, .authors { color: var(--muted); }
  .why strong, .abstract strong, .authors strong { color: var(--ink); }
  .authors { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .why { border-left: 4px solid var(--accent-2); padding-left: 10px; color: #374151; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .abstract { border-top: 1px solid var(--line); padding-top: 14px; color: #374151; }
  .original-abstract { border-top: 1px solid var(--line); padding-top: 10px; color: #374151; font-size: 11.5px; line-height: 1.35; overflow-wrap: anywhere; }
  .original-abstract strong { display: block; margin-bottom: 4px; color: var(--ink); }
  .tags { display: flex; flex-wrap: wrap; gap: 8px; }
  .tag { border-radius: 999px; padding: 4px 8px; background: #f1f5f9; color: #475569; font-size: 12px; font-weight: 700; }
  .head-text > .link { display: none; }
  .briefing { min-width: 0; min-height: 0; overflow: visible; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); grid-auto-rows: minmax(0, auto); align-content: start; gap: 11px 18px; border-top: 0; padding-top: 0; }
  .brief-section { min-width: 0; }
  .brief-section.wide { grid-column: 1 / -1; }
  .brief-section h2 { margin: 0 0 4px; font-size: 14px; line-height: 1.22; color: #0f766e; letter-spacing: 0; }
  .brief-section p, .brief-section li { margin: 0; font-size: 12.5px; line-height: 1.42; color: #1f2937; overflow-wrap: anywhere; }
  .brief-section ul { margin: 0; padding-left: 20px; }
  .concepts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 9px 14px; }
  .concept { border-top: 1px solid var(--line); padding-top: 7px; }
  .concept h3 { margin: 0 0 4px; font-size: 13px; color: #7c2d12; letter-spacing: 0; }
  .concept p { margin: 2px 0 0; font-size: 11.5px; line-height: 1.35; color: #374151; overflow-wrap: anywhere; }
  .concept b { color: #111827; }
  .link { color: var(--accent); font-weight: 800; text-decoration: none; }
  .empty { padding: 48px; background: var(--paper); border: 1px solid var(--line); border-radius: 12px; color: var(--muted); }
  @media (max-width: 860px) {
    .shell { padding: 14px; }
    .topbar, .top-actions { align-items: stretch; flex-direction: column; }
    .slide, .briefing, .concepts { grid-template-columns: 1fr; }
    .slide { min-height: auto; overflow: visible; display: grid; }
    h1 { font-size: 28px; }
  }
</style>

const slides = [{"title": "Pressure tuning of electronic correlations and flat bands in CsCr3Sb5", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/pqbc-87xb", "authors": "Maria Chatzieleftheriou, Jonas B. Profe, Ying Li, Roser Valentí", "last_authors": "Ying Li, Roser Valentí", "summary": "${\\mathrm{CsCr}}_{3}{\\mathrm{Sb}}_{5}$ is a newly identified strongly correlated kagome superconductor, characterized by non-Fermi-liquid behavior at elevated temperatures and intertwined charge and spin density wave order below ${T}_{\\text{DW}}≈54\\phantom{\\rule{0.222222em}{0ex}}\\mathrm{K}$. Under e…", "tier": "A_MUST_READ", "score": "10", "reason": "Direct hit on kagome metal research; explores correlations and electronic order in a 135 variant.", "tags": ["experiment", "kagome", "CsCr3Sb5", "flatband"], "image": "", "briefing": {"background": "AV3Sb5 계열의 kagome 금속은 강한 전자 상관관계와 밴드 구조의 특이성(flat band, van Hove singularity)으로 인해 초전도성, CDW, TRSB 등 복잡한 양자 현상이 나타나는 핵심 연구 대상입니다.", "motivation": "CsCr3Sb5는 최근 발견된 신규 kagome 초전도체로, 기존 AV3Sb5와 비교하여 d-전자 기반의 강한 전자 상관관계가 어떻게 기저 상태(CDW/SDW 등)를 제어하는지 규명하는 것이 본 연구의 목적입니다.", "result": "압력 변화를 통해 전자 상관관계와 flat band의 위치를 조절할 수 있음을 보였으며, 비-페르미 액체 거동과 intertwined된 전하/스핀 밀도파 질서의 경쟁 및 공존 양상을 확인했습니다.", "implication": "kagome 격자에서의 전자 상관관계가 초전도성과 질서 변수들에 미치는 영향력을 이해함으로써, 향후 고온 초전도 및 위상 물질 제어를 위한 물질 설계 모델을 제공합니다.", "novelty": "AV3Sb5의 바나듐 기반 화합물과 차별화되는 크롬(Cr) 기반 시스템에서의 압력 의존성을 체계적으로 연구하여 3d 전이금속 kagome 물질군으로 연구 범위를 확장했습니다.", "unresolved": "초전도성과 CDW/SDW 사이의 정확한 미시적 상관관계 및 상전이 메커니즘이 완전히 밝혀지지 않았습니다.", "future_work": "압력하에서의 고해상도 ARPES 측정 및 도핑을 통한 전자 구조 변화를 통해 상관관계 에너지를 보다 정밀하게 분리하는 실험이 필요합니다.", "concepts": [{"term": "Flat Band", "why_emerged": "에너지 분산이 거의 없는 밴드는 상태 밀도를 극대화하여 전자 상관관계 효과를 증폭시키기 위해 필요합니다.", "origin": "Kagome 격자 기하학 구조에서 비롯되는 일반적인 물리적 결과입니다.", "connections": "고온 초전도성, 분수 양자 홀 효과, Moiré superlattice 등과 연관됩니다."}, {"term": "Intertwined Order", "why_emerged": "단일 질서 변수가 아닌 여러 질서가 서로 얽혀 상전이 거동을 결정하는 복잡성을 설명하기 위해 등장했습니다.", "origin": "Fradkin, Kivelson 등이 고온 초전도체 연구에서 제안한 개념입니다.", "connections": "CDW, 스핀 밀도파, 초전도 질서가 경쟁하거나 공존하는 시스템에서 흔히 사용됩니다."}], "english_summary": ["Explores electronic correlations in the new kagome superconductor CsCr3Sb5.", "Identifies non-Fermi-liquid behavior and intertwined CDW/SDW orders.", "Demonstrates pressure tuning of flat bands and electronic phases.", "Extends the understanding of correlated kagome metals beyond vanadium-based systems."]}}, {"title": "Tunable electron-plasmon coupling in the layered transition metal dichalcogenide ZrSe2−xTex", "journal": "PRB_Recent", "source": "author whitelist", "link": "http://link.aps.org/doi/10.1103/mkfk-8k2t", "authors": "Tongrui Li, Yuzhe Wang, Haoyuan Yan, et al.", "last_authors": "Donglai Feng, Juan Jiang", "summary": "Electron-plasmon coupling, in which carriers are dressed by collective electronic oscillations, represents an important many-body interaction in solids. Here, using angle-resolved photoemission spectroscopy, we report the tunable electron-plasmon coupling in the layered transition metal dichalcogeni…", "tier": "A_MUST_READ", "score": "10", "reason": "author whitelist: Donglai Feng", "tags": ["angle-resolvedphotoemission", "photoemission"], "image": "", "briefing": {"background": "고체 내에서 전하 운반자가 격자의 집단적 들뜸인 플라즈몬과 상호작용하는 것은 전자 산란 및 에너지 손실의 중요한 메커니즘이며, 이를 이해하는 것은 다체 물리학의 핵심 과제입니다.", "motivation": "층상 구조의 전이금속 디칼코게나이드(TMD) 시스템에서 전자-플라즈몬 결합의 강도를 물리적으로 튜닝하고, 이를 직접적인 분광학적 방법으로 관찰하고자 했습니다.", "result": "ARPES를 사용하여 ZrSe2-xTex 물질군에서 조성(x)을 조절함으로써 전자와 플라즈몬 간의 결합 강도가 체계적으로 변함을 직접 관측했습니다.", "implication": "TMD 물질의 밴드 구조와 집단 들뜸 간의 상호작용을 제어함으로써 저차원 물질의 광학적, 전기적 물성을 인위적으로 엔지니어링할 수 있음을 시사합니다.", "novelty": "Donglai Feng 그룹의 정밀한 ARPES 기술을 통해 플라즈몬의 복제된 밴드와 강한 결합에 의한 스펙트럼 재정규화를 시각화하여 다체 상호작용의 정량적 해석을 제시했습니다.", "unresolved": "결합 강도 조절에 따른 초전도성이나 다른 위상학적 위상과의 구체적인 미시적 상관관계는 아직 논의의 여지가 있습니다.", "future_work": "시간 분해 ARPES(tr-ARPES)를 이용해 결합의 동역학적 변화를 추적하고 플라즈몬의 수명을 직접 측정할 필요가 있습니다.", "concepts": [{"term": "Electron-Plasmon Coupling", "why_emerged": "전자들이 집단적 진동에 의해 '드레스'되어 유효 질량과 산란율이 변하는 현상을 규명하기 위해 필요합니다.", "origin": "Pines와 Bohm의 고체 내 플라즈마 진동 연구에서 유래합니다.", "connections": "ARPES 스펙트럼에서 일명 'kink' 구조로 관찰되며, 포논-전자 결합과 유사한 다체 효과입니다."}], "english_summary": ["Studies tunable electron-plasmon coupling in layered ZrSe2-xTex using ARPES.", "Shows systematic regulation of interaction strength via chalcogen stoichiometry.", "Observes spectral signatures of strong coupling between quasiparticles and plasmons.", "Provides a foundation for engineering many-body interactions in vdW materials."]}}, {"title": "How to measure loop currents in scanning tunneling microscopy", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2607.20030", "authors": "Victoire Morisseau, Luke C. Rhodes, Peter Wahl, Carolina A. Marques", "last_authors": "Victoire Morisseau, Luke C. Rhodes, Peter Wahl, Carolina A. Marques", "summary": "The emergence of loop current phases, where spontaneous loops of orbital currents give rise to a weak local magnetic moments, has been proposed to exist in a number of quantum materials based on measurements that pick up weak signatures of time reversal symmetry breaking or small magnetic moment order. The most prominent example is as an explanation of the pseudogap phase on the underdoped side of the phase diagram of the high-temperature cuprate superconductors, but more recently, it has been proposed to occur in Kagome materials and at the surface layer of Sr$_2$RuO$_4$. Experimental results have, however, been inconclusive so far, some detecting signatures that can be understood as emerging due to loop current phases, whilst others have not detected any significant proof. One of the techniques that should be able to pick up local signatures of loop current orders is low temperature scanning tunneling microscopy and spectroscopy (STM/STS), however firm predictions of how to detect them are missing. Here, we provide specific predictions for how nt phases via STM.", "Predicts spectroscopic signatures of loop currents in square lattice materials.", "Highlights the role of spin-polarized STM in identifying local magnetic order.", "Offers guidance for resolving long-standing controversies in cuprates and kagome metals."]}}, {"title": "Proximity-induced charge transfer, strain and magnetic exchange in graphene/CrSBr heterostructure", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2607.20297", "authors": "Asish K. Kundu, Anil Rajapitamahuni, Niraj Aryal, et al.", "last_authors": "Jerzy T. Sadowski, Elio Vescovo", "summary": "Stacking van der Waals materials provides a powerful route to engineer emergent electronic and magnetic behaviors through proximity-driven interactions. The graphene/CrSBr heterostructure has emerged as a compelling platform in this frontier, exhibiting exotic macroscopic responses-- including uniaxial surface-plasmon-polariton propagation and an unconventional quantum Hall effect-- indicative of strong interfacial electronic and magnetic coupling. However, a microscopic electronic landscape governing these phenomena has remained elusive. Here, we provide a comprehensive spectroscopic characterization of the graphene/CrSBr interface using a combination of angle-resolved photoemission spectroscopy (ARPES), low-energy electron microscopy (LEEM), and density functional theory. We resolve a massive redistribution of interfacial charge that concurrently hole dopes graphene and populates the quasi-one-dimensional spin-polarized conduction band of CrSBr, resulting insulator-to-metal transition in the interfacial CrSBr layer. Furthermore, electronic structure of CrSBr exhibits strong momentum-dependent renormalization distinct from conventional charge doping, and theoretical modeling supported by Raman spectroscopy points to additional interfacial compressive strain. In addition, ARPES reveals a splitting-like feature in the graphene Dirac cone consistent with spin de ed": "강자성도 반강자성도 아닌, 대칭성 기반의 비자성 보상 스핀 분리를 설명하기 위해 최근 도입되었습니다.", "origin": "2020년대 초반 이론적으로 확립된 개념입니다.", "connections": "반강자성 스핀트로닉스, 스핀 분리 밴드 구조와 연결됩니다."}, {"term": "Weyl Semimetal", "why_emerged": "밴드 교차점이 위상적으로 보호된 전하를 띠는 점(Weyl node)으로 존재하는 금속상을 설명하기 위해 도입되었습니다.", "origin": "2011년경 Wan 등에 의해 이론화되었습니다.", "connections": "Berry 곡률, 비정상 홀 효과와 직접적인 관련이 있습니다."}], "english_summary": ["Proposes the realization of Weyl semimetal phases in 2D altermagnetic materials.", "Uncovers the emergence of the quantum crystal valley Hall effect.", "Connects the unique symmetry of altermagnets to nontrivial topological band structures.", "Offers a theoretical framework for controlling topological states via magnetic order."]}}, {"title": "Enhancement of metallicity by Na doping in La3Ni2O7+δ", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/fcwr-3jrg", "authors": "Yingying Gao, W. Zhou, W. H. Guo, et al.", "last_authors": "Yinzhong Wu, B. Qian", "summary": "The observation of $\\mathrm{high}\\text{−}{T}_{\\mathrm{c}}$ superconductivity in bilayer nickelate ${\\mathrm{La}}_{3}{\\mathrm{Ni}}_{2}{\\mathrm{O}}_{7}$ under high pressure provides a new venue for exploring novel unconventional superconductors and elucidating the mechanism of $\\mathrm{high}\\text{−}{T…", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Experimental study of nickelate bilayer superconductors (high-Tc).", "tags": ["nickelate", "superconductivity", "material"], "image": "", "briefing": {"background": "La3Ni2O7은 고압 환경에서 고온 초전도성이 발견된 이후, 니켈계 초전도체(nickelates)의 기제 규명을 위한 핵심 물질로 부상했습니다.", "motivation": "나트륨(Na) 도핑을 통해 La3Ni2O7의 전자 구조와 전도성을 조절함으로써 초전도성 발현 기제를 최적화하고자 합니다.", "result": "Na 도핑이 시스템의 금속성을 강화하며, 도핑 정도에 따라 전자 구조의 변화가 유도됨을 확인했습니다.", "implication": "화학적 치환(도핑)을 통해 고압 니켈레이트의 상도를 제어할 수 있음을 보여주며, 이는 초전도 임계온도 제어의 실마리가 됩니다.", "novelty": "고압 물리라는 물리적 제약 외에도 화학적 도핑을 결합하여 니켈레이트의 전자 상태를 계통적으로 연구했다는 점이 독창적입니다.", "unresolved": "나트륨 도핑이 구체적으로 페르미면(Fermi surface)을 어떻게 재구성하는지, 그리고 그것이 초전도 쌍 결합에 미치는 정량적 효과는 미지수입니다.", "future_work": "ARPES를 이용한 전자 구조 직접 관측 및 도핑에 따른 초전도 특성 변화의 상도를 확립하는 실험이 필요합니다.", "concepts": [{"term": "La3Ni2O7", "why_emerged": "구리 기반 초전도체(cuprate)와 유사한 전자 구조를 가진 니켈 기반 초전도체를 찾기 위한 노력의 일환으로 연구됩니다.", "origin": "2023년 고압에서 고온 초전도성이 보고되면서 본격화되었습니다.", "connections": "이중층(bilayer) 구조, 3d-9 전자 구성을 가집니다."}, {"term": "Metallicity", "why_emerged": "초전도 현상이 강한 금속적 상태에서 발현하는 경우가 많아, 전하 이동 특성을 평가하기 위해 사용됩니다.", "origin": "응집물질 물리학의 전통적인 전도성 개념입니다.", "connections": "페르미 액체 이론, 밴드 점유율과 연결됩니다."}], "english_summary": ["Studies the effect of Na doping on the metallic properties of La3Ni2O7.", "Demonstrates chemical tuning of electronic states in bilayer nickelates.", "Provides an experimental approach to modulate the superconducting environment.", "Contributes to the ongoing search for high-Tc mechanisms in nickel-based compounds."]}}, {"title": "Generalized framework of ferroelectric controlled nonlinear Hall effect driven by Berry curvature dipole", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/ynq7-hzc7", "authors": "Zhenyu Lu, Xiaoliang Xiao, Xingyu Yue, Jin-Zhu Zhao, Rui-Chun Xiao, Yuanjun Jin", "last_authors": "Rui-Chun Xiao, Yuanjun Jin", "summary": "The nonlinear Hall effect has emerged as an essential field in condensed matter physics for its connection with the properties of quantum geometry and its potential application in electronic devices. However, when the nonlinear Hall current scales quadratically with a single driving electric field, …", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Topic relevant to Berry curvature and transport in topological semimetals.", "tags": ["Berrycurvature", "Halleffect", "topology"], "image": "", "briefing": {"background": "비자성 물질에서도 베리 곡률 쌍극자(Berry curvature dipole)를 통해 나타나는 비선형 홀 효과는 양자 기하학적 특성을 프로빙하는 강력한 도구입니다.", "motivation": "단일 외부 전기장에 대해 전류가 이차 비례(quadratic)하는 비선형 홀 효과를 강유전성 제어를 통해 일반화된 프레임워크로 체계화하고자 합니다.", "result": "강유전성 스위칭이 베리 곡률 쌍극자를 조정 ce to AHE and graphene interests.", "tags": ["topological", "phonon", "graphene", "anomalousHall"], "image": "", "briefing": {"background": "최근 그래핀 등에서 발견된 이상 홀 결정(Anomalous Hall Crystal)은 전자의 강한 상관관계에 의해 유도된 복잡한 양자 상태입니다.", "motivation": "이상 홀 결정 위상에서 나타나는 격자 진동(포논)이 가지는 위상적 성질을 규명하여, 전자 구조와 격자 결합 간의 새로운 물성을 찾고자 합니다.", "result": "이상 홀 결정 내에서 포논이 위상적 특성을 가질 수 있음을 이론적으로 도출하고 그 특징적인 신호를 제시했습니다.", "implication": "이상 홀 결정의 존재를 증명하기 위한 직접적인 수단으로 포논 스펙트럼 측정을 활용할 수 있는 이론적 기반을 마련했습니다.", "novelty": "이상 홀 결정이라는 전자적인 위상과 포논이라는 격자 위상의 결합을 통해, 기존에 잘 연구되지 않았던 '위상적 포논'의 가능성을 제시했습니다.", "unresolved": "실제 실험에서 이러한 위상적 포논 신호가 전자-포논 결합의 크기에 의해 얼마나 강하게 관찰될 수 있을지는 불확실합니다.", "future_work": "비탄성 중성자 산란이나 레이저 분광법 등을 통해 이 이론적 예측을 실제 이상 홀 결정 후보 물질에서 확인하는 작업이 필요합니다.", "concepts": [{"term": "Anomalous Hall Crystal (AHC)", "why_emerged": "그래핀 다층 구조에서 전자의 상호작용으로 인해 자발적으로 생성되는 시간 역전 대칭성 깨짐 상태를 설명하기 위함입니다.", "origin": "최근 뫼아레 그래핀 연구 흐름 속에서 등장.", "connections": "Chern 절연체, 이상 홀 효과, 강한 상관관계."}, {"term": "Topological phonons", "why_emerged": "전자 시스템에서 위상적 성질이 격자 진동으로 전이되어 전도 현상이나 열전도에 영향을 미치는 물리 현상을 다루기 위해 필요합니다.", "origin": "최근 위상 물성 물리학의 발전과 함께 체계화됨.", "connections": "위상 절연체, Berry 곡률, 비상호적 포논 수송."}], "english_summary": ["Explores topological phonons within anomalous Hall crystals in graphene structures.", "Proposes phonons as a potential experimental signature for AHC phases.", "Connects electronic correlations and topological order with lattice dynamics.", "Suggests that topological phonon properties can serve as a diagnostic tool for emergent electronic lattices."]}}, {"title": "Toward a unified description of valley polarization in two-dimensional tetragonal altermagnets driven by strain and in-plane magnetization", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/f58d-vqf9", "authors": "Bo Huang, Churen Gui, Ao Zhang, et al.", "last_authors": "Hongxing Li, Wei-Bing Zhang", "summary": "Altermagnetism provides a promising platform for valleytronics application 가 정확히 어떤 비아벨 상태(예: Pfaffian vs Anti-Pfaffian)인지에 대한 미시적 기작과 준입자의 통계적 성질을 직접 증명하는 실험은 부족합니다.", "future_work": "저온 환경에서의 비아벨 상태 특성 확인을 위한 간섭 측정(interferometry) 실험 및 수치적 밀도 행렬 재규격화군(DMRG) 계산이 필요합니다.", "concepts": [{"term": "비아벨 준입자", "why_emerged": "양자 정보의 위상학적 보호와 비국소적 저장을 위해 도입되었습니다.", "origin": "Moore와 Read(1991), Nayak과 Wilczek(1996)에 의해 이론적으로 정립되었습니다.", "connections": "Majorana fermion, Chern insulator, 분수 통계와 연결됩니다."}, {"term": "란다우 준위(Landau Level)", "why_emerged": "자기장 하에서 하전 입자의 에너지가 양자화되는 현상을 기술하기 위해 필요합니다.", "origin": "Lev Landau(1930).", "connections": "양자 홀 효과, 사이클로트론 운동, 자기성 물성과 연결됩니다."}], "english_summary": ["Discovery of even-denominator fractional quantum Hall states in ABA trilayer graphene.", "Evidence for non-Abelian quasiparticle potential in the zeroth Landau level.", "Challenges conventional limits on FQHE states in graphene-based systems.", "Provides a platform for engineering topological phases through layer engineering."]}}, {"title": "Heavy-Fermion Phase Diagram in Magic-Angle Twisted Trilayer Graphene", "journal": "PRL_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/zzks-vkl2", "authors": "Le Zhang, Wenqiang Zhou, Xinjie Fang, et al.", "last_authors": "Yi-feng Yang, Shuigang Xu", "summary": "The interplay between localized magnetic moments and itinerant electrons gives rise to exotic quantum states in condensed matter systems. Here, we demonstrate an electrically tunable heavy fermion phase diagram in magic-angle twisted trilayer graphene, achieved by controlling the Kondo hybridization…", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Significant correlated moire system experimental study.", "tags": ["graphene", "moire", "heavy_fermion"], "image": "", "briefing": {"background": "강상관 전자계에서 국소적 자기 모멘트와 이동성 전자의 상호작용은 근본적인 물성 연구 주제입니다. 특히 모아레 그래핀 시스템은 이러한 상호작용을 외부 게이트 전압으로 미세 조정할 수 있는 이상적인 시험대입니다.", "motivation": "마법 각도(magic-angle)로 비틀린 삼중층 그래핀(MATTG)에서 나타나는 다양한 강상관 위상 간의 위상 도표를 이해하고, 특히 중페르미온(heavy-fermion) 물성의 ture interests.", "tags": ["experiment", "densitywave", "ruthenate"], "image": "", "briefing": {"background": "전이금속 산화물, 특히 루테늄 산화물(ruthenate)은 스핀, 전하, 격자 자유도가 강하게 얽혀 있는 시스템으로, 초전도와 자기적 질서가 공존하는 복잡한 위상 연구의 핵심 소재입니다.", "motivation": "Ba4Ru3O10은 단순히 자기 절연체로 알려져 있었으나, 이 물질의 구조적/열역학적 불일치를 해결하고 숨겨진 밀도파(density-wave) 상태가 존재하는지 확인하고자 합니다.", "result": "구조, 열역학, 수송 특성 측정 결과, 이 물질 내에 강하게 핀(pinned)된 밀도파 상태가 존재함을 발견했습니다.", "implication": "이전에 단순한 자기 물질로 여겨지던 계에서도 전자 밀도파와 같은 복잡한 질서가 존재할 수 있음을 시사하며, 루테늄 산화물 물성 분류를 수정해야 함을 의미합니다.", "novelty": "전자 구조 기반의 강상관 물질 연구로서, 특히 밀도파(CDW/SDW)와 자기 질서의 경쟁 및 공존을 추적하는 연구는 독자님의 주요 관심사와 일치합니다.", "unresolved": "밀도파의 형성 메커니즘과 이것이 루테늄 산화물의 페르미 면과 어떻게 연관되는지, 특히 비등방적인 전자 구조에서의 기작이 불분명합니다.", "future_work": "ARPES를 통한 밴드 갭 열림 관측과 RIXS를 통한 준입자 흥분 스펙트럼 분석이 필수적입니다.", "concepts": [{"term": "밀도파(Density-Wave)", "why_emerged": "페르미 면의 네스팅(nesting) 또는 상호작용에 의해 전자 밀도의 주기적 변조가 발생하는 기저 상태를 기술하기 위해 필요합니다.", "origin": "Peierls(1955)의 전하 밀도파 이론.", "connections": "CDW, SDW, 초전도 경쟁, 갭 형성 현상과 연결됩니다."}, {"term": "루테늄 산화물(Ruthenate)", "why_emerged": "강한 스핀-궤도 결합과 d-전자 상관관계가 공존하여 특이한 초전도 및 위상 물성을 보이기 때문에 주목받습니다.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "Sr2RuO4, Mott insulator, 스핀-궤도 결합과 연결됩니다."}], "english_summary": ["Discovery of hidden density-wave instability in the trimer ruthenate Ba4Ru3O10.", "Identifies correlated order in a material previously classified as a simple magnetic insulator.", "Demonstrates multi-modal signatures of density-wave formation.", "Challenges the conventional electronic structure understanding of trimer ruthenates."]}}, {"title": "High Temperature Ferromagnetism in Epitaxial Monolayers of Co-Doped Fe5GeTe2", "journal": "PRL_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/j5rj-f4w4", "authors": "Jules Courtin, Fatima Ibrahim, Davide Benettin, et al.", "last_authors": "Mairbek Chshiev, Frédéric Bonell", "summary": "Magnetic van der Waals materials have mainly been investigated in their bulk form or as few-layer fl  topological insulators in twisted MoTe2; very relevant to moire projects.", "tags": ["theory", "twistedMoTe2", "topologicalinsulator"], "image": "", "briefing": {"background": "트위스트된 2차원 물질(moire 시스템)은 전자 상관관계와 위상 수학적 특성이 결합하여 분수 양자 홀 효과와 같은 새로운 상태를 구현하는 실험의 장이 되고 있습니다.", "motivation": "최근 트위스트된 MoTe2에서 관측된 분수 위상 절연체(Fractional Topological Insulator) 후보 상태를 이론적으로 설명하고, 해당 시스템의 에지 상태를 분석하기 위해 연구되었습니다.", "result": "무질서와 상호작용이 존재하는 에지 이론을 통해 ν=4/3 분수 위상 절연체에서의 에지 상태가 대칭적으로 국소화(symmetric localization)됨을 밝혔습니다.", "implication": "실험에서 관측되는 물리적 신호들이 이론적인 에지 모드 특성과 일치함을 보여주며, 분수 위상 절연체 상태의 존재를 강하게 뒷받침합니다.", "novelty": "분수 위상 절연체라는 복잡한 다체 상태를 모아레 격자라는 제어 가능한 실험 플랫폼에서 해석하는 새로운 이론적 틀을 제공합니다.", "unresolved": "실제 실험상의 불균일성(disorder)이 전체 위상 상태의 안정성에 미치는 정량적 영향은 추가적인 모델링이 필요합니다.", "future_work": "보다 구체적인 수송 측정(transport measurement)과의 비교를 통해 본 이론의 예측을 검증하는 작업이 뒤따를 것입니다.", "concepts": [{"term": "분수 위상 절연체", "why_emerged": "분수 양자 홀 효과의 위상 수학적 특성과 일반 위상 절연체의 결합을 이해하기 위해 필요.", "origin": "초록 정보만으로는 특정하기 어려움 (강한 상관관계 위상 물리 분야).", "connections": "분수 양자 홀 효과, 에지 상태, 모아레 초격자."}, {"term": "에지 상태", "why_emerged": "위상 물질의 벌크와 경계면 사이의 전도 특성 차이를 이해하기 위해 도입됨.", "origin": "Haldane 및 Kane-Mele 모델에서 본격화.", "connections": "위상 절연체, 비가역적 수송, 홀 전도도."}], "english_summary": ["Develops a disordered edge theory for fractional topological insulators in twisted MoTe2.", "Identifies symmetric localization of edge states at the ν=4/3 filling factor.", "Provides a theoretical foundation for recent experimental signatures of FTI.", "Advances the understanding of correlated topological phases in moire superlattices."]}}, {"title": "Coherence-driven origin of metamagnetism in anisotropic heavy-fermion systems", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2607.20261", "authors": "Ewan Scott, Zheyu Wu, Theodore I. Weinberger, Alexander G. Eaton, Michal P. Kwasigroch", "last_authors": "Alexander G. Eaton, Michal P. Kwasigroch", "summary": "A number of heavy-fermion materials exhibit magnetic field-induced metamagnetism: on applying a field along the magnetic hard axis, the magnetization first rises gradually, then jumps abruptly once a critical field is reached. Despite decades of phenomenological modeling, the microscopic origin of the pronounced magnetic anisotropy underlying this behavior has remained unresolved. The same is true of a related, long-standing puzzle: an anomalous maximum in the hard-axis susceptibility versus temperature. Both are complicated in $5f$ compounds by the dual localized-itinerant character of the relevant electrons. Here we develop an analytic $c$--$f$ theory of magnetic anisotropy in heavy-fermion metamagnets, identifying the mixed susceptibility $\\chi_{\\rm cf}(T,h,p)$ as a single thermodynamic observable that unifies the anisotropic response across temperature, field, and pressure. We test this theory against primary and literature data for the heavy-fermion superconductor UTe$_2$, finding excellent quantitative agreement in the temperature, field, and pressure evolution of its magnetic anisotropy -- including a Kondo-coherence origin for the anomalous hard-axis susceptibility maximum, which we show is directly connected to the metamagnetic transition itself. Our results establish a general, microscopic, coherence-driven framework for anisotropic metamagnetism, applicable across the broad class of heavy-fermion compounds that display this phenomenology.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Microscopic theory of metamagnetism in heavy-fermion UTe2, relevant to strongly correlated systems.", "tags": ["theory", "heavyfermion", "unconventionalsuperconductivity", "stronglycorrelated"], "image": "https://arxiv.org/html/2607.20261v1/x1.png", "briefing": {"background": "중페르미온(heavy-fermion) 계는 5f 전자의 국소성(localized)과 비국소성(itinerant)의 이중적 특성으로 인해 강한 전자 상관관계를 나타냅니다. 메타자성(metamagnetism)은 자기장 하에서 자화율이 급격히 변하는 현상인데, 이 특이한 이방성의 미시적 기원은 오랜 기간 난제로 남아 있었습니다.", "motivation": "UTe2와 같은 강상관 초전도체에서 자기장 방향에 따른 메타자성 거동과 고온에서의 비정상적인 자화율 최대값을 통합적으로 설명할 수 있는 미시적 이론 프레임워크를 구축하고자 합니다.", "result": "c-f 혼성 자화율(mixed susceptibility)을 도입하여 온도, 자기장, 압력에 따른 메타자성을 단일한 열역학적 관측값으로 통합했습니다. 특히 Kondo 결맞음(coherence)이 메타자성 전이와 직접적으로 연결되어 있음을 밝혀냈습니다.", "implication": "다양한 중페르미온 화합물에서 관찰되는 비정상적인 이방성 자기 반응을 이해하는 일반적인 미시적 이론을 제공하며, UTe2 연구에 있어 중요한 물리적 해석의 근거가 됩니다.", "novelty": "기존의 현상론적 모델을 넘어, 5f 전자의 이중성을 고려한 해석적 c-f 이론을 통해 실험 데이터와 정량적 일치를 보였다는 점이 독보적입니다.", "unresolved": "이 이론이 UTe2 이외의 다른 복잡한 5f 계열 메타자성 물질에서 얼마나 범용적으로 정량적 예측력을 갖는지 추가 검증이 필요합니다.", "future_work": "본 모델을 다른 결정 구조나 다양한 d/f 전자계를 가진 강상관 물질에 적용하여 이방성 자성 기작을 일반화할 예정입니다.", "concepts": [{"term": "Kondo 결맞음", "why_emerged": "저온에서 국소 자성 모멘트가 전도 전자와 산란하며 형성되는 일관된 전자 상태를 설명하기 위해 필요합니다.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "Kondo 격자 모델, Heavy fermion 유효 질량 증가"}, {"term": "메타자성", "why_emerged": "특정 임계 자기장에서 시스템의 자기적 상태가 급격히 전이되는 현상을 기술하기 위해 필요합니다.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "Ising 시스템, 자기 이방성, 강상관 전자계"}], "english_summary": ["Develops a unified c-f theory for magnetic anisotropy in heavy-fermion metamagnets.", "Identifies Kondo coherence as the microscopic origin of anomalous hard-axis susceptibility.", "Achieves quantitative agreement with experimental data in UTe2 across temperature, field, and pressure.", "Provides a general framework for understanding metamagnetism in 5f-based correlated systems."]}}, {"title": "Collective phase modes in twisted d-wave superconducting bilayers", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2607.00662", "authors": "Yin Shi, Mengxian Zhao, Fei Yang, Miao Liu, Sheng Meng", "last_authors": "Miao Liu, Sheng Meng", "summary": "Twisted cuprate bilayers have been predicted to host high-temperature chiral $d+id'$ superconductivity, originating from higher-order Josephson coupling processes. In such two-dimensional superconducting systems, long-wavelength fluctuations in the phase of the superconducting order parameter constitute gapless collective modes and therefore remain significant even at zero temperature. Here, we perform a theoretical analysis of the low-energy phase fluctuations in twisted $d$-wave superconducting bilayers within a self-consistent harmonic approximation, systematically retaining Josephson coupling to all orders. We demonstrate that higher-order Josephson coupling processes lead to nontrivial modifications of the phase dynamics. The momentum-resolved summand of the relative-phase stiffness is nonzero even in the normal state because interlayer tunneling explicitly breaks the intralayer U(1) symmetry, but its momentum integral vanishes for the continuum dispersion. The relative-phase stiffness is smaller in the $d+id'$ phase than in the $d$-wave phase, while the overall-phase stiffness has the opposite behavior. Furthermore, phase fluctuations strongly soften the Josephson plasma frequency near a twist angle of $45^\\circ$ and also substantially reduce the Josephson critical current.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Investigation of phase fluctuations and Josephson coupling in twisted d-wave superconducting systems.", "tags": ["theory", "cuprates", "superconductivity", "twisted-bilayer"], "image": "https://arxiv.org/html/2607.00662v3/x1.png", "briefing": {"background": "뒤틀린(twisted) 2차원 층상 구조는 층간 상호작용의 변조를 통해 초전도 상태의 대칭성을 제어할 수 있는 플랫폼을 제공합니다. 특히 d-wave 초전도체는 위상 요동이 낮은 에너지 상태에 큰 영향을 미치므로 이들의 집단적 모드 연구가 중요합니다.", "motivation": "뒤틀린 구리 산화물(cuprate) 이중층에서 나타나는 고온 chiral d+id' 초전도성의 물리적 안정성과 위상 모드(phase modes)의 특성을 이해하고자 합니다.", "result": "조셉슨 결합(Josephson coupling)을 모든 차수로 고려하여 저에너지 위상 요동을 분석했습니다. 특히 위상 강성(phase stiffness)이 트위스트 각도에 따라 어떻게 변하는지, 그리고 위상 요동이 조셉슨 플라즈마 진동수를 어떻게 완화(softening)시키는지 밝혔습니다.", "implication": "뒤틀린 초전도 이중층에서 나타나는 위상적 초전도성의 안정성 및 수송 특성을 예측하는 물리적 기반을 마련했습니다.", "novelty": "기존의 저차 근사를 넘어 모든 차수의 조셉슨 결합을 포함하여 위상 역학의 비자명한 변화를 체계적으로 계산했습니다.", "unresolved": "실제 실험적 환경에서의 불순물이나 격자 불일치가 위상 강성에 미치는 구체적인 영향은 향후 과제입니다.", "future_work": "실제 뒤틀린 비스무트 계열(BSCCO) 등 고온 초전도체 박막을 이용한 조셉슨 접합 실험과의 정량적 비교가 필요합니다.", "concepts": [{"term": "Josephson coupling", "why_emerged": "두 초전도체 사이의 위상 차이에 의한 터널링 전류를 기술하기 위해 필요합니다.", "origin": "Brian Josephson, 1962", "connections": "초전도 양자 간섭 소자(SQUID), 위상 요동"}, {"term": "Phase stiffness", "why_emerged": "초전도 상태의 위상 위상차에 대한 시스템의 강성을 측정하여 초전도성을 정량화하기 위해 필요합니다.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "BKT 전이, 초유체 밀도"}], "english_summary": ["Investigates phase fluctuations in twisted d-wave superconducting bilayers.", "Analyzes higher-order Josephson coupling effects on collective phase modes.", "Demonstrates that phase fluctuations significantly soften Josephson plasma frequency near 45-degree twist.", "Provides theoretical insight into the stability and dynamics of chiral d+id' superconductivity."]}}, {"title": "Competing ferromagnetic and antiferromagnetic interactions in non-altermagnetic Ru1-xCrxO2", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2607.20298", "authors": "David T. Plouff, Nawsher J. Parvez, Subhash Bhatt, et al.", "last_authors": "Jonathan Gaudet, John Q. Xiao", "summary": "We investigate the proposal of hole doping RuO$_{2}$ via alloying with Cr ions to induce altermagnetism. Thin film samples of Ru$_{1-x}$Cr$_{x}$O$_{2}$ ($0 \\leq x \\leq 0.28$) were prepared by reactive magnetron co-sputtering on TiO$_{2}$ substrates, with epitaxial nature verified by X-ray diffraction and composition depth profiles determined by X-ray photoelectron spectroscopy combined with Ar etching. Neutron diffraction measurements of samples with $x = 0$ and $x = 0.23$ at low temperatures show no evidence of long-range altermagnetic order with spins oriented along the $c$-axis or within the $ab$-plane. In contrast, temperature dependent susceptibility measurements in samples with $x \\geq 0.16$ show a gradual downturn below $T\\approx20~$K, suggestive of antiferromagnetic interactions, although this coexists with ferromagnetic hysteresis and remnant magnetizati -range altermagnetic order.", "Finds coexistence of ferromagnetic CrO2 clusters and antiferromagnetic interactions.", "Suggests that Cr dopants remain localized rather than doping the Ru bands effectively."]}}, {"title": "Modern Approach to Orbital Hall Effect Based on Wannier Picture of Solids", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2604.08280", "authors": "Mirco Sastges, Insu Baek, Hojun Lee, Hyun-Woo Lee, Yuriy Mokrousov, Dongwook Go", "last_authors": "Yuriy Mokrousov, Dongwook Go", "summary": "The orbital Hall effect (OHE) and its key figure of merit, the orbital Hall conductivity (OHC), are central to the emerging field of orbitronics. The OHC is conventionally computed via Kubo linear response theory, where the orbital angular momentum (OAM) operator is approximated through atom-centered projections that retain only local contributions, discarding physically important itinerant components. Here, we present a rigorous framework for the OAM operator grounded in the modern theory of orbital magnetization, formulated in a Wannier function basis. Critically, this naturally introduces a hierarchy of non-local contributions to the OAM operator. In turn, this gives rise to an additional non-Kubo contribution to the OHC of purely geometric origin, absent in all atom-centered treatments. First-principles calculations across a diverse set of materials demonstrate that this term can constitute a significant fraction of the total OHC, with its omission leading to qualitatively incorrect predictions. Our framework provides a unified and numerically tractable approach to orbital transport and improves our understanding of the OAM in solids, allowing for a more precise estimation of various orbital effects in complex materials.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Theoretical framework for orbital Hall effect, important for understanding transport and magnetism.", "tags": ["theory", "orbitalHalleffect", "transport"   briefing.className = 'briefing';
  appendBriefSection(briefing, 'Background', b.background);
  appendBriefSection(briefing, 'Motivation', b.motivation);
  appendBriefSection(briefing, 'Result', b.result);
  appendBriefSection(briefing, 'Implication', b.implication);
  appendBriefSection(briefing, "Why it's important / Novelty", b.novelty);
  appendBriefSection(briefing, 'Unresolved Questions', b.unresolved);
  appendBriefSection(briefing, 'Expected Future Work', b.future_work);
  if (b.concepts && b.concepts.length) {
    const section = document.createElement('section');
    section.className = 'brief-section wide';
    section.appendChild(textEl('h2', '', 'Concepts / Terms'));
    const concepts = document.createElement('div');
    concepts.className = 'concepts';
    b.concepts.forEach(c => {
      const item = document.createElement('div');
      item.className = 'concept';
      item.appendChild(textEl('h3', '', c.term || 'Concept'));
      [['왜 생겼나: ', c.why_emerged], ['누가 만들었나: ', c.origin], ['연결되는 흐름: ', c.connections]].forEach(([label, text]) => { if (!text) return; const p = document.createElement('p'); const bold = textEl('b', '', label); p.appendChild(bold); p.append(text); item.appendChild(p); });
      concepts.appendChild(item);
    });
    section.appendChild(concepts);
    briefing.appendChild(section);
  }
  if (b.english_summary && b.english_summary.length) { const section = document.createElement('section'); section.className = 'brief-section wide'; section.appendChild(textEl('h2', '', 'English Summary')); const ul = document.createElement('ul'); b.english_summary.slice(0, 5).forEach(line => ul.appendChild(textEl('li', '', line))); section.appendChild(ul); briefing.appendChild(section); }
  slideEl.appendChild(briefing);
  counterEl.textContent = `${index + 1} / ${slides.length}`;
  prevBtn.disabled = index === 0;
  nextBtn.disabled = index === slides.length - 1;
}
prevBtn.addEventListener('click', () => { index = Math.max(0, index - 1); render(); });
nextBtn.addEventListener('click', () => { index = Math.min(slides.length - 1, index + 1); render(); });
document.addEventListener('keydown', event => { if (event.key === 'ArrowLeft') prevBtn.click(); if (event.key === 'ArrowRight') nextBtn.click(); });
render();
</script>
</body>
</html>
