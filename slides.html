<title>Daily Paper Slideshow</title>
<style>
  :root {
    color-scheme: light;
    --bg: #f6f7f4;
    --paper: #ffffff;
    --ink: #111827;
    --muted: #64748b;
    --line: #d8ddd2;
    --accent: #176b87;
    --accent-2: #9a3412;
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; overflow: auto; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: var(--bg); color: var(--ink); }
  .shell { max-width: 1500px; min-height: 100vh; margin: 0 auto; padding: 14px 18px; display: flex; flex-direction: column; }
  .topbar { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 16px; }
  .top-actions { display: flex; align-items: center; gap: 10px; }
  .topbar a, button { border: 1px solid var(--line); border-radius: 8px; background: var(--paper); color: var(--ink); padding: 10px 14px; font-weight: 700; text-decoration: none; cursor: pointer; }
  button.primary { background: var(--accent); border-color: var(--accent); color: white; }
  button:disabled { opacity: 0.45; cursor: not-allowed; }
  .counter { color: var(--muted); font-weight: 700; }
  .slide { min-height: calc(100vh - 82px); background: var(--paper); border: 1px solid var(--line); border-radius: 10px; padding: 18px; box-shadow: 0 18px 42px rgba(15, 23, 42, 0.10); display: grid; grid-template-columns: minmax(310px, 0.86fr) minmax(0, 1.55fr); gap: 18px; overflow: visible; }
  .paper-head { min-width: 0; min-height: 0; overflow: visible; display: flex; flex-direction: column; gap: 12px; }
  .figure { margin: 0; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: #f8fafc; }
  .figure img { display: block; width: 100%; max-height: 41vh; object-fit: contain; background: white; }
  .figure figcaption { padding: 7px 10px; color: var(--muted); font-size: 12px; line-height: 1.3; }
  .head-text { display: flex; flex-direction: column; gap: 9px; min-width: 0; }
  .badges { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .badge { border-radius: 999px; padding: 5px 9px; background: #eef2ff; color: #3730a3; font-size: 12px; font-weight: 800; }
  .score { background: #fee2e2; color: #991b1b; }
  h1 { margin: 0; font-size: 25px; line-height: 1.15; letter-spacing: 0; overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
  h1 a { color: inherit; text-decoration-color: rgba(23, 107, 135, 0.35); text-decoration-thickness: 2px; text-underline-offset: 4px; }
  h1 a:hover { color: var(--accent); text-decoration-color: var(--accent); }
  .meta, .authors, .why, .abstract { font-size: 13px; line-height: 1.45; }
  .meta, .authors { color: var(--muted); }
  .why strong, .abstract strong, .authors strong { color: var(--ink); }
  .authors { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .why { border-left: 4px solid var(--accent-2); padding-left: 10px; color: #374151; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .abstract { border-top: 1px solid var(--line); padding-top: 14px; color: #374151; }
  .original-abstract { border-top: 1px solid var(--line); padding-top: 10px; color: #374151; font-size: 11.5px; line-height: 1.35; overflow-wrap: anywhere; }
  .original-abstract strong { display: block; margin-bottom: 4px; color: var(--ink); }
  .tags { display: flex; flex-wrap: wrap; gap: 8px; }
  .tag { border-radius: 999px; padding: 4px 8px; background: #f1f5f9; color: #475569; font-size: 12px; font-weight: 700; }
  .head-text > .link { display: none; }
  .briefing { min-width: 0; min-height: 0; overflow: visible; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); grid-auto-rows: minmax(0, auto); align-content: start; gap: 11px 18px; border-top: 0; padding-top: 0; }
  .brief-section { min-width: 0; }
  .brief-section.wide { grid-column: 1 / -1; }
  .brief-section h2 { margin: 0 0 4px; font-size: 14px; line-height: 1.22; color: #0f766e; letter-spacing: 0; }
  .brief-section p, .brief-section li { margin: 0; font-size: 12.5px; line-height: 1.42; color: #1f2937; overflow-wrap: anywhere; }
  .brief-section ul { margin: 0; padding-left: 20px; }
  .concepts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 9px 14px; }
  .concept { border-top: 1px solid var(--line); padding-top: 7px; }
  .concept h3 { margin: 0 0 4px; font-size: 13px; color: #7c2d12; letter-spacing: 0; }
  .concept p { margin: 2px 0 0; font-size: 11.5px; line-height: 1.35; color: #374151; overflow-wrap: anywhere; }
  .concept b { color: #111827; }
  .link { color: var(--accent); font-weight: 800; text-decoration: none; }
  .empty { padding: 48px; background: var(--paper); border: 1px solid var(--line); border-radius: 12px; color: var(--muted); }
  @media (max-width: 860px) {
    .shell { padding: 14px; }
    .topbar, .top-actions { align-items: stretch; flex-direction: column; }
    .slide, .briefing, .concepts { grid-template-columns: 1fr; }
    .slide { min-height: auto; overflow: visible; display: grid; }
    h1 { font-size: 28px; }
  }
</style>

const slides = [{"title": "Encapsulation epitaxy of air-stable 2D superconductors for quantum circuits", "journal": "Nature", "source": "author whitelist", "link": "https://www.nature.com/articles/s41586-026-10865-1", "authors": "Xudong Zheng, Sameia Zaman, Kenan Zhang, et al.", "last_authors": "Joel Î-j. Wang, Jing Kong", "summary": "An ‘encapsulation epitaxy’ mechanism is used to grow air-stable, two-dimensional superconducting films at the interface of a 2D–3D hybrid substrate, holding promise for use in fabrication of superconducting quantum circuitry.", "tier": "A_MUST_READ", "score": "9", "reason": "author whitelist: Riccardo Comin", "tags": ["superconduct"], "image": "https://media.springernature.com/m685/springer-static/image/art%3A10.1038%2Fs41586-026-10865-1/MediaObjects/41586_2026_10865_Fig1_HTML.png", "briefing": {"background": "2D 초전도체는 양자 회로 및 차세대 전자 소자 구현을 위한 핵심 재료로 주목받고 있으나, 대부분의 2D 소재는 공기 중에서 쉽게 산화되거나 물리적 특성이 저하되는 불안정성 문제를 안고 있습니다.", "motivation": "성능 저하 없이 공기 중에서도 안정적인 2D 초전도 박막을 성장시키고, 이를 실제 양자 회로 공정에 직접 통합할 수 있는 새로운 결정 성장 방법론을 제시하고자 합니다.", "result": "연구진은 '봉인된 에피택시(encapsulation epitaxy)' 기법을 통해 2D-3D 하이브리드 기판 계면에서 공기 중에서도 안정한 2D 초전도 필름을 성장시키는 데 성공했습니다.", "implication": "이 방법을 통해 제조된 박막은 별도의 보호층 없이도 안정성을 유지하므로, 복잡한 양자 소자 제조 공정의 수율과 성능을 크게 높일 수 있을 것으로 기대됩니다.", "novelty": "기존의 복잡한 전사 공정 대신 계면 성장을 이용해 안정성을 확보했다는 점이 혁신적이며, 독자분이 관심을 가지는 2D 소재 기반 양자 물성 연구에 새로운 플랫폼을 제공합니다.", "unresolved": "현재는 특정 물질 조합에 대해 입증되었으며, 다양한 종류의 2D 초전도체 및 위상 물질로의 확장 가능성은 더 검토되어야 합니다.", "future_work": "이 기법으로 성장된 박막을 기반으로 한 큐비트(qubit) 또는 SQUID와 같은 실제 양자 소자의 제작 및 성능 최적화 연구가 이어질 것으로 보입니다.", "concepts": [{"term": "봉인된 에피택시 (Encapsulation Epitaxy)", "why_emerged": "박막 성장과 동시에 보호층을 형성하여 산소나 수분으로부터 민감한 소재를 보호하기 위해 고안되었습니다.", "origin": "본 연구에서 구체화된 성장 메커니즘임", "connections": "분자선 적층 성장(MBE), 반데르발스 이종접합 구조"}, {"term": "2D 초전도체", "why_emerged": "원자 층 수준의 극한의 얇은 두께에서 나타나는 초전도 현상을 연구하고 소형 양자 소자에 응용하기 위해 등장했습니다.", "origin": "1960년대 얇은 막 연구부터 시작되어 최근 NbSe2 등 단원자층 연구로 가속화됨", "connections": "Berezinskii-Kosterlitz-Thouless (BKT) 전이, Josephson 접합"}], "english_summary": ["Introduces an encapsulation epitaxy method for growing air-stable 2D superconducting films.", "The growth occurs at the interface of a 2D-3D hybrid substrate, protecting the material inherently.", "Aims to simplify the fabrication of robust superconducting quantum circuits.", "Offers a promising path for integrating sensitive 2D materials into practical quantum hardware."]}}, {"title": "Time-domain identification of distinct mechanisms for competing charge density waves in a rare-earth tritelluride", "journal": "Nature_Physics", "source": "author whitelist", "link": "https://www.nature.com/articles/s41567-026-03382-5", "authors": "Yifan Su, B. Q. Lv, Alfred Zong, et al.", "last_authors": "Eugene Demler, Nuh Gedik", "summary": "ErTe3 hosts two charge-density-wave orders and the origin of the weaker one remains unclear. Tracking its recovery after light excitation now points to nucleation and growth as the underlying mechanism.", "tier": "A_MUST_READ", "score": "9", "reason": "author whitelist: Nuh Gedik", "tags": ["STS", "chargedensitywave"], "image": "https://media.springernature.com/m685/springer-static/image/art%3A10.1038%2Fs41567-026-03382-5/MediaObjects/41567_2026_3382_Fig1_HTML.png", "briefing": {"background": "희토류 트리텔루라이드(RTe3)는 전하 밀도 파(CDW)가 발생하는 대표적인 층상 구조 물질로, 여러 CDW 상태가 서로 경쟁하거나 공존하는 복잡한 양자 상태를 연구하기에 적합한 시스템입니다.", "motivation": "ErTe3 소재에서 관찰되는 두 개의 CDW 오더 중, 상대적으로 약한 두 번째 CDW의 생성 기작이 명확하지 않아 이를 시분해(Time-domain) 관점에서 규명하고자 했습니다.", "result": "광 여기(light excitation) 이후 두 번째 CDW의 회복 과정을 추적한 결과, 해당 CDW가 '핵 생성 및 성장(nucleation and growth)' 메커니즘을 통해 회복됨을 확인하여 기존의 열적 변동 모델과 차별화된 결과를 얻었습니다.", "implication": "서로 경쟁하는 질서(competing orders) 사이의 동역학적 균형을 이해함으로써, 비평형 상태에서의 양자 물질 제어 가능성을 시사합니다.", "novelty": "시분해 측정을 통해 CDW의 미시적 형성 원리를 구분해냈다는 점이 중요하며, 독자분의 관심사인 CDW 동역학 및 RTe3 계열 물질 연구와 직결됩니다.", "unresolved": "핵 생성 과정에서의 국소적인 공간적 불균일성을 실시간 실공간 이미지로 직접 확인하는 작업은 과제로 남아있습니다.", "future_work": "다른 희토류 es in TRSB antiferromagnets."]}}, {"title": "Chiral Charge Density Waves in Transition Metal Dichalcogenide", "journal": "PRL_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/5vkg-zvhv", "authors": "Ettore Carpene", "last_authors": "Ettore Carpene", "summary": "The emergence of chirality in the charge density wave (CDW) phase of 1 T − TiSe 2 has recently attracted significant attention, yet its microscopic origin remains debated. The prevailing interpretation attributes chirality to a relative phase shift between the charge density components. Here, using density functional theory and symmetry analysis, it is demonstrated that such phase-shifted states entail prohibitive energy costs, rendering them unlikely candidates for the ground state. Instead, a nearly degenerate metastable CDW phase stacking order with monoclinic symmetry is identified that naturally breaks mirror and inversion symmetries. The CDW in 1 T − TiSe 2 possesses a dual physical nature: The electronic charge redistribution is intrinsically bond modulated, while the periodic lattice distortion is atom-centered transverse. This spatial separation allows a specific optical coupling mechanism where circularly polarized light breaks the energetic degeneracy between chiral domains. These results reconcile conflicting experimental observations, identifying the “spontaneous” chirality observed in local probes as a statistical distribution of CDW phase stacking domains while establishing the mechanism for macroscopic, light-induced gyrotropic order.", "tier": "B_IMPORTANT_CONDMAT", "score": "9", "reason": "Directly addresses chiral CDW in TiSe2, highly relevant to user's kagome and chirality focus.", "tags": ["CDW", "chirality", "TMD"], "image": "", "briefing": {"background": "전이금속 디칼코게나이드(TMD)인 1T-TiSe2는 CDW 상에서의 카이랄성 발현으로 인해 많은 관심을 받고 있습니다. 일반적으로 CDW는 전하 밀도의 주기적 변조를 의미하는데, 최근 실험적으로 관측된 카이랄성(거울 대칭성 깨짐)의 미시적 기원을 설명하는 것이 핵심 문제입니다.", "motivation": "기존에 제안된 '전하 밀도 성분 간의 상대적 위상 변이' 모델이 에너지적으 itates the correlated state.", "These findings highlight the potential for tuning quantum phases in atomically thin TMDs."]}}, {"title": "Ferroelectric control of the Mott insulator–topological metal transition", "journal": "Science_Advances", "source": "Gemini", "link": "https://doi.org/10.1126/sciadv.aed6236", "authors": "Mengmeng Niu, Peng-Jie Guo, Yicheng Ma, et al.", "last_authors": "Jingsi Qiao, Yeliang Wang", "summary": "Correlated and topological phases often coexist or compete in van der Waals materials, yet achieving an electrically switchable and reversible conversion between them remains a substantial challenge. Such control is crucial for understanding their interplay and enabling nonvolatile, low-power topological electronics. Here, we propose and demonstrate a polarization-controlled route to switch between Mott insulator and topological metal in ferroelectric-Mott heterostructures. In α-In 2 Se 3 /1T-NbSe 2 , polarization reversal modulates interlayer coupling through out-of-plane orbital alignment. Downward polarization stabilizes Mott-insulating states with type-I band alignment, whereas upward polarization enhances interfacial hybridization, forms interlayer covalent-like quasi-bonding, and drives Γ-point band inversions. The resulting spin-split hybridized valleys penetrate the valence band, inducing a nontrivial topological state with intrinsic anomalous Hall conductivity of ∼10 2 siemens per centimeter. The comparison with α-In 2 Se 3 /1T-TaSe 2 and α-In 2 Se 3 /1T-TaS 2 further identifies Γ-centered valleys and out-of-plane p z -orbital coupling as key ingredients for polarization-switchable topology, providing a general design framework for electrically programmable correlated-topological integration in two-dimensional heterostructures.", "tier": "B_IMPORTANT_CONDMAT", "score": "9", "reason": "Electrically switchable Mott-topological transition in NbSe2 heterostructures; highly relevant to user interests.; demoted from A: broad CM, not direct Shuolong Yang", "summary": "Flat electronic bands enable fascinating emergent phenomena such as superconductivity and charge orders. A prevailing approach to realizing flat bands is to engineer lattice geometric constraints in twisted or kagome-like materials. An alternative approach is to utilize purely electronic-interaction-driven flat bands, yet a fundamental challenge is that extreme flatness requires ultrastrong interaction strength, which often leads to incoherent states. Here we demonstrate the concurrent formation of an interaction-driven flat band at the Fermi level and a 3 × 3 R 30 ° charge order in a van der Waals magnet Fe 5 GeTe 2 using high-resolution angle-resolved photoemission spectroscopy. This charge order is manifested by band folding within 30 meV below the Fermi level, with its nesting driven by flat bands. The presence of this flat band throughout the Brillouin zone and the logarithmic temperature dependence of its spectral weight suggest a phenomenological Kondo-like, coherent Fermi liquid emerging from strong correlations. Our work establishes a paradigm where an interaction-driven flat band promotes large-scale electronic ordering.", "tier": "B_IMPORTANT_CONDMAT", "score": "9", "reason": "ARPES study of flat bands and charge order in a correlated van der Waals magnet.", "tags": ["ARPES", "Fe5GeTe2", "flatbands", "chargeorder"], "image": "", "briefing": {"background": "전자 간 상호작용이 강한 시스템에서 나타나는 평탄 밴드(flat band)는 밴드 분산이 거의 없어 전자 상관효과를 극대화하며, 전하 질서나 초전도와 같은 기묘한 상태를 유도하는 모태가 됩니다.", "motivation": "일반적으로 격자 구조(kagome, moire)로 평탄 밴드를 만드는 방식과 달리, 순수하게 전자 상호작용만으로 형성되는 평탄 밴드가 강상관 자성체 Fe5GeTe2에서 나타나는지 규명하고자 합니다.", "result": "ARPES를 통해 Fe5GeTe2에서 페르미 준위 근처의 평탄 밴드와 3x3 R30도 전하 질서(charge order)가 공존함을 관측했으며, 이 전하 질서가 평탄 밴드에 의한 중첩(nesting)에 기인함을 밝혔습니다.", "implication": "강상관 물질 내에서 전자적 상호작용이 전하 질서 형성을 주도하는 새로운 메커니즘을 제시하며, Kondo 물리와의 유사성을 시사합니다.", "novelty": "강한 상호작용에 의한 평탄 밴드와 그에 수반된 전하 질서의 공존을 직접적인 ARPES 데이터로 입증한 점이 본 연구의 가치입니다.", "unresolved": "평탄 밴드가 넓은 yl semimetal relevant to the user's focus on magnetic topological materials.", "tags": ["Weyl", "topological", "magnetic"], "image": "", "briefing": {"background": "위상 절연체 및 위상 준금속 시스템에서 스핀과 전하의 자유도가 결합하여 발생하는 물리 현상은 현대 응집물질물리학의 주요 연구 주제입니다. 특히 자기적 위상 물질은 자성질서와 위상적 밴드 구조의 상호작용을 연구하기 좋은 플랫폼입니다.", "motivation": "EuBiTe3는 원래 절연체 특성을 가진 자성 물질인데, 여기에 La을 치환하여 캐리어 농도를 조절함으로써 위상적 성질과 자기적 여기(magnon) 간의 상관관계를 탐구하고자 했습니다.", "result": "La 도핑을 통해 위상적 성질이 도입된 상태에서 매그논 갭(magnon gap)의 형성이 관찰되었습니다. 이는 전하 캐리어와 스핀 여기 사이의 복잡한 결합이 위상 시스템에서 어떻게 나타나는지를 실증적으로 보여줍니다.", "implication": "자기적 위상 준금속에서 나타나는 스핀 역학은 차세대 스핀트로닉스 소자나 위상 양자 컴퓨터의 제어 가능성을 시사합니다.", "novelty": "위상적으로 비자명한 시스템에서 상관관계를 가지는 매그논 여기를 직접 실험적으로 탐구했다는 점에서 귀하의 연구 관심사인 자기적 위상 물질의 이해를 심화시킵니다.", "unresolved": "이 매그논 갭 형성이 정확히 어떤 위상적 성분과 강하게 결합하는지에 대한 상세한 미시적 메커니즘은 여전히 추가 연구가 필요합니다.", "future_work": "ARPES를 통한 밴드 구조의 직접 관찰 및 중성자 산란을 통한 더 상세한 매그논 분산 관계의 매핑이 요구됩니다.", "concepts": [{"term": "Weyl semimetal", "why_emerged": "밴드 구조에서 밴드가 교차하는 점(Weyl node)이 에너지 상에서 3차원적으로 고립되어 나타나는 물질을 정의하기 위해 필요했습니다.", "origin": "Herring(1937)이 이론을 제시하고, 2015년 TaAs 등에서 실험적으로 확인되었습니다.", "connections": "Berry curvature, anomalous Hall effect, topological insulators."}, {"term": "Magnon gap", "why_emerged": "자기적 질서가 있는 시스템에서 스핀파(magnon)의 분산 관계에 나타나는 에너지 차이를 설명하기 위해 필요했습니다.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "Spin-orbit coupling, magnetic anisotropy, topological magnon insulators."}], "english_summary": ["La-doped EuBiTe3 exhibits topological Weyl semimetal properties.", "Experimental evidence of magnon gap formation is reported.", "The study highlights the coupling between charge carriers and collective spin excitations.", "This work provides insights into magnetic topological systems."]}}, {"title": "Modification of charge and spin textures by light chemical substitution in Eu(Al1−xGax)4 (x=0.1)", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/6kwv-fh15", "authors": "Zétény Bacsó, Fellipe Carneiro, Kevin Allen, et al.", "last_authors": "Alessandro Bombardi, Roger D. Johnson", "summary": "We present the results of a resonant x-ray-diffraction experiment, resolving both charge and spin textures in the intermetallic topological magnet Eu ( Al 1 − x Ga x ) 4 ( x = 0.1). Below ≈ 75 K the system develops a charge-density wave (CDW) with propagation vector k CDW ≈ ( 0 , 0 , 0.18 ) . The CDW order parameter grows monotonically on cooling until ≈ 15 K, when a sudden decrease in the CDW amplitude occurs. Pairs of magnetic satellites of the (0, 0, 8) Bragg reflection corresponding to two distinct domains, k 1 = ( ± δ m , 0, 0), k 2 = (0, ± δ m , 0), δ m = 0.2002 ( 4 ) were studied at the Eu L 3 edge, appearing below T N = 14.8 K. Our measurement of T N is exactly coincident with the sudden drop in the CDW amplitude, which suggests strong coupling between the charge and spin orders, as observed in other compounds of the Eu ( Al 1 − x Ga x ) 4 series. Azimuthal measurements were consistent with a single helical spin arrangement having an elliptical envelope of μ Y / μ Z = 1.19(6) for the k 2 domain, and a tilted helical (helicoidal) spin arrangement for the k 1 domain, with μ Y / μ Z = 1.14(4) and μ X / μ Z = 0.20(2) that may be hidden for the k 2 domain due to multiple subdomains. Temperature evolution of the magnetic satellite intensities in linear and circularly polarized light found the respective ratio to be invariant with temperature, suggesting a single helicoidal magnetic phase throughout the measured temperature range. This behavior is unlike the x = 0 material, in which a spin-density wave forms first, transitioning to a helical ground state on cooling through intermediate phases. Future theoretical work on the Eu electronic ground state, supported by related experiments, will help understand the effects of Ga substitution on the evolution of the magnetic structure.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Relevant topological magnet with charge-density wave and electronic structure implications.", "tags": ["CDW", "topological", "magnetic"], "image": "", "briefing": {"background": "Eu(Al,Ga)4 계열 물질은 전하밀도파(CDW)와 자기적 질서가 공존하며, 이들 사이의 복잡한 경쟁과 협동 현상을 연구하기 위한 중요한 플랫폼으로 알려져 있습니다.", "motivation": "Ga 치환이 CDW 상태와 자기적 텍스처에 미치는 영향을 분석하여, 두 순서 파라미터 간의 강한 결합 메커니즘을 밝히고자 했습니다.", "result": "약 15 K 부근에서 CDW 진폭의 급격한 감소가 자기적 전이 온도(TN)와 일치함을 관찰했습니다. 이는 전하 순서와 자기적 순서가 강하게 결합되어 있음을 의미합니다.", "implication": "CDW와 스핀 텍스처 간의 직접적인 상호작용은 물질의 전자 구조 및 위상적 성질을 외부 필드나 도핑으로 조절하는 데 중요한 단서를 제공합니다.", "novelty": "비공선형 스핀 구조(helicoidal)의 온도 의존성이 Ga 치환에 의해 기존 x=0 물질과는 다르게 나타남을 확인하여, 도핑을 통한 자기 구조 제어의 가능성을 제시했습니다.", "unresolved": "관찰된 자기 구조와 전자 밴드 구조 간의 상세한 상호작용은 여전히 이론적 모델링이 필요한 단계입니다.", "future_work": "전산모사(DFT+DMFT 등)를 통해 Ga 도핑이 전자 구조와 CDW를 어떻게 변화시키는지에 대한 규명이 필요합니다.", "concepts": [{"term": "CDW (Charge-Density Wave)", "why_emerged": "전자의 밀도가 공간적으로 주기적인 변조를 일으키는 바닥 상태를 기술하기 위해 필요했습니다.", "origin": "Peierls(1955)가 1차원 시스템에서 제안했습니다.", "connections": "Nematicity, Peierls transition, Fermi surface nesting."}, {"term": "Helicoidal magnetic structure", "why_emerged": "스핀이 공간적으로 나선형 배열을 이루는 복잡한 자기 구조를 분류하기 위해 필요했습니다.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "Dzyaloshinskii-Moriya interaction, chiral magnets, topological Hall effect."}], "english_summary": ["Eu(Al0.9Ga0.1)4 shows coexistence of CDW and magnetic order.", "A strong coupling between the CDW amplitude and TN is observed at 15 K.", "Resonant X-ray diffraction reveals a consistent helicoidal spin structure.", "Ga substitution significantly modifies the spin-charge texture evolution."]}}, {"title": "Phonon scattering mechanisms in WTe2 observed by ultrafast coherent phonon spectroscopy", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/ssvg-wh36", "authors": "Mizuki Akei, Yu Mizukoshi, Muneaki Hase", "last_authors": "Yu Mizukoshi, Muneaki Hase", "summary": "T d -WTe 2 is a Weyl semimetal, which exhibits unique physical properties of electronic states, such as the Lifshitz transition. Here, using ultrafast laser spectroscopy, the authors reveal contribution of phonon-electron scattering only for the low-frequency A 1 optical phonon, in addition to conventional phonon-phonon scattering at low temperatures. The findings of the phonon-electron scattering path possibly induced by the Lifshitz transition pave the way for further exploration of the electronic structure and transport properties in a wide range of quantum materials.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Ultrafast study of Weyl semimetal WTe2; relevant to electronic structure changes and Lifshitz transitions.", "tags": ["material", "method", "Weyl-semimetal"], "image": "", "briefing": {"background": "WTe2는 제2형 Weyl 준금속으로 유명하며, 페르미 표면의 변화(Lifshitz transition)에 따른 전자 구조의 급격한 변화가 수송 특성에 어떻게 반영되는지가 중요한 연구 대상입니다.", "motivation": "초고속 분광학을 사용하여 저주파 광학 포논과 전자 간의 산란 과정을 관찰함으로써, 전자 구조 변화와 포논 역학의 상관관계를 조사하고자 했습니다.", "result": "저온에서 일반적인 포논-포논 산란 외에도 포논-전자 산란이 존재함을 확인했으며, 이는 리프시츠 전이와 연관되어 있을 가능성을 제시합니다.", "implication": "초고속 분광학이 양자 물질의 전자-격자 결합을 규명하는 강력한 도구임을 입증하며, 비평형 상태에서의 전자 제어 가능성을 보여줍니다.", "novelty": "WTe2의 저주파 포논 모드를 통해 전자적 상전이 정보를 추출해낸 점이 중요하며, 향후 ARPES 결과와의 결합 연구에 유용합니다.", "unresolved": "관찰된 포논-전자 산란 경로가 정확히 리프시츠 전이의 어떤 페르미 면 변화에 기인하는지에 대한 이론적 확정은 부족합니다.", "future_work": "시간 분해 ARPES(tr-ARPES)를 병행하여 전자 밴드의 실시간 변화와 포논 모드의 동역학을 동시에 관찰하는 실험이 기대됩니다.", "concepts": [{"term": "Lifshitz transition", "why_emerged": "페르미 면의 위상학적 변화(연결성 변화)가 발생하는 금속 상태의 전이를 설명하기 위해 필요했습니다.", "origin": "Lifshitz(1960)에 의해 처음 제시되었습니다.", "connections": "Van Hove singularity, topological phase transition."}, {"term": "Ultrafast coherent phonon spectroscopy", "why_emerged": "펨토초 레이저 펄스를 이용해 격자의 진동 모드를 실시간으로 관찰하고 제어하기 위해 개발되었습니다.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "Pump-probe spectroscopy, electron-phonon coupling."}], "english_summary": ["Ultrafast spectroscopy of WTe2 reveals phonon-electron scattering.", "The findings are linked to the Lifshitz transition in this Weyl semimetal.", "The A1 optical phonon mode exhibits unique temperature-dependent scattering.", "This approach provides a new way to study electronic structures via lattice dynamics."]}}, {"title": "Quantum geometry in the NbSe2 family: Obstructed compact Wannier function and perturbation theory", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/2bjl-p1vd", "authors": "Jiabin Yu, Yi Jiang, Yuanfeng Xu, et al.", "last_authors": "Fernando De Juan, B. Andrei Bernevig", "summary": "Here, the authors reveal that monolayer NbSe 2 and related transition metal dichalcogenides host obstructed atomic bands near the Fermi level. By constructing a b i n i t i o six-, three-, and single-band Wannier models, they identify remarkably compact obstructed Wannier functions and an unusual dominance of next-nearest-neighbor hopping. These results provide a transparent low-energy framework for investigating how quantum geometry shapes charge order, electron–phonon coupling, and superconductivity in NbSe 2 .", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Detailed electronic structure analysis of NbSe2, a material family of high interest for CDW/superconductivity.", "tags": ["electronic-structure", "NbSe2", "CDW"], "image": "", "briefing": {"background": "전이금속 디칼코게나이드(TMD)인 NbSe2는 전하 밀도 파동(CDW)과 초전도성이 공존하는 대표적인 물질로, 그 전자 구조를 정확히 모델링하는 것은 고체 물리학의 오랜 과제입니다.", "motivation": "단층 NbSe2의 전자 구조에서 밴드가 원자 중심에 위치하지 않는 '방해받은(obstructed)' 원자 밴드의 기하학적 특성을 규명하여 저에너지 물리 모델을 개선하고자 했습니다.", "result": "ab initio 계산을 통해 콤팩트한 원자 방해 Wannier 함수를 도출했으며, 차차근접 호핑(next-nearest-neighbor hopping)이 지배적인 특이한 에너지 구조를 확인했습니다.", "implication": "이 모델은 NbSe2의 CDW 발생 기전과 전자-포논 결합, 초전도 현상을 양자 기하학적 관점에서 더 직관적이고 투명하게 해석할 수 있는 토대를 제공합니다.", "novelty": "기존의 복잡한 밴드 계산 대신 Wannier 모델링을 통해 양자 기하학이 물질의 상(phase)을 어떻게 결정하는지 직관적인 프레임워크를 제시했다는 점에서 독자에게 매우 유용합니다.", "unresolved": "이러한 콤팩트한 Wannier 함수가 실제 실험적 ARPES 스펙트럼의 미세한 피처들과 정량적으로 얼마나 일치하는지에 대한 검증이 필요합니다.", "future_work": "도출된 모델을 기반 ivity in this system."]}}, {"title": "Odd-Parity Altermagnetism through Sublattice Currents: From Haldane-Hubbard Model to General Bipartite Lattices", "journal": "PRL_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/c8pd-2fs4", "authors": "Yu-Ping Lin, Marc Vila", "last_authors": "Yu-Ping Lin, Marc Vila", "summary": "Sublattice currents are a feasible route to odd-parity altermagnetism, where nonrelativistic collinear spin splitting occurs in the bands as an odd function of momentum.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Theory on odd-parity altermagnetism, a direct user interest with electronic structure implications.", "tags": ["theory", "altermagnetism", "electronicstructure", "Hubbardmodel"], "image": "", "briefing": {"background": "알터마그네틱(Altermagnetism)은 전통적인 강자성이나 반강자성과 달리, 시간 반전 대칭성이 깨져 있으면서도 순자화가 0인 상태에서 운동량 의존적 스핀 갈라짐(spin-splitting)이 나타나는 새로운 자기 질서입니다.", "motivation": "이 논문은 일반적인 이분 격자(bipartite lattice)에서 서브격자 전류(sublattice currents)가 어떻게 홀 패리티(odd-parity)를 갖는 알터마그네틱 상태를 유도할 수 있는지 모델링하고자 합니다.", "result": "Haldane-Hubbard 모델을 기반으로, 시스템 내의 서브격자 간 전류가 비상대론적 상황에서도 밴드 구조 내에서 운동량의 홀 함수(odd function) 형태로 스핀 분리를 일으키는 메커니즘을 증명했습니다.", "implication": "알터마그네틱 물질의 설계 원리를 확장하여, 비자성 원소로 구성된 격자에서도 위상적 성질과 연계된 스핀 수송 현상을 구현할 수 있는 이론적 기반을 마련했습니다.", "novelty": "기존 알터마그네틱 연구가 주로 공간 반전 대칭의 깨짐에 집중했다면, 이 연구는 '서브격자 전류'라는 동적 요소가 전자 구조의 스핀 텍스처를 어떻게 조절하는지 체계화했습니다.", "unresolved": "실제 고체 물질에서 이러한 서브격자 전류를 외부에서 정밀하게 제어하거나 실험적으로 관측하기 위한 직접적인 ARPES 시그니처 분석이 추가로 필요합니다.", "future_work": "실제 이분 격자를 가지는 후보 물질을 DFT 계산으로 탐색하고, 위상적 특성이 결합된 알터마그네틱 상태의 수송 현상을 검증하는 연구가 필요합니다.", "concepts": [{"term": "Altermagnetism", "why_emerged": "강자성체와 반강자성체의 범주를 넘어서는 새로운 자기적 위상 상태를 분류하기 위해 필요했습니다.", "origin": "최근 2020년대 초반 (Libor Smejkal 등 제안).", "connections": "스핀-궤도 결합 없이 발생하는 운동량 의존적 스핀 분리, 반강자성 스핀트로닉스."}, {"term": "Bipartite Lattice", "why_emerged": "허바드 모델 등 강상관 전자계 모델에서 전자 상호작용과 자기 질서를 이해하는 기초 격자 구조로 활용됩니다.", "origin": "고체 물리학 초기 격자 이론에서 정립.", "connections": "네 03388-z", "authors": "Samik DuttaGupta", "last_authors": "Samik DuttaGupta", "summary": "It is unclear whether crystalline disorder can suppress angular momentum transport. Now, a study reveals the disorder resilience of such transport and uncovers distinct orbital relaxation processes across a wide range of disordered thin films.", "tier": "B_IMPORTANT_CONDMAT", "score": "7", "reason": "Important experimental study on orbital transport and relaxation in thin films, relevant to Berry curvature interests.", "tags": ["orbitronics", "transport", "thinfilms"], "image": "https://media.springernature.com/m685/springer-static/image/art%3A10.1038%2Fs41567-026-03388-z/MediaObjects/41567_2026_3388_Fig1_HTML.png", "briefing": {"background": "스핀트로닉스를 넘어 전자 궤도 자유도를 활용한 오비트로닉스(Orbitronics)는 차세대 소자 구현의 핵심 기술로 주목받고 있으나, 결정 결함이 궤도 각운동량 수송에 미치는 영향은 잘 알려지지 않았습니다.", "motivation": "결정 무질서(disorder)가 궤도 각운동량 수송을 억제하는지, 아니면 견고하게 유지되는지를 실험적으로 규명하고자 했습니다.", "result": "다양한 무질서 수준을 가진 박막 시스템에서 궤도 수송이 무질서에 대해 예외적인 회복력(resilience)을 가짐을 발견하고, 이를 제어하는 독립적인 궤도 완화 과정을 확인했습니다.", "implication": "궤도 기반 소자가 물리적 불순물이나 결함에 강건할 수 있음을 시사하며, 실용적인 오비트로닉스 소자 설계의 이론적 근거를 제공합니다.", "novelty": "궤도 각운동량의 수송이 전하/스핀 수송과 달리 무질서 환경에서도 안정적으로 작동한다는 점을 밝혀낸 중요한 실험적 진전입니다.", "unresolved": "실험적 결과에 따른 특정 소재 내에서의 궤도 수송 메커니즘의 미시적 기원에 대한 해석이 더 필요합니다.", "future_work": "궤도 홀 효과 및 관련 전하 수송 측정과 병행하여 소자 응용 가능성을 평가하는 연구가 예상됩니다.", "concepts": [{"term": "오비트로닉스", "why_emerged": "전하와 스핀 외에 전자의 궤도 자기 모멘트를 활용하여 새로운 형태의 정보 처리를 구현하기 위해 등장.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "스핀 홀 효과, 베리 곡률(Berry curvature), 궤도 홀 효과와 연결됨."}], "english_summary": ["The study investigates the resilience of orbital angular momentum transport against crystalline disorder.", "Experimental results show that orbital transport remains robust in various disordered thin films.", "The findings reveal distinct relaxation processes underlying this disorder-resilient transport.", "The work provides a foundation for developing robust orbitronic devices."]}}, {"title": "Effect of cobalt intercalation on the electronic structure of graphene on Ir(111): Sublattice and time-reversal symmetry breaking", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/8tv2-jw2h", "authors": "Alevtina A. Gogina, Artem V. Tarasov, Anna A. Rybkina, et al.", "last_authors": "Alexander M. Shikin, Artem G. Rybkin", "summary": "Proximity effects between graphene and hybrid ferromagnetic and heavy metal structures offer a promising road for modifying graphene's electronic properties. Such systems have been proposed for spintronic applications due to their perpendicular magnetic anisotropy and significant Dzyaloshinskii-Mori…", "tier": "B_IMPORTANT_CONDMAT", "score": "7", "reason": "Addresses TRSB and electronic structure of graphene, highly relevant to user's interests.", "tags": ["TRSB", "graphene", "magnetic"], "image": "", "briefing": {"background": "그래핀과 강자성체/중금속 구조 간의 근접 효과(proximity effect)를 통해 위상학적 특성이나 자기적 성질을 유도하여 스핀트로닉스 소자로 응용하려는 시도가 활발합니다.", "motivation": "Ir(111) 기판 위에 놓인 그래핀에 코발트(Co)를 삽입했을 때, 그래핀의 전자 구조가 어떻게 변하며 특히 시간 반전 대칭성 깨짐(TRSB)이 어떻게 유도되는지 확인하고자 했습니다.", "result": "코발트 삽입이 그래핀의 아격자(sublattice) 대칭성을 깨뜨리고, 강한 스핀-궤도 결합 및 교환 상호작용을 통해 TRSB를 유도하는 것을 확인했습니다.", "implication": "그래핀을 기반으로 한 위상학적 물리 현상 및 스핀트로닉스 소자 구현을 위한 밴드 구조 엔지니어링이 가능함을 입증했습니다.", "novelty": "이 연구는 그래핀의 스핀/궤도 상태를 제어하여 특정 자기적 위상으로 변환시키는 경로를 구체적인 물질 시스템에서 확인했습니다.", "unresolved": "코발트 원자 분포의 불균일성이 전자 구조의 정밀한 측정을 어떻게 방해하는지, 그리고 실제 소자에서의 자기적 이방성 제어 문제.", "future_work": "ARPES를 활용하여 코발트 삽입이 유도하는 밴드 분리(splitting) 및 스핀 텍스처를 더 정밀하게 측정하는 연구가 필요합니다.", "concepts": [{"term": "시간 반전 대칭성 깨짐 (TRSB)", "why_emerged": "자기적 질서가 있는 시스템에서 위상학적 성질 및 비정상 홀 효과 등을 설명하기 위해 필요.", "origin": "Landau 및 관련 자기 이론가들", "connections": "비정상 홀 효과(AHE), 위상 절연체, 스핀 텍스처."}, {"term": "아격자 대칭성 (Sublattice Symmetry)", "why_emerged": "그래핀의 하니컴 구조에서 두 개의 탄소 원자 위치가 등가함을 설명하기 위해 도입.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "그래핀의 디락 포인트, 위상학적 밴드 구조."}], "english_summary": ["The study examines the electronic structural changes in graphene on Ir(111) due to cobalt intercalation.", "Intercalation induces sublattice symmetry breaking and time-reversal symmetry breaking.", "The results are significant for engineering topological and spintronic properties in graphene.", "The study highlights the potential of proximity effects in modifying quantum states."]}}, {"title": "Hybrid light-matter excitations and spontaneous time-reversal symmetry breaking in two-dimensional Josephson junctions", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/npcs-dl1q", "authors": "V. Varrica, G. Falci, E. Paladino, and F. M. D. Pellegrino", "last_authors": "V. Varrica, G. Falci, E. Paladino, and F. M. D. Pellegrino", "summary": "Here, the authors show that inductive coupling between a superconducting resonator and a short, wide two-dimensional material-based Josephson junction induces a phase transition in the global light–matter ground state. The resulting phase, which spontaneously breaks time-reversal symmetry, carries a finite equilibrium supercurrent at phase difference ϕ = π , where an isolated conventional Josephson junction carries no equilibrium supercurrent. The hybrid light–matter excitation spectrum provides spectroscopic fingerprints of the transition, while highly transparent transport channels determine the critical coupling.", "tier": "B_IMPORTANT_CONDMAT", "score": "7", "reason": "TRSB in superconducting heterostructures is directly relevant to the user's profile.", "tags": ["TRSB", "superconductivity"], "image": "", "briefing": {"background": "초전도체-절연체-초전도체 접합에서 나타나는 위상학적 현상과 빛-물질 상호작용을 결합하여, 거시적 양자 상태에서의 새로운 물리적 현상을 탐구하는 것이 중요해지고 있습니다.", "motivation": "초전도 공진기(resonator)와 2D 물질 기반 조셉슨 접합을 결합했을 때 나타나는 비평형적 혹은 새로운 기저 상태를 찾고자 했습니다.", "result": "유도 결합(inductive coupling)을 통해 시스템이 자발적으로 시간 반전 대칭성을 깨뜨리는 상전이를 겪으며, 위상차 π에서 유한한 평형 초전류가 흐름을 확인했습니다.", "implication": "초전도 소자에서 빛과 물질의 결합을 통해 자발적 TRSB 상태를 제어할 수 있음을 보여주며, 이는 양자 컴퓨팅 소자 설계에 활용될 수 있습니다.", "novelty": "빛-물질 하이브리드 시스템에서 조셉슨 접합의 새로운 위상을 유도했다는 점이 이론적으로 매우 흥미롭습니다.", "unresolved": "이러한 현상이 실제 실험 장치에서 얼마나 명확한 분광학적 신호로 검출될 수 있는지에 대한 정량적 한계.", "future_work": "실제 초전도 회로를 제작하여 임계 결합 조건과 그에 따른 수송 특성 측정.", "concepts": [{"term": "조셉슨 접합 (Josephson Junction)", "why_emerged": "두 초전도체 사이의 쿠퍼쌍 터널링 현상을 설명하고 활용하기 위해 등장.", "origin": "Brian Josephson, 1962.", "connections": "SQUID, 초전도 큐비트, 위상학적 초전도체."}, {"term": "시간 반전 대칭성 깨짐 (TRSB)", "why_emerged": "초전도 상태에서 자기적 질서나 특이한 페어링 상태가 존재할 때 이를 기술하기 위해 사용.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "카이랄 초전도체, 위상학적 절연체."}], "english_summary": ["The study explores hybrid light-matter excitations in a 2D Josephson junction coupled to a resonator.", "A phase transition leads to spontaneous time-reversal symmetry breaking.", "The system exhibits a finite equilibrium supercurrent at a phase difference of pi.", "These findings suggest new ways to manipulate quantum phases in superconducting circuits."]}}, {"title": "Incommensurate antiferromagnetism with amplitude modulation in the semiconducting 5f van der Waals magnet α−UTe3", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/jls4-6s89", "authors": "Hironori Sakai, Chihiro Tabata, Koji Kaneko, et al.", "last_authors": "Yo Tokunaga, Yoshinori Haga", "summary": "Here, the authors combine nuclear magnetic resonance and single-crystal neutron diffraction to constrain a plausible magnetic structure model for the incommensurate antiferromagnetic state of the semiconducting 5 f van der Waals magnet α -UTe 3 . The model captures strong spin anisotropy and spatially modulated ordered moments, suggesting that this unusual order develops near a quantum critical point associated with crystal-field singlet induced magnetism in a layered actinide system with highly anisotropic 5 f electrons.", "tier": "B_IMPORTANT_CONDMAT", "score": "7", "reason": "Neutron scattering study of a van der Waals magnet with complex incommensurate order.", "tags": ["neutron-scattering", "UTe3", "vdW-magnet"], "image": "", "briefing": {"background": "반데르발스(vdW) 자성체는 층상 구조 덕분에 저차원 물성과 양자 자기 현상을 연구하는 데 매우 중요한 플랫폼입니다. 특히 5f 전자 궤도를 갖는 악티나이드 화합물은 강한 스핀-궤도 결합과 결정장 효과로 인해 비자명한 자기적 기저 상태를 보입니다.", "motivation": "α-UTe3는 반도체성 vdW 자성체로, 비통약(incommensurate) 반강자성 상태를 나타냅니다. 본 연구는 NMR과 중성자 회절을 결합하여 이 물질의 복잡한 자기 구조 모델을 제안하고자 합니다.", "result": "강한 스핀 이방성과 공간적으로 변조된 자기 모멘트를 포함하는 모델을 확립했습니다. 이는 결정장 단일항(singlet)에 유도된 자성이 양자 임계점 근처에서 형성됨을 시사합니다.", "implication": "5f 전자계에서의 복잡한 비통약 자기 구조를 이해하는 것은 유사한 구조를 가진 강상관 전자계의 위상적 물리 현상을 탐구하는 기초가 됩니다.", "novelty": "악티나이드 계열 vdW 물질의 자기 구조를 NMR과 중성자 산란의 조합으로 정밀하게 제어하여, 양자 임계점 근처의 이방성 자기적 거동을 밝혀냈습니다.", "unresolved": "비통약성이 형성되는 정확한 전자 구조적 기원과 양자 임계점에서의 구체적인 들뜸(excitation) 스펙트럼은 추가 연구가 필요합니다.", "future_work": "비탄성 중성자 산란을 이용한 마그논(magnon) 및 스핀 들뜸 측정과 더불어, 압력이나 자기장 하에서의 전기적 수송 특성 변화를 관측할 필요가 있습니다.", "concepts": [{"term": "Incommensurate Antiferromagnetism", "why_emerged": "자기 주기성이 결정 격자 주기성과 정수 배의 관계를 갖지 않는 현상을 설명하기 위해 필요합니다.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "스핀 밀도파(SDW), 헬리컬 자기 구조와 밀접하게 관련됨."}, {"term": "Crystal-field Singlet Induced Magnetism", "why_emerged": "결정장 효과로 인해 기저 상태가 단일항임에도 불구하고 이웃한 이온과의 상호작용으로 유도된 자기 모멘트를 설명하기 위해 도입됨.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "밴 플렉 자성(Van Vleck magnetism), 강상관 전자계의 양자 임계 현상."}], "english_summary": ["The paper investigates the incommensurate antiferromagnetic state of the 5f vdW magnet α-UTe3.", "Neutron diffraction and NMR were used to model the magnetic structure.", "The result suggests magnetism is induced by crystal-field singlets near a quantum critical point.", "This provides insights into the interplay of strong spin anisotropy and 5f electron physics."]}}, {"title": "Magnetic ordering and spin network in the quantum spin ladder Ba2CuTeO6", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/jpvl-jd4h", "authors": "Sunil K. Karna, Y. Zhao, C. W. Wang, R. Sankar, D. Temple, K. Matan, R. Piltz,
