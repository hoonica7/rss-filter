<title>Daily Paper Slideshow</title>
<style>
  :root {
    color-scheme: light;
    --bg: #f6f7f4;
    --paper: #ffffff;
    --ink: #111827;
    --muted: #64748b;
    --line: #d8ddd2;
    --accent: #176b87;
    --accent-2: #9a3412;
  }
  * { box-sizing: border-box; }
  body { margin: 0; height: 100vh; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: var(--bg); color: var(--ink); }
  .shell { max-width: 1500px; height: 100vh; margin: 0 auto; padding: 14px 18px; display: flex; flex-direction: column; }
  .topbar { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 16px; }
  .top-actions { display: flex; align-items: center; gap: 10px; }
  .topbar a, button { border: 1px solid var(--line); border-radius: 8px; background: var(--paper); color: var(--ink); padding: 10px 14px; font-weight: 700; text-decoration: none; cursor: pointer; }
  button.primary { background: var(--accent); border-color: var(--accent); color: white; }
  button:disabled { opacity: 0.45; cursor: not-allowed; }
  .counter { color: var(--muted); font-weight: 700; }
  .slide { height: calc(100vh - 82px); background: var(--paper); border: 1px solid var(--line); border-radius: 10px; padding: 18px; box-shadow: 0 18px 42px rgba(15, 23, 42, 0.10); display: grid; grid-template-columns: minmax(310px, 0.86fr) minmax(0, 1.55fr); gap: 18px; overflow: hidden; }
  .paper-head { min-width: 0; min-height: 0; overflow: hidden; display: flex; flex-direction: column; gap: 12px; }
  .figure { margin: 0; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: #f8fafc; }
  .figure img { display: block; width: 100%; max-height: 41vh; object-fit: contain; background: white; }
  .figure figcaption { padding: 7px 10px; color: var(--muted); font-size: 12px; line-height: 1.3; }
  .head-text { display: flex; flex-direction: column; gap: 9px; min-width: 0; }
  .badges { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .badge { border-radius: 999px; padding: 5px 9px; background: #eef2ff; color: #3730a3; font-size: 12px; font-weight: 800; }
  .score { background: #fee2e2; color: #991b1b; }
  h1 { margin: 0; font-size: 25px; line-height: 1.15; letter-spacing: 0; overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
  h1 a { color: inherit; text-decoration-color: rgba(23, 107, 135, 0.35); text-decoration-thickness: 2px; text-underline-offset: 4px; }
  h1 a:hover { color: var(--accent); text-decoration-color: var(--accent); }
  .meta, .authors, .why, .abstract { font-size: 13px; line-height: 1.45; }
  .meta, .authors { color: var(--muted); }
  .why strong, .abstract strong, .authors strong { color: var(--ink); }
  .authors { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .why { border-left: 4px solid var(--accent-2); padding-left: 10px; color: #374151; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .abstract { border-top: 1px solid var(--line); padding-top: 14px; color: #374151; }
  .original-abstract { margin-top: auto; border-top: 1px solid var(--line); padding-top: 10px; color: #374151; font-size: 11.5px; line-height: 1.35; max-height: 20vh; overflow: auto; }
  .original-abstract strong { display: block; margin-bottom: 4px; color: var(--ink); }
  .tags { display: flex; flex-wrap: wrap; gap: 8px; }
  .tag { border-radius: 999px; padding: 4px 8px; background: #f1f5f9; color: #475569; font-size: 12px; font-weight: 700; }
  .head-text > .link { display: none; }
  .briefing { min-width: 0; min-height: 0; overflow: auto; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); grid-auto-rows: minmax(0, auto); align-content: start; gap: 11px 18px; border-top: 0; padding-top: 0; }
  .brief-section { min-width: 0; }
  .brief-section.wide { grid-column: 1 / -1; }
  .brief-section h2 { margin: 0 0 4px; font-size: 14px; line-height: 1.22; color: #0f766e; letter-spacing: 0; }
  .brief-section p, .brief-section li { margin: 0; font-size: 12.5px; line-height: 1.42; color: #1f2937; overflow-wrap: anywhere; }
  .brief-section ul { margin: 0; padding-left: 20px; }
  .concepts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 9px 14px; }
  .concept { border-top: 1px solid var(--line); padding-top: 7px; }
  .concept h3 { margin: 0 0 4px; font-size: 13px; color: #7c2d12; letter-spacing: 0; }
  .concept p { margin: 2px 0 0; font-size: 11.5px; line-height: 1.35; color: #374151; overflow-wrap: anywhere; }
  .concept b { color: #111827; }
  .link { color: var(--accent); font-weight: 800; text-decoration: none; }
  .empty { padding: 48px; background: var(--paper); border: 1px solid var(--line); border-radius: 12px; color: var(--muted); }
  @media (max-width: 860px) {
    body { height: auto; overflow: auto; }
    .shell { padding: 14px; }
    .topbar, .top-actions { align-items: stretch; flex-direction: column; }
    .slide, .briefing, .concepts { grid-template-columns: 1fr; }
    .slide { height: auto; overflow: visible; display: grid; }
    h1 { font-size: 28px; }
  }
</style>

bbard exciton", "why_emerged": "Mott 절연체에서 전자-정공 쌍의 강한 상관관계를 기술하기 위해.", "origin": "Mott-Hubbard 물리학의 핵심 요소.", "connections": "전하 이동 갭(charge transfer gap), 비평형 분광학."}, {"term": "2D electronic spectroscopy", "why_emerged": "에너지 및 시간 분해능을 동시에 높여 다체계의 결합 정보를 직접 관측하기 위해.", "origin": "분자 분광학에서 출발하여 고체 물리학으로 확장됨.", "connections": "Ultrafast pump-probe, 다차원 분광학."}], "english_summary": ["Investigated Mott-Hubbard insulator LaVO3 using ultrafast spectroscopy.", "Linked Hubbard exciton decoherence time to the local order parameter.", "Probed the interplay of spin, orbital, and structural order dynamics.", "Demonstrates the power of 2D electronic spectroscopy in correlated systems."]}}, {"title": "Observation of quantum vortex core fractionalization and skyrmion formation in a superconductor", "journal": "Science", "source": "author whitelist", "link": "https://doi.org/10.1126/science.ads0189", "authors": "Yu Zheng, Quanxin Hu, Xin Yu, et al.", "last_authors": "Chi-Ming Yim, Hong Ding", "summary": "Magnetic fields can penetrate a superconductor in the form of quantum vortices, which consist of a core singularity with circulating currents. London’s quantization implies that there is one core singularity per quantum of magnetic flux in single-component superconductors. Here, we report signatures of quantum vortex core fractionalization on the potassium-terminated surface of a multiband superconductor KFe 2 As 2 . The observed splitting of single integer-flux vortices into several fractional vortices results in a disparity between the numbers of flux quanta and vortex cores. These fractional vortices often arrange in chains, which calculations show are characterized by a ℂP 2 skyrmionic topological invariant; this constitutes a different type of topological defect: the chiral skyrmion. The disparate natures of integer and fractional vortices comprising skyrmions lead to distinct spectroscopic signatures.", "tier": "A_MUST_READ", "score": "9", "reason": "author whitelist: Hong Ding", "tags": ["superconduct", "topological"], "image": "", "briefing": {"background": "초전도체 내 자기장은 일반적으로 양자화된 선속(flux)을 가진 소용돌이(vortex) 형태로 침투합니다. 기존의 단일 성분 초전도체에서는 하나의 선속 당 하나의 소용돌이 코어(core)를 갖는 것이 표준적인 런던 이론의 예측입니다.", "motivation": "다중 밴드(multiband) 초전도체인 KFe2As2에서 나타나는 복잡한 위상학적 결함 구조와, 기존 런던 이론으로 설명되지 않는 초전도체 내 자기장 분포의 미세 구조를 규명하고자 합니다.", "result": "KFe2As2 표면에서 정수 단위의 자기 선속이 여러 개의 분수(fractional) 소용돌이로 쪼개지는 현상을 관찰했습니다. 이 분수 소용돌이들은 CP2 스카이미온(skyrmion) 위상 불변량을 갖는 키랄 스카이미온 구조를 형성하며 배열됩니다.", "implication": "초전도 상태에서 위상학적으로 분수화된 소용돌이가 존재할 수 있음을 증명하였으며, 이는 다중 밴드 초전도체의 복잡한 오더 파라미터 간 상호작용이 새로운 위상학적 결함을 유도함을 시사합니다.", "novelty": "다중 밴드 초전도체에서 발견된 '양자 소용돌이 코어 분수화'라는 새로운 물리 현상을 제시했습니다. Hong Ding 교수팀의 ARPES 관련 전문성을 고려할 때, 초전도체의 전자 구조와 위상적 결함의 상관관계를 실험적으로 입증한 중요한 성과입니다.", "unresolved": "이 분수 소용돌이 구조가 발생하는 정확한 미시적 에너지 원리와 다른 다중 밴드 초전도체에서의 보편성 여부는 추가 연구가 필요합니다.", "future_work": "다양한 다중 밴드 초전도체에서 유사한 위상학적 결함 패턴을 탐색하고, 스카이미온 배열이 초전도성 저항이나 전하 수송에 미치는 영향을 연구할 것으로 예상됩니다.", "concepts": [{"term": "Quantum Vortex Core Fractionalization", "why_emerged": "단일 성분 초전도체와 달리 다중 밴드 초전도체에서는 대칭성 파괴와 결합된 다양한 위상 결함 가능성이 대두되었기 때문입니다.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "Abrikosov vortex, Ginzburg-Landau theory"}, {"term": "CP2 Skyrmion", "why_emerged": "연속적인 장의 매핑 과정에서 위상학적으로 안정된 구조를 기술하기 위해 필요한 수학적 구조물입니다.", "origin": "Belavin 및 Polyakov (1975)의 비선형 시그마 모델 연구 등에서 유래", "connections": "Topological insulators, magnetic skyrmions"}], "english_summary": ["Discovery of quantum vortex core fractionalization in the multiband superconductor KFe2As2.", "Integer flux quanta split into multiple fractional vortices at the surface.", "These fractional vortices form chains characterized by CP2 skyrmionic topological invariants.", "Distinct spectroscopic signatures provide evidence for these chiral skyrmion defects."]}}, {"title": "Femtosecond modulation of electron correlations in a Luttinger liquid", "journal": "Science_Advances", "source": "keyword", "link": "https://doi.org/10.1126/sciadv.aec7494", "authors": "Na Li, Umang Mehta, Matin Lebrat, et al.", "last_authors": "Rahul Nandkishore, Margaret M. Murnane", "summary": "Luttinger liquids emerge in one-dimensional metals with strong electron interactions, exhibiting intriguing near-equilibrium properties such as spin-charge separation and power-law correlations. Although these interactions suggest fast, distinctive out-of-equilibrium dynamics, such phenomena remain largely unexplored on ultrashort timescales. Here, we use femtosecond laser excitation to weakly deplete the electron density in the Luttinger band of Li 0.9 Mo 6 O 17 and track the response via time- and angle-resolved photoemission spectroscopy. By fitting the measured electron distributions to a finite-temperature Luttinger liquid model, we observe a fast drop in the Luttinger exponent, quantifying the strength of electron interactions. Subsequently, unlike hot electrons in conventional Fermi liquids that slowly relax within picoseconds via electron-phonon coupling, hot electrons in Li 0.9 Mo 6 O 17 relax within a short time of ~100 femtoseconds, through the excitation of a nonequilibrium collective plasmon. The extremely fast evolution of the Luttinger exponent and electron temperature—including a tens of femtosecond time lag between excitation, recovery, and plasmon-driven modulation—reveals previously unidentified pathways for modulating quantum many-body interactions in low-dimensional materials.", "tier": "A_MUST_READ", "score": "9", "reason": "title strong match: Luttinger liquid", "tags": ["angle-resolvedphotoemission", "photoemission", "spin-chargeseparation", "Luttinger", "phonon"], "image": "", "briefing": {"background": "1차원 금속 시스템은 페르미 액체 이론이 붕괴하고 스핀과 전하의 자유도가 분리되는 '루팅어 액체(Luttinger liquid)' 상태를 형성합니다. 이러한 강한 전자 상관관계를 가진 계에서 준평형 상태를 벗어난 초고속 동역학은 현대 응집물질물리학의 중요한 도전 과제입니다.", "motivation": "Li0.9Mo6O17 물질의 1차원 금속 밴드에서 전자 밀도를 순간적으로 변화시켰을 때, 전자 상관관계와 관련된 루팅어 지수(Luttinger exponent)가 초고속 타임스케일에서 어떻게 변화하는지 관측하고자 합니다.", "result": "시간 분해 ARPES를 통해 루팅어 지수가 펨토초 단위로 급격히 변화함을 확인했습니다. 또한, 기존 페르미 액체의 전자-포논 완화 과정과 달리, 집단적 플라즈몬(plasmon) 여기를 통해 매우 빠르게 에너지가 완화됨을 규명했습니다.", "implication": "루팅어 액체의 강한 전자 상관관계를 외부 레이저 펄스로 제어할 수 있음을 입증했습니다. 이는 1차원 강상관 전자계에서 양자 상태를 펨토초 단위로 스위칭하거나 변조할 수 있는 가능성을 보여줍니다.", "novelty": "Luttinger 액체의 전자 상관관계를 실시간으로 추적했다는 점이 독보적이며, 특히 TR-ARPES를 사용하여 1차원 금속의 준입자 동역학을 직접 시각화한 점이 사용자 연구 관심사에 매우 부합합니다.", "unresolved": "플라즈몬에 의한 에너지 완화 메커니즘의 세부적인 모멘텀 의존성이나, 다른 1차원 물질(NbSe3 등)에서의 범용성 여부는 여전히 연구 대상입니다.", "future_work": "다양한 1차원 강상관 물질에서 레이저 주파수 및 에너지를 조절하여 루팅어 지수를 능동적으로 제어하는 Floquet 엔지니어링 연구가 기대됩니다.", "concepts": [{"term": "Luttinger Liquid", "why_emerged": "1차원 금속에서 페르미 액체 이론이 실패하며 전자 간의 상호작용으로 인한 집단적 들뜸 현상을 설명하기 위해 도입되었습니다.", "origin": "Tomonaga (1950)와 Luttinger (1963)에 의해 제안됨", "connections": "Spin-charge separation, Bosonization"}, {"term": "Spin-Charge Separation", "why_emerged": "1차원 계에서는 스핀과 전하가 분리된 독립적인 들뜸으로 이동하는 현상이 이론적으로 예측되었기 때문입니다.", "origin": "Haldane (1981) 등에 의해 물리적 중요성이 확립됨", "connections": "1D Mott insulator, Luttinger liquid theory"}], "english_summary": ["Investigated the out-of-equilibrium dynamics of a Luttinger liquid in Li0.9Mo6O17 using TR-ARPES.", "Observed a fast modulation of the Luttinger exponent on a sub-100 fs timescale.", "Energy relaxation is driven by nonequilibrium collective plasmon excitation rather than electron-phonon coupling.", "Demonstrates precise control of electron correlations in 1D systems through ultrafast laser excitation."]}}, {"title": "Bosonization solution of the Kondo lattice in a Luttinger liquid (Phys. Rev. B)", "journal": "arXiv_CondMat", "source": "keyword", "link": "https://arxiv.org/abs/2512.19844", "authors": "Tom\\'as Bortolin, C. J. Bolech, Nayana Shah, An\\'ibal Iucci", "last_authors": "Nayana Shah, An\\'ibal Iucci", "summary": "arXiv:2512.19844v2 Announce Type: replace Abstract: We address the physics of a regular arrangement of independent magnetic impurities embedded in a band of interacting electrons. We focus on the one-dimensional case that can be studied using bosonization and in which the electron bulk is described by a Luttinger liquid. The impurity spins interact with the electrons via magnetic exchange that introduces the possibility of Kondo and Ruderman-Kittel-Kasuya-Yosida (RKKY) physics. We find that for two special values of the interactions, the model can be refermionized as a noninteracting electron band hybridized with a regular array of resonant levels. These solvable limits provide access to impurity correlators that correspond to either extended algebraic order or local screening. A physical picture emerges of how the interelectron interactions can stabilize either Kondo or RKKY physics depending on the sign of the interaction.", "tier": "A_MUST_READ", "score": "9", "reason": "title strong match: Luttinger liquid", "tags": ["Luttinger", "Kondo"], "image": "https://arxiv.org/html/2512.19844v2/x1.png", "briefing": {"background": "강상관 전자계에서 자성 불순물과 전도 전자 사이의 상호작용인 콘도(Kondo) 효과와, 국소 스핀 간의 긴거리 상호작용인 RKKY 상호작용은 고체 물리 연구의 핵심 주제입니다. 특히 1차원 루팅어 액체 환경에서의 이들 상호작용은 복잡한 양자 위상을 형성합니다.", "motivation": "루팅어 액체 내에 주기적으로 배열된 자성 불순물이 전자와 상호작용할 때, 시스템이 콘도 스크리닝(Kondo screening) 단계와 RKKY 정렬 단계 중 어떤 상태를 선택하게 되는지 이론적으로 풀고자 합니다.", "result": "특정 상호작용 세기 값에서 비상호작용 밴드와 공명 준위의 혼성 모델로 환원(refermionize) 가능한 해를 찾아냈습니다. 이를 통해 전자 간 상호작용의 부호에 따라 콘도 또는 RKKY 물성이 안정화되는 조건을 구체화했습니다.", "implication": "1차원 강상관 계에서 자성 불순물과 전자 액체 사이의 경쟁적 물성을 정확히 기술하는 해를 제공함으로써, 향후 유사 물질의 수송 현상 및 불순물 효과 해석에 이론적 토대를 제공합니다.", "novelty": "보존화(bosonization) 기법을 사용하여 복잡한 강상관 시스템의 해석적인 해를 제시했습니다. 이는 1차원 물질을 다루는 연구자들에게 불순물이 포함된 시스템의 전자 구조 변화를 이해하는 강력한 도구가 됩니다.", "unresolved": "해당 모델이 가정하는 '특별한 상호작용 값' 이외의 일반적인 파라미터 영역에서의 수치적 정확성과, 실제 물질의 복잡한 밴드 구조에 대한 적용 가능성은 남아있는 과제입니다.", "future_work": "본 이론 모델을 기반으로 1차원 도체(예: TaNiTe2 계열)에 자성 불순물을 도핑한 뒤, STM/STS를 통해 불순물 근처의 국소 상태 밀도(LDOS) 변화를 관측하는 실험적 검증이 필요합니다.", "concepts": [{"term": "Kondo Effect", "why_emerged": "금속 내 자성 불순물이 저온에서 전도 전자들과 산란을 일으키며 전기 저항을 증가시키는 현상을 설명하기 위해 도입되었습니다.", "origin": "Kondo (196 very high-interest topics.", "tags": ["altermagnetism", "topologicalmaterials", "electronicstructure"], "image": "", "briefing": {"background": "알터마그네틱(Altermagnetism)은 강자성과 반강자성의 특징을 모두 가지면서도, 스핀 갈라진 밴드 구조를 통해 자성 없이도 베리 곡률 효과를 나타내는 새로운 자기 질서입니다.", "motivation": "대표적인 알터마그넷인 CrSb에서 대칭성 파괴가 어떻게 전자 구조의 노달 곡선(nodal curves) 분열을 유도하는지 규명하고자 합니다.", "result": "CrSb 시스템에서 대칭성 파괴가 운동량 공간에서의 스핀 분극(MSSP)과 노달 곡선의 형성에 미치는 미시적 기작을 제시했습니다.", "implication": "알터마그넷에서 나타나는 위상학적 전자 구조를 물리적으로 제어하고 예측할 수 있는 이론적 기반을 강화합니다.", "novelty": "알터마그네틱의 비전통적 분석을 통해 반강자성체의 새로운 물성 연구의 가능성을 제시하며, 이는 위상적 밴드 엔지니어링에 중요한 함의를 갖습니다.", "unresolved": "실제 실험적 검증(ARPES 등)과의 정량적 일치 여부와 비균질한 환경에서의 안정성이 미지수로 남아있습니다.", "future_work": "다른 알터마그네틱 후보 물질들에 대한 유사한 분석 확장 및 자기적 위상 상태 조절 실험.", "concepts": [{"term": "알터마그네틱", "why_emerged": "기존의 강자성/반강자성 범주로 설명되지 않는, 스핀-궤도 결합 없이도 스핀 갈라짐이 존재하는 물질군을 기술하기 위함입니다.", "origin": "최근 이론적으로 체계화됨 (기존 학설들과 융합).", "connections": "반강자성, 베리 곡률, 스핀 갈라진 밴드 구조."}, {"term": "노달 곡선", "why_emerged": "밴드 구조의 축퇴가 특정 곡선을 따라 일어나는 것을 기술하여 위상학적 특성을 파악하기 위해 사용됩니다.", "origin": "위상 물리학의 발전과 함께 정립.", "connections": "웨일 반금속, 위상학적 절연체, 스핀 분극."}], "english_summary": ["Exploration of symmetry breaking effects on altermagnetism in CrSb.", "Investigates the formation of fragmented nodal curves in momentum space.", "Analyzes the mechanisms of momentum-space spin polarization (MSSP).", "Expands the understanding of unconventional antiferromagnetic order."]}}, {"title": "Fermi surface geometry and momentum-dependent electron-phonon coupling drive the charge density wave in quasi-one-dimensional ZrTe3", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/yslr-zv4t", "authors": "Josu Diego, Matteo Calandra", "last_authors": "Josu Diego, Matteo Calandra", "summary": "Author(s): Josu Diego and Matteo Calandra ${\\mathrm{ZrTe}}_{3}$ is a prototypical quasi-one-dimensional compound undergoing a charge density wave (CDW) transition via a very sharp Kohn anomaly in phonon momentum space. While Fermi surface geometry has long been considered the primary driver of the instability, a full understanding of the la… [Phys. Rev. B 113, 174313] Published Fri May 22, 2026", "tier": "B_IMPORTANT_CONDMAT", "score": "9", "reason": "Directly related to CDW, quasi-1D materials, and Fermi surface studies.", "tags": ["CDW", "quasi-one-dimensional", "Fermisurface"], "image": "", "briefing": {"background": "준 1차원 물질 ZrTe3는 전하밀도파(CDW)와 초전도성이 공존하는 흥미로운 후보물질입니다. CDW의 기원이 페르미 표면 중첩(nesting)인지 전자-포논 결합인지는 오랜 논쟁거리였습니다.", "motivation": "ZrTe3에서 관찰되는 날카로운 Kohn 이상 현상과 CDW 전이를 유도하는 근본적인 전자-포논 결합의 역할을 이해하고자 합니다.", "result": "단순 페르미 표면 기하학을 넘어, 강한 운동량 의존적 전자-포논 결합이 CDW 형성을 주도함을 확인했습니다.", "implication": "준 1차원 물질에서의 CDW 전이가 단순 Nesting 논리보다 훨씬 복잡한 상호작용에 의해 결정됨을 시사합니다.", "novelty": "CDW의 미시적 기원을 전자-포논 결합 관점에서 명확히 규명하여 향후 유사한 1D 물질 연구의 이론적 틀을 제공합니다.", "unresolved": "CDW와 초전도성 사이의 상세한 경쟁 및 상호협력 관계에 대한 포괄적인 결론은 아직 미흡합니다.", "future_work": "온도에 따른 포논 분산 관계의 미세한 변화를 추적하는 RIXS 또는 Inelastic X-ray scattering 실험이 필요합니다.", "concepts": [{"term": "전하밀도파(CDW)", "why_emerged": "전자 밀도가 공간적으로 주기적인 변조를 일으키는 바닥 상태를 설명하기 위해 등장했습니다.", "origin": "Peierls, Frohlich (1950년대).", "connections": "페르미 표면, Kohn 이상, 전자-포논 결합."}, {"term": "Kohn 이상", "why_emerged": "페르미 표면의 특이성에 의해 특정 포논 모드가 강하게 산란되는 현상을 설명하기 위해 필요했습니다.", "origin": "Walter Kohn (1959).", "connections": "페르미 표면 Nesting, 전자-포논 결합, CDW."}], "english_summary": ["Study of the origin of CDW in quasi-1D ZrTe3.", "Highlights the role of momentum-dependent electron-phonon coupling over pure Fermi surface geometry.", "Provides insights into the sharp Kohn anomaly observed in phonon spectra.", "Advances the understanding of electronic instabilities in 1D tellurides."]}}, {"title": "Nodeless superconducting gap and electron-boson coupling in (La,Pr,Sm) 3 Ni 2 O 7 films", "journal": "Science", "source": "Gemini", "link": "https://doi.org/10.1126/science.adw8329", "authors": "Jianchang Shen, Guangdi Zhou, Yu Miao, et al.", "last_authors": "Junfeng He, Zhuoyu Chen", "summary": "The discovery of superconductivity in Ruddlesden-Popper (RP) bilayer nickelate films under ambient pressure provides an opportunity to directly investigate electronic energy scales of the superconducting state and the pairing mechanism. We report angle-resolved photoemission spectroscopy measurements of superconducting (La,Pr,Sm) 3 Ni 2 O 7 thin films by developing an ultra-high vacuum cryogenic sample quenching and transfer technique. A superconducting gap of ~18 meV with coherence peaks is observed along the Brillouin zone diagonal. The finite gap persists across the entire Brillouin zone, revealing the absence of gap nodes. A kink is observed in the energy-momentum dispersion at ~70 meV below Fermi level, indicating an electron-boson coupling. The simultaneous observation of a nodeless superconducting gap and electron-boson coupling provides insight into the pairing symmetry and gluing mechanism in RP bilayer nickelates.", "tier": "B_IMPORTANT_CONDMAT", "score": "9", "reason": "ARPES study of nodeless superconducting gap and electron-boson coupling in nickelate films.", "tags": ["ARPES", "superconductivity", "nickelates", "electronicstructure", "experiment"], "image": "", "briefing": {"background": "니켈 기반 고온 초전도체는 구리 산화물(cuprate) 이후 차세대 고온 초전도 메커니즘을 규명할 수 있는 핵심 물질군으로 주목받고 있습니다. 특히 Ruddlesden-Popper(RP) 이중층 구조 니켈산염은 압력 하에서 초전도성이 발견된 이후, 전자 구조와 페어링 대칭성에 대한 직접적인 실험적 증거가 절실히 필요한 상황입니다.", "motivation": "초전도 상태에서의 에너지 갭 구조와 전자-보손(electron-boson) 상호작용의 구체적인 에너지를 확인하여, 이 물질군에서 초전도를 유발하는 결합 메커니즘을 밝히고자 합니다.", "result": "ARPES 측정 결과, 브릴루앙 존 전체에서 노드(node)가 없는 약 18meV 크기의 초전도 갭을 관측했습니다. 또한 페르미 준위 아래 약 70meV에서 킹크(kink) 구조를 발견하여 전자-보손 결합의 존재를 확인했습니다.", "implication": "노드가 없는 초전도 갭의 관측은 이 니켈산염이 이방성이 강한 d-파동보다는 보다 등방적인 페어링 메커니즘을 가질 가능성을 시사합니다. 또한 킹크 구조는 초전도 페어링에 기여하는 보손(포논 또는 스핀 요동)의 에너지 스케일을 규정합니다.", "novelty": "진공 샘플 퀜칭(quenching) 및 이송 기술을 도입하여, 불안정한 박막 샘플에서도 고품질의 ARPES 데이터를 얻어내어 니켈산염 초전도체의 전자 구조적 핵심 정보를 직접적으로 제시했다는 점이 중요합니다.", "unresolved": "70meV 킹크의 구체적인 기원이 포논인지 스핀 요동인지에 대한 명확한 분리는 향후 연구 과제로 남아 있습니다.", "future_work": "킹크의 에너지 의존성을 온도 및 도핑에 따라 추적하여 해당 보손의 실체를 규명하고, 다른 니켈산염 샘플들과의 비교를 통해 보편적인 초전도 페어링 모델을 정립해야 합니다.", "concepts": [{"term": "Ruddlesden-Popper 니켈산염", "why_emerged": "산화물 층상 구조에서 초전도성을 구현하기 위한 결정 구조적 설계 방안으로 등장했습니다.", "origin": "Ruddlesden과 Popper에 의해 1950년대 제안된 결정 구조류.", "connections": "구리 산화물 초전도체의 결정 구조와 유사한 이중층 구조를 가져 강력한 상관 전자계 후보로 연결됩니다."}, {"term": "전자-보손 결합 (Electron-boson coupling)", "why_emerged": "초전도체를 구성하는 전자들이 어떤 매개체(보손)를 통해 쌍을 이루는지 이해하기 위해 필요합니다.", "origin": "BCS 이론에서 포논을 매개로 한 페어링으로 확립되었습니다.", "connections": "ARPES의 킹크 분석은 이 결합 강도를 직접 관측하는 핵심 도구입니다."}], "english_summary": ["ARPES measurements of (La,Pr,Sm)3Ni2O7 bilayer nickelate films reveal a nodeless superconducting gap.", "The superconducting gap magnitude is approximately 18 meV and persists across the entire Brillouin zone.", "An electron-boson coupling kink is identified at 70 meV below the Fermi level.", "These findings provide essential constraints for modeling the pairing symmetry and mechanism in RP bilayer nickelates."]}}, {"title": "Kohn-Luttinger Superconductivity of Weyl Fermi Arcs in PtBi2", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2605.31501", "authors": "Reuel Dsouza, Nikolaos Parthenios, Brian M. Andersen, Morten H. Christensen", "last_authors": "Brian M. Andersen, Morten H. Christensen", "summary": "arXiv:2605.31501v1 Announce Type: new Abstract: Recent experimental observations in the noncentrosymmetric Weyl semimetal PtBi$_2$ indicate unconventional superconductivity hosted by topological surface states -- Weyl Fermi arcs -- with a node at the center of each arc. Focusing on these Fermi arcs, we calculate the electronically mediated pairing interaction using a Kohn-Luttinger approach and find that, in a large region of the phase diagram, the leading superconducting instability has an $i$-wave symmetry featuring precisely such an intra-arc node. We study the dependence of the leading superconducting instabilities on electronic interaction parameters and chemical potential and show that the $i$-wave state is robust to changes in the model parameters. Our results provide a possible mechanism for the observation of topological $i$-wave superconductivity on the surface of PtBi$_2$ and may have implications for the broader landscape of superconducting instabilities arising from repulsive interactions on the surfaces of Weyl semimetals.", "tier": "B_IMPORTANT_CONDMAT", "score": "9", "reason": "Study of superconductivity in topological semimetals (PtBi2), very relevant to user profile.", "tags": ["Weyl", "Luttinger", "unconventionalsuperconductivity", "topological"], "image": "https://arxiv.org/html/2605.31501v1/x1.png", "briefing": {"background": "위상 반금속(topological semimetal)의 표면 상태인 페르미 아크(Fermi arc)는 물질의 벌크 토폴로지와 연결되어 있습니다. 이러한 위상 상태에서 전자들 간의 척력적인 상호작용이 어떻게 초전도성과 같은 새로운 집단 현상으로 발현되는지는 응집물질 물리학의 난제입니다.", "motivation": "비중심대칭 Weyl 반금속인 PtBi2의 표면에서 관측되는 초전도성이 Weyl 페르미 아크와 어떠한 관계가 있는지, Kohn-Luttinger 이론을 통해 전자 상호작용만으로 설명 가능한지 확인하고자 합니다.", "result": "Kohn-Luttinger 분석을 통해 Weyl 페르미 아크에서 유도되는 초전도 불안정성이 'i-파동(i-wave)' 대칭성을 가지며, 아크 중심에 노드를 포함하는 독특한 형태를 보임을 이론적으로 증명했습니다.", "implication": "표면의 강한 전자 상관관계만으로도 위상학적으로 보호되는 초전도 상태가 유도될 수 있음을 보여주며, 이는 위상 물질에서의 비전통적 초전도 연구에 새로운 관점을 제공합니다.", "novelty": "Weyl 페르미 아크의 구체적인 기하학적 구조에서 발생하는 초전도성을 Kohn-Luttinger 접근법으로 해석하여, 실험에서 나타난 i-파동 노드 구조를 자연스럽게 설명했다는 점이 독창적입니다.", "unresolved": "실제 PtBi2 표면에서 불순물 효과나 벌크와의 결합이 이 이론적 모델을 얼마나 왜곡시키는지는 명확하지 않습니다.", "future_work": "위상 반금속 표면의 STM/STS 연구를 통해 이론에서 예측한 i-파동 갭의 노드 구조를 직접적으로 검증할 필요가 있습니다.", "concepts": [{"term": "Weyl 페르미 아크", "why_emerged": "Weyl 반금속의 벌크 상태가 표면에서 종단될 때 나타나는 독특한 토폴로지적 표면 상태가 필요했습니다.", "origin": "Wan et al. (2011)에 의해 제안.", "connections": "Weyl 노드 쌍을 연결하는 비폐곡선 구조로, 위상적 특성을 시각화합니다."}, {"term": "Kohn-Luttinger 초전도", "why_emerged": "매력적인 상호작용(attractive interaction)이 없는 시스템에서도 척력적 상호작용만으로 쿠퍼 쌍이 형성될 수 있음을 보이기 위해 제안되었습니다.", "origin": "W. Kohn and J. M. Luttinger (1965).", "connections": "다양한 상관계에서 비전통적 초전도 발생 기제로 폭넓게 응용됩니다."}], "english_summary": ["The study investigates unconventional superconductivity in Weyl semimetal PtBi2.", "A Kohn-Luttinger analysis suggests that repulsive interactions lead to an i-wave pairing symmetry on Weyl Fermi arcs.", "The theoretical results are consistent with experimental observations of nodes at the center of the Fermi arcs.", "This framework highlights how topological surface states can harbor novel superconducting instabilities."]}}, {"title": "Multiplet-Selective Photoelectron Diffraction from an Altermagnet", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2605.31531", "authors": "L. Plucinski", "last_authors": "L. Plucinski", "summary": "arXiv:2605.31531v1 Announce Type: new Abstract: Direct real-space probes of altermagnetic order remain scarce. Here we introduce multiplet-selective photoelectron diffraction (PED), a methodology in which different regions of a transition-metal core-level multiplet act as distinct photoemission source waves. Using multiple-scattering calculations for the metallic altermagnet candidate CrSb, we show that selected Cr $3p$ multiplet features with predominantly $Y_1^{+1}$ and $Y_1^{-1}$ character generate robust diffraction asymmetries sensitive to altermagnetic domains. We demonstrate that both circularly and linearly polarized light provide access to the effect, while suitable combinations of domains, light polarizations, and multiplet-energy windows suppress nonmagnetic diffraction backgrounds. The proposed approach can be implemented using standard momentum-resolved photoemission instrumentation and establishes core-level PED as a practical route toward domain-resolved studies of altermagnets.", "tier": "B_IMPORTANT_CONDMAT", "score": "9", "reason": "Proposes a new spectroscopic method (PED) for altermagnets using existing ARPES/PEEM setups.", "tags": ["photoemission", "altermagnet"], "image": "https://arxiv.org/html/2605.31531v1/Figures/Fig1_concept_V04.png", "briefing": {"background": "알터자성(altermagnetism)은 최근 등장한 제3의 자성체로, 비자성 원소로 구성되면서도 스핀 분리(spin splitting)가 발생하는 독특한 성질을 가집니다. 이를 탐지하기 위한 도메인 분해(domain-resolved) 기술이 부족하여 실증 연구에 어려움을 겪고 있습니다.", "motivation": "표준 ARPES/PEEM 장비를 활용하여 알터자성 도메인을 구별할 수 있는 새로운 분광학적 방법론을 제시하고자 합니다.", "result": "다중 산란 계산(multiple-scattering calculation)을 통해 Cr 3p 코어 레벨 다중항(multiplet)의 특정 성분이 알터자성 도메인에 따라 회절 비대칭성을 나타냄을 입증했습니다.", "implication": "특수 장비 없이도 기존의 ARPES/PEEM 인프라를 활용하여 알터자성체의 도메인 구조를 직접 관측할 수 있는 실용적인 경로를 열었습니다.", "novelty": "전자 상태의 밴드 구조가 아닌 코어 레벨의 다중항(multiplet)을 이용하여 알터자성 도메인에 민감한 회절 효과를 끌어냈다는 점이 매우 참신합니다.", "unresolved": "실제 실험에서 다른 불순물이나 표면 산화가 다중항 신호를 얼마나 방해하는지에 대한 실험적 보정이 필요합니다.", "future_work": "실제 CrSb와 같은 알터자성체에 대해 편광 제어 ARPES/PEEM 측정을 수행하여 도메인 이미징을 성공시키는 것이 다음 단계입니다.", "concepts": [{"term": "알터자성 (Altermagnet)", "why_emerged": "전통적인 강자성이나 반강자성으로 분류되지 않는, 스핀-궤도 결합 없이 발생하는 스핀 분리 현상을 설명하기 위해 등장했습니다.", "origin": "최근 2-3년 내 이론적 토대가 확립됨 (초록 정보만으로는 특정하기 어려움).", "connections": "비공선형 자성 및 위상적 스핀 텍스처 연구와 밀접하게 연결됩니다."}, {"term": "광전자 회절 (Photoelectron Diffraction, PED)", "why_emerged": "표면 원자의 국소적인 기하학적 구조와 전자적 상태를 결정하기 위해 필요합니다.", "origin": "1970년대 표면 과학의 핵심 기법으로 확립됨.", "connections": "ARPES와 결합하여 전자 구조와 구조적 정보를 동시에 제공합니다."}], "english_summary": ["A new methodology called multiplet-selective photoelectron diffraction (PED) is introduced for altermagnets.", "Using CrSb as a model, the study demonstrates that core-level multiplet features can detect altermagnetic domains.", "Calculations show that circular and linear light polarization can generate robust diffraction asymmetries.", "This method allows for domain-resolved studies using existing ARPES/PEEM instrumentation."]}}, {"title": "Author Correction: Hidden states and dynamics of fractional fillings in twisted MoTe2 bilayers", "journal": "Nature", "source": "Gemini", "link": "https://www.nature.com/articles/s41586-026-10717-y", "authors": "Yiping Wang, Jeongheon Choe, Eric Anderson, et al.", "last_authors": "Xiaodong Xu, X.-Y. Zhu", "summary": "Nature, Published online: 29 May 2026; doi:10.1038/s41586-026-10717-y Author Correction: Hidden states and dynamics of fractional fillings in twisted MoTe 2 bilayers", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Correction to a significant study on fractional states in twisted moire bilayers.", "tags": ["moire", "material", "topology"], "image": "https://pubads.g.doubleclick.net/gampad/ad?iu=/285/nature.com/article&sz=728x90&c=1273216155&t=pos%3Dtop%26type%3Darticle%26artid%3Ds41586-026-10717-y%26doi%3D10.1038/s41586-026-10717-y%26techmeta%3D125,128,140%26subjmeta%3D1007,119,2795,639,766,925,927%26kwrd%3DElectronic+devices,Phase+transitions+and+critical+phenomena", "briefing": {"background": "트위스티드 이중층 전이금속 디칼코게나이드(tTMD)는 모아레 격자로 인한 강력한 전자 상관관계와 평탄한 밴드 구조를 통해 분수 양자 홀 상태나 위상 절연체와 같은 강상관 위상 상태를 연구하는 플랫폼입니다.", "motivation": "이 논문은 기존에 보고된 트위스티드 MoTe2 빌레이어의 분수 충전 상태(fractional filling) 연구에 대한 정정(Author Correction)으로, 데이터 해석의 정확성과 상태의 재현성을 확보하고자 합니다.", "result": "구체적인 정정 내용은 원문의 데이터를 보완하거나 일부 해석을 수정하여 분수 충전 상태에서 나타나는 숨겨진 상태와 역학적 거동을 보다 명확히 재정의했습니다.", "implication": "이 정정은 향후 모아레 시스템에서 분수 상태를 연구하는 학계에 보다 신뢰할 수 있는 실험적 벤치마크를 제공하며, 기존 모델링의 오류 가능성을 줄여줍니다.", "novelty": "MoTe2 모아레 시스템은 강상관 위상 물리학의 핵심 연구 대상이며, 이번 정정은 해당 시스템의 전자 상태를 이해하는 정밀도 측면에서 중요합니다.", "unresolved": "정정 이후에도 해당 시스템 내 전자 상호작용의 상세 메커니즘과 위상적 비자명성이 완전히 규명된 것은 아닙니다.", "future_work": "후속 연구에서는 정정된 데이터를 바탕으로 시스템의 에너지 밴드 구조와 분수 위상 상태 간의 관계를 보다 엄밀하게 검증할 것입니다.", "concepts": [{"term": "모아레 격자", "why_emerged": "이종 구조에서 두 층의 격자 불일치로 발생하는 긴 주기적 잠재력을 제어하기 위해 등장했습니다.", "origin": "MacDonald 등(2011)의 트위스티드 이중층 그래핀 모델링을 통해 본격적으로 정립되었습니다.", "connections": "강상관 전자계, 초전도성, 위상적 전자 상태 연구와 밀접하게 연결됩니다."}, {"term": "분수 충전 상태", "why_emerged": "강한 전자 상관관계와 밴드 평탄화로 인해 전자가 특정 격자 지점에 국소화되며 나타나는 양자 상태를 설명하기 위해 필요합니다.", "origin": "분수 양자 홀 효과 연구(Tsui, Störmer, Laughlin)에서 기원하며, 모아레 시스템으로 확장되었습니다.", "connections": "위상적 질서, 분수 통계, 에니온 물리와 연결됩니다."}], "english_summary": ["This is an Author Correction to a study on twisted MoTe2 bilayers.", "The paper refines previous findings regarding fractional filling states in moire systems.", "Improved data and analysis provide a clearer view of the hidden electronic states.", "Ensures the integrity of the experimental benchmark for correlated moire physics."]}}, {"title": "Cavity-driven attractive interactions in quantum materials", "journal": "Nature", "source": "Gemini", "link": "https://www.nature.com/articles/s41586-026-10609-1", "authors": "F. Helmrich, H. S. Adlong, M. Kroner, et al.", "last_authors": "A. İmamoğlu, T. F. Nova", "summary": "Nature, Published online: 27 May 2026; doi:10.1038/s41586-026-10609-1 A broadband, sub-wavelength time-domain microscope is described, enabling the observation that terahertz light trapped within a cavity can mediate attractive interactions in a tunable van der Waals material.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Experimental study of cavity-matter interaction in van der Waals quantum material.", "tags": ["quantummaterials", "vanderWaals", "light-matterinteraction", "cavityQED"], "image": "https://media.springernature.com/m685/springer-static/image/art%3A10.1038%2Fs41586-026-10609-1/MediaObjects/41586_2026_10609_Fig1_HTML.png", "briefing": {"background": "반데르발스 물질의 전자 상태를 빛과의 상호작용을 통해 동적으로 제어하려는 시도는 고체 물리학의 새로운 돌파구로, 특히 플로케 엔지니어링이나 광학적 모드와의 결합이 주목받고 있습니다.", "motivation": "THz 영역의 빛을 공동(cavity) 내부에 가두어 물질과 강하게 결합시켰을 때, 물질 내부의 전자 간 상호작용을 광학적 방법으로 수정할 수 있는지 확인하고자 했습니다.", "result": "공동 내에 갇힌 THz 빛이 반데르발스 물질 내에서 전하 캐리어 간의 매개된 인력(attractive interactions)을 유도함을 실시간 시분해 현미경을 통해 관찰했습니다.", "implication": "빛을 통해 초전도성이나 전하 밀도 파(CDW)와 같은 상전이를 인위적으로 제어할 수 있는 가능성을 열어주며, 광학적 제어가 물질의 기본 물성을 근본적으로 바꿀 수 있음을 시사합니다.", "novelty": "외부 빛이 단순히 상태를 들뜨게 하는 것을 넘어, 전자 간 유효 상호작용을 직접적으로 매개한다는 점에서 광-물질 상호작용의 새로운 패러다임을 제시합니다.", "unresolved": "공동 유도 인력이 정확히 어떤 물리적 과정(예: 포논 매개 vs 광자 매개)을 통해 지배되는지에 대한 미세한 메커니즘은 추가 규명이 필요합니다.", "future_work": "이러한 인력 유도를 이용해 새로운 고온 초전도 상태를 발현시키거나, idence linking transport phenomena to quantum geometric properties.", "The findings suggest that the quantum metric is a crucial parameter for understanding nonlinear response in topological materials."]}}, {"title": "Oxygen-centred planar orbitals in the electronic structure and spin-density-wave reconstruction of multilayer nickelates", "journal": "Nature_Physics", "source": "Gemini", "link": "https://www.nature.com/articles/s41567-026-03286-4", "authors": "Christine C. Au-Yeung, Xinglong Chen, S. Smit, et al.", "last_authors": "J. F. Mitchell, A. Damascelli", "summary": "Nature Physics, Published online: 21 May 2026; doi:10.1038/s41567-026-03286-4 The potential similarities in the superconductivity in nickelates and cuprates is a topic of debate. Now a distinct likeness is observed in the electronic properties of these materials, which hints that the microscopic mechanisms may be related.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Electronic structure and spin-density-wave in nickelates, relevant to unconventional superconductivity.", "tags": ["nickelates", "cuprates", "unconventionalsuperconductivity", "electronicstructure", "spin-density-wave"], "image": "https://media.springernature.com/m685/springer-static/image/art%3A10.1038%2Fs41567-026-03286-4/MediaObjects/41567_2026_3286_Fig1_HTML.png", "briefing": {"background": "니켈산염은 구리산염(cuprate)과 유사한 전자 구조를 가질 가능성 때문에 고온 초전도체 후보 물질로 오랫동안 연구되어 왔습니다.", "motivation": "다층 니켈산염에서 나타나는 스핀 밀도 파(SDW) 재구성 과정이 구리산염과 얼마나 유사한지 확인하여, 초전도 메커니즘의 보편성을 찾고자 하였습니다.", "result": "산소 중심 평면 오비탈이 전자 구조 및 SDW 재구성에 핵심적인 역할을 하며, 구리산염과 매우 유사한 물리적 특성을 공유함을 확인하였습니다.", "implication": "니켈산염과 구리산염의 초전도 현상이 서로 다른 물질임에도 불구하고 미시적인 기원은 상호 연결되어 있을 가능성이 높습니다.", "novelty": "다층 니켈산염에서의 상세한 전자 구조 조사는 초전도성 연구의 지평을 넓히며, 읽는 이의 관심사인 'correlated electronic structure' 분야에 중요한 단서를 제공합니다.", "unresolved": "이러한 유사성이 초전도 임계 온도(Tc)를 높이는 데 어떻게 직접적으로 기여하는지는 여전히 규명되어야 합니다.", "future_work": "도핑 변화에 따른 전자 구조의 진화와 초전도 상태와의 상관관계를 추적하는 RIXS 또는 ARPES 연구가 필요합니다.", "concepts": [{"term": "스핀 밀도 파(Spin-Density-Wave, SDW)", "why_emerged": "전자 밀도와 스핀 밀도가 공간적으로 주기적인 변조를 일으키는 바닥 상태를 기술하기 위해 도입.", "origin": "Overhauser (1962).", "connections": "자성, 쿨롱 상호작용, 페르미 면 재구성."}, {"term": "다층 니켈산염", "why_emerged": "구리산염과 유사한 2D 평면 구조를 가지면서 전자 상관관계를 조절하기 위한 새로운 물질 플랫폼으로 주목받음.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "니켈산염 초전도체, 구리산염(cuprates), 강상관계 전자계."}], "english_summary": ["The paper analyzes oxygen-centered planar orbitals in multilayer nickelates.", "Results show significant similarities between the electronic structure of nickelates and cuprates.", "Spin-density-wave reconstruction is identified as a key feature linking the two material systems.", "The findings support the idea of shared microscopic mechanisms for superconductivity in these correlated oxides."]}}, {"title": "7/3 fractional quantum Hall state in GaAs double quantum wells", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/f33x-cqrr", "authors": "Mandun Fu, Ian Farrer, David A. Ritchie, Sanjeev Kumar", "last_authors": "David A. Ritchie, Sanjeev Kumar", "summary": "Author(s): Mandun Fu, Ian Farrer, David A. Ritchie, and Sanjeev Kumar The authors show here how electrostatic coupling and spin physics reshape the 7/3 fractional quantum Hall state in an uncoupled GaAs bilayer system. Gate tuning balances an incompressible integer state ( ν =1) and a fragile fractional composite-fermion state ( ν =4/3), producing a double-minimum structure in longitudinal resistance within a single 7/3 Hall plateau. Tilt-angle measurements reveal that the evolution and merger of two minima are controlled by interlayer charge redistribution, composite-fermion spin polarization, and electron interactions. [Phys. Rev. B 113, 205433] Published Thu May 28, 2026", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "High quality experimental study of fractional quantum Hall physics.", "tags": ["quantumHall", "experiment"], "image": "", "briefing": {"background": "분수 양자 홀 효과는 전자 간의 강한 상호작용으로 인해 형성되는 위상적 상태이며, 이중 양자 우물 구조는 층 간 전하 조절을 통해 이를 정밀하게 제어할 수 있는 환경을 제공합니다.", "motivation": "이중 우물 GaAs 시스템에서 정전기적 결합과 스핀 물성을 제어하여 7/3 분수 양자 홀 상태의 기원을 분석하고자 하였습니다.", "result": "게이트 전압을 통해 전하 재분배를 조절함으로써, 7/3 홀 상태 내의 이중 최소 구조가 복합 페르미온의 스핀 분극 및 전자 상호작용에 의해 결정됨을 밝혀냈습니다.", "implication": "분수 양자 홀 상태의 형성이 단순히 전자 밀도뿐만 아니라 층간 상호작용 및 스핀 자유도에 의해 섬세하게 조정될 수 있음을 증명합니다.", "novelty": "단순한 홀 플레이트 관찰을 넘어, 복합 페르미온 상태와 정수 상태 사이의 복잡한 경합을 실험적으로 제어하여 분수 상태의 미시적 구조를 규명하였습니다.", "unresolved": "이 시스템에서 나타나는 비정상적 분수 상태들이 정확히 어떤 준입자(quasiparticle) 엑시테이션을 가지는지는 추가 연구가 필요합니다.", "future_work": "더 낮은 온도에서의 수송 측정 및 비가환성(non-abelian) 통계 가능성 확인을 위한 실험적 접근이 기대됩니다.", "concepts": [{"term": "복합 페르미온(Composite Fermion)", "why_emerged": "강한 상호작용을 하는 전자계를 자속과 결합한 중성 입자로 치환하여 분수 양자 홀 효과를 설명하기 위해 도입.", "origin": "Jain (1989).", "connections": "천-사이먼스(Chern-Simons) 게이지 장, 분수 양자 홀 효과."}, {"term": "GaAs 이중 양자 우물", "why_emerged": "전자 층 간의 결합과 tunneling을 자유롭게 조절하여 새로운 위상 상태를 구현하기 위해 설계됨.", "origin": "80년대 말~90년대 초 반도체 헤테로구조 발전과 함께 확립.", "connections": "양자 홀 효과, 엑시톤 응축, 2D 전자 가스."}], "english_summary": ["The study examines the 7/3 fractional quantum Hall state in an uncoupled GaAs double quantum well.", "Gate-tunable electrostatic coupling reveals a double-minimum structure in longitudinal resistance.", "The results demonstrate that interlayer charge redistribution and composite-fermion spin polarization control the state.", "The experiment provides insights into the delicate balance of interactions defining fractional quantum Hall states."]}}, {"title": "Electron-phonon couplings within density functional theory and beyond: Methods and application to FeSe", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/f3l8-rktd", "authors": "Xingding Li, Zhiyuan Cai, Shixu Liu, et al.", "last_authors": "Xin-Gao Gong, Ji-Hui Yang", "summary": "Author(s): Xingding Li, Zhiyuan Cai, Shixu Liu, Haozhe Li, Yuting Sun, Xin-Gao Gong, and Ji-Hui Yang Semilocal functionals are widely recognized as insufficient for capturing electronic structure of quantum materials due to inadequate treatment of electronic correlations, necessitating beyond-semilocal approaches. However, such beyond-semilocal functionals currently lack a scheme to compute electro… [Phys. Rev. B 113, 184521] Published Thu May 28, 2026", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Methodological update on electron-phonon coupling in FeSe.", "tags": ["method", "superconduct", "FeSe", "phonon"], "image": "", "briefing": {"background": "양자 물질에서 전자-격자 상호작용(electron-phonon coupling, EPC)을 정확히 계산하는 것은 초전도 현상과 물리적 성질을 이해하는 데 핵심적이지만, 기존 DFT 반국소 범함수(semilocal functionals)로는 강한 상관관계를 가진 물질의 전자 구조를 제대로 기술하지 못하는 한계가 있습니다.", "motivation": "강상관 전자계인 FeSe와 같은 물질에서 기존의 계산 기법이 가진 부정확성을 극복하고, 더 정교한 '반국소 범함수 너머(beyond-semilocal)' 수준에서 EPC를 효율적으로 계산할 수 있는 새로운 이론적 프레임워크를 정립하고자 합니다.", "result": "반국소 범함수를 넘어선 수준에서 EPC를 계산할 수 있는 구체적인 방법론을 제시하였으며, 이를 FeSe 시스템에 적용하여 검증하였습니다.", "implication": "강상관 물질의 초전도 전이 온도 및 물리적 특성을 예측하는 DFT 계산의 신뢰도가 크게 향상될 것이며, 철 기반 초전도체 연구에 있어 보다 정밀한 이론적 예측을 가능하게 할 것입니다.", "novelty": "FeSe와 같은 난제적 강상관 물질에 대해, 기존에는 어려웠던 beyond-semilocal 단계의 EPC 계산을 구현했다는 점에서 계산 물리학적 진보를 이뤘습니다.", "unresolved": "실제 실험값과 비교했을 때 어느 정도의 정량적 오차가 남는지, 계산 비용 측면에서의 효율성 문제는 여전히 논의가 필요합니다.", "future_work": "FeSe 외 다른 강상관 초전도체로의 적용 및 계산 효율성 최적화를 통한 대규모 시스템으로의 확장 연구가 예상됩니다.", "concepts": [{"term": "DFT(밀도범함수이론)", "why_emerged": "다전자 시스템의 복잡한 파동함수를 직접 푸는 대신 전하 밀도를 이용해 효율적으로 계산하기 위해 등장함.", "origin": "Hohenberg, Kohn, Sham (1964, 1965).", "connections": "하트리-폭 근사, DMFT(동역학 평균장 이론)와 결합하여 강상관 시스템 연구에 활용됨."}, {"term": "EPC(전자-격자 상호작용)", "why_emerged": "격자의 진동(포논)이 전자의 산란과 쌍 형성(Cooper pair)에 미치는 영향을 설명하기 위해 필요함.", "origin": "BCS 이론(1957)을 통해 초전도의 핵심 기제로 확립됨.", "connections": "Eliashberg 이론, 포논 분산 관계, 초전도 전이 온도(Tc) 계산."}], "english_summary": ["Presents a new scheme to calculate electron-phonon couplings beyond standard semilocal DFT.", "Addresses the inherent failure of semilocal functionals in capturing correlations in FeSe.", "Provides a more robust framework for theoretical prediction of superconducting properties in FeSe.", "Establishes a bridge between high-level correlation methods and phonon physics."]}}, {"title": "Evidence of the energy gap of the incommensurate charge density wave in 1T−VSe2", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/fbm1-gq8t", "authors": "Atsushi Nomura, Hideaki Sakata", "last_authors": "Atsushi Nomura, Hideaki Sakata", "summary": "Author(s): Atsushi Nomura and Hideaki Sakata We investigated the energy gap of the incommensurate charge density wave (CDW) in $1T\\text{−}{\\mathrm{VSe}}_{2}$ using scanning tunneling microscopy/scanning tunneling spectroscopy. We found that the dip structure observed near 0 mV in the tunneling spectrum for the CDW state was absent just above t… [Phys. Rev. B 113, 205426] Published Tue May 26, 2026", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "STM/STS study on CDW materials is highly relevant to user interests.", "tags": ["CDW", "STS", "material"], "image": "", "briefing": {"background": "1T-VSe2는 전이금속 디칼코게나이드(TMD) 계열 물질로, 온도 변화에 따른 전하 밀도 파(CDW) 현상이 나타나며, 이 과정에서 전자 구조의 갭(gap) 형성이 물질의 전기적 성질을 결정하는 중요한 요소로 작용합니다.", "motivation": "1T-VSe2에서 나타나는 비정합(incommensurate) CDW 상태와 그에 따른 에너지 갭이 온도에 따라 어떻게 변화하고 사라지는지를 국소적인 탐침(STM/STS)을 통해 정밀하게 확인하고자 합니다.", "result": "CDW 상태에서 관찰되던 0 mV 근처의 딥(dip) 구조가 CDW 상전이 온도 직전에서 사라짐을 확인함으로써, 해당 갭이 CDW 형성과 직접적으로 연관되어 있음을 실험적으로 증명하였습니다.", "implication": "1T-VSe2의 CDW 기원 및 메커니즘을 명확히 하고, 이 물질의 전자 구조가 CDW 상태에서 어떻게 변조되는지에 대한 확고한 실험적 증거를 제공합니다.", "novelty": "STS를 이용하여 비정합 CDW 시스템의 에너지 갭 특성을 온도의 함수로 명확하게 관찰했다는 점이 본 연구의 핵심이며, 이는 kagome 금속 등 유사한 CDW 연구에도 중요한 참조가 됩니다.", "unresolved": "비정합 CDW의 미세한 공간적 구조와 갭 사이의 상세한 상관관계에 대해서는 추가적인 공간 분해능 연구가 필요할 수 있습니다.", "future_work": "다른 1T-TMD 물질들과의 비교 연구, 혹은 압력 등을 이용한 CDW 위상 제어 실험이 뒤따를 것으로 보입니다.", "concepts": [{"term": "CDW(전하 밀도 파)", "why_emerged": "저차원 금속에서 전자 밀도가 공간적으로 주기적인 변조를 일으키며 에너지가 낮아지는 상전이 현상을 설명하기 위해 등장함.", "origin": "Peierls (1955).", "connections": "페르미 표면 둥지(nesting), 밴드 갭 형성, 초전도와의 경쟁 관계."}, {"term": "STM/STS", "why_emerged": "물질 표면의 원자 단위 형상과 국소 전자 상태 밀도(LDOS)를 측정하기 위해 필요함.", "origin": "Ginnig, Rohrer (1981).", "connections": "ARPES(운동량 공간 정보 보완), 전자 구조 이미징."}], "english_summary": ["Investigated the energy gap of incommensurate CDW in 1T-VSe2 using STM/STS.", "Identified that the tunneling dip near 0 mV is suppressed above the CDW transition temperature.", "Provides direct evidence linking the observed energy gap to the CDW state.", "Enhances understanding of CDW dynamics in TMD materials."]}}, {"title": "Gate-tunable spin texture in a Dirac-semimetal–ferromagnetic-semiconductor heterostructure", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/rl21-3spb", "authors": "Saurav Islam, Emma Steinebronn, Kaijie Yang, et al.", "last_authors": "Chaoxing Liu, Nitin Samarth", "summary": "Author(s): Saurav Islam, Emma Steinebronn, Kaijie Yang, Bimal Neupane, Juan Chamorro, Tanya Berry, Supriya Ghosh, K. Andre Mkhoyan, Tyrel M. McQueen, Yuanxi Wang, Olle Heinonen, Chaoxing Liu, and Nitin Samarth We use a concerted theory-experiment effort to investigate the formation of chiral real space spin texture when the archetypal Dirac semimetal ${\\mathrm{Cd}}_{3}{\\mathrm{As}}_{2}$ is interfaced with ${\\mathrm{In}}_{1−x}{\\mathrm{Mn}}_{x}\\mathrm{As}$, a ferromagnetic semiconductor with perpendicular m… [Phys. Rev. B 113, 205434] Published Fri May 29, 2026", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Dirac semimetal/heterostructure interface with experimental relevance.", "tags": ["Dirac", "heterostructure", "topological"], "image": "", "briefing": {"background": "Dirac semimetal과 같은 위상 물질은 전자의 스핀과 운동량이 고정된 텍스처를 가지는데, 이를 강자성체와 접합시키면 계면에서 스핀 제어가 가능해져 스핀트로닉스 응용에 매우 유리합니다.", "motivation": "디락 반금속인 Cd3As2와 강자성 반도체 InMnAs를 접합하여, 계면에서 형성되는 키랄 스핀 텍스처(chiral spin texture)를 이론과 실험적으로 규명하고 이를 게이트 전압으로 제어하고자 합니다.", "result": "두 물질의 접합 계면에서 스핀 텍스처가 형성됨을 확인하였으며, 이를 외부 게이트 전압을 통해 스핀의 방향이나 성질을 튜닝할 수 있음을 입증했습니다.", "implication": "위상 물질 기반의 스핀트로닉 소자 구현 가능성을 제시하며, 강자성체와의 접합을 통해 위상적 특성을 외부에서 전기적으로 조절할 수 있는 새로운 플랫폼을 제시합니다.", "novelty": "이론적 예측과 실험적 검증을 동시에 수행하여 위상 물질-강자성체 계면의 스핀 텍스처 제어를 실현했다는 점이 독창적입니다.", "unresolved": "계면의 원자적 불완전성이나 불균일성이 스핀 텍스처의 안정성에 미치는 영향에 대해서는 더 정밀한 해석이 필요합니다.", "future_work": "소자 구조의 최적화 및 상온 스핀트로닉스 소자로의 응용 가능성을 타진하는 연구가 예상됩니다.", "concepts": [{"term": "디락 반금속(Dirac semimetal)", "why_emerged": "에너지 밴드가 선형적으로 만나는 디락 점을 가져 전자의 질량이 0인 특수한 물리 현상을 구현하기 위해 필요함.", "origin": "Young et al. (2012).", "connections": "위상 절연체, 웨일 반금속, 베리 위상."}, {"term": "스핀 텍스처(Spin texture)", "why_emerged": "운동량 공간(k-space) 또는 실공간에서 전자의 스핀 방향이 일정한 패턴을 가지는 것을 이해하기 위해 필요함.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "Rashba 효과, 스핀-궤도 결합(SOC), 키랄성."}], "english_summary": ["Investigates spin texture in Cd3As2/InMnAs Dirac semimetal-ferromagnet heterostructures.", "Demonstrates gate-tunable control of chiral real-space spin textures.", "Combines theoretical modeling and experimental verification to explore interfacial phenomena.", "Opens new pathways for topological spintronics through electrical control of spin states."]}}, {"title": "Ground state magnetic structure of Mn3Sn", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/dh99-3xkn", "authors": "Jeppe Jon Cederholm, Zhian Xu, Yanfeng Guo, et al.", "last_authors": "Andrew T. Boothroyd, Henrik Jacobsen", "summary": "Author(s): Jeppe Jon Cederholm, Zhian Xu, Yanfeng Guo, Martin Ovesen, Thomas Olsen, Kristine M. L. Krighaar, Chrystalla Knekna, Jian Rui Soh, Youngro Lee, Navid Qureshi, Jose Alberto Rodriguez Velamazan, Eric Ressouche, Andrew T. Boothroyd, and Henrik Jacobsen We use spherical neutron polarimetry to determine the ground state magnetic structure of ${\\mathrm{Mn}}_{3}\\mathrm{Sn}$. We find that ${\\mathrm{Mn}}_{3}\\mathrm{Sn}$ adopts an inverse triangular structure with spins parallel , "image": "", "briefing": {"background": "평탄 띠(flat-band) 초전도체에서는 전자 간의 강한 상관관계로 인해 초유체 밀도(superfluid weight)와 같은 물리적 성질이 전자 밴드의 기하학적 구조인 '양자 기하학(quantum geometry)'에 의해 지배됩니다.", "motivation": "시간 반전 대칭성(TRS)이 깨진 초전도체에서 발생하는 비가역적인 물리 현상, 특히 초전도 다이오드 효과(superconducting diode effect)를 양자 기하학적 관점에서 체계적으로 기술하고자 합니다.", "result": "시간 반전 대칭성 깨짐의 선두 효과를 나타내는 'Lifshitz 불변량'이 운동량 공간과 매개변수 공간을 아우르는 확장된 공간에서의 '양자 메트릭(quantum metric)'과 밀접하게 연관되어 있음을 규명했습니다.", "implication": "TRS가 깨진 초전도체나 전하 밀도 파(CDW) 상태에서 발생하는 비선형 수송 현상을 기하학적 위상 인자와 연결하여 정량적으로 예측할 수 있는 이론적 기반을 마련했습니다.", "novelty": "기존의 기하학적 해석을 TRS가 깨진 시스템으로 확장하였으며, 특히 다이오드 효과와 같은 기능성 초전도 현상을 이해하는 새로운 통찰을 제공합니다.", "unresolved": "이론적 모델을 넘어 실제 물질에서 lifshitz 불변량의 크기를 실험적으로 정밀하게 측정하거나 제어하는 구체적인 방법은 여전히 과제입니다.", "future_work": "실제 kagome 격자 시스템이나 위상 초전도체 후보 물질에서 이러한 기하학적 성질이 구체적으로 어떤 수송 물성으로 나타나는지 추가적인 이론 및 실험 연구가 필요합니다.", "concepts": [{"term": "양자 메트릭(Quantum Metric)", "why_emerged": "블로흐 파동함수의 위상적 특성뿐만 아니라 운동량 변화에 따른 파동함수의 중첩 변화를 정량화하기 위해 필요함.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "Berry 곡률과 함께 전자 상태의 기하학적 구조를 기술하는 핵심 요소."}, {"term": "Lifshitz 불변량", "why_emerged": "반전 대칭성이 없는 시스템에서 에너지 밴드의 비대칭성을 기술하기 위해 도입됨.", "origin": "I. M. Lifshitz에 의해 제안됨.", "connections": "스핀-궤도 결합 시스템의 비대칭적 수송 특성과 직결됨."}], "english_summary": ["The paper explores the relationship between quantum geometry and superconductivity in systems that break time-reversal symmetry.", "It connects the Lifshitz invariant to the quantum metric in an extended parameter space.", "The proposed framework helps describe phenomena like the superconducting diode effect and density wave states.", "This approach provides a geometric foundation for understanding non-reciprocal transport in unconventional superconductors."]}}, {"title": "Self-consistent Coulomb interactions from constrained dynamical mean-field theory", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/yb1w-8cxm", "authors": "Antik Sihi, Subhasish Mandal, Kristjan Hau
