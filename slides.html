<!DOCTYPE html>

<title>Daily Paper Slideshow</title>
<style>
  :root {
    color-scheme: light;
    --bg: #f6f7f4;
    --paper: #ffffff;
    --ink: #111827;
    --muted: #64748b;
    --line: #d8ddd2;
    --accent: #176b87;
    --accent-2: #9a3412;
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; overflow: auto; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: var(--bg); color: var(--ink); }
  .shell { max-width: 1500px; min-height: 100vh; margin: 0 auto; padding: 14px 18px; display: flex; flex-direction: column; }
  .topbar { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 16px; }
  .top-actions { display: flex; align-items: center; gap: 10px; }
  .topbar a, button { border: 1px solid var(--line); border-radius: 8px; background: var(--paper); color: var(--ink); padding: 10px 14px; font-weight: 700; text-decoration: none; cursor: pointer; }
  button.primary { background: var(--accent); border-color: var(--accent); color: white; }
  button:disabled { opacity: 0.45; cursor: not-allowed; }
  .counter { color: var(--muted); font-weight: 700; }
  .slide { min-height: calc(100vh - 82px); background: var(--paper); border: 1px solid var(--line); border-radius: 10px; padding: 18px; box-shadow: 0 18px 42px rgba(15, 23, 42, 0.10); display: grid; grid-template-columns: minmax(310px, 0.86fr) minmax(0, 1.55fr); gap: 18px; overflow: visible; }
  .paper-head { min-width: 0; min-height: 0; overflow: visible; display: flex; flex-direction: column; gap: 12px; }
  .figure { margin: 0; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: #f8fafc; }
  .figure img { display: block; width: 100%; max-height: 41vh; object-fit: contain; background: white; }
  .figure figcaption { padding: 7px 10px; color: var(--muted); font-size: 12px; line-height: 1.3; }
  .head-text { display: flex; flex-direction: column; gap: 9px; min-width: 0; }
  .badges { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .badge { border-radius: 999px; padding: 5px 9px; background: #eef2ff; color: #3730a3; font-size: 12px; font-weight: 800; }
  .score { background: #fee2e2; color: #991b1b; }
  h1 { margin: 0; font-size: 25px; line-height: 1.15; letter-spacing: 0; overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
  h1 a { color: inherit; text-decoration-color: rgba(23, 107, 135, 0.35); text-decoration-thickness: 2px; text-underline-offset: 4px; }
  h1 a:hover { color: var(--accent); text-decoration-color: var(--accent); }
  .meta, .authors, .why, .abstract { font-size: 13px; line-height: 1.45; }
  .meta, .authors { color: var(--muted); }
  .why strong, .abstract strong, .authors strong { color: var(--ink); }
  .authors { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .why { border-left: 4px solid var(--accent-2); padding-left: 10px; color: #374151; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .abstract { border-top: 1px solid var(--line); padding-top: 14px; color: #374151; }
  .original-abstract { border-top: 1px solid var(--line); padding-top: 10px; color: #374151; font-size: 11.5px; line-height: 1.35; overflow-wrap: anywhere; }
  .original-abstract strong { display: block; margin-bottom: 4px; color: var(--ink); }
  .tags { display: flex; flex-wrap: wrap; gap: 8px; }
  .tag { border-radius: 999px; padding: 4px 8px; background: #f1f5f9; color: #475569; font-size: 12px; font-weight: 700; }
  .head-text > .link { display: none; }
  .briefing { min-width: 0; min-height: 0; overflow: visible; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); grid-auto-rows: minmax(0, auto); align-content: start; gap: 11px 18px; border-top: 0; padding-top: 0; }
  .brief-section { min-width: 0; }
  .brief-section.wide { grid-column: 1 / -1; }
  .brief-section h2 { margin: 0 0 4px; font-size: 14px; line-height: 1.22; color: #0f766e; letter-spacing: 0; }
  .brief-section p, .brief-section li { margin: 0; font-size: 12.5px; line-height: 1.42; color: #1f2937; overflow-wrap: anywhere; }
  .brief-section ul { margin: 0; padding-left: 20px; }
  .concepts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 9px 14px; }
  .concept { border-top: 1px solid var(--line); padding-top: 7px; }
  .concept h3 { margin: 0 0 4px; font-size: 13px; color: #7c2d12; letter-spacing: 0; }
  .concept p { margin: 2px 0 0; font-size: 11.5px; line-height: 1.35; color: #374151; overflow-wrap: anywhere; }
  .concept b { color: #111827; }
  .link { color: var(--accent); font-weight: 800; text-decoration: none; }
  .empty { padding: 48px; background: var(--paper); border: 1px solid var(--line); border-radius: 12px; color: var(--muted); }
  @media (max-width: 860px) {
    .shell { padding: 14px; }
    .topbar, .top-actions { align-items: stretch; flex-direction: column; }
    .slide, .briefing, .concepts { grid-template-columns: 1fr; }
    .slide { min-height: auto; overflow: visible; display: grid; }
    h1 { font-size: 28px; }
  }
</style>

const slides = [{"title": "Monolayer van der Waals kagome lattice for high-temperature flat-band physics", "journal": "Nature_Physics", "source": "author whitelist", "link": "https://www.nature.com/articles/s41567-026-03492-0", "authors": "Hyungkun Bong, Choongjae Won, Seongyong Lee, et al.", "last_authors": "Kyle M. Shen, Mingu Kang", "summary": "The experimental realization of intrinsic 2D kagome materials with controllable flat bands has remained challenging. Now a van der Waals kagome material family is shown to host an isolated, gate-tunable flat band down to the monolayer limit.", "tier": "A_MUST_READ", "score": "10", "reason": "author whitelist: Chris Jozwiak", "tags": ["kagome", "vanderWaals", "monolayer", "flatband"], "image": "https://media.springernature.com/m685/springer-static/image/art%3A10.1038%2Fs41567-026-03492-0/MediaObjects/41567_2026_3492_Fig1_HTML.png", "briefing": {"background": "카고메 격자는 평탄 밴드(flat band), 디락 콘, 반 호브 특이점을 동시에 가질 수 있어 상관 전자 물리와 위상 상태를 연구하기에 이상적인 플랫폼입니다. 하지만 기존의 AV3Sb5와 같은 벌크 카고메 금속은 3차원성이 강해, 순수한 2차원 한계에서의 물리나 게이트 전압을 이용한 밴드 튜닝을 연구하는 데 한계가 있었습니다.", "motivation": "본 연구는 단층(monolayer) 극한에서도 고립되고 게이트 조절이 가능한 평탄 밴드를 유지하는 반데르발스(vdW) 카고메 재료군을 실험적으로 구현하고자 했습니다.", "result": "새로운 vdW 카고메 재료군에서 단층까지 박리하더라도 고립된 평탄 밴드가 유지됨을 확인하였으며, 이 밴드가 게이트 전압으로 정밀하게 조절 가능함을 입증했습니다. 이는 고온에서도 평탄 밴드 기반의 강한 상관 물리 현상을 관찰할 수 있는 토대를 마련한 것입니다.", "implication": "단층 카고메 시스템에서 강한 상관 관계에 의한 위그너 결정(Wigner crystal), 분수 Chern 절연체 또는 비전통적 초전도체와 같은 현상을 게이트 전압으로 제어하며 탐구할 수 있는 완벽한 실험실을 제공합니다.", "novelty": "독자님의 주 관심사인 CsV3Sb5 등 카고메 금속 연구를 2차원 단층 한계로 확장했습니다. 특히 평탄 밴드가 단순히 존재하는 것을 넘어, 게이트로 제어 가능하다는 점이 기존 AV3Sb5 시스템과의 차별점입니다.", "unresolved": "평탄 밴드 내 전자 채움 정도에 따른 실제 상관 상태(예: 모트 절연체 또는 초전도)의 직접적인 관찰은 향후 과제로 남아 있습니다.", "future_work": "단층 소자 제작을 통한 수송 특성 측정 및 주사 터널링 현미경(STM)을 이용한 국소 전자 구조 및 상관 상태의 공간적 매핑이 기대됩니다.", "concepts": [{"term": "카고메 격자 (Kagome Lattice)", "why_emerged": "기하학적 좌절(frustration)과 특이한 밴드 구조(평탄 밴드, 디락 점)를 동시에 구현하기 위해 도입되었습니다.", "origin": "일본의 대나무 바구니 패턴에서 유래, 고체 물리학에서는 1950년대부터 본격 연구됨.", "connections": "평탄 밴드, 위상 절연체, 스핀 액체, AV3Sb5 계열 물질."}, {"term": "평탄 밴드 (Flat Band)", "why_emerged": "전자의 운동 에너지를 억제하여 전자 간 상호작용(Coulomb interaction)이 지배적인 환경을 만들기 위해 필요합니다.", "origin": "Lieb 격자나 카고메 격자 등 특정 기하학적 구조에서 파동함수의 상쇄 간섭으로 발생.", "connections": "모트 절연체, 초전도체, 위그너 결정, 트위스트 이층 그래핀."}], "english_summary": ["Realization of a van der Waals kagome material family that maintains an isolated flat band down to the monolayer limit.", "Demonstrates gate-tunability of the flat band, enabling precise control of electron filling.", "Overcomes the limitations of 3D kagome systems for studying 2D correlated physics.", "Potential platform for high-temperature correlated states and fractional topology."]}}, {"title": "Coexistence of Altermagnetic and Compensated Ferrimagnetic Motifs in a Noncollinear Multiferroic", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2610.21770", "authors": "Vikrant Chaudhary, Fu Li, Hui Liu, et al.", "last_authors": "Hongbin Zhang, Harish K. Singh", "summary": "Collinear compensated magnets with nonrelativistic spin splitting comprise altermagnets (ALMs), whose rotation- or mirror-related opposite-spin sublattices produce momentum-selective splitting that vanishes at $\\Gamma$, and compensated ferrimagnets (CFIMs), whose symmetry-inequivalent sublattices allow splitting throughout the Brillouin zone, including at $\\Gamma$. Here, we show that the coplanar noncollinear magnetic state of multiferroic boracite Ni$_3$B$_7$O$_{13}$Cl hosts both motifs on distinct Ni sublattices in real space. The electronic structure and spin texture exhibit coexisting $d$-wave-like and $s$-wave-like spin-polarization components associated with the ALM and CFIM motifs, respectively. Opposite ferroelectric states exhibit reversed band-resolved spin polarizations, indicating magnetoelectric coupling, and sign reversals of linear shift and circular injection currents.", "tier": "A_MUST_READ", "score": "10", "reason": "Direct hit on altermagnetism and electronic structure of a multiferroic compound.", "tags": ["theory", "altermagnetism", "electronicstructure", "Ni3B7O13Cl"], "image": "https://arxiv.org/html/2610.21770v1/figure/Figure-1.png", "briefing": {"background": "최근 발견된 알터마그네틱(Altermagnetism, ALM)은 알짜 자화값은 0이지만 비상대론적인 스핀 분할(spin splitting)을 갖는 새로운 자성 상태입니다. 이는 기존의 강자성체와 반강자성체의 장점을 결합한 특성으로 주목받고 있습니다.", "motivation": "비공선(noncollinear) 다강체인 Ni3B7O13Cl에서 알터마그네틱 특성과 보상된 페리자성(Compensated Ferrimagnetic, CFIM) 특성이 공존할 수 있는지, 그리고 이를 전기적으로 제어할 수 있는지 규명하고자 했습니다.", "result": "이론적 계산을 통해 Ni3B7O13Cl의 서로 다른 Ni 부격자에서 ALM(d-wave 형태)과 CFIM(s-wave 형태) 모티프가 공존함을 확인했습니다. 또한 강유전성 상태를 반전시킴으로써 스핀 분할의 부호를 바꿀 수 있는 자기전기 결합(magnetoelectric coupling) 효과를 예측했습니다.", "implication": "하나의 물질에서 다양한 스핀 분할 대칭성을 동시에 활용할 수 있으며, 전기장을 이용해 스핀 텍스처와 비선형 광전류를 제어할 수 있는 새로운 스핀트로닉스 소자 가능성을 제시합니다.", "novelty": "독자님이 관심을 가지는 알터마그네틱 전자 구조를 실제 다강체 물질에서 구체화했습니다. 특히 모멘텀 공간에서의 s-wave와 d-wave 스핀 분할이 공존한다는 점이 매우 독특한 물리적 상황입니다.", "unresolved": "이러한 복합적인 스핀 분할 양상을 ARPES나 Spin-ARPES를 통해 직접적으로 검증하는 실험적 확인이 필요합니다.", "future_work": "Ni3B7O13Cl 단결정에 대한 스핀 분해 ARPES 실험 및 전기장에 따른 스핀 분할 반전 현상의 실시간 관측이 필요합니다.", "concepts": [{"term": "알터마그네틱 (Altermagnetism)", "why_emerged": "반강자성체처럼 자화는 없으나 강자성체처럼 스핀 분할이 일어나는 제3의 자성 상태를 정의하기 위해 등장했습니다.", "origin": "최근 2-3년 사이 Libor Smejkal 등에 의해 이론적으로 확립됨.", "connections": "비상대론적 스핀 분할, d-wave 스핀 대칭성, RuO2, MnTe."}, {"term": "보상된 페리자성 (Compensated Ferrimagnetism)", "why_emerged": "서로 다른 부격자의 자화가 상쇄되어 전체 자화는 0이지만, 대칭성 파괴로 인해 브릴루앙 존 전체(Gamma 점 포함)에서 스핀 분할이 일어나는 상태를 설명하기 위함입니다.", "origin": "전통적인 자성 분류에서 유래했으나 최근 ALM과 비교하며 재조명됨.", "connections": "s-wave 스핀 분할, 반강자성 스핀트로닉스."}], "english_summary": ["Identification of coexisting altermagnetic (d-wave) and compensated ferrimagnetic (s-wave) motifs in Ni3B7O13Cl.", "Predicts electrical control of spin polarization via magnetoelectric coupling in this multiferroic compound.", "Reveals momentum-selective spin splitting patterns tied to distinct Ni sublattices.", "Proposes Ni3B7O13Cl as a platform for nonlinear photocurrent switching and advanced spintronics."]}}, {"title": "Room-Temperature Metallic 2D Ferromagnetism Stabilized by Quantum Metric", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2610.19713", "authors": "Teng-Fei Ying, Jianqi Zhong, Songyuan Geng, Fangjie Chen, Haoxiang Li, Benjamin T. Zhou", "last_authors": "Haoxiang Li, Benjamin T. Zhou", "summary": "The recent discovery of long-sought dice-lattice bands in layered electride YCl opens up unprecedented opportunities for studying correlated electrons in real dice lattice systems. While the weakly dispersive band at the Fermi level is partially filled and density-wave states are expected due to Fermi surface nesting based on conventional theories, the ARPES measurement nevertheless revealed a uniform flat band splitting of 0.5 eV, suggesting unusual ferromagnetism (FM) borne out of the metallic 2D dice lattice. In this Letter, we propose that the uniform metallic FM order is stabilized by the prominent quantum metric near topological band crossing points at K and K', which reconstructs the magnetic instability in the dice metal and tips the density-wave instability toward a uniform FM order. Importantly, our analysis based on random phase approximation (RPA) and Hartree-Fock theory predicts a remarkably high Curie temperature above room temperature for the 2D FM order. These findings establish the first example of a room-temperature 2D metallic magnet stabilized by quantum metric, which not only exemplifies the fundamental significance of quantum geometry in solids but also bears far-reaching applications in energy-efficient high-density magnetic memories.", "tier": "A_MUST_READ", "score": "10", "reason": "Direct hit: ARPES on YCl electride flat bands, ferromagnetism, and quantum geometry.", "tags": ["method:ARPES", "material:YCl", "topic:ferromagnetism"], "image": "https://arxiv.org/html/2610.19713v2/dicestructureband_7band_compare.png", "briefing": {"background": "일렉트라이드(Electride)는 전자가 원자 핵 주위가 아닌 격자의 빈 공간(interstitial sites)에 갇혀 음이온 역할을 하는 독특한 물질입니다. 최근 YCl과 같은 층상 일렉트라이드에서 다이스 격자(dice lattice) 구조에 기반한 평탄 밴드가 발견되어 주목받고 있습니다.", "motivation": "YCl의 평탄 밴드에서 관찰된 0.5 eV라는 거대한 스핀 분할의 원인을 규명하고자 했습니다. 일반적인 이론은 페르미 면 네스팅에 의한 밀도파(CDW/SDW)를 예측하지만, ARPES 실험 결과는 균일한 강자성 상태를 가리키고 있었습니다.", "result": "양자 메트릭(Quantum metric)이라는 기하학적 성질이 K와 K' 점 근처의 위상적 밴드 교차점에서 자기적 불안정성을 재구성하여, 밀도파 대신 균일한 강자성(FM) 질서를 안정화시킨다는 것을 밝혀냈습니다. 이를 통해 상온 이상의 높은 큐리 온도(Tc)를 갖는 2차원 금속 강자성이 가능함을 이론적으로 증명했습니다.", "implication": "단순한 전자 간 상호작용뿐만 아니라 밴드의 양자 기하학적 구조가 자성을 결정하는 핵심 요소임을 보여줍니다. 이는 고온 2차원 자성체를 설계하는 새로운 지침을 제공합니다.", "novelty": "독자님의 핵심 관심사인 ARPES 데이터를 직접적으로 해석한 논문입니다. 특히 YCl의 평탄 밴드 물리와 양자 기하학(Quantum Geometry)을 연결하여 상온 자성을 설명했다는 점에서 매우 혁신적입니다.", "unresolved": "양자 메트릭에 의해 유도된 자성 상태의 실제 Tc를 실험적으로 정밀 측정하고, 격자 간 공간에 위치한 전자의 스핀 정렬을 직접 시각화하는 과제가 남아 있습니다.", "future_work": "온도 변화에 따른 ARPES 측정을 통해 스핀 분할의 소멸 과정을 관찰하고, MOKE 등을 이용한 상온 자성 측정 실험이 이어질 것으로 보입니다.", "concepts": [{"term": "일렉트라이드 (Electride)", "why_emerged": "전자가 이온이 아닌 격자 틈새에 국소화되는 극단적인 이온성 상태를 연구하기 위해 등장했습니다.", "origin": "1983년 James L. Dye에 의해 처음 합성됨.", "connections": "YCl, 층상 물질, 낮은 일함수, 촉매 및 전자 방출원."}, {"term": "양자 메트릭 (Quantum Metric)", "why_emerged": "파동함수의 위상(Phase)뿐만 아니라 '거리(Distance)' 개념이 물리량(예: 초전도성, 자성)에 미치는 영향을 설명하기 위해 필요합니다.", "origin": "Berry Curvature와 함께 양자 기하 텐서(Quantum Geometric Tensor)의 성분으로 정의됨.", "connections": "평탄 밴드 초전도성, 분수 Chern 절연체, 비선형 응답 현상."}], "english_summary": ["Proposed quantum metric-stabilized room-temperature 2D metallic ferromagnetism in YCl electride.", "Explains the observed 0.5 eV spin splitting in ARPES as a consequence of quantum geometry reshaping magnetic instability.", "Shows that quantum metric favors uniform FM over nesting-induced density waves in dice lattices.", "Identifies YCl as a candidate for energy-efficient, high-density magnetic memory applications."]}}, {"title": "Correlation-enhanced electron-phonon coupling in FeSe/SrTiO3 at a magic angle", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/whx6-mq31", "authors": "Qiang Zou, Antik Sihi, Basu Dev Oli, et al.", "last_authors": "Lian Li, Subhasish Mandal", "summary": "Here, the authors combine first-principles dynamical mean-field theory (DMFT), epitaxial materials design, angle-resolved photoemission spectroscopy, and scanning tunneling microscopy/spectroscopy to show that superconductivity in monolayer FeSe/SrTiO 3 is maximized at a magic FeSe 4 tetrahedral angle. They demonstrate that strong electronic correlations, captured by DMFT, substantially enhance electron-phonon coupling within the FeSe layer and produce a superconducting dome. These findings reveal the microscopic origin of enhanced superconductivity and suggest a route for engineering higher-temperature superconductors.", "tier": "A_MUST_READ", "score": "9", "reason": "Direct overlap: FeSe/STO, ARPES/STM usage, and strong correlation physics.", "tags": ["ARPES", "STM", "superconductivity", "FeSe"], "image": "", "briefing": {"background": "단층 FeSe를 SrTiO3(STO) 기판 위에 증착할 경우, 벌크 FeSe에 비해 초전도 전이 온도(Tc)가 비약적으로 상승하는 현상은 고체물리학의 주요 화두입니다. 이 현상의 기저에는 기판과의 계면 효과, 전하 도핑, 그리고 전자-포논 결합(EPC)의 강화가 중요한 역할을 한다고 알려져 있습니다.", "motivation": "FeSe/STO 시스템에서 초전도성을 결정짓는 미시적 메커니즘, 특히 전자 상관관계(correlation)가 전자-포논 결합에 어떤 영향을 주는지, 그리고 FeSe4 사면체의 기하학적 구조가 Tc 최적화와 어떤 상관관계가 있는지 규명하고자 합니다.", "result": "DMFT 계산과 ARPES, STM 측정을 결합하여 FeSe4 사면체의 각도가 특정 '마법의 각도(magic angle)'일 때 초전도성이 극대화됨을 확인했습니다. 특히 DMFT를 통해 포착된 강한 전자 상관관계가 FeSe 층 내의 전자-포논 결합을 실질적으로 강화시켜 초전도 돔(dome) 형상을 유도한다는 것을 입증했습니다.", "implication": "단순한 계면 효과를 넘어, 전자 상관관계와 격자 구조의 정밀한 정합(tuning)을 통해 전자-포논 결합력을 제어할 수 있음을 시사합니다. 이는 더 높은 Tc를 가진 상온 초전도체 설계를 위한 구조적 가이드를 제공합니다.", "novelty": "전자 상관관계가 단순히 EPC를 저해하는 것이 아니라, 특정 조건에서 이를 강화(correlation-enhanced EPC)할 수 있다는 점을 이론과 실험(ARPES/STM)의 결합으로 보여준 점이 독창적입니다. 독자분의 주요 관심사인 FeSe 및 ARPES/STM 데이터 해석과 직결됩니다.", "unresolved": "이러한 '마법의 각도'가 다른 철 기반 초전도체나 계면 시스템에서도 보편적으로 적용되는지, 그리고 상관관계의 세기를 실험적으로 어디까지 조절 가능한지는 추가 연구가 필요합니다.", "future_work": "다양한 기판이나 변형(strain) 제어를 통해 FeSe4 사면체 각도를 미세 조정하여 Tc를 추가로 높이는 실험과, DMFT를 활용한 다른 고온 초전도체 후보군 탐색이 예상됩니다.", "concepts": [{"term": "FeSe/SrTiO3", "why_emerged": "단층 FeSe가 STO 기판 위에서 벌크보다 수 배 높은 Tc(~65K 이상)를 보이며 고온 초전도 연구의 모델 시스템이 됨.", "origin": "2012년 칭화대 연구팀(Qing-Yan Wang et al.)이 처음 보고함.", "connections": "계면 초전도, 전하 도핑, 복제 밴드(replica band), EPC 강화."}, {"term": "DMFT (Dynamical Mean Field Theory)", "why_emerged": "기존 DFT가 설명하기 어려운 강상관 전자계(Strongly Correlated Systems)의 국소적인 동적 상호작용을 정확히 묘사하기 위해 도입됨.", "origin": "1980년대 후반 Antoine Georges와 Gabriel Kotliar 등에 의해 정립됨.", "connections": "Mott 절연체, 허바드 모델, 전자 상관관계."}, {"term": "Electron-Phonon Coupling (EPC)", "why_emerged": "BCS 이론에서 쿠퍼 쌍(Cooper pair)을 형성하는 매개체인 포논과 전자의 상호작용 세기를 정량화하기 위해 필요함.", "origin": "BCS 이론(1957)의 핵심 개념.", "connections": "Migdal-Eliashberg 이론, 고온 초전도 메커니즘."}, {"term": "Tetrahedral Angle", "why_emerged": "철 기반 초전도체에서 Fe-Pn/Ch(Pn:프닉토겐, Ch:칼코겐) 사면체의 기하학적 구조가 Tc와 밀접한 연관이 있음이 알려짐.", "origin": "초록 정보만으로는 특정하기 어려우나, 철 기반 초전도체 구조 연구 초기에 확립됨.", "connections": "Lee-Iyo curve, 구조적 전이, 결정장 이론."}], "english_summary": ["The paper identifies a 'magic angle' in the FeSe4 tetrahedron that maximizes superconductivity in monolayer FeSe/SrTiO3.", "Combining DMFT and ARPES/STM, the authors show that strong electronic correlations significantly enhance the electron-phonon coupling.", "This correlation-enhanced EPC is the microscopic driver behind the observed superconducting dome.", "The findings provide a structural and electronic tuning strategy for engineering higher-temperature superconductors."]}}, {"title": "Scanning tunneling microscopy study of the charge order landscape in CsCr3Sb5", "journal": "PRB_Recent", "source": "author whitelist", "link": "http://link.aps.org/doi/10.1103/x4xb-hrjh", "authors": "Jiakang Zhang, Xiangqi Liu, Shiyuan Wang, et al.", "last_authors": "Dong-Lai Feng, Ya-Jun Yan", "summary": "Recently, a chromium-based kagome metal $\\mathrm{C tems and inspires further exploration of superconducting spintronics.", "tier": "A_MUST_READ", "score": "9", "reason": "Direct relevance to altermagnetism, anomalous Hall, and electronic structure of iron-based monolayers.", "tags": ["material", "altermagnetism", "superconductivity"], "image": "https://arxiv.org/static/browse/0.3.4/images/arxiv-logo-fb.png", "briefing": {"background": "알터마그네티즘(Altermagnetism)은 강자성(순자화 존재)과 반강자성(순자화 없음)의 장점을 동시에 갖춘 새로운 자성 상태입니다. 순자화는 없지만 결정 구조의 대칭성 덕분에 밴드 구조에서 커다란 스핀 분할(spin splitting)이 나타나 스핀트로닉스 분야에서 각광받고 있습니다.", "motivation": "FeSe, FeTe와 같은 철 기반 초전도체 구조를 기반으로, 상하 비대칭성을 가진 야누스(Janus) 단층 구조를 설계하여 알터마그네티즘과 위상적 특성, 그리고 제어 가능한 스핀 물성을 구현하고자 합니다.", "result": "제일원리 계산을 통해 Janus FeX0.5Y0.5(X,Y=S,Se,Te) 단층이 알터마그네틱 성질을 가지며, 높은 네엘 온도(415K)와 큰 위상 밴드갭(51.4 meV)을 가짐을 예측했습니다. 또한 변형(strain)을 통해 밸리 편광을 조절하고, 페르미 준위 이동으로 이상 홀 효과(AHE)를 제어할 수 있음을 보였습니다.", "implication": "철 기반 초전도체 소재를 변형하여 고온에서 동작하는 알터마그네틱 위상 물질을 만들 수 있음을 시사합니다. 이는 소산 없는 스핀 기반 소자나 초전도 스핀트로닉스 구현에 기여할 수 있습니다.", "novelty": "기존 철 기반 초전도체 소재에 Janus 구조와 알터마그네티즘 개념을 결합한 설계 전략이 참신합니다. 독자분의 관심사인 알터마그네티즘, 이상 홀 효과, FeSe 계열 소재와 완벽히 부합하는 주제입니다.", "unresolved": "이론적 예측인 만큼, 실제로 Janus 구조의 단층 Fe(Se,Te) 등을 안정적으로 합성하고 알터마그네틱 스핀 분할을 실험적으로(ARPES 등) 증명하는 과정이 남아 있습니다.", "future_work": "실제 Janus 단층 박막의 에피택셜 성장 시도 및 스핀 분해 ARPES(Spin-resolved ARPES)를 통한 스핀 분할 밴드 구조 확인이 필요합니다.", "concepts": [{"term": "Altermagnetism", "why_emerged": "반강자성체처럼 순자화는 없으면서도, 강자성체처럼 밴드 스핀 분할을 얻기 위해 제안된 제3의 자성 분류.", "origin": "2022년경 Libor Šmejkal 등에 의해 이론적으로 정립됨.", "connections": "반강자성, 스핀 분할, 이상 홀 효과, 위상 자성."}, {"term": "Janus Monolayer", "why_emerged": "2차원 물질의 상하 원자 구성을 다르게 하여(A-M-B 구조) 수직 방향의 거울 대칭성을 깨고 강한 내장 전기장이나 Rashba 효과를 유도하기 위함.", "origin": "고대 로마의 두 얼굴의 신 '야누스'에서 유래.", "connections": "MoSSe, 공간 반전 대칭성 깨짐, 압전 효과."}, {"term": "Valley Polarization", "why_emerged": "결정 구조 내 에너지 극소점(valley)의 자유도를 조절하여 정보를 처리하는 밸리트로닉스 구현을 위해 필요함.", "origin": "그래핀 및 TMD 연구에서 발전함.", "connections": "이상 홀 효과, 베리 곡률(Berry curvature), 2차원 물질."}, {"term": "Anomalous Hall Effect (AHE)", "why_emerged": "외부 자기장 없이 물질 내부의 자성이나 베리 곡률에 의해 발생하는 홀 효과를 활용하기 위해 연구됨.", "origin": "1881년 Edwin Hall이 발견했으나 현대적 해석은 베리 곡률로 설명됨.", "connections": "알터마그네티즘, 위상 절연체, 스핀 홀 효과."}], "english_summary": ["The study predicts altermagnetism in Janus FeX0.5Y0.5 monolayers derived from iron-based superconductors.", "These materials exhibit large spin-splitting, a high Neel temperature of 415K, and significant topological band gaps.", "The research demonstrates that valley polarization and anomalous Hall conductivity can be tuned by strain and Fermi level shifting.", "It proposes a new material platform for high-temperature superconducting spintronics using altermagnetic states."]}}, {"title": "Extended strange metal and superconductivity in partially filled moir\\'e Hubbard bands", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2610.22307", "authors": "Yiyu Xia, Yichi Zhang, Zhongdong Han, et al.", "last_authors": "Jie Shan, Kin Fai Mak", "summary": "Moir\\'e semiconductors provide a physical realization of the Hubbard model. Bandwidth-tuned Mott transitions and complex phase diagrams mimicking those of high-temperature superconductors have been demonstrated near a weak Mott insulating state at half-band-filling. The platform also provides an opportunity to explore the physics of a partially filled Hubbard band at doping densities far away from the Mott insulator, a regime that has remained largely unexplored. Here we report the emergence of an extended strange metal (ESM), in both doping density and twist angle, in a partially filled Hubbard band of twisted bilayer WSe2. The ESM is in the clean limit, persists down to 100mK, and spans over multiple symmetry-breaking ground states; it also appears only at small twist angles, where electronic correlations are strong. These observations distinguish the state from the reported strange metals associated with quantum criticality and favor the viewpoint that it is antiferromagnetic ground state, whose total energy is substantially lower than all other configurations. In addition, the Heisenberg model analysis show strong constraints on the ground state magnetic configuration, such that fixing spin configuration of 1 triangle propagates and fixes all others. The vortex or anti-vortex phase hosts electronic structures reminiscent of kagome metals, including Dirac-like band crossings, van Hove singularities, and flat bands near the Fermi level. Owing to the noncollinear spin texture and quasi-two-dimensional magnetic character, the N\\'eel temperature exhibits an extremely weak dependence on both the magnitude and direction of external magnetic fields, consistent with experimental observations. For Cs-based compound, the ground state band structure is metallic with 6 Weyl points in the BZ; while for the Rb-based compound, spin--orbit coupling opens an approximately 27-meV gap at ambient pressure due to the lifted C$_3$ symmetry. Our results establish $A_3$V$_9$Te$_{13}$ as a promising platform for studying frustration-driven chiral magnetism and its interplay with topological electronic states.", "tier": "B_IMPORTANT_CONDMAT", "score": "9", "reason": "Kagome-like material with topological electronic states and Weyl points, directly relevant.", "tags": ["kagome", "Weyl", "topological", "magnetism"], "image": "https://arxiv.org/html/2610.21854v1/fig1.png", "briefing": {"background": "Kagome 격자와 같은 기하학적 좌절(frustration)을 가진 물질은 독특한 자기적 구조와 위상수학적 전자 상태를 동시에 나타낼 수 있는 플랫폼으로 주목받고 있습니다.", "motivation": "A3V9Te13(A=Cs, Rb) 물질의 V(바나듐) 격자에서 발생하는 기하학적 좌절이 자기적 기저 상태와 위상수학적 밴드 구조에 미치는 영향을 탐구하고자 했습니다.", "result": "제1원리 계산을 통해 이 물질이 보텍스(vortex) 형태의 반강자성 기저 상태를 가짐을 밝혀냈습니다. 또한, Cs 기반 물질에서는 6개의 Weyl 점이, Rb 기반 물질에서는 스핀-궤도 결합에 의한 갭이 형성됨을 확인했습니다.", "implication": "이 화합물들이 Kagome 금속의 물성과 유사한 위상수학적 특성을 가지면서도 차별화된 자기적 구조를 보여주어, 위상적 자성체 연구의 새로운 후보 물질임을 입증했습니다.", "novelty": "기하학적 좌절을 통한 보텍스 자기 구조와 위상수학적 전자 상태(Weyl 준금속)의 공존을 규명했으며, 이는 Kagome 기반 위상 자성 연구의 폭을 t Fermi liquid behavior along one in-plane crystallographic axis and an incoherent strange metal response along the orthogonal axis. This dichotomy extends directly to the charge response. The Fermi liquid direction supports a well-defined, long-lived plasmon, whereas the strange metal direction exhibits an overdamped excitation that progressively loses its collective character with increasing momentum. Beyond a critical momentum ($q_c$ $\\approx$ 0.008 $\\mathring{\\mathrm{A}}^{-1}$), the mode undergoes a reversal into negative dispersion and ultimately collapses into a broad, nearly featureless continuum with a robust high-energy boundary ($E_c$ $\\approx$ 1.75 eV). Remarkably, thickness-dependent measurements show that both $q_c$ and $E_c$ remain nearly unchanged despite substantial modifications of Coulomb screening, revealing them as intrinsic scales of incoherent charge density fluctuations. These results establish a unique single-material platform in which coherent and incoherent electronic states are partitioned into in-plane orthogonal channels, and demonstrate that incoherent electronic fluids retain intrinsically structured charge dynamics beyond the quasiparticle paradigm.", "tier": "B_IMPORTANT_CONDMAT", "score": "9", "reason": "Highly relevant experimental study on strange metal charge dynamics in a vdW material.", "tags": ["method", "material", "topic", "electron-scattering", "MoOCl2", "strange-metal"], "image": "https://arxiv.org/static/browse/0.3.4/images/arxiv-logo-fb.png", "briefing": {"background": "고온 초전도체나 강상관계 물질에서 나타나는 '이상 금속(Strange Metal)' 상태는 쿼시파티클이 존재하지 않는 incoherent한 상태로, 그 전하 동역학에 대한 이해가 매우 어렵습니다.", "motivation": "vdW 물질인 MoOCl2가 방향에 따라 서로 다른 수송 특성(Fermi liquid vs Strange metal)을 보인다는 점에 착안하여, 방향별로 전하 집단 모드(플라즈몬)가 어떻게 다르게 거동하는지 조사하고자 했습니다.", "result": "Fermi liquid 방향에서는 잘 정의된 플라즈몬이 존재하지만, strange metal 방향에서는 운동량이 특정 값(qc)을 넘어서면 플라즈몬이 붕괴(collapse)하여 연속체로 변함을 관찰했습니다.", "implication": "이상 금속 상태에서도 고유한 전하 동역학적 척도가 존재하며, incoherent한 전자 유체 내 학적 반응에서 비대칭적 특성이 나타납니다.", "motivation": "초전도 임계 온도 위에서 발생하는 초전도 요동이 비가역적인 광학 반응(이색성, 자이로트로피)에 어떤 영향을 미치는지 이론적으로 규명하고자 합니다.", "result": "시간 의존적 긴즈버그-란다우(TDGL) 이론을 사용하여 2차원 비중심대칭 초전도체에서 요동에 의한 비가역적인 광학적 반응을 계산했습니다.", "implication": "초전도 요동이 단순한 전기 저항 변화뿐만 아니라 광학적 반응 함수에도 유의미한 기여를 함을 입증했습니다.", "novelty": "CD-ARPES 및 광학 측정 기법을 활용하는 연구자들에게 초전도 요동이 비가역적 광학 신호에 미치는 배경 효과를 분리하는 가이드라인을 제공합니다.", "unresolved": "실제 실험에서 이러한 미세한 요동 효과를 다른 불순물이나 격자 효과와 완벽하게 분리해낼 수 있는지에 대한 실험적 검증이 필요합니다.", "future_work": "실제 비중심대칭 초전도 물질에서 이색성 측정(dichroism) 실험을 통한 데이터 확인이 예상됩니다.", "concepts": [{"term": "Nonreciprocal Dichroism", "why_emerged": "빛의 진행 방향이나 편광에 따라 흡수율이 달라지는 비대칭 광학 반응을 기술하기 위해 필요함.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "비중심대칭 물질, 위상 물질, CD-ARPES와 연결됨."}, {"term": "Time-Dependent Ginzburg-Landau", "why_emerged": "초전도 상태의 동적 거동 및 요동 효과를 기술하기 위한 현상론적 모델이 필요했음.", "origin": "Gor'kov and Eliashberg (1968).", "connections": "초전도 와류 동역학, 초전도 요동 이론."}], "english_summary": ["Theoretical study on noncentrosymmetric superconductors.", "Identified nonreciprocal optical responses induced by superconducting fluctuations above Tc.", "Utilized time-dependent Ginzburg-Landau theory.", "Connects fluctuation-induced Cooper pairs to dichroism and gyrotropy."]}}, {"title": "Electron state tomography from quasiparticle interference maps", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/q4hk-nkdh", "authors": "A. Razanajatovo, J. Cayssol, C. Dutreix", "last_authors": "J. Cayssol, C. Dutreix", "summary": "Characterizing electronic band structures requires precise knowledge of wave functions and their quantum geometry. Here, we introduce a tomography method to reconstruct the density matrix of electron states from quasiparticle interference maps around single impurities. We consider two-orbital models…", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Methodology to reconstruct electron states from STM/STS quasiparticle interference maps, highly relevant to electronic structure.", "tags": ["STM/STS", "electronicstructure", "methodology", "quantumgeometry"], "image": "", "briefing": {"background": "STM(주사 터널링 현미경)을 통해 얻은 준입자 간섭(QPI) 맵은 물질의 전자 구조와 파동 함수의 기하학적 정보를 담고 있습니다.", "motivation": "QPI 맵을 단순히 시각화하는 것을 넘어, 파동 함수의 정보(양자 기하학)를 역으로 재구성하는 체계적인 토모그래피 기법을 제안하고자 합니다.", "result": "불순물 주변의 QPI 맵을 이용하여 전자 상태의 밀도 행렬을 재구성할 수 있는 토모그래피 방법을 이론적으로 정립했습니다.", "implication": "STM 데이터에서 직접적으로 페르미면의 위상적 성질이나 양자 기하학적 정보를 추출할 수 있는 강력한 분석 도구가 마련되었습니다.", "novelty": "단순한 밴드 분산 해석을 넘어 파동 함수의 성분과 양자 기하학적 정보를 직접 추출할 수 있어 전자 구조 연구의 정밀도를 크게 높입니다.", "unresolved": "실험적 노이즈가 강한 실제 STM 데이터에서 재구성이 얼마나 견고하게 작동하는지에 대한 검증이 남아있습니다.", "future_work": "실제 위상 물질 또는 강상관계 물질의 STM 실험 데이터에 이 기법을 적용하는 연구가 이어질 것입니다.", "concepts": [{"term": "Quasiparticle Interference (QPI)", "why_emerged": "불순물에 의한 산란 과정을 분석하여 페르미면의 구조를 역산하기 위해 필요함.", "origin": "1990년대 STM 실험 기술의 발전과 함께 확립.", "connections": "전자 구조 매핑, 불순물 산란 이론."}, {"term": "Quantum Geometry", "why_emerged": "베리 곡률 등 물질의 위상적, 기하학적 성질을 정량화하기 위해 도입됨.", "origin": "Berry (1984) 및 이후의 응집물질물리 이론 발전.", "connections": "위상 절연체, 아노말리 홀 효과."}], "english_summary": ["Introduced a tomography method for electronic band structures.", "Reconstructs the density matrix of states from STM quasiparticle interference maps.", "Focuses on extracting wavefunction and quantum geometry information.", "Provides a powerful diagnostic tool for topological electronic structure studies."]}}, {"title": "Gyrotropy from extrinsic geometry in twisted materials", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/xkv5-svyj", "authors": "Spenser Talkington, Eugene J. Mele", "last_authors": "Spenser Talkington, Eugene J. Mele", "summary": "Two-dimensional moiré materials feature widely tunable electronic structures. When these materials are illuminated by light, they exhibit optical gyrotropy in the form of circular dichroism and birefringence. Here, the authors show that this gyrotropy naturally decomposes into an intrinsic contribution due to interlayer electronic coupling and an extrinsic contribution due to the twisted embedding of the material in physical space. The authors conduct a general symmetry analysis applicable to moiré materials and identify regimes in which the intrinsic, and in which the extrinsic contributions dominate the gyrotropy. Finally, they apply the analysis to twisted bilayer graphene and twisted MoTe 2 .", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Theory of optical gyrotropy in twisted bilayer graphene/MoTe2, relevant to moire systems and CD-ARPES.", "tags": ["graphene", "moire", "twistedbilayer", "optical", "CD-ARPES_relevance"], "image": "", "briefing": {"background": "모아레(Moiré) 물질은 층간 비틀림 각도를 조절하여 전자 구조를 극적으로 변화시킬 수 있어 강상관 전자계 연구의 핵심 플랫폼으로 자리 잡았습니다. 특히 이러한 시스템의 광학적 응답인 원형 이색성(circular dichroism)은 전자 구조와 대칭성을 이해하는 데 필수적입니다.", "motivation": "모아레 시스템에서 관측되는 광학적 자이로트로피(gyrotropy)가 층간 전자 결합(내인성)에서 오는지, 아니면 기하학적 비틀림 배치(외인성)에서 오는지 명확히 구분할 필요가 있었습니다.", "result": "본 연구는 자이로트로피를 내인성 성분과 외인성 성분으로 분리하는 대칭성 분석을 제시했습니다. 뒤틀린 이중층 그래핀 및 MoTe2 시스템에서 어떤 조건이 각각의 기여를 지배하는지 규명했습니다.", "implication": "모아레 물질의 광학 응답을 해석할 때 구조적 비틀림 자체가 만드는 기하학적 효과를 분리해낼 수 있게 되어, 순수한 전자 구조적 특성만을 정확히 추론할 수 있습니다.", "novelty": "CD-ARPES 실험 데이터 해석 시 구조적 요인(외인성)과 전자 구조 요인(내인성)을 분리할 수 있는 이론적 틀을 제공하여, 향후 분광학적 데이터 해석의 정밀도를 높일 수 있습니다.", "unresolved": "실제 실험적으로 이 두 기여도를 정량적으로 완전히 분리하여 측정하기 위해서는 매우 정밀한 입사광 편광 제어가 필요합니다.", "future_work": "다양한 전이 금속 디칼코게나이드(TMD) 비틀림 시스템에서 본 이론을 적용하여 실제 실험 결과와 비교 분석할 예정입니다.", "concepts": [{"term": "광학적 자이로트로피", "why_emerged": "물질의 대칭성이 깨졌을 때 발생하는 원형 이색성 및 복굴절 현상을 이해하기 위해 필요합니다.", "origin": "고전 광학 및 결정학에서 유래된 개념입니다.", "connections": "반전 대칭성이 깨진 위상 물질 및 모아레 시스템의 광학적 특성 연구와 연결됩니다."}, {"term": "모아레 물질", "why_emerged": "2D 층상 물질을 비틀어 쌓을 때 발생하는 주기적인 잠재력 변화를 이용해 평탄 밴드 등을 구현하기 위해 나타났습니다.", "origin": "초록 정보만으로는 특정하기 어려움 (통상적으로 비스트로-맥도날드 모델 등과 연결됨).", "connections": "트위스티드 이중층 그래핀, 초전도성, 강상관 물리 연구와 직접 연결됩니다."}], "english_summary": ["Moiré materials exhibit tunable optical gyrotropy stemming from both electronic and geometric factors.", "The authors decompose gyrotropy into intrinsic interlayer coupling and extrinsic twisted geometry effects.", "A symmetry-based analysis identifies dominant regimes for these contributions in twisted bilayer systems.", "This framework provides essential guidance for interpreting CD-ARPES and optical spectroscopy in moiré heterostructures."]}}, {"title": "Imaging Van Hove singularity heterogeneity in overdoped graphene", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/lfwz-ckll", "authors": "Raymond Blackwell, Zengyi Du, Takuya Okugawa, et al.", "last_authors": "Dante M. Kennes, Abhay N. Pasupathy", "summary": "Tuning the chemical potential of a solid to the vicinity of a Van Hove singularity (VHS) is a well-established route to discovering emergent quantum phases. In monolayer graphene, the use of electron-donating metal layers has recently emerged as a method to dope the chemical potential to the nearest…", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Experimental imaging of Van Hove singularities in graphene, relevant to flat-band physics.", "tags": ["graphene", "spectroscopy", "electronic-structure"], "image": "", "briefing": {"background": "반 호브 특이점(VHS) 근처에서 상태 밀도가 발산하면 강한 전자-전자 상호작용이 유도되어 초전도나 자기적 질서 등 새로운 양자 상이 나타날 가능성이 커집니다. 그래핀은 도핑을 통해 VHS를 제어할 수 있는 대표적인 시스템입니다.", "motivation": "그래핀의 VHS를 정밀하게 도핑하여 전자 상태의 국소적 불균일성(heterogeneity)을 직접 이미징하고, 이것이 양자 상 형성에 어떤 영향을 미치는지 밝히고자 했습니다.", "result": "금속 층을 이용해 그래핀의 화학적 퍼텐셜을 VHS 부근으로 성공적으로 도핑하였으며, 주사 터널링 현미경(STM)을 통해 이 지점에서의 전자 구조적 불균일성을 관측했습니다.", "implication": "그래핀의 VHS 기반 양자 상 연구에서 단순히 평균적인 도핑 농도뿐만 아니라, 공간적인 불균일성 제어가 핵심적인 변수임을 시사합니다.", "novelty": "STS(주사 터널링 분광법)를 사용하여 그래핀의 VHS 특성을 나노미터 규모로 이미징했다는 점에서 전자 구조 연구의 정밀도를 한 단계 높였습니다.", "unresolved": "관측된 국소적 불균일성이 도핑 공정 중의 결함에서 기인한 것인지, 혹은 그래핀 고유의 특성인지 명확히 구분하는 과정이 필요합니다.", "future_work": "불균일성을 최소화한 그래핀 시스템에서 VHS 유도 양자 상을 체계적으로 관측하는 연구가 이어질 것으로 보입니다.", "concepts": [{"term": "반 호브 특이점 (VHS)", "why_emerged": "에너지 밴드 구조에서 상태 밀도가 무한대로 발산하는 지점으로, 상전이 분석에 필수적입니다.", "origin": "레온 반 호브(Leon Van Hove)가 1953년에 처음 제안했습니다.", "connections": "평탄 밴드 물리학, 강상관 전자계, 고온 초전도 연구와 연결됩니다."}, {"term": "STS (Scanning Tunneling Spectroscopy)", "why_emerged": "국소적인 전자 상태 밀도를 에너지 분해능을 가지고 측정하기 위해 개발되었습니다.", "origin": "게르트 비니히와 하인리히 로러가 1980년대 초 STM을 개발하며 함께 발전했습니다.", "connections": "ARPES와 상호 보완적인 도구로서 고체 물리학의 필수 도구입니다."}], "english_summary": ["Van Hove singularities (VHS) are key to discovering emergent phases in doped graphene.", "The authors employ metal-layer doping to reach the VHS in monolayer graphene.", "Scanning Tunneling Spectroscopy (STS) reveals significant spatial heterogeneity of the VHS.", "This study highlights the importance of managing local electronic landscape for quantum phase engineering."]}}, {"title": "Intrinsic orbital Hall effect in degenerate spin-32 systems driven by the quantum metric", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/c6kd-njr5", "authors": "Rhonald Burgos Atencia", "last_authors": "Rhonald Burgos Atencia", "summary": "We show that in rotationally invariant spin- 3 / 2 systems, the orbital Hall effect originates from interband matrix elements of the orbital magnetic moment. The resulting Hall response is governed by the quantum metric, rather than by the Berry curvature, revealing a purely geometric transport mechanism. Conventional intraband contributions associated with the orbital magnetic moment and Berry curvature are shown to vanish identically in the doubly degenerate two-band structure of the Luttinger model. These results identify the quantum metric as the key geometric quantity controlling orbital Hall transport in degenerate spin- 3 / 2 systems.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Theory directly on orbital Hall effect and Berry curvature, strong user interests.", "tags": ["theory", "transport", "Berrycurvature", "Halleffect"], "image": "", "briefing": {"background": "전하의 흐름이 아닌 궤도 자기 모멘트의 흐름인 궤도 홀 효과(OHE)는 스핀 기반 소자(스핀트로닉스)의 대안으로 주목받고 있으며, 물질 내부의 기하학적 양자 속성과 밀접한 관련이 있습니다.", "motivation": "기존에는 Berry 곡률이 궤도 홀 효과의 주요 원인으로 알려져 있었으나, 특정 Spin-3/2 시스템에서 이 효과가 다른 기하학적 양자 양(quantum metric)에 의해 지배될 가능성을 탐구하고자 했습니다.", "result": "Luttinger 모델을 따르는 Spin-3/2 시스템에서 궤도 홀 효과가 Berry 곡률이 아닌 양자 계량(quantum metric)에 의해 결정된다는 것을 증명했습니다. 기존의 내대역(intraband) 기여는 상쇄되어 사라짐을 보였습니다.", "implication": "궤도 홀 효과의 이론적 기원을 재정의하였으며, 특정 물질계에서 궤도 홀 전류를 제어하는 새로운 설계 원리를 제시했습니다.", "novelty": "Berry 곡률만으로 설명되던 홀 효과 현상에서 양자 계량의 지배적 역할을 수학적으로 도출하여, 위상 물질의 전송 특성 연구에 새로운 관점을 제공했습니다.", "unresolved": "실제 실험에서 양자 계량 기여도를 Berry 곡률 기여도와 실험적으로 완전히 분리해낼 수 있는 실험적 방법론은 여전히 도전 과제입니다.", "future_work": "이 이론을 Spin-3/2를 가지는 실제 반도체 및 위상 물질에 적용하여 전기적 수송 특성을 계산하는 후속 연구가 예상됩니다.", "concepts": [{"term": "양자 계량 (Quantum Metric)", "why_emerged": "파동 함수의 기하학적 거리 측정 등 위상적 특성을 정량화하기 위해 필요합니다.", "origin": "초록 정보만으로는 특정하기 어려움 (베리 기하학의 연장선).", "connections": "Berry 곡률, 비선형 광학 응답, 위상 부도체와 연결됩니다."}, {"term": "궤도 홀 효과 (Orbital Hall Effect)", "why_emerged": "스핀 전류 대신 궤도 각운동량 전류를 활용하여 저전력 전자 소자를 개발하기 위해 중요해졌습니다.", "origin": "2000년대 중반 이후 이론적으로 제안되었습니다.", "connections": "스핀 홀 효과, Berry 곡률, 비전통적 자기 재료 연구와 연결됩니다."}], "english_summary": ["The orbital Hall effect (OHE) in spin-3/2 systems is investigated through geometric theory.", "The authors find that the OHE is governed by the quantum metric rather than the Berry curvature.", "Conventional intraband contributions are shown to vanish in the Luttinger model context.", "This work identifies the quantum metric as a fundamental parameter for orbital-based transport."]}}, {"title": "Net magnetization and inhomogeneous magnetic order in the high-Tc nickelate superconductor Sm1−x−yEuxCayNiO2", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/6285-5rms", "authors": "Alexander J. Grutter, Nurul Fitriyah, Brian B. Maranville, et al.", "last_authors": "Julie A. Borchers, A. Ariando", "summary": "High-temperature and high-magnetic-field-induced reentrant superconductivity has been discovered in the infinite-layer nickelate ${\\mathrm{Sm}}_{1−x−y}{\\text{Eu}}_{x}{\\text{Ca}}_{y}{\\text{NiO}}_{2}$ (SECNO). Infinite-layer nickelates are the closest known analogs of high-${T}_{c}$ cuprate supercondu…", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Experimental study of magnetism in high-Tc nickelate superconductor, highly relevant to unconventional superconductivity.", "tags": ["nickelates", "superconductivity", "magnetism", "experiment"], "image": "", "briefing": {"background": "무한층 니켈산염은 고온 초전도체인 구리산염(cuprates)과 전자 구조적으로 유사하여, 비전통적 초전도 기작을 이해하기 위한 핵심 모델 물질로 주목받고 있습니다.", "motivation": "SECNO 물질에서 관측된 고자기장 재진입 초전도 현상과 관련된 자기적 성질을 규명하여, 니켈산염 초전도체 내 자기 질서와 초전도성 간의 상관관계를 확인하고자 함.", "result": "SECNO 박막에서 순 자화(net magnetization)와 불균일한 자기 질서가 존재함을 실험적으로 규명함.", "implication": "니켈산염 초전도체에서 자기적 질서가 초전도 상태와 공존하거나 영향을 미칠 가능성을 제시하며, 이는 구리산염과는 다른 고유의 초전도 기작 존재 가능성을 시사함.", "novelty": "실험적 접근을 통해 니켈산염 시스템의 복잡한 자기 상태를 직접 관측했으며, 이는 전자 구조 및 상관관계 연구를 수행하는 연구자에게 중요한 실험적 근거를 제공함.", "unresolved": "관측된 불균일 자기 질서가 초전도성 발생의 원인인지, 아니면 공존하는 부수적 현상인지에 대한 명확한 인과관계는 아직 부족함.", "future_work": "저온 및 고자기장 하에서의 정밀한 자기 구조 분석 및 국소적 프로브(예: STS)를 이용한 전자 상태 매핑이 필요함.", "concepts": [{"term": "무한층 니켈산염", "why_emerged": "구리산염과 유사한 3d 궤도 전자 구조를 가지면서도 초전도성을 구현할 수 있는지 탐구하기 위해 제안됨.", "origin": "2019년 Li et al.에 의해 NdNiO2에서 초전도성이 발견되면서 본격화됨.", "connections": "고온 초전도체, 페로브스카이트 산화물, 강상관 전자계."}, {"term": "재진입 초전도", "why_emerged": "강한 자기장 하에서 파괴되어야 할 초전도성이 특정 조건에서 다시 나타나는 현상을 설명하기 위해 필요함.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "조셉슨 접합, 자기적 상전이, 비전통적 초전도."}], "english_summary": ["Experimental investigation of SECNO nickelate superconductor magnetism.", "Identified net magnetization and inhomogeneous magnetic order in infinite-layer samples.", "Highlights potential link between magnetic order and superconductivity in nickelates.", "Provides critical experimental data for comparing nickelate and cuprate physics."]}}, {"title": "Nonlinear magnon magnetic moment transport in triangular-lattice f-wave anti-altermagnets", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/zl26-y46s", "authors": "Volodymyr P. Kravchuk, Kostiantyn V. Yershov, Bastián Pradenas, et al.", "last_authors": "Jeroen van den Brink, Alexander Mook", "summary": "We study the spin excitations in the frustrated coplanar 120 ∘ ground state of the triangular-lattice Heisenberg antiferromagnet and demonstrate that they carry a magnetic moment perpendicular to the plane in which the spins order, despite the ground-state sublattice moments having no out-of-plane component. The symmetry of the momentum dependence of the magnetic moment and energy of the magnons renders the system an odd-parity f -wave magnet. Extending this model to a stack of antiferromagnetically coupled triangular layers provides a realization of magnons in a three-dimensional f -wave anti-altermagnet. We show that nonlinear thermal transport effects of magnons, such as Edelstein and spin-splitter effects, provide clear experimental signatures of magnons in f -wave anti-altermagnets.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Theory paper directly connecting to altermagnetism, magnons, and transport in a specific lattice.", "tags": ["theory", "altermagnetism", "magnetism", "transport", "magnon"], "image": "", "briefing": {"background": "최근 알터자성(altermagnetism)은 자성체 연구의 새로운 패러다임으로, 자화 없이도 밴드 분할이 일어나는 새로운 자기 질서 상태를 연구함.", "motivation": "삼각 격자 반강자성체에서 나타나는 f-wave 대칭성의 스핀 들뜸(magnon)이 어떠한 수송 특성을 갖는지 이론적으로 규명하고자 함.", "result": "삼각 격자 120도 반강자성 상태에서 마그논이 격자 면에 수직인 자기 모멘트를 운반하며, 이것이 f-wave anti-altermagnet 특성을 가짐을 증명함.", "implication": "마그논을 이용한 새로운 비선형 열수송(Edelstein, spin-splitter 효과)을 예측하여, 향후 마그논 기반의 스핀트로닉스 소자 설계의 이론적 토대를 제공함.", "novelty": "기존 자화가 없는 반강자성체에서 마그논의 비선형 수송을 다루며, 이를 f-wave 대칭성과 연결하여 알터자성 연구의 범위를 확장함.", "unresolved": "실제 실험적 구현에서 f-wave 마그논의 비선형 수송 신호를 순수하게 분리해내는 방법은 여전히 도전적인 과제임.", "future_work": "제안된 열수송 효과를 검증하기 위한 3D 쌓임 구조의 결정 성장 및 정밀 열전기 측정 연구.", "concepts": [{"term": "알터자성(Altermagnetism)", "why_emerged": "전통적인 강자성이나 반강자성과 구분되는, 자화 없이 밴드 스핀 분할이 발생하는 새로운 자기상을 정의할 필요성 때문에 등장함.", "origin": "최근(2020년대 초) 이론적으로 제안 및 명명됨.", "connections": "반강자성, 스핀-궤도 결합, 밴드 토폴로지."}, {"term": "Edelstein 효과", "why_emerged": "전류에 의해 스핀이 정렬되는 현상을 기술하기 위해 도입됨.", "origin": "V. M. Edelstein (1990).", "connections": "Rashba 효과, 스핀트로닉스, 비가역적 수송."}], "english_summary": ["Theory of magnon transport in triangular-lattice f-wave anti-altermagnets.", "Shows magnons carry out-of-plane magnetic moments despite in-plane order.", "Predicts nonlinear thermal transport signatures like Edelstein and spin-splitter effects.", "Links magnon dynamics to f-wave symmetry in frustrated magnets."]}}, {"title": "Nonmagnetic-magnetic transitions in rutile RuO2", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/57ck-wr34", "authors": "Yue-Fei Hou, Siyuan Liu, Wanxiang Feng, et al.", "last_authors": "Gui-Bin Liu, Ping Zhang", "summary": "Rutile ${\\mathrm{RuO}}_{2}$ has recently attracted great interest, as its magnetic ground state remains controversial. Experimental studies have reported either nonmagnetic (NM) or altermagnetic (AM) ground states in different crystalline samples of ${\\mathrm{RuO}}_{2}$, highlighting the need for a …", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Directly relevant to altermagnetism, which is a strong user interest.", "tags": ["material", "altermagnetism", "magnetism"], "image": "", "briefing": {"background": "RuO2는 최근 알터자성 후보 물질로 강력하게 부상했으나, 실험 결과에 따라 비자성(NM)과 알터자성(AM) 사이에서 혼란이 존재함.", "motivation": "RuO2의 자기적 성질이 실험마다 다르게 보고되는 원인을 규명하고, 상전이 메커니즘을 이론적으로 명확히 하고자 함.", "result": "RuO2에서 외부 요인이나 결정 구조 변형에 따른 NM과 AM 상태 간의 에너지 경쟁과 전이 조건을 제시함.", "implication": "실험 데이터의 불일치가 샘플의 순도, 스트레인, 혹은 결함에 기인할 수 있음을 이론적으로 뒷받침함.", "novelty": "RuO2 알터자성 논란에 대해 결정적 이론 분석을 제공하여 향후 실험 설계의 가이드라인을 제시함.", "unresolved": "실제 샘플에서의 NM-AM 상태를 완벽히 제어하거나 구별할 수 있는 결정적인 분광학적 시그니처가 아직 논쟁 중임.", "future_work": "고정밀 ARPES 또는 RIXS를 이용한 밴드 스핀 분할 직접 관측 및 스트레인 제어 실험.", "concepts": [{"term": "Rutile RuO2", "why_emerged": "전이금속 산화물 중 독특한 전자 구조를 가져 스핀트로닉스 활용 가능성을 탐구하기 위함.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "알터자성, 스핀 홀 효과, 전이금속 산화물."}], "english_summary": ["Theoretical study addressing the magnetic ground state of rutile RuO2.", "Investigates transitions between nonmagnetic and altermagnetic states.", "Analyzes the source of conflicting experimental reports regarding magnetism.", "Provides insights into stability and material-dependent properties of altermagnets."]}}, {"title": "Orbital-selective engineering of strain-tunable Chern insulators in momentum space", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/k6yc-nx4y", "authors": "Jin Gao, Rongrong Chen, Lei Yang, et al.", "last_authors": "Zixiong Huang, Dingzhao Liu", "summary": "Unlike conventional approaches where topological order is statically fixed, we demonstrate that biaxial strain can independently modulate topological order and functional responses in a Tc-adsorbed penta-hexa-silicene monolayer. Combining first-principles calculations and tight-binding models, we es…", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "First-principles study of strain-tunable Chern insulators in a monolayer, relevant to topological and 2D materials.", "tags": ["topologicalinsulator", "Cherninsulator", "monolayer", "DFT"], "image": "", "briefing": {"background": "위상 절연체는 물질의 벌크 상태와 에지 상태가 위상적으로 다를 때 나타나는 물질 상태로, 기존에는 결정 구조에 의해 위상적 성질이 고정되어 있어 외부 제어가 어려웠습니다.", "motivation": "스트레인(strain)을 통해 물질의 격자 구조를 변화시켜 위상적 성질을 동적으로 제어할 수 있는지 확인하고, 이를 통해 Chern 절연체 상태를 유도하고자 합니다.", "result": "Tc-흡착 펜타-헥사-실리신 단층에서 이축 스트레인을 통해 밴드 구조와 위상적 질서(Chern 수)를 독립적으로 조절할 수 있음을 이론적으로 규명했습니다.", "implication": "스트레인 공학을 통해 위상적 성질이 가변적인 차세대 위상 소자 구현 가능성을 제시합니다.", "novelty": "기존의 정적인 위상 상태를 넘어, 2D 층상 물질의 격자 변형을 통해 전자 구조를 능동적으로 재구성할 수 있다는 점이 중요합니다.", "unresolved": "실제 실험적 합성과정에서의 스트레인 제어 정밀도 및 샘플 내 결함이 위상 특성에 미치는 영향은 밝혀지지 않았습니다.", "future_work": "스트레인 유도 위상 전이를 실험적으로 검증하기 위한 ARPES 연구 및 전송 특성 측정이 요구됩니다.", "concepts": [{"term": "Chern 절연체", "why_emerged": "시간 반전 대칭성이 깨진 상태에서 양자 홀 효과를 나타내는 물질을 설명하기 위해 도입되었습니다.", "origin": "Haldane 모델(1988)에서 처음 제안되었습니다.", "connections": "양자 홀 효과, 위상 절연체, 자기 위상 물질과 밀접하게 연결됩니다."}, {"term": "펜타-헥사-실리신", "why_emerged": "그래핀의 한계를 넘는 새로운 실리콘 기반 2D 물질을 찾기 위한 설계된 구조입니다.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "실리신, 2D 재료 공학, 위상 전자 구조 연구와 연결됩니다."}], "english_summary": ["Demonstrates strain-tunable topological phases in Tc-adsorbed penta-hexa-silicene.", "Uses first-principles calculations to show independent modulation of topological order.", "Proposes an orbital-selective approach to engineer Chern insulating states.", "Highlights the potential of strain engineering for dynamic topological devices."]}}, {"title": "Positive pressure effect on the superconducting transition in an infinite-layer nickelate La0.8Sr0.2NiO2 thin film", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/4h3v-tjwz", "authors": "Jianping Sun, Wenjie Sun, Wenfeng Wu, et al.", "last_authors": "Yuefeng Nie, Jinguang Cheng", "summary": "The discovery of infinite-layer nickelate superconductors has generated great enthusiasm for exploring new nickelate superconductors with higher ${T}_{\\mathrm{c}}$ and further elucidating their superconducting mechanism. In this work, we systematically investigate the pressure effect on both the nor…", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Experimental results on nickelate superconductors under pressure.", "tags": ["nickelate", "superconductivity", "pressure"], "image": "", "briefing": {"background": "무한층(infinite-layer) 니켈레이트는 구리 산화물(cuprate) 고온 초전도체와 전자 구조가 유사하여 초전도 기작을 연구하는 핵심 물질군으로 떠올랐습니다.", "motivation": "외부 압력을 인가하여 격자 구조를 미세하게 조정함으로써 Tc(임계 온도) 변화를 확인하고, 초전도 기작의 상관관계를 규명하고자 합니다.", "result": "La0.8Sr0.2NiO2 박막에서 압력이 증가함에 따라 초전도 전이 온도(Tc)가 상승하는 양의 압력 효과를 관찰했습니다.", "implication": "압력 하에서 격자 구조 변화가 전하 밀도 또는 전자 간 상관관계를 변화시켜 초전도성을 강화함을 시사합니다.", "novelty": "니켈레이트 계열에서 압력을 통한 초전도성 제어 가능성을 보여주며, 이는 향후 고온 초전도체 설계의 중요한 단서가 됩니다.", "unresolved": "압력 상승이 정확히 어떤 전자적 상관관계나 격자 모드 변화를 통해 Tc를 높이는지에 대한 미시적 기작은 여전히 논쟁적입니다.", "future_work": "고압 조건 하에서의 상세한 전자 구조 측정(예: 고압 ARPES)을 통한 밴드 변화 추적이 필요합니다.", "concepts": [{"term": "무한층 니켈레이트", "why_emerged": "구리 산화물과 유사한 3d 전자 시스템을 통해 고온 초전도성을 구현하고자 제안되었습니다.", "origin": "Li et al. (2019)에 의해 실험적으로 처음 발견되었습니다.", "connections": "구리 산화물(Cuprate), 강상관 전자계, 3d 전이금속 산화물과 연결됩니다."}, {"term": "압력 효과", "why_emerged": "격자 상수를 변화시켜 화학적 도핑 없이 전자 상태 밀도나 결합 강도를 조절하기 위해 사용됩니다.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "초전도성 최적화, 페르미 면 제어, 구조상 전이와 연결됩니다."}], "english_summary": ["Investigates the pressure effect on La0.8Sr0.2NiO2 thin films.", "Observes a positive pressure dependence of the superconducting transition temperature.", "Provides insights into the superconducting mechanism of infinite-layer nickelates.", "Contributes to the broader study of correlated electron systems under physical pressure."]}}, {"title": "Tuning magnetotransport through spin reorientation in the van der Waals ferromagnet Fe4GeTe2", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/19lx-kg7f", "authors": "Satyabrata Bera, Sudipta Chatterjee, Suman Kalyan Pradhan, et al.", "last_authors": "Ashis K. Nandy, Mintu Mondal", "summary": "The interplay between spin reorientation and topological electronic structure in two-dimensional (2D) van der Waals (vdW) ferromagnets (FMs) is a core issue for understanding how magnetic anisotropy couples to nontrivial topological charge transport. Although spin reorientation transitions (SRTs) ar…", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Relevant to vdW materials, topological electronic structure, ferromagnetism, and transport.", "tags": ["material", "vanderWaals", "ferromagnet", "topol   prevBtn.disabled = index === 0;
  nextBtn.disabled = index === slides.length - 1;
}
prevBtn.addEventListener('click', () => { index = Math.max(0, index - 1); render(); });
nextBtn.addEventListener('click', () => { index = Math.min(slides.length - 1, index + 1); render(); });
document.addEventListener('keydown', event => { if (event.key === 'ArrowLeft') prevBtn.click(); if (event.key === 'ArrowRight') nextBtn.click(); });
render();
</script>
</body>
</html>
