<title>Daily Paper Slideshow</title>
<style>
  :root {
    color-scheme: light;
    --bg: #f6f7f4;
    --paper: #ffffff;
    --ink: #111827;
    --muted: #64748b;
    --line: #d8ddd2;
    --accent: #176b87;
    --accent-2: #9a3412;
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; overflow: auto; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: var(--bg); color: var(--ink); }
  .shell { max-width: 1500px; min-height: 100vh; margin: 0 auto; padding: 14px 18px; display: flex; flex-direction: column; }
  .topbar { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 16px; }
  .top-actions { display: flex; align-items: center; gap: 10px; }
  .topbar a, button { border: 1px solid var(--line); border-radius: 8px; background: var(--paper); color: var(--ink); padding: 10px 14px; font-weight: 700; text-decoration: none; cursor: pointer; }
  button.primary { background: var(--accent); border-color: var(--accent); color: white; }
  button:disabled { opacity: 0.45; cursor: not-allowed; }
  .counter { color: var(--muted); font-weight: 700; }
  .slide { min-height: calc(100vh - 82px); background: var(--paper); border: 1px solid var(--line); border-radius: 10px; padding: 18px; box-shadow: 0 18px 42px rgba(15, 23, 42, 0.10); display: grid; grid-template-columns: minmax(310px, 0.86fr) minmax(0, 1.55fr); gap: 18px; overflow: visible; }
  .paper-head { min-width: 0; min-height: 0; overflow: visible; display: flex; flex-direction: column; gap: 12px; }
  .figure { margin: 0; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: #f8fafc; }
  .figure img { display: block; width: 100%; max-height: 41vh; object-fit: contain; background: white; }
  .figure figcaption { padding: 7px 10px; color: var(--muted); font-size: 12px; line-height: 1.3; }
  .head-text { display: flex; flex-direction: column; gap: 9px; min-width: 0; }
  .badges { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .badge { border-radius: 999px; padding: 5px 9px; background: #eef2ff; color: #3730a3; font-size: 12px; font-weight: 800; }
  .score { background: #fee2e2; color: #991b1b; }
  h1 { margin: 0; font-size: 25px; line-height: 1.15; letter-spacing: 0; overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
  h1 a { color: inherit; text-decoration-color: rgba(23, 107, 135, 0.35); text-decoration-thickness: 2px; text-underline-offset: 4px; }
  h1 a:hover { color: var(--accent); text-decoration-color: var(--accent); }
  .meta, .authors, .why, .abstract { font-size: 13px; line-height: 1.45; }
  .meta, .authors { color: var(--muted); }
  .why strong, .abstract strong, .authors strong { color: var(--ink); }
  .authors { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .why { border-left: 4px solid var(--accent-2); padding-left: 10px; color: #374151; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .abstract { border-top: 1px solid var(--line); padding-top: 14px; color: #374151; }
  .original-abstract { border-top: 1px solid var(--line); padding-top: 10px; color: #374151; font-size: 11.5px; line-height: 1.35; overflow-wrap: anywhere; }
  .original-abstract strong { display: block; margin-bottom: 4px; color: var(--ink); }
  .tags { display: flex; flex-wrap: wrap; gap: 8px; }
  .tag { border-radius: 999px; padding: 4px 8px; background: #f1f5f9; color: #475569; font-size: 12px; font-weight: 700; }
  .head-text > .link { display: none; }
  .briefing { min-width: 0; min-height: 0; overflow: visible; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); grid-auto-rows: minmax(0, auto); align-content: start; gap: 11px 18px; border-top: 0; padding-top: 0; }
  .brief-section { min-width: 0; }
  .brief-section.wide { grid-column: 1 / -1; }
  .brief-section h2 { margin: 0 0 4px; font-size: 14px; line-height: 1.22; color: #0f766e; letter-spacing: 0; }
  .brief-section p, .brief-section li { margin: 0; font-size: 12.5px; line-height: 1.42; color: #1f2937; overflow-wrap: anywhere; }
  .brief-section ul { margin: 0; padding-left: 20px; }
  .concepts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 9px 14px; }
  .concept { border-top: 1px solid var(--line); padding-top: 7px; }
  .concept h3 { margin: 0 0 4px; font-size: 13px; color: #7c2d12; letter-spacing: 0; }
  .concept p { margin: 2px 0 0; font-size: 11.5px; line-height: 1.35; color: #374151; overflow-wrap: anywhere; }
  .concept b { color: #111827; }
  .link { color: var(--accent); font-weight: 800; text-decoration: none; }
  .empty { padding: 48px; background: var(--paper); border: 1px solid var(--line); border-radius: 12px; color: var(--muted); }
  @media (max-width: 860px) {
    .shell { padding: 14px; }
    .topbar, .top-actions { align-items: stretch; flex-direction: column; }
    .slide, .briefing, .concepts { grid-template-columns: 1fr; }
    .slide { min-height: auto; overflow: visible; display: grid; }
    h1 { font-size: 28px; }
  }
</style>

<script>
const slides = [{"title": "Rotational Phonons Activated by Magnetism as a Key Ingredient of Cuprate Physics", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2602.21438", "authors": "Yanyong Wang, Manuel Engel, Christopher Lane, et al.", "last_authors": "Jianwei Sun, Ruiqi Zhang", "summary": "Circularly polarized lattice vibrations carry angular momentum and can link lattice dynamics to collective responses in strongly correlated materials, particularly cuprate superconductors. Angle-resolved photoemission spectroscopy (ARPES) reveals ubiquitous quasiparticle \"kinks\" near ~70 and ~40 meV in cuprates, often accompanied by peak-dip-hump (PDH) features, indicating strong coupling between electrons and low-energy bosonic excitations. However, the relevant phonon modes and the role of circularly polarized vibrations in these spectral anomalies remain largely elusive. Here, we investigate electron-phonon coupling (EPC) in hole-doped infinite-layer CaCuO2 at four selective hole dopings (12.5%-56.25%) using the Strongly Constrained and Appropriately Normed (SCAN) density functional with explicit magnetic interactions. At 25% doping, the magnetic phase exhibits substantially stronger EPC (lambda ~ 0.5), five times that of the nonmagnetic phase, producing kinks and PDH features over 40-80 meV, with self-energy magnitudes comparable to experiment. Oxygen rotational phonons dominate the coupling over 50-65 meV, while breathing modes play a lesser role; the rotational modes emerge exclusively in the magnetic phase. At 37.5% doping, lambda increases to ~1.6 due to strong coupling of low-frequency phonons near the Fermi-surface nesting wave vector, whereas at 56.25%, where Cu magnetic moments vanish, lambda decreases to ~0.4. The rotational modes carry staggered angular momentum that cancels in the unperturbed lattice; a time-reversal-breaking gyrotropic coupling on Cu sites lifts this cancellation, yielding a finite phonon thermal Hall conductivity. Our findings establish magnetism-enhanced EPC as an important ingredient of cuprate physics and identify rotational oxygen phonons as relevant to spectral anomalies, superconductivity, and the pseudogap thermal Hall effect.", "tier": "A_MUST_READ", "score": "10", "reason": "Direct hit: Connects ARPES kinks and spectral anomalies in cuprates to magnetism-enhanced electron-phonon coupling.", "tags": ["ARPES", "cuprate", "phonon", "magnetism"], "image": "https://arxiv.org/html/2602.21438v2/bandstruc-set.png", "briefing": {"background": "구프레이트(Cuprate) 고온 초전도체에서 ARPES 실험을 통해 관찰되는 40~70 meV 영역의 '킹크(kink)'와 Peak-Dip-Hump(PDH) 구조는 전자와 보존(boson) 간의 강한 결합을 나타내는 핵심 지표로 여겨져 왔습니다. 하지만 이 보존이 정확히 어떤 포논 모드인지, 그리고 자성이 이 결합에 어떤 역할을 하는지는 수십 년간 논쟁의 대상이었습니다.", "motivation": "최근 원편광 격자 진동(chiral phonons)이 각운동량을 가질 수 있음이 밝혀짐에 따라, 본 연구는 무한 층상 구조인 CaCuO2에서 자성과 결합된 산소 회전 포논(rotational phonons)이 ARPES 스펙트럼의 이상 현상과 초전도 메커니즘에 어떤 영향을 미치는지 규명하고자 했습니다.", "result": "SCAN 밀도범함수 이론(DFT) 계산 결과, 자성 상(magnetic phase)에서의 전자-포논 결합 상수(lambda)가 비자성 상보다 5배나 크다는 것을 발견했습니다. 특히 40~80 meV 영역의 킹크와 PDH 구조는 산소 회전 포논에 의해 주도되며, 이는 오직 자성이 존재할 때만 활성화됩니다. 또한, 이 회전 모드들이 구리(Cu) 사이트에서 시간 반전 대칭을 깨는 결합을 통해 유한한 포논 열 홀 전도도를 유발함을 보였습니다.", "implication": "이 결과는 구프레이트의 수송 현상 및 분광 특성에서 자성과 포논의 시너지가 필수적임을 시사합니다. 특히 의사갭(pseudogap) 영역에서 관찰되는 거대한 열 홀 효과의 기원을 격자 진동의 각운동량 관점에서 설명할 수 있는 이론적 토대를 제공합니다.", "novelty": "ARPES 전문가인 독자에게 매우 중요한 연구로, 단순한 호흡 모드(breathing mode)가 아닌 '회전 포논'이 킹크의 주원인임을 지적했습니다. 자성이 EPC를 극적으로 강화한다는 점과 포논 각운동량을 통한 시간 반전 대칭 파괴를 연결한 점이 매우 독창적입니다.", "unresolved": "계산된 결과가 실제 실험(ARPES/RIXS)에서 특정 산소 회전 모드로 직접 관찰될 수 있는지, 그리고 다른 구프레이트 계열(YBCO, BSCCO 등)에서도 동일한 메커니즘이 지배적인지에 대한 검증이 필요합니다.", "future_work": "원편광 비탄성 X선 산란이나 중성자 산란을 통해 산소 회전 모드의 카이랄성을 직접 측정하고, 도핑 변화에 따른 자성-포논 결합의 진화 과정을 ARPES로 정밀 추적하는 연구가 기대됩니다.", "concepts": [{"term": "ARPES Kink", "why_emerged": "전자가 특정 에너지의 보존(포논, 마그논 등)과 산란될 때 분산 관계가 꺾이는 현상을 설명하기 위해 도입되었습니다.", "origin": "1990년대 후반~2000년대 초반 구프레이트 ARPES 실험에서 널리 확인됨.", "connections": "Self-energy, Electron-phonon coupling, Eliashberg theory"}, {"term": "Rotational Phonons", "why_emerged": "격자 진동이 단순 선형 운동이 아닌 회전 운동을 할 때 각운동량을 가질 수 있음을 설명하기 위해 주목받기 시작했습니다.", "origin": "최근 고체 물리 내 카이랄 포논(Chiral phonon) 연구 흐름에서 파생됨.", "connections": "Phonon angular momentum, Thermal Hall effect, Time-reversal symmetry breaking"}, {"term": "SCAN functional", "why_emerged": "기존 DFT(LDA/GGA)의 한계를 넘어 강상관 전자계의 구조 및 자기적 특성을 더 정확히 예측하기 위해 개발되었습니다.", "origin": "Jianwei Sun 등이 제안한 Meta-GGA 범함수.", "connections": "Density Functional Theory, Strongly correlated systems, Hubbard U"}, {"term": "Peak-Dip-Hump (PDH)", "why_emerged": "ARPES 스펙트럼에서 준입자 피크와 고에너지 산란 구조 사이의 움푹 들어간 부분을 설명하기 위해 사용되는 용어입니다.", "origin": "구프레이트 초전도체의 광전자 분광학 연구에서 확립됨.", "connections": "Quasiparticle lifetime, Superconducting gap, Bosonic mode coupling"}], "english_summary": ["Magnetic interactions in CaCuO2 significantly enhance electron-phonon coupling (EPC), specifically through oxygen rotational phonons.", "These rotational modes, activated by magnetism, explain the 40-80 meV ARPES kinks and peak-dip-hump features observed in cuprates.", "The coupling of these phonons to Cu sites breaks time-reversal symmetry, providing a mechanism for the anomalous phonon thermal Hall effect.", "The findings suggest that rotational lattice vibrations are a central, yet previously overlooked, component of cuprate physics."]}}, {"title": "Intertwined charge density wave order in vanadium based kagome superconductors", "journal": "npj_QuantumMaterials", "source": "Gemini", "link": "https://www.nature.com/articles/s41535-026-00955-8", "authors": "Kuanglv Sun, Linpeng Nie, Hongyu Li, et al.", "last_authors": "Tao Wu, Xianhui Chen", "summary": "Intertwined charge density wave order in vanadium based kagome superconductors", "tier": "A_MUST_READ", "score": "10", "reason": "Directly addresses core AV3Sb5 kagome physics, CDW, and superconductivity relevant to user.", "tags": ["kagome", "AV3Sb5", "CDW"], "image": "https://pubads.g.doubleclick.net/gampad/ad?iu=/285/npjquantmats.nature.com/article&sz=728x90&c=-1478657378&t=pos%3Dtop%26type%3Darticle%26artid%3Ds41535-026-00955-8%26doi%3D10.1038/s41535-026-00955-8%26subjmeta%3D301,639,766%26kwrd%3DMaterials+science,Physics", "briefing": {"background": "바나듐 기반 카고메 금속(AV3Sb5, A=K, Rb, Cs)은 위상 특성, 전하 밀도 파(CDW), 그리고 초전도성이 공존하며 얽혀 있는 독특한 물리적 상태로 인해 최근 응집물질물리 분야의 핵심 주제로 떠올랐습니다.", "motivation": "이 물질들에서 나타나는 CDW가 단순한 격자 왜곡인지, 아니면 자발적인 시간 반전 대칭 파괴나 루프 전류(loop current)와 결합된 복합적인 질서인지를 이해하는 것이 본 분야의 최대 화두입니다.", "result": "초록 정보가 제한적이나, 제목을 통해 볼 때 AV3Sb5 계열에서 관찰되는 여러 CDW 모드들이 서로 어떻게 얽혀(intertwined) 있으며, 이것이 초전도 상태와 어떻게 경쟁하거나 공존하는지에 대한 종합적인 분석 혹은 새로운 실험적 증거를 제시한 것으로 보입니다.", "implication": "CDW 질서 매개변수가 다성분(multi-component)으로 구성되어 있음을 입증한다면, 이는 이 물질의 비정상적인 홀 효과나 네마틱(nematic) 거동을 설명하는 중요한 단서가 됩니다.", "novelty": "독자의 핵심 관심사인 AV3Sb5 물질의 CDW와 초전도성 간의 상관관계를 다룹니다. 특히 'Intertwined'라는 키워드는 단순히 한 종류의 CDW가 아닌, 복합적인 질서 파라미터를 암시합니다.", "unresolved": "초록만으로는 구체적인 실험 기법이나 핵심 데이터를 확인할 수 없으나, CDW의 미시적 기원(중첩성 vs 강한 상관관계)에 대한 논쟁은 여전히 진행 중입니다.", "future_work": "다양한 외부 압력이나 화학적 도핑을 통해 CDW 상도표를 정밀화하고, STM 및 ARPES를 이용해 얽혀 있는 각 질서의 공간적/에너지적 분포를 직접 매핑하는 연구가 수반되어야 합니다.", "concepts": [{"term": "Kagome Lattice", "why_emerged": "삼각형과 육각형이 교대로 배열된 구조에서 발생하는 기하학적 좌절(frustration)과 특이한 밴드 구조(flat band, Dirac cone)를 연구하기 위해 도입되었습니다.", "origin": "전통적인 격자 구조 중 하나이나, 최근 양자 물질 연구에서 재조명됨.", "connections": "Geometric frustration, Flat bands, AV3Sb5"}, {"term": "Charge Density Wave (CDW)", "why_emerged": "금속 내 전자 밀도가 격자의 주기성보다 긴 주기로 주기적인 변조를 일으키는 현상을 설명하기 위해 제안되었습니다.", "origin": "1930년대 Peierls가 이론적으로 예측.", "connections": "Peierls transition, Fermi surface nesting, Electron-phonon coupling"}, {"term": "Intertwined Order", "why_emerged": "고온 초전도체 등에서 초전도, 자기성, 전하 질서가 서로 독립적이지 않고 밀접하게 연결되어 나타나는 복합적인 상을 설명하기 위해 사용됩니다.", "origin": "Fradkin, Kivelson 등이 제안한 개념.", "connections": "Competing orders, Pair density wave, Multicomponent order parameter"}, {"term": "AV3Sb5", "why_emerged": "카고메 격자 구조에서 위상 특성과 상관관계 물리(CDW, SC)를 동시에 연구할 수 있는 플랫폼으로서 발견되었습니다.", "origin": "2019~2020년경 Stephen Wilson 그룹 등에서 연구 본격화.", "connections": "CsV3Sb5, KV3Sb5, RbV3Sb5, Vanadium-based superconductors"}], "english_summary": ["The paper investigates the nature of intertwined charge density wave (CDW) orders in vanadium-based kagome superconductors.", "It focuses on the complex relationship between multiple CDW components and the emerging superconductivity.", "The study aims to clarify the microscopic origins of electronic instabilities in the AV3Sb5 family.", "The concept of 'intertwined order' is central to explaining the diverse symmetry-breaking phenomena in these materials."]}}, {"title": "Unconventional resistivity reduction in NbP semimetal nanoribbons", "journal": "Nature", "source": "author whitelist", "link": "https://www.nature.com/articles/s41586-026-11288-8", "authors": "Haotian Su, Sauviz Alaei, Áshildur Friðriksdóttir, et al.", "last_authors": "Binghai Yan, Eric Pop", "summary": "Niobium phosphide semimetal nanoribbons show decreasing resistivity with decreasing width, unlike the classical behaviour of metals such as copper, offering a platform for nanoscale wires and interconnects via industry-friendly top-down nanofabrication.", "tier": "A_MUST_READ", "score": "9", "reason": "author whitelist: Zhi-Xun Shen", "tags": ["authorWhitelist"], "image": "https://media.springernature.com/m685/springer-static/image/art%3A10.1038%2Fs41586-026-11288-8/MediaObjects/41586_2026_11288_Fig1_HTML.png", "briefing": {"background": "반도체나 금속 배선의 크기가 나노 스케일로 줄어들면, 표면 산란(surface scattering)으로 인해 전기 저항이 급격히 증가하는 것이 일반적입니다(Matthiessen의 법칙). 이는 차세대 초미세 반도체 공정의 큰 장애물입니다.", "motivation": "위상 세미메탈(Topological Semimetals)은 표면 상태가 보호되거나 소산이 적은 전송 특성을 가질 수 있습니다. 본 연구는 대표적인 Weyl 세미메탈인 NbP 나노리본에서 폭이 좁아짐에 따라 저항이 어떻게 변하는지 탐구했습니다.", "result": "고전적인 금속(구리 등)과 달리, NbP 나노리본은 폭이 좁아질수록 오히려 비저항(resistivity)이 감소하는 이례적인 현상을 발견했습니다. 이는 '상향식(top-down)' 나노 공정으로 제작된 소자에서 관찰된 결과라 산업적 응용 가능성이 높습니다.", "implication": "위상 물질이 단순히 기초 물리 연구 대상에 그치지 않고, 구리를 대체할 수 있는 차세대 나노 배선(interconnect) 소재로서 실질적인 우위를 가질 수 있음을 보여줍니다.", "novelty": "독자의 관심사인 Weyl 세미메탈(NbP)을 다루며, 위상적 특성이 실용적인 전송 효율 개선으로 이어진 중요한 사례입니다. 특히 Zhi-Xun Shen과 Binghai Yan 등 저명한 저자진이 참여하여 신뢰도가 높습니다.", "unresolved": "저항 감소의 정확한 메커니즘이 위상 표면 상태(Fermi arc)의 기여 때문인지, 아니면 수력학적 전자 흐름(hydrodynamic flow)과 같은 다른 효과 때문인지에 대한 명확한 분리가 필요합니다.", "future_work": "더 극한의 나노 스케일에서의 거동 확인, 그리고 NbP 외의 다른 위상 세미메탈(TaP, TaAs 등)에서도 동일한 비정상적 저항 감소가 나타나는지 확인하는 연구가 이어질 것으로 보입니다.", "concepts": [{"term": "Weyl Semimetal", "why_emerged": "질량이 없는 Weyl 페르미온을 고체 내 준입자로 구현하고, 그에 따른 양자 이상 현상을 연구하기 위해 제안되었습니다.", "origin": "2015년 NbAs, TaAs 등에서 실험적으로 처음 확인됨.", "connections": "Fermi arcs, Chiral anomaly, NbP"}, {"term": "NbP", "why_emerged": "최초로 발견된 비중심대칭 Weyl 세미메탈 제품군 중 하나로, 화학적으로 안정적이며 전하 이동도가 매우 높습니다.", "origin": "2015년 H. Weng, B. Yan 등에 의해 이론적/실험적으로 연구됨.", "connections": "TaAs family, Topological interconnects"}, {"term": "Resistivity Reduction", "why_emerged": "나노 크기 효과에 따른 저항 증가 문제를 극복하기 위한 새로운 물리적 메커니즘으로 제시되었습니다.", "origin": "본 논문에서 NbP 나노리본을 통해 주요 현상으로 보고함.", "connections": "Surface scattering, Ballistic transport, Size effect"}, {"term": "Interconnects", "why_emerged": "집적 회로 내부에서 소자들을 연결하는 금속 배선의 저항과 발열 문제를 해결하기 위해 고성능 소재의 필요성이 대두되었습니다.", "origin": "반도체 공학의 전통적 과제.", "connections": "Copper interconnects, Post-CMOS scaling, Topological electronics"}], "english_summary": ["Niobium phosphide (NbP) nanoribbons exhibit an unconventional decrease in resistivity as their width is reduced.", "This behavior contrasts with conventional metals like copper, where surface scattering increases resistance at the nanoscale.", "The findings suggest that Weyl semimetals could serve as superior materials for next-generation, high-density interconnects.", "The study utilizes industry-friendly top-down nanofabrication, enhancing the practical relevance of topological materials."]}}, {"title": "55Mn-NMR/NQR study on the kagome metal Sc3Mn3Al7Si5: Re-examining the possibility of spin-singlet paired state", "jour gnetic multipole associated with t…", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Theory of magnetic octupoles in the highly relevant chiral antiferromagnet Mn3Sn.", "tags": ["theory", "magneticmaterial", "topologicalsemimetal", "multipoleorder", "Mn3Sn"], "image": "", "briefing": {"background": "Mn3Sn은 비자성 및 강자성 위상 반금속 연구에서 중요한 물질로, 거대 이상 홀 효과 등을 설명하기 위해 클러스터 자기 팔극자(CMO) 모델이 주로 사용되어 왔습니다.", "motivation": "기존 CMO 모델 외에 개별 Mn 원자 내부 수준에서 발생하는 원자 내 자기 팔극자(AMO)의 존재 여부와 이것이 CMO와 어떻게 결합하는지 규명하고자 합니다.", "result": "Mn3Sn에서 AMO가 존재함을 이론적으로 보였으며, 이들이 격자 내 CMO와 결합하여 자성 특성을 결정짓는 복합적인 다극자 순서임을 확인했습니다.", "implication": "Mn3Sn의 자기적 성질을 이해하는 데 있어 단순히 클러스터 단위뿐만 아니라 원자 단위의 국소적 다극자 자유도를 고려해야 함을 시사합니다.", "novelty": "위상 반금속의 자기적 근원을 더 근본적인 다극자 물리로 세분화하여 접근했다는 점이 독창적이며, 특히 Mn3Sn의 복잡한 자기 구조를 이해하는 데 새로운 시각을 제공합니다.", "unresolved": "이러한 미세한 AMO의 기여를 실험적으로 어떻게 직접 분리하여 측정할 수 있을지는 여전히 과제로 남아 있습니다.", "future_work": "AMO와 CMO의 결합이 비탄성 중성자 산란이나 특정 X-선 분광법 결과에 미치는 영향을 계산하는 후속 연구가 필요합니다.", "concepts": [{"term": "Cluster Magnetic Octupole (CMO)", "why_emerged": "Mn3Sn과 같은 비공선형 반강자성체에서 나타나는 거대 이상 홀 효과와 비자성 특성을 설명하기 위해 제안되었습니다.", "origin": "Suzuki et al. (2017) 등에 의해 광범위하게 논의되었습니다.", "connections": "Berry curvature, anomalous Hall effect, topological semimetals."}, {"term": "Intra-atomic Magnetic Octupole (AMO)", "why_emerged": "원자 수준의 국소적인 자성 구조가 클러스터 단위의 질서와 어떻게 상호작용하는지 기술하기 위해 필요합니다.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "Multipole orders, crystal field theory, magnetic phase transitions."}], "english_summary": ["The paper investigates magnetic octupoles in the chiral antiferromagnet Mn3Sn.", "It distinguishes between cluster-scale octupoles (CMO) and intra-atomic octupoles (AMO).", "AMO and CMO are shown to exhibit significant coupling at the atomic scale.", "This provides a more granular understanding of the magnetic order in topological semimetals."]}}, {"title": "Magnonic butterflies in noncommensurate one-dimensional van der Waals magnetic helices", "journal": "PRB_Recen ate helical ground state.", "The study reveals 'magnonic butterfly' patterns in the spin-wave spectrum.", "These patterns result from the interaction between helical magnetic order and the underlying lattice."]}}, {"title": "Multiple Andreev reflection spectroscopy of spin-resolved proximity states", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/pspn-zpf3", "authors": "A. A. Golubov, M. Yu. Kupriyanov", "last_authors": "A. A. Golubov, M. Yu. Kupriyanov", "summary": "A. Golubov and M. Yu. Kupriyanov We study coherent multiple Andreev reflections in short constrictions connecting superconductor-ferromagnet bilayers with parallel exchange fields. Proximity-induced spectral reconstruction produces split and redistributed differential-resistance anomalies, modifying both odd- and even-order subharm…", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Probing spin-resolved proximity states in superconductor-ferromagnet heterostructures using Andreev spectroscopy.", "tags": ["superconductivity", "ferromagnetism", "heterostructure", "spectroscopy", "proximityeffect"], "image": "", "briefing": {"background": "초전도체와 강자성체 접합(S/F)에서는 근접 효과로 인해 스핀 분해된 준입자 상태가 나타나며, 이는 소자 내의 수송 현상에 결정적인 영향을 미칩니다.", "motivation": "S/F 이중층에서의 다중 Andreev 반사(MAR)가 스핀 분해된 근접 상태에 의해 어떻게 변조되는지 분광학적 관점에서 분석하고자 합니다.", "result": "접합부의 비대칭성과 스핀 분해된 상태가 MAR의 서브하모닉 구조에 미치는 영향을 수학적으로 규명하고, 차동 저항의 이상 징후를 설명했습니다.", "implication": "MAR 분광학이 스핀 트랜지스터나 초전도 스핀트로닉스 소자에서 내부 스핀 상태를 진단하는 강력한 도구가 될 수 있음을 보여줍니다.", "novelty": "기존의 상미분 방정식을 넘어선 복잡한 간섭 현상을 다루며, 실험적인 차동 저항 데이터 해석에 이론적 토대를 제공합니다.", "unresolved": "강한 자기적 계면 거칠기나 스핀-궤도 결합이 존재할 경우의 복잡한 비등방성 효과는 모델에 완전히 반영되지 않았습니다.", "future_work": "실제 S/F/S 접합에서 저온 STS나 마이크로파 분광법을 통한 실험적 검증이 요구됩니다.", "concepts": [{"term": "Multiple Andreev Reflection (MAR)", "why_emerged": "초전도 접합에서 캐리어가 초전도 갭 사이를 여러 번 왕복하며 발생하는 비선형 전류-전압 관계를 이해하기 위해 필요합니다.", "origin": "Klapwijk, Flensberg, Tinkham 등 (1980년대).", "connections": "Josephson effect, subharmonic gap structure, quasiparticle transport."}, {"term": "Proximity Effect", "why_emerged": "초전도체와 비초전도체 사이의 계면에서 전자-정공 결합이 퍼져나가는 현상을 설명하기 위해 도입되었습니다.", "origin": "De Gennes (1960년대).", "connections": "Cooper pair tunneling, spin-triplet, Yu-Shiba-Rusinov states."}], "english_summary": ["The paper analyzes multiple Andreev reflections (MAR) in S/F heterostructures.", "Spin-resolved proximity states lead to specific reconstructions in the subharmonic gap structure.", "The study links differential resistance anomalies to underlying magnetic configurations.", "This approach enhances the diagnostic capability of spectroscopy in superconducting spintronics."]}}, {"title": "Orbital-competition mediated interlayer coupling in bilayer altermagnetic V2S2O", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/t64v-c4w1", "authors": "Siqi Xu, Shaowen Xu, Qilong Cui, et al.", "last_authors": "Gaofeng Xu, Fanhao Jia", "summary": "Using density functional theory and nonequilibrium Green's functions, we systematically study how interlayer interactions affect the electronic and spin-polarize…", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "DFT study of altermagnetism and electronic/spin properties in a specific material.", "tags": ["theory", "altermagnetism", "electronicstructure"], "image": "", "briefing": {"background": "Altermagnetism은 기존의 강자성(ferromagnetism)이나 반강자성(antiferromagnetism)과는 구별되는, 스핀 분리된 밴드 구조를 가지면서도 순수 자화가 상쇄되는 새로운 자기 질서 상태입니다. 층상 구조 물질에서의 층간 상호작용은 전체적인 전자 구조와 위상적 성질을 결정하는 중요한 요소입니다.", "motivation": "이 연구는 2차원 Altermagnetic 물질인 V2S2O 이중층 구조에서 층간 결합이 어떻게 전자 및 스핀 상태를 제어하는지 규명하고자 합니다.", "result": "궤도 경쟁(orbital-competition)이 층간 상호작용을 매개하여 스핀 편극 특성과 전자 구조를 변조함을 확인했습니다.", "implication": "이 결과는 자성 층상 물질을 설계할 때 궤도 자유도를 활용하여 자기적 상태를 조절할 수 있는 가능성을 보여줍니다.", "novelty": "Altermagnetism을 층상 V2S2O 시스템에 적용하여 궤도-스핀-층간 결합의 복합적인 상호작용을 DFT로 규명했다는 점이 주목됩니다.", "unresolved": "실제 실험적 구현을 위한 합성 조건이나 온도에 따른 자기 위상 변화에 대한 정밀한 분석이 추가로 필요합니다.", "future_work": "ARPES나 STS를 통한 실제 전자 구조 측정 및 스핀-궤도 토크 응용 가능성에 대한 후속 연구가 기대됩니다.", "concepts": [{"term": "Altermagnetism", "why_emerged": "순자화가 없음에도 불구하고 스핀 분리 밴드를 가지는 물질군을 체계적으로 분류하기 위해 제안됨.", "origin": "초록 정보만으로는 특정하기 어려움 (최근 이론 물리학계에서 급격히 대두된 개념).", "connections": "강자성, 반강자성, 비전통적 자성체와 연결됨."}, {"term": "Orbital-competition", "why_emerged": "물질 내 서로 다른 궤도가 에너지를 낮추기 위해 점유율을 다투며 발생하는 현상을 설명하기 위함.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "강상관계 물질의 전자 상전이 및 자기 특성 결정에 중요."}], "english_summary": ["Systematic study of bilayer altermagnetic V2S2O using DFT.", "Explores orbital-competition mediated interlayer coupling.", "Demonstrates how interlayer interactions tune electronic and spin-polarized properties.", "Highlights the potential for manipulating magnetism in layered systems."]}}, {"title": "Spectral functions of an extended antiferromagnetic S=12 Heisenberg model on the triangular lattice", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/yfq3-6lmq", "authors": "Markus Drescher, Laurens Vanderstraeten, Roderich Moessner, Frank Pollmann", "last_authors": "Roderich Moessner, Frank Pollmann", "summary": "a single spin flip breaks apart into two independent emergent fractionalized particles, leaving a distinctive continuum in neutron-scattering spectra. Here, using GPU-accelerated dynamical matrix-product-state simulations, the authors compute such spectra for a frustrated triangular-lattice antiferromagnet with new levels of accuracy. The results support the existence of two spin-liquid phases, a U (1) Dirac spin liquid and a chiral spin liquid.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Computational study of spin liquid phases in frustrated magnets with direct relevance to neutron scattering.", "tags": ["spinliquid", "antiferromagnet", "neutronscattering", "theory", "stronglycorrelated"], "image": "", "briefing": {"background": "좌절된 자성체(frustrated magnets)는 양자 스핀 액체(QSL)와 같은 이국적인 양자 상태를 탐색하는 주요 무대입니다. 이러한 상태는 기존 자기 질서와 달리 스핀이 끝까지 정렬하지 못하는 특성을 가집니다.", "motivation": "삼각 격자(triangular lattice) 하이젠베르크 모델에서 스핀 액체 후보군들의 스펙트럼 함수를 정밀하게 계산하여 실험 데이터와 대조하고자 합니다.", "result": "GPU 가속 동역학적 행렬 곱 상태(MPS) 시뮬레이션을 통해 U(1) 디락 스핀 액체와 카이랄 스핀 액체의 존재를 강력히 뒷받침하는 스펙트럼 정보를 제공했습니다.", "implication": "중성자 산란 실험에서 관측되는 연속 스펙트럼(continuum)의 기원을 이해하고, 분수화된 입자(spinons)의 존재를 실험적으로 증명하는 데 중요한 지침이 됩니다.", "novelty": "기존 수치 해석보다 월등히 높은 정확도로 삼각 격자 시스템의 미세한 스펙트럼 차이를 구분해냈습니다.", "unresolved": "실제 후보 물질들에서의 섭동(예: 이방성, 무질서)이 이러한 이상적인 스핀 액체 상태를 얼마나 보존하는지는 여전히 난제입니다.", "future_work": "실제 삼각 격자 물질에서의 중성자 산란 및 RIXS 데이터와 직접 비교 분석이 필요합니다.", "concepts": [{"term": "Quantum Spin Liquid (QSL)", "why_emerged": "절대 영도에서도 자기 질서가 없는 상태를 기술하기 위해 필요.", "origin": "Philip Anderson (1973).", "connections": "분수화된 여기, 장거리 얽힘, 위상적 질서와 연결."}, {"term": "Dynamical Matrix-Product-State (MPS)", "why_emerged": "강상관계 시스템의 다체 문제를 효율적으로 수치 해결하기 위해.", "origin": "Steven White (DMRG 기반의 MPS).", "connections": "텐서 네트워크, 밀도 행렬 재규격화군(DMRG)과 연결."}], "english_summary": ["Computational analysis of an extended S=1/2 Heisenberg model on a triangular lattice.", "Utilizes GPU-accelerated dynamical MPS for accurate spectral functions.", "Provides evidence for U(1) Dirac and chiral spin liquid phases.", "Bridge between theoretical spin liquid models and neutron scattering spectra."]}}, {"title": "Spin Josephson supercurrent in altermagnetic superconducting nanowire junctions", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/q5z7-h12g", "authors": "Yue Mao, Xing-Jian Yi, Yu-Chen Zhuang, Cheng-Ming Miao, Qing-Feng Sun", "last_authors": "Cheng-Ming Miao, Qing-Feng Sun", "summary": "The spin supercurrent is a key concept for enabling energy-efficient operation. In this Letter, we propose that a spin Josephson supercurrent can be generated in altermagnetic superconducting nanowire (SNW) junctions. We present a physical picture in which a superconducting gap with a dominant spin-…", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Theoretical proposal for spin Josephson supercurrents in altermagnetic superconducting junctions.", "tags": ["theory", "altermagnetism", "superconductivity"], "image": "", "briefing": {"background": "스핀 초전류(spin supercurrent)는 에너지 손실 없이 스핀 정보를 전달할 수 있어 차세대 스핀트로닉스의 핵심 소자로 주목받고 있습니다.", "motivation": "Altermagnetism의 독특한 스핀 구조를 초전도체 접합에 도입하여 새로운 유형의 스핀 조셉슨 효과를 제안하고자 합니다.", "result": "Altermagnetic 초전도 나노와이어 접합에서 스핀 의존적인 초전도 갭이 조셉슨 전류를 변조하며, 이를 통해 스핀 초전류 생성이 가능함을 이론적으로 보였습니다.", "implication": "에너지 효율적인 스핀 로직 소자 설계에 있어서 새로운 물리적 경로를 제시합니다.", "novelty": "Altermagnetism이 가진 고유한 스핀-궤도 물리와 초전도 위상 조셉슨 효과를 접목한 새로운 제안입니다.", "unresolved": "현실적인 나노와이어 구조에서 스핀 확산 길이 및 계면 효과가 스핀 초전류 보존에 미치는 영향은 추가 규명이 필요합니다.", "future_work": "Altermagnetic 나노와이어를 포함한 초전도 접합 소자의 실제 제작 및 전기적 측정 실험이 필요합니다.", "concepts": [{"term": "Spin Josephson effect", "why_emerged": "전하 흐름이 아닌 스핀 흐름을 조셉슨 접합을 통해 제어하기 위해.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "조셉슨 효과, 스핀트로닉스, 비전통적 초전도체와 연결."}, {"term": "Superconducting nanowire junctions", "why_emerged": "저차원 시스템에서의 초전도 현상 제어 및 소자화.", "origin": "초록 정보만으로는 특정하기 어려움 (1D 초전도 연구의 연장선).", "connections": "Majorana fermion 탐색, 위상 초전도체와 연결."}], "english_summary": ["Theoretical proposal for spin Josephson supercurrent in altermagnetic superconducting nanowire junctions.", "Exploits the spin-split electronic structure of altermagnets.", "Offers a framework for energy-efficient spin information processing.", "Links altermagnetism with superconducting junction physics."]}}, {"title": "Symmetry-protected triplet Weyl complexes", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/y6q8-2mbb", "authors": "Yun-Yun Bai, Ke-Xin Pang, Yan Gao, Weikang Wu, Shengyuan A. Yang", "last_authors": "Weikang Wu, Shengyuan A. Yang", "summary": "A. Yang The Nielsen-Ninomiya theorem dictates that Weyl nodes must appear in pairs of opposite chirality to preserve global charge neutrality. However, in crystals, specific crystalline symmetries can st  superconductivity in SmNiO2 films.", "Used ultrafast terahertz spectroscopy to measure superfluid density.", "Provides experimental evidence for d-wave pairing symmetry.", "Strengthens the analogy between nickelates and cuprates."]}}, {"title": "Fully Nonequilibrium Hall Response from Berry Curvature", "journal": "PRL_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/cj8b-4sp4", "authors": "Shouvik Sur, Lei Chen, Yiming Wang, Chandan Setty, Silke Paschen, Qimiao Si", "last_authors": "Silke Paschen, Qimiao Si", "summary": "In topological materials, Berry curvature leads to intrinsic Hall responses. Focusing on time-reversal symmetric systems with broken inversion symmetry, a spontaneous (zero magnetic field) Hall effect is expected to develop under an applied electric field. Motivated by recent developments in Weyl-Ko…", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Relevant to topological semimetals and Hall physics in quantum materials.", "tags": ["topology", "Berrycurvature", "Halleffect"], "image": "", "briefing": {"background": "위상 물질에서 베리 곡률(Berry curvature)은 전자 상태의 기하학적 위상 성질을 나타내며, 이는 외부 자기장 없이도 발생하는 비정상 홀 효과(Anomalous Hall Effect)의 근원입니다.", "motivation": "반전 대칭이 깨진 시간-반전 대칭 시스템에서 강한 전기장을 인가했을 때, 평형 상태를 벗어난(Nonequilibrium) 환경에서 베리 곡률이 어떻게 홀 응답을 유도하고 제어하는지를 이론적으로 규명하고자 합니다.", "result": "외부 전기장이 시스템의 위상적 전자 구조와 상호작용하여 완전히 비평형 상태의 홀 응답을 생성하는 메커니즘을 제시했습니다.", "implication": "이 모델은 Weyl-Kondo 반금속 등 비평형 상태의 위상 물질에서 나타나는 비정상적인 수송 현상을 해석하는 이론적 토대를 제공합니다.", "novelty": "평형 상태의 응답을 넘어, 강한 전기장이 인가된 동적 상황에서 위상 불변량이 어떻게 물리적으로 발현되는지를 다룬다는 점에서 독창적입니다.", "unresolved": "실제 Weyl-Kondo 격자 시스템에서 이 효과가 실험적으로 관측 가능한 크기의 신호로 나타나는지, 그리고 산란 효과가 어떻게 이 응답을 억제하는지는 명확하지 않습니다.", "future_work": "다른 위상 물질로의 확장 연구 및 강한 전기장 하에서의 비선형 홀 효과 실험 설계가 필요합니다.", "concepts": [{"term": "베리 곡률", "why_emerged": "블로흐 전자 상태의 기하학적 위상 성질을 기술하기 위해 도입되었습니다.", "origin": "마이클 베리(Michael Berry, 1984)", "connections": "위상 절연체, 비정상 홀 효과, 위상 반금속."}, {"term": "비평형 홀 응답", "why_emerged": "강한 전기장 등 외부 요인에 의해 전자의 분포가 평형을 벗어날 때 발생하는 비선형 수송 현상을 이해하기 위해 필요합니다.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "비선형 홀 효과, 위상 반금속의 동역학."}], "english_summary": ["Studies the nonequilibrium Hall response induced by Berry curvature in inversion-broken systems.", "Focuses on time-reversal symmetric systems under strong electric fields.", "Provides a theoretical framework for transport in Weyl-Kondo and topological semimetals.", "Links electronic topology to nonequilibrium transport phenomena."]}}, {"title": "Probing Bilayer Topological Order with Layer-Resolved Transport", "journal": "PRL_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/fd6s-x6k3", "authors": "Hongquan Liu, J. I. A. Li, D. E. Feldman", "last_authors": "J. I. A. Li, D. E. Feldman", "summary": "A. Li, and D. E. Feldman Shot noise has been used to measure fractional charges of anyons. The value of the charge imposes constraints on fractional statistics but does not determine it. This limitation is particularly important in multi-component systems. For example, the zero charge of neutral anyons in bilayer graphene g…", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Topological order in bilayer graphene systems relates to user interests in 2D materials and topology.", "tags": ["graphene", "topological", "transport"], "image": "", "briefing": {"background": "2차원 물질의 위상학적 상태를 파악하기 위해 샷 노이즈(shot noise)를 측정하여 준입자의 전하를 확인하는 방법이 널리 쓰여왔으나, 이는 준입자의 통계적 성질을 완벽히 규명하지 못하는 한계가 있습니다.", "motivation": "이중층(bilayer) 그래핀과 같이 다중 구성 요소 시스템에서 나타나는 중성 애니온과 같은 특이 준입자의 위상학적 질서를 층-분해 수송 측정을 통해 규명하고자 합니다.", "result": "층-분해(layer-resolved) 수송 측정이 기존 샷 노이즈 분석의 한계를 넘어 위상학적 질서를 확인하는 강력한 도구가 될 수 있음을 보여주었습니다.", "implication": "다중 성분 위상 물질에서 단순한 전하 측정만으로는 파악하기 힘든 애니온 통계를 이해하고 제어하는 새로운 실험적 경로를 제시합니다.", "novelty": "2D 물질의 이중층 구조를 활용하여 층간 자유도를 위상 상태 연구에 도입한 점이 독창적입니다.", "unresolved": "실험적으로 매우 낮은 온도에서의 정밀한 층간 수송 제어 및 노이즈 측정 기술의 복잡성이 남아 있습니다.", "future_work": "특정 이중층 위상 절연체나 분수 양자 홀 효과 시스템에서의 실험적 검증이 기대됩니다.", "concepts": [{"term": "샷 노이즈", "why_emerged": "전하의 양자화와 준입자의 분수 전하를 직접적으로 확인하기 위해 필요합니다.", "origin": "슈트키(Walter Schottky, 1918)", "connections": "양자 홀 효과, 애니온, 분수 전하."}, {"term": "애니온", "why_emerged": "2차원 시스템에서 보손과 페르미온을 넘어선 위상학적 통계를 갖는 준입자를 기술하기 위해 필요합니다.", "origin": "윌첵(Frank Wilczek, 1982)", "connections": "분수 양자 홀 효과, 위상 양자 컴퓨터."}], "english_summary": ["Addresses the limitations of shot noise in measuring topological order in bilayer systems.", "Proposes layer-resolved transport measurements to probe neutral anyons.", "Focuses on multi-component systems like bilayer graphene.", "Enables better characterization of fractional statistics beyond simple charge measurements."]}}, {"title": "Spin Excitons Modulated by Magnetic Orders in a Magnetic Weyl Semimetal NdAlSi", "journal": "PRL_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/tpm2-778n", "authors": "Bo Zhang, Junbo Liao, Lihao Xia, et al.", "last_authors": "Jian-Xin Li, Jinsheng Wen", "summary": "We report the observation of dispersive spin excitons in the rare-earth magnetic Weyl semimetal NdAlSi through comprehensive thermodynamic and inelastic neutron scattering measurements. Notably, the behavior of spin excitons is strongly modulated by magnetic order: they remain dispersive in the para…", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Relevant magnetic Weyl semimetal study with inelastic neutron scattering evidence.", "tags": ["Weyl", "neutron-scattering", "magnetic-materials"], "image": "", "briefing": {"background": "자기적 위상 반금속에서 스핀 자유도와 위상학적 전자 구조 간의 상호작용은 새로운 양자 현상을 이해하는 중요한 주제입니다.", "motivation": "NdAlSi 화합물에서 자기 질서와 Weyl 페르미온의 상호작용을 조사하여, 자기 질서가 스핀 엑시톤(spin exciton)과 분산 관계를 어떻게 변화시키는지 확인하고자 합니다.", "result": "비탄성 중성자 산란을 통해 자기 질서가 스핀 엑시톤의 분산에 강한 변조를 가하며, 자기 상전이 이후에도 이들이 존속함을 확인하였습니다.", "implication": "자기적 위상 물질의 물성이 단순한 격자 구조가 아닌 자기적 질서와의 결합에 의해 동적으로 제어될 수 있음을 보여줍니다.", "novelty": "NdAlSi라는 희토류 기반 자기 Weyl 반금속에서 엑시톤의 분산을 중성자 산란으로 직접 증명했다는 점이 해당 분야의 전문가들에게 유의미합니다.", "unresolved": "자기 질서와 Weyl 노드 간의 구체적인 결합 강도 및 에너지 규모의 정밀한 정량화가 필요합니다.", "future_work": "유사한 자기 위상 물질군에서의 스핀 엑시톤과 위상 노드의 상관관계 비교 연구가 이어질 것입니다.", "concepts": [{"term": "스핀 엑시톤", "why_emerged": "자기 정렬된 시스템 내에서 전하와 스핀이 결합된 형태의 들뜸(excitation)을 설명하기 위해 필요합니다.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "자기 위상 반금속, 중성자 산란, 자기 질서."}, {"term": "자기적 Weyl 반금속", "why_emerged": "시간-반전 대칭이 깨지면서 위상적 성질과 자기적 성질이 결합된 시스템을 기술하기 위해 필요합니다.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "베리 곡률, 비정상 홀 효과, NdAlSi."}], "english_summary": ["Reports dispersive spin excitons in the magnetic Weyl semimetal NdAlSi.", "Uses inelastic neutron scattering to demonstrate modulation by magnetic order.", "Shows spin excitons persist across magnetic phase transitions.", "Provides experimental insight into spin-topology coupling in magnetic Weyl materials."]}}, {"title": "Ultrasensitive Strain Modulation of Terahertz Magnons at a Magnetic Phase Transition", "journal": "PRL_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/wk6v-1x5s", "authors": "Lichen Wang, Sajna Hameed, Yiran Liu, et al.", "last_authors": "Matteo Minola, Bernhard Keimer", "summary": "Motivated by the prospect of strain control of terahertz (THz) magnons, we have used resonant x-ray diffraction and Raman scattering to investigate the magnetic ground state and excitations of the layered Mott insulator Ca 2 RuO 4 under uniaxial strain. We discovered a strain-induced phase transition between two antiferromagnetic states that differ in the sign of the interlayer exchange interaction. Although this interaction is weak and partially frustrated, the corresponding magnon energies of the two states differ by more than 10% ( ∼ 0.3 THz ). Our theoretical analysis explains this surprising observation by tracing the origin of both the sign reversal of the interlayer coupling and the magnon energy to the spin-orbital composition of the Ru valence electrons. The extreme strain sensitivity of the THz magnon energy near a magnetic phase transition opens up pathways toward a new generation of “transition-edge” magnonic devices.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Important experimental study on magnetic phase transitions and excitations in a layered Mott insulator.", "tags": ["Mott", "magnon", "x-ray"], "image": "", "briefing": {"background": "Ca2RuO4는 스핀-궤도 결합(SOC)과 전자 상관관계가 강하게 얽힌 대표적인 모트 절연체로, 구조적 왜곡에 따른 자기적 상태의 민감도가 높습니다. THz 영역의 마그논은 차세대 마그노닉 소자의 핵심 요소로 연구되고 있습니다.", "motivation": "일축 압력을 가했을 때 Ca2RuO4의 자기적 바닥 상태와 마그논 여기(excitation)가 어떻게 변하는지 규명하고자 했습니다.", "result": "압력을 통해 층간 교환 상호작용의 부호가 바뀌는 자기적 상전이를 발견했으며, 이 근처에서 마그논 에너지가 10% 이상 변화하는 것을 확인했습니다.", "implication": "자기적 상전이 근처에서 외부 스트레인으로 마그논 에너지를 극도로 민감하게 제어할 수 있음을 입증하여 저전력 마그노닉 소자 설계의 가능성을 열었습니다.", "novelty": "스트레인을 통해 미세한 자기적 교환 상호작용을 튜닝하고, 이를 THz 마그논 에너지의 대폭적인 변화로 연결한 점이 매우 혁신적입니다.", "unresolved": "이 마그논 에너지 변화의 구체적인 스핀-궤도 구성 요소에 대한 미시적 원리가 여전히 복잡합니다.", "future_work": "다른 강상관 자성체에서의 스트레인 제어 가능성 탐색 및 이를 활용한 능동형 THz 마그노닉 소자 시제품 제작.", "concepts": [{"term": "마그논", "why_emerged": "자기 정렬 시스템에서의 집단적 스핀 들뜸을 입자 형태로 기술하기 위해 필요함.", "origin": "Bloch (1930)", "connections": "스핀파, 중성자 산란 연구, 양자 정보 처리."}, {"term": "모트 절연체", "why_emerged": "밴드 이론으로 설명되지 않는 강한 전자 상관관계에 의한 절연체 거동을 이해하기 위해 필요함.", "origin": "Mott (1949)", "connections": "고온 초전도체, Ca2RuO4, Hubbard 모델."}], "english_summary": ["Investigated the layered Mott insulator Ca2RuO4 under uniaxial strain using resonant X-ray diffraction and Raman scattering.", "Identified a strain-induced phase transition involving a sign reversal of interlayer exchange interaction.", "Demonstrated that magnon energies are highly sensitive to strain near this magnetic phase transition.", "Proposes a pathway for strain-controlled THz magnonic devices."]}}, {"title": "A microscopic continuum model for moir\\'e transition metal dichalcogenides", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2611.34937", "authors": "Julian Ingham, Harshitra Mahalingam, Raquel Queiroz", "last_authors": "Harshitra Mahalingam, Raquel Queiroz", "summary": "Twisted transition metal dichalcogenides (tTMDs) have emerged as a fascinating platform for many-body phases --- displaying fractional Chern insulators and superconductivity as a function of doping. Here, we give a microscopic derivation of a continuum model which accurately describes their bandstructure across a range of twist angles with angle-independent parameters. This angle-independent description rests on retaining both the monolayer valence and conduction bands, which introduce tunnelling paths through AB-stacked regions; upon downfolding to the valence band, these paths supply a substantial twist-tunable contribution to the interlayer coupling. We show that the model is a perturbation of a chiral model with a magic angle, explaining the near-ideal quantum geometry of the moir\\'e bands. The model further produces a strongly different orbital magnetic moment to the single-orbital theory --- predicting an anomalous Landau level slope --- and a redistribution of charge between the layers, modifying the moir\\'e ferroelectric potential.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Derives a twist-tunable continuum model for moiré TMDs, addressing superconductivity and Chern bands.", "tags": ["theory", "moiréTMD", "Cherninsulator"], "image": "https://arxiv.org/html/2611.34937v1/fig3_bilayer_RQ_composite.png", "briefing": {"background": "트위스트된 전이금속 디칼코게나이드(tTMD)는 모아레 무늬를 통해 밴드 구조를 설계할 수 있어 분수 첸 절연체 및 초전도 현상을 연구하는 핵심 플랫폼입니다.", "motivation": "기존 모델의 한계를 극복하고, 다양한 트위스트 각도에서 적용 가능한 범용적이고 미시적인 연속체 모델을 유도하고자 했습니다.", "result": "각도와 무관한 매개변수를 갖는 새로운 연속체 모델을 제시했으며, 이 모델은 층간 터널링 경로와 궤도 자기 모멘트를 정밀하게 반영합니다.", "implication": "tTMD의 양자 기하학적 성질과 위상적 상태를 정확히 예측할 수 있게 되어, 향후 실험 데이터와의 비교 분석을 크게 개선할 것입니다.", "novelty": "각도 의존성을 최소화하고 층간 전하 재분배를 포함하여 기존 모델의 정확도를 크게 높였습니다.", "unresolved": "이 모델을 매우 큰 모아레 단위세포 혹은 비정질 왜곡이 있는 실제 실험 샘플에 적용할 때의 정확도는 검증이 필요합니다.", "future_work": "제안된 모델을 활용하여 다양한 TMD 이종접합에서의 위상적 상전이 및 강상관 현상의 수치 시뮬레이션.", "concepts": [{"term": "모아레 격자", "why_emerged": "두 2D 층 사이의 주기성 차이로 발생하는 초격자를 통해 새로운 전자 상태를 형성하기 위해 사용됨.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "뒤틀린 이중층 그래핀, 첸 절연체."}, {"term": "분수 첸 절연체", "why_emerged": "외부 자기장 없이도 위상적 상태와 분수 전하 현상이 나타나는 시스템을 설명하기 위해 필요함.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "분수 양자 홀 효과, Chern 밴드."}], "english_summary": ["Developed a microscopic continuum model for twisted TMDs that works across various twist angles.", "Retained valence and conduction bands to accurately account for interlayer tunneling paths.", "The model predicts strong anomalous Landau level slopes and charge redistribution between layers.", "Provides a theoretical framework for understanding fractional Chern insulators in tTMDs."]}}, {"title": "Anisotropic magnetic-field modulation of hysteretic sheet resistance in few-layer ferroelectric WTe2", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2611.34259", "authors": "Arpan Manna, Soumik Mukhopadhyay", "last_authors": "Arpan Manna, Soumik Mukhopadhyay", "summary": "Ferroelectricity in few-layer WTe2, a polar semimetal, originates from interlayer sliding and can be probed through gate-dependent resistance hysteresis. Yet the role of magnetic fields in this transport signature remains largely unexplored. Here, we examine magnetic-field-induced changes in the hysteresis in exfoliated few-layer WTe2. Applying an out-of-plane magnetic field produces a pronounced hysteresis enhancement, while an in-plane field yields a negligible response. Analysis of the individual hysteresis branches reveals distinct magnetotransport responses of the two ferroelectric states, which increase their resistance separation under magnetic field. The enhancement exhibits a robust power-law field dependence and a temperature evolution closely resembling that of magnetoresistance. Our results reveal a close association between anisotropic magnetotransport and ferroelectric hysteresis, underscoring the interplay between magnetic response and ferroic order in a two-dimensional polar semimetal.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Experimental transport study on WTe2, a key topological semimetal in the user's profile.", "tags": ["experiment", "WTe2", "transport"], "image": "https://arxiv.org/html/2611.34259v1/Fig1.png", "briefing": {"background": "WTe2는 위상적 성질을 갖는 극성 반금속으로, 층간 슬라이딩을 통한 강유전성과 그에 따른 수송 현상이 강상관 및 위상 물질 분야의 핵심 주제입니다.", "motivation": "WTe2의 강유전성 수송 이력 현상(hysteresis)이 외부 자기장에 의해 어떻게 변하는지 조사하고자 했습니다.", "result": "면외 자기장이 강유전성 이력 현상을 뚜렷하게 강화하는 반면, 면내 자기장은 효과가 거의 없음을 확인했습니다.", "implication": "자기장과 강유전성 질서 사이의 이방성 결합을 확인했으며, 이는 2D 극성 반금속에서의 자기-전기적 상호작용 이해에 중요합니다.", "novelty": "WTe2의 자기 저항과 강유전성 이력 현상 사이의 직접적인 상관관계를 실험적으로 입증한 점이 중요합니다.", "unresolved": "자기장에 의해 이력 현상이 강화되는 미시적인 스핀-궤도 결합 기전이 완전히 규명되지 않았습니다.", "future_work": "더 넓은 온도 및 자기장 범위에서의 수송 측정 및 DFT 계산을 통한 자기 구조 분석.", "concepts": [{"term": "극성 반금속", "why_emerged": "반금속의 전자 구조와 inversion 대칭성이 깨진 극성 구조가 공존하는 물질을 정의하기 위해 필요함.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "WTe2, 베리 곡률, 이상 홀 효과."}, {"term": "강유전성 이력 현상", "why_emerged": "외부 전계 등에 의해 유도된 분극 상태가 메모리처럼 유지되는 현상을 설명하기 위해 사용됨.", "origin": "Valasek (1920)", "connections": "FeRAM, 강유전체 메모리, 층간 슬라이딩."}], "english_summary": ["Studied magnetotransport in few-layer WTe2, a polar semimetal.", "Found that out-of-plane magnetic fields significantly enhance ferroelectric resistance hysteresis.", "Observed strong anisotropy where in-plane fields have a negligible effect.", "Suggests a deep interplay between magnetic response and ferroic order in 2D polar semimetals."]}}, {"title": "Electronic topological modes in hexagonal NbSi2 with a double helix", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2611.34356", "authors": "Issam Mahraj, Andrzej Ptok", "last_authors": "Issam Mahraj, Andrzej Ptok", "summary": "Chiral systems can host nontrivial topological states, including characteristic edge modes and Fermi arcs. Here, we investigate the electronic properties of hexagonal NbSi$_2$ with chiral symmetry using first-principles calculations for both bulk and slab geometries. We find that spin--orbit coupling (SOC) is relatively weak. Notably, the topological edge state originates from structural chirality rather than the SOC. From the Berry curvature analysis, we confirm the existence of Weyl points, some of which carry a Chern number of $\\pm 2$. Furthermore, we demonstrate the existence of chiral edge modes with extended Fermi arcs around high-symmetry points. Finally, we investigate the real-space localization using spatially resolved and site-dependent density of states (DOS). We demonstrate that the surface states can be exclusively associated with the chiral Si chains.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Electronic structure study identifying Weyl points and topological states in chiral NbSi2.", "tags": ["theory", "NbSi2", "topologicalsemimetal"], "image": "https://arxiv.org/html/2611.34356v1/crys.png", "briefing": {"background": "카이랄(Chiral) 결정 구조를 가진 물질은 공간 반전 대칭성이 깨져 있어, 위상학적으로 비자명한 전자 상태를 가질 수 있습니다. 이러한 계에서의 토폴로지 특성은 주로 강한 스핀-궤도 결합(SOC)에 기인한다고 여겨져 왔습니다.", "motivation": "육방정계 NbSi2 물질이 가진 구조적 카이랄성이 SOC가 약함에도 불구하고 위상학적 특성을 유도할 수 있는지 확인하고자 함.", "result": "제일원리 계산을 통해 NbSi2에서 구조적 카이랄성이 위상학적 에지 모드를 유도함을 밝힘. 또한 Chern 수 ±2를 가지는 Weyl 점을 발견하였으며, 에지 상태가 카이랄 Si 체인에 국소화되어 있음을 규명함.", "implication": "SOC가 약한 물질에서도 구조적 카이랄성만으로 위상학적 특성이 나타날 수 있음을 보여주며, 이는 향후 새로운 카이랄 토폴로지 물질 설계의 가이드라인이 됨.", "novelty": "기존의 SOC 의존적 위상학 모델에서 벗어나 구조적 카이랄성이 지배적인 역할을 한다는 점을 강조함. 이는 ARPES 측정 등을 통해 에지 상태의 원자적 기원을 추적할 수 있는 가능성을 제시함.", "unresolved": "이론적 계산 결과가 실제 ARPES나 STM 실험으로 관측된 전자 구조와 어느 정도 일치하는지에 대한 실험적 검증이 부족함.", "future_work": "ARPES를 이용한 벌크 및 표면 상태의 직접적인 밴드 구조 측정과 카이랄 체인에서의 국소 상태 밀도(LDOS) 변화에 대한 STS 연구가 기대됨.", "concepts": [{"term": "Weyl points", "why_emerged": "밴드 구조 내에서 에너지와 운동량이 점 형태로 축퇴된 상태를 기술하기 위해 필요함.", "origin": "Hermann Weyl (1929년 입자 물리학에  systems.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Electronic-structure theory of correlated moiré bilayers featuring spin-charge separation and anomalous Hall effect.", "tags": ["theory", "moiréTMD", "anomalousHall"], "image": "https://arxiv.org/static/browse/0.3.4/images/arxiv-logo-fb.png", "briefing": {"background": "자동 브리핑을 생성하지 못했습니다. 초록과 원문 링크를 기준으로 빠르게 확인하세요.", "motivation": "초록 정보만으로는 분야 내부의 구체적 동기를 안정적으로 요약하기 어렵습니다.", "result": "We investigate the topological properties of a strongly correlated moir\\'e transition metal dichalcogenide (TMD) bilayer (such as twisted $\\mathrm{MoTe}_2$ or $\\mathrm{WSe}_2$) hosting a spin-charge separated state coupled to a layer-polarized helical spin texture. Analyzing an effective low-energy Hamiltonian for mobile spinless holons moving through this non-coplanar spinon background, we reveal pronounced asymmetric band warping. This warping closes the global indirect band gap across most of the parameter space, restricting true topological insulators to fine-tuned critical trajectories. However, a finite local direct gap persists, stabilizing broad regions of a topological Chern metal ($C = \\pm 1$). Computing the Chern number and density of states, we demonstrate that this phase naturally yields a sizable, non-quantized anomalous Hall response accompanied by finite longitudinal cond", "implication": "필터가 이 논문을 통과시킨 이유는 관련 키워드, 저자, 또는 Gemini relevance score 때문입니다.", "novelty": "Electronic-structure theory of correlated moiré bilayers featuring spin-charge separation and anomalous Hall effect.", "unresolved": "원문 확인 후 열린 질문을 판단해야 합니다.", "future_work": "후속 실험, 독립 재현, 관련 물질/조건 확장이 가능한지 확인하세요.", "concepts": [], "english_summary": ["The detailed AI briefing was unavailable for this paper.", "Use the abstract, score reason, and original link for a quick first pass."]}}, {"title": "Hidden f-wave TIVC and Quantum Phase Transitions in Metallic States of Twisted Bilayer Graphene", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2611.34225", "authors": "Arindam Pramanik (Tata Institute of Fundamental Research, India, Academic Centre for Materials, et al.", "last_authors": "Rajdeep Sensarma (Tata Institute of Fundamental Research, India)", "summary": "We study the ground state phase diagram of twisted bilayer graphene at magic angle as function of carrier density and the Coulomb interaction. The carrier density is varied between the fillings $\\nu=-2$ and $\\nu=-3$ and the Coulomb interaction is tuned by changing the gate distance. Our results reveal that the well established Kramers intervalley coherent (KIVC) phase near $\\nu=-2$, contains a hidden $f$-wave time-reversal symmetric intervalley coherent (TIVC) order, whose strength gradually increases within the metallic regime of the intervalley coherent (IVC) phase away from $\\nu=-2$. This finding is interesting in the light of a recent experimental work [26], where the signatures of the TIVC phase has been reported in ultra-clean samples. We further show that the system goes through multiple phase transitions as the carrier density is tuned. Near the $\\nu=-2$, the IVC phase is the ground state, which gives way to valley polarized phase through a second-order-like phase transition as the carrier density is lowered. Further tuning of density pushes the system into the quantum anomalous Hall phase through gradual development of the sublattice polarization. These phase transitions are accompanied by major reconstructions of the Fermi contours.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Relevant study on electronic order and phase transitions in magic-angle twisted bilayer graphene.", "tags": ["material", "twistedbilayergraphene", "topological"], "image": "https://arxiv.org/html/2611.34225v1/g2.png", "briefing": {"background": "마법 각도 꼬인 이중층 그래핀(MATBG)은 전자 간 상관관계가 매우 강해 초전도성, 위상학적 질서, 상관된 절연체 등 풍부한 양자 위상을 나타냅니다.", "motivation": "매직 각도 영역에서 캐리어 농도와 Coulomb 상호작용 변화에 따른 다체 상태의 상 도표를 정밀하게 분 tely reproduce first-principles magnetic and electronic properties and enable predictions of millions of inequivalent long-range exchange couplings in large disordered supercells. Applied to Sb-doped MnTe, the approach shows that altermagnetism persists up to about 25\\% Sb, and reveals disorder broadening as a new factor controlling spin selectivity. More broadly, our work opens a route to combining renormalization with machine-learned Hamiltonians for strongly disordered materials.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Investigates altermagnetism persistence under disorder in Sb-doped MnTe, a key area of user interest.", "tags": ["theory", "MnTe", "altermagnetism"], "image": "https://arxiv.org/html/2611.33544v1/figure3_benchmarkJ.png", "briefing": {"background": "알터마그넷(Altermagnet)은 시간-반전 대칭성과 공간-반전 대칭성이 결합된 자성체로, 비전통적인 스핀 분할(Spin-splitting)을 통해 스핀트로닉스 분야에서 큰 주목을 받고 있습니다. 하지만 대부분의 알터마그넷은 절연체 상태여서 전자 소자로의 응용에 한계가 있습니다.", "motivation": "MnTe에 안티몬(Sb)을 도핑하여 금속성을 부여할 때, 구조적/자기적 무질서가 알터마그네틱 특성을 어떻게 변화시키는지 이해하고 예측하기 위해 본 연구를 수행하였습니다.", "result": "머신러닝 기반의 재규격화(Renormalization) 기법을 통해 대규모 무질서 시스템을 효율적으로 모델링했습니다. 그 결과, Sb 도핑이 25% 수준까지 도핑되어도 알터마그네틱 특성이 유지됨을 확인하였고, 무질서로 인한 스핀 선택도(Spin selectivity)의 변화 기제를 규명했습니다.", "implication": "강한 무질서가 포함된 자성체에서도 알터마그네틱 성질이 견고하게 유지될 수 있음을 시사하며, 이는 향후 실용적인 스핀트로닉스 소자 설계에 중요한 지표가 될 것입니다.", "novelty": "머신러닝과 제1원리 계산을 결합하여, 기존의 계산 비용 문제로 다루기 어려웠던 '무질서가 존재하는 강상관 전자계'의 자기적 성질을 효과적으로 예측했다는 점이 핵심입니다.", "unresolved": "Sb 도핑 농도가 25%를 넘어설 때 발생하는 국소적 자기 구조의 변화나 위상적 전이에 대해서는 여전히 추가적인 연구가 필요합니다.", "future_work": "다른 알터마그넷 후보 물질들로의 확장 및 실제 소자 환경에서의 수송 특성(Transport property)에 대한 실험적 검증이 기대됩니다.", "concepts": [{"term": "Altermagnetism", "why_emerged": "강자성체와 반강자성체의 한계를 넘어서는 새로운 자기적 상태를 찾기 위해 제안되었습니다.", "origin": "최근 2020년대 초반 이론적 예측 이후 실험적으로 활발히 검증되고 있음.", "connections": "스핀-궤도 결합(SOC) 없이도 스핀 분할이 일어나는 새로운 자기 위상."}, {"term": "Spin-Fermion Model", "why_emerged": "전자와 국소적 스핀(Localized spin) 사이의 상호작용을 통해 자성체의 전자 구조를 효율적으로 기술하기 위해 고안되었습니다.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "Kondo 격자 모델 및 강상관 전자계의 자기적 물성 연구에 널리 사용됨."}], "english_summary": ["Machine-learning approach developed to model strongly disordered altermagnets.", "Successfully predicts electronic and magnetic properties in Sb-doped MnTe.", "Altermagnetism persists up to 25% Sb doping despite magnetic disorder.", "Introduces disorder broadening as a key factor in controlling spin selectivity.", "Provides a scalable framework for studying disordered correlated materials."]}}, {"title": "Non-Perturbative Resolution of Luttinger's Theorem Violations in Strongly Correlated Systems", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2611.07933", "authors": "Nazzareno Africani, Herbert E{\\ss}l, Alessandro Toschi, Michele Fabrizio", "last_authors": "Alessandro Toschi, Michele Fabrizio", "summary": "Many-body physics faces an apparent paradox concerning violations of Luttinger's theorem in strongly correlated systems. The theorem relates the electron number to the Luttinger count---the monodromy of the logarithm of the imaginary-frequency Green's function $\\bd{G(i\\epsilon)}$---and, at finite magnetic field, connects the Hall conductivity to the magnetic-field derivative of the Luttinger count via the Streda formula. Luttinger's theorem seemingly follows from particle-number conservation alone, without resorting to perturbation theory, and yet it is found to be violated. Here, we provide a non-perturbative solution to this paradox. We show that the Luttinger integral, which accounts for the mismatch between the particle number and the Luttinger count, is a pure zero-frequency boundary term, which the conventional proof implicitly discards. Hence, violations of Luttinger's theorem do not require a breakdown of the skeleton-diagram formalism, whose validity is independent of the convergence of the skeleton-diagram expansion to the exact solution. This advancement in understanding resolves a longstanding point of contention in many-body theory. We also find that the Luttinger integral is a genuine topological invariant, tied to the Luttinger-Ward functional rather than to the Green's function alone; like the monodromy of $\\bd{\\ln G(i\\epsilon)}$, it stems exclusively from the zero-frequency point where the Matsubara trajectory crosses the branch cut of the logarithm. Correspondingly, the magnetic-field derivative of the Luttinger integral makes the Hall number in topological insulators differ from its Green's-function expression by a vertex correction, itself invariant, which can take fractional values.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Fundamental theory on Luttinger's theorem violations, crucial for interpreting ARPES Fermi surface volumes in correlations.", "tags": ["theory", "Luttinger-liquid", "strongly-correlated"], "image": "https://arxiv.org/html/2611.07933v2/two_orbital_IL.png", "briefing": {"background": "러팅거 정리(Luttinger's theorem)는 상호작용하는 다체 전자계에서 페르미 면의 부피가 전자 밀도와 비례한다는 기본 원리입니다. 하지만 특정 강상관 물질에서는 이 정리가 깨지는 현상이 관찰되어 오랜 논쟁이 되어 왔습니다.", "motivation": "러팅거 정리가 깨지는 것처럼 보이는 '역설'을 섭동 이론에 의존하지 않는 비섭동적(Non-perturbative) 방법으로 근본적으로 해결하고자 하였습니다.", "result": "러팅거 정리의 위반은 그린 함수 자체의 붕괴가 아니라, 러팅거 적분이 0 주파수 경계에서 발생하는 수학적 특이점에 기인함을 밝혔습니다. 이는 이론적 모순이 아니라 수학적 경계 조건의 재해석으로 해결됩니다.", "implication": "강상관 시스템이나 위상 절연체에서 관찰되는 페르미 면 부피의 불일치를 물리적 오류가 아닌 정교한 수학적 보정항으로 설명할 수 있게 되었습니다.", "novelty": "기존의 러팅거-워드 범함수(Luttinger-Ward functional) 관점에서 정리가 깨지는 이유를 명확히 함으로써, 다체 물리학의 근본 원리 논란을 정리했습니다.", "unresolved": "이러한 수학적 보정이 실제 ARPES 실험에서 관찰되는 특정 밴드 구조의 왜곡을 정량적으로 완벽히 예측하는지에 대해서는 후속 논의가 필요합니다.", "future_work": "위상 물질에서의 홀 효과(Hall effect) 분수화 현상과 연계된 실험적 관측값이 본 이론과 일치하는지 검증하는 연구가 뒤따라야 할 것입니다.", "concepts": [{"term": "Luttinger's theorem", "why_emerged": "상호작용이 있어도 페르미 액체 상태가 견고함을 설명하기 위해 도입되었습니다.", "origin": "Joaquin Mazdak Luttinger (1960).", "connections": "Fermi liquid theory, Luttinger-Ward functional."}, {"term": "Non-perturbative", "why_emerged": "섭동 이론(Perturbatio rface violates the perturbative Luttinger theorem, and a strong-coupling expansion in t / J A t/J_{A} provides a controlled effective theory of superconductivity from this unconventional metal. Our results provide strong evidence for a strongly coupled superconductor beyond BCS theory, driven by the interplay of the kinetic energy, the phonon-mediated anti-Hund’s coupling, and the strong Hubbard U U . Finally, we discuss possible applications to magic-angle twisted bilayer graphene.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Theoretical study of unconventional pairing with direct application to twisted bilayer graphene.", "tags": ["theory", "superconductivity", "graphene", "stronglycorrelated", "twistedbilayer"], "image": "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAsAAAAOCAYAAAD5YeaVAAAAAXNSR0IArs4c6QAAAAZiS0dEAP8A/wD/oL2nkwAAAAlwSFlzAAALEwAACxMBAJqcGAAAAAd0SU1FB9wKExQZLWTEaOUAAAAddEVYdENvbW1lbnQAQ3JlYXRlZCB3aXRoIFRoZSBHSU1Q72QlbgAAAdpJREFUKM9tkL+L2nAARz9fPZNCKFapUn8kyI0e4iRHSR1Kb8ng0lJw6FYHFwv2LwhOpcWxTjeUunYqOmqd6hEoRDhtDWdA8ApRYsSUCDHNt5ul13vz4w0vWCgUnnEc975arX6ORqN3VqtVZbfbTQC4uEHANM3jSqXymFI6yWazP2KxWAXAL9zCUa1Wy2tXVxheKA9YNoR8Pt+aTqe4FVVVvz05O6MBhqUIBGk8Hn8HAOVy+T+XLJfLS4ZhTiRJgqIoVBRFIoric47jPnmeB1mW/9rr9ZpSSn3Lsmir1fJZlqWlUonKsvwWwD8ymc/nXwVBeLjf7xEKhdBut9Hr9WgmkyGEkJwsy5eHG5vN5g0AKIoCAEgkEkin0wQAfN9/cXPdheu6P33fBwB4ngcAcByHJpPJl+fn54mD3Gg0NrquXxeLRQAAwzAYj8cwTZPwPH9/sVg8PXweDAauqqr2cDjEer1GJBLBZDJBs9mE4zjwfZ85lAGg2+06hmGgXq+j3+/DsixYlgVN03a9Xu8jgCNCyIegIAgx13Vfd7vdu+FweG8YRkjXdWy329+dTgeSJD3ieZ7RNO0VAXAPwDEAO5VKndi2fWrb9jWl9Esul6PZbDY9Go1OZ7PZ9z/lyuD3OozU2wAAAABJRU5ErkJggg==", "briefing": {"background": "강상관 물질에서는 허바드 U(Hubbard U)가 너무 커서 전자쌍 형성이 어렵다고 알려져 있습니다. 그럼에도 초전도체가 나타나는 이유는 여전히 응집물리학의 핵심 과제 중 하나입니다.", "motivation": "허바드 U가 무한대(U=∞)인 극한 상황에서도 안티-훈트 결합(Anti-Hund's coupling, J_A)이 존재할 때 초전도성이 유도될 수 있는지 확인하고자 했습니다.", "result": "DMRG 계산을 통해 J_A가 운동 에너지(t)와 경쟁할 때 강한 페어링이 형성됨을 입증했습니다. 특히, 이 전자쌍은 온-사이트(On-site)가 아닌 본드(Bond) 상에서 형성되는 비통상적인 형태임을 보였습니다.", "implication": "이는 BCS 이론을 넘어선 강상관 초전도 기제를 제시하며, 특히 꼬인 이중층 그래핀(Twisted bilayer graphene)과 같은 시스템의 초전도 현상을 이해하는 강력한 이론적 도구가 됩니다.", "novelty": "허바드 U가 무한대인 물리적으로 극단적인 조건에서 초전도성을 도출했다는 점과, 훈트 결합과는 반대되는 효과를 내는 물리적 기제를 명확히 분리했다는 점이 중요합니다.", "unresolved": "실제 물질의 페르미 면 구조가 꼬인 이중층 그래핀의 복잡한 밴드 구조와 완벽히 일치하는지에 대한 미세한 조정이 남아 있습니다.", "future_work": "본 모델을 바탕으로 한 실제 전이 온도(Tc) 계산 및 다른 2차원 적층 물질들에 대한 확장 연구가 필요합니다.", "concepts": [{"term": "Anti-Hund's coupling", "why_emerged": "일반적인 훈트 결합과 달리 오비탈 간 스핀 싱글렛 상태를 선호하는 효과를 설명하기 위해 필요합니다.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "Hund's rule, Hubbard model, Pairing symmetry."}, {"term": "DMRG", "why_emerged": "1차원 혹은 준-2차원 강상관 격자 모델의 바닥 상태를 매우 정확하게 계산하기 위해 고안되었습니다.", "origin": "Steven White (1992).", "connections": "Tensor network, Entanglement entropy."}], "english_summary": ["Proposes superconductivity driven by anti-Hund's coupling in the infinite U limit.", "Utilizes t-J_A models to demonstrate bond-centered Cooper pairing.", "Supports superconductivity beyond standard BCS theory in strongly correlated systems.", "Provides theoretical insights applicable to magic-angle twisted bilayer graphene.", "DMRG simulations confirm robust pairing states."]}}, {"title": "Signatures of multiorbital density waves in the electronic Raman response of bilayer nickelates", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2611.34471", "authors": "Lauro B. Braz, Ge He, Luis G. G. V. Dias da Silva, Ilya M. Eremin", "last_authors": "Luis G. G. V. Dias da Silva, Ilya M. Eremin", "summary": "Recent Raman scattering experiments on bilayer nickelates have revealed pronounced spectral features in the spin-density-wave state, whose microscopic origin remains controversial, with interpretations ranging from two-magnon excitations to electronic transitions across SDW-induced gaps. Here, we demonstrate that the multiorbital electronic structure of low-pressure bilayer nickelates naturally generates distinct orbital-selective Raman signatures in different symmetry channels. Using a two-orbital bilayer model incorporating the d 3 ​ z 2 − r 2 d_{3z^{2}-r^{2}} and d x 2 − y 2 d_{x^{2}-y^{2}} orbitals in the orthorhombic structure, we analyze the electronic Raman response of the multiorbital spin-spinless double stripe SDW state and show that the B 2 ​ g B_{2g} response exhibits a peak at the energy scale ( M z 2 + M x 2 ) / 2 (M_{z^{2}}+M_{x^{2}})/2 , associated with SDW gap openings in weakly hybridized bands. In contrast, the dominant peak in the B 1 ​ g B_{1g} channel emerges at the multiorbital energy scale ( M z 2 2 + M x 2 2 ) 1 / 2 (M_{z^{2}}^{2}+M_{x^{2}}^{2})^{1/2} , reflecting the strongly hybridized character of the relevant electronic states. These distinct energy scales provide a unified interpretation of several Raman signatures observed in La 3 Ni 2 O 7 and offer a means of disentangling the orbital contributions to the SDW order parameters. Our results highlight that in contrast to the superconducting state, Raman peak positions in the SDW state cannot generally be identified with a single SDW gap and establish symmetry-resolved electronic Raman scattering as a sensitive probe of multiorbital density-wave order.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Directly relevant to unconventional superconductivity and electronic structure in bilayer nickelates.", "tags": ["material", "nickelate", "electronicstructure"], "image": "https://arxiv.org/html/2611.34471v1/nickelate_am2m_ops.png", "briefing": {"background": "이중층 니켈산염(bilayer nickelate, 예: La3Ni2O7)은 고온 초전도체 후보 물질로 주목받고 있으며, 전자 구조 내 다중 궤도(multiorbital) 특성과 스핀 밀도 파동(SDW) 상태가 초전도성과 어떻게 상호작용하는지가 핵심적인 연구 주제입니다.", "motivation": "최근 라만 산란 실험에서 관측된 SDW 상태의 스펙트럼 피크가 단순한 마그논(magnon)인지, 아니면 전자 갭에 의한 전이인지에 대한 논란이 있어 이를 다중 궤도 모델로 이론적으로 규명하고자 했습니다.", "result": "d_z^2와 d_x^2-y^2 궤도를 포함한 이중층 모델을 통해, B2g와 B1g 대칭성 채널에서 관측되는 피크가 각기 다른 궤도 혼성(hybridization) 에너지 스케일을 반영함을 확인했습니다.", "implication": "SDW 상태의 라만 피크 위치를 단순히 하나의 갭 값으로 해석하는 기존 관행을 탈피해야 하며, 라만 산란이 다중 궤도 밀도 파동을 분해하는 강력한 도구임을 입증했습니다.", "novelty": "SDW 상태의 라만 응답을 궤도 의존적인 관점에서 해석하여 고압 하 니켈산염의 전자 구조와 질서 변수를 이해하는 새로운 기준을 제시했습니다.", "unresolved": "실제 실험 데이터와 이론 모델 간의 정밀한 정량적 일치 수준, 그리고 초전도 상태와의 직접적인 경쟁 관계에 대한 상세한 미시적 메커니즘은 여전히 과제로 남아 있습니다.", "future_work": "다른 니켈산염 물질로의 모델 확장 및 초전도 전이 온도 부근에서의 라만 스펙트럼 변화에 대한 추가적인 계산 연구가 예상됩니다.", "concepts": [{"term": "B1g/B2g symmetry channels", "why_emerged": "라만 산란 실험에서 산란되는 빛의 편광 상태를 제어하여 특정 격자 대칭성을 가진 전자 여기를 선택적으로 측정하기 위해 필요합니다.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "큐프레이트 등 강상관 전자계의 전자 구조 연구에 널리 활용됩니다."}, {"term": "Multiorbital SDW", "why_emerged": "여러 개의 d-궤도가 페르미 준위에 기여하는 물질에서, 단일 궤도 모델로는 설명되지 않는 복잡한 자기 질서 상태를 설명하기 위해 도입되었습니다.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "철 기반 초전도체(Fe-based superconductors) 연구에서 확립된 개념입니다."}], "english_summary": ["Analyzes Raman response in bilayer nickelates using a multiorbital two-orbital model.", "Identifies B1g and B2g peaks as distinct orbital-selective SDW energy scales.", "Challenges the simple one-gap interpretation of SDW Raman peaks.", "Provides a framework to disentangle orbital contributions to density wave orders."]}}, {"title": "Spectroscopic Signatures of Polaronic Density Wave Fluctuations in Superconducting Bismuthates", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2611.33422", "authors": "Wojciech R. Pude{\\l}ko (PSI Center for Photon Science, Paul Scherrer Institute, Villigen PSI, et al.", "last_authors": "Manufacturing, Nicholas C. Plumb (PSI Center for Photon Science", "summary": "The bismuthate high-temperature superconductors have been identified as potential bipolaron systems, where hole pairs are bound to local breathing distortions of the BiO 6 \\text{BiO}{\\vphantom{\\text{X}}}_{\\smash[t]{\\text{6}}} octahedra in their metallic phase. However, obtaining definitive evidence for these quasiparticles and their excitations remains challenging. Here, we report on periodic modulations of the spectral intensities and scattering rates of quasiparticles on the Fermi surfaces of doped bismuthates Ba 1 – x ​ K x ​ BiO 3 \\text{Ba}{\\vphantom{\\text{X}}}_{\\smash[t]{\\text{1\\hskip 0.90417pt--\\hskip 0.90417ptx\\/}}}\\text{K}{\\vphantom{\\text{X}}}_{\\smash[t]{\\text{x\\/}}}\\text{BiO}{\\vphantom{\\text{X}}}_{\\smash[t]{\\text{3}}} and BaPb 1 – y ​ Bi y ​ O 3 \\text{BaPb}{\\vphantom{\\text{X}}}_{\\smash[t]{\\text{1\\hskip 0.90417pt--\\hskip 0.90417pty\\/}}}\\text{Bi}{\\vphantom{\\text{X}}}_{\\smash[t]{\\text{y\\/}}}\\text{O}{\\vphantom{\\text{X}}}_{\\smash[t]{\\text{3}}} , which are reminiscent of “hot spot” patterns that have been observed in cuprate superconductors. We show that these features can be well described by a model where electrons couple to fluctuating density wave modulations with short-range coherence along a ( π , π , π ) (\\pi,\\pi,\\pi) -oriented wavevector. The results are consistent with the existence of a two-component fluid where unpaired electrons interact with a fluctuating density wave created by residual bipolarons and their breathing distortions of the BiO 6 \\text{BiO}{\\vphantom{\\text{X}}}_{\\smash[t]{\\text{6}}} octahedra.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Spectroscopic study of polaronic density wave fluctuations in superconducting bismuthates, relevant to high-Tc physics.", "tags": ["experiment", "spectroscopy", "superconductivity", "high-Tc", "Fermisurface", "densitywave"], "image": "https://arxiv.org/html/2611.33422v1/figures/fig-phase-diagram-2.png", "briefing": {"background": "비스무트 계열(bismuthates) 고온 초전도체는 전통적인 BCS 이론을 넘어, 격자 변형(breathing distortion)과 결합된 바이폴라론(bipolaron) 성질이 초전도 메커니즘과 연관되어 있을 것으로 추측되는 물질군입니다.", "motivation": "초전도체 내부에서 전자가 격자 왜곡과 결합해 형성하는 국소적 파동 패턴인 '극성 밀도 파동(polaronic density wave)'의 직접적인 분광학적 증거를 찾고자 했습니다.", "result": "BaKBiO와 BaPbBiO 페르미 표면에서 '핫 스팟(hot spot)' 패턴과 유사한 주기적 스펙트럼 강도 변조를 관측하였으며, 이는 (pi, pi, pi) 파벡터를 가진 밀도 파동과 전자의 결합으로 설명됩니다.", "implication": "비스무트 산화물에서 전자가 비간섭성 바이폴라론이 만드는 밀도 파동과 상호작용하는 '2성분 유체(two-component fluid)' 모델이 타당성을 얻었습니다.", "novelty": "ARPES/분광학적 관점에서 비스무트 산화물의 초전도성이 큐프레이트와 유사한 핫 스팟 패턴과 관련되어 있음을 보임으로써, 고온 초전도 기원의 보편성을 시사합니다.", "unresolved": "이러한 밀도 파동의 요동이 실제로 초전도 전이의 '풀(glue)' 역할을 하는지, 아니면 초전도와 공존하는 경쟁적 질서인지는 명확하지 않습니다.", "future_work": "다양한 도핑 농도에서의 온도 의존적 분광 측정 및 이론적 임계 온도 계산이 필요합니다.", "concepts": [{"term": "Bipolaron", "why_emerged": "강한 전자-격자 결합으로 인해 두 전자가 격자 변형을 매개로 뭉쳐 보손처럼 행동하는 상태를 설명하기 위해 제안되었습니다.", "origin": "Landau(1933)의 폴라론 개념에서 파생되어 이후 고체물리에서 폭넓게 정립됨", "connections": "고온 초전도체, 페로브스카이트 산화물."}, {"term": "Hot spots", "why_emerged": "페르미 표면상에서 특정 밴드끼리 충돌하거나 질서 파동과 상호작용하여 전자 산란이 급격히 증가하는 지점을 설명하기 위해 사용됩니다.", "origin": "큐프레이트 초전도체 연구에서 활발히 논의됨", "connections": "반강자성 요동(AFM fluctuations), CDW 질서."}], "english_summary": ["Observes spectral intensity modulations in superconducting bismuthates.", "Identifies a pattern reminiscent of 'hot spots' in cuprates.", "Models the system as electrons interacting with fluctuating polaronic density waves.", "Suggests a two-component fluid model for bismuthate superconductors."]}}, {"title": "Spin-vibronic order in Ba2MgReO6", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2611.33814", "authors": "Zhishuo Huang, Takumi Gengo, Teruki Matsuzaki, Liviu F. Chibotaru, Naoya Iwahara", "last_authors": "Liviu F. Chibotaru, Naoya Iwahara", "summary": "Strong spin-orbit coupling in $5d$ ions produces multipolar orders that conventional probes barely detect. In cubic $5d^1$ double perovskites, the spin-orbit quartet couples to Jahn-Teller vibrations, and resonant inelastic x-ray scattering (RIXS) has established the resulting spin-orbit-lattice entangled (vibronic) states [Phys. Rev. Lett. \\textbf{133}, 036501 (2024)]. We proposed that these vibronic states order cooperatively and thereby explain the hidden quadrupole and canted magnetic phases of Ba$_2$MgReO$_6$ [Phys. Rev. B \\textbf{107}, L220404 (2023)], but that proposal rested on a simplified model. Here, we show that a spin-vibronic Hamiltonian derived from first principles, with a single scale factor for the elastic coupling, reproduces the ordered phases of Ba$_2$MgReO$_6$ with the same vibronic states that describe its RIXS spectra. With this factor bringing the quadrupolar transition to 34.7 K, near the measured 33 K, the theory predicts the magnetic transition at 19.3 K, against the measured 18 K, and reproduces the antiferro distortion and the ferro elongation between the transitions. These results support spin-vibronic order in Ba$_2$MgReO$_6$ and point to it as the origin of the hidden multipolar phases of $5d^1$ double perovskites.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Direct relevance to RIXS interests and electronic structure of correlated 5d systems.", "tags": ["RIXS", "transitionmetaloxide", "electronicstructure"], "image": "https://arxiv.org/html/2611.33814v1/fig_order.png", "briefing": {"background": "5d 전이금속 산화물은 강한 스핀-궤도 결합(SOC)과 격자 자유도가 얽힌(entangled) 상태를 형성하며, 이로 인해 일반적인 측정법으로는 감지하기 어려운 '숨겨진 다극자(multipolar) 질서'가 존재합니다.", "motivation": "Ba2MgReO6 물질의 저온에서 나타나는 자기적/구조적 전이의 기원을 기존의 단순한 모델이 아닌, RIXS로 검증된 스핀-진동(spin-vibronic) 상태에 기반하여 이론적으로 재해석하고자 했습니다.", "result": "스핀-진동 해밀토니안을 제일원리 계산으로 도출하여, 실험적으로 알려진 33K의 사극자 전이와 18K의 자기 전이를 매우 정확하게 재현했습니다.", "implication": "5d 궤도의 다극자 질서가 단순히 스핀이나 격자만으로 설명되지 않고, 스핀과 진동(포논)이 얽힌 새로운 상태로 이해되어야 함을 증명했습니다.", "novelty": "RIXS에서 관측된 vibronic 상태가 거시적인 상전이의 핵심 물리적 토대임을 명확히 연결하여, 5d 강상관 물질의 이론적 이해도를 높였습니다.", "unresolved": "이 모델에 사용된 '단일 스케일 인자(single scale factor)'의 미시적 정당성을 더 높은 수준의 다체 계산으로 확인하는 과정이 필요합니다.", "future_work": "다른 5d1 이중 페로브스카이트 물질로 이 스핀-진동 모델을 적용하여 일반화 가능성을 검증할 예정입니다.", "concepts": [{"term": "Spin-vibronic order", "why_emerged": "강한 SOC와 Jahn-Teller 격자 변형이 함께 작용할 때, 스핀과 포논의 분리가 불가능한 상태를 기술하기 위해 필요합니다.", "origin": "최근 5d 전이금속 산화물 RIXS 연구들에서 본격적으로 정의됨", "connections": "Jahn-Teller 효과, 다극자 질서(multipolar order)."}, {"term": "Double perovskites (5d1)", "why_emerged": "5d 전자 하나가 들어있는 구조에서 스핀-궤도 결합의 효과를 극대화하여 연구하기 위한 이상적인 플랫폼입니다.", "origin": "전통적인 결정 구조 연구에서 기원", "connections": "모트 절연체(Mott insulators), 위상 절연체 후보 물질."}], "english_summary": ["Develops a first-principles spin-vibronic Hamiltonian for Ba2MgReO6.", "Explains hidden multipolar phases as cooperative ordering of vibronic states.", "Reproduces experimentally observed transition temperatures for quadrupolar and magnetic phases.", "Validates the vibronic origin of 5d1 double perovskite electronic structure."]}}, {"title": "Superconductivity from a Cooper surface instability in a nodal Bose metal", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2611.33803", "authors": "Jian-Jian Miao, Cui Ding", "last_authors": "Jian-Jian Miao, Cui Ding", "summary": "In underdoped cuprates, the superconducting gap is largest where low-energy electron spectral weight is already depleted above the transition. How can a weak attraction drive superconductivity when the one-electron density of states vanishes? In a momentum-space \\(t\\)--\\(J\\) model, the exactly solvable normal state is a nodal Bose metal with four one-electron nodes. Along two contours called Cooper surfaces, adding or removing a spin-singlet pair of electrons with opposite momenta costs no energy. The resulting logarithmic divergence of the pair susceptibility allows an arbitrarily weak pair-transfer attraction to stabilize a correlated nodal \\(d\\)-wave superconductor. Spin-resolved coincidence photoemission could test this pairing mechanism by resolving two zero-energy pair-removal ridges above the transition and a third along the underlying Luttinger surface below it.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Proposes coincidence photoemission as a test for pairing mechanisms in underdoped nodal cuprates.", "tags": ["theory", "cuprates", "photoemission"], "image": "https://arxiv.org/html/2611.33803v1/main-fig02.png", "briefing": {"background": "언더도핑된 큐프레이트 초전도체에서는 초전도 갭이 가장 큰 영역에서 낮은
