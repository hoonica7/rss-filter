<title>Daily Paper Slideshow</title>
<style>
  :root {
    color-scheme: light;
    --bg: #f6f7f4;
    --paper: #ffffff;
    --ink: #111827;
    --muted: #64748b;
    --line: #d8ddd2;
    --accent: #176b87;
    --accent-2: #9a3412;
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; overflow: auto; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: var(--bg); color: var(--ink); }
  .shell { max-width: 1500px; min-height: 100vh; margin: 0 auto; padding: 14px 18px; display: flex; flex-direction: column; }
  .topbar { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 16px; }
  .top-actions { display: flex; align-items: center; gap: 10px; }
  .topbar a, button { border: 1px solid var(--line); border-radius: 8px; background: var(--paper); color: var(--ink); padding: 10px 14px; font-weight: 700; text-decoration: none; cursor: pointer; }
  button.primary { background: var(--accent); border-color: var(--accent); color: white; }
  button:disabled { opacity: 0.45; cursor: not-allowed; }
  .counter { color: var(--muted); font-weight: 700; }
  .slide { min-height: calc(100vh - 82px); background: var(--paper); border: 1px solid var(--line); border-radius: 10px; padding: 18px; box-shadow: 0 18px 42px rgba(15, 23, 42, 0.10); display: grid; grid-template-columns: minmax(310px, 0.86fr) minmax(0, 1.55fr); gap: 18px; overflow: visible; }
  .paper-head { min-width: 0; min-height: 0; overflow: visible; display: flex; flex-direction: column; gap: 12px; }
  .figure { margin: 0; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: #f8fafc; }
  .figure img { display: block; width: 100%; max-height: 41vh; object-fit: contain; background: white; }
  .figure figcaption { padding: 7px 10px; color: var(--muted); font-size: 12px; line-height: 1.3; }
  .head-text { display: flex; flex-direction: column; gap: 9px; min-width: 0; }
  .badges { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .badge { border-radius: 999px; padding: 5px 9px; background: #eef2ff; color: #3730a3; font-size: 12px; font-weight: 800; }
  .score { background: #fee2e2; color: #991b1b; }
  h1 { margin: 0; font-size: 25px; line-height: 1.15; letter-spacing: 0; overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
  h1 a { color: inherit; text-decoration-color: rgba(23, 107, 135, 0.35); text-decoration-thickness: 2px; text-underline-offset: 4px; }
  h1 a:hover { color: var(--accent); text-decoration-color: var(--accent); }
  .meta, .authors, .why, .abstract { font-size: 13px; line-height: 1.45; }
  .meta, .authors { color: var(--muted); }
  .why strong, .abstract strong, .authors strong { color: var(--ink); }
  .authors { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .why { border-left: 4px solid var(--accent-2); padding-left: 10px; color: #374151; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .abstract { border-top: 1px solid var(--line); padding-top: 14px; color: #374151; }
  .original-abstract { border-top: 1px solid var(--line); padding-top: 10px; color: #374151; font-size: 11.5px; line-height: 1.35; overflow-wrap: anywhere; }
  .original-abstract strong { display: block; margin-bottom: 4px; color: var(--ink); }
  .tags { display: flex; flex-wrap: wrap; gap: 8px; }
  .tag { border-radius: 999px; padding: 4px 8px; background: #f1f5f9; color: #475569; font-size: 12px; font-weight: 700; }
  .head-text > .link { display: none; }
  .briefing { min-width: 0; min-height: 0; overflow: visible; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); grid-auto-rows: minmax(0, auto); align-content: start; gap: 11px 18px; border-top: 0; padding-top: 0; }
  .brief-section { min-width: 0; }
  .brief-section.wide { grid-column: 1 / -1; }
  .brief-section h2 { margin: 0 0 4px; font-size: 14px; line-height: 1.22; color: #0f766e; letter-spacing: 0; }
  .brief-section p, .brief-section li { margin: 0; font-size: 12.5px; line-height: 1.42; color: #1f2937; overflow-wrap: anywhere; }
  .brief-section ul { margin: 0; padding-left: 20px; }
  .concepts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 9px 14px; }
  .concept { border-top: 1px solid var(--line); padding-top: 7px; }
  .concept h3 { margin: 0 0 4px; font-size: 13px; color: #7c2d12; letter-spacing: 0; }
  .concept p { margin: 2px 0 0; font-size: 11.5px; line-height: 1.35; color: #374151; overflow-wrap: anywhere; }
  .concept b { color: #111827; }
  .link { color: var(--accent); font-weight: 800; text-decoration: none; }
  .empty { padding: 48px; background: var(--paper); border: 1px solid var(--line); border-radius: 12px; color: var(--muted); }
  @media (max-width: 860px) {
    .shell { padding: 14px; }
    .topbar, .top-actions { align-items: stretch; flex-direction: column; }
    .slide, .briefing, .concepts { grid-template-columns: 1fr; }
    .slide { min-height: auto; overflow: visible; display: grid; }
    h1 { font-size: 28px; }
  }
</style>

const slides = [{"title": "Correlation-driven origin of shallow electron pocket in Co1/3TaS2 revealed by ARPES and cluster perturbation theory", "journal": "PRB_Recent", "source": "keyword", "link": "http://link.aps.org/doi/10.1103/6y9w-lx94", "authors": "Wojciech Sas, Yuki Utsumi Boucher, Seyed Ashkan Moghadam Ziabari, et al.", "last_authors": "Ivo Batistić, Petar Popčević", "summary": "We investigate the electronic structure and Fermi surface of ${\\mathrm{Co}}_{1/3}{\\mathrm{TaS}}_{2}$ using angle-resolved photoemission spectroscopy (ARPES) combined with theoretical modeling beyond standard density functional theory ($\\mathrm{DFT}+\\mathrm{U}$). A shallow electron pocket, the so-cal…", "tier": "A_MUST_READ", "score": "10", "reason": "title strong match: ARPES", "tags": ["ARPES", "angle-resolvedphotoemission", "photoemission", "Fermisurface"], "image": "", "briefing": {"background": "전이금속 디칼코게나이드(TMD) 화합물에서 인터칼레이션은 결정 구조와 전자 구조를 정교하게 제어할 수 있는 방법입니다. 특히 Co1/3TaS2와 같은 물질은 전이 금속이 삽입되면서 발생하는 자기적 질서와 전하 밀도 파(CDW) 사이의 복잡한 상호작용으로 인해 강상관 전자계 연구의 주요 대상이 됩니다.", "motivation": "표준적인 DFT 계산만으로는 Co1/3TaS2의 페르미 면에서 관측되는 얕은 전자 포켓(shallow electron pocket)의 기원을 충분히 설명하지 못하는 문제가 있어, 전자 상관 효과를 고려한 모델링이 필요했습니다.", "result": "ARPES 측정 결과와 클러스터 섭동 이론(Cluster Perturbation Theory)을 결합하여, 이 전자 포켓이 단순한 밴드 구조의 결과가 아니라 강한 전자 상관 관계(correlation-driven)에 의해 유도된 상태임을 밝혔습니다.", "implication": "강상관 계의 TMD 물질에서 DFT+U를 넘어선 다체 물리적 접근이 전자 구조 해석에 필수적임을 시사하며, 물질의 기저 상태와 물리적 특성을 결정짓는 핵심 기작을 제안합니다.", "novelty": "실험적인 ARPES 데이터와 이론적인 다체 계산 기법을 상호 보완적으로 활용하여, 물질 내부의 상관 관계가 전자 구조에 미치는 영향을 직접적으로 증명했다는 점이 귀하의 ARPES 분석 연구에 큰 통찰을 줍니다.", "unresolved": "전자 포켓의 형성과 이 물질의 초전도성 또는 CDW 상 사이의 정량적인 인과 관계는 아직 완벽하게 규명되지 않았습니다.", "future_work": "도핑 농도를 정밀하게 제어하거나, 온도 변화에 따른 전자 포켓의 진화 과정을 추적하는 후속 분해능 향상 실험이 예상됩니다.", "concepts": [{"term": "Cluster Perturbation Theory", "why_emerged": "강상관 전자계에서 격자 효과와 국소적 상관 관계를 효율적으로 처리하기 위해 필요함.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "DMFT 및 Hubbard 모델과 연결된 격자 모델 계산법."}, {"term": "Shallow electron pocket", "why_emerged": "페르미 면 근처의 밀도 상태를 결정하며 수송 특성에 직접적인 영향을 주기 때문.", "origin": "일반적인 고체 물리학 밴드 이론의 결과물.", "connections": "반금속성(Semimetallic) 성질 및 양자 진동 연구."}], "english_summary": ["The electronic structure of Co1/3TaS2 is studied via ARPES and cluster perturbation theory.", "Standard DFT fails to account for the observed shallow electron pocket in the Fermi surface.", "The study demonstrates that electronic correlations are the driving force behind this band feature.", "Results highlight the necessity of many-body theoretical approaches for transition metal intercalated TMDs."]}}, {"title": "Direct observation of flat bands in near-magic-angle twisted bilayer CVD graphene", "journal": "arXiv_CondMat", "source": "author whitelist", "link": "https://arxiv.org/abs/2609.02403", "authors": "Gianluigi Baiardi, Alex Boschi, Giulia Piccinini, et al.", "last_authors": "Sergio Pezzini, Camilla Coletti", "summary": "Advances in chemical vapor deposition (CVD) growth have driven graphene crystal quality to unprecedented levels, yet it is still unknown whether this route can realize the fragile flat-band and correlated states of the magic-angle (MA) twisted bilayer graphene (TBG). Here, we report on the experimental observation by room-temperature nano-angle-resolved photoemission spectroscopy (nano-ARPES) of flat bands in a TBG sample close to the MA, assembled via a grow-and-stack protocol based on low-pressure CVD of graphene on copper. Our study indicates electronic bands fully comparable to those measured in exfoliation-based samples and determines the size of the largest near-MA domain to be compatible with electronic transport experiments, motivating further experiments on flat band physics in CVD-graphene.", "tier": "A_MUST_READ", "score": "10", "reason": "author whitelist: Aaron Bostwick", "tags": ["ARPES", "angle-resolvedphotoemission", "photoemission", "graphene", "twistedbilayer", "correlated", "twisted", "flatband"], "image": "https://arxiv.org/static/browse/0.3.4/images/arxiv-logo-fb.png", "briefing": {"background": "마법의 각도(Magic-angle) 트위스티드 이중층 그래핀(TBG)은 평탄 밴드(flat band)가 형성되어 강상관 물성을 연구하는 핵심 플랫폼입니다. 기존에는 박리법(exfoliation)으로만 제작했으나, 대면적 소자 응용을 위해 CVD 방식의 신뢰성 검증이 요구되어 왔습니다.", "motivation": "CVD로 성장시킨 그래핀을 쌓아 만든 TBG에서도 박리 샘플과 유사한 물리적 특성, 특히 flat band가 재현되는지 확인하는 것이 목표입니다.", "result": "나노-ARPES를 활용하여 CVD 기반의 근사 마법 각도 TBG에서도 박리 샘플과 동등한 수준의 평탄 밴드 구조를 직접 관측했습니다.", "implication": "CVD 공정을 통해 고품질의 강상관 그래핀 소자를 대량 생산하거나 대면적 소자화할 수 있는 가능성을 열어주었습니다.", "novelty": "성장-적층(grow-and-stack) 기법의 CVD 샘플에서 나노-ARPES를 통해 flat band의 전자 구조를 직접 검증한 첫 사례 중 하나로, 귀하의 모아레 시스템 연구에 중요한 실험적 근거를 제공합니다.", "unresolved": "CVD 샘플과 박리 샘플 사이의 미세한 결함 농도 차이가 저온에서의 초전도성이나 절연체 상태에 미치는 영향은 아직 연구가 필요합니다.", "future_work": "저온 환경에서의 나노-ARPES 측정을 통한 초전도 및 관련 질서 변수 확인.", "concepts": [{"term": "Flat band", "why_emerged": "운동 에너지가 억제되어 전자 간 상호작용이 지배적인 상태를 구현하기 위해.", "origin": "Bistritzer and MacDonald (2011) 이론적 예측.", "connections": "강상관 초전도체, Correlated Insulator 상태."}, {"term": "Nano-ARPES", "why_emerged": "트위스티드 시스템의 국소적 모아레 영역의 전자 구조를 분해하기 위해.", "origin": "싱크로트론 기반의 공간 분해능 향상 기술.", "connections": "Micro-ARPES 및 공간 분해 광방출 분광학."}], "english_summary": ["CVD-grown magic-angle twisted bilayer graphene is investigated using nano-ARPES.", "The study reports the observation of flat bands comparable to those in exfoliated samples.", "CVD samples exhibit domains large enough for electronic transport applications.", "The work validates the grow-and-stack protocol for future correlated graphene studies."]}}, {"title": "Collective Magnetic Excitations in a Photoexcited Electron-Doped Cuprate Superconductor", "journal": "PRL_Recent", "source": "author whitelist", "link": "http://link.aps.org/doi/10.1103/2h9x-8tjk", "authors": "Daniel Jost, Jiarui Li, Jordyn Hales, et al.", "last_authors": "Yao Wang, Wei-Sheng Lee", "summary": "The first time-resolved observation of collective magnetic excitations in a photoexcited cuprate across energy, momentum, and time proves that light-induced paramagnon dynamics cannot be explained by simple thermalization.", "tier": "A_MUST_READ", "score": "9", "reason": "author whitelist: Zhi-Xun Shen", "tags": ["cuprate", "superconduct", "magnon"], "image": "", "briefing": {"background": "구리산화물 초전도체(cuprates)는 레이저 여기 후 일시적으로 발생하는 자기적 들뜸(magnon)의 거동을 통해 초전도 상태와 자기 질서의 기저 상호작용을 파악하려는 시도가 활발합니다.", "motivation": "전자 도핑된 구리산화물에서 광 여기 시 발생하는 파라매그논(paramagnon) 동역학이 단순한 열적 효과인지, 아니면 비평형 상태의 고유한 자기 들뜸인지를 구분하고자 했습니다.", "result": "시간 분해 관측을 통해 광 여기된 파라매그논 동역학은 단순한 열적 평형화로 설명될 수 없으며, 독자적인 자기 들뜸 기작이 존재함을 입증했습니다.", "implication": "광 유도 초전도성이나 비평형 상태에서의 강상관 물질 제어에 있어 자기적 들뜸의 역할을 새롭게 정립해야 할 필요성을 제시합니다.", "novelty": "에너지, 운동량, 시간 축을 모두 포함하는 관측을 통해 구리산화물의 자기 들뜸을 분석한 점은 RIXS나 초고속 분광학을 다루는 귀하의 연구 맥락에서 매우 중요한 방법론적 성과입니다.", "unresolved": "이러한 비평형 파라매그논의 수명이 어떻게 초전도 질서 변수와 연결되는지는 여전히 과제입니다.", "future_work": "더 다양한 도핑 수준과 온도에서의 비교 연구를 통해 자기 들뜸의 전반적인 동역학 지도 작성.", "concepts": [{"term": "Paramagnon", "why_emerged": "반강자성 질서가 붕괴된 영역에서도 여전히 존재하는 자기적 요동을 기술하기 위해.", "origin": "일반적으로 비탄성 중성자 산란(INS) 등을 통해 확립됨.", "connections": "반강자성 스핀파(Magnon), 스핀 밀도 파(SDW)."}, {"term": "Time-resolved spectroscopy", "why_emerged": "물질 내의 들뜸이 평형 상태로 돌아가는 속도와 경로를 추적하기 위해.", "origin": "초고속 펨토초 레이저 기술의 발전과 결합.", "connections": "Pump-probe 분광학, Floquet 엔지니어링."}], "english_summary": ["Time-resolved study of magnetic excitations in photoexcited electron-doped cuprates.", "Collective magnetic excitations (paramagnons) are tracked across energy, momentum, and time.", "Findings rule out thermalization as the sole origin of observed magnon dynamics.", "The results provide new insights into the non-equilibrium physics of cuprate superconductors."]}}, {"title": "Correlated Insulator at the Surface of the Polar Metal Ca3Ru2O7", "journal": "PRL_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/x9gh-xxwb", "authors": "Daniel Halliday, Izidor Benedičič, Andela Zivanovic, et al.", "last_authors": "Phil D. C. King, Peter Wahl", "summary": "We inve , Chang-Beom Eom", "summary": "The discovery of the intrinsic anomalous Hall effect (AHE) in noncollinear antiferromagnets has opened a plethora of promising opportunities in antiferromagnetic devices. The key challenges limiting their full potential are (i) high-quality epitaxial thin-film growth and (ii) the understanding of Berry curvature and antiferromagnetic domain physics. Here, we focus on a noncollinear antiperovskite antiferromagnet Mn 3 NiN as a model system, successfully grown as a single-crystal epitaxial thin film. Combining multiple experiments supported by theoretical calculations, we probe the Berry curvature associated with antiferromagnetic Γ 4g domains in Mn 3 NiN and its strong connection to an AHE. We directly image the antiferromagnetic domains driving the intrinsic Berry curvature with high-resolution Sagnac MOKE (magneto-optical Kerr-effect) microscopy, controlling spatial distribution and dynamics by varying temperature and applied magnetic fields. Our findings provide critical advancement of the fundamental understanding and wide tunability of Berry curvature in noncollinear antiferromagnets important for realization in potential spintronic applications.", "tier": "B_IMPORTANT_CONDMAT", "score": "9", "reason": "Direct experimental study of Berry curvature and anomalous Hall effect in an antiferromagnet.; demoted from A: broad CM, not direct user/project hit", "tags": ["Berrycurvature", "anomalousHalleffect", "antiferromagnetism", "thinfilms", "transport", "magneto-optics"], "image": "", "briefing": {"background": "비공선형 반강자성체(noncollinear antiferromagnet)는 스핀의 배열 구조가 위상학적 성질(Berry curvature)을 유도하여, 자성이 없음에도 비정상 홀 효과(AHE)를 나타낼 수 있습니다.", "motivation": "Mn3NiN 박막에서 발생하는 비정상 홀 효과와 Berry curvature 사이의 관계를 시각적으로 확인하고 도메인 물리와의 상관관계를 규명하고자 했습니다.", "result": "Sagnac MOKE 현미경을 이용해 Mn3NiN의 반강자성 도메인 구조를 직접 이미징하고, 이것이 Berry curvature 유도 수송 현상과 직접 연결됨을 보였습니다.", "implication": "반강자성체를 이용한 스핀트로닉스 소자 설계에 있어 도메인 제어 및 Berry curvature 조절의 중요성을 입증했습니다.", "novelty": "일반적으로 측정하기 어려운 반강자성 도메인을 광학적 방법으로 직접 이미징하고 수송 현상과 연결했다는 점이 핵심입니다.", "unresolved": "다양한 온도 및 자기장 조건에서의 도메인 벽(domain wall) 거동이 구체적으로 어떤 에너지 장벽에 의해 제한되는지는 미지수입니다.", "future_work": "도메인 스위칭 속도 측정 및 실제 소자 응용을 위한 전기적 제어 연구.", "concepts": [{"term": "Noncollinear antiferromagnet", "why_emerged": "강자성체가 아니면서도 Berry curvature를 생성해 거대 홀 효과를 얻을 수 있는 물질군을 찾기 위해.", "origin": "Nakatsuji et al. (2015), Nature", "connections": "Mn3Sn, Berry curvature, Anomalous Hall effect"}, {"term": "Berry curvature", "why_emerged": "블로흐 파동 함수의 위상적 기하학적 성질이 수송 현상에 미치는 영향을 기술하기 위해.", "origin": "Berry (1984), Proc. R. Soc. Lond. A", "connections": "Anomalous Hall effect, Topological phase"}], "english_summary": ["Direct imaging of Berry curvature-induced transport in Mn3NiN thin films.", "Utilizes Sagnac MOKE microscopy to correlate antiferromagnetic domains with AHE.", "Advances the understanding of domain physics in noncollinear antiferromagnets."]}}, {"title": "AlterSeeK-Path: Systematic construction of generalized band-structure paths for displaying altermagnetic spin splitting", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2609.02770", "authors": "Yujia Teng, Mesfin Eshete, Andrea Urru, et al.", "last_authors": "Sebastian E. Reyes-Lillo, Karin M. Rabe", "summary": "Altermagnetic materials exhibit spin splitting in their electronic band structures while maintaining zero net magnetization. However, conventional high-symmetry k-paths generally hide this splitting because they follow symmetry lines that in most cases enforce spin degeneracy. We present AlterSeeK-Path, an open-source Python tool that systematically constructs generalized band-structure paths for collinear altermagnets. The method selects the centroid of the conventional irreducible wedge used in routine band-structure calculations as the representative general k-point, maps it to a spin-flip-related partner, and inserts paired segments through these points into the standard high-symmetry path; these segments systematically sample the interior of the irreducible wedge. We demonstrate the construction for all 54 three-dimensional combinations of extended Bravais lattice type and spin Laue group across the six crystal systems that support collinear altermagnetism, and for the 12 two-dimensional cases spanning the four compatible two-dimensional Bravais lattices. Representative band structures are shown for the distinct lattice/path cases. With AlterSeeK-Path, these band structures can be constructed with essentially the same effort as conventional band structures. Program Summary Program title: AlterSeeK-Path Developer’s repository link: https://github.com/yujia-teng/AlterSeeK-Path Licensing provisions: MIT Programming language: Python External routines/libraries used: FINDSPINGROUP, SeeK-path, spglib, pymatgen, ASE, NumPy, SciPy, SymPy, Matplotlib Nature of problem: To systematically display the spin splitting in the band structure of altermagnetic crystals in an automated way. Solution method: To extend the conventional band structure path by sampling lines from the center of the irreducible Brillouin zone to high-symmetry points on its boundary, with construction of the extended path requiring only the magnetic crystal structure information as input. Additional comments: VASP, Quantum ESPRESSO, and ABINIT are fully supported and guidance for other packages is provided. Restrictions: Currently limited to collinear magnetic order.", "tier": "B_IMPORTANT_CONDMAT", "score": "9", "reason": "Tool for band structure analysis of altermagnets, directly useful for researchers.", "tags": ["altermagnet", "bandstructure", "method"], "image": "https://arxiv.org/html/2609.02770v1/figure/workflow.png", "briefing": {"background": "알터마그넷(Altermagnet)은 비자성체와 같이 순 자화가 0이지만, 결정 구조의 대칭성으로 인해 밴드 구조에서 스핀 갈라짐(spin splitting)이 나타나는 새로운 자기 질서 상태입니다. 일반적인 밴드 구조 계산에서는 대칭성 때문에 이 갈라짐이 가려지는 경우가 많습니다.", "motivation": "기존의 높은 대칭성 k-경로(high-symmetry k-path)는 알터마그넷의 고유한 비-상호성 스핀 갈라짐을 시각화하는 데 부적합하며, 연구자가 이를 수동으로 탐색하는 것은 비효율적입니다.", "result": "알터마그넷의 브릴루앙 영역 내에서 스핀 갈라짐이 극대화되는 경로를 자동으로 생성하는 오픈소스 파이썬 툴 'AlterSeeK-Path'를 개발하였습니다.", "implication": "알터마그넷 연구자들이 복잡한 계산 설정 없이도 직관적으로 스핀 갈라짐 밴드를 분석하고 논문에 사용할 수 있는 표준화된 시각화 방법을 제공합니다.", "novelty": "기존 대칭성 기반 경로(SeeK-path 등)의 한계를 넘어, 자기 대칭 그룹과 결정 격자 유형을 결합하여 알터마그넷 특화 경로를 체계적으로 생성한다는 점이 강점입니다.", "unresolved": "현재는 공선형(collinear) 자기 구조에만 국한되어 있어 비공선형(non-collinear) 알터마그넷으로의 확장이 필요합니다.", "future_work": "비공선형 자기 구조 지원 및 DFT 패키지별 자동화 인터페이스의 추가 개선.", "concepts": [{"term": "Altermagnetism", "why_emerged": "강자성체와 반강자성체의 분류를 넘어, 비자성 상태에서도 스핀 의존적 수송 현상을 구현하기 위해.", "origin": "Igor Mazin 외(2022) 등을 통해 최근 급격히 정립됨.", "connections": "반강자성체, 스핀트로닉스, 베리 곡률."}, {"term": "Spin Laue group", "why_emerged": "자기 결정의 대칭성을 분류하여 스핀 의존적 밴드 구조를 예측하기 위해.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "자기 공간 그룹, 자기 결정학."}], "english_summary": ["Introduces AlterSeeK-Path, an open-source tool for systematic band structure analysis in altermagnets.", "Automatically constructs generalized k-paths that reveal hidden spin splitting by sampling the irreducible Brillouin zone.", "Supports 54 3D and 12 2D magnetic lattice/group combinations, integrating seamlessly with common DFT codes.", "Provides a standardized and efficient method to visualize non-reciprocal band structures in collinear magnetic systems."]}}, {"title": "Charge-Transfer Electronic Structure of NiX2 (X = S, Se)", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2609.02148", "authors": "Atsushi Hariki, Takaki Okauchi, Daisuke Takegami, et al.", "last_authors": "Takashi Mizokawa, Jan Kunes", "summary": "We investigate the electronic structures of NiS$_2$ and NiSe$_2$ using density functional theory combined with dynamical mean-field theory (DFT+DMFT). A realistic electronic structure within DFT+DMFT was determined by optimizing the double-counting correction to reproduce experimental valence-band photoemission spectra. The validity of the present model is n; highly relevant for an ARPES expert.", "unresolved": "원문 확인 후 열린 질문을 판단해야 합니다.", "future_work": "후속 실험, 독립 재현, 관련 물질/조건 확장이 가능한지 확인하세요.", "concepts": [], "english_summary": ["The detailed AI briefing was unavailable for this paper.", "Use the abstract, score reason, and original link for a quick first pass."]}}, {"title": "Direct Observation of the Zigzag Edge States of a Supramolecular Diatomic Kagome Lattice", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2609.02567", "authors": "Ryohei Nemoto, Xiangzhi Meng, Behzad Mortezapour, et al.", "last_authors": "Takashi Uchihashi, Kunio Awaga", "summary": "Lattice geometry plays a fundamental role in the behavior of Bloch electrons in a crystal. The diatomic Kagome lattice, an extension of the honeycomb and Kagome lattices, is predicted to give rise to emergent and topological phenomena, but its experimental investigation has been limited thus far. Here, we fabricate a diatomic Kagome lattice through self-assembly of a triptycene derivative with phenazine moieties (Trip-Phz)---a $\\mathrm{C_3}$-symmetric, non-planar $\\pi$-conjugated molecule. Our scanning tunneling microscopy (STM) observations show that Trip-Phz forms a highly ordered diatomic Kagome lattice terminated by zigzag-type edges on the Pb(111) surface. Combined STM measurements and tight-binding calculations provide direct evidence for the existence of the edge states that correspond to those of graphene. These states are topological edge states dictated by the quantization of the Zak phase and the bulk-edge correspondence.This work reveals an ideal platform for exploring quantum materials with unique lattice geometries using supramolecular technology.", "tier": "B_IMPORTANT_CONDMAT", "score": "9", "reason": "STM study of edge states in a kagome lattice; direct hit on user's primary spectroscopic and material interests.", "tags": ["experiment", "STM", "kagome"], "image": "https://arxiv.org/html/2609.02567v1/Fig1.png", "brie ond conventional magnets. Rather than from net magnetization, as in ferromagnets, the unconventional time-reversal symmetry breaking of altermagnets originates from antiferroic magnetic dipoles locked to higher-order multipoles. Here we report the direct visualization of a $g$-wave altermagnetic multipole in the canonical altermagnet CrSb. Combining high-energy synchrotron X-ray diffraction with valence electron density (VED) analysis, we uncover a pronounced directional anisotropy of the VED distribution alternating between Cr sublattices. This evidences the antiferroic order of electric hexadecapoles predicted in $g$-wave altermagnets. Its coexistence with antiferroic magnetic dipoles induces ferroic magnetic multipoles, as probed by polarized neutron diffraction. We further identify a microscopic model of altermagnetism that directly relates the $g$-wave multipole and the $g$-wave spin splitting. Through direct observation and quantification of multipoles, this study provides a real-space fingerprint of altermagnetism and establishes a general probe of hidden multipole order in quantum materials.", "tier": "B_IMPORTANT_CONDMAT", "score": "9", "reason": "Experimental visualization of altermagnetic multipoles in CrSb; high relevance to altermagnetism/TRSB.", "tags": ["material", "CrSb", "altermagnetism"], "image": "https://arxiv.org/html/2609.01969v1/Fig1.png", "briefing": {"background": "알터마그넷(Altermagnet)은 시간 반전 대칭성(TRS)이 깨져있지만 순수 자화(net magnetization)는 없는 공선형(collinear) 자성 물질의 새로운 범주입니다. 기존 강자성체와 달리 고차 다중극자(multipole)와 스핀 구조의 결합을 통해 특이한 전자 구조를 형성합니다.", "motivation": "알터마그네티즘의 이론적 기반이 되는 g-파(g-wave) 다중극자 상태가 실제 물질에서 존재하는지 직접 시각화하여 확인하고자 하였습니다.", "result": "CrSb 단결정에서 고에너지 싱크로트론 X-선 회절과 원자가 전자 밀도 분석을 통해 g-파 알터마그네틱 다중극자를 관측했습니다. 이는 전기적 16극자(hexadecapole)의 반강자성 정렬을 입증하는 결과입니다.", "implication": "알터마그네티즘의 미시적 기원인 스핀 분할과 다중극자 구조 사이의 상관관계를 실험적으로 증명함으로써, 양자 물질 내 숨겨진 다중극자 질서를 탐구하는 일반적인 탐침 기술을 확립했습니다.", "novelty": "이론적으로 예측된 알터마그넷의 다중극자 구조를 실공간에서 직접 시각화했다는 점이 핵심입니다. 특히 ARP ations in cuprates.", "tags": ["experiment", "RIXS", "cuprates"], "image": "", "briefing": {"background": "쿠퍼산화물 고온 초전도체의 메커니즘을 밝히기 위해 스핀 플럭츄에이션(자기 요동)이 전자 쌍 형성에 기여하는지 여부는 오랫동안 논란의 중심이었습니다.", "motivation": "RIXS 기술을 사용하여 도핑 농도가 매우 높은 영역(overdoped)까지 자기 들뜸(paramagnon)이 어떻게 진화하는지 추적하여 초전도성과의 상관관계를 확인하고자 합니다.", "result": "도핑 농도가 매우 높은 x=0.50까지도 파라마그논이 살아있음을 발견했지만, 이 자기 들뜸의 강도는 초전도성의 지속 여부와 직접적으로 비례하지 않음을 확인했습니다.", "implication": "고에너지 스핀 들뜸이 초전도 쌍 형성을 이끄는 결정적인 요인이 아닐 가능성을 보여주며, 기존 스핀 요동 매개 초전도 이론을 다시 고찰하게 합니다.", "novelty": "기존 연구보다 훨씬 넓은 도핑 범위에서 RIXS를 사용하여 자기 들뜸의 지속성을 관찰함으로써 물리적 통찰의 범위를 확장했습니다.", "unresolved": "파라마그논이 초전도에 미치는 영향이 완전히 배제된 것인지, 아니면 아주 작은 기여를 하는지에 대해서는 여전히 정량적 분석이 필요합니다.", "future_work": "초전도성 메커니즘에 관여하는 다른 저에너지 전자 상호작용이나 격자 효과(포논 등)에 대한 추가 정밀 측정이 요구됩니다.", "concepts": [{"term": "RIXS", "why_emerged": "물질 내의 전하, 스핀, 궤도 등 다양한 들뜸 상태를 높은 에너지 분해능으로 측정하기 위해 필요.", "origin": "1970년대 이론 제안, 2000년대 이후 X선 소스 발달로 급격히 발전.", "connections": "비탄성 중성자 산란, 전자 구조 분석, 상관 전자계."}, {"term": "파라마그논", "why_emerged": "자기 정렬이 없는 상태에서 스핀의 집단적인 요동 현상을 기술하기 위해 도입됨.", "origin": "중성자 산란 실험 등을 통해 개념적으로 확립됨.", "connections": "스핀 플럭츄에이션, 초전도 쌍 형성, 허바드 모델."}], "english_summary": ["Investigates high-energy spin excitations in La2-xCaxCuO4 films using RIXS.", "Observes paramagnons persisting up to x=0.50 doping levels.", "Finds no clear correlation between paramagnon spectral weight and superconductivity at high doping.", "Suggests high-energy magnetic excitations are likely not the primary driver of superconducting pairing."]}}, {"title": "Field-angle dependence of magnetoresistance in UTe2", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/pm7m-xcg9", "authors": "Jun Ishizuka, Youichi Yanase", "last_authors": "Jun Ishizuka, Youichi Yanase", "summary": "We theoretically study angle-resolved magnetoresistance under rotated magnetic field in the normal state of a spin-triplet superconductor ${\\mathrm{UTe}}_{2}$. The Wannier model derived from a $\\mathrm{ ntaleón, Francisco Guinea, Gerardo G. Naumis", "last_authors": "Francisco Guinea, Gerardo G. Naumis", "summary": "Two-dimensional systems with flat bands support correlated phases such as superconductivity. While twisted moiré systems, like twisted bilayer graphene, have revealed such states, they remain complex to control. Here, we study monolayer graphene under uniaxial periodic strain, which forms a quasi-on…", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Electronic structure and charge textures in strained graphene.", "tags": ["graphene", "superconductivity", "chargetexture"], "image": "", "briefing": {"background": "이차원 물질의 플랫 밴드(flat band)는 강한 상관관계에 의한 초전도성이나 전하 밀도 파(CDW)와 같은 양자 현상을 연구하는 핵심 플랫폼입니다. 특히 트위스트 이중층 그래핀(TBG)이 그 대표적인 예입니다.", "motivation": "모아레 시스템의 복잡한 제작 공정을 피하면서, 단일 층 그래핀에 주기적인 변형(strain)을 가하여 제어 가능한 준-1차원적 평탄 밴드 구조를 유도하고 상관 관계 물리 현상을 관찰하고자 합니다.", "result": "주기적인 단축 변형이 그래핀에 전하 텍스처(charge textures)를 형성하며, 이러한 구조가 잠재적으로 초전도성과 같은 상관 관계 상태를 유도할 수 있음을 이론적으로 제시합니다.", "implication": "복잡한 모아레 적층 없이 물리적 변형 공정만으로도 그래핀의 전자 구조를 조절하여 강상관 전자계 연구가 가능함을 시사합니다.", "novelty": "외부 힘에 의한 구조적 변형을 통해 전자 상태를 엔지니어링한다는 점에서 그래핀 기반 소자 설계 및 2D 물질 연구에 새로운 방법론을 제공합니다.", "unresolved": "실제 실험적으로 이 변형이 유도한 전하 텍스처가 초전도성으로 이어지는지에 대한 직접적인 증거는 부족합니다.", "future_work": "주기적 변형을 가한 단층 그래핀에서 저온 전기 전도도 측정 또는 STM/STS를 통한 국소 상태 밀도(LDOS) 확인이 필요합니다.", "concepts": [{"term": "Flat Band", "why_emerged": "밴드 폭이 좁아 운동 에너지가 억제되고 상호작용 에너지가 지배적이게 되므로 강상관 현상을 관찰하기 유리함.", "origin": "강상관 전자계 이론 연구에서 오랫동안 다루어짐.", "connections": "트위스트 이중층 그래핀, 무질서 시스템의 란다우 레벨."}, {"term": "Charge Texture", "why_emerged": "물질 내의 국소적인 전하 밀도 비균일성이 양자 위상이나 상전이에 미치는 영향을 기술하기 위해 필요.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "전하 밀도 파(CDW), 위상 물질의 경계 상태."}], "english_summary": ["Explores strain-engineered monolayer graphene as a platform for correlated phases.", "Uses periodic uniaxial strain to create flat band conditions analogous to moiré systems.", "Predicts the emergence of interaction-driven charge textures.", "Proposes an alternative path to observing unconventional superconductivity without complex moiré twisting."]}}, {"title": "Intrinsic intralayer antiferromagnetism in the near-stoichiometric two-dimensional van der Waals magnet Fe3GeTe2", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/1fpk-fgkj", "authors": "Neesha Yadav, Shivani Kumawat, Sandeep Soni, Brajesh Kumar Mani, Pintu Das", "last_authors": "Brajesh Kumar Mani, Pintu Das", "summary": "For the van der Waals magnet ${\\mathrm{Fe}}_{3}{\\mathrm{GeTe}}_{2}$, although a ferromagnetic ground state has been reported, there are also reports of complex magnetic behavior suggesting coexistence of ferromagnetism and antiferromagnetism due to the intricate interaction between ${\\mathrm{Fe}}^{+…", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Study of a major vdW magnet (Fe3GeTe2) and its complex magnetic ground state.", "tags": ["experiment", "material", "vdWmagnets"], "image": "", "briefing": {"background": "Fe3GeTe2(FGT)는 반데르발스 힘으로 층간이 결합된 자성 물질로, 2D 자성 및 위상 물리 연구의 핵심 물질입니다.", "motivation": "FGT는 강자성체로 널리 알려져 있으나, 최근 일부 실험에서 반강자성적 거동이 보고되는 등 자기적 기저 상태에 대한 논란이 있어 이를 명확히 규명하고자 합니다.", "result": "화학양론적 조성에 가까운 Fe3GeTe2에서 철 원자 간의 복잡한 상호작용으로 인해 층 내 반강자성적 요소가 공존함을 시사합니다.", "implication": "FGT의 자성 모델을 단순 강자성에서 더 복잡한 공존 모델로 수정해야 할 필요성을 제시합니다.", "novelty": "기존의 정형화된 FGT 강자성 모델에 의문을 제기하며, 보다 정밀한 시료 분석을 통해 미묘한 자기적 상호작용을 드러냈습니다.", "unresolved": "강자성과 반강자성이 구체적으로 어떻게 상분리되거나 공존하는지에 대한 미시적 구조 정보는 추가적인 분석이 필요합니다.", "future_work": "중성자 산란 실험이나 저온 자기 구조 분석(예: MOKE 또는 자기 민감도 측정)을 통해 반강자성 성분의 기원을 명확히 해야 합니다.", "concepts": [{"term": "Van der Waals Magnet", "why_emerged": "2차원 극한 환경에서 자기적 질서를 유지하고 이를 소자에 응용하기 위해 발견됨.", "origin": "2017년 전후 CrI3, Fe3GeTe2의 발견으로 본격화됨.", "connections": "2D 전이금속 칼코겐 화합물, Spintronics."}, {"term": "Near-stoichiometric", "why_emerged": "결함(vacancy)이 물성에 미치는 영향이 매우 크기 때문에 화학적 조성의 정확성이 중요함.", "origin": "일반적인 고체화학 및 재료 공학적 개념.", "connections": "결정 결함, 도핑 효과."}], "english_summary": ["Investigates the magnetic ground state of Fe3GeTe2, a key vdW magnet.", "Addresses conflicting reports regarding the coexistence of ferromagnetism and antiferromagnetism.", "Provides evidence for intrinsic intralayer antiferromagnetic behavior in near-stoichiometric samples.", "Challenges the simplified view of Fe3GeTe2 as a pure ferromagnet."]}}, {"title": "Light-induced topological phase transitions and anomalous thermal transport in d-wave altermagnets", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/8x4v-gf3y", "authors": "Ayesha Maryam, Muzamil Shah, Kashif Sabeeh, Reza Asgari", "last_authors": "Kashif Sabeeh, Reza Asgari", "summary": "We study intrinsic thermal transport and Floquet-engineered topology in a two-dimensional d -wave altermagnetic topological insulator powered by linearly polarized light. We analyze the anomalous Hall, Nernst, and thermal Hall conductivities, as well as their spin-resolved equivalents, and develop closed-form formulas for the Berry curvature using an analytically calculated high-frequency effective Hamiltonian. We demonstrate that linearly polarized light, in contrast to conventional antiferromagnets, breaks the symmetry connecting spin sectors in altermagnets, allowing a series of spin-selective topological phase transitions from a quantum spin Hall state to a spin-polarized Chern insulator and finally to a trivial phase. The Nernst response shows substantial thermal activation and significant sensitivity to the gap size in the Chern domain, but both the electrical and thermal Hall responses become quantized and meet the anomalous Wiedemann-Franz law. Every anomalous transport coefficient exhibits a distinctive d -wave dependence on the polarization angle, reversing sign under orthogonal rotation and vanishing at symmetry-restoring directions. Our findings show a path to all-optical regulation of topological and caloritronic responses beyond traditional magnetic systems and establish thermal transport as a sensitive probe of altermagnetic order.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Floquet-engineered altermagnetism is highly relevant to current topological interests.", "tags": ["altermagnetism", "Floquet", "topology"], "image": "", "briefing": {"background": "Altermagnetism(알터자성)은 최근 자성학에서 새롭게 주목받는 분야로, 강자성도 반강자성도 아닌 비-상대론적 스핀 분할을 가지는 물질을 의미합니다.", "motivation": "빛(Floquet engineering)을 사용하여 알터자성체의 위상적 상태를 인위적으로 제어하고, 이 과정에서 발생하는 열전 수송 현상을 규명하고자 합니다.", "result": "빛의 편광을 통해 스핀 선택적 위상 전이를 유도할 수 있으며, 전기적 및 열적 홀 효과가 광학적으로 제어 가능함을 입증했습니다.", "implication": "알터자성체가 차세대 위상 양자 소자 및 열전 소자 플랫폼으로 활용될 수 있음을 보여줍니다.", "novelty": "빛을 이용해 알터자성체의 스핀 대칭성을 깨뜨리고, 이를 통해 양자 비정상 홀 효과를 조절하는 메커니즘을 최초로 구체화했습니다.", "unresolved": "제시된 이론적 모델이 실제 물질(예: RuO2 등)에서 레이저 세기나 에너지에 따라 얼마나 견고하게 작동할지 검증이 필요합니다.", "future_work": "초고속 분광학 및 시간 분해 ARPES를 통한 동역학적 위상 전이의 직접 관측이 요구됩니다.", "concepts": [{"term": "Altermagnetism", "why_emerged": "자성 금속에서 시간 반전 대칭성을 깨고 스핀 분할(Spin-splitting)을 구현하는 새로운 자기 질서 형태가 필요했음.", "origin": "최근 2-3년 내 이론적 체계 정립(Jungwirth 그룹 등).", "connections": "강자성, 반강자성, 비상대론적 스핀 분할."}, {"term": "Floquet Engineering", "why_emerged": "주기적인 외력(빛)을 가해 시스템의 유효 해밀토니안을 수정하여 새로운 위상 상태를 창출하기 위함.", "origin": "양자 광학 및 응집물질 물리학의 결합.", "connections": "플로케 위상 절연체, 비평형 상태 양자 통계."}], "english_summary": ["Analyzes Floquet-engineered topology in d-wave altermagnetic insulators.", "Demonstrates light-induced spin-selective topological phase transitions.", "Shows that linear polarization can manipulate anomalous Hall and thermal Hall responses.", "Proposes thermal transport as a sensitive probe for altermagnetic order."]}}, {"title": "Local phase-space Berry curvature and Hall transport in textured twisted bilayer graphene", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/jpp9-lqs4", "authors": "Tohid Farajollahpour", "last_authors": "Tohid Farajollahpour", "summary": "Slow twist-angle and heterostrain textures in twist cent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/btb3-gww3", "authors": "Hui Yang, Ya-Hui Zhang", "last_authors": "Hui Yang, Ya-Hui Zhang", "summary": "The discovery of high-temperature superconductivity in bilayer nickelate ${\\mathrm{La}}_{3}{\\mathrm{Ni}}_{2}{\\mathrm{O}}_{7}$ necessitates a minimal theoretical model that unifies the superconducting phase with the spin-density-wave (SDW) phase without external pressure or strain. We propose a model…", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Important theoretical model for the high-Tc bilayer nickelate superconductor.", "tags": ["nickelate", "superconductivity", "theory"], "image": "", "briefing": {"background": "최근 La3Ni2O7에서 발견된 고온 초전도성은 구리 산화물(cuprates) 이후 니켈 기반 산화물에서의 새로운 초전도 메커니즘을 탐색하는 중요한 분야가 되었습니다.", "motivation": "외부 압력 없이도 나타나는 초전도 상과 스핀 밀도 파(SDW) 상을 통일적으로 설명할 수 있는 최소 이론 모델이 필요합니다.", "result": "이중층 니켈산염의 전자 구조를 설명하는 새로운 이론 모델을 제안하여, 자기적 질서와 초전도성의 상관관계를 제시했습니다.", "implication": "니켈산염의 고온 초전도성을 이해하기 위한 핵심적인 이론적 토대를 제공하며, 향후 물질 설계의 지침이 됩니다.", "novelty": "압력이나 변형 없이도 물질 내부의 전자적 상호작용만으로 두 상의 공존 또는 경쟁을 설명하려 시도했습니다.", "unresolved": "제안된 모델이 실제 ARPES 등 실험적으로 측정된 페르미 표면과 얼마나 정량적으로 일치하는지에 대한 검증이 남아있습니다.", "future_work": "제안된 모델을 기반으로 한 도핑 의존성 계산 및 다른 니켈산염 물질로의 확장 연구가 기대됩니다.", "concepts": [{"term": "이중층 니켈산염 (Bilayer nickelate)", "why_emerged": "구리 산화물과 유사한 d-전자 시스템에서 고온 초전도성을 찾기 위한 연구의 일환.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "La3Ni2O7, high-Tc superconductivity, spin-density-wave."}, {"term": "스핀 밀도 파 (SDW)", "why_emerged": "전자의 스핀 밀도가 공간적으로 주기적인 변조를 갖는 기저 상태를 기술하기 위해 도입.", "origin": "알베르 오버하우저(Albert Overhauser), 1962년.", "connections": "자성체, 강한 상관계, 초전도 경쟁/협력."}], "english_summary": ["Proposes a minimal model for high-Tc superconductivity in La3Ni2O7.", "Unifies superconducting and SDW phases without external strain.", "Theoretical framework for the newly discovered bilayer nickelate superconductor.", "Suggests intrinsic electronic correlations are key to the phase diagram."]}}, {"title": "Metallic crossover through the tilt-free transition in La3Ni2O7 at high pressure and temperature", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/832c-p7qj", "authors": "Bastien Michon, Yingpeng Yu, Beatrice D'Alò, et al.", "last_authors": "Ferenc Borondics, Francesco Capitani", "summary": "Here, the authors map the temperature-pressure evolution of the bilayer nickelate La 3 Ni 2 O 7 and reveal that the suppression of tilts in oxygen octahedra is accompanied by a pronounced crossover toward a higher-carrier-density metallic state. By establishing the structural phase boundary over a broad temperature-pressure range, their results highlight the intimate interplay between lattice structure and electronic properties in this novel high-T c superconductor.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Experimental investigation of the high-Tc bilayer nickelate phase diagram.", "tags": ["nickelate", "superconductivity", "pressure"], "image": "", "briefing": {"background": "La3Ni2O7은 고압 환경에서 고온 초전도성을 보이는데, 이 과정에서 발생하는 구조적 변화가 전자 상태에 미치는 영향은 아직 명확하지 않습니다.", "motivation": "압력과 온도에 따른 결정 구조의 변화(특히 산소 팔면체 기울어짐)와 초전도성 사이의 상관관계를 실험적으로 밝히고자 합니다.", "result": "산소 팔면체의 기울어짐이 억제되는 구조적 전이와 함께 캐리어 밀도가 증가하는 금속적 상태로의 교차(crossover)가 관찰되었습니다.", "implication": "니켈산염의 초전도성이 구조적인 격자 변형과 밀접하게 결합되어 있음을 입증하며, 압력 조절을 통한 제어 가능성을 시사합니다.", "novelty": "고압/고온 영역에서의 구조적 위상 경계를 실험적으로 상세히 매핑하여 격자와 전자 물성의 상호작용을 정량화했습니다.", "unresolved": "구조적 전이가 구체적으로 어떤 에너지 스케일의 전자 상호작용을 변화시키는지는 추가적인 분광학적 연구가 필요합니다.", "future_work": "고압 하에서의 RIXS 또는 광전분광 실험을 통해 페르미 준위 근처의 전자 구조 변화를 직접 관측하는 작업이 필요합니다.", "concepts": [{"term": "산소 팔면체 기울어짐 (Octahedra tilt)", "why_emerged": "페로브스카이트 구조에서 격자 안정성과 전자 밴드폭을 결정하는 주요 구조적 파라미터.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "구조 상전이, 밴드 구조 변조, 금속-절연체 전이."}, {"term": "금속적 교차 (Metallic crossover)", "why_emerged": "온도나 압력 변화에 따라 물질의 전도성이 점진적으로 변화하는 상태를 지칭.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "상태도, 캐리어 밀도 변화, 양자 임계 현상."}], "english_summary": ["Maps the temperature-pressure phase diagram of La3Ni2O7.", "Reveals the suppression of octahedral tilts correlates with increased carrier density.", "Highlights the intimate link between crystal structure and superconductivity.", "Provides experimental evidence for the structural-electronic interplay in nickelates."]}}, {"title": "Observation of charge dressing in Bi4Te3 topological insulator thin films: A terahertz and infrared spectroscopic study", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/6kv9-46kx", "authors": "Veronica Stopponi, Johannes Schmidt, Andrea Perucchi, et al.", "last_authors": "Stefano Lupi, Paola Di Pietro", "summary": "Bi 4 Te 3 has been first realized as an element of the adaptive series ( Bi 2 ) m ( Bi 2 Te 3 ) n —deriving from stacking metallic Bi and topological insulator Bi 2 Te 3 blocks—and studied for its promising thermoelectric properties. Recently, Bi 4 Te 3 has also been found as a topological insulator hosting a complex band structure with three Dirac cones in k space. Here we report measurements of the optical conductivity of five Bi 4 Te 3 thin films with thickness varying from 11 to 32 nm. This extensive study, based on terahertz time-domain spectroscopy and Fourier-transform infrared spectroscopy, provides a broadband optical conductivity. By employing a Kramers-Kronig constrained Drude-Lorentz model, the spectral contributions to the optical conductivity of each sample have been singled out. In contrast to an ideal topological insulator—with perfectly insulating bulk—in Bi 4 Te 3 far-infrared and mid-infrared bands indicate the presence of localized massive carriers, which dope the bulk system, as also observed in chemically compensated single crystals of other bismuth-based topological insulators. In addition, the localized bulk charges strongly renormalize the electronic mass. The charge dressing enhances as the thickness increases, indicating a trivial metallic behavior of Bi 4 Te 3 thin films. This study elucidates the inner relationship between the optical properties of a topological insulator like Bi 4 Te 3 and its complex band structure, since the detection of the topological massless carriers by optical measurements is prevented by the occurrence of novel and unusual conductive properties.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Experimental spectroscopy of a topological insulator thin film; highly relevant to electronic structure.", "tags": ["experiment", "material", "topologicalinsulator"], "image": "", "briefing": {"background": "위상 절연체(TI)는 내부가 절연체이고 표면에서 질량 없는 Dirac 페르미온이 흐르는 물질로, 응집물질물리학의 핵심 연구 대상입니다. 하지만 실제 물질들은 화학적 도핑이나 구조적 결함으로 인해 '완벽한 절연' 상태를 유지하기 어렵습니다.", "motivation": "Bi4Te3는 Bi와 Bi2Te3가 적층된 독특한 구조를 가지며 여러 개의 Dirac 원추를 가지는 위상 절연체입니다. 본 연구는 이 박막 시스템에서 광학적 전도도를 분석하여 실제 전자 구조가 이론적 예측과 어떻게 다른지 규명하고자 했습니다.", "result": "THz 및 적외선 분광법을 통해 조사한 결과, Bi4Te3 박막은 이상적인 위상 절연체와 달리 벌크 내에 국소화된 거대 질량 전하를 보유하며, 이로 인해 전자가 '드레싱(dressing)'되어 유효 질량이 크게 재규격화됨을 발견했습니다.", "implication": "위상 절연체의 광학적 특성 해석 시 벌크의 기여를 무시할 수 없으며, 박막 두께가 증가함에 따라 위상적 특성보다는 금속적인 거동이 지배적으로 나타난다는 점을 시사합니다.", "novelty": "광학 분광법을 통해 TI 내부의 불순물에 의한 벌크 전하 기여와 전자 질량 재규격화 현상을 정량적으로 분리해냈으며, 이는 ARPES 데이터 해석 시 고려해야 할 중요한 벌크 배경 효과를 제시합니다.", "unresolved": "이러한 '전하 드레싱' 현상이 정확히 어떤 미시적 결함이나 불순물 배치에 기인하는지에 대한 원자 수준의 정밀한 규명은 부족합니다.", "future_work": "다른 위상 물질들에서도 유사한 광학적 전하 드레싱 효과를 추적하고, 박막 두께에 따른 위상적 표면 상태와 벌크 상태 간의 경쟁을 제어하는 실험이 필요합니다.", "concepts": [{"term": "Charge dressing", "why_emerged": "강한 상관관계 시스템에서 입자가 주변 환경과 상호작용하여 유효 질량이 변하는 현상을 설명하기 위해 도입됨.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "Polaron 이론, Luttinger liquid 물리학과 연결됨."}, {"term": "Kramers-Kronig constrained Drude-Lorentz model", "why_emerged": "실험적으로 얻은 반사/투과 스펙트럼으로부터 복소 유전율을 유도하고 물리적 해석을 하기 위해 필수적임.", "origin": "Kramers-Kronig 관계는 20세기 초반 물리적 인과율에서 유래.", "connections": "광학 분광학(Optical spectroscopy) 전반."}], "english_summary": ["Bi4Te3 thin films were analyzed via THz and infrared spectroscopy.", "Results show significant bulk charge contribution contradicting ideal TI behavior.", "Electronic mass renormalization indicates strong charge dressing effects.", "Thickness dependence reveals a transition toward trivial metallic properties."]}}, {"title": "Observation of subharmonic charge-density-wave correlations in La-based cuprates", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/djbs-mcz5", "authors": "J.-S. Lee, S. A. Kivelson, H. Lee, et al.", "last_authors": "M. Fujita, C.-C. Kao", "summary": "Suggestive but indirect evidence for pair-density-wave correlations has been reported in several high- T c cuprates, yet a bulk-sensitive scattering signature of the expected subharmonic charge response has remained elusive. Here, the authors use resonant soft x-ray scattering to identify a reproducible subharmonic charge density wave response near half the primary charge-ordering wave vector in two La-based cuprates. The response emerges in the stripe-ordered, layer-decoupled superconducting regime, where charge, spin, and superconducting correlations are intertwined.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Important experimental study of CDW and intertwined orders in cuprates relevant for correlated electron systems.", "tags": ["CDW", "cuprate", "superconductivity"], "image": "", "briefing": {"background": "고온 초전도체인 구프라이트(cuprates)에서 전하 밀도 파동(CDW)과 초전도성은 서로 경쟁하거나 상호 보완적인 '얽힌 질서(intertwined orders)'로 존재하며, 이는 초전도 메커니즘을 푸는 열쇠로 여겨집니다.", "motivation": "이론적으로는 Pair-Density-Wave(PDW)와 연관된 전하 응답이 예측되었으나, 실제 물질에서 이를 뒷받침할 결정적인 증거를 찾는 것이 매우 어려웠습니다.", "result": "공명 연성 X선 산란(RSXS) 실험을 통해 라(La) 계열 구프라이트에서 1차 CDW 파동 벡터의 절반 지점인 '부조화(subharmonic)' 전하 응답을 관측했습니다.", "implication": "이는 스트라이프 질서(stripe order) 영역에서 전하와 초전도 상관관계가 얽혀 있음을 보여주며, PDW 상태가 실제 물질에 존재할 가능성을 크게 높여줍니다.", "novelty": "그간 간접적으로만 추측되던 PDW 관련 전하 응답을 실험적으로 명확히 포착했다는 점이 핵심이며, 이는 kagome 금속에서 논의되는 CDW와 TRSB 물리학과도 맥락을 공유합니다.", "unresolved": "이번 실험으로 관측된 신호가 PDW를 직접적으로 증명하는 유일한 경로인지, 아니면 다른 형태의 전하 질서인지에 대한 논란이 남을 수 있습니다.", "future_work": "다른 구프라이트 시스템에서의 일관된 확인과, 이러한 부조화 모드가 초전도 전이 온도와 어떻게 정량적으로 연결되는지 연구가 필요합니다.", "concepts": [{"term": "Pair-Density-Wave (PDW)", "why_emerged": "초전도 쌍이 유한한 운동량을 가지는 특이한 초전도 상태를 설명하기 위해 제안됨.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "고온 초전도, Stripe phase, Quantum liquid crystals."}, {"term": "Resonant Soft X-ray Scattering (RSXS)", "why_emerged": "원소 선택적으로 전하 및 궤도 정렬을 감지하기 위한 고분해능 도구로 개발됨.", "origin": "싱크로트론 방사광 시설 발전과 함께 2000년대 이후 활발히 사용.", "connections": "X선 회절, ARPES 등과 결합하여 전자 구조 규명."}], "english_summary": ["Subharmonic CDW correlations identified in La-based cuprates.", "RSXS measurements reveal signatures in the stripe-ordered regime.", "Provides experimental evidence linking charge, spin, and superconductivity.", "Advances the understanding of intertwined orders in high-Tc systems."]}}, {"title": "Orbital-selective Mott and antiferromagnetic phases in diagonally compressed kagome lattice", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/ml9d-pzwl", "authors": "Jiewei Ding, Ho-Kin Tang, Wing Chi Yu", "last_authors": "Ho-Kin Tang, Wing Chi Yu", "summary": "We perform determinant quantum Monte Carlo simulations of the half-filled Hubbard model on a diagonally compressed kagome lattice, introducing exponential decay long-range hopping $t(r)={t}_{0}exp\\left(−r/{r}_{0}\\right)$ to account for the evolving bond length. By varying the lattice angle $θ$ and t…", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Theory of correlations in kagome lattices, including nematic-like compression effects relevant to AV3Sb5.", "tags": ["theory", "material", "kagome"], "image": "", "briefing": {"background": "AV3Sb5와 같은 카고메 격자 물질은 전자 구조의 평탄한 띠(flat band)와 van Hove 특이점(vHs)으로 인해 상관관계에 의한 다양한 전자 질서(CDW, 초전도 등)가 나타나는 플랫폼입니다.", "motivation": "대각선 방향의 격자 압축(diagonally compressed)이 가해졌을 때, 카고메 격자의 전자들이 어떻게 Mott 절연체나 자기 질서로 ct relevance to topological magnetism research.", "tags": ["theory", "altermagnetism", "topological"], "image": "", "briefing": {"background": "알터마그넷(Altermagnet)은 순 자화는 0이지만 운동량 공간에서 스핀 분할이 발생하는 새로운 자기 상으로, 기존의 강자성체나 반강자성체와 구별되는 대칭성 기반 물리적 성질을 탐구하는 분야입니다.", "motivation": "Rashba 상호작용이 존재하는 d-wave 알터마그넷에서 자기장의 방향에 따라 변화하는 란다우 준위와 자기 광학 전도도를 이론적으로 규명하고자 합니다.", "result": "알터마그넷 내부의 이방성 스핀 분할 방향에 의존하는 란다우 준위 구조와 이에 따른 광학 전도도의 특성을 산출하였으며, 이는 위상학적 응답과 자기적 특성을 연결하는 결과입니다.", "implication": "알터마그넷의 위상학적 성질을 광학 실험으로 검증할 수 있는 가능성을 제시하며, 향후 이 물질군의 실험적 동정 도구로 활용될 수 있습니다.", "novelty": "운동량 의존적 스핀 분할을 가진 알터마그넷의 자기 광학적 반응을 Rashba 결합과 결부하여 분석했다는 점이 독창적입니다.", "unresolved": "이론적 모델이며 실제 물질에서의 불순물 효과나 격자 결함이 이 광학 반응에 미치는 영향은 아직 불분명합니다.", "future_work": "실제 알터마그넷 물질을 이용한 광학적 분광 실험 및 위상학적 수송 특성 측정으로의 확장이 필요합니다.", "concepts": [{"term": "Altermagnetism", "why_emerged": "강자성체와 반강자성체의 경계에서 순 자화 없이 스핀 분할을 갖는 새로운 대칭성 보호 자기상을 분류하기 위해 필요했습니다.", "origin": "최근 2020년대 초반에 본격적으로 이론화 및 분류되었습니다.", "connections": "반강자성체, 스핀 분극, 위상학적 위상 물질 등과 깊은 연관이 있습니다."}, {"term": "Rashba Effect", "why_emerged": "결정 구조의 반전 대칭성 깨짐이 전자 스핀 상태에 미치는 영향을 설명하기 위해 필요했습니다.", "origin": "Rashba에 의해 1960년대 초반 제안되었습니다.", "connections": "스핀-궤도 결합, 위상 절연체, 스핀트로닉스와 연결됩니다."}], "english_summary": ["Theoretical study on Landau levels and magneto-optical conductivity in d-wave altermagnets.", "Incorporates Rashba coupling and orientation-dependent spin splitting.", "Links exotic magnetic symmetry to measurable optical signatures.", "Provides a foundation for experimental verification of topological altermagnetism."]}}, {"title": "Room-temperature third-order nonlinear anomalous Hall effect in the ferromagnetic metal Fe3GaTe2", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/yylc-2x8l", "authors": "Zheng Dai, Shuai Zhang, Jiajun Li, et al.", "last_authors": "Huaiqiang Wang, Fengqi Song", "summary": "Berry curvature, as the imaginary component of quantum geometry, plays a crucial role in condensed matter physics. The spatial distribution of Berry curvature can be characterized by its dipole and multipole moments, which can induce the nonlinear anomalous Hall effect (NLAHE). To date, the NLAHE ha…", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Nonlinear Hall effect and Berry curvature in an experimental magnetic system.", "tags": ["Berrycurvature", "anomalousHall", "ferromagnet"], "image": "", "briefing": {"background": "Berry 곡률은 위상학적 전자 구조의 핵심 요소로, 운동량 공간 내에서의 기하학적 분포가 이상 홀 효과를 포함한 다양한 비선형 수송 현상을 결정합니다.", "motivation": "강자성 금속 Fe3GaTe2에서 3차 비선형 이상 홀 효과(NLAHE)를 상온에서 관측하여 이 물질의 위상학적 기하 구조를 밝히고자 합니다.", "result": "Fe3GaTe2에서 상온 비선형 이상 홀 효과를 성공적으로 측정하였으며, 이는 Berry 곡률의 다극 모멘트가 물질의 전자 구조와 밀접하게 연관되어 있음을 시사합니다.", "implication": "상온에서 작동하는 비선형 홀 효과는 향후 위상학적 소재를 이용한 비선형 전자 소자 개발에 있어 중요한 지표가 됩니다.", "novelty": "일반적으로 저온에서 관측되던 비선형 수송 현상을 상온 강자성 금속에서 확인하여 실용적 응용 가능성을 높였습니다.", "unresolved": "Berry 곡률 기여 외에 다체 상호작용이 이 비선형 효과에 어느 정도 기여하는지는 추가 검증이 필요합니다.", "future_work": "다양한 외부 장(압력, 게이트 전압)을 통한 Berry 곡률의 튜닝 실험이 이어질 것으로 보입니다.", "concepts": [{"term": "Berry Curvature", "why_emerged": "양자역학적 파동 함수의 기하학적 위상과 그에 따른 수송 특성을 통합적으로 이해하기 위해 도입되었습니다.", "origin": "Michael Berry가 1984년에 정립하였습니다.", "connections": "이상 홀 효과, 위상 절연체, 비선형 수송 현상 등과 연결됩니다."}, {"term": "Nonlinear Anomalous Hall Effect", "why_emerged": "반전 대칭성이 존재하는 시스템에서도 Berry 곡률의 다극 모멘트에 의해 발생하는 홀 효과를 설명하기 위해 필요했습니다.", "origin": "최근 2D 및 위상학적 물질 연구에서 실험적으로 확립되었습니다.", "connections": "Berry 곡률 쌍극자, 광학적 2차 조화파 발생(SHG) 등과 관련이 있습니다."}], "english_summary": ["Experimental observation of room-temperature third-order NLAHE in Fe3GaTe2.", "Relates nonlinear transport to Berry curvature multipole moments.", "Demonstrates robust topological signatures in a ferromagnetic metal.", "Highlights potential for room-temperature topological electronics."]}}, {"title": "Emergent Gauge Flux and Spin Ordering in Magnetized Triangular Spin Liquids: Applications to Hofstadter-Hubbard Model", "journal": "PRL_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/gbnt-vmns", "authors": "Jiahao Yang (杨家豪), Hao Tian, Si-Yu Pan, Gang v. Chen", "last_authors": "Si-Yu Pan, Gang v. Chen", "summary": "Motivated by recent progress in moiré superlattices and spin-$1/2$ triangular-lattice antiferromagnets, we study how orbital magnetic flux and Zeeman coupling compete or cooperate in generating internal U(1) gauge flux in a triangular spin liquid. We show that orbital flux favors a chiral spin liqui…", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Theory of spin ordering in moiré/spin liquid systems, connected to relevant material classes.", "tags": ["moire", "spinliquid", "antiferromagnetism", "stronglycorrelated", "theory"], "image": "", "briefing": {"background": "모아레 격자 및 강한 상관관계 물질 시스템에서 발생하는 양자 스핀 액체는 비자명한 위상학적 순서와 게이지 장을 포함하고 있어 현대 응집물질 물리학의 주요 연구 주제입니다.", "motivation": "삼각 격자 스핀 액체 시스템에서 궤도 자기장과 제만 효과가 어떻게 상호작용하여 U(1) 게이지 자속을 생성하고 스핀 질서를 유도하는지 이론적으로 탐구합니다.", "result": "궤도 자속이 카이랄 스핀 액체를 안정화시키는 메커니즘을 밝혀냈으며, Hofstadter-Hubbard 모델 적용을 통해 스핀 배열에 대한 새로운 물리적 그림을 제시했습니다.", "implication": "모아레 시스템 내에서의 스핀-궤도 결합 및 게이지 장 조절 가능성을 보여주며, 양자 계산 자원으로서의 스핀 액체 활용 가능성을 시사합니다.", "novelty": "모아레 슈퍼래티스라는 최신 플랫폼을 통해 고전적인 스핀 액체 모델을 구체적으로 구현하고 조절하는 이론적 틀을 마련했습니다.", "unresolved": "모델 시스템의 계산 결과가 실제 moiré 금속 또는 절연체 물질의 실험 결과와 얼마나 정확히 일치하는지는 더 정밀한 수치 계산이 필요합니다.", "future_work": "모아레 격자 물질에서의 비선형 광학 응답이나 중성자 산란 실험 예측 모델로 확장될 것으로 보입니다.", "concepts": [{"term": "Quantum Spin Liquid", "why_emerged": "강한 양자 요동으로 인해 절대 영도에서도 장거리 자기 질서가 파괴되는 상을 설명하기 위해 도입되었습니다.", "origin": "Philip Anderson이 1973년에 처음 제안하였습니다.", "connections": "고온 초전도체, 얽힘, 위상학적 순서와 관련이 있습니다."}, {"term": "Hofstadter-Hubbard Model", "why_emerged": "자기장 내 격자 구조에서 전자 이동과 상관관계 효과를 결합하여 양자 홀 효과와 Mott 절연체 물리 간의 관계를 분석하기 위해 만들어졌습니다.", "origin": "Douglas Hofstadter에 의해 1976년 제안되었습니다.", "connections": "모아레 격자, 양자 위상, 강한 상관계 시스템과 연결됩니다."}], "english_summary": ["Study of emergent U(1) gauge flux in magnetized triangular spin liquids.", "Explores interplay between orbital flux and Zeeman coupling in moiré systems.", "Identifies conditions for chiral spin liquid stabilization.", "Provides theoretical insight into spin ordering within Hofstadter-Hubbard models."]}}, {"title": "Full Minimal Coupling GW-Bethe-Salpeter-Equation Framework for Circular Dichroism in Solids: Applications to Chiral 2D Perovskites", "journal": "PRL_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/mdr9-tzws", "authors": "Xian Xu, Diana Y. Qiu", "last_authors": "Xian Xu, Diana Y. Qiu", "summary": "Circular dichroism (CD) and other chiroptical responses are key probes of both chirality and momentum-space geometry in solids, but first-principles calculations are still challenging in periodic systems with strong exciton effects. Here, we develop a gauge-invariant first-principles framework for C…", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "First-principles framework for circular dichroism in solids, relevant for chiral materials and spectroscopy.", "tags": ["theory", "methodology", "circulardichroism", "2Dmaterials"], "image": "", "briefing": {"background": "고체 물질에서 원편광 이색성(CD)과 같은 카이랄 광학 응답은 결정 구조의 카이랄성과 운동량 공간의 기하학적 특성을 파악하는 중요한 수단입니다. 그러나 고체 내 강한 엑시톤 효과를 고려한 제1원리 계산은 주기적 시스템에서의 게이지 불변성 문제로 인해 구현이 매우 어렵습니다.", "motivation": "기존의 방법론은 주기적 격자 시스템에서 게이지 불변성을 완벽히 유지하며 엑시톤 효과를 포함하는 데 한계가 있었습니다. 본 연구는 이러한 계산적 난제를 해결하여 복잡한 고체 물질의 광학적 카이랄성을 정확히 예측하는 프레임워크를 정립하고자 합니다.", "result": "최소 결합(Minimal Coupling)을 기반으로 한 게이지 불변 제1원리 GW-BSE(Bethe-Salpeter Equation) 프레임워크를 개발했습니다. 이를 통해 카이랄 2D 페로브스카이트 구조에서 엑시톤 효과가 반영된 CD 스펙트럼을 성공적으로 계산했습니다.", "implication": "이 프레임워크는 강한 상관관계나 엑시톤 효과가 지배적인 카이랄 고체 물질 연구에 필수적인 도구가 될 것입니다. 특히 CD-ARPES 데이터와 직접 비교하거나 해석할 때 이론적 토대를 제공합니다.", "novelty": "게이지 불변성을 완벽하게 보장하면서도 다체 섭동 이론(GW-BSE)을 CD 계산에 적용했다는 점이 핵심입니다. 이는 단순한 밴드 이론을 넘어 엑시톤 물리까지 포함해야 하는 현대 고체 물리학 연구에 큰 기여를 합니다.", "unresolved": "매우 큰 단위 세포를 갖는 복잡한 시스템으로의 확장성과 계산 비용 최적화 문제는 여전히 과제로 남아 있습니다.", "future_work": "본 프레임워크를 다른 카이랄 위상 물질이나 자기적 카이랄성을 띠는 2D 반데르발스 이 function render() {
  slideEl.replaceChildren();
  if (!slides.length) { slideEl.className = 'empty'; slideEl.textContent = 'No papers passed the filters in this run.'; counterEl.textContent = '0 / 0'; prevBtn.disabled = true; nextBtn.disabled = true; return; }
  slideEl.className = 'slide';
  const r = slides[index];
  const b = r.briefing || {};
  const head = document.createElement('div');
  head.className = 'paper-head';
  if (r.image) {
    const figure = document.createElement('figure');
    figure.className = 'figure';
    const img = document.createElement('img');
    img.src = r.image; img.alt = 'Figure or article preview image'; img.loading = 'lazy'; img.referrerPolicy = 'no-referrer'; img.onerror = () => figure.remove();
    figure.appendChild(img);
    figure.appendChild(textEl('figcaption', '', 'Figure / article preview image from the source page'));
    head.appendChild(figure);
  }
  const headText = document.createElement('div');
  headText.className = 'head-text';
  const badges = document.createElement('div');
  badges.className = 'badges';
  if (r.score) badges.appendChild(textEl('span', 'badge score', `${r.score}/10`));
  if (r.tier) badges.appendChild(textEl('span', 'badge', r.tier));
  if (r.journal) badges.appendChild(textEl('span', 'badge', r.journal));
  if (r.source) badges.appendChild(textEl('span', 'badge', r.source));
  headText.appendChild(badges);
  const title = document.createElement('h1');
  if (r.link) { const titleLink = document.createElement('a'); titleLink.href = r.link; titleLink.target = '_blank'; titleLink.rel = 'noopener noreferrer'; titleLink.textContent = r.title || ''; title.appendChild(titleLink); }
  else { title.textContent = r.title || ''; }
  headText.appendChild(title);
  headText.appendChild(textEl('p', 'meta', [r.journal, r.source].filter(Boolean).join(' | ')));
  if (r.last_authors || r.authors) { const authors = document.createElement('p'); authors.className = 'authors'; if (r.last_authors) authors.append('Last authors: ' + r.last_authors); if (r.authors) authors.append((r.last_authors ? ' | ' : '') + 'Authors: ' + r.authors); headText.appendChild(authors); }
  appendLabeledText(headText, 'why', 'Filter reason: ', r.reason);
  if (r.tags && r.tags.length) { const tags = document.createElement('div'); tags.className = 'tags'; r.tags.forEach(tag => tags.appendChild(textEl('span', 'tag', '#' + tag))); headText.appendChild(tags); }
  if (r.link) { const link = document.createElement('a'); link.className = 'link'; link.href = r.link; link.target = '_blank'; link.rel = 'noopener noreferrer'; link.textContent = 'Open paper'; headText.appendChild(link); }
  head.appendChild(headText);
  if (r.summary) { const abstract = document.createElement('p'); abstract.className = 'original-abstract'; const strong = textEl('strong', '', 'Original abstract'); abstract.appendChild(strong); abstract.append(r.summary); head.appendChild(abstract); }
  slideEl.appendChild(head);
  const briefing = document.createElement('div');
  briefing.className = 'briefing';
  appendBriefSection(briefing, 'Background', b.background);
  appendBriefSection(briefing, 'Motivation', b.motivation);
  appendBriefSection(briefing, 'Result', b.result);
  appendBriefSection(briefing, 'Implication', b.implication);
  appendBriefSection(briefing, "Why it's important / Novelty", b.novelty);
  appendBriefSection(briefing, 'Unresolved Questions', b.unresolved);
  appendBriefSection(briefing, 'Expected Future Work', b.future_work);
  if (b.concepts && b.concepts.length) {
    const section = document.createElement('section');
    section.className = 'brief-section wide';
    section.appendChild(textEl('h2', '', 'Concepts / Terms'));
    const concepts = document.createElement('div');
    concepts.className = 'concepts';
    b.concepts.forEach(c => {
      const item = document.createElement('div');
      item.className = 'concept';
      item.appendChild(textEl('h3', '', c.term || 'Concept'));
      [['왜 생겼나: ', c.why_emerged], ['누가 만들었나: ', c.origin], ['연결되는 흐름: ', c.connections]].forEach(([label, text]) => { if (!text) return; const p = document.createElement('p'); const bold = textEl('b', '', label); p.appendChild(bold); p.append(text); item.appendChild(p); });
      concepts.appendChild(item);
    });
    section.appendChild(concepts);
    briefing.appendChild(section);
  }
  if (b.english_summary && b.english_summary.length) { const section = document.createElement('section'); section.className = 'brief-section wide'; section.appendChild(textEl('h2', '', 'English Summary')); const ul = document.createElement('ul'); b.english_summary.slice(0, 5).forEach(line => ul.appendChild(textEl('li', '', line))); section.appendChild(ul); briefing.appendChild(section); }
  slideEl.appendChild(briefing);
  counterEl.textContent = `${index + 1} / ${slides.length}`;
  prevBtn.disabled = index === 0;
  nextBtn.disabled = index === slides.length - 1;
}
prevBtn.addEventListener('click', () => { index = Math.max(0, index - 1); render(); });
nextBtn.addEventListener('click', () => { index = Math.min(slides.length - 1, index + 1); render(); });
document.addEventListener('keydown', event => { if (event.key === 'ArrowLeft') prevBtn.click(); if (event.key === 'ArrowRight') nextBtn.click(); });
render();
</script>
</body>
</html>
