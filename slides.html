<title>Daily Paper Slideshow</title>
<style>
  :root {
    color-scheme: light;
    --bg: #f6f7f4;
    --paper: #ffffff;
    --ink: #111827;
    --muted: #64748b;
    --line: #d8ddd2;
    --accent: #176b87;
    --accent-2: #9a3412;
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; overflow: auto; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: var(--bg); color: var(--ink); }
  .shell { max-width: 1500px; min-height: 100vh; margin: 0 auto; padding: 14px 18px; display: flex; flex-direction: column; }
  .topbar { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 16px; }
  .top-actions { display: flex; align-items: center; gap: 10px; }
  .topbar a, button { border: 1px solid var(--line); border-radius: 8px; background: var(--paper); color: var(--ink); padding: 10px 14px; font-weight: 700; text-decoration: none; cursor: pointer; }
  button.primary { background: var(--accent); border-color: var(--accent); color: white; }
  button:disabled { opacity: 0.45; cursor: not-allowed; }
  .counter { color: var(--muted); font-weight: 700; }
  .slide { min-height: calc(100vh - 82px); background: var(--paper); border: 1px solid var(--line); border-radius: 10px; padding: 18px; box-shadow: 0 18px 42px rgba(15, 23, 42, 0.10); display: grid; grid-template-columns: minmax(310px, 0.86fr) minmax(0, 1.55fr); gap: 18px; overflow: visible; }
  .paper-head { min-width: 0; min-height: 0; overflow: visible; display: flex; flex-direction: column; gap: 12px; }
  .figure { margin: 0; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: #f8fafc; }
  .figure img { display: block; width: 100%; max-height: 41vh; object-fit: contain; background: white; }
  .figure figcaption { padding: 7px 10px; color: var(--muted); font-size: 12px; line-height: 1.3; }
  .head-text { display: flex; flex-direction: column; gap: 9px; min-width: 0; }
  .badges { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .badge { border-radius: 999px; padding: 5px 9px; background: #eef2ff; color: #3730a3; font-size: 12px; font-weight: 800; }
  .score { background: #fee2e2; color: #991b1b; }
  h1 { margin: 0; font-size: 25px; line-height: 1.15; letter-spacing: 0; overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
  h1 a { color: inherit; text-decoration-color: rgba(23, 107, 135, 0.35); text-decoration-thickness: 2px; text-underline-offset: 4px; }
  h1 a:hover { color: var(--accent); text-decoration-color: var(--accent); }
  .meta, .authors, .why, .abstract { font-size: 13px; line-height: 1.45; }
  .meta, .authors { color: var(--muted); }
  .why strong, .abstract strong, .authors strong { color: var(--ink); }
  .authors { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .why { border-left: 4px solid var(--accent-2); padding-left: 10px; color: #374151; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .abstract { border-top: 1px solid var(--line); padding-top: 14px; color: #374151; }
  .original-abstract { border-top: 1px solid var(--line); padding-top: 10px; color: #374151; font-size: 11.5px; line-height: 1.35; overflow-wrap: anywhere; }
  .original-abstract strong { display: block; margin-bottom: 4px; color: var(--ink); }
  .tags { display: flex; flex-wrap: wrap; gap: 8px; }
  .tag { border-radius: 999px; padding: 4px 8px; background: #f1f5f9; color: #475569; font-size: 12px; font-weight: 700; }
  .head-text > .link { display: none; }
  .briefing { min-width: 0; min-height: 0; overflow: visible; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); grid-auto-rows: minmax(0, auto); align-content: start; gap: 11px 18px; border-top: 0; padding-top: 0; }
  .brief-section { min-width: 0; }
  .brief-section.wide { grid-column: 1 / -1; }
  .brief-section h2 { margin: 0 0 4px; font-size: 14px; line-height: 1.22; color: #0f766e; letter-spacing: 0; }
  .brief-section p, .brief-section li { margin: 0; font-size: 12.5px; line-height: 1.42; color: #1f2937; overflow-wrap: anywhere; }
  .brief-section ul { margin: 0; padding-left: 20px; }
  .concepts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 9px 14px; }
  .concept { border-top: 1px solid var(--line); padding-top: 7px; }
  .concept h3 { margin: 0 0 4px; font-size: 13px; color: #7c2d12; letter-spacing: 0; }
  .concept p { margin: 2px 0 0; font-size: 11.5px; line-height: 1.35; color: #374151; overflow-wrap: anywhere; }
  .concept b { color: #111827; }
  .link { color: var(--accent); font-weight: 800; text-decoration: none; }
  .empty { padding: 48px; background: var(--paper); border: 1px solid var(--line); border-radius: 12px; color: var(--muted); }
  @media (max-width: 860px) {
    .shell { padding: 14px; }
    .topbar, .top-actions { align-items: stretch; flex-direction: column; }
    .slide, .briefing, .concepts { grid-template-columns: 1fr; }
    .slide { min-height: auto; overflow: visible; display: grid; }
    h1 { font-size: 28px; }
  }
</style>

<script>
const slides = [{"title": "Deep learning approach for ARPES and time-resolved ARPES: Gradient attention U-net for denoising and reconstruction", "journal": "PRB_Recent", "source": "keyword", "link": "http://link.aps.org/doi/10.1103/53wd-bg7k", "authors": "Gongyi Cheng, Ziyang Guo, Zhengcong Yan, et al.", "last_authors": "Shijing Tan, Bing Wang", "summary": "Data analysis in angle-resolved photoemission spectroscopy (ARPES) and time-resolved ARPES usually employs derivative-based methods, such as second derivative and maximum curvature, to enhance spectral visibility. Despite their widespread use, these methods are prone to noise amplification and the i…", "tier": "A_MUST_READ", "score": "10", "reason": "title strong match: ARPES", "tags": ["ARPES", "angle-resolvedphotoemission", "photoemission"], "image": "", "briefing": {"background": "ARPES 및 TR-ARPES 데이터 분석에서는 데이터의 노이즈를 제거하고 밴드 구조를 명확히 보기 위해 주로 2차 미분법(second derivative)이나 최대 곡률법(maximum curvature)을 사용합니다.", "motivation": "기존의 미분 기반 기법들은 데이터의 노이즈까지 증폭시키는 치명적인 단점이 있어, 더 정밀한 스펙트럼 재구성과 가시성 확보가 필요해졌습니다.", "result": "Gradient Attention U-net이라는 딥러닝 모델을 도입하여 ARPES 데이터의 노이즈 제거 및 밴드 구조 재구성 성능을 크게 향상시켰습니다.", "implication": "노이즈가 많은 실험 데이터에서 미세한 전자 구조 특징을 포착하는 데 기여하며, 특히 광전자 분광학 분석의 자동화와 정확도 향상을 가속화할 것입니다.", "novelty": "데이터 과학 기법(U-net)을 ARPES 분석에 최적화하여 전통적인 후처리 방식의 한계를 극복했습니다. ARPES 전문가에게는 데이터 분석 효율을 획기적으로 개선할 수 있는 도구입니다.", "unresolved": "딥러닝 학습 과정에서 발생하는 인위적인 아티팩트(artifact)가 미세한 밴드 물리 현상을 왜곡할 가능성에 대한 철저한 검증이 필요합니다.", "future_work": "다양한 물성 물질의 ARPES 데이터셋으로 모델을 고도화하고, 실험 데이터의 물리적 일관성을 보존하는 제약 조건 추가 연구가 예상됩니다.", "concepts": [{"term": "Gradient Attention U-net", "why_emerged": "이미지 처리에서 복잡한 피처를 추출하고 노이즈를 제거하기 위해 제안됨.", "origin": "의료 영상 분석 등에서 유래한 U-net 구조를 기반으로 함.", "connections": "이미지 세그멘테이션, 컨볼루션 신경망."}, {"term": "Maximum Curvature Method", "why_emerged": "ARPES 데이터에서 분산 관계(dispersion)를 시각적으로 두드러지게 하기 위해 개발됨.", "origin": "ARPES 초기 데이터 분석 방법론에서 정립됨.", "connections": "2차 미분법, 밴드 구조 추출."}], "english_summary": ["A Gradient Attention U-net model is proposed for denoising and reconstructing ARPES/TR-ARPES spectra.", "The method overcomes the signal-to-noise limitations of traditional derivative-based analysis.", "This approach enhances the visibility of electronic band structures in noisy experimental data.", "Deep learning is utilized to automate and improve the precision of spectroscopic data interpretation."]}}, {"title": "Unified First-Principles Formula for Time-Resolved ARPES Spectra of Coherent and Incoherent Excitons beyond the Dilute Limit", "journal": "PRL_Recent", "source": "keyword", "link": "http://link.aps.org/doi/10.1103/zhs1-rv1k", "authors": "Gianluca Stefanucci, Enrico Perfetto", "last_authors": "Gianluca Stefanucci, Enrico Perfetto", "summary": "Despite major experimental progresses in time-resolved and angle-resolved photoemission spectroscopy, a quantitative, microscopic framework for interpreting exciton-induced modifications of electronic band structures—applicable even beyond the low-density limit—is still lacking. Here, we close this gap by introducing a unified approach that links the dynamics of coherent and incoherent excitons to distinct and experimentally observable excitonic sidebands. Our central result is a general, first-principles formula for time-resolved photoemission spectra, applicable across a broad range of temperatures, excitation densities, and pump-probe delays. This advance provides a predictive tool for quantitatively tracking excitonic dynamics in complex materials.", "tier": "A_MUST_READ", "score": "10", "reason": "title strong match: ARPES", "tags": ["ARPES", "angle-resolvedphotoemission", "photoemission", "bandstructure"], "image": "", "briefing": {"background": "시간 분해 광전자 분광학(TR-ARPES)은 여기 상태의 전자 구조를 연구하는 강력한 도구이지만, 엑시톤이 포함된 복잡한 다체 물리 현상을 정량적으로 해석하는 이론적 틀은 미비했습니다.", "motivation": "기존의 저밀도 근사를 넘어서는, 엑시톤이 존재하는 강상관 전자계에서 밴드 구조 변화를 예측할 수 있는 통합적인 제1원리 공식이 필요했습니다.", "result": "coherent 엑시톤과 incoherent 엑시톤의 역학을 기술하고, 이것이 관측 가능한 엑시톤 사이드밴드(sideband necessitate alternative interconnect materials with lower electrical resistivity at reduced dimensions. We report the synthesis of Weyl semimetal niobium arsenide (NbAs) nanowires through thermomechanical nanomolding with single crystallinity and controlled diameters down to 40 nanometers. The resistivity of NbAs nanowires decreases with decreasing diameter, and 40-nanometer-diameter nanowires exhibited a room-temperature resistivity of 10.5 ± 1.9 microhm·centimeters, which is ~70% lower than their bulk counterpart. Calculations attribute this resistivity reduction to surface-dominant conduction with a long carrier lifetime at finite temperatures. Further characterization of nanowires and bulk crystals revealed high breakdown current density, stability, and thermal conductivity. These properties highlight the potential of NbAs nanowires as next-generation interconnects that could surpass the limitations of current copper-based interconnects.", "tier": "B_IMPORTANT_CONDMAT", "score": "9", "reason": "Experimental study of transport in a Weyl semimetal, a key topological material class.", "tags": ["transport", "Weylsemimetal", "topologicalmaterial"], "image": "", "briefing": {"background": "반도체 소자의 미세화가 진행됨에 따라 기존 구리 배선의 저항이 증가하는 배선 저항 문제가 심각해지고 있습니다. 이를 해결하기 위해 저차원 물질에서의 표면 전도 특성을 활용한 새로운 차세대 상호 연결 물질 연구가 활발합니다.", "motivation": "Weyl 반금속인 NbAs의 높은 이동도와 토폴로지 특성이 나노선 구조에서도 유지되어, 크기가 줄어들수록 오히려 저항이 낮아지는 특성을 통해 차세대 배선 물질로서의 가능성을 입증하고자 함.", "result": "직경 40nm의 NbAs 나노선을 합성하였으며, 벌크 대비 약 70% 낮은 저항을 확인했습니다. 이는 표면 지배적인 전도 현상과 긴 캐리어 수명 덕분이며, 열적 안정성과 고전류 밀도 특성 또한 우수함을 보였습니다.", "implication": "토폴로지 물질인 Weyl 반금속이 실제 전자 소자 배선 기술에 적용될 수 있는 강력한 후보임을 제시하며, 2차원/저차원 토폴로지 물질 기반 소자 설계에 중요한 레퍼런스가 될 것입니다.", "novelty": "기존 구리 배선의 물리적 한계를 토폴로지 물질의 표면 상태(Surface State) 활용으로 극복했다는 점이 핵심이며, 나노 단위 정밀 공정을 통한 물성 제어 기술이 돋보입니다.", "unresolved": "실제 상용화 공정 과정에서의 복잡한 회로 연결 시의 토폴로지 보호 상태 유지 여부와 금속 접합부에서의 저항 제어 문제가 남아있습니다.", "future_work": "실제 소자 아키텍처에 NbAs 나노선을 통합하여 전류-전압 특성 및 장기 신뢰성 테스트, 대면적 합성 공정 최적화가 필요합니다.", "concepts": [{"term": "Weyl 반금속", "why_emerged": "에너지 띠 구조에서 Weyl 점(Weyl node)을 가지며 위상적으로 보호된 전도 상태를 제공하기 위해.", "origin": "2011년 Wan 등에 의해 이론적 예측, 2015년 TaAs 등에서 실험적 관측.", "connections": "Berry 곡률, 비정형 홀 효과, 위상 절연체와 밀접."}, {"term": "표면 지배적 전도(Surface-dominant conduction)", "why_emerged": "나노 구조에서 부피 대비 표면적 비율이 커질 때 표면 상태가 전체 전기 전도 특성을 지배하기 때문.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "토폴로지 절연체, 양자 구속 효과."}], "english_summary": ["NbAs Weyl semimetal nanowires were synthesized with diameters down to 40 nm.", "The nanowires show decreasing resistivity with decreasing diameter, contrary to traditional metallic interconnects.", "Surface-dominant conduction contributes to a 70% reduction in resistivity compared to bulk.", "NbAs demonstrates high thermal stability and current density, suggesting potential for next-generation interconnects."]}}, {"title": "Dirac magnons in a thin elemental itinerant ferromagnet", "journal": "Science_Advances", "source": "Gemini", "link": "https://www.science.org/doi/abs/10.1126/sciadv.aed9835?af=R", "authors": "Khalil Zakeri, Christopher Hins, Robin R. Neumann, Alexander Mook, Arthur Ernst", "last_authors": "Alexander Mook, Arthur Ernst", "summary": "A distinct difference between graphene—an atomic layer of carbon—and conventional semiconductors is that its electrons behave as massless Dirac fermions, giving rise to unprecedented physical properties. Magnetically ordered solids host magnons, quasiparticles associated with magnetic degrees of freedom. While Dirac magnons have recently been predicted in specific insulating or rare-earth magnets, their existence in thin 3d magnets remains elusive because of the complex nature of itinerant magnetism and dimensionality effects. Here, we demonstrate the presence of Dirac magnons in a thin itinerant elemental ferromagnet. By investigating atomically designed hexagonal close-packed cobalt films, we establish that magnons in such structures resemble the Dirac electrons in graphene. ma Chanda, Simrandeep Kaur, Harsimran Singh, et al.", "last_authors": "Ajit C. Balram, Aveek Bid", "summary": "Even-denominator fractional quantum Hall states at half-filling are of particular interest because they can host non-Abelian quasiparticles. Here, we report the emergence of such states in the zeroth Landau level ($N=0$) of ABA trilayer graphene (TLG), challenging the conventional expectation that t…", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Experimental observation of fractional quantum Hall states in trilayer graphene.", "tags": ["graphene", "fractionalquantumHall", "2Dmaterials", "experimental"], "image": "", "briefing": {"background": "분수 양자 홀 효과(FQHE)는 강한 자기장 하에서 2차원 전자계가 나타내는 다체 상태로, 특히 분모가 짝수인 상태는 비아벨(non-Abelian) 통계를 따르는 준입자를 포함할 가능성 때문에 위상 양자 컴퓨터의 핵심 후보로 연구됩니다.", "motivation": "일반적으로 FQHE는 특정 Landau 준위에서 관찰되는데, ABA 적층 삼중층 그래핀(TLG)이라는 독특한 밴드 구조를 가진 시스템에서 이러한 짝수 분모 상태가 어떻게 형성되는지 규명하고자 합니다.", "result": "ABA 삼중층 그래핀의 N=0 란다우 준위에서 짝수 분모 분수 양자 홀 상태를 실험적으로 확인했습니다. 이는 기존의 이론적 예상과 다른 결과로, 그래핀의 층간 결합과 대칭성이 이 상태의 형성에 기여함을 시사합니다.", "implication": "그래핀 기반 플랫폼이 비아벨 상태를 연구하고 제어하기 위한 새로운 유연한 실험실이 될 수 있음을 의미합니다.", "novelty": "복잡한 위상학적 상태가 비교적 단순한 2D 재료 플랫폼인 삼중층 그래핀에서 발현됨을 보였으며, 이는 기존의 GaAs 기반 시스템을 넘어선 새로운 위상 물성 연구의 가능성을 제시합니다.", "unresolved": "관찰된 상태의 구체적인 준입자 통계나 비아벨 특성에 대한 직접적인 실험적 증명은 아직 미비합니다.", "future_work": "관찰된 상태의 전하 및 통계적 성질을 확인하기 위한 간섭계 실험이나 국소적 도핑 조절 연구가 필요합니다.", "concepts": [{"term": "분수 양자 홀 효과", "why_emerged": "강한 자기장과 강한 전자 상관관계에 의해 정수배 이외의 홀 전도도가 나타나는 현상을 설명하기 위해 필요했습니다.", "origin": "Tsui, Stormer, Gossard에 의해 1982년 발견되었으며 Laughlin 이론이 정립했습니다.", "connections": "토폴로지 위상 부도체, 비아벨 통계, 양자 컴퓨팅 연구와 연결됩니다."}, {"term": "비아벨 준입자", "why_emerged": "입자의 교환이 단순히 위상 변화가 아닌 행렬 연산으로 나타나는 상태를 기술하기 위해 도입되었습니다.", "origin": "Moore와 Read에 의해 제안되었습니다.", "connections": "토폴로지 양자 컴퓨팅의 핵심 자원으로, 짝수 분모 FQHE 상태에서 발현될 것으로 기대됩니다."}], "english_summary": ["Experimental observation of even-denominator FQHE in ABA trilayer graphene.", "The states appear in the N=0 La   appendBriefSection(briefing, 'Implication', b.implication);
  appendBriefSection(briefing, "Why it's important / Novelty", b.novelty);
  appendBriefSection(briefing, 'Unresolved Questions', b.unresolved);
  appendBriefSection(briefing, 'Expected Future Work', b.future_work);
  if (b.concepts && b.concepts.length) {
    const section = document.createElement('section');
    section.className = 'brief-section wide';
    section.appendChild(textEl('h2', '', 'Concepts / Terms'));
    const concepts = document.createElement('div');
    concepts.className = 'concepts';
    b.concepts.forEach(c => {
      const item = document.createElement('div');
      item.className = 'concept';
      item.appendChild(textEl('h3', '', c.term || 'Concept'));
      [['왜 생겼나: ', c.why_emerged], ['누가 만들었나: ', c.origin], ['연결되는 흐름: ', c.connections]].forEach(([label, text]) => { if (!text) return; const p = document.createElement('p'); const bold = textEl('b', '', label); p.appendChild(bold); p.append(text); item.appendChild(p); });
      concepts.appendChild(item);
    });
    section.appendChild(concepts);
    briefing.appendChild(section);
  }
  if (b.english_summary && b.english_summary.length) { const section = document.createElement('section'); section.className = 'brief-section wide'; section.appendChild(textEl('h2', '', 'English Summary')); const ul = document.createElement('ul'); b.english_summary.slice(0, 5).forEach(line => ul.appendChild(textEl('li', '', line))); section.appendChild(ul); briefing.appendChild(section); }
  slideEl.appendChild(briefing);
  counterEl.textContent = `${index + 1} / ${slides.length}`;
  prevBtn.disabled = index === 0;
  nextBtn.disabled = index === slides.length - 1;
}
prevBtn.addEventListener('click', () => { index = Math.max(0, index - 1); render(); });
nextBtn.addEventListener('click', () => { index = Math.min(slides.length - 1, index + 1); render(); });
document.addEventListener('keydown', event => { if (event.key === 'ArrowLeft') prevBtn.click(); if (event.key === 'ArrowRight') nextBtn.click(); });
render();
</script>
</body>
</html>
