<title>Daily Paper Slideshow</title>
<style>
  :root {
    color-scheme: light;
    --bg: #f6f7f4;
    --paper: #ffffff;
    --ink: #111827;
    --muted: #64748b;
    --line: #d8ddd2;
    --accent: #176b87;
    --accent-2: #9a3412;
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; overflow: auto; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: var(--bg); color: var(--ink); }
  .shell { max-width: 1500px; min-height: 100vh; margin: 0 auto; padding: 14px 18px; display: flex; flex-direction: column; }
  .topbar { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 16px; }
  .top-actions { display: flex; align-items: center; gap: 10px; }
  .topbar a, button { border: 1px solid var(--line); border-radius: 8px; background: var(--paper); color: var(--ink); padding: 10px 14px; font-weight: 700; text-decoration: none; cursor: pointer; }
  button.primary { background: var(--accent); border-color: var(--accent); color: white; }
  button:disabled { opacity: 0.45; cursor: not-allowed; }
  .counter { color: var(--muted); font-weight: 700; }
  .slide { min-height: calc(100vh - 82px); background: var(--paper); border: 1px solid var(--line); border-radius: 10px; padding: 18px; box-shadow: 0 18px 42px rgba(15, 23, 42, 0.10); display: grid; grid-template-columns: minmax(310px, 0.86fr) minmax(0, 1.55fr); gap: 18px; overflow: visible; }
  .paper-head { min-width: 0; min-height: 0; overflow: visible; display: flex; flex-direction: column; gap: 12px; }
  .figure { margin: 0; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: #f8fafc; }
  .figure img { display: block; width: 100%; max-height: 41vh; object-fit: contain; background: white; }
  .figure figcaption { padding: 7px 10px; color: var(--muted); font-size: 12px; line-height: 1.3; }
  .head-text { display: flex; flex-direction: column; gap: 9px; min-width: 0; }
  .badges { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .badge { border-radius: 999px; padding: 5px 9px; background: #eef2ff; color: #3730a3; font-size: 12px; font-weight: 800; }
  .score { background: #fee2e2; color: #991b1b; }
  h1 { margin: 0; font-size: 25px; line-height: 1.15; letter-spacing: 0; overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
  h1 a { color: inherit; text-decoration-color: rgba(23, 107, 135, 0.35); text-decoration-thickness: 2px; text-underline-offset: 4px; }
  h1 a:hover { color: var(--accent); text-decoration-color: var(--accent); }
  .meta, .authors, .why, .abstract { font-size: 13px; line-height: 1.45; }
  .meta, .authors { color: var(--muted); }
  .why strong, .abstract strong, .authors strong { color: var(--ink); }
  .authors { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .why { border-left: 4px solid var(--accent-2); padding-left: 10px; color: #374151; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .abstract { border-top: 1px solid var(--line); padding-top: 14px; color: #374151; }
  .original-abstract { border-top: 1px solid var(--line); padding-top: 10px; color: #374151; font-size: 11.5px; line-height: 1.35; overflow-wrap: anywhere; }
  .original-abstract strong { display: block; margin-bottom: 4px; color: var(--ink); }
  .tags { display: flex; flex-wrap: wrap; gap: 8px; }
  .tag { border-radius: 999px; padding: 4px 8px; background: #f1f5f9; color: #475569; font-size: 12px; font-weight: 700; }
  .head-text > .link { display: none; }
  .briefing { min-width: 0; min-height: 0; overflow: visible; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); grid-auto-rows: minmax(0, auto); align-content: start; gap: 11px 18px; border-top: 0; padding-top: 0; }
  .brief-section { min-width: 0; }
  .brief-section.wide { grid-column: 1 / -1; }
  .brief-section h2 { margin: 0 0 4px; font-size: 14px; line-height: 1.22; color: #0f766e; letter-spacing: 0; }
  .brief-section p, .brief-section li { margin: 0; font-size: 12.5px; line-height: 1.42; color: #1f2937; overflow-wrap: anywhere; }
  .brief-section ul { margin: 0; padding-left: 20px; }
  .concepts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 9px 14px; }
  .concept { border-top: 1px solid var(--line); padding-top: 7px; }
  .concept h3 { margin: 0 0 4px; font-size: 13px; color: #7c2d12; letter-spacing: 0; }
  .concept p { margin: 2px 0 0; font-size: 11.5px; line-height: 1.35; color: #374151; overflow-wrap: anywhere; }
  .concept b { color: #111827; }
  .link { color: var(--accent); font-weight: 800; text-decoration: none; }
  .empty { padding: 48px; background: var(--paper); border: 1px solid var(--line); border-radius: 12px; color: var(--muted); }
  @media (max-width: 860px) {
    .shell { padding: 14px; }
    .topbar, .top-actions { align-items: stretch; flex-direction: column; }
    .slide, .briefing, .concepts { grid-template-columns: 1fr; }
    .slide { min-height: auto; overflow: visible; display: grid; }
    h1 { font-size: 28px; }
  }
</style>

<script>
const slides = [{"title": "Direct Visualization of Gate-Tunable Flat Bands in Twisted Double Bilayer Graphene", "journal": "PRL_Recent", "source": "author whitelist", "link": "http://link.aps.org/doi/10.1103/3vg5-vkzy", "authors": "Souvik Sasmal, Ryan Muzzio, Ahmed Khalifa, et al.", "last_authors": "Shubhayu Chatterjee, Jyoti Katoch", "summary": "Author(s): Souvik Sasmal, Ryan Muzzio, Ahmed Khalifa, Paulina Majchrzak, Alfred J. H. Jones, I-Hsuan Kao, Kenji Watanabe, Takashi Taniguchi, Simranjeet Singh, Eli Rotenberg, Aaron Bostwick, Chris Jozwiak, Søren Ulstrup, Shubhayu Chatterjee, and Jyoti Katoch The evolution of moiré minibands under varying carrier density and displacement field may be directly visualized using microfocused angle-resolved photoemission spectroscopy. [Phys. Rev. Lett. 137, 016402] Published Tue Jun 30, 2026", "tier": "A_MUST_READ", "score": "10", "reason": "author whitelist: Eli Rotenberg", "tags": ["angle-resolvedphotoemission", "photoemission", "graphene", "moir", "twisted", "flatband"], "image": "", "briefing": {"background": "트위스트 2차원 물질계(Moiré systems)에서 나타나는 플랫 밴드(flat band)는 전자 간의 강한 상관관계를 유도하여 초전도성이나 절연체 상태와 같은 다양한 양자 현상을 만들어냅니다. 특히 비틀린 이중 층 그래핀(TDBG)은 변위장(displacement field)과 게이팅을 통해 전자 구조를 정밀하게 조절할 수 있어 물리적 관심도가 매우 높습니다.", "motivation": "TDBG에서 모아레 미니밴드가 캐리어 밀도와 변위장에 따라 어떻게 진화하는지 이론적으로는 예측되었으나, 샘플 크기의 한계와 복잡성으로 인해 각도분해 광전자 분광법(ARPES)을 이용한 직접적인 공간 및 에너지 분해 관찰은 매우 도전적인 과제였습니다.", "result": "본 연구는 마이크로 포커스 ARPES(micro-ARPES)를 활용하여 TDBG의 게이트 조절에 따른 플랫 밴드 진화를 직접 시각화했습니다. 특히 수직 전기장에 의한 밴드 갭(band gap) 개방과 미니밴드 구조의 변화를 에너지-운동량 공간에서 선명하게 입증했습니다.", "implication": "TDBG에서 외부 전장을 통해 밴드 구조를 설계(Band engineering)할 수 있음을 직접적으로 증명함으로써, 향후 상관 전자계 현상을 제어하는 새로운 소자 설계의 기초를 제공합니다. 또한 이론적 모델의 정확성을 실험적으로 검증하는 중요한 데이터 포인트를 제시했습니다.", "novelty": "Eli Rotenberg와 Aaron Bostwick 등 ARPES 분야의 거장들이 참여한 연구로, 나노/마이크로 스케일의 ARPES 기술을 사용하여 게이트 인가 상태의 소자를 직접 측정했다는 점이 핵심입니다. 독자의 관심사인 ARPES 및 모아레 시스템의 전자 구조와 직결됩니다.", "unresolved": "플랫 밴드 내에서 발생하는 다체 효과(many-body effects)나 대칭성 파괴 상태(symmetry-breaking states)가 실제 측정된 단일 입자 스펙트럼 함수에 구체적으로 어떤 세부 구조를 남기는지에 대한 추가 연구가 필요합니다.", "future_work": "향후 연구에서는 더욱 정밀한 게이팅을 통해 다양한 정수 충전(integer filling) 상태에서의 전자 구조 변화를 관찰하고, 이를 통해 토폴로지컬 절연 상태와의 연결 고리를 찾을 것으로 예상됩니다.", "concepts": [{"term": "플랫 밴드 (Flat Bands)", "why_emerged": "밴드의 곡률이 거의 없어 전자의 유효 질량이 매우 커지고, 운동 에너지보다 전자 간 상호작용이 우세해지는 상황을 설명하기 위해 등장했습니다.", "origin": "초록 정보만으로는 특정하기 어려우나, 모아레 시스템에서는 2011년 MacDonald 등이 이론적으로 제안했습니다.", "connections": "강상관 계, 모트 절연체, 마법 각도 그래핀(MATBG)."}, {"term": "Micro-ARPES", "why_emerged": "수 마이크로미터 크기의 작은 박리된 시료나 불균일한 샘플의 국소적인 전자 구조를 측정하기 위해 광원을 작게 집속하는 기술이 필요해졌습니다.", "origin": "ALS(Advanced Light Source) 등 전 세계 주요 방사광 가속기 시설에서 주도적으로 개발되었습니다.", "connections": "Nano-ARPES, 메조스코픽 물리, 2D 물질 헤테로구조."}, {"term": "TDBG (Twisted Double Bilayer Graphene)", "why_emerged": "단일 층 비틀림 구조(MATBG)보다 변위장을 통한 대칭성 조절 및 밴드 구조 튜닝이 용이하다는 장점 때문에 연구되기 시작했습니다.", "origin": "2019-2020년경 여러 그룹에서 독립적으로 연구를 시작했습니다.", "connections": "변위장(Displacement field), 밴드 갭 튜닝, 상관 절연체."}, {"term": "모아레 미니밴드 (Moiré Minibands)", "why_emerged": "두 층의 격자가 겹쳐지며 생기는 긴 주기성을 가진 모아레 패턴이 새로운 브릴루앙 영역을 형성하며 생기는 밴드 구조를 설명하기 위해 도입되었습니다.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "슈퍼래티스(Superlattice), 폴딩(Folding), 밴드 평탄화."}], "english_summary": ["Directly visualized gate-tunable flat bands in TDBG using micro-focused ARPES.", "Demonstrated the evolution of moiré minibands under varying displacement fields and carrier densities.", "Provided experimental verification of theoretically predicted band engineering in moiré systems.", "Key contribution to understanding correlated electronic states in twisted graphene heterostructures."]}}, {"title": "Robust topological surface states in skyrmion-host magnets Eu(Ga,Al)4: Evidence for dual topology", "journal": "PRB_Recent", "source": "author whitelist", "link": "http://link.aps.org/doi/10.1103/5hbm-g33v", "authors": "Yuki Arai, Kosuke Nakayama, Takemi Kato, et al.", "last_authors": "Kouji Segawa, Takafumi Sato", "summary": "Author(s): Yuki Arai, Kosuke Nakayama, Takemi Kato, Tomonori Nakamura, Asuka Honma, Seigo Souma, Kenichi Ozawa, Kiyohisa Tanaka, Daisuke Shiga, Hiroshi Kumigashira, Yoshinori Okada, Kouji Segawa, and Takafumi Sato The interplay between real-space topology such as magnetic skyrmions and momentum-space topology characterized by topological surface states (TSSs) is predicted to realize novel phenomena and functionalities, yet materials hosting both topologies are scarce. Skyrmion-hosting helimagnet family ${\\mat… [Phys. Rev. B 114, L020402] Published Tue Jul 07, 2026", "tier": "A_MUST_READ", "score": "9", "reason": "author whitelist: Daisuke Shiga", "tags": ["topological"], "image": "", "briefing": {"background": "실공간의 위상 구조인 스커미온(skyrmion)과 운동량 공간의 위상 구조인 위상 표면 상태(TSS)는 각각 독특한 물리적 특성을 가집니다. 이 두 가지 위상 특성이 한 물질에 공존하는 '이중 위상(dual topology)' 물질은 새로운 양자 현상을 탐구하기 위한 이상적인 플랫폼으로 여겨집니다.", "motivation": "Eu(Ga,Al)4는 스커미온을 호스팅하는 것으로 알려진 자성체이지만, 이 물질이 운동량 공간에서도 위상학적으로 자명하지 않은(topologically non-trivial) 밴드 구조를 가졌는지, 즉 TSS를 보유하고 있는지는 명확히 밝혀지지 않았습니다.", "result": "ARPES 측정을 통해 Eu(Ga,Al)4에서 견고한 위상 표면 상태(TSS)를 관찰하는 데 성공했습니다. 이는 이 물질이 실공간의 스커미온과 운동량 공간의 위상 밴드 구조를 동시에 갖는 이중 위상 물질임을 입증하는 강력한 증거입니다.", "implication": "스커미온과 위상 전자가 상호작용할 수 있는 장이 마련됨에 따라, 스커미온에 의한 위상 홀 효과나 스핀-궤도 토크 제어 등 자성과 토폴로지가 결합된 차세대 스핀트로닉스 연구에 중요한 기여를 할 것입니다.", "novelty": "스커미온 호스트 자성체에서 TSS의 존재를 명확히 규명함으로써, 자성 토폴로지컬 물질 후보군을 확장했습니다. 특히 ARPES 분야의 권위자인 Takafumi Sato 그룹의 연구라는 점에서 신뢰도가 높으며 독자의 주요 관심사인 위상 자성체 및 ARPES와 밀접합니다.", "unresolved": "자성 정렬 온도 이하에서 스커미온 상이 형성될 때 TSS가 구체적으로 어떻게 변조되는지, 그리고 그 사이의 결합 강도가 어느 정도인지에 대한 직접적인 실험적 정량화가 남아있습니다.", "future_work": "저온 및 외부 자기장 하에서의 고해상도 ARPES 측정을 통해 스커미온 격자와 TSS 간의 상호작용을 직접 관찰하고, 수송 특성 분석을 통해 위상적 물리량을 측정할 것으로 보입니다.", "concepts": [{"term": "스커미온 (Skyrmions)", "why_emerged": "자성체 내에서 소용돌이 형태의 국소적인 스핀 구조를 가지며 입자처럼 거동하는 위상적 안정성을 설명하기 위해 제안되었습니다.", "origin": "Tony Skyrme (1962, 핵물리학), 이후 자성체에서는 2000년대 후반 이론적/실험적 확립.", "connections": "토폴로지컬 홀 효과, 비공선형 자성, 스핀트로닉스 메모리."}, {"term": "위상 표면 상태 (Topological Surface States, TSS)", "why_emerged": "벌크와 표면의 위상적 차이로 인해 표면에서만 나타나는 산란에 강한 금속성 상태를 설명하기 위해 도입되었습니다.", "origin": "Kane & Mele, Bernevig 외 (2005-2006).", "connections": "위상 절연체, 디락 페르미온, 스핀-궤도 결합."}, {"term": "이중 위상 (Dual Topology)", "why_emerged": "실공간(자기 구조)과 운동량 공간(밴드 구조)의 위상적 특징이 결합된 시너지를 활용하기 위해 정의된 개념입니다.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "자성 위상 절연체, 스커미온-전자 상호작용."}, {"term": "Eu(Ga,Al)4", "why_emerged": "강한 스핀-궤도 결합과 자성 구조를 동시에 가져 스커미온 격자를 형성할 수 있는 희토류 기반 금속간 화합물 계열로 주목받았습니다.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "자성 헬리마그넷, 스커미온 호스트 물질."}], "english_summary": ["Identified robust topological surface states (TSS) in the skyrmion-host magnet Eu(Ga,Al)4 using ARPES.", "Provided experimental evidence for dual topology, combining real-space (skyrmion) and momentum-space (TSS) invariants.", "Established Eu(Ga,Al)4 as a promising platform for studying the interplay between magnetism and topology.", "Highlighted the potential for novel functionalities derived from the coupling of magnetic textures and topological electrons."]}}, {"title": "Strain-tuned orbital-dependent electronic correlations in FeTe thin films", "journal": "PRB_Recent", "source": "author whitelist", "link": "http://link.aps.org/doi/10.1103/xffv-kpjp", "authors": "Hyunjee Song, Sangjae Lee, Keun-Yeol Park, et al.", "last_authors": "Younsik Kim, Changyoung Kim", "summary": "Author(s): Hyunjee Song, Sangjae Lee, Keun-Yeol Park, Jaehyun Park, Suyoung Lee, Yeonjae Lee, Jinyoung Kim, Jaeung Lee, Celesta S. Chang, Younsik Kim, and Changyoung Kim Iron chalcogenides exhibit rich phenomena which are governed by orbital-dependent electronic interactions and strong electronic correlation. In particular, many studies have explored orbital selectivity in FeTe through Se doping. Here, applying tensile strain to thin films allows us to precisely con… [Phys. Rev. B 114, 045103] Published Mon Jul 06, 2026", "tier": "A_MUST_READ", "score": "9", "reason": "author whitelist: Changyou cture in LaSr2Mn2O7 revealed by micro-focused angle-resolved photoemission spectroscopy and tight-binding models (Journal of the Physical Society of Japan)", "journal": "arXiv_CondMat", "source": "keyword", "link": "https://arxiv.org/abs/2607.05949", "authors": "Yasutaka Sawata, Yudai Hirai, Rintaro Miyabayashi, et al.", "last_authors": "Noriaki Hamada, Tomohiko Saitoh", "summary": "arXiv:2607.05949v1 Announce Type: new Abstract: We have investigated the electronic structure of LaSr$_2$Mn$_2$O$_7$ in the CE-type antiferromagnetic (CE-AFM) state below the N\\'eel temperature using micro-focused angle-resolved photoemission spectroscopy ($\\mu$-ARPES) and tight-binding models. In agreement with the tight-binding calculations, we found a dispersive intensity around the X point in the $\\mu$-ARPES spectra, where the A-type antiferromagnetic (A-AFM) phase has no bands experimentally and theoretically, demonstrating that we have successfully captured the signatures of the CE-AFM band structure for the first time. Many observed features can be explained by the CE-AFM tight-binding bands, although some of them and the overall near-Fermi level intensity mapping can be explained by the A-AFM band structure. This indicates that the CE-AFM domain size would be no larger than the beam footprint size of a $\\sim\\!20$~{\\textmu}m scale.", "tier": "A_MUST_READ", "score": "9", "reason": "title strong match: angle-resolved photoemission", "tags": ["ARPES", "angle-resolvedphotoemission", "photoemission", "ferromagnet", "antiferromagnet", "bandstructure"], "image": "https://arxiv.org/html/2607.05949v1/x1.png", "briefing": {"background": "망간 산화물은 복잡한 자기 구조(AFM)와 전도성이 얽혀 있어, CE-type AFM 상태와 같은 상전이에서의 전자 구조 변화를 관찰하는 것이 중요함.", "motivation": "LaSr2Mn2O7의 CE-AFM 상태에서 전자 구조를 마이크로 ARPES로 분석하여, 기존의 tight-binding 모델과 비교 검증하고자 함.", "result": "CE-AFM 상태에 특이적인 dispersive 밴드를 X 포인트 주변에서 관측하였으며, 이는 A-AFM에서는 나타나지 않는 특징임.", "implication": "마이크로-ARPES를 통해 도메인 크기와 밴드 구조 간의 관계를 규명하여, 상분리된 전자 상태를 이해하는 새로운 _Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/v8yz-2vp5", "authors": "Xuan Zou, Rafael M. Fernandes, Eduardo Fradkin", "last_authors": "Rafael M. Fernandes, Eduardo Fradkin", "summary": "Author(s): Xuan Zou, Rafael M. Fernandes, and Eduardo Fradkin Metallic altermagnets offer a new setting for unconventional superconductivity because their Fermi surfaces are spin split despite vanishing net magnetization. Here, the authors show that equal-spin multicomponent p -wave pairing gives rise to multiple superconducting transitions and intertwined superconducting phases driven by subleading normal-state instabilities. They further demonstrate that fluctuations of competing electronic orders fundamentally reshape the superconducting state: nematic fluctuations stabilize nematic superconductivity, whereas spin loop-current fluctuations select chiral phases, revealing routes toward both nematic and topological superconductivity. [Phys. Rev. B 114, 014504] Published Mon Jul 06, 2026", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Directly addresses altermagnetism and loop-current fluctuations, themes highly relevant to the user's research.", "tags": ["altermagnet", "nematicity", "superconductivity"], "image": "", "briefing": {"background": "Altermagnetism은 순 자화(net magnetization)는 0이지만 스핀-궤도 결합 없이도 페르미 표면이 스핀 분할되는 새로운 자기 상태로, 기존 강자성체나 반강자성체와 차별화된 물리적 현상을 연구하는 분야입니다.", "motivation": "이 논문은 altermagnet에서 발생할 수 있는 비전통적 초전도성의 기원을 규명하고, 특히 스핀 분할된 페르미 표면이 초전도 질서 변수(pairing symmetry) 형성에 미치는 영향을 이론적으로 체계화하고자 합니다.", "result": "동일 스핀 다성분 p-파 초전도성이 다중 초전도 상전이를 유도함을 보였으며, 네마틱 변동은 네마틱 초전도성을, 스핀 루프 전류 변동은 카이랄(chiral) 초전도 위상을 선택한다는 점을 밝혔습니다.", "implication": "Altermagnet 물질이 위상 초전도체나 네마틱 초전도체로 변모할 수 있는 구체적인 메커니즘을 제시함으로써 향후 관련 신물질 탐색의 이론적 가이드라인을 제공합니다.", "novelty": "기존 AV3Sb5 등에서 논의되는 루프 전류나 네마틱성과 altermagnetism을 결합하여, 강한 상관관계 시스템에서의 초전도 상태를 미시적으로 연결했다는 점에서 독창적입니다.", "unresolved": "실제 altermagnet 화합물에서의 구체적인 상호작용 세기 및 실험적으로 이러한 변동들을 어떻게 분리하여 측정할지에 대한 구체적 실험 uctivity)의 물리적 근거를 찾고자 합니다.", "result": "터널링 분광학을 통해 다중 밴드 기여를 분리해내어, 이들이 단순히 하나의 갭이 아닌 두 밴드의 초전도성을 가진다는 것을 증명했습니다.", "implication": "단순하게 단일 갭으로 해석되던 기존의 관점을 수정해야 하며, 다중 밴드 효과가 박막 초전도성에 미치는 결정적 영향을 강조합니다.", "novelty": "전통적인 TMD 초전도체의 미시적 성질을 정밀 분광학(STS)으로 재검증하여, 숨겨진 밴드 물리적 특성을 드러냈다는 점에서 중요합니다.", "unresolved": "두 밴드 간의 결합 세기(coupling strength)가 박막의 두께에 따라 어떻게 변하는지에 대한 정밀한 분석이 추가로 필요합니다.", "future_work": "더 얇은 단층(monolayer) 극한에서의 밴드 구조와 초전도성 변화에 대한 후속 연구가 예상됩니다.", "concepts": [{"term": "Two-Band Superconductivity", "why_emerged": "여러 페르미 표면이 초전도에 동시에 기여할 때 단일 갭 모델의 한계를 극복하기 위해.", "origin": "Suhl, Matthias, and Walker (1959년).", "connections": "MgB2, 다중 갭 초전도체."}, {"term": "Transition Metal Dichalcogenides (TMD)", "why_emerged": "전이 금속과 칼코겐 원자로 이루어진 2차원 적층 구조의 풍부한 위상/전자적 물성 연구를 위해.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "NbSe2, TaS2, MoS2, 위상 절연체."}], "english_summary": ["Re-evaluates superconductivity in ultrathin NbSe2 and TaS2.", "Reveals two-band superconductivity hidden behind single-gap tunneling spectra.", "Provides spectroscopic evidence for multi-band contributions in TMD superconductors."]}}, {"title": "Orbital magnetoresistance in the antiferromagnet CoO driven by dynamic orbital angular momentum", "journal": "Science", "source": "Gemini", "link": "https://www.science.org/doi/abs/10.1126/science.adw1808?af=R", "authors": "Christin Schmitt, Sachin Krishnia, Mahmoud Zeer, et al.", "last_authors": "Yuriy Mokrousov, Mathias Kläui", "summary": "Science, Volume 393, Issue 6806, Page 76-79, July 2026.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Magnetoresistance in an antiferromagnet is relevant to quantum material electronic transport properties.", "tags": ["magnetism", "transport", "antiferromagnet"], "image": "", "briefing": {"background": "반강자성체(Antiferromagnet)는 거시적 자화가 없으나 고유한 자기적 질서를 가지며, 차세대 스핀트로닉스 소자의 후보로 주목받고 있습니다.", "motivation": "반강자성체 CoO에서 관측된 자기저항 현상을 동적인 궤도 각운동량(Dynamic Orbital Angular Momentum) 관점에서 해석하고자 함.", "result": "외 vation": "특정 결정 구조에서 이론적으로 예측된 '안장점-고리(saddle-loop)' 형태의 특이점이 실제 물질에서 존재하는지 확인하고자 함.", "result": "ARPES를 통해 특정 물질에서 안장점-고리 형태의 반-호프 특이점을 실험적으로 직접 관측하고 그 전자 구조를 규명함.", "implication": "다체 상관관계가 강한 물질에서 전자 구조의 위상적 특징이 어떻게 초전도성과 같은 집단적 현상을 유도하는지 이해하는 핵심 단서 제공.", "novelty": "단순한 안장점이 아닌 안장점-고리 형태라는 더 복잡한 위상적 특이점을 실험적으로 입증하여, 전자 구조와 물성 간의 상관관계를 심화함.", "unresolved": "이러한 고리 형태의 특이점이 해당 물질의 초전도 전이 온도나 전하 밀도 파 형성에 직접적으로 얼마나 기여하는지에 대한 정량적 분석 필요.", "future_work": "관측된 특이점을 기반으로 도핑 등을 통한 전자 구조 튜닝 및 관련 양자 물성 변화 탐구.", "concepts": [{"term": "반-호프 특이점", "why_emerged": "결정 격자 내 전자 에너지 밴드 구조에서 상태 밀도가 무한대가 되는 지점을 설명하기 위해 필요.", "origin": "Leon Van Hove(1953).", "connections": "강상관 전자계, 초전도성, 페르미 면."}, {"term": "안장점-고리 (Saddle-loop)", "why_emerged": "단순한 안장점을 넘어선 더 복잡한 밴드 토폴로지를 묘사하기 위해 필요.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "위상 반금속, 밴드 엔지니어링."}], "english_summary": ["The authors report the observation of a saddle-loop van Hove singularity.", "ARPES measurements confirm the unique electronic density of states features.", "This discovery provides insights into the electronic structure of quantum materials.", "The findings link specific band topology to collective physical properties."]}}, {"title": "Excitons in van der Waals magnetic materials", "journal": "Nature_Materials", "source": "Gemini", "link": "https://www.nature.com/articles/s41563-026-02636-0", "authors": "Pratap Chandra Adak, Florian Dirnberger, Swagata Acharya, Akashdeep Kamra, Xiaodong Xu, Vinod M. Menon", "last_authors": "Xiaodong Xu, Vinod M. Menon", "summary": "Nature Materials, Published online: 03 July 2026; doi:10.1038/s41563-026-02636-0 In this Review, the interplay of excitons, magnons and photons in two-dimensional magnetic semiconductors and how this enables control of light–matter interactions are discussed, and promising opportunities for magneto-optic optoelectronic and quantum applications are surveyed.", "tier": "B_IMPORTANT_CONDMAT", "score": "7", "reason": "Review on magnetic van der Waals materials, relevant to topological magnetism interests.", "tags": ["magnetism", "2Dmaterials", "excitons"], "image": "https://media.springernature.com/m685/springer-static/image/art%3A10.1038%2Fs41563-026-02636-0/MediaObjects/41563_2026_2636_Fig1_HTML.png", "briefing": {"background": "반데르발스 자성 물질은 2차원 층상 구조와 고유한 자기적 성질을 결합하여, 차세대 스핀트로닉스와 광전 소자 구현을 위한 핵심 후보로 주목받고 있습니다.", "motivation": "자성 반도체 내의 엑시톤(exciton)과 마그논(magnon), 광자 간의 상호작용을 체계적으로 정리하여 이들의 결합을 통한 빛-물질 상호작용 제어 가능성을 탐색하고자 합니다.", "result": "2차원 자성 물질에서 엑시톤-마그논 상호작용이 광학적 응답에 미치는 영향을 규명하고, 이를 활용한 자기-광학적 응용의 잠재력을 제시합니다.", "implication": "자성 2D 물질 기반의 양자 정보 처리 및 광전자 소자 설계에 중요한 가이드라인을 제공할 것으로 기대됩니다.", "novelty": "자기 위상 물질 및 강상관 전자계에 관심을 가진 연구자에게 광-물질 상호작용을 통한 새로운 자성 제어 기법(exciton-magnon coupling)을 제시한다는 점이 주목할 만합니다.", "unresolved": "실제 상온에서의 효율적인 엑시톤-마그논 제어와 장거리 상관관계 유지에 대한 구체적인 구현 난제들이 남아 있습니다.", "future_work": "본 리뷰에서 제시된 비평형 동역학을 실제 소자 환경에서 어떻게 안정적으로 구현할지에 대한 실험적 검증이 필요합니다.", "concepts": [{"term": "엑시톤-마그논 결합", "why_emerged": "빛과 물질의 상호작용을 자기적 자유도와 결합하여 정보 전달의 효율성을 높이기 위해 필요함.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "마그노닉스(Magnonics), 엑시토닉스(Excitonics) 분야와 연결됨."}, {"term": "반데르발스 자성 물질", "why_emerged": "2차원 극한 박막에서도 자기적 질서를 유지하는 물질을 통해 저전력 소자를 개발하고자 함.", "origin": "Gong et al. (2017)의 CrI3 연구 등이 시발점이 됨.", "connections": "위상 절연체, 스핀 홀 효과 연구와 밀접함."}], "english_summary": ["This review examines the interplay between excitons, magnons, and photons in 2D magnetic semiconductors.", "It highlights mechanisms for controlling light-matter interactions using magnetic van der Waals materials.", "The paper explores potential for future magneto-optic and quantum optoelectronic applications."]}}, {"title": "Multimodal scanning-probe quantum sensing of quantum materials", "journal": "Nature_Materials", "source": "Gemini", "link": "https://www.nature.com/articles/s41563-026-02648-w", "authors": "Senlei Li, Vincent Jacques, Patrick Maletinsky, Christian L. Degen, Chunhui Rita Du", "last_authors": "Christian L. Degen, Chunhui Rita Du", "summary": "Nature Materials, Published online: 06 July 2026; doi:10.1038/s41563-026-02648-w Solid-state spin defects are a powerful and versatile class of quantum sensor. This Review covers the development of scanning-probe nitrogen-vacancy sensing as a tool for investigating quantum materials with nanoscale resolution, surveys the recent development of spin defects in 1D and 2D host materials and identifies key directions for future research.", "tier": "B_IMPORTANT_CONDMAT", "score": "7", "reason": "Useful review on scanning probe techniques for quantum materials research.", "tags": ["scanningprobe", "quantumsensing", "methods"], "image": "https://media.springernature.com/m685/springer-static/image/art%3A10.1038%2Fs41563-026-02648-w/MediaObjects/41563_2026_2648_Fig1_HTML.png", "briefing": {"background": "양자 재료의 국소적인 자기적, 전기적 성질을 나노미터 규모에서 비파괴적으로 측정하는 것은 고체 물리학의 핵심 과제입니다.", "motivation": "기존의 스캐닝 프로브 현미경 기술을 넘어, 고체 내 결함(spin defects)을 이용한 양자 센싱의 최신 동향과 확장성을 분석하고자 합니다.", "result": "질소-공공(NV) 센터 기반의 스캐닝 프로브 기술이 어떻게 양자 물질의 미세한 자기/전기적 특성을 측정할 수 있는지 최신 연구들을 정리하였습니다.", "implication": "양자 센싱 기술이 단순한 이미징을 넘어 위상 물질의 Berry 곡률 분포나 국소적인 자기 질서 측정에 강력한 도구가 될 수 있음을 시사합니다.", "novelty": "독자가 연구하는 ARPES/STS와 상호보완적으로, 벌크의 평균적인 정보가 아닌 나노 스케일의 국소 양자 현상을 탐침할 수 있는 강력한 방법론을 제공합니다.", "unresolved": "다양한 호스트 물질(1D/2D)에 결함을 안정적으로 도입하고 신호를 노이즈와 분리하는 기술적 최적화가 필요합니다.", "future_work": "스핀 결함을 활용한 2D 물질 내의 동적 자성 측정 및 위상학적 스핀 텍스처 가시화 연구가 뒤따를 것으로 보입니다.", "concepts": [{"term": "질소-공공(NV) 센터", "why_emerged": "다이아몬드 내의 결함이 상온에서 스핀을 안정적으로 유지하고 주변 자기장에 민감하게 반응하기 때문.", "origin": "Gruber et al. (1997)에 의해 초기 연구 확립.", "connections": "양자 정보 처리(Qubits), 자기장 센싱."}, {"term": "양자 센싱", "why_emerged": "기존 센서의 한계를 뛰어넘는 고감도, 고해상도 측정 시스템이 차세대 소자 분석에 필요함.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "스캐닝 프로브 현미경(SPM), 위상물질 분석."}], "english_summary": ["A review on scanning-probe quantum sensing utilizing spin defects like NV centers.", "Discusses nanoscale investigation techniques for quantum materials.", "Surveys recent integration of spin defects into 1D and 2D host platforms."]}}, {"title": "Twist-angle-controlled anomalous gating in bilayer graphene/BN heterostructures", "journal": "Nature_Materials", "source": "Gemini", "link": "https://www.nature.com/articles/s41563-026-02667-7", "authors": "Gaia Maffione, Liam S. Farrar, Maëlle Kapfer, et al.", "last_authors": "Dominique Mailly, Rebeca Ribeiro-Palau", "summary": "Nature Materials, Published online: 06 July 2026; doi:10.1038/s41563-026-02667-7 Rotational misalignment between the top and bottom boron nitride layers encapsulating graphene acts as a switch for anomalous gating effects, such as gate ineffectiveness and hysteresis. These effects are observed at room temperature within an angle range of 15–45° and are highly sensitive to small angular changes.", "tier": "B_IMPORTANT_CONDMAT", "score": "7", "reason": "Relevant experimental study on graphene heterostructures and moire-related effects.", "tags": ["graphene", "moire", "heterostructure"], "image": "https://media.springernature.com/m685/springer-static/image/art%3A10.1038%2Fs41563-026-02667-7/MediaObjects/41563_2026_2667_Fig1_HTML.png", "briefing": {"background": "그래핀-BN 헤테로구조에서 층 간의 회전 각도(twist angle)는 전자 구조를 결정짓는 핵심 파라미터이며, 이를 통해 모아레 초격자 현상을 제어할 수 있습니다.", "motivation": "BN 층들 사이의 정렬 오류(misalignment)가 그래핀 소자의 게이팅 효과에 미치는 비정상적(anomalous) 영향을 연구하고자 합니다.", "result": "상온에서 15~45도의 회전 각도 범위 내에서 발생하는 게이트 무효화 및 히스테리시스 현상을 확인하였습니다.", "implication": "모아레 소자 제작 시 층 정렬이 단순한 물리적 구조를 넘어 소자의 전기적 특성 제어를 위한 중요한 스위칭 변수가 됨을 보여줍니다.", "novelty": "모아레 시스템에서의 층 정렬 문제가 소자 작동에 미치는 비정상적인 영향을 실험적으로 입증하여, 향후 헤테로구조 소자 설계 시 필수로 고려해야 할 변수를 제시합니다.", "unresolved": "구체적인 게이팅 무효화의 미시적 기작과 각도 변화에 따른 비선형적 반응의 이론적 모델링이 보완되어야 합니다.", "future_work": "이 현상을 역으로 이용한 각도 제어 기반의 새로운 스위칭 소자 개발 연구가 이어질 것입니다.", "concepts": [{"term": "모아레 초격자", "why_emerged": "두 2D 층을 겹쳐 회전시킬 때 발생하는 장주기 간섭 무늬가 전자의 밴드 구조를 크게 변화시키기 때문.", "origin": "Cao et al. (2018)의 트위스트 그래핀 초전도 연구가 시발점.", "connections": "평탄 밴드(Flat 스핀-전하 분리 물리 연구에 직접적인 실험적 돌파구가 될 수 있습니다.", "unresolved": "이러한 스핀 갭 안정화가 실제 물질의 국소적 결함이나 불순물과 어떻게 경쟁하는지에 대한 정량적 분석은 여전히 과제로 남아 있습니다.", "future_work": "다른 준일차원 도체(예: NbSe3 등)에 이 방식을 적용하여 스핀-전하 분리 효율을 테스트하고, 나노와이어 기반의 스핀트로닉스 소자로 발전시킬 가능성이 큽니다.", "concepts": [{"term": "0.5 conductance plateau", "why_emerged": "준일차원 양자점이나 와이어에서 스핀 축퇴가 풀릴 때 나타나는 특징적인 전도도 값입니다.", "origin": "초기 양자점 실험에서 1D 채널 내 전자 간의 상호작용에 의해 처음 보고되었습니다.", "connections": "스핀-전하 분리, Luttinger liquid 이론과 밀접하게 연관됩니다."}], "english_summary": ["Quasi-1D electron systems suffer from disorder-induced fragility of spontaneous spin polarization.", "The authors employ cavity-assisted techniques to stabilize an exchange-driven spin gap.", "Experimental demonstration of the 0.5(2e^2/h) conductance plateau confirms the spin-polarized nature.", "This approach provides a robust method to manipulate spin degrees of freedom in 1D transport."]}}, {"title": "Magnetic skyrmion lattice disclinations in pentagon- and heptagon-shaped FeGe nanostructures", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/nwd2-1hk9", "authors": "Thibaud Denneulin, Nikolai S. Kiselev, Vladyslav M. Kuchkin, and Rafal E. Dunin-Borkowski", "last_authors": "Thibaud Denneulin, Nikolai S. Kiselev, Vladyslav M. Kuchkin, and Rafal E. Dunin-Borkowski", "summary": "Author(s): Thibaud Denneulin, Nikolai S. Kiselev, Vladyslav M. Kuchkin, and Rafal E. Dunin-Borkowski Magnetic skyrmions typically form hexagonal lattices in chiral magnets, where translational defects such as dislocations are well known but angular defects remain largely unexplored. Here, the authors stabilize fivefold and sevenfold skyrmion lattice disclinations in pentagon- and heptagon-shaped FeGe nanostructures fabricated by focused ion beam milling. Lorentz transmission electron microscopy and electron holography reveal their magnetic and elastic structure. Supported by micromagnetic simulations, the results show how geometric confinement engineers defects in
