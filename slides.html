<title>Daily Paper Slideshow</title>
<style>
  :root {
    color-scheme: light;
    --bg: #f6f7f4;
    --paper: #ffffff;
    --ink: #111827;
    --muted: #64748b;
    --line: #d8ddd2;
    --accent: #176b87;
    --accent-2: #9a3412;
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; overflow: auto; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: var(--bg); color: var(--ink); }
  .shell { max-width: 1500px; min-height: 100vh; margin: 0 auto; padding: 14px 18px; display: flex; flex-direction: column; }
  .topbar { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 16px; }
  .top-actions { display: flex; align-items: center; gap: 10px; }
  .topbar a, button { border: 1px solid var(--line); border-radius: 8px; background: var(--paper); color: var(--ink); padding: 10px 14px; font-weight: 700; text-decoration: none; cursor: pointer; }
  button.primary { background: var(--accent); border-color: var(--accent); color: white; }
  button:disabled { opacity: 0.45; cursor: not-allowed; }
  .counter { color: var(--muted); font-weight: 700; }
  .slide { min-height: calc(100vh - 82px); background: var(--paper); border: 1px solid var(--line); border-radius: 10px; padding: 18px; box-shadow: 0 18px 42px rgba(15, 23, 42, 0.10); display: grid; grid-template-columns: minmax(310px, 0.86fr) minmax(0, 1.55fr); gap: 18px; overflow: visible; }
  .paper-head { min-width: 0; min-height: 0; overflow: visible; display: flex; flex-direction: column; gap: 12px; }
  .figure { margin: 0; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: #f8fafc; }
  .figure img { display: block; width: 100%; max-height: 41vh; object-fit: contain; background: white; }
  .figure figcaption { padding: 7px 10px; color: var(--muted); font-size: 12px; line-height: 1.3; }
  .head-text { display: flex; flex-direction: column; gap: 9px; min-width: 0; }
  .badges { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .badge { border-radius: 999px; padding: 5px 9px; background: #eef2ff; color: #3730a3; font-size: 12px; font-weight: 800; }
  .score { background: #fee2e2; color: #991b1b; }
  h1 { margin: 0; font-size: 25px; line-height: 1.15; letter-spacing: 0; overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
  h1 a { color: inherit; text-decoration-color: rgba(23, 107, 135, 0.35); text-decoration-thickness: 2px; text-underline-offset: 4px; }
  h1 a:hover { color: var(--accent); text-decoration-color: var(--accent); }
  .meta, .authors, .why, .abstract { font-size: 13px; line-height: 1.45; }
  .meta, .authors { color: var(--muted); }
  .why strong, .abstract strong, .authors strong { color: var(--ink); }
  .authors { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .why { border-left: 4px solid var(--accent-2); padding-left: 10px; color: #374151; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .abstract { border-top: 1px solid var(--line); padding-top: 14px; color: #374151; }
  .original-abstract { border-top: 1px solid var(--line); padding-top: 10px; color: #374151; font-size: 11.5px; line-height: 1.35; overflow-wrap: anywhere; }
  .original-abstract strong { display: block; margin-bottom: 4px; color: var(--ink); }
  .tags { display: flex; flex-wrap: wrap; gap: 8px; }
  .tag { border-radius: 999px; padding: 4px 8px; background: #f1f5f9; color: #475569; font-size: 12px; font-weight: 700; }
  .head-text > .link { display: none; }
  .briefing { min-width: 0; min-height: 0; overflow: visible; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); grid-auto-rows: minmax(0, auto); align-content: start; gap: 11px 18px; border-top: 0; padding-top: 0; }
  .brief-section { min-width: 0; }
  .brief-section.wide { grid-column: 1 / -1; }
  .brief-section h2 { margin: 0 0 4px; font-size: 14px; line-height: 1.22; color: #0f766e; letter-spacing: 0; }
  .brief-section p, .brief-section li { margin: 0; font-size: 12.5px; line-height: 1.42; color: #1f2937; overflow-wrap: anywhere; }
  .brief-section ul { margin: 0; padding-left: 20px; }
  .concepts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 9px 14px; }
  .concept { border-top: 1px solid var(--line); padding-top: 7px; }
  .concept h3 { margin: 0 0 4px; font-size: 13px; color: #7c2d12; letter-spacing: 0; }
  .concept p { margin: 2px 0 0; font-size: 11.5px; line-height: 1.35; color: #374151; overflow-wrap: anywhere; }
  .concept b { color: #111827; }
  .link { color: var(--accent); font-weight: 800; text-decoration: none; }
  .empty { padding: 48px; background: var(--paper); border: 1px solid var(--line); border-radius: 12px; color: var(--muted); }
  @media (max-width: 860px) {
    .shell { padding: 14px; }
    .topbar, .top-actions { align-items: stretch; flex-direction: column; }
    .slide, .briefing, .concepts { grid-template-columns: 1fr; }
    .slide { min-height: auto; overflow: visible; display: grid; }
    h1 { font-size: 28px; }
  }
</style>

<script>
const slides = [{"title": "Direct Visualization of Gate-Tunable Flat Bands in Twisted Double Bilayer Graphene", "journal": "PRL_Recent", "source": "author whitelist", "link": "http://link.aps.org/doi/10.1103/3vg5-vkzy", "authors": "Souvik Sasmal, Ryan Muzzio, Ahmed Khalifa, et al.", "last_authors": "Shubhayu Chatterjee, Jyoti Katoch", "summary": "The evolution of moiré minibands under varying carrier density and displacement field may be directly visualized using microfocused angle-resolved photoemission spectroscopy.", "tier": "A_MUST_READ", "score": "10", "reason": "author whitelist: Eli Rotenberg", "tags": ["angle-resolvedphotoemission", "photoemission", "graphene", "moir", "twisted", "flatband"], "image": "", "briefing": {"background": "트위스트 그래핀과 같은 모아레(moiré) 시스템은 두 층 사이의 각도를 조절하여 전자 밴드 구조를 변형시키고, 이를 통해 초전도성이나 절연 상태와 같은 강상관 물리 현상을 연구할 수 있는 중요한 플랫폼입니다.", "motivation": "트위스트 이중층 이중층 그래핀(TDBG)에서 외부 게이트 전압과 변위장(displacement field)에 따라 모아레 미니밴드가 어떻게 변화하는지 실험적으로 직접 시각화하여 확인하고자 했습니다.", "result": "마이크로 포커스 각분해 광전자 분광법(micro-ARPES)을 사용하여, 전하 밀도와 변위장 변화에 따른 TDBG의 플랫 밴드(flat band) 및 미니밴드 구조의 진화 과정을 직접적으로 관측하는 데 성공했습니다.", "implication": "실제 소자 구동 조건(게이트 튜닝)에서 전자 구조의 변화를 직접 관찰함으로써, TDBG에서 나타나는 다양한 양자 상태의 미시적 기원을 이해하는 데 결정적인 근거를 제공합니다.", "novelty": "게이트 전압으로 제어되는 모아레 시스템의 밴드 구조를 높은 공간 분해능의 ARPES로 직접 시각화했다는 점이 핵심이며, 이는 독자의 관심사인 ARPES를 활용한 밴드 엔지니어링 연구와 직결됩니다.", "unresolved": "전자-전자 상호작용에 의한 밴드 재규격화(renormalization) 효과를 완벽하게 정량화하고, 특정 전도 상태와의 연결 고리를 더 정교하게 밝히는 과정이 남아 있습니다.", "future_work": "다른 모아레 시스템(예: TMD 헤테로 구조)으로의 확장 및 더 낮은 온도에서의 상관 관계 연구가 기대됩니다.", "concepts": [{"term": "Moiré minibands", "why_emerged": "격자 상수가 약간 다른 두 층이 겹칠 때 발생하는 거대 주기 패턴에 의해 원래의 밴드가 다시 접히며 생성되는 작은 에너지 밴드입니다.", "origin": "모아레 무늬 현상 자체는 오래된 물리 현상이나, 그래핀 적층 구조에서는 2010년경부터 본격 주목받았습니다.", "connections": "Twisted bilayer graphene, Hofstadter's butterfly, Flat bands"}, {"term": "Twisted Double Bilayer Graphene (TDBG)", "why_emerged": "단일 층 그래핀 대신 이중층 그래핀을 비틀어 쌓음으로써, 외부 전기장으로 밴드 구조를 더 정교하게 조절하기 위해 고안되었습니다.", "origin": "2019년경 여러 그룹에서 동시에 연구가 시작되었습니다.", "connections": "Magic-angle twisted bilayer graphene, Displacement field tuning"}, {"term": "Micro-ARPES", "why_emerged": "모아레 시료처럼 수 마이크로미터 크기의 작은 영역에서만 나타나는 전자 구조를 정밀하게 측정하기 위해 필요합니다.", "origin": "기존 ARPES의 빔 사이즈를 마이크로 단위로 집속시키며 발전했습니다.", "connections": "Nano-ARPES, Synchrotron radiation"}, {"term": "Flat bands", "why_emerged": "전자의 운동 에너지가 극도로 억제되어 전자 간 상호작용이 지배적이게 되는 상태를 만들기 위해 필요합니다.", "origin": "고체물리학의 긴 역사 속에서 이론적으로 제안되었으며, 최근 모아레 계에서 실험적으로 구현되었습니다.", "connections": "Superconductivity, Mott insulator, Heavy fermions"}], "english_summary": ["Direct visualization of moiré minibands in TDBG using micro-ARPES.", "Demonstrated gate-tunability of flat bands and electronic structure evolution.", "Provided a microscopic link between displacement fields and band topology.", "Crucial for understanding correlation effects in twisted van der Waals heterostructures."]}}, {"title": "Unified First-Principles Formula for Time-Resolved ARPES Spectra of Coherent and Incoherent Excitons beyond the Dilute Limit", "journal": "PRL_Recent", "source": "keyword", "link": "http://link.aps.org/doi/10.1103/zhs1-rv1k", "authors": "Gianluca Stefanucci, Enrico Perfetto", "last_authors": "Gianluca Stefanucci, Enrico Perfetto", "summary": "Despite major experimental progresses in time-resolved and angle-resolved photoemission spectroscopy, a quantitative, microscopic framework for interpreting exciton-induced modifications of electronic band structures—applicable even beyond the low-density limit—is still lacking. Here, we close this gap by introducing a unified approach that links the dynamics of coherent and incoherent excitons to distinct and experimentally observable excitonic sidebands. Our central result is a general, first-principles formula for time-resolved photoemission spectra, applicable across a broad range of temperatures, excitation densities, and pump-probe delays. This advance provides a predictive tool for quantitatively tracking excitonic dynamics in complex materials.", "tier": "A_MUST_READ", "score": "10", "reason": "title strong match: ARPES", "tags": ["ARPES", "angle-resolvedphotoemission", "photoemission", "bandstructure"], "image": "", "briefing": {"background": "시간 분해 각분해 광전자 분광법(TR-ARPES)은 빛에 의해 유도된 여기 상태(예: 엑시톤)의 동역학을 관찰하는 핵심 도구이지만, 이를 해석하는 이론적 틀은 여전히 개선이 필요합니다.", "motivation": "특히 엑시톤 밀도가 높은 상황이나 가간섭성(coherence)이 있는 경우, 엑시톤이 전자 밴드 구조를 어떻게 변형시키는지 정량적으로 설명할 수 있는 제1원리 기반의 통합 공식이 부재했습니다.", "result": "가간섭 및 비가간섭 엑시톤의 역학을 ARPES 신호의 사이드밴드(sidebands)와 직접 연결하는 범용적인 제1원리 수식을 도출했습니다. 이는 다양한 온도와 여기 밀도에서 적용 가능합니다.", "implication": "이 모델을 통해 복잡한 물질의 TR-ARPES 실험 데이터에서 엑시톤의 기여도를 정확히 분리하고, 비평형 상태의 전자 구조 변화를 예측할 수 있게 되었습니다.", "novelty": "기존의 희박 엑시톤 모델(dilute limit)을 넘어선 일반화된 수식을 제공함으로써, 강한 펌프 광을 사용하는 실제 실험 분석의 정확도를 크게 높였습니다.", "unresolved": "초록 정보상으로는 실제 복잡한 전이금속 디칼코제나이드(TMD) 등에서의 구체적인 수치 계산 비용이나 실험과의 완벽한 일치 여부에 대한 구체적 언급은 부족합니다.", "future_work": "제안된 이론을 활용하여 다양한 양자 물질의 여기 상태 밴드 구조를 재해석하고 새로운 엑시톤 위상을 탐색할 것으로 보입니다.", "concepts": [{"term": "TR-ARPES", "why_emerged": "평형 상태를 넘어선 극초단 시간 영역에서의 전자 구조 변화와 준입자 상호작용을 관찰하기 위해 개발되었습니다.", "origin": "초고속 레이저 기술과 ARPES의 결합으로 탄생했습니다.", "connections": "Exciton dynamics, Floquet engineering, Non-equilibrium physics"}, {"term": "Exciton", "why_emerged": "반도체나 절연체에서 전자와 홀이 쿨롱 상호작용으로 결합된 준입자 상태를 설명하기 위해 도입되었습니다.", "origin": "Yakov Frenkel(1931) 등에 의해 제안되었습니다.", "connections": "Excitonic insulator, Photoluminescence, Many-body physics"}, {"term": "Coherent Exciton", "why_emerged": "펌프 광에 의해 유도된 초기 위상이 유지되는 엑시톤 상태를 구분하기 위해 필요합니다.", "origin": "양자 광학 및 초고속 분광학 분야에서 확립되었습니다.", "connections": "Rabi oscillation, Quantum coherence, Pump-probe spectroscopy"}, {"term": "Excitonic sidebands", "why_emerged": "엑시톤이 존재할 때 주 밴드 주변에 나타나는 추가적인 신호를 통해 엑시톤의 존재를 확인하기 위해 사용됩니다.", "origin": "초록 정보만으로는 특정하기 어려우나 TR-ARPES 연구 과정에서 관측되었습니다.", "connections": "Replica bands, Many-body interaction"}], "english_summary": ["A new first-principles formula for TR-ARPES spectra including excitonic effects.", "Covers both coherent and incoherent excitons beyond the dilute limit.", "Enables quantitative tracking of exciton-induced band modifications.", "Applicable to complex materials across various temperatures and pump delays."]}}, {"title": "Interplay of Umklapp scattering and Sb-Au hybridization in surface-reconstructed Sb/Au(111)", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2607.07132", "authors": "Zhe Zheng, Celine Wassenberg, Stefanie Hilgers, Carsten Westphal, Mirko Cinchetti", "last_authors": "Carsten Westphal, Mirko Cinchetti", "summary": "Surface reconstructions induced by atomic adsorption can strongly reshape metallic surface states, providing a direct pathway to tune their electronic structure. Using angle-resolved photoemission spectroscopy, we investigate the electronic structure of Sb/Au(111) during the coverage-driven evolution from the clean Au(111) surface to the $(14\\times14)$ and Rec$(3\\times\\sqrt{3})$ phases. In the Rec$(3\\times\\sqrt{3})$ phase, triangular Fermi pockets emerge at the Brillouin-zone boundary. Their momentum positions are consistent with a reciprocal-space folding construction, but their reduced size near the Fermi level indicates a modification of the Au-derived $sp$ dispersion. The substantial modifications of deeper Au $d$-derived bands observed in ARPES further indicate significant mixing between Sb $p$ orbitals and Au $d$ states. These results show that the electronic structure of Sb/Au(111) is governed by the interplay between reconstruction-induced Umklapp scattering and interfacial orbital hybridization, highlighting adsorbate-substrate hybridization as a key mechanism for tuning and engineering surface electronic structures.", "tier": "A_MUST_READ", "score": "10", "reason": "Uses ARPES to study electronic structure of Sb/Au(111) surface reconstruction, directly relevant to ARPES.", "tags": ["ARPES", "electronicstructure", "material"], "image": "https://arxiv.org/html/2607.07132v structure engineering."]}}, {"title": "Robust topological surface states in skyrmion-host magnets Eu(Ga,Al)4: Evidence for dual topology", "journal": "PRB_Recent", "source": "author whitelist", "link": "http://link.aps.org/doi/10.1103/5hbm-g33v", "authors": "Yuki Arai, Kosuke Nakayama, Takemi Kato, et al.", "last_authors": "Kouji Segawa, Takafumi Sato", "summary": "The interplay between real-space topology such as magnetic skyrmions and momentum-space topology characterized by topological surface states (TSSs) is predicted to realize novel phenomena and functionalities, yet materials hosting both topologies are scarce. Skyrmion-hosting helimagnet family ${\\mat…", "tier": "A_MUST_READ", "score": "9", "reason": "author whitelist: Daisuke Shiga", "tags": ["topological"], "image": "", "briefing": {"background": "실공간의 자기적 위상 구조인 스카이뮨(Skyrmion)과 운동량 공간의 위상 구조인 위상 표면 상태(TSS)를 동시에 갖는 물질을 찾는 것은 응집물질 물리학의 중요한 과제입니다. 이 두 위상성이 결합할 경우 기존에 없던 새로운 양자 현상과 소자 응용 가능성이 열리기 때문입니다.", "motivation": "본 연구는 스카이뮨 호스트 물질로 알려진 Eu(Ga,Al)4 계열에서 운동량 공간의 위상 특성(TSS)이 공존하는지를 ARPES를 통해 직접 확인하고, 실공간과 운동량 공간의 '이중 위상성(dual topology)'을 증명하고자 했습니다.", "result": "ARPES 실험을 통해 Eu(Ga,Al)4의 브릴루앙 영역 중심 근처에서 견고한 위상 표면 상태(TSS)가 존재함을 확인했습니다. 이는 자기적 질서나 스카이뮨 구조의 존재 여부와 상관없이 위상학적 밴드 구조가 안정적으로 유지됨을 보여주며, 이 물질이 이중 위상성을 가진다는 강력한 증거를 제시했습니다.", "implication": "스카이뮨과 TSS가 한 물질 내에 공존함이 확인됨에 따라, TSS를 흐르는 전자가 스카이뮨의 창발적 자기장과 상호작용하는 위상 홀 효과나 스핀-궤도 토크 제어 등 차세대 스핀트로닉스 연구의 플랫폼으로 활용될 수 있습니다.", "novelty": "ARPES 분야의 권위자인 Sato 교수 그룹의 연구로, 스카이뮨 호스트인 Eu 계열 화합물에서 TSS를 직접 관측했다는 점이 중요합니다. 사용자분의 관심사인 '자기 위상 절연체' 및 'ARPES를 이용한 위상 물질 탐색'과 밀접한 관련이 있습니다.", "unresolved": "스카이뮨의 정렬 상태가 TSS의 스핀 구조나 에너지 위치에 구체적으로 어떤 미세한 영향을 미치는지에 대한 정밀한 정량적 분석은 향후 과제로 남아 있습니다.", "future_work": "스카이뮨 상전이 부근에서 온도 및 자기장 가변 ARPES를 통한 TSS의 변화 관측과, 이를 이용한 전송 특성(Hall effect)과의 직접적인 상관관계 규명이 기대됩니다.", "concepts": [{"term": "스카이뮨 (Skyrmion)", "why_emerged": "연속적인 스핀 정렬에서 위상학적으로 보호되는 소용돌이 형태의 자기 구조를 설명하기 위해 도입되었습니다.", "origin": "Tony Skyrme (원래 입자 물리학에서 제안)", "connections": "위상 홀 효과, 스핀트로닉스, 자기 메모리"}, {"term": "위상 표면 상태 (TSS)", "why_emerged": "벌크 밴드 구조의 위상학적 특성으로 인해 표면에 나타나는 질량이 없는 디락 페르미온 상태를 설명하기 위해 나타났습니다.", "origin": "초록 정보만으로는 특정하기 어려움 (Kane & Mele 등 이론적 기반)", "connections": "위상 절연체, ARPES, 스핀-궤도 결합"}, {"term": "이중 위상성 (Dual Topology)", "why_emerged": "실공간의 자기적 위상과 운동량 공간의 전자 구조 위상이 한 물질 내에서 공존하는 특수한 상황을 정의하기 위해 제안되었습니다.", "origin": "최근 위상 자성체 연구 분야에서 대두됨", "connections": "자성 위상 절연체, Weyl 반금속"}], "english_summary": ["This study provides ARPES evidence for robust topological surface states (TSS) in the skyrmion-host magnets Eu(Ga,Al)4.", "The results demonstrate the coexistence of real-space magnetic topology and momentum-space electronic topology, termed 'dual topology'.", "The observed TSS remains stable across different phases, suggesting Eu(Ga,Al)4 as a unique platform for studying the interplay between skyrmions and Dirac electrons.", "This discovery opens new avenues for exploring novel spintronic functionalities in magnetic topological materials."]}}, {"title": "Strain-tuned orbital-dependent electronic correlations in FeTe thin films", "journal": "PRB_Recent", "source": "author whitelist", "link": "http://link.aps.org/doi/10.1103/xffv-kpjp", "authors": "Hyunjee Song, Sangjae Lee, Keun-Yeol Park, et al.", "last_authors": "Younsik Kim, Changyoung Kim", "summary": "Iron chalcogenides exhibit rich phenomena which are governed by orbital-dependent electronic interactions and strong electronic correlation. In particular, many studies have explored orbital selectivity in FeTe through Se doping. Here, applying tensile strain to thin films allows us to precisely con…", "tier": "A_MUST_READ", "score": "9", "reason": "author whitelist: Changyoung Kim", "tags": ["authorWhitelist"], "image": "", "briefing": {"background": "철계 칼코게나이드(Iron chalcogenides)는 궤도 선택적 전자 상관관계(orbital-selective correlation)와 그에 따른 전자 구조 변화가 물리적 성질을 결정하는 핵심 요소입니다. 일반적으로 Se 도핑을 통해 이러한 상관관계를 조절해 왔으나, 이는 화학적 무질서를 동반한다는 단점이 있습니다.", "motivation": "도핑 대신 변형력(strain) ities on Kagome lattice", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2607.06966", "authors": "He-Lin Li, Zhen-Gang Zhu, Gang Su", "last_authors": "Zhen-Gang Zhu, Gang Su", "summary": "We theoretically investigate the anomalous Hall and Nernst effects (AHE and ANE) in a two dimensional Kagome lattice to uncover the distinct roles of static and fluctuating scalar spin chi ralities. Employing Monte Carlo simulations incorporating with a tight binding Hamiltonian via the s-d exchange interaction, we explicitly evaluate the anomalous transport coefficients. A key finding is the systematic disentanglement of the macroscopic responses into an intrinsic contribu tion, governed by momentum space Berry curvature induced by static chirality, and an extrinsic skew scattering contribution driven by real space dynamical spin fluctuations. We demonstrate a pronounced mechanistic crossover: deep in magnetically ordered phases like the skyrmion crystal, the intrinsic Berry curvature dictates the transport behavior. However, approaching the magnetic order-disorder critical regime, strong thermal fluctuations disrupt static noncoplanar spin configu rations, drastically suppressing intrinsic responses. Here, dynamical chiral fluctuations emerge as the dominant driving force. By delineating the phase regimes governed by static versus fluctuating chiralities, this work elucidates the distinct microscopic mechanisms dictating anomalous transport in frustrated magnetic systems.", "tier": "A_MUST_READ", "score": "9", "reason": "Investigates anomalous Hall and Nernst effects on kagome lattice, highly relevant to user's research.", "tags": ["kagome", "anomalousHall", "Berrycurvature", "theory"], "image": "https://arxiv.org/html/2607.06966v1/fig1.jpg", "briefing": {"background": "카고메 격자 구조는 기하학적 좌절과 밴드 구조의 특이점으로 인해 위상학적 비정상 홀 효과(AHE) 및 네른스트 효과(ANE) 연구의 핵심 플랫폼입니다.", "motivation": "카고메 격자 내의 정적인 스핀 구조와 동적인 스핀 요동이 비정상 수송 현상에 각각 어떻게 기여하는지 물리적 메커니즘을 분리하여 규명하고자 합니 erromagnetic-like broken time-reversal symmetry, hold great promise for high-density and ultrafast spintronic applications. However, the detection and switching of perpendicular altermagnetic order are fundamentally constrained by magnetic symmetry, restricting both fundamental studies and practical implementation. We realize robust electrical reading and deterministic switching of perpendicular altermagnetic order by designing a Dirac semimetal/altermagnet heterostructure of PtTe2/CrSb. This engineered interface enables anomalous Hall readout via altermagnetic proximity effect and delivers efficient spin-orbit torque for manipulating the epitaxial perpendicular Neel vector in CrSb. These findings significantly broaden the functional scope of altermagnetic heterostructures and pave the way for highly scalable altermagnetic memory.", "tier": "A_MUST_READ", "score": "9", "reason": "Proposes electrical manipulation of altermagnetic order via Dirac semimetal, highly relevant to user's interests.", "tags": ["altermagnetism", "Dirac", "anomalousHall", "heterostructure", "spintronics"], "image": "https://arxiv.org/static/browse/0.3.4/images/arxiv-logo-fb.png", "briefing": {"background": "알터마그넷(Altermagnet)은 강자성체와 반강자성체의 특성을 동시에 갖는 새로운 자기적 상태로, 시간 반전 대칭이 깨져 있으면서도 순 자화값이 0인 독특한 성질을 가집니다. 이는 미래의 고속 저전력 스핀트로닉스 소자 후보로 주목받고 있습니다.", "motivation": "알터마그넷의 수직 자기 질서(perpendicular order)를 전기적으로 제어하고 감지하는 것은 기존 자기적 대칭성 제약 때문에 어려웠습니다. 이를 극복할 수 있는 효율적인 소자 구조를 설계하고자 했습니다.", "result": "디락 반금속 PtTe2와 알터마그넷 CrSb 이질접합을 구현하여, 근접 효과를 통해 이상 홀 효과로 알터마그넷 상태를 읽어내고 스핀-궤도 토크로 수직 Neel 벡터를 결정론적으로 전환하는 데 성공했습니다.", "implication": "알터마그넷 기반의 고집적 메모리 소자 구현 가능성을 제시하며, 위상물질과 알터마그넷의 결합이 새로운 스핀트로닉스 기능성을 창출함을 입증했습니다.", "novelty": "디락 반금속과 알터마그넷을 결합하여 기존의 대칭성 제한을 극복하고, 전기적 읽기/쓰기가 가능한 소자 플랫폼을 실증했다는 점에서 사용자 관심 분야인 자기 위상 물질 및 스핀트로닉스 연구에 중요한 이정표가 됩니다.", "unresolved": "소자의 동작 온도 범위나 대면적 공정에서의 안정성, 그리고 다양한 알터마그넷 물질군으로의 범용성 확대가 남아있습니다.", "future_work": "실제 동작 속도 측정 및 고집적 메모리 어레이화 연구, 다른 알터마그넷 물질을 이용한 이질접합 최적화 연구가 필요합니 er of fermions captures the physics of the system for a wide range of interaction strengths, interpolating between the free-fermion limit and the strongly interacting Majorana regime. Finally, we propose a concrete protocol to realize this model with ultracold dipolar molecules or atoms in an optical lattice, and to detect the revival via beam-splitter interferometry, opening an experimental route to Majorana physics beyond the conventional gapped-superconductor paradigm.", "tier": "A_MUST_READ", "score": "9", "reason": "title strong match: Luttinger liquid", "tags": ["STS", "Majorana", "Luttinger", "superconduct", "topological"], "image": "https://arxiv.org/html/2607.06751v1/x1.png", "briefing": {"background": "위상 초전도체에서의 마요라나 제로 모드(MZM)는 양자 컴퓨팅의 안정적인 큐비트 구현을 위해 필수적입니다. 전통적으로는 입자 수가 보존되지 않는 갭이 있는 키타예프 사슬 모델에서 연구되어 왔습니다.", "motivation": "갭이 있는 전통적인 초전도체 패러다임을 넘어, 입자 수가 보존되는 갭이 없는 Luttinger 액체 시스템에서도 마요라나 물리학의 흔적을 찾을 수 있는지 확인하고자 했습니다.", "result": "스핀 없는 페르미온의 Luttinger 액체에서 인력 상호작용이 있을 때, 페르미온 수의 패리티에 따라 달라지는 끝단간(edge-to-edge) 리바이벌 현상을 발견했습니다.", "implication": "마요라나 물리학이 반드시 갭이 있는 초전도체를 통해서만 구현되는 것이 아님을 보여주며, 저차원 강상관 전자계에서 새로운 위상 물리 탐구 영역을 개척했습니다.", "novelty": "사용자의 관심사인 Luttinger 액체 및 스핀-전하 분리 물리학과 위상물질의 결합을 통해, 기존에 무시되었던 gapless 시스템에서의 위상적 특징을 이론적으로 규명했습니다.", "unresolved": "초냉각 분자/원자 시스템에서의 실험적 구현 난이도와 실제 고체 물성 연구로의 연계성.", "future_work": "광학 격자에서의 빔 분할기 간섭계를 통한 리바이벌 신호 검출 실험, 현실 고체 물질(예: quasi-1D 도체)에서의 유사 현상 탐색.", "concepts": [{"term": "마요라나 제로 모드", "why_emerged": "위상적으로 보호되는 안정적인 양자 비트 구현의 필요성.", "origin": "Ettore Majorana (1937), 고체물리에서는 Kitaev (2001) 등에 의해 정립.", "connections": "위상 초전도체, 파라 페르미온, 비아벨 통계."}, {"term": "Luttinger 액체", "why_emerged": "1차원 시스템에서 페르미 액체 이론의 붕괴와 집단 여기의 기술 필요성.", "origin": "Tomonaga (1950), Luttinger (1963).", "connections": "스핀-전하 분리, 1D 도체, 홀로그램 원리."}], "english_summary": ["Discovery of Majorana-like edge physics in gapless, number-conserving Luttinger liquids.", "Features parity-dependent edge-to-edge revival of the two-point correlator.", "Proposes an experimental realization using ultracold atoms in optical lattices.", "Extends Majorana physics beyond the conventional gapped-superconductor paradigm."]}}, {"title": "Scanning tunneling microscopy of resonant-impurity in altermagnets: dual Fano resonance and Landau-quantization-induced nodal spin contrast", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2607.06885", "authors": "Yuan Hong, Zhigang Wang, Zhen-Guo Fu, et al.", "last_authors": "Wei Zhang, Ping Zhang", "summary": "Using a Green's-function formalism, we study the spin-resolved local spectral function of a resonant impurity coupled to a two-dimensional $d$-wave altermagnetic substrate. It is found that the interplay between the direct impurity-STM tip tunneling and altermagnet-mediated tunneling leads to dual Fano resonance in the absence of external magnetic field. Moreover, the anisotropic spin-dependent oscillation of the local density of states and/or Fano factor provide the information of the altermagnetic splitting strength from the local/global perspective. In addition, spin-selective tunneling can be achieved by tuning the Fermi energy and the tip position. In the presence of strong magnetic field with Landau level quantization, the dominant STS signature becomes a spin-dependent nodal structure of the real-space pattern: the nodal mismatch between opposite spin channels produces a large local spin contrast. These results establish resonant-impurity STM/STS as a phase-sensitive local probe of altermagnetic band anisotropy.", "tier": "A_MUST_READ", "score": "9", "reason": "Theoretical STM/STS signatures for probing altermagnetic band anisotropy, directly relevant to user's methods/materials.", "tags": ["STM", "STS", "altermagnetism", "Landaulevel", "electronicstructure"], "image": "https://arxiv.org/html/2607.06885v1/Fig1.jpg", "briefing": {"background": "알터마그넷의 밴드 이방성과 스핀 분할은 물질의 전자 구조를 이해하는 핵심 요소입니다. 이를 로컬하게 탐사하는 STM/STS 기법은 복잡한 자기 상태를 해석하는 데 필수 . In altermagnets, spin splitting arises from crystal symmetry and alternates in momentum space, whereas in compen…", "tier": "B_IMPORTANT_CONDMAT", "score": "9", "reason": "Directly addresses altermagnetism and its interconversion with ferrimagnetism via chemical symmetry breaking.", "tags": ["altermagnetism", "magnetism", "crystalsymmetry", "theory"], "image": "", "briefing": {"background": "자성 물질 연구에서 알터자성(Altermagnetism)은 순 자화가 0이면서도 스핀 분할이 일어나는 새로운 자기 질서 상태로 주목받고 있습니다. 이는 기존의 강자성이나 반강자성과는 구별되는 독특한 대칭성 기반의 물리 현상입니다.", "motivation": "알터자성과 보상된 페리자성(Compensated ferrimagnetism) 사이의 상호 변환을 화학적 대칭성 깨짐을 통해 구현하여 제어 가능성을 탐구하고자 합니다.", "result": "화학적 조성을 조절함으로써 결정 대칭성을 변화시켜 알터자성 상태와 보상된 페리자성 상태 사이의 가역적 제어가 가능함을 보였습니다.", "implication": "이론적으로 예측된 자성 상태들 간의 변환을 실현함으로써 차세대 자성 소자(스핀트로닉스) 설계에 새로운 자유도를 제공합니다.", "novelty": "알터자성의 독특한 운동량 공간 스핀 분할 성질을 대칭성 조절을 통해 전환할 수 있음을 이론적으로 제시한 점이 핵심입니다.", "unresolved": "실제 물질 합성을 통한 실험적 검증 및 상전이 과정에서의 동역학적 특성은 아직 밝혀지지 않았습니다.", "future_work": "제안된 메커니즘을 실제 화합물에서 구현하기 위한 DFT 기반의 소재 탐색 및 실제 합성 시도가 예상됩니다.", "concepts": [{"term": "Altermagnetism", "why_emerged": "결정 대칭성을 이용해 반강자성체에서도 스핀 분할(Spin splitting)을 유도하여 스핀트로닉스 활용을 극대화하기 위해.", "origin": "최근 수년 내 이론적으로 체계화됨.", "connections": "기존의 반강자성체, Berry 곡률, 비정질 홀 효과와 깊게 연결됨."}, {"term": "Compensated Ferrimagnetism", "why_emerged": "자기 모멘트는 상쇄되지만 결정 내 국소적인 자기 구조의 대칭성으로 인해 페리자성적 특성을 유지하기 위해.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "반강자성체와 페리자성체 사이의 경계 영역."}], "english_summary": ["Proposed a method to interconvert altermagnetic and compensated ferrimagnetic states.", "Utilized chemical symmetry breaking to tune the magnetic order.", "Maintains zero net magnetization while enabling spin splitting control.", "Provides a theoretical blueprint for developing switchable spintronic materials."]}}, {"title": "Gap structure and phase diagram of twisted bilayer cuprates from a microscopic perspective (Phys. Rev. B)", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2603.10865", "authors": "Siddhant Panda, Andreas Kreisel, Laura Fanfarillo, Peter Hirschfeld", "last_authors": "Laura Fanfarillo, Peter Hirschfeld", "summary": "Since the prediction of a time-reversal symmetry breaking (TRSB) $d+id^\\prime$ state in twisted bilayer cuprate superconductors by Can et al. [Nat.Phys. 17,519(2021)], several experiments have attempted to detect this state, yielding conflicting results. At present, it is not clear which differences in samples or experimental conditions might explain these discrepancies. In this work, we perform a tight-binding lattice model calculation with phenomenological interlayer tunneling, examining the order parameter as a function of twist angle, interlayer tunneling, doping, and temperature. We observe the TRSB state to be correlated to the position of the Van Hove singularity in the normal state, which changes not only as a function of doping but also the tunneling strength. Two such phases are identified as nominally consistent with in-plane $d+id'$ and $d+is$ order, but with unexpected transformation properties under bilayer symmetry operations. We calculate the Josephson critical current, in particular examining the angle dependence for various tunneling strengths. Finally, we discuss the existing experiments in the context of our results.", "tier": "B_IMPORTANT_CONDMAT", "score": "9", "reason": "Theoretical study addressing experimental controversy in TRSB and superconductivity in twisted bilayer cuprates.", "tags": ["superconductivity", "TRSB", "twistedbilayer", "cuprate", "theory", "correlated"], "image": "https://arxiv.org/html/2603.10865v2/x1.png", "briefing": {"background": "트위스트된 이중층 구리 산화물은 층 간의 회전 각도에 따라 초전도 특성이 크게 변하며, 특히 시간 반전 대칭성 깨짐(TRSB)이 동반되는 d+id' 초전도 상태에 대한 논란이 있습니다.", "motivation": "트위스트된 이중층 구리 산화물에서 보고된 TRSB 현상에 대한 실험적 불일치를 해결하기 위해, 미시적 격자 모델을 통해 초전도 갭 구조와 위상 도표를 체계적으로 계산하고자 합니다.", "result": "TRSB 상태가 van Hove 특이점의 위치와 밀접하게 연관되어 있으며, 도핑 및 터널링 세기에 따라 초전도 위상이 변화함을 규명했습니다.", "implication": "실험 간의 불일치가 샘플의 도핑 농도나 층간 터널링 강도 차이로 인해 발생할 수 있음을 이론적 근거와 함께 제시했습니다.", "novelty": "그동안의 TRSB 논란을 미시적 모델링을 통해 해석함으로써, 향후 실험 설계 시 제어해야 할 핵심 변수들을 명확히 했습니다.", "unresolved": "실제 샘플에서의 국소적인 터널링 변동이나 불순물 효과가 계산에 완벽히 반영되지 않았을 가능성이 있습니다.", "future_work": "조셉슨 전류의 각도 의존성을 정밀하게 측정하는 실험적 검증과, 더 다양한 트위스트 각도에서의 물리량 예측이 필요합니다.", "concepts": [{"term": "TRSB (Time-Reversal Symmetry Breaking)", "why_emerged": "초전도 상태에서 자기적 질서가 공존하거나 복소 차수 매개변수(d+id')를 가질 때 나타나는 물리적 현상을 설명하기 위해.", "origin": "초전도 이론 초기부터 존재하나, 비전통적 초전도체 연구에서 핵심 주제가 됨.", "connections": "카이랄 초전도체, 위상 절연체와 연결됨."}, {"term": "van Hove singularity", "why_emerged": "상태 밀도가 급격히 변하는 지점에서 강한 상관관계 및 초전도 전이 온도가 증대되는 현상을 이해하기 위해.", "origin": "Leon van Hove (1953년).", "connections": "구리 산화물 및 꼬인 그래핀 시스템의 전자 구조에서 핵심 역할."}], "english_summary": ["Studied the gap structure and TRSB state in twisted bilayer cuprates.", "Identified correlation between TRSB and van Hove singularities.", "Addressed conflicting experimental results by analyzing tunneling and doping dependencies.", "Provides a framework for understanding phase competition in van der Waals heterostructures of cuprates."]}}, {"title": "Identifying the structure of La3Ni2O7 in the pressurized superconducting state", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2511.15265", "authors": "Hengyuan Zhang, Jielong Zhang, Mengwu Huo, et al.", "last_authors": "Kun Cao, Meng Wang", "summary": "The crystal structure of La 3 Ni 2 O 7 in its high-pressure superconducting state has been the subject of intense debate, with conflicting reports proposing orthorhombic ( A ​ m ​ a ​ m Amam or F ​ m ​ m ​ m Fmmm ) and tetragonal ( I ​ 4 / m ​ m ​ m I4/mmm ) symmetries. Here, using high-pressure Raman spectroscopy down to 3 K, we resolve this controversy by tracking the structural evolution of La 3 Ni 2 O 7 up to 32.7 GPa. Leveraging rigorous symmetry-based selection rules, we identify a single structural transition from the orthorhombic A ​ m ​ a ​ m Amam phase to the F ​ m ​ m ​ m Fmmm phase at ∼ \\sim 14.5 GPa, signaled by a profound phonon renormalization. Crucially, the persistence of D 2 ​ h D_{2h} symmetry across the transition rules out the tetragonal I ​ 4 / m ​ m ​ m I4/mmm phase in the superconducting state in our measurements. The emergence of bulk superconductivity coincides precisely with this transition. Our results establish the orthorhombic F ​ m ​ m ​ m Fmmm structure as the intrinsic host of superconductivity in La 3 Ni 2 O 7 below 19.45 GPa, resolving a central structural controversy and providing a critical foundation for understanding the superconducting mechanism in bilayer nickelates.", "tier": "B_IMPORTANT_CONDMAT", "score": "9", "reason": "Experimental structure determination of a high-pressure superconducting nickelate.", "tags": ["material", "superconductivity", "structural", "spectroscopy"], "image": "https://arxiv.org/html/2511.15265v2/x1.png", "briefing": {"background": "La3Ni2O7은 최근 고압에서 초전도성을 보이는 이층(bilayer) 니켈산염으로, cuprate 이후의 새로운 고온 초전도체 후보로 주목받고 있습니다. 이 물질의 정확한 결정 구조는 초전도 메커니즘을 규명하는 핵심 요소이나, 학계에서 여러 대칭성 모델이 제시되어 논란이 있어 왔습니다.", "motivation": "고압 하에서의 구조적 논란을 해결하기 위해 고압 라만 분광법을 사용하여 저온에서의 구조 변화를 직접 추적하고자 했습니다.", "result": "압력 증가에 따라 Amam에서 Fmmm 상으로의 구조 전이가 14.5 GPa 부근에서 발생함을 확인했습니다. 특히 32.7 GPa까지 D2h 대칭성이 유지됨을 보여, 학계에서 제기되었던 I4/mmm(정방정계) 구조 가능성을 배제했습니다.", "implication": "이 결과는 La3Ni2O7 초전도의 모체 구조가 Fmmm임을 명확히 함으로써, 향후 전자구조 계산 및 초전도 기제 이론 연구의 표준적인 기하학적 토대를 제공합니다.", "novelty": "저온·고압 환경에서 엄격한 대칭성 선택 규칙을 적용한 라만 분광 측정을 통해 결정 구조 논쟁에 마침표를 찍었다는 점에서 실험적 엄밀함이 돋보입니다.", "unresolved": "Fmmm 상 내부의 구체적인 산소 팔면체 기울기나 니켈-산소 결합의 미세한 왜곡이 초전도성을 극대화하는 방식은 여전히 규명되어야 합니다.", "future_work": "확정된 Fmmm 구조를 바탕으로 한 밀도범함수 이론(DFT) 및 동역학적 평균장 이론(DMFT)을 통한 전자구조의 정밀 재해석이 필요합니다.", "concepts": [{"term": "La3Ni2O7", "why_emerged": "구리 기반 초전도체와 유사한 전자 구조를 가지면서도 bilayer 구조를 가진 니켈산염 고온 초전도체로서 주목받음.", "origin": "2023년경 Sun et al.이 고압에서 80K 초전도성을 보고하며 본격적인 연구 시작.", "connections": "Cuprate 초전도체, 페로브스카이트 산화물, 강상관 전자계."}, {"term": "Fmmm", "why_emerged": "이층 니켈산염에서 고압 초전도성을 나타내는 것으로 지목된 사방정계(orthorhombic) 결정 구조.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "Amam, I4/mmm 등 구조적 다형체(polymorphs)."}], "english_summary": ["La3Ni2O7 high-pressure superconductivity structure has been debated between various symmetries.", "High-pressure Raman spectroscopy up to 32.7 GPa is employed to track structural evolution at 3 K.", "Results identify a transition from Amam to Fmmm at ~14.5 GPa, ruling out the I4/mmm tetragonal phase.", "The Fmmm phase is established as the intrinsic superconducting host, providing a foundation for future theoretical work."]}}, {"title": "Kohn-Luttinger Superconductivity of Weyl Fermi Arcs in PtBi2", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2605.31501", "authors": "Reuel Dsouza, Nikolaos Parthenios, Brian M. Andersen, Morten H. Christensen", "last_authors": "Brian M. Andersen, Morten H. Christensen", "summary": "Recent experimental observations in the noncentrosymmetric Weyl semimetal PtBi$_2$ indicate unconventional superconductivity hosted by topological surface states -- Weyl Fermi arcs -- with a node at the center of each arc. Focusing on these Fermi arcs, we calculate the electronically mediated pairing interaction using a Kohn-Luttinger approach and find that, in a large region of the phase diagram, the leading superconducting instability has an $i$-wave symmetry featuring precisely such an intra-arc node. We study the dependence of the leading superconducting instabilities on electronic interaction parameters and chemical potential and show that the $i$-wave state is robust to changes in the model parameters. Our results provide a possible mechanism for the observation of topological $i$-wave superconductivity on the surface of PtBi$_2$ and may have implications for the broader landscape of superconducting instabilities arising from repulsive interactions on the surfaces of Weyl semimetals.", "tier": "B_IMPORTANT_CONDMAT", "score": "9", "reason": "Directly links Weyl semimetals, Fermi arcs, and unconventional superconductivity in a specific material.", "tags": ["material", "Weyl", "superconductivity"], "image": "https://arxiv.org/html/2605.31501v2/x1.png", "briefing": {"background": "위상 반금속(Weyl semimetal)의 표면에 존재하는 웨일 페르미 아크(Weyl Fermi arcs)는 위상적으로 보호된 전도 채널을 제공합니다. 이 독특한 표면 상태가 초전도성과 결합할 때 나타나는 현상에 대한 물리학적 관심이 매우 높습니다.", "motivation": "PtBi2 표면에서 실험적으로 관측된 비전통적 초전도 현상이 웨일 페르미 아크의 어떤 메커니즘에서 유래하는지 이론적으로 분석하고자 합니다.", "result": "Kohn-Luttinger 접근법을 사용하여 계산한 결과, 웨일 페르미 아크에서 i-wave 대칭성을 갖는 초전도 불안정성이 강하게 나타남을 발견했습니다.", "implication": "표면 상태에서만 발현되는 위상적 초전도체의 존재 가능성을 이론적으로 뒷받침하며, 이는 위상 물질의 전자 상관관계 연구의 중요한 이정표가 될 것입니다.", "novelty": "단순한 벌크 초전도성을 넘어, 위상 표면 상태(Fermi arc)에서의 전자 상호작용이 새로운 대칭성을 가진 초전도 상태를 유도할 수 있음을 보였다는 점이 독자의 관심사에 부합합니다.", "unresolved": "i-wave 초전도 상태가 실제 실험에서 관측된 노드(node) 구조와 정량적으로 일치하는지에 대한 미세 비교가 필요합니다.", "future_work": "다른 비중심대칭 위상 반금속 물질들에서도 유사한 Kohn-Luttinger 기제의 초전도성이 발현되는지 범용적인 탐구가 필요합니다.", "concepts": [{"term": "Weyl Fermi Arcs", "why_emerged": "Weyl 반금속의 벌크 상태가 표면에서 페르미 면을 가로지르는 특수한 상태로 나타나며, 위상적 비자명성을 증명함.", "origin": "Wan et al. (2011)에 의해 Weyl 반금속 예견과 함께 개념화됨.", "connections": "Weyl semimetal, Berry curvature, surface states."}, {"term": "Kohn-Luttinger Mechanism", "why_emerged": "약한 척력 상호작용만으로도 전자들이 어떻게 페르미 면에서 쿠퍼 쌍을 형성할 수 있는지 설명하기 위해 필요함.", "origin": "Kohn and Luttinger (1965).", "connections": "Unconventional superconductivity, pairing symmetry."}], "english_summary": ["PtBi2, a noncentrosymmetric Weyl semimetal, exhibits unconventional surface superconductivity.", "The study utilizes a Kohn-Luttinger approach to examine pairing on Weyl Fermi arcs.", "Results predict a robust i-wave superconducting instability with intra-arc nodes.", "This provides a microscopic mechanism for topological superconductivity on Weyl semimetal surfaces."]}}, {"title": "Nucleation and Enhancement of Superconductivity under Tip-Induced Strain Fields", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2607.07210", "authors": "Ghulam Mohmad, Vishal Tripathi, Goutam Sheet", "last_authors": "Vishal Tripathi, Goutam Sheet", "summary": "A metallic point contact formed on a non-superconducting or weakly superconducting material often nucleates or enhances superconductivity confined under the contact. However, no unified theoretical description of the phenomenon exists. We show that the spatially inhomogeneous, predominantly uniaxial nature of the stress field under a point contact is fundamental for such tip-induced and tip-enhanced superconductivity (TISC/TESC). We also show that the coupling of such a stress field to the electronic structure can be estimated through an experimentally measurable uniaxial coupling scale $C^{\\mathrm{exp}}$. Combining Hertzian contact mechanics with a Ginzburg-Landau variational analysis, we derive a criterion for the nucleation of TISC/TESC and determine $C^{\\mathrm{exp}}$ for twenty-one materials. For topological semimetals with ungapped band crossings, the framework explains observed critical temperatures with no free parameters and for all others, $C^{\\mathrm{exp}}$ provides a direct experimental determination of the uniaxial strain sensitivity and a target scale for microscopic theories.The work predicts TISC in elemental Sb and Y with $T_c \\approx 2.8$\\,K and $T_c \\approx 12$\\,K respectively.", "tier": "B_IMPORTANT_CONDMAT", "score": "9", "reason": "Explores tip-induced superconductivity in topological semimetals, highly relevant to STS and topologicals.; demoted from A: broad CM, not direct user/project hit", "tags": ["STS", "superconductivity", "topologicalsemimetal", "experimental"], "image": "https://arxiv.org/html/2607.07210v1/x1.png", "briefing": {"background": "물질 표면에 STM 팁과 같은 압력을 가하면 전자 구조가 변하며 초전도성이 유도되거나 강화되는 현상(TISC/TESC)이 관측되곤 합니다. 하지만 이를 설명하는 보편적인 물리적 체계는 아직 정립되지 않았습니다.", "motivation": "팁-물질 접촉에 의해 가해지는 불균일한 단축 응력(uniaxial stress)이 초전도성을 유도하는 주된 원인이라는 가설을 정량적으로 증명하고자 합니다.", "result": "Hertzian 접촉 역학을 Ginzburg-Landau 이론과 결합하여, 21개 물질에 대해 단축 응력 감도 상수(C_exp)를 도출했습니다. 특히 위상 반금속의 경우 추가 매개변수 없이 실험치와 잘 일치함을 보였습니다.", "implication": "팁으로 유도된 초전도성을 단순한 부수적 현상이 아닌, 특정 응력 반응에 기반한 물리적 과정으로 체계화했습니다.", "novelty": "STM 연구자들이 흔히 겪는 팁 압력 효과를 정량적 데이터로 변환할 수 있는 프레임워크를 제시했다는 점에서 실험적 가치가 큽니다.", "unresolved": "응력에 의한 밴드 구조 변화와 초전도성 발현 사이의 미시적 결합 메커니즘은 여전히 재료마다 다를 수 있습니다.", "future_work": "이 이론을 토대로 상압에서 초전도성을 보이지 않는 Sb나 Y 등의 물질에서 팁을 이용한 초전도성 실험이 후속될 것으로 보입니다.", "concepts": [{"term": "TISC/TESC", "why_emerged": "점접촉을 통한 압력이 초전도 상태를 유도/강화하는 현상을 지칭하기 위해 도입됨.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "Point contact spectroscopy, strain engineering."}, {"term": "Hertzian Contact Mechanics", "why_emerged": "두 탄성체 사이의 접촉 면적과 응력 분포를 계산하기 위해 19세기에 정립된 이론.", "origin": "Heinrich Hertz (1882).", "connections": "Uniaxial strain field, STM tip pressure."}], "english_summary": ["Tip-induced superconductivity (TISC) in point contacts remains theoretically poorly described.", "A framework combining Hertzian mechanics and Ginzburg-Landau theory is developed to model uniaxial strain effects.", "The model successfully explains superconductivity in various materials, especially topological semimetals.", "Uniaxial sensitivity constants are derived for 21 materials, providing quantitative predictions for future STM experiments."]}}, {"title": "Coexistence of liquid-like disordered state and weak ferromagnetism in a s = 1 kagome lattice", "journal": "npj_QuantumMaterials", "source": "Gemini", "link": "https://www.nature.com/articles/s41535-026-00917-0", "authors": "J. Khatua, Taeyun Kim, Chanhyeon Lee, et al.", "last_authors": "Hiroyuki Nojiri, Kwang-Yong Choi", "summary": "Coexistence of liquid-like disordered state and weak ferromagnetism in a s = 1 kagome lattice", "tier": "B_IMPORTANT_CONDMAT", "score": "9", "reason": "Highly relevant magnetic kagome physics.", "tags": ["kagome", "magnetism", "spin-liquid"], "image": "https://pubads.g.doubleclick.net/gampad/ad?iu=/285/npjquantmats.nature.com/article&sz=728x90&c=382828158&t=pos%3Dtop%26type%3Darticle%26artid%3Ds41535-026-00917-0%26doi%3D10.1038/s41535-026-00917-0%26subjmeta%3D119,639,766,997%26kwrd%3DCondensed-matter+physics,Magnetic+properties+and+materials", "briefing": {"background": "카고메(Kagome) 격자는 기하학적 좌절(geometrical frustration)이 강한 구조로, 양자 스핀 액체(QSL)와 같은 이국적인 자기 상태가 발현될 수 있는 핵심적인 연구 플랫폼입니다.", "motivation": "S=1 카고메 격자 시스템에서 액체와 같은 무질서 상태와 약한 강자성이 어떻게 공존하는지를 이해하고자 합니다.", "result": "S=1 카고메 격자 물질에서 장거리 자기 질서가 억제된 무질서 상태와 함께 약한 강자성 신호가 관측되었습니다.", "implication": "기하학적 좌절과 자기적 상호작용 사이의 복잡한 경쟁이 카고메 격자에서 새로운 자기 상태를 형성할 수 있음을 시사합니다.", "novelty": "AV3Sb5와 같은 카고메 금속 연구를 수행하는 사용자에게 S=1 격자에서의 스핀 거동에 대한 비교 분석 관점을 제공합니다.", "unresolved": "이 시스템에서 액체 상태의 구체적인 양자 역학적 특성 및 위상적 스핀 액체 여부는 명확하지 않습니다.", "future_work": "중성자 산란을 통한 스핀 동역학 분석 및 저온에서의 비열 측정을 통한 상태 밀도 확인이 필요합니다.", "concepts": [{"term": "카고메 격자", "why_emerged": "좌절된 자기 시스템을 연구하기 위한 기하학적 모델로 도입됨.", "origin": "일본의 바구니 짜기 방식(Kagome)에서 유래, 1950년대 Sutherland 등이 이론적 연구를 수행.", "connections": "스핀 액체, AV3Sb5 금속, 위상 절연체."}, {"term": "기하학적 좌절", "why_emerged": "격자 구조상 모든 스핀이 에너지를 최소화하며 정렬될 수 없는 상황을 설명하기 위해 필요.", "origin": "1950년대 반강자성 연구에서 기원함.", "connections": "양자 스핀 액체, 자기 단극자."}], "english_summary": ["The paper investigates the coexistence of a liquid-like disordered spin state and weak ferromagnetism in an S=1 kagome lattice.", "The findings highlight the competition between geometrical frustration and magnetic ordering.", "It serves as a valuable comparison for users studying spin phenomena in kagome-based materials."]}}, {"title": "Visualization of the Zhang–Rice singlet, electronic molecules and Cooper pair formation in a cuprate superconductor", "journal": "Nature_Physics", "source": "Gemini", "link": "https://www.nature.com/articles/s41567-026-03375-4", "authors": "Shusen Ye, Jianfa Zhao, Zhiheng Yao, et al.", "last_authors": "Changqing Jin, Yayu Wang", "summary": "How individual doped holes turn into superconducting Cooper pairs as doping increases in unc T", "score": "8", "reason": "Electronic spectroscopy (cyclotron resonance) in vdW heterostructures fits user profile well.", "tags": ["graphene", "vanderWaals", "spectroscopy"], "image": "", "briefing": {"background": "그래핀은 높은 이동도를 가지지만 스핀-궤도 결합(SOC)이 매우 작습니다. 이를 보완하기 위해 TMD(전이금속 디칼코게나이드)와 이종접합을 형성하여 물성을 조절하는 '근접 효과(proximitization)' 연구가 활발합니다.", "motivation": "TMD 근접 효과에 의해 강화된 SOC가 그래핀의 사이클로트론 공명(CR) 스펙트럼에 어떤 미세 구조를 유도하는지 이론적으로 분석하고자 합니다.", "result": "근접 효과로 유도된 SOC가 그래핀 내 Dirac 페르미온의 Landau 준위를 변화시키며, 이는 사이클로트론 공명 흡수 스펙트럼에서 명확한 미세 구조 분열로 나타남을 보여줍니다.", "implication": "이종접합 구조에서 에너지 스펙트럼과 대칭성 파괴를 정밀하게 추적할 수 있는 분광학적 방법론을 제시합니다.", "novelty": "ARPES/CD-ARPES 등을 사용하여 전자 구조를 분석하는 사용자에게, 분광 데이터 해석을 위한 이론적 가이드라인을 제공합니다.", "unresolved": "이론적 모델에서의 이상적인 접합 상태와 실제 소자 제작 시의 불순물/결함이 미치는 영향은 추가 검증이 필요합니다.", "future_work": "다양한 TMD 물질 조합에서의 오비탈 혼성 효과 연구 및 광학적 도핑 실험.", "concepts": [{"term": "근접 효과", "why_emerged": "이종 구조를 통해 한 물질이 가진 성질(예: SOC)을 다른 물질로 전이시키기 위해 사용.", "origin": "초전도 이종접합 연구에서 기원함.", "connections": "Van der Waals 이종접합, 위상 양자 컴퓨터."}, {"term": "사이클로트론 공명", "why_emerged": "자기장 내 하전 입자의 유효 질량을 측정하기 위한 핵심 분광 기술.", "origin": "1950년대 Dresselhaus 등이 처음 활용함.", "connections": "Landau 준위, 유효 질량, 전자 구조 분석."}], "english_summary": ["The study analyzes the fine structure of cyclotron resonance in graphene/TMD heterobilayers.", "SOC induced by proximity effects modifies Dirac fermion Landau levels.", "This spectral modification allows for precise characterization of SOC-induced energy shifts in vdW systems."]}}, {"title": "Magnetizing altermagnets through ultrafast asymmetric spin dynamics", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/hwy3-mt7r", "authors": "Zhaobo Zhou, Sangeeta Sharma, John Kay Dewhurst, Junjie He", "last_authors": "John Kay Dewhurst, Junjie He", "summary": "Laser pulses are known to induce symmetric demagnetization: equal loss of magnetic moments in the identical sublattices of antiferromagnets and ferromagnets at ultra : "http://link.aps.org/doi/10.1103/pppy-tmlw", "authors": "Lauro B. Braz, Luis G. G. V. Dias da Silva", "last_authors": "Lauro B. Braz, Luis G. G. V. Dias da Silva", "summary": "We investigate spin-valley instabilities and their connection to the magnetically ordered states recently observed in the twisted bilayer dichalcogenide ${\\mathrm{WSe}}_{2}$ at a 5° twist angle. Starting from an effective three-orbital faithful Wannier model for the spin-locked moiré bands, combined…", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Directly relevant to moire systems and magnetism in 2D materials.", "tags": ["material", "moire", "magnetism", "twistedbilayer"], "image": "", "briefing": {"background": "전이금속 디칼코게나이드(TMD)의 뒤틀린 이중층 구조는 모아레 격자를 형성하여 강한 전자 상관관계를 유도합니다. 이 시스템은 평탄한 밴드(flat bands)와 스핀-밸리 결합을 통해 자기적 질서와 상전이 연구의 핵심 플랫폼입니다.", "motivation": "5도 뒤틀린 WSe2에서 관측된 자기적 질서가 어떤 스핀-밸리 불안정성에 기인하는지 밝히고, 스토너(Stoner) 경계와의 관계를 명확히 하고자 합니다.", "result": "스핀-밸리 결합 모아레 밴드에 대한 바니어(Wannier) 모델링을 통해 스핀-밸리 질서 상태의 안정성과 자기적 임계 거동을 도출했습니다.", "implication": "모아레 시스템에서의 강한 상관관계가 어떻게 자기적 질서를 형성하는지에 대한 이론적 토대를 마련하며, 특정 꼬임각에서의 자성 발생 기제를 규명했습니다.", "novelty": "실제 관측된 5도 꼬임각 WSe2의 자성을 3-오비탈 모아레 모델을 통해 해석함으로써 스핀-밸리 자유도와 상관관계의 상호작용을 정량적으로 기술했습니다.", "unresolved": "다양한 꼬임각에서의 위상학적 변화와 실제 전자 구조 간의 상세한 매핑은 추가 연구가 필요합니다.", "future_work": "스캐닝 터널링 현미경(STM/STS)을 통한 로컬 전자 구조 측정과 자기장 하의 수송 측정 연계 실험이 요구됩니다.", "concepts": [{"term": "스토너 경계", "why_emerged": "밴드 페로마그네티즘 발생 조건을 설명하기 위해.", "origin": "Edmund C. Stoner (1938).", "connections": "전자 상관관계, 전이금속 자성."}, {"term": "모아레 밴드", "why_emerged": "이중층 구조의 간섭으로 인한 주기적 포텐셜 형성 효과 기술.", "origin": "최근 10년 이내 그래핀 및 TMD 연구에서 본격화.", "connections": "평탄 밴드, 강상관 전자계."}], "english_summary": ["Investigated spin-valley instabilities in 5-degree twisted bilayer WSe2.", "Developed a three-orbital Wannier model to characterize magnetic moiré states.", "Identified the influence of spin-locked bands on Stoner-type magnetic order.", "Provides a theoretical framework for magnetism in TMD moiré superlattices."]}}, {"title": "Origin of the anomalous Hall effect in a disordered ferromagnetic Ho1.25Au0.75Si1.55 single crystal", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/vxhm-jv21", "authors": "Shoucai Yue, Nan Zhou, Lanxin Liu, et al.", "last_authors": "Xuan Luo, Yuping Sun", "summary": "The anomalous Hall effect (AHE) serves as a pivotal transport phenomenon for deciphering the interplay between magnetic spin textures and topological bands in magnetic materials, with its origin attributed to intrinsic (momentum-space Berry curvature linked to Weyl or Dirac point) and extrinsic (spi…", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "AHE, Weyl/Dirac, and Berry curvature in a magnetic single crystal.", "tags": ["experiment", "anomalousHall", "Weyl", "Berrycurvature"], "image": "", "briefing": {"background": "이상홀효과(AHE)는 자성 물질에서 자화와 전하 수송 간의 결합을 연구하는 핵심 지표입니다. 최근 위상물질 연구에서 운동량 공간의 베리 곡률(Berry curvature)이 AHE의 근본 원인 중 하나로 강조되고 있습니다.", "motivation": "무질서도가 존재하는 강자성 단결정 Ho1.25Au0.75Si1.55에서 나타나는 AHE의 기원을 내재적(Intrinsic, 베리 곡률) 기제와 외재적(Extrinsic, 산란) 기제 측면에서 분석하고자 합니다.", "result": "수송 측정 및 해석을 통해 이 물질의 AHE가 주로 내재적 메커니즘인 베리 곡률에 기인함을 밝혔으며, 이는 위상적 밴드 구조(Weyl/Dirac point)와 밀접한 연관이 있음을 시사합니다.", "implication": "희토류 화합물에서 복잡한 자기 구조와 위상 밴드의 상호작용을 AHE를 통해 제어할 수 있는 가능성을 확인했습니다.", "novelty": "무질서한 계임에도 불구하고 베리 곡률에 의한 내재적 AHE가 지배적임을 입증하여, 위상 자성 물질 설계 시 산란 효과보다 밴드 기하학의 중요성을 강조했습니다.", "unresolved": "Ho 이온의 4f 전자와 전도 전자의 복잡한 상호작용이 베리 곡률에 미치는 정밀한 기여도는 완벽히 분리되지 않았습니다.", "future_work": "ARPES를 통한 실제 전자 밴드 구조의 직접 관측 및 위상 마디(nodal points) 확인이 필요합니다.", "concepts": [{"term": "이상홀효과 (AHE)", "why_emerged": "자성체에서 자기장 없이도 자화에 의해 발생하는 홀전압 설명.", "origin": "Edwin Hall (1881), 이후 Karplus와 Luttinger (1954)가 이론화.", "connections": "베리 곡률, 위상 절연체, 스핀 궤도 결합."}, {"term": "베리 곡률", "why_emerged": "운동량 공간에서 파동함수의 기하학적 위상 변화를 기술하기 위해.", "origin": "Michael Berry (1984).", "connections": "비정상 속도, 이상홀효과, 위상 마디."}], "english_summary": ["Analyzed the anomalous Hall effect in disordered Ho1.25Au0.75Si1.55.", "Determined that the intrinsic Berry curvature is the dominant driver of the AHE.", "Highlights the role of topological band features in magnetic rare-earth compounds.", "Suggests that band geometry outweighs scattering in this magnetic system."]}}, {"title": "Prediction of the Hubbard U parameter from scanning tunneling microscopy images of moiré systems using image recognition", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/bfbh-2xv6", "authors": "Nachiket Tanksale, Tobias Stauber", "last_authors": "Nachiket Tanksale, Tobias Stauber", "summary": "The atomistic Hubbard interaction $U$, representing the on-site Coulomb repulsion, serves as a pivotal parameter in theoretical models describing correlated systems, yet its precise experimental determination, especially in moiré systems, remains challenging. Scanning tunneling microscopy (STM) prov…", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Excellent methodology for STM in moire/correlated systems.", "tags": ["method", "STM", "Hubbard", "moiré"], "image": "", "briefing": {"background": "강한 상관관계 전자계 시스템에서 Hubbard U 파라미터는 물리적 특성을 결정짓는 핵심 상수이지만, 실험적으로 이를 직접 추출하기는 매우 어렵습니다.", "motivation": "모아레 격자 시스템의 STM 이미지를 활용하여 머신러닝 기반 이미지 인식 기술로 Hubbard U를 정량화하는 효율적인 방법을 개발하고자 함.", "result": "STM 이미지 패턴을 통해 해당 시스템의 국부적인 상호작용 세기인 U 파라미터를 예측할 수 있는 머신러닝 프레임워크를 제안.", "implication": "복잡한 모아레 시스템에서 이론적 모델 파라미터를 실험 데이터로부터 직접 도출함으로써 물질 설계 및 분석 속도를 획기적으로 높일 수 있음.", "novelty": "이론적 계산 의존도를 낮추고 STM 데이터를 직접적인 파라미터 결정의 도구로 활용했다는 점에서 실험-이론 결합의 새로운 모델을 제시함.", "unresolved": "다양한 모아레 시스템에 대한 범용성 확인과 실험적 노이즈가 예측 정밀도에 미치는 영향에 대한 정량적 분석.", "future_work": "실제 실험 데이터(STM)에 대한 검증 수행 및 다양한 모아레 시스템으로의 알고리즘 확장.", "concepts": [{"term": "Hubbard U", "why_emerged": "전자 간 강한 쿨롱 반발력을 고려하기 위해.", "origin": "John Hubbard(1963).", "connections": "Mott insulator, Slater-Hubbard 모델."}, {"term": "Moiré system", "why_emerged": "격자 불일치로 인한 새로운 전자 상태 제어.", "ori iferroicity and correlated orders in 2D LuFeO3 films.", "tags": ["multiferroicity", "2Dmaterials", "correlatedelectrons", "experiment", "thinfilms"], "image": "", "briefing": {"background": "강유전성과 자기 질서가 공존하는 다강체 물질은 복잡한 양자 현상의 핵심이며 차세대 메모리 소자 후보입니다. 그러나 2차원 극한으로 두께를 줄이면 탈분극 효과와 차원성 감소로 인해 이러한 질서가 파괴되는 것이 일반적입니다.", "motivation": "2차원 극한에서도 다강체 성질이 유지될 수 있는지, 그리고 박막 환경에서 이들 질서의 거동을 확인하기 위해 육방정계 LuFeO3 박막을 연구했습니다.", "result": "LuFeO3 박막에서 2차원 극한까지 강유전성과 자기 질서가 유지됨을 확인했습니다.", "implication": "2차원 한계에서도 강한 상관관계가 유지됨을 증명하여 나노 스케일 다강체 소자 구현 가능성을 제시합니다.", "novelty": "2차원 다강체 물질에서의 질서 유지는 응집물질물리에서 매우 도전적인 과제이며, 스핀-격자 결합 연구에 중요한 실마리를 제공합니다.", "unresolved": "이 시스템에서 강유전성과 자기 질서 간의 미세한 상호작용 메커니즘과 그 결합 강도의 상세한 전개 방식은 명확하지 않습니다.", "future_work": "저온 환경에서의 자기광학 측정이나 박막의 결함 제어를 통한 강유전성 도메인 관찰 등이 필요합니다.", "concepts": [{"term": "다강체 (Multiferroic)", "why_emerged": "강유전성과 자기 성질을 동시에 활용하여 저전력 메모리 소자를 만들기 위해 등장했습니다.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "스핀트로닉스, 강유전체 메모리(FeRAM)"}, {"term": "탈분극 효과 (Depolarization effect)", "why_emerged": "박막 두께가 얇아질 때 내부 분극에 의한 전장으로 인해 강유전성이 억제되는 물리적 한계입니다.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "2차원 강유전체, 스크리닝 효과"}], "english_summary": ["Explores multiferroicity in 2D limit of hexagonal LuFeO3 thin films.", "Demonstrates coexistence of ferroelectric and magnetic orders despite size reduction.", "Suggests viability of 2D multiferroic materials for nanodevices.", "Addresses fundamental challenges of depolarization in thin-film correlated systems."]}}, {"title": "Orbital Altermagnetism in Two Dimensions", "journal": "PRL_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/l8fc-dp36", "authors": "Mingxiang Pan, Feng Liu, Huaqing Huang", "last_authors": "Feng Liu, Huaqing Huang", "summary": "We introduce the concept of orbital altermagnetism , a symmetry-protected magnetic order of pure orbital degrees of freedom. It is characterized with ordered antiparallel orbital magnetic moments in real space but momentum-dependent orbital band splittings, analogous to spin altermagnetism. Using a m…", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Theoretical proposal of orbital altermagnetism in two-dimensional systems.", "tags": ["altermagnetism", "2Dmaterials", "theory", "magneticorder"], "image": "", "briefing": {"background": "기존의 강자성(ferromagnetism)이나 반강자성(antiferromagnetism)을 넘어, 최근 얼터마그네티즘(Altermagnetism)은 스핀 분할과 대칭성 보존이 공존하는 새로운 자기 질서로 주목받고 있습니다.", "motivation": "스핀 자유도가 아닌 궤도(orbital) 자유도에서도 이러한 얼터마그네틱 특성이 나타날 수 있는지 이론적으로 탐구하고자 합니다.", "result": "순수 궤도 자유도의 정렬을 통한 '궤도 얼터마그네티즘'의 존재 가능성을 제시하고, 운동량 의존적 궤도 밴드 분할을 규명했습니다.", "implication": "스핀 없이도 궤도 상태만으로 스핀트로닉스와 유사한 정보 처리가 가능한 궤도트로닉스(Orbitronics)의 이론적 토대를 확장합니다.", "novelty": "스핀 기반 얼터마그네티즘 개념을 궤도로 확장하여, 자기 모멘트가 없는 물질에서도 밴드 구조를 제어할 수 있는 새로운 물리 기작을 제안했습니다.", "unresolved": "실제 실험적으로 이 궤도 분할을 검증할 수 있는 구체적인 물질 후보군과 실험 방법론은 추가 연구가 필요합니다.", "future_work": "특정 2차원 격자 구조에서의 DFT 계산을 통해 예측된 밴드 구조를 시연하고, 수송 특성 계산으로 이어져야 합니다.", "concepts": [{"term": "얼터마그네티즘 (Altermagnetism)", "why_emerged": "반강자성처럼 순자성이 없으면서도 강자성처럼 밴드 분할을 갖는 물질을 기술하기 위해 등장했습니다.", "origin": "최근 2020년대 초반 연구 그룹들에 의해 확립됨", "connections": "스핀-궤도 결합, 궤도트로닉스, 반강자성"}, {"term": "궤도 자유도 (Orbital degrees of freedom)", "why_emerged": "스핀 자유도 외에 전자의 궤도 상태가 시스템의 물리적 성질을 결정하는 중요한 변수로 인식되었습니다.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "궤도 정렬(Orbital ordering), 강한 상관관계"}], "english_summary": ["Introduces orbital altermagnetism in 2D systems.", "Proposes an ordered state of purely orbital magnetic moments.", "Shows momentum-dependent orbital band splitting without net spin moments.", "Expands the horizon of orbitronics and symmetry-protected magnetic phases."]}}, {"title": "Quantum-Geometry-Induced Anomalous Chiral Transport and Hidden Symmetry Breaking in Centrosymmetric 2M−WS2", "journal": "PRL_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/43cm-lhrk", "authors": "Hang Cui, Shao-Bo Liu, Erqing Wang, et al.", "last_authors": "X.-C. Xie, Jian-Hao Chen", "summary": "Chirality, a widely existing material property in nature that involves breaking the left-right symmetry, has had profound influence on various fields of natural sciences. Nonlinear responses, such as electronic magnetochiral anisotropy (eMChA), have been recognized as sensitive probes for the effect…", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Anomalous chiral transport and symmetry breaking in a centrosymmetric 2D material.", "tags": ["transport", "chiralphysics", "quantumgeometry", "2Dmaterials", "WS2"], "image": "", "briefing": {"background": "반전 대칭성을 가진 물질에서는 선형적인 전기 수송 응답이 지배적이지만, 최근 양자 기하학적 효과가 나타나면서 비선형적인 전기적 현상이 주목받고 있습니다.", "motivation": "반전 대칭성을 가진 2M-WS2에서 왜 비정상적인 카이랄 수송 현상이 나타나는지 규명하기 위해 연구를 진행했습니다.", "result": "양자 기하학적 효과에 의한 비정상 카이랄 수송과 숨겨진 대칭성 파괴를 확인했습니다.", "implication": "반전 대칭 중심을 가진 물질에서도 특정 조건 하에 강한 비선형 응답이 가능함을 보이며, 이는 새로운 소자 설계에 활용될 수 있습니다.", "novelty": "기존 반전 대칭 물질에서 무시되었던 비선형 수송 현상을 양자 기하학 관점에서 체계적으로 해석했습니다.", "unresolved": "시스템 내부의 구체적인 미시적 대칭성 파괴 기작과 이것이 어떻게 카이랄 수송으로 연결되는지에 대한 이론적 정교화가 더 필요합니다.", "future_work": "다양한 반전 대칭 물질들에서의 비선형 응답 체계적 탐색 및 자기장 하에서의 추가적인 수송 특성 연구가 요구됩니다.", "concepts": [{"term": "비선형 전기 자기카이랄 이방성 (eMChA)", "why_emerged": "물질의 카이랄성과 비대칭성을 민감하게 측정하기 위한 비선형적 척도로 사용됩니다.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "카이랄성, 비선형 응답, 베리 곡률"}, {"term": "양자 기하학 (Quantum Geometry)", "why_emerged": "브릴루앙 영역에서의 전자 파동함수의 기하학적 성질이 수송 현상에 미치는 영향을 이해하기 위해 필요합니다.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "베리 곡률, 퀀텀 매트릭, 위상 물성"}], "english_summary": ["Studies anomalous chiral transport in centrosymmetric 2M-WS2.", "Relates transport phenomena to quantum geometry and hidden symmetry breaking.", "Uses eMChA to probe nonlinear electronic responses.", "Advances understanding of nonlinear transport in non-magnetic, centrosymmetric materials."]}}, {"title": "Superconductivity from Phonon-Mediated Retardation in a Single-Flavor Metal", "journal": "PRL_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/dcn2-lc8k", "authors": "Yang-Zhi Chou, Jihang Zhu, Jay D. Sau, Sankar Das Sarma", "last_authors": "Jay D. Sau, Sankar Das Sarma", "summary": "We study phonon-mediated pairings in a single-flavor metal with a tunable Berry curvature. In the absence of Berry curvature, we discover an unexpected possibility: $p$-wave superconductivity emerging purely from the retardation effect, while the static Bardeen-Cooper-Schrieffer (BCS) approximation …", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Theoretical insights into p-wave superconductivity in metals with Berry curvature, relevant to unconventional SC.", "tags": ["superconductivity", "Berrycurvature", "theory", "phonons"], "image": "", "briefing": {"background": "전통적인 BCS 이론은 포논 매개 상호작용이 즉각적(instantaneous)이라고 가정하지만, 실제로는 포논의 지연 효과(retardation effect)가 존재합니다. 고전적인 s-wave와 달리, 이 효과가 비전통적인 스핀 삼중항(p-wave) 초전도성을 유도할 수 있는지 여부는 강상관 전자계 물리에서 중요한 논쟁거리입니다.", "motivation": "단일-플래이버(single-flavor) 금속 모델에서 베리 곡률(Berry curvature)과 포논 매개 상호작용이 결합했을 때, 기존 BCS 근사치를 벗어난 새로운 초전도 쌍 형성 기작이 나타날 수 있는지 이론적으로 탐구하고자 합니다.", "result": "베리 곡률이 없는 경우에도 지연 효과만으로 p-wave 초전도성이 발현될 수 있음을 발견했습니다. 이는 정적인 BCS 근사치에서는 무시되었던 물리적 현상입니다.", "implication": "초전도성 발현 기작에 있어 포논-전자 상호작용의 지연 효과가 예상보다 훨씬 강력할 수 있음을 시사하며, 비전통적 초전도체 탐색에서 베리 곡률의 역할을 재조명합니다.", "novelty": "베리 곡률을 튜닝 가능한 파라미터로 두어 위상적 성질과 초전도성 간의 상관관계를 탐구한 점이 독자 연구 분야(위상물질 및 초전도성)와 맞닿아 있습니다.", "unresolved": "실제 고체 물질에서의 격자 진동과 구체적인 밴드 구조에서의 정량적 검증이 부족합니다.", "future_work": "베리 곡률이 존재하는 실제 다밴드 금속에서의 전이 온도 계산 및 위상적 초전도성과의 연계성 연구.", "concepts": [{"term": "Retardation effect", "why_emerged": "전자와 포논의 속도 차이로 인해 상호작용이 즉각적이지 않고 지연됨을 고려하기 위해 도입.", "origin": "Morel과 Anderson (1962).", "connections": "BCS 이론의 한계를 극복하고 강한 전자-포논 결합 시스템의 초전도 전이 온도를 설명하는 핵심 개념."}, {"term": "Berry curvature", "why_emerged": "운동량 공간에서의 파동함수 기하학적 위상 구조를 기술하기 위해 필요.", "origin": "Michael Berry (1984).", "connections": "이상 홀 효과, 위상 절연체 및 최근 kagome 금속의 전자 구조 연구와 직결."}], "english_summary": ["Analyzes phonon-mediated pairing in a single-flavor metal with tunable Berry curvature.", "Identifies that retardation effects alone can induce p-wave superconductivity, bypassing static BCS limits.", "Challenges the traditional neglect of retardation in characterizing superconducting order parameters.", "Highlights the potential for geometric phases to influence unconventional pairing symmetries."]}}, {"title": "Tailoring Pure Valley-Zeeman Spin-Orbit Coupling in WSe2-Encapsulated Monolayer Graphene", "journal": "PRL_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/46n3-pryp", "authors": "Yaqing Han, Siqi Jiang, Jingkuan Xiao, et al.", "last_authors": "Lei Wang, Geliang Yu", "summary": "Clearly resolved Landau levels reveal a symmetry-enforced Landau-level reordering driven by competition between fixed valley–Zeeman splitting and magnetic-field-dependent cyclotron energy.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Relevant experimental study on graphene/vdW heterostructures and Landau level physics.", "tags": ["graphene", "monolayer", "Landaulevel"], "image": "", "briefing": {"background": "WSe2와 같은 전이금속 디칼코게나이드(TMD)로 캡슐화된 그래핀은 스핀-궤도 결합(SOC)이 유도되어 독특한 밴드 분할을 보입니다. 이는 양자 홀 효과와 스핀트로닉스 연구의 중요한 플랫폼입니다.", "motivation": "WSe2와의 근접 효과(proximity effect)를 통해 그래핀 내의 밸리-제만(valley-Zeeman) 결합을 정밀하게 제어하고, 자기장 하에서의 란다우 준위 진화를 이해하고자 합니다.", "result": "자기장 증가에 따른 사이클로트론 에너지와 밸리-제만 분할 간의 경쟁으로 인해 란다우 준위의 재정렬(reordering)이 일어남을 관측했습니다.", "implication": "밴드 구조를 외부 캡슐화 층으로 엔지니어링하여 위상학적 상태나 스핀 의존적 수송 특성을 정밀 제어할 수 있음을 보여줍니다.", "novelty": "그래핀의 란다우 준위 구조를 실험적으로 해상하여 대칭성에 의해 강제된 준위 변화를 명확히 규명했습니다.", "unresolved": "온도 변화에 따른 준위 재정렬의 안정성 및 다른 vdW 이질구조와의 차이점.", "future_work": "재정렬된 란다우 준위를 이용한 비전통적 양자 홀 상태나 밸리 편극 현상의 제어.", "concepts": [{"term": "Valley-Zeeman coupling", "why_emerged": "TMD와의 근접 효과로 그래핀에 도입되는 밸리 비대칭 스핀-궤도 상호작용을 설명하기 위함.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "위상적 밴드 엔지니어링, 스핀-밸리 고정(spin-valley locking)."}, {"term": "Landau level reordering", "why_emerged": "외부 자기장과 고유의 에너지 스케일 사이의 경쟁을 설명하기 위해 도입.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "양자 홀 효과, 다체 상호작용에 의한 대칭성 깨짐."}], "english_summary": ["Investigates Landau level evolution in WSe2-encapsulated graphene.", "Observes a symmetry-enforced Landau level reordering due to the competition between cyclotron and valley-Zeeman energy scales.", "Demonstrates precise tailoring of band structure via van der Waals proximity effects.", "Provides experimental insights into magnetic field-dependent spin-valley physics."]}}, {"title": "Ab Initio Investigation of Pressure Effects in the Spin-Liquid Candidate Y-Kapellasite", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2607.07341", "authors": "Federico Abbruciati, Aleksandar Razpopov, Joao Elias F. S. Rodrigues, et al.", "last_authors": "Pascal Puphal, Bj\\\"orn Wehinger", "summary": "Motivated by recent experiments showing pressure-induced suppression of magnetic order and the emergence of a dynamical ground state in the anisotropic kagome antiferromagnet Y-kapellasite Y3Cu9(OH)19Cl8, we perform ab initio density functional theory (DFT)calculations to investigate the evolution of magnetic exchange interactions under hydrostatic pressure. We show that pressure efficiently tunes the magnetic Hamiltonian by altering the CuOCu bond geometry, thereby driving the system towards a spin-liquid regime. This evolution is governed by a nonlinear dependence of the dominant exchange coupling on the CuOCu bond angle. We further examine the influence of hydrogen positions and find that both the OH bond length and the hydrogen out-of-plane angle strongly affect the magnetic interactions. Our results provide a microscopic explanation for the experimentally observed pressure-induced enhancement of frustration and highlight the key role of hydrogen geometry.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "DFT study of magnetic exchange and spin liquid state in a kagome antiferromagnet under pressure.", "tags": ["kagome", "antiferromagnet", "spinliquid", "DFT"], "image": "https://arxiv.org/html/2607.07341v1/Figures/j_vs_cu_o_cu_angle.png", "briefing": {"background": "Kagome 격자를 가진 자성체는 기하학적 좌절(frustration)로 인해 양자 스핀 액체(QSL) 후보 물질로 주목받습니다. 외부 압력은 격자 구조를 변화시켜 자기적 교환 상호작용을 조절하는 핵심 도구입니다.", "motivation": "Y-kapellasite 물질이 압력 하에서 왜 자기 질서가 억제되고 스핀 액체 상태가 유도되는지, 그 미시적 원인을 이론적으로 규명하고자 합니다.", "result": "압력이 Cu-O-Cu 결합 각도를 변형시켜 지배적인 자기 교환 상호작용을 비선형적으로 변화시키며, 수소 위치(OH 결합)가 이 자기적 환경 형성에 결정적임을 밝혀냈습니다.", "implication": "Kagome 물질의 자기적 특성은 미세한 구조적 섭동에 매우 민감하며, 수소 원자의 정밀한 위치 결정이 강상관 물성 연구에 필수적임을 시사합니다.", "novelty": "Kagome 반강자성체의 압력-유도 스핀 액체 상태를 DFT 계산으로 미시적 구조 변화와 연관 지어 설명한 점이 우수합니다.", "unresolved": "압력 하에서의 정확한 스핀 액체 상태의 위상적 성질이나 들뜸 스펙트럼의 구체적 변화.", "future_work": "압력을 가한 상태에서의 중성자 산란 실험 및 구체적인 자기 엑시테이션 분석.", "concepts": [{"term": "Kagome antiferromagnet", "why_emerged": "코너를 공유하는 삼각형 격자 구조에서 발생하는 강한 기하학적 좌절을 연구하기 위해 필요.", "origin": "Syozi (1951).", "connections": "AV3Sb5 시리즈, 양자 스핀 액체, 자기적 위상 물질."}, {"term": "Spin-liquid regime", "why_emerged": "절대 영도에서도 자기 질서가 나타나지 않는 양자 얽힘 상태를 기술하기 위함.", "origin": "Anderson (1973).", "connections": "고온 초전도체, 양자 정보, 위상 정렬(topological order)."}], "english_summary": ["Performs DFT calculations on the kagome antiferromagnet Y-kapellasite under hydrostatic pressure.", "Links pressure-induced suppression of magnetic order to changes in Cu-O-Cu bond geometry.", "Identifies hydrogen positions as critical factors for magnetic exchange interactions.", "Provides a microscopic pathway for achieving a spin-liquid regime via structural tuning."]}}, {"title": "Band splitting in the altermagnet CrSb", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2602.15131", "authors": "Vladimir P. Mineev", "last_authors": "Vladimir P. Mineev", "summary": "Altermagnets are a class of metallic magnets characterized by spin-split electron bands. Like antiferromagnets they lack spontaneous bulk magnetisation. The initial description of the momentum dependent spin splitting of electron bands in altermagnets was based on the spin groups approach, which is valid when relativistic interactions are neglected. Then the spin-orbit coupling has been taken into account according with time-reversal-odd, even-parity irreducible representations of centrosymmetric point groups considered by R.M.Fernandes et al, Phys.Rev.B {\\bf 109}, 024404 (2024). Here we show inadequacy of this formal approach. The problem of electron band splitting should be discussed based on crystal symmetry of concrete altermagnet material. The band spin-splitting in hexagonal altermagnet CrSb is established using magnetic groups formalism that allows to find the additional spin splitting missed in frame of exchange approximation. Another type of spin splitting takes place in so called hidden altermagnets. This type materials do not possess symmetry in respect of space and time inversion but are symmetric in respect of the product of these operations known as toroid symmetry. There is demonstrated the real space spin splitting in materials with toroid symmetry.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Direct relevance to altermagnetism and electronic band splitting in magnetic materials.", "tags": ["material", "altermagnet", "electronicstructure"], "image": "https://arxiv.org/html/2602.15131v3/x1.png", "briefing": {"background": "알터마그넷(Altermagnet)은 순자화는 없지만 대칭성으로 인해 전자 밴드의 스핀 분할이 발생하는 새로운 자성 물질군입니다. 최근 이론물리학에서 비상적인 스핀-궤도 결합(SOC) 효과와 대칭성 분석의 정확성을 두고 활발한 논의가 진행 중입니다.", "motivation": "기존의 스핀 그룹(spin group) 접근법이나 일반적인 표현론은 특정 물질의 구체적인 결정 구조와 결합했을 때 스핀 분할을 정확히 예측하지 못할 수 있다는 한계를 지적하고자 합니다.", "result": "육각형 구조의 CrSb 알터마그넷을 예로 들어, 자기 군(magnetic groups) 형식을 활용해 교환 근사(exchange approximation)에서는 간과되었던 추가적인 스핀 분할이 존재함을 입증했습니다. 또한, '숨겨진 알터마그넷(hidden altermagnets)'이라 불리는 토로이드 대칭성 물질에서의 실공간 스핀 분할 메커니즘을 제시했습니다.", "implication": "알터마그넷의 전자 구조 분석 시 표준적인 이론적 접근을 넘어 각 물질의 개별적인 결정학적 대칭성을 고려하는 것이 필수적임을 시사합니다.", "novelty": "기존 문헌의 형식적 접근법이 가진 불충분함을 비판하며, 보다 엄밀한 자기 군 분석을 도입해 CrSb의 전자 밴드 구조 해석을 정밀화했습니다. 이는 알터마그넷의 전자 구조와 물리적 특성을 탐구하는 연구자들에게 필수적인 이론적 수정안입니다.", "unresolved": "실제 실험적 측정(예: ARPES) 데이터와의 정량적 일치 여부는 추가적인 연구가 필요합니다.", "future_work": "다른 알터마그넷 후보 물질들에 대해 해당 자기 군 분석법을 적용하고 실험적인 ARPES 검증이 기대됩니다.", "concepts": [{"term": "알터마그넷", "why_emerged": "기존 강자성체와 반강자성체의 분류를 넘어, 순자화 없이도 밴드 스핀 분할을 보이는 새로운 물질군을 정의할 필요성 때문입니다.", "origin": "최근 2020년대 초반 이론적 정립 및 후보 물질 탐색 활발.", "connections": "반강자성체, 스핀-궤도 결합, 비전통적 초전도체."}, {"term": "자기 군(Magnetic groups)", "why_emerged": "시간 반전 대칭이 깨진 자기 구조를 기술하기 위해 고전적인 결정 군을 확장할 필요가 있었습니다.", "origin": "1950년대 Shubnikov 등에 의해 정립.", "connections": "결정 군, 시간 반전 대칭, 비가역적 자성 현상."}, {"term": "토로이드 대칭(Toroid symmetry)", "why_emerged": "공간 반전과 시간 반전이 각각 깨져 있지만, 두 연산의 곱에 대해 대칭적인 상태를 기술하기 위해 도입되었습니다.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "다강체, 자기전기 효과."}], "english_summary": ["Critically examines current theoretical approaches to band splitting in altermagnets.", "Demonstrates that standard spin group/irreducible representation approaches can miss crucial splitting features.", "Utilizes magnetic group formalism to refine the electronic band structure of hexagonal CrSb.", "Identifies new spin-splitting mechanisms in hidden altermagnets with toroid symmetry.", "Argues for material-specific symmetry analysis over generalized theoretical models."]}}, {"title": "C-BerryTrans: A C++ code for first-principles calculation of Berry-curvature-driven anomalous Hall and Nernst conductivities", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2509.24071", "authors": "Vivek Pandey, Sudhir K. Pandey", "last_authors": "Vivek Pandey, Sudhir K. Pandey", "summary": "We present C-BerryTrans , a C++ code designed for first-principles calculations of Berry-curvature-driven transverse transport properties, namely the anomalous Hall conductivity (AHC) i.e. , σ μ ​ ν A ​ H ​ C \\sigma_{\\mu\\nu}^{AHC} and anomalous Nernst conductivity (ANC) i.e. , α μ ​ ν A ​ N ​ C \\alpha_{\\mu\\nu}^{ANC} . The code directly extracts eigenvalues and momentum-matrix elements from WIEN2k calculations and evaluates the Berry curvature ( 𝛀 \\bm{\\Omega} ) using a Kubo-like formalism, thereby avoiding the interpolation errors inherent in Wannier-based approaches. To ensure computational efficiency, C-BerryTrans parallelizes 𝛀 \\bm{\\Omega} evaluation over k -points using OpenMP and stores band-resolved curvature data in binary format, significantly reducing memory usage. This design enables rapid post-processing of AHC and ANC over a wide range of temperature ( T T ) and chemical potential ( ω \\omega ) values in a single run. The code has been benchmarked on well-studied ferromagnetic materials- Fe, Fe 3 Ge, Pd, Fe 3 Al, and Co 2 FeAl. For Fe, the σ x ​ y A ​ H ​ C \\sigma_{xy}^{AHC} is obtained to be ∼ \\sim 775 ( ∼ \\sim 744) S / c ​ m S/cm at 0 (300) K K . In case of Fe 3 Ge, the calculated value of σ x ​ y A ​ H ​ C \\sigma_{xy}^{AHC} is found to be 311 S / c ​ m S/cm at 300 K K . Nextly, for Co 2 FeAl, the magnitude of computed value of σ x ​ y A ​ H ​ C \\sigma_{xy}^{AHC} at 2 K K is found to be ∼ \\sim 56 S / c ​ m S/cm . Moving further, the room temperature magnitude of α x ​ y A ​ N ​ C \\alpha_{xy}^{ANC} for Pd is obtained to be ∼ \\sim 0.97 A ​ K − 1 ​ m − 1 AK^{-1}m^{-1} . In case of Fe 3 Al, the maximum magnitude of α x ​ y A ​ N ​ C \\alpha_{xy}^{ANC} for T ≤ T\\leq 500 K K is computed as ∼ \\sim 2.83 A ​ K − 1 ​ m − 1 AK^{-1}m^{-1} . Lastly, for Co 2 FeAl, the value of α x ​ y A ​ N ​ C \\alpha_{xy}^{ANC} is obtained to be ∼ \\sim 0.10 A ​ K − 1 ​ m − 1 AK^{-1}m^{-1} at 300 K K . These results show excellent agreement with previously reported data. With its accuracy, scalability, and user-friendly workflow, C-BerryTrans provides a powerful tool for exploring 𝛀 \\bm{\\Omega} -driven transport phenomena and is well suited for high-throughput materials discovery. The code further enables the evaluation of 𝛀 \\bm{\\Omega} -derived AHC/ANC contributions along user-defined high-symmetry k -point paths. This provides valuable microscopic insight into how specific band-structure features contribute to 𝛀 \\bm{\\Omega} -driven AHC/ANC. Additionally, the code is equipped with a visualization module that allows analysis of k -point contributions to AHC or ANC in any material. This further enhances its capability for exploring topological materials. Program summary - Program Title : C-BerryTrans Program Files doi : Developer’s repository link : https://sourceforge.net/projects/c-berrytrans/ Licensing provisions : GNU General Public License 3.0 Programming language : C++ External routines/libraries : cmath, vector, chrono, omp.h, cstdlib, string Nature of problem : The code evaluates the AHC and ANC within the ab initio framework. It first computes the 𝛀 \\bm{\\Omega} using the Kubo formula, where the eigenvalues and momentum-matrix elements are directly extracted from first-principles calculations carried out with WIEN2k. The obtained 𝛀 \\bm{\\Omega} is then integrated over the entire Brillouin zone (BZ). For AHC, the integration is weighted by the Fermi–Dirac distribution to include the effect of electronic occupation at different values of ω \\omega and T T . For ANC, the same formalism is extended by incorporating the entropy function weighting, thereby capturing the thermoelectric response arising from the 𝛀 \\bm{\\Omega} .", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Valuable tool for calculating Berry-curvature-driven transport in relevant magnetic topological materials.", "tags": ["Berry-curvature", "anomalous-Hall", "transport", "software"], "image": "https://arxiv.org/html/2509.24071v3/x1.png", "briefing": {"background": "위상적 물질과 강자성체에서 나타나는 Berry 곡률(Berry curvature) 기반의 수송 현상은 Anomalous Hall (AHC) 및 Nernst (ANC) 전도도를 통해 측정됩니다. 이를 ab initio 단계에서 계산하는 것은 topological 물질 설계의 핵심입니다.", "motivation": "기존 Wannier 보간법의 오차를 피하고, WIEN2k 계산 결과를 직접 활용하여 대규모 수송 계산을 효율적이고 정확하게 수행할 수 있는 오픈 소스 도구를 구축하고자 했습니다.", "result": "WIEN2k와 연 ng sign-problem-free quantum Monte Carlo simulations of the attractive Bernevig-Hughes-Zhang (BHZ) Hubbard model, we obtain a quantum phase transition as a function of interaction strength for different impurity densities. In the clean limit, the system develops bulk superconductivity for Hubbard interaction $\\vert U \\vert$ above a finite critical strength. Interestingly, strong impurities significantly reduce such $\\vert U \\vert$ required for the onset of superconductivity. Our calculations indicate that Cooper pairing first nucleates in subgap ring states surrounding the impurities and then evolves into a globally coherent superconducting phase. Our results demonstrate that impurity-generated bound states can promote superconductivity in systems with strong quantum geometry. This mechanism is expected to be relevant in nearly flat-band systems like moir\\'e materials where quantum geometry plays a dominant role.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Theoretical study on disorder-driven superconductivity in topological insulators, relevant to moiré systems.", "tags": ["topologicalinsulator", "superconductivity", "theory", "moire"], "image": "https://arxiv.org/html/2607.07163v1/x1.png", "briefing": {"background": "위상 절연체(TI)에서의 무질서(disorder)는 단순히 산란을 일으키는 인자가 아니라, 양자 기하학(quantum geometry)과 결합하여 새로운 양자 상태를 창발시키는 중요한 요소가 될 수 있습니다.", "motivation": "BHZ 모델 시스템에서 무질서가 어떻게 초전도 결합을 강화하는지, 그리고 이 과정이 단순한 불순물 효과를 넘어 양자 기하학적 효과와 어떻게 연결되는지 탐구하고자 했습니다.", "result": "무질서가 강한 경우, 임계 상호작용 강도(Hubbard U)가 낮아짐에도 불구하고 초전도성이 발현됨을 발견했습니다. 불순물 주변에 형성된 국소 결합 상태(bound states)가 초전도성의 핵이 되어 전체적인 결합으로 발전함을 확인했습니다.", "implication": "Moiré 평탄 밴드(flat-band) 물질 등 양자 기하학이 지배적인 시스템에서 무질서를 역이용하여 초전도성을 제어할 수 있는 가능성을 제시합니다.", "novelty": "무질서를 파괴적인 요소로 보지 않고, 초전도성의 조력자로 재해석했습니다. 이는 moiré 격자 시스템이나 강상관 물질 연구자에게 새로운 설계 방향을 제시합니다.", "unresolved": "불순물의 밀도나 형태에 따른 최적화 조건은 모델마다 다를 수 있으며, 실제 실험적으로 무질서를 완벽히 제어하기 어렵다는 점이 과제입니다.", "future_work": "다양한 moiré 물질 기반 시스템에서의 실험적 검증 및 다른 형태의 disorder와의 상호작용 연구.", "concepts": [{"term": "Quantum geometry", "why_emerged": "평탄 밴드 시스템에서 파동함수의 중첩 구조(Fubini-Study metric)가 물리 현상에 미치는 영향을 기술하기 위해.", "origin": "최근 10년 내 활발히 정립된 개념.", "connections": "Berry curvature, Moiré 밴드, 초전도성."}, {"term": "BHZ Hubbard model", "why_emerged": "위상 절연체에서 전자 간 상호작용과 위상적 특성을 동시에 연구하기 위한 최소 모델.", "origin": "Bernevig, Hughes, Zhang (2006).", "connections": "Quantum Spin Hall effect, Topological insulators."}, {"term": "Moiré materials", "why_emerged": "두 2D 물질 층을 엇갈려 쌓아 밴드폭을 조절하는 창발적 연구 플랫폼.", "origin": "Jarillo-Herrero 그룹 등 (2018).", "connections": "Twisted bilayer graphene, flat bands."}], "english_summary": ["Investigates disorder-induced superconductivity in quantum spin Hall insulators.", "Uses quantum Monte Carlo simulations on the BHZ Hubbard model.", "Finds that impurities can promote superconductivity via quantum geometry effects.", "Identifies that Cooper pairing nucleates in impurity-induced subgap states.", "Provides insights relevant to superconducting transitions in flat-band moiré systems."]}}, {"title": "Floquet-Weyl states at one-photon resonances in three-dimensional topological insulators", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2607.07199", "authors": "Keiya Uehara, Ryo Okugawa, Takami Tohyama, Shun Okumura", "last_authors": "Takami Tohyama, Shun Okumura", "summary": "Quantum materials exhibit exotic phases and electronic responses under irradiation by circularly polarized light, which breaks time-reversal symmetry and generates Floquet replica bands. Recently, Floquet topological states arising from direct resonances have attracted much attention, e.g., the emergence of Floquet-Weyl points at a one-photon resonance, rather than topological features within the modulated original bands via high-frequency expansion. In this study, we investigate the effects of a one-photon resonance in a representative three-dimensional topological insulator, Bi$_2$Se$_3$, applying Floquet theory
