<!DOCTYPE html>

<head>
<meta charset='UTF-8'>
<meta name='viewport' content='width=device-width, initial-scale=1.0'>
<title>Daily Paper Slideshow</title>
<style>
  :root {
    color-scheme: light;
    --bg: #f6f7f4;
    --paper: #ffffff;
    --ink: #111827;
    --muted: #64748b;
    --line: #d8ddd2;
    --accent: #176b87;
    --accent-2: #9a3412;
  }
  * { box-sizing: border-box; }
  body { margin: 0; height: 100vh; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: var(--bg); color: var(--ink); }
  .shell { max-width: 1500px; height: 100vh; margin: 0 auto; padding: 14px 18px; display: flex; flex-direction: column; }
  .topbar { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 16px; }
  .top-actions { display: flex; align-items: center; gap: 10px; }
  .topbar a, button { border: 1px solid var(--line); border-radius: 8px; background: var(--paper); color: var(--ink); padding: 10px 14px; font-weight: 700; text-decoration: none; cursor: pointer; }
  button.primary { background: var(--accent); border-color: var(--accent); color: white; }
  button:disabled { opacity: 0.45; cursor: not-allowed; }
  .counter { color: var(--muted); font-weight: 700; }
  .slide { height: calc(100vh - 82px); background: var(--paper); border: 1px solid var(--line); border-radius: 10px; padding: 18px; box-shadow: 0 18px 42px rgba(15, 23, 42, 0.10); display: grid; grid-template-columns: minmax(310px, 0.86fr) minmax(0, 1.55fr); gap: 18px; overflow: hidden; }
  .paper-head { min-width: 0; min-height: 0; overflow: hidden; display: flex; flex-direction: column; gap: 12px; }
  .figure { margin: 0; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: #f8fafc; }
  .figure img { display: block; width: 100%; max-height: 41vh; object-fit: contain; background: white; }
  .figure figcaption { padding: 7px 10px; color: var(--muted); font-size: 12px; line-height: 1.3; }
  .head-text { display: flex; flex-direction: column; gap: 9px; min-width: 0; }
  .badges { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .badge { border-radius: 999px; padding: 5px 9px; background: #eef2ff; color: #3730a3; font-size: 12px; font-weight: 800; }
  .score { background: #fee2e2; color: #991b1b; }
  h1 { margin: 0; font-size: 25px; line-height: 1.15; letter-spacing: 0; overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
  h1 a { color: inherit; text-decoration-color: rgba(23, 107, 135, 0.35); text-decoration-thickness: 2px; text-underline-offset: 4px; }
  h1 a:hover { color: var(--accent); text-decoration-color: var(--accent); }
  .meta, .authors, .why, .abstract { font-size: 13px; line-height: 1.45; }
  .meta, .authors { color: var(--muted); }
  .why strong, .abstract strong, .authors strong { color: var(--ink); }
  .authors { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .why { border-left: 4px solid var(--accent-2); padding-left: 10px; color: #374151; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .abstract { border-top: 1px solid var(--line); padding-top: 14px; color: #374151; }
  .original-abstract { margin-top: auto; border-top: 1px solid var(--line); padding-top: 10px; color: #374151; font-size: 11.5px; line-height: 1.35; max-height: 20vh; overflow: auto; }
  .original-abstract strong { display: block; margin-bottom: 4px; color: var(--ink); }
  .tags { display: flex; flex-wrap: wrap; gap: 8px; }
  .tag { border-radius: 999px; padding: 4px 8px; background: #f1f5f9; color: #475569; font-size: 12px; font-weight: 700; }
  .head-text > .link { display: none; }
  .briefing { min-width: 0; min-height: 0; overflow: auto; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); grid-auto-rows: minmax(0, auto); align-content: start; gap: 11px 18px; border-top: 0; padding-top: 0; }
  .brief-section { min-width: 0; }
  .brief-section.wide { grid-column: 1 / -1; }
  .brief-section h2 { margin: 0 0 4px; font-size: 14px; line-height: 1.22; color: #0f766e; letter-spacing: 0; }
  .brief-section p, .brief-section li { margin: 0; font-size: 12.5px; line-height: 1.42; color: #1f2937; overflow-wrap: anywhere; }
  .brief-section ul { margin: 0; padding-left: 20px; }
  .concepts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 9px 14px; }
  .concept { border-top: 1px solid var(--line); padding-top: 7px; }
  .concept h3 { margin: 0 0 4px; font-size: 13px; color: #7c2d12; letter-spacing: 0; }
  .concept p { margin: 2px 0 0; font-size: 11.5px; line-height: 1.35; color: #374151; overflow-wrap: anywhere; }
  .concept b { color: #111827; }
  .link { color: var(--accent); font-weight: 800; text-decoration: none; }
  .empty { padding: 48px; background: var(--paper); border: 1px solid var(--line); border-radius: 12px; color: var(--muted); }
  @media (max-width: 860px) {
    body { height: auto; overflow: auto; }
    .shell { padding: 14px; }
    .topbar, .top-actions { align-items: stretch; flex-direction: column; }
    .slide, .briefing, .concepts { grid-template-columns: 1fr; }
    .slide { height: auto; overflow: visible; display: grid; }
    h1 { font-size: 28px; }
  }
</style>

<script>
const slides = [{"title": "Electronic Origin of Delicate Antiferromagnetism in FexNbS2", "journal": "PRL_Recent", "source": "author whitelist", "link": "http://link.aps.org/doi/10.1103/99yr-nqbx", "authors": "Wenxin Li, Jonathan T. Reichanadter, Shan Wu, et al.", "last_authors": "Jeffrey B. Neaton, Yu He", "summary": "Author(s): Wenxin Li, Jonathan T. Reichanadter, Shan Wu, Ji Seop Oh, Rourav Basak, Shannon C. Haley, Siqi Wang, Joshua E. Chaparro Mata, Elio Vescovo, Donghui Lu, Makoto Hashimoto, Christoph Klewe, Suchismita Sarker, Jessica L. McChesney, Alex Frañó, James G. Analytis, Robert J. Birgeneau, Jeffrey B. Neaton, and Yu He A combination of ARPES, XAS, and DFT shows a dramatic eV-scale electronic restructuring in Fe x NbS 2 , similar to what happens in correlated oxides, and suggests electronic correlations play a central role in the magnetism of Fe-intercalated transition-metal dichalcogenides. [Phys. Rev. Lett. 136, 216503] Published Wed May 27, 2026", "tier": "A_MUST_READ", "score": "10", "reason": "author whitelist: Donghui Lu", "tags": ["ARPES", "STS", "correlated", "ferromagnet", "antiferromagnet"], "image": "", "briefing": {"background": "전이금속 디칼코게나이드(TMDC)인 NbS2에 철(Fe)과 같은 자기 이온을 삽입(intercalation)하면 다양한 자성 및 수송 특성이 나타납니다. 이러한 시스템은 전통적으로 삽입된 원자가 단순한 도펀트 역할을 한다고 여겨져 왔으나, 실제로는 복잡한 전자 구조의 변화가 자기 정렬에 기여할 가능성이 큽니다.", "motivation": "Fe_xNbS2 시스템에서 나타나는 미묘한 반강자성(AFM)의 전자적 기원을 규명하기 위해, ARPES와 XAS 등 직접적인 분광학적 방법과 DFT 계산을 결합하여 전자 구조의 대대적인 재구성을 관찰하고자 했습니다.", "result": "연구팀은 Fe 삽입 시 수 eV 규모의 거대한 전자 구조 재구성(restructuring)이 일어남을 발견했습니다. 이는 강상관 산화물에서나 볼 수 있는 현상으로, 전자 상관관계(electronic correlations)가 Fe-intercalated TMDC의 자성을 결정하는 데 핵심적인 역할을 한다는 것을 보여줍니다.", "implication": "이 결과는 삽입된 TMDC 시스템을 단순히 '금속 내의 자성 불순물' 모델로 보는 것을 넘어, 강상관 전자계의 프레임워크에서 이해해야 함을 시사합니다. 이는 새로운 자성 조절 메커니즘을 제공할 수 있습니다.", "novelty": "ARPES 전문가인 Donghui Lu 등이 참여하여 고해상도 전자 구조 측정을 통해 자성의 기원을 밝혀냈으며, 단순 도핑이 아닌 '전자 구조 재구성'이라는 관점을 제시한 점이 독창적입니다. 독자가 관심을 가진 ARPES와 강상관 시스템의 교차점에 있는 연구입니다.", "unresolved": "초록상으로는 특정 Fe 농도에 따른 자성 전이의 정교한 상도표 변화나, 상관관계의 정확한 강도(U 값 등)가 물질 전체의 거시적 물성과 어떻게 정량적으로 매칭되는지는 더 확인이 필요해 보입니다.", "future_work": "다른 삽입 원소(Co, Ni 등)나 다양한 농도에서의 ARPES 측정을 통해 이 '전자 재구성' 현상이 일반적인지 확인하고, 이를 이용한 스핀트로닉스 소자 응용 연구가 기대됩니다.", "concepts": [{"term": "ARPES (각분해 광전자 분광법)", "why_emerged": "고체 내 전자의 에너지와 운동량 관계(밴드 구조)를 직접 측정하기 위해 고안되었습니다.", "origin": "20세기 중반 광전효과를 기반으로 발전했으나, 1980년대 이후 고온 초전도체 연구와 함께 급격히 정밀화됨.", "connections": "STS(주사 터널링 분광법)와 상호보완적이며, 최근 CD-ARPES, spin-ARPES 등으로 확장 중."}, {"term": "Electronic Correlation (전자 상관관계)", "why_emerged": "독립 입자 근사(Independent particle approximation)로 설명할 수 없는 전하량 및 스핀 간의 강한 상호작용을 설명하기 위해 등장했습니다.", "origin": "Mott, Hubbard 등에 의해 이론적 기틀이 마련됨.", "connections": "모트 절연체, 고온 초전도, 중성 페르미온 시스템 등과 깊은 관련이 있음."}, {"term": "Intercalation (삽입)", "why_emerged": "층상 구조 물질의 층 사이 공간에 이물질을 넣어 물성을 획기적으로 조절하기 위해 사용됩니다.", "origin": "화학적 합성법으로 오래전부터 알려짐; 리튬 이온 배터리가 대표적 응용 사례.", "connections": "2D 물질의 반데르발스 갭, 흑연 층간 화합물(GIC) 등과 연결됨."}], "english_summary": ["Combined ARPES, XAS, and DFT study reveals eV-scale electronic restructuring in Fe-intercalated NbS2.", "The discovery suggests that electronic correlations, similar to those in oxides, govern the delicate antiferromagnetism.", "Challenges the traditional view of intercalated TMDCs as simple doped metallic systems.", "Highlights the critical role of many-body effects in the magnetic properties of layered materials."]}}, {"title": "Symmetry-Broken Ground State and Phonon-Mediated Superconductivity in Kagome CsV3Sb5", "journal": "PRL_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/4r8x-j3nd", "authors": "Manex Alkorta, Martin Gutierrez-Amigo, Đorđe Dangić, et al.", "last_authors": "Maia G. Vergniory, Ion Errea", "summary": "Author(s): Manex Alkorta, Martin Gutierrez-Amigo, Đorđe Dangić, Chunyu Mark Guo, Philip J. W. Moll, Maia G. Vergniory, and Ion Errea The newly discovered family of nonmagnetic kagome metals ${\\mathrm{AV}}_{3}{\\mathrm{Sb}}_{5}$ ($\\mathrm{A}=\\mathrm{K}$, Rb, or Cs) provides a unique platform for exploring the interplay between charge-density wave (CDW) order, superconductivity, nontrivial topology, and spontaneous time-reversal sym… [Phys. Rev. Lett. 136, 206401] Published Fri May 22, 2026", "tier": "A_MUST_READ", "score": "10", "reason": "Direct hit: experimental/theory paper on CsV3Sb5 kagome metal, CDW, superconductivity, and TRSB.", "tags": ["kagome", "CsV3Sb5", "CDW", "superconductivity", "TRSB", "topological", "phonon"], "image": "", "briefing": {"background": "Kagome 격자 구조를 가진 AV3Sb5(A=K, Rb, Cs) 물질은 전하 밀도파(CDW), 초전도성, 위상적 특성, 그리고 시간 반전 대칭성 깨짐(TRSB)이 공존하거나 경쟁하는 흥미로운 플랫폼입니다.", "motivation": "CsV3Sb5에서 나타나는 대칭성 깨짐 상태의 정체와, 이 시스템의 초전도성이 전형적인 포논 매개(phonon-mediated) 방식인지 아니면 비전통적인 방식인지를 명확히 규명하고자 했습니다.", "result": "연구진은 대칭성이 깨진 기저 상태를 분석하고 포논 매개 초전도 메커니즘을 제안했습니다. 특히 CDW 상태 내에서 포논의 역할을 계산적으로 검증하여 초전도 발생 원인을 설명하고자 했습니다.", "implication": "만약 초전도성이 포논 매개임이 확실해진다면, 이 물질에서 관측되는 TRSB나 비정상 홀 효과와 같은 특이 현상들이 초전도 자체보다는 CDW나 전자 구조의 위상적 성질에서 기인한다는 해석에 힘을 실어줍니다.", "novelty": "Kagome 금속의 초전도 기원에 대한 논쟁(포논 vs 스핀 유동 등) 속에서, 정밀한 이론적/계산적 접근을 통해 포논 매개 시나리오를 지지하는 결과를 제시했습니다. 독자의 핵심 관심사인 CsV3Sb5와 CDW/SC 관계를 직접 다룹니다.", "unresolved": "실험적으로 관측된 시간 반전 대칭성 깨짐(TRSB)이 포논 매개 초전도와 어떻게 조화를 이루는지, 혹은 CDW의 루프 전류(loop current) 가설과 어떻게 연결되는지는 여전히 논의가 필요합니다.", "future_work": "압력이나 도핑에 따른 CDW와 초전도성의 변화를 계산된 포논 스펙트럼과 대조하는 추가 실험 및 이론 연구가 필요합니다.", "concepts": [{"term": "Kagome Metal (카고메 금속)", "why_emerged": "좌절된 자성(frustrated magnetism)과 플랫 밴드, Dirac 페르미온을 동시에 연구하기 위해 도입된 격자 구조입니다.", "origin": "전통적인 일본 바구니 패턴에서 유래; Syozi(1951) 등이 통계 역학 모델로 연구 시작.", "connections": "Dirac 반금속, 플랫 밴드 강상관 물리, 양자 스핀 액체 등과 연결됨."}, {"term": "CDW (전하 밀도파)", "why_emerged": "저차원 금속에서 전자-포논 상호작용으로 인해 전하 밀도가 주기적으로 변조되며 에너지를 낮추는 현상을 설명하기 위해 등장했습니다.", "origin": "Peierls(1930년대)가 이론적 토대 마련.", "connections": "Peierls 왜곡, 페르미 면 네스팅(nesting), 초전도와의 경쟁 관계."}, {"term": "TRSB (시간 반전 대칭성 깨짐)", "why_emerged": "외부 자기장 없이도 시스템의 스핀이나 전류 루프 등에 의해 시간 방향을 바꿨을 때 물리량이 변하는 상태를 정의하기 위해 필요합니다.", "origin": "자성체 연구에서 기본적으로 다루어짐; 최근 비자성 CDW에서의 TRSB가 화두임.", "connections": "비정상 홀 효과, 루프 전류 모델, 위상 초전도체."}], "english_summary": ["Investigates the symmetry-broken ground state and the origin of superconductivity in the kagome metal CsV3Sb5.", "Proposes a phonon-mediated mechanism for superconductivity within the charge-density wave (CDW) phase.", "Addresses the complex interplay between topology, CDW, and spontaneous time-reversal symmetry breaking.", "Provides theoretical support for conventional pairing in a system known for unconventional electronic orders."]}}, {"title": "Bosonization solution of the Kondo lattice in a Luttinger liquid", "journal": "PRB_Recent", "source": "keyword", "link": "http://link.aps.org/doi/10.1103/7sdw-cdzp", "authors": "Tomás Bortolin, C. J. Bolech, Nayana Shah, Aníbal Iucci", "last_authors": "Nayana Shah, Aníbal Iucci", "summary": "Author(s): Tomás Bortolin, C. J. Bolech, Nayana Shah, and Aníbal Iucci We address the physics of a regular arrangement of independent magnetic impurities embedded in a band of interacting electrons. We focus on the one-dimensional case that can be studied using bosonization and in which the electron bulk is described by a Luttinger liquid. The impurity spins interact w… [Phys. Rev. B 113, 195151] Published Wed May 27, 2026", "tier": "A_MUST_READ", "score": "9", "reason": "title strong match: Luttinger liquid", "tags": ["Luttinger", "Kondo"], "image": "", "briefing": {"background": "1차원 계에서 상호작용하는 전자들은 페르미 액체 이론 대신 루팅어 액체(Luttinger liquid) 이론으로 설명됩니다. 여기에 주기적인 자성 불순물이 결합된 콘도 격자(Kondo lattice) 모델은 저차원 강상관 물리 연구의 핵심 주제입니다.", "motivation": "루팅어 액체 내에 매몰된 자기 불순물 배열(콘도 격자)의 물리적 특성을 보존화(bosonization) 기법을 통해 해석적으로 해결하고자 했습니다.", "result": "보존화 방법을 사용하여 1차원 콘도 격자 모델의 해를 구했습니다. 상호작용하는 전자 벌크(bulk) 내에서 불순물 스핀과 전도 전자 간의 상호작용이 시스템의 기저 상태와 여기 상태에 미치는 영향을 분석했습니다.", "implication": "1차원 시스템에서의 스핀-전하 분리 현상과 콘도 스크리닝이 어떻게 공존하거나 변형되는지에 대한 엄밀한 이론적 틀을 제공합니다. 이는 NbSe3나 112 텔루라이드 같은 준1차원 물질 연구의 기초가 됩니다.", "novelty": "복잡한 다체 문제인 콘도 격자를 루팅어 액체 환경에서 보존화 기법으로 접근하여 분석적인 통찰을 제공했다는 점이 중요합니다. 1D 물리와 Luttinger liquid에 관심 있는 독자에게 이론적 배경을 제공합니다.", "unresolved": "이론적 모델이 실제 물질(예: NbNiTe2)의 복잡한 밴드 구조나 이방성을 얼마나 정확히 모사할 수 있는지, 그리고 유한한 온도 효과가 어떻게 나타나는지는 추가 연구가 필요합니다.", "future_work": "실제 준1차원 도금(doped) 물질에서의 수송 계수 측정값과 이론적 예측치를 비교하는 연구가 이어질 것으로 보입니다.", "concepts": [{"term": "Luttinger Liquid (루팅어 액체)", "why_emerged": "1차원에서는 아주 작은 상호작용도 페르미 액체 근사를 무너뜨리기 때문에 이를 대체할 새로운 패러다임이 필요했습니다.", "origin": "Haldane(1981)이 Tomonaga와 Luttinger의 초기 연구를 바탕으로 일반화함.", "connections": "스핀-전하 분리, 멱함수 법칙(power-law) 상관 함수, 준1차원 도체."}, {"term": "Bosonization (보존화)", "why_emerged": "1차원 페르미온 시스템의 상호작용 문제를 보존(boson) 필드로 변환하여 조화 진동자 문제처럼 쉽게 풀기 위해 고안되었습니다.", "origin": "Tomonaga(1950), Luttinger(1963) 등이 기초를 닦음.", "connections": "1차원 양자 현장론, 루팅어 액체 이론의 핵심 도구."}, {"term": "Kondo Lattice (콘도 격자)", "why_emerged": "금속 내의 희박한 자성 불순물 현상(콘도 효과)을 넘어, 규칙적으로 배열된 국소 스핀과 전도 전자의 집단적 상호작용을 다루기 위해 등장했습니다.", "origin": "Doniach(1977) 등이 무거운 페르미온 시스템 설명을 위해 제안.", "connections": "무거운 페르미온, RKKY 상호작용, 양자 임계점."}], "english_summary": ["Provides an analytical solution for the Kondo lattice model embedded in a 1D Luttinger liquid using bosonization.", "Explores the interplay between bulk electron interactions and a regular array of magnetic impurities.", "Theoretical framework for understanding spin-charge separation and Kondo screening in one dimension.", "Relevant for quasi-1D materials and strongly correlated 1D quantum systems."]}}, {"title": "Emergence of a distinct density wave state in ultrathin VSe2 films", "journal": "PRB_Recent", "source": "author whitelist", "link": "http://link.aps.org/doi/10.1103/w4s8-fckc", "authors": "Sen Liao, Xiuhua Chen, Yuzhe Wang, et al.", "last_authors": "Donglai Feng, Juan Jiang", "summary": "Author(s): Sen Liao, Xiuhua Chen, Yuzhe Wang, Rui Xu, Jianghao Yao, Yilin Wang, Donglai Feng, and Juan Jiang Dimensionality critically governs correlated states, often inducing emergent ground states in reduced dimensions. While ${\\mathrm{VSe}}_{2}$ has been studied extensively, its monolayer ground state remains controversial. Here, we resolve these issues by investigating the thickness-dependent evolutio… [Phys. Rev. B 113, 195142] Published Thu May 21, 2026", "tier": "A_MUST_READ", "score": "9", "reason": "author whitelist: Donglai Feng", "tags": ["monolayer", "correlated"], "image": "", "briefing": {"background": "전이금속 디칼코게나이드(TMD) 중 하나인 VSe2는 전하 밀도 파동(CDW)과 상관 관계가 얽혀 있는 대표적인 물질입니다. 특히 물질의 두께가 원자층 수준(monolayer)으로 얇아지면 차원성의 감소로 인해 벌크와는 다른 새로운 양자 상태가 나타날 수 있어 물리적 관심도가 높습니다.", "motivation": "VSe2 단층(monolayer)의 바닥 상태(CDW 대칭성, 자성 유무 등)에 대해서는 그동안 실험 결과들이 서로 엇갈리며 논란이 되어 왔습니다. 본 연구는 두께 변화에 따른 전자 구조 진화를 추적하여 이 논란을 해결하고자 합니다.", "result": "연구팀은 극박막 VSe2 필름에서 벌크와는 확연히 구분되는 독특한 밀도 파동(density wave) 상태가 출현함을 확인했습니다. 이는 특정 두께 임계점에서 전자 구조가 급격히 변하며 새로운 대칭성을 가진 정렬 상태가 형성됨을 시사합니다.", "implication": "단층 TMD의 물성이 단순히 벌크의 연장선이 아니라, 차원 구속 효과에 의해 완전히 새로운 대칭성을 가질 수 있음을 입증했습니다. 이는 바나듐 계열 화합물의 CDW 기전 이해에 중요한 단서를 제공합니다.", "novelty": "ARPES 권위자인 Donglai Feng 교수 그룹의 연구로, 단층 VSe2의 바닥 상태에 대한 기존의 혼란을 정리하고 새로운 밀도 파동 상태를 명확히 제시했다는 점이 핵심입니다. 독자의 관심사인 Kagome 금속(AV3Sb5)의 CDW 연구와도 연관성이 높습니다.", "unresolved": "초록 정보만으로는 새로 발견된 밀도 파동 상태의 구체적인 공간적 대칭성(예: 4x4 vs 2x2)이나 자성과의 결합 여부를 완벽히 알기 어려우며, 기판과의 격자 부정합 효과에 대한 추가 검증이 필요할 수 있습니다.", "future_work": "새로운 밀도 파동 상태가 외부 변수(압력, 도핑, 전계 효과)에 의해 어떻게 제어되는지, 그리고 이 상태에서 변칙 홀 효과나 자성이 나타나는지에 대한 후속 연구가 예상됩니다.", "concepts": [{"term": "전하 밀도 파동 (CDW)", "why_emerged": "금속 내 전하 밀도가 주기적으로 변조되면서 격자 왜곡을 동반하는 현상을 설명하기 위해 도입되었습니다.", "origin": "Rudolf Peierls (1930년대 이론적 예측)", "connections": "Kagome 금속, 1차원 Luttinger 액체, 초전도와의 경쟁 관계"}, {"term": "VSe2", "why_emerged": "바나듐 기반 TMD로서 강한 전자 상관관계와 CDW를 동시에 연구하기 위한 플랫폼 물질로 주목받았습니다.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "VsV3Sb5 (Kagome), TaSe2, 자성 TMD"}], "english_summary": ["Investigated the thickness-dependent electronic evolution of VSe2 thin films.", "Identified a distinct density wave state in the ultrathin limit, different from the bulk.", "Resolved long-standing controversies regarding the monolayer ground state of VSe2.", "Highlights the critical role of dimensionality in governing emergent correlated phases."]}}, {"title": "Soft and hard x-ray orbital-resolved photoemission study of a strongly correlated Cd-Ce quasicrystal approximant", "journal": "PRB_Recent", "source": "keyword", "link": "http://link.aps.org/doi/10.1103/4bz3-ccqt", "authors": "Goro Nozue, Hidenori Fujiwara, Satoru Hamamoto, et al.", "last_authors": "Ryuji Tamura, Akira Sekiyama", "summary": "Author(s): Goro Nozue, Hidenori Fujiwara, Satoru Hamamoto, Miwa Tsutsumi, Akane Ose, Takayuki Kiss, Atsushi Higashiya, Atsushi Yamasaki, Yuina Kanai-Nakata, Shin Imada, Masaki Oura, Kenji Tamasaku, Makina Yabashi, Tetsuya Ishikawa, Farid Labib, Shintaro Suzuki, Ryuji Tamura, and Akira Sekiyama We have investigated the orbital-dependent electronic states of ${\\mathrm{Cd}}_{6}\\mathrm{Ce}$, a prototype of strongly correlated rare-earth-based Tsai-type quasicrystals and approximants (ACs) by soft and hard x-ray photoemission spectroscopy. Our results reveal that the $4f$ orbitals are predomin… [Phys. Rev. B 113, 205147] Published Tue May 26, 2026", "tier": "A_MUST_READ", "score": "9", "reason": "title strong match: photoemission", "tags": ["photoemission", "correlated"], "image": "", "briefing": {"background": "준결정(Quasicrystal)은 주기성은 없지만 장범위 질서를 가진 독특한 구조입니다. 이 중 희토류를 포함한 Tsai-type 준결정 근사체(Approximant)는 강한 전자 상관관계와 무거운 페르미온(heavy fermion) 특성을 보일 수 있어 고체물리적 관심 대상입니다.", "motivation": "강하게 상관된 Cd6Ce 준결정 근사체에서 Ce 4f 오비탈이 전체 전자 구조와 어떻게 결합하고 기여하는지를 오비탈 수준에서 정밀하게 파악하고자 했습니다.", "result": "연엑스선(SX) 및 경엑스선(HX) 광전자 분광법(PES)을 결합하여 Cd6Ce의 오비탈 분해 전자 상태를 규명했습니다. 특히 Ce 4f 오비탈이 특정 에너지 영역에 국재화되어 있으며, 이것이 시스템의 강한 상관관계를 주도함을 확인했습니다.", "implication": "준결정 시스템에서도 결정질 물질과 마찬가지로 4f 전자와 전도 전자 사이의 혼성(c-f hybridization)이 물리적 성질을 결정하는 핵심 요소임을 보여줍니다.", "novelty": "독자의 주요 관심사인 ARPES/PES 기법을 활용하여, 일반적인 결정이 아닌 복잡한 준결정 근사체의 오비탈 구조를 명확히 분리해냈다는 점이 돋보입니다. HX-PES를 통해 벌크 민감도를 확보한 결과입니다.", "unresolved": "준결정의 비주기적 특성이 전자 산란 및 결맞음(coherence)에 미치는 구체적인 영향과, 저온에서 나타날 수 있는 양자 임계 현상과의 연결 고리는 추가 연구가 필요합니다.", "future_work": "온도 변화에 따른 오비탈 혼성 강도의 변화 측정 및 운동량 분해(ARPES)를 통한 밴드 구조의 직접적인 시각화 시도가 이어질 것으로 보입니다.", "concepts": [{"term": "준결정 근사체 (Approximant)", "why_emerged": "비주기적인 준결정의 국부 구조를 가진 주기적 결정을 통해 준결정의 물성을 근사적으로 연구하기 위해 도입되었습니다.", "origin": "Linus Pauling 및 Dan Shechtman의 논쟁 과정에서 발전", "connections": "Tsai-type cluster, 무거운 페르미온, Kondo 격자"}, {"term": "HX-PES (Hard X-ray PES)", "why_emerged": "기존 광전자 분광법의 표면 민감도를 극복하고 물질 내부(bulk)의 전자 상태를 직접 측정하기 위해 고에너지 광원이 필요했습니다.", "origin": "방사광 가속기 기술 발전과 함께 성숙", "connections": "ARPES, SX-PES, 벌크 전자 구조"}], "english_summary": ["Studied the orbital-resolved electronic states of the Cd6Ce quasicrystal approximant.", "Combined soft and hard x-ray photoemission spectroscopy to probe Ce 4f states.", "Demonstrated strong correlation effects originating from localized 4f orbitals.", "Provides insights into the heavy-fermion-like behavior in Tsai-type materials."]}}, {"title": "Tracking the local order parameter through the Hubbard exciton decoherence time in the Mott-Hubbard insulator LaVO3", "journal": "PRB_Recent", "source": "author whitelist", "link": "http://link.aps.org/doi/10.1103/9zzp-8gkz", "authors": "Alessandra Milloch, Paolo Franceschini, Pablo Villar-Arribi, et al.", "last_authors": "Massimo Capone, Claudio Giannetti", "summary": "Author(s): Alessandra Milloch, Paolo Franceschini, Pablo Villar-Arribi, Sandeep Kumar Chaluvadi, Pasquale Orgiani, Giancarlo Panaccione, Giorgio Rossi, Yang Liu, Darrell G. Schlom, Kyle M. Shen, Massimo Capone, and Claudio Giannetti The prototypical Mott-Hubbard insulator ${\\mathrm{LaVO}}_{3}$ undergoes a structural phase transition accompanied by the onset of spin and orbital ordering below 140 K. By combining ultrafast optical pump-probe spectroscopy and two-dimensional electronic spectroscopy, we investigate the interplay be… [Phys. Rev. B 113, 205146] Published Tue May 26, 2026", "tier": "A_MUST_READ", "score": "9", "reason": "author whitelist: Kyle M. Shen", "tags": ["Mott", "Hubbard"], "image": "", "briefing": {"background": "LaVO3는 전형적인 모트-허바드 절연체로, 저온에서 구조 상전이와 함께 스핀 및 오비탈 정렬이 일어납니다. 이러한 상관계 물질에서 여기자(exciton)의 거동은 물질의 질서 파라미터(order parameter)와 밀접하게 연결되어 있습니다.", "motivation": "모트 절연체 내에서 생성된 '허바드 여기자(Hubbard exciton)'의 결맞음 상실(decoherence) 시간이 시스템의 국부적 질서 파라미터와 어떤 정량적 관계를 갖는지 추적하고자 했습니다.", "result": "초고속 펌프-프로브 및 2차원 전자 분광법을 통해, 허바드 여기자의 결맞음 시간이 140K 부근의 상전이 온도에서 급격히 변하며 국부적 질서 파라미터를 그대로 반영함을 발견했습니다.", "implication": "초고속 동역학 측정이 단순히 평형 상태를 깨는 것을 넘어, 물질의 정적인 질서(order)와 위상 전이를 정밀하게 모니터링하는 도구가 될 수 있음을 시사합니다.", "novelty": "Kyle M. Shen 등 저명한 연구자가 참여하였으며, '허바드 여기자'라는 개념을 통해 모트 절연체의 상전이를 시분해 분광학으로 해석한 점이 독창적입니다. 상관계 물질의 오비탈 정렬에 관심 있는 독자에게 유용합니다.", "unresolved": "실험에서 관측된 결맞음 상실의 주요 기전이 스핀 산란인지 혹은 격자 진동(phonon)과의 결합인지에 대한 명확한 분리가 추가적으로 요구됩니다.", "future_work": "다른 모트 절연체(예: cuprates, nickelates)에서도 유사한 허바드 여기자 동역학이 나타나는지 확인하여 이 방법론의 보편성을 검증할 것으로 보입니다.", "concepts": [{"term": "모트-허바드 절연체", "why_emerged": "밴드 이론상 금속이어야 하나 전자 간의 강한 쿨롱 반발력 때문에 절연체가 되는 현상을 설명하기 위해 등장했습니다.", "origin": "Nevill Mott, John Hubbard (1960년대)", "connections": "구프레이트 초전도체, MIT (Metal-Insulator Transition)"}, {"term": "허바드 여기자 (Hubbard Exciton)", "why_emerged": "모트 절연체에서 전자-정공 쌍이 아닌, 상부/하부 허바드 밴드 사이의 들뜸 상태가 형성하는 결합 상태를 설명하기 위해 도입되었습니다.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "상관 전자계, 광학적 갭, 2D 전자 분광법"}], "english_summary": ["Used ultrafast 2D electronic spectroscopy to study Hubbard excitons in LaVO3.", "Found that exciton decoherence time tracks the local order parameter below 140 K.", "Demonstrated a link between ultrafast dynamics and spin/orbital ordering.", "Establishes decoherence spectroscopy as a probe for phase transitions in Mott insulators."]}}, {"title": "Nodeless superconducting gap and electron-boson coupling in (La,Pr,Sm) 3 Ni 2 O 7 films", "journal": "Science", "source": "Gemini", "link": "https://doi.org/10.1126/science.adw8329", "authors": "Jianchang Shen, Guangdi Zhou, Yu Miao, et al.", "last_authors": "Junfeng He, Zhuoyu Chen", "summary": "The discovery of superconductivity in Ruddlesden-Popper (RP) bilayer nickelate films under ambient pressure provides an opportunity to directly investigate electronic energy scales of the superconducting state and the pairing mechanism. We report angle-resolved photoemission spectroscopy measurements of superconducting (La,Pr,Sm) 3 Ni 2 O 7 thin films by developing an ultra-high vacuum cryogenic sample quenching and transfer technique. A superconducting gap of ~18 meV with coherence peaks is observed along the Brillouin zone diagonal. The finite gap persists across the entire Brillouin zone, revealing the absence of gap nodes. A kink is observed in the energy-momentum dispersion at ~70 meV below Fermi level, indicating an electron-boson coupling. The simultaneous observation of a nodeless superconducting gap and electron-boson coupling provides insight into the pairing symmetry and gluing mechanism in RP bilayer nickelates.", "tier": "A_MUST_READ", "score": "9", "reason": "ARPES study of unconventional nickelate superconductivity; highly relevant to user's interests.", "tags": ["ARPES", "superconductivity", "nickelates", "electron-bosoncoupling"], "image": "", "briefing": {"background": "Ruddlesden-Popper(RP) 구조를 가진 니켈레이트(Nickelates) 계열 화합물은 구리 산화물(Cuprates)과 유사한 고온 초전도 메커니즘을 가질 것으로 기대되어 최근 응집물질 물리학계에서 가장 뜨거운 관심을 받는 대상이다. 특히 La3Ni2O7은 고압 환경에서 약 80K의 초전도성을 보였으나, ARPES와 같은 정밀한 전자 구조 측정을 위해서는 상압에서 안정적인 박막 시료가 필수적이었다.", "motivation": "상압에서 초전도성을 보이는 (La,Pr,Sm)3Ni2O7 이중층 박막을 제작하고, 초고진공 극저온 시료 전송 기술을 활용하여 이 물질의 초전도 갭(gap)의 대칭성과 전하-보존체 결합(electron-boson coupling) 특성을 직접 확인하고자 하였다.", "result": "ARPES 측정을 통해 브릴루앙 영역의 대각선 방향을 포함한 전 영역에서 노드(node)가 없는 약 18 meV 크기의 초전도 갭을 관찰하였다. 또한, 페르미 준위 아래 약 70 meV 지점에서 분산 관계의 꺾임(kink) 현상을 발견하여 전자와 특정 보존체 사이의 강한 결합이 존재함을 입증하였다.", "implication": "노드가 없는 초전도 갭은 이 물질의 페어링 대칭성이 s-wave와 유사할 가능성을 시사하며, 관찰된 kink는 초전도 형성에 기여하는 '글루(glue)' 메커니즘을 이해하는 핵심 단서가 된다. 이는 니켈레이트 초전도체가 구리 산화물과 유사하면서도 차별화된 물리적 기원을 가질 수 있음을 보여준다.", "novelty": "이중층 니켈레이트 박막에서 ARPES를 통해 초전도 갭과 전자-보존체 결합을 동시에 관찰한 최초의 연구 중 하나이다. 특히 사용자 관심사인 ARPES를 통해 신물질의 전자 구조를 직접 규명했다는 점에서 매우 중요하다.", "unresolved": "70 meV 부근에서 관찰된 보존체의 정체가 포논(phonon)인지, 아니면 자기적 흥분(magnon/spin fluctuation)인지에 대해서는 추가적인 검증이 필요하다.", "future_work": "다양한 도핑 농도에 따른 갭 크기의 변화와 kink 에너지의 상관관계를 추적하고, RIXS 등을 병행하여 보존체의 산란 특성을 규명하는 연구가 이어질 것으로 예상된다.", "concepts": [{"term": "Ruddlesden-Popper (RP) nickelates", "why_emerged": "구리 산화물 초전도체와 유사한 n=2 이중층 구조를 통해 고온 초전도성을 구현하기 위해 도입된 결정 구조 계열이다.", "origin": "1957년 Ruddlesden과 Popper가 제안한 페로브스카이트 유도체 구조에서 유래하였다.", "connections": "La3Ni2O7, La4Ni3O10, 구리 산화물 초전도체 구조와 밀접하게 연관되어 있다."}, {"term": "Nodeless gap", "why_emerged": "초전도 페어링 대칭성(s-wave, d-wave 등)을 구분하기 위한 결정적인 증거로 사용된다.", "origin": "BCS 이론의 등방성 갭 개념에서 출발하였다.", "connections": "d-wave 대칭성을 가진 구리 산화물의 nodal gap과 대비되는 특성이다."}, {"term": "Electron-boson coupling (Kink)", "why_emerged": "전자가 격자 진동(포논)이나 스핀 파동(마그논)과 상호작용하여 에너지 분산이 꺾이는 현상을 통해 페어링 메커니즘을 이해하기 위해 분석한다.", "origin": "다체계 물리학의 자기 에너지(self-energy) 효과에서 기인하며 ARPES 실험에서 널리 관찰된다.", "connections": "초전도 전이 온도(Tc)를 결정하는 유효 상호작용의 세기와 직결된다."}, {"term": "Cryogenic sample quenching", "why_emerged": "박막 시료의 표면 오염을 방지하면서 초전도 상태의 전자 구조를 정밀하게 측정하기 위해 개발된 전처리 기술이다.", "origin": "초고진공 ARPES 시스템의 시료 제작 및 이송 기술 발전 과정에서 확립되었다.", "connections": "인시츄(In-situ) 박막 성장 및 ARPES 측정 시스템의 핵심 요소이다."}], "english_summary": ["Direct ARPES observation of a nodeless superconducting gap in bilayer nickelate thin films.", "A 70 meV kink in energy-momentum dispersion indicates strong electron-boson coupling.", "The findings suggest s-wave-like pairing symmetry in the RP nickelate system at ambient pressure.", "The study provides critical experimental constraints for theoretical models of nickelate superconductivity."]}}, {"title": "Observation of quantum vortex core fractionalization and skyrmion formation in a superconductor", "journal": "Science", "source": "author whitelist", "link": "https://doi.org/10.1126/science.ads0189", "authors": "Yu Zheng, Quanxin Hu, Xin Yu, et al.", "last_authors": "Chi-Ming Yim, Hong Ding", "summary": "Magnetic fields can penetrate a superconductor in the form of quantum vortices, which consist of a core singularity with circulating currents. London’s quantization implies that there is one core singularity per quantum of magnetic flux in single-component superconductors. Here, we report signatures of quantum vortex core fractionalization on the potassium-terminated surface of a multiband superconductor KFe 2 As 2 . The observed splitting of single integer-flux vortices into several fractional vortices results in a disparity between the numbers of flux quanta and vortex cores. These fractional vortices often arrange in chains, which calculations show are characterized by a ℂP 2 skyrmionic topological invariant; this constitutes a different type of topological defect: the chiral skyrmion. The disparate natures of integer and fractional vortices comprising skyrmions lead to distinct spectroscopic signatures.", "tier": "A_MUST_READ", "score": "9", "reason": "author whitelist: Hong Ding", "tags": ["superconduct", "topological"], "image": "", "briefing": {"background": "일반적인 초전도체 내의 양자 소용돌이(vortex)는 런던 양자화 조건에 따라 자기 선속 양자(flux quantum) 하나당 하나의 소용돌이 핵(core)을 가진다. 하지만 다중 밴드 또는 다중 성분 초전도체에서는 이 소용돌이가 더 작은 단위로 쪼개질 수 있다는 이론적 가능성이 제기되어 왔다.", "motivation": "다중 밴드 초전도체인 KFe2As2의 표면에서 일반적인 정수 형태의 소용돌이가 아닌, 분수화된 소용돌이(fractional vortex)의 존재를 STM/STS를 통해 실험적으로 확인하고자 하였다.", "result": "KFe2As2의 칼륨(K) 종단 표면에서 하나의 정수 자기 선속 소용돌이가 여러 개의 분수 소용돌이 핵으로 분리되는 현상을 관찰하였다. 이러한 분수 소용돌이들은 사슬 형태를 이루며, 이론적 계산을 통해 이것이 CP2 스커미온(skyrmion)이라는 위상학적 결함임을 밝혀냈다.", "implication": "초전도체 내에서 스커미온 형태의 새로운 위상 결함이 존재함을 입증함으로써, 초전도 상태의 위상학적 복잡성을 이해하는 새로운 지평을 열었다. 이는 기존의 보편적인 소용돌이 물리와는 확연히 다른 물리 현상이다.", "novelty": "철 기반 초전도체(KFe2As2)에서 분수 소용돌이와 스커미온 형성을 직접적인 분광 이미지로 보여준 획기적인 결과이다. 홍 딩(Hong Ding) 교수의 연구로 사용자 관심사인 철 기반 초전도체 및 위상 물성과 깊은 관련이 있다.", "unresolved": "분수화가 일어나는 특정 표면 조건과 벌크 내부에서의 존재 가능성, 그리고 이들의 동역학적 안정성에 대해서는 추가 연구가 필요하다.", "future_work": "이러한 스커미온 소용돌이를 외부 자기장이나 전류로 제어하는 연구, 그리고 비가환 통계(non-Abelian statistics)와의 연관성 탐구가 기대된다.", "concepts": [{"term": "Vortex core fractionalization", "why_emerged": "다중 성분 초전도체에서 질서 매개변수들 사이의 결합이 약할 때 소용돌이 핵이 분리될 수 있음을 설명하기 위해 도입되었다.", "origin": "초록 정보만으로는 특정하기 어려우나, 다중 성분 Ginzburg-Landau 이론에서 예측되었다.", "connections": "London quantization, Multicomponent superconductivity와 연관된다."}, {"term": "CP2 skyrmion", "why_emerged": "복잡한 위상학적 구조를 가진 스핀 또는 질서 매개변수의 분포를 기술하기 위해 복소 투영 공간(Complex Projective space) 개념을 도입한 위상 결함이다.", "origin": "입자 물리학 및 응집 물질 물리학의 위상수학적 모델에서 유래하였다.", "connections": "Magnetic skyrmions, Chiral magnets와 유사한 위상학적 성질을 공유한다."}, {"term": "KFe2As2", "why_emerged": "철 기반 초전도체 중 구멍 도핑(hole-doping)이 극단적으로 높은 한계 시스템을 연구하기 위해 선택되었다.", "origin": "2008년 철 기반 초전도체 발견 이후 다양한 도핑 계열 연구 과정에서 확립되었다.", "connections": "Iron pnictides, Heavy fermion-like behavior를 보이는 시스템이다."}, {"term": "London's quantization", "why_emerged": "초전도체 내부의 자기 선속이 일정한 단위(h/2e)의 정수배로만 존재해야 함을 설명하기 위한 기본 원리이다.", "origin": "Fritz London과 Heinz London에 의해 제안되었다.", "connections": "Magnetic flux quantum, Abrikosov vortex lattice의 기초가 된다."}], "english_summary": ["Discovery of quantum vortex core fractionalization in the multiband superconductor KFe2As2.", "Single integer-flux vortices split into multiple fractional cores, forming skyrmionic chains.", "Identification of CP2 skyrmion topological invariants in a superconducting system.", "Results challenge the standard London quantization model in multi-component superconductors."]}}, {"title": "Femtosecond modulation of electron correlations in a Luttinger liquid", "journal": "Science_Advances", "source": "keyword", "link": "https://doi.org/10.1126/sciadv.aec7494", "authors": "Na Li, Umang Mehta, Matin Lebrat, et al.", "last_authors": "Rahul Nandkishore, Margaret M. Murnane", "summary": "Luttinger liquids emerge in one-dimensional metals with strong electron interactions, exhibiting intriguing near-equilibrium properties such as spin-charge separation and power-law correlations. Although these interactions suggest fast, distinctive out-of-equilibrium dynamics, such phenomena remain largely unexplored on ultrashort timescales. Here, we use femtosecond laser excitation to weakly deplete the electron density in the Luttinger band of Li 0.9 Mo 6 O 17 and track the response via time- and angle-resolved photoemission spectroscopy. By fitting the measured electron distributions to a finite-temperature Luttinger liquid model, we observe a fast drop in the Luttinger exponent, quantifying the strength of electron interactions. Subsequently, unlike hot electrons in conventional Fermi liquids that slowly relax within picoseconds via electron-phonon coupling, hot electrons in Li 0.9 Mo 6 O 17 relax within a short time of ~100 femtoseconds, through the excitation of a nonequilibrium collective plasmon. The extremely fast evolution of the Luttinger exponent and electron temperature—including a tens of femtosecond time lag between excitation, recovery, and plasmon-driven modulation—reveals previously unidentified pathways for modulating quantum many-body interactions in low-dimensional materials.", "tier": "A_MUST_READ", "score": "9", "reason": "title strong match: Luttinger liquid", "tags": ["angle-resolvedphotoemission", "photoemission", "spin-chargeseparation", "Luttinger", "phonon"], "image": "", "briefing": {"background": "1차원 금속 시스템은 페르미 액체 이론이 붕괴하고 러팅거 액체(Luttinger liquid)라는 독특한 상태가 나타난다. 여기서는 스핀-전하 분리와 같은 특이 현상이 발생하며, 전자 간의 상관관계가 시스템의 물리량을 결정하는 지배적인 요인이 된다.", "motivation": "러팅거 액체 상태인 Li0.9Mo6O17에서 외부 자극(펨토초 레이저)에 의한 전자 상관관계의 동역학적 변화와 평형 상태를 벗어난 울트라패스트 응답을 추적하고자 하였다.", "result": "시간 분해 ARPES(tr-ARPES)를 통해 레이저 여기 후 러팅거 지수(Luttinger exponent)가 급격히 감소함을 관찰하였다. 또한, 일반 금속의 수 피코초(ps) 단위 이완과 달리, 집단 플라즈몬(collective plasmon) 흥분을 통해 약 100 펨토초(fs)라는 매우 빠른 속도로 에너지가 이완됨을 확인하였다.", "implication": "빛을 이용하여 1차원 물질의 양자 다체 상호작용(Luttinger 지수)을 초고속으로 변조할 수 있음을 보여주었다. 이는 저차원 물질에서 상관관계를 제어하는 새로운 경로를 제시한다.", "novelty": "사용자의 주요 관심사인 러팅거 액체와 quasi-1D 물질에서 correlations의 동역학을 tr-ARPES로 직접 관찰했다는 점이 핵심이다. 특히 플라즈몬 주도의 초고속 변조 기작을 밝힌 것이 새롭다.", "unresolved": "이러한 초고속 변조가 가역적인지, 아니면 특정 조건에서 영구적인 상전이를 유도할 수 있는지에 대한 확인이 필요하다.", "future_work": "펌프 레이저의 파장이나 세기를 조절하여 상호작용 세기를 능동적으로 튜닝하는 'Floquet engineering' 관점의 후속 연구가 가능할 것이다.", "concepts": [{"term": "Luttinger liquid", "why_emerged": "1차원에서 입자 간 상호작용이 전자 구조에 미치는 근본적인 영향을 설명하기 위해 페르미 액체론의 대안으로 등장하였다.", "origin": "1950-60년대 Tomonaga와 Luttinger가 제안하고 Haldane이 정립하였다.", "connections": "Spin-charge separation, Power-law correlations, Li0.9Mo6O17(Purple bronze)."}, {"term": "Luttinger exponent (K)", "why_emerged": "러팅거 액체 내에서 상호작용의 세기를 정량화하고, 물리량들의 멱법칙(power-law) 거동을 기술하기 위해 필요하다.", "origin": "러팅거 액체 이론의 핵심 파라미터로 정의되었다.", "connections": "Density of states, Correlation functions의 감쇠 지수를 결정한다."}, {"term": "Collective plasmon", "why_emerged": "전자들이 집단적으로 진동하는 모드로, 전하 운반자들 사이의 장범위 쿨롱 상호작용을 이해하기 위해 도입되었다.", "origin": "David Pines와 David Bohm의 연구에서 확립되었다.", "connections": "Ultrafast relaxation, Energy dissipation in 1D metals."}, {"term": "Time-resolved ARPES (tr-ARPES)", "why_emerged": "평형 상태가 아닌 들뜬 상태의 전자 구조와 에너지 이완 과정을 시간 영역에서 직접 관찰하기 위해 개발되었다.", "origin": "레이저 기술의 발전과 ARPES 기술이 결합되어 2000년대 이후 본격화되었다.", "connections": "Nonequilibrium dynamics, Electron-phonon coupling, Floquet physics."}], "english_summary": ["Ultrafast modulation of electron correlations in the Luttinger liquid Li0.9Mo6O17 using tr-ARPES.", "Observation of a rapid drop in the Luttinger exponent upon femtosecond laser excitation.", "Discovery of a 100-fs relaxation pathway driven by collective plasmons rather than phonons.", "Demonstrates a new method for controlling quantum many-body interactions on ultrashort timescales."]}}, {"title": "Supercurrent effect in a charge density wave intertwined superconductor", "journal": "Nature_Communications", "source": "Gemini", "link": "https://www.nature.com/articles/s41467-026-73778-7", "authors": "Zhen Zhu, Wei Cheng, Dang Liu, et al.", "last_authors": "Hao Zheng, Jinfeng Jia", "summary": "Nature Communications, Published online: 30 May 2026; doi:10.1038/s41467-026-73778-7 Scanning tunneling spectroscopic imaging reveals a field-driven symmetry breaking of CDW modulations in superconducting NbSe₂. Model calculations suggest that the observed anisotropy originates from a Doppler-shift-induced reconstruction of the dispersion of Bogoliubov quasiparticle excitations.", "tier": "B_IMPORTANT_CONDMAT", "score": "10", "reason": "STM on CDW in NbSe2, highly relevant to direct user interests (CDW, NbSe3 class).; demoted from A: broad CM, not direct user/project hit", "tags": ["STM/STS", "CDW", "superconductivity", "NbSe2", "electronicstructure"], "image": "https://pubads.g.doubleclick.net/gampad/ad?iu=/285/nature_communications/article&sz=728x90&c=-1209360244&t=pos%3Dtop%26type%3Darticle%26artid%3Ds41467-026-73778-7%26doi%3D10.1038/s41467-026-73778-7%26techmeta%3D138,147%26subjmeta%3D1003,119,544,639,766%26kwrd%3DSuperconducting+properties+and+materials,Surfaces%2C+interfaces+and+thin+films", "briefing": {"background": "NbSe2와 같은 물질은 초전도와 전하 밀도 파(CDW)가 공존하는 대표적인 시스템으로, 이들 두 양자 상태 사이의 상호작용과 경쟁 관계를 이해하는 것은 응집물질 물리학의 핵심 과제 중 하나입니다.", "motivation": "외부 자기장이나 전류에 의해 유도된 초전류(Supercurrent)가 CDW 변조의 대칭성이나 준입자 분산에 어떠한 구체적인 영향을 미치는지를 STM을 통해 직접 관찰하고자 하였습니다.", "result": "STM 분광 이미지 분석을 통해 초전도 NbSe2에서 자기장에 의해 유도된 CDW 변조의 대칭성 파괴를 발견했습니다. 이는 초전류에 의한 Doppler shift가 Bogoliubov 준입자 들뜸의 분산 관계를 재구성함으로써 발생한 현상임을 모델 계산을 통해 규명했습니다.", "implication": "초전류가 단순히 전하를 운반하는 역할을 넘어, 공존하는 다른 질서 파라미터(CDW)의 대칭성을 깨뜨리고 전자 구조를 근본적으로 바꿀 수 있음을 시사합니다.", "novelty": "CDW와 초전도가 얽힌 시스템에서 '초전류 효과'를 STM으로 시각화하고, 이를 Doppler shift 개념과 연결했다는 점이 혁신적입니다. 독자의 관심사인 STM/STS 및 CDW 제어 연구와 밀접하게 연관됩니다.", "unresolved": "초전류의 세기와 방향에 따른 CDW 변조의 정량적 변화 한계치 및 다른 전이금속 디칼코게나이드(TMD)로의 일반화 여부는 초록 정보만으로 확인하기 어렵습니다.", "future_work": "다양한 전류 밀도 하에서의 STM 측정 및 초전도-CDW 상호작용을 제어하는 새로운 양자 소자 설계로 이어질 것으로 보입니다.", "concepts": [{"term": "Charge Density Wave (CDW)", "why_emerged": "저차원 금속 시스템에서 전자-격자 상호작용에 의해 전하 밀도가 주기적으로 재배열되는 현상을 설명하기 위해 등장했습니다.", "origin": "Rudolf Peierls (1930년대 이론적 예측)", "connections": "Peierls instability, Fermi surface nesting, NbSe2, NbSe3"}, {"term": "Bogoliubov quasiparticle", "why_emerged": "초전도체 내에서 입자(electron)와 구멍(hole)이 혼성된 들뜸 상태를 설명하기 위해 도입되었습니다.", "origin": "Nikolay Bogoliubov", "connections": "BCS Theory, STM/STS, Quasiparticle interference"}, {"term": "Doppler shift (in superconductors)", "why_emerged": "유한한 운동량을 가진 쿠퍼 쌍의 흐름(초전류)이 준입자의 에너지 스펙트럼을 변이시키는 현상을 설명하기 위해 필요합니다.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "Supercurrent, Volovik effect, Quasiparticle dispersion"}], "english_summary": ["STM imaging reveals field-driven symmetry breaking of CDW in superconducting NbSe2.", "The observed anisotropy is linked to Doppler-shift-induced reconstruction of Bogoliubov quasiparticles.", "Demonstrates a direct intertwining effect between supercurrent and charge density wave order."]}}, {"title": "Fermi surface geometry and momentum-dependent electron-phonon coupling drive the charge density wave in quasi-one-dimensional ZrTe3", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/yslr-zv4t", "authors": "Josu Diego, Matteo Calandra", "last_authors": "Josu Diego, Matteo Calandra", "summary": "Author(s): Josu Diego and Matteo Calandra ${\\mathrm{ZrTe}}_{3}$ is a prototypical quasi-one-dimensional compound undergoing a charge density wave (CDW) transition via a very sharp Kohn anomaly in phonon momentum space. While Fermi surface geometry has long been considered the primary driver of the instability, a full understanding of the la… [Phys. Rev. B 113, 174313] Published Fri May 22, 2026", "tier": "B_IMPORTANT_CONDMAT", "score": "10", "reason": "Direct hit: Quasi-1D material, CDW, Fermi surface geometry, and electronic structure.; demoted from A: broad CM, not direct user/project hit", "tags": ["quasi-1D", "CDW", "ZrTe3", "Fermisurface"], "image": "", "briefing": {"background": "ZrTe3는 준일차원(Quasi-1D) 구조를 가진 물질로, 특정 온도 이하에서 전하 밀도 파(CDW) 전이를 일으킵니다. 이 전이의 근본 원인이 단순히 페르미면 네스팅(Nesting) 때문인지, 아니면 전자-포논 결합(EPC)의 특성 때문인지에 대한 논의가 지속되어 왔습니다.", "motivation": "ZrTe3에서 관찰되는 매우 날카로운 Kohn anomaly와 CDW 형성에 있어 페르미면 기하학적 구조와 운동량 의존적 전자-포논 결합이 각각 어떤 역할을 하는지 명확히 이해하고자 했습니다.", "result": "연구 결과, ZrTe3의 CDW 불안정성은 단순히 페르미면 네스팅만으로는 설명될 수 없으며, 운동량에 민감하게 반응하는 전자-포논 결합(EPC)의 강도가 함께 작용해야만 설명 가능하다는 것을 밝혀냈습니다.", "implication": "준일차원 전이금속 텔루라이드 시스템에서 CDW를 이해할 때, 단순한 구조적 불안정성 모델을 넘어 정교한 EPC 계산이 필수적임을 시사합니다.", "novelty": "전형적인 1D 시스템인 ZrTe3를 대상으로 최신 계산 기법을 통해 오랜 논쟁이었던 CDW의 구동력을 재정의했습니다. 독자의 관심사인 준일차원 물질 및 112 계열 텔루라이드 연구와 직결됩니다.", "unresolved": "실제 실험에서 관찰되는 온도 의존적 포논 선폭 변화와 계산 결과 간의 완전한 일치 여부는 추가적인 확인이 필요해 보입니다.", "future_work": "압력이나 도핑을 통해 페르미면과 EPC를 독립적으로 조절하여 CDW 전이를 제어하는 연구가 기대됩니다.", "concepts": [{"term": "Kohn anomaly", "why_emerged": "금속 내 전도 전자가 포논의 스크리닝에 관여하면서 특정 파수에서 포논 주파수가 급격히 떨어지는 현상을 설명하기 위해 제안되었습니다.", "origin": "Walter Kohn (1959)", "connections": "Electron-phonon coupling, CDW, Phonon dispersion"}, {"term": "Fermi surface nesting", "why_emerged": "페르미면의 평행한 조각들이 특정 파수 벡터에 의해 겹쳐질 때 전자 감수율이 발산하여 상전이가 일어나는 기작을 설명합니다.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "Peierls instability, Susceptibility, Quasi-1D materials"}, {"term": "Quasi-one-dimensional (1D)", "why_emerged": "사슬 구조 등을 가져 특정 방향으로만 전도성이 강한 저차원 물리 현상을 연구하기 위해 정의되었습니다.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "Luttinger liquid, ZrTe3, NbSe3, Peierls transition"}], "english_summary": ["The CDW in quasi-1D ZrTe3 is driven by both Fermi surface geometry and momentum-dependent EPC.", "Clarifies the long-standing debate over the origin of the sharp Kohn anomaly in this material.", "Highlights the inadequacy of pure nesting models for describing CDW instabilities in 112-type tellurides."]}}, {"title": "In-plane anomalous Hall effect in a low-dimensional system", "journal": "Nature_Materials", "source": "Gemini", "link": "https://www.nature.com/articles/s41563-026-02611-9", "authors": "I-Hsuan Kao, Ravi Kumar Bandapelli, Zhenhong Cui, et al.", "last_authors": "Jyoti Katoch, Simranjeet Singh", "summary": "Nature Materials, Published online: 28 May 2026; doi:10.1038/s41563-026-02611-9 A gate-tunable magnetization-driven in-plane anomalous Hall effect is realized in a low-symmetry heterostructure of TaIrTe4 and layered ferromagnetic insulator Cr2Ge2Te6.", "tier": "B_IMPORTANT_CONDMAT", "score": "9", "reason": "Direct relevance to anomalous Hall effect, heterostructures, and magnetic topological materials.", "tags": ["anomalousHalleffect", "heterostructure", "low-dimensional", "magneticmaterial"], "image": "https://media.springernature.com/m685/springer-static/image/art%3A10.1038%2Fs41563-026-02611-9/MediaObjects/41563_2026_2611_Fig1_HTML.png", "briefing": {"background": "비정상 홀 효과(AHE)는 일반적으로 수직 자화에 의해 발생하지만, 최근 면 내(In-plane) 자화에 의한 AHE가 이론 및 실험적으로 주목받고 있습니다. 이는 물질의 대칭성과 베리 곡률(Berry curvature)의 정교한 제어를 필요로 합니다.", "motivation": "낮은 대칭성을 가진 TaIrTe4와 층상 강자성 절연체인 Cr2Ge2Te6를 결합하여, 게이트 전압으로 조절 가능한 면 내 비정상 홀 효과를 구현하고자 했습니다.", "result": "TaIrTe4/Cr2Ge2Te6 이종접합 구조에서 자화 방향에 의존하는 면 내 AHE를 성공적으로 관찰했으며, 이를 게이트 전압을 통해 가변적으로 제어하는 데 성공했습니다.", "implication": "수직 자화 없이도 홀 효과를 생성할 수 있음을 보여주어, 자성 토폴로지 물질을 활용한 새로운 형태의 스핀트로닉스 소자 가능성을 제시합니다.", "novelty": "독자가 관심을 갖는 TaIrTe4(Weyl semimetal 후보군)와 베리 곡률, 면 내 AHE를 결합한 연구입니다. 특히 저대칭성 헤테로 구조에서의 대칭성 파괴를 이용한 점이 돋보입니다.", "unresolved": "면 내 AHE의 크기가 실용적인 소자 적용이 가능할 정도로 충분한지, 그리고 다른 강자성체와의 조합에서도 유효한지는 추가 연구가 필요합니다.", "future_work": "다양한 토폴로지 반금속과 강자성체 계면에서의 베리 곡률 공학 및 고온 작동 가능한 면 내 AHE 소자 탐색이 예상됩니다.", "concepts": [{"term": "In-plane Anomalous Hall Effect", "why_emerged": "전통적인 홀 효과의 기하학적 제약을 벗어나 면 내 자화만으로 작동하는 새로운 수송 현상을 탐구하기 위해 등장했습니다.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "Berry curvature, Low-symmetry crystals, Spintronics"}, {"term": "TaIrTe4", "why_emerged": "2형 웨일 반금속(Type-II Weyl semimetal)의 특성을 실험적으로 구현하기에 적합한 낮은 대칭성의 층상 물질로 주목받았습니다.", "origin": "K. Koepernik et al. (이론), 다수 그룹 (실험)", "connections": " ate of a flagship topological antiferromagnet relevant to anomalous Hall studies.", "tags": ["material", "Mn3Sn", "neutron-scattering", "magnetism"], "image": "", "briefing": {"background": "Mn3Sn은 비공선적 반강자성(non-collinear AFM) 구조를 가지며, 큰 비정상 홀 효과(AHE)를 나타내어 위상 자기 물질 연구의 핵심 물질로 꼽힙니다.", "motivation": "Mn3Sn의 기저 상태 자기 구조가 정확히 어떤 형태인지(Type III vs Type IV)에 대한 논란을 종식시키고, 이를 통해 비정상 홀 효과의 기원을 명확히 하고자 합니다.", "result": "구형 중성자 편광 분석(Spherical neutron polarimetry)을 통해 Mn3Sn의 기저 상태 스핀이 방향(Type IV)이 아닌 방향(Type III)에 평행한 '역삼각형 구조(inverse triangular structure)'임을 확정했습니다.", "implication": "자기 구조의 정확한 규명은 베리 곡률 계산의 정확도를 높여주며, 이 물질에서 나타나는 위상적 수송 현상을 이론적으로 완벽히 설명할 수 있는 기반을 제공합니다.", "novelty": "정밀한 중성자 산란 기술을 사용하여 수년간 지속된 Mn3Sn의 자기 구조 논쟁에 명확한 실험적 결론을 내렸다는 점이 매우 중요합니다. 독자의 관심사인 Mn3Sn, AHE, 위상 자성과 직결됩니다.", "unresolved": "온도 변화나 외부 자기장에 의한 자기 구조의 미세한 상전이 과정 및 다른 경쟁적인 자기 상들과의 경계에 대해서는 추가 연구가 필요할 수 있습니다.", "future_work": "규명된 Type III 구조를 바탕으로 한 정밀한 전자 구조 계산(DFT) 및 베리 곡률 관련 위상 수송 특성의 재해석이 뒤따를 것으로 보입니다.", "concepts": [{"term": "Mn3Sn", "why_emerged": "반강자성체임에도 불구하고 강자성체 수준의 거대한 홀 효과를 나타내는 특성 때문에 위상 스핀트로닉스의 핵심 소재로 부상했습니다.", "origin": "초록 정보만으로는 특정하기 어려우나, 2015년 Nakatsuji 등에 의해 거대 AHE가 발견되며 유명해졌습니다.", "connections": "Weyl semimetals, Anomalous Hall Effect, Non-collinear antiferromagnetism과 연결됩니다."}, {"term": "Spherical Neutron Polarimetry", "why_emerged": "일반적인 중성자 회절보다 훨씬 정밀하게 복잡한 자기 구조의 방향성과 위상을 결정하기 위해 고안되었습니다.", "origin": "1980년대 후반 Tasset 등에 의해 제안 및 개발되었습니다.", "connections": "Neutron scattering, Cryopad, Magnetic symmetry analysis와 연결됩니다."}, {"term": "Inverse Triangular Structure", "why_emerged": "기하학적 좌절(frustration)이 있는 삼각 격자에서 나타나는 독특한 스핀 배열을 기술하기 위해 도입되었습니다.", "origin": "초록 정보만으로는 특정하기 어려우나, 카고메 및 삼각 격자 자성 연구에서 주로 사용됩니다.", "connections": "Kagome lattice, Spin frustration, Berry curvature와 연결됩니다."}, {"term": "Anomalous Hall Effect (AHE)", "why_emerged": "외부 자기장이 없거나 매우 작을 때도 자화나 위상적 특성에 의해 발생하는 홀 전압을 설명하기 위해 연구되었습니다.", "origin": "19세기 에드윈 홀에 의해 발견되었으나 위상적 기원은 Karplus와 Luttinger 등에 의해
