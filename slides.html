<title>Daily Paper Slideshow</title>
<style>
  :root {
    color-scheme: light;
    --bg: #f6f7f4;
    --paper: #ffffff;
    --ink: #111827;
    --muted: #64748b;
    --line: #d8ddd2;
    --accent: #176b87;
    --accent-2: #9a3412;
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; overflow: auto; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: var(--bg); color: var(--ink); }
  .shell { max-width: 1500px; min-height: 100vh; margin: 0 auto; padding: 14px 18px; display: flex; flex-direction: column; }
  .topbar { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 16px; }
  .top-actions { display: flex; align-items: center; gap: 10px; }
  .topbar a, button { border: 1px solid var(--line); border-radius: 8px; background: var(--paper); color: var(--ink); padding: 10px 14px; font-weight: 700; text-decoration: none; cursor: pointer; }
  button.primary { background: var(--accent); border-color: var(--accent); color: white; }
  button:disabled { opacity: 0.45; cursor: not-allowed; }
  .counter { color: var(--muted); font-weight: 700; }
  .slide { min-height: calc(100vh - 82px); background: var(--paper); border: 1px solid var(--line); border-radius: 10px; padding: 18px; box-shadow: 0 18px 42px rgba(15, 23, 42, 0.10); display: grid; grid-template-columns: minmax(310px, 0.86fr) minmax(0, 1.55fr); gap: 18px; overflow: visible; }
  .paper-head { min-width: 0; min-height: 0; overflow: visible; display: flex; flex-direction: column; gap: 12px; }
  .figure { margin: 0; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: #f8fafc; }
  .figure img { display: block; width: 100%; max-height: 41vh; object-fit: contain; background: white; }
  .figure figcaption { padding: 7px 10px; color: var(--muted); font-size: 12px; line-height: 1.3; }
  .head-text { display: flex; flex-direction: column; gap: 9px; min-width: 0; }
  .badges { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .badge { border-radius: 999px; padding: 5px 9px; background: #eef2ff; color: #3730a3; font-size: 12px; font-weight: 800; }
  .score { background: #fee2e2; color: #991b1b; }
  h1 { margin: 0; font-size: 25px; line-height: 1.15; letter-spacing: 0; overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
  h1 a { color: inherit; text-decoration-color: rgba(23, 107, 135, 0.35); text-decoration-thickness: 2px; text-underline-offset: 4px; }
  h1 a:hover { color: var(--accent); text-decoration-color: var(--accent); }
  .meta, .authors, .why, .abstract { font-size: 13px; line-height: 1.45; }
  .meta, .authors { color: var(--muted); }
  .why strong, .abstract strong, .authors strong { color: var(--ink); }
  .authors { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .why { border-left: 4px solid var(--accent-2); padding-left: 10px; color: #374151; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .abstract { border-top: 1px solid var(--line); padding-top: 14px; color: #374151; }
  .original-abstract { border-top: 1px solid var(--line); padding-top: 10px; color: #374151; font-size: 11.5px; line-height: 1.35; overflow-wrap: anywhere; }
  .original-abstract strong { display: block; margin-bottom: 4px; color: var(--ink); }
  .tags { display: flex; flex-wrap: wrap; gap: 8px; }
  .tag { border-radius: 999px; padding: 4px 8px; background: #f1f5f9; color: #475569; font-size: 12px; font-weight: 700; }
  .head-text > .link { display: none; }
  .briefing { min-width: 0; min-height: 0; overflow: visible; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); grid-auto-rows: minmax(0, auto); align-content: start; gap: 11px 18px; border-top: 0; padding-top: 0; }
  .brief-section { min-width: 0; }
  .brief-section.wide { grid-column: 1 / -1; }
  .brief-section h2 { margin: 0 0 4px; font-size: 14px; line-height: 1.22; color: #0f766e; letter-spacing: 0; }
  .brief-section p, .brief-section li { margin: 0; font-size: 12.5px; line-height: 1.42; color: #1f2937; overflow-wrap: anywhere; }
  .brief-section ul { margin: 0; padding-left: 20px; }
  .concepts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 9px 14px; }
  .concept { border-top: 1px solid var(--line); padding-top: 7px; }
  .concept h3 { margin: 0 0 4px; font-size: 13px; color: #7c2d12; letter-spacing: 0; }
  .concept p { margin: 2px 0 0; font-size: 11.5px; line-height: 1.35; color: #374151; overflow-wrap: anywhere; }
  .concept b { color: #111827; }
  .link { color: var(--accent); font-weight: 800; text-decoration: none; }
  .empty { padding: 48px; background: var(--paper); border: 1px solid var(--line); border-radius: 12px; color: var(--muted); }
  @media (max-width: 860px) {
    .shell { padding: 14px; }
    .topbar, .top-actions { align-items: stretch; flex-direction: column; }
    .slide, .briefing, .concepts { grid-template-columns: 1fr; }
    .slide { min-height: auto; overflow: visible; display: grid; }
    h1 { font-size: 28px; }
  }
</style>

<script>
const slides = [{"title": "Momentum-Resolved Kondo Hybridization of Nonsymmorphic Dirac-Derived Bands in CeAgBi2", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2611.10417", "authors": "Yang Luo, Hao Liu, Zhong-Tuo Fu, et al.", "last_authors": "Yu-Xia Duan, Jian-Qiao Meng", "summary": "How symmetry-constrained conduction states acquire heavy-quasiparticle character is a central question in correlated quantum materials. Combining angle-resolved photoemission spectroscopy, Ce $4d \\rightarrow 4f$ resonant photoemission, and first-principles calculations, we investigate the nonsymmorphic Kondo lattice CeAgBi$_2$. We identify quasi-two-dimensional Bi-square-net-derived bands consistent with calculated Dirac crossings and nodal lines. Resonant photoemission resolves a nearly dispersionless Ce 4$f$ band near the Fermi level, establishing Kondo heavy-quasiparticle states. Its pronounced momentum-dependent spectral weight at intersections with the identified Dirac-derived branches provides direct spectroscopic evidence for their participation in $c$-$f$ hybridization. Complementary measurements on independently cleaved samples and an effective hybridization model connect these branches to the Kondo heavy-quasiparticle spectrum. The combined results support preservation of nonsymmorphic Dirac-band connectivity under Kondo renormalization, showing how symmetry-constrained conduction states become constituents of correlated heavy quasiparticles.", "tier": "A_MUST_READ", "score": "10", "reason": "ARPES study of momentum-resolved Kondo hybridization in a nonsymmorphic Dirac material.", "tags": ["ARPES", "experiment", "Diracsemimetal", "Kondo", "stronglycorrelated", "electronicstructure"], "image": "https://arxiv.org/html/2611.10417v1/Fig01.png", "briefing": {"background": "Kondo 격자 시스템은 국소적인 f-전자와 전도(c) 전자 간의 상호작용을 통해 무거운 페르미온(Heavy Fermion) 상태를 형성하는 대표적인 강상관계 분야입니다. 최근에는 이러한 Kondo 물리와 위상학적 밴드 구조(Dirac/Weyl 페르미온)가 결합되었을 때 어떤 새로운 양자 상태가 나타나는지가 중요한 연구 화두입니다.", "motivation": "비공형(Nonsymmorphic) 대칭성에 의해 보호되는 Dirac 밴드를 가진 CeAgBi2 물질에서, 대칭성으로 구속된 전도 상태가 어떻게 f-전자와 결합하여 무거운 준입자(Quasiparticle) 특성을 획득하는지, 그리고 그 과정에서 밴드 구조의 위상적 연결성이 유지되는지를 밝히고자 했습니다.", "result": "ARPES와 Ce 4d-4f 공명 광전자 분광법을 통해 Bi square-net에서 유래한 2차원 Dirac 밴드와 페르미 준위 근처의 평평한 Ce 4f 밴드를 확인했습니다. 특히 Dirac 밴드와 f-밴드가 교차하는 지점에서 강한 운동량 의존적 c-f 하이브리드화(Hybridization)가 일어남을 입증하였고, Kondo 재규격화 이후에도 Dirac 밴드의 연결성이 보존됨을 확인했습니다.", "implication": "이 결과는 대칭성에 의해 보호되는 위상적 전도 밴드가 Kondo 효과를 통해 무거운 준입자 시스템의 구성 요소로 직접 참여할 수 있음을 보여줍니다. 이는 위상 중금속 페르미온(Topological Heavy Fermion) 시스템의 전자 구조 설계 및 이해에 중요한 지표를 제공합니다.", "novelty": "독자의 주요 관심사인 ARPES를 통해 Nonsymmorphic Dirac 밴드와 Kondo 하이브리드화의 '운동량 분해(Momentum-resolved)' 증거를 직접 제시했다는 점이 핵심입니다. 단순히 거시적 물성이 아닌, k-space에서의 미시적 결합 메커니즘을 규명했습니다.", "unresolved": "Kondo 재규격화 과정에서 Dirac 노드의 정확한 위치 이동이나 대칭성 붕괴 여부에 대한 더 정밀한 에너지 분해능 실험이 필요할 수 있습니다.", "future_work": "온도 가변 ARPES를 통한 Kondo 붕괴(Kondo breakdown) 현상 관측이나, 외부 압력/자기장을 이용한 하이브리드화 강도 조절 연구가 기대됩니다.", "concepts": [{"term": "Nonsymmorphic Symmetry", "why_emerged": "결정 격자 내에서 단순 이동 대칭성 외에 글라이드 평면이나 스크류 축과 같은 복합 대칭성을 설명하기 위해 필요합니다.", "origin": "결정학의 공간군(Space group) 이론에서 기원함", "connections": "Dirac 선 노드(Line node), 위상 절연체, CeAgBi2의 밴드 구조 보호"}, {"term": "c-f Hybridization", "why_emerged": "금속의 전도 전자(c)와 국소화된 f-오비탈 전자 사이의 양자역학적 혼합을 설명하여 Kondo 효과를 이해하기 위해 제안되었습니다.", "origin": "Kondo lattice model 및 Anderson lattice model", "connections": "무거운 페르미온, Kondo 절연체, 질량 증폭 현상"}, {"term": "Resonant Photoemission (RPES)", "why_emerged": "특정 원소(주로 희토류의 f-전자)의 부분 상태 밀도(PDOS)를 선택적으로 증폭시켜 관찰하기 위해 개발되었습니다.", "origin": "흡수단(Absorption edge) 에너지에서의 광전 효과 증폭 현상 이용", "connections": "ARPES, 4f 전자 분광, 강상관계 물질 분석"}, {"term": "Dirac Square Net", "why_emerged": "Bi나 Sb와 같은 원소들이 형성하는 사각 격자 구조에서 선형 분산 관계를 가진 Dirac 페르미온이 자주 등장함을 설명하기 위해 주목받았습니다.", "origin": "위상 반금속(Topological Semimetal) 연구 확산기", "connections": "AMnBi2, CeAgBi2, 위상 노드선(Nodal line)"}], "english_summary": ["Observed momentum-resolved Kondo hybridization between Ce 4f levels and nonsymmorphic Dirac bands in CeAgBi2 using ARPES.", "Identified that Bi-square-net derived Dirac crossings participate directly in the formation of heavy quasiparticles.", "Demonstrated the preservation of nonsymmorphic band connectivity even under strong Kondo renormalization.", "Established a direct spectroscopic link between topological conduction states and correlated f-electron physics."]}}, {"title": "Quartet ferromagnetism in the small-exchange limit", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2611.10512", "authors": "Samuel Ogundeji, Tianxiong Han, Tyler J. Slade, et al.", "last_authors": "Robert J. McQueeney, Aashish Sapkota", "summary": "Rare-earth magnets are often regarded as classical owing to their large angular momentum J, but this picture breaks down when exchange is smaller than the crystalline electric-field (CEF) energy scale, allowing the degeneracy of low-lying CEF manifolds to dictate the emergent quantum phases. Here, we uncover such a regime in the RV6Sn6 (R = rare-earth) kagome metals with strong magnetic anisotropy. Thermodynamic and neutron-diffraction measurements reveal successive axial and tilted ferromagnetic (FM) phases in DyV6Sn6, arising from independent ordering of the axial Mz and transverse Mx dipolar components enabled by a rare quasi-quartet ground state. On the other hand, HoV6Sn6 has a similar tilted magnetic anisotropy, but remains axial down to 0.03 K. This discrepancy can be traced back to the non-Kramers nature of Ho3+ where the CEF lifts the quartet degeneracy, leaving a quasi-triplet ground state. Unlike quartets or higher multiplets, we find that the effective spin-1 triplet does not allow independent dipolar ordering without strong quadrupolar (nematic) interactions that act to break rotational symmetry, revealing an essential multipolar prerequisite for tilted magnetic ground states. These results establish a quartet CEF manifold as the minimal degeneracy required for dipolar-driven independent ordering. Mapping the surrounding CEF parameter space further reveals competing magnetic, non-magnetic singlet, and potential quadrupolar phases, driven by multifold ground state degeneracies. These results establish CEF tuning as a versatile route to unconventional quantum phases across the broader RT6X6 (T = transition metal; X = Sn, Ge) family.", "tier": "A_MUST_READ", "score": "10", "reason": "Direct hit: Experimental study on kagome metals (RV6Sn6) with nematicity and neutron scattering.", "tags": ["kagome", "material", "ferromagnetism", "nematicity", "neutronscattering", "stronglycorrelatedelectronsystems"], "image": "https://arxiv.org/static/browse/0.3.4/images/arxiv-logo-fb.png", "briefing": {"background": "희토류 기반 자성체는 보통 큰 각운동량(J) 때문에 고전적인 자석으로 취급되지만, 교환 상호작용 에너지가 결정장(CEF) 에너지보다 작을 때는 결정장에 의한 다중항(Multiplet) 구조가 양자 상태를 결정짓게 됩니다. 특히 카고메 격자 구조를 가진 RV6Sn6 계열은 이러한 결정장 효과와 위상학적 특성이 결합된 흥미로운 플랫폼입니다.", "motivation": "DyV6Sn6는 기울어진(Tilted) 강자성상을 보이는 반면, 유사한 이방성을 가진 HoV6Sn6는 수직(Axial) 방향 자성을 유지하는 이유를 결정장 준위의 축퇴도 관점에서 규명하고자 했습니다.", "result": "DyV6Sn6는 '사중항(Quartet)' 바닥 상태를 가져 수직(Mz) 및 수평(Mx) 쌍극자 성분이 독립적으로 정렬될 수 있음을 밝혔습니다. 반면 HoV6Sn6는 비-크라머스(Non-Kramers) 이온 특성상 결정장이 축퇴도를 풀어 '준-삼중항' 상태가 되며, 이 경우 강한 네마틱(Nematic/Quadrupolar) 상호작용 없이는 독립적인 쌍극자 정렬이 불가능함을 중성자 산란을 통해 확인했습니다.", "implication": "기울어진 자성 바닥 상태를 형성하기 위해 필요한 최소한의 결정장 축퇴도가 '사중항'임을 명시적으로 제시했습니다. 이는 결정장 제어를 통해 카고메 금속에서 비전형적인 양자상을 설계할 수 있음을 의미합니다.", "novelty": "카고메 금속(RV6Sn6) 연구에서 독자의 관심사인 네마틱성과 다중극자(Multipolar) 상호작용을 연결시켰습니다. 특히 단순한 스핀 정렬을 넘어 결정장 파라미터 공간에서의 비자성 싱글렛 및 사중극자 상의 경쟁을 다루었다는 점이 중요합니다.", "unresolved": "이론적으로 예측된 사중극자(Quadrupolar) 상이 실제 특정 RV6Sn6 화합물에서 실험적으로 명확히 분리되어 관측될 수 있는지는 추가 검증이 필요합니다.", "future_work": "다른 RT6X6(T=이전금속, X=Sn, Ge) 계열 물질에서 결정장 튜닝을 통한 새로운 위상 자성 상태 및 네마틱 상전이 탐색이 유망합니다.", "concepts": [{"term": "Crystalline Electric Field (CEF)", "why_emerged": "결정 내 이온 주위의 전하 분포가 만드는 전기장이 이온의 전자 궤도 축퇴를 해소하는 방식을 설명하기 위해 도입되었습니다.", "origin": "Hans Bethe (1929)", "connections"  "tags": ["theory", "kagome", "anomalousHall", "spinchirality", "TRSB"], "image": "", "briefing": {"background": "카고메 격자는 기하학적 구조 때문에 스핀 액체나 변칙 홀 효과(AHE)와 같은 흥미로운 자성 물성을 보입니다. 특히 스핀 카이랄성(Spin Chirality)은 실공간 또는 운동량 공간의 베리 곡률(Berry Curvature)을 유발하여 전하 수송 특성에 큰 영향을 미칩니다.", "motivation": "카고메 격자에서 정적인(Static) 스핀 카이랄성뿐만 아니라 요동치는(Fluctuating) 스핀 카이랄성이 변칙 홀 효과(AHE) 및 변칙 네른스트 효과(ANE)에 각각 어떤 차별화된 역할을 하는지 이론적으로 규명하고자 했습니다.", "result": "s-d 모델 기반의 타이트 바인딩 해밀토니안과 몬테카를로 시뮬레이션을 사용하여, 정적 카이랄성과 변칙 홀 효과 사이의 상관관계를 분석했습니다. (초록이 짧아 세부 수치는 미비하나) 카이랄성 요동이 수송 계수에 미치는 독특한 기여를 계산적으로 확인한 것으로 보입니다.", "implication": "이 결과는 장거리 자성 정렬이 없는 상태에서도 나타나는 변칙적 수송 현상(예: 위상 홀 효과)의 메커니즘을 이해하는 데 도움을 주며, 특히 카고메 금속에서의 시간 반전 대칭성 붕괴(TRSB)와 관련된 논의에 이론적 토대를 제공합니다.", "novelty": "독자의 핵심 관심사인 카고메 격자, AHE, TRSB를 모두 관통하는 주제입니다. 특히 AV3Sb5 등에서 논란이 되는 루프 전류(Loop current)나 비정상적인 AHE의 기원을 스핀 카이랄성 관점에서 해석할 수 있는 틀을 제공합니다.", "unresolved": "이론적 모델인 s-d 모델이 실제 AV3Sb5와 같은 전하 밀도파(CDW) 물질의 복잡한 밴드 구조를 얼마나 정확히 모사할 수 있는지는 추가적인 비교가 필요합니다.", "future_work": "실제 실험 데이터(CsV3Sb5 등)와의 정량적 비교 및 카이랄 요동이 온도에 따라 수송 특성에 미치는 영향에 대한 실험적 검증이 기대됩니다.", "concepts": [{"term": "Scalar Spin Chirality", "why_emerged": "세 스핀의 외적과 내적의 결합(S1·(S2×S3))을 통해 스핀이 이루는 입체각이 전자의 위상에 미치는 영향을 설명하기 위해 도입되었습니다.", "origin": "Wen, Wilczek, and Zee (1989) 등 위상 자성 이론", "connections": "변칙 홀 효과, 위상 홀 효과, 스카미온"}, {"term": "Anomalous Nernst Effect (ANE)", "why_emerged": "온도 구배가 있을 때 자성체에서 수직 방향으로 전압이 발생하는 현상을 설명하기 위해 나타났습니다.", "origin": "열전 효과의 자성 버전", "connections": "변칙 홀 효과, 베리 곡률, 열전 발전"}, {"term": "s-d model", "why_emerged": "금속의 전도 전자(s)와 국소 자성 이온의 스핀(d) 간의 상호작용을 가장 단순하면서도 강력하게 모델링하기 위해 제안되었습니다.", "origin": "Zener (1951)", "connections": "Kondo 효과, RKKY 상호작용, 자기 저항"}, {"term": "Time-Reversal Symmetry Breaking (TRSB)", "why_emerged": "자성체나 특정 비전형적인 양자 상태에서 시간의 방향을 바꿨을 때 물리량이 보존되지 않는 현상을 정의하기 위해 필요합니다.", "origin": "기초 물리학의 대칭성 원리", "connections": "변칙 홀 효과, 무손실 수송, 루프 전류"}], "english_summary": ["Investigated the roles of static and fluctuating spin chiralities in driving AH putational framework for exciton photoemission orbital tomography (exPOT) in periodic systems, enabling the simulation and interpretation of experimental observables within many-body perturbation theory. By connecting the G W + Bethe-Salpeter equation (BSE) approach to photoemission tomography, our formalism captures exciton photoemission in periodic systems, explicitly incorporating photoemission matrix element effects induced by the light-matter interaction via the probe pulse. The correlated nature of electrons and holes introduces distinct consequences for excitonic photoemission. Using the prototypical two-dimensional material hexagonal boron nitride, we demonstrate these effects, including a dependence of the photoemission angular distribution on the pump pulse polarization. Moreover, our framework extends to excitons with finite center-of-mass momentum, making it well-suited to studying momentum-dark excitons. This provides valuable insights into the microscopic nature of excitonic phenomena in quantum materials.", "tier": "A_MUST_READ", "score": "9", "reason": "title strong match: photoemission", "tags": ["photoemission", "correlated"], "image": "", "briefing": {"background": "ARPES는 전자 구조 측정의 강력한 도구이지만, 여기자(exciton)와 같은 상관 관계가 있는 전자-홀 쌍의 파동함수를 운동량 공간에서 직접 시각화하는 것은 매우 어렵습니다.", "motivation": "시간 분해 광전자 분광법(TR-ARPES)을 통해 측정된 여기자의 운동량 공간 신호를 정확하게 시각화하고 해석할 수 있는 계산 프레임워크를 구축하고자 합니다.", "result": "GW+BSE(Bethe-Salpeter Equation) 방법론을 광전자 방출 토모그래피와 결합한 'exPOT' 프레임워크를 개발했습니다. 이를 통해 hBN과 같은 2D 물질에서 여기자의 광전자 방출 패턴을 시뮬레이션하고, 펌프 펄스의 편광에 따른 여기자 분포 변화를 재현했습니다.", "implication": "실험적으로 관측하기 어려운 '운동량-어두운 여기자(momentum-dark excitons)'를 포함하여, 다양한 양자 물질 내 여기자의 미시적 구조를 규명할 수 있는 해석 도구를 제공합니다.", "novelty": "주기적 시스템(periodic systems)에서의 여기자 파동함수를 광전자 방출 행렬 요소(matrix element) 효과를 포함하여 계산하는 최초의 포괄적 프레임워크입니다. ARPES를 주력으로 하는 독자에게 매우 유용한 방법론입니다.", "unresolved": "매우 복잡한 다체계 상관관계가 있는 시스템에서의 계산 비용 문제와 펨토초 단위의 초고속 동역학 과정 중 발생하는 결맞음(coherence) 효과의 완전한 통합 등이 과제로 남아 있습니다.", "future_work": "개발된  "Electronic structure, Material design"}], "english_summary": ["Identifies MoOBr3 as a quasi-1D altermagnet using symmetry analysis and DFT calculations.", "Reports the coexistence of ferroelectric and altermagnetic orders, leading to multiferroicity.", "Predicts strong real-space magnetoelectric coupling in this material.", "Suggests MoOBr3 as a platform for electric-field controlled low-power altermagnetic spintronics."]}}, {"title": "Strong electron correlations and ligand hybridization for altermagnetism", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/q75s-35k6", "authors": "Byungkyun Kang, Anderson Janotti, Dai Q. Ho, et al.", "last_authors": "Mark R. Pederson, Eunja Kim", "summary": "Altermagnetism arises from the breaking of time-reversal symmetry in antiferromagnets, leading to spin-band splitting. However, recent reports indicate inconsistencies in its observation in strongly correlated materials. Here, the authors employ dynamical mean-field theory to show that strong correlations in MnF 2 suppress spin-band splitting, whereas MnTe exhibits significant spin-band splitting due to both strong correlations and sizable ligand hybridization, establishing it as an ideal altermagnetic candidate. These findings provide a pathway for designing altermagnets in strongly correlated systems.", "tier": "A_MUST_READ", "score": "9", "reason": "Focuses on altermagnetism in strongly correlated materials using DMFT, relevant to user's interests.", "tags": ["altermagnetism", "strongly_correlated", "DFT+DMFT", "materials_design"], "image": "", "briefing": {"background": "알터마그네티즘(Altermagnetism)은 총 자화량은 0이면서도 시간 반전 대칭성 파괴를 통해 밴드 구조에서 스핀 갈라짐(spin-splitting)을 유도하는 새로운 자성 상태로, 스핀트로닉스 분야에서 매우 주목받고 있습니다.", "motivation": "최근 강상관(strongly correlated) 물질에서 알터마그네티즘의 실험적 관찰 결과가 일관되지 않게 나타나는 문제가 발생했습니다. 본 연구는 전자 상관관계와 리간드 혼성(hybridization)이 스핀 갈라짐에 어떤 영향을 주는지 규명하고자 했습니다.", "result": "DFT+DMFT 계산을 통해 MnF2에서는 강한 전자 상관관계가 오히려 스핀 갈라짐을 억제하는 반면, MnTe는 강한 , Ruolun Zhang, Byunghoon Kim, et al.", "last_authors": "Md. Shafayat Hossain, M. Zahid Hasan", "summary": "A Dirac mass is characterized not only by its magnitude but also by its sign, which influences the Berry curvature, Hall response, and the propagation direction of chiral boundary modes. However, local spectroscopy of magnetic topological surfaces has so far accessed only the gap magnitude $|M|$. Here we show how the topological sign of $M$ can be determined locally. We first establish the sign information that spin-resolved tunneling can access and the reference required to obtain an absolute Hall sign. Although spin--orbital entanglement generally obscures the relation between measured spin and Dirac pseudospin, crystalline rotation symmetry alleviates this ambiguity at the band edge. On a $C_3$ axis, an axial tip couples to a fully spin-polarized state whose tunneling asymmetry directly reveals the sign of the occupied-band Berry curvature, independent of orbital composition. We further show that the zeroth Landau level provides an independent mass-sign measurement with an unpolarized tip, while opposite domains and their chiral domain-wall modes provide self-consistency checks. These results pave the way for imaging the locations where the topological character changes within a material, rather than merely identifying where a spectral gap appears.", "tier": "A_MUST_READ", "score": "9", "reason": "author whitelist: M. Zahid Hasan", "tags": ["Dirac", "Berrycurvature", "topological", "Landaulevel"], "image": "https://arxiv.org/html/2610.17464v2/fig1_schematic.png", "briefing": {"background": "디라크 페르미온은 질량 항(mass term) M에 의해 밴드 갭이 생길 수 있으며, 이 질량의 부호는 베리 곡률(Berry curvature), 홀 반응(Hall response), 그리고 가장자리 상태(edge state)의 진행 방향을 결정하는 핵심적인 위상학적 변수입니다.", "motivation": "기존의 주사 터널링 현미경(STM)과 같은 국소 분광법은 밴드 갭의 크기(|M|)만 측정할 수 있을 뿐, 질량의 부호 자체를 직접적으로 이미지화하는 데 한계가 있었습니다. 특히 스핀-궤도 얽힘은 측정된 스핀과 디라크 유사스핀 사이의 관계를 불분명하게 만듭니다.", "result": "본 연구는 C3 대칭축에서 스핀 분해 터널링(spin-resolved tunneling) 비대칭성을 통해 점유 밴드의 베리 곡률 부호를 직접 알아낼 수 있음을 입증했습니다. 또한, 스핀 비분해 팁을 사용하더라도 '0번 랜다우 준위(n=0 Landau level)'의 위치를 통해 질량 부호를 독립적으로 측정할 수 있음을 보였으며, 도메인 경계의 카이랄 모드를 통해 이를 검증했습니다.", "implication": "물질 내에서 단순히 갭이 어디에 생기는지를 넘어, 위상학적 성질(베리 곡률 부호)이 공간적으로 어떻게 변하는지 이미지화할 수 있는 길을 열었습니다. 이는 위상 도메인 및 도메인 벽의 물성을 연구하는 데 결정적인 도구가 됩니다.", "novelty": "결정 구조의 회전 대칭성을 이용하여 스핀-궤도 얽힘에 의한 모호성을 해결했다는 점이 혁신적입니다. 독자의 관심사인 Berry curvature, STM, 위상 반금속 연구와 직접적으로 연결되는 M. Zahid Hasan 그룹의 중요한 방법론적 진전입니다.", "unresolved": "이 방법론이 C3 이외의 다른 대칭성을 가진 시스템이나, 스핀-궤도 결합이 매우 극단적으로 강한 시스템에서 얼마나 보편적으로 적용될 수 있을지에 대한 추가 검증이 필요합니다.", "future_work": "다양한 자성 위상 절연체 및 반금속에서 위상 도메인 구조를 매핑하고, 질량 부호 반전에 따른 비정상 홀 효과의 국소적 변동을 연구하는 데 응용될 것으로 보입니다.", "concepts": [{"term": "Dirac mass sign", "why_emerged": "디라크 입자의 에너지 갭을 결정하는 질량 항의 부호가 베리 곡률의 방향과 위상적 불변량을 결정하기 때문입니다.", "origin": "초록 정보만으로는 특정하기 어려움 (디라크 방정식의 일반적 성질)", "connections": "Berry curvature, Chern number, Chiral edge states"}, {"term": "Spin-polarized tunneling (SP-STM)", "why_emerged": "표면의 국소적인 자기 구조와 전자 스핀 상태를 나노미터 스케일에서 관측하기 위해 고안되었습니다.", "origin": "1990년대 초 Wiesendanger 등에 의해 실험적으로 확립됨", "connections": "Magnetism, Topological insulators, Majorana fermions"}, {"term": "Zeroth Landau level (LL0)", "why_emerged": "자기장 하에서 디라크 페르미온의 에너지 준위 중, 질량 부호와 위상적 성질에 따라 에너지가 고정되거나 이동하는 특이한 상태이기 때문입니다.", "origin": "Haldane 모델 및 그래핀의 양자 홀 효과 연구에서 중요성이 부각됨", "connections": "Quantum Hall effect, Toplogical insulators, Dirac semimetals"}, {"term": "C3 symmetry", "why_emerged": "결정 구조의 대칭성이 전자 밴드의 스핀 및 오비탈 구성을 구속하여 복잡한 물리량을 단순화할 수 있게 해줍니다.", "origin": "고체물리학의 결정학적 군론(Group Theory) 기반", "connections": "Honeycomb lattice, TMDs, Kagome metals"}], "english_summary": ["Demonstrated a method to locally determine the topological sign of Dirac mass using spin-polarized STM.", "Used C3 crystalline symmetry to relate spin-polarized tunneling asymmetry directly to Berry curvature sign.", "Validated the mass sign via the zeroth Landau level position and chiral domain-wall modes.", "Enables spatial imaging of topological character changes within magnetic topological materials."]}}, {"title": "Orbital texture of valence band and interband transitions of the type-II multiferroic van der Waals NiI2", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2611.11425", "authors": "A. De Vita, O. E. Giehl, T. Mukherjee, M. Wolf, L. Rettig, R. Ernstorfer, T. Pincelli, L. T. Lloyd", "last_authors": "L. Rettig, R. Ernstorfer, T. Pincelli, L. T. Lloyd", "summary": "NiI$_2$ is a van der Waals semiconductor characterized by complex electronic and magnetic phases, holding promise towards functional applications. For this purpose, a detailed understanding of its band structure and its excitations is essential to elucidate the electronic and transport properties. We present a comprehensive description of the band structure and of the lowest valence-to-conduction band transition in bulk NiI$_2$, by means of time- and angle-resolved photoemission spectroscopy supported by first-principles calculations. We describe the orbital character of Ni and I manifolds, and identify the main momentum-resolved features of the valence band and the shallow minima of the conduction band. With this study, we provide a foundational understanding of the electronic structure of NiI$_2$ and its single-particle interband electronic excitation, a benchmark for theoretical models, and a framework for future investigations on this material.", "tier": "A_MUST_READ", "score": "9", "reason": "TARPES study of orbital texture and electronic structure in a van der Waals multiferroic material.", "tags": ["ARPES", "electronicstructure", "vanderWaals", "multiferroic"], "image": "https://arxiv.org/html/2611.11425v1/Fig1_r.png", "briefing": {"background": "NiI2는 층상 구조를 가진 van der Waals(vdW) 반도체이자, 전기적 질서와 자기적 질서가 공존하며 강하게 결합된 Type-II 다강성(multiferroic) 물질로 주목받고 있습니다.", "motivation": "이 물질의 차세대 소자 응용을 위해서는 밴드 구조와 전자적 여기 상태(excitation)에 대한 정밀한 이해가 필수적이지만, 상세한 운동량 분해 분광 데이터가 부족했습니다.", gle-resolved photoemission of epitaxial graphene", "journal": "arXiv_CondMat", "source": "keyword", "link": "https://arxiv.org/abs/2611.12733", "authors": "E. Favorite, P. Kr\\\"uger, Ph. Rosenzweig, R. Joshi, S. Williams, B. Matta, K. K\\\"uster, M. Hashimoto, U. Starke, H. Nakamura", "last_authors": "K. K\\\"uster, M. Hashimoto, U. Starke, H. Nakamura", "summary": "The epitaxial growth of monolayer graphene by Si sublimation of 6H-SiC(0001) is one of the most effective ways of producing large-scale monocrystalline graphene samples of high quality. However, graphene is left interacting with a reconstructed carbon buffer layer known as zerolayer graphene (ZLG) and the SiC substrate underneath. Beyond the mere creation of Dirac cone replicas, the effect of this interaction on photoemission measurements is poorly understood. We utilized synchrotron radiation for photon-energy-dependent angle-resolved photoemission spectroscopy (ARPES) to investigate the complex final-state interactions of photoelectrons within the heterostructure of monolayer graphene, ZLG, and SiC. We identify multiple resonances in the photoemission intensity of the Dirac cone as a function of photon energy that originate from interlayer interference, confirmed with a multiple scattering model. We also demonstrate for the first time that the relative intensity of the replica bands induced by the $(6\\sqrt{3} \\times 6\\sqrt{3})\\text{R}30^\\circ$ reconstruction scales with the electron kinetic energy. Finally, we resolved four nondispersing electronic states, which originate from the ZLG. Our findings show that the three-dimensional (3D) structure of SiC and ZLG manifests itself in the photoemission from two-dimensional (2D) epitaxial graphene. By revealing how 3D substrate architecture dictates the photoemission of a 2D layer, this work establishes a crucial framework for investigating the electronic structure of complex heterostructures via ARPES.", "tier": "A_MUST_READ", "score": "9", "reason": "  "One of the central goals in the emergent field of altermagnetism is the unambiguous experimental identification and characterization of altermagnetic order across a variety of compounds. This motivates exploring tools that can clearly distinguish altermagnets from antiferromagnets, based on symmetry signatures, and offer access to the dominant orbital character (e.g., d -wave versus g -wave) of the magnetic order parameter. In this work, we theoretically explore the potential of noise magnetometry for this task, studying contributions from both magnons and itinerant electrons in different regimes and scenarios. While altermagnetism and antiferromagnetism also lead to different noise spectra for magnons, we find the most striking and symmetry-sensitive signatures in the charge fluctuations of itinerant altermagnets. Both for the homogeneous bulk case and in the presence of strain and/or around domain walls, we identify noise contributions that are only permitted by symmetry in the altermagnet and, thus, provide a unique signature of altermagnetism. Furthermore, the angular dependence of noise around domain walls also offers access to the orbital character of the altermagnet. On a more technical note, we discuss the role and relevance of lattice effects related to the dipole tensor. We hope that our work will help pave the way toward the clear experimental identification of altermagnetism across a wide range of candidate materials.", "tier": "B_IMPORTANT_CONDMAT", "score": "9", "reason": "Focuses on experimental identification and characterization of altermagnetic order.; demoted from A: broad CM, not direct user/project hit", "tags": ["altermagnetism", "spectroscopy", "magnetism", "experimentalmethod"], "image": "", "briefing": {"background": "알터마그네티즘(Altermagnetism)은 기존의 강자성(Ferromagnetism)이나 반강자성(Antiferromagnetism) 분류에 속하지 않는 새로운 자기 질서로, 비전통적인 대칭성 파괴를 수반함.", "motivation": "다양한 후보 물질에서 알터마그네틱 질서를 실험적으로 명확히 식별하고, 반강자성과의 차이를 구별할 수 있는 새로운 분광학적 도구가 필요함.", "result": " K}$, a shielding fraction above 60\\%, and a specific-heat jump that confirms a bulk pairing transition. All crystals show besides superconductivity a coexistence with a density-wave or metal-insulator transition. The upper critical field shows a small anisotropy, $\\gamma \\approx 2.4$, which remains finite as $T \\to T_c$, indicating three-dimensional superconductivity with substantial coupling between the four-layer blocks. These results identify the square-planar nickelates $R_{n+1}$Ni$_n$O$_{2n+2}$ as a bulk platform in which the layer number alone tunes the nickel valence into the superconducting regime, without chemical substitution, pressure, or epitaxial constraint.", "tier": "B_IMPORTANT_CONDMAT", "score": "9", "reason": "Important new nickelate superconductor, highly relevant to broader correlated electron interests.", "tags": ["material", "superconductivity", "nickelate"], "image": "https://arxiv.org/html/2611.12788v1/figure1.png", "briefing": {"background": "니켈산염은 구리산염 고온 초전도체와 유사한 전자 구조를 가지고 있어, 새로운 고온 초전도체를 찾는 물질 탐색 연구의 핵심 분야입니다. 특히 무한층(infinite-layer) 구조를 넘어 다양한 층상 구조(Ruddlesden-Popper상)에서 초전도성을 구현하려는 노력이 계속되고 있습니다.", "motivation": "기존의 니켈산염 초전도성은 박막 성장에 의존하거나 고압 환경이 필요했습니다. 본 연구는 벌크 단결정 상태에서 대기압 초전도성을 구현하여 물질 고유의 특성을 명확히 밝히고자 합니다.", "result": "La5Ni4O10 벌크 단결정을 성공적으로 합성하였으며, 18K에서 초전도성을 확인하였습니다. 벌크 성질을 증명하는 비열 점프가 관측되었으며, 3차원적인 초전도 이방성을 보입니다.", "implication": "화학적 치환이나 외부 압력 없이도 층 수를 조절하는 것만으로 니켈의 원자가를 초전도 영역으로 제어할 수 있는 새로운 경로가 확보되었습니다.", "novelty": "박막 에피택셜 변형 없이 벌크 결정에서 초전도성을 구현했다는 점이 핵심입니다. 사용자 프로필의 강상관 전자계 연구에서 새로운 후보 물질로 매우 흥미롭습니다.", "unresolved": "초전도성과 함께 관측된 전하 밀도 파동(CDW) 혹은 금속-절연체 전이와의 공존 메커니즘에 대한 상세한 미시적 설명이 필요합니다.", "future_work": "ARPES를 통한 페르미 표면 측정 및 전자-포논 결합 상호작용 분석을 통해 초전도 매커니즘을 규명하는 실험이 이어질 것입니다.", "concepts": [{"term": "Ruddlesden-Popper 니켈산염", "why_emerged": "페로브스카이트 구조를 기반으로 층 수를 조절하여 전자 상관관계를 제어하기 위해 필요함.", "origin": "S.N. Ruddlesden and P. Popper (1957).", "connections": "고온 초전도체 구리산염의 원리 탐구와 연결됨."}, {"term": "Topotactic reduction", "why_emerged": "산소 함량을 정밀하게 조절하면서 결정 구조의 기본 골격을 유지하기 위해 필요함.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "니켈산염 박막 및 결정 합성의 표준 공정으로 사용됨."}], "english_summary": ["Bulk single crystals of La5Ni4O10 were synthesized at ambient pressure.", "The material exhibits bulk superconductivity at Tc ~ 18 K.", "Coexistence with a density-wave state is observed.", "Layer number modulation serves as a key knob for tuning nickel valence for superconductivity."]}}, {"title": "Contrasting one- and two-particle excitations in cuprate strange metals", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2611.12569", "authors": "Falk R\\\"oder. Roman Schuster, Martin Knupfer, Axel Lubk, J\\\"org Fink", "last_authors": "Axel Lubk, J\\\"org Fink", "summary": "In unconventional superconductivity, the pairing mechanism remains one of the central unresolved problems in solid-state physics. Moreover, the normal state shows strong deviations from conventional Fermi-liquid behavior, most notably a scattering rate that is linear in energy and temperature. Here we study the momentum dependence of the energy and damping of collective excitations in optimally doped cuprates in the normal state. In particular, we analyze existing Electron Energy Loss Spectroscopy (EELS) data of Bi2Sr2CaCu2O8 [Phys. Rev. B 44, 7155 (1991)] and new analogous optical plasmon data of Bi2Sr2Ca2Cu3O10. Furthermore, we reanalyze similar Resonant Inelastic Xray Scattering (RIXS) acoustic plasmon data [Phys. Rev. R 6, 043184 (2024)] of La1.84Sr0.16CuO4 and La1.84Ce0.16CuO4. We contrast these two-particle excitation results with one-particle excitations measured by Angle-Resolved Photoemission Spectroscopy (ARPES). Most of the plasmon behavior can be described well by combined self-energies of a hole and an electron. The dispersion of optical plasmons at high energy is only weakly determined by correlation effects, indicating resilient quasiparticles. The damping of the optical plasmons at  rates.", "No evidence found for overdamped optical plasmons below the Lindhard limit."]}}, {"title": "Discovery of Kondo-Kramers Nodal Line Topological State in strongly correlated material CeAuAl3", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2611.10368", "authors": "Hari Bhandari, Kevin Allen, Kuan-Sen Li, et al.", "last_authors": "Qimiao Si, Emilia Morosan", "summary": "Kramers nodal lines (KNLs) are predicted in all achiral, non-centrosymmetric crystal structures, and yet there are very few experimental realizations of KNLs, only in weakly correlated systems. Especially, their realization in strongly correlated systems remains unexplored. Here we investigate KNL topology in the non-centrosymmetric, achiral Kondo lattice CeAuAl$_3$, using magnetotransport, thermodynamic measurements, density functional theory (DFT), and tight-binding toy model calculations. We find that CeAuAl$_3$ hosts KNLs in the $\\mathit{\\Gamma}\\text{-}Z$ and $X\\text{-}P$ directions, protected by time-reversal and mirror symmetries. Breaking of these crystalline symmetries, along with time-reversal symmetry via spin polarization, lifts the KNL degeneracy, which, in turn, generates Berry curvature resulting in an intrinsic anomalous Hall effect (AHE). More importantly, CeAuAl$_3$ shows large AHE not only below the magnetic ordering temperature $T_N$ but rather below the Kondo temperature. This underscores the role of the Kondo correlations in bringing the KNLs at the Fermi surface rather than at accidental energies, as would be expected without correlations. Our work identifies a new topological state, Kondo-Kramers Nodal Line, with CeAuAl$_3$ being the first compound explicitly identified to host this new correlated topological state, and demonstrating the expected AHE associated with it. More generally, our work outlines the pathway for finding Kondo-KNL systems in all compounds that combine achiral, non-centrosymmetric structure with Kondo correlations ": "Imaging spin entanglement with a scanning tunneling microscope", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2611.10946", "authors": "J. C. G. Henriques, B. Vi\\~na-Baus\\'a, I. Brihuega, J. Fern\\'andez-Rossier", "last_authors": "J. C. G. Henriques, B. Vi\\~na-Baus\\'a, I. Brihuega, J. Fern\\'andez-Rossier", "summary": "Artificial spin arrays assembled on surfaces enable atomic-scale studies of quantum correlations. Here we establish a hierarchy of connections between spin inelastic electron tunneling spectroscopy (IETS) and entanglement in spin- 1 / 2 1/2 systems. We first show that the number of spectroscopically active transitions in a spin- 1 / 2 1/2 dimer serves as an entanglement witness. Using the leading-order tunneling conductance for the tip placed on spin i i , d ​ I ​ ( i ) / d ​ V dI(i)/dV , we then relate spectral moments ℳ ( n ) ​ ( i ) = ∫ V n ​ ( d 2 ​ I ​ ( i ) / d ​ V 2 ) ​ 𝑑 V \\mathcal{M}^{(n)}(i)=\\int V^{n}(d^{2}I(i)/dV^{2})\\,dV to quantum correlations. The zeroth moment probes the one-tangle in systems with a gapped, nondegenerate ground state. For rotationally invariant Heisenberg systems, the first moment yields thermal spin correlators ⟨ 𝑺 ⁡ ( i ) ⋅ 𝑺 ⁡ ( j ) ⟩ \\langle\\boldsymbol{S}(i)\\cdot\\boldsymbol{S}(j)\\rangle , enabling reconstruction of nearest-neighbor concurrence and spatial imaging of entanglement in spin chains. It also provides access to the internal energy and magnetic specific heat, both usable as entanglement witnesses. Applying this approach to experimental IETS data from nanographene spin chains, we find good agreement with theory. We further discuss how the second moment probes longer-range correlations and the inverse moment relates to local spin susceptibility. For spin- 1 / 2 1/2 trimers, we connect inter-multiplet inelastic spectral weight to genuine tripartite entanglement quantified by the concurrence fill. Finally, we reconcile the local character of IETS with its sensit  "origin": "초록 정보만으로는 특정하기 어려움", "connections": "Nernst 효과, 스핀 홀 효과와 연결됨."}, {"term": "Thermal Edelstein effect", "why_emerged": "스핀-궤도 결합 시스템에서 비평형 스핀 축적을 열적 방법으로 유도하기 위해 필요.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "Edelstein 효과(Rashba 시스템에서의 전류 유도 스핀 분극)의 열적 버전."}], "english_summary": ["Theoretical study of thermospintronic responses in proximity-induced superconductors.", "Identifies spin Nernst and thermal Edelstein effects driven by Berry curvature.", "Highlights the role of SOC-induced Bloch band topology in superconducting states.", "Provides a foundation for spin-current control in superconducting hybrid devices."]}}, {"title": "Bulk signatures of reentrant superconductivity in UTe2 from ultrasound measurements", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/bfzx-dwmb", "authors": "N. Marquardt, C. Duffy, C. Proust, S. Badoux, M. Amano Patino, G. Lapertot, D. Aoki, J.-P. Brison, G. Knebel, and D. LeBoeuf", "last_authors": "D. Aoki, J.-P. Brison, G. Knebel, and D. LeBoeuf", "summary": "The authors study here the field-reentrant superconducting phase of the unconventional superconductor UTe 2 using ultrasound measurements up to 77 T and down to 0.5 K. They find clear signatures of the field reentrant superconducting phase found for a field angle of 30 degrees from the b to the c axis in a longitudinal elastic mode, establishing the bulk nature of this superconducting phase. The authors observe an intriguing excess attenuation across the superconducting phase, which suggests unusual vortex dynamics and pinning mechanisms.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Experimental study of reentrant superconductivity in the unconventional superconductor UTe2.", "tags": ["unconventionalsuperconductivity", "heavyfermion", "experiment", "vortexdynamics"], "image": "", "briefing": {"background": "UTe2는 시간 반전 대칭이 깨진 비전통적 초전도체로, 강력한 스핀-삼중항 초전도 가능성 때문에 매우 주목받고 있습니다. 고자기장에서 나타나는 재진입 초전도 현상은 이 물질의 복잡한 전자 구조와 다체 상호작용을 파악하는 주요 단서입니다.", "motivation": "고자기장에서 나타나는 UTe2의 재진입 초전도 상이 단순히 표면적인 현상인지, 아니면 물질 내부의 본질적인 특성인지를 명확히 규명하고자 했습니다.", "result": "초음파 측정을 통해 77 T까지의 극한 자기장 조건에서 재진입 초전도상의 벌크적인 성질을 증명했습니다. 특히 초전도 구간에서의 과도한 감쇠(excess attenuation)는 특이한 볼텍스 동역학 및 피닝 메커니즘을 시사합니다.", "implication": "UTe2의 고자기장 상이 단순한 실험 오류가 아닌 물질 고유의 물리임을 확정했으며, 이는 비전통적 초전도체의 자기장 응답 모델을 정립하는 데 필수적인 데이터가 될 것입니다.", "novelty": "77 T의 초고자기장 실험을 통해 UTe2의 물리적 한계를 시험했다는 점이 중요하며, 볼텍스 물리와 결합하여 독자의 관심사인 강상관계 물질 연구에 기여합니다.", "unresolved": "관찰된 특이 볼텍스 동역학의 정확한 미시적 기원과 왜 특정 각도(b-c 평면 30도)에서만 이 상이 극대화되는지에 대한 이론적 설명이 부족합니다.", "future_work": "해당 각도에서의 정밀한 전자 구조 계산 및 초음파 신호의 이론적 피팅을 통한 볼텍스 격자 구조 연구가 필요합니다.", "concepts": [{"term": "Reentrant superconductivity", "why_emerged": "자기장이 증가하면 초전도가 파괴되어야 함에도 불구하고 다시 초전도 상태로 돌아오는 이상 현상을 설명하기 위해.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "Jaccarino-Peter 효과, 스핀-궤도 결합, 강상관 전자계와 연관."}, {"term": "Vortex dynamics", "why_emerged": "초전도체 내 자기력선(볼텍스)의 움직임이 임계 전류 및 에너지 손실에 미치는 영향을 이해하기 위해.", "origin": "Abrikosov (1957)", "connections": "초전도 비저항, 피닝 메커니즘, Ginzburg-Landau 이론."}], "english_summary": ["Investigation of field-reentrant superconductivity in UTe2 up to 77 T.", "Ultrasound measurements confirm the bulk nature of the reentrant phase.", "Observes anomalous vortex dynamics and pinning mechanisms.", "Strengthens the understanding of unconventional triplet pairing in UTe2."]}}, {"title": "Comparative Raman study of Ruddlesden-Popper nickelates and the monolayer-trilayer polymorph", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/m2js-yzky", "authors": "Vignesh Sundaramurthy, Abhi Suthar, Pascal Puphal, et al.", "last_authors": "Bernhard Keimer, Matthias Hepting", "summary": "Ruddlesden-Popper (RP) nickelates have attracted intense interest following the discovery of superconductivity in several members of the series, including bilayer (BL) La 3 Ni 2 O 7 , trilayer (TL) La 4 Ni 3 O 10 , and structural polymorphs composed of monolayer-bilayer or monolayer-trilayer (ML-TL) units. However, an inherent propensity of the RP series to form intergrown phases during single-crystal synthesis, together with spatial variations in oxygen stoichiometry, has complicated the determination of their intrinsic material properties. As a consequence, conflicting reports have emerged on both their electronic phase transitions and lattice dynamics. In this work, we perform a comparative study of the phononic and electronic Raman responses of high-quality ML-TL single crystals and contrast them with those of the other RP nickelates, using samples with optimized oxygen content. We establish several Raman spectral features that enable unambiguous phase identification across the series. Moreover, we uncover characteristics in the phononic and electronic Raman response of ML-TL that are not reflected in the pure ML and TL compounds. We attribute these differences to a distinctive electronic structure arising from self-doping and confinement effects induced by the ML unit within the ML-TL lattice architecture.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Raman study of superconducting Ruddlesden-Popper nickelates, a key unconventional superconductor class.", "tags": ["nickelates", "superconductivity", "Ramanspectroscopy", "unconventionalsuperconductivity"], "image": "", "briefing": {"background": "라델스덴-포퍼(RP) 니켈산염은 고온 초전도체인 큐프레이트와 유사한 전자 구조를 가져 제2의 고온 초전도 후보 물질로 큰 주목을 받고 있습니다. 하지만 합성이 어렵고 상 분리가 빈번하여 물질 특성 규명에 어려움이 많았습니다.", "motivation": "서로 다른 층 구조가 섞인(ML-TL) 시료에서 발생하는 라만 산란 신호의 복잡성을 해결하고, 이들의 층 구조가 전자 구조에 미치는 영향을 규명하고자 했습니다.", "result": "라만 분광법을 사용하여 다양한 RP 니켈산염 상을 구분하는 지표를 확립했습니다. 특히 ML-TL 시료에서 순수한 ML이나 TL 화합물에는 없는 특이한 전자/격자 응답을 발견했으며, 이는 ML 유닛에 의한 자기 도핑과 구속 효과 때문임을 밝혔습니다.", "implication": "복잡한 니켈산염 시료에서도 고품질 데이터를 얻을 수 있는 분석법을 제시했습니다. 또한 층간 상호작용이 전자 상태를 얼마나 근본적으로 바꿀 수 있는지 보여주어, 2D 이종접합 설계의 중요성을 확인했습니다.", "novelty": "독자의 관심사인 2D 및 다층 물질의 구조-성질 관계를 라만 기법으로 풀어냈으며, 특히 층간 구속 효과가 새로운 물리적 위상을 유도할 수 있음을 실험적으로 증명했습니다.", "unresolved": "ML-TL 복합 구조에서의 전자 상태가 초전도성에 미치는 정확한 기여도는 여전히 논쟁적입니다.", "future_work": "추가적인 전하 수송 측정(수송 특성)과 ARPES를 결합하여 라만에서 관찰된 전자 상태를 직접 확인하는 연구가 요구됩니다.", "concepts": [{"term": "Ruddlesden-Popper nickelates", "why_emerged": "큐프레이트와 유사한 2차원 평면 구조를 가진 니켈산염의 초전도성을 탐구하기 위해.", "origin": "Ruddlesden and Popper (1950s)", "connections": "La2NiO4, La3Ni2O7, 고온 초전도체와의 유비."}, {"term": "Self-doping", "why_emerged": "구조 내의 서로 다른 층 간 전하 이동으로 인해 도핑 없이도 캐리어 밀도가 변하는 현상을 이해하기 위해.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "전하 전이, Mott 절연체, 다층 이종구조 물리."}], "english_summary": ["Comparative Raman study of Ruddlesden-Popper nickelate polymorphs.", "Identifies distinct spectral features for phase identification in intergrown crystals.", "Reports emergence of unique electronic/lattice signatures in ML-TL units.", "Attributes findings to self-doping and confinement effects in layered architectures."]}}, {"title": "Comparative analysis of unconventional spin-orbit torques and magnetization switching efficiencies in Fe3GeTe2/WTe2", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/n4mx-v1fx", "authors": "Niklas Kercher, Paul Noël, Emir Karadža, Pietro Gambardella", "last_authors": "Emir Karadža, Pietro Gambardella", "summary": "We report on current-induced spin–orbit torques and field-free magnetization switching in a two-dimensional van der Waals heterostructure consisting of ${\\text{WTe}}_{2}$ as the spin source and ${\\mathrm{Fe}}_{3}{\\mathrm{GeTe}}_{2}$ as the magnetic layer. Harmonic magneto-optical Kerr effect measure…", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Experimental study of spin-orbit torques in van der Waals heterostructure of relevant materials.", "tags": ["vanderWaalsheterostructures", "2Dmaterials", "spintronics", "magneticmaterials", "spin-orbittorque"], "image": "", "briefing": {"background": "반데르발스(vdW) 이종접합 구조는 서로 다른 성질의 2차원 물질을 쌓아 새로운 물리적 현상을 구현하는 spintronics 분야의 핵심 플랫폼입니다. 특히 WTe2와 같은 전이금속 디칼코게나이드(TMD)의 강력한 스핀-궤도 결합(SOC)을 이용한 스핀-궤도 토크(SOT) 생성 효율 연구가 중요합니다.", "motivation": "Fe3GeTe2(FGT)는 대표적인 vdW 자성체로, FGT/WTe2 이종접합 구조에서 나타나는 SOT와 필드 프리(field-free) 자화 스위칭 효율을 측정하여 실질적인 응용 가능성을 평가하고자 합니다.", "result": "고조파 자기광학 커 효과(MOKE) 측정을 통해 FGT/WTe2 계면에서 SOT 발생을 확인하였으며, 이를 이용한 효율적인 자화 스위칭 거동을 보고했습니다.", "implication": "vdW 자성체와 위상 물질의 조합이 저전력 차세대 메모리 소자 설계에 효과적인 스핀 원천 및 제어 기법을 제공할 수 있음을 입증합니다.", "novelty": "기존의 금속/자성체 이종접합과 달리 2D 물질 간의 깨끗한 계면을 이용한 SOT 조절을 연구했다는 점이 본 연구의 핵심이며, 독자의 자성 위상 물질 연구에 좋은 대조군이 될 수 있습니다.", "unresolved": "계면의 원자 수준 결함이나 층간 뒤틀림(twist angle)이 구체적인 토크 효율에 미치는 미세한 영향은 명확히 규명되지 않았습니다.", "future_work": "층간 뒤틀림 각도에 따른 스핀 토크의 의존성 및 다양한 vdW 자성체 조합을 통한 효율 최적화 연구가 필요합니다.", "concepts": [{"term": "Spin-Orbit Torque (SOT)", "why_emerged": "전류를 통해 자성체의 자화 방향을 효율적으로 제어하여 비휘발성 메모리 소자의 동작을 개선하기 위해 필요합니다.", "origin": "Miron et al. (Nature, 2011) 등에 의해 금속 계면에서 초기에 확립되었습니다.", "connections": "Rashba 효과, Spin Hall 효과와 밀접한 관련이 있습니다."}, {"term": "Fe3GeTe2 (FGT)", "why_emerged": "2차원 위상 절연체나 자성체 연구에서 층상 구조를 가진 자성 금속으로서, 게이트 전압을 통한 자성 조절이 가능하여 주목받고 있습니다.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "CrI3, Cr2Ge2Te6와 함께 2D 자성체 연구의 핵심 소재입니다."}], "english_summary": ["Investigated spin-orbit torque (SOT) in a vdW heterostructure of WTe2 and Fe3GeTe2.", "Demonstrated field-free magnetization switching driven by current in this 2D system.", "Used harmonic MOKE measurements to quantify the SOT efficiency.", "Highlights the potential of van der Waals magnetic heterostructures for energy-efficient spintronics."]}}, {"title": "Correlated insulating states in twisted double bilayer graphene on CrOCl enhanced by interfacial charge transfer effect", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/4klk-mgwy", "authors": "Ning Ma, Zekang Zhou, Chiara Cocchi, et al.", "last_authors": "Jian-Hao Chen, Mitali Banerjee", "summary": "Here, the authors investigate electrical transport in twisted double bilayer graphene (TDBG) on the antiferromagnetic material CrOCl (COC). At ultrahigh magnetic fields, an enhanced correlated insulating state is observed at half-filling of TDBG, which is attributed to the charge transfer effect between TDBG and COC. The authors further characterize the behavior of the correlated state by systematic temperature- and magnetic-field dependent measurements. Their results highlight the interfacial charge-related effect as a promising approach to manipulating the correlated states in moiré systems.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Experimental study of correlated states in twisted bilayer graphene heterostructure with magnetic substrate.", "tags": ["graphene", "twistedbilayer", "moire", "correlatedelectrons", "heterostructure", "experiment", "magnetism"], "image": "", "briefing": {"background": "모아레 초격자(moire superlattice) 시스템은 층간 뒤틀림을 통해 전자 상관관계를 제어할 수 있는 플랫폼입니다. 특히 이종물질과의 계면 전하 이동은 시스템의 위상적, 자기적 상태를 조절하는 강력한 수단입니다.", "motivation": "뒤틀린 이중 이중층 그래핀(TDBG)을 반강자성체인 CrOCl 위에 적층했을 때, 계면 전하 이동이 강상관 절연 상태에 미치는 영향을 규명하고자 합니다.", "result": "초고자기장에서 CrOCl로 인한 전하 이동이 TDBG의 반충진 상태(half-filling)에서의 절연성을 강화함을 관측하였습니다.", "implication": "자기적 기질(substrate)과의 근접 효과를 이용해 모아레 시스템의 강상관 상태를 외부에서 정밀하게 튜닝할 수 있는 새로운 가능성을 제시합니다.", "novelty": "일반적인 모아레 그래핀 연구에서 나아가 자성 절연체(CrOCl)를 기질로 사용하여 계면 전하 이동 효과를 입증했다는 점이 독특합니다.", "unresolved": "강화된 절연 상태의 구체적인 자기적 정렬 구조나 전하 이동의 미시적 경로에 대한 완전한 이해는 아직 부족합니다.", "future_work": "전하 이동의 크기를 게이트 전압으로 미세 조절하여 절연체-금속 전이의 양상을 더 정밀하게 관측하는 실험이 필요합니다.", "concepts": [{"term": "Twisted Double Bilayer Graphene (TDBG)", "why_emerged": "매직 앵글 그래핀과 유사하게 밴드 구조를 평탄화하여 강상관 현상을 발현시키기 위해 설계되었습니다.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "Twisted bilayer graphene (TBG), 꼬인 이중층 시스템 전반."}, {"term": "Interfacial Charge Transfer", "why_emerged": "이종 구조 간의 화학적 포텐셜 차이로 인해 발생하는 전하 흐름이 시스템의 캐리어 밀도 및 전자 상태를 변조하기 때문입니다.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "근접 효과(Proximity effect), 도핑 공학."}], "english_summary": ["Studied twisted double bilayer graphene (TDBG) on an antiferromagnetic , "briefing": {"background": "InAs/GaInSb 기반의 양자 스핀 홀 절연체는 위상학적 상태를 보존하기 위해 강한 절연 특성이 필요하지만, 부수적인 벌크 및 가장자리 전도 채널이 이 위상학적 성질의 관측을 방해합니다.", "motivation": "이중 게이트(dual-gate) 구조를 사용하여 정전기적 제어를 통해 원치 않는 벌크 전도 및 부수적 가장자리 채널의 기여를 최소화하고자 합니다.", "result": "이중 게이트 제어를 도입함으로써 III-V족 반도체 이종접합 구조에서 보다 강력하고 깨끗한 헬리컬 가장자리 채널 수송을 구현했습니다.", "implication": "위상학적 소자의 성능 저하 원인을 제어 기술로 해결함으로써, 실질적인 위상학적 양자 컴퓨팅 및 스핀트로닉스 소자 개발의 가능성을 높였습니다.", "novelty": "기존의 복잡한 성장 공정 한계를 정전기적 게이트 제어라는 비교적 단순한 방법으로 극복하여 위상학적 수송의 순도를 높였습니다.", "unresolved": "더 넓은 온도 범위에서의 수송 특성 유지 가능성과 소자의 장기적 안정성에 대한 추가 검증이 필요합니다.", "future_work": "위상학적 상전이 경계면에서의 수송 특성 정밀 분석 및 이중 게이트 소자를 활용한 간섭계 실험.", "concepts": [{"term": "양자 스핀 홀 절연체(QSHI)", "why_emerged": "물질 내부에서는 절연체이지만 가장자리에서는 스핀 편극된 전류가 흐르는 상태를 활용하기 위해 필요했습니다.", "origin": "Bernevig, Hughes, Zhang (2006)", "connections": "Topological insulators, Spin-orbit coupling"}, {"term": "헬리컬 가장자리 채널", "why_emerged": "QSHI에서 스핀과 운동량이 고정된 상태로 가장자리를 따라 흐르는 비산란(backscattering-free) 전도를 구현하기 위해 필요했습니다.", "origin": "Kane & Mele (2005)", "connections": "Quantum Hall effect, Helical liquid"}], "english_summary": ["Mitigates parasitic bulk and edge conduction in InAs/GaInSb topological insulators.", "Utilizes dual-gate electrostatic control to isolate helical edge channels.", "Improves the robustness of quantum spin Hall transport experiments.", "Provides a scalable method for cleaning up topological transport signals."]}}, {"title": "Field-tuned and zero-field fractional Chern insulators in twisted bilayer graphene", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/gmtx-h1gs", "authors": "Daniel E. Parker, Patrick Ledwith, Eslam Khalaf, et al.", "last_authors": "Amir Yacoby, Ashvin Vishwanath", "summary": "In contrast to the fractional quantum Hall (FQH) effect, where electron density fixes the applied magnetic field, fractional Chern insulators (FCIs) can realize FQH states in comparatively weak or even zero magnetic fields. Previous theoretical work highlighted magic-angle graphene as a promising FC…", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Important experimental/theoretical progress on fractional Chern insulators in twisted bilayer graphene.", "tags": ["moire", "graphene", "quantum_Hall", "topological"], "image": "", "briefing": {"background": "분수 양자 홀 효과는 강한 자기장을 필요로 하지만, 분수 천 절연체(FCI)는 모아레 격자 구조 등에서 자기장 없이도 위상학적 분수 상태를 구현할 수 있다는 이론적 가능성이 제시되어 왔습니다.", "motivation": "마법 각도 비틀린 이중층 그래핀(MATBG) 시스템에서 자기장 유무에 따른 분수 천 절연체 상태를 실험적으로 관측하고 검증하고자 합니다.", "result": "비틀린 이중층 그래핀에서 자기장 보조 및 제로 자기장 조건 모두에서 분수 천 절연체 상태가 발현됨을 관측했습니다.", "implication": "위상학적 양자 상태를 자기장 없이 구현할 수 있음을 보여주었으며, 이는 비전통적 초전도체나 강상관 전자계와 위상학의 연결을 더욱 공고히 합니다.", "novelty": "이론적으로 예측되던 제로 자기장 분수 천 절연체를 실험적으로 확립하여 모아레 물리학의 위상학적 응용 분야를 크게 확장했습니다.", "unresolved": "해당 상태의 안정성 및 다른 모아레 물질에서의 보편적 발현 여부가 추가 연구 과제로 남아 있습니다.", "future_work": "분수 천 절연체 상태의 정밀한 위상학적 불변량 측정 및 엑시톤-위상학 상호작용 연구.", "concepts": [{"term": "분수 천 절연체(FCI)", "why_emerged": "외부 자기장 없이도 강한 전자 상관관계에 의해 분수 양자 홀 효과와 유사한 위상학적 상태를 구현하기 위해 고안되었습니다.", "origin": "Neupert et al. (2011)", "connections": "Fractional Quantum Hall effect, Chern bands"}, {"term": "비틀린 이중층 그래핀(MATBG)", "why_emerged": "그래핀 층간 각도를 조절하여 밴드 구조를 평탄화함으로써 강한 전자 상관 효과를 유도하기 위해 고안되었습니다.", "origin": "Cao et al. (2018)", "connections": "Moiré physics, Unconventional superconductivity"}], "english_summary": ["Reports evidence of fractional Chern insulators in magic-angle twisted bilayer graphene.", "Confirms these states exist at both high and zero magnetic fields.", "Bridges the gap between fractional quantum Hall effect and moiré lattice systems.", "Solidifies the potential of moiré materials for topological phases."]}}, {"title": "Intrinsic moiré domains of twisted boron nitride", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/qf9t-rsc5", "authors": "Xiao-Yu Ma, Lu-Qi Wei, Wen-Cheng Fan, et al.", "last_authors": "Chun-Gang Duan, Ni Zhong", "summary": "Moiré ferroelectric systems exhibit stacking-dependent interfacial polarization at the atomic thickness limit, inspiring a promising platform for next-generation devices. This unique ferroelectricity has been explored using a range of techniques. However, the built-in electric field arising from pie…", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Study of intrinsic moiré domains in twisted boron nitride, relevant to moiré/twisted bilayer systems.", "tags": ["moirésystems", "twistedbilayer", "vanderWaals", "ferroelectrics"], "image": "", "briefing": {"background": "질화붕소(BN)와 같은 2차원 적층 구조에서 발생하는 모아레 무늬는 국소적인 적층 변화를 통해 이질적인 물리적 특성을 유도할 수 있어 차세대 소자 플랫폼으로 주목받고 있습니다.", "motivation": "모아레 강유전성 시스템에서 적층 의존적인 계면 분극이 보고되고 있으나, 내부 전기장의 기원과 그에 따른 물리적 제어 메커니즘을 명확히 규명할 필요가 있습니다.", "result": "본 연구는 뒤틀린 질화붕소 구조 내에서 발생하는 고유한 모아레 도메인 구조를 분석하고, 이러한 적층 구조가 어떻게 전기적 분극을 유도하는지 구체화했습니다.", "implication": "모아레 도메인 제어를 통해 원자 단위 두께에서 강유전성을 조절할 수 있음을 시사하며, 이는 모아레 시스템을 기반으로 한 나노 전자 소자 설계의 중요한 이정표가 될 수 있습니다.", "novelty": "모아레 시스템에서의 강유전성을 원자적 수준에서 체계화했으며, 이는 독자가 관심을 가지는 2D 반데르발스 이질구조 및 관련 물리 연구에 직접적인 응용 가능성을 제시합니다.", "unresolved": "실험적 결과 외에 구조적 결함이 도메인 경계의 안정성에 미치는 영향은 여전히 상세한 조사가 필요합니다.", "future_work": "실제 소자 구현을 위한 도메인 월 제어 실험 및 비선형 광학 특성을 이용한 실시간 관찰 연구가 기대됩니다.", "concepts": [{"term": "모아레 강유전성", "why_emerged": "2차원 물질을 특정 각도로 적층했을 때 생기는 주기적 패턴이 반전 대칭성을 깨뜨려 분극을 유도하기 위해 필요함.", "origin": "최근 수년 내 2D 적층 구조 연구자들에 의해 정립됨.", "connections": "뒤틀린 이층 그래핀, 2D 강유전체 연구와 밀접함."}, {"term": "적층 의존적 계면 분극", "why_emerged": "원자 층 사이의 접촉 방식에 따라 전자 밀도 재분포가 달라지는 현상을 설명하기 위해 제안됨.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "반데르발스 이질구조 전자구조 공학."}], "english_summary": ["Investigates the intrinsic moiré domains in twisted boron nitride systems.", "Explores stacking-dependent interfacial polarization at the atomic scale.", "Provides insights into controlling ferroelectricity via moiré engineering.", "Highlights the potential for next-generation nano-electronic devices."]}}, {"title": "Ligand-mediated origin of altermagnetic spin splitting", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/s83n-w474", "authors": "Luigi Camerano, Federico Bisti, Gianni Profeta", "last_authors": "Federico Bisti, Gianni Profeta", "summary": "Altermagnets host spin-split electronic bands despite zero net magnetization, opening new routes for spintronics beyond conventional ferromagnets. Going beyond symmetry-based classifications, which specify allowed terms but not their hierarchy, here we use first-principles calculations and Wannier Hamiltonian engineering to uncover the microscopic bonding contributions of altermagnetic spin splitting in the g -wave altermagnet Co 1 / 4 NbSe 2 . We show that the splitting is captured by a short-range tight-binding model, establishing its local origin. By selectively controlling hopping channels, we demonstrate that the dominant contribution arises not from direct magnetic-ion hopping, but from ligand-mediated hybridization that transfers anisotropy to itinerant states. This identifies ligand-assisted coupling as a dominant mechanism driving altermagnetic spin splitting in intercalated metals, providing a microscopic bridge between minimal models and material-specific electronic structure calculations in altermagnets.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Theoretical study on the origin of altermagnetic spin splitting, a key user interest.", "tags": ["altermagnetism", "theory", "DFT", "electronicstructure"], "image": "", "briefing": {"background": "알터자성(Altermagnetism)은 순 자화가 영(0)임에도 불구하고 전자 밴드 구조에서 스핀 갈라짐(spin splitting)이 발생하는 새로운 자기 상태로, 차세대 스핀트로닉스의 핵심 개념입니다.", "motivation": "대칭성 기반의 분류를 넘어, 알터자성 스핀 갈라짐을 유도하는 미시적 결합 메커니즘을 규명하고 일반화된 모델을 도출하고자 합니다.", "result": "Co1/4NbSe2를 모델 물질로 사용하여, 스핀 갈라짐의 주된 기원이 자기 이온의 직접적인 호핑이 아니라 리간드를 매개로 한 혼성(ligand-mediated hybridization)에 있음을 입증했습니다.", "implication": "알터자성 물질의 전자구조 설계 시 리간드의 역할을 정량적으로 제어함으로써 스핀 밴드 엔지니어링이 가능함을 보여줍니다.", "novelty": "기존의 대칭성 위주 논의를 넘어, Wannier Hamiltonian과 DFT를 l Haeuser, Martin Mootz, Dasol Kim, et al.", "last_authors": "Long Ju, Jigang Wang", "summary": "The sub-cycle acceleration of charge carriers in an electronic circuit by tailored terahertz (THz) electric-field waveforms, rather than conventional pulsed bias voltages, opens a transformative frontier for lightwave electronics operating far beyond the scaling limits of gigahertz electronic technologies. Yet gate-tunable coherent control of multi-order and non-perturbative currents has remained elusive. Here, we demonstrate lightwave control over the amplitude, phase flips, and zero-crossings of THz field-driven high-order currents by utilizing phase-locked pairs of single-cycle THz fields in a dual-gated bilayer graphene (BLG) device. By leveraging the in-situ tuning of both bandgap and charge doping, we reveal extreme THz photocurrent rectification and sub-THz-cycle current generation that are governed by a strong field-driven crossover from interband multi-photon coherence to intraband lightwave acceleration, whose competition provides an exceptional sensitivity to the THz-pulse pair drive. Our interferometric nonlinear THz photocurrent spectroscopy of sub-cycle electronic excitations accesses and controls non-perturbative, multi-quantum photocurrents, which manifest as an extreme-order THz frequency comb. Quantum-kinetic simulations map these lightwave-controlled electron trajectories, revealing that sub-THz-cycle ballistic transport underpins gate- and THz-field-driven functionality enabled by electrostatic doping and bandgap tuning within the atomically thin device architecture. The demonstrated on-demand coherent control of nonperturbative photocurrent transport regimes can be extended to a broad range of atomically thin device architectures, opening new avenues for gate- and field-programmable logic, memory, and quantum simulators in which electronic pathways are steered on sub-cycle, petahertz timescales and atomic length scales.", "tier": "B_IMPORTANT_CONDMAT   if (r.link) { const link = document.createElement('a'); link.className = 'link'; link.href = r.link; link.target = '_blank'; link.rel = 'noopener noreferrer'; link.textContent = 'Open paper'; headText.appendChild(link); }
  head.appendChild(headText);
  if (r.summary) { const abstract = document.createElement('p'); abstract.className = 'original-abstract'; const strong = textEl('strong', '', 'Original abstract'); abstract.appendChild(strong); abstract.append(r.summary); head.appendChild(abstract); }
  slideEl.appendChild(head);
  const briefing = document.createElement('div');
  briefing.className = 'briefing';
  appendBriefSection(briefing, 'Background', b.background);
  appendBriefSection(briefing, 'Motivation', b.motivation);
  appendBriefSection(briefing, 'Result', b.result);
  appendBriefSection(briefing, 'Implication', b.implication);
  appendBriefSection(briefing, "Why it's important / Novelty", b.novelty);
  appendBriefSection(briefing, 'Unresolved Questions', b.unresolved);
  appendBriefSection(briefing, 'Expected Future Work', b.future_work);
  if (b.concepts && b.concepts.length) {
    const section = document.createElement('section');
    section.className = 'brief-section wide';
    section.appendChild(textEl('h2', '', 'Concepts / Terms'));
    const concepts = document.createElement('div');
    concepts.className = 'concepts';
    b.concepts.forEach(c => {
      const item = document.createElement('div');
      item.className = 'concept';
      item.appendChild(textEl('h3', '', c.term || 'Concept'));
      [['왜 생겼나: ', c.why_emerged], ['누가 만들었나: ', c.origin], ['연결되는 흐름: ', c.connections]].forEach(([label, text]) => { if (!text) return; const p = document.createElement('p'); const bold = textEl('b', '', label); p.appendChild(bold); p.append(text); item.appendChild(p); });
      concepts.appendChild(item);
    });
    section.appendChild(concepts);
    briefing.appendChild(section);
  }
  if (b.english_summary && b.english_summary.length) { const section = document.createElement('section'); section.className = 'brief-section wide'; section.appendChild(textEl('h2', '', 'English Summary')); const ul = document.createElement('ul'); b.english_summary.slice(0, 5).forEach(line => ul.appendChild(textEl('li', '', line))); section.appendChild(ul); briefing.appendChild(section); }
  slideEl.appendChild(briefing);
  counterEl.textContent = `${index + 1} / ${slides.length}`;
  prevBtn.disabled = index === 0;
  nextBtn.disabled = index === slides.length - 1;
}
prevBtn.addEventListener('click', () => { index = Math.max(0, index - 1); render(); });
nextBtn.addEventListener('click', () => { index = Math.min(slides.length - 1, index + 1); render(); });
document.addEventListener('keydown', event => { if (event.key === 'ArrowLeft') prevBtn.click(); if (event.key === 'ArrowRight') nextBtn.click(); });
render();
</script>
</body>
</html>
