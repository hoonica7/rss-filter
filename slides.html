<!DOCTYPE html>

<meta name='viewport' content='width=device-width, initial-scale=1.0'>
<title>Daily Paper Slideshow</title>
<style>
  :root {
    color-scheme: light;
    --bg: #f6f7f4;
    --paper: #ffffff;
    --ink: #111827;
    --muted: #64748b;
    --line: #d8ddd2;
    --accent: #176b87;
    --accent-2: #9a3412;
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; overflow: auto; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: var(--bg); color: var(--ink); }
  .shell { max-width: 1500px; min-height: 100vh; margin: 0 auto; padding: 14px 18px; display: flex; flex-direction: column; }
  .topbar { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 16px; }
  .top-actions { display: flex; align-items: center; gap: 10px; }
  .topbar a, button { border: 1px solid var(--line); border-radius: 8px; background: var(--paper); color: var(--ink); padding: 10px 14px; font-weight: 700; text-decoration: none; cursor: pointer; }
  button.primary { background: var(--accent); border-color: var(--accent); color: white; }
  button:disabled { opacity: 0.45; cursor: not-allowed; }
  .counter { color: var(--muted); font-weight: 700; }
  .slide { min-height: calc(100vh - 82px); background: var(--paper); border: 1px solid var(--line); border-radius: 10px; padding: 18px; box-shadow: 0 18px 42px rgba(15, 23, 42, 0.10); display: grid; grid-template-columns: minmax(310px, 0.86fr) minmax(0, 1.55fr); gap: 18px; overflow: visible; }
  .paper-head { min-width: 0; min-height: 0; overflow: visible; display: flex; flex-direction: column; gap: 12px; }
  .figure { margin: 0; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: #f8fafc; }
  .figure img { display: block; width: 100%; max-height: 41vh; object-fit: contain; background: white; }
  .figure figcaption { padding: 7px 10px; color: var(--muted); font-size: 12px; line-height: 1.3; }
  .head-text { display: flex; flex-direction: column; gap: 9px; min-width: 0; }
  .badges { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .badge { border-radius: 999px; padding: 5px 9px; background: #eef2ff; color: #3730a3; font-size: 12px; font-weight: 800; }
  .score { background: #fee2e2; color: #991b1b; }
  h1 { margin: 0; font-size: 25px; line-height: 1.15; letter-spacing: 0; overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
  h1 a { color: inherit; text-decoration-color: rgba(23, 107, 135, 0.35); text-decoration-thickness: 2px; text-underline-offset: 4px; }
  h1 a:hover { color: var(--accent); text-decoration-color: var(--accent); }
  .meta, .authors, .why, .abstract { font-size: 13px; line-height: 1.45; }
  .meta, .authors { color: var(--muted); }
  .why strong, .abstract strong, .authors strong { color: var(--ink); }
  .authors { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .why { border-left: 4px solid var(--accent-2); padding-left: 10px; color: #374151; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .abstract { border-top: 1px solid var(--line); padding-top: 14px; color: #374151; }
  .original-abstract { border-top: 1px solid var(--line); padding-top: 10px; color: #374151; font-size: 11.5px; line-height: 1.35; overflow-wrap: anywhere; }
  .original-abstract strong { display: block; margin-bottom: 4px; color: var(--ink); }
  .tags { display: flex; flex-wrap: wrap; gap: 8px; }
  .tag { border-radius: 999px; padding: 4px 8px; background: #f1f5f9; color: #475569; font-size: 12px; font-weight: 700; }
  .head-text > .link { display: none; }
  .briefing { min-width: 0; min-height: 0; overflow: visible; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); grid-auto-rows: minmax(0, auto); align-content: start; gap: 11px 18px; border-top: 0; padding-top: 0; }
  .brief-section { min-width: 0; }
  .brief-section.wide { grid-column: 1 / -1; }
  .brief-section h2 { margin: 0 0 4px; font-size: 14px; line-height: 1.22; color: #0f766e; letter-spacing: 0; }
  .brief-section p, .brief-section li { margin: 0; font-size: 12.5px; line-height: 1.42; color: #1f2937; overflow-wrap: anywhere; }
  .brief-section ul { margin: 0; padding-left: 20px; }
  .concepts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 9px 14px; }
  .concept { border-top: 1px solid var(--line); padding-top: 7px; }
  .concept h3 { margin: 0 0 4px; font-size: 13px; color: #7c2d12; letter-spacing: 0; }
  .concept p { margin: 2px 0 0; font-size: 11.5px; line-height: 1.35; color: #374151; overflow-wrap: anywhere; }
  .concept b { color: #111827; }
  .link { color: var(--accent); font-weight: 800; text-decoration: none; }
  .empty { padding: 48px; background: var(--paper); border: 1px solid var(--line); border-radius: 12px; color: var(--muted); }
  @media (max-width: 860px) {
    .shell { padding: 14px; }
    .topbar, .top-actions { align-items: stretch; flex-direction: column; }
    .slide, .briefing, .concepts { grid-template-columns: 1fr; }
    .slide { min-height: auto; overflow: visible; display: grid; }
    h1 { font-size: 28px; }
  }
</style>

<script>
const slides = [{"title": "Observation of mirror-odd and mirror-even spin texture in ultrathin epitaxially strained RuO 2 films", "journal": "Science_Advances", "source": "author whitelist", "link": "https://doi.org/10.1126/sciadv.aec2917", "authors": "Yichen Zhang, Seung Gyo Jeong, Luca Buiarelli, et al.", "last_authors": "Bharat Jalan, Ming Yi", "summary": "Recently, rutile ruthenium dioxide (RuO 2 ) has attracted renewed interest due to expectations of prominent altermagnetic spin splitting. However, accumulating experimental evidence suggests that, in its bulk and thick-film forms, RuO 2 does not display any form of magnetic ordering. Despite this, the spin structure of RuO 2 remains largely unexplored in the ultrathin limit, where substrate-imposed epitaxial strain can be substantial. Here, we use spin-resolved angle-resolved photoemission spectroscopy, supported by ab initio calculations, to reveal the electronic structure of 2-nanometer-thick epitaxial RuO 2 heterostructures. We observe an unconventional spin texture characterized by the coexistence of mirror-even and mirror-odd momentum-dependent components. A comprehensive symmetry analysis rules out nonmagnetic origins of this spin texture. These findings suggest an emergent nonrelativistic spin structure enabled by epitaxial strain in the ultrathin limit, marking a distinct departure from the behavior of relaxed or bulk RuO 2 . Our work opens previously unexplored perspectives for exploring symmetry-breaking mechanisms and spin textures in oxide heterostructures.", "tier": "A_MUST_READ", "score": "10", "reason": "author whitelist: Sung-Kwan Mo", "tags": ["angle-resolvedphotoemission", "photoemission", "STS", "altermagnet", "heterostructure"], "image": "", "briefing": {"background": "알터마그네틱(Altermagnetic) 시스템은 거시적으로는 알짜 자화가 0이지만, 운동량 공간에서는 강자성체처럼 거대한 스핀 분할이 일어나는 새로운 자성 상태로 주목받고 있습니다. 특히 루틸(rutile) 구조의 RuO2는 이러한 물성을 보여줄 수 있는 대표적인 후보 물질로 꼽혀왔습니다.", "motivation": "최근 여러 연구 결과에 따르면 벌크나 두꺼운 박막 형태의 RuO2는 예상과 달리 자성 정렬을 보이지 않는다는 증거들이 보고되었습니다. 본 연구는 기판에 의한 에피택셜 변형(epitaxial strain)이 극대화되는 초박막(2 nm) 극한에서 RuO2의 스핀 구조가 어떻게 변화하는지 규명하고자 했습니다.", "result": "스핀 분해 광전자 분광법(Spin-ARPES)과 제일원리 계산을 통해, 2nm 두께의 RuO2 박막에서 거울 대칭에 대해 짝수(even) 및 홀수(odd) 특성을 동시에 갖는 비전통적 스핀 텍스처를 관측했습니다. 대칭성 분석 결과, 이는 단순한 스핀-궤도 결합(SOC)이나 비자성적 원인이 아닌 에피택셜 변형에 의해 유도된 창발적 비상대론적 스핀 구조임을 확인했습니다.", "implication": "벌크 상태에서 비자성체로 간주되던 물질이라도 에피택셜 변형과 같은 외부 요인을 통해 알터마그네틱 스핀 분할을 인위적으로 유도하거나 제어할 수 있음을 시사합니다. 이는 산화물 이종구조에서의 스핀트로닉스 응용 가능성을 넓힙니다.", "novelty": "Ming Yi, Sung-Kwan Mo 등 저명한 ARPES 전문가들이 참여하여, 논란이 많았던 RuO2의 자성 및 스핀 구조를 초박막 수준에서 처음으로 정밀 측정했습니다. 특히 스핀 텍스처의 대칭성을 분석하여 알터마그네티즘의 물리적 기원을 추적했다는 점이 독자분의 관심사인 'altermagnetism' 및 'ARPES' 연구와 밀접하게 맞닿아 있습니다.", "unresolved": "관측된 스핀 텍스처가 장범위(long-range) 자성 정렬에 의한 것인지, 혹은 국소적인 대칭성 붕괴에 의한 것인지에 대한 명확한 결정 구조적 분석이 추가로 필요합니다.", "future_work": "변형의 정도를 체계적으로 조절하여 스핀 분할의 크기를 제어하는 연구나, 이러한 스핀 구조가 실제 스핀 수송 특성에 미치는 영향을 직접 측정하는 실험이 이어질 것으로 예상됩니다.", "concepts": [{"term": "Altermagnetism", "why_emerged": "강자성(큰 스핀 분할)과 반강자성(알짜 자화 0)의 장점을 동시에 갖는 물질군을 분류하기 위해 등장했습니다.", "origin": "최근 Libor Šmejkal 등에 의해 이론적으로 정립되었습니다.", "connections": "Ferromagnetism, Antiferromagnetism, Hall effect without net magnetization"}, {"term": "Epitaxial Strain", "why_emerged": "박막 성장 시 기판과의 격자 부정합을 이용해 물질의 물리적 성질을 튜닝하기 위해 사용됩니다.", "origin": "박막 물리 및 재료 공학 연구에서 널리 확립된 개념입니다.", "connections": "Lattice mismatch, Phase transition engineering"}, {"term": "Spin-ARPES", "why_emerged": "전자의 에너지와 운동량뿐만 아니라 스핀 상태까지 직접 관측하기 위해 개발되었습니다.", "origin": "초록 정보만으로는 특정하기 어려움 (1980년대 이후 발전)", "connections": "Photoemission spectroscopy, Spin texture, Rashba effect"}, {"term": "Mirror-odd/even spin texture", "why_emerged": "특정 결정 대칭성 하에서 스핀의 방향성이 운동량 공간에서 어떻게 반전되거나 유지되는지 설명하기 위해 필요합니다.", "origin": "결정학적 대칭성 분석 및 스핀 궤도 결합 이론에서 기원합니다.", "connections": "Symmetry-protected states, Spin-orbit torque"}], "english_summary": ["Observed emergent spin textures in 2-nm-thick epitaxial RuO2 films using spin-resolved ARPES.", "Revealed coexistence of mirror-even and mirror-odd spin components in momentum space.", "Demonstrated that epitaxial strain induces a nonrelativistic spin structure absent in bulk RuO2.", "Ruled out nonmagnetic origins through comprehensive symmetry analysis and ab initio calculations."]}}, {"title": "Magnetically tunable symmetry-enforced nodal lines producing huge anomalous Hall conductivity in altermagnetic -MnTe", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2608.02416", "authors": "Mathews Benny, Xujia Gong, Amar Fakhredine, et al.", "last_authors": "Jakub Schusser, Carmine Autieri", "summary": "Altermagnetic $\\alpha$-MnTe exhibits huge anomalous Hall conductivity (AHC) up to room-temperature together with weak ferromagnetism arising from spin and orbital polarizations. We clarify the origin of the large value of the AHC by identifying two sets of distinct symmetry-enforced nodal lines in the valence bands with Mn character, located at $k_z=0$ and $k_z=\\frac{\\pi}{c}$, protected by mirror symmetry $M_z$ and glide symmetry $G_z = \\{M_z\\,|\\,0,0,\\tfrac{c}{2}\\}$, respectively. Both nodal lines are energy-dependent with an approximate C$_6$ symmetry, which is reduced to an exact C$_2$ symmetry due to the presence of the N\\'eel vector. The highest valence band exhibits a Mexican-hat dispersion, whereas the second-highest valence band exhibits an inverted Mexican-hat dispersion, with nodal lines at the crossing between the two bands. Within first-principles accuracy, we demonstrate that these nodal lines give rise to the large AHC observed experimentally and exhibit a strong interplay with the weak ferromagnetism. We further show that even a small spin canting strongly modifies the nodal lines and the AHC, making them both magnetically tunable. By disentangling the altermagnetic and ferromagnetic contributions to the AHC, the altermagnetic contribution dominates at small canting angles, while the ferromagnetic contribution becomes sizeable for larger values. Using linear dichroism in angle-resolved photoemission spectroscopy, we show a signature of the nodal line at the border of the Brillouin zone.", "tier": "A_MUST_READ", "score": "10", "reason": "Direct ARPES and anomalous Hall study of altermagnetic nodal lines in alpha-MnTe.", "tags": ["ARPES", "altermagnetism", "anomalousHall"], "image": "https://arxiv.org/html/2608.02416v1/x1.png", "briefing": {"background": "알터마그넷 후보 물질인 alpha-MnTe는 순수 자화가 거의 없음에도 불구하고 상온에서 거대한 이상 홀 효과(Anomalous Hall Effect, AHE)를 보이는 독특한 특성을 가집니다.", "motivation": "이 거대한 AHE가 발생하는 미시적인 전자 구조적 기원을 규명하고, 특히 대칭성에 의해 보호되는 노달 라인(nodal lines)이 어떤 역할을 하는지 밝히고자 했습니다.", "result": "Mn의 d-오비탈 성격이 강한 가전자대에서 kz=0 및 kz=pi/c 위치에 존재하는 두 종류의 대칭성 보호 노달 라인을 확인했습니다. 이 노달 라인들이 거대한 AHE를 생성하는 주된 베리 곡률(Berry curvature)의 원천임을 증명했으며, 특히 네엘 벡터(Neel vector)의 방향이나 미세한 스핀 캔팅(spin canting)에 의해 이 노달 라인과 AHE가 민감하게 조절됨을 보였습니다.", "implication": "알터마그넷의 수송 특성이 단순히 고정된 것이 아니라, 외부 자기장 등을 통한 스핀 방향 제어로 '튜닝' 가능하다는 것을 보여줍니다.", "novelty": "ARPES(선편광 이색성 이용)와 제일원리 계산을 결합하여 알터마그네틱 노달 라인을 실험적으로 확인하고, 이를 거시적 물성인 AHE와 직접 연결시켰습니다. 독자분의 관심사인 'altermagnetism', 'Anomalous Hall', 'nodal line'이 모두 포함된 핵심 논문입니다.", "unresolved": "실험적으로 관측된 AHE에서 알터마그네틱 기여분과 강자성적(캔팅에 의한) 기여분을 완벽하게 분리해내는 정량적 분석이 여전히 도전적인 과제로 남아 있습니다.", "future_work": "스핀-ARPES를 이용해 노달 라인에서의 직접적인 스핀 분할 크기를 측정하거나, 온도 변화에 따른 노달 라인의 진화 과정을 추적하는 연구가 필요합니다.", "concepts": [{"term": "Symmetry-enforced nodal line", "why_emerged": "특정 대칭성이 존재할 때 두 밴드가 선형으로 교차하며 선 형태의 축퇴를 형성하는 상태를 설명하기 위함입니다.", "origin": "위상 절연체 및 위상 반금속 연구 과정에서 확립되었습니다.", "connections": "Berry curvature, Topological semimetals, Mirror symmetry"}, {"term": "Spin canting", "why_emerged": "반강자성체에서 스핀들이 완전히 반평행하지 않고 미세하게 기울어져 순자화가 발생하는 현상을 설명합니다.", "origin": "Dzyaloshinskii-Moriya interaction 연구 등에서 기원합니다.", "connections": "Weak ferromagnetism, Dzyaloshinskii-Moriya interaction"}, {"term": "Anomalous Hall Conductivity (AHC)", "why_emerged": "외부 자기장이 아닌 물질 내부의 자성이나 베리 곡률에 의해 발생하는 홀 효과의 세기를 정량화하기 위해 사용됩니다.", "origin": "Edwin Hall iefing": {"background": "Bi(110) 표면은 강한 스핀-궤도 결합과 표면 대칭성 깨짐으로 인해 복잡한 스핀 텍스처를 가지며, 이는 위상학적 특성과 강하게 연결되어 있습니다.", "motivation": "Bi(110)의 알려지지 않았던 세밀한 스핀 텍스처를 고해상도 스핀 분해 광전자 분광법(SARPES)으로 규명하고자 했습니다.", "result": "이전 계산과 일치하는 복잡한 평면 내 스핀 텍스처를 관측했으며, 기존에 관찰되지 않았던 숨겨진 표면 상태를 실험적으로 확인했습니다.", "implication": "비자성 물질에서의 스핀 의존적 표면 상태 분석이 위상학적 보호를 받는 전자 상태를 어떻게 식별할 수 있는지 보여줍니다.", "novelty": "SARPES를 활용해 3차원 스핀 텍스처를 정밀하게 재구성하여 표면 상태의 본질을 명확히 함.", "unresolved": "관측된 특정 상태가 위상학적으로 자명한지(trivial) 아니면 비자명한지에 대한 완전한 위상 불변량 확인은 추가 논의가 필요할 수 있음.", "future_work": "해당 표면 상태의 스핀 의존적 운송 현상 측정 또는 초전도 근접 효과 실험.", "concepts": [{"term": "SARPES", "why_emerged": "ARPES로 밴드 구조는 보이지만 스핀 자유도를 직접적으로 측정하기 위해.", "origin": "표면 물리 분야의 발전에 따라 점진적 정립.", "connections": "위상 절연체, 스핀-궤도 결합, 스핀 텍스처."}, {"term": "스핀 텍스처", "why_emerged": "운동량 공간에서의 스핀 정렬 양상을 정량화하기 위해.", "origin": "Rashba 효과 연구와 함께 발전.", "connections": "위상 표면 상태, 스핀-궤도 결합."}], "english_summary": ["Investigates the 3D spin texture of Bi(110) using spin-resolved ARPES.", "Confirms complex in-plane spin structures predicted by first-principles calculations.", "Successfully unveils previously hidden surface states.", "Provides a detailed experimental mapping of spin-polarized states in a spin-orbit coupled system."]}}, {"title": "Emergent modular Luttinger liquid from spin-partitioned entanglement in the one-dimensional Hubbard model", "journal": "arXiv_CondMat", "source": "keyword", "link": "https://arxiv.org/abs/2608.01817", "authors": "\\'Ad\\'am B\\'acsi, Catalin Pascu Moca, Bal\\'azs D\\'ora", "last_authors": "Catalin Pascu Moca, Bal\\'azs D\\'ora", "summary": "We study the spin-partitioned entanglement Hamiltonian of the one-dimensional repulsive Hubbard model. By combining bosonization with exact diagonalization, we show that tracing out one spin species produces a modular Luttinger liquid, whose properties fundamentally differ from those of the physical system. While the modular spectrum is fully dispersionless and possesses a momentum-independent entanglement gap, its eigenstates exhibit algebraic correlations governed by a single effective Luttinger parameter equal to the geometric mean of the charge and spin Luttinger parameters. The resulting entanglement spectrum displays a universal branching hierarchy in excellent agreement with exact diagonalization. We further demonstrate that the modular ground state is nearly identical to that of the spinless Luttinger liquid. These results uncover a universal modular structure in interacting one-dimensional fermionic systems.", "tier": "A_MUST_READ", "score": "9", "reason": "title strong match: Luttinger liquid", "tags": ["Luttinger", "Hubbard"], "image": "https://arxiv.org/html/2608.01817v1/x1.png", "briefing": {"background": "1차원 강상관 전자계는 전하와 스핀 자유도가 분리되는 '스핀-전하 분리' 현상을 보이며, 이를 기술하는 기본 이론으로 Luttinger 액체 이론이 사용됩니다.", "motivation": "일반적인 물리적 시스템이 아닌, 특정 스핀 성분을 추적(tracing out)했을 때 나타나는 '모듈러(modular) 시스템'의 얽힘 해밀토니안 구조가 실제 물리 시스템과 어떻게 다른지 규명하고자 함.", "result": "스핀을 분리한 후의 모듈러 해밀토니안이 분산이 없는(dispersionless) 스펙트럼을 가지면서도, 전하와 스핀 Luttinger 파라미터의 기하 평균을 유효 파라미터로 갖는 독특한 모듈러 Luttinger 액체로 거동함을 보임.", "implication": "상호작용하는 1차원 페르미온 시스템에서 얽힘 Hamiltonian이 물리적 시스템과는 다른 보편적인 모듈러 구조를 가짐을 시사하며, 이는 양자 정보 이론과 응집물질물리학의 연결고리를 강화함.", "novelty": "기존 Luttinger 액체 연구에서 다루지 않던 '모듈러(얽힘) 스펙트럼'의 보편적 위계 구조를 도출하여, 1차원 시스템의 새로운 분류 가능성을 제시함.", "unresolved": "이러한 모듈러 구조가 실제 실험적인 양자 시뮬레이션(예: 초냉각 원자)에서 어떻게 관측 가능한 신호로 변환될지는 명확하지 않음.", "future_work": "보다 복잡한 사다리(ladder) 모델이나 2차원 시스템으로의 확장 및 모듈러 스펙트럼의 위상적 성질 연구.", "concepts": [{"term": "Luttinger 액체", "why_emerged": "1차원 시스템에서는 란다우 페르미 액체 이론이 파괴되어 개별 준입자 대신 집단적 들뜸이 중요해지기 때문.", "origin": "Tomonaga(1950)와 Luttinger(1963)에 의해 제안됨.", "connections": "스핀-전하 분리, 홀로그래피, 보존화(bosonization) 기법."}, {"term": "모듈러 해밀토니안", "why_emerged": "밀도 행렬 ρ를 ρ = exp(-H_mod)로 정의할 때, 특정 부분 시스템의 정보를 보존하는 효과적인 해밀토니안을 찾기 위해 필요.", "origin": "Bisognano와 Wichmann(1975)이 리들러-운루 효과 맥락에서 도입.", "connections": "얽힘 엔트로피, 양자 정보 이론, 홀로그래픽 원리."}], "english_summary": ["Investigates the spin-partitioned entanglement Hamiltonian of the 1D Hubbard model.", "Identifies a 'modular Luttinger liquid' with distinct properties from the physical system.", "Shows modular eigenstates follow a branching hierarchy governed by the geometric mean of charge/spin Luttinger parameters.", "Reveals that the modular ground state mimics a spinless Luttinger liquid."]}}, {"title": "Long and short time linear response of metals: a geometric approach", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2608.02298", "authors": "Nishchhal Verma, Raquel Queiroz", "last_authors": "Nishchhal Verma, Raquel Queiroz", "summary": "The time-dependent quantum geometric tensor, which captures dipole fluctuations of bound electrons, is essential for understanding the electronic properties of insulators, superconductors, and flat bands. It is often considered subleading for low-energy descriptions of metals that are dominated by intra-band processes. Here, we revisit this perspective and highlight scenarios where the quantum geometry of the wavefunctions close to the Fermi surface plays a significant role. We compute the time-dependent quantum geometric tensor for metals, explain its divergence, and contrast it against singular geometric tensors of Dirac and Weyl semi-metals. We identify the ratio of Drude to total spectral weight, $D/\\mathcal{S}_1$, as a lattice-scale probe of bound versus itinerant charge, and quantify it in the kagome metal, where the two van Hove fillings respond differently despite identical Fermi surfaces.", "tier": "A_MUST_READ", "score": "9", "reason": "Connects quantum geometry to specific van Hove fillings in kagome metals.", "tags": ["theory", "kagome", "quantum-geometry"], "image": "https://arxiv.org/html/2608.02298v1/x1.png", "briefing": {"background": "금속 내 전자의 동역학은 주로 낮은 에너지의 페르미 면 근처 준입자 산란으로 설명되지만, 특정 조건에서는 파동함수의 기하학적 성질이 거시적 응답에 중요한 기여를 함.", "motivation": "금속에서 양자 기하학적 텐서(quantum geometric tensor)의 역할을 재평가하고, 특히 카고메 금속의 밴드 구조(van Hove fillings)에 따른 차이를 분석하고자 함.", "result": "시간 의존적 양자 기하학적 텐서가 카고메 금속의 서로 다른 van Hove 충전 상태에서 어떻게 다르게 작용하는지 정량화함. 특히 Drude 가중치 대비 총 스펙트럼 가중치 비(D/S1)를 통해 속박 전하와 유동 전하를 구분하는 지표를 제시함.", "implication": "단순한 페르미 면의 기하학적 모양뿐만 아니라, 파동함수의 기하학적 구조가 카고메 금속의 비정상적인 전자기적 응답을 결정하는 핵심 요소임을 입증.", "novelty": "동일한 페르미 면을 가짐에도 밴드 토폴로지 차이로 인해 발생하는 카고메 금속의 물리적 응답 차이를 '양자 기하학'이라는 프레임워크로 명확히 설명함.", "unresolved": "실제 실험적 측정 데이터(광학 전도도 등)와 이론적 텐서의 정밀한 매칭 연구가 추가로 필요.", "future_work": "실제 kagome 금속(AV3Sb5 등)의 ARPES/광학 데이터와 결합하여 이론 모델 검증.", "concepts": [{"term": "양자 기하학적 텐서", "why_emerged": "양자 상태 공간 내의 거리와 곡률(Berry 곡률 포함)을 기술하여 수송 현상을 일반화하기 위해 필요.", "origin": "Provost와 Vallee(1980)가 제안.", "connections": "베리 곡률, 양자 전도도, 플랫 밴드 물리."}, {"term": "Van Hove 특이점", "why_emerged": "상태 밀도(DOS)가 발산하는 지점으로, 상전이나 물성 변화의 핵심 원인이 됨.", "origin": "Léon Van Hove(1953)가 결정 격자 진동 연구 중 제안.", "connections": "Kagome 금속, 초전도성, CDW 질서."}], "english_summary": ["Re-examines the role of the quantum geometric tensor in metallic systems.", "Identifies geometric contributions to transport that are often overlooked in standard metal theories.", "Introduces the Drude-to-total spectral weight ratio (D/S1) as a probe for bound vs itinerant charge.", "Demonstrates that different van Hove fillings in kagome metals yield distinct responses despite identical Fermi surfaces."]}}, {"title": "Robust field-free superconducting diode effect in FeTe0.55Se0.45", "journal": "npj_QuantumMaterials", "source": "author whitelist", "link": "https://www.nature.com/articles/s41535-026-00930-3", "authors": "Peng Dong, Jinghui Wang, Yanjiang Wang, et al.", "last_authors": "Jinsheng Wen, Jun Li", "summary": "Robust field-free superconducting diode effect in FeTe 0.55 Se 0.45", "tier": "A_MUST_READ", "score": "9", "reason": "author whitelist: Yulin Chen", "tags": ["superconduct"], "image": "https://pubads.g.doubleclick.net/gampad/ad?iu=/285/npjquantmats.nature.com/article&sz=728x90&c=-1200974475&t=pos%3Dtop%26type%3Darticle%26artid%3Ds41535-026-009 a way for scalable, high-temperature topological electronics."]}}, {"title": "Electron-like high-temperature superconductivity induced by compressive strain in La2PrNi2O7 thin films", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2608.01295", "authors": "Zhiwei Wang, Zhengjie Wang, Huiyu Wang, et al.", "last_authors": "Tao Wu, Xianhui Chen", "summary": "The realization of high-temperature superconductivity in bilayer nickelates under epitaxial compressive strain is widely interpreted as mimicking the effects of high hydrostatic pressure. To test the equivalence of these mechanisms, we investigated a comprehensive strain continuum ranging from compressive (-2.14%) to tensile (+0.91%). Crucially, via ozone-assisted atomic-layer epitaxy, we realized high-temperature superconductivity in as-grown La2PrNi2O7 films on NdAlO3 substrates, which induce the most extreme compressive strain in this material system. Under extreme compression (-2.14%), these films exhibit a Tc_onset of 60 K, zero resistance at 33 K, and a diamagnetic response at 20 K, with magnetotransport measurements confirming a quasi-two-dimensional superconducting nature. Comparing our phase diagram with reported data reveals distinct lattice responses: unlike in pressurized crystals, the superconducting window in epitaxial films diverges significantly in the out-of-plane parameter c (or c/ap ratio) but remains consistent with the bulk regarding the in-plane parameter ap. Crucially, while superconductivity in both systems emerges from the suppression of spin-density waves (SDW), Hall measurements reveal a fundamental electronic dichotomy: optimal superconducting films are intrinsically electron-like (exhibiting a negative Hall coefficient), in stark contrast to the hole-like nature (positive Hall coefficient) of high-pressure bulk crystals and non-superconducting tensile films. Ultimately, both tuning strategies effectively modulate the underlying correlation landscape - the  "why_emerged": "위상 수학적 비자명성과 자성을 동시에 가진 물질에서 나타나는 비전통적 물성 규명을 위해 필요.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "Weyl 반금속, Anomalous Hall effect"}, {"term": "Topological Hall effect", "why_emerged": "비자성 물질과 구별되는, 위상학적으로 꼬인 스핀 구조에 의해 발생하는 홀 효과를 이해하기 위해.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "Berry phase, Skyrmion"}], "english_summary": ["Pb-flux synthesis method successfully eliminates Au2Bi impurities in EuAuBi crystals.", "High-quality single crystals reveal intrinsic magnetotransport properties.", "Orientation-dependent topological Hall effect is observed for the first time in this compound.", "Provides a clean platform for studying magnetic topological phases."]}}, {"title": "Lifshitz transitions and isospin polarization in twist-decoupled monolayer-bilayer graphene", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/7d2j-4p3c", "authors": "Alex Boschi, Leonardo Sabattini, Sergey Slizovskiy, et al.", "last_authors": "Camilla Coletti, Sergio Pezzini", "summary": "Flat band dispersion in two-dimensional materials is often associated with correlated electronic phases. Here, the authors show that a flat region in the valence band of bilayer graphene can be accessed by gapping it via proximity to a twisted monolayer graphene. Their experiments reveal a series of transitions driven by doping, electric and magnetic field (consistent with a single-particle description), as well as partially isospin‑polarized phases promoted by electronic correlations and preserved in presence of the twisted monolayer.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "High-interest work on correlated phases and band topology in moiré systems.", "tags": ["graphene", "correlated", "moiré"], "image": "", "briefing": {"background": "모아레(moiré) 격자 시스템은 층간 비틀림을 통해 전자 구조를 제어하고 평탄한 밴드를 생성하여 강상관 현상을 유도하는 현대 응집물질물리학의 주요 연구 분야입니다.", "motivation": "이중층 그래핀을 단일층 그래핀과 비틀림 결합(twist-decoupled)시켰을 때, 특정 평탄 밴드에서 발생하는 상관관계 기반의 물리적 상태와 등스핀(isospin) 편극 현상을 탐구하고자 했습니다.", "result": "전기장과 자기장을 통해 밴드 구조를 제어하여 평탄 밴드 영역을 성공적으로 접근했습니다. 도핑과 외장에 따라 이등스핀 편극된 상태가 전자 상관관계에 의해 안정화됨을 확인했습니다.", "implication": "비틀림 결합된 이중층 구조가 강상관 물리 현상을 연구하는 새로운 도구임을 입증하며, 밴드 엔지니어링을 통한 양자 상태 제어 가능성을 제시합니다.", "novelty": "단순한 이중층이나 비틀린 이중층 그래핀을 넘어, 단일층과 결합된 비틀림 구조에서 평탄 밴드 및 상관관계 물성을 체계적으로 분리하여 관측했다는 점이 독창적입니다.", "unresolved": "다양한 외부 파라미터(전기/자기장) 하에서 발생하는 위상 변화의 미시적 원인이 순수한 단일 입자 효과인지, 다체 효과에 의한 것인지에 대한 정량적 구분이 완전히 해결되지 않았습니다.", "future_work": "관측된 편극 상의 위상적 성질을 규명하기 위한 로컬 프로브 측정(STM 등) 및 이론적 해석.", "concepts": [{"term": "Lifshitz transition", "why_emerged": "페르미 표면의 위상적 변화가 물성 변화와 어떻게 연결되는지 설명하기 위해.", "origin": "I. M. Lifshitz, 1960년", "connections": "밴드 구조 엔지니어링, 전자 상관관계"}, {"term": "Isospin polarization", "why_emerged": "그래핀의 자유도(스핀, 밸리)가 상관관계에 의해 특정 상태로 정렬되는 현상을 기술하기 위해.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "Moiré systems, Correlated electron states"}], "english_summary": ["Accesses flat valence bands in bilayer graphene via twisted monolayer proximity.", "Observes doping- and field-driven transitions in the flat band region.", "Identifies isospin-polarized states promoted by electronic correlations.", "Demonstrates effective control of correlated phases in twist-decoupled systems."]}}, {"title": "Modification of charge and spin textures by light chemical substitution in Eu(Al1−xGax)4 (x=0.1)", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/6kwv-fh15", "authors": "Zétény Bacsó, Fellipe Carneiro, Kevin Allen, et al.", "last_authors": "Alessandro Bombardi, Roger D. Johnson", "summary": "We present the results of a resonant x-ray-diffraction experiment, resolving both charge and spin textures in the intermetallic topological magnet Eu ( Al 1 − x Ga x ) 4 ( x = 0.1). Below ≈ 75 K the system develops a charge-density wave (CDW) with propagation vector k CDW ≈ ( 0 , 0 , 0.18 ) . The CDW order parameter grows monotonically on cooling until ≈ 15 K, when a sudden decrease in the CDW amplitude occurs. Pairs of magnetic satellites of the (0, 0, 8) Bragg reflection corresponding to two distinct domains, k 1 = ( ± δ m , 0, 0), k 2 = (0, ± δ m , 0), δ m = 0.2002 ( 4 ) were studied at the Eu L 3 edge, appearing below T N = 14.8 K. Our measurement of T N is exactly coincident with the sudden drop in the CDW amplitude, which suggests strong coupling between the charge and spin orders, as observed in other compounds of the Eu ( Al 1 − x Ga x ) 4 series. Azimuthal measurements were consistent with a single helical spin arrangement having an elliptical envelope of μ Y / μ Z = 1.19(6) for the k 2 domain, and a tilted helical (helicoidal) spin arrangement for the k 1 domain, with μ Y / μ Z = 1.14(4) and μ X / μ Z = 0.20(2) that may be hidden for the k 2 domain due to multiple subdomains. Temperature evolution of the magnetic satellite intensities in linear and circularly polarized light found the respective ratio to be invariant with temperature, suggesting a single helicoidal magnetic phase throughout the measured temperature range. This behavior is unlike the x = 0 material, in which a spin-density wave forms first, transitioning to a helical ground state on cooling through intermediate phases. Future theoretical work on the Eu electronic ground state, supported by related experiments, will help understand the effects of Ga substitution on the evolution of the magnetic structure.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Resonant X-ray study of charge and spin textures in a topological magnet with CDW order.", "tags": ["experiment", "CDW", "topological"], "image": "", "briefing": {"background": "Eu(Al,Ga)4 화합물은 전하 밀도 파(CDW)와 자기적 질서가 공존하는 시스템으로, 이 둘 사이의 상호작용은 위상적 성질과 결합하여 복잡한 물리적 상태를 생성합니다.", "motivation": "Ga 치환을 통해 시스템 내 전하와 스핀 구조가 어떻게 변하는지, 특히 CDW와 자성 간의 결합 메커니즘을 규명하고자 했습니다.", "result": "Ga 10% 치환 시 CDW가 형성되나 T_N에서 급격히 진폭이 줄어들며, 이는 전하 및 스핀 질서가 강하게 결합되어 있음을 보여줍니다. 자기 구조는 헬리코이달(helicoidal) 상태로 규명되었습니다.", "implication": "이 물질군에서 화학적 치환이 전하와 스핀 질서 간의 경쟁과  fields."]}}, {"title": "Scaling analysis of intrinsic anomalous Hall effect in the intercalated transition metal dichalcogenide Cr0.27NbS2", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/1ttr-3kkf", "authors": "Huan Wang, Kun Han, Ying-Hua Zhang, et al.", "last_authors": "Yi-Ting Wang, Tian-Long Xia", "summary": "While the anomalous Hall effect (AHE) has been extensively studied in the past, analyzing its mechanism continues to be a critical topic in condensed matter physics, especially in unconventional magnetic materials with noncollinear or noncoplanar magnetic structures. Here, we explore the AHE in the …", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Experimental investigation of intrinsic anomalous Hall effect in an intercalated TMD system.", "tags": ["experiment", "anomalousHall", "TMD"], "image": "", "briefing": {"background": "이상 홀 효과(AHE)는 자성 물질에서 자화나 스핀 구조에 의해 발생하는 전압 신호로, 그 메커니즘을 규명하는 것은 위상 물질 및 자성 물질 연구의 핵심입니다.", "motivation": "인터칼레이션된 전이금속 디칼코게나이드(TMD)인 Cr0.27NbS2에서의 AHE 메커니즘을 밝혀, 비공선형 자기 구조와 관련하여 내재적 기여도를 분석하고자 합니다.", "result": "Scaling analysis를 통해 해당 물질에서 AHE의 발생 기전이 내재적 메커니즘에 기반하고 있음을 확인했습니다.", "implication": "TMD 기반 인터칼레이션 물질들이 복잡한 자기 구조를 구현하는 플랫폼으로서 위상 전자 구조 연구에 유용함을 시사합니다.", "novelty": "특정 인터칼레이션 TMD 시스템에서 내재적 AHE를 정량적으로 분리하여 분석했다는 점이 중요하며, 자성 TMD 연구 분야에 기여합니다.", "unresolved": "자기 구조의 복잡성에 따른 외재적 기여도와의 미세한 경쟁 관계가 완전히 해소되지 않았습니다.", "future_work": "중성자 산란을 통한 정확한 자기 구조 확인 및 ARPES를 통한 베리 곡률 계산 연구가 필요합니다.", "concepts": [{"term": "이상 홀 효과 (AHE)", "why_emerged": "비자성 물질의 홀 효과와 달리 자성체의 자기 모멘트가 전하 수송에 미치는 영향을 설명하기 위해 필요했습니다.", "origin": "Edwin Hall (1881).", "connections": "스핀-궤도 결합(SOC), 베리 곡률, 비공선형 자성."}, {"term": "인터칼레이션 (Intercalation)", "why_emerged": "층상 물질 사이에 이온이나 원자를 삽입하여 물리적 성질을 변조하기 위해 사용됩니다.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "TMD 화합물, 이온 배터리, 층상 구조 변조."}], "english_summary": ["Investigated the anomalous Hall effect (AHE) in Cr0.27NbS2.", "Performed scaling analysis to differ summary": "The Kondo effect is a prototypical quantum phenomenon arising from the interaction between localized electrons in a magnetic impurity and itinerant electrons in a metallic host. Although this phenomenon has served as the testing ground for quantum many-body methods for decades, the precise description of Kondo physics with material specificity remains challenging. Here, we present a systematic ab initio approach to converge toward an exact zero-temperature electronic treatment of Kondo correlations. Across a series of 3d transition metals, we extracted Kondo temperatures matching subtle experimental trends, with accuracy exceeding that of standard models. We further obtained microscopic insight into the origin of these trends. More broadly, we demonstrate the possibility to start from fully ab initio many-body simulations and push toward the realm of converged predictions.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Ab initio quantum many-body treatment of Kondo effect in real magnetic impurities.", "tags": ["theory", "stronglycorrelatedelectrons", "electronicstructure", "materials"], "image": "", "briefing": {"background": "Kondo 효과는 자성 불순물과 금속 호스트 간의 다체 상호작용으로 인해 발생하며, 물질 고유의 특성을 반영한 정확한 계산이 이론 물리와 재료 과학의 오랜 과제였습니다.", "motivation": "기존 모델 기반 접근을 넘어, ab initio(제1원리) 계산을 통해 재료 특이적인 Kondo 온도를 정확히 예측하고자 했습니다.", "result": "3d 전이 금속 불순물 시스템에 대해 실험값과 일치하는 Kondo 온도를 ab initio 다체 계산으로 도출하였습니다.", "implication": "복잡한 강상관 시스템에서도 제1원리 계산을 통해 다체 물성을 정확히 예측할 수 있는 새로운 경로를 열었습니다.", "novelty": "모델 파라미터에 의존하지 않고 fully ab initio 접근을 통해 Kondo physics를 converged된 수준으로 시뮬레이션했다는 점이 중요합니다.", "unresolved": "3d 금속을 넘어 4f/5f 등 더 복잡한 f-전자 계열로의 확장성과 계산 효율성 문제.", "future_work": "희토류 기반 중페르미온 화합물 등 강상관 시스템의 자성 불순물 문제에 대한 직접 적용.", "concepts": [{"term": "Kondo effect", "why_emerged": "금속 내 자성 불순물이 저온에서 전도 전자와 결합하여 전기 저항이 상승하는 현상을 설명하기 위해 도입.", "origin": "Jun Kondo (1964).", "connections": "Anderson impurity model, 중페르미온(Heavy Fermion) 물리."}, {"term": "Ab initio many-body treatment", "why_emerged": "경험적 파라미터 없이 물질의 순수한 원자 구성 정보만으로 양자 다체계의 복잡한 물리 현상을 계산하기 위해 필요함.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "DFT+DMFT, QMC(Quantum Monte Carlo)."}], "english_summary": ["Presents a systematic ab initio approach for exact zero-temperature treatment of Kondo correlations.", "Matches Kondo temperatures of 3d transition metal impurities with experimental trends.", "Demonstrates progress toward fully ab initio many-body simulations in strongly correlated systems."]}}, {"title": "Ab initio prediction of dx2-y2-wave superconductivity in infinite-layer nickelates", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2608.00512", "authors": "Guang-Yu Guo, Ren-Guo Guo, Yun-Chen Liao, Yang-hao Chan", "last_authors": "Yun-Chen Liao, Yang-hao Chan", "summary": "Infinite-layer nickelates have recently emerged as a new family of potential unconventional high critical temperature ($T_c$) superconductors. However, fundamental questions such as their superconducting (SC) pairing mechanism and gap symmetry remain under intense debate. Here we present a fully {\\it ab initio} theoretical study on the SC properties of optimally doped nickelates $Re$$_{0.8}$Sr$_{0.2}$NiO$_2$ ($Re=$ La, Pr, Nd), based on the density functional theory for superconductors calculations with electron-phonon coupling (EPC), screened Coulomb repulsion and spin fluctuation (SF) interaction treated on an equal footing. We find that $Re_{0.8}$Sr$_{0.2}$NiO$_2$ are two-band superconductors with sign reversal $d_{x^2-y^2}(\\pm)$-wave gap functions on the different Fermi surface (FS) pockets. Interestingly, when the SF interaction is turned off, $T_c$ becomes negligibly small ($\\sim$0.01 K), thus demonstrating that the superconductivity in $Re_{0.8}$Sr$_{0.2}$NiO$_2$ is driven by SF interaction. Moreover, our {\\it ab initio} calculations reveal that the SF interaction is an order of magnitude stronger than both EPC and Coulomb repulsion on the large quasi-two-dimensional FS pocket around the Brillouin zone (BZ) center, thus leading to the SF-mediated pairing mechanism, although the EPC dominates on the small three-dimensional electron FS pockets at the BZ corners. The emergence of nodal $d_{x^2-y^2}(\\pm)$-wave gap structure is traced to the pronounced peaks in the Lindhard response function at the BZ corners. Our calculated FS, SC critical temperature, nodal gap structure and SC quasiparticle density of states are consistent with most available experiments. Furthermore, predicted unconventional SC properties such as scanning tunneling spectra of La$_{0.8}$Sr$_{0.2}$NiO$_2$ and Pr$_{0.8}$Sr$_{0.2}$NiO$_2$ are ready for immediate experimental verifications.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Electronic structure and pairing mechanism study in high-Tc nickelates.", "tags": ["nickelate", "superconduct", "Fermisurface", "theory"], "image": "https://arxiv.org/html/2608.00512v1/x1.png", "briefing": {"background": "무한층 니켈산염은 고온 초전도체 후보군으로 주목받고 있으며, 구리 산화물(cuprates)과의 유사성으로 인해 전자 구조와 초전도 메커니즘 연구가 활발합니다.", "motivation": "이 물질들의 초전도 대칭성과 전자-포논 결합(EPC) 대 스핀 요동(SF)의 기여도에 대한 학계의 논쟁을 해결하고자 합니다.", "result": "제일원리 계산을 통해 이 물질들이 d_x^2-y^2 파동 대칭성을 가지며, 초전도가 스핀 요동에 의해 주도됨을 밝혔습니다.", "implication": "스핀 요동이 초전도의 핵심 동력임이 증명된다면, 니켈산염 초전도의 이해가 구리 산화물의 사례와 정렬되며 체계적인 모델링이 가능해집니다.", "novelty": "전자-포논 결합과 스핀 요동을 동등한 수준에서 다룬 '제일원리 초전도체 이론'을 적용하여 실험 데이터와의 정합성을 확보했습니다.", "unresolved": "계산 모델이 실제 도핑된 샘플의 무질서(disorder) 효과를 완벽하게 반영하지 못할 수 있습니다.", "future_work": "제시된 STM 스펙트럼 예측값이 향후 실제 초고진공 STM 실험을 통해 검증되어야 합니다.", "concepts": [{"term": "d_x^2-y^2-wave pairing", "why_emerged": "구리 산화물 초전도체의 비전통적 초전도성을 설명하기 위해 제안됨.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "Cuprate 초전도체, 고온 초전도 메커니즘."}, {"term": "Spin Fluctuation (SF)", "why_emerged": "강상관 전자계에서 전자-포논 결합만으로 높은 Tc를 설명하기 부족하여 도입됨.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "Hubbard 모델, 초전도 유도 상호작용."}, {"term": "Lindhard response function", "why_emerged": "Fermi 표면의 중첩과 전자 간 상호작용에 의한 응답 특성을 계산하기 위해 필요함.", "origin": "Jens Lindhard (1954).", "connections": "Peierls 불안정성, CDW 현상."}], "english_summary": ["Theoretical study of superconductivity in infinite-layer nickelates using DFT+SF.", "Identifies SF as the dominant driver of d-wave pairing over EPC.", "Calculated gap structure and Tc match current experimental consensus.", "Predicts specific STS features for La and Pr-based compounds to guide experimentalists."]}}, {"title": "Anomalous Localization in Magnetically Doped Two-Dimensional Topological Insulators", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2607.24373", "authors": "Felippe Amorim, Washington F. dos Santos, Mauro S. Ferreira, Alexandre Reily Rocha, Caio Lewenkopf", "last_authors": "Alexandre Reily Rocha, Caio Lewenkopf", "summary": "Two-dimensional topological insulators (2DTIs) harbor spin-polarized edge states that are topologically protected by time-reversal symmetry against non-magnetic structural disorder. However, coupling to magnetic impurities breaks this symmetry, inducing backscattering and destroying perfect quantization. While the impact of isolated dilute magnetic impurities is well understood, the transport properties in the presence of dense, disordered ensembles of magnetic moments remain poorly understood. In this work, we develop an analytical framework, supported by extensive numerical simulations, that captures the behavior of edge transport in two-dimensional topological insulators (2DTIs) with a finite concentration of magnetic impurities. We predict the onset of Anderson localization and uncover an anomalous localization regime characterized by a sub-exponential decay of the conductance, scaling as $\\ln {\\cal G} \\propto -\\sqrt{L}$, where $L$ is the system length. Furthermore, we demonstrate that the transport exhibits a universal scaling behavior governed solely by the effective impurity concentration. Applying our model to Mn-doped HgTe quantum wells, we find excellent agreement with experimental data. These findings provide a theoretical foundation for understanding anomalous localization phenomena in magnetically doped topological phases.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Theoretical framework for edge transport in Mn-doped HgTe, connecting to experimental localization data.", "tags": ["topologicalinsulator", "HgTe", "localization"], "image": "https://arxiv.org/html/2607.24373v1/fig/estrutura.png", "briefing": {"background": "2차원 위상 절연체(2DTI)는 시간 역전 대칭성에 의해 보호되는 에지 상태를 가지며, 이는 비자성 불순물에 강인합니다.", "motivation": "자성 불순물이 존재할 때 대칭성 깨짐으로 인한 후방 산란과 Anderson 국소화 현상이 에지 수송에 미치는 영향을 정량화하고자 합니다.", "result": "자성 불순물 농도에 따라 전도도가 시스템 길이의 제곱근에 비례하여 로그 스케일로 감소하는 독특한 '이상 국소화' 거동을 발견했습니다.", "implication": "자성 도핑된 위상 절연체에서 전하 수송 저하가 단순한 산란이 아닌 위상학적 위상의 국소화로 설명됨을 시사합니다.", "novelty": "실험적으로 관찰된 Mn 도핑 HgTe 샘플의 수송 특성을 이론적으로 완벽하게 재현하는 보편적 스케일링 법칙을 제시했습니다.", "unresolved": "불순물 분포의 상관관계가 강할 경우 본 모델의 예측치가 어떻게 변화할지는 추가 연구가 필요합니다.", "future_work": "극저온 하에서의 추가적인 수송 측정과 불순물 분포가 제어된 시료 제작이 필요합니다.", "concepts": [{"term": "Anderson localization", "why_emerged": "무질서한 시스템에서 파동의 간섭으로 인해 전자가 확산하지 못하고 국소화되는 현상을 설명하기 위함.", "origin": "P.W. Anderson (1958).", "connections": "무질서 시스템, 금속-절연체 전이."}, {"term": "Topological Insulator (2DTI)", "why_emerged": "벌크는 절연체이나 표면/에지에서 금속적 상태를 갖는 새로운 물질 위상을 분류하기 위해 도입됨.", "origin": "Kane & Mele (2005).", "connections": "양자 스핀 홀 효과, 위상 불변량."}, {"term": "Time-reversal symmetry (TRS)", "why_emerged": "에지 상태의 안정성을 보장하는 가장 근본적인 대칭성으로 물리학적으로 중요함.", "origin": "Kramers (1930).", "connections": "Kramers 퇴화, Berry 위상."}], "english_summary": ["Provides an analytical framework for transport in magnetically doped 2D topological insulators.", "Identifies an anomalous Anderson localization regime where conductance scales as ln(G) ~ -sqrt(L).", "Model results are validated against transport data in Mn-doped HgTe quantum wells.", "Highlights the critical role of magnetic impurity concentration in breaking topological protection."]}}, {"title": "Band topology and symmetry-driven magneto-optical response in two-dimensional d-wave altermagnets with staggered spin-orbit coupling", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2608.02155", "authors": "Meysam Bagheri Tagani Carmine Autieri, Wojciech Brzezicki", "last_authors": "Meysam Bagheri Tagani Carmine Autieri, Wojciech Brzezicki", "summary": "Altermagnets combine compensated collinear magnetic order with momentum-dependent spin splitting, providing a route to transverse electronic and optical responses without a net ferromagnetic moment. We develop a strictly periodic four-band tight-binding model for a two-dimensional d-wave altermagnet and distinguish the roles of three spin orbit coupling (SOC) channels: uniform Rashba SOC, a sublattice-staggered Rashba interaction, and bond-staggered SOC. In the absence of SOC, the d-wave kinetic anisotropy produces spin-polarized Dirac points on orthogonal Brillouin-zone boundaries, related by the altermagnetic fourfold spin-group symmetry. Uniform Rashba SOC mixes the spin sectors and shifts these nodes but preserves the antiunitary symmetry that forbids an integrated Hall response. The sublattice-staggered Rashba term breaks this symmetry and activates transverse optical response, whereas the bond-staggered SOC provides the mass that gaps the boundary nodes. Their combined action generates strong Berry-curvature hot spots and, within a narrow parameter window, an isolated lower two-band manifold with Chern number C=-2. For the representative parameters considered here it is possible to stabilize a Chern insulator phase. Using covariant-velocity Kubo calculations, we show that large optical Hall conductivity and circular dichroism extend well beyond the nonzero-Chern region and are controlled by SOC-induced avoided crossings and symmetry breaking. We further find that carrier doping strongly modifies the resonant and dc Hall responses through Pauli blocking and the occupation of Berry-curvature hot spots, enabling gate-controlled sign reversals. These results identify the complementary roles of distinct interfacial SOC mechanisms in producing topology and tunable magneto-optical activity in compensated two-dimensional magnets.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Theoretical study of altermagnetism and circular dichroism relevant to magneto-ARPES interests.", "tags": ["theory", "altermagnet", "topology"], "image": "https://arxiv.org/html/2608.02155v1/Fig1_new.png", "briefing": {"background": "알터자성체는 스핀 보상형이지만 운동량 의존적 스핀 분할을 가져, 강자성체와 달리 자화 없이도 비자성 수송 특성을 나타내는 차세대 자성체입니다.", "motivation": "알터자성체에서 스핀-궤도 결합(SOC)의 종류가 어떻게 위상학적 위상과 광학적 반응을 제어하는지 분석하고자 합니다.", "result": "서로 다른 SOC 성분들이 결합하여 베리 곡률의 '핫스팟'을 생성하고, 특정 조건에서 Chern 절연체 상태를 유도할 수 있음을 보였습니다.", "implication": "알터자성체에서 게이트 전압을 이용해 홀 효과와 원편광 이색성을 제어할 수 있는 가능성을 열었습니다.", "novelty": "d-wave 알터자성체에서 다양한 SOC 기제를 명확히 구분하고, 이들이 어떻게 위상학적 위상 전이를 유도하는지 이론적으로 체계화했습니다.", "unresolved": "실제 복합 산화물 등에서 제안된 특정 SOC 강도를 어떻게 물리적으로 구현할지가 과제입니다.", "future_work": "자기 광학 측정(MOKE 등)을 통해 제안된 원편광 이색성 신호의 실험적 검증이 요구됩니다.", "concepts": [{"term": "Altermagnetism", "why_emerged": "보상형 자성체에서 자화 없이 스핀 분할을 가질 수 있는 대칭성 그룹을 분류하기 위해 등장함.", "origin": "Šmejkal, Jungwirth et al. (2022).", "connections": "반강자성체, Berry 곡률, 스핀 그룹."}, {"term": "Chern insulator", "why_emerged": "외부 자기장 없이도 양자 홀 효과를 나타내는 위상 상태를 설명하기 위함.", "origin": "Haldane (1988).", "connections": "양자 비정상 홀 효과, 위상 띠 구조."}, {"term": "Circular dichroism", "why_emerged": "원편광에 대한 물질의 흡수 차이를 측정하여 전자 구조 및 대칭성을 규명하기 위해 필요함.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "스핀-궤도 결합, 광학적 응답 함수."}], "english_summary": ["Theoretical model of 2D d-wave altermagnets examining different SOC channels.", "Shows how staggered SOC breaks symmetry to induce topological phases and Chern insulators.", "Identifies large optical Hall conductivity and gate-tunable circular dichroism.", "Establishes a roadmap for manipulating topological transport in compensated magnetic systems."]}}, {"title": "Bulk Ising superconductivity in an intercalated TaSe2 bilayer structure", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2608.01209", "authors": "Yupeng Li, Zhaopeng Guo, Lihong Hu, et al.", "last_authors": "Jie Shen, Zhu-An Xu", "summary": "Ising spin-orbit coupling in bulk systems has drawn considerable interest for its ability to conveniently construct spin-orbit environments and enable exotic quantum phenomena. In this work, we synthesize intercalated 2Hb-TaSe$_2$ bilayers with noncentrosymmetric structure and, through multifaceted analysis, present multiple lines of evidence for the emergence of bulk Ising superconductivity. Resistivity measurements reveal anisotropic superconducting behavior, with a remarkably large in-plane upper critical field $B_{c2}^{\\|}$ that exceeds the Pauli limit $B_{p}$. Band structure calculations further show band splitting accompanied by out-of-plane spin polarization. Collectively, these observations point to the presence of Ising superconductivity. Additional measurements of the thickness-dependent ratio $B_{c2}^{\\|}$/$B_{p}$ and the superconducting diode effect not only further support the Ising superconducting nature of this material, but also reveal additional features of bulk Ising superconductivity evolving with thickness. Our findings provide valuable insights that may contribute to the search for bulk Ising superconductors.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Evidence for Ising superconductivity in noncentrosymmetric bilayer systems.", "tags": ["superconduct", "bandstructure", "vanderWaals"], "image": "https://arxiv.org/html/2608.01209v1/x1.png", "briefing": {"background": "Ising 초전도성은 강한 스핀-궤도 결합(SOC)이 면외 방향의 스핀 정렬을 강제하여 면내 자기장에 대한 초전도 상태의 저항성을 극대화하는 현상입니다. 기존에는 단층 MoS2와 같은 2D 소재에서 주로 연구되었으나, 이를 벌크 시스템으로 확장하는 것이 위상 초전도체 구현을 위한 핵심 과제입니다.", "motivation": "비중심대칭 구조를 가진 층간 삽입(intercalated) 2Hb-TaSe2 이중층 시스템에서 벌크 형태의 Isi   const badges = document.createElement('div');
  badges.className = 'badges';
  if (r.score) badges.appendChild(textEl('span', 'badge score', `${r.score}/10`));
  if (r.tier) badges.appendChild(textEl('span', 'badge', r.tier));
  if (r.journal) badges.appendChild(textEl('span', 'badge', r.journal));
  if (r.source) badges.appendChild(textEl('span', 'badge', r.source));
  headText.appendChild(badges);
  const title = document.createElement('h1');
  if (r.link) { const titleLink = document.createElement('a'); titleLink.href = r.link; titleLink.target = '_blank'; titleLink.rel = 'noopener noreferrer'; titleLink.textContent = r.title || ''; title.appendChild(titleLink); }
  else { title.textContent = r.title || ''; }
  headText.appendChild(title);
  headText.appendChild(textEl('p', 'meta', [r.journal, r.source].filter(Boolean).join(' | ')));
  if (r.last_authors || r.authors) { const authors = document.createElement('p'); authors.className = 'authors'; if (r.last_authors) authors.append('Last authors: ' + r.last_authors); if (r.authors) authors.append((r.last_authors ? ' | ' : '') + 'Authors: ' + r.authors); headText.appendChild(authors); }
  appendLabeledText(headText, 'why', 'Filter reason: ', r.reason);
  if (r.tags && r.tags.length) { const tags = document.createElement('div'); tags.className = 'tags'; r.tags.forEach(tag => tags.appendChild(textEl('span', 'tag', '#' + tag))); headText.appendChild(tags); }
  if (r.link) { const link = document.createElement('a'); link.className = 'link'; link.href = r.link; link.target = '_blank'; link.rel = 'noopener noreferrer'; link.textContent = 'Open paper'; headText.appendChild(link); }
  head.appendChild(headText);
  if (r.summary) { const abstract = document.createElement('p'); abstract.className = 'original-abstract'; const strong = textEl('strong', '', 'Original abstract'); abstract.appendChild(strong); abstract.append(r.summary); head.appendChild(abstract); }
  slideEl.appendChild(head);
  const briefing = document.createElement('div');
  briefing.className = 'briefing';
  appendBriefSection(briefing, 'Background', b.background);
  appendBriefSection(briefing, 'Motivation', b.motivation);
  appendBriefSection(briefing, 'Result', b.result);
  appendBriefSection(briefing, 'Implication', b.implication);
  appendBriefSection(briefing, "Why it's important / Novelty", b.novelty);
  appendBriefSection(briefing, 'Unresolved Questions', b.unresolved);
  appendBriefSection(briefing, 'Expected Future Work', b.future_work);
  if (b.concepts && b.concepts.length) {
    const section = document.createElement('section');
    section.className = 'brief-section wide';
    section.appendChild(textEl('h2', '', 'Concepts / Terms'));
    const concepts = document.createElement('div');
    concepts.className = 'concepts';
    b.concepts.forEach(c => {
      const item = document.createElement('div');
      item.className = 'concept';
      item.appendChild(textEl('h3', '', c.term || 'Concept'));
      [['왜 생겼나: ', c.why_emerged], ['누가 만들었나: ', c.origin], ['연결되는 흐름: ', c.connections]].forEach(([label, text]) => { if (!text) return; const p = document.createElement('p'); const bold = textEl('b', '', label); p.appendChild(bold); p.append(text); item.appendChild(p); });
      concepts.appendChild(item);
    });
    section.appendChild(concepts);
    briefing.appendChild(section);
  }
  if (b.english_summary && b.english_summary.length) { const section = document.createElement('section'); section.className = 'brief-section wide'; section.appendChild(textEl('h2', '', 'English Summary')); const ul = document.createElement('ul'); b.english_summary.slice(0, 5).forEach(line => ul.appendChild(textEl('li', '', line))); section.appendChild(ul); briefing.appendChild(section); }
  slideEl.appendChild(briefing);
  counterEl.textContent = `${index + 1} / ${slides.length}`;
  prevBtn.disabled = index === 0;
  nextBtn.disabled = index === slides.length - 1;
}
prevBtn.addEventListener('click', () => { index = Math.max(0, index - 1); render(); });
nextBtn.addEventListener('click', () => { index = Math.min(slides.length - 1, index + 1); render(); });
document.addEventListener('keydown', event => { if (event.key === 'ArrowLeft') prevBtn.click(); if (event.key === 'ArrowRight') nextBtn.click(); });
render();
</script>
</body>
</html>
