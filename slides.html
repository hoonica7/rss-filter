니다.", "concepts": [{"term": "모아레 초격자(Moire superlattice)", "why_emerged": "층상 물질을 서로 다른 각도로 쌓아 새로운 주기성을 부여하여 전자 상태를 변형하기 위해 도입됨.", "origin": "초록 정보만으로는 특정하기 어려움 (일반적으로 그래핀 트위스트 연구에서 대중화됨).", "connections": "트위스트 2층 그래핀(TBG), 평탄 밴드 물성 연구."}, {"term": "평탄 밴드(Flat bands)", "why_emerged": "운동 에너지가 억제되어 전자 상관관계가 지배적인 상태를 구현하기 위해 필요함.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "강한 상관관계 전자계, 초전도성, 분수 양자 홀 효과."}, {"term": "DeepH-E3 해밀토니언", "why_emerged": "DFT 수준의 정확도를 유지하면서도 수천 개의 원자를 포함하는 초격자 계산 효율성을 극대화하기 위해 개발됨.", "origin": "최근 머신러닝 기반 전자구조 계산 분야에서 활발히 연구 중.", "connections": "DFT, 기계학습 포텐셜."}], "english_summary": ["Application of E(3)-equivariant deep-learning Hamiltonian to twisted bilayer SrTiO3.", "Demonstrates twist-tunable electronic structure and band flattening in complex oxide moire systems.", "Significant enhancement in SHG and shift current as a function of twist angle.", "Proposes an efficient computational framework for large-scale oxide moire supercells."]}}, {"title": "Eclipsing Kitaev: off-diagonal exchange governs the correlated high-field phases of -Li2IrO3", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2607.06463", "authors": "Vikram Nagarajan, Ioannis Rousochatzakis, Yuanqi Lyu, et al.", "last_authors": "Natalia B. Perkins, K. A. Modic", "summary": "We report a high-field thermodynamic study of the hyperhoneycomb Kitaev material $\\beta$-Li$_2$IrO$_3$, using magnetotropic susceptibility to resolve its low-temperature field-angle phase diagram across the principal crystallographic planes in magnetic fields up to $60$ T. Rather than evolving directly from the low-field incommensurate state into a polarized regime, the system exhibits a strongly direction-dependent sequence of correlated phases. Most notably, for fields in the $ac$-plane, we identify an additional high-field phase that is absent in the other principal planes and exists only within a restricted region of field-angle space. This phase structure is naturally explained by the competition between magnetic field and bond-directional exchange interactions. Using a symmetry-based description supported by microscopic calculations within the $J$-$K$-$\\Gamma$ model, we show that off-diagonal $\\Gamma$ exchange couples the ferromagnetic and staggered magnetic orders and thereby stabilizes the observed correlated high-field phases. The measured angular dependence of the critical fields is quantitatively captured by this theory, identifying $\\Gamma$ exchange as the key interaction controlling the high-field response. These results clarify why the promise of a field-induced spin liquid -- the notion that suppressing magnetic order might reveal the underlying Kitaev physics -- remains unfulfilled in candidate materials: even when the Kitaev interaction is large, off-diagonal exchange stabilizes symmetry-constrained correlated phases that instead preempt the polarized state.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "High-field study of Kitaev candidate; provides insight into correlated phases and exchange interactions.", "tags": ["spinliquid", "correlated", "magnetism"], "image": "https://arxiv.org/html/2607.06463v1/x1.png", "briefing": {"background": "키타예프 물질(Kitaev materials)은 양자 스핀 액체 후보군으로, 벌집 격자 위에서 방향 의존적인 스핀 교환 상호작용이 지배적인 물질입니다. 이들의 근본적인 물성을 이해하기 위해 강한 자기장을 걸어 자성 질서를 억제하려는 시도가 많습니다.", "motivation": "후보 물질인 beta-Li2IrO3에서 고자기장 하의 물성을 탐구하여, 자기장이 가해질 때 단순하게 편극 상태로 가는지, 아니면 새로운 상관관계 상태가 출현하는지를 밝히고자 합니다.", "result": "최대 60T 자기장 하에서 고해상도 측정을 수행한 결과, 기존의 단순한 스핀 액체 진입과는 다르게, 방향 의존적인 복잡한 고자기장 상들이 존재함을 확인했습니다. 이는 키타예프 상호작용 외의 오프-다이아고널(off-diagonal) 감마($\\Gamma$) 교환이 중요함을 시사합니다.", "implication": "키타예프 후보 물질에서 흔히 보이는 고자기장 상들이 사실은 스핀 액체로 가는 길이 아니라, 감마 교환 등에 의한 대칭성 제약된 상관관계 상에 의해 선점당하고 있음을 증명했습니다.", "novelty": "이론적 모델인 J-K-Gamma 모델이 고자기장 실험 데이터를 정량적으로 설명함을 보였으며, 왜 많은 후보 물질에서 순수한 양자 스핀 액체를 관측하기 어려운지에 대한 근본적인 해답을 제시합니다.", "unresolved": "감마 교환이 왜 특정 각도(ac-plane)에서 더 지배적인지에 대한 미시적 기원과, 시스템의 대칭성 붕괴에 대한 더 깊은 이해가 필요합니다.", "future_work": "감마 교환을 제어하거나 억제할 수 있는 화학적 도핑이나 압력 실험을 통한 추가적인 상태 조사.", "concepts": [{"term": "키타예프 상호작용(Kitaev interaction)", "why_emerged": "벌집 격자에서 스핀 방향에 따라 bond-dependent한 교환 상호작용을 구현하기 위해 제안됨.", "origin": "Alexei Kitaev (2006).", "connections": "양자 스핀 액체, 이리듐 산화물."}, {"term": "오프-다이아고널 감마($\\Gamma$) 교환", "why_emerged": "키타예프 모델을 넘어선 실제 물질의 비대칭적 스핀 상호작용을 설명하기 위해 필요함.", "origin": "이리듐 산화물 연구 초기(Jackeli, Khaliullin 등).", "connections": "J-K-Gamma 모델, 자기 이방성."}, {"term": "Hyperhoneycomb(초벌집 구조)", "why_emerged": "3차원 벌집 구조의 확장을 통해 키타예프 물성이 3차원 물질에서 어떻게 나타나는지 연구하기 위해 필요함.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "Li2IrO3 계열 물질."}], "english_summary": ["Thermodynamic study of beta-Li2IrO3 up to 60T revealing complex field-angle dependent phases.", "Identifies off-diagonal Gamma exchange as the dominant interaction preventing field-induced spin liquid.", "Provides a microscopic explanation for the preemption of polarized states by correlated phases.", "Confirms the J-K-Gamma model description for high-field physics in Kitaev candidates."]}}, {"title": "Effect of pressure on the magnetic properties of (Co0.5Fe0.5)5GeTe2", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2607.05548", "authors": "Tam\\'as Prok, Zolt\\'an Kov\\'acs-Krausz, Harvey Stanfield, et al.", "last_authors": "P\\'eter Makk, Endre T\\'ov\\'ari", "summary": "Cobalt-doped Fe$_5$GeTe$_2$ possesses a rich magnetic phase diagram as a function of Co concentration. The nature of magnetic order in (Co$_{0.5}$Fe$_{0.5}$)$_5$GeTe$_2$ is especially interesting, as it has been shown to exhibit ferromagnetic order, A-type antiferromagnetic (AFM) order, or potentially both at the same time. Here we present magnetoresistance measurements on antiferromagnetic (Co$_{0.5}$Fe$_{0.5}$)$_5$GeTe$_2$ at a series of pressures and extract the anisotropy and interlayer exchange fields using the two-sublattice model. We show a 50 % increase of the interlayer exchange at 2 GPa, highlighting the sensitivity of magnetic properties to interlayer distance. In addition, we find that the sharp hysteretic transitions observed within the AFM state can be qualitatively described by a linear chain model, which suggests an even-odd effect as a function of layer number instead of a coexisting ferromagnetic phase.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Experimental investigation of magnetic properties in a relevant van der Waals material.", "tags": ["material", "magnetic", "transport"], "image": "https://arxiv.org/static/browse/0.3.4/images/arxiv-logo-fb.png", "briefing": {"background": "Fe5GeTe2 계열의 반데르발스 자성 물질은 층간 자기 결합의 미묘한 경쟁에 따라 강자성(FM)과 반강자성(AFM) 사이를 오가는 풍부한 자기 상도를 보입니다. 이는 차세대 스핀트로닉스 응용 가능성 때문에 중요합니다.", "motivation": "(Co0.5Fe0.5)5GeTe2에서 나타나는 반강자성 상태가 실제로 어떻게 상호작용하는지, 그리고 압력이 층간 거리를 조절할 때 자기 물성이 어떻게 변화하는지 규명하고자 합니다.", "result": "압력을 가할 때 층간 교환 상호작용이 2GPa에서 50% 증가함을 확인했습니다. 또한 AFM 상태 내에서 관측되는 이력 현상은 강자성과의 공존보다는 층 수에 따른 'even-odd 효과'로 설명 가능함을 제안했습니다.", "implication": "이 물질의 자기 질서가 단순히 강자성/반강자성의 경쟁이 아니라, 층간 결합의 민감도와 층의 개수에 따른 기하학적 효과에 의해 결정됨을 시사합니다.", "novelty": "고압 magnetoresistance 실험을 통해 층간 교환 결합을 정량적으로 추출하였으며, 기존의 강자성 공존 모델에 의문을 제기하는 새로운 해석(even-odd 효과)을 제시했습니다.", "unresolved": "이력 현상의 미시적 근원이 되는 층간 결합의 변화가 정확히 어떤 구조적 변형과 연관되어 있는지 확인이 필요합니다.", "future_work": "고압 상태에서의 중성자 산란 실험이나 직접적인 자기 구조 분석을 통해 even-odd 효과 가설을 검증해야 합니다.", "concepts": [{"term": "반데르발스 자성 물질", "why_emerged": "단원자층으로 분리가 가능하며, 층간 결합을 제어하여 새로운 물성을 도출하기 위해 필요함.", "origin": "초록 정보만으로는 특정하기 어려움 (CrI3 등 연구가 효시).", "connections": "2D 자성, 스핀트로닉스."}, {"term": "Even-odd 효과", "why_emerged": "층의 개수에 따라 자기적 바닥 상태가 달라지는 현상을 설명하기 위해 도입됨.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "층상 반강자성체, 위상 절연체."}, {"term": "이방성 및 층간 교환 필드", "why_emerged": "반데르발스 물질의 복잡한 자기 이력 곡선을 해석하기 위해 필요한 파라미터.", "origin": "자성학 표준 모델.", "connections": "Two-sublattice 모델, Ising 모델."}], "english_summary": ["Magnetoresistance study of (Co0.5Fe0.5)5GeTe2 under pressure.", "Significant increase in interlayer exchange interaction observed at 2 GPa.", "Proposed 'even-odd' effect as the origin of hysteretic AFM transitions.", "Challenges existing models of ferromagnetic-AFM coexistence in this system."]}}, {"title": "Electric Field Induced Multi-Space Topological Phase Transitions in Janus Monolayer MnBi2Se2Te2", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2607.05631", "authors": "Kefan Zhang, Jian Wu, Weiyi Pan", "last_authors": "Jian Wu, Weiyi Pan", "summary": "Manipulating coexisting multi-space topological states within a single material is a critical frontier for low-power spintronic applications, for which perpendicular electric-field gating offers a highly precise tuning mechanism. Using first-principles calculations and atomistic spin simulations, it is demonstrated that Janus monolayer MnBi2Se2Te2 can exhibit simultaneous momentum-space and real-space topological phase transitions under an external electric field. Specifically, the electric field drives momentum-space transitions across a topologically trivial state (C = 0), a low-Chern-number quantum anomalous Hall state (C = -1), and a high-Chern-number state (C = 2). Concurrently, by actively tuning the competition between the Dzyaloshinskii-Moriya interaction and magnetic anisotropy, the electric field induces real-space magnetic transitions from a uniform ferromagnetic state to an isolated skyrmion state, and ultimately to a skyrmion-spiral domain coexistence phase. Electric-field-induced variations in both the QAHE and magnetic textures may give rise to multiple topological phase transitions, involving distinct topological regimes: a purely k-space topology, RK-joint skyrmions, and pure real-space skyrmions. These findings establish a powerful material platform and efficient route for the synergistic control of coexisting topological orders, making it highly promising for next generation multi-functional spintronic devices.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Topological and magnetic phase control in a relevant 2D monolayer system.", "tags": ["material", "anomalousHall", "topological"], "image": "https://arxiv.org/html/2607.05631v1/figures/slide_01.png", "briefing": {"background": "스핀트로닉스 분야에서는 저전력 소자 구현을 위해 운동량 공간(momentum-space)의 위상 상태와 실공간(real-space)의 자기적 질서를 동시에 제어하는 기술이 중요합니다.", "motivation": "Janus 단층 MnBi2Se2Te2 물질에서 외부 전기장을 이용해 다중 위상 전이를 유도하여 토폴로지 특성과 자기 텍스처를 동시에 제어할 수 있는지를 탐구하고자 했습니다.", "result": "전기장 세기에 따라 Chern 수(C=0, -1, 2)가 변하는 운동량 공간 위상 전이와, 강자성에서 스카이뮴 및 나선형 도메인으로 변하는 실공간 자기 전이가 공존함을 이론적으로 입증했습니다.", "implication": "단일 소재에서 운동량 공간의 토폴로지와 실공간의 스카이뮴 상태를 전기장으로 정밀하게 제어할 수 있는 새로운 다기능 스핀트로닉 소자 플랫폼을 제시합니다.", "novelty": "운동량 공간과 실공간의 위상 질서를 동시에 제어하는 'RK-joint' 스카이뮴 등 새로운 위상 체계를 제시했다는 점에서 차별성이 있습니다.", "unresolved": "이론적인 제일원리 계산과 스핀 시뮬레이션 기반 결과이므로, 실제 실험적인 소자 구현 및 전기장 인가 시의 유효성 검증이 필요합니다.", "future_work": "실제 Janus 단층 박리 및 전기장 게이팅을 통한 수송 측정 실험이 필요하며, 장치 내 소모 전력 최적화 연구가 예상됩니다.", "concepts": [{"term": "Janus Monolayer", "why_emerged": "2차원 물질의 위하와 아래 면을 서로 다른 원자로 구성하여 구조적 비대칭성과 전기적 분극을 유도하기 위해 필요함.", "origin": "2010년대 후반 Janus MoSSe의 합성으로 본격화됨.", "connections": "2D 수직 이질 구조 및 강유전성 소재와 연결됨."}, {"term": "Quantum Anomalous Hall State", "why_emerged": "외부 자기장 없이도 위상적인 밴드 구조에 의해 양자화된 홀 전도도를 구현하여 저전력 소자를 만들기 위함.", "origin": "Haldane(1988) 모델, 실험적 발견은 Chang et al.(2013)의 자성 도핑 TI.", "connections": "토폴로지 절연체, 스핀 궤도 결합(SOC)."}, {"term": "Skyrmion", "why_emerged": "나노 크기의 안정적인 자기 소용돌이 구조를 이용해 고밀도 정보 저장 소자를 구현하기 위해 필요함.", "origin": "Tony Skyrme(1962), 고체 물리학에서는 Muhlbauer et al.(2009)이 실험적으로 발견.", "connections": "Dzyaloshinskii-Moriya 상호작용, 위상적 홀 효과."}], "english_summary": ["Demonstrated simultaneous momentum-space and real-space topological phase control in Janus MnBi2Se2Te2.", "Electric field tuning modulates both Chern numbers and magnetic skyrmion textures.", "Proposes a multifunctional platform for next-generation spintronic devices.", "Results are based on first-principles calculations and atomistic simulations."]}}, {"title": "Experimental investigation of altermagnetic order in Cr-doped FeSb2", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2605.01088", "authors": "A K M Ashiquzzaman Shawon, Eoghan Downey, Shane Smolenski, et al.", "last_authors": "Huibo Cao, Na Hyun Jo", "summary": "Altermagnets are a class of materials with compensated magnetic moments, in which spin sublattices are related by specific rotational symmetries other than inversion or translation. This allows time-reversal symmetry to be broken without a net magnetization. Cr-doped FeSb2 has been theoretically proposed as a candidate d-wave altermagnetic system, yet its magnetic ground state has remained unresolved. Here, we synthesize single crystals of Fe1-xCrxSb2 and investigate their electrical transport and magnetic properties, with a focus on Fe0.85Cr0.15Sb2. Magnetization measurements suggest spin-compensated ordering below ~3.5 K, where magnetic moments align along the crystallographic b-direction. Transport measurements reveal a crossover from large positive to negative magnetoresistance, while an anomalous Hall response emerges below 5 K, indicating time-reversal symmetry breaking. Muon spin relaxation measurements confirm that the magnetic ordering below 3.5 K is bulk in nature. The absence of coherent oscillations in zero-field {\\mu}SR spectra and of magnetic Bragg intensity in single-crystal neutron diffraction establishes that the magnetically ordered state is short-range or disordered, rather than collinear altermagnetic order. These results demonstrate that Cr-doping alone breaks time-reversal symmetry without stabilizing long-range altermagnetic order in FeSb2.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Experimental investigation of altermagnetism and TRSB using transport and muon spin relaxation.", "tags": ["altermagnetism", "TRSB", "transport"], "image": "https://arxiv.org/html/2605.01088v2/x1.png", "briefing": {"background": "알터자성(Altermagnetism)은 순자화는 없지만, 특정 대칭성에 의해 시간 반전 대칭이 깨져 스핀 분할된 밴드 구조를 가지는 새로운 자기 상입니다.", "motivation": "이론적으로 알터자성 후보 물질로 제안된 Cr 도핑된 FeSb2에서 실제 알터자성 질서가 존재하는지 검증하고자 했습니다.", "result": "전기 수송 및 뮤온 스핀 완화(muSR) 측정 결과, Cr 도핑이 시간 반전 대칭을 깨뜨리기는 하지만 장거리 알터자성 질서는 형성되지 않음을 발견했습니다.", "implication": "단순히 이론적 후보군에 속한다고 해서 실제 강한 알터자성 특성이 구현되는 것은 아님을 시사하며, 물질 설계 시 주의가 필요함을 보여줍니다.", "novelty": "유망한 알터자성 후보 물질에 대한 실험적 검증을 통해 이론 모델과 실제 물질의 거동 차이를 규명했습니다.", "unresolved": "알터자성 질서가 사라진 정확한 원인과 국부적인 자기 불규칙성이 물성에 미치는 영향에 대한 분석이 추가로 필요합니다.", "future_work": "다른 도핑 농도나 대체 물질을 통한 알터자성 상의 안정화 조건 탐색, 혹은 보다 직접적인 ARPES를 통한 밴드 스핀 분할 확인이 필요합니다.", "concepts": [{"term": "Altermagnetism", "why_emerged": "강자성(자화 있음)과 반강자성(스핀 보상됨)의 한계를 넘어, 스핀 편극된 밴드를 가지면서 외부 자기장을 생성하지 않는 물질이 필요해짐.", "origin": "Smejkal et al.(2022) 등에서 이론적으로 확립됨.", "connections": "시간 반전 대칭 파괴, 비공선형 자기 구조."}, {"term": "Time-Reversal Symmetry Breaking (TRSB)", "why_emerged": "위상적 성질과 자성 특성의 상호작용을 유도하는 근본적인 물리적 조건.", "origin": "초기 양자 역학 체계에서 정립됨.", "connections": "이상 홀 효과, 자성 위상 절연체."}, {"term": "Muon Spin Relaxation (muSR)", "why_emerged": "시료 내부의 아주 작은 자기적 질서나 불균일한 자기 상태를 민감하게 탐지하기 위해 사용함.", "origin": "20세기 중반 입자 물리학 기술에서 발전함.", "connections": "중성자 산란(bulk 확인), 자기 측정."}], "english_summary": ["Investigated Cr-doped FeSb2 as a candidate d-wave altermagnet.", "Transport and muSR confirm time-reversal symmetry breaking.", "Absence of magnetic Bragg peaks indicates lack of long-range altermagnetic order.", "Shows Cr-doping alone is insufficient to stabilize long-range altermagnetism."]}}, {"title": "Half state at = -1/2 and its transition in Decoupled Twisted Double Bilayer Graphene", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2607.06547", "authors": "Ning Ma, Kenji Watanabe, Takashi Taniguchi, Mitali Banerjee", "last_authors": "Takashi Taniguchi, Mitali Banerjee", "summary": "The origin of the fractional state at $\\nu$ = 1/2 observed in double-layer quantum Hall systems has been under debate for decades. Because of the variation of bilayer charge distribution and interlayer tunneling strength, the half-filling state can be attributed to a two-component(2C) or a one-component(1C) origin, which corresponds to Halperin state and Pffafian state, respectively. Here we report the magnetotransport measurement in decoupled twisted double bilayer graphene(TDBG), which has been proved to be a promising platform for double quantum Hall system. Fractional quantum hall states in both odd and even denominator fillings are observed. We also found that the half-filling state occurs at zero displacement field at $\\nu_{tot}$ = -1/2, which is theoretically consistent with two-component Halperin-Laughlin ({\\Psi}331) state. Moreover, we report the transition from two-component state at zero D field to one-component non-Abelian state by tunning displacement field. Our observation of the half filling state and its transition from 2C to 1C state provides the tunability of decoupled twisted double bilayer graphene and shed light on the understanding of the ground states at half-filling factor in the double quantum Hall system.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Fractional quantum Hall study in twisted double bilayer graphene systems.", "tags": ["graphene", "quantumHall", "fractionalquantumHall", "transport"], "image": "https://arxiv.org/html/2607.06547v1/figure1.png", "briefing": {"background": "뒤틀린 이중 층 그래핀(TDBG) 시스템은 층간 결합과 전기장을 통해 전자 상관관계를 정밀하게 제어할 수 있는 플랫폼으로 주목받고 있습니다.", "motivation": "분수 양자 홀 효과의 1/2 충전 상태에서 관찰되는 비가환(non-Abelian) 상태와 그 기원을 이해하기 위해 TDBG 시스템을 활용했습니다.", "result": "TDBG에서 D-field를 통해 2성분(Halperin) 상태에서 1성분(non-Abelian) 상태로의 전이를 확인했으며, 이는 1/2 충전 상태의 기원을 설명하는 단서를 제공합니다.", "implication": "TDBG가 분수 양자 홀 시스템의 기저 상태 연구에 매우 효과적인 조절 가능한 실험 플랫폼임을 입증했습니다.", "novelty": "이중 층 그래핀에서 displacement field 조절만으로 위상 상태의 전이를 직접 관측했다는 점이 핵심입니다.", "unresolved": "전이 과정에서 나타나는 정확한 준입자의 특성과 그에 따른 위상적 성질의 세부적인 차이는 추가 규명이 필요합니다.", "future_work": "비가환 통계의 직접적인 확인을 위한 간섭계 실험이나 고해상도 수송 측정 연구가 예상됩니다.", "concepts": [{"term": "Fractional Quantum Hall Effect", "why_emerged": "2차원 전자 기체에서 강한 자기장과 전자-전자 상호작용이 결합하여 분수 전하를 가진 들뜸이 나타나는 현상을 설명하기 위해.", "origin": "Tsui, Stormer, Laughlin(1982).", "connections": "Laughlin 액체, 비가환 통계, 위상 양자 컴퓨터."}, {"term": "Twisted Double Bilayer Graphene (TDBG)", "why_emerged": "모아레 패턴과 층간 결합을 통해 전자 구조를 인위적으로 조절하기 위해.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "모아레 초격자, 강상관 전자계."}, {"term": "Non-Abelian State", "why_emerged": "입자 교환 시 위상이 변하여 양자 정보의 결함 없는 저장을 가능하게 하는 위상적 상태.", "origin": "Moore and Read(1991).", "connections": "마요라나 페르미온, 위상 양자 연산."}], "english_summary": ["Observed fractional quantum Hall states in decoupled twisted double bilayer graphene.", "Identified transition from 2-component Halperin to 1-component non-Abelian states.", "Displacement field tuning controls the ground state at half-filling.", "Provides new insights into the origin of half-filling states in double-layer systems."]}}, {"title": "High temperature ferromagnetism in epitaxial monolayers of Co-doped Fe5GeTe2", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2607.05962", "authors": "Jules Courtin (SPINTEC), Fatima Ibrahim (SPINTEC), Davide Benettin (SPINTEC), et al.", "last_authors": "IUF), Fr\\'ed\\'eric Bonell (SPINTEC)", "summary": "Magnetic van der Waals materials have mainly been investigated in their bulk form or as few-layers flakes. Due to the challenges in producing atomically thin films, only a few have been isolated as monolayers, which typically exhibit long-range magnetic order below 150 K. In this work, we use molecular beam epitaxy to synthesize Co-doped Fe5GeTe2, achieving precise control over both thickness and composition. We demonstrate ferromagnetism well above room temperature in multilayer samples and present clear evidence of ferromagnetic ordering in monolayers up to $\\sim$200 K. The changes in Curie temperature and magnetic anisotropy with composition exhibit similar trends in both monolayers and thicker films, indicating that the magnetic properties are primarily governed by intralayer magnetic interactions. Through element-specific X-ray magnetic circular dichroism and density functional theory, we identify the substitution site of Co dopants and reveal the mechanism behind the Curie temperature enhancement induced by Co doping. Our findings suggest that, despite their weak magnetic moment, Co dopants strengthen the magnetic moments on neighboring Fe atoms and enhance the intralayer ferromagnetic exchange interactions.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Experimental study of high-temperature ferromagnetism in a vdW monolayer, using XMCD and DFT.", "tags": ["experiment", "material", "vanderWaals", "monolayer", "ferromagnetism", "XMCD", "DFT"], "image": "https://arxiv.org/static/browse/0.3.4/images/arxiv-logo-fb.png", "briefing": {"background": "자성 반데르발스 물질은 차세대 스핀트로닉스 소자 후보군으로 주목받지만, 대다수가 극저온에서만 장거리 자기 질서를 유지하는 한계가 있습니다.", "motivation": "Fe5GeTe2 계열의 물질에서 상온 이상의 강자성을 구현하고, 단원자층 수준에서도 이러한 자기적 특성을 유지할 수 있는지 확인하고자 했습니다.", "result": "Co를 도핑하여 Fe5GeTe2 단원자층을 제작하였으며, 200K 근처까지 강자성이 유지됨을 실험적으로 확인했습니다. 또한 Co 도펀트가 주변 Fe 원자의 자기 모멘트를 강화하고 층내 교환 상호작용을 증대시키는 메커니즘을 밝혀냈습니다.", "implication": "반데르발스 물질의 화학적 도핑과 두께 제어를 통해 고온 자성 구현이 가능함을 보였으며, 이는 실용적인 자성 소자 개발에 중요한 토대를 제공합니다.", "novelty": "기존 연구 대비 분자선 에피택시(MBE)를 사용하여 매우 정밀하게 도핑과 두께를 제어했다는 점이 독보적이며, XMCD 분석을 통해 도핑의 미시적 기전을 명확히 규명했습니다.", "unresolved": "Co 도핑이 강자성을 강화하는 상세한 전자 구조 변화와 그에 따른 밴드 구조의 이동(ARPES 등으로 확인 가능한 수준)에 대해서는 추가적인 검증이 필요합니다.", "future_work": "도핑 농도 및 종류를 최적화하여 200K를 넘어 상온까지 강자성을 유지하는 2D 물질 합성 연구가 이어질 것으로 보입니다.", "concepts": [{"term": "XMCD (X-ray Magnetic Circular Dichroism)", "why_emerged": "원소별로 자기적 상태를 선택적으로 탐구하기 위해 개발되었습니다.", "origin": "1990년대 초 보졸레(Benoit Thole) 등에 의해 이론적 토대가 마련되었습니다.", "connections": "XAS, RIXS와 연결되며, 원소 선택적 자기 모멘트 측정에 필수적입니다."}, {"term": "Van der Waals Magnetism", "why_emerged": "기존 3D 자성체와 달리 얇은 층에서도 자성이 유지되는 양자 현상을 탐구하기 위해 필요했습니다.", "origin": "2017년 CrI3 및 Cr2Ge2Te6에서의 발견이 시초입니다.", "connections": "2D 소재, 스핀트로닉스, 양자 정보 소자."}], "english_summary": ["Achieved stable ferromagnetism in Co-doped Fe5GeTe2 monolayers up to ~200 K.", "Used MBE for precise control of composition and thickness in vdW heterostructures.", "Identified that Co dopants strengthen intralayer exchange interactions via XMCD and DFT.", "Demonstrates a viable route for high-temperature 2D magnetic materials."]}}, {"title": "Layer-selective chirality switch in bilayer graphene intercalated by Janus monolayers", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2607.06159", "authors": "Marko Milivojevi\\'c", "last_authors": "Marko Milivojevi\\'c", "summary": "We predict that intercalating bilayer graphene with nonmagnetic WSSe or magnetic MnSSe Janus monolayers induces a layer-selective switch of the in-plane Rashba spin texture, resulting in opposite spin current directions in the top and bottom graphene layers. First-principles calculations reveal that both Janus monolayers decouple the two graphene layers while simultaneously inducing opposite signs of the proximity-induced Rashba spin-orbit coupling in each. Tight-binding modeling of the proximitized layers, combined with Rashba-Edelstein charge-to-spin conversion calculations, confirms that the spin current direction can be independently controlled by gating the top or bottom graphene layer. Bilayer graphene intercalated by Janus monolayers thus represents a promising platform for gate-tunable, layer-selective spintronic devices.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "DFT study on spin-orbit coupling and spin currents in graphene/Janus monolayer heterostructures.", "tags": ["theory", "DFT", "graphene", "monolayer", "heterostructure", "spintronics", "spin-orbitcoupling"], "image": "https://arxiv.org/html/2607.06159v1/x1.png", "briefing": {"background": "그래핀의 높은 이동도와 스핀 자유도를 결합하여 효율적인 스핀트로닉스 소자를 만들기 위한 연구가 활발합니다.", "motivation": "이종 구조 내에서 각 층의 스핀 텍스처를 독립적으로 제어하여, 층별로 선택 가능한 스핀 전류를 구현하고자 했습니다.", "result": "Janus 단원자층(WSSe, MnSSe)을 이중층 그래핀 사이에 삽입하여, 위층과 아래층 그래핀에 서로 반대 방향의 라쉬바(Rashba) 스핀-궤도 결합을 유도했습니다.", "implication": "게이팅을 통해 스핀 전류의 방향을 층별로 제어할 수 있는 소자 아키텍처를 제시했습니다.", "novelty": "Janus 구조의 비대칭성을 활용해 이종 구조 내에서 층 선택적인 스핀 정렬을 제어했다는 점이 혁신적이며, 전하-스핀 변환 효율을 극대화할 수 있습니다.", "unresolved": "실제 실험적 소자 제작 시 계면의 결함이나 층간 정렬 오류가 스핀-궤도 결합의 균일성에 미치는 영향은 아직 평가되지 않았습니다.", "future_work": "실제 게이트 전압을 이용한 스핀 전류 방향 스위칭 실험과 그에 따른 수송 현상 측정이 요구됩니다.", "concepts": [{"term": "Janus Monolayer", "why_emerged": "물질의 양면을 서로 다른 원자로 구성하여 비대칭적인 전기적/자기적 특성을 구현하기 위해 필요했습니다.", "origin": "2017년 MoSSe 합성 보고가 주요 기점입니다.", "connections": "강유전성, 라쉬바 효과, 이종 구조 소재."}, {"term": "Rashba Effect", "why_emerged": "구조적 반전 대칭성이 깨진 계면에서 스핀-궤도 결합에 의한 스핀 갈라짐을 설명하기 위해 도입되었습니다.", "origin": "1960년 이마누엘 라쉬바에 의해 제안되었습니다.", "connections": "스핀-궤도 토크, 위상 절연체, 스핀트로닉스."}], "english_summary": ["Predicts layer-selective chirality switching in bilayer graphene via Janus intercalation.", "Induces opposite Rashba spin textures in top and bottom graphene layers.", "Allows gate-tunable spin current direction control.", "Provides a theoretical platform for efficient spin-charge conversion devices."]}}, {"title": "Magnon-Mediated Superconductivity in a 2D Itinerant Ferromagnet with Weak Easy-plane Magnetic Anisotropy", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2607.05754", "authors": "Vladimir Calvera, Heqiu Li, Yijie Wang, B. Andrei Bernevig, Andrey V. Chubukov", "last_authors": "B. Andrei Bernevig, Andrey V. Chubukov", "summary": "Motivated by recent observations of superconductivity in a quarter-metal state of spin- and valley- polarized graphene multilayers, we investigate pairing within a ferromagnetic phase of a single-valley model of itinerant two-dimensional (2D) electrons with Hubbard-type interaction and no artificial high-energy cutoff. In 2D, the Stoner transition is first-order into a fully-polarized state wherein the only gapless collective excitations are transverse magnons. We find that in a spin-SU(2) symmetric model, this magnon-mediated pairing interaction between equal-spin fermions vanishes at T = 0 T=0 . We show that a small easy-plane magnetic anisotropy Ω 0 ≪ E F \\Omega_{0}\\ll E_{F} , where E F E_{F} is the Fermi energy, breaks the SU(2) symmetry and generates an attractive interaction for equal-spin p − p- wave pairing. We explicitly derive the corresponding coupling constant λ p \\lambda_{p} as the scaling function of both the relative strength of the easy-plane anisotropy, Ω 0 / E F \\Omega_{0}/E_{F} , and the proximity to the ferromagnetic transition. While λ p \\lambda_{p} is parametrically small in Ω 0 / E F \\Omega_{0}/E_{F} deep inside the ferromagnetic phase, it becomes enhanced near the ferromagnetic transition, reaching order unity regardless of how small Ω 0 / E F \\Omega_{0}/E_{F} is. This mechanism yields a sizable T c T_{c} , peaked near the onset of ferromagnetism.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Theory of magnon-mediated superconductivity in graphene-based moire systems.", "tags": ["graphene", "superconductivity", "magnon"], "image": "https://arxiv.org/html/2607.05754v1/x1.png", "briefing": {"background": "모아레 초격자 그래핀 시스템에서 발견된 초전도 현상은 강한 전자 상관관계와 자기적 질서의 상호작용이 핵심이며, 그 기원을 밝히는 것이 중요합니다.", "motivation": "자성 상태에 있는 시스템에서 스핀-요동(magnon)이 어떻게 초전도 쌍을 매개할 수 있는지 이론적으로 탐구하고자 했습니다.", "result": "강자성 상태에서 스핀-SU(2) 대칭성이 깨지는 작은 자기 이방성이 존재할 때, magnons이 equal-spin p-wave 초전도 쌍을 유도할 수 있음을 보였습니다.", "implication": "강자성 근처에서 나타나는 초전도 현상이 magnon 매개일 가능성을 제시하며, 이는 일반적인 포논 매개 초전도체와는 다른 새로운 물리적 경로를 의미합니다.", "novelty": "강자성 상전이 근처에서 magnon 매개 상호작용이 1차 수준으로 커진다는 점을 이론적으로 도출하였고, 모아레 시스템의 실험 결과와 연결했습니다.", "unresolved": "특정 물질에서의 정확한 TC 값 예측은 실제 전자 상관 강도와 이방성 파라미터의 정밀한 값에 의존하며, 실험적 정량 비교가 더 필요합니다.", "future_work": "비등방성(anisotropy)을 외부 자기장으로 제어하여 초전도 상태를 튜닝하는 실험이 필요합니다.", "concepts": [{"term": "Magnon-mediated pairing", "why_emerged": "일반적인 포논 모델로 설명되지 않는 자성 물질의 초전도 기전을 설명하기 위해 도입되었습니다.", "origin": "초기에는 강자성체에서의 초전도를 다루는 이론물리학자들에 의해 발전되었습니다.", "connections": "스핀 요동, p-wave 초전도체, 강상관 전자계."}, {"term": "Stoner transition", "why_emerged": "금속 내 전자의 상호작용으로 인해 강자성이 발생하는 조건을 설명하기 위해 제안되었습니다.", "origin": "에드먼드 스토너(Edmund Stoner)가 1938년에 제안했습니다.", "connections": "이동자 강자성, 페르미 액체 이론."}], "english_summary": ["Proposes magnon-mediated superconductivity in 2D itinerant ferromagnets.", "Shows that small easy-plane magnetic anisotropy enables equal-spin p-wave pairing.", "Pairing interaction is enhanced near the ferromagnetic transition point.", "Provides a theoretical framework for graphene-based moire superconductors."]}}, {"title": "Suppression of ferromagnetism in van der Waals insulator due to pressure-induced layer stacking variation", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2501.13446", "authors": "M. Misek, U. Dutta, P. Kral, D. Hovancik, J. Kastil, K. Pokhrel, et al.", "last_authors": "K. Carva, S. Kamba, V. Sechovsky, J. Pospisil", "summary": "Ferromagnetism in van der Waals insulators like CrBr3 is highly sensitive to structural modifications. We explore the pressure-driven structural and magnetic transformations of the van der Waals magnet CrBr3, establishing it as a model platform for phenomena emerging in layered vdW systems. Single-crystal X-ray diffraction revealed intrinsic trimorphism with two known phases (monoclinic and rhombohedral) and a so-far unreported trigonal phase. The paracrystal model well captures the coexistence of the rhombohedral and trigonal phases at ambient conditions. Increasing pressure drives the growth of the AA-stacked trigonal phase at the expense of the rhombohedral phase, which becomes undetectable above 8.4 GPa. Magnetization measurements provided the first direct evidence of a collapse of ferromagnetism above 5.8 GPa. This behavior is attributed to the increasing number of AFM-coupled Cr moments in AA stackings. Ab initio DFT calculations of electronic structure and atomistic simulations of finite-temperature magnetism corroborate the scenario.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Relevant study on vdW magnet magnetism and stacking sensitivity.", "tags": ["vanderWaals", "magnetism", "pressure"], "image": "https://arxiv.org/static/browse/0.3.4/images/arxiv-logo-fb.png", "briefing": {"background": "반데르발스(vdW) 자성체는 층간 적층 구조에 따라 자기적 상호작용이 민감하게 변하며, 이는 저차원 자성 시스템의 핵심 연구 주제입니다.", "motivation": "대표적인 vdW 강자성체인 CrBr3에서 압력에 의한 구조 변화(상전이)가 자기적 성질에 어떤 영향을 미치는지 규명하고자 했습니다.", "result": "압력 증가에 따라 기존의 능면체(rhombohedral) 구조에서 AA 적층 방식의 삼각(trigonal) 구조로 전이하며, 약 5.8 GPa 이상에서 강자성이 붕괴함을 확인했습니다.", "implication": "vdW 자성체에서 층간 적층의 대칭성이 자기적 교환 상호작용의 부호(FM vs AFM)를 결정하는 핵심 파라미터임을 입증했습니다.", "novelty": "기존에 보고되지 않은 삼각상(trigonal phase)을 발견하고, 구조 변화가 강자성 붕괴로 이어지는 미시적 메커니즘을 DFT와 실험으로 통합 분석했습니다.", "unresolved": "압력 하에서 발생하는 구조적 혼합상(paracrystal)이 자기적 불균일성에 미치는 세부적인 영향은 완전히 해소되지 않았습니다.", "future_work": "다른 vdW 자성체들에서도 유사한 적층 방식 변화에 따른 자기 상전이의 범용성을 확인하는 후속 연구가 필요합니다.", "concepts": [{"term": "반데르발스 강자성체", "why_emerged": "원자층 수준에서 자성을 제어하고 소자화하기 위해 필요.", "origin": "2017년 CrI3 및 Cr2Ge2Te6 발견 이후 본격화.", "connections": "2D 자성, 스핀트로닉스, 층간 교환 결합."}, {"term": "AA 적층(AA Stacking)", "why_emerged": "vdW 층간 정렬 상태를 구분하여 구조적 대칭성을 이해하기 위해 필요.", "origin": "결정학 분야에서 고전적으로 확립됨.", "connections": "Moiré 물리, 층간 반강자성 결합."}], "english_summary": ["CrBr3 exhibits structural trimorphism under pressure.", "Pressure induces a phase transition from rhombohedral to AA-stacked trigonal symmetry.", "Ferromagnetism collapses above 5.8 GPa due to increased AFM coupling in AA-stacking.", "Results are corroborated by X-ray diffraction and DFT calculations."]}}, {"title": "The topological Kondo model out of equilibrium (NBI QDEV)", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2307.03773", "authors": "Matteo M. Wauters, Chia-Min Chung, Lorenzo Maffi, Michele Burrello", "last_authors": "Lorenzo Maffi, Michele Burrello", "summary": "The topological Kondo effect is a genuine manifestation of the nonlocality of Majorana modes. We investigate its out-of-equilibrium signatures in a model with a Cooper-pair box hosting four of these topological modes, each connected to a metallic lead. Through an advanced matrix-product-state approach tailored to study the dynamics of superconductors, we simulate the relaxation of the Majorana magnetization, which allows us to determine the related Kondo temperature, and we analyze the onset of electric transport after a quantum quench of a lead voltage. Our results apply to Majorana Cooper-pair boxes fabricated in double nanowire devices and provide nonperturbative evidence of the crossover from weak-coupling states to the strongly correlated topological Kondo regime. The latter dominates at the superconductor charge degeneracy points and displays the expected universal fractional zero-bias conductance.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Relevant for Majorana physics and topological transport in devices.", "tags": ["Majorana", "topological", "Kondo"], "image": "https://arxiv.org/html/2307.03773v3/x1.png", "briefing": {"background": "마요라나(Majorana) 모드는 고체 물리학에서 위상 양자 컴퓨터 구현을 위한 비국소적 정보 저장 단위로 주목받고 있습니다.", "motivation": "초전도체와 금속 리드가 연결된 시스템에서 마요라나 모드에 의한 위상적 콘도 효과가 비평형 상태에서 어떻게 나타나는지 규명하고자 했습니다.", "result": "마요라나 쿠퍼 쌍 상자(Cooper-pair box) 모델에서 퀀텀 퀜치 후 나타나는 자화 완화 및 전기 전도 특성을 통해 강한 상관관계의 위상적 콘도 영역을 입증했습니다.", "implication": "마요라나 소자에서의 전송 특성이 위상적 콘도 물리학의 직접적인 증거가 될 수 있음을 보여주며, 이는 향후 위상 양자 소자 설계에 중요한 지표가 됩니다.", "novelty": "행렬 곱 상태(MPS) 기법을 사용하여 초전도체-리드 결합 시스템의 비평형 동역학을 비섭동적으로 시뮬레이션한 것이 핵심입니다.", "unresolved": "실제 실험적 나노와이어 소자에서 발생하는 노이즈와 무질서가 위상적 콘도 신호의 간섭에 미치는 영향은 여전히 숙제입니다.", "future_work": "이중 나노와이어 소자 내에서의 실험적 검증 및 퀜치 프로토콜을 이용한 위상 큐비트 상태 제어 연구가 기대됩니다.", "concepts": [{"term": "위상적 콘도 효과", "why_emerged": "마요라나 모드의 비국소적 성질이 스핀 콘도 효과와 유사한 방식으로 전송 특성에 영향을 줄 것으로 예측됨.", "origin": "Beri와 Cooper 등에 의해 제안.", "connections": "Majorana fermion, Kondo effect, 비국소적 양자 상관관 function render() {
  slideEl.replaceChildren();
  if (!slides.length) { slideEl.className = 'empty'; slideEl.textContent = 'No papers passed the filters in this run.'; counterEl.textContent = '0 / 0'; prevBtn.disabled = true; nextBtn.disabled = true; return; }
  slideEl.className = 'slide';
  const r = slides[index];
  const b = r.briefing || {};
  const head = document.createElement('div');
  head.className = 'paper-head';
  if (r.image) {
    const figure = document.createElement('figure');
    figure.className = 'figure';
    const img = document.createElement('img');
    img.src = r.image; img.alt = 'Figure or article preview image'; img.loading = 'lazy'; img.referrerPolicy = 'no-referrer'; img.onerror = () => figure.remove();
    figure.appendChild(img);
    figure.appendChild(textEl('figcaption', '', 'Figure / article preview image from the source page'));
    head.appendChild(figure);
  }
  const headText = document.createElement('div');
  headText.className = 'head-text';
  const badges = document.createElement('div');
  badges.className = 'badges';
  if (r.score) badges.appendChild(textEl('span', 'badge score', `${r.score}/10`));
  if (r.tier) badges.appendChild(textEl('span', 'badge', r.tier));
  if (r.journal) badges.appendChild(textEl('span', 'badge', r.journal));
  if (r.source) badges.appendChild(textEl('span', 'badge', r.source));
  headText.appendChild(badges);
  const title = document.createElement('h1');
  if (r.link) { const titleLink = document.createElement('a'); titleLink.href = r.link; titleLink.target = '_blank'; titleLink.rel = 'noopener noreferrer'; titleLink.textContent = r.title || ''; title.appendChild(titleLink); }
  else { title.textContent = r.title || ''; }
  headText.appendChild(title);
  headText.appendChild(textEl('p', 'meta', [r.journal, r.source].filter(Boolean).join(' | ')));
  if (r.last_authors || r.authors) { const authors = document.createElement('p'); authors.className = 'authors'; if (r.last_authors) authors.append('Last authors: ' + r.last_authors); if (r.authors) authors.append((r.last_authors ? ' | ' : '') + 'Authors: ' + r.authors); headText.appendChild(authors); }
  appendLabeledText(headText, 'why', 'Filter reason: ', r.reason);
  if (r.tags && r.tags.length) { const tags = document.createElement('div'); tags.className = 'tags'; r.tags.forEach(tag => tags.appendChild(textEl('span', 'tag', '#' + tag))); headText.appendChild(tags); }
  if (r.link) { const link = document.createElement('a'); link.className = 'link'; link.href = r.link; link.target = '_blank'; link.rel = 'noopener noreferrer'; link.textContent = 'Open paper'; headText.appendChild(link); }
  head.appendChild(headText);
  if (r.summary) { const abstract = document.createElement('p'); abstract.className = 'original-abstract'; const strong = textEl('strong', '', 'Original abstract'); abstract.appendChild(strong); abstract.append(r.summary); head.appendChild(abstract); }
  slideEl.appendChild(head);
  const briefing = document.createElement('div');
  briefing.className = 'briefing';
  appendBriefSection(briefing, 'Background', b.background);
  appendBriefSection(briefing, 'Motivation', b.motivation);
  appendBriefSection(briefing, 'Result', b.result);
  appendBriefSection(briefing, 'Implication', b.implication);
  appendBriefSection(briefing, "Why it's important / Novelty", b.novelty);
  appendBriefSection(briefing, 'Unresolved Questions', b.unresolved);
  appendBriefSection(briefing, 'Expected Future Work', b.future_work);
  if (b.concepts && b.concepts.length) {
    const section = document.createElement('section');
    section.className = 'brief-section wide';
    section.appendChild(textEl('h2', '', 'Concepts / Terms'));
    const concepts = document.createElement('div');
    concepts.className = 'concepts';
    b.concepts.forEach(c => {
      const item = document.createElement('div');
      item.className = 'concept';
      item.appendChild(textEl('h3', '', c.term || 'Concept'));
      [['왜 생겼나: ', c.why_emerged], ['누가 만들었나: ', c.origin], ['연결되는 흐름: ', c.connections]].forEach(([label, text]) => { if (!text) return; const p = document.createElement('p'); const bold = textEl('b', '', label); p.appendChild(bold); p.append(text); item.appendChild(p); });
      concepts.appendChild(item);
    });
    section.appendChild(concepts);
    briefing.appendChild(section);
  }
  if (b.english_summary && b.english_summary.length) { const section = document.createElement('section'); section.className = 'brief-section wide'; section.appendChild(textEl('h2', '', 'English Summary')); const ul = document.createElement('ul'); b.english_summary.slice(0, 5).forEach(line => ul.appendChild(textEl('li', '', line))); section.appendChild(ul); briefing.appendChild(section); }
  slideEl.appendChild(briefing);
  counterEl.textContent = `${index + 1} / ${slides.length}`;
  prevBtn.disabled = index === 0;
  nextBtn.disabled = index === slides.length - 1;
}
prevBtn.addEventListener('click', () => { index = Math.max(0, index - 1); render(); });
nextBtn.addEventListener('click', () => { index = Math.min(slides.length - 1, index + 1); render(); });
document.addEventListener('keydown', event => { if (event.key === 'ArrowLeft') prevBtn.click(); if (event.key === 'ArrowRight') nextBtn.click(); });
render();
</script>
</body>
</html>
