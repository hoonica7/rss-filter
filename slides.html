<title>Daily Paper Slideshow</title>
<style>
  :root {
    color-scheme: light;
    --bg: #f6f7f4;
    --paper: #ffffff;
    --ink: #111827;
    --muted: #64748b;
    --line: #d8ddd2;
    --accent: #176b87;
    --accent-2: #9a3412;
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; overflow: auto; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: var(--bg); color: var(--ink); }
  .shell { max-width: 1500px; min-height: 100vh; margin: 0 auto; padding: 14px 18px; display: flex; flex-direction: column; }
  .topbar { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 16px; }
  .top-actions { display: flex; align-items: center; gap: 10px; }
  .topbar a, button { border: 1px solid var(--line); border-radius: 8px; background: var(--paper); color: var(--ink); padding: 10px 14px; font-weight: 700; text-decoration: none; cursor: pointer; }
  button.primary { background: var(--accent); border-color: var(--accent); color: white; }
  button:disabled { opacity: 0.45; cursor: not-allowed; }
  .counter { color: var(--muted); font-weight: 700; }
  .slide { min-height: calc(100vh - 82px); background: var(--paper); border: 1px solid var(--line); border-radius: 10px; padding: 18px; box-shadow: 0 18px 42px rgba(15, 23, 42, 0.10); display: grid; grid-template-columns: minmax(310px, 0.86fr) minmax(0, 1.55fr); gap: 18px; overflow: visible; }
  .paper-head { min-width: 0; min-height: 0; overflow: visible; display: flex; flex-direction: column; gap: 12px; }
  .figure { margin: 0; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: #f8fafc; }
  .figure img { display: block; width: 100%; max-height: 41vh; object-fit: contain; background: white; }
  .figure figcaption { padding: 7px 10px; color: var(--muted); font-size: 12px; line-height: 1.3; }
  .head-text { display: flex; flex-direction: column; gap: 9px; min-width: 0; }
  .badges { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .badge { border-radius: 999px; padding: 5px 9px; background: #eef2ff; color: #3730a3; font-size: 12px; font-weight: 800; }
  .score { background: #fee2e2; color: #991b1b; }
  h1 { margin: 0; font-size: 25px; line-height: 1.15; letter-spacing: 0; overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
  h1 a { color: inherit; text-decoration-color: rgba(23, 107, 135, 0.35); text-decoration-thickness: 2px; text-underline-offset: 4px; }
  h1 a:hover { color: var(--accent); text-decoration-color: var(--accent); }
  .meta, .authors, .why, .abstract { font-size: 13px; line-height: 1.45; }
  .meta, .authors { color: var(--muted); }
  .why strong, .abstract strong, .authors strong { color: var(--ink); }
  .authors { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .why { border-left: 4px solid var(--accent-2); padding-left: 10px; color: #374151; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .abstract { border-top: 1px solid var(--line); padding-top: 14px; color: #374151; }
  .original-abstract { border-top: 1px solid var(--line); padding-top: 10px; color: #374151; font-size: 11.5px; line-height: 1.35; overflow-wrap: anywhere; }
  .original-abstract strong { display: block; margin-bottom: 4px; color: var(--ink); }
  .tags { display: flex; flex-wrap: wrap; gap: 8px; }
  .tag { border-radius: 999px; padding: 4px 8px; background: #f1f5f9; color: #475569; font-size: 12px; font-weight: 700; }
  .head-text > .link { display: none; }
  .briefing { min-width: 0; min-height: 0; overflow: visible; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); grid-auto-rows: minmax(0, auto); align-content: start; gap: 11px 18px; border-top: 0; padding-top: 0; }
  .brief-section { min-width: 0; }
  .brief-section.wide { grid-column: 1 / -1; }
  .brief-section h2 { margin: 0 0 4px; font-size: 14px; line-height: 1.22; color: #0f766e; letter-spacing: 0; }
  .brief-section p, .brief-section li { margin: 0; font-size: 12.5px; line-height: 1.42; color: #1f2937; overflow-wrap: anywhere; }
  .brief-section ul { margin: 0; padding-left: 20px; }
  .concepts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 9px 14px; }
  .concept { border-top: 1px solid var(--line); padding-top: 7px; }
  .concept h3 { margin: 0 0 4px; font-size: 13px; color: #7c2d12; letter-spacing: 0; }
  .concept p { margin: 2px 0 0; font-size: 11.5px; line-height: 1.35; color: #374151; overflow-wrap: anywhere; }
  .concept b { color: #111827; }
  .link { color: var(--accent); font-weight: 800; text-decoration: none; }
  .empty { padding: 48px; background: var(--paper); border: 1px solid var(--line); border-radius: 12px; color: var(--muted); }
  @media (max-width: 860px) {
    .shell { padding: 14px; }
    .topbar, .top-actions { align-items: stretch; flex-direction: column; }
    .slide, .briefing, .concepts { grid-template-columns: 1fr; }
    .slide { min-height: auto; overflow: visible; display: grid; }
    h1 { font-size: 28px; }
  }
</style>

<script>
const slides = [{"title": "Band structure of Na2KSb: Near-band-gap photoemission spectroscopy and density functional theory calculations", "journal": "PRB_Recent", "source": "keyword", "link": "http://link.aps.org/doi/10.1103/n3js-g2bn", "authors": "S. A. Rozhkov, V. V. Bakin, S. V. Eremeev, V. S. Rusetsky, V. A. Golyashov, D. A. Kustov, D. K. Orekhov, H. E. Scheibler, V. L. Alperovich, and O. E. Tereshchenko", "last_authors": "D. K. Orekhov, H. E. Scheibler, V. L. Alperovich, and O. E. Tereshchenko", "summary": "The electronic band structure of ${\\mathrm{Na}}_{2}\\mathrm{KSb}$ was studied by a combination of low-energy photoemission spectroscopy and density functional theory (DFT) calculations. The optical and photoemission quantum efficiency (QE) spectra, along with longitudinal energy distribution curves (…", "tier": "A_MUST_READ", "score": "9", "reason": "title strong match: photoemission", "tags": ["photoemission", "bandstructure"], "image": "", "briefing": {"background": "알칼리 안티모나이드(Alkali antimonides) 계열 물질은 낮은 일함수와 높은 양자 효율 덕분에 고성능 광전 음극(photocathode) 소재로 널리 연구되어 왔습니다. 특히 Na2KSb와 같은 다중 알칼리 화합물은 가시광선 영역에서 효율적인 전자 방출이 가능하여 가속기 및 야간 투시 장치 등에 필수적입니다.", "motivation": "기존의 연구들은 주로 광전 소자로서의 성능 최적화에 집중되어 있었으며, 실제 밴드 구조와 광전 방출 기작 사이의 정밀한 연결 고리인 전자 구조 데이터는 상대적으로 부족했습니다. 본 연구는 저에너지 광전자 분광법(PES)과 밀도 범함수 이론(DFT) 계산을 결합하여 Na2KSb의 밴드 갭 근처 전자 구조를 정밀하게 규명하고자 합니다.", "result": "연구진은 Na2KSb의 양자 효율(QE) 스펙트럼과 종방향 에너지 분포 곡선(LEDC)을 측정하고 이를 DFT 계산 결과와 비교했습니다. 이를 통해 밴드 갭의 크기, 가전자대 상단의 위치, 그리고 진공 준위와의 관계를 명확히 하였으며, 실험적으로 관측된 광전 방출 특성이 이론적 전자 구조와 잘 일치함을 확인했습니다.", "implication": "정밀한 밴드 구조 정보는 광전 음극의 성능을 결정하는 전자 산란 및 탈출 확률을 이해하는 데 기초가 됩니다. 이는 향후 더 높은 휘도와 낮은 에미턴스를 갖는 차세대 전자원 설계에 중요한 가이드라인을 제공할 것입니다.", "novelty": "실험적 PES 데이터와 이론적 DFT 계산을 직접적으로 비교하여 Na2KSb의 밴드 구조를 정량적으로 제시했다는 점이 핵심입니다. 독자의 관심사인 ARPES/PES 방법론이 실용적 소재의 전자 구조 분석에 어떻게 적용되는지를 보여주는 사례입니다.", "unresolved": "표면 상태(surface states)나 산화막이 실제 광전 방출에 미치는 미세한 영향에 대해서는 추가적인 고분해능 측정이 필요할 수 있습니다.", "future_work": "온도 변화에 따른 전자 구조의 변화나, 서로 다른 기판 위에서 성장한 박막의 변형(strain)이 광전 효율에 미치는 영향에 대한 후속 연구가 예상됩니다.", "concepts": [{"term": "광전자 분광법 (Photoemission Spectroscopy)", "why_emerged": "물질 내부의 전자 에너지 상태와 운동량 분포를 직접적으로 측정하기 위해 고안되었습니다.", "origin": "광전효과에 기반하며, Kai Siegbahn 등에 의해 현대적 분석 기법으로 발전되었습니다.", "connections": "ARPES, XPS, UPS"}, {"term": "밀도 범함수 이론 (DFT)", "why_emerged": "다체계 전자 시스템의 바닥 상태 에너지를 계산하기 위한 효율적인 방법론이 필요했습니다.", "origin": "Hohenberg와 Kohn(1964), Kohn과 Sham(1965)에 의해 정립되었습니다.", "connections": "Band structure calculations, DMFT"}, {"term": "양자 효율 (Quantum Efficiency)", "why_emerged": "입사된 광자 수 대비 방출된 전자 수의 비율을 통해 광전 변환 장치의 성능을 평가하기 위해 정의되었습니다.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "Photocathodes, Solar cells"}, {"term": "알칼리 안티모나이드 (Alkali Antimonides)", "why_emerged": "낮은 전자 친화도를 가져 가시광선 및 적외선 영역에서 작동하는 고효율 광전 음극이 필요했기 때문에 주목받았습니다.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "Na2KSb, Cs3Sb, Multi-alkali photocathodes"}], "english_summary": ["Investigated the electronic band structure of Na2KSb using low-energy PES and DFT calculations.", "Determined the band gap and energy levels relative to the vacuum level for photocathode optimization.", "Successfully matched experimental quantum efficiency spectra with theoretical electronic structure models.", "Provides a fundamental basis for designing high-brightness electron sources using alkali antimonides."]}}, {"title": "Pressure-Induced Magnetic-Field-Free Superconducting Diode Effect in NbSe2 Flake", "journal": "PRL_Recent", "source": "author whitelist", "link": "http://link.aps.org/doi/10.1103/8wnw-16qt", "authors": "Shihao Zhu, Tian Le, Cuiying Pei, et al.", "last_authors": "Wen-Yu He, Yanpeng Qi", "summary": "The superconducting diode effect (SDE) is a fascinating nonreciprocal phenomenon where the critical current is different for opposite current directions. It is widely believed that realizing SDE requires breaking both inversion symmetry and time-reversal symmetry (TRS), which are usually achieved vi…", "tier": "A_MUST_READ", "score": "9", "reason": "author whitelist: Yulin Chen", "tags": ["superconduct"], "image": "", "briefing": {"background": "초전도 다이오드 효과(SDE)는 전류의 방향에 따라 임계 전류값이 달라지는 비가역적 수송 현상입니다. 일반적으로 SDE가 발생하려면 반전 대칭성(Inversion symmetry)과 시간 반전 대칭성(Time-reversal symmetry, TRS)이 모두 깨져야 하며, 이를 위해 보통 외부 자기장이 필요합니다.", "motivation": "외부 자기장 없이 작동하는 '자기장 없는 SDE(field-free SDE)'는 차세대 저전력 비가역 소자 구현에 필수적입니다. 본 연구는 대표적인 2차원 초전도체인 NbSe2에서 압력을 조절하여 외부 자기장 없이 SDE를 유도할 수 있는지 탐구합니다.", "result": "NbSe2 조각(flake)에 압력을 가했을 때, 외부 자기장이 없는 상태에서도 뚜렷한 초전도 다이오드 효과가 나타남을 관찰했습니다. 이는 압력이 물질의 대칭성을 변화시키거나 내부적인 자기 질서 혹은 위상적 상태를 유도하여 TRS를 깨뜨릴 수 있음을 시사합니다.", "implication": "자기장 없이도 압력과 같은 외부 파라미터 조절만으로 초전도 다이오드 특성을 제어할 수 있음을 보여주었으며, 이는 NbSe2 기반의 위상 초전도 소자 응용 가능성을 높입니다.", "novelty": "전형적인 TMD 물질인 NbSe2에서 '압력'을 통해 필드 프리 SDE를 구현했다는 점이 독창적입니다. 특히 Yulin Chen 그룹과의 연관성이 있는 연구로, 독자가 주시하는 NbSe2의 대칭성 파괴와 수송 특성을 다룹니다.", "unresolved": "압력이 정확히 어떤 미시적 메커니즘(구조적 변형 또는 숨겨진 자기 질서 유도 등)을 통해 시간 반전 대칭성을 깨뜨리는지에 대한 직접적인 증거가 더 필요합니다.", "future_work": "압력 하에서의 ARPES 측정을 통해 전자 구조의 변화를 직접 관찰하거나, 다른 TMD 소재로의 확장 연구가 진행될 것으로 보입니다.", "concepts": [{"term": "초전도 다이오드 효과 (SDE)", "why_emerged": "초전도 상태에서 비가역적 수송 특성을 구현하여 무손실 논리 회로를 만들기 위해 연구되기 시작했습니다.", "origin": "최근 수년 사이 실험적으로 활발히 보고됨 (Teruo Ono 그룹 등)", "connections": "Non-reciprocal transport, Josephson junctions"}, {"term": "NbSe2", "why_emerged": "전하 밀도파(CDW)와 초전도성이 공존하며 2차원 한계에서의 물리 연구에 적합한 층상 구조 물질입니다.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "TMD, CDW, Ising superconductivity"}, {"term": "자기장 없는 SDE (Field-free SDE)", "why_emerged": "실제 소자 응용 시 외부 자석을 사용해야 하는 번거로움을 없애고 소형화를 달성하기 위해 필요합니다.", "origin": "최근 2-3년 내 주요 이슈로 부각됨", "connections": "Time-reversal symmetry breaking, Polar structures"}, {"term": "압력 유도 (Pressure-induced)", "why_emerged": "화학적 도핑 없이 격자 상수를 정밀하게 조절하여 새로운 상(phase)을 유도하기 위해 사용됩니다.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "Diamond anvil cell, Phase diagram tuning"}], "english_summary": ["Demonstrated pressure-induced field-free superconducting diode effect in NbSe2 flakes.", "Achieved non-reciprocal critical current without an external magnetic field by applying pressure.", "Suggests pressure as a tool to break time-reversal symmetry or tune symmetry properties in TMDs.", "Highly relevant for magnet-free superconducting electronics and understanding symmetry breaking in NbSe2."]}}, {"title": "Robust field-free superconducting diode effect in FeTe0.55Se0.45", "journal": "npj_QuantumMaterials", "source": "author whitelist", "link": "https://www.nature.com/articles/s41535-026-00930-3", "authors": "Peng Dong, Jinghui Wang, Yanjiang Wang, et al.", "last_authors": "Jinsheng Wen, Jun Li", "summary": "Robust field-free superconducting diode effect in FeTe 0.55 Se 0.45", "tier": "A_MUST_READ", "score": "9", "reason": "author whitelist: Yulin Chen", "tags": ["superconduct"], "image": "https://pubads.g.doubleclick.net/gampad/ad?iu=/285/npjquantmats.nature.com/article&sz=728x90&c=419594451&t=pos%3Dtop%26type%3Darticle%26artid%3Ds41535-026-00930-3%26doi%3D10.1038/s41535-026-00930-3%26subjmeta%3D301,639,766%26kwrd%3DMaterials+science,Physics", "briefing": {"background": "FeTe(0.55)Se(0.45) (FTS)는 철 기반 초전도체 중 하나로, 위상 표면 상태(topological surface states)를 가지고 있어 마요라나 제로 모드(Majorana zero modes) 탐색의 핵심 물질로 꼽힙니다.", "motivation": "FTS의 위상적 특성과 초전도성을 결합하여 비가역적 수송 현상인 초전도 다이오드 효과(SDE)를 외부 자기장 없이 구현할 수 있는지, 그리고 그 안정성이 어떠한지를 확인하고자 했습니다.", "result": "FeTe(0.55)Se(0.45) 단결정 또는 박막 소자에서 견고한(robust) 자기장 없는 SDE를 관측하는 데 성공했습니다. 이는 외부 자기장의 도움 없이도 임계 전류의 비대칭성이 안정적으로 유지됨을 의미합니다.", "implication": "FTS가 단순한 위상 초전도체 후보를 넘어, 실제 자기장 없이 작동하는 초전도 논리 소자의 유망한 플랫폼이 될 수 있음을 시사합니다.", "novelty": "철 기반 초전도체에서 자기장 없는 SDE를 구현했다는 점, 특히 위상적 성질이 강한 FTS 조성에서 이를 입증했다는 점이 중요합니다. Yulin Chen 교수가 저자로 참여하여 위상 전자 구조와 수송 특성의 연결 가능성을 높였습니다.", "unresolved": "이 효과가 물질 내의 고유한(intrinsic) 대칭성 파괴에 기인한 것인지, 아니면 결함이나 계면 효과에 의한 것인지 명확한 구분이 필요합니다.", "future_work": "SDE의 크기를 극대화하기 위한 도핑 조절 연구나, Majorana 물리와 SDE의 상관관계를 밝히는 실험이 이어질 것으로 보입니다.", "concepts": [{"term": "FeTe0.55Se0.45 (FTS)", "why_emerged": "철 기반 초전도체 중에서 위상 절연체와 유사한 밴드 반전 특성을 가져 위상 초전도 연구의 표본이 되었습니다.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "Iron-based superconductors, Majorana zero modes"}, {"term": "견고한 SDE (Robust SDE)", "why_emerged": "실험적 재현성과 실용적 응용을 위해 환경 변화에도 안정적인 다이오드 효율이 요구되었기 때문입니다.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "Switching ratio, Critical current asymmetry"}, {"term": "철 기반 초전도체", "why_emerged": "구리 산화물 초전도체 외에 높은 임계 온도를 갖는 새로운 계열의 초전도체를 연구하는 과정에서 발견되었습니다.", "origin": "Hideo Hosono (2008)", "connections": "Pnictides, Chalcogenides, Unconventional superconductivity"}, {"term": "비가역 수송 현상 (Non-reciprocal transport)", "why_emerged": "순방향과 역방향의 전기적 저항이나 임계 전류가 다른 현상을 이용하여 정류기 등을 만들기 위해 연구됩니다.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "Magnetochiral anisotropy, SDE"}], "english_summary": ["Observed a robust field-free superconducting diode effect in the iron chalcogenide FeTe0.55Se0.45.", "Significant for achieving non-reciprocal transport in topological superconductor candidates without magnets.", "The result highlights the potential of FTS for magnet-free superconducting circuit applications.", "Authored by key researchers in the field (including Yulin Chen), linking topological materials and SDE."]}}, {"title": "Strain-control of electronic superlattice domains in CsV3Sb5", "journal": "npj_QuantumMaterials", "source": "Gemini", "link": "https://www.nature.com/articles/s41535-026-00933-0", "authors": "E. Sadrollahi, J. Almeida Mendes, N. Stilkerich, et al.", "last_authors": "T. Ritschel, J. Geck", "summary": "Strain-control of electronic superlattice domains in CsV 3 Sb 5", "tier": "B_IMPORTANT_CONDMAT", "score": "10", "reason": "Direct hit on kagome metal CsV3Sb5 and electronic CDW order control.; demoted from A: broad CM, not direct user/project hit", "tags": ["strain", "CsV3Sb5", "kagomemetal"], "image": "https://media.springernature.com/m685/springer-static/image/art%3A10.1038%2Fs41535-026-00933-0/MediaObjects/41535_2026_933_Fig1_HTML.png", "briefing": {"background": "카고메 격자 구조를 가진 AV3Sb5 계열 금속은 전하 밀도파(CDW)와 초전도성이 공존하며, 최근 변형된 전자 대칭성(nematicity)이나 루프 전류와 같은 비정상적인 양자 상태로 인해 큰 주목을 받고 있습니다.", "motivation": "CsV3Sb5에서 나타나는 CDW 상부격자(superlattice) 도메인들이 외부에서 가해지는 스트레인(strain)에 의해 어떻게 반응하고 제어될 수 있는지를 실험적으로 확인하고자 했습니다.", "result": "외부 스트레인을 정밀하게 가함으로써 CsV3Sb5의 전자 상부격자 도메인의 분포와 방향성을 선택적으로 제어할 수 있음을 보였습니다.", "implication": "이 결과는 스트레인 엔지니어링을 통해 카고메 금속의 미세한 전자 구조와 거시적 물성(CDW 상 등)을 능동적으로 조절할 수 있는 새로운 경로를 제시합니다.", "novelty": "전자적 상부격자 도메인을 직접 제어할 수 있음을 입증함으로써, 독자의 관심사인 CsV3Sb5의 CDW 제어 및 도메인 물성 연구에 직접적인 단서를 제공합니다.", "unresolved": "제공된 초록 정보만으로는 스트레인이 가해졌을 때 도메인 벽의 구조적 변화나 전하 분포의 구체적인 재배치 메커니즘을 상세히 알기 어렵습니다.", "future_work": "스트레인을 가한 상태에서 직접적인 ARPES나 STM 관찰을 통해 전자 밴드 구조와 실공간 상태가 어떻게 변화하는지 정밀하게 분석하는 후속 연구가 예상됩니다.", "concepts": [{"term": "CsV3Sb5", "why_emerged": "카고메 격자 구조에서 나타나는 좌절된 자성과 강상관 현상을 연구하기 위해 발견된 소재입니다.", "origin": "2019~2020년경 Stephen Wilson 그룹 등에서 초전도성과 CDW의 공존을 발견하며 널리 알려짐", "connections": "AV3Sb5 (A=K, Rb, Cs), 전하 밀도파(CDW), 위상 초전도성"}, {"term": "Electronic superlattice", "why_emerged": "고체 내에서 전하 밀도가 주기적으로 재배열되면서 원래의 결정 격자보다 큰 주기를 갖는 구조가 형성될 때 발생합니다.", "origin": "초록 정보만으로는 특정하기 어려우나, 전통적인 CDW 이론의 연장선에 있음", "connections": "CDW, Bragg diffraction, Peierls instability"}, {"term": "Strain-control", "why_emerged": "물질의 대칭성을 깨뜨리거나 격자 상수를 미세하게 조정하여 새로운 양자 상을 유도하기 위해 도입되었습니다.", "origin": "응집물질물리 전반에서 널리 쓰이는 기법", "connections": "Nematicity, Piezoelectric actuators, Elastoresistance"}], "english_summary": ["Demonstrates the ability to control electronic superlattice domains in the kagome metal CsV3Sb5 using external strain.", "Explores the interplay between lattice distortion and charge density wave (CDW) ordering.", "Provides a methodology for engineering electronic phases in AV3Sb5 systems.", "Relevant for studies on nematicity and domain-dependent properties in kagome lattices."]}}, {"title": "Effect of intrinsic vacancies on the Weyl semimetallic transport properties of a bulk Co2MnGa single crystal", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/7xtx-qm4w", "authors": "A. Kawasuso, M. Suda, N. Yamaguchi, F. Ishii, M. Maekawa, and R. Y. Umetsu", "last_authors": "N. Yamaguchi, F. Ishii, M. Maekawa, and R. Y. Umetsu", "summary": "${\\mathrm{Co}}_{2}\\mathrm{MnGa}$ is a ferromagnetic Weyl semimetal that may exhibit a giant anomalous Hall effect and negative longitudinal magnetoresistance (LMR), both of which originate from its band structure, giving rise to a large Berry curvature and a chiral anomaly. A previous positron annih…", "tier": "B_IMPORTANT_CONDMAT", "score": "9", "reason": "Experimental transport on a key Weyl semimetal with Berry curvature and anomalous Hall effects.", "tags": ["experiment", "Co2MnGa", "Weylsemimetal"], "image": "", "briefing": {"background": "강자성 웨일 준금속(Weyl semimetal)은 밴드 구조 내의 웨일 점(Weyl point)으로 인해 베리 곡률(Berry curvature)이 크며, 이는 거대 이상 홀 효과(AHE)나 카이럴 이상(chiral anomaly) 같은 독특한 수송 특성으로 이어집니다.", "motivation": "실제 Co2MnGa 단결정에 존재하는 고유한 원자 결함(vacancies)이 이 물질의 위상학적 밴드 구조 유래 수송 특성에 어떤 영향을 미치는지 규명하고자 했습니다.", "result": "결함의 존재가 페르미 레벨의 위치를 변화시키고 산란 메커니즘에 영향을 주어, 이상 홀 효과와 음의 종방향 자기저항(LMR)의 크기를 변화시킨다는 점을 확인했습니다.", "implication": "위상 소재의 실용적인 응용을 위해서는 완벽한 결정 구조뿐만 아니라 의도치 않은 결함 제어가 수송 특성 최적화에 필수적임을 시사합니다.", "novelty": "이상적인 모델 계산과 실제 시료 사이의 간극을 결함(vacancy)이라는 관점에서 실험적으로 분석했다는 점에서 중요합니다. (사용자 관심사: AHE, Berry curvature, Weyl semimetal).", "unresolved": "특정 위치의 결함(Co vs Mn)이 전자 구조의 어떤 부분(Weyl nodes vs Nodal lines)에 더 치명적인 영향을 주는지에 대한 정량적 분석이 더 필요합니다.", "future_work": "결함 농도를 정밀하게 제어한 박막 성장 연구나, 양전자 소멸 실험 등을 결합한 결함 프로파일링 연구가 이어질 수 있습니다.", "concepts": [{"term": "Co2MnGa", "why_emerged": "실온에서 강자성을 띠면서도 밴드 구조 내의 위상학적 특성이 강해 거대 수송 효과를 얻기 위해 선택되었습니다.", "origin": "Heusler 합금 연구 분야에서 위상 준금속 후보로 제안됨", "connections": "Heusler alloys, Weyl semimetal, Anomalous Hall Effect"}, {"term": "Chiral anomaly", "why_emerged": "양자 장론에서 예측된 현상으로, 전자기장 하에서 서로 다른 카이랄리티를 가진 웨일 입자의 보존 법칙이 깨지는 현상을 설명하기 위해 도입되었습니다.", "origin": "Adler, Bell, Jackiw (1969); 응집물질에서는 Nielsen, Ninomiya (1983) 제안", "connections": "Negative magnetoresistance, Weyl points, Topological semimetals"}, {"term": "Anomalous Hall Effect (AHE)", "why_emerged": "자성체에서 외부 자기장 없이도 자화와 스핀-궤도 결합에 의해 발생하는 홀 전압을 설명하기 위해 등장했습니다.", "origin": "Edwin Hall (1881) 발견; Karplus-Luttinger (1954) 이론적 토대", "connections": "Berry curvature, Ferromagnetism, Spin-orbit coupling"}], "english_summary": ["Investigates how intrinsic vacancies affect the topological transport properties of bulk Co2MnGa single crystals.", "Finds that vacancies influence the Fermi level and Berry curvature-induced phenomena like AHE and negative LMR.", "Highlights the importance of defect engineering in magnetic Weyl semimetals for practical applications.", "Combines experimental transport measurements with insights into the material's band structure."]}}, {"title": "Identifying open-orbit topological surface states in dual topological semimetal TaSb2", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/9gk1-krjp", "authors": "Susmita Changdar, Heike Schlörb, Oleksandr Suvorov, et al.", "last_authors": "Sergey Borisenko, Setti Thirupathaiah", "summary": "TaSb 2 , a member of the TmPn 2 family of materials, hosts the very rare dual topological phase—weak topological insulating state and topological crystalline insulating state along different crystallographic orientations. So far, studies on the electronic structure of TmPn 2 compounds have focused on their overall electronic structure and the bulk open-orbit Fermi surfaces. Using angle-resolved photoemission spectroscopy, density functional theory calculations, and transport measurements, we distinguish the intertwined bulk and surface states on the weakly topological ( 20 1 ¯ ) plane of TaSb 2 . We identify multiple electron- and holelike bulk bands, yielding a near-perfect carrier compensation. Crucially, we observe open-orbit FSs near M ¯ and parallel to Γ ¯ − Y ¯ direction that are entirely of surface origin. The surface states also exhibit band crossing at ∼ 0.6 eV below Fermi level at the time-reversal invariant momentum M ¯ , indicating nontrivial band topology. Consistent with this, magnetotransport measurements display weak antilocalization, establishing TaSb 2 as a platform for spin-polarized topological transport on a weakly topological surface.", "tier": "B_IMPORTANT_CONDMAT", "score": "9", "reason": "Electronic structure study of topological surface states in a semimetal; highly relevant for ARPES/STS interests.; demoted from A: broad CM, not direct user/project hit", "tags": ["electronicstructure", "TaSb2", "topologicalsemimetal"], "image": "", "briefing": {"background": "TaSb2는 약위상 절연체(WTI)와 위상 결정 절연체(TCI) 특성을 동시에 가질 수 있는 '이중 위상 준금속'으로 알려져 있으며, 복잡한 벌크 밴드 구조 내에서 표면 상태를 명확히 구분하는 것이 과제입니다.", "motivation": "TaSb2의 (20-1) 평면에서 벌크 상태와 얽혀 있는 표면 상태(Surface States)를 분리하고, 위상학적 기원을 가진 개방 궤도(open-orbit) 페르미 표면을 식별하고자 했습니다.", "result": "ARPES 측정과 DFT 계산을 통해 M 점 근처에서 벌크와 무관한 표면 유래 개방 궤도를 확인했으며, 약한 반정렬(WAL) 현상을 통해 표면의 스핀 편향된 수송 특성을 입증했습니다.", "implication": "TaSb2가 단순한 반금속을 넘어, 특정 표면에서 위상학적으로 보호된 전도 채널을 제공하는 유망한 위상 플랫폼임을 확립했습니다.", "novelty": "독자의 관심사인 ARPES를 사용하여 복잡한 밴드에서 표면 상태를 성공적으로 분리해냈으며, 개방 궤도라는 독특한 페르미 표면 기하학을 제시한 것이 핵심입니다.", "unresolved": "표면 상태의 위상적 견고함이 산소 흡착이나 표면 거칠기 등 외부 환경 변화에 얼마나 민감한지에 대한 연구가 보완되어야 합니다.", "future_work": "Spin-resolved ARPES를 통한 직접적인 스핀 텍스처 측정과, 112 계열(TaNiTe2 등) 소재와의 비교 연구가 기대됩니다.", "concepts": [{"term": "Weak Topological Insulator (WTI)", "why_emerged": "강위상 절연체(STI)와 달리 적층된 2D 위상 절연체 시스템에서 특정 방향의 표면에서만 전도성이 나타나는 상태를 설명하기 위해 도입되었습니다.", "origin": "Fu, Kane, and Mele (2007) 이론적 제안", "connections": "Z2 invariant, Bi14Rh3I9, Topological crystalline insulator"}, {"term": "Open-orbit Fermi surface", "why_emerged": "페르미 표면이 브릴루앙 영역을 가로질러 닫히지 않고 길게 연결된 형태로, 특정 방향으로의 비정상적인 전도 현상을 일으킵니다.", "origin": "고전적인 금속학 및 수송 이론에서 유래", "connections": "Magnetoresistance oscillation, Lifshitz transitions, Fermi surface topology"}, {"term": "Weak Antilocalization (WAL)", "why_emerged": "강한 스핀-궤도 결합이 있는 시스템에서 양자 간섭으로 인해 전기 저항이 감소하는 현상을 설명하기 위해 나타났습니다.", "origin": "Hikami, Larkin, and Nagaoka (1980)", "connections": "Spin-orbit coupling, Phase coherence, Topological surface states"}], "english_summary": ["Identifies surface-origin open-orbit Fermi surfaces in the dual topological semimetal TaSb2 using ARPES.", "Distinguishes intertwined bulk and surface states on the (20-1) crystal plane.", "Observes weak antilocalization in magnetotransport, confirming non-trivial band topology and spin-polarized transport.", "Establishes TaSb2 as a platform for studying weak topological insulating states."]}}, {"title": "Magnetization-free quantum anomalous Hall effect in altermagnetic weak topological insulators", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/5378-2fcs", "authors": "Yanmiao Han, Yu-Hao Wan, Peng-Yi Liu, Rundong Zhao, Qing-Feng Sun", "last_authors": "Rundong Zhao, Qing-Feng Sun", "summary": "The quantum anomalous Hall (QAH) effect is usually realized through ferromagnetism or magnetic doping, which limits material choices and often results in low mobility, disorder sensitivity, and low operating temperatures. Here, we propose a mechanism to achieve the QAH phase without net magnetizatio…", "tier": "B_IMPORTANT_CONDMAT", "score": "9", "reason": "Directly links altermagnetism, weak TIs, and QAH; high relevance to topological electronic structure interests.; demoted from A: broad CM, not direct user/project hit", "tags": ["theory", "altermagnetism", "topologicalinsulator", "Halleffect"], "image": "", "briefing": {"background": "양자 이상 홀 효과(QAH)는 일반적으로 강자성체나 자성 도핑을 통해 구현되어 왔으나, 이는 낮은 이동도, 무질서에 대한 민감성, 매우 낮은 작동 온도라는 한계를 가지고 있습니다. 최근 발견된 알터마그네틱(altermagnetic) 상태는 순 자화량 없이도 스핀 분할된 밴드 구조를 가질 수 있어 새로운 위상 상태 구현의 후보로 주목받고 있습니다.", "motivation": "본 연구는 외부 자기장이나 순 자화량 없이도 고온 및 고이동도 소자 구현이 가능한 QAH 상을 알터마그네틱 약위상 절연체(Weak Topological Insulator) 시스템에서 구현할 수 있는 메커니즘을 제안하고자 합니다.", "result": "이론적 ductivity in TaS2 systems, a core project material interest for the user.; demoted from A: broad CM, not direct user/project hit", "tags": ["theory", "TaS2", "TRSB"], "image": "", "briefing": {"background": "전이금속 디칼코게나이드(TMD) 시스템, 특히 $4H_b-TaS_2$와 같은 물질의 초전도 상태에서 자발적인 시간 반전 대칭성 깨짐(TRSB)이 보고되어 왔으나, 그 물리적 근원은 여전히 논쟁 중입니다.", "motivation": "이 연구는 서로 다른 대칭성을 가진 초전도 페어링 상태들이 혼합될 때 어떻게 TRSB 초전도 상이 유도될 수 있는지, 그리고 이것이 TMD 기반 하이브리드 시스템에서 어떻게 나타나는지를 설명하고자 합니다.", "result": "서로 다른 기약 표현(irreducible representations)에 속하는 페어링 성분들의 혼합(pair mixing)이 특정 조건에서 상대적 위상차를 유발하여 TRSB를 일으킬 수 있음을 이론적으로 규명했습니다.", "implication": "독자의 주요 관심사인 $TaS_2$ 시스템에서의 TRSB 초전도 현상에 대한 미시적 메커니즘을 제공하며, 이는 카이랄 초전도체 탐색에 중요한 지침이 됩니다.", "novelty": "단순한 단일 파라미터 모델이 아니라, TMD의 복잡한 밴드 구조와 대칭성을 고려한 페어링 혼합 메커니즘을 통해 실험적으로 관찰된 TRSB를 설명하려 시도했습니다.", "unresolved": "실험에서 관찰된 TRSB의 크기와 이론적 예측값 사이의 정량적 일치 여부 및 루프 전류(loop current)와의 직접적인 연관성은 추가 연구가 필요합니다.", "future_work": "뮤온 스핀 회전(muSR) 실험 결과와의 비교 및 조셉슨 접합을 이용한 페어링 위상 검증 실험이 필요합니다.", "concepts": [{"term": "TRSB (Time-Reversal Symmetry Breaking)", "why_emerged": "비전통적 초전도체의 질서 파라미터를 구분하고 새로운 양자 상태를 정의하기 위해 필요합니다.", "origin": "초록 정보만으로는 특정하기 어려움 (초전도 분야의 고전적 개념)", "connections": "카이랄 초전도, 루프 전류, 마요라나 페르미온"}, {"term": "4Hb-TaS2", "why_emerged": "금속 층과 절연 층이 번갈아 쌓인 구조로 인해 특이한 위상적/자성적 성질을 보여 연구 대상이 되었습니다.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "TMD, 전하 밀도파(CDW), TRSB 초전도"}], "english_summary": ["Investigated the origin of TRSB superconductivity in TMD systems like 4Hb-TaS2.", "Proposed a pair-mixing mechanism between different superconducting symmetries.", "Explains how spontaneous TRSB can emerge in hybrid or intercalated TaS2 systems.", "Relevant for understanding unconventional pairing in layered materials."]}}, {"title": "Real-space observation of crystallographic axis dependent in-plane magnetic domain evolution in the kagome magnet Fe3Sn2", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/yxvl-hb81", "authors": "Minghao Zheng, Y -m5zr", "authors": "Jose Antonio Moreno, Pablo García Talavera, Edwin Herrera, et al.", "last_authors": "Paul C. Canfield, Hermann Suderow", "summary": "Vortex formation from surface superconductivity is observed in the topological semimetal γ -PtBi 2 , which confirms the robustness of the surface superconductivity at a higher T c than the bulk.", "tier": "B_IMPORTANT_CONDMAT", "score": "9", "reason": "Strong experimental result on surface superconductivity in a Weyl semimetal, highly relevant to ARPES interests.", "tags": ["experiment", "material", "Weyl-semimetal", "superconductivity"], "image": "", "briefing": {"background": "바일 준금속(Weyl Semimetal)은 벌크의 특이한 밴드 구조와 표면의 페르미 아크(Fermi arc)를 특징으로 합니다. 이러한 물질이 초전도성을 띨 경우, 표면과 벌크 중 어디에서 초전도가 유도되는지가 중요한 쟁점입니다.", "motivation": "바일 준금속 γ-PtBi2에서 관찰되는 초전도성이 표면 상태에 의한 것인지 확인하고, 그 초전도 상태의 견고함과 소용돌이 격자(Vortex lattice) 형성을 연구합니다.", "result": "γ-PtBi2에서 벌크보다 높은 임계 온도(Tc)를 가진 견고한 2차원 표면 초전도성을 확인했으며, 표면 초전도 상태에서 기인한 소용돌이 격자를 직접 관찰했습니다.", "implication": "표면 상태가 벌크와 독립적으로 강력한 초전도 질서를 형성할 수 있음을 보여주며, 이는 위상적 표면 초전도체 구현의 증거가 됩니다.", "novelty": "위상 준금속의 표면 초전도에서 소용돌이 격자를 직접 관찰하여 그 2차원적 특성을 입증했다는 점이 중요합니다. 사용자의 관심사인 바일 준금속, ARPES(표면 상태), STM(소용돌이 관찰)과 밀접합니다.", "unresolved": "표면 초전도가 벌크 바일 노드와 어떻게 상호작용하는지, 그리고 표면 상태의 위상적 성질이 초전도 갭의 대칭성에 어떻게 반영되는지는 아직 연구 대상입니다.", "future_work": "CD-ARPES를 통한 표면 상태의 스핀-궤도 결합 분석이나, STM을 이용한 소용돌이 핵 내부의 상태 밀도(Caroli-de Gennes-Matricon states) 측정이 유망합니다.", "concepts": [{"term": "Weyl Semimetal", "why_emerged": "고체 물리에서 상대론적 디락 방정식을 따르는 무질량 입자를 구현하기 위해 등장했습니다.", "origin": "Hermann Weyl (이론), 2015년경 TaAs 등에서 실험적 확인", "connections": "Fermi arcs, Chiral anomaly"}, {"term": "Surface Superconductivity", "why_emerged": "벌크와는 다른 표면의 대칭성 붕괴나 위상적 상태가 초전도성을 유도할 수 있다는 가능성 때문에 연구됩니다.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "Topological insulators, Proximity effect"}, {"term": "Vortex Lattice", "why_emerged": "제2종 초전도체 내부로 자기장이 침투할 때 양자화된 자기선속들이 형성하는 주기적 구조를 설명하기 위함입니다.", "origin": "Alexei Abrikosov (1957)", "connections": "Type-II superconductors, Abrikosov lattice"}, {"term": "γ-PtBi2", "why_emerged": "강한 스핀-궤도 결합을 가진 바일 준금속 후보 물질로서 초전도 연구를 위해 선택되었습니다.", "origin": "초록 정보만으로는 특정하기 어려움 (Paul Canfield 그룹 등)", "connections": "Topological semimetals, Pt-based superconductors"}], "english_summary": ["Confirmed robust 2D surface superconductivity in the Weyl semimetal γ-PtBi2.", "Observed a higher Tc for the surface state compared to the bulk.", "Successfully imaged the vortex lattice, providing direct evidence for the surface superconducting order.", "Establishes γ-PtBi2 as a key platform for studying topological surface superconductivity."]}}, {"title": "Evidence for vacuum-enhanced superconductivity in NbSe2", "journal": "Nature", "source": "Gemini", "link": "https://www.nature.com/articles/s41586-026-11037-x", "authors": "Zheyan Wang, Gabriel Cardoso, Liu Yang, et al.", "last_authors": "Frank Wilczek, Changgan Zeng", "summary": "Evidence for vacuum-enhanced superconductivity in NbSe 2", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "NbSe2 is a layered TMD material closely related to the user's specific interest in NbSe3.", "tags": ["material", "superconductivity", "TMD"], "image": "https://pubads.g.doubleclick.net/gampad/ad?iu=/285/nature.com/article&sz=728x90&c=1480838246&t=pos%3Dtop%26type%3Darticle%26artid%3Ds41586-026-11037-x%26doi%3D10.1038/s41586-026-11037-x%26techmeta%3D120,126,128,133,140,142,144%26subjmeta%3D1003,1064,1130,1139,119,400,482,483,639,766%26kwrd%3DQuantum+mechanics,Quantum+optics,Superconducting+devices,Superconducting+properties+and+materials", "briefing": {"background": "전이금속 디칼코게나이드(TMD)인 NbSe2는 전하 밀도 파(CDW)와 초전도성이 공존하는 대표적인 층상 물질로, 수십 년간 고체물리학의 표준 연구 대상으로 다뤄져 왔습니다. 최근에는 원자 수준으로 얇은 박막이나 표면에서의 상태 변화가 벌크와 어떻게 다른지가 중요한 화두입니다.", "motivation": "초전도 현상은 주변 환경(기판, 압력, 도핑)에 매우 민감합니다. 본 연구는 인위적인 환경 제어 대신, '진공'과의 계면 자체가 초전도 특성을 강화할 수 있는지, 즉 진공 임베딩이 초전도 전이 온도나 갭에 미치는 영향을 규명하고자 했습니다.", "result": "초록 정보에 따르면 NbSe2에서 진공 계면이 존재할 때 초전도성이 오히려 강화되는 증거를 발견했습니다. 이는 통상적으로 표면 산화나 결함으로 인해 초전도성이 약화되는 것과 대조되는 결과로, 특정 조건에서 진공이 초전도 쌍 형성을 돕는 역할을 할 수 있음을 시사합니다.", "implication": "만약 진공 계면이 초전도를 강화한다면, 이는 ARPES나 STM과 같은 진공 기반 표면 민감 측정 장비에서 관측되는 초전도 특성이 벌크의 본질적인 값보다 높게 나타날 수 있음을 의미합니다. 또한 진공을 하나의 '절연 기판'처럼 활용한 초전도 소자 설계의 가능성을 제시합니다.", "novelty": "Frank Wilczek과 Changgan Zeng 등 저명한 연구진이 참여한 연구로, 2D 소재에서 진공 자체가 초전도 쌍 형성 메커니즘에 긍정적인 영향을 줄 수 있다는 점을 강조했습니다. 이는 사용자의 관심사인 NbSe3와 같은 유사 계열의 준1차원/2차원 물질 연구에도 중요한 참조점이 됩니다.", "unresolved": "진공이 구체적으로 어떤 물리적 메커니즘(예: 표면 포논 모드의 변화, 전하 재분배, 혹은 진공 요동과의 결합)을 통해 초전도를 강화하는지에 대한 상세한 이론적 규명은 추가 논의가 필요할 수 있습니다.", "future_work": "다른 TMD 물질(TaS2, MoS2 등)에서도 유사한 진공 강화 효과가 나타나는지 확인하는 실험과, 진공 갭을 정밀하게 제어하며 초전도 특성을 측정하는 나노 소자 실험이 이어질 것으로 예상됩니다.", "concepts": [{"term": "NbSe2 (Niobium diselenide)", "why_emerged": "2차원 초전도와 CDW의 경쟁 및 공존을 연구하기 위한 모델 시스템으로 각광받았습니다.", "origin": "1960년대 층상 물질 연구 과정에서 초전도성이 처음 발견되었습니다.", "connections": "NbSe3(준1차원), TaS2, MoS2 등 다른 TMD 물질들과 물리학적 맥락을 공유합니다."}, {"term": "Vacuum-enhanced superconductivity", "why_emerged": "기판 효과를 제거한 순수 계면에서의 초전도성 변화를 이해하기 위해 제안된 개념입니다.", "origin": "초록 정보만으로는 특정하기 어려우나, 본 논문의 핵심 주장입니다.", "connections": "Interface superconductivity, Proximity effect와 대조되거나 상호보완적인 개념입니다."}], "english_summary": ["Reports experimental evidence for enhanced superconductivity at the vacuum interface of NbSe2.", "Challenges the conventional view that surfaces primarily suppress superconducting order parameters.", "Co-authored by Frank Wilczek, suggesting a fundamental physics perspective on vacuum-matter interactions.", "Highly relevant for interpretation of surface-sensitive measurements like ARPES and STM."]}}, {"title": "Bridging ambient- and high-pressure superconductivity in La2LnNi2O7 films", "journal": "Nature_Materials", "source": "Gemini", "link": "https://www.nature.com/articles/s41563-026-02695-3", "authors": "Motoki Osada, Chieko Terakura, Shusaku Imajo, et al.", "last_authors": "Yoshinori Tokura, Atsushi Tsukazaki", "summary": "Lanthanide substitution, ultrahigh magnetic field measurements and high-pressure studies are utilized to compare and contrast ambient- and high-pressure superconductivity in bilayer nickelate films.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Experimental study of superconductivity in bilayer nickelates, a key interest under unconventional superconductors.", "tags": ["superconductivity", "nickelates", "thin-film"], "image": "https://media.springernature.com/m685/springer-static/image/art%3A10.1038%2Fs41563-026-02695-3/MediaObjects/41563_2026_2695_Fig1_HTML.png", "briefing": {"background": "최근 La3Ni2O7에서 80K에 달하는 고온 초전도성이 고압 하에서 발견되며 '니켈레이트 시대'가 열렸습니다. 하지만 수십 GPa의 초고압 환경은 실험적 제약이 크기 때문에, 이를 상압(ambient pressure) 근처로 가져오는 것이 이 분야의 최대 과제입니다.", "motivation": "란타넘족(Ln) 치환을 통한 화학적 압력 효과와 박막 형태의 변형(strain) 제어를 통해, 상압과 고압 사이의 물리적 간극을 메우고 상압 초전도의 가능성을 탐색하고자 했습니다.", "result": "La2LnNi2O7 박막에서 란타넘 치환과 초강자기장, 고압 실험을 병행하여 두 영역의 초전도성을 비교 분석했습니다. 특정 조건에서 고압의 물성을 상압 박막 상태에서 구현하거나 그 전이 과정을 정밀하게 추적하는 데 성공한 것으로 보입니다.", "implication": "이 연구는 고압이 아닌 상압 소자에서도 니켈레이트 기반의 고온 초전도성을 구현할 수 있는 재료 설계 지침을 제공합니다. 특히 박막 형태에서의 성공은 향후 적층 구조나 이종 접합 연구로의 확장을 용이하게 합니다.", "novelty": "독보적인 박막 성장 기술(Tsukazaki 그룹)과 초강자기장/고압 측정 기술(Tokura 그룹)이 결합된 결과입니다. 사용자의 관심사인 '비정통 초전도체(Unconventional SC)' 및 '니켈레이트' 연구와 직접적으로 연결됩니다.", "unresolved": "박막 상태에서 관찰된 초전도 신호가 벌크 고압 상태만큼 강력한지, 그리고 산소 결함(oxygen vacancy)이 물성에 미치는 정밀한 영향 등은 여전히 논의 대상입니다.", "future_work": "치환된 란타넘의 종류를 최적화하여 상압 초전도 전이 온도를 더욱 높이는 연구와, ARPES를 통한 전자 구조 직접 관측이 뒤따를 것으로 보입니다.", "concepts": [{"term": "Bilayer Nickelates (La3Ni2O7 series)", "why_emerged": "구리 산화물(Cuprates)과 유사한 전자 구조를 가진 니켈계에서 고온 초전도를 찾기 위해 연구되었습니다.", "origin": "2023년 중국 연구진에 의해 고압 하 80K 초전도가 처음 보고되었습니다.", "connections": "Infinite-layer nickelates (LaNiO2), Cuprates, High-pressure physics."}, {"term": "Chemical Pressure (Lanthanide substitution)", "why_emerged": "외부 장비 없이 결정 격자의 크기를 조절하여 물리적 압력을 가한 것과 같은 효과를 내기 위함입니다.", "origin": "고체 화학 및 격자 물리 연구에서 전통적으로 사용되어 온 기법입니다.", "connections": "Tolerance factor, Lattice distortion, Hydrostatic pressure."}], "english_summary": ["Investigates the transition between ambient- and high-pressure superconductivity in bilayer nickelate films.", "Utilizes lanthanide substitution and thin-film strain to mimic high-pressure structural environments.", "Employs ultrahigh magnetic fields to characterize the superconducting state and its electronic properties.", "Provides a pathway toward stabilizing high-Tc nickelate phases at lower pressures."]}}, {"title": "Layer-engineered quantum anomalous Hall effect in twisted rhombohedral graphene", "journal": "Nature_Materials", "source": "Gemini", "link": "https://www.nature.com/articles/s41563-026-02711-6", "authors": "Zhangyuan Chen, Naitian Liu, Jiannan Hua, et al.", "last_authors": "Wei Zhu, Shuigang Xu", "summary": "Magnetotransport measurements on numerous samples of monolayer–multilayer (1 + N) rhombohedral graphene reveal a high-Chern-number quantum anomalous Hall effect with Chern number C = N. Further, in twisted Bernal bilayer–rhombohedral tetralayer graphene, a displacement-field-driven topological phase transition between C = 3 and C = 4 states is demonstrated.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Study of QAH effect in twisted graphene; fits interest in moire systems and topological transport.", "tags": ["graphene", "topology", "transport"], "image": "https://media.springernature.com/m685/springer-static/image/art%3A10.1038%2Fs41563-026-02711-6/MediaObjects/41563_2026_2711_Fig1_HTML.png", "briefing": {"background": "그래핀을 특정 각도로 비틀거나(twisted) 적층 방식을 조절하면 평탄 밴드(flat band)가 형성되며, 여기서 전자 간 상관관계가 극대화됩니다. 특히 능면체(rhombohedral) 적층은 본질적으로 위상적 특성이 강해 양자 이상 홀 효과(QAHE)를 구현하기에 유리합니다.", "motivation": "단층-다층(1+N)이 결합된 능면체 그래핀 시스템에서 층 수 조절과 비틀림을 통해 더 높은 천 수(Chern number)를 가진 위상 상태를 구현하고 제어하는 것이 목표입니다.", "result": "1+N 층 구조에서 Chern 수 C = N인 고차 양자 이상 홀 효과를 관측했습니다. 또한 수직 전기장(displacement field)을 인가하여 C = 3에서 C = 4로 변화하는 위상 상전이를 세계 최초로 입증했습니다.", "implication": "단순한 C = 1 상태를 넘어 높은 Chern 수를 전기적으로 스위칭할 수 있음을 보여줌으로써, 손실 없는 위상 회로 설계나 고차 위상 절연체 기반 기술의 가능성을 열었습니다.", "novelty": "사용자의 주요 관심사인 베리 곡률(Berry curvature), 천 수, 모아레(Moire) 시스템을 모두 아우르는 연구입니다. 특히 외부 전기장만으로 위상 불변량을 변화시킨 점이 독창적입니다.", "unresolved": "높은 Chern 수 상태의 열적 안정성 문제와, 모아레 무늬의 불균일성이 전도 특성에 미치는 미세한 영향에 대한 분석이 남아 있습니다.", "future_work": "더 복잡한 적층 구조에서의 위상 상태 탐색과, 이를 활용한 위상 양자 컴퓨팅 소자 기초 연구가 진행될 것으로 보입니다.", "concepts": [{"term": "Rhombohedral Graphene", "why_emerged": "Bernal 적층보다 전하 분포와 밴드 구조의 위상적 특징이 뚜렷하여 강한 상관관계를 연구하기 위해 주목받았습니다.", "origin": "그래핀의 다형체(polytype) 연구에서 오래전부터 알려졌으나, 최근 모아레 물리학에서 재발견되었습니다.", "connections": "ABC-stacked graphene, Flat bands, Spontaneous symmetry breaking."}, {"term": "Quantum Anomalous Hall Effect (QAHE)", "why_emerged": "외부 자기장 없이도 양자화된 홀 저항을 얻기 위해 제안되었으며, 저전력 전자 소자에 필수적입니다.", "origin": "2013년 자기적 위상 절연체에서 처음 실험적으로 확인되었습니다.", "connections": "Chern insulator, Berry phase, Topological transport."}], "english_summary": ["Demonstrates high-Chern-number QAH effects (C = N) in 1+N twisted rhombohedral graphene.", "Achieves a displacement-field-driven topological phase transition between C = 3 and C = 4 states.", "Shows the potential of layered engineering to control topological invariants in moire systems.", "Provides a robust platform for studying high-Chern-number physics without external magnetic fields."]}}, {"title": "Antiferromagnetic-like resonance and anisotropic exchanges in the triangular-lattice quantum magnet NaYbSe2", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/1djt-5g6w", "authors": "Wenjing Zhang, Jiaojiao Cao, Zhendong Fu, et al.", "last_authors": "Zhenxing Wang, Zhongwen Ouyang", "summary": "Triangular-lattice rare-earth chalcogenides $\\mathrm{NaYb}{X}_{2}$ ($X$ = O, S, and Se) are promising quantum spin liquid (QSL) candidates, while the exact properties of the quantum state remain elusive. In this work, we present a spin-dynamic investigation of ${\\mathrm{NaYbSe}}_{2}$. Magnetic susce…", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Experimental investigation of a QSL candidate material; relevant to quantum magnetism interests.", "tags": ["experiment", "material", "quantummagnetism"], "image": "", "briefing": {"background": "삼각 격자 구조를 가진 희토류 칼코게나이드계 물질(NaYbX2)은 기하학적 좌절(frustration)로 인해 영온도에서도 스핀이 정렬되지 않는 양자 스핀 액체(QSL) 상태를 구현할 후보로 주목받고 있습니다.", "motivation": "NaYbSe2의 정확한 양자 상태와 스핀 동역학적 특성은 여전히 불분명하며, 특히 교환 상호작용의 이방성이 물리적 성질에 미치는 영향을 규명할 필요가 있습니다.", "result": "본 연구에서는 NaYbSe2에서 반강자성 유사 공명(antiferromagnetic-like resonance) 현상을 관찰하였으며, 이를 통해 자기적 이방성과 이방성 교환 상호작용 파라미터를 정밀하게 추출하였습니다.", "implication": "추출된 이방성 교환 상호작용 상수는 이 물질의 저온 자기 기저 상태를 모델링하는 데 결정적인 기초 데이터를 제공하며, QSL 모델과의 정합성을 판단하는 기준이 됩니다.", "novelty": "NaYbSe2의 스핀 동역학을 직접적으로 측정하여 교환 상호작용의 정량적 값을 제시했다는 점이 중요하며, 이는 독자의 관심사인 양자 자성체 및 좌절된 계의 물리와 밀접한 연관이 있습니다.", "unresolved": "관찰된 공명 현상이 완전한 QSL 상태와 공존할 수 있는 것인지, 혹은 미세한 자기 정렬의 전조인지에 대한 추가적인 논의가 필요합니다.", "future_work": "극저온 중성자 산란 실험이나 뮤온 스핀 회전(muSR) 실험을 통해 장범위 자기 정렬의 존재 여부를 최종 확인해야 합니다.", "concepts": [{"term": "Quantum Spin Liquid (QSL)", "why_emerged": "강한 양자 요동으로 인해 절대 영도에서도 고전적인 자기 정렬이 나타나지 않는 새로운 양자 상태를 설명하기 위해 등장했습니다.", "origin": "1073년 필립 앤더슨(P. W. Anderson)이 제안함", "connections": "Resonating Valence Bond (RVB) 이론, 고온 초전도체 메커니즘과 연결됨"}, {"term": "Triangular Lattice", "why_emerged": "인접한 스핀들이 서로 반강자성적으로 정렬하려 할 때 기하학적 구조 때문에 모든 결합을 만족시킬 수 없는 '좌절' 현상을 연구하기 위한 기본 격자입니다.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "Kagome lattice, Honeycomb lattice와 함께 좌절된 자성 연구의 핵심 구조"}, {"term": "Anisotropic Exchange", "why_emerged": "결정 구조의 대칭성 저하와 강한 스핀-궤도 결합으로 인해 스핀 간 상호작용이 방향에 따라 달라지는 현상을 설명하기 위해 도입되었습니다.", "origin": "Dzyaloshinskii와 Moriya 등에 의해 체계화됨", "connections": "Dzyaloshinskii-Moriya 상호작용, Kitaev 모델"}, {"term": "Spin Dynamics", "why_emerged": "정적인 자기 구조뿐만 아니라 스핀이 시간에 따라 어떻게 요동치고 에너지를 전달하는지 이해하기 위해 연구됩니다.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "Electron Spin Resonance (ESR), Inelastic Neutron Scattering (INS)"}], "english_summary": ["Investigated spin dynamics in the triangular-lattice QSL candidate NaYbSe2.", "Identified antiferromagnetic-like resonance and determined anisotropic exchange constants.", "Provides critical parameters for modeling the quantum ground state of rare-earth chalcogenides.", "Highlights the role of magnetic anisotropy in frustrated quantum magnets."]}}, {"title": "Emergent room-temperature anomalous and topological Hall responses in the epitaxial ferromagnetic Weyl nodal-line metal Fe5Si3", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/flxb-4ktc", "authors": "Shubhashish Pati, Sonali Srotaswini Pradhan, Abhay Pandey, et al.", "last_authors": "V. Kanchana, Sujeet Chaudhary", "summary": "The interplay between real and reciprocal space topology yields intrinsically linked transport phenomena in topological magnetic material systems. In particular, broken time-reversal symmetry together with strong Dzyaloshinskii-Moriya interaction and pronounced uniaxial anisotropy can simultaneously…", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Investigates topological Hall effects in a Weyl nodal-line metal, directly relevant to topological semimetal interests.", "tags": ["experiment", "Weylsemimetal", "anomalousHall"], "image": "", "briefing": {"background": "강자성 Weyl 노드 라인(Nodal-line) 금속은 밴드 구조의 위상적 특성과 자성이 결합되어 거대한 이상 홀 효과(AHE)와 위상 홀 효과(THE)를 나타낼 수 있는 물질군입니다.", "motivation": "상온에서 작동하는 위상 수송 현상을 발견하는 것은 차세대 스핀트로닉스 소자 응용을 위해 필수적이지만, 대다수의 위상 물질은 저온에서만 특성이 나타납니다.", "result": "에피택셜 성장된 Fe5Si3 박막에서 상온까지 유지되는 비정상 홀 효과(AHE)와 위상 홀 효과(THE)를 관찰하였으며, 이는 Weyl 노드 라인 구조에서 기인한 베리 곡률(Berry curvature)과 관련이 있음을 밝혔습니다.", "implication": "Fe5Si3가 상온 위상 스핀트로닉스 구현을 위한 유망한 플랫폼임을 입증하였으며, 실공간과 역격자 공간의 위상이 결합된 수송 특성을 보여줍니다.", "novelty": "상온에서 위상 홀 반응을 확인했다는 점이 매우 고무적이며, 독자의 관심사인 Weyl/Dirac 반금속 및 Berry curvature 관련 연구와 직접적으로 맞닿아 있습니다.", "unresolved": "실공간의 자기 구조(스커미온 등)에 의한 기여와 역격자 공간의 베리 곡률에 의한 기여를 실험적으로 완전히 분리하여 정량화하는 과제가 남아 있습니다.", "future_work": "박막의 자기 도메인 구조를 직접 관찰하기 위한 MFM이나 Lorentz TEM 측정 ulator", "quantum-Hall"], "image": "", "briefing": {"background": "위상 절연체(TI)의 표면 상태는 특이한 전자기적 성질을 가지며, 이를 통해 4차원 양자 홀 효과와 같은 고차원 위상 물리학을 3차원 물질에서 구현하려는 시도가 활발합니다.", "motivation": "위상 절연체에서 나타나는 위상 자성 전기 효과(TME)를 측정하기 위해, 능동 용량 보상법을 사용하여 표면 전하를 정밀하게 탐지하고자 했습니다.", "result": "액시온 절연체 소자에서 4차원 양자 홀 효과의 응집 물질적 구현인 위상 자성 전기 효과를 성공적으로 감지했습니다.", "implication": "위상 물질의 표면 전하 동역학을 정밀하게 제어하고 측정할 수 있는 실험적 플랫폼을 확보했습니다.", "novelty": "TI 기반 소자에서 위상 물리 현상을 전기적으로 측정하는 새로운 기술을 제시하여, 향후 위상 소자 응용 연구에 기여할 수 있습니다.", "unresolved": "실험 조건의 정밀도 한계로 인해 극저온 외의 환경에서의 재현성과 외부 섭동에 대한 안정성이 추가로 검증되어야 합니다.", "future_work": "다양한 자성 위상 절연체 화합물에 대한 확장 적용 및 Berry 곡률 제어 연구가 가능할 것입니다.", "concepts": [{"term": "액시온 절연체", "why_emerged": "시간 반전 대칭성이 깨진 위상 절연체에서 액시온 전기역학을 구현하기 위해 필요했습니다.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "위상 자기 전기 효과 및 위상 절연체와 밀접합니다."}, {"term": "4차원 양자 홀 효과", "why_emerged": "고차원 공간에서의 위상적 불변량을 물리적 시스템에서 구현하기 위해 제안되었습니다.", "origin": "Zhang과 Hu 등에 의해 제안되었습니다.", "connections": "3차원 TI에서의 자기 전기 효과와 수학적으로 동일합니다."}], "english_summary": ["This paper reports the detection of topological surface charge via active capacitive compensation.", "The method is applied to study the topological magnetoelectric effect in axion insulator devices.", "The results demonstrate a condensed-matter realization of the 4D quantum Hall effect.", "This work provides a new experimental pathway for probing topological phenomena in 3D TIs."]}}, {"title": "Room-temperature multiferroicity in all–van der Waals heterostructures", "journal": "Science", "source": "Gemini", "link": "https://doi.org/10.1126/science.adq0420", "authors": "Qinqin Wang, Baojuan Xin, Chen Liu, et al.", "last_authors": "Evgeny Y. Tsymbal, Cheng Gong", "summary": "Multiferroics host simultaneous and coupled ferroic orders, allowing disparate external stimuli to induce abrupt transformations in their structures and properties. Creating multiferroicity in two-dimensional (2D) van der Waals (vdW) platforms would add the elements of strong quantum confinement, enhanced quasiparticle excitations, and wide tunability to the capabilities of these systems. In this work, we constructed vdW heterostructures of ferromagnetic triiron gallium ditelluride (Fe 3 GaTe 2 ) and ferroelectric copper indium thiophosphate (CuInP 2 S 6 ) to integrate their respective orders. We observed strong interferroic coupling at room temperature by demonstrating ferroelectrically reconfigurable magnetic anisotropy of 2D Fe 3 GaTe 2 . The interferroic magnetoelectricity diminished with increasing Fe 3 GaTe 2 thickness, revealing the interfacial nature of heterostructure multiferroicity. Our discovery of all-vdW heterostructure multiferroicity opens the door to the artificial assembly of vdW layers for designer 2D multiferroics.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Experimental demonstration of room-temperature multiferroicity in van der Waals heterostructures, highly relevant.", "tags": ["vanderWaals", "heterostructure", "multiferroicity", "ferromagnetism", "2Dmaterials", "experimental"], "image": "", "briefing": {"background": "반데르발스(vdW) 이종접합은 원자 수준의 두께로 다양한 물리적 성질을 결합할 수 있어 차세대 전자소자 연구의 핵심입니다.", "motivation": "자성체(Fe3GaTe2)와 강유전체(CuInP2S6)를 적층하여, 상온에서 다강체 성질을 나타내는 이종접합을 구축하고자 했습니다.", "result": "상온에서 강유전 분극을 이용해 자성체의 자기 이방성을 가역적으로 제어하는 등 강력한 상호작용을 증명했습니다.", "implication": "vdW 이종접합 기술을 통해 상온 작동이 가능한 맞춤형 다강체 소자 개발의 가능성을 열었습니다.", "novelty": "기존 다강체 물질의 한계였던 낮은 작동 온도를 극복하고, vdW 이종접합을 통해 상온 상호작용을 구현한 것이 매우 혁신적입니다.", "unresolved": "이종접합 계면에서의 구조적 무질서가 다강체 특성에 미치는 영향에 대한 상세한 미시적 분석이 더 필요합니다.", "future_work": "다양한 2D 강자성체와 강유전체 조합을 통한 계면 물리학 연구 및 소자 최적화가 예상됩니다.", "concepts": [{"term": "다강체", "why_emerged": "강자성과 강유전성이 공존하여 외부 자기장과 전기장으로 서로를 제어할 수 있는 물질이 필요했습니다.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "스핀트로닉스 및 저전력 메모리 소자와 연결됩니다."}, {"term": "반데르발스 이종접합", "why_emerged": "격자 불일치 없이 서로 다른 2D 물질을 적층하여 새로운 물리적 기능을 구현하기 위해 필요했습니다.", "origin": "Geim과 Novoselov 등에 의해 개척되었습니다.", "connections": "그래핀 및 2D 물질 전자소자 연구 전반과 연결됩니다."}], "english_summary": ["The study demonstrates room-temperature multiferroicity in all-vdW heterostructures.", "Heterostructures were built using ferromagnetic Fe3GaTe2 and ferroelectric CuInP2S6.", "Strong interferroic coupling allows reconfigurable magnetic anisotropy at room temperature.", "This work opens new possibilities for designing 2D multiferroic devices."]}}, {"title": "Ultralong sheathed single-metal-atom chains synthesized under high pressure", "journal": "Science", "source": "Gemini", "link": "https://doi.org/10.1126/science.aeg0028", "authors": "Jie Zhang, Xiao Dong, Shengchao Qiu, et al.", "last_authors": "Haiyan Zheng, Kuo Li", "summary": "Single-metal-atom chains (SMACs) represent the ultimate limit of one-dimensional nanostructures. They serve as archetypal model systems for condensed matter physics and constitute fundamental building blocks for next-generation nanoelectronics. However, synthesis of SMACs suitable for practical applications remains challenging. In this work, we create micrometer-long, carbon-sheathed copper SMACs at milligram scale by compressing β-copper phthalocyanine to above 21 gigapascals. The SMACs are in atom-scale ordering, are isolable through acid-assisted exfoliation, and exhibit exceptional stability, with Cu-Cu distance confined at 2.57 angstroms. Anisotropic conductance and antiferromagnetic interactions are suggested by experimental and computational results. This work establishes a universal synthetic strategy for sheathed SMACs, positioning them as a compelling platform for prospective electronic and spintronic applications.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Synthesis and properties of 1D metal chains with antiferromagnetism, relevant to spintronics.", "tags": ["quasi-1Dmaterials", "nanostructures", "antiferromagnetism", "spintronics"], "image": "", "briefing": {"background": "단일 금속 원자 사슬(SMAC)은 1차원 나노 구조의 극한 형태로, 물질의 기본 물성 연구와 차세대 나노 소자 구현을 위한 핵심 빌딩 블록입니다. 하지만 극도로 불안정하여 실제 응용 가능한 수준의 합성이 큰 난제였습니다.", "motivation": "고압 환경을 이용해 탄소로 감싸진 긴 구리(Cu) 원자 사슬을 안정적으로 합성하고, 그 물리적 성질(전도성 및 자기적 특성)을 규명하고자 했습니다.", "result": "21 GPa 이상의 고압을 통해 마이크로미터 길이의 탄소 피복 구리 SMAC 합성에 성공했습니다. 실험과 계산을 통해 이 사슬이 비등방성 전도성과 반강자성 상호작용을 나타냄을 확인했습니다.", "implication": "고압 합성을 통한 범용적 SMAC 합성 전략을 제시함으로써, 향후 1차원 기반 스핀트로닉스 소자 개발의 플랫폼을 마련했습니다.", "novelty": "기존에 구현하기 어려웠던 원자 단위의 긴 금속 사슬을 대량(mg 단위)으로 안정화했다는 점과, 준1차원 물질 연구에서 중요한 반강자성 특성을 실험적으로 접근했다는 점에서 의의가 큽니다.", "unresolved": "SMAC 내부의 구체적인 자기적 기원과 1차원 제한 조건에서의 전자 상관관계에 대한 더 깊은 이론적 고찰이 필요합니다.", "future_work": "다른 금속 원자를 이용한 SMAC 합성 시도 및 실제 스핀트로닉스 소자로의 소자화 연구가 예상됩니다.", "concepts": [{"term": "SMAC (Single-Metal-Atom Chains)", "why_emerged": "물질의 차원성을 극단으로 낮추어 양자 역학적 효과를 극대화하기 위해 필요함.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "탄소 나노튜브, 원자 와이어 연구와 직결됨."}, {"term": "반강자성 (Antiferromagnetism)", "why_emerged": "스핀 정렬의 기본 형태 중 하나로, 외부 자기장 영향을 덜 받는 고밀도 정보 저장을 위해 중요함.", "origin": "Louis Néel (1930년대).", "connections": "스핀트로닉스, 자기 재료 과학 전반."}], "english_summary": ["Synthesized micrometer-long copper single-atom chains encapsulated in carbon nanotubes using high-pressure (21 GPa) synthesis.", "Demonstrated structural stability and atom-scale ordering of the Cu-Cu chains.", "Experimental and computational results suggest anisotropic conductance and antiferromagnetic interactions within the 1D chains.", "Provides a scalable synthetic platform for future quasi-1D spintronic device applications."]}}, {"title": "Dynamically manipulated interface polarization via symmetry engineering for self-gated electronics", "journal": "Science_Advances", "source": "Gemini", "link": "https://doi.org/10.1126/sciadv.aee4668", "authors": "Zhuangzhuang Zhang, Luying Xu, Gaobo Wang, et al.", "last_authors": "Longfei Wang, Zhong Lin Wang", "summary": "Interfaces have always been a key for functional devices in condensed-matter physic. However, dynamic regulation of interfacial symmetry and the subsequent effects have still been underestimated, especially in bulk materials. Here, we show that the interfacial crystallographic symmetry can be precisely modulated by electric field induced oxygen vacancy rearrangement in bulk centrosymmetric semiconductors (TiO 2 , SrTiO 3 , etc.), resulting in tunable interface polarization. Our results show that the interface polarization of metal-semiconductor heterostructure can be reversibly modified in a nonvolatile manner, with a tunable electromechanical response varying from 6.79 to 9.07 p.m./V, which is comparable to common piezoelectric semiconductors (ZnO, GaN, MoS 2 , etc.). Substantial self-gated carrier transport in metal-semiconductor heterostructure is achieved, with a Schottky barrier tuned by 30.8 meV. Furthermore, the self-gated electronics effectively simplifies the complicated structures of logic devices, integrating logic and storage operations through programmable interface polarization. These findings offer a distinctive approach to design the interface symmetry and functionalities beyond the intrinsic limitation of bulk centrosymmetric materials.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Interface polarization, symmetry engineering, and carrier transport in oxide heterostructures relevant to CM.", "tags": ["interfacephysics", "oxides", "transport", "semiconductors", "symmetry"], "image": "", "briefing": {"background": "산화물 헤테로 구조의 계면은 전자 기기 기능성의 핵심입니다. 하지만 벌크 물질 내부의 계면 대칭성을 동적으로 조절하여 소자 물성을 제어하는 기술은 아직 초기 단계입니다.", "motivation": "벌크 중심 대칭성(centrosymmetric)을 가진 반도체에서 외부 전기장을 이용해 산소 공공을 재배열하고, 이를 통해 계면 대칭성과 편극(polarization)을 동적으로 제어하고자 했습니다.", "result": "전기장 유도 산소 공공 재배열을 통해 금속-반도체 계면의 편극을 비휘발성으로 가역적 제어하는 데 성공했습니다. 이를 통해 쇼트키 장벽을 30.8 meV만큼 튜닝했습니다.", "implication": "복잡한 구조 없이도 인터페이스 엔지니어링만으로 논리 및 저장 기능을 통합한 'Self-gated' 소자 구현이 가능함을 입증했습니다.", "novelty": "전통적인 벌크 반도체의 대칭성을 전기적으로 파괴하여 계면 물성을 프로그래밍 가능하게 바꾼 점이 혁신적입니다.", "unresolved": "장기적인 소자 구동 시 산소 공공 이동에 따른 신뢰성(degradation) 문제 및 정확한 대칭성 파괴 기작의 미시적 규명이 필요합니다.", "future_work": "더 정교한 나노 초 단위의 스위칭 속도 테스트 및 대규모 집적 회로로의 확장 가능성 탐색.", "concepts": [{"term": "계면 편극 (Interface Polarization)", "why_emerged": "이종 접합 계면에서 전하 분포의 비대칭성을 통해 소자 동작을 제어하기 위해 필요함.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "강유전체, 쇼트키 장벽, 밴드 엔지니어링."}, {"term": "쇼트키 장벽 (Schottky Barrier)", "why_emerged": "금속과 반도체 접합부에서 전하 흐름을 결정짓는 필수 에너지 장벽.", "origin": "Walter H. Schottky (1930년대).", "connections": "반도체 소자 물리학 전반."}], "english_summary": ["Demonstrated dynamic modulation of interfacial symmetry via electric-field-induced oxygen vacancy rearrangement in centrosymmetric bulk semiconductors.", "Achieved reversible, nonvolatile control of interface polarization and Schottky barrier heights.", "Enabled a self-gated electronics architecture integrating logic and memory functions.", "Provides a method to engineer functionality beyond intrinsic bulk material limitations."]}}, {"title": "Multidimensional spectro-temporal imaging of exciton dynamics under propagating acoustic strain in two-dimensional semiconductors", "journal": "Science_Advances", "source": "Gemini", "link": "https://doi.org/10.1126/sciadv.aef5458", "authors": "Yuta Takahashi, Takumi Yamamoto, Hidetoshi Kanzawa, et al.", "last_authors": "Shinichi Watanabe, Shun Fujii", "summary": "Dynamic strain offers a promising route to manipulate tightly bound excitons in two-dimensional semiconductors. Its impact, however, has so far been inferred primarily from time-averaged or spatially integrated measurements. In particular, for dynamic strain driven by surface acoustic waves (SAWs), the relatively small strain amplitude and competing piezoelectric effects have hindered direct access to the real-time evolution of exciton emission energy and recombination dynamics within a single acoustic cycle. Here we report a fully phase-synchronized, multidimensional spectro-temporal-spatial visualization of exciton emission in monolayer tungsten diselenide driven by propagating SAWs. By integrating phase-resolved microscopy and interferometric surface displacement measurements, we achieve simultaneous mapping of exciton emission energy, photoluminescence intensity, linewidth, and decay dynamics and directly correlate them with the dynamic strain field. Our work establishes propagating acoustic strain as a powerful platform for deterministic exciton control and provides a comprehensive framework for exploring nonequilibrium exciton dynamics in low-dimensional materials.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Experimental study of exciton dynamics in monolayer WSe2, relevant to 2D semiconductors.", "tags": ["2Dmaterials", "excitons", "spectroscopy", "WSe2", "strain"], "image": "", "briefing": {"background": "2D 반도체는 엑시톤 효과가 매우 강해 광전 소자로 주목받습니다. 그러나 표면 탄성파(SAW)와 같은 동적 변형에 의한 엑시톤 반응은 기존 시간-평균 측정으로는 실시간 추적이 어려웠습니다.", "motivation": "단층 WSe2에서 표면 탄성파(SAW)에 의한 동적 변형이 엑시톤의 방출 에너지, 재결합 동역학에 미치는 영향을 실시간(페이즈 동기)으로 시각화하고자 했습니다.", "result": "위상 분해 현미경과 간섭계를 결합하여 단일 음향 주기 내에서 엑시톤의 동적 진화를 공간 및 시간적으로 매핑했습니다.", "implication": "동적 변형을 이용한 엑시톤의 결정론적 제어 프레임워크를 제공하여, 저차원 물질의 비평형 동역학 연구에 돌파구를 마련했습니다.", "novelty": "단순한 정적 측정을 넘어, 실제 소자 구동 조건과 유사한 동적 환경 하에서 엑시톤의 초고속 반응을 직접 관측했다는 점이 핵심입니다.", "unresolved": "음향파 강도가 매우 강해질 때 나타나는 비선형 엑시톤-포논 상호작용에 대한 상세 분석은 추가 연구가 필요합니다.", "future_work": "더 다양한 2D 물질에 대한 플로케(Floquet) 엔지니어링 혹은 동적 제어 실험으로의 확장.", "concepts": [{"term": "표면 탄성파 (SAW, Surface Acoustic Waves)", "why_emerged": "고체 표면에서 음향적 에너지를 전달하고 물질의 국소적 변형을 유도하기 위해 사용됨.", "origin": "Lord Rayleigh (1885).", "connections": "음향광학 소자, 포논 물리학."}, {"term": "엑시톤 동역학 (Exciton Dynamics)", "why_emerged": "광학 소자의 반응 속도와 효율을 결정하는 핵심 물리 과정이기 때문.", "origin": "Frenkel/Wannier (1930년대).", "connections": "2D 반도체, 광전소자."}], "english_summary": ["Reported phase-synchronized, multidimensional spectro-temporal imaging of excitons in monolayer WSe2 under propagating surface acoustic waves (SAWs).", "Successfully mapped exciton emission energy, linewidth, and decay dynamics correlated with dynamic strain fields.", "Establishes propagating acoustic strain as a platform for deterministic, real-time control of exciton dynamics.", "Provides a comprehensive framework for exploring nonequilibrium physics in low-dimensional materials."]}}, {"title": "Ultrafast energy transfer across Pd/MXene interface via hot phonon-electron interactions", "journal": "Science_Advances", "source": "Gemini", "link": "https://doi.org/10.1126/sciadv.aee2017", "authors": "Jie Zhao, Qi Zhang, Meng Geng, et al.", "last_authors": "Kaijun Yuan, Xueming Yang", "summary": "The interfacial structure and energy transfer (ET) in heterostructures have attracted tremendous attention for their growing importance in thermal management, catalysis, and optoelectronic applications. However, the role of carrier-lattice interaction in interfacial ET at the nanoscale remains unclear. Here, we construct metal/MXene heterostructures via in situ chemical growth as platforms to study interfacial energy flow. On the basis of femtosecond transient absorption spectroscopic measurements, interfacial ET within ∼1.3 picoseconds is observed in Pd/MXene, which could not be explained by traditional phonon-phonon interaction. Experimental results combined with density functional theory calculations identify an ultrafast ET route involving strong interfacial coupling and high-density-of-state electrons near the Fermi level, enabling hot phonon–driven electron excitation. Distinct from conventional diffusive phonon processes, this ET route exhibits higher ET rate and efficiency with increasing absorbed photon energy and pump fluence. These findings reveal that the tuning of interfacial chemical bonds holds the promise to achieve high-efficiency energy transport across nanoscale interfaces.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Ultrafast energy transfer across MXene heterostructure via hot phonon-electron interactions, relevant to 2D materials.", "tags": ["heterostructure", "2Dmaterials", "electron-phononcoupling", "ultrafastdynamics", "DFT"], "image": "", "briefing": ound to be parity-dependent on downstream integer edge modes.", "This approach advances the experimental capability to characterize topological quasiparticles for quantum computing."]}}, {"title": "Quantum Hall antidot as a fractional coulombmeter", "journal": "Nature_Physics", "source": "Gemini", "link": "https://www.nature.com/articles/s41567-026-03412-2", "authors": "Mario Di Luca, Emily Hajigeorgiou, Zekang Zhou, et al.", "last_authors": "Steven H. Simon, Mitali Banerjee", "summary": "A transport technique that allows the measurement of the effective charge of fractional quantum Hall states as they tunnel through a controlled impurity is demonstrated.", "tier": "B_IMPORTANT_CONDMAT", "score": "7", "reason": "Experimental transport study of fractional quantum Hall charge, matching the user's interest in topological states.", "tags": ["transport", "2Dmaterials", "quantumHall"], "image": "https://media.springernature.com/m685/springer-static/image/art%3A10.1038%2Fs41567-026-03412-2/MediaObjects/41567_2026_3412_Fig1_HTML.png", "briefing": {"background": "분수 양자 홀 효과 시스템에서 나타나는 분수 전하의 특성을 정확히 측정하는 것은 위상 물성 연구의 기본이자 필수적인 토대입니다.", "motivation": "통제된 불순물(impurity) 영역을 통과하는 분수 양자 홀 준입자의 전하를 측정하기 위한 새로운 수송 측정 기술을 개발하고자 했습니다.", "result": "양자 홀 안티도트를 '분수 쿨롱미터(fractional coulombmeter)'로 활용하여, 준입자가 터널링할 때의 유효 전하를 측정하는 새로운 수송 기술을 입증했습니다.", "implication": "분수 양자 홀 상태의 준입자 특성을 정밀하게 규명할 수 있는 새로운 도구를 제공하여, 위상 정렬 상태 연구의 정확도를 높일 것으로 기대됩니다.", "novelty": "안티도트를 단순히 시스템을 방해하는 요소가 아니라, 정밀한 계측 장치로 활용하는 아이디어가 돋보이며, 이는 수송 측정 데이터의 신뢰성을 크게 향상시킵니다.", "unresolved": "극저온 환경에서의 높은 정밀도 유지 및 다양한 물질 플랫폼으로의 확장성 여부는 추가 검증이 필요합니다.", "future_work": "다양한 위상 절연체 및 강상관 전자계 물질에 적용하여 분수 전하의 거동을 보편적으로 규명하는 연구가 기대됩니다.", "concepts": [{"term": "분수 쿨롱미터 (Fractional Coulombmeter)", "why_emerged": "분수 양자 홀 상태에서의 유효 전하를 직접적으로 식별할 수 있는 실험적 측정 표준이 필요했기 때문임.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "쿨롱 차단, 양자 홀 효과, 준입자 터널링."}], "english_summary": ["A new transport technique is proposed to measure the effective
