<!DOCTYPE html>

<head>

<meta name='viewport' content='width=device-width, initial-scale=1.0'>
<title>Daily Paper Slideshow</title>
<style>
  :root {
    color-scheme: light;
    --bg: #f6f7f4;
    --paper: #ffffff;
    --ink: #111827;
    --muted: #64748b;
    --line: #d8ddd2;
    --accent: #176b87;
    --accent-2: #9a3412;
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; overflow: auto; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: var(--bg); color: var(--ink); }
  .shell { max-width: 1500px; min-height: 100vh; margin: 0 auto; padding: 14px 18px; display: flex; flex-direction: column; }
  .topbar { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 16px; }
  .top-actions { display: flex; align-items: center; gap: 10px; }
  .topbar a, button { border: 1px solid var(--line); border-radius: 8px; background: var(--paper); color: var(--ink); padding: 10px 14px; font-weight: 700; text-decoration: none; cursor: pointer; }
  button.primary { background: var(--accent); border-color: var(--accent); color: white; }
  button:disabled { opacity: 0.45; cursor: not-allowed; }
  .counter { color: var(--muted); font-weight: 700; }
  .slide { min-height: calc(100vh - 82px); background: var(--paper); border: 1px solid var(--line); border-radius: 10px; padding: 18px; box-shadow: 0 18px 42px rgba(15, 23, 42, 0.10); display: grid; grid-template-columns: minmax(310px, 0.86fr) minmax(0, 1.55fr); gap: 18px; overflow: visible; }
  .paper-head { min-width: 0; min-height: 0; overflow: visible; display: flex; flex-direction: column; gap: 12px; }
  .figure { margin: 0; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: #f8fafc; }
  .figure img { display: block; width: 100%; max-height: 41vh; object-fit: contain; background: white; }
  .figure figcaption { padding: 7px 10px; color: var(--muted); font-size: 12px; line-height: 1.3; }
  .head-text { display: flex; flex-direction: column; gap: 9px; min-width: 0; }
  .badges { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .badge { border-radius: 999px; padding: 5px 9px; background: #eef2ff; color: #3730a3; font-size: 12px; font-weight: 800; }
  .score { background: #fee2e2; color: #991b1b; }
  h1 { margin: 0; font-size: 25px; line-height: 1.15; letter-spacing: 0; overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
  h1 a { color: inherit; text-decoration-color: rgba(23, 107, 135, 0.35); text-decoration-thickness: 2px; text-underline-offset: 4px; }
  h1 a:hover { color: var(--accent); text-decoration-color: var(--accent); }
  .meta, .authors, .why, .abstract { font-size: 13px; line-height: 1.45; }
  .meta, .authors { color: var(--muted); }
  .why strong, .abstract strong, .authors strong { color: var(--ink); }
  .authors { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .why { border-left: 4px solid var(--accent-2); padding-left: 10px; color: #374151; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .abstract { border-top: 1px solid var(--line); padding-top: 14px; color: #374151; }
  .original-abstract { border-top: 1px solid var(--line); padding-top: 10px; color: #374151; font-size: 11.5px; line-height: 1.35; overflow-wrap: anywhere; }
  .original-abstract strong { display: block; margin-bottom: 4px; color: var(--ink); }
  .tags { display: flex; flex-wrap: wrap; gap: 8px; }
  .tag { border-radius: 999px; padding: 4px 8px; background: #f1f5f9; color: #475569; font-size: 12px; font-weight: 700; }
  .head-text > .link { display: none; }
  .briefing { min-width: 0; min-height: 0; overflow: visible; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); grid-auto-rows: minmax(0, auto); align-content: start; gap: 11px 18px; border-top: 0; padding-top: 0; }
  .brief-section { min-width: 0; }
  .brief-section.wide { grid-column: 1 / -1; }
  .brief-section h2 { margin: 0 0 4px; font-size: 14px; line-height: 1.22; color: #0f766e; letter-spacing: 0; }
  .brief-section p, .brief-section li { margin: 0; font-size: 12.5px; line-height: 1.42; color: #1f2937; overflow-wrap: anywhere; }
  .brief-section ul { margin: 0; padding-left: 20px; }
  .concepts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 9px 14px; }
  .concept { border-top: 1px solid var(--line); padding-top: 7px; }
  .concept h3 { margin: 0 0 4px; font-size: 13px; color: #7c2d12; letter-spacing: 0; }
  .concept p { margin: 2px 0 0; font-size: 11.5px; line-height: 1.35; color: #374151; overflow-wrap: anywhere; }
  .concept b { color: #111827; }
  .link { color: var(--accent); font-weight: 800; text-decoration: none; }
  .empty { padding: 48px; background: var(--paper); border: 1px solid var(--line); border-radius: 12px; color: var(--muted); }
  @media (max-width: 860px) {
    .shell { padding: 14px; }
    .topbar, .top-actions { align-items: stretch; flex-direction: column; }
    .slide, .briefing, .concepts { grid-template-columns: 1fr; }
    .slide { min-height: auto; overflow: visible; display: grid; }
    h1 { font-size: 28px; }
  }
</style>

<script>
const slides = [{"title": "Contrasting one- and two-particle excitations in cuprate strange metals", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2611.12569", "authors": "Falk R\\\"oder. Roman Schuster, Martin Knupfer, Axel Lubk, J\\\"org Fink", "last_authors": "Axel Lubk, J\\\"org Fink", "summary": "In unconventional superconductivity, the pairing mechanism remains one of the central unresolved problems in solid-state physics. Moreover, the normal state shows strong deviations from conventional Fermi-liquid behavior, most notably a scattering rate that is linear in energy and temperature. Here we study the momentum dependence of the energy and damping of collective excitations in optimally doped cuprates in the normal state. In particular, we analyze existing Electron Energy Loss Spectroscopy (EELS) data of Bi2Sr2CaCu2O8 [Phys. Rev. B 44, 7155 (1991)] and new analogous optical plasmon data of Bi2Sr2Ca2Cu3O10. Furthermore, we reanalyze similar Resonant Inelastic Xray Scattering (RIXS) acoustic plasmon data [Phys. Rev. R 6, 043184 (2024)] of La1.84Sr0.16CuO4 and La1.84Ce0.16CuO4. We contrast these two-particle excitation results with one-particle excitations measured by Angle-Resolved Photoemission Spectroscopy (ARPES). Most of the plasmon behavior can be described well by combined self-energies of a hole and an electron. The dispersion of optical plasmons at high energy is only weakly determined by correlation effects, indicating resilient quasiparticles. The damping of the optical plasmons at low energy, however, is strongly influenced by the reduced scattering rates described in the marginal Fermi liquid model for \"strange-metal\" behavior. In addition, the same model describes the linear-in-energy damping of acoustic plasmons. Contrary to some theoretical predictions, we see no overdamped optical plasmons below the classical Lindhard critical wave vector.", "tier": "A_MUST_READ", "score": "10", "reason": "Direct analysis of ARPES, RIXS data on cuprate strange metals, highly relevant to user's core interests.", "tags": ["ARPES", "RIXS", "cuprates", "unconventionalsuperconductivity", "strangemetals", "electronicstructure"], "image": "https://arxiv.org/html/2611.12569v1/Fig1.png", "briefing": {"background": "구리 산화물(cuprates) 초전도체의 정상 상태는 일반적인 금속과 달리 온도와 에너지에 비례하는 산란율을 갖는 '이상 금속(strange metal)' 거동을 보입니다. 이 현상의 기저에 있는 전하 역학을 이해하기 위해 단일 입자 들뜸(quasiparticle)과 집단적 들뜸(plasmon) 사이의 상관관계를 규명하는 것이 중요합니다.", "motivation": "이 논문은 ARPES로 측정되는 단일 입자 들뜸과 EELS/RIXS로 측정되는 이입자 들뜸(플라즈몬) 데이터를 직접 대조하여, 이상 금속의 산란 메커니즘이 두 유형의 들뜸에 어떻게 공통적으로 또는 다르게 작용하는지 분석하고자 합니다.", "result": "연구진은 Bi2212 및 Bi2223의 플라즈몬 데이터를 분석하여, 고에너지 광학 플라즈몬 분산은 상관관계의 영향을 적게 받는 '회복력 있는 준입자' 특성을 보이지만, 저에너지에서의 댐핑(damping)은 한계 페르미 액체(MFL) 모델의 산란율에 의해 강하게 제어됨을 확인했습니다. 또한, 기존 이론적 예측과 달리 광학 플라즈몬이 특정 임계 파수 아래에서 과도하게 댐핑되지 않음을 발견했습니다.", "implication": "이상 금속의 복잡한 전하 역학이 전자-정공 쌍의 자기 에너지 결합으로 설명될 수 있음을 시사하며, 이는 한계 페르미 액체 이론이 준입자 뿐만 아니라 집단 들뜸의 감쇠 현상도 통합적으로 묘사할 수 있음을 보여줍니다.", "novelty": "ARPES와 RIXS 데이터를 결합하여 단일 입자와 집단 들뜸의 산란율을 직접 비교했다는 점이 독보적입니다. 특히 사용자의 주 관심사인 ARPES와 RIXS를 모두 활용하여 구리 산화물의 핵심 난제를 다루고 있습니다.", "unresolved": "실험적으로 관측된 플라즈몬 댐핑 수치가 왜 특정 이론적 예측치보다 낮은지, 그리고 이러한 거동이 다른 비전통적 초전도체에서도 보편적으로 나타나는지에 대한 추가 검증이 필요합니다.", "future_work": "더 높은 에너지 분해능을 가진 RIXS를 사용하여 음향 플라즈몬의 상세한 운동량 의존성을 정밀 측정하고, 도핑 농도에 따른 플라즈몬 거동의 변화를 추적할 것으로 예상됩니다.", "concepts": [{"term": "이상 금속 (Strange Metal)", "why_emerged": "구리 산화물 등 강상관 계에서 페르미 액체 이론으로 설명되지 않는 선형적 비저항/산란율을 설명하기 위해 등장했습니다.", "origin": "초록 정보만으로는 특정하기 어려우나 1980년대 후반 구리 산화물 연구 과정에서 확립되었습니다.", "connections": "한계 페르미 액체(MFL), 비전통적 초전도성, 양자 임계 현상과 밀접하게 연관됩니다."}, {"term": "플라즈몬 (Plasmon)", "why_emerged": "금속 내 전자들의 집단적인 밀도 진동을 설명하기 위해 도입된 개념입니다.", "origin": "초록 정보만으로는 특정하기 어려우나 David Pines와 David Bohm 등에 의해 1950년대에 정립되었습니다.", "connections": "EELS, RIXS를 통해 관측되며, 전하 스크리닝 및 광학적 성질을 결정합니다."}, {"term": "한계 페르미 액체 (Marginal Fermi Liquid)", "why_emerged": "구리 산화물의 정상 상태에서 나타나는 비정상적인 산란율과 분광학적 특성을 설명하기 위한 현상론적 모델로 제안되었습니다.", "origin": "1989년 Varma 등에 의해 제안되었습니다.", "connections": "ARPES의 자기 에너지 분석 및 이상 금속의 전도성 해석에 널리 사용됩니다."}, {"term": "RIXS (Resonant Inelastic X-ray Scattering)", "why_emerged": "물질 내부의 전하, 스핀, 궤도, 격자 들뜸을 특정 원소의 공명 에너지를 이용해 정밀하게 측정하기 위해 개발되었습니다.", "origin": "초록 정보만으로는 특정하기 어려우나 동시성 가속기 기술 발전과 함께 성숙되었습니다.", "connections": "ARPES와 상호보완적이며, 중성자 산란으로 보기 어려운 고에너지 스핀파나 플라즈몬 관측에 유리합니다."}], "english_summary": ["Investigates the relationship between one-particle (ARPES) and two-particle (RIXS/EELS) excitations in cuprate strange metals.", "Finds that optical plasmon damping is strongly influenced by marginal Fermi liquid scattering rates at low energy.", "Demonstrates that plasmons remain resilient and are not overdamped below the Lindhard critical wave vector.", "Provides a unified picture of charge dynamics by contrasting quasiparticle self-energies with collective excitation data."]}}, {"title": "Kagome Flat Bands from Self-Assembled Water on Non-van der Waals 2D Materials", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2611.12371", "authors": "Tom Barnowsky, Madeleine Christie, Anastasiia Nihei, Rico Friedrich", "last_authors": "Anastasiia Nihei, Rico Friedrich", "summary": "The properties of two-dimensional (2D) materials are governed not only by their intrinsic electronic structure but also in particular by their surface chemistry and interactions with the environment. The surfaces of non-van der Waals (non-vdW) 2D materials are intrinsically reactive and may require chemical stabilization under realistic experimental conditions. Here, we perform a systematic first-principles study of water passivation of non-vdW 2D materials and demonstrate that molecular water adsorption is energetically and dynamically favored for a wide range of systems. Rather than dissociating, water molecules frequently remain intact and form adsorbed ordered surface overlayers. These overlayers can adopt a kagome lattice geometry, leading to the emergence of flat electronic bands directly at the valence-band edge. Analysis of the electronic structure reveals a strong intermolecular coupling between neighboring water lone pairs within this kagome topology, while the locked molecular orientations simultaneously produce an electrostatically frustrated surface potential. These findings establish water not only as a stabilizing agent but also as an active element for electronic structure engineering of non-vdW 2D surfaces. Keywords: 2D materials, passivation, non-van der Waals compounds, high-throughput computing, flat bands, kagome lattice", "tier": "A_MUST_READ", "score": "10", "reason": "First-principles prediction of kagome flat bands emerging from water self-assembly on 2D materials.", "tags": ["kagome", "flatband", "2Dmaterial", "computational"], "image": "https://arxiv.org/html/2611.12371v1/fig1.png", "briefing": {"background": "2D 물질의 표면은 원자 단위의 두께로 인해 환경과의 상호작용에 매우 민감합니다. 특히 비-반데르발스(non-vdW) 2D 물질은 표면의 높은 반응성 때문에 화학적 안정화(수동화)가 필수적이며, 이 과정에서 전자 구조가 크게 변할 수 있습니다.", "motivation": "일반적으로 물 분자의 흡착은 소자 성능을 저하시키는 오염원으로 간주되지만, 본 연구는 물 분자가 비-vdW 2D 물질 표면에서 특정 기하학적 구조로 자기 조립되어 새로운 전자적 상태를 유도할 수 있는지를 이론적으로 탐구했습니다.", "result": "제1원리 계산을 통해 물 분자가 비-vdW 2D 물질 표면에서 해리되지 않고 '카고메(kagome) 격자' 형태로 안정적인 오버레이어를 형성함을 발견했습니다. 이 카고메 구조의 물 층은 분자 간 론 페어(lone pair) 결합과 정전기적 좌절(frustration)을 통해 가전자대 끝단에 평탄 밴드(flat band)를 형성합니다.", "implication": "물이 단순한 안정화 제를 넘어 2D 물질의 전자 구조를 설계하는 '능동적 소자' 역할을 할 수 있음을 시사합니다. 특히 카고메 평탄 밴드는 강자성이나 초전도 등 흥미로운 양자 현상을 유도할 수 있는 플랫폼이 됩니다.", "novelty": "사용자의 주 관심사인 '카고메 격자'와 '평탄 밴드'를 자성체나 전이금속 화합물이 아닌, 흔한 '물 분자 층'의 자기 조립을 통해 구현할 수 있다는 파격적인 메커니즘을 제시했습니다.", "unresolved": "이러한 물 오버레이어가 실제 실험 환경(온도, 습도)에서 얼마나 안정적으로 유지될 수 있는지, 그리고 STM을 통해 이 카고메 격자를 직접 시각화할 수 있는지가 관건입니다.", "future_work": "다양한 비-vdW 기판에 대한 고처리량 계산 스크리닝과 함께, 극저온 STM/STS 실험을 통해 예측된 카고메 평탄 밴드를 직접 측정하는 연구가 뒤따를 것으로 보입니다.", "concepts": [{"term": "카고메 격자 (Kagome Lattice)", "why_emerged": "삼각형이 꼭짓점을 공유하며 연결된 독특한 기하학적 구조로 인해 강한 전자적 좌절과 평탄 밴드를 유도하기 위해 연구됩니다.", "origin": "일본의 대나무 바구니 패턴에서 유래했으며, 고체물리에서는 1950년대 Syozi에 의해 통계 모델로 도입되었습니다.", "connections": "평탄 밴드, 위상 기하학적 절연체, AV3Sb5와 같은 카고메 금속 연구와 직결됩니다."}, {"term": "평탄 밴드 (Flat Band)", "why_emerged": "운동량에 관계없이 에너지가 일정하여 전자의 유효 질량이 무한대가 되고, 전자 간 상호작용이 극대화되는 상태를 구현하기 위해 필요합니다.", "origin": "초록 정보만으로는 특정하기 어려우나 Lieb Lattice나 카고메 격자 모델에서 이론적으로 확립되었습니다.", "connections": "강자성, 비전통적 초전도, 모아레(Moire) 시스템의 핵심 요소입니다."}, {"term": "비-반데르발스 2D 물질 (Non-vdW 2D Materials)", "why_emerged": "층간 결합이 약한 vdW 물질과 달리 공유 결합이나 이온 결합을 끊어 만든 2D 물질로, 더 높은 표면 반응성과 독특한 물성을 탐색하기 위해 등장했습니다.", "origin": "초록 정보만으로는 특정하기 어려우나 멕신(MXene)이나 원자층 두께의 금속 산화물 연구 등에서 파생되었습니다.", "connections": "표면 수동화, 촉매 연구, 2D 전자 소자 엔지니어링과 연관됩니다."}, {"term": "수동화 (Passivation)", "why_emerged": "반응성이 높은 표면을 화학적으로 안정화하여 산화나 원치 않는 반응을 막고 소자의 전기적 특성을 보존하기 위해 사용됩니다.", "origin": "초록 정보만으로는 특정하기 어려우나 반도체 공정 기술에서 필수적으로 발전해왔습니다.", "connections": "표면 개질, 댕글링 본드(dangling bond) 제거, 계면 공학 등과 관련이 있습니다."}], "english_summary": ["Predicts the emergence of kagome flat bands from self-assembled water overlayers on non-van der Waals 2D materials.", "Identifies that molecular water adsorbs in an ordered kagome geometry instead of dissociating.", "Finds that lone pair coupling and electrostatic frustration within the water layer create flat electronic bands at the valence band edge.", "Establishes a new strategy for electronic structure engineering using molecular self-assembly on reactive 2D surfaces."]}}, {"title": "Momentum-Resolved Kondo Hybridization of Nonsymmorphic Dirac-Derived Bands in CeAgBi2", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2611.10417", "authors": "Yang Luo, Hao Liu, Zhong-Tuo Fu, et al.", "last_authors": "Yu-Xia Duan, Jian-Qiao Meng", "summary": "How symmetry-constrained conduction states acquire heavy-quasiparticle character is a central question in correlated quantum materials. Combining angle-resolved photoemission spectroscopy, Ce $4d \\rightarrow 4f$ resonant photoemission, and first-principles calculations, we investigate the nonsymmorphic Kondo lattice CeAgBi$_2$. We identify quasi-two-dimensional Bi-square-net-derived bands consistent with calculated Dirac crossings and nodal lines. Resonant photoemission resolves a nearly dispersionless Ce 4$f$ band near the Fermi level, establishing Kondo heavy-quasiparticle states. Its pronounced momentum-dependent spectral weight at intersections with the identified Dirac-derived branches provides direct spectroscopic evidence for their participation in $c$-$f$ hybridization. Complementary measurements on independently cleaved samples and an effective hybridization model connect these branches to the Kondo heavy-quasiparticle spectrum. The combined results support preservation of nonsymmorphic Dirac-band connectivity under Kondo renormalization, showing how symmetry-constrained conduction states become constituents of correlated heavy quasiparticles.", "tier": "A_MUST_READ", "score": "10", "reason": "Direct ARPES/resonant photoemission study on Kondo hybridization in Dirac systems; highly relevant.", "tags": ["ARPES", "Kondo", "Dirac", "correlated"], "image": "https://arxiv.org/html/2611.10417v1/Fig01.png", "briefing": {"background": "무거운 페르미온(heavy fermion) 시스템은 f-전자의 국소 모멘트와 전도 전자가 하이브리드화(c-f hybridization)되어 유효 질량이 매우 큰 준입자를 형성하는 계입니다. 최근에는 이러한 콘도 효과가 Dirac semimetal과 같은 위상학적 밴드 구조와 결합했을 때 나타나는 현상이 큰 관심을 받고 있습니다.", "motivation": "비대칭(nonsymmorphic) 공간군 대칭성을 가진 CeAgBi2 물질에서, 대칭성에 의해 보호되는 Dirac 밴드가 콘도 하이브리드화에 어떻게 참여하고, 무거운 준입자 상태가 형성된 후에도 그 토폴로지가 유지되는지 규명하고자 합니다.", "result": "ARPES와 Ce 4d-4f 공명 광전자 분광을 통해, Bi 사각 망 유래의 Dirac 교차 및 노달 라인(nodal line) 밴드를 확인했습니다. 특히 페르미 준위 근처에서 거의 분산이 없는 Ce 4f 상태를 관측했으며, 이 4f 전하가 Dirac 밴드와 교차하는 지점에서 강한 운동량 의존적 하이브리드화가 일어남을 직접 확인했습니다.", "implication": "콘도 상호작용으로 인해 밴드 질량이 매우 무거워졌음에도 불구하고, 비대칭 대칭성에 의해 강제된 Dirac 밴드의 연결성(connectivity)이 파괴되지 않고 유지됨을 보여줍니다. 이는 '위상학적 무거운 페르미온' 상태의 존재를 뒷받침하는 강력한 증거입니다.", "novelty": "운동량 분해 능력을 가진 ARPES를 사용하여, 단순히 벌크 특성이 아닌 특정 Dirac 밴드가 콘도 하이브리드화의 주역임을 시각화했습니다. 이는 사용자의 관심사인 'ARPES', 'Dirac semimetal', 'Kondo lattice'를 완벽하게 관통하는 결과입니다.", "unresolved": "이러한 하이브리드화가 CeAgBi2의 자기 질서(AFM 등)와 어떻게 경쟁하거나 공존하는지, 그리고 외부 자기장에 의한 위상 상태의 전이 가능성이 남아 있습니다.", "future_work": "자기장 하에서의 ARPES 측정을 통한 하이브리드화 갭의 변화 관찰 및 다른 비대칭 콘도 격자 후보 물질에서의 보편성 확인 연구가 기대됩니다.", "concepts": [{"term": "콘도 격자 (Kondo Lattice)", "why_emerged": "희토류 원소의 국소적인 f-전자가 주기적으로 배열된 계에서 전도 전자와의 다체 상호작용을 설명하기 위해 도입되었습니다.", "origin": "1960년대 Jun Kondo의 단일 불순물 모델을 격자로 확장하여 1970년대 Doniach 등에 의해 논의되었습니다.", "connections": "무거운 페르미온, 비전통적 초전도, 양자 임계점과 연관됩니다."}, {"term": "비대칭 대칭성 (Nonsymmorphic Symmetry)", "why_emerged": "단순한 회전이나 반사 외에 격자 변환(glide plane, screw axis)이 결합된 대칭성으로, 브릴루앙 영역 경계에서 밴드 축퇴(band degeneracy)를 강제하는 역할을 합니다.", "origin": "결정학의 공간군 이론에서 유래했습니다.", "connections": "디락 Semimetal, 위상 절연체의 필수적인 대칭성 요소 중 하나입니다."}, {"term": "디락 밴드 (Dirac Band)", "why_emerged": "질량이 없는 디락 방정식을 따르는 선형 분산 관계를 고체 내 전자 구조에서 구현하여 높은 이동도와 위상학적 특성을 얻기 위해 연구됩니다.", "origin": "그래핀의 전자 구조 연구에서 대중화되었습니다.", "connections": "Weyl semimetal, 베리 곡률, 양자 홀 효과와 깊은 관련이 있습니다."}, {"term": "c-f 하이브리드화 (c-f Hybridization)", "why_emerged": "전도 전자(c)와 국소 f-전자 간의 양자역학적 섞임을 통해 무거운 준입자가 형성되는 물리적 과정을 설명하기 위해 사용됩니다.", "origin": "Anderson Impurity Model 등 강상관 이론에서 정립되었습니다.", "connections": "Kondo 단열 상태, 무거운 페르미온 형성, 밴드 갭 생성(Kondo Insulator) 등에 핵심적입니다."}], "english_summary": ["Directly observes the momentum-resolved Kondo hybridization in the nonsymmorphic lattice CeAgBi2 using ARPES and resonant PES.", "Identifies Bi-derived Dirac bands and their strong interaction with the dispersionless Ce 4f states near the Fermi level.", "Demonstrates that the symmetry-constrained Dirac connectivity is preserved even after heavy quasiparticle renormalization.", "Provides spectroscopic evidence for the formation of correlated heavy fermions from topological conduction bands."]}}, {"title": "Photoemission tomography of excitons: Momentum-space signatures of correlated electron-hole wave functions", "journal": "PRB_Recent", "source": "keyword", "link": "http://link.aps.org/doi/10.1103/z2w9-2q3c", "authors": "Siegfried Kaidisch, Amir Kleiner, Sivan Refaely-Abramson, Peter Puschnig, Christian S. Kern", "last_authors": "Peter Puschnig, Christian S. Kern", "summary": "The momentum-space signatures of excitons can be experimentally accessed through time-resolved (pump-probe) photoelectron spectroscopy. In this work, we develop a computational framework for exciton photoemission orbital tomography (exPOT) in periodic systems, enabling the simulation and interpretation of experimental observables within many-body perturbation theory. By connecting the G W + Bethe-Salpeter equation (BSE) approach to photoemission tomography, our formalism captures exciton photoemission in periodic systems, explicitly incorporating photoemission matrix element effects induced by the light-matter interaction via the probe pulse. The correlated nature of electrons and holes introduces distinct consequences for excitonic photoemission. Using the prototypical two-dimensional material hexagonal boron nitride, we demonstrate these effects, including a dependence of the photoemission angular distribution on the pump pulse polarization. Moreover, our framework extends to excitons with finite center-of-mass momentum, making it well-suited to studying momentum-dark excitons. This provides valuable insights into the microscopic nature of excitonic phenomena in quantum materials.", "tier": "A_MUST_READ", "score": "9", "reason": "title strong match: photoemission", "tags": ["photoemission", "correlated"], "image": "", "briefing": {"background": "엑시톤(exciton)은 고체 내 전자와 홀의 결합체로, 광학적 성질을 결정하는 핵심적인 다체(many-body) 상태입니다. 최근 시간 분해 광전자 분광학(tr-ARPES)의 발전으로 이러한 엑시톤의 운동량 공간 정보를 실험적으로 얻을 수 있게 되었으나, 실험 데이터를 이론적으로 해석하고 복잡한 파동함수의 상관관계를 정밀하게 도출하는 것은 여전히 어려운 과제입니다.", "motivation": "본 연구는 다체 섭동 이론인 GW+BSE 계산법과 광전자 방출 단층촬영(Photoemission Tomography, POT) 기술을 결합하여, 주기적 시스템에서 엑시톤의 파동함수를 운동량 공간에서 시뮬레이션하고 해석할 수 있는 전산 프레임워크인 exPOT를 개발하고자 했습니다.", "result": "연구팀은 대표적인 2D 물질인 육각형 질화붕소 : "Timo Wirth, Jonas Heimerl, Stefan Meier, Peter Hommelhoff", "last_authors": "Stefan Meier, Peter Hommelhoff", "summary": "Electrons photoemitted by strong laser fields can rescatter, generating attosecond high harmonics. Spectral peaks arise from inter- and intracycle interference of coherent electron wave packets. While intercycle interference is well known, intracycle interference of plateau electrons has not been ob…", "tier": "A_MUST_READ", "score": "9", "reason": "title strong match: photoemission", "tags": ["photoemission"], "image": "", "briefing": {"background": "강한 레이저 펄스가 금속 표면에 조사되면 전자가 방출되고, 이 전자는 레이저 전기장에 의해 다시 표면으로 가속되어 충돌하는 '재산란(rescattering)' 과정을 거칩니다. 이 과정에서 발생하는 양자 간섭 현상은 아토초(attosecond) 수준의 초고속 물리 현상을 이해하는 핵심 기전입니다.", "motivation": "레이저 주기의 서로 다른 시점에서 방출된 전자 파동 패킷 간의 간섭(intercycle interference)은 잘 알려져 있으나, 동일한 주기 내에서 발생하는 간섭(intracycle interference)은 실험적으로 관찰하기가 매우 까다로웠습니다.", "result": "연구진은 나노 크기의 텅스텐 바늘 팁(needle tip)을 사용하여 강한 장(strong-field) 광전자 방출 실험을 수행했습니다. 그 결과, 에너지 스펙트럼의 '플래토(plateau)' 영역에서 전자의 주기 내 간섭에 기인한 미세한 스펙트럼 구조를 명확히 관측하는 데 성공했습니다.", "implication": "금속 나노 구조에서 발생하는 광전자 방출의 양자 역학적 경로를 정밀하게 제어하고 관측할 수 있음을 보여주었으며, 이는 고체 기반의 아토초 광과학 발전에 기여할 것입니다.", "novelty": "재산란된 전자가 보여주는 주기 내 간섭 현상을 금속 나노 팁 시스템에서 최초로 입증한 연구입니다. 광전자 방출의 근본적인 양자 간섭 기작을 다룬다는 점에서 실험 물리학자에게 흥미로운 주제입니다.", "unresolved": "나노 팁 끝부분의 기하학적 형상 변화가 간섭 패턴의 안정성에 미치는 영향과 공간 전하(space charge) 효과에 의한 왜곡 가능성이 논의될 필요가 있습니다.", "future_work": "간섭 제어를 통한 새로운 형태의 초고속 전자 소스 개발 및 고차 조화파 생성(HHG)과의 상관관계 연구가 예상됩니다.", "concepts": [{"term": "Intracycle Interference", "why_emerged": "단일 레이저 주기 내에서 서로 다른 경로를 거친 전자 파동의 간섭을 설명하기 위해 도입되었습니다.", "origin": "초록 정보만으로는 특정하기 어려움 (강전장 물리 분야의 이론적 예측)", "connections": "재산란 모델(Rescattering model), 아토초 펄스 생성과 관련이 깊습니다."}, {"term": "Rescattering", "why_emerged": "강한 장에서 방출된 전자가 높은 에너지를 얻는 과정을 설명하기 위해 필요합니다.", "origin": "Paul Corkum (1993년 제안)", "connections": "High-harmonic generation (HHG), Above-threshold ionization (ATI)의 핵심 원리입니다."}], "english_summary": ["Observed intracycle interference of plateau electrons in strong-field photoemission from a tungsten needle tip.", "Demonstrated coherent electron wave packet dynamics on sub-laser-cycle timescales.", "Provided experimental evidence of quantum interference pathways in electron rescattering processes.", "Advanced the understanding of attosecond electron dynamics at metal-vacuum interfaces."]}}, {"title": "Imaging the topological sign of a Dirac mass with spin-polarized tunneling", "journal": "arXiv_CondMat", "source": "author whitelist", "link": "https://arxiv.org/abs/2610.17464", "authors": "Payman Kazemikhah, Ruolun Zhang, Byunghoon Kim, et al.", "last_authors": "Md. Shafayat Hossain, M. Zahid Hasan", "summary": "A Dirac mass is characterized not only by its magnitude but also by its sign, which influences the Berry curvature, Hall response, and the propagation direction of chiral boundary modes. However, local spectroscopy of magnetic topological surfaces has so far accessed only the gap magnitude $|M|$. Here we show how the topological sign of $M$ can be determined locally. We first establish the sign information that spin-resolved tunneling can access and the reference required to obtain an absolute Hall sign. Although spin--orbital entanglement generally obscures the relation between measured spin and Dirac pseudospin, crystalline rotation symmetry alleviates this ambiguity at the band edge. On a $C_3$ axis, an axial tip couples to a fully spin-polarized state whose tunneling asymmetry directly reveals the sign of the occupied-band Berry curvature, independent of orbital composition. We further show that the zeroth Landau level provides an independent mass-sign measurement with an unpolarized tip, while opposite domains and their chiral domain-wall modes provide self-consistency checks. These results pave the way for imaging the locations where the topological character changes within a material, rather than merely identifying where a spectral gap appears.", "tier": "A_MUST_READ", "score": "9", "reason": "author whitelist: M. Zahid Hasan", "tags": ["Dirac", "Berrycurvature", "topological", "Landaulevel"], "image": "https://arxiv.org/html/2610.17464v2/fig1_schematic.png", "briefing": {"background": "디락 물질(Dirac materials)의 물리적 성질은 디락 질량(Dirac mass)의 크기뿐만 아니라 그 '부호(sign)'에 의해서도 결정됩니다. 질량의 부호는 베리 곡률(Berry curvature)과 위상적 홀 반응(Hall response)의 방향을 결정하며, 이는 물질의 위상적 특성을 정의하는 본질적인 요소입니다.", "motivation": "지금까지의 STM(주사 터널링 현미경) 분광학은 주로 에너지 갭의 크기($|M|$)만을 측정해 왔습니다. 본 연구는 국소적인 터널링 측정을 통해 디락 질량의 부호를 직접 판별할 수 있는 방법론을 수립하고자 했습니다.", "result": "M. Zahid Hasan 그룹은 $C_3$ 회전 대칭성이 있는 결정축에서 스핀 분해 STM(SP-STM)을 사용할 경우, 터널링 비대칭성이 점유 밴드의 베리 곡률 부호를 직접적으로 드러낸다는 것을 이론 및 실험적으로 입증했습니다. 또한, 0번 랜다우 준위(LL0)의 거동을 통해 이를 독립적으로 검증했습니다.", "implication": "이 기술을 통해 물질 내에서 위상적 성질이 변하는 지점(도메인 벽 등)을 단순히 갭의 유무가 아니라 위상적 부호의 변화로 매핑할 수 있게 되었습니다. 이는 위상 물질 연구의 정밀도를 한 차원 높이는 결과입니다.", "novelty": "독자가 주목하는 M. Zahid Hasan 그룹의 최신 성과로, ARPES와 상호보완적인 STM을 통해 '위상 부호'를 직접 이미징했다는 점이 혁신적입니다. 특히 카고메 금속이나 자기 위상 절연체 연구에 즉각 적용 가능한 기법입니다.", "unresolved": "스핀-궤도 결합과 궤도 구성이 복잡한 다른 대칭성($C_2$, $C_4$ 등)의 시스템으로 이 방법론을 확장하는 문제가 남아 있습니다.", "future_work": "다양한 자기 위상 물질에서 반대되는 위상 도메인 간의 경계면과 그곳에서 발생하는 키랄 에지 상태(chiral edge modes)의 직접 관측이 기대됩니다.", "concepts": [{"term": "Dirac mass sign", "why_emerged": "위상 절연체나 위상 반금속에서 밴드 반전(band inversion) 여부와 위상 불변량을 결정하기 위해 중요합니다.", "origin": "초록 정보만으로는 특정하기 어려움 (Haldane model 등에서 유래)", "connections": "Berry curvature, Chern number, Anomalous Hall effect와 직결됩니다."}, {"term": "Zeroth Landau Level (LL0)", "why_emerged": "자기장 하에서 디락 페르미온의 독특한 양자화 거동을 설명하며, 질량 부호에 민감하게 반응합니다.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "Quantum Hall effect, Dirac semimetals, Landau level spectroscopy와 연관됩니다."}, {"term": "Spin-resolved tunneling asymmetry", "why_emerged": "스핀과 궤도 자유도가 얽힌 시스템에서 위상적 정보를 추출하기 위한 정밀한 측정 수단으로 제안되었습니다.", "origin": "본 연구 (Md. Shafayat Hossain, M. Zahid Hasan 등)", "connections": "SP-STM, Berry curvature mapping, Dirac pseudospin과 연결됩니다."}], "english_summary": ["Demonstrated a method to locally determine the topological sign of Dirac mass using spin-polarized STM.", "Showed that tunneling asymmetry on a $C_3$ axis directly reveals the sign of the occupied-band Berry curvature.", "Validated the mass-sign measurement independently through the behavior of the zeroth Landau level.", "Enabled the spatial imaging of topological character changes within materials beyond simple gap identification."]}}, {"title": "Orbital texture of valence band and interband transitions of the type-II multiferroic van der Waals NiI2", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2611.11425", "authors": "A. De Vita, O. E. Giehl, T. Mukherjee, M. Wolf, L. Rettig, R. Ernstorfer, T. Pincelli, L. T. Lloyd", "last_authors": "L. Rettig, R. Ernstorfer, T. Pincelli, L. T. Lloyd", "summary": "NiI$_2$ is a van der Waals semiconductor characterized by complex electronic and magnetic phases, holding promise towards functional applications. For this purpose, a detailed understanding of its band structure and its excitations is essential to elucidate the electronic and transport properties. We present a comprehensive description of the band structure and of the lowest valence-to-conduction band transition in bulk NiI$_2$, by means of time- and angle-resolved photoemission spectroscopy supported by first-principles calculations. We describe the orbital character of Ni and I manifolds, and identify the main momentum-resolved features of the valence band and the shallow minima of the conduction band. With this study, we provide a foundational understanding of the electronic structure of NiI$_2$ and its single-particle interband electronic excitation, a benchmark for theoretical models, and a framework for future investigations on this material.", "tier": "A_MUST_READ", "score": "9", "reason": "Experimental ARPES study on the electronic structure of a van der Waals multiferroic material.", "tags": ["ARPES", "electronicstructure", "vanderWaals", "multiferroic"], "image": "https://arxiv.org/html/2611.11425v1/Fig1_r.png", "briefing": {"background": "NiI2와 같은 van der Waals 다강체(multiferroic) 물질은 전자 상관관계와 자기적 질서가 공존하여 차세대 기능성 소자 구현을 위한 후보군으로 주목받고 있습니다. 이들의 물리적 성질을 이해하려면 전자 구조에 대한 정확한 실험적 토대가 필수적입니다.", "motivation": "NiI2의 복잡한 전자/자기 위상을 이해하기 위해 가장 기초가 되는 밴드 구조와 원자가대-전도대 사이의 전자 전이 과정을 규명하고자 했습니다.", "result": "TR-ARPES 및 제일원리 계산을 통해 NiI2의 벌크 밴드 구조, Ni 및 I 오비탈의 기여도, 그리고 원자가대와 전도대 최소점의 운동량 분해 특성을 명확히 밝혀냈습니다.", "implication": "NiI2의 전자 구조에 대한 벤치마크 데이터를 제공함으로써, 향후 해당 물질의 수송 특성 연구와 이론적 모델링의 기준점이 마련되었습니다.", "novelty": "다강체 특성을 가진 van der Waals 물질에서 오비탈 텍스처를 포함한 상세한 전자 구조를 분광학적으로 규명했다는 점이 중요합니다. 특히 ARPES를 주력으로 하는 연구자에게는 NiI2의 다체 물성 연구를 위한 필수 데이터가 될 것입니다.", "unresolved": "이 연구는 단일 입자(single-particle) 여기를 중심으로 설명하고 있으며, 강한 상관관계에 의한 다체 효과의 구체적인 기여도는 완전히 분리되지 않았습니다.", "future_work": "도핑이나 외부 자극에 따른 전자 구조 변화, 그리고 자기 질서가 밴드 구조에 미치는 상세한 영향에 대한 후속 연구가 필요합니다.", "concepts": [{"term": "Multiferroic", "why_emerged": "강자성과 강유전성 등 여러 질서 변수가 동시에 존재하는 물질에서 새로운 물성을 찾기 위해 필요함.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "자기-전기 결합 효과, 스핀-궤도 결합(SOC)과 관련됨."}, {"term": "TR-ARPES", "why_emerged": "평형 상태뿐만 아니라 레이저 펌핑을 통해 들뜬 상태의 전자 동역학을 관측하기 위해 필수적임.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "Ultrafast spectroscopy, nonequilibrium dynamics."}], "english_summary": ["NiI2 is a van der Waals multiferroic with complex phases requiring detailed band structure mapping.", "The authors used TR-ARPES and DFT to resolve Ni and I orbital contributions to the band manifold.", "Results define the valence-to-conduction interband transitions and provide a foundation for future transport models.", "This study establishes essential benchmark data for understanding electronic excitations in layered multiferroics."]}}, {"title": "Out-of-plane interference effects in the angle-resolved photoemission of epitaxial graphene", "journal": "arXiv_CondMat", "source": "keyword", "link": "https://arxiv.org/abs/2611.12733", "authors": "E. Favorite, P. Kr\\\"uger, Ph. Rosenzweig, R. Joshi, S. Williams, B. Matta, K. K\\\"uster, M. Hashimoto, U. Starke, H. Nakamura", "last_authors": "K. K\\\"uster, M. Hashimoto, U. Starke, H. Nakamura", "summary": "The epitaxial growth of monolayer graphene by Si sublimation of 6H-SiC(0001) is one of the most effective ways of producing large-scale monocrystalline graphene samples of high quality. However, graphene is left interacting with a reconstructed carbon buffer layer known as zerolayer graphene (ZLG) and the SiC substrate underneath. Beyond the mere creation of Dirac cone replicas, the effect of this interaction on photoemission measurements is poorly understood. We utilized synchrotron radiation for photon-energy-dependent angle-resolved photoemission spectroscopy (ARPES) to investigate the complex final-state interactions of photoelectrons within the heterostructure of monolayer graphene, ZLG, and SiC. We identify multiple resonances in the photoemission intensity of the Dirac cone as a function of photon energy that originate from interlayer interference, confirmed with a multiple scattering model. We also demonstrate for the first time that the relative intensity of the replica bands induced by the $(6\\sqrt{3} \\times 6\\sqrt{3})\\text{R}30^\\circ$ reconstruction scales with the electron kinetic energy. Finally, we resolved four nondispersing electronic states, which originate from the ZLG. Our findings show that the three-dimensional (3D) structure of SiC and ZLG manifests itself in the photoemission from two-dimensional (2D) epitaxial graphene. By revealing how 3D substrate architecture dictates the photoemission of a 2D layer, this work establishes a crucial framework for investigating the electronic structure of complex heterostructures via ARPES.", "tier": "A_MUST_READ", "score": "9", "reason": "title strong match: angle-resolved photoemission", "tags": ["ARPES", "angle-resolvedphotoemission", "photoemission", "STS", "Dirac", "graphene", "monolayer", "heterost superconductivity in La5Ni4O10.", "Single crystals synthesized via topotactic reduction of RP nickelates.", "Tc ~ 18K with evidence of bulk pairing and coexistence with a density-wave transition.", "Demonstrates layer-dependent superconductivity without epitaxial strain."]}}, {"title": "Imaging spin entanglement with a scanning tunneling microscope", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2611.10946", "authors": "J. C. G. Henriques, B. Vi\\~na-Baus\\'a, I. Brihuega, J. Fern\\'andez-Rossier", "last_authors": "J. C. G. Henriques, B. Vi\\~na-Baus\\'a, I. Brihuega, J. Fern\\'andez-Rossier", "summary": "Artificial spin arrays assembled on surfaces enable atomic-scale studies of quantum correlations. Here we establish a hierarchy of connections between spin inelastic electron tunneling spectroscopy (IETS) and entanglement in spin- 1 / 2 1/2 systems. We first show that the number of spectroscopically active transitions in a spin- 1 / 2 1/2 dimer serves as an entanglement witness. Using the leading-order tunneling conductance for the tip placed on spin i i , d ​ I ​ ( i ) / d ​ V dI(i)/dV , we then relate spectral moments ℳ ( n ) ​ ( i ) = ∫ V n ​ ( d 2 ​ I ​ ( i ) / d ​ V 2 ) ​ 𝑑 V \\mathcal{M}^{(n)}(i)=\\int V^{n}(d^{2}I(i)/dV^{2})\\,dV to quantum correlations. The zeroth moment probes the one-tangle in systems with a gapped, nondegenerate ground state. For rotationally invariant Heisenberg systems, the first moment yields thermal spin correlators ⟨ 𝑺 ⁡ ( i ) ⋅ 𝑺 ⁡ ( j ) ⟩ \\langle\\boldsymbol{S}(i)\\cdot\\boldsymbol{S}(j)\\rangle , enabling reconstruction of nearest-neighbor concurrence and spatial imaging of entanglement in spin chains. It also provides access to the internal energy and magnetic specific heat, both usable as entanglement witnesses. Applying this approach to experimental IETS data from nanographene spin chains, we find good agreement with theory. We further discuss how the second moment probes longer-range correlations and the inverse moment relates to local spin susceptibility. For spin- 1 / 2 1/2 trimers, we connect inter-multiplet inelastic spectral weight to genuine tripartite entanglement quantified by the concurrence fill. Finally, we reconcile the local character of IETS with its sensitivity to nonlocal entanglement through an analogy with digital quantum circuits, where Hamiltonian evolution implements multiqubit operations. These results establish IETS as a tool for quantifying and imaging entanglement in engineered on-surface spin systems.", "tier": "B_IMPORTANT_CONDMAT", "score": "9", "reason": "Direct relevance: connects STM-IETS experiment to imaging spin entanglement and correlations in graphene.; demoted from A: broad CM, not direct user/project hit", "tags": ["STM/STS", "graphene", "quantumentanglement", "spinsystems", "experimentaltechnique"], "image": "https://arxiv.org/html/2611.10946v1/Figure_AA_AB_step_height.png", "briefing": {"background": "원자 단위로 조립된 스핀 배열은 양자 상관관계를 연구하는 강력한 플랫폼입니다. 하지만 국소적인 STM 탐침으로 비국소적인 양자 얽힘(entanglement)을 직접 관측하는 것은 매우 어려운 과제입니다.", "motivation": "스핀 비탄성 전자 터널링 분광법(IETS)의 터널링 전도도 데이터로부터 스핀 얽힘을 직접 추출하고 영상화할 수 있는 이론적 틀을 구축하고자 합니다.", "result": "IETS의 분광 모멘트(spectral moments)가 스핀 1/2 시스템에서 얽힘의 척도(witness)로 작용함을 증명했습니다. 0차 모멘트는 'one-tangle'을, 1차 모멘트는 근접 스핀 간의 상관관계를 나타내며, 이를 나노그래핀 스핀 체인 데이터에 적용하여 성공적으로 얽힘을 영상화했습니다.", "implication": "STM이 단순한 국소 구조 분석 도구를 넘어, 엔지니어링된 양자 스핀 시스템에서 비국소적 양자 정보를 직접 추출하는 분석 도구로 격상될 수 있음을 보여줍니다.", "novelty": "기존의 물리적 성질 측정에 국한되었던 STM-IETS를 양자 정보 이론과 결합하여, 스핀 시스템의 얽힘을 정량화하는 새로운 영상화 기법을 제시했다는 점이 독창적입니다.", "unresolved": "이 방법은 주로 스핀 1/2 시스템에 최적화되어 있으며, 더 복잡한 스핀 상태나 강한 외부 환경 노이즈가 존재하는 환경에서의 정밀도는 추가 연구가 필요합니다.", "future_work": "더 긴 범위의 상관관계 분석을 위한 고차 모멘트의 활용법 고도화 및 나노 소자에서의 양자 얽힘 제어 실험으로의 확장.", "concepts": [{"term": "IETS (Inelastic Electron Tunneling Spectroscopy)", "why_emerged": "분자의 진동 모드나 스핀 상태의 여기 에너지를 고해상도로 분석하기 위해 필요합니다.", "origin": "Lamb와 Jaklevic (1966년)에 의해 실험적으로 처음 보고되었습니다.", "connections": "STM-STS, 스핀 분광학, 양자 점 접촉 연구와 연결됩니다."}, {"term": "Entanglement Witness", "why_emerged": "양자 얽힘을 직접 측정하기 어려울 때, 특정 연산자의 기댓값이 특정 범위를 벗어나면 얽힘이 존재함을 보장하는 수학적 도구로 고안되었습니다.", "origin": "초록 정보만으로는 특정하기 어려움 (일반적으로 양자 정보 이론의 표준 개념).", "connections": "Bell 부등식, 양자 상태 단층 촬영(Quantum State Tomography)과 관련이 있습니다."}], "english_summary": ["Establishes a theoretical framework to relate STM-IETS spectral data to spin entanglement.", "Demonstrates that spectral moments of IETS conductance act as witnesses for quantum correlations.", "Successfully applies this method to image spin entanglement in nanographene spin chains.", "Proposes STM as a functional tool for quantifying non-local entanglement in on-surface spin systems."]}}, {"title": "Quartet ferromagnetism in the small-exchange limit", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2611.10512", "authors": "Samuel Ogundeji, Tianxiong Han, Tyler J. Slade, et al.", "last_authors": "Robert J. McQueeney, Aashish Sapkota", "summary": "Rare-earth magnets are often regarded as classical owing to their large angular momentum J, but this picture breaks down when exchange is smaller than the crystalline electric-field (CEF) energy scale, allowing the degeneracy of low-lying CEF manifolds to dictate the emergent quantum phases. Here, we uncover such a regime in the RV6Sn6 (R = rare-earth) kagome metals with strong magnetic anisotropy. Thermodynamic and neutron-diffraction measurements reveal successive axial and tilted ferromagnetic (FM) phases in DyV6Sn6, arising from independent ordering of the axial Mz and transverse Mx dipolar components enabled by a rare quasi-quartet ground state. On the other hand, HoV6Sn6 has a similar tilted magnetic anisotropy, but remains axial down to 0.03 K. This discrepancy can be traced back to the non-Kramers nature of Ho3+ where the CEF lifts the quartet degeneracy, leaving a quasi-triplet ground state. Unlike quartets or higher multiplets, we find that the effective spin-1 triplet does not  polymorph", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/m2js-yzky", "authors": "Vignesh Sundaramurthy, Abhi Suthar, Pascal Puphal, et al.", "last_authors": "Bernhard Keimer, Matthias Hepting", "summary": "Ruddlesden-Popper (RP) nickelates have attracted intense interest following the discovery of superconductivity in several members of the series, including bilayer (BL) La 3 Ni 2 O 7 , trilayer (TL) La 4 Ni 3 O 10 , and structural polymorphs composed of monolayer-bilayer or monolayer-trilayer (ML-TL) units. However, an inherent propensity of the RP series to form intergrown phases during single-crystal synthesis, together with spatial variations in oxygen stoichiometry, has complicated the determination of their intrinsic material properties. As a consequence, conflicting reports have emerged on both their electronic phase transitions and lattice dynamics. In this work, we perform a comparative study of the phononic and electronic Raman responses of high-quality ML-TL single crystals and contrast them with those of the other RP nickelates, using samples with optimized oxygen content. We establish several Raman spectral features that enable unambiguous phase identification across the series. Moreover, we uncover characteristics in the phononic and electronic Raman response of ML-TL that are not reflected in the pure ML and TL compounds. We attribute these differences to a distinctive electronic structure arising from self-doping and confinement effects induced by the ML unit within the ML-TL lattice architecture.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Nickelates are a major area of interest in the user's broader topic list.", "tags": ["nickelates", "superconductivity", "Raman"], "image": "", "briefing": {"background": "Ruddlesden-Popper(RP) 니켈산염은 고온 초전도체인 구리산염의 대안으로 주목받고 있으며, 최근 층상 구조의 수에 따라 물리적 성질이 민감하게 변하는 것이 발견되었습니다.", "motivation": "단결정 합성 과정에서 발생하는 혼합 상(intergrowth)과 산소 불균일성 때문에 재료마다 보고되는 데이터가 충돌하여, 고품질 시료를 통한 명확한 위상 구분 기준이 필요했습니다.", "result": "라만 분광법을 사용하여 층상 구조(ML-TL)를 비파괴적으로 식별할 수 있는 분광학적 지표를 확립했으며, ML-TL 구조에서만 나타나는 특유의 전자적/격자적 응답을 확인했습니다.", "implication": "다양한 RP 니켈산염 시료의 품질 관리 및 상 구분 기준을 제시하며, 향후 물리적 특성 연구의 신뢰도를 높일 것으로 기대됩니다.", "novelty": "ML-TL 구조에서 나타나는 자기 도핑(self-doping)과 제한 효과(confinement effect)에 의한 독특한 전자 구조를 라만 응답으로 규명했습니다.", "unresolved": "이러한 전자 구조 변화가 어떻게 초전도 메커니즘 자체를 최적화하거나 억제하는지에 대한 정량적 분석은 추가 연구가 필요합니다.", "future_work": "ARPES를 통한 전자 밴드 구조 분석과 이 라만 특징 간의 상관관계를 직접 연결하는 연구가 요구됩니다.", "concepts": [{"term": "Ruddlesden-Popper 니켈산염", "why_emerged": "전이금속 산화물에서 층상 구조를 제어하여 새로운 전자적 상태를 유도하기 위해 연구됩니다.", "origin": "S. N. Ruddlesden and P. Popper (1958).", "connections": "La2NiO4, La3Ni2O7, 구리산염 유사체."}, {"term": "라만 분광법(Raman spectroscopy)", "why_emerged": "재료의 격자 진동(phonon) 및 전자적 여기(electronic excitation)를 비파괴적으로 분석하기 위해 사용됩니다.", "origin": "C. V. Raman (1928).", "connections": "전자 구조 분석, 강상관계 물질 연구."}], "english_summary": ["Comparative Raman study on high-quality Ruddlesden-Popper nickelates.", "Identified distinct phononic and electronic Raman signatures for phase identification.", "Revealed novel effects in ML-TL polymorphs driven by self-doping and confinement.", "Addresses conflicts in prior reports by standardizing phase characterization."]}}, {"title": "Correlated insulating states in twisted double bilayer graphene on CrOCl enhanced by interfacial charge transfer effect", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/4klk-mgwy", "authors": "Ning Ma, Zekang Zhou, Chiara Cocchi, et al.", "last_authors": "Jian-Hao Chen, Mitali Banerjee", "summary": "Here, the authors investigate electrical transport in twisted double bilayer graphene (TDBG) on the antiferromagnetic material CrOCl (COC). At ultrahigh magnetic fields, an enhanced correlated insulating state is observed at half-filling of TDBG, which is attributed to the charge transfer effect between TDBG and COC. The authors further characterize the behavior of the correlated state by systematic temperature- and magnetic-field dependent measurements. Their results highlight the interfacial charge-related effect as a promising approach to manipulating the correlated states in moiré systems.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Experimental study of moire systems and interfacial effects on correlated states.", "tags": ["moiré", "graphene", "correlatedelectrons"], "image": "", "briefing": {"background": "비틀린 층상 그래핀 구조(Moiré systems)는 강한 전자 상관관계를 구현하는 플랫폼으로, 계면 전하 이동 등을 통해 이 상태를 외부에서 조절하는 연구가 활발합니다.", "motivation": "비틀린 이중 이중층 그래핀(TDBG)과 외부 물질인 CrOCl(반강자성체) 간의 계면 상호작용이 Correlated Insulating State에 어떤 영향을 미치는지 규명하고자 했습니다.", "result": "CrOCl과의 계면에서 일어나는 전하 이동(charge transfer)이 고자기장 하에서 TDBG의 절연 상태를 강화함을 확인했습니다.", "implication": "계면 공학(Interface engineering)이 모아레 시스템의 강상관 상태를 미세하게 조정하는 강력한 도구가 될 수 있음을 시사합니다.", "novelty": "강자성이나 반강자성체와의 계면 결합을 통해 모아레 격자의 Correlated state를 능동적으로 제어할 수 있는 가능성을 제시했습니다.", "unresolved": "계면 전하 이동의 미시적 메커니즘과 그에 따른 밴드 구조의 국부적 변화에 대한 직접적인 시각화(STS 등)는 아직 부족합니다.", "future_work": "STS를 통한 국부적 상태 밀도 변화 관측이나 계면의 자기적 질서와 모아레 상관 상태의 상세한 커플링 연구가 필요합니다.", "concepts": [{"term": "비틀린 이중 이중층 그래핀(TDBG)", "why_emerged": "층 간 비틀림 각도를 조절하여 전자 밴드폭을 줄임으로써 상관관계 효과를 극대화하기 위해 설계됨.", "origin": "Pablo Jarillo-Herrero group (2018, twisted bilayer graphene).", "connections": "Flat bands, Van der Waals heterostructures."}, {"term": "계면 전하 이동(Interfacial charge transfer)", "why_emerged": "이종 물질 간의 일함수 차이를 이용하여 특정 층의 전하 밀도를 정밀하게 제어하기 위함.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "도핑 제어, 강상관계 절연체."}], "english_summary": ["Investigation of TDBG on the antiferromagnetic CrOCl substrate.", "Observed enhanced correlated insulating states at half-filling under high magnetic fields.", "Attributed the enhancement to interfacial charge transfer effects.", "Demonstrates interface engineering as a method to tune moiré-correlated systems."]}}, {"title": "Field-tuned and zero-field fractional Chern insulators in twisted bilayer graphene", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/gmtx-h1gs", "authors": "Daniel E. Parker, Patrick Ledwith, Eslam Khalaf, et al.", "last_authors": "Amir Yacoby, Ashvin Vishwanath", "summary": "In contrast to the fractional quantum Hall (FQH) effect, where electron density fixes the applied magnetic field, fractional Chern insulators (FCIs) can realize FQH states in comparatively weak or even zero magnetic fields. Previous theoretical work highlighted magic-angle graphene as a promising FC…", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Experimental-relevant study of fractional Chern insulators in moire systems.", "tags": ["graphene", "moire", "quantumHall"], "image": "", "briefing": {"background": "분수 양자 홀 효과(FQH)는 강한 자기장을 필요로 하지만, 분수 천 절연체(FCI)는 모아레 격자의 평탄한 밴드(flat bands)를 활용해 자기장 없이도 위상학적 분수화 상태를 구현할 수 있는 가능성을 제시합니다.", "motivation": "트위스티드 이중층 그래핀(TBG) 시스템에서 이론적으로 예측된 FCI 상태를 자기장 조건에 따라 어떻게 제어하고 관찰할 수 있는지 구체적인 물리적 조건을 규명하고자 합니다.", "result": "자기장 인가 여부와 관계없이 TBG 시스템에서 분수 천 절연체 상태가 존재할 수 있음을 이론적으로 검증하고, 실험적으로 관찰 가능한 물리적 환경을 제시했습니다.", "implication": "강한 자기장 없이도 분수 양자 홀 상태를 제어할 수 있다면, 양자 정보 처리 및 위상학적 소자 연구에 있어 획기적인 전환점이 될 것입니다.", "novelty": "외부 자기장 없이 구현되는 분수 위상 상태는 모아레 시스템의 밴드 엔지니어링 능력을 증명하며, 독자가 관심을 갖는 위상학적 물질의 새로운 플랫폼으로서의 가치가 큽니다.", "unresolved": "실제 실험적 측정에서 관찰되는 무질서(disorder)가 FCI 상태의 견고함에 미치는 영향은 여전히 논의가 필요합니다.", "future_work": "FCI 상태의 정밀한 전자기적 수송 특성 측정과 모아레 시스템 내에서의 자기적 특성 간의 상호작용 분석이 필요합니다.", "concepts": [{"term": "분수 천 절연체 (FCI)", "why_emerged": "자기장이 없어도 위상학적 질서를 가진 분수 상태를 구현하기 위해 필요함.", "origin": "초록 정보만으로는 특정하기 어려움 (통상 2011년경 연구들에 의해 확립됨).", "connections": "분수 양자 홀 효과, Chern 밴드, 평탄한 밴드(Flat band) 시스템."}, {"term": "모아레 (Moire)", "why_emerged": "밴드 구조를 인위적으로 조절하여 상관관계 효과를 극대화하기 위해 도입됨.", "origin": "MacDonald 등 (2011).", "connections": "트위스티드 이중층 그래핀, 초전도성, 상관관계 절연체."}], "english_summary": ["Investigates the feasibility of fractional Chern insulators (FCI) in twisted bilayer graphene.", "D ovides a theoretical perspective on unconventional pairing mechanisms in 2D van der Waals heterostructures."]}}, {"title": "Equivalence of pseudogap and pairing energy in a cuprate high-temperature superconductor", "journal": "Science", "source": "Gemini", "link": "https://www.science.org/doi/abs/10.1126/science.adt3444?af=R", "authors": "Jiasen Niu, Maialen Ortego Larrazabal, Thomas Gozlinski, et al.", "last_authors": "Ingmar Swart, Milan P. Allan", "summary": "The pseudogap stands out in the phase diagram of the cuprate high-temperature superconductors because its origin and relationship to superconductivity remain elusive. The origin of the pseudogap has been debated, with competing hypotheses attributing it to preformed electron pairs or local order, such as charge density waves. We present unambiguous evidence supporting the pairing scenario, using local shot-noise spectroscopy measurements in Bi 2 Sr 2 CaCu 2 O 8+δ . Our data demonstrate that the pseudogap energy coincides with the onset of electron pairing and is spatially heterogeneous with values reaching up to 70 milli–electron volts. Our results exclude a pure local order origin of the pseudogap, link the pseudogap to Cooper pair formation, and suggest that the limiting factor for higher critical temperature in cuprates is phase coherence.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Important experimental study on cuprate unconventional superconductivity electronic structure.", "tags": ["superconductivity", "cuprates", "electronic-structure"], "image": "", "briefing": {"background": "구리 산화물(Cuprates) 초전도체는 고온 초전도 연구의 핵심 물질이지만, 초전도 상태로 전이되기 전 '슈도갭(Pseudogap)' 상태가 왜 나타나는지, 그리고 이것이 초전도 페어링과 어떤 관계인지가 고체물리계의 수십 년 된 난제입니다.", "motivation": "슈도갭이 단순히 초전도 현상과 무관한 정적 국소 질서(예: 전하 밀도 파동, CDW)인지, 아니면 초전도 페어링의 전조(preformed pairs)인지를 명확히 규명하고자 했습니다.", "result": "Bi2Sr2CaCu2O8+δ 샘플에서 샷 노이즈 분광법(shot-noise spectroscopy)을 통해 슈도갭 에너지와 전자 쌍(Cooper pair) 형성이 공간적으로 일치함을 확인했습니다. 이는 슈도갭이 페어링과 직접적 관련이 있음을 보여줍니다.", "implication": "슈도갭의 기원이 페어링에 있다는 강력한 증거를 제시함으로써, 고온 초전도의 결정적 한계가 전자 쌍의 형성 자체가 아니라 그들의 위상 일치성(phase coherence)에 있음을 시사합니다.", "novelty": "지역적이고 직접적인 샷 노이즈 측정을 통해 기존의 에너지 스펙트럼 분석만으로는 구분하기 어려웠던 기작을 분리해냈습니다.", "unresolved": "페어링이 형성된 이후에도 왜 거시적인 초전도성이 나타나지 않는지에 대한 구체적인 '위상 일치성 결여'의 미시적 기제는 여전히 연구가 필요합니다.", "future_work": "다른 도핑 수준이나 구리 계열 이외의 고온 초전도체 물질에서 동일한 페어링 기작이 존재하는지 범위를 넓히는 연구가 필요합니다.", "concepts": [{"term": "Pseudogap", "why_emerged": "초전도 전이 온도 이상에서 발생하는 페르미 준위 주변의 부분적 에너지 갭을 설명하기 위해.", "origin": "초기 90년대 cuprate 연구에서 관측됨.", "connections": "Charge density waves, Mott insulators, superconductivity."}, {"term": "Shot-noise spectroscopy", "why_emerged": "전하 운반체의 전하량을 측정하여 페어링 상태(2e)를 직접적으로 증명하기 위해.", "origin": "초기 슈트키(Schottky) 등의 노이즈 연구에서 유래.", "connections": "Cooper pair tunneling, tunneling conductance."}], "english_summary": ["The study examines the origin of the pseudogap in Bi2Sr2CaCu2O8+δ.", "Shot-noise measurements show the pseudogap energy coincides with the onset of electron pairing.", "The results favor the preformed pair scenario over pure local order (CDW) models.", "The findings suggest phase coherence is the bottleneck for achieving higher critical temperatures."]}}, {"title": "2D coherent spectroscopy of topological insulators", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2611.10905", "authors": "Tha\\'{i}s V. Trevisan, Micha{\\l} Papaj", "last_authors": "Tha\\'{i}s V. Trevisan, Micha{\\l} Papaj", "summary": "Multidimensional coherent spectroscopy probes the response of a system to a sequence of time-separated light pulses, and has attracted significant interest in recent years. In the frequency space, it generates multidimensional spectra, in which information about different degrees of freedom of the system is generically disentangled. In this work, we develop a quantum geometric formulation of multidimensional optical susceptibilities in insulating systems. Focusing on a two-pulse setup and working in the velocity gauge, we derive analytical expressions for second-order and third-order two-dimensional coherent spectra (2DCS). We focus on the third-order ABB response, which remains finite in centrosymmetric systems where the second-order susceptibility vanishes by inversion symmetry. Its paramagnetic contribution supports an echo signal that probes products of four interband Berry-connection matrix elements, which reduce in two-band systems to bilinear combinations of the quantum geometric tensor of the occupied band. Using continuum and square-lattice models of two-dimensional Chern insulators, we show how the echo resolves the momentum-space sign structure of these geometric quantities. For the $xxyx$ response of the models considered, the number of nodes in the echo signal is related to the band topology. Our results extend the quantum-geometric interpretation of multidimensional spectroscopy to higher-order responses, showing that third-order 2DCS provides access to geometric structures beyond those probed at lower orders.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Theory proposing a 2D coherent spectroscopy method to experimentally probe Berry curvature and topology in TI/Chern insulators.", "tags": ["topologicalinsulators", "Cherninsulator", "Berrycurvature", "opticalspectroscopy", "theory"], "image": "https://arxiv.org/html/2611.10905v1/ResFig1v2.png", "briefing": {"background": "위상 절연체나 Chern 절연체와 같은 위상 물질의 복잡한 기하학적 정보(베리 곡률 등)를 비평형 광학 분광법을 통해 직접 관측하려는 시도가 활발합니다.", "motivation": "2차원 코히어런트 분광법(2DCS)을 통해 위상 절연체의 양자 기하학적 성질, 특히 베리 접속(Berry connection)과 관련된 위상 정보를 실험적으로 분리하여 측정하고자 합니다.", "result": "제3차 비선형 광학 응답이 반전 대칭성이 있는 시스템에서도 위상 정보를 추출할 수 있음을 이론적으로 증명했습니다. Echo 신호의 마디(node) 구조가 밴드 위상과 연결됨을 보였습니다.", "implication": "광학 분광법을 통해 물질의 내재적 위상 정보를 직접 읽어내는 새로운 실험적 진단 도구를 제시합니다. 이는 위상 물질의 비평형 제어와 특성 평가에 큰 전환점이 될 수 있습니다.", "novelty": "기존의 선형 응답만으로는 얻을 수 없었던 베리 접속의 고차 정보를 2차원 코히어런트 분광법으로 풀어냈으며, 특정 위상 인덱스(Chern 수 등)와의 직접적 연결 고리를 제공합니다.", "unresolved": "실제 실험적 펄스 시퀀스에서 신호대 잡음비를 확보하는 것과 샘플의 불균일성이 위상 정보 측정에 미치는 영향이 실질적인 제약 조건입니다.", "future_work": "다양한 위상 물질(Weyl 반금속 등)에 대한 실제 시간 분해 광학 실험을 통해 이 이론을 검증하는 연구가 뒤따라야 합니다.", "concepts": [{"term": "2D coherent spectroscopy (2DCS)", "why_emerged": "서로 다른 에너지 상태 간의 상관관계와 결맞음 시간을 시간 분해능으로 파악하기 위해.", "origin": "초기 핵자기 공명(NMR) 기법에서 영감을 얻음.", "connections": "Ultrafast laser spectroscopy, nonlinear optics."}, {"term": "Berry connection", "why_emerged": "운동량 공간에서 파동 함수의 기하학적 위상을 기술하기 위해.", "origin": "Michael Berry (1984).", "connections": "Anomalous Hall effect, topological insulators."}], "english_summary": ["The paper introduces a quantum geometric formulation for 2D coherent spectroscopy (2DCS).", "It shows that third-order 2DCS can extract topological information like the Berry connection.", "The theory demonstrates that echo signals in centrosymmetric insulators reveal band topology.", "This provides a potential experimental probe for geometric tensors in Chern insulators."]}}, {"title": "Ballistic transport through 3D flat bands in rhombohedral graphene in an in-plane magnetic field", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2611.11603", "authors": "Eran Sela, Rafi Bistritzer, Yuval Oreg", "last_authors": "Rafi Bistritzer, Yuval Oreg", "summary": "We explore how an in-plane magnetic field reshapes the transmitting channels of a finite slab of rhombohedral multilayer graphene and redistributes the current across its thickness. The two-terminal conductance counts these channels, while the voltage at each surface reflects the relative spectral weights of right- and left-moving states on the contacted layer. In sufficiently thick slabs or at sufficiently strong fields, the nearly flat bulk zeroth Landau level gives rise to a three-dimensional Hall effect with a plateau in the four-terminal Hall resistance.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Electronic transport and Hall effect in rhombohedral graphene, featuring 3D flat bands.", "tags": ["graphene", "transport", "flatband", "quantumHall"], "image": "https://arxiv.org/html/2611.11603v1/fig_1n.png", "briefing": {"background": "능형(rhombohedral) 그래핀 다층 구조는 특유의 쌓임 방식 때문에 밴드 구조의 가장자리에 평탄한 밴드(flat band)가 형성되며, 이는 강한 전자 상관관계를 유도할 수 있는 물리적 플랫폼을 제공합니다.", "motivation": "평탄한 밴드 시스템에서 자기장, 특히 면내 자기장이 가해질 때 그래핀 슬랩 내부의 전하 운반 채널이 어떻게 재구성되고 수송 특성이 변하는지 이론적으로 규명하고자 합니다.", "result": "면내 자기장이 0차 란다우 준위를 변조하여 3차원적 홀 효과를 유도하며, 이는 다층 그래핀 슬랩에서 홀 저항의 평탄화(plateau)로 나타남을 보였습니다.", "implication": "그래핀 다층 구조가 위상학적 수송 현상 및 3차원 양자 홀 효과를 구현하는 플랫폼으로 활용될 수 있음을 시사합니다.", "novelty": "기존의 2차원적인 란다우 준위 분석을 넘어, 다층 구조와 면내 자기장이 결합된 '3D flat band'라는 독특한 수송 환경을 이론적으로 제시했다는 점이 중요합니다.", "unresolved": "실제 실험에서 층 간의 결함이나 불균일한 포텐셜 분포가 이 평탄한 밴드 기반의 수송 현상에 미치는 영향은 아직 구체적으로 다루어지지 않았습니다.", "future_work": "실제 rhombohedral 다층 그래핀 소자 제작을 통한 3차원 홀 저항 평탄화 관측 실험 및 층 두께에 따른 위상학적 특성 변화 연구가 필요합니다.", "concepts": [{"term": "Rhombohedral graphene", "why_emerged": "기본적인 honeycomb 그래핀과 다른 ABC 쌓임 구조로 인해 독특한 저에너지 밴드 구조를 갖기 때문입니다.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "Bernal stacking 그래핀과의 비교 연구, 다층 그래핀의 상관관계 물리"}, {"term": "Flat band", "why_emerged": "전자 속도가 0에 가까워져 운동 에너지보다 상호작용 에너지가 지배적이 되는 상태를 구현하기 위해 필요합니다.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "무아레 초격자(moire superlattices), 양자 홀 효과, 강상관 전자계"}, {"term": "3D Hall effect", "why_emerged": "자기장 하에서 슬랩의 두께 방향으로 전하가 재분배되며 나타나는 벌크 수송 현상을 기술하기 위해 필요합니다.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "Weyl semimetals, 란다우 준위(Landau levels)"}], "english_summary": ["Explores ballistic transport in rhombohedral multilayer graphene under in-plane magnetic fields.", "Theoretical analysis shows that the zeroth Landau level of flat bands generates a 3D Hall effect.", "Voltage distribution across the slab thickness reflects the spectral weight of moving states.", "Suggests rhombohedral graphene as a candidate for studying 3D quantized transport."]}}, {"title": "Coherent Control of High-Order Lightwave Currents in Gate-Tunable Bilayer Graphene", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2611.11616", "authors": "Samuel Haeuser, Martin Mootz, Dasol Kim, et al.", "last_authors": "Long Ju, Jigang Wang", "summary": "The sub-cycle acceleration of charge carriers in an electronic circuit by tailored terahertz (THz) electric-field waveforms, rather than conventional pulsed bias voltages, opens a transformative frontier for lightwave electronics operating far beyond the scaling limits of gigahertz electronic technologies. Yet gate-tunable coherent control of multi-order and non-perturbative currents has remained elusive. Here, we demonstrate lightwave control over the amplitude, phase flips, and zero-crossings of THz field-driven high-order currents by utilizing phase-locked pairs of single-cycle THz fields in a dual-gated bilayer graphene (BLG) device. By leveraging the in-situ tuning of both bandgap and charge doping, we reveal extreme THz photocurrent rectification and sub-THz-cycle current generation that are governed by a strong field-driven crossover from interband multi-photon coherence to intraband lightwave acceleration, whose competition provides an exceptional sensitivity to the THz-pulse pair drive. Our interferometric nonlinear THz photocurrent spectroscopy of sub-cycle electronic excitations accesses and controls non-perturbative, multi-quantum photocurrents, which manifest as an extreme-order THz frequency comb. Quantum-kinetic simulations map these lightwave-controlled electron trajectories, revealing that sub-THz-cycle ballistic transport underpins gate- and THz-field-driven functionality enabled by electrostatic doping and bandgap tuning within the atomically thin device architecture. The demonstrated on-demand coherent control of nonperturbative photocurrent transport regimes can be extended to a broad range of atomically thin device architectures, opening new avenues for gate- and field-programmable logic, memory, and quantum simulators in which electronic pathways are steered on sub-cycle, petahertz timescales and atomic length scales.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Experimental study on lightwave control of currents in bilayer graphene, relevant to Floquet engineering.", "tags": ["graphene", "transport", "Floquetengineering", "nanophotonics"], "image": "https://arxiv.org/html/2611.11616v1/Fig_1_vf.png", "briefing": {"background": "THz 주파수 대역의 광파를 이용해 전자 회로 내 전하 캐리어를 제어하는 기술은 기존 GHz 전자 소자의 한계를 뛰어넘는 초고속 전자 소자 구현의 핵심입니다.", "motivation": "이중 게이트가 장착된 이중층 그래핀(BLG)에서 게이트 전압으로 대역폭과 도핑을 조절하며, THz 파동으로 전류를 정밀하게 제어할 수 있는지 실험적으로 확인하고자 합니다.", "result": "위상 고정된 THz 펄스 쌍을 이용하여 전류의 진폭, 위상 반전, 영점 교차를 비섭동적으로 제어하는 데 성공했습니다.", "implication": "초고속 광파 전자 소자(lightwave electronics)의 동작 원리를 확립하고, 원자 두께 소자에서 펨토초 단위의 전자 경로 제어 가능성을 입증했습니다.", "novelty": "기존의 정적인 제어를 넘어, 밴드갭과 도핑을 실시간으로 튜닝하며 THz 주파수 콤(comb)을 생성하는 비섭동적 제어를 시연했다는 점이 독보적입니다.", "unresolved": "고차 전류 생성이 실제 나노 소자 회로에서 어떠한 형태의 논리 연산이나 메모리 효율로 이어질지에 대한 구체적인 소자 구현은 숙제입니다.", "future_work": "제시된 제어 방식을 다른 vdW 헤테로구조에 적용하여 펨토초 단위의 프로그램 가능한 논리 소자 개발 연구가 이어질 것으로 보입니다.", "concepts": [{"term": "Floquet engineering", "why_emerged": "주기적인 외부 장(Field)을 가해 물질의 위상학적 성질이나 밴드 구조를 동적으로 변형시키기 위해 필요합니다.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "비평형 통계역학, 강한 레이저-물질 상호작용"}, {"term": "THz photocurrent", "why_emerged": "물질 내 전자의 응답 속도가 THz 시간 척도와 유사하여 초고속 동역학을 관측하는 데 유리하기 때문입니다.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "광전자 분광학, 초고속 분광학"}, {"term": "Non-perturbative currents", "why_emerged": "강한 전기장 하에서 섭동 이론으로 설명되지 않는 고차 비선형 광학 응답을 다루기 위해 필요합니다.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "비선형 광학, 하이 하모닉 생성(HHG)"}], "english_summary": ["Demonstrates coherent control of THz-driven currents in gate-tunable bilayer graphene.", "Utilizes phase-locked THz pulses to modulate amplitude, phase, and sub-cycle trajectories.", "Reveals a field-driven crossover between interband coherence and intraband acceleration.", "Enables petahertz-scale electronic steering for future lightwave logic and memory devices."]}}, {"title": "Discovery of Kondo-Kramers Nodal Line Topological State in strongly correlated material CeAuAl3", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2611.10368", "authors": "Hari Bhandari, Kevin Allen, Kuan-Sen Li, et al.", "last_authors": "Qimiao Si, Emilia Morosan", "summary": "Kramers nodal lines (KNLs) are predicted in all achiral, non-centrosymmetric crystal structures, and yet there are very few experimental realizations of KNLs, only in weakly correlated systems. Especially, their realization in strongly correlated systems remains unexplored. Here we investigate KNL topology in the non-centrosymmetric, achiral Kondo lattice CeAuAl$_3$, using magnetotransport, thermodynamic measurements, density functional theory (DFT), and tight-binding toy model calculations. We find that CeAuAl$_3$ hosts KNLs in the $\\mathit{\\Gamma}\\text{-}Z$ and $X\\text{-}P$ directions, protected by time-reversal and mirror symmetries. Breaking of these crystalline symmetries, along with time-reversal symmetry via spin polarization, lifts the KNL degeneracy, which, in turn, generates Berry curvature resulting in an intrinsic anomalous Hall effect (AHE). More importantly, CeAuAl$_3$ shows large AHE not only below the magnetic ordering temperature $T_N$ but rather below the Kondo temperature. This underscores the role of the Kondo correlations in bringing the KNLs at the Fermi surface rather than at accidental energies, as would be expected without correlations. Our work identifies a new topological state, Kondo-Kramers Nodal Line, with CeAuAl$_3$ being the first compound explicitly identified to host this new correlated topological state, and demonstrating the expected AHE associated with it. More generally, our work outlines the pathway for finding Kondo-KNL systems in all compounds that combine achiral, non-centrosymmetric structure with Kondo correlations.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Correlated topological material study with anomalous Hall effects and nodal lines.", "tags": ["topological", "Kondo", "Halleffect", "correlated"], "image": "https://arxiv.org/html/2611.10368v1/Fig1CeAuAl3.png", "briefing": {"background": "비중심대칭(non-centrosymmetric) 결정 구조에서는 대칭성 보호에 의해 발생하는 'Kramers Nodal Line(KNL)'이 존재할 수 있으며, 이는 위상학적 물성 연구의 새로운 영역입니다.", "motivation": "강상관 전자계인 CeAuAl3에서 KNL의 존재 여부를 확인하고, 이 현상이 Kondo 효과와 어떻게 상호작용하는지 규명하고자 합니다.", "result": "CeAuAl3가 Kondo-Kramers Nodal Line 상태를 가짐을 입증하고, 자기 정렬 이전의 Kondo 온도 영역에서 발생하는 비정상 홀 효과(AHE)를 관측했습니다.", "implication": "강상관성과 위상학적 노달 라인이 결합할 때 Kondo 효과가 페르미 표면 근처에서 위상학적 상태를 안정화하는 핵심 역할을 함을 보여줍니다.", "novelty": "강상관 물질에서 KNL을 명확히 규명한 최초의 사례이며, Kondo 상관관계가 위상학적 물성을 직접적으로 조절함을 밝혔다는 점에서 독창적입니다.", "unresolved": "KNL이 보호되는 대칭성이 완전히 깨질 때 Berry 곡률이 어떻게 정량적으로 진화하는지에 대한 상세한 기작은 추가 연구가 필요합니다.", "future_work": "다른 비중심대칭 Kondo 격자 물질들에서 유사한 KNL 탐색 및 ARPES를 통한 페르미 표면 밴드 구조의 직접적인 검증이 필요합니다.", "concepts": [{"term": "Kramers Nodal Line", "why_emerged": "시간 반전 대칭성이 있는 비중심대칭 구조에서 밴드 축퇴가 선 형태로 나타나는 위상학적 특성을 설명하기 위해 필요합니다.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "위상 절연체, 비중심대칭 초전도체"}, {"term": "Kondo effect", "why_emerged": "비자성 금속 내 자성 불순물과 전자의 상호작용으로 인한 저온에서의 전기 저항 급증 현상을 설명하기 위해 제안되었습니다.", "origin": "Jun Kondo (1964)", "connections": "강상관 전자계, 헤비 페르미온 시스템"}, {"term": "Anomalous Hall Effect (AHE)", "why_emerged": "강자성체 등에서 자성 정렬에 의해 Berry 곡률이 발생하여 외부 자기장 없이도 발생하는 홀 전압을 설명하기 위해 필요합니다.", "origin": "Edwin Hall (1881)", "connections": "Berry 위상, 비정상 Nernst 효과"}], "english_summary": ["Identifies Kondo-Kramers Nodal Lines in the strongly correlated material CeAuAl3.", "Shows that KNLs are protected by time-reversal and mirror symmetries.", "Reports intrinsic anomalous Hall effect emerging below the Kondo temperature.", "Establishes a new paradigm linking Kondo correlation with topological nodal line states."]}}, {"title": "Effect of Correlation on the Pressure-Induced Insulator to Metal Transition in Complex Spin-Orbit Coupled Double Perovskite La2CoIr1-xTixO6", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2611.11253", "authors": "Vineeta Yadav, Sromona Nandi, Rudra Sekhar Manna", "last_authors": "Sromona Nandi, Rudra Sekhar Manna", "summary": "We study the effect of electron correlation ($U$) and hydrostatic pressure on the electronic properties of double perovskites La$_2$CoIr$_{1-x}$Ti$_x$O$_6$ for $x$ = 0, 0.5, and 1, using first-principles electronic structure calculations within density functional theory (DFT). At ambient pressure, we systematically vary the electron correlation, i.e., on-site Coulomb interaction to study its effect on band gap and structural parameters. Increasing the value of $U$ enhances the band gap of all three compositions while producing only a slight variation in structural parameters. The effect of hydrostatic pressure is also studied for the same compositions. The estimated band gap values at ambient pressure closes at approximately 39, 42, and 53 GPa for $x$ = 0 (for $U_\\mathrm{Co}$ = 5 eV and $U_\\mathrm{Ir}$ = 2 eV), 0.5 (for $U_\\mathrm{Co}$ = 5 eV and $U_\\mathrm{Ir}$ = 2 eV), and 1 (for $U_\\mathrm{Co}$ = 4 eV), respectively, indicating pressure-induced insulator-to-metal transitions. These results show that electron correlation stabilises the insulating state, whereas hydrostatic pressure favours the metallic state by closing the band gap. These findings highlight the tunability of correlated oxides through electron correlations and pressure, offering insights for materials design.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "DFT study of correlated spin-orbit coupled perovskites, relevant to strongly correlated systems and electronic structure.", "tags": ["DFT", "stronglycorrelatedelectrons", "spin-orbitcoupling", "perovskites", "insulator-metaltransition"], "image": "https://arxiv.org/html/2611.11253v1/LCITO.png", "briefing": {"background": "강상관 전자계에서 전이 금속 산화물은 전자 간의 쿨롱 상호작용(U)과 스핀-궤도 결합(SOC)의 경쟁으로 인해 금속-절연체 전이(MIT)와 같은 다양한 물리적 현상을 보입니다. 이 연구는 이중 페로브스카이트 구조에서 이러한 상호작용이 어떻게 전기적 물성을 결정하는지 규명하려 합니다.", "motivation": "La2CoIr1-xTixO6 시스템에서 전자 상관관계(U)와 정수압이 밴드갭과 절연체-금속 전이에 미치는 개별적 및 복합적 영향을 이론적으로 계산하여 재료 설계의 가이드라인을 제시하고자 합니다.", "result": "전자 상관관계는 밴드갭을 넓혀 절연 상태를 안정화하는 반면, 정수압은 밴드갭을 닫아 금속 상태로 유도함을 확인했습니다. 39~53 GPa 범위에서 압력에 의한 절연체-금속 전이가 발생함을 보였습니다.", "implication": "강상관 산화물에서 압력과 상관관계 제어를 통해 전자 구조를 정밀하게 튜닝할 수 있음을 보여주며, 이는 향후 기능성 전자 소자 재료 설계에 기여할 수 있습니다.", "novelty": "이중 페로브스카이트 내의 Co와 Ir 사이의 전자 상관 효과를 DFT 수준에서 체계적으로 분석하여, 압력에 따른 밴드갭 폐쇄 거동을 정량적으로 제시했습니다.", "unresolved": "실제 실험에서의 격자 구조 변화가 DFT 계산보다 더 복잡할 수 있으며, 이 결과가 실제 실험적 압력 하의 ARPES나 수송 측정과 완벽히 일치할지는 검증이 필요합니다.", "future_work": "실제 고압 실험 환경에서의 전도도 측정 및 압력 하의 ARPES를 통한 전자 구조 직접 관측이 필요합니다.", "concepts": [{"term": "이중 페로브스카이트", "why_emerged": "두 가지 서로 다른 전이 금속을 격자 내에 배치하여 물리적 성질을 다양하게 변조하기 위해 필요함.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "페로브스카이트(ABO3) 구조의 확장형으로, 자기적 물성과 초전도 연구에 자주 사용됨."}, {"term": "정수압 효과", "why_emerged": "화학적 치환 없이 결정 구조를 압축하여 전자 대역폭(bandwidth)을 제어하고 상전이를 유도하기 위해 필요함.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "압력 유도 초전도성, Mott 절연체 금속화 연구와 밀접함."}], "english_summary": ["Analyzed La2CoIr1-xTixO6 using DFT to study correlation and pressure effects.", "Electron correlation (U) stabilizes the insulating state by widening the band gap.", "Hydrostatic pressure induces insulator-to-metal transitions at 39-53 GPa.", "Demonstrates tunability of correlated oxides for potential electronic applications."]}}, {"title": "Gossamer Superconductivity in Moir\\'e WSe2 Bilayer (Phys. Rev. Lett.)", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2605.03766", "authors": "Hui-Ke Jin, Guangyue Ji, Zhan Wang, Jie Wang, Fu-Chun Zhang", "last_authors": "Jie Wang, Fu-Chun Zhang", "summary": "Moir\\'e transition metal dichalcogenides have served as a versatile platform for simulating Hubbard physics. Recent experiments have identified robust superconductivity in moir\\'e bilayer WSe$_2$ for certain twist angles. Here, we propose the gossamer nature of the superconductivity recently discovered at half-filling and zero displacement field in twisted WSe$_2$. By mapping the moir\\'e continuum system to an effective extended single-orbital Hubbard model on the triangular lattice, we employ renormalized mean-field theory to investigate the strong-coupling phase diagram. We find that a moderate Coulomb repulsion partially suppresses charge fluctuations while preserving a finite density of mobile doublons and holes. In this regime, the interplay between extended kinetic hoppings and antiferromagnetic superexchange stabilizes a chiral $d+id$ superconducting phase. Our results naturally account for the twist-angle-dependent evolution from a Mott insulator to a superconductor and eventually to a correlated metal. Furthermore, the model demonstrates that this half-filled pairing state vanishes rapidly upon density doping, consistent with experimental observations.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Theory explaining unconventional superconductivity in moiré WSe2 bilayer, a relevant material class.", "tags": ["theory", "superconductivity", "moire", "WSe2", "correlated"], "image": "https://arxiv.org/html/2605.03766v3/fig1_2.png", "briefing": {"background": "모아레 격자를 가진 전이 금속 칼코게나이드(TMD)는 강상관 전자계 물리학을 시뮬레이션하는 깨끗한 플랫폼입니다. 특히 WSe2 이중층에서의 초전도 현상은 Hubbard 모델의 강한 상관 효과와 연관되어 주목받고 있습니다.", "motivation": "반충진(half-filling) 상태와 무전기장 조건에서 관측된 WSe2 이중층 초전도성의 기원을 이론적으로 이해하고, Mott 절연체에서 초전도체로의 상 변화 과정을 설명하고자 합니다.", "result": "재규격화 평균장 이론(RMFT)을 통해 쿨롱 반발력이 전하 변동을 억제하면서도 이동 가능한 전하 캐리어를 유지하는 '고사머(gossamer)' 초전도 상태를 확인했습니다. 이는 키랄 d+id 대칭성을 갖는 초전도상으로 설명됩니다.", "implication": "모아레 TMD 시스템에서 왜 특정 조건에서만 강한 초전도성이 나타나고, 도핑에 따라 어떻게 소멸하는지에 대한 이론적 체계를 제공합니다.", "novelty": "Hubbard 모델을 확장하여 키랄 초전도 위상을 제안하고, 실험에서 관측된 트위스트 각도 의존적인 상전이를 성공적으로 모델링했습니다.", "unresolved": "제안된 d+id 위상 초전도성이 위상학적으로 자명한지, 혹은 실제 실험에서 위상 초전도 신호가 검출되는지는 추가 실험이 필요합니다.", "future_work": "STM/STS를 통한 국소 상태 밀도 측정으로 초전도 갭의 대칭성을 확인하고, 자기장 하에서의 위상적 특징 연구가 필요합니다.", "concepts": [{"term": "고사머 초전도성", "why_emerged": "Mott 절연체와 초전도체 사이의 경계에서 전하 밀도가 희박하지만 초전도성이 나타나는 현상을 설명하기 위해 도입됨.", "origin": "Laughlin et al.에 의해 제안된 개념.", "connections": "고온 초전도체 및 도핑된 Mott 절연체 연구와 관련됨."}, {"term": "모아레 Hubbard 모델", "why_emerged": "트위스트된 2D 이중층의 평탄 밴드에서 발생하는 강한 전자 상관 효과를 기술하기 위해 필요함.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "트위스트 그래핀 및 TMD 초전도/Mott 연구의 핵심 프레임워크."}], "english_summary": ["Proposed gossamer superconductivity in moiré WSe2 bilayers.", "Mapped system to an extended Hubbard model on a triangular lattice.", "Identified chiral d+id superconducting phase using renormalized mean-field theory.", "Explains the transition from Mott insulator to superconductor as observed in experiments."]}}, {"title": "Heterostructure Design in Two-Dimensional Perovskites by Sequential Recrystallization", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2512.13299", "authors": "Mehrdad Faraji, Alexander Schleusener, Sirous Khabbaz Abkenar, et al.", "last_authors": "Giorgio Divitini, Roman Krahne", "summary": "Low-dimensional metal halide perovskites provide exciting opportunities to fabricate new semiconductor materials. Semiconductor technology relies on electronic heterojunctions, and cost-efficient and flexible approaches to realize functional heterostructures are of fundamental importance. Lateral heterostructures define the energy landscape in the plane of the semiconducting lattice in such 2D materials, representing an ideal platform to tailor energy barriers and to control charge carrier flow. Here, we demonstrate a versatile one-pot synthesis to fabricate a large variety of 2D perovskite heterostructures based on different halides and/or metal cations. Exploiting sequential crystallization of different 2D perovskites, and playing with the composition and injection events of the materials, enables the design of diverse heterostructure architectures
