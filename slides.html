<!DOCTYPE html>

<head>

<meta name='viewport' content='width=device-width, initial-scale=1.0'>
<title>Daily Paper Slideshow</title>
<style>
  :root {
    color-scheme: light;
    --bg: #f6f7f4;
    --paper: #ffffff;
    --ink: #111827;
    --muted: #64748b;
    --line: #d8ddd2;
    --accent: #176b87;
    --accent-2: #9a3412;
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; overflow: auto; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: var(--bg); color: var(--ink); }
  .shell { max-width: 1500px; min-height: 100vh; margin: 0 auto; padding: 14px 18px; display: flex; flex-direction: column; }
  .topbar { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 16px; }
  .top-actions { display: flex; align-items: center; gap: 10px; }
  .topbar a, button { border: 1px solid var(--line); border-radius: 8px; background: var(--paper); color: var(--ink); padding: 10px 14px; font-weight: 700; text-decoration: none; cursor: pointer; }
  button.primary { background: var(--accent); border-color: var(--accent); color: white; }
  button:disabled { opacity: 0.45; cursor: not-allowed; }
  .counter { color: var(--muted); font-weight: 700; }
  .slide { min-height: calc(100vh - 82px); background: var(--paper); border: 1px solid var(--line); border-radius: 10px; padding: 18px; box-shadow: 0 18px 42px rgba(15, 23, 42, 0.10); display: grid; grid-template-columns: minmax(310px, 0.86fr) minmax(0, 1.55fr); gap: 18px; overflow: visible; }
  .paper-head { min-width: 0; min-height: 0; overflow: visible; display: flex; flex-direction: column; gap: 12px; }
  .figure { margin: 0; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: #f8fafc; }
  .figure img { display: block; width: 100%; max-height: 41vh; object-fit: contain; background: white; }
  .figure figcaption { padding: 7px 10px; color: var(--muted); font-size: 12px; line-height: 1.3; }
  .head-text { display: flex; flex-direction: column; gap: 9px; min-width: 0; }
  .badges { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .badge { border-radius: 999px; padding: 5px 9px; background: #eef2ff; color: #3730a3; font-size: 12px; font-weight: 800; }
  .score { background: #fee2e2; color: #991b1b; }
  h1 { margin: 0; font-size: 25px; line-height: 1.15; letter-spacing: 0; overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
  h1 a { color: inherit; text-decoration-color: rgba(23, 107, 135, 0.35); text-decoration-thickness: 2px; text-underline-offset: 4px; }
  h1 a:hover { color: var(--accent); text-decoration-color: var(--accent); }
  .meta, .authors, .why, .abstract { font-size: 13px; line-height: 1.45; }
  .meta, .authors { color: var(--muted); }
  .why strong, .abstract strong, .authors strong { color: var(--ink); }
  .authors { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .why { border-left: 4px solid var(--accent-2); padding-left: 10px; color: #374151; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .abstract { border-top: 1px solid var(--line); padding-top: 14px; color: #374151; }
  .original-abstract { border-top: 1px solid var(--line); padding-top: 10px; color: #374151; font-size: 11.5px; line-height: 1.35; overflow-wrap: anywhere; }
  .original-abstract strong { display: block; margin-bottom: 4px; color: var(--ink); }
  .tags { display: flex; flex-wrap: wrap; gap: 8px; }
  .tag { border-radius: 999px; padding: 4px 8px; background: #f1f5f9; color: #475569; font-size: 12px; font-weight: 700; }
  .head-text > .link { display: none; }
  .briefing { min-width: 0; min-height: 0; overflow: visible; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); grid-auto-rows: minmax(0, auto); align-content: start; gap: 11px 18px; border-top: 0; padding-top: 0; }
  .brief-section { min-width: 0; }
  .brief-section.wide { grid-column: 1 / -1; }
  .brief-section h2 { margin: 0 0 4px; font-size: 14px; line-height: 1.22; color: #0f766e; letter-spacing: 0; }
  .brief-section p, .brief-section li { margin: 0; font-size: 12.5px; line-height: 1.42; color: #1f2937; overflow-wrap: anywhere; }
  .brief-section ul { margin: 0; padding-left: 20px; }
  .concepts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 9px 14px; }
  .concept { border-top: 1px solid var(--line); padding-top: 7px; }
  .concept h3 { margin: 0 0 4px; font-size: 13px; color: #7c2d12; letter-spacing: 0; }
  .concept p { margin: 2px 0 0; font-size: 11.5px; line-height: 1.35; color: #374151; overflow-wrap: anywhere; }
  .concept b { color: #111827; }
  .link { color: var(--accent); font-weight: 800; text-decoration: none; }
  .empty { padding: 48px; background: var(--paper); border: 1px solid var(--line); border-radius: 12px; color: var(--muted); }
  @media (max-width: 860px) {
    .shell { padding: 14px; }
    .topbar, .top-actions { align-items: stretch; flex-direction: column; }
    .slide, .briefing, .concepts { grid-template-columns: 1fr; }
    .slide { min-height: auto; overflow: visible; display: grid; }
    h1 { font-size: 28px; }
  }
</style>

const slides = [{"title": "Orbital-selective band structure evolution in BaFe2−xMxAs2 (M = Cr, Co, Cu, Ru, and Mn) probed by polarization-dependent ARPES", "journal": "PRB_Recent", "source": "keyword", "link": "http://link.aps.org/doi/10.1103/1856-p1fr", "authors": "K. R. Pakuszewski, M. R. Cantarino, I. Romanenko, A. P. Machado, M. M. Piva, G. S. Freitas, H. B. Pizzi, F. A. Garcia, P. G. Pagliuso, and C. Adriano", "last_authors": "H. B. Pizzi, F. A. Garcia, P. G. Pagliuso, and C. Adriano", "summary": "Author(s): K. R. Pakuszewski, M. R. Cantarino, I. Romanenko, A. P. Machado, M. M. Piva, G. S. Freitas, H. B. Pizzi, F. A. Garcia, P. G. Pagliuso, and C. Adriano We present a systematic study of the evolution of the band structure in the Fe-based superconductor family ${\\mathrm{BaFe}}_{2−x}{M}_{x}{\\mathrm{As}}_{2}$ ($M$ = Co, Cu, Cr, Ru, and Mn) using polarization-dependent angle-resolved photoemission spectroscopy (ARPES). Low-substituted samples, with comp… [Phys. Rev. B 113, 245101] Published Mon Jun 01, 2026", "tier": "A_MUST_READ", "score": "10", "reason": "title strong match: ARPES", "tags": ["ARPES", "angle-resolvedphotoemission", "photoemission", "superconduct", "bandstructure"], "image": "", "briefing": {"background": "철 기반 초전도체(FeSC)는 구리 산화물 초전도체와 더불어 비전통 초전도성 연구의 핵심이며, 특히 다중 궤도(multi-orbital) 특성이 물리적 성질을 결정하는 중요한 요소입니다. BaFe2As2(Ba122)는 이러한 계열의 대표적인 모물질로, 전이금속 도핑을 통해 초전도성을 유도하거나 전자 구조를 조절할 수 있습니다.", "motivation": "다양한 전이금속(Cr, Co, Cu, Ru, Mn)을 BaFe2As2에 도핑했을 때, 각 원소가 전자 구조, 특히 궤도별 밴드 진화에 어떤 차별화된 영향을 미치는지 편광 의존 ARPES(polarization-dependent ARPES)를 통해 체계적으로 규명하고자 했습니다.", "result": "서로 다른 도핑 원소들이 특정 궤도(orbital-selective)의 전자 구조를 다르게 변화시킨다는 것을 확인했습니다. 특히 저농도 도핑 샘플에서 밴드 구조의 진화 과정을 정밀하게 추적하여, 도핑 원소의 전자 상태가 전체 페르미면과 밴드 구조 재정규화에 미치는 영향을 분리해냈습니다.", "implication": "특정 궤도를 선택적으로 제어함으로써 초전도성이나 자성 같은 거시적 물성을 조절할 수 있는 가능성을 제시합니다. 이는 철 기반 초전도체의 궤도 물리학(orbital physics)을 이해하는 데 중요한 데이터를 제공합니다.", "novelty": "독자의 주요 관심사인 ARPES를 활용하여, 단순히 하나의 도핑이 아닌 5종의 다양한 전이금속 도핑 효과를 직접적으로 비교 대조했다는 점이 돋보입니다. 궤도 대칭성을 구분할 수 있는 편광 의존 측정을 통해 궤도 선택적 진화를 명확히 보였습니다.", "unresolved": "도핑된 원소가 유도하는 무질서(disorder) 효과나 산란율(scattering rate)의 변화가 실제 초전도 임계 온도(Tc)에 미치는 정량적인 기여도는 추가 연구가 필요합니다.", "future_work": "실험적으로 관찰된 밴드 진화를 DFT+DMFT 등 강상관 이론 계산과 정밀하게 결합하여 궤도 선택적 상관관계의 기원을 더욱 깊이 연구할 수 있을 것입니다.", "concepts": [{"term": "Polarization-dependent ARPES", "why_emerged": "광전자의 편광 상태에 따라 전이 확률이 달라지는 선택 규칙(selection rule)을 이용해 특정 궤도 성분을 구분하기 위해 도입되었습니다.", "origin": "초록 정보만으로는 특정하기 어려우나, ARPES 기술의 고도화 과정에서 정착되었습니다.", "connections": "밴드 대칭성 분석, 궤도 선택적 상관관계 연구"}, {"term": "Orbital-selective evolution", "why_emerged": "다중 궤도 계에서 모든 궤도가 균일하게 변하는 것이 아니라, 특정 궤도만 강하게 반응하거나 재정규화되는 현상을 설명하기 위해 나타났습니다.", "origin": "강상관 전자계 및 철 기반 초전도체 연구 이론에서 주로 제안되었습니다.", "connections": "Orbital-selective Mott transition, Hund's metal"}], "english_summary": ["Systematic polarization-dependent ARPES study on BaFe2-xMxAs2 with various dopants (M = Cr, Co, Cu, Ru, Mn).", "Observed orbital-selective band structure evolution depending on the type of transition metal doping.", "Clarified how different dopants affect the Fermi surface and electronic correlations in a multi-orbital system.", "Provides a comprehensive experimental database for understanding orbital physics in iron-based superconductors."]}}, {"title": "Quantum geometric magnetic monopole and two-phase superconductivity in CeRh2As2", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/csmg-nkn1", "authors": "Kosuke Nogaki, Youichi Yanase", "last_authors": "Kosuke Nogaki, Youichi Yanase", "summary": "Author(s): Kosuke Nogaki and Youichi Yanase Recent angle-resolved photoemission spectroscopy (ARPES) and density functional theory plus Hubbard $U$ ($\\mathrm{DFT}+U$) studies revealed that a heavy-fermion superconductor ${\\mathrm{CeRh}}_{2}{\\mathrm{As}}_{2}$ exhibits Van Hove singularities and the Dirac point near the Fermi level ${E}_{\\mathr… [Phys. Rev. B 113, 214506] Published Mon Jun 01, 2026", "tier": "A_MUST_READ", "score": "10", "reason": "Direct connection to ARPES and electronic structure of a heavy-fermion superconductor.", "tags": ["ARPES", "CeRh2As2", "heavyfermionsuperconductivity"], "image": "", "briefing": {"background": "CeRh2As2는 최근 발견된 중거운 페르미온(heavy-fermion) 초전도체로, 자기장 방향에 따라 두 가지 초전도 상(two-phase SC) 사이의 전이가 나타나는 매우 이례적인 특성을 보입니다. 이는 공간 반전 대칭성이 국소적으로 깨진 격자 구조와 밀접한 관련이 있다고 알려져 있습니다.", "motivation": "최근 ARPES와 DFT+U 연구에서 CeRh2As2의 페르미 준위 근처에 Van Hove singularity(VHS)와 Dirac point가 존재함이 밝혀졌습니다. 이 논문은 이러한 전자 구조적 특징이 어떻게 양자 기하학적 성질과 연결되어 독특한 초전도 상을 유도하는지 이론적으로 설명하고자 합니다.", "result": "해당 물질의 전자 구조 내에 '양자 기하학적 자기 단극자(quantum geometric magnetic monopole)' 구조가 존재함을 이론적으로 제시했습니다. 이 기하학적 특성이 CeRh2As2에서 관찰되는 특이한 두 단계 초전도 상 전이의 근원적인 메커니즘임을 주장합니다.", "implication": "중거운 페르미온 초전도체에서 위상적 밴드 구조와 양자 기하학이 초전도 페어링 및 상도표(phase diagram)를 결정하는 핵심 요소가 될 수 있음을 시사합니다.", "novelty": "독자의 관심사인 ARPES 데이터(VHS, Dirac point)를 기반으로 하여, 양자 기하학이라는 최신 위상 물리 개념을 중거운 페르미온 초전도성에 접목시킨 선구적인 연구입니다.", "unresolved": "이론적으로 제시된 자기 단극자 구조를 실험적으로(예: 원편광 ARPES 등) 직접 측정하여 검증하는 과제가 남아 있습니다.", "future_work": "유사한 국소적 반전 대칭성 결여 물질(예: CeCoIn5 등)에서도 이러한 양자 기하학적 효과가 나타나는지 탐색할 필요가 있습니다.", "concepts": [{"term": "Quantum geometric magnetic monopole", "why_emerged": "밴드 구조의 파동함수가 갖는 기하학적 위상(Berry curvature 등)의 특이점을 설명하기 위해 도입된 개념입니다.", "origin": "초록 정보만으로는 특정하기 어려우나, 위상 절연체 및 반금속의 베리 곡률 연구에서 파생되었습니다.", "connections": "Berry phase, Weyl points, Topological superconductivity"}, {"term": "Two-phase superconductivity", "why_emerged": "하나의 물질에서 온도나 자기장에 따라 초전도 질서 파라미터의 대칭성이 변하며 나타나는 다중 상을 설명하기 위해 필요합니다.", "origin": "UPt3 등 특정 heavy-fermion 시스템에서 처음 관찰되었습니다.", "connections": "Parity mixing, Local inversion symmetry breaking"}], "english_summary": ["Investigates the relationship between the electronic structure (VHS and Dirac points) and superconductivity in CeRh2As2.", "Proposes the existence of a quantum geometric magnetic monopole in the band structure.", "Explains the unique two-phase superconductivity through quantum geometric properties.", "Links ARPES/DFT observations with topological aspects of heavy-fermion superconductors."]}}, {"title": "Strong anomalous Hall conductivity anisotropy in a kagomelike topological semimetal with composition tunability", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/54s4-2jgd", "authors": "Feng Zhou, Hang Li, Guanghui Lu, et al.", "last_authors": "Yong Jiang, Wenhong Wang", "summary": "Author(s): Feng Zhou, Hang Li, Guanghui Lu, Jie Du, Jie Chen, Tao Zhu, Xiaodong Zhou, Linxuan Song, Yong-Chang Lau, Yue Li, Yong Jiang, and Wenhong Wang Triangular atomic arrangements exhibit exceptional physical properties and can host diverse magnetic states, serving as an outstanding platform for investigating the interplay between magnetism, symmetry, and electronic transport. In this study, we reveal a large, tunable, and switchable anomalous H… [Phys. Rev. B 113, 224408] Published Mon Jun 01, 2026", "tier": "A_MUST_READ", "score": "10", "reason": "Direct hit on kagome materials, anomalous Hall effect, and topological semimetals.", "tags": ["experiment", "kagome", "anomalousHalleffect"], "image": "", "briefing": {"background": "카고메(Kagome) 격자 구조를 가진 물질들은 기하학적 좌절(frustration)과 밴드 구조상의 위상적 특이점(Dirac cone, Flat band)으로 인해 거대한 변칙 홀 효과(Anomalous Hall Effect, AHE)를 나타낼 수 있어 양자 소재 연구의 중심에 있습니다.", "motivation": "카고메 구조와 유사한 위상 반금속 계에서 조성을 조절(tunability)함으로써 AHE의 크기와 이방성(anisotropy)을 제어하고, 그 물리적 기원을 이해하고자 했습니다.", "result": "조성 조절이 가능한 카고메 유사 위상 반금속에서 매우 강력한 변칙 홀 전도도 이방성을 발견했습니다. 또한, 조성 변화를 통해 AHE의 부호를 바꾸거나 크기를 대폭 튜닝할 수 있음을 실험적으로 입증했습니다.", "implication": "화학적 조성을 통해 위상적 수송 특성을 정밀하게 제어할 수 있음을 보여주며, 이는 차세대 위상 자기 소자나 스핀트로닉스 응용에 중요한 발판이 됩니다.", "novelty": "독자의 핵심 관심사인 'Kagome', 'Anomalous Hall', 'Topological Semimetal'이 모두 포함된 논문입니다. 특히 조성 조절을 통한 'Switchable' AHE 특성은 실험적 활용도가 매우 높습니다.", "unresolved": "이러한 거대 이방성이 순수하게 Berry 곡률에 의한 것인지, 혹은 스핀 구조의 비공선성(non-collinearity)에 의한 산란 효과가 섞여 있는지에 대한 상세한 분리가 필요합니다.", "future_work": "조성 변화에 따른 실제 페르미 준위의 이동과 밴드 구조의 변화를 ARPES로 직접 관측하여 이론적 예측과 비교하는 후속 연구가 기대됩니다.", "concepts": [{"term": "Anomalous Hall Effect (AHE)", "why_emerged": "자성체 내에서 외부 자기장 없이도 전자의 스핀-궤도 결합과 Berry 곡률에 의해 발생하는 홀 효과를 설명하기 위해 등장했습니다.", "origin": "Edwin Hall (1881)에 의해 처음 발견되었습니다.", "connections": "Berry curvature, Topological semimetals, Spintronics"}, {"term": "Kagome-like topological semimetal", "why_emerged": "카고메 격자의 대칭성이 만드는 특이한 전자 상태(Dirac nodes)를 가진 위상 물질군을 분류하기 위해 사용됩니다.", "origin": "최근 FeSn, Co3Sn2S2, AV3Sb5 등의 물질 연구를 통해 확립되었습니다.", "connections": "Geometric frustration, Flat bands, Weyl semimetals"}], "english_summary": ["Reports large and tunable anomalous Hall conductivity anisotropy in a kagome-like topological semimetal.", "Demonstrates that AHE can be switched and tuned through composition control.", "Explores the interplay between magnetism, lattice symmetry, and electronic transport.", "Highly relevant for researchers interested in kagome metals and Berry curvature-driven phenomena."]}}, {"title": "Electronic Origin of Delicate Antiferromagnetism in FexNbS2", "journal": "PRL_Recent", "source": "author whitelist", "link": "http://link.aps.org/doi/10.1103/99yr-nqbx", "authors": "Wenxin Li, Jonathan T. Reichanadter, Shan Wu, et al.", "last_authors": "Jeffrey B. Neaton, Yu He", "summary": "Author(s): Wenxin Li, Jonathan T. Reichanadter, Shan Wu, Ji Seop Oh, Rourav Basak, Shannon C. Haley, Siqi Wang, Joshua E. Chaparro Mata, Elio Vescovo, Donghui Lu, Makoto Hashimoto, Christoph Klewe, Suchismita Sarker, Jessica L. McChesney, Alex Frañó, James G. Analytis, Robert J. Birgeneau, Jeffrey B. Neaton, and Yu He A combination of ARPES, XAS, and DFT shows a dramatic eV-scale electronic restructuring in Fe x NbS 2 , similar to what happens in correlated oxides, and suggests electronic correlations play a central role in the magnetism of Fe-intercalated transition-metal dichalcogenides. [Phys. Rev. Lett. 136, 216503] Published Wed May 27, 2026", "tier": "A_MUST_READ", "score": "10", "reason": "author whitelist: Donghui Lu", "tags": ["ARPES", "STS", "correlated", "ferromagnet", "antiferromagnet"], "image": "", "briefing": {"background": "전이금속 디칼코게나이드(TMD)에 자성 원자를 삽입(intercalation)한 물질군은 독특한 자성 및 수송 특성을 보여주어 활발히 연구되고 있습니다. 특히 Fe가 삽입된 FexNbS2는 자성 정렬 상태에 따라 특이한 물리적 현상을 보이지만, 그 기저에 깔린 전자 구조와 상관관계(correlation)의 역할에 대해서는 산화물 시스템에 비해 이해가 부족한 상태였습니다.", "motivation": "FexNbS2에서 나타나는 미세한 반강자성(delicate antiferromagnetism)의 전자적 기원을 규명하고, 이 시스템에서 전자 상관관계가 자성 형성에 어떠한 영향을 미치는지 밝히고자 하였습니다.", "result": "ARPES, XAS, DFT를 결합하여 분석한 결과, FexNbS2에서 상관관계가 강한 산화물에서나 볼 수 있는 eV 단위의 대규모 전자 구조 재구성(restructuring)을 발견했습니다. 이는 이 물질의 자성이 단순히 순회 전자(itinerant electron)의 불안정성 때문이 아니라, 강한 전자 상관관계에 의해 유도된 밴드 이동과 밀접하게 연관되어 있음을 시사합니다.", "implication": "삽입된 TMD 물질군이 단순한 금속성 자성체를 넘어, 강상관 전자계(strongly correlated systems)의 물리적 특성을 공유하고 있음을 입증합니다. 이는 향후 TMD 기반 자성 소자 설계 시 상관관계를 주요 변수로 고려해야 함을 의미합니다.", "novelty": "ARPES를 통해 Fe 삽입에 따른 전자 구조의 급격한 변화를 직접 관찰하였으며, 이를 통해 'delicate'한 자성 상태가 사실은 매우 강력한 에너지 스케일의 전자 구조 변화와 연결되어 있음을 밝힌 점이 새롭습니다. 독자의 관심사인 ARPES와 상관관계 물리 모두에 부합하는 연구입니다.", "unresolved": "eV 단위의 큰 변화가 어떻게 미세한 반강자성 상태를 결정짓는지에 대한 구체적인 미시적 메커니즘은 보완 연구가 필요해 보입니다.", "future_work": "다른 전이금속(Co, Ni 등)이 삽입된 TMD 시스템에서도 유사한 eV 스케일의 전자 구조 재구성이 나타나는지 확인하는 비교 연구가 기대됩니다.", "concepts": [{"term": "Intercalated TMDs", "why_emerged": "2D 층상 구조인 TMD 사이에 외부 원자를 넣어 물성을 제어하기 위해 등장했습니다.", "origin": "초록 정보만으로는 특정하기 어려움 (반도체/금속 공학의 오랜 기법)", "connections": "반강자성체, 스핀트로닉스 소자, NbS2"}, {"term": "Electronic Correlation", "why_emerged": "전자 간의 쿨롱 상호작용이 무시될 수 없을 때 나타나는 복잡한 현상을 설명하기 위해 도입되었습니다.", "origin": "Mott, Hubbard 등에 의해 이론적 기초 확립", "connections": "Mott 절연체, 고온 초전도체, 밴드 구조 재구성"}, {"term": "ARPES", "why_emerged": "물질 내부의 전자 에너지와 운동량 관계(밴드 구조)를 직접 측정하기 위해 개발되었습니다.", "origin": "Hertz의 광전효과를 기반으로 수십 년간 발전", "connections": "페르미 면, 밴드 분산, 다체 상호작용"}, {"term": "eV-scale restructuring", "why_emerged": "일반적인 금속의 섭동(perturbation) 수준을 넘어서는 거대한 전자 구조 변화를 묘사하기 위해 사용되었습니다.", "origin": "초록 정보만으로는 특정하기 어려움 (본 연구에서 강조하는 핵심 현상)", "connections": "금속-절연체 전이, 강상관 산화물 물리"}], "english_summary": ["The study reveals an eV-scale electronic restructuring in Fe-intercalated NbS2 using ARPES and DFT.", "Electronic correlations are shown to play a central role in the magnetism of intercalated TMDs, similar to correlated oxides.", "The delicate antiferromagnetism is linked to large-scale electronic shifts rather than simple itinerant instabilities.", "The results suggest that Fe-TMDs should be treated as strongly correlated electron systems."]}}, {"title": "Symmetry-Broken Ground State and Phonon-Mediated Superconductivity in Kagome CsV3Sb5", "journal": "PRL_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/4r8x-j3nd", "authors": "Manex Alkorta, Martin Gutierrez-Amigo, Đorđe Dangić, et al.", "last_authors": "Maia G. Vergniory, Ion Errea", "summary": "Author(s): Manex Alkorta, Martin Gutierrez-Amigo, Đorđe Dangić, Chunyu Mark Guo, Philip J. W. Moll, Maia G. Vergniory, and Ion Errea The newly discovered family of nonmagnetic kagome metals ${\\mathrm{AV}}_{3}{\\mathrm{Sb}}_{5}$ ($\\mathrm{A}=\\mathrm{K}$, Rb, or Cs) provides a unique platform for exploring the interplay between charge-density wave (CDW) order, superconductivity, nontrivial topology, and spontaneous time-reversal sym… [Phys. Rev. Lett. 136, 206401] Published Fri May 22, 2026", "tier": "A_MUST_READ", "score": "10", "reason": "Direct hit: Kagome CsV3Sb5, CDW, superconductivity, TRSB, and phonons; core to user's research.", "tags": ["kagomemetal", "AV3Sb5", "CsV3Sb5", "CDW", "superconductivity", "time-reversalsymmetrybreaking", "phonon", "topology"], "image": "", "briefing": {"background": "Kagome 격자 구조를 가진 AV3Sb5 화합물은 전하 밀도파(CDW), 초전도성, 위상적 특성, 그리고 시간 반전 대칭성 깨짐(TRSB)이 공존하여 최근 고체물리학계에서 가장 뜨거운 주제 중 하나입니다.", "motivation": "CsV3Sb5의 초전도 페어링 메커니즘이 전자 간의 상호작용에 의한 것인지, 아니면 전통적인 격자 진동(phonon)에 의한 것인지에 대한 논란을 해결하고자 하였습니다.", "result": "대칭성이 깨진 기저 상태(Symmetry-broken ground state)를 고려한 계산을 통해, CsV3Sb5의 초전도가 포논 매개 메커니즘(phonon-mediated)으로 설명될 수 "Science", "source": "Gemini", "link": "https://doi.org/10.1126/science.adw8329", "authors": "Jianchang Shen, Guangdi Zhou, Yu Miao, et al.", "last_authors": "Junfeng He, Zhuoyu Chen", "summary": "The discovery of superconductivity in Ruddlesden-Popper (RP) bilayer nickelate films under ambient pressure provides an opportunity to directly investigate electronic energy scales of the superconducting state and the pairing mechanism. We report angle-resolved photoemission spectroscopy measurements of superconducting (La,Pr,Sm) 3 Ni 2 O 7 thin films by developing an ultra-high vacuum cryogenic sample quenching and transfer technique. A superconducting gap of ~18 meV with coherence peaks is observed along the Brillouin zone diagonal. The finite gap persists across the entire Brillouin zone, revealing the absence of gap nodes. A kink is observed in the energy-momentum dispersion at ~70 meV below Fermi level, indicating an electron-boson coupling. The simultaneous observation of a nodeless superconducting gap and electron-boson coupling provides insight into the pairing symmetry and gluing mechanism in RP bilayer nickelates.", "tier": "A_MUST_READ", "score": "10", "reason": "Direct ARPES study of nodeless superconducting gap and electron-boson coupling in nickelate films.", "tags": ["ARPES", "superconductivity", "nickelates", "unconventionalsuperconductivity", "electron-bosoncoupling"], "image": "", "briefing": {"background": "최근 발견된 빌레이어 니켈레이트(R3Ni2O7)는 고압에서 높은 임계 온도의 초전도성을 보여 구프레이트(cuprates) 이후 새로운 고온 초전도체 후보로 주목받고 있습니다. 특히 최근 상압에서 초전도성을 보이는 박막 제작이 성공하며 상세한 분석이 가능해졌습니다.", "motivation": "상압 초전도 니켈레이트 박막의 페어링 대칭성(pairing symmetry)과 전자를 결합시키는 '풀(glue)' 역할을 하는 보존(boson)이 무엇인지 ARPES를 통해 직접 확인하고자 했습니다.", "result": "Brillouin zone 전체에 걸쳐 노드(node)가 없는 약 18 meV 크기의 초전도 갭을 관찰했습니다(nodeless). 또한, 페어링 메커니즘의 증거인 약 70 meV 에너지에서의 전자-보존 결합에 의한 킹크(kink) 현상을 발견했습니다.", "implication": "노드가 없는 갭의 발견은 s-wave 대칭 가능성을 강력히 시사하며, 70 meV의 킹크는 특정 포논이나 자기적 들뜸(magnon)이 페어링의 매개체임을 암시합니다. 이는 니켈레이트 초전도 이론 04728v1 Announce Type: new Abstract: Strongly correlated quantum states, such as charge density waves (CDWs), are exquisitely sensitive to Fermi surface topology and lattice symmetry, and are typically quenched by heavy carrier doping. In two-dimensional (2D) systems, however, macroscopic geometric curvature emerges as a novel structural degree of freedom to modulate microscopic quantum coherence. This raises a compelling physical question: can non-Euclidean geometric deformations compete with extreme electronic perturbations to reshape, or even revive, a quenched macroscopic quantum order? Here, by constructing monolayer TiSe$_2$-NbSe$_2$ heterostructure on a BLG/SiC substrate for the first time, we report the curvature-driven revival of a frustrated charge order in a non-Euclidean space. Low-temperature angle-resolved photoemission spectroscopy (ARPES) reveals a massive interfacial charge transfer, which destroys the global Fermi surface nesting and completely suppresses the long-range CDW order in Euclidean flat regions. Strikingly, high-resolution scanning tunneling microscopy (STM) reveals that a novel, non-linear CDW state miraculously survives, remaining strictly localized within morphologically distorted, non-Euclidean nanoscale curved regions. Atomistic simulations unravel the structural origin of this phenomenon, demonstrating that interfacial twist and lattice mismatch spontaneously generate a corrugated superlattice.", "tier": "A_MUST_READ", "score": "10", "reason": "Direct hit: Experimental ARPES/STM study of CDW in monolayer heterostructure, highly relevant to user's core interests.", "tags": ["experiment", "ARPES", "STM", "CDW", "2Dmaterials", "heterostructure", "monolayer", "Fermisurface"], "image": "https://arxiv.org/static/browse/0.3.4/images/arxiv-logo-fb.png", "briefing": {"background": "전하 밀도 파동(CDW)과 같은 강상관 양자 상태는 페르미 면의 형상과 격자 대칭성에 매우 민감하며, 일반적으로 강한 캐리어 도핑이 발생하면 페르미 면 네스팅 조건이 깨지면서 상태가 소멸(quench)되는 경향이 있습니다.", "motivation": "2차원 계에서 기하학적 곡률은 양자 결맞음을 조절하는 새로운 구조적 자유도로 주목받고 있습니다. 본 연구는 강한 전하 주입으로 인해 평평한 공간에서는 사라진 CDW 상태가 비유클리드 기하학적 변형(곡률)을 통해 다시 부활할 수 있는지 탐구합니다.", "result": "BLG/SiC 기판 위에 단층 TiSe2-NbSe2 이질구조를 제작하여 분석한 결과, 계면 전하 이동으로 인해 평평한 영역에서는 CDW가 완전히 억제됨을 ARPES로 확인했습니다. 그러나 STM 측정 결과, 나노미터 수준의 곡률이 존재하는 비유클리드 영역에서는 비선형 CDW 상태가 기적적으로 생존함을 발견했습니다.", "implication": "기하학적 곡률이 전자 구조의 섭동을 이기고 거시적 양자 질서를 보호하거나 유도할 수 있음을 시사합니다. 이는 소자 설계에서 '곡률 공학'이 새로운 제어 변수가 될 수 있음을 의미합니다.", "novelty": "단층 TiSe2-NbSe2 이질구조를 최초로 구현하였으며, 도핑으로 사멸된 CDW가 기하학적 변형에 의해 특정 국소 부위에서만 선택적으로 부활하는 현상을 ARPES와 STM으로 입증한 점이 독창적입니다.", "unresolved": "곡률에 의해 유도된 비선형 CDW의 정확한 결맞음 길이와 이 상태가 초전도 등 다른 경쟁 질서와 어떻게 상호작용하는지에 대한 상세한 메커니즘은 추가 연구가 필요합니다.", "future_work": "다양한 곡률 반경을 가진 나노 구조에서의 CDW 상전이 온도 측정 및 곡률을 인위적으로 조절하는 스트레인 소자 연구가 기대됩니다.", "concepts": [{"term": "비유클리드 공간 (Non-Euclidean space)", "why_emerged": "평평한 2차원 평면이 아닌 기하학적 곡률을 가진 공간에서 나타나는 물리적 특성을 설명하기 위해 도입되었습니다.", "origin": "가우스, 리만 등 수학자들에 의해 정립되었으며 물리학에서는 일반상대론 및 응집물질의 곡률 효과 연구에 쓰입니다.", "connections": "변형 공학(Strain engineering), 그래핀의 슈도자기장(Pseudo-magnetic field)"}, {"term": "전하 밀도 파동 (CDW)", "why_emerged": "금속의 전자 밀도가 주기적으로 변조되면서 격자 왜곡을 동반하는 현상을 설명하기 위해 등장했습니다.", "origin": "루돌프 파이얼스(Rudolf Peierls)가 1차원 금속의 불안정성을 이론적으로 제시했습니다.", "connections": "페르미 면 네스팅, 초전도와의 경쟁 관계, NbSe2, TiSe2"}, {"term": "페르미 면 네스팅 (Fermi surface nesting)", "why_emerged": "특정 파동 벡터에 의해 페르미 면의 한 부분이 다른 부분과 겹쳐질 때 발생하는 전자 감수율의 발산을 설명합니다.", "origin": "초록 정보만으로는 특정하기 어려우나 전형적인 다체계 물리 이론에서 유래했습니다.", "connections": "CDW 형성 기전, 스핀 밀도 파동(SDW)"}], "english_summary": ["Demonstrated the revival of quenched CDW in TiSe2-NbSe2 heterostructures via geometric curvature.", "ARPES showed global suppression of CDW due to massive charge transfer in Euclidean flat regions.", "STM revealed localized survival of a non-linear CDW state within nanoscale curved regions.", "Identified interfacial twist and lattice mismatch as the structural origin of the corrugated superlattice."]}}, {"title": "Progress of ambient-pressure superconductivity in bilayer nickelate thin films (Front. Phys.)", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2603.11235", "authors": "Wenyuan Qiu, Dao-Xin Yao", "last_authors": "Wenyuan Qiu, Dao-Xin Yao", "summary": "arXiv:2603.11235v2 Announce Type: replace Abstract: This review summarizes recent progress of ambient-pressure superconductivity in bilayer nickelate La$_3$Ni$_2$O$_7$ thin films, a major advancement following the discovery of high-pressure superconductivity in bulk La$_3$Ni$_2$O$_7$. First, we explain how epitaxial strain engineering enables ambient-pressure superconductivity in La$_3$Ni$_2$O$_7$ thin films, with compressive strain from substrates like SrLaAlO$_4$ stabilizing superconductivity. Next, we review experimental characterizations of related systems, with particular emphasis on ARPES measurements that have shown conflicting Fermi surface topologies. We then discuss progress in increasing the superconducting transition temperature $T_c$. Finally, we summarize theoretical studies of the electronic structure and pairing symmetry of La$_3$Ni$_2$O$_7$ thin films. Together, these advances establish bilayer nickelate thin films as a highly tunable and promising platform for exploring high-$T_c$ superconductivity.", "tier": "A_MUST_READ", "score": "10", "reason": "Review of nickelate thin films including ARPES data, perfect match for interest profile.", "tags": ["ARPES", "nickelate", "superconductivity"], "image": "https://arxiv.org/html/2603.11235v2/fig1.png", "briefing": {"background": "최근 벌크 La3Ni2O7에서 고압 하의 고온 초전도(약 80K)가 발견되면서 니켈레이트계 초전도체 연구가 급증했습니다. 하지만 실제 응용을 위해서는 상압에서 초전도성을 구현하는 것이 필수적입니다.", "motivation": "이 리뷰는 고압이 아닌 상압에서 이중층 니켈레이트(La3Ni2O7) 박막의 초전도성을 구현하기 위한 최근의 실험적, 이론적 진전 상황을 정리하고자 합니다.", "result": "에피택셜 변형 공학(strain engineering)을 통해 상압에서도 초전도성을 안정화할 수 있음이 확인되었습니다. 특히 SrLaAlO4 기판 등을 활용한 압축 변형이 핵심 역할을 하며, ARPES 측정에서 보고된 서로 다른 페르미 면 위상 구조(topology)에 대한 논란을 다룹니다.", "implication": "박막 형태에서의 초전도 구현은 니켈레이트가 구리 산화물(cuprates)에 버금가는 고온 초전도체 플랫폼으로 도약할 가능성을 보여줍니다.", "novelty": "고압 연구에 집중되었던 기존 흐름에서 벗어나 상압 초전도 박막의 데이터(ARPES, 수송 특성 등)를 종합적으로 검토하고, Tc를 높이기 위한 전략을 제시한 점이 중요합니다.", "unresolved": "ARPES 데이터 간의 불일치(페르미 면 형상), 정확한 페어링 대칭성(pairing symmetry), 그리고 박막에서의 산소 결핍 제어 문제가 남아 있습니다.", "future_work": "Tc 향상을 위한 적층 구조 최적화, 페어링 대칭성 규명을 위한 위상 민감 측정, 고품질 단결정 박막 제조 기술 발전이 요구됩니다.", "concepts": [{"term": "에피택셜 변형 (Epitaxial strain)", "why_emerged": "박막 성장 시 기판과의 격자 불일치를 이용해 물질의 물리적 성질을 인위적으로 조절하기 위해 사용됩니다.", "origin": "박막 성장 기술의 발달과 함께 박막 물성 제어의 핵심 기법으로 자리 잡았습니다.", "connections": "결정장 갈라짐(Crystal field splitting), 궤도 정렬(Orbital ordering)"}, {"term": "이중층 니켈레이트 (Bilayer nickelate)", "why_emerged": "Ni-O 평면이 두 층으로 겹쳐진 구조에서 나타나는 독특한 전자 구조가 고온 초전도의 핵심으로 지목되었습니다.", "origin": "La3Ni2O7 결정 구조 연구에서 시작되어 2023년 고압 초전도 발견으로 주목받았습니다.", "connections": "La3Ni2O7, 구리 산화물 초전도체, 층간 커플링"}], "english_summary": ["Reviews progress in achieving ambient-pressure superconductivity in La3Ni2O7 thin films.", "Highlights the role of epitaxial compressive strain in stabilizing the superconducting state.", "Discusses conflicting ARPES results regarding Fermi surface topologies in nickelate films.", "Explores theoretical pairing symmetries and strategies to increase the transition temperature Tc."]}}, {"title": "Distinguishing impurity-induced bound states from Majorana-like zero-energy peaks in strained CsCa2Fe4As4F2 by scanning tunneling microscopy", "journal": "PRB_Recent", "source": "author whitelist", "link": "http://link.aps.org/doi/10.1103/b5c9-xx1b", "authors": "Mingzhe Li, Jiashuo Gong, Huaxun Li, et al.", "last_authors": "Dong-Lai Feng, Ya-Jun Yan", "summary": "Author(s): Mingzhe Li, Jiashuo Gong, Huaxun Li, Jiakang Zhang, Yuanji Li, Ruotong Yin, Shiyuan Wang, Guanghan Cao, Dong-Lai Feng, and Ya-Jun Yan Iron-based superconductors offer a versatile platform for exploring topological superconductivity and Majorana zero modes (MZMs), with experimental confirmations in Fe(Te,Se), (Li,Fe)OHFeSe and $\\mathrm{Ca}\\mathrm{K}\\mathrm{F}{\\mathrm{e}}_{4}\\mathrm{A}{\\mathrm{s}}_{4}$ at ambient pressure, as well a… [Phys. Rev. B 113, 224504] Published Mon Jun 01, 2026", "tier": "A_MUST_READ", "score": "9", "reason": "author whitelist: Dong-Lai Feng", "tags": ["scanningtunneling", "Majorana", "superconduct", "topological"], "image": "", "briefing": {"background": "철 기반 초전도체는 위상 초전도와 마요라나 제로 모드(MZM)를 연구할 수 있는 유망한 플랫폼입니다. 하지만 실험적으로 관측되는 제로 에너지 피크(Zeb)가 진정한 MZM인지, 아니면 불순물에 의한 결합 상태인지 구분하는 것이 매우 어렵습니다.", "motivation": "변형(strain)이 가해진 CsCa2Fe4As4F2 초전도체에서 나타나는 제로 에너지 피크의 기원을 STM을 통해 명확히 규명하여 MZM과의 혼동을 방지하고자 합니다.", "result": "STM 연구를 통해 관측된 특정 제로 에너지 신호들이 진정한 MZM이 아니라 불순물에 의해 유도된 결합 상태(impurity-induced bound states)임을 입증했습니다. 이는 실험 데이터 해석에서 공간적 프로파일과 자기장 의존성을 면밀히 분석해야 함을 보여줍니다.", "implication": "철 기반 초전도체에서 MZM을 증명하기 위한 실험적 기준을 강화하며, 변형된 격자 구조에서의 국소적 전하 섭동이 마요라나 신호를 모방할 수 있음을 경고합니다.", "novelty": "독특한 결정 구조를 가진 CsCa2Fe4As4F2 계열에서 스트레인 효과와 불순물 상태를 STM으로 정밀하게 분리해냈으며, 저명한 연구자 Feng의 그룹에서 수행된 신뢰도 높은 연구입니다.", "unresolved": "이 재료에서 진정한 위상적 특성이 나타날 수 있는 정확한 화학적 조성이나 외부 변형 조건은 아직 완벽히 특정되지 않았습니다.", "future_work": "불순물이 극도로 억제된 고순도 시료에서의 추가 STM 측정 및 외부 압력/자기장을 이용한 위상 상전이 제어 연구가 필요합니다.", "concepts": [{"term": "마요라나 제로 모드 (MZM)", "why_emerged": "입자 스스로가 반입자인 마요라나 페르미온을 응집물질계에서 준입자 형태로 구현하여 양자 컴퓨팅에 활용하기 위해 등장했습니다.", "origin": "에토레 마요라나(Ettore Majorana)의 이론적 제안을 기반으로 키타에프(Kitaev) 등이 응집물질 모델을 제시했습니다.", "connections": "위상 초전도체, 비가환 통계, 양자 컴퓨팅"}, {"term": "불순물 유도 결합 상태", "why_emerged": "초전도체 내의 국소적 결함이나 불순물이 갭 내부(in-gap)에 상태를 형성하여 물리적 특성을 변화시키기 때문에 연구되었습니다.", "origin": "Yu-Shiba-Rusinov (YSR) 상태 연구 등 초전도체 불순물 이론에서 유래했습니다.", "connections": "YSR 상태, 제로 에너지 피크(ZEP), 안데르손 국소화"}], "english_summary": ["Distinguished impurity-induced bound states from Majorana-like zero-energy peaks in CsCa2Fe4As4F2.", "Used high-resolution STM to analyze the spatial and spectroscopic properties of in-gap states.", "Highlighted the risks of misidentifying trivial impurity states as topological Majorana modes in strained iron-based superconductors.", "Provides critical experimental criteria for validating topological superconductivity in 11442-type iron pnictides."]}}, {"title": "Altermagnetic and Dipolar Splitting of Magnons in FeF2", "journal": "PRL_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/g6dt-rf8c", "authors": "J. Sears, V. O. Garlea, D. Lederman, J. M. Tranquada, I. A. Zaliznyak", "last_authors": "J. M. Tranquada, I. A. Zaliznyak", "summary": "Author(s): J. Sears, V. O. Garlea, D. Lederman, J. M. Tranquada, and I. A. Zaliznyak Neutron scattering measurements show that altermagnetic splitting of chiral magnons in the classical antiferromagnet FeF 2 is small compared to the effects of long-range dipolar interactions. [Phys. Rev. Lett. 136, 226701] Published Tue Jun 02, 2026", "tier": "A_MUST_READ", "score": "9", "reason": "Experimental neutron scattering study of magnons in an altermagnet, directly matching user's key interests.", "tags": ["experiment", "neutronscattering", "altermagnetism", "magnons", "antiferromagnet"], "image": "", "briefing": {"background": "알터마그네티즘(Altermagnetism)은 최근 정의된 자성 상태로, 순자화(net magnetization)가 없음에도 불구하고 결정 대칭성에 의해 운동량 공간에서 스핀 축퇴가 해제(spin splitting)되는 특성을 가집니다. 이는 기존의 강자성이나 반강자성과 차별화되는 제3의 자성 상태로 주목받고 있습니다.", "motivation": "본 연구는 고전적인 반강자성체인 FeF2가 알터마그넷의 특성을 가진다는 점에 착안하여, 이 물질 내 스핀 파동인 마그논(magnon)의 거동에서 알터마그네틱 스핀 분할이 어떻게 나타나는지 실험적으로 확인하고자 했습니다.", "result": "중성자 산란 측정을 통해 FeF2의 카이랄 마그논(chiral magnons)에서 나타나는 알터마그네틱 분할을 관찰했습니다. 그러나 이 분할의 크기는 장거리 쌍극자 상호작용(long-range dipolar interactions)에 의한 효과와 비교했을 때 상대적으로 작다는 것이 밝혀졌습니다.", "implication": "알터마그넷의 스핀 동역학을 이해하는 데 있어 결정 대칭성에 기반한 알터마그네틱 항뿐만 아니라, 쌍극자 상호작용과 같은 전통적인 자기 상호작용의 기여도를 정밀하게 평가해야 함을 시사합니다.", "novelty": "알터마그네티즘과 중성자 산란이라는 사용자 핵심 관심사를 관통하는 주제이며, 이론적으로 예측된 알터마그네틱 효과가 실제 물리적 시스템(FeF2)에서 다른 상호작용들과 어떻게 경쟁하는지 정량적으로 보여준 연구입니다.", "unresolved": "알터마그네틱 분할이 쌍극자 상호작용보다 작게 관찰된 원인이 FeF2 고유의 특성인지, 아니면 다른 알터마그넷 후보 물질에서도 보편적으로 나타나는 현상인지에 대한 규명이 필요합니다.", "future_work": "쌍극자 상호작용이 약한 다른 알터마그넷 시스템에서의 마그논 분할 측정 및 알터마그네틱 효과를 극대화할 수 있는 소재 설계 연구가 기대됩니다.", "concepts": [{"term": "알터마그네티즘 (Altermagnetism)", "why_emerged": "강자성의 스핀 분할 특성과 반강자성의 순자화 제로 특성을 동시에 갖는 물질을 설명하기 위해 등장했습니다.", "origin": "최근 Libor Šmejkal 등에 의해 이론적으로 체계화됨", "connections": "반강자성, 스피트로닉스, 비정상 홀 효과"}, {"term": "카이랄 마그논 (Chiral Magnons)", "why_emerged": "자성체 내에서 스핀의 세차 운동 방향이 고정된 집단 여기 상태를 설명하기 위해 필요합니다.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "스핀파, 위상 자성, 중성자 산란"}, {"term": "쌍극자 상호작용 (Dipolar Interaction)", "why_emerged": "자성 모멘트 간의 장거리 전자기적 상호작용을 설명하기 위한 고전적 개념입니다.", "origin": "고전 전자기학 및 자기학의 기초 원리", "connections": "자기 이방성, 마그논 밴드 구조"}, {"term": "중성자 산란 (Neutron Scattering)", "why_emerged": "결정 구조와 자기 구조, 그리고 그들의 여기 상태(마그논)를 원자 단위에서 직접 관찰하기 위해 개발되었습니다.", "origin": "Clifford Shull 및 Bertram Brockhouse (노벨상 수상)", "connections": "마그논 분산 관계, 비탄성 산란"}], "english_summary": ["Neutron scattering study on FeF2 reveals altermagnetic splitting of chiral magnons.", "The observed splitting is found to be smaller than the effects of long-range dipolar interactions.", "Highlights the necessity of considering classical dipolar forces in altermagnetic materials.", "Provides experimental constraints on the magnitude of altermagnetic effects in a prototype compound."]}}, {"title": "Observation of quantum vortex core fractionalization and skyrmion formation in a superconductor", "journal": "Science", "source": "author whitelist", "link": "https://doi.org/10.1126/science.ads0189", "authors": "Yu Zheng, Quanxin Hu, Xin Yu, et al.", "last_authors": "Chi-Ming Yim, Hong Ding", "summary": "Magnetic fields can penetrate a superconductor in the form of quantum vortices, which consist of a core singularity with circulating currents. London’s quantization implies that there is one core singularity per quantum of magnetic flux in single-component superconductors. Here, we report signatures of quantum vortex core fractionalization on the potassium-terminated surface of a multiband superconductor KFe 2 As 2 . The observed splitting of single integer-flux vortices into several fractional vortices results in a disparity between the numbers of flux quanta and vortex cores. These fractional vortices often arrange in chains, which calculations show are characterized by a ℂP 2 skyrmionic topological invariant; this constitutes a different type of topological defect: the chiral skyrmion. The disparate natures of integer and fractional vortices comprising skyrmions lead to distinct spectroscopic signatures.", "tier": "A_MUST_READ", "score": "9", "reason": "author whitelist: Hong Ding", "tags": ["superconduct", "topological"], "image": "", "briefing": {"background": "초전도체에 자기장이 가해지면 양자 소용돌이(vortex) 형태의 자기 선속이 침투하며, 일반적인 단일 성분 초전도체에서는 하나의 자기 선속 양자당 하나의 소용돌이 핵이 존재합니다.", "motivation": "다중 밴드(multiband) 초전도체에서는 소용돌이가 더 복잡하게 거동할 수 있다는 이론적 예측이 있었으며, 본 연구는 KFe2As2라는 철 기반 초전도체에서 소용돌이 핵의 분획화(fractionalization) 현상을 실험적으로 증명하고자 했습니다.", "result": "KFe2As2의 칼륨(K) 종단 표면에서 단일 정수 자기 선속 소용돌이가 여러 개의 분획 소용돌이(fractional vortices)로 쪼개지는 현상을 관찰했습니다. 이들은 사슬 형태를 이루며, CP2 스카이뮴(skyrmion) 위상 불변량으로 특징지어지는 새로운 형태의 위상 결함임을 확인했습니다.", "implication": "초전도체 내에서 기존의 아브리코소프 소용돌이와는 완전히 다른, 스카이뮴 형태의 위상학적 여기 상태가 존재할 수 있음을 보여주며, 이는 다중 성분 초전도체 연구의 새로운 지평을 엽니다.", "novelty": "철 기반 초전도체(KFe2As2)와 위상학적 결함(스카이뮴)의 결합을 다루고 있으며, 특히 홍딩(Hong Ding) 교수의 연구로서 사용자의 초전도 및 위상 물질 관심사에 매우 부합합니다. 소용돌이 분획화의 직접적 관찰은 매우 드문 성과입니다.", "unresolved": "이러한 분획화 현상이 표면 효과인지 혹은 벌크의 고유 특성인지, 그리고 다른 다중 밴드 초전도체에서도 보편적으로 나타나는지 확인이 필요합니다.", "future_work": "스카이뮴 소용돌이의 동역학적 제어 및 이를 활용한 위상 양자 컴퓨팅 또는 차세대 초전도 소자 응용 연구.", "concepts": [{"term": "소용돌이 핵 분획화 (Vortex Core Fractionalization)", "why_emerged": "다중 성분 질서 매개변수를 갖는 시스템에서 소용돌이가 쪼개질 수 있는 가능성을 설명하기 위해 등장했습니다.", "origin": "Babaev 등에 의한 다중 성분 초전도체 이론", "connections": "다중 밴드 초전도성, KFe2As2"}, {"term": "CP2 스카이뮴 (CP2 Skyrmion)", "why_emerged": "3성분 질서 매개변수를 가진 시스템에서 나타나는 복잡한 위상학적 구조를 기술하기 위해 필요합니다.", "origin": "수학적 장론 및 응집물질 물리 이론", "connections": "위상 불변량, 카이랄 자성체"}, {"term": "KFe2As2", "why_emerged": "철 기반 초전도체 중 구멍 도핑(hole-doping) 극단에 위치하며 특이한 초전도 대칭성을 연구하기 위해 중요합니다.", "origin": "철 기반 초전도체 발견 초기 (2008년경)", "connections": "철 pnictide, 비전통적 초전도"}, {"term": "자기 선속 양자 (Flux Quantum)", "why_emerged": "초전도체 내로 침투하는 자기장이 양자화되어 있음을 설명하기 위한 기본 단위입니다.", "origin": "Fritz London 및 Abrikosov", "connections": "런던 투과 깊이, 아브리코소프 격자"}], "english_summary": ["Observation of quantum vortex core fractionalization in the multiband superconductor KFe2As2.", "Single integer-flux vortices split into fractional vortices forming chains.", "Identified as a new type of topological defect characterized by a CP2 skyrmionic invariant.", "Provides distinct spectroscopic signatures for fractional versus integer vortices."]}}, {"title": "Symmetry-locked six-state control of altermagnetism via sliding ferroelectricity", "journal": "Science_Advances", "source": "Gemini", "link": "https://doi.org/10.1126/sciadv.aec5229", "authors": "Wei Sun, Wenxuan Wang, Changhong Yang, Shifeng Huang, Zhenxiang Cheng", "last_authors": "Shifeng Huang, Zhenxiang Cheng", "summary": "Altermagnetic multiferroics offer a promising route to low-power spintronics by enabling spin splitting without net magnetization, extending beyond conventional spin-orbit coupling. However, achieving deterministic electric control has remained elusive. Here, a six-state platform for high-dimensional magnetoelectric coupling in altermagnets is established by exploiting the nondegenerate transition paths of sliding ferroelectrics as a symmetry-engineering knob, thereby transcending the conventional binary (up/down) paradigm of sliding ferroelectricity. First-principles calculations on bilayer manganese phosphorus trisulfide reveal a spin-polarization symmetry-locking mechanism. Polarization switching along the three nondegenerate paths not only reverses the spin splitting but also rotates its spin-splitting texture in 120° increments, yielding six nonvolatile, electrically addressable altermagnetic states. Furthermore, direct correspondence is established between the spin-splitting texture and the nonlinear Hall response, providing unique electrical fingerprints for each state. This work establishes a paradigm for electric field–driven reconstruction of momentum-space spin geometry, providing a versatile platform for controlling quantum phenomena in altermagnetic spintronics.", "tier": "A_MUST_READ", "score": "9", "reason": "Direct hit on altermagnetism, multiferroics, spintronics, and predicted observable nonlinear Hall response.", "tags": ["altermagnetism", "multiferroics", "spintronics", "DFT", "ferroelectricity", "Halleffect", "theory"], "image": "", "briefing": {"background": "알터마그네티즘은 스핀-궤도 결합(SOC) 없이도 거대한 스핀 분할을 제공하여 차세대 스피트로닉스의 핵심 소재로 떠오르고 있지만, 이를 전기적으로 정밀하게 제어하는 방법은 여전히 난제로 남아 있습니다.", "motivation": "슬라이딩 강유전성(sliding ferroelectricity)을 이용하여 알터마그넷의 대칭성을 엔지니어링함으로써, 단순한 이진 제어를 넘어선 다중 상태(six-state) 스핀 제어 플랫폼을 이론적으로 제안하고자 했습니다.", "result": "이중층 MnP S3(manganese phosphorus trisulfide)에 대한 제일원리 계산을 통해, 층 간 슬라이딩에 따른 3개의 비축퇴 경로가 6개의 서로 다른 알터마그네틱 상태를 생성함을 발견했습니다. 이는 스핀 분할의 방향을 역전시킬 뿐만 아니라 120도 간격으로 회전시킬 수 있음을 의미합니다.", "implication": "전기장을 통해 운동량 공간의 스핀 기하학적 구조를 재구성할 수 있게 되어, 고차원 메모리나 복합적인 스피트로닉스 소자 구현 가능성을 제시합니다. 특히 비선형 홀 응답을 통해 각 상태를 전기적으로 읽어낼 수 있습니다.", "novelty": "알터마그네티즘, 강유전성, 반데르발스 이중층, 그리고 비선형 홀 효과를 하나로 묶은 연구입니다. 사용자의 관심사인 Berry 곡률, 알터마그네티즘 및 2D 소재 특성과 밀접하게 연관됩니다.", "unresolved": "이론적 예측인 만큼, 실제 소자 환경에서 슬라이딩 경로를 정밀하게 제어하고 비선형 홀 효과를 노이즈 없이 측정할 수 있는지에 대한 실험적 검증이 숙제로 남아 있습니다.", "future_work": "MnP S3 및 유사 vdW 자성체에서의 슬라이딩 강유전성 실험 구현 및 비선형 홀 효과를 이용한 6진법 상태 감지 시험.", "concepts": [{"term": "슬라이딩 강유전성 (Sliding Ferroelectricity)", "why_emerged": "2차원 층상 물질에서 층 간의 상대적 이동(sliding)만으로 전기 편향이 발생하는 새로운 메커니즘을 설명하기 위해 등장했습니다.", "origin": "최근 2D vdW 물질 연구(예: h-BN, WTe2)에서 발견", "connections": "반데르발스 헤테로구조, 전기적 극성 제어"}, {"term": "비선형 홀 효과 (Nonlinear Hall Effect)", "why_emerged": "시간 역전 대칭성이 깨지지 않은 상태에서도 Berry 곡률 쌍극자에 의해 발생하는 홀 전도 현상을 설명하기 위해 필요합니다.", "origin": "Fu (2015) 등의 이론적 제안", "connections": "Berry 곡률 쌍극자, 양자 기하학"}, {"term": "스핀 할당 텍스처 (Spin-splitting Texture)", "why_emerged": "운동량 공간에서 스핀 분할이 일어나는 방향과 크기의 분포를 시각화하고 제어하기 위해 사용됩니다.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "ARPES 스핀 분해능, 알터마그네티즘"}, {"term": "제일원리 계산 (First-principles calculations)", "why_emerged": "실험 전 물질의 전자 구조와 물리적 특성을 양자역학적으로 예측하기 위해 사용됩니다.", "origin": "밀도범함수이론(DFT)의 발전", "connections": "DFT, DMFT, 소재 설계"}], "english_summary": ["Proposed a six-state control of altermagnetism in bilayer MnP S3 via sliding ferroelectricity.", "Sliding paths switch and rotate the spin-splitting texture in 120-degree increments.", "Established a direct link between spin textures and nonlinear Hall response fingerprints.", "Offers a versatile platform for electric field-driven manipulation of momentum-space spin geometry."]}}, {"title": "Prediction of 1:1 kagome metals with superconductivity and nontrivial band topology", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/6s1z-jd8d", "authors": "Na Jiao, Shu-Xiang Qiao, Pan Zhou, Hong-Yan Lu, Ping Zhang", "last_authors": "Hong-Yan Lu, Ping Zhang", "summary": "Author(s): Na Jiao, Shu-Xiang Qiao, Pan Zhou, Hong-Yan Lu, and Ping Zhang Kagome superconductors featuring topologically nontrivial band structures have attracted extensive research interest. FeSn and CoSn is an interesting kind of kagome material with intrinsic magnetism, which suppresses the emergence of superconductivity. Here, we theoretically predict a type of 1:1 ka… [Phys. Rev. B 113, 214507] Published Mon Jun 01, 2026", "tier": "B_IMPORTANT_CONDMAT", "score": "10", "reason": "Direct hit on kagome superconductors and nontrivial topology predictions.; demoted from A: broad CM, not direct user/project hit", "tags": ["theory", "kagome", "superconductivity"], "image": "", "briefing": {"background": "카고메 격자 구조는 플랫 밴드, 디락 콘, 반성적 자성 등 독특한 물리적 특성을 유도할 수 있는 기하학적 구조를 제공합니다. 최근 AV3Sb5와 같은 카고메 초전도체 계열이 발견되면서, 위상학적 특성과 초전도성이 공존하는 시스템에 대한 연구가 전 세계적으로 활발히 진행 중입니다.", "motivation": "FeSn 및 CoSn과 같은 기존 1:1 카고메 금속들은 강한 자성을 띠고 있어 초전도 현상이 나타나기 어렵습니다. 본 연구는 자성에 의해 억제되지 않는 초전도성과 위상학적으로 비자명한 밴드 구조를 동시에 갖는 새로운 1:1 조성의 카고메 금속을 이론적으로 탐색하고자 수행되었습니다.", "result": "이론적 계산을 통해 초전도성과 위상적 밴드 구조를 모두 보유한 새로운 유형의 1:1 카고메 금속 물질군을 예측하였습니다. 이 물질들은 기존의 자성 1:1 카고메 시스템과 달리 초전도 상호작용이 우세할 수 있는 전자 구조적 조건을 갖추고 있습니다.", "implication": "만약 이 예측이 실험적으로 확인된다면, AV3Sb5(1-3-5 계열)에 국한되었던 카고메 초전도체 연구를 1:1 조성의 새로운 플랫폼으로 확장할 수 있습니다. 이는 위상 초전도체 구현을 위한 새로운 후보 물질군이 될 수 있습니다.", "novelty": "기존에 자성체로만 주로 알려졌던 1:1 카고메 구조에서 초전도성을 이끌어낼 수 있는 구체적인 물질 설계 원리를 제시했다는 점이 혁신적이며, 독자의 주된 관심사인 AV3Sb5 초전도체 연구와 직접적으로 연결됩니다.", "unresolved": "이론적 예측 단계이므로 실제 고품질 단결정 합성이 가능한지, 그리고 예측된 전이 온도가 실험적으로 측정될 수 있는지가 관건입니다.", "future_work": "실제 물질 합성 시도와 더불어, ARPES를 이용한 예측된 위상 밴드 구조(디락 콘, 플랫 밴드)의 직접적인 관측이 필수적입니다.", "concepts": [{"term": "카고메 초전도체 (Kagome Superconductor)", "why_emerged": "카고메 격자에서 나타나는 특이한 전자 상태(플랫 밴드 등)와 초전도성의 상관관계를 연구하기 위해 등장함.", "origin": "AV3Sb5 (A=K, Rb, Cs) 계열의 발견으로 본격화됨.", "connections": "AV3Sb5, CsV3Sb5, 위상 초전도"}, {"term": "1:1 카고메 금속", "why_emerged": "카고메 층이 화학적 조성비 1:1로 쌓이는 간단한 구조를 탐구하기 위해 정의됨.", "origin": "FeSn, CoSn 등의 이원 화합물 연구에서 유래.", "connections": "FeSn, CoSn, 자성 카고메 시스템"}], "english_summary": ["The paper theoretically predicts a new class of 1:1 kagome metals that exhibit both superconductivity and nontrivial band topology.", "Unlike conventional 1:1 kagome materials like FeSn which are magnetic, these proposed materials support a superconducting ground state.", "The discovery provides a new platform beyond the well-known AV3Sb5 series for studying topological superconductivity in kagome lattices."]}}, {"title": "Collinear ferromagnetism with reduced moment length in kagome magnet Nd3Ru4Al12", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/9pvl-33xc", "authors": "Yuki Ishihara, Ryota Nakano, Rinsuke Yamada, et al.", "last_authors": "Taro Nakajima, Max Hirschberger", "summary": "Author(s): Yuki Ishihara, Ryota Nakano, Rinsuke Yamada, Takuya Nomoto, Priya R. Baral, Moritz M. Hirschmann, Kamini Gautam, Kamil K. Kolincio, Akiko Kikkawa, Seno Aji, Hiraku Saitoh, Masaaki Matsuda, Yasujiro Taguchi, Taka-hisa Arima, Yoshinori Tokura, Taro Nakajima, and Max Hirschberger We determine the magnetic ground state of the kagome lattice magnet ${\\mathrm{Nd}}_{3}{\\mathrm{Ru}}_{4}{\\mathrm{Al}}_{12}$ by single-crystal neutron diffraction, supported by experiments with polarized neutrons. We identify this material as a collinear ferromagnet (“hex-FM”) with uniform moment leng… [Phys. Rev. B 113, 214410] Published Tue Jun 02, 2026", "tier": "B_IMPORTANT_CONDMAT", "score": "9", "reason": "Neutron diffraction study of magnetic order in a kagome lattice material relevant to electronic structure research.", "tags": ["experiment", "Nd3Ru4Al12", "kagome"], "image": "", "briefing": {"background": "카고메 격자 기반 자성체는 기하학적 좌절(Geometric Frustration)로 인해 비공선(non-collinear) 자기 구조나 스핀 액체 상태와 같은 복잡한 물리 현상을 보일 수 있어 자성 연구의 핵심 대상입니다.", "motivation": "카고메 자성체인 Nd3Ru4Al12의 정확한 자기 바닥 상태가 무엇인지 규명하고, 이 물질이 갖는 특이한 자기 모멘트 배열을 실험적으로 확인하고자 했습니다.", "result": "단결정 중성자 회절 실험을 통해 Nd3Ru4Al12가 'hex-FM'이라 불리는 공선형 강자성(collinear ferromagnet) 상태임을 확인하였습니다. 특히 모든 위치에서 자기 모멘트의 길이가 균일하다는 점을 명확히 했습니다.", "implication": "이 물질의 자기 구조가 공선형 강자성으로 판명됨에 따라, 향후 이 물질의 전자 구조(ARPES)나 수송 특성 분석 시 복잡한 비공선 자성을 고려할 필요가 없음을 시사합니다.", "novelty": "편극 중성자 회절을 포함한 정밀한 실험을 통해 Nd 기반 카고메 시스템에서의 자기 질서를 확정했다는 점이 중요하며, 이는 카고메 금속의 자성과 전자 구조의 상호작용을 연구하는 독자에게 기초 자료로서 가치가 높습니다.", "unresolved": "Nd의 국부 모멘트와 Ru의 전도 전자 간의 상호작용이 전체 강자성 상태 형성에 구체적으로 어떤 역할을 하는지에 대한 미시적 메커니즘은 추가 연구가 필요합니다.", "future_work": "강자성 상태에서의 비정상 홀 효과(AHE) 측정 및 밴드 구조의 스핀 분리 현상을 관찰하기 위한 ARPES 연구가 기대됩니다.", "concepts": [{"term": "공선형 강자성 (Collinear Ferromagnetism)", "why_emerged": "모든 스핀이 동일한 방향 또는 평행한 방향으로 배열되는 가장 기본적인 자성 상태를 정의하기 위해 사용됨.", "origin": "초록 정보만으로는 특정하기 어려움 (고전적 자성 이론)", "connections": "비공선 자성, 기하학적 좌절"}, {"term": "중성자 회절 (Neutron Diffraction)", "why_emerged": "물질 내부의 자기 구조(모멘트의 방향 및 크기)를 원자 수준에서 직접 측정하기 위해 고안됨.", "origin": "Clifford Shull (1940년대 후반 실험적 확립)", "connections": "자기 구조 결정, 자기 산란"}], "english_summary": ["The magnetic ground state of the kagome magnet Nd3Ru4Al12 is determined to be a collinear ferromagnet using single-crystal neutron diffraction.", "The study identifies a uniform moment length across the lattice, categorized as a 'hex-FM' state.", "This finding clarifies the magnetic background for future electronic structure and transport studies on this Nd-based kagome system."]}}, {"title": "Detection of ferroic octupole ordering in d-wave altermagnetic rutile-type compounds", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/d9r5-8hy8", "authors": "Masaichiro Mizumaki, Norimasa Sasabe, Takayuki Uozumi, Rikuto Oiwa, Hiroaki Kusunose", "last_authors": "Rikuto Oiwa, Hiroaki Kusunose", "summary": "Author(s): Masaichiro Mizumaki, Norimasa Sasabe, Takayuki Uozumi, Rikuto Oiwa, and Hiroaki Kusunose We propose that x-ray absorption and emission magnetic circular dichroism (XAS-MCD and XES-MCD) are promising measurements to directly detect ferroic higher-rank multipoles as candidate order parameters in altermagnets. Using the sum rules for XES-MCD and connecting them to multipole language, we de… [Phys. Rev. B 113, 235105] Published Mon Jun 01, 2026", "tier": "B_IMPORTANT_CONDMAT", "score": "9", "reason": "Proposes spectroscopic detection (CD) of order parameters in altermagnets, a primary interest area.; demoted from A: broad CM, not direct user/project hit", "tags": ["theory", "altermagnet", "spectroscopy"], "image": "", "briefing": {"background": "알터마그네티즘(Altermagnetism)은 넷 자화(Net Magnetization)가 0임에도 불구하고 결정 구조의 대칭성에 의해 스핀 분리된 밴드 구조를 갖는 새로운 자성 분류입니다. 하지만 순수한 반강자성체처럼 자화가 없어 그 질서 파라미터를 직접 측정하기 어렵다는 문제가 있습니다.", "motivation": "d-웨이브 대칭성을 갖는 루틸 구조 알터마그넷 등에서 나타나는 페로익 고차 멀티폴(ferroic higher-rank multipoles, 특히 옥투폴) 질서를 실험적으로 직접 검출할 수 있는 분광학적 방법론을 제시하고자 합니다.", "result": "X-선 흡수 및 방출 자기 원형 이색성(XAS-MCD 및 XES-MCD)의 합 규칙(Sum Rules)을 분석하여, 이를 멀티폴 언어와 연결함으로써 알터마그넷의 옥투폴 질서를 직접 감지할 수 있음을 이론적으로 증명했습니다.", "implication": "알터마그네티즘을 확인하기 위해 그간 의존해왔던 ARPES의 스핀 분리 관측이나 비정상 홀 효과 외에도, X-선 분광학을 통한 직접적인 질서 파라미터 검출이 가능해집니다.", "novelty": "알터마그네틱 질서를 '페로익 옥투폴'로 정의하고 이를 X-선 이색성과 연결한 이론적 프레임워크를 제공했다는 점이 독창적이며, 이는 알터마그네티즘 연구의 실험적 지평을 넓히는 중요한 진전입니다.", "unresolved": "이론적으로 제안된 합 규칙이 실제 실험 데이터의 배경 신호나 다체 효과 속에서 얼마나 명확하게 추출될 수 있을지에 대한 실험적 검증이 남아 있습니다.", "future_work": "RuO2 등 대표적인 알터마그넷 후보 물질에 대한 실제 XAS/XES-MCD 실험 및 옥투폴 모멘트의 정량적 추출 시도가 예상됩니다.", "concepts": [{"term": "알터마그네티즘 (Altermagnetism)", "why_emerged": "자화는 없지만 스핀 보존 대칭성이 깨져 밴드 스핀 분리가 일어나는 제3의 자성 상태를 설명하기 위해 등장함.", "origin": "L. Šmejkal, J. Sinova, T. Jungwirth (2022년경 체계화)", "connections": "반강자성, 비정상 홀 효과, 스핀-분리 밴드"}, {"term": "페로익 옥투폴 (Ferroic Octupole)", "why_emerged": "단순한 자기 쌍극자(Dipole)로는 설명할 수 없는 고차원적인 자기 질서 파라미터를 기술하기 위해 도입됨.", "origin": "초록 정보만으로는 특정하기 어려움 (멀티폴 전개 이론)", "connections": "고차 멀티폴 질서, 알터마그네틱 오더 파라미터"}, {"term": "자기 원형 이색성 (MCD)", "why_emerged": "좌/우 원편광 X-선의 흡수 차이를 통해 물질의 자기적 비대칭성을 정밀하게 측정하기 위해 개발됨.", "origin": "초록 정보만으로는 특정하기 어려움 (1980년대 후반 X-선 영역 확장)", "connections": "XAS, XES, 스핀-궤도 결합"}], "english_summary": ["The paper proposes XAS-MCD and XES-MCD as direct spectroscopic probes for detecting ferroic octupole ordering in d-wave altermagnets.", "By connecting X-ray dichroism sum rules to multipole language, the authors provide a method to observe hidden orders in compensated magnets.", "This theoretical framework offers a vital experimental path to verify altermagnetism beyond spin-split ARPES or transport measurements."]}}, {"title": "Evolution of charge density wave soft phonon modes in PdxErTe3", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/7ky1-nmyx", "authors": "Avishek Maity, Stephan Rosenkranz, Raymond Osborn, et al.", "last_authors": "Ian R. Fisher, Frank Weber", "summary": "Author(s): Avishek Maity, Stephan Rosenkranz, Raymond Osborn, Rolf Heid, Ayman H. Said, Ahmet Alatas, Joshua A. W. Straquadine, Matthew J. Krogstad, Anisha G. Singh, Ian R. Fisher, and Frank Weber Here, the authors use diffuse and inelastic x-ray scattering to investigate the dynamics of orthogonal charge density waves (CDWs) in Pd x ErTe 3 . Strong diffuse scattering and phonon softening persist at wave vector q a (|| a * ) equal in magnitude to the ordering vector q c (|| c * ) of the primary CDW, although small intercalation already suppresses the secondary CDW order near q a . The authors demonstrate that diffuse scattering and phonon softening at q a is coupled to fluctuations of the onset of the primary CDW for all intercalation levels. [Phys. Rev. B 113, 224101] Published Mon Jun 01, 2026", "tier": "B_IMPORTANT_CONDMAT", "score": "9", "reason": "Directly relevant study of CDW dynamics in a telluride material class.; demoted from A: broad CM, not direct user/project hit", "tags": ["experiment", "CDW", "PdxErTe3"], "image": "", "briefing": {"background": "희토류 트리텔루라이드(RTe3) 시스템은 준2차원 구조에서 전하 밀도 파동(CDW)이 발생하는 대표적인 격자계입니다. 특히 이 물질군은 직교하는 두 방향(a축 및 c축)으로의 CDW 경쟁과 공존 현상을 연구하기에 적합하여 고체 물리학에서 오랫동안 주목받아 왔습니다.", "motivation": "본 연구는 ErTe3에 팔라듐(Pd)을 소량 삽입(intercalation)했을 때, 주 CDW 방향(c축)과 보조 CDW 방향(a축)의 격자 동역학 및 소프트 포논 모드가 어떻게 변화하는지를 규명하고자 했습니다.", "result": "비탄성 X선 산란 실험 결과, 매우 적은 양의 Pd 삽입만으로도 a축 방향의 장범위 보조 CDW 정렬은 억제되지만, 해당 파수(qa)에서의 강력한 산란 확산(diffuse scattering)과 포논 연화(phonon softening) 현상은 여전히 유지됨을 확인했습니다. 이는 a축의 요동이 c축의 주 CDW 발현과 밀접하게 결합되어 있음을 시사합니다.", "implication": "장범위 질서가 사라진 상태에서도 강한 포논 연화가 관찰된다는 것은, 특정 파수에서의 전자-격자 결합이 질서의 유무와 상관없이 물질의 기저 상태를 결정하는 강력한 요소임을 보여줍니다.", "novelty": "CDW의 억제 과정에서도 사라지지 않는 '고스트' 포논 연화 현상을 정밀하게 관찰했다는 점이 중요하며, 이는 독자가 관심을 가진 텔루라이드(Tellurides) 계열 물질의 CDW 동역학 이해에 직접적인 정보를 제공합니다.", "unresolved": "Pd 삽입이 구체적으로 어떤 미시적 메커니즘을 통해 장범위 정렬만을 선택적으로 파괴하면서 요동(fluctuation)은 남겨두는지에 대한 추가적인 모델링이 필요합니다.", "future_work": "다른 희토류 원소가 포함된 RTe3 시스템에서도 동일한 결합 현상이 나타나는지 확인하기 위한 비교 연구가 진행될 것으로 보입니다.", "concepts": [{"term": "Soft Phonon Mode", "why_emerged": "구조적 상전이가 일어날 때 특정 격자 진동 모드의 에너지가 0으로 수렴하는 현상을 설명하기 위해 도입되었습니다.", "origin": "초록 nce to CDW and excitonic physics in a common ARPES/STM material system.; demoted from A: broad CM, not direct user/project hit", "tags": ["theory", "CDW", "monolayer"], "image": "", "briefing": {"background": "TiSe2는 전하 밀도 파동(CDW)의 기원이 '엑시톤 응축(exciton condensation)'에 의한 것인지 아니면 '얀-텔러 효과(Jahn-Teller effect)'에 의한 것인지에 대해 수십 년간 논쟁이 이어져 온 물질입니다.", "motivation": "단층(monolayer) TiSe2에서 CDW 상태가 자발적으로 생성된 엑시톤의 응축에 의해 발생하는지를 이론적으로 검증하고, 이 과정에서 이온 스크리닝(ionic screening)이 어떤 역할을 하는지 분석하고자 했습니다.", "result": "단층 TiSe2의 CDW 상에서 자발적으로 생성되고 응축된 엑시톤의 존재를 확인하였으며, 이온 스크리닝 효과가 이러한 엑시톤 절연체 상태의 안정성과 형성에 기여한다는 점을 밝혔습니다.", "implication": "이 결과는 TiSe2의 CDW 메커니즘에서 엑시톤 응축 시나리오를 지지하며, 저차원 시스템에서 엑시톤 물성을 제어하는 새로운 관점을 제공합니다.", "novelty": "논란이 많은 TiSe2 시스템에서 단층 극한의 효과와 스크리닝 효과를 구체적으로 다루었다는 점이 핵심이며, 독자의 주 관심사인 ARPES/STM 연구 대상 물질에 대한 중요한 이론적 배경을 제공합니다.", "unresolved": "실제 실험 환경(기판 효과 등)에서 이론적으로 예측된 이온 스크리닝 강도가 어떻게 변화할지에 대한 추가 연구가 필요합니다.", "future_work": "엑시톤 응축의 직접적인 증거를 찾기 위한 운동량 분해 전자 에너지 손실 분광(M-EELS)이나 고해상도 ARPES 실험과의 비교가 예상됩니다.", "concepts": [{"term": "Excitonic Insulator", "why_emerged": "반금통 또는 반도체에서 전자와 홀의 쿨롱 인력에 의한 결합체(엑시톤)가 자발적으로 응축되어 절연 상태가 되는 현상을 설명하기 위해 제안되었습니다.", "origin": "Mott, Knox, Keldysh 등이 1960년대에 제안", "connections": "BCS-BEC crossover, CDW, Collective modes"}, {"term": "Ionic Screening", "why_emerged": "물질 내의 이온들이 외부 전하 또는 내부 전하 분포의 변화를 차폐하여 유효 상호작용 강도를 변화시키는 현상을 설명하기 위해 도입되었습니다.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "Dielectric function, Coulomb interaction, Lattice polarization"}, {"term": "Jahn-Teller Effect", "why_emerged": "축퇴된 전자 상태를 가진 비선형 분자나 결정계가 자발적 변형을 통해 에너지를 낮추고 대칭성을 깨뜨리는 현상을 설명하기 위해 등장했습니다.", "origin": "Hermann Jahn, Edward Teller (1937)", "connections": "Electron-phonon coupling, Structural distortion"}, {"term": "Monolayer TiSe2", "why_emerged": "벌크와는 다른 극한의 2차원 한계에서 나타나는 양자 현상을 연구하기 위해 제작 및 연구되기 시작했습니다.", "origin": "2D material synthesis advances (MBE/Exfoliation)", "connections": "TMDs, Quantum confinement, Peierls instability"}], "english_summary": 적층 구조, 전자 상관관계가 복합적으로 작용하여 절연 상태의 특성을 결정함을 확인했습니다.", "implication": "광학적 자극과 화학적 도핑을 결합하여 강상관 물질의 상전이 경로를 정밀하게 설계할 수 있음을 보여줍니다.", "novelty": "전형적인 CDW 물질인 TaS2에서 도핑과 진폭 모드 역학의 관계를 초고속 시간 영역에서 분석했다는 점이 혁신적이며, 독자가 관심을 갖는 '실제 물질에서의 플로케(Floquet) 엔지니어링' 및 '전자 구조 제어'와 직접적으로 연결됩니다.", "unresolved": "도핑된 계에서 무질서(disorder)가 진폭 모드의 가간섭성(coherence)에 미치는 정량적인 영향은 아직 명확히 정의되지 않았습니다.", "future_work": "적층 방식(stacking arrangement)을 임의로 조절한 반데르발스 이종접합 구조에서의 초고속 역학 연구로 확장될 가능성이 큽니다.", "concepts": [{"term": "Amplitude Mode", "why_emerged": "CDW와 같은 질서 파라미터(order parameter)의 진폭 요동에 해당하는 집단적 여기 상태를 설명하기 위해 필요합니다.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "Higgs mode, Time-resolved spectroscopy, CDW dynamics"}, {"term": "Mott Insulator", "why_emerged": "전자 사이의 강한 쿨롱 반발력 때문에 금속이어야 할 물질이 절연체가 되는 현상을 설명하기 위해 등장했습니다.", "origin": "Nevill Mott (1949)", "connections": "Hubbard model, Strong correlation, 1T-TaS2"}, {"term": "Polaronic Distortion", "why_emerged": "전자가 격자 왜곡을 동반하며 이동할 때 형성되는 준입자(polaron)에 의한 국부적 격자 변형을 설명하기 위해 도입되었습니다.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "Electron-phonon coupling, Charge localization"}, {"term": "Ultrafast Electronic Structure Engineering", "why_emerged": "평형 상태에서는 도달할 수 없는 새로운 양자 상태를 빛을 이용해 극히 짧은 시간 동안 유도하고 제어하기 위해 발전했습니다.", "origin": "Time-resolved ARPES/Spectroscopy techniques", "connections": "Floquet engineering, Non-equilibrium physics"}], "english_summary": ["The study explores ultrafast electronic changes in pristine and Mo-doped 1T-TaS2.", "Focuses on the interplay between polaronic distortions, correlation, and amplitude mode dynamics.", "Demonstrates how doping and light pulses can be used to engineer the material's insulating state.", "Results provide insights into the stability and transient control of Mott-CDW phases."]}}, {"title": "Berry-Curvature Activation by Orbital Flux in a Kagome Altermagnet", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2606.04984", "authors": "Meysam Bagheri Tagani, Carmine Autieri", "last_authors": "Meysam Bagheri Tagani, Carmine Autieri", "summary": "arXiv:2606.04984v1 Announce Type: new Abstract: We investigate topological electronic responses in a kagome altermagnetic metal hosting a compensated coplanar $120^\\circ$ magnetic texture. Using a minimal tight-binding model incorporating nearest-neighbor hopping, noncollinear exchange coupling, intrinsic spin--orbit coupling, and an emergent orbital chiral flux, we demonstrate that frustrated kagome altermagnets provide a natural platform for realizing momentum-dependent spin splitting and Berry-curvature engineering without net magnetization. The noncollinear exchange field alone generates pronounced altermagnetic spin splitting and spin-polarized Fermi surfaces despite the absence of relativistic effects. However, for a strictly coplanar magnetic state, the system preserves a hidden antiunitary symmetry $\\mathcal{T}C_{2z}$, which enforces identically vanishing Berry curvature even in the presence of sizeable spin--orbit coupling. We show that finite Berry curvature emerges only after introducing an orbital chiral flux term that breaks the hidden symmetry and generates effective momentum-space gauge fields analogous to a Haldane-type orbital flux. Remarkably, this mechanism produces local Berry curvature hot spots even in the complete absence of spin--orbit coupling and scalar spin chirality, establishing a purely orbital route toward topological altermagnetism. By systematically analyzing the anomalous Hall conductivity as a function of exchange coupling, spin--orbit interaction, and chiral flux, we identify a hierarchy of competing energy scales governing the transition from a symmetry-protected altermagnetic metal to a topological altermagnetic phase with strong Hall response. Our results demonstrate that frustrated kagome altermagnets constitute a versatile platform for engineering topological transport, Berry curvature, and spin-selective electronic structure in compensated magnetic systems.", "tier": "B_IMPORTANT_CONDMAT", "score": "9", "reason": "Directly relevant topic (kagome, altermagnet, Berry curvature) with specific interest to the user's project profile.", "tags": ["kagome", "altermagnet", "Berrycurvature"], "image": "https://arxiv.org/html/2606.04984v1/Figure1.png", "briefing": {"background": "알터마그넷(Altermagnet)은 순자화가 0임에도 불구하고 강자성체처럼 스핀 분할된 밴드 구조를 갖는 새로운 자성 상태입니다. 카고메 격자는 기하학적 좌절 구조 덕분에 특이한 전자 상태와 위상 현상을 연구하기에 최적화된 플랫폼으로 꼽힙니다.", "motivation": "120도 비공선 자성 구조를 갖는 카고메 알터마그넷에서, 일반적으로 베리 곡률(Berry curvature)이 상쇄되는 대칭성 제약을 어떻게 극복하고 위상 수송 특성을 끌어낼 수 있는지 규명하고자 했습니다.", "result": "단순한 공선/비공선 자성 상태에서는 숨겨진 대칭성(TC2z)으로 인해 베리 곡률이 사라지지만, '궤도 카이럴 플럭스(orbital chiral flux)'를 도입하면 이 대칭성이 깨지며 베리 곡률 핫스팟이 생성됨을 확인했습니다. 이는 스핀-궤도 결합(SOC)이 전혀 없는 상태에서도 발생할 수 있습니다.", "implication": "스핀-궤도 결합이나 순자화가 없는 계에서도 궤도 자유도 조작을 통해 거대한 변칙 홀 효과(AHE)를 생성할 수 있음을 시사하며, 알터마그넷 기반 위상 소자 설계의 새로운 경로를 제시합니다.", "novelty": "카고메 알터마그넷에서 베리 곡률을 '활성화'하는 메커니즘으로 궤도 플럭스를 제시한 점이 독창적입니다. 특히 독자의 주요 관심사인 카고메 금속(AV3Sb5 등)에서 논의되는 루프 커런트/카이럴리티 개념과 알터마그네티즘을 연결했다는 점에서 매우 중요합니다.", "unresolved": "이론적으로 제시된 궤도 카이럴 플럭스를 실제 카고메 물질에서 외부 자기장이나 변형 없이 어떻게 자발적으로 구현하거나 정밀하게 제어할 것인지에 대한 실험적 검증이 필요합니다.", "future_work": "제시된 모델을 기반으로 실제 후보 물질(예: 특정 전이금속 기반 카고메 산화물 또는 칼코게나이드)의 DFT 계산 및 ARPES/전하 수송 실험을 통한 검증이 기대됩니다.", "concepts": [{"term": "알터마그넷 (Altermagnet)", "why_emerged": "강자성(스핀 분할)과 반강자성(순자화 0)의 장점을 동시에 갖는 물질을 분류하기 위해 등장했습니다.", "origin": "최근 Tomas Jungwirth 연구 그룹 등에 의해 이론적으로 정립됨", "connections": "반강자성 스핀트로닉스, 비공선 자성체, 스핀 할 효과"}, {"term": "베리 곡률 (Berry Curvature)", "why_emerged": "전자 파동함수의 기하학적 위상 효과가 전자의 수송 특성(변칙 홀 효과 등)에 미치는 영향을 설명하기 위해 도입되었습니다.", "origin": "Michael Berry (1984)", "connections": "변칙 홀 효과, 위상 절연체, 궤도 자기 모멘트"}, {"term": "궤도 카이럴 플럭스 (Orbital Chiral Flux)", "why_emerged": "원자 간 호핑 과정에서 발생하는 유효 게이지 장을 통해 전자 궤도 운동의 카이럴리티를 묘사하기 위해 사용됩니다.", "origin": "Haldane 모델 등 위상 모델 연구에서 유래", "connections": "루프 커런트, 할데인 모델, 시간 역전 대칭성 깨짐"}, {"term": "비공선 자성 (Noncollinear Magnetism)", "why_emerged": "스핀이 평 n two-dimensional altermagnets", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/d1gz-fmwy", "authors": "Shibo Fang, Zongmeng Yang, Jianhua Wang, et al.", "last_authors": "Xiaotian Wang, Yee Sin Ang", "summary": "Author(s): Shibo Fang, Zongmeng Yang, Jianhua Wang, Xingyue Yang, Jing Lu, Ching Hua Lee, Xiaotian Wang, and Yee Sin Ang The coupling between real-space inhomogeneity coordinates and spin $(\\mathbf{r}\\text{−}\\mathbf{s})$ provides an alternative route to achieve efficient spin manipulation in spintronics beyond the conventional momentum-spin $(\\mathbf{k}\\text{−}\\mathbf{s})$ coupling paradigm. Here, we demonstrate an un… [Phys. Rev. B 113, 224407] Published Mon Jun 01, 2026", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Relevant study of altermagnets and their 1D edge state properties.", "tags": ["theory", "altermagnet", "edgestates"], "image": "", "briefing": {"background": "알터마그네티즘(Altermagnetism)은 최근 정의된 자성 상태로, 강자성체처럼 스핀 분할된 에너지 밴드를 가지면서도 반강자성체처럼 순 자화(net magnetization)가 0인 독특한 특성을 가집니다. 이는 기존 스핀트로닉스의 한계를 극복할 수 있는 새로운 플랫폼으로 주목받고 있습니다.", "motivation": "기존의 스핀 제어는 주로 운동량-스핀(k-s) 결합에 의존해 왔습니다. 본 연구는 2차원 알터마그넷에서 실공간의 불균일성 좌표와 스핀(r-s) 간의 결합을 통해 1차원 전자 소자를 구현할 수 있는 새로운 경로를 제안하고자 합니다.", "result": "2차원 알터마그넷의 가장자리(edge)에서 발생하는 1차원 상태를 이론적으로 증명하였으며, 이를 통해 효율적인 스핀 조작이 가능함을 보였습니다. 초록이 도중에 끊겨 있어 구체적인 전도 특성 수치는 확인이 어려우나, 가장자리 상태를 활용한 새로운 스핀트로닉스 메커니즘을 제시한 것으로 보입니다.", "implication": "알터마그넷이 단순한 벌크 물성을 넘어, 나노 구조의 가장자리 상태를 이용한 저전력·고효율 스핀 소자로 응용될 수 있음을 시사합니다.", "novelty": "독자의 관심사인 알터마그넷을 1차원 가장자리 상태와 연결했다는 점이 핵심입니다. 특히 k-s 결합이 아닌 r-s 결합이라는 새로운 패러다임을 제시하여 물리적 차별성을 확보했습니다.", "unresolved": "이론적 예측을 뒷받침할 실제 2차원 알터마그넷 후보 물질에서의 실험적 검증(ARPES 또는 STM을 통한 가장자리 상태 관측)이 필요합니다.", "future_work": "실제 실험 그룹과의 협력을 통해 후보 물질의 박막 또는 나노 리본 형태에서 제안된 1차원 상태를 관측하는 연구가 이어질 것으로 예상됩니다.", "concepts": [{"term": "알터마그네티즘 (Altermagnetism)", "why_emerged": "강자성의 큰 스핀 분할과 반강자성의 빠른 동역학/0의 자화를 동시에 갖는 물질을 분류하기 위해 등장했습니다.", "origin": "최근 며칠 년 사이 Libor Šmejkal 등에 의해 이론적으로 확립되었습니다.", "connections": "반강자성 스핀트로닉스, 베리 곡률, 비정상 홀 효과와 깊은 연관이 있습니다."}, {"term": "가장자리 상태 (Edge States)", "why_emerged": "2차원 물질의 경계에서 벌크와는 다른 고유한 양자 상태가 나타나 전도 채널을 형성하기 때문입니다.", "origin": "양자 홀 효과 및 위상 절연체 연구에서 유래되었습니다.", "connections": "위상적 불변성, 1차원 전도체, 위상 준금속의 표면 상태와 연결됩니다."}], "english_summary": ["The study proposes 1D electronics using edge states in 2D altermagnets.", "It explores real-space inhomogeneity-spin (r-s) coupling for spin manipulation.", "This approach moves beyond the conventional momentum-spin (k-s) coupling paradigm.", "The results suggest new possibilities for low-dissipation spintronic devices."]}}, {"title": "Pressure tuning of the charge density wave and superconductivity in the noncentrosymmetric superconductor 4Ha−TaSe2", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/pbgh-693x", "authors": "Zhihan Si, Shaopeng Wang, Yonghui Zhou, et al.", "last_authors": "Xiaoping Yang, Zhaorong Yang", "summary": "Author(s): Zhihan Si, Shaopeng Wang, Yonghui Zhou, Junxiang Yuan, Ranran Zhang, Shuyang Wang, Chao An, Yuzhou Bao, Xuliang Chen, Ying Zhou, Min Zhang, Lili Zhang, Xiaoping Yang, and Zhaorong Yang Here, we report the structure-property relationship in pressurized $4\\mathit{Ha}−{\\mathrm{TaSe}}_{2}$ single crystals. Electrical transport and low-temperature Raman spectroscopy measurements indicate a charge density wave (CDW) transition at ${T}_{\\mathrm{CDW}}∼120$ K under ambient pressure. High-p… [Phys. Rev. B 113, 214508] Published Wed Jun 03, 2026", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Experimental study of pressure-tuned charge density wave and superconductivity in a transition metal dichalcogenide.", "tags": ["experiment", "TaSe2", "CDW"], "image": "", "briefing": {"background": "전이금속 디칼코게나이드(TMD) 시스템에서 전하 밀도 파동(CDW)과 초전도성(SC)은 서로 경쟁하거나 공존하며 복잡한 위상도를 형성합니다. 특히 비중심대칭(noncentrosymmetric) 구조를 가진 물질은 독특한 쌍맺힘(pairing) 대칭성을 가질 가능성이 있어 중요하게 다루어집니다.", "motivation": "비중심대칭 구조인 4Ha-TaSe2 단결정에서 외부 압력을 가했을 때 CDW와 초전도성이 어떻게 변화하고 상호작용하는지 규명하고자 했습니다.", "result": "상압에서 약 120K에서 발생하는 CDW 전이를 확인했으며, 저온 라만 분광법과 전기 수송 측정을 통해 압력에 따른 CDW의 억제와 초전도성의 진화 과정을 추적했습니다. 고압 하에서의 구조-물성 상관관계를 성공적으로 기술했습니다.", "implication": "4Ha-TaSe2가 CDW와 초전도성 사이의 상호작용을 연구하기 위한 새로운 비중심대칭 플랫폼임을 확인시켜 주었습니다.", "novelty": "비교적 덜 연구된 4Ha 폴리타입 TaSe2에 집중하여 압력이라는 변수로 전자 상을 제어했다는 점이 돋보입니다. 독자의 관심사인 TaNiTe2 등 112 계열 및 CDW 연구와 맥락을 같이 합니다.", "unresolved": "CDW가 완전히 사라지는 임계 압력 근처에서 초전도 증강이 나타나는지, 혹은 두 상태가 미시적으로 공존하는지에 대한 상세한 메커니즘은 추가 연구가 필요합니다.", "future_work": "고압 ARPES 실험을 통해 압력에 따른 페르미 면의 재구성(reconstruction)을 직접 관측하는 연구가 유망할 것으로 보입니다.", "concepts": [{"term": "4Ha-TaSe2", "why_emerged": "TaSe2의 다양한 적층 방식(polytypes) 중 하나로, 대칭성이 깨진 구조적 특성을 탐구하기 위해 선택되었습니다.", "origin": "초록 정보만으로는 특정하기 어려움 (전통적인 TMD 연구의 확장).", "connections": "2H-TaSe2, 1T-TaSe2, 4Hb-TaSe2 등 다른 폴리타입과의 비교 연구."}, {"term": "비중심대칭 초전도체 (Noncentrosymmetric SC)", "why_emerged": "공간 반전 대칭성이 깨지면 스핀-궤도 결합에 의해 싱글렛과 트리플렛 쌍맺힘이 섞일 수 있기 때문입니다.", "origin": "CePt3Si 등 중페르미온 물질 연구에서 본격화되었습니다.", "connections": "파울리 한계 초과, 스핀-궤도 결합, 위상 초전도성."}], "english_summary": ["Pressure-tuned phase diagram of noncentrosymmetric 4Ha-TaSe2 is reported.", "CDW transition at 120 K is observed and suppressed under high pressure.", "Electrical transport and Raman spectroscopy reveal the evolution of superconductivity.", "The study highlights the competition between CDW and SC in this noncentrosymmetric system."]}}, {"title": "Rashba-type spin-momentum locking in the nonsymmorphic Dirac semimetal SrIrO3 revealed by nonlinear magnetotransport", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/x5tv-wvtn", "authors": "Meng Meng, Minghui Gu, Zhuang Ji, et al.", "last_authors": "Jiandi Zhang, Jiandong Guo", "summary": "Author(s): Meng Meng, Minghui Gu, Zhuang Ji, Dongxiao Yang, Fang Yang, Xiaoran Liu, Jiandi Zhang, and Jiandong Guo We report nonreciprocal charge transport in epitaxial monoclinic ${\\mathrm{SrIrO}}_{3}$ ($m$-SIO) thin films, a nonsymmorphic symmetry-protected Dirac semimetal with strong spin-orbit coupling. Second-harmonic magnetotransport measurements reveal both bilinear magnetoelectric resistance and a nonlin… [Phys. Rev. B 113, 235403] Published Mon Jun 01, 2026", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Experimental transport study of spin-momentum locking in a well-known Dirac semimetal.", "tags": ["experiment", "SrIrO3", "topologicalsemimetal"], "image": "", "briefing": {"background": "SrIrO3는 강한 스핀-궤도 결합을 가진 5d 산화물로, 결정 구조의 비공형(nonsymmorphic) 대칭성에 의해 보호되는 디락 준금속 상태를 가집니다. 이러한 위상적 상태는 효율적인 스핀-전하 변환을 가능하게 합니다.", "motivation": "SrIrO3 박막에서 나타나는 스핀-운동량 잠금(spin-momentum locking) 현상을 비선형 자기수송 측정이라는 민감한 기법을 통해 실험적으로 입증하고자 했습니다.", "result": "에피택셜 SrIrO3 박막에서 2차 조화파(second-harmonic) 전압 측정을 통해 쌍선형 자기전기 저항(bilinear magnetoelectric resistance, BMER)을 관측했습니다. 이는 라슈바(Rashba) 형태의 스핀-운동량 잠금이 존재함을 나타내는 직접적인 증거입니다.", "implication": "SrIrO3가 차세대 스핀트로닉스 소자(예: 스핀-궤도 토크 소자)를 위한 고효율 스핀 소스 물질로 사용될 수 있음을 증명했습니다.", "novelty": "단순한 선형 수송 측정을 넘어 비선형 수송(nonlinear transport) 기법을 사용해 디락 준금속의 스핀 구조를 밝혀냈다는 점이 중요합니다. 독자의 관심사인 디락 준금속 및 스핀-궤도 결합 물리와 밀접합니다.", "unresolved": "관측된 신호에서 벌크 디락 밴드와 표면 상태의 기여도를 정량적으로 분리하는 작업이 남아 있습니다.", "future_work": "스핀-궤도 토크(SOT) 효율을 직접 측정하거나, gating을 통해 화학적 포텐셜을 조절하며 BMER 신호의 변화를 살피는 연구가 가능합니다.", "concepts": [{"term": "비공형 대칭성 (Nonsymmorphic symmetry)", "why_emerged": "단순한 회전이나 반사 외에 평행 이동이 결합된 대칭성으로, 새로운 형태의 위상 밴드 구조를 보호하기 위해 중요합니다.", "origin": "결정학적 군론(Space group theory)에서 유래되었습니다.", "connections": "디락 준금속, 모비우스 절연체, SrIrO3."}, {"term": "비선형 자기수송 (Nonlinear magnetotransport)", "why_emerged": "선형 응답에서 가려진 스핀-궤도 결합의 세부 정보를 반전 대칭성이 깨진 계에서 추출하기 위해 사용됩니다.", "origin": "최근 2차원 물질 및 위상 물질 연구에서 활발히 도입되었습니다.", "connections": "BMER, 2차 조화파 측정, 라슈바 효과."}], "english_summary": ["Rashba-type spin-momentum locking in SrIrO3 thin films is experimentally confirmed.", "Nonlinear magnetotransport measurements reveal bilinear magnetoelectric resistance.", "The study utilizes the nonsymmorphic symmetry-protected Dirac semimetal nature of SrIrO3.", "Findings suggest high potential for spin-orbit torque applications in 5d oxide systems."]}}, {"title": "Second-order anomalous Hall effect controlled by electric fields in altermagnets", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/wb4y-tzln", "authors": "Arnob Mukherjee, Biplab Sanyal, Annica M. Black-Schaffer, Ankita Bhattacharya", "last_authors": "Annica M. Black-Schaffer, Ankita Bhattacharya", "summary": "Author(s): Arnob Mukherjee, Biplab Sanyal, Annica M. Black-Schaffer, and Ankita Bhattacharya Altermagnets are a recently discovered class of compensated magnets with momentum-dependent spin splittings and unusual transport properties, even without a net magnetization. In the presence of combined fourfold rotation and time-reversal (${C}_{4}\\mathcal{T}$) symmetry, linear and also second orde… [Phys. Rev. B 113, L220401] Published Wed Jun 03, 2026", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Theoretical study of electric field-controlled second-order anomalous Hall effect in altermagnetic materials.", "tags": ["theory", "altermagnetism", "anomalousHall"], "image": "", "briefing": {"background": "알터마그넷(Altermagnet)은 알짜 자화(net magnetization)가 0이면서도 운동량 공간에서 스핀 분열이 발생하는 새로운 자성체 분류로, 기존 강자성체와 반강자성체의 장점을 동시에 갖추고 있어 스핀트로닉스 분야에서 큰 주목을 받고 있습니다.", "motivation": "이 연구는 외부 전기장을 통해 알터마그넷의 비선형 수송 특성인 2차 변칙 홀 효과(Second-order Anomalous Hall Effect)를 정밀하게 제어할 수 있는 물리적 메커니즘을 탐구합니다.", "result": "사회전 및 시간 반전 대칭성($C_4 \\mathcal{T}$)이 결합된 알터마그넷에서 외부 전기장이 베리 곡률(Berry curvature) 분포를 변화시켜, 선형뿐만 아니라 2차 변칙 홀 효과를 유도하고 스위칭할 수 있음을 이론적으로 증명하였습니다.", "implication": "자기장을 사용하지 않고 전압만으로 스핀 수송 특성을 제어할 수 있는 가능성을 열어, 차세대 저전력 비휘발성 메모리 및 연산 소자 구현을 위한 이론적 가이드를 제공합니다.", "novelty": "알터마그넷의 고유한 대칭성 조건 하에서 비선형 수송 현상을 전기장으로 제어하는 경로를 제시했다는 점이 혁신적이며, 사용자의 주요 관심사인 베리 곡률 및 알터마그네티즘과 밀접하게 연계됩니다.", "unresolved": "이론적 예측을 뒷받침할 구체적인 물질(예: $RuO_2$)에서의 정량적인 신호 세기와 불순물 산란의 영향에 대한 실험적 확인이 남아
