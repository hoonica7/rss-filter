 3 − λ , ]. Our results provide momentum-resolved evidence for dynamic correlations of high-spin and low-spin Co 3 + states characterized by q SSO = ( ½ , ½ , ½ ) c , demonstrating that phonons are sensitive probes of fluctuating spin-state correlations in LaCoO 3 .", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Experimental study of spin-state order and transitions in a correlated material using scattering.", "tags": ["experiment", "neutronscattering", "x-rayscattering", "stronglycorrelated", "spin-stateorder", "LaCoO3"], "image": "", "briefing": {"background": "LaCoO3는 온도 변화에 따라 저스핀(LS)에서 고스핀(HS) 상태로 전이하는 물질로, 스핀 상태 전이와 금속-절연체 전이 간의 복잡한 상관관계를 밝히는 것이 현대 응집물리학의 난제입니다.", "motivation": "스핀 상태 정렬(spin-state order)이 실제로 존재하는지, 그리고 이것이 격자 동역학(phonons)에 어떤 영향을 주는지 규명하고자 했습니다.", "result": "비탄성 산란 실험을 통해 스핀 상태 정렬 패턴과 일치하는 특정 q-벡터에서의 포논 연화(phonon softening) 현상을 관측했습니다.", "implication": "포논 산란이 스핀 상태의 동역학적 변화를 탐지하는 강력한 도구임을 입증하였습니다.", "novelty": "Goodenough가 제안했던 오래된 스핀 상태 정렬 가설을 동역학적 포논 산란 데이터를 통해 현대적으로 증명하였습니다.", "unresolved": "포논 연화가 스핀 상태 전이의 직접적인 원인인지, 아니면 그 결과로 나타나는 격자 응답인지는 명확히 구분되지 않았습니다.", "future_work": "이러한 포논-스핀 결합 관측 기법을 다른 강상관 전자계 물질에 적용하여 복잡한 자성 패턴 연구에 활용 가능합니다.", "concepts": [{"term": "Spin-state crossover", "why_emerged": "온도에 따라 전자 구성이 변하는 전이금속 산화물의 성질을 설명하기 위해", "origin": "Goodenough 등", "connections": "결정장 이론, 훈트 결합, 란타넘 코발타이트"}, {"term": "Phonon softening", "why_emerged": "격자의 동역학적 불안정성을 통해 상전이를 이해하기 위해", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "구조 상전이, 전자-포논 상호작용"}], "english_summary": ["Explores lattice dynamics in LaCoO3 across spin-state transitions.", "Detects anomalous phonon softening at specific momentum vectors.", "Provides experimental evidence for dynamic spin-state ordering.", "Validates Goodenough's model using inelastic scattering techniques."]}}, {"title": "Chirality-induced magnetoresistance in hybrid organic-inorganic perovskite semiconductors", "journal": "Science_Advances", "source": "Gemini", "link": "https://doi.org/10.1126/sciadv.aed7176", "authors": "Md Azimul Haque, Pius M. Theiler, Ian A. Leahy, et al.", "last_authors": "Dali Sun, Matthew C. Beard", "summary": "The combination of semiconducting properties and synthetically tunable chirality in chiral metal halide semiconductors (CMHSs) offers a compelling platform for room temperature control of electronic spin properties, leveraging effects such as chirality-induced spin selectivity (CISS). We report CISS-induced magnetoresistance (CISS-MR) exceeding 100% for spin valves operating at room temperature. The high CISS-MR is attributed to an interfacial tunneling barrier, modulated by chirality and spin, producing current dissymmetry factors ( g c ) that surpass the limit imposed by the Julliere model, which is governed by the intrinsic spin polarization of the adjacent ferromagnetic (FM) contact. The CISS-MR exhibits a dependence on the CMHS composition, revealing structure-property relationships between CISS and structural chirality. The observed exceptionally large tunneling MR response differs from a subtle anisotropic MR arising from the proximity effect at the FM/CMHS interface in the absence of a tunneling barrier. Our study provides insights into charge-to-spin interconversion in chiral semiconductors, offering design principles to control and enhance the CISS response for functional platforms.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Investigates chirality-induced magnetoresistance and spin properties in relevant semiconductor materials.", "tags": ["magnetoresistance", "spin", "chirality", "perovskites", "semiconductors"], "image": "", "briefing": {"background": "카이랄 유도 스핀 선택성(CISS)은 카이랄 구조를 가진 분자나 물질이 전자의 스핀 방향에 따라 전하 수송을 다르게 제어하는 현상입니다. 기존의 강자성 전극 기반 스핀 소자보다 상온에서 구현하기 쉽고, 차세대 스핀트로닉스 소자 개발의 핵심 분야입니다.", "motivation": "카이랄 금속 할로겐화물 반도체(CMHS)가 가진 구조적 카이랄성을 활용하여, 기존 강자성체의 스핀 편극 한계를 뛰어넘는 효율적인 스핀 제어 메커니즘을 규명하고자 연구를 수행했습니다.", "result": "상온에서 100%를 초과하는 CISS 기반 자기저항(CISS-MR)을 관측했습니다. 이는 기존 Julliere 모델이 제시한 전 erlattices formed in van der Waals heterostructures by twisting, lattice mismatch and strain present an opportunity for creating metamaterials with unique properties absent in the individual layers. Ferroelectricity for example, arises from broken inversion symmetry in twisted and strained bilayers of 2D semiconductors with stacking domains of alternating out-of-plane polarization. However, the individual contributions of twist and strain to the formation of topological polar nanostructures remain unclear and experimentally challenging to resolve. Inversion symmetry breaking is predicted to generate in-plane polarization along the domain walls, forming topologically non-trivial Bloch-type merons (half-skyrmions) in twisted systems and Néel-type merons in strained systems. Here we utilize angle-resolved vector piezoresponse force microscopy to spatially resolve polarization components and topological polar nanostructures in marginally twisted bilayer WSe 2 , providing experimental evidence of topologically non-trivial meron/antimeron structures. This approach can be used to distinguish Bloch-type, Néel-type and hybrid structures, allowing us to quantify the separate contributions of strain and twist in a moiré superlattice, opening pathways for exploring twist-induced topology in engineered nano-devices.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Experimental study of topological polar structures in twisted 2D materials, relevant to broader interests.", "tags": ["moire", "twistedbilayer", "2Dmaterials", "topological", "vanderWaalsheterostructure", "experiment"], "image": "", "briefing": {"background": "자동 브리핑을 생성하지 못했습니다. 초록과 원문 링크를 기준으로 빠르게 확인하세요.", "motivation": "초록 정보만으로는 분야 내부의 구체적 동기를 안정적으로 요약하기 어렵습니다.", "result": "Moiré superlattices formed in van der Waals heterostructures by twisting, lattice mismatch and strain present an opportunity for creating metamaterials with unique properties absent in the individual layers. Ferroelectricity for example   if (r.tier) badges.appendChild(textEl('span', 'badge', r.tier));
  if (r.journal) badges.appendChild(textEl('span', 'badge', r.journal));
  if (r.source) badges.appendChild(textEl('span', 'badge', r.source));
  headText.appendChild(badges);
  const title = document.createElement('h1');
  if (r.link) { const titleLink = document.createElement('a'); titleLink.href = r.link; titleLink.target = '_blank'; titleLink.rel = 'noopener noreferrer'; titleLink.textContent = r.title || ''; title.appendChild(titleLink); }
  else { title.textContent = r.title || ''; }
  headText.appendChild(title);
  headText.appendChild(textEl('p', 'meta', [r.journal, r.source].filter(Boolean).join(' | ')));
  if (r.last_authors || r.authors) { const authors = document.createElement('p'); authors.className = 'authors'; if (r.last_authors) authors.append('Last authors: ' + r.last_authors); if (r.authors) authors.append((r.last_authors ? ' | ' : '') + 'Authors: ' + r.authors); headText.appendChild(authors); }
  appendLabeledText(headText, 'why', 'Filter reason: ', r.reason);
  if (r.tags && r.tags.length) { const tags = document.createElement('div'); tags.className = 'tags'; r.tags.forEach(tag => tags.appendChild(textEl('span', 'tag', '#' + tag))); headText.appendChild(tags); }
  if (r.link) { const link = document.createElement('a'); link.className = 'link'; link.href = r.link; link.target = '_blank'; link.rel = 'noopener noreferrer'; link.textContent = 'Open paper'; headText.appendChild(link); }
  head.appendChild(headText);
  if (r.summary) { const abstract = document.createElement('p'); abstract.className = 'original-abstract'; const strong = textEl('strong', '', 'Original abstract'); abstract.appendChild(strong); abstract.append(r.summary); head.appendChild(abstract); }
  slideEl.appendChild(head);
  const briefing = document.createElement('div');
  briefing.className = 'briefing';
  appendBriefSection(briefing, 'Background', b.background);
  appendBriefSection(briefing, 'Motivation', b.motivation);
  appendBriefSection(briefing, 'Result', b.result);
  appendBriefSection(briefing, 'Implication', b.implication);
  appendBriefSection(briefing, "Why it's important / Novelty", b.novelty);
  appendBriefSection(briefing, 'Unresolved Questions', b.unresolved);
  appendBriefSection(briefing, 'Expected Future Work', b.future_work);
  if (b.concepts && b.concepts.length) {
    const section = document.createElement('section');
    section.className = 'brief-section wide';
    section.appendChild(textEl('h2', '', 'Concepts / Terms'));
    const concepts = document.createElement('div');
    concepts.className = 'concepts';
    b.concepts.forEach(c => {
      const item = document.createElement('div');
      item.className = 'concept';
      item.appendChild(textEl('h3', '', c.term || 'Concept'));
      [['왜 생겼나: ', c.why_emerged], ['누가 만들었나: ', c.origin], ['연결되는 흐름: ', c.connections]].forEach(([label, text]) => { if (!text) return; const p = document.createElement('p'); const bold = textEl('b', '', label); p.appendChild(bold); p.append(text); item.appendChild(p); });
      concepts.appendChild(item);
    });
    section.appendChild(concepts);
    briefing.appendChild(section);
  }
  if (b.english_summary && b.english_summary.length) { const section = document.createElement('section'); section.className = 'brief-section wide'; section.appendChild(textEl('h2', '', 'English Summary')); const ul = document.createElement('ul'); b.english_summary.slice(0, 5).forEach(line => ul.appendChild(textEl('li', '', line))); section.appendChild(ul); briefing.appendChild(section); }
  slideEl.appendChild(briefing);
  counterEl.textContent = `${index + 1} / ${slides.length}`;
  prevBtn.disabled = index === 0;
  nextBtn.disabled = index === slides.length - 1;
}
prevBtn.addEventListener('click', () => { index = Math.max(0, index - 1); render(); });
nextBtn.addEventListener('click', () => { index = Math.min(slides.length - 1, index + 1); render(); });
document.addEventListener('keydown', event => { if (event.key === 'ArrowLeft') prevBtn.click(); if (event.key === 'ArrowRight') nextBtn.click(); });
render();
</script>
</body>
</html>
