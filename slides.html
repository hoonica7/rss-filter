n) 시스템은 강한 전자 상관관계로 인해 양자 임계점(QCP) 부근에서 비정상적인 물성을 보입니다. 대개 초전도 상태는 QCP 주변에서 나타나며, 때로는 QCP가 초전도 돔 내부에 숨겨져 있기도 합니다.", "motivation": "CeCoIn5라는 대표적인 무거운 페르미온 초전도체에서 Zn 도핑을 통해 초전도 상태 내부에 숨겨진 자기 양자 임계점(magnetic QCP)을 찾아내고, 그것이 초전도 특성에 미치는 영향을 규명하고자 했습니다.", "result": "스캐닝 SQUID 현미경을 이용해 국소적 임계 온도(Tc)에 따른 자기 침투 깊이(lambda)의 스케일링을 분석했습니다. 결과적으로 절대 영도에서 침투 깊이가 정점을 찍는 현상을 발견했으며, 이는 초전도 돔 내부에 자기 양자 임계점이 존재함을 입증합니다.", "implication": "초전도 상태가 형성된 후에도 그 내부에서 자성 요동에 의한 양자 임계 현상이 살아남아 초전도 응집(superfluid density)에 직접적인 영향을 미친다는 것을 보여줍니다.", "novelty": "전통적인 벌크 측정이 아닌 스캐닝 SQUID를 통한 국소적 측정법을 사용하여, 도핑의 불균일성을 역이용해 QCP를 명확히 짚어냈다는 점이 매우 혁신적입니다. 사용자 관심사인 무거운 페르미온 및 양자 임계 현상과 직결됩니다.", "unresolved": "이 양자 임계 현상이 구체적으로 어떤 종류의 자기 질서(예: 반강자성)와 연관되어 있는지, 그리고 다른 무거운 페르미온 초전도체에서도 보편적으로 나타나는지 확인해야 합니다.", "future_work": "Zn 외의 다른 불순물 도핑이나 압력 조절을 통한 추가 검증, 그리고 초전도 돔 내부의 자기 질서 구조를 직접 관찰하기 위한 중성자 산란 실험 등이 병행될 수 있습니다.", "concepts": [{"term": "양자 임계점(Quantum Critical Point, QCP)", "why_emerged": "절대 영도에서 압력, 자기장, 도핑 등의 변수에 의해 상전이가 일어날 때 발생하는 강력한 양자 요동을 이해하기 위해 등장했습니다.", "origin": "Hertz, Millis 등에 의해 이론적 틀이 마련됨", "connections": "비-페르미 액체, 무거운 페르미온, 양자 요동"}, {"term": "자기 침투 깊이(London Penetration Depth)", "why_emerged": "초전도체 내부로 자기장이 얼마나 깊이 침투하는지를 나타내며, 초전도 전하 운반자의 밀도(superfluid density)를 측정하는 척도로 사용됩니다.", "origin": "1935년 Fritz 및 Heinz London 형제가 제안", "connections": "마이스너 효과, 초전도 응집, 런던 방정식"}, {"term": "무거운 페르미온(Heavy Fermion)", "why_emerged": "f-오비탈 전자와 전도 전자 사이의 강한 혼성으로 인해 유효 질량이 매우 커진 전자 시스템을 설명하기 위해 도입되었습니다.", "origin": "1970년대 Steglich 등이 CeCu2Si2에서 처음 발견", "connections": "Kondo 효과, f-전자 시스템, 비관습적 초전도"}, {"term": "스캐닝 SQUID 현미경(Scanning SQUID Microscopy)", "why_emerged": "미세한 자기장을 높은 공간 해상도로 측정하여 초전도체나 자성체의 국소적인 물리량을 시각화하기 위해 개발되었습니다.", "origin": "SQUID 소자 제작 기술의 미세화와 함께 발전", "connections": "자속 양자화, 국소 수송 특성, 자기 감수율 측정"}], "english_summary": ["Discovers a magnetic quantum critical point hidden within the superconducting state of Zn-doped CeCoIn5.", "Utilizes scanning SQUID microscopy to map local Tc and magnetic penetration depth lambda(0).", "Shows a peak in lambda(0) at the QCP, indicating that magnetic fluctuations suppress the superfluid density.", "Provides a new methodology for identifying QCPs in inhomogeneous samples by using local scaling analysis."]}}, {"title": "Material Realization of Spinless, Covalent-Type Dirac Semimetals in Three Dimensions", "journal": "PRL_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/pshy-l48q", "authors": "Yuki Tanaka, Rinsuke Yamada, Manabu Sato, et al.", "last_authors": "Motoaki Hirayama, Max Hirschberger", "summary": "Realization of a three-dimensional (3D) analog of graphene has been a central challenge in topological materials science. Graphene is stabilized by covalent bonding, unlike conventional spin-orbit-type 3D Dirac semimetals (DSMs). In this study, we demonstrate the material realization of covalent-typ…", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Demonstrates a new class of 3D Dirac semimetals, a core interest for topological materials.", "tags": ["experiment", "Diracsemimetal", "topological"], "image": "", "briefing": {"background": "3차원 디락 준금속(DSM)은 전도대와 가전자대가 선형적으로 만나는 디락 점을 가진 물질로, 현대 위상 물질 연구의 핵심입니다. 기존에 알려진 대부분의 3차원 DSM(예: Cd3As2, Na3Bi)은 강한 스핀-궤도 결합(SOC)에 의존하여 밴드 반전을 일으키고 디락 상태를 형성하는 방식이었습니다.", "motivation": "2차원 물질인 그래핀은 SOC가 매우 약함에도 불구하고 탄소 원자 간의 공유 결합과 격자 대칭성만으로 안정적인 디락 상태를 가집니다. 본 연구는 이러한 '공유 결합형' 또는 '스핀리스' 특성을 가진 그래핀의 물리적 메커니즘을 3차원으로 확장한 실제 물질을 구현하고자 했습니다.", "result": "연구진은 강한 SOC 대신 원자 간의 공유 결합 특성에 기반하여 3차원 디락 점이 형성되는 물질계를 실험적으로 입증했습니다. 이는 SOC가 지배적인 기존의 위상 물질 설계 패러다임에서 벗어나, 화학적 결합 구조를 통해 위상적 특성을 제어할 수 있음을 보여줍니다.", "implication": "이 결과는 경원소(light element) 기반의 물질에서도 견고한 위상 상태를 만들 수 있음을 의미합니다. 또한, 스핀 자유도가 밴드 형성에 필수적이지 않은 '스핀리스' 물리 시스템을 제공함으로써, 순수하게 대칭성에 기반한 위상 현상을 연구할 수 있는 새로운 플랫폼이 될 것입니다.", "novelty": "기존 SOC 중심의 DSM과 달리 '3차원 그래핀 아날로그'를 실제 물질에서 실현했다는 점이 독보적입니다. 독자의 관심사인 ARPES 및 전자 구조 연구 측면에서, SOC에 의해 쪼개지지 않은 순수한 디락 분산을 관측할 수 있는 귀중한 사례가 될 것으로 보입니다.", "unresolved": " function render() {
  slideEl.replaceChildren();
  if (!slides.length) { slideEl.className = 'empty'; slideEl.textContent = 'No papers passed the filters in this run.'; counterEl.textContent = '0 / 0'; prevBtn.disabled = true; nextBtn.disabled = true; return; }
  slideEl.className = 'slide';
  const r = slides[index];
  const b = r.briefing || {};
  const head = document.createElement('div');
  head.className = 'paper-head';
  if (r.image) {
    const figure = document.createElement('figure');
    figure.className = 'figure';
    const img = document.createElement('img');
    img.src = r.image; img.alt = 'Figure or article preview image'; img.loading = 'lazy'; img.referrerPolicy = 'no-referrer'; img.onerror = () => figure.remove();
    figure.appendChild(img);
    figure.appendChild(textEl('figcaption', '', 'Figure / article preview image from the source page'));
    head.appendChild(figure);
  }
  const headText = document.createElement('div');
  headText.className = 'head-text';
  const badges = document.createElement('div');
  badges.className = 'badges';
  if (r.score) badges.appendChild(textEl('span', 'badge score', `${r.score}/10`));
  if (r.tier) badges.appendChild(textEl('span', 'badge', r.tier));
  if (r.journal) badges.appendChild(textEl('span', 'badge', r.journal));
  if (r.source) badges.appendChild(textEl('span', 'badge', r.source));
  headText.appendChild(badges);
  const title = document.createElement('h1');
  if (r.link) { const titleLink = document.createElement('a'); titleLink.href = r.link; titleLink.target = '_blank'; titleLink.rel = 'noopener noreferrer'; titleLink.textContent = r.title || ''; title.appendChild(titleLink); }
  else { title.textContent = r.title || ''; }
  headText.appendChild(title);
  headText.appendChild(textEl('p', 'meta', [r.journal, r.source].filter(Boolean).join(' | ')));
  if (r.last_authors || r.authors) { const authors = document.createElement('p'); authors.className = 'authors'; if (r.last_authors) authors.append('Last authors: ' + r.last_authors); if (r.authors) authors.append((r.last_authors ? ' | ' : '') + 'Authors: ' + r.authors); headText.appendChild(authors); }
  appendLabeledText(headText, 'why', 'Filter reason: ', r.reason);
  if (r.tags && r.tags.length) { const tags = document.createElement('div'); tags.className = 'tags'; r.tags.forEach(tag => tags.appendChild(textEl('span', 'tag', '#' + tag))); headText.appendChild(tags); }
  if (r.link) { const link = document.createElement('a'); link.className = 'link'; link.href = r.link; link.target = '_blank'; link.rel = 'noopener noreferrer'; link.textContent = 'Open paper'; headText.appendChild(link); }
  head.appendChild(headText);
  if (r.summary) { const abstract = document.createElement('p'); abstract.className = 'original-abstract'; const strong = textEl('strong', '', 'Original abstract'); abstract.appendChild(strong); abstract.append(r.summary); head.appendChild(abstract); }
  slideEl.appendChild(head);
  const briefing = document.createElement('div');
  briefing.className = 'briefing';
  appendBriefSection(briefing, 'Background', b.background);
  appendBriefSection(briefing, 'Motivation', b.motivation);
  appendBriefSection(briefing, 'Result', b.result);
  appendBriefSection(briefing, 'Implication', b.implication);
  appendBriefSection(briefing, "Why it's important / Novelty", b.novelty);
  appendBriefSection(briefing, 'Unresolved Questions', b.unresolved);
  appendBriefSection(briefing, 'Expected Future Work', b.future_work);
  if (b.concepts && b.concepts.length) {
    const section = document.createElement('section');
    section.className = 'brief-section wide';
    section.appendChild(textEl('h2', '', 'Concepts / Terms'));
    const concepts = document.createElement('div');
    concepts.className = 'concepts';
    b.concepts.forEach(c => {
      const item = document.createElement('div');
      item.className = 'concept';
      item.appendChild(textEl('h3', '', c.term || 'Concept'));
      [['왜 생겼나: ', c.why_emerged], ['누가 만들었나: ', c.origin], ['연결되는 흐름: ', c.connections]].forEach(([label, text]) => { if (!text) return; const p = document.createElement('p'); const bold = textEl('b', '', label); p.appendChild(bold); p.append(text); item.appendChild(p); });
      concepts.appendChild(item);
    });
    section.appendChild(concepts);
    briefing.appendChild(section);
  }
  if (b.english_summary && b.english_summary.length) { const section = document.createElement('section'); section.className = 'brief-section wide'; section.appendChild(textEl('h2', '', 'English Summary')); const ul = document.createElement('ul'); b.english_summary.slice(0, 5).forEach(line => ul.appendChild(textEl('li', '', line))); section.appendChild(ul); briefing.appendChild(section); }
  slideEl.appendChild(briefing);
  counterEl.textContent = `${index + 1} / ${slides.length}`;
  prevBtn.disabled = index === 0;
  nextBtn.disabled = index === slides.length - 1;
}
prevBtn.addEventListener('click', () => { index = Math.max(0, index - 1); render(); });
nextBtn.addEventListener('click', () => { index = Math.min(slides.length - 1, index + 1); render(); });
document.addEventListener('keydown', event => { if (event.key === 'ArrowLeft') prevBtn.click(); if (event.key === 'ArrowRight') nextBtn.click(); });
render();
</script>
</body>
</html>
