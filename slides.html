tion signatures.", "Organizes magnetic crystals into 17 universal spin-lattice types.", "Predicts new phenomena like specific 3Q orders and compensated magnetic states."]}}, {"title": "Majorana flat bands from mirror-particle-hole antisymmetry", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2611.31597", "authors": "Justin Schirmann, Martin Rodriguez-Vega, Alexander Cerjan", "last_authors": "Martin Rodriguez-Vega, Alexander Cerjan", "summary": "Majorana flat bands, zero modes across the whole edge Brillouin zone, usually rest on chiral symmetry. We show that a fully gapped class-D superconductor can host such a flat band without chiral symmetry or time reversal, provided its superconducting gap is odd under a mirror and translation along the edge is preserved. Combined with particle--hole conjugation, the mirror forms an antiunitary antisymmetry that squares to $+1$ and preserves the momentum along the edge, so it fixes the Kitaev index of every slice of fixed edge momentum. In a gapped bulk, this slice index cannot change with the edge momentum, and the edge zero modes form a band across the whole edge Brillouin zone. We construct a four-band model with exactly these symmetries, a helical $p$-wave superconductor with Rashba coupling in an in-plane exchange field, from which no term can be removed without restoring an additional symmetry. On the mirror lines, its two mirror sectors are exact Kitaev chains. This yields a closed-form phase diagram. Besides the flat band, the model hosts a phase with two Majoranas at each end of a wire, although its class-D index is trivial, and a second-order phase with Majorana corner modes. The spectral localizer detects all these indices in real space, directly on finite-size samples as relevant for experiments. On open rectangular flakes of two widths, it reproduces the phase diagram even though translational symmetry is broken. In the nodal regions, its reading depends on the flake size, so they are left unread. The readings persist under disorder several times the bulk gap. Without translation along the edge, the symmetries protect no more than Majorana parities, and we quantify the signatures that remain specific to the antisymmetry. A minimal model of magnetic adatoms on a triplet superconductor realizes the flat-band and second-order phases.", "tier": "C_MAYBE", "score": "7", "reason": "Theoretical framework for Majorana modes relevant to potential STS experimental signatures.; tier capped to C: formal/generic theory watch", "tags": ["Majorana", "topology", "STS"], "image": "https://arxiv.org/html/2611.31597v1/fig1_phases.png", "briefing": {"background": "초전도체 표면이나 경계에서 나타나는 마요라나 모드는 위상 초전도체의 중요한 지표이며, 특히 평탄 밴드(flat band) 현상은 강한 상태 밀도로 인해 실험적으로 관측이 용이함.", "motivation": "일반적으로 마요라나 평탄 밴드는 카이랄 대칭성에 의존하지만, 이 논문은 카이랄 대칭성 없이 거울-입자-정공 반대칭성(mirror-particle-hole antisymmetry)만으로 평탄 밴드가 발생하는 메커니즘을 규명하고자 함.", "result": "거울 대칭성과 입자-정공 대칭성의 결합이 특정 조건에서 경계 전 영역에 걸쳐 평탄한 마요라나 밴드를 보호할 수 있음을 이론적으로 증명하고 모델을 제시함.", "implication": "기존에 평탄 밴드가 존재하지 않을 것으로 여겨졌던 시스템에서 새로운 위상적 상태를 찾을 가능성을 열어줌.", "novelty": "STS(주사 터널링 분광법)에서 관측 가능한 국소 상태 밀도의 위상적 특징을 명확히 제시함. 마요라나 관련 실험을 하는 연구자들에게 실질적인 가이드라인을 제공함.", "unresolved": "제시된 모델을 실제 물질에서 구현할 때의 구체적인 제약 조건(예: 격자 결함, 불순물의 영향 등)은 실제 시스템별로 연구가 필요함.", "future_work": "자성 원자를 배열한 초전도체 표면에서의 STS 실험을 통해 예측된 평탄 밴드 및 코너 모드(corner modes) 신호를 탐색할 것으로 보임.", "concepts": [{"term": "Majorana Flat Band", "why_emerged": "에너지 분산이 없는 마요라나 모드는 상태 밀도가 극도로 높아 실험적 검출 신호를 극대화할 수 있기 때문.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "Topological superconductors, STS, chiral symmetry."}, {"term": "Spectral Localizer", "why_emerged": "유한한 크기의 시료에서 벌크 위상 불변량을 계산하거나 실험적 국소 관측량을 도출하기 위해 필요한 도구.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "Topological index, real-space analysis."}], "english_summary": ["Identifies a mechanism for Majorana flat bands protected by mirror-particle-hole antisymmetry.", "Requires no chiral symmetry, expanding the phase space for Maj
