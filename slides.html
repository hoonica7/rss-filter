<title>Daily Paper Slideshow</title>
<style>
  :root {
    color-scheme: light;
    --bg: #f6f7f4;
    --paper: #ffffff;
    --ink: #111827;
    --muted: #64748b;
    --line: #d8ddd2;
    --accent: #176b87;
    --accent-2: #9a3412;
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; overflow: auto; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: var(--bg); color: var(--ink); }
  .shell { max-width: 1500px; min-height: 100vh; margin: 0 auto; padding: 14px 18px; display: flex; flex-direction: column; }
  .topbar { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 16px; }
  .top-actions { display: flex; align-items: center; gap: 10px; }
  .topbar a, button { border: 1px solid var(--line); border-radius: 8px; background: var(--paper); color: var(--ink); padding: 10px 14px; font-weight: 700; text-decoration: none; cursor: pointer; }
  button.primary { background: var(--accent); border-color: var(--accent); color: white; }
  button:disabled { opacity: 0.45; cursor: not-allowed; }
  .counter { color: var(--muted); font-weight: 700; }
  .slide { min-height: calc(100vh - 82px); background: var(--paper); border: 1px solid var(--line); border-radius: 10px; padding: 18px; box-shadow: 0 18px 42px rgba(15, 23, 42, 0.10); display: grid; grid-template-columns: minmax(310px, 0.86fr) minmax(0, 1.55fr); gap: 18px; overflow: visible; }
  .paper-head { min-width: 0; min-height: 0; overflow: visible; display: flex; flex-direction: column; gap: 12px; }
  .figure { margin: 0; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: #f8fafc; }
  .figure img { display: block; width: 100%; max-height: 41vh; object-fit: contain; background: white; }
  .figure figcaption { padding: 7px 10px; color: var(--muted); font-size: 12px; line-height: 1.3; }
  .head-text { display: flex; flex-direction: column; gap: 9px; min-width: 0; }
  .badges { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .badge { border-radius: 999px; padding: 5px 9px; background: #eef2ff; color: #3730a3; font-size: 12px; font-weight: 800; }
  .score { background: #fee2e2; color: #991b1b; }
  h1 { margin: 0; font-size: 25px; line-height: 1.15; letter-spacing: 0; overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
  h1 a { color: inherit; text-decoration-color: rgba(23, 107, 135, 0.35); text-decoration-thickness: 2px; text-underline-offset: 4px; }
  h1 a:hover { color: var(--accent); text-decoration-color: var(--accent); }
  .meta, .authors, .why, .abstract { font-size: 13px; line-height: 1.45; }
  .meta, .authors { color: var(--muted); }
  .why strong, .abstract strong, .authors strong { color: var(--ink); }
  .authors { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .why { border-left: 4px solid var(--accent-2); padding-left: 10px; color: #374151; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .abstract { border-top: 1px solid var(--line); padding-top: 14px; color: #374151; }
  .original-abstract { border-top: 1px solid var(--line); padding-top: 10px; color: #374151; font-size: 11.5px; line-height: 1.35; overflow-wrap: anywhere; }
  .original-abstract strong { display: block; margin-bottom: 4px; color: var(--ink); }
  .tags { display: flex; flex-wrap: wrap; gap: 8px; }
  .tag { border-radius: 999px; padding: 4px 8px; background: #f1f5f9; color: #475569; font-size: 12px; font-weight: 700; }
  .head-text > .link { display: none; }
  .briefing { min-width: 0; min-height: 0; overflow: visible; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); grid-auto-rows: minmax(0, auto); align-content: start; gap: 11px 18px; border-top: 0; padding-top: 0; }
  .brief-section { min-width: 0; }
  .brief-section.wide { grid-column: 1 / -1; }
  .brief-section h2 { margin: 0 0 4px; font-size: 14px; line-height: 1.22; color: #0f766e; letter-spacing: 0; }
  .brief-section p, .brief-section li { margin: 0; font-size: 12.5px; line-height: 1.42; color: #1f2937; overflow-wrap: anywhere; }
  .brief-section ul { margin: 0; padding-left: 20px; }
  .concepts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 9px 14px; }
  .concept { border-top: 1px solid var(--line); padding-top: 7px; }
  .concept h3 { margin: 0 0 4px; font-size: 13px; color: #7c2d12; letter-spacing: 0; }
  .concept p { margin: 2px 0 0; font-size: 11.5px; line-height: 1.35; color: #374151; overflow-wrap: anywhere; }
  .concept b { color: #111827; }
  .link { color: var(--accent); font-weight: 800; text-decoration: none; }
  .empty { padding: 48px; background: var(--paper); border: 1px solid var(--line); border-radius: 12px; color: var(--muted); }
  @media (max-width: 860px) {
    .shell { padding: 14px; }
    .topbar, .top-actions { align-items: stretch; flex-direction: column; }
    .slide, .briefing, .concepts { grid-template-columns: 1fr; }
    .slide { min-height: auto; overflow: visible; display: grid; }
    h1 { font-size: 28px; }
  }
</style>

{"title": "Modification of charge and spin textures by light chemical substitution in Eu(Al1−xGax)4 (x=0.1)", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/6kwv-fh15", "authors": "Zétény Bacsó, Fellipe Carneiro, Kevin Allen, et al.", "last_authors": "Alessandro Bombardi, Roger D. Johnson", "summary": "We present the results of a resonant x-ray-diffraction experiment, resolving both charge and spin textures in the intermetallic topological magnet Eu ( Al 1 − x Ga x ) 4 ( x = 0.1). Below ≈ 75 K the system develops a charge-density wave (CDW) with propagation vector k CDW ≈ ( 0 , 0 , 0.18 ) . The CDW order parameter grows monotonically on cooling until ≈ 15 K, when a sudden decrease in the CDW amplitude occurs. Pairs of magnetic satellites of the (0, 0, 8) Bragg reflection corresponding to two distinct domains, k 1 = ( ± δ m , 0, 0), k 2 = (0, ± δ m , 0), δ m = 0.2002 ( 4 ) were studied at the Eu L 3 edge, appearing below T N = 14.8 K. Our measurement of T N is exactly coincident with the sudden drop in the CDW amplitude, which suggests strong coupling between the charge and spin orders, as observed in other compounds of the Eu ( Al 1 − x Ga x ) 4 series. Azimuthal measurements were consistent with a single helical spin arrangement having an elliptical envelope of μ Y / μ Z = 1.19(6) for the k 2 domain, and a tilted helical (helicoidal) spin arrangement for the k 1 domain, with μ Y / μ Z = 1.14(4) and μ X / μ Z = 0.20(2) that may be hidden for the k 2 domain due to multiple subdomains. Temperature evolution of the magnetic satellite intensities in linear and circularly polarized light found the respective ratio to be invariant with temperature, suggesting a single helicoidal magnetic phase throughout the measured temperature range. This behavior is unlike the x = 0 material, in which a spin-density wave forms first, transitioning to a helical ground state on cooling through intermediate phases. Future theoretical work on the Eu electronic ground state, supported by related experiments, will help understand the effects of Ga substitution on the evolution of the magnetic structure.", "tier": "B_IMPORTANT_CONDMAT", "score": "9", "reason": "Experimental resolution of CDW and spin textures in a topological magnet.", "tags": ["CDW", "topology", "magnetism"], "image": "", "briefing": {"background": "Eu 기반 화합물은 강한 자기 모멘트와 전자 구조적 불안정성(CDW 등)이 공존하여, 자성과 전하 질서 간의 상호작용을 연구하기에 이상적인 플랫폼입니다.", "motivation": "Eu(Al1-xGax)4 시스템에서 Ga 치환을 통해 기존 모체 화합물과 비교하여 CDW와 스핀 질서가 어떻게 변화하는지, 특히 상호 결합 메커니즘을 규명하고자 했습니다.", "result": "CDW의 진폭이 Neel 온도(TN)와 일치하는 지점에서 급격히 변화함을 발견하여, 두 질서 간의 강한 결합을 확인했습니다. 또한, Ga 치환에 따라 나선형(helical/helicoidal) 자기 구조가 안정화됨을 밝혔습니다.", "implication": "화학적 치환(도핑)만으로도 CDW와 자기 구조를 정교하게 제어할 수 있으며, 이는 강상관 전자계에서 두 질서의 공존 메커니즘을 밝히는 데 중요합니다.", "novelty": "공명 X선 회절을 통해 CDW와 복잡한 스핀 구조를 동시에 분해하고, 온도에 따른 질서 변수를 실시간으로 추적한 점이 매우 뛰어납니다.", "unresolved": "왜 Ga 치환이 자기 구조의 위상적 성격을 근본적으로 바꾸는지에 대한 전자 구조적 원리(예: 페르미 면의 변화)는 여전히 연구 과제입니다.", "future_work": "전자 구조 계산(DFT+DMFT)을 통한 Ga 치환 효과 분석 및 관련 자기 위상 물질에 대한 비교 연구가 기대됩니다.", "concepts": [{"term": "공명 X선 회절", "why_emerged": "특정 원소의 자기적/전하적 정보를 선택적으로 얻기 위해 필요합니다.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "중성자 산란과 상호 보완적인 자기 구조 분석 도구"}, {"term": "CDW", "why_emerged": "전자-포논 결합이 강한 시스템에서 페르미 면의 네스팅(nesting)을 통한 기저 상태 안정화를 위해 발생합니다.", "origin": "Peierls (1955)", "connections": "위상학적 금속 및 초전도체와 경합하는 질서"}, {"term": "helicoidal 스핀 구조", "why_emerged": "이방성 에너지와 교환 상호작용의 경쟁 과정에서 스핀이 나선형으로 배열되는 상태가 최적화되었기 때문입니다.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "카이럴 자성과 스핀-궤도 결합에 의해 안정화"}], "english_summary": ["Eu(Al0.9Ga0.1)4 displays coupled charge and spin order textures.", "CDW amplitude abruptly drops at the magnetic transition temperature.", "Resonant X-ray diffraction resolves distinct helical and helicoidal magnetic phases.", "Chemical substitution serves as a powerful tool to tune topological magnetism."]}}, {"title": "Pseudo-Goldstone mode in altermagnetic α-MnTe: High-field electron spin resonance studies", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/wmdr-ctqb", "authors": "K. Yu. Povarov, J. Wosnitza, S. Rößler, M. Schmidt, A. A. Tsirlin, and S. A. Zvyagin", "last_authors": "S. Rößler, M. Schmidt, A. A. Tsirlin, and S. A. Zvyagin", "summary": "The altermagnetic material α -MnTe and its magnetic properties have been attracting a lot of attention recently. Here, the authors investigate the low-energy spin-wave mode in an applied magnetic field utilizing electron spin resonance spectroscopy. In a specific geometry of the experiment, the spin-wave Goldstone mode acquires a gap, controlled by the magnetic field. The universal ν / T behavior of the resonance linewidth suggests thermally assisted magnon-magnon collisions as the key magnetic relaxation mechanism in α -MnTe.", "tier": "B_IMPORTANT_CONDMAT", "score": "9", "reason": "Direct experimental study (ESR) on altermagnetic material properties and low-energy modes.", "tags": ["experiment", "altermagnetism", "magnon"], "image": "", "briefing": {"background": "알터마그네틱(Altermagnetism)은 최근 자성체 연구의 새로운 패러다임으로, 기존의 강자성이나 반강자성과 달리 스핀 분할이 운동량 공간에서 교대로 나타나는 독특한 자기적 위상 상태를 의미합니다.", "motivation": "알터마그네틱 물질인 α-MnTe의 저에너지 자기 들뜸 모드(Magnon)가 외부 자기장에서 어떻게 거동하는지 규명하고자 함.", "result": "ESR 측정을 통해 α-MnTe의 Goldstone 모드가 외부 자기장에 의해 Gap이 열리는 것을 확인하였으며, 선폭의 온도 의존성을 통해 마그논 간 충돌이 주요 완화 메커니즘임을 밝힘.", "implication": "알터마그네틱에서의 자성 스핀 동역학을 실험적으로 검증하여, 향후 스핀트로닉스 응용 가능성을 높임.", "novelty": "이론적으로 제안된 알터마그네틱 특성을 ESR 실험을 통해 직접적인 스핀-파 데이터로 증명했다는 점이 독자의 관심사에 부합함.", "unresolved": "실험 조건에 따른 미세한 기하학적 제약과 다른 온도 범위에서의 마그논 완화 메커니즘의 전면적인 일치 여부.", "future_work": "더 높은 자기장 및 다양한 결정 방향에서의 ESR 측정 및 다른 알터마그네틱 물질로의 연구 확장.", "concepts": [{"term": "알터마그네틱", "why_emerged": "기존 강자성/반강자성으로 설명되지 않는 새로운 스핀 위상 구조를 분류하기 위해.", "origin": "최근 3~4년 내 이론적으로 급격히 정립됨 (예: Jungwirth 그룹).", "connections": "반강자성, 스핀-궤도 결합, 운동량 의존적 자성."}, {"term": "ESR (Electron Spin Resonance)", "why_emerged": "물질 내의 전자 스핀 전 _work": "다른 알려진 알터마그네틱 후보군에 대한 동일한 방법론의 적용 및 전자 구조와의 직접적인 상관관계 연구.", "concepts": [{"term": "탄성열량 효과 (Elastocaloric effect)", "why_emerged": "재료에 응력을 가할 때 발생하는 엔트로피 변화를 정밀하게 측정하여 내부 상전이를 밝히기 위해.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "압전 효과, 열용량 측정, 위상 전이 연구."}, {"term": "다중극자 질서 (Multipolar order)", "why_emerged": "일반적인 쌍극자 모멘트 외의 고차 자기 구조를 기술하기 위해.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "은폐된 질서(hidden order), 전이금속 화합물."}], "english_summary": ["Confirmation of altermagnetism in MnF2 using strain-tuned elastocaloric measurements.", "Provides unambiguous bulk evidence for multipolar magnetic order.", "Combines symmetry-guided strain techniques with sensitive caloric probes.", "Establishes a new methodology for identifying unconventional magnetic phases."]}}, {"title": "Step geometry–guided growth of rhombohedral graphene", "journal": "Science", "source": "Gemini", "link": "https://doi.org/10.1126/science.aed9202", "authors": "Mengze Zhao, Zhibin Zhang, Xin Sui, et al.", "last_authors": "Xiaobo Lu, Kaihui Liu", "summary": "Rhombohedral (ABC)–stacked graphene has emerged as a platform for exploring correlated and topological physics. However, its large-scale, pure-phase synthesis has been hindered by intrinsic thermodynamic metastability and kinetic instability. In this work, we introduce a step geometry–guided epitaxial strategy to deterministically control interlayer slip, enabling the synthesis of pure-phase rhombohedral graphene. Using this approach, we obtained pure (phase purity > 99%) rhombohedral graphene with an area reaching 160 micrometers by 80 micrometers and thickness ranging from ~15 layers to ~120 nanometers. The resulting samples establish the first comprehensive reference dataset of Raman fingerprints and intrinsic band structures from few-layer films to ~200-layer bulk. Electronic transport measurements reveal a layer-antiferromagnetic state and the quantum anomalous Hall effect, enabling scalable exploration of next-generation quantum science and technology applications.", "tier": "B_IMPORTANT_CONDMAT", "score": "9", "reason": "Synthesis and band structure of rhombohedral graphene showing correlations and the quantum anomalous Hall effect.", "tags": ["graphene", "topology", "bandstructure", "anomalousHalleffect"], "image": "", "briefing": {"background": "그래핀의 적층 방식(ABC 대칭성)에 따라 유도되는 강상관 물리와 위상 특성은 양자 정보 소자 및 위상 물리학 연구의 핵심 영역임.", "motivation": "ABC-적층(rhombohedral) 그래핀의 결정성이 낮아 물성 연구가 어려웠던 점을 개선하여 대면적 고품질 시료를 제작하고자 함.", "result": "단계적 기하구조 가이드 성장법을 개발하여 99% 이상의 순도를 가진 대면적 rhombohedral 그래핀 합성에 성공함.", "implication": "고품질 시료를 통해 양자 변칙 홀 효과(QAHE) 및 층-반강자성 상태를 명확히 관찰함으로써 2D 위상 물질 연구의 표준 플랫폼을 제공함.", "novelty": "복잡한 합성이 필요한 적층 구조를 성장 단계에서 기하학적으로 제어했다는 점과, 200층에 달하는 시료에서 위상 물성을 입증한 점이 돋보임.", "unresolved": "매우 두꺼운 시료에서 발생하는 다층간의 간섭이 어떻게 위상 상태를 변조하는지에 대한 상세 모델.", "future_work": "합성된 물질을 이용한 양자 소자 제작 및 층 두께에 따른 위상 물성의 변화 제어 연구.", "concepts": [{"term": "ABC-적층 그래핀 (Rhombohedral graphene)", "why_emerged": "Bernal(AB) 적층과 다른 고유의 밴드 구조와 위상적 특성을 연구하기 위해.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "모아레 격자, 층간 위상 전이."}, {"term": "양자 변칙 홀 효과 (QAHE)", "why_emerged": "외부 자기장 없이도 자성 위상 특성에 의해 양자화된 홀 전도도를 구현하기 위해.", "origin": "Haldane 모델(1988)의 이론적 제안 이후 실험적으로는 Cr-도핑된 TI에서 관찰됨.", "connections": "위상 절연체, Berry 곡률."}], "english_summary": ["Developed a step-guided epitaxial strategy for high-purity rhombohedral graphene growth.", "Achieved large-scale synthesis of pure-phase ABC-stacked graphene samples.", "Demonstrated layer-antiferromagnetic states and quantum anomalous Hall effect.", "Provides a scalable platform for exploring correlated and topological physics in graphene."]}}, {"title": "Emergence of Topological Electron Crystals in Bilayer Graphene--Mott Insulator Heterostructures", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2512.23084", "authors": "Wangqian Miao, Tianyu Qiao, Xue-Yang Song, et al.", "last_authors": "Lei Wang, Xi Dai", "summary": "The interplay between strong electron correlation and band topology offers a playground for discovering exotic quantum phases. Here, we predict the emergence of topological electron crystals in a charge-transfer bilayer graphene-Mott insulator heterostructure. In this system, interlayer charge transfer induces a charge-neutral electron-hole bilayer with strong mass asymmetry. While the extreme dilute limit favors a classical triangular dipolar Wigner crystal, we show that increasing the carrier density triggers a critical competition between the Coulomb interaction and the underlying topological band structure of bilayer graphene. This interplay destabilizes the triangular dipolar Wigner crystal and instead stabilizes intrinsic quantum electron crystals with spontaneously formed honeycomb and kagome geometries. Crucially, these new phases can host distinct topological responses including the quantum anomalous and quantum spin Hall effects, which inherit the nonlocal quantum geometry of the bilayer graphene wave functions. Our results establish this artificial heterostructure as a highly tunable platform for mimicking two-dimensional topological solids in a single device.", "tier": "B_IMPORTANT_CONDMAT", "score": "9", "reason": "Directly links graphene heterostructures to emergent kagome geometries and topological responses.", "tags": ["theory", "graphene", "kagome"], "image": "https://arxiv.org/html/2512.23084v5/x1.png", "briefing": {"background": "강한 전자 상관관계와 밴드 토폴로지의 상호작용은 양자 물질 연구의 핵심 주제입니다. 특히 2D 계에서 전자 결정(Wigner crystal) 형성은 상관관계가 지배하는 상을 이해하는 기본 모델입니다.", "motivation": "이 연구는 이중층 그래핀과 Mott 절연체 이질구조에서 층간 전하 이동을 유도하여, 단순한 삼각형 격자가 아닌 허니컴 및 카고메 형상을 가진 '위상 전자 결정'을 인위적으로 구현하고자 합니다.", "result": "쿨롱 상호작용과 그래핀의 위상 밴드 구조 간의 경쟁을 통해, 자발적으로 형성된 허니컴 및 카고메 위상 전자 결정을 제안했습니다. 이 구조들은 양자 변칙 홀 효과 및 양자 스핀 홀 효과를 나타낼 수 있음을 보였습니다.", "implication": "단일 소자 플랫폼에서 위상적 고체 상태를 인위적으로 설계 및 조절할 수 있는 가능성을 열어주며, 카고메 격자 기반의 위상 물성을 연구하는 새로운 접근법을 제시합니다.", "novelty": "외부 조절을 통해 카고메 격자 등을 모사하는 '양자 위상 결정'이라는 개념을 도입하여, 기존 자연 물질의 합성에 의존하던 위상 물질 연구에 새로운 디자인 패러다임을 제시했습니다.", "unresolved": "실제 실험적으로 이와 같은 위상 전자 결정 상을 안정화하고 관측하기 위한 온도 및 도핑 범위의 정밀한 최적화가 필요합니다.", "future_work": "실제 이질구조 소자 제작 및 STM/STS를 통한 국소 상태 밀도(LDOS) 측정으로 결정 구조 및 에지 상태 확인이 필요합니다.", "concepts": [{"term": "Topological Electron Crystals", "why_emerged": "상관관계가 강한 시스템에서 전자가 위상적 특성을 가진 격자 형태로 배열되는 상을 설명하기 위해 도입됨.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "Wigner crystal, Fractional Chern insulators"}, {"term": "Kagome Geometry", "why_emerged": "밴드 평탄화 및 위상적 특성(Berry curvature)을 유도하는 최적의 격자 구조로 주목받음.", "origin": "수학적으로는 오래된 개념이나, 고체물리에서는 1990년대 이후 강한 상관관계 연구의 핵심으로 부상.", "connections": "AV3Sb5, Flat-band superconductivity, Frustrated magnetism"}], "english_summary": ["Proposes an artificial heterostructure of bilayer graphene and Mott insulator to host emergent electron crystals.", "The competition between Coulomb interactions and topological bands stabilizes honeycomb and kagome geometries.", "These electron crystals exhibit topological responses like the quantum anomalous Hall effect.", "Offers a highly tunable platform for mimicking 2D topological solids in a single device."]}}, {"title": "Long and short time linear response of metals: a geometric approach", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2608.02298", "authors": "Nishchhal Verma, Raquel Queiroz", "last_authors": "Nishchhal Verma, Raquel Queiroz", "summary": "The time-dependent quantum geometric tensor, which captures dipole fluctuations of bound electrons, is essential for understanding the electronic properties of insulators, superconductors, and flat bands. It is often considered subleading for low-energy descriptions of metals that are dominated by intra-band processes. Here, we revisit this perspective and highlight scenarios where the quantum geometry of the wavefunctions close to the Fermi surface plays a significant role. We compute the time-dependent quantum geometric tensor for metals, explain its divergence, and contrast it against singular geometric tensors of Dirac and Weyl semi-metals. We identify the ratio of Drude to total spectral weight, $D/\\mathcal{S}_1$, as a lattice-scale probe of bound versus itinerant charge, and quantify it in the kagome metal, where the two van Hove fillings respond differently despite identical Fermi surfaces.", "tier": "B_IMPORTANT_CONDMAT", "score": "9", "reason": "Direct relevance to kagome metals, Berry curvature/geometric tensor analysis.", "tags": ["kagome", "geometric_tensor", "electronic_structure"], "image": "https://arxiv.org/html/2608.02298v1/x1.png", "briefing": {"background": "금속의 전자 구조 연구에서 양자 기하학적 텐서(Quantum Geometric Tensor)는 주로 절연체의 특성으로 치부되었으나, 최근 위상 금속 연구가 활발해지면서 그 중요성이 다시 조명받고 있습니다.", "motivation": "금속의 선형 응답 함수에서 양자 기하학적 효과가 무시할 수 없는 역할을 하는지, 특히 카고메 금속과 같이 특이한 밴드 구조를 가진 물질에서의 역할을 규명하고자 합니다.", "result": "카고메 금속에서 van Hove 충전 지점 근처의 양자 기하학적 텐서가 페르미 표면이 같더라도 다르게 반응함을 보였으며, Drude 무게와 총 스펙트럼 무게의 비(D/S1)를 이용해 속박 전하와 유동 전하를 구분하는 척도를 제시했습니다.", "implication": "위상적 밴드 구조를 가진 금속 물질의 동역학적 특성을 해석할 때, 단순한 페르미 표면 물리 외에 파동함수의 기하학적 정보가 필수적임을 강조합니다.", "novelty": "카고메 금속에서 기하학적 텐서의 발산과 응답을 분석하여, 실험적으로 관측 가능한 양(D/S1)과 연결 지었다는 점이 독자 연구 분야(카고메 메탈)와 매우 밀접합니다.", "unresolved": "실제 실험적 RIXS나 광학 전도도 측정 데이터와 이 이론적 텐서 지표를 어떻게 정량적으로 매핑할지에 대한 방법론적 구체화가 필요합니다.", "future_work": "카고메 금속의 서로 다른 van Hove 도핑 단계에서의 광학 전도도 정밀 측정을 통한 이론 검증.", "concepts": [{"term": "Quantum Geometric Tensor", "why_emerged": "파동함수의 중첩 구조와 기하학적 특성(Berry 곡률 등)을 단일량으로 포괄하기 위해 도입됨.", "origin": "Berry (1984) 및 이후의 기하학적 위상 이론에서 발전.", "connections": "Berry curvature, Quantum Metric, Anomalous Hall effect"}, {"term": "Drude weight", "why_emerged": "금속의 완벽한 전도성을 나타내는 에너지 스케일로, 페르미 액체 이론에서 중요하게 다뤄짐.", "origin": "Drude (1900)에 기원.", "connections": "Optical conductivity, Sum rules, Itinerant vs localized electrons"}], "english_summary": ["Re-evaluates the role of the quantum geometric tensor in metallic systems.", "Highlights that geometric effects are significant in metals near van Hove singularities.", "Introduces the ratio of Drude weight to total spectral weight as a probe for bound versus itinerant electrons.", "Demonstrates the utility of this approach in analyzing kagome metals."]}}, {"title": "Magnetic circular dichroism of THz modes and selection rules of Raman-active optical phonons in the polar altermagnet candidate Mn2Mo3O8", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2608.01062", "authors": "F. Schilberth, K. Vasin, M. Knauft, et al.", "last_authors": "I. K\\'ezsm\\'arki, J. Deisenhofer", "summary": "We investigated the magnetic and vibrational excitations in the collinear altermagnet candidate \\ce{Mn2Mo3O8} by temperature dependent Raman scattering and magneto-optical THz time-domain transmission spectroscopy. By comparison to \\textit{ab initio} calculations accurately capturing the eigenfrequencies of the vibrational eigenmodes, we identify all optical phonons, including the lowest-lying Raman modes of $A_1$ and $E_2$ type, which had remained elusive in a previous Raman study. Moreover, we compare the selection rules for optically active phonons in the paramagnetic and the magnetically ordered phases of \\ce{Mn2Mo3O8} and analyze the Raman selection rules with respect to pseudo-angular momentum conservation. No evidence of the expected splitting of the degenerate paramagnetic $E_2$ optical phonons into modes with circular polarization upon magnetic ordering could be resolved, likely due to weak spin-orbit coupling typical for Mn$^{2+}$. In contrast, we observe strong magnetic circular dichroism at a broad THz excitation band, emerging in the magnetically ordered state. This band, potentially originating from two-magnon excitations, is only electric-dipole active and features a field-dependent two-component fine structure. Its magnetic circular dichroism vanishes above the spin-flop transition at 4~T.", "tier": "B_IMPORTANT_CONDMAT", "score": "9", "reason": "Direct experimental study on altermagnets with spectroscopy; very relevant to user's experimental focus.", "tags": ["altermagnet", "spectroscopy", "magnon", "phonon"], "image": "https://arxiv.org/static/browse/0.3.4/images/arxiv-logo-fb.png", "briefing": {"background": "Altermagnetism(알터마그네틱)은 최근 강자성이나 반강자성과는 다른, 결정 대칭성에 의한 새로운 자기 정렬 상태로 주목받고 있으며, 그에 걸맞은 실험적 증거 확보가 시급한 분야입니다.", "motivation": "Mn2Mo3O8 물질에서 라만 산란과 THz 분광법을 이용해 알터마그네틱 특성과 관련된 진동 모드 및 선택 규칙을 실험적으로 규명하고자 합니다.", "result": "라만 산란을 통해 이전 연구에서 관측되지 않았던 낮은 에너지의 포논 모드들을 식별했습니다. 또한, 자기 정렬 상태에서 자기 원형 이색성(MCD)을 강하게 관측했으나, 포논 분할은 관측하지 못했는데 이는 Mn2+의 약한 스핀-궤도 결합 때문일 가능성을 제시했습니다.", "implication": "알터마그네틱 후보 물질에서의 자기적 성질과 격자 진동 간의 상호작용을 실험적으로 분리하여 이해할 수 있는 중요한 데이터를 제공합니다.", "novelty": "전형적인 알터마그네틱 후보군에 대한 분광학적 시도로, 물질의 대칭성과 자기적 기원(전기 쌍극자 활성 THz 대역)을 세밀하게 분리했다는 점이 유용합니다.", "unresolved": "관측된 THz 대역의 MCD가 명확히 2-마그논 기원인지, 혹은 다른 전자적 기원인지에 대한 추가적인 이론적 뒷받침이 필요합니다.", "future_work": "스핀-궤도 결합이 더 큰 다른 알터마그네틱 후보군에서의 유사한 실험을 통해 포논 분할을 직접 관측 시도.", "concepts": [{"term": "Altermagnetism", "why_emerged": "스핀 편극된 밴드를 가지면서도 자화가 없는 상태를 기술하기 위해 제안됨.", "origin": "Šmejkal, Jungwirth 등 최근 제안 (2020s).", "connections": "Non-relativistic spin-polarized band structure, Spintronics"}, {"term": "Magnetic Circular Dichroism (MCD)", "why_emerged": "자기 정렬 물질에서 좌우 원형 편광의 흡수 차이를 통해 자기 모멘트의 방향과 크기를 분석하기 위해 도입됨.", "origin": "Faraday 및 Zeeman 효과 연구의 연장선.", "connections": "Magneto-optics, Berry curvature, Spin-orbit coupling"}], "english_summary": ["Investigates Mn2Mo3O8, a candidate for altermagnetism, using Raman and THz spectroscopy.", "Identifies new optical phonon modes and analyzes selection rules.", "Observes strong magnetic circular dichroism in a THz excitation band linked to magnetic order.", "Suggests weak spin-orbit coupling as the reason for the absence of expected phonon splitting."]}}, {"title": "Magnetic order and excitations in the magnetically intercalated van der Waals material Cr_14NbSe2", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2604.07117", "authors": "Ryota Yamaoka, Hiraku Saito, Yuki Settai, et al.", "last_authors": "Shinichiro Seki, Taro Nakajima", "summary": "Cr$_{\\frac{1}{4}}$NbSe$_2$ is a triangular lattice magnet in which magnetic Cr$^{3+}$ ions are intercalated to form triangular lattices between NbSe$_2$ van der Waals layers stacked along the c axis. By unpolarized and polarized neutron scattering experiments, we have revealed that the magnetic ground state of this system is a 120$^{\\circ}$-type antiferromagnetic order characterized by the magnetic propagation wave vector of $q=(\\frac{1}{3}, \\frac{1}{3}, 0)$. We also performed inelastic neutron scattering measurements using co-aligned single crystals, and determined dispersion relations of magnetic excitations at low temperatures. Comparing the observed spectra with calculations based on the linear spin-wave theory, we revealed that the out-of-plane ferromagnetic interaction is fairly strong as compared to the in-plane nearest neighbor antiferromagnetic interaction. Although the crystal structure of this system is composed of two-dimensional van der Waals layers, the magnetic order has a three dimensional character, which would be attributed to long-range magnetic interactions mediated by conduction electrons.", "tier": "B_IMPORTANT_CONDMAT", "score": "9", "reason": "Experimental neutron scattering on a transition metal dichalcogenide derivative, highly relevant to user materials.", "tags": ["experiment", "neutronscattering", "NbSe2"], "image": "https://arxiv.org/html/2604.07117v2/x1.png", "briefing": {"background": "전이금속 디칼코게나이드(TMD) 화합물은 층상 구조로 인해 흥미로운 물성을 보이며, 여기에 자기 이온을 삽입(intercalation)하면 2차원적인 층 구조와 자기적 정렬이 결합된 새로운 물리 현상이 나타납니다.", "motivation": "Cr 삽입 NbSe2(Cr1/4NbSe2) 시스템에서 자기적 정렬 상태와 그 기저에 있는 스핀 상호작용의 근본적인 메커니즘을 명확히 규명하고자 합니다.", "result": "중성자 산란 실험을 통해 이 물질이 120도 반강자성(AFM) 정렬을 가짐을 확인하였고, 층간 강자성 상호작용이 층내 반강자성 상호작용보다 강하게 작용하여 3차원적 자기적 특성을 띠는 원인임을 밝혀냈습니다.", "implication": "전도 전자(conduction electrons)가 매개하는 장거리 상호작용이 2차원 반데르발 these bosonic modes in real space and within the monolayer limit remains elusive. Here, we report the atomic-scale observation of electromagnons in monolayer NiI$_2$ using low-temperature scanning tunneling microscopy. By tracking the thermal evolution of the multiferroic phase, we establish the energy scale and resolve coherent in-gap excitations of the symmetry-broken multiferroic state. Comparison with first-principles and spin-model calculations reveals that the low-energy modes originate from electromagnon excitations. Spatially resolved inelastic tunneling spectroscopy maps show a stripe-like modulation of the local spectral function at electromagnon energies, matching theoretical predictions. These results provide direct evidence of the internal structure of electromagnons and establish a methodology to probe these modes at the atomic scale, opening avenues for electrically tunable spintronics.", "tier": "B_IMPORTANT_CONDMAT", "score": "9", "reason": "Direct STM/STS observation of bosonic excitations in monolayer NiI2; perfect match for spectroscopic interests.", "tags": ["method", "material", "STM", "vdW"], "image": "https://arxiv.org/html/2510.08253v2/Fig1.png", "briefing": {"background": "반데르발스 다강체(Multiferroics)는 자성과 강유전성이 공존하여 자기장과 전기장 사이의 강한 결합을 구현할 수 있는 차세대 스핀트로닉스 재료로 주목받고 있습니다.", "motivation": "단층 NiI2에서 예측되는 일렉트로마그논(electromagnons)을 원자 수준에서 직접 시각화하고 그 에너지를 결정하고자 합니다.", "result": "저온 주사 터널링 현미경(STM) 및 비탄성 터널링 분광법(IETS)을 사용하여 단층 NiI2 내부의 일렉트로마그논 상태를 공간적으로 매핑하는 데 성공했습니다.", "implication": "일렉트로마그논의 원자적 구조를 직접 관측함으로써 향후 전기적으로 제어 가능한 초고속, 저전력 스핀트로닉 소자 설계의 근거를 마련했습니다.", "novelty": "이론적으로만 다루어지던 단층 물질 내 일렉트로마그논의 공간적 분포를 원자 스케일에서 직접 관측했다는 점이 핵심적입니다.", "unresolved": "일렉트로마그논과 초전도성 혹은 다른 상호작용과의 결합 강도에 대한 정량적 조절 방법은 추가 연구가 필요합니다.", "future_work": "외부 전기장을 이용한 일렉트로마그논의 실시간 스위칭 및 변조 실험이 이어질 것으로 보입니다.", "concepts": [{"term": "일렉트로마그논", "why_emerged": "다강체에서 자기적 들뜸(마그논)이 전기장에 의해 유도되거나 전기적 성질과 결합되어 나타나는 들뜸 상태입니다.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "다강성, 마그논, 전기-자기 결합(magnetoelectric coupling)"}, {"term": "비탄성 터널링 분광법(IETS)", "why_emerged": "물질 내부의 낮은 에너지 진동이나 들뜸 상태를 터널링 전자의 에너지 손실을 통해 탐지하기 위해 필요합니다.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "STM, 분광학, 에너지 손실 분광법"}], "english_summary": ["Direct atomic-scale observation of electromagnons in monolayer NiI2 using low-temperature STM.", "Mapping local spectral functions reveals stripe-like modulation matching theoretical electromagnon models.", "This provides a new methodology for probing collective excitations in vdW multiferroics for spintronic applications."]}}, {"title": "Pressure-induced self-doping and Fermi surface reconstruction in UAs2", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2608.01244", "authors": "Zhenchao Wu, Yingying Cao, Yi-feng Yang", "last_authors": "Yingying Cao, Yi-feng Yang", "summary": "Superconductivity has recently been reported in the heavy-fermion compound UAs 2 \\mathrm{UAs_{2}} under pressure, with the highest T c T_{c} among uranium-based correlated 5 ​ f 5f -electron superconductors. To elucidate its microscopic origin, we investigate its electronic structure using density functional theory combined with dynamical mean-field theory (DFT+DMFT). At ambient pressure, our calculations reproduce the characteristic Kondo-lattice electronic structure, with flat hybridization bands near the Fermi energy around the Γ \\Gamma and M points, in good agreement with angle-resolved photoemission spectroscopy (ARPES). Under pressure, we find a systematic transfer of electrons from the more localized 5 ​ f 5 / 2 5f_{5/2} orbitals to the more itinerant 5 ​ f 7 / 2 5f_{7/2} orbitals, while the total U- 5 ​ f 5f occupancy remains nearly unchanged. This orbital-selective charge redistribution constitutes a pressure-induced self-doping effect that drives the 5 ​ f 5 / 2 5f_{5/2} electrons from a localized Kondo regime toward a mixed-valence regime with enhanced charge fluctuations, leading to a dramatic reconstructi ssure-induced self-doping in UAs2 leads to electronic structure reconstruction.", "DFT+DMFT calculations correlate superconducting emergence with enhanced Fermi surface nesting.", "The study highlights the role of orbital-selective charge fluctuations in high-Tc uranium-based superconductors."]}}, {"title": "Real-time dynamics of the two-step charge-density-wave transition in bulk 1T-TaS2", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2608.02456", "authors": "Daeheon Kim, Jinseok Oh, Kahyeon Koh, et al.", "last_authors": "Noejung Park, Dongbin Shin", "summary": "The charge-density wave (CDW) of bulk 1T-TaS2 is built from Star-of-David (SoD) clusters tiling a sqrt{13} x sqrt{13} superlattice, and it melts through a two-step sequence accompanied by order-of-magnitude changes in resistivity. Whether these steps proceed by collapse of the SoD amplitude or by rearrangement of the SoD lattice has remained unresolved, because the relevant dynamics occur on length and time scales beyond the reach of ab initio molecular dynamics. Here we follow the CDW transitions in real time using a machine-learning force field trained on first-principles data, giving access to 1404-atom supercells over 5 ns. The two steps are mechanistically distinct. Above 200 K, SoD clusters translate coherently by transiently dissolving and re-forming about shifted centers, a deformation-formation process that preserves the local SoD amplitude while randomizing the interlayer stacking order and nucleating domain walls. Only near 350 K does the SoD distortion itself collapse. These results provide microscopic support for the recently proposed two-step model of the CDW transition and offer a framework for interpreting light-induced hidden phases and cavity-modified transition temperatures in 1T-TaS2.", "tier": "B_IMPORTANT_CONDMAT", "score": "9", "reason": "Direct relevance: real-time dynamics of CDW transition in 1T-TaS2, a key CDW material.; demoted from A: broad CM, n vature, Quantum Anomalous Hall Effect."}], "english_summary": ["Analyzed intrinsic and extrinsic contributions to AHE in Co2MnGa.", "Demonstrated that dual components dictate the anomalous Hall conductivity.", "Identified the role of temperature-dependent spin structures in transport.", "Provides insights into tuning topological transport in magnetic Weyl systems."]}}, {"title": "Intrinsic magnetotransport and orientation-dependent topological Hall effect in EuAuBi", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/gsjl-qnv7", "authors": "Lipika, Sneh, Shobha Singh, Ralf Koban, Walter Schnelle, Kaustuv Manna", "last_authors": "Walter Schnelle, Kaustuv Manna", "summary": "We report the growth of high-quality single crystals of the magnetic topological semimetal EuAuBi using a Pb-flux method, which effectively suppresses the formation of secondary ${\\mathrm{Au}}_{2}\\mathrm{Bi}$ impurity phases that were prevalent in the previously reported Bi-flux grown crystals. This…", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Strong experimental study of a magnetic topological semimetal with relevant transport properties.", "tags": ["material", "topological", "transport"], "image": "", "briefing": {"background": "자기 위상 반금속(Magnetic topological semimetal)은 위상적 밴드 구조와 자기 질서가 공존하여, 비자명한 Berry 곡률과 이로 인한 변칙적 홀 효과(AHE) 등을 연구하는 최첨단 분야입니다.", "motivation": "기존 Bi-flux를 이용한 EuAuBi 결정 성장 방식에서는 Au2Bi 불순물 상이 형성되어 물성 측정의 정확도를 저해하는 문제가 있었습니다.", "result": "Pb-flux 기법을 도입하여 고품질 단결정을 합성하는 데 성공하였으며, 이를 통해 진성 자기 수송 특성과 방향에 의존적인 위상적 홀 효과를 관찰했습니다.", "implication": "불순물이 제거된 순수한 시료를 통해 자기 위상 물질의 복잡한 수송 현상을 명확하게 해석할 수 있는 토대를 마련했습니다.", "novelty": "자기 수송과 방향성 의존적 위상 홀 효과를 체계적으로 분석하여, 자기 위상 물질 내 전자 거동 연구에 중요한 데이터를 제공합니다.", "unresolved": "자기 구조의 미세한 스핀 정렬 방식이 위상적 수송 특성에 정확히 어떻게 기여하는지에 대한 완벽한 미시적 메커니즘은 여전히 추가 연구가 필요합니다.", "future_work": "ARPES를 통한 밴드 구조의 직접적인 관측과 중성자 산란을 통한 자기 구조 분석이 결합되어야 할 것입니다.", "concepts": [{"term": "위상적 홀 효과", "why_emerged": "비자명한 스핀 조직(예: 스카이미온)이 전자의 위상에 영향을 주어 발생하는 비전통적 홀 전압을 설명하기 위해 도입됨.", "origin": "Berry 곡률에 대한 연구가 진전되면서 정립됨.", "connections": "Berry 곡률, 스핀 텍스처, 위상 위상학."}, {"term": "자기 위상 반금속", "why_emerged": "자기 질서가 위상적 밴드 구조와 상호작용할 때 발생하는 창발적 물성을 탐구하기 위함.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "Weyl 반금속, 자기 모멘트, 비상반적 수송."}], "english_summary": ["Successfully synthesized high-quality single crystals of EuAuBi using a Pb-flux method.", "The method eliminates secondary Au2Bi impurity phases that hindered previous transport studies.", "Identified intrinsic magnetotransport and orientation-dependent topological Hall effect.", "Provides a clearer platform for investigating magnetism and band topology in magnetic semimetals."]}}, {"title": "Lifshitz transitions and isospin polarization in twist-decoupled monolayer-bilayer graphene", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/7d2j-4p3c", "authors": "Alex Boschi, Leonardo Sabattini, Sergey Slizovskiy, et al.", "last_authors": "Camilla Coletti, Sergio Pezzini", "summary": "Flat band dispersion in two-dimensional materials is often associated with correlated electronic phases. Here, the authors show that a flat region in the valence band of bilayer graphene can be accessed by gapping it via proximity to a twisted monolayer graphene. Their experiments reveal a series of transitions driven by doping, electric and magnetic field (consistent with a single-particle description), as well as partially isospin‑polarized phases promoted by electronic correlations and preserved in presence of the twisted monolayer.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Experimental study on correlated phases and band structure in graphene.", "tags": ["graphene", "correlated", "Lifshitztransition"], "image": "", "briefing": {"background": "2D 소재, 특히 그래핀 적층 구조에서 평탄 밴드(flat band) 형성은 강력한 전자 상관관계가 발현되는 핵심적인 통로입니다.", "motivation": "트위스트된 층을 이용해 밴드 구조를 제어하고, 이로 인해 발생하는 상관관계 기반의 물리 현상(이소핀 분극 등)을 규명하고자 했습니다.", "result": "단층-이층 그래핀 간의 트위스트 결합을 통해 가전자대 평탄 밴드를 구현했으며, 외부 변수에 따른 리프시츠 전이 및 전자 상관관계에 의한 이소핀 분극 상을 확인했습니다.", "implication": "밴드 구조를 엔지니어링하여 전자의 상관 효과를 능동적으로 제어할 수 있는 가능성을 입증했습니다.", "novelty": "단순 이론 예측을 넘어 실제 실험에서 도핑 및 필드 조절을 통해 상관관계 상을 제어했다는 점이 중요합니다.", "unresolved": "이러한 이소핀 분극 상태가 트위스트 각도나 층간 결합의 미세한 불균일성에 얼마나 민감한지에 대한 정량적 이해가 부족합니다.", "future_work": "STM/STS를 활용하여 국소적인 상태 밀도(LDOS) 변화와 이소핀 분극의 공간적 분포를 측정할 필요가 있습니다.", "concepts": [{"term": "리프시츠 전이", "why_emerged": "페르미 면의 위상학적 변화가 물성 변화와 어떻게 연결되는지 설명하기 위해 도입.", "origin": "I. M. Lifshitz가 1960년에 제안.", "connections": "페르미 면, 밴드 구조 공학."}, {"term": "이소핀 분극", "why_emerged": "그래핀의 자유도(스핀, 밸리)가 상관관계로 인해 특정 상태로 정렬되는 현상을 기술하기 위해 필요.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "강한 상관관계, 다체 물리."}], "english_summary": ["Investigated flat band dispersion in twist-decoupled monolayer-bilayer graphene systems.", "Demonstrated electronic phase transitions driven by doping and external fields.", "Observed isospin-polarized phases originating from electronic correlations.", "Highlights the capability to engineer correlated states via band-structure control."]}}, {"title": "Multiorbital character of the density wave in trilayer nickelate superconductors", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/znvc-8425", "authors": "Abhi Suthar, Vignesh Sundaramurthy, Matías Bejas, et al.", "last_authors": "Andrés Greco, Matthias Hepting", "summary": "Ruddlesden–Popper nickelates exhibit high-temperature superconductivity closely intertwined with charge and spin density waves. However, fundamental questions persist regarding the interplay between the associated density wave (DW) fluctuations and superconductivity, as well as the orbital character and symmetry underlying the DW instabilities. Here, we utilize polarized Raman scattering to investigate the phononic and electronic Raman responses of the trilayer nickelate La 4 Ni 3 O 10 across its concomitant charge and spin density wave transitions. In addition to distinct phonon anomalies occurring below the transition temperature, we observe a depletion of continuum spectral weight up to 114 meV and a pronounced peak centered at this energy. By combining momentum-selective information from polarized electronic Raman scattering with Raman-response model calculations based on a multiorbital Raman vertex in a reconstructed two-orbital DW state involving both Ni − 3 d x 2 − y 2 and Ni − 3 d z 2 orbitals, we identify 114 meV as the energy scale 2 Δ DW of the DW gap, characterized by incoherent opening and non-mean-field behavior. Furthermore, the model calculations reveal that the corresponding 2 Δ DW peak has a multiorbital origin, requiring both orbital contributions and their mixing beyond single-orbital projections, thus shedding light on the nature of the DW instabilities in La 4 Ni 3 O 10 .", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Directly relevant to nickelate superconductors and CDW physics.", "tags": ["nickelate", "superconduct", "CDW"], "image": "", "briefing": {"background": "니켈산염은 고온 초전도체와 전하 밀도 파동(CDW) 사이의 복잡한 상호작용을 연구하는 뜨거운 주제이며, 이들의 오비탈 특성을 이해하는 것이 핵심입니다.", "motivation": "La4Ni3O10에서 나타나는 CDW/SDW가 어떠한 오비탈(dx2-y2 및 dz2)의 기여로 발생하는지 명확히 규명하고자 했습니다.", "result": "편광 라만 분광법을 사용하여 114 meV 에너지 규모의 DW 갭을 확인하였으며, 이 과정에 다중 오비탈 혼합이 필수적임을 이론 모델과 함께 입증했습니다.", "implication": "니켈산염의 초전도성과 전하 질서 사이의 미시적 연결 고리를 해석하는 데 다중 오비탈 물리(multiorbital physics)가 핵심임을 시사합니다.", "novelty": "단순 단일 오비탈 접근에서 벗어나, Ni의 d-오비탈 간의 혼합이 전하 밀도 파동의 본질임을 라만 데이터를 통해 설득력 있게 제시했습니다.", "unresolved": "이러한 갭이 초전도 상태와 어떻게 경쟁하거나 상호 공존하는지에 대한 상세한 위상 도표의 세부 사항은 아직 명확하지 않습니다.", "future_work": "ARPES를 통해 실제 전자 구조에서 관측된 갭이 어떻게 오비탈 선택성을 가지는지 검증하는 연구가 필요합니다.", "concepts": [{"term": "전하 밀도 파동(CDW)", "why_emerged": "전자 밀도가 주기적으로 변조되는 바닥 상태의 불안정성을 설명하기 위해 제안됨.", "origin": "Peierls가 1차원 금속에 대해 제안.", "connections": "페르미 면 중첩(nesting), 전자-포논 결합."}, {"term": "다중 오비탈 물리", "why_emerged": "단일 밴드 모델로 설명되지 않는 강상관 전자계의 물성을 설명하기 위해 도입됨.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "DFT+DMFT, 훈트 금속, Hubbard 모델."}], "english_summary": ["Investigated the density wave in trilayer nickelate La4Ni3O10 using polarized Raman scattering.", "Identified the DW gap scale at 114 meV.", "Demonstrated that the density wave has a multiorbital origin involving Ni-3dx2-y2 and Ni-3dz2 orbitals.", "Provides crucial insights into the interplay between charge/spin density waves and superconductivity in nickelates."]}}, {"title": "Quasiparticle GW for superconductors: Toward a unified treatment of electron-phonon and electron-plasmon couplings", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/f8qb-2l59", "authors": "Catalin D. Spataru, Christopher Renskers, Elena R. Margine", "last_authors": "Christopher Renskers, Elena R. Margine", "summary": "Here, the authors extend quasiparticle GW theory to the superconducting state, combining Eliashberg electron-phonon pairing with dynamical Coulomb screening from plasmons. The resulting superconducting quasiparticle GW (s-qpGW) framework avoids the spurious plasmon-driven superconductivity of fully self-consistent GW, reproduces standard Eliashberg results for bulk Nb, and correctly predicts the absence of superconductivity in doped monolayer graphene, while revealing how acoustic plasmons can reduce Coulomb pair breaking in two-dimensional systems.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Methodological advancement in electronic structure calculations for superconductors.", "tags": ["DFT", "superconductivity", "method"], "image": "", "briefing": {"background": "전통적인 초전도 이론인 Eliashberg 이론은 전자-포논 상호작용에 집중하는 반면, GW 근사는 전자 간의 동역학적 스크리닝을 다루는 핵심 기법입니다. 이 둘을 통합하는 것은 강상관 물질과 저차원 시스템의 초전도성을 이해하기 위한 계산 물리 분야의 오랜 과제입니다.", "motivation": "완전 자가충족(fully self-consistent) GW 방식이 가지는 비물리적인 플라즈몬 초전도성 문제를 해결하고, 전자-포논 결합과 플라즈몬에 의한 쿨롱 스크리닝을 하나의 틀에서 통일적으로 기술하고자 함입니다.", "result": "s-qpGW(superconducting quasiparticle GW) 프레임워크를 구축하여 Nb 벌크의 표준 Eliashberg 결과를 재현했으며, 도핑된 그래핀 단층에서 초전도성이 나타나지 않음을 올바르게 예측했습니다.", "implication": "2차원 시스템에서 음향 플라즈몬이 쿨롱 쌍 파괴(Coulomb pair breaking)를 완화하는 메커니즘을 밝혀냄으로써, 차세대 저차원 초전도체 설계에 중요한 가이드라인을 제공합니다.", "novelty": "전자-포논 결합과 동역학적 쿨롱 차폐를 통합함으로써 그동안 구분되어 다뤄졌던 두 물리량을 결합했다는 점에서 이론적으로 매우 정교한 진보입니다.", "unresolved": "계산 비용이 상당할 것으로 예상되며, 고온 초전도체와 같은 강한 상관관계가 지배적인 시스템에 적용할 경우의 한계는 아직 검증이 필요합니다.", "future_work": "더 다양한 2차원 물질 및 강상관 초전도체 시스템에 대한 s-qpGW 계산을 수행하여 본 프레임워크의 예측력을 추가 검증할 것으로 보입니다.", "concepts": [{"term": "GW approximation", "why_emerged": "전자 간의 동역학적 상호작용과 스크리닝 효과를 포함한 준입자 에너지를 계산하기 위해 도입됨.", "origin": "Lars Hedin (1965).", "connections": "DFT 계산의 한계 극복, RPA 근사, 다체 섭동 이론."}, {"term": "Eliashberg theory", "why_emerged": "강한 결합을 포함한 전자-포논 상호작용을 통해 초전도 현상을 설명하기 위해.", "origin": "G. M. Eliashberg (1960).", "connections": "BCS 이론의 확장, 강결합 초전도체 해석."}, {"term": "Plasmon", "why_emerged": "금속 내 전자 가스의 집단적 진동을 양자화하여 기술하기 위해.", "origin": "David Pines, David Bohm (1952).", "connections": "전하 밀도 파동, 전자 에너지 손실 분광법(EELS)."}], "english_summary": ["Introduces the superconducting quasiparticle GW (s-qpGW) framework.", "Integrates Eliashberg electron-phonon pairing with dynamical Coulomb screening.", "Eliminates spurious plasmon-driven superconductivity found in previous GW methods.", "Correctly predicts superconducting properties in bulk Nb and 2D materials."]}}, {"title": "Scaling analysis of intrinsic anomalous Hall effect in the intercalated transition metal dichalcogenide Cr0.27NbS2", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/1ttr-3kkf", "authors": "Huan Wang, Kun Han, Ying-Hua Zhang, et al.", "last_authors": "Yi-Ting Wang, Tian-Long Xia", "summary": "While the anomalous Hall effect (AHE) has been extensively studied in the past, analyzing its mechanism continues to be a critical topic in condensed matter physics, especially in unconventional magnetic materials with noncollinear or noncoplanar magnetic structures. Here, we explore the AHE in the …", "tier": "B_IMPORTANT_C akeya, Hisatomo Harima", "summary": "We performed de Haas–van Alphen (dHvA) oscillation measurements and band-structure calculations for ${\\text{YNi}}_{2}{\\mathrm{B}}_{2}\\mathrm{C}$. Our improved band structure successfully explained the origins of the large dHvA frequencies $β$ and $ζ$, which were inexplicable in previous works. By co…", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Direct experimental Fermi surface study of a superconductor; highly relevant to ARPES interests.", "tags": ["experiment", "Fermi-surface", "superconductivity", "borocarbides"], "image": "", "briefing": {"background": "보로카바이드(Borocarbide) 시스템은 고온 초전도성과 자기 질서가 공존할 수 있는 시스템으로, 이들의 전자 구조를 이해하는 것은 다체 상호작용의 근원을 파악하는 데 필수적입니다.", "motivation": "YNi2B2C의 페르미 면과 전자-포논 결합의 상세 구조를 직접적으로 파악하여, 기존의 밴드 계산 모델이 설명하지 못했던 dHvA 진동의 기원을 확인하고자 합니다.", "result": "개선된 밴드 구조 계산을 통해 기존 연구에서 미스터리로 남아있던 대규모 dHvA 진동 주파수인 β와 ζ의 기원을 규명했습니다.", "implication": "페르미 면의 특정 시트(sheet)에 따라 전자-포논 결합이 불균일하게 작용함을 보여주며, 이는 초전도 메커니즘의 세부사항을 이해하는 데 중요한 데이터가 됩니다.", "novelty": "정밀한 dHvA 측정을 통해 페르미 면의 복잡한 기하학적 구조를 실험적으로 검증하여 최신 전자 구조 계산의 정확도를 높였다는 점이 ARPES/Fermi surface 연구자에게 시사하는 바가 큽니다.", "unresolved": "전자-포논 결합 외에 전자 상관관계가 페르미 면의 왜곡에 미치는 미세한 영향은 여전히 연구가 필요합니다.", "future_work": "이러한 정밀 페르미 면 분석을 고온 초전도체 계열로 확장하여, 위상적 특성이 있는 시스템에서의 초전도-자기 상호작용을 연구할 것으로 기대됩니다.", "concepts": [{"term": "de Haas–van Alphen (dHvA) effect", "why_emerged": "자기장 하에서 금속의 자화율이 진동하는 현상을 통해 페르미 면의 크기와 모양을 측정하기 위해.", "origin": "Wander Johannes de Haas, Pieter van Alphen (1930).", "connections": "Landau levels, 페르미 면 매핑, 양자 진동."}, {"term": "Borocarbide Superconductors", "why_emerged": "희토류 원소를 포함하여 자기성과 초전도성이 공존하는 흥미로운 특성을 연구하기 위해.", "origin": "1994년 경 발견 (Cava et al.).", "connections": "강결합 초전도체, 자기 질서와 초전도성."}], "english_summary": ["Performs dHvA oscillation measurements on YNi2B2C superconductors.", "Revises band-structure calculations to explain experimental oscillation frequencies.", "Shows Fermi-surface-sheet dependent electron-phonon coupling.", "Provides a refined electronic structure model for borocarbides."]}}, {"title": "Ab initio prediction of dx2-y2-wave superconductivity in infinite-layer nickelates", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2608.00512", "authors": "Guang-Yu Guo, Ren-Guo Guo, Yun-Chen Liao, Yang-hao Chan", "last_authors": "Yun-Chen Liao, Yang-hao Chan", "summary": "Infinite-layer nickelates have recently emerged as a new family of potential unconventional high critical temperature ($T_c$) superconductors. However, fundamental questions such as their superconducting (SC) pairing mechanism and gap symmetry remain under intense debate. Here we present a fully {\\it ab initio} theoretical study on the SC properties of optimally doped nickelates $Re$$_{0.8}$Sr$_{0.2}$NiO$_2$ ($Re=$ La, Pr, Nd), based on the density functional theory for superconductors calculations with electron-phonon coupling (EPC), screened Coulomb repulsion and spin fluctuation (SF) interaction treated on an equal footing. We find that $Re_{0.8}$Sr$_{0.2}$NiO$_2$ are two-band superconductors with sign reversal $d_{x^2-y^2}(\\pm)$-wave gap functions on the different Fermi surface (FS) pockets. Interestingly, when the SF interaction is turned off, $T_c$ becomes negligibly small ($\\sim$0.01 K), thus demonstrating that the superconductivity in $Re_{0.8}$Sr$_{0.2}$NiO$_2$ is driven by SF interaction. Moreover, our {\\it ab initio} calculations reveal that the SF interaction is an order of magnitude stronger than both EPC and Coulomb repulsion on the large quasi-two-dimensional FS pocket around the Brillouin zone (BZ) center, thus leading to the SF-mediated pairing mechanism, although the EPC dominates on the small three-dimensional electron FS pockets at the BZ corners. The emergence of nodal $d_{x^2-y^2}(\\pm)$-wave gap structure is traced to the pronounced peaks in the Lindhard response function at the BZ corners. Our calculated FS, SC critical temperature, nodal gap structure and rimental validation."]}}, {"title": "All-Electric Topological Phase Transitions in Proximity-Coupled Bilayer MnBi2Te4 Heterostructures", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2608.01312", "authors": "Basavaraja G, Mukul Kabir", "last_authors": "Basavaraja G, Mukul Kabir", "summary": "The intrinsic magnetic topological insulator MnBi2Te4, in the two-dimensional limit, hosts thickness dependent axion and quantum anomalous Hal (QAH) insulating states governed by antiferromagnetic interlayer coupling. However, controlled interconversion between these phases typically requires extreme external magnetic fields exceeding 9 T, limiting practical tunability. Using complementary first-principles calculations and effective Hamiltonian modeling, we demonstrate a field-free, reversible mechanism to engineer topological phase transitions by exploiting magnetic proximity at the interfaces with a ferromagnetic insulator. Gate-tunable magnetic anisotropy within the ferromagnetic insulator dynamically modulates the proximity-induced exchange bias, enabling all-electric switching of interlayer coupling and band topology in ultrathin MnBi2Te4. Crucially, long-range Heisenberg Monte Carlo simulations reveal that the magnetic ordering temperature of the encapculated MnBi2Te4 film is dramatically elevated. By eliminating the high-field requirement and simultaneously improving thermal stability, this gate-tunable paradigm solves a critical bottleneck in topological physics and offers a viable route toward scalable, high-temperature topological electronics.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Relevant topological study in magnetic heterostructures with potential for electric control.", "tags": ["topologicalinsulator", "heterostructure", "ferromagnet"], "image": "https://arxiv.org/static/browse/0.3.4/images/arxiv-logo-fb.png", "briefing": {"background": "자기 위상 절연체인 MnBi2Te4는 양자 이상 홀 효과를 구현할 수 있지만, 위상 상변화를 위해 9T 이상의 강력한 자기장이 필요하다는 ion. In antiferromagnets with no net magnetization, left-and right-handed magnons are degenerate in the absence of an applied field. Ferrimagnets possess uncompensated magnetic sublattices, which should natively possess right-and left-handed magnons where their energy is split by the internal molecular field. Here, we show that RMn6Sn6 (R = Tb, Er) ferrimagnets possess right and left-handed magnon bands that cross at finite momentum (k) within the basal plane, defining modes with opposite dynamical chirality. Depending on the symmetry of the ferrimagnetic order, which may be manipulated by varying the rare-earth magnetic anisotropy or with applied field, the band crossing may remain a nodal line or may be gapped. The gapped modes contain hybridized chiral excitations whose chirality becomes k-dependent.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Relevant to magnetic materials and chiral physics.", "tags": ["magnon", "magnetism"], "image": "https://arxiv.org/html/2608.00210v1/figures/R166_ARCS_CNCS_chi.png", "briefing": {"background": "자성체 내의 준입자인 마그논은 스핀 각운동량을 전달하는데, 강자성체와 달리 페리자성체나 반강자성체에서는 대칭성에 의해 그 성질이 크게 달라집니다.", "motivation": "페리자성체인 RMn6Sn6 화합물에서 마그논 밴드가 교차하며 나타나는 동역학적 카이랄성(dynamical chirality) 현상을 이해하고자 함.", "result": "RMn6Sn6에서 오른쪽 및 왼쪽 회전 성분을 가진 마그논 밴드가 특정 운동량에서 교차함을 발견하고, 이를 통해 대칭성에 따른 카이랄 마그논 혼성 현상을 규명함.", "implication": "자성체의 대칭성을 조절하여 마그논의 카이랄 특성을 제어할 수 있음을 보였으며, 이는 스핀트로닉스 소자 응용에 새로운 경로를 제시함.", "novelty": "페리자성체에서의 마그논 밴드 교차와 그에 따른 카이랄성 혼성을 실험적으로 명확히 입증함.", "unresolved": "외부 자기장이나 이방성 변화가 어떻게 마그논 밴드 교차를 완벽하게 제어할 수 있는지에 대한 미세한 메커니즘 해석은 추가 연구가 필요함.", "future_work": "다른 카이랄 자성체로의 확장 및 카이랄 마그논을 이용한 스핀 전류 생성 효율 측정.", "concepts": [{"term": "카이랄 마그논(Chiral magnon)", "why_emerged": "스핀파의 회전 방향이 공간적 또는 운동량 공간적 대칭성을 깰 때 나타나는 고유 모드를 분류하기 위해 필요함.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "스핀 펌핑, 토폴로지 마그노닉스."}, {"term": "페리자성체(Ferrimagnet)", "why_emerged": "반평행한 자성 부격자들의 모멘트 크기가 달라 알짜 자기모멘트를 가지는 물질의 복잡한 자기적 성질을 이해하기 위해 필요함.", "origin": "Louis Néel(1948).", "connections": "자기 이방성, 희토류-전이금속 합금."}], "english_summary": ["Investigated magnon chirality in RMn6Sn6 ferrimagnets.", "Observed band crossing of right- and left-handed magnons in the basal plane.", "Showed that symmetry breaking controls the hybridization and chirality of magnon modes.", "Provides a mechanism for manipulating magnon chirality via magnetic anisotropy or external fields."]}}, {"title": "Correlated Insulator Moir\\'e Bolometer", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2608.00488", "authors": "L. Elesin, A. L. Shilov, M. Kravtsov, et al.", "last_authors": "A. Principi, D. A. Bandurin", "summary": "Light incident on an insulator is generally not expected to turn it into a metal without invoking intense ultrafast excitation that leads to transient structural transitions. Here we show that magic-angle twisted bilayer graphene tuned to half filling of the moir\\'e band provides a notable exception to this expectation. We find that weak beam of long-wavelength photons, with energies comparable to the flat-band width, selectively heat the low-heat-capacity electronic subsystem, thereby suppressing the correlated gap. This produces a giant resistance change governed not by a persistent photocarrier population, but by the extreme sensitivity of a many-body correlated gap to weak electronic heating. The resulting photon-driven insulator-to-metal transition produces a broadband low-noise photoresponse with voltage responsivity exceeding millivolts per nW of absorbed power. The mechanism is dual to superconducting hot-electron response: radiation-heated electrons suppress a many-body order, but in reverse the correlated insulator melts into a metal, providing robustness to magnetic fields of several tesla and a sharp insulator-to-metal resistive contrast. Our results establish correlated flat-band systems as a platform for ultra-sensitive detection of faint long-wavelength radiation.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Excellent experimental study of correlated insulators in moire systems; fits within broader interest in correlated electron systems.", "tags": ["graphene", "correlated", "moire"], "image": "https://arxiv.org/html/2608.00488v1/x1.png", "briefing": {"background": "마법 각도 비틀린 이중층 그래핀(MATBG)은 강한 상관관계를 가진 평탄한 밴드를 형성하여 절연체와 초전도 상태가 공존하는 독특한 물성을 보입니다.", "motivation": "강상관계 절연체 상태에 있는 MATBG가 빛에 반응하여 저항이 급격히 변하는 현상을 이용하여 초고감도 광검출기로 활용하고자 함.", "result": "MATBG를 절연 상태로 튜닝한 후 저에너지 광자를 조사하여, 전자계의 열적 들뜸을 유도함으로써 절연체를 금속으로 전이시키는 '볼로미터' 효과를 입증함.", "implication": "기존의 광학적 들뜸을 넘어 상관계 절연체의 전자 구조 자체가 가지는 민감도를 이용한 새로운 고성능 광센서 플랫폼 가능성을 확인함.", "novelty": "일반적인 반도체 광검출기와 달리 강상관계 시스템의 다체 상호작용을 이용해 극도로 낮은 출력의 빛도 감지 가능한 볼로미터 효과를 구현함.", "unresolved": "상태 전이 시의 정확한 미시적 에너지 소산 과정과 장기적인 안정성 이슈는 추가 연구가 필요함.", "future_work": "테라헤르츠 및 더 넓은 주파수 대역에서의 감응도 측정 및 소자화 공정 최적화.", "concepts": [{"term": "마법 각도 비틀린 이중층 그래핀(MATBG)", "why_emerged": "두 층의 그래핀을 특정 각도로 비틀어 밴드 구조를 압축해 강한 상관관계 효과를 극대화하기 위해 도입됨.", "origin": "Pablo Jarillo-Herrero 그룹(2018).", "connections": "무아레(Moiré) 격자, 강상관계 물리학."}, {"term": "볼로미터(Bolometer)", "why_emerged": "입사하는 전자기파가 물질을 가열할 때 나타나는 저항 변화를 이용하여 빛을 감지하기 위해 필요함.", "origin": "Samuel Langley(1878).", "connections": "열적 광검출기, 저온 물리학."}], "english_summary": ["Demonstrated that magic-angle twisted bilayer graphene functions as a sensitive moiré bolometer.", "Weak long-wavelength photons suppress the correlated gap at half-filling.", "Observed an insulator-to-metal transition with giant resistive contrast.", "Established a new platform for ultra-sensitive, low-noise infrared radiation detection."]}}, {"title": "Electron-like high-temperature superconductivity induced by compressive strain in La2PrNi2O7 thin films", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2608.01295", "authors": "Zhiwei Wang, Zhengjie Wang, Huiyu Wang, et al.", "last_authors": "Tao Wu, Xianhui Chen", "summary": "The realization of high-temperature supercon
