<title>Daily Paper Slideshow</title>
<style>
  :root {
    color-scheme: light;
    --bg: #f6f7f4;
    --paper: #ffffff;
    --ink: #111827;
    --muted: #64748b;
    --line: #d8ddd2;
    --accent: #176b87;
    --accent-2: #9a3412;
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; overflow: auto; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: var(--bg); color: var(--ink); }
  .shell { max-width: 1500px; min-height: 100vh; margin: 0 auto; padding: 14px 18px; display: flex; flex-direction: column; }
  .topbar { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 16px; }
  .top-actions { display: flex; align-items: center; gap: 10px; }
  .topbar a, button { border: 1px solid var(--line); border-radius: 8px; background: var(--paper); color: var(--ink); padding: 10px 14px; font-weight: 700; text-decoration: none; cursor: pointer; }
  button.primary { background: var(--accent); border-color: var(--accent); color: white; }
  button:disabled { opacity: 0.45; cursor: not-allowed; }
  .counter { color: var(--muted); font-weight: 700; }
  .slide { min-height: calc(100vh - 82px); background: var(--paper); border: 1px solid var(--line); border-radius: 10px; padding: 18px; box-shadow: 0 18px 42px rgba(15, 23, 42, 0.10); display: grid; grid-template-columns: minmax(310px, 0.86fr) minmax(0, 1.55fr); gap: 18px; overflow: visible; }
  .paper-head { min-width: 0; min-height: 0; overflow: visible; display: flex; flex-direction: column; gap: 12px; }
  .figure { margin: 0; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: #f8fafc; }
  .figure img { display: block; width: 100%; max-height: 41vh; object-fit: contain; background: white; }
  .figure figcaption { padding: 7px 10px; color: var(--muted); font-size: 12px; line-height: 1.3; }
  .head-text { display: flex; flex-direction: column; gap: 9px; min-width: 0; }
  .badges { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .badge { border-radius: 999px; padding: 5px 9px; background: #eef2ff; color: #3730a3; font-size: 12px; font-weight: 800; }
  .score { background: #fee2e2; color: #991b1b; }
  h1 { margin: 0; font-size: 25px; line-height: 1.15; letter-spacing: 0; overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
  h1 a { color: inherit; text-decoration-color: rgba(23, 107, 135, 0.35); text-decoration-thickness: 2px; text-underline-offset: 4px; }
  h1 a:hover { color: var(--accent); text-decoration-color: var(--accent); }
  .meta, .authors, .why, .abstract { font-size: 13px; line-height: 1.45; }
  .meta, .authors { color: var(--muted); }
  .why strong, .abstract strong, .authors strong { color: var(--ink); }
  .authors { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .why { border-left: 4px solid var(--accent-2); padding-left: 10px; color: #374151; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .abstract { border-top: 1px solid var(--line); padding-top: 14px; color: #374151; }
  .original-abstract { border-top: 1px solid var(--line); padding-top: 10px; color: #374151; font-size: 11.5px; line-height: 1.35; overflow-wrap: anywhere; }
  .original-abstract strong { display: block; margin-bottom: 4px; color: var(--ink); }
  .tags { display: flex; flex-wrap: wrap; gap: 8px; }
  .tag { border-radius: 999px; padding: 4px 8px; background: #f1f5f9; color: #475569; font-size: 12px; font-weight: 700; }
  .head-text > .link { display: none; }
  .briefing { min-width: 0; min-height: 0; overflow: visible; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); grid-auto-rows: minmax(0, auto); align-content: start; gap: 11px 18px; border-top: 0; padding-top: 0; }
  .brief-section { min-width: 0; }
  .brief-section.wide { grid-column: 1 / -1; }
  .brief-section h2 { margin: 0 0 4px; font-size: 14px; line-height: 1.22; color: #0f766e; letter-spacing: 0; }
  .brief-section p, .brief-section li { margin: 0; font-size: 12.5px; line-height: 1.42; color: #1f2937; overflow-wrap: anywhere; }
  .brief-section ul { margin: 0; padding-left: 20px; }
  .concepts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 9px 14px; }
  .concept { border-top: 1px solid var(--line); padding-top: 7px; }
  .concept h3 { margin: 0 0 4px; font-size: 13px; color: #7c2d12; letter-spacing: 0; }
  .concept p { margin: 2px 0 0; font-size: 11.5px; line-height: 1.35; color: #374151; overflow-wrap: anywhere; }
  .concept b { color: #111827; }
  .link { color: var(--accent); font-weight: 800; text-decoration: none; }
  .empty { padding: 48px; background: var(--paper); border: 1px solid var(--line); border-radius: 12px; color: var(--muted); }
  @media (max-width: 860px) {
    .shell { padding: 14px; }
    .topbar, .top-actions { align-items: stretch; flex-direction: column; }
    .slide, .briefing, .concepts { grid-template-columns: 1fr; }
    .slide { min-height: auto; overflow: visible; display: grid; }
    h1 { font-size: 28px; }
  }
</style>

<script>
const slides = [{"title": "Hund's coupling governed orbital-selective superconductivity in Ba1−xKxFe2As2", "journal": "PRB_Recent", "source": "author whitelist", "link": "http://link.aps.org/doi/10.1103/yry8-qdm6", "authors": "Elena Corbae, Rong Zhang, Cong Li, et al.", "last_authors": "Donghui Lu, Zhi-Xun Shen", "summary": "Author(s): Elena Corbae, Rong Zhang, Cong Li, Kunihiro Kihou, Chul-Ho Lee, Makoto Hashimoto, Thomas Devereaux, Oscar Tjernberg, Egor Babaev, Dung-Hai Lee, Vadim Grinenko, Donghui Lu, and Zhi-Xun Shen While the influence of electronic correlations on superconductivity is a defining question, identifying how these correlations manifest in the superconducting state remains difficult. Furthermore, in multiorbital systems, correlations driven by Hund’s coupling can differentiate the behavior of individual orbitals, and how such orbital selectivity governs superconducting pairing has remained largely unexplored experimentally. Here, the authors use angle-resolved photoemission spectroscopy to experimentally determine the superconducting gap of a representative iron-based superconductor as the Hund’s coupling influence increases. They find increased correlation diminishes the superconducting gap in an orbital-selective way, suggesting that Hund’s coupling plays a central role in shaping pairing in multiorbital superconductors. [Phys. Rev. B 113, 224517] Published Fri Jun 12, 2026", "tier": "A_MUST_READ", "score": "10", "reason": "author whitelist: Makoto Hashimoto", "tags": ["angle-resolvedphotoemission", "photoemission", "superconduct"], "image": "", "briefing": {"background": "철 기반 초전도체(IBS)와 같은 다궤도(multiorbital) 시스템에서는 전자 간의 쿨롱 상호작용뿐만 아니라 훈트 결합(Hund's coupling)이 전자 상관관계의 강도를 결정하는 핵심적인 역할을 합니다. 특히 특정 궤도의 유효 질량이 더 크게 증가하는 '궤도 선택적 상관관계' 현상이 중요한 화두입니다.", "motivation": "훈트 결합에 의해 유도된 궤도 선택적 상관관계가 실제 초전도 상태의 페어링 갭(superconducting gap) 형성에 구체적으로 어떤 영향을 미치는지 실험적으로 확인하고자 했습니다.", "result": "Ba1-xKxFe2As2 시스템에서 ARPES를 통해 초전도 갭을 정밀 측정했습니다. 연구 결과, 훈트 결합의 영향으로 전자 상관관계가 강해짐에 따라 초전도 갭의 크기가 모든 궤도에서 균일하게 변하는 것이 아니라, 특정 궤도에서 선택적으로 억제된다는 사실을 발견했습니다.", "implication": "다궤도 초전도체에서 초전도 페어링의 메커니즘을 이해하기 위해서는 단순히 평균적인 상관관계가 아니라, 훈트 결합에 의한 궤도별 개성을 반드시 고려해야 함을 시사합니다.", "novelty": "ARPES 분야의 권위자인 Z.-X. Shen 및 Donghui Lu 그룹의 연구로, 고품질 단결정과 정밀한 에너지 분해능을 통해 훈트 결합과 궤도 선택적 초전도 간의 직접적인 연결 고리를 실험적으로 증명했다는 점이 핵심입니다.", "unresolved": "이러한 궤도 선택적 억제가 페어링 대칭성(예: s-wave vs d-wave)의 변화로 이어지는지, 혹은 다른 경쟁 질서와의 관련성이 있는지에 대해서는 추가 연구가 필요합니다.", "future_work": "다른 철 기반 초전도체나 니켈레이트(nickelates)와 같은 유사 다궤도 시스템에서도 훈트 결합에 의한 궤도 선택적 갭 억제 현상이 보편적으로 나타나는지 확인할 필요가 있습니다.", "concepts": [{"term": "Hund's coupling (훈트 결합)", "why_emerged": "다궤도 원자 내에서 전자들이 스핀을 나란히 배열하여 에너지를 낮추려는 경향을 설명하기 위해 등장했습니다.", "origin": "Friedrich Hund (1925년경)", "connections": "Hund's metal, orbital selectivity, Mott insulator"}, {"term": "Orbital-selective superconductivity", "why_emerged": "다궤도 시스템에서 모든 전자 궤도가 초전도에 동등하게 기여하지 않는다는 실험적 정황을 설명하기 위해 제안되었습니다.", "origin": "철 기반 초전도체 연구 과정에서 이론적으로 심화됨", "connections": "ARPES gap symmetry, Iron-based superconductors, heavy fermions"}, {"term": "ARPES (각분해 광전자 분광법)", "why_emerged": "고체 내 전자의 에너지와 운동량(k-space)을 직접적으로 관찰하여 밴드 구조를 파악하기 위해 개발되었습니다.", "origin": "1960-70년대 광전효과를 기반으로 발전", "connections": "Fermi surface mapping, Superconducting gap measurement, CDW"}], "english_summary": ["Investigated the impact of Hund's coupling on orbital-selective superconductivity in Ba1-xKxFe2As2 using ARPES.", "Observed that increased electronic correlations selectively diminish the superconducting gap in specific orbitals.", "Demonstrates that Hund's coupling is a primary factor in shaping the pairing landscape of multiorbital superconductors.", "Led by prominent researchers Donghui Lu and Zhi-Xun Shen."]}}, {"title": "Deciphering the absence of charge density waves in the V-based kagome metal CsV6Sb6", "journal": "PRB_Recent", "source": "keyword", "link": "http://link.aps.org/doi/10.1103/3vlt-zz94", "authors": "Rongxiao Du, Yunfan Yang, Wenxin Lv, et al.", "last_authors": "Hechang Lei, Jianbo Hu", "summary": "Author(s): Rongxiao Du, Yunfan Yang, Wenxin Lv, Junhong Yu, Hang Zhang, Hechang Lei, and Jianbo Hu While charge density waves (CDWs) are a hallmark of the kagome metal $\\mathrm{Cs}{\\mathrm{V}}_{3}{\\mathrm{Sb}}_{5}$, their absence in the bilayer counterpart $\\mathrm{Cs}{\\mathrm{V}}_{6}{\\mathrm{Sb}}_{6}$ remains a notable exception, with the underlying mechanism yet to be elucidated. Here, integrat… [Phys. Rev. B 113, 245119] Published Tue Jun 09, 2026", "tier": "A_MUST_READ", "score": "9", "reason": "title strong match: kagome metal", "tags": ["kagome", "chargedensitywave", "CDW"], "image": "", "briefing": {"background": "AV3Sb5 (A=K, Rb, Cs) 계열의 Kagome 금속은 전하 밀도파(CDW), 초전도, 변칙 홀 효과 등 풍부한 물리 현상을 보여주어 최근 응집물질물리 분야의 핵심 주제입니다.", "motivation": "유사한 V 기반 Kagome 구조를 가졌음에도 불구하고, 이중층(bilayer) 구조인 CsV6Sb6에서는 CsV3Sb5와 달리 CDW가 관찰되지 않는 원인을 규명하고자 했습니다.", "result": "이론 및 실험적 분석을 통합하여 CsV6Sb6의 전자 구조를 분석했습니다. (초록 정보에 따르면) 두 물질 사이의 구조적 차이와 그에 따른 밴드 충전(filling) 혹은 격자 동역학적 특성 변화가 CDW 불안정성을 억제하는 결정적 요인임을 밝혀낸 것으로 보입니다.", "implication": "Kagome 격자 시스템에서 CDW가 형성되기 위한 임계 조건(격자 층수, 밴드 토폴로지 등)을 이해하는 데 중요한 대조군 정보를 제공합니다.", "novelty": "CDW가 활발히 연구되는 CsV3Sb5의 직접적인 비교 대상으로서 CsV6Sb6를 지목하고, 왜 유사한 국소 환경에서도 집단적 전자 현상이 사라질 수 있는지를 다룬 점이 흥미롭습니다.", "unresolved": "CsV6Sb6에서 CDW가 없는 대신 다른 종류의 양자 상태(예: 자성 또는 특이 금속 상태)가 숨어 있는지에 대한 상세한 조사가 부족합니다.", "future_work": "압력이나 도핑을 통해 CsV6Sb6에서 인위적으로 CDW를 유도할 수 있는지, 혹은 다른 V 기반 Kagome 화합물로 연구를 확장할 수 있습니다.", "concepts": [{"term": "Kagome metal (카고메 금속)", "why_emerged": "기하학적 좌절(frustration)과 특이한 밴드 구조(flat band, Dirac cone)가 결합된 물성을 연구하기 위해 도입되었습니다.", "origin": "전통적인 대나무 바구니 문양(Kagome)에서 유래", "connections": "CsV3Sb5, geometric frustration, flat bands, quantum spin liquid"}, {"term": "Charge Density Wave (전하 밀도파)", "why_emerged": "전자-격자 상호작용이나 페르미 면 중첩(nesting)에 의해 전하 밀도가 주기적으로 변조되는 상태를 설명합니다.", "origin": "Rudolf Peierls (이론적 예측)", "connections": "Peierls transition, NbSe3, nesting vector, electron-phonon coupling"}], "english_summary": ["Explored the physical reason behind the absence of charge density waves (CDW) in the bilayer kagome metal CsV6Sb6.", "Contrasted CsV6Sb6 with its CDW-bearing sibling CsV3Sb5 to identify key factors for CDW instability.", "Provides insights into the structural and electronic prerequisites for emergent orders in vanadium-based kagome systems."]}}, {"title": "Emergent spin-singlet pairing in the frustrated kagome metal Sc3Mn3Al7Si5", "journal": "PRB_Recent", "source": "keyword", "link": "http://link.aps.org/doi/10.1103/8tjx-yy4w", "authors": "R. Guehne, A. K. Sharma, P. Yanda, J. Noky, J. Sichelschmidt, R. Koban, W. Schnelle, C. Shekhar, M. Baenitz, and C. Felser", "last_authors": "W. Schnelle, C. Shekhar, M. Baenitz, and C. Felser", "summary": "Author(s): R. Guehne, A. K. Sharma, P. Yanda, J. Noky, J. Sichelschmidt, R. Koban, W. Schnelle, C. Shekhar, M. Baenitz, and C. Felser The metallic kagome compound ${\\mathrm{Sc}}_{3}{\\mathrm{Mn}}_{3}{\\mathrm{Al}}_{7}{\\mathrm{Si}}_{5}$ has attracted attention as a candidate platform where geometric frustration and itinerant electrons may cooperate to stabilize a quantum-disordered magnetic ground state. Here, we combine bulk thermod… [Phys. Rev. B 113, 214430] Published Wed Jun 10, 2026", "tier": "A_MUST_READ", "score": "9", "reason": "title strong match: kagome metal", "tags": ["kagome"], "image": "", "briefing": {"background": "Mn 기반의 Kagome 시스템은 강한 자기적 상호작용과 기하학적 좌절이 공존하여, 단순한 자성체 이상의 특이한 기바닥 상태를 가질 가능성이 큽니다.", "motivation": "새로운 Kagome 금속인 Sc3Mn3Al7Si5에서 기하학적 좌절과 전도 전자 간의 상호작용이 어떤 새로운 물리적 상태(특히 무질서 자성이나 초전도 등)를 유도하는지 연구했습니다.", "result": "열역학적 측정과 자기 공명 측정을 통해 이 물질에서 스핀-싱글렛 페어링(spin-singlet pairing)의 증거를 확인했습니다. 이는 기하학적으로 좌절된 격자 구조 내에서 창발적인 초전도 또는 관련 페어링 상태가 존재함을 시사합니다.", "implication": "Mn 기반 화합물에서도 Kagome 격자의 특수성을 이용해 스핀 액체와 유사한 상태나 특이한 페어링 상태를 구현할 수 있음을 보여줍니다.", "novelty": "보통 자성이 강해 초전도를 방해하는 Mn 원소를 포함하고 있음에도 불구하고, Kagome 격자의 좌절을 통해 싱글렛 페어링 상태가 나타난다는 점이 매우 이례적이고 중요합니다.", "unresolved": "관찰된 싱글렛 페어링이 장거리 질서를 가진 완전한 초전도 상태인지, 아니면 전구적(precursor) 페어링 상태인지에 대한 구분이 필요합니다.", "future_work": "극저온 ARPES를 통한 밴드 구조 관찰이나 중성자 산란을 통한 스핀 동역학 분석이 추가된다면 이 물질의 정체를 명확히 할 수 있을 것입니다.", "concepts": [{"term": "Spin-singlet pairing (스핀-싱글렛 페어링)", "why_emerged": "두 전자의 스핀 합이 0인 상태로 짝을 짓는 초전도 페어링의 가장 기본적인 형태를 정의하기 위해 사용됩니다.", "origin": "BCS 이론의 기초 개념", "connections": "BCS theory, Cooper pair, NMR Knight shift"}, {"term": "Geometric frustration (기하학적 좌절)", "why_emerged": "삼각형이나 테트라헤드론 구조에서 모든 자성 상호작용을 동시에 만족시킬 수 없어 발생하는 복잡한 자성을 설명합니다.", "origin": "G. H. Wannier (1950년, Ising model on triangular lattice)", "connections": "Spin liquid, Kagome lattice, Pyrochlore lattice"}], "english_summary": ["Identified emergent spin-singlet pairing in the frustrated Mn-based kagome metal Sc3Mn3Al7Si5.", "Combined bulk thermodynamics and NMR to probe the magnetic and electronic ground state.", "Highlights how geometric frustration can cooperate with itinerant electrons to bypass long-range magnetic order in favor of pairing states."]}}, {"title": "Hybridized kagome bands and induced Ti magnetism in RTi3Bi4 (R=Nd, Sm, Gd) kagome metals studied using angle-resolved photoemission spectroscopy and x-ray magnetic circular dichroism", "journal": "PRB_Recent", "source": "keyword", "link": "http://link.aps.org/doi/10.1103/r6t1-2qbw", "authors": "Chan-young Lim, Francesc Ballester, Arunava Kar, et al.", "last_authors": "Maia G. Vergniory, Santiago Blanco-Canosa", "summary": "Author(s): Chan-young Lim, Francesc Ballester, Arunava Kar, Manex Alkorta, David Subires, Ji Dai, Massimo Tallarida, Elio Vescovo, Timur K. Kim, Cephise Cacho, Changjiang Yi, Subhajit Roychowdhury, Avdhesh Kumar Sharma, Yongseong Choi, Gilberto Fabbris, Joerg Strempfer, Pierluigi Gargiani, Chandra Shekhar, Claudia Felser, Ion Errea, Maia G. Vergniory, and Santiago Blanco-Canosa Kagome materials are known for hosting emergent quantum phenomena driven by the interaction between different lattice, charge, and spin orders. Here, we present a detailed angl Suggests that altermagnetic-like states can reconcile TRSB and CDW properties."]}}, {"title": "Ramp Josephson junctions of Al/Ti/Sr2RuO4: Observation of single-domain quantum oscillations and the detection of chiral surface current", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/p14l-nq8z", "authors": "Zixuan Li, Yiqun Alex Ying, Brian M. Zakrzewski, et al.", "last_authors": "Zhiqiang Mao, Ying Liu", "summary": "Author(s): Zixuan Li, Yiqun Alex Ying, Brian M. Zakrzewski, Yan Xin, Yu Wang, Zhiqiang Mao, and Ying Liu The determination of how the phase of the superconducting order parameter in a superconductor varies with the spatial direction, which can be done only through Josephson-effect-based phase-sensitive measurements, is crucial for the establishment of the precise pairing symmetry of the superconductor.… [Phys. Rev. B 113, 214510] Published Fri Jun 05, 2026", "tier": "B_IMPORTANT_CONDMAT", "score": "9", "reason": "Crucial phase-sensitive experiment on unconventional superconductor Sr2RuO4.", "tags": ["superconductivity", "Sr2RuO4", "experiment"], "image": "", "briefing": {"background": "Sr2RuO4의 초전도 대칭성은 수십 년간 논란이 되어왔으며, 특히 카이랄 성질의 존재 여부는 위상 초전도체 후보로서 매우 중요합니다.", "motivation": "조셉슨 접합을 이용한 위상 민감도 측정을 통해 Sr2RuO4의 초전도 순서 매개변수(order parameter)의 위상 공간 의존성을 직접 확인하고자 합니다.", "result": "단일 도메인 양자 진동을 관찰하고 카이랄 표면 전류의 증거를 검출하여, Sr2RuO4의 초전도 상태가 카이랄 특성을 가질 가능성을 강화했습니다.", "implication": "Sr2RuO4가 위상 초전도체일 가능성을 재조명하며, 복잡한 비전통적 초전도 현상에 대한 실험적 기준을 제시합니다.", "novelty": "위상 민감도 측정은 위상학적 상태를 판별하는 결정적 증거가 되며, 이는 Sr2RuO4 물성 연구의 핵심적 난제를 정면으로 다루고 있습니다.", "unresolved": "여전히 샘플 의존성과 실험적 재현성 이슈가 학계에 남아있어 추가적인 독립적 검증이 필요합니다.", "future_work": "다양한 결정 방향에서의 접합 실험을 통해 순서 매개변수의 절점(node) 구조를 완전히 매핑하는 작업이 이어져야 합니다.", "concepts": [{"term": "조셉슨 접합", "why_emerged": "초전도 위상차의 간섭을 이용해 순서 매개변수의 대칭성을 판별하기 위함.", "origin": "Brian Josephson(1962).", "connections": "스퀭이드(SQUID), 초전도 큐비트."}, {"term": "카이랄 표면 전류", "why_emerged": "카이랄 초전도체의 에너지 갭이 표면에서 위상학적으로 보호받는 되는지에 대한 물리적 기초를 확립하였습니다.", "novelty": "상온에서 구현된 비선형 수송 현상이라는 점에서 응용 가능성을 높였으며, 특히 TaIrTe4와 같은 위상 물질의 궤도 물리(orbital physics) 연구와 결합하여 베리 위상과 수송 현상 간의 정량적 관계를 제시했습니다.", "unresolved": "이러한 비선형 수송 신호의 크기를 다른 위상 반금속들과 비교하여 어떤 밴드 구조적 특징이 최적의 응답을 이끌어내는지에 대한 체계적인 스케일링 법칙은 아직 논의가 필요합니다.", "future_work": "다른 위상 반금속 물질로의 확장 연구와, 이 효과를 이용한 고감도 자기장 센서 및 비선형 논리 소자 개발 가능성을 타진할 것으로 보입니다.", "concepts": [{"term": "베리 연결 편극", "why_emerged": "밴드 구조의 기하학적 위상 성질이 외부 장에 의해 어떻게 변조되는지 설명하기 위해 필요합니다.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "베리 곡률, 궤도 자기 모멘트와 밀접함."}, {"term": "비선형 평면 홀 효과", "why_emerged": "선형 홀 효과와 달리, 비중심 대칭성이나 위상적 밴드 구조에 기인한 이차 응답을 관측하기 위해 도입되었습니다.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "비선형 응답 이론, 위상 반금속의 수송 현상."}], "english_summary": ["TaIrTe4 exhibits an intrinsic nonlinear planar Hall effect at room temperature.", "The effect is driven by a Berry-connection-polarizability dipole induced by an in-plane magnetic field.", "This provides new insights into orbital-mediated transport in topological semimetals.", "The result bridges the gap between fundamental Berry curvature physics and practical nonlinear transport devices."]}}, {"title": "Broadband and high-speed terahertz wireless sensing via vertical-transport Dirac-source detector", "journal": "Science_Advances", "source": "Gemini", "link": "https://doi.org/10.1126/sciadv.aeg2196", "authors": "Xiaokai Pan, Yiming Wang, Hangxiang Wang, et al.", "last_authors": "Wei Lu, Lin Wang", "summary": "In the realm of wireless sensing, it is envisioned that sensing and communication functionalities will coexist and be fully integrated within a unified system. Future sensing systems thus necessitate detectors capable of operating at higher frequency bands—ranging from millimeter wave to terahertz (THz)—while delivering wider bandwidths, faster response rates, and enhanced functional integration. Dirac-source (DS) detectors use Dirac semimetals as hot-electron sources to capitalize on the low density of states (DOS) near the Dirac point, thereby effectively suppressing the formation of metal-induced gap states. Furthermore, when this architecture incorporates the inherent interlayer vertical electron transport of vertical van der Waals (vdW) heterostructures, it shows great promise for realizing low-power, post–Moore era sensing devices with superior injection and transport efficiencies. Here, we report a DS detector composed of the completely vertical gold/zirconium pentatelluride/graphene/gold structure (Au/ZrTe 5 /graphene/Au) heterojunction, which harnesses strong localized fields to achieve high thermionic emission. The detector manifests outstanding performance in terms of remarkable responsivity, exceeds a peak of 1600 V/W from 0.02 to 0.5 THz at room temperature, has a fast response time less than 20 ns, and notably is capable for heterodyne mixing with intermediate frequency (IF) bandwidth larger than ±26.5 gigahertz. Our results not only shed a fresh light on DS dynamics in the terahertz region but also highlight the transformative potential of semimetal electronics for applications in wireless energy harvesting, communication, and imaging.", "tier": "B_IMPORTANT_CONDMAT", "score": "9", "reason": "Dirac semimetals, graphene, and vdW heterostructures are strong quantum materials interests.", "tags": ["Diracsemimetal", "graphene", "vanderWaalsheterostructure", "transport", "terahertz"], "image": "", "briefing": {"background": "차세대 통신 및 센싱 기술은 테라헤르츠(THz) 대역에서의 초고속 감지가 필수적입니다. 기존의 반도체 기반 검출기는 한계가 있으며, 위상 물질의 독특한 밴드 구조를 활용하여 효율을 높이는 새로운 접근이 필요합니다.", "motivation": "디락 반금속(Dirac semimetals)의 낮은 상태 밀도를 활용하여 금속-반도체 계면의 결함을 줄이고, 수직형 반데르발스(vdW) 헤테로구조를 통해 전하 주입 효율을 극대화하고자 했습니다.", "result": "Au/ZrTe5/graphene/Au 수직 헤테로구조 기반의 디락 소스(Dirac-source) 검출기를 구현하였습니다. 이 소자는 상온에서 1600 V/W 이상의 높은 반응성과 20 ns 미만의 응답 속도를 달성했습니다.", "implication": "위상 물질의 물리적 특성이 미래형 THz 소자 및 통신 시스템의 성능을 비약적으로 향상시킬 수 있음을 증명했습니다.", "novelty": "위상 반금속을 단순히 물성 연구용이 아닌 실용적인 초고속 광전자 소자의 핵심 부품으로 응용했다는 점이 주목할 만합니다.", "unresolved": "다양한 환경 조건에서의 장기 안정성과 더 넓은 주파수 대역에서의 소자 균일성 확보가 과제로 남습니다.", "future_work": "THz 통신망 구축 및 무선 에너지 하베스팅 시스템으로의 통합 연구가 예상됩니다.", "concepts": [{"term": "디락 반금속 (Dirac semimetals)", "why_emerged": "전자가 디락 방정식을 따르는 선형 분산 관계를 가져 이동도가 매우 높고 낮은 상태 밀도를 가짐.", "origin": "Wehling et al. (2011), Young et al. (2012) 등 이론적 예측 이후 실험적 검증.", "connections": "위상 절연체, 그래핀 물리학, 위상학적 비자명성."}, {"term": "수직형 반데르발스 헤테로구조", "why_emerged": "서로 다른 2D 물질을 쌓아 격자 불일치를 줄이고 새로운 양자 현상을 창출하기 위함.", "origin": "Geim & Grigorieva (2013).", "connections": "무아레 물리학, 2D 트랜지스터."}], "english_summary": ["A vertical Dirac-source detector based on Au/ZrTe5/graphene/Au heterostructures is reported.", "The device demonstrates high responsivity (1600 V/W) and fast response time (<20 ns) in the THz regime.", "The low density of states near the Dirac point minimizes metal-induced gap states.", "This work showcases the potential of topological semimetals in next-generation wireless sensing."]}}, {"title": "Single-particle tunneling spectrum with a robust superconducting gap in La 2 PrNi 2 O 7 thin films at ambient pressure", "journal": "Science_Advances", "source": "Gemini", "link": "https://doi.org/10.1126/sciadv.aeg2429", "authors": "Shengtai Fan, Mengjun Ou, Marius Scholten, et al.", "last_authors": "Ilya M. Eremin, Hai-Hu Wen", "summary": "The recent discovery of high-temperature superconductivity in nickelate systems has generated tremendous interest in the community. The core issue to understand the pairing mechanism is the superconducting gap and its symmetry. We have successfully synthesized the superconducting thin films of La 2 PrNi 2 O 7 with an onset transition temperature of 41.5 kelvins and measured the superconducting tunneling spectra after exposing the superconducting layer by using the tip-excavation technique. The spectrum shows a robust superconducting gap at about Δ ≈ 19 milli–electron volts, and fittings based on the Dynes model indicate that this dominant gap should have an s -wave structure with low anisotropy, which allows us to put the priority in selecting the s ± pairing symmetry. Furthermore, a clear hump structure is observed at an energy of 49 ± 2 milli–electron volts, which is inclined to be interpreted as a bosonic mode. Our results help clarify the mystery of superconductivity in bilayer nickelate superconductors.", "tier": "B_IMPORTANT_CONDMAT", "score": "9", "reason": "STM/STS related technique on unconventional nickelate superconductor, a key electronic structure topic.; demoted from A: broad CM, not direct user/project hit", "tags": ["STM/STS", "nickelate", "superconductivity", "electronicstructure"], "image": "", "briefing": {"background": "니켈산염(Nickelate) 시스템은 큐프레이트와 유사한 층상 구조를 가져 고온 초전도체의 새로운 후보군으로 급부상했습니다. 그러나 이 물질의 초전도 갭 구조와 대칭성을 정확히 파악하는 것은 여전히 고체 물리학계의 난제입니다.", "motivation": "이중층 니켈산염인 La2PrNi2O7 박막의 초전도 갭 구조를 STM/STS(주사 터널링 현미경/분광)를 통해 직접 관측하여 페어링 대칭성을 규명하고자 했습니다.", "result": "Dynes 모델 피팅을 통해 s-wave 대칭성과 낮은 이방성을 가진 초전도 갭(Δ ≈ 19 meV)을 확인했습니다. 또한 49 meV 근처에서 보손 모드(bosonic mode)로 추정되는 험프(hump) 구조를 발견했습니다.", "implication": "니켈산염 초전도체에서 s± 페어링 대칭성을 지지하는 증거를 확보하여, 니켈산염과 큐프레이트 간의 초전도 메커니즘 비교 연구에 중요한 단서를 제공합니다.", "novelty": "팁-굴착(tip-excavation) 기법을 사용하여 박막 내부의 진성 초전도 상태를 직접 측정한 점이 기술적으로 뛰어나며, 니켈산염 고온 초전도 메커니즘 정립에 기여합니다.", "unresolved": "49 meV의 보손 모드가 정확히 어떤 격자 진동(phonon) 또는 자기적 여기(magnon/paramagnon)와 연관되어 있는지에 대한 추가적인 이론적·실험적 검증이 필요합니다.", "future_work": "온도 변화에 따른 갭의 진화 및 자기장 하에서의 STS 연구를 통해 이 물질의 갭 구조를 더 확실히 규명할 예정입니다.", "concepts": [{"term": "니켈산염 초전도체", "why_emerged": "구리 기반 초전도체와 유사한 전자 구조를 가지면서도 희토류 원소를 활용한 새로운 초전도 메커니즘 탐색을 위해 필요.", "origin": "Li et al. (2019)에 의한 NdNiO2 등 발견 이후 급속 발전.", "connections": "큐프레이트, 강상관 전자계, 3d 전이금속 산화물."}, {"term": "STS (주사 터널링 분광)", "why_emerged": "국부적인 상태 밀도(LDOS)를 원자 단위에서 측정하여 초전도 갭과 에너지 준위를 파악하기 위해 필수적.", "origin": "Binnig & Rohrer (1982).", "connections": "터널링 현상, 고온 초전도체 연구의 표준 도구."}], "english_summary": ["STM/STS measurements on La2PrNi2O7 thin films reveal a robust superconducting gap of ~19 meV.", "The gap symmetry is consistent with s-wave pairing, supporting the s± pairing scenario.", "A bosonic mode at ~49 meV is identified, providing clues on the pairing interaction.", "This study clarifies the superconducting properties of bilayer nickelates using tip-excavation techniques."]}}, {"title": "Andreev Reflection to Probe Momentum-Dependent Spin Polarization in Altermagnet CrSb (PRL(2026))", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2606.13395", "authors": "Yan Zhang, Yixuan Luo, Yue Yang, et al.", "last_authors": "Chao Cao, Xin Lu", "summary": "arXiv:2606.13395v1 Announce Type: new Abstract: Altermagnetic materials have recently emerged as promising candidates for next-generation spintronic applications, characterized by the k-dependent spin-splitted band structure and a simultaneous zero-net-magnetization. Among them, altermagnetic candidate CrSb has attracted considerable attention, owing to its g-wave spin splitting and high N\\'eel temperature. In this article, we employed mechanical point-contact spectroscopy (MPCS) with superconducting Nb tips to probe the Andreev reflection on CrSb single crystals along three principal crystallographic orientations. The extracted momentum-dependent spin polarizations are approximately 73.4% for the (0001) plane, 67.9% for the (-1-120) plane, and 61.9% for the (10-10) plane, respectively, distinct from conventional antiferromagnets. Furthermore, conductance spectra from spatial line-scans on the sample surface support the existence of altermagnetic domains with a characteristic size of 250-500 nm separated by domain-walls with width about 250 nm. These results strongly support the momentum-dependent spin polarization in altermagnetic CrSb and establish Andreev reflection as a new paradigm to probe k-dependent spin textures.", "tier": "B_IMPORTANT_CONDMAT", "score": "9", "reason": "Direct experimental study of altermagnetic CrSb band structure using sensitive transport spectroscopy.", "tags": ["altermagnetism", "spectroscopy", "CrSb"], "image": "https://arxiv.org/html/2606.13395v1/x1.png", "briefing": {"background": "알터마그넷(Altermagnet)은 순자화가 0이면서도 k-공간에서 비대칭적인 스핀 분할을 나타내는 새로운 자기 질서 상태입니다. 이는 기존의 강자성(스핀 분극)과 반강자성(스핀 보상)의 경계를 허무는 개념으로, 차세대 스핀트로닉스 소자로 주목받고 있습니다.", "motivation": "CrSb와 같은 알터마그넷 후보 물질에서 이론적으로 예측된 k-의존적 스핀 분할 현상을 실험적으로 검증하고, 이를 스핀트로닉스 응용 가능성으로 연결하고자 하는 시도입니다.", "result": "안드레예프 반사(Andreev reflection) 분광법을 통해 CrSb의 결정 방향에 따라 다른 스핀 분극률을 확인했습니다. 또한, MPCS를 이용해 알터마그넷 도메인 구조를 가시화하여 약 250-500 nm 크기의 도메인을 관측했습니다.", "implication": "안드레예프 반사가 알터마그넷의 k-의존적 스핀 텍스처를 탐지하는 강력한 실험적 도구임을 입증했습니다.", "novelty": "이론적 예측에 머물던 알터마그넷의 스핀 분할을 실제 수송 현상에서 정량적으로 증명했다는 점에서 중요합니다. 알터마그넷은 최근 자기 위상 물질 분야의 핵심 주제로, 독자의 연구 관심사와 직접적으로 맞닿아 있습니다.", "unresolved": "실험적 결과가 알터마그넷의 고유한 g-wave 스핀 분할을 완벽하게 격리하여 측정한 것인지에 대한 해석상의 논란이 남아있을 수 있습니다.", "future_work": "다른 결정 방향에서의 스핀 분할 확인 및 도메인 벽에서의 특이한 전자 수송 현상 연구.", "concepts": [{"term": "알터마그넷", "why_emerged": "순자화가 없는 반강자성체에서도 스핀 분할이 발생할 수 있다는 새로운 대칭성 논의가 필요해 등장했습니다.", "origin": "최근 2-3년 내 이론적 논문들로부터 본격화됨.", "connections": "반강자성, 강자성, 스핀트로닉스 소자."}, {"term": "안드레예프 반사", "why_emerged": "초전도체와 금속 경계면에서 전자와 정공의 거동을 분석해 스핀 분극을 측정하기 위해 고안되었습니다.", "origin": "A. F. Andreev (1964).", "connections": "초전도성, Andreev-reflection spectroscopy."}], "english_summary": ["Experimental verification of k-dependent spin splitting in altermagnetic CrSb.", "Used mechanical point-contact spectroscopy to perform Andreev reflection analysis.", "Identified orientation-dependent spin polarizations up to ~73%.", "Mapped altermagnetic domains and walls with sub-micron resolution."]}}, {"title": "Topological quantum materials: kagome, chiral, and square-net frameworks", "journal": "npj_QuantumMaterials", "source": "Gemini", "link": "https://www.nature.com/articles/s41535-026-00902-7", "authors": "Avdhesh K. Sharma, Snehashish Chatterjee, Premakumar Yanda, Claudia Felser, Chandra Shekhar", "last_authors": "Claudia Felser, Chandra Shekhar", "summary": "  H. MacDonald, Feng Wang", "summary": "Nature, Published online: 10 June 2026; doi:10.1038/s41586-026-10636-y Macroscopic quantum coherence arises in two-component exciton Bose–Einstein condensates within MoSe2/hBN/WSe2 electron–hole bilayers, exhibiting distinct spin–valley polarized phases, quantum phase transitions under magnetic fields and stable condensate behaviour up to approximately 1.8 K.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Exciton condensates and quantum phase transitions in vdW electron-hole bilayers, highly relevant quantum materials.", "tags": ["2Dmaterials", "vanderWaalsheterostructure", "excitoncondensate", "quantumphasetransition", "magnetism"], "image": "https://media.springernature.com/m685/springer-static/image/art%3A10.1038%2Fs41586-026-10636-y/MediaObjects/41586_2026_10636_Fig1_HTML.png", "briefing": {"background": "반데르발스 이종접합 구조에서 전자와 정공을 분리하여 가두면, 이들은 쿨롱 상호작용을 통해 결합하여 엑시톤을 형성합니다. 고밀도 엑시톤 상태에서는 보즈-아인슈타인 응축(BEC)과 같은 거시적 양자 현상이 예측됩니다.", "motivation": "MoSe2/hBN/WSe2 구조의 이종접합에서 엑시톤 간의 상호작용으로 형성되는 다성분 응축 상태와 자기장에 의한 상전이 특성을 연구하고자 합니다.", "result": "이종접합에서 엑시톤 응축이 1.8 K까지 안정적으로 유지됨을 확인하고, 자기장 하에서 스핀-밸리 편극된 위상 변화를 관측했습니다.", "implication": "반데르발스 구조가 양자 응축 현상을 제어하고 관측하는 훌륭한 플랫폼임을 확인했습니다.", "novelty": "2D 물질 기반의 엑시톤 응축은 최근 강상관 전자계 연구의 핵심 테마이며, 양자 상전이 제어라는 측면에서 독자의 관심을 끌 수 있습니다.", "unresolved": "응축 상태의 미시적 구조와 다른 물리적 섭동에 대한 안정성 문제는 추가 연구가 필요합니다.", "future_work": "더 높은 온도에서의 응축 구현 및 응축물의 양자 수송 현상 탐구.", "concepts": [{"term": "엑시톤 응축", "why_emerged": "전자와 정공이 결합하여 형성하는 준입자들의 밀도가 매우 높을 때, 보손적인 성질을 이용해 하나의 양자 상태로 응축시키기 위해.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "BCS-BEC 크로스오버, 초유체, 강상관 전자계."}, {"term": "반데르발스 이종접합", "why_emerged": "원자 두께의 2D 물질들을 정밀하게 쌓아 새로운 물리적 물성을 인공적으로 설계하기 위해.", "origin": "Andre Geim et al. (2010년대 초).", "connections": "모아레 격자, 뒤틀린 이중층 그래핀."}], "english_summary": ["Observation of two-component exciton Bose-Einstein condensate in electron-hole bilayers.", "Utilized MoSe2/hBN/WSe2 heterostructure platform.", "Demonstrated stability up to 1.8 K and phase transitions under magnetic fields.", "Highlights spin-valley polarized phases in quantum condensed states."]}}, {"title": "Bilayer excitons in the Laughlin fractional quantum Hall state", "journal": "Nature_Physics", "source": "Gemini", "link": "https://www.nature.com/articles/s41567-026-03325-0", "authors": "Ron Q. Nguyen, Naiyuan J. Zhang, Navketan Khurana-Batra, et al.", "last_authors": "D. E. Feldman, J. I. A. Li", "summary": "Nature Physics, Published online: 09 June 2026; doi:10.1038/s41567-026-03325-0 Laughlin states are descriptions of the quantum Hall effect in which interactions between electrons create fractionally charged quasiparticles. Now, excitons are shown to form between these quasiparticles in a bilayer graphene device.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Investigates excitonic physics in fractional quantum Hall states in graphene devices.", "tags": ["experiment", "graphene", "fractionalquantumHall"], "image": "https://media.springernature.com/m685/springer-static/image/art%3A10.1038%2Fs41567-026-03325-0/MediaObjects/41567_2026_3325_Fig1_HTML.png", "briefing": {"background": "분수 양자 홀 효과(FQHE)는 강한 자기장 하에서 전자 간 상호작용으로 인해 분수 전하를 띤 준입자가 형성되는 현상입니다. 이 상태에서 준입자 간의 결합과 그에 따른 새로운 집단적 들뜸 상태를 이해하는 것이 응집물질물리 분야의 핵심 과제 중 하나입니다.", "motivation": "이 연구는 이중층 그래핀 소자에서 Laughlin 분수 양자 홀 상태를 구현하고, 층간 준입자들 사이의 쿨롱 상호작용이 엑시톤(exciton)과 같은 새로운 결합 상태를 형성할 수 있는지 확인하고자 했습니다.", "result": "이중층 그래핀 소자에서 분수 양자 홀 준입자들 간의 결합을 통해 엑시톤이 형성됨을 실험적으로 증명하였습니다.", "implication": "분수 양자 홀 상태에서 준입자 간의 상호작용이 단순한 도핑을 넘어 결합 상태라는 새로운 들뜸을 만들 수 있음을 시사하며, 이는 위상 양자 컴퓨터 소자 개발을 위한 새로운 물리적 단서가 될 수 있습니다.", "novelty": "이전까지 다루기 힘들었던 분수 양자 홀 준입자 간의 복합체 형성을 이중층 그래핀이라는 제어 가능한 플랫폼에서 포착했다는 점이 중요합니다.", "unresolved": "이러한 엑시톤들이 어떤 위상적 성질을 가지는지, 그리고 결합 상수나 전이 온도가 구체적으로 어떻게 결정되는지에 대한 상세한 물리량은 추가 연구가 필요합니다.", "future_work": "이 결합된 엑시톤 상태의 전기적 수송 특성 조사와 더불어, 다른 분수 홀 상태에서의 보편성 여부를 탐색할 것으로 예상됩니다.", "concepts": [{"term": "Laughlin 상태", "why_emerged": "분수 양자 홀 효과에서 발견된 전하를 띤 준입자들의 기저 상태를 파동함수로 설명하기 위해 도입되었습니다.", "origin": "Robert B. Laughlin (1983년)", "connections": "Composite Fermion 이론, Chern-Simons 게이지 이론"}, {"term": "엑시톤", "why_emerged": "물질 내에서 전자와 정공이 쿨롱 인력에 의해 결합한 전기적으로 중성인 준입자를 설명하기 위해 필요했습니다.", "origin": "Yakov Frenkel (1931년)", "connections": "반도체 광학, 엑시톤-폴라리톤, 2D 물질 광전소자"}], "english_summary": ["Realization of exciton formation between fractionally charged quasiparticles in bilayer graphene.", "Investigation performed using the Laughlin fractional quantum Hall state as a platform.", "The result demonstrates that interlayer interactions in FQH states can host complex excitonic physics."]}}, {"title": "Superconductivity on two surfaces", "journal": "Nature_Physics", "source": "Gemini", "link": "https://www.nature.com/articles/s41567-026-03290-8", "authors": "Tingxin Li", "last_authors": "Tingxin Li", "summary": "Nature Physics, Published online: 05 June 2026; doi:10.1038/s41567-026-03290-8 In rhombohedral multilayer graphene, superconductivity emerges from an unusual normal state in which electrons and holes reside on opposite surfaces of the crystal.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Explores the emergence of superconductivity in rhombohedral graphene, a significant unconventional superconductor.", "tags": ["experiment", "graphene", "superconductivity"], "image": "https://media.springernature.com/m685/springer-static/image/art%3A10.1038%2Fs41567-026-03290-8/MediaObjects/41567_2026_3290_Fig1_HTML.png", "briefing": {"background": "다층 그래핀(특히 능면체 적층) 시스템은 층간 결합과 밴드 구조의 변화를 통해 비재래적 초전도성을 구현할 수 있는 플랫폼으로 주목받고 있습니다. 표면 전도 현상이 중요한 역할을 하는 경우가 많습니다.", "motivation": "능면체 다층 그래핀에서 관찰되는 초전도성이 일반적인 금속 상태와 어떻게 다른지, 특히 전자와 정공이 분리된 표면 상태에서 기인하는 메커니즘을 밝히고자 했습니다.", "result": "능면체 다층 그래핀에서 전자와 정공이 결정의 서로 다른 표면에 위치하는 독특한 상태로부터 초전도성이 발현됨을 보고하였습니다.", "implication": "표면 상태의 비대칭성과 층간 분리 현상이 초전도 쌍 형성에 기여할 수 있음을 보여주며, 이는 위상 초전도체나 밸리 초전도성 연구의 새로운 경로를 제시합니다.", "novelty": "기존의 벌크 기반 초전도 메커니즘과 달리, 물리적으로 분리된 표면 전하들이 결합하여 초전도성을 유도한다는 점에서 흥미롭습니다.", "unresolved": "표면 전자-정공 결합이 구체적으로 어떤 인력 매개체에 의해 초전도 쌍을 형성하는지에 대한 상세 미시적 기구는 여전히 논쟁의 여지가 있습니다.", "future_work": "ARPES를 통한 표면 상태의 전자 구조 직접 관측 및 게이트 전압을 통한 초전도성 제어 연구가 이어질 것으로 보입니다.", "concepts": [{"term": "능면체 적층(Rhombohedral stacking)", "why_emerged": "그래핀의 적층 방식에 따른 밴드 구조 차이를 연구하는 과정에서 비정상적인 전도 특성을 보이기 때문입니다.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "Bernal 적층, 뒤틀린 다층 그래핀(Twisted multilayer graphene)"}, {"term": "표면 상태(Surface states)", "why_emerged": "위상 물질이나 다층 구조에서 벌크와는 다른 물리적 성질을 갖는 경계 영역을 기술하기 위해 필요합니다.", "origin": "Igor Tamm (1932년)", "connections": "위상 절연체, Rashba 효과"}], "english_summary": ["Observation of superconductivity in rhombohedral multilayer graphene.", "The superconducting state arises from an anomalous normal state with electrons and holes on opposite surfaces.", "This highlights the potential of surface-mediated superconductivity in vdW systems."]}}, {"title": "Anisotropic marginal Fermi liquid for Coulomb interacting generalized Weyl fermions", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/29kr-d5dh", "authors": "Gabriel Malavé, Rodrigo Soto-Garrido, Bitan Roy, Vladimir Juričić", "last_authors": "Bitan Roy, Vladimir Juričić", "summary": "Author(s): Gabriel Malavé, Rodrigo Soto-Garrido, Bitan Roy, and Vladimir Juričić Owing to a power-law anisotropy in the quasiparticle dispersion, yielding an enhanced density of states, the effects of long-range Coulomb interaction get amplified in three-dimensional generalized Weyl semimetals, characterized by integer monopole charge $n>1$ of the underlying Weyl nodes. Using… [Phys. Rev. B 113, L241110] Published Mon Jun 08, 2026", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Strong connection to Weyl semimetals and correlated electronic structure.", "tags": ["Weyl", "Fermiliquid", "theory"], "image": "", "briefing": {"background": "Weyl 반금속은 점 노드(Weyl node) 주변의 선형 분산 관계를 특징으로 하며, 상호작용이 강해질 경우 페르미 액체 이론이 붕괴하고 비전형적인 상태가 나타날 수 있습니다.", "motivation": "기존의 Weyl 반금속 연구는 주로 선형 분산 관계에 집중했으나, 노드 구조에 따라 쿨롱 상호작용이 증폭될 수 있는 '일반화된 Weyl 페르미온' 체계에서 전자 상관관계의 효과를 탐구하고자 했습니다.", "result": "이방성 분산 관계와 높은 노드 전하(n>1)를 가진 시스템에서 쿨롱 상호작용이 증폭되어, 에너지가 커짐에 따라 보정된 이방성 marginal 페르미 액체 상태가 형성됨을 이론적으로 보였습니다.", "implication": "강상관 Weyl 계에서 쿨롱 상호작용이 전자 상태를 어떻게 재구성하는지 체계화했으며, 이는 비평형 상태나 위상 전이 연구의 기반이 됩니다.", "novelty": "단순한 Weyl 반금속을 넘어, 더 복잡한 노드 구조에서의 상호작용 효과를 이론적으로 정밀하게 분석했다는 점이 연구자의 관심사와 부합합니다.", "unresolved": "해당 이론적 예측을 실제 실험적(ARPES 등)으로 검증하기 위해서는 특정 물질에서의 에너지 의존적인 밴드 왜곡을 정밀하게 관측해야 합니다.", "future_work": "이방성 밴드 구조를 가진 후보 물질군에서의 RIXS나 ARPES를 이용한 자체 에너지(self-energy) 측정 및 쿨롱 상호작용 효과의 직접적 확인.", "concepts": [{"term": "Marginal Fermi liquid", "why_emerged": "구리 산화물 초전도체 등 강상관 시스템에서 표준 페르미 액체 이론으로 설명되지 않는 산란 특성을 설명하기 위해 제안되었습니다.", "origin": "Varma et al. (1989년)", "connections": "비전형적인 금속성, 비-페르미 액체, 퀀텀 임계점"}, {"term": "Weyl 반금속", "why_emerged": "위상적으로 보호된 노드점을 가진 전도체를 이해하고, 이상 홀 효과 등 응용성을 탐색하기 위해 필요합니다.", "origin": "Wan et al. (2011년) 제안 및 2015년 실험 관측", "connections": "위상 절연체, 카이랄 아노말리"}], "english_summary": ["Theoretical study on generalized Weyl semimetals with integer monopole charge n>1.", "Long-range Coulomb interactions are amplified due to anisotropic quasiparticle dispersion.", "The system exhibits an anisotropic marginal Fermi liquid behavior."]}}, {"title": "Charge density wave and superconducting states of La3Co4Sn13 under uniaxial pressure", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/k8pg-lrm8", "authors": "F. B. Carneiro, A. R. C. Gonzaga, C. Girod, G. S. Freitas, W. Simeth, P. G. Pagliuso, F. Ronning, P. F. S. Rosa, E. M. Bittar, and S. M. Thomas", "last_authors": "F. Ronning, P. F. S. Rosa, E. M. Bittar, and S. M. Thomas", "summary": "Author(s): F. B. Carneiro, A. R. C. Gonzaga, C. Girod, G. S. Freitas, W. Simeth, P. G. Pagliuso, F. Ronning, P. F. S. Rosa, E. M. Bittar, and S. M. Thomas The Remeika stannides (${R}_{3}{\\mathrm{T}}_{4}{\\mathrm{Sn}}_{13}$, wi rtical potential engineering in designing quantum-confined states, thereby advancing control over electronic properties and quantum phenomena at the nanoscale.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Experimental surface science exploring quantum confinement of surface electrons and electronic states.", "tags": ["surfacescience", "quantumconfinement", "electronicstructure", "metal-organicnetwork", "experiment"], "image": "", "briefing": {"background": "표면 전자 상태(Shockley 상태 등)는 표면의 전위 환경에 민감하게 반응합니다. 저차원 나노 구조에서 전자 상태를 설계하여 양자 소자를 구현하려는 노력이 활발합니다.", "motivation": "금속-유기물 네트워크(MON) 상에서 표면 전자의 수직적 제한(Quantum Confinement)이 전자 구조에 어떤 영향을 미치는지 정밀하게 규명하고자 했습니다.", "result": "Shockley 표면 상태와 이미지-포텐셜 상태가 MON의 수직적 전위 분포(분자 골격의 척력 및 Cu 배위 부위의 누설 채널)에 따라 다르게 반응함을 발견했습니다.", "implication": "표면 전자의 유효 질량(effective mass)을 수직적 전위 엔지니어링을 통해 제어할 수 있음을 보여주었으며, 나노 구조 설계의 정밀도를 높였습니다.", "novelty": "수직적 전위가 표면 전자 제한에 미치는 역할을 구체적인 물질 모델(Cu-T4PT/Cu(111))로 분석하여 제시했습니다. ARPES를 통한 전자 구조 연구자들에게 전위 설계의 중요성을 시사합니다.", "unresolved": "더 복잡한 다층 나노 구조나 이종 접합에서의 동역학적 거동은 여전히 미지수입니다.", "future_work": "다양한 분자 네트워크를 활용한 전자 밴드 엔지니어링 및 STM 기반의 국소적 전자 상태 제어 실험.", "concepts": [{"term": "Shockley 표면 상태", "why_emerged": "금속 표면의 주기적 퍼텐셜이 끊기면서 발생하는 전자 상태를 설명하기 위해 필요합니다.", "origin": "William Shockley (1939).", "connections": "표면 전자 가스, 고체 표면 물리학."}, {"term": "이미지-포텐셜 상태", "why_emerged": "표면 외부의 정전기적 유도 전하와 전자 사이의 인력으로 형성되는 상태를 이해하기 위해 필요합니다.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "광전자 분광법(PES), 고에너지 물리."}], "english_summary": ["Investigates vertical potential engineering in quantum confinement of surface electrons.", "Compares Shockley states and image-potential states on a Cu-T4PT/Cu(111) network.", "Reveals mass renormalization differences due to the 3D potential landscape.", "Demonstrates precise control over electronic properties via vertical structure manipulation."]}}, {"title": "Decoding Crystallographic Surface Chirality with Machine Learning: From Atomic Geometry to Fermi Surface Projections", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2606.13144", "authors": "Chetana Badala Viswanatha, Ka Man Yu, Benito Arnoldi, et al.", "last_authors": "Benjamin Stadtm\\\"uller, S. Harshini Tekur", "summary": "arXiv:2606.13144v1 Announce Type: new Abstract: Intrinsically chiral metal surfaces, where handedness arises from the asymmetric step-kink-terrace topology of high-Miller-index planes, are model systems for enantiospecific catalysis, sensing, and spintronics. Yet, no consistent method exists to classify their handedness directly from experimental observables. We report a dual-domain machine learning framework that decodes crystallographic surface chirality from two independent image representations: atomic structure models in real space and simulated momentum-resolved photoemission maps of the Fermi surface projections in reciprocal space. ResNet18, a deep convolutional neural network, fine-tuned on a database of labeled images achieves ~73% classification accuracy on atomic models and ~99% on Fermi surface projections. We show that the latter transfers directly to synchrotron-acquired experimental images after fine-tuning on just two labeled frames. We identify a working correspondence between the two representations: just as the kink site geometry fixes the orientation of crystallographic planes in real space, the surface normal position in a momentum-resolved photoemission map anchors the orientation of the Fermi surface polygons in reciprocal space. It is precisely this relative orientation that encodes handedness into the map topology with high accuracy. The pronounced difference in accuracy shows that handedness is more readily recovered from the momentum-space electronic pattern than from the local atomic geometry of the kinked surface. This finding has direct implications for the disorder resilience of geometric chiral-induced spin selectivity (CISS) at realistic metal surfaces.", "tier": "B_IMPORTANT_CON bertsmithite, relevant to quantum magnetism interests.", "tags": ["experiment", "herbertsmithite", "spinliquid"], "image": "https://media.springernature.com/m685/springer-static/image/art%3A10.1038%2Fs41567-026-03303-6/MediaObjects/41567_2026_3303_Fig1_HTML.png", "briefing": {"background": "양자 스핀 액체(QSL)는 절대영도에서도 자기적 질서가 사라진 양자 얽힘 상태로, 오랫동안 응집물질 물리학의 난제였음.", "motivation": "기존의 산란 실험 등으로 결론짓지 못한 허버트스미사이트(herbertsmithite)의 스핀 액체 상태를 불순물 스핀을 활용한 국소적 탐침을 통해 확인하고자 함.", "result": "불순물 스핀의 동역학이 스핀 액체 호스트의 스핀온(spinon)에 의해 매개됨을 관측하여 QSL 증거를 제시함.", "implication": "스핀 액체 내의 기본 여기체인 스핀온의 존재를 간접적으로나마 실험적으로 뒷받침할 수 있는 강력한 도구를 확보함.", "novelty": "물질 내부의 고유한 스핀 액체 상태를 불순물 스핀이라는 외부 probe를 통해 동역학적으로 추적했다는 점이 혁신적임.", "unresolved": "관측된 동역학이 다른 불순물 효과나 격자 결함과 어떻게 명확히 구분되는지에 대한 검증이 필요함.", "future_work": "다양한 불순물 농도에서의 실험 및 스핀온 밴드 구조와 관련된 추가적인 수치 해석.", "concepts": [{"term": "Spin liquid", "why_emerged": "강한 양자 요동으로 인해 자기 질서가 억제된 상을 설명하기 위해 도입.", "origin": "Anderson(1973)이 제안.", "connections": "고온 초전도체, 얽힘 상태, 위상적 차수."}, {"term": "Spinon", "why_emerged": "S=1/2 스핀 시스템의 분수화된 여기를 설명하기 위해 필요.", "origin": "Anderson(1987)의 RVB 이론에서 구체화.", "connections": "분수 양자 홀 효과, 1D 스핀 사슬."}], "english_summary": ["Herbertsmithite is investigated as a candidate for the quantum spin liquid ground state.", "Impurity spins are utilized as local probes to detect the underlying magnetic dynamics.", "Spinon-mediated dynamics are identified, providing strong evidence for the spin liquid phase."]}}, {"title": "Carrier-doping effect and anomalous transport properties in Ni-doped CeCoIn5 investigated by Hall resistivity measurements", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/m2rg-symc", "authors": "Ryosuke Koizumi, Hayao Fujimoto, Teppei Takahashi, et al.", "last_authors": "Kenichi Tenya, Makoto Yokoyama", "summary": "Author(s): Ryosuke Koizumi, Hayao Fujimoto, Teppei Takahashi, Azumi Yashiro, Haruna Kawakami, Kazuki Ishii, Hinako Kosaka, Takeshi Hasegawa, Yusei Shimizu, Ai Nakamura, Dai Aoki, Kenichi Tenya, and Makoto Yokoyama We investigated the effects of Ni doping on carrier density and anomalous electrical transport properties in ${\\mathrm{CeCo}}_{1−x}{\\mathrm{Ni}}_{x}{\\mathrm{In}}_{5}$ $(x≤0.3)$ by performing Hall resistivity measurements. The carrier density, estimated from the Hall coefficient ${R}_{\\mathrm{H}}$ at… [Phys. Rev. B 113, 224514] Published Tue Jun 09, 2026", "tier": "B_IMPORTANT_CONDMAT", "score": "7", "reason": "Important transport study on a heavy-fermion system of interest to the user.", "tags": ["transport", "heavy-fermion"], "image": "", "briefing": {"background": "CeCoIn5는 전형적인 중페르미온 초전도체로, 전하 운반자 농도와 자기적 질서의 상관관계를 이해하는 것이 이 분야의 핵심임.", "motivation": "Ni 도핑을 통해 CeCoIn5의 캐리어 밀도 변화를 유도하고, 이것이 수송 성질 및 이상(anomalous) 특성에 미치는 영향을 체계적으로 조사하고자 함.", "result": "Ni 도핑량에 따른 홀 계수 변화를 통해 캐리어 밀도의 정량적 변화와 수송 현상의 이상 거동을 관측함.", "implication": "중페르미온 화합물에서 불순물에 의한 캐리어 농도 제어가 어떻게 전자 상관관계를 재구성하는지 이해하는 데 기여함.", "novelty": "Hall 효과 측정을 통해 CeCoIn5 시스템의 전하 수송 특성을 도핑 의존성 관점에서 정밀하게 분석함.", "unresolved": "Ni 도핑이 단순히 캐리어 농도만 바꾸는 것인지, 아니면 d-전자 궤도의 국소적 모멘트에 미치는 영향이 큰지에 대한 구분.", "future_work": "도핑된 샘플에 대한 ARPES를 통한 밴드 구조 변화 직접 관측 및 자기 저항 데이터와의 비교.", "concepts": [{"term": "Heavy-fermion", "why_emerged": "f-전자와 전도 전자의 혼성화로 유효 질량이 매우 커지는 현상을 설명하기 위해 도입.", "origin": "Steglich et al.(1979)의 CeCu2Si2 발견 이후 정립.", "connections": "콘도 격자, 비전통적 초전도, 양자 임계점."}, {"term": "Hall coefficient", "why_emerged": "물질 내 운반자의 부호와 밀도를 측정하기 위한 표준 도구.", "origin": "Edwin Hall(1879)이 발견.", "connections": "밴드 구조, 페르미 표면, 이상 홀 효과."}], "english_summary": ["The carrier-doping effect in Ni-doped CeCoIn5 is investigated via Hall resistivity.", "The study maps out the change in carrier density with Ni concentration.", "Anomalous transport properties are linked to the modification of the electronic state in this heavy-fermion system."]}}, {"title": "Dirac quantum criticality in twisted double bilayer transition metal dichalcogenides", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/lr2x-nnks", "authors": "Jan Biedermann, Lukas Janssen", "last_authors": "Jan Biedermann, Lukas Janssen", "summary": "Author(s): Jan Biedermann and Lukas Janssen Quantum criticality involving Dirac fermions has long been studied theoretically but has remained difficult to access experimentally. Here, the authors predict that twisted double bilayer transition metal dichalcogenides, such as WSe 2 , host a Dirac quantum critical point accessible by tuning the twist angle or applying uniaxial pressure. The semimetal-to-insulator transition is continuous and governed by Gross-Neveu-Heisenberg criticality with emergent Lorentz symmetry. [Phys. Rev. B 113, 245123] Published Thu Jun 11, 2026", "tier": "B_IMPORTANT_CONDMAT", "score": "7", "reason": "Topical study on quantum criticality in twisted TMDs, relevant to moire systems.", "tags": ["quantum-criticality", "moire", "TMD"], "image": "", "briefing": {"background": "모아레 시스템에서의 양자 임계 현상은 강상관 전자계 물리학의 핵심 주제로, 위상적 특성과 강한 전자 상호작용이 결합된 독특한 상태를 탐구합니다.", "motivation": "이론적으로 예측되어 온 디락 페르미온의 양자 임계점이 트위스티드 이중층 TMD(WSe2) 시스템에서 실현 가능한지, 그리고 외부 파라미터(트위스트 각도, 압력)로 제어 가능한지 확인하고자 합니다.", "result": "트위스트 각도와 단축 압력을 조정함으로써 반금속-절연체 상전이가 발생하는 디락 양자 임계점을 포착했으며, 이는 Gross-Neveu-Heisenberg 임계성 및 창발적 로런츠 대칭성을 따름을 보였습니다.", "implication": "트위스티드 TMD 플랫폼이 고도로 조절 가능한 양자 임계 현상을 연구할 수 있는 실험적 테스트베드가 될 수 있음을 시사합니다.", "novelty": "실험적으로 접근하기 어려웠던 디락 양자 임계점을 구체적인 물질 플랫폼(WSe2 모아레)에서 구현 가능성을 제시했다는 점에서 독자(ARPES/강상관 연구자)에게 관련 물질의 전자구조 변화를 이해하는 통찰을 줍니다.", "unresolved": "실제 실험에서의 샘플 불균질성이나 국소적인 도메인 형성 등 교란 요소가 이론적 예측치와 얼마나 차이를 만들지는 명확하지 않습니다.", "future_work": "실제 WSe2 시료에서 압력을 가하며 전기 전도도나 ARPES를 통해 임계 거동의 발산을 측정하는 후속 실험이 필요합니다.", "concepts": [{"term": "Gross-Neveu-Heisenberg 임계성", "why_emerged": "상호작용하는 페르미온 시스템에서 페르미온과 보존 장이 결합하여 일어나는 양자 상전이의 보편적 거동을 기술하기 위해 도입되었습니다.", "origin": "Gross and Neveu (1974)가 처음 제안하였습니다.", "connections": "디락 물질의 양자 상전이 이론, 위상 절연체 연구와 연결됩니다."}, {"term": "모아레 시스템(Moire Systems)", "why_emerged": "두 층의 격자 부정합이나 회전 각도를 통해 인공적인 초격자 퍼텐셜을 생성하여 전자 구조를 극적으로 변화시키기 위해 필요합니다.", "origin": "Bistritzer and MacDonald (2011) 등에 의해 초기 연구가 활발해졌습니다.", "connections": "트위스티드 이중층 그래핀, 초전도성, 상관 물리학."}], "english_summary": ["The authors theoretically explore quantum criticality in twisted double bilayer WSe2.", "The system exhibits a continuous semimetal-to-insulator transition tuned by twist angle and pressure.", "The transition is characterized by Gross-Neveu-Heisenberg criticality and emergent Lorentz symmetry.", "This provides a potential experimental platform for studying Dirac fermions in moire systems."]}}, {"title": "Dynamics and pinning for skyrmions in altermagnets", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/vplq-sd5k", "authors": "J. C. Bellizotti Souza, C. J. O. Reichhardt, A. Saxena, and C. Reichhardt", "last_authors": "J. C. Bellizotti Souza, C. J. O. Reichhardt, A. Saxena, and C. Reichhardt", "summary": "Author(s): J. C. Bellizotti Souza, C. J. O. Reichhardt, A. Saxena, and C. Reichhardt We examine the dynamics, Hall angle, and pinning for Néel skyrmions in an altermagnet. Using an atomistic model, we show that skyrmion velocity and Hall angle dependence are anisotropic with respect to the direction of the drive, due to the fourfold symmetry implied by the two sublattices of the alt… [Phys. Rev. B 113, 224424] Published Wed Jun 10, 2026", "tier": "B_IMPORTANT_CONDMAT", "score": "7", "reason": "Directly links altermagnetism to magnetic texture dynamics.", "tags": ["altermagnet", "skyrmions"], "image": "", "briefing": {"background": "알터마그넷(Altermagnet)은 기존의 강자성이나 반강자성과는 다른 대칭성을 가진 새로운 자기적 상태로, 최근 스핀트로닉스 분야에서 매우 주목받는 물질입니다.", "motivation": "알터마그넷의 고유한 4회 대칭성과 격자 구조가 그 내부에 존재하는 스카이뮴의 동역학적 특성(속도, 홀 각도 등)에 어떤 비등방성 영향을 미치는지 분석하고자 합니다.", "result": "알터마그넷의 두 부격자 대칭성에서 기인하는 4회 대칭성 때문에, 스카이뮴의 구동 방향에 따라 속도와 홀 각도가 강한 비등방성을 나타냄을 확인했습니다.", "implication": "알터마그넷을 활용한 스핀 소자 설계 시, 외부 구동에 따른 자기 텍스처의 제어가 방향 의존적임을 고려해야 함을 의미합니다.", "novelty  "score": "7", "reason": "ARPES study of quantum well states; directly relevant technique.", "tags": ["ARPES", "electronicstructure"], "image": "", "briefing": {"background": "금속 박막/반도체 계면에서의 전자 구조는 박막 두께에 따른 양자 크기 효과(Quantum Size Effect)를 관찰할 수 있는 중요한 시스템입니다.", "motivation": "Si(111) 기판 위에 성장한 인듐(In) 박막의 전자 구조를 ARPES를 통해 규명하고, 계면에서의 양자 우물 상태(QWS)와 Si 공간 전하층의 서브밴드를 분석하고자 합니다.", "result": "In 5sp 전자로부터 유래한 양자 우물 상태 밴드를 0~3.4 eV 에너지 범위에서 관측했으며, 박막 두께에 따른 에너지 변화가 잘 일치함을 확인했습니다.", "implication": "계면의 전자적 결합 방식을 이해함으로써 박막 소자의 전자 구조를 세밀하게 제어할 수 있는 기반을 제공합니다.", "novelty": "독자가 선호하는 ARPES 기법을 사용하여 계면의 전자 상태를 직접 시각화했으며, 특히 실리콘 기판과의 전자적 상호작용을 상세히 기술했습니다.", "unresolved": "계면에서의 원자 수준의 결합 구조가 매끄럽지 않을 때 발생하는 산란 현상에 대한 세부적인 해석이 부족할 수 있습니다.", "future_work": "다른 금속/반도체 계면으로 연구를 확장하거나, 외부 게이트 전압을 이용한 밴드 튜닝 실험이 가능합니다.", "concepts": [{"term": "양자 우물 상태(QWS)", "why_emerged": "박막 두께가 전자 파장과 비슷해질 때 전자 상태가 2차원적으로 한정되면서 에너지가 불연속화되는 현상을 설명하기 위해 필요합니다.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "2D 물질, 계면 물리학, 박막 전자소자."}, {"term": "ARPES", "why_emerged": "고체 물질 내부의 에너지-운동량 관계(밴드 구조)를 직접 측정하기 위해 광전 효과를 활용하는 기술입니다.", "origin": "1960년대 광전 효과 연구에서 출발하여 90년대 이후 크게 발전했습니다.", "connections": "페르미 면 측정, 위상 물질, 강상관 전자계."}], "english_summary": ["The study examines the electronic structure of In films on Si(111) using ARPES.", "Quantum well states derived from In 5sp electrons were identified between 0 and 3.4 eV.", "Energy shifts related to film thickness are consistent with theoretical models.", "The research provides insights into electronic coupling at the metal-semiconductor interface."]}}, {"title": "Excitation spectrum and low-temperature magnetism in the disordered defect-fluorite Ho2Zr2O7", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/rf1x-8swz", "authors": "P. L. Oliveira Silva, J. G. A. Ramon, Viviane Peçanha-Antonio, et al.", "last_authors": "Chun Sheng Fang, R. S. Freitas", "summary": "Author(s): P. L. Oliveira Silva, J. G. A. Ramon, Viviane P function appendLabeledText(parent, className, label, text) { if (!text) return; const el = document.createElement('p'); el.className = className; const strong = textEl('strong', '', label); el.appendChild(strong); el.append(text); parent.appendChild(el); }
function appendBriefSection(parent, title, text, wide = false) { if (!text) return; const section = document.createElement('section'); section.className = 'brief-section' + (wide ? ' wide' : ''); section.appendChild(textEl('h2', '', title)); section.appendChild(textEl('p', '', text)); parent.appendChild(section); }
function render() {
  slideEl.replaceChildren();
  if (!slides.length) { slideEl.className = 'empty'; slideEl.textContent = 'No papers passed the filters in this run.'; counterEl.textContent = '0 / 0'; prevBtn.disabled = true; nextBtn.disabled = true; return; }
  slideEl.className = 'slide';
  const r = slides[index];
  const b = r.briefing || {};
  const head = document.createElement('div');
  head.className = 'paper-head';
  if (r.image) {
    const figure = document.createElement('figure');
    figure.className = 'figure';
    const img = document.createElement('img');
    img.src = r.image; img.alt = 'Figure or article preview image'; img.loading = 'lazy'; img.referrerPolicy = 'no-referrer'; img.onerror = () => figure.remove();
    figure.appendChild(img);
    figure.appendChild(textEl('figcaption', '', 'Figure / article preview image from the source page'));
    head.appendChild(figure);
  }
  const headText = document.createElement('div');
  headText.className = 'head-text';
  const badges = document.createElement('div');
  badges.className = 'badges';
  if (r.score) badges.appendChild(textEl('span', 'badge score', `${r.score}/10`));
  if (r.tier) badges.appendChild(textEl('span', 'badge', r.tier));
  if (r.journal) badges.appendChild(textEl('span', 'badge', r.journal));
  if (r.source) badges.appendChild(textEl('span', 'badge', r.source));
  headText.appendChild(badges);
  const title = document.createElement('h1');
  if (r.link) { const titleLink = document.createElement('a'); titleLink.href = r.link; titleLink.target = '_blank'; titleLink.rel = 'noopener noreferrer'; titleLink.textContent = r.title || ''; title.appendChild(titleLink); }
  else { title.textContent = r.title || ''; }
  headText.appendChild(title);
  headText.appendChild(textEl('p', 'meta', [r.journal, r.source].filter(Boolean).join(' | ')));
  if (r.last_authors || r.authors) { const authors = document.createElement('p'); authors.className = 'authors'; if (r.last_authors) authors.append('Last authors: ' + r.last_authors); if (r.authors) authors.append((r.last_authors ? ' | ' : '') + 'Authors: ' + r.authors); headText.appendChild(authors); }
  appendLabeledText(headText, 'why', 'Filter reason: ', r.reason);
  if (r.tags && r.tags.length) { const tags = document.createElement('div'); tags.className = 'tags'; r.tags.forEach(tag => tags.appendChild(textEl('span', 'tag', '#' + tag))); headText.appendChild(tags); }
  if (r.link) { const link = document.createElement('a'); link.className = 'link'; link.href = r.link; link.target = '_blank'; link.rel = 'noopener noreferrer'; link.textContent = 'Open paper'; headText.appendChild(link); }
  head.appendChild(headText);
  if (r.summary) { const abstract = document.createElement('p'); abstract.className = 'original-abstract'; const strong = textEl('strong', '', 'Original abstract'); abstract.appendChild(strong); abstract.append(r.summary); head.appendChild(abstract); }
  slideEl.appendChild(head);
  const briefing = document.createElement('div');
  briefing.className = 'briefing';
  appendBriefSection(briefing, 'Background', b.background);
  appendBriefSection(briefing, 'Motivation', b.motivation);
  appendBriefSection(briefing, 'Result', b.result);
  appendBriefSection(briefing, 'Implication', b.implication);
  appendBriefSection(briefing, "Why it's important / Novelty", b.novelty);
  appendBriefSection(briefing, 'Unresolved Questions', b.unresolved);
  appendBriefSection(briefing, 'Expected Future Work', b.future_work);
  if (b.concepts && b.concepts.length) {
    const section = document.createElement('section');
    section.className = 'brief-section wide';
    section.appendChild(textEl('h2', '', 'Concepts / Terms'));
    const concepts = document.createElement('div');
    concepts.className = 'concepts';
    b.concepts.forEach(c => {
      const item = document.createElement('div');
      item.className = 'concept';
      item.appendChild(textEl('h3', '', c.term || 'Concept'));
      [['왜 생겼나: ', c.why_emerged], ['누가 만들었나: ', c.origin], ['연결되는 흐름: ', c.connections]].forEach(([label, text]) => { if (!text) return; const p = document.createElement('p'); const bold = textEl('b', '', label); p.appendChild(bold); p.append(text); item.appendChild(p); });
      concepts.appendChild(item);
    });
    section.appendChild(concepts);
    briefing.appendChild(section);
  }
  if (b.english_summary && b.english_summary.length) { const section = document.createElement('section'); section.className = 'brief-section wide'; section.appendChild(textEl('h2', '', 'English Summary')); const ul = document.createElement('ul'); b.english_summary.slice(0, 5).forEach(line => ul.appendChild(textEl('li', '', line))); section.appendChild(ul); briefing.appendChild(section); }
  slideEl.appendChild(briefing);
  counterEl.textContent = `${index + 1} / ${slides.length}`;
  prevBtn.disabled = index === 0;
  nextBtn.disabled = index === slides.length - 1;
}
prevBtn.addEventListener('click', () => { index = Math.max(0, index - 1); render(); });
nextBtn.addEventListener('click', () => { index = Math.min(slides.length - 1, index + 1); render(); });
document.addEventListener('keydown', event => { if (event.key === 'ArrowLeft') prevBtn.click(); if (event.key === 'ArrowRight') nextBtn.click(); });
render();
</script>
</body>
</html>
