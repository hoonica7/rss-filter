<!DOCTYPE html>
<html lang='en'>
<head>
<meta charset='UTF-8'>
<meta name='viewport' content='width=device-width, initial-scale=1.0'>
<title>Daily Paper Slideshow</title>
<style>
  :root {
    color-scheme: light;
    --bg: #f6f7f4;
    --paper: #ffffff;
    --ink: #111827;
    --muted: #64748b;
    --line: #d8ddd2;
    --accent: #176b87;
    --accent-2: #9a3412;
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; overflow: auto; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: var(--bg); color: var(--ink); }
  .shell { max-width: 1500px; min-height: 100vh; margin: 0 auto; padding: 14px 18px; display: flex; flex-direction: column; }
  .topbar { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 16px; }
  .top-actions { display: flex; align-items: center; gap: 10px; }
  .topbar a, button { border: 1px solid var(--line); border-radius: 8px; background: var(--paper); color: var(--ink); padding: 10px 14px; font-weight: 700; text-decoration: none; cursor: pointer; }
  button.primary { background: var(--accent); border-color: var(--accent); color: white; }
  button:disabled { opacity: 0.45; cursor: not-allowed; }
  .counter { color: var(--muted); font-weight: 700; }
  .slide { min-height: calc(100vh - 82px); background: var(--paper); border: 1px solid var(--line); border-radius: 10px; padding: 18px; box-shadow: 0 18px 42px rgba(15, 23, 42, 0.10); display: grid; grid-template-columns: minmax(310px, 0.86fr) minmax(0, 1.55fr); gap: 18px; overflow: visible; }
  .paper-head { min-width: 0; min-height: 0; overflow: visible; display: flex; flex-direction: column; gap: 12px; }
  .figure { margin: 0; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: #f8fafc; }
  .figure img { display: block; width: 100%; max-height: 41vh; object-fit: contain; background: white; }
  .figure figcaption { padding: 7px 10px; color: var(--muted); font-size: 12px; line-height: 1.3; }
  .head-text { display: flex; flex-direction: column; gap: 9px; min-width: 0; }
  .badges { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .badge { border-radius: 999px; padding: 5px 9px; background: #eef2ff; color: #3730a3; font-size: 12px; font-weight: 800; }
  .score { background: #fee2e2; color: #991b1b; }
  h1 { margin: 0; font-size: 25px; line-height: 1.15; letter-spacing: 0; overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
  h1 a { color: inherit; text-decoration-color: rgba(23, 107, 135, 0.35); text-decoration-thickness: 2px; text-underline-offset: 4px; }
  h1 a:hover { color: var(--accent); text-decoration-color: var(--accent); }
  .meta, .authors, .why, .abstract { font-size: 13px; line-height: 1.45; }
  .meta, .authors { color: var(--muted); }
  .why strong, .abstract strong, .authors strong { color: var(--ink); }
  .authors { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .why { border-left: 4px solid var(--accent-2); padding-left: 10px; color: #374151; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .abstract { border-top: 1px solid var(--line); padding-top: 14px; color: #374151; }
  .original-abstract { border-top: 1px solid var(--line); padding-top: 10px; color: #374151; font-size: 11.5px; line-height: 1.35; overflow-wrap: anywhere; }
  .original-abstract strong { display: block; margin-bottom: 4px; color: var(--ink); }
  .tags { display: flex; flex-wrap: wrap; gap: 8px; }
  .tag { border-radius: 999px; padding: 4px 8px; background: #f1f5f9; color: #475569; font-size: 12px; font-weight: 700; }
  .head-text > .link { display: none; }
  .briefing { min-width: 0; min-height: 0; overflow: visible; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); grid-auto-rows: minmax(0, auto); align-content: start; gap: 11px 18px; border-top: 0; padding-top: 0; }
  .brief-section { min-width: 0; }
  .brief-section.wide { grid-column: 1 / -1; }
  .brief-section h2 { margin: 0 0 4px; font-size: 14px; line-height: 1.22; color: #0f766e; letter-spacing: 0; }
  .brief-section p, .brief-section li { margin: 0; font-size: 12.5px; line-height: 1.42; color: #1f2937; overflow-wrap: anywhere; }
  .brief-section ul { margin: 0; padding-left: 20px; }
  .concepts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 9px 14px; }
  .concept { border-top: 1px solid var(--line); padding-top: 7px; }
  .concept h3 { margin: 0 0 4px; font-size: 13px; color: #7c2d12; letter-spacing: 0; }
  .concept p { margin: 2px 0 0; font-size: 11.5px; line-height: 1.35; color: #374151; overflow-wrap: anywhere; }
  .concept b { color: #111827; }
  .link { color: var(--accent); font-weight: 800; text-decoration: none; }
  .empty { padding: 48px; background: var(--paper); border: 1px solid var(--line); border-radius: 12px; color: var(--muted); }
  @media (max-width: 860px) {
    .shell { padding: 14px; }
    .topbar, .top-actions { align-items: stretch; flex-direction: column; }
    .slide, .briefing, .concepts { grid-template-columns: 1fr; }
    .slide { min-height: auto; overflow: visible; display: grid; }
    h1 { font-size: 28px; }
  }
</style>

<script>
const slides = [{"title": "Graphene lattice recoil in hard x-ray photoemission: Experiment and theory", "journal": "PRB_Recent", "source": "keyword", "link": "http://link.aps.org/doi/10.1103/s8w3-plc1", "authors": "Simone Ritarossi, Alice Apponi, Orlando Castellano, et al.", "last_authors": "Francesco Offi, Alessandro Ruocco", "summary": "Hard-x-ray C 1 s photoemission from monolayer graphene probes a regime in which nuclear recoil and intrinsic electronic asymmetry contribute on comparable energy scales to the observed spectral line shape. Here we combine experiment and modeling over the photon-energy range 0.8 – 8 keV to resolve this interplay quantitatively. A graphene-specific implementation of the Fujikawa-Takata cumulant formalism, based on an anisotropic vibrational density of states constrained by first-principles phonon calculations, captures the expected recoil scaling with photon energy and emission geometry but fails to reproduce the pronounced asymmetric tails of the measured spectra. To overcome this limitation, we introduce an explicit electronic convolution model in which a photon-energy-independent reference response, dominated by the electronic line shape and extracted from the low-recoil 0.8 keV data through a recoil-inclusive fit, is convolved with a phonon recoil kernel carrying the full dependence on photon energy and emission angle. This approach reproduces both the measured line-shape evolution and the observed peak shifts across the explored energy range without refitting the spectra at higher photon energies. The results show that recoil in graphene cannot be described by a baseline treatment in which the phonon recoil kernel is combined only with symmetric lifetime broadening, but must be treated together with the intrinsic many-body electronic response of the C 1 s line.", "tier": "A_MUST_READ", "score": "9", "reason": "title strong match: photoemission", "tags": ["photoemission", "graphene", "monolayer"], "image": "", "briefing": {"background": "하드 X-선 광전자 분광법(HAXPES)은 물질의 벌크 전자 구조를 프로빙하는 강력한 도구이지만, 높은 에너지 영역에서는 원자 핵의 반동(recoil)이 스펙트럼 라인 형태에 왜곡을 일으킵니다.", "motivation": "그래핀과 같은 가벼운 원소로 이루어진 계에서 에너지 분해능을 높이기 위해 고에너지 광원을 사용할 때, 핵 반동과 고유한 전자 비대칭성이 스펙트럼에 미치는 영향을 정량적으로 분리하고 이해하고자 함.", "result": "기존의 포논 반동 커널만으로는 그래핀의 비대칭적인 스펙트럼 꼬리를 설명할 수 없음을 밝힘. 전자 고유의 응답(많은 물체 효과)과 포논 반동을 컨볼루션하는 모델을 제안하여 측정된 라인 형태와 피크 이동을 성공적으로 재현함.", "implication": "고에너지 광전자 분광 데이터 해석 시, 단순히 포논 반동 효과만 고려하는 것은 불충분하며 전자-전자 상호작용 및 많은 물체 효과를 반드시 함께 고려해야 함을 제시.", "novelty": "Fujikawa-Takata 큐뮬런트 형식을 그래핀에 맞게 구현하고, 실험 데이터로부터 직접 추출한 비반동 전자 응답을 결합함으로써 복잡한 스펙트럼 형상을 이론적 모델링으로 성공적으로 설명함.", "unresolved": "전자 비대칭성을 유발하는 상세한 다체 물리적 기원의 완전한 모델링 및 다른 2D 재료로의 일반화 가능성.", "future_work": "다양한 탄소 기반 구조물에서의 반동 효과 분석 및 더 넓은 에너지 대역에서의 광전자 스펙트럼 보정 표준화.", "concepts": [{"term": "Hard X-ray Photoemission (HAXPES)", "why_emerged": "연 X-선은 표면 민감도가 너무 높아 벌크 정보를 얻기 어렵기에, 투과 깊이가 깊은 고에너지 X-선을 사용하여 벌크 전자 상태를 관찰하고자 등장함.", "origin": "2000년대 초반 싱크로트론 시설의 고에너지 빔라인 구축과 함께 본격적으로 정립됨.", "connections": "ARPES, 깊은 코어 준위 분광학(core-level spectroscopy)."}, {"term": "Nuclear Recoil", "why_emerged": "광전자 방출 시 광자의 운동량이 원자핵으로 전달되면서 전자 에너지 스펙트럼에 도플러 이동과 같은 왜곡이 발생하며, 이를 보정해야 정확한 결합 에너지를 측정할 수 있음.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "Mössbauer 효과, 에너지 보존 법칙."}], "english_summary": ["Investigated the interplay between nuclear recoil and electronic asymmetry in hard X-ray photoemission of monolayer graphene.", "Demonstrated that phonon recoil kernels alone are insufficient to model the spectral line shape.", "Developed a convolution model incorporating intrinsic many-body electronic responses to explain energy-dependent peak shifts and asymmetries.", "The approach provides a robust framework for interpreting HAXPES data in light-element materials."]}}, {"title": "Electric field–controlled spin transport in a topological insulator interfaced with a ferroelectric antiferromagnet", "journal": "Science_Advances", "source": "author whitelist", "link": "https://www.science.org/doi/abs/10.1126/sciadv.aeh2170?af=R", "authors": "Yogesh Kumar, Pushpendra Gupta, Xinyan Li, et al.", "last_authors": "Ramamoorthy Ramesh, Sajid Husain", "summary": "Topological insulators have been explored extensively for spin-charge interconversion via magnetic interfaces, yet the true response of their spin-charge conversion, particularly in the absence of an external magnetic field, remains to be studied. Here, we report electric field control of spin-charge conversion in the topological insulator Bi 2 Te 3 with the antiferromagnetic multiferroic BiFeO 3 , using a nonlocal spin transport device. A systematic thickness dependence of the spin transport across the interface between Bi 2 Te 3 and BiFeO 3 reveals a signature of topological surface-state–dominated spin transport in the bilayer system. The spin-charge conversion remains robust for thicknesses above 10 nanometers but falls rapidly with reducing thickness and vanishes at 5 nanometers. This is consistent with hybridization-induced emergence of a trivial insulating phase, which is supported by the coherency factor estimated from the magnetoconductance of Bi 2 Te 3 . These results establish that spin-momentum–locked surface states dominate interfacial spin transport in the decoupled regime. Beyond presenting efficient spin-charge interconversion at an entirely insulating magnetic interface, this work also highlights sputter-deposited Bi 2 Te 3 as a high-quality and scalable platform for integrating quantum materials onto the devices. The nonlocal spin transport approach presented here provides a simple and unprecedented direct evidence of spin-charge conversion and opens an efficient and practical pathway toward designing energy-efficient spin-based devices.", "tier": "A_MUST_READ", "score": "9", "reason": "author whitelist: Robert J. Birgeneau", "tags": ["topologicalinsulator", "topological", "ferromagnet", "antiferromagnet", "transport"], "image": "", "briefing": {"background": "위상절연체(TI)는 표면의 스핀-운동량 잠김(spin-momentum locking) 특성으로 인해 스핀-전하 변환 소자로서 큰 기대를 받고 있으나, 외부 자기장 없이 이를 제어하는 것은 난제로 남아있음.", "motivation": "다강체인 BiFeO3(BFO)를 Bi2Te3(BT)와 접합하여, 외부 자기장 없이 전계(electric field)만으로 TI의 스핀-전하 변환 효율을 제어하고자 함.", "result": "비국소 스핀 수송 소자를 통해 BFO/BT 계면에서 스핀-전하 변환이 발생함을 확인하고, BT 두께에 따른 위상 표면 상태의 기여를 규명함. 10nm 이상에서 효율적인 변환이 일어나며 5nm 이하에서는 절연상 발현으로 사라짐을 발견.", "implication": "자기장 없이도 위상 절연체의 표면 상태를 이용한 저전력 스핀 소자 구현이 가능함을 실증함.", "novelty": "반강자성 다강체인 BFO와 TI의 계면에서 비국소 수송 측정을 통해 직접적인 스핀-전하 변환 증거를 제시하였으며, 이는 스퍼터링 공정을 통한 소자 확장이 가능함을 시사함.", "unresolved": "계면의 국소적 구조 변화가 스핀 수송에 미치는 미시적 기작과 강유전 도메인 벽의 역할.", "future_work": "더 얇은 박막에서의 위상적 보호 유지 방안 연구 및 다양한 반강자성체와의 계면 공학 연구.", "concepts": [{"term": "Spin-Momentum Locking", "why_emerged": "위상 절연체 표면 상태의 핵심 특성으로, 전자 운동량에 따라 스핀 방향이 고정되어 후방 산란이 억제됨.", "origin": "Fu, Kane, Mele 등(2007)의 위상 절연체 이론적 예측과 Hasan, Kane 등(2010)의 ARPES 실험으로 확립.", "connections": "위상 절연체, 스핀 홀 효과, Rashba 효과."}, {"term": "Nonlocal Spin Transport", "why_emerged": "국소적인 전하 수송 신호로부터 스핀 전류의 기여를 분리하여 측정하기 위해 고안됨.", "origin": "Johnson과 Silsbee(1985)에 의해 금속 스핀 수송에서 처음 입증됨.", "connections": "스핀 홀 효과 측정, 스핀 밸브."}], "english_summary": ["Achieved electric field control of spin-charge conversion in a Bi2Te3/BiFeO3 heterostructure.", "Demonstrated that spin-momentum-locked surface states dominate spin transport at the interface.", "Identified a thickness-dependent transition where the topological surface state emerges above 10 nm.", "Provides a scalable and energy-efficient platform for spintronic devices using quantum material interfaces."]}}, {"title": "Defect-nucleated charge density wave in monolayer 1H−NbSe2", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/d1k3-m1sl", "authors": "Fangjun Cheng, Xinyu Liu, Matthew Toole, et al.", "last_authors": "Badih Assaf, Xiaolong Liu", "summary": "Reduced dimensionality is generally expected to enhance charge density wave (CDW) order. However, experimental results in monolayer ${\\mathrm{NbSe}}_{2}$ appear conflicting: while optical measurements reveal CDW signatures up to 145 K on oxide substrates, scanning tunneling microscopy (STM) studies …", "tier": "B_IMPORTANT_CONDMAT", "score": "10", "reason": "STM study of CDW and monolayer materials is directly relevant to research priorities.; demoted from A: broad CM, not direct user/project hit", "tags": ["CDW", "STM", "monolayer", "NbSe2"], "image": "", "briefing": {"background": "단층 NbSe2는 대표적인 전하 밀도 파동(CDW) 물질이나, 기판과의 상호작용 및 결함이 CDW 거동에 미치는 영향에 대해 실험적 결과들이 상충되는 상황임.", "motivation": "단층 1H-NbSe2에서 결함(defect)이 CDW 핵형성(nucleation)에 미치는 역할을 STM을 통해 직접 규명하고자 함.", "result": "아직 초록의 내용이 불완전하여 전체 결과는 알 수 없으나, 결함이 CDW 발현을 매개하거나 제어할 수 있다는 가설을 검증하려는 시도로 판단됨.", "implication": "기존 연구들 간의 상충되는 결과를 해석하는 열쇠가 '결함'에 있음을 밝혀내어 2D 물질의 위상 및 상관관계 연구의 정밀도를 높일 수 있음.", "novelty": "단층 1H-NbSe2의 CDW 기원을 물리적 결함과의 연관성에서 찾아내려는 시도이며, STM을 통해 원자 단위에서 이를 규명함.", "unresolved": "결함의 종류와 밀도가 CDW의 전이 온도와 주기성에 미치는 정량적 관계.", "future_work": "결함 제어(결함 생성/제거)를 통한 CDW 상태의 인위적 조절 및 다른 TMD 물질로의 확장 연구.", "concepts": [{"term": "Charge Density Wave (CDW)", "why_emerged": "페르미 면의 네스팅(nesting) 또는 강력한 전자-포논 결합으로 인해 전하 밀도가 공간적으로 주기적인 패턴을 형성하는 상태.", "origin": "Peierls(1955)가 1D 금속 이론에서 처음 제안함.", "connections": "Peierls 전이, 페르미 면 네스팅, 초전도와의 경쟁."}, {"term": "1H-NbSe2", "why_emerged": "TMD(전이금속 디칼코게나이드) 물질 중 가장 대표적인 층상 물질로, CDW와 초전도가 공존하는 물리적 특성을 연구하기에 최적임.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "초전도성, 단층 물리, 위상 물질."}], "english_summary": ["Investigated the role of defects in nucleating charge density wave (CDW) order in monolayer 1H-NbSe2.", "Addressed conflicting experimental results regarding the CDW stability in reduced dimensions.", "Utilized scanning tunneling microscopy to correlate defect sites with CDW formation.", "Highlights the significant impact of lattice defects on the electronic order of 2D materials."]}}, {"title": "Time-reversal-symmetry-breaking spin injection from a compensated magnet", "journal": "Nature", "source": "Gemini", "link": "https://www.na resolved": "이 평탄대가 실제 위상적 상태나 저온에서의 장거리 질서(초전도, 자기적 질서)와 어떻게 구체적으로 연결되는지는 아직 명확하지 않습니다.", "future_work": "저온 환경에서의 비열 측정 및 ARPES를 통한 전자 구조의 직접적인 관찰과 이를 설명하기 위한 동역학적 평균장 이론(DMFT) 계산이 필요합니다.", "concepts": [{"term": "평탄대 (Flat band)", "why_emerged": "에너지 분산이 거의 없는 평탄대는 상태 밀도를 급격히 높여 전자 상관효과를 극대화하기 위해 필요합니다.", "origin": "Lieb 격자 모델 등에서 이론적으로 제시됨", "connections": "가고메 격자, 란다우 준위, 강한 상관계"}, {"term": "헤비 페르미온 (Heavy Fermion)", "why_emerged": "국소화된 f-전자와 전도 전자의 혼성화로 인해 유효 질량이 매우 커지는 현상을 설명하기 위해 도입되었습니다.", "origin": "1970년대 CeAl3 등에서 실험적으로 발견", "connections": "Kondo 격자 모델, 비전통적 초전도성"}], "english_summary": ["YbCr6Ge6 is identified as a new kagome heavy-fermion metal.", "The material exhibits flat bands originating from both 4f and 3d orbitals.", "Cooperative interactions between these bands significantly enhance electron correlation effects.", "This system provides a unique platform for studying the interplay between lattice geometry and localized magnetism."]}}, {"title": "Tuning the Fermi surface of MoTe2 by Nb doping", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/nqff-vzcg", "authors": "Andrew P. Weber, Iñigo Robredo, Philipp Rüßmann, et al.", "last_authors": "J. Enrique Ortega, Julen Ibañez-Azpiroz", "summary": "Ab initio calculations and angle-resolved photoemission experiments demonstrate that the bulk and surface electronic structure of Weyl semimetal candidate ${\\mathrm{MoTe}}_{2}$ changes significantly by tuning the chemical potential by less than 0.4 eV. Calculations indicate that several Lifshitz tra…", "tier": "B_IMPORTANT_CONDMAT", "score": "9", "reason": "Direct experimental ARPES study on Weyl semimetal candidate with chemical potential tuning.", "tags": ["ARPES", "Weyl", "Fermisurface"], "image": "", "briefing": {"background": "Weyl 반금속 후보 물질인 MoTe2는 위상적 성질을 띠며, 페르미 면(Fermi surface)의 미세한 변화가 위상적 상태의 발현 여부에 결정적인 영향을 미칩니다.", "motivation": "Nb 도핑을 통해 화학 퍼텐셜을 조절함으로써, MoTe2의 페르미 면 구조 변화와 그에 따른 위상적 전이를 실험적으로 제어하고 확인하고자 합니다.", "result": "0.4 eV 미만의 화학 퍼텐셜 변화만으로도 벌크 및 표면 전자 구조가 크게 변하며, Lifshitz 전이가 유도됨을 ARPES와 DFT 계산으로 입증했습니다.", "implication": "화학적 도핑을 통해 위상적 반금속의 페르미 면을 정밀하게 튜닝할 수 있으며, 이는 Weyl 노드의 위치와 위상적 성질을 제어할 수 있는 가능성을 제시합니다.", "novelty": "ARPES를 이용해 실시간으로 도핑에 따른 전자 구조 변화를 관찰했으며, 사용자 관심 분야인 Weyl semimetal의 전자 구조 튜닝 전략을 잘 보여줍니다.", "unresolved": "도핑된 Nb 원자가 위상적 전자 구조의 무질서(disorder)를 어떻게 초래하고, 이것이 위상적 상태의 견고성에 미치는 영향은 추가 연구가 필요합니다.", "future_work": "도핑 농도에 따른 비정상 홀 효과(AHE) 변화 측정 및 위상적 불변량의 직접적인 확인이 요구됩니다.", "concepts": [{"term": "Weyl 반금속", "why_emerged": "시간 반전 대칭성이나 공간 반전 대칭성이 깨진 계에서 위상적으로 안정적인 노드(node)를 가진 물질을 설명하기 위해 필요합니다.", "origin": "Herring(1937) 이론 제안, TaAs에서 첫 실험적 발견", "connections": "위상 절연체, 페르미 아크"}, {"term": "Lifshitz 전이", "why_emerged": "페르미 면의 위상학적 변화가 일어날 때 발생하는 물리적 성질의 급격한 변화를 설명하기 위해 도입되었습니다.", "origin": "I. M. Lifshitz(1960)", "connections": "전자 밀도 변화, van Hove 특이점"}], "english_summary": ["Nb doping is used to tune the Fermi surface of the Weyl semimetal candidate MoTe2.", "ARPES measurements confirm significant electronic structure changes within a small energy range.", "Calculations suggest the occurrence of Lifshitz transitions driven by chemical potential shift.", "The study demonstrates effective control over topological electronic states in transition metal dichalcogenides."]}}, {"title": "Chiral altermagnon in MnTe", "journal": "Science", "source": "Gemini", "link": "https://www.science.org/doi/abs/10.1126/science.adv3196?af=R", "authors": "Daniel Jost, Resham Babu Regmi, Eder G. Lomeli, et al.", "last_authors": "Stephan Geprägs, Matthias F. Kling", "summary": "Altermagnetism has been recognized as a magnetic phase that bridges the properties of ferro- and antiferromagnetism. The momentum-dependent spin splitting observed in these materials reflects their distinctive symmetry characteristics, which also establish the conditions for chiral magnons to emerge. Here we provide direct experimental evidence for a chiral magnon in the altermagnetic candidate manganese telluride (MnTe) revealed by circular-dichroism resonant inelastic x-ray scattering. This mode, which we term chiral altermagnon, exhibits a distinct momentum dependence of its spin polarization consistent with the altermagnetic g -wave symmetry of MnTe. Our polarization-resolved data corroborate the existence of a discrete class of magnetic excitations, demonstrating how altermagnetic order shapes spin dynamics and paving the way for advances in spintronic and quantum technologies.", "tier": "B_IMPORTANT_CONDMAT", "score": "9", "reason": "Directly relevant to altermagnetism, a core interest in the user profile.", "tags": ["altermagnetism", "magnon", "MnTe"], "image": "", "briefing": {"background": "알터자성(Altermagnetism)은 강자성과 반강자성의 특징을 모두 가지며, 시간 반전 대칭성이 깨진 상태에서 운동량에 따라 spin-splitting이 발생하는 새로운 자기적 상태입니다.", "motivation": "MnTe에서 이론적으로 예측된 알터자성 특성을 RIXS와 같은 분광학적 방법으로 직접 관찰하고, 그 물리적 근거를 찾고자 합니다.", "result": "원편광 RIXS를 사용하여 MnTe에서 운동량 의존적 스핀 편극을 보이는 '키랄 알터마그논(chiral altermagnon)'을 관찰했습니다.", "implication": "알터자성 물질이 독특한 스핀 역학을 가지고 있음을 실증했으며, 이는 고속 스핀트로닉스 소자 개발의 이론적 기반이 됩니다.", "novelty": "사용자의 핵심 관심 분야인 알터자성에서 직접적인 분광학적 증거를 제시하였으며, RIXS를 활용한 고급 자기적 여기 연구의 예시입니다.", "unresolved": "이러한 키랄 모드가 고온에서 어느 정도까지 안정적으로 유지되는지, 그리고 실제 소자 구현 시 신호의 크기는 어느 정도인지가 관건입니다.", "future_work": "다른 알터자성 물질 후보군으로의 확장 실험과 비평형 상태에서의 스핀 여기 역학 연구가 이어질 것으로 예상됩니다.", "concepts": [{"term": "알터자성 (Altermagnetism)", "why_emerged": "시간 반전 대칭성을 깨뜨리면서도 순자기모멘트가 0인 계에서 운동량에 따른 스핀 분리를 설명하기 위해 필요합니다.", "origin": "최근(2022년경) 이론적으로 정의되고 주목받음", "connections": "반강자성, 비정상 홀 효과, 스핀 분리"}, {"term": "키랄 마그논 (Chiral Magnon)", "why_emerged": "자기적 질서가 결정 구조의 대칭성과 결합하여 운동량 공간에서 특정한 회전 성질(chiral)을 띠는 여기 상태를 설명하기 위해 필요합니다.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "스핀파, RIXS, 위상적 마그논"}, {"term": "RIXS", "why_emerged": "물질 내의 전자와 자기적 여기 상태를 운동량과 에너지 분해능을 동시에 유지하며 관찰하기 위해 필요합니다.", "origin": "1970년대 제안, 싱크로트론 기술 발전으로 2000년대 이후 급성장", "connections": "비탄성 중성자 산란, 전자 상관계"}], "english_summary": ["Experimental evidence for a chiral altermagnon in MnTe is presented.", "Circular-dichroism RIXS reveals momentum-dependent spin polarization.", "The results support the existence of altermagnetic g-wave symmetry.", "This finding advances the understanding of spin dynamics in altermagnetic materials."]}}, {"title": "Subcycle videography of Landau–Zener–Majorana transitions in graphene", "journal": "Nature", "source": "Gemini", "link": "https://www.nature.com/articles/s41586-026-11214-y", "authors": "V. Eggers, G. Inzani, M. Meierhofer, et al.", "last_authors": "R. Huber, U. Höfer", "summary": "An experimental concept enabling attosecond-precision, subcycle band-structure videography covering the entire first Brillouin zone is demonstrated and used to visualize the lightwave-driven electron motion of Landau–Zener–Majorana transitions in graphene.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Experimental subcycle band-structure videography in graphene; very relevant to electronic structure and ultrafast dynamics.", "tags": ["graphene", "bandstructure", "spectroscopy"], "image": "https://media.springernature.com/m685/springer-static/image/art%3A10.1038%2Fs41586-026-11214-y/MediaObjects/41586_2026_11214_Fig1_HTML.png", "briefing": {"background": "강한 레이저장 내에서 전자 구조의 동역학을 펨토초/아토초 단위로 관찰하는 것은 고체물리학의 근본적인 목표 중 하나입니다. 특히 그래핀과 같은 반금속에서 에너지 밴드가 전자기장에 어떻게 반응하는지 이해하는 것이 중요합니다.", "motivation": "기존 분광학으로는 브릴루앙 영역 전역에 걸친 전자 전이를 아토초 단위로 실시간 관찰하는 데 한계가 있었습니다. 본 연구는 서브사이클(subcycle) 시간 분해능으로 이를 시각화하고자 했습니다.", "result": "그래핀의 Landau-Zener-Majorana 전이 과정을 실시간으로 videography(영상화)하는 데 성공하였습니다.", "implication": "강한 장 하에서 발생하는 복잡한 전자 전이 현상을 직접 관찰함으로써, 고체 내의 비평형 전자 동역학 연구에 새로운 길을 열었습니다.", "novelty": "브릴루앙 영역 전체를 아우르는 서브사이클 밴드 구조 videography 기술을 구현하여, 이론적 모델에만 의존하던 양자 전이 과정을 실험적으로 실증했습니다.", "unresolved": "매우 짧은 시간 규모의 현상이라 물질의 산란 효과나 국소적 결함이 최종 데이터에 미치는 영향은 추가 규명이 필요합니다.", "future_work": "위상 절연체나 다른 2차원 물질로 이 기술을 확장하여 위상적 성질이 레이저 구동 전이에 미치는 영향을 연구할 것으로 보입니다.", "concepts": [{"term": "Landau-Zener-Majorana 전이", "why_emerged": "두 에너지 준위가 교차하거나 근접할 때, 외부장에 의해 상태가 다른 준위로 전이되는 확률을 계산하기 위해 등장했습니다.", "origin": "Landau와 Zener가 1932년에 독립적으로 제안했습니다.", "connections": "양자 제어, 비단열 과정(adiabatic process) 연구와 밀접하게 연결됩니다."}, {"term": "아토초 분광학", "why_emerged": "전자의 운동 속도가 매우 빠르기 때문에 원자 규모의 전자 동역학을 관찰하기 위해 필수적입니다.", "origin": "2023년 노벨 물리학상 수상자들에 의해 확립되었습니다.", "connections": "광-전자 상호작용 및 비평형 고체물리학의 핵심 도구입니다."}], "english_summary": ["Demonstrates attosecond-precision subcycle band-structure videography.", "Visualizes real-time Landau–Zener–Majorana transitions in graphene.", "Covers the entire first Brillouin zone using ultrafast optical techniques.", "Provides experimental insight into light-driven electron dynamics in solids."]}}, {"title": "Thermodynamic demonstration of tetracriticality and multicomponent superconductivity in UTe2", "journal": "Nature_Physics", "source": "Gemini", "link": "https://www.nature.com/articles/s41567-026-03504-z", "authors": "Sahas Kamat, Jared Dans, Shanta Saha, et al.", "last_authors": "Jörg Schmalian, B. J. Ramshaw", "summary": "Prior measurements of the phase diagram of UTe2 contain a triple point that is forbidden by thermodynamics. Now, an additional phase boundary is discovered that resolves this problem and confirms multicomponent superconductivity in this material.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Important study on unconventional superconductivity in heavy-fermion materials.", "tags": ["superconductivity", "heavy-fermion", "UTe2"], "image": "https://media.springernature.com/m685/springer-static/image/art%3A10.1038%2Fs41567-026-03504-z/MediaObjects/41567_2026_3504_Fig1_HTML.png", "briefing": {"background": "UTe2는 시간 반전 대칭이 깨진 비전통적 초전도체 후보 물질로, 최근 몇 년간 많은 주목을 받아왔으나 그 상도(phase diagram)의 위상적 특징이 논란이었습니다.", "motivation": "기존 측정 데이터에서 관찰된 삼중점(triple point)이 열역학 법칙에 위배된다는 모순이 제기되었고, 이를 해결하기 위해 정밀한 열역학적 분석이 필요했습니다.", "result": "새로운 상 경계를 발견하여 기존 삼중점 문제를 해결하고, UTe2가 다성분 초전도체(multicomponent superconductivity)임을 확증했습니다.", "implication": "UTe2의 복잡한 초전도 상태를 이해함으로써 위상 초전도체 및 마요라나 페르미온 탐색 연구에 탄력을 받게 되었습니다.", "novelty": "열역학적 정합성을 확인하는 새로운 상 경계 발견을 통해 그동안의 논란을 종식하고 다성분 초전도체 특성을 규명했습니다.", "unresolved": "초전도 대칭성과 관련하여 여전히 미세한 물리적 기작(spin-triplet 여부 등)에 대한 논쟁이 남아있습니다.", "future_work": "저온 및 자기장 환경에서의 정밀한 CD-ARPES 등을 통해 전자 구조적 기원을 더욱 명확히 밝힐 것으로 예상됩니다.", "concepts": [{"term": "다성분 초전도체", "why_emerged": "단일 복소 파동함수가 아닌 여러 성분의 순서 매개변수(order parameter)를 가진 초전도 상태를 설명하기 위해 도입되었습니다.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "비전통적 초전도체, 특히 UTe2와 같은 중페르미온 물질에서 중요한 개념입니다."}, {"term": "테트라크리티컬리티(Tetracriticality)", "why_emerged": "4개의 상이 한 점 혹은 한 영역에서 만나는 열역학적 거동을 설명하기 위해 필요합니다.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "상전이 연구 및 위상 도표 분석의 고급 개념입니다."}], "english_summary": ["Resolves thermodynamic inconsistency in the phase diagram of UTe2.", "Identifies a new phase boundary eliminating the forbidden triple point.", "Confirms the existence of multicomponent superconductivity.", "Advances understanding of unconventional pairing in heavy-fermion systems."]}}, {"title": "Evolution of pairing correlation with 3d_z2 electron filling in a bilayer two-orbital model for La3Ni2O7", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/d5j5-tlh6", "authors": "Yufei Chen, Yang Shen, Xiangjian Qian, Guang-Ming Zhang, Mingpu Qin", "last_authors": "Guang-Ming Zhang, Mingpu Qin", "summary": "The discovery of high-${T}_{c}$ superconductivity in pressurized bilayer nickelate ${\\mathrm{La}}_{3}{\\mathrm{Ni}}_{2}{\\mathrm{O}}_{7}$ presents a new arena for exploring unconventional pairing mechanisms. A pivotal yet unresolved issue is the specific role of the $3{d}_{{z}^{2}}$ orbital of Ni. Whi…", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Important study on nickelate superconductors.", "tags": ["nickelate", "superconductivity"], "image": "", "briefing": {"background": "La3Ni2O7은 고압에서 높은 임계 온도(Tc)를 나타내며, 구리 산화물(cuprates)과 유사한 물리를 보일 것으로 기대되어 차세대 고온 초전도체 후보로 주목받고 있습니다.", "motivation": "이 물질의 핵심인 Ni 3d z2 오비탈이 초전도 페어링 메커니즘에 구체적으로 어떤 기여를 하는지에 대한 이론적 이해가 부족하여 이를 규명하고자 했습니다.", "result": "이중층(bilayer) 모델을 사용하여 3d z2 전자 충진 상태에 따른 페어링 상관관계의 변화를 계산해냈습니다.", "implication": "니켈산염 초전도체의 물리적 모델을 정교화하여 실험적 검증의 이론적 토대를 제공합니다.", "novelty": "이중층 두-오비탈 모델 내에서 3d z2 오비탈의 역할을 수치적으로 분석하여 초전도성 발현 기작을 이해하려는 노력이 돋보입니다.", "unresolved": "실제 실험상의 고압 조건에서 발생하는 미세한 구조적 변화가 모델에 완전히 반영되었는지는 여전히 의문입니다.", "future_work": "계산된 페어링 상관관계를 실험적 데이터(STS, RIXS 등)와 비교 검증하는 연구가 뒤따를 것으로 보입니다.", "concepts": [{"term": "니켈산염 초전도체", "why_emerged": "구리 산화물 외의 다른 전이금속 산화물에서 고온 초전도성을 찾기 위한 연구의 일환입니다.", "origin": "2019년 LiNiO2 계열에서 최초 보고된 이후 최근 La3Ni2O7에서 큰 성과가 나왔습니다.", "connections": "cuprates의 전자 구조와 비교 연구가 활발합니다."}, {"term": "이중층 두-오비탈 모델", "why_emerged": "La3Ni2O7의 결정 구조상 Ni 층이 두 층씩 존재하는 특성을 반영한 효과적인 계산 모델입니다.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "전이금속 산화물의 상관관계 전자 모델링 기법의 연장선입니다."}], "english_summary": ["Investigates the role of Ni 3d_z^2 orbitals in La3Ni2O7.", "Uses a bilayer two-orbital model to analyze pairing correlations.", "Clarifies the mechanism for high-Tc superconductivity in bilayer nickelates.", "Provides theoretical insights into electron filling and pairing symmetry."]}}, {"title": "Field-angle dependent spin dynamics and mode evolution in monoclinic few-layer CrI3", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/n23c-4z2n", "authors": "Manar Haouili, Hua Xu, Yan Liu", "last_authors": "Hua Xu, Yan Liu", "summary": "Few-layer ${\\mathrm{CrI}}_{3}$ exhibits thickness-dependent interlayer antiferromagnetic coupling and magnetic-field-induced spin-flip transitions. Although bilayer ${\\mathrm{CrI}}_{3}$ has been extensively studied, the spin dynamics of thicker multilayer structures remain less well understood. In t…", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Study of van der Waals magnetic materials.", "tags": ["material", "magnetic"], "image": "", "briefing": {"background": "반데르발스 자성체인 CrI3는 층 수에 따라 층간 반강자성 결합과 자기장 유도 스핀-플립 전이가 나타나 차세대 스핀트로닉스 재료로 주목받습니다.", "motivation": "이전 연구들이 주로 이중층(bilayer) 구조에 집중된 반면, 더 두꺼운 다층 구조에서의 복잡한 스핀 동역학은 충분히 규명되지 않았습니다.", "result": "단사정계(monoclinic) 소수층 CrI3에서 자기장 각도에 따른 스핀 동역학 및 모드 진화를 분석하여 다층 구조에서의 자기적 거동을 밝혀냈습니다.", "implication": "다층 구조 CrI3의 자기적 상태 제어 가능성을 입증하여, 향후 두께 및 방향 조절을 통한 스핀 소자 설계의 기반을 제공합니다.", "novelty": "이차원 자성체 연구의 핵심인 다층 구조의 두께 의존적 자기 모드 분석을 통해 저차원 자성 시스템의 이해를 확장했습니다.", "unresolved": "단사정계 격자 왜곡이 스핀 모드에 미치는 미세한 정량적 차이와 구체적인 스핀-격자 결합의 메커니즘은 여전히 추가 연구가 필요합니다.", "future_work": "다양한 두께에서의 온도 및 정밀 자기장 각도 변화에 따른 RIXS나 중성자 산란을 통한 추가 검증이 기대됩니다.", "concepts": [{"term": "반데르발스 자성체", "why_emerged": "원자층 수준에서 자기적 특성을 유지하는 물질을 통해 스핀트로닉스 소자의 소형화를 구현하기 위해 필요.", "origin": "2017년 CrI3 및 Cr2Ge2Te6에서의 장거리 자기 질서 발견(Gong et al., Huang et al.).", "connections": "2D 물질 연구, 층간 교환 상호작용, 스핀트로닉스."}, {"term": "스핀-플립 전이", "why_emerged": "강한 자기장 하에서 자기 모멘트가 정렬 방향을 바꾸는 현상을 제어하기 위해 연구됨.", "origin": "자기학 분야에서 고전적으로 확립된 현상.", "connections": "자기 이방성, 제만 효과, 반강자성."}], "english_summary": ["Investigates spin dynamics in monoclinic few-layer CrI3.", "Focuses on thickness-dependent magnetic modes and field-angle responses.", "Provides insights into spin-flip transitions in non-bilayer structures.", "Advances understanding of vdW magnetic material spin-wave physics."]}}, {"title": "Propagation and localization of spin excitations at altermagnetic domain walls", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/zgw5-99k2", "authors": "Oksana Peschanska, Jeroen van den Brink, Volodymyr P. Kravchuk", "last_authors": "Jeroen van den Brink, Volodymyr P. Kravchuk", "summary": "Altermagnets ( AMs ) are spin-compensated materials in which opposite-spin sublattices are connected by a symmetry that causes a spin splitting in their elementary excitations. As there is a strong effect of altermagnetism on domain wall properties, it is quite natural to also expect an enrichment of the physics of magnetic excitations at AM domain walls. Here, we consider the propagation of spin eigenexcitations along domain walls in easy-axial d -wave AMs . Investigating the presence of bound states localized on a domain wall, we find that the effect of the AM on the bound states strongly depends on the orientation of the domain wall relative to the crystallographic directions. If the domain wall is oriented along a nodal direction [100] or [010], AM does not change the number of bound states; however, it leads to a nonlinear dispersion and a tilt of the wavefront. The effect of AM is strongest when the domain wall is oriented along the directions [110] or [ 1 ¯ 10 ] , i.e., along the directions of the strongest AM splitting in the magnon spectrum. In this case, (i) the additional gapped bound states appear, (ii) degeneracy of the eigenstates with respect to their polarization (right-hand or left-hand precession of the Néel vector) is removed, and (iii) the localization area of the bound states strongly depends on the eigenfrequency. The latter may lead to strong localization of the bound state at the domain wall. We further consider the influence of a static magnetic field that is applied along the easy axis and find that the magnetic field induces an asymmetry between the localization regions on opposite sides of the domain wall and sets an upper limit on the absolute value of the propagating eigenstate's wave vector.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Altermagnetism is directly within profile interests.", "tags": ["altermagnetism", "magnetic"], "image": "", "briefing": {"background": "알터자성(Altermagnetism)은 시간 역전 대칭성이 깨져 있으면서도 순자화가 없는 새로운 자기적 위상으로, 전자 구조와 스핀 분극을 제어할 수 있는 물질군입니다.", "motivation": "알터자성체 내 도메인 벽(domain wall)은 고유한 자기적 대칭성을 가지고 있어, 여기서 발생하는 스핀 여기(magnon)의 거동을 이해하는 것이 중요합니다.", "result": "d-파 알터자성체의 도메인 벽 방향에 따라 스핀 여기의 속박 상태(bound states)와 분산 관계가 크게 달라짐을 확인했습니다.", "implication": "알터자성체에서의 스핀파 전파를 도메인 벽 설계를 통해 선택적으로 제어할 수 있는 물리적 기초를 마련했습니다.", "novelty": "알터자성 특유의 비균일한 스핀 분극이 자기 도메인 벽의 토폴로지와 결합하여 비선형적인 스핀 여기를 생성한다는 점을 명확히 함.", "unresolved": "실제 실험적으로 도메인 벽 위치를 나노미터 수준에서 정밀하게 고정하고 스핀 여기를 검출하는 기술적 한계가 존재합니다.", "future_work": "도메인 벽을 활용한 마그논 트랜지스터나 알터자성 소자의 논리 연산 장치 구현 가능성 탐색.", "concepts": [{"term": "알터자성(Altermagnetism)", "why_emerged": "기존의 강자성과 반강자성 분류를 넘어, 결정 대칭성을 통해 자화 없이도 스핀 분리된 밴드를 가지는 물질군이 필요.", "origin": "최근 2020년대 초반 이론적 정립(Šmejkal et al.).", "connections": "상대론적 스핀 분할, 비공선형 자성, 스핀트로닉스."}, {"term": "마그논(Magnon)", "why_emerged": "자기체 내부의 스핀 집단 여기를 입자 형태로 기술하기 위해 도입.", "origin": "Bloch (1930년) 등에 의해 제안.", "connections": "스핀파, 비탄성 중성자 산란, 열전도."}], "english_summary": ["Explores spin excitations at altermagnetic domain walls.", "Reveals orientation-dependent localized bound states.", "Demonstrates nonlinear dispersion in nodal directions.", "Provides a theoretical framework for controlling magnon propagation in altermagnets."]}}, {"title": "Raman spectroscopy of the van der Waals altermagnet Co1/4NbSe2", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/f173-1z4x", "authors": "Dushyanthini Balasundaram, Bishal Thapa, Resham Babu Regmi, Nirmal J. Ghimire, Igor I. Mazin, Patrick M. Vora", "last_authors": "Igor I. Mazin, Patrick M. Vora", "summary": "We investigate the influence of Co intercalation and altermagnetic order on the lattice dynamics of the layered compound ${\\mathrm{Co}}_{1/4}{\\mathrm{NbSe}}_{2}$. Polarization-resolved Raman spectroscopy, supported by density-functional theory, enables identification of six Raman-active phonons. Co …", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Experimental study of vdW altermagnet with potential relevance to CDW/NbSe3 physics.", "tags": ["altermagnet", "vanderWaals", "phonon"], "image": "", "briefing": {"background": "NbSe2 계열은 전하 밀도 파동(CDW)과 초전도 현상이 공존하는 대표적인 물질로, 여기에 자성 원소를 삽입하여 물리적 특성을 조절하는 연구가 활발합니다.", "motivation": "Co 삽입된 Co1/4NbSe2가 최근 알터자성체 후보로 부상함에 따라, 이 물질의 격자 동역학적 특성과 알터자성 질서 사이의 상관관계를 확인하고자 합니다.", "result": "편광 라만 분광법과 DFT 계산을 결합하여 Co1/4NbSe2의 주요 포논 모드를 동정하고 삽입이 격자에 미치는 영향을 파악했습니다.", "implication": "알터자성 질서와 격자 구조 간의 상호작용을 이해함으로써, vdW 물질의 기능적 제어 가능성을 확장합니다.", "novelty": "NbSe2 기반의 vdW 물질에서 알터자성 질서와 격자 진동 간의 연관성을 실험적으로 접근한 점이 핵심입니다.", "unresolved": "이 물질에서의 알터자성 발현이 CDW와 어떠한 동역학적 피드백을 주고받는지에 대해서는 추가적인 초고속 분광학 연구가 필요합니다.", "future_work": "저온 환경에서의 라만 측정 및 자기장 하에서의 포논 변화 측정을 통한 알터자성-격자 결합 강도 측정.", "concepts": [{"term": "포논(Phonon)", "why_emerged": "고체 내 원자 격자의 진동을 양자화하여 열적, 전기적 성질을 설명하기 위해 도입.", "origin": "Einstein (1907), Debye (1912) 등에 의해 현대적 기틀 마련.", "connections": "라만 분광법, 격자 동역학, 초전도."}, {"term": "층상 구조 물질(vdW 물질)", "why_emerged": "층 간 결합이 약해 박리가 쉽고 새로운 물리적 현상을 구현하기 유리하여 연구됨.", "origin": "그라핀 발견 이후 본격적으로 대두됨.", "connections": "2D 자성체, 위상 물질, 이종접합."}], "english_summary": ["Reports Raman spectroscopy on Co-intercalated NbSe2.", "Identifies six Raman-active phonon modes via polarization-resolved measurement.", "Discusses lattice dynamics in the context of altermagnetic order.", "Integrates DFT and experiment to characterize vdW altermagnet."]}}, {"title": "Transparency-controlled multiple charge transfer in superconducting junctions with local shot-noise scanning tunneling spectroscopy", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/81fz-49c6", "authors": "Yudai Sato, Maialen Ortego Larrazabal, Jian-Feng Ge, et al.", "last_authors": "Milan P. Allan, Jiasen Niu", "summary": "Charge transport in superconducting junctions at finite voltages is governed by Andreev reflections, including multiple Andreev reflections, which are processes that enable multiple charge transfer, a hallmark that shot noise can directly quantify. Since the effective charge extracted from shot-noise measurements varies with the transparency of the junction, systematic control of transparency is essential but experimentally challenging. Here, we present shot-noise scanning tunneling microscopy measurements enabled by a newly developed amplifier, allowing access to different transparency regimes. We perform shot-noise measurements on Pb(111) with tunable transparency at 2.2 K and observe that the shot noise evolves from a single-electron tunneling regime to multiple charge-transfer regimes as transparency increases. Our results are quantitatively consistent with theoretical simulations of Andreev reflections and multiple Andreev reflections for a single-channel system. These results establish junction transparency as the key parameter governing the evolution of charge transport and demonstrate that noise STM is a powerful platform for investigating microscopic charge transport mechanisms with controlled junction transparency at the atomic scale.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Scanning tunneling spectroscopy of superconducting junctions is highly relevant to STM interest.", "tags": ["STM", "superconductivity", "transport"], "image": "", "briefing": {"background": "초전도 접합에서의 전하 수송은 Andreev 반사(AR)를 통해 이루어지며, 특히 전압이 인가되었을 때 일어나는 다중 Andreev 반사(MAR)는 쿠퍼 쌍의 수송을 매개합니다. 접합부의 투과도(transparency)는 이러한 미시적 수송 과정을 결정짓는 핵심 변수입니다.", "motivation": "기존의 주사 터널링 현미경(STM) 실험에서는 접합 투과도를 정밀하게 제어하거나 그에 따른 샷 노이즈(shot noise)를 정량적으로 분석하는 것이 기술적으로 매우 어려웠습니다.", "result": "새로 개발된 고감도 증폭기를 통해 Pb(111) 접합에서 투과도를 가변적으로 제어하며 샷 노이즈를 측정했습니다. 접합 투과도 증가에 따라 단일 전자 터널링 영역에서 다중 전하 수송(MAR) 영역으로 전이되는 과정을 관찰했습니다.", "implication": "노이즈 STM이 원자 수준에서 제어된 투과도를 갖는 접합 내의 미시적 전하 수송 메커니즘을 탐구할 수 있는 강력한 도구임을 입증했습니다.", "novelty": "실시간으로 접합의 투과도를 제어하며 샷 노이즈를 측정하는 기술을 시연하여, 초전도 접합의 기본 수송 이론을 실험적으로 완벽하게 검증했습니다.", "unresolved": "단일 채널 시스템에 대한 이론적 시뮬레이션과는 일치하나, 복잡한 다채널 시스템에서의 샷 노이즈 특성은 추가 연구가 필요합니다.", "future_work": "본 기법을 활용하여 비전통적 초전도체나 위상 초전도체의 접합부에서 나타나는 특이 수송 현상을 규명하는 연구로 확장될 것입니다.", "concepts": [{"term": "Andreev 반사", "why_emerged": "금속과 초전도체의 계면에서 전자와 쿠퍼 쌍 사이의 전하 교환을 설명하기 위해 도입됨.", "origin": "A. F. Andreev, 1964.", "connections": "다중 Andreev 반사, 초전도 접합, Andreev 결합 상태."}, {"term": "샷 노이즈", "why_emerged": "전하의 양자화된 본질로 인해 발생하는 전류의 통계적 요동을 통해 수송 전하량 정보를 얻기 위함.", "origin": "W. Schottky, 1918.", "connections": "유효 전하, Fano factor, 비평형 수송."}], "english_summary": ["Shot-noise STM is used to probe charge transport in superconducting Pb(111) junctions.", "The setup allows for tunable junction transparency to observe the evolution from single-electron tunneling to multiple Andreev reflections.", "Experimental data show quantitative agreement with single-channel theoretical simulations.", "This technique provides a robust platform for investigating microscopic transport at the atomic scale."]}}, {"title": "d-wave altermagnetism and nonlinear transport in Dirac semimetals", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/kz4s-11k6", "authors": "Xin-Mei Wei, Zi-Ming Wang, Dong-Hui Xu", "last_authors": "Zi-Ming Wang, Dong-Hui Xu", "summary": "Altermagnets combine compensated collinear magnetic order with momentum-dependent spin splitting. A key question is how such spin splitting can arise from electronic interactions in a spin-degenerate Dirac semimetal and what spin-resolved transport signatures it produces. We address this issue using…", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Altermagnetism is highly relevant to current research interests in magnetic topological materials.", "tags": ["altermagnetism", "Diracsemimetals", "transport"], "image": "", "briefing": {"background": "알터마그네틱(Altermagnetic) 물질은 강자성체나 반강자성체와 구별되는 새로운 자기 정렬 상태로, 자성 격자 내에서 전하 밀도는 보상되지만 운동량 의존적 스핀 분할을 가집니다.", "motivation": "스핀이 퇴화된 Dirac 반금속 상태에서 전자 간 상호작용을 통해 어떻게 이러한 알터마그네틱 스핀 분할이 유도되는지, 그리고 이로 인해 어떤 비선형 수송 현상이 나타나는지 규명하고자 합니다.", "result": "초록 정보상 구체적인 데이터 도출값은 명시되지 않았으나, Dirac 반금속 내에서의 스핀 분할 메커니즘과 그에 따른 비선형 응답 함수를 이론적으로 모델링한 것으로 보입니다.", "implication": "알터마그네틱과 위상 반금속 사이의 물리적 연결 고리를 제시하며, 차세대 스핀트로닉스 소자 개발을 위한 이론적 토대를 제공합니다.", "novelty": "알터마그네틱 특성을 Dirac 반금속이라는 위상 물질의 맥락에서 재해석하고 비선형 수송 신호를 도출했다는 점이 핵심입니다.", "unresolved": "실제 실험적 물질 후보군에서의 검증과 구체적인 밴드 구조에서의 확인이 필요합니다.", "future_work": "ARPES를 통한 밴드 스핀 분할 확인 및 특정 물질군에서의 비선형 홀 효과나 정류 ar dichroism in second- and third-harmonic generation in the chiral topological semimetal CoSi", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/fytr-8vtm", "authors": "Yuya Ominato, Masahito Mochizuki", "last_authors": "Yuya Ominato, Masahito Mochizuki", "summary": "We theoretically investigate circular dichroism (CD) in second- and third-harmonic generation (SHG and THG) in the chiral topological semimetal CoSi. We demonstrate that both SHG and THG exhibit dichroic responses of order unity, while their robustness against spectral broadening is strikingly diffe…", "tier": "B_IMPORTANT_CONDMAT", "score": "7", "reason": "Topical study on circular dichroism and electronic structure of CoSi.", "tags": ["circulardichroism", "topologicalsemimetal", "spectroscopy"], "image": "", "briefing": {"background": "키랄 위상 반금속(chiral topological semimetal)은 대칭성으로 인해 보호되는 독특한 밴드 구조와 페르미온을 가지며, 광학적 반응을 통한 위상적 특성 검출이 활발히 연구되고 있습니다.", "motivation": "CoSi와 같은 물질에서 비선형 광학 응답(SHG, THG)이 갖는 원형 이색성(circular dichroism)이 위상적 밴드 구조의 기하학적 특성을 어떻게 반영하는지 이론적으로 규명하고자 합니다.", "result": "SHG와 THG 모두에서 1에 가까운 큰 원형 이색성이 관찰되며, 스펙트럼 폭 확장에 대한 이들의 견고성(robustness)이 서로 크게 다르다는 점을 이론적으로 보였습니다.", "implication": "비선형 광학 분광법이 위상 반금속의 밴드 기하학(베리 곡률 등)을 조사하는 민감한 도구가 될 수 있음을 시사합니다.", "novelty": "기존 선형 응답에 의존하던 CD-ARPES 등의 연구를 비선형 영역인 SHG/THG로 확장하여 위상적 성질을 탐색하는 새로운 접근 방식을 제시합니다.", "unresolved": "이론적 모델에서 가정된 스펙트럼 확장의 상세 조건이 실제 실험 환경과 완전히 일치하지 않을 수 있다는 점이 남아 있습니다.", "future_work": "실제 실험에서의 SHG/THG 측정과 이론적 예측 간의 정량적 비교 및 다른 키랄 물질들로의 적용이 필요합니다.", "concepts": [{"term": "Circular dichroism (CD)", "why_emerged": "물질의 키랄성과 위상적 성질을 빛의 편광 의존성을 통해 분해하기 위해 필요합니다.", "origin": "아라고(Arago)와 비오(Biot) 등에 의해 광학적 활성으로 발견되었으며 현대 고체물리학에서 위상적 밴드 탐지에 활용됩니다.", "connections": "CD-ARPES, 밴드 갭의 위상적 보호와 직접 연결됨."}, {"term": "Chiral topological semimetal", "why_emerged": "공간 반전 대칭이 깨진 결정 구조에서 위상적으로 보호되는 전자 상태를 연구하기 위해 등장했습니다.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "Weyl semimetal, Berry curvature, anomalous Hall effect."}, {"term": "Second-harmonic generation (SHG)", "why_emerged": "물질의 대칭성 파괴를 정밀하게 분석하기 위해 필요한 비선형 광학 도구입니다.", "origin": "Franken et al. (1961년)에 의해 실험적으로 처음 관찰되었습니다.", "connections": "비선형 분광학, 키랄성 분석, 반전 대칭 파괴 측정."}], "english_summary": ["Theoretical study of SHG and THG in chiral topological semimetal CoSi.", "Identifies order-unity circular dichroism in nonlinear optical responses.", "Reveals significant differences in robustness against spectral broadening for SHG vs THG.", "Proposes nonlinear optics as a probe for topological band geometry."]}}, {"title": "Controllable quantum spin Hall phases in Bi2Te3-family van der Waals heterobilayers", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/hl8t-qzls", "authors": "E. V. C. Lopes, P. H. Sophia, F. Crasto de Lima, and A. Fazzio", "last_authors": "E. V. C. Lopes, P. H. Sophia, F. Crasto de Lima, and A. Fazzio", "summary": "The tunability and control of topological edge/surface states are crucial for the development of new device applications. In this work, by combining first-principles calculations and Wannier-based tight-binding methods, we show the emergence of quantum spin Hall phases in van der Waals heterostructu…", "tier": "B_IMPORTANT_CONDMAT", "score": "7", "reason": "Topological phases in vdW heterostructures are highly relevant.", "tags": ["quantumspinHall", "vanderWaals", "topological"], "image": "", "briefing": {"background": "Bi2Te3 계열과 같은 위상 절연체 기반의 반데르발스 이종접합은 층간 결합과 적층 구조를 조절하여 위상적 성질을 튜닝할 수 있는 플랫폼을 제공합니다.", "motivation": "이종접합 구조에서 나타나는 양자 스핀 홀(QSH) 위상을 제어하고 그 발생 조건을 이해하고자 합니다.", "result": "제1원리 계산과 Wannier 기반 타이트 바인딩 모델을 통해 특정 반데르발스 이종접합에서 QSH 위상이 발현됨을 보였습니다.", "implication": "위상적 소자 설계를 위한 물질 공학적 가이드라인을 제공하며, 적층 설계를 통해 위상 상태를 자유롭게 제어할 가능성을 열어줍니다.", "novelty": "단일 물질을 넘어 이종접합 인터페이스에서의 위상 상 전이를 체계적으로 분석하여 새로운 위상 절연체 후보군을 제시했습니다.", "unresolved": "실제 합성된 이종접합에서의 격자 부정합(lattice mismatch)이나 결함이 QSH 위상의 안정성에 미치는 영향은 추가 확인이 필요합니다.", "future_work": "해당 이종접합의 실제 합성 및 저온 수송 현상 실험(edge state 검출)이 다음 과제입니다.", "concepts": [{"term": "Quantum spin Hall (QSH) phase", "why_emerged": "시간 반전 대칭이 유지되면서도 갭이 있는 벌크와 전도성 헬리컬 에지 상태를 분리하기 위해 등장했습니다.", "origin": "Kane과 Mele(2005년)에 의해 이론적으로 제안되었습니다.", "connections": "Topological insulators, topological protection."}, {"term": "Van der Waals heterobilayers", "why_emerged": "서로 다른 2D 물질을 쌓아 새로운 물리적 특성을 창출하거나 제어하기 위해 필요합니다.", "origin": "Geim과 Grigorieva(2013년) 등에 의해 활발히 연구되기 시작했습니다.", "connections": "Moiré systems, twisted bilayer graphene."}], "english_summary": ["Investigates quantum spin Hall phases in Bi2Te3-family vdW heterobilayers.", "Uses first-principles and Wannier-based tight-binding methods.", "Demonstrates tunability of topological states through heterostructure engineering.", "Provides a foundation for designing topological device applications."]}}, {"title": "Defect-bound excitons in topological materials", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/ybsq-j4z7", "authors": "Roni Majlin Skiff, Sivan Refaely-Abramson, Raquel Queiroz, Roni Ilan", "last_authors": "Raquel Queiroz, Roni Ilan", "summary": "Excitons, bound states of electrons and holes, are affected by the properties of the underlying band structure of a material. Defects in lattice systems may trap electronic defect states, to which an electron can be excited to form defect-bound excitons. Here, we examine the effect of band topology …", "tier": "B_IMPORTANT_CONDMAT", "score": "7", "reason": "Relevant to topological materials electronic structure.", "tags": ["topological", "electronic-structure"], "image": "", "briefing": {"background": "위상 물질에서의 밴드 구조와 결함은 전하 캐리어의 거동을 결정하며, 광학적 들뜸 상태인 엑시톤이 이와 상호작용하여 독특한 물리 현상을 보일 수 있습니다.", "motivation": "위상적 밴드 구조 내의 결함이 어떻게 결함 구속 엑시톤(defect-bound excitons)의 형성과 성질에 영향을 미치는지 규명하고자 합니다.", "result": "밴드 토폴로지가 결함 상태와 엑시톤 결합에 미치는 특수한 물리적 효과를 분석했습니다.", "implication": "위상 물질의 광전자 소자 활용 시 결함이 노이즈가 아닌 엑시톤 조절의 도구로 작용할 가능성을 보여줍니다.", "novelty": "위상적 특성과 결함 물리학을 결합하여, 단순한 결함 이상의 복잡한 준입자 상태를 이론적으로 체계화했습니다.", "unresolved": "결함의 종류나 농도에 따른 엑시톤 상태의 정량적인 변화는 아직 논의의 여지가 많습니다.", "future_work": "구체적인 위상 물질에서의 STM/STS 측정 또는 광발광(PL) 분광법을 통한 실험적 검증이 필요합니다.", "concepts": [{"term": "Exciton", "why_emerged": "절연체나 반도체 내의 전자-정공 쌍 사이의 쿨롱 상호작용을 설명하기 위해 등장했습니다.", "origin": "Frenkel(1931년)에 의해 처음 제안되었습니다.", "connections": "Electron-hole pair, band structure, optoelectronics."}, {"term": "Defect-bound state", "why_emerged": "완벽한 격자 외에 실제 결정에 존재하는 격자 결함이 국소적 전자 상태를 생성하는 과정을 이해하기 위해 필요합니다.", "origin": "고체 물리학 기초 이론에 기반함.", "connections": "Impurity states, localized electronic structures."}], "english_summary": ["Analyzes how band topology influences the formation of defect-bound excitons.", "Examines the interaction between topological band structures and lattice defects.", "Develops a theoretical framework for excitonic behavior at defect sites.", "Highlights the potential to control light-matter interaction in topological materials via defects."]}}, {"title": "Dynamical magnetism in the disordered cubic lattice material γ−Ba3CoNb2O9", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/jsvt-jc4l", "authors": "Fanjun Xu, Ralf Feyerherm, Cecilie Glittum, et al.", "last_authors": "A. T. M. Nazmul Islam, Bella Lake", "summary": "Strong disorder normally favors spin-glass freezing. Here, in contrast, the authors report an unconventional, highly fluctuating spin state in cubic γ-Ba 3 CoNb 2 O 9 with effective spin-½ moments randomly diluted to just above the percolation limit. Neutron and muon measurements, with partially overlapping time windows, surprisingly reveal persistent correlated spin fluctuations from picoseconds to microseconds—a behavior reminiscent of quantum spin liquids. Numerical calculations suggest singlet formation is important. These results show disorder can sustain dynamic spin correlations even without strong geometrical frustration.", "tier": "B_IMPORTANT_CONDMAT", "score": "7", "reason": "Interesting correlated spin liquid candidate experiment.", "tags": ["correlated", "neutron", "spin-liquid"], "image": "", "briefing": {"background": "강한 무질서(disorder)를 가진 자기 시스템에서는 일반적으로 스핀 유리(spin-glass) 상태로 동결되는 것이 일반적입니다. 본 연구는 이러한 일반적인 경향성과 달리, 무질서한 환경에서도 동적 스핀 상관관계가 유지되는 양자 스핀 액체(QSL)와 유사한 현상을 이해하고자 합니다.", "motivation": "γ-Ba3CoNb2O9 물질에서 스핀-1/2 모멘트가 임계 농도 근처에서 무작위로 희석되어 있음에도 불구하고, 왜 자기적 동결이 일어나지 않고 유동적인 스핀 상태가 유지되는지 규명하고자 합니다.", "result": "중성자 및 뮤온 실험을 통해 피코초에서 마이크로초에 이르는 넓은 시간 창에서 지속적인 스핀 요동을 발견했습니다. 수치 계산은 스핀 단일항(singlet) 형성이 이 동적 상태를 유지하는 핵심 기제임을 시사합니다.", "implication": "기하학적 좌절(geometrical frustration)이 없는 시스템에서도 무질서가 양자 역학적 상관관계를 유도할 수 있음을 보여주며, 강상관 전자계에서 무질서의 새로운 역할을 제시합니다.", "novelty": "기하학적 좌절 없이 무질서만으로 스핀 액체와 유사한 동적 상태를 구현했다는 점이 독창적입니다. 스핀 시스템의 기저 상태 탐구라는 측면에서 강상관 물리학 연구자에게 중요한 예시를 제공합니다.", "unresolved": "실험적으로 관측된 동적 상관관계가 완벽한 양자 스핀 액체인지, 혹은 단순한 스핀 단일항의 집합체인지에 대한 명확한 구분은 여전히 연구가 필요합니다.", "future_work": "더 낮은 온도에서의 비열 측정 및 고자기장 하에서의 중성자 산란 실험을 통해 자기 상태의 상세한 특성을 규명할 것으로 기대됩니다.", "concepts": [{"term": "양자 스핀 액체 (Quantum Spin Liquid)", "why_emerged": "강한 양자 요동으로 인해 절대영도에서도 스핀이 정렬되지 않고 유동적인 상태를 설명하기 위해 필요했습니다.", "origin": "P. W. Anderson이 1973년에 처음 제안하였습니다.", "connections": "고온 초전도체, 위상 물질, 양자 컴퓨팅 소자 등과 깊은 연관이 있습니다."}, {"term": "스핀 유리 (Spin Glass)", "why_emerged": "자기 모멘트가 무질서하게 배치된 시스템에서 자기적 정렬 대신 무작위로 얼어붙는 현상을 이해하기 위해 도입되었습니다.", "origin": "Edwards와 Anderson(1975), Sherrington과 Kirkpatrick(1975)에 의해 확립되었습니다.", "connections": "복잡계 물리학 및 신경망 모델과 수학적으로 연결됩니다."}], "english_summary": ["Study of γ-Ba3CoNb2O9 reveals dynamic spin fluctuations despite strong disorder.", "Neutron and muon spectroscopy demonstrate persistent correlations reminiscent of quantum spin liquids.", "Numerical analysis suggests singlet formation plays a crucial role in preventing spin freezing.", "Disorder acts as a mechanism to sustain dynamic correlations without geometrical frustration."]}}, {"title": "Flat band in the multiband metal MnSb2", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/cp97-khvn", "authors": "Carl Jonas Linnemann, Davide Ceresoli, Kim-Khuong Huynh, Martin Bremholm", "last_authors": "Kim-Khuong Huynh, Martin Bremholm", "summary": "We report the realization of a metallic flat band in the marcasite compound ${\\mathrm{MnSb}}_{2}$. The material was synthesized under high pressure, and its crystal structure was established by x-ray diffraction. Electrical and thermoelectric transport measurements reveal signatures of a flat band n…", "tier": "B_IMPORTANT_CONDMAT", "score": "7", "reason": "Identification of a flat band in a real material is highly relevant to electronic structure.", "tags": ["flatband", "electronicstructure", "transport"], "image": "", "briefing": {"background": "금속 내에서의 평탄 밴드(flat band)는 밴드 분산이 거의 없어 상태 밀도가 매우 높기 때문에, 전자 간 상호작용이 극대화되어 초전도성, 자기적 정렬, 위상적 상태 등 다양한 강상관 물리 현상을 유발하는 근원으로 주목받고 있습니다.", "motivation": "일반적인 금속의 밴드 구조와 달리 전자 상관관계가 지배적인 특정 마카사이트 구조의 MnSb2 물질에서 평탄 밴드가 존재할 가능성을 확인하고 그 물성을 조사하고자 합니다.", "result": "고압 합성된 MnSb2에서 평탄 밴드의 존재를 전자 수송 및 열전 측정 데이터를 통해 증명하였습니다.", "implication": "평탄 밴드를 가진 새로운 금속 화합물을 확보함으로써, 전이 금속 기반의 강상관 물성을 연구할 수 있는 새로운 실험 플랫폼을 제공합니다.", "novelty": "실제 재료에서 평탄 밴드의 명확한 실험적 증거를 제시했습니다. 이는 전자 구조 계산과 수송 현상을 결합하여 새로운 물질군을 발굴하는 연구자에게 중요한 통찰을 줍니다.", "unresolved": "이 평탄 밴드가 정확히 어떠한 궤도 결합에 의해 유도되는지, 그리고 이 밴드가 실제 물성(예: 자기적 성질)에 미치는 미시적인 기여도는 더 세밀한 분석이 필요합니다.", "future_work": "ARPES를 이용한 직접적인 밴드 구조 관측과 이를 뒷받침할 DFT+DMFT 계산을 통해 밴드 기원과 상관효과를 확인하는 과정이 필요합니다.", "concepts": [{"term": "평탄 밴드 (Flat Band)", "why_emerged": "운동 에너지가 억제된 전자가 강한 상호작용을 일으켜 새로운 양자 상을 나타내도록 하기 위해 필요했습니다.", "origin": "초창기 Hubbard 모델 등에서 이론적으로 제시되었습니다.", "connections": "모아레 격자 시스템(twisted bilayer graphene) 연구와 긴밀히 연결됩니다."}, {"term": "마카사이트 (Marcasite)", "why_emerged": "특정 결정 구조를 가진 화합물군의 명칭으로, 독특한 배위 환경을 제공하여 금속성 및 자기적 성질에 영향을 줍니다.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "다양한 전이 금속 황화물/텔루라이드 계열의 물리적 성질과 연결됩니다."}], "english_summary": ["Experimental identification of a metallic flat band in the marcasite compound MnSb2.", "Synthesized via high-pressure methods, showing distinct electronic signatures.", "Flat band provides a platform for studying enhanced electron correlation effects.", "Transport and thermoelectric data corroborate the presence of the localized electronic band."]}}, {"title": "Hidden valley dynamics behind vanishing circular polarization in moiré excitons", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/jtzc-x4cq", "authors": "Yuto Urano, Lata Chouhan, Nurul Fariha Ahmad, et al.", "last_authors": "Daichi Kozawa, Ryo Kitaura", "summary": "Optically addressable valley degrees of freedom in transition-metal dichalcogenide heterostructures provide a powerful platform for valleytronic and quantum-optical functionalities. In moiré superlattices, interlayer excitons inherit valley-contrasting optical selection rules while acquiring long li…", "tier": "B_IMPORTANT_CONDMAT", "score": "7", "reason": "Study of moire heterostructures is broadly relevant to the user profile.", "tags": ["moiré", "heterostructures", "excitons"], "image": "", "briefing": {"background": "반도체 이종접합(TMD heterostructures)에서의 모아레 초격자는 전자와 정공이 결합한 층간 엑시톤을 생성하며, 이는 밸리(valley) 자유도를 제어할 수 있는 차세대 양자 광학 소자로 주목받고 있습니다.", "motivation": "모아레 엑시톤에서 기대되는 밸리 분극(circular polarization)이 특정 상황에서 소멸하는 현상을 관찰하고, 그 물리적 기원을 찾고자 합니다.", "result": "모아레 잠재력(potential) 내에서 엑시톤의 역학이 밸리 편극의 소멸에 결정적인 역할을 함을 밝혀냈습니다.", "implication": "모아레 격자 내에서의 엑시톤 거동을 제어함으로써 밸리트로닉스 소자의 효율성을 높일 수 있는 설계 원리를 제공합니다.", "novelty": "모아레 격자의 구조적 요인이 어떻게 광학적 선택 규칙을 무너뜨리는지를 규명했습니다. 이는 2D 소재의 광학적 물성을 깊이 있게 이해하려는 독자에게 유익합니다.", "unresolved": "이 밸리 소멸 과정에서 발생하는 에너지가 열로 소산되는지, 혹은 다른 엑시톤 상태로 전이되는지에 대한 상세 경로는 여전히 불분명합니다.", "future_work": "초고속 분해능을 가진 분광학(ultrafast spectroscopy)을 사용하여 엑시톤의 밸리 이완 시간을 직접 추적하는 실험이 필요합니다.", "concepts": [{"term": "모아레 초격자 (Moiré Superlattice)", "why_emerged": "두 2D 물질 층을 겹쳐 격자 상수를 조절함으로써 전자의 파동함수와 에너지를 인위적으로 제어하기 위해 필요했습니다.", "origin": "그래핀 모아 troscopy probes Pr0.5Ca1.5MnO4 to disentangle lattice distortions and orbital ordering.", "Identifies the role of polaronic dressing of electronic states induced by strong electron-phonon coupling.", "Demonstrates how local short-range physics interacts with long-range orbital order on sub-picosecond timescales.", "Provides experimental insight into the dynamics of quasiparticles in correlated manganites."]}}, {"title": "Pressure-tuned flat-band instability and magnetic suppression in SmCrGe3", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/5stq-h3mj", "authors": "Wenli Bi, Cheng Peng, Francisco J. Canales, et al.", "last_authors": "Dongzhou Zhang, Weiwei Xie", "summary": "Pressure provides a clean and continuous route for tuning electronic structure and magnetic interactions in itinerant ferromagnets without introducing chemical disorder. Here, we report high-pressure structural, transport, and electronic structure studies of hexagonal ferromagnetic ${\\mathrm{SmCrGe}…", "tier": "B_IMPORTANT_CONDMAT", "score": "7", "reason": "Pressure-tuned electronic structure study.", "tags": ["electronic-structure", "material"], "image": "", "briefing": {"background": "SmCrGe3와 같은 육방정계 강자성체는 전자 구조의 변화와 자기적 상호작용 사이의 밀접한 연관성을 가지고 있으며, 압력은 화학적 도핑 없이 결정 격자를 조절할 수 있는 매우 효과적인 도구입니다.", "motivation": "압력이 SmCrGe3의 전자 구조와 자기적 불안정성에 미치는 영향을 체계적으로 조사하여 압력에 의한 강자성 억제와 플랫 밴드(flat-band) 현상의 관련성을 찾고자 합니다.", "result": "고압 하에서의 수송 현상 및 전자 구조 측정을 통해 압력 변화가 강자성 상태를 억제하며, 전자 구조의 플랫 밴드 불안정성이 이러한 물성 변화에 중요한 역할을 함을 발견했습니다.", "implication": "압력 조절이 강상관 화합물에서 전자 상태를 설계하는 강력한 방법임을 확인했으며, 특히 플랫 밴드와 자기적 차수 간의 상호작용에 대한 새로운 이해를 제공합니다.", "novelty": "SmCrGe3라는 구체적 물질 시스템에서 압력을 통해 자기적 기저 상태를 제어하고, 이 과정에서 플랫 밴드 효과가 핵심 변수로 작동함을 실험적으로 규명했습니다.", "unresolved": "압력에 따른 플랫 밴드 위치의 정밀한 에너지 변화량과 자기적 질서 소멸의 임계 압력 지점에서의 구체적인 Fermi 표면 변화는 추가 분석이 필요합니다.", "future_work": "고압 ARPES 측정이나 이론적 DFT+DMFT 계산을 통해 압력에 따른 밴드 구조의 플랫화 과정과 강자성 억제 간의 직접적인 상관관계를 규명해야 합니다.", "concepts": [{"term": "플랫 밴드 (Flat-band)", "why_emerged": "운동 에너지가 억제되어 전자 간 상호작용 효과가 극대화되는 에너지 대역을 기술하기 위해 제안됨.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "강상관 효과, 초전도성, 자기적 불안정성."}, {"term": "이동성 강자성체 (Itinerant Ferromagnet)", "why_emerged": "국소 자기 모멘트가 아닌 전도성 전자가 자기적 질서를 형성하는 시스템을 설명하기 위해 도입됨.", "origin": "Stoner model (1938년).", "connections": "Stoner 기준, 밴드 자성."}], "english_summary": ["High-pressure study on the hexagonal itinerant ferromagnet SmCrGe3.", "Investigates the evolution of structural and electronic properties under external pressure.", "Links pressure-tuned flat-band instability to the suppression of ferromagnetic order.", "Demonstrates pressure as a clean knob for tuning electronic correlations in correlated materials."]}}, {"title": "Raman circular dichroism and spinon quantum geometry of chiral quantum spin liquids", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/n6zn-xvsw", "authors": "Eduard Koller, Valentin Leeb, Natalia B. Perkins, Johannes Knolle", "last_authors": "Natalia B. Perkins, Johannes Knolle", "summary": "We show that the quantum geometry of fractionalized spin excitations in Mott-insulating quantum spin liquids (QSLs) gives rise to a finite Raman circular dichroism (RCD) signal. We identify conditions under which the Loudon-Fleury framework, where light modulates the underlying exchange interactions, and the light-matter-coupling approach, where the effective vector potential couples directly to the spinon bands, yield equivalent Raman vertices for the fractionalized quasiparticles. Using the latter, we derive an analytical decomposition of the RCD into different quantum geometric contributions. This reveals the sensitivity of the RCD to the underlying structure of the wave functions and the handedness of the excitations, rather than a nonzero Chern number of spinon excitations. To illustrate this, we apply our approach to two examples, the Kitaev honeycomb model in a magnetic field and a parton mean-field state of the chiral QSL on the triangular lattice.", "tier": "B_IMPORTANT_CONDMAT", "score": "7", "reason": "Raman spectroscopy on quantum spin liquids is a relevant experimental technique.", "tags": ["Raman", "spinliquids", "quantumgeometry"], "image": "", "briefing": {"background": "양자 스핀 액체(QSL)는 전통적인 자기 질서가 없는 복잡한 양자 얽힘 상태로, 분수화된 들뜸(spinon)의 기하학적 성질을 실험적으로 측정하는 것은 응집물질물리학의 중요한 도전 과제입니다.", "motivation": "Mott 절연체인 QSL에서 나타나는 스핀 들뜸의 양자 기하학적 성질이 라만 원형 이색성(Raman Circular Dichroism) 신호에 어떻게 투영되는지 이론적으로 체계화하고자 합니다.", "result": "라만 산란을 통해 스핀 들뜸의 양자 기하학적 구조를 추출할 수 있는 이론적 틀을 마련했습니다. 특히, RCD가 Chern 수와는 별개로 파동 함수의 구조적 특징에 민감하다는 점을 증명했습니다.", "implication": "라만 분광법이 QSL의 위상적 성질을 검증하는 강력한 도구로 활용될 수 있음을 제시하며, 향후 Kitaev 물질 등에서 스핀 들뜸을 직접적으로 탐구할 기반이 됩니다.", "novelty": "라만 산란에서 나타나는 빛-물질 상호작용의 기하학적 기여를 명확히 분리해내어, 스핀 들뜸의 기하학적 성질을 분석하는 새로운 분석법을 제시했습니다.", "unresolved": "실제 실험에서 발생하는 배경 신호나 결함에 의한 라만 산란 노이즈를 어떻게 제어할지에 대한 구체적 실험 프로토콜은 보완이 필요합니다.", "future_work": "Kitaev 후보 물질이나 삼각형 격자 QSL 후보군에 대한 정밀 편광 라만 분광 실험을 통해 제안된 RCD 신호의 관측이 필요합니다.", "concepts": [{"term": "라만 원형 이색성 (Raman Circular Dichroism)", "why_emerged": "물질의 비대칭성 및 자성 들뜸의 위상적 기하학적 정보를 편광된 빛의 산란을 통해 얻기 위해 고안됨.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "라만 산란, 편광 제어, 양자 기하학."}, {"term": "스핀온 (Spinon)", "why_emerged": "양자 스핀 액체에서 스핀 1인 들뜸이 분수화되어 나타나는 스핀 1/2의 준입자를 기술하기 위해 도입됨.", "origin": "P. W. Anderson (1973년).", "connections": "분수화, 양자 얽힘, 전하-스핀 분리."}], "english_summary": ["Provides a theoretical framework linking Raman circular dichroism to the quantum geometry of fractionalized spinons in QSLs.", "Establishes the equivalence between Loudon-Fleury framework and effective vector potential approaches for light-matter coupling.", "Shows RCD sensitivity to the wavefunction structure rather than the Chern number of spinon excitations.", "Applies the theory to Kitaev honeycomb models and triangular lattice QSLs."]}}, {"title": "Strain-enhanced superconductivity in RuO2 thin films: Joint experimental and theoretical studies", "jou   if (b.english_summary && b.english_summary.length) { const section = document.createElement('section'); section.className = 'brief-section wide'; section.appendChild(textEl('h2', '', 'English Summary')); const ul = document.createElement('ul'); b.english_summary.slice(0, 5).forEach(line => ul.appendChild(textEl('li', '', line))); section.appendChild(ul); briefing.appendChild(section); }
  slideEl.appendChild(briefing);
  counterEl.textContent = `${index + 1} / ${slides.length}`;
  prevBtn.disabled = index === 0;
  nextBtn.disabled = index === slides.length - 1;
}
prevBtn.addEventListener('click', () => { index = Math.max(0, index - 1); render(); });
nextBtn.addEventListener('click', () => { index = Math.min(slides.length - 1, index + 1); render(); });
document.addEventListener('keydown', event => { if (event.key === 'ArrowLeft') prevBtn.click(); if (event.key === 'ArrowRight') nextBtn.click(); });
render();
</script>
</body>
</html>
