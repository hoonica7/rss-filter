<title>Daily Paper Slideshow</title>
<style>
  :root {
    color-scheme: light;
    --bg: #f6f7f4;
    --paper: #ffffff;
    --ink: #111827;
    --muted: #64748b;
    --line: #d8ddd2;
    --accent: #176b87;
    --accent-2: #9a3412;
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; overflow: auto; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: var(--bg); color: var(--ink); }
  .shell { max-width: 1500px; min-height: 100vh; margin: 0 auto; padding: 14px 18px; display: flex; flex-direction: column; }
  .topbar { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 16px; }
  .top-actions { display: flex; align-items: center; gap: 10px; }
  .topbar a, button { border: 1px solid var(--line); border-radius: 8px; background: var(--paper); color: var(--ink); padding: 10px 14px; font-weight: 700; text-decoration: none; cursor: pointer; }
  button.primary { background: var(--accent); border-color: var(--accent); color: white; }
  button:disabled { opacity: 0.45; cursor: not-allowed; }
  .counter { color: var(--muted); font-weight: 700; }
  .slide { min-height: calc(100vh - 82px); background: var(--paper); border: 1px solid var(--line); border-radius: 10px; padding: 18px; box-shadow: 0 18px 42px rgba(15, 23, 42, 0.10); display: grid; grid-template-columns: minmax(310px, 0.86fr) minmax(0, 1.55fr); gap: 18px; overflow: visible; }
  .paper-head { min-width: 0; min-height: 0; overflow: visible; display: flex; flex-direction: column; gap: 12px; }
  .figure { margin: 0; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: #f8fafc; }
  .figure img { display: block; width: 100%; max-height: 41vh; object-fit: contain; background: white; }
  .figure figcaption { padding: 7px 10px; color: var(--muted); font-size: 12px; line-height: 1.3; }
  .head-text { display: flex; flex-direction: column; gap: 9px; min-width: 0; }
  .badges { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .badge { border-radius: 999px; padding: 5px 9px; background: #eef2ff; color: #3730a3; font-size: 12px; font-weight: 800; }
  .score { background: #fee2e2; color: #991b1b; }
  h1 { margin: 0; font-size: 25px; line-height: 1.15; letter-spacing: 0; overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
  h1 a { color: inherit; text-decoration-color: rgba(23, 107, 135, 0.35); text-decoration-thickness: 2px; text-underline-offset: 4px; }
  h1 a:hover { color: var(--accent); text-decoration-color: var(--accent); }
  .meta, .authors, .why, .abstract { font-size: 13px; line-height: 1.45; }
  .meta, .authors { color: var(--muted); }
  .why strong, .abstract strong, .authors strong { color: var(--ink); }
  .authors { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .why { border-left: 4px solid var(--accent-2); padding-left: 10px; color: #374151; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .abstract { border-top: 1px solid var(--line); padding-top: 14px; color: #374151; }
  .original-abstract { border-top: 1px solid var(--line); padding-top: 10px; color: #374151; font-size: 11.5px; line-height: 1.35; overflow-wrap: anywhere; }
  .original-abstract strong { display: block; margin-bottom: 4px; color: var(--ink); }
  .tags { display: flex; flex-wrap: wrap; gap: 8px; }
  .tag { border-radius: 999px; padding: 4px 8px; background: #f1f5f9; color: #475569; font-size: 12px; font-weight: 700; }
  .head-text > .link { display: none; }
  .briefing { min-width: 0; min-height: 0; overflow: visible; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); grid-auto-rows: minmax(0, auto); align-content: start; gap: 11px 18px; border-top: 0; padding-top: 0; }
  .brief-section { min-width: 0; }
  .brief-section.wide { grid-column: 1 / -1; }
  .brief-section h2 { margin: 0 0 4px; font-size: 14px; line-height: 1.22; color: #0f766e; letter-spacing: 0; }
  .brief-section p, .brief-section li { margin: 0; font-size: 12.5px; line-height: 1.42; color: #1f2937; overflow-wrap: anywhere; }
  .brief-section ul { margin: 0; padding-left: 20px; }
  .concepts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 9px 14px; }
  .concept { border-top: 1px solid var(--line); padding-top: 7px; }
  .concept h3 { margin: 0 0 4px; font-size: 13px; color: #7c2d12; letter-spacing: 0; }
  .concept p { margin: 2px 0 0; font-size: 11.5px; line-height: 1.35; color: #374151; overflow-wrap: anywhere; }
  .concept b { color: #111827; }
  .link { color: var(--accent); font-weight: 800; text-decoration: none; }
  .empty { padding: 48px; background: var(--paper); border: 1px solid var(--line); border-radius: 12px; color: var(--muted); }
  @media (max-width: 860px) {
    .shell { padding: 14px; }
    .topbar, .top-actions { align-items: stretch; flex-direction: column; }
    .slide, .briefing, .concepts { grid-template-columns: 1fr; }
    .slide { min-height: auto; overflow: visible; display: grid; }
    h1 { font-size: 28px; }
  }
</style>

ddresses the origin of spontaneous nematic magnetic torque in CsV3Sb5 above the CDW transition.", "Proposes a mechanism based on spin-orbit coupling crossover in the kagome electronic structure.", "Provides a theoretical framework to link the nematic response to electronic anisotropy.", "Suggests implications for understanding time-reversal symmetry breaking in kagome metals."]}}, {"title": "Estimating the Fisher information from ARPES in general two-band models", "journal": "arXiv_CondMat", "source": "keyword", "link": "https://arxiv.org/abs/2608.22511", "authors": "Gunnar F Lange", "last_authors": "Gunnar F Lange", "summary": "The Quantum Fisher information is frequently studied in the fields of quantum sensing and quantum metrology, as it specifies the sensitivity of a sensor through the Cr\\'amer-Rao bound, and in condensed matter physics where it relates to the quantum metric. Measuring the quantum Fisher information is therefore of significant current interest. In this work, we propose a scheme for measuring the quantum Fisher information with respect to any parameter in a general two-band solid state system using angle-resolved photoemission spectroscopy with carefully tuned incidence angles and light polarization. We investigate conditions under which this can be related back to information about the ground state of the material itself changing with system parameters.", "tier": "A_MUST_READ", "score": "10", "reason": "title strong match: ARPES", "tags": ["ARPES", "angle-resolvedphotoemission", "photoemission"], "image": "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAsAAAAOCAYAAAD5YeaVAAAAAXNSR0IArs4c6QAAAAZiS0dEAP8A/wD/oL2nkwAAAAlwSFlzAAALEwAACxMBAJqcGAAAAAd0SU1FB9wKExQZLWTEaOUAAAAddEVYdENvbW1lbnQAQ3JlYXRlZCB3aXRoIFRoZSBHSU1Q72QlbgAAAdpJREFUKM9tkL+L2nAARz9fPZNCKFapUn8kyI0e4iRHSR1Kb8ng0lJw6FYHFwv2LwhOpcWxTjeUunYqOmqd6hEoRDhtDWdA8ApRYsSUCDHNt5ul13vz4w0vWCgUnnEc975arX6ORqN3VqtVZbfbTQC4uEHANM3jSqXymFI6yWazP2KxWAXAL9zCUa1Wy2tXVxheKA9YNoR8Pt+aTqe4FVVVvz05O6MBhqU perovskite electronic structure."]}}, {"title": "Momentum-resolved EELS study of collective charge excitations in 1T-TaS2", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2608.23492", "authors": "Farzaneh Hoveyda-Marashi (Department of Physics, University of Illinois, Materials Research Laboratory, et al.", "last_authors": "Dipanjan Chaudhuri (Department of Physics, Peter Abbamonte (Department of Physics", "summary": "We use momentum-resolved electron energy-loss spectroscopy (M-EELS) to study the low-energy charge excitations of 1$T$-TaS$_2$ across the nearly commensurate-to-commensurate charge-density-wave (CDW) transition. Single-crystal x-ray diffraction and elastic M-EELS measurements confirm the expected rotation of the CDW wave vector upon entering the commensurate phase. In the nearly commensurate phase, the low-energy M-EELS spectra reveal an acoustic phonon branch and two optical phonon features whose energies and dispersions are broadly consistent with previous calculations and inelastic x-ray measurements. Across the transition, the optical phonon energies remain nearly unchanged, while their spectral intensity develops a pronounced temperature dependence near the CDW ordering wave vector. At higher energies, the finite-momentum charge response undergoes a substantial redistribution of spectral weight below the transition, consistent with the opening of an energy gap. These results demonstrate that M-EELS provides simultaneous access to lattice dynamics and finite-momentum valence band charge excitations in 1$T$-TaS$_2$, revealing their evolution across the commensurate CDW transition.", "tier": "B_IMPORTANT_CONDMAT", "score": "9", "reason": "Momentum-resolved spectroscopy of a CDW material, directly relevant to the user's expertise in ARPES/spectroscopy.", "tags": ["EELS", "CDW", "TaS2", "spectroscopy"], "image": "https://arxiv.org/static/browse/0.3.4/images/arxiv-logo-fb.png", "briefing": {"background": "전하 밀도 파동(CDW) 물질 mpare and contrast ambient- and high-pressure superconductivity in bilayer nickelate films.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "High-impact study on nickelate superconductivity, a relevant strongly correlated system.", "tags": ["nickelate", "superconductivity"], "image": "https://media.springernature.com/m685/springer-static/image/art%3A10.1038%2Fs41563-026-02695-3/MediaObjects/41563_2026_2695_Fig1_HTML.png", "briefing": {"background": "니켈산염은 구리산염 초전도체와 유사한 전자 구조를 가져 고온 초전도 메커니즘을 이해하는 핵심 물질군으로 주목받고 있습니다.", "motivation": "니켈산염의 상압 및 고압 초전도 상태 사이의 관계를 규명하여 니켈산염 초전도 현상의 보편적 특성을 이해하고자 합니다.", "result": "란타넘 치환과 고자기장 및 고압 측정을 통해 박막 형태의 니켈산염에서 두 압력 상태를 잇는 실험적 가교를 마련했습니다.", "implication": "니켈산염 초전도체의 상전이 메커니즘과 전자 상관관계의 이해를 높여 고온 초전도체 구현의 실마리를 제공합니다.", "novelty": "니켈산염 시스템에서 고압과 상압 데이터를 통합적으로 비교하여 강상관 전자계 초전도 모델을 정교화했습니다.", "unresolved": "여전히 니켈산염에서 발견되는 초전도의 스핀 혹은 전하 채널의 정확한 기여도는 완벽히 밝혀지지 않았습니다.", "future_work": "더 넓은 범위의 도핑 및 변형을 적용하여 상평형도를 정밀하게 매핑할 필요가 있습니다.", "concepts": [{"term": "Bilayer Nickelate", "why_emerged": "구리산염의 CuO2 평면과 유사한 구조를 가져 고온 초전도 구현 후보로 부상.", "origin": "2019년 NdNiO2 초전도성 발견 이후 활발히 연구됨.", "connections": "La2LnNi2O7, 구리산염 초전도체, 강상관 전자계."}, {"term": "High-pressure superconductivity", "why_emerged": "물질의 격자 상수를 조절하여 전자 상관관계를 미세 조정하기 위해.", "origin": "초전도 연구 초기부터 사용됨.", "connections": "다이아몬드 앤빌 셀(DAC), 전이온도 상승."}], "english_summary": ["The study investigates La2LnNi2O7 thin films to compare ambient- and high-pressure superconductivity.", "Advanced characterizations including ultrahigh magnetic fields and high-pressure conditions were employed.", "The work bridges the gap in understanding nickelate superconductivity under different thermodynamic regimes."]}}, {"title": "Emergence of magnetic ordering and weak antilocalization in Fe-doped Sb2Te3: Evidence by muon spin resonance and density functional theory studies", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/7jww-qc6d", "authors": "Suchandra Mukherjee, Nabakumar Rana, Ankit Kumar, et al.", "last_authors": "Swapnadeep Goswami, Aritra Banerjee", "summary": "Three-dimensional topological insulators have garnered significant attention in scientific research due to their unique electronic properties. An in-depth study has been conducted to explore the influence of iron (Fe) doping on both the magnetic properties and the topological insulating behavior of …", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Experimental investigation of magnetic topological insulators using muon spin resonance and DFT.", "tags": ["experiment", "Sb2Te3", "topologicalinsulator"], "image": "", "briefing": {"background": "위상 절연체에 자기적 도펀트를 주입하면 위상 표면 상태와 자기 질서 사이의 상호작용으로 인해 양자 변칙 홀 효과 등 흥미로운 현상이 나타납니다.", "motivation": "Sb2Te3에 Fe를 도핑했을 때 나타나는 자기적 질서의 특성과 위상학적 성질의 변화를 규명하고자 합니다.", "result": "뮤온 스핀 공명(MuSR)과 DFT 계산을 통해 Fe 도핑이 유도하는 자기 질서와 약한 반국소화(weak antilocalization) 현상을 입증했습니다.", "implication": "자기 위상 절연체 설계 시 도펀트의 농도와 국소 자기 환경을 제어하는 것이 위상학적 성질 보존에 중요함을 시사합니다.", "novelty": "실험적 MuSR 기법과 이론적 DFT 계산을 결합하여 Fe가 위상 절연체 내부에서 어떻게 자기적 환경을 구성하는지 미시적으로 분석했습니다.", "unresolved": "Fe 이온의 무질서한 분포가 위상 표면 상태에 미치는 구체적인 산란 효과와 그에 따른 수송 특성 변화는 추가 분석이 필요합니다.", "future_work": "ARPES 등을 통해 자기 도핑에 의한 표면 상태의 갭 열림(gap opening)을 직접적으로 관찰할 필요가 있습니다.", "concepts": [{"term": "Weak Antilocalization", "why_emerged": "강한 스핀-궤도 결합에 의해 양자 간섭이 파괴적인 간섭을 일으켜 저항을 감소시키는 현상을 설명하기 위해.", "origin": "위상 절연체 연구 초기부터 양자 수송의 특징으로 정립됨.", "connections": "베리 위상, 스핀-궤도 결합, 위상 절연체 표면 상태."}, {"term": "Muon Spin Resonance", "why_emerged": "물질 내부의 국소적인 자기 환경을 비파괴적으로 정밀 측정하기 위해.", "origin": "20세기 중반 이후 입자 물리학 기술을 고체 물리로 응용.", "connections": "자기적 질서 조사, 시료 내부 자기장 분포 측정."}], "english_summary": ["The paper investigates the impact of Fe doping on the topological insulator Sb2Te3.", "Experimental techniques including MuSR and DFT calculations reveal emergent magnetic ordering.", "Weak antilocalization signatures are observed, characterizing the interplay between magnetism and topology."]}}, {"title": "Emergent room-temperature anomalous and topological Hall responses in the epitaxial ferromagnetic Weyl nodal-line metal Fe5Si3", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/flxb-4ktc", "authors": "Shubhashish Pati, Sonali Srotaswini Pradhan, Abhay Pandey, et al.", "last_authors": "V. Kanchana, Sujeet Chaudhary", "summary": "The interplay between real and reciprocal space topology yields intrinsically linked transport phenomena in topological magnetic material systems. In particular, broken time-reversal symmetry together with strong Dzyaloshinskii-Moriya interaction and pronounced uniaxial anisotropy can simultaneously…", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Topological Weyl semimetal relevant to magnetism and electronic structure studies.", "tags": ["Weyl", "topological", "magneticmaterial"], "image": "", "briefing": {"background": "위상 전자 구조와 자기적 정렬이 공존하는 시스템은 비자명한 베리 곡률과 카이럴 아노말리를 통해 비전통적인 수송 현상을 유도하며, 이는 차세대 스핀트로닉스 소자 개발의 핵심입니다.", "motivation": "Fe5Si3의 자기 구조 및 Weyl nodal-line 금속성에서 기인하는 위상적 수송 특성을 실험적으로 확인하고 실온에서의 응용 가능성을 탐구하고자 합니다.", "result": "Fe5Si3 박막에서 실온 이상의 온도에서도 유지되는 큰 비정상 홀 효과(AHE)와 위상 홀 효과(THE)가 관측되었으며, 이는 Weyl nodal-line과 관련된 내재적 위상 특성으로 설명됩니다.", "implication": "실온에서 위상학적 수송 특성을 제어할 수 있는 자성 금속 후보 물질로서 Fe5Si3의 가치를 입증하였으며, 스핀트로닉스 소자 설계를 위한 소재 후보군을 확장합니다.", "novelty": "실온 동작 가능한 강자성 Weyl nodal-line 금속으로서 자성 위상 물질 연구 및 응용 분야에 직접적인 기여를 합니다.", "unresolved": "Weyl nodal-line의 전자 구조를 직접 관측하는 ARPES 데이터는 명시되지 않아, 위상학적 기원을 확정하기 위한 분광학적 검증이 필요합니다.", "future_work": "ARPES를 통한 밴드 구조 매핑 및 Weyl 포인트와 nodal-line의 직접적인 실험적 확인이 요구됩니다.", "concepts": [{"term": "Weyl Nodal-line", "why_emerged": "밴드 교차점이 점이 아닌 선으로 연결된 위상학적 구조를 기술하기 위해 도입되었습니다.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "Weyl semimetal, Topological semimetal"}, {"term": "Anomalous Hall Effect", "why_emerged": "강자성체에서 자기장 없이도 발생하는 홀 전압을 설명하기 위해 도입되었습니다.", "origin": "Edwin Hall (1881년 발견)", "connections": "Berry curvature, Topological Hall effect"}], "english_summary": ["Fe5Si3 is identified as a ferromagnetic Weyl nodal-line metal.", "Large anomalous and topological Hall effects are observed at room temperature.", "The results suggest significant potential for room-temperature spintronic applications.", "The study links electronic transport to the underlying topological band structure."]}}, {"title": "Magnetization-dependent and stacking-tunable Edelstein effect in the two-dimensional magnet 2H−VTe2", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/48gx-cpg2", "authors": "Weiyi Pan, Jaroslav Fabian", "last_authors": "Weiyi Pan, Jaroslav Fabian", "summary": "The Edelstein effect in magnetic systems enables magnetization switching via the coupling between current-induced spin accumulation and intrinsic magnetic order and is therefore highly promising for next-generation spintronic devices. Realizing and manipulating the Edelstein effect in two-dimensiona…", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Study of the Edelstein effect in a relevant 2D magnetic material, VTe2.", "tags": ["material", "2Dmagnet", "spintronics"], "image": "", "briefing": {"background": "스핀-궤도 결합과 자성이 공존하는 2차원 물질에서 전류를 이용해 자기 상태를 제어하는 기술은 에너지 효율적인 스핀트로닉스의 핵심 과제입니다.", "motivation": "2H-VTe2라는 2차원 자성 물질에서 적층 구조와 자기 상태 변화가 Edelstein 효과(전류 유도 스핀 축적)에 미치는 영향을 규명하고자 합니다.", "result": "VTe2의 층상 구조와 자기적 정렬이 스핀 축적 효율을 크게 결정하며, 이를 적층(stacking) 방식을 통해 튜닝할 수 있음을 이론적으로 제시했습니다.", "implication": "2차원 반데르발스 자성체에서 적층 엔지니어링을 통해 스핀 소자의 성능을 제어할 수 있는 구체적인 경로를 제공합니다.", "novelty": "VTe2와 같은 전이금속 디칼코게나이드(TMD) 기반 자성체에서 적층 구조와 스핀트로닉스 특성을 결합하여 제어 가능성을 입증한 점이 돋보입니다.", "unresolved": "실제 소자 구현 시 요구되는 박막 박리 및 고품질 적층 공정에서의 난제와 실험적 검증이 남아있습니다.", "future_work": "실제 2H-VTe2 소자 제작 및 스핀-토크 측정을 통한 이론 결과의 검증이 예상됩니다.", "concepts": [{"term": "Edelstein Effect", "why_emerged": "반전 대칭성이 깨진 계면이나 물질에서 전류에 의한 비대칭적 스핀 축적을 설명하기 위해 도입되었습니다.", "origin": "V. M. Edelstein (1990)", "connections": "Rashba effect, Spin-orbit torque"}, {"term": "2H-VTe2", "why_emerged": "차세대 2차원 자성체 후보 물질로 낮은 차원에서의 자성 발현을 연구하기 위해 주목받고 있습니다.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "TMD, Van der Waals magnetic materials"}], "english_summary": ["Explores the Edelstein effect in 2D magnetic 2H-VTe2.", "Demonstrates that current-induced spin accumulation is tunable via stacking.", "Suggests implications for magnetization switching in spintronic devices.", "Highlights the potential of van der Waals magnets for spin-orbit torque applications."]}}, {"title": "Three-dimensional quantum Hall effect of Fermi arc surface states in tilted Weyl semimetals", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/gd4w-x272", "authors": "Mingqi Chang, Rong Ma", "last_authors": "Mingqi Chang, Rong Ma", "summary": "Three-dimensional (3D) quantum Hall effect (QHE) of Fermi arcs in Weyl semimetals has attracted significant interest. In this work, we explore the 3D QHE of Fermi arc surface states in tilted Weyl semimetals. We systematically consider both the symmetric the and asymmetric tilts. For the asymmetric …", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Detailed study of Fermi arc surface states and 3D QHE in Weyl semimetals.", "tags": ["theory", "Weylsemimetal", "quantumHall"], "image": "", "briefing": {"background": "Weyl 반금속은 표면에 Fermi arc 상태가 존재하며, 이는 자기장 하에서 3차원 양자 홀 효과와 같은 비전통적인 물리 현상을 나타내는 배경이 됩니다.", "motivation": "Weyl 반금속의 에너지 밴드가 기울어진(tilted) 경우, 이 비대칭적 구조가 3차원 양자 홀 효과에 어떤 영향을 미치는지 규명하고자 합니다.", "result": "틸트(tilt) 정도와 대칭성에 따라 Fermi arc에서 나타나는 양자 홀 응답이 변화하며, 비대칭적 틸트가 양자 홀 효과의 위상학적 특성을 수정함을 밝혀냈습니다.", "implication": "물질의 밴드 기울기를 고려한 더욱 정확한 양자 수송 모델을 제공하며, Weyl 반금속 소자 설계 시 밴드 엔지니어링의 중요성을 강조합니다.", "novelty": "단순한 Weyl 모델을 넘어 틸트 효과를 포함한 보다 실질적인 이론적 고찰을 통해 실험 데이터 해석에 중요한 기반을 마련했습니다.", "unresolved": "실제 물질의 틸트 밴드 구조를 완벽하게 반영하지 못하는 모델의 한계가 있으며, 구체적인 실험 데이터와 직접 매칭하는 과정이 추가로 필요합니다.", "future_work": "강하게 틸트된 Weyl 반금속 물질의 저온 자기 수송 실험 및 ARPES 데이터를 활용한 모델 정교화가 예상됩니다.", "concepts": [{"term": "Fermi Arc", "why_emerged": "Weyl 반금속의 표면에서 종점(Weyl node)을 잇는 독특한 비닫힌 상태를 기술하기 위해 도입되었습니다.", "origin": "Wan et al. (2011)", "connections": "Weyl semimetal, Topological surface state"}, {"term": "3D Quantum Hall Effect", "why_emerged": "Weyl semimetal의 3차원적 벌크 전자가 자기장에서 만드는 특이한 홀 전도도를 기술하기 위해 필요합니다.", "origin": "Halperin (1987, 이론적 예측)", "connections": "Fermi arc, Weyl semimetal"}], "english_summary": ["Investigates the 3D quantum Hall effect of Fermi arcs in tilted Weyl semimetals.", "Analyzes the role of both symmetric and asymmetric tilts in electronic transport.", "Shows that tilting significantly modifies the topological response of the surface states.", "Provides theoretical insights for interpreting transport experiments in Weyl semimetals."]}}, {"title": "Trigonal warping enables linear optical spectroscopy in single-valley superconductors", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/1bmy-6yp4", "authors": "Benjamin A. Levitan, Étienne Lantagne-Hurtubise", "last_authors": "Benjamin A. Levitan, Étienne Lantagne-Hurtubise", "summary": "Internal vibrations of the superconducting condensate, such as clapping modes and Bardasis-Schrieffer modes, are often invisible to linear optical spectroscopy due to crystallographic selection rules. Here, the authors show how, in threefold-symmetric valley-polarized superconductors, trigonal warping allows these modes to absorb light at linear order. Consequently, the modes appear in both components of the optical conductivity tensor. The authors then discuss how rhombohedral graphene multilayers provide natural candidate materials in which to probe superconducting collective excitations by microwave spectroscopy.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Collective modes in graphene superconductors, relevant to unconventional superconductivity interest.", "tags": ["theory", "graphene", "superconductivity"], "image": "", "briefing": {"background": "초전도체 내부의 집합적 들뜸(collective excitations) 상태를 관측하는 것은 초전도 매커니즘을 이해하는 핵심입니다. 하지만 많은 경우 선택 규칙(selection rules) 때문에 선형 광학 분광법으로는 이러한 모드를 직접 관측하기 어렵습니다.", "motivation": "삼회전 대칭성을 가진 밸리 편극 초전도체에서 트리거널 워핑(trigonal warping) 효과가 이러한 관측 불가능한 모드를 선형 광학 영역으로 끌어올릴 수 있는지 규명하고자 합니다.", "result": "트리거널 워핑이 존재하면 clapping mode나 Bardasis-Schrieffer 모드가 선형 광학 분광법에서 활성화되어 광학 전도도 텐서에 나타남을 보였습니다.", "implication": "마름모꼴 그래핀 다층 구조(rhombohedral graphene multilayers)와 같은 물질에서 마이크로파 분광법을 통해 초전도 상태의 집합적 모드를 직접 탐지할 수 있는 이론적 근거를 제공합니다.", "novelty": "선택 규칙으로 인해 숨겨졌던 초전도 집합 모드를 트리거널 워핑이라는 구조적 왜곡을 이용해 측정 가능한 신호로 변환한 점이 핵심입니다.", "unresolved": "실제 실험에서 트리거널 워핑의 세기에 따른 신호 대 잡음비(SNR) 최적화 문제와 샘플의 균일도 문제가 남아있습니다.", "future_work": "마름모꼴 그래핀 다층 구조에서 실제 마이크로파 분광 실험을 통해 이론적 예측을 검증하는 연구가 기대됩니다.", "concepts": [{"term": "Bardasis-Schrieffer mode", "why_emerged": "초전도 질서 변수(order parameter)의 비최저 에너지 상태를 이해하기 위해 필요함.", "origin": "Bardasis와 Schrieffer가 1961년에 제안.", "connections": "고온 초전도체에서의 갭 구조 연구와 연관됨."}, {"term": "Trigonal warping", "why_emerged": "그래핀의 에너지 밴드가 단순한 원형이 아니라 삼각 형태의 왜곡을 가지는 현상을 설명하기 위해 필요함.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "반데르발스 물질의 전자 구조 및 토폴로지 특성 연구와 연결됨."}], "english_summary": ["Trigonal warping breaks selection rules that previously hid superconducting collective modes.", "Clapping and Bardasis-Schrieffer modes become observable in linear optical spectroscopy.", "Rhombohedral graphene multilayers are proposed as ideal platforms for this detection.", "Microwave spectroscopy is suggested as the key experimental tool for validation."]}}, {"title": "Tunneling signatures of interband coherence in dilute exciton condensates", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/mb3n-l45p", "authors": "Kryštof Kolář, Felix von Oppen", "last_authors": "Kryštof Kolář, Felix von Oppen", "summary": "We theoretically investigate signatures of exciton condensation and the underlying interband coherence in scanning tunneling microscopy. We consider both monolayer and bilayer condensates in the regime of a dilute condensate of tightly bound excitons. For monolayer condensates, interband coherence is directly encoded in spatially oscillating contributions to the tunneling conductance, which break the underlying lattice symmetry. We show how scanning tunneling microscopy allows one to extract the exciton wave function. For bilayer condensates, we show that the formation of the exciton insulator is signaled by the emergence of a characteristic peak in the tunneling conductance, which can be used to extract the (local) exciton density. Our results are based on analytical considerations using a systematic solution of the mean-field equations in powers of the exciton density as well as numerical calculations.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Theoretical STM signatures for exciton condensates in monolayers/bilayers; relevant to spectroscopy interests.", "tags": ["theory", "STM", "2Dmaterials"], "image": "", "briefing": {"background": "엑시톤 응축(exciton condensation)은 전자와 정공이 결합하여 보즈-아인슈타인 응축 상태를 형성하는 흥미로운 양자 상태입니다. 그러나 이를 고체 내부에서 명확하게 실험적으로 입증하고 공간적 정보를 얻는 것은 매우 어려운 과제입니다.", "motivation": "주사 터널링 현미경(STM)을 사용하여 엑시톤 응축물과 그 기저에 깔린 밴드 간 간섭성(interband coherence)의 직접적인 신호를 규명하고자 합니다.", "result": "단일층에서는 격자 대칭성을 깨는 공간적 진동이 엑시톤 파동함수를 나타내며, 이중층에서는 엑시톤 밀도를 추출할 수 있는 특유의 터널링 전도도 피크가 나타남을 보였습니다.", "implication": "STM이 단순히 밴드 구조뿐만 아니라 엑시톤 응축과 같은 다체 상태의 국소적 정보를 직접 추출할 수 있는 도구임을 이론적으로 입증했습니다.", "novelty": "엑시톤 응축의 미시적 구조를 STM 분광 신호와 직접 연결하여, 물질 내부의 엑시톤 응축 여부를 국소적으로 진단할 수 있는 방법론을 제시했습니다.", "unresolved": "실제 STM 실험에서 엑시톤 응축으로 인한 신호와 불순물 또는 기타 국소 상태(local states)에 의한 신호를 구분하는 정밀한 분석이 필요합니다.", "future_work": "2D 층상 물질 및 이중층 헤테로구조에서 저온 STM을 활용한 엑시톤 응축 상태의 실험적 직접 관측.", "concepts": [{"term": "Exciton Condensation", "why_emerged": "강하게 상호작용하는 전자-정공 쌍의 보즈 액체 상태를 이해하기 위해 필요함.", "origin": "Keldysh와 Kopaev 등이 1960년대 중반에 제안.", "connections": "반도체 이중층, 전이금속 디칼코게나이드(TMD) 헤테로구조와 연관됨."}, {"term": "Interband coherence", "why_emerged": "엑시톤
