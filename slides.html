그리고 실제 나노소자 제작을 통한 전송 특성 테스트가 필요합니다.", "concepts": [{"term": "탄소 나노리본", "why_emerged": "그래핀의 일차원 형태로서 밴드갭 제어가 용이해 나노전자소자 구현을 위해 필요함.", "origin": "그래핀 연구 초기부터 이론적으로 제안됨.", "connections": "그래핀, 탄소 나노튜브(CNT), 위상 절연체 리본."}], "english_summary": ["Carbon nanoribbons composed of 5- and 7-membered rings are synthesized.", "The structure exhibits metallic-like electron transport and high conductance.", "This provides a new material platform distinct from hexagonal honeycomb lattices."]}}, {"title": "Berry trash can: A model of interacting electrons in rhombohedral graphene", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/txcg-ss55", "authors": "B. Andrei Bernevig, Yves H. Kwan", "last_authors": "B. Andrei Bernevig, Yves H. Kwan", "summary": "We present a model for interacting electrons in a continuum band structure that resembles a trash can, with a flat bottom of radius ${k}_{b}$ beyond which the dispersion increases rapidly with velocity $v$. The form factors of the Bloch wave functions can be well-approximated by the Girvin-MacDonald…", "tier": "B_IMPORTANT_CONDMAT", "score": "7", "reason": "Model of interacting electrons in rhombohedral graphene with Berry curvature relevance.", "tags": ["theory", "graphene", "Berrycurvature"], "image": "", "briefing": {"background": "능면체 적층(Rhombohedral) 그래핀은 전자 간 상호작용이 강해지기 쉬운 평탄한 밴드 구조를 가져, 강상관계 전자 상태 연구에 핵심적인 플랫폼입니다.", "motivation": "강한 상호작용이 있는 전자계를 기술하기 위해, 복잡한 밴드 구조를 단순화하면서도 물리적 본질을 유지하는 모델링 기법이 필요했습니다.", "result": "바닥이 평평하고 가장자리가 빠르게 발산하는 '쓰레기통(trash can)' 모양의 분산 모델을 제시하여, 상호작용하는 전자계의 Bloch 파동함수를 효율적으로 근사했습니다.", "implication": "복잡한 다체 물리 시스템을 해석하기 위한 효과적인 이론적 틀을 제공하며, 그래핀의 위상학적 특성 및 Berry curvature 관련 현상을 더 쉽게 분석할 수 있게 합니다.", "novelty": "베리 곡률이 강조되는 능면체 그래핀 시스템에서 상호작용을 다루는 단순하고 강력한 이론적 도구를 개발했습니다.", "unresolved": "이 모델이 모든 실험적 관측치(특히 아주 높은 에너지 준위나 비평형 상태)를 정량적으로 얼마나 잘 설명하는지는 추가 검증이 필요합니다.", "future_work": "이 모델을 기반으로 한 분수 양자 홀 효과(FQHE) 및 위상 초전도체 예측 연구로 확장될 것입니다.", "concepts": [{"term": "Berry curvature", "why_emerged": "블로흐 파동함수의 기하학적 위상 성질을 이해하여 전자의 이상 운동을 기술하기 위해 도입됨.", "origin": "Berry(1984).", "connections": "이상 홀 효과, 양자 홀 효과, 위상 물질."}, {"term": "Rhombohedral graphene", "why_emerged": "층간 적층 구조에 따라 변하는 밴드 구조가 강상관 현상을 유도하는 특이한 전자 상태를 만들기 때문.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "뒤틀린 이중층 그래핀(TBG), 강상관 전자계."}], "english_summary": ["Presents a 'trash can' model for interacting electrons in rhombohedral graphene.", "Uses a simplified band structure to approximate Bloch wave form factors.", "Facilitates theoretical study of correlations and topological properties."]}}, {"title": "Dynamical magnetism in the disordered cubic lattice material γ−Ba3CoNb2O9", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/jsvt-jc4l", "authors": "Fanjun Xu, Ralf Feyerherm, Cecilie Glittum, et al.", "last_authors": "A. T. M. Nazmul Islam, Bella Lake", "summary": "Strong disorder normally favors spin-glass freezing. Here, in contrast, the authors report an unconventional, highly fluctuating spin state in cubic γ-Ba 3 CoNb 2 O 9 with effective spin-½ moments randomly diluted to just above the percolation limit. Neutron and muon measurements, with partially overlapping time windows, surprisingly reveal persistent correlated spin fluctuations from picoseconds to microseconds—a behavior reminiscent of quantum spin liquids. Numerical calculations suggest singlet formation is important. These results show disorder can sustain dynamic spin correlations even without strong geometrical frustration.", "tier": "B_IMPORTANT_CONDMAT", "score": "7", "reason": "Experimental neutron and muon study of persistent spin fluctuations in a potential quantum spin liquid.", "tags": ["method", "neutron-scattering", "spin-liquid"], "image": "", "briefing": {"background": "강한 무질서가 존재하는 스핀 계에서는 보통 스핀 유리(spin glass) 상태로 얼어붙는 것이 일반적입니다. 하지만 기하학적 좌절이나 강한 양자 요동은 이를 방해하고 새로운 상태를 만듭니다.", "motivation": "무질서도가 높은 물질인 γ-Ba3CoNb2O9에서 예상과 달리 왜 스핀이 얼어붙지 않고 동적인 요동을 지속하는지 확인하고자 했습니다.", "result": "중성자 및 뮤온 실험을 통해 picosecond에서 microsecond에 이르는 넓은 시간 범위에서 지속적인 스핀 요동을 발견했습니다.", "implication": "강한 기하학적 좌절 없이도 무질서와 스핀-싱글렛 형성 등의 메커니즘을 통해 동적 스핀 요동이 유지될 수 있음을 시사합니다.", "novelty": "무질서한 큐빅 격자계에서 양자 스핀 액체(QSL)와 유사한 장거리 동적 상관관계를 증명하여, 스핀 액체 후보군을 확장했습니다.", "unresolved": "이러한 동적 요동이 정확히 어떤 양자 다체 상태에 기인하는지, 싱글렛 형성이 구체적으로 어떻게 무질서를 극복하는지는 추가적인 이론 모델이 필요합니다.", "future_work": "저온에서의 극저온 비열 측정 및 고자기장 하에서의 중성자 산란을 통해 싱글렛 상태의 구체적인 구조를 밝힐 예정입니다.", "concepts": [{"term": "Quantum Spin Liquid (QSL)", "why_emerged": "절대 영도에서도 스핀이 얼어붙지 않고 양자 요동을 지속하는 기묘한 상태를 이해하기 위해 도입됨.", "origin": "Anderson(1973).", "connections": "고온 초전도체, 위상 물질, 얽힘(Entanglement)."}, {"term": "Muon spin rotation", "why_emerged": "국소적인 자기장 분포와 스핀 요동을 매우 민감하게 탐지하기 위해 사용됨.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "중성자 산란, 스핀 유리."}], "english_summary": ["Observation of persistent spin fluctuations in disordered cubic γ-Ba3CoNb2O9.", "Neutron and muon measurements reveal long-lived dynamics from ps to μs timescales.", "Suggests that spin-singlet formation can sustain dynamic order despite high disorder."]}}, {"title": "Electron-doping-induced multiferroicity in a one-dimensional NbI3 chain", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/gtyg-hhld", "authors": "Zhen Zhang, Jing-Yang You, Lixing Kang", "last_authors": "Jing-Yang You, Lixing Kang", "summary": "Multiferroic materials are of great importance for the development of next-generation multifunctional devices. Here, we predict a stable one-dimensional (1D) antiferromagnetic (AFM) semiconductor ${\\mathrm{NbI}}_{3}$ chain, in which moderate electron doping induces site-centered charge order, ferrim…", "tier": "B_IMPORTANT_CONDMAT", "score": "7", "reason": "Prediction of charge order in a 1D material, relevant to interests in quasi-1D systems like NbSe3.", "tags": ["material", "quasi-1D", "charge-order"], "image": "", "briefing": {"background": "1차원 사슬 구조의 저차원 물질은 전자-전자 상관관계와 전자-포논 결합이 극대화되어     img.src = r.image; img.alt = 'Figure or article preview image'; img.loading = 'lazy'; img.referrerPolicy = 'no-referrer'; img.onerror = () => figure.remove();
    figure.appendChild(img);
    figure.appendChild(textEl('figcaption', '', 'Figure / article preview image from the source page'));
    head.appendChild(figure);
  }
  const headText = document.createElement('div');
  headText.className = 'head-text';
  const badges = document.createElement('div');
  badges.className = 'badges';
  if (r.score) badges.appendChild(textEl('span', 'badge score', `${r.score}/10`));
  if (r.tier) badges.appendChild(textEl('span', 'badge', r.tier));
  if (r.journal) badges.appendChild(textEl('span', 'badge', r.journal));
  if (r.source) badges.appendChild(textEl('span', 'badge', r.source));
  headText.appendChild(badges);
  const title = document.createElement('h1');
  if (r.link) { const titleLink = document.createElement('a'); titleLink.href = r.link; titleLink.target = '_blank'; titleLink.rel = 'noopener noreferrer'; titleLink.textContent = r.title || ''; title.appendChild(titleLink); }
  else { title.textContent = r.title || ''; }
  headText.appendChild(title);
  headText.appendChild(textEl('p', 'meta', [r.journal, r.source].filter(Boolean).join(' | ')));
  if (r.last_authors || r.authors) { const authors = document.createElement('p'); authors.className = 'authors'; if (r.last_authors) authors.append('Last authors: ' + r.last_authors); if (r.authors) authors.append((r.last_authors ? ' | ' : '') + 'Authors: ' + r.authors); headText.appendChild(authors); }
  appendLabeledText(headText, 'why', 'Filter reason: ', r.reason);
  if (r.tags && r.tags.length) { const tags = document.createElement('div'); tags.className = 'tags'; r.tags.forEach(tag => tags.appendChild(textEl('span', 'tag', '#' + tag))); headText.appendChild(tags); }
  if (r.link) { const link = document.createElement('a'); link.className = 'link'; link.href = r.link; link.target = '_blank'; link.rel = 'noopener noreferrer'; link.textContent = 'Open paper'; headText.appendChild(link); }
  head.appendChild(headText);
  if (r.summary) { const abstract = document.createElement('p'); abstract.className = 'original-abstract'; const strong = textEl('strong', '', 'Original abstract'); abstract.appendChild(strong); abstract.append(r.summary); head.appendChild(abstract); }
  slideEl.appendChild(head);
  const briefing = document.createElement('div');
  briefing.className = 'briefing';
  appendBriefSection(briefing, 'Background', b.background);
  appendBriefSection(briefing, 'Motivation', b.motivation);
  appendBriefSection(briefing, 'Result', b.result);
  appendBriefSection(briefing, 'Implication', b.implication);
  appendBriefSection(briefing, "Why it's important / Novelty", b.novelty);
  appendBriefSection(briefing, 'Unresolved Questions', b.unresolved);
  appendBriefSection(briefing, 'Expected Future Work', b.future_work);
  if (b.concepts && b.concepts.length) {
    const section = document.createElement('section');
    section.className = 'brief-section wide';
    section.appendChild(textEl('h2', '', 'Concepts / Terms'));
    const concepts = document.createElement('div');
    concepts.className = 'concepts';
    b.concepts.forEach(c => {
      const item = document.createElement('div');
      item.className = 'concept';
      item.appendChild(textEl('h3', '', c.term || 'Concept'));
      [['왜 생겼나: ', c.why_emerged], ['누가 만들었나: ', c.origin], ['연결되는 흐름: ', c.connections]].forEach(([label, text]) => { if (!text) return; const p = document.createElement('p'); const bold = textEl('b', '', label); p.appendChild(bold); p.append(text); item.appendChild(p); });
      concepts.appendChild(item);
    });
    section.appendChild(concepts);
    briefing.appendChild(section);
  }
  if (b.english_summary && b.english_summary.length) { const section = document.createElement('section'); section.className = 'brief-section wide'; section.appendChild(textEl('h2', '', 'English Summary')); const ul = document.createElement('ul'); b.english_summary.slice(0, 5).forEach(line => ul.appendChild(textEl('li', '', line))); section.appendChild(ul); briefing.appendChild(section); }
  slideEl.appendChild(briefing);
  counterEl.textContent = `${index + 1} / ${slides.length}`;
  prevBtn.disabled = index === 0;
  nextBtn.disabled = index === slides.length - 1;
}
prevBtn.addEventListener('click', () => { index = Math.max(0, index - 1); render(); });
nextBtn.addEventListener('click', () => { index = Math.min(slides.length - 1, index + 1); render(); });
document.addEventListener('keydown', event => { if (event.key === 'ArrowLeft') prevBtn.click(); if (event.key === 'ArrowRight') nextBtn.click(); });
render();
</script>
</body>
</html>
