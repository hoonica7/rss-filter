<title>Daily Paper Slideshow</title>
<style>
  :root {
    color-scheme: light;
    --bg: #f6f7f4;
    --paper: #ffffff;
    --ink: #111827;
    --muted: #64748b;
    --line: #d8ddd2;
    --accent: #176b87;
    --accent-2: #9a3412;
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; overflow: auto; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: var(--bg); color: var(--ink); }
  .shell { max-width: 1500px; min-height: 100vh; margin: 0 auto; padding: 14px 18px; display: flex; flex-direction: column; }
  .topbar { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 16px; }
  .top-actions { display: flex; align-items: center; gap: 10px; }
  .topbar a, button { border: 1px solid var(--line); border-radius: 8px; background: var(--paper); color: var(--ink); padding: 10px 14px; font-weight: 700; text-decoration: none; cursor: pointer; }
  button.primary { background: var(--accent); border-color: var(--accent); color: white; }
  button:disabled { opacity: 0.45; cursor: not-allowed; }
  .counter { color: var(--muted); font-weight: 700; }
  .slide { min-height: calc(100vh - 82px); background: var(--paper); border: 1px solid var(--line); border-radius: 10px; padding: 18px; box-shadow: 0 18px 42px rgba(15, 23, 42, 0.10); display: grid; grid-template-columns: minmax(310px, 0.86fr) minmax(0, 1.55fr); gap: 18px; overflow: visible; }
  .paper-head { min-width: 0; min-height: 0; overflow: visible; display: flex; flex-direction: column; gap: 12px; }
  .figure { margin: 0; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: #f8fafc; }
  .figure img { display: block; width: 100%; max-height: 41vh; object-fit: contain; background: white; }
  .figure figcaption { padding: 7px 10px; color: var(--muted); font-size: 12px; line-height: 1.3; }
  .head-text { display: flex; flex-direction: column; gap: 9px; min-width: 0; }
  .badges { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .badge { border-radius: 999px; padding: 5px 9px; background: #eef2ff; color: #3730a3; font-size: 12px; font-weight: 800; }
  .score { background: #fee2e2; color: #991b1b; }
  h1 { margin: 0; font-size: 25px; line-height: 1.15; letter-spacing: 0; overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
  h1 a { color: inherit; text-decoration-color: rgba(23, 107, 135, 0.35); text-decoration-thickness: 2px; text-underline-offset: 4px; }
  h1 a:hover { color: var(--accent); text-decoration-color: var(--accent); }
  .meta, .authors, .why, .abstract { font-size: 13px; line-height: 1.45; }
  .meta, .authors { color: var(--muted); }
  .why strong, .abstract strong, .authors strong { color: var(--ink); }
  .authors { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .why { border-left: 4px solid var(--accent-2); padding-left: 10px; color: #374151; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .abstract { border-top: 1px solid var(--line); padding-top: 14px; color: #374151; }
  .original-abstract { border-top: 1px solid var(--line); padding-top: 10px; color: #374151; font-size: 11.5px; line-height: 1.35; overflow-wrap: anywhere; }
  .original-abstract strong { display: block; margin-bottom: 4px; color: var(--ink); }
  .tags { display: flex; flex-wrap: wrap; gap: 8px; }
  .tag { border-radius: 999px; padding: 4px 8px; background: #f1f5f9; color: #475569; font-size: 12px; font-weight: 700; }
  .head-text > .link { display: none; }
  .briefing { min-width: 0; min-height: 0; overflow: visible; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); grid-auto-rows: minmax(0, auto); align-content: start; gap: 11px 18px; border-top: 0; padding-top: 0; }
  .brief-section { min-width: 0; }
  .brief-section.wide { grid-column: 1 / -1; }
  .brief-section h2 { margin: 0 0 4px; font-size: 14px; line-height: 1.22; color: #0f766e; letter-spacing: 0; }
  .brief-section p, .brief-section li { margin: 0; font-size: 12.5px; line-height: 1.42; color: #1f2937; overflow-wrap: anywhere; }
  .brief-section ul { margin: 0; padding-left: 20px; }
  .concepts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 9px 14px; }
  .concept { border-top: 1px solid var(--line); padding-top: 7px; }
  .concept h3 { margin: 0 0 4px; font-size: 13px; color: #7c2d12; letter-spacing: 0; }
  .concept p { margin: 2px 0 0; font-size: 11.5px; line-height: 1.35; color: #374151; overflow-wrap: anywhere; }
  .concept b { color: #111827; }
  .link { color: var(--accent); font-weight: 800; text-decoration: none; }
  .empty { padding: 48px; background: var(--paper); border: 1px solid var(--line); border-radius: 12px; color: var(--muted); }
  @media (max-width: 860px) {
    .shell { padding: 14px; }
    .topbar, .top-actions { align-items: stretch; flex-direction: column; }
    .slide, .briefing, .concepts { grid-template-columns: 1fr; }
    .slide { min-height: auto; overflow: visible; display: grid; }
    h1 { font-size: 28px; }
  }
</style>

<script>
const slides = [{"title": "Deep learning approach for ARPES and time-resolved ARPES: Gradient attention U-net for denoising and reconstruction", "journal": "PRB_Recent", "source": "keyword", "link": "http://link.aps.org/doi/10.1103/53wd-bg7k", "authors": "Gongyi Cheng, Ziyang Guo, Zhengcong Yan, et al.", "last_authors": "Shijing Tan, Bing Wang", "summary": "Data analysis in angle-resolved photoemission spectroscopy (ARPES) and time-resolved ARPES usually employs derivative-based methods, such as second derivative and maximum curvature, to enhance spectral visibility. Despite their widespread use, these methods are prone to noise amplification and the i…", "tier": "A_MUST_READ", "score": "10", "reason": "title strong match: ARPES", "tags": ["ARPES", "angle-resolvedphotoemission", "photoemission"], "image": "", "briefing": {"background": "ARPES 및 시간 분해 ARPES(tr-ARPES)는 고체 내 전자 구조를 직접 관찰하는 핵심 도구이지만, 실험 데이터에는 산란된 빛이나 검출기 특성으로 인한 배경 잡음이 항상 포함됩니다.", "motivation": "밴드 구조를 명확히 보기 위해 2차 미분이나 최대 곡률(maximum curvature) 방식을 흔히 쓰지만, 이들은 잡음을 증폭시키고 데이터의 정량적 신뢰도를 떨어뜨리는 문제가 있습니다.", "result": "Gradient Attention U-net(GA-Unet)이라는 딥러닝 아키텍처를 개발하여, ARPES 데이터의 잡음을 제거하고 밴드 구조를 정밀하게 재구성하는 데 성공했습니다.", "implication": "매우 낮은 신호 대 잡음비(SNR)를 가진 데이터에서도 선명한 분산 관계를 추출할 수 있어, 측정 시간이 제한적인 tr-ARPES나 작은 시편 측정 효율을 획기적으로 높일 수 있습니다.", "novelty": "기존의 일반적인 잡음 제거 AI와 달리, ARPES 데이터 특유의 기울기(gradient) 변화와 물리적 연속성에 주목한 어텐션 메커니즘을 도입하여 물리 데이터에 최적화했습니다.", "unresolved": "AI가 학습하지 못한 아주 특이한 물리적 변칙(anomaly)을 잡음으로 오인하여 지워버릴 가능성에 대한 엄밀한 검증이 추가로 필요할 수 있습니다.", "future_work": "실시간 데이터 수집 시스템에 통합하여, 실험 중에 즉각적으로 고해상도 재구성 영상을 확인하는 기술로 발전할 것으로 보입니다.", "concepts": [{"term": "Gradient Attention U-net", "why_emerged": "이미지 처리에서 우수한 U-net 구조에 데이터의 미분 특성을 강조하는 어텐션을 추가하여 ARPES 밴드 구조를 보존하기 위해 등장했습니다.", "origin": "초록 정보만으로는 특정하기 어려움 (본 연구팀 제안)", "connections": "U-net, Transformer attention, 2nd derivative method"}, {"term": "Spectral Visibility", "why_emerged": "밴드 분산(dispersion)이 배경 신호에 묻혀 보이지 않을 때 이를 시각적으로 구분해내는 능력을 의미합니다.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "Signal-to-noise ratio, Contrast-to-noise ratio"}], "english_summary": ["Introduced GA-Unet, a deep learning framework for denoising and reconstructing ARPES and tr-ARPES spectra.", "Outperforms traditional derivative-based methods by enhancing band visibility without amplifying noise.", "Demonstrates robust performance even under low signal-to-noise ratio conditions.", "Potential to significantly accelerate data acquisition and analysis in electronic structure studies."]}}, {"title": "Unified First-Principles Formula for Time-Resolved ARPES Spectra of Coherent and Incoherent Excitons beyond the Dilute Limit", "journal": "PRL_Recent", "source": "keyword", "link": "http://link.aps.org/doi/10.1103/zhs1-rv1k", "authors": "Gianluca Stefanucci, Enrico Perfetto", "last_authors": "Gianluca Stefanucci, Enrico Perfetto", "summary": "Despite major experimental progresses in time-resolved and angle-resolved photoemission spectroscopy, a quantitative, microscopic framework for interpreting exciton-induced modifications of electronic band structures—applicable even beyond the low-density limit—is still lacking. Here, we close this gap by introducing a unified approach that links the dynamics of coherent and incoherent excitons to distinct and experimentally observable excitonic sidebands. Our central result is a general, first-principles formula for time-resolved photoemission spectra, applicable across a broad range of temperatures, excitation densities, and pump-probe delays. This advance provides a predictive tool for quantitatively tracking excitonic dynamics in complex materials.", "tier": "A_MUST_READ", "score": "10", "reason": "title strong match: ARPES", "tags": ["ARPES", "angle-resolvedphotoemission", "photoemission", "bandstructure"], "image": "", "briefing": {"background": "광흡수에 의해 형성된 엑시톤(exciton)은 고체의 전자 구조를 변형시키며, 이는 시간 분해 ARPES(tr-ARPES)를 통해 관찰할 수 있는 중요한 물리 현상입니다.", "motivation": "엑시톤 밀도가 낮은 경우에 대한 이론은 존재했으나, 실제 실험에서 빈번하게 발 s.g.doubleclick.net/gampad/ad?iu=/285/npjquantmats.nature.com/article&sz=728x90&c=-1955443731&t=pos%3Dtop%26type%3Darticle%26artid%3Ds41535-026-00919-y%26doi%3D10.1038/s41535-026-00919-y%26subjmeta%3D301,639,766%26kwrd%3DMaterials+science,Physics", "briefing": {"background": "구리 산화물(cuprates) 고온 초전도체에서 초전도성은 쿠퍼 쌍의 생성(pairing amplitude)과 이들의 위상 정렬(phase coherence)이라는 두 가지 요소에 의해 결정됩니다.", "motivation": "빛(광 펄스)을 조사했을 때 초전도 상태가 붕괴하거나 변하는 과정에서, 이것이 단순히 쌍이 깨지는 것인지 아니면 위상 요동(phase fluctuations)에 의한 것인지 규명하고자 했습니다.", "result": "tr-ARPES를 통해 광 유도 과정에서 발생하는 초전도 위상 요동의 직접적인 증거를 관측하였으며, 이것이 전체적인 초전도성 억제에 핵심적인 역할을 함을 확인했습니다.", "implication": "광 유도 초전도나 초전도 상전이 동역학 연구에서 '위상'의 역할이 매우 중요하다는 것을 확인시켜 주며, 비평형 상태의 제어 가능성을 시사합니다.", "novelty": "전통적인 ARPES로는 구분이 어려운 초전도 갭의 크기 변화와 위상 요동의 기여도를 시간 분해능을 통해 직접적으로 분리해낸 점이 중요합니다.", "unresolved": "이러한 위상 요동이 소재의 도핑 농도나 결정 구조(예: 단일층 vs 다중층)에 따라 어떻게 정량적으로 변하는지에 대한 추가 연구가 필요합니다.", "future_work": "다른 비전통적 초전도체(예: 철 기반 초전도체, 니켈레이트)에서도 유사한 광 유도 위상 요동이 나타나는지 비교 연구가 진행될 것으로 보입니다.", "concepts": [{"term": "Phase Fluctuations", "why_emerged": "초전도 질서 매개변수(order parameter)의 진폭은 살아있으나 그 위상이 무질서해져 초전도성이 사라지는 현상을 설명하기 위해 제안되었습니다.", "origin": "초록 정보만으로는 특정하기 어려움 (V.J. Emery, S.A. Kivelson 등 이론가들이 주로 논의)", "connections": "Kosterlitz-Thouless transition, Pseudogap, Superconducting dome"}, {"term": "Light-induced Phase", "why_emerged": "외부 광자 에너지를 이용해 물질의 위상 상태나 초전도 상태를 초고속으로 제어하려는 시도에서 비롯되었습니다.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "Photo-excited states, Non-equilibrium dynamics, Floquet engineering"}], "english_summary": ["Reported direct evidence of light-induced phase fluctuations in cuprate superconductors using tr-ARPES.", "Distinguished between pairing amplitude suppression and phase decoherence in the non-equilibrium state.", "Highlights the critical role of phase dynamics in the optical control of superconductivity.", "Relevant for understanding the fundamental mechanism of high-Tc superconductivity under ultrafast excitation."]}}, {"title": "P ni", "link": "https://doi.org/10.1126/sciadv.aea3611", "authors": "Xiangwen Wang, Yihao Wei, Anupam Bhattacharya, Qian Yang, Artem Mishchenko", "last_authors": "Qian Yang, Artem Mishchenko", "summary": "Flat electronic bands are a fertile ground for exotic quantum phenomena, from unconventional superconductivity to fractional topology. However, their rarity and the reliance on density functional theory (DFT) calculations for identification have limited systematic exploration across large material spaces. Here, we report the discovery of multiple previously unrecognized flat-band two-dimensional materials through a structure-informed, data-driven framework. We introduce a physically motivated flatness score that combines band dispersion and density-of-states features, enabling algorithmic labeling of known materials without requiring manual inspection. This score is then used to train a multimodal deep learning model that predicts flat-band propensity directly from atomic structure. Applied to more than 10,000 unlabeled materials, our framework identifies numerous flat-band candidates. Among the top-scoring structures (flatness score higher than 0.9), DFT calculations on materials with kagome-like lattices confirm a flat-band prediction accuracy of 98%, demonstrating the ability to discover topologically nontrivial systems. By bypassing the need for precomputed band structures, our approach enables large-scale, interpretable screening and expands the design space for correlated quantum phases in low-dimensional systems.", "tier": "B_IMPORTANT_CONDMAT", "score": "9", "reason": "Computational discovery of flat-band 2D materials, including kagome-like, highly relevant for user's interests.; demoted from A: broad CM, not direct user/project hit", "tags": ["2Dmaterials", "flatbands", "kagome", "unconventionalsuperconductivity", "topologicalmaterials", "computationalmaterialsdiscovery", "correlatedelectrons"], "image": "", "briefing": {"background": "평탄 밴드(flat band)는 강한 전 nd electron-phonon interactions in infinite-layer nickelates by combining first-principles calculations with the fluctuation-exchange-Migdal-Eliashberg theory. Our calculations show that spin fluctuations yield robust $d$-wave superconductivity on the Ni $d_{x^2-y^2}$ orbital, whereas electron-phonon coupling induces $s$-wave pairing on an interstitial orbital, leading to an $s+id$ superconducting state. The emergence of the $s$-wave component is strongly carrier-density dependent: an intermediate electron-phonon coupling of $\\lambda=0.4$ stabilizes the $s+id$ state at $n=0.9$ but not at $n=0.8$. These results imply that local oxygen defects tune the local electron density and form finite-size domains with distinct pairing symmetries, offering a compelling explanation for the spatially inhomogeneous superconducting symmetries observed in experiments.", "tier": "B_IMPORTANT_CONDMAT", "score": "9", "reason": "Electronic structure and superconductivity of infinite-layer nickelates.", "tags": ["nickelate", "superconduct", "electronic-structure"], "image": "https://arxiv.org/html/2607.12773v1/x1.png", "briefing": {"background": "무한층 니켈산염(infinite-layer nickelates)은 구리 산화물 초전도체(cuprates)와 전자 구조가 유사하여 고온 초전도 메커니즘을 규명하는 핵심 후보군으로 연구되고 있습니다.", "motivation": "최근 터널링 실험에서 무한층 니켈산염의 초전도 대칭성이 공간적으로 불균일하게 나타나는 현상이 관찰되어, 그 미시적 원인을 규명하고자 합니다.", "result": "스핀 요동(spin fluctuations)에 의한 d-파 초전도와 전자-포논 결합에 의한 s-파 초전도가 경쟁하며, 특정 도핑 환경에서 s+id 상태가 형성됨을 보였습니다.", "implication": "실험에서 관찰된 공간적 불균일성은 산소 결함에 따른 국소적인 캐리어 밀도 변화가 초전도 대칭성을 국부적으로 변화시킨 결과일 가능성을 제시합니다.", "novelty": "전자 상관관계와 전자-포논 결합의 경쟁을 통해 복합적인 초전도 질서 변수를 도출했으며, 니켈산염 특유의 실험적 불균일성을 이론적으로 체계화했습니다.", "unresolved": "실제 샘플에서의 국소적인 산소 결함 분포가 s+id 위상과 일대일로 대응하는지에 대한 직접적인 실험적 증거는 추가 연구가 필요합니다.", "future_work": "니켈산염 박막에서 국소적인 캐리어 도핑 제어를 통한 초전도 대칭성 변조 실험 및 추가적인 ARPES/STS 연구가 기대됩니다.", "concepts": [{"term": "s+id 초전도", "why_emerged": "시간 반전 대칭성이 깨진 복합적인 초전도 질서 변수를 설명하기 위해 도입됨", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "고온 초전도체의 d-파 대칭성, 위상 초전도체"}, {"term": "무한층 니켈산염", "why_emerged": "구리 산화물 초전도체와 유사한 전자 상태를 저차원 시스템에서 구현하고자 함", "origin": "Li et al., Nature (2019)", "connections": "cuprates, 3d 전이금속 산화물"}], "english_summary": ["Infinite-layer nickelates exhibit spatially inhomogeneous superconductivity in tunneling experiments.", "Competition between spin fluctuations and electron-phonon coupling suggests an s+id pairing state.", "The s-wave component depends on carrier density, likely tuned by local oxygen defects.", "This framework explains experimental observations of varying superconducting symmetries."]}}, {"title": "Phase-shifted multicomponent spin-charge nematicity in an altermagnet", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2607.12824", "authors": "Christopher Candelora, Siyu Cheng, Muxian Xu, et al.", "last_authors": "Ziqiang Wang, Ilija Zeljkovic", "summary": "Altermagnets host spin-split Fermi surfaces without net magnetization. This intrinsically multicomponent electronic setting raises the possibility that familiar correlated electron phases acquire unconventional spin-charge structure. Here we report the discovery of altermagnetic nematicity in Co0.25NbSe2. Using spectroscopic-imaging scanning tunneling microscopy and spin-polarized scanning tunneling microscopy, we find that the three nominally C3-related directions lose rotational equivalence in the zero-field state, in both charge and spin-sensitive tunneling channels. Strikingly, the dominant spin-sensitive component is shifted by one C3 sector relative to the dominant charge component, revealing a phase-shifted spin-charge nematic response. A phenomenological theory shows that altermagnetic order favors a finite relative phase between the charge and spin-sensitive nematic components -- C3 lattice pinning frustrates this preferred offset and selects the observed phase locking. These results establish altermagnetic nematicity as a new form of multicomponent electronic liquid-crystal order and point to a potentially generic route by which altermagnets can transform conventional correlated phases into symmetry-engineered spin-charge orders.", "tier": "B_IMPORTANT_CONDMAT", "score": "9", "reason": "Direct experimental study (STM/spin-STS) of altermagnetism and nematicity in a relevant material (NbSe2).", "tags": ["STM", "altermagnet", "nematicity"], "image": "https://arxiv.org/html/2607.12824v1/x1.png", "briefing": {"background": "알터마그넷(altermagnet)은 순 자화가 없으면서도 스핀 분리된 페르미 표면을 가져, 자성체와 비자성체의 특성을 모두 갖춘 새로운 물질군으로 주목받고 있습니다.", "motivation": "알터마그넷 내부의 복합적인 전자 상태가 기존의 질서 변수와 어떻게 결합하는지 확인하고, 특히 네마틱(nematic) 질서와의 상호작용을 연구하고자 합니다.", "result": "Co0.25NbSe2에서 전하와 스핀 채널의 네마틱 질서가 서로 위상 차이를 가지고 결합하는 '알터마그네틱 네마틱' 상태를 발견했습니다.", "implication": "알터마그네틱 질서가 통상적인 전자 질서 변수에 스핀-전하 결합을 부여하여 새로운 유형의 대칭성 파괴를 유도할 수 있음을 입증했습니다.", "novelty": "STM 및 스핀 편극 STS를 통해 알터마그넷 내에서 스핀과 전하의 네마틱 성분이 독립적이면서도 위상적으로 고정되어 있음을 직접 시각화했습니다.", "unresolved": "이러한 위상 차이가 격자 구조와 결합하여 고정되는 구체적인 미시적 상호작용 메커니즘은 추가 규명이 필요합니다.", "future_work": "다양한 알터마그넷 화합물에서 이와 같은 다성분 네마틱 현상의 보편성을 검증하는 후속 연구가 예상됩니다.", "concepts": [{"term": "알터마그넷", "why_emerged": "기존 강자성/반강자성으로 분류되지 않는 스핀 분리된 비자성 상태를 설명하기 위해 제안됨", "origin": "Šmejkal et al., PRX (2022)", "connections": "반강자성 spintronics, 베리 곡률"}, {"term": "스핀-전하 네마틱", "why_emerged": "전자 액체 결정 상태에서 스핀과 전하의 대칭성 파괴가 서로 얽혀 있음을 설명하기 위해 도입됨", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "네마틱 액정, 전자 질서 변수"}], "english_summary": ["Altermagnets host spin-split Fermi surfaces without net magnetic moments.", "Observation of 'altermagnetic nematicity' in Co0.25NbSe2 using spin-polarized STM.", "Charge and spin-sensitive nematic components exhibit a phase-shifted locking mechanism.", "This provides a template for engineering spin-charge orders in correlated electron liquids."]}}, {"title": "Sign-resolved nanoscale readout and control of hidden antiferromagnetic spin order", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2604.21802", "authors": "A. Schmid, D. Siebenkotten, D. Dai, et al.", "last_authors": "B. K\\\"astner, J. Wunderlich", "summary": "Antiferromagnetic memories promise ultrafast, stray-field-free information storage. Yet perfect magnetic compensation conceals the information carrier itself: the sign of the N\\'eel vector distinguishing two time-reversed states. Moreover, in future dense memories, the local polarity of N\\'eel domains would need to be read out on the nanoscale. We make this hidden polarity visible in a fully-compensated, high-N\\'eel-temperature, PT-symmetric antiferromagnet by driving interband electric-dipole transitions by mid-infrared near-fields confined at a scanning probe. The excitation generates a N\\'eel-order-dependent quantum-metric photocurrent, a Hall-like signal reversing with N\\'eel order, which we term the optical nonlinear anomalous Hall effect. This optically induced electrical readout maps opposite N\\'eel polarities with sub-100-nm resolution at room temperature and, combined with spin-orbit-torque writing, reveals N\\'eel-texture polarization and reversible domain-wall motion, establishing electrical-write/optoelectronic-read antiferromagnetic functionality.", "tier": "B_IMPORTANT_CONDMAT", "score": "9", "reason": "Direct relevance to anomalous Hall effect and antiferromagnetic spintronics experiments.", "tags": ["antiferromagnetism", "anomalousHall", "spintronics"], "image": "https://arxiv.org/static/browse/0.3.4/images/arxiv-logo-fb.png", "briefing": {"background": "반강자성체는 자성 정보가 외부에 드러나지 않아 메모리 소자로서 매우 유망하지만, 이 '숨겨진' 정보를 어떻게 전기적으로 읽고 쓰는지가 핵심 난제입니다.", "motivation": "완전히 보상된(compensated) 반강자성체의 닐(Néel) 벡터 정보를 나노 스케일에서 비침습적으로 읽어내기 위한 새로운 방식을 개발하고자 했습니다.", "result": "적외선 근접장과 스캔 프로브를 이용하여 닐 정렬 방향에 따라 부호가 반전되는 '비선형 광학 이상 홀 효과'를 성공적으로 측정했습니다.", "implication": "반강자성체를 이용한 고밀도 전기적 쓰기 및 광학적 읽기 방식의 메모리 소자 구현 가능성을 제시했습니다.", "novelty": "비침습적 광학 탐침 기술로 반강자성 도메인의 극성을 직접 읽어냈으며, 스핀 궤도 토크(SOT)와 결합하여 전체 소자 운용 과정을 시연했습니다.", "unresolved": "고온 환경에서의 장기적인 안정성과 대면적 소자로의 확장성, 그리고 더 빠른 읽기 ansport", "theory"], "image": "", "briefing": {"background": "그래핀은 디락 페르미온을 가지는 대표적인 물질로, 외부 전자기장을 이용해 밴드 구조를 변조하는 플로케 공학(Floquet engineering)의 주요 실험 플랫폼입니다.", "motivation": "케쿨레(Kekulé) 변형이 가해진 그래핀에서 고주파 전자기장 구동이 전자 및 엑시톤의 터널링과 수송 특성을 어떻게 제어할 수 있는지 이론적으로 규명하고자 합니다.", "result": "고주파 전자기장이 잠재적 장벽(potential barrier)에서의 전자/엑시톤 차단 및 터널링 현상을 비평형 상태에서 조절할 수 있음을 보였습니다.", "implication": "그래핀 기반의 소자에서 외부 빛을 이용한 동적인 수송 제어가 가능하며, 양자 정보 소자 및 비평형 상태의 엑시톤 제어 연구에 기여할 수 있습니다.", "novelty": "기존 그래핀 연구가 정적 구조에 집중했다면, 본 연구는 케쿨레 격자 왜곡이 존재하는 그래핀에서 플로케 구동을 통해 동적인 수송 제어를 제안했다는 점에서 차별화됩니다.", "unresolved": "실제 실험적 구현을 위한 레이저 출력 및 샘플의 위상학적 안정성에 대한 구체적인 환경 설정은 논의가 부족합니다.", "future_work": "구동 주파수와 잠재적 장벽의 비선형적 상호작용에 따른 위상학적 위상 전이 연구가 뒤따라야 할 것입니다.", "concepts": [{"term": "Floquet engineering", "why_emerged": "시스템의 밴드 구조를 외부의 주기적인 시간 구동을 통해 원하는 대로 조절하기 위해.", "origin": "Shirley (1965) 등의 초기 이론적 토대 위에 최근 광학 제어 기술의 발전으로 정립.", "connections": "디락 물질의 밴드 갭 오프닝, 플로케 위상 절연체."}, {"term": "Kekulé distortion", "why_emerged": "그래핀 격자의 삼량체화(trimerization)를 통해 디락 점에 밴드 갭을 유도하기 위해.", "origin": "Kekulé (1865)의 벤젠 구조 개념에서 차용.", "connections": "전자적 상전이, 위상학적 디락 반금속."}], "english_summary": ["Explores Floquet-driven electron and exciton transport in Kekulé-distorted graphene.", "High-frequency field acts as a control knob for tunneling and barrier blocking.", "Provides theoretical insight into dynamical control of Dirac fermions in twisted honeycomb structures."]}}, {"title": "Low-temperature spin dynamics and absence of magnetic order in layered α−RuI3", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/kxbj-gp8z", "authors": "Hank C. H. Wu, Benjamin M. Huddart, Francis L. Pratt, Danrui Ni, Robert J. Cava, Stephen J. Blundell", "last_authors": "Robert J. Cava, Stephen J. Blundell", "summary": "Quantum spin liquids are long-sought for their elusive, never-frozen magnetic states. In layered α -RuI 3 , magnetic Ru ions form a honeycomb network related to the Kitaev material α -RuCl 로 규명한 점이 돋보입니다.", "unresolved": "실제 고체 시료에서의 결함이 동적 재진입 현상에 미치는 영향에 대한 구체적인 분석은 아직 부족합니다.", "future_work": "실제 실험적으로 이 동적 위상 변화를 관찰하고, 진동 주파수와 스카이머 안정성 사이의 관계를 최적화하는 후속 연구가 필요합니다.", "concepts": [{"term": "스카이머", "why_emerged": "비자성 물질의 소용돌이 모양 스핀 구조가 나타내는 위상학적 보호를 활용하기 위해 제안됨.", "origin": "Tony Skyrme(1962), 자성체에서는 정형화된 모델이 2009년경 실험적으로 발견됨.", "connections": "위상 절연체, 홀 효과, 스핀트로닉스 소자."}, {"term": "Dzyaloshinskii-Moriya 상호작용", "why_emerged": "반전 대칭성이 깨진 계에서 스핀들 사이의 비공선적 정렬을 설명하기 위해 도입됨.", "origin": "Dzyaloshinskii(1958), Moriya(1960).", "connections": "카이럴 자성, 스카이머 형성."}], "english_summary": ["Investigates the behavior of 2D magnets with Dzyaloshinskii-Moriya interactions under oscillating magnetic fields.", "Uses Monte Carlo simulations to demonstrate a dynamically reentrant skyrmion phase.", "Highlights the potential for dynamic control of topological magnetic structures.", "Provides insights into nonequilibrium topological matter response."]}}, {"title": "Multiferroicity in the Two-Dimensional Limit in Hexagonal LuFeO3 Films", "journal": "PRL_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/zxsb-7cj3", "authors": "Huilin Lai, Junyu Tan, Jinfeng Zhai, et al.", "last_authors": "Wenbin Wang, Jian Shen", "summary": "Multiferroic oxides, which host coexisting ferroelectric and magnetic orders, are central to understanding correlated quantum phenomena. Yet, as thickness approaches the two-dimensional (2D) limit, both ferroelectricity and magnetism are generally expected to be strongly suppressed by depolarization…", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Experimental study of multiferroicity in 2D LuFeO3 films, relevant to correlated systems.", "tags": ["multiferroics", "2Dmaterials", "ferroelectricity", "magnetism", "correlatedelectronsystems", "experimental"], "image": "", "briefing": {"background": "멀티페로익(Multiferroic) 물질은 전기적 분극과 자기적 질서가 공존하여 두 속성 간의 강한 결합을 제공합니다. 이는 차세대 저전력 스핀트로닉스 및 메모리 소자에 핵심적인 물리적 현상입니다.", "motivation": "초록 정보만으로는 분야 내부의 구체적 동기를 안정적으로 요약하기 어렵습니다.", "result": "박막화된 2차원 극한 영역의 LuFeO3에서 박막의 두께 한계를 극복하고 멀티페로익 성질을 성공적으로 관찰했습니다.", "implication": "초박막 구조에서도 기능성 양자 질서가 유지될 수 있음을 보여주며, 이는 2차원 자성/강유전체 이종접합 소자의 설계 가능성을 높입니다.", "novelty": "2D 극한에서 일반적으로 억제되는 것으로 알려진 강유전성과 자기성을 유지하여 2D 멀티페로익 소자의 실험적 근거를 확보했습니다.", "unresolved": "박막의 두께와 표면 경계면의 결함이 물리적 결합 강도에 미치는 정량적 효과는 아직 완전히 이해되지 않았습니다.", "future_work": "다양한 두께의 샘플을 통한 전이 온도 측정 및 분극과 자화 간의 직접적인 스위칭 테스트가 요구됩니다.", "concepts": [{"term": "멀티페로익", "why_emerged": "하나의 물질에서 전기적/자기적 상태를 동시에 제어하여 소자 효율을 극대화하기 위해 필요.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "스핀-전하 결합, 자기전기 효과."}, {"term": "탈분극 필드", "why_emerged": "박막 두께가 줄어들 때 표면 전하 분포로 인해 강유전성을 파괴하려는 내부 전기장이 발생하여 문제됨.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "2차원 강유전성, 박막 안정성."}], "english_summary": ["Explores multiferroicity in LuFeO3 thin films as they approach the 2D limit.", "Demonstrates coexistence of ferroelectric and magnetic orders in 2D systems.", "Challenges the expectation of order suppression due to depolarization fields.", "Paves the way for integrated 2D functional quantum devices."]}}, {"title": "Tailoring Pure Valley-Zeeman Spin-Orbit Coupling in WSe2-Encapsulated Monolayer Graphene", "journal": "PRL_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/46n3-pryp", "authors": "Yaqing Han, Siqi Jiang, Jingkuan Xiao, et al.", "last_authors": "Lei Wang, Geliang Yu", "summary": "Clearly resolved Landau levels reveal a symmetry-enforced Landau-level reordering driven by competition between fixed valley–Zeeman splitting and magnetic-field-dependent cyclotron energy.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Direct experimental study of Landau level reordering in van der Waals heterostructures.", "tags": ["graphene", "vdw", "Landaulevel"], "image": "", "briefing": {"background": "반데르발스 이종접합은 원자 수준의 정밀도로 밴드 구조를 설계할 수 있는 환경을 제공합니다. 그래핀과 같은 물질에 이종접합을 도입하면 스핀-궤도 결합(SOC)을 인위적으로 조절할 수 있습니다.", "motivation": "WSe2와 그래핀 이종접합에서 밸리-제만(Valley-Zeeman) 상호작용과 자기장 유도 란다우 준위(Landau level) 간의 경쟁을 제어하여 전자 구조를 재구성하고자 합니다.", "result": "란다우 준위의 재정렬(reordering)을 직접 관찰하였으며, 이는 고정된 밸리-제만 분리와 에너지 준위 간의 경쟁에 의해 유도됨을 입증했습니다.", "implication": "반데르발스 이종접합을 통해 물질의 전자 준위를 튜닝하여 토폴로지 특성을 엔지니어링할 수 있는 강력한 툴을 제공합니다.", "novelty": "란다우 준위가 외부 자기장에 반응하는 메커니즘을 명확히 규명하여 2D 물질의 전자 구조 설계 능력을 입증했습니다.", "unresolved": "이종접합 계면에서의 미세한 격자 불일치가 이러한 전자 구조 조절에 미치는 비균질성 문제가 존재합니다.", "future_work": "이러한 준위 재정렬이 비정상 홀 효과나 토폴로지 수송 현상에 미치는 영향에 대한 추가적인 측정이 필요합니다.", "concepts": [{"term": "밸리-제만 스핀-궤도 결합", "why_emerged": "그래핀의 밸리 자유도를 스핀과 결합시켜 밸리 선택적인 물리 현상을 구현하기 위해 필요.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "스핀트로닉스, 밸리트로닉스, 위상 수송."}, {"term": "란다우 준위", "why_emerged": "자기장 내에서 하전 입자가 원운동을 하며 에너지가 불연속적으로 양자화되는 현상을 설명하기 위해 도입.", "origin": "Lev Landau(1930).", "connections": "양자 홀 효과, 비소모성 수송."}], "english_summary": ["Examines Landau level reordering in WSe2-encapsulated monolayer graphene.", "Shows competition between Valley-Zeeman splitting and magnetic-field-dependent cyclotron energy.", "Provides experimental control over electronic structure in vdW heterostructures.", "Relevant for topological engineering and valleytronics."]}}, {"title": "Antiferroelectric thin films embedded with ferroelectric switching loop for giant negative electrocaloric effect", "journal": "Science_Advances", "source": "Gemini", "link": "https://doi.org/10.1126/sciadv.aed5447", "authors": "Peipei Su, Jianchu Chen, Junning Li, et al.", "last_authors": "Xiangli Zhong, Gaokuo Zhong", "summary": "The ferroics combine the single-hysteresis loop of ferroelectrics with the double-hysteresis loop of antiferroelectrics to form multiple hysteresis loops, which could substantially advance energy storage, electrocaloric cooling, and nonvolatile multistate memory technologies. However, the intentional stabilization of intermediate states that bridge the nonvolatility of ferroelectrics and the field-induced phase transition behavior of antiferroelectrics remains a fundamental challenge. Here, we propose a strategy for preparing lead zirconate (PbZrO 3 ) thin film at low temperature, introducing a stable ferrielectric phase within the antiferroelectric to achieve triple-hysteresis loop under large electric fields. Microstructural features reveal that this behavior is attributable to the presence of Pb Zr antisite defects acting as seeds for polar order, which induce the distinctive triple (↑↑↓) dipole modulation period configuration. To demonstrate the application potential, we evaluated the electrocaloric effect of triple-hysteresis PbZrO 3 thin film based on Maxwell’s relations, the predicted temperature change Δ T can reach −23.76 kelvins, which is ~600% enhancement compared to double-hysteresis PbZrO 3 antiferroelectric thin films. These findings establish a design paradigm for embedding stable ferroelectric switching within antiferroelectrics, which may unlock opportunities for developing high-density energy storage, nonvolatile multistate memory, and highly efficient switching devices.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Ferroelectric/antiferroelectric thin films and electrocaloric effect are relevant strongly correlated materials science.", "tags": ["ferroelectrics", "antiferroelectrics", "thinfilms", "stronglycorrelated", "materialsscience"], "image": "", "briefing": {"background": "강유전체(ferroelectrics)와 반강유전체(antiferroelectrics)는 에너지 저장 장치 및 고속 메모리의 핵심 소재로, 전기장 하에서의 쌍극자 배향 거동에 따라 고유한 이력 곡선(hysteresis loop)을 나타냅니다.", "motivation": "반강유전체의 에너지 저장 밀도와 강유전체의 비휘발성 특성을 동시에 구현할 수 있는 중간 상태의 제어가 어려워, 이를 해결하기 위한 새로운 박막 설계 전략이 필요했습니다.", "result": "PbZrO3 박막에서 Pb-Zr 반자리 결함(antisite defects)을 유도하여 3중 이력 곡선(triple-hysteresis loop)을 실현하였으며, 이를 통해 기존 반강유전체 대비 약 600% 향상된 -23.76K의 거대 음의 전기열량 효과(electrocaloric effect)를 확인했습니다.", "implication": "이 결과는 결함 공학을 통해 위상 간 안정성을 조절함으로써 고밀도 에너지 저장 및 다중 상태 메모리 소자 설계의 새로운 패러다임을 제시합니다.", "novelty": "외부 전기장에 의한 상전이 특성을 제어하여 전기열량 효율을 극대화한 점이 중요하며, 강한 상관계 전자계 연구에서 결함이 거시적 물성에 미치는 정밀 제어 사례로서 가치가 있습니다.", "unresolved": "Pb-Zr 반자리 결함의 농도와 분포를 극도로 정밀하게 제어하는 양산 공정 기술은 아직 과제로 남아 있습니다.", "future_work": "다양한 페로브스카이트 산화물 박막으로의 확장과 결함 밀도에 따른 전기열량 특성 변화에 대한 정량적 모델링 연구가 기대됩니다.", "concepts": [{"term": "전기열량 효과(Electrocaloric Effect)", "why_emerged": "전기장을 가했을 때 물질의 엔트로피 변화로 발생하는 온도 변화를 이용하여 친환경 냉각 기술을 구현하고자 함.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "자기열량 효과(Magnetocaloric effect)와 대칭적인 물리학적 기원을 가짐."}, {"term": "반강유전체(Antiferroelectric)", "why_emerged": "강유전체보다 높은 에너지 저장 밀도를 제공하면서도 전기장 제거 시 분극이 사라지는 독특한 거동을 이용하기 위함.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "강유전체 상전이 및 강상관 물질의 다중 위상 공존 현상과 밀접."}], "english_summary": ["PbZrO3 thin films with triple-hysteresis loops are engineered via Pb-Zr antisite defects.", "The material exhibits a giant negative electrocaloric effect of -23.76 K.", "This represents a ~600% enhancement over conventional double-hysteresis antiferroelectric films.", "The findings suggest a strategy for designing high-density energy storage and multistate memory devices."]}}, {"title": "Commensurate moir\\'e superlattices in anisotropically strained twisted bilayer graphene", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2603.19694", "authors": "Ayan Mondal, Cristina Joseph, Bheema Lingam Chittari", "last_authors": "Cristina Joseph, Bheema Lingam Chittari", "summary": "We investigate how anisotropic strain reorganizes commensurate moir\\'e superlattices and electronic structure in twisted bilayer graphene (TBG) across a finite range of reference twist angles. Motivated by experiments showing robust moir\\'e phenomenology under angular disorder and heterostrain (Kapfer et al., Science 381,677 (2023)), we construct commensurate strained supercells generated by a general anisotropic deformation of the top graphene layer of TBG. The results show that anisotropic strain does not generically destroy the electronic structure of nearby pristine moir\\'e systems; rather, its effect depends sensitively on whether the strained commensurate geometry remains two dimensional or crosses over toward a quasi one dimensional regime. This provides a geometric perspective on the persistence of moir\\'e electronic features over a finite window of twist angle and heterostrain. Within this framework, the allowed strained configurations naturally separate into tilted two dimensional moir\\'e patterns and quasi one dimensional stripe like patterns. We find that several such strained two dimensional solutions occur near a given pristine twist angle, and that nearby solutions retain triangular like AA-region localization, comparable low energy bandwidths, and a low field Hofstadter spectrum close to the unstrained system. In contrast, quasi one dimensional strained configurations show stronger dimensional reduction, reduced Dirac point multiplicity, stripe like spatial localization, and stronger Hofstadter splitting.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Relevant electronic structure analysis of twisted bilayer graphene moiré systems.", "tags": ["graphene", "twistedbilayer", "moire"], "image": "https://arxiv.org/html/2603.19694v2/x1.png", "briefing": {"background": "트위스트 이중층 그래핀(TBG)은 층간 비틀림 각도에 따라 생성되는 모아레 초격자(moiré superlattice) 내에서 강상관 전자 현상과 초전도성이 나타나며, 전자 구조 공학의 핵심 연구 대상입니다.", "motivation": "실험적으로 관찰되는 모아레 현상의 견고함이 불균일한 변형(heterostrain) 환경에서도 유지되는 이유와 그 기하학적 안정성을 이론적으로 규명하고자 했습니다.", "result": "비등방성 변형이 가해지더라도 특정 기하학적 조건 하에서는 모아레 전자 구조가 유지되며, 이는 변형된 격자가 2차원 모아레 패턴을 유지하느냐, 1차원 줄무늬 패턴으로 전이하느냐에 달려 있음을 밝혔습니다.", "implication": "실제 샘플에서 나타나는 각도 불균일성이나 변형이 모아레 물성을 완전히 파괴하지 않는 이유를 설명하며, 향후 밴드 구조 엔지니어링의 이론적 범위를 확장합니다.", "novelty": "모아레 격자의 위상적, 기하학적 안정성을 변형 텐서 관점에서 해석하여, 실험적 재현성을 이론적으로 뒷받침하는 기하학적 프레임워크를 제공합니다.", "unresolved": "변형이 강해질 때 발생하는 2차원-1차원 전이 영역에서의 상세한 전자적 위상 변화와 이로 인한 비전통적 초전도성의 거동은 추가 연구가 필요합니다.", "future_work": "다양한 변형 텐서를 적용한 상황에서 밴드 폭과 호프스태터 스펙트럼(Hofstadter spectrum) 변화에 대한 정밀 계산이 이어질 것으로 보입니다.", "concepts": [{"term": "모아레 초격자(Moiré Superlattice)", "why_emerged": "두 층 이상의 2차원 물질을 겹칠 때 발생하는 격자 불일치가 전자 이동에 주기적인 포텐셜을 생성하여 새로운 밴드 구조를 만들기 위함.", "origin": "Bistritzer와 MacDonald가 2011년 매직 각도 이론에서 구체화.", "connections": "트위스트 그래핀의 강상관성, 평탄 밴드(flat bands) 물리와 연결됨."}, {"term": "호프스태터 스펙트럼(Hofstadter Spectrum)", "why_emerged": "격자 구조 위에서 자기장이 가해졌을 때 전자가 느끼는 에너지 레벨을 기술하기 위해 도입됨.", "origin": "Douglas Hofstadter가 1976년 제시.", "connections": "위상 절연체 및 양자 홀 효과 연구의 핵심."}], "english_summary": ["We model commensurate moiré superlattices in anisotropically strained twisted bilayer graphene.", "The electronic structure remains robust under certain strain configurations, forming 2D moiré patterns.", "Anisotropic strain drives a transition between 2D moiré and 1D stripe-like electronic regimes.", "This framework explains the persistence of moiré features observed in recent experimental heterostrain studies."]}}, {"title": "Emergent toroidal induction in a polar Weyl ferromagnet", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2607.12322", "authors": "Yuuri Suzuki, Yukako Fujishiro, Masataka Mogi, et al.", "last_authors": "Ryotaro Arita, Yoshinori Tokura", "summary": "Spin-orbit coupling (SOC) underpins modern spintronics by enabling the electrical generation of spin torques. Its reciprocal counterpart, in which magnetization dynamics produce electromotive forces through a spin-dependent Berry phase, is known as emergent electromagnetic induction (EEMI). However, this effect has previously been observed only in magnetic textures with spatial gradients, such as domain walls, helices, and skyrmions. Here, we demonstrate that even a spatially uniform ferromagnet can host EEMI through a previously unrecognized Berry-phase mechanism inherent to noncentrosymmetric conductors. In the polar Weyl ferromagnet PrAlGe, an applied alternating current generates spin-orbit torques that drive collective magnetization dynamics. The resulting emergent toroidal moment (T = P \\times M), where (P) is the crystal's polar axis and (M) is the net magnetization, acts as a gauge potential whose time derivative (dT/dt) induces a Hall voltage. This contribution appears specifically in the out-of-phase component of the AC Hall response and scales linearly with frequency, providing direct evidence for EEMI. First-principles calculations further reveal that this toroidal vector encodes the collective motion of Weyl nodes in momentum space. These findings establish \"emergent toroidal induction\" as a new manifestation of spin-orbit entanglement, unifying Berry phase, topology, and spin dynamics while opening a pathway toward intrinsic and energy-efficient spin-charge interconversion.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Study of Berry phase, topology, and spin dynamics in Weyl semimetal PrAlGe.", "tags": ["Weyl", "ferromagnet", "topology"], "image": "https://arxiv.org/static/browse/0.3.4/images/arxiv-logo-fb.png", "briefing": {"background": "베리 위상(Berry phase)은 고체 내 전자의 스핀-궤도 결합(SOC)과 토폴로지적 특성을 결정짓는 핵심 요소로, 최근에는 자성체에서의 스핀 동역학과 전기적 응답을 연결하는 연구가 활발합니다.", "motivation": "자성 도메인 벽과 같은 공간적 기울기가 없는 균일한 강자성체에서도 베리 위상 기원인 창발적 전자기 유도(EEMI)가 일어날 수 있는지 탐구하고자 했습니다.", "result": "비중심대칭(noncentrosymmetric) Weyl 강자성체인 PrAlGe에서, 창발적 토로이달 모멘트(toroidal moment)의 시간 변화가 홀 전압을 유도한다는 사실을 확인했습니다.", "implication": "공간적 기울기 없이도 Weyl 노드의 운동이 토로이달 모멘트로 인코딩되어 전기적 신호로 변환될 수 있음을 증명하여, 고효율 스핀-전하 변환 소자 설계의 가능성을 열었습니다.", "novelty": "기존의 비균일한 자성 구조체에서만 가능했던 창발적 현상을 균일한 Weyl 자성체로 확장했으며, 이를 Weyl 노드의 모멘텀 공간 이동과 직접 연결한 점이 매우 혁신적입니다.", "unresolved": "실제 상온 운용 가능한 위상 자성체에서의 토로이달 유도 효율 최적화 및 노이즈 제어 방안이 남아 있습니다.", "future_work": "다양한 위상 자성 물질에서 토로이달 모멘트 기반의 스핀-토크 제어 실험 및 비평형 상태에서의 Weyl 노드 동역학 연구가 예상됩니다.", "concepts": [{"term": "창발적 전자기 유도(Emergent Electromagnetic Induction)", "why_emerged": "자성체의 동역학이 게이지 장(gauge field)을 형성하여 전자에게 유도 기전력을 발생시키는 현상을 기술하기 위함.", "origin": "Volovik 및 유사 이론가들이 베리 곡률과 자성 동역학의 연결을 통해 제안.", "connections": "스카이르미온, 스핀-궤도 토크 및 Berry phase 물리학과 연결됨."}, {"term": "토로이달 모멘트(Toroidal Moment)", "why_emerged": "자기 모멘트와 전기 편극의 외적(P x M)으로 정의되는 물리량으로, 시간 반전 및 공간 반전 대칭성을 동시에 깨는 시스템을 기술하기 위해 필요함.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "멀티페로익(multiferroic) 물질 및 비자명한 자성 위상과 연관."}], "english_summary": ["Emergent toroidal induction is observed in the polar Weyl ferromagnet PrAlGe.", "The effect occurs in uniform ferromagnets via the collective motion of Weyl nodes in momentum space.", "The emergent toroidal moment (T=P x M) acts as a gauge potential inducing a Hall voltage.", "This unifies Berry phase, topology, and spin dynamics, offering a path for energy-efficient spin-charge interconversion."]}}, {"title": "Halogen control of magnetic competition in Kitaev candidate RuX3 (X = Cl, Br)", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2607.12595", "authors": "Ryuta Iwazaki, Shinnosuke Koyama, Takashi Koretsune, Shintaro Hoshino, Joji Nasu", "last_authors": "Shintaro Hoshino, Joji Nasu", "summary": "The spin-orbital Mott insulators Ru$X_3$ ($X =$ Cl, Br) have attracted considerable attention as promising candidate materials for realizing a Kitaev spin liquid. In this study, we construct effective pseudospin models from multiorbital Hubbard models derived from first-principles calculations and investigate the magnetic states of RuCl$_3$ and RuBr$_3$. From the constructed effective models, we find that RuBr$_3$ has more extended Wannier orbitals and stronger interlayer exchange interactions than RuCl$_3$. These interactions enhance three-dimensional correlations, consistent with the stronger antiferromagnetic tendency experimentally inferred for RuBr$_3$. Orbital-dependent Coulomb anisotropy further reduces the energy difference between ferromagnetic and zigzag states. Our results clarify how halogen substitution controls magnetic competition in Ru$X_3$ through interlayer exchange interactions and effects of orbital-dependent Coulomb interactions.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Electronic structure and magnetism of Kitaev candidate materials.", "tags": ["spinliquid", "Mott", "magnetic"], "image": "https://arxiv.org/html/2607.12595v1/x1.png", "briefing": {"background": "Kitaev 양자 스핀 액체는 강한 스핀-궤도 결합과 벌집 격자 구조의 Mott 절연체에서 나타나는 이국적인 양자 상태로, RuCl3가 가장 대표적인 후보 물질입니다.", "motivation": "RuCl3와 RuBr3의 할로겐 원소 차이가 자기적 성질(상태)에 미치는 미시적 메커니즘을 제일원리 계산을 통해 규명하고자 합니다.", "result": "RuBr3는 RuCl3보다 Wannier 궤도가 더 확장되어 있으며, 더 강한 층간 교환 상호작용과 궤도 의존적인 쿨롱 상호작용으로 인해 3차원적인 자기 상관관계가 더 강하게 나타남을 확인했습니다.", "implication": "할로겐 치환을 통해 층간 상호작용과 궤도 성질을 제어함으로써 Kitaev 후보 물질의 자기적 경쟁 상태를 정밀하게 조절할 수 있음을 시사합니다.", "novelty": "실제 실험에서 관측된 RuBr3의 강한 반강자성 경향성을 이론적으로 뒷받침하며, 궤도 의존적 쿨롱 에너지가 자기 구조에 미치는 영향을 명확히 규명했습니다.", "unresolved": "이 모델은 유효 스핀 모델에 기반하고 있어, 스핀 액체 상태 자체의 동역학적 특성이나 Kondo 효과와 같은 다체 효과는 충분히 다루지 못했습니다.", "future_work": "더 정밀한 다체 효과를 고려한 모델 확장과, 압력 등 외부 변수 변화에 따른 자기적 전이 시뮬레이션이 필요합니다.", "concepts": [{"term": "Kitaev 스핀 액체", "why_emerged": "기하학적 좌절(frustration)이 있는 시스템에서 스핀이 절대영도까지 질서를 갖지 않고 요동치는 상태를 탐색하기 위해 제안됨.", "origin": "Alexei Kitaev (2006)", "connections": "스핀-궤도 결합 물질, RuCl3, Majorana 페르미온."}, {"term": "Mott 절연체", "why_emerged": "밴드 이론으로는 전도체여야 할 물질이 강한 전자 간 쿨롱 반발력으로 인해 절연체가 되는 현상을 설명하기 위해 도입.", "origin": "Nevill Mott (1949)", "connections": "Hubbard 모델, 고온 초전도체, 강상관 전자계."}, {"term": "Wannier 궤도", "why_emerged": "결정 내의 Bloch 파동함수를 실공간의 국소적인 원자 궤도처럼 표현하여 계산 효율을 높이고 물리적 직관을 얻기 위해 사용.", "origin": "Gregory Wannier (1937)", "connections": "tight-binding 모델, 제일원리 계산(DFT)."}], "english_summary": ["Investigates the role of halogen substitution in RuX3 Kitaev candidates.", "Uses first-principles derived effective models to analyze magnetic competition.", "RuBr3 shows stronger 3D correlations due to extended Wannier orbitals.", "Orbital-dependent Coulomb interactions play a crucial role in magnetic phase selection.", "Provides a theoretical basis for controlling magnetic states via chemical substitution."]}}, {"title": "Magnetothermopower and particle-hole symmetry in a cuprate strange metal", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2607.12442", "authors": "Yu-Te Hsu, Matija \\v{C}ulo, Thom Ottenbros, et al.", "last_authors": "Nigel E. Hussey, Mikhail Titov", "summary": "Strange metallicity has been observed in several classes of quantum-critical metals and unconventional superconductors, including heavy-fermion compounds, iron-based superconductors, moiré materials, organic conductors, nickelates, and, most prominently, the high- T c T_{c} cuprates. Although its principal properties – the ubiquitous linear-in-temperature resistivity, the hyperbolic magnetic-field scaling of the magnetoresistance and the anomalous reduction of the Hall carrier density – are widely regarded as signatures of non-Fermi-liquid transport, the microscopic nature of the charge carriers responsible for the strange-metal response remains unresolved. Here, we report magnetothermopower measurements on overdoped (Bi 2-x Pb x )Sr 2-x La x CuO 6+δ (Bi2201) single crystals in magnetic fields up to 35 T. Whereas the temperature dependence of the zero-field Seebeck coefficient S ​ ( T ) S(T) can be captured using Boltzmann transport theory, the field-dependent response S ​ ( H ) S(H) cannot. Instead, the magnetothermopower contains a large additional contribution whose field and temperature dependence is consistent with the presence of short-range superconducting order well above T c T_{\\textrm{c}} . Combined with earlier Hall and magnetoresistance results, these data imply that the overdoped cuprate strange metal contains two transport sectors with distinct particle-hole symmetry: a conventional particle-hole-asymmetric Fermi-liquid (FL) contribution governing the Hall effect and the zero-field thermopower, and a nearly particle-hole-symmetric sector dominating the anomalous longitudinal magnetotransport. We formulate a phenomenological real-space model in which disconnected FL islands are embedded in a compensated Dirac liquid of phase-incoherent d d -wave Bogoliubov quasiparticles. This picture reconciles conventional zero-field transport with anomalous magnetothermopower and magnetoresistance and offers a concrete framework for thinking about strange metallicity in overdoped cuprates.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Experimental transport study on cuprates with electronic structure implications.", "tags": ["cuprate", "superconduct", "transport"], "image": "https://arxiv.org/html/2607.12442v1/Fig_zerofield_SA.png", "briefing": {"background": "Strange metal(이상 금속)은 고온 초전도체나 강상관 물질에서 관찰되며, 페르미 액체 이론을 벗어난 선형-온도 저항과 같은 비정상적인 전송 현상을 보입니다.", "motivation": "과도핑된 구리 산화물(Cuprate)에서 나타나는 이상 금속 상태의 전하 운반체 성질을 자기열전효과(magnetothermopower)를 통해 규명하고자 합니다.", "result": "이상 금속 상태에 입자-구멍(particle-hole) 대칭성이 서로 다른 두 개의 전송 섹터(sector)가 공존함을 발견했습니다.", "implication": "페르미 액체적인 전하 거동과 비페르미 액체적인 이상 전송 현상이 시스템 내에서 동시에 존재할 수 있다는 모델을 제시합니다.", "novelty": "기존의 저항/홀 효과 측정만으로는 설명하기 어려웠던 이상 금속의 전송 데이터를 '두 개의 섹터' 모델로 통합 설명했다는 점이 핵심입니다.", "unresolved": "두 섹터가 물리적으로 어떻게 분리되어 있는지, 그리고 이들 사이의 미시적 상호작용 메커니즘은 아직 불분명합니다.", "future_work": "이러한 입자-구멍 대칭적 섹터가 구체적으로 어떤 Bogoliubov 준입자와 연결되는지 실험적 증거(예: 광전자 분광법) 확보가 필요합니다.", "concepts": [{"term": "Strange metal", "why_emerged": "고온 초전도체 정상 상태에서 페르미 액체 이론으로 설명되지 않는 T-선형 저항 등의 비정상성을 기술하기 위해 사용.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "양자 임계점, 페르미 액체 이론, 구리 산화물."}, {"term": "입자-구멍 대칭성", "why_emerged": "시스템의 전하 운반체(전자/정공)가 밴드 구조 내에서 서로 대칭적인 성질을 갖는지 분석하여 전송 계수를 이해하기 위해 도입.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "Boltzmann 수송 방정식, Dirac 준입자."}, {"term": "Bogoliubov 준입자", "why_emerged": "초전도 상태에서 전자와 정공이 결합된 형태의 준입자를 설명하기 위해 사용.", "origin": "Nikolay Bogoliubov (1958)", "connections": "BCS 이론, 고온 초전도, 위상 초전도체."}], "english_summary": ["Studies magnetothermopower in overdoped Bi2201 cuprates.", "Reveals two transport sectors with different particle-hole symmetries.", "Combines Fermi-liquid and nearly particle-hole symmetric sectors.", "Proposes a model with FL islands in a compensated Dirac liquid.", "Framework reconciles anomalous magnetotransport in strange metals."]}}, {"title": "Quantum anomalous Hall effect with tunable Chern numbers induced by d-wave sublattice-staggered altermagnetism (Chinese Phys. B)", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2607.12320", "authors": "Lizhou Liu, Qing-Feng Sun", "last_authors": "Lizhou Liu, Qing-Feng Sun", "summary": "We construct a minimal spinful tight-binding model on a square lattice, where a $d$-wave sublattice-staggered altermagnetism drives the quantum anomalous Hall effect. Here the exchange field is staggered between the two sublattices, where it takes opposite signs on $A$ and $B$ described by the Pauli matrix $\\tau_z$. The resulting insulating phases host tunable Chern numbers $\\mathcal{C}=\\pm1$ and $\\mathcal{C}=\\pm2$, controlled by the staggered exchange strength and the sublattice-staggered potential. We determine the complete phase diagram, identify valley-resolved band inversions at the $X$ and $Y$ points in the Brillouin zone, and demonstrate chiral edge states together with quantized two-terminal conductance plateaus. Our work provides a simple route to realizing the quantum anomalous Hall effect in compensated magnets via a $d$-wave sublattice-staggered altermagnetism.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Theoretical study of QAH effect in altermagnets, relevant to current spintronics/topology interests.", "tags": ["altermagnet", "anomalousHall", "topology"], "image": "https://arxiv.org/html/2607.12320v1/x1.png", "briefing": {"background": "양자 변칙 홀 효과(QAHE)는 자기장 없이도 위상적인 엣지 채널을 통해 전하가 흐르는 현상으로, 저전력 spintronics 응용에 매우 중요합니다.", "motivation": "상쇄된 자성(compensated magnetism)을 가진 알터자성체(altermagnet)에서 새로운 방식의 양자 변칙 홀 효과를 유도하는 모델을 찾고자 합니다.", "result": "d-파동 알터자성체의 교환장이 부격자(sublattice)마다 어긋나 있는(staggered) 구조에서, 조절 가능한 Chern 수를 가진 절연체 위상과 엣지 채널을 확인했습니다.", "implication": "자화가 상쇄되어 외부 자기장을 유발하지 않는 알터자성체에서도 높은 위상학적 상태를 구현할 수 있음을 입증했습니다.", "novelty": "전통적인 강자성체 기반 QAHE 대신, 알터자성체의 대칭성(d-파동)을 활용하여 홀 효과를 제어하는 새로운 설계 원리를 제시했습니다.", "unresolved": "이 모델은 이론적인 tight-binding 모델이며, 이를 구현할 실제 물질 후보군에 대한 물질 설계(materials discovery)는 아직 미흡합니다.", "future_work": "이러한 위상적 특성을 실험적으로 검증하기 위한 구체적인 물질 탐색 및 엣지 전류 직접 관측 실험이 필요합니다.", "concepts": [{"term": "알터자성체 (Altermagnet)", "why_emerged": "강자성도 반강자성도 아닌, 대칭성에 의해 분리된 밴드를 가지며 강자성체와 유사한 전송 특성을 보이는 새로운 자성 분류 필요성 제기.", "origin": "최근 5년 이내 활발해진 분야 (J. Zelezny 등, 2022년경 본격 제안)", "connections": "반강자성체, 스핀-궤도 토크, spintronics."}, {"term": "양자 변칙 홀 효과 (QAHE)", "why_emerged": "외부 자기장 없이 물질의 위상적 성질에 의해 양자화된 홀 저항을 실현하여 저전력 소자를 구현하기 위해 도입.", "origin": "Haldane (1988)", "connections": "Chern 절연체, 위상 절연체, 양자 홀 효과."}, {"term": "Chern 수", "why_emerged": "밴드 구조의 위상적 기하학을 분류하는 수학적 지표로, 엣지 상태의 개수를 결정하기 위해 사용.", "origin": "Thouless, Kohmoto, Nightingale, den Nijs (1982)", "connections": "Berry 곡률, 위상 상전이."}], "english_summary": ["Constructs a tight-binding model for QAHE in d-wave altermagnets.", "Exchange field is staggered between A and B sublattices.", "Achieves tunable Chern numbers through exchange strength control.", "Identifies valley-resolved band inversions and chiral edge states.", "Offers a pathway to realize QAHE in compensated magnetic materials."]}}, {"title": "Research on topological materials using ultrafast spectroscopy (Acta Physica Sinica)", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2607.12536", "authors": "Hao Liu, Jian-Qiao Meng", "last_authors": "Hao Liu, Jian-Qiao Meng", "summary": "Topological materials, characterized by symmetry-protected nontrivial band structures such as Dirac cones and Weyl nodes, host diverse quantum phenomena, with potential applications in quantum transport, spintronics, and nonlinear optics. Ultrafast pump-probe spectroscopy has emerged as a powerful tool for exploring nonequilibrium dynamics in these systems. Its femtosecond resolution allows charge, spin, orbital, and lattice interactions to be tracked on their intrinsic timescales, thereby revealing key coupling mechanisms in topological phases. This review summarizes progress in ultrafast spectroscopic studies of topological insulators, topological semimetals, and magnetic topological materials. We first discuss the relaxation pathways of photoexcited surface and bulk electronic states, emphasizing electron-phonon scattering, surface-bulk charge transfer, and ultrafast spin conversion. We then examine population inversion in Dirac and Weyl semimetals, spin-polarization dynamics associated with tilted Weyl bands, and the effects of magnetic order on topological states, including coherent phonon and magnon excitations, magnetically driven topological transitions, and terahertz emission. We further review photoinduced topological phase transitions driven by electronic correlations, lattice distortions, and magnetic order under intense optical excitation, highlighting routes toward nonthermal control of quantum phases. Finally, we outline future directions that combine multidimensional ultrafast spectroscopy with temporal, energy, momentum, and spin resolution and advanced theoretical modeling to establish a unified picture of nonequilibrium topological states. This review aims to provide a useful reference for ultrafast studies of topological quantum materials and to advance their applications in high-speed, low-power information processing, spintronics, and quantum technologies.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Broad review of ultrafast spectroscopy in topological materials.", "tags": ["topological", "spectroscopy", "ultrafast"], "image": "https://arxiv.org/static/browse/0.3.4/images/arxiv-logo-fb.png", "briefing": {"background": "위상 물질은 대칭성에 의해 보호되는 비자명한 밴드 구조를 가지며 양자 수송 및 스핀트로닉스 분야에서 핵심적인 역할을 합니다. 이들의 비평형 동역학을 이해하는 것은 물질의 양자 상태를 제어하는 데 필수적입니다.", "motivation": "초고속 펌프-프로브 분광학을 사용하여 위상 절연체 및 반금속의 전자, 스핀, 격자 상호작용을 시간 분해능으로 추적하고자 합니다.", "result": "위상 물질 내 전자-포논 산란, 스핀 전환, 전하 이동 과정을 체계화하고 광유도 위상 전이와 자성 및 격자
