<title>Daily Paper Slideshow</title>
<style>
  :root {
    color-scheme: light;
    --bg: #f6f7f4;
    --paper: #ffffff;
    --ink: #111827;
    --muted: #64748b;
    --line: #d8ddd2;
    --accent: #176b87;
    --accent-2: #9a3412;
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; overflow: auto; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: var(--bg); color: var(--ink); }
  .shell { max-width: 1500px; min-height: 100vh; margin: 0 auto; padding: 14px 18px; display: flex; flex-direction: column; }
  .topbar { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 16px; }
  .top-actions { display: flex; align-items: center; gap: 10px; }
  .topbar a, button { border: 1px solid var(--line); border-radius: 8px; background: var(--paper); color: var(--ink); padding: 10px 14px; font-weight: 700; text-decoration: none; cursor: pointer; }
  button.primary { background: var(--accent); border-color: var(--accent); color: white; }
  button:disabled { opacity: 0.45; cursor: not-allowed; }
  .counter { color: var(--muted); font-weight: 700; }
  .slide { min-height: calc(100vh - 82px); background: var(--paper); border: 1px solid var(--line); border-radius: 10px; padding: 18px; box-shadow: 0 18px 42px rgba(15, 23, 42, 0.10); display: grid; grid-template-columns: minmax(310px, 0.86fr) minmax(0, 1.55fr); gap: 18px; overflow: visible; }
  .paper-head { min-width: 0; min-height: 0; overflow: visible; display: flex; flex-direction: column; gap: 12px; }
  .figure { margin: 0; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: #f8fafc; }
  .figure img { display: block; width: 100%; max-height: 41vh; object-fit: contain; background: white; }
  .figure figcaption { padding: 7px 10px; color: var(--muted); font-size: 12px; line-height: 1.3; }
  .head-text { display: flex; flex-direction: column; gap: 9px; min-width: 0; }
  .badges { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .badge { border-radius: 999px; padding: 5px 9px; background: #eef2ff; color: #3730a3; font-size: 12px; font-weight: 800; }
  .score { background: #fee2e2; color: #991b1b; }
  h1 { margin: 0; font-size: 25px; line-height: 1.15; letter-spacing: 0; overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
  h1 a { color: inherit; text-decoration-color: rgba(23, 107, 135, 0.35); text-decoration-thickness: 2px; text-underline-offset: 4px; }
  h1 a:hover { color: var(--accent); text-decoration-color: var(--accent); }
  .meta, .authors, .why, .abstract { font-size: 13px; line-height: 1.45; }
  .meta, .authors { color: var(--muted); }
  .why strong, .abstract strong, .authors strong { color: var(--ink); }
  .authors { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .why { border-left: 4px solid var(--accent-2); padding-left: 10px; color: #374151; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .abstract { border-top: 1px solid var(--line); padding-top: 14px; color: #374151; }
  .original-abstract { border-top: 1px solid var(--line); padding-top: 10px; color: #374151; font-size: 11.5px; line-height: 1.35; overflow-wrap: anywhere; }
  .original-abstract strong { display: block; margin-bottom: 4px; color: var(--ink); }
  .tags { display: flex; flex-wrap: wrap; gap: 8px; }
  .tag { border-radius: 999px; padding: 4px 8px; background: #f1f5f9; color: #475569; font-size: 12px; font-weight: 700; }
  .head-text > .link { display: none; }
  .briefing { min-width: 0; min-height: 0; overflow: visible; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); grid-auto-rows: minmax(0, auto); align-content: start; gap: 11px 18px; border-top: 0; padding-top: 0; }
  .brief-section { min-width: 0; }
  .brief-section.wide { grid-column: 1 / -1; }
  .brief-section h2 { margin: 0 0 4px; font-size: 14px; line-height: 1.22; color: #0f766e; letter-spacing: 0; }
  .brief-section p, .brief-section li { margin: 0; font-size: 12.5px; line-height: 1.42; color: #1f2937; overflow-wrap: anywhere; }
  .brief-section ul { margin: 0; padding-left: 20px; }
  .concepts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 9px 14px; }
  .concept { border-top: 1px solid var(--line); padding-top: 7px; }
  .concept h3 { margin: 0 0 4px; font-size: 13px; color: #7c2d12; letter-spacing: 0; }
  .concept p { margin: 2px 0 0; font-size: 11.5px; line-height: 1.35; color: #374151; overflow-wrap: anywhere; }
  .concept b { color: #111827; }
  .link { color: var(--accent); font-weight: 800; text-decoration: none; }
  .empty { padding: 48px; background: var(--paper); border: 1px solid var(--line); border-radius: 12px; color: var(--muted); }
  @media (max-width: 860px) {
    .shell { padding: 14px; }
    .topbar, .top-actions { align-items: stretch; flex-direction: column; }
    .slide, .briefing, .concepts { grid-template-columns: 1fr; }
    .slide { min-height: auto; overflow: visible; display: grid; }
    h1 { font-size: 28px; }
  }
</style>

with noise amplification during spectral enhancement.", "The authors introduce a Gradient Attention U-net architecture to improve denoising and reconstruction.", "This deep learning approach enables clearer visualization of band structures in ARPES and TR-ARPES data.", "The method offers a robust way to extract electronic structure information from noisy experimental data."]}}, {"title": "Unified First-Principles Formula for Time-Resolved ARPES Spectra of Coherent and Incoherent Excitons beyond the Dilute Limit", "journal": "PRL_Recent", "source": "keyword", "link": "http://link.aps.org/doi/10.1103/zhs1-rv1k", "authors": "Gianluca Stefanucci, Enrico Perfetto", "last_authors": "Gianluca Stefanucci, Enrico Perfetto", "summary": "Despite major experimental progresses in time-resolved and angle-resolved photoemission spectroscopy, a quantitative, microscopic framework for interpreting exciton-induced modifications of electronic band structures—applicable even beyond the low-density limit—is still lacking. Here, we close this gap by introducing a unified approach that links the dynamics of coherent and incoherent excitons to distinct and experimentally observable excitonic sidebands. Our central result is a general, first-principles formula for time-resolved photoemission spectra, applicable across a broad range of temperatures, excitation densities, and pump-probe delays. This advance provides a predictive tool for quantitatively tracking excitonic dynamics in complex materials.", "tier": "A_MUST_READ", "score": "10", "reason": "title strong match: ARPES", "tags": ["ARPES", "angle-resolvedphotoemission", "photoemission", "bandstructure"], "image": "", "briefing": {"background": "시간 분해 광전자 분광법(TR-ARPES)은 여기 상태의 전자 구조를 관찰하는 핵심 도구이나, 들뜬 상태의 엑시톤이 전자 밴드에 미치는 영향을 이론적으로 체계화하는 것은 매우 어렵습니다.", "motivation": "저밀도 한계를 넘어서는 영역에서 엑시톤이 전자 밴드 구조를 어떻게 변형시키는지 정량적으로 해석할 수 있는 통합적인 물리 공식이 필요했습니다.", "result": "コヒーレント 및 인코히어런트 엑시톤의 동역학이 TR-ARPES 스펙트럼의 엑시톤 사이드밴드(sideband)로 어떻게 나타나는지 설명하는 제1원리 m": "In-plane anisotropy", "why_emerged": "격자의 대칭성이 물리적 성질에 미치는 영향을 이해하기 위해", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "Symmetry breaking, Kagome"}], "english_summary": ["Reported the discovery of a sixfold snowflake-like angle-dependent magnetoresistance in Gd3TiBi5.", "The material acts as a kagome antiferromagnet with complex in-plane magnetic anisotropy.", "Provides experimental insights into the coupling between kagome lattice symmetry and electronic transport.", "Essential study for understanding the magnetic and electronic structure of rare-earth kagome magnets."]}}, {"title": "Surface-dominant transport in Weyl semimetal NbAs nanowires for next-generation interconnects", "journal": "Science", "source": "Gemini", "link": "https://www.science.org/doi/abs/10.1126/science.adx3027?af=R", "authors": "Yeryun Cheon, Mehrdad T. Kiani, Yi-Hsin Tu, et al.", "last_authors": "Ching-Tzu Chen, Judy J. Cha", "summary": "Ongoing demands for smaller and more energy-efficient electronic devices necessitate alternative interconnect materials with lower electrical resistivity at reduced dimensions. We report the synthesis of Weyl semimetal niobium arsenide (NbAs) nanowires through thermomechanical nanomolding with single crystallinity and controlled diameters down to 40 nanometers. The resistivity of NbAs nanowires decreases with decreasing diameter, and 40-nanometer-diameter nanowires exhibited a room-temperature resistivity of 10.5 ± 1.9 microhm·centimeters, which is ~70% lower than their bulk counterpart. Calculations attribute this resistivity reduction to surface-dominant conduction with a long carrier lifetime at finite temperatures. Further characterization of nanowires and bulk crystals revealed high breakdown current density, stability, and thermal conductivity. These properties highlight the potential of NbAs nanowires as next-generation interconnects that could surpass the limitations of current copper-based interconnects.", "tier": "B_IMPORTANT_CONDMAT", "score": "9", "reason": "Weyl semimetal NbAs is a key topological material; surface transport is highly relevant.; demoted from A: broad CM, not direct user/project hit", "tags": ["Weylsemimetal", "NbAs", "transport", "topologicalmaterials"], "image": "", "briefing": {"background": "반도체 소자의 미세화가 한계에 다다르면서, 기존 구리(Cu) 배선을 대체할 저저항 및 고효율 차세대 배선 물질에 대한 연구가 필수적입니다.", "motivation": "바일 반금속(Weyl semimetal)인 NbAs가 가진 우수한 전기적 특성을 나노와이어 형태로 구현하여 배선 재료로서의 잠재력을 평가하고자 했습니다.", "result": "40nm 직경의 NbAs 나노와이어에서 벌크 대비 70% 낮은 전기 저항을 확인했으며, 이는 표면 지배적 전도(surface-dominant conduction) 현상에 기인함을 밝혔습니다.", "implication": "위상물질인 바일 반금속의 표면 상태가 실제 소자 수준의 나노 스케일에서 저저항 배선으로 활용될 수 있음을 증명했습니다.", "novelty": "기존의 위상물질 연구들이 주로 물성 규명에 치중했다면, 이 연구는 실제 소자 공정인 나노몰딩(nanomolding)을 통해 실용적인 차세대 상호연결(interconnect) 가능성을 제시했다는 점이 독자에게 흥미롭습니다.", "unresolved": "나노와이어의 직경이 더 작아질 경우 산란 효과나 위상학적 특성이 어떻게 변할지, 그리고 대량 생산 공정에서의 균일성 확보 문제는 여전히 과제입니다.", "future_work": "실제 상용화 가능한 공정 수준에서의 NbAs 나노와이어 집적 연구 및 타 위상 물질과의 저항 비교 연구가 기대됩니다.", "concepts": [{"term": "바일 반금속 (Weyl semimetal)", "why_emerged": "밴드 구조에서 전도대와 가전자대가 점(node)에서 만나는 위상학적 상태를 가진 물질을 찾기 위해 등장했습니다.", "origin": "Hermann Weyl(1929)의 이론을 바탕으로 2011년 Wan 등에 의해 제안되었습니다.", "connections": "위상 절연체, 디랙 반금속과 깊은 관련이 있으며, 카이랄 아노말리(chiral anomaly)와 연관된 독특한 수송 현상을 보입니다."}, {"term": "표면 지배적 전도", "why_emerged": "나노 스케일로 갈수록 표면 대 부피의 비가 커지면서 표면 상태가 벌크 특성을 압도하는 현상이 중요해졌기 때문입니다.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "위상 절연체의 표면 상태(surface state)나 바일 반금속의 페르미 아크(Fermi arc)와 관련이 있습니다."}], "english_summary": ["NbAs Weyl semimetal nanowires were synthesized via thermomechanical nanomolding.", "40 nm diameter nanowires show a 70% reduction in resistivity compared to bulk.", "The improvement is attributed to surface-dominant conduction with high carrier lifetime.", "The material exhibits high stability and current-carrying capacity for future interconnects."]}}, {"title": "Fractional high-Chern insulator in twisted rhombohedral graphene", "journal": "Nature", "source": "Gemini", " splitting of the altermagnet FeSb2: A first-principles study", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/ddf5-krnh", "authors": "Shalika R. Bhandari, R. Tamang, Keshav Shrestha, Samy Brahimi, Samir Lounis, D. P. Rai", "last_authors": "Samir Lounis, D. P. Rai", "summary": "We have investigated the pressure-dependent electronic structure, phonon stability, and anomalous Hall response of the recently discovered altermagnet FeSb 2 from density functional theory (DFT) and Wannier function analysis. From density functional perturbation theory (DFPT) calculations, we have found that FeSb 2 remains dynamically stable up to 10 GPa, evidenced by positive phonon frequencies. Our spin-polarized band structure reveals that the crossing nodes between the spin-up and spin-down bands near the Fermi energy occur precisely at the Γ and Z high-symmetry points. The Fermi crossing is mostly exhibited by band-24, band-25, and band-26. The nonrelativistic spin-splitting (NRSS) along M ′ - Γ -M and A-Z- A ′ high symmetry paths is attributed to the symmetry operation [ C 2 | | C 2 y t ] and broken time-reversal symmetry ( T ). Significant changes in the band structure are observed under applied pressure, as evidenced by the shift of the crossing node between bands 24 and 26 toward higher energies. The NRSS exhibited by band-24 along M ′ − Γ -M symmetry is notably small. Although the strength of NRSS associated with band-26 along the A-Z- A ′ path is substantial, it decreases under applied pressure. We have calculated and presented the anomalous Hall conductivity (AHC) over the energy range from − 1.5 to 1.5 eV. The pronounced positive AHC peak at ambient pressure becomes spectrally broadened, and changes sign at 10 GPa as a result of pressure-induced modifications to the band structure and the associated redistribution of Berry curvature near the Fermi level. Furthermore, we quantify the orbital magnetization within the modern theory framework, which reaches a magnitude of 0.29 μ B at zero pressure. Our results identify FeSb 2 as a tunable altermagnetic candidate, where applied pressure can modulate both topological transport and dynamical stability, opening new avenues for strain-engineered Hall responses in compensated magnetic systems.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Electronic structure study of an altermagnet with anomalous Hall implications.", "tags": ["altermagnet", "DFT", "electronicstructure"], "image": "", "briefing": {"background": "알터마그넷(Altermagnet)은 비자성체처럼 보이지만 스핀-편향된 밴드 구조와 강한 자성 특성을 동시에 가지는 새로운 자기 상으로, 효율적인 스핀트로닉스 소자로 주목받고 있습니다.", "motivation": "최근 발견된 알터마그넷 FeSb2의 전자 구조를 압력 조건에서 연구하여, 물리적 변형을 통한 물성 제어 가능성을 확인하고자 했습니다.", "result": "압력 증가에 따라 밴드 구조가 변화하고, 이로 인해 비정상 홀 전도도(AHC)의 부호가 반전되는 현상을 발견했습니다.", "implication": "알터마그넷에서의 비정상 홀 효과와 Berry 곡률이 외부 압력(스트레인)에 의해 정밀하게 제어될 수 있음을 시사합니다.", "novelty": "FeSb2라는 특정 물질을 대상으로 압력을 통한 위상 수송 현상의 튜닝 가능성을 제안했으며, 이는 복잡한 자기 구조의 제어 기술에 중요한 데이터를 제공합니다.", "unresolved": "압력 변화에 따른 자기 모멘트 자체의 미시적 변화 경로와 10 GPa 이상의 고압 영역에서의 물리적 안정성 유지는 추가 검증이 필요합니다.", "future_work": "실제 고압 실험 환경에서 Hall 응답을 측정하여 본 DFT 계산 결과를 검증하는 연구가 필요합니다.", "concepts": [{"term": "알터마그넷 (Altermagnet)", "why_emerged": "전통적인 강자성체나 반강자성체로 분류되지 않으면서도 시간 반전 대칭성이 깨진 스핀-분할 밴드를 가지는 새로운 자기상 정의가 필요했습니다.", "origin": "최근 2-3년 내 체계적으로 정립되었으며, 주요 이론 그룹들(예: Jungwirth 등)에 의해 확산되었습니다.", "connections": "반강자성체, 비정상 홀 효과, 스핀트로닉스와 밀접한 관련이 있습니다."}, {"term": "비정상 홀 효과 (Anomalous Hall Effect)", "why_emerged": "자성체 내부의 Berry 곡률이 전자 수송에 미치는 영향을 이해하기 위해 도입되었습니다.", "origin": "Edwin Hall이 일반 홀 효과를 발견한 직후 1881년에 보고되었습니다.", "connections": "위상 물질의 Berry 곡률, 스핀-궤도 결합, 강자성체에서의 자성 측정과 연결됩니다."}], "english_summary": ["First-principles study of the altermagnet FeSb2 under pressure.", "Pressure modulates the band structure and spin-splitting nodes near the Fermi level.", "A sign change in anomalous Hall conductivity is predicted at 10 GPa.", "FeSb2 is identified as a tunable candidate for strain-engineered magnetic topological transport."]}}, {"title": "Emergent anomalous Hall effect from surface states in altermagnetic MnTe thin films", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/5d3f-y218", "authors": "Yufei Zhao, Saswata Mandal, Chao-Xing Liu, Binghai Yan", "last_authors": "Chao-Xing Liu, Binghai Yan", "summary": "Transport measurements on thin films of the prototypical altermagnet MnTe have yielded conflicting reports including the anomalous Hall effect (AHE) with opposite signs and resistivity independent of thickness. In this work, we resolve these discrepancies by disentangling the bulk and surface contri…", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "AHE study in altermagnetic thin films, relevant to magnetism interests.", "tags": ["altermagnet", "AHE", "thinfilms"], "image": "", "briefing": {"background": "Altermagnetism은 기존 강자성(Ferromagnetism)이나 반강자성(Antiferromagnetism)과 구분되는 새로운 자기적 상태로, 시간 반전 대칭성은 깨져 있지만 순수 자기 모멘트가 상쇄되는 특징을 가집니다. 이를 통해 자성체에서만 관측되던 이상 홀 효과(AHE)와 같은 현상이 비자성체에서도 나타날 가능성이 제기되어 연구가 활발합니다.", "motivation": "MnTe 박막에서 보고된 이상 홀 효과의 부호가 상충되거나 박막 두께에 따른 의존성이 모호하게 나타나는 실험적 불일치를 해결하고자 합니다.", "result": "벌크 상태의 기여와 표면 상태의 기여를 분리함으로써 MnTe 박막에서 관측되는 이상 홀 효과의 근원을 명확히 규명했습니다.", "implication": "알터마그네틱 재료의 전자기적 수송 특성을 이해하고 이를 spintronics 소자에 활용하기 위한 정밀한 제어 가능성을 제시합니다.", "novelty": "알터마그네틱 물질인 MnTe에서 표면과 벌크의 역할을 명확히 분리하여 실험적 논란을 종식시켰으며, 이는 향후 Altermagnet의 Berry curvature 및 위상학적 물리 연구에 중요한 토대가 됩니다.", "unresolved": "실험적 결과가 이론적인 예측과 모든 온도 범위에서 일치하는지에 대한 세부 검증이 필요합니다.", "future_work": "다른 알터마그네틱 물질로의 연구 확장 및 표면 상태 제어를 통한 소자 최적화 연구가 필요합니다.", "concepts": [{"term": "Altermagnetism", "why_emerged": "강자성과 반강자성의 경계에서 새로운 대칭성 기반의 자성질을 분류하기 위해 제안됨.", "origin": "초록 정보만으로는 특정하기 어려움 (최근 이론 물리학계에서 급부상)", "connections": "Berry curvature, AHE, non-collinear magnetism."}, {"term": "Anomalous Hall Effect (AHE)", "why_emerged": "외부 자기장이 없어도 자기적 정렬에 의해 전하 수송이 휘어지는 현상을 설명하기 위해 필요.", "origin": "Edwin Hall (1881년 발견).", "connections": "Berry phase, Chern insulator, Spintronics."}], "english_summary": ["Altermagnetic MnTe thin films exhibit conflicting transport data regarding AHE.", "The study successfully disentangles bulk and surface contributions to the Hall effect.", "Results clarify the origin of thickness-independent resistivity and sign variations.", "Provides a foundation for utilizing altermagnets in future spintronic devices."]}}, {"title": "Enhancement of metallicity by Na doping in La3Ni2O7+δ", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/fcwr-3jrg", "authors": "Yingying Gao, W. Zhou, W. H. Guo, et al.", "last_authors": "Yinzhong Wu, B. Qian", "summary": "The observation of $\\mathrm{high}\\text{−}{T}_{\\mathrm{c}}$ superconductivity in bilayer nickelate ${\\mathrm{La}}_{3}{\\mathrm{Ni}}_{2}{\\mathrm{O}}_{7}$ under high pressure provides a new venue for exploring novel unconventional superconductors and elucidating the mechanism of $\\mathrm{high}\\text{−}{T…", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Nickelate superconductor, high interest for electronic structure/ARPES.", "tags": ["material", "nickelate", "superconductivity"], "image": "", "briefing": {"background": "La3Ni2O7은 고압 하에서 초전도성을 나타내는 이중층 니켈 산화물로, 고온 초전도 메커니즘을 밝히기 위한 핵심 물질로 주목받고 있습니다. 물질의 전자 구조와 도핑 수준 간의 관계를 파악하는 것이 연구의 핵심입니다.", "motivation": "Na 도핑을 통해 La3Ni2O7의 전자 구조와 전도성을 변화시켜, 초전도 전이 온도 및 금속성을 조절하거나 향상할 수 있는지를 확인하고자 합니다.", "result": "Na 도핑이 시스템의 금속성을 향상시킨다는 점을 확인했습니다.", "implication": "화학적 치환(Doping)을 통해 니켈 산화물의 전자 상태를 미세 조정할 수 있음을 보여주며, 향후 최적의 초전도 상태를 찾기 위한 전략적 지표를 제공합니다.", "novelty": "고압 연구에 편중된 니켈 산화물 초전도 분야에서 화학적 도핑 효과를 다룸으로써 전자 구조 엔지니어링의 가능성을 제시했습니다.", "unresolved": "Na 도핑이 실제 초전도 상태의 전이 온도(Tc)를 어느 정도 수준까지 변화시킬 수 있는지에 대한 정량적 최적화가 필요합니다.", "future_work": "도핑된 샘플에 대한 고압 ARPES 및 수송 특성 측정을 통해 전자 구조 변화와 초전도성 간의 상관관계 규명.", "concepts": [{"term": "Nickelate Superconductor", "why_emerged": "구리 산화물(cuprate) 이외의 고온 초전도 물질 탐색 과정에서 발견됨.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "High-Tc superconductivity, Mott physics, electronic structure."}], "english_summary": ["Na doping is investigated as a method to tune the properties of La3Ni2O7.", "The study reports enhanced metallicity in the doped bilayer nickelate system.", "Chemical doping offers a pathway to manipulate the electronic state of nickelate superconductors.", "Insights provide strategies for optimizing superconducting properties in nickelates."]}}, {"title": "Low-temperature spin dynamics and absence of magnetic order in layered α−RuI3", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/kxbj-gp8z", "authors": "Hank C. H. Wu, Benjamin M. Huddart, Francis L. Pratt, Danrui Ni, Robert J. Cava, Stephen J. Blundell", "last_authors": "Robert J. Cava, Stephen J. Blundell", "summary": "Quantum spin liquids are long-sought for their elusive, never-frozen magnetic states. In layered α -RuI 3 , magnetic Ru ions form a honeycomb network related to the Kitaev material α -RuCl 3 , yet muon spin relaxation reveals a strikingly different low-temperature behaviour. The authors show here that the spins remain dynamically fluctuating down to 50 mK and find evidence for 2D spin diffusion, supporting the view that α -RuI 3 is a promising candidate for hosting a quantum spin liquid state.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Important experimental study of quantum spin liquid candidate in vdW materials.", "tags": ["spinliquid", "vanderWaals", "magnetism"], "image": "", "briefing": {"background": "양자 스핀 액체(QSL)는 절대 영도에서도 자기적 무질서가 유지되는 상태로, 위상학적 퀀텀 컴퓨팅 등 차세대 물리학의 핵심 연구 주제입니다. 벌집 격자 구조를 가진 루테늄 화합물(RuX3)은 키타예프 모델을 구현할 최적의 물질군으로 평가받습니다.", "motivation": "α-RuI3가 α-RuCl3와 유사한 구조를 가짐에도 불구하고 실제 자기적 거동이 어떻게 다른지, 양자 스핀 액체 후보 물질로서의 적합성을 실험적으로 확인하고자 합니다.", "result": "극저온 50 mK까지 자기적 정렬이 나타나지 않고 동적 요동이 지속됨을 확인했습니다.", "implication": "α-RuI3가 양자 스핀 액체 후보군으로서 매우 유망하며, 2차원 스핀 확산 특성을 가진다는 점을 시사합니다.", "novelty": "α-RuCl3가 가진 자기적 정렬 문제를 극복할 가능성이 있는 후보 물질로서 α-RuI3의 가능성을 실험적으로 처음 증명했습니다.", "unresolved": "이러한 동적 요동이 Kitaev 물리와 정확히 어떻게 연결되는지에 대한 이론적 모델링이 보완되어야 합니다.", "future_work": "중성자 산란 실험을 통한 스핀 상관 함수 상세 측정 및 키타예프 상호작용의 강도 분석.", "concepts": [{"term": "Quantum Spin Liquid (QSL)", "why_emerged": "기본적인 자기 정렬(Neel state)이 나타나지 않는 새로운 자기적 위상 상태를 설명하기 위해 제안됨.", "origin": "Philip Anderson (1973).", "connections": "Frustrated magnetism, Kitaev model, Topological order."}, {"term": "Kitaev Material", "why_emerged": "벌집 격자에서 이방성 교환 상호작용을 통해 양자 스핀 액체를 구현하기 위해 제안됨.", "origin": "Alexei Kitaev (2006).", "connections": "RuCl3, spin-orbit coupling, quantum entanglement."}], "english_summary": ["α-RuI3 is explored as a potential quantum spin liquid candidate.", "Muon spin relaxation reveals persistent spin fluctuations down to 50 mK.", "Absence of long-range magnetic order supports the presence of a dynamic QSL state.", "Provides a promising platform to study 2D spin diffusion and quantum magnetism."]}}, {"title": "Orbital-selective electron correlations in high-Tc bilayer nickelates: From a global phase diagram to implications for spectroscopy", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/7bhn-63xh", "authors": "Zhiguang Liao, Yiming Wang, Lei Chen, Guijing Duan, Rong Yu, Qimiao Si", "last_authors": "Rong Yu, Qimiao Si", "summary": "Motivated by the high-temperature superconductivity observed in the bilayer nickelate ${\\mathrm{La}}_{3}{\\mathrm{Ni}}_{2}{\\mathrm{O}}_{7}$ and the spectroscopic evidences of strong electron correlations in this compound, we address the role of its multiorbital electron correlations by proposing a gl…", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Strong correlations in nickelates; spectroscopy focus makes this very relevant.", "tags": ["nickelate", "superconductivity", "spectroscopy"], "image": "", "briefing": {"background": "니켈레이트(Nickelates)는 큐프레이트와 유사한 3d 전이금속 산화물로서, 최근 발견된 이중층 구조의 La3Ni2O7 초전도체는 고온 초전도 메커니즘을 규명하는 핵심 후보 물질로 주목받고 있습니다.", "motivation": "La3Ni2O7에서 관측되는 강한 전자 상관관계와 스펙트럼 데이터를 기반으로, 다중 궤도(multiorbital) 성격이 초전도 현상에 미치는 역할을 물리적 위상 도표로 정립하고자 합니다.", "result": "이중층 니켈레이트에서의 궤도 선택적(orbital-selective) 전자 상관관계와 이에 따른 위상 도표를 제시하여 분광학적 관측 결과들과의 상관관계를 체계화하였습니다.", "implication": "La3Ni2O7의 초전도 상태가 단순한 구조적 해석을 넘어, 궤도 의존적인 강상관 관계에 기인함을 시사하며 향후 ARPES 등의 실험적 검증을 위한 가이드라인을 제공합니다.", "novelty": "기존의 단일 궤도 모델에서 벗어나 니켈레이트 특유의 궤도 선택적 상관관계를 강조한 이론 모델로, 향후 관련 물질의 분광학적 데이터 해석에 중요한 이론적 토대가 됩니다.", "unresolved": "이론적 위상 도표가 실제 물질의 정밀한 저에너지 물리량을 완벽히 재현하는지에 대한 실험적 정량 비교는 여전히 과제입니다.", "future_work": "ARPES를 이용한 밴드 분산의 궤도적 성격 규명 및 DMFT 계산을 통한 물성 예측과 실험값의 직접적인 비교가 필요합니다.", "concepts": [{"term": "Orbital-selective correlation", "why_emerged": "다중 궤도 물질에서 특정 궤도만 강하게 국소화되는 현상을 설명하기 위해 도입됨.", "origin": "Anisimov 등이 1997년경 제안함.", "connections": "Hund's metal 및 Mott 절연체 연구와 연관됨."}, {"term": "La3Ni2O7", "why_emerged": "고온 초전도체의 새로운 후보군인 니켈레이트 계열의 이중층 구조를 탐구하기 위해 주목받음.", "origin": "최근 2023년경 실험적으로 초전도성이 보고됨.", "connections": "큐프레이트와 유사한 전자 구조를 가지나 니켈의 3d 궤도 특성에 차이가 있음."}], "english_summary": ["Addresses the role of orbital-selective electron correlations in La3Ni2O7 bilayer nickelate.", "Proposes a comprehensive phase diagram to reconcile recent spectroscopic observations.", "Suggests that multiorbital physics is central to understanding the high-Tc superconductivity in this system.", "Provides a theoretical framework for interpreting future ARPES and RIXS spectroscopy on nickelate thin films."]}}, {"title": "Pressure-induced structural transitions and dome-shaped superconductivity in the topological insulator PbBi6Te10", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/rgb8-bsw1", "authors": "JunYing Hu, GuangYang Dai, Liang Ma, JingKai Bi, JianYong Chen, ZhiWei Men", "last_authors": "JianYong Chen, ZhiWei Men", "summary": "Topological insulators (TIs) constitute a unique class of quantum materials owing to their topology-protected electron states. While pressure is an effective way to induce superconductivity in TIs, superconductivity often appears after phase transition or structural disorder. Therefore, identifying …", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Superconductivity and structure in a topological material.", "tags": ["topologicalinsulator", "superconductivity", "pressure"], "image": "", "briefing": {"background": "위상 절연체(TI)는 표면의 전도성 상태와 벌크의 절연성을 동시에 갖는 물질로, 압력을 가해 격자를 변형시키면 새로운 초전도 위상이 유도되는 경우가 많아 응집물질물리학의 주요 연구 분야입니다.", "motivation": "PbBi6Te10 물질이 압력 하에서 어떠한 구조적 전이를 겪으며 초전도성을 발현하는지, 그 위상적 특성과의 연관성을 규명하고자 합니다.", "result": "압력에 따른 PbBi6Te10의 구조적 전이와 돔(dome) 형태의 초전도 현상을 관찰하여 구조 변화가 초전도성에 미치는 임계 거동을 밝혔습니다.", "implication": "위상 물질의 구조 제어를 통해 양자 위상을 조절하고 초전도성을 유도하는 매커니즘에 대한 이해를 높였습니다.", "novelty": "PbBi6Te10이라는 특정 위상 절연체의 압력-구조-초전도성 상관관계를 체계화하였으며, 위상 물성과 구조 전이의 결합을 보여줍니다.", "unresolved": "초전도 발현이 구조적 무질서 때문인지, 순수한 구조 상전이에 의한 것인지에 대한 미세한 물리학적 해석은 여전히 논쟁적입니다.", "future_work": "압력 하에서의 전기전도도 측정 및 위상학적 상태를 직접 확인하기 위한 고압 하의 ARPES 또는 투과전자현미경 연구가 필요합니다.", "concepts": [{"term": "Pressure-induced superconductivity", "why_emerged": "물질의 격자 상수를 변화시켜 전자 상태 밀도를 조절하고 초전도성을 유도하기 위해 사용됨.", "origin": "초전도 연구 초기부터 활용됨.", "connections": "밴드 구조 변경 및 포논-전자 상호작용 강화와 밀접함."}, {"term": "Topological Insulator", "why_emerged": "벌크와 경계면의 위상적 차이를 이용한 새로운 양자 소자 구현을 위해 연구됨.", "origin": "Hasan & Kane, Qi & Zhang 등에 의해 정립됨.", "connections": "Berry curvature, 시간 반전 대칭성과 관련됨."}], "english_summary": ["Investigates the pressure-induced structural transitions and superconductivity in PbBi6Te10.", "Identifies a dome-shaped superconducting phase as a function of pressure.", "Discusses the connection between structural changes and the underlying topological electronic structure.", "Provides insights into how pressure tuning affects the quantum states of topological insulators."]}}, {"title": "Second-order topological insulator induced by compensated altermagnetism without bulk spin splitting", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/7q2z-317r", "authors": "Lizhou Liu, Qing-Feng Sun, Ying-Tao Zhang", "last_authors": "Qing-Feng Sun, Ying-Tao Zhang", "summary": "We theoretically demonstrate a second-order topological insulating phase induced by compensated altermagnetism, while keeping the bulk gap unchanged, in a two-dimensional topological insulator film. By introducing a layer-resolved out-of-plane $d$-wave altermagnetic term with opposite signs on the t…", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Direct connection between altermagnetism and topological insulator properties.", "tags": ["altermagnetism", "topologicalinsulator", "theory"], "image": "", "briefing": {"background": "알터자성(Altermagnetism)은 벌크 자화가 없음에도 불구하고 스핀 분할(spin splitting)된 밴드를 가지는 새로운 자기 상으로, 위상물질과의 결합이 큰 주목을 받고 있습니다.", "motivation": "2차원 위상 절연체 필름에서 알터자성 효과가 어떠한 위상적 상태를 유도할 수 있는지 이론적으로 탐구하고자 합니다.", "result": "벌크 스핀 분할 없이도 층별로 반대 부호를 갖는 d-파 알터자성 항을 도입함으로써 2차 위상 절연체 상태를 유도할 수 있음을 보였습니다.", "implication": "알터자성이 위상학적 위상을 제어하는 새로운 자유도로 사용될 수 있음을 증명하며, 스핀트로닉스 분야에 응용 가능성을 제시합니다.", "novelty": "벌크 특성을 변화시키지 않으면서도 2차 위상(second-order topology)을 유도하는 기법을 제안했다는 점에서 매우 창의적입니다.", "unresolved": "이러한 현상을 실제 물질(예: 2D 자성 물질층)에서 구현하기 위한 구체적인 물질 후보군 선정은 아직 초기 단계입니다.", "future_work": "해당 모델을 실험적으로 구현 가능한 물질 시스템을 탐색하고, 에지 상태(edge state)의 물리량을 STM 등으로 측정하는 연구가 필요합니다.", "concepts": [{"term": "Altermagnetism", "why_emerged": "강자성도 반강자성도 아닌, 대칭성에 의해 결정되는 독특한 스핀 분할을 설명하기 위해 도입됨.", "origin": "최근 2022년경 이론적으로 명확히 정립됨.", "connections": "반강자성과 유사한 자성 구조를 가지나 밴드 분할 측면에서는 강자성과 유사함."}, {"term": "Second-order topological insulator", "why_emerged": "벌크나 표면이 아닌 더 낮은 차원의 경계(예: 1D 에지나 코너)에서 위상적 모드를 보이기 위해 제안됨.", "origin": "Benalcazar 등(2017)에 의해 대중화됨.", "connections": "위상 절연체의 고차원 확장 개념인 'Higher-order topological insulator'의 일종."}], "english_summary": ["Proposes that compensated altermagnetism can induce a second-order topological insulator phase.", "Uses a 2D topological insulator film as a platform for the theoretical demonstration.", "Shows tha ostructures to controllable topological spintronics."]}}, {"title": "Dirac magnons in a thin elemental itinerant ferromagnet", "journal": "Science_Advances", "source": "Gemini", "link": "https://www.science.org/doi/abs/10.1126/sciadv.aed9835?af=R", "authors": "Khalil Zakeri, Christopher Hins, Robin R. Neumann, Alexander Mook, Arthur Ernst", "last_authors": "Alexander Mook, Arthur Ernst", "summary": "A distinct difference between graphene—an atomic layer of carbon—and conventional semiconductors is that its electrons behave as massless Dirac fermions, giving rise to unprecedented physical properties. Magnetically ordered solids host magnons, quasiparticles associated with magnetic degrees of freedom. While Dirac magnons have recently been predicted in specific insulating or rare-earth magnets, their existence in thin 3d magnets remains elusive because of the complex nature of itinerant magnetism and dimensionality effects. Here, we demonstrate the presence of Dirac magnons in a thin itinerant elemental ferromagnet. By investigating atomically designed hexagonal close-packed cobalt films, we establish that magnons in such structures resemble the Dirac electrons in graphene. We explain the physical nature of these Dirac magnons and discuss the consequences of symmetry, dimensionality, magnetic interactions, the number of atomic layers, and cobalt’s itinerant magnetism on the properties of the Dirac points. Our results pave the way for finding and engineering Dirac magnons in a variety of low-dimensional layered 3d ferromagnets and metamaterials.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Explores Dirac magnons in ferromagnets, aligning with topological and magnetic material interests.", "tags": ["magnons", "Dirac", "ferromagnetism", "topological"], "image": "", "briefing": {"background": "위상 물리학의 발전으로 그래핀의 Dirac 페르미온과 유사한 선형 분산 관계를 갖는 'Dirac 마그논'이 자기성 물질에서 이론적으로 예측되었습니다. 하지만 실험적으로는 절연체나 희토류 자성체에 국한되어 있었습니다.", "motivation": "3d 전이금속을 기반으로 한 박막 페로자성체에서 순회  (SOT), surpassing the speed limit by an order of magnitude. We further use voltage-gated (VG) effect to probe SOT switching mechanisms over wide pulse-width ranges and identify a nonmonotonic VG-SOT efficiency. While the efficiency is pronounced under long-pulse excitation, it diminishes in the subnanosecond regime but reemerges as the pulse width scales down to 13.2 ps, yielding an energy consumption about 30 fJ per bit. Micromagnetic analysis reveals that, from dc to picosecond timescale, the dominant magnetization switching dynamics evolve from thermally activated reversal to incoherent precession to coherent precession. These results establish picosecond VG-SOT as a pathway toward ultrafast and energy-efficient memory and logic.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Spintronics focusing on magnetic tunnel junctions and spin-orbit torque; highly relevant condensed matter.", "tags": ["spintronics", "magnetism", "materialsscience", "magnetictunneljunction"], "image": "", "briefing": {"background": "차세대 MRAM은 빠른 속도와 저전력 소비가 필수입니다. 기존 스핀-궤도 토크(SOT) 기반의 소자는 수백 피코초 수준의 한계를 가지고 있어, 프로세서 속도를 따라가기 어렵습니다.", "motivation": "전압 제어 효과(VG-SOT)를 통해 서브 나노초 영역에서 자기 터널 접합(MTJ)의 스위칭 효율을 높이고, 초고속 구동 기작을 규명하고자 했습니다.", "result": "13.2 피코초의 극초단 펄스를 사용하여 전력 소비를 비트당 30 fJ 수준으로 낮춘 필드-프리(field-free) 스위칭을 실험적으로 구현했습니다.", "implication": "피코초 단위의 초고속 스핀트로닉스 소자가 실제 가능함을 보였으며, 이는 메모리와 프로세서 사이의 병목 현상을 해결할 핵심 기술이 될 것입니다.", "novelty": "이 연구는 스핀-궤도 토크 기반의 소자 물리 분야에서 시간 분해 동역학(picosecond dynamics)을 정밀하게 제어했다는 점에서 소자 물리학자들에게 큰 통찰을 줍니다.", "unresolved": "피코초 영역에서 일어나는 비결합적 전도와 열 효과가 실제 소자의 수명에 미치는 장기적 영향은 아직 확인되지 않았습니다.", "future_work": "초고속 메모리 소자의 신뢰성 검증 및 대규모 집적을 위한 공정 최적화.", "concepts": [{"term": "Spin-Orbit Torque (SOT)", "why_emerged": "전류를 이용해 자성층의 자화를 효율적으로 제어하여 기존의 자기장 제어 방식의 한계를 극복하기 위해 제안되었습니다.", "origin": "Miron et al. (2011) 등", "connections": "스핀 홀 효과, 라쉬바 효과"}, {"term": "Magnetic Tunnel Junction (MTJ)", "why_emerged": "강자성체와 절연체 사이의 터널링 자기저항(TMR)을 이용해 정보를 읽고 쓰는 비휘발성 메모리의 핵심 구조입니다.", "origin": "Julliere (1975) 효과에 기반", "connections": "스핀트로닉스, MRAM"}], "english_summary": ["Demonstrated picosecond field-free switching of MTJs via spin-orbit torque.", "Achieved sub-100 fJ per bit energy consumption in the picosecond regime.", "Unveiled transition of switching dynamics from thermal to coherent precession.", "Proposes an ultrafast pathway for next-generation in-memory computing."]}}, {"title": "Bond-Length-Driven Magnetic Transition in Quasi-One-Dimensional CrSbX3 (X=S, Se) (J. Phys.: Condens. Matter)", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2604.01810", "authors": "Kang Lee, Hong-Suk Choi, K. -W. Lee", "last_authors": "Hong-Suk Choi, K. -W. Lee", "summary": "Using {\\it ab initio} calculations, we investigate the magnetic ground states of quasi-one-dimensional insulating CrSb$X_3$ ($X$ = S, Se) with infinite double-rutile chains. Within conventional band theory, without explicit Coulomb correlations ($U$), we obtain band gaps in close agreement with experiment. Remarkably, we find that the magnetic order is highly sensitive to the Cr-Cr bond length $d_{\\rm Cr-Cr}$: increasing the bond length induces a transition from antiferromagnetic to ferromagnetic order at a critical distance $d^c_{\\rm Cr-Cr} \\approx 3.53 (\\pm 0.05)$ \\AA. Accordingly, CrSbS$_3$ lies near the transition boundary, whereas CrSbSe$_3$ is robustly ferromagnetic, in good agreement with experiment. Analysis of the exchange interactions reveals that the first-order phase transition is dominated by a sign reversal of the intrachain nearest-neighbor superexchange $J_1$ mediated by chalcogen ions, while the intrachain direct exchange $J_2$ remains ferromagnetic and changes only gradually. This behavior reflects an emergent Bethe-Slater-like behavior driven by competing exchange pathways in a quasi-1D transition-metal system, where the competition between $J_1$ and $J_2$ dictates the magnetic ground state. Besides, the electronic structures of the ground states of each compound are investigated.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Ab initio study of magnetic transitions in quasi-one-dimensional compounds, aligning with the user's quasi-1D materials focus.", "tags": ["quasi-1D", "material", "magnetism"], "image": "https://arxiv.org/html/2604.01810v2/Fig1.png", "briefing": {"background": "준일차원(quasi-1D) 전이금속 화합물은 격자 구조의 비등방성으로 인해 1차원적인 자기적 상호작용과 전자 상관관계가 지배적인 물리 현상을 보입니다. 특히 CrSbX3 시스템은 격자 매개변수가 자기적 지향성을 결정하는 중요한 변수로 작용합니다.", "motivation": "CrSbS3와 CrSbSe3의 실험적으로 관찰된 서로 다른 자기적 바닥 상태의 근원을 이론적으로 규명하고, Cr-Cr 결합 길이가 자기 상전이에 미치는 영향을 파악하고자 합니다.", "result": "제일원리 계산을 통해 Cr-Cr 결합 길이에 따른 반강자성에서 강자성으로의 전이 임계값(약 3.53 Å)을 도출했습니다. 이는 주로 칼코젠 이온을 매개로 하는 근접 이웃 초교환 상호작용(J1)의 부호 반전에 기인함을 확인했습니다.", "implication": "이 결과는 준일차원 물질에서 결합 길이 조절(스트레인 엔지니어링 등)을 통해 자기적 성질을 정밀하게 제어할 수 있는 가능성을 제시합니다.", "novelty": "Bethe-Slater 모델을 준일차원 전이금속 시스템으로 확장하여 자기적 상전이의 미시적 기전을 정량적으로 분석했습니다.", "unresolved": "결합 길이 외에 외부 압력이나 도핑이 실제 실험 환경에서 복합적으로 작용할 때의 동역학적 특성은 명확히 밝혀지지 않았습니다.", "future_work": "실제 실험적 압력 실험을 통해 제안된 임계값을 검증하고, 유사한 다른 준일차원 화합물에 대한 예측 계산이 필요합니다.", "concepts": [{"term": "Superexchange (초교환)", "why_emerged": "비자기성 이온(여기서는 칼코젠)을 매개로 두 자기성 이온 사이의 자기적 결합을 설명하기 위해 도입되었습니다.", "origin": "Kramers(1934)와 Anderson(1950)에 의해 확립되었습니다.", "connections": "Goodenough-Kanamori 규칙과 연결되어 자기 구조를 예측하는 데 필수적입니다."}, {"term": "Bethe-Slater Curve", "why_emerged": "원자 간 거리에 따른 교환 상호작용의 부호 변화를 시각적으로 이해하기 위해 제안되었습니다.", "origin": "Bethe(1930)와 Slater(1930)에 의해 제안되었습니다.", "connections": "전이금속의 자기 모멘트와 격자 간격 사이의 상관관계를 설명하는 기초 이론입니다."}], "english_summary": ["Ab initio study of CrSbX3 (X=S, Se) reveals a magnetic phase transition driven by Cr-Cr bond length.", "The transition from antiferromagnetic to ferromagnetic state occurs at a critical distance of ~3.53 Å.", "The mechanism is identified as the sign reversal of the chalcogen-mediated intrachain J1 superexchange interaction.", "This provides a design principle for tuning magnetism in quasi-1D transition metal compounds."]}}, {"title": "Competing Orders Driven by Wigner Crystal Phase in Rhombohedral Graphene", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2607.15014", "authors": "Zekang Zhou, Kilian Kr\\\"otzsch, Rapha\\\"el Ayache, et al.", "last_authors": "Preden Roulleau, Mitali Banerjee", "summary": "Rhombohedral graphene systems provide a unique platform where strong electronic interactions and nontrivial band topology coexist at low carrier densities and high displacement fields, giving rise to a rich landscape of emergent electronic phases. Here, we report that the highly insulating state on the low-density side of chiral superconductivity in rhombohedral pentalayer graphene (R5G) corresponds to a Wigner crystal (WC) phase. In addition, a hole-doped metallic Wigner crystal (h-mWC) phase emerges near the WC boundary. Under an out-of-plane magnetic field, the system hosts competing magnetic-field-stabilized superconductivity (fSC) and unconventional reentrant quantum Hall (RIQH) states. These emergent phases are closely connected to the underlying WC and mWC states and evolve continuously across phase boundaries. Our results establish that WC phase plays an important role in the phase diagram of rhombohedral multilayer graphene and highlight its connection to a rich landscape of emergent phases.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Experimental study of Wigner crystal, superconductivity, and quantum Hall states in rhombohedral graphene.", "tags": ["experiment", "graphene", "Wignercrystal", "superconductivity", "quantumHall", "correlatedelectrons"], "image": "https://arxiv.org/html/2607.15014v1/figures/figure1.png", "briefing": {"background": "능면체 적층 그래핀(Rhombohedral graphene)은 강한 전자 상관관계와 밴드 토폴로지가 결합하여 초전도성, 절연체 상태 등 다양한 양자 위상이 나타나는 다체 물리학의 핵심 연구 플랫폼입니다.", "motivation": "능면체 오층 그래핀에서 관찰되는 초전도성 근처의 절연 상태가 Wigner 결정(WC)과 어떤 관계를 가지는지, 그리고 자기장 하에서 나타나는 경쟁 위상들을 이해하고자 합니다.", "result": " terfaces, and structural imperfections introduce numerous sources of loss and decoherence. Despite extensive efforts, linking these decoherence mechanisms to their microscopic material origins -- essential for developing effective mitigation strategies -- remains an outstanding challenge that has slowed coherence improvements. Here, using scanning gate microscopy on live superconducting circuits we identify a previously unrecognised decoherence mechanism originating from Coulomb blockade and microwave-driven charge tunnelling in metallic grains. Such grains are ubiquitous in thin-film devices fabricated by standard lithography processes. By characterising multiple defects across different devices, we find such defects to be as common and as debilitating to device performance as two-level system (TLS) defects, while originating from a fundamentally different physical mechanism. Importantly, conventional characterisation techniques would misattribute this loss to other, microwave power-independent processes. Our observations thus reveal a widespread source of decoherence in superconducting circuits, challenging the prevailing paradigm that coherence lifetimes are primarily limited by TLS defects. Eliminating metallic grains during fabrication provides a clear and practical route to suppress this mechanism, offering a pathway towards improved coherence and reduced noise in microwave-based solid-state quantum devices.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Experimental identification of decoherence sources in superconducting circuits using microscopy.", "tags": ["experiment", "superconductivity", "decoherence"], "image": "https://arxiv.org/html/2607.15252v1/x1.png", "briefing": {"background": "초전도 양자 회로의 성능은 재료의 미시적 결함(표면, 인터페이스 등)으로 인한 결어긋남(decoherence)에 의해 제한되며, 이는 양자 컴퓨터 상용화의 큰 걸림돌입니다.", "motivation": "기존에 주로 고려되던 2준위 시스템(TLS) 외에, 회로 내부에 존재할 수 있는 금속성 입자에 의한 결어긋남 메커니즘을 밝혀내고자 합니다.", "result": "스캔 게이트 현미경을 통해 박막 제조 과정에서 발생하는 금속성 입자가 쿨롱 차단(Coulomb bloc
