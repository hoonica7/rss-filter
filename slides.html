<!DOCTYPE html>

<head>
<meta charset='UTF-8'>
<meta name='viewport' content='width=device-width, initial-scale=1.0'>
<title>Daily Paper Slideshow</title>
<style>
  :root {
    color-scheme: light;
    --bg: #f6f7f4;
    --paper: #ffffff;
    --ink: #111827;
    --muted: #64748b;
    --line: #d8ddd2;
    --accent: #176b87;
    --accent-2: #9a3412;
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; overflow: auto; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: var(--bg); color: var(--ink); }
  .shell { max-width: 1500px; min-height: 100vh; margin: 0 auto; padding: 14px 18px; display: flex; flex-direction: column; }
  .topbar { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 16px; }
  .top-actions { display: flex; align-items: center; gap: 10px; }
  .topbar a, button { border: 1px solid var(--line); border-radius: 8px; background: var(--paper); color: var(--ink); padding: 10px 14px; font-weight: 700; text-decoration: none; cursor: pointer; }
  button.primary { background: var(--accent); border-color: var(--accent); color: white; }
  button:disabled { opacity: 0.45; cursor: not-allowed; }
  .counter { color: var(--muted); font-weight: 700; }
  .slide { min-height: calc(100vh - 82px); background: var(--paper); border: 1px solid var(--line); border-radius: 10px; padding: 18px; box-shadow: 0 18px 42px rgba(15, 23, 42, 0.10); display: grid; grid-template-columns: minmax(310px, 0.86fr) minmax(0, 1.55fr); gap: 18px; overflow: visible; }
  .paper-head { min-width: 0; min-height: 0; overflow: visible; display: flex; flex-direction: column; gap: 12px; }
  .figure { margin: 0; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: #f8fafc; }
  .figure img { display: block; width: 100%; max-height: 41vh; object-fit: contain; background: white; }
  .figure figcaption { padding: 7px 10px; color: var(--muted); font-size: 12px; line-height: 1.3; }
  .head-text { display: flex; flex-direction: column; gap: 9px; min-width: 0; }
  .badges { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .badge { border-radius: 999px; padding: 5px 9px; background: #eef2ff; color: #3730a3; font-size: 12px; font-weight: 800; }
  .score { background: #fee2e2; color: #991b1b; }
  h1 { margin: 0; font-size: 25px; line-height: 1.15; letter-spacing: 0; overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
  h1 a { color: inherit; text-decoration-color: rgba(23, 107, 135, 0.35); text-decoration-thickness: 2px; text-underline-offset: 4px; }
  h1 a:hover { color: var(--accent); text-decoration-color: var(--accent); }
  .meta, .authors, .why, .abstract { font-size: 13px; line-height: 1.45; }
  .meta, .authors { color: var(--muted); }
  .why strong, .abstract strong, .authors strong { color: var(--ink); }
  .authors { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .why { border-left: 4px solid var(--accent-2); padding-left: 10px; color: #374151; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .abstract { border-top: 1px solid var(--line); padding-top: 14px; color: #374151; }
  .original-abstract { border-top: 1px solid var(--line); padding-top: 10px; color: #374151; font-size: 11.5px; line-height: 1.35; overflow-wrap: anywhere; }
  .original-abstract strong { display: block; margin-bottom: 4px; color: var(--ink); }
  .tags { display: flex; flex-wrap: wrap; gap: 8px; }
  .tag { border-radius: 999px; padding: 4px 8px; background: #f1f5f9; color: #475569; font-size: 12px; font-weight: 700; }
  .head-text > .link { display: none; }
  .briefing { min-width: 0; min-height: 0; overflow: visible; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); grid-auto-rows: minmax(0, auto); align-content: start; gap: 11px 18px; border-top: 0; padding-top: 0; }
  .brief-section { min-width: 0; }
  .brief-section.wide { grid-column: 1 / -1; }
  .brief-section h2 { margin: 0 0 4px; font-size: 14px; line-height: 1.22; color: #0f766e; letter-spacing: 0; }
  .brief-section p, .brief-section li { margin: 0; font-size: 12.5px; line-height: 1.42; color: #1f2937; overflow-wrap: anywhere; }
  .brief-section ul { margin: 0; padding-left: 20px; }
  .concepts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 9px 14px; }
  .concept { border-top: 1px solid var(--line); padding-top: 7px; }
  .concept h3 { margin: 0 0 4px; font-size: 13px; color: #7c2d12; letter-spacing: 0; }
  .concept p { margin: 2px 0 0; font-size: 11.5px; line-height: 1.35; color: #374151; overflow-wrap: anywhere; }
  .concept b { color: #111827; }
  .link { color: var(--accent); font-weight: 800; text-decoration: none; }
  .empty { padding: 48px; background: var(--paper); border: 1px solid var(--line); border-radius: 12px; color: var(--muted); }
  @media (max-width: 860px) {
    .shell { padding: 14px; }
    .topbar, .top-actions { align-items: stretch; flex-direction: column; }
    .slide, .briefing, .concepts { grid-template-columns: 1fr; }
    .slide { min-height: auto; overflow: visible; display: grid; }
    h1 { font-size: 28px; }
  }
</style>

<script>
const slides = [{"title": "Heterogeneous superconductivity emerging from a charge-stripe state in kagome lattices", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2610.32097", "authors": "Hongyu Li, Shuikang Yu, Huachen Rao, et al.", "last_authors": "Ziji Xiang, Xianhui Chen", "summary": "Charge density wave (CDW) and superconductivity have long been recognized as competing orders. However, recent achievements establish that the interplay between these two collective electronic phenomena can be more perplexing, with emergent phenomena arising from their cooperation. Here we report a distinctive case of the kagome superconductors CsV3Sb5-xSnx, in which the characteristics of superconductivity evolve in accordance with the form of CDW order. As the triple-Q CDW in CsV3Sb5 transforms to a short-range stripelike CDW at xc = 0.07, a sudden change in superconducting properties occurs concomitantly. A combination of thermodynamic, electrical transport and scanning tunneling microscopy experiments reveals a heterogeneous superconducting state beyond xc: the superconducting gap exhibits pronounced spatial variation, in conformity with a distribution of critical temperature and the resulted superconducting precursor effects. Moreover, abundant normal fluid persists deep into the superconducting state, as evidenced by remnants of electronic specific heat and zero-energy quasiparticle interference. These observations are unrelated to the chemical inhomogeneity and residual strain effect introduced by Sn substitution. Instead, they emulate the phenomenology that a sign-changing superconducting order parameter is subject to strong pair-breaking scattering with the short-range charge stripes and hence reflect the unconventional nature of superconductivity developing inside the charge-stripe state.", "tier": "A_MUST_READ", "score": "10", "reason": "Direct hit: experimental study of superconductivity and charge stripes in CsV3Sb5-xSnx.", "tags": ["experiment", "kagome", "superconductivity", "CsV3Sb5"], "image": "https://arxiv.org/static/browse/0.3.4/images/arxiv-logo-fb.png", "briefing": {"background": "카고메 격자 시스템인 AV3Sb5 계열은 전하 밀도 파동(CDW)과 초전도성이 공존하거나 경쟁하는 독특한 위상 물질로 주목받고 있습니다. 일반적으로 CDW와 초전도는 서로 경쟁 관계에 있다고 여겨지지만, 최근 연구들은 이들 사이의 복잡한 상호작용이 새로운 양자 상태를 유도할 수 있음을 시사합니다.", "motivation": "CsV3Sb5 시스템에서 Sn 치환을 통해 기존의 Triple-Q CDW가 단거리 줄무늬(stripe) 형태의 CDW로 변할 때, 초전도 특성이 어떻게 진화하는지 그 미시적 메커니즘을 밝히고자 했습니다.", "result": "Sn 치환량이 특정 임계치(xc = 0.07)를 넘어서면 초전도 갭이 공간적으로 크게 변하는 불균일한(heterogeneous) 초전도 상태가 나타남을 확인했습니다. 비열 측정과 STM/STS를 통해 초전도 상태 내부에서도 상당한 양의 정상 상태 유체(normal fluid)가 잔류하며, 이는 짧은 거리의 전하 줄무늬와 부호가 변하는(sign-changing) 초전도 질서 매개변수 사이의 강한 쌍 파괴(pair-breaking) 산란 결과임을 제시했습니다.", "implication": "카고메 초전도체에서 초전도 현상이 단순한 BCS 이론을 넘어 CDW의 대칭성 및 형태에 매우 민감하게 반응함을 보여줍니다. 특히 전하 줄무늬 상태 내에서 발달하는 초전도의 비전통적(unconventional) 성질을 뒷받침합니다.", "novelty": "독자의 관심사인 CsV3Sb5 계열에서 CDW 변형에 따른 초전도 갭의 공간적 불균일성과 QPI를 통한 준입자 간섭 패턴 분석을 직접적으로 연결했습니다. 화학적 불균일성이 아닌 CDW 대칭성 변화에 따른 본질적인 효과임을 입증한 점이 중요합니다.", "unresolved": "부호가 변하는 초전도 질서 매개변수의 구체적인 대칭성(예: d-wave 혹은 s+- wave)과 줄무늬 CDW와의 구체적인 산란 단면적에 대한 추가 연구가 필요합니다.", "future_work": "Sn 농도에 따른 위상적 성질의 변화 확인 및 극저온에서의 더 정밀한 ARPES 측정을 통한 페르미면 변화 관찰이 기대됩니다.", "concepts": [{"term": "Charge-stripe state", "why_emerged": "기존의 등방적인 CDW와 달리 특정 방향성을 가진 전자 밀도 변조를 설명하기 위해 도입되었습니다.", "origin": "고온 초전도체(cuprates) 등 강상관 계에서 널리 연구되어 온 개념입니다.", "connections": "Nematicity, Unconventional superconductivity, CsV3Sb5"}, {"term": "Heterogeneous superconductivity", "why_emerged": "거시적으로는 초전도이나 미시적으로 물리량이 공간에 따라 무질서하게 변하는 상태를 설명하기 위해 등장했습니다.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "Pair-breaking scattering, Spatial gap variation, Disorder"}, {"term": "Zero-energy quasiparticle interference (QPI)", "why_emerged": "초전도체 내부의 산란 기작과 질서 매개변수의 위상 정보를 파악하기 위해 사용되는 도구입니다.", "origin": "STM 기술의 발전과 함께 확립되었습니다.", "connections": "STM/STS, Bogoliubov quasiparticles, Gap symmetry"}, {"term": "Triple-Q CDW", "why_emerged": "카고메 격자에서 세 개의 서로 다른 파동 벡터가 결합하여 형성되는 CDW 패턴을 설명합니다.", "origin": "AV3Sb5 시스템의 초기 연구들에서 확립되었습니다.", "connections": "Kagome lattice, CsV3Sb5, Time-reversal symmetry breaking"}], "english_summary": ["Investigates the evolution of superconductivity in CsV3Sb5-xSnx as the triple-Q CDW transitions to a short-range stripe CDW.", "Identifies a heterogeneous superconducting state with significant spatial gap variation and persistent normal fluid.", "Proposes that sign-changing superconducting order parameters undergo strong pair-breaking scattering with charge stripes.", "Demonstrates that the nature of kagome superconductivity is intrinsically linked to the underlying CDW symmetry."]}}, {"title": "Intrinsic Raman Modes and Crystal Symmetry of Altermagnetic -MnTe", "journal": "arXiv_CondMat", "source": "author whitelist", "link": "https://arxiv.org/abs/2610.32261", "authors": "Yunpeng Cui, Shuai Zhang, Jia-Liang Xie, et al.", "last_authors": "Feng Jin, Luyi Yang", "summary": "Crystal symmetry governs the physical properties of materials and provides the framework for interpreting their microscopic excitations and macroscopic responses. In altermagnets, the crystal symmetries that relate opposite-spin sublattices give rise to momentum-dependent spin splitting despite compensated magnetization. Determining the real crystal symmetry is therefore essential for understanding the intrinsic electronic and magnetic properties. For the altermagnetic semiconductor ${\\alpha}$-MnTe, conflicting Raman assignments have left both its intrinsic lattice excitations and its crystal symmetry unresolved. Here we combine high-resolution Raman and second-harmonic generation (SHG) spectroscopy with first-principles calculations to distinguish intrinsic lattice excitations from Te-derived spectral contributions and to examine bulk inversion symmetry of ${\\alpha}$-MnTe. We show that several prominent Raman features previously assigned to ${\\alpha}$-MnTe instead originate from segregated Te clusters or precipitates. The remaining intrinsic Raman response consists of a single Raman-active mode assigned to the calculated $E_{2g}$ phonon, consistent with the centrosymmetric $D_{6h}$ symmetry. The SHG response agrees with surface electric-dipole and bulk electric-quadrupole contributions expected for a centrosymmetric $D_{6h}$ crystal, supporting the preservation of bulk inversion symmetry in ${\\alpha}$-MnTe. Our findings revise the Raman assignments in ${\\alpha}$-MnTe and provide a basis for interpreting its altermagnetic properties within the appropriate crystal-symmetry framework.", "tier": "A_MUST_READ", "score": "10", "reason": "author whitelist: Shuyun Zhou", "tags": ["STS", "altermagnet", "phonon"], "image": "https://arxiv.org/static/browse/0.3.4/images/arxiv-logo-fb.png", "briefing": {"background": "알터마그네티즘(Altermagnetism)은 순 자화량은 0이지만 결정 대칭성에 의해 운동량 공간에서 스핀 분할이 일어나는 새로운 자기 상태입니다. MnTe는 이러한 성질을 가질 것으로 기대되는 대표적인 물질이나, 그 결정 대칭성에 대해 논란이 있었습니다.", "motivation": "MnTe의 라만 산란 실험 결과가 연구마다 상이하여 본질적인 격자 여기와 결정 대칭성(반전 대칭성 유무 등)을 명확히 규명하고자 했습니다.", "result": "고해상도 라만 분광법과 제2고조파 생성(SHG) 분석을 통해 기존 연구에서 보고된 많은 라만 모드들이 MnTe 자체가 아닌 불순물인 Te 클러스터에서 기인했음을 밝혔습니다. 순수한 알파-MnTe는 D6h 대칭성을 따르는 중심 대칭(centrosymmetric) 구조임을 입증했습니다.", "implication": "MnTe의 알터마그네틱 스핀 분할 현상을 해석할 때 반전 대칭성이 보존된 D6h 대칭성 프레임워크를 사용해야 함을 명확히 했습니다. 이는 기존의 대칭성 파괴 모델들을 수정하는 기준이 됩니다.", "novelty": "알터마그넷 후보 물질인 MnTe의 물성 논란을 실험적으로 종결지었으며, 특히 독자가 중시하는 스핀-운동량 잠금 및 전자 구조 해석의 기초가 되는 결정 구조 대칭성을 확정했습니다.", "unresolved": "D6h 대칭성 하에서 발생할 수 있는 구체적인 스핀 분할의 크기와 방향에 대한 ARPES와의 직접적인 비교 검증이 남아 있습니다.", "future_work": "확정된 대칭성을 바탕으로 한 MnTe의 스핀 동역학 연구 및 외부 압력이나 변형을 이용한 대칭성 조절 연구가 가능해질 것입니다.", "concepts": [{"term": "Altermagnetism", "why_emerged": "강자성(FM)의 스핀 분할과 반강자성(AFM)의 순 자화 제로 특성을 동시에 갖는 물질군을 분류하기 위해 등장했습니다.", "origin": "최근 Libor Šmejkal 등에 의해 이론적으로 체계화되었습니다.", "connections": "Spin-splitting, Antiferromagnetism, Berry curvature"}, {"term": "Second-Harmonic Generation (SHG)", "why_emerged": "물질의 반전 대칭성(Inversion symmetry) 파괴 여부를 극도로 민감하게 측정하기 위해 사용됩니다.", "origin": "비선형 광학 분야의 초기부터 발전했습니다.", "connections": "Nonlinear optics, Inversion symmetry, Symmetry breaking"}, {"term": "D6h symmetry", "why_emerged": "육방정계 구조에서 반전 대칭성을 포함하는 높은 대칭성을 기술하기 위해 사용됩니다.", "origin": "결정학적 군론(Group Theory)", "connections": "Centrosymmetry, Alpha-MnTe, Hexagonal lattice"}, {"term": "Intrinsic lattice excitations", "why_emerged": "시료 내의 불순물이나 표면 산화물에 의한 신호와 실제 결정 본연의 진동 모드를 구분하기 위해 필요합니다.", "origin": "분광학 일반", "connections": "Raman spectroscopy, Phonon modes"}], "english_summary": ["Clarifies the crystal symmetry of altermagnetic alpha-MnTe using high-resolution Raman and SHG spectroscopy.", "Attributes previously reported extraneous Raman modes to segregated Te impurities rather than intrinsic MnTe lattice.", "Confirms alpha-MnTe is centrosymmetric with D6h symmetry, providing a definitive framework for its altermagnetic properties.", "Resolves long-standing conflicts regarding the structural symmetry and phonon assignments of this key altermagnet."]}}, {"title": "Kagome goldene with flat bands and Dirac nodal line fermions via line-graph epitaxy", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2503.07945", "authors": "Qiwei Tian, Sahar Izadi Vishkayi, Chen Zhang, et al.", "last_authors": "Lijie Zhang, Zhihui Qin", "summary": "The kagome lattice has emerged as a promising platform for investigating exotic quantum phases. However, achieving a single-atomic-layer kagome lattice in elemental materials remains a significant challenge. Here, we introduce line-graph epitaxy, a novel approach that enables the atomic-scale synthesis of goldene, a monolayer of elemental gold atoms arranged in a kagome lattice. Through scanning tunneling microscopy/spectroscopy (STM/STS), and density functional theory (DFT) calculations, we demonstrate the formation of kagome goldene, featuring a flat band with a van Hove singularity approximately 1.1 eV below the Fermi level, signaling strong electron correlation effects. Notably, the flat band is disrupted at the zigzag edges of goldene nanoflakes, revealing substantial edge effects. Furthermore, our calculations show that weak interlayer interactions between goldene and the underlying Au2Ge substrate generate dual Dirac nodal lines through a proximity effect. These findings offer not only a novel strategy for constructing elemental kagome lattices, but also a generalizable framework for fabricating and controlling line-graph materials. This research advances the exploration of quantum phases driven by strong correlations and the design of materials for next-generation quantum technologies.", "tier": "A_MUST_READ", "score": "10", "reason": "Direct hit: Kagome lattice, flat bands, Dirac fermions, and STM/STS on a new monolayer material.", "tags": ["material", "STM", "kagome", "Dirac", "flatband"], "image": "https://arxiv.org/static/browse/0.3.4/images/arxiv-logo-fb.png", "briefing": {"background": "카고메 격자는 평탄 밴드(flat band)와 디락 노드(Dirac node)를 동시에 가질 수 있어 강한 상관관계 효과와 위상적 특성을 연구하기에 최적의 플랫폼입니다. 하지만 원소 하나로 이루어진 단원자층 카고메 격자를 합성하는 것은 매우 어려운 과제였습니다.", "motivation": "금(Au) 원자로 구성된 단일층 카고메 격자인 '골덴(goldene)'을 합성하고 그 전자 구조를 확인하고자 했습니다.", "result": "Line-graph epitaxy라는 새로운 방식을 통해 Au2Ge 기판 위에 카고메 구조의 골덴을 합성하는 데 성공했습니다. STM/STS를 통해 페르미 준위 아래 약 1.1 eV에서 반 호브 특이점(vHs)을 동반한 평탄 밴드를 관측했으며, 이론 계산을 통해 기판과의 상호작용으로 형성된 듀얼 디락 노드 라인(dual Dirac nodal lines)을 예측했습니다.", "implication": "단순한 원소 기반의 2D 물질에서도 복잡한 카고메 격자 물성을 구현할 수 있음을 보여주었으며, 평탄 밴드에 의한 강상관 현상 연구의 새로운 장을 열었습니다.", "novelty": "독자의 관심사인 카고메 격자, 평탄 밴드, 디락 페르미온을 모두 포함하며, 특히 STM을 이용해 단원자층 수준에서 전자 구조를 직접 입증한 점이 매우 강력한 소구력을 가집니다.", "unresolved": "기판과의 상호작용이 전자 구조에 미치는 영향을 완전히 분리하여 골덴 자체의 물성만을 제어하는 방법과 페르미 준위를 평탄 밴드 위치로 조절하는 것이 과제입니다.", "future_work": "다른 귀금속 기반의 라인 그래프 격자 합성으로의 확장 및 평탄 밴드 위치에서의 자성 혹은 초전도성 발현 여부 탐색이 기대됩니다.", "concepts": [{"term": "Goldene", "why_emerged": "그래핀(Graphene)처럼 금 원자를 단일 층의 2D 구조로 만들어 새로운 양자 효과를 탐구하기 위해 명명되었습니다.", "origin": "최근 2D 물질 연구 분야에서 제안되었습니다.", "connections": "Graphene, 2D mat gnetic properties in quasi-1D structures."]}}, {"title": "Visualizing symmetry-broken Chern insulators and their quantum melting", "journal": "Science", "source": "author whitelist", "link": "https://www.science.org/doi/abs/10.1126/science.aef0940?af=R", "authors": "Minhao He†, Yen-Chen Tsui†, Ran Peng, et al.", "last_authors": "Oskar Vafek, Ali Yazdani", "summary": "In the presence of a magnetic field, electronic states of moiré quantum materials develop a Hofstadter spectrum that provides a distinctive setting for studying the interplay between band topology and strong electron-electron interaction. Using scanning tunneling microscopy, we studied Hofstadter’s states in bilayer graphene aligned with hexagonal boron nitride and directly visualized the formation of interaction-driven symmetry breaking Chern insulators. Our measurements revealed the formation of phases that double, triple, or quadruple the moiré unit cell at fractional filling of the Hofstadter bands as well as states with complex intra–unit cell wave functions. We visualized two distinct quantum phenomena in different Chern states, including quantum melting driven by the appearance and proliferation of topological defects and a quantum transition co-occurring with phase competition and separation.", "tier": "A_MUST_READ", "score": "9", "reason": "author whitelist: Ali Yazdani", "tags": ["Chern"], "image": "", "briefing": {"background": "모아레(moiré) 양자 물질은 격자 간의 비틀림이나 정렬을 통해 전자 구조를 조절할 수 있는 플랫폼으로, 특히 강한 자기장 하에서 호프스타터(Hofstadter) 스펙트럼과 같은 복잡한 위상적 상태를 연구하는 데 사용됩니다. 이 시스템에서는 전자 간의 강한 상호작용으로 인해 대칭성이 깨진 독특한 절연체 상태가 나타날 수 있습니다.", "motivation": "호프스타터 밴드의 분수 충전(fractional filling) 상태에서 나타나는 상호작용 유도 대칭성 깨짐 체른 절연체(Chern insulator)의 공간적 구조와 이들이 열적/양자적으로 어떻게 붕괴(melting)되는지를 직접적으로 시각화하고자 했습니다.", "result": "STM(주사 터널링 현미경)을 사용하여 hBN과 정렬된 이중층 그래핀에서 모아레 단위 격자가 2배, 3배, 4배로 확장되는 분수 체른 절연체 상태를 관측했습니다. 또한, 위상 결함(topological defects)의 증식에 의한 양자 용융 현상과 서로 다른 위상 간의 경쟁 및 상 분리 현상을 직접 시각화하는 데 성공했습니다.", "implication": "모아레 시스템에서의 체른 절연체가 단순히 밴드 위상에 의한 것이 아니라, 격자 대칭성을 자발적으로 깨뜨리는 강한 상관관계 효과에 의해 형성됨을 확증했습니다.", "novelty": "Ali Yazdani 그룹의 고해상도 STM 기술을 활용하여, 이론적으로만 예측되던 호프스타터 밴드 내의 복잡한 단위 격자 확장 및 양자 상전이 과정을 실공간에서 처음으로 구현하고 시각화했다는 점이 핵심입니다. 독자의 STM 및 전자 구조 관심사와 완벽히 일치합니다.", "unresolved": "관측된 양자 용융 과정에서 나타나는 위상 결함의 정확한 미시적 산란 기작과 외부 환경(기판 등)이 미치는 영향에 대한 추가 연구가 필요합니다.", "future_work": "다른 비틀림 각도나 모아레 물질 시스템에서 유사한 대칭성 깨짐 상태를 탐색하고, 이를 이용한 비가환 통계(non-abelian statistics) 소자 구현 가능성을 타진할 것으로 보입니다.", "concepts": [{"term": "Hofstadter's states", "why_emerged": "주기적인 격자 퍼텐셜과 자기장이 공존할 때 전자의 에너지 스펙트럼이 프랙탈 구조를 가짐을 설명하기 위해 도입되었습니다.", "origin": "Douglas Hofstadter (1976)", "connections": "Landau levels, moiré superlattices, Butterfly spectrum"}, {"term": "Chern Insulator", "why_emerged": "외부 자기장 없이도 밴드 자체의 위상적 성질(Chern number)에 의해 양자 홀 효과와 유사한 성질을 나타내는 상태를 설명하기 위함입니다.", "origin": "F. D. M. Haldane (1988)", "connections": "Quantum anomalous Hall effect, Berry curvature"}, {"term": "Quantum Melting", "why_emerged": "절대 영도 근처에서 열적 요동이 아닌 양자 요동에 의해 고체와 같은 질서 상태가 파괴되는 현상을 설명하기 위해 사용됩니다.", "origin": "초록 정보만으로는 특정하기 어려움 (전통적인 응집물질 물리 개념)", "connections": "Quantum phase transition, Topological defects"}, {"term": "Symmetry-broken state", "why_emerged": "시스템의 해밀토니안이 가진 대칭성보다 낮은 대칭성을 갖는 바닥 상태가 나타나는 강상관계 물리 현상을 설명합니다.", "origin": "L. Landau, P. W. Anderson 등", "connections": "Spontaneous symmetry breaking, Superconductivity, CDW"}], "english_summary": ["Direct visualization of interaction-driven symmetry-breaking Chern insulators in moiré bilayer graphene using STM.", "Observation of unit cell multiplication (doubling, tripling, quadrupling) at fractional fillings of Hofstadter bands.", "Imaging of quantum melting processes driven by the proliferation of topological defects.", "Demonstration of phase competition and separation between different Chern states."]}}, {"title": "Strain-tunable van Hove singularity and superconducting dome in monolayer kagome metal CsTi3Bi5", "journal": "arXiv_CondMat", "source": "keyword", "link": "https://arxiv.org/abs/2610.32359", "authors": "Run Lv, Wenqian Tu, Dingfu Shao, Yuping Sun, Wenjian Lu", "last_authors": "Yuping Sun, Wenjian Lu", "summary": "The recently discovered titanium-based kagome metal CsTi$_3$Bi$_5$, which exhibits superconductivity without an accompanying charge density wave, provides an ideal platform to investigate the intrinsic electronic structure and superconductivity. Moreover, it enables the exploration of superconductivity in the two-dimensional limit of the kagome lattice. Here, we systematically investigate the influence of biaxial mechanical strain ($\\varepsilon$) on the electronic structure and superconductivity of monolayer CsTi$_3$Bi$_5$ using first-principles calculations. We demonstrate that the prominent van Hove singularity (VHS) at the M point can be monotonically tuned to the Fermi level by tensile strain. Furthermore, the superconducting transition temperature $T_C$ exhibits a dome-shaped dependence on strain, reaching a maximum of 3.6 K at an optimal tensile strain of $\\varepsilon=+2\\%$. The average superconducting gap magnitude is 0.35 meV, with an orbital-dependent and anisotropic distribution. Our results provide a detailed understanding of the superconductivity of monolayer CsTi$_3$Bi$_5$ and show that strain is an effective, continuous tuning knob for manipulating the electronic structure and superconductivity.", "tier": "A_MUST_READ", "score": "9", "reason": "title strong match: kagome metal", "tags": ["kagome", "chargedensitywave", "monolayer", "superconduct"], "image": "https://arxiv.org/html/2610.32359v1/Fig1.png", "briefing": {"background": "최근 발견된 AV3Sb5 계열의 카고메 금속은 전하 밀도 파(CDW)와 초전도성의 공존으로 큰 주목을 받았습니다. 반면, Ti 기반의 CsTi3Bi5는 CDW 없이 초전도성만 나타내어 카고메 격자의 순수한 초전도 기작을 연구하기에 더 적합한 모델로 여겨집니다.", "motivation": "단층(monolayer) CsTi3Bi5에서 물리적 변형(strain)이 전자 구조, 특히 반호브 특이점(VHS)의 위치와 초전도 전이 온도(Tc)에 미치는 영향을 계산적으로 규명하고자 했습니다.", "result": "제1원리 계산을 통해 인장 변형(tensile strain)이 M 지점의 반호브 특이점을 페르미 준위로 이동시킴을 확인했습니다. 이에 authors": "Senlei Li, Xiaomeng Cui, Renzhi Sun, et al.", "last_authors": "Philip Kim, Chunhui Rita Du", "summary": "Recently, unconventional superconductivity hosted by twisted van der Waals (vdW) heterostructures has received immense interest due to the exotic pairing symmetry, electronic interactions and nontrivial topological nature that are naturally relevant to the fast-advancing quantum technologies. Here, we report scanning-probe quantum sensing of nanoscale electromagnetic behaviors of twisted vdW cuprate superconductors. Using single-spin relaxometry, we directly visualize edge modes spontaneously formed in twisted Bi2Sr2CaCu2O8+x (BSCCO). By investigating temperature dependent variations of edge-state-induced quantum spin relaxation, we experimentally evaluate the magnitude of nontrivial topological band gap opened at nodal points in twisted BSCCO and its critical temperature behaviors under different twist angles. We further observe alternating chiral domains defined by edge modes, exploring experimental signatures of in-plane magnetic field-induced topology in 45{\\deg} twisted BSCCO. Our results advance the current understanding of twisted vdW nodal superconductors, presenting an appealing high-temperature topological superconducting material platform for cutting-edge quantum innovation.", "tier": "B_IMPORTANT_CONDMAT", "score": "10", "reason": "Direct experimental study (scanning probe) on topological edge modes in twisted cuprates.; demoted from A: broad CM, not direct user/project hit", "tags": ["cuprate", "superconductivity", "topology", "scanning-probe"], "image": "https://arxiv.org/static/browse/0.3.4/images/arxiv-logo-fb.png", "briefing": {"background": "비틀린 반데르발스 이종 구조(twisted vdW heterostructures)는 두 층 사이의 비틀림 각도를 조절하여 새로운 위상적 상태를 만들어낼 수 있습니다. 특히 구리 산화물 초전도체(cuprate)를 비틀어 쌓을 경우, d-파동 초전도성의 결합으로 인해 키랄 위상 초전도(chiral topological superconductivity)가 나타날 것으로 기대되어 왔습니다.", "motivation": "비틀린 BSCCO(Bi2212) 시스템에서 이론적으로 예측된 위상적 에지 모드(edge mode)와 위상 밴드갭을 J)", "why_emerged": "기존 자성 메모리의 속도 한계를 극복하고 외부 자기장 간섭을 없애기 위해 등장했습니다.", "origin": "초록 정보만으로는 특정하기 어려우나 2010년대 중반 이후 이론/실험적 구체화됨", "connections": "Ferromagnetic Tunnel Junction, TMR effect"}, {"term": "Octupole-driven Spin-transfer Torque", "why_emerged": "순 자화가 없는 반강자성체의 상태를 전기적으로 제어하기 위한 새로운 물리적 메커니즘이 필요했습니다.", "origin": "본 연구진 및 최근 비공선 자성체 이론가들", "connections": "Spin-orbit torque, Weyl antiferromagnetism"}], "english_summary": ["Demonstrates all-antiferromagnetic tunnel junctions with large TMR.", "Introduces octupole-driven spin-transfer torque for switching magnetic states.", "Enables nanoscale, room-temperature, and potentially THz spintronic memory.", "Utilizes non-collinear magnetic order to overcome limitations of traditional FM devices."]}}, {"title": "A simple twist to altermagnetism", "journal": "Nature_Physics", "source": "Gemini", "link": "https://www.nature.com/articles/s41567-026-03495-x", "authors": "Yingying Zhang, Cheng Song", "last_authors": "Yingying Zhang, Cheng Song", "summary": "Two-dimensional altermagnets hold promise for next-generation spintronics but remain difficult to synthesize. Now, altermagnetism has been observed in an orthogonally twisted van der Waals homostructure, opening possibilities for ultrathin devices.", "tier": "B_IMPORTANT_CONDMAT", "score": "9", "reason": "Experimental altermagnetism in twisted van der Waals, a direct and important interest.", "tags": ["altermagnetism", "vanderWaals", "twistedbilayer", "experimental"], "image": "https://media.springernature.com/m685/springer-static/image/art%3A10.1038%2Fs41567-026-03495-x/MediaObjects/41567_2026_3495_Fig1_HTML.png", "briefing": {"background": "알터마그네티즘(Altermagnetism)은 반강자성처럼 순 자화는 0이지만, 강자성처럼 밴드 구조에서 스핀 분할이 일어나는 제3의 자성 상태입니다. 스핀트로닉스의 차세대 핵심 소재로 주목받고 있으나 자연계에서 2D 형태로 구현하기는 어려웠습니다.", "motivation": "반데르발스(vdW) 층상 물질을 특정 각도로 비트는(twisting) 단순한 공정만으로 알터마그네틱 특성을 인위적으로 생성할 수 있는지 탐구했습니다.", "result": "직교하도록 비틀린(orthogonally twisted) vdW 호모 구조에서 알터마그네티즘을 관측했습니다. 이는 소재 자체의 대칭성을 비틀림으로 조절하여 스핀 분할을 유도한 결과입니다.", "implication": "복잡한 신소재 합성 없이도 기존 vdW 물질의 적층 제어만으로 고성능 알터마그네틱 소자를 제작할 수 있는 경로를 제시했습니다.", "novelty": "사용자의 주요 관심사인 알터마그네티즘과 트위스트/모아레(moiré) 물리 및 vdW 이종구조를 결합했다는 점에서 매우 높은 관련성을 가집니다.", "unresolved": "비틀림 각도의 정밀도에 따른 특성 변화의 민감도와 대면적 제작 시의 균일성 문제가 남아 있습니다.", "future_work": "ARPES를 통한 직접적인 스핀 분할 밴드 구조 측정과 이를 이용한 초박막 스핀 트랜지스터 구현 연구가 예상됩니다.", "concepts": [{"term": "Altermagnetism", "why_emerged": "반강자성의 고속/안정성과 강자성의 스핀 활용성을 동시에 갖춘 자성체를 설명하기 위해 정의되었습니다.", "origin": "L. Šmejkal, J. Sinova, and T. Jungwirth (2022년경 체계화)", "connections": "Antiferromagnetism, Spin-splitting, Berry curvature"}, {"term": "Twisted vdW homostructure", "why_emerged": "두 층 사이의 비틀림 각도를 조절하여 새로운 전자 구조(모아레 무늬 등)를 설계하기 위해 사용됩니다.", "origin": "Twistronics (Mina et al., 2018년경 활성화)", "connections": "Magic-angle twisted bilayer graphene, Moiré physics"}], "english_summary": ["Observed altermagnetism in orthogonally twisted van der Waals homostructures.", "Proves that twisting can induce spin-splitting in materials with zero net magnetization.", "Provides a simple platform for synthesizing 2D altermagnets for spintronics.", "Expands the scope of twistronics from superconductivity to altermagnetism."]}}, {"title": "Anomalous Hall enhancement in fully compensated noncollinear antiferromagnetic Cr-doped Mn3Sn", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/kz93-vvjb", "authors": "Ying Zhang, Xin Chen, Hang Xie, Ziyan Luo, Yihong Wu, Lei Shen (沈雷)", "last_authors": "Yihong Wu, Lei Shen (沈雷)", "summary": "The noncollinear antiferromagnet (AFM), ${\\mathrm{Mn}}_{3}\\mathrm{Sn}$, exhibits ultrafast spin dynamics and negligible stray fields, making it a promising candidate for fast and energy-efficient spintronic devices. However, its practical applications remain limited by the relatively small Hall resp…", "tier": "B_IMPORTANT_CONDMAT", "score": "9", "reason": "High relevance: noncollinear AFM Mn3Sn and Berry curvature-driven anomalous Hall effect.", "tags": ["experiment", "material", "Berrycurvature"], "image": "", "briefing": {"background": "Mn3Sn은 비공선 반강자성체로서, 실온에서도 강한 베리 곡률(Berry curvature)에 의해 거대한 이상 홀 효과(AHE)를 나타내는 독특한 물질입니다. 하지만 응용을 위해서는 홀 전압(Hall response)의 크기를 더 키울 필요가 있습니다.", "motivation": "순 자화가 없는 완전 보상(fully compensated) 상태를 유지하면서도 이상 홀 효과를 극대화할 수 있는 도핑 전략을 연구했습니다.", "result": "Mn3Sn에 Cr을 도핑함으로써, 자기적인 보상 상태를 깨뜨리지 않으면서도 이상 홀 효과가 현저히 강화됨을 확인했습니다. 이는 페르미 준위 근처의 전자 구조 변화와 베리 곡률의 증폭에 기인합니다.", "implication": "화학적 도핑을 통해 비공선 반강자성체의 위상적 특성을 정밀하게 튜닝할 수 있음을 보여주었으며, 고효율 반강자성 스핀 센서나 메모리 읽기 소자에 활용 가능합니다.", "novelty": "사용자가 집중 연구하는 Mn3Sn 소재와 베리 곡률, 이상 홀 효과를 모두 다루고 있습니다. 특히 Cr 도핑이라는 구체적인 재료 공학적 접근법을 제시했습니다.", "unresolved": "Cr 도핑이 정확히 웨일 노드(Weyl nodes)의 위치나 베리 곡률 분포에 어떤 미시적 변화를 주는지에 대한 직접적인 실험적 증거(ARPES 등)가 보완되어야 합니다.", "future_work": "강한 자기장 및 변형(strain) 하에서의 AHE 변화 측정과 광학적 수송 특성 연구가 이어질 것으로 보입니다.", "concepts": [{"term": "Anomalous Hall Effect (AHE) in AFM", "why_emerged": "자화가 없는 물질에서도 위상적 효과에 의해 홀 전압이 발생할 수 있음을 이해하기 위해 중요해졌습니다.", "origin": "초록 정보만으로는 특정하기 어려우나 Mn3Sn에서 Nakatsuji 등이 최초 발견", "connections": "Berry curvature, Weyl semimetal, Non-collinear magnetism"}, {"term": "Fully compensated", "why_emerged": "외부 자기 간섭을 완전히 차단하기 위해 순 자화값이 0인 상태를 유지하는 것이 중요합니다.", "origin": "전통적인 자성학 개념", "connections": "Antiferromagnetism, Ferrimagnetism"}], "english_summary": ["Enhanced the anomalous Hall effect in Mn3Sn via Cr-doping.", "Maintained a fully compensated antiferromagnetic state while boosting Hall response.", "Attributed the enhancement to the tuning of Berry curvature near the Fermi level.", "Offers a strategy for optimizing topological transport in non-collinear antiferromagnets."]}}, {"title": "Contrasting anomalous Hall mechanisms in Fe3GeTe2 and Fe5GeTe2: Intrinsic Berry curvature and the emergence of skew scattering", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/lvt5-5y4x", "authors": "Jyoti Saini, Siddharth Kumar, Ankita Tiwari, Pawan Kumar Srivastava, Changgu Lee, Subhasis Ghosh", "last_authors": "Changgu Lee, Subhasis Ghosh", "summary": "We report a comparative study of the anomalous Hall effect (AHE) in single crystals of the two-dimensional van der Waals (vdWs) ferromagnets ${\\mathrm{Fe}}_{3}{\\mathrm{GeTe}}_{2}$ and ${\\mathrm{Fe}}_{5}{\\mathrm{GeTe}}_{2}$, grown by chemical vapor transport, over wide temperature and magnetic-fi…", "tier": "B_IMPORTANT_CONDMAT", "score": "9", "reason": "Direct hit on Berry curvature and anomalous Hall in key vdW ferromagnetic materials.", "tags": ["experiment", "material", "Berrycurvature"], "image": "", "briefing": {"background": "반데르발스(vdW) 층상 강자성체는 2차원 자성 및 위상 기하학적 현상을 연구하기 위한 핵심 플랫폼입니다. 특히 Fe-Ge-Te 계열은 높은 큐리 온도와 강한 수직 자기 이방성을 가져 스핀트로닉스 응용 측면에서 큰 관심을 받고 있습니다.", "motivation": "Fe3GeTe2(F3GT)와 Fe5GeTe2(F5GT)는 화학 조성이 유사하지만 물리적 성질이 다릅니다. 이 연구는 두 물질에서 이상 홀 효과(AHE)의 메커니즘이 각각 내인적(Intrinsic) 요인과 외인적(Extrinsic) 요인 중 어디에 기인하는지 규명하고자 합니다.", "result": "F3GT의 이상 홀 효과는 주로 전자 구조의 베리 곡률(Berry curvature)에 의한 내인적 기여로 설명되는 반면, F5GT에서는 스큐 산란(Skew scattering)과 같은 불순물에 의한 외인적 기여가 지배적으로 나타남을 확인했습니다.", "implication": "동일한 계열의 물질이라도 격자 구조와 Fe 함량의 미세한 변화가 전자 수송 특성의 위상 기하학적 기원을 근본적으로 바꿀 수 있음을 시사합니다.", "novelty": "Berry curvature와 AHE 메커니즘에 관심이 높은 독자에게 매우 유용한 비교 연구입니다. F5GT에서 관찰된 스큐 산란의 발현은 고전적인 산란 이론과 위상 물리 사이의 경계를 보여주는 중요한 사례입니다.", "unresolved": "온도 변화에 따른 두 메커니즘 간의 상호 전환 가능성이나 격자 결함(defect)의 구체적인 유형이 산란에 미치는 영향은 추가 규명이 필요합니다.", "future_work": "F5GT의 조성을 정밀 제어하여 스큐 산란을 억제하거나, 반대로 베리 곡률 기여도를 극대화하려는 수송 실험 및 ARPES 측정이 기대됩니다.", "concepts": [{"term": "Anomalous Hall Effect (AHE)", "why_emerged": "강자성체에서 외부 자기장 없이도 전하 운반자가 수직 방향으로 휘어지는 현상을 설명하기 위해 등장했습니다.", "origin": "Edwin Hall (1881)", "connections": "Berry curvature, Spin Hall effect, Skew scattering"}, {"term": "Berry Curvature", "why_emerged": "물질 내 전자의 파동함수가 갖는 기하학적 위상 성질이 수송 특성에 미치는 영향을 수학적으로 기술하기 위해 도입되었습니다.", "origin": "Michael Berry (1984)", "connections": "Chern number, Quantum Hall effect, Intrinsic AHE"}, {"term": "Skew Scattering", "why_emerged": "불순물에 의한 비대칭 산란이 홀 전압을 형성하는 외인적 메커니즘을 설명하기 위해 필요했습니다.", "origin": "Jan Smit (1955/1958)", "connections": "Extrinsic AHE, Impurity scattering, Side-jump"}, {"term": "van der Waals Ferromagnets", "why_emerged": "원자 층 단위로 박리가 가능한 2차원 자성체를 구현하여 저차원 자성 물성을 연구하기 위해 주목받았습니다.", "origin": "초록 정보만으로는 특정하기 어려움 (CrI3, Fe3GeTe2 등이 초기 연구됨)", "connections": "2D materials, Spintronics, Moiré magnets"}], "english_summary": ["Comparative study of AHE in vdW ferromagnets Fe3GeTe2 and Fe5GeTe2.", "Identifies intrinsic Berry curvature as the dominant AHE mechanism in Fe3GeTe2.", "Observes the emergence of extrinsic skew scattering in Fe5GeTe2.", "Highlights the sensitivity of topological transport to Fe concentration and structural details."]}}, {"title": "Observation of Kondo Effect in Rhombohedral Graphene Superlattices", "journal": "PRL_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/vc5l-ts6m", "authors": "Xin Liao, Qing Yin, Huiwen Wang, et al.", "last_authors": "Yu-Gui Yao, Zhi-Min Liao", "summary": "The Kondo effect in strongly correlated systems arises from the antiferromagnetic coupling between itinerant conduction electrons and localized magnetic moments, giving rise to a variety of exotic quantum phenomena. Two-dimensional moiré superlattice systems provide a highly tunable platform featuri…", "tier": "B_IMPORTANT_CONDMAT", "score": "9", "reason": "Experimental observation of Kondo effect in moiré graphene superlattices, highly relevant to correlated systems.", "tags": ["experiment", "graphene", "moire", "Kondo", "stronglycorrelated"], "image": "", "briefing": {"background": "콘도 효과(Kondo effect)는 금속 내 국소 자기 모멘트와 전도 전자가 결합하여 저온에서 저항이 증가하는 현상으로, 강상관 전자계 연구의 고전적인 주제입니다. 최근에는 무아레(Moiré) 초격자를 통한 평평한 에너지 밴드에서 이 현상을 구현하려는 시도가 활발합니다.", "motivation": "마법 각도 트위스트 그래핀 외에도 능면체(Rhombohedral) 적층 그래핀은 강한 상관 관계를 보입니다. 이 연구는 능면체 그래핀 초격자 시스템에서 콘도 물리와 같은 다체 효과가 나타나는지 실험적으로 확인하고자 했습니다.", "result": "능면체 그래핀 초격자에서 저온 저항의 로그 함수적 증가와 특성적인 스케일링 거동을 관찰함으로써 콘도 효과의 존재를 실험적으로 증명했습니다.", "implication": "그래핀 시스템이 단순한 위상 물질을 넘어 무거운 페르미온(Heavy fermion) 물리와 같은 복잡한 강상관 현상을 모사할 수 있는 조절 가능한 플랫폼임을 보여줍니다.", "novelty": "독자의 관심사인 'strongly correlated system' 및 'graphene moiré'와 직결되는 결과입니다. 특히 ABC 적층 그래핀에서의 콘도 효과 관찰은 새로운 다체 물리 상태 탐구의 이정표가 됩니다.", "unresolved": "콘도 상호작용과 그래핀 자체의 초전도성 또는 자성 간의 경쟁 관계는 아직 명확히 밝혀지지 않았습니다.", "future_work": "게이트 전압을 이용한 콘도 온도(Tk)의 정밀 제어 및 STM/STS를 통한 국소 상태 밀도 변화 측정이 후속 연구로 예상됩니다.", "concepts": [{"term": "Kondo Effect", "why_emerged": "희토류나 전이금속 불순물이 포함된 금속의 저온 저항이 비정상적으로 증가하는 원인을 규명하기 위해 등장했습니다.", "origin": "Jun Kondo (1964)", "connections": "Heavy fermion, Friedel oscillations, Quantum dots"}, {"term": "Rhombohedral Graphene", "why_emerged": "ABC 적층 구조를 통해 밴드 끝단에서 평평한 에너지 분산을 유도하고 전자 간 상관 관계를 극대화하기 위해 연구되었습니다.", "origin": "초록 정보만으로는 특정하기 어려움 (Haering et al. 초기 이론)", "connections": "Moiré superlattice, Flat band, Superconductivity"}, {"term": "Moiré Superlattice", "why_emerged": "두 층의 격자 상수를 약간 비틀거나 다르게 하여 거대한 주기적 구조를 만듦으로써 전자 밴드 구조를 엔지니어링하기 위해 도입되었습니다.", "origin": "Lopes dos Santos et al. (2007)", "connections": "Twistronics, Flat bands, Quantum simulators"}, {"term": "Strongly Correlated Systems", "why_emerged": "전자 간의 쿨롱 상호작용이 너무 강해 단일 전자 근사로 설명할 수 없는 물질들의 특이 물성을 이해하기 위해 연구됩니다.", "origin": "Mott, Hubbard (1960년대)", "connections": "Mott insulator, High-Tc superconductivity, Heavy fermions"}], "english_summary": ["Experimental observation of the Kondo effect in rhombohedral graphene superlattices.", "Confirmed via logarithmic temperature dependence of resistance and universal scaling.", "Demonstrates the role of rhombohedral stacking in enhancing electron correlations.", "Establishes moiré graphene as a tunable platform for studying heavy fermion physics."]}}, {"title": "Restoring the Surface Magnetic Gap in MnBi2Te4", "journal": "PRL_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/xz7k-zd8c", "authors": "Ce Bian, Hengxin Tan, Wenhui Duan", "last_authors": "Hengxin Tan, Wenhui Duan", "summary": "A widespread expe ", "result": "이방성 변형 하에서 수행된 라만 산란 실험을 통해 ErTe3의 CDW 상태와 관련된 대칭성 파괴의 본질을 규명했습니다. 특정 대칭성을 가진 포논 모드의 거동을 분석하여 CDW 형성과 대칭성 파괴 사이의 상관관계를 확인했으며, 변형이 CDW 도메인 형성과 선택에 미치는 영향을 입증했습니다.", "implication": "격자 변형을 통해 CDW의 대칭성 파괴를 정밀하게 제어할 수 있음을 보여주었습니다. 이는 고체 내에서 전자적 질서(electronic order)와 격자 간의 결합 강도를 이해하는 데 중요한 데이터를 제공하며, 향후 CDW 기반의 소자 제어 가능성을 시사합니다.", "novelty": "기존의 정적인 측정에서 벗어나 이방성 변형이라는 외부 튜닝 파라미터를 라만 분광법과 결합하여 CDW의 대칭성을 직접 프로빙했다는 점이 핵심입니다. 사용자님의 관심사인 네마틱성(nematicity)이나 대칭성 파괴 물리와 밀접한 관련이 있는 연구입니다.", "unresolved": "실험에서 관측된 거울 대칭성 파괴가 오직 전자적 기원에 의한 것인지, 혹은 미세한 격자 뒤틀림이 필수적으로 동반되는지에 대한 명확한 구분이 추가적으로 필요합니다.", "future_work": "다른 희토류 기반 RTe3 물질로의 확장 연구 및 더 강한 변형 조건에서의 상전이 임계점 탐색이 기대됩니다.", "concepts": [{"term": "Charge Density Wave (CDW)", "why_emerged": "금속 내 전자 밀도가 격자의 주기성보다 긴 주기로 재배열되는 현상을 설명하기 위해 도입되었습니다.", "origin": "1950년대 Rudolf Peierls가 1차원 금속의 불안정성(Peierls instability)으로 제안함.", "connections": "Kohn anomaly, Peierls transition, Fermi surface nesting."}, {"term": "Raman Scattering", "why_emerged": "물질의 진동 모드(포논)를 통해 결정 구조와 대칭성을 비파괴적으로 분석하기 위해 널리 사용됩니다.", "origin": "C. V. Raman (1928년 발견).", "connections": "Phonon spectroscopy, Symmetry analysis, Inelastic light scattering."}, {"term": "Anisotropic Strain", "why_emerged": "특정 방향으로만 격자를 늘리거나 줄여 물질의 회전 대칭성을 인위적으로 깨뜨리고 물성 변화를 관찰하기 위해 사용됩니다.", "origin": "초록 정보만으로는 특정하기 어려우나, 최근 상관계 물질 제어의 핵심 기술임.", "connections": "Nematicity tuning, Elastoresistance, Strain engineering."}, {"term": "Mirror Symmetry Breaking", "why_emerged": "물질의 물리적 특성이 거울 평면에 대해 반전되지 않는 상태를 설명하며, 종종 새로운 양자 상태의 지표가 됩니다.", "origin": "결정학 및 군론(Group Theory)의 기본 개념.", "connections": "Chirality, Weyl semimetals, Loop current orders."}], "english_summary": ["Investigated the unconventional CDW state of ErTe3 using Raman scattering under anisotropic strain.", "Identified the nature of mirror symmetry breaking associated with the CDW order.", "Demonstrated the ability to control symmetry-broken domains via external strain tuning.", "Provides insights into the coupling between lattice degrees of freedom and electronic instabilities."]}}, {"title": "Vortex-mediated spin current injection into two-dimensional superconductor NbSe2", "journal": "Science_Advances", "source": "Gemini", "link": "https://www.science.org/doi/abs/10.1126/sciadv.aeh1582?af=R", "authors": "Meng Yang, Xiaolong Yin, Jingjing Liu, et al.", "last_authors": "Shuo-Ying Yang, Junxue Li", "summary": "Injection of pure spin current into superconductors remains a major challenge in superconducting spintronics. Previous studies have primarily focused on spin-polarized quasiparticles and spin-triplet supercurrents, while vortices—ubiquitous topological defects in type-II superconductors—have been theoretically proposed as alternative carriers of spin angular momentum, yet direct experimental evidence is still lacking. Here, we report the vortex-mediated spin current injection in NbSe 2 /LiAl 2 Fe 3 O 8 (LAFO) bilayer, an Ising superconductor/ferrimagnetic insulator heterostructure. Under an out-of-plane temperature gradient and an in-plane magnetic field, the NbSe 2 /LAFO bilayer shows a pronounced thermoelectric peak near the upper critical magnetic field, which has the opposite sign to the conventional vortex Nernst signal observed in a single-layer NbSe 2 . The sign reversal suggests that the vortex flow induced by spin current injection is opposite to the flow driven by the temperature gradient, which is consistent with theoretical mechanisms including spin-vorticity transmutation and the inverse vortex spin Hall effect. By mapping the field–temperature phase diagram, we reveal that the spin current injection occurs exclusively in the vortex liquid phase of NbSe 2 . Absence of the thermoelectric signal above the superconducting transition temperature further rules out the quasiparticle contribution. Our results establish vortices as efficient carriers of spin information in superconductors, opening a new route towards vortex-mediated superconducting spintronic devic perconductor", "why_emerged": "강한 스핀-궤도 결합에 의해 스핀 방향이 평면 외 방향으로 고정되어, 매우 높은 평면 내 임계 자기장을 갖는 초전도체를 설명하기 위해 등장했습니다.", "origin": "2015년경 MoS2, NbSe2 단일층 연구에서 확립됨.", "connections": "Spin-orbit coupling, NbSe2, Upper critical field ($H_{c2}$)."}], "english_summary": ["Demonstrated vortex-mediated spin current injection in NbSe2/LAFO heterostructures.", "Observed a sign reversal in the thermoelectric signal, confirming spin-to-vortex angular momentum transfer.", "Established that spin injection occurs specifically within the vortex liquid phase of the Ising superconductor.", "Opens a new avenue for superconducting spintronics using vortices as spin carriers."]}}, {"title": "Electronic band structure reconstruction in Ni intercalated ZrTe2 (Phys. Rev. Mater.)", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2601.02647", "authors": "Pedro H. A. Moya, Marli R. Cantarino, Lucas E. Correa, et al.", "last_authors": "Antonio J. S. Machado, Fernando A. Garcia", "summary": "The filling of the large van der Waals gap in Transition Metal Dichalcogenides (TMDs) often leads to lattice and electronic instabilities, which prelude the onset of a rich phenomenology. Motivated by previous results from macroscopic measurements, we investigate the electronic structure of the TMDs ZrTe$_2$ and Ni intercalated ZrTe$_2$ (Ni$_x$ZrTe$_2$, $x\\approx 0.05$) employing angle-resolved photoemission spectroscopy (ARPES). We readily identify in Ni$_x$ZrTe$_2$ two flat bands, most likely associated with localized Ni-derived 3$d$-states, at about $\\approx-0.7$ eV and $\\approx-1.2$ eV in binding energy. More significantly, at low $T$, we identify an electronic structure reconstruction in Ni$_x$ZrTe$_2$, which halves the electronic periodicity along the $k_{z}$ direction. This is reminiscent of a commensurate band folding with wave-vector $q=(0,0,\\pi)$. A mean-field model for a charge density wave (CDW) transition driven by interband hole-hole interactions is solved with ": "Band Folding", "why_emerged": "결정의 주기성이 바뀌면(예: CDW 형성) 브릴루앙 영역이 작아지고 밴드가 겹쳐 보이는 현상을 설명합니다.", "origin": "고체물리학의 주기적 포텐셜 이론.", "connections": "Superlattice, Brillouin zone reconstruction, CDW."}, {"term": "Flat Band", "why_emerged": "전자의 운동 에너지가 거의 없어 국소화된 상태를 의미하며, 강한 전자-전자 상호작용을 유도할 수 있어 중요합니다.", "origin": "강상관 전자계 이론.", "connections": "Heavy fermions, Moiré lattices, Localized states."}], "english_summary": ["Reported electronic band structure reconstruction in Ni-intercalated ZrTe2 using ARPES.", "Observed Ni-derived flat bands and a doubling of electronic periodicity along the kz direction.", "Evidence of a CDW transition driven by interband interactions with a gap opening above the Fermi level.", "Highlights the role of intercalation in engineering 3D electronic instabilities in 2D materials."]}}, {"title": "Laser Melting and Loss of Interlayer Coherence of the Charge Density Wave Order in TiSe2 observed by time-resolved neutron diffraction", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2509.15358", "authors": "K. Dharmasiri (Department of Physics, University of Virginia, Charlottesville, et al.", "last_authors": "C. Hua (Materials Science, Technology Division", "summary": "Time-resolved elastic neutron scattering combined with laser-induced heating was used to probe the evolution of the periodic lattice distortion (PLD) associated with charge-density-wave (CDW) order in 1T-TiSe$_{2}$. Upon pulsed laser heating, the crystal undergoes a phase transition, where the transient response of the average lattice is isotropic. In contrast, the PLD exhibits an anisotropic behavior. The superlattice intensity is rapidly suppressed in-plane and out-of-plane upon heating, consistent with melting of the ordered state, but recovers more quickly in-plane than along the c-axis as the sample cools below the CDW transition temperature. The out-of-plane component shows pronounced broadening due to reduction of the interlayer correlation length while the in-plane correlations recover. The disparity between the nearly isotropic lattice response and the anisotropic recovery of the superlattice demonstrates that the CDW dynamics cannot be described solely by the evolution of the average lattice temperature. Instead, the results indicate that interlayer phase coherence represents the slowest-relaxing component of the ordered state. These findings support a picture in which the CDW instability is established primarily within the 1T-TiSe${_2}$ layers, while three-dimensional long-range order depends on weaker coupling between layers. More broadly, they demonstrate how direction-resolved time-resolved neutron diffraction can disentangle thermal and correlation-driven contributions to CDW dynamics in low-dimensional materials.", "tier": "B_IMPORTANT_CONDMAT", "score": "9", "reason": "Experimental study of CDW dynamics in TiSe2 using neutron diffraction; highly relevant to user's CDW focus.; demoted from A: broad CM, not direct user/project hit", "tags": ["material", "CDW", "neutron-scattering", "dynamics"], "image": "https://arxiv.org/html/2509.15358v3/New_Figure_1.png", "briefing": {"background": "1T-TiSe2는 전하 밀도파(CDW)와 초전도성이 공존하거나 경쟁하는 대표적인 전이금속 디칼코게나이드(TMD) 시스템입니다. CDW는 전자-정공 상호작용(엑시톤적 응축)과 주기적 격자 왜곡(PLD)이 결합되어 나타나는데, 이들의 동역학을 이해하는 것은 강상관 물질의 상전이 메커니즘을 밝히는 데 중요합니다.", "motivation": "기존 연구들은 주로 면내(in-plane)의 CDW 거동에 집중해 왔으나, 3차원적인 장거리 질서가 어떻게 붕괴되고 회복되는지에 대한 층간(interlayer) 동역학 정보는 부족했습니다. 특히 열적 평형 상태가 아닌 비평형 상태에서 격자의 등방적 응답과 CDW의 이방적 응답 사이의 관계를 명확히 할 필요가 있었습니다.", "result": "시간 분해 중성자 회절을 통해 레이저 여기 후의 PLD 진화를 관찰한 결과, 격자의 평균적인 가열 응답은 등방적이지만 CDW 질서의 붕괴와 회복은 극도로 이방적임을 발견했습니다. CDW는 면내에서 빠르게 회복되는 반면, 층간 결맞음(interlayer coherence)의 회복은 훨씬 느리게 진행되며, 이는 층간 위상 상관관계가 질서 상태의 완화 과정에서 병목 현상으로 작용함을 시사합니다.", "implication": "이 결과는 TiSe2의 CDW 불안정성이 본질적으로는 개별 층 내에서 강하게 형성되지만, 완전한 3차원 장거리 질서를 형성하기 위한 층간 결합은 상대적으로 약하고 느리게 반응한다는 것을 보여줍니다. 이는 저차원 물질의 상전이를 제어할 때 층간 위상 동역학이 핵심적인 변수가 될 수 있음을 의미합니다.", "novelty": "시간 분해 중성자 회절이라는 희소성 있는 기법을 활 ntly, interest has grown in translating on-surface synthetic protocols from noble metal surfaces to insulating surfaces, which offer technological relevance, and to magnetic or superconducting surfaces, which offer new routes to correlated phases. It is important, therefore, to understand how these alternative surfaces may alter the properties of adsorbates through processes like charge transfer and screening. Evidence for charge transfer is often obtained experimentally via scanning tunneling microscopy (STM) and spectroscopy (STS), and theoretically via density functional theory (DFT). In this work, we systematically compare the properties of isolated macrocyclic emeraldine (Me 6 ) molecules on three different surfaces: metallic Au(111), a semiconducting ferromagnetic monolayer of FeCl 2 , and a cleaved superconducting surface of bulk 2H-NbSe 2 . We show that STS and DFT alone are insufficient to quantify charge transfer for these cases. Instead, we complement these methods with Kelvin probe force microscopy (KPFM) measurements and model Hamiltonian calculations to demonstrate that on Au(111) and FeCl 2 , Me 6 molecules donate a single electron to the substrate, whereas on NbSe 2 two electrons are transferred from molecule to substrate. Our work provides insight into the interplay of charge transfer, screening, and molecule-substrate coupling, and develops experimental and theoretical methods for comparing the properties of adsorbates across different surfaces for future studies. Keywords: macrocycle, scanning probe microscopy, charge transfer, Kondo, magnetism", "tier": "B_IMPORTANT_CONDMAT", "score": "9", "reason": "Combines STM/STS on NbSe2 and metallic surfaces; highly relevant to electronic structure/adsorbates.", "tags": ["STM", "STS", "NbSe2"], "image": "https://arxiv.org/html/2610.32903v1/Fig1_v4.png", "briefing": {"background": "유기 분자를 기판 위에 증착하여 나노 구조를 만드는 기술은 반도체, 자성체, 초전도체 등 다양한 기판과의 상호작용을 이해하는 것이 필수적입니다. 특히 분자와 기판 사이의 전하 이동은 시스템의 전자적, 자기적 특성을 결정짓는 핵심 요소입니다.", "motivation": "기존의 STM/STS나 DFT 계산만으로는 분자와 기판 사이의 정확한 전하 이동량을 정량화하기 어려운 경우가 많습니다. 본 연구는 서로 다른 성질을 가진 세 가지 기판(Au, FeCl2, NbSe2) 위에서 동일한 유기 분자의 전하 이동 양상을 체계적으로 비교하고자 했습니다.", "result": "Kelvin 프로브 힘 현미경(KPFM)과 모델 해밀토니안 계산을 결합하여 분석한 결과, Me6 분자가 Au(111)과 FeCl2 기판에서는 1개의 전자를 주는 반면, 초전도체인 2H-NbSe2 기판 위에서는 2개의 전자를 기판으로 보낸다는 사실을 밝혀냈습니다.", "implication": "기판의 전자 구조(금속, 반도체적 자성체, 초전도체)에 따라 동일한 분자의 산화 상태가 달라질 수 있음을 보여줍니다. 이는 NbSe2와 같은 TMD 물질이 유기 분자와 강한 전하 이동 상호작용을 일으켜 특이한 계면 물성을 형성할 수 있음을 암시합니다.", "novelty": "사용자가 관심을 갖는 NbSe2를 기판으로 사용했다는 점과, 단순 STS를 넘어 KPFM을 통해 전하 상태를 명확히 규명했다는 점이 중요합니다. 전하 이동이 초전도성이나 곤도 효과(Kondo effect)와 어떻게 연결되는지에 대한 기초 정보를 제공합니다.", "unresolved": "2개 전자가 이동하는 구체적인 미시적 구동력(NbSe2의 어떤 전자적 특징 때문인지)에 대한 심층적인 물리적 이유가 논문 본문에서 어떻게 설명되었는지 추가 확인이 필요합니다.", "future_work": "NbSe2의 초전도 갭 내에서 유기 분자에 의해 유도되는 Yu-Shiba-Rusinov(YSR) 상태 관찰이나, 전하 이동 조절을 통한 위상적 계면 물성 제어 연구가 가능할 것입니다.", "concepts": [{"term": "Kelvin Probe Force Microscopy (KPFM)", "why_emerged": "나노 스케일에서 국부적인 일함수(work function)와 전하 분포를 측정하기 위해 개발되었습니다.", "origin": "1991년 Nonnenmacher 등에 의해 제안됨", "connections": "AFM, 접촉 전위차(CPD), 정전기력"}, {"term": "Charge Transfer", "why_emerged": "서로 다른 화학적 포텐셜을 가진 두 물질이 접합할 때 평형을 이루기 위한 전자 재배치를 설명하기 위해 도입되었습니다.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "일함수, 산화-환원, 계면 쌍극자"}, {"term": "2H-NbSe2", "why_emerged": "대표적인 층상 TMD 물질로, 초전도성과 CDW가 공존하여 양자 물성 연구의 표준 물질로 쓰입니다.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "Ising 초전도성, CDW, 2D 소재"}], "english_summary": ["A comparative study of charge transfer for Me6 molecules on Au(111), monolayer FeCl2, and bulk 2H-NbSe2.", "KPFM and model calculations reveal a 2nd electron transfer on NbSe2, unlike the 1-electron transfer on Au and FeCl2.", "The study demonstrates that STS and DFT alone are insufficient for quantifying molecular charge states on diverse surfaces.", "Findings emphasize the role of substrate properties in defining the electronic state of organic adsorbates."]}}, {"title": "Revealing Charge Transfer in Defect-Engineered 4Hb-TaS2", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2603.24486", "authors": "Siavash Karbasizadeh, Wooin Yang, Wonhee Ko, et al.", "last_authors": "Tom Berlijn, Sai Mu", "summary": "We present a comprehensive first-principles investigation of defects in 4$H_b$-TaS$_2$. In this layered transition metal dichalcogenide, charge transfer between alternating Mott-insulating 1T and metallic 1H layers gives rise to exotic quantum phases such as the Kondo effect and topological superconductivity. Motivated by recent defect manipulation in 4$H_b$-TaS$_2$ via STM, we address their microscopic nature and impact on interlayer charge transfer. To this end, we systematically analyze over 90 defects using large-scale density functional theory (DFT) calculations. Our analysis identifies 1H sulfur vacancies, Ta-on-S antisites, and Ta interstitials as the most likely origins of the commonly observed defects, with Ta-on-S antisites producing the strongest charge-transfer modulation. Our extensive dataset, compiled from STM simulations, defect formation energies, work functions, and charge transfer, establishes a foundational resource for future theoretical and experimental studies on defect engineering in 4$H_b$-TaS$_2$.", "tier": "B_IMPORTANT_CONDMAT", "score": "9", "reason": "Direct connection to STM, topological superconductivity, and electronic structure of 4Hb-TaS2.", "tags": ["STM", "TaS2", "electronicstructure"], "image": "https://arxiv.org/html/2603.24486v2/Fig1.png", "briefing": {"background": "4Hb-TaS2는 전하 밀도파를 갖는 1T 구조와 금속성 1H 구조가 번갈아 쌓인 독특한 TMD 물질입니다. 이 물질은 층간 전하 이동을 통해 곤도 격자 물성이나 위상 초전도체 후보로서 큰 관심을 받고 있습니다.", "motivation": "최근 STM 실험에서 4Hb-TaS2의 결함을 조작하는 연구가 보고되었으나, 이러한 결함들의 미시적인 정체와 이들이 층간 전하 이동에 미치는 구체적인 영향은 이론적으로 명확히 규명되지 않았습니다.", "result": "약 90여 종의 결함에 대해 대규모 DFT 계산을 수행한 결과, 실험에서 자주 관찰되는 결함이 1H 층의 황 빈자리(S vacancy), Ta-on-S 반위 결함(antisite), Ta 침입형(interstitial) 결함임을 확인했습니다. 특히 Ta-on-S 반위 결함이 층간 전하 이동을 가장 강하게 변조한다는 것을
