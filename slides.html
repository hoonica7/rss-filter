<title>Daily Paper Slideshow</title>
<style>
  :root {
    color-scheme: light;
    --bg: #f6f7f4;
    --paper: #ffffff;
    --ink: #111827;
    --muted: #64748b;
    --line: #d8ddd2;
    --accent: #176b87;
    --accent-2: #9a3412;
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; overflow: auto; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: var(--bg); color: var(--ink); }
  .shell { max-width: 1500px; min-height: 100vh; margin: 0 auto; padding: 14px 18px; display: flex; flex-direction: column; }
  .topbar { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 16px; }
  .top-actions { display: flex; align-items: center; gap: 10px; }
  .topbar a, button { border: 1px solid var(--line); border-radius: 8px; background: var(--paper); color: var(--ink); padding: 10px 14px; font-weight: 700; text-decoration: none; cursor: pointer; }
  button.primary { background: var(--accent); border-color: var(--accent); color: white; }
  button:disabled { opacity: 0.45; cursor: not-allowed; }
  .counter { color: var(--muted); font-weight: 700; }
  .slide { min-height: calc(100vh - 82px); background: var(--paper); border: 1px solid var(--line); border-radius: 10px; padding: 18px; box-shadow: 0 18px 42px rgba(15, 23, 42, 0.10); display: grid; grid-template-columns: minmax(310px, 0.86fr) minmax(0, 1.55fr); gap: 18px; overflow: visible; }
  .paper-head { min-width: 0; min-height: 0; overflow: visible; display: flex; flex-direction: column; gap: 12px; }
  .figure { margin: 0; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: #f8fafc; }
  .figure img { display: block; width: 100%; max-height: 41vh; object-fit: contain; background: white; }
  .figure figcaption { padding: 7px 10px; color: var(--muted); font-size: 12px; line-height: 1.3; }
  .head-text { display: flex; flex-direction: column; gap: 9px; min-width: 0; }
  .badges { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .badge { border-radius: 999px; padding: 5px 9px; background: #eef2ff; color: #3730a3; font-size: 12px; font-weight: 800; }
  .score { background: #fee2e2; color: #991b1b; }
  h1 { margin: 0; font-size: 25px; line-height: 1.15; letter-spacing: 0; overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
  h1 a { color: inherit; text-decoration-color: rgba(23, 107, 135, 0.35); text-decoration-thickness: 2px; text-underline-offset: 4px; }
  h1 a:hover { color: var(--accent); text-decoration-color: var(--accent); }
  .meta, .authors, .why, .abstract { font-size: 13px; line-height: 1.45; }
  .meta, .authors { color: var(--muted); }
  .why strong, .abstract strong, .authors strong { color: var(--ink); }
  .authors { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .why { border-left: 4px solid var(--accent-2); padding-left: 10px; color: #374151; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .abstract { border-top: 1px solid var(--line); padding-top: 14px; color: #374151; }
  .original-abstract { border-top: 1px solid var(--line); padding-top: 10px; color: #374151; font-size: 11.5px; line-height: 1.35; overflow-wrap: anywhere; }
  .original-abstract strong { display: block; margin-bottom: 4px; color: var(--ink); }
  .tags { display: flex; flex-wrap: wrap; gap: 8px; }
  .tag { border-radius: 999px; padding: 4px 8px; background: #f1f5f9; color: #475569; font-size: 12px; font-weight: 700; }
  .head-text > .link { display: none; }
  .briefing { min-width: 0; min-height: 0; overflow: visible; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); grid-auto-rows: minmax(0, auto); align-content: start; gap: 11px 18px; border-top: 0; padding-top: 0; }
  .brief-section { min-width: 0; }
  .brief-section.wide { grid-column: 1 / -1; }
  .brief-section h2 { margin: 0 0 4px; font-size: 14px; line-height: 1.22; color: #0f766e; letter-spacing: 0; }
  .brief-section p, .brief-section li { margin: 0; font-size: 12.5px; line-height: 1.42; color: #1f2937; overflow-wrap: anywhere; }
  .brief-section ul { margin: 0; padding-left: 20px; }
  .concepts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 9px 14px; }
  .concept { border-top: 1px solid var(--line); padding-top: 7px; }
  .concept h3 { margin: 0 0 4px; font-size: 13px; color: #7c2d12; letter-spacing: 0; }
  .concept p { margin: 2px 0 0; font-size: 11.5px; line-height: 1.35; color: #374151; overflow-wrap: anywhere; }
  .concept b { color: #111827; }
  .link { color: var(--accent); font-weight: 800; text-decoration: none; }
  .empty { padding: 48px; background: var(--paper); border: 1px solid var(--line); border-radius: 12px; color: var(--muted); }
  @media (max-width: 860px) {
    .shell { padding: 14px; }
    .topbar, .top-actions { align-items: stretch; flex-direction: column; }
    .slide, .briefing, .concepts { grid-template-columns: 1fr; }
    .slide { min-height: auto; overflow: visible; display: grid; }
    h1 { font-size: 28px; }
  }
</style>

const slides = [{"title": "Microscopic signatures of an imaginary charge density wave in a kagome metal", "journal": "Nature_Physics", "source": "keyword", "link": "https://www.nature.com/articles/s41567-026-03339-8", "authors": "S. Suetsugu, F. Hori, M. Shibata, et al.", "last_authors": "H. Kontani, Y. Matsuda", "summary": "Nature Physics, Published online: 17 June 2026; doi:10.1038/s41567-026-03339-8 Whether imaginary charge density waves and their associated loop currents exist has remained an open question. Now signatures of this state have been observed in kagome metal CsV3Sb5, revealing spontaneous time-reversal symmetry breaking.", "tier": "A_MUST_READ", "score": "9", "reason": "title strong match: kagome metal", "tags": ["kagome", "CsV3Sb5", "V3Sb5", "chargedensitywave", "loopcurrent", "time-reversalsymmetrybreaking"], "image": "https://media.springernature.com/m685/springer-static/image/art%3A10.1038%2Fs41567-026-03339-8/MediaObjects/41567_2026_3339_Fig1_HTML.png", "briefing": {"background": "카고메 금속(kagome metal) AV3Sb5 계열에서 발견되는 전하 밀도 파동(CDW) 상태는 일반적인 격자 변형을 넘어 시간 반전 대칭성 깨짐(TRSB)을 동반할 가능성이 지속적으로 제기되어 왔습니다. 특히 루프 전류(loop current) 모델은 이 현상의 미시적 기원으로 유력하게 논의됩니다.", "motivation": "CsV3Sb5에서 제기된 상상적 전하 밀도 파동(imaginary CDW)과 루프 전류가 실제 존재하는지, 그리고 이들이 자발적인 시간 반전 대칭성 깨짐을 실제로 유도하는지 미시적으로 규명하고자 했습니다.", "result": "CsV3Sb5에서 상상적 CDW 상태의 징후를 직접적으로 관측하였으며, 이를 통해 시스템이 자발적으로 시간 반전 대칭성을 깬다는 것을 증명했습니다.", "implication": "카고메 금속의 전자 구조에서 발생하는 비전통적 질서와 루프 전류 이론이 실험적으로 확증됨에 따라, 초전도성과 CDW 사이의 복잡한 상호작용 및 위상적 성질을 이해하는 핵심 근거가 됩니다.", "novelty": "이 분야의 핵심 난제였던 루프 전류의 존재를 미시적 관점에서 확인했다는 점이 결정적이며, 독자의 연구 관심사인 TRSB와 카고메 금속 물성을 직접적으로 연결하는 매우 중요한 연구입니다.", "unresolved": "관측된 징후가 어떤 구체적인 에너지 스케일에서 발생하는지, 그리고 이 루프 전류 패턴이 벌크 물성에 구체적으로 어떻게 기여하는지는 추가 검증이 필요합니다.", "future_work": "다른 AV3Sb5 계열 물질로의 확장 연구 및 루프 전류가 외부 자기장 혹은 압력에 어떻게 반응하는지 조사하는 실험이 이어질 것으로 예상됩니다.", "concepts": [{"term": "상상적 전하 밀도 파동(Imaginary CDW)", "why_emerged": "일반적인 CDW는 실제 공간의 전하 밀도 변조를 의미하지만, 루프 전류에 의한 전류 밀도 변조는 복소 위상을 가진 오더 파라미터가 필요함.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "시간 반전 대칭성 깨짐(TRSB), 루프 전류 이론"}, {"term": "루프 전류(Loop current)", "why_emerged": "카고메 격자 내에서 전자가 원자 주위를 순환하며 자기 모멘트를 생성하는 모델을 설명하기 위해 도입됨.", "origin": "주로 고온 초전도체 큐프레이트 연구에서 Varma 등에 의해 제안됨", "connections": "오비탈 전류(Orbital current), 궤도 자성"}, {"term": "시간 반전 대칭성 깨짐(TRSB)", "why_emerged": "시스템의 에너지 상태가 시간의 흐름을 거꾸로 했을 때와 다를 경우 발생하며, 자성이나 전류의 존재를 암시함.", "origin": "Landau의 대칭성 파괴 이론과 현대 위상 물질 물리학에서 확립됨", "connections": "카고메 금속, 비정상 홀 효과"}], "english_summary": ["Provides experimental evidence for imaginary charge density waves in the kagome metal CsV3Sb5.", "Confirms spontaneous time-reversal symmetry breaking associated with loop currents.", "Advances understanding of the microscopic origin of non-trivial orders in kagome systems.", "Strongly impacts current debates on the interplay between CDW and electronic correlations."]}}, {"title": "Observation of momentum dependent charge density wave gap in EuTe4", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/n72p-lpt6", "authors": "Iftakhar Bin Elius, Nathan Valadez, Gyanendra Dhakal, et al.", "last_authors": "Dariusz Kaczorowski, Madhab Neupane", "summary": "Author(s): Iftakhar Bin Elius, Nathan Valadez, Gyanendra Dhakal, Volodymyr Buturlim, Sabin Regmi, Dante James, Peter Radanovich, Keng Tou Chu, Ellis Thompson, Matthew Yankowitz, Tetiana Romanova, Andrzej Ptok, Krzysztof Gofryk, Dariusz Kaczorowski, and Madhab Neupane Charge density wave (CDW) phenomena in low-dimensional rare-earth chalcogenides have drawn considerable interest owing to their interplay with lattice instabilities, electronic correlations, and magnetism. ${\\mathrm{EuTe}}_{4}$, which contains both mono- and bilayer Te pseudosquare nets together wit… [Phys. Rev. B 113, 235125] Published Mon Jun 15, 2026", "tier": "B_IMPORTANT_CONDMAT", "score": "9", "reason": "Directly relevant spectroscopy study of CDW materials.", "tags": ["material", "topic", "method"], "image": "", "briefing": {"background": "저차원 희토류 칼코게나이드 시스템은 격자 불안정성과 전자 상관관계의 상호작용으로 인해 독특한 CDW 상을 형성하며, 이러한 물질들은 위상적 전자 구조를 가질 가능성이 커 응집물질물리학의 주요 연구 대상입니다.", "motivation": "EuTe4 시스템에서 CDW가 형성될 때, 전자 구조의 어떤 부분(모멘텀 의존성)에서 갭이 형성되는지 명확히 밝혀 CDW의 기원을 이해하고자 했습니다.", "result": "EuTe4 물질의 모멘텀에 따른 CDW 갭 크기를 분광학적으로 관측하여 그 구조를 확인했습니다.", "implication": "해당 물질의 밴드 구조와 CDW 사이의 정량적 관계를 규명함으로써, 향후 해당 물질이 위상 물질로서 가지는 특성을 해석하는 지표를 제공합니다.", "novelty": "CDW 갭의 운동량 의존성을 직접 측정함으로써 단순한 갭 형성을 넘어 밴드 엔지니어링 및 위상 특성과의 연관성을 파악할 수 있게 합니다.", "unresolved": "이러한 갭 형성이 전체적인 위상 불변성이나 비정상 수송 현상에 어떤 변화를 직접적으로 일으키는지에 대한 상세 분석은 아직 미흡합니다.", "future_work": "ARPES를 활용한 갭의 온도 의존성 측정이나 자기장 하에서의 전자 구조 변화 관찰이 뒤따를 것으로 보입니다.", "concepts": [{"term": "CDW 갭(CDW Gap)", "why_emerged": "CDW 형성 시 페르미 표면의 특정 영역이 닫히면서 전도성 변화와 상태 밀도 감소를 야기함.", "origin": "Peierls instability 모델에서 유래", "connections": "밴드 구조 밴딩, 궤도 선택적 갭"}, {"term": "모멘텀 의존성(Momentum dependence)", "why_emerged": "브릴루앙 영역 내에서 CDW가 모든 전자에 동일하게 작용하지 않고 특정 대칭점에 더 크게 작용함을 보여줌.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "ARPES 분석, 밴드 맵핑"}], "english_summary": ["Reports observation of momentum-dependent CDW gaps in EuTe4.", "Utilizes spectroscopy to probe the interplay between rare-earth ions and Te-net lattices.", "Clarifies the electronic structure modifications induced by charge density waves.", "Offers insights into the connection between CDW and low-dimensional correlation physics."]}}, {"title": "Sommerfeld coefficient enhancement and magnetic short-range order in a hyperkagome 3d electron system", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/m5pw-ghz3", "authors": "Shin-ichi Shamoto, Yukio Yasui, Kanako Yoshizawa, et al.", "last_authors": "Min Kai Lee, Lieh-Jeng Chang", "summary": "Author(s): Shin-ichi Shamoto, Yukio Yasui, Kanako Yoshizawa, Yukio Noda, Miwako Takahashi, Yoshichika Ōnuki, Yoshinori Haga, Motoyuki Ishikado, Hiroki Yamauchi, Tsung-Cheng Huang, Min Kai Lee, and Lieh-Jeng Chang $β$-Mn shows a large Sommerfeld coefficient of 70 mJ ${\\mathrm{Mn}}^{−1}{\\mathrm{K}}^{−2}$, which is one of the largest values in $3d$-electron systems. Although the origin has been attributed to the fluctuating magnetic moment, there are no material-dependent systematic studies in the $3d$-electron… [Phys. Rev. B 113, 235126] Published Mon Jun 15, 2026", "tier": "B_IMPORTANT_CONDMAT", "score": "9", "reason": "Experimental study of kagome system magnetism.", "tags": ["material", "topic"], "image": "", "briefing": {"background": "3d 전자 시스템에서 하이퍼카고메(hyperkagome) 격자와 같은 기하학적 좌절(geometrical frustration) 구조는 강력한 자기적 변동과 전자 상관관계를 유발하며, 이는 비전통적인 물리 현상의 원천이 됩니다.", "motivation": "베타-망간(β-Mn)에서 나타나는 거대한 좀머펠트 계수(Sommerfeld coefficient)의 물리적 기원을 명확히 하고, 자기적 단거리 질서와의 상관관계를 규명하고자 했습니다.", "result": "베타-망간 계열에서 관측되는 높은 전자 비열이 변동하는 자기 모멘트와 밀접하게 연관되어 있음을 보였습니다.", "implication": "기하학적 좌절을 가진 3d 시스템에서의 전자 상관관계 모델을 정립하는 데 기여하며, 강상관 전자계 물성 연구의 표준 사례를 제공합니다.", "novelty": "기존의 막연한 기원 논의에서 벗어나 체계적인 물질 연구를 통해 자기적 단거리 질서와 비열 데이터 간의 상관성을 정량적으로 연결했습니다.", "unresolved": "이러한 거대한 좀머펠트 계수가 특정 도핑이나 압력 하에서 초전도성으로 이어질 수 있는지에 대한 가능성은 아직 열려 있습니다.", "future_work": "중성자 산란 연구를 통한 자기적 변동의 공간적 파동 함수 확인 및 정밀한 자화율 측정이 기대됩니다.", "concepts": [{"term": "좀머펠트 계수(Sommerfeld coefficient)", "why_emerged": "비열의 선형항(γT) 계수로, 페르미 준위에서의 상태 밀도 및 전자 유효 질량을 나타냄.", "origin": "Arnold Sommerfeld가 자유 전자 가스 모델에서 정립", "connections": "전자 유효 질량, 강상관 전자계"}, {"term": "하이퍼카고메(Hyperkagome)", "why_emerged": "3차원 공간에서 카고메 격자의 기하학적 좌절을 유지하기 위한 독특한 구조적 배열.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "기하학적 좌절, 양자 스핀 액체"}, {"term": "자기적 단거리 질서(Magnetic short-range order)", "why_emerged": "장거리 질서(자성체)가 형성되지 않더라도 국소적으로는 자기 모멘트가 정렬되어 나타나는 현상.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "스핀 변동, 프러스트레이션"}], "english_summary": ["Investigates the large Sommerfeld coefficient in the hyperkagome beta-Mn system.", "Identifies the role of fluctuating magnetic moments in enhancing electronic correlations.", "Provides systematic evidence for the link between magnetic short-range order and electronic properties.", "Contributes to the broader understanding of 3d electron systems with geometrical frustration."]}}, {"title": "Room-Temperature Intrinsic Nonlinear Planar Hall Effect in TaIrTe4", "journal": "PRL_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/hbdj-2hgf", "authors": "Chang Jiang, Fan Yang, Yu Zhao, et al.", "last_authors": "Shaoming Dong, Faxian Xiu", "summary": "Author(s): Chang Jiang, Fan Yang, Yu Zhao, Jinshan Yang, Peng Yu, Huiying Liu, Yuda Zhang, Zehao Jia, Xiangyu Cao, Li Tian, Jingyi Yan, Zheng Liu, Zhongkai Liu, Xian-Lei Sheng, Cong Xiao, Shengyuan A. Yang, Shaoming Dong, and Faxian Xiu A room-temperature intrinsic nonlinear planar Hall effect in the nonmagnetic topological semimetal TaIrTe 4 reveals how an in-plane magnetic field generates a Berry-connection-polarizability dipole through an orbital mechanism. [Phys. Rev. Lett. 136, 236302] Published Fri Jun 12, 2026", "tier": "B_IMPORTANT_CONDMAT", "score": "9", "reason": "Topological semimetal TaIrTe4 is closely related to user's 112 telluride and Berry curvature interests.", "tags": ["experiment", "TaIrTe4", "topologicalsemimetal"], "image": "", "briefing": {"background": "위상 반금속(topological semimetals)은 결정 구조의 대칭성으로 인해 발생하는 특이한 전자 구조와 베리 곡률(Berry curvature) 분포를 가지고 있어, 자이로트로픽 효과나 비선형 수송 현상을 탐구하는 플랫폼이 됩니다.", "motivation": "비자성 물질인 TaIrTe4에서 실온 상태의 고유한 비선형 평면 홀 효과(nonlinear planar Hall effect)를 관측하여, 그 미시적 기원인 궤도 자기적 메커니즘을 밝히고자 합니다.", "result": "면내 자기장(in-plane magnetic field) 하에서 베리 연결 편극 쌍극자(Berry-connection-polarizability dipole)가 유도되어 비선형 홀 전압이 발생하는 궤도 기전을 확인했습니다.", "implication": "실온에서 위상 특성을 활용한 비선형 소자 제어의 가능성을 제시하며, 위상 반금속의 궤도 물리량 제어 기술의 기초를 다집니다.", "novelty": "저차원 112 텔루라이드 물질군에서 궤도 기전 기반의 고차 비선형 수송 현상을 실온에서 구현했다는 점이 독자에게 흥미롭습니다.", "unresolved": "이러한 궤도 효과가 다른 112 계열 화합물에서도 보편적으로 나타나는지, 혹은 특정 대칭성 조건이 얼마나 결정적인지에 대해서는 추가 연구가 필요합니다.", "future_work": "다른 위상 반금속 시스템으로의 확장 및 비선형 광응답과의 직접적인 상관관계 규명이 필요합니다.", "concepts": [{"term": "비선형 평면 홀 효과", "why_emerged": "선형 응답 영역을 넘어선 고차 수송 현상을 통해 베리 곡률의 고차 모멘트를 측정하기 위해 필요합니다.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "비선형 비정상 홀 효과, 베리 곡률 편극"}, {"term": "베리 연결 편극 쌍극자", "why_emerged": "자기장에 의해 왜곡된 전자 상태의 궤도 편극 분포를 정량화하기 위해 도입된 물리량입니다.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "궤도 자기 모멘트, 비선형 수송 이론"}], "english_summary": ["Demonstrates room-temperature intrinsic nonlinear planar Hall effect in TaIrTe4.", "Identifies an orbital mechanism driven by Berry-connection-polarizability dipole.", "Highlights the role of in-plane magnetic fields in modulating topological transport.", "Provides a foundation for room-temperature topological electronics."]}}, {"title": "Field-free Josephson diode and tunable ϕ0-junction in chiral kagome antiferromagnets", "journal": "npj_QuantumMaterials", "source": "Gemini", "link": "https://www.nature.com/articles/s41535-026-00907-2", "authors": "Jin-Xing Hou, Chuang Li, Lun-Hui Hu, Song-Bo Zhang", "last_authors": "Lun-Hui Hu, Song-Bo Zhang", "summary": "npj Quantum Materials, Published online: 17 June 2026; doi:10.1038/s41535-026-00907-2 Field-free Josephson diode and tunable ϕ 0 -junction in chiral kagome antiferromagnets", "tier": "B_IMPORTANT_CONDMAT", "score": "9", "reason": "Direct relevance to kagome metals and magnetic topological phenomena.", "tags": ["kagome", "antiferromagnet", "topology"], "image": "https://pubads.g.doubleclick.net/gampad/ad?iu=/285/npjquantmats.nature.com/article&sz=728x90&c=1807541667&t=pos%3Dtop%26type%3Darticle%26artid%3Ds41535-026-00907-2%26doi%3D10.1038/s41535-026-00907-2%26subjmeta%3D301,639,766%26kwrd%3DMaterials+science,Physics", "briefing": {"background": "카고메 격자 물질은 대칭성 파괴와 강한 상관관계가 복합적으로 작용하여, 비자성 상태에서도 다양한 위상적 질서와 초전도성을 동시에 구현할 수 있는 최적의 물질군입니다.", "motivation": "카고메 반강자성체 시스템에서 자기장 없이도 Josephson 다이오드 효과(비가역적 초전도 전류)를 구현할 수 있는지 확인하고자 합니다.", "result": "카고메 격자의 키랄성(chirality)을 이용하여 외부 자기장 없이도 초전도 다이오드 효과와 위상 편이(phi_0) 접합을 조정할 수 있음을 이론적으로 제시합니다.", "implication": "자기 소자나 메모리 장치 없이도 카고메 구조의 고유한 위상학적 성질을 이용해 초전도 비가역성을 제어할 수 있는 가능성을 열었습니다.", "novelty": "AV3Sb5 등 카고메 금속 연구자와 초전도 다이오드 소자 연구자 모두에게, 물질 고유의 대칭성 활용 방식을 제시합니다.", "unresolved": "이론적인 예측이 실제 복잡한 샘플 결함이나 불순물이 존재하는 환경에서 어느 정도까지 강건하게 유지되는지 검증이 필요합니다.", "future_work": "카고메 물질 기반의 초전도 접합 소자 제작 및 실험적 비가역성 측정.", "concepts": [{"term": "Josephson 다이오드", "why_emerged": "초전도 접합에서 전류의 방향에 따라 임계 전류가 달라지는 비대칭성을 활용하기 위해 필요합니다.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "비정상 조셉슨 효과, 위상 초전도체"}, {"term": "키랄 카고메 반강자성체", "why_emerged": "카고메 격자의 기하학적 좌우 비대칭성이 자기적 배열과 결합하여 위상학적 물리 현상을 생성하기 위해 필요합니다.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "반강자성 스핀트로닉스, 카고메 금속"}], "english_summary": ["Proposes field-free Josephson diode effects in chiral kagome antiferromagnets.", "Utilizes inherent system chirality to enable tunable phi_0-junctions.", "Connects kagome lattice topology to non-reciprocal superconducting transport.", "Offers a new pathway for superconducting quantum devices."]}}, {"title": "Topological quantum materials: kagome, chiral, and square-net frameworks", "journal": "npj_QuantumMaterials", "source": "Gemini", "link": "https://www.nature.com/articles/s41535-026-00902-7", "authors": "Avdhesh K. Sharma, Snehashish Chatterjee, Premakumar Yanda, Claudia Felser, Chandra Shekhar", "last_authors": "Claudia Felser, Chandra Shekhar", "summary": "npj Quantum Materials, Published online: 11 June 2026; doi:10.1038/s41535-026-00902-7 Topological quantum materials: kagome, chiral, and square-net frameworks", "tier": "B_IMPORTANT_CONDMAT", "score": "9", "reason": "Excellent review covering materials classes central to user research.", "tags": ["kagome", "topological", "review"], "image": "https://pubads.g.doubleclick.net/gampad/ad?iu=/285/npjquantmats.nature.com/article&sz=728x90&c=1272074067&t=pos%3Dtop%26type%3Darticle%26artid%3Ds41535-026-00902-7%26doi%3D10.1038/s41535-026-00902-7%26subjmeta%3D301,639,766%26kwrd%3DMaterials+science,Physics", "briefing": {"background": "위상 양자 물질은 전자 구조의 토폴로지적 성질을 활용해 차세대 전자 소자 개발을 목표로 하며, 카고메, 키랄 격자, 사각형 격자 등 다양한 결정 구조적 프레임워크를 기반으로 발전하고 있습니다.", "motivation": "최신 위상 양자 물질의 구조적 분류(카고메, 키랄, 사각형 격자)에 따른 물리적 특성과 응용 가능성을 체계적으로 정리하고자 합니다.", "result": "각 구조적 프레임워크가 어떻게 베리 곡률과 연관되는지, 그리고 실험적으로 어떻게 관측되는지에 대한 포괄적인 리뷰를 제공합니다.", "implication": "다양한 위상 물질 간의 공통점과 차이점을 명확히 함으로써, 향후 새로운 위상 물질 탐색을 위한 가이드라인을 제공합니다.", "novelty": "독자의 주요 관심사인 카고메와 위상 물질의 구조적 상관관계를 최신 연구 흐름에 맞춰 잘 정리한 리뷰 논문입니다.", "unresolved": "수많은 물질 후보군 중에서 응용 가능한 대규모 집적 소자로의 전환은 여전히 해결해야 할 과제입니다.", "future_work": "각 물질군에서의 동적 특성 및 엑시톤 효과 등 강상관 효과에 대한 후속 연구가 요구됩니다.", "concepts": [{"term": "사각형 격자 (Square-net)", "why_emerged": "격자 대칭성을 통해 위상 밴드 구조를 설계하기 위한 또 다른 효과적인 물질적 플랫폼으로 필요합니다.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "디락 반금속, 위상 절연체"}, {"term": "키랄 구조 (Chiral structure)", "why_emerged": "시간 반전 대칭성이나 공간 반전 대칭성을 제어하여 비대칭적인 전자 물성을 이끌어내기 위해 필요합니다.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "홀 효과, 스핀-궤도 결합"}], "english_summary": ["Provides a comprehensive review of topological quantum materials based on lattice frameworks.", "Categorizes developments in kagome, chiral, and square-net structures.", "Examines the correlation between crystal structure, Berry curvature, and physical properties.", "Serves as a crucial roadmap for researchers in topological physics."]}}, {"title": "Visualizing the impact of quenched disorder on 2D electron Wigner solids", "journal": "Nature", "source": "Gemini", "link": "https://www.nature.com/articles/s41586-026-10654-w", "authors": "Zhehao Ge, Conor Smith, Zehao He, et al.", "last_authors": "Feng Wang, Michael F. Crommie", "summary": "Nature, Published online: 17 June 2026; doi:10.1038/s41586-026-10654-w A technique combining atomically resolved scanning tunnelling microscopy with neural-quantum-state quantum Monte Carlo simulation of disordered 2D electron Wigner solids establishes a powerful framework to enable the clear identification of two distinct defect-induced disorder regimes.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "STM study of 2D electron Wigner solids, relevant to correlated electron systems.", "tags": ["STM", "2Dmaterials", "Wignersolid", "disorder", "stronglycorrelated"], "image": "https://media.springernature.com/m685/springer-static/image/art%3A10.1038%2Fs41586-026-10654-w/MediaObjects/41586_2026_10654_Fig1_HTML.png", "briefing": {"background": "2D 전자 시스템에서 전자 간 쿨롱 상호작용이 지배적이게 되면 결정 구조를 형성하는 '위그너 결정(Wigner solid)'이 나타납니다. 실제 물질의 결함(quenched disorder)이 이러한 강상관 전자 상태를 어떻게 무너뜨리거나 변형시키는지를 이해하는 것은 고체물리학의 오랜 난제입니다.", "motivation": "기존 연구들은 위그너 고체와 무질서 사이의 상호작용을 정량적으로 규명하는 데 한계가 있었습니다. 본 연구는 STM과 뉴럴 네트워크 기반의 QMC 시뮬레이션을 결합하여 이 문제를 해결하고자 했습니다.", "result": "위그너 결정 내 결함으로 인해 발생하는 두 가지 뚜렷한 무질서 체제(disorder regimes)를 시각적으로 확인하고 식별해냈습니다.", "implication": "강상관 전자계에서 무질서가 단순히 상태를 파괴하는 것이 아니라, 특정 물리적 체제를 유도한다는 점을 밝힘으로써 2D 강상관 시스템의 위상과 질서 연구에 새로운 분석 틀을 제공합니다.", "novelty": "STM의 높은 공간 분해능과 현대적인 양자 계산 기법인 NQS-QMC를 결합하여 미시적 관점에서의 전자 배치와 거시적인 무질서 물성을 직관적으로 연결했다는 점이 핵심입니다.", "unresolved": "결함의 밀도나 종류가 바뀔 때 위그너 고체의 전이 과정이 구체적으로 어떻게 변하는지에 대한 상세한 위상 도식(phase diagram)은 추가 연구가 필요합니다.", "future_work": "다른 2D 물질 시스템이나 모아레 격자 시스템에서의 결함 효과를 동일한 방법론으로 검증하는 연구가 뒤따를 것으로 보입니다.", "concepts": [{"term": "Wigner solid", "why_emerged": "밀도가 낮을 때 전자의 운동 에너지보다 쿨롱 에너지의 우위를 설명하기 위해 필요함.", "origin": "Eugene Wigner (1934).", "connections": "강상관 시스템, 2D 전자 가스, Mott 절연체 등."}, {"term": "Quenched disorder", "why_emerged": "실제 실험적 환경에서 불순물이나 격자 결함이 물리적 특성에 미치는 고정된 영향을 기술하기 위해 필요함.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "Anderson 국소화, 앤더슨 전이."}, {"term": "STM (Scanning Tunneling Microscopy)", "why_emerged": "물질 표면의 원자 단위 전자 상태 밀도(LDOS)를 직접 관측하기 위해 필요함.", "origin": "Gerd Binnig, Heinrich Rohrer (1981).", "connections": "STS, 원자 조작, 강상관 물질의 국소 전자 상태 분석."}], "english_summary": ["Combines atomic-resolution STM with neural-quantum-state QMC simulations.", "Identifies two distinct disorder regimes in 2D electron Wigner solids.", "Provides a framework for understanding how quenched disorder impacts strongly correlated states.", "Advances the ability to visualize and interpret collective quantum states in the presence of defects."]}}, {"title": "Emergent partons in fractional quantum Hall systems", "journal": "Nature_Physics", "source": "Gemini", "link": "https://www.nature.com/articles/s41567-026-03338-9", "authors": "Zihao Yang, Yifan Wang, Xinyu Lu, et al.", "last_authors": "Ajit C. Balram, Lingjie Du", "summary": "Nature Physics, Published online: 22 June 2026; doi:10.1038/s41567-026-03338-9 In a geometrical theory for the fractional quantum Hall effect, chiral spin-2 neutral excitations arise. Now, multiple such excitations are observed and provide evidence for the parton description of the quantum Hall effect.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "High-impact experimental observation of FQHE states relevant to topological physics.", "tags": ["quantum-hall", "topological-physics", "partons"], "image": "https://media.springernature.com/m685/springer-static/image/art%3A10.1038%2Fs41567-026-03338-9/MediaObjects/41567_2026_3338_Fig1_HTML.png", "briefing": {"background": "분수 양자 홀 효과(FQHE)는 강한 자기장 하에서 전자들이 위상학적으로 흥미로운 다체 상태를 형성하는 현상입니다. 여기서 개별 입자보다 더 근본적인 '파톤(parton)'이라는 가상의 구성 요소로 파동함수를 설명하려는 시도가 활발합니다.", "motivation": "기존 이론에서 제안된 파톤 모델의 타당성을 증명하기 위해, 실험적으로 이 모델이 예측하는 고유한 여기(excitations)를 포착하고자 했습니다.", "result": "기하학적 이론 모델에서 예측된 스핀-2 중성 여기 상태들을 관측함으로써, FQHE가 파톤으로 기술될 수 있다는 강력한 실험적 근거를 확보했습니다.", "implication": "양자 홀 시스템의 파동함수 구조를 더 깊이 이해하게 되었으며, 위상 양자 컴퓨터의 기본 단위가 될 수 있는 준입자 조작 연구에 중요한 초석이 됩니다.", "novelty": "이론적으로만 다루어지던 '파톤'의 존재를 실험적으로 시각화/검증했다는 점이 해당 분야의 패러다임 변화를 예고합니다.", "unresolved": "관측된 스핀-2 여기들이 정확히 어떤 물리적 조건을 통해 안정적으로 유지되는지에 대한 전역적인 기작은 명확하지 않습니다.", "future_work": "파톤 여기를 이용한 양자 상태 제어 실험이나, 다른 위상 상에서의 파톤 기여도를 확인하는 실험이 예상됩니다.", "concepts": [{"term": "Parton", "why_emerged": "분수 양자 홀 효과 파동함수를 여러 부분의 곱으로 분해하여 기술하기 위해 도입됨.", "origin": "Wen (1990년대 초).", "connections": "Chern-Simons 이론, 위상 질서."}, {"term": "FQHE (Fractional Quantum Hall Effect)", "why_emerged": "강 타자기적 전이와 연관된 Fermi liquid 계수 A의 급격한 증가를 발견했으며, 이는 자기적 요동이 초전도성을 유도하는 매개체일 가능성을 시사합니다.", "implication": "UTe2의 초전도 매커니즘이 강한 자기적 요동과 밀접하게 연관되어 있음을 확인하여, 비전통 초전도성 연구의 핵심 데이터를 제공합니다.", "novelty": "40T라는 초고자기장 영역에서의 정밀한 전기 저항 측정을 통해, 극단적 조건 하에서의 강상관 현상을 관측했다는 점이 독보적입니다.", "unresolved": "관측된 자기적 요동이 스핀 삼중항(triplet) 상태를 어떻게 지지하는지에 대한 미시적 원리는 추가적인 중성자 산란이나 스펙트럼 분석이 필요합니다.", "future_work": "초고자기장에서의 중성자 산란 연구나 더 넓은 온도/자기장 범위에서의 위상 전이 분석이 뒤따를 것으로 보입니다.", "concepts": [{"term": "Heavy-fermion", "why_emerged": "f-전자들의 강한 상관관계로 인해 유효 질량이 자유 전자의 수백 배에 달하는 시스템을 기술하기 위해 도입됨.", "origin": "Steglich et al. (1979).", "connections": "Kondo 격자, 비전통 초전도성."}, {"term": "Metamagnetic transition", "why_emerged": "자기장에 따라 자화율이 비선형적으로 급격히 변하는 현상을 설명하기 위해 필요함.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "양자 임계점, 자기 모멘트 재배열."}, {"term": "Fermi liquid coefficient A", "why_emerged": "저온에서 저항이 T^2에 비례할 때 이 비례 상수는 입자 간 상호작용의 세기를 나타냄.", "origin": "Landau Fermi liquid theory (1956).", "connections": "전자-전자 산란, 강상관 물리."}], "english_summary": ["Studies UTe2 under magnetic fields exceeding 40 T.", "Observes an enhancement of the Fermi liquid coefficient A near a metamagnetic transition.", "Links the superconducting onset to boosted magnetic fluctuations.", "Supports the role of magnetism in the unconventional superconductivity of UTe2."]}}, {"title": "Coupling of magnetic and lattice collective excitations in the two-dimensional van der Waals antiferromagnet FePS3", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/fwb8-fwjb", "authors": "Kartik Panda, Itzik Kapon, Dumitru Dumcenco, Dirk van der Marel, Alexey B. Kuzmenko, Nimrod Bachar", "last_authors": "Alexey B. Kuzmenko, Nimrod Bachar", "summary": "Author(s): Kartik Panda, Itzik Kapon, Dumitru Dumcenco, Dirk van der Marel, Alexey B. Kuzmenko, and Nimrod Bachar We combine polarized infrared magnetotransmission and Faraday angle rotation measurements to map the collective excitations of the van der Waals antiferro e authors demonstrate the presence of RLEs prior to the QSL ground state. [Phys. Rev. B 113, L220407] Published Wed Jun 17, 2026", "tier": "B_IMPORTANT_CONDMAT", "score": "7", "reason": "Experimental evidence of QSL ground state in frustrated triangular magnet.", "tags": ["spinliquid", "magnetism"], "image": "", "briefing": {"background": "삼각 격자(triangular lattice) 기반의 물질은 기하학적 좌절(geometrical frustration)로 인해 자기 질서가 억제되며, 이로 인해 양자 스핀 액체(QSL)와 같은 이국적인 양자 상태가 발현될 가능성이 큽니다.", "motivation": "이론적으로 예측된 로톤-유사 들뜸(roton-like excitations) 현상이, 자기 질서가 없는 양자 스핀 액체 후보 물질인 YbCuSe2에서도 존재하는지 확인하고자 합니다.", "result": "열용량과 뮤온 스핀 이완(muSR) 측정을 통해 YbCuSe2에서 QSL 바닥 상태에 도달하기 전 로톤-유사 들뜸이 존재함을 실험적으로 규명했습니다.", "implication": "삼각 격자 자성체에서 QSL과 로톤-유사 들뜸 사이의 연관성을 증명하여, QSL의 미시적 들뜸 구조 이해를 진전시켰습니다.", "novelty": "자기 질서가 있는 물질에서만 관찰되던 로톤-유사 들뜸을 QSL 후보 물질에서 찾아낸 첫 사례로, QSL의 동역학적 특성에 대한 새로운 실험적 근거를 제시합니다.", "unresolved": "로톤-유사 들뜸의 정확한 미시적 기원과 QSL 상태와의 상세한 결합 메커니즘은 여전히 정교한 이론적 모델링이 필요합니다.", "future_work": "중성자 산란 실험을 통한 들뜸의 분산 관계(dispersion) 직접 측정과 비탄성 산란 실험이 요구됩니다.", "concepts": [{"term": "양자 스핀 액체 (QSL)", "why_emerged": "강한 양자 요동으로 인해 절대영도에서도 자기 질서가 깨지는 상태를 설명하기 위해 필요함.", "origin": "Anderson (1973).", "connections": "고온 초전도체, 얽힘(entanglement) 물리."}, {"term": "로톤-유사 들뜸 (RLE)", "why_emerged": "자기 들뜸 스펙트럼에서 최소 에너지를 가지는 국소적인 골(dip) 현상을 설명하기 위해 필요함.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "초유체 헬륨, 자기적 좌절 계."}], "english_summary": ["Experimental identification of roton-like excitations in YbCuSe2.", "Confirms these excitations exist prior to the quantum spin liquid ground state.", "Utilizes heat capacity and muon spin relaxation measurements.", "Links geometrical frustration to exotic excitation spectra in triangular magnets."]}}, {"title": "Search for magnetoacoustic quantum oscillations in the insulating phase of 0.222222em0exYbB12", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/m3gy-g9tv", "authors": "Ryosuke Kurihara, Atsuhiko Miyata, Koji Araki, et al.", "last_authors": "Masashi Tokunaga, Yasuhiro H. Matsuda", "summary": "Author(s): Ryosuke Kurihara, Atsuhiko Miyata, Koji Araki, Shusaku Imajo, Ruo Hibino, Atsushi Miyake, Sergei Zherlitsyn, Joachim Wosnitza, Hiroshi Yaguchi, Fumitoshi Iga, Masashi Tokunaga, and Yasuhiro H. Matsuda Quantum oscillations in the Kondo insulator YbB 12 challenge the conventional understanding that insulators lack Fermi surfaces. Here, the authors perform ultrasonic measurements in high magnetic fields to search for magnetoacoustic quantum oscillations within the insulating phase. While oscillations are clearly observed in transport and magnetocaloric measurements, no corresponding signal is detected in the elastic constant. This contrast highlights a key inconsistency in the current understanding of quantum oscillations in insulators and provides new insight into the exotic electronic state of YbB 12 . [Phys. Rev. B 113, 235129] Published Tue Jun 16, 2026", "tier": "B_IMPORTANT_CONDMAT", "score": "7", "reason": "Experimental study of Kondo insulators and Fermi surfaces.", "tags": ["Kondo", "Fermisurface", "quantumoscillations"], "image": "", "briefing": {"background": "콘도 절연체(Kondo insulator)는 국소 모멘트와 전도 전자가 상호작용하여 밴드갭이 형성된 상태입니다. 그러나 일부 물질에서 발견되는 양자 진동은 절연체임에도 페르미 면(Fermi surface)이 존재하는 것처럼 보여 물리학계의 논쟁거리가 되고 있습니다.", "motivation": "YbB12의 절연 상태 내에서 관측되는 양자 진동 현상의 본질을 탐구하기 위해, 다른 물성인 탄성 상수(elastic constant)에서도 동일한 진동이 나타나는지 검증하고자 합니다.", "result": "전기 수송과 자기열량 측정에서는 진동이 보이나, 탄성 상수 측정에서는 진동이 나타나지 않는 불일치를 발견했습니다.", "implication": "현재의 콘도 절연체 내 양자 진동 이론에 심각한 의문을 제기하며, 양자 진동 신호의 기원이 전자의 밀도 상태가 아닐 가능성을 시사합니다.", "novelty": "기존의 수송 실험 신호와 대조되는 탄성 물성을 통해 양자 진동 데이터의 해석에 새로운 경종을 울렸으며, 이는 토폴로지 물질의 페르미 면 연구에도 중요한 반면교사가 됩니다.", "unresolved": "탄성 상수에서 진동이 보이지 않는 이유와, 수송 실험에서 나타나는 진동의 정체가 무엇인지(예: 불순물 기여 등)에 대한 명확한 결론이 나지 않았습니다.", "future_work": "고자기장 환경에서의 보다 정밀한 마이크로-ARPES 혹은 초음파 분광학 실험을 통한 검증이 필요합니다.", "concepts": [{"term": "콘도 절연체", "why_emerged": "희토류 화합물에서 d-f 전자 궤도 혼성으로 인해 낮은 온도에서 갭이 열리는 현상을 설명하기   headText.className = 'head-text';
  const badges = document.createElement('div');
  badges.className = 'badges';
  if (r.score) badges.appendChild(textEl('span', 'badge score', `${r.score}/10`));
  if (r.tier) badges.appendChild(textEl('span', 'badge', r.tier));
  if (r.journal) badges.appendChild(textEl('span', 'badge', r.journal));
  if (r.source) badges.appendChild(textEl('span', 'badge', r.source));
  headText.appendChild(badges);
  const title = document.createElement('h1');
  if (r.link) { const titleLink = document.createElement('a'); titleLink.href = r.link; titleLink.target = '_blank'; titleLink.rel = 'noopener noreferrer'; titleLink.textContent = r.title || ''; title.appendChild(titleLink); }
  else { title.textContent = r.title || ''; }
  headText.appendChild(title);
  headText.appendChild(textEl('p', 'meta', [r.journal, r.source].filter(Boolean).join(' | ')));
  if (r.last_authors || r.authors) { const authors = document.createElement('p'); authors.className = 'authors'; if (r.last_authors) authors.append('Last authors: ' + r.last_authors); if (r.authors) authors.append((r.last_authors ? ' | ' : '') + 'Authors: ' + r.authors); headText.appendChild(authors); }
  appendLabeledText(headText, 'why', 'Filter reason: ', r.reason);
  if (r.tags && r.tags.length) { const tags = document.createElement('div'); tags.className = 'tags'; r.tags.forEach(tag => tags.appendChild(textEl('span', 'tag', '#' + tag))); headText.appendChild(tags); }
  if (r.link) { const link = document.createElement('a'); link.className = 'link'; link.href = r.link; link.target = '_blank'; link.rel = 'noopener noreferrer'; link.textContent = 'Open paper'; headText.appendChild(link); }
  head.appendChild(headText);
  if (r.summary) { const abstract = document.createElement('p'); abstract.className = 'original-abstract'; const strong = textEl('strong', '', 'Original abstract'); abstract.appendChild(strong); abstract.append(r.summary); head.appendChild(abstract); }
  slideEl.appendChild(head);
  const briefing = document.createElement('div');
  briefing.className = 'briefing';
  appendBriefSection(briefing, 'Background', b.background);
  appendBriefSection(briefing, 'Motivation', b.motivation);
  appendBriefSection(briefing, 'Result', b.result);
  appendBriefSection(briefing, 'Implication', b.implication);
  appendBriefSection(briefing, "Why it's important / Novelty", b.novelty);
  appendBriefSection(briefing, 'Unresolved Questions', b.unresolved);
  appendBriefSection(briefing, 'Expected Future Work', b.future_work);
  if (b.concepts && b.concepts.length) {
    const section = document.createElement('section');
    section.className = 'brief-section wide';
    section.appendChild(textEl('h2', '', 'Concepts / Terms'));
    const concepts = document.createElement('div');
    concepts.className = 'concepts';
    b.concepts.forEach(c => {
      const item = document.createElement('div');
      item.className = 'concept';
      item.appendChild(textEl('h3', '', c.term || 'Concept'));
      [['왜 생겼나: ', c.why_emerged], ['누가 만들었나: ', c.origin], ['연결되는 흐름: ', c.connections]].forEach(([label, text]) => { if (!text) return; const p = document.createElement('p'); const bold = textEl('b', '', label); p.appendChild(bold); p.append(text); item.appendChild(p); });
      concepts.appendChild(item);
    });
    section.appendChild(concepts);
    briefing.appendChild(section);
  }
  if (b.english_summary && b.english_summary.length) { const section = document.createElement('section'); section.className = 'brief-section wide'; section.appendChild(textEl('h2', '', 'English Summary')); const ul = document.createElement('ul'); b.english_summary.slice(0, 5).forEach(line => ul.appendChild(textEl('li', '', line))); section.appendChild(ul); briefing.appendChild(section); }
  slideEl.appendChild(briefing);
  counterEl.textContent = `${index + 1} / ${slides.length}`;
  prevBtn.disabled = index === 0;
  nextBtn.disabled = index === slides.length - 1;
}
prevBtn.addEventListener('click', () => { index = Math.max(0, index - 1); render(); });
nextBtn.addEventListener('click', () => { index = Math.min(slides.length - 1, index + 1); render(); });
document.addEventListener('keydown', event => { if (event.key === 'ArrowLeft') prevBtn.click(); if (event.key === 'ArrowRight') nextBtn.click(); });
render();
</script>
</body>
</html>
