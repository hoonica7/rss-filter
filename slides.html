<title>Daily Paper Slideshow</title>
<style>
  :root {
    color-scheme: light;
    --bg: #f6f7f4;
    --paper: #ffffff;
    --ink: #111827;
    --muted: #64748b;
    --line: #d8ddd2;
    --accent: #176b87;
    --accent-2: #9a3412;
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; overflow: auto; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: var(--bg); color: var(--ink); }
  .shell { max-width: 1500px; min-height: 100vh; margin: 0 auto; padding: 14px 18px; display: flex; flex-direction: column; }
  .topbar { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 16px; }
  .top-actions { display: flex; align-items: center; gap: 10px; }
  .topbar a, button { border: 1px solid var(--line); border-radius: 8px; background: var(--paper); color: var(--ink); padding: 10px 14px; font-weight: 700; text-decoration: none; cursor: pointer; }
  button.primary { background: var(--accent); border-color: var(--accent); color: white; }
  button:disabled { opacity: 0.45; cursor: not-allowed; }
  .counter { color: var(--muted); font-weight: 700; }
  .slide { min-height: calc(100vh - 82px); background: var(--paper); border: 1px solid var(--line); border-radius: 10px; padding: 18px; box-shadow: 0 18px 42px rgba(15, 23, 42, 0.10); display: grid; grid-template-columns: minmax(310px, 0.86fr) minmax(0, 1.55fr); gap: 18px; overflow: visible; }
  .paper-head { min-width: 0; min-height: 0; overflow: visible; display: flex; flex-direction: column; gap: 12px; }
  .figure { margin: 0; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: #f8fafc; }
  .figure img { display: block; width: 100%; max-height: 41vh; object-fit: contain; background: white; }
  .figure figcaption { padding: 7px 10px; color: var(--muted); font-size: 12px; line-height: 1.3; }
  .head-text { display: flex; flex-direction: column; gap: 9px; min-width: 0; }
  .badges { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .badge { border-radius: 999px; padding: 5px 9px; background: #eef2ff; color: #3730a3; font-size: 12px; font-weight: 800; }
  .score { background: #fee2e2; color: #991b1b; }
  h1 { margin: 0; font-size: 25px; line-height: 1.15; letter-spacing: 0; overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
  h1 a { color: inherit; text-decoration-color: rgba(23, 107, 135, 0.35); text-decoration-thickness: 2px; text-underline-offset: 4px; }
  h1 a:hover { color: var(--accent); text-decoration-color: var(--accent); }
  .meta, .authors, .why, .abstract { font-size: 13px; line-height: 1.45; }
  .meta, .authors { color: var(--muted); }
  .why strong, .abstract strong, .authors strong { color: var(--ink); }
  .authors { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .why { border-left: 4px solid var(--accent-2); padding-left: 10px; color: #374151; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .abstract { border-top: 1px solid var(--line); padding-top: 14px; color: #374151; }
  .original-abstract { border-top: 1px solid var(--line); padding-top: 10px; color: #374151; font-size: 11.5px; line-height: 1.35; overflow-wrap: anywhere; }
  .original-abstract strong { display: block; margin-bottom: 4px; color: var(--ink); }
  .tags { display: flex; flex-wrap: wrap; gap: 8px; }
  .tag { border-radius: 999px; padding: 4px 8px; background: #f1f5f9; color: #475569; font-size: 12px; font-weight: 700; }
  .head-text > .link { display: none; }
  .briefing { min-width: 0; min-height: 0; overflow: visible; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); grid-auto-rows: minmax(0, auto); align-content: start; gap: 11px 18px; border-top: 0; padding-top: 0; }
  .brief-section { min-width: 0; }
  .brief-section.wide { grid-column: 1 / -1; }
  .brief-section h2 { margin: 0 0 4px; font-size: 14px; line-height: 1.22; color: #0f766e; letter-spacing: 0; }
  .brief-section p, .brief-section li { margin: 0; font-size: 12.5px; line-height: 1.42; color: #1f2937; overflow-wrap: anywhere; }
  .brief-section ul { margin: 0; padding-left: 20px; }
  .concepts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 9px 14px; }
  .concept { border-top: 1px solid var(--line); padding-top: 7px; }
  .concept h3 { margin: 0 0 4px; font-size: 13px; color: #7c2d12; letter-spacing: 0; }
  .concept p { margin: 2px 0 0; font-size: 11.5px; line-height: 1.35; color: #374151; overflow-wrap: anywhere; }
  .concept b { color: #111827; }
  .link { color: var(--accent); font-weight: 800; text-decoration: none; }
  .empty { padding: 48px; background: var(--paper); border: 1px solid var(--line); border-radius: 12px; color: var(--muted); }
  @media (max-width: 860px) {
    .shell { padding: 14px; }
    .topbar, .top-actions { align-items: stretch; flex-direction: column; }
    .slide, .briefing, .concepts { grid-template-columns: 1fr; }
    .slide { min-height: auto; overflow: visible; display: grid; }
    h1 { font-size: 28px; }
  }
</style>

<script>
const slides = [{"title": "Pressure tuning of electronic correlations and flat bands in CsCr3Sb5", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/pqbc-87xb", "authors": "Maria Chatzieleftheriou, Jonas B. Profe, Ying Li, Roser Valentí", "last_authors": "Ying Li, Roser Valentí", "summary": "${\\mathrm{CsCr}}_{3}{\\mathrm{Sb}}_{5}$ is a newly identified strongly correlated kagome superconductor, characterized by non-Fermi-liquid behavior at elevated temperatures and intertwined charge and spin density wave order below ${T}_{\\text{DW}}≈54\\phantom{\\rule{0.222222em}{0ex}}\\mathrm{K}$. Under e…", "tier": "A_MUST_READ", "score": "10", "reason": "Kagome superconductor closely related to AV3Sb5 materials.", "tags": ["kagome", "superconductivity", "correlated"], "image": "", "briefing": {"background": "카고메 격자 구조를 가진 화합물은 격자 기하학에서 기인한 평탄띠(flat band)와 디락 점(Dirac point), 반-반-반 호핑(van Hove singularity) 덕분에 강한 전자 상관관계와 위상적 물성을 구현하는 중요한 플랫폼입니다.", "motivation": "CsCr3Sb5는 최근 발견된 카고메 초전도체로, 기존 AV3Sb5 계열과 유사하면서도 전이 금속인 크롬(Cr)을 포함하여 스핀과 전하 밀도파(CDW)가 얽힌 독특한 비-페르미 액체 거동을 보입니다. 본 연구는 압력이라는 외부 변수를 통해 이 물질의 전자 상관관계를 조절하고 물성을 이해하고자 합니다.", "result": "압력 변화가 CsCr3Sb5 내의 평탄띠 위치와 전자 상관관계 강도에 미치는 영향을 분석하여, 구조적 안정성과 전자 상태 변화 간의 상관관계를 밝혔습니다.", "implication": "CsV3Sb5 계열의 초전도성과 CDW 사이의 복잡한 경쟁 관계를 이해하는 데 있어, Cr 기반 시스템이 제공하는 추가적인 자유도와 차이점을 파악할 수 있습니다.", "novelty": "AV3Sb5 연구의 연장선상에서 크롬 기반 시스템의 압력 효과를 다룸으로써, 카고메 금속의 범용적인 물리 기작을 규명하는 데 기여합니다.", "unresolved": "압력에 따른 초전도 전이 온도(Tc)의 구체적인 진화 경로와 양자 임계점의 존재 여부는 추가적인 실험적 검증이 필요합니다.", "future_work": "저온 및 고압 조건에서의 상세한 수송 현상 측정과 더불어, 압력에 따른 스핀 밀도파 구조의 변화를 중성자 산란 등으로 확인할 필요가 있습니다.", "concepts": [{"term": "카고메 금속", "why_emerged": "기하학적 좌절(geometrical frustration)과 독특한 밴드 구조를 통해 새로운 양자 상태를 연구하기 위해 필요함.", "origin": "수학적 기하학에서 유래, 고체 물리학에서는 2010년대 이후 AV3Sb5 계열 발견으로 본격화.", "connections": "디락 물리학, 평탄띠, 강상관 전자계."}, {"term": "평탄띠 (Flat bands)", "why_emerged": "운동 에너지가 억제되어 전자 상관관계가 극대화되는 에너지 준위를 연구하기 위함.", "origin": "E. Lieb 등에 의해 초기 이론적 토대 마련.", "connections": "강상관 초전도, 자기적 질서."}], "english_summary": ["CsCr3Sb5 is a new Cr-based kagome superconductor with complex CDW/SDW orders.", "The study investigates the evolution of flat bands and correlations under pressure.", "Results provide insight into the electronic tunability of Cr-based kagome materials.", "The work bridges the gap between Cr-based kagome physics and well-known AV3Sb5 systems."]}}, {"title": "Tunable electron-plasmon coupling in the layered transition metal dichalcogenide ZrSe2−xTex", "journal": "PRB_Recent", "source": "author whitelist", "link": "http://link.aps.org/doi/10.1103/mkfk-8k2t", "authors": "Tongrui Li, Yuzhe Wang, Haoyuan Yan, et al.", "last_authors": "Donglai Feng, Juan Jiang", "summary": "Electron-plasmon coupling, in which carriers are dressed by collective electronic oscillations, represents an important many-body interaction in solids. Here, using angle-resolved photoemission spectroscopy, we report the tunable electron-plasmon coupling in the layered transition metal dichalcogeni…", "tier": "A_MUST_READ", "score": "10", "reason": "author whitelist: Donglai Feng", "tags": ["angle-resolvedphotoemission", "photoemission"], "image": "", "briefing": {"background": "고체 내에서 전하 운반체(전자)와 집단적 진동(플라즈몬) 사이의 결합은 전자-전자 상호작용을 결정짓는 핵심 다체 물리 현상으로, 에너지 손실 및 수송 특성에 깊게 관여합니다.", "motivation": "층상 구조의 전이금속 디칼코게나이드(TMD)인 ZrSe2-xTex 시스템에서 조성 조절을 통해 전자 농도를 변화시킴으로써, 전자와 플라즈몬 간의 결합 강도를 능동적으로 제어할 수 있는지를 확인하고자 합니다.", "result": "ARPES를 통해 전자 분산 관계(dispersion)에서 나타나는 플라즈몬 결합의 특징적 '킨크(kink)' 구조를 확인하였으며, Te 함량에 따라 이 결합 강도가 변화함을 관측했습니다.", "implication": "TMD 기반 소자에서 전자-플라즈몬 상호작용을 공학적으로 제어할 수 있는 가능성을 제시하며, 이는 초고속 광전자 소자 설계의 토대가 됩니다.", "novelty": "ARPES를 이용해 물질의 조성 변화에 따른 전자-플라즈몬 결합의 동적 변화를 직접적으로 시각화했다는 점이 독자들의 관심사인 전자 구조 연구에 매우 유용합니다.", "unresolved": "플라즈몬 결합이 초전도성이나 다른 위상적 물성에 미치는 정량적인 영향력은 아직 구체화되지 않았습니다.", "future_work": "시간 분해(Time-resolved) ARPES를 사용하여 플라즈몬 모드의 실시간 동역학을 관측하거나, 도핑에 따른 플라즈몬 분산의 상세 구조 연구가 예상됩니다.", "concepts": [{"term": "전자- ween the pseudogap and strange metal states.", "Uses spectral functions and transport properties to elucidate the nature of strong electronic correlation.", "Provides a theoretical framework for understanding non-Fermi liquid behavior in 2D systems."]}}, {"title": "Raman spectroscopy of the van der Waals topological magnet GdGaI", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/n87n-h8p5", "authors": "Nan Jiang, Yijin Zhang, Yujie Xia, et al.", "last_authors": "Tomoki Machida, Yasuhiro Niimi", "summary": "We report polarization-resolved Raman spectroscopy of a van der Waals compound $\\mathrm{GdGaI}$ that is a candidate for excitonic insulators. By combining the symmetry analysis with density functional theory calculations, we identify six Raman-active phonons. The spectra exhibit only the expected an…", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Experimental Raman study of a vdW topological magnet.", "tags": ["experiment", "vanderWaals", "topological", "Raman"], "image": "", "briefing": {"background": "반데르발스(vdw) 자기 물질은 새로운 물리 현상 탐색 및 spintronics 응용을 위한 플랫폼으로 주목받으며, 특히 위상학적 특성을 가진 물질에 대한 분광학적 검증이 중요합니다.", "motivation": "GdGaI 화합물이 엑시톤 절연체(excitonic insulator) 후보 물질로서 어떤 위상학적 혹은 자기적 특성을 가지는지 라만 분광법을 통해 조사하고자 했습니다.", "result": "편광 분해 라만 분광법을 통해 6개의 라만 활성 포논 모드를 식별하고, DFT 계산과 비교하여 대칭성을 분석했습니다.", "implication": "해당 물질의 격자 진동 모드와 자기 구조의 결합을 이해하여, 차후 위상학적 전이 가능성을 탐구할 기초를 마련했습니다.", "novelty": "vdW 위상학적 자기 물질에 대한 상세한 라만 분석을 통해 물질의 기본적인 격자 대칭성 정보를 확립했다는 점입니다.", "unresolved": "엑시톤 절연체로서의 명확한 증거(에너지 갭의 특징 등)는 본 라만 데이터만으로는 충분히 결론 내리기 어렵습니다.", "future_work": "저온에서의 온도 의존적 라만 측정 및 자기장 하에서의 라만 응답 변화 관찰이 요구됩니다.", "concepts": [{"term": "Raman Spectroscopy", "why_emerged": "물질의 격자 진동(포논) 및 전자 상태의 대칭성을 비파괴적으로 측정하기 위해 필요함.", "origin": "C. V. 라만(C. V. Raman)이 1928년 발견함.", "connections": "적외선 분광법(IR), 고체 물리학의 구조 해석 도구."}, {"term": "Excitonic Insulator", "why_emerged": "전자와 정공이 쿨롱 상호작용으로 결합하여 응축됨으로써 절연체가 되는 상태를 설명하기 위함.", "origin": "노지에르(Nozières) 등이 1960년대 초에 이론적으로 제안.", "connections": "Mott 절연체, BCS 이론의 응용."}], "english_summary": ["Polarization-resolved Raman study of the vdW topological magnet GdGaI.", "Identifies six Raman-active phonon modes using symmetry analysis and DFT calculations.", "Investigates the candidate excitonic insulator properties of the material.", "Provides baseline vibrational data for further topological and magnetic characterization."]}}, {"title": "Room-temperature two-dimensional ferromagnetism, large magnetic anisotropy, and anomalous Hall effect: From supported to freestanding monolayers GdM2 (M=Cu, Ag, Au)", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/csml-jn4q", "authors": "Jia-wan Li, Xunwu Hu, Dao-Xin Yao, Yusheng Hou", "last_authors": "Dao-Xin Yao, Yusheng Hou", "summary": "Here, the authors demonstrate that decoupling rare-earth Gd M 2 ( M =Cu, Ag, and Au) monolayers from metallic substrates transforms low-temperature supported surface alloys into room-temperature ferromagnets. Substrate removal enhances magnetic exchange interactions through charge redistribution, and eliminating structural buckling further modifies the competing exchange interactions. Freestanding GdAu 2 exhibits perpendicular magnetic anisotropy and a symmetry-tunable anomalous Hall effect, providing a platform for two-dimensional magnetic and topological spintronics.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "2D ferromagnetism and anomalous Hall effect in monolayer alloys of interest.", "tags": ["anomalousHall", "monolayer", "magnetic"], "image": "", "briefing": {"background": "2D 자성 물질의 상온 강자성 구현은 차세대 스핀트로닉스 소자의 구현을 위해 필수적인 과제입니다.", "motivation": "기판과의 상호작용이 단층 GdM2 박막의 자성에 미치는 영향을 규명하고, 기판을 제거했을 때 상온 강자성을 유도할 수 있는지 확인하고자 했습니다.", "result": "기판 탈착이 전하 재분배를 일으켜 교환 상호작용을 강화하며, 특히 GdAu2 단층에서 상온 강자성과 수직 자기 이방성(PMA) 및 이상 홀 효과를 확인했습니다.", "implication": "기판 공학(substrate engineering)을 통해 기존 저온 자성체들을 상온 소자로 응용할 수 있는 길을 열었습니다.", "novelty": "구조적 버 d electron systems with high controllability.", "Links moiré lattice physics directly to heavy-fermion phenomenology."]}}, {"title": "NMR Evidence for Spontaneous Electronic Chiral Order in URhSn", "journal": "PRL_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/1vjx-4jfv", "authors": "Y. Tokunaga, T. Ishitobi, H. Sakai, S. Kambe, H. Harima, A. Nakamura, A. Maurya, D. Li, Y. Homma, F. Honda, D. Aoki, and Y. Shimizu", "last_authors": "Y. Homma, F. Honda, D. Aoki, and Y. Shimizu", "summary": "The first direct evidence of spontaneous electronic chiral order in URhSn, a strongly correlated material without an inherently chiral lattice structure, fundamentally challenges the prevailing notion that electronic chirality requires a chiral crystal framework.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Direct evidence of novel electronic order in correlated material.", "tags": ["NMR", "correlated", "chirality"], "image": "", "briefing": {"background": "일반적으로 전자적 카이랄성(Chirality)은 물질의 결정 구조 자체가 비중심대칭적일 때 유도된다고 알려져 왔습니다.", "motivation": "결정 구조적으로 카이랄성이 없는 URhSn 물질에서 왜 자발적인 전자적 카이랄 질서가 나타나는지 그 근원을 NMR을 통해 규명하고자 했습니다.", "result": "NMR 측정 결과, 결정 구조의 대칭성을 깨지 않으면서도 전자적 자유도가 자발적인 카이랄 대칭성 깨짐을 유도한다는 직접적인 증거를 포착했습니다.", "implication": "결정 구조와 독립적인 새로운 유형의 전자적 카이랄 상태가 존재함을 시사하며, 이는 강상관 물질의 위상 물리 연구에 새로운 관점을 제공합니다.", "novelty": "결정 구조적 제약에서 벗어난 '순수 전자적 카이랄 질서'를 실험적으로 관측했다는 점이 파격적이며, 이는 TRSB나 루프 전류 문제와 맥을 같이합니다.", "unresolved": "이 자발적 카이랄 질서가 발생하는 미시적 상호작용의 구체적인 메커니즘과 그로 인한 위상학적 특성은 아직 명확하지 않습니다.", "future_work": "중성자 산란을 통한 자기 구조 분석이나 각분해 광전자 분광법(ARPES)을 통한 밴드 구조의 카이랄 특성 확인이 요구됩니다.", "concepts": [{"term": "Spontaneous Electronic Chiral Order", "why_emerged": "결정 대칭성에 기인하지 않는 새로운 자발적 질서 변수를 탐색하는 과정에서 대두되었습니다.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "Loop current, Time-reversal symmetry breaking (TRSB), topological phases."}, {"term": "NMR (Nuclear Magnetic Resonance)", "why_emerged": "국소적인 자기적 환경과 대칭성 변화를 극도로 정밀하게 탐지하기 위해 필요합니다.", "origin": "1946년 Bloch와 Purcell에 의해 개발되었습니다.", "connections": "Hyperfine interaction, Knight shift, local symmetry probes."}], "english_summary": ["Reports spontaneous electronic chiral order in URhSn, a non-chiral crystal.", "Provides direct NMR evidence for electronic symmetry breaking independent of the lattice.", "Challenges the paradigm that electronic chirality requires a chiral crystal framework.", "Offers new insights into correlated electron systems with emergent order."]}}, {"title": "Signatures of Altermagnetism in BiFeO3", "journal": "PRL_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/1wyj-nrgk", "authors": "Sajid Husain, Maya Ramesh, Qian Song, et al.", "last_authors": "Darrell G. Schlom, Ramamoorthy Ramesh", "summary": "Magnons provide a route to ultrafast transport and nondestructive readout of spin-based information transfer. Here, we report magnon transport and its emergent anisotropic nature in ${\\mathrm{BiFeO}}_{3}$ layers confined between ultrathin layers of the antiferromagnet ${\\mathrm{LaFeO}}_{3}$. Because…", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Direct experimental relevance to altermagnetism, a core interest area for the user.", "tags": ["experiment", "altermagnetism", "transport"], "image": "", "briefing": {"background": "반강자성체에서의 스핀 동역학은 초고속 스핀트로닉스를 위한 핵심 요소이며, 최근 알터마그네티즘(Altermagnetism)이라는 새로운 자성 분류가 주목받고 있습니다.", "motivation": "반강자성체 BiFeO3 박막에서 이방성 마그논 수송을 관측하여, 알터마그네틱 특성을 검증하고자 했습니다.", "result": "BiFeO3/LaFeO3 이질 구조에서 마그논의 비등방적 거동을 발견하였으며, 이는 대칭성이 낮은 자성 구조에서 발현되는 알터마그네티즘의 특징과 일치합니다.", "implication": "반강자성 절연체 내에서의 정보 전달 효율을 극대화할 수 있는 물리적 기초를 마련했으며, 비자성체 기반의 스핀 전류 제어 가능성을 제시합니다.", "novelty": "알터마그네티즘이 실제 물질(BiFeO3)에서 마그논 수송을 통해 실증되었다는 점은 해당 분야의 핵심 관심사와 직결됩니다.", "unresolved": "이 수송 현상이 벌크 상태와 박막 이질 구조에서 어떻게 차이를 보이는지, 그리고 외부 장에 의한 제어 한계가 어디까지인지 명확하지 않습니다.", "future_work": "다양한 두께의 BiFeO3 박막에서의 마그논 분산 관계 측정 및 스핀 전류 주입 효율에 관한 후속 실험이 예상됩니다.", "concepts": [{"term": "Altermagnetism", "why_emerged": "강자성체와 반강자성체의 경계에 있는 대칭적 성질을 가지며, 스핀 분리(spin splitting)를 보이는 자성 물질을 분류하기 위해 등장했습니다.", "origin": "최근 수년간 물리학계에서 이론적으로 체계화되었습니다.", "connections": "Antiferromagnetism, spin-polarized band structure, anomalous Hall effect."}, {"term": "Magnon transport", "why_emerged": "전하 흐름 없이 스핀 정보를 전달하여 열 발생을 최소화하는 고효율 정보 전달 수단이 필요했기 때문입니다.", "origin": "1950년대 스핀파 이론에 근거하며 최근 스핀트로닉스 분야에서 주류로 부상했습니다.", "connections": "Spin current, spin-Seebeck effect, spintronics."}], "english_summary": ["Provides experimental signatures of altermagnetism in BiFeO3 layers.", "Reports anisotropic magnon transport as evidence of the altermagnetic state.", "Suggests potential for ultrafast spin-based information processing in antiferromagnets.", "Highlights the role of confined magnetic structures in manipulating spin dynamics."]}}, {"title": "Dirac magnons in a thin elemental itinerant ferromagnet", "journal": "Science_Advances", "source": "Gemini", "link": "https://www.science.org/doi/abs/10.1126/sciadv.aed9835?af=R", "authors": "Khalil Zakeri, Christopher Hins, Robin R. Neumann, Alexander Mook, Arthur Ernst", "last_authors": "Alexander Mook, Arthur Ernst", "summary": "A distinct difference between graphene—an atomic layer of carbon—and conventional semiconductors is that its electrons behave as massless Dirac fermions, giving rise to unprecedented physical properties. Magnetically ordered solids host magnons, quasiparticles associated with magnetic degrees of freedom. While Dirac magnons have recently been predicted in specific insulating or rare-earth magnets, their existence in thin 3d magnets remains elusive because of the complex nature of itinerant magnetism and dimensionality effects. Here, we demonstrate the presence of Dirac magnons in a thin itinerant elemental ferromagnet. By investigating atomically designed hexagonal close-packed cobalt films, we establish that magnons in such structures resemble the Dirac electrons in graphene. We explain the physical nature of these Dirac magnons and discuss the consequences of symmetry, dimensionality, magnetic interactions, the number of atomic layers, and cobalt’s itinerant magnetism on the properties of the Dirac points. Our results pave the way for finding and engineering Dirac magnons in a variety of low-dimensional layered 3d ferromagnets and metamaterials.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Relevant to topological magnetic materials and magnonic band structure.", "tags": ["magnetism", "topology", "magnon"], "image": "", "briefing": {"background": "위상 물성 물리학에서 전자 상태의 디락 점(Dirac point)은 그래핀 연구 이후 광범위하게 탐구되어 왔습니다. 최근에는 자기적 자유도를 가진 마그논(magnon) 시스템에서도 이러한 위상적 밴드 구조를 구현하여 정보 전달 효율을 극대화하려는 시도가 활발합니다.", "motivation": "기존 절연체나 희토류 자성체에서 예측된 디락 마그논이, 일반적인 3d 전이금속 기반의 박막 자성체에서도 실제 구현 가능한지 확인하고자 함입니다.", "result": "육각형 구조의 코발트(hcp-Co) 박막에서 그래핀의 디락 전자와 유사한 특성을 갖는 디락 마그논의 존재를 실험적으로 규명했습니다.", "implication": "단순한 3d 금속 자성체에서도 위상적 마그논 밴드 구조를 엔지니어링할 수 있음을 보여주며, 이는 향후 저차원 자성체를 이용한 스핀트로닉스 소자 설계에 중요한 지침이 됩니다.", "novelty": "이방성, 차원성, 편력성 자성(itinerant magnetism)이 디락 마그논의 밴드 구조에 미치는 영향을 직접적으로 분석했다는 점이 본 연구의 차별점입니다.", "unresolved": "다양한 층수 및 다른 3d 자성체에서의 일반화 가능성, 그리고 실온 구동 시 디락 점의 견고함에 대해서는 추가적인 검증이 필요합니다.", "future_work": "다른 3d 전이금속 기반 박막에서의 디락 마그논 엔지니어링과 이를 활용한 마그논 기반 정보 처리 소자 연구가 기대됩니다.", "concepts": [{"term": "디락 마그논", "why_emerged": "자기적 여기(magnon)의 분산 관계에서 선형적인 교차점(디락 점)을 만들어 전하 없이 정보 전달 속도를 극대화하기 위해 필요함.", "origin": "최근 위상 자성체 연구 분야에서 이론적으로 예측됨.", "connections": "그래핀의 디락 페르미온, 위상 절연체, 스핀파 밴드 구조 이론과 연결됨."}, {"term": "편력 자성 (Itinerant Magnetism)", "why_emerged": "국소화된 모멘트 모델로 설명되지 않는 금속성 자성체(3d 전이금속 등)의 자기적 성질을 이해하기 위해 필요함.", "origin": "Stoner 모델 등이 기원이며, 20세기 중반 이후 확립됨.", "connections": "밴드 이론, DFT+DMFT, Hubbard 모델과 밀접함."}], "english_summary": ["Demonstrated the existence of Dirac magnons in atomically designed hcp-cobalt films.", "Established that 3d itinerant ferromagnets can host Dirac-like magnon dispersion similar to graphene electrons.", "Analyzed the influence of symmetry and dimensionality on Dirac magnon properties.", "Provides a platform for engineering topological magnonics in layered 3d magnets."]}}, {"title": "Picosecond switching of magnetic tunnel junctions by spin-orbit torque", "journal": "Science_Advances", "source": "Gemini", "link": "https://www.science.org/doi/abs/10.1126/sciadv.aed0607?af=R", "authors": "Chen Xiao, Wenlong Cai, Hongchao Zhang, et al.", "last_authors": "Kewen Shi, Weisheng Zhao", "summary": "Ultrafast switching of magnetic tunnel junctions (MTJs) is essential for future high-bandwidth memory and in-memory computing. However, state-of-the-art electrical switching of MTJs remains constrained to hundreds of picoseconds, leaving a substantial gap between memory and processors. Here, we experimentally demonstrate field-free switching of three-terminal MTJs using picosecond electrical pulses driven by spin-orbit torque (SOT), surpassing the speed limit by an order of magnitude. We further use voltage-gated (VG) effect to probe SOT switching mechanisms over wide pulse-width ranges and identify a nonmonotonic VG-SOT efficiency. While the efficiency is pronounced under long-pulse excitation, it diminishes in the subnanosecond regime but reemerges as the pulse width scales down to 13.2 ps, yielding an energy consumption about 30 fJ per bit. Micromagnetic analysis reveals that, from dc to picosecond timescale, the dominant magnetization switching dynamics evolve from thermally activated reversal to incoherent precession to coherent precession. These results establish picosecond VG-SOT as a pathway toward ultrafast and energy-efficient memory and logic.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Relevant spintronics and magnetic torque physics with potential experimental interest.", "tags": ["spintronics", "magnetism"], "image": "", "briefing": {"background": "현재 자성 메모리(MRAM)의 고속화와 고효율화를 위해서는 자기 터널 접합(MTJ)의 스위칭 시간을 나노초 단위에서 피코초 단위로 단축하는 것이 핵심 과제입니다.", "motivation": "기존의 스핀 궤도 토크(SOT) 스위칭 방식이 가진 속도 한계를 극복하고, 전력 소모를 최적화할 수 있는 새로운 구동 메커니즘을 찾고자 했습니다.", "result": "3단자 MTJ 구조에서 스핀 궤도 토크를 이용해 13.2 ps의 초고속 스위칭을 구현하고, 스위칭 효율의 비단조적 특성을 규명했습니다.", "implication": "메모리와 프로세서 사이의 속도 격차를 줄이는 차세대 초고속·저전력 스핀트로닉스 소자 구현 가능성을 제시합니다.", "novelty": "피코초 영역에서 전압 게이팅(VG)을 통한 SOT 효율 변화를 관측하고, 열적 활성화에서 인코히런트/코히런트 프리세션으로 변하는 동역학을 분석한 점이 독창적입니다.", "unresolved": "초고속 스위칭 시 발생하는 발열 문제와 소자의 반복 내구성에 대한 정량적인 분석은 추가 연구가 필요합니다.", "future_work": "실제 상용화 가능한 수준의 고집적 메모리 셀에서의 성능 테스트 및 대규모 어레이 소자 제작이 예상됩니다.", "concepts": [{"term": "스핀 궤도 토크 (SOT)", "why_emerged": "전류를 통해 스핀 전류를 생성하여 자화 방향을 효율적으로 제어하기 위해 필요함.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "스핀 홀 효과, 라쉬바 효과, MTJ 소자 기술과 연결됨."}, {"term": "자기 터널 접합 (MTJ)", "why_emerged": "자기 저항 효과를 이용해 비휘발성 정보 저장 및 판독을 하기 위해 개발됨.", "origin": "Julliere 등에 의해 제안되었으며, 1990년대 박막 공정 발전과 함께 성숙함.", "connections": "거대 자기 저항(GMR), 스핀트로닉스, MRAM과 연결됨."}], "english_summary": ["Achieved picosecond (13.2 ps) switching of magnetic tunnel junctions using spin-orbit torque.", "Identified nonmonotonic efficiency in voltage-gated SOT switching.", "Elucidated the evolution of switching dynamics from thermal to coherent precession.", "Offers a pathway for energy-efficient and ultra-high-speed memory and logic devices."]}}, {"title": "Coherent Magnons Driven by Photomodulated Anisotropy in Altermagnetic MnTe", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2607.18421", "authors": "Dingbin Huang, Jonathon Kruppe, Resham Babu Regmi, Nirmal J. Ghimire, James Analytis, Joseph Orenstein", "last_authors": "James Analytis, Joseph Orenstein", "summary": "Manganese telluride ($\\text{MnTe}$) has recently emerged as a prototypical $g$-wave altermagnet, providing an ideal platform to investigate the non-equilibrium excitations of altermagnetic order. Here, we report simultaneous spatial mapping of the local equilibrium orientation of the N\\'eel vector, $\\varphi_L(\\mathbf{r})$, alongside the amplitude, $\\Delta\\varphi(\\mathbf{r},t)$, and frequency, $\\Omega(\\mathbf{r})$, of photoexcited spin waves. Based on these measurements, we place a remarkably low upper bound of $\\approx 60~\\mu\\text{eV}$ (0.7 K) on the spin-wave gap arising from intrinsic anisotropy. This exceptionally weak hexagonal anisotropy ($K_6$) renders the altermagnetic order highly susceptible to optical tuning, allowing coherent spin waves to be driven by a photoinduced enhancement of $K_6$. Above a threshold pump fluence, our spatial maps reveal that this photomodulation manifests as a six-fold symmetric sawtooth dependence of $\\Delta\\varphi$ on $\\varphi_L$ and a cycloid-like modulation of $\\Omega$. Ultimately, the near-isotropy of the N\\'eel vector in $\\text{MnTe}$ enables optical and mechanical control over the orientation of spin-splitting in the electronic band structure, offering new pathways for altermagnetic spintronics.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Direct experimental study of altermagnetism and electronic structure modulation.", "tags": ["altermagnet", "magnon", "bandstructure"], "image": "https://arxiv.org/static/browse/0.3.4/images/arxiv-logo-fb.png", "briefing": {"background": "최근 알터자성체(Altermagnet)는 반강자성체의 상쇄 특성과 강자성체의 스핀 분리 밴드 구조를 동시에 갖는 새로운 물질군으로 주목받고 있습니다.", "motivation": "알터자성체인 MnTe에서 스핀 분리 효과의 근원인 자기 이방성을 빛으로 정밀하게 제어하고, 이와 관련된 비평형 여기 상태를 탐구하고자 했습니다.", "result": "MnTe의 자기 이방성 에너지가 극도로 작음(60 μeV 미만)을 확인하였고, 광학적 펌핑을 통해 이방성을 조절하여 코히런트 스핀파(마그논)를 구동하는 데 성공했습니다.", "implication": "알터자성체에서의 전자 밴드 구조 내 스핀 분리를 빛과 같은 외부 자극으로 제어할 수 있는 가능성을 열었으며, 이는 광-스핀트로닉스 분야의 핵심 토대가 될 수 있습니다.", "novelty": "알터자성체의 핵심 특성인 스핀-밴드 구조의 이방성을 광학적으로 조절하는 방법을 실험적으로 증명했다는 점이 독보적입니다.", "unresolved": "실제 상온에서의 광학적 제어 효율과 제어 가능한 스핀 밴드 분리폭의 상한선에 대한 추가적인 물리적 규명이 필요합니다.", "future_work": "다양한 알터자성체 후보군에서의 광학적 스핀 조절 연구 및 스핀 제어 메커니즘을 이용한 논리 소자 구현 연구가 이어질 것입니다.", "concepts": [{"term": "알터자성체 (Altermagnet)", "why_emerged": "반강자성체이면서도 스핀 분리된 전자 밴드 구조를 가진 새로운 자기 위상을 기술하기 위해 필요함.", "origin": "최근(2020년대 이후) 이론 연구를 통해 확립됨.", "connections": "반강자성체, 스핀 분리, Berry 곡률, 비전통적 스핀트로닉스와 연결됨."}, {"term": "네엘 벡터 (Néel vector)", "why_emerged": "반강자성체의 하위 격자 간 스핀 모멘트 차이를 표현하기 위해 필요함.", "origin": "Louis Néel에 의해 제안됨.", "connections": "반강자성 자기 질서, 자기 도메인, 자이로스코픽 효과와 연결됨."}], "english_summary": ["Reported coherent spin-wave excitation in the altermagnet MnTe via photomodulated anisotropy.", "Measured an exceptionally low spin-wave gap (~60 μeV) indicating high susceptibility to optical tuning.", "Demonstrated six-fold symmetric sawtooth dependence of spin-wave amplitude on Néel vector orientation.", "Paves the way for optical control of spin-splitting in electronic band structures."]}}, {"title": "Complete Hierarchy of Nonrelativistic Odd-Parity Spin Splitting in Collinear Magnets", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2607.19303", "authors": "Yichen Liu, Junxi Yu, Pu Zhang, Cheng-Cheng Liu", "last_authors": "Pu Zhang, Cheng-Cheng Liu", "summary": "Momentum-dependent nonrelativistic spin splitting provides a symmetry fingerprint of collinear magnets and can govern unconventional electronic, magnonic, and transport phenomena. Whereas even-parity $s$-, $d$-, $g$-, and $i$-wave splittings in collinear magnets have been extensively studied, odd-parity counterparts remain unexplored beyond the $p$-wave and $f$-wave classes. Here, using group theory, we establish the complete classification of odd-parity spin splitting in collinear magnets. We show that, in addition to the $p$-wave and $f$-wave forms, $h$- and $k$-wave splittings with $\\ell=5$ and $7$ are allowed, while $m$-wave splitting with $\\ell=9$ constitutes the upper bound. We derive a complete mapping from crystallographic point-group irreducible representations to the lowest-order odd-parity basis functions and formulate the coupling rule between a symmetry-breaking axial field and the parent N\\'eel order that selects the induced odd-parity class. We further construct minimal lattice models that realize $h$-, $k$-, and $m$-wave splitting. Guided by this classification, we screen the MAGNDATA database and show that circularly polarized light can drive the $\\mathcal{PT}$-symmetric antiferromagnets Fe$_2$TeO$_6$ and MgFe$_6$Ge$_6$ into $h$-wave and $k$-wave phases, respectively, exhibiting the hallmark spin splittings in both electronic bands and magnon spectra. Symmetry analysis and Berry-curvature calculations show that collinear odd-parity magnets of both $h$- and $k$-wave allow an anomalous Hall response, whereas the $m$-wave class forbids it. Together, these results complete the partial-wave hierarchy of odd-parity spin splitting in collinear magnets and establish symmetry criteria for anomalous transport in the high-partial-wave classes.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Crucial classification for altermagnetism/spin-splitting relevant to the user's magnetic materials interests.", "tags": ["antiferromagnet", "altermagnetism", "transport", "Berrycurvature"], "image": "https://arxiv.org/html/2607.19303v1/x1.png", "briefing": {"background": "공선형 자성체(collinear magnets)에서 발생하는 비상대론적 스핀 분리는 자성 재료의 새로운 물성을 이해하는 핵심 요소입니다. 특히 최근 주목받는 알터자성(altermagnetism) 연구의 연장선상에서 대칭성에 기반한 스핀 구조의 분류가 중요해졌습니다.", "motivation": "기존에는 짝수 패리티(even-parity) 스핀 분리만 집중적으로 연구되었으나, 홀수 패리티(odd-parity) 스핀 분리에 대한 체계적인 분류가 부족하여 이를 이론적으로 완성하고자 했습니다.", "result": "군론을 통해 홀수 패리티 스핀 분리의 계층 구조를 $m$-wave($\\ell=9$)까지 완벽히 분류했습니다. 또한 Fe2TeO6와 MgFe6Ge6와 같은 실제 화합물에서 특정 빛의 편광을 통해 이러한 스핀 상태를 유도할 수 있음을 보였습니다.", "implication": "알터자성 재료에서 anomalous Hall 효과와 같은 비통상적 수송 현상을 예측하고 설계할 수 있는 대칭성 기준을 확립했습니다.", "novelty": "기존 연구의 한계를 넘어 높은 차수의 편각(high-partial-wave) 스핀 분리 클래스를 정의했으며, 이는 자성 토폴로지 물질의 밴드 구조 분석에 직접적인 가이드라인을 제공합니다.", "unresolved": "이론적 분류는 완성되었으나, 매우 높은 차수의 파동함수(예: $m$-wave)가 실제 재료에서 실험적으로 관측 가능한 강도로 존재하는지는 여전히 확인이 필요합니다.", "future_work": "제시된 물질군에서 ARPES나 자성 공명을 활용하여 예측된 스핀 분리 구조의 실험적 검증이 기대됩니다.", "concepts": [{"term": "알터자성(Altermagnetism)", "why_emerged": "기존 강자성/반강자성으로 분류되지 않는, 스핀-궤도 결합 없이도 momentum-dependent 스핀 분리를 보이는 새로운 위상 때문.", "origin": "초록 iable strategy to suppress parasitic conduction while stabilizing helical edge transport, providing a versatile and reproducible platform for tunable topological transport in III-V quantum spin Hall systems.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Experimental transport study of QSHI, directly relevant to topological insulator interests.", "tags": ["topological", "quantum-spin-Hall", "transport"], "image": "https://arxiv.org/static/browse/0.3.4/images/arxiv-logo-fb.png", "briefing": {"background": "양자 스핀 홀 절연체(QSHI)는 토폴로지적으로 보호된 헬리컬 엣지 채널을 통해 저항 없는 전류 흐름을 유도할 수 있어 차세대 전자 소자로 주목받습니다.", "motivation": "실제 III-V 화합물 기반 QSHI 소자에서 불필요한 벌크 및 엣지 기여로 인해 이상적인 양자 수송 관측이 어렵다는 문제를 해결하고자 했습니다.", "result": "이중 게이트(dual-gated) InAs/GaInSb 양자 우물 구조를 통해 벌크 전도를 효과적으로 억제하고, 헬리컬 엣지 채널의 양자화된 저항을 안정적으로 유지하는 데 성공했습니다.", "implication": "정전기적 제어만으로 토폴로지 엣지 채널의 수송 특성을 안정화할 수 있음을 증명하여 향후 위상 소자 개발에 실용적인 가이드라인을 제시합니다.", "novelty": "위상 절연체 연구에서 고질적인 문제였던 잡음(parasitic conduction)을 외부 게이트 전압 제어로 해결하여 소자의 재현성을 확보했습니다.", "unresolved": "외부 전기장이 일정 임계값을 넘어서면 여전히 기생 엣지 성분이 나타나는데, 이에 대한 미시적인 물리적 기원은 규명되지 않았습니다.", "future_work": "본 소자 구조를 활용하여 보다 복잡한 토폴로지 회로 구성 및 위상학적 비평형 상태에 대한 연구가 수행될 것으로 보입니다.", "concepts": [{"term": "양자 스핀 홀 절연체(QSHI)", "why_emerged": "물질 내부에서는 절연체이나 가장자리에서는 스핀이 고정된 전류가 흐르는 상태를 활용하기 위해.", "origin": "Kane & Mele (2005)", "connections": "위상 절연체, 헬리컬 엣지 상태"}, {"term": "헬리컬 엣지 채널(Helical Edge Channel)", "why_emerged": "스핀과 운동량이 결합되어 후방 산란이 금지된 1차원 전도 경로를 구현하기 위해.", "origin": "Bernevig, Hughes, & Zhang (2006)", "connections": "토폴로지 절연체, 양자 홀 효과"}, {"term": "이중 게이트(Dual-gated) 제어", "why_emerged": "밴드 구조의 페르미 준위를 정밀하게 조절하여 벌크 상태를 비우고 엣지 상태를 격리하기 위해.", "origin": "일반적인 반도체 소자 물리학", "connections": "양자 우물 소자, 정전기적 밴드 엔지니어링"}], "english_summary": ["Demonstrates electrostatic dual-gating to isolate helical edge channels in QSHI.", "Successfully suppresses parasitic bulk conduction in InAs/GaInSb quantum wells.", "Achieves robust and quantized edge resistance in macroscopic devices.", "Provides a reliable strategy for tunable topological transport."]}}, {"title": "Incommensurate modulation with Q=0 A-type Antiferromagnetic Order in CeRh2As2 revealed by NQR studies", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2607.18686", "authors": "Shiki Ogata, Shunsaku Kitagawa, Kenji Ishida, et al.", "last_authors": "Christoph Geibel, Seunghyun Khim", "summary": "We performed 75 As nuclear quadrupole resonance (NQR) and nuclear magnetic resonance (NMR) measurements on a higher-quality single-crystalline CeRh 2 As 2 , a heavy-fermion superconductor exhibiting multiple superconducting (SC) phases under magnetic fields along the c c axis. This SC multiphase is believed to originate from staggered Rashba spin–orbit coupling associated with locally broken inversion symmetry. In addition to superconductivity, CeRh 2 As 2 exhibits phase I below T 0 ∼ 0.5 T_{0}\\sim 0.5 K and an antiferromagnetic (AFM) state below T N ∼ 0.25 T_{\\mathrm{N}}\\sim 0.25 K in the early-stage samples. In the higher-quality sample, the AFM transition becomes more pronounced, and T N T_{\\mathrm{N}} increases to nearly coincide with T SC T_{\\mathrm{SC}} . The NQR spectra at the As(1) site imply an internal field with an incommensurate distribution, indicating a two-dimensional incommensurate modulation of the magnetic structure superimposed on a 𝑸 = 𝟎 \\bm{Q}=\\bm{0} A-type AFM component. Moreover, a pronounced decrease in the NQR intensity at T 0 T_{0} well-above T N T_{\\mathrm{N}} and an abrupt increase in the internal field at T N T_{\\mathrm{N}} suggest the emergence of a slowly fluctuating AFM order at T 0 T_{0} which becomes static at T N T_{\\mathrm{N}} .", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Directly relevant study of a heavy-fermion system exhibiting unconventional superconductivity.", "tags": ["superconduct", "antiferromagnet"], "image": "https://arxiv.org/html/2607.18686v1/x1.png", "briefing": {"background": "CeRh2As2는 국소 반전 대칭 파괴(locally broken inversion symmetry)를 가진 중페르미온계 초전도체로, 다중 초전도 상과 자기적 성질 사이의 복잡한 상관관계를 보여줍니다.", "motivation": "기존 시료보다 순도가 높은 시료를 통해 이 물질의 자기적 질서와 초전도성 사이의 관계를 더 명확히 파악하고자 했습니다.", "result": "NQR 측정 결과, Q=0 A-type 반강자성 상태 위에 2차원적인 인커멘수레이트(incommensurate) 변조가 겹쳐진 자기 구조를 발견했습니다.", "implication": "이러한 복잡한 자기 구조는 CeRh2As2의 다중 초전도 상이 단순히 대칭성 파괴뿐만 아니라 자기적 요동과도 밀접하게 연결되어 있음을 시사합니다.", "novelty": "NQR intensity 분석을 통해 T0 온도에서 정적인 질서 이전의 미세한 자기적 요동이 존재함을 밝혀내어 초전도 상 변이의 기원 연구에 진일보를 이뤘습니다.", "unresolved": "제안된 자기 구조의 구체적인 스핀 정렬 모델이 이론적으로 완벽히 정립되지 않았으며, 초전도와의 직접적인 결합 기작이 추가 연구 과제입니다.", "future_work": "중성자 산란 실험 등을 통한 자기 구조의 직접적 이미지화와 압력 변화에 따른 상 다이어그램 연구가 필요합니다.", "concepts": [{"term": "중페르미온계(Heavy Fermion)", "why_emerged": "f-전자와 전도 전자 사이의 강한 상관관계로 유효 질량이 극도로 커지는 현상을 설명하기 위해.", "origin": "Steglich et al. (1979)", "connections": "근도체, Kondo 효과"}, {"term": "인커멘수레이트 변조(Incommensurate modulation)", "why_emerged": "격자 상수와 정수 배의 관계를 갖지 않는 자기 구조가 물질 내에 존재함을 기술하기 위해.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "스핀 밀도 파동, 자기 구조"}, {"term": "NQR(Nuclear Quadrupole Resonance)", "why_emerged": "핵의 전기 사중극자 모멘트와 주변 전기장 기울기의 상호작용을 측정하여 국소적인 전자 구조를 알아내기 위해.", "origin": "전통적인 분광학 기법", "connections": "NMR, 국소 상태 밀도"}], "english_summary": ["Performs high-quality NQR studies on the heavy-fermion superconductor CeRh2As2.", "Reveals a complex magnetic structure: Q=0 A-type AFM with incommensurate modulation.", "Detects slowly fluctuating AFM order emerging at T0, well above the TN transition.", "Links the magnetic fluctuations to the multi-phase superconducting behavior."]}}, {"title": "J1 - J2 - model on a square lattice: From Altermagnet to Columnar antiferromagnet via quantum disordered phase", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2607.16415", "authors": "Subharthi Paul, Darshan G. Joshi", "last_authors": "Subharthi Paul, Darshan G. Joshi", "summary": "Altermagnetism in the case of local-moment magnets is characterized by zero net magnetization and splitting of opposite chirality magnon bands in the absence of any spin-anisotropic interactions or external field. In this work we investigate the robustness of altermagnets against quantum fluctuations arising from magnetic frustration. We consider a Heisenberg model on a square lattice with two different types of second-neighbor interactions, as in a checkboard pattern, in addition to the nearest-neighbor interaction. This model continuously interpolates between the $J_{1}-J_{2}$ Heisenberg model on the square lattice and the Heisenberg model on the checkerboard lattice. For weaker second-neighbor interactions a N\\'{e}el-type altermagnet phase is realized. On the other hand, for stronger second-neighbor interactions a columnar antiferromagnet emerges. Using linear spin-wave theory we calculate the magnon dispersion, order parameter, static and dynamical structure factors for the two magnetic phases. Further, we show that there is an intermediate quantum disordered phase separating the two magnetic phases, which is connected to the one realized in the $J_{1}-J_{2}$ model. The quantum disordered region is further stabilized as we tune towards the checkerboard lattice limit.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Theoretical study of altermagnetism and magnon dispersion, directly relevant to user's interests.", "tags": ["altermagnet", "magnon", "antiferromagnet"], "image": "https://arxiv.org/html/2607.16415v1/x1.png", "briefing": {"background": "알터마그네틱(Altermagnet)은 비스핀-궤도 결합 상황에서도 스핀 결정학적 대칭성에 의해 스핀 반대 방향의 마그논 밴드 분리를 보이는 새로운 자성 상태입니다. 이는 기존의 강자성(Ferromagnet)과 반강자성(Antiferromagnet)의 경계를 넘어선 위상물질 연구의 핵심 주제입니다.", "motivation": "알터마그네틱 상태가 강한 양자 요동과 자기적 좌절(frustration)이 존재하는 환경에서도 얼마나 안정적으로 유지될 수 있는지 확인하고자 함입니다.", "result": "J1-J2 모델을 통해 Nèel형 알터마그네틱 상과 칼럼형 반강자성 상 사이의 위상적 연결을 확인하였으며, 그 사이 중간에 양자 무질서 상(quantum disordered phase)이 존재함을 이론적으로 규명했습니다.", "implication": "알터마그네틱 질서가 격자 구조의 튜닝을 통해 다른 자성 상으로 전이될 수 있음을 시사하며, 이는 향후 비전통적 자성체 설계의 이론적 토대가 됩니다.", "novelty": "자기적 좌절이 알터마그네틱 특성에 미치는 영향을 체계적으로 분석하여, 강상관 전자계에서 알터마그네틱 상의 생존 가능성을 명확히 함.", "unresolved": "실제 구체적인 화합물에서의 실험적 검증이나 도핑 등의 외부 변수가 미치는 영향은 아직 명확하지 않습니다.", "future_work": "실제 격자 기반의 양자 무질서 상의 물리적 특성을 더욱 정밀하게 분석하고, 비스핀-이방성 상호작용이 배제된 실제 물질 후보군 탐색이 필요합니다.", "concepts": [{"term": "Altermagnet", "why_emerged": "기존 강자성/반강자성으로 분류되지 않는, 시간 반전 대칭성을 깨뜨리면서도 순 자화가 0인 새로운 자성 상태를 기술하기 위함.", "origin": "최근 2-3년 내 이론적으로 급부상, 특정 1인보다는 이론 물리학계의 공동 노력.", "connections": "스핀-궤도 결합(SOC), 비상반적 수송 현상, 베리 곡률."}, {"term": "J1-J2 Model", "why_emerged": "격자 위에서 근접 및 차근접 상호작용이 만드는 자기적 좌절 현상을 연구하기 위한 표준 모델.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "양자 스핀 액체, 하이젠베르크 모델."}], "english_summary": ["Investigated the robustness of altermagnetism against magnetic frustration using a modified J1-J2 square lattice model.", "Identified a transition from a Néel-type altermagnet to a columnar antiferromagnet.", "Found an intermediate quantum disordered phase separating these two magnetic states.", "Utilized linear spin-wave theory to characterize the magnon dispersions in these phases."]}}, {"title": "Observation of Critical Current Minimum in Super-Honeycomb Josephson Junction Arrays", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2607.16500", "authors": "Melissa Mikalsen, Alexander-Georg Penner, Samuel D. Escribano, et al.", "last_authors": "Yuval Oreg, Javad Shabani", "summary": "Superconductor-semiconductor Josephson junction arrays are a uniquely tunable platform for studying collective quantum phenomena, particularly in the regime where localized Andreev bound states can hybridize across the lattice when the physical separation between adjacent junctions is smaller than their coherence length ($\\xi_{\\text{ABS}}>d_{\\text{JJ}}$). Here, we investigate three distinct Al-InAs Josephson junction arrays: a square array and super-honeycomb array fabricated within this ${\\xi_{\\text{ABS}}>d_{\\text{JJ}}}$ regime, as well as a larger-spacing super-honeycomb control device designed such that $\\xi_{\\text{ABS}}\\lesssim\\!~d_{\\text{JJ}}$. Under an out-of-plane field, critical current peaks emerge at rational filling factors, reflecting stable vortex configurations in the lattices. In the super-honeycomb lattice, vortices localize to distinct non-identical plaquettes at different filling factors, as predicted by frustrated XY model simulations. A rotating in-plane field yields periodic critical current oscillations that reflect the Rashba spin-orbit coupling inherent to the InAs quantum well. Surprisingly, at $f = 1$, the closely spaced super-honeycomb array exhibits a distinct critical current minimum as the magnitude of the in-plane field increases, a signature absent in the square array and large-spacing super-honeycomb array. These results indicate that this signature is jointly influenced by the unique geometry of the super-honeycomb vortex lattice and by long-range inter-junction hybridization.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Experimental study of superconductivity, Rashba SOC, and vortex physics in Josephson junction arrays.", "tags": ["superconduct", "Majorana", "Rashba"], "image": "https://arxiv.org/html/2607.16500v1/graphics/figure-1.png", "briefing": {"background": "초전도체-반도체 접합 배열은 안드레예프 결합 상태(Andreev bound states)를 조절하여 Majorana 페르미온과 같은 위상적 양자 상태를 연구하는 플랫폼입니다.", "motivation": "초벌집(super-honeycomb) 구조의 기하학적 형상과 Rashba 스핀-궤도 결합이 보텍스 격자의 양자적 거동 및 임계 전류에 미치는 영향을 규명하고자 합니다.", "result": "초벌집 배열에서 보텍스 배치에 따른 임계 전류 최소치를 발견했으며, 이는 격자 구조와 접합 간의 장거리 혼성(long-range hybridization)에 기인함을 보였습니다.", "implication": "기하학적 설계(초벌집 배열)를 통해 초전도 소자의 임계 전류와 위상적 성질을 제어할 수 있음을 입증했습니다.", "novelty": "초벌집 격자라는 특수한 기하구조에서 보텍스 격자의 안정성과 Rashba 효과를 결합한 새로운 물리 현상을 관측함.", "unresolved": "이러한 현상이 Majorana 모드의 결맞음에 구체적으로 어떤 기여를 하는지에 대한 명확한 양자 정보적 해석.", "future_work": "더 낮은 온도에서의 위상적 상태 확인 및 보텍스 격자 전이에 대한 추가적인 전기적 수송 특성 연구.", "concepts": [{"term": "Andreev Bound State", "why_emerged": "초전도체와 금속 접합부에서 전하 캐리어가 반사될 때 생기는 국소적 결합 상태 연구.", "origin": "Andreev (1964).", "connections": "Majorana bound state, 초전도 근접 효과."}, {"term": "Rashba SOC", "why_emerged": "비대칭적 포텐셜 환경에서 스핀과 운동량의 결합을 설명하기 위해.", "origin": "Rashba (1960).", "connections": "위상 절연체, 스핀 홀 효과."}], "english_summary": ["Studied superconductor-semiconductor Josephson junction arrays on super-honeycomb lattices.", "Observed distinct critical current minima at unit filling factor under in-plane magnetic fields.", "The phenomenon arises from the interplay of Rashba SOC and vortex lattice geometry.", "Highlights the role of inter-junction hybridization in quantum transport within controlled geometries."]}}, {"title": "Optical Properties of Iron-Selenide Na0.27K0.27Rb0.27Fe1.7Se2 Single Crystals (Journal of Superconductivity and Novel Magnetism)", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2607.18876", "authors": "Andrei Muratov, Yevgeny Rakhmanov, Andrei Shilov, Igor Morozov, Yurii Aleshchenko", "last_authors": "Igor Morozov, Yurii Aleshchenko", "summary": "With infrared Fourier-transform spectroscopy and spectroscopic ellipsometry we investigated the in-plane reflectance of the superconducting Na$_{0.27}$K$_{0.27}$Rb$_{0.27}$Fe$_{1.7}$Se$_2$ single crystals with a critical temperature $T_c\\approx 34.3$ K over a broad frequency range at temperatures of 4--300 K. The normal-state response of Na$_{0.27}$K$_{0.27}$Rb$_{0.27}$Fe$_{1.7}$Se$_2$ is analyzed by a Drude-Lorentz model with one Drude component. The temperature dependences of the plasma frequency, optical conductivity, scattering rate, and dc resistivity of the Drude component in the normal state are presented. We report a Fano-shaped mode at 1430~cm$^{-1}$ indicating a coupling of the discrete mode presumably related to some electronic transition to a two-magnon continuum as well as a low-frequency broad band assigned to the acoustic magnon branch of the antiferromagnetic superstructure. These features persist in the reflectance in both Gemini", "link": "https://arxiv.org/abs/2607.18925", "authors": "Fuad Safarov, Dunya Babanly, Jerome Robert, et al.", "last_authors": "Martin Bowen, Bohdan Kundys", "summary": "As a sister compound of the antiferromagnetic topological insulator MnBi2Te4, MnSb2Te4 is also a candidate for exotic magnetic topological phases. On the other hand, the structurally analogous but nonmagnetic phase-change material GeSb2Te4 is also known to exhibit nontrivial band topology. Motivated by their shared crystal structure, the similar ionic radii of Mn2+ and Ge2+, and the opportunity to explore the interplay between magnetism and topology, here we investigate the effects of Ge substitution at Mn sites in MnSb2Te4. The Mn1-xGexSb2Te4 solid solutions were synthesized via high-temperature solid-state reaction and characterized for composition, structure, phase behavior, and magnetism using SEM-EDS, PXRD, DTA, and SQUID. Ge substitution was successful across the full composition range, producing homogeneous, single-phase samples that melt via peritectic reactions, as confirmed by the MnSb2Te4GeS-b2Te4 phase diagram. Ge substitution strengthens the sample's paramagnetism, but with ferrimagnetic ordering up to x = 0.75, with both effective moment and saturation magnetization decreasing with increasing Ge content. Two distinct magnetic transitions - high-temperature paramagnetic to ferrimagnetic and low-temperature ferrimagnetic to ferromagnetic - were identified, with a dome-like shape dependence of the low-temperature magnetic transition on Ge substitution. A negative magnetization was observed in the pristine MnSb2Te4 and x = 0.12 substituted samples, while two distinct spin-flop transitions appeared in the samples with x = 0.32 and x = 0.55 Ge substitutions as a result of competing magnetic orderings. These findings facilitate future selective single-crystal growth of homogeneous, magnetic phases, paving the way for magneto-transport and topological surface states investigations.", "t
