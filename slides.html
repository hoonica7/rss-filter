<title>Daily Paper Slideshow</title>
<style>
  :root {
    color-scheme: light;
    --bg: #f6f7f4;
    --paper: #ffffff;
    --ink: #111827;
    --muted: #64748b;
    --line: #d8ddd2;
    --accent: #176b87;
    --accent-2: #9a3412;
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; overflow: auto; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: var(--bg); color: var(--ink); }
  .shell { max-width: 1500px; min-height: 100vh; margin: 0 auto; padding: 14px 18px; display: flex; flex-direction: column; }
  .topbar { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 16px; }
  .top-actions { display: flex; align-items: center; gap: 10px; }
  .topbar a, button { border: 1px solid var(--line); border-radius: 8px; background: var(--paper); color: var(--ink); padding: 10px 14px; font-weight: 700; text-decoration: none; cursor: pointer; }
  button.primary { background: var(--accent); border-color: var(--accent); color: white; }
  button:disabled { opacity: 0.45; cursor: not-allowed; }
  .counter { color: var(--muted); font-weight: 700; }
  .slide { min-height: calc(100vh - 82px); background: var(--paper); border: 1px solid var(--line); border-radius: 10px; padding: 18px; box-shadow: 0 18px 42px rgba(15, 23, 42, 0.10); display: grid; grid-template-columns: minmax(310px, 0.86fr) minmax(0, 1.55fr); gap: 18px; overflow: visible; }
  .paper-head { min-width: 0; min-height: 0; overflow: visible; display: flex; flex-direction: column; gap: 12px; }
  .figure { margin: 0; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: #f8fafc; }
  .figure img { display: block; width: 100%; max-height: 41vh; object-fit: contain; background: white; }
  .figure figcaption { padding: 7px 10px; color: var(--muted); font-size: 12px; line-height: 1.3; }
  .head-text { display: flex; flex-direction: column; gap: 9px; min-width: 0; }
  .badges { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .badge { border-radius: 999px; padding: 5px 9px; background: #eef2ff; color: #3730a3; font-size: 12px; font-weight: 800; }
  .score { background: #fee2e2; color: #991b1b; }
  h1 { margin: 0; font-size: 25px; line-height: 1.15; letter-spacing: 0; overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
  h1 a { color: inherit; text-decoration-color: rgba(23, 107, 135, 0.35); text-decoration-thickness: 2px; text-underline-offset: 4px; }
  h1 a:hover { color: var(--accent); text-decoration-color: var(--accent); }
  .meta, .authors, .why, .abstract { font-size: 13px; line-height: 1.45; }
  .meta, .authors { color: var(--muted); }
  .why strong, .abstract strong, .authors strong { color: var(--ink); }
  .authors { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .why { border-left: 4px solid var(--accent-2); padding-left: 10px; color: #374151; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .abstract { border-top: 1px solid var(--line); padding-top: 14px; color: #374151; }
  .original-abstract { border-top: 1px solid var(--line); padding-top: 10px; color: #374151; font-size: 11.5px; line-height: 1.35; overflow-wrap: anywhere; }
  .original-abstract strong { display: block; margin-bottom: 4px; color: var(--ink); }
  .tags { display: flex; flex-wrap: wrap; gap: 8px; }
  .tag { border-radius: 999px; padding: 4px 8px; background: #f1f5f9; color: #475569; font-size: 12px; font-weight: 700; }
  .head-text > .link { display: none; }
  .briefing { min-width: 0; min-height: 0; overflow: visible; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); grid-auto-rows: minmax(0, auto); align-content: start; gap: 11px 18px; border-top: 0; padding-top: 0; }
  .brief-section { min-width: 0; }
  .brief-section.wide { grid-column: 1 / -1; }
  .brief-section h2 { margin: 0 0 4px; font-size: 14px; line-height: 1.22; color: #0f766e; letter-spacing: 0; }
  .brief-section p, .brief-section li { margin: 0; font-size: 12.5px; line-height: 1.42; color: #1f2937; overflow-wrap: anywhere; }
  .brief-section ul { margin: 0; padding-left: 20px; }
  .concepts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 9px 14px; }
  .concept { border-top: 1px solid var(--line); padding-top: 7px; }
  .concept h3 { margin: 0 0 4px; font-size: 13px; color: #7c2d12; letter-spacing: 0; }
  .concept p { margin: 2px 0 0; font-size: 11.5px; line-height: 1.35; color: #374151; overflow-wrap: anywhere; }
  .concept b { color: #111827; }
  .link { color: var(--accent); font-weight: 800; text-decoration: none; }
  .empty { padding: 48px; background: var(--paper); border: 1px solid var(--line); border-radius: 12px; color: var(--muted); }
  @media (max-width: 860px) {
    .shell { padding: 14px; }
    .topbar, .top-actions { align-items: stretch; flex-direction: column; }
    .slide, .briefing, .concepts { grid-template-columns: 1fr; }
    .slide { min-height: auto; overflow: visible; display: grid; }
    h1 { font-size: 28px; }
  }
</style>

const slides = [{"title": "Nonreciprocal impurity scattering as a probe for pairing symmetries in kagome superconductors", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/6d8l-gzdq", "authors": "Hong-Min Jiang, Hao Du, Shun-Li Yu", "last_authors": "Hao Du, Shun-Li Yu", "summary": "The superconducting (SC) pairing symmetry and its link to time-reversal symmetry breaking (TRSB) in the vanadium-based kagome superconductors remain unresolved, with ambiguities stemming from sublattice interference and charge-density-wave (CDW) entanglement with superconductivity. Using two represe…", "tier": "A_MUST_READ", "score": "10", "reason": "Direct theoretical probe for TRSB pairing in the user's primary kagome superconductor systems.", "tags": ["theory", "kagome", "superconductivity"], "image": "", "briefing": {"background": "바나듐 기반 카고메 초전도체(AV3Sb5)에서 초전도 대칭성과 시간 반전 대칭 깨짐(TRSB)의 관계를 규명하는 것은 응집물질물리학의 주요 난제입니다. CDW와 초전도성의 복잡한 얽힘으로 인해 실험적 증거 확보가 어렵습니다.", "motivation": "비가역적(nonreciprocal) 불순물 산란을 이용해 카고메 초전도체의 페어링 대칭성을 식별하고, TRSB 여부를 판별할 수 있는 이론적 지표를 제시하고자 함.", "result": "특정 불순물 산란 효과가 초전도 페어링의 위상과 대칭성에 따라 다르게 나타남을 수식으로 유도함.", "implication": "이 이론적 지표를 이용하면 향후 STM 등을 통한 불순물 준위 측정 실험에서 초전도 페어링의 성질을 더 명확하게 역추적할 수 있음.", "novelty": "카고메 격자에서 고유의 격자 구조와 밴드 구조(sublattice interference)를 고려하여 TRSB 여부를 판별하는 새로운 관측 가능량을 제안함.", "unresolved": "실제 실험 데이터와의 직접적인 정량적 비교가 부족하며, 불순물의 종류와 농도에 따른 산란 효과의 민감도 검증이 필요함.", "future_work": "실제 AV3Sb5 화합물에서 불순물 도핑 실험을 통한 산란 스펙트럼 분석 및 STM 측정과 결과 비교.", "concepts": [{"term": "Nonreciprocal scattering", "why_emerged": "계의 대칭성이 깨졌을 때 입자의 산란 확률이 방향에 따라 달라지는 현상을 측정하기 위함.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "TRSB, 초전도 페어링 대칭성 분석."}, {"term": "Sublattice interference", "why_emerged": "카고메 격자와 같은 복잡한 단위세포를 가진 시스템에서 전자 상태의 위상적 간섭을 이해하기 위해.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "AV3Sb5의 밴드 구조, Flat band, van Hove singularity."}], "english_summary": ["Addresses the elusive pairing symmetry and TRSB in kagome superconductors.", "Proposes nonreciprocal impurity scattering as a diagnostic tool for SC order parameters.", "Leverages sublattice interference inherent in kagome lattice geometry.", "Provides a theoretical framework for interpreting future STM/STS impurity studies."]}}, {"title": "Quantum-Geometric Amplification of Nonperturbative Interaction Scales", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2609.34607", "authors": "Stefano Bilamour, Ren\\'e Meyer, Johanna Erdmenger, Domenico Di Sante", "last_authors": "Johanna Erdmenger, Domenico Di Sante", "summary": "Weak interactions at a two-dimensional quadratic band touching (QBT) can generate an exponentially small symmetry-breaking gap, $m\\sim e^{-A/V_1}$, that cannot be captured by every finite order of perturbation theory. We show that the singular quantum geometry of the gapped QBT converts this beyond-all-orders scale into an algebraically enhanced response. The quantum metric develops a momentum-space hot spot whose Brillouin-zone integral diverges logarithmically, and therefore grows algebraically when the gap is dynamically generated by interactions. Through the inverse-frequency Souza--Wilkens--Martin optical sum rule, the same amplification appears in the negative-first longitudinal optical moment, even though the ordinary optical conductivity remains $O(e^2/\\hbar)$ and its absorption threshold is exponentially small. We establish these results analytically for a massive QBT and verify them microscopically in an interacting kagome lattice model known to develop a spontaneous quantum anomalous Hall mass at its QBT from loop currents order. Our results identify quantum geometry as an asymptotic amplifier of nonperturbative interaction scales.", "tier": "A_MUST_READ", "score": "10", "reason": "Directly addresses kagome lattices, loop currents, and anomalous Hall effect in the context of electronic structure.", "tags": ["theory", "kagome", "loopcurrent", "anomalousHall"], "image": "https://arxiv.org/html/2609.34607v1/fig1.png", "briefing": {"background": "2차원 양자 밴드 접합(QBT) 시스템에서 상호작용은 비섭동적(nonperturbative)으로 작은 대칭성 깨짐 갭을 생성할 수 있습니다. 이러한 미세한 효과는 통상적인 섭동 이론으로는 포착이 어렵습니다.", "motivation": "카고메 격자에서 루프 전류(loop currents)에 의해 유도되는 양자 이상 홀 효과와 같은 물리 현상이 어떻게 양자 기하학적 특성에 의해 증폭되는지 분석하고자 함.", "result": "양자 계량(quantum metric)의 Brillouin zone 적분이 발산하는 성질을 이용하여, 미세한 상호작용으로 생성된 갭이 거시적인 물리량(광학적 합 규칙)에서 대수적으로 증폭됨을 증명.", "implication": "양자 기하학이 비섭동적 상호작용의 증폭기 역할을 하여, 미세한 위상적 질서가 실제 실험 가능한 스케일의 물리적 반응으로 나타날 수 있음을 시사함.", "novelty": "비섭동적 스케일을 algebraically enhanced response로 연결하여 카고메 격자의 루프 전류 모델에 적용한 점이 핵심.", "unresolved": "이러한 증폭 기작이 실제 카고메 금속의 밴드 구조에서 얼마나 지배적인지에 대한 정량적 추정은 추가 연구가 필요함.", "future_work": "광학 전도도 측정 및 다양한 카고메 위상물질에서의 비섭동적 질서 검증.", "concepts": [{"term": "Quantum metric", "why_emerged": "파동함수의 중첩 구조를 계량화하여 물리적 반응을 설명하기 위해.", "origin": "Berry(1980년대 초반)의 기하학적 위상 개념에서 확장.", "connections": "Berry 곡률, 양자 이상 홀 효과, 광학적 반응."}, {"term": "QBT (Quadratic Band Touching)", "why_emerged": "밴드가 포물선 형태로 접하는 지점에서 발생하는 강한 상관관계 및 비자명한 물리 현상을 다루기 위해.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "토폴로지, 상호작용 유도 갭 형성, 카고메 격자."}], "english_summary": ["Explains how quantum geometry amplifies nonperturbative interaction scales in QBT systems.", "Identifies the logarithmic divergence of the quantum metric as an asymptotic amplifier.", "Applies this to loop-current-driven quantum anomalous Hall states in kagome lattices.", "Connects microscopic interaction scales to observable optical responses."]}}, {"title": "Unexpected stabilization of a single-q charge density wave in pristine 1T-TiSe2", "journal": "Nature_Communications", "source": "author whitelist", "link": "https://www.nature.com/articles/s41467-026-78072-0", "authors": "Kimoon Higashihira Han, Dongju Hwang, Dongsin Kim, et al.", "last_authors": "Gil Young Cho, Yeongkwan Kim", "summary": "The authors show that the subcomponents of the charge density wave in 1T-TiSe₂ are unequal and set in one by one, beginning with an unexpected unidirectional state.", "tier": "A_MUST_READ", "score": "9", "reason": "author whitelist: Chris Jozwiak", "tags": ["chargedensitywave"], "image": "https://pubads.g.doubleclick.net/gampad/ad?iu=/285/nature_communications/article&sz=728x90&c=-227639227&t=pos%3Dtop%26type%3Darticle%26artid%3Ds41467-026-78072-0%26doi%3D10.1038/s41467-026-78072-0%26subjmeta%3D1003,119,2795,639,766,995%26kwrd%3DElectronic+properties+and+materials,Phase+transitions+and+critical+phenomena,Superconducting+properties+and+materials", "briefing": {"background": "1T-TiSe2는 CDW 상태와 그 기원에 대해 오랜 논란이 있어온 대표적인 물질입니다. 기존에는 모든 대칭적 하위 성분이 동시에 CDW를 형성하는 것으로 이해되었습니다.", "motivation": "1T-TiSe2의 CDW 형성이 왜 동시적이지 않고 단계적으로 발생하는지에 대한 미시적 메커니즘을 밝히고자 함.", "result": "CDW의 하위 성분들이 불균등하게 설정되며, 예상치 못한 단방향(unidirectional) 상태로 시작하여 고차적인 CDW로 전이됨을 발견.", "implication": "TiSe2의 전이 과정을 재해석해야 하며, CDW 형성의 동역학적 측면에서 대칭성 깨짐의 순서를 이해하는 것이 중요함을 시사함.", "novelty": "CDW 형성의 단계적 특성(sequential onset)을 보고하여 기존의 등방적 전이 모델에 의문을 제기함.", "unresolved": "왜 특정 온도에서 단방향 성분이 우선적으로 선택되는지에 대한 상세 원인은 명확하지 않음.", "future_work": "시간 분해 광전자 분광법(tr-ARPES)을 통한 CDW 형성 동역학의 실시간 추적.", "concepts": [{"term": "Charge Density Wave (CDW)", "why_emerged": "전자 밀도의 주기적인 변조가 격자 왜곡과 결합하여 나타나는 상태를 설명하기 위해.", "origin": "Peierls(1955).", "connections": "페르미 면 중첩, 격자 불안정성, 초전도성과의 경쟁."}, {"term": "Single-q CDW", "why_emerged": "전체 페르미 면을 동시에 열지 않고 부분적으로 대칭성을 깨는 상태를 기술하기 위해.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "네마틱성(Nematicity), 다단계 전이."}], "english_summary": ["Reports unexpected sequential formation of CDW subcomponents in 1T-TiSe2.", "Demonstrates the emergence of a unidirectional CDW state prior to full ordering.", "Challenges the traditional view of simultaneous transitions in CDW systems.", "Provides new insights into the microscopic pathways of symmetry breaking."]}}, {"title": "Triple-well ferroelectricity and a kagomelike Chern flat band in two-dimensional multiferroic CuVP2Se6", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/jkkw-5bzw", "authors": "Brian Anchico, Jingyi Duan, Haojie Sun, Minjun Wang, Mikhail Talanov, Wei Jiang", "last_authors": "Mikhail Talanov, Wei Jiang", "summary": "Two-dimensional multiferroics that host nontrivial topological bands offer a rich platform for correlated and tunable quantum phenomena, yet such materials remain rare. Here, using first-principles calculations, we reveal that monolayer ${\\mathrm{CuVP}}_{2}{\\mathrm{Se}}_{6}$ unites a tunable triple-…", "tier": "A_MUST_READ", "score": "9", "reason": "Prediction of kagome-like Chern flat bands in a 2D material, highly relevant to ARPES.", "tags": ["theory", "kagome", "topological"], "image": "", "briefing": {"background": "2차원 다강체(multiferroics)는 자기적 성질과 전기적 성질이 결합된 물질로, 양자 정보 소자나 비휘발성 메모리 구현의 핵심 소재입니다. 최근에는 여기에 위상적 비자명(topological nontrivial) 특성이 더해진 물질들이 강상관 전자계 연구의 주류가 되고 있습니다.", "motivation": "기존 2차원 물질에서 다강성 특성과 위상적 밴드 구조(특히 평탄 밴드)가 동시에 존재하는 경우는 매우 드뭅니다. 연구진은 CuVP2Se6 단층 구조에서 이러한 특성을 찾고자 했습니다.", "result": "제1원리 계산을 통해 CuVP2Se6 단층이 3중 우물 퍼텐셜(triple-well)을 가지는 강유전성을 보이며, 동시에 카고메 격자 형태의 Chern 평탄 밴드(flat band)를 가진다는 점을 규명했습니다.", "implication": "위상적 평탄 밴드와 강유전성이 공존함으로써, 외부 전기장으로 평탄 밴드의 위상적 특성을 제어하거나 자기적/전기적 질서를 통한 양자 상태 제어가 가능함을 시사합니다.", "novelty": "카고메 격자에서 발생하는 평탄 밴드 물성을 2차원 다강체 플랫폼에서 실현했다는 점이 독보적입니다. 독자가 관심 있는 AV3Sb5 계열의 카고메 물성과 연결하여 위상적 상관 물성 연구의 새로운 모델 시스템이 될 수 있습니다.", "unresolved": "이론적인 제1원리 계산 결과로, 실제 박리(exfoliation) 혹은 합성 후의 실험적 검증(ARPES를 통한 밴드 확인 등)은 남아있는 숙제입니다.", "future_work": "실제 단층 시편 제작 및 ARPES를 통한 평탄 밴드 관측, 전기장을 이용한 위상 상전이 유도 실험 등이 후속될 것으로 보입니다.", "concepts": [{"term": "Chern Flat Band", "why_emerged": "강한 전자 상관관계에 의한 분수 양자 홀 효과 등을 유도하기 위해 매우 좁은 에너지 폭(평탄함)과 비자명한 위상 불변량을 동시에 갖는 밴드가 필요했기 때문입니다.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "카고메 격자 내의 위상적 물성, 모아레 격자 시스템(twisted bilayer graphene) 등."}, {"term": "Multiferroics", "why_emerged": "자기장과 전기장을 동시에 결합하여 제어 가능한 차세대 정보 저장 장치 개발을 위해 제안되었습니다.", "origin": "H. Schmid (1994)", "connections": "강유전성, 강자성, 자기전기 효과(Magnetoelectric effect)."}], "english_summary": ["Prediction of CuVP2Se6 as a 2D multiferroic material.", "Identifies a kagome-like Chern flat band structure via first-principles calculation.", "Combines tunable ferroelectricity with non-trivial band topology.", "Offers a new platform for potential correlated quantum phenomena."]}}, {"title": "Magnetic-Field-Induced Tomonaga-Luttinger Liquid and Bose-Einstein Condensate Phases in an Organic S=1 Haldane Chain", "journal": "PRL_Recent", "source": "keyword", "link": "http://link.aps.org/doi/10.1103/89k5-p261", "authors": "Ivan Jakovac, Mihael S. Grbić, Maxime Dupont, et al.", "last_authors": "Masashi Takigawa, Mladen Horvatić", "summary": "Researchers have gained access to the rich physics of a landmark model magnet by assembling a crystal out of organic magnetic molecules.", "tier": "A_MUST_READ", "score": "9", "reason": "title strong match: Luttinger liquid", "tags": ["Luttinger"], "image": "", "briefing": {"background": "S=1 Haldane 사슬은 양자 스핀 사슬 모델의 표준으로, 정수 스핀이 가지는 에너지 갭과 위상적 질서를 연구하는 중요한 플랫폼입니다. 저차원 양자 자성체에서 외부 자기장을 가하면 스핀 들뜸(magnon)이 응축되는 보스-아인슈타인 응축(BEC) 현상이 나타납니다.", "motivation": "유기 분자 기반의 자성체 합성을 통해 실험적으로 구현하기 힘든 1차원 양자 모델의 물성을 정밀하게 제어하고 관측하고자 했습니다.", "result": "유기 자성 분자로 조립된 시스템에서 외부 자기장을 통해 Tomonaga-Luttinger 액체 상태와 BEC 상전이를 관측했습니다.", "implication": "잘 정의된 유기 자성 사슬을 이용하여 1차원 강상관 전자계의 보편적 물성을 실험실에서 정밀하게 구현하고 테스트할 수 있음을 입증했습니다.", "novelty": "무기물에 비해 합성 자유도가 높은 유기 분자를 사용하여 전형적인 1차원 양자 모델인 Haldane 사슬을 성공적으로 재현하고 물리 현상을 증명했습니다.", "unresolved": "유기 자성체의 분자 간 상호작용의 이방성이 실제 이론적 모델과 미세하게 일치하지 않을 수 있는 정량적 오차가 존재할 수 있습니다.", "future_work": "다른 스핀 사슬 구조로의 확장 및 고자기장 하에서의 정밀 스핀 동역학 측정.", "concepts": [{"term": "Tomonaga-Luttinger Liquid", "why_emerged": "저차원 시스템에서 전자가 더 이상 페르미 액체처럼 행동하지 않고 스핀과 전하의 자유도가 분리되는 현상을 기술하기 위해 도입되었습니다.", "origin": "Tomonaga (1950), Luttinger (1963)", "connections": "스핀-전하 분리, 1차원 전도체, 위그너 결정."}, {"term": "Haldane Chain", "why_emerged": "정수 스핀과 반정수 스핀 사슬의 물성이 근본적으로 다름을 설명하기 위해 제안되었습니다.", "origin": "F. D. M. Haldane (1983)", "connections": "위상적 양자물성, 스핀 갭, AKLT 모델."}], "english_summary": ["Exploration of quantum physics in organic S=1 Haldane chain magnets.", "Observations of field-induced Tomonaga-Luttinger liquid and BEC phases.", "Demonstrates organic materials as a clean platform for 1D quantum models.", "Confirms theoretical predictions for spin-gap systems in 1D."]}}, {"title": "Tracking flat bands via phonon-mediated interband scattering", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2508.16491", "authors": "Fabian Garmroudi, Jennifer Coulter, Illia Serhiienko, et al.", "last_authors": "Andrej Pustogow, Priscila F. S. Rosa", "summary": "Flat-band (FB) systems offer a fertile platform for realizing exotic correlated and topological phases, yet central challenges remain in tuning FBs towards the Fermi level $E_\\text{F}$ and in understanding their impact on electronic transport. Identifying how close a FB lies to $E_\\text{F}$ normally requires advanced spectroscopic probes or extensive doping studies hindering fast screening of promising candidates. Here, we show that standard electrical resistivity measurements already contain a clear and universal fingerprint of the proximity of a FB to $E_\\text{F}$: A characteristic curvature in the temperature-dependent resistivity at high temperatures, i.e., sublinear (superlinear) behavior when EF lies within (away from) the FB states. Within a phenomenological model, we can attribute this response to the rapid change in scattering phase space associated with interband transitions from dispersive to FB states. Notably, this characteristic emerges independently of microscopic details, such as the electron-phonon coupling strength, as confirmed by comparison with ab initio electron-phonon transport calculations. We validate this mechanism across several FB materials$-$including kagome, pyrochlore and Cu$_3$Au-type intermetallics$-$by combining high-temperature resistivity m ost more bound states than its trivial counterpart, even if they share the same electronic dispersion. We apply our theory to monolayer $1H$-NbSe$_2$ and find that the geometric texture of its single superconducting band enforces three symmetry-distinct YSR channels for a magnetic point impurity at Nb or Se sites. Our work opens a route to probing normal-state wavefunction geometry through local YSR spectroscopy.", "tier": "B_IMPORTANT_CONDMAT", "score": "10", "reason": "Directly links quantum geometry to YSR states in NbSe2, highly relevant to ARPES/superconductivity studies.; demoted from A: broad CM, not direct user/project hit", "tags": ["superconduct", "NbSe2", "quantumgeometry"], "image": "https://arxiv.org/html/2609.31920v1/flat_band.png", "briefing": {"background": "초전도체 내 자기 불순물에 의해 유도되는 유-시바-루시노프(YSR) 상태는 초전도 갭 내부의 국소 상태를 연구하는 표준적인 방법입니다. 최근에는 전자 상태의 파동함수 기하학(Quantum Geometry)이 물성에 미치는 영향에 관심이 쏠리고 있습니다.", "motivation": "단순한 분산 관계를 넘어, 일반 상태(Normal-state)의 양자 기하학적 정보가 YSR 바운드 상태의 형성 과정에 어떻게 기여하는지 밝히고자 합니다.", "result": "Bloch 밴드 투영 연산자의 행렬 계수와 고유값이 YSR 상태의 수와 대칭성을 결정함을 수학적으로 증명했습니다. 1H-NbSe2 모델에서 실질적인 적용 사례를 제시했습니다.", "implication": "YSR 분광학을 단순한 불순물 탐색 도구를 넘어, 물질의 '양자 기하학적 텍스처'를 프로빙하는 정밀 도구로 활용할 수 있음을 시사합니다.", "novelty": "YSR 상태를 순수하게 기하학적 관점에서 재해석하여, NbSe2와 같은 2D 초전도체의 국소 전자 구조 이해에 새로운 시각을 제공합니다.", "unresolved": "실험적으로 서로 다른 대칭성을 가진 YSR 채널을 완전히 분리하여 관측하는 것은 고해상도 STS 기술의 높은 정밀도를 요구합니다.", "future_work": "다양한 위상 초전도체 후보 물질들에 본 이론을 적용하여 YSR 상태의 비정상적 분할 여부를 실험적으로 확인하는 작업이 기대됩니다.", "concepts": [{"term": "양자 기하학 (Quantum Geometry)", "why_emerged": "밴드 구조의 에너지 분산만으로는 설명되지 않는 파동함수의 위상적/기하학적 성질을 기술하기 위해 도입됨.", "origin": "Resta, Provost, Vallee 등에 의해 발전.", "connections": "Berry 곡률, 퀀텀 메트릭(Quantum Metric)."}, {"term": "YSR 상태 (Yu-Shiba-Rusinov states)", "why_emerged": "초전도체 내 자기 불순물이 만드는 국소적 전자 상태를 설명하기 위해 제안됨.", "origin": "Yu (1965), Shiba (1968), Rusinov (1969).", "connections": "마요라나 바운드 상태(Majorana Bound States), 불순물 유도 초전도."}], "english_summary": ["Establishes a 의 불균일성이 단순한 결함이 아니라 근본적인 경쟁 질서 변수들에 의한 것임을 확인하는 강력한 도구를 제시합니다.", "novelty": "STS를 통한 조셉슨 전류 측정으로 초전도체 내의 질서 변수 공간 구조를 직접 해석할 수 있는 이론적 근거를 마련하여, Kagome 금속 등에서 관측되는 초전도체-질서 변수 간 경쟁 연구에 중요한 방법론적 토대를 제공합니다.", "unresolved": "실제 실험 데이터에서 발생하는 노이즈와 다양한 질서 변수들이 뒤섞여 있을 경우의 신호 분리 문제가 남아 있습니다.", "future_work": "실제 Kagome 금속 AV3Sb5 화합물 등에 본 이론을 적용한 저온 STS 실험을 수행하여 국소적인 질서 변수 구조를 직접 매핑하는 후속 연구가 기대됩니다.", "concepts": [{"term": "Josephson STS", "why_emerged": "일반 STS보다 초전도 질서 변수의 위상과 진폭에 직접적으로 민감하기 때문에 필요함.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "초전도체-절연체-초전도체 접합 이론, 근접 효과 연구와 연결됨."}, {"term": "PDW (Pair Density Wave)", "why_emerged": "초전도 질서 변수가 공간적으로 진동하는 상을 설명하기 위해 도입됨.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "고온 초전도체, CDW와 초전도의 경쟁/공존 연구와 긴밀히 연관됨."}], "english_summary": ["The paper demonstrates that spatial oscillations in superconducting coherence peaks measured by STS can signify the presence of PDW, CDW, or SDW phases.", "Josephson STS is proposed as a precise tool to image these spatial order parameter variations.", "The findings provide a unified framework to interpret experimental STS data in cuprates, TMDs, and heavy-fermion superconductors."]}}, {"title": "Protection of Unconventional Superconductivity from Disorder", "journal": "PRL_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/3cn5-hb8z", "authors": "Sofie Castro Holbæk, Morten H. Christensen, Andreas Kreisel, and Brian M. Andersen", "last_authors": "Sofie Castro Holbæk, Morten H. Christensen, Andreas Kreisel, and Brian M. Andersen", "summary": "Several realizations of d -wave superconductivity on the Lieb and kagome lattices exhibit remarkably weak T c -suppression, resembling the behavior of conventional s-wave superconductors.", "tier": "B_IMPORTANT_CONDMAT", "score": "9", "reason": "Unconventional superconductivity on kagome lattices, direct user interest.", "tags": ["kagome", "unconventionalsuperconductivity", "disorder", "theory"], "image": "", "briefing": {"background": "일반적으로 비전통적 초전도체는 불순물에 의한 산란에 매우 취약하여 전이 온도(Tc)가 급격히 하락하는 경향이 있는데, 이는 쿠퍼 쌍의 위상적 성질과 밀접합니다.", "motivation": "특정 격자 구조(Lieb, Kagome)에서 d-파 초전도성이 왜 불순물에 의한 Tc 억제로부터 예외적으로 강력하게 보호되는지를 이론적으로 규명하고자 합니다.", "result": "Kagome 및 Lieb 격자에서 나타나는 특정 전자 구조가 불순물 존재 하에서도 초전도성을 유지할 수 있는 기하학적 보호 기제를 가짐을 확인했습니다.", "implication": "불순물 투입이 흔한 실제 물질 합성 환경에서도 비전통적 초전도성을 구현하고 제어하는 데 있어 격자 구조 공학의 중요성을 시사합니다.", "novelty": "Kagome 금속 AV3Sb5 계열의 초전도 연구에서 불순물 내성 문제는 매우 중요한 주제이며, 이 논문은 물질 고유의 기하학적 위상이 초전도 강건성에 기여함을 밝혔다는 점에서 독창적입니다.", "unresolved": "불순물의 농도 변화가 전이 온도 이외에 비열이나 다른 물성에 미치는 정량적 예측이 더 정교화되어야 합니다.", "future_work": "Kagome 금속에 의도적인 화학적 치환(도핑)을 가한 뒤 ARPES와 transport 측정을 통해 불순물 내성을 검증하는 연구가 필요합니다.", "concepts": [{"term": "Kagome lattice", "why_emerged": "평탄 밴드와 반-결합 상태의 독특한 전자 구조를 연구하기 위해 도입됨.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "위상 절연체, 비전통적 초전도성, 베리 곡률 연구와 연결됨."}, {"term": "Unconventional Superconductivity", "why_emerged": "BCS 이론으로 설명되지 않는 고온 초전도 현상의 본질을 이해하기 위해 필요함.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "쿠퍼 쌍의 대칭성, 강상관 전자계, 비-Fermi 액체 상태와 연결됨."}], "english_summary": ["This study examines why d-wave superconductivity on Kagome and Lieb lattices shows unusual robustness against disorder.", "The authors find that specific lattice geometries mitigate Tc-suppression, mimicking conventional s-wave behavior.", "This theoretical insight highlights the role of geometry in protecting unconventional superconducting states."]}}, {"title": "A universal low-temperature fluctuation of unconventional superconductivity revealed: Smoking gun favors Galilean bosonic superfluidity", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2402.08730", "authors": "Jie Wang, Ruoshi Jiang, Anthony Hegg, et al.", "last_authors": "Yucel Yildirim, Wei Ku", "summary": "Low-temperature thermal fluctuations offer an essential window in characterizing the true nature of a quantum state of matter, a quintessential example being Fermi liquid theory. In the long-standing pursuit toward a fundamental understanding of unconventional superconductivity, the most essential low-temperature thermal fluctuation of superfluidity has unfortunately been greatly overlooked. Here, we examine the leading thermal fluctuation of the superfluid density across numerous families ranging from relatively conventional to highly unconventional superconductors (MgB$_2$, bismuthates, doped buckyballs, heavy fermions, UTe$_2$, doped SrTiO$_3$, Chevrel clusters, intermetallics, $\\kappa$-organics, transition metal dichalcogenides, ruthenates, iron-pnictides, cuprates, and kagome metals). Amazingly, in all of them an unprecedented universal $T^3$ depletion materializes in the low-temperature superfluid density, even in the believed-to-be-conventional MgB$_2$. This reveals a new quantum superfluid state of matter and requires a necessary change of paradigm in describing these modern superconductors. We demonstrate that such an unorthodox yet generic behavior can be described by a Galilean invariant theory of hydrodynamic superfluidity hosting a long-lived `true condensate'.", "tier": "B_IMPORTANT_CONDMAT", "score": "9", "reason": "Reveals universal low-temperature fluctuation in unconventional superconductors, including kagome, cuprates, heavy fermions.; demoted from A: broad CM, not direct user/project hit", "tags": ["unconventionalsuperconductivity", "kagome", "cuprates", "heavyfermion", "superfluidity", "theory"], "image": "https://arxiv.org/html/2402.08730v4/PNAS_Fit_SFD_v20.png", "briefing": {"background": "초전도체의 저온 물성을 결정짓는 열적 요동은 초전도 상태의 본질적인 메커니즘을 파악하는 지표로 사용되지만, 기존에는 이를 통일적으로 설명하는 이론이 부족했습니다.", "motivation": "다양한 초전도체들에서 공통적으로 나타나는 저온 초전도 유체 밀도의 감소(T^3 의존성)를 단일한 물리적 기제로 설명하고자 합니다.", "result": "다양한 종류의 비전통적 초전도체들이 공통적으로 T^3 의존성을 가지며, 이는 갈릴레이 불변 유체 역학(Galilean invariant hydrodynamic superfluidity)에 기반한 보손 유체 상태로 해석될 수 있음을 제시했습니다.", "implication": "기존의 전형적인 페르미 액체 기반 해석을 넘어, 초전도 상태를 '진정한 응축체(true condensate)'를 포함하는 새로운 양자 유체 상태로 재정의할 것을 제안합니다.", "novelty structing a prototype Kondo lattice model; it incorporates only the essential couplings that respect the associated tetragonal crystalline symmetries. This simplification allows us to robustly demonstrate the symmetry-enforced Kramers Weyl fermions and related topological nodal states in the spectrum of heavy quasiparticles. Furthermore, the simplification provides a tractable setting to determine the salient features in the system's nonlinear optical response, the circular photogalvanic effect, in chiral Weyl--Kondo semimetals. Both analytical and numerical calculations identify sharp peaks in the frequency domain as signatures of the Kondo-driven chiral Weyl nodes; the sharpness of the spectrum reflects the resonant nature of the underlying strongly correlated electronic excitations. Thus, cWKSM provides a unique setting to spectroscopically identify topological fermions that are induced by strong electron correlations. As such, our results are expected to bring about much needed new insights into the understanding of strongly correlated gapless topological matter.", "tier": "B_IMPORTANT_CONDMAT", "score": "9", "reason": "Direct relevance to topological semimetals and correlated electron systems in heavy fermions.", "tags": ["material", "Weyl", "correlated"], "image": "https://arxiv.org/html/2609.35602v1/bs.png", "briefing": {"background": "강상관계 전자계(strongly correlated systems)와 위상 물리학이 만나는 지점에서, 전자 간의 상호작용이 어떻게 새로운 위상적 준입자를 생성하는지 이해하는 것이 현대 응집물질물리학의 중요한 도전입니다.", "motivation": "키랄성(chirality)을 가진 결정 구조에서 곤도(Kondo) 효과가 어떻게 Weyl 준입자의 에너지 준위를 페르미 레벨 근처로 재구성하는지 모델링하고, 이를 비선형 광학 응답으로 검증하고자 합니다.", "result": "곤도 격자 모델을 통해 대칭성에 의해 강제된 Kramers Weyl 페르미온을 확인하였으며, 이 Weyl 노드가 생성하는 원형 광전류 효과(circular photogalvanic effect)의 주파수 특성을 도출하였습니다.", "implication": "강상관계 효과가 단순한 섭동이 아니라, 위상적 밴드 구조를 제어하는 근본적인 요인임을 증명하며, 비선형 광학이 위상 물질의 분광학적 도구임을 제시합니다.", "novelty": "특정 물질에 국한되지 않는 일반적인 곤도 격자 모델에서 Weyl 준입자와 correlation의 직접적인 연관성을 규명하여, 귀하의 주 관심사인 위상적 물질의 동역학적 특성을 이론적으로 뒷받침합니다.", "unresolv Gitgeatpong, et al.", "last_authors": "T. J. Sato, H. Tanaka", "summary": "High-resolution time-of-flight powder neutron diffraction and high-field magnetization were measured to investigate the magnetic structure and existence of a field-induced magnetic phase transition in the distorted kagome antiferromagnet Cs$_2$Cu$_3$SnF$_{12}$. Upon cooling from room temperature, the compound undergoes a structural phase transition at $T_\\textrm{t}=185$ K from the rhombohedral space group $R\\bar{3}m$ with the perfect kagome spin network to the monoclinic space group $P2_1/n$ with the distorted kagome planes. The distortion results in three inequivalent exchange interactions among the $S=1/2$ Cu$^{2+}$ spins that magnetically order below $T_\\textrm{N}=20.2$ K. Magnetization measured with a magnetic field applied within the kagome plane reveals small in-plane ferromagnetism resulting from spin canting. On the other hand, the out-of-plane magnetization does not show a clear hysteresis loop of the ferromagnetic component nor a prominent anomaly up to 170 T, with the exception of the subtle knee-like bend around 90 T, which could indicate the 1/3 magnetization plateau. The combined analysis using the irreducible representations of the magnetic space groups and magnetic structure refinement on the neutron powder diffraction data suggests that the magnetic moments order in the magnetic space group $P2_1'/n'$ with the all-in-all-out spin structure, which by symmetry allows for the in-plane canting, consistent with the in-plane ferromagnetism observed in the magnetization. Note added (2026): The magnetic structure reported here is incorrect; the two Cu$^{2+}$ sublattices were summed incoherently, not coherently. The corrected refinement gives the coplanar 120$^\\circ$ $P2_1/n$ structure with negative vector chirality and moment 0.52(2) $\\mu_\\textrm{B}$; the all-in-all-out $P2_1'/n'$ assignment is withdrawn. All other results stand. See the Erratum appended to this version.", "tier": "B_IMPORTANT_CONDMAT", "score": "9", "reason": "Direct study of magnetic structure in a kagome antiferromagnet using neutron diffraction.; demoted from A: broad CM, not direct user/project hit", "tags": ["kagome", "antiferromagnet", "neutronscattering", "magneticstructure"], "image": "https://arxiv.org/html/1905.01454v5/fig1.png", "briefing": {"background": "카고메 격자 물질은 기하학적 좌절(geometric frustration)로 인해 복잡한 자기적 질서와 위상적 전자 상태가 나타나는 중요한 연구 분야입니다. Cs2Cu3SnF12는 카고메 격자의 모형 시스템으로, 격자 왜곡이 자성 상태에 미치는 영향을 이해하기 위해 연구됩니다.", "motivation": "이 연구는 왜곡된 카고메 격자에서 나타나는 자기적 질서와 고자기장에서의 위상 전이를 실험적으로 규명하기 위해 수행되었습니다.", "result": "중성자 회절 실험 결과, 초기에는 올-인-올-아웃(all-in-all-out) 구조로 해석되었으나, 이후 정정을 통해 음의 벡터 카이랄성을 가진 공면 120도 구조임이 확인되었습니다.", "implication": "왜곡된 카고메 격자에서 스핀 구조가 어떻게 결정되는지에 대한 엄밀한 실험적 증거를 제공하며, 이론적 모델링의 수정이 필수적임을 보여줍니다.", "novelty": "카고메 반강자성체에서 격자 왜곡이 대칭성을 어떻게 낮추고 자기적 기저 상태를 결정하는지 정밀하게 분석했습니다. 특히 정정된 결론은 자기 구조 해석의 까다로움을 잘 보여줍니다.", "unresolved": "고자기장에서 나타나는 1/3 자기화 플랫폼의 정밀한 특성과 그 기원에 대해서는 여전히 추가적인 해석이 필요합니다.", "future_work": "왜곡된 카고메 시스템에서의 스핀 파동(magnon) 여기 측정 및 보다 넓은 범위의 자기장 하에서의 동역학 연구가 기대됩니다.", "concepts": [{"term": "카고메 격자", "why_emerged": "좌절된 자성 시스템에서 비자명한 위상 상태를 탐구하기 위해 필요.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "AV3Sb5 등 최근 위상 금속 연구와 직결됨."}, {"term": "벡터 카이랄성", "why_emerged": "자기 모멘트의 회전 방향과 공간적 정렬을 정의하기 위해 필요.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "비공면 자성 구조 및 위상적 홀 효과."}], "english_summary": ["Investigated the magnetic structure of distorted kagome lattice antiferromagnet Cs2Cu3SnF12.", "Initially proposed all-in-all-out order, but corrected to a coplanar 120-degree structure.", "High-field magnetization suggests a potential 1/3 plateau at 90 T.", "Provides crucial insights into symmetry-lowering effects in kagome antiferromagnets."]}}, {"title": "Revealing quantum geometry effects in magic angle twisted bilayer graphene using the circular photogalvanic effect", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2606.06389", "authors": "Eylon Persky, Leonie Parisot, Minhao He, et al.", "last_authors": "Xiaodong Xu, Aharon Kapitulnik", "summary": "Magic-angle twisted bilayer graphene (MATBG) hosts flat bands whose correlated and topological phases depend sensitively on the electronic point-group symmetry, which is set by the device configuration including twist angle, heterostrain, and substrate and cap-layer coupling. Here we report near-infrared photocurrent measurements of a MATBG device encapsulated by an hBN substrate and a WSe$_2$ cap layer, at a twist angle of 1.05{\\deg}. Using spatially resolved photocurrent imaging with polarization analysis, we disentangle the photothermoelectric response from the circular photogalvanic effect (CPGE) across all fillings of the moir\\'e flat bands. A finite CPGE at normal incidence, forbidden in high-symmetry structures, directly constrains the point-group symmetry of MATBG and reveals a Berry curvature dipole intrinsic to the MATBG flat bands, activated by the symmetry lowering from heterostrain and the asymmetric hBN/WSe$_2$ environment. Our results establish nonlinear photocurrent as an all-optical probe of symmetry and quantum geometry in proximity-engineered moir\\'e materials.", "tier": "B_IMPORTANT_CONDMAT", "score": "9", "reason": "Important experiment on moiré/twisted materials, Berry curvature, and quantum geometry.", "tags": ["material", "twistedbilayer", "Berrycurvature"], "image": "https://arxiv.org/html/2606.06389v2/Fig1.png", "briefing": {"background": "마법각 뒤틀린 이층 그래핀(MATBG)은 평탄 밴드에서 나타나는 강상관 및 위상 현상으로 인해 현대 응집물질물리학의 핵심 소재입니다. 시스템의 국소 대칭성을 파악하는 것이 물리적 상태를 이해하는 열쇠입니다.", "motivation": "MATBG 장치에서 국소적 대칭성 깨짐과 베리 곡률이 전자 수송 및 광학적 응답에 미치는 영향을 검증하고자 했습니다.", "result": "원형 광전류 효과(CPGE)를 이용하여 MATBG의 베리 곡률 쌍극자를 관찰하였으며, 이는 이질적 변형(heterostrain)과 주변 환경에 의한 대칭성 저하가 원인임을 입증했습니다.", "implication": "광학적 측정이 단순히 밴드 구조뿐만 아니라 위상 기하학적 정보까지 담고 있음을 증명하여, 비선형 광학이 차세대 위상 물질 진단 도구가 될 수 있음을 시사합니다.", "novelty": "MATBG 시스템에서 베리 곡률의 존재를 국소적인 광학 측정으로 직접 증명했다는 점이 혁신적이며, 모아레 물질의 양자 기하학 연구에 중요한 방법론을 제시합니다.", "unresolved": "다양한 채움 인자(filling factor)에 따른 베리 곡률 쌍극자의 정밀한 변화와 강상관 효과와의 상관관계는 아직 논의 중입니다.", "future_work": "다른 모아레 시스템으로의 확장 및 초고속 동역학 측정과의 결합이 예상됩니다.", "concepts": [{"term": "베리 곡률 쌍극자", "why_emerged": "반전 대칭성이 깨진 시스템에서 비선형 수송 현상을 설명하기 위해 도입.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "비선형 홀 효과, 양자 기하학."}, {"term": "원형 광전류 효과", "why_emerged": "물질의 대칭성을 광학적으로 탐지하고 위상 특성을 추출하기 위해 사용.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "광전자 분광학, 위상 절연체."}], "english_summary": ["Studied magic-angle twisted bilayer graphene (MATBG) using circular photogalvanic effect (CPGE).", "Observed a Berry curvature dipole driven by symmetry breaking from heterostrain.", "Demonstrates nonlinear photocurrent as a probe for quantum geometry.", "Highlights the role of encapsulation and strain in defining MATBG electronic states."]}}, {"title": "Temperature Dependent Evolution of the Electronic Structure in EuZn2As2 across the Neel Transition (Phys. Rev. B)", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2609.32121", "authors": "Milo Sprague, Anup Pradhan Sakhya, Barun Ghosh, et al.", "last_authors": "Arun Bansil, Madhab Neupane", "summary": "Magnetoresistive materials have been tremendously important for the development of magnetic memory storage and spintronic devices. Recently, the antiferromagnetic EuX2Pn2 compounds, with X being a transition metal and Pn being a pnictogen, have seen intensive research interest due to their unusual anomalous Hall effect behavior and pronounced resistive anomaly near the Neel temperature (TN). These magnetotransport phenomena have been interpreted in the context of shortranged ferromagnetic Structuations, magnetic polaron formation, canted spin configurations, and temperature dependent metal insulator transitions in the electronic structure. Here, we report the observation of such a pronounced resistivity anomaly in EuZn2As2 near TN = 19 K. We demonstrate th  theory, dynamical mean-field theory, and functional renormalization group analysis.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Highly relevant theory on unconventional nickelate superconductivity using DFT+DMFT, matching user's core interests.", "tags": ["material", "nickelates", "superconductivity", "DFT+DMFT"], "image": "", "briefing": {"background": "La3Ni2O7은 최근 상온 상압 초전도체 후보군으로 큰 관심을 받고 있는 이중층 니켈산염 물질입니다. 이 물질의 물리적 특성을 이해하기 위해서는 결정 구조 내의 산소 결함이 전자 상태와 초전도성에 미치는 영향을 규명하는 것이 핵심 과제입니다.", "motivation": "이 연구는 산소 과잉(δ)이 La3Ni2O7의 초전도성을 어떻게 억제하는지 DFT+DMFT 및 재규격화군(RG) 이론적 분석을 통해 밝히고자 합니다.", "result": "산소 결함이 초전도성을 억제하는 '이중 메커니즘'을 확인했습니다. 이는 전자 상관관계의 변화와 페르미 면 구조의 변형이 복합적으로 작용하여 초전도성을 방해함을 시사합니다.", "implication": "La3Ni2O7 기반 초전도체에서 최적의 초전도 상태를 얻기 위해서는 산소 화학량론(stoichiometry)을 극도로 정밀하게 제어해야 함을 보여줍니다.", "novelty": "최신 니켈산염 초전도 이론 연구에서 다루기 힘든 결함 효과를 강상관 전자계 계산 기법(DFT+DMFT)으로 분석하여 실험적 샘플 최적화에 실질적인 가이드를 제공합니다.", "unresolved": "이론적 계산 결과가 실제 실험적 샘플에서 나타나는 국소적인 격자 왜곡이나 무질서도를 완벽하게 반영했는지에 대해서는 추가적인 실험적 검증이 필요합니다.", "future_work": "실제 실험적 환경에서 산소 결함의 농도를 정밀하게 제어한 샘플을 대상으로 한 ARPES 등의 분광학적 연구를 통해 이론적 예측치를 검증해야 합니다.", "concepts": [{"term": "DFT+DMFT", "why_emerged": "밀도범함수론(DFT)만으로는 강한 전자 상관관계를 다루기 어렵고, 동적 평균장 이론(DMFT)은 이를 보완하여 강상관 전자계의 물성을 예측하기 위해 도입됨.", "origin": "DMFT는 1990년대 초 W. Metzner와 D. Vollhardt에 의해 기초가 다져졌으며, DFT와의 결합은 G. Kotliar 등에 의해 발전됨.", "connections": "Cuprates, Nickelates 등 강상관 물질 연구의 필수 도구로 사용됨."}], "english_summary": ["Analyzes the impact of oxygen defects on bilayer La3Ni2O7 nickelate superconductivity.", "Utilizes DFT+DMFT and functional renormalization group methods.", "Identifies a dual mechanism through which oxygen excess suppresses superconducting states.", "Highlights the critical importance of stoichiometry control for achieving superconductivity in nickelates."]}}, {"title": "Giant Domain Walls and Intrinsic Heterogeneity in 214 Cuprate Superconductors", "journal": "PRL_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/r62x-kt5j", "authors": "Evie Ladbrook, Jon P. Wright, Mark S. Senn", "last_authors": "Jon P. Wright, Mark S. Senn", "summary": "Structural phase transitions generate complex microstructures that often govern material functionality, yet directly resolving their three-dimensional organization in bulk samples remains challenging. Here we employ scanning three-dimensional x-ray diffraction (3DXRD) to resolve the bulk microstructure of La 1.675 Eu 0.2 Sr 0.125 CuO 4 , a prototypical 1 / 8 -doped cuprate in which structural and electronic heterogeneity is well established. We reveal remarkably broad tetragonallike domain wall regions within the nominally orthorhombic crystal structure, and, upon cooling to 100 K, a fine microstructure of orthorhombiclike stripes embedded within the tetragonal matrix that has significant consequences for interpreting the interplay between structural and electronic heterogeneity in this class of materials. More broadly, this work establishes 3DXRD as a powerful approach for resolving bulk microstructures and understanding their role in emergent functionality.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Bulk microstructural study of 214 cuprate superconductors using x-ray diffraction.", "tags": ["material", "cuprates", "superconductivity"], "image": "", "briefing": {"background": "214 Cuprate(La-214계) 초전도체는 구조적 상전이와 전자적 물성(CDW 등) 간의 상관관계가 매우 복잡하게 얽혀 있는 물질입니다. 벌크 시료의 미세 구조를 나노 수준에서 정확히 이해하는 것은 물질의 초전도성을 결정하는 원리를 파악하는 데 필수적입니다.", "motivation": "기존 XRD 방식으로는 확인하기 어려웠던 214 Cuprate 내의 벌크 미세 구조와 도메인 벽의 3차원적 분포를 규명하고자 합니다.", "result": "3DXRD 기법을 통해 1/8 도핑된 La-214 시료 내에 테트라곤(tetragonal) 구조의 매트릭스 속에 숨겨진 오르토롬빅(orthorhombic) 스트라이프 도메인들을 시각화했습니다.", "implication": "벌크 내의 구조적 불균질성이 전자적 상태(초전도성 및 전하 질서)와 직접적으로 연관되어 있음을 시사하며, 물질의 기능을 이해하는 새로운 기준을 제시합니다.", "novelty": "3DXRD를 사용하여 파괴하지 않고 벌크 내부의 3차원 미세 구조를 직접 관찰하여 구조적 불균질성과 전자적 물성 간의 상관관계를 직접적으로 논의할 수 있는 기반을 마련했습니다.", "unresolved": "이번 결과가 전자 구조적 불균질성(예: CDW)의 발생을 직접적으로 설명하는지에 대해서는 추가적인 온도 의존적 전기 전도도나 ARPES 연구가 결합되어야 합니다.", "future_work": "관찰된 미세 구조가 초전도 전이 온도 및 상전이 온도에 미치는 영향을 직접적으로 매핑하는 연구가 뒤따라야 합니다.", "concepts": [{"term": "3DXRD", "why_emerged": "기존 XRD는 2차원적인 평균 정보만 제공하여 벌크 내부의 복잡한 3차원적 도메인 구조를 분석하는 데 한계가 있어 도입됨.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "X-ray imaging, structural characterization of quantum materials."}, {"term": "1/8-doped cuprates", "why_emerged": "특정 도핑 수준(x=0.125)에서 초전도성이 급격히 억제되고 전하/스핀 질서(stripes)가 강력하게 나타나는 기현상을 연구하기 위해 정의됨.", "origin": "1980년대 후반부터 고온 초전도체 연구에서 활발히 연구됨.", "connections": "Cuprate superconductivity, Stripe phase, Quantum criticality."}], "english_summary": ["Employs 3DXRD to visualize bulk microstructures in 1/8-doped La-214 cuprates.", "Reveals intrinsic structural heterogeneity consisting of tetragonal matrices and orthorhombic-like stripes.", "Establishes a connection between complex structural domains and emergent electronic properties.", "Demonstrates the power of 3DXRD in resolving bulk microstructural organization."]}}, {"title": "Interlayer-Correlated Fractional Quantum Hall State in a Trilayer Electron System", "journal": "PRL_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/4bpx-3mwm", "authors": "Chengyu Wang, C. T. Tai, N. Toemtrisna, et al.", "last_authors": "K. W. Baldwin, M. Shayegan", "summary": "In multilayer quantum Hall systems, when the layer separation is sufficiently small, the interplay between intralayer and interlayer Coulomb interactions can lead to exotic, multicomponent, many-body states. A particular example is the even-denominator fractional quantum Hall state at total filling …", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Experimental study of correlated FQH states in multi-layer systems, relevant to quantum Hall interest.", "tags": ["experiment", "quantumHall", "correlatedelectrons"], "image": "", "briefing": {"background": "다층 양자 홀 시스템은 층간 결합과 전자 간 상호작용이 조절됨에 따라 단일 층에서는 볼 수 없는 새로운 다체(many-body) 양자 상태를 생성할 수 있는 플랫폼입니다.", "motivation": "층간 거리가 충분히 좁은 삼층(trilayer) 전자 시스템에서 전자 간 쿨롱 상호작용을 통해 유도되는 새로운 분수 양자 홀 상태를 탐구하고자 합니다.", "result": "삼층 시스템에서의 층간 상관관계가 어떻게 홀 상태의 복잡성을 증대시키고 새로운 위상학적 상태를 안정화하는지 보여줍니다.", "implication": "층 간의 결합을 설계함으로써 새로운 다체 양자 상태를 공학적으로 조절할 수 있는 가능성을 열어줍니다.", "novelty": "단일층이나 이중층을 넘어선 삼층 시스템에서의 전자 상관관계 연구는 다층 구조를 활용한 새로운 양자 소자 설계에 물리적 통찰을 제공합니다.", "unresolved": "이러한 상태가 시스템 전체의 층간 결합 강도에 따라 어떻게 위상적으로 변화하는지에 대한 완전한 위상 도표는 아직 규명되지 않았습니다.", "future_work": "층간 전압이나 자기장을 가변적으로 조절하여 양자 홀 상태의 전이를 관찰하고, 층간 상관관계의 정량적 측정이 필요합니다.", "concepts": [{"term": "Fractional Quantum Hall State", "why_emerged": "강한 자기장 하에서 전자 간 상호작용으로 인해 분수 전하를 갖는 준입자가 형성되는 현상을 설명하기 위해 도입됨.", "origin": "1982년 Tsui, Stormer, Laughlin에 의해 발견 및 이론화됨.", "connections": "Topological order, Anyons, Strongly correlated electrons."}], "english_summary": ["Investigates the emergence of fractional quantum Hall (FQH) states in a trilayer electron system.", "Focuses on the interplay between intralayer and interlayer Coulomb interactions.", "Shows how multicomponent many-body states are stabilized by layer proximity.", "Provides insights into designing exotic quantum phases in multilayer vdW heterostructures."]}}, {"title": "Observation of Time-Reversal Symmetry Breaking in the Type-I Superconductor YbSb2", "journal": "PRL_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/drzq-lfn5", "authors": "Anshu Kataria, Shashank Srivastava, Dibyendu Samanta, et al.", "last_authors": "Sudeep Kumar Ghosh, Ravi Prakash Singh", "summary": "A hallmark property of unconventional superconductivity has been discovered in a type-I superconductor, whereas it’s normally observed only in type-II materials.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Discovery of TRSB in a real material system, highly relevant to user's interest in unconventional superconductivity.", "tags": ["experiment", "YbSb2", "superconductivity"], "image": "", "briefing": {"background": "초전도체는 크게 자기장을 밀어내는 성질에 따라 제1종과 제2종으로 나뉩니다. 일반적으로 시간 반전 대칭성 깨짐(TR opologicalorder"], "image": "", "briefing": {"background": "분수 양자 홀 효과(FQHE) 상태에서는 전하가 나뉜 분수 전하 입자가 존재할 수 있으며, 특히 ν=1/2 상태는 비아벨 위상 질서를 구현할 수 있는 후보로 주목받고 있습니다.", "motivation": "위상 양자 컴퓨팅 구현에 필수적인 비아벨 애니온(non-Abelian anyons)의 존재를 실험적으로 증명하기 위해 ν=1/2 상태의 전하량을 측정하고자 합니다.", "result": "양자 점 접촉(QPC)을 이용한 샷 노이즈 측정 결과, e/4 전하를 가진 준입자를 관측하여 ν=1/2 상태가 비아벨 위상 질서를 가짐을 강력히 시사합니다.", "implication": "위상 양자 컴퓨팅을 위한 기본 단위인 비아벨 준입자 제어 가능성을 확인하였으며, 위상 물질 연구의 돌파구가 될 수 있습니다.", "novelty": "매우 정밀한 노이즈 측정을 통해 예측된 e/4 전하를 확인하여, ν=1/2 시스템의 이론적 모델인 Moore-Read 상태를 지지하는 강력한 증거를 제공합니다.", "unresolved": "관측된 e/4 전하가 실제 비아벨 통계의 직접적인 증거인지에 대한 더 명확한 braiding 실험이 필요합니다.", "future_work": "해당 입자들의 braiding을 직접 확인하기 위한干涉계(interferometer) 실험이 차기 과제로 기대됩니다.", "concepts": [{"term": "분수 양자 홀 효과", "why_emerged": "강한 자기장 하에서 전자 간 상호작용으로 인한 위상적 질서를 설명하기 위해 필요합니다.", "origin": "Tsui, Stormer, Laughlin (1982)", "connections": "토폴로지컬 순서, 위상 양자 컴퓨팅."}, {"term": "비아벨 위상 질서", "why_emerged": "양자 정보 처리에 있어 오류에 강한 비국소적 정보를 저장하기 위해 필요합니다.", "origin": "Moore와 Read (1991)", "connections": "양자 컴퓨팅, 파이-상태(Pfaffian state)."}], "english_summary": ["Observation of e/4 charge quasiparticles in the ν=1/2 fractional quantum Hall state.", "Experimental evidence suggests non-Abelian topological order in GaAs quantum wells.", "Supports potential applications in topological quantum computing."]}}, {"title": "Quantum Oscillation and Topology Change of the Uncondensed Landau Fermi Surface in Superconducting CeCoIn5", "journal": "PRL_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/sfxm-n236", "authors": "Sangyun Lee, Ammar Jahin, Duk Y. Kim, et al.", "last_authors": "Shi-Zeng Lin, R. Movshovich", "summary": "Metals typically have multiple Fermi-surface sheets, and when they enter the superconducting state, some electrons on these sheets may remain uncondensed, or their superconducting pairs can be rapidly destroyed by a magnetic field. Detecting uncondensed electrons within the superconducting state pro…", "tier": "B_I ry": ["Ultraclean UTe2 single crystals were studied using ultrasound velocity measurements up to 18 T for H parallel to the b-axis.", "The experiment provides missing bulk thermodynamic evidence for an additional high-field superconducting phase.", "The results confirm a tetracritical topology in the H-T phase diagram of this heavy-fermion superconductor.", "This finding reinforces the complex nature of superconducting order in UTe2 under high magnetic fields."]}}, {"title": "2D theoretically twistable material database", "journal": "Science", "source": "Gemini", "link": "https://doi.org/10.1126/science.adu1550", "authors": "Yi Jiang, Urko Petralanda, Hanqi Pi, et al.", "last_authors": "Leslie M. Schoop, B. Andrei Bernevig", "summary": "The study of twisted two-dimensional (2D) materials, in which twisting layers create moiré superlattices, has created opportunities for investigating topological phases and strongly correlated physics. The broader potential of a seemingly infinite set of twistable 2D materials remains largely unexplored. Here, we define “theoretically twistable materials” as single- or multilayer structures that allow for the construction of simple continuum models of their moiré structures. Our high-throughput algorithm systematically searches for theoretically twistable semimetals and insulators based on the Topological 2D Materials Database (2D-TQCDB). By analyzing key electronic properties, we identify thousands of candidate materials, propose representative twistable materials, and provide examples of crystal growth and exfoliation for several of them. Our results provide a resource for future experimental and theoretical studies of moiré systems.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Comprehensive database of twistable materials for moir superlattices and topological physics research.", "tags": ["method", "2Dmaterials", "moirsuperlattices", "topologicalphases"], "image": "", "briefing": {"background": "자동 브리핑을 생성하지 못했습니다. 초록 function render() {
  slideEl.replaceChildren();
  if (!slides.length) { slideEl.className = 'empty'; slideEl.textContent = 'No papers passed the filters in this run.'; counterEl.textContent = '0 / 0'; prevBtn.disabled = true; nextBtn.disabled = true; return; }
  slideEl.className = 'slide';
  const r = slides[index];
  const b = r.briefing || {};
  const head = document.createElement('div');
  head.className = 'paper-head';
  if (r.image) {
    const figure = document.createElement('figure');
    figure.className = 'figure';
    const img = document.createElement('img');
    img.src = r.image; img.alt = 'Figure or article preview image'; img.loading = 'lazy'; img.referrerPolicy = 'no-referrer'; img.onerror = () => figure.remove();
    figure.appendChild(img);
    figure.appendChild(textEl('figcaption', '', 'Figure / article preview image from the source page'));
    head.appendChild(figure);
  }
  const headText = document.createElement('div');
  headText.className = 'head-text';
  const badges = document.createElement('div');
  badges.className = 'badges';
  if (r.score) badges.appendChild(textEl('span', 'badge score', `${r.score}/10`));
  if (r.tier) badges.appendChild(textEl('span', 'badge', r.tier));
  if (r.journal) badges.appendChild(textEl('span', 'badge', r.journal));
  if (r.source) badges.appendChild(textEl('span', 'badge', r.source));
  headText.appendChild(badges);
  const title = document.createElement('h1');
  if (r.link) { const titleLink = document.createElement('a'); titleLink.href = r.link; titleLink.target = '_blank'; titleLink.rel = 'noopener noreferrer'; titleLink.textContent = r.title || ''; title.appendChild(titleLink); }
  else { title.textContent = r.title || ''; }
  headText.appendChild(title);
  headText.appendChild(textEl('p', 'meta', [r.journal, r.source].filter(Boolean).join(' | ')));
  if (r.last_authors || r.authors) { const authors = document.createElement('p'); authors.className = 'authors'; if (r.last_authors) authors.append('Last authors: ' + r.last_authors); if (r.authors) authors.append((r.last_authors ? ' | ' : '') + 'Authors: ' + r.authors); headText.appendChild(authors); }
  appendLabeledText(headText, 'why', 'Filter reason: ', r.reason);
  if (r.tags && r.tags.length) { const tags = document.createElement('div'); tags.className = 'tags'; r.tags.forEach(tag => tags.appendChild(textEl('span', 'tag', '#' + tag))); headText.appendChild(tags); }
  if (r.link) { const link = document.createElement('a'); link.className = 'link'; link.href = r.link; link.target = '_blank'; link.rel = 'noopener noreferrer'; link.textContent = 'Open paper'; headText.appendChild(link); }
  head.appendChild(headText);
  if (r.summary) { const abstract = document.createElement('p'); abstract.className = 'original-abstract'; const strong = textEl('strong', '', 'Original abstract'); abstract.appendChild(strong); abstract.append(r.summary); head.appendChild(abstract); }
  slideEl.appendChild(head);
  const briefing = document.createElement('div');
  briefing.className = 'briefing';
  appendBriefSection(briefing, 'Background', b.background);
  appendBriefSection(briefing, 'Motivation', b.motivation);
  appendBriefSection(briefing, 'Result', b.result);
  appendBriefSection(briefing, 'Implication', b.implication);
  appendBriefSection(briefing, "Why it's important / Novelty", b.novelty);
  appendBriefSection(briefing, 'Unresolved Questions', b.unresolved);
  appendBriefSection(briefing, 'Expected Future Work', b.future_work);
  if (b.concepts && b.concepts.length) {
    const section = document.createElement('section');
    section.className = 'brief-section wide';
    section.appendChild(textEl('h2', '', 'Concepts / Terms'));
    const concepts = document.createElement('div');
    concepts.className = 'concepts';
    b.concepts.forEach(c => {
      const item = document.createElement('div');
      item.className = 'concept';
      item.appendChild(textEl('h3', '', c.term || 'Concept'));
      [['왜 생겼나: ', c.why_emerged], ['누가 만들었나: ', c.origin], ['연결되는 흐름: ', c.connections]].forEach(([label, text]) => { if (!text) return; const p = document.createElement('p'); const bold = textEl('b', '', label); p.appendChild(bold); p.append(text); item.appendChild(p); });
      concepts.appendChild(item);
    });
    section.appendChild(concepts);
    briefing.appendChild(section);
  }
  if (b.english_summary && b.english_summary.length) { const section = document.createElement('section'); section.className = 'brief-section wide'; section.appendChild(textEl('h2', '', 'English Summary')); const ul = document.createElement('ul'); b.english_summary.slice(0, 5).forEach(line => ul.appendChild(textEl('li', '', line))); section.appendChild(ul); briefing.appendChild(section); }
  slideEl.appendChild(briefing);
  counterEl.textContent = `${index + 1} / ${slides.length}`;
  prevBtn.disabled = index === 0;
  nextBtn.disabled = index === slides.length - 1;
}
prevBtn.addEventListener('click', () => { index = Math.max(0, index - 1); render(); });
nextBtn.addEventListener('click', () => { index = Math.min(slides.length - 1, index + 1); render(); });
document.addEventListener('keydown', event => { if (event.key === 'ArrowLeft') prevBtn.click(); if (event.key === 'ArrowRight') nextBtn.click(); });
render();
</script>
</body>
</html>
