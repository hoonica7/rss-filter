<title>Daily Paper Slideshow</title>
<style>
  :root {
    color-scheme: light;
    --bg: #f6f7f4;
    --paper: #ffffff;
    --ink: #111827;
    --muted: #64748b;
    --line: #d8ddd2;
    --accent: #176b87;
    --accent-2: #9a3412;
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; overflow: auto; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: var(--bg); color: var(--ink); }
  .shell { max-width: 1500px; min-height: 100vh; margin: 0 auto; padding: 14px 18px; display: flex; flex-direction: column; }
  .topbar { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 16px; }
  .top-actions { display: flex; align-items: center; gap: 10px; }
  .topbar a, button { border: 1px solid var(--line); border-radius: 8px; background: var(--paper); color: var(--ink); padding: 10px 14px; font-weight: 700; text-decoration: none; cursor: pointer; }
  button.primary { background: var(--accent); border-color: var(--accent); color: white; }
  button:disabled { opacity: 0.45; cursor: not-allowed; }
  .counter { color: var(--muted); font-weight: 700; }
  .slide { min-height: calc(100vh - 82px); background: var(--paper); border: 1px solid var(--line); border-radius: 10px; padding: 18px; box-shadow: 0 18px 42px rgba(15, 23, 42, 0.10); display: grid; grid-template-columns: minmax(310px, 0.86fr) minmax(0, 1.55fr); gap: 18px; overflow: visible; }
  .paper-head { min-width: 0; min-height: 0; overflow: visible; display: flex; flex-direction: column; gap: 12px; }
  .figure { margin: 0; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: #f8fafc; }
  .figure img { display: block; width: 100%; max-height: 41vh; object-fit: contain; background: white; }
  .figure figcaption { padding: 7px 10px; color: var(--muted); font-size: 12px; line-height: 1.3; }
  .head-text { display: flex; flex-direction: column; gap: 9px; min-width: 0; }
  .badges { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .badge { border-radius: 999px; padding: 5px 9px; background: #eef2ff; color: #3730a3; font-size: 12px; font-weight: 800; }
  .score { background: #fee2e2; color: #991b1b; }
  h1 { margin: 0; font-size: 25px; line-height: 1.15; letter-spacing: 0; overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
  h1 a { color: inherit; text-decoration-color: rgba(23, 107, 135, 0.35); text-decoration-thickness: 2px; text-underline-offset: 4px; }
  h1 a:hover { color: var(--accent); text-decoration-color: var(--accent); }
  .meta, .authors, .why, .abstract { font-size: 13px; line-height: 1.45; }
  .meta, .authors { color: var(--muted); }
  .why strong, .abstract strong, .authors strong { color: var(--ink); }
  .authors { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .why { border-left: 4px solid var(--accent-2); padding-left: 10px; color: #374151; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .abstract { border-top: 1px solid var(--line); padding-top: 14px; color: #374151; }
  .original-abstract { border-top: 1px solid var(--line); padding-top: 10px; color: #374151; font-size: 11.5px; line-height: 1.35; overflow-wrap: anywhere; }
  .original-abstract strong { display: block; margin-bottom: 4px; color: var(--ink); }
  .tags { display: flex; flex-wrap: wrap; gap: 8px; }
  .tag { border-radius: 999px; padding: 4px 8px; background: #f1f5f9; color: #475569; font-size: 12px; font-weight: 700; }
  .head-text > .link { display: none; }
  .briefing { min-width: 0; min-height: 0; overflow: visible; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); grid-auto-rows: minmax(0, auto); align-content: start; gap: 11px 18px; border-top: 0; padding-top: 0; }
  .brief-section { min-width: 0; }
  .brief-section.wide { grid-column: 1 / -1; }
  .brief-section h2 { margin: 0 0 4px; font-size: 14px; line-height: 1.22; color: #0f766e; letter-spacing: 0; }
  .brief-section p, .brief-section li { margin: 0; font-size: 12.5px; line-height: 1.42; color: #1f2937; overflow-wrap: anywhere; }
  .brief-section ul { margin: 0; padding-left: 20px; }
  .concepts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 9px 14px; }
  .concept { border-top: 1px solid var(--line); padding-top: 7px; }
  .concept h3 { margin: 0 0 4px; font-size: 13px; color: #7c2d12; letter-spacing: 0; }
  .concept p { margin: 2px 0 0; font-size: 11.5px; line-height: 1.35; color: #374151; overflow-wrap: anywhere; }
  .concept b { color: #111827; }
  .link { color: var(--accent); font-weight: 800; text-decoration: none; }
  .empty { padding: 48px; background: var(--paper); border: 1px solid var(--line); border-radius: 12px; color: var(--muted); }
  @media (max-width: 860px) {
    .shell { padding: 14px; }
    .topbar, .top-actions { align-items: stretch; flex-direction: column; }
    .slide, .briefing, .concepts { grid-template-columns: 1fr; }
    .slide { min-height: auto; overflow: visible; display: grid; }
    h1 { font-size: 28px; }
  }
</style>

const slides = [{"title": "A First-principles Study of Weyl Nodal Loop and Multiple Sets of Weyl Points in Trigonal PtBi2 (Phys. Rev. B)", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2601.05123", "authors": "Lin-Lin Wang", "last_authors": "Lin-Lin Wang", "summary": "Coexistence of surface superconductivity and Fermi arcs in trigonal $\\gamma$-PtBi$_2$ has recently attracted attention for possible realization of topological superconductivity. The Fermi arcs on the two different (0001) surface terminations have been associated with the set of Weyl points just above the Fermi energy (E$_F$). Here using first-principles calculations to explore the band crossings over the full Brillouin zone between the nominally highest valence and lowest conduction bands in $\\gamma$-PtBi$_2$, we study the Weyl nodal loop (WNL) and multiple sets of Weyl points (WPs). The main difference between the two reported experimental structural parameters is the magnitude of Bi-layer buckling. While the WNL, bulk gap region and the set of Weyl points just above the E$_F$ are robust, the number and location of the other sets of WPs depend sensitively on the structural parameters with different magnitude of Bi-layer buckling. Besides calculating the 2D Fermi surface with Fermi arcs and quasi-particle interference (QPI) around the E$_F$ in good agreements with ARPES and experimental QPI, we also predict new Fermi arc features at higher energy.", "tier": "A_MUST_READ", "score": "10", "reason": "Direct hit: Electronic structure calculations of PtBi2 with comparisons to ARPES and Fermi arc features.", "tags": ["theory", "PtBi2", "ARPES", "Weyl", "topological-superconductivity"], "image": "https://arxiv.org/static/browse/0.3.4/images/arxiv-logo-fb.png", "briefing": {"background": "Weyl 반금속(Weyl semimetals)은 벌크의 밴드 교차점인 Weyl point와 표면의 Fermi arc라는 독특한 전자 구조를 가집니다. 특히 PtBi2와 같은 물질은 표면 초전도성과 Fermi arc가 공존하여 위상 초전도체(topological superconductor) 구현을 위한 중요한 후보 물질로 거론되어 왔습니다.", "motivation": "최근 trigonal γ-PtBi2에서 관찰된 Fermi arc의 기원을 명확히 하고, Bi 층의 뒤틀림(buckling)과 같은 미세한 구조적 변화가 Weyl point의 수와 위치, 그리고 그에 따른 위상적 특성에 미치는 영향을 이론적으로 규명하고자 하였습니다.", "result": "제1원리 계산을 통해 γ-PtBi2 내부에 Weyl nodal loop(WNL)와 여러 세트의 Weyl point(WP)가 존재함을 확인했습니다. 특히 Bi 층의 buckling 정도에 따라 WP의 개수와 위치가 민감하게 변한다는 것을 발견했으며, 계산된 Fermi surface와 QPI 패턴이 기존 ARPES 및 STM 실험 결과와 잘 일치함을 보였습니다.", "implication": "실험적으로 보고된 Fermi arc가 Fermi 준위 바로 위에 위치한 Weyl point 세트와 밀접하게 연관되어 있음을 확증했습니다. 또한 구조적 비대칭성이 위상적 성질을 제어하는 핵심 변수임을 시사합니다.", "novelty": "기존 실험 데이터를 넘어서는 높은 에너지 영역에서 새로운 Fermi arc의 존재를 예측했으며, Bi 층 buckling이라는 구조적 변수가 Weyl 물리량의 견고성(robustness)에 미치는 차별적인 영향을 밝혀냈습니다. ARPES 데이터를 해석하는 독자에게 구조와 전자 구조의 민감한 상관관계를 제공합니다.", "unresolved": "이론적으로 예측된 높은 에너지 영역의 새로운 Fermi arc와 Weyl point들이 실제 ARPES 실험에서 명확히 관측될 수 있는지, 그리고 이것이 초전도 발현과 어떤 정량적 관계를 갖는지는 추가 검증이 필요합니다.", "future_work": "구조적 매개변수를 정밀하게 제어하며 고해상도 ARPES를 통해 예측된 높은 에너지의 위상 상태를 탐색하는 연구와, 이러한 위상 상태가 표면 초전도 메커니즘에 기여하는 방식을 규명하는 연구가 기대됩니다.", "concepts": [{"term": "Weyl Nodal Loop (WNL)", "why_emerged": "Weyl point가 점이 아닌 선(loop)의 형태로 밴드 교차가 일어나는 상태를 설명하기 위해 도입되었습니다.", "origin": "초록 정보만으로는 특정하기 어려우나, 위상 절연체 연구의 확장으로 등장했습니다.", "connections": "Weyl semimetal, Drumhead surface states와 연결됩니다."}, {"term": "Fermi Arc", "why_emerged": "일반적인 금속의 닫힌 Fermi surface와 달리, Weyl semimetal의 표면에서 나타나는 불연속적인 호 형태의 상태를 설명합니다.", "origin": "Wan et al. (2011) 등이 Weyl semimetal 이론에서 제안했습니다.", "connections": "ARPES 측정의 핵심 지표이며, Weyl point의 투영과 연결됩니다."}, {"term": "Bi-layer buckling", "why_emerged": "2차원 층상 구조에서 원자들이 평면에서 벗어나 뒤틀리는 현상이 전자 구조에 미치는 영향을 설명하기 위해 사용됩니다.", "origin": "결정학적 구조 분석에서 유래했습니다.", "connections": "반전 대칭성 파괴, 스핀-궤도 결합(SOC)의 유효 세기 변화와 직결됩니다."}, {"term": "QPI (Quasi-Particle Interference)", "why_emerged": "STM 실험에서 불순물에 의한 산란 패턴을 통해 벌크 및 표면의 밴드 구조 정보를 역으로 추출하기 위해 필요합니다.", "origin": "STM 기술 발전과 함께 고체 물리 산란 이론에서 정립되었습니다.", "connections": "STM/STS, 스핀 산란 선택 규칙과 연결됩니다."}], "english_summary": ["Theoretical study of the electronic structure of trigonal PtBi2, identifying Weyl nodal loops and multiple Weyl points.", "Demonstrates that Bi-layer buckling significantly influences the number and position of Weyl points.", "Confirms that calculated Fermi arcs and QPI patterns align well with existing ARPES and STM data.", "Predicts additional Fermi arc features at higher energy levels beyond previous experimental reports."]}}, {"title": "Binary kagome superconducting candidates hosting topological electronic states (Phys. Rev. Mater.)", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2610.03003", "authors": "Xin-Wei Yi, Jing-Yang You, Gang Su", "last_authors": "Jing-Yang You, Gang Su", "summary": "Topological superconductivity has attracted broad interest because of its connection to Majorana fermions and quantum computation. Kagome materials provide a natural setting in which interesting electronic structures, topological surface states, and superconductivity may occur in nearby energy windows. Here we carry out a systematic first-principles search for binary kagome superconducting candidates with topological electronic states across several structural families $A_mB_n$ ($m$:$n$=3:1; 3:2; 1:1). The screening combines formation-energy and phonon-stability filtering, magnetic-ground-state searches, electron-phonon-coupling calculations, and topological electronic-structure analysis. We identify 286 nonmagnetic dynamically stable candidates for electron-phonon-coupling analysis, among which 84 have estimated transition temperatures above 3 K and seven exceed the $\\sim 9$ K reference scale of existing ambient-pressure kagome superconductors. In addition, several systems are predicted to host abundant topological surface states near the Fermi level. NbBi is identified as a $\\mathbb{Z}_2$ topological metal with clear Dirac-cone topological surface states and a kagome-derived flat band near $E_F$. Ti$_3$Si, with the largest estimated $T_\\text{c}=15.2$ K in this dataset, shows nodal-line-derived dr gest that structural phase separation is intrinsic to the CDW formation in FeGe.", "This indicates potential for tuning the topological and quantum states of kagome metals via strain."]}}, {"title": "Highly stretchable, hair-compatible multichannel neural interface with time-stable hydrogel for high-fidelity long-term EEG sensing", "journal": "Science_Advances", "source": "author whitelist", "link": "https://www.science.org/doi/abs/10.1126/sciadv.aee1540?af=R", "authors": "Ju-Chun Hsieh, Mengmeng Yao, Hussein Alawieh, et al.", "last_authors": "José del R. Millán, Huiliang Wang", "summary": "Reliable brain-computer interfaces (BCIs) require electroencephalography (EEG) sensors that maintain conformal, low-impedance contact through hair, motion, and repeated use. Here, we present MindStretcH, a stretchable and hair-compatible EEG platform integrating a kirigami-patterned elastomeric mesh, deformable eutectic gallium-indium (EGaIn) interconnects, and detachable hydrogel-based conical electrodes. The system adapts to variations in head geometry, preserves electrical performance under substantial mechanical deformation, and maintains stable electrode-scalp contact over prolonged use. Longitudinal motor-imagery recordings and repeated online BCI experiments showed consistent task-related EEG activity without measurable deterioration in recording quality. These results establish MindStretcH as a reusable platform for long-term EEG monitoring and BCI applications in laboratory, clinical, and home settings.", "tier": "A_MUST_READ", "score": "9", "reason": "author whitelist: Hong Ding", "tags": ["authorWhitelist"], "image": "", "briefing": {"background": "뇌-컴퓨터 인터페이스(BCI) 기술은 장기간 안정적인 고충실도 EEG 신호 획득이 핵심 과제이며, 이를 위해서는 착용 편의성과 피부 접촉 안정성이 필수적입니다.", "motivation": "기존의 딱딱하거나 머리카락 방해가 심한 전극 문제를 극복하고, 장기 착용이 가능하며 신축성이 뛰어난 EEG 인터페이스 플랫폼을 개발하고자 합니다.", "result": "키리가미(kirigami) 패턴과 EGaIn 인터커넥트를 활용한 유연한 MindStretcH 플랫폼을 개발하여 신뢰성 있는 장기 신호 측정을 구현했습니다.", "implication": "이 플랫폼은 임상 환경뿐만 아니라 emission spectroscopy'\"", "journal": "arXiv_CondMat", "source": "keyword", "link": "https://arxiv.org/abs/2610.02239", "authors": "Adam Kaminski, Paul C. Canfield, Benjamin Schrunk", "last_authors": "Paul C. Canfield, Benjamin Schrunk", "summary": "In a recent work [1] we demonstrated that the Fermi arcs in t-PtBi2 are indeed disconnected segments of the Fermi surface. We showed that the surface state band crosses EF between Weyl points and is has finite band gap at all other momenta until it merges with bulk bands. We did not find evidence of a superconducting gap in the spectra down to 3K. In recent Comment, Sergey Borisenko reanalyzed data from repository posted with our paper and concluded that a superconducting gap with i-wave symmetry is present in our data up to temperatures of 19K. We argue that this claim arises from incorrect identification of the location of Fermi arc and confusion between band gap and superconducting gap. This error was compounded by the fact that Author of the Comment analyzed data from interpolated images used for mapping the Fermi surface that are not suitable for extraction of energy gap on meV scale. This fact was previously communicated to the Author of the Comment during e-mail exchange. We maintain that our conclusion of absence of a superconducting gap above 3 K are valid and consistent with recent STM measurements performed on the same samples, which found surface superconductivity with Tc = 3K, below the temperature at which the data for our ARPES paper was measured.", "tier": "A_MUST_READ", "score": "9", "reason": "title strong match: angle-resolved photoemission", "tags": ["ARPES", "angle-resolvedphotoemission", "photoemission", "STM", "Weyl", "superconduct", "Fermisurface"], "image": "https://arxiv.org/html/2610.02239v2/fig1.png", "briefing": {"background": "t-PtBi2와 같은 위상 물질에서 페르미 아크와 초전도성 사이의 관계는 전자 구조의 토폴로지를 이해하는 데 핵심적인 쟁점입니다.", "motivation": "t-PtBi2의 페르미 아크 및 초전도 갭 유무에 대한 기존 논문 저자들과 비평가(Comment) 사이의 해석 차이를 명확히 하기 위해 작성되었습니다.", "result": "t-PtBi2의 페르미 아크가 불연속적인 페르미 표면 조각임을 재확인하고, 3K 이상의 온도에서 초전도 갭이 관찰되지 않음을 주장합니다.", "implication": "초전도성과 위상 특성의 공존 여부를 판단할 때 데이터 처리 방식과 에너지 스케일의 중요성을 다시 한번 강조합니다.", "novelty": "실제 STM 결과와 저자들의 ARPES 데이터를 교차 검증하여, 외부 제기된 초전도성 주장이 잘못된 데이터 해석에서 기인했음을 체계적으로 반박했습니다.", "unresolved": "저자들의 주장과 비평가 측의 데이터 해석 간의 논쟁은 여전히 잔존하며, 향후 더욱 정밀한 온도 의존적 ARPES 측정이 요구됩니다.", "future_work": "고해상도 및 저온 환경에서의 재측정을 통해 페르미 아크 근처의 에너지 갭 정밀 분석이 필요합니다.", "concepts": [{"term": "Fermi arcs", "why_emerged": "위상 반금속의 벌크 상태와 표면 상태의 연결성을 설명하기 위해 등장.", "origin": "Wan et al. (2011) 등에 의해 Weyl 반금속에서 예견됨.", "connections": "Weyl points, 표면 상태, Berry curvature."}, {"term": "Superconducting gap", "why_emerged": "전자들이 쌍을 이루어 저항이 0이 되는 상태를 에너지 스펙트럼 상에서 증명하기 위해 필요.", "origin": "BCS 이론(1957)을 통해 정립.", "connections": "ARPES 스펙트럼 분석, Bogoliubov 준입자."}], "english_summary": ["The authors address a challenge regarding Fermi arc topology and superconductivity in t-PtBi2.", "They maintain that Fermi arcs are disconnected and no superconducting gap exists above 3 K.", "The claim of 19K superconductivity from a Comment is refuted as a misinterpretation of data.", "Consistency with STM results is emphasized to support their original findings."]}}, {"title": "Significant modulation of acoustoelectric current associated with charge density wave transitions", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/19zf-xskg", "authors": "Natsumi Nikaido, Takuya Kawada, Koji Fujiwara, et al.", "last_authors": "Shintaro Takada, Yasuhiro Niimi", "summary": "How collective electronic order responds to strain remains a central question in quantum materials. Here, the authors find that charge density wave (CDW) transitions in NbSe 3 and 2 H -TaSe 2 strongly modulate the acoustoelectric current driven by surface acoustic waves. A simple phenomenological model based on strain-dependent conductivity captures the essential behavior. The work demonstrates acoustoelectric transport as a sensitive probe of CDW physics and opens new avenues for strain-based control of electronic states in van der Waals materials.", "tier": "B_IMPORTANT_CONDMAT", "score": "10", "reason": "Direct hit: experimental study of CDW transitions in NbSe3 using acoustoelectric current.; demoted from A: broad CM, not direct user/project hit", "tags": ["CDW", "NbSe3", "2H-TaSe2", "vanderWaals", "transport", "experimental"], "image": "", "briefing": {"background": "전하 밀도 파(CDW)는 고체 물질 내에서 전자가 주기적으로 재배열되는 현상으로, 이와 같은 집단적 전자 질서의 제어는 응집물질물리학의 주요 과제입니다.", "motivation": "CDW 상태가 외부 변형(strain)이나 표면 탄성파(SAW)에 의해 어떻게 변화하는지를 연구하여 CDW를 효과적으로 제어하고 탐지하는 방법을 찾고자 합니다.", "result": "NbSe3와 2H-TaSe2에서 CDW 전이 시 음향 전기 전류(acoustoelectric current)가 현저하게 변조됨을 확인했습니다.", "implication": "음향 전기 전류를 이용하면 CDW 상태를 비침습적이고 민감하게 탐지할 수 있으며, 변형을 통한 양자 상태 제어의 가능성을 열었습니다.", "novelty": "CDW 전이와 음향 전기 전류 사이의 명확한 상관관계를 실험적으로 입증했으며, 단순한 현상학적 모델로 이를 잘 설명했습니다.", "unresolved": "변형이 구체적으로 어떤 미시적 메커니즘을 통해 CDW의 전도도를 변화시키는지에 대한 상세한 이론적 정립이 더 필요합니다.", "future_work": "다른 층상 물질로의 응용 및 변형 기반의 새로운 양자 소자 개발 연구가 이어질 것입니다.", "concepts": [{"term": "Charge density wave (CDW)", "why_emerged": "저차원 물질에서 전자-격자 상호작용으로 인해 전하 밀도가 주기적으로 변하는 기저 상태를 설명하기 위해 등장.", "origin": "Peierls(1955)에 의해 이론적 기초 마련.", "connections": "Peierls instability, 금속-절연체 전이, 집단적 여기."}, {"term": "Acoustoelectric current", "why_emerged": "표면 탄성파와 전하 운반자 사이의 상호작용을 통해 전류를 유도하고 물질의 수송 특성을 조사하기 위해 사용.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "표면 탄성파(SAW), 비평형 수송 현상."}], "english_summary": ["The study reports that CDW transitions in NbSe3 and 2H-TaSe2 strongly modulate acoustoelectric current.", "A simple phenomenological model explains the behavior through strain-dependent conductivity.", "Acoustoelectric transport is established as a sensitive probe for CDW physics.", "The work paves the way for strain-based control of electronic states in van der Waals materials."]}}, {"title": "Fluctuation-enhanced electron-phonon coupling in FeSe", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/yhzg-7n5t", "authors": "Jovan Blagojević, Ana Milosavljević, Tea Belojica, et al.", "last_authors": "Rudi Hackl, Nenad Lazarević", "summary": "The interactions among lattice, charge, and spin degrees of freedom fundamentally shape material properties. In FeSe, symmetry-breaking perturbations serve as highly sensitive probes of these couplings. Previous work has shown that defects and isoelectronic substitution can substantially alter these interactions, giving rise to additional phonon modes. In this study, uniaxial strain is employed as a tunable symmetry-breaking control parameter to probe the intrinsic lattice response in the absence of disorder. The temperature evolution of phonon excitations was examined with a temperature resolution of 3 K in the vicinity of the nemato-structural transition temperature T s , under strain applied along the 〈 110 〉 and 〈 100 〉 crystallographic directions. A subtle asymmetry of the A 1 g p h mode appears in the unstrained crystal within a narrow temperature window around T s , originating from the emergence of an additional mode in the fully symmetric channel. With applied strain, this feature becomes more distinctly resolved. The anomaly is attributed to modifications of the coupling between lattice and electronic degrees of freedom driven by the ordering fluctuations right above the nematic transition. These fluctuations may enhance the susceptibility of the electron-lattice system and enable two-phonon Raman scattering involving the acoustic mode near the X and R points. The presence of this two-phonon scattering depends on both the strength and the direction of the applied strain, indicating a high sensitivity of FeSe to local symmetry breaking.", "tier": "B_IMPORTANT_CONDMAT", "score": "9", "reason": "Investigation of electron-phonon coupling in FeSe, a core material for unconventional superconductivity research.; demoted from A: broad CM, not direct user/project hit", "tags": ["material", "superconductivity", "phonon"], "image": "", "briefing": {"background": "FeSe는 네마틱 전이와 초전도성의 복잡한 상호작용으로 인해 강상관 전자계 연구의 핵심 물질입니다. 특히 전자와 격자 사이의 강한 결합이 이 물질의 물리적 특성을 결정짓는 것으로 알려져 있습니다.", "motivation": "FeSe의 네마틱-구조 전이(Ts) 근처에서 나타나는 전자-격자 결합의 변화가 실제 어떤 메커니즘으로 발생하는지, 외부 변수인 단축 변형(uniaxial strain)을 통해 명확히 밝히고자 했습니다.", "result": "변형을 가했을 때 Ts 부근에서 A1g 포논 모드의 비대칭성이 더욱 뚜렷하게 관찰되었습니다. 이는 네마틱 전이 직전의 요동(fluctuations)이 전자-격자 결합을 강화하고, 특정 음향 포논 모드와의 이중 포논 산란(two-phonon scattering)을 유도함을 시사합니다.", "implication": "FeSe의 전자구조가 국소적인 대칭성 깨짐에 매우 민감하게 반응하며, 이러한 격자 요동이 초전도 페어링 메커니즘을 이해하는 중요한 단서가 될 수 있음을 보여줍니다.", "novelty": "무질서가 없는 환경에서 정밀한 단축 변형을 통해 네마틱 요동과 격자 결합 사이의 미세한 상관관계를 라만 분광법으로 직접적으로 규명한 점이 중요합니다.", "unresolved": "이번 연구에서 관찰된 이중 포논 산란이 구체적으로 어떤 에너지 대역의 전자 상태와 강하게 결합하는지에 대한 미시적 정보는 여전히 제한적입니다.", "future_work": "ARPES를 이용해 동일한 변형 조건하에서 전자 구조의 밴드 분할(band splitting)을 직접 관측하여 포논 산란 데이터와 연결하는 연구가 필요합니다.", "concepts": [{"term": "Nemato-structural transition", "why_emerged": "FeSe와 같은 철계 초전도체에서 회전 대칭성이 깨지며 발생하는 전이 현상을 설명하기 위해 도입되었습니다.", "origin": "FeSe 연구가 활발해지면서 2010년대 중반 이후 널리 정립됨.", "connections": "전자 네마틱성(electronic nematicity), 궤도 선택적 모트 물리와 밀접."}, {"term": "Two-phonon Raman scattering", "why_emerged": "격자-전자 결합이 강할 때, 단일 포논 외에 포논 쌍의 상호작용이 라만 스펙트럼에 드러나기 때문에 필요합니다.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "전자-포논 결합의 크기를 측정하는 분광학적 도구."}], "english_summary": ["FeSe exhibits subtle phonon mode anomalies near the nematic transition temperature Ts.", "Uniaxial strain reveals that nematic fluctuations enhance electron-lattice coupling.", "Two-phonon Raman scattering emerges from the coupling between lattice and electronic degrees of freedom.", "The result demonstrates FeSe's high sensitivity to local symmetry breaking via lattice-electronic interaction."]}}, {"title": "Switching between Spin and Orbital Hall Currents in a Single System via Ferrovalley Order", "journal": "PRL_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/8rnn-n6tq", "authors": "Zhikuan Wang, Wei Tan, Bin Cui, Zeyu Jiang, Bing Huang", "last_authors": "Zeyu Jiang, Bing Huang", "summary": "The spin Hall and orbital Hall effects are fundamental mechanisms for generating transverse spin and orbital currents. However, their intrinsic entanglement via spin-orbit coupling (SOC) has made the generation of pure spin or orbital Hall current a long-standing challenge. Here, we demonstrate a st…", "tier": "B_IMPORTANT_CONDMAT", "score": "9", "reason": "Direct relevance to topological transport and orbital physics in magnetic materials.", "tags": ["transport", "topology", "magnetism"], "image": "", "briefing": {"background": "스핀 홀 효과와 궤도 홀 효과는 전하 전류를 스핀 또는 궤도 전류로 변환하는 소자 물리학의 핵심입니다. 그러나 이 둘은 스핀-궤도 결합(SOC)으로 인해 서로 얽혀 있어 순수한 성분을 분리하기가 매우 어렵습니다.", "motivation": "단일 시스템 내에서 페로밸리(ferrovalley) 차수를 이용해 스핀 홀 전류와 궤도 홀 전류를 제어하고 전환할 수 있는 새로운 메커니즘을 탐색하고자 했습니다.", "result": "페로밸리 질서도를 조절함으로써 스핀 및 궤도 홀 전도도를 비대칭적으로 변조할 수 있음을 확인했습니다. 이는 특정 대칭성 조건 하에서 SOC를 이용한 전류 성분 제어가 가능함을 의미합니다.", "implication": "이러한 조절 능력은 스핀트로닉스와 오비트로닉스(orbitronics) 소자에서 정보를 효율적으로 제어하고 처리하는 새로운 논리 회로를 설계하는 데 활용될 수 있습니다.", "novelty": "스핀-궤도 결합에 의해 필연적으로 섞여 있던 스핀과 궤도 홀 효과를 시스템의 대칭성(밸리 분극) 제어를 통해 분리하여 선택적으로 활용 가능하다는 점이 독창적입니다.", "unresolved": "실험적 검증 단계에서의 구체적인 물질 구현 예시와 외부 장(field)에 대한 스위칭 효율 최적화가 과제로 남아 있습니다.", "future_work": "밸리 분극이 뚜렷한 2D 자성 물질에서의 수송 실험을 통해 궤도 홀 효과의 발현을 직접 측정하는 연구가 뒤따라야 합니다.", "concepts": [{"term": "Ferrovalley order", "why_emerged": "그래핀과 같은 물질에서 밸리 자유도를 비자발적으로 정렬시켜 물리적 효과를 극대화하기 위해 도입되었습니다.", "origin": "2D 밸리트로닉스 연구 초기 단계에서 제안됨.", "connections": "위상 절연체, 비자성 스핀트로닉스."}, {"term": "Orbital Hall effect", "why_emerged": "스핀이 아닌 궤도 각운동량의 수송 현상을 규명하기 위해 필요합니다.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "스핀 홀 효과, 베리 곡률, 스핀-궤도 토크."}], "english_summary": ["Spin and orbital Hall effects are naturally entangled via spin-orbit coupling.", "Ferrovalley order is introduced as a control knob for transverse currents.", "The study proposes switching between spin and orbital currents in a single system.", "The mechanism relies on symmetry engineering to decouple and modulate these Hall components."]}}, {"title": "Emergent Noncoplanar Spin Chirality through Magnetic and Nonmagnetic Substitution in the Kagome Antiferromagnet Mn3Sn", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2610.02794", "authors": "Anupam Barik, Achintya Low, Susanta Ghosh, Kapildeb Dolui, Setti Thirupathaiah", "last_authors": "Kapildeb Dolui, Setti Thirupathaiah", "summary": "Controlling noncoplanar spin textures in centrosymmetric magnets remains a central challenge for realizing emergent Berry-phase phenomena. Here, we demonstrate that magnetic (Cr) and nonmagnetic (Cu) substitution at the Mn site provide distinct routes to engineer spin chirality and topological transport in the kagome antiferromagnet Mn$_3$Sn. Cr substitution enhances low-temperature spin canting, stabilizing a dense noncoplanar texture that yields a pronounced topological Hall effect (THE) at low temperatures. In contrast, Cu substitution drives a spin-reorientation transition accompanied by an easy-axis rotation, creating a broad temperature window (150--208 K) where competing magnetic anisotropies stabilize noncoplanar spin textures and generate a large THE. A concurrent carrier-type crossover signals an underlying electronic-structure reconstruction. These results reveal that exchange enhancement and exchange dilution represent two fundamentally different pathways for tuning real-space Berry curvature, establishing chemical substitution as a powerful strategy for engineering topological transport in kagome antiferromagnets.", "tier": "B_IMPORTANT_CONDMAT", "score": "9", "reason": "Direct relevance to kagome magnets and topological transport experiments.", "tags": ["kagome", "topological", "transport"], "image": "https://arxiv.org/html/2610.02794v1/Fig1.png", "briefing": {"background": "카고메 격자 물질인 Mn3Sn은 비공면(noncoplanar) 스핀 구조를 가져 비정상 홀 효과(AHE) 등을 보이는 위상 자성체입니다. 이러한 위상 물성을 실시간으로 제어하는 것이 현재 자성 물질 연구의 주요 관심사입니다.", "motivation": "Mn3Sn의 Mn 사이트를 다른 원소(Cr, Cu)로 치환하여 스핀 비공면성과 위상 수송 현상을 화학적으로 조절할 수 있는지를 확인하고자 했습니다.", "result": "Cr 치환은 스핀 기울기를 강화하여 저온에서 토폴로지컬 홀 효과(THE)를 유도하고, Cu 치환은 자성 이방성을 변경하여 넓은 온도 구간에서 THE를 안정화했습니다. 또한 캐리어 유형의 변화를 관측했습니다.", "implication": "화학적 치환이 카고메 격자의 전자 구조 재구성과 실공간 베리 곡률을 조절하는 효과적인 도구임을 입증했습니다.", "novelty": "교환 상호작용 강화(Cr)와 희석(Cu)이라는 두 가지 경로를 통해 동일 물질에서 위상 수송 특성을 정밀하게 튜닝할 수 있음을 보여주었습니다.", "unresolved": "치환 원소들이 도입됨에 따라 발생하는 국소적인 무질서가 위상 물성에 미치는 영향과 이론적 모델 사이의 정량적 일치는 여전히 탐구 대상입니다.", "future_work": "ARPES를 통한 밴드 구조 변화의 직접 관측 및 더 넓은 범위의 치환 농도에 대한 수송 실험이 필요합니다.", "concepts": [{"term": "Noncoplanar spin texture", "why_emerged": "실공간에서 베리 곡률을 발생시켜 위상 물성을 유도하는 스핀 배열을 설명하기 위해 필요합니다.", "origin": "위상 자성체 연구에서 2010년대 중반 이후 본격화됨.", "connections": "토폴로지컬 홀 효과, 스카이미온."}, {"term": "Topological Hall Effect (THE)", "why_emerged": "전자의 이동이 스핀 텍스처로 인해 획득하는 베리 위상으로부터 기인하는 추가적인 홀 전도 현상을 규명하기 위해 사용됩니다.", "origin": "베리 기하 위상 이론에 근거함(Berry phase in solids).", "connections": "비정상 홀 효과, 스핀 구조 분석."}], "english_summary": ["Mn3Sn kagome antiferromagnet allows tuning of noncoplanar spin textures.", "Cr and Cu substitutions act as distinct knobs for exchange enhancement and dilution.", "Chemical engineering leads to tunable topological Hall effects and carrier crossover.", "The study demonstrates a pathway to engineer real-space Berry curvature in kagome magnets."]}}, {"title": "Magnetic-Order-Driven Nonlinear Photocurrents in PT-Broken Antiferromagnetic MnS2 and Altermagnetic MnSe2", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2610.03450", "authors": "Fu Li, Rajyavardhan Ray, Xiaoxiong Liu, et al.", "last_authors": "Hongbin Zhang, Harish K. Singh", "summary": "Nonlinear photocurrent responses generally require inversion-symmetry breaking, but its origin can be magnetic rather than structural. In this study, we investigate the bulk photovoltaic effect in antiferromagnetic MnS2 and altermagnetic MnSe2, two pyrite-type semiconductors whose magnetic ordering breaks inversion symmetry P and its combination with time reversal PT, while the accompanying lattice distortion is minute. We calculate the shift current (SC) and injection current (IC) responses under linearly and circularly polarized light with and without spin-orbit coupling (SOC) and identify their symmetry-allowed tensor components using the corresponding magnetic and spin point groups, respectively. Linear SC and circular IC are symmetry-allowed in both MnS2 and MnSe2 irrespective of SOC, whereas linear IC and circular SC remain forbidden in MnS2 but become allowed in MnSe2 only when SOC is included. These results highlight the importance of SOC and the corresponding MPG analysis for a complete description of nonlinear charge photocurrents in magnetic materials. Beyond charge responses, MnSe2 supports linear shift and circular injection spin photocurrents in the nonrelativistic limit, whereas all spin-photocurrent responses are forbidden in MnS2. Our findings therefore establish inversion symmetry breaking induced by compensated magnetic order as a route to generating and controlling nonlinear photocurrents.", "tier": "B_IMPORTANT_CONDMAT", "score": "9", "reason": "Direct relevance to altermagnetism and magnetic topological materials for future experiments.", "tags": ["altermagnetism", "topological", "transport"], "image": "https://arxiv.org/html/2610.03450v1/Main-Fig/Fig-1.png", "briefing": {"background": "비선형 광전류(Nonlinear photocurrent) 응답은 일반적으로 결정 구조의 반전 대칭성 깨짐에 의존하지만, 최근에는 자기적 질서에 의한 대칭성 깨짐이 주목받고 있습니다.", "motivation": "PT 대칭성이 깨진 반강자성체 MnS2와 알터자성체 MnSe2에서 자기적 질서가 비선형 광전류 응답에 미치는 영향을 이론적으로 규명하고자 합니다.", "result": "MnS2와 MnSe2 모두에서 SOC 유무와 관계없이 선형 이동 전류(SC)와 원형 주입 전류(IC)가 대칭적으로 허용됨을 보였습니다. MnSe2는 SOC가 있을 때 추가적인 전류 응답이 가능하며, 스핀 광전류 응답에서도 MnS2와 차별화됨을 확인했습니다.", "implication": "자기적 질서에 의한 반전 대칭성 깨짐이 비선형 광전류를 생성하고 제어하는 효과적인 수단이 될 수 있음을 시사합니다.", "novelty": "알터자성체에서의 비선형 응답을 자기점군(MPG) 분석을 통해 체계적으로 정리했으며, 이는 스핀트로닉스 및 비선형 광학 연구에 중요한 기초 자료를 제공합니다.", "unresolved": "이론적 계산 위주의 연구로, 실제 실험적 측정치를 통한 결과 확인이 필요합니다.", "future_work": "실제 해당 재료들에 대한 초고속 광학 측정 및 스핀 광전류 생성 실험이 이어져야 합니다.", "concepts": [{"term": "알터자성 (Altermagnetism)", "why_emerged": "기존 강자성/반강자성으로 분류되지 않는, 스핀 분할 밴드 구조를 가진 새로운 자기 질서 형태를 기술하기 위해 필요.", "origin": "최근 2020년대 들어 이론적으로 정립됨.", "connections": "반강자성체, 비상반적 수송 현상, 스핀-궤도 토크."}, {"term": "비선형 광전류 (Nonlinear Photocurrent)", "why_emerged": "광학적 여기를 통해 재료 내에서 전류를 유도하고 제어하기 위해 대칭성 기반의 비선형 응답을 이해할 필요가 있음.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "벌크 광전 효과(BPVE), 이동 전류(Shift current), 주입 전류(Injection current)."}], "english_summary": ["Analyzed nonlinear photocurrents in magnetic MnS2 and MnSe2.", "Identified symmetry-allowed shift and injection currents using magnetic point groups.", "Showed that altermagnetic order in MnSe2 allows unique spin photocurrent responses.", "Highlighted the crucial role of spin-orbit coupling in magnetic transport phenomena."]}}, {"title": "Polarization vortices in a ferromagnetic metal via twistronics", "journal": "Nature_Materials", "source": "Gemini", "link": "https://www.nature.com/articles/s41563-026-02755-8", "authors": "Yingzhuo Lun, Xinxin Hu, Qi Ren, et al.", "last_authors": "Jordi Arbiol, Gustau Catalan", "summary": "Polar topological states are realized in stacked and twisted 10-nm-thick metallic ferromagnetic SrRuO3 membranes, and their emergence is attributed to flexoelectric effects arising from shear strain gradients.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Topological states in twisted ferromagnetic metal, relevant to moire systems and magnetic topology.", "tags": ["twistronics", "topological", "ferromagnet", "quantum_materials"], "image": "https://media.springernature.com/m685/springer-static/image/art%3A10.1038%2Fs41563-026-02755-8/MediaObjects/41563_2026_2755_Fig1_HTML.png", "briefing": {"background": "강자성 금속 박막 내에서 위상학적 구조를 형성하는 것은 스핀트로닉스 소자의 고밀도 정보 저장 가능성 때문에 활발히 연구되고 있습니다.", "motivation": "트위스트로닉스(twistronics) 기술을 활용하여 박막 강자성 금속인 SrRuO3에서 위상학적 극성 소용돌이(polar vortex)를 구현하고자 합니다.", "result": "10nm 두께의 SrRuO3 막을 적층하고 비틀어(twist) 전단 변형 기울기(shear strain gradient)를 유도함으로써, 유연전기 효과(flexoelectric effect)를 통해 위상학적 극성 상태를 생성했습니다.", "implication": "기존의 유전체나 강유전체가 아닌 강자성 금속에서도 기계적 비틀림을 통해 위상학적 위상 구현이 가능함을 입증했습니다.", "novelty": "트위스트로닉스 원리를 강자성 금속 박막에 적용하여 위상학적 구조를 제어할 수 있는 새로운 경로를 제시했습니다.", "unresolved": "극성 소용돌이 상태의 동역학적 특성과 외부 필드에 대한 안정성 연구가 미흡합니다.", "future_work": "이러한 위상학적 소용돌이 상태를 이용한 자기 메모리 및 논리 소자 구현 연구가 예상됩니다.", "concepts": [{"term": "트위스트로닉스 (Twistronics)", "why_emerged": "2D 층상 구조를 쌓고 비틀어 계면의 모아레 패턴을 조절하여 물성을 제어하기 위해 등장.", "origin": "2018년 MIT의 Pablo Jarillo-Herrero 그룹에 의해 널리 알려짐.", "connections": "마법 각도 그래핀, 층상 재료, 적층 공학."}, {"term": "유연전기 효과 (Flexoelectric effect)", "why_emerged": "재료 내의 변형 기울기에 의해 분극이 유도되는 현상을 설명하기 위해 필요.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "압전 효과, 스트레인 엔지니어링, 강유전성."}], "english_summary": ["Realized polar topological vortices in metallic ferromagnetic SrRuO3 membranes.", "Utilized twisting to introduce shear strain gradients.", "Demonstrated the emergence of topological states via flexoelectric effects.", "Expands the scope of twistronics to ferromagnetic metal systems."]}}, {"title": "Single-stripe magnetic order and bilayer spin dynamics in single-crystalline La3Ni2O7", "journal": "Nature_Materials", "source": "Gemini", "link": "https://www.nature.com/articles/s41563-026-02768-3", "authors": "Lixing Chen, Enkang Zhang, Yiqing Hao, et al.", "last_authors": "Qisi Wang, Jun Zhao", "summary": "Momentum-resolved neutron scattering of a mosaic of single crystals of La3Ni2O7, a parent compound of nickelate superconductors, is reported. The magnetic behaviour of these nickelate crystals is distinct from that of cuprates and furthers our understanding of the origin of superconductivity in this class of materials.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Neutron scattering on nickelate superconductor parent compound, relevant  used to control the propagation of light emission by geometric phase, but it is challenging to accomplish using monolayer materials because of lacking optical resonance in atomic thickness. Furthermore, the manipulation of the optical geometric phase based on spin angular momentum beams typically offers only two tunable states. Here, we report optical control of free-space routing of second harmonic generation in monolayer MoS 2 assisted by photonic orbital angular momenta. The experimental directionality of the second harmonic light can reach 0.84. Moreover, we can dynamically route the second harmonic generation signal on the engineered monolayer MoS 2 with four directions, showing high-order information encryption. Our findings thus provide great flexibility and more degrees of freedom in nonlinear optical modulation, integrated photonics, and dynamic flat optics.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Relevant 2D material (MoS2) study exploring orbit-orbit coupling and light-matter interactions.", "tags": ["mos2", "2d-materials", "optics"], "image": "", "briefing": {"background": "나노 포토닉스와 양자 정보 처리에서 빛의 방출 방향을 제어하는 것은 핵심 과제입니다. 기존의 메타표면은 주로 스핀 각운동량에 기반하여 빛의 경로를 제어했지만, 원자층 두께의 2차원 물질에서는 공진 특성 부족으로 인해 이를 구현하기가 매우 어렵습니다.", "motivation": "단층 MoS2에서 광학적 궤도-궤도 결합(orbit-orbit coupling)을 활용하여 비선형 광학 응답인 제2조화파 생성(SHG)의 방출 방향을 동적으로 조절하고자 하는 목적에서 수행되었습니다.", "result": "광자 궤도 각운동량(OAM)을 이용하여 MoS2에서 방출되는 제2조화파의 방향을 4가지 방향으로 동적 라우팅하는 데 성공했습니다. 방출 지향성은 최대 0.84에 달합니다.", "implication": "단층 물질에서도 광학적 자유도를 다중으로 제어할 수 있음을 보여주며, 이는 온-칩 광학 소자, 암호화 및 비선형 광학 변조 기술의 새로운 플랫폼을 제공합니다.", "novelty": "기존의 스핀 기반 제어(2가지 상태)를 넘어 궤도 각운동량을 도입함으로써 더 높은 자유도의 정보 제어가 가능해졌으며, 2차원 물질 기반의 평면 광학 소자 설계에 중요한 진전을 이루었습니다.", "unresolved": "실제 상용화를 위해서는 대면적 균일성 확보와 방출 효율의 추가적인 극대화가 필요하며, 극한의 나노 스케일에서 발생하는 광학적 노이즈에 대한 분석이 필요합니다.", "future_work": "더 복잡한 정보 암호화 방식 구현 및 MoS2 외의 다른 전이금속 디칼코게나이드(TMD) 재료를 활용한 비선형 광학 장치 확장 연구가 기대됩니다.", "concepts": [{"term": "제2조화파 생성 (SHG)", "why_emerged": "비선형 광학 매질 derived from FeTe’s topological band structure once the zero-field symmetry constraint is lifted. The unconventional scaling of AHE highlights the intricate interplay between antiferromagnetism, topology, and electronic transport in FeTe.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Anomalous Hall effect and antiferromagnetism are directly relevant to topological and magnetic materials interest.", "tags": ["anomalousHall", "antiferromagnet", "topology"], "image": "", "briefing": {"background": "반강자성체에서의 비정상 홀 효과(AHE)는 순자화값이 0임에도 불구하고 위상학적 밴드 구조와 베리 곡률(Berry curvature)에 의해 발생할 수 있어 차세대 스핀트로닉스 재료로서 큰 관심을 받고 있습니다.", "motivation": "바이콜리니어(bicollinear) 반강자성 구조를 가지는 FeTe 박막에서 나타나는 자기적 상쇄와 밴드 재규격화가 AHE에 미치는 영향을 규명하고자 했습니다.", "result": "FeTe 박막에서 Néel 온도(60K) 이하에서 큰 AHE를 확인했습니다. 특히 49K 근처에서 자기장에 따라 비선형적인 AHE 스케일링이 나타나며, 이는 자기장에 의한 자기 모멘트의 캔팅(canting)이 베리 곡률을 조정하기 때문임을 밝혔습니다.", "implication": "자기 대칭성이 제약된 반강자성체에서 외부 필드로 위상학적 성질을 제어할 수 있음을 입증하여, 반강자성 스핀트로닉스 소자 개발의 가능성을 열었습니다.", "novelty": "기존 강자성체와 다른, 반강자성체의 특유한 대칭성 깨짐과 위상학적 밴드 구조의 상관관계를 통해 AHE의 비단조적 스케일링을 설명한 점이 독창적입니다.", "unresolved": "FeTe의 밴드 구조에서 나타나는 Kondo 상호작용과 AHE 사이의 정량적 관계, 그리고 더 넓은 온도 범위에서의 거동은 여전히 연구가 필요합니다.", "future_work": "다른 van der Waals 반강자성 물질로의 확장 연구 및 위상학적 홀 전도도와 자기 구조 간의 직접적인 상관관계 연구가 예상됩니다.", "concepts": [{"term": "비정상 홀 효과 (AHE)", "why_emerged": "자성 물질 내부의 스핀-궤도 결합과 베리 곡률이 전자 수송에 미치는 영향을 이해하기 위해 필요합니다.", "origin": "Edwin Hall (1881)에 의해 발견된 이후, Karplus와 Luttinger (1954)에 의해 이론적으로 다루어졌습니다.", "connections": "베리 위상, 스핀 홀 효과, 위상학적 반강자성체."}, {"term": "바이콜리니어 반강자성체", "why_emerged": "FeTe와 같은 물질의 특이한 자기적 질서를 설명하기 위해 도입된 구조적 기술어입니다.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "자기적 상쇄 구조, 스핀-격자 결합, 2차원 van der Waals 자성체."}], "english_summary": ["Investigated anomalous Hall effect (AHE) in bicollinear antiferromagnetic FeTe thin films.", "Reported nonmonotonic AHE scaling driven by field-induced magnetic canting.", "Linked observed transport to tunable Berry curvature in the topological band structure.", "Demonstrates high potential for antiferromagnetic spintronic applications."]}}, {"title": "Correlated Metals, Metamagnetism, and Orbital Nematic Order in moir\\'e Materials with Neural Quantum States", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2610.03145", "authors": "Wei Zhang, Ata\\c{c} \\.Imamo\\u{g}lu, Tao Shi, Eugene A. Demler, Ivan Morera", "last_authors": "Eugene A. Demler, Ivan Morera", "summary": "The interplay between kinetic energy, strong interactions, and external periodic potentials gives rise to a rich landscape of correlated quantum phases. In this work, we investigate this interplay in a continuum model of two-dimensional electrons interacting via long-range Coulomb forces and subject to a triangular periodic potential at filling factor ν = 2 \\nu=2 . Using neural quantum states based on message-passing neural networks optimized with variational Monte Carlo, we determine the ground-state phase diagram as a function of periodic potential strength and Zeeman field. Although the noninteracting system is expected to form a conventional band insulator, we show that strong correlations can qualitatively reshape the insulating state and, in part of the phase diagram, suppress the band insulator in favor of a correlated metallic phase, with a first-order transition separating the two regimes. Moreover, the metal–insulator transition exhibits a strong dependence on spin polarization: the unpolarized system becomes insulating at substantially weaker periodic potentials through the formation of an s s -wave molecular insulator, where opposite-spin electrons bind near each potential minimum, whereas the fully polarized system requires a significantly deeper potential and instead forms a symmetry-broken orbital nematic molecular crystal. This spin-dependent molecular transition gives rise to discontinuous magnetization curves, metamagnetic transitions, and several multicritical points in the phase diagram, together with clear signatures in the density profiles, real-space correlation functions, and structure factors. To further elucidate the role of the long-range character of the Coulomb interaction, we also study short-range repulsive interactions, which can be realized with ultracold-atom platforms. We find that the qualitative structure of the many-body phase diagram remains unchanged, demonstrating the robustness of our results across different interaction models.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Relevance to moire materials, nematicity, and correlated electron systems.", "tags": ["moire", "nematicity", "correlated"], "image": "https://arxiv.org/html/2610.03145v1/key_map6.png", "briefing": {"background": "모아레 격자는 전자 상관관계와 외부 퍼텐셜을 조절할 수 있는 이상적인 플랫폼으로, 밴드 절연체와 상관 금속 사이의 경쟁적인 양자 위상을 이해하는 것은 강상관 전자계의 핵심 과제입니다.", "motivation": "변분 몬테카를로(VMC) 방법과 신경망 양자 상태(Neural Quantum States)를 결합하여, 모아레 시스템에서 filling factor가 2일 때의 상 다이어그램과 메타자성 전이를 해석하고자 했습니다.", "result": "강한 상관관계가 밴드 절연체를 억제하고 상관 금속상을 생성할 수 있음을 보였습니다. 특히 스핀 편극에 따라 s-파 분자 절연체 또는 궤도 네마틱 분자 결정으로 상전이가 달라지는 '스핀 의존적 분자 전이'를 규명했습니다.", "implication": "모아레 시스템에서의 비연속적인 자화 곡선과 메타자성 전이를 이론적으로 설명했으며, 이는 실제 실험에서 관측되는 복잡한 강상관 거동의 근본 원인을 제공합니다.", "novelty": "신경망을 활용한 양자 상태 연구를 통해 기존 평균장 이론으로 다루기 어려웠던 복잡한 상관 상 다이어그램을 고해상도로 분석한 점이 매우 새롭습니다.", "unresolved": "신경망 기반 모델이 실제 실험상의 국소적 결함이나 층간 비균일성을 얼마나 잘 반영할 수 있는지에 대한 검증이 남아 있습니다.", "future_work": "극저온 원자 시스템 시뮬레이션 및 실제 모아레 물질(예: tDBG)의 실험적 자기 측정 데이터와의 직접적인 비교 연구가 이어질 것입니다.", "concepts": [{"term": "궤도 네마틱 질서", "why_emerged": "전자의 궤도 자유도가 회전 대칭성을 깨고 방향성을 가질 때 나타나는 상을 설명하기 위해 필요합니다.", "origin": "초록 정보만으로는 특정하기 어려움 (강상관 물리 분야에서 활발히 논의).", "connections": "포머란척(Pomeranchuk) 효과, 전자 네마틱성, 전이금속 산화물."}, {"term": "신경 양자 상태 (NQS)", "why_emerged": "다체 양자 파동함수를 효율적으로 표현하기 위해 기계 학습의 신경망 구조를 도입한 방법론입니다.", "origin": "Carleo and Troyer (2017)에 의해 확립되었습니다.", "connections": "변분 몬테카를로, 다체 파동함수, 양자 다체계 시뮬레이션."}], "english_summary": ["Utilized neural quantum states to explore correlated phases in moiré systems.", "Identified spin-dependent transitions between band insulators, molecular insulators, and orbital nematic states.", "Demonstrated that correlations suppress band insulation, leading to correlated metallic phases.", "Provides a robust theoretical framework for metamagnetism and nematic order in moiré materials."]}}, {"title": "First-principles description of pumped inelastic X-ray scattering: example of K-edge RIXS in graphite", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2606.09440", "authors": "Elias Richter, Benedikt Maurer, Claudia Draxl", "last_authors": "Benedikt Maurer, Claudia Draxl", "summary": "We present an $\\textit{ab initio}$ framework for predicting resonant inelastic X-ray scattering (RIXS) in optically pumped materials. Our methodology is based on the Kramers-Heisenberg formula for the double-differential cross section formulated using the results of the Bethe-Salpeter equation (BSE) from many-body perturbation theory. To extend this approach to the time domain, we incorporate non-equilibrium charge-carrier distributions obtained from real-time, time-dependent density-functional theory (RT-TDDFT). Generalizing the RIXS implementation with respect to arbitrary polarizations, allows us to consider different orientations of incoming and outgoing light. We demonstrate our method's capabilities by studying RIXS at the K-edge of graphite for various non-equilibrium charge-carrier distributions, representing different delay times after optical pumping. Our results reveal angular dependencies in $\\pi$- and $\\sigma$-orbital-derived spectral regions, in good agreement with experiment.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Theoretical framework for pumped RIXS, a key experimental interest of the user.", "tags": ["method", "RIXS", "electronic-structure"], "image": "https://arxiv.org/html/2606.09440v3/figures/bs_dos_pz.png", "briefing": {"background": "강한 상관관계가 있는 물질이나 비평형 상태의 전자 구조를 연구하기 위해 RIXS(공명 비탄성 X선 산란)는 중요한 실험적 도구입니다. 하지만 시간에 따라 변하는 비평형 상태(예: 광펌핑 직후)에서의 RIXS 데이터를 이론적으로 예측하고 해석하는 것은 매우 복잡한 문제입니다.", "motivation": "광학적으로 펌핑된 물질의 비평형 전자 상태에서 RIXS 스펙트럼을 예측할 수 있는 최초의 'ab initio' 프레임워크를 정립하고자 함.", "result": "Kramers-Heisenberg 공식과 Bethe-Salpeter 방정식(BSE), 실시간 시간 의존 밀도범함수 이론(RT-TDDFT)을 결합하여 펌핑된 흑연의 K-edge RIXS 스펙트럼을 계산했으며, 실험 결과와 잘 일치함을 보임.", "implication": "이 프레임워크를 통해 초고속 펌프-프로브 RIXS 실험에서 관찰되는 전자 구조의 비평형 동역학을 이론적으로 정밀하게 해석할 수 있게 됨.", "novelty": "비평형 상태의 전자 분포를 RT-TDDFT로 구현하고, 이를 BSE 기반의 RIXS 계산과 결합함으로써 시간 영역에서의 전자 전이를 직접적으로 다룰 수 있다는 점에서 매우 강력한 방법론임.", "unresolved": "계산 비용이 매우 클 것으로 예상되며, 흑연과 같이 상대적으로 잘 이해된 시스템이 아닌 고도화된 상관계 물질에 적용할 때의 한계점은 명확하지 않음.", "future_work": "보다 복잡한 강상관 전이금속 화합물이나 초전도체에서의 펌프-프로브 RIXS 실험 결과 해석 및 예측으로의 확장.", "concepts": [{"term": "RIXS", "why_emerged": "물질 내의 전자, 스핀, 격자 엑시테이션을 에너지와 운동량 분해능을 가지고 동시에 측정하기 위해 필요.", "origin": "1970년대 이론적 제안 이후 싱크로트론 광원의 발전과 함께 2000년대 이후 본격적으로 확립.", "connections": "ARPES와 상호보완적이며, 중성자 산란과는 운동량 전달 범위와 민감도 면에서 차이가 있음."}, {"term": "RT-TDDFT", "why_emerged": "물질이 강한 빛을 받았을 때 발생하는 전자들의 실시간 비평형 동역학을 시뮬레이션하기 위해 필요.", "origin": "Runge와 Gross에 의해 1984년 정립.", "connections": "BSE와 결합하여 들뜬 상태의 엑시톤 효과를 포함한 동역학 연구에 활용됨."}, {"term": "Bethe-Salpeter equation (BSE)", "why_emerged": "DFT만으로는 전자-정공 상호작용(엑시톤) 효과를 정확히 기술할 수 없어 도입됨.", "origin": "초기 양자장론에서 유래, 고체 물리학에서는 2000년대 초반부터 엑시톤 계산에 널리 활용.", "connections": "GW 근사법과 함께 사용되어 들뜬 전자 구조 계산의 표준으로 자리 잡음."}], "english_summary": ["Presents an ab initio framework for predicting RIXS in non-equilibrium optically pumped materials.", "Combines Kramers-Heisenberg formula with BSE and RT-TDDFT to model time-domain spectral response.", "Demonstrates success in capturing angular dependencies of K-edge RIXS in graphite after pumping.", "Provides a robust computational tool for interpreting time-resolved RIXS experiments in complex materials."]}}, {"title": "Flat band in the multibandmetal MnSb2", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2604.25324", "authors": "Carl Jonas Linnemann, Davide Ceresoli, Kim-Khuong Huynh, Martin Bremholm", "last_authors": "Kim-Khuong Huynh, Martin Bremholm", "summary": "We report the realization of a metallic flat band in the marcasite compound MnSb$_2$. The material was synthesized under high pressure, and its crystal structure was established by X-ray diffraction. Electrical and thermoelectric transport measurements reveal signatures of a flat band near the Fermi level that persist across three structural, magnetic, and electronic transitions. These observations are supported by extensive density-functional-theory calculations. Related marcasite diantimonides, including FeSb$_2$ and CrSb$_2$, also host flat bands, but these lie far from the Fermi level and therefore do not produce a metallic flat-band state. MnSb$_2$ therefore emerges as the only known metallic marcasite antimonide in which a flat band lies in the vicinity of the Fermi level.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Identification of a metallic flat band near the Fermi level in a marcasite compound, relevant to electronic structure.", "tags": ["material", "flatband", "electronic-structure"], "image": "https://arxiv.org/html/2604.25324v2/Fig1.png", "briefing": {"background": "평탄한 에너지 밴드(Flat band)는 전자 간의 운동 에너지를 억제하여 강한 상관관계 효과를 유도하기 때문에, 비전통적인 초전도성이나 자기적 질서를 연구하는 분야에서 매우 중요하게 다뤄집니다.", "motivation": "마카사이트(marcasite) 구조를 가진 물질군 중에서 페르미 준위 근처에 평탄한 밴드를 가지고 있어 금속성을 띠는 새로운 후보군을 찾고자 함.", "result": "MnSb2가 페르미 준위 근처에 평탄한 밴드를 가지는 유일한 금속성 마카사이트 안티모니드임을 발견함.", "implication": "MnSb2가 강상관 전자계 물성을 탐구할 수 있는 새로운 실험적 플랫폼이 될 수 있음을 시사함.", "novelty": "기존의 FeSb2나 CrSb2는 밴드가 페르미 준위에서 멀어 금속성을 띠지 않으나, MnSb2는 페르미 준위 근처에 위치하여 수송 현상에 직접적인 기여를 한다는 점이 새로운 발견임.", "unresolved": "이 평탄한 밴드가 구체적으로 어떤 강상관 물성(예: 초전도, 자기적 불안정성)을 유도하는지에 대한 실험적 증거는 아직 부족함.", "future_work": "ARPES를 통한 직접적인 밴드 구조 관측과 저온에서의 비전통적 물성(초전도성 등) 탐색.", "concepts": [{"term": "Flat band", "why_emerged": "밴드의 분산이 거의 없어 전자 상태 밀도가 매우 높고, 따라서 상관관계 효과가 극대화되는 시스템을 연구하기 위해 필요.", "origin": "초록 정보만으로는 특정하기 어려움 (강상관 물리 분야의 고전적 개념).", "connections": "모아레 격자 시스템(twisted bilayer graphene)이나 kagome 금속에서의 평탄한 밴드 연구와 연결됨."}, {"term": "Marcasite structure", "why_emerged": "황철석(pyrite)의 동질이상 구조로, 독특한 금속-금속 결합 특성을 가진 결정 구조 유형.", "origin": "19세기 초 광물학적 발견.", "connections": "FeSb2 등 열전 재료 연구에서 중요한 구조적 배경이 됨."}], "english_summary": ["Identifies a metallic flat band near the Fermi level in the marcasite compound MnSb2.", "Distinguishes MnSb2 from related marcasite diantimonides like FeSb2, where flat bands are far from the Fermi level.", "Utilizes electrical and thermoelectric transport measurements alongside DFT calculations.", "Positions MnSb2 as a unique candidate for studying flat-band physics in metallic systems."]}}, {"title": "Fractionalization-Induced Time-Reversal Symmetry Breaking at Continuous Superconducting Transitions in Low-Symmetry Kondo Lattices (LA-UR-26-28763)", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2610.02635", "authors": "Wonjune Choi, Shi-Zeng Lin", "last_authors": "Wonjune Choi, Shi-Zeng Lin", "summary": "In conventional Landau theory, simultaneous continuous onset of superconductivity and the breaking of additional symmetries generally requires a multidimensional order parameter or fine tuning. We show that symmetry fractionalization provides a different route. In a Kondo lattice with a $\\mathbb Z_2$ spin liquid, the Kondo fields inherit the projective symmetry action of the spinons. When the projective time-reversal action on these fields squares to $-1$, the projective symmetry algebra forbids a condensate that preserves time-reversal symmetry and enforces twofold degeneracy of the critical modes. Because Kondo condensation in a $\\mathbb Z_2$ spin liquid also breaks electromagnetic $U(1)$ symmetry, superconductivity and time-reversal symmetry breaking can emerge at a single continuous transition, even if crystal symmetry admits only one-dimensional irreducible repre 터와 비교하는 연구.", "concepts": [{"term": "Symmetry fractionalization", "why_emerged": "스핀 액체와 같이 강한 상관관계가 있는 시스템에서 관측되는 대칭성 깨짐 현상을 기술하기 위해 필요.", "origin": "초록 정보만으로는 특정하기 어려움 (위상적 정렬 분야에서 발전).", "connections": "분수 양자 홀 효과, Z2 스핀 액체 및 위상적 초전도 이론과 깊게 연결됨."}, {"term": "Kondo lattice", "why_emerged": "국소 자기 모멘트와 전도 전자 사이의 상호작용으로 발생하는 복합적인 전자 상태를 연구하기 위해 도입.", "origin": "Kondo 효과에서 파생되어 1970년대 이후 무거운 페르미온 연구의 핵심 모델이 됨.", "connections": "무거운 페르미온 초전도체, 근본적인 강상관 전자계 연구의 표준 모델."}, {"term": "TRSB", "why_emerged": "비전통적 초전도체에서 초전도 상태가 발생하는 동시에 자기적 정렬이 나타나는 현상을 설명하기 위해 필요.", "origin": "초록 정보만으로는 특정하기 어려움 (초전도 분야의 고전적 난제).", "connections": "뮤온 스핀 회전(muSR) 실험이나 카이랄 초전도성 연구와 밀접함."}], "english_summary": ["Proposes symmetry fractionalization as a mechanism for concurrent superconductivity and TRSB.", "Demonstrates that Z2 spin liquids in Kondo lattices naturally allow this simultaneous transition.", "Shows that projective symmetry algebra enforces TRSB upon Kondo condensation.", "Provides a theoretical framework relevant to unconventional superconductivity in Kondo lattice systems."]}}, {"title": "Layer-Asymmetry-Induced Topological Superconductivity in High-Tc Bilayer Nickelates", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2610.03601", "authors": "Zhongyi Zhang, Congcong Le, Hoi Chun Po, Jiangping Hu, Xianxin Wu, Shengshan Qin", "last_authors": "Xianxin Wu, Shengshan Qin", "summary": "The recent discovery of high-T$_c$ superconductivity in bilayer nickelates has highlighted the crucial role of interlayer coupling and motivated proposals for dominant interlayer pairing. Whether such pairing can support topological superconductivity, however, remains unexplored. Here, we demonstrate that substrate-supported bilayer nickelate thin films can host an intrinsic time-reversal-invariant topological superconducting phase protected by diagonal mirror symmetry. Using a two-orbital model derived from first-principles calculations, we show that a modest layer-asymmetric potential and layer-staggered Rashba spin-orbit coupling drive the system into this topological phase over a broad parameter range with a dominant interlayer pairing. The nontrivial topology arises from a reversal of the pairing sign on one of the spin-split bonding Fermi surfaces and is characterized by a nonzero mirror winding number along the diagonal direction, as well as a Majorana Kramers pair at the [11] edge. The phase also features bulk gap nodes located slightly away from the diagonal directions, featuring chiral charge and zero-energy flat bands. We discuss experimental routes for realizing and tuning this phase. Our results establish high-T$_c$ bilayer nickelates as a promising platform for topological superconductivity, where tunable topological transitions and Majorana boundary modes can provide probes of unconventional pairing.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Theory on bilayer nickelates predicting topological superconductivity and Majorana modes in a high-Tc material.", "tags": ["theory", "nickelate", "topologicalsuperconductivity"], "image": "https://arxiv.org/html/2610.03601v1/fig_DFT.png", "briefing": {"background": "최근 이중층 니켈산염(bilayer nickelate)에서 고온 초전도성이 발견되면서, 층간 결합과 층간 페어링 메커니즘에 대한 관심이 급증하고 있습니다. 이 물질군이 토폴로지적 초전도성을 구현할 수 있는지 여부는 차세대 양자 소자 및 위상 물질 연구의 핵심 과제입니다.", "motivation": "이 논문은 기판 위에 놓인 이중층 니켈산염 박막에서 층간 비대칭성과 층간 스태거드 라쉬바(Rashba) 스핀-궤도 결합을 도입하여 토폴로지적 초전도 위상을 구현할 수 있는지 이론적으로 조사하고자 합니다.", "result": "이중층 니켈산염이 대각선 거울 대칭성에 의해 보호받는 시간 반전 불변(time-reversal-invariant) 토폴로지적 초전도 위상을 가질 수 있음을 보였습니다. 특히 층간 비대칭 포텐셜이 있을 때 토폴로지적으로 비자명한 위상이 나타나며, [11] 에지에서 마요라나 크레이머스 쌍(Majorana Kramers pair)이 존재함을 확인했습니다.", "implication": "고온 초전도 니켈산염이 마요라나 모드를 포함한 토폴로지적 초전도를 연구하기 위한 새로운 플랫폼이 될 수 있음을 시사합니다. 이는 비통상적 초전도 페어링을 실험적으로 검증할 새로운 길을 제시합니다.", "novelty": "기존 니켈산염 연구가 주로 초전도 자체의 기원에 집중했다면, 이 연구는 층간 비대칭성을 활용해 토폴로지적 위상을 유도했다는 점에서 독창적입니다. 특히 마요라나 경계 모드를 예측하여 위상 양자 컴퓨팅 후보 물질로서 니켈산염의 잠재력을 높였습니다.", "unresolved": "이론적 모델링에 기초한 연구로, 실제 기판에서 층간 비대칭성을 정밀하게 제어하거나 박막 성장 시 요구되는 특정 조건을 실험적으로 구현하는 것은 여전히 과제로 남아 있습니다.", "future_work": "실제 실험에서 층간 비대칭성을 인위적으로 조절하는 방법(게이팅 또는 스트레인 엔지니어링) 및 에지에서의 제로 에너지 평탄 밴드를 직접 관측하기 위한 STM 분광학 실험이 필요합니다.", "concepts": [{"term": "층간 라쉬바 스핀-궤도 결합", "why_emerged": "반전 대칭성이 깨진 시스템에서 스핀과 운동량의 결합을 유도하여 토폴로지적 위상을 생성하기 위해 필요.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "라쉬바 효과, 토폴로지적 절연체, 스핀트로닉스"}, {"term": "마요라나 크레이머스 쌍", "why_emerged": "시간 반전 대칭을 유지하는 토폴로지적 초전도체에서 에지 상태를 기술하기 위해 도입.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "마요라나 페르미온, 위상 양자 컴퓨팅, 비통상적 초전도체"}], "english_summary": ["Proposes bilayer nickelates as a platform for topological superconductivity.", "Identifies that layer-asymmetric potentials and staggered Rashba SOC drive the system into a topological phase.", "Predicts the existence of Majorana Kramers pairs at the [11] edges.", "Suggests that topological transitions in these materials can probe unconventional pairing mechanisms."]}}, {"title": "Magnetic-field response of generalized Wigner crystals in twisted MoTe2", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2610.02493", "authors": "F. K. Wolff, S. Jiao, H. Park, J. Cai, E. Anderson, X. Liu, C. Wang, T. Taniguchi, K. Watanabe, X. Xu, D. Xiao, S. Vaitiek\\.{e}nas", "last_authors": "K. Watanabe, X. Xu, D. Xiao, S. Vaitiek\\.{e}nas", "summary": "We report a magnetotransport study of fractional hole-filling states in the layer-polarized regime of a twisted MoTe$_2$ homobilayer. A perpendicular magnetic field suppresses the resistance peak at the two-thirds filling while enhancing the one-third peak by several orders of magnitude. Both remain near their commensurate densities. We argue that these commensurate states are generalized Wigner crystals whose distinct charge configurations define different magnetic lattices, leading to contrasting responses to spin polarization. Near half filling, we observe a qualitatively different state whose resistance maximum shifts approximately quadratically with field and exhibits pronounced transport anisotropy consistent with a stripe phase. These results reveal a strong dependence of magnetotransport on fractional filling and open a route to magnetic control of transport in moir\\'e charge-ordered states.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Experimental magnetotransport study on moire systems.", "tags": ["twisted", "transport", "moire"], "image": "https://arxiv.org/html/2610.02493v1/fig1.png", "briefing": {"background": "트위스트된 모아레(moiré) 격자 시스템은 강한 상관관계에 의한 다양한 전자 위상을 관측할 수 있는 장을 제공합니다. 특히 모아레 밴드의 분수 충전(fractional filling) 상태에서 나타나는 절연체 및 결정 상태는 위그너 결정(Wigner crystal)과 같은 강상관 물리학의 핵심 연구 주제입니다.", "motivation": "트위스트된 MoTe2 호모빌레이어(homobilayer)에서 분수 충전 상태가 자기장에 어떻게 반응하는지 규명하여, 이들 상태의 본질(위그너 결정 vs 다른 상)을 파악하고자 합니다.", "result": "1/3 및 2/3 충전 상태에서 자기장에 따른 저항 피크의 상이한 거동을 관측했습니다. 이는 각 충전 상태가 서로 다른 자기 격자를 형성하는 일반화된 위그너 결정임을 시사하며, 1/2 충전 상태에서는 스트라이프(stripe) 상과 일치하는 강한 전도 이방성을 확인했습니다.", "implication": "모아레 시스템에서의 전하 질서가 외부 자기장에 의해 제어될 수 있음을 보여주며, 이는 강상관 모아레 물질에서 새로운 자기-전하 결합 현상을 탐구하는 기반이 됩니다.", "novelty": "자기장 반응을 통해 모아레 밴드 내 분수 상태의 전하 구성을 구분해냈다는 점이 핵심입니다. 특히 1/2 충전 상태의 이방성 관측은 모아레 계에서 나타나는 네마틱(nematic) 성질 연구와도 맞닿아 있습니다.", "unresolved": "관측된 분수 상태가 정확히 어떤 자기적 상호작용에 의해 지배되는지, 그리고 이들 상 간의 위상 전이 경계가 어떻게 되는지는 추가 연구가 필요합니다.", "future_work": "자기장 하에서의 저항 이방성을 보다 정밀하게 측정하고, 온도가 높아짐에 따라 이러한 전하 정렬 상태가 어떻게 붕괴하는지 연구할 필요가 있습니다.", "concepts": [{"term": "일반화된 위그너 결정", "why_emerged": "강한 쿨롱 상호작용으로 인해 모아레 격자 전자가 국소화되어 결정 격자를 형성하는 상태를 설명하기 위해 도입.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "위그너 결정, 모아레 초격자, 강상관 전자계"}, {"term": "스트라이프 상", "why_emerged": "강상관 물질에서 전하가 방향성을 띠고 정렬되는 이방성 위상을 설명하기 위해 도입.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "네마틱 상, 전하 밀도 파(CDW), 고온 초전도체"}], "english_summary": ["Investigates the magnetotransport properties of fractional filling states in twisted MoTe2.", "Observes distinct magnetic responses at 1/3 and 2/3 filling, supporting the generalized Wigner crystal model.", "Identifies transport anisotropy at 1/2 filling consistent with stripe phase formation.", "Highlights the potential for magnetic control of moiré charge-ordered states."]}}, {"title": "Sideband fingerprint of the Leggett mode in terahertz two-dimensional coherent spectroscopy of multiband superconductors", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2610.02978", "authors": "Silvia Neri, Ryo Shimano, Dirk Manske, Naoto Tsuji", "last_authors": "Dirk Manske, Naoto Tsuji", "summary": "Collective modes of the superconducting condensate encode fundamental information on the pairing interaction, yet their direct detection remains experimentally challenging. In multiband superconductors, the Leggett mode, i.e., a coherent oscillation of the relative phase between two condensates, is Raman-active and couples to light only nonlinearly in ordinary situations. Here we show theoretically that terahertz two-dimensional coherent spectroscopy (2DCS) provides a direct fingerprint of the Leggett mode (with frequency $\\omega_L$) through sideband emission at the detection frequency $\\omega_t = \\omega_L\\pm\\Omega$ ($\\Omega$ is the central frequency of the incident pulses) in the nonlinear 2D spectrum. The key insight is that the finite duration of the THz pulses is the physical mechanism that makes the mode accessible: the broad spectral content of a finite pulse provides the nonlinear frequency combinations needed to resonantly excite the mode at {\\omega}L without any prior knowledge of its value or tuning of external parameters. We demonstrate robustness of this signature against temperature and quasiparticle relaxation, and show that sweeping $\\Omega$ allows unambiguous identification of the Leggett mode.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Relevant spectroscopy study for unconventional superconductors, fits experimental condensed-matter profile.", "tags": ["superconduct", "spectroscopy", "THz"], "image": "https://arxiv.org/html/2610.02978v1/figures/scheme_main2.png", "briefing": {"background": "다밴드 초전도체에서 전하 밀도 파나 초전도 질서 변수와는 다른, 초전도 응축액 내의 위상(phase)이 진동하는 '레깃 모드(Leggett mode)'는 초전도 페어링 메커니즘에 대한 중요한 정보를 담고 있으나 실험적 검출이 매우 어렵습니다.", "motivation": "THz 2차원 결맞음 분광학(2DCS)을 이용해 비선형 광학 신호에서 레깃 모드의 흔적(fingerprint)을 이론적으로 식별하고, 이를 통해 모드를 직접 관측하는 방법을 제시하고자 합니다.", "result": "THz 펄스의 유한한 지속 시간이 레깃 모드를 공명적으로 들뜨게 하는 메커니즘을 제공하며, 2D 스펙트럼에서 측면 대역(sideband) 방출이 레깃 모드의 직접적인 증거가 됨을 증명했습니다. 중심 주파수를 스윕함으로써 주파수를 알지 못해도 모드를 식별할 수 있습니다.", "implication": "향후 다밴드 초전도체(예: 철 기반 초전도체나 MgB2 등)에서 레깃 모드를 실험적으로 관측하고 페어링 상호작용을 정밀 분석하는 강력한 분광학적 도구가 될 것입니다.", "novelty": "레깃 모드가 광학적으로 비선형적으로만 결합하는 난제를 해결하기 위해 THz 2DCS의 펄스 지속 시간을 활용했다는 점이 혁신적입니다. 이는 다밴드 비통상적 초전도체의 동역학 연구에 크게 기여할 것입니다.", "unresolved": "이론적 제안이므로, 실제로 매우 짧은 THz 펄스를 생성하고 정밀한 비선형 응답을 측정하는 높은 수준의 실험 환경 구축이 필요합니다.", "future_work": "FeSe 또는 다밴드 닉타이드 초전도체와 같은 실제 물질에 대해 THz 2DCS 실험을 수행하여 레깃 모드 분광학적 증거를 확보하는 작업이 예상됩니다.", "concepts": [{"term": "레깃 모드", "why_emerged": "두 개 이상의 초전도 갭이 존재하는 다밴드 초전도체에서, 각 밴드 간의 상대적인 위상이 진동하는 모드를 설명하기 위해 도입.", "origin": "A. J. Leggett (1966)", "connections": "다밴드 초전도성, 힉스 모드, 초전도 집단 들뜸"}, {"term": "THz 2DCS", "why_emerged": "물질의 비선형 동역학을 조사하고 서로 다른 들뜸 간의 결합을 시간-주파수 영역에서 분석하기 위해 필요.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "비선형 분광학, 초고속 동역학, 초전도 집단 모드"}], "english_summary": ["Provides a theoretical framework for detecting the Leggett mode in multiband superconductors.", "Utilizes THz 2D coherent spectroscopy to extract the Leggett mode via sideband emission.", "Shows that the finite duration of THz pulses enables resonance without prior knowledge of the mode frequency.", "Demonstrates the method's robustness against temperature and quasiparticle relaxation."]}}, {"title": "The AI Theorist reveals excitonic structure in -RuCl3", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2610.02417", "authors": "Hongjian Zhou, Xianfan Nie, Sean Wu, et al.", "last_authors": "Adam Wei Tsen, David A. Clifton", "summary": "Advances in experimental instrumentation and automation generate increasingly rich datasets, but turning experimental observations into microscopic understanding remains a bottleneck in scientific discovery. To accelerate this process, we introduce AI Theorist, a system of artificial intelligence (AI) agents for autonomous discovery of physical models through hypothesis generation, first-principles calculations and evidence-driven refinement. We apply the framework to $\\alpha$-RuCl$_3$, a leading candidate material for realizing a Kitaev quantum spin liquid, to investigate its electronic structure through optical spectra. AI Theorist develops a new interpretation of the optical and photocurrent observations, identifying distinct excitonic states with contrasting optical selection rules and real-space distributions. To our knowledge, this is the first demonstration of an AI system autonomously developing a physical model to explain previously unpublished experimental observations in a quantum material, utilizing first-principles electronic-structure and many-body calculations. Our results establish a route to autonomous theoretical discovery in materials science, in which AI agents use first-principles calculations to turn experimental observations into physical models and testable predictions.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Study of excitonic structure in alpha-RuCl3, a major Kitaev material of interest in quantum materials.", "tags": ["material", "alpha-RuCl3", "Kitaevspinliquid"], "image": "https://arxiv.org/html/2610.02417v1/figure1_abc.png", "briefing": {"background": "양자 스핀 액체(QSL) 후보 물질인 alpha-RuCl3와 같은 강상관 전자계에서 복잡한 다체 효과와 엑시톤 구조를 규명하는 것은 물질의 양자 상태를 이해하는 데 핵심적이지만, 방대한 실험 데이터에서 물리적 모델을 추출하는 과정은 오랜 시간 인간 연구자의 직관에 의존해 왔습니다.", "motivation": "실험 데이터의 비약적 증가로 인해 데이터 분석과 이론적 모델 구축 사이의 병목 현상이 발생하고 있으며, 이를 해결하기 위해 AI 에이전트가 직접 가설을 생성하고 제일원리 계산을 통해 검증하는 자동화된 연구 프레임워크인 'AI Theorist'를 제안하고자 합니다.", "result": "AI Theorist를 통해 alpha-   else { title.textContent = r.title || ''; }

  if (r.link) { const link = document.createElement('a'); link.className = 'link'; link.href = r.link; link.target = '_blank'; link.rel = 'noopener noreferrer'; link.textContent = 'Open paper'; headText.appendChild(link); }
