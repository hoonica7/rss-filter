<title>Daily Paper Slideshow</title>
<style>
  :root {
    color-scheme: light;
    --bg: #f6f7f4;
    --paper: #ffffff;
    --ink: #111827;
    --muted: #64748b;
    --line: #d8ddd2;
    --accent: #176b87;
    --accent-2: #9a3412;
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; overflow: auto; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: var(--bg); color: var(--ink); }
  .shell { max-width: 1500px; min-height: 100vh; margin: 0 auto; padding: 14px 18px; display: flex; flex-direction: column; }
  .topbar { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 16px; }
  .top-actions { display: flex; align-items: center; gap: 10px; }
  .topbar a, button { border: 1px solid var(--line); border-radius: 8px; background: var(--paper); color: var(--ink); padding: 10px 14px; font-weight: 700; text-decoration: none; cursor: pointer; }
  button.primary { background: var(--accent); border-color: var(--accent); color: white; }
  button:disabled { opacity: 0.45; cursor: not-allowed; }
  .counter { color: var(--muted); font-weight: 700; }
  .slide { min-height: calc(100vh - 82px); background: var(--paper); border: 1px solid var(--line); border-radius: 10px; padding: 18px; box-shadow: 0 18px 42px rgba(15, 23, 42, 0.10); display: grid; grid-template-columns: minmax(310px, 0.86fr) minmax(0, 1.55fr); gap: 18px; overflow: visible; }
  .paper-head { min-width: 0; min-height: 0; overflow: visible; display: flex; flex-direction: column; gap: 12px; }
  .figure { margin: 0; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: #f8fafc; }
  .figure img { display: block; width: 100%; max-height: 41vh; object-fit: contain; background: white; }
  .figure figcaption { padding: 7px 10px; color: var(--muted); font-size: 12px; line-height: 1.3; }
  .head-text { display: flex; flex-direction: column; gap: 9px; min-width: 0; }
  .badges { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .badge { border-radius: 999px; padding: 5px 9px; background: #eef2ff; color: #3730a3; font-size: 12px; font-weight: 800; }
  .score { background: #fee2e2; color: #991b1b; }
  h1 { margin: 0; font-size: 25px; line-height: 1.15; letter-spacing: 0; overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
  h1 a { color: inherit; text-decoration-color: rgba(23, 107, 135, 0.35); text-decoration-thickness: 2px; text-underline-offset: 4px; }
  h1 a:hover { color: var(--accent); text-decoration-color: var(--accent); }
  .meta, .authors, .why, .abstract { font-size: 13px; line-height: 1.45; }
  .meta, .authors { color: var(--muted); }
  .why strong, .abstract strong, .authors strong { color: var(--ink); }
  .authors { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .why { border-left: 4px solid var(--accent-2); padding-left: 10px; color: #374151; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .abstract { border-top: 1px solid var(--line); padding-top: 14px; color: #374151; }
  .original-abstract { border-top: 1px solid var(--line); padding-top: 10px; color: #374151; font-size: 11.5px; line-height: 1.35; overflow-wrap: anywhere; }
  .original-abstract strong { display: block; margin-bottom: 4px; color: var(--ink); }
  .tags { display: flex; flex-wrap: wrap; gap: 8px; }
  .tag { border-radius: 999px; padding: 4px 8px; background: #f1f5f9; color: #475569; font-size: 12px; font-weight: 700; }
  .head-text > .link { display: none; }
  .briefing { min-width: 0; min-height: 0; overflow: visible; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); grid-auto-rows: minmax(0, auto); align-content: start; gap: 11px 18px; border-top: 0; padding-top: 0; }
  .brief-section { min-width: 0; }
  .brief-section.wide { grid-column: 1 / -1; }
  .brief-section h2 { margin: 0 0 4px; font-size: 14px; line-height: 1.22; color: #0f766e; letter-spacing: 0; }
  .brief-section p, .brief-section li { margin: 0; font-size: 12.5px; line-height: 1.42; color: #1f2937; overflow-wrap: anywhere; }
  .brief-section ul { margin: 0; padding-left: 20px; }
  .concepts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 9px 14px; }
  .concept { border-top: 1px solid var(--line); padding-top: 7px; }
  .concept h3 { margin: 0 0 4px; font-size: 13px; color: #7c2d12; letter-spacing: 0; }
  .concept p { margin: 2px 0 0; font-size: 11.5px; line-height: 1.35; color: #374151; overflow-wrap: anywhere; }
  .concept b { color: #111827; }
  .link { color: var(--accent); font-weight: 800; text-decoration: none; }
  .empty { padding: 48px; background: var(--paper); border: 1px solid var(--line); border-radius: 12px; color: var(--muted); }
  @media (max-width: 860px) {
    .shell { padding: 14px; }
    .topbar, .top-actions { align-items: stretch; flex-direction: column; }
    .slide, .briefing, .concepts { grid-template-columns: 1fr; }
    .slide { min-height: auto; overflow: visible; display: grid; }
    h1 { font-size: 28px; }
  }
</style>

const slides = [{"title": "Direct Visualization of Gate-Tunable Flat Bands in Twisted Double Bilayer Graphene", "journal": "PRL_Recent", "source": "author whitelist", "link": "http://link.aps.org/doi/10.1103/3vg5-vkzy", "authors": "Souvik Sasmal, Ryan Muzzio, Ahmed Khalifa, et al.", "last_authors": "Shubhayu Chatterjee, Jyoti Katoch", "summary": "The evolution of moiré minibands under varying carrier density and displacement field may be directly visualized using microfocused angle-resolved photoemission spectroscopy.", "tier": "A_MUST_READ", "score": "10", "reason": "author whitelist: Eli Rotenberg", "tags": ["angle-resolvedphotoemission", "photoemission", "graphene", "moir", "twisted", "flatband"], "image": "", "briefing": {"background": "트위스트된 2차원 적층 구조(Moiré superlattice)에서는 층간 결합과 비틀림 각도에 의해 전자 밴드가 매우 좁아지는 '평탄 밴드(flat band)' 현상이 나타납니다. 이는 강한 전자 상관관계를 유도하여 초전도나 절연체 상태를 만드는 핵심 기제입니다.", "motivation": "게이트 전압과 변위장(displacement field)을 통해 평탄 밴드의 구조를 인위적으로 제어할 수 있는지를 미세 ARPES로 직접 시각화하고자 함.", "result": "트위스트 이중 이중층 그래핀(TDBG)에서 외부 필드에 따른 밴드 구조의 변화를 ARPES로 직접 관측하여, 이론적으로 예측된 평탄 밴드 튜닝 성능을 실험적으로 검증함.", "implication": "모아레 시스템에서 밴드 구조를 능동적으로 제어함으로써 위상 물성 및 강상관 전자 상태를 설계할 수 있는 가능성을 제시함.", "novelty": "기존의 수송 측정(transport) 중심 연구와 달리, 직접적인 밴드 구조 시각화를 통해 게이트 제어 효과를 명확히 입증함. ARPES 기반 모아레 연구의 정밀도를 한 단계 높임.", "unresolved": "실제 초전도나 자기적 순서가 발현되는 밀도 영역에서의 세밀한 quasiparticle 분산 관계와 밴드 혼합 정도.", "future_work": "더 넓은 영역의 위상 다이어그램 탐색 및 다양한 적층 구조에서의 밴드 엔지니어링 검증.", "concepts": [{"term": "Moiré minibands", "why_emerged": "두 2차원 층이 서로 비틀려 쌓일 때 발생하는 주기적인 간섭 무늬가 전자 밴드를 분할하고 재구성하기 위해 필요.", "origin": "초록 정보만으로는 특정하기 어려움 (주로 2010년대 후반부터 트위스트 그래핀 연구와 함께 확립).", "connections": "Flat bands, Van Hove singularities, Moiré excitons."}, {"term": "Twisted Double Bilayer Graphene (TDBG)", "why_emerged": "마법 각도 그래핀의 물성을 더 복잡한 적층 구조에서 구현하고 제어하기 위해 등장.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "Twisted bilayer graphene, displacement field control."}], "english_summary": ["Direct visualization of gate-tunable moiré bands in TDBG via micro-ARPES.", "Experimental verification of flat band dispersion control under displacement fields.", "Provides critical insight into the electronic structure manipulation of moiré systems."]}}, {"title": "Unified First-Principles Formula for Time-Resolved ARPES Spectra of Coherent and Incoherent Excitons beyond the Dilute Limit", "journal": "PRL_Recent", "source": "keyword", "link": "http://link.aps.org/doi/10.1103/zhs1-rv1k", "authors": "Gianluca Stefanucci, Enrico Perfetto", "last_authors": "Gianluca Stefanucci, Enrico Perfetto", "summary": "Despite major experimental progresses in time-resolved and angle-resolved photoemission spectroscopy, a quantitative, microscopic framework for interpreting exciton-induced modifications of electronic band structures—applicable even beyond the low-density limit—is still lacking. Here, we close this gap by introducing a unified approach that links the dynamics of coherent and incoherent excitons to distinct and experimentally observable excitonic sidebands. Our central result is a general, first-principles formula for time-resolved photoemission spectra, applicable across a broad range of temperatures, excitation densities, and pump-probe delays. This advance provides a predictive tool for quantitatively tracking excitonic dynamics in complex materials.", "tier": "A_MUST_READ", "score": "10", "reason": "title strong match: ARPES", "tags": ["ARPES", "angle-resolvedphotoemission", "photoemission", "bandstructure"], "image": "", "briefing": {"background": "시간 분해 ARPES(tr-ARPES)는 물질의 들뜬 상태를 실시간으로 관측하는 강력한 도구이나, 빛에 의해 생성된 엑시톤(exciton)이 밴드 구조를 어떻게 변형시키는지 해석할 엄밀한 이론적 체계가 부족했음.", "motivation": "저밀도 한계를 넘어 고밀도 영역까지 포괄할 수 있는 엑시톤-전자 상호작용의 일반화된 이론 공식화.", "result": "coherent 및 incoherent 엑시톤 동역학이 ARPES 스펙트럼의 사이드밴드(sideband)에 미치는 영향을 계산하는 제1원리 공식을 유도함.", "implication": "tr-ARPES 실험 결과로부터 엑시톤의 동역학적 특성을 역으로 정량 분석할 수 있는 기반이 마련됨.", "novelty": "저밀도 근사(dilute limit)를 벗어나 고에너지/고밀도 들뜬 상태까지 설명 가능한 일반적인 수식이라는 점이 강력함.", authorWhitelist"], "image": "", "briefing": {"background": "고온 초전도체 및 복잡한 자기 구조를 가진 물질에서 나타나는 전자 구조의 변화는 광전자 분광법(ARPES)이나 RIXS 등의 분광학적 방법으로 규명하는 것이 학계의 주요 과제입니다.", "motivation": "특정 물질 시스템에서의 전자적 상태와 분광학적 관측 결과 해석에 대한 학술적 논쟁을 해소하기 위한 저자들의 공식적인 반박/답변입니다.", "result": "이전 논문에서 제기된 데이터 해석의 정당성을 재확인하고, 분광학적 관측 결과와 이론적 모델 간의 정합성을 논리적으로 보강했습니다.", "implication": "해당 물질의 전자 구조 해석에 대한 학계의 기준이 명확해지며, 후속 연구자들이 해당 데이터를 신뢰하고 활용할 수 있는 기반을 제공합니다.", "novelty": "기존 데이터의 논란을 해소하고, 복잡한 전자 구조 측정의 엄밀함을 제고했습니다.", "unresolved": "데이터 해석에 대한 근본적인 물리적 모델 자체의 타당성은 향후 더 정밀한 실험을 통해 계속 검증되어야 합니다.", "future_work": "해당 시스템에 대한 추가적인 온도 의존적 분광 연구 및 이론적 재해석 연구가 이어질 것으로 보입니다.", "concepts": [{"term": "ARPES/RIXS interpretation", "why_emerged": "복잡한 강상관 전자계에서 다체 효과를 이해하기 위한 필수 도구임.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "전자 구조 분석 및 동역학적 특성 연구."}], "english_summary": ["A formal reply providing clarification on previous experimental observations.", "Strengthens the interpretation of spectroscopic data in specific complex systems.", "Addresses scientific scrutiny regarding electronic structure measurements.", "Provides consolidated evidence to support prior findings."]}}, {"title": "Observation of quantum vortex core fractionalization and skyrmion formation in a superconductor", "journal": "Science", "source": "author whitelist", "link": "https://doi.org/10.1126/science.ads0189", "authors": "Yu Zheng, Quanxin Hu, Xin Yu, et al.", "last_authors": "Chi-Ming Yim, Hong Ding", "summary": "Magnetic fields can penetrate a superconductor in the form of quantum vortices, which consist of a core singularity with circulating currents. London’s quantization implies that there is one core singularity per quantum of magnetic flux in single-component superconductors. In this study, we report signatures of quantum vortex core fractionalization on the potassium-terminated surface of a multiband superconductor, KFe 2 As 2 . The observed splitting of single integer–flux vortices into several fractional vortices results in a disparity between the numbers of flux quanta and vortex cores. These fractional vortices often arrange in chains, which calculations show are characterized by a ℂP 2 skyrmionic topological invariant; this constitutes a different type of topological defect: the chiral skyrmion. The disparate natures of integer and fractional vortices comprising skyrmions lead to distinct spectroscopic signatures.", "tier": "A_MUST_READ", "score": "9", "reason": "author whitelist: Hong Ding", "tags": ["superconduct", "topological"], "image": "", "briefing": {"background": "초전도체 내의 양자 소용돌이(Quantum Vortex)는 자기적 성질과 초전도성 사이의 상호작용을 연구하는 핵심 주제로, 위상학적 결함으로서의 역할이 중요합니다.", "motivation": "KFe2As2와 같은 다중 밴드 초전도체에서 소용돌이 핵(Vortex Core)의 분수화(Fractionalization) 현상을 관찰하고 그 위상학적 성질을 규명하고자 합니다.", "result": "단일 자속 양자 소용돌이가 여러 개의 분수 소용돌이로 분리됨을 관측하였으며, 이들이 스카이르미온(Skyrmion) 구조를 형성함을 밝혀냈습니다.", "implication": "초전도체 내부의 새로운 위상학적 결함 상태를 발견함으로써, 양자 정보 소자 및 새로운 초전도 위상학의 기초가 될 수 있습니다.", "novelty": "전통적인 소용돌이 개념을 넘어선 분수화된 소용돌이와 스카이르미온 형성을 STM으로 직접 관측한 것이 큰 성과입니다.", "unresolved": "이러한 분수화된 소용돌이가 물질의 다중 밴드 특성과 어떻게 정량적으로 연결되는지에 대한 이론적 완전성은 과제로 남습니다.", "future_work": "다른 다중 밴드 초전도체로의 확대 실험과 소용돌이 사슬의 동역학적 특성 연구가 필요합니다.", "concepts": [{"term": "Vortex Core Fractionalization", "why_emerged": "다중 밴드 초전도체에서 정수 단위 자속이 분리되는 현상을 이해하기 위해 필요.", "origin": "이론적 배경은 Wen 등 위상학적 상태 연구에서 유래.", "connections": "분수 양자 홀 효과, 위상학적 초전도체."}, {"term": "Skyrmion", "why_emerged": "자기장 하에서 위상학적으로 보호받는 비자명한 스핀 조직을 설명하기 위해 도입됨.", "origin": "Tony Skyrme (1960년대).", "connections": "위상학적 솔리톤, 비자명한 자성체."}], "english_summary": ["Observes fractionalization of quantum vortex cores in KFe2As2.", "Discovers formation of chiral skyrmions from fractional vortices.", "Provides spectroscopic evidence of novel topological defects in superconductors.", "Highlights the role of multiband superconductivity in topological physics."]}}, {"title": "Superconducting states and intertwined orders in metallic altermagnets", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/v8yz-2vp5", "authors": "Xuan Zou, Rafael M. Fernandes, Eduardo Fradkin", "last_authors": "Rafael M. Fernandes, Eduardo Fradkin", "summary": "Metallic altermagnets offer a new setting for unconventional superconductivity because their Fermi surfaces are spin split despite vanishing net magnetization. Here, the authors show that equal-spin multicomponent p -wave pairing gives rise to multiple superconducting transitions and intertwined superconducting phases driven by subleading normal-state instabilities. They further demonstrate that fluctuations of competing electronic orders fundamentally reshape the superconducting state: nematic fluctuations stabilize nematic superconductivity, whereas spin loop-current fluctuations select chiral phases, revealing routes toward both nematic and topological superconductivity.", "tier": "B_IMPORTANT_CONDMAT", "score": "10", "reason": "Direct hit on altermagnetism, nematicity, loop currents, and topological superconductivity.; demoted from A: broad CM, not direct user/project hit", "tags": ["theory", "altermagnetism", "nematicity", "superconductivity"], "image": "", "briefing": {"background": "Altermagnetism은 순자화(net magnetization)는 없으나 결정 구조의 대칭성으로 인해 페르미 면에서 스핀 분할이 일어나는 새로운 자기 질서 상태입니다. 이는 기존의 강자성이나 반강자성과 차별화되며, 비관습적 초전도성을 연구하는 새로운 플랫폼을 제공합니다.", "motivation": "알터자성체 금속에서 스핀 분할된 페르미 면이 어떤 방식으로 초전도 상태와 상호작용하고, 특히 다양한 전자 질서(nematic, loop current 등)가 초전도성에 어떤 영향을 미치는지 이론적으로 규명하고자 합니다.", "result": "이 연구는 동등-스핀 다성분 p-파 초전도 쌍 형성이 다중 초전도 상전이를 유도함을 보였습니다. 네마틱 요동은 네마틱 초전도성을, 스핀 루프 전류 요동은 카이랄 초전도성을 안정화하여 위상적 초전도성으로 가는 경로를 제시합니다.", "implication": "알터자성체에서 나타나는 전자 질서 요동을 제어함으로써 위상적 초전도체나 네마틱 초전도체 같은 이국적인 초전도 상태를 공학적으로 구현할 수 있는 가능성을 열어줍니다.", "novelty": "알터자성체라는 최신 소재군에서 위상적 초전도성과 전자 질서의 상호 얽힘(entwined order)을 이론적으로 체계화했으며, 이는 독자가 관심을 갖는 루프 전류 및 네마틱 질서와 직접적으로 연결됩니다.", "unresolved": "실제 소재에서 루프 전류 질서나 네마틱 요동의 크기를 실험적으로 명확히 분리하여 관측하는 방법론은 여전히 도전 과제입니다.", "future_work": "제안된 이론적 모델을 기반으로 특정 알터자성체 후보 물질에서의 초전도 상전이 및 위상적 특성을 검증하는 실험 연구가 필요합니다.", "concepts": [{"term": "Altermagnetism", "why_emerged": "순자화가 없으면서도 스핀 분할이 일어나는 반강자성의 새로운 범주를 정의하기 위해 제안됨.", "origin": "최근 3~4년 내 이론적 체계가 정립됨 (예: Šmejkal et al.).", "connections": "반강자성체, 스핀-궤도 결합, 비관습적 초전도체와 연결됨."}, {"term": "Nematic superconductivity", "why_emerged": "초전도 질서 변수가 결정 구조의 회전 대칭성을 자발적으로 깨뜨리는 현상을 설명하기 위해 필요함.", "origin": "초창기 액정 물리학에서 유래, 고온 초전도체에서 논의됨.", "connections": "네마틱 질서, 전자 비등방성, 강상관 전자계."}], "english_summary": ["Metallic altermagnets with spin-split Fermi surfaces host complex superconducting orders.", "Equal-spin p-wave pairing leads to multiple superconducting transitions in altermagnets.", "Nematic fluctuations stabilize nematic superconductivity while spin loop-currents drive chiral phases.", "The study provides a theoretical blueprint for engineering topological superconductivity in altermagnetic metals."]}}, {"title": "Observation of ubiquitous charge correlations and hidden quantum critical point in hole-doped kagome superconductors", "journal": "npj_QuantumMaterials", "source": "Gemini", "link": "https://www.nature.com/articles/s41535-026-00916-1", "authors": "Ilija K. Nikolov, Giuseppe Allodi, Adrien Rosuel, et al.", "last_authors": "Samuele Sanna, Vesna F. Mitrović", "summary": "Observation of ubiquitous charge correlations and hidden quantum critical point in hole-doped kagome superconductors", "tier": "B_IMPORTANT_CONDMAT", "score": "10", "reason": "Direct hit on kagome superconductors and charge order, central to the user's research.; demoted from A: broad CM, not direct user/project hit", "tags": ["experiment", "kagome", "superconductivity"], "image": "https://pubads.g.doubleclick.net/gampad/ad?iu=/285/npjquantmats.nature.com/article&sz=728x90&c=436997645&t=pos%3Dtop%26type%3Darticle%26artid%3Ds41535-026-00916-1%26doi%3D10.1038/s41535-026-00916-1%26subjmeta%3D301,639,766%26kwrd%3DMaterials+science,Physics", "briefing": {"background": "AV3Sb5(A=K, Rb, Cs) Kagome 금속은 전하 밀도 파(CDW), 위상적 특 es. Here, we report the discovery of multiple previously unrecognized flat-band two-dimensional materials through a structure-informed, data-driven framework. We introduce a physically motivated flatness score that combines band dispersion and density-of-states features, enabling algorithmic labeling of known materials without requiring manual inspection. This score is then used to train a multimodal deep learning model that predicts flat-band propensity directly from atomic structure. Applied to more than 10,000 unlabeled materials, our framework identifies numerous flat-band candidates. Among the top-scoring structures (flatness score higher than 0.9), DFT calculations on materials with kagome-like lattices confirm a flat-band prediction accuracy of 98%, demonstrating the ability to discover topologically nontrivial systems. By bypassing the need for precomputed band structures, our approach enables large-scale, interpretable screening and expands the design space for correlated quantum phases in low-dimensional systems.", "tier": "B_IMPORTANT_CONDMAT", "score": "9", "reason": "Discovers new flat-band 2D kagome materials, relevant to unconventional superconductivity and topology.", "tags": ["kagome", "2Dmaterials", "flatband", "unconventionalsuperconductivity", "topological", "DFT", "materialsdiscovery"], "image": "", "briefing": {"background": "평탄한 전자 밴드(flat band)는 높은 상태 밀도로 인해 전자 간 상호작용이 지배적이 되어 초전도성, 분수 양자 홀 효과 등 이국적인 양자 현상을 유도하는 핵심 요소입니다.", "motivation": "기존 DFT 계산만으로는 방대한 물질 공간에서 평탄한 밴드를 가진 물질을 효율적으로 찾기 어려워, 이를 자동화하고 체계적으로 탐색할 새로운 방법론이 필요했습니다.", "result": "물리적 정보(밴드 분산 및 상태 밀도)를 기반으로 한 '평탄도 점수'를 도입하고 이를 딥러닝 모델에 학습시켜 10,000개 이상의 물질에서 새로운 평탄 밴드 후보군을 성공적으로 발굴했습니다.", "implication": "DFT 계산 없이도 구조 데이터만으로 후보 물질을 필터링할 수 있어, 위상 물질이나 강상관 전자계 물질 탐색 속도가 획기적으로 빨라질 것으로 기대됩니다.", "novelty": "구조적 특징만으로 평탄 밴드 형성 가능성을 98% 정확도로 예측했다는 점이 핵심이며, 특히 연구자가 관심 있는 카고메 격자 기반의 위상 물질 설계 범위를 크게 확장했습니다.", "unresolved": "실제로 예측된 물질들이 실험적으로 합성 가능할지, 그리고 예측된 평탄 밴드가 실제 강상관 효과를 어떻게 발현할지에 대한 실험적 from charge density wave symmetry breaking in TiSe2", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/lsxz-7hbr", "authors": "Turgut Yilmaz, Yi Sheng Ng, Muhammad Awais Fiaz, et al.", "last_authors": "Hui-Qiong Wang, Jin-Cheng Zheng", "summary": "Surface confined electronic states provide a fertile ground for discovering emergent phenomena that have no counterpart in the bulk, offering new routes to manipulate correlations, symmetry breaking, and dimensionality at the atomic scale. Here, we show that charge density wave (CDW) symmetry breaki…", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Surface-sensitive electronic structure in a CDW system.", "tags": ["CDW", "electronicstructure"], "image": "", "briefing": {"background": "물질의 표면은 벌크와는 다른 대칭성 파괴와 구속 효과로 인해 새로운 양자 상태가 발현되기 쉬운 장소입니다. 전하 밀도 파(CDW) 시스템에서 이러한 표면 상태가 벌크의 위상적 성질이나 상관관계에 어떤 영향을 미치는지 이해하는 것은 응집물질물리학의 중요한 과제입니다.", "motivation": "TiSe2는 대표적인 CDW 물질로, CDW 전이 이후 표면에서 나타나는 전자 구조의 변화가 어떻게 벌크 대칭성과 연관되는지 명확히 밝히고자 합니다.", "result": "CDW 대칭성 파괴로 인해 유도되는 새로운 표면 공명 상태(surface resonance)를 확인하였으며, 이것이 표면의 전자적 특성을 근본적으로 변화시킴을 보였습니다.", "implication": "표면에서의 CDW 상전이가 단순한 구조적 왜곡을 넘어 새로운 전자적 상태를 유도할 수 있음을 시사하며, 이는 향후 표면 민감한 탐침을 활용한 상전이 연구의 중요한 지표가 될 것입니다.", "novelty": "CDW에 의한 대칭성 파괴가 표면 공명 상태라는 독특한 전자 구조를 형성한다는 점을 규명하였습니다. 이는 ARPES 등을 이용한 표면 전자 구조 분석이 중요한 연구자에게 유용한 데이터입니다.", "unresolved": "이러한 표면 공명 상태가 벌크 CDW 순서와 정확히 어떤 미시적 결합을 이루는지에 대한 구체적인 정량적 모델은 여전히 연구가 필요합니다.", "future_work": "저온 ARPES 및 STM/STS를 결합하여 해당 표면 상태의 공간적 분포와 분광학적 특성을 원자 수준에서 추가로 분석할 예정입니다.", "concepts": [{"term": "Charge Density Wave (CDW)", "why_emerged": "전자와 격자 사이의 상호작용으로 인해 전하 밀도가 주기적으로 재배열되는 현상을 기술하기 위해 도입되었습니다.", "origin": "Peierls(1955)가 1차원 금속에서의 불안정성으로 처음 제안하였습니다.", "connections": "고온 초전도체, 망간 산화물, AV3Sb5 카고메 금속 등 다양한 강상관 전자계와 연결됩니다."}, {"term": "Surface Resonance", "why_emerged": "표면의 불연속성으로 인해 특정 파동 함수가 표면 근처에 국한되거나 강화되는 현상을 설명하기 위해 필요합니다.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "표면 상태(Surface states), 토폴로지 절연체와 밀접한 관련이 있습니다."}], "english_summary": ["TiSe2 exhibits emergent surface resonance driven by CDW symmetry breaking.", "The study highlights how surface-confined electronic states respond to broken bulk symmetries.", "Results provide new insights into manipulating quantum phenomena at atomic-scale surfaces.", "The resonance feature suggests a robust link between structural distortions and local electronic density."]}}, {"title": "Fermi-liquid behavior and characteristic temperature-dependent susceptibility in clean single crystal RuO2", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/vy8x-q3l6", "authors": "Shubhankar Paul, Atsutoshi Ikeda, Hisakazu Matsuki, et al.", "last_authors": "Shingo Yonezawa, Yoshiteru Maeno", "summary": "The magnetic nature of the altermagnet candidate ${\\mathrm{RuO}}_{2}$ remains under debate. It has been recently shown from quantum oscillations and angle-resolved photoemission spectroscopy that the high-quality ${\\mathrm{RuO}}_{2}$ bulk single crystal is a paramagnetic metal. Here we report the sp…", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Electronic structure and transport in altermagnet candidate.", "tags": ["ARPES", "altermagnet", "electronicstructure"], "image": "", "briefing": {"background": "Altermagnetism(알터자성)은 최근 자성 물질의 새로운 범주로 주목받고 있으며, RuO2가 대표적인 후보 물질로 거론되어 왔습니다. 그러나 이 물질이 실제 알터자성인지, 단순 상자성 금속인지에 대한 논란이 분분합니다.", "motivation": "RuO2의 자기적 성질을 명확히 규명하기 위해 고품질 단결정을 사용하여 페르미 액체 행동과 자기 감수율의 온도 의존성을 정밀 측정하고자 합니다.", "result": "양자 진동 및 ARPES 데이터와 일관되게 고품질 RuO2 단결정은 전형적인 상자성 금속임을 확인하였으며, 페르미 액체 거동을 보임을 증명했습니다.", "implication": "RuO2의 알터자성 논란에 대해 상자성 금속 모델을 지지하는 강력한 증거를 제시하며, 향후 알터자성 후보 물질 선정에 주의가 필요함을 시사합니다.", "novelty": "최근 화두인 알터자성 후보 물질에 대해 매우 정밀한 수송 특성 분석을 수행하여 물리적 성질을 재확인한 점이 중요합니다.", "unresolved": "왜 일부 이전 연구들에서 알터자성 신호가 보고되었는지, 시료의 결함이나 산소 공공 등이 어떤 역할을 하는지에 대한 의문이 남습니다.", "future_work": "시료의 순도에 따른 물성 변화를 체계적으로 조사하여 자기적 상전이 가능성과 물성 간의 상관관계를 심층 분석할 계획입니다.", "concepts": [{"term": "Altermagnetism", "why_emerged": "기존 강자성/반강자성과는 다르게 스핀-궤도 결합 없이도 대칭성에 의해 분리된 스핀 밴드를 가지는 물질을 정의하기 위해 도입되었습니다.", "origin": "최근 이론 물리학자들에 의해 체계적으로 분류되었습니다(2020년대 초).", "connections": "스핀트로닉스, 강자성, 반강자성, 비상반적 자기 저항과 연결됩니다."}, {"term": "Fermi-liquid behavior", "why_emerged": "상호작용하는 전자계에서 입자들이 준입자(quasiparticle)로 기술될 수 있는 금속 상태를 설명하기 위해 제안되었습니다.", "origin": "Landau(1956)에 의해 확립되었습니다.", "connections": "비페르미 액체, 강상관 전자계, 초전도체와 연결됩니다."}], "english_summary": ["RuO2 is re-examined to clarify its debated magnetic nature.", "Transport and susceptibility measurements confirm Fermi-liquid behavior in high-quality single crystals.", "Evidence points towards a paramagnetic metal state, challenging current altermagnet claims.", "The findings emphasize the importance of sample quality in identifying magnetic topological materials."]}}, {"title": "Fine structure of the cyclotron resonance in heterobilayers of proximitized graphene and transition metal dichalcogenides", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/6fx4-84th", "authors": "M. A. Rakitskii, K. S. Denisov, N. S. Averkiev", "last_authors": "K. S. Denisov, N. S. Averkiev", "summary": "A monolayer graphene and its Dirac electrons can be equipped with an enhanced spin-orbit coupling (SOC) when proximitized by other van der Waals (vdW) materials, such as transition metal dichalcogenides (TMDs). In this work we analyze the features of the cyclotron resonance (CR) absorption at quanti…", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Cyclotron resonance study of graphene/TMD van der Waals heterobilayers.", "tags": ["graphene", "vanderWaals", "TMD", "spin-orbitcoupling", "cyclotronresonance"], "image": "", "briefing": {"background": "그래핀과 TMD(전이금속 디칼코게나이드)의 반데르발스 이종접합은 근접 효과를 통해 그래핀에 강한 스핀-궤도 결합(SOC)을 유도할 수 있는 플랫폼입니다. 이를 통해 그래핀 내의 양자 물리적 특성을 제어하려는 시도가 활발합니다.", "motivation": "근접 효과가 가해진 그래핀의 사이클로트론 공명(CR) 미세 구조를 분석하여, 유도된 SOC가 전자 상태에 어떤 영향을 미치는지 규명하고자 합니다.", "result": "이종접합 구조에서 나타나는 CR 흡수의 특징적인 피크 구조를 분석하여, 근접 효과가 유도한 SOC 파라미터를 추출하고 전자 동역학에 대한 이해를 높였습니다.", "implication": "vdW 이종접합을 이용한 밴드 엔지니어링의 정밀한 제어 가능성을 입증하며, 스핀트로닉스 소자 개발을 위한 기반 데이터를 제공합니다.", "novelty": "CR 미세 구조 해석을 통해 그래핀의 SOC를 정밀하게 분석한 점이 돋보이며, vdW 시스템의 전기적 물성 제어에 대한 새로운 실험적 접근을 보여줍니다.", "unresolved": "TMD의 층 수나 비틀림 각도(twist angle)에 따른 미세 구조 변화의 정량적 의존성은 추가적인 조사가 필요합니다.", "future_work": "다양한 TMD 물질 조합 및 비틀림 각도 제어를 통해 근접 효과의 강도를 조절하며 CR 응답을 체계적으로 연구할 예정입니다.", "concepts": [{"term": "Cyclotron Resonance (CR)", "why_emerged": "자기장 내에서 자유 전자의 원운동 주파수를 측정하여 유효 질량과 페르미 면의 특성을 조사하기 위해 사용됩니다.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "양자 진동, Landau 준위, 유효 질량 측정과 연결됩니다."}, {"term": "Proximity Effect", "why_emerged": "이종접합에서 한 층의 성질(초전도성, SOC 등)이 다른 층으로 전이되는 현상을 설명하기 위해 도입되었습니다.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "조셉슨 접합, 스핀트로닉스, 위상 절연체와 연결됩니다."}], "english_summary": ["The study analyzes fine structures of cyclotron resonance in graphene/TMD heterobilayers.", "Proximity-induced spin-orbit coupling alters the Dirac electron dynamics in graphene.", "The results quantify the influence of interfacial effects on electronic excitation spectra.", "This approach provides a reliable method for evaluating SOC in vdW heterostructures."]}}, {"title": "Onset of spin-valley order and Stoner boundaries in twisted WSe2", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/pppy-tmlw", "authors": "Lauro B. Braz, Luis G. G. V. Dias da Silva", "last_authors": "Lauro B. Braz, Luis G. G. V. Dias da Silva", "summary": "We investigate spin-valley instabilities and their connection to the magnetically ordered states recently observed in the twisted bilayer dichalcogenide ${\\mathrm{WSe}}_{2}$ at a 5° twist angle. Starting from an effective three-orbital faithful Wannier model for the spin-locked moiré bands, combined…", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Explores spin-valley order in twisted bilayer WSe2, a relevant moiré system.", "tags": ["moire", "twistedbilayer", "WSe2", "spin-valleyorder", "magnetism"], "image": "", "briefing": {"background": "트위스트된 2차원 전이금속 칼코겐 화합물(TMD)은 모아레 격자로 인해 평탄한 밴드(flat band)가 형성되며, 이로 인해 강한 전자 상관관계와 자기적 질서가 발현되는 물리적 플랫폼을 제공합니다.", "motivation": "최근 5도 트위스트 WSe2 시료에서 관찰된 자기적 질서의 근본 원인을 스핀-밸리 결합(spin-valley coupling) 및 스토너 불안정성 관점에서 이론적으로 규명하고자 합니다.", "result": "3-궤도 바니어(Wannier) 모델을 사용하여 스핀-밸리 순서가 어떻게 형성되는지 밝히고, 강한 전자 상호작용 하에서 자기적 질서로 전이되는 경계(Stoner boundary)를 도출했습니다.", "implication": "모아레 시스템 내의 복잡한 자기 상태를 미시적 모델로 예측할 수 있음을 보여주며, 향후 스핀트로닉스 소자 응용 가능성을 시사합니다.", "novelty": "기존의 전반적인 현상론적 접근을 넘어, 특정 트위스트 각도(5도)에서의 자기적 특성을 미시적 모델링을 통해 정량적으로 분석했다는 점이 독자에게 흥미롭습니다.", "unresolved": "실제 실험에서 나타나는 국소적 불균일성이나 격자 완화(lattice relaxation) 효과가 모델에 완벽히 반영되지 않았을 가능성이 있습니다.", "future_work": "더 넓은 범위의 트위스트 각도에 대한 자기적 위상 도표 작성 및 STM을 통한 스핀-밸리 상태의 국소적 검증이 필요합니다.", "concepts": [{"term": "스핀-밸리 순서", "why_emerged": "TMD의 밸리 자유도가 스핀과 결합하여 전자의 독특한 정렬 상태를 만들기 때문.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "베리 곡률, 밸리트로닉스, 강상관 전자계"}, {"term": "스토너 경계", "why_emerged": "밴드 구조와 상호작용 에너지가 경쟁할 때 강자성 상태로 전이되는 기준을 설명하기 위함.", "origin": "Edmund Stoner (1938)", "connections": "전이금속 자기성, 스핀 밀도 파동"}], "english_summary": ["Investigates spin-valley instabilities in 5-degree twisted bilayer WSe2.", "Utilizes a three-orbital Wannier model to explain magnetic order.", "Identifies Stoner-like transitions driven by electronic correlations in moire bands."]}}, {"title": "Origin of the anomalous Hall effect in a disordered ferromagnetic Ho1.25Au0.75Si1.55 single crystal", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/vxhm-jv21", "authors": "Shoucai Yue, Nan Zhou, Lanxin Liu, et al.", "last_authors": "Xuan Luo, Yuping Sun", "summary": "The anomalous Hall effect (AHE) serves as a pivotal transport phenomenon for deciphering the interplay between magnetic spin textures and topological bands in magnetic materials, with its origin attributed to intrinsic (momentum-space Berry curvature linked to Weyl or Dirac point) and extrinsic (spi…", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Experimental study of anomalous Hall and Berry curvature in a magnetic crystal.", "tags": ["experiment", "Berrycurvature", "anomalousHall"], "image": "", "briefing": {"background": "자기 물질에서 나타나는 비정상 홀 효과(AHE)는 물질 내의 베리 곡률과 자기 구조 사이의 상호작용을 이해하는 핵심 도구입니다.", "motivation": "복잡한 결정 구조를 가진 Ho1.25Au0.75Si1.55 시스템에서 관찰된 비정상 홀 효과의 물리적 기원(내부적 메커니즘 대 외부적 산란)을 규명하고자 합니다.", "result": "이 물질에서의 AHE가 주로 운동량 공간의 베리 곡률(intrinsic contribution)에 의해 지배된다는 점을 수송 특성 분석을 통해 확인했습니다.", "implication": "희토류 기반 화합물에서도 위상학적 밴드 구조가 전하 수송에 결정적인 역할을 함을 증명하였습니다.", "novelty": "자기 모멘트와 토폴로지 간의 상호작용을 disordered single crystal에서 체계적으로 분석하여, 고유한 베리 곡률 효과를 분리해냈다는 점에서 의미가 있습니다.", "unresolved": "실제 Weyl/Dirac 점의 존재를 직접적인 ARPES로 확인한 데이터는 이 요약에 포함되어 있지 않아 추가 검증이 필요합니다.", "future_work": "자기 구조 변화에 따른 AHE의 위상학적 변화 연구 및 ARPES를 통한 밴드 구조의 직접 관측이 요구됩니다.", "concepts": [{"term": "비정상 홀 효과 (AHE)", "why_emerged": "자기 물질에서 외부 자기장 없이도 발생하는 횡방향 전압을 설명하기 위해.", "origin": "Edwin Hall (1881, anomalous case later)", "connections": "베리 위상, 위상학적 반금속, 자기 구조"}, {"term": "베리 곡률 (Berry Curvature)", "why_emerged": "운동량 공간에서의 전자 파동함수의 기하학적 위상을 설명하기 위해.", "origin": "Michael Berry (1984)", "connections": "양자 홀 효과, 비정상 홀 효과, 위상 불변량"}], "english_summary": ["Examines the origin of AHE in Ho1.25Au0.75Si1.55 single crystals.", "Attributes the observed AHE primarily to intrinsic Berry curvature effects.", "Highlights the role of topological bands in complex magnetic systems."]}}, {"title": "Real-time detection of critical slowing down in ultrafast quenches of superconductivity", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/pz3y-1447", "authors": "Guillermo Nava Antonio, Théo Courtois, Corentin Pfaff, et al.", "last_authors": "Thomas Hauet, Chiara Ciccarelli", "summary": "We employ optical pump-THz probe spectroscopy to chart the ultrafast superconductivity suppression in NbN over a broad range of excitation fluences. Our measurements uncover a pronounced lengthening of the superconductivity quenching time when the absorbed optical energy is close to the condensation energy of the superconductor, which constitutes a nonequilibrium analog of critical slowing down on a timescale comparable to that of superconducting fluctuations. Time-dependent Ginzburg-Landau simulations reproduce this behavior and ascribe it to the flattening of the free-energy landscape at the dynamical phase-transition boundary. Our findings represent a direct observation in real time of slowed-down superconductivity dynamics in proximity to a critical point and open a pathway for investigating out-of-equilibrium critical phenomena with time-resolved THz spectroscopy.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Experimental study of ultrafast superconductivity dynamics using pump-probe spectroscopy.", "tags": ["superconductivity", "ultrafastspectroscopy", "NbN", "experiment"], "image": "", "briefing": {"background": "초전도체에 강한 광 펄스를 가하면 초전도 상태가 파괴되는데, 이 과정에서 발생하는 비평형 동역학은 초전도 질서 매개변수와 집단 들뜸의 상호작용을 연구하는 좋은 수단입니다.", "motivation": "초전도체가 붕괴될 때 나타나는 '임계 완화 지연(critical slowing down)' 현상을 NbN 박막에서 실시간으로 관측하고자 합니다.", "result": "흡수된 에너지가 응집 에너지와 유사할 때 초전도 억제 시간이 비정상적으로 길어지는 현상을 발견했으며, 이는 시간 의존적 긴즈부르크-란다우 모델로 설명 가능함을 보였습니다.", "implication": "상전이 근처에서 물리량이 서서히 변화하는 동역학적 임계 현상을 초전도 상태에서 직접 시간 분해 분광법으로 추적할 수 있음을 입증했습니다.", "novelty": "단순한 초전도 파괴를 넘어, 비평형 상태에서의 상전이 동역학을 THz 분광법으로 실시간으로 정밀 측정했다는 점이 혁신적입니다.", "unresolved": "초전도 요동(fluctuation)이 구체적으로 어떻게 긴즈부르크-란다우 에너지 풍경을 변형시키는지에 대한 미시적 원리는 여전히 논의가 필요합니다.", "future_work": "다양한 위상 초전도체나 강상관 초전도체에 동일한 기법을 적용하여 동역학적 임계 거동의 보편성을 확인해야 합니다.", "concepts": [{"term": "임계 완화 지연 (Critical Slowing Down)", "why_emerged": "상전이 임계점 근처에서 시스템이 평형 상태로 돌아가는 시간이 발산하는 현상을 설명하기 위해.", "origin": "Lars Onsager 등 통계 물리학자", "connections": "상전이 이론, 동역학적 위상 전이, 비평형 물리"}, {"term": "시간 의존적 긴즈부르크-란다우 이론 (TDGL)", "why_emerged": "초전도 질서 매개변수의 시간적 변화를  위상학적 스핀 구조 구현에 활용될 수 있음을 시사함.", "novelty": "기존의 소멸 예측을 뒤엎고 2D 한계에서도 다강성 질서가 보존됨을 밝힘으로써, 강상관 2D 시스템 연구의 영역을 넓힘.", "unresolved": "자기 질서와 강유전 질서 간의 구체적인 마이크로스코픽 커플링 메커니즘은 상세 연구가 더 필요함.", "future_work": "나노 크기 스핀 텍스처(예: 스커미온) 생성 및 전기적 제어 실험.", "concepts": [{"term": "Multiferroics", "why_emerged": "자기장과 전기장 사이의 교차 제어를 통한 새로운 메모리 소자 개발을 위해 필요.", "origin": "20세기 초반 연구가 시작되었으나 2000년대 재조명됨.", "connections": "Ferroelectricity, Magnetism, Magnetoelectric coupling."}, {"term": "2D limit", "why_emerged": "양자 구속 효과와 표면 효과를 통한 새로운 물성 창출이 목적.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "Van der Waals heterostructures, Graphene."}], "english_summary": ["Investigation of multiferroicity in hexagonal LuFeO3 thin films.", "Demonstrates coexistence of ferroelectric and magnetic orders in the 2D limit.", "Challenges the conventional view that these orders are suppressed in thin films.", "Highlights potential for 2D correlated electron systems in spintronics."]}}, {"title": "Orbital Altermagnetism in Two Dimensions", "journal": "PRL_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/l8fc-dp36", "authors": "Mingxiang Pan, Feng Liu, Huaqing Huang", "last_authors": "Feng Liu, Huaqing Huang", "summary": "We introduce the concept of orbital altermagnetism , a symmetry-protected magnetic order of pure orbital degrees of freedom. It is characterized with ordered antiparallel orbital magnetic moments in real space but momentum-dependent orbital band splittings, analogous to spin altermagnetism. Using a m…", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Introduces theoretical concept of orbital altermagnetism with momentum-dependent orbital band splittings.", "tags": ["theory", "altermagnetism", "electronicstructure", "2D"], "image": "", "briefing": {"background": "자성 물질 연구에서 최근 스핀 자유도뿐만 아니라 궤도(orbital) 자유도의 정렬이 물질의 위상적 성질과 수송 현상을 결정한다는 인식이 커지고 있습니다. 기존의 강자성이나 반강자성을 넘어, 시간 반전 대칭성을 깨면서도 순자화가 0인 새로운 자성 상태를 이론적으로 탐구하는 분야입니다.", "motivation": "스핀 알터자성(spin altermagnetism)이 momentum 공간에서의 스핀 분할을 유도하듯, 궤도 자유도만을 이용해 유사한 효과를 낼 수 있는지, 즉 '궤도 알터자성'이 물질의 전자 구조를 어떻게 제어할 수 있는지 규명하고자 합니다.", "result": "실공간에서는 궤도 자기 모멘트가 반평행하게 정렬되어 있지만, 운동량 공간에서는 밴드 분할이 나타나는 새로운 자기 질서 상태를 제시했습니다.", "implication": "스핀-궤도 결합(SOC)이 강한 물질에서 스핀 알터자성과 결합하거나 독립적으로 궤도 기반의 위상적 수송 현상을 설계할 수 있는 가능성을 열었습니다.", "novelty": "스핀이 아닌 궤도 자유도에 집중하여 알터자성의 개념을 확장했다는 점이 핵심입니다. 특히 전자 구조 계산(DFT) 측면에서 궤도 밴드 구조를 제어하는 새로운 이론적 틀을 제공하여 위상 물질 탐색에 기여합니다.", "unresolved": "실제 어떤 특정 물질에서 이 궤도 알터자성이 안정적인 바닥 상태로 구현될지에 대한 구체적인 후보 물질 제시는 부족합니다.", "future_work": "실제 물질을 대상으로 한 제1원리 계산을 통해 궤도 알터자성을 나타내는 실제 화합물 예측 및 ARPES를 통한 밴드 분할 관측 실험이 기대됩니다.", "concepts": [{"term": "알터자성(Altermagnetism)", "why_emerged": "기존 강자성/반강자성으로 설명되지 않는, 스핀 정렬과 대칭성 패턴의 독특한 결합을 다루기 위해 등장.", "origin": "최근 2020년대 초반 (Jungwirth 그룹 등).", "connections": "반강자성, 비자성 금속, 스핀 분할(Spin-splitting) 밴드 구조."}, {"term": "궤도 자기 모멘트(Orbital magnetic moment)", "why_emerged": "전자의 궤도 운동에 의해 발생하는 자기 모멘트를 독립적으로 다루기 위해.", "origin": "고전적 전자기학 및 양자역학 기초.", "connections": "궤도 홀 효과(Orbital Hall effect), 스핀-궤도 결합."}], "english_summary": ["Introduces the theoretical framework of orbital altermagnetism in 2D systems.", "Describes a state with antiparallel orbital magnetic moments but momentum-dependent band splitting.", "Analogous to spin-based altermagnetism but focused on orbital degrees of freedom.", "Provides a foundation for designing topological electronic structures using purely orbital ordering."]}}, {"title": "Quantum-Geometry-Induced Anomalous Chiral Transport and Hidden Symmetry Breaking in Centrosymmetric 2M−WS2", "journal": "PRL_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/43cm-lhrk", "authors": "Hang Cui, Shao-Bo Liu, Erqing Wang, et al.", "last_authors": "X.-C. Xie, Jian-Hao Chen", "summary": "Chirality, a widely existing material property in nature that involves breaking the left-right symmetry, has had profound influence on various fields of natural sciences. Nonlinear responses, such as electronic magnetochiral anisotropy (eMChA), have been recognized as sensitive probes for the effect…", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Study of chiral transport and quantum geometry in a 2D material, relevant to Berry curvature.", "tags": ["transport", "2Dmaterial", "quantumgeometry", "TMD"], "image": "", "briefing": {"background": "반전 대칭성을 가진 물질에서도 국소적인(local) 비대칭성이나 위상적 기하학(quantum geometry)에 의해 비선형 수송 현상이 나타날 수 있습니다. 이는 베리 곡률 및 양자 기하학적 텐서가 물리적 관측량에 미치는 영향을 이해하는 현대 응집물질물리학의 주요 과제입니다.", "motivation": "2M-WS2와 같은 특정 전이금속 칼코겐 화합물(TMD)에서 관측되는 비정상적인 카이랄 수송 현상의 기원을 양자 기하학적 관점에서 해명하고자 합니다.", "result": "2M-WS2가 가진 국소적인 대칭성 파괴와 양자 기하학적 기여가 전자 자기카이랄 이방성(eMChA)을 유도한다는 것을 규명했습니다.", "implication": "벌크 대칭성이 보호되는 물질에서도 나노미터 규모의 국소 구조를 통해 강력한 비선형 수송 신호를 제어할 수 있음을 시사합니다.", "novelty": "2M-WS2라는 특정 TMD 물질에서 베리 곡률과 양자 기하학이 수송 현상에 미치는 직접적인 증거를 제시했으며, 이는 2D 물질 기반 소자 응용에 중요합니다.", "unresolved": "실험적 결과가 양자 기하학적 기여를 명확히 분리해냈는지에 대한 논란이 있을 수 있으며, 상세한 샘플 제작 과정에 따른 비균질성의 영향이 남아있습니다.", "future_work": "다른 TMD 물질로의 확장 연구 및 비선형 광전 효과와의 비교 분석이 요구됩니다.", "concepts": [{"term": "전자 자기카이랄 이방성(eMChA)", "why_emerged": "물질의 카이랄성과 자기장/전류 사이의 비선형적인 관계를 설명하기 위해.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "비선형 홀 효과, 베리 곡률 다이폴."}, {"term": "양자 기하학(Quantum Geometry)", "why_emerged": "파동함수의 기하학적 성질(베리 곡률, 메트릭 텐서)이 수송 물성을 지배함을 기술하기 위해.", "origin": "Restsa, Berry 등 초기 위상 물리학 발전기.", "connections": "베리 곡률, 퀀텀 메트릭(Quantum Metric)."}], "english_summary": ["Investigates quantum-geometry-induced chiral transport in 2M-WS2.", "Links electronic magnetochiral anisotropy to local symmetry breaking.", "Demonstrates the role of Berry curvature in non-linear transport responses.", "Highlights potential for manipulating topological transport in centrosymmetric materials."]}}, {"title": "Superconductivity from Phonon-Mediated Retardation in a Single-Flavor Metal", "journal": "PRL_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/dcn2-lc8k", "authors": "Yang-Zhi Chou, Jihang Zhu, Jay D. Sau, Sankar Das Sarma", "last_authors": "Jay D. Sau, Sankar Das Sarma", "summary": "We study phonon-mediated pairings in a single-flavor metal with a tunable Berry curvature. In the absence of Berry curvature, we discover an unexpected possibility: $p$-wave superconductivity emerging purely from the retardation effect, while the static Bardeen-Cooper-Schrieffer (BCS) approximation …", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Theory of unconventional p-wave superconductivity with Berry curvature, highly relevant.", "tags": ["theory", "superconductivity", "Berrycurvature", "phonons"], "image": "", "briefing": {"background": "전자-포논 상호작용에 의한 초전도체는 고전적인 BCS 이론으로 잘 설명되지만, 위상적 특성(베리 곡률 등)이 존재하는 단일-플래버(single-flavor) 금속 시스템에서의 초전도성은 여전히 도전적인 연구 주제입니다.", "motivation": "베리 곡률이 존재할 때 포논 매개 초전도성이 어떻게 변화하는지, 특히 기존 BCS 근사 범위를 넘어서는 지연 효과(retardation effect)가 어떠한 초전도 상태를 유도하는지 탐구합니다.", "result": "베리 곡률이 존재할 경우 정적인 BCS 근사로는 설명되지 않는 p-파(p-wave) 초전도성이 지연 효과에 의해 나타날 수 있음을 발견했습니다.", "implication": "위상적으로 비트리비얼한(non-trivial) 밴드를 가진 금속에서 비전통적인 p-파 초전도체가 단순한 포논 매개로도 형성될 수 있다는 새로운 기작을 제시합니다.", "novelty": "베리 곡률을 튜닝함으로써 초전도 대칭성을 바꿀 수 있다는 점은 위상 초전도체 연구에 매우 큰 시사점을 줍니다. 독자님이 관심 있는 위상 물질에서의 초전도 현상에 대한 이론적 기반을 제공합니다.", "unresolved": "이 기작이 실제로 특정 위상 금속 물질에서 관측될 수 있을지에 대한 정량적 분석이 필요합니다.", "future_work": "위상적 성질이 강한 물질에서의 초전도성 실험 데이터를 본 이론과 비교 분석하는 후속 연구가 필요합니다.", "concepts": [{"term": "지연 효과(Retardation effect)", "why_emerged": "전자와 포논의 운동 속도 차이로 인해 상호작용의 시간차를 고려해야 할 필요성 때문.", "origin": "BCS 이론 도입기 (Eliashberg 이론).", "connections": "엘리아슈버그(Eliashberg) 초전도 이론."}, {"term": "p-파 초전도(p-wave superconductivity)", "why_emerged": "비전통적 초전도체에서 발견되는 스핀 삼중항(triplet) 상태를 기술하기 위해.", "origin": "3He 초유체 연구 등에서 기원.", "connections": "위상 초전도체, 마요라나 페르미온."}], "english_summary": ["Studies phonon-mediated pairing in single-flavor metals with tunable Berry curvature.", "Identifies that retardation effects can drive p-wave superconductivity beyond BCS approximations.", "Provides a mechanism for unconventional superconductivity in topological metals.", "Highlights the significant role of Berry curvature in determining superconducting pairing symmetry."]}}, {"title": "Tailoring Pure Valley-Zeeman Spin-Orbit Coupling in WSe2-Encapsulated Monolayer Graphene", "journal": "PRL_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/46n3-pryp", "authors": "Yaqing Han, Siqi Jiang, Jingkuan Xiao, et al.", "last_authors": "Lei Wang, Geliang Yu", "summary": "Clearly resolved Landau levels reveal a symmetry-enforced Landau-level reordering driven by competition between fixed valley–Zeeman splitting and magnetic-field-dependent cyclotron energy.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Experimental study of monolayer graphene heterostructure with WSe2, exploring valley-Zeeman coupling and Landau levels.", "tags": ["experiment", "graphene", "monolayer", "van_der_Waals", "spin-orbit_coupling", "quantum_Hall"], "image": "", "briefing": {"background": "그래핀은 높은 이동도를 가진 2차원 물질이지만, 본래 스핀-궤도 결합(SOC)이 매우 약합니다. 이를 극복하기 위해 전이금속 디칼코게나이드(TMD)와의 이종접합을 통해 인위적인 SOC를 주입하여 위상학적 성질을 유도하려는 연구가 활발합니다.", "motivation": "WSe2와 그래핀의 이종접합 구조에서 층간 결합을 통해 그래핀 내에 유도되는 valley-Zeeman SOC의 특성을 실험적으로 규명하고 조절하고자 합니다.", "result": "란다우 준위(Landau levels)의 재배열 현상을 관측하였으며, 이는 고정된 valley-Zeeman 분할과 자기장에 의존하는 사이클로트론 에너지 사이의 경쟁에 의한 것임을 밝혀냈습니다.", "implication": "그래핀 이종접합에서 스핀과 밸리 자유도를 자기장으로 정밀하게 제어할 수 있음을 보여주며, 이는 향후 스핀트로닉스 및 밸리트로닉스 소자 구현의 핵심 기반이 됩니다.", "novelty": "외부 자기장과 층간 상호작용의 상충을 통해 그래핀의 양자 홀 상태를 인위적으로 재구성한 점이 중요하며, 이는 저자의 주요 관심사인 위상학적 물질의 밴드 구조 제어 연구와 맥을 같이 합니다.", "unresolved": "이종접합 계면의 원자 수준 결함이 전체 스핀-궤도 결합의 균일성에 미치는 영향은 여전히 정밀한 조사가 필요합니다.", "future_work": "다른 2D 물질 조합을 이용한 스핀-궤도 결합의 크기 최적화 및 이를 활용한 비소산 전류 제어 실험이 예상됩니다.", "concepts": [{"term": "Valley-Zeeman SOC", "why_emerged": "그래핀의 밸리 자유도를 스핀과 연결하여 제어 가능한 위상학적 상태를 만들기 위해 필요함.", "origin": "초록 정보만으로는 특정하기 어려움 (주로 TMD 이종접합 연구에서 파생됨).", "connections": "반전 대칭성 파괴, 위상 절연체, 스핀-밸리 로킹."}, {"term": "Landau Level Reordering", "why_emerged": "자기장 하에서 에너지 준위 간의 크기 관계가 뒤바뀌는 현상을 이해하여 양자 홀 효과를 정밀하게 분석하기 위해 필요함.", "origin": "초록 정보만으로는 특정하기 어려움 (양자 홀 물리에서 고전적임).", "connections": "양자 홀 효과, 밸리 분할, 제만 효과."}], "english_summary": ["Monolayer graphene is integrated with WSe2 to induce strong valley-Zeeman spin-orbit coupling.", "Landau level reordering is observed through competition between valley-Zeeman splitting and cyclotron energy.", "This demonstrates precise control over spin-valley degrees of freedom in 2D van der Waals heterostructures."]}}, {"title": "Antiferroelectric thin films embedded with ferroelectric switching loop for giant negative electrocaloric effect", "journal": "Science_Advances", "source": "Gemini", "link": "https://doi.org/10.1126/sciadv.aed5447", "authors": "Peipei Su, Jianchu Chen, Junning Li, et al.", "last_authors": "Xiangli Zhong, Gaokuo Zhong", "summary": "The ferroics combine the single-hysteresis loop of ferroelectrics with the double-hysteresis loop of antiferroelectrics to form multiple hysteresis loops, which could substantially advance energy storage, electrocaloric cooling, and nonvolatile multistate memory technologies. However, the intentional stabilization of intermediate states that bridge the nonvolatility of ferroelectrics and the field-induced phase transition behavior of antiferroelectrics remains a fundamental challenge. Here, we propose a strategy for preparing lead zirconate (PbZrO 3 ) thin film at low temperature, introducing a stable ferrielectric phase within the antiferroelectric to achieve triple-hysteresis loop under large electric fields. Microstructural features reveal that this behavior is attributable to the presence of Pb Zr antisite defects acting as seeds for polar order, which induce the distinctive triple (↑↑↓) dipole modulation period configuration. To demonstrate the application potential, we evaluated the electrocaloric effect of triple-hysteresis PbZrO 3 thin film based on Maxwell’s relations, the predicted temperature change Δ T can reach −23.76 kelvins, which is ~600% enhancement compared to double-hysteresis PbZrO 3 antiferroelectric thin films. These findings establish a design paradigm for embedding stable ferroelectric switching within antiferroelectrics, which may unlock opportunities for developing high-density energy storage, nonvolatile multistate memory, and highly efficient switching devices.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Important condensed matter physics on antiferroelectric thin films, ferroelectric switching, and electrocaloric effect.", "tags": ["antiferroelectrics", "ferroelectrics", "thinfilms", "materialsscience", "condensedmatter", "electrocaloriceffect"], "image": "", "briefing": {"background": "강유전체는 전기 분극이 자발적으로 존재하는 물질이며, 반강유전체는 쌍극자 모멘트가 반대로 배열되어 외부 전기장에 의해 상태 변화를 겪는 물질입니다. 이들의 결합은 차세대 비휘발성 메모리와 냉각 기술에 중요합니다.", "motivation": "기존 반강유전체 박막에서 중간 상태(ferrielectric phase)를 안정화하여 다중 이력 곡선(triple-hysteresis loop)을 얻고, 이를 통해 거대한 전기열효과(electrocaloric effect)를 구현하고자 합니다.", "result": "PbZrO3 박막 내에 Pb-Zr antisite 결함을 유도하여 트리플 이력 곡선을 생성했고, 이를 통해 기존 대비 600% 향상된 -23.76K의 온도 변화를 실현했습니다.", "implication": "반강유전체 박막 설계의 새로운 패러다임을 제시하며, 고효율 에너지 소자 및 다중 상태 메모리 분야에 즉각적인 응용 가능성을 보여줍니다.", "novelty": "결함 엔지니어링을 통해 단순한 반강유전체에서 거대한 전기열효과를 이끌어낸 점이 혁신적이며, 재료 설계 방법론 측면에서 가치가 있습니다.", "unresolved": "Pb-Zr antisite 결함의 장기적 안정성 및 소자 반복 구동 시의 내구성 문제가 남아있습니다.", "future_work": "다양한 도펀트나 기판 응력을 활용한 결함 제어 및 실제 냉각 소자 프로토타입 제작이 예상됩니다.", "concepts": [{"term": "Electrocaloric Effect", "why_emerged": "전기장 변화를 통해 물질의 엔트로피를 조절하여 고효율 냉각을 수행하기 위해 필요함.", "origin": "Rau (1930년경) 등에 의해 제안.", "connections": "단열 감자, 강유전체 분극, 에너지 소자."}, {"term": "Antiferroelectric", "why_emerged": "외부 전기장에 의한 급격한 극성 변화를 이용하여 데이터 저장 장치의 효율을 높이기 위해 필요함.", "origin": "Kittel (1951년).", "connections": "강유전체, 상전이, 전기이력 곡선."}], "english_summary": ["A lead zirconate (PbZrO3) thin film is engineered with stable ferrielectric phases.", "The material exhibits triple-hysteresis loops through controlled antisite defects.", "A massive -23.76 K electrocaloric effect is achieved, outperforming conventional double-hysteresis films."]}}, {"title": "Improper geometric ferroelectricity at the monolayer limit", "journal": "Science_Advances", "source": "Gemini", "link": "https://doi.org/10.1126/sciadv.aec5221", "authors": "Yilin Evan Li, Harikrishnan KP, Haidong Lu, et al.", "last_authors": "David A. Muller, Darrell G. Schlom", "summary": "Improper ferroelectrics, in which electric polarization emerges as a secondary effect of primary order parameters such as nonpolar structural distortions, are theoretically predicted to exhibit no intrinsic thickness limit. Yet, this prediction is inconsistent with experiment where ferroelectricity is observed to disappear in improper ferroelectric films under six formula units thick. We transcend this limitation by moving beyond the conventional epitaxial design paradigm that focuses largely on in-plane lattice mismatch and chemical bonding. By considering structural compatibility in the out-of-plane direction, we realize undiminished improper ferroelectricity at the monolayer limit. Our findings confirm the theoretically predicted absence of a critical thickness for improper ferroelectrics and establish a broadly applicable strategy for designing additional ultrathin ferroelectric materials.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Monolayer improper ferroelectricity; highly relevant condensed matter.", "tags": ["monolayer", "ferroelectricity", "quantummaterials"], "image": "", "briefing": {"background": "강유전체는 흔히 임계 두께 이하에서 표면 효과로 인해 강유전성이 사라지는 문제가 있습니다. 비본질적(improper) 강유전체는 구조적 왜곡이 주된 원인이기에 두께 제한이 없을 것으로 예측됩니다.", "motivation": "기존의 박막 설계가 주로 면내 격자 부정합에 집중했던 것과 달리, 면외(out-of-plane) 구조적 적합성을 고려하여 단층 수준에서도 강유전성을 유지하고자 합니다.", "result": "이론적으로 예측된 비본질적 강유전체의 '임계 두께 없음'을 실험적으로 입증하며 단층(monolayer) 한계에서 강유전성을 관측했습니다.", "implication": "초박형 강유전체 물질 설계의 새로운 방향을 제시하며, 2D 물질 기반 나노 소자의 집적도를 획기적으로 높일 수 있습니다.", "novelty": "단층 극한 조건에서 강유전성을 증명한 점은 2D 강유전체 물리 연구에 매우 중요한 이정표가 됩니다.", "u ern vectors and opens possibilities for nonreciprocal photonic devices.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Realization of arbitrary Chern vectors in 3D photonic crystals; relevant to topological concepts.", "tags": ["topological", "Cherninsulator", "photonics", "Floquet"], "image": "", "briefing": {"background": "3차원 위상 절연체에서 Chern 벡터는 2차원의 Chern 수 개념을 확장한 것으로, 시스템의 벌크-경계 대응 관계와 위상적 성질을 기술하는 핵심 지표입니다.", "motivation": "기존의 Chern 벡터는 한 성분만 0이 아닌 단순한 형태(0, 0, C3)에 국한되어 있어, 표면 상태의 자유로운 제어와 다양한 방향으로의 비가역적 전송에 한계가 있었습니다.", "result": "틸팅된 자이로자기 광결정을 사용하여 C=(1, 1, -1)이라는 복합 Chern 벡터를 가진 3차원 광결정을 구현하고, 6개 모든 표면에서 키랄 표면 상태를 관측했습니다.", "implication": "광결정 내에서 임의의 방향으로 키랄 전송을 제어할 수 있게 되었으며, 비가역적 위상 광소자 및 부적 굴절 소자 설계의 이론적 토대가 마련되었습니다.", "novelty": "기존에 제한적이었던 Chern 벡터를 복합 성분으로 자유롭게 설계(supercell modulation 활용)하여 다중 모드 전송을 가능하게 했다는 점이 광학적 위상 물질 연구의 큰 진전입니다.", "unresolved": "실제 나노 광소자 수준에서의 소형화 가능성 및 구현된 Chern 벡터의 대역폭 제한에 관한 추가적인 최적화 연구가 필요합니다.", "future_work": "토러스 매듭이나 링크 형태의 위상 표면 상태를 이용한 복잡한 광 회로 설계 및 비가역성 소자 실증이 기대됩니다.", "concepts": [{"term": "Chern 벡터 (Chern Vector)", "why_emerged": "3차원 위상 물질에서 벌크의 위상적 불변량을 벡터 형태로 기술하여 표면 상태의 분포를 예측하기 위해 필요합니다.", "origin": "초록 정보만으로는 특정하기 어려움 (통상적으로 위상 밴드 이론의 발전과 함께 정립).", "connections": "2차원 양자 홀 효과, Chern 절연체, Weyl 반금속과 연결됩니다."}, {"term": "자이로자기 (Gyromagnetic)", "why_emerged": "외부 자기장에 의해 유도되는 비가역적인 전자기파 응답을 구현하기 위해 사용됩니다.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "비가역적 광학 소자, 패러데이 회전과 밀접한 관련이 있습니다."}], "english_summary": ["Standard 3D Chern insulators are typically limited to single-component Chern vectors.", "Researchers realized a photonic crystal with an arbitrary Chern vector (1, 1, -1).", "This enables chiral transport on all six crystal surfaces simultaneously.", "The results open new paths for nonreciprocal topological photonics and complex surface mode engineering."]}}, {"title": "Wafer-scale growth of highly stable p-type semiconducting monolayer MoSi2N4 single crystals", "journal": "Nature_Materials  이는 일반적인 파울리 상한(Pauli limit)을 훨씬 넘어서는 높은 임계 자기장을 가능하게 합니다.", "motivation": "단층 TMD에서 왜 스핀-단일항 초전도 상태가 매우 높은 자기장 하에서도 파괴되지 않고 유지되는지, 그리고 이 'Ising 보호' 메커니즘이 구체적으로 어떤 자기적 이방성과 상호작용하는지를 이론적으로 정량화하고자 함.", "result": "제만 자기장과 Ising형 스핀-궤도 상호작용이 공존할 때 발생하는 비등방성 임계 자기장의 특성을 명확히 함. 특정 방향의 자기장에서 초전도성이 극도로 억제되거나 보호되는 양상을 수식적으로 유도함.", "implication": "Ising 보호 초전도체에서 자기장 방향에 따른 임계 자기장 변화를 예측할 수 있게 하며, 이는 고자기장 환경에서의 초전도 소자 설계 및 스핀트로닉스 응용에 핵심적인 지표가 됨.", "novelty": "TMD의 Ising SOC와 외부 자기장 사이의 경쟁을 정밀하게 기술하여, 실험적으로 관측되는 저온에서의 비정상적인 자기적 거동을 이론적으로 뒷받침함.", "unresolved": "이 연구는 이론적 모델을 중심으로 하므로, 실제 다양한 TMD 시료에서의 불순물 효과나 샘플 간의 결함이 초전도성에 미치는 구체적인 영향은 고려되지 않음.", "future_work": "실제 실험 그룹에서의 각도 의존적 자기장 측정 데이터와의 비교 연구, 그리고 벌크 TMD나 이종접합 구조로의 확장 연구가 예상됨.", "concepts": [{"term": "Ising 보호(Ising protection)", "why_emerged": "면 외 방향의 강한 SOC가 스핀을 고정시켜, 면 내 자기장에 의한 스핀 쌍 파괴 효과를 억제하기 위해 등장.", "origin": "2015년경 Lu et al. (Science) 등 단층 NbSe2 실험에서 본격적으로 주목받음.", "connections": "스핀-궤도 결합, 스핀-단일항 초전도, 파울리 상한 위반."}, {"term": "파울리 상한(Pauli limit)", "why_emerged": "일반적인 초전도체에서 외부 자기장이 스핀 단일항 쌍을 깨뜨려 초전도성을 파괴하는 에너지 임계치.", "origin": "1960년대 Clogston 및 Chandrasekhar에 의해 독립적으로 제안됨.", "connections": "제만 효과, 스핀 단일항 쌍, 상전이."}, {"term": "전이금속 디칼코게나이드(TMD)", "why_emerged": "층상 구조를 가진 반도체/금속성 물질로서, 박리가 용이하고 독특한 전자 구조를 가져 2D 물성 연구에 필수적임.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "반데르발스 이종접합, 2D 초전도성, 스핀트로닉스."}], "english_summary": ["The paper theoretically investigates the Ising protection mechanism in monolayer TMD superconductors.", "It clarifies the competition between the Zeeman field and Ising SOC in stabilizing singlet superconductivity against strong magnetic fields.", "The results provide an analytical framework to explain the observed anisotropy in critical magnetic fields.", "The study offers a solid theoretical foundation for engineering high-field superconducting devices using 2D materials."]}}, {"title": "Low-temperature spin dynamics and absence of magnetic order in layered α−RuI3", "journal": "PRB_Re
