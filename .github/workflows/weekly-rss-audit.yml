name: Weekly RSS coverage check
"on":
  schedule:
    - cron: '37 18 * * 3'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: python -m pip install feedparser requests lxml
      - run: python audit_feed_coverage.py
