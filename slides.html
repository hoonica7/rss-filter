<title>Daily Paper Slideshow</title>
<style>
  :root {
    color-scheme: light;
    --bg: #f6f7f4;
    --paper: #ffffff;
    --ink: #111827;
    --muted: #64748b;
    --line: #d8ddd2;
    --accent: #176b87;
    --accent-2: #9a3412;
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; overflow: auto; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: var(--bg); color: var(--ink); }
  .shell { max-width: 1500px; min-height: 100vh; margin: 0 auto; padding: 14px 18px; display: flex; flex-direction: column; }
  .topbar { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 16px; }
  .top-actions { display: flex; align-items: center; gap: 10px; }
  .topbar a, button { border: 1px solid var(--line); border-radius: 8px; background: var(--paper); color: var(--ink); padding: 10px 14px; font-weight: 700; text-decoration: none; cursor: pointer; }
  button.primary { background: var(--accent); border-color: var(--accent); color: white; }
  button:disabled { opacity: 0.45; cursor: not-allowed; }
  .counter { color: var(--muted); font-weight: 700; }
  .slide { min-height: calc(100vh - 82px); background: var(--paper); border: 1px solid var(--line); border-radius: 10px; padding: 18px; box-shadow: 0 18px 42px rgba(15, 23, 42, 0.10); display: grid; grid-template-columns: minmax(310px, 0.86fr) minmax(0, 1.55fr); gap: 18px; overflow: visible; }
  .paper-head { min-width: 0; min-height: 0; overflow: visible; display: flex; flex-direction: column; gap: 12px; }
  .figure { margin: 0; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: #f8fafc; }
  .figure img { display: block; width: 100%; max-height: 41vh; object-fit: contain; background: white; }
  .figure figcaption { padding: 7px 10px; color: var(--muted); font-size: 12px; line-height: 1.3; }
  .head-text { display: flex; flex-direction: column; gap: 9px; min-width: 0; }
  .badges { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .badge { border-radius: 999px; padding: 5px 9px; background: #eef2ff; color: #3730a3; font-size: 12px; font-weight: 800; }
  .score { background: #fee2e2; color: #991b1b; }
  h1 { margin: 0; font-size: 25px; line-height: 1.15; letter-spacing: 0; overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
  h1 a { color: inherit; text-decoration-color: rgba(23, 107, 135, 0.35); text-decoration-thickness: 2px; text-underline-offset: 4px; }
  h1 a:hover { color: var(--accent); text-decoration-color: var(--accent); }
  .meta, .authors, .why, .abstract { font-size: 13px; line-height: 1.45; }
  .meta, .authors { color: var(--muted); }
  .why strong, .abstract strong, .authors strong { color: var(--ink); }
  .authors { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .why { border-left: 4px solid var(--accent-2); padding-left: 10px; color: #374151; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .abstract { border-top: 1px solid var(--line); padding-top: 14px; color: #374151; }
  .original-abstract { border-top: 1px solid var(--line); padding-top: 10px; color: #374151; font-size: 11.5px; line-height: 1.35; overflow-wrap: anywhere; }
  .original-abstract strong { display: block; margin-bottom: 4px; color: var(--ink); }
  .tags { display: flex; flex-wrap: wrap; gap: 8px; }
  .tag { border-radius: 999px; padding: 4px 8px; background: #f1f5f9; color: #475569; font-size: 12px; font-weight: 700; }
  .head-text > .link { display: none; }
  .briefing { min-width: 0; min-height: 0; overflow: visible; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); grid-auto-rows: minmax(0, auto); align-content: start; gap: 11px 18px; border-top: 0; padding-top: 0; }
  .brief-section { min-width: 0; }
  .brief-section.wide { grid-column: 1 / -1; }
  .brief-section h2 { margin: 0 0 4px; font-size: 14px; line-height: 1.22; color: #0f766e; letter-spacing: 0; }
  .brief-section p, .brief-section li { margin: 0; font-size: 12.5px; line-height: 1.42; color: #1f2937; overflow-wrap: anywhere; }
  .brief-section ul { margin: 0; padding-left: 20px; }
  .concepts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 9px 14px; }
  .concept { border-top: 1px solid var(--line); padding-top: 7px; }
  .concept h3 { margin: 0 0 4px; font-size: 13px; color: #7c2d12; letter-spacing: 0; }
  .concept p { margin: 2px 0 0; font-size: 11.5px; line-height: 1.35; color: #374151; overflow-wrap: anywhere; }
  .concept b { color: #111827; }
  .link { color: var(--accent); font-weight: 800; text-decoration: none; }
  .empty { padding: 48px; background: var(--paper); border: 1px solid var(--line); border-radius: 12px; color: var(--muted); }
  @media (max-width: 860px) {
    .shell { padding: 14px; }
    .topbar, .top-actions { align-items: stretch; flex-direction: column; }
    .slide, .briefing, .concepts { grid-template-columns: 1fr; }
    .slide { min-height: auto; overflow: visible; display: grid; }
    h1 { font-size: 28px; }
  }
</style>

<script>
const slides = [{"title": "Dielectric screening in electromagnetic dressing of semiconductors", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/v4w2-zvxn", "authors": "Quentin Courtade, Umberto Dellasette, Sotirios Fragkos, et al.", "last_authors": "Yann Mairesse, Samuel Beaulieu", "summary": "Author(s): Quentin Courtade, Umberto Dellasette, Sotirios Fragkos, Stéphane Petit, Dominique Descamps, Yann Mairesse, and Samuel Beaulieu Nonequilibrium manipulation of quantum materials via electromagnetic dressing provides an on-demand route to tailoring electronic band structures through Floquet engineering. Time- and angle-resolved photoemission spectroscopy offers a direct means to probe these light-dressed electronic states. In … [Phys. Rev. B 113, 235430] Published Mon Jun 22, 2026", "tier": "A_MUST_READ", "score": "10", "reason": "Directly relevant to Floquet engineering and TR-ARPES experimental studies.", "tags": ["ARPES", "Floquet", "electronicstructure"], "image": "", "briefing": {"background": "강력한 전자기장을 물질에 조사하여 전자 밴드 구조를 변조하는 Floquet 엔지니어링은 양자 물질의 성질을 실시간으로 제어하려는 시도에서 핵심적인 기술입니다. 특히 반도체에서 빛에 의해 유도된 '드레싱(dressing)' 상태는 전도성과 위상적 특성을 변화시킬 수 있어 많은 관심을 받고 있습니다.", "motivation": "빛에 의해 드레싱된 전자 상태를 이해하기 위해 시간-분해 각분해 광전자 분광법(TR-ARPES)이 널리 사용되지만, 실제 물질 내에서의 유전 차폐(dielectric screening)가 이 드레싱 과정에 어떤 영향을 미치는지에 대한 정밀한 이해는 부족한 상태입니다.", "result": "이 논문은 반도체의 전자기적 드레싱 과정에서 유전 차폐의 역할을 분석합니다. TR-ARPES를 통해 관측되는 광유도 전자 상태의 변화가 물질 내부의 차폐 효과에 의해 어떻게 보정되는지를 밝힘으로써, 실험적으로 관측된 밴드 변조의 크기를 이론적으로 정확히 해석할 수 있는 틀을 제공합니다.", "implication": "실제 실험에서 가해준 외부 전자기장 세기와 실제 물질 내부에서 전자가 느끼는 유효 장의 세기 사이의 간극을 설명할 수 있게 되며, 이는 더 정밀한 Floquet 엔지니어링 설계를 가능하게 합니다.", "novelty": "독자의 주요 관심사인 Floquet 엔지니어링과 TR-ARPES를 직접적으로 연결하며, 추상적인 이론 모델을 넘어 실제 반도체 물질의 유전 특성이 비평형 상태의 밴드 구조 형성에 미치는 영향을 구체화했습니다.", "unresolved": "다양한 상관 관계(correlation)가 존재하는 시스템(예: 모트 절연체)에서도 동일한 차폐 메커니즘이 지배적인지에 대해서는 추가적인 검증이 필요합니다.", "future_work": "더 복잡한 상관 물질이나 위상 반도체에서 유전 차폐를 고려한 Floquet 상태의 동역학 연구가 이어질 것으로 예상됩니다.", "concepts": [{"term": "Floquet engineering", "why_emerged": "빛을 이용하여 물질의 해밀토니안을 주기적으로 구동함으로써 평형 상태에서 존재하지 않는 새로운 양자 상태를 유도하기 위해 등장했습니다.", "origin": "Gaston Floquet의 수학적 이론을 시간 주기적인 양자 역학 계에 적용하면서 시작됨", "connections": "비평형 상전이, 위상 절연체, 광유도 초전도"}, {"term": "Electromagnetic dressing", "why_emerged": "강한 전자기장과 전자가 결합하여 원래의 에너지 준위가 아닌 새로운 하이브리드 준위를 형성하는 현상을 설명하기 위해 도입되었습니다.", "origin": "양자 광학 및 원자 물리 분야에서 먼저 확립됨", "connections": "Floquet sidebands, Stark effect"}, {"term": "Dielectric screening", "why_emerged": "물질 내부의 전하들이 외부 전기장에 반응하여 재배치됨으로써 내부 실효 전기장을 약화시키는 현상을 설명하기 위해 등장했습니다.", "origin": "고전 전자기학 및 초기 고체 물리학에서 확립됨", "connections": "Thomas-Fermi screening, RPA(Random Phase Approximation)"}, {"term": "TR-ARPES", "why_emerged": "펌프-프로브 기법을 광전자 분광법에 결합하여, 펨토초 단위의 극초단 시간 영역에서 발생하는 전자 구조의 변화를 관측하기 위해 개발되었습니다.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "비평형 동역학, 초고속 분광학"}], "english_summary": ["This paper investigates the role of dielectric screening in the electromagnetic dressing of semiconductor band structures.", "The authors use TR-ARPES to probe light-induced electronic states and analyze how internal screening affects Floquet engineering.", "Results provide a quantitative framework for understanding the discrepancy between external field strength and observed band shifts.", "The study enhances the precision of manipulating quantum materials via off-resonant light irradiation."]}}, {"title": "Superconductivity and the quasiparticle mass enhancement near the charge density wave critical point using the Bethe-Salpeter method: Application to cuprates", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/9vbp-dv48", "authors": "Youichi Yamakawa, Hiroshi Kontani", "last_authors": "Youichi Yamakawa, Hiroshi Kontani", "summary": "Author(s): Youichi Yamakawa and Hiroshi Kontani In recent years, charge-channel order in strongly correlated metals has attracted much attention. Representative examples include electronic nematic doi/10.1103/v9rm-l6vb", "authors": "Jyoti Saini, Ankita Tiwari, Pawan Kumar Srivastava, Changgu Lee, Subhasis Ghosh", "last_authors": "Changgu Lee, Subhasis Ghosh", "summary": "Author(s): Jyoti Saini, Ankita Tiwari, Pawan Kumar Srivastava, Changgu Lee, and Subhasis Ghosh The van der Waals magnets ${\\mathrm{Fe}}_{3}{\\mathrm{GeTe}}_{2}$ and ${\\mathrm{Fe}}_{5}{\\mathrm{GeTe}}_{2}$, chemically similar yet magnetically distinct, provide an ideal platform for probing how structural complexity governs emergent magnetic order, anisotropy, and topological textures. ${\\mat… [Phys. Rev. B 113, 214451] Published Tue Jun 23, 2026", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Probes magnetism and topology in Fe-based vdW materials, highly relevant to quantum materials.", "tags": ["material", "FeGeTe", "vanderWaals"], "image": "", "briefing": {"background": "반데르발스(vdW) 자성체는 층상 구조와 자성을 결합해 2차원 자성 및 위상학적 현상을 탐구하는 플랫폼입니다. 특히 Fe3GeTe2와 Fe5GeTe2는 Fe 격자의 차이로 인해 물리적 성질이 크게 달라지는 대표적 계열입니다.", "motivation": "두 물질의 화학적 유사성에도 불구하고 나타나는 자기적 이방성 및 위상학적 질서(스카이르미온 등)의 근본적인 차이를 Fe 부격자(sublattice)의 관점에서 규명하고자 함.", "result": "추가된 Fe 부격자가 자기적 좌절(frustration)과 임계 현상에 결정적인 역할을 하며, 이것이 스카이르미온과 같은 위상적 텍스처 형성에 기여함을 제시함.", "implication": "vdW 자성체에서 원자 단위의 구조 조절(격자 엔지니어링)이 거시적 자기 위상 및 스핀 구조를 제어하는 강력한 도구가 될 수 있음을 시사함.", "novelty": "Fe3GeTe2와 Fe5GeTe2를 직접 비교함으로써, Fe 격자 구성이 스핀 동역학에 미치는 효과를 구체적으로 분리해 냈음. 귀하의 관심사인 자기 위상 물질 설계에 중요한 근거 자료가 됨.", "unresolved": "Fe 농도 변화에 따른 국소적 스핀 요동의 상세한 메커니즘과 이들이 스카이르미온 안정성에 미치는 정량적 영향.", "future_work": "ARPES를 이용한 전자 구조 변화 관측 및 외부 자기장/응력 하에서의 스카이르미온 동역학 직접 측정.", "concepts": [{"term": "van der Waals magnet", "why_emerged": "2D 극한 물성 및 스핀트로닉스 응용 가능성 때문", "origin": "2010년대 중반 CrI3, Fe3GeTe2 발견 이후 활성화", "connections": "2D 자성, 위상 반금속, 자기 이방성"}, {"term": "Skyrmion", "why_emerged": "위상적으로 안정된 작은 스핀 소용돌이 구조가 미래 정보 소자 후보로 주목받음", "origin": "Tony Skyrme (입자물리 모델), 자기계는 2009년 MnSi에서 처음 관측", "connections": "위상 홀 효과, 스핀-궤도 결합"}], "english_summary": ["Compares Fe3GeTe2 and Fe5GeTe2 to understand magnetic differences.", "Identifies the extra Fe sublattice as key to frustration and topological texture emergence.", "Provides insights into controlling skyrmion states via structural tuning in vdW magnets."]}}, {"title": "Odd-parity altermagnetism: A spin group study", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/7kmk-yl2t", "authors": "Minghuan Zeng, Zheng Qin, Ling Qin, et al.", "last_authors": "Dong-Hui Xu, Rui Wang", "summary": "Author(s): Minghuan Zeng, Zheng Qin, Ling Qin, Shiping Feng, Lin Wu, Dong-Hui Xu, and Rui Wang Conventional altermagnetism, characterized by the even-parity spin splitting, has been intensively studied. Here, on the basis of spin-group analyses, the authors elucidate necessary conditions for the emergence of odd-parity altermagnetism. It is derived that the odd-parity altermagnetism arises from the following criteria: (i) the breaking nonmagnetic time reversal symmetry; (ii) the collinear compensated magnetism; (iii) the symmetry [ C 2 | | E ¯ ] connecting opposite-spin sublattices, where C 2 and E ¯ respectively represent a 180° rotation around the axis perpendicular to spins and the inversion separating opposite-spin sublattices. [Phys. Rev. B 113, L220412] Published Wed Jun 24, 2026", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Symmetry analysis of altermagnetism, a core interest topic with emerging ARPES relevance.", "tags": ["topic", "altermagnetism", "symmetry"], "image": "", "briefing": {"background": "알터자성(Altermagnetism)은 비자성 시간 반전 대칭성을 깨면서도 순수 자기 모멘트가 상쇄되는 새로운 자기 위상입니다. 기존의 강자성/반강자성과 구분되는 고유한 스핀 분할 특성을 가집니다.", "motivation": "지금까지 주로 논의된 우-패리티(even-parity) 알터자성을 넘어, 스핀 그룹 이론을 통해 '홀수-패리티(odd-parity)' 알터자성의 존재 조건과 수학적 기원을 체계화하고자 함.", "result": "비자성 시간 반전 대칭 깨짐, 콜리니어 보상 자성, 그리고 특정 스핀-공간 대칭성(C2|E_bar 결합)이 홀수-패리티 알터자성의 필수 조건임을 수학적으로 유도함.", "implication": "알터자성 물질 탐색의 범위를 넓혔으며, 향후 ARPES를 통한 스핀 밴드 구조 관측 시 대칭성 분석의 가이드라인을 제공함.", "novelty": "기존의 알터자성 분류를 대칭성 그룹 관점에서 , L220410] Published Wed Jun 24, 2026", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Experimental X-ray study of domain wall dynamics in a prototypical spin-orbit coupled correlated insulator.", "tags": ["material", "Sr2IrO4", "antiferromagnetism"], "image": "", "briefing": {"background": "Sr2IrO4는 강한 스핀-궤도 결합(SOC)과 전자 상관관계가 어우러진 Mott 절연체로, 유사한 페로브스카이트 구조를 가진 초전도체와의 연관성 때문에 지속적으로 연구됨.", "motivation": "Sr2IrO4의 반강자성 도메인 벽(domain wall)이 어떻게 생성되고 이동하는지를 시공간적으로 분해하여, 레이저 펌프-탐침 실험의 한계를 극복하고자 함.", "result": "X선 자유전자 레이저(XFEL)를 이용해 펨토초 단위에서 도메인 벽의 이동 속도를 최초로 측정하고, 시공간적 역학 관계를 규명함.", "implication": "초고속 자성 제어 및 도메인 벽 기반 소자 설계에 필수적인 근본 데이터를 제공하며, 코히어런트 산란법의 활용 가치를 입증함.", "novelty": "단순 도메인 영상화를 넘어, 도메인 벽의 '이동 속도'를 정량적으로 도출한 점이 핵심. 강상관계 물질의 동역학 이해에 중요한 돌파구임.", "unresolved": "도메인 벽 이동을 유도하는 구동력이 격자 구조의 비균질성과 어떻게 상호작용하는지에 대한 상세 모델.", "future_work": "다양한 온도 및 외부 자극 하에서의 도메인 벽 동역학 변화 측정, 다른 5d 전이금속 산화물로의 확장.", "concepts": [{"term": "Sr2IrO4", "why_emerged": "5d 전이금속 기반의 SOC-상관관계 결합 모델 시스템", "origin": "Kim et al. (2008년, J(eff)=1/2 상태 보고)", "connections": "Cuprates, Mott insulator"}, {"term": "Coherent X-ray scattering", "why_emerged": "나노 규모의 도메인 역학을 직접적으로 관찰하기 위해", "origin": "시너지 방사광 기술 발전과 함께 성숙", "connections": "XFEL, 도메인 벽 동역학"}], "english_summary": ["Investigates antiferromagnetic domain wall dynamics in Sr2IrO4 using XFEL.", "Successfully measures domain wall migration velocity in the time domain.", "Advances understanding of ultrafast control in spin-orbit coupled systems."]}}, {"title": "Spin-orbit coupling induced multigap superconductivity in β−Bi2Pd", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/tgmd-8bqz", "authors": "Sonu Prasad Keshri", "last_authors": "Sonu Prasad Keshri", "summary": "Author(s): Sonu Prasad Keshri The superconductor $β\\text{−}{\\mathrm{Bi}}_{2}\\mathrm{Pd}$ is well known for its inconsistent experimental indications of single versus multiple superconducting (SC) gaps, while simultaneously being c C. W. Song", "last_authors": "Giovanni Vignale, Justin C. W. Song", "summary": "Author(s): Oles Matsyshyn, Giovanni Vignale, and Justin C. W. Song Superconductivity and Bloch band Berry curvature responses represent two distinct paradigms of quantum coherent phenomena. The former relies on the collective motion of Cooper pairs while the latter proceeds from the momentum-space winding of Bloch wave functions. Here, we reveal a superconducting B… [Phys. Rev. Lett. 136, 246902] Published Thu Jun 18, 2026", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Connects unconventional superconductivity with Berry curvature, highly relevant theoretical development.", "tags": ["superconductivity", "Berrycurvature", "topological", "theory"], "image": "", "briefing": {"background": "베리 곡률(Berry curvature)은 전자 구조의 위상적 성질을 결정하며, 비전도성 응답인 '베리 곡률 쌍극자(Berry Curvature Dipole)'는 비중심대칭 물질에서 비선형 홀 효과를 유도하는 핵심 요소입니다.", "motivation": "초전도체에서의 쿠퍼 쌍 운동과 베리 곡률의 상호작용을 통합하여, 초전도 상태에서 나타날 수 있는 새로운 위상적 응답을 이론적으로 정립하고자 했습니다.", "result": "초전도 상태의 위상학적 응답인 '초전도 베리 곡률 쌍극자' 개념을 제안하고, 이것이 초전도체 내부의 기하학적 위상과 결합하여 비정상적인 전자기적 응답을 만들어냄을 규명했습니다.", "implication": "초전도체의 위상적 상태를 비선형 수송 현상을 통해 탐지할 수 있는 경로를 제시하며, 이는 향후 위상 초전도체 연구에 중요한 관측 수단이 될 수 있습니다.", "novelty": "기존의 정상 상태(normal state)에 한정되었던 베리 곡률 쌍극자 개념을 초전도 상태로 성공적으로 확장하여, 밴드 위상과 응축 물리학을 연결했습니다.", "unresolved": "이 이론적 예측을 실험적으로 입증하기 위한 구체적인 물질 후보군과 실험 방법론은 아직 제안되지 않았습니다.", "future_work": "비중심대칭 초전도체에서 비선형 마이스너 효과나 홀 전류 응답을 계산하는 후속 연구가 뒤따를 것으로 보입니다.", "concepts": [{"term": "Berry Curvature Dipole", "why_emerged": "시간 반전 대칭이 깨진 시스템에서 나타나는 비선형 홀 효과를 기술하기 위해 필요.", "origin": "Fu (2015).", "connections": "비선형 홀 효과, 위상 반도체, 밴드 구조 기하학."}, {"term": "Cooper Pairs", "why_emerged": "BCS 이론에서 전자 간 인력을 통한 초전도 상태의 전하 캐리어를 설명하기 위해 필요.", "origin": "Cooper (1956).", "connections": "BCS 이론, 초전도성, 위상 초전도체."}], "english_summary": ["Introduces the concept of superconducting Berry curvature dipole.", "Links collective motion of Cooper pairs with momentum-space Berry geometry.", "Develops a theoretical framework for nonlinear responses in superconductors.", "Expands topological response physics from normal metals to superconducting states."]}}, {"title": "Superconducting phase diagram of multilayer square-planar nickelates", "journal": "Science", "source": "Gemini", "link": "https://doi.org/10.1126/science.adp4440", "authors": "Grace A. Pan, Dan Ferenc Segedin, Sophia F. R. TenHuisen, et al.", "last_authors": "Berit H. Goodge, Julia A. Mundy", "summary": "The discovery of superconductivity in square-planar nickelates has offered a rich materials platform to explore the origins of high-temperature superconductivity. However, experimental investigations have largely been limited to the infinite-layer R NiO 2 ( R , rare earth) nickelates. We constructed a phase diagram of multilayer square-planar Nd n +1 Ni n O 2 n +2 compounds and found signatures of superconductivity for dimensionality n = 4 to 8. Upon decreasing n , the superconducting anisotropy evolves owing to 4 f electron effects, and electronic structure characteristics approach cuprate-like behavior. Magnetic fluctuations persist from within the superconducting regime and into the overdoped, nonsuperconducting regime. The superconducting regime overlaps with that of chemically doped infinite-layer nickelates, demonstrating underlying commonalities as well as differences across varying structural realizations of square-planar nickelates. Our work establishes this layered template for creating new nickel-based superconductors.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Unconventional superconductivity in nickelates with cuprate-like features and magnetic fluctuations.", "tags": ["superconductivity", "nickelate", "unconventionalsuperconductivity", "magneticfluctuations"], "image": "", "briefing": {"background": "니켈산염은 구리산염(cuprate)과 전자 구조가 유사하여 고온 초전도체의 기원을 탐구하는 데 이상적인 플랫폼입니다.", "motivation": "기존의 무한층(infinite-layer) 구조를 넘어, 다층 니켈산염에서의 초전도성 상도를 확인하고 층상 구조가 초전도성에 미치는 영향을 체계적으로 조사하고자 했습니다.", "result": "층수(n=4~8)에 따른 Nd계 니켈산염의 초전도성 상도를 확립했으며, 층수가 감소함에 따라 구리산염과 유사한 물성으로 변화하고 자기적 요동이 초전도 상태와 공존함을 확인했습니다.", "implication": "니켈산염 초전도체의 설계 원리를 제시하였으며, 구리산염 물리학과의 보편적 공통점을 찾아내어 강상관계 초전도체 연구의 새로운 지평을 열었습니다.", "novelty": "박막 성장을 통해 고품질 다층 니켈산염 샘플을 확보하고, 층수 변화에 따른 초전도 이방성 및 자기 요동의 거동을 종합적으로 분석한 점이 매우 탁월합니다.", "unresolved": "니켈산염에서 관측되는 자기 요동이 구리산염의 스핀 파동과 완전히 동일한 기원인지, 혹은 다른 형태의 자기적 질서인지 명확히 밝혀지지 않았습니다.", "future_work": "ARPES를 통한 밴드 구조 분석 및 층수에 따른 페르미 표면의 변화 추적, 도핑에 따른 상전이 연구가 진행될 것으로 보입니다.", "concepts": [{"term": "Square-planar Nickelate", "why_emerged": "구리산염의 전자 구조를 모방한 인공 초전도체 시스템을 구성하기 위해 필요.", "origin": "Li et al. (2019).", "connections": "cuprate, 하이테크 초전도체, 페로브스카이트."}, {"term": "Magnetic Fluctuations", "why_emerged": "강상관계 물질에서 초전도 쌍을 형성하는 매개 기제로 강력하게 의심되는 현상.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "스핀 요동, 하이테크 초전도성, 구리산염."}], "english_summary": ["Constructs the superconducting phase diagram for multilayer Nd-based nickelates.", "Shows superconducting signatures for n=4 to 8 multilayer systems.", "Finds electronic similarities to cuprates as dimensionality decreases.", "Observes persistent magnetic fluctuations in the superconducting and overdoped regimes."]}}, {"title": "Realization of room-temperature magnetism and multistep magnetization switching in 2D metallic ferrimagnets", "journal": "Science_Advances", "source": "Gemini", "link": "https://doi.org/10.1126/sciadv.aee0391", "authors": "Zijing Zhao, Nanshu Liu, Qinghua Zhang, et al.", "last_authors": "Xiaolei Wang, Yanglong Hou", "summary": "Achieving multistep magnetization switching in two-dimensional (2D) ferrimagnets demonstrates substantial promise for advancing high-density non-Boolean logic and memory devices. However, existing 2D ferrimagnets are still hampered by low Curie temperatures and a lack of tunable multiple magnetic states. Here, we report the successful synthesis of a family of 2D Fe 0.875 S (1− x ) Se x alloy with robust room-temperature ferrimagnetism. The key magnetic and electrical properties can be effectively regulated by tailoring the chalcogen ratio in Fe 0.875 S (1− x ) Se x alloy. Notably, multiple magnetic states and resistance plateaus are observed because of the spin canting behavior, enabling the realization of several distinct spin states by adjusting magnetic fields and temperatures, thereby demonstrating great potential for multistate applications. Density functional theory calculations further reveal that the evolution of magnetic anisotropy originates from variations in the orbital occupation of electronic states near the Fermi level. Our work can expand the library of 2D metallic ferrimagnets and pave the way for designing high-density spintronic devices.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Highly relevant 2D metallic ferrimagnetism with electronic structure insights for spintronics.", "tags": ["2Dmaterials", "magnetism", "spintronics", "DFT"], "image": "", "briefing": {"background": "차세대 스핀트로닉스 소자를 위해 상온에서 작동하는 2차원 자성체 연구가 활발합니다. 특히 금속성 2차원 강자성체나 페리자성체는 효율적인 전기적 제어가 가능하여 고밀도 메모리 및 논리 소자 구현에 핵심적입니다.", "motivation": "기존 2차원 페리자성체들은 큐리 온도가 낮고 자기 상태의 자유도가 제한적이라는 한계가 있습니다. 이를 극복하기 위해 Fe0.875S(1-x)Sex 합금 시스템을 합성하여 자기적 성질의 제어 가능성을 탐구하고자 했습니다.", "result": "칼코겐 비율(S vs Se)을 조정하여 상온 페리자성 특성을 확보했습니다. 특히 스핀 기울기(spin canting) 효과로 인해 자기장과 온도에 따라 여러 저항 상태를 가지는 다단계 자기 스위칭 현상을 관찰했습니다.", "implication": "다단계 자기 상태 구현이 가능해짐에 따라, 이를 활용한 다치(multi-state) 논리 소자 및 고밀도 비휘발성 메모리 설계의 새로운 플랫폼을 제시합니다.", "novelty": "상온에서 작동하는 금속성 페리자성체를 구현했으며, DFT 계산을 통해 Fermi 레벨 근처의 궤도 점유 변화가 자기 이방성을 결정함을 밝혀 전자구조적 이해도를 높였습니다.", "unresolved": "실제 소자 구현 시 나타날 수 있는 기판과의 계면 효과나 장기적인 자성 안정성에 대한 추가 검증이 필요합니다.", "future_work": "Fe0.875S(1-x)Sex를 이용한 실제 스핀트로닉스 소자 제작 및 저항 상태 스위칭의 속도와 내구성 평가가 후속 연구로 예상됩니다.", "concepts": [{"term": "Ferrimagnetism", "why_emerged": "상쇄되지 않는 스핀 구조를 통해 강자성과 유사하게 거시적인 자성을 띠면서도 스핀 배열을 조절할 여지가 많아 차세대 소자에 유리함.", "origin": "Louis Néel에 의해 제안됨.", "connections": "반강자성(antiferromagnetism), 강자성(ferromagnetism)의 중간적 성격."}, {"term": "Spin Canting", "why_emerged": "반강자성적 배열에서 완벽한 상쇄가 일어나지 않고 특정 각도로 스핀이 기울어지면서 순수 자기 모멘트가 발생하는 현상.", "origin": "Dzyaloshinskii-Moriya 상호작용 등과 연관.", "connections": "비교적 약한 자성 모멘트 생성, 위상 자성체 연구와 연결."}, {"term": "Magnetic Anisotropy", "why_emerged": "특정 방향으로 자기화가 잘 일어나게 하는 에너지 장벽을 정의하기 위해 필요함.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "스핀-궤도 결합(SOC), 2차원 자성체의 안정성 결정 인자."}], "english_summary": ["Successfully synthesized 2D metallic Fe0.875S(1-x)Sex ferrimagnets with robust room-temperature magnetism.", "Demonstrated multistep magnetization switching through spin canting, tunable via chalcogen ratio.", "DFT calculations link magnetic anisotropy changes to orbital occupation near the Fermi level.", "Offers a new material platform for high-density multistate spintronic and memory applications."]}}, {"title": "Reentrant superconductivity at an oxide heterointerface", "journal": "Science_Advances", "source": "Gemini", "link": "https://doi.org/10.1126/sciadv.aeg0460", "authors": "Denis Maryenko, Minoru Kawamura, Igor V. Maznichenko, et al.", "last_authors": "Arthur Ernst, Masashi Kawasaki", "summary": "A magnetic field typically suppresses superconductivity by either breaking Cooper pairs via the Zeeman effect or inducing vortex formation. However, under certain circumstances, a magnetic field can stabilize superconductivity instead. This seemingly counterintuitive phenomenon is associated with magnetic interactions and has been extensively studied in three-dimensional materials. By contrast, this phenomenon, hinting at unconventional superconductivity, remains largely unexplored in two-dimensional systems, with moiré-patterned graphene being the only known example. Here, we report the observation of reentrant superconductivity at the epitaxial (110)-oriented LaTiO 3 -KTaO 3 interface. This phenomenon occurs across a wide range of charge carrier densities, which, unlike in three-dimensional materials, can be tuned in situ via electrostatic gating. We propose that the observed reentrant superconductivity can arise from an interplay between strong spin-orbit coupling and a magnetic field–driven modification of the Fermi surface. Our findings provide insight into reentrant superconductivity and establish a robust platform for exploring unconventional superconducting phenomena in two-dimensional systems.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Unconventional reentrant superconductivity in a 2D oxide heterointerface, strong spin-orbit coupling, Fermi surface, relates to moiré systems.", "tags": ["superconductivity", "unconventionalsuperconductivity", "2Dmaterials", "oxideheterostructures", "Fermisurface", "spin-orbitcoupling", "gating"], "image": "", "briefing": {"background": "자기장은 보통 쿠퍼 쌍을 파괴하거나 와류(vortex)를 생성하여 초전도성을 억제합니다. 그러나 특정 조건에서는 자기장이 초전도성을 강화하거나 유도하는 '재진입 초전도성' 현상이 보고되어 왔습니다.", "motivation": "3차원 물질에서는 연구된 바 있으나 2차원 계면 시스템에서는 모아레 그래핀 외에 거의 보고된 바 없어, 산화물 이종접합 계면에서의 가능성을 탐구하고자 했습니다.", "result": "LaTiO3-KTaO3 이종접합에서 게이팅을 통해 전하 밀도를 조절하며 재진입 초전도성을 관찰했습니다. 이는 강한 스핀-궤도 결합과 자기장에 의한 페르미 표면 변형의 상호작용으로 해석됩니다.", "implication": "산화물 계면이 2차원 초전도 및 위상 물성 연구를 위한 유연한 플랫폼임을 입증하며, 게이팅을 통한 인-시튜 물리 제어 가능성을 시사합니다.", "novelty": "2차원 시스템에서 전기적 게이팅만으로 재진입 초전도성을 제어할 수 있음을 입증하여 2D 초전도 물성 탐구에 새로운 도구를 제공했습니다.", "unresolved": "재진입 초전도성의 정확한 미시적 메커니즘과 스핀-궤도 결합이 구체적으로 어떻게 자기장 응답을 바꾸는지에 대한 ARPES 등 직접적인 전자구조 증거가 필요합니다.", "future_work": "저온 환경 하에서의 자기장 의존적 전기 전도도 측정 및 ARPES를 이용한 페르미 표면 맵핑을 통해 초전도 상태와 전자구조 변화의 상관관계를 명확히 할 것으로 보입니다.", "concepts": [{"term": "Reentrant Superconductivity", "why_emerged": "자기장이 통상적인 초전도 파괴 요인이 아닌, 특정 조건에서 페르미 표면을 재구성하여 초전도성을 안정화하는 현상을 설명하기 위해.", "origin": "다양한 벌크 물질에서 수십 년간 연구됨.", "connections": "Jaccarino-Peter 효과, 스핀-궤도 결합(SOC)."}, {"term": "Oxide Heterointerface", "why_emerged": "서로 다른 산화물을 쌓아 계면에서만 나타나는 특이한 전자 상태(2DEG, 초전도 등)를 연구하기 위해.", "origin": "2004년 Ohtomo and Hwang의 LAO/STO 연구가 시초.", "connections": "2차원 전자 가스(2DEG), 강상관계 물리."}, {"term": "Spin-Orbit Coupling", "why_emerged": "전자 스핀과 궤도 운동의 상호작용이 위상학적 위상이나 이방성 자기 물성에 결정적인 역할을 함.", "origin": "양자역학 초기 이론부터 정립.", "connections": "위상 절연체, Rashba 효과, 초전도성."}], "english_summary": ["Observed reentrant superconductivity at epitaxial LaTiO3-KTaO3 heterointerfaces.", "The effect is tunable via electrostatic gating, distinct from 3D counterparts.", "Mechanisms likely involve the interplay between strong spin-orbit coupling and magnetic-field-driven Fermi surface modification.", "Provides a robust platform for investigating unconventional 2D superconductivity."]}}, {"title": "Light-Induced Topological Phase Transitions and Anomalous Thermal Transport in d-Wave Altermagnets", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2604.20164", "authors": "Ayesha Maryam, Muzamil Shah, Kashif Sabeeh, Reza Asgari", "last_authors": "Kashif Sabeeh, Reza Asgari", "summary": "arXiv:2604.20164v3 Announce Type: replace Abstract: We study intrinsic thermal transport and Floquet-engineered topology in a two-dimensional d wave altermagnetic topological insulator powered by linearly polarized light. We analyze the anomalous Hall, Nernst, and thermal Hall conductivities, as well as their spin-resolved equivalents, and develop closed-form formulas for the Berry curvature using an analytically calculated high-frequency effective Hamiltonian. We demonstrate that linearly polarized light, in contrast to conventional antiferromagnets, breaks the symmetry connecting spin sectors in altermagnets, allowing a series of spin-selective topological phase transitions from a quantum spin Hall state to a spin-polarized Chern insulator and finally to a trivial phase. The Nernst response shows substantial thermal activation and significant sensitivity to the gap size in the Chern domain, but both the electrical and thermal Hall responses become quantized and meet the anomalous Wiedemann Franz law. Every anomalous transport coefficient exhibits a distinctive d wave dependence on the polarization angle, reversing sign under orthogonal rotation and vanishing at symmetry-restoring directions. Our findings show a path to all-optical regulation of topological and caloritronic responses beyond traditional magnetic systems and establish thermal transport as a sensitive probe of altermagnetic order.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Theory of altermagnets and transport, highly relevant to topological/magnetic materials interest.", "tags": ["altermagnet", "topology", "anomalous-Hall"], "image": "https://arxiv.org/html/2604.20164v3/x1.png", "briefing": {"background": "알터자성(Altermagnetism)은 기존 강자성/반강자성과는 다르게 스핀-궤도 결합 없이도 스핀 분리(spin splitting)를 보이며, 이로 인해 비전통적인 위상학적 및 수송 현상을 나타낼 수 있어 최근 큰 주목을 받고 있습니다.", "motivation": "빛을 이용한 Floquet 공학을 통해 2차원 d-파동 알터자성체의 위상적 상전이를 제어하고, 이 과정에서의 비정상 열 수송 특성을 분석하고자 했습니다.", "result": "선형 편광된 빛을 이용해 스핀 선택적 위상 상전이(양자 스핀 홀 상태 -> 스핀 편광된 Chern 절연체)를 유도했습니다. 비정상 열 수송 계수가 알터자성 순서의 척도로 작동함을 보였습니다.", "implication": "빛을 통한 비접촉식 위상 제어 기술을 알터자성체로 확장하며, 열 수송 측정을 통해 알터자성 질서를 프로빙하는 새로운 방법을 제시합니다.", "novelty": "빛으로 알터자성의 스핀 분리 대칭성을 조절하여 위상학적 상태를 능동적으로 바꾸는 메커니즘을 이론적으로 정립했습니다.", "unresolved": "이론적 모델에 기초하고 있으며, 실제 물질에서 빛에 의한 가열 효과와 순수한 위상적 효과를 분리하는 것이 실험적 난제로 남아 있습니다.", "future_work": "실제 2차원 알터자성 후보 물질(예: RuO2 등)에 대한 초고속 분광학 및 펌프-프로브 측정을 통한 위상 상태 탐색이 예상됩니다.", "concepts": [{"term": "Altermagnetism", "why_emerged": "반강자성의 스핀 상쇄와 강자성의 스핀 분리 특성을 동시에 가지는 새로운 자기 상을 기술하기 위해.", "origin": "최근 2020년대 초반 이론적으로 급부상.", "connections": "비정상 홀 효과, 결정 대칭성에 의존하는 스핀 분리."}, {"term": "Floquet Engineering", "why_emerged": "주기적으로 변하는 빛을 사용하여 물질의 해밀토니안을 변형하고 새로운 물성을 유도하기 위해.", "origin": "Floquet 이론은 오래전 수학적 근간이 존재, 고체물리 적용은 2010년대 이후 본격화.", "connections": "위상학적 상전이, 광-물질 상호작용."}, {"term": "Anomalous Hall Effect", "why_emerged": "외부 자기장 없이도 스핀-궤도 결합이나 자성으로 인해 전자 흐름이 꺾이는 현상을 설명하기 위해.", "origin": "Edwin Hall이 발견 후 Karplus-Luttinger 등에 의해 이론화.", "connections": "베리 곡률(Berry curvature), 위상학적 불변량."}], "english_summary": ["Theoretically investigates light-induced topological phase transitions in d-wave altermagnets.", "Demonstrates spin-selective topological transitions using Floquet-engineered effective Hamiltonians.", "Establishes thermal transport as a sensitive probe for altermagnetic order.", "Shows potential for all-optical regulation of topological and caloritronic responses."]}}, {"title": "Spontaneous emergence of altermagnetism in the single-orbital extended Hubbard model (Phys. Rev. B)", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2507.00837", "authors": "Jin-Wei Dong, Yu-Han Lin, Ruiqing Fu, et al.", "last_authors": "Ziqiang Wang, Sen Zhou", "summary": "arXiv:2507.00837v2 Announce Type: replace Abstract: Altermagnetism (AM), the recently discovered third class of collinear magnetic order, is characterized by non-relativistic momentum-dependent spin-split electronic structure with compensated zero net magnetization. It can arise from the conventional antiferromagnetism by introducing local anisotropy on the two opposite-spin sublattices, either through structural changes in local crystallographic symmetry or spontaneous emergence of local staggered orbital order from electron correlations in multi-orbital systems. Here, we demonstrate on the two-dimensional square lattice that a $d$-wave AM can emerge spontaneously in the single-orbital extended Hubbard model, without invoking crystallographic anisotropy and multi-orbital physics. We carry out mean-field studies on the concrete single-orbital $t$-$U$-$V$ model with $U$ and $V$ the onsite and nearest-neighbor Coulomb interactions, obtaining the mean-field ground states, analyzing their properties, and determining the phase diagram in the $U$-$V$ plane. The $d$-wave AM with novel spin-transport behavior is found to be stabilized in a wide region of the phase diagram when the system is doped away from half-filling, actualized by the coexistence of onsite antiferromagnetic order and complex $d$-wave nearest-neighbor spin bond orders. Our findings provide an alternative route to achieve AM and substantially expand the range of candidate AM materials.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Theoretical study on the spontaneous emergence of altermagnetism in the Hubbard model, directly relevant.", "tags": ["theory", "altermagnetism", "Hubbardmodel", "electronicstructure", "magneticmaterials"], "image": "https://arxiv.org/html/2507.00837v2/x1.png", "briefing": {"background": "알터마그네티즘(Altermagnetism, AM)은 순자화값이 0인 반강자성체임에도 불구하고, 결정 대칭성에 의해 운동량 의존적 스핀 분리(momentum-dependent spin splitting)를 보이는 새로운 자성 상태입니다. 기존에는 주로 다중 궤도(multi-orbital) 효과나 결정 구조적 비등방성에 의존한다고 알려져 있었습니다.", "motivation": "단일 궤도 모델인 확장 허바드 모델(Extended Hubbard model)에서도 다중 궤도나 구조적 비등방성 없이 알터마그네틱 상이 자발적으로 나타날 수 있는지 이론적으로 규명하고자 하였습니다.", "result": "2차원 정사각형 격자의 t-U-V 모델에서 반강자성 차수와 복소 d-파 인접 스핀 결합 차수가 공존함으로써 d-파 알터마그네틱 상태가 자발적으로 형성됨을 확인하였습니다.", "implication": "알터마그네티즘이 복잡한 궤도 결합 없이도 기본적인 전자 상관관계만으로 구현될 수 있음을 증명하여, 후보 물질 탐색의 범위를 훨씬 넓혔습니다.", "novelty": "구조적 비등방성 없이 순수하게 전자 상관관계(U, V)만으로 알터마그네티즘을 유도했다는 점이 핵심이며, 이는 단순한 단일 궤도 시스템에서도 새로운 자성 물리 현상이 나타날 수 있음을 시사합니다.", "unresolved": "실제 단일 궤도 성분을 가진 특정 물질에서 이 모델의 예측이 실험적으로 완벽히 검증되지는 않았습니다.", "future_work": "해당 d-파 알터마그네틱 상에서 나타나는 특이한 스핀 수송 현상을 검증하기 위한 ARPES 연구 및 물질 설계를 진행할 것으로 보입니다.", "concepts": [{"term": "Altermagnetism", "why_emerged": "기존의 자성 분류(강자성, 반강자성)로 설명되지 않는, 순자화율은 없으나 스핀 분리가 일어나는 물질의 특성을 설명하기 위해 제안됨.", "origin": "최근(2022-2024년 경) 이론적 정립 및 실험적 보고가 활발해짐.", "connections": "반강자성체, 비상대론적 스핀 분리, Berry 곡률, spintronics."}, {"term": "Extended Hubbard Model", "why_emerged": "온사이트 상호작용(U) 외에 인접 사이트 간 상호작용(V)이 물리 현상에 미치는 영향을 포함하기 위해 도입.", "origin": "Hubbard 모델의 확장형으로 전산 응집물리에서 오래전부터 사용됨.", "connections": "d-wave 초전도, 전하 밀도 파(CDW), 강상관계 전자계."}], "english_summary": ["Altermagnetism can emerge spontaneously in a single-orbital extended Hubbard model.", "The study identifies d-wave AM phases driven by onsite AFM and complex d-wave spin bond orders.", "This mechanism bypasses the need for multi-orbital   const badges = document.createElement('div');
  badges.className = 'badges';
  if (r.score) badges.appendChild(textEl('span', 'badge score', `${r.score}/10`));
  if (r.tier) badges.appendChild(textEl('span', 'badge', r.tier));
  if (r.journal) badges.appendChild(textEl('span', 'badge', r.journal));
  if (r.source) badges.appendChild(textEl('span', 'badge', r.source));
  headText.appendChild(badges);
  const title = document.createElement('h1');
  if (r.link) { const titleLink = document.createElement('a'); titleLink.href = r.link; titleLink.target = '_blank'; titleLink.rel = 'noopener noreferrer'; titleLink.textContent = r.title || ''; title.appendChild(titleLink); }
  else { title.textContent = r.title || ''; }
  headText.appendChild(title);
  headText.appendChild(textEl('p', 'meta', [r.journal, r.source].filter(Boolean).join(' | ')));
  if (r.last_authors || r.authors) { const authors = document.createElement('p'); authors.className = 'authors'; if (r.last_authors) authors.append('Last authors: ' + r.last_authors); if (r.authors) authors.append((r.last_authors ? ' | ' : '') + 'Authors: ' + r.authors); headText.appendChild(authors); }
  appendLabeledText(headText, 'why', 'Filter reason: ', r.reason);
  if (r.tags && r.tags.length) { const tags = document.createElement('div'); tags.className = 'tags'; r.tags.forEach(tag => tags.appendChild(textEl('span', 'tag', '#' + tag))); headText.appendChild(tags); }
  if (r.link) { const link = document.createElement('a'); link.className = 'link'; link.href = r.link; link.target = '_blank'; link.rel = 'noopener noreferrer'; link.textContent = 'Open paper'; headText.appendChild(link); }
  head.appendChild(headText);
  if (r.summary) { const abstract = document.createElement('p'); abstract.className = 'original-abstract'; const strong = textEl('strong', '', 'Original abstract'); abstract.appendChild(strong); abstract.append(r.summary); head.appendChild(abstract); }
  slideEl.appendChild(head);
  const briefing = document.createElement('div');
  briefing.className = 'briefing';
  appendBriefSection(briefing, 'Background', b.background);
  appendBriefSection(briefing, 'Motivation', b.motivation);
  appendBriefSection(briefing, 'Result', b.result);
  appendBriefSection(briefing, 'Implication', b.implication);
  appendBriefSection(briefing, "Why it's important / Novelty", b.novelty);
  appendBriefSection(briefing, 'Unresolved Questions', b.unresolved);
  appendBriefSection(briefing, 'Expected Future Work', b.future_work);
  if (b.concepts && b.concepts.length) {
    const section = document.createElement('section');
    section.className = 'brief-section wide';
    section.appendChild(textEl('h2', '', 'Concepts / Terms'));
    const concepts = document.createElement('div');
    concepts.className = 'concepts';
    b.concepts.forEach(c => {
      const item = document.createElement('div');
      item.className = 'concept';
      item.appendChild(textEl('h3', '', c.term || 'Concept'));
      [['왜 생겼나: ', c.why_emerged], ['누가 만들었나: ', c.origin], ['연결되는 흐름: ', c.connections]].forEach(([label, text]) => { if (!text) return; const p = document.createElement('p'); const bold = textEl('b', '', label); p.appendChild(bold); p.append(text); item.appendChild(p); });
      concepts.appendChild(item);
    });
    section.appendChild(concepts);
    briefing.appendChild(section);
  }
  if (b.english_summary && b.english_summary.length) { const section = document.createElement('section'); section.className = 'brief-section wide'; section.appendChild(textEl('h2', '', 'English Summary')); const ul = document.createElement('ul'); b.english_summary.slice(0, 5).forEach(line => ul.appendChild(textEl('li', '', line))); section.appendChild(ul); briefing.appendChild(section); }
  slideEl.appendChild(briefing);
  counterEl.textContent = `${index + 1} / ${slides.length}`;
  prevBtn.disabled = index === 0;
  nextBtn.disabled = index === slides.length - 1;
}
prevBtn.addEventListener('click', () => { index = Math.max(0, index - 1); render(); });
nextBtn.addEventListener('click', () => { index = Math.min(slides.length - 1, index + 1); render(); });
document.addEventListener('keydown', event => { if (event.key === 'ArrowLeft') prevBtn.click(); if (event.key === 'ArrowRight') nextBtn.click(); });
render();
</script>
</body>
</html>
