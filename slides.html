<title>Daily Paper Slideshow</title>
<style>
  :root {
    color-scheme: light;
    --bg: #f6f7f4;
    --paper: #ffffff;
    --ink: #111827;
    --muted: #64748b;
    --line: #d8ddd2;
    --accent: #176b87;
    --accent-2: #9a3412;
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; overflow: auto; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: var(--bg); color: var(--ink); }
  .shell { max-width: 1500px; min-height: 100vh; margin: 0 auto; padding: 14px 18px; display: flex; flex-direction: column; }
  .topbar { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 16px; }
  .top-actions { display: flex; align-items: center; gap: 10px; }
  .topbar a, button { border: 1px solid var(--line); border-radius: 8px; background: var(--paper); color: var(--ink); padding: 10px 14px; font-weight: 700; text-decoration: none; cursor: pointer; }
  button.primary { background: var(--accent); border-color: var(--accent); color: white; }
  button:disabled { opacity: 0.45; cursor: not-allowed; }
  .counter { color: var(--muted); font-weight: 700; }
  .slide { min-height: calc(100vh - 82px); background: var(--paper); border: 1px solid var(--line); border-radius: 10px; padding: 18px; box-shadow: 0 18px 42px rgba(15, 23, 42, 0.10); display: grid; grid-template-columns: minmax(310px, 0.86fr) minmax(0, 1.55fr); gap: 18px; overflow: visible; }
  .paper-head { min-width: 0; min-height: 0; overflow: visible; display: flex; flex-direction: column; gap: 12px; }
  .figure { margin: 0; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: #f8fafc; }
  .figure img { display: block; width: 100%; max-height: 41vh; object-fit: contain; background: white; }
  .figure figcaption { padding: 7px 10px; color: var(--muted); font-size: 12px; line-height: 1.3; }
  .head-text { display: flex; flex-direction: column; gap: 9px; min-width: 0; }
  .badges { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .badge { border-radius: 999px; padding: 5px 9px; background: #eef2ff; color: #3730a3; font-size: 12px; font-weight: 800; }
  .score { background: #fee2e2; color: #991b1b; }
  h1 { margin: 0; font-size: 25px; line-height: 1.15; letter-spacing: 0; overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
  h1 a { color: inherit; text-decoration-color: rgba(23, 107, 135, 0.35); text-decoration-thickness: 2px; text-underline-offset: 4px; }
  h1 a:hover { color: var(--accent); text-decoration-color: var(--accent); }
  .meta, .authors, .why, .abstract { font-size: 13px; line-height: 1.45; }
  .meta, .authors { color: var(--muted); }
  .why strong, .abstract strong, .authors strong { color: var(--ink); }
  .authors { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .why { border-left: 4px solid var(--accent-2); padding-left: 10px; color: #374151; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .abstract { border-top: 1px solid var(--line); padding-top: 14px; color: #374151; }
  .original-abstract { border-top: 1px solid var(--line); padding-top: 10px; color: #374151; font-size: 11.5px; line-height: 1.35; overflow-wrap: anywhere; }
  .original-abstract strong { display: block; margin-bottom: 4px; color: var(--ink); }
  .tags { display: flex; flex-wrap: wrap; gap: 8px; }
  .tag { border-radius: 999px; padding: 4px 8px; background: #f1f5f9; color: #475569; font-size: 12px; font-weight: 700; }
  .head-text > .link { display: none; }
  .briefing { min-width: 0; min-height: 0; overflow: visible; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); grid-auto-rows: minmax(0, auto); align-content: start; gap: 11px 18px; border-top: 0; padding-top: 0; }
  .brief-section { min-width: 0; }
  .brief-section.wide { grid-column: 1 / -1; }
  .brief-section h2 { margin: 0 0 4px; font-size: 14px; line-height: 1.22; color: #0f766e; letter-spacing: 0; }
  .brief-section p, .brief-section li { margin: 0; font-size: 12.5px; line-height: 1.42; color: #1f2937; overflow-wrap: anywhere; }
  .brief-section ul { margin: 0; padding-left: 20px; }
  .concepts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 9px 14px; }
  .concept { border-top: 1px solid var(--line); padding-top: 7px; }
  .concept h3 { margin: 0 0 4px; font-size: 13px; color: #7c2d12; letter-spacing: 0; }
  .concept p { margin: 2px 0 0; font-size: 11.5px; line-height: 1.35; color: #374151; overflow-wrap: anywhere; }
  .concept b { color: #111827; }
  .link { color: var(--accent); font-weight: 800; text-decoration: none; }
  .empty { padding: 48px; background: var(--paper); border: 1px solid var(--line); border-radius: 12px; color: var(--muted); }
  @media (max-width: 860px) {
    .shell { padding: 14px; }
    .topbar, .top-actions { align-items: stretch; flex-direction: column; }
    .slide, .briefing, .concepts { grid-template-columns: 1fr; }
    .slide { min-height: auto; overflow: visible; display: grid; }
    h1 { font-size: 28px; }
  }
</style>

ern 금속 상태와 연결됨."}, {"term": "루프 전류 (Loop Current)", "why_emerged": "TRSB를 설명하기 위해 카고메 격자 내의 전자들이 원자 주위를 도는 미세 전류의 흐름을 가정할 필요가 있었습니다.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "가성 상자기성(orbital magnetism), 하이젠베르크 모델, 초전도 질서 변수."}], "english_summary": ["Provides microscopic evidence for imaginary charge density waves in CsV3Sb5.", "Demonstrates spontaneous time-reversal symmetry breaking in the kagome lattice.", "Links electronic correlations to loop currents within the kagome framework.", "Advances the understanding of anomalous electronic states in AV3Sb5 compounds."]}}, {"title": "Observation of momentum dependent charge density wave gap in EuTe4", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/n72p-lpt6", "authors": "Iftakhar Bin Elius, Nathan Valadez, Gyanendra Dhakal, et al.", "last_authors": "Dariusz Kaczorowski, Madhab Neupane", "summary": "Author(s): Iftakhar Bin Elius, Nathan Valadez, Gyanendra Dhakal, Volodymyr Buturlim, Sabin Regmi, Dante James, Peter Radanovich, Keng Tou Chu, Ellis Thompson, Matthew Yankowitz, Tetiana Romanova, Andrzej Ptok, Krzysztof Gofryk, Dariusz Kaczorowski, and Madhab Neupane Charge density wave (CDW) phenomena in low-dimensional rare-earth chalcogenides have drawn considerable interest owing to their interplay with lattice instabilities, electronic correlations, and magnetism. ${\\mathrm{EuTe}}_{4}$, which contains both mono- and bilayer Te pseudosquare nets together wit… [Phys. Rev. B 113, 235125] Published Mon Jun 15, 2026", "tier": "B_IMPORTANT_CONDMAT", "score": "10", "reason": "Direct HIT: ARPES study of CDW gaps in a rare-earth chalcogenide system from a top group.; demoted from A: broad CM, not direct user/project hit", "tags": ["method", "material", "CDW"], "image": "", "briefing": {"background": "저차원 희토류 칼코게나이드 물질은 전자 상관관계, 격자 불안정성, 자기적 성질이 복잡하게 얽혀 있어 CDW 연구의 훌륭한 플랫폼을 제공합니다.", "motivation": "EuTe4 시스템 내의 Te 원자망에서 나타나는 CDW 현상의 운동량 의존적 전자 구조 변화를 ARPES를 통해 정밀하게 관측하고자 했습니다.", "result": "EuTe4의 전자 구조에서 발생하는 CDW 갭의 운동량 의존성을 성공적으로 시각화하였습니다.", "implication": "CDW 형성 과정에서 나타나는 페르미 표면의 재구성과 갭 개구 현상을 이해함으로써, 유사한 저차원 시스템의 전자 구조 분석에 모델을 제공합니다.", "novelty": "ARPES를 활용한 정밀한 운동량 공간 관측을 통해 Te 원자층 내의 전자적 기원을 밝혀냈으며, 이는 복합적인 전하/자기 상관계 물질 연구에 직접적인 통찰을 줍니다.", "unresolved": "관측된 CDW 갭이 페르미 표면의 특정 Nesting 조건에 의해서만 발생하는지, 아니면 더 강한 전자-격자 상호작용에 기인하는지는 여전히 분석이 필요합니다.", "future_work": "온도 변화에 따른 ARPES 데이터 분석을 통해 CDW 전이 온도 근처에서의 상전이 동역학 연구가 필요합니다.", "concepts": [{"term": "CDW 갭 (CDW gap)", "why_emerged": "CDW 상태가 형성될 때 페르미 준위 근처의 전자 상태 밀도가 감소하는 것을 설명하기 위한 에너지 창입니다.", "origin": "Peierls instability (1950s)", "connections": "페르미 표면 Nesting, 금속-절연체 전이."}, {"term": "희토류 칼코게나이드 (Rare-earth chalcogenide)", "why_emerged": "희토류 원소의 4f 전자와 칼코겐의 p 궤도가 결합하여 나타나는 독특한 자기적, 구조적 상호작용을 연구하기 위해 필요합니다.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "위상 절연체, 자기적 위상 물질."}], "english_summary": ["Reports momentum-resolved CDW gap observation in EuTe4 using ARPES.", "Analyzes the interplay between Te nets and electronic structure.", "Provides a clear picture of CDW-induced gap formation in rare-earth chalcogenides."]}}, {"title": "Visualizing the impact of quenched disorder on 2D electron Wigner solids", "journal": "Nature", "source": "Gemini", "link": "https://www.nature.com/articles/s41586-026-10654-w", "authors": "Zhehao Ge, Conor Smith, Zehao He, et al.", "last_authors": "Feng Wang, Michael F. Crommie", "summary": "Nature, Published online: 17 June 2026; doi:10.1038/s41586-026-10654-w A technique combining atomically resolved scanning tunnelling microscopy with neural-quantum-state quantum Monte Carlo simulation of disordered 2D electron Wigner solids establishes a powerful framework to enable the clear identification of two distinct defect-induced disorder regimes.", "tier": "B_IMPORTANT_CONDMAT", "score": "9", "reason": "Direct STM visualization of correlated 2D electronic structure and disorder effects.", "tags": ["STM", "Wignersolid", "2Delectronsystems", "disorder"], "image": "https://media.springernature.com/m685/springer-static/image/art%3A10.1038%2Fs41586-026-10654-w/MediaObjects/41586_2026_10654_Fig1_HTML.png", "briefing": {"background": "2차원 전자 시스템에서 전자들 간의 쿨롱 상호작용이 강해지면 결정 형태를 띄는 위그너 고체(Wigner solid)가 형성되는데, 실질적인 물질 내의 불순물(disorder)이 이를 어떻게 교란하는지는 기초 물리 분야의 난제였습니다.", "motivation": "STM을 사용하여 실제 2차원 시스템 내 위그너 고체의 결함 구조를 원자 단위로 시각화하고, 이를 이론적 모델과 비교하고자 했습니다.", "result": "STM 시각화와 신경망 기반 양자 몬테카를로 계산을 결합하여, 결함이 위그너 고체에 미치는 영향을 두 가지 유형의 disorder 정권으로 명확히 분류했습니다.", "implication": "강상관 전자계에서 무질서(disorder)가 전자 질서를 어떻게 파괴하거나 재편하는지에 대한 정량적이고 시각적인 표준 모델을 제시합니다.", "novelty": "실험과 최신 수치 해석 기법을 결합하여, 복잡한 다체 물리 현상인 위그너 고체의 공간적 결함을 매우 정밀하게 규명했습니다.", "unresolved": "외부 자기장의 강도 변화에 따른 위그너 고체의 위상학적 결함 동역학은 이 연구에서 충분히 다루어지지 않았습니다.", "future_work": "강한 자기장 하에서의 STM 관측을 통해 위그너 고체의 홀 상태 변화와 disorder 간의 상관관계를 탐구할 예정입니다.", "concepts": [{"term": "위그너 고체 (Wigner solid)", "why_emerged": "저밀도 전자 가스에서 전자 간 쿨롱 반발력이 운동 에너지보다 커질 때 전자가 결정 격자를 이루는 현상을 기술하기 위해 필요합니다.", "origin": "Eugene Wigner (1934)", "connections": "강상관 전자계, 2차원 전자 가스(2DEG)."}, {"term": "STM/STS", "why_emerged": "표면의 전자 상태 밀도를 원자 해상도로 측정하여 전자 구조를 직접 시각화하기 위해 필요합니다.", "origin": "Gerd Binnig, Heinrich Rohrer (1981)", "connections": "ARPES, 국소 상태 밀도(LDOS)."}], "english_summary": ["Visualizes disorder effects on 2D Wigner solids using atomic-resolution STM.", "Combines neural-network quantum Monte Carlo with experimental visualization.", "Identifies two distinct regimes of defect-induced disorder in correlated electrons."]}}, {"title": "Sommerfeld coefficient enhancement and magnetic short-range order in a hyperkagome 3d electron system", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/m5pw-ghz3", "authors": "Shin-ichi Shamoto, Yukio Yasui, Kanako Yoshizawa, et al.", "last_authors": "Min Kai Lee, Lieh-Jeng Chang", "summary": "Author(s): Shin-ichi Shamoto, Yukio Yasui, Kanako Yoshizawa, Yukio Noda, Miwako Takahashi, Yoshichika Ōnuki, Yoshinori Haga, Motoyuki Ishikado, Hiroki Yamauchi, Tsung-Cheng Huang, Min Kai Lee, and Lieh-Jeng Chang $β$-Mn shows a large Sommerfeld coefficient of 70 mJ ${\\mathrm{Mn}}^{−1}{\\mathrm{K}}^{−2}$, which is one of the largest values in $3d$-electron systems. Although the origin has been attributed to the fluctuating magnetic moment, there are no material-dependent systematic studies in the $3d$-electron… [Phys. Rev. B 113, 235126] Published Mon Jun 15, 2026", "tier": "B_IMPORTANT_CONDMAT", "score": "9", "reason": "Investigation of electronic order and magnetism in a kagome system, very close to core interests.", "tags": ["material", "kagome", "magnetism"], "image": "", "briefing": {"background": "금속 내 전자의 유효 질량과 상태 밀도를 나타내는 Sommerfeld 계수(비열 계수)는 강상관계 전자계에서 핵심적인 지표입니다. 3d 전자계에서 이 값이 비정상적으로 높으면 전자의 강한 상관관계나 자기적 요동(fluctuation)이 관여한다고 해석합니다.", "motivation": "3d 전자계인 하이퍼카고메 구조의 베타-망간(β-Mn)에서 관찰되는 거대한 Sommerfeld 계수의 기원을 물질 의존적인 체계적 연구를 통해 밝히고자 합니다.", "result": "베타-망간 계열 물질에서 자기적 단거리 질서(short-range order)와 전자 유효 질량의 상관관계를 확인하여, 하이퍼카고메 격자의 기하학적 좌절이 전자 상태에 미치는 영향을 규명했습니다.", "implication": "하이퍼카고메 구조에서의 전자적 비정상성과 자기적 요동 사이의 연결고리를 정립함으로써, 유사한 구조를 가진 카고메 금속들의 전자 구조 연구에 단서를 제공합니다.", "novelty": "카고메 메탈 및 강상관계 전자계 연구자들에게 하이퍼카고메 격자 내의 자기적 요동이 어떻게 비열 데이터를 통해 전자적 성질로 변환되는지를 보여주는 중요한 사례입니다.", "unresolved": "단거리 자기 질서의 정확한 기하학적 형태와 이것이 페르미 표면의 특정 포인트(밴드 구조)와 어떻게 구체적으로 결합하는지는 추가 연구가 필요합니다.", "future_work": "ARPES를 이용한 밴드 구조 분석을 통해, 비열에서 관찰된 상태 밀도 증가가 페르미 준위 근처의 밴드 밴딩(flat band)이나 van Hove 특이점과 관련이 있는지 확인할 필요가 있습니다.", "concepts": [{"term": "Sommerfeld 계수", "why_emerged": "금속의 비열이 온도에 비례할 때 그 비례 상수를 정의하여 전자 기체 모델에서의 상태 밀도를 측정하기 위해 도입됨.", "origin": "Arnold Sommerfeld, 1920년대 초.", "connections": "페르미 액체 이론, 전자 유효 질량, 강상관계 물질."}, {"term": "하이퍼카고메", "why_emerged": "코너를 공유하는 사면체 네트워크가 형성하는 3차원 기하학적 구조에서 나타나는 자기적 좌절 현상을 이해하기 위해 필요함.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "카고메 격자, 자기적 좌절, 양자 스핀 액체 후보군."}], "english_summary": ["The study investigates the large Sommerfeld coefficient in beta-Mn, a 3d-electron hyperkagome system.", "Authors correlate magnetic short-range order with the electronic specific heat enhancement.", "The results suggest that fluctuating magnetic moments in hyperkagome structures significantly influence electronic properties.", "This provides insights into the physics of geometric frustration in correlated metallic systems."]}}, {"title": "Observation of Switchable Chiral Magnons in an Altermagnet", "journal": "PRL_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/m8lc-f8gk", "authors": "Zheyuan Liu, Hodaka Kikuchi, Zijun Wei, et al.", "last_authors": "Igor A. Zaliznyak, Takatsugu Masuda", "summary": "Author(s): Zheyuan Liu, Hodaka Kikuchi, Zijun Wei, Shinichiro Asai, Mechthild Enderle, Ursula B. Hansen, Vasile O. Garlea, Manh D. Le, Gøran J. Nilsen, Igor A. Zaliznyak, and Takatsugu Masuda Polarized inelastic neutron scattering gives the first unambiguous evidence of chirality of the split magnon bands in altermagnetic MnTe. [Phys. Rev. Lett. 136, 236705] Published Fri Jun 12, 2026", "tier": "B_IMPORTANT_CONDMAT", "score": "9", "reason": "First observation of chiral magnons in an altermagnet using neutron scattering, a direct interest.", "tags": ["altermagnetism", "neutron_scattering", "magnetism", "magnon", "experiment"], "image": "", "briefing": {"background": "최근 차세대 스핀트로닉스 재료로 주목받는 '알터마그넷(Altermagnet)'은 강자성체와 반강자성체의 특성을 모두 가지며, 시간 반전 대칭성은 깨지되 격자 대칭성에 의해 스핀 분할 밴드가 나타나는 새로운 자기 상태입니다.", "motivation": "알터마그넷의 핵심적인 이론적 예측 중 하나인 스핀 분할 밴드에서의 '카이랄성(chirality)'을 실험적으로 직접 관측하고자 합니다.", "result": "편극 비탄성 중성자 산란(Polarized Inelastic Neutron Scattering) 실험을 통해 MnTe에서 스핀 분할된 마그논 밴드가 카이랄성을 가지고 있음을 명확하게 입증했습니다.", "implication": "알터마그네틱 물질이 단순한 자성체를 넘어 스핀 수송 및 제어(스핀류 생성 등)에 응용 가능한 실질적인 후보임을 실험적으로 뒷받침합니다.", "novelty": "이론적 제안에 머물던 알터마그넷의 미세한 자기적 구조(마그논의 카이랄성)를 직접 관측함으로써 이 분야의 실험적 기초를 크게 강화했습니다.", "unresolved": "이러한 카이랄 마그논이 실제 장치에서의 스핀-궤도 토크(SOT)나 다른 수송 현상에 구체적으로 어떤 효율성을 부여하는지는 아직 정량화가 필요합니다.", "future_work": "다양한 알터마그넷 후보 물질들에서의 일반적인 스핀 분할 구조 확인 및 이 물질을 이용한 저전력 스핀트로닉스 소자 구현 연구.", "concepts": [{"term": "알터마그넷", "why_emerged": "전통적인 자성체(강자성/반강자성) 분류로 설명되지 않는 대칭성에 기반한 스핀 분할 밴드를 설명하기 위해 도입됨.", "origin": "최근 수년 내 이론적으로 제안됨(예: J. Zelezny et al.).", "connections": "반강자성체, 스핀트로닉스, 베리 곡률, 스핀 분할 밴드."}, {"term": "카이랄 마그논", "why_emerged": "비대칭적인 자기 구조에서 마그논이 특정 방향성을 가지고 전파될 때 나타나는 물리적 특성을 이해하기 위해 필요함.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "자기적 위상학, 중성자 산란, 스핀류(spin current)."}], "english_summary": ["The paper reports the first experimental observation of chiral magnons in the altermagnet MnTe.", "Polarized inelastic neutron scattering is utilized to confirm the chirality of split magnon bands.", "This result validates key theoretical predictions regarding altermagnetic spin dynamics.", "The findings open new avenues for spintronic applications based on altermagnetic materials."]}}, {"title": "Room-Temperature Intrinsic Nonlinear Planar Hall Effect in TaIrTe4", "journal": "PRL_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/hbdj-2hgf", "authors": "Chang Jiang, Fan Yang, Yu Zhao, et al.", "last_authors": "Shaoming Dong, Faxian Xiu", "summary": "Author(s): Chang Jiang, Fan Yang, Yu Zhao, Jinshan Yang, Peng Yu, Huiying Liu, Yuda Zhang, Zehao Jia, Xiangyu Cao, Li Tian, Jingyi Yan, Zheng Liu, Zhongkai Liu, Xian-Lei Sheng, Cong Xiao, Shengyuan A. Yang, Shaoming Dong, and Faxian Xiu A room-temperature intrinsic nonlinear planar Hall effect in the nonmagnetic topological semimetal TaIrTe 4 reveals how an in-plane magnetic field generates a Berry-connection-polarizability dipole through an orbital mechanism. [Phys. Rev. Lett. 136, 236302] Published Fri Jun 12, 2026", "tier": "B_IMPORTANT_CONDMAT", "score": "9", "reason": "Topological semimetal with nonlinear Hall effect, relevant to Berry curvature and exotic transport.", "tags": ["topological_semimetal", "Halleffect", "transport", "Berry_curvature", "experiment"], "image": "", "briefing": {"background": "위상 반금속(Topological Semimetal)은 에너지 밴드가 교차하는 위상적 특이점을 가지며, 비자성 물질에서도 베리 곡률에 의한 독특한 수송 현상이 나타날 수 있어 차세대 전자 재료로 주목받습니다.", "motivation": "TaIrTe4와 같은 비자성 위상 반금속에서 외부 자기장에 의해 유도되는 비선형 홀 효과(Nonlinear Hall Effect)의 기원을 명확히 규명하고자 합니다.", "result": "TaIrTe4에서 상온 비선형 평면 홀 효과를 관측했으며, 이것이 궤도 기제에 의한 베리 접속 편극화 쌍극자(Berry-connection-polarizability dipole)에 기인함을 밝혔습니다.", "implication": "위상 반금속에서 베리 곡률 기반의 비선형 수송 현상이 상온에서 제어 가능하다는 점을 확인하여 소자 응용 가능성을 입증했습니다.", "novelty": "비선형 홀 효과의 미시적 물리 기전을 명확히 규명하고, 상온 실험을 통해 응용 잠재력을 크게 높였습니다.", "unresolved": "이 효과의 크기가 물질의 위상적 결함(domain wall 등)이나 시료의 결정성에 따라 얼마나 민감하게 변화하는지에 대한 연구가 추가로 필요합니다.", "future_work": "다른 유형의 112 텔루라이드 물질이나 위상 반금속으로 연구 범위를 넓혀 베리 곡률 기반 소자의 최적화 연구가 이어질 것입니다.", "concepts": [{"term": "비선형 홀 효과", "why_emerged": "선형 홀 효과가 사라지는 비자성체 등에서 베리 곡률의 쌍극자 모멘트가 유도하는 비선형적 전압 생성을 설명하기 위해 필요함.", "origin": "최근 5년 내 이론/실험 확립.", "connections": "베리 곡률, 위상 반금속, 상호반전 대칭성."}, {"term": "베리 접속 편극화 쌍극자", "why_emerged": "비선형 홀 효과를 발생시키는 물리적 원인(Berry curvature dipole의 확장 개념)을 기술하기 위해 도입됨.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "비선형 응답 이론, 밴드 구조 기하학."}], "english_summary": ["This study demonstrates a room-temperature intrinsic nonlinear planar Hall effect in the nonmagnetic semimetal TaIrTe4.", "The effect is attributed to an orbital-mechanism-driven Berry-connection-polarizability dipole.", "This provides a concrete demonstration of topological transport properties in nonmagnetic materials at ambient conditions.", "The results highlight the potential for Berry-curvature-based electronic devices."]}}, {"title": "General ab initio framework for electronic-order–induced lattice-dynamics symmetry breaking", "journal": "Science_Advances", "source": "Gemini", "link": "https://doi.org/10.1126/sciadv.aed7081", "authors": "Shuai Zhang, Mengqi Wang, Pan Zhang, Tiantian Zhang", "last_authors": "Pan Zhang, Tiantian Zhang", "summary": "Conventional ab initio approaches are unable to describe phonon time-reversal symmetry ( T ) breaking. Here, we develop an ab initio framework, grounded in molecular Berry c and lattice collective excitations in the two-dimensional van der Waals antiferromagnet FePS3", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/fwb8-fwjb", "authors": "Kartik Panda, Itzik Kapon, Dumitru Dumcenco, Dirk van der Marel, Alexey B. Kuzmenko, Nimrod Bachar", "last_authors": "Alexey B. Kuzmenko, Nimrod Bachar", "summary": "Author(s): Kartik Panda, Itzik Kapon, Dumitru Dumcenco, Dirk van der Marel, Alexey B. Kuzmenko, and Nimrod Bachar We combine polarized infrared magnetotransmission and Faraday angle rotation measurements to map the collective excitations of the van der Waals antiferromagnet ${\\mathrm{FePS}}_{3}$. Below the Néel temperature (${T}_{\\mathrm{N}}≈118\\phantom{\\rule{4pt}{0ex}}\\mathrm{K}$), the phonon spectrum becomes … [Phys. Rev. B 113, 235124] Published Mon Jun 15, 2026", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Optical spectroscopy study of a vdW antiferromagnet, highly relevant to quantum materials interests.", "tags": ["material", "vanderWaals", "spectroscopy"], "image": "", "briefing": {"background": "반데르발스(vdW) 자성체는 층상 구조 덕분에 엑솔리션(exfoliation)이 용이하고 격자와 스핀의 자유도가 강하게 결합되어 있어, 양자 물성 연구의 핵심 플랫폼으로 주목받고 있습니다.", "motivation": "FePS3는 2D 반강자성체로서, Néel 온도 이하에서 나타나는 스핀-격자 결합의 구체적인 메커니즘과 그에 따른 집단 여기(collective excitation)의 진화를 명확히 규명하고자 합니다.", "result": "편광 적외선 자기 투과 및 패러데이 회전 측정을 통해, Néel 온도 이하에서 포논 스펙트럼이 자기 질서와 어떻게 결합하는지 매핑했습니다.", "implication": "자기적 질서가 격자 진동에 직접적인 영향을 미침을 입증하며, vdW 자성체의 스핀-포논 상호작용을 제어할 수 있는 가능성을 제시합니다.", "novelty": "광학 분광법을 사용하여 2D 반강자성체의 미세한 스핀-격자 여기 결합을 관찰했으며, 이는 비탄성 중성자 산란과 상호 보완적인 정보를 제공합니다.", "unresolved": "자기 여기와 포논 여기 간의 구체적인 에너지 전이 메커니즘과 비조화성(anharmonicity)의 영향은 추가 규명이 필요합니다.", "future_work": "외부 변형률(strain)이나 게이트 전압을 이용한 자성-격자 결합의 Floquet 또는 동적 조절 가능성에 대한 연구가 기대됩니다.", "concepts": [{"term": "반데르발스 반강자성체", "why_emerged": "2D 극한 환경에서 스핀 정렬과 위상적 물성을 구현하기 위해 필요.", "origin": "2010년대 중반 CrI3 등 2D 자성체 발견 이후 본격화.", "connections": "Ising 모델, 2D 자성, 스핀트로닉스."}, {"term": " 022년).", "connections": "반강자성, 스핀트로닉스, 자기 대칭성."}, {"term": "d-벡터(d-vector)", "why_emerged": "스핀-삼중항 초전도체의 스핀 구조를 수학적으로 표현하기 위해 도입됨.", "origin": "Balian and Werthamer (1963년, He-3 관련 연구에서 제안).", "connections": "스핀-삼중항 초전도체, 미러 대칭성, 위상 초전도."}], "english_summary": ["The study investigates Josephson effects in spin-triplet superconductor/altermagnet junctions.", "Green's function methods reveal a strong dependence of current-phase relations on the d-vector orientation.", "This suggests that Josephson currents can serve as a diagnostic tool for altermagnetic properties.", "The findings offer new insights into spin-triplet superconductivity and altermagnet hybrid structures."]}}, {"title": "Quantum spin liquid ground state with the evidence of roton-like excitations at elevated temperatures in the triangular-lattice delafossite YbCuSe2", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/3ft3-72ll", "authors": "K. Bhattacharya, Y. Tokiwa, M. Majumder", "last_authors": "Y. Tokiwa, M. Majumder", "summary": "Author(s): K. Bhattacharya, Y. Tokiwa, and M. Majumder Theory predicts that frustrated triangular-lattice antiferromagnets host roton-like excitations (RLEs) between two characteristic temperature scales. While signatures of RLEs have been observed in a few systems with magnetically ordered ground states, they have been unobserved in a system that has a quantum spin liquid (QSL) ground state. Here, using heat capacity and muon spin relaxation measurements on single-crystalline YbCuSe 2 , the authors demonstrate the presence of RLEs prior to the QSL ground state. [Phys. Rev. B 113, L220407] Published Wed Jun 17, 2026", "tier": "B_IMPORTANT_CONDMAT", "score": "7", "reason": "Experimental investigation of a triangular-lattice QSL candidate; relevant for frustrated magnetism.", "tags": ["experiment", "material", "spinliquid"], "image": "", "briefing": {"background": "삼각 격자(triangular lattice) 구조의 기하학적 좌절(geometrical frustration)은 스핀 액체(QSL) 상태를 유도하는 핵심 요소로, 고체 물리학에서 매우 중요한 연구 주제입니다.", "motivation": "이론적으로는 로톤 유사 여기(roton-like excitations, RLEs)가 특정 온도 범위에서 존재할 것으로 예측되었으나, 실제 양자 스핀 액체 바닥 상태를 가진 물질에서 이를 관측한 사례는 드물었습니다.", "result": "열용량 및 뮤온 스핀 완화(muon spin relaxation) 측정을 통해 YbCuSe2 물질에서 QSL 상태에 도달하기 전 온도 구간에서 RLE의 존재를 실험적으로 증명했습니다.", "implication": "QSL 후보 물질 내에서의 RLE 존재 확인은 좌절된 자기계의 여기 스펙트럼과 QSL 바닥 상태 사이의 물리적 연결 고리를 제공합니다.", "novelty": "기존에 자기 정렬 바닥 상태를 가진 물질에서만 보고되던 RLE를 순수한 QSL 후보 물질에서 찾아낸 첫 사례라는 점에서 의미가 큽니다.", "unresolved": "RLE가 QSL 바닥 상태로 전이되는 과정에서의 구체적인 물리적 메커니즘은 여전히 명확하지 않습니다.", "future_work": "중성자 산란 실험 등을 통해 RLE의 운동량 의존적 분산 관계를 직접 측정하고 QSL의 본질을 더 깊이 이해하는 연구가 필요합니다.", "concepts": [{"term": "로톤 유사 여기 (Roton-like excitations)", "why_emerged": "초유체 헬륨-4의 분산 관계에서 나타나는 에너지 극소점을 설명하기 위해 도입되었습니다.", "origin": "Landau(1947)가 초유체 이론에서 처음 제안하였습니다.", "connections": "좌절된 자성체 및 스핀 액체에서의 들뜬 상태 연구와 밀접하게 연관됩니다."}, {"term": "양자 스핀 액체 (Quantum Spin Liquid)", "why_emerged": "강한 자기적 좌절로 인해 절대영도에서도 스핀이 정렬되지 않고 양자 얽힘을 유지하는 상태를 설명하기 위해 제안되었습니다.", "origin": "Anderson(1973)의 공명 원자가 결합 상태(RVB) 아이디어에서 유래되었습니다.", "connections": "고온 초전도체, 위상 물질, 양자 컴퓨팅 소자 연구와 연결됩니다."}, {"term": "델라포사이트 (Delafossite)", "why_emerged": "삼각 격자 층 구조를 가진 산화물/셀렌화물 계열로, 높은 전기 전도도와 자기적 특성을 연구하기 위해 중요합니다.", "origin": "광물학적 발견 이후 고체 물리 연구 분야에서 층상 물질의 전형으로 자리 잡았습니다.", "connections": "PdCoO2, PtCoO2와 같은 전도성 물질부터 자기적 연구 대상인 YbCuSe2에 이르기까지 다양합니다."}], "english_summary": ["YbCuSe2 is identified as a quantum spin liquid candidate with a triangular lattice structure.", "Roton-like excitations (RLEs) are observed prior to the ground state transition.", "Experimental evidence is provided via heat capacity and muon spin relaxation measurements.", "This finding bridges the gap between frustrated magnetic theories and QSL physics."]}}, {"title": "Skyrmion-resolved topology in chiral topological superconductors", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/3k9g-1gkh", "authors": "Bo-Wen Liu, Yu-Chen Zhuang, Peng-Yi Liu, Yu-Hao Wan, Qing-Feng Sun", "last_authors": "Yu-Hao Wan, Qing-Feng Sun", "summary": "Author(s): Bo-Wen Liu, Yu-Chen Zhuang, Peng-Yi Liu, Yu-Hao Wan, and Qing-Feng Sun Chiral topological superconductors (TSCs) are conventionally characterized by the bulk Chern number, which dictates the number of chiral Majorana modes at the boundary. However, this single invariant often obscures the rich momentum-space structure of the superconducting gap. In this work, we unveil… [Phys. Rev. B 113, 235426] Published Thu Jun 18, 2026", "tier": "B_IMPORTANT_CONDMAT", "score": "7", "reason": "Connects momentum-space superconducting gap structure to Majorana modes in chiral TSCs.", "tags": ["theory", "topologicalsuperconductor", "Majorana"], "image": "", "briefing": {"background": "위상 초전도체(TSC)는 경계에서 위상적으로 보호되는 마요라나 모드(Majorana modes)를 가져 양자 정보 소자로 주목받고 있습니다.", "motivation": "기존의 벌크 첸 수(Chern number)만으로는 위상 초전도체의 운동량 공간에 존재하는 복잡한 에너지 갭 구조를 완벽히 이해하기 어렵다는 한계가 있었습니다.", "result": "운동량 공간에서의 갭 구조를 스카이르미온(Skyrmion) 위상학적 관점에서 재해석하여, 기존의 첸 수보다 상세한 위상적 특성을 기술하는 방법을 제시했습니다.", "implication": "초전도체 갭의 위상적 성질을 상세하게 분해함으로써 마요라나 모드의 생성과 조절을 더 정밀하게 제어할 가능성을 열었습니다.", "novelty": "단순한 위상 불변량을 넘어 스카이르미온이라는 공간 구조를 이용해 운동량 공간의 위상 정보를 해상도 높게 해석했다는 점이 독창적입니다.", "unresolved": "이러한 위상적 해석이 실제 복잡한 다중 밴드 초전도 물질에서 어떻게 구체적으로 구현되는지는 추가 검증이 필요합니다.", "future_work": "이 이론을 바탕으로 특정 chiral TSC 물질의 ARPES나 STS 데이터를 재해석하여 마요라나 모드 분포와의 직접적인 연관성을 찾을 것입니다.", "concepts": [{"term": "스카이르미온 (Skyrmion)", "why_emerged": "비선형 시그마 모델에서 입자성 위상 결함으로 제안되었으며, 이후 자기 구조에서 중요한 위상체로 발견되었습니다.", "origin": "Skyrme(1962)가 핵자 모델로 제안하였고, 응집물질에서는 스핀 구조로 널리 알려졌습니다.", "connections": "위상 절연체, 비자명한 홀 효과, 위상 초전도체 연구와 연결됩니다."}, {"term": "마요라나 모드 (Majorana mode)", "why_emerged": "입자와 반입자가 동일한 페르미온 입자로, 비아벨 통계 특성을 이용한 결함 허용 양자 컴퓨팅을 위해 필요합니다.", "origin": "Majorana(1937)가 이론적으로 제안하였고, TSC 경계 상태로 탐색 중입니다.", "connections": "Kitaev 체인, topological superconductors, 양자 정보 저장."}, {"term": "첸 수 (Chern number)", "why_emerged": "에너지 밴드 구조의 위상적 불변량을 정량화하여 홀 전도도 등을 기술하기 위해 도입되었습니다.", "origin": "Thouless et al.(1982)의 TKNN 공식에서 확립되었습니다.", "connections": "양자 홀 효과, 위상 절연체, 벌크-경계 대응 관계."}], "english_summary": ["The paper introduces a Skyrmion-based resolution to characterize topological superconductors.", "It goes beyond the standard Chern number to map the momentum-space superconducting gap structure.", "The approach enables a more precise understanding of chiral Majorana modes at boundaries.", "This provides a framework for advanced topological engineering in superconducting systems."]}}, {"title": "Spin chirality driven tunability and multifunctionality in two-dimensional noncollinear antiferromagnets", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/x52d-htvb", "authors": "Ting Lai, Yongqian Zhu, Jie Zhang, et al.", "last_authors": "Jinbo Pan, Shixuan Du", "summary": "Author(s): Ting Lai, Yongqian Zhu, Jie Zhang, Yuhui Li, Guolin Wan, Xudan Zhang, Jia-Tao Sun, Jinbo Pan, and Shixuan Du Noncollinear antiferromagnets (NCAFs) offer an ideal platform for high-performance spintronic devices. Weak spin-orbit coupling (SOC) magnets, though abundant and important, are overlooked. We propose a symmetry framework for two-dimensional triangular antiferromagnets with ${120}^{∘}$ spin configur… [Phys. Rev. B 113, 214434] Published Fri Jun 12, 2026", "tier": "B_IMPORTANT_CONDMAT", "score": "7", "reason": "Study of noncollinear antiferromagnets, overlaps with interest in magnetic materials.", "tags": ["antiferromagnet", "spintronics"], "image": "", "briefing": {"background": "비공선형 반강자성체(NCAF)는 스핀의 배열이 복잡하여 기존의 강자성체나 일반적인 반강자성체와는 다른 특이한 자기적 특성을 보여줍니다.", "motivation": "스핀-궤도 결합(SOC)이 약한 물질은 연구가 부족했지만, 실용적인 스핀트로닉스 소자 구현을 위해 대칭성 기반의 새로운 제어 프레임워크가 필요했습니다.", "result": "삼각 격자 120도 스핀 구조를 가진 2차원 반강자성체에 대한 새로운 대칭성 프레임워크를 제안하고, 스핀 카이랄성(spin chirality)을 통한 물성 조절 가능성을 보였습니다.", "implication": "SOC가 약한 물질에서도 비공선형 구조를 통해 거대 홀 효과 등 스핀트로닉스 응용이 가능한 고성능 소자 설계의 발판이 됩니다.", "novelty": "기존에 간과되었던 약한 SOC 반강자성체를 타겟으로, 대칭성 분석을 통해 다기능성 소자 설계의 논리를 정립한 점이 중요합니다.", "unresolved": "제안된 대칭성 기반 조절법이 실험적으로 실제 소자 제작 환경에서 얼마나 견고하게 작동할지는 검증이 필요합니다.", "future_work": "제안된 비공선형 NCAFs의 전도성 및 홀 효과에 대한 수송 현상 실험과 스핀 구조 제어 실험을 수행할 것입니다.", "concepts": [{"term": "스핀 카이랄성 (Spin chirality)", "why_emerged": "비공선형 스핀 구조에서 스핀들 사이의 '휘어짐' 정도를 나타내어 위상적인 자기 특성을 기술하기 위해 필요합니다.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "위상 홀 효과, 스핀-궤도 토크, 비공선형 자기 정렬."}, {"term": "비공선형 반강자성체 (Noncollinear Antiferromagnets)", "why_emerged": "스핀이 180도 반대 방향이 아닌 120도 등 복합적인 각도로 정렬되는 시스템의 독특한 수송 현상을 연구하기 위해 중요합니다.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "Mn3Sn, kagome 격자 물질, 앨터마그네틱(altermagnetism) 분야."}, {"term": "스핀-궤도 결합 (Spin-orbit coupling)", "why_emerged": "전자의 스핀과 궤도 운동을 연결하여 자기 현상이 전기적으로 제어될 수 있게 하는 근본 물리량입니다.", "origin": "상대론적 양자역학의 Dirac 방정식에서 자연스럽게 유도되었습니다.", "connections": "위상 절연체, 스핀 홀 효과, Rashba 효과."}], "english_summary": ["Explores the potential of noncollinear antiferromagnets (NCAFs) for spintronics.", "Develops a symmetry framework for 2D triangular antiferromagnets with 120-degree spin order.", "Highlights spin chirality as a tool for tunability, even in weak SOC materials.", "Suggests new multifunctional possibilities for spintronic device architectures."]}}, {"title": "Topologically nontrivial flat bands and quantum Hall crossovers in square-octagon lattice materials", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/qqbv-8brl", "authors": "Amrita Mukherjee, Rahul Verma, Pritesh Srivastava, Bahadur Singh", "last_authors": "Pritesh Srivastava, Bahadur Singh", "summary": "Author(s): Amrita Mukherjee, Rahul Verma, Pritesh Srivastava, and Bahadur Singh Coexistence of nontrivial topology and flat electronic bands provides a fertile platform for correlated quantum states. The square-octagon lattice hosts Dirac nodes and flat bands at half-filling, yet the effects of intrinsic spin-orbit coupling (SOC) and staggered magnetic flux on its electronic an… [Phys. Rev. B 113, 235420] Published Mon Jun 15, 2026", "tier": "B_IMPORTANT_CONDMAT", "score": "7", "reason": "Topological flat bands and quantum Hall physics are highly relevant topics.", "tags": ["topological", "flatband", "quantumHall"], "image": "", "briefing": {"background": "위상적으로 비자명한 밴드 구조와 평탄한 밴드(flat band)가 공존하는 시스템은 강한 전자 상관관계에 의해 유도되는 새로운 양자 상태를 연구하는 핵심 플랫폼입니다.", "motivation": "정사각형-팔각형(square-octagon) 격자 구조에서 나타나는 디랙 노드와 평탄한 밴드가 스핀-궤도 결합(SOC)과 자기 선속(magnetic flux) 하에서 어떤 위상적 특성을 보이는지 규명하고자 함.", "result": "정사각형-팔각형 격자에서 SOC와 자기 선속을 도입했을 때 나타나는 위상적으로 비자명한 평탄 밴드의 특성을 해석하고, 이로 인한 양자 홀 전이 현상을 확인.", "implication": "이러한 격자 구조가 분수 양자 홀 상태나 강한 상관관계에 기반한 위상적 물성을 실현할 수 있는 후보 물질군이 될 수 있음을 시사.", "novelty": "기존의 허니컴 격자 외에 복잡한 격자 구조에서의 위상적 상태 연구를 확장하였으며, 평탄한 밴드에서의 위상 물성 제어 가능성을 제시함.", "unresolved": "실제 합성 가능한 물질에서의 구현 가능성과 외부 섭동에 대한 위상적 상태의 안정성 문제는 여전히 과제로 남아 있음.", "future_work": "실제 해당 격자 구조를 가지는 화합물을 타겟팅한 밀도범함수 이론(DFT) 계산 및 위상적 상태를 검증하기 위한 저온 수송 측정 실험이 필요함.", "concepts": [{"term": "Flat Band", "why_emerged": "밴드 폭이 매우 좁아 전자 간 상호작용이 지배적인 영역을 기술하기 위해 도입됨.", "origin": "특정 기하학적 격자(예: Lieb lattice)에서 이론적으로 예견됨.", "connections": "강상관 전자계, 분수 양자 홀 효과, 모아레 격자 시스템."}, {"term": "Square-Octagon Lattice", "why_emerged": "이차원 탄소 구조나 전이금속 칼코겐 화합물에서 독특한 전자적 분산을 설계하기 위한 모델로 사용됨.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "아르키메데스 격자, 위상 절연체."}], "english_summary": ["Investigated topological flat bands in square-octagon lattice structures.", "Analyzed the effects of intrinsic SOC and staggered magnetic flux on electronic states.", "Identified quantum Hall crossovers mediated by nontrivial band topology.", "Suggests this lattice as a candidate for studying correlated topological phases."]}}, {"title": "Crystal-Field-Tuned Spin-Flip Luminescence in NiPS3", "journal": "PRL_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/7y26-3skd", "authors": "Léonard Schué, Nashra Pistawala, Hebatalla Elnaggar, et al.", "last_authors": "Luminita Harnagea, Abhay Shukla", "summary": "Author(s): Léonard Schu rystal-field environment on magnetic transitions.", "Highlights optical spectroscopy as a tool for studying 2D magnetism."]}}, {"title": "Electrical Switching of Strain Gradients and 90° Domain Walls via Hidden Polar-Acoustic Coupling in PbTiO3", "journal": "PRL_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/yhk9-qf8c", "authors": "Yajun Zhang, Konstantin Shapovalov, Xu He, et al.", "last_authors": "Kun Zhou, Philippe Ghosez", "summary": "Author(s): Yajun Zhang, Konstantin Shapovalov, Xu He, Chang Liu, Huadong Yong, Xingyi Zhang, Jie Wang, Kun Zhou, and Philippe Ghosez Although strain gradients hold great promise for tailoring emergent functionalities, their flexible global control remains a fundamental challenge. Here, we address this concern in ${\\mathrm{PbTiO}}_{3}$ under biaxial tensile strain by uncovering the spontaneous appearance of strain gradients and 90… [Phys. Rev. Lett. 136, 236101] Published Tue Jun 09, 2026", "tier": "B_IMPORTANT_CONDMAT", "score": "7", "reason": "Experimental condensed matter study of strain and domain walls in a functional material.", "tags": ["ferroelectrics", "materialsscience", "strainengineering"], "image": "", "briefing": {"background": "강유전체(ferroelectrics)에서의 도메인 벽(domain wall) 제어는 차세대 비휘발성 메모리 및 나노 소자 구현의 핵심 요소입니다.", "motivation": "PbTiO3 물질에서 변형 기울기(strain gradient)와 90도 도메인 벽 사이의 숨겨진 결합을 찾아내어 전기적 제어를 수행하고자 함.", "result": "PbTiO3 박막의 이축 인장 변형 하에서 자발적인 변형 기울기가 형성되며, 이를 전기적으로 스위칭할 수 있음을 규명함.", "implication": "강유전체 도메인 벽을 활용한 새로운 전기적 소자 설계 및 변형 공학의 실현 가능성을 입증함.", "novelty": "단순한 결정 구조의 변화를 넘어 변형 기울기라는 자유도를 능동적으로 제어할 수 있는 메커니즘을 밝혀냄.", "unresolved": "변형 기울기 스위칭의 응답 속도 및 장기적 안정성, 대면적 소자로의 확장성 검증 필요.", "future_work": "다양한 두께와 변형 조건에서의 도메인 동역학 관찰, 굴절률 변화를 활용한 광소자 응용 연구.", "concepts": [{"term": "Strain Gradient", "why_emerged": "재료 내 불균일한 변형 분포를 이용하여 분극이나 위상적 구조를 유도하기 위해 사용됨.", "origin": "연속체 역학에서 유래.", "connections": "굴곡전기 효과(flexoelectricity), 강유전체 도메인 구조."}, {"term": "PbTiO3", "why_emerged": "대표적인 페로브스카이트
