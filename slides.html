<title>Daily Paper Slideshow</title>
<style>
  :root {
    color-scheme: light;
    --bg: #f6f7f4;
    --paper: #ffffff;
    --ink: #111827;
    --muted: #64748b;
    --line: #d8ddd2;
    --accent: #176b87;
    --accent-2: #9a3412;
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; overflow: auto; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: var(--bg); color: var(--ink); }
  .shell { max-width: 1500px; min-height: 100vh; margin: 0 auto; padding: 14px 18px; display: flex; flex-direction: column; }
  .topbar { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 16px; }
  .top-actions { display: flex; align-items: center; gap: 10px; }
  .topbar a, button { border: 1px solid var(--line); border-radius: 8px; background: var(--paper); color: var(--ink); padding: 10px 14px; font-weight: 700; text-decoration: none; cursor: pointer; }
  button.primary { background: var(--accent); border-color: var(--accent); color: white; }
  button:disabled { opacity: 0.45; cursor: not-allowed; }
  .counter { color: var(--muted); font-weight: 700; }
  .slide { min-height: calc(100vh - 82px); background: var(--paper); border: 1px solid var(--line); border-radius: 10px; padding: 18px; box-shadow: 0 18px 42px rgba(15, 23, 42, 0.10); display: grid; grid-template-columns: minmax(310px, 0.86fr) minmax(0, 1.55fr); gap: 18px; overflow: visible; }
  .paper-head { min-width: 0; min-height: 0; overflow: visible; display: flex; flex-direction: column; gap: 12px; }
  .figure { margin: 0; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: #f8fafc; }
  .figure img { display: block; width: 100%; max-height: 41vh; object-fit: contain; background: white; }
  .figure figcaption { padding: 7px 10px; color: var(--muted); font-size: 12px; line-height: 1.3; }
  .head-text { display: flex; flex-direction: column; gap: 9px; min-width: 0; }
  .badges { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .badge { border-radius: 999px; padding: 5px 9px; background: #eef2ff; color: #3730a3; font-size: 12px; font-weight: 800; }
  .score { background: #fee2e2; color: #991b1b; }
  h1 { margin: 0; font-size: 25px; line-height: 1.15; letter-spacing: 0; overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
  h1 a { color: inherit; text-decoration-color: rgba(23, 107, 135, 0.35); text-decoration-thickness: 2px; text-underline-offset: 4px; }
  h1 a:hover { color: var(--accent); text-decoration-color: var(--accent); }
  .meta, .authors, .why, .abstract { font-size: 13px; line-height: 1.45; }
  .meta, .authors { color: var(--muted); }
  .why strong, .abstract strong, .authors strong { color: var(--ink); }
  .authors { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .why { border-left: 4px solid var(--accent-2); padding-left: 10px; color: #374151; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .abstract { border-top: 1px solid var(--line); padding-top: 14px; color: #374151; }
  .original-abstract { border-top: 1px solid var(--line); padding-top: 10px; color: #374151; font-size: 11.5px; line-height: 1.35; overflow-wrap: anywhere; }
  .original-abstract strong { display: block; margin-bottom: 4px; color: var(--ink); }
  .tags { display: flex; flex-wrap: wrap; gap: 8px; }
  .tag { border-radius: 999px; padding: 4px 8px; background: #f1f5f9; color: #475569; font-size: 12px; font-weight: 700; }
  .head-text > .link { display: none; }
  .briefing { min-width: 0; min-height: 0; overflow: visible; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); grid-auto-rows: minmax(0, auto); align-content: start; gap: 11px 18px; border-top: 0; padding-top: 0; }
  .brief-section { min-width: 0; }
  .brief-section.wide { grid-column: 1 / -1; }
  .brief-section h2 { margin: 0 0 4px; font-size: 14px; line-height: 1.22; color: #0f766e; letter-spacing: 0; }
  .brief-section p, .brief-section li { margin: 0; font-size: 12.5px; line-height: 1.42; color: #1f2937; overflow-wrap: anywhere; }
  .brief-section ul { margin: 0; padding-left: 20px; }
  .concepts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 9px 14px; }
  .concept { border-top: 1px solid var(--line); padding-top: 7px; }
  .concept h3 { margin: 0 0 4px; font-size: 13px; color: #7c2d12; letter-spacing: 0; }
  .concept p { margin: 2px 0 0; font-size: 11.5px; line-height: 1.35; color: #374151; overflow-wrap: anywhere; }
  .concept b { color: #111827; }
  .link { color: var(--accent); font-weight: 800; text-decoration: none; }
  .empty { padding: 48px; background: var(--paper); border: 1px solid var(--line); border-radius: 12px; color: var(--muted); }
  @media (max-width: 860px) {
    .shell { padding: 14px; }
    .topbar, .top-actions { align-items: stretch; flex-direction: column; }
    .slide, .briefing, .concepts { grid-template-columns: 1fr; }
    .slide { min-height: auto; overflow: visible; display: grid; }
    h1 { font-size: 28px; }
  }
</style>

FT) and Wannier function analysis. From density functional perturbation theory (DFPT) calculations, we have found that FeSb 2 remains dynamically stable up to 10 GPa, evidenced by positive phonon frequencies. Our spin-polarized band structure reveals that the crossing nodes between the spin-up and spin-down bands near the Fermi energy occur precisely at the Γ and Z high-symmetry points. The Fermi crossing is mostly exhibited by band-24, band-25, and band-26. The nonrelativistic spin-splitting (NRSS) along M ′ - Γ -M and A-Z- A ′ high symmetry paths is attributed to the symmetry operation [ C 2 | | C 2 y t ] and broken time-reversal symmetry ( T ). Significant changes in the band structure are observed under applied pressure, as evidenced by the shift of the crossing node between bands 24 and 26 toward higher energies. The NRSS exhibited by band-24 along M ′ − Γ -M symmetry is notably small. Although the strength of NRSS associated with band-26 along the A-Z- A ′ path is substantial, it decreases under applied pressure. We have calculated and presented the anomalous Hall conductivity (AHC) over the energy range from − 1.5 to 1.5 eV. The pronounced positive AHC peak at ambient pressure becomes spectrally broadened, and changes sign at 10 GPa as a result of pressure-induced modifications to the band structure and the associated redistribution of Berry curvature near the Fermi level. Furthermore, we quantify the orbital magnetization within the modern theory framework, which reaches a magnitude of 0.29 μ B at zero pressure. Our results identify FeSb 2 as a tunable altermagnetic candidate, where applied pressure can modulate both topological transport and dynamical stability, opening new avenues for strain-engineered Hall responses in compensated magnetic systems.", "tier": "A_MUST_READ", "score": "9", "reason": "First-principles study of altermagnetism and anomalous Hall effect in a real material.", "tags": ["altermagnetism", "anomalousHall", "DFT", "FeSb2", "electronic ough quasiparticle dynamics have been investigated extensively, the behavior of collective magnetic excitations remains comparatively unexplored. Here, we use time-resolved resonant inelastic X-ray scattering (trRIXS) at the Cu $L_3$-edge to track the collective magnetic excitations (paramagnons) in an optimally electron-doped cuprate driven out-of-equilibrium by a femtosecond pump laser pulse. Upon pumping, we observed an anti-Stokes signal associated with paramagnon generation, which modifies the paramagnon dispersion near the zone center, although the bandwidth remained unchanged. Moreover, the spectral weight exhibits a momentum-dependent variation across the Brillouin zone. The light-driven boost of the paramagnon population and the resulting spectral-weight transfer could provide new leverage to manipulate the properties of cuprates.", "tier": "A_MUST_READ", "score": "9", "reason": "author whitelist: Zhi-Xun Shen", "tags": ["RIXS", "cuprate", "superconduct", "correlated", "magnon"], "image": "https://arxiv.org/static/browse/0.3.4/images/arxiv-logo-fb.png", "briefing": {"background": "구리 산화물 초전도체(cuprates)는 강한 전자 상관관계로 인해 발생하는 고온 초전도 현상의 근본 원인을 이해하기 위한 핵심 물질군입니다. 특히 평형 상태에서 벗어난 비평형 상태의 동역학을 탐구하는 것은 초전도 매커니즘을 밝히는 중요한 접근법입니다.", "motivation": "초전도체의 준입자(quasiparticle) 동역학은 많이 연구되었으나, 초전도 페어링과 밀접하게 연관된 집단 자기 들뜸인 파라마그논(paramagnons)이 빛에 의해 어떻게 제어될 수 있는지에 대한 연구는 부족한 실정입니다.", "result": "trRIXS를 이용해 전자 도핑된 구리 산화물을 관측한 결과, 펌프 레이저 조사 후 파라마그논의 생성(anti-Stokes 신호)을 확인했습니다. 파라마그논의 분산 관계는 유지되지만, Brillouin zone 전반에 걸쳐 운동량 의존적인 스펙트럼 가중치 변화가 관찰되었습니다.", "implication": "빛을 통해 파라마그논 밀도를 직접 조절하고 스펙트럼 가중치를 전이시킬 수 있음을 보였으며, 이는 빛을 이용한 초전도 물성 조작 가능성을 시사합니다.", "novelty": "전자 도핑된 구리 산화물에서 비평형 상태의 자기 들뜸 동역학을 RIXS로 직접 추적한 최신 연구로, RIXS 방법론이 비평형 물성 연구에 매우 강력한 도구임을 입증했습니다.", "unresolved": "관찰된 파라마그논의 스펙트럼 가중치 변화가 구체적으로 어떤 초전도 물성 변화와 직결되는지에 대한 미시적 결론은 추가 연구가 필요합니다.", "future_work": "파라마그논의 변화가 초전도 전이 온도($T_c$)나 gap 구조에 미치는 영향을 규명하기 위한 후속 실험이 예상됩니다.", "concepts": [{"term": "trRIXS", "why_emerged" merged": "물질의 위상 불변량이 변화하면서 물리적 상태가 급격히 바뀌는 현상을 기술하기 위해 등장했습니다.", "origin": "Thouless, Kohmoto, Nightingale, den Nijs (1982) 등의 위상 불변량(TKNN) 연구가 기초가 되었습니다.", "connections": "Quantum Hall Effect, Weyl semimetals, Berry phase."}], "english_summary": ["Monolayer VO is predicted to be a 2D altermagnetic semiconductor.", "The study demonstrates strain-tunable topological phase transitions in the material.", "Collinear magnetic ordering and unique momentum-space spin splitting are highlighted.", "The results offer potential for spintronic and optoelectronic applications in 2D systems."]}}, {"title": "Chemical Symmetry Breaking Enables Interconversion between Altermagnetic and Compensated Ferrimagnetic States", "journal": "PRL_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/bd1f-jdvh", "authors": "Bo Zhao, Qinxi Liu, Qiuping Yang, et al.", "last_authors": "Feng Liu, Xue Jiang", "summary": "Altermagnetism and fully compensated ferrimagnetism are distinct classes of zero-net-magnetization order that combine antiferromagnetic compensation with ferromagneticlike spin splitting. In altermagnets, spin splitting arises from crystal symmetry and alternates in momentum space, whereas in compen…", "tier": "B_IMPORTANT_CONDMAT", "score": "9", "reason": "Directly addresses altermagnetism, a key interest for the user, and related magnetic orders.", "tags": ["magnetism", "altermagnetism", "materials"], "image": "", "briefing": {"background": "자성 물질 내에서 순자성 모멘트가 상쇄되면서도 스핀 분할이 발생하는 상태(알터마그네틱 등)를 조절하는 것은 차세대 스핀 기반 메모리 기술의 핵심적인 과제입니다.", "motivation": "대칭성 파괴를 통해 알터마그네틱 상태와 보상 페리마그네틱(compensated ferrimagnetic) 상태 사이를 어떻게 전환할 수 있는지에 대한 물리적 근거를 찾고자 합니다.", "result": "화학적 대칭성 파괴(chemical symmetry breaking)를 조절하여, 운동량 공간에서 스핀 분할이 일어나는 알터마그네틱과 보상 페리마그네틱 상태 간의 가역적인 변환이 가능함을 밝혔습니다.", "implication": "이는 물질 설계 단계에서 특정 자성 상태를 선택적으로 생성할 수 있는 화학적 도구를 제공하며, 효율적인 스핀 스위칭 소자 설계에 기여합니다.", "novelty": "단순한 외부 제어가 아닌 '화학적 대칭성' 설계를 통한 자성 상태 제어를 제안하여, 알터마그네틱의 근원인 대칭성과 자기적 상호작용의 관계를 명확히 했습니다.", "unresolved": "이론적으로 제안된 화학적 전환 과정이 실제 소자 제작 시 물질의 안정성이나 계면 특성에 어떤 영향을 미치는지는 추가 연구가 필요합니다.", "future_work": "화학적 치환이나 도핑을 통해 제어되는 알터마그네틱-페리마그네틱 상전이에 대한 직접적인 자기 측정 실험이 필요합니다.", "concepts": [{"term": "Compensated Ferrimagnet", "why_emerged": "자기 모멘트가 상쇄되어 외부 자기장에 반응하지 않으면서도 페리마그네틱의 특성을 유지하는 물질 상태를 이해하기 위해 필요했습니다.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "Antiferromagnetism, Ferrimagnetism, Spintronics."}, {"term": "Symmetry Breaking", "why_emerged": "물질의 상전이나 위상적 상태 변화를 이해하기 위해 결정 구조의 대칭성 변화를 정량화하는 핵심 개념입니다.", "origin": "Landau의 상전이 이론(1937)에 깊이 뿌리를 두고 있습니다.", "connections": "Phase transitions, Order parameters, Group theory."}], "english_summary": ["The paper explores the interconversion between altermagnetic and compensated ferrimagnetic states.", "Chemical symmetry breaking is identified as the key mechanism for this control.", "The study distinguishes between momentum-space spin splitting and ferrimagnetic spin compensation.", "This mechanism offers a new pathway for engineering zero-net-magnetization materials."]}}, {"title": "Comment on “Photoinduced Dynamics and Momentum Distribution of Chiral Charge Density Waves in 1T−TiSe2”", "journal": "PRL_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/p5d8-548h", "authors": "Chenhang Xu, Jackson McClellan, Patrick Liu, et al.", "last_authors": "Alfred Zong, Michael W. Zuerch", "summary": "Author(s): Chenhang Xu, Jackson McClellan, Patrick Liu, Sheng-Chih Lin, Shuaiwei Pan, Henry G. Bell, Patrick L. Kramer, Randy Lemons, Sharon S. Philip, Cameron J. R. Duncan, Brian Kaufman, Mianzhen Mo, Alexander H. Reid, Giulio Cerullo, Alfred Zong, and Michael W. Zuerch", "tier": "B_IMPORTANT_CONDMAT", "score": "9", "reason": "Directly related to CDW dynamics and momentum distribution, a core interest.; demoted from A: broad CM, not direct user/project hit", "tags": ["CDW", "momentumdistribution", "TiSe2"], "image": "", "briefing": {"background": "1T-TiSe2는 전형적인 전하 밀도 파동(CDW) 물질로, 광여기 상태에서의 동역학 연구는 전자-격자 결합 및 위상적 변화를 이해하는 핵심 모델 시스템입니다.", "motivation": "본 코멘트는 이전 논문이 제시한 1T-TiSe2의 '카이랄 CDW' 및 그 운동량 분포 해석에 대한 물리적 타당성을 재검토하고자 합니다.", "result": "이전 연구의 특정 해석(특히 운동량 분포의 동역학적 변화)이 광여기 조건이나 모델링 과정에서 오해의 소지가 있음을 지적하며, 논리적 보완을 요구합니다.", "implication": "광여기 분광학 데이터를 해석할 때 전자-격자 상호작용의 비평형적 기여를 더욱 엄밀하게 다루어야 함을 시사합니다.", "novelty": "CDW 동역학의 실험적 해석에 대한 비판적 검토를 통해 해당 분야의 방법론적 엄밀성을 높이는 데 기여합니다.", "unresolved": "논쟁 중인 데이터 해석의 정답이 무엇인지, 즉 광여기 후 실제 카이랄 상태의 시간 분해 거동에 대한 최종적인 합의는 여전히 논의가 필요합니다.", "future_work": "보다 향상된 시간 분해 ARPES 데이터와의 비교 및 정교한 이론적 모델링을 통한 재검증이 필요합니다.", "concepts": [{"term": "CDW (Charge Density Wave)", "why_emerged": "전자와 격자 사이의 강한 상호작용으로 인해 전자 밀도가 주기적으로 변조되는 상태를 이해하기 위해 도입됨.", "origin": "Peierls (1955)에 의해 일차원 금속의 불안정성으로 처음 제시됨.", "connections": "전자-포논 결합, 페르미 표면 중첩, 초전도와의 경쟁 관계."}], "english_summary": ["Critically examines the interpretation of photoinduced dynamics in 1T-TiSe2.", "Challenges previous claims regarding the momentum distribution of chiral CDW states.", "Emphasizes the need for rigorous analysis in nonequilibrium spectroscopy.", "Highlights ambiguity in interpreting ultrafast charge density wave phenomena."]}}, {"title": "Signatures of Altermagnetism in BiFeO3", "journal": "PRL_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/1wyj-nrgk", "authors": "Sajid Husain, Maya Ramesh, Qian Song, et al.", "last_authors": "Darrell G. Schlom, Ramamoorthy Ramesh", "summary": "Magnons provide a route to ultrafast transport and nondestructive readout of spin-based information transfer. Here, we report magnon transport and its emergent anisotropic nature in ${\\mathrm{BiFeO}}_{3}$ layers confined between ultrathin layers of the antiferromagnet ${\\mathrm{LaFeO}}_{3}$. Because…", "tier": "B_IMPORTANT_CONDMAT", "score": "9", "reason": "Experimental signatures of altermagnetism in BiFeO3, a directly relevant topic.", "tags": ["experiment", "altermagnetism", "magnon", "magneticmaterials", "transport"], "image": "", "briefing": {"background": "알터자성(Altermagnetism)은 강자성과 반강자성의 특징을 결합한 새로운 자기 상으로, 스핀 분리된 밴드 구조와 비상반성 수송 특성으로 주목받고 있습니다.", "motivation": "BiFeO3와 같은 물질에서 알터자성의 존재를 실험적으로 증명하고, 이를 통해 스핀트로닉스 소자로의 응용 가능성을 타진하고자 합니다.", "result": "LaFeO3 층 사이에 갇힌 BiFeO3 박막에서 스핀 파동(magnon)의 이방성 수송 특성을 관측하여 알터자성 발현의 증거를 제시했습니다.", "implication": "알터자성 물질이 초고속 스핀 정보 전송 소자 개발에 있어 반강자성체보다 더 우수한 효율을 가질 수 있음을 보여줍니다.", "novelty": "기존 반강자성체로만 알려졌던 물질에서 알터자성적 특성을 확인했다는 점에서 자성 재료 공학적 측면에서 매우 중요합니다.", "unresolved": "관측된 이방성이 알터자성 밴드 구조에서 직접 기인하는 것인지, 격자 왜곡에 의한 기생 효과인지의 명확한 분리가 필요합니다.", "future_work": "다양한 자기장 및 온도 조건에서의 상세한 스핀 수송 특성 측정과 제일원리 계산을 통한 비교 분석이 필요합니다.", "concepts": [{"term": "Altermagnetism", "why_emerged": "스핀 분극이 없으면서도 스핀이 갈라진 전자 구조를 갖는 물질의 필요성 때문에 등장.", "origin": "Jungwirth 등 (2022)에 의해 이론적으로 정립됨.", "connections": "반강자성, 비상반성 수송, 스핀트로닉스."}, {"term": "Magnon", "why_emerged": "자기 정렬 물질 내의 스핀 들뜸을 입자처럼 기술하기 위해 필요.", "origin": "Bloch (1930)에 의해 개념화됨.", "connections": "스핀파, 자기적 들뜸, 열전도."}], "english_summary": ["Reports experimental evidence of altermagnetism in BiFeO3.", "Demonstrates anisotropic magnon transport in confined BiFeO3/LaFeO3 heterostructures.", "Proposes altermagnets for ultrafast spin-based information processing.", "Bridges the gap between theory and experiment in the emerging altermagnetism field."]}}, {"title": "Symmetric Localization of νtot=4/3 Fractional Topological Insulator Edges", "journal": "PRL_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/gcpg-wf17", "authors": "Yang-Zhi Chou, Sankar Das Sarma", "last_authors": "Yang-Zhi Chou, Sankar Das Sarma", "summary": "Motivated by the recent twisted ${\\mathrm{MoTe}}_{2}$ experiment [Wang et al. , Magnetic Signatures of a Putative Fractional Topological insulator in twisted ${\\mathrm{MoTe}}_{2}$, arXiv:2601.18508 ], we develop a disordered interacting edge theory of a fractional topological insulator at ${ν}_{\\mathr…", "tier": "B_IMPORTANT_CONDMAT", "score": "9", "reason": "Theory motivated by experiment on twisted MoTe2, a relevant corre ence in thin 3d magnets remains elusive because of the complex nature of itinerant magnetism and dimensionality effects. Here, we demonstrate the presence of Dirac magnons in a thin itinerant elemental ferromagnet. By investigating atomically designed hexagonal close-packed cobalt films, we establish that magnons in such structures resemble the Dirac electrons in graphene. We explain the physical nature of these Dirac magnons and discuss the consequences of symmetry, dimensionality, magnetic interactions, the number of atomic layers, and cobalt’s itinerant magnetism on the properties of the Dirac points. Our results pave the way for finding and engineering Dirac magnons in a variety of low-dimensional layered 3d ferromagnets and metamaterials.", "tier": "B_IMPORTANT_CONDMAT", "score": "9", "reason": "Direct relevance to Dirac physics, ferromagnetism, and low-dimensional quantum materials.", "tags": ["magneticmaterials", "Diracphysics", "ferromagnetism", "thinfilms", "magnons"], "image": "", "briefing": {"background": "자기적 질서가 있는 고체에서 나타나는 준입자인 마그논(magnon)이 격자 구조와 대칭성에 따라 그래핀의 디랙 전자와 유사한 분산 관계를 가질 수 있다는 이론적 예측이 존재해 왔습니다. 하지만 이를 실제 3d 전이금속 기반의 박막 시스템에서 관측하는 것은 복잡한 편력 자기성으로 인해 난제로 남아있었습니다.", "motivation": "기존의 절연체나 희토류 자성체가 아닌, 일상적인 전이금속인 코발트(Co) 박막 시스템에서도 디랙 마그논이 존재할 수 있는지 확인하고자 함.", "result": "원자 단위로 설계된 육방밀집격자(hcp) 구조의 코발트 박막에서 디랙 마그논의 존재를 입증함.", "implication": "낮은 차원의 3d 전이금속 자성체에서도 디랙 물리학을 구현하고 제어할 수 있는 가능성을 열었으며, 이는 차세대 마그논 기반 소자 개발의 기초가 됨.", "novelty": "이론적으로만 논의되던 디랙 마그논을 itinerant 자성 박막에서 실험적으로 확립함. 특히 저차원 구조에서 대칭성 및 자기 상호작용이 디랙 포인트에 미치는 영향을 규명함.", "unresolved": "다양한 두께와 환경 변화에 따른 디랙 마그논의 로버스트함(robustness)과 실제 소자 응용을 위한 구체적인 제어 방법.", "future_work": "다른 3d 전이금속 기반의 저차원 메타물질에서의 디랙 마그논 탐색 및 이들의 위상학적 특성 활용 연구.", "concepts": [{"term": "디랙 마그논", "why_emerged": "자기 시스템에서 선형 분산 관계를 갖는 준입자를 기술하기 위해 도입됨.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "그래핀의 디랙 페르미온, 위상 자성체."}, {"term": "편력 자성 (Itinerant Magnetism)", "why_emerged": "국소 모멘트 모델로 설명되지 않는 금속성 자성체의 전자 상태를 설 _summary": ["The detailed AI briefing was unavailable for this paper.", "Use the abstract, score reason, and original link for a quick first pass."]}}, {"title": "Angular momentum splitter effect of d-wave axial phonons in orbital altermagnets", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2607.13923", "authors": "Dimos Chatzichrysafis, Alexander Mook", "last_authors": "Dimos Chatzichrysafis, Alexander Mook", "summary": "We theoretically demonstrate that axial phonons, lattice vibration quanta carrying finite angular momentum, can host a $d$-wave angular momentum texture in orbital altermagnets in the absence of spin-orbit coupling. We consider a minimal electronic tight-binding model with $d$-wave loop-current order that breaks time-reversal symmetry. Within the Born-Oppenheimer approximation, we incorporate electron-phonon coupling via the molecular Berry curvature and show that the underlying $d$-wave orbital magnetic moment texture of the electronic state is transferred to the phonons without requiring the relativistic spin-orbit coupling. Our results expand the range of platforms available for engineering axial phonons and point to functionality unique to $d$-wave textures, including angular-momentum Seebeck and splitter effects, corresponding to longitudinal and transverse angular-momentum currents driven by a temperature gradient.", "tier": "B_IMPORTANT_CONDMAT", "score": "9", "reason": "Directly relevant to altermagnetism and Berry curvature-linked orbital textures.", "tags": ["altermagnet", "Berrycurvature", "phonon"], "image": "https://arxiv.org/html/2607.13923v1/x1.png", "briefing": {"background": "알터자성체(altermagnet)는 최근 스핀-궤도 결합 없이도 시간 반전 대칭성을 깨는 독특한 자성 물질로 주목받고 있습니다. 이 물질에서 격자 진동(phonon)이 전자 시스템의 궤도 자기 모멘트와 어떻게 상호작용하는지 이해하는 것은 새로운 물리 현상을 탐색하는 데 중요합니다.", "motivation": "궤도 알터자성체에서 $d$-wave 형태의 각운동량 텍스처가 스핀-궤도 결합 없이도 격자 진동(포논)으로 전달될 수 있는지 이론적으로 검증하고자 함.", "result": "보른-오펜하이머 근사 하에서 전자-포논 결합을 통해 $d$-wave 궤도 자기 모멘트 텍스처가 포논으로 d%3Ds41467-026-75566-9%26doi%3D10.1038/s41467-026-75566-9%26subjmeta%3D1003,119,2792,301,639,766%26kwrd%3DSuperconducting+properties+and+materials,Topological+matter", "briefing": {"background": "중페르미온(heavy-fermion) 계열의 UTe2는 스핀-삼중항(spin-triplet) 초전도체 후보물질로서, 위상 초전도성 가능성과 독특한 자기적 특성으로 인해 응집물질물리학의 중요한 연구 대상입니다.", "motivation": "UTe2의 초전도 갭 구조는 지금까지 논란이 많았으며, 본 연구는 극저온 열전도도 측정을 통해 갭의 노드(node) 유무와 대칭성을 명확히 규명하고자 하였습니다.", "result": "50 mK까지의 열전도도 데이터를 분석한 결과, UTe2는 완전히 닫힌(fully-gapped) 상태를 보이지만 b축 방향으로 갭이 거의 0에 수렴하는 '가짜 점 노드(pseudo point nodal)' 구조를 가지고 있음을 확인했습니다.", "implication": "이 결과는 UTe2가 완전한 노드를 가진 초전도체가 아닐 가능성을 시사하며, 기존의 스핀-삼중항 초전도성 모델을 수정하거나 정교화할 필요성을 제기합니다.", "novelty": "열전도도 측정을 통해 노드 구조의 미세한 차이를 분별해낸 점이 독창적이며, UTe2의 위상적 성질을 이해하는 데 핵심적인 근거를 제공합니다.", "unresolved": "실험 데이터의 해석 모델에 따라 노드의 유무가 달라질 수 있으며, 왜 갭이 특정 방향에서 최소화되는지에 대한 미시적 기원은 여전히 불분명합니다.", "future_work": "다른 방향의 열전도도 측정이나 정밀한 스핀-분해 ARPES 등을 통해 갭 구조의 이방성을 추가로 검증해야 합니다.", "concepts": [{"term": "스핀-삼중항 초전도체", "why_emerged": "기존 BCS 이론의 스핀-단일항(singlet)과 다른, 스핀 자유도가 결합된 초전도 상태를 설명하기 위해 도입됨.", "origin": "Leggett (1975), 3He의 초유체 연구로부터 발전함.", "connections": "Sr2RuO4, UGe2, UCoGe 등 중페르미온 및 위상 초전도 연구와 연결됨."}, {"term": "열전도도 측정(Thermal conductivity)", "why_emerged": "준입자(quasiparticle)의 밀도와 상태를 직접 프로빙하여 초전도 갭 내의 노드 유무를 판별하기 위해 사용됨.", "origin": "초전도 연구에서 고전적으로 사용되던 기법.", "connections": "전자 비열, 초음파 감쇠 실험 등과 함께 저온 물리 연구의 핵심 도구."}], "english_summary": ["Investigated the superconducting gap structure of UTe2 using thermal conductivity measurements down to 50 mK.", "The results indicate a fully-gapped state with a pseudo-point nodal structure near the b-axis.", "The findings suggest the absence of true superconducting nodes, constraining models for triplet pairing in UTe2.", "Provides significant input for identifying the topological nature of heavy-fermion superconductivity."]}}, {"title": "Emergent surface resonance from charge density wave symmetry breaking in TiSe2", "journal": "PRB_Recent", "source": "Gemini", "l ant skyrmion phase.", "Demonstrates the potential for controlling topological magnetic states via external field driving."]}}, {"title": "Even Denominator Fractional Quantum Hall States in the Zeroth Landau Level of ABA Trilayer Graphene", "journal": "PRL_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/tsnc-4jjl", "authors": "Tanima Chanda, Simrandeep Kaur, Harsimran Singh, et al.", "last_authors": "Ajit C. Balram, Aveek Bid", "summary": "Even-denominator fractional quantum Hall states at half-filling are of particular interest because they can host non-Abelian quasiparticles. Here, we report the emergence of such states in the zeroth Landau level ($N=0$) of ABA trilayer graphene (TLG), challenging the conventional expectation that t…", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Experimental observation of FQH states in graphene, a highly relevant material and topic.", "tags": ["graphene", "quantum_Hall", "trilayer_graphene", "experiment"], "image": "", "briefing": {"background": "분수 양자 홀 효과(FQHE)는 강한 자기장 하에서 전자 간의 상호작용으로 인해 정수 전하를 갖지 않는 준입자가 나타나는 현상입니다. 특히 분모가 짝수인 상태는 비아벨 통계를 따르는 준입자를 포함할 가능성이 있어 양자 컴퓨팅 소자로 주목받습니다.", "motivation": "ABA 적층 삼층 그래핀의 0번째 란다우 준위(N=0)에서 기존 예상과 달리 짝수 분모 분수 양자 홀 상태가 나타나는지 실험적으로 검증하고자 했습니다.", "result": "ABA 삼층 그래핀에서 반-채움(half-filling) 상태의 짝수 분모 분수 양자 홀 상태를 발견하였습니다.", "implication": "이 결과는 그래핀 시스템이 비아벨 위상 양자 상태를 연구할 수 있는 매우 깨끗한 플랫폼임을 시사하며, 복잡한 적층 구조가 새로운 양자 상태를 유도하는 데 기여함을 보여줍니다.", "novelty": "기존에 잘 알려진 단층이나 이중층 그래핀을 넘어, 삼층 그래핀의 적층 구조가 고유한 대칭성과 에너지 준위를 통해 새로운 위상 물리 현상을 창출할 수 있음을 입증했습니다.", "unresolved": "이 상태가 실제로 비아벨 통계를 따르는 비아벨 분수 양자 홀 상태인지에 대한 직접적인 증명은 아직 부족합니다.", "future_work": "해당 상태의 준입자 통계에 대한 실험적 검증 및 층간 결합 강도에 따른 위상 상태의 전이 연구가 예상됩니다.", "concepts": [{"term": "비아벨 준입자", "why_emerged": "양자 정보 저장 및 연산을 위한 결함 없는 토폴로지 양자 컴퓨팅을 위해 필요합니다.", "origin": "Moore와 Read(1991)에 의해 제안됨.", "connections": "분수 양자 홀 효과, 모레 구조, 위상 절연체."}, {"term": "ABA 적층 삼층 그래핀", "why_emerged": "그래핀 층을 쌓는 방식에 따라 에너지 밴드 구조와 대칭성을 조절할 수 있어 -dimensional bulk materials, layered systems are coupled by weak van der Waals interactions between layers, endowing them with much higher structural compressibility, particularly along the interlayer direction, which is more sensitive to external pressure. High pressure can expand the accessible phase space, enabling the synthesis of new materials or the retention of metastable phases. On the microscopic level, pressure can significantly tune the interlayer structure and interactions, induce changes in the electronic structure, and consequently give rise to a variety of rich physical properties. This article systematically introduces in situ high-pressure experimental approaches, including diamond anvil cells combined with X-ray and spectroscopic techniques, high-pressure magnetic transport measurements, and emerging NV-center quantum sensing. It further reviews representative pressure-induced phenomena and underlying tuning mechanisms in layered magnetic materials, such as high-spin to low-spin transitions of transition-metal ions and the accompanying structural phase transitions and superconductivity; substantial enhancement of the Curie temperature and continuous switching of magnetocrystalline anisotropy; and antiferromagnetic-to-ferromagnetic transitions achieved by modulating exchange interactions or via stacking engineering. Finally, we discuss future directions, including synergistic multi-field control by combining pressure with electric fields and twisted heterostructures, as well as strategies such as pressure quenching to retain high-pressure metastable magnetic phases at ambient conditions.", "tier": "B_IMPORTANT_CONDMAT", "score": "7", "reason": "Useful review of high-pressure techniques and phenomena in magnetic layered materials.", "tags": ["method", "pressure", "magnetism", "vanderWaals"], "image": "https://arxiv.org/static/browse/0.3.4/images/arxiv-logo-fb.png", "briefing": {"background": "자동 브리핑을 생성하지 못했습니다. 초록과 원문 링크를 기준으로 빠르게 확인하세요.", "motivati
