<title>Daily Paper Slideshow</title>
<style>
  :root {
    color-scheme: light;
    --bg: #f6f7f4;
    --paper: #ffffff;
    --ink: #111827;
    --muted: #64748b;
    --line: #d8ddd2;
    --accent: #176b87;
    --accent-2: #9a3412;
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; overflow: auto; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: var(--bg); color: var(--ink); }
  .shell { max-width: 1500px; min-height: 100vh; margin: 0 auto; padding: 14px 18px; display: flex; flex-direction: column; }
  .topbar { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 16px; }
  .top-actions { display: flex; align-items: center; gap: 10px; }
  .topbar a, button { border: 1px solid var(--line); border-radius: 8px; background: var(--paper); color: var(--ink); padding: 10px 14px; font-weight: 700; text-decoration: none; cursor: pointer; }
  button.primary { background: var(--accent); border-color: var(--accent); color: white; }
  button:disabled { opacity: 0.45; cursor: not-allowed; }
  .counter { color: var(--muted); font-weight: 700; }
  .slide { min-height: calc(100vh - 82px); background: var(--paper); border: 1px solid var(--line); border-radius: 10px; padding: 18px; box-shadow: 0 18px 42px rgba(15, 23, 42, 0.10); display: grid; grid-template-columns: minmax(310px, 0.86fr) minmax(0, 1.55fr); gap: 18px; overflow: visible; }
  .paper-head { min-width: 0; min-height: 0; overflow: visible; display: flex; flex-direction: column; gap: 12px; }
  .figure { margin: 0; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: #f8fafc; }
  .figure img { display: block; width: 100%; max-height: 41vh; object-fit: contain; background: white; }
  .figure figcaption { padding: 7px 10px; color: var(--muted); font-size: 12px; line-height: 1.3; }
  .head-text { display: flex; flex-direction: column; gap: 9px; min-width: 0; }
  .badges { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .badge { border-radius: 999px; padding: 5px 9px; background: #eef2ff; color: #3730a3; font-size: 12px; font-weight: 800; }
  .score { background: #fee2e2; color: #991b1b; }
  h1 { margin: 0; font-size: 25px; line-height: 1.15; letter-spacing: 0; overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
  h1 a { color: inherit; text-decoration-color: rgba(23, 107, 135, 0.35); text-decoration-thickness: 2px; text-underline-offset: 4px; }
  h1 a:hover { color: var(--accent); text-decoration-color: var(--accent); }
  .meta, .authors, .why, .abstract { font-size: 13px; line-height: 1.45; }
  .meta, .authors { color: var(--muted); }
  .why strong, .abstract strong, .authors strong { color: var(--ink); }
  .authors { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .why { border-left: 4px solid var(--accent-2); padding-left: 10px; color: #374151; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .abstract { border-top: 1px solid var(--line); padding-top: 14px; color: #374151; }
  .original-abstract { border-top: 1px solid var(--line); padding-top: 10px; color: #374151; font-size: 11.5px; line-height: 1.35; overflow-wrap: anywhere; }
  .original-abstract strong { display: block; margin-bottom: 4px; color: var(--ink); }
  .tags { display: flex; flex-wrap: wrap; gap: 8px; }
  .tag { border-radius: 999px; padding: 4px 8px; background: #f1f5f9; color: #475569; font-size: 12px; font-weight: 700; }
  .head-text > .link { display: none; }
  .briefing { min-width: 0; min-height: 0; overflow: visible; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); grid-auto-rows: minmax(0, auto); align-content: start; gap: 11px 18px; border-top: 0; padding-top: 0; }
  .brief-section { min-width: 0; }
  .brief-section.wide { grid-column: 1 / -1; }
  .brief-section h2 { margin: 0 0 4px; font-size: 14px; line-height: 1.22; color: #0f766e; letter-spacing: 0; }
  .brief-section p, .brief-section li { margin: 0; font-size: 12.5px; line-height: 1.42; color: #1f2937; overflow-wrap: anywhere; }
  .brief-section ul { margin: 0; padding-left: 20px; }
  .concepts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 9px 14px; }
  .concept { border-top: 1px solid var(--line); padding-top: 7px; }
  .concept h3 { margin: 0 0 4px; font-size: 13px; color: #7c2d12; letter-spacing: 0; }
  .concept p { margin: 2px 0 0; font-size: 11.5px; line-height: 1.35; color: #374151; overflow-wrap: anywhere; }
  .concept b { color: #111827; }
  .link { color: var(--accent); font-weight: 800; text-decoration: none; }
  .empty { padding: 48px; background: var(--paper); border: 1px solid var(--line); border-radius: 12px; color: var(--muted); }
  @media (max-width: 860px) {
    .shell { padding: 14px; }
    .topbar, .top-actions { align-items: stretch; flex-direction: column; }
    .slide, .briefing, .concepts { grid-template-columns: 1fr; }
    .slide { min-height: auto; overflow: visible; display: grid; }
    h1 { font-size: 28px; }
  }
</style>

ic Correlation", "why_emerged": "전자들 사이의 쿨롱 반발이 단순히 독립 입자 근사를 넘어 물질의 위상을 결정할 때 필요합니다.", "origin": "Mott, Hubbard 등에 의해 정립됨.", "connections": "Hubbard 모델, Mott 절연체, 페르미 액체 이론."}, {"term": "TMD(Transition Metal Dichalcogenide)", "why_emerged": "층상 구조의 2차원적 성질과 금속-절연체 전이 등 다양한 전자적 특성을 연구하기 위해 도입되었습니다.", "origin": "1960년대 초반 결정 구조 및 전기적 특성 연구가 본격화됨.", "connections": "NbSe2, TaS2, MoS2, 층상 반도체."}], "english_summary": ["The paper investigates the origin of antiferromagnetism in FexNbS2.", "ARPES, XAS, and DFT reveal large-scale electronic restructuring.", "Findings suggest strong electronic correlations drive magnetic phases in intercalated TMDs.", "Results highlight similarity to correlated oxide physics."]}}, {"title": "Symmetry-Broken Ground State and Phonon-Mediated Superconductivity in Kagome CsV3Sb5", "journal": "PRL_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/4r8x-j3nd", "authors": "Manex Alkorta, Martin Gutierrez-Amigo, Đorđe Dangić, et al.", "last_authors": "Maia G. Vergniory, Ion Errea", "summary": "Author(s): Manex Alkorta, Martin Gutierrez-Amigo, Đorđe Dangić, Chunyu Mark Guo, Philip J. W. Moll, Maia G. Vergniory, and Ion Errea The newly discovered family of nonmagnetic kagome metals ${\\mathrm{AV}}_{3}{\\mathrm{Sb}}_{5}$ ($\\mathrm{A}=\\mathrm{K}$, Rb, or Cs) provides a unique platform for exploring the interplay between charge-density wave (CDW) order, superconductivity, nontrivial topology, and spontaneous time-reversal sym… [Phys. Rev. Lett. 136, 206401] Published Fri May 22, 2026", "tier": "A_MUST_READ", "score": "10", "reason": "Direct hit on user's primary project material; discusses CDW, superconductivity, and TRSB in CsV3Sb5.", "tags": ["material", "kagome", "superconductivity", "CDW"], "image": "", "briefing": {"background": "Kagome 금속 AV3Sb5 계열은 전하 밀도파(CDW), 초전도성, 그리고 시간 반전 대칭성 깨짐(TRSB)이 공존하는 독특한 전자 구조를 가지고 있어 최근 응집물질물리학의 뜨거운 주제입니다.", "motivation": "실험적으로 관측된 CDW 위상과 그에 따른 초전도 상태가 격자 진동(포논)과 어떤 관계를 맺고 있는지, 대칭성 깨짐이 어떻게 발현되는지 이론적으로 분석하고자 했습니다.", "result": "제1원리 계산과 포논 분석을 통해 CsV3Sb5의 CDW 상태와 초전도성 사이의 상관관계를 규명했습니다. 특히 포논 매개 초전도 메커니즘이 이 시스템에서 어떻게 구현되는지에 대한 시사점을 제공합니다.", "implication": "Kagome 격자의 기하학적 좌절(frustration)이 CDW 및 초전도 위상에 미치는 영향력을 명확히 했으며, TRSB 기원에 대한 이론적 근거를 강화합니다.", "novelty": "CDW, 초전도, TRSB의 복잡한 얽힘을 최신 제일원리 포논 계산을 통해 모델링하여, 기존 실험 데이터와 이론 간의 간극을 좁혔습니다.", "unresolved": "전체 시스템의 TRSB에 대한 완전한 미시적 기원과 초전도 상태의 대칭성(s-wave vs non-trivial)에 대한 논쟁은 여전히 지속되고 있습니다.", "future_work": "CDW 상태 하에서의 정확한 에너지 갭 구조를 관찰하기 위한 고분해능 RIXS 및 ARPES 연구가 필요합니다.", "concepts": [{"term": "Kagome Metal", "why_emerged": "기하학적 좌절을 포함한 격자 구조에서 나타나는 평탄 밴드(flat band)와 토폴로지 물성을 연구하기 위해 주목받았습니다.", "origin": "기하학적 문양에서 유래, 응집물질에서는 2000년대 중반 이후 본격화.", "connections": "Dirac fermion, Flat band, Berry curvature."}, {"term": "CDW(Charge Density Wave)", "why_emerged": "전자의 밀도가 공간적으로 주기적인 변조를 일으키는 현상을 이해하기 위해 필요합니다.", "origin": "Peierls에 의해 1차원 금속에 대해 제안됨.", "connections": "Fermi surface nesting, Peierls instability, phonon softening."}, {"term": "TRSB(Time-Reversal Symmetry Breaking)", "why_emerged": "비자성 물질에서 자기적 정렬 없이 자성이 나타나는 비전통적 상태를 설명하기 위해 도입되었습니다.", "origin": "초전도 및 위상 물질 분야에서 중성자 산란/μSR 등으로 검증.", "connections": "Loop current, Anomalous Hall effect, Magnetic topology."}], "english_summary": ["Study explores the interplay of CDW, superconductivity, and TRSB in CsV3Sb5.", "First-principles phonon calculations clarify the mechanism of ground state formation.", "Reveals the link between kagome lattice geometry and phonon-mediated superconductivity.", "Supports the understanding of symmetry-broken states in vanadium-based kagome metals."]}}, {"title": "Engineering magnetic anisotropy and ferromagnetism in the topological kagome metal GdV6Sn6 via Nd substitution", "journal": "PRB_Recent", "source": "keyword", "link": "http://link.aps.org/doi/10.1103/4z1d-42vv", "authors": "Santosh Karki Chhetri, M. M. Sharma, Jian Wang, et al.", "last_authors": "Md Rafique Un Nabi, Jin Hu", "summary": "Author(s): Santosh Karki Chhetri,  yielding structurally well-defined armchair configurations. Their bandgaps shrink systematically with decreasing diameter, in accordance with long-standing theoretical predictions. The insulating BN sheath simultaneously provides an intrinsic gate-all-around architecture, thereby promising access to truly nanoscale transistor channels.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Fabrication and electronic properties of 1D MoS2 nanotubes, relevant for quantum materials.", "tags": ["material", "2Dmaterials", "nanotubes", "1Dsystems", "electronicstructure"], "image": "", "briefing": {"background": "반도체성 전이금속 디칼코게나이드(TMD)의 나노튜브 구조는 1차원 양자 현상을 탐구하고 나노 트랜지스터를 구현할 수 있는 이상적인 플랫폼입니다.", "motivation": "기존 TMD 나노튜브 합성법은 직경이 크고 다층이며 카이랄성이 제어되지 않는 한계가 있어, 1nm 수준의 단일벽 나노튜브 합성이 필요했습니다.", "result": "질화붕소(BN) 나노튜브를 거푸집으로 활용하여 1nm 수준의 단일벽 MoS2 나노튜브를 합성하는 데 성공했습니다.", "implication": "구조적으로 정의된 암체어(armchair) 나노튜브를 통해 밴드갭 엔지니어링이 가능해졌으며, 게이트 구조가 결합된 나노 트랜지스터 구현이 가능해집니다.", "novelty": "공간적 제한(confined growth) 방식을 통해 물리적으로 불안정한 고도로 스트레스받은 나노튜브 구조를 안정화시킨 실험적 성과가 돋보입니다.", "unresolved": "대량 생산 가능성 및 장기적인 소자 안정성에 대해서는 추가적인 검증이 필요합니다.", "future_work": "합성된 나노튜브의 전자 구조를 STM/STS 및 광학 분광법을 통해 상세히 분석하고, 이를 기반으로 한 초소형 나노 트랜지스터 성능 테스트가 예상됩니다.", "concepts": [{"term": "Confined Growth", "why_emerged": "제한된 공간 내에서 반응을 유도하여 평형 상태에서는 얻을 수 없는 결정 구조를 형성하기 위함", "origin": "나노 합성 기술의 발전 과정에서 확립", "connections": "BN 나노튜브, 템플릿 성장, 저차원 물성"}, {"term": "Armchair configuration", "why_emerged": "나노튜브의 카이랄성이 밴드 구조와 도체/반도체 특성을 결정하기 때문에 정밀 제어가 중요함", "origin": "탄소 나노튜브 연구 초기부터 확립", "connections": "MoS2 전자구조, 1차원 양자 한계"}], "english_summary": ["Synthesis of single-walled MoS2 nanotubes at the 1-nm limit is achieved via BN-confined growth.", "The confined geometry stabilizes armchair-configured nanotubes that are otherwise inaccessible.", "Bandgap size correlates with diameter, validating long-standing theoretical predictions.", "BN sheath acts as an intrinsic gate architecture for nanoscale transistors."]}}, {"title": "Broadband and high-speed terahertz wireless sensing via vertical-transport Dirac-source detector", "journal": "Science_Advances", "source": "Gemini", "link": "https://doi.org/10.1126/sciadv.aeg2196", "authors": "Xiaokai Pan, Yiming Wang, Hangxiang Wang, et al.", "last_authors": "Wei Lu, Lin Wang", "summary": "In the realm of wireless sensing, it is envisioned that sensing and communication functionalities will coexist and be fully integrated within a unified system. Future sensing systems thus necessitate detectors capable of operating at higher frequency bands—ranging from millimeter wave to terahertz (THz)—while delivering wider bandwidths, faster response rates, and enhanced functional integration. Dirac-source (DS) detectors use Dirac semimetals as hot-electron sources to capitalize on the low density of states (DOS) near the Dirac point, thereby effectively suppressing the formation of metal-induced gap states. Furthermore, when this architecture incorporates the inherent interlayer vertical electron transport of vertical van der Waals (vdW) heterostructures, it shows great promise for realizing low-power, post–Moore era sensing devices with superior injection and transport efficiencies. Here, we report a DS detector composed of the completely vertical gold/zirconium pentatelluride/graphene/gold structure (Au/ZrTe 5 /graphene/Au) heterojunction, which harnesses strong localized fields to achieve high thermionic emission. The detector manifests outstanding performance in terms of remarkable responsivity, exceeds a peak of 1600 V/W from 0.02 to 0.5 THz at room temperature, has a fast response time less than 20 ns, and notably is capable for heterodyne mixing with intermediate frequency (IF) bandwidth larger than ±26.5 gigahertz. Our results not only shed a fresh light on DS dynamics in the terahertz region but also highlight the transformative potential of semimetal electronics for applications in wireless energy harvesting, communication, and imaging.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Experimental study of a Dirac semimetal (ZrTe5) in a vertical van der Waals heterostructure.", "tags": ["material:ZrTe5", "material:graphene", "topic:Dirac-semimetal", "method:transport"], "image": "", "briefing": {"background": "테라헤르츠(THz) 대역은 차세대 무선 통신 및 고속 센싱을 위한 핵심 주파수 대역입니다. 기존 반도체 소자는 이 영역에서 효율과 대역폭의 한계에 직면해 있어, 새로운 물리적 원리에 기반한 고효율 검출기가 요구되고 있습니다.", "motivation": "디락 반금속의 낮은 상태 밀도(DOS)를 활용하여 금속-반도체 계면에서 발생하는 불필요한 결함을 억제하고, 수직형 van der Waals 헤테로구조를 통해 전자 수송 효율을 극대화하고자 합니다.", "result": "Au/ZrTe5/graphene/Au 수직 적층 구조를 통해 실온에서 1600 V/W 이상의 우수한 응답성과 20ns 미만의 빠른 응답 속도를 달성했습니다.", "implication": "디락 반금속이 차세대 THz 센싱 및 고속 통신 소자 플랫폼으로 매우 유망함을 보여줍니다.", "novelty": "위상물질인 디락 반금속(ZrTe5)을 실제 소자 응용(THz 검출기)에 성공적으로 통합했다는 점이 귀하의 관심사인 위상물질의 응용 가능성을 잘 보여줍니다.", "unresolved": "소자의 장기 안정성 및 대면적 제작 시의 균일성 문제가 남아있을 수 있습니다.", "future_work": "더 넓은 주파수 대역에서의 소자 성능 최적화 및 칩 수준에서의 시스템 집적 연구가 예상됩니다.", "concepts": [{"term": "디락 반금속 (Dirac Semimetal)", "why_emerged": "에너지 밴드 구조에서 전도대와 가전도대가 디락 포인트에서 선형적으로 만나는 물질로, 높은 전자 이동도를 제공합니다.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "위상 절연체, 웨일 반금속 등과 연결됨"}, {"term": "수직형 vdW 헤테로구조", "why_emerged": "서로 다른 2차원 물질을 원자 단위로 적층하여 기존 평면 소자로는 구현하기 힘든 새로운 수송 현상을 유도하기 위해 필요합니다.", "origin": "안드레 가임(Andre Geim) 연구진 등", "connections": "그래핀 트랜지스터, 터널링 소자"}], "english_summary": ["The paper introduces a THz detector using a ZrTe5/graphene vdW heterostructure.", "Dirac semimetals are used to suppress metal-induced gap states via low DOS near the Dirac point.", "The vertical transport architecture achieves high responsivity (1600 V/W) and fast sub-20 ns response.", "This demonstrates the potential of topological materials in high-speed, post-Moore wireless sensing."]}}, {"title": "Mass-invariant universal optical conductivity from quantum geometry", "journal": "Science_Advances", "source": "Gemini", "link": "https://doi.org/10.1126/sciadv.ady2033", "authors": "Chang-geun Oh, Sun-Woo Kim, Kun Woo Kim, Bartomeu Monserrat, Jun-Won Rhim", "last_authors": "Bartomeu Monserrat, Jun-Won Rhim", "summary": "Mass is a defining property of particles, shaping their fundamental nature and interactions. In condensed matter systems, the effective mass of electrons has long been regarded as a key factor influencing material properties, including their transport and optical responses. In this work, we challenge this conventional wisdom by unveiling a mass-invariant universal optical conductivity, purely derived from quantum geometry, in quadratic band–touching semimetals. Specifically, the optical conductivity simplifies to σ = ( e 2 / 8 ℏ ) d max 2 , independent of effective mass and other band structure details, where d max represents the maximum Hilbert-Schmidt quantum distance. Furthermore, under time-reversal and rotational symmetries, d max is restricted to discrete values of 0 or 1, leading to a quantized universal optical conductivity. We also use first-principles calculations to demonstrate the mass-invariant universal optical conductivity across multiple materials, including bilayer graphene, monolayer bismuth, monolayer kagome palladium thiophosphate, and other realistic material candidates. Our work establishes a previously unidentified class of universal quantities in quantum materials entirely governed by quantum geometry.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Discusses quantum geometry and universal optical response in kagome and graphene materials.", "tags": ["kagome", "graphene", "quantum-geometry", "optical-conductivity"], "image": "", "briefing": {"background": "고체 물리학에서 전자의 유효 질량은 수송 및 광학적 특성을 결정하는 핵심 변수로 간주되어 왔습니다. 최근 양자 기하학(Quantum Geometry)이 물질의 물성에 미치는 영향에 대한 연구가 활발합니다.", "motivation": "유효 질량과 같은 물질의 상세한 에너지 대역 구조 정보에 의존하지 않는, 보편적이고 기하학적인 광학 응답 법칙을 규명하고자 했습니다.", "result": "이차 밴드 접촉 반금속에서 광학 전도도가 유효 질량과 무관하게 양자 거리(Quantum Distance)의 함수로 결정되는 보편적 수식을 도출했습니다.", "implication": "물질의 미시적 세부 사항에 얽매이지 않는 새로운 위상적/기하학적 보편 광학 응답의 존재를 입증했습니다.", "novelty": "카고메 격자 및 그래핀 등 귀하의 주요 관심 물질에서 양자 기하학이 실제 광학적 관측량(전도도)을 지배함을 이론 및 계산으로 증명했습니다.", "unresolved": "실험적으로 도출된 보편적 전도도 값을 불순물이나 격자 결함이 있는 실제 샘플에서 어떻게 정밀하게 추출할 것인가에 대한 도전이 남아 있습니다.", "future_work": "다양한 위상 물질에서의 광학 전도도 측정을 통한 이론 검증 및 광전 소자로의 응용 연구가 기대됩니다.", "concepts": [{"term": "양자 기하학", "why_emerged": "블로흐 파동함수의 기하학적 구조가 전자의 동역학에 미치는 효과를 설명하기 위해 도입되었습니다.", "origin": "베리(Berry) 위상 개념에서 파생", "connections": "베리 곡률, 양자 메트릭"}, {"term": "이차 밴드 접촉 (Quadratic Band Touching)", "why_emerged": "디락 포인트와 달리 에너지 밴드가 이차 함수 형태로 접하는 특이한 대역 구조를 기술하기 위해 필요합니다.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "위상 반금속, 엑시톤 물리"}], "english_summary": ["Proposes a mass-invariant universal optical conductivity in quadratic band-touching semimetals.", "The conductivity is governed by quantum geometry (Hilbert-Schmidt quantum distance) rather than effective mass.", "Validated via first-principles calculations on materials like graphene and kagome palladium thiophosphate.", "Establishes a new class of universal quantities linked to the quantum geometry of electronic wavefunctions."]}}, {"title": "Symmetry-locked six-state control of altermagnetism via sliding ferroelectricity", "journal": "Science_Advances", "source": "Gemini", "link": "https://doi.org/10.1126/sciadv.aec5229", "authors": "Wei Sun, Wenxuan Wang, Changhong Yang, Shifeng Huang, Zhenxiang Cheng", "last_authors": "Shifeng Huang, Zhenxiang Cheng", "summary": "Altermagnetic multiferroics offer a promising route to low-power spintronics by enabling spin splitting without net magnetization, extending beyond conventional spin-orbit coupling. However, achieving deterministic electric control has remained elusive. Here, a six-state platform for high-dimensional magnetoelectric coupling in altermagnets is established by exploiting the nondegenerate transition paths of sliding ferroelectrics as a symmetry-engineering knob, thereby transcending the conventional binary (up/down) paradigm of sliding ferroelectricity. First-principles calculations  Cruz, Jue Liu, Gabriele Sala, Stephen D. Wilson, Benjamin A. Frandsen, and Joseph A. M. Paddison The dipolar spin ice ground state is an exotic magnetic phase with degenerate spin configurations analogous to proton ordering in water ice. Here, the authors show that the dipolar spin ice state persists in holmium-based pyrochlores with different types of nonmagnetic site mixing, even when significant disorder-induced modifications to the crystal structure are observed at both the global and local level. [Phys. Rev. B 113, 214415] Published Wed Jun 03, 2026", "tier": "B_IMPORTANT_CONDMAT", "score": "7", "reason": "Experimental study of exotic magnetic ground states in pyrochlore systems using structural probes.", "tags": ["experiment", "spin-ice", "pyrochlore", "magnetism"], "image": "", "briefing": {"background": "피로클로어(Pyrochlores) 구조의 자기 시스템은 강한 기하학적 좌절(frustration)로 인해 스핀 얼음(spin-ice)과 같은 기묘한 자기적 기저 상태를 형성합니다. 이러한 상태가 불순물이나 격자 결함에 얼마나 민감한지는 토폴로지적 자기 상태 연구의 핵심입니다.", "motivation": "전형적인 쌍극자 스핀 얼음 상태가 구조적 결함이나 비자성 불순물에 의해 파괴되는지, 아니면 견고하게 유지되는지를 검증하고자 했습니다.", "result": "Ho 기반 피로클로어에서 의도적인 비자성 사이트 혼합 및 구조적 무질서가 발생함에도 불구하고, 쌍극자 스핀 얼음 상태가 놀랍도록 견고하게 유지됨을 발견했습니다.", "implication": "스핀 얼음 상태의 기저물리가 국소적인 격자 왜곡에 취약하지 않으며, 거시적인 위상적 보호와 유사한 특성을 가질 가능성을 시사합니다.", "novelty": "무질서가 존재하는 상황에서도 이국적인 자기적 상태가 유지됨을 실험적으로 증명함으로써, 이상적인 결정체뿐만 아니라 실제 물질 시스템에서 양자 자기 현상을 다루는 데 중요한 근거를 마련했습니다.", "unresolved": "결함이 일정 수준 이상으로 증가했을 때 발생하는 양자 임계점이나 위상 변화의 구체적인 임계치는 아직 완전히 정의되지 않았습니다.", "future_work": "중성자 산란을 이용한 동역학 연구를 통해 무질서가 스핀 얼음의 여기(excitation) 모드에 미치는 영향 분석이 필요합니다.", "concepts": [{"term": "쌍극자 스핀 얼음 (Dipolar Spin Ice)", "why_emerged": "얼음의 수소 배치 문제와 유사하게, 자기 모멘트들이 좌절 구조 내에서 특정한 조건을 만족하며 에너지를 낮추는 상태를 설명하기 위해 필요함.", "origin": "Harris 등(1997)에 의한 제안 이후 실험적으로 구체화.", "connections": "기하학적 좌절, 자기 모노폴, 피로클로어 격자."}, {"term": "피로클로어 (Pyrochlores)", "why_emerged": "사면체 단위가 공유된 독특한 결정 구조로서, 강한 기하학적 좌절을 유도하는 시스템의 프로토타입으로 중요함.", "origin": "지질학적 명칭에서 유래, 고체 물리학에서는 자기적 좌절 연구의 핵심 구조.", "connections": "자기적 좌   appendBriefSection(briefing, 'Background', b.background);

  appendBriefSection(briefing, 'Result', b.result);
  appendBriefSection(briefing, 'Implication', b.implication);
  appendBriefSection(briefing, "Why it's important / Novelty", b.novelty);
  appendBriefSection(briefing, 'Unresolved Questions', b.unresolved);
  appendBriefSection(briefing, 'Expected Future Work', b.future_work);
  if (b.concepts && b.concepts.length) {
    const section = document.createElement('section');
    section.className = 'brief-section wide';
    section.appendChild(textEl('h2', '', 'Concepts / Terms'));
    const concepts = document.createElement('div');
    concepts.className = 'concepts';
    b.concepts.forEach(c => {
      const item = document.createElement('div');
      item.className = 'concept';
      item.appendChild(textEl('h3', '', c.term || 'Concept'));
      [['왜 생겼나: ', c.why_emerged], ['누가 만들었나: ', c.origin], ['연결되는 흐름: ', c.connections]].forEach(([label, text]) => { if (!text) return; const p = document.createElement('p'); const bold = textEl('b', '', label); p.appendChild(bold); p.append(text); item.appendChild(p); });
      concepts.appendChild(item);
    });
    section.appendChild(concepts);
    briefing.appendChild(section);
  }
  if (b.english_summary && b.english_summary.length) { const section = document.createElement('section'); section.className = 'brief-section wide'; section.appendChild(textEl('h2', '', 'English Summary')); const ul = document.createElement('ul'); b.english_summary.slice(0, 5).forEach(line => ul.appendChild(textEl('li', '', line))); section.appendChild(ul); briefing.appendChild(section); }
  slideEl.appendChild(briefing);
  counterEl.textContent = `${index + 1} / ${slides.length}`;
  prevBtn.disabled = index === 0;
  nextBtn.disabled = index === slides.length - 1;
}
prevBtn.addEventListener('click', () => { index = Math.max(0, index - 1); render(); });
nextBtn.addEventListener('click', () => { index = Math.min(slides.length - 1, index + 1); render(); });
document.addEventListener('keydown', event => { if (event.key === 'ArrowLeft') prevBtn.click(); if (event.key === 'ArrowRight') nextBtn.click(); });
render();
</script>
</body>
</html>
