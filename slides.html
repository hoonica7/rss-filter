<title>Daily Paper Slideshow</title>
<style>
  :root {
    color-scheme: light;
    --bg: #f6f7f4;
    --paper: #ffffff;
    --ink: #111827;
    --muted: #64748b;
    --line: #d8ddd2;
    --accent: #176b87;
    --accent-2: #9a3412;
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; overflow: auto; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: var(--bg); color: var(--ink); }
  .shell { max-width: 1500px; min-height: 100vh; margin: 0 auto; padding: 14px 18px; display: flex; flex-direction: column; }
  .topbar { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 16px; }
  .top-actions { display: flex; align-items: center; gap: 10px; }
  .topbar a, button { border: 1px solid var(--line); border-radius: 8px; background: var(--paper); color: var(--ink); padding: 10px 14px; font-weight: 700; text-decoration: none; cursor: pointer; }
  button.primary { background: var(--accent); border-color: var(--accent); color: white; }
  button:disabled { opacity: 0.45; cursor: not-allowed; }
  .counter { color: var(--muted); font-weight: 700; }
  .slide { min-height: calc(100vh - 82px); background: var(--paper); border: 1px solid var(--line); border-radius: 10px; padding: 18px; box-shadow: 0 18px 42px rgba(15, 23, 42, 0.10); display: grid; grid-template-columns: minmax(310px, 0.86fr) minmax(0, 1.55fr); gap: 18px; overflow: visible; }
  .paper-head { min-width: 0; min-height: 0; overflow: visible; display: flex; flex-direction: column; gap: 12px; }
  .figure { margin: 0; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: #f8fafc; }
  .figure img { display: block; width: 100%; max-height: 41vh; object-fit: contain; background: white; }
  .figure figcaption { padding: 7px 10px; color: var(--muted); font-size: 12px; line-height: 1.3; }
  .head-text { display: flex; flex-direction: column; gap: 9px; min-width: 0; }
  .badges { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .badge { border-radius: 999px; padding: 5px 9px; background: #eef2ff; color: #3730a3; font-size: 12px; font-weight: 800; }
  .score { background: #fee2e2; color: #991b1b; }
  h1 { margin: 0; font-size: 25px; line-height: 1.15; letter-spacing: 0; overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
  h1 a { color: inherit; text-decoration-color: rgba(23, 107, 135, 0.35); text-decoration-thickness: 2px; text-underline-offset: 4px; }
  h1 a:hover { color: var(--accent); text-decoration-color: var(--accent); }
  .meta, .authors, .why, .abstract { font-size: 13px; line-height: 1.45; }
  .meta, .authors { color: var(--muted); }
  .why strong, .abstract strong, .authors strong { color: var(--ink); }
  .authors { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .why { border-left: 4px solid var(--accent-2); padding-left: 10px; color: #374151; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .abstract { border-top: 1px solid var(--line); padding-top: 14px; color: #374151; }
  .original-abstract { border-top: 1px solid var(--line); padding-top: 10px; color: #374151; font-size: 11.5px; line-height: 1.35; overflow-wrap: anywhere; }
  .original-abstract strong { display: block; margin-bottom: 4px; color: var(--ink); }
  .tags { display: flex; flex-wrap: wrap; gap: 8px; }
  .tag { border-radius: 999px; padding: 4px 8px; background: #f1f5f9; color: #475569; font-size: 12px; font-weight: 700; }
  .head-text > .link { display: none; }
  .briefing { min-width: 0; min-height: 0; overflow: visible; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); grid-auto-rows: minmax(0, auto); align-content: start; gap: 11px 18px; border-top: 0; padding-top: 0; }
  .brief-section { min-width: 0; }
  .brief-section.wide { grid-column: 1 / -1; }
  .brief-section h2 { margin: 0 0 4px; font-size: 14px; line-height: 1.22; color: #0f766e; letter-spacing: 0; }
  .brief-section p, .brief-section li { margin: 0; font-size: 12.5px; line-height: 1.42; color: #1f2937; overflow-wrap: anywhere; }
  .brief-section ul { margin: 0; padding-left: 20px; }
  .concepts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 9px 14px; }
  .concept { border-top: 1px solid var(--line); padding-top: 7px; }
  .concept h3 { margin: 0 0 4px; font-size: 13px; color: #7c2d12; letter-spacing: 0; }
  .concept p { margin: 2px 0 0; font-size: 11.5px; line-height: 1.35; color: #374151; overflow-wrap: anywhere; }
  .concept b { color: #111827; }
  .link { color: var(--accent); font-weight: 800; text-decoration: none; }
  .empty { padding: 48px; background: var(--paper); border: 1px solid var(--line); border-radius: 12px; color: var(--muted); }
  @media (max-width: 860px) {
    .shell { padding: 14px; }
    .topbar, .top-actions { align-items: stretch; flex-direction: column; }
    .slide, .briefing, .concepts { grid-template-columns: 1fr; }
    .slide { min-height: auto; overflow: visible; display: grid; }
    h1 { font-size: 28px; }
  }
</style>

<script>
const slides = [{"title": "Unified First-Principles Formula for Time-Resolved ARPES Spectra of Coherent and Incoherent Excitons beyond the Dilute Limit", "journal": "PRL_Recent", "source": "keyword", "link": "http://link.aps.org/doi/10.1103/zhs1-rv1k", "authors": "Gianluca Stefanucci, Enrico Perfetto", "last_authors": "Gianluca Stefanucci, Enrico Perfetto", "summary": "Despite major experimental progresses in time-resolved and angle-resolved photoemission spectroscopy, a quantitative, microscopic framework for interpreting exciton-induced modifications of electronic band structures—applicable even beyond the low-density limit—is still lacking. Here, we close this gap by introducing a unified approach that links the dynamics of coherent and incoherent excitons to distinct and experimentally observable excitonic sidebands. Our central result is a general, first-principles formula for time-resolved photoemission spectra, applicable across a broad range of temperatures, excitation densities, and pump-probe delays. This advance provides a predictive tool for quantitatively tracking excitonic dynamics in complex materials.", "tier": "A_MUST_READ", "score": "10", "reason": "title strong match: ARPES", "tags": ["ARPES", "angle-resolvedphotoemission", "photoemission", "bandstructure"], "image": "", "briefing": {"background": "시간 분해 광전자 분광법(TR-ARPES)은 물질의 비평준 전자 상태를 실시간으로 관측하는 강력한 도구이나, 특히 강하게 상호작용하는 여기자(exciton) 시스템을 밀도 제한 없이 이론적으로 설명하는 것은 매우 어려운 과제였습니다.", "motivation": "기존의 이론적 프레임워크는 낮은 밀도의 여기자 근사(dilute limit)에 의존하는 경향이 있어, 실제 실험에서 나타나는 복잡한 전자-밴드 구조 변화와 여기자 사이드밴드를 정량적으로 해석하는 데 한계가 있었습니다.", "result": "연구진은 coherent 및 incoherent 여기자 역학을 모두 포함하는 범용적인 제1원리 공식(first-principles formula)을 유도했습니다. 이 공식은 고밀도 환경 및 다양한 온도 조건에서도 적용 가능합니다.", "implication": "TR-ARPES 데이터의 정량적 분석이 가능해짐으로써, 복잡한 양자 물질에서 발생하는 들뜬 상태의 역학을 더 정밀하게 제어하고 예측할 수 있게 됩니다.", "novelty": "기존 모델들이 가졌던 '희박한 밀도' 가정을 깨고, 실제 강상관 전자계에서 일어나는 여기자 응답을 포괄하는 이론을 제시했다는 점에서 ARPES 데이터를 다루는 연구자에게 중요한 분석 도구가 될 것입니다.", "unresolved": "매우 짧은 펨토초 단위에서의 고차 비선형 효과나 복잡한 격자-전자 결합이 완전히 포함되었는지에 대한 실험적 검증이 추가로 필요합니다.", "future_work": "실제 고밀도 여기자가 존재하는 물질(예: 2차원 반도체 혹은 상관계 물질)의 TR-ARPES 실험 데이터에 본 공식을 적용하여 이론적 예측력 검증.", "concepts": [{"term": "Coherent vs Incoherent Excitons", "why_emerged": "여기자의 양자 역학적 위상 정보 유지 여부를 구분하기 위해 도입됨.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "비평형 통계역학, 양자 정보학."}, {"term": "Excitonic Sidebands", "why_emerged": "여기자와 전자의 상호작용으로 인해 광전자 스펙트럼에서 나타나는 추가적인 밴드 피크를 설명하기 위해 필요.", "origin": "다체 물리 이론 내에서 수십 년간 정립.", "connections": "복합 밴드 구조, 다체 상호작용."}], "english_summary": ["Provides a universal first-principles formula for TR-ARPES spectra.", "Handles both coherent and incoherent excitonic dynamics.", "Valid beyond the dilute limit, covering high density and temperature.", "Enables quantitative tracking of exciton dynamics in complex materials."]}}, {"title": "Defect-induced displacement of topological surface state in quantum magnet MnBi2Te4", "journal": "arXiv_CondMat", "source": "author whitelist", "link": "https://arxiv.org/abs/2507.05161", "authors": "Felix L\\\"upke, Marek Kolmer, Hengxin Tan, et al.", "last_authors": "Wonhee Ko, An-Ping Li", "summary": "The topological magnet MnBi$_2$Te$_4$ (MBT), with gapped topological surface state, is an attractive platform for realizing quantum anomalous Hall and Axion insulator states. However, the experimentally observed surface state gaps fail to meet theoretical predictions, although the exact mechanism behind the gap suppression has been debated. Recent theoretical studies suggest that intrinsic antisite defects push the topological surface state away from the MBT surface, closing its gap and making it less accessible to scanning probe experiments. Here, we report on the local effect of defects on the MBT surface states and demonstrate that high defect concentrations lead to a displacement of the surface states well into the MBT crystal, validating the theorized mechanism. The local and global influence of antisite defects on the topological surface states are studied with samples of varying defect densities by combining scanning tunneling microscopy (STM), angle-resolved photoemission (ARPES), and density functional theory (DFT). Our findings identify a combination of increased defect density and reduced defect spacing as the primary factors underlying the displacement of the surface states and suppression of surface gap, guiding further development of topological quantum materials.", "tier": "A_MUST_READ", "score": "10", "reason": "author whitelist: Adam Kaminski", "tags": ["ARPES", "angle-resolvedphotoemission", "photoemission", "STM", "scanningtunneling", "anomalousHall", "quantummagnet", "topological"], "image": "https://arxiv.org/static/browse/0.3.4/images/arxiv-logo-fb.png", "briefing": {"background": "자기 위상 물질인 MnBi2Te4(MBT)는 양자 변칙 홀 효과와 액시온 절연체를 구현할 후보 물질이나, 이론적 예측과 달리 관측되는 위상 표면 상태의 에너지 갭이 매우 불일치하는 문제가 있었습니다.", "motivation": "이 현상의 원인이 결함(defect)에 의한 표면 상태의 물리적 변화인지, 혹은 다른 내재적 이유 때문인지 규명하고자 했습니다.", "result": "안티사이트(antisite) 결함 농도가 높을수록 위상 표면 상태가 결정 내부로 밀려나며(displacement), 이로 인해 표면 갭이 닫히거나 관측 불가능해짐을 STM/ARPES/DFT 결합 분석으로 입증했습니다.", "implication": "MBT 기반의 소자 제작 시 결함 농도 제어가 위상 물성을 보존하는 데 핵심적인 변수임을 확인했습니다.", "novelty": "이론적 가설로만 존재하던 '결함에 의한 위상 상태의 내부 밀림' 현상을 실제 STM과 ARPES 데이터로 직접 연결하여 증명했습니다.", "unresolved": "특정 결함 타입뿐만 아니라 다른 형태의 격자 결함이 밴드 구조에 미치는 정량적 영향과 위상적 보호 장벽에 대한 완전한 이해는 부족합니다.", "future_work": "결함 제어 기술을 극대화한 샘플에서의 위상 수송 특성 측정 및 액시온 절연체 상태 구현 시도.", "concepts": [{"term": "Antisite Defects", "why_emerged": "격자 위치에 있어야 할 원자가 다른 원자로 치환되는 현상으로 실제 합성 시 흔히 발생.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "결정 결함 물리, 위상 물질의 안정성."}, {"term": "Axion Insulator", "why_emerged": "자기적 위상 물질에서 시간 반전 대칭성이 깨졌을 때 나타나는 독특한 위상학적 상태.", "origin": "Wilczek 등에 의해 제안.", "connections": "토폴로지, 양자 변칙 홀 효과."}], "english_summary": ["Investigates the discrepancy between predicted and observed gaps in MnBi2Te4.", "Confirms that antisite defects displace topological surface states into the bulk.", "Utilizes combined STM, ARPES, and DFT to map the defect impact.", "Identifies defect density and spacing as the critical factors for surface state degradation."]}}, {"title": "Discovery of a symmetry-driven electronic cascade in a d-wave altermagnet", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2607.11567", "authors": "Zhouyi Yin, Zheng Shi, Shuxuan Zhang, et al.", "last_authors": "Junwei Liu, Yue Zhao", "summary": "Altermagnets host magnetic compensation together with non-relativistic spin-split bands, a coexistence enabled by crystal symmetry. Yet whether and how crystal symmetry organizes collective electronic order remains largely unexplored. Here we uncover a symmetry-driven cascade of finite-$q$ charge order in a $d$-wave altermagnet Rb$_{1-{\\delta}}$V$_2$Te$_2$O, using phase-resolved scanning tunneling microscopy. A primary density-wave instability drives an initial electronic reconstruction, followed by the emergence of a nematic component and an off-axis modulation with wave vectors geometrically tied to the preceding orders. Phase-resolved spectroscopy distinguishes these components through separate contrast-inversion energies and maps out branch-selective spectral-weight redistribution within the off-axis mode. Together with doping and temperature evolution, these observations establish a highly coordinated hierarchy of coupled density-wave instabilities, consistent with successive symmetry lowering. This multi-component hierarchy can be well described in the Landau framework through sequential softening of the charge orders, where bilinear coupling to their compatible octupolar partners at the lower-symmetry stages enables mutual stabilization within an intertwined charge-multipole state. Such a transparent realization of a charge-order cascade shows how altermagnetic symmetry can extend beyond band formation to organize collective electronic order, offering a new perspective on emergent many-body states in correlated quantum materials.", "tier": "A_MUST_READ", "score": "10", "reason": "Direct hit: Phase-resolved STM study of collective electronic order and nematicity in an altermagnet.", "tags": ["scanning-tunneling-microscopy", "altermagnetism", "nematicity"], "image": "https://arxiv.org/static/browse/0.3.4/images/arxiv-logo-fb.png", "briefing": {"background": "알터자성(Altermagnetism)은 비상대론적 스핀 분할이 자기적 상쇄와 공존하는 새로운 자기 상(phase)으로, 최근 자성체 물성 연구의 핵심 분야입니다.", "motivation": "알터자성 물질에서 결정 대칭성이 어떻게 집단적인 전자 질서(collective electronic order)를 체계화하는지 확인하고자 했습니다.", "result": "RbV2Te2O에서 전하 밀도 파(CDW), 네마틱(nematic) 질서, 그리고 오프축 변조로 이어지는 대칭성 기반 전자 캐스케이드를 발견했습니다.", "implication": "알터자성의 대칭성이 단순히 밴드 분할에 그치지 않고 다양한 다체 물리적 질서를 조직하는 역할을 한다는 것을 보여주며, 복합적인 상 전이 연구의 새로운 기준을 제시합니다.", "novelty": "알터자성에서 나타나는 네마틱성과 전하 질서의 계층적 구조를 단계별 대칭성 깨짐으로 설명한 첫 사례에 가깝습니다.", "unresolved": "이 캐스케이드 현상이 초전도성과 같은 다른 양자 상태와 어떻게 상호작용하는지는 아직 명확하지 않습니다.", "future_work": "제안된 Landau 프레임워크를 바탕으로 다른 알터자성체에서의 일반화 가능성 탐색 및 저온 강한 자기장 환경에서의 상 다이어그램 확장.", "concepts": [{"term": "Altermagnetism", "why_emerged": "기존의 강자성/반강자성으로 분류되지 않는, 스핀 분할을 가진 독특한 자기적 위상을 설명하기 위해 제안됨.", "origin": "최근 3~4년 내 이론적으로 급부상.", "connections": "반강자성, 스핀트로닉스, 베리 곡률."}, {"term": "Nematicity", "why_emerged": "결정의 회전 대칭성이 깨지지만 병진 대칭성은 유지되는 전자적 상태를 설명하기 위해 필요.", "origin": "철 기반 초전도체 등에서 처음 활발히 논의.", "connections": "강상관 전자계, 초전도 질서 매개변수."}], "english_summary": ["Discovers a symmetry-driven electronic cascade in the d-wave altermagnet RbV2Te2O.", "Reveals a hierarchy of density-wave instabilities linked to sequential symmetry breaking.", "Uses phase-resolved STM to map the spectral weight redistribution.", "Demonstrates how altermagnetic symmetry orchestrates collective electronic order."]}}, {"title": "Direct evidence of light-induced phase-fluctuations in cuprates via time-resolved ARPES", "journal": "npj_QuantumMaterials", "source": "keyword", "link": "https://www.nature.com/articles/s41535-026-00919-y", "authors": "D. Armanno, F. Goto, J.-M. Parent, et al.", "last_author hor whitelist: Hong Ding", "tags": ["superconduct", "topological"], "image": "", "briefing": {"background": "초전도체 내의 양자 와류(quantum vortex)는 통상적으로 하나의 자속 양자(flux quantum)를 가지는 정수 형태의 싱귤래리티를 형성합니다. 이는 초전도 현상의 위상학적 성질을 이해하는 핵심 요소입니다.", "motivation": "다중 띠(multiband) 초전도체인 KFe2As2 표면에서 관찰되는 양자 와류 코어가 정수 단위가 아닌 분수 단위로 쪼개지는 현상과 그 위상학적 성질을 규명하고자 합니다.", "result": "KFe2As2 표면에서 단일 자속 와류가 여러 개의 분수 와류(fractional vortices)로 쪼개지는 현상을 관찰했습니다. 이들은 CP^2 스카이르미온 위상 불변량을 가지는 카이랄 스카이르미온 체인을 형성하며, 각 와류의 성격에 따라 분광학적 특징이 다름을 밝혀냈습니다.", "implication": "다중 띠 초전도체에서 발견되는 이러한 분수 와류와 스카이르미온 구조는 기존의 런던 양자화 모델을 넘어서는 새로운 위상학적 질서가 존재함을 시사합니다.", "novelty": "Hong Ding 그룹의 연구로, 초전도체 내의 위상학적 결함이 분수화(fractionalization)될 수 있음을 실험적으로 입증한 점이 매우 중요하며, 이는 향후 위상 초전도 연구의 새로운 지평을 엽니다.", "unresolved": "이러한 분수 와류 구조가 bulk에서도 나타나는지, 혹은 표면 특성에 국한된 현상인지에 대한 추가적인 검증이 필요합니다.", "future_work": "다른 다중 띠 초전도체에서의 유사 현상 탐색 및 스카이르미온 구조의 동역학적 특성에 관한 연구가 예상됩니다.", "concepts": [{"term": "Quantum Vortex", "why_emerged": "초전도체 내부로 침투하는 자기장을 위상학적으로 정의하기 위해 필요.", "origin": "Abrikosov (1957년)에 의해 이론적으로 확립.", "connections": "Ginzburg-Landau 이론, Josephson 효과."}, {"term": "Vortex Fractionalization", "why_emerged": "다중 띠 시스템에서 일반적인 정수 와류와 다른 위상적 상태를 기술하기 위해 필요.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "분수 양자 홀 효과, 위상 초전도체."}, {"term": "Skyrmion", "why_emerged": "연속적인 장에서 나타나는 비자명한 위상학적 입자 구조를 기술하기 위해 필요.", "origin": "Tony Skyrme (1960년대 초반).", "connections": "위상 불변량, 자성체 내 스핀 구조."}], "english_summary": ["Observed fractionalization of integer-flux quantum vortices into smaller components on KFe2As2 surfaces.", "Identified these fractional vortices as building blocks of chiral skyrmion chains with CP^2 topological invariants.", "The distinct spectroscopic signatures confirm the non-trivial topology of these vortex states.", "This provides new insights into vortex physics in multiband superconductors."]}}, {"title": "Catalog of Altermagnetism in Magnetic Wallpaper/Space Groups and Nonsymmorphic Altermagnets (RIKEN-iTHEMS-Report-26)", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2607.10857", "authors": "Congcong Le, Fan Cui, Iao-Fai Io, Moritz Hirschmann, Xianxin Wu, Ching-Kai Chiu", "last_authors": "Xianxin Wu, Ching-Kai Chiu", "summary": "Conventional altermagnetism, characterized by compensated collinear spin alignment and spin splitting, exhibits identical spin states at opposite momenta. In this work, we employ a non-spatial global symmetry $S$, the spinless time-reversal symmetry, which effectively replaces inversion symmetry in preserving the spin-state equivalence; hence, we systematically extend the classification of altermagnetism to all possible non-centrosymmetric crystals. By analyzing the necessary symmetry conditions, we provide a complete catalog of altermagnetic orders for all 2D magnetic wallpaper groups and all 3D magnetic space groups, identifying 17 altermagnetic wallpaper groups (12 centrosymmetric and 5 non-centrosymmetric) and 422 altermagnetic space groups (160 centrosymmetric and 262 non-centrosymmetric). This catalog assigns each altermagnetic wallpaper and space group to one of the six altermagnetic wave types established in the literature and presents its distinct spin distribution in the Brillouin zone (BZ); notably, the low-energy wave-type description does not necessarily extend throughout the full BZ, since the spin-degenerate nodal lines and planes can be unpinned from the high-symmetry planes. Beyond the catalog, nonsymmorphic symmetries further bring new patterns of the altermagnetic BZs through the emergence of hourglass dispersions, which arise from the compatibility relations between two symmetry-protected degenerate manifolds: same-spin and opposite-spin degeneracies. In both the non-centrosymmetric altermagnetism and the emergence of the hourglass dispersion, the spinless time-reversal symmetry plays the key role. Our work extends the symmetry catalog of altermagnetism and reveals that nonsymmorphic symmetries are essen  induce novel band structures like hourglass dispersions.", "The catalog serves as a comprehensive guide for identifying new altermagnetic materials."]}}, {"title": "Strain-Tuned Nodal Superconductivity in the Charge-Ordered Kagome Metal CsV3Sb5", "journal": "arXiv_CondMat", "source": "keyword", "link": "https://arxiv.org/abs/2607.11115", "authors": "Yusuke Takeuchi, Akito Kobayashi, Saki Uchida, et al.", "last_authors": "Yong Zhao, Guo-qing Zheng", "summary": "The nature of the superconducting pairing symmetry in the kagome metal CsV$_3$Sb$_5$ and its relationship with the charge density wave (CDW) order are central unresolved issues. Here, we investigate the evolution of superconductivity in CsV$_3$Sb$_5$ under in-situ uniaxial pressure using $^{121}$Sb nuclear quadrupole resonance (NQR). We find that tensile strain significantly enhances the superconducting transition temperature, $T_{\\rm c}$, while the CDW remains unchanged, demonstrating that superconductivity can be tuned independently of the bulk charge order. At a tensile strain of $\\varepsilon$ = +0.90%, the nuclear spin-lattice relaxation rate reveals a remarkable double transition: an upper transition at $T_{\\rm c1}$ = 3.6 K to a nodal gap state, and a lower one at $T_{\\rm c2}$ = 3.0 K characterized by a nodeless gap. These results evidence degenerate superconducting states with different gap symmetry in the kagome metal at ambient pressure which split under strain. Our work demonstrates a high tunability of superconductivity by uniaxial pressure.", "tier": "A_MUST_READ", "score": "9", "reason": "title strong match: kagome metal", "tags": ["kagome", "chargedensitywave", "CDW", "superconduct"], "image": "https://arxiv.org/html/2607.11115v1/x1.png", "briefing": {"background": "Kagome 금속 CsV3Sb5는 전하 밀도 파동(CDW)과 초전도성이 공존하는 시스템으로, 이들의 미시적 관계와 초전도 대칭성을 규명하는 것은 현재 응집물리계의 주요 화두입니다.", "motivation": "단축 압력(uniaxial pressure)을 가했을 때 초전도 특성이 어떻게 변화하는지, 그리고 CDW 질서와 독립적으로 튜닝 가능한지를 조사하고자 합니다.", "result": "인장 변형(tens y simple setting in which electron interactions compete with a suppressed kinetic-energy scale. Here we propose a buckled silicon kagome lattice (SiKL), an unfunctionalized six-atom monolayer composed of bond-linked Si 3 triangles and dodecagonal pores. The planar parent hosts a dispersionless Kohn–Sham band near the Fermi level but is unstable to out-of-plane distortions. Following three soft zone-centre phonons and relaxing the displaced structures yields two nearly degenerate buckled configurations with heights of 1.22 and 1.40 Å. The high-buckling configuration retains a partially flat kagome-derived band near the Fermi level. Biaxial tension simultaneously controls its lattice dynamics and electronic dispersion: at 10% strain, the calculated bandwidth reduces significantly, the associated density-of-states peak approaches the Fermi level, and the softest phonon frequency hardens. In 6 × 6 6\\times 6 ab initio molecular-dynamics simulations at 315 K, the unstrained network transitions to disorder, whereas the strained network remains ordered, indicating strain-induced finite-temperature metastability. Fifty-nanosecond classical molecular-dynamics simulations of 36 × 36 36\\times 36 sheets further reveal a strain-controlled crystalline–amorphous transition and a local-bonding crossover near 2% strain. Low-strain trajectories show gradual, two-stage disordering, whereas higher strains undergo an abrupt, first-order-like collapse, with the transition temperature reaching approximately 600 K at 10% strain. An exploratory Ag(111) substrate model suggests that epitaxial mismatch could supply comparable tension, retain a narrow SiKL band, and preserve crystalline order well above room temperature. Unlike chemically passivated or hybrid-lattice silicon kagome proposals designed mainly as conventional semiconductors, SiKL is elemental and uses strain alone to couple thermal metastability, bond rearrangement, and near-Fermi flat-band tuning. Buckled SiKL is therefore a ca conductors, our work demonstrates that the order parameter symmetry of unconventional magnets can be precisely mapped via quantum-oscillatory quasiparticle spectroscopy, establishing CrSb as a prototypical $g$-wave metallic altermagnet.", "tier": "B_IMPORTANT_CONDMAT", "score": "9", "reason": "Direct experimental spectroscopy of altermagnetic order, highly relevant to current magnetism interest.", "tags": ["altermagnet", "spectroscopy", "CrSb"], "image": "https://arxiv.org/html/2601.14526v2/x1.png", "briefing": {"background": "자성체에서 스핀 축퇴성이 사라지는 현상은 강자성(완전 축퇴 해소)과 반강자성(축퇴 유지)으로 구분되어 왔으나, 최근 '알터마그넷(Altermagnet)'이라는 새로운 자기 위상이 제안되었습니다. 알터마그넷은 순자성 모멘트가 0이면서도 결정 대칭성에 의해 운동량 공간에서 스핀 분할이 일어나는 물질군을 말합니다.", "motivation": "알터마그넷의 핵심인 '차수 변수(Order parameter)'의 대칭성을 직접 실험적으로 확인하고, 이를 통해 물질의 전자 구조가 가진 스핀 분할 형태(g-wave)를 입증하고자 했습니다.", "result": "CrSb 단결정에서 자기 양자 진동(Quantum Oscillation) 측정을 통해 3차원 페르미 면을 매핑했습니다. 그 결과, 스핀 분할이 g-wave($Y_4^{-3}$) 구면 조화 함수를 따른다는 것을 확인하여 CrSb가 프로토타입 g-wave 알터마그넷임을 증명했습니다.", "implication": "초전도체에서 노드 구조를 찾는 것과 유사한 방식으로 자기 물질의 복잡한 스핀 분할 대칭성을 양자 진동 분석을 통해 정밀하게 규명할 수 있음을 보여주었습니다.", "novelty": "기존의 이론적 예측에 머물던 알터마그넷의 대칭성을 양자 진동이라는 벌크 민감형 분광학 기법을 통해 3D로 직접 재구성했다는 점에서 중요합니다.", "unresolved": "초전도체와 유사하게 스핀 분할의 정밀한 각도 의존성을 확인했으나, 이러한 g-wave 대칭성이 결정의 결함이나 국소적 환경에 의해 어떻게 변하는지는 향후 연구가 필요합니다.", "future_work": "다른 알터마그넷 후보 물질들로의 확장 및 온도 변화에 따른 스핀 분할 대칭성의 안정성 연구가 기대됩니다.", "concepts": [{"term": "Altermagnetism", "why_emerged": "강자성과 반강자성의 장점을 결합한 차세대 스핀트로닉스 소자 구현을 위해 제안됨.", "origin": "초록 정보만으로는 특정하기 어려움 (최근 이론적 물리 분야에서 급격히 대두됨).", "connections": "반강자성체, 비자성 금속 스핀 분할, 스핀-궤도 결합(SOC)."}, {"term": "Quantum Oscillations", "why_emerged": "금속의 페르미 면 형태와 준입자 유효 질량, 베리 위상 등을 정밀하게 측정하기 위해 필요.", "origin": "1930년대 드 하스-반 알펜 효과 발견 이후 정립.", "connections": "페르미 면 매핑, ARPES, 자기 저항 측정."}, {"term": "g-wave symmetry", "why_emerged": "결정장과 스핀 분할의 각도 분포를 설명하기 위한 수학적 기저 함수.", "origin": "원자 오비탈의 각운동량 함수에서 유래.", "connections": "d-wave 초전도체, 알터마그네틱 페르미 면 스핀 분할."}], "english_summary": ["The study experimentally confirms the g-wave altermagnetic order parameter in bulk CrSb.", "Magnetic quantum oscillation measurements map the 3D Fermi surface and spin-split bands.", "Results show exchange splitting follows the Y4^-3 spherical harmonic profile.", "This establishes quantum-oscillatory quasiparticle spectroscopy as a key tool for characterizing altermagnets."]}}, {"title": "A minimal model for the Weyl nodes and Fermi arcs of PtBi2", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2607.10937", "authors": "Tobias Crist\\'ofoli, Manuel Alonso Lemos, Jorge I. Facio, Pablo S. Cornaglia", "last_authors": "Jorge I. Facio, Pablo S. Cornaglia", "summary": "Weyl semimetals host topologically protected Fermi arcs on their surfaces, originating from the Chern number of the bulk Weyl nodes. In trigonal PtBi$_2$, superconducting signatures have been associated with the Fermi arcs. Theoretical descriptions of this surface superconductivity have so far relied on effective models that are not directly tied to the microscopic electronic structure of the material. In this work we develop a minimal description of the low-energy bands guided by density functional theory calculations and fully constrained by the relevant crystalline and time-reversal symmetries. The model captures the evolution of the Weyl nodes with spin-orbit coupling, including node annihilations, and is able to describe the spin-momentum locking of the surface Fermi arcs. It reproduces the orbital content and the band topology of PtBi$_2$ and provides a starting point for further studies.", "tier": "B_IMPORTANT_CONDMAT", "score": "9", "reason": "Directly models electronic structure (Weyl nodes/Fermi arcs) of a specific topological semimetal.; demoted from A: broad CM, not direct user/project hit", "tags": ["DFT", "PtBi2", "Weylsemimetal"], "image": "https://arxiv.org/html/2607.10937v1/x1.png", "briefing": {"background": "Weyl 반금속(Weyl Semimetal)은 벌크 내의 Weyl 노드와 표면의 Fermi arc라는 독특한 전자 구조를 가지며, 위상학적 물리 현상의 연구 플랫폼으로 주목받고 있습니다.", "motivation": "PtBi2에서 관측된 표면 초전도 현상이 Weyl 노드 및 Fermi arc와 관련이 있다고 알려져 있으나, 이를 뒷받침할 구체적인 미시적 모델이 부족하여 이를 구축하고자 했습니다.", "result": "밀도범함수이론(DFT)을 기반으로 PtBi2의 결정 및 시간 반전 대칭성을 모두 만족하는 최소 모델을 개발했습니다. 이 모델은 스핀-궤도 결합에 따른 Weyl 노드의 진화와 표면 Fermi arc의 스핀-운동량 잠김(Spin-momentum locking) 현상을 성공적으로 설명합니다.", "implication": "이 모델을 통해 PtBi2의 위상학적 특성을 명확히 정의하고, 향후 표면 초전도성과 위상학적 밴드 구조 간의 상호작용을 연구할 수 있는 이론적 기반을 마련했습니다.", "novelty": "기존의 현상론적 모델과 달리 실제 물질의 전자 구조와 대칭성을 긴밀하게 연결한 미시적 모델을 제시하여, 실험 데이터와의 직접적인 비교 분석이 가능해졌습니다.", "unresolved": "이 모델이 표면 초전도성의 미세한 메커니즘까지 완벽하게 예측하는지 여부는 향후 정밀한 STS 데이터와의 비교가 필요합니다.", "future_work": "개발된 모델을 기반으로 한 표면 상태와 초전도성 간의 위상학적 상호작용 계산 및 STS 분광학 데이터와의 대조 작업.", "concepts": [{"term": "Weyl nodes", "why_emerged": "3차원 결정 구조에서 전도대와 가전자대가 점 형태로 맞닿는 위상학적 특이점 이해를 위해 필요.", "origin": "HERMANN WEYL(이론), 2011년 Wan 등(고체물리 제안).", "connections": "Berry curvature, Anomalous Hall Effect, Fermi arcs."}, {"term": "Fermi arcs", "why_emerged": "Weyl 노드의 위상학적 전하(Chern number)에 의해 표면에서 나타나는 불연속적인 페르미 면 조각.", "origin": "Wan et al. (2011).", "connections": "Weyl 반금속, 표면 상태, 위상학적 보호."}], "english_summary": ["Developed a minimal theoretical model for the electronic structure of PtBi2.", "Incorporated DFT results to account for crystalline and time-reversal symmetries.", "Explains the evolution of Weyl nodes and spin-momentum locking of surface Fermi arcs.", "Provides a foundation for investigating the relation between surface superconductivity and topology."]}}, {"title": "Anomalous Transverse Response and Multi-Field Ferrialtermagnetic-Ferroelectric Valve with CrSb Flakes", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2607.11222", "authors": "Long Zhang, Xinfeng Chen, Hongfei Liang, et al.", "last_authors": "Guangqian Ding, Guoying Gao", "summary": "Altermagnets combine the zero-stray-field of antiferromagnets with the spin polarization of ferromagnets, showing great potential for spintronic applications. Here, we propose ferrialtermagnetism as a distinct subclass of altermagnetic family, where symmetry-inequivalent altermagnetic sublattices possess nonidentical Neel vectors, preventing mutual cancellation of alternating spin splitting and conferring intrinsic robustness against perturbations. This concept is realized in the three-atomic-layer CrSb (110) flakes, which exhibits spin splitting of 344 meV, moderate uniaxial magnetic anisotropy, and high Neel temperature of 657 K. The magneto-optical Kerr and the anomalous Hall effects are observed. Integrating this ferrialtermagnetic CrSb with ferroelectric Sc2CO2 and Cu spacer, we design an ferrialtermagnetic-ferroelectric valve. This device displays equilibrium tunneling magnetoresistance and electroresistance of ~10^3%, and non-equilibrium magnitudes under bias, thermal, or light field reaches ~10^4% with high spin filtering of 90%. The negative differential resistance and photogalvanic effects, and photocurrent extinction ratio of 283.8 are achieved. These findings establish ferrialtermagnetism as a fertile platform for multi-field-controlled, ultracompact, and self-powered spintronics and electronics.", "tier": "B_IMPORTANT_CONDMAT", "score": "9", "reason": "Directly focuses on altermagnetism and anomalous Hall effect in CrSb, both identified as high-priority topics.", "tags": ["material", "altermagnetism", "anomalousHall"], "image": "https://arxiv.org/static/browse/0.3.4/images/arxiv-logo-fb.png", "briefing": {"background": "알터마그넷은 스핀 분할을 가지면서도 순자성이 0인 반강자성의 특성을 가져, 정보 손실 없는 빠른 스핀 소자 구현에 유리한 차세대 후보군입니다.", "motivation": "단순 알터마그넷을 넘어, 스핀 분할의 강건함을 보장하기 위해 비등가적인 부격자를 도입한 'ferrialtermagnetism' 개념을 도입하고 이를 CrSb에서 실현하고자 했습니다.", "result": "3층 구조의 CrSb (110) 박막이 344 meV의 큰 스핀 분할을 가짐을 확인했습니다. 또한, 강유전체(Sc2CO2)와 결합하여 외부 자장/빛/열에 반응하는 고효율 알터마그넷-강유전체 소자를 설계했습니다.", "implication": "페리알터마그네틱(Ferrialtermagnetic) 위상을 통해 대칭성 조절이 가능해짐으로써, 비휘발성 메모리와 광검출기 등 다기능성 spintronics 소자 개발이 가속화될 것입니다.", "novelty": "비등가적인 알터마그넷 부격자를 통해 기존 물질보다 더 안정적인 스핀 분할과 강력한 자기-전기 제어 능력을 구현했다는 점이 핵심입니다.", "unresolved": "제시된 소자 효율(~10^4%)은 이론적 설계치이므로, 실제 실험적 제작 시 계면 결함 등이 성능에 미치는 영향은 아직 미지수입니다.", "future_work": "실제 CrSb/Sc2CO2 이종접합 구조를 제작하여 제시된 자기-전기 제어 성능을 실측하는 실험.", "concepts": [{"term": "Ferrialtermagnetism", "why_emerged": "알터마그넷의 스핀 분할 특성을 더 견고하게 만들기 위해 비대칭적인 부격자를 도입한 개념.", "origin": "초록 정보만으로는 특정하기 어려움 (본 연구에서 제안된 subclass).", "connections": "Altermagnetism, Antiferromagnetism, Neel vector."}, {"term": "Anomalous Hall Effect (AHE)", "why_emerged": "스핀-궤도 결합과 베리 위상에 의해 발생하는 횡방향 전압 현상으로 자성 탐지에 필수적.", "origin": "1881년 Edwin Hall 발견.", "connections": "Berry curvature, Weyl nodes, Topological spintronics."}], "english_summary": ["Proposes ferrialtermagnetism as a robust class of altermagnetic materials.", "Demonstrates 344 meV spin splitting in three-atomic-layer CrSb flakes.", "Designs a CrSb/Sc2CO2 heterostructure device for high-performance multi-field control.", "Achieves large TMR/electroresistance and spin filtering effects for future spintronics."]}}, {"title": "Chiral charge density waves in transition metal dichalcogenide", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2607.10182", "authors": "Ettore Carpene", "last_authors": "Ettore Carpene", "summary": "The emergence of chirality in the charge density wave (CDW) phase of 1$T$-TiSe$_2$ has recently attracted significant attention, yet its microscopic origin remains debated. The prevailing interpretation attributes chirality to a relative phase shift between the charge density components. Here, using density functional theory and symmetry analysis, it is demonstrated that such phase-shifted states entail prohibitive energy costs, rendering them unlikely candidates for the ground state. Instead, a nearly degenerate metastable CDW phase stacking order with monoclinic symmetry is identified, that naturally breaks mirror and inversion symmetries. The CDW in 1$T$-TiSe$_2$ possesses a dual physical nature: the electronic charge redistribution is intrinsically bond-modulated, while the periodic lattice distortion is atom-centered transverse. This spatial separation allows a specific optical coupling mechanism where circularly polarized light breaks the energetic degeneracy between chiral domains. These results reconcile conflicting experimental observations, identifying the \"spontaneous\" chirality observed in local probes as a statistical distribution of CDW phase stacking domains, while establishing the mechanism for macroscopic, light-induced gyrotropic order.", "tier": "B_IMPORTANT_CONDMAT", "score": "9", "reason": "Relevant study on CDW in TiSe2 with symmetry implications for the user's CDW interest.", "tags": ["CDW", "experiment", "electronicstructure"], "image": "https://arxiv.org/html/2607.10182v1/x1.png", "briefing": {"background": "전이금속 디칼코게나이드(TMD) 물질에서 전하 밀도 파(CDW)는 전자-격자 결합으로 인해 발생하는 주기적인 전자 밀도 변조 현상입니다. TiSe2는 CDW 상태에서 관찰되는 카이랄성(chirality)의 기원을 두고 논쟁이 지속되어 왔습니다.", "motivation": "기존의 위상차 기반 이론 모델이 높은 에너지 비용 문제로 인해 실제 바닥 상태로 부적합하다는 점을 지적하며, CDW의 미시적 구조와 카이랄성의 기원을 재해석하고자 했습니다.", "result": "DFT 및 대칭성 해석을 통해 monoclinic 대칭성을 가진 준안정적 CDW 적층 순서가 거울 및 반전 대칭성을 자연스럽게 깬다는 것을 증명했습니다. 관측된 카이랄성은 도메인들의 통계적 분포에 의한 것이며, 광학적 결합을 통해 거시적 제어가 가능함을 보였습니다.", "implication": "CDW 시스템에서 실험적으로 관측된 카이랄성을 도메인 적층의 통계적 결과로 성공적으로 설명함으로써, 그간의 혼란을 해결하고 광학적으로 위상 조절이 가능한 소자 구현 가능성을 열었습니다.", "novelty": "CDW의 전자적 성질(결합 변조)과 격자 왜곡(원자 중심 변위)의 분리된 물리적 특성을 통해 광학적 제어 메커니즘을 제안한 점이 주목할 만하며, 이는 kagome 금속 등 타 CDW 물질의 위상 대칭성 분석에도 중요한 방법론적 틀을 제공합니다.", "unresolved": "실제 실험에서 개별 CDW 도메인의 구조와 분포를 원자 수준에서 완전히 입증하기 위한 고해상도 시공간 분해능 분석이 여전히 필요합니다.", "future_work": "원편광을 이용한 시분해 분광법을 통해 CDW 카이랄 도메인의 동역학을 추적하고, 다양한 2D 물질에서 이러한 광 유도 gyrotropic order를 실현하는 연구가 기대됩니다.", "concepts": [{"term": "Charge Density Wave (CDW)", "why_emerged": "저차원 물질에서 전자-포논 상호작용으로 인해 에너지를 낮추기 위한 전자 밀도의 재배열이 필수적이었기 때문입니다.", "origin": "Peierls(1955)에 의해 이론적 기틀이 마련되었습니다.", "connections": "Kagome 금속의 CDW, 결합 변조, 격자 왜곡 연구와 밀접합니다."}, {"term": "Gyrotropic Order", "why_emerged": "물질의 대칭성이 깨짐에 따라 발생하는 특정 광학적 반응을 설명하기 위해 도입되었습니다.", "origin": "고전적인 광학 및 결정학에서 유래하며, 현대 응집물질물리에서 대칭성 깨짐의 척도로 쓰입니다.", "connections": "카이랄성, 광학 활성, 위상 물성 연구와 연결됩니다."}], "english_summary": ["Analyzed the chiral nature of CDW in 1T-TiSe2 using DFT and symmetry analysis.", "Identified that monoclinic CDW stacking naturally breaks inversion and mirror symmetries, resolving previous energy cost issues.", "Proposed that observed chirality arises from a statistical distribution of stacking domains.", "Demonstrated that light-induced coupling enables control of macroscopic gyrotropic order."]}}, {"title": "Chiral, Electronically Decoupled Layers of 1T'-WS2 Topological Insulator via Neutral-Molecule Intercalation", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2607.10457", "authors": "Jiaze Xie, Fatmag\\\"ul Katmer, Fang Yuan, et al.", "last_authors": "Jennifer Cano, Leslie M. Schoop", "summary": "Monolayer 1T'-WS2 is predicted to be a two-dimensional topological insulator, but its intrinsic electronic properties are masked by strong interlayer coupling in its metallic and superconducting bulk parent phase, 2M-WS2. Isolating monolayers by mechanical exfoliation is also hindered by this coupling, preventing experimental examination of monolayer properties. Here we show that 2M-WS2 undergoes amine intercalation through a simple wet-chemical reaction, yielding superlattices in which the 1T' layers are structurally preserved but electronically decoupled by neutral molecular spacers. Intercalation expands the interlayer spacing from 0.5 to 1-4 nm and reconstructs the stacking while preserving the intralayer 1T' framework. Controlled (de)intercalation reversibly switches the system between a superconducting metal and an insulator with an activation gap matching that of the isolated monolayer. Density functional theory indicates that the electronically decoupled layers retain the nontrivial Z2 topology of the monolayer. Chiral amine intercalation further induces chiroptical activity in WS2 electronic transitions. Overall, the successful intercalation challenges the long-held view that group VIB dichalcogenides are inert toward neutral-molecule intercalation and demonstrates molecular intercalation as a general chemical route for realizing monolayer-like topological-insulator physics and enabling chiral van der Waals superlattices in bulk single crystals.", "tier": "B_IMPORTANT_CONDMAT", "score": "9", "reason": "Experimental realization of electronically decoupled 2D topological insulator 1T'-WS2 via intercalation.", "tags": ["experiment", "topologicalinsulator", "2Dmaterials", "vanderWaals", "DFT"], "image": "https://arxiv.org/static/browse/0.3.4/images/arxiv-logo-fb.png", "briefing": {"background": "TMD 물질들은 벌크 상에서는 층간 결합이 강해 단층 특성을 관찰하기 어렵습니다. 특히 1T'-WS2는 2D 위상 절연체로 예측되나, 벌크에서는 층간 결합에 의한 금속성/초전도성이 위상 특성을 가립니다.", "motivation": "층간 결합을 제거하여 단층의 고유한 위상 물성을 보존하면서도 거시적 시료 형태를 유지할 수 있는 물리적/화학적 방법을 찾고자 했습니다.", "result": "아민 인터칼레이션을 통해 층간 거리를 0.5nm에서 최대 4nm까지 확장하고, 층간 결합을 효과적으로 차단하여 1T'-WS2의 절연체 특성과 위상 비자명성을 회복했습니다.", "implication": "분자 인터칼레이션이 일반적인 TMD의 층간 결합을 제어하여 단층 수준의 물성을 bulk에서 연구할 수 있는 강력한 화학적 도구임을 입증했습니다.", "novelty": "기존에 불가능하다고 여겨졌던 group VIB 디칼코게나이드의 중성 분자 인터칼레이션을 구현했으며, 화학적 제어를 통해 초전도성 금속과 위상 절연체 상태를 가역적으로 전환할 수 있다는 점이 매우 독창적입니다.", "unresolved": "인터칼레이션된 분자가 장기적으로 구조적 안정성을 얼마나 유지하는지와, 고도로 조절된 조건에서의 전자 상관관계 연구가 더 필요합니다.", "future_work": "다양한 유기 분자를 도입하여 층간 결합을 미세 조정함으로써 위상 물성을 설계하는 연구와 저온 ARPES를 통한 밴드 구조 관찰이 이어질 것입니다.", "concepts": [{"term": "Intercalation", "why_emerged": "층상 구조 물질의 층 사이에 원자나 분자를 삽입하여 물성을 화학적으로 변조하기 위해 사용됩니다.", "origin": "그래파이트 인터칼레이션 화합물 연구에서 유래했습니다.", "connections": "초전도성 제어, 2D 물질 층간 결합 제어 연구와 관련됩니다."}, {"term": "Z2 Topological Insulator", "why_emerged": "시간 반전 대칭성이 보존되는 상태에서 밴드 구조의 비자명한 위상적 특성을 분류하기 위해 도입되었습니다.", "origin": "Kane과 Mele(2005)에 의해 그래핀 모델에서 처음 제안되었습니다.", "connections": "스핀-궤도 결합, 에지 상태, 양자 스핀 홀 효과와 연결됩니다."}], "english_summary": ["Realized isolated 1T'-WS2 monolayers within bulk crystals via amine intercalation.", "Decoupled interlayer electronic states while preserving the intrinsic Z2 topology.", "Achieved reversible switching between metallic superconducting and insulating phases.", "Established a versatile chemical route for accessing monolayer-like topological physics."]}}, {"title": "Electric field induced Berry curvature dipole in quasi-one-dimensional Bi4I4", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2607.11188", "authors": "Amiya Mondal, Awadhesh Narayan", "last_authors": "Amiya Mondal, Awadhesh Narayan", "summary": "The nonlinear Hall effect in time-reversal symmetric materials offers a powerful probe into quantum geometry. Here, we investigate the electric-field-tunable nonlinear Hall response in few-layer $\\text{Bi}_4\\text{I}_4$ using comprehensive first-principles calculations across both its $\\alpha$ and $\\beta$ phases. Guided by symmetry analysis, we track the evolution of the Berry curvature dipole (BCD) tensor from the monolayer to the bilayer configuration under an out-of-plane electric field. While the monolayer features a highly rigid band structure and modest BCD tunability, the bilayer architecture exhibits substantial field-induced band modifications, including a progressive Rashba splitting and eventual gap closure in the $\\beta$ phase. Crucially, this field-tunability allows substantial enhancement of the BCD magnitude relative to the monolayer counterpart. Our findings establish quasi-one-dimensional bismuth halogenides as a promising platform for engineering nonlinear Hall response.", "tier": "B_IMPORTANT_CONDMAT", "score": "9", "reason": "Directly addresses Berry curvature dipole and nonlinear Hall in a quasi-1D material relevant to user interests.", "tags": ["material", "Berrycurvature", "quasi-one-dimensional"], "image": "https://arxiv.org/html/2607.11188v1/x1.png", "briefing": {"background": "비선형 홀 효과(Nonlinear Hall effect)는 시간 반전 대칭성이 유지되는 물질에서도 베리 곡률 쌍  the magnetic point group symmetry. The approach to this limit is accompanied by a field-tunable Faraday rotation that grows linearly with the applied field and is bounded from above by a universal maximum set by the nonlinear Tellegen limit -- beyond which the medium becomes electromagnetically unstable. We demonstrate the nonlinear Tellegen limit and the field-space stability phase diagram in two magnetically ordered material systems -- a d-wave altermagnet and an M-type hexagonal ferrite -- showing that the symmetry of the magnetic point group governs both the structure of the nonlinear magnetoelectric tensor and the resulting electromagnetic instability.", "tier": "B_IMPORTANT_CONDMAT", "score": "9", "reason": "Theory of nonlinear magnetoelectric coupling and Tellegen limit in altermagnets with experimental implications.", "tags": ["theory", "altermagnetism", "magnetoelectric"], "image": "https://arxiv.org/html/2607.10584v1/Setup.png", "briefing": {"background": "전자기 매질에서 Tellegen 효과는 전기장과 자기장의 교차 결합을 나타내며, 이는 매질의 전자기적 안정성 한계와 밀접하게 관련되어 있습니다.", "motivation": "비선형 자성-전기적(magnetoelectric) 결합이 존재할 때, 기존의 선형 Tellegen 한계를 넘어서는 새로운 물리적 안정성 범위를 탐구하고자 합니다.", "result": "외부 전기장이나 자기장을 통해 시스템을 전자기적 불안정성으로 유도할 수 있는 '비선형 Tellegen 한계'를 정립했습니다.", "implication": "이 한계는 비선형 자성 매질(알터마그넷 포함)이 가질 수 있는 Faraday 회전각의 최대치를 결정하며, 특정 자기 점군 대칭성에 따라 제어될 수 있습니다.", "novelty": "자성 정렬 물질, 특히 알터마그넷의 대칭성이 비선형 전자기적 응답의 안정성을 지배한다는 이론적 틀을 제시했습니다.", "unresolved": "이러한 전자기적 불안정성이 실제 실험적으로 어떤 형태의 상전이나 파괴 현상으로 나타나는지는 명확하지 않습니다.", "future_work": "알터마그넷 및 페라이트 물질에서 외부 자기장 제어를 통한 비선형 Faraday 효과 실험 관측.", "concepts": [{"term": "Tellegen 한계", "why_emerged": "자성-전기적 결합 매질의 전자기적 안정성 경계를 정의하기 위해 필요함.", "origin": "Tellegen (1948)에 의해 제안된 자이레이터 개념과 연결됨.", "connections": "자성-전기적 결합, 전자기학."}, {"term": "알터마그넷 (Altermagnet)", "why_emerged": "기존 강자성/반강자성의 틀을 벗어난 새로운 자기 질서(Spin-split band)를 기술하기 위해 필요함.", "origin": "최근 5년 이내 이론 물리학자들에 의해 급부상함.", "connections": "비상반성, 스핀 분리."}], "english_summary": ["Defines a field-tunable nonlinear Tellegen limit in magnetoelectric media.", "Identifies that the limit is constrained by magnetic point group symmetry.", "Predicts a maximum Faraday rotation bounded by the nonlinear Tellegen limit.", "Demonstrates the stability phase diagram for d-wave altermagnets and ferrites."]}}, {"title": "Superconducting dome and field-enhanced superconductivity of PLD synthesized Nd1-xEuxNiO2 thin films", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2607.10332", "authors": "Wenlong Yang, Qiang Zhao, Xingke Fu, et al.", "last_authors": "Pengtao Yang, Jinguang Cheng", "summary": "We report on the synthesis of infinite-layer Nd1-xEuxNiO2 (0<0.7) thin films using pulsed laser deposition (PLD) followed by topotactic reduction with CaH2. Resistivity measurements on these films reveal a superconducting dome within the doping range 0.2<0.5, which is wider than that achieved by molecular beam epitaxy and comparable to that obtained by chemical synthesis. The x=0.3 PLD film exhibits the optimal superconducting transition temperature Tc~31 K, much higher than those grown by other vacuum epitaxial techniques. This result indicates that PLD is an ideal approach for fabricating high-quality, high-Tc Nd1-xEuxNiO2 superconducting films. Magneto-transport measurements reveal robust field-enhanced and re-entrant superconductivity in both underdoped and overdoped regimes. At low temperatures just above the onset Tc, the Hall resistance exhibits nonlinear behavior, which may originate from magnetic impurity scattering. These results highlight the crucial role of magnetic rare-earth Eu2+ ions in producing the exotic physical properties of the infinite-layer nickelates.", "tier": "B_IMPORTANT_CONDMAT", "score": "9", "reason": "Experimental study of superconductivity and transport in infinite-layer nickelates.", "tags": ["experiment", "superconductivity", "nickelates", "transport"], "image": "https://arxiv.org/static/browse/0.3.4/images/arxiv-logo-fb doi/10.1103/vy8x-q3l6", "authors": "Shubhankar Paul, Atsutoshi Ikeda, Hisakazu Matsuki, et al.", "last_authors": "Shingo Yonezawa, Yoshiteru Maeno", "summary": "The magnetic nature of the altermagnet candidate ${\\mathrm{RuO}}_{2}$ remains under debate. It has been recently shown from quantum oscillations and angle-resolved photoemission spectroscopy that the high-quality ${\\mathrm{RuO}}_{2}$ bulk single crystal is a paramagnetic metal. Here we report the sp…", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Direct experimental ARPES/spectroscopic investigation of the altermagnet candidate RuO2.", "tags": ["ARPES", "altermagnet", "electronicstructure"], "image": "", "briefing": {"background": "RuO2는 최근 '알터마그네틱(altermagnetic)' 후보 물질로 주목받고 있으나, 그 자기적 성질에 대해 강자성 vs 상자성 논란이 지속되고 있습니다.", "motivation": "고품질 단결정 RuO2 시료의 온도 의존적 자기 감수성을 측정하여 페르미 액체 행동 및 알터마그네틱 특성을 재검증하고자 합니다.", "result": "고품질 단결정 시료에서 페르미 액체 행동을 관찰하였으며, 이전의 알터마그네틱 논란에 대한 정밀 데이터를 제시합니다.", "implication": "RuO2의 기본 전자 상태를 확립함으로써, 알터마그네틱 후보로서의 적합성 및 위상적 특성에 대한 향후 논의의 기준점을 제공합니다.", "novelty": "고품질 시료를 통해 기존 실험 결과와의 차이를 분석하여, 알터마그네틱 논쟁을 정밀 실험적으로 해결하려는 시도입니다.", "unresolved": "ARPES 결과가 알터마그네틱 상으로 해석될 수 있는지에 대한 물리적 해석의 여지는 여전히 존재합니다.", "future_work": "CD-ARPES 또는 스핀 분해 ARPES를 통한 자성 밴드 분리 여부의 직접적인 관측이 필수적입니다.", "concepts": [{"term": "알터마그네틱", "why_emerged": "강자성도 반강자성도 아닌, 대칭성 기반의 스핀 분리(spin splitting)를 가진 새로운 자기 상태를 분류하기 위해 도입되었습니다.", "origin": "Šmejkal, Jungwirth 등에 의해 최근 주목받았습니다.", "connections": "반강자성, 비통상적 홀 효과, 스핀트로닉스."}, {"term": "페르미 액체", "why_emerged": "상호작용하는 전자의 기체를 준입자 개념으로 설명하기 위해 필요합니다.", "origin": "Landau (1956).", "connections": "강상관 전자계, 비페르미 액체, 전도성."}], "english_summary": ["Reports on Fermi-liquid behavior in high-quality RuO2 single crystals.", "Addresses the ongoing debate regarding the altermagnetic nature of RuO2.", "Provides precise temperature-dependent magnetic susceptibility data.", "Sets a benchmark for characterizing candidate altermagnetic materials via electronic structure studies."]}}, {"title": "High-throughput discovery and strain engineering of altermagnetic monolayers", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/821z-nv3s", "authors": "Wen-Ti Guo, Junqi Xu, Xinqi Liu, Huaiqiang Wang, Jianzhou Zhao, Haijun Zhang", "last_authors": "Jianzhou Zhao, Haijun Zhang", "summary": "As a newly classified magnetic phase, altermagnetism integrates characteristics of conventional antiferromagnetism and ferromagnetism, exhibiting zero net magnetization and anisotropic spin-splitting. Two-dimensional altermagnets, in particular, offer significant potential for spintronic transport a…", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "High-throughput identification of new altermagnetic monolayers with significant spintronic and transport potential.", "tags": ["method", "altermagnet", "2Dmaterials"], "image": "", "briefing": {"background": "알터마그네틱(Altermagnetism)은 강자성체의 비등방성 스핀 분할과 반강자성체의 순 자화값 0이라는 특성을 동시에 갖는 새로운 자기 질서 상태입니다. 이는 차세대 스핀트로닉스 소자 개발의 핵심 후보군으로 주목받고 있습니다.", "motivation": "단층(monolayer) 2D 소재에서 알터마그네틱 특성을 효율적으로 탐색하고, 외부 변형(strain)을 통해 이러한 물리적 성질을 제어할 수 있는 가능성을 입증하고자 합니다.", "result": "고효율 계산 기법(high-throughput)을 사용하여 알터마그네틱 특성을 가진 단층 소재군을 대거 발굴하였으며, 변형률에 따른 스핀 분할 및 전자 구조 변화를 체계적으로 분석했습니다.", "implication": "알터마그네틱 소재를 활용한 비휘발성 메모리나 스핀 전류 제어 소자의 설계 가능성을 크게 높였으며, 2D van der Waals 이질 구조와의 결합 연구의 발판이 될 수 있습니다.", "novelty": "기존 반강자성체와 차별화되는 고유한 스핀 분할 기하학적 구조를 2D 시스템에서 입증하고, 스트레인을 통한 물성 튜닝 모델을 제시했다는 점에서 독창적입니다.", "unresolved": "실제 실험적 합성을 통한 단층 소재의 알터마그네틱 상태 검증 및 외부 전압/전류에 의한 실제 스핀 제어 성능은 아직 확인되지 않았습니다.", "future_work": "발굴된 소재의 실험적 합성 및 ARPES를 이용한 스핀 분할 측정, 그리고 실제 소자 구현을 통한 스핀 전류 생성 효율 확인이 필요합니다.", "concepts": [{"term": "Altermagnetism", "why_emerged": "강자성체와 반강자성체라는 기존 분류를 넘어, 비등방성 스핀 분할을 보이면서도 외부 자기장 영향을 덜 받는 물질군을 정의하기 위해 필요했습니다.", "origin": "최근 수년 내 이론적 체계가 정립되었으며 (예: Šmejkal et al.), 초록 정보만으로는 특정하기 어려움", "connections": "반강자성 스핀트로닉스, 베리 곡률, 비등방성 자기 저항 효과."}, {"term": "High-throughput screening", "why_emerged": "수많은 후보 물질 중 유망한 물성을 가진 소재를 효율적으로 필터링하기 위해 필수적입니다.", "origin": "재료 과학의 전산화(Materials Informatics)와 함께 발전했습니다.", "connections": "DFT 계산, 머신러닝 기반 물성 예측."}], "english_summary": ["Identifies new 2D altermagnetic monolayer candidates using high-throughput DFT calculations.", "Demonstrates that strain engineering effectively modulates spin-splitting properties in these materials.", "Provides a foundation for designing novel spin-orbit torque and spintronic devices.", "Highlights the potential for manipulating spin states in reduced dimensions."]}}, {"title": "Low-temperature anomaly and anisotropy of critical magnetic fields in transition metal dichalcogenide superconductors", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/y9k6-221l", "authors": "Tomoya Sano, Kota Tabata, Akihiro Sasaki, Yasuhiro Asano", "last_authors": "Akihiro Sasaki, Yasuhiro Asano", "summary": "We clarify why spin-singlet superconductivity persists in monolayer transition-metal dichalcogenides even in high magnetic fields beyond the Pauli limit. The phenomenon called Ising protection is caused by two magnetically active potentials: a Zeeman field and an Ising spin-orbit interaction. These …", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Superconductivity in TMDCs; highly relevant to the broader condensed matter context.", "tags": ["superconductor", "TMDC", "magnetism"], "image": "", "briefing": {"background": "전이금속 디칼코게나이드(TMDC)는 강력한 스핀-궤도 결합(SOC)을 가지고 있어, 초전도 상태에서 자기장 하의 거동이 매우 독특합니다. 특히 상부 임계 자기장(Hc2)이 파울리 제한(Pauli limit)을 넘어설 수 있는지에 대한 연구는 중요한 주제입니다.", "motivation": "단층 TMDC 초전도체에서 자기장 인가 시 싱글렛(spin-singlet) 초전도 상태가 깨지지 않고 유지되는 'Ising 보호' 메커니즘을 상세히 규명하고자 합니다.", "result": "제만(Zeeman) 에너지와 이징(Ising) SOC가 상호작용하여 스핀-싱글렛 초전도를 자기장으로부터 어떻게 보호하는지 물리적 기전을 명확히 규명했습니다.", "implication": "강한 자기장 하에서도 초전도성을 유지하는 소재의 설계 원리를 제공하며, 위상 초전도체 연구나 스핀-궤도 물성 응용에 이론적 토대를 제공합니다.", "novelty": "일반적인 초전도체와 다른 TMDC 특유의 이징 타입 보호 메커니즘을 엄밀하게 해석하여 고자기장 하의 거동을 예측했습니다.", "unresolved": "실제 다양한 TMDC 화합물에서의 물질 의존적 편차와 도핑에 따른 변화가 전적으로 설명되지는 않았습니다.", "future_work": "고자기장 환경에서의 정밀한 수송 측정 및 밴드 구조 관측(CD-ARPES 등)을 통한 상태 검증이 요구됩니다.", "concepts": [{"term": "Ising protection", "why_emerged": "강력한 이징 스핀-궤도 결합이 전자 스핀을 면 외 방향으로 고정하여 외부 자기장에 의한 쌍 깨짐(pair-breaking)을 억제하는 효과를 설명하기 위해 도입되었습니다.", "origin": "Lu et al., Science (2015) 등에서 실험적으로 본격 제기됨", "connections": "스핀-궤도 결합, 상부 임계 자기장, 파울리 제한."}, {"term": "Spin-singlet superconductivity", "why_emerged": "쿠퍼 쌍을 이루는 두 전자의 스핀 상태가 반평행(S=0)인 초전도 상태를 구별하기 위해 필요합니다.", "origin": "BCS 이론(Bardeen, Cooper, Schrieffer, 1957)", "connections": "스핀-트리플렛 초전도, 위상 초전도."}], "english_summary": ["Investigates the resilience of spin-singlet superconductivity in monolayer TMDCs under high magnetic fields.", "Explains how the combination of Zeeman field and Ising SOC generates 'Ising protection'.", "Clarifies the mechanism preventing spin-singlet pairing from destruction by Pauli limiting effects.", "Provides theoretical insight into magnetic field anisotropy in low-dimensional superconductors."]}}, {"title": "Low-temperature spin dynamics and absence of magnetic order in layered α−RuI3", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/kxbj-gp8z", "authors": "Hank C. H. Wu, Benjamin M. Huddart, Francis L. Pratt, Danrui Ni, Robert J. Cava, Stephen J. Blundell", "last_authors": "Robert J. Cava, Stephen J. Blundell", "summary": "Quantum spin liquids are long-sought for their elusive, never-frozen magnetic states. In layered α -RuI 3 , magnetic Ru ions form a honeycomb network related to the Kitaev material α -RuCl 3 , yet muon spin relaxation reveals a strikingly different low-temperature behaviour. The authors show here that the spins remain dynamically fluctuating down to 50 mK and find evidence for 2D spin diffusion, supporting the view that α -RuI 3 is a promising candidate for hosting a quantum spin liquid state.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Experimental study of layered RuI3 as a quantum spin liquid candidate using muon spin relaxation.", "tags": ["experiment", "material", "spin-liquid"], "image": "", "briefing": {"background": "양자 스핀 액체(QSL)는 절대 영도에서도 자기적 질서가 얼지 않고 요동치는 상태로, 고온 초전도 및 위상 양자 컴퓨터와 관련된 물리학적 중요성 때문에 활발히 연구되고 있습니다.", "motivation": "벌집 격자 구조를 가진 α-RuI3가 Kitaev 물질(α-RuCl3)과 유사함에도 불구하고 실제 자기적 거동이 어떻게 다른지 확인하고자 합니다.", "result": "뮤온 스핀 완화(μSR) 측정 결과, 50mK까지 정적인 자기 질서가 나타나지 않고 스핀이 역동적으로 요동하며 2D 스핀 확산 특성을 보임을 확인했습니다.", "implication": "α-RuI3가 Kitaev 물리와 관련된 양자 스핀 액체 후보 물질로서 매우 유망함을 제시하며, 관련 소재군의 새로운 연구 방향을 제시합니다.", "novelty": "기존 자기 정렬이 나타나는 다른 루테늄 기반 물질들과 대조적으로, 극저온까지 비정렬 상태를 유지함을 밝혀 QSL 가능성을 입증했습니다.", "unresolved": "이 요동이 진정한 의미의 양자 스핀 액체인지, 혹은 단순히 기하학적 좌절이나 불순물에 의한 것인지에 대한 확답은 아직 부족합니다.", "future_work": "비탄성 중성자 산란을 통한 동적 구조 인자 측정 및 저온 열전도도 측정을 통한 중성 페르미온 거동 확인이 필요합니다.", "concepts": [{"term": "Quantum Spin Liquid (QSL)", "why_emerged": "강한 자기적 상호작용에도 불구하고 양자 요동으로 인해 절대 영도에서 자기적 정렬을 이루지 못하는 상태를 기술하기 위해 도입되었습니다.", "origin": "Philip Anderson (1973)", "connections": "Kitaev 모델, 기하학적 좌절, 얽힘(Entanglement)."}, {"term": "Muon spin relaxation (μSR)", "why_emerged": "물질 내부의 국소적인 자기장을 매우 민감하게 탐지하여 스핀 동역학을 분석하기 위해 개발된 실험 기법입니다.", "origin": "원자핵 물리 기법을 고체 물리학에 응용", "connections": "자기적 위상 전이, 스핀 요동."}], "english_summary": ["Reports that α-RuI3 exhibits dynamic spin fluctuations down to 50 mK without magnetic ordering.", "Uses muon spin relaxation (μSR) to observe 2D spin diffusion signatures.", "Positions α-RuI3 as a new candidate for quantum spin liquid research, distinct from α-RuCl3.", "Suggests that honeycomb Ru-based layers are prime systems for exploring frustrated magnetism."]}}, {"title": "Mott-Anderson crossover without metallization in pressurized Sr3Ir2O7", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/5kp6-41fr", "authors": "Xia Yin, Weicheng Guo, Miao Li, et al.", "last_authors": "Ho-kwang Mao, Yang Ding", "summary": "Here, the authors use high-pressure transport, low-temperature magnetoresistance, x-ray diffraction and transmission electron microscopy to show that Sr 3 Ir 2 O 7 evolves, without metallization, from a Mott regime dominated by electronic correlations to an Anderson-like localized regime dominated by disorder. Pressure collapses the activation gap near 12–17 GPa, yet low-temperature conduction remains nonmetallic and follows three-dimensional variable-range hopping, highlighting how localization can preempt metallization in bandwidth-tuned correlated materials.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Experimental transport and diffraction study on a bilayer iridate exploring correlations and localization.", "tags": ["experiment", "material", "correlated-electrons"], "image": "", "briefing": {"background": "강한 전자 상관관계(electron correlation)를 가진 물질에서 압력을 가하면 밴드폭이 넓어져 Mott 절연체에서 금속으로 전이할 것으로 기대되지만, 실제 물질에서는 무질서(disorder) 효과와 경쟁하며 복잡한 양상을 보입니다.", "motivation": "이중층 이리데이트 Sr3Ir2O7 시스템에서 압력이 전자 상태에 미치는 영향을 규명하여 Mott 절연체에서 금속으로의 전이 과정에 개입하는 무질서의 역할을 이해하고자 합니다.", "result": "압력을 가함에 따라 활성 에너지 갭은 12-17 GPa 부근에서 사라지지만, 물질이 금속 상태가 되지 않고 Anderson 국소화된 절연체(3D 가변 거리 호핑 전도) 상태로 전이함을 관측했습니다.", "implication": "상관관계가 강한 물질에서 대역폭을 조절하더라도 반드시 금속화가 발생하는 것은 아니며, 국소화(localization) 현상이 금속화에 앞서 지배적인 역할을 할 수 있음을 보여줍니다.", "novelty": "이리데이트에서 전자 상관관계와 무질서 사이의 경쟁을 Mott-Anderson 교차라는 프레임워크로 명확히 분석한 실험 연구입니다.", "unresolved": "이러한 국소화 현상이 발생하는 미세한 무질서의 기원과 결정 구조적 변화와의 구체적인 상관관계는 추가 연구가 필요합니다.", "future_work": "저온 환경에서의 국소적 전도도 매핑이나 더 정밀한 구조 해석을 통해 국소화의 원인을 규명할 필요가 있습니다.", "concepts": [{"term": "Mott-Anderson Crossover", "why_emerged": "상관관계에 의한 Mott 절연체와 무질서에 의한 Anderson 절연체 사이의 전이를 설명하기 위해 필요함.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "Hubbard 모델, Anderson 국소화 이론."}, {"term": "Variable-Range Hopping (VRH)", "why_emerged": "국소화된 상태에서 전자들이 열 에너지를 이용해 전도되는 방식을 설명하기 위해 제안됨.", "origin": "Nevill Mott(1968).", "connections": "Anderson 국소화, Mott-Hubbard 절연체."}], "english_summary": ["Sr3Ir2O7 exhibits a transition from Mott to Anderson-localized regime under pressure.", "The system bypasses the metallic state despite the closing of the activation gap at 12–17 GPa.", "Transport data follows 3D variable-range hopping indicating disorder dominance over metallization.", "Highlighting the role of localization in bandwidth-tuned correlated electronic systems."]}}, {"title": "Orbital-selective electron correlations in high-Tc bilayer nickelates: From a global phase diagram to implications for spectroscopy", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/7bhn-63xh", "authors": "Zhiguang Liao, Yiming Wang, Lei Chen, Guijing Duan, Rong Yu, Qimiao Si", "last_authors": "Rong Yu, Qimiao Si", "summary": "Motivated by the high-temperature superconductivity observed in the bilayer nickelate ${\\mathrm{La}}_{3}{\\mathrm{Ni}}_{2}{\\mathrm{O}}_{7}$ and the spectroscopic evidences of strong electron correlations in this compound, we address the role of its multiorbital electron correlations by proposing a gl…", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Addresses correlations in bilayer nickelates with specific relevance to spectroscopic observations and electronic structure.", "tags": ["theory", "material", "superconductivity"], "image": "", "briefing": {"background": "최근 발견된 고온 초전도체 La3Ni2O7은 다중 궤도(multiorbital) 특성을 가지고 있으며, 강한 전자 상관관계가 초전도성 기전에 핵심적인 역할을 할 것으로 추측됩니다.", "motivation": "La3Ni2O7의 다중 궤도 전자 상관관계를 분석하여 이 물질의 위상 도표(phase diagram)를 구성하고, 향후 분광학 실험 결과와 비교 가능한 물리적 해석을 제공하고자 합니다.", "result": "궤도 선택적(orbital-selective) 전자 상관관계가 중요하게 작용하며, 시스템의 위상 도표에서 물리적 특성을 결정짓는 궤도별 차등적 기여를 정립했습니다.", "implication": "니켈산염 초전도체에서 관측되는 분광학적 데이터와 초전도 기전을 이해하는 이론적 토대를 제공하며, 향후 ARPES 등의 실험 결과 해석에 활용될 수 있습니다.", "novelty": "니켈산염의 다중 궤도 특성을 고려하여 궤도 선택적 상관관계를 중심으로 논리적인 위상 도표를 제안했습니다.", "unresolved": "이 이론적 모델이 실험적으로 확인된 페르미 표면 구조와 얼마나 정확히 일치하는지에 대한 미세 조율이 필요합니다.", "future_work": "구체적인 궤도별 분광학적 신호를 예측하고, 초전도 질서 변수와 궤도 결합의 관계를 탐구할 예정입니다.", "concepts": [{"term": "Orbital-selective correlation", "why_emerged": "다중 궤도 물질에서 궤도마다 상관관계 강도가 다를 경우 발생하는 물리 현상을 설명하기 위해 필요함.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "Hund's coupling, multiorbital Hubbard model."}, {"term": "Bilayer Nickelates", "why_emerged": "고온 초전도 특성을 나타내는 새로운 물질군으로서의 중요성 때문에 부각됨.", "origin": "최근 La3Ni2O7 발견과 관련.", "connections": "Cuprate 초전도체, 페로브스카이트 산화물."}], "english_summary": ["Analyzes orbital-selective electron correlations in La3Ni2O7 bilayer nickelates.", "Constructs a global phase diagram to explain the role of multiorbital interactions.", "Provides theoretical framework relevant for interpreting spectroscopic findings in nickelates.", "Addresses the nature of electron correlations driving high-Tc superconductivity."]}}, {"title": "Pressure-induced structural transitions and dome-shaped superconductivity in the topological insulator PbBi6Te10", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/rgb8-bsw1", "authors": "JunYing Hu, GuangYang Dai, Liang Ma, JingKai Bi, JianYong Chen, ZhiWei Men", "last_authors": "JianYong Chen, ZhiWei Men", "summary": "Topological insulators (TIs) constitute a unique class of quantum materials owing to their topology-protected electron states. While pressure is an effective way to induce superconductivity in TIs, superconductivity often appears after phase transition or structural disorder. Therefore, identifying …", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Pressure-induced superconductivity and structural transitions in the topological insulator PbBi6Te10.", "tags": ["material", "superconductivity", "topologicalinsulator"], "image": "", "briefing": {"background": "위상 절연체(TI)는 표면 상태의 위상적 보호 특성으로 잘 알려져 있으며, 압력을 통한 구조 변형으로 새로운 양자 상태를 유도하는 연구가 활발합니다.", "motivation": "위상 절연체 PbBi6Te10에 압력을 가했을 때 나타나는 구조적 전이와 초전도성 발현 사이의 상관관계를 체계적으로 조사하고자 합니다.", "result": "압력 증가에 따라 돔(dome) 형태의 초전도 구간을 발견하였으며, 이는 구조적 전이와 밀접한 연관이 있음을 확인했습니다.", "implication": "위상 절연체 기반 초전도체에서 구조 전이와 초전도 사이의 상호작용을 이해함으로써 위상 초전도성 구현의 가능성을 탐색할 수 있습니다.", "novelty": "PbBi6Te10이라는 특정 위상 절연체 화합물에서 압력에 따른 물리적 위상의 변화를 체계적으로 데이터화했습니다.", "unresolved": "초전도 위상에서의 표면 상태가 여전히 위상학적으로 보호되는지, 혹은 벌크 초전도와의 경쟁은 어떤 양상인지 불명확합니다.", "future_work": "고압 하에서의 ARPES 또는 수송 측정을 통해 초전도 상태와 위상적 성질의 공존 여부를 확인할 필요가 있습니다.", "concepts": [{"term": "Pressure-induced superconductivity", "why_emerged": "물질의 격자 상수를 변화시켜 전자 결합 상태를 인위적으로 제어하기 위해 필요함.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "BCS 이론, 위상 절연체."}, {"term": "Topological Insulator (TI)", "why_emerged": "내부는 절연체이나 표면은 전도성을 띠는 위상적으로 보호된 물질의 필요성 때문임.", "origin": "Hasan & Kane (2010).", "connections": "양자 홀 효과, 위상 초전도체."}], "english_summary": ["Investigation of PbBi6Te10 under pressure reveals structural transitions and dome-shaped superconductivity.", "The study maps the pressure-dependent phase diagram of this topological insulator.", "Links structural evolution to the emergence of the superconducting phase.", "Provides insights into controlling topological properties through lattice engineering."]}}, {"title": "Strain-tunable optical responses and topological phase transitions in the two-dimensional altermagnet VO", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/kxy4-93kc", "authors": "Meijun Wang, Ying Liu, Yefeng Li, et al.", "last_authors": "Guodong Liu, Xiaoming Zhang", "summary": "Two-dimensional altermagnets (AMs) with tunable electronic and topological properties offer promising opportunities for next-generation spintronic and optoelectronic applications. Here, we predict that monolayer VO (ML-VO) is a two-dimensional AM semiconductor with collinear magnetic ordering and $d…", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Prediction of strain-tunable altermagnetism and topological transitions in monolayer VO.", "tags": ["material", "altermagnet", "topological"], "image": "", "briefing": {"background": "알터마그넷(Altermagnet)은 비자성체와 강자성체의 특성을 동시에 갖는 물질군으로, 시간 반전 대칭성은 깨져 있지만 단위 셀 내의 스핀 보상으로 인해 알짜 자화가 없는 새로운 자기 정렬 상태를 의미합니다.", "motivation": "단층 VO(모노레이어 VO)라는 2차원 물질에서 변형(strain)을 통해 자기적, 위상적 특성을 정밀하게 제어할 수 있는 가능성을 탐구하고자 합니다.", "result": "단층 VO가 콜리니어 자기 정렬을 가진 2차원 알터마그넷 반도체임을 확인하였으며, 변형률을 조정함으로써 위상적 상전이를 유도할 수 있음을 이론적으로 예측했습니다.", "implication": "스핀트로닉스 및 광전자 소자 구현을 위한 소재로서, 외부 자극(변형)을 통한 전자 구조 및 위상 특성의 능동적 제어가 가능함을 시사합니다.", "novelty": "기존 강자성체와 달리 알터마그넷의 특성을 가지면서도 2차원 층상 구조라는 점에서 차세대 저전력 스핀트로닉 소자 설계에 중요한 기초 데이터를 제공합니다.", "unresolved": "실제 실험적 합성을 통한 단층 VO의 물성 검증 및 상온 안정성에 대한 정보는 여전히 부족합니다.", "future_work": "실제 단층 VO 시료 제작을 통한 ARPES 기반의 전자 구조 측정 및 변형 인가에 따른 수송 특성 변화 관측이 필요합니다.", "concepts": [{"term": "Altermagnetism", "why_emerged": "기존 강자성체와 반강자성체의 장점(큰 스핀 분할과 낮은 표유 자계)을 결합하기 위해 제안되었습니다.", "origin": "초록 정보만으로는 특정하기 어려움 (최근 이론 물리학에서 급부상한 개념).", "connections": "반강자성체, 스핀 분할, 시간 반전 대칭성 파괴."}, {"term": "Strain-tunable", "why_emerged": "격자 구조의 변형이 밴드 구조와 위상적 성질을 효과적으로 제어하는 강력한 수단이기 때문입니다.", "origin": "일반적인 고체물리학 및 재료공학적 원리.", "connections": "위상적 상전이, 밴드 엔지니어링, 스트레인 트로닉스."}], "english_summary": ["Monolayer VO is predicted to be a 2D altermagnetic semiconductor.", "The electronic and topological phases are highly tunable via mechanical strain.", "This material holds potential for next-generation spin-optoelectronic applications.", "Theoretical framework supports collinear magnetic ordering with no net magnetization."]}}, {"title": "Stripe spin-density wave and chiral superconductivity in tWSe2", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/52m9-nm8v", "authors": "Erekle Jmukhadze, Sam Olin, Allan H. MacDonald, Wei-Cheng Lee", "last_authors": "Allan H. MacDonald, Wei-Cheng Lee", "summary": "The layer-dependent Hamiltonians of parallel-stacked ${\\mathrm{MoTe}}_{2}$ and ${\\mathrm{WSe}}_{2}$ homobilayer moiré materials are topologically nontrivial, both in real space and in momentum space, and have been shown to support integer and fractional quantum anomalous Hall states, as well as anti…", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Moiré superlattices and exotic superconductivity; highly relevant class of materials.", "tags": ["moiré", "superconductor", "topological"], "image": "", "briefing": {"background": "모아레 격자는 서로 다른 층상 물질을 겹쳤을 때 발생하는 주기적 패턴으로, 강한 상관관계에 의한 평탄 밴드를 형성하여 이국적인 양자 상태를 연구하는 주된 플랫폼입니다.", "motivation": "tWSe2(트위스티드 이셀레늄화 텅스텐) 시스템에서 관찰되는 스핀 밀도 파동(SDW)과 초전도 현상의 물리적 기원을 명확히 규명하고자 합니다.", "result": "tWSe2의 층간 결합을 고려한 해밀토니안 분석을 통해, 이 시스템이 위상적으로 자명하지 않은 특성을 가지며 카이랄 초전도성과 줄무늬 스핀 밀도 파동이 공존할 수 있음을 보였습니다.", "implication": "모아레 초격자에서 나타나는 위상적 양자 홀 상태와 초전도성의 밀접한 상관관계를 이해하고, 이를 통해 새로운 위상 초전도체 후보군을 확보할 수 있습니다.", "novelty": "tWSe2에서의 카이랄 초전도성과 스핀 밀도 파동의 공존은 강상관 전자계와 위상 물리학을 연결하는 중요한 발견입니다.", "unresolved": "이론적인 예측이 실제 실험에서 관측되는 초전도 특성의 기작을 완벽히 설명하는지, 특히 도핑 영역별 상세한 위상 변화는 추가 연구가 필요합니다.", "future_work": "저온 STM/STS를 통한 국소 상태 밀도 측정과 스핀 감응형 수송 특성 실험을 통해 이론적 예측을 검증해야 합니다.", "concepts": [{"term": "Moiré Superlattice", "why_emerged": "반데르발스 층상 물질을 특정 각도로 적층하여 전자 구조를 극적으로 변화시키기 위해 사용됩니다.", "origin": "Bistritzer와 MacDonald에 의해 2011년 Twisted Bilayer Graphene에서 이론적 기반이 확립되었습니다.", "connections": "평탄 밴드, 강력한 전자 상관관계, 위상적 양자 현상."}, {"term": "Chiral Superconductivity", "why_emerged": "시간 반전 대칭성이 깨진 초전도 상태를 설명하기 위해 도입되었습니다.", "origin": "초록 정보만으로는 특정하기 어려움 (전통적인 p-wave 등에서 확장된 개념).", "connections": "위상 초전도체, 마요라나 페르미온, 스핀-궤도 결합."}], "english_summary": ["tWSe2 homobilayer moiré systems exhibit topological non-triviality.", "The study identifies the coexistence of stripe spin-density wave and chiral superconductivity.", "The moiré Hamiltonian provides a basis for understanding fractional quantum anomalous Hall states.", "Insights into the interplay between topological band structure and strong correlation effects."]}}, {"title": "Tunable topology, Hall response, and spin textures in bicircularly polarized light illuminated altermagnets", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/6jv2-nmnn", "authors": "Maitri Ganguli, Aneek Jana, Awadhesh Narayan", "last_authors": "Aneek Jana, Awadhesh Narayan", "summary": "Altermagnets, featuring nonrelativistic spin splitting, have drawn enormous attention due to their intriguing properties. Here, we investigate the effects of shining bicircularly polarized light (BCL) on altermagnets with Rashba spin-orbit coupling. We discover a remarkable tunability of topology, s…", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Direct relevance to altermagnets and Berry curvature/topological aspects of magnetism.", "tags": ["altermagnet", "topology", "magnetism"], "image": "", "briefing": {"background": "알터마그넷은 비상대론적 스핀 분할을 가지고 있어, 이를 광학적으로 제어하여 새로운 위상적 특성을 유도하는 것은 차세대 밸리트로닉스 및 스핀트로닉스 분야의 핵심 과제입니다.", "motivation": "원편광의 합인 bicircularly polarized light (BCL)를 알터마그넷에 조사했을 때, 스핀-궤도 결합과 상호작용하여 전자 구조와 위상적 특성이 어떻게 변화하는지 규명하고자 합니다.", "result": "BCL 조사를 통해 알터마그넷의 토폴로지, 스핀 텍스처, 그리고 비정상 홀 응답(Anomalous Hall response)을 능동적으로 제어할 수 있음을 증명했습니다.", "implication": "플로케 공학(Floquet engineering)과 알터마그넷을 결합하여 외부 빛만으로 물질의 위상적 물성을 실시간으로 스위칭할 수 있는 기반을 마련했습니다.", "novelty": "알터마그넷의 독특한 스핀 분할 구조를 빛으로 변조하는 기법을 제시했으며, 이는 비정상 홀 효과와 같은 수송 현상의 광학적 조절 가능성을 열어줍니다.", "unresolved": "실제 실험적으로 광학적 펄스와 알터마그넷의 전자 구조 간의 상호작용 시간을 초고속으로 측정하는 데는 기술적 한계가 있습니다.", "future_work": "시간 분해 ARPES(tr-ARPES)를 이용해 빛 조사 직후의 전자 밴드 구조 변화와 베리 곡률(Berry curvature) 재분배 과정을 직접 관측하는 실험이 필요합니다.", "concepts": [{"term": "Bicircularly Polarized Light", "why_emerged": "서로 다른 주파수의 두 원편광을 합성하여 고차 조화파 생성 및 시간 반전 대칭성을 제어하기 위해 사용됩니다.", "origin": "초록 정보만으로는 특정하기 어려움 (비선형 광학 연구에서 발전).", "connections": "Floquet 공학, 광학적 밴드 제어, 위상적 상태 스위칭."}, {"term": "Berry Curvature", "why_emerged": "블로흐 파동함수의 기하학적 위상 정보를 기술하고 비정상 홀 효과 등의 이상 현상을 설명하기 위해 도입되었습니다.", "origin": "Berry(1984년)에 의해 기하학적 위상으로 정립되었습니다.", "connections": "비정상 홀 효과, 위상적 불변량, 궤도 자기 모멘트."}], "english_summary": ["Bicircularly polarized light (BCL) serves as a tool to control altermagnetic properties.", "The study demonstrates tunable topology, spin textures, and Hall responses.", "Rashba spin-orbit coupling plays a crucial role in light-induced electronic modifications.", "This approach enables dynamic Floquet-based control of topological phases in altermagnets."]}}, {"title": "Chemical Symmetry Breaking Enables Interconversion between Altermagnetic and Compensated Ferrimagnetic States", "journal": "PRL_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/bd1f-jdvh", "authors": "Bo Zhao, Qinxi Liu, Qiuping Yang, et al.", "last_authors": "Feng Liu, Xue Jiang", "summary": "Altermagnetism and fully compensated ferrimagnetism are distinct classes of zero-net-magnetization order that combine antiferromagnetic compensation with ferromagneticlike spin splitting. In altermagnets, spin splitting arises from crystal symmetry and alternates in momentum space, whereas in compen…", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Relevant theory for altermagnetism and momentum-space spin splitting, a key interest.", "tags": ["theory", "altermagnetism", "electronic-structure"], "image": "", "briefing": {"background": "자성체 연구에서 순 자화값이 0인 반강자성체는 스핀 분할이 없다고 여겨져 왔으나, 최근 스핀 궤도 결합 없이도 대칭성에 의해 운동량 공간에서 스핀 분할이 일어나는 알터자성(Altermagnetism)의 개념이 정립되면서 차세대 스핀트로닉스 분야의 핵심 주제로 떠올랐습니다.", "motivation": "알터자성과 보상된 페리자성체는 모두 순 자화가 없지만 스핀 분할 기원이 다릅니다. 이 논문은 화학적 대칭성 파괴를 통해 이 두 상태 사이의 상호 변환이 가능한지, 그리고 그 물리적 메커니즘이 무엇인지를 규명하고자 합니다.", "result": "화학적 대칭성 파괴가 알터자성 상태와 보상된 페리자성 상태를 결정짓는 핵심 제어 인자임을 밝혔습니다. 격자 내 원자 치환을 통해 스핀 구조와 그에 따른 전자 구조의 스핀 분할 특성을 조절할 수 있음을 이론적으로 제시했습니다.", "implication": "알터자성 재료를 설계할 때 대칭성 공학(Symmetry Engineering)이 스핀 상태를 제어하는 효율적인 도구가 될 수 있음을 시사하며, 비휘발성 자성 메모리 소자 응용을 위한 새로운 물리적 통찰을 제공합니다.", "novelty": "기존의 외부 자기장이나 전류를 이용한 제어와 달리, 재료 내부의 화학적 대칭성을 직접 조절하여 자성 위상을 변환하는 전략을 제안했다는 점에서 독창적입니다. 특히 스핀 분할의 대칭성 특성을 이해하는 데 있어 중요한 이론적 프레임워크를 제공합니다.", "unresolved": "실제 실험적으로 어떤 물질 시스템에서 이러한 변환이 가장 효율적으로 일어날지, 그리고 그 과정에서 발생하는 격자 왜곡의 영향을 정량화하는 연구는 아직 미흡합니다.", "future_work": "제안된 메커니즘을 실제 단결정 재료(예: 질화물 또는 산화물계)에서 구현하고, ARPES를 통해 운동량 공간에서의 스핀 분할 변화를 직접 관측하는 연구가 필요합니다.", "concepts": [{"term"
