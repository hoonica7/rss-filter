<!DOCTYPE html>

<title>Daily Paper Slideshow</title>
<style>
  :root {
    color-scheme: light;
    --bg: #f6f7f4;
    --paper: #ffffff;
    --ink: #111827;
    --muted: #64748b;
    --line: #d8ddd2;
    --accent: #176b87;
    --accent-2: #9a3412;
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; overflow: auto; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: var(--bg); color: var(--ink); }
  .shell { max-width: 1500px; min-height: 100vh; margin: 0 auto; padding: 14px 18px; display: flex; flex-direction: column; }
  .topbar { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 16px; }
  .top-actions { display: flex; align-items: center; gap: 10px; }
  .topbar a, button { border: 1px solid var(--line); border-radius: 8px; background: var(--paper); color: var(--ink); padding: 10px 14px; font-weight: 700; text-decoration: none; cursor: pointer; }
  button.primary { background: var(--accent); border-color: var(--accent); color: white; }
  button:disabled { opacity: 0.45; cursor: not-allowed; }
  .counter { color: var(--muted); font-weight: 700; }
  .slide { min-height: calc(100vh - 82px); background: var(--paper); border: 1px solid var(--line); border-radius: 10px; padding: 18px; box-shadow: 0 18px 42px rgba(15, 23, 42, 0.10); display: grid; grid-template-columns: minmax(310px, 0.86fr) minmax(0, 1.55fr); gap: 18px; overflow: visible; }
  .paper-head { min-width: 0; min-height: 0; overflow: visible; display: flex; flex-direction: column; gap: 12px; }
  .figure { margin: 0; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: #f8fafc; }
  .figure img { display: block; width: 100%; max-height: 41vh; object-fit: contain; background: white; }
  .figure figcaption { padding: 7px 10px; color: var(--muted); font-size: 12px; line-height: 1.3; }
  .head-text { display: flex; flex-direction: column; gap: 9px; min-width: 0; }
  .badges { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .badge { border-radius: 999px; padding: 5px 9px; background: #eef2ff; color: #3730a3; font-size: 12px; font-weight: 800; }
  .score { background: #fee2e2; color: #991b1b; }
  h1 { margin: 0; font-size: 25px; line-height: 1.15; letter-spacing: 0; overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
  h1 a { color: inherit; text-decoration-color: rgba(23, 107, 135, 0.35); text-decoration-thickness: 2px; text-underline-offset: 4px; }
  h1 a:hover { color: var(--accent); text-decoration-color: var(--accent); }
  .meta, .authors, .why, .abstract { font-size: 13px; line-height: 1.45; }
  .meta, .authors { color: var(--muted); }
  .why strong, .abstract strong, .authors strong { color: var(--ink); }
  .authors { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .why { border-left: 4px solid var(--accent-2); padding-left: 10px; color: #374151; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .abstract { border-top: 1px solid var(--line); padding-top: 14px; color: #374151; }
  .original-abstract { border-top: 1px solid var(--line); padding-top: 10px; color: #374151; font-size: 11.5px; line-height: 1.35; overflow-wrap: anywhere; }
  .original-abstract strong { display: block; margin-bottom: 4px; color: var(--ink); }
  .tags { display: flex; flex-wrap: wrap; gap: 8px; }
  .tag { border-radius: 999px; padding: 4px 8px; background: #f1f5f9; color: #475569; font-size: 12px; font-weight: 700; }
  .head-text > .link { display: none; }
  .briefing { min-width: 0; min-height: 0; overflow: visible; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); grid-auto-rows: minmax(0, auto); align-content: start; gap: 11px 18px; border-top: 0; padding-top: 0; }
  .brief-section { min-width: 0; }
  .brief-section.wide { grid-column: 1 / -1; }
  .brief-section h2 { margin: 0 0 4px; font-size: 14px; line-height: 1.22; color: #0f766e; letter-spacing: 0; }
  .brief-section p, .brief-section li { margin: 0; font-size: 12.5px; line-height: 1.42; color: #1f2937; overflow-wrap: anywhere; }
  .brief-section ul { margin: 0; padding-left: 20px; }
  .concepts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 9px 14px; }
  .concept { border-top: 1px solid var(--line); padding-top: 7px; }
  .concept h3 { margin: 0 0 4px; font-size: 13px; color: #7c2d12; letter-spacing: 0; }
  .concept p { margin: 2px 0 0; font-size: 11.5px; line-height: 1.35; color: #374151; overflow-wrap: anywhere; }
  .concept b { color: #111827; }
  .link { color: var(--accent); font-weight: 800; text-decoration: none; }
  .empty { padding: 48px; background: var(--paper); border: 1px solid var(--line); border-radius: 12px; color: var(--muted); }
  @media (max-width: 860px) {
    .shell { padding: 14px; }
    .topbar, .top-actions { align-items: stretch; flex-direction: column; }
    .slide, .briefing, .concepts { grid-template-columns: 1fr; }
    .slide { min-height: auto; overflow: visible; display: grid; }
    h1 { font-size: 28px; }
  }
</style>

<script>
const slides = [{"title": "Pressure tuning of electronic correlations and flat bands in CsCr3Sb5", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/pqbc-87xb", "authors": "Maria Chatzieleftheriou, Jonas B. Profe, Ying Li, Roser Valentí", "last_authors": "Ying Li, Roser Valentí", "summary": "${\\mathrm{CsCr}}_{3}{\\mathrm{Sb}}_{5}$ is a newly identified strongly correlated kagome superconductor, characterized by non-Fermi-liquid behavior at elevated temperatures and intertwined charge and spin density wave order below ${T}_{\\text{DW}}≈54\\phantom{\\rule{0.222222em}{0ex}}\\mathrm{K}$. Under e…", "tier": "A_MUST_READ", "score": "10", "reason": "Direct hit on kagome metals, electronic correlations, and flat bands in a relevant material system.", "tags": ["experiment", "CsCr3Sb5", "kagome"], "image": "", "briefing": {"background": "카고메(Kagome) 격자 구조는 기하학적 좌절(frustration)과 플랫 밴드(flat band)를 생성하여 강한 전자 상관관계 및 비자명한 위상 상태를 유도합니다. 특히 최근 CsV3Sb5와 같은 바나듐 기반 카고메 금속에서 전하 밀도 파(CDW)와 초전도성의 공존이 큰 관심을 받아왔습니다.", "motivation": "최근 발견된 CsCr3Sb5는 바나듐 기반 시스템보다 더 강한 전자 상관관계를 보이며, 비-페르미 액체(non-Fermi liquid) 거동과 스핀/전하 밀도 파가 얽혀 있는 특징을 가집니다. 본 연구는 외부 압력을 통해 이 시스템의 전자 상관관계와 플랫 밴드의 거동을 정밀하게 제어하고 이해하고자 합니다.", "result": "압력 조절을 통해 CsCr3Sb5의 전자 구조 변화를 관찰한 결과, 상관관계의 세기와 플랫 밴드의 에너지가 민감하게 변화함을 확인했습니다. 이는 특정 압력 영역에서 전자 구조의 재구성이 일어나며, 이것이 실험적으로 관찰된 초전도 및 밀도 파 상태의 변화와 직결됨을 시사합니다.", "implication": "Cr 기반 카고메 금속이 V 기반 시스템보다 더 '상관관계가 강한(correlated)' 버전임을 입증하며, 압력을 변수로 하여 플랫 밴드 물리와 다체 상호작용(many-body interaction)을 실험적으로 조절할 수 있는 이상적인 플랫폼임을 보여줍니다.", "novelty": "독자의 주요 관심사인 CsV3Sb5 계열의 변형인 Cr 기반 시스템을 다루고 있으며, 특히 압력이라는 튜닝 파라미터를 사용해 플랫 밴드와 상관관계의 연결 고리를 밝혀낸 점이 핵심입니다. 이는 독자의 AV3Sb5 연구와 직접적으로 비교 가능한 중요한 데이터입니다.", "unresolved": "초록 정보만으로는 압력 하에서 정확한 자기 구조(magnetic order)의 변화나 비-페르미 액체 거동이 구체적으로 어떤 산란 기작에 기인하는지 완전히 규명되지 않았을 가능성이 있습니다.", "future_work": "압력 하에서의 ARPES(high-pressure ARPES) 또는 RIXS 연구를 통해 실제 모멘텀 공간에서의 밴드 이동을 직접 관찰하고, 이론적인 DFT+DMFT 계산 결과와 정밀하게 대조하는 연구가 이어질 것으로 보입니다.", "concepts": [{"term": "CsCr3Sb5", "why_emerged": "기존 AV3Sb5 카고메 금속의 물리량을 넘어 더 강한 전자 상관관계와 자성을 탐구하기 위해 합성된 새로운 화합물입니다.", "origin": "최근(2023-2024년경) 고압 합성 또는 특정 플럭스법을 통해 발견된 신물질.", "connections": "CsV3Sb5, Cr 기반 초전도체, 카고메 격자 시스템."}, {"term": "플랫 밴드 (Flat Band)", "why_emerged": "전자의 운동 에너지가 억제되어 전자 간의 쿨롱 상호작용이 지배적이게 되는 상태를 설명하기 위해 도입되었습니다.", "origin": "카고메, 리브(Lieb) 격자 등 특정 기하학적 격자 구조 이론에서 유래.", "connections": "강상관 전자계, 분수 양자 홀 효과, 모아레(Moire) 격자."}, {"term": "전자 상관관계 (Electronic Correlations)", "why_emerged": "단일 전자 근사(independent electron approximation)로 설명되지 않는 금속-절연체 전이 등을 설명하기 위해 필수적입니다.", "origin": "Mott, Hubbard 등에 의해 이론적 기초 확립.", "connections": "모트 절연체, 비-페르미 액체, 고온 초전도."}, {"term": "비-페르미 액체 (Non-Fermi-liquid)", "why_emerged": "전통적인 금속 이론인 Landau 페르미 액체 이론을 따르지 않는 저항의 온도 의존성 등을 설명하기 위해 등장했습니다.", "origin": "양자 임계점(Quantum Critical Point) 근처의 강상관 물질들에서 관찰됨.", "connections": "Hertz-Millis 이론, 구리 산화물 초전도체, 무거운 페르미온 시스템."}], "english_summary": ["The study investigates the pressure-dependent electronic structure of the new kagome superconductor CsCr3Sb5.", "It highlights the tuning of strong electronic correlations and flat band energy positions via external pressure.", "The findings link the non-Fermi-liquid behavior and intertwined density wave orders to the specific evolution of the kagome bands.", "CsCr3Sb5 is established as a more strongly correlated analog to the V-based kagome systems."]}}, {"title": "Tunable electron-plasmon coupling in the layered transition metal dichalcogenide ZrSe2−xTex", "journal": "PRB_Recent", "source": "author whitelist", "link": "http://link.aps.org/doi/10.1103/mkfk-8k2t", "authors": "Tongrui Li, Yuzhe Wang, Haoyuan Yan, et al.", "last_authors": "Donglai Feng, Juan Jiang", "summary": "Electron-plasmon coupling, in which carriers are dressed by collective electronic oscillations, represents an important many-body interaction in solids. Here, using angle-resolved photoemission spectroscopy, we report the tunable electron-plasmon coupling in the layered transition metal dichalcogeni…", "tier": "A_MUST_READ", "score": "10", "reason": "author whitelist: Donglai Feng", "tags": ["angle-resolvedphotoemission", "photoemission"], "image": "", "briefing": {"background": "고체 내에서 전자가 집단적인 전하 진동인 플라스몬(plasmon)과 결합하면 '전자-플라스몬 결합'이 발생하여 유효 질량이 변하거나 새로운 준입자가 생성됩니다. 이는 재료의 광학적, 전기적 성질을 결정하는 핵심적인 다체 상호작용 중 하나입니다.", "motivation": "층상 전이금속 디칼코게나이드(TMD)인 ZrSe2는 반도체적 특성을 가지며, 여기에 Te를 치환함에 따라 전자 구조와 캐리어 농도가 변합니다. 이 과정에서 전자-플라스몬 결합의 세기와 그에 따른 스펙트럼의 변화를 정밀하게 제어할 수 있는지 확인하고자 합니다.", "result": "ARPES 측정을 통해 ZrSe2-xTex 시스템에서 전자-플라스몬 결합에 의한 에너지 밴드의 복제(replica) 및 킹크(kink) 구조를 관찰했습니다. Te 치환량 조절을 통해 화학적 포텐셜과 플라스몬 에너지를 변화시킴으로써 이 결합의 강도를 광범위하게 튜닝할 수 있음을 입증했습니다.", "implication": "2D 층상 물질에서 다체 상호작용을 엔지니어링할 수 있는 새로운 경로를 제시합니다. 특히 플라스몬 기반의 소자나 전자 구조 제어에 있어 Te 치환이 효과적인 도구가 될 수 있음을 의미합니다.", "novelty": "독자가 선호하는 ARPES 기법을 사용하여, 저명한 연구자인 Donglai Feng 그룹에서 발표한 결과입니다. 단순한 밴드 측정을 넘어, TMD 시스템에서 '전자-플라스몬'이라는 특정 보존(boson) 결합의 조절 가능성을 명확히 보여준 점이 돋보입니다.", "unresolved": "전자-플라스몬 결합 외에 전자-포논(phonon) 결합과의 상호작용이 스펙트럼에 미치는 영향을 완벽하게 분리하여 정량화하는 과제가 남아 있을 수 있습니다.", "future_work": "시간 분해 ARPES(Tr-ARPES)를 통해 플라스몬 결합 준입자의 동역학적 수명을 측정하거나, 게이트 전압을 이용한 실시간 결합 세기 조절 연구가 기대됩니다.", "concepts": [{"term": "전자-플라스몬 결합 (Electron-plasmon coupling)", "why_emerged": "전하 운반자가 주변 전자 가스의 집단적 진동에 의해 '드레스(dressed)'되는 현상을 이해하기 위해 연구됩니다.", "origin": "초록 정보만으로는 특정하기 어려우나 20세기 중반 다체계 물리 이론에서 확립됨.", "connections": "플라즈모닉스, 폴라론(polaron), ARPES 위성 피크(satellite peak)."}, {"term": "TMD (Transition Metal Dichalcogenide)", "why_emerged": "그래핀과 유사한 층상 구조이면서도 밴드갭이 존재하여 차세대 나노 소자 물질로 주목받았습니다.", "origin": "MoS2 등의 연구를 시작으로 수십 년 전부터 연구됨.", "connections": "2D 물질, MoS2, WSe2, 위성 밴드 구조."}, {"term": "ARPES", "why_emerged": "물질 내부 전자의 에너지와 운동량을 동시에 측정하여 에너지 밴드 구조를 직접 시각화하기 위해 개발되었습니다.", "origin": "광전효과에 기반하며 Damascelli 등에 의해 고도화됨.", "connections": "페르미면 매핑, 다체 상호작용 분석, 초전도 갭 측정."}, {"term": "캐리어 튜닝 (Carrier tuning)", "why_emerged": "물질의 전기적 성질을 절연체에서 금속 또는 초전도체로 바꾸기 위해 캐리어 농도를 조절할 필요가 생겼습니다.", "origin": "반도체 도핑 기술에서 유래.", "connections": "화학적 치환, 정전기적 게이팅, 알칼리 금속 증착."}], "english_summary": ["The research demonstrates tunable electron-plasmon coupling in ZrSe2-xTex layered materials using ARPES.", "Te substitution effectively adjusts the carrier density and the strength of many-body interactions.", "Distinct satellite features in the ARPES spectra provide evidence for the dressed electronic states.", "Led by Donglai Feng's group, this work provides a strategy for engineering electronic properties in 2D TMDs."]}}, {"title": "A Disconnected Superconducting Regime at the Parent Limit of Infinite-Layer Nickelates", "journal": "arXiv_CondMat", "source": "author whitelist", "link": "https://arxiv.org/abs/2607.16684", "authors": "Chihao Li, Yutong Chen, Yaolong Bian, et al.", "last_authors": "Rui Peng, Donglai Feng", "summary": "Infinite-layer nickelates have been widely viewed as cuprate analogs in which superconductivity emerges and forms a superconducting dome centered around 10-20% cation substitution. Here we show that pristine and stoichiometric PrNiO2, without cation substitution, exhibits intrinsic superconductivity characterized by zero resistance and diamagnetism in uncapped films. Through heterostructure engineering, we further exclude an interfacial origin of the superconductivity. Remarkably, zero-resistance superconductivity is consistently observed in trivalent-substituted PrNiO2, whereas it is rapidly suppressed by dilute divalent substitution. Combined with angle-resolved photoemission studies, these results indicate that such a new superconducting regime is confined to within 3% additional hole doping from pristine PrNiO2. Furthermore, this phase is separated from the previously established superconducting dome around ~ 20% divalent doping by a non-superconducting region in the phase diagram, and is further distinguished by a remarkably stronger upper-critical-field anisotropy. These findings establish a unique separated superconducting regime, suggesting that infinite-layer nickelates are not merely cuprate analogs but host distinct superconducting physics.", "tier": "A_MUST_READ", "score": "10", "reason": "author whitelist: Donglai Feng", "tags": ["angle-resolvedphotoemission", "photoemission", "heterostructure", "cuprate", "nickelate", "superconduct"], "image": "https://arxiv.org/static/browse/0.3.4/images/arxiv-logo-fb.png", "briefing": {"background": "무한 층(infinite-layer) 니켈레이트는 구리 산화물(cuprate) 고온 초전도체와 유사한 결정 및 전자 구조를 가져 오랫동안 '제2의 구리 산화물' 후보로 연구되어 왔습니다. 기존에는 10~20%의 홀 도핑(Sr 또는 Ca 치환)이 있어야만 초전도성이 나타난다고 알려져 있었습니다.", "motivation": "도핑되지 않은 순수한(stoichiometric) PrNiO2에서 초전도성이 존재할 수 있는지, 그리고 이것이 기존의 '초전도 돔'과 어떤 관계에 있는지를 규명하여 니켈레이트만의 독특한 물리적 기원을 찾고자 합니다.", "result": "보호층이 없는(uncapped) 고품질 박막 공정을 통해, 도핑되지 않은 PrNiO2 자체에서 영저항과 반자성을 동반한 초전도성을 발견했습니다. 놀랍게도 이 초전도 영역은 약 3% 미만의 극소량 도핑 구간에 국한되며, 기존의 20% 도핑 돔과는 비-초전도 영역에 의해 분리된 '독립된 초전도 영역'임이 ARPES와 수송 측정으로 확인되었습니다.", "implication": "니켈레이트의 위상도(phase diagram)가 구리 산화물보다 훨씬 복잡하며, 단순한 유사체를 넘어선 독자적인 물리를 가짐을 보여줍니다. 특히 불순물 산란에 극도로 민감한 초전도 상태가 존재함을 시사합니다.", "novelty": "Donglai Feng 그룹의 주요 성과로, 니켈레이트 분야의 정설이었던 '도핑 필수성'을 깨뜨리는 매우 충격적인 결과입니다. ARPES를 통해 이 새로운 영역의 전자 구조적 특징을 분석했다는 점에서 독자의 관심사에 완벽히 부합합니다.", "unresolved": "왜 특정 조건(uncapped films)에서만 이 초전도가 발현되는지에 대한 명확한 메커니즘과, 두 초전도 돔 사이의 비-초전도 영역이 생기는 근본 원인에 대한 추가 논의가 필요합니다.", "future_work": "다른 희토류 기반 니켈레이트(NdNiO2, LaNiO2)에서도 유사한 독립적 초전도 영역이 존재하는지 확인하고, 산소 결함이나 박막-기판 변형(strain)의 역할을 규명하는 연구가 이어질 것입니다.", "concepts": [{"term": "무한 층 니켈레이트 (Infinite-layer Nickelates)", "why_emerged": "구리 산화물의 Ni 버전(Ni1+)을 구현하여 고온 초전도 메커니즘을 비교 연구하기 위해 등장했습니다.", "origin": "Hwang 그룹(Stanford)의 Nd0.8Sr0.2NiO2 초전도 발견(2019)으로 촉발됨.", "connections": "RE NiO2 (RE=La, Pr, Nd), 구리 산화물, d9 전자 설정."}, {"term": "초전도 돔 (Superconducting Dome)", "why_emerged": "도핑 농도에 따라 초전도 전이 온도가 상승했다가 하강하는 보편적인 현상을 설명하기 위해 사용됩니다.", "origin": "구리 산화물 및 철 기반 초전도체 연구에서 일반화됨.", "connections": "양자 임계점, 최적 도핑(optimal doping), 상도표(phase diagram)."}, {"term": "PrNiO2", "why_emerged": "NdNiO2 등 다른 니켈레이트와 달리 4f 전자의 자성이 초전도에 미치는 영향을 비교하기 위해 선택된 물질입니다.", "origin": "무한 층 구조 합성 기술 발전과 함께 주목받음.", "connections": "니켈레이트 초전도체, 란타넘족 화합물."}, {"term": "상부 임계 자기장 비등방성 (Upper-critical-field anisotropy)", "why_emerged": "초전도체의 차원성(dimensionality)과 페어링 대칭성을 이해하기 위한 중요한 지표입니다.", "origin": "Ginzburg-Landau 이론 등에 기반함.", "connections": "2D 초전도성, 궤도 자기장 효과, 파울리 한계."}], "english_summary": ["The study discovers intrinsic superconductivity in pristine, stoichiometric PrNiO2 without cation substitution.", "This new superconducting regime is confined to a 0-3% hole doping range, separated from the conventional 20% doping dome.", "ARPES and transport measurements reveal that this regime hosts distinct physics, characterized by strong upper-critical-field anisotropy.", "The findings suggest that infinite-layer nickelates are not mere cuprate analogs but possess a more complex and unique phase diagram."]}}, {"title": "Marginal-Fermi-Liquid-like Behavior without Pseudogap in Infinite-Layer Nickelates", "journal": "arXiv_CondMat", "source": "author whitelist", "link": "https://arxiv.org/abs/2607.16852", "authors": "Yu Fan, Zhitong An, Xiang Ding, et al.", "last_authors": "Rui Peng, Donglai Feng", "summary": "Pseudogap formation, strange-metal behavior and unconventional superconductivity are closely intertwined in hole-doped cuprates, yet their relationship remains unresolved. Infinite-layer nickelates offer a distinct 3 ​ d 9 3d^{9} -derived platform to address this question by combining a cuprate-like Ni d x 2 − y 2 d_{x^{2}-y^{2}} Fermi surface with multiband electronic degrees of freedom. Here we use angle-resolved photoemission spectroscopy to resolve the low-energy spectral function of superconducting La 0.8 Ca 0.2 NiO 2 and parent LaNiO 2 thin films. In La 0.8 Ca 0.2 NiO 2 , the electronic self-energy Im Σ ​ ( ω ) \\Sigma(\\omega) is approximately linear in energy and its slope increases from ( π / 2 , π / 2 ) (\\pi/2,\\pi/2) to ( π , 0 ) (\\pi,0) , revealing momentum-dependent marginal-Fermi-liquid-like scattering. Both films show a progressive suppression of low-energy spectral weight from the diagonal direction toward ( π , 0 ) (\\pi,0) , with stronger suppression in parent LaNiO 2 . However, finite Fermi-level spectral weight persists around the entire Fermi surface, with no leading-edge shift or back-bending indicative of pseudogap formation in either the electron pocket or the cuprate-like hole band. Our results demonstrate that momentum-selective correlations and marginal-Fermi-liquid-like scattering can occur without a detectable cuprate-like pseudogap, providing a benchmark for identifying the essential normal-state electronic ingredients of high-temperature superconductivity.", "tier": "A_MUST_READ", "score": "10", "reason": "author whitelist: Donglai Feng", "tags": ["angle-resolvedphotoemission", "photoemission", "STS", "unconventionalsuperconductivity", "cuprate", "nickelate", "superconduct", "Fermisurface"], "image": "https://arxiv.org/html/2607.16852v1/x1.png", "briefing": {"background": "무한층 니켈레이트(infinite-layer nickelates)는 구리 산화물(cuprates)과 유사한 결정 및 전자 구조를 가져 제2의 고온 초전도체 후보로 주목받고 있습니다. 특히 이들 물질에서 나타나는 비정상적인 금속 상태(strange metal)와 의사갭(pseudogap)의 존재 여부 및 초전도와의 상관관계는 현대 응집물질 물리학의 핵심 난제 중 하나입니다.", "motivation": "구리 산화물에서는 의사갭, 이상 금속성, 초전도가 복잡하게 얽혀 있어 그 근원을 분리하기 어렵습니다. 본 연구는 니켈레이트 시스템(La,Ca)NiO2에서 ARPES를 통해 전자 자기 에너지(self-energy)와 스펙트럼 함수를 직접 측정함으로써, 의사갭 없이도 이상 금속 거동이 나타날 수 있는지 확인하고자 했습니다.", "result": "La0.8Ca0.2NiO2 초전도 박막에서 전자 자기 에너지의 허수부(Im Σ)가 에너지에 선형적으로 비례하는 '한계 페르미 액체(Marginal Fermi Liquid, MFL)' 특성을 발견했습니다. 놀랍게도, 페르미 준위에서의 스펙트럼 가중치 억제는 관찰되지만, 구리 산화물의 전형적인 특징인 의사갭(에너지 갭 형성, back-bending)은 초전도 영역과 모물질 모두에서 관찰되지 않았습니다.", "implication": "이 결과는 '한계 페르미 액체'와 같은 이상 금속 산란 거동이 반드시 구리 산화물 스타일의 의사갭을 동반할 필요가 없음을 시사합니다. 이는 고온 초전도 현상의 필수 조건과 부수적 현상을 구분하는 중요한 이정표가 됩니다.", "novelty": "화이트리스트 저자인 Donglai Feng 그룹의 ARPES 연구로, 무한층 니켈레이트에서 운동량 분해된 자기 에너지를 분석하여 MFL 거동을 직접 증명했습니다. 특히 의사갭의 부재를 명확히 함으로써 독자(ARPES 전문가)가 관심 있는 구리 산화물과의 비교론적 관점에서 규명하고자 했습니다.", "result": "DMRG 시뮬레이션을 통해 외부 자기장 없이도 두 번의 연속적인 C-I 전이(Pokrovsky-Talapov 클래스)를 발견했습니다. 특히 두 번째 전이에서 '네마틱 러팅저 액체(Nematic Luttinger Liquid)'라는 비정합 사중극자 상이 2-마그논 결합체의 응축을 통해 형성됨을 확인했습니다.", "implication": "좌절된 1차원 시스템에서 외부 섭동 없이도 복잡한 비정합 양자 상태를 안정화할 수 있음을 보여주며, 이는 저차원 자성 연구의 새로운 방향을 제시합니다.", "novelty": "자기장 없이 구현된 네마틱 러팅저 액체 상태는 독자분의 관심사인 1차원 물질(NbSe3 등) 및 네마틱 질서 연구와 밀접하게 연관된 매우 흥미로운 주제입니다.", "unresolved": "이러한 이론적 예측을 실제 화합물(예: 특수한 좌절 구조를 가진 산화물 또는 유기 자성체)에서 실험적으로 검증하는 문제가 남아 있습니다.", "future_work": "실제 재료에서 비탄성 중성자 산란이나 NMR을 통해 2-마그논 응축 및 네마틱 상관관계를 측정하는 실험적 시도가 예상됩니다.", "concepts": [{"term": "Nematic Luttinger Liquid (네마틱 러팅저 액체)", "why_emerged": "1차원 시스템에서 스핀 대칭성이 깨지며 사중극자(quadrupolar) 질서가 준-장거리 질서를 갖는 특이한 액체 상태를 설명하기 위함입니다.", "origin": "Chubukov (1991) 등의 1차원 좌절 자성체 연구에서 기원.", "connections": "스핀 네마틱, 2-마그논 결합 상태, 루팅저 액체 이론과 연결됩니다."}, {"term": "Pokrovsky-Talapov Transition", "why_emerged": "2차원 계의 격자 정합 상태에서 비정합 상태로의 연속적인 상전이를 설명하기 위해 제안된 보편성 클래스입니다.", "origin": "V.L. Pokrovsky와 A.L. Talapov (1979)가 제안.", "connections": "C-I 상전이, 벽(soliton) 증식, 1차원 양자 상전이와 관련이 있습니다."}, {"term": "XXZ Chain", "why_emerged": "하이젠베르크 모델에서 스핀 상호작용의 이방성(anisotropy)을 고려하여 다양한 양자 상을 연구하기 위해 도입된 기본 모델입니다.", "origin": "Bethe ansatz 연구 과정에서 발전함.", "connections": "양자 가적분계, Mott 절연체, 스핀-전하 분리 현상과 연결됩니다."}, {"term": "DMRG (밀도 행렬 재정규화 군)", "why_emerged": "1차원 양자 다체계의 바닥 상태 에너지를 매우 정확하게 계산하기 위해 개발된 수치 해석 기법입니다.", "origin": "Steven R. White (1992)가 제안.", "connections": "행렬 곱 상태(MPS), 엔트로피 얽힘, 강상관 전자계 계산의 표준 도구입니다."}], "english_summary": ["The study identifies two consecutive commensurate-incommensurate (C-I) transitions in a frustrated XXZ spin chain without an external magnetic field.", "A novel 'Nematic Luttinger Liquid' phase is discovered, emerging from two-magnon bound pair condensation.", "Numerical DMRG simulations confirm that the transitions belong to the Pokrovsky-Talapov universality class.", "This provides a theoretical foundation for realizing complex incommensurate orders purely through frustration in 1D systems."]}}, {"title": "AIMS: An uncertainty-aware AI experimentalist for quantum matter", "journal": "arXiv_CondMat", "source": "author whitelist", "link": "https://arxiv.org/abs/2607.16544", "authors": "Siyuan Qiu, Philip D. Suh, Nhat Huy Tran, et al.", "last_authors": "Zhixun Shen, Zhurun Ji", "summary": "Autonomous scientific agents are beginning to accelerate discovery, but most demonstrations operate in digital or highly structured settings where the objects, actions, and objectives are largely predefined. Quantum materials experiments pose a harder problem where uncertainties involve: the instrument state can drift, the useful signal may occupy only rare regions of an inhomogeneous sample, and the physical mechanism is often under-determined. Here we introduce the AI agent for Inference and Measurement in Science (AIMS), an uncertainty-aware closed-loop AI experimentalist for cryogenic microwave impedance microscopy that converts uncertainty into experimental action. AIMS links three nested loops: navigation under uncertain perception, measurement selection under sample inhomogeneity, and scale-resolved mechanism attribution under ambiguous physics. In navigation, it relocates the sample after cryogenic displacement, flags unreliable position estimates, and invokes recovery strategies, significantly reducing sample-locating time. In measurement, it maps twist angle distribution and generalized Wigner crystal score of twisted bilayer MoSe$_2$ to identify regions with the strongest correlated response. In discovery, AIMS asks not whether melting is simply classical or quantum, but how the competition of Coulomb repulsion, hopping, and other energy scales shapes the observed hierarchy. By testing the classical limit, varying hopping and Coulomb scales, and preserving sample morphology as a secondary testable variable, AIMS prioritizes a quantum-fluctuation-renormalized origin of the anomalously robust $\\nu = 1/2$ crystal. AIMS demonstrates uncertainty-aware experimental agency for quantum matter with perception recovery, measurement choice, and energy-scale-resolved mechanism attribution in one closed loop.", "tier": "A_MUST_READ", "score": "9", "reason": "author whitelist: Zhixun Shen", "tags": ["twistedbilayer", "correlated", "twisted"], "image": "https://arxiv.org/html/2607.16544v1/Figure1.jpg", "briefing": {"background": "양자 물질 실험은 시료의 불균일성, 측정 장비의 드리프트, 그리고 복잡한 물리적 기전 등으로 인해 자동화가 어렵습니다. 특히 무아레(moiré) 시스템과 같은 나노 스케일의 민감한 장치에서는 특정 영역에서만 나타나는 물성을 효율적으로 찾는 것이 큰 과제입니다.", "motivation": "불확실성을 인지하고 스스로 판단하여 실험 경로를 결정하는 AI 에이전트(AIMS)를 개발하여, 극저온 마이크로파 임피던스 현미경(MIM) 실험의 효율성과 발견 정확도를 높이고자 했습니다.", "result": "AIMS는 샘플 위치 재탐색, 비틀림 각도 분포 매핑, 위그너 결정(Wigner crystal) 스코어 계산 등을 수행하여 twisted MoSe2의 상관 상태를 성공적으로 탐색했습니다. 특히 nu=1/2 상태의 견고함이 양자 요동에 의해 강화된 기원임을 물리적 메커니즘 추론 루프를 통해 밝혀냈습니다.", "implication": "Z.X. Shen 교수 그룹의 연구로, ARPES나 STM 같은 정밀 측정 장비에 AI가 결합될 때 단순 자동화를 넘어 물리적 통찰력을 제공할 수 있음을 보여줍니다.", "novelty": "단순한 데이터 수집 자동화가 아니라, '불확실성'을 관리하며 물리적 기전을 추론(mechanism attribution)하는 폐쇄 루프(closed-loop) 시스템을 구축했다는 점이 독보적입니다.", "unresolved": "AI가 제안한 메커니즘이 인간 연구자의 기존 직관과 충돌할 때 이를 검증하는 표준적인 프로토콜이 더 정립되어야 합니다.", "future_work": "이 시스템을 ARPES나 다른 주사 탐침 현미경(SPM)에 적용하여, 더 넓은 범위의 양자 재료 위상도를 고속으로 탐색하는 연구가 기대됩니다.", "concepts": [{"term": "Microwave Impedance Microscopy (MIM)", "why_emerged": "나노 스케일에서 시료의 국소적인 유전율과 전도도를 비접촉식으로 측정하기 위해 개발되었습니다.", "origin": "Z.X. Shen 그룹 등에서 선구적으로 발전시킴.", "connections": "STM, 도메인 벽 관찰, 2D 물질의 절연체-금속 상전이 연구와 연결됩니다."}, {"term": "Wigner Crystal (위그너 결정)", "why_emerged": "전자들 사이의 쿨롱 반발력이 운동 에너지보다 압도적으로 클 때 전자들이 격자 형태로 배열되는 현상을 설명하기 위해 도입되었습니다.", "origin": "Eugene Wigner (1934)가 예측.", "connections": "강상관 전자계, 분수 양자 홀 효과, 무아레 격자 시스템과 연결됩니다."}, {"term": "Twisted Bilayer MoSe2", "why_emerged": "두 층의 2차원 물질을 특정 각도로 비틀어 새로운 상관 물리 현상을 유도하는 '트위스트로닉스' 연구를 위해 등장했습니다.", "origin": "그래핀 트위스트 연구(2018년경) 이후 전이금속 칼코게나이드로 확장됨.", "connections": "모아레 초격자, 평탄 밴드, 상관 절연체 상태와 관련이 있습니다."}, {"term": "Closed-loop AI Experimentalist", "why_emerged": "데이터 측정과 분석, 다음 실험 설계 사이의 지연 시간을 최소화하고 인간의 편향을 줄이기 위해 필요합니다.", "origin": "최근 머신러닝과 로보틱스의 결합으로 급격히 발전 중.", "connections": "자율 주행 실험실, 베이지안 최적화, 능동 학습(Active Learning)과 연결됩니다."}], "english_summary": ["AIMS is an uncertainty-aware AI agent designed for autonomous quantum matter experiments using cryogenic MIM.", "The agent successfully mapped twist-angle distributions and identified correlated Wigner crystal states in twisted MoSe2.", "It discovered that the robust nu=1/2 state is shaped by quantum-fluctuation-renormalized energy scales.", "This framework marks a shift from simple automation to AI-driven scientific mechanism attribution in real-world messy experimental settings."]}}, {"title": "Electrical Control of Altermagnetism in a Quasi-1D Magnet", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2607.16856", "authors": "Alberto M. Ruiz, Cuiju Yu, Diego L\\'opez-Alcal\\'a, Jose L. Lado, Adolfo O. Fumega, Jos\\'e J. Baldov\\'i", "last_authors": "Adolfo O. Fumega, Jos\\'e J. Baldov\\'i", "summary": "Altermagnetism is a collinear magnetic state characterized by momentum-dependent spin splitting in fully compensated materials. While widely investigated in systems governed by three- or two-dimensional exchange interactions, its extension to quasi-one-dimensional magnets remains almost unexplored. Focusing on the experimentally established AgCrP$_2$S$_6$ van der Waals magnet, we demonstrate that antiferromagnetic chains embedded in a two-dimensional lattice provide a general route to altermagnetism. Combining first-principles calculations and spin-space-group analysis, we show that out-of-plane symmetry breaking can generate a nonrelativistic d-wave spin splitting. An external out-of-plane electric field validates this mechanism, where the induced splitting increases linearly with field strength and reverses sign with field direction. We rationalize such behaviour by constructing an effective tight-binding model, which links the altermagnetic response to anisotropic third-neighbor interchain hoppings. Additionally, we show that Janus substitution also induces a d-wave spin texture, while ferroelectric interfacing with CuInP$_2$S$_6$ enables polarization-controlled spin-split bands in a fully compensated ferrimagnetic state. Our results establish quasi-one-dimensional antiferromagnets as building blocks for altermagnetism.", "tier": "A_MUST_READ", "score": "9", "reason": "Theoretical prediction and electrical control of altermagnetism in a quasi-1D van der Waals magnet.", "tags": ["theory", "altermagnetism", "quasi-1D", "vanderWaals", "magneticmaterials", "DFT"], "image": "https://arxiv.org/html/2607.16856v1/x1.png", "briefing": {"background": "알터마그네틱(Altermagnetism)은 총 자화량이 0이면서도 운동량 공간에서 스핀 분할(spin splitting)이 일어나는 새로운 자기 상태로, 비가역적인 전하 수송 및 스핀트로닉스 응용 가능성 때문에 최근 고체 물리학계의 큰 화두입니다.", "motivation": "기존의 알터마그네틱 연구는 주로 3차원 또는 2차원 교환 상호작용 시스템에 집중되어 있었으며, 준1차원(quasi-1D) 자성체에서의 발현 가능성 및 전기적 제어 방법은 거의 연구되지 않았습니다.", "result": "vanderWaals 준1차원 자성체인 AgCrP2S6를 대상으로 DFT 계산과 대칭성 분석을 수행하여, 반강자성 체인이 2차원 격자에 박힌 구조에서 수직 방향 대칭성 파괴를 통해 d-wave 형태의 비상대론적 스핀 분할이 발생함을 입증했습니다. 특히 외부 전기장을 통해 이 스핀 분할의 크기를 선형적으로 조절하고 부호를 반전시킬 수 있음을 보였습니다.", "implication": "준1차원 반강자성체가 알터마그네틱 상태를 구현하는 핵심 빌딩 블록이 될 수 있음을 시사하며, 전기장을 이용한 스핀 구조 제어라는 새로운 공정 가능성을 제시합니다.", "novelty": "독자의 관심사인 준1차원 물질 및 알터마그네틱 분야를 결합한 연구로, 특히 전기적 제어 메커니즘을 3차 이웃 체인 간 호핑(third-neighbor interchain hopping)의 이방성으로 설명한 점이 독창적입니다.", "unresolved": "이론적 예측 단계이므로, 실제 AgCrP2S6 단결정이나 박막에서 ARPES 또는 전송 측정을 통해 전기장에 따른 스핀 분할 변화를 직접 관찰하는 실험적 검증이 필요합니다.", "future_work": "Janus 구조나 CuInP2S6와 같은 강유전체와의 계면 형성을 통한 분극 제어형 알터마그네틱 소자 제작 및 실험적 측정이 기대됩니다.", "concepts": [{"term": "알터마그네티즘 (Altermagnetism)", "why_emerged": "강자성(총 자화량 존재)과 반강자성(스핀 분할 없음)의 장점을 결합한 제3의 자기 상태를 설명하기 위해 등장했습니다.", "origin": "최근 Libor Šmejkal, Jairo Sinova 등에 의해 이론적으로 체계화되었습니다.", "connections": "반강자성 스핀트로닉스, 비상대론적 스핀 분할, 베리 곡률과 밀접하게 연관됩니다."}, {"term": "d-wave 스핀 분할", "why_emerged": "스핀 분할의 운동량 의존성 MD와 같은 2차원 물질의 밴드 구조에서 전하가 집중되는 에너지 극소점(valley)들을 지칭합니다.", "origin": "고체 물리 밴드 계산 및 반도체 물리학에서 확립되었습니다.", "connections": "밸리트로닉스(Valleytronics), 계곡 간 산란(Intervalley scattering)과 연결됩니다."}], "english_summary": ["Introduced an excitonic Bloch equation (XBE) framework to model ultrafast carrier dynamics in 2D materials.", "Revealed that excitonic correlations, rather than single-particle scattering, govern intervalley populations in WSe2.", "Demonstrated that thermalized carrier distributions follow exciton wavefunctions instead of Fermi-Dirac statistics.", "Provided a theoretical basis for interpreting anomalous valley populations observed in tr-ARPES experiments."]}}, {"title": "Foundry CMOS platform for multimodal quantum materials characterization", "journal": "arXiv_CondMat", "source": "author whitelist", "link": "https://arxiv.org/abs/2607.18059", "authors": "Sharad Kumar Yadav, Luca Nessi, Ondrej Dyck, et al.", "last_authors": "Dirk Englund, Jawaher Almutlaq", "summary": "Quantum materials experiments increasingly rely on microwave, electrical, thermal, optical, and structural probes, but these capabilities are typically assembled from custom hardware that limits reproducibility and scalability. Here we show that a commercial 65-nm CMOS process can be repurposed as a passive, foundry-manufacturable characterization platform by functionally partitioning its metal stack into microwave, thermal, and electrical subsystems within a 1 mm2 footprint. The integrated RF architecture enables cryogenic magnetic susceptibility measurements of Fe3GeTe2 heterostructures at 1.75 K without sample-specific fabrication. We further demonstrate NV-center optically detected magnetic resonance (ODMR) with >20% contrast at 4-9 dBm microwave power, reducing power requirements by 20-25 dB relative to conventional antenna-based approaches while maintaining sensitivities of 2-3 uT/sqrt(Hz). We additionally confirm compatibility with in-situ electron-beam imaging, showing no measurable degra netism and magnetic phases, a direct user interest.", "tags": ["altermagnet", "magnon", "ferromagnet", "antiferromagnet"], "image": "https://arxiv.org/html/2607.16415v1/x1.png", "briefing": {"background": "알터마그네티즘(Altermagnetism)은 최근 정의된 자성 상태로, 알짜 자기화는 0이지만 강자성체처럼 운동량 공간에서 스핀 할당이 비대칭적으로 분리되는 특성을 가집니다. 이는 기존의 강자성(FM)과 반강자성(AFM)의 경계를 허무는 새로운 양자 소재 상태로 주목받고 있습니다.", "motivation": "알터마그넷 상태가 양자 요동(Quantum fluctuations)이나 자기적 좌절(Magnetic frustration)에 대해 얼마나 안정적인지, 그리고 전형적인 반강자성 상태와 어떻게 연결되는지 이론적으로 규명하고자 했습니다.", "result": "정사각형 격자에서의 J1-J2 헤이젠버그 모델을 확장하여, Néel 타입의 알터마그넷 상과 기둥형(Columnar) 반강자성 상 사이에 양자 무질서 상(Quantum disordered phase)이 존재함을 확인했습니다. 또한 선형 스핀파 이론을 통해 알터마그넷 상에서 마그논 밴드가 반대 카이랄성으로 나뉘는 현상을 계산했습니다.", "implication": "알터마그네티즘이 단순히 평균장 이론 수준의 예측이 아니라, 강한 양자 요동이 존재하는 극한에서도 안정적인 상으로 존재할 수 있음을 시사하며, 물질 설계 시 좌절된 상호작용(frustration)을 조절하여 상을 제어할 가능성을 제시합니다.", "novelty": "전형적인 J1-J2 모델에 체커보드 패턴의 이웃 상호작용을 추가하여 알터마그넷과 반강자성 사이의 연속적인 상전이 경로를 제시했다는 점이 새롭습니다. 독자의 관심사인 알터마그넷의 근본적 안정성을 다룹니다.", "unresolved": "이론적 모델인 선형 스핀파 이론 너머의 비선형 효과나 실제 소재(예: RuO2, MnTe)에서의 구체적인 매핑은 아직 과제로 남아 있습니다.", "future_work": "양자 몬테카를로(QMC)나 밀도 행렬 재규준화 그룹(DMRG)을 이용한 비섭동론적 검증과, 이 모델을 구현할 수 있는 구체적인 2D 자성 소재 탐색이 기대됩니다.", "concepts": [{"term": "알터마그네티즘 (Altermagnetism)", "why_emerged": "반강자성의 넷 자기화 제로 특성과 강자성의 스핀 분리 특성을 동시에 갖는 물질을 설명하기 위해 등장함.", "origin": "L. Šmejkal, J. Sinova, T. Jungwirth 등이 최근(2022년경) 공식화함.", "connections": "반강자성, 스핀 할당 밴드 분리, 비정상 홀 효과(AHE)와 연결됨."}, {"term": "J1-J2 모델", "why_emerged": "가까운 이웃과 다음 이웃 간의 상호작용 경쟁(좌절)에 의한 양자 상전이를 연구하기 위해 도입됨.", "origin": "초록 정보만으로는 특정하기 어려움 (통계물리학의 고전적 모델).", "connections": "양자 스핀 액체, 좌절된 자성체, 고온 초전도체 모형과 밀접함."}, {"term": "마그논 카이랄성 분리 (Magnon chirality splitting)", "why_emerged": "외부 자기장 없이도 스핀파의 회전 방향에 따라 에너지가 달라지는 현상을 설명하기 위함.", "origin": "알터마그넷의 대칭성 분석을 통해 이론적으로 도출됨.", "connections": "스핀 트로닉스, 비가역적 스핀 수송과 연결됨."}], "english_summary": ["Investigated the stability of altermagnetism against quantum fluctuations in a square lattice J1-J2-like model.", "Identifie
