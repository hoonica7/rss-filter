<style>
  :root {
    color-scheme: light;
    --bg: #f6f7f4;

    --muted: #64748b;
    --line: #d8ddd2;
    --accent: #176b87;

  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; overflow: auto; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: var(--bg); color: var(--ink); }
  .shell { max-width: 1500px; min-height: 100vh; margin: 0 auto; padding: 14px 18px; display: flex; flex-direction: column; }
  .topbar { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 16px; }
  .top-actions { display: flex; align-items: center; gap: 10px; }
  .topbar a, button { border: 1px solid var(--line); border-radius: 8px; background: var(--paper); color: var(--ink); padding: 10px 14px; font-weight: 700; text-decoration: none; cursor: pointer; }
  button.primary { background: var(--accent); border-color: var(--accent); color: white; }
  button:disabled { opacity: 0.45; cursor: not-allowed; }
  .counter { color: var(--muted); font-weight: 700; }
  .slide { min-height: calc(100vh - 82px); background: var(--paper); border: 1px solid var(--line); border-radius: 10px; padding: 18px; box-shadow: 0 18px 42px rgba(15, 23, 42, 0.10); display: grid; grid-template-columns: minmax(310px, 0.86fr) minmax(0, 1.55fr); gap: 18px; overflow: visible; }
  .paper-head { min-width: 0; min-height: 0; overflow: visible; display: flex; flex-direction: column; gap: 12px; }
  .figure { margin: 0; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: #f8fafc; }
  .figure img { display: block; width: 100%; max-height: 41vh; object-fit: contain; background: white; }
  .figure figcaption { padding: 7px 10px; color: var(--muted); font-size: 12px; line-height: 1.3; }
  .head-text { display: flex; flex-direction: column; gap: 9px; min-width: 0; }
  .badges { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .badge { border-radius: 999px; padding: 5px 9px; background: #eef2ff; color: #3730a3; font-size: 12px; font-weight: 800; }
  .score { background: #fee2e2; color: #991b1b; }
  h1 { margin: 0; font-size: 25px; line-height: 1.15; letter-spacing: 0; overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
  h1 a { color: inherit; text-decoration-color: rgba(23, 107, 135, 0.35); text-decoration-thickness: 2px; text-underline-offset: 4px; }
  h1 a:hover { color: var(--accent); text-decoration-color: var(--accent); }
  .meta, .authors, .why, .abstract { font-size: 13px; line-height: 1.45; }
  .meta, .authors { color: var(--muted); }
  .why strong, .abstract strong, .authors strong { color: var(--ink); }
  .authors { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .why { border-left: 4px solid var(--accent-2); padding-left: 10px; color: #374151; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .abstract { border-top: 1px solid var(--line); padding-top: 14px; color: #374151; }
  .original-abstract { border-top: 1px solid var(--line); padding-top: 10px; color: #374151; font-size: 11.5px; line-height: 1.35; overflow-wrap: anywhere; }
  .original-abstract strong { display: block; margin-bottom: 4px; color: var(--ink); }
  .tags { display: flex; flex-wrap: wrap; gap: 8px; }
  .tag { border-radius: 999px; padding: 4px 8px; background: #f1f5f9; color: #475569; font-size: 12px; font-weight: 700; }
  .head-text > .link { display: none; }
  .briefing { min-width: 0; min-height: 0; overflow: visible; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); grid-auto-rows: minmax(0, auto); align-content: start; gap: 11px 18px; border-top: 0; padding-top: 0; }
  .brief-section { min-width: 0; }
  .brief-section.wide { grid-column: 1 / -1; }
  .brief-section h2 { margin: 0 0 4px; font-size: 14px; line-height: 1.22; color: #0f766e; letter-spacing: 0; }
  .brief-section p, .brief-section li { margin: 0; font-size: 12.5px; line-height: 1.42; color: #1f2937; overflow-wrap: anywhere; }
  .brief-section ul { margin: 0; padding-left: 20px; }
  .concepts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 9px 14px; }
  .concept { border-top: 1px solid var(--line); padding-top: 7px; }
  .concept h3 { margin: 0 0 4px; font-size: 13px; color: #7c2d12; letter-spacing: 0; }
  .concept p { margin: 2px 0 0; font-size: 11.5px; line-height: 1.35; color: #374151; overflow-wrap: anywhere; }
  .concept b { color: #111827; }
  .link { color: var(--accent); font-weight: 800; text-decoration: none; }
  .empty { padding: 48px; background: var(--paper); border: 1px solid var(--line); border-radius: 12px; color: var(--muted); }
  @media (max-width: 860px) {
    .shell { padding: 14px; }
    .topbar, .top-actions { align-items: stretch; flex-direction: column; }
    .slide, .briefing, .concepts { grid-template-columns: 1fr; }
    .slide { min-height: auto; overflow: visible; display: grid; }
    h1 { font-size: 28px; }
  }
</style>

c behavior and superconducting nematic order."]}}, {"title": "B-type Quadratic Planar Hall Effect as a Probe of Altermagnetic Order", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2609.13826", "authors": "Yiwei Zhao, Junwei Liu, Jian Zhou, Haowei Xu", "last_authors": "Jian Zhou, Haowei Xu", "summary": "Conventional transport and optical responses, such as the Hall effect, can only distinguish material phases with substantially different symmetries. However, many quantum materials, such as candidate altermagnetic materials, host competing phases with similar structures, making it difficult to differentiate them using conventional transport or optical measurements. Here, guided by symmetry principles, we introduce a B-type quadratic planar Hall effect (B2-PHE) as a sensitive probe of magnetic structures. B2-PHE features a planar Hall current that scales quadratically with the applied magnetic field. This response originates from the interplay among external magnetic fields, intrinsic magnetic order, and quantum geometric properties of the electronic bands. We investigate B2-PHE in two altermagnetic candidates, KV2Se2O and RuO2, whose ground-state magnetic orders are under intense debate. Remarkably, B2-PHE emerges in their altermagnetic phases but is symmetry-forbidden in their antiferromagnetic (nonmagnetic) phases. We also show that B2-PHE should be detectable under a moderate magnetic field on the order of 1 Tesla. These findings establish B2-PHE as an experimentally convenient and potentially unambiguous probe of altermagnetic order, which is otherwise difficult to realize.", "tier": "A_MUST_READ", "score": "9", "reason": "Directly addresses altermagnetic order in RuO2 using transport, a key interest of the user.", "tags": ["theory", "altermagnetism", "transport"], "image": "https://arxiv.org/static/browse/0.3.4/images/arxiv-logo-fb.png", "briefing": {"background": "교대 자성(Altermagnetism)은 기존의 강자성이나 반강자성과는 다른 대칭성을 가지며, 일반적인 수송 현상만으로  "origin": "Georges와 Kotliar 등.", "connections": "강상관계 전자계, DFT+DMFT."}], "english_summary": ["Investigates ferromagnetism in the kagome Hubbard model using DMFT.", "Identifies unconventional quasi-ordered phase with persistent spin fluctuations.", "Connects flat-band degeneracy directly to anomalous magnetic behavior.", "Provides a framework for understanding correlations in flat-band kagome materials."]}}, {"title": "Large spin splitting metallic altermagnets from machine-learned design rules", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2609.14051", "authors": "Ali Sufyan, Brahim Marfoua, J. Andreas Larsson, Rickard Armiento, Erik van Loon", "last_authors": "Rickard Armiento, Erik van Loon", "summary": "Altermagnets combine compensated magnetic order with momentum-dependent spin splitting, providing spin-polarized electronic states without a net magnetization. Metallic $d$-wave altermagnets are particularly promising because they can support time-reversal-odd spin currents in linear response, yet experimentally validated bulk realizations remain scarce. Here, we use high-throughput density-functional-theory data to relate the magnitude of altermagnetic band splitting to compositional, structural, and DFT-derived magnetic descriptors. An interpretable gradient-boosted model identifies two candidate-prioritization criteria: compact unit cells and magnetic sublattices that sustain sizable local moments. Guided by these trends, we screen tetragonal $A_2XY$ Heusler compounds in space group $P4/mmm$. Among 307 structures, symmetry identifies 169 altermagnetic arrangements, of which 157 remain metallic altermagnets in DFT. Sixteen realize an altermagnetic collinear ground state, of which 15 are dynamically and mechanically stable and 10 also lie on or below the calculated thermodynamic hull. Six candidates exceed the CrSb splitting obtained under the same computational protocol, led by Co$_2$AlSc ($\\Delta_\\mathrm{max}=2.24$~eV) and F d favorable tunneling magnetoresistance.", "Demonstrates high-throughput DFT data utilization for targeted material discovery.", "Provides a concrete material roadmap for experimental altermagnetism research."]}}, {"title": "Twinning of domains and spin anisotropy in K5Fe4Ag6Te10 (Phys. Rev. B)", "journal": "arXiv_CondMat", "source": "author whitelist", "link": "https://arxiv.org/abs/2609.15290", "authors": "Jiayu Guo, Hengyang Zhong, Dongsheng Yuan, et al.", "last_authors": "Jincheng Wang, Yu Song", "summary": "The Fe-based superconductors are derived from metallic parent compounds with nematic and stripe magnetic orders, which lead to two types of magnetic domains. Recently it was found that K$_5$Fe$_4$Ag$_6$Te$_{10}$ (KFAT), an Fe-based semiconductor, exhibits similar nematic and stripe magnetic orders, and is thus an analogue to the Fe-based superconductors in the limit of localized electrons. In this work, the superstructure and magnetic domains of KFAT are elucidated by fully mapping the reciprocal space using time-of-flight single crystal neutron diffraction. In KFAT, Fe and Ag atoms order to form a $\\sqrt{5}\\times\\sqrt{5}$ superstructure containing $2\\times2$ Fe blocks, which leads to two superstructure domains with identical main Bragg peaks but distinct superstructure peaks. Below $T_{\\rm N}\\approx35$~K, magnetic and nematic orders break in-plane rotational symmetry of the tetragonal $\\sqrt{5}\\times\\sqrt{5}$ superstructure, and further give rise to two magnetic domains. These four equally populated domains account for the complex scattering pattern observed in our time-of-flight elastic neutron scattering measurements. Using polarized neutron scattering, we demonstrate a prominent spin anisotropy with an easy-plane spanned by the $c$-axis and the intra-block antiferromagnetic Fe-Fe bond direction. Such an anisotropy at ${\\bf q}\\neq0$ persists well above $T_{\\rm N}$, accounts for the in-plane ${\\bf q}=0$ magnetic anisotropy observed in uniaxial superconductivity in kagome lattices.", "Contributes to understanding the bosonic modes involved in the superconducting transition."]}}, {"title": "Band-Saddle-Point Engineering in Mixed A-site AV3Sb5 Kagome Metals", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2609.15196", "authors": "Maxim Wenzel, Alexander A. Tsirlin, Andrea N. Capa Salinas, et al.", "last_authors": "Ece Uykur, Martin Dressel", "summary": "$A$V$_3$Sb$_5$ compounds ($A$ = K, Rb, Cs) offer an experimental platform for probing the physics of kagome metals near ideal Van Hove filling. Here, we use optical spectroscopy on $A$V$_3$Sb$_5$ with mixed $A$-site compositions to reveal the effect of the alkali metal on the low-energy electronic structure. Supported by density-functional-theory calculations, we identify a band-saddle-point inversion as a chemical consequence of Cs substitution, revealing that $A$-site composition controls the orbital character of Van Hove singularities, Fermi surface topology, and electron-phonon interactions while leaving the kagome layer intact.", "tier": "B_IMPORTANT_CONDMAT", "score": "10", "reason": "Direct study of AV3Sb5 kagome metals band engineering relevant to project goals.; demoted from A: broad CM, not direct user/project hit", "tags": ["material", "kagome", "ARPES", "electronic_structure"], "image": "https://arxiv.org/html/2609.15196v1/Fig1.png", "briefing": {"background": "AV3Sb5 계열의 카고메 금속은 반 금속(Van Hove) 특이점 근처의 페르미 준위로 인해 초전도성, 전하 밀도 파(CDW), 위상 물성 등이 복합적으로 나타나는 중요한 연구 대상입니다.", "motivation": "A-site(K, Rb, Cs) 치환을 통해 격자 상수를 제어함으로써, 카고메 층의 전자 구조와 반 금속 특이점(Van Hove singularities)의 궤도 특성이 어떻게 변화하는지 규명하고자 합니다.", "result": "광학 분광법과 DFT 계산을 통해 Cs 치환이 밴드 안장점(band-saddle-point)의 반전을 유도하며, 이것이 페르미 표면의 위상과 전자-포논 상호작용을 결정짓는 핵심 기제임을 확인했습니다.", "implication": "A-site 엔지니어링이 카고메 격자 자체를 파괴하지 않으면서도 전자 상태를 정밀하게 튜닝할 수 있는 효과적인 도구임을 입증했습니다.", "novelty": "혼합 A-site 조성을 통해 Van Hove 특이점의 궤도 성분을 제어할 수 있음을 보여주었으며, 이는 AV3Sb5 계열의 물성 제어 연구에 중요한 단서를 제공합니다.", "unresolved": "이러한 밴드 재구성이 CDW 전이 온도나 초전도 특성에 미치는 정량적인 상관관계는 추가 연구가 필요합니다.", "future_work": "치환 농도에 따른 페르미 표면의 상세 변화를 ARPES로 직접 관측하고, 이에 따른 초전도 특성 변화를 전자기적 측정으로 확인하는 작업이 필요합니다.", "concepts": [{"term": "Van Hove 특이점", "why_emerged": "상태 밀도(DOS)가 발산하거나 급격히 변하는 지점으로, 상관관계가 강한 물질에서 물성을 결정하는 핵심 지표로 사용됩니다.", "origin": "Leon Van Hove (1953년)", "connections": "카고메 금속의 CDW, 초전도성 및 강한 전자 상관관계 이론과 직접적으로 연결됩니다."}, {"term": "A-site 엔지니어링", "why_emerged": "구조적 변형을 최소화하면서 밴드 구조를 제어하기 위한 화학적 치환 방법입니다.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "밴드갭 제어 및 위상 물성 최적화 연구와 연결됩니다."}], "english_summary": ["Investigated the effect of A-site substitution in AV3Sb5 kagome metals using optical spectroscopy.", "Identified a band-saddle-point inversion driven by Cs substitution.", "Confirmed that A-site composition tunes orbital character and Fermi surface topology without disrupting the kagome layer."]}}, {"title": "Kagome lattice candidate URhSn: Measured Bragg diffraction patterns and theory for hexagonal and trigonal Sohncke phases", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2609.14429", "authors": "S. W. Lovesey, D. D. Khalyavin", "last_authors": "S. W. Lovesey, D. D. Khalyavin", "summary": "Ternary intermetallics use a ZrNiAl-type chemical structure known as a kagome system. Complexity observed in the phase diagrams of these compounds is attributed to the geometric frustration. The 5f-electron compound URhSn exhibits two phase transitions at 16 K and 54 K. No super-lattice reflections in neutron powder diffraction patterns are detected in the intermediate range of temperatures (16 K - 54 K). Recent resonant x-ray diffraction patterns for uranium ions in the intermediate phase suggest a chiral structure and a trigonal Sohncke space group. It is firmly established that a simple hexagonal space group describes the parent structure at room temperature. A ferroic order parameter that includes hexadecapoles is shown to characterize the trigonal Sohncke phase. Resonant x-ray diffraction by this phase is fully investigated with our symmetry informed theory. It repairs symmetry in the original data analysis by using a grey group, and it lifts an unjustified spatial condition on uranium positions. The theory uses axial atomic multipoles that satisfy sum-rules established in the first instance for x-ray dichroic signals. A confrontation between observed and calculated diffraction patterns lends support to a trigonal Sohncke phase, and exposes grounds for additional experimental work on an enigmatic compound.", "tier": "B_IMPORTANT_CONDMAT", "score": "10", "reason": "Directly focuses on kagome lattice symmetry breaking and chiral phases in an intermetallic compound.; demoted from A: broad CM, not direct user/project hit", "tags": ["material", "kagome", "hiddenorder"], "image": "https://arxiv.org/static/browse/0.3.4/images/arxiv-logo-fb.png", "briefing": {"background": "ZrNiAl 구조를 가진 삼원계 금속 화합물은 기하학적 좌절(frustration)로 인해 복잡한 자기적, 구조적 상전이를 나타내며, 이는 고전적인 Landau 이론을 넘어서는 물성을 탐구하는 플랫폼입니다.", "motivation": "URhSn 화합물의 16K와 54K에서 일어나는 상전이의 미시적 대칭성을 이해하고, 특히 중간 온도 범위에서 제기된 카이랄(chiral) 구조와 Sohncke 대칭성의 실체를 규명하고자 합니다.", "result": "대칭성을 고려한 회절 이론을 통해 URhSn의 중간 상이 삼각(trigonal) Sohncke 군에 해당함을 확인하고, 이때 헥사데카폴(hexadecapole)을 포함한 페로이적 질서 매개변수가 중요하게 작용함을 제시했습니다.", "implication": "단순 육방정계로 알려진 모구조가 특정 온도 범위에서 더 낮은 대칭성으로 깨지는 현상을 이론적으로 설명하여, 숨겨진 질서(hidden order) 연구의 모델이 될 수 있습니다.", "novelty": "기존 데이터 분석의 대칭성 오류를 바로잡고, 헥사데카폴과 같은 고차 다중극자가 물리적 상전이에 기여함을 이론적으로 정당화했습니다.", "unresolved": "제시된 삼각 Sohncke 위상에 대한 직접적인 실험적 확증과 해당 위상의 동역학적 특성은 여전히 과제로 남아 있습니다.", "future_work": "공명 X-선 회절을 통한 추가적인 구조 정밀화 작업과 헥사데카폴 질서의 실험적 검증이 필요합니다.", "concepts": [{"term": "Sohncke 공간군", "why_emerged": "카이랄 구조를 가진 결정을 분류하기 위해 필요한 대칭성 그룹입니다.", "origin": "Leonhard Sohncke (19세기 말)", "connections": "위상 물질의 카이랄성과 자기적 질서 연구에 응용됩니다."}, {"term": "헥사데카폴(Hexadecapole)", "why_emerged": "단극자나 쌍극자로 설명되지 않는 복잡한 전자/자기적 질서 상태를 설명하기 위해 도입되었습니다.", "origin": "초록 정보만으로는 특정하기 어려움", "con ng-lived relaxation channel and exciton-phonon coupling in Ta2NiSe5 via nondegenerate pump-probe spectroscopy", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/2gm1-9qv6", "authors": "Poulami Ghosh, Anupama Chauhan, Sidhanta Sahu, Sk Kalimuddin, Mintu Mondal, N. Kamaraju", "last_authors": "Mintu Mondal, N. Kamaraju", "summary": "An excitonic insulator represents a quantum phase in which spontaneous condensation of excitons leads to novel many-body phenomena. ${\\mathrm{Ta}}_{2}{\\mathrm{NiSe}}_{5}$ (TNSe), a layered narrow-gap semiconductor, has emerged as a model platform to probe these correlated excitonic phases and their …", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Spectroscopic study on excitonic insulator, highly relevant for correlated materials interest.", "tags": ["spectroscopy", "correlated", "excitonic-insulator"], "image": "", "briefing": {"background": "Ta2NiSe5(TNSe)는 전자와 정공이 결합하여 응축된 상태인 엑시톤 절연체(excitonic insulator) 후보 물질로, 강상관 전자계 연구의 핵심 플랫폼 중 하나입니다.", "motivation": "엑시톤 절연체 상태에서의 전자-격자 상호작용과 이완 메커니즘을 비평형 시간 분해 분광법(pump-probe)으로 규명하고자 했습니다.", "result": "TNSe에서 장수명 이완 채널을 관측했으며, 이는 엑시톤-포논 결합이 물질의 여기 상태 역학을 지배함을 보여줍니다.", "implication": "TNSe의 엑시톤 절연체 위상과 상전이 특성을 이해하는 데 중요한 동역학적 증거를 제공합니다.", "novelty": "시간 분해 분광법을 통해 엑시톤-포논 결합의 구체적인 이완 모드를 식별하여, 강상관 물질의 비평형 특성을 연구하는 독자에게 유익합니다.", "unresolved": "관측된 장수명 채널이 엑시톤 응축과 격자 왜곡 사이의 상호작용 중 정확히 어떤 미시적 기작에 기인하는지는 여전히 논의의 여지가 있습니다.", "future_work": "다른 엑시톤 절연체 후보 물질과의 비교 연구 및 레이저 파워/온도 변화에 따른 결합 상수 변화의 정밀 측정이 필요합니다.", "concepts": [{"term": "엑시톤 절연체", "why_emerged": "밴드갭이 작거나 겹치는 반도체에서 전자-정공 인력이 매우 클 때, 두 입자가 결합해 바닥 상태를 형성하는 현상을 설명하기 위해 제안되었습니다.", "origin": "Knox (1963) 등이 초기 이론 제시.", "connections": "강상관 전자계, 전하 밀도 파(CDW), Mott 절연체와 연결됩니다."}, {"term": "Pump-probe 분광법", "why_emerged": "물질 내 입자들의 초고속 동역학적 거동(펨토초 단위)을 직접 추적하기 위해 개발되었습니다.", "origin": "Zewail(노벨상 수상) 등이 확립.", "connections": "시간 분해 ARPES, RIXS 등의 분광법과 결합하여 다체계 물성 연구에 활용됩니다."}], "english_summary": ["Ta2NiSe5 is investigated as a candidate for an excitonic insulator using non-degenerate pump-probe spectroscopy.", "The study identifies long-lived relaxation channels driven by exciton-phonon coupling.", "These findings clarify the dynamics of collective electronic phases in correlated materials.", "The results offer insights into the relationship between electronic order and lattice distortions in TNSe."]}}, {"title": "Spin-orbit coupling effects in altermagnets: Interplay of weak spin and orbital ferromagnetism with relativistic splitting of electron states", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/dyg2-5578", "authors": "L. M. Sandratskii, K. Carva, V. M. Silkin", "last_authors": "K. Carva, V. M. Silkin", "summary": "The novel class of collinear compensated magnets, dubbed altermagnets, has attracted immense research attention by the property of nonrelativistic spin splitting. More recently, the properties of altermagnets caused by relativistic spin-orbit coupling (SOC) became the topic of many investigations. T…", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Altermagnetism is a topic explicitly noted in the user profile.", "tags": ["altermagnet", "spin-orbit-coupling", "ferromagnetism"], "image": "", "briefing": {"background": "Altermagnet(알터자석)은 최근 새롭게 정의된 자성체 부류로, 상대론적 효과 없이도 스핀 분리(spin splitting)를 보이는 독특한 반강자성 특성을 가집니다.", "motivation": "알터자석에서 스핀-궤도 결합(SOC)이 포함되었을 때 나타나는 전자의 상대론적 상태 분리와 자성 특성 변화를 이론적으로 체계화하고자 했습니다.", "result": "SOC가 알터자석의 비상대론적 스핀 분리에 미치는 영향을 분석하여, 약한 스핀/궤도 강자성 특성이 어떻게 동반되는지 규명했습니다.", "implication": "알터자석 연구에서 SOC 효과를 무시할 수 없으며, 이를 고려해야 정확한 스핀트로닉스 소자 설계가 가능함을 시사합니다.", "novelty": "알터자석의 순수 비상대론적 물리와 SOC에 의한 상대론적 물리 사이의 상호작용을 정교하게 구분하여, 관련 이론적 토대를 확장했습니다.", "unresolved": "실제 실험에서 이러한 미세한 SOC 효과를 분리하여 검출할 수 있는 명확한 관측 방법론은 아직 부족합니다.", "future_work": "구체적인 알터자석 후보 물질에서의 밴드 구조 계산 및 ARPES를 통한 SOC 효과 검증 실험이 기대됩니다.", "concepts": [{"term": "알터자석", "why_emerged": "강자성체와 반강자성체의 경계에서, 스핀 보상(compensated 출했습니다.", "unresolved": "실제 합성된 WSe2 이중층의 격자 이완(lattice relaxation) 효과가 위상 에지 상태의 안정성에 미치는 영향은 추가 연구가 필요합니다.", "future_work": "다양한 전이금속 디칼코게나이드(TMD) 이중층으로 확장하여 위상적 성질의 튜닝 가능성을 실험적으로 탐색할 것입니다.", "concepts": [{"term": "모아레 밴드", "why_emerged": "이종 구조 내의 층간 회전으로 인해 발생하는 거대한 실공간 주기가 전자 에너지 밴드를 극도로 좁게 만들어 강상관 효과를 유도하기 위해 필요했습니다.", "origin": "Bistritzer and MacDonald (2011) 등.", "connections": "트위스트 이중층 그래핀, 초전도체, Correlated Insulator와 연결됩니다."}, {"term": "위상 엣지 상태", "why_emerged": "위상적으로 자명하지 않은 물질의 경계에서 나타나는, 외부 섭동에 강인한 전도 채널을 설명하기 위해 필요했습니다.", "origin": "Hasan and Kane (2010) 등.", "connections": "양자 홀 효과, 위상 절연체, 스핀트로닉스와 연결됩니다."}], "english_summary": ["The study examines twisted bilayer WSe2 using a continuum moiré model.", "A method to treat finite geometries avoids momentum-space formulation limits.", "Topological edge states are identified within this twisted bilayer system.", "The findings provide a framework for modeling topological properties in moiré superlattices."]}}, {"title": "Valley- and spin-dependent electronic and transport properties of two-dimensional altermagnetic titanium-based chalcogenide halides", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/1qxd-f6dt", "authors": "Ruo-Yu Ning, Zhi-Hua Yan, Jin-Yang Li, Yong-Kun Wang, Si Li", "last_authors": "Yong-Kun Wang, Si Li", "summary": "Altermagnets (AMs) combine fully compensated magnetization with momentum-dependent spin splitting, yet intrinsic altermagnetic materials exhibiting exceptional valley characteristics remain scarce. Here, we identify monolayer titanium-based chalcogenide halides, ${\\mathrm{Ti}}_{2}{X}_{2}Y$ ($X=\\math…", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Direct relevance to altermagnetism and transport in 2D materials.", "tags": ["altermagnetism", "2D-materials", "transport"], "image": "", "briefing": {"background": "알터마그네틱(Altermagnetism)은 자화가 상쇄되어 전체 자기 모멘트가 0이면서도, 운동량 공간에서 스핀 분할이 발생하는 새로운 자기 상으로, 스핀트로닉스 응용을 위한 차세대 소재로 주목받고 있습니다.", "motivation": "기존의 알터마그네틱 후보군이 제한적인 상황에서, 2차원 소재로서 독특한 밸리(valley) 특성과 스핀 분할을 동시에 갖는 소재를 탐색하고자 함.", "result": "제1원리 계산을 통해 Ti2X2Y (X=S, Se; Y=I, Br) 단층 구조가 알터마그네틱 특성을 가지며, 강한 밸리 분할과 스핀 의존적 수송 특성을 나타냄을 확인.", "implication": "해당 물질이 밸리트로닉스와 스핀트로닉스를 결합한 소자 구현의 플랫폼이 될 수 있음을 시사.", "novelty": "2차원 알터마그네틱 물질로서 밸리-스핀 자유도를 제어할 수 있는 가능성을 제시한 점이 독자에게 흥미로운 연구임.", "unresolved": "실제 단층 물질을 합성하고 이를 실험적으로 검증(예: ARPES를 통한 밴드 구조 확인)하는 과정은 남아있음.", "future_work": "실제 박리 또는 성장 공정을 통한 소자화 및 전기적 수송 특성의 실험적 증명이 필요함.", "concepts": [{"term": "Altermagnetism", "why_emerged": "강자성체와 반강자성체의 한계를 극복하고 두 가지 장점을 결합하기 위해 제안됨.", "origin": "초록 정보만으로는 특정하기 어려움 (최근 2020년대 초반 이론적으로 확립).", "connections": "반강자성체, 스핀트로닉스, 비상반적 수송 현상."}, {"term": "Valleytronics", "why_emerged": "전자의 전하와 스핀 외에 밸리(운동량 공간의 극소점) 자유도를 정보 처리에 활용하기 위해 제안됨.", "origin": "그래핀 등 2차원 물질 연구에서 시초.", "connections": "2차원 물질, 베리 곡률, 토폴로지."}], "english_summary": ["Identifies monolayer Ti2X2Y as a new class of 2D altermagnets.", "Demonstrates momentum-dependent spin splitting and valley-dependent transport properties.", "Proposes these materials as platforms for spintronics and valleytronics applications.", "Utilizes first-principles calculations to predict electronic and magnetic behaviors."]}}, {"title": "Winding feature and thermal evolution of the gapped Dirac magnons in CrI3", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/1rmh-8msr", "authors": "Weiliang Yao, Matthew B. Stone, Colin L. Sarkis, et al.", "last_authors": "Xingye Lu, Pengcheng Dai", "summary": "Here, the authors use inelastic neutron scattering to investigate gapped Dirac magnons in the van der Waals ferromagnet CrI 3 . With high-quality single crystals, they directly resolve the characteristic winding of magnon spectral weight around the K point of the hexagonal Brillouin zone, which provides a key signature of Dirac magnons. The authors further show that the magnon energies exhibit an approximately T 2 thermal renormalization, consistent with magnon-magnon interactions.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Direct neutron scattering study of topological magnons in a 2D van der Waals magnet.", "tags": ["magnetism", "neutron-scattering", "topology"], "image": "", "briefing": {"background": "반데르발스 자성체는 2차원 극한의 자성을 연구하는 중요한 플랫폼이며, 이들에서 나타나는 토폴로지적 자성 여기(magnon)는 위상물리학의 관점에서 큰 관심을 끌고 있습니다.", "motivation": "2차원 자성체 CrI3 내의 Dirac 마그논이 가진 위상적 성질과 그 열적 안정성을 실험적으로 규명하고자 함.", "result": "비탄성 중성자 산란 실험을 통해 K 포인트 주변에서 마그논 스펙트럼의 와인딩(winding) 특성을 직접 관측하고, 마그논 에너지의 온도의존성이 magnon-magnon 상호작용에 기인함을 밝힘.", "implication": "2차원 자성체에서 토폴로지적 마그논의 물리적 실재를 입증하고, 마그논 스핀트로닉스 소자 설계에 중요한 기초 자료를 제공함.", "novelty": "강자성 CrI3에서 직접적으로 위상적 마그논의 특징을 시각화했다는 점이 독자의 중성자 산란 및 위상물질 관심사와 직결됨.", "unresolved": "강한 자기장 하에서의 마그논 위상 변화나 도핑에 따른 특성 변화는 추가 연구가 필요함.", "future_work": "다른 2차원 자성체로의 확장 및 마그논 수송 실험을 통한 위상적 효과 검증.", "concepts": [{"term": "Dirac Magnons", "why_emerged": "전자 시스템의 Dirac 페르미온과 유사하게 마그논 스펙트럼에서 선형 분산 관계를 설명하기 위해 도입됨.", "origin": "토폴로지 위상 물리 연구의 확장.", "connections": "토폴로지 자성체, 중성자 산란, 마그논 밴드 구조."}, {"term": "Inelastic Neutron Scattering", "why_emerged": "물질 내의 원자 및 스핀의 동역학적 특성(분산 관계)을 직접 측정하기 위해 필수적임.", "origin": "중성자 물리 실험 초기 단계부터 발전.", "connections": "스핀 파(Spin wave), 마그논, 격자 진동."}], "english_summary": ["Resolves winding features of Dirac magnons in the van der Waals ferromagnet CrI3.", "Uses inelastic neutron scattering to provide direct evidence of topological magnon excitations.", "Observes T-squared thermal renormalization consistent with magnon-magnon interactions.", "Confirms the robustness and topological nature of magnons in 2D systems."]}}, {"title": "Competing Ordering Modes in the Distorted Quantum Kagome Material Clinoatacamite Cu2Cl(OH)3", "journal": "PRL_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/xmh8-68vk", "authors": "L. Stödter, C. Kastner, H. O. Jeschke, et al.", "last_authors": "U. K. Rößler, S. Süllow", "summary": "We have studied the magnetic properties of clinoatacamite Cu 2 Cl ( OH ) 3 , the parent compound of the quantum spin liquid candidate herbertsmithite and a long-standing puzzle among frustrated quantum magnets. As we reveal using density-functional theory, clinoatacamite belongs to the class of distorted kagome antiferromagnets with the kagome plane being embedded into a low-symmetry crystal structure. By means of thermodynamic measurements, muon spin rotation and relaxation, as well as neutron diffraction on single crystals, we find in zero magnetic field complex behavior below T I = 18.1 K which unfolds in three temperature regions I–III. We propose this complexity in multicritical clinoatacamite to arise from the competition of antiferromagnetic ordering modes from the underconstrained manifold of modes, which can lead to a metamagnetic texture in zero field.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Relevant study of a quantum kagome material and its electronic structure.", "tags": ["kagome", "DFT", "magnetism"], "image": "", "briefing": {"background": "카고메(Kagome) 격자는 기하학적 좌절(frustration)이 극대화된 구조로, 양자 스핀 액체나 특이한 자기 질서 등 풍부한 양자 물리 현상의 온상입니다.", "motivation": "유명한 양자 스핀 액체 후보 물질인 허버트스미타이트(herbertsmithite)의 모물질인 클리노아타카마이트의 자기적 복잡성을 해명하고자 함.", "result": "낮은 대칭성을 가진 왜곡된 카고메 격자임을 밝히고, 자기적 질서 모드들이 서로 경쟁하며 나타나는 메타자성 텍스처(metamagnetic texture)를 발견함.", "implication": "단순한 카고메 격자가 아닌 왜곡된 구조에서의 자기적 경쟁이 복잡한 위상과 질서를 유도함을 시사함.", "novelty": "카고메 물질의 구조 왜곡과 자기적 질서의 복잡한 경쟁 관계를 정밀하게 분석하여, 기존의 카고메 금속/절연체 연구의 이해를 심화함.", "unresolved": "왜 특정 조건에서 양자 스핀 액체가 아닌 자기 질서가 지배적인지에 대한 완전한 미시적 메커니즘은 여전히 논쟁적임.", "future_work": "이러한 자기 질서와 전도성(금속성 카고메의 경우)의 상관관계를 다루는 후속 연구 예상.", "concepts": [{"term": "Kagome Lattice", "why_emerged": "삼각 격자보다 더 큰 기하학적 좌절을 구현하여 양자 상태를 유도하기 위해 연구됨.", "origin": "전통적인 기하학적 좌절 연구에서 유래.", "connections": "양자 스핀 액체, 카고메 금속, AV3Sb5 화합물."}, {"term": "Quantum Spin Liquid", "why_emerged": "절대 영도 근처에서도 스핀의 장거리 질서가 사라지고 양자 얽힘이 존재하는 상태를 찾기 위해 제안됨.", "origin": "P. W. Anderson(1973) 등에 의해 제안.", "connections": "고온 초전도체, 기하학적 좌절, 비전통적 자성체."}], "english_summary": ["Investigates the magnetic properties of clinoatacamite, a distorted kagome antiferromagnet.", "Identifies competition between magnetic ordering modes in the low-symmetry crystal structure.", "Combines DFT, thermodynamics, and muon spin rotation to map out the complex magnetic phase.", "Provides insights into the 'underconstrained' magnetic manifold of kagome systems."]}}, {"title": "Disorder-Driven Enhancement of Coulomb Repulsion Governs the Superconducting Dome in Ionic-Liquid-Gated Quasi-2D Materials", "journal": "PRL_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/ld98-qv7p", "authors": "Giovanni Marini, Pierluigi Cudazzo, Matteo Calandra", "last_authors": "Pierluigi Cudazzo, Matteo Calandra", "summary": "Disorder-driven fluctuations enhance repulsive Coulomb interaction and form a superconducting dome in ionic-liquid-gated few-layer transition metal dichalcogenides.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Investigates unconventional superconductivity and disorder in quasi-2D materials.", "tags": ["superconductivity", "2Dmaterials", "disorder", "vanderWaals", "experimental"], "image": "", "briefing": {"background": "준이차원(Quasi-2D) 전이금속 디칼코게나이드(TMD) 시스템에서 이온 액체 게이팅을 통한 캐리어 농도 조절은 초전도 상태를 유도하는 핵심 기법입니다. 이 과정에서 나타나는 초전도 돔(superconducting dome) 현상의 기원을 이해하는 것은 강상관 전자계 연구의 중요 과제입니다.", "motivation": "이온 액체 게이팅 과정에서 불가피하게 발생하는 무질서(disorder)가 어떻게 전자 간의 쿨롱 반발력을 변화시키고, 최종적으로 초전도 돔 현상을 형성하는지 이론적으로 규명하고자 합니다.", "result": "무질서로 인한 전자-전자 쿨롱 반발의 강화가 초전도 돔 현상의 핵심적인 지배 인자임을 보였습니다.", "implication": "TMD 소자에서 나타나는 초전도 특성이 단순히 페르미 준위 조절뿐만 아니라, 무질서에 따른 전자 상관 관계의 변화에 의해 정교하게 제어될 수 있음을 시사합니다.", "novelty": "실험적으로 관측되던 초전도 돔을 무질서와 쿨롱 반발력의 상호작용으로 연결하여 2D 초전도 연구에 새로운 물리적 메커니즘을 제시했습니다.", "unresolved": "실제 실험에서 발생하는 구체적인 무질서의 종류(불순물, 격자 결함 등)와 초전도 갭의 symmetry 변화에 대한 상세한 상관관계는 여전히 논의가 필요합니다.", "future_work": "다양한 TMD 물질군에서 무질서도를 정량적으로 제어하며 초전도 특성을 측정하는 비교 연구가 기대됩니다.", "concepts": [{"term": "Ionic-   appendBriefSection(briefing, "Why it's important / Novelty", b.novelty);
  appendBriefSection(briefing, 'Unresolved Questions', b.unresolved);
  appendBriefSection(briefing, 'Expected Future Work', b.future_work);
  if (b.concepts && b.concepts.length) {
    const section = document.createElement('section');
    section.className = 'brief-section wide';
    section.appendChild(textEl('h2', '', 'Concepts / Terms'));
    const concepts = document.createElement('div');
    concepts.className = 'concepts';
    b.concepts.forEach(c => {
      const item = document.createElement('div');
      item.className = 'concept';
      item.appendChild(textEl('h3', '', c.term || 'Concept'));
      [['왜 생겼나: ', c.why_emerged], ['누가 만들었나: ', c.origin], ['연결되는 흐름: ', c.connections]].forEach(([label, text]) => { if (!text) return; const p = document.createElement('p'); const bold = textEl('b', '', label); p.appendChild(bold); p.append(text); item.appendChild(p); });
      concepts.appendChild(item);
    });
    section.appendChild(concepts);
    briefing.appendChild(section);
  }
  if (b.english_summary && b.english_summary.length) { const section = document.createElement('section'); section.className = 'brief-section wide'; section.appendChild(textEl('h2', '', 'English Summary')); const ul = document.createElement('ul'); b.english_summary.slice(0, 5).forEach(line => ul.appendChild(textEl('li', '', line))); section.appendChild(ul); briefing.appendChild(section); }
  slideEl.appendChild(briefing);
  counterEl.textContent = `${index + 1} / ${slides.length}`;
  prevBtn.disabled = index === 0;
  nextBtn.disabled = index === slides.length - 1;
}
prevBtn.addEventListener('click', () => { index = Math.max(0, index - 1); render(); });
nextBtn.addEventListener('click', () => { index = Math.min(slides.length - 1, index + 1); render(); });
document.addEventListener('keydown', event => { if (event.key === 'ArrowLeft') prevBtn.click(); if (event.key === 'ArrowRight') nextBtn.click(); });
render();
</script>
</body>
</html>
