<title>Daily Paper Slideshow</title>
<style>
  :root {
    color-scheme: light;
    --bg: #f6f7f4;
    --paper: #ffffff;
    --ink: #111827;
    --muted: #64748b;
    --line: #d8ddd2;
    --accent: #176b87;
    --accent-2: #9a3412;
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; overflow: auto; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: var(--bg); color: var(--ink); }
  .shell { max-width: 1500px; min-height: 100vh; margin: 0 auto; padding: 14px 18px; display: flex; flex-direction: column; }
  .topbar { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 16px; }
  .top-actions { display: flex; align-items: center; gap: 10px; }
  .topbar a, button { border: 1px solid var(--line); border-radius: 8px; background: var(--paper); color: var(--ink); padding: 10px 14px; font-weight: 700; text-decoration: none; cursor: pointer; }
  button.primary { background: var(--accent); border-color: var(--accent); color: white; }
  button:disabled { opacity: 0.45; cursor: not-allowed; }
  .counter { color: var(--muted); font-weight: 700; }
  .slide { min-height: calc(100vh - 82px); background: var(--paper); border: 1px solid var(--line); border-radius: 10px; padding: 18px; box-shadow: 0 18px 42px rgba(15, 23, 42, 0.10); display: grid; grid-template-columns: minmax(310px, 0.86fr) minmax(0, 1.55fr); gap: 18px; overflow: visible; }
  .paper-head { min-width: 0; min-height: 0; overflow: visible; display: flex; flex-direction: column; gap: 12px; }
  .figure { margin: 0; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: #f8fafc; }
  .figure img { display: block; width: 100%; max-height: 41vh; object-fit: contain; background: white; }
  .figure figcaption { padding: 7px 10px; color: var(--muted); font-size: 12px; line-height: 1.3; }
  .head-text { display: flex; flex-direction: column; gap: 9px; min-width: 0; }
  .badges { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .badge { border-radius: 999px; padding: 5px 9px; background: #eef2ff; color: #3730a3; font-size: 12px; font-weight: 800; }
  .score { background: #fee2e2; color: #991b1b; }
  h1 { margin: 0; font-size: 25px; line-height: 1.15; letter-spacing: 0; overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
  h1 a { color: inherit; text-decoration-color: rgba(23, 107, 135, 0.35); text-decoration-thickness: 2px; text-underline-offset: 4px; }
  h1 a:hover { color: var(--accent); text-decoration-color: var(--accent); }
  .meta, .authors, .why, .abstract { font-size: 13px; line-height: 1.45; }
  .meta, .authors { color: var(--muted); }
  .why strong, .abstract strong, .authors strong { color: var(--ink); }
  .authors { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .why { border-left: 4px solid var(--accent-2); padding-left: 10px; color: #374151; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .abstract { border-top: 1px solid var(--line); padding-top: 14px; color: #374151; }
  .original-abstract { border-top: 1px solid var(--line); padding-top: 10px; color: #374151; font-size: 11.5px; line-height: 1.35; overflow-wrap: anywhere; }
  .original-abstract strong { display: block; margin-bottom: 4px; color: var(--ink); }
  .tags { display: flex; flex-wrap: wrap; gap: 8px; }
  .tag { border-radius: 999px; padding: 4px 8px; background: #f1f5f9; color: #475569; font-size: 12px; font-weight: 700; }
  .head-text > .link { display: none; }
  .briefing { min-width: 0; min-height: 0; overflow: visible; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); grid-auto-rows: minmax(0, auto); align-content: start; gap: 11px 18px; border-top: 0; padding-top: 0; }
  .brief-section { min-width: 0; }
  .brief-section.wide { grid-column: 1 / -1; }
  .brief-section h2 { margin: 0 0 4px; font-size: 14px; line-height: 1.22; color: #0f766e; letter-spacing: 0; }
  .brief-section p, .brief-section li { margin: 0; font-size: 12.5px; line-height: 1.42; color: #1f2937; overflow-wrap: anywhere; }
  .brief-section ul { margin: 0; padding-left: 20px; }
  .concepts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 9px 14px; }
  .concept { border-top: 1px solid var(--line); padding-top: 7px; }
  .concept h3 { margin: 0 0 4px; font-size: 13px; color: #7c2d12; letter-spacing: 0; }
  .concept p { margin: 2px 0 0; font-size: 11.5px; line-height: 1.35; color: #374151; overflow-wrap: anywhere; }
  .concept b { color: #111827; }
  .link { color: var(--accent); font-weight: 800; text-decoration: none; }
  .empty { padding: 48px; background: var(--paper); border: 1px solid var(--line); border-radius: 12px; color: var(--muted); }
  @media (max-width: 860px) {
    .shell { padding: 14px; }
    .topbar, .top-actions { align-items: stretch; flex-direction: column; }
    .slide, .briefing, .concepts { grid-template-columns: 1fr; }
    .slide { min-height: auto; overflow: visible; display: grid; }
    h1 { font-size: 28px; }
  }
</style>

<script>
const slides = [{"title": "Vestigial chirality from fluctuating loop currents on the kagome lattice", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2609.19618", "authors": "Yin Shi, Xuande Bu, Sheng Meng", "last_authors": "Xuande Bu, Sheng Meng", "summary": "Multicomponent order can melt in stages, leaving a composite order after its primary constituents become short ranged. We study this possibility for commensurate three-$Q$ loop-current order on the kagome lattice. Large-scale cluster and parallel-tempering Monte Carlo simulations reveal direct and two-stage melting regimes in an effective fixed-amplitude sign model. In the latter regime, translation-sector domain walls proliferate before chirality-changing walls, restoring lattice translational symmetry while preserving long-range time-reversal-odd order. The primary $M$-point correlations are short ranged in this intermediate phase. The two-stage regime begins when the lowest-energy chirality-changing wall is only about $12$--$13\\%$ more costly than a same-chirality translation wall. Finite-size scaling of a stable amplitude-resolved Ginzburg--Landau theory shows that the phase survives amplitude relaxation. Our results establish a quantitative domain-wall criterion for vestigial loop-current order and a fluctuation route to time-reversal symmetry breaking without long-range loop-current Bragg order. This separation provides a possible thermodynamic framework for time-reversal-odd responses recently reported above the critical temperature for conventional charge-density-wave ordering in kagome metals.", "tier": "A_MUST_READ", "score": "10", "reason": "Direct relevance to kagome metals, loop currents, and TRSB above the CDW transition.", "tags": ["kagomemetal", "loopcurrent", "TRSB", "CDW"], "image": "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAsAAAAOCAYAAAD5YeaVAAAAAXNSR0IArs4c6QAAAAZiS0dEAP8A/wD/oL2nkwAAAAlwSFlzAAALEwAACxMBAJqcGAAAAAd0SU1FB9wKExQZLWTEaOUAAAAddEVYdENvbW1lbn e (boson) energies and single-particle (fermion) dispersion are comparable scales controlled by the electron density, leaving no small parameter for an adiabatic expansion. Moreover, because the magnetic Wigner crystal is not time-reversal invariant, the usual Cooper logarithmic divergence in the pairing susceptibility is absent, so the attraction must exceed a finite threshold for pairing to occur. These unusual features motivate a numerical experiment to see whether the crystal's own vibrations can bind electrons. We obtain the crystalline ground state and its collective mode spectrum within Hartree--Fock and time-dependent Hartree--Fock approximation, and derive the electron--phonon Hamiltonian using the quasiboson approximation. Solving the resulting two-electron problem, we find that phonon-mediated attraction exceeds the pairing threshold, with chiral $p$-wave pairing as the leading instability. Within these approximations, we show that collective modes of a Wigner crystal can indeed favor chiral pairing despite broken time-reversal symmetry. Our results provide an encouraging starting point for developing a full many-body theory to study electronic crystallization and superconductivity.", "tier": "B_IMPORTANT_CONDMAT", "score": "9", "reason": "Theoretical study of superconductivity and CDW in magnetic Wigner crystal in rhombohedral hexalayer graphene, links to experiment.; demoted from A: broad CM, not direct user/project hit", "tags": ["theory", "graphene", "superconductivity", "CDW", "magnetism", "Wignercrystal", "STM", "transport"], "image": "https://arxiv.org/html/2610.10710v1/fig1_bands.png", "briefing": {"background": "질화막(rhombohedral hexalayer graphene)과 같은 시스템에서는 전자 밀도가 낮을 때 쿨롱 상호작용으로 인해 전자가 결정화되는 위그너 결정(Wigner crystal) 상태가 나타나며, 이는 강상관 물리 연구의 핵심 주제 중 하나입니다.", "motivation": "자기적 위그너 결정 내부의 집단 모드(collective modes)가 일반적인 포논과 다른 방식으로 어떻게 초전도성을 유도할 수 있는지 이론적으로 탐구합니다.", "result": "자기적 위그너 결정의 집단 모드가 전자 쌍을 묶는 상호작용을 유도하여 키랄 p-파(p-wave) 초전도성을 이끌어낼 수 있음을 수치적으 ritical temperatures. Motivated by reports of van Hove singularities on the surface of PtBi$_2$-the first Weyl semimetal in which surface superconductivity was unequivocally linked to its Fermi arcs-we demonstrate how such singularities can be engineered through the deposition of a suitable additional layer. We find that the critical temperature becomes extremely sensitive to the exact value of the chemical potential, and values as large as 20 times the bulk $T_c$ can be achieved. More generally, our results demonstrate how topological protection can be exploited to manipulate surface electronic states, thereby opening experimentally accessible routes toward engineering high-temperature two-dimensional superconductivity and other exotic phases.", "tier": "B_IMPORTANT_CONDMAT", "score": "9", "reason": "High relevance: explores surface superconductivity and Fermi arcs in the Weyl semimetal PtBi2.; demoted from A: broad CM, not direct user/project hit", "tags": ["theory", "Weylsemimetal", "Fermiarcs"], "image": "https://arxiv.org/html/2604.26859v2/tb_with_cbar.png", "briefing": {"background": "Weyl 반금속(WSM)은 위상학적으로 보호되는 벌크 밴드 구조와 표면에 존재하는 페르미 아크(Fermi arc) 상태로 인해 차세대 양자 소자 후보로 주목받고 있습니다.", "motivation": "PtBi2와 같은 WSM에서 관측된 표면 초전도 현상이 페르미 아크와 연관되어 있다는 점에 착안하여, 표면 상태의 밴드 구조를 엔지니어링하여 고온 초전도 구현 가능성을 탐색하고자 했습니다.", "result": "외부 레이어 증착을 통해 표면의 반 호브 특이점(van Hove singularity)을 제어함으로써, 벌크 대비 최대 20배 높은 초전도 임계 온도(Tc)를 달성할 수 있음을 이론적으로 제시했습니다.", "implication": "위상학적 보호를 받는 표면 상태를 외부 조작을 통해 물리적 특성을 극대화할 수 있음을 보였으며, 이는 2차원 고온 초전도체 설계의 새로운 전략이 될 수 있습니다.", "novelty": "WSM의 페르미 아크를 단순히 관측하는 수준을 넘어, 이를 제어하여 초전도성을 능동적으로 엔지니어링하는 이론적 경로를 제시했다는 점이 독자 연구 분야(위상 물질, 초전도)에 매우 중요합니다.", "unresolved": "실제 실험적 증착 과정에서 표면의 위상학적 성질이 완벽하게 보존되는지, 그리고 계면에서의 불순물 효과가 Tc에 미치는 영향은 아직 명확하지 않습니다.", "future_work": "적절한 물질 조합을 통한 구체적인 소자 설계 및 실험적 박막 성장을 통한 Tc 향상 검증이 필요합니다.", "concepts": [{"term": "페르미 아크(Fermi arcs)", "why_emerged": "Weyl 반금속의 벌크 위상 불변량이 표면 상태에서 개방된 궤적(Fermi arc)을 형성하게 되며, 이는 전하 수송의 이방성을 설명하기 위 eev reflection is controlled by crystal orientation and Néel vector rotation.", "Provides a mechanism for realizing spin-dependent superconducting transport.", "Highlights the potential for spintronic applications based on altermagnets."]}}, {"title": "Magnetic-field-induced detwinning of orientational domains in altermagnet -MnTe: A single-crystal neutron diffraction study", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2610.13444", "authors": "Feihao Pan, Yishui Zhou, Sabreen Hammouda, et al.", "last_authors": "Oscar Fabelo, Yixi Su", "summary": "Altermagnets combine compensated magnetic order with momentum-dependent spin splitting, which makes them promising for future spintronic and magnonic applications, but their macroscopic responses can be strongly reduced by domain averaging. In hexagonal α \\alpha -MnTe, three symmetry-related in-plane Néel-vector orientations and their time-reversal counterparts form six magnetic domain states, complicating both magnetic structure determination and measurements of the chiral magnon response. Using single-crystal neutron diffraction, we show that an in-plane field applied along the [ − 1 , 1 , 0 ] [-1,1,0] direction produces a common magnetic domain orientation that saturates near μ 0 ​ H = 2 \\mu_{0}H=2 T. A constrained refinement of 61 nuclear and magnetic reflections collected at 2 K and 2 T yields 𝐌 | [ 1 , 1 , 0 ] \\mathbf{M}\\parallel[1,1,0] , an ordered moment of 4.62 ​ ( 8 ) ​ μ B 4.62(8)~\\mu_{\\mathrm{B}} per Mn, and an orientational domain population at r A : r B : r C = 0.97 : 0.03 ​ ( 5 ) : 0 r_{A}:r_{B}:r_{C}=0.97:0.03(5):0 that is compatible with a nearly complete alignment of orientational domains. Furthermore, an abnormal behaviour in the temperature dependence of the selected reflections is observed in 60–88 K, its microscopic origin is discussed within the context of possible intrinsic piezomagnetic or magnetoelastic effects. Because unpolarized diffraction neither distin urements.", "Addresses the challenge of domain averaging in characterizing altermagnet properties."]}}, {"title": "Symmetry-Enforced Topology and Van Hove Saddle Points in Hexagonal TiAs", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2610.12925", "authors": "Azizur Rahman, Shashi B Mishra, Sheraz Khan, et al.", "last_authors": "Min Zhang, Zahir Muhammad", "summary": "We report the first successful growth of stoichiometric hexagonal TiAs single crystals (space group P ​ 6 3 / m ​ m ​ c P6_{3}/mmc ) using chemical vapor transport and investigate their vibrational, electronic, topological, and magnetotransport properties. Polarized Raman spectroscopy identifies all four Raman-active phonon modes ( A 1 ​ g + E 1 ​ g + 2 ​ E 2 ​ g A_{1g}+E_{1g}+2E_{2g} ), consistent with the hexagonal crystal symmetry. First-principles calculations reveal nontrivial band topology characterized by a symmetry indicator ℤ 4 = 2 \\mathbb{Z}_{4}=2 and a strong topological index ν 0 = 1 \\nu_{0}=1 , together with symmetry-protected fourfold band degeneracies at the nonsymmorphic Brillouin-zone boundary. The Fermi surface exhibits an orbital-dependent crossover from quasi-two-dimensional cylindrical sheets to a corrugated three-dimensional structure along k z k_{z} . A Van Hove saddle point approximately 0.5 eV below the Fermi level along Γ ​ – ​ K \\Gamma\\text{--}K is associated with a neck-disrupting Lifshitz transition and enhanced density of states. Magnetotransport measurements reveal a pronounced twofold angular magnetoresistance, consistent with anisotropic Fermi-surface geometry and open cyclotron orbits. Hall measurements indicate uncompensated, hole-dominated transport, accounting for the absence of extreme magnetoresistance and contributing to the field-orientation-dependent Hall response. These results establish hexagonal TiAs as a platform for exploring the interplay of nonsymmorphic band topology, Van Hove singularities, and anisotropic electronic transport in transition-metal monopnictides.", "tier": "B_IMPORTANT_CONDMAT", "score": "9", "reason": "Electronic structure/transport of topological semimetal, highly relevant to user.", "tags": ["topological", "transport", "electronic-structure"], "image": "https://arxiv.org/html/2610.12925v1/fig1.png", "briefing": {"background": "위상 반금속(topological semimetals)은 대칭성에 의해 보호되는 밴드 교차를 통해 독특한 전자 구조와 수송 현상을 나타내는 물질군입니다. 특히 전이금속 단일 피크나이드(monopnictide) 계열은 높은 이동도와 특이한 자기 저항 특성으로 인해 차세대 위상 물질로 주목받고 있습니다.", "motivation": "육각형 구조를 가진 TiAs의 정확한 물리적 성질이 아직 보고되지 않았기에, 이 물질의 위상학적 성질과 전자 구조, 그리고 반호브 특이점(Van Hove singularity) 간의 상관관계를 체계적으로 규명하고자 연구를 수행했습니다.", "result": "TiAs가 위상학적으로 자명하지 않은(nontrivial) 밴드 구조를 가지며, 페르미 준위 아래에서 Van Hove 특이점이 나타나 Lifshitz 전이를 유도함을 확인했습니다. 또한 이방성 자기 저항과 hole 위주의 수송 현상을 관측했습니다.", "implication": "TiAs가 비공변(nonsymmorphic) 대칭성에 의해 보호되는 위상적 특성과 Van Hove 특이점이 공존하는 새로운 플랫폼임을 시사하며, 이는 전자 구조 조절을 통한 위상 물리 제어 연구에 중요한 토대가 됩니다.", "novelty": "육각형 TiAs 단결정을 최초로 성장시켜 기본 물성을 확립했다는 점과, 밴드 위상학적 지표와 수송 현상의 결합을 상세히 분석하여 이 물질의 위상학적 성격을 명확히 규명했다는 점에서 가치가 있습니다.", "unresolved": "Van Hove 특이점이 물리적 성질에 미치는 구체적인 영향력의 범위와, 외부 자극(압력 또는 도핑)에 따른 위상적 전이 가능성은 아직 완벽히 규명되지 않았습니다.", "future_work": "ARPES 등을 통한 직접적인 밴드 구조 관측과, 게이트 전압이나 압력을 활용하여 페르미 준위를 Van Hove 특이점 근처로 이동시켜 나타나는 양자 현상을 탐구할 것으로 예상됩니다.", "concepts": [{"term": "Van Hove singularity", "why_emerged": "상태 밀도(DOS)가 발산하는 지점으로, 상전이나 초전도성 등의 강상관 효과를 유도하는 핵심 기제로 필요했습니다.", "origin": "Léon Van Hove (1953)", "connections": "Lifshitz 전이, 평탄 밴드(Flat band), 강상관 초전도체"}, {"term": "Nonsymmorphic symmetry", "why_emerged": "결정 구조 내에서 격자 이동과 회전/반사가 결합된 대칭성으로, 위상학적 밴드 퇴화를 보호하는 근거로 사용됩니다.", "origin": "결정학의 고전 이론", "connections": "위상 절연체, 비전통적 대칭 보호 위상 물질"}, {"term": "Lifshitz transition", "why_emerged": "페르미 면의 위상학적 변화가 전자 수송 특성에 급격한 변화를 주는 현상을 설명하기 위해 제안되었습니다.", "origin": "Ilya Lifshitz (1960)", "connections": "Van Hove singularity, 강자성/반강자성 전이"}], "english_summary": ["First successful growth and characterization of hexagonal TiAs single crys ": "Alexander J. Grutter, Nurul Fitriyah, Brian B. Maranville, et al.", "last_authors": "Julie A. Borchers, A. Ariando", "summary": "High-temperature and high-magnetic-field-induced reentrant superconductivity has been discovered in the infinite-layer nickelate ${\\mathrm{Sm}}_{1−x−y}{\\text{Eu}}_{x}{\\text{Ca}}_{y}{\\text{NiO}}_{2}$ (SECNO). Infinite-layer nickelates are the closest known analogs of high-${T}_{c}$ cuprate supercondu…", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Experimental investigation of magnetic order in high-Tc infinite-layer nickelate superconductors.", "tags": ["experiment", "nickelate", "superconductivity"], "image": "", "briefing": {"background": "무한 층상(infinite-layer) 니켈산염은 고온 초전도체인 구리산염(cuprate)의 전자 구조와 유사하여, 고온 초전도 발현 메커니즘을 이해하기 위한 핵심적인 플랫폼으로 연구되고 있습니다.", "motivation": "SECNO 화합물에서 관측된 고자기장/고온 재진입 초전도 현상의 근본 원인을 파악하기 위해, 물질 내부의 자기적 질서와 순자화(net magnetization) 상태를 정밀하게 분석하고자 합니다.", "result": "SECNO 박막에서 자기적 질서가 균일하지 않으며, 특정 조성에서 순자화가 존재함을 실험적으로 밝혀냈습니다.", "implication": "니켈산염 초전도체에서 자기적 질서와 초전도성 사이의 상호작용이 복잡하게 얽혀 있으며, 자기적 불균일성이 초전도 특성에 영향을 줄 수 있음을 시사합니다.", "novelty": "구리산염과 유사한 고온 초전도성을 보이는 니켈산염에서 자기적 질서의 불균일성을 직접적으로 규명하여, 전자 상관관계 연구에 기여합니다.", "unresolved": "자기적 불균일성이 구체적으로 초전도 메커니즘에 어떻게 기여하거나 방해하는지에 대한 명확한 미시적 메커니즘은 여전히 미지수입니다.", "future_work": "다른 조성의 니켈산염에서의 자기적 특성 비교 및 자기적 도메인이 초전도 전이 온도와 결맞음 길이에 미치는 영향 연구가 필요합니다.", "concepts": [{"term": "Infinite-layer nickelates", "why_emerged": "구리산염과 유사한 3d 전자 구조를 가진 물질을 설계하여 고온 초전도성을 구현하기 위해 도입됨.", "origin": "2019년 Stanford의 Harold Hwang 그룹에 의해 발견됨.", "connections": "Cuprate superconductivity, Mott physics."}, {"term": "Net magnetization", "why_emerged": "물질 내부에 잔류하는 자기 모멘트의 합을 측정하여 자기적 상(phase)의 성격을 규명하기 위해 사용됨.", "origin": "고전 전자기학 및 자기학의 기본 개념.", "connections": "Ferromagnetism, Antiferromagnetism, Magnetic order."}], "english_summary": ["Infinite-layer nickelate SECNO exhibits complex magnetic properties.", "Experimental study reveals non-uniform magnetic order and net magnetization.", "Magnetic state is correlated with reentrant superconductivity phenomena.", "The findings highlight the role of magnetism in nickelate-based high-Tc superconductors."]}}, {"title": "Spectroscopic signatures of a Kohn anomaly in a topological crystalline insulator", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/qg8k-y95s", "authors": "Jingwen Li, Arpita Dutta, Kush Saha, et al.", "last_authors": "Manfred Fiebig, Shovon Pal", "summary": "Topological crystalline insulators extend the concept of topological insulators by hosting surface states protected by crystallographic symmetry. Their topological phase transitions arise from spin-orbit-driven band inversion in the bulk electronic structure, reshaping the low-energy electronic envi…", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Connects electronic structure spectroscopy to topological phases and lattice anomalies.", "tags": ["topological", "spectroscopy"], "image": "", "briefing": {"background": "위상 결정 절연체(TCI)는 일반적인 위상 절연체와 달리 결정 대칭성에 의해 보호되는 표면 상태를 가지며, 위상 상전이 시 격자 구조와 전자 구조가 복합적으로 변화합니다.", "motivation": "TCI의 위상 상전이 과정에서 나타나는 격자 동역학, 특히 Kohn 이상(anomaly) 현상이 전자 구조 스펙트럼에 어떻게 반영되는지 규명하고자 합니다.", "result": "TCI 물질에서 관측되는 분광학적 시그니처가 Kohn 이상과 연관되어 있음을 보이며, 격자 진동과 전자 구조 간의 강한 결합을 제시합니다.", "implication": "위상적 성질이 격자 구조와 밀접하게 연결되어 있으며, 스펙트럼 분석을 통해 위상 상전이의 미시적 기원을 추적할 수 있음을 의미합니다.", "novelty": "단순한 전자 구조 분석을 넘어, 격자 이상(Kohn anomaly)을 통해 TCI의 위상학적 상태를 설명하는 새로운 실험적 접근법을 제시합니다.", "unresolved": "관측된 Kohn 이상이 상전이 전후의 위상적 변화에 미치는 정량적인 상관관계는 추가 연구가 필요합니다.", "future_work": "시간 분해 분광법을 사용하여 위상 상전이 시 격자와 전자 시스템의 응답 속도 차이를 관찰하는 연구가 기대됩니다.", "concepts": [{"term": "Kohn anomaly", "why_emerged": "금속의 포논 분산 관계에서 발생하는 비정상적인 딥(dip) 현상을 설명하기 위해 제안됨.", "origin": "Walter Kohn (1959년).", "connections": "Electron-phonon coupling, Fermi surface nesting."}, {"term": "Topological crystalline insulator", "why_emerged": "시간 역전 대칭성 외에 결정 공간 그룹 대칭성에 의해 위상적 상태가 보호되는 물질을 연구하기 위해 도입됨.", "origin": "Fu, Liang (2011년).", "connections": "Topological insulators, Crystal symmetry protection."}], "english_summary": ["Study of spectroscopic signatures related to Kohn anomalies in TCIs.", "Demonstrates the interplay between lattice dynamics and topological phases.", "Identifies the role of electron-phonon coupling in topological band inversion.", "Provides a spectroscopic probe for investigating topological phase transitions."]}}, {"title": "Unified interfacial and intrinsic topology in a large-gap epitaxial two-dimensional insulator", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/x27l-rpv5", "authors": "Heng Jin, Xiaoyin Li, Kyung-Hwan Jin, Bing Huang, Feng Liu", "last_authors": "Bing Huang, Feng Liu", "summary": "Two-dimensional topological insulators (2D TIs) are commonly realized either through intrinsic band-gap inversion within a single material or through interfacial band-offset inversion in narrowly tuned heterostructures. Here we demonstrate, based on first-principles calculations, that these two mech…", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "First-principles study of 2D topological insulators and heterostructures, highly relevant to user interests.", "tags": ["theory", "topological-insulator", "heterostructure"], "image": "", "briefing": {"background": "2차원 위상 절연체는 밴드 반전(band inversion)을 통해 구현되는데, 이는 단일 물질 내부의 성질에 의존하거나 이종 접합(heterostructure)을 통해 유도됩니다.", "motivation": "본 연구에서는 이 두 가지 메커니즘이 하나의 2차원 절연체 시스템에서 어떻게 통일되어 작동할 수 있는지 이론적으로 탐구합니다.", "result": "계면(interfacial) 효과와 물질 고유(intrinsic) 성질이 결합하여 2차원 위상 절연체 상태를 안정적으로 유지하는 메커니즘을 입증했습니다.", "implication": "이종 접합 구조를 설계할 때 계면 엔지니어링을 통해 위상적 성질을 효과적으로 제어할 수 있는 새로운 가이드라인을 제시합니다.", "novelty": "개별적으로 다루어지던 위상 구현 기전을 결합하여 거대 밴드갭을 가진 2차원 위상 절연체 구현의 가능성을 넓혔습니다.", "unresolved": "실제 실험적 합성과정에서 나타나는 계면 결함(defect)이 이론적으로 예측된 위상 특성을 얼마나 보존할 수 있는지는 과제로 남아 있습니다.", "future_work": "합성 가능한 2D 물질 조합에 대한 스크리닝 및 실제 기판 위에서의 박막 성장 실험이 요구됩니다.", "concepts": [{"term": "Band inversion", "why_emerged": "위상 절연체에서 밴드 구조가 역전되어 위상 불변량이 바뀌는 현상을 설명하기 위해 도입됨.", "origin": "Kane & Mele, Bernevig et al. (2005-2006).", "connections": "Spin-orbit coupling, Topological insulator."}, {"term": "Heterostructure", "why_emerged": "서로 다른 성질을 가진 박막을 쌓아 단일 물질에서는 나타나지 않는 새로운 물리 현상을 창출하기 위해 사용됨.", "origin": "반도체 이종 접합 초기 연구 (Alferov/Kroemer, 1960년대).", "connections": "Quantum Hall effect, Moiré superlattice."}], "english_summary": ["Investigates the unification of interfacial and intrinsic topology in 2D insulators.", "Uses first-principles calculations to demonstrate topological phase stability.", "Shows synergy between band-offset inversion and intrinsic band inversion.", "Offers a pathway for designing large-gap 2D topological materials via heterostructures."]}}, {"title": "Huge Symmetric Elastoresistance in the Kondo Lattice YbRh2Si2", "journal": "PRL_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/d843-3bvb", "authors": "Soumendra Nath Panja, Jacques G. Pontanel, Julian Kaiser, Anton Jesche, Philipp Gegenwart", "last_authors": "Anton Jesche, Philipp Gegenwart", "summary": "Heavy-fermion metals are prototype correlated electron systems for the study of Kondo entanglement and quantum criticality. We use the symmetry decomposed elastoresistance to uncover the fingerprints of strain-dependent Kondo scattering as a function of temperature and magnetic field in the prototyp…", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Experimental study of elastoresistance in a heavy-fermion system, relevant to correlated electrons and nematicity.", "tags": ["experiment", "heavyfermion", "correlatedelectrons", "nematicity", "Kondolattice"], "image": "", "briefing": {"background": "중페르미온(Heavy-fermion) 금속은 콘도 격자에서의 전자 상관관계와 양자 임계 현상을 연구하는 대표적인 플랫폼입니다. 최근 전자 네마틱성(nematicity)이 양자 임계점 근처에서 자발적 대칭성 깨짐의 중요한 척도로 주목받고 있습니다.", "motivation": "YbRh2Si2와 같은 대표적인 중페르미온 시스템에서 변형(strain)에 따른 전기저항의 변화인 탄성저항(elastoresistance)을 측정하여, 콘도 산란과 격자 구조 간의 미시적 연결 고리를 규명하고자 함.", "result": "YbRh2Si2에서 거대한 대칭성 분해 탄성저항을 관측하였으며, 이를 통해 온도와 자기장에 따른 콘도 산란의 변화를 민감하게 추적하는 '지문(fingerprint)'을 확보함.", "implication": "중페르미온 시스템에서 네마틱 감수성(nematic susceptibility)을 측정하는 새로운 방법론을 제시하며, 양자 임계점 근처의 상태를 이해하는 데 중요한 실험적 도구가 될 것임.", "novelty": "기존의 전형적인 수송 측정 외에 변형 제어를 통한 대칭성 분해 측정을 도입하여, YbRh2Si2의 콘도 격자 상태가 격자 변형에 얼마나 민감한지를 정량적으로 증명함.", "unresolved": "관측된 탄성저항이 직접적으로 네마틱 질서 변수와 어떻게 매핑되는지에 대한 이론적 모델링이 보완되어야 함.", "future_work": "다른 중페르미온 화합물로의 확장 실험 및 저온/고자기장 하에서의 정밀한 변형 제어 기술 고도화.", "concepts": [{"term": "엘라스토레지스턴스 (Elastoresistance)", "why_emerged": "재료의 등방성 변형이나 이방성 변형이 전자 수송 특성에 미치는 영향을 분석하여 전자 네마틱 질서를 탐지하기 위해 필요.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "철 기반 초전도체 및 중페르미온 화합물의 네마틱상 연구와 밀접함."}, {"term": "콘도 격자 (Kondo Lattice)", "why_emerged": "국부적인 자기 모멘트가 전도 전자와 상호작용하여 무거운 유효 질량을 가진 준입자를 형성하는 메커니즘을 설명하기 위해 도입됨.", "origin": "콘도 효과는 준 콘도(1964)에 의해 제안됨.", "connections": "중페르미온 액체, 양자 임계 현상, 이상 홀 효과 등과 연결됨."}], "english_summary": ["Study of elastoresistance in the heavy-fermion system YbRh2Si2.", "Identifies fingerprints of strain-dependent Kondo scattering.", "Demonstrates high sensitivity of electronic correlations to crystal symmetry breaking.", "Provides a novel method for probing nematic susceptibility in correlated quantum materials."]}}, {"title": "Microscopic Signatures of Chern Number Sign Reversal in Twisted Bilayer WSe2", "journal": "PRL_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/1jks-ld4b", "authors": "Ke Lv, Ya-Ning Ren, Lin He", "last_authors": "Ya-Ning Ren, Lin He", "summary": "The observation of quantized Chern numbers in twisted transition metal dichalcogenide homobilayers, including 3.7° twisted ${\\mathrm{MoTe}}_{2}$ and 1.23° twisted ${\\mathrm{WSe}}_{2}$, represents a landmark breakthrough in moiré physics. A striking and unresolved paradox to emerge from these studies…", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Experimental study of Chern numbers in twisted bilayer WSe2, relevant to topological moiré systems.", "tags": ["experiment", "topological", "moiré", "twistedbilayer", "TMD", "Chernnumber"], "image": "", "briefing": {"background": "뒤틀린(twisted) 전이금속 디칼코게나이드(TMD) 이중층에서는 모아레(moiré) 패턴에 의해 강한 상관관계가 유도되며, 여기서 양자화된 천(Chern) 절연체 상태가 발현됩니다.", "motivation": "최근 1.23° 뒤틀린 WSe2 등에서 관측된 천 수(Chern number)의 부호 반전 현상과 관련된 물리적 기원을 미시적으로 규명하기 위함.", "result": "이 시스템에서 발생하는 천 수 부호 반전의 미시적 원인을 파악하였으며, 이는 기존에 알려진 모아레 물리학의 패러독스를 해결하는 실마리를 제공함.", "implication": "모아레 시스템에서의 위상학적 상태를 제어하고 이해하는 데 있어 중요한 전환점을 마련함.", "novelty": "기존에 풀리지 않았던 천 수 반전의 물리적 기원을 특정함으로써, 2D van der Waals 이종구조에서의 위상학적 물리 현상 이해도를 크게 높임.", "unresolved": "부호 반전이 발생하는 정확한 임계 조건과 외부 파라미터(전기장 등)와의 정밀한 상관관계 규명.", "future_work": "이러한 부호 반전이 다른 뒤틀린 TMD 시스템에서도 보편적으로 나타나는지 확인하는 실험.", "concepts": [{"term": "천 수 (Chern number)", "why_emerged": "밴드 구조의 위상학적 성질을 정량화하여 비정상 홀 효과나 양자 홀 효과를 설명하기 위해 도입됨.", "origin": "천-시몬스 이론 및 아티야-싱어 정리 등에 기초함.", "connections": "위상 절연체, 양자 이상 홀 효과, Berry 곡률과 직접 연결됨."}, {"term": "모아레 물리학 (Moiré physics)", "why_emerged": "두 층의 격자 부정합이나 비틀림이 만드는 초격자 구조가 전자 에너지 밴드를 좁게 만들어 상관관계 효과를 극대화하기 위해 연구됨.", "origin": "비스트리처와 맥도날드(2011)의 뒤틀린 이중층 그래핀 모델이 시초.", "connections": "뒤틀린 이중층 그래핀, 뒤틀린 TMD, 강상관 전자계."}], "english_summary": ["Investigates the sign reversal of Chern numbers in twisted bilayer WSe2.", "Addresses a persistent paradox in moiré topological systems.", "Provides microscopic insights into the topological band structure of TMD homobilayers.", "Advances the understanding of quantized states in correlated moiré materials."]}}, {"title": "Quantized Heat Flow in the Hofstadter Butterfly", "journal": "PRL_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/pggy-t8bg", "authors": "A. Zhang, G. Aissani, Q. Dong, Y. Jin, K. Watanabe, T. Taniguchi, et al.", "last_authors": "G. Fève, G. C. Ménard, O. Maillet, and F. D. Parmentier", "summary": "Heat flow in the Chern Insulator states of the Hofstadter butterfly is obtained in a graphene/hBN moiré for the first time.", "tier": "  Benjamin Bacq-Labreuil", "summary": "Scanning tunneling microscopy measurements exploiting the natural superstructure modulation of the cuprate superconductor ${\\mathrm{Bi}}_{2}{\\mathrm{Sr}}_{2}{\\mathrm{CaCu}}_{2}{\\mathrm{O}}_{8+δ}$ (Bi-2212) have revealed a possible correlation between the Cu-apical-O distance ${δ}_{\\mathrm{api}}$ and…", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Experimental STM study on cuprate superconductor Bi-2212, highly relevant to user's interests.", "tags": ["experiment", "STM", "cuprate", "superconductivity"], "image": "", "briefing": {"background": "구리 산화물(cuprate) 고온 초전도체는 결정 구조 내에서 구리-산소 평면(CuO2 plane)과 그 위아래에 위치한 정점 산소(apical oxygen)의 배치가 물리적 성질에 중요한 영향을 미친다고 알려져 있습니다.", "motivation": "Bi-2212 물질의 자연적인 초구조(superstructure) 변조를 STM으로 정밀하게 관측하여, 정점 산소와의 거리(δ_api)가 전자 구조 및 초전도 현상과 어떤 상관관계를 갖는지 규명하고자 했습니다.", "result": "초구조 변조에 따른 국소적인 Cu-apical O 거리 변화가 전자 상태 밀도 및 초전도 갭과 직접적인 관련이 있음을 STM 데이터를 통해 보여줍니다.", "implication": "초전도 전이 온도(Tc)나 갭의 크기를 결정하는 데 있어 정점 산소의 위치가 핵심적인 조절 인자(tuning knob)가 될 수 있음을 시사합니다.", "novelty": "STM을 사용하여 나노미터 규모에서 초구조 변조를 이용해 격자 왜곡이 전자 구조에 미치는 영향을 직접적으로 매핑했다는 점에서 중요한 기여를 합니다.", "unresolved": "이 상관관계가 초전도 메커니즘 자체의 원인인지, 아니면 병행되는 현상인지에 대한 물리적 해석은 여전히 논의의 여지가 있습니다.", "future_work": "다른 도핑 수준이나 구리 산화물 화합물에서의 정점 산소 거리 효과를 추가 비교 연구하여 보편성을 검증할 필요가 있습니다.", "concepts": [{"term": "Bi-2212", "why_emerged": "고온 초전도 연구에서 가장 많이 연구된 구리 산화물 중 하나로, 표면이 깨끗하게 분리되어 STM 연구에 유리합니다.", "origin": "1980년대 후반 Maeda 등에 의해 발견되었습니다.", "connections": "고온 초전도, 의사갭(pseudogap), 강상관 전자계 연구의 표준 물질입니다."}, {"term": "STM (Scanning Tunneling Microscopy)", "why_emerged": "원자 단위의 국소적인 전자 상태 밀도를 관찰하기 위해 개발되었습니다.", "origin": "1981년 Binnig와 Rohrer가 발명하였습니다.", "connections": "분광학적 도구인 STS와 결합하여 고온 초전도체의 비균질성 연구에 필수적입니다."}, {"term": "초구조 변조 (Superstructure modulation)", "why_emerged": "Bi-2212에서 격자 불일치로 인해 주기적으로 원자 위치가 변하는 구조적 특징입니다.", "origin": "초기 Bi-계 고온 초전도체 구조 분석 과정에서 발견되었습니다.", "connections": "전자적 성질에 주기적인 섭동을 가해 물성 변화를 유도합니다."}], "english_summary": ["Investigated the correlation between Cu-apical oxygen distance and electronic properties in Bi-2212.", "Utilized STM to map local structural variations caused by natural superstructure modulation.", "Results suggest apical oxygen positions play a critical role in shaping the local superconducting gap.", "Provides experimental insights into structural control of high-Tc cuprate properties."]}}, {"title": "Step-Edge Anomaly in Topological Metals", "journal": "PRL_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/3p2x-yjyd", "authors": "O. Schweizer, V. Gali, A. Y. Chaou, G. Lemut, P. W. Brouwer, and M. Breitkreiz", "last_authors": "A. Y. Chaou, G. Lemut, P. W. Brouwer, and M. Breitkreiz", "summary": "Bulk–boundary correspondence guarantees the presence of robust, anomalous states on the boundary of topological matter. The edges of a two-dimensional Chern insulator harbor one-dimensional chiral states, which have a conductance n e 2 / h , where n is an integer that is solely determined by the bulk. In this Letter we show that step edges on the surface of three-dimensional topological metals have a robust conductance K e 2 / h , where K is also fixed by the bulk and assumes noninteger values. We explain this prediction on the basis of the topology of gapless systems, exemplify it on a lattice model, and connect to recent experimental observations of enhanced density of states at step edges in topological metals.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Theory on boundary states in topological metals and Chern insulators, highly relevant.", "tags": ["theory", "topological_materials", "Chern_insulator", "transport"], "image": "", "briefing": {"background": "위상 절연체와 위상 금속은 벌크-경계 대응 원리(bulk-boundary correspondence)에 의해 경계면에서 독특한 전도 현상이 나타납니다.", "motivation": "일반적인 2D Chern 절연체의 에지 상태와 달리, 3D 위상 금속의 표면에 존재하는 계단형 에지(step edge)에서의 전도 특성을 이론적으로 규명하고자 했습니다.", "result": "3D 위상 금속의 표면 계단 에지에서 정수값이 아닌 보존된 전도도(K e^2/h)가 나타남을 밝히고 이를 위상학적 근거로 설명했습니다.", "implication": "위상 금속 표면의 기하학적 구조(계단)가 전하 수송에 결정적인 기여를 하며, 이는 나노 소자 설계 시 표면 구조 제어가 필수적임을 뜻합니다.", "novelty": "기존에 잘 알려진 위상 에지 상태를 넘어, 표면 계단 구조의 위상학적 기여를 정량화하여 제시한 점이 새롭습니다.", "unresolved": "실제 복잡한 밴드 구조를 가진 위상 금속에서 K 값이 구체적으로 어떻게 달라지는지에 대한 실험적 측정 데이터는 여전히 부족합니다.", "future_work": "위상 금속 박막의 표면 계단 구조를 제어한 수송 측정 실험이 필요합니다.", "concepts": [{"term": "벌크-경계 대응 (Bulk-boundary correspondence)", "why_emerged": "위상 물질의 벌크 밴드 구조가 경계면의 상태를 결정한다는 위상 물리학의 근본 원리입니다.", "origin": "Hatsugai 등에 의해 이론적으로 확립되었습니다.", "connections": "위상 절연체, 양자 홀 효과, Weyl 반금속의 페르미 아크와 연결됩니다."}, {"term": "Chern 절연체", "why_emerged": "외부 자기장 없이도 자발적인 시간 반전 대칭성 깨짐을 통해 양자 홀 효과를 구현하는 시스템입니다.", "origin": "Haldane 모델(1988)이 효시입니다.", "connections": "위상 불변량인 Chern 수를 통해 수송 특성이 정해집니다."}, {"term": "위상 금속 (Topological metal)", "why_emerged": "밴드 구조의 위상적 특징이 금속성 상태에서도 유지되는 물질류입니다.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "Weyl 반금속, Dirac 반금속 등이 이 범주에 포함됩니다."}], "english_summary": ["Theorizes that step edges on 3D topological metals exhibit robust quantized conductance.", "The conductance value is fixed by bulk topology but can take non-integer values.", "Provides a theoretical framework explaining anomalous transport at structural defects.", "Connects theoretical findings to recent experimental reports of enhanced DOS at step edges."]}}, {"title": "A new approach to the Kondo effect: sophomore's dream function and Lee-Yang zeros (Physics Letters A)", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2610.13666", "authors": "V. Yu. Irkhin", "last_authors": "V. Yu. Irkhin", "summary": "We develop an analytical approach to the Kondo problem based on an effective partition function that generalizes the sophomore's dream integral. The Kondo crossover is represented as a passage through an approximately equidistant ladder of its Lee-Yang zeros in the complex plane, rather than as a singularity on the real axis. Summation over this ladder yields the Gamma function $\\Gamma(\\alpha + T_K/(2 \\pi T))$ as the universal crossover backbone, where the offset $\\alpha =1/2$ is fixed by the Friedel sum rule. The Euler-Maclaurin expansion connects the discrete zero structure to the Nozieres Fermi-liquid theory through Bernoulli numbers. A two-cutoff formula provides a compact, essentially one-parameter description of the full crossover in terms of a temperature-space Fano lineshape which is a thermal average of the energy-space Fano resonance observed in STM. Drift corrections are treated. The approach extends to $\\mathrm{SU}(N)$ Coqblin-Schrieffer, underscreened and Anderson impurity models, and Kondo lattices.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Theoretical approach to the Kondo effect, directly relating to experimental STM observations and correlated systems.", "tags": ["theory", "Kondo", "STM", "stronglycorrelated"], "image": "https://arxiv.org/html/2610.13666v1/stirling.png", "briefing": {"background": "콘도 효과(Kondo effect)는 자성 불순물이 전도 전자와 상호작용하여 저온에서 저항이 증가하고 새로운 공명 상태가 형성되는 강상관 전자계의 대표 현상입니다.", "motivation": "기존의 복잡한 콘도 문제를 'sophomore's dream' 함수와 Lee-Yang 영점(zeros)을 이용한 새로운 해석적 프레임워크로 풀고자 했습니다.", "result": "콘도 교차(crossover) 현상을 복소 평면에서의 Lee-Yang 영점 구조로 모델링하여, 기존의 Fano 공명 식을 열역학적 평균으로 깔끔하게 유도했습니다.", "implication": "강상관 시스템의 복잡한 다체 문제를 수학적으로 더 간결하게 표현하고, STM에서 관측되는 Fano 선형(line shape)을 물리적으로 더 명확하게 설명할 수 있습니다.", "novelty": "전통적인 방법론(예: NRG, 배타 원리 기반 접근)과는 다른 새로운 수학적 해석을 제공하며, 특히 STM 데이터 분석에 직접적인 연결고리를 제시합니다.", "unresolved": "이 수학적 모델이 강한 자기적 질서가 존재하는 격자 환경에서 얼마나 범용적으로 적용 가능한지는 검증이 더 필요합니다.", "future_work": "실제 실험에서 얻은 콘도 공명 선폭 분석에 제안된 공식을 적용해 보는 연구가 필요합니다.", "concepts": [{"term": "콘도 효과 (Kondo effect)", "why_emerged": "금속 내 자성 불순물이 온도가 낮아질 때 전도 전자와 산란하여 전기 저항이 비정상적으로 증가하는 현상을 설명하기 위해 도입되었습니다.", "origin": "Jun Kondo가 1964년에 제안하였습니다.", "connections": "Heavy fermion, 양자점, 국소 모멘트와 전도 전자의 스핀 상호작용의 원형입니다."}, {"term": "Lee-Yang 영점 (Lee-Yang zeros)", "why_emerged": "상전이 현상을 분배 함수의 영점이 복소 평면에서 어떻게 분포하는지로 분석하기 위해 고안되었습니다.", "origin": "T. D. Lee와 C. N. Yang이 1952년에 제안하였습니다.", "connections": "위상 전이, 상전이의 통계 역학적 이해에 핵심적입니다."}, {"term": "Fano 공명 (Fano resonance)", "why_emerged": "이산적인 상태와 연속적인 상태가 간섭할 때 발생하는 비대칭적인 산란 형태를 기술하기 위해 필요했습니다.", "origin": "Ugo Fano가 1961년에 제안하였습니다.", "connections": "STM에서 불순물 상태를 측정할 때 나타나는 특징적인 피크 모양입니다."}], "english_summary": ["Presents a novel analytical approach to the Kondo problem using Lee-Yang zeros.", "Maps the Kondo crossover to a discrete ladder structure in the complex plane.", "Successfully derives a thermal Fano lineshape that connects to STM spectroscopic data.", "Extends the framework to SU(N) impurity models and Kondo lattice systems."]}}, {"title": "Alter-excitons in Altermagnets: Symmetry, Splitting and Dispersion", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2610.12900", "authors": "Yuanfan Xiong, Liangyu Wang, Xuan Wu, Wei Hu, Jinlong Yang", "last_authors": "Wei Hu, Jinlong Yang", "summary": "Magnetism provides a fertile platform for discovering emergent quantum phenomena governed by symmetry. Recent developments of spin-space-group (SSG) theory have revealed altermagnets as a distinct class of nonrelativistic collinear magnets with unconventional spin-dependent electronic structures. Here, we demonstrate that altermagnetic symmetry imposes fundamentally different constraints on electronic and excitonic excitations. Although the quasiparticle and two-body Hamiltonians possess identical SSG symmetries, we find that symmetry-protected degeneracies present in the electronic band structure can be intrinsically lifted in the exciton spectrum at specific momenta. This splitting arises solely from the many-body nature of excitons and does not require spin-orbit coupling or noncollinear magnetic order. Combining symmetry analysis with many-body perturbation theory, we predict a novel class of spin-split excitonic quasiparticles, termed alter-excitons, and reveal their characteristic dispersions in altermagnetic systems. Our results establish excitons as a sensitive probe of hidden spin-space symmetries and uncover a new route toward symmetry-engineered many-body phenomena in collinear magnets.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Directly relevant to user interest in altermagnetism and electronic structure dispersion.", "tags": ["material", "altermagnet", "electronic-structure"], "image": "https://arxiv.org/html/2610.12900v1/fig2.png", "briefing": {"background": "자성체 내 전자와 정공이 결합한 준입자인 엑시톤은 결정 대칭성에 큰 영향을 받습니다. 최근 주목받는 알터마그넷(Altermagnet)은 비상대론적 공선형 자성체로, 스핀 공간 그룹(SSG)에 의해 지배되는 독특한 스핀 의존 전자 구조를 가집니다.", "motivation": "알터마그넷의 대칭성이 전자 구조뿐만 아니라 엑시톤의 들뜸 상태(excitonic excitations)에 어떤 고유한 제약을 가하는지 규명하고자 함.", "result": "전자 밴드 구조의 대칭성 보호 퇴화가 엑시톤 스펙트럼에서는 특정 운동량에서 해소됨을 발견했습니다. 이는 스핀-궤도 결합(SOC)이나 비공선형 자성 없이도 다체 효과에 의해 발생하는 '알터-엑시톤(alter-excitons)'이라는 새로운 스핀 분할 준입자를 제시합니다.", "implication": "알터마그넷 시스템에서 엑시톤이 숨겨진 스핀 공간 대칭성을 탐지하는 민감한 프로브(probe)로 사용될 수 있으며, 대칭성 공학을 통한 새로운 다체 물리 구현의 경로를 제공합니다.", "novelty": "외부 자기장이나 SOC 없이 순수하게 다체 상호작용과 알터마그넷의 대칭성만으로 엑시톤 스펙트럼을 제어할 수 있음을 이론적으로 예측했습니다. 특히 전자 구조의 스핀 분할을 연구하는 ARPES/CD-ARPES 사용자에게 광학적/분광학적 관측 가능성을 시사합니다.", "unresolved": "실제 물질에서의 광학적 측정(예: RIXS 또는 분광 타원법)을 통한 알터-엑시톤의 구체적인 분산 관계와 스플리팅 크기 확인이 필요합니다.", "future_work": "다체 섭동 이론을 기반으로 한 구체적인 물질 계산과, 초고속 분광법을 이용한 실험적 검증이 뒤따라야 할 것입니다.", "concepts": [{"term": "알터마그넷", "why_emerged": "강자성이나 반강자성으로 분류되지 않는 새로운 공선형 자성 질서를 기술하기 위해 필요.", "origin": "최근 2-3년 내 Šmejkal, Jungwirth 등에 의해 체계화됨.", "connections": "반강자성, 비통상적 홀 효과, 스핀 공간 그룹 이론."}, {"term": "알터-엑시톤", "why_emerged": "알터마그네틱 대칭성이 엑시톤의 들뜸 스펙트럼에 미치는 영향을 설명하기 위해 제안된 준입자.", "origin": "본 논문에서 처음 제안됨.", "connections": "엑시톤 물리학, 다체 섭동 이론, 자성체 내의 스핀 분할."}], "english_summary": ["Altermagnets possess unique spin-space-group symmetries affecting both electronic and excitonic structures.", "The study identifies 'alter-excitons' arising from many-body effects that lift symmetry-protected degeneracies.", "These excitations occur without SOC or non-collinear magnetic order.", "Excitons are proposed as sensitive probes for hidden spin-space symmetries in collinear magnetic systems."]}}, {"title": "Anomalous Edge Contrast in Magnetic Force Imaging of 2D Topological Insulators", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2602.18281", "authors": "Timothy W. Carlson, Motahhare Mirhosseini, Allison Swyt, et al.", "last_authors": "Vojislav Krstic, D. L. Carroll", "summary": "Magnetic force imaging (MFM) of 2D topological insulators, such as crystalline plates of Bi2Te3 and Bi2Se3, reveals anomalously large contrast around the plate edges even under ambient imaging conditions. And while there are several known contrast mechanisms in MFM, these cannot easily explain the magnitude of contrast observe for such systems. In this work we use multi-parameter magnetic force phase imaging together with a simple analytical model to suggest that the observed magnetic edge-features can be associated with two sources: a pseudo-Faraday effect in the conductive edge channels of the topological system and magnetic scattering in those channels caused by the proximal, localized field of the tip. These results suggest novel MFM contrast mechanisms unique to topological systems and point to the utility of multi-parameter MFM techniques in studies of topological-material-based circuit elements.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Experimental imaging of edge channels in standard topological insulators Bi2Te3 and Bi2Se3.", "tags": ["experiment", "topologicalinsulator", "MFM"], "image": "https://arxiv.org/static/browse/0.3.4/images/arxiv-logo-fb.png", "briefing": {"background": "2D 위상 절연체는 내부는 절연체이나 가장자리(edge)에 금속성 상태를 가지는 독특한 물질입니다. 이 에지 상태를 공간적으로 시각화하고 물리적 성질을 규명하는 것은 위상 물질 연구의 핵심 과제입니다.", "motivation": "Bi2Te3와 Bi2Se3와 같은 2D 위상 절연체에서 관찰되는 자기력 현미경(MFM)의 비정상적인 가장자리 대비(edge contrast)의 원인을 밝히고자 함.", "result": "이러한 대비 현상이 단순한 자기적 정렬이 아니라, 에지 채널에서의 의사-패러데이 효과(pseudo-Faraday effect)와 MFM 팁의 국소 자기장에 의한 자기 산란 현상에 기인한다는 것을 모델링을 통해 증명함.", "implication": "위상 절연체 기반 소자 연구 시, MFM을 이용한 전기적 특성 및 위상적 상태의 비침습적 이미징 도구로서의 활용 가능성을 제시합니다.", "novelty": "위상 물질의 가장자리 상태에 특화된 새로운 MFM 대비 메커니즘을 제안했습니다. 이는 STM/STS와 더불어 위상 물질의 공간 분해능을 갖춘 분석 도구로 MFM의 가치를 재발견하게 합니다.", "unresolved": "제안된 의사-패러데이 효과와 자기 산란의 상대적 기여도를 정량적으로 분리하는 실험이 추가로 필요합니다.", "future_work": "다중 파라미터 MFM 기술을 고도화하여 위상 절연체 기반 회로 소자 내의 전류 분포 등을 직접 이미징하는 후속 연구가 기대됩니다.", "concepts": [{"term": "2D 위상 절연체", "why_emerged": "양자 스핀 홀 효과를 구현하고 에지 채널의 위상적 보호를 활용하기 위해 제안됨.", "origin": "Kane & Mele (2005)의 그래핀 모델 및 Bi2Te3 실험 (2008).", "connections": "위상 공학, 양자 홀 효과, 비소산성 전류."}, {"term": "자기력 현미경(MFM)", "why_emerged": "나노 스케일의 국소 자기장을 고해상도로 시각화하기 위해 개발.", "origin": "1980년대 후반 초기 개발됨.", "connections": "자기 스핀 구조, 자성 소자 연구, 주사 프로브 현미경법."}], "english_summary": ["Magnetic force imaging reveals anomalous edge contrast in 2D topological insulators Bi2Te3 and Bi2Se3.", "Conventional contrast mechanisms fail to explain the magnitude of these observed edge features.", "The study identifies pseudo-Faraday effects and tip-induced magnetic scattering in edge channels as key origins.", "This highlights the utility of multi-parameter MFM for characterizing topological material-based devices."]}}, {"title": "Anomalous Transverse Thomson Effect", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2605.06299", "authors": "Ying-Fei Zhang, Zhi-Fan Zhang, Zhen-Gang Zhu, Gang Su", "last_authors": "Zhen-Gang Zhu, Gang Su", "summary": "We formulate the anomalous transverse Thomson effect (ATTE), the long-missing Thomson counterpart of the anomalous Hall and anomalous Nernst effects. Its coefficient is not unique but depends on the electrical boundary condition: τ ATTE ( j ) \\tau_{\\rm ATTE}^{(j)} , defined for a spatially uniform imposed current density, and τ ATTE ( E ) \\tau_{\\rm ATTE}^{(E)} , defined for equipotential electrodes. Both are fully determined by the total anomalous Nernst coefficient (ANC) and its temperature dependence, while τ ATTE ( E ) \\tau_{\\rm ATTE}^{(E)} acquires an additional contribution from the temperature dependence of the longitudinal resistivity. This relation is model independent within local linear response and applies to the total ANC regardless of whether its microscopic origin is intrinsic or extrinsic. Using a massive Dirac model for Fe 3 Sn 2 , we show that Berry curvature near the gapped Dirac cones enhances the ANC-related contributions to τ ATTE ( E ) \\tau_{\\rm ATTE}^{(E)} . In the low-temperature limit, both τ ATTE ( j ) / S x ​ y A \\tau_{\\rm ATTE}^{(j)}/S_{xy}^{\\rm A} and τ ATTE ( E ) / S x ​ y A \\tau_{\\rm ATTE}^{(E)}/S_{xy}^{\\rm A} approach a value of three. We further extract τ ATTE ( E ) \\tau_{\\rm ATTE}^{(E)} from reported experimental data for CoS 2 , Co 3 Sn 2 S 2 and CeCrGe 3 ; for CeCrGe 3 it reaches approximately -20 μ ​ V / K \\mu V/K , and we estimate the maximum achievable cold-side heat current density to assess its cooling potential. Because the ATTE can be evaluated directly from existing ANC and longitudinal resistivity data, it is readily testable without additional equipment or measurements.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Relates anomalous transport to Berry curvature in relevant materials like kagome Fe3Sn2 and Weyl Co3Sn2S2.", "tags": ["theory", "Berrycurvature", "kagome"], "image": "https://arxiv.org/html/2605.06299v4/Fig1.png", "briefing": {"background": "비정상 홀 효과(AHE)나 비정상 네른스트 효과(ANE)와 같은 베리 곡률(Berry curvature) 기반의 수송 현상은 위상 물질 및 강자성체의 전자 구조를 이해하는 중요한 지표입니다.", "motivation": "비정상 네른스트 효과의 톰슨(Thomson) 대응물인 '비정상 횡 톰슨 효과(ATTE)'를 공식화하고 그 응용 가능성을 평가하고자 함.", "result": "ATTE 계수를 도출하고, 이것이 비정상 네른스트 계수와 전기적 경계 조건에 의존함을 보였습니다. 특히 카고메 금속 Fe3Sn2 등에서 베리 곡률이 ATTE를 크게 강화함을 입증했습니다.", "implication": "ATTE는 기존의 네른스트 데이터와 저항 데이터만으로 계산 가능하여, 추가적인 실험 장비 없이도 새로운 물성 분석이 가능해졌으며 열전 냉각 소자로서의 응용 가능성도 확인했습니다.", "novelty": "위상 카고메 금속이나 바일(Weyl) 반금속에서 나타나는 베리 곡률의 수송 효과 범위를 톰슨 효과까지 확장했습니다. 특히 Fe3Sn2, Co3Sn2S2 등 factors $\\nu=1$ and $\\nu=1/3$. At $\\nu=1$, the $K$-valley state is a weak insulator, consistent with an antiferromagnetic state near a van Hove singularity in the intermediate-coupling regime, similar to that observed in twisted bilayer WSe$_2$. In contrast, the $\\Gamma$-valley state exhibits a pronounced Pomeranchuk effect, consistent with proximity to a Mott transition. At $\\nu=1/3$, the $K$ valley hosts a robust generalized Wigner crystal, whereas the $\\Gamma$-valley state lies near the crystallization boundary and again exhibits a Pomeranchuk effect, with localization enhanced by increasing temperature or magnetic field. Our work highlights the importance of orbital character in defining quantum phases in moir\\'e systems, and identify the $\\Gamma$ valley as a promising platform for exploring correlated phenomena near quantum phase transitions, where competing phases and enhanced fluctuations may give rise to unconventional phases.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Experimental investigation of orbital-dependent correlated phases and valley physics in moiré WSe2.", "tags": ["twistedbilayer", "WSe2", "correlatedelectrons", "valleyphysics"], "image": "https://arxiv.org/html/2607.18212v2/Fig1_v6.png", "briefing": {"background": "모아레(Moiré) 소재는 2차원 층상 물질을 비틀어 쌓아 격자 상수를 키움으로써 강상관 전자계 물성을 제어하는 유망한 플랫폼입니다. 기존 연구들은 주로 K-밸리 물리 현상에 집중되어 왔습니다.", "motivation": "이 논문은 비틀린 단층/이층 WSe2 시스템에서 변위장(displacement field)을 통해 K-밸리뿐만 아니라 Γ-밸리까지 물성을 제어할 수 있다는 점에 착안하여, 두 밸리 간의 궤도적 특성 차이가 상관 물성에 미치는 영향을 규명하고자 했습니다.", "result": "ν=1과 ν=1/3 채움 상태에서 K-밸리는 반강자성 상태나 일반화된 위그너 결정(Wigner crystal) 같은 절연체 특성을 보이는 반면, Γ-밸리는 포메란척(Pomeranchuk) 효과와 연관된 모트 전이 근처의 강한 상관 현상을 나타냄을 확인했습니다.", "implication": "궤도적 자유도가 모아레 시스템의 양자 위상을 결정하는 핵심 변수임을 입증했으며, Γ-밸리가 양자 임계 현상 및 새로운 상관 물성을 탐구하는 새로운 플랫폼이 될 수 있음을 시사합니다.", "novelty": "기존 연구와 달리 밸리 간 궤도 특성에 따른 물성 대조를 명확히 보여주었으며, 향후 토폴로지 물질이나 강상관 계 연구 시 궤도 선택적 공학의 중요성을 강조합니다.", "unresolved": "Γ-밸리에서 관찰된 포메란척 효과의 구체적인 미시적 메커니즘과 Γ-밸리의 복잡한 에너지 밴 BN spacers to suppress lattice reconstruction and enhance structural uniformity.", "Confirmed improved homogeneity via 4D-STEM mapping of local strain and rotation.", "Provides a scalable path for high-quality vdW devices for excitonic and quantum studies."]}}, {"title": "Deterministic domain selection of antiferromagnets via magnetic fields", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2601.06646", "authors": "Sophie F. Weber, Veronika Sunko", "last_authors": "Sophie F. Weber, Veronika Sunko", "summary": "Antiferromagnets (AFMs) hold promise for applications in digital logic. However, switching AFM domains is challenging, as magnetic fields do not couple to the bulk antiferromagnetic order parameter. Here we show that magnetic-field-driven switching of AFM domains can in many cases be enabled by a generic reduction of magnetic exchange at surfaces. We use statistical mechanics and Monte Carlo simulations to demonstrate that an inequivalence in magnetic exchange between top and bottom surface moments, combined with the enhanced magnetic susceptibility of surface spins, can enable deterministic selection of antiferromagnetic domains depending on the magnetic-field ramping direction. We further show that this mechanism provides a natural interpretation for experimental observations of hysteresis in magneto-optical response of the van der Waals AFM $\\mathrm{MnBi_2Te_4}$. Our findings highlight the critical role of surface spins in responses of antiferromagnets to magnetic fields. Furthermore, our results suggest that antiferromagnetic domain selection via purely magnetic means may be a more common and experimentally accessible phenomenon than previously assumed.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Relevant study of domain switching in the magnetic topological insulator MnBi2Te4.", "tags": ["theory", "MnBi2Te4", "antiferromagnetism"], "image": "https://arxiv.org/html/2601.06646v2/field_dependence2.png", "briefing s as a versatile platform to realize a giant negative longitudinal magnetoresistance that is highly tunable via the Fermi level and magnetic field. By moving the Fermi level towards the Weyl point, we observe a pronounced enhancement of negative magnetoresistance, which arises from chiral anomaly and robustly persists up to ambient temperature. Beyond the quantum limit, the system exhibits positive linear magnetoconductance, serving as a compelling transport signature of the chiral anomaly in the lowest Landau level. Notably, in the extreme quantum limit at cryogenic temperatures, the magnetoresistance undergoes a dramatic reversal from negative to positive. This reversal points to a potential field-induced phase transition into a collective electronic state driven by enhanced electron-electron interactions. Our findings provide valuable insights into the unconventional chiral transport and emergent correlated quantum states under extreme magnetic fields.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Experimental study of chiral anomaly and Weyl physics; directly relevant to topological materials interest.", "tags": ["Weyl", "topological", "transport"], "image": "https://arxiv.org/static/browse/0.3.4/images/arxiv-logo-fb.png", "briefing": {"background": "Weyl 반금속에서 나타나는 카이랄 변칙(chiral anomaly)은 자기장과 전기장이 평행할 때 전하 보존이 위배되어 나타나는 현상으로, 음의 종방향 자기저항(negative longitudinal magnetoresistance)이 핵심적인 실험적 증거입니다.", "motivation": "도핑된 텔루륨(Te)을 활용해 페르미 준위와 자기장을 조절함으로써, 카이랄 변칙의 거동을 체계적으로 관찰하고 이 효과가 상온까지 유지되는지 검증하고자 했습니다.", "result": "페르미 준위가 Weyl 점에 가까워질수록 음의 자기저항이 크게 강화됨을 확인했으며, 양자 극한(quantum limit)을 넘어서는 선형 자기전도도를 관찰했습니다. 극저온 극한 환경에서는 자기저항이 양수로 전환되는 현상이 발견되었습니다.", "implication": "단순한 단일 입자 물리인 카이랄 변칙을 넘어, 강한 자기장 하에서 전자-전자 상호작용에 의한 새로운 집단적 전자 상태로의 전이 가능성을 제시합니다.", "novelty": "텔루륨이라는 물질을 통해 카이랄 변칙의 상온 구현과 그 붕괴 과정을 추적했다는 점이 중요하며, 위상물질 및 수송 현상에 관심 있는 독자에게 의미 있는 데이터입니다.", "unresolved": "자기저항의 부호가 극저온에서 반전되는 정확한 상전이 메커니즘은 여전히 모호하며, 이를 확증할 구조적 분석이 필요합니다.", "future_work": "해당 자기장 유도 상전이 상태의 정체를 밝히기 위한 정밀한 열역학적 측정이나 분광학적 관찰이 요구됩니다.", "concepts": [{"term": "카이랄 변칙 (Chiral Anomaly)", "why_emerged": "Weyl 반금속에서 위상적으로 보호된 전자 상태가 자기장에서 전하 보존을 깨뜨리는 현상을 설명하기 위해 도입되었습니다.", "origin": "입자 물리학의 Adler-Bell-Jackiw(ABJ) 변칙에서 유래했습니다.", "connections": "위상적 홀 효과, 자기저항, Weyl 페르미온 물리와 직접적으로 연결됩니다."}, {"term": "양자 극한 (Quantum Limit)", "why_emerged": "자기장이 매우 강해져 전자의 모든 에너지가 가장 낮은 란다우 준위(lowest Landau level)에 머물게 되는 상태를 정의하기 위해 필요합니다.", "origin": "고체 물리학의 Landau 준위 이론에서 확립되었습니다.", "connections": "자기저항의 비선형성 및 란다우 준위 구조 연구와 밀접합니다."}], "english_summary": ["Tellurium is used as a tunable platform to observe the chiral anomaly via longitudinal magnetoresistance.", "Negative magnetoresistance is observed and persists up to ambient temperatures as the Fermi level nears the Weyl point.", "A transition from negative to positive magnetoresistance is observed in the extreme quantum limit at low temperatures.", "This reversal suggests a field-induced phase transition potentially driven by enhanced electron-electron interactions."]}}, {"title": "Finite-momentum superconductivity with singlet-triplet mixing in an altermagnetic metal: A pairing instability analysis", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2603.12897", "authors": "Hui Hu, Zhao Liu, Jia Wang, Xia-Ji Liu, Yoji Ohashi", "last_authors": "Xia-Ji Liu, Yoji Ohashi", "summary": "We analyze the pairing instability of an altermagnetic metal on a square lattice driven by an attractive nearest-neighbor interaction. This interaction enables multiple pairing channels, including even-parity extended $s$-wave and $d$-wave states, as well as two odd-parity $p$-wave channels. We verify that altermagnetic spin-splitting in the single-particle dispersion gives rise to finite-momentum pairing between electrons with unlike spins, in agreement with earlier predictions. Quite unexpectedly, this pairing typically emerges across multiple channels with mixed parity. Consequently, the resulting const prevBtn = document.getElementById('prev');
const nextBtn = document.getElementById('next');
function textEl(tag, className, text) { const el = document.createElement(tag); if (className) el.className = className; el.textContent = text || ''; return el; }
function appendLabeledText(parent, className, label, text) { if (!text) return; const el = document.createElement('p'); el.className = className; const strong = textEl('strong', '', label); el.appendChild(strong); el.append(text); parent.appendChild(el); }
function appendBriefSection(parent, title, text, wide = false) { if (!text) return; const section = document.createElement('section'); section.className = 'brief-section' + (wide ? ' wide' : ''); section.appendChild(textEl('h2', '', title)); section.appendChild(textEl('p', '', text)); parent.appendChild(section); }
function render() {
  slideEl.replaceChildren();
  if (!slides.length) { slideEl.className = 'empty'; slideEl.textContent = 'No papers passed the filters in this run.'; counterEl.textContent = '0 / 0'; prevBtn.disabled = true; nextBtn.disabled = true; return; }
  slideEl.className = 'slide';
  const r = slides[index];
  const b = r.briefing || {};
  const head = document.createElement('div');
  head.className = 'paper-head';
  if (r.image) {
    const figure = document.createElement('figure');
    figure.className = 'figure';
    const img = document.createElement('img');
    img.src = r.image; img.alt = 'Figure or article preview image'; img.loading = 'lazy'; img.referrerPolicy = 'no-referrer'; img.onerror = () => figure.remove();
    figure.appendChild(img);
    figure.appendChild(textEl('figcaption', '', 'Figure / article preview image from the source page'));
    head.appendChild(figure);
  }
  const headText = document.createElement('div');
  headText.className = 'head-text';
  const badges = document.createElement('div');
  badges.className = 'badges';
  if (r.score) badges.appendChild(textEl('span', 'badge score', `${r.score}/10`));
  if (r.tier) badges.appendChild(textEl('span', 'badge', r.tier));
  if (r.journal) badges.appendChild(textEl('span', 'badge', r.journal));

  headText.appendChild(badges);
  const title = document.createElement('h1');
  if (r.link) { const titleLink = document.createElement('a'); titleLink.href = r.link; titleLink.target = '_blank'; titleLink.rel = 'noopener noreferrer'; titleLink.textContent = r.title || ''; title.appendChild(titleLink); }
  else { title.textContent = r.title || ''; }
  headText.appendChild(title);
  headText.appendChild(textEl('p', 'meta', [r.journal, r.source].filter(Boolean).join(' | ')));
  if (r.last_authors || r.authors) { const authors = document.createElement('p'); authors.className = 'authors'; if (r.last_authors) authors.append('Last authors: ' + r.last_authors); if (r.authors) authors.append((r.last_authors ? ' | ' : '') + 'Authors: ' + r.authors); headText.appendChild(authors); }

  if (r.tags && r.tags.length) { const tags = document.createElement('div'); tags.className = 'tags'; r.tags.forEach(tag => tags.appendChild(textEl('span', 'tag', '#' + tag))); headText.appendChild(tags); }
  if (r.link) { const link = document.createElement('a'); link.className = 'link'; link.href = r.link; link.target = '_blank'; link.rel = 'noopener noreferrer'; link.textContent = 'Open paper'; headText.appendChild(link); }
  head.appendChild(headText);
  if (r.summary) { const abstract = document.createElement('p'); abstract.className = 'original-abstract'; const strong = textEl('strong', '', 'Original abstract'); abstract.appendChild(strong); abstract.append(r.summary); head.appendChild(abstract); }
  slideEl.appendChild(head);
  const briefing = document.createElement('div');
  briefing.className = 'briefing';
  appendBriefSection(briefing, 'Background', b.background);
  appendBriefSection(briefing, 'Motivation', b.motivation);
  appendBriefSection(briefing, 'Result', b.result);
  appendBriefSection(briefing, 'Implication', b.implication);
  appendBriefSection(briefing, "Why it's important / Novelty", b.novelty);
  appendBriefSection(briefing, 'Unresolved Questions', b.unresolved);
  appendBriefSection(briefing, 'Expected Future Work', b.future_work);
  if (b.concepts && b.concepts.length) {
    const section = document.createElement('section');
    section.className = 'brief-section wide';
    section.appendChild(textEl('h2', '', 'Concepts / Terms'));
    const concepts = document.createElement('div');
    concepts.className = 'concepts';
    b.concepts.forEach(c => {
      const item = document.createElement('div');
      item.className = 'concept';

      [['왜 생겼나: ', c.why_emerged], ['누가 만들었나: ', c.origin], ['연결되는 흐름: ', c.connections]].forEach(([label, text]) => { if (!text) return; const p = document.createElement('p'); const bold = textEl('b', '', label); p.appendChild(bold); p.append(text); item.appendChild(p); });
