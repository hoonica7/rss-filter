<!DOCTYPE html>
<html lang='en'>
<head>
<meta charset='UTF-8'>
<meta name='viewport' content='width=device-width, initial-scale=1.0'>
<title>Daily Paper Slideshow</title>
<style>
  :root {
    color-scheme: light;
    --bg: #f6f7f4;
    --paper: #ffffff;
    --ink: #111827;
    --muted: #64748b;
    --line: #d8ddd2;
    --accent: #176b87;
    --accent-2: #9a3412;
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; overflow: auto; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: var(--bg); color: var(--ink); }
  .shell { max-width: 1500px; min-height: 100vh; margin: 0 auto; padding: 14px 18px; display: flex; flex-direction: column; }
  .topbar { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 16px; }
  .top-actions { display: flex; align-items: center; gap: 10px; }
  .topbar a, button { border: 1px solid var(--line); border-radius: 8px; background: var(--paper); color: var(--ink); padding: 10px 14px; font-weight: 700; text-decoration: none; cursor: pointer; }
  button.primary { background: var(--accent); border-color: var(--accent); color: white; }
  button:disabled { opacity: 0.45; cursor: not-allowed; }
  .counter { color: var(--muted); font-weight: 700; }
  .slide { min-height: calc(100vh - 82px); background: var(--paper); border: 1px solid var(--line); border-radius: 10px; padding: 18px; box-shadow: 0 18px 42px rgba(15, 23, 42, 0.10); display: grid; grid-template-columns: minmax(310px, 0.86fr) minmax(0, 1.55fr); gap: 18px; overflow: visible; }
  .paper-head { min-width: 0; min-height: 0; overflow: visible; display: flex; flex-direction: column; gap: 12px; }
  .figure { margin: 0; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: #f8fafc; }
  .figure img { display: block; width: 100%; max-height: 41vh; object-fit: contain; background: white; }
  .figure figcaption { padding: 7px 10px; color: var(--muted); font-size: 12px; line-height: 1.3; }
  .head-text { display: flex; flex-direction: column; gap: 9px; min-width: 0; }
  .badges { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .badge { border-radius: 999px; padding: 5px 9px; background: #eef2ff; color: #3730a3; font-size: 12px; font-weight: 800; }
  .score { background: #fee2e2; color: #991b1b; }
  h1 { margin: 0; font-size: 25px; line-height: 1.15; letter-spacing: 0; overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
  h1 a { color: inherit; text-decoration-color: rgba(23, 107, 135, 0.35); text-decoration-thickness: 2px; text-underline-offset: 4px; }
  h1 a:hover { color: var(--accent); text-decoration-color: var(--accent); }
  .meta, .authors, .why, .abstract { font-size: 13px; line-height: 1.45; }
  .meta, .authors { color: var(--muted); }
  .why strong, .abstract strong, .authors strong { color: var(--ink); }
  .authors { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .why { border-left: 4px solid var(--accent-2); padding-left: 10px; color: #374151; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .abstract { border-top: 1px solid var(--line); padding-top: 14px; color: #374151; }
  .original-abstract { border-top: 1px solid var(--line); padding-top: 10px; color: #374151; font-size: 11.5px; line-height: 1.35; overflow-wrap: anywhere; }
  .original-abstract strong { display: block; margin-bottom: 4px; color: var(--ink); }
  .tags { display: flex; flex-wrap: wrap; gap: 8px; }
  .tag { border-radius: 999px; padding: 4px 8px; background: #f1f5f9; color: #475569; font-size: 12px; font-weight: 700; }
  .head-text > .link { display: none; }
  .briefing { min-width: 0; min-height: 0; overflow: visible; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); grid-auto-rows: minmax(0, auto); align-content: start; gap: 11px 18px; border-top: 0; padding-top: 0; }
  .brief-section { min-width: 0; }
  .brief-section.wide { grid-column: 1 / -1; }
  .brief-section h2 { margin: 0 0 4px; font-size: 14px; line-height: 1.22; color: #0f766e; letter-spacing: 0; }
  .brief-section p, .brief-section li { margin: 0; font-size: 12.5px; line-height: 1.42; color: #1f2937; overflow-wrap: anywhere; }
  .brief-section ul { margin: 0; padding-left: 20px; }
  .concepts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 9px 14px; }
  .concept { border-top: 1px solid var(--line); padding-top: 7px; }
  .concept h3 { margin: 0 0 4px; font-size: 13px; color: #7c2d12; letter-spacing: 0; }
  .concept p { margin: 2px 0 0; font-size: 11.5px; line-height: 1.35; color: #374151; overflow-wrap: anywhere; }
  .concept b { color: #111827; }
  .link { color: var(--accent); font-weight: 800; text-decoration: none; }
  .empty { padding: 48px; background: var(--paper); border: 1px solid var(--line); border-radius: 12px; color: var(--muted); }
  @media (max-width: 860px) {
    .shell { padding: 14px; }
    .topbar, .top-actions { align-items: stretch; flex-direction: column; }
    .slide, .briefing, .concepts { grid-template-columns: 1fr; }
    .slide { min-height: auto; overflow: visible; display: grid; }
    h1 { font-size: 28px; }
  }
</style>

<script>
const slides = [{"title": "Nodeless superconducting gap and electron-boson coupling in (La,Pr,Sm) 3 Ni 2 O 7 films", "journal": "Science", "source": "Gemini", "link": "https://doi.org/10.1126/science.adw8329", "authors": "Jianchang Shen, Guangdi Zhou, Yu Miao, et al.", "last_authors": "Junfeng He, Zhuoyu Chen", "summary": "The discovery of superconductivity in Ruddlesden-Popper bilayer nickelate films under ambient pressure provides an opportunity to directly investigate electronic energy scales of the superconducting state and the pairing mechanism. We report angle-resolved photoemission spectroscopy measurements of superconducting (La,Pr,Sm) 3 Ni 2 O 7 thin films by developing an ultrahigh-vacuum cryogenic sample quenching and transfer technique. A superconducting gap of ~18 milli–electron volts with coherence peaks is observed along the Brillouin zone diagonal. The finite gap persists across the entire Brillouin zone, revealing the absence of gap nodes. A kink is observed in the energy-momentum dispersion at ~70 milli–electron volts below the Fermi level, indicating an electron-boson coupling. The simultaneous observation of a nodeless superconducting gap and electron-boson coupling provides insight into the pairing symmetry and gluing mechanism in Ruddlesden-Popper bilayer nickelates.", "tier": "A_MUST_READ", "score": "10", "reason": "ARPES study of unconventional superconductivity in bilayer nickelates, a direct interest.", "tags": ["ARPES", "nickelate", "unconventionalsuperconductivity"], "image": "", "briefing": {"background": "이중층 니켈산염(Ruddlesden-Popper bilayer nickelates)은 고온 초전도체인 구리 산화물(cuprates)의 전자 구조와 유사한 점이 많아, 새로운 초전도 메커니즘을 규명하기 위한 핵심 물질군으로 주목받고 있습니다.", "motivation": "초전도 현상이 발견된 이후, 이 물질의 전자 에너지 스케일과 초전도 갭의 대칭성, 그리고 페어링(pairing)을 유도하는 보손(boson)의 성질을 직접 관측하고자 하였습니다.", "result": "ARPES를 통해 약 18 meV 크기의 노드(node)가 없는 초전도 갭을 관측했습니다. 또한 에너지-운동량 분산 관계에서 약 70 meV 부근의 킹(kink) 구조를 확인하여 전자-보손 결합의 증거를 포착했습니다.", "implication": "노드가 없는 초전도 갭은 이 물질이 이방성이 강한 s-wave 혹은 다른 비전통적 대칭성을 가질 가능성을 시사하며, 전자-보손 결합의 존재는 초전도 페어링 메커니즘의 중요한 단서를 제공합니다.", "novelty": "이중층 니켈산염 필름에 대해 고진공 극저온 시료 전송 기술을 적용하여 깨끗한 초전도 상태의 전자 구조를 직접 관측했다는 점에서 ARPES 기반 초전도체 연구의 새로운 이정표가 됩니다.", "unresolved": "관측된 70 meV의 킹을 유발하는 구체적인 보손(포논 vs 마그논)의 정체와 초전도 갭의 정확한 위상적 특성은 아직 추가 연구가 필요합니다.", "future_work": "온도 변화에 따른 갭의 닫힘 거동 및 다양한 도핑 수준에서의 전자 구조 변화 연구가 이어질 것으로 예상됩니다.", "concepts": [{"term": "Ruddlesden-Popper bilayer nickelate", "why_emerged": "구리 산화물 초전도체의 구조적 특징인 페로브스카이트 층과 암염 층의 반복 구조를 모방하여 초전도성을 구현하기 위해 고안됨.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "cuprates, iron pnictides와 같은 비전통적 초전도체와의 비교 연구."}, {"term": "Nodeless superconducting gap", "why_emerged": "초전도 페어링 대칭성을 결정하는 가장 중요한 물리량으로서, 페르미 면 위에서 갭이 0이 되는 지점의 유무를 판별.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "BCS 이론, d-wave 대칭성."}, {"term": "Electron-boson coupling", "why_emerged": "전자가 격자 진동(포논)이나 스핀 흔들림(마그논)과 상호작용하여 초전도 쌍을 형성하는 매개 기작을 설명하기 위해 도입.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "Eliashberg theory, ARPES kink analysis."}], "english_summary": ["Reported the first ARPES observation of the superconducting gap in bilayer nickelate films.", "Identified a nodeless ~18 meV superconducting gap along the Brillouin zone diagonal.", "Detected a ~70 meV kink in the dispersion indicating electron-boson coupling.", "These results provide fundamental insights into the pairing symmetry of nickelate superconductors."]}}, {"title": "Multiple closely spaced transitions and multi-band Hall response in clean ScV6Sn6", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2606.29048", "authors": "Jonathan M. DeStefano, Elliott Rosenberg, Chaowei Hu, Xiaodong Xu, Jiun-Haw Chu", "last_authors": "Xiaodong Xu, Jiun-Haw Chu", "summary": "arXiv:2606.29048v1 Announce Type: new Abstract: The kagome metal ScV$_6$Sn$_6$ has attracted attention as a platform for exploring the interplay between charge density wave (CDW) order and symmetry-breaking phenomena, including a recently reported intermediate phase and a low-field Hall anomaly that has been attributed to an anomalous Hall effect (AHE). The interpretation of both observations has been limited by the modest sample quality achieved by previous growth procedures, which produced crystals with in-plane residual resistivity ratios (RRR) of at most $\\approx$9. Here, we report a simple modification of the flux growth procedure that yields ScV$_6$Sn$_6$ single crystals with RRR exceeding 50, more than five times the previous highest reported value, and use this expanded mobility range to revisit both the symmetry and the magnetotransport of the CDW phase. We resolve a sequence of closely spaced transitions in the immediate vicinity of $T_{CDW}$ that emerges above a sharp threshold of RRR $\\approx 4$, and demonstrate through elastoresistivity that the intermediate phase breaks the three-fold rotational symmetry of the parent lattice. We examine the Hall response from both the parent samples across the full RRR range as well as Cr-doped samples, and conclude it is quantitatively inconsistent with an intrinsic AHE and is instead explained by ordinary multi-band transport involving small, high-mobility pockets identified through quantum oscillations. These results refine the symmetry-breaking landscape of ScV$_6$Sn$_6$ and establish systematic mobility tuning as a diagnostic for disentangling an intrinsic AHE from multi-band Hall contributions in kagome CDW systems.", "tier": "A_MUST_READ", "score": "10", "reason": "Direct relevance to kagome metals, CDW, and clarifying AHE vs multi-band effects.", "tags": ["kagome", "CDW", "transport", "ScV6Sn6"], "image": "https://arxiv.org/html/2606.29048v1/x1.png", "briefing": {"background": "ScV6Sn6는 카고메 격자 구조를 가진 금속으로, 전하 밀도 파(CDW)와 위상적 특성이 공존하여 강상관 전자계 물리 연구의 중요한 플랫폼입니다.", "motivation": "기존 시료의 낮은 품질(낮은 RRR) 때문에 CDW 상에서의 대칭성 파괴 현상과 홀 효과의 기원(이상 홀 효과 vs 다중 밴드 효과)을 명확히 구분하는 데 한계가 있었습니다.", "result": "고품질 단결정을 성장시켜 RRR을 50 이상으로 개선했습니다. 이를 통해 CDW 전이 근처의 다중 전이 현상을 분리하고, 홀 효과가 내재적 이상 홀 효과가 아닌 고이동도 밴드에 의한 다중 밴드 수송 현상임을 규명했습니다.", "implication": "카고메 물질에서 관측되는 이상 홀 효과 유사 신호들이 실제로는 시료 품질이나 밴드 구조에 의한 착시일 수 있음을 경고하며, 물질 분석 시 시료 품질(RRR) 관리의 중요성을 입증했습니다.", "novelty": "시료 성장법의 개선만으로 그간의 논란이었던 홀 효과의 기원을 명확히 밝혀냈으며, 탄성 저항 측정으로 CDW 중간상의 대칭성 파괴를 성공적으로 포착했습니다.", "unresolved": "높은 품질의 시료에서도 여전히 일부 미세한 수송 현상들이 존재하며, 이들이 정확히 어떤 밴드 구조적 토폴로지에서 기인하는지는 추가 계산이 필요합니다.", "future_work": "더 정밀한 저온 환경에서의 자성 측정 및 압력 의존성 연구를 통한 CDW 상의 위상적 성질 규명이 예상됩니다.", "concepts": [{"term": "RRR (Residual Resistivity Ratio)", "why_emerged": "금속 시료 내의 불순물 및 결함 정도를 정량화하여 전기적 수송 특성의 깨끗함(cleanliness)을 측정하는 지표.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "Fermi surface, mean free path."}, {"term": "Anomalous Hall Effect (AHE)", "why_emerged": "자기 물질에서 외부 자기장 외에도 자화에 의한 베리 곡률(Berry curvature)이 홀 전압을 유도하는 현상을 설명하기 위해 제안됨.", "origin": "Edwin Hall (1879)이 발견한 Hall effect의 확장.", "connections": "Topological Hall effect, Berry curvature."}, {"term": "Elastoresistivity", "why_emerged": "결정에 응력을 가해 격자 대칭성이 깨질 때 저항 변화를 측정하여 전자 네마틱(nematic) 차수를 조사하기 위해 도입.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "Nematicity, rotational symmetry breaking."}], "english_summary": ["Achieved high-quality ScV6Sn6 crystals with RRR > 50, exceeding previous records.", "Resolved multiple transitions near T_CDW and confirmed symmetry breaking via elastoresistivity.", "Demonstrated that the reported Hall anomaly is due to multi-band transport, not intrinsic AHE.", "Established RRR-based mobility tuning as a diagnostic for transport anomalies in kagome metals."]}}, {"title": "Orbital current signature using neutron diffraction", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2602.17311", "authors": "Dalila Bounoua, William Li\\`ege, Yvan Sidis, Philippe Bourges", "last_authors": "Yvan Sidis, Philippe Bourges", "summary": "arXiv:2602.17311v2 Announce Type: replace Abstract: We review the hallmarks of orbital loop currents in various correlated electron materials and how they have been evidenced using polarized neutron diffraction. Over the last 20 years, loop current signatures have been observed in high temperature copper oxide superconductors, iridates, copper oxides spin ladders and recently kagome vanadate superconductors. Such currents induce orbital magnetic moments within the unit cell of these quantum materials that can be detected through their interaction with the neutron spin. In addition to the usual description of orbital moments using point-like local magnetic moments, we here show an alternative description of the neutron magnetic cross-section involving the microscopic currents running between different atomic orbitals. We discuss the corresponding magnetic structure factors and the resulting quantitative differences between both approaches.", "tier": "A_MUST_READ", "score": "10", "reason": "Review of orbital loop currents in kagome vanadates and cuprates detected via polarized neutron diffraction.", "tags": ["loop_current", "neutron_scattering", "kagome", "cuprate", "superconductivity", "TRSB"], "image": "https://arxiv.org/html/2602.17311v2/Diagrammes_de_phase.jpg", "briefing": {"background": "구리 산화물 및 카고메 금속 등에서 시간 반전 대칭성(TRSB)을 깨는 자발적인 궤도 루프 전류(orbital loop currents)는 오랜 기간 초전도 기원설의 후보 중 하나였습니다.", "motivation": "편극 중성자 회절(polarized neutron diffraction)을 활용하여 이러한 미세한 전류 루프를 실험적으로 검출하고, 기존의 점자기모멘트 모형과의 차이점을 재정립하고자 했습니다.", "result": "지난 20년간 구리 산화물, 이리데이트, 카고메 바나데이트 등에서 관측된 루프 전류 신호들을 체계적으로 정리했습니다. 중성자 산란 단면적을 계산할 때 기존의 점자기모멘트 방식보다 미세 전류 모델이 더 정확할 수 있음을 보였습니다.", "implication": "루프 전류의 실재 여부를 검증하는 중성자 산란 데이터 해석 방식에 대한 표준을 제공하며, 강상관 전자계에서 숨겨진 질서 변수(hidden order parameter)를 찾는 연구를 강화합니다.", "novelty": "다양한 물질군에 걸쳐 루프 전류 관측 사례를 통합 분석하고, 이론적 해석 방식을 물리적으로 더 정교한 모델로 업그레이드했습니다.", "unresolved": "루프 전류가 정말로 초전도성의 원인인지, 아니면 동반되는 부차적인 현상인지에 대한 논쟁은 여전히 지속되고 있습니다.", "future_work": "더 높은 공간 분해능을 가진 중성자 산란 및 정밀한 대칭성 해석을 통해 루프 전류의 자기적 구조를 시각화하는 시도가 예상됩니다.", "concepts": [{"term": "Orbital loop current", "why_emerged": "물질 내의 궤도 운동에 의해 t: Altermagnetism is an emerging class of magnetic order characterized by momentum-dependent spin-split electronic structures despite vanishing net magnetization. Although momentum-space signatures consistent with altermagnetism have been reported in a growing number of materials, their relationship to the underlying real-space magnetic configurations remains incompletely understood, because similar spin-split electronic structures can arise from distinct magnetic orders. In the candidate d-wave altermagnet KV2Se2O, the magnetic origin of the observed momentum-dependent spin splitting has remained controversial. Here, we employ spin-polarized scanning tunnelling microscopy combined with magnetic-field-dependent quasiparticle interference imaging to determine the magnetic configuration of KV2Se2O at the atomic scale. Spin-resolved quasiparticle interference reveals a checkerboard-like antiparallel spin texture within the V2O layer and determines its interlayer spin arrangement across unit-cell step edges. Remarkably, we identify both C-type and G-type magnetic configurations, both of which generate similar spin-split electronic structures at the single-layer level but correspond to d-wave altermagnetic and conventional antiferromagnetic orders, respectively. These observations reveal a complex magnetic landscape arising from nearly degenerate magnetic states. Our results establish a direct connection between momentum-space spin splitting and real-space magnetic order, providing a framework for identifying the microscopic origin of spin-split electronic structures in altermagnetic materials.", "tier": "A_MUST_READ", "score": "9", "reason": "Direct STM/STS study of altermagnetism, highly relevant to user profile.", "tags": ["STM", "altermagnet", "spin-polarizedSTM", "magnetism"], "image": "https://arxiv.org/static/browse/0.3.4/images/arxiv-logo-fb.png", "briefing": {"background": "알터자성(altermagnetism)은 순 자화(net magnetization)가 0임에도 불구하고 운동량 공간에서 스핀 분할된 전자 구조를 가지는 새로운 자기 질서입니다. 최근 많은 후보 물질이 보고되었으나, 실험적으로 관측된 스핀 분할이 실제 물질 내부의 어떤 자기 배치에서 기인하는지를 실공간에서 규명하는 것이 난제로 남아있었습니다.", "motivation": "후보 물질인 KV2Se2O에서 관측된 운동량 의존적 스핀 분할의 자기적 기원을 명확히 하고, 서로 구분이 어려운 알터자성과 일반적인 반강자성 상태 사이의 관계를 실공간에서 직접 확인하고자 했습니다.", "result": "스핀 편극 STM과 QPI(Quasiparticle Interference)를 통해 KV2Se2O의 V2O 층 내에서 체커보드 형태의 반평행 스핀 텍스처를 확인했습니다. 특히 동일한 전자 구조를 보일 수 있는 C-타입(d-파 알터자성)과 G-타입(반강자성) 자기 구성을 원자 단위에서 구분해냈습니다.", "implication": "알터자성 물질에서 운동량 공간의 스핀 분할과 실공간의 미세 자기 구조 간의 직접적인 연결 고리를 제공하며, 향후 유사한 스핀-분할 물질들을 분류하는 강력한 프레임워크를 마련했습니다.", "novelty": "STM 기법을 활용하여 모호했던 알터자성 후보 물질의 미세 자기 구조를 시각화한 점이 매우 중요합니다. 이는 사용자 프로필에 명시된 STS/STM을 통한 전자 구조 및 자성 연구에 직접적으로 부합하는 성과입니다.", "unresolved": "거의 축퇴된(nearly degenerate) 여러 자기 상태들이 왜 특정 조건에서 어떤 형태로 나타나는지에 대한 제어 메커니즘과 그 안정성에 대한 상세한 물리적 분석이 추가로 필요합니다.", "future_work": "외부 자기장이나 압력 등 외부 변수 변화에 따른 C-타입과 G-타입 간의 상전이 연구 및 이를 활용한 스핀트로닉스 소자 응용 연구가 기대됩니다.", "concepts": [{"term": "Altermagnetism", "why_emerged": "기존의 강자성(넷 자화 존재)과 반강자성(스핀 분할 없음) 분류로 설명되지 않는, 비자성체와 유사한 넷 자화 특성을 가지면서도 스핀 분할 전자 구조를 갖는 물질군을 체계화하기 위해 등장했습니다.", "origin": "최근 수년 내 이론적 제안이 활발히 이루어졌으며, 체코 물리 연구소 팀이 이론적 토대를 확립하는 데 큰 기여를 했습니다.", "connections": "반강자성체, 스핀 밸리 물리학, Weyl 반금속과 깊은 연관이 있습니다."}, {"term": "Spin-polarized STM", "why_emerged": "비자성 STM으로는 구분이 어려운 원자 단위의 자기 모멘트 방향과 자기적 질서를 실공간에서 직접적으로 측정하기 위해 개발되었습니다.", "origin": "20세기 후반 Wiesner 등에 의해 기초가 마련된 후, 2000년대 초반 Wiesendanger 그룹 등에 의해 현대적 형태로 발전했습니다.", "connections": "QPI(Quasiparticle Interference), 자기력 현미경(MFM), 스핀트로닉스 측정 기술."}], "english_summary": ["Real-space identification of magnetic configurations in KV2Se2O using spin-polarized STM.", "Distinguishes between d-wave altermagnetic and conventional antiferromagnetic orders.", "Establishes a direct bridge between momentum-space spin splitting and real-space atomic textures.", "Reveals a complex magnetic landscape of nearly degenerate states."]}}, {"title": "What Does the Single-Particle Spectrum Imply on the Pairing Nature and Pairing Mechanism in La3Ni2O7?", "journal": "arXi 을 통해 비상대론적 시간 반전 대칭성 파괴를 직접 입증했다는 점에서 매우 중요합니다.", "unresolved": "실온에서의 도메인 제어 가능성과 실제 소자 구조 내에서의 안정성에 대해서는 추가 연구가 필요합니다.", "future_work": "다양한 알터자기 물질군으로 연구를 확장하고, 스핀 전류 주입을 통한 도메인 스위칭 메커니즘을 규명할 것으로 예상됩니다.", "concepts": [{"term": "알터자기", "why_emerged": "강자성과 반강자성 사이의 새로운 자기 질서로서 스핀 분할과 비상대론적 TRS 파괴를 동시에 설명하기 위해 제안됨.", "origin": "최근 2020년대 들어 급격히 이론 및 실험적 정립.", "connections": "위상 자기 물질, 엑시톤 자성, 스핀트로닉스."}, {"term": "편극 중성자 회절", "why_emerged": "물질 내 미세한 자기 모멘트의 배치와 스핀 배열을 직접적으로 분석하기 위해 필요함.", "origin": "클리퍼드 셜(Clifford Shull), 1940년대.", "connections": "자기 구조 분석, 중성자 산란."}], "english_summary": ["Altermagnetic order breaks time-reversal symmetry without net magnetization.", "Polarized neutron diffraction is used to observe domain switching in bulk MnTe.", "The experiment directly confirms the Néel vector orientation and phase control.", "This provides a foundation for altermagnetic spintronics."]}}, {"title": "Revisiting the Charge-Density-Wave Superlattice of 1T−TiSe2", "journal": "PRL_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/btvb-ngy5", "authors": "Wei Wang, Patrick Liu, Lijun Wu, et al.", "last_authors": "Alfred Zong, Yimei Zhu", "summary": "Author(s): Wei Wang, Patrick Liu, Lijun Wu, Jing Tao, Genda Gu, Binghai Yan, Alfred Zong, and Yimei Zhu A number of intriguing phenomena, including exciton condensation, orbital ordering, and emergence of chirality, have been proposed to accompany charge-density-wave (CDW) formation in the layered transition metal dichalcogenide $1T\\text{−}{\\mathrm{TiSe}}_{2}$. Explaining these effects relies on knowl… [Phys. Rev. Lett. 136, 256101] Published Thu Jun 25, 2026", "tier": "B_IMPORTANT_CONDMAT", "score": "9", "reason": "Direct relevance to CDW materials and electronic structure in TMDs.", "tags": ["CDW", "TiSe2", "TMDs"], "image": "", "briefing": {"background": "1T-TiSe2는 전하 밀도 파동(CDW)과 초전도성이 공존하는 대표적인 전이금속 디칼코게나이드(TMD) 물질로, CDW의 형성이 전자적 상호작용인지 격자 왜곡인지에 대한 논쟁이 오래 지속되어 왔습니다.", "motivation": "TiSe2의 CDW 상태와 함께 나타나는 엑시톤 응축, 궤도 정렬, 카이랄성 등의 현상을 설명하기 위해 정확한 초격자 구조와 전자 구조의 관계를 재검토하고자 합니다.", "result": "최신 관측 기술을 통해 TiSe2의 CDW 초격자 구조 내의 미세한 전자적/구조적 정보를 재평가하여 기존 모델의 모호성을 해결했습니다.", "implication": "TMD 물질에서의 CDW 기원 연구에 있어 격자 구조의 정밀한 정의가 위상적 물성과 상관관계 규명에 필수적임을 시사합니다.", "novelty": "독자님의 관심사인 TMD 및 CDW 분야에서 고전적 모델을 최신 기술로 재해석하여 전자 구조 연구의 표준을 높였다는 점이 중요합니다.", "unresolved": "CDW 형성의 핵심 원동력인 엑시톤 응축과 전자-포논 결합의 기여도를 명확히 분리하는 작업은 여전히 도전 과제입니다.", "future_work": "시간 분해 분광학이나 STM/STS를 통한 실시간 동역학 연구를 통해 CDW의 위상 변화를 추적하는 연구가 이어질 것입니다.", "concepts": [{"term": "전하 밀도 파동(CDW)", "why_emerged": "전자 밀도가 공간적으로 주기적인 변조를 일으키며 나타나는 기저 상태를 설명하기 위해 제안됨.", "origin": "루돌프 파이얼스(Rudolf Peierls), 1950년대.", "connections": "초전도성, 전자-포논 결합, 페르미 면 중첩."}, {"term": "엑시톤 응축", "why_emerged": "전자와 정공이 결합하여 응축된 상태를 형성하는 기작이 반도체 및 반금속의 절연체 전이를 설명하는 데 필요함.", "origin": "낙스(Knox), 1963년.", "connections": "TiSe2, 강상관 전자계."}], "english_summary": ["1T-TiSe2 is a classic system for studying CDW and its complex interplay with electronic phases.", "The study revisits the superlattice structure of the CDW phase.", "Precise structural data helps clarify proposals like exciton condensation and orbital ordering.", "This work provides a critical update for understanding TMDs and CDW mechanisms."]}}, {"title": "Interaction-induced nematic Dirac semimetal from quadratic band touching: A constrained-path quantum Monte Carlo study (SciPost Phys.)", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2507.15668", "authors": "Zi Hong Liu, Hongyu Lu, Zi Yang Meng, Lukas Janssen", "last_authors": "Zi Yang Meng, Lukas Janssen", "summary": "arXiv:2507.15668v2 Announce Type: replace Abstract: Electronic systems with quadratic band touchings, commonly found in two- and three-dimensional materials such as Bernal-stacked bilayer graphene, kagome metals, HgTe, and pyrochlore iridates, have attracted significant interest concerning the role of interactions in shaping their electronic properties. However, even in the simplest model of spinless fermions on a two-dimensional checkerboard lattice, the quantum phase diagram as a function of nearest-neighbor interaction remains under debate. We employ constrained-path quantum Monte Carlo simulations (CP-QMC) simulations to investigate the problem using a two-dimensional torus geometry. We cross-validate our results on small lattices by comparing them with density-matrix renormalization group calculations, finding quantitative agreement. In particular, we implement an improved optimization scheme within the CP-QMC simulations, enabling the identification of a bond-nematic Dirac semimetal phase that was found in tensor-network studies on cylindrical geometries, but remains inaccessible to Hartree-Fock mean-field methods. The CP-QMC approach makes it possible to establish the emergence of this phase in a geometry that preserves lattice rotational symmetry and permits extrapolation to the thermodynamic limit. Our results show that the quantum phase diagram of spinless fermions on the checkerboard lattice with nearest-neighbor repulsion features three interaction-induced phases at half filling: a quantum anomalous Hall insulator at weak coupling, a bond-nematic Dirac semimetal at intermediate coupling, and a site-nematic insulator at strong coupling.", "tier": "B_IMPORTANT_CONDMAT", "score": "9", "reason": "Identifies interaction-induced nematic Dirac semimetal and anomalous Hall in kagome metals and graphene.", "tags": ["kagomemetals", "nematicity", "Diracsemimetal", "anomalousHall", "graphene", "stronglycorrelated", "computationalmaterials"], "image": "https://arxiv.org/html/2507.15668v2/x1.png", "briefing": {"background": "2차원 격자 시스템에서 2차 이상의 밴드 접촉(Quadratic band touching)을 가지는 전자들은 상호작용에 매우 민감하며, 이로 인해 대칭성이 깨진 다양한 양자 상태가 발현될 수 있습니다. 이는 그래핀이나 카고메 금속 등에서 나타나는 강상관 전자계 물성의 핵심 기전입니다.", "motivation": "기존의 평균장 이론(Hartree-Fock)으로는 체커보드 격자 상의 스핀 없는 페르미온 모델에서 발생하는 복잡한 양자 상도(phase diagram)를 완전히 기술하는 데 한계가 있었습니다. 이를 CP-QMC 시뮬레이션으로 정확히 규명하고자 했습니다.", "result": "근접 상호작용의 세기에 따라 양자 변칙 홀 절연체, 결합-네마틱 디락 반금속, 그리고 사이트-네마틱 절연체 순으로 상전이가 일어남을 확인했습니다. 특히 결합-네마틱 디락 반금속 상의 존재를 명확히 입증했습니다.", "implication": "강상관 전자계에서 격자 회전 대칭성이 자발적으로 깨지는 네마틱 상의 이론적 토대를 견고히 했으며, 이는 카고메 금속의 위상적 성질과 네마틱 질서 간의 상관관계를 이해하는 데 중요한 통찰을 제공합니다.", "novelty": "기존 Hartree-Fock 이론으로 접근 불가능했던 네마틱 디락 반금속 상을 CP-QMC 시뮬레이션을 통해 열역학적 극한까지 검증했다는 점이 핵심이며, 독자 관심사인 카고메 금속 내 전자 질서 형성을 이해하는 강력한 이론적 도구가 됩니다.", "unresolved": "이 시뮬레이션은 스핀 없는 페르미온 모델에 집중되어 있어, 실제 물질에서의 스핀-궤도 결합 및 실제 스핀 자유도가 미치는 영향은 추가 연구가 필요합니다.", "future_work": "실제 물질의 격자 구조와 스핀 자유도를 포함한 구체적인 카고메 금속 화합물에 대한 계산 및 ARPES를 통한 페르미 표면의 네마틱 변형 직접 관측이 요구됩니다.", "concepts": [{"term": "Quadratic Band Touching", "why_emerged": "밴드 구조가 선형이 아닌 이차 함수 형태로 접촉하는 지점으로, 상태 밀도가 발산하여 상호작용 효과가 극대화되기 때문입니다.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "그래핀(선형 접촉), 위상 절연체 및 카고메 금속의 밴드 이론"}, {"term": "Bond-Nematic Dirac Semimetal", "why_emerged": "격자의 회전 대칭성은 유지하지만 결합(bond) 세기의 비대칭성을 통해 전자의 위상적 성질이 변하는 상을 기술하기 위함입니다.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "강상관 전자계의 네마틱 질서, 위상적 반금속"}], "english_summary": ["Investigated the quantum phase diagram of spinless fermions on a checkerboard lattice using CP-QMC.", "Identified three distinct phases: quantum anomalous Hall insulator, bond-nematic Dirac semimetal, and site-nematic insulator.", "Confirmed the bond-nematic Dirac semimetal phase using a rotationally symmetric geometry.", "Provides theoretical insight into interaction-induced electronic order in kagome metals and related lattice systems."]}}, {"title": "Unconventional Superconductivity in the Chiral Topological Semimetal Ag2Pd3S", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2606.29767", "authors": "Roshan Kumar Kushwaha, Dibyendu Samanta, Sudarshan Sharma, et al.", "last_authors": "Sudeep Kumar Ghosh, Ravi Prakash Singh", "summary": "arXiv:2606.29767v1 Announce Type: new Abstract: Chiral crystals provide a unique setting where broken inversion symmetry, strong spin-orbit coupling, and electronic topology intertwine, yet superconductivity in intrinsically chiral materials remains rare. Here, we report unconventional superconductivity in the chiral topological semimetal Ag$_2$Pd$_3$S, an enantiomorphic analog of natural mineral coldwellite, crystallizing in the right-handed space group $P4_132$. Bulk superconductivity with a transition temperature $T_C = 1.1(2)$ K is confirmed by electrical resistivity, magnetization, and specific-heat measurements. Muon spin rotation and relaxation ($\\mu$SR) experiments reveal a fully gapped superconducting state that spontaneously time-reversal symmetry (TRS) breaking establishing Ag$_2$Pd$_3$S as the first chiral topological semimetal superconductor exhibiting intrinsic TRS breaking. First-principles calculations uncover multiple multifold band crossings near the Fermi level, hosting Kramers-Weyl, double spin-1, and spin-3/2 quasiparticles with large topological charges. These unconventional fermions generate symmetry-protected topological surface states and underscore the nontrivial topology of the normal state. Symmetry analysis based on the Ginzburg-Landau theory suggests a loop-supercurrent-ordered superconducting state, yielding a full gap alongside spontaneous TRS breaking. The coexistence of TRS-breaking superconductivity and chiral multifold fermions identifies Ag$_2$Pd$_3$S as a platform for realizing intrinsic superconducting diode effects and chirality-induced spin selectivity, offering a transformative pathway toward dissipationless topological quantum technologies.", "tier": "B_IMPORTANT_CONDMAT", "score": "9", "reason": "Topological semimetal with unconventional superconductivity and time-reversal symmetry breaking.", "tags": ["topological", "superconductivity", "semimetal"], "image": "https://arxiv.org/html/2606.29767v1/x1.png", "briefing": {"background": "키랄(chiral) 결정 구조는 반전 대칭성이 깨져 있고 강한 스핀-궤도 결합을 포함하여, 위상적 특성과 비전통적 초전도성이 결합하기에 최적의 환경을 제공합니다.", "motivation": "키랄성(chirality)이 유지되는 물질 내에서 자발적 ature.com/article&sz=728x90&c=-495561126&t=pos%3Dtop%26type%3Darticle%26artid%3Ds41535-026-00905-4%26doi%3D10.1038/s41535-026-00905-4%26subjmeta%3D301,639,766%26kwrd%3DMaterials+science,Physics", "briefing": {"background": "반 호브 특이점(van Hove singularity, vHs)은 밴드 구조의 상태 밀도가 발산하는 지점으로, 전자의 상관관계와 페르미 불안정성(초전도, CDW 등)을 결정짓는 핵심 물리 요소입니다. 일반적인 2D vHs와 다른 새로운 형태의 특이점 관측은 전자 구조 연구의 중요한 마일스톤입니다.", "motivation": "특정 결정 구조에서 발생하는 saddle-loop 형태의 vHs가 전자 구조와 물성에 미치는 영향을 실험적으로 규명하고자 합니다.", "result": "ARPES를 통해 saddle-loop vHs를 직접 관측하였으며, 이 구조가 시스템의 상태 밀도에 어떠한 영향을 미치는지 상세히 분석했습니다.", "implication": "saddle-loop vHs의 발견은 관련 물질에서 나타나는 초전도나 CDW의 메커니즘을 밴드 구조 측면에서 재해석할 수 있는 단서를 제공합니다.", "novelty": "단순한 점(point) 형태의 vHs를 넘어, 복잡한 사다리형 루프 구조를 ARPES로 직접 시각화했다는 점이 강점입니다. 이는 카고메 금속의 복합적인 밴드 구조 연구와 직접적으로 연결됩니다.", "unresolved": "이 vHs가 실제 페르미 준위 근처에서 구동하는 구체적인 물리적 상전이의 증거를 연결하는 상세 분석이 필요합니다.", "future_work": "도핑이나 압력을 통한 vHs 제어 실험 및 이론적인 모델링 연구가 후속될 것으로 보입니다.", "concepts": [{"term": "van Hove singularity", "why_emerged": "상태 밀도의 발산을 이해하여 전이 온도나 상전이 기원을 설명하기 위해.", "origin": "Léon van Hove (1953).", "connections": "페르미 면, 초전도성, 전하 밀도 파동."}, {"term": "Saddle-loop", "why_emerged": "일반적인 2D 평면 vHs와 차별화되는 고차원적 밴드 특이점을 기술하기 위해.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "전자 구조, 밴드 엔지니어링."}, {"term": "ARPES", "why_emerged": "물질의 역격자 공간 내 에너지-운동량 관계를 직접 측정하기 위해.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "밴드 구조, 전자 상관관계."}], "english_summary": ["Reports the experimental observation of a saddle-loop van Hove singularity.", "Uses high-resolution ARPES to map the band structure near the singularity.", "Enhances understanding of how complex density of states features influence electronic properties.", "Provides vital data for characterizing correlated electron systems and related instabilities."]}}, {"title": "On the robustness of topological gap detection via transport", "journal": "Nature", "source": "Gemini", "link": "https://www.nature.com/articles/s41586-026-10567-8", "authors": "Henry 써 해당 물질을 일시적으로 위상 절연체 상태로 변환할 수 있는지 검증하고자 했습니다.", "result": "반도체 물질의 전자 구조가 광 펄스에 의해 변형되어 밴드갭 내에 위상적으로 보호된 금속성 표면 상태가 나타남을 확인했습니다.", "implication": "초고속 광 제어를 통해 물질의 위상적 성질을 동적으로 스위칭할 수 있음을 보여주며, 이는 향후 빛을 이용한 위상 소자 개발의 기초가 됩니다.", "novelty": "기존의 정적인 위상 물질 연구에서 벗어나, 플로케 공학을 통해 위상적 성질을 비평형 상태에서 유도해냈다는 점이 핵심입니다. 특히 ARPES를 통한 전자 구조 관측에 관심이 많은 사용자에게 동적 밴드 구조 제어의 가능성을 제시합니다.", "unresolved": "이러한 빛 유도 위상 상태의 수명과 위상 보호의 견고성, 그리고 결맞음성이 얼마나 유지되는지에 대한 상세한 물리적 한계는 추가 연구가 필요합니다.", "future_work": "시간 분해 ARPES 등을 활용하여 위상 상태가 형성되는 동역학적 과정의 상세 관측과, 광원의 파라미터(세기, 파장)에 따른 위상 전이의 제어 범위 최적화 연구가 예상됩니다.", "concepts": [{"term": "플로케 공학", "why_emerged": "주기적으로 구동되는 시스템에서 해밀토니안의 시간 의존성을 이용하여 유효 에너지를 제어하기 위해 등장했습니다.", "origin": "준-에너지(quasi-energy) 개념을 도입한 Floquet 이론(1883년)에 기반하며, 최근 응집물질물리학에서 활발히 적용되었습니다.", "connections": "위상 절연체, 광유도 초전도성, 동적 위상 물질 전이 연구와 연결됩니다."}, {"term": "위상 절연체", "why_emerged": "물질 내부와 표면의 전도성이 위상적으로 다름을 설명하기 위해 이론화되었습니다.", "origin": "Kane & Mele(2005), Bernevig, Hughes & Zhang(2006) 등에 의해 정립되었습니다.", "connections": "스핀-궤도 결합, 양자 스핀 홀 효과, Weyl/Dirac 반금속 등과 깊은 관계가 있습니다."}], "english_summary": ["Light-induced Floquet engineering is applied to transform a semiconductor into a topological insulator.", "Ultra-short pulses create metallic surface states within the band gap transiently.", "This work demonstrates the dynamic control of topological phases via light-matter interaction.", "The result suggests pathways for ultrafast topological quantum switching."]}}, {"title": "Decisive role of an extra Fe sublattice: Frustration, criticality, and skyrmions in the van der Waals ferromagnets Fe5GeTe2 versus Fe3GeTe2", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/v9rm-l6vb", "authors": "Jyoti Saini, Ankita Tiwari, Pawan Kumar Srivastava, Changgu Lee, Subhasis Ghosh", "last_authors": "Changgu Lee, Subhasis Ghosh", "summary": "Author(s): Jyoti Saini, Ankita Tiwari, Pawan Kumar Srivastava, Changgu Lee, and Subhasis Ghosh The van der Waals magnets ides insights into how structural complexity dictates emergent magnetic orders.", "The findings offer design principles for magnetic topological materials."]}}, {"title": "Flat-band driven Kondo breakdown and reentrant effects in heavy-fermion moiré superlattices", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/85vr-blw1", "authors": "Fabian Eickhoff, Jian-Xin Zhu, Benedikt Fauseweh", "last_authors": "Jian-Xin Zhu, Benedikt Fauseweh", "summary": "Author(s): Fabian Eickhoff, Jian-Xin Zhu, and Benedikt Fauseweh Moiré superlattices (MSLs) in van der Waals heterostructures have demonstrated their incredible power in driving emergent electronic phenomena, some of which are reminiscent of those usually only observed in bulk strongly correlated quantum materials. With the recent discovery of van der Waals $f$-e… [Phys. Rev. B 113, 235153] Published Fri Jun 26, 2026", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Heavy-fermion physics in moiré heterostructures.", "tags": ["moiré", "heavy-fermion", "Kondo"], "image": "", "briefing": {"background": "모아레 초격자(Moiré superlattices)는 강상관 전자계의 물성을 구현하는 강력한 도구입니다. 최근 f-전자 물질을 기반으로 한 모아레 구조가 등장하면서, 이들 시스템에서의 콘도 효과와 중페르미온 물성을 다루는 것이 새로운 화두가 되었습니다.", "motivation": "모아레 초격자 내에서 나타나는 평탄 밴드(flat-band)가 어떻게 콘도 붕괴(Kondo breakdown)를 유도하고, 재진입(reentrant) 효과와 같은 특이한 양자 현상을 만들어내는지 이론적으로 규명하고자 했습니다.", "result": "모아레 밴드의 평탄한 특성이 강한 상관관계를 유도하여, 전형적인 중페르미온 물리인 콘도 스크리닝이 붕괴되는 지점을 확인하고 재진입 효과를 설명했습니다.", "implication": "모아레 이질 접합계가 단순한 모델을 넘어 중페르미온 시스템의 물성을 모사하고 제어할 수 있는 플랫폼임을 입증했습니다.", "novelty": "강상관 전자계의 고전적인 콘도 물성을 모아레 시스템이라는 제어 가능한 플랫폼으로 가져와 새로운 양자 상태를 예측했다는 점에서 연구 가치가 높습니다.", "unresolved": "실제 실험적 모아레 시스템에서 이 모델이 예측하는 콘도 붕괴가 어떠한 ARPES 스펙트럼 변화나 수송 현상으로 나타날지에 대한 구체적인 실험 검증이 필요합니다.", "future_work": "STM/STS를 이용한 국소 상태 밀도 관측과, 극저온 수송 측정을 통한 콘도 붕괴의 위상적 신호 확인이 향후 과제입니다.", "concepts": [{"term": "콘도 붕괴", "why_emerged": "중페르미온 시스템에서 전도 전자와 국소 스핀 사이의 결합이 끊어지는 양자 임계 현상을 설명하기 위해 제안되었습니다.", "origin": "초록 정보만으로는 특정하기 어려움 (주로 Si, Coleman 등에 의해 논의됨).", "connections": "중페르미온, 양자 임계점, 반강자성 전이 등과 연결됩니다."}, {"term": "모아레 초격자", "why_emerged": "서로 다른 2D 물질을 쌓을 때 엇각에 의해 형성되는 주기적인 퍼텐셜로 물성을 엔지니어링하기 위해 등장했습니다.", "origin": "Bistritzer & MacDonald(2011)에 의한 비틀린 이중층 그래핀 모델이 시초입니다.", "connections": "강상관 전자계, 초전도성, 밸리트로닉스와 연결됩니다."}], "english_summary": ["Investigation of heavy-fermion physics in moiré superlattices.", "Flat-band structures drive Kondo breakdown and emergent reentrant effects.", "The paper theoretically links moiré systems to bulk strongly correlated materials.", "The findings offer a path to simulating heavy-fermion phenomena in controllable 2D platforms."]}}, {"title": "Gap structure and phase diagram of twisted bilayer cuprates from a microscopic perspective", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/85jn-qp4t", "authors": "Siddhant Panda, Andreas Kreisel, Laura Fanfarillo, P. J. Hirschfeld", "last_authors": "Laura Fanfarillo, P. J. Hirschfeld", "summary": "Author(s): Siddhant Panda, Andreas Kreisel, Laura Fanfarillo, and P. J. Hirschfeld Twisted cuprate Josephson junctions have been proposed as candidate platforms for superconducting states that break time-reversal symmetry. However, experiments report conflicting signatures. Here, the authors show that this variability can arise from microscopic parameters: the systematic exploration of the phase diagram reveals that twist angle θ, filling, and interlayer tunneling strength stabilize distinct competing superconducting states. The results clarify how differences between devices can determine whether time-reversal symmetry breaking appears. [Phys. Rev. B 113, 224523] Published Tue Jun 23, 2026", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Relevant to TRSB and unconventional superconductivity in twisted systems.", "tags": ["cuprate", "superconductivity", "twisted"], "image": "", "briefing": {"background": "트위스티드 이질구조(Twisted bilayer systems)는 층간 비틀림 각도와 상호작용을 제어하여 초전도 상태를 공학적으로 설계하려는 플랫폼으로 주목받고 있습니다. 특히 구리산화물 고온 초전도체를 이용한 트위스티드 조셉슨 접합은 시간 반전 대칭성 파괴(TRSB) 상태를 구현할 수 있는 후보로 제안되어 왔습니다.", "motivation": "실험마다 트위스티드 구리산화물 접합에서 TRSB 관측 여부가 상충되는 결과가 보고됨에 따라, 이러한 실험적 가변성의 근본적인 미시적 원인을 규명하고자 하였습니다.", "result": "비틀림 각도(θ), 전하 채움(filling), 층간 터널링 강도 등 미시적 파라미터에 따라 여러 초전도 상태가 경쟁하며, 이 파라미터들의 미세한 차이가 TRSB 발현 여부를 결정한다는 점을 확인했습니다.", "implication": "실험 데이터의 불일치가 장치의 미시적 파라미터 차이에서 기인함을 설명함으로써, 향후 트위스티드 고온 초전도체 제어 연구의 이론적 토대를 제공합니다.", "novelty": "구리산화물 기반 트위스티드 시스템에서의 상도(phase diagram)를 미시적 관점에서 체계적으로 분석하여 TRSB의 발생 조건을 구체화했습니다.", "unresolved": "실험적 파라미터 편차를 넘어서는 실제 소자 제작의 공정 난제 및 TRSB 상태의 직접적인 위상적 증거 확보는 여전히 과제로 남습니다.", "future_work": "특정 비틀림 각도에서의 상태를 안정화하기 위한 정밀 소자 설계 및 실제 실험 데이터와의 정량적 대조 연구가 필요합니다.", "concepts": [{"term": "트위스티드 조셉슨 접합", "why_emerged": "층간 비틀림을 통해 고유한 초전도 물성과 대칭성 변화를 유도하기 위해 필요함", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "트위스티드 이중층 그래핀(TBG), 고온 초전도체 접합 물성"}, {"term": "시간 반전 대칭성 파괴 (TRSB)", "why_emerged": "초전도 상태의 대칭성을 이해하고 위상적 물성을 분류하기 위해 필수적임", "origin": "초전도 이론의 일반적인 대칭성 연구에서 유래", "connections": "카이랄 초전도체, 고온 초전도체의 순서 매개변수 분석"}], "english_summary": ["Twisted cuprate Josephson junctions show conflicting experimental signatures of time-reversal symmetry breaking.", "The authors analyze the phase diagram based on microscopic parameters like twist angle and interlayer tunneling.", "Variable superconducting states result from competing phases stabilized by these specific parameters.", "The study provides a framework to understand device-dependent TRSB behavior in twisted systems."]}}, {"title": "Giant field-free transverse Josephson diode effect in altermagnets", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/ydrg-7spp", "authors": "Bijay Kumar Sahoo, Abhiram Soori", "last_authors": "Bijay Kumar Sahoo, Abhiram Soori", "summary": "Author(s): Bijay Kumar Sahoo and Abhiram Soori We predict a field-free transverse Josephson diode effect in altermagnets (AMs) with Rashba spin-orbit coupling, achieving diode efficiencies exceeding $3000%$ and unidirectional transverse supercurrents in four-terminal junctions. In this geometry, a longitudinal phase bias generates transverse sup… [Phys. Rev. B 113, 245433] Published Mon Jun 29, 2026", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Theoretical study of altermagnets with direct experimental relevance.", "tags": ["altermagnetism", "transport", "theory"], "image": "", "briefing": {"background": "알터자성(Altermagnetism)은 시간 반전 대칭성을 깨면서도 순자화(net magnetization)가 0인 새로운 자기적 위상으로, 기존의 강자성이나 반강자성과 차별화된 수송 특성을 보입니다.", "motivation": "알터자성체가 가지는 특유의 스핀-궤도 결합(SOC)과 전자 구조를 활용하여 외부 자기장 없이도 효율적인 비대칭 전류 제어가 가능한 소자를 이론적으로 고안하고자 했습니다.", "result": "라쉬바(Rashba) SOC를 포함한 알터자성체 4단자 접합에서 자기장 없이도 3000% 이상의 효율을 가지는 거대 횡방향 조셉슨 다이오드 효과를 예측했습니다.", "implication": "전자기적인 자기장 인가 없이도 위상 비대칭성을 통해 초전류를 제어할 수 있어, 차세대 저전력 스핀트로닉스 및 초전도 논리 소자의 설계 기반을 마련합니다.", "novelty": "알터자성체의 고유한 대칭성을 이용해 횡방향 조셉슨 다이오드 효과를 제안하였으며, 이는 기존의 자성 소자 연구 범위를 확장하는 결과입니다.", "unresolved": "이론적인 제안으로, 실제 알터자성 재료에서의 실험적 검증 및 횡방향 초전류의 정밀한 측정이 필요합니다.", "future_work": "구체적인 알터자성 재료 후보군(예: RuO2 등)을 대상으로 한 실제 접합 소자 제작 및 transport 측정 연구.", "concepts": [{"term": "알터자성 (Altermagnetism)", "why_emerged": "시간 반전 대칭을 깨면서도 순자화가 없는 재료의 독특한 스핀 구조를 설명하기 위해 제안됨", "origin": "최근 수년 내 이론적으로 확립됨 (예: Jungwirth 등)", "connections": "반강자성, 강자성, 위상 반금속, 베리 곡률 효과"}, {"term": "조셉슨 다이오드 효과", "why_emerged": "초전도 전류의 방향에 따른 비대칭성을 구현하여 소자 효율을 높이기 위해 필요함", "origin": "위상 물질과 초전도체의 접합 연구에서 최근 활발히 논의됨", "connections": "초전도 비대칭성, 수송 물성 제어"}], "english_summary": ["Predicts a field-free transverse Josephson diode effect in altermagnets with Rashba SOC.", "Theoretical model demonstrates diode efficiencies exceeding 3000% in a four-terminal junction.", "Longitudinal phase bias is converted to a transverse supercurrent due to the symmetry properties of altermagnets.", "The result suggests potential for field-free superconducting logic and spintronic applications."]}}, {"title": "Kondo effect in ferromagnetic quantum critical CeRh6Ge4", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/6w55-56wk", "authors": "Martin Sundermann, Joe D. Thompson, Eric D. Bauer, et al.", "last_authors": "Gertrud Zwicknagl, Andrea Severing", "summary": "Author(s): Martin Sundermann, Joe D. Thompson, Eric D. Bauer, Chun-Fu Chang, Sheng-Huai Chen, Chang-Yang Kuo, Liu Hao Tjeng, Gertrud Zwicknagl, and Andrea Severing The nature of cerium’s 4 f electron is key to understanding the mechanism of pressure-induced quantum criticality in the heavy-fermion ferromagnet CeRh 6 Ge 4 . Combining core-level photoemission and polarized x-ray absorption spectroscopy with simulations based on the single-impurity Anderson model, the authors demonstrate here that Kondo hybridization admixes higher-lying crystal field states into a multiorbital ground state with a 4 f occupancy n f ~ 0.9, which also accounts for the dynamical spin response. The results establish the importance of Kondo hybridization and the resulting multiorbital ground state as essential components for a model of quantum criticality. [Phys. Rev. B 113, 245149] Published Mon Jun 29, 2026", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Experimental photoemission and XAS study on heavy-fermion criticality.", "tags": ["ARPES", "heavy-fermion", "quantum-criticality"], "image": "", "briefing": {"background": "CeRh6Ge4와 같은 중성 페르미온 화합물은 강자성 상태 근처에서 압력에 의해 양자 임계 현상이 나타나며, 여기서 4f 전자의 역할(국부화 대 편재화)을 이해하는 것이 고온 초전도와 자기적 질서의 연결고리를 푸는 핵심입니다.", "motivation": "압력 유도 양자 임계성에서 Ce의 4f 전자가 어떻게 기여하는지 명확히 하기 위해 4f 점유수와 결정장 상태를 정밀 분석하고자 했습니다.", "result": "광전자 분광학 및 편광 XAS 데이터를 통해 Kondo 혼성(hybridization)이 결정장 상태들과 결합하여 다중 궤도 기저 상태를 형성함을 증명했습니다.", "implication": "중성 페르미온의 양자 임계 거동이 단순히 단일 궤도가 아닌 다중 궤도 Kondo 혼성에서 비롯됨을 보여주어, 관련 물질의 이론 모델을 정교화했습니다.", "novelty": "고해상도 광전자 분광학을 통해 CeRh6Ge4의 4f 전자 구조를 직접 프로빙하여 Kondo 격자 물성과 양자 임계성 사이의 실험적 연결고리를 제시했습니다.", "unresolved": "4f 전자 점유수와 실제 임계점에서의 페르미 표면 재구성에 대한 세부적인 동역학적 정보는 추가적인 연구가 필요 : "", "briefing": {"background": "자성체에서 스핀 분할은 일반적으로 시간 반전 대칭성 파괴를 전제로 하지만, 최근 '알터마그네티즘(Altermagnetism)'이라는 새로운 유형의 자성이 이론적으로 제안되어 주목받고 있습니다. 이는 기존의 강자성이나 반강자성과는 다른 대칭성을 갖는 스핀 구조를 의미합니다.", "motivation": "기존 알터마그네티즘 연구가 주로 우패리티(even-parity)에 집중되었던 한계를 넘어, 기이한 물리적 성질을 유도할 수 있는 '홀수 패리티(odd-parity) 알터마그네티즘'의 존재 가능성과 필요 조건을 규명하고자 합니다.", "result": "스핀 그룹 이론을 통해 홀수 패리티 알터마그네티즘이 발현되기 위한 필수 대칭성 조건(비자기 시간 반전 대칭 파괴, 공선적 보상 자성 등)을 수학적으로 도출했습니다.", "implication": "스핀 그룹 이론을 기반으로 새로운 자성 위상을 체계적으로 분류할 수 있게 되었으며, 이는 향후 스핀트로닉스 소자 구현을 위한 물질 설계의 이론적 토대가 됩니다.", "novelty": "알터마그네티즘 분야에서 패리티를 확장하여 새로운 스핀 분할 구조를 예측한 이론적 성과로, 위상 자성체 및 베리 곡률 연구자들에게 새로운 물질 후보군 탐색의 지표를 제공합니다.", "unresolved": "이론적으로 도출된 대칭 조건을 완벽히 만족하는 실제 물질이 무엇인지, 그리고 그 물질에서 구체적인 스핀 분할 특성을 어떻게 실험적으로 검증할지는 숙제로 남아 있습니다.", "future_work": "도출된 조건을 만족하는 후보 물질들의 DFT 계산을 통한 전자 구조 예측 및 ARPES를 이용한 스핀 분할 직접 관측이 요구됩니다.", "concepts": [{"term": "알터마그네티즘 (Altermagnetism)", "why_emerged": "강자성이나 반강자성으로 분류되지 않는 새로운 비상관 스핀 분할 현상을 설명하기 위해 제안됨.", "origin": "Šmejkal et al.(2022) 등 최근 그룹에 의해 체계화됨.", "connections": "스핀트로닉스, 베리 곡률, 자기 위상 절연체."}, {"term": "스핀 그룹 분석 (Spin Group Analysis)", "why_emerged": "자기 결정 구조에서 스핀의 대칭성을 기술하기 위해 일반적인 자기 공간군보다 확장된 도구가 필요함.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "자기 공간군(Magnetic space groups), 대칭성 파괴, 위상 자성 물질."}], "english_summary": ["Explores odd-parity altermagnetism using spin group analysis.", "Identifies specific symmetry requirements for the emergence of odd-parity spin splitting.", "Establishes criteria including broken time-reversal symmetry and specific sublattice transformations.", "Expands the theoretical classification of magnetic materials with compensated spin sublattices."]}}, {"title": "Odd-parity altermagnetism: A spin group study", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/7kmk-yl2t", "authors": "Minghuan Zeng, Zheng Qin, Ling Qin, et al.", "last_authors": "Dong-Hui Xu, Rui Wang", "summary": "Author(s): Minghuan Zeng, Zheng Qin, Ling Qin, Ship conductivity."]}}, {"title": "Valley order in moiré topological insulators", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/kl58-rj3r", "authors": "Bo Zou, Anzhuoer Li, A. H. MacDonald", "last_authors": "Anzhuoer Li, A. H. MacDonald", "summary": "Author(s): Bo Zou, Anzhuoer Li, and A. H. MacDonald Moiré materials with opposite nonzero minibands Chern numbers in time-reversal-partner valleys are two-dimensional topological insulators at band filling $ν=2$. We explore the possibility that in this class of moiré materials intervalley coherence can sometimes be present in interaction-induced insu… [Phys. Rev. B 113, 245141] Published Tue Jun 23, 2026", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Moiré topological insulators are explicitly mentioned in the user's broad interest profile.", "tags": ["topological", "moiré", "insulator"], "image": "", "briefing": {"background": "모아레(Moiré) 격자 시스템은 평탄한 밴드(flat band)를 형성하여 강한 전자 상관관계를 구현하는 최적의 플랫폼으로, 위상 절연체 상태를 유도할 수 있습니다.", "motivation": "반대되는 Chern 수를 가진 시간 반전 대칭 짝(time-reversal partner) 골짜기(valley)를 가진 모아레 물질에서 골짜기 질서(valley order)의 가능성을 탐구하고자 했습니다.", "result": "밴드 채움이 ν=2인 모아레 시스템에서 상호작용에 의해 골짜기 간 응집(intervalley coherence)이 발생하여 절연체 상태가 유도될 수 있음을 보였습니다.", "implication": "모아레 물질의 위상 특성을 전기장이나 도핑 외의 상호작용(골짜기 자유도)으로 제어할 수 있는 가능성을 열어줍니다.", "novelty": "모아레 위상 절연체에서 골짜기 자유도를 활용한 질서 형성 메커니즘을 제시하여, 새로운 위상 상전이 모드를 제안했습니다.", "unresolved": "실제 실험적으로 골짜기 질서를 직접적으로 관측하고 제어하는 방법은 여전히 어려운 과제입니다.", "future_work": "골짜기 편극을 측정할 수 있는 광학적 실험이나 이송 측정(transport measurement)을 통한 질서 파라미터 규명.", "concepts": [{"term": "골짜기 자유도 (Valley degree of freedom)", "why_emerged": "에너지 밴드 구조 내의 등가적인 지역적 최저점/최고점 정보를 양자 정보의 단위로 사용하기 위해 도입되었습니다.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "그래핀, 전이금속 디칼코게나이드(TMD), 모아레 물질."}, {"term": "모아레 물질", "why_emerged": "격자 불일치나 비틀림을 통해 전자 구조를 설계하는 물리적 '밴드 엔지니어링'을 위해 도입되었습니다.", "origin": "Pablo Jarillo-Herrero et al. (2018)", "connections": "비틀린 이중층 그래핀, 강상관 절연체, 초전도성."} uthors": "Arthur Ernst, Masashi Kawasaki", "summary": "A magnetic field typically suppresses superconductivity by either breaking Cooper pairs via the Zeeman effect or inducing vortex formation. However, under certain circumstances, a magnetic field can stabilize superconductivity instead. This seemingly counterintuitive phenomenon is associated with magnetic interactions and has been extensively studied in three-dimensional materials. By contrast, this phenomenon, hinting at unconventional superconductivity, remains largely unexplored in two-dimensional systems, with moiré-patterned graphene being the only known example. Here, we report the observation of reentrant superconductivity at the epitaxial (110)-oriented LaTiO 3 -KTaO 3 interface. This phenomenon occurs across a wide range of charge carrier densities, which, unlike in three-dimensional materials, can be tuned in situ via electrostatic gating. We propose that the observed reentrant superconductivity can arise from an interplay between strong spin-orbit coupling and a magnetic field–driven modification of the Fermi surface. Our findings provide insight into reentrant superconductivity and establish a robust platform for exploring unconventional superconducting phenomena in two-dimensional systems.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Observation of reentrant unconventional superconductivity in 2D oxide interface, relevant to Fermi surface and SOC.", "tags": ["unconventionalsuperconductivity", "2Dmaterials", "oxideheterointerface", "Fermisurface", "spin-orbitcoupling"], "image": "", "briefing": {"background": "자동 브리핑을 생성하지 못했습니다. 초록과 원문 링크를 기준으로 빠르게 확인하세요.", "motivation": "초록 정보만으로는 분야 내부의 구체적 동기를 안정적으로 요약하기 어렵습니다.", "result": "A magnetic field typically suppresses superconductivity by either breaking Cooper pairs via the Zeeman effect or inducing vortex formation. However, under certain circumstances, a magnetic field can stabilize superconductivity instead. This seemingly counterintuit
