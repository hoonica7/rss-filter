<title>Daily Paper Slideshow</title>
<style>
  :root {
    color-scheme: light;
    --bg: #f6f7f4;
    --paper: #ffffff;
    --ink: #111827;
    --muted: #64748b;
    --line: #d8ddd2;
    --accent: #176b87;
    --accent-2: #9a3412;
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; overflow: auto; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: var(--bg); color: var(--ink); }
  .shell { max-width: 1500px; min-height: 100vh; margin: 0 auto; padding: 14px 18px; display: flex; flex-direction: column; }
  .topbar { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 16px; }
  .top-actions { display: flex; align-items: center; gap: 10px; }
  .topbar a, button { border: 1px solid var(--line); border-radius: 8px; background: var(--paper); color: var(--ink); padding: 10px 14px; font-weight: 700; text-decoration: none; cursor: pointer; }
  button.primary { background: var(--accent); border-color: var(--accent); color: white; }
  button:disabled { opacity: 0.45; cursor: not-allowed; }
  .counter { color: var(--muted); font-weight: 700; }
  .slide { min-height: calc(100vh - 82px); background: var(--paper); border: 1px solid var(--line); border-radius: 10px; padding: 18px; box-shadow: 0 18px 42px rgba(15, 23, 42, 0.10); display: grid; grid-template-columns: minmax(310px, 0.86fr) minmax(0, 1.55fr); gap: 18px; overflow: visible; }
  .paper-head { min-width: 0; min-height: 0; overflow: visible; display: flex; flex-direction: column; gap: 12px; }
  .figure { margin: 0; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: #f8fafc; }
  .figure img { display: block; width: 100%; max-height: 41vh; object-fit: contain; background: white; }
  .figure figcaption { padding: 7px 10px; color: var(--muted); font-size: 12px; line-height: 1.3; }
  .head-text { display: flex; flex-direction: column; gap: 9px; min-width: 0; }
  .badges { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .badge { border-radius: 999px; padding: 5px 9px; background: #eef2ff; color: #3730a3; font-size: 12px; font-weight: 800; }
  .score { background: #fee2e2; color: #991b1b; }
  h1 { margin: 0; font-size: 25px; line-height: 1.15; letter-spacing: 0; overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
  h1 a { color: inherit; text-decoration-color: rgba(23, 107, 135, 0.35); text-decoration-thickness: 2px; text-underline-offset: 4px; }
  h1 a:hover { color: var(--accent); text-decoration-color: var(--accent); }
  .meta, .authors, .why, .abstract { font-size: 13px; line-height: 1.45; }
  .meta, .authors { color: var(--muted); }
  .why strong, .abstract strong, .authors strong { color: var(--ink); }
  .authors { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .why { border-left: 4px solid var(--accent-2); padding-left: 10px; color: #374151; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .abstract { border-top: 1px solid var(--line); padding-top: 14px; color: #374151; }
  .original-abstract { border-top: 1px solid var(--line); padding-top: 10px; color: #374151; font-size: 11.5px; line-height: 1.35; overflow-wrap: anywhere; }
  .original-abstract strong { display: block; margin-bottom: 4px; color: var(--ink); }
  .tags { display: flex; flex-wrap: wrap; gap: 8px; }
  .tag { border-radius: 999px; padding: 4px 8px; background: #f1f5f9; color: #475569; font-size: 12px; font-weight: 700; }
  .head-text > .link { display: none; }
  .briefing { min-width: 0; min-height: 0; overflow: visible; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); grid-auto-rows: minmax(0, auto); align-content: start; gap: 11px 18px; border-top: 0; padding-top: 0; }
  .brief-section { min-width: 0; }
  .brief-section.wide { grid-column: 1 / -1; }
  .brief-section h2 { margin: 0 0 4px; font-size: 14px; line-height: 1.22; color: #0f766e; letter-spacing: 0; }
  .brief-section p, .brief-section li { margin: 0; font-size: 12.5px; line-height: 1.42; color: #1f2937; overflow-wrap: anywhere; }
  .brief-section ul { margin: 0; padding-left: 20px; }
  .concepts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 9px 14px; }
  .concept { border-top: 1px solid var(--line); padding-top: 7px; }
  .concept h3 { margin: 0 0 4px; font-size: 13px; color: #7c2d12; letter-spacing: 0; }
  .concept p { margin: 2px 0 0; font-size: 11.5px; line-height: 1.35; color: #374151; overflow-wrap: anywhere; }
  .concept b { color: #111827; }
  .link { color: var(--accent); font-weight: 800; text-decoration: none; }
  .empty { padding: 48px; background: var(--paper); border: 1px solid var(--line); border-radius: 12px; color: var(--muted); }
  @media (max-width: 860px) {
    .shell { padding: 14px; }
    .topbar, .top-actions { align-items: stretch; flex-direction: column; }
    .slide, .briefing, .concepts { grid-template-columns: 1fr; }
    .slide { min-height: auto; overflow: visible; display: grid; }
    h1 { font-size: 28px; }
  }
</style>

<script>
const slides = [{"title": "Electronic Origin of Delicate Antiferromagnetism in FexNbS2", "journal": "PRL_Recent", "source": "author whitelist", "link": "http://link.aps.org/doi/10.1103/99yr-nqbx", "authors": "Wenxin Li, Jonathan T. Reichanadter, Shan Wu, et al.", "last_authors": "Jeffrey B. Neaton, Yu He", "summary": "Author(s): Wenxin Li, Jonathan T. Reichanadter, Shan Wu, Ji Seop Oh, Rourav Basak, Shannon C. Haley, Siqi Wang, Joshua E. Chaparro Mata, Elio Vescovo, Donghui Lu, Makoto Hashimoto, Christoph Klewe, Suchismita Sarker, Jessica L. McChesney, Alex Frañó, James G. Analytis, Robert J. Birgeneau, Jeffrey B. Neaton, and Yu He A combination of ARPES, XAS, and DFT shows a dramatic eV-scale electronic restructuring in Fe x NbS 2 , similar to what happens in correlated oxides, and suggests electronic correlations play a central role in the magnetism of Fe-intercalated transition-metal dichalcogenides. [Phys. Rev. Lett. 136, 216503] Published Wed May 27, 2026", "tier": "A_MUST_READ", "score": "10", "reason": "author whitelist: Donghui Lu", "tags": ["ARPES", "STS", "correlated", "ferromagnet", "antiferromagnet"], "image": "", "briefing": {"background": "Fe가 삽입된 전이금속 디칼코게나이드(TMD) 화합물은 자성과 전자 구조의 복잡한 상호작용으로 인해 강상관계 물리학의 주요 연구 대상입니다. 특히 이들의 자기적 거동을 미시적 수준에서 이해하는 것은 응집물질물리학의 오래된 과제 중 하나입니다.", "motivation": "Fe_xNbS_2에서 관측되는 민감한 반강자성 상태가 어떠한 전자적 기원을 가지는지 규명하고, 이것이 강상관 산화물 시스템에서 발견되는 전자적 재구성과 유사성을 공유하는지 확인하고자 합니다.", "result": "ARPES, XAS, DFT 결합 분석을 통해 Fe_xNbS_2에서 eV 규모의 극적인 전자 구조 재구성을 발견하였습니다. 이는 해당 물질의 자성이 단순한 금속성 모델이 아닌 강한 전자 상관관계에 의해 지배됨을 강력히 시사합니다.", "implication": "TMD 기반 자성체에서 전자 상관관계가 자성 형성의 핵심 기제임을 증명함으로써, 유사한 삽입형 TMD 물질들의 물성을 해석하는 새로운 틀을 제공합니다.", "novelty": "ARPES와 STS 대가인 Donghui Lu 등이 참여하여 Fe 삽입 TMD 내의 강상관 효과를 직접적으로 관측했다는 점이 독자의 관심사와 매우 잘 부합합니다.", "unresolved": "eV 규모의 전자 재구성이 정확히 어떤 다체 물리적 상호작용(예: 궤도 선택적 상관관계 등)에 의한 것인지에 대한 상세 기제는 여전히 연구가 필요합니다.", "future_work": "다른 Fe-삽입 TMD 물질들로의 확장 연구 및 온도 의존적 ARPES를 통한 상전이 직전의 전자 구조 변화 추적이 기대됩니다.", "concepts": [{"term": "Electronic Reconstruction", "why_emerged": "상관관계가 강한 시스템에서 밴드 구조가 단순히 격자 퍼텐셜만으로 설명되지 않고 상호작용에 의해 크게 변형되기 때문에 필요함.", "origin": "강상관 산화물(cuprates 등) 연구에서 정립됨.", "connections": "Hubbard 모델, Mott 절연체, 페르미 면 재구성."}, {"term": "Intercalated TMDs", "why_emerged": "호스트 TMD 층 사이에 전이금속 원자를 삽입하여 자기적, 전자적 물성을 인위적으로 제어하고자 함.", "origin": "초기 층상 물질 연구에서 확립됨.", "connections": "NbS2, TaS2, 층상 자성체."}], "english_summary": ["Study of Fe-intercalated NbS2 using ARPES, XAS, and DFT.", "Identifies significant eV-scale electronic reconstruction indicating strong electron correlations.", "Correlations are established as the primary driver for magnetism in this TMD system.", "Provides a framework for understanding magnetism in transition-metal intercalated layered materials."]}}, {"title": "Deciphering the absence of charge density waves in the V-based kagome metal CsV6Sb6", "journal": "PRB_Recent", "source": "keyword", "link": "http://link.aps.org/doi/10.1103/3vlt-zz94", "authors": "Rongxiao Du, Yunfan Yang, Wenxin Lv, et al.", "last_authors": "Hechang Lei, Jianbo Hu", "summary": "Author(s): Rongxiao Du, Yunfan Yang, Wenxin Lv, Junhong Yu, Hang Zhang, Hechang Lei, and Jianbo Hu While charge density waves (CDWs) are a hallmark of the kagome metal $\\mathrm{Cs}{\\mathrm{V}}_{3}{\\mathrm{Sb}}_{5}$, their absence in the bilayer counterpart $\\mathrm{Cs}{\\mathrm{V}}_{6}{\\mathrm{Sb}}_{6}$ remains a notable exception, with the underlying mechanism yet to be elucidated. Here, integrat… [Phys. Rev. B 113, 245119] Published Tue Jun 09, 2026", "tier": "A_MUST_READ", "score": "9", "reason": "title strong match: kagome metal", "tags": ["kagome", "chargedensitywave", "CDW"], "image": "", "briefing": {"background": "Kagome 금속 AV3Sb5 계열은 전하 밀도 파(CDW)와 초전도성의 공존으로 인해 매우 활발히 연구되고 있습니다. 하지만 이와 구조적으로 유사한 물질들 중 일부는 왜 CDW가 나타나지 않는지에 대한 의문이 항상 존재해 왔습니다.", "motivation": "A_V_3Sb_5(135) 구조와 달리 이중층(bilayer) 구조를 가진 CsV6Sb6에서 CDW가 부재하는 근본적인 물리적 원인을 탐구하고자 합니다.", "result": "CsV6Sb6의 전자 구조를 분석하여 CDW 형성을 저해하거나 관련 페르미 면 불안 on with fourfold lattice rotation, $[C_2\\|C_{4z}]$, that there is an optical analogue of a spin splitter effect, as the coupling to a linearly polarized exciting laser field makes the d-wave character of the altermagnet directly visible. By magneto-optical measurements on RuO$_2$ films of different thicknesses ranging from $2$ to $8\\,$nanometers, we demonstrate the predicted connection of the linear polarization of an ultrashort pump pulse to the sign and magnitude of the optically excited electronic spin polarization in the ultrathin RuO$_2$ films. The possibility of exciting and controlling an electronic spin polarization by linearly polarized optical pulses in a compensated system is a unique consequence of the altermagnetic material properties. Our experimental results therefore establish an optical pump-probe based protocol for detection of altermagnetic characteristics in ultrathin RuO$_2$ films, but our all-optical approach should apply more generally to materials in this altermagnetic symmetry class.", "tier": "A_MUST_READ", "score": "9", "reason": "Direct hit on altermagnetism with experimental magneto-optical results and electronic structure implications.", "tags": ["altermagnetism", "RuO2", "magneto-optics", "electronicstructure"], "image": "https://arxiv.org/html/2408.05187v3/x1.png", "briefing": {"background": "자성체는 크게 강자성체와 반강자성체로 나뉘어 왔으나, 최근 발견된 알터자성체(Altermagnet)는 알짜 자기 모멘트는 0이면서도 d-파 또는 g-파와 같은 비전통적인 스핀 분할 밴드 구조를 가져 시간 반전 대칭성이 깨진 새로운 물질군으로 주목받고 있습니다.", "motivation": "알터자성체의 특징인 비전통적 스핀 편극 특성을 외부 자기장 없이 광학적 수단으로 제어하고 검출할 수 있는지 확인하기 위해 연구되었습니다.", "result": "RuO2 박막에서 선형 편광된 레이저 펄스를 이용해 알터자성체의 d-파 대칭성에 기인한 스핀 분할 효과를 광학적으로 유도하고 제어할 수 있음을 실험적으로 증명했습니다.", "implication": "알터자성 물질에서 외부 자기장 없이도 빛을 통해 스핀 정보를 읽고 쓸 수 있는 광학적 프로토콜이 마련되어, 향후 초고속 스핀트로닉스 소자 개발에 중요한 토대가 됩니다.", "novelty": "기존 자성체와 달리 알터자성체에서만 가능한 '광학적 스핀 분할(optical spin splitter)' 효과를 RuO2 박막에서 실제 구현했다는 점에서 매우 중요하며, ARPES나 전자기적 수송 측정 외에 광학적 검출법을 제시했다는 점이 독보적입니다.", "unresolved": "박막 두께에 따른 효과의 정량적 변화 외에 다른 알터자성 후보 물질들로의 범용성 확대가 필요합니다.", "future_work": "다양한 알터자성 물질군으로의 광학적 실험 확대 및 나노초 규모의 초고속 스핀 역학 연구가 기대됩니다.", "concepts": [{"term": "Altermagnetism", "why_emerged": "기존 강자성/반강자성 구분으로 설명되지 않는 스핀 편극 밴드 구조를 가진 물질을 체계화하기 위해 등장했습니다.", "origin": "최근 2~3년 내 이론적으로 확립되었으며, RuO2가 대표적인 실험적 모델 물질로 제시되었습니다.", "connections": "반강자성체, 시간 반전 대칭성 파괴, 비전통적 스핀 분할."}, {"term": "Spin Splitter Effect", "why_emerged": "특정 결정 구조에서 스핀 밴드가 운동량에 따라 분할되는 현상을 활용하여 스핀 전류를 생성하기 위해 필요했습니다.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "스핀-궤도 결합, 알터자성체, 비전통적 수송 현상."}], "english_summary": ["Altermagnets exhibit spin-polarized band structures despite having zero net magnetization.", "The study demonstrates an optical spin-splitter effect in RuO2 using linearly polarized pump pulses.", "Experimental results confirm a direct link between laser polarization and optically excited spin polarization.", "This all-optical protocol provides a new, efficient way to detect and manipulate altermagnetic order."]}}, {"title": "Anisotropic marginal Fermi liquid for Coulomb interacting generalized Weyl fermions (Phys. Rev. B)", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2602.17666", "authors": "Gabriel Malav\\'e, Rodrigo Soto-Garrido, Bitan Roy, Vladimir Juri\\v{c}i\\'c", "last_authors": "Bitan Roy, Vladimir Juri\\v{c}i\\'c", "summary": "arXiv:2602.17666v2 Announce Type: replace Abstract: Owing to the power-law anisotropy in the quasiparticle dispersion, yielding an enhanced density of states, the effects of long range Coulomb interaction get amplified in three-dimensional generalized Weyl semimetals, characterized by integer monopole charge $n>1$ of the underlying Weyl nodes. Using a Wilsonian renormalization group approach controlled by a large-$N$ expansion with $N$ as the number of Weyl fermion flavors and a gauge-consistent regularization fixed by the Ward-Takahashi identity, we uncover for $n\\ge 2$ an extended interaction-dominated scaling regime with intrinsically anisotropic dynamic Coulomb screening, a finite fermionic anomalous dimension, and a power-law suppression of the quasiparticle residue, yielding an \\emph{anisotropic} marginal non-Fermi liquid at intermediate energies. Ultimately, the effective fine structure constant flows to zero, albeit only logarithmically slowly, so the marginal Fermi liquid phenomenology emerges as a broad crossover, controlled by a slowly running coupling. By contrast, for $n=1$ the system retains an isotropic marginal Weyl-liquid character. These predictions can be tested via scaling in thermodynamics (specific heat and compressibility), direction-dependent optical conductivity, and by anisotropic broadening of the single-particle spectral function in angle-resolved photoemission spectroscopy.", "tier": "A_MUST_READ", "score": "9", "reason": "Theory on Weyl semimetals with direct and explicit implications for ARPES experiments.", "tags": ["Weylsemimetals", "ARPES", "theory", "electronicstructure"], "image": "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAsAAAAOCAYAAAD5YeaVAAAAAXNSR0IArs4c6QAAAAZiS0dEAP8A/wD/oL2nkwAAAAlwSFlzAAALEwAACxMBAJqcGAAAAAd0SU1FB9wKExQZLWTEaOUAAAAddEVYdENvbW1lbnQAQ3JlYXRlZCB3aXRoIFRoZSBHSU1Q72QlbgAAAdpJREFUKM9tkL+L2nAARz9fPZNCKFapUn8kyI0e4iRHSR1Kb8ng0lJw6FYHFwv2LwhOpcWxTjeUunYqOmqd6hEoRDhtDWdA8ApRYsSUCDHNt5ul13vz4w0vWCgUnnEc975arX6ORqN3VqtVZbfbTQC4uEHANM3jSqXymFI6yWazP2KxWAXAL9zCUa1Wy2tXVxheKA9YNoR8Pt+aTqe4FVVVvz05O6MBhqUIBGk8Hn8HAOVy+T+XLJfLS4ZhTiRJgqIoVBRFIoric47jPnmeB1mW/9rr9ZpSSn3Lsmir1fJZlqWlUonKsvwWwD8ymc/nXwVBeLjf7xEKhdBut9Hr9WgmkyGEkJwsy5eHG5vN5g0AKIoCAEgkEkin0wQAfN9/cXPdheu6P33fBwB4ngcAcByHJpPJl+fn54mD3Gg0NrquXxeLRQAAwzAYj8cwTZPwPH9/sVg8PXweDAauqqr2cDjEer1GJBLBZDJBs9mE4zjwfZ85lAGg2+06hmGgXq+j3+/DsixYlgVN03a9Xu8jgCNCyIegIAgx13Vfd7vdu+FweG8YRkjXdWy329+dTgeSJD3ieZ7RNO0VAXAPwDEAO5VKndi2fWrb9jWl9Esul6PZbDY9Go1OZ7PZ9z/lyuD3OozU2wAAAABJRU5ErkJggg==", "briefing": {"background": "Weyl 반금속은 위상학적으로 비자명한 밴드 구조를 가지며, 페르미 준위에서 밀도 상태가 영이 되어 강한 상관관계 효과가 증폭될 수 있어 전자의 비페르미 액체( perimental probes have not given definitive evidence. Now, impurity spins have been used as probes of the putative spin liquid phase of herbertsmithite.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Important quantum magnetism study of a classic spin liquid material.", "tags": ["magnetism", "herbertsmithite", "spin-liquid"], "image": "https://media.springernature.com/m685/springer-static/image/art%3A10.1038%2Fs41567-026-03303-6/MediaObjects/41567_2026_3303_Fig1_HTML.png", "briefing": {"background": "양자 스핀 액체(Quantum Spin Liquid)는 극저온에서도 자기적 질서가 형성되지 않는 양자 얽힘이 강한 상태로, 응집물질 물리학에서 가장 도전적인 기저 상태 중 하나입니다.", "motivation": "허버트스미타이트(herbertsmithite)가 실제로 스핀 액체 상태인지 명확히 확인하기 위해 외부에서 주입된 불순물 스핀을 관찰자로 활용하는 실험적 접근을 시도했습니다.", "result": "불순물 스핀의 동역학이 스핀온(spinon) 매개체에 의해 영향받음을 통해, 모체인 허버트스미타이트의 스핀 액체적 성질을 간접적으로 증명했습니다.", "implication": "그동안 난제로 남아있던 스핀 액체의 실험적 증거를 찾기 위한 '증인(witness) 프로브' 기법의 유효성을 입증했습니다.", "novelty": "물질 자체를 직접 측정하는 대신, 불순물 스핀을 도입하여 스핀 액체라는 특수한 환경을 탐사하는 '스핀온 매개 동역학' 개념이 핵심입니다.", "unresolved": "불순물이 모체 스핀 시스템의 성질을 교란할 가능성을 완전히 배제하기 어려우며, 스핀 액체 상태의 위상적 순서를 직접 확정하는 것은 여전히 과제입니다.", "future_work": "다른 스핀 액체 후보 물질들에 대한 불순물 주입 및 스핀 동역학의 체계적 비교 연구.", "concepts": [{"term": "Spin Liquid", "why_emerged": "강한 양자 요동으로 인해 절대영도에서도 자기적 질서 없이 얽힌 상태를 설명하기 위해 제안되었습니다.", "origin": "1973년 필립 앤더슨(P.W. Anderson)이 제안하였습니다.", "connections": "고온 초전도체, 양자 얽힘, 위상학적 질서."}, {"term": "Spinon", "why_emerged": "스핀 액체에서 스핀 1을 가진 들뜸이 스핀 1/2을 가진 준입자들로 분리되는 현상을 기술하기 위해 필요했습니다.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "스핀-전하 분리, 1차원 Luttinger 액체, 양자 자기성."}], "english_summary": ["Identifying the spin liquid ground state remains a central challenge in condensed matter physics.", "The study utilizes impurity spins as probes to investigate the magnetic correlations in herbertsmithite.", "Evidence suggests that witness spin dynamics are mediated by the underlying spinon continuum.", "This method offers a novel approach to characterizing elusive quantum spin liquid phases."]}}, {"title ntal study of CDW in a classic material system.", "tags": ["CDW", "correlatedelectrons", "TiSe2"], "image": "", "briefing": {"background": "강상관계 물질에서 전하 밀도 파동(CDW)은 전자-포논 결합이나 페르미 면의 네스팅 등으로 인해 발생하는 집단적인 전자 상태입니다. 이러한 상태가 나노 스케일의 크기 제한을 받을 때 어떻게 반응하는지는 응집물질물리학의 중요한 문제이나 실험적 관측이 어렵습니다.", "motivation": "1T-TiSe2의 나노플레이크를 이용하여 시료의 크기가 CDW의 핵 생성 및 녹는점(melting point)에 미치는 영향을 실험적으로 규명하고자 했습니다.", "result": "시료의 크기가 작아질수록 CDW의 상전이 온도가 낮아지는 현상을 확인했습니다. 이는 CDW의 장거리 질서가 형성되는 데 필요한 임계 크기가 존재함을 시사합니다.", "implication": "나노 구조화(nanostructuring)를 통해 강상관계 물질의 상전이를 제어할 수 있는 가능성을 제시하며, 이는 향후 나노 소자 설계에 중요한 물리적 토대가 될 것입니다.", "novelty": "CDW와 같은 전자적 질서의 크기 의존성을 실제 나노 소자 환경에서 관측했다는 점이 중요합니다. ARPES 등을 통한 전자 구조 연구와 연계하여 나노 스케일에서의 상전이 역학을 이해하는 데 유용합니다.", "unresolved": "나노플레이크의 경계면(edge) 상태가 CDW 억제에 미치는 구체적인 메커니즘과 기판과의 상호작용이 전자 상태에 주는 영향은 여전히 명확하지 않습니다.", "future_work": "다른 강상관계 물질에서의 크기 의존성 연구로의 확장 및 특정 크기 이하에서 CDW가 완전히 사라지는 임계점에서의 전자 구조 변화 관측이 필요합니다.", "concepts": [{"term": "Charge Density Wave (CDW)", "why_emerged": "금속 내 전자의 주기적 밀도 변조를 설명하기 위해 도입됨.", "origin": "Peierls, Frohlich (1950년대).", "connections": "Peierls 불안정성, 초전도체와의 경쟁 관계."}, {"term": "1T-TiSe2", "why_emerged": "전형적인 CDW 연구 모델 물질.", "origin": "Wilson, Di Salvo, Mahajan (1975).", "connections": "밴드 반전(band inversion), 엑시톤 절연체 가설."}], "english_summary": ["Investigated size-dependent melting of CDW in 1T-TiSe2 nanoflakes.", "Observed a decrease in CDW transition temperature with reduced sample size.", "Provides experimental evidence for critical length scales in correlated electronic states.", "Suggests structural control as a viable tool for tuning collective phenomena."]}}, {"title": "Pressure tuning of the charge density wave and superconductivity in the noncentrosymmetric superconductor 4Ha−TaSe2", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/pbgh-693x", "authors": "Zhihan Si, Shaopeng Wang, Yonghui Zhou, et al.", "last_authors": "Xiaoping Yang, Zhaorong Yang", "summary": "Author(s): Z relates with the emergence/enhancement of superconductivity.", "Detailed structural-property relationship in a noncentrosymmetric system."]}}, {"title": "Probing d-wave superconducting gap of the high-Tc cuprate Bi2Sr2Ca2Cu3O10+δ by resonant inelastic x-ray scattering", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/4tm5-f5mj", "authors": "Kunhao Li, Qizhi Li, Changwei Zou, et al.", "last_authors": "Yi Lu, Yingying Peng", "summary": "Author(s): Kunhao Li, Qizhi Li, Changwei Zou, Jaewon Choi, Chaohui Yin, Mirian Garcia-Fernandez, Stefano Agrestini, Shilong Zhang, Chengtian Lin, Xingjiang Zhou, Ke-Jin Zhou, Yi Lu, and Yingying Peng The superconducting gap is a characteristic feature of high-${T}_{\\mathrm{c}}$ superconductors and provides crucial information on the pairing mechanism underlying high-temperature superconductivity. Here, we employ high-resolution resonant inelastic x-ray scattering (RIXS) at the Cu ${L}_{3}$ edge … [Phys. Rev. B 113, 224510] Published Mon Jun 08, 2026", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "High-quality RIXS study on a relevant high-Tc cuprate superconductor.", "tags": ["RIXS", "superconductivity", "cuprate"], "image": "", "briefing": {"background": "고온 초전도체인 구리산화물(Cuprates)에서 d-파동 초전도 갭은 핵심적인 물리량입니다. 이를 직접적으로 공간 분해능을 가지고 측정하는 것은 초전도 매커니즘 규명에 필수적입니다.", "motivation": "Bi2Sr2Ca2Cu3O10+δ (Bi-2223) 물질에서 고에너지 분해능 RIXS를 사용하여 초전도 갭의 에너지 분포와 d-파동 특성을 직접적으로 관측하고자 했습니다.", "result": "Cu L3-edge RIXS를 통해 고온 초전도체의 특징적인 d-파동 초전도 갭 구조와 그 에너지를 성공적으로 도출했습니다.", "implication": "RIXS가 이제 벌크 전자 구조 및 초전도 갭 연구를 위한 강력한 도구임을 입증하며, 특히 ARPES가 어려운 시료의 경우 중요한 대안이 될 수 있음을 보여줍니다.", "novelty": "상대적으로 측정하기 어려운 Bi-2223 물질에서 RIXS를 통해 초전도 갭 데이터를 얻어낸 것은 큰 성과이며, RIXS 해석의 신뢰도를 높여줍니다.", "unresolved": "RIXS로 측정한 에너지 분해능과 실제 스펙트럼의 미세한 비대칭성이 순수하게 초전도 갭만을 반영하는지, 혹은 다른 보손 모드와의 결합인지 완벽하게 분리하기 어렵습니다.", "future_work": "다양한 도핑 수준에서 RIXS를 측정하여 도핑에 따른 갭 크기 변화 및 유사 갭(pseudogap)과의 관계를 체계적으로 연구할 필요가 있습니다.", "concepts": [{"term": "RIXS simplifies to σ = ( e 2 / 8 ℏ ) d max 2 , independent of effective mass and other band structure details, where d max represents the maximum Hilbert-Schmidt quantum distance. Furthermore, under time-reversal and rotational symmetries, d max is restricted to discrete values of 0 or 1, leading to a quantized universal optical conductivity. We also use first-principles calculations to demonstrate the mass-invariant universal optical conductivity across multiple materials, including bilayer graphene, monolayer bismuth, monolayer kagome palladium thiophosphate, and other realistic material candidates. Our work establishes a previously unidentified class of universal quantities in quantum materials entirely governed by quantum geometry.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Connects quantum geometry to transport in kagome metals, graphene, and topological semimetals.", "tags": ["kagome", "graphene", "quantum-geometry", "theory"], "image": "", "briefing": {"background": "응집물질 물리학에서 전자의 유효 질량은 전하 수송 및 광학적 반응을 결정하는 핵심 파라미터로 간주되어 왔습니다.", "motivation": "2차원 물질 및 카고메 금속 등에서 관찰되는 양자 기하학적 특성이 질량과 무관한 보편적 물리량을 도출할 수 있는지 탐구하고자 합니다.", "result": "이차 밴드 접촉(Quadratic band-touching) 반금속에서 양자 거리에 의해 결정되는 질량 무관 보편 광전도도를 유도하였습니다.", "implication": "물질의 유효 질량이나 상세한 밴드 구조에 의존하지 않는 새로운 보편적 양자 현상이 존재하며, 이는 양자 기하학이 수송 현상을 지배함을 의미합니다.", "novelty": "카고메 금속과 그래핀을 포함한 다양한 물질 시스템에서 질량과는 독립적인 상수의 광전도도를 이론적으로 증명하여, 양자 기하학의 물리적 중요성을 부각했습니다.", "unresolved": "실제 실험적 환경에서의 불순물 산란 및 다체 효과가 이 보편적 상수를 어떻게 수정하는지에 대한 정밀한 분석.", "future_work": "카고메 금속 AV3Sb5 계열 및 다양한 반금속 재료에서의 광학 전도도 정밀 측정과 이론적 수치 비교.", "concepts": [{"term": "Quantum Geometry", "why_emerged": "밴드 구조의 파동함수 정보가 수송 현상에 미치는 영향을 기술하기 위해 필요.", "origin": "Berry connection 및 curvature 개념으로부터 유도됨.", "connections": "Berry curvature, Quantum metric tensor, 지형적 위상학."}, {"term": "Quadratic Band Touching", "why_emerged": "선형 디락 점과는 다른 기하학적 특성을 가진 에너지 밴드 접촉 지점을 이해하기 위해.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "그래핀, 2차원 반금속, 베리 위상(Berry Phase)."}], "english_summary": ["Unveils a mass-invariant universal optical conductivity in quadratic band-touching semimetals.", "Demonstrates that this conductivity is purely determined by the Hilbert-Schmidt quantum distance.", "Validates the theory across various materials including graphene and kagome metals.", "Establishes a new class of universal quantities governed by quantum geometry."]}}, {"title": "Symmetry-locked six-state control of altermagnetism via sliding ferroelectricity", "journal": "Science_Advances", "source": "Gemini", "link": "https://doi.org/10.1126/sciadv.aec5229", "authors": "Wei Sun, Wenxuan Wang, Changhong Yang, Shifeng Huang, Zhenxiang Cheng", "last_authors": "Shifeng Huang, Zhenxiang Cheng", "summary": "Altermagnetic multiferroics offer a promising route to low-power spintronics by enabling spin splitting without net magnetization, extending beyond conventional spin-orbit coupling. However, achieving deterministic electric control has remained elusive. Here, a six-state platform for high-dimensional magnetoelectric coupling in altermagnets is established by exploiting the nondegenerate transition paths of sliding ferroelectrics as a symmetry-engineering knob, thereby transcending the conventional binary (up/down) paradigm of sliding ferroelectricity. First-principles calculations on bilayer manganese phosphorus trisulfide reveal a spin-polarization symmetry-locking mechanism. Polarization switching along the three nondegenerate paths not only reverses the spin splitting but also rotates its spin-splitting texture in 120° increments, yielding six nonvolatile, electrically addressable altermagnetic states. Furthermore, direct correspondence is established between the spin-splitting texture and the nonlinear Hall response, providing unique electrical fingerprints for each state. This work establishes a paradigm for electric field–driven reconstruction of momentum-space spin geometry, providing a versatile platform for controlling quan
