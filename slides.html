<title>Daily Paper Slideshow</title>
<style>
  :root {
    color-scheme: light;
    --bg: #f6f7f4;
    --paper: #ffffff;
    --ink: #111827;
    --muted: #64748b;
    --line: #d8ddd2;
    --accent: #176b87;
    --accent-2: #9a3412;
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; overflow: auto; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: var(--bg); color: var(--ink); }
  .shell { max-width: 1500px; min-height: 100vh; margin: 0 auto; padding: 14px 18px; display: flex; flex-direction: column; }
  .topbar { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 16px; }
  .top-actions { display: flex; align-items: center; gap: 10px; }
  .topbar a, button { border: 1px solid var(--line); border-radius: 8px; background: var(--paper); color: var(--ink); padding: 10px 14px; font-weight: 700; text-decoration: none; cursor: pointer; }
  button.primary { background: var(--accent); border-color: var(--accent); color: white; }
  button:disabled { opacity: 0.45; cursor: not-allowed; }
  .counter { color: var(--muted); font-weight: 700; }
  .slide { min-height: calc(100vh - 82px); background: var(--paper); border: 1px solid var(--line); border-radius: 10px; padding: 18px; box-shadow: 0 18px 42px rgba(15, 23, 42, 0.10); display: grid; grid-template-columns: minmax(310px, 0.86fr) minmax(0, 1.55fr); gap: 18px; overflow: visible; }
  .paper-head { min-width: 0; min-height: 0; overflow: visible; display: flex; flex-direction: column; gap: 12px; }
  .figure { margin: 0; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: #f8fafc; }
  .figure img { display: block; width: 100%; max-height: 41vh; object-fit: contain; background: white; }
  .figure figcaption { padding: 7px 10px; color: var(--muted); font-size: 12px; line-height: 1.3; }
  .head-text { display: flex; flex-direction: column; gap: 9px; min-width: 0; }
  .badges { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .badge { border-radius: 999px; padding: 5px 9px; background: #eef2ff; color: #3730a3; font-size: 12px; font-weight: 800; }
  .score { background: #fee2e2; color: #991b1b; }
  h1 { margin: 0; font-size: 25px; line-height: 1.15; letter-spacing: 0; overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
  h1 a { color: inherit; text-decoration-color: rgba(23, 107, 135, 0.35); text-decoration-thickness: 2px; text-underline-offset: 4px; }
  h1 a:hover { color: var(--accent); text-decoration-color: var(--accent); }
  .meta, .authors, .why, .abstract { font-size: 13px; line-height: 1.45; }
  .meta, .authors { color: var(--muted); }
  .why strong, .abstract strong, .authors strong { color: var(--ink); }
  .authors { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .why { border-left: 4px solid var(--accent-2); padding-left: 10px; color: #374151; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .abstract { border-top: 1px solid var(--line); padding-top: 14px; color: #374151; }
  .original-abstract { border-top: 1px solid var(--line); padding-top: 10px; color: #374151; font-size: 11.5px; line-height: 1.35; overflow-wrap: anywhere; }
  .original-abstract strong { display: block; margin-bottom: 4px; color: var(--ink); }
  .tags { display: flex; flex-wrap: wrap; gap: 8px; }
  .tag { border-radius: 999px; padding: 4px 8px; background: #f1f5f9; color: #475569; font-size: 12px; font-weight: 700; }
  .head-text > .link { display: none; }
  .briefing { min-width: 0; min-height: 0; overflow: visible; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); grid-auto-rows: minmax(0, auto); align-content: start; gap: 11px 18px; border-top: 0; padding-top: 0; }
  .brief-section { min-width: 0; }
  .brief-section.wide { grid-column: 1 / -1; }
  .brief-section h2 { margin: 0 0 4px; font-size: 14px; line-height: 1.22; color: #0f766e; letter-spacing: 0; }
  .brief-section p, .brief-section li { margin: 0; font-size: 12.5px; line-height: 1.42; color: #1f2937; overflow-wrap: anywhere; }
  .brief-section ul { margin: 0; padding-left: 20px; }
  .concepts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 9px 14px; }
  .concept { border-top: 1px solid var(--line); padding-top: 7px; }
  .concept h3 { margin: 0 0 4px; font-size: 13px; color: #7c2d12; letter-spacing: 0; }
  .concept p { margin: 2px 0 0; font-size: 11.5px; line-height: 1.35; color: #374151; overflow-wrap: anywhere; }
  .concept b { color: #111827; }
  .link { color: var(--accent); font-weight: 800; text-decoration: none; }
  .empty { padding: 48px; background: var(--paper); border: 1px solid var(--line); border-radius: 12px; color: var(--muted); }
  @media (max-width: 860px) {
    .shell { padding: 14px; }
    .topbar, .top-actions { align-items: stretch; flex-direction: column; }
    .slide, .briefing, .concepts { grid-template-columns: 1fr; }
    .slide { min-height: auto; overflow: visible; display: grid; }
    h1 { font-size: 28px; }
  }
</style>

<script>
const slides = [{"title": "Orbital altermagnetism on the kagome lattice and possible application to AV3Sb5 (Phys. Rev. B)", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2509.26596", "authors": "Anzumaan R. Chakraborty, Fan Yang, Turan Birol, Rafael M. Fernandes", "last_authors": "Turan Birol, Rafael M. Fernandes", "summary": "arXiv:2509.26596v3 Announce Type: replace Abstract: Altermagnets, which encompass a broad landscape of materials, are compensated collinear magnetic phases in which the antiparallel magnetic moments are related by a crystalline rotation. Here, we argue that collinear altermagnetic-like states can also be realized in lattices with an odd number of sublattices, provided that the electronic interactions promote non-uniform magnetic moments. We demonstrate this idea for a kagome metal whose band filling places the Fermi level close to the van Hove singularity. Combining phenomenological and microscopic modeling, we show that the intertwined charge density-wave and loop-current instabilities of this model lead to a wide parameter range in which orbital ferromagnetic, antiferromagnetic, and altermagnetic phases emerge inside the charge-ordered state. In the presence of spin-orbit coupling, their electronic structures display the usual spin-split fingerprints associated with the three types of collinear magnetic order. We discuss the possible realization of orbital altermagnetic phases in the $A$V$_3$Sb$_5$ family of kagome metals.", "tier": "A_MUST_READ", "score": "10", "reason": "Direct hit on kagome metals, AV3Sb5, loop currents, and altermagnetism in a single paper.", "tags": ["material", "kagome", "altermagnetism", "loop-current"], "image": "https://arxiv.org/html/2509.26596v3/x1.png", "briefing": {"background": "알터마그네틱(Altermagnetism)은 최근 응집물질물리학에서 새롭게 주목받는 자성 상태로, 스핀이 정렬되어 있지만 기존의 강자성이나 반강자성과는 다른 결정 대칭성에 의해 독특한 스핀 분할(spin splitting)을 나타내는 상입니다.", "motivation": "AV3Sb5와 같은 카고메 금속에서 관측되는 전하 밀도 파(CDW)와 루프 전류(loop-current) 상태가 어떻게 비자성 금속 환경에서 자성적 질서와 결합할 수 있는지 이론적으로 규명하고자 했습니다.", "result": "카고메 격자에서 전자 간 상호작용이 강할 때, CDW 상태 내부에서 궤도 기반의 강자성, 반강자성 및 알터마그네틱 상태가 발생할 수 있음을 보였습니다.", "implication": "AV3Sb5 가족 물질에서 관측되는 기이한 전자 구조와 자기적 특성을 알터마그네틱 모델로 설명할 수 있는 가능성을 제시하며, 이는 이들 물질의 전자 상태를 이해하는 새로운 패러다임이 될 수 있습니다.", "novelty": "기존에는 이방성 격자에서만 다루어지던 알터마그네틱 아이디어를 카고메 격자의 궤도 자유도와 결합하여 이론적으로 모델링했다는 점이 독창적입니다.", "unresolved": "실제 실험적으로 검출된 CDW 상에서의 미세한 자기적 구조가 이론적 예측과 정량적으로 일치하는지에 대한 검증이 필요합니다.", "future_work": "ARPES나 편광 의존적인 RIXS 실험을 통해 제안된 궤도 알터마그네틱 상태의 스핀 분할 증거를 찾는 연구가 필요합니다.", "concepts": [{"term": "Altermagnetism", "why_emerged": "강자성이나 반강자성으로 분류되지 않는 새로운 유형의 콜리니어 자기 질서를 설명하기 위해 필요.", "origin": "최근 3~4년 내 이론적 체계 정립, 특정 개척자는 초록 정보만으로는 특정하기 어려움.", "connections": "스핀-궤도 결합, 베리 곡률, 비정질 홀 효과."}, {"term": "Kagome lattice", "why_emerged": "기하학적 좌절(frustration)과 평탄 밴드(flat band)를 통해 강한 상관관계를 유도하기 위해 연구됨.", "origin": "일본의 바구니 짜기 문양에서 유래, 물리학적으로는 20세기 중반 이후 격자 모델로 확립.", "connections": "AV3Sb5, FeGe, 토폴로지 밴드 구조."}], "english_summary": ["The paper investigates orbital altermagnetism in kagome lattices with an odd number of sublattices.", "It shows that interactions near the van Hove singularity can induce intertwined CDW and loop-current states.", "The model predicts the emergence of orbital ferromagnetic and altermagnetic phases within the charge-ordered state.", "These findings provide a theoretical framework for interpreting the complex magnetic behavior in AV3Sb5 materials."]}}, {"title": "Phonons and magnetism of kagome FeGe probed by nuclear resonant scattering", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2606.12038", "authors": "Yu Tang, Saizheng Cao, Sijie Xu, et al.", "last_authors": "Yilin Wang, Yu Song", "summary": "arXiv:2606.12038v1 Announce Type: new Abstract: Kagome FeGe hosts a $2\\times2\\times2$ charge-density wave (CDW) that strongly interplays with antiferromagnetic order. Here, we report $^{57}$Fe nuclear resonant scattering measurement to study FeGe across its long-range CDW and incommensurate magnetic transitions. Upon entering the CDW state, hardening of acoustic phonons and optical phonons around 22~meV, 27~meV, and 31~meV are observed in the Fe partial phonon density of states, which can be qualitatively captured by first-principle calculations. Upon entering the incommensurate magnetic phase, neither the phonon density of states nor the hyperfine interaction parameters change significantly, although a subtle feature associated with the incommensurate magnetic order or slow fluctuations is detected in the time-domain M\\\"{o}ssbauer spectra. These findings show that the CDW in kagome FeGe significantly modifies its lattice dynamics and magnetism, evidencing an intertwined nature of the spin, charge, and lattice degrees of freedom.", "tier": "A_MUST_READ", "score": "10", "reason": "Experimental study of CDW and magnetism in a kagome material, a direct hit for user's projects.", "tags": ["kagome", "CDW", "magnetism", "phonons", "experimental", "FeGe"], "image": "https://arxiv.org/html/2606.12038v1/x1.png", "briefing": {"background": "카고메 금속 FeGe는 전하 밀도 파(CDW)와 자기적 질서가 공존하며, 이들 사이의 복잡한 상호작용이 전자적 물성에 큰 영향을 미치는 것으로 알려져 있습니다.", "motivation": "CDW 전이와 자기적 질서 전이 과정에서 격자 역학(phonons)과 스핀 자유도가 어떻게 상호작용하는지를 직접적으로 관측하고자 했습니다.", "result": "CDW 전이 시 격자 모드(포논)의 경화(hardening)가 관측되었으나, 자기 전이 시에는 포논이나 초미세 상호작용의 급격한 변화가 나타나지 않았습니다.", "implication": "FeGe에서 CDW가 결정 격자 구조를 직접적으로 변형시켜 전자 구조에 영향을 주는 반면, 자기 질서는 그에 비해 격자 역학에 미치는 직접적인 영향이 작음을 시사합니다.", "novelty": "핵 공명 산란(Nuclear Resonant Scattering)을 사용하여 FeGe의 포논 상태 밀도를 정밀하게 추적함으로써 스핀-전하-격자 결합의 미세한 차이를 확인했습니다.", "unresolved": "자기 전이 시 나타나는 미세한 신호가 구체적으로 어떤 자기적 요동을 나타내는지에 대한 해석이 완전히 정립되지 않았습니다.", "future_work": "다양한 외부 장(자기장, 압력) 하에서의 중성자 산란 실험을 통한 자기적 들뜸(magnon) 연구가 요구됩니다.", "concepts": [{"term": "Nuclear Resonant Scattering", "why_emerged": "특정 원자핵의 국소적인 환경과 진동 상태를 정밀하게 분석하기 위해 개발됨.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "뫼스바우어 분광법, 격자 동역학."}, {"term": "CDW (Char tudy on spin liquid candidate herbertsmithite, relevant to strongly correlated systems.", "tags": ["spinliquid", "stronglycorrelated", "herbertsmithite", "experiment"], "image": "https://media.springernature.com/m685/springer-static/image/art%3A10.1038%2Fs41567-026-03303-6/MediaObjects/41567_2026_3303_Fig1_HTML.png", "briefing": {"background": "양자 스핀 액체(Quantum Spin Liquid, QSL)는 절대영도에서도 자기 질서가 형성되지 않는 양자 얽힘 상태로, 강력한 상관관계 시스템의 핵심 연구 주제입니다. 그러나 QSL 후보 물질인 허버트스미타이트(Herbertsmithite)에서 QSL의 직접적인 증거를 포착하는 것은 실험적으로 매우 어렵습니다.", "motivation": "기존의 산란 실험 방식이 명확한 증거를 제시하지 못함에 따라, 본 연구는 불순물 스핀을 관찰자로 활용하여 기저 상태의 스핀 역학을 간접적으로 탐지하고자 했습니다.", "result": "허버트스미타이트 내의 불순물 스핀 역학이 스피논(spinon)에 의해 매개됨을 보여줌으로써 QSL 기저 상태의 가능성을 강력하게 뒷받침하는 새로운 실험적 증거를 제시했습니다.", "implication": "QSL을 직접 측정하는 대신 불순물 스핀의 동역학을 이용하는 전략이 향후 다른 복잡한 양자 자기 시스템의 기저 상태를 연구하는 표준 방법론으로 자리 잡을 수 있음을 시사합니다.", "novelty": "기존 산란 실험의 한계를 넘어 불순물 탐침 기법을 도입했다는 점에서 독창적이며, 강상관 전자계와 스핀 시스템의 상관관계를 탐구하는 독자에게 중요한 간접 측정 프레임워크를 제공합니다.", "unresolved": "불순물에 의한 섭동이 시스템 전체의 QSL 성질을 완벽하게 대표하는지에 대한 이론적 검증이 여전히 필요합니다.", "future_work": "다른 QSL 후보 물질에 대한 불순물 주입 실험 및 불순물-스피논 결합의 이론적 모델링 고도화가 예상됩니다.", "concepts": [{"term": "Quantum Spin Liquid", "why_emerged": "기존의 자기 정렬 모델로는 절대영도에서의 비자기적 상태를 설명할 수 없어 도입됨", "origin": "필립 앤더슨(1973)", "connections": "허버트스미타이트, 미우라자이트 등 2차원 카고메 격자 물질"}, {"term": "Spinon", "why_emerged": "양자 스핀 시스템에서 스핀 플립이 분수화(fractionalization)되어 나타나는 준입자 기술 필요성", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "베테 안자츠, 1차원 하이젠베르크 모델, QSL 이론"}, {"term": "Herbertsmithite", "why_emerged": "2차원 카고메 격자를 가진 가장 대표적인 QSL 실험 후보 물질", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "좌절된 자기 시스템(Frustrated magnets), 강상관 계"}], "english_summary": ["The study addresses the long-standing challenge of identifying a quantum spin liquid ground state in herbertsmithite.", "Researchers used impurity spins as localized probes to track spin dynamics.", "Evidence suggests that spinon-mediated interactions govern these impurity dynamics.", "This approach estab
