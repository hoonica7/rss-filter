<title>Daily Paper Slideshow</title>
<style>
  :root {
    color-scheme: light;
    --bg: #f6f7f4;
    --paper: #ffffff;
    --ink: #111827;
    --muted: #64748b;
    --line: #d8ddd2;
    --accent: #176b87;
    --accent-2: #9a3412;
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; overflow: auto; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: var(--bg); color: var(--ink); }
  .shell { max-width: 1500px; min-height: 100vh; margin: 0 auto; padding: 14px 18px; display: flex; flex-direction: column; }
  .topbar { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 16px; }
  .top-actions { display: flex; align-items: center; gap: 10px; }
  .topbar a, button { border: 1px solid var(--line); border-radius: 8px; background: var(--paper); color: var(--ink); padding: 10px 14px; font-weight: 700; text-decoration: none; cursor: pointer; }
  button.primary { background: var(--accent); border-color: var(--accent); color: white; }
  button:disabled { opacity: 0.45; cursor: not-allowed; }
  .counter { color: var(--muted); font-weight: 700; }
  .slide { min-height: calc(100vh - 82px); background: var(--paper); border: 1px solid var(--line); border-radius: 10px; padding: 18px; box-shadow: 0 18px 42px rgba(15, 23, 42, 0.10); display: grid; grid-template-columns: minmax(310px, 0.86fr) minmax(0, 1.55fr); gap: 18px; overflow: visible; }
  .paper-head { min-width: 0; min-height: 0; overflow: visible; display: flex; flex-direction: column; gap: 12px; }
  .figure { margin: 0; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: #f8fafc; }
  .figure img { display: block; width: 100%; max-height: 41vh; object-fit: contain; background: white; }
  .figure figcaption { padding: 7px 10px; color: var(--muted); font-size: 12px; line-height: 1.3; }
  .head-text { display: flex; flex-direction: column; gap: 9px; min-width: 0; }
  .badges { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .badge { border-radius: 999px; padding: 5px 9px; background: #eef2ff; color: #3730a3; font-size: 12px; font-weight: 800; }
  .score { background: #fee2e2; color: #991b1b; }
  h1 { margin: 0; font-size: 25px; line-height: 1.15; letter-spacing: 0; overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
  h1 a { color: inherit; text-decoration-color: rgba(23, 107, 135, 0.35); text-decoration-thickness: 2px; text-underline-offset: 4px; }
  h1 a:hover { color: var(--accent); text-decoration-color: var(--accent); }
  .meta, .authors, .why, .abstract { font-size: 13px; line-height: 1.45; }
  .meta, .authors { color: var(--muted); }
  .why strong, .abstract strong, .authors strong { color: var(--ink); }
  .authors { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .why { border-left: 4px solid var(--accent-2); padding-left: 10px; color: #374151; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .abstract { border-top: 1px solid var(--line); padding-top: 14px; color: #374151; }
  .original-abstract { border-top: 1px solid var(--line); padding-top: 10px; color: #374151; font-size: 11.5px; line-height: 1.35; overflow-wrap: anywhere; }
  .original-abstract strong { display: block; margin-bottom: 4px; color: var(--ink); }
  .tags { display: flex; flex-wrap: wrap; gap: 8px; }
  .tag { border-radius: 999px; padding: 4px 8px; background: #f1f5f9; color: #475569; font-size: 12px; font-weight: 700; }
  .head-text > .link { display: none; }
  .briefing { min-width: 0; min-height: 0; overflow: visible; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); grid-auto-rows: minmax(0, auto); align-content: start; gap: 11px 18px; border-top: 0; padding-top: 0; }
  .brief-section { min-width: 0; }
  .brief-section.wide { grid-column: 1 / -1; }
  .brief-section h2 { margin: 0 0 4px; font-size: 14px; line-height: 1.22; color: #0f766e; letter-spacing: 0; }
  .brief-section p, .brief-section li { margin: 0; font-size: 12.5px; line-height: 1.42; color: #1f2937; overflow-wrap: anywhere; }
  .brief-section ul { margin: 0; padding-left: 20px; }
  .concepts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 9px 14px; }
  .concept { border-top: 1px solid var(--line); padding-top: 7px; }
  .concept h3 { margin: 0 0 4px; font-size: 13px; color: #7c2d12; letter-spacing: 0; }
  .concept p { margin: 2px 0 0; font-size: 11.5px; line-height: 1.35; color: #374151; overflow-wrap: anywhere; }
  .concept b { color: #111827; }
  .link { color: var(--accent); font-weight: 800; text-decoration: none; }
  .empty { padding: 48px; background: var(--paper); border: 1px solid var(--line); border-radius: 12px; color: var(--muted); }
  @media (max-width: 860px) {
    .shell { padding: 14px; }
    .topbar, .top-actions { align-items: stretch; flex-direction: column; }
    .slide, .briefing, .concepts { grid-template-columns: 1fr; }
    .slide { min-height: auto; overflow: visible; display: grid; }
    h1 { font-size: 28px; }
  }
</style>

const slides = [{"title": "Vestigial chirality from fluctuating loop currents on the kagome lattice", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2609.19618", "authors": "Yin Shi, Xuande Bu, Sheng Meng", "last_authors": "Xuande Bu, Sheng Meng", "summary": "Multicomponent order can melt in stages, leaving a composite order after its primary constituents become short ranged. We study this possibility for commensurate three-$Q$ loop-current order on the kagome lattice. Large-scale cluster and parallel-tempering Monte Carlo simulations reveal direct and two-stage melting regimes in an effective fixed-amplitude sign model. In the latter regime, translation-sector domain walls proliferate before chirality-changing walls, restoring lattice translational symmetry while preserving long-range time-reversal-odd order. The primary $M$-point correlations are short ranged in this intermediate phase. The two-stage regime begins when the lowest-energy chirality-changing wall is only about $12$--$13\\%$ more costly than a same-chirality translation wall. Finite-size scaling of a stable amplitude-resolved Ginzburg--Landau theory shows that the phase survives amplitude relaxation. Our results establish a quantitative domain-wall criterion for vestigial loop-current order and a fluctuation route to time-reversal symmetry breaking without long-range loop-current Bragg order. This separation provides a possible thermodynamic framework for time-reversal-odd responses recently reported above the critical temperature for conventional charge-density-wave ordering in kagome metals.", "tier": "A_MUST_READ", "score": "10", "reason": "Directly addresses vestigial loop-current order and TRSB in kagome metals, a primary research focus.", "tags": ["theory", "kagome", "loop-current", "TRSB"], "image": "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAsAAAAOCAYAAAD5YeaVAAAAAXNSR0IArs4c6QAAAAZiS0dEAP8A/wD/oL2nkwAAAAlwSFlzAAALEwAACxMBAJqcGAAAAAd0SU1FB9wKExQZLWTEaOUAAAA nnections": "네마틱(nematic) 상전이, 비전통적 초전도체의 복합 질서 등과 연결됩니다."}, {"term": "Loop current (루프 전류)", "why_emerged": "강한 상관관계가 있는 전자계에서 스핀 자성 없이 시간 반전 대칭성을 깨뜨리는 메커니즘을 설명하기 위해 제안되었습니다.", "origin": "C. M. Varma (구리 산화물 초전도체 연구 중 제안)", "connections": "카고메 금속의 TRSB, Varma 모델, 궤도 자기 모멘트."}, {"term": "Kagome lattice (카고메 격자)", "why_emerged": "기하학적 좌절(frustration)과 특이한 밴드 구조(평탄 밴드, 디락 점)를 동시에 구현할 수 있는 플랫폼으로 주목받았습니다.", "origin": "일본의 전통 대바구니 패턴 이름에서 유래", "connections": "AV3Sb5, 양자 스핀 액체, 디락 반금속, 초전도."}, {"term": "Time-reversal symmetry breaking (시간 반전 대칭성 깨짐)", "why_emerged": "시스템의 물리적 특성이 시간의 방향을 뒤집었을 때 변하는 상태(자성 등)를 정의하기 위해 필수적입니다.", "origin": "고전 및 양자역학의 기본 대칭성 원리", "connections": "비정상 홀 효과, 뮤온 스핀 회전(muSR), 극성 커 효과(Kerr effect)."}], "english_summary": ["The study identifies a vestigial chiral phase in the kagome lattice where time-reversal symmetry is broken without long-range loop-current order.", "Large-scale Monte Carlo simulations demonstrate a two-stage melting process of the 3-Q loop-current state.", "A quantitative domain-wall energy criterion is established for the existence of this intermediate phase.", "Provides a potential theoretical explanation for TRSB signatures observed above the CDW transition temperature in kagome metals like AV3Sb5."]}}, {"title": "Photoenhanced superconductivity and emergent topological phonons by charge-order suppression in a kagome metal", "journal": "PRB_Recent", "source": "keyword", "link": "http://link.aps.org/doi/10.1103/wmjt-txdk", "authors": "Jianguo Si, Zhongjia Chen, Lanting Shi, et al.", "last_authors": "Jiyu Xu, Sheng Meng", "summary": "Kagome metals exhibit diverse exotic phenomena, including superconductivity, nontrivial electronic topology, and charge-density wave (CDW) states. Here, we demonstrate that photoenhanced superconductivity and topological phonons emerge after the CDW order is suppressed via optical excitation in ${\\m…", "tier": "A_MUST_READ", "score": "9", "reason": "title strong match: kagome metal", "tags": ["kagome", "CDW", "superconduct", "topological", "phonon"], "image": "", "briefing": {"background": "카고메 금속은 초전도, 전하 밀도파(CDW), 위상 기하학적 특성이 복잡하게 얽혀 있는 물질군으로, 이들 간의 경쟁과 협력을 제어하는 것이 주요 연구 과제입니다.", "motivation": "빛(광자)을 이용해 특정 질서(CDW)를 억제했을 때, 시스템의 기저 상태인 초전도나 격자 진동(포논)의 위상적 성질이 어떻게 변화하는지 탐구하고자 했습니다.", "result": "광 여기(Optical excitation)를 통해 CDW 상태를 억제한 결과, 초전도 현상이 강화(Photoenhanced)되고, 동시에 위상적 포논(Topological phonons)이 발현됨을 실험적으로(혹은 계산으로) 입증했습니다.", "implication": "빛을 이용한 비평형 상태 제어가 카고메 금속의 양자 상태를 조절하는 유력한 수단이 될 수 있음을 시사하며, 특히 위상적 포논의 제어 가능성을 열었습니다.", "novelty": "CDW 억제가 단순히 초전도만 강화하는 것이 아니라 포논의 위상적 특성까지 변화시킨다는 점을 연결한 것이 새롭습니다. 독자의 관심사인 카고메 금속 및 CDW 제어와 매우 밀접합니다.", "unresolved": "초록상으로는 어떤 특정 카고메 물질(CsV3Sb5 등)에서 관찰된 것인지, 그리고 이러한 위상 포논이 초전도 강화에 직접적으로 기여하는지에 대한 상세 기전이 명확히 드러나지 않습니다.", "future_work": "광 여기된 위상 포논의 수명 측정 및 이를 이용한 새로운 양자 소자 응용 연구가 기대됩니다.", "concepts": [{"term": "Photoenhanced superconductivity (광 강화 초전도)", "why_emerged": "평형 상태의 임계 온도나 임계 전류를 넘어선 초전도 특성을 유도하기 위한 비평형 제어 수단으로 연구되었습니다.", "origin": "초록 정보만으로는 특정하기 어려우나, 펌프-프로브 분광학의 발전과 함께 대두됨", "connections": "플로케(Floquet) 엔지니어링, 광학적 격자 제어."}, {"term": "Topological phonons (위상 포논)", "why_emerged": "전자계의 위상 절연체 개념을 격자 진동인 포논으로 확장하여, 산란에 강한 에너지 전달 등을 구현하기 위해 등장했습니다.", "origin": "위상 절연체 이론의 확장 (2010년대 중반 이후 본격화)", "connections": "베리 곡률, 포논 홀 효과, Weyl 포논."}], "english_summary": ["Optical suppression of the CDW state in a kagome metal leads to the enhancement of superconductivity.", "The study reports the emergence of topological phonons following the suppression of charge order.", "Demonstrates a dynamic route to control competing quantum orders and lattice topology using light.", "Highlights the interplay between electronic topology, CDW, and superconductivity in kagome systems."]}}, {"title": "Quantum-critical mediation of magnetic order by a Tomonaga-Luttinger liquid", "journal": "PRB_Recent", "source": "keyword", "link": "http://link.aps.org/doi/10.1103/yrwj-qgqk", "authors": "Hironori Yamaguchi, Sota Monju, Akira Matsuo, et al.", "last_authors": "Masayuki Hagiwara, Koichi Kindo", "summary": "Quantum-critical many-body states host universal correlations extending across all length scales. Whether these critical correlations merely characterize quantum-critical matter or can actively generate interactions that organize collective order has remained an open question. Here, we establish the…", "tier": "A_MUST_READ", "score": "9", "reason": "title strong match: Luttinger liquid", "tags": ["Luttinger"], "image": "", "briefing": {"background": "1차원 계에서는 입자의 개별적 운동이 불가능하고 집단적인 들뜸(collective excitations)만 존재하는 토모나가-루팅어 액체(TLL) 상태가 나타납니다. 이러한 양자 임계 상태가 주변의 자기적 질서를 어떻게 매개하거나 형성하는지는 중요한 질문입니다.", "motivation": "양자 임계 계의 범용적 상관관계(universal correlations)가 단순히 계를 특징짓는 것에 그치지 않고, 능동적으로 상호작용을 생성하여 집단적인 자기 질서를 조직할 수 있는지 확인하고자 했습니다.", "result": "TLL의 상관관계가 자기적 질서를 형성하는 매개체 역할을 할 수 있음을 확인했습니다. 이는 양자 임계 상태가 능동적으로 물질의 질서를 조직하는 주체가 될 수 있음을 보여줍니다.", "implication": "유사 1차원(quasi-1D) 물질에서 관찰되는 장거리 자기 질서의 기원을 설명하는 새로운 경로를 제시하며, TLL 상태를 이용한 자기성 제어의 가능성을 보여줍니다.", "novelty": "루팅어 액체를 단순한 관찰 대상이 아닌, 질서 형성의 '매개체(mediator)'로 재정의한 점이 독창적입니다. 독자의 관심사인 NbSe3, TaNiTe2 등 1차원 사슬 구조 물질 연구에 중요한 이론적 배경을 제공합니다.", "unresolved": "실제 실험 물질에서 TLL 매개 상호작용과 기존의 3차원적 자기 상호작용을 어떻게 명확히 구분할 것인가 하는 문제가 남아 있습니다.", "future_work": "다양한 유사 1차원 자성체에서 TLL에 의한 자기 질서 매개 효과를 검증하기 위한 중성자 산란이나 극저온 실험이 뒤따를 것으로 보입니다.", "concepts": [{"term": "Tomonaga-Luttinger liquid (TLL)", "why_emerged": "1차원 전자계에서 페르미 액체 이론이 붕괴되는 현상을 설명하기 위해 도입되었습니다.", "origin": "S. Tomonaga (1950), J. M. Luttinger (1963)", "connections": "스핀-전하 분리, 1차원 도체, 탄소 나노튜브."}, {"term": "Quantum criticality (양자 임계성)", "why_emerged": "절대 영도에서 파라미터 변화에 의해 발생하는 상전이 부근의 특이한 물리적 성질을 이해하기 위해 필요합니다.", "origin": "Subir Sachdev 등의 양자 상전이 연구", "connections": "척도 불변성(scaling), 비정상 페르미 액체, 고온 초전도."}], "english_summary": ["Establishes that Tomonaga-Luttinger liquid correlations can actively mediate and organize long-range magnetic order.", "Addresses the fundamental question of whether quantum-critical states can generate interactions for collective order.", "Provides a new perspective on the role of 1D collective excitations in higher-dimensional magnetic organization.", "Relevant for understanding magnetism in quasi-1D materials and quantum critical systems."]}}, {"title": "Structural Phase Separation Couples to Charge-Density-Wave Formation in Kagome Metal FeGe", "journal": "PRL_Recent", "source": "keyword", "link": "http://link.aps.org/doi/10.1103/tqqs-s1r6", "authors": "Boyang Zhao, Youngjun Ahn, Qinwen Deng, et al.", "last_authors": "Liang Wu, Haidan Wen", "summary": "Temperature-dependent high-resolution synchrotron X-ray diffraction reveals structural Bragg peak splits in FeGe at the charge-density-wave transition temperature suggesting that its quantum states may be manipulated with strain.", "tier": "A_MUST_READ", "score": "9", "reason": "title strong match: kagome metal", "tags": ["kagome"], "image": "", "briefing": {"background": "카고메 격자(Kagome lattice)를 가진 금속 물질들은 위상수학적 밴드 구조와 강한 상관관계가 얽혀 나타나는 독특한 양자 상태를 연구하는 주요 플랫폼입니다. 특히 FeGe는 카고메 격자 내에서 자성과 전하 밀도 파(CDW)가 공존하는 드문 사례로, 격자 구조와 전자 구조 간의 상호작용이 핵심적인 연구 주제입니다.", "motivation": "FeGe에서 발생하는 전하 밀도 파(CDW) 형성 과정에서 격자 구조의 변화가 어떻게 수반되는지, 그리고 이것이 물질의 양자 상태에 어떠한 영향을 미치는지를 고해상도 싱크로트론 X선 회절을 통해 규명하고자 했습니다.", "result": "고해상도 싱크로트론 X선 회절 실험을 통해 FeGe의 CDW 전이 온도에서 브래그 피크(Bragg peak)가 갈라지는 현상을 발견했습니다. 이는 CDW 형성 시 구조적 상분리(structural phase separation)가 발생함을 시사하며, 격자 변형이 이 시스템의 전자 상태와 밀접하게 결합되어 있음을 보여줍니다.", "implication": "피크 갈라짐 현상은 FeGe의 양자 상태가 외부 스트레인(strain)이나 격자 조절을 통해 정밀하게 제어될 수 있음을 의미합니다. 이는 향후 카고메 자성체 기반의 양자 소자 설계에 중요한 물리적 토대를 제공합니다.", "novelty": "자기적 카고메 금속인 FeGe에서 CDW와 결합된 미세한 구조적 상분리를 실험적으로 직접 관찰한 점이 가장 큰 특징입니다. 독자의 관심사인 AV3Sb5 계열의 CDW 연구와 비교하여, 자성이 있는 시스템에서의 구조-전하 결합을 다룬다는 점에서 차별화됩니다.", "unresolved": "초록 정보만으로는 구조적 상분리가 발생하는 구체적인 도메인 크기나, 이것이 자성(순전기적 또는 스핀 구조)과 어떻게 직접적으로 상호작용하는지에 대한 상세한 기작은 명확히 제시되지 않았습니다.", "future_work": "스트레인을 인가한 상태에서의 현미경 관찰이나 ARPES 측정 등을 통해, 발견된 구조적 분리가 실제 전자 밴드 구조에 어떤 변화를 주는지 직접 확인하는 연구가 이어질 것으로 예상됩니다.", "concepts": [{"term": "Kagome Metal (카고메 금속)", "why_emerged": "기하학적 좌절(frustration)과 플랫 밴드(flat band), 디락 콘(Dirac cone) 등 위상적 특성을 한 시스템에서 연구하기 위해 도입되었습니다.", "origin": "전통적인 일본 대바구니 패턴(Kagome)에서 유래한 격자 구조를 가진 금속들.", "connections": "FeGe, AV3Sb5 (A=K, Rb, Cs), TbMn6Sn6 등"}, {"term": "Charge-Density-Wave (CDW, 전하 밀도 파)", "why_emerged": "저차원 금속 시스템에서 전자-격자 결합이나 전자-전자 상호작용에 의해 전하 밀도가 주기적으로 변조되는 현상을 설명하기 위해 등장했습니다.", "origin": "Peierls (1930년대 이론적 제안)", "connections": "금속-절연체 전이, 초전도체와의 경쟁 관계, FeGe의 자성과 공존"}, {"term": "Structural Phase Separation (구조적 상분리)", "why_emerged": "단일 결정 내에서 미세한 구조적 차이를 가진 영역들이 공존하는 현상을 설명하기 위해 사용됩니다.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "강상관 전자계의 불균일성(inhomogeneity), 스트레인 공학"}, {"term": "Synchrotron X-ray Diffraction (싱크로트론 X선 회절)", "why_emerged": "극히 미세한 격자 구조 변화나 상분리를 관찰하기 위해 고휘도의 광원이 필요하여 사용됩니다.", "origin": "싱크로트론 방사광 시설의 발전과 함께 정밀 구조 분석법으로 확립됨", "connections": "브래그 법칙, 결정학적 상전이 분석"}], "english_summary": ["High-resolution synchrotron X-ray diffraction reveals structural Bragg peak splitting in FeGe at the CDW transition.", "The findings suggest that structural phase separation is intrinsically coupled to the formation of charge-density waves.", "The discovery indicates that quantum states in magnetic kagome metals like FeGe are highly tunable via strain engineering.", "This provides a new perspective on the interplay between lattice symmetry and electronic correlations in kagome systems."]}}, {"title": "Correlated one-dimensional electron conduction in ferroelastic domain walls through nematic-like charge stripes", "journal": "Science_Advances", "source": "author whitelist", "link": "https://www.science.org/doi/abs/10.1126/sciadv.aee1472?af=R", "authors": "Minho Kang, Gyubin Lee, Wooin Yang, et al.", "last_authors": "Yeongkwan Kim, Chan-Ho Yang", "summary": "One-dimensional electronic transport reveals many-body quantum phenomena and serves as a foundation for quantum devices, sensors, and reconfigurable electronics. Here, we demonstrate that surface-exposed ferroelastic twin walls in epitaxial WO 3 films function as intrinsic one-dimensional channels, confining electrons to screen surface-bound charges induced by flexoelectric polarization. Scanning tunneling microscopy uncovers a self-organized nematic-like phase forming periodic stripes perpendicular to the walls. Conductive atomic force microscopy and angle-resolved photoemission spectroscopy resolve quantized one-dimensional states and reveal conductance enhancements exceeding two orders of magnitude along the twin walls relative to the surrounding semi-insulating surface regions at room temperature. Temperature-dependent transport follows an Efros–Shklovskii variable-range hopping law, with a crossover near 140 K and a localization length of 39 Å—identical to the stripe period—signifying Coulomb-coupled electrons confined within stripe-induced potential wells along the walls. These findings establish WO 3 ferroelastic walls as a tunable platform for engineering one-dimensional correlated electron states.", "tier": "A_MUST_READ", "score": "9", "reason": "author whitelist: Yeongkwan Kim", "tags": ["nematic", "correlated"], "image": "", "briefing": {"background": "강상관 1차원 전자계는 러팅거 액체(Luttinger liquid)나 스핀-전하 분리 등 흥미로운 양자 현상을 보여줍니다. 강유전체나 강탄성체(ferroelastic)의 도메인 벽은 물질 내부에 자연적으로 형성되는 전도성 채널로서, 이를 활용한 나노 소자 연구가 활발합니다.", "motivation": "WO3(텅스텐 산화물) 박막의 강탄성 쌍정벽(twin walls)이 보이는 독특한 1차원 전도 특성의 물리적 기원을 밝히고, 이것이 보이는 네마틱(nematic) 성질과 상관관계 효과를 규명하고자 했습니다.", "result": "STM을 통해 도메인 벽에 수직인 네마틱 형태의 전하 스트라이프(charge stripes)가 자발적으로 형성됨을 확인했습니다. ARPES와 전도성 AFM을 통해 1차원 양자 상태가 도메인 벽을 따라 존재함을 입증했으며, 온도 변화에 따른 전도 특성이 Efros-Shklovskii 가변 거리 호핑(VRH) 모델을 따르는 강상관 계임을 보였습니다.", "implication": "강탄성 도메인 벽이 단순한 전도 경로를 넘어, 정교하게 제어 가능한 1차원 강상관 전자계 플랫폼으로 활용될 수 있음을 시사합니다. 특히 140K 부근의 크로스오버와 특정 국소화 길이는 전자 간의 쿨롱 상호작용이 중요함을 나타냅니다.", "novelty": "독자의 주요 관심사인 ARPES와 STM을 동시에 활용하여 1차원 전자 구조를 규명했다는 점이 중요합니다. 특히 Yeongkwan Kim 교수의 참여로 데이터의 신뢰도가 높으며, 네마틱 상과 1차원 전도의 결합을 WO3라는 산화물에서 발견한 것이 핵심입니다.", "unresolved": "1차원 한정(confinement)을 일으키는 정확한 전위 장벽의 프로파일과, 네마틱 스트라이프의 형성 메커니즘에 대한 보다 근본적인 미시적 이론이 보완될 필요가 있습니다.", "future_work": "도메인 벽의 위치를 외부 응력으로 조절하여 1차원 채널을 재구성하는 실험이나, 저온에서의 초전도 혹은 자성 발현 여부를 확인하는 연구가 기대됩니다.", "concepts": [{"term": "Ferroelastic Twin Wall (강탄성 쌍정벽)", "why_emerged": "강탄성 물질에서 변형률이 다른 영역들이 만나는 경계로, 특이한 물리적 성질이 집중되어 연구되기 시작했습니다.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "도메인 벽 전도성, 나노 스케일 소자"}, {"term": "Nematic-like Charge Stripe (네마틱형 전하 스트라이프)", "why_emerged": "회전 대칭성은 깨지되 병진 대칭성은 부분적으로 유지되는 액정 같은 전자 상태를 설명하기 위해 등장했습니다.", "origin": "구리 산화물 초전도체 등 강상관 계에서 주로 논의됨", "connections": "전자 네마틱성, 고온 초전도, 전하 밀도 파"}, {"term": "Efros-Shklovskii Variable-Range Hopping (ES-VRH)", "why_emerged": "무질서한 시스템에서 전자 간의 쿨롱 상호작용(Coulomb gap)이 우세할 때의 전도 메커니즘을 설명하기 위해 고안되었습니다.", "origin": "A. L. Efros, B. I. Shklovskii (1975)", "connections": "안다손 국소화, 쿨롱 갭, 저온 수송 특성"}, {"term": "ARPES (Angle-Resolved Photoemission Spectroscopy)", "why_emerged": "고체 내 전자의 에너지와 운동량을 직접 측정하여 밴드 구조를 규명하기 위해 필수적입니다.", "origin": "광전 효과를 기반으로 수십 년간 발전함", "connections": "Fermi surface mapping, 1D quantization, 전자 구조 분석"}], "english_summary": ["Ferroelastic twin walls in WO3 films act as intrinsic 1D conducting channels.", "STM reveals self-organized nematic-like charge stripes forming periodic potentials along the walls.", "ARPES and transport measurements confirm quantized 1D states and Efros-Shklovskii variable-range hopping.", "This establishes WO3 twin walls as a tunable platform for studying 1D correlated electron physics."]}}, {"title": "A chiral superlattice route to spin-split topological antiferromagnetism", "journal": "Nature", "source": "Gemini", "link": "https://www.nature.com/articles/s41586-026-11073-7", "authors": "Thao Dinh, Mengke Liu, Jian-Xiang Qiu, et al.", "last_authors": "Philip Kim, Su-Yang Xu", "summary": "A chiral superlattice in collinear antiferromagnetic UOTe generates large Berry curvature and spin-polarized currents, enabling anomalous Hall effects and advancing chiral quantum materials for spintronics.", "tier": "B_IMPORTANT_CONDMAT", "score": "9", "reason": "Strong relevance to topological antiferromagnetism, Berry curvature, and anomalous Hall effects in a telluride compound.", "tags": ["topologicalantiferromagnetism", "Berrycurvature", "anomalousHall"], "image": "https://media.springernature.com/m685/springer-static/image/art%3A10.1038%2Fs41586-026-11073-7/MediaObjects/41586_2026_11073_Fig1_HTML.png", "briefing": {"background": "스핀 갈라짐(spin-splitting)은 보통 강자성체에서 나타나지만, 최근에는 넷 자화(net magnetization)가 없는 반강자성체에서도 대칭성 파괴를 통해 스핀 갈라진 밴드를 얻으려는 연구(알터자성 등)가 활발합니다. 이는 베리 곡률(Berry curvature)과 이상 홀 효과(AHE)를 유도할 수 있어 차세대 스핀트로닉스의 핵심입니다.", "motivation": "공선형(collinear) 반강자성체인 UOTe에서 구조적 카이랄 초격자(chiral superlattice)를 통해 큰 베리 곡률과 스핀 분극 전류를 생성할 수 있는지를 탐구하고자 했습니다.", "result": "UOTe 물질 내에 카이랄 초격자 구조를 도입하거나 활용함으로써, 기존 공선형 반강자성체에서는 기대하기 힘든 거대한 베리 곡률을 생성했습니다. 이를 통해 스핀 분극된 전류와 이상 홀 효과(AHE)를 실험적으로 관측하는 데 성공했습니다.", "implication": "구조적 대칭성 조절(카이랄성)이 자성 구조와 결합하여 새로운 위상적 물리 현상을 유도할 수 있음을 보여줍니다. 자화가 없는 반강자성체에서도 효율적인 스핀 정보 처리가 가능함을 입증했습니다.", "novelty": "Philip Kim, Su-Yang Xu 등 위상 물질 분야의 대가들이 참여한 연구로, 텔루라이드(Telluride) 계열 물질(UOTe)에서 '카이랄 초격자'라는 경로로 위상 반강자성 상태를 구현했다는 점이 독창적입니다. 독자가 관심을 갖는 TaNiTe2 등 텔루라이드 연구와도 맥을 같이 합니다.", "unresolved": "카이랄성이 외부 환경에 의해 얼마나 안정적으로 유지되는지, 그리고 다른 반강자성 시스템에도 일반화될 수 있는 설계 원리인지에 대한 추가 검증이 필요합니다.", "future_work": "카이랄리티를 외부 장(field)으로 제어하여 이상 홀 효과를 스위칭하는 연구나, 다른 층상 구조 물질에서의 초격자 형성 및 위상 특성 연구가 이어질 것입니다.", "concepts": [{"term": "Chiral Superlattice (카이랄 초격자)", "why_emerged": "거울 대칭성을 깨뜨려 위상적 특성이나 선택적인 스핀 전송을 유도하기 위해 설계되었습니다.", "origin": "초록 정보만으로는 특정하기 어려움 (최근 꼬임 물질 연구 등에서 확장됨)", "connections": "Berry curvature, Twistronics, 스핀 분극"}, {"term": "Topological Antiferromagnetism (위상 반강자성)", "why_emerged": "반강자성체의 빠른 스핀 동역학적 이점과 위상 물질의 견고한 전송 특성을 결합하기 위해 등장했습니다.", "origin": "최근 10년 이내 집중 연구됨", "connections": "Altermagnetism, Axion insulator, Anomalous Hall effect"}, {"term": "Berry Curvature (베리 곡률)", "why_emerged": "전자 파동함수의 기하학적 위상 효과가 전자의 운동에 미치는 영향을 설명하기 위해 도입되었습니다.", "origin": "Michael Berry (1984)", "connections": "Anomalous Hall effect, Topological insulator, Chern number"}, {"term": "Spin-split bands (스핀 갈라진 밴드)", "why_emerged": "스핀 정보 처리를 위해 자성체 없이도 전자의 업/다운 스핀 에너지를 분리해야 할 필요성에서 중요해졌습니다.", "origin": "전통적으론 Zeeman splitting이나 Rashba effect에서 논의됨", "connections": "Spintronics, Altermagnetism, Spin-orbit coupling"}], "english_summary": ["A chiral superlattice in UOTe induces spin-splitting in a collinear antiferromagnet.", "The symmetry breaking generates large Berry curvature, leading to a significant anomalous Hall effect.", "The study demonstrates a structural route to engineering topological antiferromagnetic states without net magnetization.", "This work opens new possibilities for chiral quantum materials in high-efficiency spintronics."]}}, {"title": "Magnetic order and excitations in the magnetically intercalated van der Waals material Cr1/4−δNbSe2 (δ=0.065)", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/87h3-8cgd", "authors": "Ryota Yamaoka, Hiraku Saito, Yuki Settai, et al.", "last_authors": "Shinichiro Seki, Taro Nakajima", "summary": "${\\mathrm{Cr}}_{1/4−δ}{\\mathrm{NbSe}}_{2}$ $(δ=0.065)$ is a triangular lattice magnet in which magnetic ${\\mathrm{Cr}}^{3+}$ ions are intercalated to form $2a×2a$ triangular superlattices between ${\\mathrm{NbSe}}_{2}$ van der Waals layers stacked along the $c$ axis. By unpolarized and polarized neut…", "tier": "B_IMPORTANT_CONDMAT", "score": "9", "reason": "Directly relevant vdW material study involving NbSe2, a key system for CDW and intercalated magnets.", "tags": ["material", "vanderWaals", "neutronscattering"], "image": "", "briefing": {"background": "반데르발스(vdW) 층상 물질인 NbSe2는 전하 밀도 파(CDW)와 초전도성이 공존하는 대표적인 계이며, 층 사이 공간에 자성 원자를 삽입(intercalation)하여 자성과 전도성을 결합한 새로운 양자 상태를 설계할 수 있습니다.", "motivation": "Cr이 삽입된 Cr1/4-δNbSe2(δ=0.065)에서 Cr3+ 이온이 형성하는 2a x 2a 삼각 격자의 자기 구조와 스핀 여기(excitation) 특성을 비편극 및 편극 중성자 산란을 통해 규명하고자 합니다.", "result": "본 연구는 해당 물질의 자기 정렬 상태를 확인하고, 중성자 산란 실험을 통해 스핀 파(spin wave) 에너지를 측정하여 자기 상호작용의 세기와 기하학적 좌절(frustration)의 영향을 분석했습니다.", "implication": "vdW 층상 구조 내에서 자성 이온의 초격자 형성이 전체 계의 자기적 안정성과 동역학에 미치는 영향을 이해함으로써, 자성 vdW 이종 접합 및 스핀트로닉스 소자 응용을 위한 기초 데이터를 제공합니다.", "novelty": "구독자의 주요 관심사인 NbSe2 기반 시스템이며, 특히 자성 원자가 삽입된 계에서의 스핀 여기를 중성자 산란으로 직접 관측했다는 점이 중요합니다. 이는 CDW와 자성의 상호작용 연구로 확장될 수 있습니다.", "unresolved": "실험에서 관측된 자기 여기 상태와 CDW 상태 간의 구체적인 결합 메커니즘이나 전도성 전자와의 상호작용(kondo effect 등)에 대한 상세한 분석이 추가로 필요합니다.", "future_work": "ARPES를 통한 전자 구조 변화 관측이나, 압력 및 자기장을 이용한 상도표(phase diagram)의 정밀 제어 실험이 기대됩니다.", "concepts": [{"term": "Intercalation (삽입)", "why_emerged": "층상 구조 물질의 층 사이 공간에 이물질을 넣어 물리적/화학적 성질을 튜닝하기 위해 도입되었습니다.", "origin": "초록 정보만으로는 특정하기 어려움 (화학 및 재료 과학의 고전적 기법)", "connections": "그래파이트 층간 화합물, 리튬 이온 배터리, 자기적 vdW 물질"}, {"term": "Neutron Scattering (중성자 산란)", "why_emerged": "물질 내부의 원자 구조뿐만 아니라 중성자의 자기 모멘트를 이용해 자기 구조와 스핀 여기를 직접 관측하기 위해 필요합니다.", "origin": "Clifford Shull 및 Bertram Brockhouse (1994년 노벨상)", "connections": "스핀 파, 마그논(Magnon), 결정 구조 분석"}, {"term": "Triangular Lattice (삼각 격자)", "why_emerged": "기하학적 좌절(frustration)로 인해 단순한 자기 정렬이 어려운 복잡한 양자 자성 상태를 연구하기 위해 중요합니다.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "양자 스핀 액체, 카고메 격자, 좌절 자성체"}, {"term": "Spin Wave (스핀 파)", "why_emerged": "자성체 내에서 스핀 정렬의 집단적인 출렁임(흥분 상태)을 기술하기 위해 등장했습니다.", "origin": "Felix Bloch (1930년)", "connections": "마그논, 자성체 열역학, 중성자 산란"}], "english_summary": ["Investigated the magnetic order and excitations in Cr-intercalated NbSe2 using neutron scattering.", "Identified the formation of a 2a x 2a triangular superlattice of Cr3+ ions between vdW layers.", "Measured spin-wave dispersions to quantify magnetic exchange interactions in the system.", "Provides insight into how magnetic intercalation modifies the physical properties of NbSe2."]}}, {"title": "Protection of Unconventional Superconductivity from Disorder", "journal": "PRL_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/3cn5-hb8z", "authors": "Sofie Castro Holbæk, Morten H. Christensen, Andreas Kreisel, and Brian M. Andersen", "last_authors": "Sofie Castro Holbæk, Morten H. Christensen, Andreas Kreisel, and Brian M. Andersen", "summary": "Several realizations of d -wave superconductivity on the Lieb and kagome lattices exhibit remarkably weak T c -suppression, resembling the behavior of conventional s-wave superconductors.", "tier": "B_IMPORTANT_CONDMAT", "score": "9", "reason": "Directly addresses unconventional superconductivity on kagome lattices, a primary research interest.; demoted from A: broad CM, not direct user/project hit", "tags": ["theory", "kagome", "superconductivity"], "image": "", "briefing": {"background": "일반적으로 비등방성 파동 함수를 갖는 비전통적 초전도체(예: d-wave)는 비자성 불순물이나 결함에 의해 초전도 전이 온도(Tc)가 급격히 낮아지는 것으로 알려져 있습니다.", "motivation": "카고메(Kagome) 및 리브(Lieb) 격자 기반의 일부 d-wave 초전도체들이 불순물에 대해 비정상적으로 강한 내성을 보이는 현상의 근원적 메커니즘을 이론적으로 규명하고자 합니다.", "result": "특정 격자 기하학적 구조(카고메 등)에서 발생하는 전자 구조적 특징이 d-wave 초전도 페어링을 산란으로부터 보호하며, 결과적으로 s-wave 초전도체와 유사한 수준의 불순물 내성을 갖게 됨을 발견했습니다.", "implication": "AV3Sb5와 같은 카고메 금속에서 관측되는 비전통적 초전도 현상이 실제 시료의 무질서(disorder)에도 불구하고 유지될 수 있는 이유를 설명해 줍니다.", "novelty": "구독자의 핵심 관심사인 카고메 금속(AV3Sb5)의 초전도성과 결함 문제를 직접적으로 다루고 있으며, '격자 구조가 초전도칭을 보호한다'는 새로운 관점을 제시합니다.", "unresolved": "제시된 이론적 메커니즘이 실제 AV3Sb5 계열에서 관측되는 CDW와 초전도의 공존 상황에서 어떻게 변하는지에 대한 추가 연구가 필요합니다.", "future_work": "다양한 결함 농도를 가진 카고메 단결정에서의 Tc 변화 실험과 본 이론 모델의 정량적 비교가 수행될 것으로 보입니다.", "concepts": [{"term": "Kagome Lattice (카고메 격자)", "why_emerged": "기하학적 좌절과 특이한 밴드 구조(flat band, Dirac cone)를 통해 강상관 현상을 연구하기 위해 주목받았습니다.", "origin": "Lyo Syozi (1951년 통계역학 모델에서 명명)", "connections": "AV3Sb5, 양자 스핀 액체, 위상 절연체"}, {"term": "d-wave Superconductivity", "why_emerged": "구리 산화물 등 고온 초전도체에서 발견되는 비등방성 페어링 대칭성을 설명하기 위해 확립되었습니다.", "origin": "초록 정보만으로는 특정하기 어려움 (1980-90년대 고온초전도 연구 과정)", "connections": "Cuprates, 비전통적 초전도, Anderson's theorem"}, {"term": "Anderson's Theorem", "why_emerged": "비자성 불순물이 전통적인 s-wave 초전도체의 Tc에 영향을 주지 않음을 설명하기 위해 제안되었습니다.", "origin": "P. W. Anderson (1959년)", "connections": "비등방성 초전도, Abrikosov-Gor'kov 이론"}, {"term": "Disorder Protection (무질서 보호)", "why_emerged": "이론적으로는 파괴되어야 할 초전도 상태가 실제 실험(불순물이 존재하는 시료)에서 안정적으로 유지되는 이유를 찾기 위해 등장했습니다.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "위상적 보호, 로컬라이제이션, 비전통적 초전도"}], "english_summary": ["Theoretically explains the robustness of d-wave superconductivity against disorder on Kagome and Lieb lattices.", "Reveals a mechanism where specific lattice geometries protect unconventional pairing from impurity scattering.", "Mimics the behavior of conventional s-wave superconductors despite the d-wave symmetry.", "Directly relevant to the understanding of superconductivity in kagome metals like AV3Sb5."]}}, {"title": "Role of the Apical Oxygen in Cuprate High-Temperature Superconductors", "journal": "PRL_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/d9cc-jnst", "authors": "Samuel Vadnais, Rémi Duchesne, Kristjan Haule, A.-M. S. Tremblay, David Sénéchal, Benjamin Bacq-Labreuil", "last_authors": "David Sénéchal, Benjamin Bacq-Labreuil", "summary": "Scanning tunneling microscopy measurements exploiting the natural superstructure modulation of the cuprate superconductor ${\\mathrm{Bi}}_{2}{\\mathrm{Sr}}_{2}{\\mathrm{CaCu}}_{2}{\\mathrm{O}}_{8+δ}$ (Bi-2212) have revealed a possible correlation between the Cu-apical-O distance ${δ}_{\\mathrm{api}}$ and…", "tier": "B_IMPORTANT_CONDMAT", "score": "9", "reason": "Direct hit: STM on Bi-2212 cuprates investigating electronic structure and superconductivity.; demoted from A: broad CM, not direct user/project hit", "tags": ["STM", "cuprate", "superconductivity"], "image": "", "briefing": {"background": "구리 산화물(Cuprate) 고온 초전도체에서 Cu-O 평면 외부의 원자, 특히 정점 산소(Apical Oxygen)의 위치는 초전도 특성과 전자 구조를 결정하는 핵심 변수로 알려져 있습니다.", "motivation": "Bi-2212 물질 특유의 초격자 변조(superstructure modulation)를 활용하여 정점 산소 거리(d_api)의 미세한 변화가 국소 s": "Zhiheng Lv, Jiangtao Cai, Dengpan Ma, Yan Xing, Zhifeng Liu", "last_authors": "Yan Xing, Zhifeng Liu", "summary": "The all-electrical realization of highly spin-polarized currents and their efficient conversion into pure spin currents remains a fundamental challenge in spintronics. Here, we report a spin-axis dynamic locking (SADL) effect in altermagnets that pins the high and dynamically robust spin polarizatio…", "tier": "B_IMPORTANT_CONDMAT", "score": "9", "reason": "Altermagnetism is a priority interest; this discusses spintronic observables in these novel materials.; demoted from A: broad CM, not direct user/project hit", "tags": ["topic", "altermagnetism", "spintronics"], "image": "", "briefing": {"background": "알터마그네티즘(Altermagnetism)은 강자성(순자화 존재)과 반강자성(스핀 대칭성 존재)의 특징을 동시에 가지는 새로운 자기 상으로, 실질적인 순자화는 0이면서도 밴드 구조에서는 강한 스핀 분극을 나타내는 제3의 자성 상태입니다.", "motivation": "스핀트로닉스 분야의 핵심 과제인 고분극 스핀 전류의 생성과 이의 효율적인 순수 스핀 전류 변환을 달성하기 위해, 알터마그넷의 고유한 대칭성을 동역학적으로 활용하는 방안을 모색하고자 했습니다.", "result": "알터마그넷 내부에서 스핀 분극이 동역학적으로 견고하게 유지되도록 고정하는 '스핀 축 동역학적 잠금(Spin-Axis Dynamic Locking, SADL)' 효과를 발견하고 보고했습니다.", "implication": "이 효과를 활용하면 외부 섭동에 관계없이 높은 스핀 분극을 유지할 수 있어, 알터마그넷 기반의 고효율 스핀 소자 설계 및 스핀 전류 제어의 물리적 토대를 제공합니다.", "novelty": "최근 독자의 주요 관심사인 알터마그네티즘의 수송 특성과 스핀트로닉스 응용 가능성을 연결했다는 점에서 중요하며, 단순한 정적 밴드 구조 분석을 넘어 동역학적 스핀 거동을 규명했다는 점이 새롭습니다.", "unresolved": "실제 복잡한 다강성 소자 환경에서의 온도 안정성 및 계면 효과에 대한 실험적 검증이 더 필요합니다.", "future_work": "RuO2나 MnTe와 같은 대표적인 알터마그넷 후보 물질에서 SADL 효과를 직접적으로 측정하는 실험이 이어질 것으로 예상됩니다.", "concepts": [{"term": "Altermagnetism", "why_emerged": "강자성과 반강자성의 장점을 결합하여 순자화 없이도 스핀 제어가 가능한 물질을 찾기 위해 등장했습니다.", "origin": "최근 Igor Mazin, Libor Šmejkal 등에 의해 이론적으로 확립되었습니다.", "connections": "반강자성 스핀트로닉스, 베리 곡률(Berry curvature), 비정상 홀 효과와 밀접한 관련이 있습니다."}, {"term": "Spin-Axis Dynamic Locking (SADL)", "why_emerged": "스핀 전류의 동역학적 손실을 방지하고 분극 방향을 안정적으로 유지하기 위한 기제가 필요했습니다.", "origin": "본 논문의 저자진(Zhiheng Lv 등)이 제안했습니다.", "connections": "스핀 궤도 토크(SOT), 스핀 펌핑, 알터마그네틱 이계성(Anisotropy)과 연결됩니다."}], "english_summary": ["Reports the Spin-Axis Dynamic Locking (SADL) effect in altermagnets.", "SADL pins high spin polarization robustly during dynamic processes.", "Provides a mechanism for efficient conversion to pure spin currents.", "Crucial for developing altermagnet-based all-electrical spintronic devices."]}}, {"title": "Emergence of the electronic states driven by quantum charge fluctuations in electron doped cuprate superconductors", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2505.12639", "authors": "Hiroshi Yamaguchi, Yudai Miyai, Yuki. Tsubota, et al.", "last_authors": "Kenya Shimada, Shin-ichiro Ideta", "summary": "The origin of electron-boson interactions is central to understanding high-$T_c$ superconductivity in cuprates. While phonons and magnetic fluctuations are widely considered as candidates for mediating electron pairing, the role of charge fluctuations, one of the fundamental electronic degrees of freedom, remains unclear. Here, we investigate the electronic structure of the electron-doped cuprate using angle-resolved photoemission spectroscopy and angle-resolved and resonant inverse photoemission spectroscopies, which reveal the electronic structure in the occupied and unoccupied states, respectively. From these spectroscopic experiments, we find emergent spectral features on both occupied and unoccupied states that are consistent with excitations driven by quantum charge fluctuations. The results obtained in this study offer direct experimental insight into charge fluctuations in cuprates, thereby paving the way towards clarifying the electronic structure of cuprates to understand the mechanism of high-$T_c$ superconductivity.", "tier": "B_IMPORTANT_CONDMAT", "score": "9", "reason": "Direct ARPES/RIXS study of correlated electron-doped cuprates; highly relevant electronic structure investigation.", "tags": ["ARPES", "cuprate", "superconduct"], "image": "https://arxiv.org/static/browse/0.3.4/images/arxiv-logo-fb.png", "briefing": {"background": "구리 산화물(Cuprates) 고온 초전도체의 쌍 형성 매개체로 포논과 자기 플럭츄에이션이 주로 논의되어 왔으나, 전하 자유도에서 기인하는 '전하 플럭츄에이션'의 역할은 상대적으로 덜 알려져 있습니다.", "motivation": "전자 도핑된 구리 산화물 초전도체에서 양자 전하 플럭츄에이션이 전자 구조에 어떤 구체적인 영향을 미치는지 규명하고자 했습니다.", "result": "ARPES(점유 상태)와 IPES(비점유 상태)를 결합하여 분석한 결과, 전하 플럭츄에이션에 의해 유도된 것으로 해석되는 새로운 스펙트럼 특징들을 점유 및 비점유 에너지 상태 모두에서 확인했습니다.", "implication": "고온 초전도 메커니즘에서 전하 플럭츄에이션이 단순한 배경 현상이 아니라, 초전도 상태 형성에 직접적으로 기여하는 핵심 전자 상태일 수 있음을 시사합니다.", "novelty": "독자의 주 관심사인 ARPES를 활용하여 전자 도핑된 계의 비점유 상태까지 포괄적으로 분석했다는 점과, 전하 플럭츄에이션의 직접적인 실험적 증거를 제시했다는 점이 돋보입니다.", "unresolved": "이러한 전하 유도 상태가 초전도 전이 온도(Tc)의 구체적인 크기에 얼마나 정량적으로 기여하는지는 아직 모호합니다.", "future_work": "도핑 농도에 따른 스펙트럼 변화를 정밀 추적하여 전하 플럭츄에이션의 상도표(Phase diagram) 내 위치를 확정하는 연구가 필요합니다.", "concepts": [{"term": "Quantum Charge Fluctuations", "why_emerged": "강상관 전자계에서 전하 밀도의 시공간적 요동이 물리적 상전이에 미치는 영향을 설명하기 위해 도입되었습니다.", "origin": "초록 정보만으로는 특정하기 어려우나 구리 산화물 연구 초기부터 이론적 가능성이 논의되었습니다.", "connections": "전하 밀도파(CDW), 보존-전자 상호작용, 양자 임계 현상과 연결됩니다."}, {"term": "IPES (Inverse Photoemission Spectroscopy)", "why_emerged": "ARPES가 측정하지 못하는 페르미 준위 상단의 비점유 전자 상태를 관측하기 위해 필요합니다.", "origin": "1970년대 후반에서 1980년대 초반 실험적으로 확립되었습니다.", "connections": "ARPES와 상호보완적이며, 전체 전자 구조(Band structure)를 완성하는 데 필수적입니다."}], "english_summary": ["Investigates electronic states driven by quantum charge fluctuations in electron-doped cuprates.", "Combined ARPES and IPES revealed emergent spectral features in both occupied and unoccupied states.", "Direct experimental insight into the role of charge degrees of freedom in high-Tc systems.", "Suggests charge fluctuations as a key component in understanding the pairing mechanism."]}}, {"title": "Engineering superconductivity on the surface of Weyl semimetals", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2604.26859", "authors": "Riccardo Vocaturo, Mattia Trama", "last_authors": "Riccardo Vocaturo, Mattia Trama", "summary": "Ten years after the experimental discovery of Weyl semimetals, theoretical and experimental work has pointed to the possibility of realizing surface-only superconductivity at relatively high temperatures in these materials. A consensus is developing that this unusual form of superconductivity is supported by surface electronic states unique to Weyl semimetals, known as Fermi arcs. In this work, we show that the topological protection of these exotic states can be exploited to engineer high critical temperatures. Motivated by reports of van Hove singularities on the surface of PtBi$_2$-the first Weyl semimetal in which surface superconductivity was unequivocally linked to its Fermi arcs-we demonstrate how such singularities can be engineered through the deposition of a suitable additional layer. We find that the critical temperature becomes extremely sensitive to the exact value of the chemical potential, and values as large as 20 times the bulk $T_c$ can be achieved. More generally, our results demonstrate how topological protection can be exploited to manipulate surface electronic states, thereby opening experimentally accessible routes toward engineering high-temperature two-dimensional superconductivity and other exotic phases.", "tier": "B_IMPORTANT_CONDMAT", "score": "9", "reason": "Surface superconductivity in Weyl semimetals; highly relevant to user interest in topological materials.", "tags": ["Weyl", "superconduct", "topological"], "image": "https://arxiv.org/html/2604.26859v2/tb_with_cbar.png", "briefing": {"background": "바일 준금속(Weyl Semimetals)은 벌크의 노드뿐만 아니라 표면에 '페르미 아크'라는 특이한 상태를 가집니다. 최근 이 표면 상태에서만 발생하는 초전도 현상이 보고되며 큰 관심을 끌고 있습니다.", "motivation": "PtBi2와 같은 바일 준금속 표면에서 발견된 반 호브 특이점(van Hove singularity)을 인위적으로 조절하여 표면 초전도 전이 온도(Tc)를 극대화할 수 있는지 탐구했습니다.", "result": "추가적인 층(layer) 증착을 통해 표면 전자 구조를 엔지니어링하면, 벌크 Tc보다 최대 20배 높은 표면 초전도 상태를 유도할 수 있음을 이론적으로 보였습니다.", "implication": "위상적으로 보호된 표면 상태를 조절함으로써 고온 2차원 초전도체를 구현할 수 있는 새로운 경로를 제시합니다.", "novelty": "독자의 관심 물질인 PtBi2와 바일 준금속을 다루며, 단순 관측을 넘어 '엔지니어링' 관점에서 Tc를 획기적으로 높일 수 있는 구체적인 전략을 제시했다는 점이 매우 중요합니다.", "unresolved": "실제 실험에서 증착된 층이 바일 표면의 위상적 성질을 파괴하지 않고 유지할 수 있는지에 대한 공정상 한계가 존재합니다.", "future_work": "다양한 물질의 오버레이어(overlayer)를 사용한 PtBi2 표면 ARPES 및 STS 실험을 통해 제안된 Tc 상승 효과를 검증해야 합니다.", "concepts": [{"term": "Fermi Arcs", "why_emerged": "바일 준금속의 벌크 위상 구조를 반영하는 독특한 표면 경계 상태를 설명하기 위해 등장했습니다.", "origin": "Xiangang Wan 등에 의한 이론적 예측 후 TaAs 등에서 실험적으로 확인되었습니다.", "connections": "바일 노드, 벌크-경계 대응성(Bulk-boundary correspondence)과 직결됩니다."}, {"term": "van Hove Singularity (vHs)", "why_emerged": "밴드 구조에서 상태 밀도(DOS)가 발산하는 지점으로, 초전도나 자성 등 다체 현상을 강화시키는 요인으로 중요합니다.", "origin": "Léon van Hove (1953)가 결정 격자에서의 진동 분석을 위해 제안했습니다.", "connections": "상태 밀도(DOS), 고온 초전도, 전하 밀도파(CDW)와 밀접하게 관련됩니다."}], "english_summary": ["Explores engineering surface-only superconductivity in Weyl semimetals like PtBi2.", "Shows that deposition of an additional layer can engineer van Hove singularities on Fermi arcs.", "Predicts a potential increase in surface Tc up to 20 times the bulk value.", "Leverages topological protection to create robust, high-temperature 2D superconducting phases."]}}, {"title": "Magnetic-field-induced detwinning of orientational domains in altermagnet -MnTe: A single-crystal neutron diffraction study", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2610.13444", "authors": "Feihao Pan, Yishui Zhou, Sabreen Hammouda, et al.", "last_authors": "Oscar Fabelo, Yixi Su", "summary": "Altermagnets combine compensated magnetic order with momentum-dependent spin splitting, which makes them promising for future spintronic and magnonic applications, but their macroscopic responses can be strongly reduced by domain averaging. In hexagonal α \\alpha -MnTe, three symmetry-related in-plane Néel-vector orientations and their time-reversal counterparts form six magnetic domain states, complicating both magnetic structure determination and measurements of the chiral magnon response. Using single-crystal neutron diffraction, we show that an in-plane field applied along the [ − 1 , 1 , 0 ] [-1,1,0] direction produces a common magnetic domain orientation that saturates near μ 0 ​ H = 2 \\mu_{0}H=2 T. A constrained refinement of 61 nuclear and magnetic reflections collected at 2 K and 2 T yields 𝐌 | [ 1 , 1 , 0 ] \\mathbf{M}\\parallel[1,1,0] , an ordered moment of 4.62 ​ ( 8 ) ​ μ B 4.62(8)~\\mu_{\\mathrm{B}} per Mn, and an orientational domain population at r A : r B : r C = 0.97 : 0.03 ​ ( 5 ) : 0 r_{A}:r_{B}:r_{C}=0.97:0.03(5):0 that is compatible with a nearly complete alignment of orientational domains. Furthermore, an abnormal behaviour in the temperature dependence of the selected reflections is observed in 60–88 K, its microscopic origin is discussed within the context of possible intrinsic piezomagnetic or magnetoelastic effects. Because unpolarized diffraction neither distinguishes domain repopulation from continuous Néel-vector rotation nor resolves time-reversal antiphase domains, the field-prepared state is a near-single-orientation state rather than a truly single-domain state. This non-contact domain control provides a practical complement to strain and field-cooling approaches for preparing well-defined magnetic states in bulk α \\alpha -MnTe.", "tier": "B_IMPORTANT_CONDMAT", "score": "9", "reason": "Experimental demonstration of field-induced domain control in the prototypical altermagnet alpha-MnTe.", "tags": ["experiment", "altermagnetism", "neutron-diffraction"], "image": "https://arxiv.org/html/2610.13444v1/fig1_v6_compressed.png", "briefing": {"background": "알터마그네틱(Altermagnet)은 상쇄된 자기 모멘트를 가지면서도 운동량 의존적 스핀 분할(momentum-dependent spin splitting)을 나타내는 새로운 자기 위상입니다. 그러나 실제 결정에서는 여러 방향의 자기 도메인이 공존하여 거시적 물리량 측정 시 신호가 상쇄되는 문제가 있습니다.", "motivation": "육방정계 α-MnTe에서 6개의 자기 도메인 상태가 존재하여 자기 구조 분석과 카이랄 마그논 응답 측정에 어려움을 겪고 있는데, 이를 외부 자기장으로 제어할 수 있는지 확인하고자 함.", "result": "단결정 중성자 회절을 통해 [−1,1,0] 방향으로 2T 자기장을 인가했을 때, α-MnTe의 자기 도메인이 거의 단일 배향으로 정렬됨을 확인했습니다.", "implication": "자기 ogy characterized by a symmetry indicator ℤ 4 = 2 \\mathbb{Z}_{4}=2 and a strong topological index ν 0 = 1 \\nu_{0}=1 , together with symmetry-protected fourfold band degeneracies at the nonsymmorphic Brillouin-zone boundary. The Fermi surface exhibits an orbital-dependent crossover from quasi-two-dimensional cylindrical sheets to a corrugated three-dimensional structure along k z k_{z} . A Van Hove saddle point approximately 0.5 eV below the Fermi level along Γ ​ – ​ K \\Gamma\\text{--}K is associated with a neck-disrupting Lifshitz transition and enhanced density of states. Magnetotransport measurements reveal a pronounced twofold angular magnetoresistance, consistent with anisotropic Fermi-surface geometry and open cyclotron orbits. Hall measurements indicate uncompensated, hole-dominated transport, accounting for the absence of extreme magnetoresistance and contributing to the field-orientation-dependent Hall response. These results establish hexagonal TiAs as a platform for exploring the interplay of nonsymmorphic band topology, Van Hove singularities, and anisotropic electronic transport in transition-metal monopnictides.", "tier": "B_IMPORTANT_CONDMAT", "score": "9", "reason": "Strong experimental paper on TiAs topology, Van Hove singularities, and Fermi surface; high interest for electronic structure researchers.", "tags": ["TiAs", "topological-semimetal", "Van-Hove"], "image": "https://arxiv.org/html/2610.12925v1/fig1.png", "briefing": {"background": "전이금속 단일족 화합물(transition-metal monopnictides)은 강한 스핀-궤도 결합과 위상적 밴드 구조를 가지고 있어, 새로운 위상 상태와 수송 현상을 탐구하는 플랫폼으로 주목받고 있습니다.", "motivation": "육방정계 TiAs 단결정을 합성하고, 이 재료가 가진 대칭성 기반 위상 물성, Van Hove 특이점, 자기 수송 특성 간의 상호작용을 규명하고자 함.", "result": "TiAs가 강한 위상 지표를 가진 위상 반금속임을 확인했으며, Γ–K 경로에서 Fermi 준위 아래 0.5eV 지점에 Van Hove 특이점이 존재하여 Lifshitz 전이를 유도함을 발견했습니다.", "implication": "TiAs가 대칭성 보호 밴드 퇴화와 위상적 성질, 이방성 수송 현상을 동시에 관찰할 수 있는 물질임을 확립했습니다.", "novelty": "육방정계 TiAs의 첫 단결정 성장 사례이며, 전자 구조의 이방성(2D/3D 크로스오버)과 위상적 성질을 연결하여 분석했습니다.", logical phases without gating."]}}, {"title": "Crystallographic imperfections and exotic superconductivity of UBe13", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/85bz-sslm", "authors": "Andreas Leithe-Jasper, Markus König, Yusei Shimizu, et al.", "last_authors": "Elena Hassinger, Eteri Svanidze", "summary": "The symmetry of the superconducting gap is related to the symmetry of the crystal structure. In unconventional superconductors, big changes in the critical temperature, critical field, or even the gap structure can happen even for small perturbations of the lattice. In this paper, we use microstructuring to study aluminum-free micro crystals of UBe 13 which are expected to be closer to a “perfect” material than previously studied aluminum-grown single crystals. We compare the effect of minuscule imperfections on the value of the critical temperature and critical field, which, in the case of UBe 13 , has drastic effects, supporting its unconventional nature. We conjecture that this likely arises from the oxidation state of uranium, which is sensitive to its crystallographic environment. Our findings suggest that uranium-based materials provide not only an excellent reservoir of unconventional phenomena, but also a way to identify the gap symmetry of unconventional superconductors.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Studies unconventional superconductivity in a heavy fermion system, a relevant broader interest.", "tags": ["material", "superconductivity", "heavyfermion"], "image": "", "briefing": {"background": "UBe13은 우라늄 기반의 대표적인 중페르미온(heavy fermion) 초전도체로, 비전통적 초전도 현상의 물리적 기전을 이해하는 데 중요한 물질입니다.", "motivation": "전통적인 알루미늄 플럭스(flux) 방식으로 성장한 단결정의 불순물 문제를 해결하고, 더 순수한 마이크로 결정 구조를 통해 UBe13의 고유한 초전도 갭 대칭성을 밝히고자 함.", "result": "미세 가공된 순도 높은 UBe13 결정에서 임계 온도(Tc)와 임계 자기장이 매우 민감하게 변함을 확인하며, 이는 결정 결함과 우라늄의 산화 상태에 기인함을 밝힘.", "implication": "초전도 현상이 격자 환경의 미세한 변화에 극도로 민감하다는 것을 입증하여, 비전통적 초전도체의 갭 대칭성을 결정짓는 요인을 이해하는 데 기여함.", "novelty": "시료의 결정학적 완성도가 물리적 특성에 미치는 영향을 명확히 하여, 향후 다른 비전통적 초전도체 연구에서 시료 준비의 중요성을 강조함.", "unresolved": "우라늄의 산화 상태 변화가 구체적으로 어떠한 방식으로 전자 상호작용에 개입하여 갭 대칭성을 변화시키는지에 대한 미시적 기제는 미해결.", "future_work": "다른 우라늄 기반 중페르미온 물질에 대한 동일한 미세 가공 접근법 적용 및 분광학적 방법(ARPES 등)을 통한 직접적인 갭 대칭성 확인.", "concepts": [{"term": "Heavy fermion", "why_emerged": "f-전자와 전도 전자 사이의 강한 상호작용으로 인해 전자의 유효 질량이 매우 커지는 현상을 설명하기 위해 필요.", "origin": "1970년대 후반 중페르미온 초전도체 발견 시기.", "connections": "Kondo lattice, CeCu2Si2, UBe13."}, {"term": "Unconventional superconductivity", "why_emerged": "BCS 이론으로 설명되지 않는 상호작용에 의한 초전도 현상을 분류하기 위해 등장.", "origin": "구리산화물 고온 초전도 발견 후 확립됨.", "connections": "Symmetry breaking, Gap symmetry."}], "english_summary": ["Investigated crystallographic sensitivity of UBe13 superconductivity.", "Used microstructured samples to minimize defects from flux growth.", "Found critical temperature and field are sensitive to local lattice environment.", "Supports the unconventional nature of superconductivity in uranium-based compounds."]}}, {"title": "Large anomalous Hall effect in α-MnTe thin films grown on SrF2(111)", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/4hdt-17r9", "authors": "Sara Bey, Shelby S. Fields, Nicholas G. Combs, et al.", "last_authors": "Xinyu Liu, Badih A. Assaf", "summary": "α-MnTe is a prototypical altermagnet exhibiting a strong anomalous Hall effect (AHE), despite having a nearly vanishing magnetization. ${\\mathrm{SrF}}_{2}(111)$ has a small lattice mismatch with MnTe and a matching coefficient of thermal expansion; there are, however, no reports on measurements of t…", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Experimental observation of large anomalous Hall effect in a prototypical altermagnet, a key interest.", "tags": ["experiment", "altermagnetism", "anomalous-Hall"], "image": "", "briefing": {"background": "자성 물질 내에서 전자의 스핀 궤도 상호작용과 베리 곡률에 의해 발생하는 변칙 홀 효과(AHE)는 위상 물성과 자성 연구의 핵심입니다. 최근에는 자화값이 거의 0이면서도 홀 효과가 크게 나타나는 '알터마그넷(Altermagnet)' 물질군이 주목받고 있습니다.", "motivation": "반강자성체로 알려진 α-MnTe가 알터마그넷 특성을 가질 가능성이 제기됨에 따라, 이를 박막 형태로 정밀하게 제작하여 AHE 특성을 검증하고자 했습니다.", "result": "SrF2(111) 기판 위에 성장시킨 α-MnTe 박막에서 큰 변칙 홀 효과를 관측했습니다. 이는 물질 내 자화가 상쇄됨에도 불구하고 비자명한 전자 구조적 대칭성으로 인해 큰 홀 응답이 유도됨을 보여줍니다.", "implication": "알터마그넷이 새로운 스핀트로닉스 소자 후보군으로서 실질적인 응용 가능성을 갖추고 있음을 증명하며, 기존의 강자성체 기반 소자를 대체할 새로운 패러다임을 제시합니다.", "novelty": "α-MnTe라는 특정 물질에서 대칭성 기반의 AHE를 실험적으로 확인했다는 점이 중요하며, 사용자의 관심 분야인 자기 위상 물질 및 altermagnetism 연구의 중요한 근거가 됩니다.", "unresolved": "박막 계면에서의 변형이나 결함이 실제 AHE의 크기에 어느 정도 기여하는지에 대한 정밀한 분석이 추가로 필요합니다.", "future_work": "온도 의존성 및 두께 변화에 따른 AHE 특성 변화 연구, 그리고 제1원리 계산을 통한 베리 곡률 분포와의 직접적인 비교 연구가 필요합니다.", "concepts": [{"term": "알터마그넷 (Altermagnet)", "why_emerged": "강자성과 반강자성의 경계에서 새로운 스핀 분할 현상을 설명하기 위해 제안되었습니다.", "origin": "최근 2-3년 내에 이론적으로 정립된 개념입니다.", "connections": "반강자성체, 비자성 금속, 스핀 분할, 베리 곡률."}, {"term": "변칙 홀 효과 (AHE)", "why_emerged": "외부 자기장이 없어도 물질 내부의 자성 또는 비자명한 밴드 구조에 의해 홀 전압이 발생하는 현상을 규명하기 위해 필요했습니다.", "origin": "Edwin Hall (1881년), Karplus와 Luttinger (1954년)가 이론적 토대를 마련했습니다.", "connections": "베리 위상, 위상 밴드 구조, 비자성 위상 물질."}], "english_summary": ["Observed large anomalous Hall effect in α-MnTe thin films on SrF2(111).", "Demonstrates significant electronic transport signatures in an altermagnetic system.", "Supports the role of non-trivial symmetry in generating AHE despite vanishing net magnetization.", "Provides experimental evidence for altermagnetism in thin-film architectures."]}}, {"title": "Net magnetization and inhomogeneous magnetic order in the high-Tc nickelate superconductor Sm1−x−yEuxCayNiO2", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/6285-5rms", "authors": "Alexander J. Grutter, Nurul Fitriyah, Brian B. Maranville, et al.", "last_authors": "Julie A. Borchers, A. Ariando", "summary": "High-temperature and high-magnetic-field-induced reentrant superconductivity has been discovered in the infinite-layer nickelate ${\\ma : "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/h16z-tqcl", "authors": "Xu Zhang", "last_authors": "Xu Zhang", "summary": "Using the determinant Quantum Monte Carlo method, we investigate the interplay among doping, interlayer tunneling, and on-site Hund's coupling in stabilizing superconductivity (SC) in a two-orbital model for the bilayer nickelate ${\\text{La}}_{3}{\\text{Ni}}_{2}{\\text{O}}_{7}$. With realistic dispers…", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Theoretical investigation of superconductivity in La3Ni2O7, a high-priority material class for the user.", "tags": ["theory", "nickelates", "superconductivity"], "image": "", "briefing": {"background": "La3Ni2O7은 상압 초전도 가능성 및 높은 전이 온도로 인해 니켈산염 분야에서 가장 뜨거운 연구 주제 중 하나입니다.", "motivation": "이중층(bilayer) 구조에서 나타나는 초전도성의 미시적 기원, 특히 층간 터널링과 훈트(Hund's) 결합의 역할을 이론적으로 규명하고자 했습니다.", "result": "결정적 양자 몬테카를로(DQMC) 시뮬레이션을 통해, 층간 터널링과 훈트 결합이 상호작용하여 전자 쌍 형성(pairing)을 안정화한다는 것을 보였습니다.", "implication": "La3Ni2O7의 초전도 현상이 강한 전자 상관관계에 기반한 것임을 확증하며, 향후 더 높은 Tc를 달성하기 위한 구조적 변형의 가이드라인을 제공합니다.", "novelty": "시그마(sign) 문제 없이 효율적인 수치 해석을 수행하여, 복잡한 다중 궤도 모델에서 초전도 성립 조건을 제시했다는 점이 학술적으로 가치 있습니다.", "unresolved": "현실적인 격자 왜곡이나 산소 결함이 모델에 완전히 반영되지 않아 실험값과의 정량적 차이가 존재할 수 있습니다.", "future_work": "보다 현실적인 격자 구조를 도입한 전산 모사 연구와 압력 변화에 따른 층간 터널링 강도 변화 분석이 기대됩니다.", "concepts": [{"term": "결정적 양자 몬테카를로 (DQMC)", "why_emerged": "강상관 전자계의 복잡한 다체 문제를 수치적으로 해결하기 위해 개발되었습니다.", "origin": "1980년대 Blankenbecler 등에 의해 제안되었습니다.", "connections": "다체 섭동 이론, 페르미 액체 이론, 전산 물리."}, {"term": "훈트 결합 (Hund's coupling)", "why_emerged": "원자 내 전자 배치에서 스핀 정렬을 설명하는 에너지 항으로, 고체 내 강상관 현상의 핵심 요소입니다.", "origin": "Friedrich Hund(1925년).", "connections": "모트 절연체, 다중 궤도 물리, 스핀 정렬."}], "english_summary": ["Used DQMC to study superconductivity in bilayer La3Ni2O7.", "Identified interplay between interlayer tunneling and Hund's coupling.", "Provides theoretical insight into the pairing mechanism of bilayer nickelates.", "Suggests that st mes noninteger values. We explain this prediction on the basis of the topology of gapless systems, exemplify it on a lattice model, and connect to recent experimental observations of enhanced density of states at step edges in topological metals.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Topological boundary states in metals are highly relevant to topological semimetal electronic structure.", "tags": ["theory", "topologicalmetal", "edgestates"], "image": "", "briefing": {"background": "위상 절연체와 같은 위상 물질에서 벌크-경계 대응 원리는 경계면의 로버스트한 상태를 보장합니다. 일반적인 2차원 천 절연체에서는 경계의 전도도가 정수로 정해지지만, 3차원 위상 금속의 경우 표면의 스텝 엣지(step edge)가 시스템의 전자 구조에 미치는 영향에 대한 연구가 필요합니다.", "motivation": "3차원 위상 금속 표면의 스텝 엣지에서 관찰되는 전도도 특성이 벌크 토폴로지에 의해 어떻게 결정되는지 이론적으로 규명하고자 합니다.", "result": "스텝 엣지에서의 전도도가 벌크에 의해 고정된 특정 값 K(정수가 아닐 수 있음)를 가짐을 증명했습니다. 이는 최근 여러 위상 금속 표면 실험에서 관찰된 스텝 엣지 주변의 상태 밀도 증가 현상을 설명하는 이론적 토대를 제공합니다.", "implication": "위상 금속 표면에서의 전자 전달 특성을 제어하고 해석하는 데 있어 벌크 토폴로지 분석이 핵심적인 지표가 됨을 시사합니다.", "novelty": "기존 정수 기반의 벌크-경계 대응을 일반화하여, 비정수 값을 갖는 물리량이 위상 금속의 기하학적 결함(스텝 엣지)에서 어떻게 나타나는지 정량적으로 예측했습니다.", "unresolved": "실제 실험에서 다양한 표면 오염이나 스텝 엣지의 원자적 거칠기가 전도도 K 값의 로버스트함을 어느 정도까지 유지시킬지에 대한 상세 분석이 추가로 필요합니다.", "future_work": "STM을 통한 국소 전도도 매핑과 이론적 K 값의 직접적인 정량적 비교 연구가 요구됩니다.", "concepts": [{"term": "Bulk-Boundary Correspondence", "why_emerged": "위상 물질의 벌크 밴드 구조가 경계면의 전도성 상태와 어떻게 연결되는지 설명하기 위해 필요했습니다.", "origin": "Hatsugai (1993) 등에 의해 정립되었습니다.", "connections": "위상 절연체, 양자 홀 효과, 와일 금속 연구의 근간이 되는 이론입니다."}, {"term": "Topological Metals", "why_emerged": "밴드 구조의 위상적 비자명성이 금속 상태에서도 어떻게 구현되는지 이해하기 위해 발전했습니다.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "와일/디락 반금속, 위상 절연체와 밀접한 관련이 있습니다."}], "english_summary": ["The paper investigates the conductance of step edges on 3D topological metals.", "Authors prove that the conductance is fixed by bulk topology to a value K, which can be non-integer.", "The theory provides a framework for interpreting experimental observations of DOS enhancement at step edges.", "It generalizes bulk-boundary correspondence to geometric defects in topological systems."]}}, {"title": "Alter-excitons in Altermagnets: Symmetry, Splitting and Dispersion", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2610.12900", "authors": "Yuanfan Xiong, Liangyu Wang, Xuan Wu, Wei Hu, Jinlong Yang", "last_authors": "Wei Hu, Jinlong Yang", "summary": "Magnetism provides a fertile platform for discovering emergent quantum phenomena governed by symmetry. Recent developments of spin-space-group (SSG) theory have revealed altermagnets as a distinct class of nonrelativistic collinear magnets with unconventional spin-dependent electronic structures. Here, we demonstrate that altermagnetic symmetry imposes fundamentally different constraints on electronic and excitonic excitations. Although the quasiparticle and two-body Hamiltonians possess identical SSG symmetries, we find that symmetry-protected degeneracies present in the electronic band structure can be intrinsically lifted in the exciton spectrum at specific momenta. This splitting arises solely from the many-body nature of excitons and does not require spin-orbit coupling or noncollinear magnetic order. Combining symmetry analysis with many-body perturbation theory, we predict a novel class of spin-split excitonic quasiparticles, termed alter-excitons, and reveal their characteristic dispersions in altermagnetic systems. Our results establish excitons as a sensitive probe of hidden spin-space symmetries and uncover a new route toward symmetry-engineered many-body phenomena in collinear magnets.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Relevant theoretical study on altermagnets, directly relating to recent interest in magnetic topological materials.", "tags": ["altermagnet", "theory", "excitons"], "image": "https://arxiv.org/html/2610.12900v1/fig2.png", "briefing": {"background": "알터마그넷(Altermagnet)은 기존 강자성이나 반강자성과는 구별되는 새로운 자기 정렬 상태로, 스핀-공간 군(SSG) 대칭성에 의해 전자 구조에 특이한 분할이 나타납니다. 이러한 대칭성이 다체 문제인 엑시톤(exciton) 거동에 어떤 영향을 미치는지 이해하는 것은 새로운 양자 소자 개발의 핵심입니다.", "motivation": "알터마그넷의 고유한 스핀 대칭성이 엑시톤의 에너지 분산과 스펙트럼에 미치는 영향을 규명하고자 합니다.", "result": "준입자(quasiparticle) 수준에서의 밴드 분할과 달리, 엑시톤은 다체 효과로 인해 특정 운동량에서 추가적인 대칭성 보호 퇴화가 풀리는 '알터-엑시톤(alter-exciton)' 현상을 보임을 발견했습니다.", "implication": "알터마그넷 내에서 스핀-궤도 결합(SOC) 없이도 엑시톤 분할을 조절할 수 있음을 의미하며, 이는 광학적 특성 제어의 새로운 경로를 제시합니다.", "novelty": "알터마그넷의 대칭성이 단순히 전자 구조에만 국한되지 않고, 다체 상태인 엑시톤의 스펙트럼에 고유한 특성을 부여함을 다체 섭동 이론으로 입증했습니다.", "unresolved": "실제 물질의 격자 구조 불완전성이 이 이론적 예측인 엑시톤 분할에 미치는 영향은 아직 평가되지 않았습니다.", "future_work": "알터마그넷 물질에서의 분광학적 실험(예: ARPES 혹은 광학 분광법)을 통한 알터-엑시톤 징후 확인이 필요합니다.", "concepts": [{"term": "Altermagnet", "why_emerged": "스핀-궤도 결합 없이도 스핀-편향된 밴드 구조를 갖는 새로운 형태의 자기 정렬을 분류하기 위해 등장했습니다.", "origin": "最近의 SSG 이론 정립에 따라 체계화되었습니다.", "connections": "강자성, 반강자성, 위상적 자기 물질 연구와 연결됩니다."}, {"term": "Exciton", "why_emerged": "고체 내에서 전자와 정공이 쿨롱 상호작용으로 결합한 준입자를 이해하기 위해 필요했습니다.", "origin": "Frenkel (1931)에 의해 제안되었습니다.", "connections": "반도체 광학, 2D 물질의 다체 물리학 연구의 핵심 개념입니다."}], "english_summary": ["The study examines excitonic behavior in altermagnetic systems using SSG theory.", "Researchers find that altermagnetic symmetry induces unique splitting in exciton spectra.", "The effect, termed 'alter-excitons', is purely a many-body phenomenon distinct from single-particle band splitting.", "This provides a route to engineer many-body phenomena in collinear magnetic systems without spin-orbit coupling."]}}, {"title": "Altermagnetic Control of Charge-4e Superconductivity", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2610.13584", "authors": "Yan-Guang Yue, Jie Lou, Yan Chen", "last_authors": "Jie Lou, Yan Chen", "summary": "We present, to our knowledge, the first theoretical realization of an independent charge-4e phase in a two-dimensional classical array of conventional superconductors coupled through altermagnetic junctions. Tuning the altermagnetic splitting suppresses the leading single-pair tunneling harmonic while retaining strong double-pair coupling, producing a finite charge-4e region between staggered and uniform charge-2e states. Using the complete temperature-dependent microscopic Josephson spectrum, we find short-range ordinary pair correlations alongside algebraic coherence of pairs of Cooper pairs. Berezinskii--Kosterlitz--Thouless scaling and a half-flux response further identify the charge-4e phase. Our results establish altermagnetism as a microscopic means to select between ordinary and composite superconducting coherence.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Theory of unconventional superconductivity controlled by altermagnetism, a core user interest.", "tags": ["topic", "altermagnetism", "superconductivity"], "image": "https://arxiv.org/html/2610.13584v1/fig1_model_phase.png", "briefing": {"background": "일반적인 초전도체는 Cooper 쌍(전하 2e)의 응축으로 발생합니다. 최근에는 더 고차의 응축 현상인 '전하-4e 초전도'에 대한 관심이 높은데, 이를 위해 비전형적인 상호작용을 매개할 수 있는 새로운 물질 시스템이 요구됩니다.", "motivation": "알터마그넷 접합부를 통해 일반적인 전하-2e 초전도를 조절하여, 전하-4e 초전도 위상만 독립적으로 유도할 수 있는지 이론적으로 검증하고자 합니다.", "result": "알터마그넷의 스핀 분할을 조절함으로써 단일 쌍 터널링을 억제하고 이중 쌍 결합을 강조하여 전하-4e 상태가 나타나는 위상을 구현했습니다.", "implication": "알터마그넷을 초전도 회로의 능동적 제어 요소(스위치/필터)로 활용하여, 고차 전하 응축과 같은 이국적 초전도 위상을 엔지니어링할 수 있음을 시사합니다.", "novelty": "알터마그넷의 비전형적인 대칭성 조절(Josephson 접합)이 초전도 코히런스 종류를 제어하는 도구로 작용함을 이론적으로 최초 구현했습니다.", "unresolved": "알터마그넷의 자성 상태가 초전도 유도 과정에서 발생하는 발열이나 산란에 의해 얼마나 영향을 받을지는 추가 검토가 필요합니다.", "future_work": "초전도-알터마그넷-초전도 접합 소자 제작을 통한 전하-4e 초전도 시그니처(반-자속 양자 응답 등) 실험이 기대됩니다.", "concepts": [{"term": "Charge-4e Superconductivity", "why_emerged": "Cooper 쌍보다 더 큰 단위의 전하 응축이 존재하는 양자 상태를 탐구하기 위해 필요했습니다.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "비전형적 초전도, 위상 양자 컴퓨터 연구와 연결됩니다."}, {"term": "Josephson Junction", "why_emerged": "두 초전도체 사이의 위상차로 발생하는 전류 흐름을 제어하기 위해 등장했습니다.", "origin": "Josephson (1962)에 의해 예견되었습니다.", "connections": "SQUID, 양자 비트, 초전도 소자 전반."}], "english_summary": ["Theoretical proposal of charge-4e superconductivity in 2D arrays with altermagnetic junctions.", "Tuning the altermagnetic splitting suppresses single-pair tunneling, favoring double-pair coherence.", "The system demonstrates BKT scaling and characteristic half-flux responses.", "It establishes altermagnetism as a tool for controlling exotic superconducting phases."]}}, {"title": "Anomalous Edge Contrast in Magnetic Force Imaging of 2D Topological Insulators", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2602.18281", "authors": "Timothy W. Carlson, Motahhare Mirhosseini, Allison Swyt, et al.", "last_authors": "Vojislav Krstic, D. L. Carroll", "summary": "Magnetic force imaging (MFM) of 2D topological insulators, such as crystalline plates of Bi2Te3 and Bi2Se3, reveals anomalously large contrast around the plate edges even under ambient imaging conditions. And while there are several known contrast mechanisms in MFM, these cannot easily explain the magnitude of contrast observe for such systems. In this work we use multi-parameter magnetic force phase imaging together with a simple analytical model to suggest that the observed magnetic edge-features can be associated with two sources: a pseudo-Faraday effect in the conductive edge channels of the topological system and magnetic scattering in those channels caused by the proximal, localized field of the tip. These results suggest novel MFM contrast mechanisms unique to topological systems and point to the utility of multi-parameter MFM techniques in studies of topological-material-based circuit elements.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Experimental study of topological insulator edge states using magnetic force imaging.", "tags": ["topological", "STM", "insulator"], "image": "https://arxiv.org/static/browse/0.3.4/images/arxiv-logo-fb.png", "briefing": {"background": "위상 절연체(TI)는 물질 내부와 달리 표면에 위상적으로 보호된 전도성 채널을 가집니다. 이를 실험적으로 검증하기 위해 주사 터널링 현미경(STM)과 같은 공간 분해능을 가진 도구들이 널리 사용됩니다.", "motivation": "Bi2Te3 및 Bi2Se3와 같은 2D 위상 절연체 박막의 가장자리(edge)에서 자기력 현미경(MFM)으로 관측된 비정상적으로 큰 콘트라스트 현상의 물리적 기원을 밝히고자 합니다.", "result": "위상 절연체의 가장자리 채널에서 발생하는 의사 패러데이 효과(pseudo-Faraday effect)와 MFM 팁의 국소 자기장에 의한 자기적 산란이 콘트라스트를 유발함을 모델링을 통해 보였습니다.", "implication": "위상 물질 특유의 새로운 MFM 대비 메커니즘을 규명하였으며, 다중 파라미터 MFM 기술이 향후 위상 물질 기반 소자 연구에 효과적인 도구가 될 것임을 시사합니다.", "novelty": "기존의 알려진 MFM 콘트라스트 메커니즘으로는 설명되지 않았던 위상 물질 가장자리의 강한 신호를 분석하여, 위상 상태와 팁 간의 상호작용을 정량화했다는 점이 중요합니다.", "unresolved": "실험 조건이 상온 대기압 상태라는 점에서 진공/저온 환경에서의 고유한 물리적 상태와 어떤 차이가 있는지에 대한 상세한 분석이 추가로 필요합니다.", "future_work": "진공 환경에서의 저온 MFM 측정을 통해 해당 효과의 온도 의존성을 파악하고, 위상 소자 구현 시 신호 잡음 제어 연구가 기대됩니다.", "concepts": [{"term": "Topological Insulator (TI)", "why_emerged": "내부는 절연체이나 표면은 전도성이 유지되는 새로운 양자 상태를 구현하기 위해 필요.", "origin": "Hasan & Kane (2010) 등에 의해 대중적으로 확립됨.", "connections": "양자 홀 효과, 스핀-궤도 결합, 밴드 역전."}, {"term": "Magnetic Force Microscopy (MFM)", "why_emerged": "나노 스케일에서 시료의 자기적 특성을 공간적으로 분포시켜 시각화하기 위해 필요.", "origin": "Martin & Wickramasinghe (1987).", "connections": "STM, AFM, 강자성 도메인 관측."}, {"term": "Pseudo-Faraday Effect", "why_emerged": "광학적인 패러데이 효과와 유사하게 전도성 채널에서 발생하는 자기적 편향 현상을 설명하기 위해 도입.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "위상 엣지 상태, 자기-광학 효과."}], "english_summary": ["Magnetic force imaging reveals anomalous edge contrast in 2D topological insulators like Bi2Te3.", "The contrast is attributed to the pseudo-Faraday effect and tip-induced magnetic scattering in edge channels.", "A simple analytical model successfully describes these features, which are unique to topological systems.", "Multi-parameter MFM is validated as a powerful tool for investigating topological material-based devices."]}}, {"title": "Anomalous Transverse Thomson Effect", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2605.06299", "authors": "Ying-Fei Zhang, Zhi-Fan Zhang, Zhen-Gang Zhu, Gang Su", "last_authors": "Zhen-Gang Zhu, Gang Su", "summary": "We formulate the anomalous transverse Thomson effect (ATTE), the long-missing Thomson counterpart of the anomalous Hall and anomalous Nernst effects. Its coefficient is not unique but depends on the electrical boundary condition: τ ATTE ( j ) \\tau_{\\rm ATTE}^{(j)} , defined for a spatially uniform imposed current density, and τ ATTE ( E ) \\tau_{\\rm ATTE}^{(E)} , defined for equipotential electrodes. Both are fully determined by the total anomalous Nernst coefficient (ANC) and its temperature dependence, while τ ATTE ( E ) \\tau_{\\rm ATTE}^{(E)} acquires an additional contribution from the temperature dependence of the longitudinal resistivity. This relation is model independent within local linear response and applies to the total ANC regardless of whether its microscopic origin is intrinsic or extrinsic. Using a massive Dirac model for Fe 3 Sn 2 , we show that Berry curvature near the gapped Dirac cones enhances the ANC-related contributions to τ ATTE ( E ) \\tau_{\\rm ATTE}^{(E)} . In the low-temperature limit, both τ ATTE ( j ) / S x ​ y A \\tau_{\\rm ATTE}^{(j)}/S_{xy}^{\\rm A} and τ ATTE ( E ) / S x ​ y A \\tau_{\\rm ATTE}^{(E)}/S_{xy}^{\\rm A} approach a value of three. We further extract τ ATTE ( E ) \\tau_{\\rm ATTE}^{(E)} from reported experimental data for CoS 2 , Co 3 Sn 2 S 2 and CeCrGe 3 ; for CeCrGe 3 it reaches approximately -20 μ ​ V / K \\mu V/K , and we estimate the maximum achievable cold-side heat current density to assess its cooling potential. Because the ATTE can be evaluated directly from existing ANC and longitudinal resistivity data, it is readily testable without additional equipment or measurements.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Transport phenomenon in topological/magnetic materials like Fe3Sn2; directly related to user interest.", "tags": ["Berrycurvature", "anomalousHall", "Dirac"], "image": "https://arxiv.org/html/2605.06299v4/Fig1.png", "briefing": {"background": "열전 현상은 전하 흐름과 열 흐름의 결합을 다룹니다. 자기 물질에서의 이상적인 열전 효과인 비정상 네른스트 효과(ANE) 등은 베리 곡률 xploring correlated phenomena, but the role of orbital degrees of freedom remains largely unexplored. Here, we identify twisted monolayer/bilayer WSe$_2$ as a platform in which displacement-field tuning enables moir\\'e physics to be realized in both the $K$ and $\\Gamma$ valleys. The distinct orbital characters of these valleys give rise to contrasting correlated phases at moir\\'e filling factors $\\nu=1$ and $\\nu=1/3$. At $\\nu=1$, the $K$-valley state is a weak insulator, consistent with an antiferromagnetic state near a van Hove singularity in the intermediate-coupling regime, similar to that observed in twisted bilayer WSe$_2$. In contrast, the $\\Gamma$-valley state exhibits a pronounced Pomeranchuk effect, consistent with proximity to a Mott transition. At $\\nu=1/3$, the $K$ valley hosts a robust generalized Wigner crystal, whereas the $\\Gamma$-valley state lies near the crystallization boundary and again exhibits a Pomeranchuk effect, with localization enhanced by increasing temperature or magnetic field. Our work highlights the importance of orbital character in defining quantum phases in moir\\'e systems, and identify the $\\Gamma$ valley as a promising platform for exploring correlated phenomena near quantum phase transitions, where competing phases and enhanced fluctuations may give rise to unconventional phases.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Investigates valley-dependent moire physics and correlated phases in twisted WSe2 systems.", "tags": ["experiment", "WSe2", "moire"], "image": "https://arxiv.org/html/2607.18212v2/Fig1_v6.png", "briefing": {"background": "모아레 격자는 2D 물질 층을 쌓아 형성하며, 강력한 전자 상관관계와 평탄 밴드(flat band)를 유도하여 다양한 양자 위상을 탐구하는 플랫폼으로 쓰입니다.", "motivation": "기존 연구는 주로 K-밸리에 집중되었으나, 밸리 간의 물리적 차이와 특히 $\\Gamma$-밸리에서의 상관관계 물성이 어떻게 다른지 규명하고자 합니다.", "result": "뒤틀린 단일/이중층 WSe2에서 $\\Gamma$-밸리와 K-밸리 모두 모아레 물성이 구현 가능함을 확인했습니다. 특히 $\\Gamma$-밸리는 포메란추크(Pomeranchuk) 효과 및 Mott 전이 근처의 물리적 특성을 보입니다.", "implication": "궤도 자유도가 양자 위상 결  and single-particle (fermion) dispersion are comparable scales controlled by the electron density, leaving no small parameter for an adiabatic expansion. Moreover, because the magnetic Wigner crystal is not time-reversal invariant, the usual Cooper logarithmic divergence in the pairing susceptibility is absent, so the attraction must exceed a finite threshold for pairing to occur. These unusual features motivate a numerical experiment to see whether the crystal's own vibrations can bind electrons. We obtain the crystalline ground state and its collective mode spectrum within Hartree--Fock and time-dependent Hartree--Fock approximation, and derive the electron--phonon Hamiltonian using the quasiboson approximation. Solving the resulting two-electron problem, we find that phonon-mediated attraction exceeds the pairing threshold, with chiral $p$-wave pairing as the leading instability. Within these approximations, we show that collective modes of a Wigner crystal can indeed favor chiral pairing despite broken time-reversal symmetry. Our results provide an encouraging starting point for developing a full many-body theory to study electronic crystallization and superconductivity.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Connects graphene, STM imaging, and unconventional pairing mechanisms.", "tags": ["material", "graphene", "superconductivity", "STM"], "image": "https://arxiv.org/html/2610.10710v1/fig1_bands.png", "briefing": {"background": "강상관계 전자계에서 전자가 결정 구조를 형성하는 위그너 결정(Wigner crystal)은 전하 밀도 파동(CDW) 및 초전도체와 밀접한 관련이 있습니다. 특히 육방정계 그래핀과 같은 모아레 시스템에서는 전자의 강한 상호작용으로 인해 이러한 결정화 현상이 직접 관측되기도 합니다.", "motivation": "최근 육방정계 그래핀에서 관측된 자기적 위그너 결정과 그 주변에서 나타나는 초전도성 사이의 상관관계를 규명하기 위해, 결정 자체의 집단 들뜸(포논과 유사한 모드)이 쿠퍼 쌍 형성을 매개할 수 있는지 탐구하고자 했습니다.", "result": "하트리-폭 근사를 통해 위그너 결정의 집단 들뜸 모드를 도출하고 이를 전자와 결합시킨 결과, 전자 간의 인력이 결합 임계치를 넘어 카이랄 p-파(chiral p-wave) 초전도 쌍을 형성할 수 있음을 확인했습니다.", "implication": "시간 반전 대칭성이 깨진 자기적 위그너 결정 상태에서도 격자 진동이 아닌 전자 결정 자체의 진동(준보존)만으로도 초전도성을 유도할       item.className = 'concept';
      item.appendChild(textEl('h3', '', c.term || 'Concept'));
      [['왜 생겼나: ', c.why_emerged], ['누가 만들었나: ', c.origin], ['연결되는 흐름: ', c.connections]].forEach(([label, text]) => { if (!text) return; const p = document.createElement('p'); const bold = textEl('b', '', label); p.appendChild(bold); p.append(text); item.appendChild(p); });
      concepts.appendChild(item);
    });
    section.appendChild(concepts);
    briefing.appendChild(section);
  }
  if (b.english_summary && b.english_summary.length) { const section = document.createElement('section'); section.className = 'brief-section wide'; section.appendChild(textEl('h2', '', 'English Summary')); const ul = document.createElement('ul'); b.english_summary.slice(0, 5).forEach(line => ul.appendChild(textEl('li', '', line))); section.appendChild(ul); briefing.appendChild(section); }
  slideEl.appendChild(briefing);
  counterEl.textContent = `${index + 1} / ${slides.length}`;
  prevBtn.disabled = index === 0;
  nextBtn.disabled = index === slides.length - 1;
}
prevBtn.addEventListener('click', () => { index = Math.max(0, index - 1); render(); });
nextBtn.addEventListener('click', () => { index = Math.min(slides.length - 1, index + 1); render(); });
document.addEventListener('keydown', event => { if (event.key === 'ArrowLeft') prevBtn.click(); if (event.key === 'ArrowRight') nextBtn.click(); });
render();
</script>
</body>
</html>
