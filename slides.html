n Correlations", "why_emerged": "강상관 전자계에서 전자들이 특정 자성적 규칙을 가지며 어떻게 상호작용하는지 정량화하기 위해 필요합니다.", "origin": "고체 물리학의 자성 이론에서 확립되었습니다.", "connections": "초전도성(특히 d-wave), 비탄성 중성자 산란, RIXS 등과 직접적으로 연계됩니다."}, {"term": "Nickelates", "why_emerged": "구리 산화물 초전도체와 전자 구조적 유사성을 찾아 초전도성 기원을 탐구하기 위해 주목받고 있습니다.", "origin": "Anisimov et al. (1999)의 초기 이론적 제안이 있습니다.", "connections": "Cuprates, 전자 상관관계, 다중 궤도 시스템."}], "english_summary": ["Studies spin correlations in La3Ni2O7 thin films.", "Addresses the role of magnetic order in high-Tc nickelate superconductors.", "Provides insights into electronic correlations within bilayer nickelate structures.", "Offers critical data for determining the nature of the superconducting pairing mechanism."]}}, {"title": "Non-magnetic ground state in A2WCl6, A = Cs, Rb, K: Face-centered cubic system with spin-orbit-entangled J = 2 states", "journal": "npj_QuantumMaterials", "source": "Gemini", "link": "https://www.nature.com/articles/s41535-026-00945-w", "authors": "Tomohiro Takayama, Kenji Ishii, Sebastian Bette, et al.", "last_authors": "Bernhard Keimer, Hidenori Takagi", "summary": "Non-magnetic ground state in A 2 WCl 6 , A = Cs, Rb, K: Face-centered cubic system with spin-orbit-entangled J = 2 states", "tier": "B_IMPORTANT_CONDMAT", "score": "6", "reason": "Investigates spin-orbit entanglement and electronic structure in complex quantum materials.", "tags": ["spin-orbitcoupling", "quantummaterials", "electronicstructure"], "image": "https://media.springernature.com/m685/springer-static/image/art%3A10.1038%2Fs41535-026-00945-w/MediaObjects/41535_2026_945_Fig1_HTML.png", "briefing": {"background": "4d 및 5d 전이금속 화합물에서 강한 스핀-궤도 결합(SOC)은 전자 상태를 단순한 스핀-궤도 분리 상태가 아닌, J_eff 상태와 같이 얽힌 상태로 만듭니다. 이러한 물질들은 기하학적 좌절(frustration)이나 위상적 특성을 연구하는 핵심 플랫폼입니다.", "motivation": "A2WCl6(A=Cs, Rb, K) 화합물에서 W(텅스텐)의 5d 전자들이 형성하는 J=2 스핀-궤도 얽힘 상태와 그에 따른 비자기적 바닥 상태를 규명하고자 합니다.", "result": "이들 물질이 면심입방(FCC) 구조를 가지며, J=2 상태가 지배적인 비자기적 바닥 상태임을 확인했습니다.", "implication": "스핀-궤도 얽힘이 강한 5d 시스템에서 자기적 질서가 형성되지 않는 메커니즘을 이해하는 데 중요한 통찰을 제공합니다.", "novelty": "Keimer와 Takagi 그룹의 협업으로, 복잡한 전이금속 산화물/염화물 시스템에서의 전자 구조와 스핀 상태를 정확히 정의했다는 점에서 가치가 있습니다.", "unresolved": "이 비자기적 상태가 정확히 어떤 국소적 결정장 효과나 들뜬 상태의 영향으로 유지되는지에 대한 세부적인 동역학은 추가 연구가 필요합니다.", "future_work": "저온에서의 중성자 산란이나 공명 비탄성 X선 산란(RIXS)을 통한 자성 들뜸 상태의 직접적인 관측이 기대됩니다.", "concepts": [{"term": "J=2 spin-orbit-entangled state", "why_emerged": "강한 SOC가 존재하는 5d 전자계에서 스핀과 궤도 각운동량이 강하게 결합하여 단순 스핀 모델로 설명 불가능해지면서 등장함.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "J_eff=1/2 상태와 유사한 맥락이며, Mott 절연체 및 Kitaev 자성체 연구와 연결됨."}], "english_summary": ["Investigated non-magnetic A2WCl6 (A=Cs, Rb, K) compounds.", "Identified spin-orbit-entangled J=2 states in FCC systems.", "Confirms the ground state is non-magnetic despite complex orbital physics.", "Provides a baseline for future studies on 5d-based topological or correlated materials."]}}, {"title": "Tunable quantum metric driven nonlinear valley Hall effect in the PT-symmetric sliding antiferroelectric MoS2 (Phys. Rev. B)", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2611.34116", "authors": "Wen-Xin Jiang, Zhen-Hao Gong, Zhigang Gui, M. Umar Farooq, Li Huang", "last_authors": "M. Umar Farooq, Li Huang", "summary": "The quantum metric, the real part of a quantum geometric tensor, plays an important role in fundamental transport and optical responses of quantum materials. While net quantum metric effects are typically realized by breaking both time-reversal (T) and inversion (P) symmetries, valley-contrast mechanisms enable the probing of quantum geometry in centrosymmetric, nonmagnetic systems, revealing physical signatures beyond Berry curvature. Here, we design a four-layer MoS$_2$ platform that combines sliding antiferroelectric order with strain-induced $C_{3z}$ breaking to realize a quantum metric driven nonlinear valley Hall effect (NVHE) under preserved P and T symmetries. Reversible interlayer sliding (ABBA $\\leftrightarrow$ BAAB) provides nonvolatile electrical control of the valley response. First-principles calculations reveal an outer-layer-dominated NVHE with tunable sign and magnitude. This symmetry-preserving, sliding-tunable strategy activates hidden quantum geometric phenomena in realistic two-dimensional materials and opens a clean pathway for tunable valleytronics and quantum information devices.", "tier": "C_MAYBE", "score": "8", "reason": "Quantum metric driven valley Hall effect in 2D MoS2, relevant to quantum geometry and transport in 2D materials.; tier capped to C: formal/generic theory watch", "tags": ["quantumgeometry", "Berrycurvature", "Halleffect", "valleytronics", "MoS2", "2Dmaterials", "DFT"], "image": "https://arxiv.org/html/2611.34116v1/Fig1_sliding.png", "briefing": {"background": "양자 기하학(Quantum geometry)은 Berry 곡률뿐만 아니라 양자 메트릭(Quantum metric)을 포함하며, 이는 고체 내 전자 상태의 파동함수 구조를 설명하는 핵심 요소입니다. 이는 최근 위상 절연체나 Valleytronics 분야에서 새로운 수송 현상을 예측하는 기반이 됩니다.", "motivation": "반전(P)과 시간반전(T) 대칭성이 유지되는 시스템에서, 층간 슬라이딩(sliding) 제어를 통해 숨겨진 양자 기하학적 효과를 유도하고 이를 비선형 Valley Hall 효과로 관측하고자 합니다.", "result": "4층 MoS2에서 슬라이딩(ABBA-BAAB)을 통해 층간 구조를 제어하고, strain을 가해 C3z 대칭을 깨뜨림으로써 비선형 Valley Hall 효과를 실현했습니다.", "implication": "대칭성을 보존하면서도 외부 제어(슬라이딩)를 통해 위상적 물리량을 조절할 수 있음을 보여주었으며, 이는 차세대 소자 응용 가능성을 제시합니다.", "novelty": "기존의 Berry 곡률 중심 연구에서 나아가 양자 메트릭 기반의 수송 현상을 2D 물질에서 직접 설계하여 제어했다는 점이 핵심입니다.", "unresolved": "실제 실험적 구현 시 계면 불순물이나 적층 오류(stacking fault)가 슬라이딩 효과의 명확한 관측에 미치는 영향은 검증이 필요합니다.", "future_work": "실제 4층 MoS2 소자 제작을 통한 전기적/광학적 수송 측정 연구가 필요합니다.", "concepts": [{"term": "Quantum Metric", "why_emerged": "Bloch 상태 파동함수의 거리 측정을 정의하기 위해 도입된 기하학적 텐서의 실수부.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "Berry 곡률과 함께 위상적 수송 현상, 비선형 응답을 결정짓는 핵심 물리량."}, {"term": "Valley Hall Effect (VHE)", "why_emerged": "전자의 valley 자유도를 이용한 정보 전달 및 제어를 위해 필요.", "origin": "2000년대 후반 그래핀 및 TMDC 연구와 함께 발전.", "connections": "Anomalous Hall Effect(AHE)와 유사하지만, K/K' valley간의 Berry 곡률 분포 차이에 기인함."}], "english_summary": ["Proposed a sliding-tunable 4-layer MoS2 system for nonlinear valley Hall effect.", "Leverages quantum metric in a PT-symmetric and nonmagnetic environment.", "Enables electrical control of valley responses via interlayer stacking configurations.", "Demonstrates a clean pathway for tunable valleytronics and quantum information devices."]}}, {"title": "Coherent parity oscillations in coupled minimal Kitaev chains", "journal": "Nature", "source": "Gemini", "link": "https://www.nature.com/articles/s41586-026-11309-6", "authors": "Francesco Zatelli, Bart Roovers, Nick van Loo, et al.", "last_authors": "Michael Wimmer, Leo P. Kouwenhoven", "summary": "Coherent time-resolved rotations between parity states encoded by four poor man’s Majoranas are demonstrated in two coupled minimal Kitaev chains, providing a foundation for topologically protected qubits in longer chains.", "tier": "C_MAYBE", "score": "7", "reason": "Significant experimental observation of Majorana-related parity oscillations in a coupled topological system.; tier capped to C: formal/generic theory watch", "tags": ["device", "Majorana", "topologicalphysics"], "image": "https://media.springernature.com/m685/springer-static/image/art%3A10.1038%2Fs41586-026-11309-6/MediaObjects/41586_2026_11309_Fig1_HTML.png", "briefing": {"background": "위상 양자 컴퓨팅을 위해 Majorana束縛상태(Majorana bound states)를 이용한 위상적 큐비트를 구현하려는 연구가 지속되고 있습니다. 여러 쇠사슬(chains)을 결합하여 결맞음을 유지하는 것이 핵심 과제입니다.", "motivation": "결합된 최소 Kitaev 쇠사슬(minimal Kitaev chains) 시스템에서 패리티(parity) 상태 간의 결맞은 진동을 실험적으로 관측하고자 합니다.", "result": "4개의 Majorana 모드가 인코딩된 패리티 상태 사이의 결맞은 시간 분해 회전(time-resolved rotation)을 관측했습니다.", "implication": "이는 더 긴 Kitaev 쇠사슬을 이용한 위상적으로 보호된 큐비트 구축의 실험적 타당성을 확보한 중요한 성과입니다.", "novelty": "단순한 Majorana 입자의 존재를 넘어, 패리티 상태를 제어하고 결맞게 조작했다는 점에서 위상 양자 컴퓨팅 구현에 한 걸음 다가갔습니다.", "unresolved": "시스템의 결맞음 시간(coherence time)이 소자로서 충분한지, 노이즈에 대한 위상적 보호 강도가 어느 정도인지에 대한 추가 규명이 필요합니다.", "future_work": "더 긴 쇠사슬을 활용한 확장된 큐비트 연산의 시연 및 양자 게이트 충실도 측정.", "concepts": [{"term": "Majorana fermion", "why_emerged": "입자와 반입자가 동일한 페르미온을 고체 내 quasiparticle 형태로 구현하여 위상적으로 보호된 큐비트를 만들기 위해 제안됨.", "origin": "이탈리아 물리학자 Ettore Majorana에 의해 제안, 고체 물리학 분야는 2000년대 Kitaev에 의해 활성화.", "connections": "Topological superconductors, Kitaev chain model과 직접 연결됨."}, {"term": "Parity oscillations", "why_emerged": "Majorana 큐비트에서 정보 저장의 기반이 되는 패리티 상태의 동역학적 특성을 파악하기 위함.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "결맞은 양자 제어, 위상적 큐비트의 상태 전이와 연결."}], "english_summary": ["Demonstrated coherent parity oscillations in coupled Kitaev chains.", "Used four 'poor man's Majoranas' to encode information.", "Provides an experimental foundation for topologically protected qubits.", "Marks a step towards robust quantum computing architectures."]}}, {"title": "A van der Waals photon-ratchet for enhancing spin defect emission and quantum sensing (Nat. Commun.)", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2602.02256", "authors": "Eveline Mayner, Yaroslav Zhumagulov, Cristian de Giorgio, et al.", "last_authors": "Oleg Yazyev, Aleksandra Radenovic", "summary": "Spin defects in two-dimensional materials are promising platforms for quantum information technologies and nanoscale sensing. The negatively charged boron vacancy (VB-) in hexagonal boron nitride (hBN) is particularly attractive due to its sensitivity to temperature, magnetic fields, and pressure, but its application is limited by intrinsically weak photoluminescence (PL). Here we demonstrate a van der Waals heterostructure that enhances the PL intensity of VB- by up to 45x at 4 Kelvin while preserving compatibility with ultrathin optoelectronic platforms. A type-I band alignment at the PbI2-hBN interface facilitates efficient interlayer coupling to the defect, and strong spectral overlap supports fluorescence resonance energy transfer. Ab initio calculations indicate that this coupling enables a photon-ratcheting mechanism, in which optical absorption in PbI2 generates a nonlinear polarization that drives VB- excitation. This process is consistent with interlayer energy transfer while maintaining minimal electronic and spin hybridization and preserving optically detected magnetic resonance (ODMR) contrast. The heterostructure further exhibits improved sensitivity to external magnetic fields. These results establish a route for the enhancement of defect emission via interlayer optical coupling and introduce a general materials strategy for amplifying weak quantum defect signals in nanomaterials.", "tier": "C_MAYBE", "score": "7", "reason": "Experimental study of vdW heterostructure enhancing spin defect emission for quantum sensing.; tier capped to C: formal/generic theory watch", "tags": ["van_der_Waals", "heterostructure", "2D_materials", "quantum_sensing", "experiment"], "image": "https://arxiv.org/static/browse/0.3.4/images/arxiv-logo-fb.png", "briefing": {"background": "2차원 물질 내의 스핀 결함(spin defect)은 양자 정보 및 나노 스케일 감지 기술의 핵심 플랫폼으로 주목받고 있습니다. 특히 육방정 질화붕소(hBN) 내의 붕소 공공(VB-)은 외부 환경 변화에 민감하지만, 본질적으로 낮은 광발광(PL) 효율이 실제 활용의 큰 걸림돌이었습니다.", "motivation": "본 연구는 외부 층(PbI2)을 쌓아 만든 van der Waals 이종구조를 통해 hBN의 VB- 스핀 결함에서 나오는 약한 광발광 신호를 증폭시켜 양자 센싱의 민감도를 높이고자 했습니다.", "result": "PbI2-hBN 이종구조에서 유형-I 밴드 정렬을 통해 4K 온도에서 VB-의 PL 강도를 최대 45배까지 향상시켰습니다. 이는 PbI2의 광 흡수가 비선형 분극을 생성하여 VB- 들뜸을 유도하는 '광자 래칫(photon-ratchet)' 메커니즘을 통해 이루어집니다.", "implication": "단순한 결함 수준의 조작을 넘어, 이종구조 설계를 통한 광학적 결합 방식이 약한 양자 신호를 효율적으로 제어할 수 있음을 입증했습니다. 이는 향후 양자 센서 소자의 성능 최적화에 중요한 설계 가이드라인을 제공합니다.", "novelty": "전자적/스핀적 혼성화를 최소화하면서도 광학적 에너지 전달 효율만을 극대화한 독창적인 이종구조 전략입니다. 스핀 결함의 물리적 특성을 유지하면서 검출 감도를 비약적으로 높였다는 점이 주목할 만합니다.", "unresolved": "상온에서의 동작 효율성 문제와 다양한 다른 2D 물질 조합에 대한 범용성 검증이 추가로 필요합니다.", "future_work": "PbI2 외의 다른 2D 절연체나 반도체와의 조합을 통한 성능 최적화 연구와, 더 정밀한 양자 감지 응용 실험이 예상됩니다.", "concepts": [{"term": "광자 래칫 (photon-ratchet)", "why_emerged": "비대칭적인 광학적 환경을 이용해 특정 방향으로 에너지를 주입하거나 결함의 들뜸을 비선형적으로 유도하기 위해 고안되었습니다.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "공명 에너지 전달(FRET) 및 비선형 광학 효과와 연결됩니다."}, {"term": "VB- (Boron Vacancy)", "why_emerged": "hBN 격자 내의 결함으로, 스핀 상태가 외부 환경(온도, 자기장)에 민감하게 반응하여 양자 감지기로 활용하기 위해 연구됩니다.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "다이아몬드의 NV 센터와 유사한 고체 상태 스핀 시스템으로 분류됩니다."}], "english_summary": ["Enhanced photoluminescence of boron vacancy (VB-) in hBN using a van der Waals heterostructure.", "PbI2-hBN interface facilitates a photon-ratchet mechanism for efficient optical excitation.", "Demonstrated 45x intensity increase at 4 K while preserving spin-dependent sensor contrast.", "Provides a scalable strategy for amplifying weak quantum signals in 2D nanomaterials."]}}, {"title": "Exciton-driven Floquet engineering from first principles", "journal": "npj_QuantumMaterials", "source": "Gemini", "link": "https://www.nature.com/articles/s41535-026-00951-y", "authors": "Ruipeng Li, Benshu Fan, Umberto De Giovannini, Hannes Hübener, Angel Rubio", "last_authors": "Hannes Hübener, Angel Rubio", "summary": "Exciton-driven Floquet engineering from first principles", "tier": "C_MAYBE", "score": "5", "reason": "Computational study of Floquet engineering; relevant to user interest in real-material Floquet effects.", "tags": ["DFT", "Floquetengineering", "excitons"], "image": "https://media.springernature.com/m685/springer-static/image/art%3A10.1038%2Fs41535-026-00951-y/MediaObjects/41535_2026_951_Fig1_HTML.png", "briefing": {"background": "Floquet 공학은 외부의 주기적인 빛을 사용하여 물질의 전자 구조와 토폴로지 특성을 동적으로 조작하는 기술입니다. 기존에는 주로 일입자 근사 내에서 연구되었으나, 실제 물질에서는 다체 효과가 중요하게 작용합니다.", "motivation": "기존 연구의 한계인 단일 입자 기반 Floquet 이론을 넘어, 실제 물질 내에서 강한 상관관계의 산물인 '엑시톤(exciton)'이 Floquet 공학 과정에 어떤 영향을 미치는지 제1원리 계산을 통해 밝히고자 했습니다.", "result": "엑시톤이 포함된 Floquet 상태의 동역학을 제1원리 계산으로 구현하는 프레임워크를 제시했습니다. 빛과 물질의 상호작용에서 엑시톤 효과가 단순 밴드 구조 변화 이상의 중요한 역할을 함을 보여주었습니다.", "implication": "이론적 계산 단계에서 엑시톤의 영향을 고려함으로써, 실험적으로 관찰되는 Floquet-Bloch 상태의 정확한 해석이 가능해집니다.", "novelty": "DFT와 같은 제1원리 계산법에 엑시톤 동역학을 결합하여 Floquet 공학을 재해석했다는 점이 이론 물리학 측면에서 큰 진전입니다.", "unresolved": "복잡한 강상관 물질에 대한 대규모 계산의 정확도와 실험적인 검증(예: 초고속 ARPES 데이터와의 직접적인 비교)이 여전히 과제로 남아 있습니다.", "future_work": "실제 복잡한 토폴로지 물질(예: 위상 절연체나 카고메 금속)에 이 프레임워크를 적용하여 빛에 의한 상태 변화 예측 연구가 이어질 것입니다.", "concepts": [{"term": "Floquet 공학 (Floquet engineering)", "why_emerged": "물질을 정적인 상태가 아닌 빛으로 구동하여 새로운 양자 위상이나 전자 상태를 생성하기 위해 필요했습니다.", "origin": "Oka와 Kitamura 등이 선구적인 이론을 정립한 것으로 알려짐", "connections": "위상 절연체, Floquet-Weyl 세미메탈 연구와 깊은 관련이 있습니다."}, {"term": "엑시톤 (exciton)", "why_emerged": "고체 내 전자와 정공이 쿨롱 상호작용으로 결합하여 에너지를 전달하거나 물질의 광학적 특성을 결정하기 때문에 중요합니다.", "origin": "Frenkel과 Wannier에 의해 제안됨", "connections": "강상관 전자계의 광학적 응답 및 에너지 손실 연구의 핵심 요소입니다."}], "english_summary": ["Presents a first-principles framework for Floquet engineering with excitonic effects.", "Goes beyond single-particle approximations to incorporate many-body interactions.", "Enables more accurate predictions of Floquet-Bloch state dynamics in real materials.", "Advances theoretical methods for interpreting ultrafast laser-driven phase control."]}}];
let index = 0;
const slideEl = document.getElementById('slide');
const counterEl = document.getElementById('counter');
const prevBtn = document.getElementById('prev');
const nextBtn = document.getElementById('next');
function textEl(tag, className, text) { const el = document.createElement(tag); if (className) el.className = className; el.textContent = text || ''; return el; }
function appendLabeledText(parent, className, label, text) { if (!text) return; const el = document.createElement('p'); el.className = className; const strong = textEl('strong', '', label); el.appendChild(strong); el.append(text); parent.appendChild(el); }
function appendBriefSection(parent, title, text, wide = false) { if (!text) return; const section = document.createElement('section'); section.className = 'brief-section' + (wide ? ' wide' : ''); section.appendChild(textEl('h2', '', title)); section.appendChild(textEl('p', '', text)); parent.appendChild(section); }
function render() {
  slideEl.replaceChildren();
  if (!slides.length) { slideEl.className = 'empty'; slideEl.textContent = 'No papers passed the filters in this run.'; counterEl.textContent = '0 / 0'; prevBtn.disabled = true; nextBtn.disabled = true; return; }
  slideEl.className = 'slide';
  const r = slides[index];
  const b = r.briefing || {};
  const head = document.createElement('div');
  head.className = 'paper-head';
  if (r.image) {
    const figure = document.createElement('figure');
    figure.className = 'figure';
    const img = document.createElement('img');
    img.src = r.image; img.alt = 'Figure or article preview image'; img.loading = 'lazy'; img.referrerPolicy = 'no-referrer'; img.onerror = () => figure.remove();
    figure.appendChild(img);
    figure.appendChild(textEl('figcaption', '', 'Figure / article preview image from the source page'));
    head.appendChild(figure);
  }
  const headText = document.createElement('div');
  headText.className = 'head-text';
  const badges = document.createElement('div');
  badges.className = 'badges';
  if (r.score) badges.appendChild(textEl('span', 'badge score', `${r.score}/10`));
  if (r.tier) badges.appendChild(textEl('span', 'badge', r.tier));
  if (r.journal) badges.appendChild(textEl('span', 'badge', r.journal));
  if (r.source) badges.appendChild(textEl('span', 'badge', r.source));
  headText.appendChild(badges);
  const title = document.createElement('h1');
  if (r.link) { const titleLink = document.createElement('a'); titleLink.href = r.link; titleLink.target = '_blank'; titleLink.rel = 'noopener noreferrer'; titleLink.textContent = r.title || ''; title.appendChild(titleLink); }
  else { title.textContent = r.title || ''; }
  headText.appendChild(title);
  headText.appendChild(textEl('p', 'meta', [r.journal, r.source].filter(Boolean).join(' | ')));
  if (r.last_authors || r.authors) { const authors = document.createElement('p'); authors.className = 'authors'; if (r.last_authors) authors.append('Last authors: ' + r.last_authors); if (r.authors) authors.append((r.last_authors ? ' | ' : '') + 'Authors: ' + r.authors); headText.appendChild(authors); }
  appendLabeledText(headText, 'why', 'Filter reason: ', r.reason);
  if (r.tags && r.tags.length) { const tags = document.createElement('div'); tags.className = 'tags'; r.tags.forEach(tag => tags.appendChild(textEl('span', 'tag', '#' + tag))); headText.appendChild(tags); }
  if (r.link) { const link = document.createElement('a'); link.className = 'link'; link.href = r.link; link.target = '_blank'; link.rel = 'noopener noreferrer'; link.textContent = 'Open paper'; headText.appendChild(link); }
  head.appendChild(headText);
  if (r.summary) { const abstract = document.createElement('p'); abstract.className = 'original-abstract'; const strong = textEl('strong', '', 'Original abstract'); abstract.appendChild(strong); abstract.append(r.summary); head.appendChild(abstract); }
  slideEl.appendChild(head);
  const briefing = document.createElement('div');
  briefing.className = 'briefing';
  appendBriefSection(briefing, 'Background', b.background);
  appendBriefSection(briefing, 'Motivation', b.motivation);
  appendBriefSection(briefing, 'Result', b.result);
  appendBriefSection(briefing, 'Implication', b.implication);
  appendBriefSection(briefing, "Why it's important / Novelty", b.novelty);
  appendBriefSection(briefing, 'Unresolved Questions', b.unresolved);
  appendBriefSection(briefing, 'Expected Future Work', b.future_work);
  if (b.concepts && b.concepts.length) {
    const section = document.createElement('section');
    section.className = 'brief-section wide';
    section.appendChild(textEl('h2', '', 'Concepts / Terms'));
    const concepts = document.createElement('div');
    concepts.className = 'concepts';
    b.concepts.forEach(c => {
      const item = document.createElement('div');
      item.className = 'concept';
      item.appendChild(textEl('h3', '', c.term || 'Concept'));
      [['왜 생겼나: ', c.why_emerged], ['누가 만들었나: ', c.origin], ['연결되는 흐름: ', c.connections]].forEach(([label, text]) => { if (!text) return; const p = document.createElement('p'); const bold = textEl('b', '', label); p.appendChild(bold); p.append(text); item.appendChild(p); });
      concepts.appendChild(item);
    });
    section.appendChild(concepts);
    briefing.appendChild(section);
  }
  if (b.english_summary && b.english_summary.length) { const section = document.createElement('section'); section.className = 'brief-section wide'; section.appendChild(textEl('h2', '', 'English Summary')); const ul = document.createElement('ul'); b.english_summary.slice(0, 5).forEach(line => ul.appendChild(textEl('li', '', line))); section.appendChild(ul); briefing.appendChild(section); }
  slideEl.appendChild(briefing);
  counterEl.textContent = `${index + 1} / ${slides.length}`;
  prevBtn.disabled = index === 0;
  nextBtn.disabled = index === slides.length - 1;
}
prevBtn.addEventListener('click', () => { index = Math.max(0, index - 1); render(); });
nextBtn.addEventListener('click', () => { index = Math.min(slides.length - 1, index + 1); render(); });
document.addEventListener('keydown', event => { if (event.key === 'ArrowLeft') prevBtn.click(); if (event.key === 'ArrowRight') nextBtn.click(); });
render();
</script>
