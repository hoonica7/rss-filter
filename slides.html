<title>Daily Paper Slideshow</title>
<style>
  :root {
    color-scheme: light;
    --bg: #f6f7f4;
    --paper: #ffffff;
    --ink: #111827;
    --muted: #64748b;
    --line: #d8ddd2;
    --accent: #176b87;
    --accent-2: #9a3412;
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; overflow: auto; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: var(--bg); color: var(--ink); }
  .shell { max-width: 1500px; min-height: 100vh; margin: 0 auto; padding: 14px 18px; display: flex; flex-direction: column; }
  .topbar { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 16px; }
  .top-actions { display: flex; align-items: center; gap: 10px; }
  .topbar a, button { border: 1px solid var(--line); border-radius: 8px; background: var(--paper); color: var(--ink); padding: 10px 14px; font-weight: 700; text-decoration: none; cursor: pointer; }
  button.primary { background: var(--accent); border-color: var(--accent); color: white; }
  button:disabled { opacity: 0.45; cursor: not-allowed; }
  .counter { color: var(--muted); font-weight: 700; }
  .slide { min-height: calc(100vh - 82px); background: var(--paper); border: 1px solid var(--line); border-radius: 10px; padding: 18px; box-shadow: 0 18px 42px rgba(15, 23, 42, 0.10); display: grid; grid-template-columns: minmax(310px, 0.86fr) minmax(0, 1.55fr); gap: 18px; overflow: visible; }
  .paper-head { min-width: 0; min-height: 0; overflow: visible; display: flex; flex-direction: column; gap: 12px; }
  .figure { margin: 0; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: #f8fafc; }
  .figure img { display: block; width: 100%; max-height: 41vh; object-fit: contain; background: white; }
  .figure figcaption { padding: 7px 10px; color: var(--muted); font-size: 12px; line-height: 1.3; }
  .head-text { display: flex; flex-direction: column; gap: 9px; min-width: 0; }
  .badges { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .badge { border-radius: 999px; padding: 5px 9px; background: #eef2ff; color: #3730a3; font-size: 12px; font-weight: 800; }
  .score { background: #fee2e2; color: #991b1b; }
  h1 { margin: 0; font-size: 25px; line-height: 1.15; letter-spacing: 0; overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
  h1 a { color: inherit; text-decoration-color: rgba(23, 107, 135, 0.35); text-decoration-thickness: 2px; text-underline-offset: 4px; }
  h1 a:hover { color: var(--accent); text-decoration-color: var(--accent); }
  .meta, .authors, .why, .abstract { font-size: 13px; line-height: 1.45; }
  .meta, .authors { color: var(--muted); }
  .why strong, .abstract strong, .authors strong { color: var(--ink); }
  .authors { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .why { border-left: 4px solid var(--accent-2); padding-left: 10px; color: #374151; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .abstract { border-top: 1px solid var(--line); padding-top: 14px; color: #374151; }
  .original-abstract { border-top: 1px solid var(--line); padding-top: 10px; color: #374151; font-size: 11.5px; line-height: 1.35; overflow-wrap: anywhere; }
  .original-abstract strong { display: block; margin-bottom: 4px; color: var(--ink); }
  .tags { display: flex; flex-wrap: wrap; gap: 8px; }
  .tag { border-radius: 999px; padding: 4px 8px; background: #f1f5f9; color: #475569; font-size: 12px; font-weight: 700; }
  .head-text > .link { display: none; }
  .briefing { min-width: 0; min-height: 0; overflow: visible; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); grid-auto-rows: minmax(0, auto); align-content: start; gap: 11px 18px; border-top: 0; padding-top: 0; }
  .brief-section { min-width: 0; }
  .brief-section.wide { grid-column: 1 / -1; }
  .brief-section h2 { margin: 0 0 4px; font-size: 14px; line-height: 1.22; color: #0f766e; letter-spacing: 0; }
  .brief-section p, .brief-section li { margin: 0; font-size: 12.5px; line-height: 1.42; color: #1f2937; overflow-wrap: anywhere; }
  .brief-section ul { margin: 0; padding-left: 20px; }
  .concepts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 9px 14px; }
  .concept { border-top: 1px solid var(--line); padding-top: 7px; }
  .concept h3 { margin: 0 0 4px; font-size: 13px; color: #7c2d12; letter-spacing: 0; }
  .concept p { margin: 2px 0 0; font-size: 11.5px; line-height: 1.35; color: #374151; overflow-wrap: anywhere; }
  .concept b { color: #111827; }
  .link { color: var(--accent); font-weight: 800; text-decoration: none; }
  .empty { padding: 48px; background: var(--paper); border: 1px solid var(--line); border-radius: 12px; color: var(--muted); }
  @media (max-width: 860px) {
    .shell { padding: 14px; }
    .topbar, .top-actions { align-items: stretch; flex-direction: column; }
    .slide, .briefing, .concepts { grid-template-columns: 1fr; }
    .slide { min-height: auto; overflow: visible; display: grid; }
    h1 { font-size: 28px; }
  }
</style>

<script>
const slides = [{"title": "Nematic and chiral superconductivity emerging within the loop-current phase in kagome metals", "journal": "Nature_Communications", "source": "Gemini", "link": "https://www.nature.com/articles/s41467-026-75259-3", "authors": "Rina Tazai, Youichi Yamakawa, Hiroshi Kontani", "last_authors": "Youichi Yamakawa, Hiroshi Kontani", "summary": "The authors show that the loop-current in the normal state gives rise to nematic chiral d-wave superconductivity in AV3Sb5 kagome metals, further enhanced by bond order. For attractive pairing, weak impurity scattering suppresses the chiral state and restores a conventional s-wave phase, as observed experimentally.", "tier": "A_MUST_READ", "score": "10", "reason": "Directly addresses core research topics: kagome metals, AV3Sb5, nematicity, and loop currents.", "tags": ["material:AV3Sb5", "topic:kagome", "topic:nematicity", "topic:loop-current"], "image": "https://pubads.g.doubleclick.net/gampad/ad?iu=/285/nature_communications/article&sz=728x90&c=-2123496851&t=pos%3Dtop%26type%3Darticle%26artid%3Ds41467-026-75259-3%26doi%3D10.1038/s41467-026-75259-3%26subjmeta%3D1003,119,2792,639,766,995%26kwrd%3DElectronic+properties+and+materials,Superconducting+properties+and+materials,Topological+matter", "briefing": {"background": "카고메 격자 구조를 가진 AV3Sb5 화합물은 전하 밀도파(CDW), 시간 역전 대칭성 깨짐(TRSB), 그리고 비전통적 초전도 현상이 공존하여 양자 물질 연구의 핵심 대상으로 꼽힙니다. 특히 이들 물질에서 나타나는 루프 전류(loop-current) 상태는 비정상 홀 효과 등 독특한 물리량의 기원으로 의심받고 있습니다.", "motivation": "이 논문은 상전도 상태에서 존재하는 루프 전류와 본드 오더(bond order)가 그 아래에서 발생하는 초전도 상태의 대칭성과 성질에 어떤 구체적인 영향을 미치는지 이론적으로 규명하고자 했습니다.", "result": "루프 전류 상태가 존재할 때 네마틱 카이랄 d-파(nematic chiral d-wave) 초전도가 발생하며, 이는 본드 오더에 의해 더욱 강화됨을 보였습니다. 특히 실험에서 관찰되는 일반적인 s-파 상태는 약한 불순물 산란이 카이랄 상태를 억제하면서 복원되는 결과임을 제시했습니다.", "implication": "AV3Sb5 시스템에서 실험마다 초전도 대칭성이 다르게 보고되는 이유를 루프 전류와 불순물 효과의 경쟁 관계로 설명할 수 있는 이론적 토대를 제공합니다.", "novelty": "루프 전류라는 독특한 질서 파라미터가 초전도 페어링에 직접적인 영향을 미친다는 점을 보였으며, 사용자의 관심사인 AV3Sb5의 루프 전류 및 네마틱 특성을 직접적으로 다룹니다.", "unresolved": "이론적 모델에서 가정된 루프 전류의 크기가 실제 물질에서 어느 정도의 강도로 구현되는지에 대한 실험적 확인이 더 필요합니다.", "future_work": "실제 실험에서 불순물 농도를 정밀하게 제어하며 카이랄 d-파에서 s-파로의 전이를 ARPES나 STM으로 확인하는 연구가 기대됩니다.", "concepts": [{"term": "Loop-current phase (루프 전류 상)", "why_emerged": "카고메 격자나 구리 산화물에서 시간 역전 대칭성이 깨진 비자기적 질서를 설명하기 위해 도입되었습니다.", "origin": "C. M. Varma 등이 구리 산화물의 가속 질서(pseudogap)를 설명하기 위해 처음 제안했습니다.", "connections": "시간 역전 대칭성 깨짐(TRSB), 비정상 홀 효과, AV3Sb5의 CDW 상태와 깊은 연관이 있습니다."}, {"term": "Nematic chiral d-wave", "why_emerged": "결정 대칭성을 깨는 네마틱성과 위상학적 성질을 가진 카이랄성이 동시에 나타나는 초전도 상태를 기술하기 위함입니다.", "origin": "초록 정보만으로는 특정하기 어려우나, 다강성 또는 다성분 초전도체 이론에서 파생되었습니다.", "connections": "비전통적 초전도, 위상 초전도체, 카고메 금속의 다중 질서 경쟁과 연결됩니다."}, {"term": "Bond order (결합 질서)", "why_emerged": "전하 밀도가 격자 점이 아닌 격자 사이의 결합(bond)에서 변조되는 현상을 설명하기 위해 사용됩니다.", "origin": "고체 물리학의 밀도파 이론에서 확립되었습니다.", "connections": "전하 밀도파(CDW), 네마틱 질서, AV3Sb5의 육각형 격자 왜곡과 관련이 있습니다."}], "english_summary": ["Theoretical study on the emergence of nematic chiral d-wave superconductivity from the loop-current phase in AV3Sb5.", "Demonstrates that bond order enhances the chiral state while impurity scattering can restore conventional s-wave symmetry.", "Provides a consistent explanation for the experimental observations of differing superconducting gaps in kagome metals."]}}, {"title": "Tunable electron-plasmon coupling in the layered transition metal dichalcogenide ZrSe2−xTex", "journal": "PRB_Recent", "source": "author whitelist", "link": "http://link.aps.org/doi/10.1103/mkfk-8k2t", "authors": "Tongrui Li, Yuzhe Wang, Haoyuan Yan, et al.", "last_authors": "Donglai Feng, Juan Jiang", "summary": "Electron-plasmon coupling, in which carriers are dressed by collective electronic oscillations, represents an important many-body interaction in solids. Here, using angle-resolved photoemission spectroscopy, we report the tunable electron-plasmon coupling in the layered transition metal dichalcogeni…", "tier": "A_MUST_READ", "score": "10", "reason": "author whitelist: Donglai Feng", "tags": ["angle-resolvedphotoemission", "photoemission"], "image": "", "briefing": {"background": "고체 내에서 전자가 집단적인 전자 진동인 플라즈몬과 상호작용하는 '전자-플라즈몬 결합'은 물질의 전자 구조와 광학적 성질을 결정하는 중요한 다체 상호작용(many-body interaction) 중 하나입니다.", "motivation": "층상 전이금속 이칼코게나이드(TMD)인 ZrSe2에 Te를 치환하여 전하 밀도와 밴드 구조를 조절함으로써, 전자-플라즈몬 결합의 세기를 실험적으로 제어하고 관찰하고자 했습니다.", "result": "ARPES 측정을 통해 ZrSe2-xTex 시스템에서 화학적 조성을 바꿈에 따라 전자-플라즈몬 결합의 강도가 튜닝될 수 있음을 확인했습니다. 이는 전자 구조 상의 킹크(kink)나 위성 피크 변화로 나타납니다.", "implication": "TMD 물질의 전자 간 상호작용을 화학적 도핑으로 정밀하게 제어할 수 있음을 보여주며, 이는 향후 플라즈몬 기반 소자 설계에 기여할 수 있습니다.", "novelty": "사용자가 선호하는 Donglai Feng 교수 그룹의 ARPES 연구로, TMD 시스템에서의 다체 상호작용 튜닝 가능성을 명확히 보여주었습니다.", "unresolved": "Te 치환에 따른 무질서(disorder) 효과가 플라즈몬 산란에 미치는 영향에 대한 상세한 분석이 추가로 필요할 수 있습니다.", "future_work": "온도 변화에 따른 결합 상수 변화 측정이나, 극한의 캐리어 농도 영역에서의 플라즈모닉 밴드 구조 변형 연구가 유망합니다.", "concepts": [{"term": "Electron-plasmon coupling", "why_emerged": "단일 전자 모델로 설명되지 않는 물질 내 집단적 여기 현상을 이해하기 위해 필요했습니다.", "origin": "L. Hedin 등의 GW 근사 이론 등에서 다체 효과의 핵심 요소로 다뤄졌습니다.", "connections": "전자-포논 결합, 다체 물리, ARPES의 위성 피크(satellite peak)."}, {"term": "ARPES (각분해 광전자 분광법)", "why_emerged": "물질의 에너지-운동량 공간에서의 전자 구조(밴드 구조)를 직접 관측하기 위해 고안되었습니다.", "origin": "광전 효과를 기반으로 수십 년간 발전해 온 기술입니다.", "connections": "페르미 면 매핑, 밴드 킹크 분석, 초전도 갭 측정."}, {"term": "TMD (전이금속 이칼코게나이드)", "why_emerged": "그래핀과 유사한 2차원 층상 구조이면서도 다양한 밴드갭과 물리적 성질을 가져 차세대 소자 물질로 각광받았습니다.", "origin": "자연계에 존재하는 MoS2 등의 층상 물질 연구에서 시작되었습니다.", "connections": "2차원 물질, 밸리 트로닉스, 층간 반데르발스 결합."}], "english_summary": ["ARPES study on tunable electron-plasmon coupling in ZrSe2-xTex layered semiconductors.", "Demonstrates chemical control of many-body interactions through Te substitution.", "Led by the prominent group of Donglai Feng, emphasizing electronic structure engineering in TMDs."]}}, {"title": "Quasiparticle interference as a tool to study quantum materials", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2607.22487", "authors": "Luke C. Rhodes, Yuhki Kohsaka, Tetsuo Hanaguri, Carolina de Almeida Marques, Peter Wahl", "last_authors": "Carolina de Almeida Marques, Peter Wahl", "summary": "To understand the properties of quantum materials a detailed knowledge of the material's low energy electronic structure is key. Details of the electronic structure drive the ground state through electronic instabilities, electronic correlation effects, new electronic orders or just the absence of electronic states near the Fermi energy - making a realistic and detailed understanding crucial to be able to control and design properties of quantum materials. The past 25 years have seen a significant improvement in experimental techniques to observe the true electronic structure, in particular in techniques such as Angle resolved photoemission spectroscopy (ARPES) where energy resolutions of 2meV are routinely achievable now, which however is limited to zero magnetic field and only provides information about the occupied states. Scanning tunneling microscopy (STM) achieves a significantly better energy resolution <100${\\mu}$eV and can operate at temperatures well below 50mK and in magnetic fields. While per se a real-space technique, by imaging quasiparticle interference (QPI) STM can also provide information about the electronic structure. This technique has been used over the past decades to study a wide range of quantum materials to understand correlated electron behaviour. Recent theoretical progress now enables routine modelling of QPI, a key requirement to interpret the complex data. Here, we review the principles of QPI, its origin, experimental detection, and the physical insight gained from the study of QPI and possible future directions for this technique.", "tier": "A_MUST_READ", "score": "10", "reason": "Direct hit: review of QPI using STM for electronic structure, mentioning ARPES.", "tags": ["STM", "ARPES", "electronicstructure", "quantummaterials", "methodology"], "image": "https://arxiv.org/static/browse/0.3.4/images/arxiv-logo-fb.png", "briefing": {"background": "양자 물질의 성질을 결정하는 핵심은 낮은 에너지 영역의 전자 구조입니다. 이를 연구하기 위해 ARPES가 널리 쓰이지만, 자기장 환경에서의 제약과 점유된 상태만 측정 가능하다는 한계가 있습니다.", "motivation": "주사 터널링 현미경(STM)의 준입자 간섭(QPI) 기술이 어떻게 ARPES의 한계를 보완하고, 양자 물질의 복잡한 전자 구조를 운동량 공간에서 분석하는 도구로 발전했는지 리뷰하고자 합니다.", "result": "지난 25년간 QPI 기술의 발전 과정을 정리하고, 특히 최근의 이론적 진보가 복잡한 QPI 데이터를 정밀하게 모델링하여 정량적인 정보를 추출할 수 있게 되었음을 강조했습니다.", "implication": "QPI는 이제 극저온, 고자기장 환경에서 비점유 상태(unoccupied states)까지 포함한 전체 전자 구조를 파악할 수 있는 필수적인 표준 도구로 자리 잡았습니다.", "novelty": "STM과 ARPES의 상호보완적 관계를 다루며, 사용자의 주 관심사인 QPI를 이용한 전자 구조 분석 방법론의 최신 동향을 총망라했습니다.", "unresolved": "다중 밴드 시스템에서 산란 경로가 복잡해질 때 각각의 기여를 완벽하게 분리해내는 해석적 난제는 여전히 존재합니다.", "future_work": "더 높은 에너지 분해능과 시간 분해능을 결합한 QPI 기술, 그리고 기계 학습을 이용한 데이터 해석 자동화 등이 향후 방향으로 제시됩니다.", "concepts": [{"term": "QPI (Quasiparticle Interference)", "why_emerged": "실공간 측정 장비인 STM으로 운동량 공간의 정보(밴드 구조)를 얻기 위해 등장했습니다.", "origin": "Crommie, Lutz, Eigler 등이 구리 표면의 전자 정재파를 관찰하며 시작되었습니다.", "connections": "푸리에 변환 STM (FT-STM), 밴드 구조, 산란 행렬."}, {"term": "Scattering wave vector (q-vector)", "why_emerged": "불순물에 의해 산란된 전자들이 간섭하여 만드는 무늬의 주기성을 설명하기 위해 필요합니다.", "origin": "브래그 회절 등 산란 이론의 기본 개념에서 파생되었습니다.", "connections": "페르미 면의 중첩(nesting), 조인트 밀도 상태(JDOS)."}, {"term": "Unoccupied states (비점유 상태)", "why_emerged": "ARPES로는 볼 수 없는 페르미 준위 위의 전자 구조를 알아야 여기 상태나 전도 기작을 이해할 수 있기 때문입니다.", "origin": "양자 역학적 상태 점유 이론에서 기원합니다.", "connections": "역광전자 분광법(IPES), 터널링 분광법(STS)."}], "english_summary": ["Comprehensive review of Quasiparticle Interference (QPI) as a probe for electronic structure in quantum materials.", "Highlights the advantages of STM-based QPI over ARPES, including magnetic field compatibility and access to unoccupied states.", "Discusses recent theoretical advances that allow for routine and precise modeling of complex QPI data."]}}, {"title": "Direct evidence of light-induced phase-fluctuations in cuprates via time-resolved ARPES", "journal": "npj_QuantumMaterials", "source": "keyword", "link": "https://www.nature.com/articles/s41535-026-00919-y", "authors": "D. Armanno, F. Goto, J.-M. Parent, et al.", "last_authors": "N. Gauthier, F. Boschini", "summary": "Direct evidence of light-induced phase-fluctuations in cuprates via time-resolved ARPES", "tier": "A_MUST_READ", "score": "10", "reason": "title strong match: ARPES", "tags": ["ARPES", "cuprate"], "image": "https://pubads.g.doubleclick.net/gampad/ad?iu=/285/npjquantmats.nature.com/article&sz=728x90&c=-1320447400&t=pos%3Dtop%26type%3Darticle%26artid%3Ds41535-026-00919-y%26doi%3D10.1038/s41535-026-00919-y%26subjmeta%3D301,639,766%26kwrd%3DMaterials+science,Physics", "briefing": {"background": "고온 초전도체인 큐프레이트(cuprates)에서 초전도 상태는 전하 캐리어의 페어링뿐만 아니라, 이들의 위상(phase)이 결맞음(coherence)을 유지하는 것이 매우 중요합니다. 평형 상태에서의 위상 요동은 초전도 전이 온도와 밀접하게 관련되어 있습니다.", "motivation": "외부 광원을 이용한 들뜸(photo-excitation)이 큐프레이트의 초전도 질서 파라미터의 위상에 어떤 동역학적 영향을 미치는지 시간 분해 ARPES를 통해 직접적으로 관찰하고자 합니다.", "result": "광 유도에 의한 위상 요동(phase-fluctuations)이 큐프레이트 전자 구조 내에서 직접적으로 관측되었습니다.", "implication": "초전도 상태의 결맞음이 빛에 의해 어떻게 파괴되거나 조절될 수 있는지에 대한 메커니즘을 규명하며, 이는 비평형 상태에서의 양자 물질 제어 연구에 중요한 단서를 제공합니다.", "novelty": "시간 분해 ARPES라는 강력한 도구를 사용하여 큐프레이트의 초전도 위상 물리학을 직접 시각화했다는 점이 귀하의 ARPES 연구 관심사와 깊게 연관됩니다.", "unresolved": "이러한 위상 요동이 초전도성의 붕괴와 정확히 어떤 상관관계를 갖는지, 그리고 다른 큐프레이트 물질에서도 보편적인지 확인이 필요합니다.", "future_work": "위상 요동의 수명과 회복 속도를 조절하여 광학적 스위칭 소자 가능성을 타진하거나, 다양한 도핑 수준에서의 비교 연구가 예상됩니다.", "concepts": [{"term": "Time-resolved ARPES", "why_emerged": "물질의 들뜬 상태를 펨토초 단위로 추적하여 전자 구조의 동역학을 이해하기 위함", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "평형 ARPES, 초고속 분광학"}, {"term": "Phase-fluctuations", "why_emerged": "고온 초전도체에서 초전도 전이 온도 이상에서도 살아남는 페어링의 기원이나 위상 결맞음 소멸 연구를 위해 필요", "origin": "Emery, Kivelson (1995)", "connections": "Berezinskii-Kosterlitz-Thouless 전이"}], "english_summary": ["Light-induced phase fluctuations are directly observed in cuprates.", "Time-resolved ARPES provides evidence of coherence disruption.", "This study clarifies the dynamical nature of 표준적 도구가 될 수 있습니다.", "novelty": "복잡한 위상 물질이나 전이 금속 화합물 연구에 필수적인 궤도 정렬을 직접적으로 분리하여 시각화했다는 점에서 ARPES와 같은 분광학 연구자에게 중요한 방법론적 통찰을 제공합니다.", "unresolved": "다양한 물질군으로의 범용성 및 내부(bulk) 궤도와의 구체적인 상관관계에 대해서는 추가적인 검증이 필요합니다.", "future_work": "다른 5d 전이 금속 화합물에 이 방법론을 적용하여 궤도 정렬이 초전도성이나 위상 특성에 미치는 영향을 규명할 예정입니다.", "concepts": [{"term": "궤도 정렬", "why_emerged": "전자의 궤도 자유도가 자성이나 격자 구조를 결정하는 숨겨진 변수임이 드러나면서 필요해졌습니다.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "Jahn-Teller 왜곡, 네마틱 상전이"}], "english_summary": ["The study identifies 5d orbital order in an intermetallic compound.", "Researchers isolate the orbital order from lattice and magnetic effects.", "Electronic band structure signatures and real-space fingerprints are revealed.", "The results offer a robust method to observe orbital ordering in correlated systems."]}}, {"title": "Coupled-cluster approach to vibronic effects in resonant inelastic x-ray scattering of quantum materials: Application to a 5d1 rhenium oxide", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/j2fd-szjx", "authors": "Teruki Matsuzaki, Liviu F. Chibotaru, Maristella Alessio, Naoya Iwahara", "last_authors": "Maristella Alessio, Naoya Iwahara", "summary": "First-principles analysis of the spectroscopic signatures of correlated quantum materials poses significant challenges due to the interplay between spin-orbit and vibronic couplings, as well as the need to describe both dynamic and static electron correlation to reach decent accuracy. In this work, …", "tier": "B_IMPORTANT_CONDMAT", "score": "9", "reason": "Direct focus on RIXS methodology for electronic structure of correlated 5d quantum materials.; demoted from A: broad CM, not direct user/project hit", "tags": ["method", "Re-oxide", "RIXS"], "image": "", "briefing": {"background": "강상관 양자 물질에서 5d 전이 금속 화합물은 강한 스핀-궤도 결합과 진동(vibronic) 효과가 공존하여 해석이 어렵습니다. RIXS는 이를 관측하는 강력한 수단이지만, 이론적 모델링이 매우 복잡합니다.", "motivation": "전통적인 방법론으로는 스핀-궤도 결합과 진동 효과를 동시에 정밀하게 다루기 어려워, 이를 해결하기 위한 새로운 계산 프레임워크가 필요했습니다.", "result": "결합-클러스터(coupled-cluster) 접근법을 활용하여 5d1 레늄 산화물의 RIXS 스펙트럼 내 진동 효과를 성공적으로 해석해냈습니다.", "implication": "5d 금속 산화물 연구의 이론적 정확도를 한 단계 높였으며, 향후 RIXS 데이터를 기반으로 한 물질의 미시적 전자 상태 분석에 큰 기여를 할 것으로 보입니다.", "novelty": "강상관 물질의 RIXS 스펙트럼에서 진동 효과를 다루는 계산법의 정밀도를 개선함으로써, RIXS 데이터를 해석하는 데 있어 훨씬 더 정교한 분석 모델을 제공합니다.", "unresolved": "계산 복잡도로 인해 더 큰 시스템으로 확장하는 데 한계가 있으며, 다른 5d 시스템으로의 적용성 확인이 필요합니다.", "future_work": "다양한 5d 및 4d 전이 금속 시스템에 대한 체계적인 스펙트럼 해석 도구로 발전시킬 계획입니다.", "concepts": [{"term": "RIXS", "why_emerged": "물질 내부의 전하, 스핀, 궤도 들뜸을 동시에 에너지와 운동량 의존성으로 확인하기 위해 발전했습니다.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "ARPES, 중성자 산란"}, {"term": "진동 결합(Vibronic coupling)", "why_emerged": "전자와 격자 자유도의 상호작용이 전자 구조에 미치는 영향을 설명하기 위해 도입되었습니다.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "Jahn-Teller 효과, 폴라론"}], "english_summary": ["A new coupled-cluster approach is developed for RIXS analysis.", "The method addresses the interplay between spin-orbit and vibronic couplings.", "Applied to a 5d1 rhenium oxide to demonstrate spectroscopic accuracy.", "Significantly improves theoretical modeling for correlated quantum materials."]}}, {"title": "Light-induced parity anomaly and topological phase transitions in the antiferromagnetic topological insulator MnBi2Te4", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/y5s3-ndym", "authors": "Jiayan Zhang, Yu Wang, Yanxia Xing", "last_authors": "Yu Wang, Yanxia Xing", "summary": "The utilization of periodic driving to control nonequilibrium topological phases has garnered increasing attention in condensed matter physics. In this work, within the high-frequency limit of Floquet theory, we investigate the effects of circularly polarized light (CPL) on the topological propertie…", "tier": "B_IMPORTANT_CONDMAT", "score": "9", "reason": "Directly addresses Floquet engineering of topological phases in the magnetic TI MnBi2Te4.; demoted from A: broad CM, not direct user/project hit", "tags": ["material", "MnBi2Te4", "Floquet"], "image": "", "briefing": {"background": "자기 위상 절연체는 자기적 정렬과 위상적 특성이 공존하여 흥미로운 물성을 보입니다. MnBi2Te4는 그 대표적인 물질로, 외부 자극을 통한 위상 상태 제어가 핵심 연구 주제입니다.", "motivation": "원형 편광된 빛(CPL)을 이용해 비평형 상태에서 MnBi2Te4의 위상학적 특성을 얼마나 효과적으로 조절할 수 있는지 이론적으로 탐구하고자 합니다.", "result": "플로케 이론을 통해 빛에 의한 패리티 이상(parity anomaly) 현상을 확인하고, 이를 통해 위상 상전이를 유도할 수 있음을 보였습니다.", "implication": "빛을 통해 위상적 성질을 능동적으로 제어할 수 있는 가능성을 제시하며, 향후 광소자 기반 위상 물질 연구의 토대가 됩니다.", "novelty": "MnBi2Te4라는 구체적인 물질 시스템에서 플로케 공학을 통한 위상 상전이를 다룸으로써, 실제 실험적 구현 가능성을 높였다는 점이 주목할 만합니다.", "unresolved": "이론적 결과가 실제 극저온 및 고강도 레이저 조건에서 얼마나 안정적으로 유지될지는 미지수입니다.", "future_work": "시간 분해 ARPES와 같은 실제 실험 연구를 통해 이러한 이론적 예측의 실시간 관측이 기대됩니다.", "concepts": [{"term": "플로케 공학", "why_emerged": "주기적인 외부 자극을 이용해 평형 상태에서는 존재하지 않는 새로운 물질의 위상 상태를 만들기 위해 필요했습니다.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "플로케 위상 절연체, 비평형 통계역학"}, {"term": "패리티 이상", "why_emerged": "양자장론에서 위상적 보존량이 비정상적으로 깨지는 현상을 설명하기 위해 도입되었습니다.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "위상 절연체, 아노말리 홀 효과"}], "english_summary": ["The study investigates Floquet engineering in MnBi2Te4.", "Circularly polarized light is used to manipulate topological properties.", "Parity anomaly and phase transitions are predicted under high-frequency driving.", "Demonstrates light-induced topological control in magnetic insulators."]}}, {"title": "Pressure tuning of electronic correlations and flat bands in CsCr3Sb5", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/pqbc-87xb", "authors": "Maria Chatzieleftheriou, Jonas B. Profe, Ying Li, Roser Valentí", "last_authors": "Ying Li, Roser Valentí", "summary": "${\\mathrm{CsCr}}_{3}{\\mathrm{Sb}}_{5}$ is a newly identified strongly correlated kagome superconductor, characterized by non-Fermi-liquid behavior at elevated temperatures and intertwined charge and spin density wave order below ${T}_{\\text{DW}}≈54\\phantom{\\rule{0.222222em}{0ex}}\\mathrm{K}$. Under e…", "tier Order in URhSn", "journal": "PRL_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/1vjx-4jfv", "authors": "Y. Tokunaga, T. Ishitobi, H. Sakai, S. Kambe, H. Harima, A. Nakamura, A. Maurya, D. Li, Y. Homma, F. Honda, D. Aoki, and Y. Shimizu", "last_authors": "Y. Homma, F. Honda, D. Aoki, and Y. Shimizu", "summary": "The first direct evidence of spontaneous electronic chiral order in URhSn, a strongly correlated material without an inherently chiral lattice structure, fundamentally challenges the prevailing notion that electronic chirality requires a chiral crystal framework.", "tier": "B_IMPORTANT_CONDMAT", "score": "9", "reason": "Direct experimental evidence for spontaneous electronic chiral order in a correlated material.; demoted from A: broad CM, not direct user/project hit", "tags": ["stronglycorrelated", "electronicorder", "NMR"], "image": "", "briefing": {"background": "전자의 자발적 카이랄 질서(chiral order)는 결정 구조 자체의 비대칭성 없이 나타나는 현상으로, 전자계의 숨겨진 위상학적 질서를 이해하는 데 매우 중요한 과제입니다.", "motivation": "기존에는 전자적 카이랄성이 카이랄 결정 구조에서만 가능하다고 생각되었으나, URhSn과 같은 강상관 물질에서 이를 깨는 실험적 증거를 찾고자 했습니다.", "result": "NMR 측정 결과, 결정 구조가 비카이랄함에도 불구하고 전자의 자발적인 카이랄 질서가 형성됨을 증명했습니다.", "implication": "전자적 카이랄성이 격자 대칭성과 무관하게 다체 상호작용에 의해 발현될 수 있음을 시사하며, 이는 위상학적 물질 연구의 범위를 확장합니다.", "novelty": "결정 구조적 제약 없이 전자계 자체의 자유도에 의한 카이랄성 발현을 직접 입증했다는 점이 핵심이며, 루프 전류나 시간 반전 대칭 깨짐(TRSB) 관련 연구자에게 매우 흥미로운 발견입니다.", "unresolved": "이러한 카이랄 질서의 구체적인 미시적 모델(예: 궤도 루프 전류의 패턴 등)과 위상학적 보호 기작은 아직 규명되지 않았습니다.", "future_work": "카이랄 질서의 상세한 대칭성 분석을 위한 편광 분해 측정이나 RIXS를 통한 자기 구조 관찰이 필요합니다.", "concepts": [{"term": "Spontaneous Chiral Order", "why_emerged": "격자의 카이랄성 없이도 전자 상태의 위상학적 비대칭성이 나타나는 현상을 설명하기 위해 제기되었습니다.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "Loop currents, time-reversal symmetry breaking, Weyl semimetals."}, {"term": "NMR (Nuclear Magnetic Resonance)", "why_emerged": "국소적인 자기 환경과 전자 밀도의 분포를 정밀하게 탐침하기 위해 발전했습니다.", "origin": "Isidor Isaac Rabi에 의해 처음 관측됨.", "connections": "Hyperfine interactions, spin susceptibility, local symmetry probe."}], "english_summary": ["URhSn provides the first direct evidence of spontaneous electronic chiral order.", "The observation contradicts the paradigm that electronic chirality requires a chiral crystal lattice.", "NMR measurements confirm the emergence of this order in a non-chiral structure.", "This challenges current understanding of electronic order in strongly correlated systems."]}}, {"title": "Charge-Density-Wave Phase Transitions in Monolayer 1T-TaS2 from Universal Machine Learning Molecular Dynamics", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2607.22316", "authors": "Valentina Nesterova, Tribhuwan Pandey, Tom Berlijn, Fariborz Kargar, Lucas Lindsay, Konstantin Klyukin", "last_authors": "Lucas Lindsay, Konstantin Klyukin", "summary": "Charge-density-wave (CDW) phases in 1T transition-metal dichalcogenides arise from strong electron-phonon coupling and accompanying lattice instabilities. Capturing their temperature-dependent structural evolution using conventional first-principles molecular dynamics (MD) remains challenging because of the large supercells and extensive finite-temperature sampling required. Here, we combine density functional theory (DFT), universal machine-learning interatomic potentials (MLIPs), MD, and temperature-dependent effective potential phonon calculations to investigate the structural and vibrational signatures of CDW transitions in monolayer 1T-TaS2. Benchmarking against DFT displacement energies identifies UMA-s-1p1 universal machine learning potentials with sufficient accuracy for subsequent finite-temperature simulations. Our results show that large-scale MD simulations reproduce the experimentally observed phase transition sequence from the low-temperature Star-of-David (SoD) distorted structure to the high-temperature primitive hexagonal structure, as quantified by the number of Ta atoms attributed to SoDs. Heating-cooling cycles exhibit thermal hysteresis, and upon cooling, the system freezes into a multi-domain state in which {\\alpha} and \\b{eta} CDW chiralities nucleate independently and persist to the lowest temperatures. These findings demonstrate that carefully benchmarked universal MLIPs can provide a scalable framework for finite-temperature studies of CDW materials.", "tier": "B_IMPORTANT_CONDMAT", "score": "9", "reason": "Direct relevance to CDW phase transitions in monolayer 1T-TaS2 using MLMD.; demoted from A: broad CM, not direct user/project hit", "tags": ["CDW", "2Dmaterials", "material", "computation", "phasetransition"], "image": "https://arxiv.org/static/browse/0.3.4/images/arxiv-logo-fb.png", "briefing": {"background": "1T-TaS2와 같은 전이금속 디칼코게나이드(TMD)는 전하 밀도파(CDW)와 층간 상호작용으로 인해 복잡한 상전이를 겪으며, 2D 한계에서 이 현상을 이해하는 것이 핵심적인 문제입니다.", "motivation": "기존 DFT 기반 분자 동역학 시뮬레이션은 대규모 슈퍼셀과 장시간 시뮬레이션이 필요한 CDW 현상을 다루기에 계산 비용이 너무 커서, 최신 머신러닝 잠재력(MLIP)을 적용해 이를 극복하고자 했습니다.", "result": "기계학습 잠재력을 사용하여 단층 1T-TaS2의 저온 Star-of-David 상태에서 고온 평면 상태로의 전이 과정을 성공적으로 재현했으며, 냉각 시 발생하는 카이랄 도메인 형성을 관찰했습니다.", "implication": "기계학습 분자 동역학이 복잡한 CDW 물질의 유한 온도 거동을 연구하는 매우 효율적이고 정확한 도구임을 입증했습니다.", "novelty": "대규모 계산 없이도 CDW 상전이의 상세한 온도 의존성을 다루었으며, 특히 도메인 형성 등 실험적 관측치를 이론적으로 재현한 점이 돋보입니다.", "unresolved": "계산 결과 나타난 도메인 벽의 물리적 특성이나, CDW와 위상학적 특성 간의 직접적인 연결 고리는 추가 연구가 필요합니다.", "future_work": "도메인 간 경계의 전자 구조를 분석하기 위한 계산 및 실험적 검증, 그리고 도핑에 따른 상전이 제어 연구가 기대됩니다.", "concepts": [{"term": "Charge-Density-Wave (CDW)", "why_emerged": "강한 전자-격자 결합으로 인해 전자 밀도가 주기적으로 재배열되는 바닥 상태를 설명하기 위해 등장했습니다.", "origin": "Peierls instability 이론에 기초함.", "connections": "Electron-phonon coupling, Peierls transition, Mott transition."}, {"term": "MLIP (Machine Learning Interatomic Potentials)", "why_emerged": "기존 경험적 퍼텐셜의 부정확성과 DFT의 높은 계산 비용 사이의 간극을 메우기 위해 도입되었습니다.", "origin": "Behler and Parrinello (2007) 등이 신경망 기반 잠재력을 제안하며 본격화됨.", "connections": "Ab initio molecular dynamics, structural phase transition simulation."}], "english_summary": ["Machine-learning molecular dynamics (MLMD) is used to simulate CDW phase transitions in monolayer 1T-TaS2.", "The method successfully captures the transition from Star-of-David distortion to the primitive hexagonal phase.", "Simulations reveal thermal hysteresis and the formation of independent chiral CDW domains.", "Universal MLIPs provide a scalable approach for finite-temperature studies of TMDs."]}}, {"title": "Coupling between magnetism and band structure in a 2D semiconductor", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2505.09946", "authors": "Lihuan Sun, Marco Gibertini, Alessandro Scarfato, et al.", "last_authors": "Alberto F. Morpurgo, Christoph Renner", "summary": "Van der Waals semiconducting magnets exhibit a cornucopia of physical phenomena originating from the interplay of their semiconducting and magnetic properties. However, a comprehensive understanding of how semiconducting processes and magnetism are coupled is lacking. We address this question by performing scanning tunneling spectroscopy (STS) measurements on the magnetic semiconductor CrPS$_4$, and by comparing the results to photoluminescence experiments and density functional theory (DFT) calculations. Below the magnetic transition, STS exhibit multiple features absent in the paramagnetic state, caused by the proliferation of electronic bands due to spin splitting with a large ($\\simeq 0.5$ eV) exchange energy. The energetic differences between the band edges determined by STS match all observed photoluminescence transitions, which also proliferate in the magnetic state. DFT calculations quantitatively predict the relative positions of all detected bands, explain which pairs of bands lead to radiative transitions, and also reproduce the measured spatial dependence of electronic wavefunctions. Our results reveal how all basic optoelectronic processes observed in CrPS$_4$ can be understood in terms of the evolution of the electronic band structure when entering the magnetic state, nescence transitions.", "Provides a clear framework for understanding optoelectronic coupling in 2D magnetic materials."]}}, {"title": "Magnetic proximity-induced non-relativistic valley polarization", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2607.22360", "authors": "Weifeng Xie, Yongqi Chen, Yiboyang Sun, Xiong Xu, Yunliang Yue, Hui Wang", "last_authors": "Yunliang Yue, Hui Wang", "summary": "The magnetic proximity effect in van der Waals heterostructures exerts a significant impact on the properties of adjacent materials. Here, we propose van der Waals heterostructures composed of monolayers ferromagnets (FM) and altermagnets (AM), in which the magnetic proximity effect from the FM induces pronounced non-relativistic valley polarization in the AM, and this phenomenon is demonstrated to be universal. Furthermore, by tuning the magnetization of the FM and the N\\'eel vector direction of the AM, four independent valley-polarized states can be realized in the FM/AM heterostructures, exhibiting strong magnetic-valley coupling. These findings suggest that FM/AM heterostructures hold potential application value in the field of valleytronics-based information storage.", "tier": "B_IMPORTANT_CONDMAT", "score": "9", "reason": "Altermagnetism and magnetic proximity effect in vdW heterostructures, highly relevant.; demoted from A: broad CM, not direct user/project hit", "tags": ["altermagnetism", "vanderWaals", "heterostructure", "magnetism", "valleytronics"], "image": "https://arxiv.org/static/browse/0.3.4/images/arxiv-logo-fb.png", "briefing": {"background": "반데르발스 이종접합에서 자기 근접 효과(Magnetic Proximity Effect)는 인접한 물질의 밴드 구조를 변조하여 새로운 위상 물성을 유도하는 강력한 도구입니다.", "motivation": "강자성체(FM)와 알터자성체(AM)를 결합하여 새로운 형태의 밸리 분극(valley polarization)을 비상대론적 방식으로 유도하고 조절하고자 함.", "result": "FM/AM 이종접합 구조에서 FM의 자기 근접 효과가 AM에 강한 밸리 분극을 유도함을 제안했습니다. FM의 자화 방향과 AM의 네일 벡터를 조합하여 4개의 독립적인 밸리 상태를 구현 가능함을 입증했습니다.", "implication": "알터자성체의 대칭성 보존과 FM의 자성 조절을 결합하여, 향후 밸 으로 규명함.", "implication": "알터자성 물질이 위상 물리와 결합하여 자성 없이도 위상 비자명한 밴드 구조를 가질 수 있음을 보이며, 새로운 밸리트로닉스 소자 응용 가능성을 제시함.", "novelty": "독자님의 관심사인 알터자성 및 위상 반금속을 결합하여 자성 특이적 위상 현상을 2차원 시스템에서 이론적으로 정립한 점이 흥미로움.", "unresolved": "이론적 모델링에 기반한 연구로, 실제 실험적 물질 후보군에서의 검증과 상온 구현 가능성은 여전히 숙제로 남아 있음.", "future_work": "제안된 밴드 구조를 실험적으로 관측하기 위한 ARPES(각분해 광전자 분광) 또는 수송 측정 연구가 필요함.", "concepts": [{"term": "알터자성(Altermagnetism)", "why_emerged": "기존 강자성/반강자성으로 분류되지 않는, 스핀 갈림(spin splitting)이 존재하면서도 순자화가 0인 새로운 자성 상태를 설명하기 위해 도입됨.", "origin": "최근 2020년대 초반 Šmejkal 등에 의해 이론적으로 정립됨.", "connections": "반강자성, 스핀-궤도 결합, 위상 반금속."}, {"term": "Weyl 반금속(Weyl Semimetal)", "why_emerged": "밴드 구조에서 Weyl 점(node)이라 불리는 위상적 특이점을 가진 전도체 시스템을 이해하기 위해 등장.", "origin": "2011년 Wan 등에 의해 제안됨.", "connections": "Berry 곡률, 비정질 홀 효과, 위상 절연체."}], "english_summary": ["Explores the intersection of altermagnetism and topological semimetals in 2D systems.", "Identifies a bipolarized Weyl semimetal phase and the quantum crystal valley Hall effect.", "Proposes altermagnetic materials as a novel platform for topological electronics.", "Highlights the potential for manipulating valley degrees of freedom in magnetic systems."]}}, {"title": "Effect of modest hydrostatic pressure on low-temperature transport behavior in La3Ni2O7 thin films", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/zjnc-vv8p", "authors": "Deepak Kumar, Jared Z. Dans, Keenan E. Avers, Ryan Paxson, Ichiro Takeuchi, Johnpierre Paglione", "last_authors": "Ichiro Takeuchi, Johnpierre Paglione", "summary": "How do La 3 Ni 2 O 7 thin films behaves under modest hydrostatic pressure? The authors here investigate epitaxial thin films under substrate selection, oxygen treatment, and hydrostatic pressure, and reveal tunable transport behavior, where modest pressure drives a transition from Fermi liquid-like metallicity toward non-Fermi liquid response. These findings highlight strain- and pressure-enabled control of bilayer nickelate thin films, offering a concise pathway to explore exotic low-temperature electronic states.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Experimental transport study on high-interest bilayer nickelates under pressure.", "tags": ["experiment", "material", "nickelates"], "image": "", "briefing": {"background": "La3Ni2O7은 액체 질소 온도 이상의 초전도성 가능성이 보고된 후, 전이 금속 산화물의 상관 전자 계 물리 연구에서 가장 뜨거운 주제 중 하나가 됨.", "motivation": "이 물질의 전자 상태가 압력이나 변형(strain)에 얼마나 민감하게 반응하는지, 특히 상전이 근처에서의 수송 특성 변화를 규명하고자 함.", "result": "La3Ni2O7 박막에 정수압을 가하여 페르미 액체 금속 상태에서 비페르미 액체(non-Fermi liquid) 상태로의 전이를 성공적으로 제어함.", "implication": "박막 성장 시의 변형 제어와 외부 압력 조절을 통해 니켈산염의 전자 상관성을 튜닝할 수 있으며, 초전도상으로 가는 경로를 실험적으로 입증할 수 있는 가능성을 보여줌.", "novelty": "박막 시료에서의 압력 의존성 수송 측정은 니켈산염 초전도 메커니즘을 밝히려는 독자님의 관심사와 직접적으로 연결됨.", "unresolved": "정수압 환경에서 측정된 수송 현상이 실제 벌크 니켈산염의 고압 초전도성과 어떠한 상관관계를 갖는지 명확히 규명해야 함.", "future_work": "고압 환경에서의 분광학적 연구(예: 고압 ARPES 또는 RIXS)를 통해 전자 구조의 변화를 직접 관측하는 연구가 이어져야 함.", "concepts": [{"term": "페르미 액체(Fermi Liquid)", "why_emerged": "금속 내 상호작용하는 전자계를 준입자(quasiparticle)의 비상호작용 계로 기술하기 위해 도입.", "origin": "Landau(1956)에 의해 확립.", "connections": "비페르미 액체, 강상관 전자계, 초전도성."}, {"term": "비페르미 액체(Non-Fermi Liquid)", "why_emerged": "고온 초전도체 등에서 관찰되는, 기존 페르미 액체 이론으로 설명 불가능한 금속 상태를 기술하기 위해 필요.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "양자 임계점, 전자 상관성, 이상 금속성."}], "english_summary": ["Investigates transport properties of La3Ni2O7 thin films under hydrostatic pressure.", "Observes a transition from Fermi liquid to non-Fermi liquid metallicity.", "Demonstrates pressure-tunability of electronic states in bilayer nickelates.", "Provides experimental insights for understanding superconducting phase transitions."]}}, {"title": "H-linear magnetoresistance in the T2 resistivity regime of overdoped infinite-layer nickelate La1xSrxNiO2", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/stvg-vbqs", "authors": "Yong-Cheng Pan, Tommy Kotte, Toni Helm, Motoki Osada, Atsushi Tsukazaki, Yu-Te Hsu", "last_authors": "Atsushi Tsukazaki, Yu-Te Hsu", "summary": "We report a systematic magnetotransport study on high-crystallinity ${\\mathrm{La}}_{1−x}{\\mathrm{Sr}}_{x}{\\mathrm{NiO}}_{2}$ (LSNO) thin films with $x=0.20−0.24$. By conducting pulsed-field transport experiment up to 62 T, we reveal two salient features of the normal-state transport in overdoped LSN…", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Relevant transport study in nickelates, which are of high interest.", "tags": ["nickelates", "transport", "magnetoresistance"], "image": "", "briefing": {"background": "니켈산염(Nickelate)은 구리 산화물(cuprates) 초전도체와 전자 구조적 유사성으로 인해 오랫동안 초전도 후보 물질로 연구되어 옴.", "motivation": "La1-xSrxNiO2 박막에서 자기저항(magnetoresistance)이 자기장에 따라 선형적으로 변화하는 현상을 관측하여, 그 안에 숨겨진 금속 상태의 특성을 파악하고자 함.", "result": "62T에 달하는 강자기장 환경에서 오버도핑된 영역의 LSNO가 선형 자기저항을 보임을 확인하고, 이는 비정상적인 금속 상태를 반영함.", "implication": "이 선형 자기저항은 니켈산염 내에 강한 전자 상관관계 또는 양자 임계적 변동이 존재함을 강력히 시사함.", "novelty": "62T라는 극강자장 환경에서의 수송 연구는 니켈산염의 정상 상태 금속 물성을 밝히는 데 중요한 단서를 제공함.", "unresolved": "선형 자기저항의 미시적 기원(예: 스핀 변동 또는 복잡한 페르미 표면 효과 등)이 완전하지 않음.", "future_work": "이러한 수송 현상이 밴드 구조의 특이점(예: 밴드 뒤틀림 또는 위상적 성분)과 어떻게 연결되는지 해석하는 이론적 연구 필요.", "concepts": [{"term": "선형 자기저항(Linear Magnetoresistance)", "why_emerged": "자기장에 대해 저항이 이차함수(B^2)가 아닌 선형으로 변하는 현상으로, 비통상적 금속 상태를 식별하는 지표로 사용.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "양자 진동, 페르미 표면 복잡성, 강상관 전자계."}, {"term": "무한층 니켈산염(Infinite-layer nickelates)", "why_emerged": "구리 산화물과 유사한 3d 전자 구조를 가지면서도 구조적 단순함을 유지하는 물질군으로 초전도성 탐색을 위해 제안.", "origin": "2019년 Li 등(Stanford 그룹)에 의해 박막 합성 성공.", "connections": "쿠프레이트, 전자 도핑, 페로브스카이트."}], "english_summary": ["Reports magnetotransport measurements in overdoped La1-xSrxNiO2 thin films.", "Reveals linear magnetoresistance in pulsed magnetic fields up to 62 T.", "Suggests non-Fermi liquid transport behavior in nickelate systems.", "Provides key data on the normal-state electronic structure of infinite-layer nickelates."]}}, {"title": "Highly fluctuating double-q magnetic order in the van der Waals metal CeTe3", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/m9lb-4vhx", "authors": "Ryutaro Okuma, Yuita Fujisawa, Natsumi Maekawa, et al.", "last_authors": "Yoshinori Okada, Daichi Ueta", "summary": "${\\mathrm{CeTe}}_{3}$ is a van der Waals antiferromagnet composed of magnetic ${[\\mathrm{CeTe}]}^{+}$ layers coupled to highly conducting ${\\mathrm{Te}}^{0.5−}$ square nets. Its simple quasi-two-dimensional electronic structure and cleavable nature make it an appealing platform for exploring correla…", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Magnetic order in CeTe3, a cleavable vdW material related to major ARPES/CDW systems.", "tags": ["experiment", "material", "vdW-material"], "image": "", "briefing": {"background": "CeTe3는 란타넘족 원소 기반의 반데르발스(vdW) 물질로, 자성 층과 전도성 Te 사각망이 공존하는 구조입니다. 전하 밀도 파동(CDW)과 자성 간의 상호작용을 연구하기에 적합한 플랫폼입니다.", "motivation": "이 물질에서 나타나는 자기적 질서의 복잡성과 이중-q(double-q) 상태의 요동 현상이 전자 구조 및 CDW에 미치는 영향을 규명하고자 했습니다.", "result": "CeTe3에서 고도로 요동치는 이중-q 자기 질서가 존재함을 실험적으로 확인하였으며, 이는 물질의 바닥 상태가 단순한 자기 질서가 아님을 시사합니다.", "implication": "vdW 자성체에서 자기 질서와 전도성 층의 상호작용을 이해하는 것이 향후 위상 물성이나 강상관 전자계 연구의 핵심임을 보여줍니다.", "novelty": "CeTe3의 이중-q 상태를 규명함으로써, 이 계열의 물질이 가진 풍부한 양자 물성을 해석하는 새로운 시각을 제공합니다.", "unresolved": "요동치는 이중-q 질서가 구체적으로 어떤 에너지 스케일에서 CDW와 결합하는지는 아직 명확하지 않습니다.", "future_work": "ARPES를 통한 전자 구조의 변화 추적이나 자기장 하에서의 저온 측정 실험이 필요합니다.", "concepts": [{"term": "Double-q magnetic order", "why_emerged": "단일 파동 벡터(q)로 설명되지 않는 복잡한 자기 구조를 기술하기 위해 필요합니다.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "Kagome 금속 AV3Sb5의 복잡한 대칭성 파괴와 연결됨."}, {"term": "van der Waals metal", "why_emerged": "층상 구조를 가져 박리가 가능하며 전자적 특성이 제어 가능한 물질군을 지칭합니다.", "origin": "그래핀 연구 이후 재료 과학계에서 광범위하게 정립됨.", "connections": "2D 전이금속 칼코겐 화합물, 위상 절연체 연구와 밀접."}], "english_summary": ["CeTe3 is a vdW antiferromagnet featuring magnetic CeTe layers and conductive Te square nets.", "The study identifies a highly fluctuating double-q magnetic order in this material.", "These results suggest that complex magnetic order plays a critical role in the physics of CeTe3.", "It provides a platform for exploring the interplay between magnetism and CDW states."]}}, {"title": "Identifying the origin of out-of-plane spin polarization in the noncollinear antiferromagnet Mn3Ge", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/kpj1-yrwh", "authors": "Mingxing Wu, Kouta Kondou, Taishi Chen, Satoru Nakatsuji, YoshiChika Otani", "last_authors": "Satoru Nakatsuji, YoshiChika Otani", "summary": "Noncollinear antiferromagnets Mn 3 X ( X =Sn, Ge) possess out-of-plane spin polarization that enables field-free magnetization switching. However, its microscopic origin remains under debate, specifically whether it arises from the antiferromagnetic order dependent magnetic spin Hall effect or antiferromagnetic order independent spin swapping. To address this issue here, the authors comparatively evaluate the spin torques in single-crystal Mn 3 Ge/Py bilayers with different crystallographic orientations using spin-torque ferromagnetic resonance technique. Their results reveal that both mechanisms coexist with comparable magnitudes, responsible for the out-of-plane spin polarization.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Experimental study of spin polarization in a noncollinear antiferromagnet relevant to topological materials.", "tags": ["experiment", "Mn3Ge", "antiferromagnetism"], "image": "", "briefing": {"background": "Mn3Ge와 같은 비공선형 반강자성체는 스핀 궤도 결합을 통해 특이한 전자기적 수송 현상을 보여주며 차세대 스핀트로닉스 소자로 주목받습니다.", "motivation": "비공선형 반강자성체에서 발생하는 면외 스핀 분극의 미시적 기원(자기 스핀 홀 효과 vs 스핀 스왑)을 명확히 하고자 했습니다.", "result": "Mn3Ge/Py 이층 구조에서 자기 스핀 홀 효과와 스핀 스왑 메커니즘이 모두 존재하며, 이들이 상호 보완적으로 면외 스핀 분극을 유도함을 확인했습니다.", "implication": "스핀 토크 소자 설계 시 이 두 메커니즘을 동시에 고려해야 함을 시사하며, 필드 프리(field-free) 제어의 이론적 기반을 강화합니다.", "novelty": "오랜 논쟁 대상이었던 면외 스핀 분극의 기원을 다각도로 검증하여 두 메커니즘의 공존을 밝혀냈습니다.", "unresolved": "두 메커니즘의 기여도가 구체적인 시료의 결정 결함이나 계면 특성에 따라 어떻게 변하는지 정량적 최적화가 필요합니다.", "future_work": "다른 비공선형 반강자성 물질로의 확장 연구 및 소자 효율 극대화를 위한 재료 공학적 접근.", "concepts": [{"term": "Noncollinear antiferromagnet", "why_emerged": "스핀이 일직선이 아닌 특정 각도를 이루며 정렬하여 베리 곡률과 같은 위상적 현상을 유도하기 위해 필요합니다.", "origin": "Mn3Sn, Mn3Ge 연구를 통해 Nakatsuji 그룹 등에 의해 확립됨.", "connections": "이상 홀 효과, 위상 자성체 연구와 직접 연결됨."}, {"term": "Spin-orbit torque", "why_emerged": "자성체의 효율적인 스위칭을 위해 전류 유도 스핀 분극을 활용하고자 하는 스핀트로닉스 연구에서 필수적입니다.", "origin": "Miron et al. (2011) 등 산화물/금속 계면 연구에서 부각.", "connections": "스핀 홀 효과, 자기 소자 연구."}], "english_summary": ["Mn3Ge is a noncollinear antiferromagnet capable of field-free magnetization switching.", "The study examines the origin of out-of-plane spin polarization using FMR.", "Results show that both magnetic spin Hall effect and spin swapping mechanisms coexist.", "This provides a comprehensive understanding for designing antiferromagnetic spintronic devices."]}}, {"title": "Magnetic field induced magnon portfolio in the van der Waals magnet CrOCl", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/l132-qx8q", "authors": "T. Riccardi, F. Le Mardélé, L. A. Veyrat de Lachenal, et al.", "last_authors": "C. Faugeras, B. A. Piot", "summary": "Magnonic excitations are investigated in the CrOCl van der Waals (vdW) antiferromagnet with absorption experiments in a broad continuous energy range. In an external magnetic field, the dispersions of magnon branches characteristic of different magnetic orders are subsequently observed, revealing a strong biaxial anisotropy, hysteretic magnon spectra, as well as the formation of spatially separated magnetic phases. Theexperiments here show that competing exchange interactions broaden the options to generate different kinds of magnonic excitations within the same vdW material.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Experimental investigation of magnon dispersions in the vdW antiferromagnet CrOCl.", "tags": ["experiment", "CrOCl", "magnon"], "image": "", "briefing": {"background": "반데르발스 반강자성체는 자성 및 전하 수송 특성을 개별 층 단위로 조절할 수 있어 자기 소자 응용 연구에서 매우 중요합니다.", "motivation": "CrOCl의 자기 질서에 따른 매그논(magnon) 여기 상태와 자기장의 상관관계를 밝혀, vdW 자성체에서의 정보 전달 효율을 평가하고자 했습니다.", "result": "외부 자기장에 따라 매그논 분산이 크게 변화함을 발견했으며, 강력한 비등방성과 공간적으로 분리된 자기 상 형성을 확인했습니다.", "implication": "단일 물질 내에서 자기장 조절을 통해 다양한 매그논 모드를 생성할 수 있어, 매그노닉스(magnonics) 소자 구현 가능성을 제시합니다.", "novelty": "vdW 반강자성체에서 경쟁적 교환 상호작용을 통해 매그논 특성을 광범위하게 제어할 수 있음을 실험적으로 증명했습니다.", "unresolved": "이러한 매그논 모드의 변조가 초고속 스핀 역학에서 얼마나 안정적인지는 확인이 더 필요합니다.", "future_work": "시분해(time-resolved) 분광학을 이용한 매그논 파동의 동역학 관찰.", "concepts": [{"term": "Magnon", "why_emerged": "자기 질서 상태에서의 집단적 스핀 들뜸(spin wave)을 양자화하여 기술하기 위해 필요합니다.", "origin": "Bloch (1930)에 의해 개념 도입.", "connections": "스핀트로닉스, 양자 정보 소자."}, {"term": "vdW Antiferromagnet", "why_emerged": "저차원 자성 물성을 극한으로 제어하기 위해 2D 물질에 자기적 질서를 부여하고자 등장함.", "origin": "CrI3, Cr2Ge2Te6 발견 이후 급부상.", "connections": "위상 자성체, 스핀 밸브."}], "english_summary": ["CrOCl is a vdW antiferromagnet exhibiting diverse magnonic excitations.", "Absorption experiments under magnetic fields reveal significant changes in magnon dispersion.", "Competing exchange interactions allow for the generation of different magnon branches.", "The results highlight the potential of CrOCl for reconfigurable magnonic devices."]}}, {"title": "Room-temperature two-dimensional ferromagnetism, large magnetic anisotropy, and anomalous Hall effect: From supported to freestanding monolayers GdM2 (M=Cu, Ag, Au)", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/csml-jn4q", "authors": "Jia-wan Li, Xunwu Hu, Dao-Xin Yao, Yusheng Hou", "last_authors": "Dao-Xin Yao, Yusheng Hou", "summary": "Here, the authors demonstrate that decoupling rare-earth Gd M 2 ( M =Cu, Ag, and Au) monolayers from metallic substrates transforms low-temperature supported surface alloys into room-temperature ferromagnets. Substrate removal enhances magnetic exchange interactions through charge redistribution, and eliminating structural buckling further modifies the competing exchange interactions. Freestanding GdAu 2 exhibits perpendicular magnetic anisotropy and a symmetry-tunable anomalous Hall effect, providing a platform for two-dimensional magnetic and topological spintronics.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Experimental study of 2D ferromagnetism and anomalous Hall effect.", "tags": ["anomalousHall", "monolayer", "magnetic"], "image": "", "briefing": {"background": "2차원 자성 재료는 차세대 스핀트로닉스 소자로 주목받고 있으나, 일반적으로 극저온에서만 자성이 유지된다는 한계가 있습니다. 이를 극복하기 위해 기판과의 상호작용을 제어하거나 재료 고유의 자기 이방성을 강화하려는 연구가 활발합니다.", "motivation": "GdM2(M=Cu, Ag, Au) 표면 합금에서 기판을 제거했을 때 자기적 특성이 어떻게 변화하는지 규명하여 상온 강자성을 구현하고자 했습니다.", "result": "기판에서 분리된 GdM2 단일층은 전하 재분배와 구조적 버클링 제거를 통해 강한 자기 교환 상호작용을 보이며, 특히 GdAu2는 수직 자기 이방성과 대칭성 제어가 가능한 비정상 홀 효과(AHE)를 나타냄을 확인했습니다.", "implication": "기판과의 결합을 조절하는 방식이 2차원 자성체의 동작 온도를 높이는 효과적인 전략임을 입증했습니다.", "novelty": "기존 저온 자성 재료를 자유 상태(freestanding)로 변환하여 상온 강자성 및 위상 스핀트로닉스 플랫폼으로 활용 가능성을 제시한 점이 독자 연구 관심사와 일치합니다.", "unresolved": "실제 실험적으로 기판으로부터 이들을 어떻게 안정적으로 분리하고 보존할 것인지에 대한 구체적인 공정 난이도가 남아 있습니다.", "future_work": "실험적 분리 기술의 최적화 및 실제 소자 구현을 통한 위상 자성 특성 확인.", "concepts": [{"term": "비정상 홀 효과 (Anomalous Hall Effect)", "why_emerged": "강자성 물질에서 외부 자기장 외에도 자화에 의해 발생하는 홀 전압을 이해하기 위해 필요했습니다.", "origin": "Edwin Hall이 1881년 발견.", "connections": "스핀-궤도 결합(SOC), 베리 곡률(Berry curvature)과 밀접하게 연관됨."}, {"term": "자기 이방성 (Magnetic Anisotropy)", "why_emerged": "특정 방향으로 자화가 용이하게 만드는 에너지를 정의하여 자기 소자의 안정성을 확보하기 위해 필요합니다.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "스핀 재배향 전이, 이중층 자성체 연구와 연결."}], "english_summary": ["Decoupling GdM2 monolayers from substrates induces room-temperature ferromagnetism.", "Freestanding GdAu2 shows perpendicular magnetic anisotropy and tunable anomalous Hall effect.", "The study highlights the role of charge redistribution and lattice symmetry in 2D magnetism.", "Provides a promising platform for high-temperature topological spintronics."]}}, {"title": "Anyon Dispersion from Nonuniform Magnetic Field on the Sphere", "journal": "PRL_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/gzdq-wkxj", "authors": "Mina-Lou Schleith, Tomohiro Soejima (副島智大), Eslam Khalaf", "last_authors": "Tomohiro Soejima (副島智大), Eslam Khalaf", "summary": "The discovery of fractional quantum anomalous Hall states in moiré systems has raised the possibility of realizing phases of itinerant anyons, whose mobility requires the absence of continuous magnetic translation symmetry (CMTS). Motivated by this, we consider anyons on the sphere in the presence o…", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Theory motivated by fractional quantum anomalous Hall states in moiré systems.", "tags": ["theory", "moiré", "fractionalquantumHall", "topological"], "image": "", "briefing": {"background": "모아레 격자 시스템에서 발견된 분수 양자 이상 홀 상태는 위상 물리 분야의 핵심 연구 주제입니다. 기존의 연속 자기 병진 대칭성(CMTS)이 없는 상황에서 애니온(Anyon)의 이동성과 분산 관계를 규명하는 것은 매우 도전적인 과제입니다.", "motivation": "모아레 시스템과 같은 물리적 환경에서 연속 자기 병진 대칭성이 결여된 상태의 애니온 거동을 이론적으로 이해하고자 했습니다.", "result": "구체적인 곡률이 있는 구(sphere) 위에서 비균일 자기장이 가해진 애니온 시스템의 분산 관계를 유도하였습니다.", "implication": "모아레 시스템 내 위상 상태의 기본 단위인 애니온의 운동 특성을 이해하고, 추후 분수 위상 물질의 전자기적 응답을 해석하는 토대가 될 것입니다.", "novelty": "모아레 시스템의 실험적 발견을 이론적으로 뒷받침하기 위해 구면 기하학을 도입한 수리물리학적 접근이 돋보입니다.", "unresolved": "비균일 자기장이 가해진 실제 모아레 평면에서의 애니온 분산 관계와 구면 모델 간의 정량적 차이.", "future_work": "평면 격자 시스템으로의 모델 확장 및 애니온 분산 측정 실험을 위한 이론적 가이드라인 구축.", "concepts": [{"term": "애니온 (Anyon)", "why_emerged": "2차원 계에서 보손과 페르미온이 아닌 임의의 통계적 성질을 갖는 준입자를 설명하기 위해 필요했습니다.", "origin": "Leinaas와 Myrheim이 1977년 이론적 제안.", "connections": "분수 양자 홀 효과, 위상 양자 컴퓨터와 연결됨."}, {"term": "연속 자기 병진 대칭성 (CMTS)", "why_emerged": "균일 자기장 하의 란다우 준위 모델에서 에너지 준위가 축퇴를 이루는 근간이 됩니다.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "분수 양자 이상 홀 상태의 비가환 애니온 이론과 대조되는 개념."}], "english_summary" function appendLabeledText(parent, className, label, text) { if (!text) return; const el = document.createElement('p'); el.className = className; const strong = textEl('strong', '', label); el.appendChild(strong); el.append(text); parent.appendChild(el); }
function appendBriefSection(parent, title, text, wide = false) { if (!text) return; const section = document.createElement('section'); section.className = 'brief-section' + (wide ? ' wide' : ''); section.appendChild(textEl('h2', '', title)); section.appendChild(textEl('p', '', text)); parent.appendChild(section); }
function render() {
  slideEl.replaceChildren();
  if (!slides.length) { slideEl.className = 'empty'; slideEl.textContent = 'No papers passed the filters in this run.'; counterEl.textContent = '0 / 0'; prevBtn.disabled = true; nextBtn.disabled = true; return; }
  slideEl.className = 'slide';
  const r = slides[index];
  const b = r.briefing || {};
  const head = document.createElement('div');
  head.className = 'paper-head';
  if (r.image) {
    const figure = document.createElement('figure');
    figure.className = 'figure';
    const img = document.createElement('img');
    img.src = r.image; img.alt = 'Figure or article preview image'; img.loading = 'lazy'; img.referrerPolicy = 'no-referrer'; img.onerror = () => figure.remove();
    figure.appendChild(img);
    figure.appendChild(textEl('figcaption', '', 'Figure / article preview image from the source page'));
    head.appendChild(figure);
  }
  const headText = document.createElement('div');
  headText.className = 'head-text';
  const badges = document.createElement('div');
  badges.className = 'badges';
  if (r.score) badges.appendChild(textEl('span', 'badge score', `${r.score}/10`));
  if (r.tier) badges.appendChild(textEl('span', 'badge', r.tier));
  if (r.journal) badges.appendChild(textEl('span', 'badge', r.journal));
  if (r.source) badges.appendChild(textEl('span', 'badge', r.source));
  headText.appendChild(badges);
  const title = document.createElement('h1');
  if (r.link) { const titleLink = document.createElement('a'); titleLink.href = r.link; titleLink.target = '_blank'; titleLink.rel = 'noopener noreferrer'; titleLink.textContent = r.title || ''; title.appendChild(titleLink); }
  else { title.textContent = r.title || ''; }
  headText.appendChild(title);
  headText.appendChild(textEl('p', 'meta', [r.journal, r.source].filter(Boolean).join(' | ')));
  if (r.last_authors || r.authors) { const authors = document.createElement('p'); authors.className = 'authors'; if (r.last_authors) authors.append('Last authors: ' + r.last_authors); if (r.authors) authors.append((r.last_authors ? ' | ' : '') + 'Authors: ' + r.authors); headText.appendChild(authors); }
  appendLabeledText(headText, 'why', 'Filter reason: ', r.reason);
  if (r.tags && r.tags.length) { const tags = document.createElement('div'); tags.className = 'tags'; r.tags.forEach(tag => tags.appendChild(textEl('span', 'tag', '#' + tag))); headText.appendChild(tags); }
  if (r.link) { const link = document.createElement('a'); link.className = 'link'; link.href = r.link; link.target = '_blank'; link.rel = 'noopener noreferrer'; link.textContent = 'Open paper'; headText.appendChild(link); }
  head.appendChild(headText);
  if (r.summary) { const abstract = document.createElement('p'); abstract.className = 'original-abstract'; const strong = textEl('strong', '', 'Original abstract'); abstract.appendChild(strong); abstract.append(r.summary); head.appendChild(abstract); }
  slideEl.appendChild(head);
  const briefing = document.createElement('div');
  briefing.className = 'briefing';
  appendBriefSection(briefing, 'Background', b.background);
  appendBriefSection(briefing, 'Motivation', b.motivation);
  appendBriefSection(briefing, 'Result', b.result);
  appendBriefSection(briefing, 'Implication', b.implication);
  appendBriefSection(briefing, "Why it's important / Novelty", b.novelty);
  appendBriefSection(briefing, 'Unresolved Questions', b.unresolved);
  appendBriefSection(briefing, 'Expected Future Work', b.future_work);
  if (b.concepts && b.concepts.length) {
    const section = document.createElement('section');
    section.className = 'brief-section wide';
    section.appendChild(textEl('h2', '', 'Concepts / Terms'));
    const concepts = document.createElement('div');
    concepts.className = 'concepts';
    b.concepts.forEach(c => {
      const item = document.createElement('div');
      item.className = 'concept';
      item.appendChild(textEl('h3', '', c.term || 'Concept'));
      [['왜 생겼나: ', c.why_emerged], ['누가 만들었나: ', c.origin], ['연결되는 흐름: ', c.connections]].forEach(([label, text]) => { if (!text) return; const p = document.createElement('p'); const bold = textEl('b', '', label); p.appendChild(bold); p.append(text); item.appendChild(p); });
      concepts.appendChild(item);
    });
    section.appendChild(concepts);
    briefing.appendChild(section);
  }
  if (b.english_summary && b.english_summary.length) { const section = document.createElement('section'); section.className = 'brief-section wide'; section.appendChild(textEl('h2', '', 'English Summary')); const ul = document.createElement('ul'); b.english_summary.slice(0, 5).forEach(line => ul.appendChild(textEl('li', '', line))); section.appendChild(ul); briefing.appendChild(section); }
  slideEl.appendChild(briefing);
  counterEl.textContent = `${index + 1} / ${slides.length}`;
  prevBtn.disabled = index === 0;
  nextBtn.disabled = index === slides.length - 1;
}
prevBtn.addEventListener('click', () => { index = Math.max(0, index - 1); render(); });
nextBtn.addEventListener('click', () => { index = Math.min(slides.length - 1, index + 1); render(); });
document.addEventListener('keydown', event => { if (event.key === 'ArrowLeft') prevBtn.click(); if (event.key === 'ArrowRight') nextBtn.click(); });
render();
</script>
</body>
</html>
