<!DOCTYPE html>
<html lang='en'>
<head>
<meta charset='UTF-8'>
<meta name='viewport' content='width=device-width, initial-scale=1.0'>
<title>Daily Paper Slideshow</title>
<style>
  :root {
    color-scheme: light;
    --bg: #f6f7f4;
    --paper: #ffffff;
    --ink: #111827;
    --muted: #64748b;
    --line: #d8ddd2;
    --accent: #176b87;
    --accent-2: #9a3412;
  }
  * { box-sizing: border-box; }
  body { margin: 0; height: 100vh; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: var(--bg); color: var(--ink); }
  .shell { max-width: 1500px; height: 100vh; margin: 0 auto; padding: 14px 18px; display: flex; flex-direction: column; }
  .topbar { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 16px; }
  .top-actions { display: flex; align-items: center; gap: 10px; }
  .topbar a, button { border: 1px solid var(--line); border-radius: 8px; background: var(--paper); color: var(--ink); padding: 10px 14px; font-weight: 700; text-decoration: none; cursor: pointer; }
  button.primary { background: var(--accent); border-color: var(--accent); color: white; }
  button:disabled { opacity: 0.45; cursor: not-allowed; }
  .counter { color: var(--muted); font-weight: 700; }
  .slide { height: calc(100vh - 82px); background: var(--paper); border: 1px solid var(--line); border-radius: 10px; padding: 18px; box-shadow: 0 18px 42px rgba(15, 23, 42, 0.10); display: grid; grid-template-columns: minmax(310px, 0.86fr) minmax(0, 1.55fr); gap: 18px; overflow: hidden; }
  .paper-head { min-width: 0; overflow: hidden; display: flex; flex-direction: column; gap: 12px; }
  .figure { margin: 0; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: #f8fafc; }
  .figure img { display: block; width: 100%; max-height: 41vh; object-fit: contain; background: white; }
  .figure figcaption { padding: 7px 10px; color: var(--muted); font-size: 12px; line-height: 1.3; }
  .head-text { display: flex; flex-direction: column; gap: 9px; min-width: 0; }
  .badges { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .badge { border-radius: 999px; padding: 5px 9px; background: #eef2ff; color: #3730a3; font-size: 12px; font-weight: 800; }
  .score { background: #fee2e2; color: #991b1b; }
  h1 { margin: 0; font-size: 25px; line-height: 1.15; letter-spacing: 0; overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
  h1 a { color: inherit; text-decoration-color: rgba(23, 107, 135, 0.35); text-decoration-thickness: 2px; text-underline-offset: 4px; }
  h1 a:hover { color: var(--accent); text-decoration-color: var(--accent); }
  .meta, .authors, .why, .abstract { font-size: 13px; line-height: 1.45; }
  .meta, .authors { color: var(--muted); }
  .why strong, .abstract strong, .authors strong { color: var(--ink); }
  .authors { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .why { border-left: 4px solid var(--accent-2); padding-left: 10px; color: #374151; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .abstract { border-top: 1px solid var(--line); padding-top: 14px; color: #374151; }
  details.abstract-details { display: none; }
  details.abstract-details summary { cursor: pointer; color: var(--accent); font-weight: 800; margin-bottom: 8px; }
  .tags { display: flex; flex-wrap: wrap; gap: 8px; }
  .tag { border-radius: 999px; padding: 4px 8px; background: #f1f5f9; color: #475569; font-size: 12px; font-weight: 700; }
  .head-text > .link { display: none; }
  .briefing { min-width: 0; min-height: 0; overflow: hidden; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); grid-auto-rows: minmax(0, auto); gap: 11px 18px; border-top: 0; padding-top: 0; }
  .brief-section { min-width: 0; }
  .brief-section.wide { grid-column: 1 / -1; }
  .brief-section h2 { margin: 0 0 4px; font-size: 14px; line-height: 1.22; color: #0f766e; letter-spacing: 0; }
  .brief-section p, .brief-section li { margin: 0; font-size: 12.5px; line-height: 1.42; color: #1f2937; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .brief-section ul { margin: 0; padding-left: 20px; }
  .concepts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 9px 14px; }
  .concept { border-top: 1px solid var(--line); padding-top: 7px; }
  .concept h3 { margin: 0 0 4px; font-size: 13px; color: #7c2d12; letter-spacing: 0; }
  .concept p { margin: 2px 0 0; font-size: 11.5px; line-height: 1.35; color: #374151; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .concept b { color: #111827; }
  .link { color: var(--accent); font-weight: 800; text-decoration: none; }
  .empty { padding: 48px; background: var(--paper); border: 1px solid var(--line); border-radius: 12px; color: var(--muted); }
  @media (max-width: 860px) {
    body { height: auto; overflow: auto; }
    .shell { padding: 14px; }
    .topbar, .top-actions { align-items: stretch; flex-direction: column; }
    .slide, .briefing, .concepts { grid-template-columns: 1fr; }
    .slide { height: auto; overflow: visible; display: grid; }
    details.abstract-details { display: block; }
    h1 { font-size: 28px; }
  }
</style>

<script>
const slides = [{"title": "Electronic Origin of Delicate Antiferromagnetism in FexNbS2", "journal": "PRL_Recent", "source": "author whitelist", "link": "http://link.aps.org/doi/10.1103/99yr-nqbx", "authors": "Wenxin Li, Jonathan T. Reichanadter, Shan Wu, et al.", "last_authors": "Jeffrey B. Neaton, Yu He", "summary": "Author(s): Wenxin Li, Jonathan T. Reichanadter, Shan Wu, Ji Seop Oh, Rourav Basak, Shannon C. Haley, Siqi Wang, Joshua E. Chaparro Mata, Elio Vescovo, Donghui Lu, Makoto Hashimoto, Christoph Klewe, Suchismita Sarker, Jessica L. McChesney, Alex Frañó, James G. Analytis, Robert J. Birgeneau, Jeffrey B. Neaton, and Yu He A combination of ARPES, XAS, and DFT shows a dramatic eV-scale electronic restructuring in Fe x NbS 2 , similar to what happens in correlated oxides, and suggests electronic correlations play a central role in the magnetism of Fe-intercalated transition-metal dichalcogenides. [Phys. Rev. Lett. 136, 216503] Published Wed May 27, 2026", "tier": "A_MUST_READ", "score": "10", "reason": "author whitelist: Donghui Lu", "tags": ["ARPES", "STS", "correlated", "ferromagnet", "antiferromagnet"], "image": "", "briefing": {"background": "전이금속 디칼코게나이드(TMD)에 자성 원자를 삽입(intercalation)하면 격자 구조와 전자 구조의 상호작용을 통해 독특한 자성을 유도할 수 있습니다. 특히 FexNbS2와 같은 물질은 삽입된 원자의 농도에 따라 복잡한 반강자성 질서를 보이며, 이는 차세대 스핀트로닉스 소재로서 주목받고 있습니다.", "motivation": "기존 연구들은 주로 삽입된 Fe 원자의 자기적 모멘트에 집중해 왔으나, 이 시스템에서 나타나는 미묘한 반강자성 상태의 근본적인 전자적 기작과 전자 상관관계(electronic correlation)의 역할은 명확히 밝혀지지 않았습니다.", "result": "ARPES, XAS, DFT를 결합하여 분석한 결과, FexNbS2에서 수 eV 수준의 대규모 전자 구조 재편(restructuring)이 발생함을 발견했습니다. 이는 상관관계가 강한 산화물에서나 나타나는 현상과 유사하며, Fe 삽입 TMD의 자성에서 단순한 교환 상호작용을 넘어 전자 상관관계가 핵심적인 역할을 함을 입증했습니다.", "implication": "이 결과는 FexNbS2를 단순한 금속성 자성체로 보던 관점을 바꾸어, 전자 상관관계가 강한 계로 재정의해야 함을 시사합니다. 이는 TMD 기반 자성체의 임계 온도 조절이나 스핀 상태 제어 전략에 큰 영향을 미칠 수 있습니다.", "novelty": "독보적인 ARPES 실험 데이터를 통해 eV 규모의 에너지 스케일에서 발생하는 전자 구조 변화를 관찰했다는 점이 혁신적입니다. 독자분의 주요 관심사인 ARPES를 활용해 TMD 내 상관관계와 자성의 연결고리를 명확히 짚어냈습니다.", "unresolved": "전자 상관관계가 구체적으로 어떤 궤도(orbital) 간의 상호작용에서 기인하는지, 그리고 삽입 농도 x의 미세한 변화가 반강자성 상전이에 미치는 비선형적 영향에 대해서는 추가 연구가 필요합니다.", "future_work": "다양한 삽입 원자 및 농도 변화에 따른 계열 연구가 예상되며, 특히 온도 변화에 따른 상관관계의 동역학적 변화를 실시간으로 관찰하는 초고속 분광학 연구가 뒤따를 것으로 보입니다.", "concepts": [{"term": "Intercalation (삽입)", "why_emerged": "2D 층상 물질의 층 사이 공간에 이종 원자를 넣어 물성을 튜닝하기 위해 도입되었습니다.", "origin": "화학적 합성을 통한 층상 물질 변형의 고전적 방법", "connections": "Graphene intercalation, TMD-based magnets"}, {"term": "Electronic Correlation (전자 상관관계)", "why_emerged": "단일 전자 근사로 설명되지 않는 모트 절연체나 비정상 초전도체 등의 현상을 설명하기 위해 필수적입니다.", "origin": "Mott, Hubbard 등의 이론적 고찰", "connections": "Mott insulator, High-Tc superconductivity"}, {"term": "XAS (X선 흡수 분광)", "why_emerged": "특정 원소의 산화수, 국소적 화학 환경 및 스핀 상태를 선택적으로 조사하기 위해 필요합니다.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "XMCD, RIXS"}], "english_summary": ["ARPES and XAS reveal an eV-scale electronic restructuring in Fe-intercalated NbS2.", "Electronic correlations are shown to play a central role in the delicate antiferromagnetism of these compounds.", "The study shifts the understanding of intercalated TMDs toward strongly correlated systems."]}}, {"title": "Symmetry-Broken Ground State and Phonon-Mediated Superconductivity in Kagome CsV3Sb5", "journal": "PRL_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/4r8x-j3nd", "authors": "Manex Alkorta, Martin Gutierrez-Amigo, Đorđe Dangić, et al.", "last_authors": "Maia G. Vergniory, Ion Errea", "summary": "Author(s): Manex Alkorta, Martin Gutierrez-Amigo, Đorđe Dangić, Chunyu Mark Guo, Philip J. W. Moll, Maia G. Vergniory, and Ion Errea The newly discovered family of nonmagnetic kagome metals ${\\mathrm{AV}}_{3}{\\mathrm{Sb}}_{5}$ ($\\mathrm{A}=\\mathrm{K}$, Rb, or Cs) provides a unique platform for exploring the interplay between charge-density wave (CDW) order, superconductivity, nontrivial topology, and spontaneous time-reversal sym… [Phys. Rev. Lett. 136, 206401] Published Fri May 22, 2026", "tier": "A_MUST_READ", "score": "10", "reason": "Direct hit on current primary research interests regarding kagome AV3Sb5 materials.", "tags": ["kagome", "CsV3Sb5", "superconductivity"], "image": "", "briefing": {"background": "AV3Sb5 (A=K, Rb, Cs) 계열 카고메 금속은 전하 밀도 파동(CDW), 초전도, 위상 기하학적 전자 구조가 공존하는 독특한 플랫폼으로, 최근 고체물리 분야에서 가장 뜨거운 연구 주제 중 하나입니다.", "motivation": "이 물질들에서 나타나는 초전도 현상이 기존의 포논 매개 기작에 의한 것인지, 아니면 전하 밀도 파동이나 시간 반전 대칭성 깨짐과 관련된 비전통적(unconventional) 기작에 의한 것인지에 대한 논쟁이 지속되고 있습니다.", "result": "본 연구는 CsV3Sb5의 대칭성이 깨진 바닥 상태를 분석하고, 초전도 현상이 포논(phonon)에 의해 매개된다는 증거를 제시했습니다. 특히 CDW 상태와 초전도 사이의 경쟁 및 공존 관계를 대칭성 파괴의 관점에서 체계적으로 정리했습니다.", "implication": "초전도 기작이 포논 매개일 가능성이 높다는 결론은, 이 물질을 비전통적 초전도체보다는 강한 전자-격자 결합을 가진 시스템으로 이해해야 함을 시사하며, 위상학적 성질과의 상호작용을 해석하는 데 중요한 기준점이 됩니다.", "novelty": "독자분의 1순위 관심사인 Kagome AV3Sb5 물질의 초전도 기작을 다루고 있습니다. 특히 논란이 많은 TRSB(시간 반전 대칭성 깨짐)와 초전도 기작 사이의 관계를 포논 매개 관점에서 설명하려 시도한 점이 돋보입니다.", "unresolved": "실험적으로 관찰된 TRSB 신호가 포논 매개 초전도 프레임워크 내에서 어떻게 완벽하게 정당화될 수 있는지, 그리고 다른 112 계열 물질과의 공통점/차이점은 무엇인지 더 규명되어야 합니다.", "future_work": "포논 스펙트럼의 미세한 변화를 측정하기 위한 비탄성 중성자 산란이나 IXS 실험, 그리고 압력에 따른 대칭성 회복 과정을 관찰하는 고압 실험이 이어질 것으로 보입니다.", "concepts": [{"term": "Kagome Metal (카고메 금속)", "why_emerged": "기하학적 좌절(frustration)에 의한 플랫 밴드와 디락 콘 등의 특이 전자 구조를 연구하기 위해 등장했습니다.", "origin": "일본의 바구니 패턴 '카고메'에서 유래", "connections": "Frustrated magnetism, Flat band physics"}, {"term": "CDW (전하 밀도 파동)", "why_emerged": "저차원 금속에서 전자-포논 결합에 의해 전하 밀도가 주기적으로 변조되는 현상을 설명하기 위해 도입되었습니다.", "origin": "Peierls (1930년대 이론적 예측)", "connections": "Peierls instability, Fermi surface nesting"}, {"term": "Phonon-mediated SC", "why_emerged": "전통적인 BCS 초전도 이론에서 쿠퍼 쌍을 형성하는 매개체로서 포논의 역할을 설명합니다.", "origin": "Bardeen, Cooper, Schrieffer (1957)", "connections": "BCS theory, Electron-phonon coupling"}], "english_summary": ["Investigates the symmetry-broken ground state and superconductivity in Kagome CsV3Sb5.", "Proposes that the superconducting state is primarily mediated by phonons.", "Discusses the interplay between CDW order, TRSB, and topological features within this framework."]}}, {"title": "Nodeless superconducting gap and electron-boson coupling in (La,Pr,Sm) 3 Ni 2 O 7 films", "journal": "Science", "source": "Gemini", "link": "https://doi.org/10.1126/science.adw8329", "authors": "Jianchang Shen, Guangdi Zhou, Yu Miao, et al.", "last_authors": "Junfeng He, Zhuoyu Chen", "summary": "The discovery of superconductivity in Ruddlesden-Popper (RP) bilayer nickelate films under ambient pressure provides an opportunity to directly investigate electronic energy scales of the superconducting state and the pairing mechanism. We report angle-resolved photoemission spectroscopy measurements of superconducting (La,Pr,Sm) 3 Ni 2 O 7 thin films by developing an ultra-high vacuum cryogenic sample quenching and transfer technique. A superconducting gap of ~18 meV with coherence peaks is observed along the Brillouin zone diagonal. The finite gap persists across the entire Brillouin zone, revealing the absence of gap nodes. A kink is observed in the energy-momentum dispersion at ~70 meV below Fermi level, indicating an electron-boson coupling. The simultaneous observation of a nodeless superconducting gap and electron-boson coupling provides insight into the pairing symmetry and gluing mechanism in RP bilayer nickelates.", "tier": "A_MUST_READ", "score": "10", "reason": "Direct ARPES study of the gap and coupling in the new bilayer nickelate superconductors.", "tags": ["ARPES", "nickelates", "superconductivity"], "image": "", "briefing": {"background": "최근 상압에서 초전도성을 띠는 이중층 니켈레이트(La3Ni2O7 계열) 박막이 발견되면서, 구리 산화물(cuprates)에 이은 새로운 고온 초전도체 후보군으로 큰 관심을 받고 있습니다.", "motivation": "초전도 페어링 대칭성(pairing symmetry)과 이를 유도하는 보존(boson)의 정체를 밝히기 위해서는 에너지 갭의 노드(node) 유무와 전자 구조의 꼬임(kink) 현상을 정밀하게 측정해야 합니다.", "result": "ARPES를 통해 (La,Pr,Sm)3Ni2O7 박막의 초전도 갭을 직접 관찰한 결과, 브릴루앙 영역 전반에 걸쳐 노드가 없는(nodeless) 약 18 meV 크기의 갭을 확인했습니다. 또한, 페르미 준위 아래 약 70 meV 지점에서 전자-보존 결합을 시사하는 킹크(kink)를 발견했습니다.", "implication": "노드가 없는 갭과 70 meV 킹크의 발견은 이 물질의 페어링 nal lattice of CeSb$_2$, revealed by angle-resolved photoemission spectroscopy (ARPES). High-resolution ARPES resolves no spin-density-wave gap on the dispersive Fermi pockets, disfavoring a nesting-driven mechanism for the q1D FM excitations. Instead, resonant ARPES reveals a pronounced selective enhancement of Ce 4$f$ spectral weight on the $C_2$-distributed Fermi pockets aligned with the Ce ladder. This observation signifies band-selective Kondo coupling that generates strongly anisotropic magnetic exchange interactions, which can naturally account for both the q1D ferromagnetic excitations and the competing magnetic orders. Our results identify a band-selective Kondo coupling mechanism for emergent low-dimensional magnetism in correlated $f$-electron systems.", "tier": "A_MUST_READ", "score": "10", "reason": "author whitelist: Donglai Feng", "tags": ["ARPES", "angle-resolvedphotoemission", "photoemission", "quasi-one-dimensional", "Kondo", "superconduct", "correlated", "ferromagnet"], "image": "https://arxiv.org/html/2605.30074v1/x1.png", "briefing": {"background": "CeSb2는 스핀-삼중항(spin-triplet) 초전도체 후보 물질로 주목받고 있으며, 그 구조가 준-2차원(q2D)임에도 불구하고 준-1차원(q1D) 강자성(FM) 여기 현상이 관찰되어 그 기원에 대한 논의가 지속되어 왔습니다.", "motivation": "이 연구의 동기는 CeSb2에서 나타나는 준-1차원 강자성 여기가 단순히 페르미면 네스팅(nesting)에 의한 것인지, 아니면 다른 전자적 메커니즘에 의한 것인지를 규명하는 데 있습니다.", "result": "ARPES 측정 결과, 페르미 포켓에서 스핀-밀도-파(SDW) 갭이 관찰되지 않아 네스팅 기반 메커니즘은 부정되었습니다. 대신 공명 ARPES를 통해 Ce 사다리(ladder) 구조와 정렬된 특정 페르미 포켓에서만 Ce 4f 스펙트럼 가중치가 강하게 향상되는 '밴드 선택적 콘도 결합(band-selective Kondo coupling)'을 발견했습니다.", "implication": "이러한 밴드 선택적 콘도 결합은 강한 이방성 자기 교환 상호작용을 유도하며, 이는 준-2차원 격자 내에서 왜 준-1차원적인 자기 특성이 나타나는지를 자연스럽게 설명해 줍니다.", "novelty": "저명한 ARPES 전문가인 Haichao Xu와 Donglai Feng의 연구로, f-전자 시스템에서 밴드 선택적 결합이 어떻게 저차원 자기 물성을 발현시키는지 직접적인 증거를 제시했다는 점에서 독자(ARPES 및 준-1차원 소재 관심)에게 매우 중요한 논문입니다.", "unresolved": "이러한 밴드 선택적 콘도 결합이 실제 스핀-삼중항 초전도 상태 형성에 구체적으로 어떤 기여를 하는지에 대한 직접적인 연결 고리는 추가 연구가 필요합니다.", "future_work": "강한 자기장이나 압력 하에서의 ARPES 측정을 통해 자기 상호작용과 초전도성 사이의 경쟁 또는 공존 관계를 더 깊이 탐구할 것으로 예상됩니다.", "concepts": [{"term": "Band-selective Kondo coupling", "why_emerged": "특정 전자 궤도나 밴드만이 국부 스핀과 강하게 결합하여 이방성 있는 물성을 만드는 현상을 설명하기 위해 도입되었습니다.", "origin": "초록 정보만으로는 특정하기 어려우나, 다강체 및 중페르미온 시스템 연구에서 발전된 개념입니다.", "connections": "Heavy fermion, Mott physics, orbital-selective transitions"}, {"term": "Spin-triplet superconductor", "why_emerged": "기존 BCS 이론의 singlet 쌍과는 다른, 스핀이 평행한 전자 쌍에 의한 초전도 현상을 연구하기 위해 등장했습니다.", "origin": "He-3의 초유체 현상에서 유추되어 고체 물리로 확장되었습니다.", "connections": "Majorana fermions, topological superconductivity, Sr2RuO4"}, {"term": "Resonant ARPES", "why_emerged": "특정 원소나 궤도(예: Ce 4f)의 전자 구조 기여도를 선택적으로 증폭시켜 관찰하기 위해 고안되었습니다.", "origin": "X-ray 흡수단 에너지를 이용한 광전효과 원리에 기반합니다.", "connections": "Soft X-ray ARPES, heavy fermion spectroscopy"}, {"term": "Quasi-one-dimensional (q1D) magnetism", "why_emerged": "3차원 또는 2차원 결정 구조 내에서 자기적 상호작용이 특정 방향으로만 강하게 나타나는 현상을 설명합니다.", "origin": "체인(chain) 또는 사다리(ladder) 구조를 가진 전이금속 화합물 연구에서 유래했습니다.", "connections": "Luttinger liquid, Haldane chain, spinons"}], "english_summary": ["The origin of quasi-one-dimensional ferromagnetic excitations in candidate spin-triplet superconductor CeSb2 was investigated using high-resolution and resonant ARPES.", "The study ruled out nesting-driven mechanisms due to the absence of a spin-density-wave gap on dispersive Fermi pockets.", "A band-selective Kondo coupling was identified, where Ce 4f spectral weight is preferentially enhanced on Fermi pockets aligned with Ce ladders.", "This selective coupling explains the emergent low-dimensional magnetism and competing magnetic orders in a quasi-two-dimensional lattice."]}}, {"title": "Odd spin symmetry and anisotropy switching in p-wave magnet CeNiAsO", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2605.28701", "authors": "Fayuan Zhang, Huaxun Li, Xingkai Cheng, et al.", "last_authors": "Guanghan Cao, Chaoyu Chen", "summary": "arXiv:2605.28701v2 Announce Type: replace Abstract: Odd-parity magnets, complementary to altermagnets, exhibit unique properties such as high efficiency in charge-spin conversion and compatibility with conventional superconductivity, of critical importance in the pursuit of energy-efficient spintronics and topological superconductors for quantum computation. For even-parity d-wave and g-wave altermagnets, the magnetic structure, spin-split band structure and physical properties are currently under intensive study. On the contrary, while hundreds of odd-parity magnets and the promising properties have been predicted in theory, experimental studies are scarce. Specifically, the magnetic structure and transport properties of candidates NiI2 and Ga3Ru4Al12 have been reported, yet the characteristic band structure and particularly the odd-parity spin symmetry remain elusive. Here we demonstrate experimentally the deterministic p-wave spin symmetry and resistance anisotropy switching for the prototype odd-parity magnet, CeNiAsO. Angle-resolved photoemission spectroscopy (ARPES) reveals two cleaved terminations with distinct surface band structure. By compensating the polar surface, we achieve intrinsic bulk band structure, for which the spin splitting can be well described by the p-wave magnetic structure through first-principles calculation. The bulk spin polarization measured by spin-resolved ARPES exhibits symmetry with only one degenerate plane, fingerprint of p-wave magnetism. We further demonstrate giant resistance anisotropy and switching between high-resistance and low-resistance states through modest field-induced domain selection, highlighting its potential for antiferromagnetic spin memory devices. The structural similarity between CeNiAsO and 1111-type Fe-based superconductors stimulates further exploration on the interplay between p-wave magnetism, superconductivity and band topology.", "tier": "A_MUST_READ", "score": "10", "reason": "ARPES study of p-wave magnetic symmetry and band splitting in an altermagnet candidate.", "tags": ["experiment", "ARPES", "CeNiAsO", "altermagnetism"], "image": "https://arxiv.org/static/browse/0.3.4/images/arxiv-logo-fb.png", "briefing": {"background": "최근 짝수-패리티를 갖는 알터마그넷(altermagnet)에 대한 연구는 활발하지만, 홀수-패리티(odd-parity) 스핀 대칭을 갖는 p-파 자성체(p-wave magnet)에 대한 실험적 증거는 매우 희귀한 상태입니다.", "motivation": "이론적으로 예측된 p-파 자성체의 특이한 밴드 구조와 스핀 대칭성을 CeNiAsO라는 프로토타입 물질을 통해 실험적으로 증명하고자 합니다.", "result": "ARPES를 통해 CeNiAsO의 벌크 전자 구조를 성공적으로 추출하였으며, 벌크 밴드 분할(spin-splitting)이 p-파 자기 구조와 일치함을 보였습니다. 특히 스핀 분해 ARPES(SARPES)를 통해 단 하나의 퇴화 평면만을 갖는 p-파 자기 대칭의 지문(fingerprint)을 확인했습니다.", "implication": "p-파 자성체의 존재를 실험적으로 확립함으로써, 높은 효율의 스핀-전하 변환 및 자성 메모리 소자, 그리고 위상 초전도체 구현을 위한 새로운 플랫폼을 제시했습니다.", "novelty": "알터마그네티즘과 유사하면서도 구별되는 p-파 자성을 ARPES로 직접 관찰했다는 점이 독보적이며, 특히 1111계 철 기반 초전도체와 유사한 구조를 가져 초전도와의 상호작용 연구로 확장될 가능성이 높습니다.", "unresolved": "표면의 극성(polar surface) 문제로 인한 밴드 구조의 복잡성을 완전히 제거하고 순수 벌크 특성만을 분리해내는 기술적 난제가 여전히 존재합니다.", "future_work": "이 물질에서 자기 도메인 선택을 통한 저항 이방성 스위칭 성능을 최적화하고, 다른 p-파 자성체 후보 물질들로 연구를 확장할 예정입니다.", "concepts": [{"term": "p-wave magnet (odd-parity)", "why_emerged": "알터마그넷과 보완적인 관계에 있는 홀수 패리티 자성 구조를 정의하기 위해 제안되었습니다.", "origin": "최근 스핀트로닉스 이론 분야에서 제안되었습니다.", "connections": "Altermagnetism, spin-split bands, spintronics"}, {"term": "Altermagnetism", "why_emerged": "전통적인 강자성이나 반강자성과 달리, 넷 자화(net magnetization)는 없으면서 밴드 스핀 분할이 나타나는 새로운 자성 분류를 위해 도입되었습니다.", "origin": "L. Šmejkal, J. Sinova, T. Jungwirth 등이 주도적으로 제안했습니다.", "connections": "g-wave, d-wave magnetism, Hall effect without net magnetization"}, {"term": "Spin-resolved ARPES (SARPES)", "why_emerged": "전자 구조의 에너지와 운동량뿐만 아니라 전자의 스핀 상태를 직접 측정하기 위해 개발되었습니다.", "origin": "초록 정보만으로는 특정하기 어려우나 모트 산란(Mott scattering) 등을 이용해 구현되었습니다.", "connections": "Topological insulators, Rashba effect"}, {"term": "Resistance anisotropy switching", "why_emerged": "자성체의 도메인 방향에 따라 전기 저항이 바뀌는 현상을 이용해 비휘발성 메모리 소자를 만들기 위해 연구됩니다.", "origin": "자기저항(Magnetoresistance) 연구의 발전 형태입니다.", "connections": "AFM memory, AMR effect"}], "english_summary": ["Experimentally demonstrated deterministic p-wave spin symmetry in the odd-parity magnet CeNiAsO using ARPES and spin-resolved ARPES.", "Identified bulk spin-split band structures that match p-wave magnetic symmetry, characterized by a single degenerate plane.", "Observed giant resistance anisotropy and successful switching between resistance states through magnetic field-induced domain selection.", "The findings position CeNiAsO as a key material for exploring the interplay between odd-parity magnetism, superconductivity, and spintronics."]}}, {"title": "Strongly-coupled hybrid lattice-plasmons in layered cuprates", "journal": "arXiv_CondMat", "source": "author whitelist", "link": "https://arxiv.org/abs/2605.29100", "authors": "Ke-Jun Xu, Nathan Giles-Donovan, Stefano Agrestini, et al.", "last_authors": "Robert J. Birgeneau, Wei-Sheng Lee", "summary": "arXiv:2605.29100v1 Announce Type: new Abstract: Metallic systems with delocalized valence electrons host collective charge density oscillations known as plasmons. On the other hand, conventional insulators do not have free electrons and the low energy charge degrees of freedom are pinned to the ions. The fate of the collective charge excitations in the intermediate regime is an outstanding question. This problem is especially important for strongly correlated systems such as the layered cuprates, where unconventional superconductivity and other emergent phenomena arise from valence electrons on the border between Mott localization and itinerancy. Using resonant inelastic X-ray scattering, we track this evolution in the prototypical electron-doped cuprate Nd2-xCexCuO4. We find a continuous transformation of the low-energy charge response: from an acoustic plasmon in the metallic regime, to a gapped hybrid mode at intermediate doping, and finally to a nearly dispersionless 139 meV excitation at half filling. Remarkably, the 139 meV excitation has approximately twice the energy of the oxygen breathing phonon responsible for the dispersion kink observed in angle-resolved photoemission spectroscopy, and is consistent with a putative 2-phonon excitation observed in Raman spectroscopy. These results establish a unified picture of collective charge excitations across the phase diagram of electron-doped cuprates, showing that such modes persist across the Mott transition via strong coupling to lattice degrees of freedom and revealing a missing link in the charge dynamics of carrier doped Mott insulators.", "tier": "A_MUST_READ", "score": "10", "reason": "author whitelist: Zhi-Xun Shen", "tags": ["angle-resolvedphotoemission", "photoemission", "unconventionalsuperconductivity", "cuprate", "superconduct", "correlated", "Mott", "phonon"], "image": "https://arxiv.org/static/browse/0.3.4/images/arxiv-logo-fb.png", "briefing": {"background": "금속의 자유 전자 진동인 플라즈몬과 절연체의 격자 진동이 상호작용하는 영역, 특히 모트 절연체(Mott insulator) 경계에서의 전하 역학은 구리 산화물 초전도체의 핵심 난제 중 하나입니다.", "motivation": "전자 도핑된 구리 산화물 Nd2-xCexCuO4에서 도핑 농도에 따른 전하 여기(charge excitation)의 진화를 추적하여 플라즈몬과 격자 간의 결합 원리를 이해하고자 합니다.", "result": "RIXS 측정을 통해 금속 영역의 음향 플라즈몬(acoustic plasmon)이 도핑 농도가 변함에 따라 갭이 있는 하이브리드 모드로 바뀌고, 반-충진(half-filling) 상태에서는 139 meV의 비분산 여기로 변하는 것을 확인했습니다. 이 139 meV 에너지는 ARPES 꼬임(kink)의 원인인 산소 브리딩 포논 에너지의 약 두 배에 해당합니다.", "implication": "모트 전이 과정에서도 전하 여기가 사라지지 않고 격자 자유도와의 강한 결합을 통해 하이브리드 모드 형태로 지속됨을 보여줌으로써, 도핑된 모트 절연체의 전하 역학에 대한 통일된 그림을 제공합니다.", "novelty": "Zhi-Xun Shen, Wei-Sheng Lee 등 거물급 연구자들이 참여한 연구로, ARPES에서 관찰되던 포논 효과와 RIXS의 전하 여기를 '하이브리드 격자-플라즈몬'이라는 개념으로 연결했다는 점이 혁신적입니다.", "unresolved": "이 하이브리드 모드가 비전통적 초전도 현상의 페어링 메커니즘에 직접적으로 어떻게 기여하는지는 여전히 논쟁의 여지가 있습니다.", "future_work": "다른 계열의 구리 산화물이나 니켈 산화물(nickelates)에서도 유사한 하이브리드 모드가 존재하는지 탐색하여 보편성을 확인할 것으로 보입니다.", "concepts": [{"term": "Resonant Inelastic X-ray Scattering (RIXS)", "why_emerged": "강하게 상관된 물질에서 전하, 스핀, 격자, 궤도 여기를 동시에 관찰하기 위해 개발되었습니다.", "origin": "고휘도 방사광 가속기 기술 발전과 함께 성숙되었습니다.", "connections": "ARPES, Neutron scattering, magnons"}, {"term": "Acoustic plasmon", asurements, we observe the emergence of non-reciprocal second-harmonic magnetotransport signals and a zero-field superconducting diode effect, accompanied by a pronounced reduction of the out-of-plane coherence length with decreasing thickness. Upper critical field measurements further reveal a dimensional crossover from three-dimensional superconductivity in bulk to two-dimensional superconductivity in thin flakes. These findings indicate a thickness-induced chiral superconducting phase that breaks both inversion and time-reversal symmetries in the two-dimensional limit. Our work not only clarifies long-standing controversies regarding the pairing symmetry in CsV3Sb5, but also establishes thin-flake kagome superconductors as a versatile platform for engineering nonreciprocal quantum devices and exploring emergent topological phases.", "tier": "A_MUST_READ", "score": "10", "reason": "title strong match: CsV3Sb5", "tags": ["kagome", "CsV3Sb5", "V3Sb5", "superconduct", "topological", "transport"], "image": "https://arxiv.org/html/2605.29665v1/x1.png", "briefing": {"background": "카고메 격자 구조를 가진 CsV3Sb5는 전하 밀도파(CDW)와 초전도 현상이 공존하며, 기하학적 좌절로 인한 특이한 전자 구조로 인해 최근 고체 물리학계의 핵심 연구 대상입니다. 특히 이 물질의 초전도 대칭성이 s-wave인지 혹은 시간 역전 대칭성이 깨진 위상적 상태인지는 학계의 오랜 논쟁거리였습니다.", "motivation": "벌크 CsV3Sb5는 대체로 통상적인 s-wave 초전도체로 간주되어 왔으나, 원자 단위로 얇은 박막에서는 비가역적 수송 특성이 보고되는 등 상충하는 결과들이 존재했습니다. 본 연구는 두께에 따른 물성 변화를 추적하여 이러한 모순을 해결하고자 했습니다.", "result": "두께가 얇아짐에 따라 3차원 초전도에서 2차원 초전도로의 교차가 발생함을 확인했습니다. 특히 박막 한계에서는 반전 대칭성과 시간 역전 대칭성이 동시에 깨진 '카이랄 비가역 초전도' 상태가 나타나며, 외부 자기장 없이도 한쪽 방향으로만 전류가 흐르는 '무자기장 초전도 다이오드 효과'를 관찰했습니다.", "implication": "CsV3Sb5에서 보고된 초전도 대칭성 논란이 '차원성(두께)'에 기인한 것임을 시사합니다. 이는 두께 조절을 통해 기존 벌크 물질에서 볼 수 없던 위상적 초전도 상태를 유도할 수 있음을 의미합니다.", "novelty": "카고메 금속에서 두께 변화를 변수로 삼아 통상적인 초전도에서 카이랄 초전도로의 상전이를 명확히 입증했다는 점이 혁신적입니다. 독자의 관심사인 CsV3Sb5의 시간 역전 대칭성 파괴(TRSB)와 초전도성 결합 문제를 직접적으로 다룹니다.", "unresolved": "박막 상태에서 시간 역전 대칭성이 깨지는 구체적인 미시적 메커니즘(예: 루프 전류와의 연관성 등)은 추가적인 ARPES나 STM 연구를 통해 확인될 필요가 있습니다.", "future_work": "박막 기반의 비가역 양자 소자(초전도 다이오드 등)의 효율 개선과, 다른 카고메 초전도체(AV3Sb5 계열)로의 일반화 연구가 기대됩니다.", "concepts": [{"term": "슈퍼컨덕팅 다이오드 효과 (Superconducting Diode Effect)", "why_emerged": "초전도 전류의 비가역적 흐름을 제어하여 차세대 저전력 논리 회로 및 소자를 개발하기 위해 필요해졌습니다.", "origin": "2020년경 Nb/V/Ta 초격자 등 반전 대칭성이 깨진 시스템에서 본격적으로 보고됨.", "connections": "비가역 수송 현상, 파리-카스피 효과, 라쉬바 스핀-궤도 결합"}, {"term": "카이랄 초전도 (Chiral Superconductivity)", "why_emerged": "시간 역전 대칭성을 깨뜨리는 독특한 위상적 질서를 가진 초전도 상태를 설명하기 위해 제안되었습니다.", "origin": "초록 정보만으로는 특정하기 어려우나, 역사적으로 Sr2RuO4 등에서 활발히 논의됨.", "connections": "시간 역전 대칭성 파괴(TRSB), 쿠퍼 쌍의 궤도 각운동량, 마요라나 페르미온"}], "english_summary": ["Observed a thickness-driven crossover from bulk s-wave to 2D chiral superconductivity in CsV3Sb5.", "Demonstrated a zero-field superconducting diode effect in ultrathin flakes, signaling broken inversion and time-reversal symmetries.", "Resolved discrepancies regarding the pairing symmetry of kagome metals by identifying dimensionality as a key tuning parameter.", "Establishes thin-flake kagome systems as a platform for nonreciprocal quantum devices."]}}, {"title": "Topological Lifshitz transition-induced bipolarity of anomalous Nernst effect in kagome magnet YCo3 (Advanced Quantum Technologies)", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2605.29297", "authors": "Sheng Xu, Yue-Yang Wu, Hao-Ran Bai, et al.", "last_authors": "Qian Tao, Zhu-An Xu", "summary": "arXiv:2605.29297v1 Announce Type: new Abstract: The kagome lattice, renowned for hosting topological band structures and rich magnetic behaviors, offers an exceptional setting to investigate unconventional transport in magnetic topological systems. Controlling the polarity of the anomalous Nernst effect (ANE) is crucial for designing flexible thermoelectric devices, such as thermopiles, where the ability to switch the thermoelectric voltage sign can dramatically enhance energy conversion efficiency and output. Here, we demonstrate such a bipolar ANE in the kagome magnet YCo3, driven by a temperature-induced topological Lifshitz transition. With a Curie temperature TC~225 K, sizable anomalous Hall and Nernst effects emerge below TC. Supported by the first-principles calculations, the AHE and ANE are suggested to be dominated by the intrinsic mechanism. Furthermore, the intrinsic anomalous Hall conductivity exhibits a piecewise-linear dependence on magnetization, with an abrupt slope change near 100 K, consistent with the Karplus-Luttinger mechanism. Concurrently, the anomalous Nernst coefficient SAyx reverses its sign around the same temperature, realizing the crucial bipolarity. These anomalies could be interpreted as a topological Lifshitz transition, enabled by the evolution of Co moments that could shift the Fermi level relative to Weyl nodes. Our work reveals YCo3 as a prototypical kagome magnet where temperature and magnetism directly govern both Weyl node topology and the bipolar ANE, opening a pathway to magnetically control thermoelectric output in topological quantum materials.", "tier": "A_MUST_READ", "score": "10", "reason": "Direct hit: Kagome magnet, anomalous Hall/Nernst, Weyl nodes, and topological transitions.", "tags": ["material:YCo3", "topic:kagome", "topic:anomalous-hall", "topic:Weyl"], "image": "https://arxiv.org/static/browse/0.3.4/images/arxiv-logo-fb.png", "briefing": {"background": "카고메 자성체는 밴드 구조 내의 베리 곡률(Berry curvature)과 자기 질서 사이의 상호작용으로 인해 거대한 이상 홀 효과(AHE)와 이상 네른스트 효과(ANE)를 나타낼 수 있어 열전 에너지 변환 분야에서 주목받고 있습니다.", "motivation": "열전 소자의 효율을 극대화하려면 열전 전압의 부호(극성)를 자유롭게 제어할 수 있어야 합니다. 본 연구는 카고메 자성체 YCo3에서 온도와 자기 구조 변화를 통해 이러한 제어 가능성을 탐구했습니다.", "result": "YCo3에서 온도 변화에 따라 이상 네른스트 계수(SAyx)의 부호가 반전되는 '바이폴라(Bipolar)' 현상을 발견했습니다. 이는 약 100K 근처에서 발생하는 토폴로지컬 립쉬츠 전이(Topological Lifshitz transition)에 기인하며, Co 모멘트의 진화가 페르미 준위를 웨일 노드(Weyl nodes)에 대해 상대적으로 이동시키기 때문임을 밝혔습니다.", "implication": "자성 카고메 재료에서 온도와 자기 모멘트를 조절함으로써 위상적 수송 특성을 정밀하게 제어할 수 있음을 보여주며, 이는 고효율 위상 열전 소자 설계에 중요한 지침을 제공합니다.", "novelty": "YCo3라는 특정 카고메 자성체에서 자성-위상-수송 특성 사이의 직접적인 상관관계를 입증했으며, 특히 이상 네른스트 효과의 부호 반전을 립쉬츠 전이와 연결한 점이 돋보입니다.", "unresolved": "실제 소자 응용을 위해 이러한 부호 반전 현상이 나타나는 온도 범위를 상온 근처로 확장하거나 조절하는 기술적 과제가 남아 있습니다.", "future_work": "도핑이나 압력 인가를 통해 립쉬츠 전이 온도를 제어하는 실험과, 웨일 노드의 이동을 ARPES로 직접 관측하는 연구가 뒤따를 것으로 보입니다.", "concepts": [{"term": "이상 네른스트 효과 (Anomalous Nernst Effect)", "why_emerged": "자성체 내 온도 구배가 자기화와 수직한 방향으로 전압을 생성하는 현상을 설명하기 위해 등장했습니다.", "origin": "19세기 후반 에팅스하우젠과 네른스트가 발견한 효과의 자성 버전.", "connections": "이상 홀 효과(AHE), 베리 곡률, 열전 발전"}, {"term": "토폴로지컬 립쉬츠 전이 (Topological Lifshitz Transition)", "why_emerged": "전자 구조의 위상적 특징(예: 웨일 노드, 디락 노드)이 페르미 준위를 통과하거나 생성/소멸될 때 발생하는 물성 변화를 설명하기 위해 필요합니다.", "origin": "1960년 일리야 립쉬츠가 제안한 전자 계면의 위상 변화 개념에서 유래.", "connections": "페르미면 재구조화, 상태 밀도(DOS) 특이점, Weyl 반금속"}], "english_summary": ["Reported a temperature-induced bipolar anomalous Nernst effect (ANE) in the kagome magnet YCo3.", "The sign reversal of ANE is attributed to a topological Lifshitz transition driven by Co moment evolution.", "First-principles calculations support that the Berry curvature-induced intrinsic mechanism dominates transport properties.", "Provides a strategy for magnetic and thermal control of thermoelectric output in topological kagome systems."]}}, {"title": "Bosonization solution of the Kondo lattice in a Luttinger liquid", "journal": "PRB_Recent", "source": "keyword", "link": "http://link.aps.org/doi/10.1103/7sdw-cdzp", "authors": "Tomás Bortolin, C. J. Bolech, Nayana Shah, Aníbal Iucci", "last_authors": "Nayana Shah, Aníbal Iucci", "summary": "Author(s): Tomás Bortolin, C. J. Bolech, Nayana Shah, and Aníbal Iucci We address the physics of a regular arrangement of independent magnetic impurities embedded in a band of interacting electrons. We focus on the one-dimensional case that can be studied using bosonization and in which the electron bulk is described by a Luttinger liquid. The impurity spins interact w… [Phys. Rev. B 113, 195151] Published Wed May 27, 2026", "tier": "A_MUST_READ", "score": "9", "reason": "title strong match: Luttinger liquid", "tags": ["Luttinger", "Kondo"], "image": "", "briefing": {"background": "1차원 전자 시스템은 상호작용의 효과가 극대화되어 페르미 액체 이론이 아닌 러팅거 액체(Luttinger liquid) 이론으로 기술됩니다. 여기에 주기적인 자기 불순물이 추가된 '콘도 격자(Kondo lattice)' 모델은 강상관 계의 복잡한 물리 현상을 이해하는 중요한 이론적 틀입니다.", "motivation": "상호작용하는 1차원 전자 환경 내에 내포된 스핀 불순물들이 전체 시스템의 기저 상태와 여기 상태에 미치는 영향을 보존화(bosonization) 기법을 통해 수학적으로 엄밀하게 풀어내고자 했습니다.", "result": "러팅거 액체 내의 콘도 격자 모델에 대한 보존화 해법을 제시했습니다. 이를 통해 불순물 스핀과 상호작용하는 벌크 전자들 사이의 물리적 관계를 규명했으며, 특히 스핀-전하 분리 현상이 있는 1차원 계에서 콘도 효과가 어떻게 나타나는지 분석했습니다.", "implication": "1차원 준금속이나 전하 밀도파(CDW) 물질 등에서 나타나는 자성 불순물 효과를 해석하는 데 강력한 이론적 도구를 제공합니다. 러팅거 액체 특성을 가진 NbSe3나 TaNiTe2 같은 물질의 물리 해석에 기여할 수 있습니다.", "novelty": "기존의 단일 불순물 콘도 효과 연구를 넘어, 상호작용이 존재하는 러팅거 액체 배경에서의 격자 구조 불순물 문제를 보존화로 정교하게 다루었다는 점이 이론적으로 중요합니다.", "unresolved": "제시된 이론적 해법이 실제 1차원 소재의 실험 데이터(예: 저온 저항 거동 등)와 얼마나 정밀하게 일치하는지에 대한 검증이 더 필요합니다.", "future_work": "차원성이 낮은 준-1차원 유기 전도체나 전이금속 칼코겐 화합물(TMD)에서의 자기 수송 실험 결과와 이론을 비교하는 연구가 예상됩니다.", "concepts": [{"term": "보존화 (Bosonization)", "why_emerged": "1차원 페르미온 계의 복잡한 다체 문제를 단순한 조화 진동자 형태의 보존(boson) 필드로 변환하여 풀기 위해 고안되었습니다.", "origin": "1950-70년대에 Tomonaga, Luttinger, Haldane 등에 의해 확립됨.", "connections": "러팅거 액체, 스핀-전하 분리, 1차원 양자 자성체"}, {"term": "콘도 격자 (Kondo Lattice)", "why_emerged": "금속 내에 희박하게 존재하는 불순물 연구를 넘어, 결정 격자마다 존재하는 자기 모멘트와 전도 전자 간의 집단적 상호작용을 연구하기 위해 도입되었습니다.", "origin": "1960년대 준 콘도(Jun Kondo)의 연구 이후 중거운 페르미온 시스템 연구를 위해 확장됨.", "connections": "중거운 페르미온, RKKY 상호작용, 양자 임계점"}], "english_summary": ["Presented a bosonization-based solution for a Kondo lattice embedded in a 1D Luttinger liquid.", "Investigated the interplay between impurity spins and an interacting electron bulk in one dimension.", "Analyzes how spin-charge separation affects the Kondo physics in strongly correlated systems.", "Theoretical framework applicable to quasi-1D materials like NbSe3 or telluride systems."]}}, {"title": "Emergence of a distinct density wave state in ultrathin  다체 물성 연구를 위한 궤도 수준의 정밀한 이해를 가능하게 하여, 위상학적 혹은 강상관 준결정 물질 설계에 기여합니다.", "novelty": "광전자 분광법을 통해 4f 궤도를 직접 분해 관측한 결과로서, 일반적인 고체 물성 연구뿐만 아니라 준결정 전자 구조의 본질을 파헤친 최신 연구입니다.", "unresolved": "이러한 4f 궤도의 배치가 실제 저온에서의 자기적 정렬이나 전도도에 기여하는 구체적인 경로와 메커니즘은 추가 연구가 필요합니다.", "future_work": "다른 희토류 원소로 치환한 계열과의 비교 연구 및 자기장이 인가된 상태에서의 광전자 분광 실험.", "concepts": [{"term": "Quasicrystal Approximant", "why_emerged": "준결정의 국소 구조를 대규모 단위 세포로 모방하여 결정학적으로 분석 가능하게 한 물질계.", "origin": "Dan Shechtman의 준결정 발견 이후 구조적 이해를 위해 도입됨.", "connections": "Heavy fermion, Kondo lattice 시스템과 이론적 연결 고리가 있음."}, {"term": "Orbital-resolved PES", "why_emerged": "강상관 물질에서 특정 궤도의 기여도를 분리하여 다체 상태를 이해하기 위해 필요함.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "DFT+DMFT와 같은 이론적 계산 결과와 직접적인 비교가 가능함."}], "english_summary": ["Orbital-resolved photoemission study on Cd6Ce, a prototype Tsai-type quasicrystal approximant.", "Utilized both soft and hard X-ray sources to probe electronic states.", "Identified the role of 4f orbitals in the strongly correlated electronic structure.", "Deepens the understanding of rare-earth-based quasi-periodic systems."]}}, {"title": "Tracking the local order parameter through the Hubbard exciton decoherence time in the Mott-Hubbard insulator LaVO3", "journal": "PRB_Recent", "source": "author whitelist", "link": "http://link.aps.org/doi/10.1103/9zzp-8gkz", "authors": "Alessandra Milloch, Paolo Franceschini, Pablo Villar-Arribi, et al.", "last_authors": "Massimo Capone, Claudio Giannetti", "summary": "Author(s): Alessandra Milloch, Paolo Franceschini, Pablo Villar-Arribi, Sandeep Kumar Chaluvadi, Pasquale Orgiani, Giancarlo Panaccione, Giorgio Rossi, Yang Liu, Darrell G. Schlom, Kyle M. Shen, Massimo Capone, and Claudio Giannetti The prototypical Mott-Hubbard insulator ${\\mathrm{LaVO}}_{3}$ undergoes a structural phase transition accompanied by the onset of spin and orbital ordering below 140 K. By combining ultrafast optical pump-probe spectroscopy and two-dimensional electronic spectroscopy, we investigate the interplay be… [Phys. Rev. B 113, 205146] Published Tue May 26, 2026", "tier": "A_MUST_READ", "score": "9", "reason": "author whitelist: Kyle M. Shen", "tags": ["Mott", "Hubbard"], "image": "", "briefing": {"background": "Mott-Hubbard 절연체는 강력한 전자 상관 관계 때문에 전자가 국소화되어 절연체 상태를 유지하는 물질입니다. LaVO3와 같은 물질은 구조, 스핀, 궤도 정렬이 서로 얽혀 있어 비평형 상태에서의 동역학 연구가 활발합니다.", "motivation": "LaVO3의 구조 및 정렬 상전이 과정에서 나타나는 들뜸(exciton) 현상을 초고속 분광학을 통해 관찰하여, 국소 질서 변수(local order parameter)와의 관계를 밝히고자 했습니다.", "result": "Hubbard 엑시톤의 결맞음 시간(decoherence time)을 추적함으로써, 물질의 구조적/자기적 질서가 형성되는 동역학적 과정을 성공적으로 관찰했습니다.", "implication": "초고속 광학 분광법이 강상관 물질의 정적 질서 매개변수를 측정하는 강력한 도구가 될 수 있음을 입증했습니다.", "novelty": "Kyle M. Shen 등 전문가 그룹이 참여하여 Mott 절연체의 동역학적 특성을 2차원 전자 분광학으로 풀어낸 점이 주목할 만합니다.", "unresolved": "엑시톤의 붕괴 과정에서 격자 구조의 변화가 결맞음 시간에 미치는 구체적인 비조화 효과(anharmonic effect)는 미해결 과제입니다.", "future_work": "비평형 상태에서의 엑시톤 제어를 통한 새로운 양자상 유도 실험.", "concepts": [{"term": "Hubbard Exciton", "why_emerged": "Mott 절연체에서 전자-정공 쌍이 허바드 밴드 내에서 형성되는 들뜸 상태.", "origin": "Mott insulator 물성 연구 과정에서 자연스럽게 파생됨.", "connections": "초고속 분광학을 통한 강상관 전자계 제어 연구의 핵심 주제."}, {"term": "2D Electronic Spectroscopy", "why_emerged": "복잡한 다체 상태의 들뜸 현상을 시간-에너지 영역에서 고해상도로 분석하기 위해 도입.", "origin": "광화학/분자물리학에서 발전하여 고체 물리학으로 도입됨.", "connections": "Ultrafast pump-probe 기법의 확장형."}], "english_summary": ["Studied the Mott-Hubbard insulator LaVO3 using ultrafast and 2D electronic spectroscopy.", "Linked the Hubbard exciton decoherence time to the local order parameter.", "Probed the interplay between spin, orbital, and structural ordering transitions.", "Provides insights into non-equilibrium dynamics of correlated insulators."]}}, {"title": "Observation of quantum vortex core fractionalization and skyrmion formation in a superconductor", "journal": "Science", "source": "author whitelist", "link": "https://doi.org/10.1126/science.ads0189", "authors": "Yu Zheng, Quanxin Hu, Xin Yu, et al.", "last_authors": "Chi-Ming Yim, Hong Ding", "summary": "Magnetic fields can penetrate a superconductor in the form of quantum vortices, which consist of a core singularity with circulating currents. London’s quantization implies that there is one core singularity per quantum of magnetic flux in single-component superconductors. Here, we report signatures of quantum vortex core fractionalization on the potassium-terminated surface of a multiband superconductor KFe 2 As 2 . The observed splitting of single integer-flux vortices into several fractional vortices results in a disparity between the numbers of flux quanta and vortex cores. These fractional vortices often arrange in chains, which calculations show are characterized by a ℂP 2 skyrmionic topological invariant; this constitutes a different type of topological defect: the chiral skyrmion. The disparate natures of integer and fractional vortices comprising skyrmions lead to distinct spectroscopic signatures.", "tier": "A_MUST_READ", "score": "9", "reason": "author whitelist: Hong Ding", "tags": ["superconduct", "topological"], "image": "", "briefing": {"background": "초전도체 내 자기장이 침투할 때 발생하는 양자 소용돌이(vortex)는 통상 정수배의 자기 선속 양자를 가지는 코어 구조를 가집니다. 위상학적 물리 분야에서는 이러한 소용돌이의 구조적 변형과 양자 현상을 이해하는 것이 핵심 과제입니다.", "motivation": "다중 밴드 초전도체인 KFe2As2 표면에서 관찰되는 비정상적인 소용돌이 코어 구조가 단순한 결함인지, 혹은 새로운 위상학적 상태를 의미하는지 규명하고자 함.", "result": "정수 단위의 자속이 여러 개의 분수 소용돌이(fractional vortex)로 쪼개지는 현상을 관찰했습니다. 이는 CP2 스카이르미온(skyrmion) 위상 불변량으로 설명되는 새로운 형태의 위상 결함임을 확인했습니다.", "implication": "초전도체 내에서 기존의 아브리코소프(Abrikosov) 소용돌이 이론을 넘어서는 분수화된 위상학적 상태가 존재함을 입증하며, 위상학적 양자 물질의 새로운 탐색 경로를 제시합니다.", "novelty": "Hong Ding 그룹의 정교한 실험을 통해 초전도 소용돌이의 분수화와 스카이르미온 형성이라는 이론적 예측을 실공간에서 분광학적으로 처음으로 검증했습니다.", "unresolved": "이러한 분수화된 소용돌이들이 전체 초전도 상태의 전역적인 특성과 어떻게 결합하는지, 그리고 외부 자기장과의 상호작용에서 나타나는 동역학적 특성은 아직 충분히 연구되지 않았습니다.", "future_work": "다른 다중 밴드 초전도체에서의 유사성 검증 및 소용돌이 격자 내에서 형성되는 스카이르미온 체인의 동역학적 거동 관찰.", "concepts": [{"term": "Quantum vortex core fractionalization", "why_emerged": "다중 밴드 초전도체에서 개별 밴드가 독립적인 소용돌이 코어 상태를 가질 수 있다는 이론적 배경에서 등장.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "Abrikosov vortex, Multiband superconductivity"}, {"term": "CP2 skyrmion", "why_emerged": "고차원 위상 결함을 기술하기 위해 복소 사영 공간의 위상학적 성질을 도입할 필요가 생김.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "Topological defects, Magnetic skyrmions"}], "english_summary": ["Observed fractionalization of integer magnetic flux vortices in KFe2As2 superconductor.", "Identified the formation of CP2-type skyrmion topological defects in vortex chains.", "Demonstrated unique spectroscopic signatures distinguishing integer and fractional vortices.", "Provides evidence for complex topological order in multiband superconducting systems."]}}, {"title": "Femtosecond modulation of electron correlations in a Luttinger liquid", "journal": "Science_Advances", "source": "keyword", "link": "https://doi.org/10.1126/sciadv.aec7494", "authors": "Na Li, Umang Mehta, Matin Lebrat, et al.", "last_authors": "Rahul Nandkishore, Margaret M. Murnane", "summary": "Luttinger liquids emerge in one-dimensional metals with strong electron interactions, exhibiting intriguing near-equilibrium properties such as spin-charge separation and power-law correlations. Although these interactions suggest fast, distinctive out-of-equilibrium dynamics, such phenomena remain largely unexplored on ultrashort timescales. Here, we use femtosecond laser excitation to weakly deplete the electron density in the Luttinger band of Li 0.9 Mo 6 O 17 and track the response via time- and angle-resolved photoemission spectroscopy. By fitting the measured electron distributions to a finite-temperature Luttinger liquid model, we observe a fast drop in the Luttinger exponent, quantifying the strength of electron interactions. Subsequently, unlike hot electrons in conventional Fermi liquids that slowly relax within picoseconds via electron-phonon coupling, hot electrons in Li 0.9 Mo 6 O 17 relax within a short time of ~100 femtoseconds, through the excitation of a nonequilibrium colle anipulating many-body interactions on ultrashort timescales."]}}, {"title": "Atomic-Scale Observation of Symmetry Breaking in Altermagnetic MnTe", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2605.27543", "authors": "Guodong Ren, Jonathan M. DeStefano, Xiao-Wei Zhang, et al.", "last_authors": "Jiun-Haw Chu, Juan Carlos Idrobo", "summary": "arXiv:2605.27543v2 Announce Type: replace Abstract: The recent discovery of altermagnetism has sparked growing interest in compensated magnetic systems as promising platforms for highly scalable spintronics. Altermagnetism is a distinct magnetic order where opposite spin sublattices are connected by rotation, yielding zero net magnetization but momentum-dependent spin splitting. To date, experimental verification of altermagnetic order has been achieved predominantly through bulk-sensitive techniques, including spin-dependent electronic spectra and transport responses. However, direct atomic-scale evidence that explicitly correlates crystal symmetry, local structural distortions, and magnetic ordering has remained unexplored. Here, we report the direct atomic-scale observation of coexisting polar distortions and altermagnetic order in MnTe, combining atomic resolution scanning transmission electron microscopy (STEM) imaging with electron magnetic chiral dichroism (EMCD) measurements. We reveal that MnTe is not an ideal uniform P63/mmc g-wave altermagnet at the atomic scale. Instead, it hosts ubiquitous inversion-symmetry-breaking distortions that lower the spin-space-group (SSG) symmetry, admits d-wave altermagnetic components, and in lower-symmetry regimes, even allow s-wave spin splitting (net magnetization). The coexistence of ferroelectric signatures and altermagnetic order establishes local lattice symmetry in MnTe as a control knob for altermagnetic spin splitting, spin current generation, and multiferroic memory applications.", "tier": "A_MUST_READ", "score": "9", "reason": "Atomic-scale ex ambly de Laissardi\\`ere", "summary": "arXiv:2511.22714v2 Announce Type: replace Abstract: We demonstrate the emergence of a robust tetrahedral magnetic ground state in monolayer graphene doped to the van Hove singularity (vHS). This noncoplanar, gapped spin configuration - featuring four equally inclined moments - has been previously identified as a candidate instability. Here, not only do we confirm its stability across all finite interactions using fully self-consistent, real-space-resolved calculations, but we also go beyond earlier work by charting the full surrounding phase diagram. In doing so, we unravel a cascade of symmetry-broken magnetic states - pseudo-tetrahedral, planar, collinear, and modulated textures - which we classify using spin structure factors and vector order parameters. These results stem from unrestricted Hartree-Fock simulations on large supercells with dense k-point sampling, enabling us to resolve interaction-driven magnetic and charge inhomogeneities. Our findings connect directly with recent ARPES and doping experiments near the vHS in graphene, and establish the tetrahedral state as the central correlated instability in this regime, offering predictive insight into emergent magnetism in correlated Dirac materials.", "tier": "A_MUST_READ", "score": "9", "reason": "Strongly correlated Dirac material study with explicit connections to ARPES and vHS experiments.", "tags": ["theory", "graphene", "correlated", "ARPES"], "image": "https://arxiv.org/html/2511.22714v2/x1.png", "briefing": {"background": "그래핀을 도핑하여 van Hove singularity(vHS) 근처로 보내면 상태 밀도가 급격히 증가하여 전자 간 상호작용이 지배적인 상태가 되며, 다양한 자성/전하 불안정성이 발생합니다.", "motivation": "그래핀 vHS 근처에서 제안된 '사면체(tetrahedral) 자기 상태'가 실제 강상관 상호작용 하에서 안정적인지, 그리고 주변에 어떤 상들이 존재하는지 체계적으로 분석하고자 합니다.", "result": "대규모 Hartree-Fock 계산을 통해 사면체 자기 상태가 매우 견고함을 입증하고, 이를 중심으로 파생되는 다양한 자기적 위상 도표를 완성했습니다.", "implication": "그래핀의 강상관 Dirac 물질 연구에서 이론적 기준점이 될 수 있으며, ARPES 및 도핑 실험 결과들과 정성적인 일치를 보여줍니다.", "novelty": "기존 연구보다 더 넓은 , "1T-VSe2"], "image": "", "briefing": {"background": "1T-VSe2는 전이금속 디칼코게나이드(TMD) 물질로, 저온에서 형성되는 전하 밀도 파(CDW)와 그에 수반되는 에너지 갭의 본질을 이해하는 것이 이 물질의 전자 구조 연구에서 핵심입니다.", "motivation": "CDW 상태에서 관찰되는 tunneling spectrum의 0 mV 부근 dip 구조가 실제 에너지 갭인지, 그리고 CDW 전이 온도 이상에서 어떻게 변하는지 STM/STS를 통해 명확히 규명하고자 함.", "result": "CDW 상태에서 관찰된 dip 구조가 상전이 온도 이상에서는 사라짐을 확인함으로써, 해당 구조가 1T-VSe2의 incommensurate CDW에 의한 에너지 갭임을 실험적으로 입증함.", "implication": "TMD 물질 내 CDW 형성 기작을 이해하는 데 있어 국소적인 전자 상태 분석(STS)의 중요성을 재확인하며, 여타 층상 물질의 CDW 연구에 가이드라인을 제공함.", "novelty": "STS를 통해 1T-VSe2의 CDW 갭을 직접적으로 관찰하여, 밴드 구조의 변화와 CDW 상전이 간의 직접적인 상관관계를 실험적으로 보여줌.", "unresolved": "이 incommensurate CDW가 어떠한 물리적 구동력(전자-포논 결합 또는 페르미 표면 중첩)에 의해 지배되는지에 대한 미세한 논의는 여전히 추가 연구가 필요함.", "future_work": "온도 변화에 따른 더 정밀한 STS 매핑을 통해 갭의 공간적 균일성을 분석하고, 도핑 등을 통한 갭의 조절 가능성 연구.", "concepts": [{"term": "Charge Density Wave (CDW)", "why_emerged": "물질 내 전자의 공간적 밀도가 주기적으로 변하는 기저 상태를 기술하기 위해 도입됨.", "origin": "Peierls에 의해 1차원 금속 시스템에서 제안됨.", "connections": "전자-포논 결합, 페르미 표면 중첩, 초전도체와의 경쟁 관계."}, {"term": "Incommensurate CDW", "why_emerged": "CDW의 주기가 격자의 주기와 정수비로 표현되지 않을 때 발생하며, 물질의 특이한 페르미 표면 구조를 반영함.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "Commensurate CDW, 솔리톤 격자, 고체 물리학의 상전이 이론."}, {"term": "STS (Scanning Tunneling Spectroscopy)", "why_emerged": "국소적인 상태 밀도(LDOS)를 원자 수준의 분해능으로 측정하기 위해 필수적임.", "origin": "Binnig와 Rohrer에 의해 발명됨.", "connections": "STM, quasi-particle interference (QPI), 밴드 구조 분석."}], "english_summary": ["Investigated the CDW energy gap in 1T-VSe2 using STM/STS techniques.", "Confirmed that the tunneling dip observed at 0 mV is associated with the incommensurate CDW state.", "The feature vanishes above the transition temperature, supporting the CDW origin.", "Provides experimental clarity on the electronic structure modification during the CDW phase transition."]}}, {"title": "Effect of symmetry breaking on altermagnetism in CrSb and formation of fragmented nodal curves", "journal": "PRB_Recent", "source": "Gemini", "lin ions": "Weyl semimetal, Dirac point, 베리 곡률."}, {"term": "MSSP (Momentum Space Spin Polarization)", "why_emerged": "운동량 공간에서 스핀 방향이 불균일하게 분포하는 현상을 정량화하기 위해 필요함.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "스핀-궤도 결합, 알터마그네틱 특성."}], "english_summary": ["Explores altermagnetism in CrSb by analyzing symmetry breaking effects.", "Identifies the mechanisms leading to momentum space spin polarization (MSSP).", "Discusses the formation of fragmented nodal curves in the electronic structure.", "Advances understanding of electronic properties in non-collinear antiferromagnetic systems."]}}, {"title": "Fermi surface geometry and momentum-dependent electron-phonon coupling drive the charge density wave in quasi-one-dimensional ZrTe3", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/yslr-zv4t", "authors": "Josu Diego, Matteo Calandra", "last_authors": "Josu Diego, Matteo Calandra", "summary": "Author(s): Josu Diego and Matteo Calandra ${\\mathrm{ZrTe}}_{3}$ is a prototypical quasi-one-dimensional compound undergoing a charge density wave (CDW) transition via a very sharp Kohn anomaly in phonon momentum space. While Fermi surface geometry has long been considered the primary driver of the instability, a full understanding of the la… [Phys. Rev. B 113, 174313] Published Fri May 22, 2026", "tier": "B_IMPORTANT_CONDMAT", "score": "9", "reason": "Direct hit: quasi-1D CDW material ZrTe3 with specific focus on Fermi surface and electron-phonon coupling.; demoted from A: broad CM, not direct user/project hit", "tags": ["theory", "ZrTe3", "CDW", "Fermisurface"], "image": "", "briefing": {"background": "ZrTe3는 quasi-1D 구조를 가진 물질로, 강한 CDW 불안정성을 나타내며 전자-포논 결합이 밴드 구조에 미치는 영향이 연구의 핵심입니다.", "motivation": "CDW 형성에 있어 기존에는 페르미 표면의 nesting(기하학)이 주된 원인으로 지목되었으나, momentum-dependent electron-phonon coupling의 역할을 명확히 규명하고자 함.", "result": "CDW 전이에 있어서 페르미 표면 기하학뿐만 아니라, 운동량에 의존적인 전자-포논 결합의 중요성을 입증하여 보다 완성된 CDW 모델을 제시함.", "implication": "Quasi-1D 물질의 CDW 물성을 이해 ce of thin films of the 3D topological insulator Sb2Te3.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Excellent quantum materials paper on topological insulators and Dirac cones with experimental relevance.", "tags": ["topologicalinsulator", "Diraccone", "quantummetric", "magnetoresistance"], "image": "https://media.springernature.com/m685/springer-static/image/art%3A10.1038%2Fs41563-026-02617-3/MediaObjects/41563_2026_2617_Fig1_HTML.png", "briefing": {"background": "3차원 위상 절연체는 표면에 금지된 후방 산란을 동반하는 헬리컬 Dirac 콘을 가져 차세대 전자소자 후보로 연구됩니다. 전하 수송 특성을 완전히 이해하려면 파동함수의 기하학적 정보인 베리 곡률과 양자 메트릭(Quantum Metric)에 대한 규명이 필수적입니다.", "motivation": "기존에는 주로 베리 곡률이 비선형 수송 현상에 미치는 영향이 강조되었습니다. 본 연구는 Sb2Te3 박막에서 양자 메트릭이 비선형 자기저항에 어떻게 기여하는지 실험적으로 분리하여 측정하고자 했습니다.", "result": "Sb2Te3 표면 Dirac 콘의 양자 메트릭이 비선형 자기저항에 직접적으로 기여한다는 것을 확인했습니다. 이는 파동함수의 중첩 구조가 거시적인 수송 현상에 투영될 수 있음을 보여줍니다.", "implication": "위상 물질의 기하학적 특성을 비선형 소자 제어에 활용할 수 있는 길을 열었습니다. 양자 메트릭 측정이 위상 물질의 물성 분석의 새로운 도구로 자리 잡을 가능성이 높습니다.", "novelty": "위상 절연체 표면 상태의 'Quantum Metric'을 비선형 자기저항 측정을 통해 실험적으로 직접 분리해냈다는 점이 핵심입니다. 이는 ARPES로 직접 보기 힘든 기하학적 정보를 수송 측정으로 확보했다는 점에서 가치가 큽니다.", "unresolved": "박막 두께 변화나 결함 상태가 양자 메트릭에 미치는 구체적인 영향은 향후 추가 검증이 필요합니다.", "future_work": "다양한 위상 절연체 및 위상 반금속으로의 확장 연구와 이를 활용한 고효율 비선형 홀 효과 소자 설계가 예상됩니다.", "concepts": [{"term": "Quantum Metric", "why_emerged": "파동함수의 중첩 구조와 Hilbert 공간 내의 거리를 정의하기 위해 필요합니다.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "Berry curvature, Quantum Geometry"}, {"term": "Topological Insulator", "why_emerged": "띠 구조의 위상적 불변량에 의해 결정되는 강인한 표면 상태를 구현하기 위해 등장했습니다.", "origin": "Kane & Mele (2005)", "connections": "Spin-orbit coupling, Dirac cone"}, {"term": "Nonlinear Magnetoresistance", "why_emerged": "선형 응답을 넘어 물질의 기하학적 특성(Quantum geometry)을 민감하게 탐지하기 위해 사용됩니다.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "Berry curvature dipole, Anomalous Hall effect"}], "english_summary": ["The study investigates the role of quantum metric in the nonlinear magnetoresistance of Sb2Te3 니다.", "unresolved": "실제 초전도 상태와의 직접적인 상관관계나 도핑에 따른 전자 구조 변화에 대한 추가적인 상세 데이터가 필요합니다.", "future_work": "도핑된 니켈산염 샘플에서의 ARPES/RIXS를 통한 궤도 의존적 상호작용 규명이 활발히 진행될 것으로 보입니다.", "concepts": [{"term": "SDW (Spin Density Wave)", "why_emerged": "금속 내 전자 스핀 밀도의 공간적 주기적 변조 현상을 기술하기 위해 필요합니다.", "origin": "Overhauser (1962)", "connections": "CDW, Unconventional superconductivity"}, {"term": "Planar Orbitals", "why_emerged": "전이금속 산화물의 평면 내 전도 특성과 자기적 상호작용을 결정하는 핵심 궤도를 정의하기 위해 사용됩니다.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "d-p hybridization, Hubbard model"}, {"term": "Nickelates", "why_emerged": "구리 산화물 초전도체의 전자 구조 모델링을 위한 대안적 물질 계열로 주목받았습니다.", "origin": "Anisimov et al. (1999)", "connections": "Cuprates, Mott insulators"}], "english_summary": ["This study examines the role of oxygen-centered planar orbitals in multilayer nickelates.", "Significant similarities in electronic structure and SDW reconstruction are observed between nickelates and cuprates.", "The results strengthen the hypothesis of a shared superconducting mechanism between these two material families.", "This insight provides a crucial step in understanding unconventional superconductivity."]}}, {"title": "7/3 fractional quantum Hall state in GaAs double quantum wells", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/f33x-cqrr", "authors": "Mandun Fu, Ian Farrer, David A. Ritchie, Sanjeev Kumar", "last_authors": "David A. Ritchie, Sanjeev Kumar", "summary": "Author(s): Mandun Fu, Ian Farrer, David A. Ritchie, and Sanjeev Kumar The authors show here how electrostatic coupling and spin physics reshape the 7/3 fractional quantum Hall state in an uncoupled GaAs bilayer system. Gate tuning balances an incompressible integer state ( ν =1) and a fragile fractional composite-fermion state ( ν =4/3), producing a double-minimum structure in longitudinal resistance within a single 7/3 Hall plateau. Tilt-angle measurements reveal that the evolution and merger of two minima are controlled by interlayer charge redistribution, composite-fermion spin polarization, and electron interactions. [Phys. Rev. B 113, 205433] Published Thu May 28, 2026", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Experimental study of fractional quantum Hall state in GaAs, a relevant condensed matter topic.", "tags": ["experiment", "quantumHall", "fractionalquantumHall", "GaAs"], "image": "", "briefing": {"background": "분수 양자 홀 효과(FQHE)는 강한 전자 상관관계에 의해 발현되며, 복합 페르미온(composite fermion) 가설을 통해 이해됩니다. 특히 다층 시스템에서는 층간 결합과 스핀 자유도가 더해져 매우 복잡한 기저 상태를 형성합니다.", "motivation": "GaAs 이중 양자 우물 구조에서 7/3 FQH 상태가 정전기적 결합과 스핀 물리에 의해 어떻게 변화하는지 정밀하게 제어하며 관찰하고자 했습니다.", "result": "게이트 전압을 통해 정수 홀 상태와 분수 상태 사이의 균형을 조절함으로써, 7/3 홀 plateau 내에서 이중 최소 구조를 발견했습니다.", "implication": "층간 전하 재분배와 스핀 분극이 FQHE 상태의 안정성에 결정적임을 확인했습니다. 이는 다층 시스템에서의 양자 상태 제어 가능성을 입증합니다.", "novelty": "게이트 튜닝을 통해 하나의 홀 plateau 내에서 분수 상태의 전이 과정을 실험적으로 포착한 점이 신선합니다. 양자 정보 처리를 위한 위상 상태 조작 연구와 맥락을 같이 합니다.", "unresolved": "발견된 이중 최소 구조의 미세한 에너지 간극과 위상적 전하의 정확한 거동에 대한 이론적 설명이 추가로 요구됩니다.", "future_work": "이러한 조절 가능한 다층 구조를 활용하여 비아벨 통계(non-Abelian statistics)를 확인하는 실험으로 이어질 가능성이 있습니다.", "concepts": [{"term": "Fractional Quantum Hall Effect", "why_emerged": "강한 자기장 하에서 전자간 상호작용으로 인해 분수 전하가 나타나는 현상을 설명하기 위해 필요합니다.", "origin": "Tsui, Stormer, Gossard (1982)", "connections": "Composite fermions, Topological order"}, {"term": "Composite Fermion", "why_emerged": "강한 상관관계를 가진 전자를 약하게 상호작용하는 입자로 재해석하여 FQHE를 이해하기 위해 제안되었습니다.", "origin": "Jain (1989)", "connections": "Chern-Simons theory, Fractional statistics"}, {"term": "Double Quantum Well", "why_emerged": "전자의 층간 결합을 제어하여 양자 상태의 설계 가능성을 극대화하기 위해 설계됩니다.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "Bilayer systems, Tunneling"}], "english_summary": ["The authors investigate the 7/3 fractional quantum Hall (FQH) state in uncoupled GaAs double quantum wells.", "Gate-tuning reveals a double-minimum structure in longitudinal resistance within the 7/3 plateau.", "The evolution of this state is driven by interlayer charge redistribution and spin polarization.", "This work demonstrates precise experimental control over complex quantum phases in bilayer systems."]}}, {"title": "Bulk thermal conductance of the 5/2 and 7/3 fractional quantum Hall states in the Corbino geometry", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/3mm9-47h9", "authors": "F. Boivin, M. Petrescu, Z. Berkson-Korenberg, K. W. West, L. N. Pfeiffer, and G. Gervais", "last_authors": "Z. Berkson-Korenberg, K. W. West, L. N. Pfeiffer, and G. Gervais", "summary": "Author(s): F. Boivin, M. Petrescu, Z. Berkson-Korenberg, K. W. West, L. N. Pfeiffer, and G. Gervais The peculiar 5/2 fractional quantum Hall state is a promising platform for fault-tolerant quantum computation, provided that the exact nature of its wave function can be understood. Here, using an exceptionally high-electron-mobility device patterned in the Corbino geometry, the authors report measurements of the pure bulk thermal conductance in the 5/2 and 7/3 fractional quantum Hall states. The data reveal a strong violation of the Wiedemann–Franz law, in agreement with a recent study published in N a t u r e , and suggest that the underlying wave function at filling factor 5/2 is particle–hole symmetric. [Phys. Rev. B 113, L201301] Published Thu May 21, 2026", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "High-quality experimental study of fractional quantum Hall states and their symmetries.", "tags": ["experiment", "quantumHall", "material"], "image": "", "briefing": {"background": "분수 양자 홀 효과(FQHE) 상태, 특히 5/2 충전 인자에서의 상태는 위상 양자 컴퓨터 구현을 위한 비아벨 통계 입자를 포함할 것으로 기대되는 중요한 연구 분야입니다.", "motivation": "5/2 및 7/3 FQHE 상태의 정확한 파동 함수를 규명하고, 입자-정공(particle-hole) 대칭성 존재 여부를 확인하고자 합니다.", "result": "Corbino 기하구조를 이용한 열 전도도 측정 결과, Wiedemann–Franz 법칙을 강하게 위배함을 확인했습니다. 이는 5/2 상태가 입자-정공 대칭적임을 강력히 시사합니다.", "implication": "5/2 상태의 파동 함수가 입자-정공 대칭성을 가진다는 주장에 무게를 실어주며, 비아벨 애니온의 특성을 이해하고 양자 컴퓨팅 활용 가능성을 높이는 기초 자료가 됩니다.", "novelty": "최고 품질의 고이동도 시료와 Corbino 기하구조를 사용하여 순수한 벌크 열 전도도를 측정함으로써 기존 측정의 모호함을 해결했습니다.", "unresolved": "측정 결과가 특정 이론적 모델을 강력히 지지하지만, 여전히 해당 상태의 전체적인 토폴로지적 분류에 대한 논쟁은 존재합니다.", "future_work": "다른 분수 충전 인자에서의 추가적인 열 측정과 더불어, 위상 양자 연산의 기반이 될 수 있는 준입자 간의 꼬임(braiding) 실험이 필요합니다.", "concepts": [{"term": "분수 양자 홀 효과", "why_emerged": "강한 자기장 하에서 2차원 전자 가스의 강한 상관관계에 의해 나타나는 양자화된 홀 저항 현상을 설명하기 위해 필요.", "origin": "Tsui, Stormer, Laughlin (1982)에 의해 발견 및 제안됨.", "connections": "Laughlin 파동함수, 컴포지트 페르미온, 비아벨 통계."}, {"term": "Wiedemann–Franz 법칙 위배", "why_emerged": "전하 수송과 열 수송의 비율이 일정한 금속성 거동에서 벗어나는 현상을 토폴로지 시스템에서 구분하기 위해 필요.", "origin": "고전적인 Wiedemann-Franz 법칙은 고전 금속 물리학에서 유래, 위배는 최근 토폴로지 시스템에서 활발히 연구됨.", "connections": "토폴로지 절연체, 중성 모드, 엣지 상태."}], "english_summary": ["Experimental measurement of bulk thermal conductance in 5/2 and 7/3 fractional quantum Hall states.", "Used a high-mobility Corbino device to isolate bulk thermal properties.", "Observed strong violation of the Wiedemann-Franz law.", "Results suggest particle-hole symmetry in the 5/2 fractional quantum Hall state."]}}, {"title": "Field-direction sensitivity of Kondo hybridization in UTe2", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/4yz7-wwyp", "authors": "Thomas Halloran, Gicela Saucedo Salas, Sylvia K. Lewin, et al.", "last_authors": "Marc Janoschek, Nicholas P. Butch", "summary": "Author(s): Thomas Halloran, Gicela Saucedo Salas, Sylvia K. Lewin, J. A. Rodriguez-Rivera, Colin L. Sarkis, Jakob Lass, Daniel G. Mazzone, Marc Janoschek, and Nicholas P. Butch Neutron scattering experiments on the spin-triplet superconductor ${\\mathrm{UTe}}_{2}$ have established that the dominant low-energy magnetic response is along Brillouin zone boundaries, resembling the magnetic susceptibility of narrow-gap interband excitations. We report a study of the sensitivity … [Phys. Rev. B 113, 195145] Published Fri May 22, 2026", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Investigation of Kondo hybridization in UTe2 using neutron scattering; high relevance to topological superconductivity.", "tags": ["experiment", "UTe2", "neutronscattering", "Kondo"], "image": "", "briefing": {"background": "UTe2는 위상 초전도체 후보 물질로 주목받으며, 스핀 삼중항 초전도성과 관련된 전자 상관관계 및 Kondo 효과가 핵심 연구 대상입니다.", "motivation": "UTe2의 자기 응답이 특정 방향에 따라 어떻게 변화하는지, 그리고 Kondo 혼성화가 초전도 상태에 미치는 영향을 규명하고자 합니다.", "result": "중성자 산란 실험을 통해 UTe2의 저에너지 자기 응답이 Brillouin zone 경계를 따라 지배적이며, 이는 좁은 갭을 가진 대역간 여기와 유사함을 발견했습니다.", "implication": "UTe2의 전자 구조에서 Kondo 혼성화의 이방성(anisotropy)을 이해함으로써, 이 물질의 비통상적인 스핀 삼중항 초전도성의 기원을 밝히는 데 기여합니다.", "novelty": "자기장 방향에 따른 Kondo 혼성화의 민감도를 중성자 산란으로 직접 추적하여, UTe2의 전자 구조 모델을 정교화했습니다.", "unresolved": "측정된 자기 응답이 정확히 어떤 페르미 면 토폴로지와 직접 연결되는지에 대한 미세한 상관관계는 여전히 연구가 필요합니다.", "future_work": "자기장 하에서의 정밀한 ARPES 실험을 통해 이번 결과에서 예측된 전자 대역의 변화를 직접 관찰할 필요가 있습니다.", "concepts": [{"term": "Kondo 혼성화", "why_emerged": "국소 자기 모멘트와 전도 전자가 결합하여 페르미 준위 근처에서 전자 구조가 변하는 현상을 설명하기 위해 필요.", "origin": "Kondo (1964)의 저항 극소 현상 해석에서 시작.", "connections": "중페르미온(Heavy Fermion) 시스템, 밴드 엔지니어링, 다체 이론."}, {"term": "스핀 삼중항 초전도체", "why_emerged": "쿠퍼 쌍이 스핀-1 상태를 가지는 초전도 현상을 통해 위상학적으로 비자명한 초전도 상태를 구현하기 위해 필요.", "origin": "초기 이론은 Balian-Werthamer (1963) 등에 의해 제안됨.", "connections": "위상 초전도, 마요라나 페르미온, T-대칭성 파괴."}], "english_summary": ["Neutron scattering study on the spin-triplet superconductor UTe2.", "Magnetic response is concentrated along Brillouin zone boundaries.", "Evidence points to narrow-gap interband excitations.", "Investigated the field-direction sensitivity of Kondo hybridization."]}}, {"title": "Ground state magnetic structure of Mn3Sn", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/dh99-3xkn", "authors": "Jeppe Jon Cederholm, Zhian Xu, Yanfeng Guo, et al.", "last_authors": "Andrew T. Boothroyd, Henrik Jacobsen", "summary": "Author(s): Jeppe Jon Cederholm, Zhian Xu, Yanfeng Guo, Martin Ovesen, Thomas Olsen, Kristine M. L. Krighaar, C 13943", "authors": "Jing-Yu Zhao, Shubhayu Chatterjee, Subir Sachdev, Ya-Hui Zhang", "last_authors": "Subir Sachdev, Ya-Hui Zhang", "summary": "arXiv:2510.13943v4 Announce Type: replace Abstract: Recent angle-dependent magnetoresistance measurements in underdoped cuprates have revealed compelling evidence for small hole pockets in the pseudogap regime, including observation of the Yamaji effect in HgBa$_2$CuO$_{4+\\delta}$ (Chan et al., Nature Physics 10.1038/s41567-025-03032-2 (2025)). A key distinction between theories is their predicted Fermi volumes, measured as fractions of the square lattice Brillouin zone: $p/4$ per pocket for spin density wave (SDW) versus $p/8$ for fractionalized Fermi liquid (FL*), where $p$ is the hole doping. We calculate the $c$-axis magnetoresistance $\\rho_{zz}(\\theta, \\phi)$ within the semiclassical Boltzmann formalism for both states, and using the ancilla layer model (ALM) for FL* in a single-band Hamiltonian. The results from the $\\text{FL}^*$ phase show good consistency with current experimental data. Conversely, the results for the SDW phase are highly sensitive to the ordering momentum along the $z$-direction. An ordering vector of $Q = (\\pi, \\pi, \\pi)$ yields predictions that starkly disagree with the experiment. The only possibility for agreement within the SDW scenario is to assume an ordering momentum of $Q = (\\pi, \\pi, 0)$. However, even in this specific case, the SDW scenario predicts a marginally smaller Yamaji angle at $\\phi=0$ than the FL* theory, and a second Yamaji peak near in-plane angle $\\phi = 45^\\circ$, which was not observed in the experiment. In reality, the N\\'eel ordering vector is likely uncorrelated between adjacent layers, so that there is no coherent interlayer transport of hole-pocket quasiparticles in the SDW scenario, and consequently no Yamaji effect. Our results support the FL* interpretation of Fermi arcs in the pseudogap phase, and establish Yamaji angle measurements as a discriminator
