<title>Daily Paper Slideshow</title>
<style>
  :root {
    color-scheme: light;
    --bg: #f6f7f4;
    --paper: #ffffff;
    --ink: #111827;
    --muted: #64748b;
    --line: #d8ddd2;
    --accent: #176b87;
    --accent-2: #9a3412;
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; overflow: auto; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: var(--bg); color: var(--ink); }
  .shell { max-width: 1500px; min-height: 100vh; margin: 0 auto; padding: 14px 18px; display: flex; flex-direction: column; }
  .topbar { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 16px; }
  .top-actions { display: flex; align-items: center; gap: 10px; }
  .topbar a, button { border: 1px solid var(--line); border-radius: 8px; background: var(--paper); color: var(--ink); padding: 10px 14px; font-weight: 700; text-decoration: none; cursor: pointer; }
  button.primary { background: var(--accent); border-color: var(--accent); color: white; }
  button:disabled { opacity: 0.45; cursor: not-allowed; }
  .counter { color: var(--muted); font-weight: 700; }
  .slide { min-height: calc(100vh - 82px); background: var(--paper); border: 1px solid var(--line); border-radius: 10px; padding: 18px; box-shadow: 0 18px 42px rgba(15, 23, 42, 0.10); display: grid; grid-template-columns: minmax(310px, 0.86fr) minmax(0, 1.55fr); gap: 18px; overflow: visible; }
  .paper-head { min-width: 0; min-height: 0; overflow: visible; display: flex; flex-direction: column; gap: 12px; }
  .figure { margin: 0; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: #f8fafc; }
  .figure img { display: block; width: 100%; max-height: 41vh; object-fit: contain; background: white; }
  .figure figcaption { padding: 7px 10px; color: var(--muted); font-size: 12px; line-height: 1.3; }
  .head-text { display: flex; flex-direction: column; gap: 9px; min-width: 0; }
  .badges { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .badge { border-radius: 999px; padding: 5px 9px; background: #eef2ff; color: #3730a3; font-size: 12px; font-weight: 800; }
  .score { background: #fee2e2; color: #991b1b; }
  h1 { margin: 0; font-size: 25px; line-height: 1.15; letter-spacing: 0; overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
  h1 a { color: inherit; text-decoration-color: rgba(23, 107, 135, 0.35); text-decoration-thickness: 2px; text-underline-offset: 4px; }
  h1 a:hover { color: var(--accent); text-decoration-color: var(--accent); }
  .meta, .authors, .why, .abstract { font-size: 13px; line-height: 1.45; }
  .meta, .authors { color: var(--muted); }
  .why strong, .abstract strong, .authors strong { color: var(--ink); }
  .authors { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .why { border-left: 4px solid var(--accent-2); padding-left: 10px; color: #374151; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .abstract { border-top: 1px solid var(--line); padding-top: 14px; color: #374151; }
  .original-abstract { border-top: 1px solid var(--line); padding-top: 10px; color: #374151; font-size: 11.5px; line-height: 1.35; overflow-wrap: anywhere; }
  .original-abstract strong { display: block; margin-bottom: 4px; color: var(--ink); }
  .tags { display: flex; flex-wrap: wrap; gap: 8px; }
  .tag { border-radius: 999px; padding: 4px 8px; background: #f1f5f9; color: #475569; font-size: 12px; font-weight: 700; }
  .head-text > .link { display: none; }
  .briefing { min-width: 0; min-height: 0; overflow: visible; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); grid-auto-rows: minmax(0, auto); align-content: start; gap: 11px 18px; border-top: 0; padding-top: 0; }
  .brief-section { min-width: 0; }
  .brief-section.wide { grid-column: 1 / -1; }
  .brief-section h2 { margin: 0 0 4px; font-size: 14px; line-height: 1.22; color: #0f766e; letter-spacing: 0; }
  .brief-section p, .brief-section li { margin: 0; font-size: 12.5px; line-height: 1.42; color: #1f2937; overflow-wrap: anywhere; }
  .brief-section ul { margin: 0; padding-left: 20px; }
  .concepts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 9px 14px; }
  .concept { border-top: 1px solid var(--line); padding-top: 7px; }
  .concept h3 { margin: 0 0 4px; font-size: 13px; color: #7c2d12; letter-spacing: 0; }
  .concept p { margin: 2px 0 0; font-size: 11.5px; line-height: 1.35; color: #374151; overflow-wrap: anywhere; }
  .concept b { color: #111827; }
  .link { color: var(--accent); font-weight: 800; text-decoration: none; }
  .empty { padding: 48px; background: var(--paper); border: 1px solid var(--line); border-radius: 12px; color: var(--muted); }
  @media (max-width: 860px) {
    .shell { padding: 14px; }
    .topbar, .top-actions { align-items: stretch; flex-direction: column; }
    .slide, .briefing, .concepts { grid-template-columns: 1fr; }
    .slide { min-height: auto; overflow: visible; display: grid; }
    h1 { font-size: 28px; }
  }
</style>

<script>
const slides = [{"title": "Deep learning approach for ARPES and time-resolved ARPES: Gradient attention U-net for denoising and reconstruction", "journal": "PRB_Recent", "source": "keyword", "link": "http://link.aps.org/doi/10.1103/53wd-bg7k", "authors": "Gongyi Cheng, Ziyang Guo, Zhengcong Yan, et al.", "last_authors": "Shijing Tan, Bing Wang", "summary": "Data analysis in angle-resolved photoemission spectroscopy (ARPES) and time-resolved ARPES usually employs derivative-based methods, such as second derivative and maximum curvature, to enhance spectral visibility. Despite their widespread use, these methods are prone to noise amplification and the i…", "tier": "A_MUST_READ", "score": "10", "reason": "title strong match: ARPES", "tags": ["ARPES", "angle-resolvedphotoemission", "photoemission"], "image": "", "briefing": {"background": "ARPES 데이터 분석 시 밴드 구조의 가시성을 높이기 위해 흔히 2차 미분(second derivative)이나 최대 곡률(maximum curvature)법을 사용합니다. 그러나 이러한 방법은 데이터에 포함된 노이즈를 증폭시켜 미세한 물리적 특징을 왜곡하거나 가리는 치명적인 단점이 있습니다.", "motivation": "딥러닝, 특히 컴퓨터 비전 분야에서 검증된 U-net 구조를 활용하여 ARPES 및 시간 분해 ARPES(TR-ARPES) 데이터의 노이즈를 효과적으로 제거하고, 물리적 신호를 선명하게 재구성하기 위한 새로운 방법론을 제안하고자 합니다.", "result": "Gradient Attention U-net 모델을 개발하여, 기존 미분 기반 방식보다 노이즈 억제 능력이 뛰어나면서도 스펙트럼의 미세 구조를 정확하게 보존하는 재구성 성능을 입증했습니다. 특히 시간 분해능이 포함된 데이터에서도 밴드 진화를 명확히 추출할 수 있음을 보였습니다.", "implication": "신호 대 잡음비(SNR)가 낮은 극한 환경의 실험 데이터나 매우 짧은 시간 스케일의 TR-ARPES 데이터 분석에서 신뢰도를 획기적으로 높일 수 있습니다. 이는 복잡한 다체 현상이나 미세한 에너지 갭을 연구하는 데 큰 도움이 될 것입니다.", "novelty": "단순한 노이즈 제거를 넘어 'Gradient Attention' 메커니즘을 도입하여 밴드 구조의 기울기와 곡률 정보를 학습 과정에 반영했습니다. 사용자 프로필과 관련하여, 특히 시간 분해 ARPES 데이터의 정밀도를 높여 동역학 연구의 질을 높일 수 있는 기술적 진보입니다.", "unresolved": "딥러닝 모델의 특성상 학습 데이터 세트의 품질에 의존할 수 있으며, 실제 존재하지 않는 인공적인 특징(artifact)을 생성할 가능성에 대한 철저한 검증이 추가적으로 필요할 수 있습니다.", "future_work": "다양한 물질계(예: 카고메 금속, 위상 절연체)의 실제 실험 데이터에 적용하여 범용성을 확인하고, 실시간 데이터 분석 파이프라인에 통합하는 연구가 기대됩니다.", "concepts": [{"term": "Gradient Attention U-net", "why_emerged": "이미지 내의 중요한 특징(경계선 등)을 강조하면서 노이즈를 제거하기 위해 U-net 구조에 기울기 정보에 집중하는 어텐션 메커니즘을 결합한 것입니다.", "origin": "컴퓨터 비전 분야의 U-net(Ronneberger et al.) 구조를 ARPES에 맞춰 변형함", "connections": "Deep learning, Image denoising, Computer vision"}, {"term": "Time-resolved ARPES (TR-ARPES)", "why_emerged": "평형 상태뿐만 아니라 빛에 의한 여기 상태에서의 전자 동역학을 직접 관찰하기 위해 개발되었습니다.", "origin": "초고속 레이저 기술과 ARPES의 결합", "connections": "Pump-probe spectroscopy, Non-equilibrium dynamics"}, {"term": "Second derivative method", "why_emerged": "ARPES 스펙트럼에서 배경 신호를 억제하고 밴드의 위치를 명확히 찾기 위한 표준적인 수치 방법으로 사용되어 왔습니다.", "origin": "고전적인 수치 해석 기법", "connections": "Curvature method, Spectral analysis"}], "english_summary": ["A deep learning-based Gradient Attention U-net is proposed for denoising and reconstructing ARPES and TR-ARPES data.", "The method outperforms traditional derivative-based techniques by enhancing spectral visibility without noise amplification.", "It provides a robust tool for analyzing weak features and fast electronic dynamics in low-SNR experimental setups."]}}, {"title": "Unified First-Principles Formula for Time-Resolved ARPES Spectra of Coherent and Incoherent Excitons beyond the Dilute Limit", "journal": "PRL_Recent", "source": "keyword", "link": "http://link.aps.org/doi/10.1103/zhs1-rv1k", "authors": "Gianluca Stefanucci, Enrico Perfetto", "last_authors": "Gianluca Stefanucci, Enrico Perfetto", "summary": "Despite major experimental progresses in time-resolved and angle-resolved photoemission spectroscopy, a quantitative, microscopic framework for interpreting exciton-induced modifications of electronic band structures—applicable even beyond the low-density limit—is still lacking. Here, we close this gap by introducing a unified approach that links the dynamics of coherent and incoherent excitons to distinct and experimentally observable excitonic sidebands. Our central result is a general, first-principles formula for time-resolved photoemission spectra, applicable across a broad range of temperatures, excitation densities, and pump-probe delays. Thi "chargedensitywave", "CDW"], "image": "", "briefing": {"background": "희토류 칼코게나이드계 물질(Rare-earth tellurides)은 전하 밀도 파동(CDW)과 강한 전자 상관관계가 결합되어 나타나는 독특한 물리적 특성 때문에 널리 연구되어 왔습니다. 특히 CeTe2와 같은 물질은 층상 구조를 가지며, 열전 성능(Thermoelectric property)과 CDW 상태 사이의 상관관계가 흥미로운 연구 대상입니다.", "motivation": "본 연구는 Sb 치환이 CeTe2의 전자 구조에 어떤 변화를 주는지, 그리고 이것이 왜 열전 성능의 향상으로 이어지는지를 ARPES를 통해 직접적인 밴드 구조 관측으로 규명하고자 했습니다.", "result": "ARPES 측정을 통해 Sb 농도 x가 증가함에 따라 페르미 준위 근처의 전자 구조가 변화하는 양상을 확인했습니다. 특히 CDW 갭의 크기와 페르미 면의 변형(nesting) 정도가 Sb 치환에 따라 조절되며, 이것이 수송 특성 변화의 근원임을 밝혔습니다.", "implication": "CDW 물질에서 화학적 치환을 통해 전자 구조를 미세하게 조정함으로써 열전 효율을 최적화할 수 있는 물리적 기틀을 제공합니다. 이는 고성능 열전 소재 설계를 위한 전자 구조 가이드라인이 될 수 있습니다.", "novelty": "CeTe2-xSbx 계열에 대해 고해상도 ARPES를 적용하여 고체 내 전자 상태를 직접 매핑했다는 점이 중요하며, 이는 독자의 관심사인 CDW와 ARPES를 직접적으로 연결하는 연구입니다.", "unresolved": "실험적으로 관측된 밴드 구조의 변화가 실제 열전 계수(Seebeck coefficient)의 정량적인 값과 어떻게 완벽하게 매칭되는지에 대한 심도 있는 이론적 계산이 더 필요할 수 있습니다.", "future_work": "온도 가변 ARPES를 통해 CDW 전이 온도 전후의 페르미 면 변화를 실시간으로 관찰하고, Sb 치환 외에 다른 도핑에 의한 효과도 탐색할 필요가 있습니다.", "concepts": [{"term": "ARPES", "why_emerged": "물질의 에너지-운동량 공간에서의 전자 구조(밴드 구조)를 직접 측정하기 위해 개발되었습니다.", "origin": "광전효과에 기반하며, 1980년대 이후 고해상도 측정 기술이 발전하면서 현대 고체물리학의 핵심 도구가 되었습니다.", "connections": "페르미 면 매핑, 초전도체 갭 측정, CDW 갭 관측 등과 밀접하게 연관됩니다."}, {"term": "Charge Density Wave (CDW)", "why_emerged": "저차원 금속 시스템에서 전자-격자 상호작용에 의해 전하 밀도가 주기적으로 변조되는 현상을 설명하기 위해 등장했습니다.", "origin": "Peierls가 1D 사슬 모델에서 금속-절연체 전이의 가능성으로 처음 제안했습니다.", "connections": "Peierls instability, nesting of Fermi surface, superconductivity와 경쟁하거나 공존하는 관계입니다."}, {"term": "Thermoelectric effect", "why_emerged": "열 에너지를 전기 에너지로 변환하거나 그 반대의 과정을 구현하기 위해 연구되었습니다.", "origin": "Thomas Johann Seebeck(1821) 등에 의해 발견되었습니다.", "connections": "Seebeck coefficient, electronic density of states, phonon scattering."}, {"term": "Sb-substitution", "why_emerged": "모물질의 격자 상수나 캐리어 농도를 미세 조정하여 물성을 제어하기 위해 사용됩니다.", "origin": "합성 화학 및 재료 과학의 고전적인 도핑 기법입니다.", "connections": "Chemical pressure, rigid band model, carr 에서의 TR-ARPES 실험 데이터와 본 이론의 정량적 비교가 기대됩니다.", "concepts": [{"term": "Mott insulator", "why_emerged": "밴드 이론으로는 금속이어야 하지만 전자 간의 강한 척력 때문에 절연체가 되는 물질을 설명하기 위해 등장했습니다.", "origin": "Nevill Mott에 의해 이론적 기초가 세워졌습니다.", "connections": "Hubbard model, High-Tc superconductivity, Mott transition."}, {"term": "Doublon and Holon", "why_emerged": "1차원 강상관 시스템에서 전자의 스핀과 전하 자유도가 분리되는 현상(Spin-charge separation)을 설명하는 기본 준입자입니다.", "origin": "Bethe ansatz 등 1차원 양자 자성 이론에서 기원했습니다.", "connections": "Luttinger liquid, Spinon, Mott-Hubbard exciton."}, {"term": "Mott-Hubbard exciton", "why_emerged": "모트 절연체 내에서 빛에 의해 생성된 더블론과 홀론이 정전기적 인력으로 묶인 상태를 설명하기 위해 제안되었습니다.", "origin": "초록 정보만으로는 특정하기 어려우나 허버드 모델의 비평형 동역학 연구에서 발전했습니다.", "connections": "Photo-induced phase transition, Optical conductivity peaks."}, {"term": "Photoemission spectroscopy (PES)", "why_emerged": "물질 내부의 전자 상태 밀도와 에너지 분포를 측정하기 위해 개발되었습니다.", "origin": "Einstein의 광전효과 원리를 기반으로 합니다.", "connections": "ARPES, TR-ARPES, Core-level spectroscopy."}], "english_summary": ["Theoretically studied photoemission spectra of photodoped 1D Mott insulators.", "Identified distinct spectral signatures of Mott-Hubbard excitons (doublon-holon pairs).", "Demonstrated qualitative differences between Mott systems and conventional semiconductors in PES.", "Provides a theoretical framework for interpreting TR-ARPES results in strongly correlated 1D materials."]}}, {"title": "Commensurate-Incommensurate Mott Transition without Magnetic Field: Emergence of Nematic Luttinger Liquid in XXZ Chain", "journal": "PRL_Recent", "source": "keyword", "link": "http://link.aps.org/doi/10.1103/5j3k-hztz", "authors": "Julien Fitouchi, Natalia Chepiga", "last_authors": "Julien Fitouchi, Natalia Chepiga", "summary": "We investigate the zero magnetization and ground state phase diagram of a spin- 1 / 2 chain with competing ferromagnetic nearest-neighbor and antiferromagnetic next-nearest-neighbor exchange couplings in the strongly interacting regime. Using density matrix renormalization group (DMRG) simulations, we discover two successive commensurate-incommensurate transitions of the nonconformal Pokrovsky-Talapov universality class, occurring even at zero magnetic field. We argue that the first transition marks the proliferation of solitonic discommensurations (kink-antikink pairs) in a critical phase with central charge c = 2 , emerging from a period-4 gapped phase. At the second transition, an incommensurate quadrupolar (or nematic) Luttinger liquid forms out of a gapped phase separation, via the condensation of two-magnon bound pairs. In the strongly interacting limit, the location of the two Pokrovsky-Talapov transitions can be analytically predicted with degenerate perturbation theory. Our results demonstrate that frustration alone is sufficient to drive continuous commensurate-incommensurate transitions of Mott type and stabilize complex objects with incommensurate quasi–long-range order without doping.", "tier": "A_MUST_READ", "score": "9", "reason": "title strong match: Luttinger liquid", "tags": ["nematic", "Luttinger", "Mott", "ferromagnet", "antiferromagnet"], "image": "", "briefing": {"background": "1차원 양자 스핀 체인에서 자기장이나 도핑 없이도 나타날 수 있는 상전이는 응집물질물리학의 고전적이면서도 현대적인 주제입니다. 특히 정수/반정수 스핀 사슬에서의 위상적 상태와 러팅저 액체(Luttinger liquid) 상태는 많은 관심을 받고 있습니다.", "motivation": "최접근 이웃(NN) 강자성 결합과 차근접 이웃(NNN) 반강자성 결합이 경쟁하는 좌절된(frustrated) XXZ 사슬에서, 자기장 없이 순수하게 '좌절'만으로 유도되는 상전이와 새로운 형태의 액체 상태를 찾고자 했습니다.", "result": "DMRG 계산을 통해 자기장이 없는 상태에서도 두 번의 연속적인 C-IC(Commensurate-Incommensurate) 전이가 발생함을 발견했습니다. 특히 두 번째 전이 이후 '네마틱 러팅저 액체(Nematic Luttinger liquid)'라는 새로운 상태가 형성됨을 확인했습니다.", "implication": "자기장이나 캐리어 도핑 없이도 시스템 내부의 기하학적 좌절만으로 복잡한 비공합(incommensurate) 질서와 다체 상태를 유도할 수 있음을 보여줍니다.", "novelty": "자기장 없이 발생하는 Pokrovsky-Talapov 유형의 전이를 규명하고, 2-마그논 결합체(bound pairs)의 응축에 의한 네마틱 러팅저 액체 상태를 제시한 점이 매우 혁신적입니다.", "unresolved": "이 모델을 완벽하게 구현할 수 있는 실제 1차원 자성 화합물 후보를 찾는 것이 실험적 과제로 남아 있습니다.", "future_work": "제시된 상도표를 바탕으로 중성자 산란 실험에서 나타날 동적 구조 인자(Dynamic structure factor)를 계산하여 실험적 검증 지표를 마련해야 합니다.", "concepts": [{"term": "Luttinger liquid", "why_emerged": "1차원에서는 페르미 액체 이론이 붕괴하므로, 상호작용하는 1차원 페르미온 시스템을 설명할 새로운 틀이 필요했습니다.", "origin": "Joaquín Mazdak Luttinger(1963)에 의해 제안되었고 Haldane에 의해 보편화되었습니다.", "connections": "Spin-charge separation, Bosonization, 1D spin chains."}, {"term": "Nematic Luttinger liquid", "why_emerged": "스핀 시스템에서 회전 대칭성은 깨지되 병진 대칭성은 보존되는 '네마틱' 질서가 1차원 양자 액체와 결합된 상태를 설명하기 위해 등장했습니다.", "origin": "초록 정보만으로는 특정하기 어려우나, 스핀-네마틱 상과 러팅저 액체 이론의 결합으로 형성되었습니다.", "connections": "Spin nematicity, Multimagnon bound states, Quadrupolar order."}, {"term": "Pokrovsky-Talapov transition", "why_emerged": "비공합 상전이(C-IC transition)의 특정 보편성 클래스(universality class)를 설명하기 위해 도입되었습니다.", "origin": "V.L. Pokrovsky와 A.L. Talapov(1979)에 의해 제안되었습니다.", "connections": "Commensurate-incommensurate transition, Solitons, Sine-Gordon model."}, {"term": "DMRG (Density Matrix Renormalization Group)", "why_emerged": "1차원 양자 다체 시스템의 바닥 상태와 저에너지 여기 상태를 매우 정밀하게 계산하기 위해 개발되었습니다.", "origin": "Steven R. White(1992)가 개발했습니다.", "connections": "Matrix Product States (MPS), Tensor networks, Quantum spin chains."}], "english_summary": ["Discovered two successive C-IC transitions in a frustrated XXZ spin-1/2 chain without an external magnetic field.", "Identified the emergence of a Nematic Luttinger liquid through the condensation of two-magnon bound pairs.", "Demonstrated that frustration alone can drive Pokrovsky-Talapov transitions and stabilize incommensurate order.", "Used DMRG simulations to map the zero-magnetization ground state phase diagram."]}}, {"title": "Qiu et al. Reply.", "journal": "PRL_Recent", "source": "author whitelist", "link": "http://link.aps.org/doi/10.1103/q2cc-stbr", "authors": "Qingzheng Qiu, Sae Hwan Chun, Jaeku Park, et al.", "last_authors": "Jasper van Wezel, Yingying Peng", "summary": "Author(s): Qingzheng Qiu, Sae Hwan Chun, Jaeku Park, Dogeun Jang, Li Yue, Yeongkwan Kim, Yeojin Ahn, Mingi Jho, Kimoon Han, Xinyi Jiang,
