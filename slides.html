<!DOCTYPE html>
<html lang='en'>
<head>
<meta charset='UTF-8'>
<meta name='viewport' content='width=device-width, initial-scale=1.0'>
<title>Daily Paper Slideshow</title>
<style>
  :root {
    color-scheme: light;
    --bg: #f6f7f4;
    --paper: #ffffff;
    --ink: #111827;
    --muted: #64748b;
    --line: #d8ddd2;
    --accent: #176b87;
    --accent-2: #9a3412;
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; overflow: auto; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: var(--bg); color: var(--ink); }
  .shell { max-width: 1500px; min-height: 100vh; margin: 0 auto; padding: 14px 18px; display: flex; flex-direction: column; }
  .topbar { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 16px; }
  .top-actions { display: flex; align-items: center; gap: 10px; }
  .topbar a, button { border: 1px solid var(--line); border-radius: 8px; background: var(--paper); color: var(--ink); padding: 10px 14px; font-weight: 700; text-decoration: none; cursor: pointer; }
  button.primary { background: var(--accent); border-color: var(--accent); color: white; }
  button:disabled { opacity: 0.45; cursor: not-allowed; }
  .counter { color: var(--muted); font-weight: 700; }
  .slide { min-height: calc(100vh - 82px); background: var(--paper); border: 1px solid var(--line); border-radius: 10px; padding: 18px; box-shadow: 0 18px 42px rgba(15, 23, 42, 0.10); display: grid; grid-template-columns: minmax(310px, 0.86fr) minmax(0, 1.55fr); gap: 18px; overflow: visible; }
  .paper-head { min-width: 0; min-height: 0; overflow: visible; display: flex; flex-direction: column; gap: 12px; }
  .figure { margin: 0; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: #f8fafc; }
  .figure img { display: block; width: 100%; max-height: 41vh; object-fit: contain; background: white; }
  .figure figcaption { padding: 7px 10px; color: var(--muted); font-size: 12px; line-height: 1.3; }
  .head-text { display: flex; flex-direction: column; gap: 9px; min-width: 0; }
  .badges { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .badge { border-radius: 999px; padding: 5px 9px; background: #eef2ff; color: #3730a3; font-size: 12px; font-weight: 800; }
  .score { background: #fee2e2; color: #991b1b; }
  h1 { margin: 0; font-size: 25px; line-height: 1.15; letter-spacing: 0; overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
  h1 a { color: inherit; text-decoration-color: rgba(23, 107, 135, 0.35); text-decoration-thickness: 2px; text-underline-offset: 4px; }
  h1 a:hover { color: var(--accent); text-decoration-color: var(--accent); }
  .meta, .authors, .why, .abstract { font-size: 13px; line-height: 1.45; }
  .meta, .authors { color: var(--muted); }
  .why strong, .abstract strong, .authors strong { color: var(--ink); }
  .authors { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .why { border-left: 4px solid var(--accent-2); padding-left: 10px; color: #374151; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .abstract { border-top: 1px solid var(--line); padding-top: 14px; color: #374151; }
  .original-abstract { border-top: 1px solid var(--line); padding-top: 10px; color: #374151; font-size: 11.5px; line-height: 1.35; overflow-wrap: anywhere; }
  .original-abstract strong { display: block; margin-bottom: 4px; color: var(--ink); }
  .tags { display: flex; flex-wrap: wrap; gap: 8px; }
  .tag { border-radius: 999px; padding: 4px 8px; background: #f1f5f9; color: #475569; font-size: 12px; font-weight: 700; }
  .head-text > .link { display: none; }
  .briefing { min-width: 0; min-height: 0; overflow: visible; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); grid-auto-rows: minmax(0, auto); align-content: start; gap: 11px 18px; border-top: 0; padding-top: 0; }
  .brief-section { min-width: 0; }
  .brief-section.wide { grid-column: 1 / -1; }
  .brief-section h2 { margin: 0 0 4px; font-size: 14px; line-height: 1.22; color: #0f766e; letter-spacing: 0; }
  .brief-section p, .brief-section li { margin: 0; font-size: 12.5px; line-height: 1.42; color: #1f2937; overflow-wrap: anywhere; }
  .brief-section ul { margin: 0; padding-left: 20px; }
  .concepts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 9px 14px; }
  .concept { border-top: 1px solid var(--line); padding-top: 7px; }
  .concept h3 { margin: 0 0 4px; font-size: 13px; color: #7c2d12; letter-spacing: 0; }
  .concept p { margin: 2px 0 0; font-size: 11.5px; line-height: 1.35; color: #374151; overflow-wrap: anywhere; }
  .concept b { color: #111827; }
  .link { color: var(--accent); font-weight: 800; text-decoration: none; }
  .empty { padding: 48px; background: var(--paper); border: 1px solid var(--line); border-radius: 12px; color: var(--muted); }
  @media (max-width: 860px) {
    .shell { padding: 14px; }
    .topbar, .top-actions { align-items: stretch; flex-direction: column; }
    .slide, .briefing, .concepts { grid-template-columns: 1fr; }
    .slide { min-height: auto; overflow: visible; display: grid; }
    h1 { font-size: 28px; }
  }
</style>

.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "밴드 구조의 오비탈 특성 식별"}, {"term": "궤도 선택적 밴드 진화", "why_emerged": "다중 궤도가 페르미 레벨에 기여하는 FeSC에서 초전도성을 주도하는 특정 오비탈을 식별하기 위해 고안됨.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "Hund's coupling 및 전자 상관관계 연구"}], "english_summary": ["Systematic ARPES study on BaFe2-xMxAs2 with various dopants.", "Polarization-dependent analysis reveals orbital-selective band modifications.", "Highlights the role of specific orbital contributions to the electronic structure.", "Provides experimental insights into the tuning of superconductivity via doping."]}}, {"title": "Quantum geometric magnetic monopole and two-phase superconductivity in CeRh2As2", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/csmg-nkn1", "authors": "Kosuke Nogaki, Youichi Yanase", "last_authors": "Kosuke Nogaki, Youichi Yanase", "summary": "Author(s): Kosuke Nogaki and Youichi Yanase Recent angle-resolved photoemission spectroscopy (ARPES) and density functional theory plus Hubbard $U$ ($\\mathrm{DFT}+U$) studies revealed that a heavy-fermion superconductor ${\\mathrm{CeRh}}_{2}{\\mathrm{As}}_{2}$ exhibits Van Hove singularities and the Dirac point near the Fermi level ${E}_{\\mathr… [Phys. Rev. B 113, 214506] Published Mon Jun 01, 2026", "tier": "A_MUST_READ", "score": "10", "reason": "Directly interprets ARPES data of a heavy-fermion superconductor regarding Dirac points and Van Hove singularities.", "tags": ["ARPES", "CeRh2As2", "heavyfermion", "Dirac"], "image": "", "briefing": {"background": "CeRh2As2는 강한 스핀-궤도 결합을 가진 중페르미온 초전도체로, 두 개의 서로 다른 초전도 상이 공존하는 등 비전통적인 물리적 성질을 보여 주목받고 있습니다.", "motivation": "최근 ARPES 및 DFT+U 연구에서 보고된 페르미 레벨 근처의 Van Hove 특이점과 디락 포인트가 이 물질의 독특한 초전도성에 어떤 기여를 하는지 이론적으로 해석하고자 합니다.", "result": "양자 기하학적 자기 단극자(magnetic monopole)가 에너지 밴드 구조 내에 존재함을 밝히고, 이것이 물질의 두 초전도 상과 깊은 연관이 있음을 시사합니다.", "implication": "CeRh2As2의 다중 초전도 상 기원이 단순히 국소적인 스핀 물리뿐만 아니라 전자 구조의 위상학적 기하성(Berry curvature 등)에서 기인할 수 있음을 제시합니다.", "novelty": "실험적으로 관측된 디락 포인트와 Van Hove 특이점을 이론적 모델링으로 연결하여 물리적 근원을 제안했습니다.", "unresolved": "이러한 위상학적 특성이 구체적으로 어떤 대칭성 깨짐(symmetry breaking)에 의해 두 개의 초전도 상으로 나누어지는지에 대한 명확한 메커니즘은 보강이 필요합니다.", "future_work": "자기장 하에서의 ARPES 측정을 통해 자기 단극자의 이동과 페르미 표면 변화를 실험적으로 확인하는 것이 중요합니다.", "concepts": [{"term": "자기 단극자 (Magnetic Monopole)", "why_emerged": "운동량 공간에서의 위상학적 물리량을 기술하기 위해 Berry 곡률의 특이점으로 도입되었습니다.", "origin": "Berry(1984), 위상학적 밴드 이론에서 정립", "connections": "Weyl semimetals, Anomalous Hall effect"}, {"term": "Van Hove 특이점", "why_emerged": "상태 밀도(DOS)가 발산하는 지점으로 전자 상관관계가 강해지는 임계 상태를 이해하기 위해 필요합니다.", "origin": "Van Hove(1953)", "connections": "Kagome metals, Unconventional superconductivity"}], "english_summary": ["Theoretical study on the heavy-fermion superconductor CeRh2As2.", "Links observed Dirac points and Van Hove singularities to quantum geometry.", "Proposes that magnetic monopoles in momentum space explain the dual superconducting phases.", "Connects experimental ARPES data to topological electronic properties."]}}, {"title": "Electronic Origin of Delicate Antiferromagnetism in FexNbS2", "journal": "PRL_Recent", "source": "author whitelist", "link": "http://link.aps.org/doi/10.1103/99yr-nqbx", "authors": "Wenxin Li, Jonathan T. Reichanadter, Shan Wu, et al.", "last_authors": "Jeffrey B. Neaton, Yu He", "summary": "Author(s): Wenxin Li, Jonathan T. Reichanadter, Shan Wu, Ji Seop Oh, Rourav Basak, Shannon C. Haley, Siqi Wang, Joshua E. Chaparro Mata, Elio Vescovo, Donghui Lu, Makoto Hashimoto, Christoph Klewe, Suchismita Sarker, Jessica L. McChesney, Alex Frañó, James G. Analytis, Robert J. Birgeneau, Jeffrey B. Neaton, and Yu He A combination of ARPES, XAS, and DFT shows a dramatic eV-scale electronic restructuring in Fe x NbS 2 , similar to what happens in correlated oxides, and suggests electronic correlations play a central role in the magnetism of Fe-intercalated transition-metal dichalcogenides. [Phys. Rev. Lett. 136, 216503] Published Wed May 27, 2026", "tier": "A_M nd Ion Errea The newly discovered family of nonmagnetic kagome metals ${\\mathrm{AV}}_{3}{\\mathrm{Sb}}_{5}$ ($\\mathrm{A}=\\mathrm{K}$, Rb, or Cs) provides a unique platform for exploring the interplay between charge-density wave (CDW) order, superconductivity, nontrivial topology, and spontaneous time-reversal sym… [Phys. Rev. Lett. 136, 206401] Published Fri May 22, 2026", "tier": "A_MUST_READ", "score": "10", "reason": "Direct hit on core research interest: kagome metal CsV3Sb5, CDW, and superconductivity.", "tags": ["material", "kagome", "superconductivity", "CDW"], "image": "", "briefing": {"background": "AV3Sb5 계열의 카고메 금속은 전하 밀도 파(CDW), 초전도성, 그리고 비자명한 위상학적 성질이 공존하는 독특한 물리적 시스템입니다. 이들 사이의 미세한 상호작용은 고체 물리학의 핵심 연구 대상입니다.", "motivation": "CsV3Sb5에서 나타나는 CDW 상태와 초전도성 사이의 상관관계를 규명하고, 특히 대칭성 깨짐이 어떻게 초전도성에 영향을 미치는지 밝히고자 합니다.", "result": "대칭성이 깨진 기저 상태와 포논 매개 초전도성 모델을 통해 실험적 관측값들을 성공적으로 해석하고, 카고메 격자에서의 전자-포논 결합 특성을 제시했습니다.", "implication": "이 모델이 정당하다면, 카고메 금속에서의 초전도성은 기존의 비통상적 메커니즘뿐만 아니라 구조적 대칭성 변화와 강하게 결합된 포논 메커니즘을 통해 설명될 수 있음을 시사합니다.", "novelty": "카고메 물질의 복잡한 물성을 격자 역학 및 대칭성 관점에서 정교하게 모델링했으며, 귀하가 관심을 가지는 CsV3Sb5의 CDW-초전도성 경쟁 모델에 대한 중요한 이론적 근거를 제공합니다.", "unresolved": "실험적으로 관측된 시간 반전 대칭성 깨짐의 미세한 성분과 본 연구의 포논 매개 모델 간의 정량적 통합 정도는 여전히 논의의 여지가 있습니다.", "future_work": "저온 환경에서의 정밀한 비탄성 중성자 산란 실험 또는 CDW 상전이 근처에서의 시간 분해 분광학 연구가 필요합니다.", "concepts": [{"term": "Kagome Metals", "why_emerged": "기하학적 좌절과 평탄한 밴드 구조를 통한 강상관 전자계 연구를 위해 필요합니다.", "origin": "초기에는 자기적 좌절 연구에서 시작되었으나 최근 AV3Sb5 계열로 주목받음.", "connections": "디락 준금속, 위상 절연체 및 강상관 초전도체와 연결됨."}, {"term": "Charge Density Wave (CDW)", "why_emerged": "전자와 격자의 상호작용으로 인해 기저 상태가 재구성되는 현상을 설명하기 위해 제안되었습니다.", "origin": "Peierls에 의해 1차원 금속 시스템에서 처음 제안됨.", "connections": "초전도성과의 경쟁 또는 공존 현상이 많은 고온 초전도체에서 관측됨."}], "english_summary": ["The paper investigates the interplay of CDW and superconductivity in CsV3Sb5.", "A phonon-mediated mechanism is proposed for the superconducting state within the broken-symmetry background.", "The study links lattice dynamics to the observed electronic properties of the kagome metal.", "It provides a framework for understanding the coexistence of these exotic phases."]}}, {"title": "Altermagnetism in MnF2: Band Splitting and Its Physical Consequences", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2606.01515", "authors": "Igor Solovyev", "last_authors": "Igor Solovyev", "summary": "arXiv:2606.01515v1 Announce Type: new Abstract: MnF$_2$ is widely regarded as a candidate altermagnet, but the magnitude and implications of its altermagnetic band splitting remain debated. Using electronic-structure calculations, we construct minimal models that capture the magnetic and electronic properties of MnF$_2$. These models show that the parameters governing the chiral magnon splitting and the spin splitting of the electronic bands are relatively small. Moreover, the electronic system lies in the strong-coupling regime, where most magnetic properties are controlled by the ratio $t/U$ between the characteristic hopping amplitude $t$ and the large on-site Coulomb repulsion $U$. Consequently, all exchange interactions scale as $1/U$, so a small altermagnetic hopping $\\delta t$ produces only a proportionally small exchange term. Upon doping, the altermagnetic contribution to the anomalous Hall effect is likewise suppressed, being smaller than the conventional (non-altermagnetic) contribution by a factor of order $\\delta t/U$. In contrast, the behavior of the conductivity tensor $\\hat{\\sigma}(\\omega)$ at $\\hbar \\omega \\sim U$ differs qualitatively, because $\\delta t$ enters the energies of interband optical transitions \\emph{directly} rather than through the reduced ratio $\\delta t/U$. This contribution strongly reshapes $\\hat{\\sigma}(\\omega)$, leading to a dramatic enhancement of the magneto-optical response.", "tier": "A_MUST_READ", "score": "10", "reason": "Detailed electronic structure analysis of the altermagnetic candidate MnF2 and its Hall response.", "tags": ["material", "altermagnetism", "electronic-structure"], "image": "https://arxiv.org/html/2606.01515v1/x1.png", "briefing": {"background": "반강자성체에서 스핀 결정 구조가 특정 대칭성을 만족할 때, 자기 모멘트가 상쇄됨에도 불구하고 전자의 밴드 분리(Spin splitting)가 발생하는 altermagnetism에 대한 관심이 급증하고 있습니다.", "motivation": "MnF2가 altermagnet 후보 물질로 거론되지만, 실제 밴드 분리 크기와 그에 따른 수송 현상이 강상관 효과에 의해 어떻게 제한되는지 분석하고자 합니다.", "result": "강상관 영역(Strong-coupling)에서 altermagnetic 밴드 분리가 직접적인 교환 상호작용보다는 전자 간 쿨롱 반발(U)에 의해 억제됨을 보였으며, 홀 효과보다 광학적 응답에서 더 뚜렷한 신호가 나타남을 확인했습니다.", "implication": "MnF2와 같은 강상관 물질에서 altermagnetism을 활용한 spintronics 응용은 수송 현상보다 광학적 제어(magneto-optical) 측면에서 더 유리할 가능성을 제시합니다.", "novelty": "전통적인 altermagnetism 이론을 강상관 물질의 U/t 관점에서 재해석하여, 단순히 밴드 구조만 고려하던 기존 연구에 중요한 물리적 제약을 추가했습니다.", "unresolved": "이론적인 밴드 분리 억제값이 실제 실험에서 관측되는 홀 전도도 데이터와 정확히 일치하는지 확인하는 작업이 부족합니다.", "future_work": "다양한 도핑 농도에서의 광학적 전도도 실험(Optical conductivity)을 통한 예측값 검증이 필요합니다.", "concepts": [{"term": "Altermagnetism", "why_emerged": "반강자성체에서 자화가 0임에도 불구하고 페르미 면의 스핀 분리를 실현하기 위해 필요합니다.", "origin": "최근 2-3년 내에 이론적으로 정립됨.", "connections": "강자성체와 반강자성체의 중간적인 성질을 띠는 새로운 자기 상태."}, {"term": "Anomalous Hall Effect", "why_emerged": "비자성체 또는 반강자성체에서 베리 곡률에 기인한 홀 전류의 발생을 설명하기 위해 필요합니다.", "origin": "Karplus와 Luttinger에 의해 1954년 제안됨.", "connections": "위상학적 홀 효과 및 altermagnetism의 주요 실험적 지표."}], "english_summary": ["Analyzes altermagnetic band splitting in MnF2 within the strong-coupling regime.", "Shows that altermagnetic effects are suppressed by large on-site Coulomb repulsion U.", "Predicts that magneto-optical response is more sensitive to altermagnetism than Hall conductivity.", "Provides a theoretical constraint for spintronic applications of antiferromagnetic insulators."]}}, {"title": "Imaging the Magnetically Driven Reconstruction of the Electronic States in the Antiferromagnetic Topological Insulator EuSn2As2", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2606.00337", "authors": "Luka Khizanish tz transition in High Tc superconductor Bi2Sr2CaCu2O8+", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2606.00185", "authors": "Ji Dai, Lukas Hellbr\\\"uck, Michele Puppin, et al.", "last_authors": "Siham Benhabib, Fabrizio Carbone", "summary": "arXiv:2606.00185v1 Announce Type: new Abstract: To date, controlling the steady-state electronic band structure in high-Tc cuprate superconductors has been achieved primarily through chemical doping or magnetic fields. Here, we present that ultrafast optical excitation can instead drive the electronic band structure of Bi2Sr2CaCu2O8+{\\delta} into a photostationary, long-lived excited state. At sufficiently high pump fluences, this state undergoes a Lifshitz transition of the Fermi surface, characterized by a change in topology from hole-like to electron-like. Time- and angle-resolved photoemission spectroscopy, supported by single-band tight-binding calculations, reveals that 1.6 eV photoexcitation induces band-structure evolutions closely analogous to those produced by chemical doping. These results point to an efficient photodoping mechanism involving cooperative effects, including charge transfer, renormalization of effective electronic correlations, and defect-assisted charge trapping. Our findings raise fundamental questions regarding thermalization processes occurring on timescales comparable to the laser repetition period in cuprates. More broadly, ultrafast optical control enables access to otherwise inaccessible regions of the phase diagram by tuning the pump fluence.", "tier": "B_IMPORTANT_CONDMAT", "score": "9", "reason": "Direct time-resolved ARPES study of the Fermi surface and Lifshitz transition in a core cuprate.", "tags": ["ARPES", "material", "superconductivity"], "image": "https://arxiv.org/static/browse/0.3.4/images/arxiv-logo-fb.png", "briefing": {"background": "고온 초전도체인 cuprate의 물성은 주로 화학적 도핑으로 조절되어 왔으나, 이는 정적인 상태에 머무릅니다. 최근 초고속 분광학을 통해 비평형 상태에서 물질의 상을 제어하려는 시도가 활발합니다." utron diffraction, directly relevant to the user's material interests.", "tags": ["neutrondiffraction", "material", "kagome"], "image": "", "briefing": {"background": "가고메 격자(Kagome lattice)는 기하학적 좌절(Geometric frustration)로 인해 다양한 자기적 지형과 위상학적 전자가 나타나는 중요한 플랫폼입니다.", "motivation": "Nd3Ru4Al12라는 특정 가고메 자석의 복잡한 자기 구조를 명확히 밝혀 물질 고유의 자기적 특성을 규명하고자 합니다.", "result": "단결정 중성자 회절 실험을 통해 Nd3Ru4Al12가 '헥스-FM(hex-FM)'이라 불리는 공선형 강자성체임을 밝혀냈으며, 기존 예상보다 모멘트 크기가 감소했음을 확인했습니다.", "implication": "가고메 물질 내에서의 국부적 자기 모멘트 정렬 방식이 물질의 전반적인 전자적 수송 및 위상 특성에 어떤 영향을 미치는지 이해하는 기초가 됩니다.", "novelty": "독자님이 관심 있는 AV3Sb5 계열과는 다른, 희토류 기반의 가고메 격자 시스템에서의 정밀한 자기 구조 규명 결과를 제시합니다.", "unresolved": "모멘트 크기가 왜 이론적 예상보다 감소했는지에 대한 상세한 전자 상관 관계나 결정장 효과에 대한 완전한 설명은 부족합니다.", "future_work": "이 물질의 수송 현상 측정(예: 이상 홀 효과)과 스핀 역학 연구가 후속으로 이어질 것으로 보입니다.", "concepts": [{"term": "Kagome lattice", "why_emerged": "전자의 국부화와 위상학적 밴드 구조가 공존할 수 있는 기하학적 구조 연구.", "origin": "일본의 바구니 짜기 패턴에서 유래, 고체 물리학에 도입.", "connections": "스핀 액체, 플랫 밴드."}, {"term": "Neutron diffraction", "why_emerged": "물질 내부의 자기 모멘트 정렬 상태를 공간적으로 직접 매핑하기 위해.", "origin": "Shull과 Wollan이 개척.", "connections": "자기 구조 분석의 표준 방법."}], "english_summary": ["Determination of magnetic ground state in Nd3Ru4Al12 using neutron diffraction.", "Identified as a collinear hex-FM state with reduced magnetic moments.", "Contributes to the understanding of kagome lattice magnets beyond the AV3Sb5 family.", "Experimental study providing precise structural information for theoretical modeling."]}}, {"title": "Deterministic switching of perpendicular ferromagnets by higher harmonics of spin-orbit torque in noncentrosymmetric Weyl semimetals", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/qwvn-kl96", "authors": "Naomi Fokkens, Fei Xue", "last_authors": "Naomi Fokkens, Fei Xue", "summary": "Author(s): Naomi Fokkens and Fei Xue Field-free deterministic switching of perpendicular ferromagnets is a central challenge for spintronics applications, typica 및 나노 규모의 스핀 구조 직접 시각화 연구가 이어질 것으로 기대됩니다.", "concepts": [{"term": "Dirac 반금속 (Dirac Semimetal)", "why_emerged": "에너지 띠 구조에서 선형 분산 관계를 갖는 Dirac 점이 페르미 준위 근처에 존재하는 물질을 설명하기 위해 등장.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "위상 절연체, Weyl 반금속, Berry 곡률."}, {"term": "스핀 질감 (Spin Texture)", "why_emerged": "운동량 공간이나 실공간에서 전자의 스핀 방향이 불균일하게 분포하는 양상을 설명하기 위해 도입됨.", "origin": "Rashba 효과 연구 등에서 초기 개념 확립.", "connections": "스핀-궤도 결합, 위상 표면 상태."}], "english_summary": ["The study examines Cd3As2/InMnAs heterostructures.", "It combines theory and experiments to probe chiral spin textures.", "The spin texture is found to be gate-tunable through external fields.", "The findings suggest potential applications for topological spintronic devices."]}}, {"title": "Generic integer and fractional quantum anomalous Hall crystals from interaction-driven band folding", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/mh3v-fb9w", "authors": "Hongyu Lu, Han-Qing Wu, Bin-Bin Chen, Wang Yao, Zi Yang Meng", "last_authors": "Wang Yao, Zi Yang Meng", "summary": "Author(s): Hongyu Lu, Han-Qing Wu, Bin-Bin Chen, Wang Yao, and Zi Yang Meng Among the extensive studies of fractional quantum anomalous Hall (FQAH) states, there recently has appeared a growing interest in the topological states with coexisting charge density wave (CDW) orders. Such states are referred to as Hall crystals. However, compared to those with integer Hall conduc… [Phys. Rev. B 113, 245105] Published Mon Jun 01, 2026", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Discusses coexistence of CDW and anomalous Hall states, both high-interest topics.", "tags": ["theory", "CDW", "anomalousHall"], "image": "", "briefing": {"background": "위상적 물성과 전하 밀도 파(CDW)와 같은 상관 전자계 현상이 공존하는 위상 물질 연구는 현재 응집물질물리학의 뜨거운 주제입니다.", "motivation": "FQAH(분수 양자 비정상 홀) 상태와 CDW가 결합한 '홀 결정(Hall crystals)' 상태에서 상호작용에 의한 띠 접힘(band folding) 현상을 체계적으로 이해하고자 합니다.", "result": "상호작용에 의한 띠 접힘이 어떻게 정수 및 분수 양자 비정상 홀 상태를 유도할 수 있는지에 대한 보편적인 이론적 틀을 구축했습니다.", "implication": "위상적 질서와 대칭성 파괴 질서가 결합한 새로운 상의 분류 체계를 제시하며, Kagome 금속 등의 관련 물질 연구에 이론적 길잡이가 됩니다.", "novelty": "FQAH와 CDW의 공존을 띠 접힘의 관점에서 통합적으로 설명했다는 점이 이론적으로 매우 중요합니다.", "unresolved": "실제 강상관 물질에서의 파라미터가 본 이론 모델의 가정을 얼마나 엄밀하게 만족하는지는 확인이 필요합니다.", "future_work": "수치적 시뮬레이션을 넘어, 실제 물질에서 이러한 상태를 확인하기 위한 광학 분광학이나 STS 연구가 요구됩니다.", "concepts": [{"term": "분수 양자 비정상 홀 상태 (FQAH)", "why_emerged": "외부 자기장 없이도 분수 양자 홀 효과가 나타나는 시스템을 설명하기 위해 필요함.", "origin": "최근 2D moire 격자 등에서 실험적으로 강하게 대두됨.", "connections": "분수 양자 홀 효과, 강상관 전자계, 위상적 질서."}, {"term": "띠 접힘 (Band Folding)", "why_emerged": "새로운 주기성(CDW 등)이 도입되어 브릴루앙 영역이 바뀔 때 에너지 띠 구조의 변화를 기술하기 위함.", "origin": "고체 물리학의 기초 결정학 이론에서 유래.", "connections": "격자 왜곡, CDW, 페르미 면 재구성."}], "english_summary": ["The paper explores the emergence of Hall crystals from FQAH states.", "Interaction-driven band folding is identified as the key mechanism.", "It provides a generic framework for integer and fractional topological Hall states.", "The work connects charge order and topological phases in strongly correlated systems."]}}, {"title": "Rashba-type spin-momentum locking in the nonsymmorphic Dirac semimetal SrIrO3 revealed by nonlinear magnetotransport", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/x5tv-wvtn", "authors": "Meng Meng, Minghui Gu, Zhuang Ji, et al.", "last_authors": "Jiandi Zhang, Jiandong Guo", "summary": "Author(s): Meng Meng, Minghui Gu, Zhuang Ji, Dongxiao Yang, Fang Yang, Xiaoran Liu, Jiandi Zhang, and Jiandong Guo We report nonreciprocal charge transport in epitaxial monoclinic ${\\mathrm{SrIrO}}_{3}$ ($m$-SIO) thin films, a nonsymmorphic symmetry-protected Dirac semimetal with strong spin-orbit coupling. Second-harmonic magnetotransport measurements reveal both bilinear magnetoelectric resistance and a nonlin… [Phys. Rev. B 113, 235403] Published Mon Jun 01, 2026", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Experimental transport study of a Dirac semimetal with strong spin-orbit coupling.", "tags": ["experiment", "material", "Diracsemimetal"], "image": "", "briefing": {"background": "위상 반금속(Topological semimetals)은 결정 대칭성에 의해 보호되는 밴드 교차점을 가지며, 강한 스핀-궤도 결합(SOC)이 존재할 때 독특한 전자 구조와 수송 현상을 나타냅니다.", "motivation": "단사정계 SrIrO3 박막에서 나타나는 비선형 자기 수송 현상을 통해, 비공간군(nonsymmorphic) 대칭성에 의해 보호되는 디락 페르미온의 스핀-운동량 잠금 효과를 검증하고자 합니다.", "result": "이차 고조파 자기 수송 측정을 통해 비가역적 전하 수송과 라쉬바형 스핀-운동량 잠금을 직접적으로 확인하였습니다.", "implication": "SrIrO3가 스핀트로닉스 소자의 재료로서 잠재력을 가짐을 시사하며, 대칭성 기반의 비선형 수송 특성이 이 물질의 위상적 성질과 직결됨을 증명합니다.", "novelty": "위상 디락 반금속에서 비선형 수송을 통한 라쉬바 효과의 정량적 확인은 스핀트로닉스 응용 및 위상 물리 연구에 중요한 실험적 단서를 제공합니다.", "unresolved": "이차 고조파 신호의 세부적인 메커니즘과 비공간군 대칭성이 구체적으로 어떻게 스핀 결합도를 극대화하는지에 대한 심층 분석이 필요합니다.", "future_work": "다른 비공간군 위상 물질로의 확장 연구 및 게이트 전압을 통한 수송 특성 제어 실험이 예상됩니다.", "concepts": [{"term": "비공간군 대칭성", "why_emerged": "결정 구조에서 단순히 병진과 회전만으로 설명되지 않는 미끄럼면(glide plane)이나 나선축(screw axis) 존재를 다루기 위해 필요합니다.", "origin": "결정학의 고전적 대칭성 이론에 기반함.", "connections": "위상 반금속의 밴드 중첩 보호 기제로 주로 언급됨."}, {"term": "스핀-운동량 잠금", "why_emerged": "스핀과 궤도 자유도가 결합되어 전자의 운동량 방향이 특정 스핀 상태와 고정되는 물리 현상을 설명하기 위함입니다.", "origin": "라쉬바(Rashba) 효과 등에 의해 초기 확립됨.", "connections": "위상 절연체 표면 상태와 스핀트로닉스 연구의 핵심."}], "english_summary": ["Investigated nonreciprocal charge transport in epitaxial monoclinic SrIrO3 thin films.", "Identified Rashba-type spin-momentum locking through second-harmonic magnetotransport.", "Confirms the nonsymmorphic symmetry-protected Dirac semimetal nature of the material.", "Provides experimental evidence for utilizing topological semimetals in spin-orbitronics."]}}, {"title": "Self-consistent Coulomb interactions from constrained dynamical mean-field theory", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/yb1w-8cxm", "authors": "Antik Sihi, Subhasish Mandal, Kristjan Haule", "last_authors": "Subhasish Mandal, Kristjan Haule", "summary": "Author(s): Antik Sihi, Subhasish Mandal, and Kristjan Haule Here, the authors develop constrained dynamical mean-field theory, a self-consistent first-principles approach for determining screened Coulomb interactions in correlated materials. The method incorporates local vertex corrections within the same many-body framework used to compute electronic spectra, yielding interaction strengths that enable excellent agreement with photoemission experiments across Mott insulators, correlated metals, altermagnets, and unconventional superconductors. [Phys. Rev. B 113, L201116] Published Fri May 29, 2026", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "DFT+DMFT methodology benchmarked against photoemission for correlated materials and altermagnets.", "tags": ["method", "photoemission", "correlatedmaterials", "altermagnet"], "image": "", "briefing": {"background": "강상관계 물질의 전자 구조는 표준 DFT만으로는 계산하기 어려우며, 이를 해결하기 위해 동역학적 평균장 이론(DMFT)이 널리 쓰입니다.", "motivation": "DMFT 계산의 핵심 파라미터인 쿨롱 상호작용(U)을 물리적 근거에 기반하여 자가 일관성 있게 결정하는 방법론이 필요했습니다.", "result": "제약된 동역학적 평균장 이론(cDMFT)을 도입하여, 로컬 정점 보정을 포함한 스크리닝된 쿨롱 상호작용을 계산하는 자가 일관적 방법을 개발했습니다.", "implication": "Mott 절연체, 알터자성체, 초전도체 등 다양한 강상관계 물질의 전자 구조를 광전자 분광(ARPES) 데이터와 매우 정확하게 일치시킬 수 있습니다.", "novelty": "기존의 경험적 파라미터 튜닝을 넘어, 많은 계산 과정에서 신뢰도를 높인 첫 번째 표준화된 자가 일관적 방법론입니다.", "unresolved": "계산 복잡도가 여전히 높으며, 대규모 결정 구조나 매우 복잡한 다중 밴드 시스템에 대한 범용성 확인이 필요합니다.", "future_work": "다양한 새로운 강상관계 물질의 스펙트럼 예측 및 실험적 데이터와의 고정밀 비교 연구가 이어질 것입니다.", "concepts": [{"term": "DMFT", "why_emerged": "강한 상관관계를 가진 다체 전자계에서 국소적 상호작용을 효과적으로 다루기 위해 등장했습니다.", "origin": "Georges와 Kotliar 등에 의해 1990년대 초반 확립.", "connections": "DFT+DMFT는 현대 고체 물리 계산의 표준으로 자리잡음."}, {"term": "알터자성체", "why_emerged": "강자성과 반강자성의 장점을 모두 가지면서도 스핀 분할(spin-splitting)이 존재하는 새로운 자기 질서를 설명하기 위해 나왔습니다.", "origin": "최근 3~4년 내 이론적으로 급부상한 개념.", "connections": "비상반적 전자 구조 및 스핀트로닉스 소자 분야와 밀접."}], "english_summary": ["Developed a self-consistent constrained dynamical mean-field theory (cDMFT).", "Calculates screened Coulomb interactions within a unified many-body framework.", " function appendBriefSection(parent, title, text, wide = false) { if (!text) return; const section = document.createElement('section'); section.className = 'brief-section' + (wide ? ' wide' : ''); section.appendChild(textEl('h2', '', title)); section.appendChild(textEl('p', '', text)); parent.appendChild(section); }
function render() {
  slideEl.replaceChildren();
  if (!slides.length) { slideEl.className = 'empty'; slideEl.textContent = 'No papers passed the filters in this run.'; counterEl.textContent = '0 / 0'; prevBtn.disabled = true; nextBtn.disabled = true; return; }
  slideEl.className = 'slide';
  const r = slides[index];
  const b = r.briefing || {};
  const head = document.createElement('div');
  head.className = 'paper-head';
  if (r.image) {
    const figure = document.createElement('figure');
    figure.className = 'figure';
    const img = document.createElement('img');
    img.src = r.image; img.alt = 'Figure or article preview image'; img.loading = 'lazy'; img.referrerPolicy = 'no-referrer'; img.onerror = () => figure.remove();
    figure.appendChild(img);
    figure.appendChild(textEl('figcaption', '', 'Figure / article preview image from the source page'));
    head.appendChild(figure);
  }
  const headText = document.createElement('div');
  headText.className = 'head-text';
  const badges = document.createElement('div');
  badges.className = 'badges';
  if (r.score) badges.appendChild(textEl('span', 'badge score', `${r.score}/10`));
  if (r.tier) badges.appendChild(textEl('span', 'badge', r.tier));
  if (r.journal) badges.appendChild(textEl('span', 'badge', r.journal));
  if (r.source) badges.appendChild(textEl('span', 'badge', r.source));
  headText.appendChild(badges);
  const title = document.createElement('h1');
  if (r.link) { const titleLink = document.createElement('a'); titleLink.href = r.link; titleLink.target = '_blank'; titleLink.rel = 'noopener noreferrer'; titleLink.textContent = r.title || ''; title.appendChild(titleLink); }
  else { title.textContent = r.title || ''; }
  headText.appendChild(title);
  headText.appendChild(textEl('p', 'meta', [r.journal, r.source].filter(Boolean).join(' | ')));
  if (r.last_authors || r.authors) { const authors = document.createElement('p'); authors.className = 'authors'; if (r.last_authors) authors.append('Last authors: ' + r.last_authors); if (r.authors) authors.append((r.last_authors ? ' | ' : '') + 'Authors: ' + r.authors); headText.appendChild(authors); }
  appendLabeledText(headText, 'why', 'Filter reason: ', r.reason);
  if (r.tags && r.tags.length) { const tags = document.createElement('div'); tags.className = 'tags'; r.tags.forEach(tag => tags.appendChild(textEl('span', 'tag', '#' + tag))); headText.appendChild(tags); }
  if (r.link) { const link = document.createElement('a'); link.className = 'link'; link.href = r.link; link.target = '_blank'; link.rel = 'noopener noreferrer'; link.textContent = 'Open paper'; headText.appendChild(link); }
  head.appendChild(headText);
  if (r.summary) { const abstract = document.createElement('p'); abstract.className = 'original-abstract'; const strong = textEl('strong', '', 'Original abstract'); abstract.appendChild(strong); abstract.append(r.summary); head.appendChild(abstract); }
  slideEl.appendChild(head);
  const briefing = document.createElement('div');
  briefing.className = 'briefing';
  appendBriefSection(briefing, 'Background', b.background);
  appendBriefSection(briefing, 'Motivation', b.motivation);
  appendBriefSection(briefing, 'Result', b.result);
  appendBriefSection(briefing, 'Implication', b.implication);
  appendBriefSection(briefing, "Why it's important / Novelty", b.novelty);
  appendBriefSection(briefing, 'Unresolved Questions', b.unresolved);
  appendBriefSection(briefing, 'Expected Future Work', b.future_work);
  if (b.concepts && b.concepts.length) {
    const section = document.createElement('section');
    section.className = 'brief-section wide';
    section.appendChild(textEl('h2', '', 'Concepts / Terms'));
    const concepts = document.createElement('div');
    concepts.className = 'concepts';
    b.concepts.forEach(c => {
      const item = document.createElement('div');
      item.className = 'concept';
      item.appendChild(textEl('h3', '', c.term || 'Concept'));
      [['왜 생겼나: ', c.why_emerged], ['누가 만들었나: ', c.origin], ['연결되는 흐름: ', c.connections]].forEach(([label, text]) => { if (!text) return; const p = document.createElement('p'); const bold = textEl('b', '', label); p.appendChild(bold); p.append(text); item.appendChild(p); });
      concepts.appendChild(item);
    });
    section.appendChild(concepts);
    briefing.appendChild(section);
  }
  if (b.english_summary && b.english_summary.length) { const section = document.createElement('section'); section.className = 'brief-section wide'; section.appendChild(textEl('h2', '', 'English Summary')); const ul = document.createElement('ul'); b.english_summary.slice(0, 5).forEach(line => ul.appendChild(textEl('li', '', line))); section.appendChild(ul); briefing.appendChild(section); }
  slideEl.appendChild(briefing);
  counterEl.textContent = `${index + 1} / ${slides.length}`;
  prevBtn.disabled = index === 0;
  nextBtn.disabled = index === slides.length - 1;
}
prevBtn.addEventListener('click', () => { index = Math.max(0, index - 1); render(); });
nextBtn.addEventListener('click', () => { index = Math.min(slides.length - 1, index + 1); render(); });
document.addEventListener('keydown', event => { if (event.key === 'ArrowLeft') prevBtn.click(); if (event.key === 'ArrowRight') nextBtn.click(); });
render();
</script>
</body>
</html>
