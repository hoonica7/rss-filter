<!DOCTYPE html>
<html lang='en'>
<head>
<meta charset='UTF-8'>
<meta name='viewport' content='width=device-width, initial-scale=1.0'>
<title>Daily Paper Slideshow</title>
<style>
  :root {
    color-scheme: light;
    --bg: #f6f7f4;
    --paper: #ffffff;
    --ink: #111827;
    --muted: #64748b;
    --line: #d8ddd2;
    --accent: #176b87;
    --accent-2: #9a3412;
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; overflow: auto; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: var(--bg); color: var(--ink); }
  .shell { max-width: 1500px; min-height: 100vh; margin: 0 auto; padding: 14px 18px; display: flex; flex-direction: column; }
  .topbar { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 16px; }
  .top-actions { display: flex; align-items: center; gap: 10px; }
  .topbar a, button { border: 1px solid var(--line); border-radius: 8px; background: var(--paper); color: var(--ink); padding: 10px 14px; font-weight: 700; text-decoration: none; cursor: pointer; }
  button.primary { background: var(--accent); border-color: var(--accent); color: white; }
  button:disabled { opacity: 0.45; cursor: not-allowed; }
  .counter { color: var(--muted); font-weight: 700; }
  .slide { min-height: calc(100vh - 82px); background: var(--paper); border: 1px solid var(--line); border-radius: 10px; padding: 18px; box-shadow: 0 18px 42px rgba(15, 23, 42, 0.10); display: grid; grid-template-columns: minmax(310px, 0.86fr) minmax(0, 1.55fr); gap: 18px; overflow: visible; }
  .paper-head { min-width: 0; min-height: 0; overflow: visible; display: flex; flex-direction: column; gap: 12px; }
  .figure { margin: 0; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: #f8fafc; }
  .figure img { display: block; width: 100%; max-height: 41vh; object-fit: contain; background: white; }
  .figure figcaption { padding: 7px 10px; color: var(--muted); font-size: 12px; line-height: 1.3; }
  .head-text { display: flex; flex-direction: column; gap: 9px; min-width: 0; }
  .badges { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .badge { border-radius: 999px; padding: 5px 9px; background: #eef2ff; color: #3730a3; font-size: 12px; font-weight: 800; }
  .score { background: #fee2e2; color: #991b1b; }
  h1 { margin: 0; font-size: 25px; line-height: 1.15; letter-spacing: 0; overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
  h1 a { color: inherit; text-decoration-color: rgba(23, 107, 135, 0.35); text-decoration-thickness: 2px; text-underline-offset: 4px; }
  h1 a:hover { color: var(--accent); text-decoration-color: var(--accent); }
  .meta, .authors, .why, .abstract { font-size: 13px; line-height: 1.45; }
  .meta, .authors { color: var(--muted); }
  .why strong, .abstract strong, .authors strong { color: var(--ink); }
  .authors { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .why { border-left: 4px solid var(--accent-2); padding-left: 10px; color: #374151; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .abstract { border-top: 1px solid var(--line); padding-top: 14px; color: #374151; }
  .original-abstract { border-top: 1px solid var(--line); padding-top: 10px; color: #374151; font-size: 11.5px; line-height: 1.35; overflow-wrap: anywhere; }
  .original-abstract strong { display: block; margin-bottom: 4px; color: var(--ink); }
  .tags { display: flex; flex-wrap: wrap; gap: 8px; }
  .tag { border-radius: 999px; padding: 4px 8px; background: #f1f5f9; color: #475569; font-size: 12px; font-weight: 700; }
  .head-text > .link { display: none; }
  .briefing { min-width: 0; min-height: 0; overflow: visible; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); grid-auto-rows: minmax(0, auto); align-content: start; gap: 11px 18px; border-top: 0; padding-top: 0; }
  .brief-section { min-width: 0; }
  .brief-section.wide { grid-column: 1 / -1; }
  .brief-section h2 { margin: 0 0 4px; font-size: 14px; line-height: 1.22; color: #0f766e; letter-spacing: 0; }
  .brief-section p, .brief-section li { margin: 0; font-size: 12.5px; line-height: 1.42; color: #1f2937; overflow-wrap: anywhere; }
  .brief-section ul { margin: 0; padding-left: 20px; }
  .concepts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 9px 14px; }
  .concept { border-top: 1px solid var(--line); padding-top: 7px; }
  .concept h3 { margin: 0 0 4px; font-size: 13px; color: #7c2d12; letter-spacing: 0; }
  .concept p { margin: 2px 0 0; font-size: 11.5px; line-height: 1.35; color: #374151; overflow-wrap: anywhere; }
  .concept b { color: #111827; }
  .link { color: var(--accent); font-weight: 800; text-decoration: none; }
  .empty { padding: 48px; background: var(--paper); border: 1px solid var(--line); border-radius: 12px; color: var(--muted); }
  @media (max-width: 860px) {
    .shell { padding: 14px; }
    .topbar, .top-actions { align-items: stretch; flex-direction: column; }
    .slide, .briefing, .concepts { grid-template-columns: 1fr; }
    .slide { min-height: auto; overflow: visible; display: grid; }
    h1 { font-size: 28px; }
  }
</style>

<script>
const slides = [{"title": "Nonreciprocal impurity scattering as a probe for pairing symmetries in kagome superconductors", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/6d8l-gzdq", "authors": "Hong-Min Jiang, Hao Du, Shun-Li Yu", "last_authors": "Hao Du, Shun-Li Yu", "summary": "The superconducting (SC) pairing symmetry and its link to time-reversal symmetry breaking (TRSB) in the vanadium-based kagome superconductors remain unresolved, with ambiguities stemming from sublattice interference and charge-density-wave (CDW) entanglement with superconductivity. Using two represe…", "tier": "A_MUST_READ", "score": "10", "reason": "Direct hit: kagome superconductors, CDW, TRSB, and pairing symmetry.", "tags": ["theory", "kagome", "superconductivity", "CDW", "TRSB"], "image": "", "briefing": {"background": "카고메 격자 구조를 가진 AV3Sb5 계열 물질은 초전도성과 전하 밀도 파(CDW), 그리고 시간 역전 대칭성 깨짐(TRSB)이 공존하거나 얽혀 있어 응집 물리학계의 큰 관심을 받고 있습니다. 특히 이 시스템에서 나타나는 비정상적인 물성들이 어떠한 초전도 페어링 대칭성에서 기인하는지를 밝히는 것이 핵심 과제입니다.", "motivation": "V 기반 카고메 초전도체에서 초전도 페어링 대칭성과 TRSB의 연결 고리는 여전히 논란의 대상입니다. 서브래티스 간섭(sublattice interference)과 CDW와의 얽힘으로 인해 실험 데이터 해석에 모호함이 존재하며, 이를 명확히 구분할 수 있는 새로운 실험적 프로브가 절실한 상황입니다.", "result": "본 연구는 비가역적 불순물 산란(nonreciprocal impurity scattering) 현상이 카고메 초전도체의 페어링 대칭성을 판별하는 유효한 도구가 될 수 있음을 이론적으로 제시했습니다. 두 가지 대표적인 페어링 상태를 가정하여 산란 패턴을 계산했으며, 불순물에 의한 준입자 간섭 패턴이 대칭성에 따라 어떻게 달라지는지 정량화했습니다.", "implication": "만약 이 이론적 예측이 STM/STS 실험을 통해 검증된다면, 오랫동안 해결되지 않았던 AV3Sb5의 초전도 상태(예: s-wave vs d-wave 또는 chiral pairing)를 확정할 수 있는 강력한 근거를 제공하게 됩니다.", "novelty": "독자의 관심사인 카고메 금속과 TRSB를 직접적으로 다루며, 특히 STM/STS와 연계될 수 있는 불순물 산란의 비가역성을 분석 도구로 제안했다는 점이 참신합니다. 이는 기존의 단순한 에너지 갭 측정 이상의 정보를 제공할 수 있습니다.", "unresolved": "실제 실험에서 CDW 도메인이나 다중 밴드 효과가 비가역적 산란 신호를 어느 정도 가릴 수 있는지, 그리고 불순물의 종류(자성 vs 비자성)에 따른 정교한 구분이 추가로 필요합니다.", "future_work": "실제 CsV3Sb5 등의 시료에 대해 제어된 불순물을 주입하고 극저온 STM을 이용해 비가역적 산란 강도를 정밀 측정하는 실험이 뒤따를 것으로 예상됩니다.", "concepts": [{"term": "비가역적 산란 (Nonreciprocal scattering)", "why_emerged": "계의 반전 대칭성이나 시간 역전 대칭성이 깨졌을 때 나타나는 산란의 비대칭성을 활용해 물질의 위상적/자기적 상태를 파악하기 위해 등장했습니다.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "비가역적 수송 현상, 다이오드 효과, 시간 역전 대칭성 깨짐(TRSB)"}, {"term": "카고메 초전도체 (Kagome Superconductor)", "why_emerged": "기하학적 좌절(frustration)이 있는 격자 구조에서 나타나는 특이한 전자 구조(Flat band, Dirac cone)와 초전도성의 상호작용을 연구하기 위해 주목받았습니다.", "origin": "AV3Sb5 (A=K, Rb, Cs) 화합물의 발견 이후 급증", "connections": "AV3Sb5, 전하 밀도 파(CDW), 위상 초전도체"}], "english_summary": ["The study proposes nonreciprocal impurity scattering as a theoretical probe to identify pairing symmetries in vanadium-based kagome superconductors.", "It addresses the ambiguity caused by CDW entanglement and sublattice interference in determining the superconducting state.", "The findings suggest that STM-based quasiparticle interference can distinguish between different TRSB scenarios.", "This is highly relevant for researchers focusing on the interplay between topology and superconductivity in AV3Sb5."]}}, {"title": "Phonon fluctuation diagnostics: Origin of charge order in AV3Sb5 kagome metals", "journal": "PRB_Recent", "source": "author whitelist", "link": "http://link.aps.org/doi/10.1103/czn6-ndzm", "authors": "Stefan Enzner, Jan Berges, Arne Schobert, et al.", "last_authors": "Domenico Di Sante, Giorgio Sangiovanni", "summary": "The authors utilize phonon fluctuation diagnostics here to resolve the open question of the microscopic origin of charge density wave order in A V 3 Sb 5 ( A =K, Rb, Cs) kagome metals. Here, combining momentum-resolved a b i n i t i o calculations with ARPES measurements, they identify electron-phonon coupling as the primary driver of the lattice instability, rather than Van Hove singularities or nesting alone. Remarkably, the strongest contributions arise away from the high-symmetry M points, revealing a common mechanism across the three compounds.", "tier": "A_MUST_READ", "score": "10", "reason": "author whitelist: Riccardo Comin", "tags": ["ARPES", "kagome", "chargedensitywave", "phonon"], "image": "", "briefing": {"background": "AV3Sb5(A=K, Rb, Cs) 카고메 금속에서 전하 밀도 파(CDW)의 기원은 지난 수년간 뜨거운 논쟁거리였습니다. 전자 구조의 네스팅(nesting)이나 반 호브 특이점(Van Hove singularity) 같은 순수 전자적 요인인지, 아니면 격자 진동(phonon)과의 결합이 핵심인지에 대한 명확한 결론이 부족했습니다.", "motivation": "본 연구는 '포논 플럭추에이션 진단(phonon fluctuation diagnostics)'이라는 기법을 통해 AV3Sb5 계열 전체에서 나타나는 CDW의 공통적인 미시적 구동력을 규명하고자 했습니다.", "result": "제일원리 계산(ab initio)과 ARPES 측면을 결합하여 분석한 결과, CDW 불안정성의 주된 원인이 단순한 페르미면 네스팅이 아니라 강력한 전자-포논 결합(EPC)임을 밝혀냈습니다. 특히, 고대칭점인 M 지점이 아닌 다른 영역에서의 기여가 결정적이라는 점을 확인했습니다.", "implication": "이 결과는 카고메 시스템의 CDW를 이해할 때 전자 간의 상관관계뿐만 아니라 격자와의 상호작용을 반드시 핵심 요소로 포함해야 함을 시사합니다. 이는 해당 물질군의 초전도 메커니즘 해석에도 영향을 미칩니다.", "novelty": "화이트리스트 저자인 Riccardo Comin 등이 참여한 연구로, 고해상도 ARPES 데이터와 정밀한 이론 계산을 매칭하여 EPC의 역할을 명확히 규명했습니다. 독자의 관심사인 ARPES와 카고메 CDW를 완벽히 관통하는 주제입니다.", "unresolved": "전자-포논 결합이 지배적임에도 불구하고, 왜 일부 온도 영역에서 TRSB와 같은 비정상적인 전자 현상이 동반되는지에 대한 추가적인 설명이 필요합니다.", "future_work": "온도 변화에 따른 포논 분산의 변화를 비탄성 X-선 산란(IXS)이나 RIXS를 통해 직접 관측하여 본 연구의 계산 결과를 검증하는 단계가 예상됩니다.", "concepts": [{"term": "전자-포논 결합 (Electron-Phonon Coupling, EPC)", "why_emerged": "전자의 흐름과 격자의 진동이 어떻게 상호작용하여 저항을 만들거나 초전도 상태를 형성하는지 설명하기 위해 도입되었습니다.", "origin": "BCS 이론 및 Fröhlich 모델", "connections": "초전도성, 전하 밀도 파(CDW), 폴라론(Polaron)"}, {"term": "반 호브 특이점 (Van Hove Singularity)", "why_emerged": "상태 밀도(DOS)가 급격히 높아지는 지점에서 전하 질서나 초전도성이 발달하기 쉬운 조건을 설명하기 위해 사용됩니다.", "origin": "Leon Van Hove (1953)", "connections": "상태 밀도(DOS), 페르미면 네스팅, 카고메 격자"}], "english_summary": ["The researchers identify electron-phonon coupling as the primary driver of CDW in AV3Sb5 kagome metals, rather than electronic nesting alone.", "Combining ab initio calculations with ARPES, they pinpoint significant phonon contributions originating away from high-symmetry M points.", "This mechanism is found to be universal across K, Rb, and Cs-based kagome compounds.", "The study shifts the focus toward lattice-driven instabilities in understanding the complex phase diagrams of kagome systems."]}}, {"title": "Probing La-based nickelates with Ni0.16em0ex1s core-level photoelectron spectroscopy", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/fkvs-lfjm", "authors": "Daisuke Takegami, Naoki Ito, Koto Fujinuma, et al.", "last_authors": "Berit H. Goodge, Atsushi Hariki", "summary": "We present a comparative Ni core level photoemission study of La 3 Ni 2 O 7 , Nd 3 Ni 2 O 7 , and LaNiO 3 using both the Ni 2 p and the Ni 1 s . We address the challenges in analyzing the widely investigated Ni 2 p spectra arising from the substantial overlap in energy of the Ni 2 p with the La 3 d . We show that, on the other hand, the deep Ni 1 s core level does provide a clean view on the intrinsic electronic excitations and we highlight its potential to resolve detailed differences in the electronic structure within the strongly correlated Ruddlesden-Popper series La n + 1 Ni n O 3 n + 1 .", "tier": "A_MUST_READ", "score": "9", "reason": "Photoemission study of nickelates, highly relevant to ARPES and unconventional superconductivity.", "tags": ["experiment", "photoemission", "nickelates", "electronicstructure"], "image": "", "briefing": {"background": "최근 La3Ni2O7과 같은 니켈레이트(nickelates)에서 고압 하의 고온 초전도성이 발견되면서, 구리 산화물(cuprates)과 유사하거나 차별화된 전자 구조를 밝히는 것이 매우 중요해졌습니다. 이를 위해 광전자 분광법(PES)이 널리 활용됩니다.", "motivation": "기존에 주로 연구되던 Ni 2p 코어 레벨 스펙트럼은 La 3d 피크와 에너지 영역이 겹쳐서 해석이 매우 까다로웠습니다. 본 연구는 이러한 간섭 없이 니켈레이트의 전자 구조를 깨끗하게 관측할 수 있는 새로운 경로를 찾고자 했습니다.", "result": "연구팀은 Ni 2p 대신 더 깊은 코어 레벨인 Ni 1s를 측정함으로써 La의 방해 없이 순수한 Ni의 전자 여기 상태를 관찰하는 데 성공했습니다. 이를 통해 Ruddlesden-Popper 계열 니켈레이트(La n+1 Ni n O 3n+1) 내의 미세한 전자 구조 차이를 성공적으로 구분해냈습니다.", "implication": "Ni 1s PES가 니켈 기반 강상관 전자계 물질의 전자 구조를 연구하는 데 있어 표준적인 고신뢰도 도구가 될 수 있음을 입증했습니다. 이는 니켈레이트의 초전도 기원을 연구하는 실험적 데이터의 정확도를 높여줄 것입니다.", "novelty": "일반적으로 측정하기 어려운 Ni 1s 레벨을 활용하여 해상도와 분석의 명확성을 획기적으로 개선했다는 점이 돋보입니다. 비전형적 초전도체와 ARPES/PES에 관심이 많은 독자에게 방법론적 혁신을 제공합니다.", "unresolved": "Ni 1s 측정은 매우 높은 에너지의 X-선 소스가 필요하므로, 실험실 규모의 장비보다는 대형 방사광 가속기 시설에 의존해야 한다는 접근성 문제가 있습니다.", "future_work": "고압 환경에서 Ni 1s PES를 수행하여, 실제 초전도 전이가 일어나는 조건에서의 전자 상태 변화를 실시간으로 추적하는 연구가 기대됩니다.", "concepts": [{"term": "니켈레이트 (Nickelates)", "why_emerged": "구리 산화물 초전도체와 유사한 전자 배치를 가진 물질로서 새로운 고온 초전도체 후보군으로 발굴되었습니다.", "origin": "LaNiO3 기반 박막 및 Ruddlesden-Popper 구조 연구", "connections": "La3Ni2O7, 고온 초전도, 구리 산화물(Cuprates)"}, {"term": "코어 레벨 광전자 분광법 (Core-level PES)", "why_emerged": "물질 내부 원자의 화학적 상태와 국소적인 전자 상관관계를 직접적으로 파악하기 위해 필수적입니다.", "origin": "Kai Siegbahn (1950년대, XPS 개발)", "connections": "XPS, 화학적 이동(Chemical shift), 다체 효과(Many-body effects)"}], "english_summary": ["This study demonstrates that Ni 1s core-level PES provides a cleaner probe for La-based nickelates compared to the overlapping Ni 2p and La 3d spectra.", "The researchers analyzed La3Ni2O7, Nd3Ni2O7, and LaNiO3 to resolve intrinsic electronic excitations without lanthanide interference.", "The findings highlight Ni 1s as a powerful tool for investigating the electronic structure of the strongly correlated Ruddlesden-Popper series.", "This methodological advancement is crucial for clarifying the role of Ni d-orbitals in nickelate superconductivity."]}}, {"title": "Strain engineering of superconductivity in the kagome metal CsV3Sb5: Combined first-principles and Eliashberg theory study", "journal": "PRB_Recent", "source": "keyword", "link": "http://link.aps.org/doi/10.1103/mk6j-3qk4", "authors": "D. Hu, Yizhi Li, Jianxin Zhong, Lijun Meng", "last_authors": "Jianxin Zhong, Lijun Meng", "summary": "The kagome metal ${\\mathrm{CsV}}_{3}{\\mathrm{Sb}}_{5}$ provides a unique platform for studying intertwined quantum orders. Combing first-principles calculations and the Eliashberg theory of electron-phonon coupling (EPC), this work reveals axial-strain effects on superconducting properties of the ka…", "tier": "A_MUST_READ", "score": "9", "reason": "title strong match: kagome metal", "tags": ["kagome", "superconduct", "phonon"], "image": "", "briefing": {"background": "Kagome 금속 CsV3Sb5는 전하 밀도 파(CDW)와 초전도성이 공존하는 다체 물리 연구의 중심지입니다. 격자 진동(phonon)과 전자 상태의 상호작용은 이 시스템의 초전도 기원을 이해하는 핵심 요소입니다.", "motivation": "축 방향 변형(axial strain)이 격자 구조와 전자-포논 결합에 변화를 주어 CsV3Sb5의 초전도 전이 온도(Tc)와 상태를 어떻게 조절할 수 있는지 이론적으로 규명하고자 합니다.", "result": "제1원리 계산과 Eliashberg 이론을 결합하여, 특정 변형 조건에서 전자-포논 결합이 강화되어 초전도 특성이 민감하게 반응함을 보였습니다.", "implication": "물리적 압력이나 박막 성장을 통한 변형 공학이 CsV3Sb5의 초전도성을 제어하는 유효한 수단임을 시사합니다.", "novelty": "실제 실험에서 흔히 사용하는 변형 제어를 통해 CsV3Sb5의 복잡한 상관관계를 조절할 수 있는 구체적인 가이드라인을 제공합니다.", "unresolved": "이 연구는 포논 매개 초전도성을 중심으로 기술되어 있으며, 본 시스템의 핵심인 비전통적 초전도 기원(전자 상관관계)과의 경쟁/협력 관계는 추가 연구가 필요합니다.", "future_work": "실제 실험적인 변형 하에서의 ARPES 측정이나 수송 특성 측정과 비교 검증이 요구됩니다.", "concepts": [{"term": "Eliashberg theory", "why_emerged": "BCS 이론의 약한 결합 근사를 넘어 강력한 전자-포논 결합을 다루기 위해 필요.", "origin": "Eliashberg (1960)", "connections": "BCS 이론, Migdal 정리, 강결합 초전도체."}, {"term": "Axial strain", "why_emerged": "격자 상수를 물리적으로 변화시켜 페르미 면의 형상이나 상태 밀도를 조절하기 위해 사용.", "origin": "초기 고체물리학부터 활용됨.", "connections": "압력 효과, 박막 기판 왜곡."}], "english_summary": ["Investigated strain effects on CsV3Sb5 superconductivity.", "Used first-principles combined with Eliashberg theory.", "Identified critical changes in electron-phonon coupling under strain.", "Suggests strain engineering as a tool to tune superconducting phases."]}}, {"title": "Triple-well ferroelectricity and a kagomelike Chern flat band in two-dimensional multiferroic CuVP2Se6", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/jkkw-5bzw", "authors": "Brian Anchico, Jingyi Duan, Haojie Sun, Minjun Wang, Mikhail Talanov, Wei Jiang", "last_authors": "Mikhail Talanov, Wei Jiang", "summary": "Two-dimensional multiferroics that host nontrivial topological bands offer a rich platform for correlated and tunable quantum phenomena, yet such materials remain rare. Here, using first-principles calculations, we reveal that monolayer ${\\mathrm{CuVP}}_{2}{\\mathrm{Se}}_{6}$ unites a tunable triple-…", "tier": "A_MUST_READ", "score": "9", "reason": "Direct interest: kagome-like, Chern flat band in 2D topological multiferroic.", "tags": ["theory", "kagome", "Chern", "2Dmaterial", "topological", "correlatedelectrons", "electronicstructure"], "image": "", "briefing": {"background": "2차원 다강체(multiferroics)는 자성과 강유전성이 결합되어 복합적인 물리 현상을 보여주며, 여기에 위상적 밴드 구조가 더해지면 양자 이상 홀 효과 등 소자 응용 가능성이 매우 높습니다.", "motivation": "단층 CuVP2Se6 물질이 가진 다강체 특성과 위상적 밴드인 Chern flat band의 공존 가능성을 이론적으로 탐색하고자 합니다.", "result": "단층 CuVP2Se6가 세 개의 안정적인 강유전 상태(triple-well)를 가짐과 동시에 Kagome 격자와 유사한 위상적 Chern 평탄 밴드를 형성함을 발견했습니다.", "implication": "이 물질은 비전통적인 위상 다강체로서, 외부 전기장으로 위상 상태를 스위칭할 수 있는 차세대 양자 소자 플랫폼이 될 수 있습니다.", "novelty": "2차원 물질에서 위상 밴드와 다강성을 동시에 구현했다는 점에서 독특하며, 특히 Kagome 유사 구조를 가짐으로써 강한 전자 상관관계 연구의 새로운 후보군이 됩니다.", "unresolved": "실제 합성 및 박리 가능성에 대한 실험적 증거와, 실제 물질 내에서의 강한 전자 상관관계에 의한 위상적 상태의 안정성은 추가 검증이 필요합니다.", "future_work": "실험적인 STM/STS를 통한 밴드 구조 관측과 전기적 분극 측정, 그리고 자기적 성질에 대한 심층적인 연구가 필요합니다.", "concepts": [{"term": "Chern flat band", "why_emerged": "강한 상관관계 전자계에서 위상적으로 보호받는 분수 양자 홀 효과 등을 구현하기 위해 필요.", "origin": "Haldane 모델에서 유래.", "connections": "무어-레아 상태, 분수 양자 홀 효과, 모아레 격자."}, {"term": "Multiferroic", "why_emerged": "자성과 전기적 편극이 공존하는 시스템을 통해 자기적 메모리를 전기적으로 제어하기 위해.", "origin": "Schmidt and Schmid (1973).", "connections": "강유전체, 강자성체, Magnetoelectric 효과."}], "english_summary": ["Reveals monolayer CuVP2Se6 as a 2D multiferroic.", "Identifies a kagome-like Chern flat band structure.", "Proposes triple-well ferroelectricity for state switching.", "Highlights potential for topological quantum device integration."]}}, {"title": "Magnetic-Field-Induced Tomonaga-Luttinger Liquid and Bose-Einstein Condensate Phases in an Organic S=1 Haldane Chain", "journal": "PRL_Recent", "source": "keyword", "link": "http://link.aps.org/doi/10.1103/89k5-p261", "authors": "Ivan Jakovac, Mihael S. Grbić, Maxime Dupont, et al.", "last_authors": "Masashi Takigawa, Mladen Horvatić", "summary": "Researchers have gained access to the rich physics of a landmark model magnet by assembling a crystal out of organic magnetic molecules.", "tier": "A_MUST_READ", "score": "9", "reason": "title strong match: Luttinger liquid", "tags": ["Luttinger"], "image": "", "briefing": {"background": "유기 분자 기반의 저차원 자성체는 스핀 사슬(spin chain) 시스템의 물리적 모델을 실현하기 좋은 플랫폼입니다. 특히 Haldane 사슬은 토폴로지적 성질과 양자 상전이를 연구하는 핵심 모델입니다.", "motivation": "유기 S=1 Haldane 사슬 물질에서 자기장을 가했을 때 나타나는 Tomonaga-Luttinger 액체상과 보스-아인슈타인 응축(BEC) 상을 실험적으로 관측하고 이해하고자 합니다.", "result": "유기 분자 자석을 사용하여 자기장 유도 상전이를 성공적으로 관측하였으며, 이 물질이 이론적인 1차원 양자 스핀 모델을 잘 재현함을 보였습니다.", "implication": "복잡한 고체 물질 대신 제어 가능한 유기 분자 결정으로 1차원 강상관 전자계의 정밀한 물성 탐구가 가능함을 입증했습니다.", "novelty": "Haldane 사슬에서 스핀-전하 분리와 같은 Luttinger 액체 물성을 정밀하게 실험으로 확인했다는 점이 중요합니다.", "unresolved": "유기물 결정의 결함이나 실제 3차원적 결합이 완전한 1차원 모델과 어떻게 편차를 만드는지에 대한 이해가 추가로 필요합니다.", "future_work": "더 낮은 온도와 더 강한 자기장에서의 상전이 세부 분석 및 중성자 산란 실험 등을 통한 스핀 여기 모드 관측.", "concepts": [{"term": "Tomonaga-Luttinger Liquid", "why_emerged": "1차원 시스템에서 페르미 액체 이론이 실패함에 따라 나타나는 집단적 여기 현상을 기술하기 위해.", "origin": "Tomonaga (1950), Luttinger (1963).", "connections": "스핀-전하 분리, 1D 금속, 양자 스핀 사슬."}, {"term": "Haldane chain", "why_emerged": "정수 스핀 사슬의 토폴로지적 간극(gap) 존재를 설명하기 위해.", "origin": "Haldane (1983).", "connections": "위상적 절연체, 스핀 액체, AKLT 모델."}], "english_summary": ["Studied organic S=1 Haldane chain magnet.", "Observed magnetic-field-induced TLL and BEC phases.", "Demonstrates high-fidelity realization of 1D quantum models.", "Provides insight into collective excitations in spin chains."]}}, {"title": "Anomalous thermoelectric and thermal Hall effects in irradiated altermagnets", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/dqs3-935d", "authors": "Fang Qin (覃昉), Xiao-Bin Qiang", "last_authors": "Fang Qin (覃昉), Xiao-Bin Qiang", "summary": "We show that a $d$-wave altermagnet can be transformed into a Chern insulator by irradiating it with elliptically polarized light from a high-frequency "implication": "CuF2와 같은 간단한 화합물에서도 고도의 스핀 의존 전자 구조 제어가 가능함을 시사하여 스핀트로닉스 재료로서의 잠재력을 높임.", "novelty": "최근 주목받는 altermagnetism 분야의 물리적 원리를 구체적인 물질 모델에서 검증함으로써 이론과 실험을 잇는 연구.", "unresolved": "해당 d-파 스핀 분할이 실제 전도성이나 광학적 성질에서 어떻게 나타나는지에 대한 추가적인 상세 연구 필요.", "future_work": "스핀 분할이 존재하는 반강자성체에서의 비전통적 홀 효과나 전류 유도 토크에 대한 실험 연구.", "concepts": [{"term": "Altermagnetism", "why_emerged": "자화는 0이지만 스핀 분할이 존재하는 새로운 자기 상을 구분하기 위해 등장함.", "origin": "최근 3-4년 내 이론적 정립.", "connections": "반강자성, 비상반성 스핀 분할(nonrelativistic spin splitting)."}, {"term": "d-wave spin splitting", "why_emerged": "k-공간에서 스핀 분할이 d-파 형태의 대칭성을 가질 때 이를 기술하기 위해 사용됨.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "결정 대칭성, 알터마그네틱 밴드 구조."}], "english_summary": ["Investigates the origin of bulk d-wave spin splitting in transition-metal difluorides like CuF2.", "Confirms that compensated antiferromagnets can exhibit nonrelativistic spin splitting.", "Provides theoretical insight into the band structure of altermagnetic materials.", "Highlights the potential for spintronic applications in simple antiferromagnetic compounds."]}}, {"title": "Robust realization of spin-polarized specular Andreev reflection in V2O-based altermagnets", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/311w-d5y1", "authors": "Yutaro Nagae, Andreas P. Schnyder, Satoshi Ikegaya", "last_authors": "Andreas P. Schnyder, Satoshi Ikegaya", "summary": "We theoretically investigate charge transport in a junction between a conventional superconductor and a ${\\mathrm{V}}_{2}\\mathrm{O}$-based altermagnet exhibiting distinctive spin-split quasi-one-dimensional Fermi surfaces. The altermagnet is described by a microscopically motivated seven-basis-state…", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Andreev reflection and altermagnets link well to the user's interest in magnetic topological materials.", "tags": ["theory", "altermagnet", "superconduct"], "image": "", "briefing": {"background": "알터마그넷(Altermagnet)은 비자성체와 강자성체의 특성을 동시에 가지며, 스핀-궤도 결합 없이도 스핀이 분리된 전자 구조를 갖는 새로운 자기 물질군입니다.", "motivation": "V2O 기반 알터마그넷과 초전도체 접합에서 나타나는 특이한 스핀 편극 안드레예프 반사(Andreev reflection) 현상을 이론적으로 분석하고자 합니다.", "result": "준 1차원 페르미 표면을 가진 알터마그넷의 특성이 초전도체와의 접합에서 어떻게 스핀-편극된 준입자 수송을 유도하는지 규명하였습니다.", "implication": "알터마그넷을 이용한 스핀트로닉스 소자나 초전도-자성체 하이브리드 시스템에서 전하 수송을 정밀하게 제어할 가능성을 제시합니다.", "novelty": "기존의 강자성체 기반 접합과 달리, 스핀-궤도 결합에 의존하지 않는 알터마그넷 특유의 페르미 표면 분리를 통해 새로운 스핀 편극 수송 메커니즘을 밝혀냈습니다.", "unresolved": "실제 V2O 기반 박막 접합 제작 시 발생하는 계면 결함이나 무질서(disorder)가 이러한 로버스트한 수송 특성을 얼마나 유지시킬지는 미지수입니다.", "future_work": "실제 나노 구조 기반의 접합 실험을 통해 이론적 예측치를 검증하고, 스핀 편극 전류 제어 소자로서의 성능을 측정해야 합니다.", "concepts": [{"term": "알터마그넷", "why_emerged": "기존 자성체 분류(강자성/반강자성)로 설명되지 않는, 스핀 분리된 전자 구조를 가진 물질을 구분하기 위해 제안되었습니다.", "origin": "최근 2-3년 내 여러 이론 그룹(예: Šmejkal et al.)에 의해 체계화되었습니다.", "connections": "반강자성체, 스핀트로닉스, 비상반적 수송 현상."}, {"term": "안드레예프 반사", "why_emerged": "금속과 초전도체 계면에서 전하가 어떻게 전달되는지 이해하기 위해 도입되었습니다.", "origin": "1964년 A. F. Andreev에 의해 처음 제안되었습니다.", "connections": "앤더슨 유사, 조셉슨 효과, 마요라나 페르미온 탐지."}], "english_summary": ["The paper theoretically models junctions between superconductors and V2O-based altermagnets.", "It focuses on spin-polarized Andreev reflection driven by spin-split quasi-1D Fermi surfaces.", "The study identifies robust spin-polarized transport without needing intrinsic spin-orbit coupling.", "This highlights potential for altermagnets in future superconducting spintronic applications."]}}, {"title": "Emergent Gauge Fields and Linear Dichroism in Spin-Textured Altermagnets", "journal": "PRL_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/phr7-1zy5", "authors": "Andrea Maiani", "last_authors": "Andrea Maiani", "summary": "Spin textures are ubiquitous in antiferromagnets, yet their consequences for altermagnets remain largely unexplored. We show that smooth spatial variations of the Néel order act on itinerant electrons as emergent gauge fields that couple to the altermagnetic sublattice-odd channel. For a coplanar spin helix, this channel generates two responses that vanish when it is removed: a momentum-resolved sublattice-odd spectral structure and a net interband linear dichroism whose principal axes are controlled by the helix wave vector, so the optical response can be steered by the magnetic texture. The dichroism exhibits two distinct regimes separated by a crossover: at low frequencies the absorption axis is locked to the crystal axes, while at high frequencies it tracks the helix. Anisotropic dc transport provides a complementary quantitative signature, and all signatures are robust to weak intrinsic spin-orbit coupling. Our results identify polarization-resolved optics and sublattice-sensitive spectroscopy as direct probes of textured altermagnetic states and suggest a route to direction-selective electronic and optical functionality in altermagnets.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Highly relevant theory on altermagnetism and itinerant electron coupling, a specific user interest.", "tags": ["theory", "altermagnetism", "electronic-structure"], "image": "", "briefing": {"background": "알터마그넷 내에서 스핀 텍스처(spin texture)가 전자 구조와 상호작용하는 물리적 기작을 이해하는 것은 응집물질물리학의 최신 도전 과제 중 하나입니다.", "motivation": "알터마그넷에서 Néel 오더의 공간적 변화(나선형 구조 등)가 편극된 전자들에게 어떤 물리적 영향을 미치는지 규명하고자 합니다.", "result": "공간적으로 변화하는 스핀 텍스처가 전자에게 '창발적 게이지 필드(emergent gauge field)'처럼 작용하여 서브격자-홀수(sublattice-odd) 채널에 영향을 준다는 것을 밝혔습니다.", "implication": "자기 텍스처를 조절함으로써 알터마그넷의 광학적 반응(선이색성 등)을 제어할 수 있는 새로운 길을 열었습니다.", "novelty": "알터마그넷의 자기 텍스처가 빛의 편극과 결합하는 방식을 이론화했으며, 이를 통해 자기 구조를 광학적으로 직접 프로빙할 수 있는 근거를 제공합니다.", "unresolved": "실제 물질의 불균일성이 창발적 게이지 필드에 의한 광학적 응답을 어느 정도 상쇄시킬지에 대한 정량적 평가는 추가 연구가 필요합니다.", "future_work": "편극 분해 분광법이나 ARPES를 사용하여 특정 자기 나선 구조를 가진 물질에서 제시된 선이색성 반응을 직접 측정하는 실험이 필요합니다.", "concepts": [{"term": "창발적 게이지 필드", "why_emerged": "스핀이 공간적으로 비틀린 구조를 가질 때, 전자가 겪는 유효 자기장을 기술하기 위해 도입되었습니다.", "origin": "스핀트로닉스와 위상물질 연구에서 널리 활용되어 왔으며 특정인의 제안보다는 이론적 전개가 주류입 ms.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Database of twisted 2D materials, directly relevant to moiré/correlated physics.", "tags": ["2Dmaterials", "moire", "topologicalmaterials", "database", "theory"], "image": "", "briefing": {"background": "모아레(moiré) 초격자는 서로 다른 격자 상수나 회전각을 가진 2D 물질을 적층할 때 발생하는 거대한 주기성으로, 강상관 전자계와 위상물질 연구의 핵심 플랫폼입니다.", "motivation": "기존에 알려진 모아레 시스템 외에 더 방대한 후보군을 체계적으로 발굴하여 위상 물리 및 강상관 현상을 연구할 수 있는 플랫폼을 확장하고자 합니다.", "result": "위상 2D 물질 데이터베이스(2D-TQCDB)를 기반으로 고효율 알고리즘을 사용하여 모아레 모델링이 가능한 수천 개의 '이론적 트위스트 가능 물질' 후보군을 식별했습니다.", "implication": "실험 물리 연구자들에게 모아레 기반의 강상관 물리학 연구를 위한 새로운 실험적 토대를 제공합니다.", "novelty": "단순한 후보 제시를 넘어, 결정 성장 및 박리 가능성까지 고려한 실용적인 데이터베이스를 구축했다는 점이 강점입니다.", "unresolved": "계산된 모든 후보 물질들이 실제 실험적으로 안정적인 박리나 회전각 제어가 가능한지는 아직 검증되지 않았습니다.", "future_work": "데이터베이스에 기반한 특정 후보 물질의 실제 소자 제작 및 ARPES를 통한 밴드 구조 관측이 기대됩니다.", "concepts": [{"term": "모아레 초격자", "why_emerged": "2D 층간 회전각 조절을 통해 밴드 구조를 엔지니어링하기 위해 필요", "origin": "전통적인 광학 모아레 패턴에서 유래, 2D 전자계 적용은 트위스트 이층 그래핀(2018) 전후로 본격화", "connections": "강상관 전자계, 초전도체, 밴드 평탄화"}, {"term": "TQC(Topological Quantum Chemistry)", "why_emerged": "물질의 위상적 성질을 결정 대칭성으로 체계적으로 분류하기 위해 필요", "origin": "Bradlyn et al., Nature (2017)", "connections": "밴드 표현 이론, 위상 절연체"}, {"term": "트위스트 가능 물질", "why_emerged": "모아레 물리학의 적용 범위를 그래핀을 넘어 범용 2D 물질로 확장하기 위함", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "2D-TQCDB, 적층 구조"}], "english_summary": ["Systematic identification of theoretically twistable 2D materials for moiré physics.", "Utilized the Topological 2D Materials Database (2D-TQCDB) for high-throughput screening.", "Provides thousands of candidates, including insulators and semimetals, for future research.", "Offers guidance on exfoliation and growth to facilitate experimental realization."]}}, {"title": "Antiferroelectric hafnia down to the 2D limit", "journal": "Science", "source": "Gemini", "link": "https://doi.org/10.1126/science.ady5526", "authors": "Xin Li, Guodong Ren, Haidong Lu, et al.", "last_authors": "Rohan Mishra, Xiaoshan Xu", "summary": "Antiferroelectricity is a material property characterized by alternating electric dipoles spontaneously ordered in antiparallel directions. Antiferroelectrics are promising for energy storage, solid-state cooling, and memory technologies; however, these materials are scarce, and their scalability remains largely unexplored. In this work, we demonstrate that single-crystalline hafnia, a lead-free CMOS-compatible material, exhibits antiferroelectricity under compressive-strain conditions. We observe antiparallel sublattice polarization and stable double-hysteresis in single-crystalline (111)-oriented epitaxial La-doped hafnia films grown on yttrium-stabilized zirconia and show that the antipolar orthorhombic phase of hafnia adheres to the Kittel model of antiferroelectricity. Notably, compressive strain strengthens the orthorhombic order in thinner La-doped hafnia films, achieving a very high ordering temperature of 850°C in the two-dimensional limit, highlighting hafnia’s potential for advanced antiferroelectric devices.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Study of 2D antiferroelectricity in hafnia, relevant to materials physics and functionality.", "tags": ["antiferroelectricity", "2Dmaterials", "functionalmaterials"], "image": "", "briefing": {"background": "반강유전체는 쌍극자 모멘트가 서로 반대 방향으로 정렬되어 있어 에너지 저장 및 메모리 소자로서 큰 주목을 받지만, 2D 한계 영역에서의 구현은 매우 도전적인 과제입니다.", "motivation": "반강유전체의 소형화 및 확장성을 검증하고, 2D 극한 환경에서도 이러한 물성이 유지되는지 확인하고자 합니다.", "result": "단결정 하프니아(HfO2)가 압축 변형 하에서 반강유전성을 나타내며, 2D 한계에서도 850°C라는 매우 높은 온도에서 반강유전 질서가 유지됨을 확인했습니다.", "implication": "CMOS 공정과 호환되는 하프니아를 활용하여 차세대 비휘발성 메모리 및 초소형 반강유전 소자 개발의 가능성을 열었습니다.", "novelty": "2D 극한 영역까지 반강유전성이 유지됨을 실험적으로 입증하였으며, 이는 Kittel 모델로 정량적 설명이 가능함을 보였습니다.", "unresolved": "실제 소자 구동 시 발생하는 결함이나 히스테리시스의 반복 안정성에 대한 구체적 분석이 추가로 필요합니다.", "future_work": "다양한 도핑 및 변형 엔지니어링을 통한 물성 최적화와 소자 통합 연구가 이어질 것입니다.", "concepts": [{"term": "반강유전체", "why_emerged": "전기 쌍극자의 역평행 정렬을 통해 높은 에너지 밀도와 빠른 스위칭 속도를 확보하기 위해", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "강유전체, 비휘발성 메모리"}, {"term": "Kittel 모델", "why_emerged": "반강유전체의 미세한 분극 정렬 구조를 기술하기 위해", "origin": "Charles Kittel (1951)", "connections": "쌍극자 상호작용, 위상 전이"}, {"term": "하프니아(HfO2)", "why_emerged": "높은 유전율과 반도체 공정과의 높은 호환성 때문에 주목", "origin": "산업계 연구 중 발견", "connections": "강유전성 하프니아, CMOS 공정"}], "english_summary": ["Demonstrates antiferroelectricity in single-crystalline hafnia films down to the 2D limit.", "Observes antipolar orthorhombic phase and stable double-hysteresis.", "Maintains ordering up to 850°C, showing suitability for advanced device integration.", "Confirms adherence to the classical Kittel model for antiferroelectricity."]}}, {"title": "Two-dimensional topological quantum chemistry and catalog of topological materials", "journal": "Science", "source": "Gemini", "link": "https://doi.org/10.1126/science.adu2107", "authors": "Urko Petralanda, Yi Jiang, Hanqi Pi, et al.", "last_authors": "Nicolas Regnault, Luis Elcoro", "summary": "Two-dimensional (2D) topological materials host symmetry-protected, disorder-robust edge states central to quantum technologies. Yet they remain scarce compared with their 3D counterparts. We adapted the topological quantum chemistry formalism to layer groups and studied the band topology of 8872 entries from the computational materials databases C2DB and MC2D. We found 4073 topological or obstructed entries, including 905 topological insulators and 1003 obstructed atomic insulators, greatly expanding the library of such materials in two dimensions. Detailed electronic and topological properties of all materials have been compiled into a Topological 2D Materials Database (2D-TQCDB), and the edge states of selected new materials have been studied in detail. Our methodology has been implemented in publicly available programs, designed to study the topology of any nonmagnetic monolayer or multilayer material.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Computational catalog of 2D topological materials directly relevant to user's interests.", "tags": ["theory", "topologicalmaterials", "2Dmaterials", "computationalmaterialsdiscovery", "electronicstructure"], "image": "", "briefing": {"background": "위상 물질은 대칭성에 의해 보호되는 에지 상태(edge state) 덕분에 저손실 전도 등을 구현할 수 있어 양자 기술의 핵심 요소로 간주됩니다.", "motivation": "3D 물질에 비해 상대적으로 데이터가 부족한 2D 물질 분야에서 위상적 성질을 가진 물질을 체계적으로 분류하고 카탈로그화하고자 합니다.", "result": "약 9,000개의 2D 물질을 분석하여 4,000개 이상의 위상적 성질(위상 절연체 및 방해된 원자 절연체 등)을 가진 물질을 찾아내어 데이터베이스화했습니다.", "implication": "새로운 위상 물질을 탐색하는 연구자들에게 필수적인 라이브러리를 제공하며, 향후 실험 연구의 나침반 역할을 할 것입니다.", "novelty": "기존 TQC 이론을 2D 층군(layer group)으로 확장 적용하여, 비자성 2D 물질 전반에 대한 체계적인 위상 분류를 완료했습니다.", "unresolved": "계산된 모든 위상 상태가 실제 시료에서 스핀-궤도 결합(SOC)이나 격자 왜곡에 의해 어떻게 변하는지는 실험적 검증이 필요합니다.", "future_work": "데이터베이스의 물질들을 활용한 실제 2D 소자 제작 및 ARPES를 이용한 에지 상태 검출이 이어질 것입니다.", "concepts": [{"term": "위상 절연체", "why_emerged": "내부는 절연체이나 표면(에지)은 위상적으로 보호된 전도 채널을 갖는 물질을 구현하기 위해", "origin": "Kane-Mele (2005), Bernevig-Zhang-Hughes (2006)", "connections": "양자 스핀 홀 효과, Berry 위상"}, {"term": "방해된 원자 절연체", "why_emerged": "원자 중심의 위치와 대칭성이 결합하여 자명하지 않은 위상 성질을 보이는 물질을 분류하기 위해", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "위상 양자 화학(TQC), 밴드 표현"}, {"term": "C2DB/MC2D", "why_emerged": "계산적으로 예측된 2D 물질의 물성을 모아놓은 방대한 데이터 저장소", "origin": "C2DB(2017) 등", "connections": "고처리량 스크리닝, DFT 데이터베이스"}], "english_summary": ["Adapts topological quantum chemistry (TQC) for 2D layer groups.", "Analyzes thousands of 2D materials from C2DB and MC2D databases.", "Identifies over 4,000 topological or obstructed insulators.", "Provides a public, open-source library for topological classification of 2D materials."]}}, {"title": "Material-architecture-manufacture integrated strategy for piezoelectric metamaterials with mechanical protection and self-powered sensing", "journal": "Science_Advances", "source": "Gemini", "link": "https://doi.org/10.1126/sciadv.aeg1744", "authors": "Zhicheng Wang, Xiaozhou Xin, Jingfei Wang, Liwu Liu, Yanju Liu, Jinsong Leng", "last_authors": "Yanju Liu, Jinsong Leng", "summary": "The increasingly complex tasks of intelligent equipment have shifted the demand for structural materials from mere lightweight protection to multifunction integration, i.e., high recoverable energy absorption and accurate monitoring. Herein, we presented a material-architecture-manufacture integrated strategy for piezoelectric metamaterials to simultaneously achieve mechanical protection and self-powered sensing. Specifically, an intercalation heterostructure of silane-modified barium titanate (K-BTO)/MXene was constructed to improve the interfacial polarization effect, and an innovative electric field–assisted 4D printing technology could effectively induce the in situ poling of K-BTO. Furthermore, the Kagome lattice–inspired metamaterial (k-CAH) exhibited superior specific energy absorption (0.18 joules per gram), resulting from compression-bend-torsion coordination and multidirection coupling mechanisms. The multimode coupling deformation and local strain amplification mechanism, induced by the geometry design, substantially improved output capacities through activating various piezoelectric response modes at low frequency. With the material-architecture-manufacture synergy, g 33 eff reached up to 1.712 volt-meters per newton. The developed piezoelectric metamaterial system exhibited accurate self-powered sensing of real-time impact and high-efficiency energy harvesting under microvibration conditions, promising for the next-generation smart structural materials.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Design of piezoelectric metamaterials using a Kagome lattice geometry, a key motif for user.", "tags": ["kagome", "metamaterials", "piezoelectric", "heterostructure"], "image": "", "briefing": {"background": "압전 메타물질은 기계적 충격 흡수와 에너지 수확을 동시에 달성하기 위한 구조 설계 전략입니다. 특히 카고메(Kagome) 격자와 같은 복잡한 기하학적 구조는 다방향 변형과 국소적 변형 증폭을 유도하여 기능적 효율을 극대화하는 데 사용됩니다.", "motivation": "기존 구조 재료의 한계를 넘어 기계적 보호와 자가 전력 센싱(self-powered sensing) 기능을 통합한 스마트 메타물질을 실현하고자 합니다.", "result": "카고메 격자 기반의 압전 메타물질(k-CAH)을 설계하여 압축-굽힘-비틀림 결합을 통해 높은 에너지 흡수율과 압전 반응도를 구현했습니다.", "implication": "기하학적 설계와 소재 합성 기술의 결합이 저주파 환경에서도 효율적인 에너지 수확과 충격 모니터링이 가능함을 보여줍니다.", "novelty": "카고메 격자의 기하학적 이점을 활용하여 기존 압전 소재보다 월등한 효율(g33 eff)을 달성했다는 점이 핵심이며, 독자의 카고메 격자 연구와 구조적 유사성이 있습니다.", "unresolved": "실제 대규모 산업 응용에서의 내구성과 장기적인 재료 안정성에 대한 구체적 데이터는 부족합니다.", "future_work": "다양한 외부 하중 조건에서의 비선형 응답 제어 및 더 복잡한 3D 프린팅 공정 최적화 연구가 필요합니다.", "concepts": [{"term": "카고메 격자 (Kagome lattice)", "why_emerged": "구조적으로 높은 대칭성과 기하학적 좌절(frustration)을 유도하여 물리적 특성을 조절하기 위함.", "origin": "일본의 전통 바구니 짜기 패턴에서 유래, 고체 물리학에서는 자기적 좌절 연구로 확립.", "connections": "AV3Sb5 계열의 위상학적 특성과 전자 구조 연구와 깊은 연관이 있음."}, {"term": "압전 메타물질 (Piezoelectric metamaterials)", "why_emerged": "소재 자체의 특성을 넘어 구조 설계를 통해 압전 출력을 증폭시키기 위해 등장.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "음향 메타물질 및 변형 공학(strain engineering) 연구와 연결됨."}], "english_summary": ["A novel piezoelectric metamaterial based on Kagome lattice geometry is designed.", "The design enables integrated mechanical protection and self-powered sensing.", "An intercalation heterostructure of BaTiO3 and MXene enhances piezoelectric performance.", "The material shows superior energy absorption and high voltage output efficiency.", "This provides a scalable strategy for next-generation smart structural applications."]}}, {"title": "Observation of thermally stable polar metallic state in perovskite nitride CeWN 3", "journal": "Science_Advances", "source": "Gemini", "link": "https://doi.org/10.1126/sciadv.aeh6191", "authors": "Xubin Ye, Shaoxuan Zheng, Zhaoliang Chen, et al.", "last_authors": "Zhen Chen, Youwen Long", "summary": "Polar metals offer substantial potential for exotic quantum phenomena and multifunctional applications. However, the existence of a polar metal is fundamentally challenging owing to the screening of dipole-dipole interactions by conducting electrons. Specifically, a high-temperature–stabilized polar metal remains to be discovered. In this study, we report a thermally stable polar-metal state in perovskite cerium tungsten nitride. Synchrotron x-ray diffraction and electron microscopy reveal a polar Pna 2 1 structure, while second-harmonic generation demonstrates that the polar response persists up to 850 kelvins in argon. Electrical resistivity and optical conductivity measurements demonstrate metallic transport behavior, consistent with the itinerant electronic contribution derived from specific heat analysis. First-principles calculations reveal that the polar distortion and metallic conductivity originate from tungsten-centered nitrogen octahedra, where the off-center displacements of hexavalent tungsten ions govern polarity and hybridization between tungsten 5d and nitrogen 2p states contributes to itinerant carriers. This study establishes a record-high-temperature polar metal, opening a promising avenue for exploring robust polar and metallic materials in perovskite nitrides.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Reports a high-temperature polar metal in a perovskite nitride with transport and electronic structure.", "tags": ["material", "perovskite", "polarmetal", "transport", "DFT"], "image": "", "briefing": {"background": "금속은 전하를 운반하는 전도성이 극성이 유도하는 정전기적 가림 효과(screening)를 상쇄하므로, 금속이면서 동시에 자발적 극성을 갖는 '극성 금속(polar metal)'은 고체 물리학에서 구현하기 어려운 상태입니다.", "motivation": "고온에서도 안정적인 극성 금속 상태를 발견하고 그 물리적 기원을 규명하고자 합니다.", "result": "페로브스카이트 질화물 CeWN3에서 850K까지 유지되는 극성 금속 상태를 발견했습니다.", "implication": "금속 내 전자의 가림 효과에도 불구하고 고온에서 극성이 보존될 수 있음을 증명하여, 차세대 전자 소자용 기능성 금속 물질 후보군을 제시했습니다.", "novelty": "고온 안정성이라는 난제를 페로브스카이트 질화물 구조에서 해결했으며, DFT 계산을 통해 W-N 하이브리드화가 극성과 금속성을 동시에 조절함을 밝혔습니다.", "unresolved": "이러한 극성 금속 상태가 다른 위상학적 물리량(예: Berry curvature 관련 효과)과 어떻게 상호작용하는지는 명확하지 않습니다.", "future_work": "ARPES를 통한 실제 전자 구조 측정 및 위상학적 특성에 대한 심층 연구가 필요합니다.", "concepts": [{"term": "극성 금속 (Polar metal)", "why_emerged": "금속의 전도성과 강유전성의 공존 가능성을 탐구하기 위해 필요.", "origin": "Anderson과 Blount (1965)에 의해 이론적으로 예견됨.", "connections": "강유전체, 위상학적 반금속, 다강체 물질과 연결됨."}, {"term": "페로브스카이트 질화물 (Perovskite nitride)", "why_emerged": "산화물보다 넓은 전도 대역과 우수한 촉매/자기적 성질을 탐구하기 위함.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "전이금속 질화물, 초전도체 및 자성 물질 연구와 연결됨."}], "english_summary": ["Discovery of a high-temperature polar metallic state in CeWN3.", "Polarity persists up to 850 K in this perovskite nitride.", "Metallic transport is confirmed through resistivity and specific heat analysis.", "DFT calculations link the polarity and conductivity to W-N orbital hybridization.", "Provides a promising material platform for high-temperature polar metal research."]}}, {"title": "Organic two-dimensional van der Waals heterostructures", "journal": "Nature", "source": "Gemini", "link": "https://www.nature.com/articles/s41586-026-11074-6", "authors": "Anupam Prasoon, Nguyen Ngan Nguyen, Mike Hambsch, et al.", "last_authors": "Thomas Heine, Xinliang Feng", "summary": "Sequential on-water-surface assembly enables layer-by-layer stacking of two-dimensional polymers to create both lattice-matched and controlled lattice-mismatched van der Waals heterostructures with defined lattice registry, stacking sequence and thickness.", "tier": "B_IMPORTANT_CONDMAT", "score": "7", "reason": "Directly relevant study on van der Waals heterostructures and 2D material stacking.", "tags": ["material", "vanderWaals", "heterostructure"], "image": "https://media.springernature.com/m685/springer-static/image/art%3A10.1038%2Fs41586-026-11074-6/MediaObjects/41586_2026_11074_Fig1_HTML.png", "briefing": {"background": "반데르발스 헤테로구조는 서로 다른 2D 물질을 적층하여 새로운 물리적 특성을 창출하는 기술입니다. 주로 그래핀이나 TMD에 집중되어 왔으나, 유기 고분자로 그 범위를 확장하려는 시도가 진행 중입니다.", "motivation": "수면 위 순차적 조립(on-water-surface assembly)을 통해 유기 2D 고분자 기반의 헤테로구조를 정교하게 제어하여 구축하고자 합니다.", "result": "격자 일치 및 불일치 헤테로구조를 층별로 정밀하게 적층하는 방법을 확립했습니다.", "implication": "유기 2D 소재의 적층 기  {"background": "전이금속 디칼코게나이드(TMD)인 1H-MoS2는 단층일 때는 직접 밴드갭을 가지지만, 이중층으로 쌓이면 밴드 구조가 간접 밴드갭으로 변화하여 광학적 효율이 급격히 떨어지는 성질이 있습니다.", "motivation": "적층 구조를 정밀하게 제어하여 이중층 상태에서도 단층과 유사한 직접 밴드갭 특성을 유지함으로써 광전자 및 밸리트로닉스 소자로서의 성능을 극대화하고자 합니다.", "result": "원자 수준으로 정렬된 1H 이중층 MoS2가 직접 밴드갭을 유지함을 확인하였으며, 이를 통해 엑시톤 발광 효율과 밸리 편극 현상이 크게 강화됨을 입증했습니다.", "implication": "TMD 기반 소자 설계 시 적층 각도와 정렬 제어가 전자 구조 조절의 핵심 도구로 사용될 수 있음을 시사합니다.", "novelty": "단순한 밴드갭 엔지니어링을 넘어, 이중층 구조에서 밸리트로닉스 성능을 최적화할 수 있는 물리적 구조 제어 기술을 제시했습니다.", "unresolved": "대면적 CVD 성장 과정에서 원자 정렬을 완벽하게 제어하기 위한 수율 확보 방안이 여전히 과제입니다.", "future_work": "다른 TMD 화합물과의 헤테로 구조 제작 및 밸리 편극 지속 시간 측정 등이 예상됩니다.", "concepts": [{"term": "밸리트로닉스", "why_emerged": "전하(charge)와 스핀(spin)에 이어 전자 상태의 밸리 자유도를 정보 처리에 활용하기 위해 필요.", "origin": "2000년대 초반 그래핀 및 TMD 연구와 함께 부상.", "connections": "베리 곡률, 비정형 홀 효과, 위상학적 전자 상태와 연결됨."}, {"term": "1H-MoS2", "why_emerged": "반도체 성질과 강한 스핀-궤도 결합을 가진 2차원 층상 물질로 현대 응집물질 물리의 핵심 연구 대상.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "반데르발스 헤테로 구조, 엑시톤 물리."}], "english_summary": ["Atomically aligned 1H bilayer MoS2 maintains a direct band gap.", "Enhanced excitonic emission and valley polarization are achieved.", "The results demonstrate promising potential for advanced valleytronic applications.", "Stacking engineering serves as a powerful tool for band structure manipulation in 2D materials."]}}, {"title": "Efficient transport kinetics of indirect excitons in van der Waals heterostructure", "journal": "Nature_Communications", "source": "Gemini", "link": "https://www.nature.com/articles/s41467-026-77967-2", "authors": "Zhiwen Zhou, W. J. Brunner, E. A. Szwed, H. Henstridge, L. H. Fowler-Gerace, L. V. Butov", "last_authors": "L. H. Fowler-Gerace, L. V. Butov", "summary": "Here, the authors investigate the transport kinetics of indirect excitons (IXs) in a MoSe2/WSe2 van der Waals heterostructure, and observe anomalously high IX mobility, consistent with IX superfluidity.", "tier": "B_IMPORTANT_CONDMAT", "score": "7", "reason": "Important experimental transport study on van der Waals heterostructures.", "tags": ["vanderWaals", "transport", "excitons"], "image": "https://pubads.g.doubleclick.net/gampad/ad?iu=/285/nature_communications/article&sz=728x90&c=-796986538&t=pos%3Dtop%26type%3Darticle%26artid%3Ds41467-026-77967-2%26doi%3D10.1038/s41467-026-77967-2%26subjmeta%3D1000,1018,119,301,639,766%26kwrd%3DTwo-dimensional+materials", "briefing": {"background": "간접 엑시톤(IX)은 전자와 정공이 서로 다른 층에 위치하여 수명이 길고 상호작용이 강해, 고밀도 상태에서 보스-아인슈타인 응축이나 초유체 현상을 연구하기에 적합합니다.", "motivation": "MoSe2/WSe2 헤테로 구조에서 엑시톤의 수송 효율을 높이고, 이론적으로 제기된 엑시톤 초유체 상태의 실험적 증거를 찾고자 합니다.", "result": "해당 헤테로 구조에서 엑시톤의 이동성이 매우 높게 나타남을 관찰하였으며, 이는 간접 엑시톤 초유체 상태가 발현될 가능성을 지지합니다.", "implication": "반데르발스 헤테로 구조가 양자 유체 현상을 제어하고 관찰하는 실험 플랫폼으로서 매우 우수함을 보여줍니다.", "novelty": "반데르발스 계면에서의 엑시톤 수송 역학을 직접적으로 규명하여 초유체 연구에 기여했습니다.", "unresolved": "고온/저밀도 환경에서도 초유체성이 유지되는지에 대한 온도 의존성 연구가 추가로 필요합니다.", "future_work": "다양한 헤테로 구조에서의 초유체성 검증 및 소자 응용을 위한 전송 최적화 연구가 수행될 것입니다.", "concepts": [{"term": "간접 엑시톤 (Indirect Excitons)", "why_emerged": "층간 전하 분리를 통해 엑시톤의 수명을 비약적으로 늘려 다체 물리 현상을 관찰하기 위해 필요.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "보스-아인슈타인 응축, 반데르발스 헤테로 구조."}, {"term": "초유체성 (Superfluidity)", "why_emerged": "점성 없는 흐름을 통해 양자 통계적 특성을 거시적으로 확인하기 위함.", "origin": "카피차, 앨런, 미스너에 의해 1930년대 액체 헬륨에서 발견.", "connections": "BCS 이론, 고온 초전도체, 엑시톤 응축."}], "english_summary": ["The study investigates indirect exciton (IX) transport in MoSe2/WSe2 heterostructures.", "Anomalously high mobility of IX is experimentally observed.", "These results are consistent with the formation of an IX superfluid state.", "Van der Waals heterostructures provide an ideal platform for studying quantum fluids."]}}, {"title": "Manipulation of ferromagnetism with a light-driven nonlinear Edelstein-Zeeman field", "journal": "Nature_Communications", "source": "Gemini", "link": "https://www.nature.com/articles/s41467-026-77965-4", "authors": "Yinchuan Lv, W. Joe Meese, Azel Murzabekova
