<title>Daily Paper Slideshow</title>
<style>
  :root {
    color-scheme: light;
    --bg: #f6f7f4;
    --paper: #ffffff;
    --ink: #111827;
    --muted: #64748b;
    --line: #d8ddd2;
    --accent: #176b87;
    --accent-2: #9a3412;
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; overflow: auto; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: var(--bg); color: var(--ink); }
  .shell { max-width: 1500px; min-height: 100vh; margin: 0 auto; padding: 14px 18px; display: flex; flex-direction: column; }
  .topbar { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 16px; }
  .top-actions { display: flex; align-items: center; gap: 10px; }
  .topbar a, button { border: 1px solid var(--line); border-radius: 8px; background: var(--paper); color: var(--ink); padding: 10px 14px; font-weight: 700; text-decoration: none; cursor: pointer; }
  button.primary { background: var(--accent); border-color: var(--accent); color: white; }
  button:disabled { opacity: 0.45; cursor: not-allowed; }
  .counter { color: var(--muted); font-weight: 700; }
  .slide { min-height: calc(100vh - 82px); background: var(--paper); border: 1px solid var(--line); border-radius: 10px; padding: 18px; box-shadow: 0 18px 42px rgba(15, 23, 42, 0.10); display: grid; grid-template-columns: minmax(310px, 0.86fr) minmax(0, 1.55fr); gap: 18px; overflow: visible; }
  .paper-head { min-width: 0; min-height: 0; overflow: visible; display: flex; flex-direction: column; gap: 12px; }
  .figure { margin: 0; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: #f8fafc; }
  .figure img { display: block; width: 100%; max-height: 41vh; object-fit: contain; background: white; }
  .figure figcaption { padding: 7px 10px; color: var(--muted); font-size: 12px; line-height: 1.3; }
  .head-text { display: flex; flex-direction: column; gap: 9px; min-width: 0; }
  .badges { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .badge { border-radius: 999px; padding: 5px 9px; background: #eef2ff; color: #3730a3; font-size: 12px; font-weight: 800; }
  .score { background: #fee2e2; color: #991b1b; }
  h1 { margin: 0; font-size: 25px; line-height: 1.15; letter-spacing: 0; overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
  h1 a { color: inherit; text-decoration-color: rgba(23, 107, 135, 0.35); text-decoration-thickness: 2px; text-underline-offset: 4px; }
  h1 a:hover { color: var(--accent); text-decoration-color: var(--accent); }
  .meta, .authors, .why, .abstract { font-size: 13px; line-height: 1.45; }
  .meta, .authors { color: var(--muted); }
  .why strong, .abstract strong, .authors strong { color: var(--ink); }
  .authors { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .why { border-left: 4px solid var(--accent-2); padding-left: 10px; color: #374151; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .abstract { border-top: 1px solid var(--line); padding-top: 14px; color: #374151; }
  .original-abstract { border-top: 1px solid var(--line); padding-top: 10px; color: #374151; font-size: 11.5px; line-height: 1.35; overflow-wrap: anywhere; }
  .original-abstract strong { display: block; margin-bottom: 4px; color: var(--ink); }
  .tags { display: flex; flex-wrap: wrap; gap: 8px; }
  .tag { border-radius: 999px; padding: 4px 8px; background: #f1f5f9; color: #475569; font-size: 12px; font-weight: 700; }
  .head-text > .link { display: none; }
  .briefing { min-width: 0; min-height: 0; overflow: visible; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); grid-auto-rows: minmax(0, auto); align-content: start; gap: 11px 18px; border-top: 0; padding-top: 0; }
  .brief-section { min-width: 0; }
  .brief-section.wide { grid-column: 1 / -1; }
  .brief-section h2 { margin: 0 0 4px; font-size: 14px; line-height: 1.22; color: #0f766e; letter-spacing: 0; }
  .brief-section p, .brief-section li { margin: 0; font-size: 12.5px; line-height: 1.42; color: #1f2937; overflow-wrap: anywhere; }
  .brief-section ul { margin: 0; padding-left: 20px; }
  .concepts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 9px 14px; }
  .concept { border-top: 1px solid var(--line); padding-top: 7px; }
  .concept h3 { margin: 0 0 4px; font-size: 13px; color: #7c2d12; letter-spacing: 0; }
  .concept p { margin: 2px 0 0; font-size: 11.5px; line-height: 1.35; color: #374151; overflow-wrap: anywhere; }
  .concept b { color: #111827; }
  .link { color: var(--accent); font-weight: 800; text-decoration: none; }
  .empty { padding: 48px; background: var(--paper); border: 1px solid var(--line); border-radius: 12px; color: var(--muted); }
  @media (max-width: 860px) {
    .shell { padding: 14px; }
    .topbar, .top-actions { align-items: stretch; flex-direction: column; }
    .slide, .briefing, .concepts { grid-template-columns: 1fr; }
    .slide { min-height: auto; overflow: visible; display: grid; }
    h1 { font-size: 28px; }
  }
</style>

const slides = [{"title": "Correlation-driven origin of shallow electron pocket in Co1/3TaS2 revealed by ARPES and cluster perturbation theory", "journal": "PRB_Recent", "source": "keyword", "link": "http://link.aps.org/doi/10.1103/6y9w-lx94", "authors": "Wojciech Sas, Yuki Utsumi Boucher, Seyed Ashkan Moghadam Ziabari, et al.", "last_authors": "Ivo Batistić, Petar Popčević", "summary": "We investigate the electronic structure and Fermi surface of ${\\mathrm{Co}}_{1/3}{\\mathrm{TaS}}_{2}$ using angle-resolved photoemission spectroscopy (ARPES) combined with theoretical modeling beyond standard density functional theory ($\\mathrm{DFT}+\\mathrm{U}$). A shallow electron pocket, the so-cal…", "tier": "A_MUST_READ", "score": "10", "reason": "title strong match: ARPES", "tags": ["ARPES", "angle-resolvedphotoemission", "photoemission", "Fermisurface"], "image": "", "briefing": {"background": "전이금속 디칼코게나이드(TMD) 화합물은 층상 구조와 전하 밀도 파동(CDW), 자기적 정렬 등이 결합하여 풍부한 전자 물성을 나타냅니다. 특히 인터칼레이션 된 시스템에서는 불순물 혹은 이온 삽입이 전자 구조를 어떻게 변형시키는지가 물성 제어의 핵심입니다.", "motivation": "Co1/3TaS2 시스템에서 나타나는 특정 전자 주머니(beta feature)의 기원이 표면 효과인지, 아니면 벌크 상태의 강상관 전자 효과인지 명확하지 않아 이를 규명하고자 함.", "result": "표준 DFT+U로는 재현되지 않던 beta 전자 주머니가 클러스터 섭동 이론(CPT)을 통한 강한 국소 상관관계(U) 도입으로 성공적으로 설명됨. 이는 해당 feature가 벌크 상태에서 기인함을 증명함.", "implication": "자기적으로 인터칼레이션 된 TMD에서 강상관 전자 효과가 전자 구조 형성에 결정적이며, 단순 DFT 계산의 한계를 보완하는 이론적 접근이 필수적임을 시사함.", "novelty": "실험적 ARPES 관측과 클러스터 섭동 이론을 결합하여, 유사 화합물들(X1/3NbS2)에서 논쟁거리였던 전자 주머니의 벌크/표면 기원 문제를 명확히 해결함.", "unresolved": "Co 인터칼레이션 농도 변화에 따른 국소적 자기 모멘트의 정량적 변화가 전자 구조 전반에 미치는 미세한 영향은 추가 연구가 필요함.", "future_work": "다른 전이금속이 삽입된 TaS2 계열에서 유사한 상관관계 기반 전자 주머니 패턴이 보편적인지 확인하는 후속 연구가 기대됨.", "concepts": [{"term": "Cluster Perturbation Theory (CPT)", "why_emerged": "표준 DFT나 DFT+U가 다루기 힘든 강한 국소적 전자 상관관계를 포함하여 격자 모델의 스펙트럼 함수를 계산하기 위해 도입됨.", "origin": "초기 모델 기반 접근으로, 주로 강상관 전자계 계산 물리 분야에서 발전함.", "connections": "DMFT(Dynamical Mean Field Theory)와 유사한 목적을 가지나, 클러스터 확장을 통해 공간적 상관관계를 더 잘 포착함."}, {"term": "Intercalated TMDs", "why_emerged": "TMD 층 사이에 원자나 분자를 삽입하여 구조적 안정성을 조절하고 새로운 자기적/초전도적 물성을 유도하기 위해 연구됨.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "Co1/3TaS2, NbS2와 같은 층상 화합물과 결합하여 자성, CDW 물성 제어에 활용됨."}], "english_summary": ["Investigated the electronic structure of Co1/3TaS2 using ARPES and CPT.", "Identified that the 'beta' electron pocket at the Fermi level is driven by strong electron correlations on Co sites.", "Confirmed that the feature is a bulk property rather than a surface effect, contradicting some previous debates on intercalated TMDs.", "CPT provided a superior theoretical framework compared to standard DFT+U for capturing these correlation-driven states."]}}, {"title": "Correlated Insulator at the Surface of the Polar Metal Ca3Ru2O7", "journal": "PRL_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/x9gh-xxwb", "authors": "Daniel Halliday, Izidor Benedičič, Andela Zivanovic, et al.", "last_authors": "Phil D. C. King, Peter Wahl", "summary": "We investigate the electronic structure at the surface of the correlated oxide Ca 3 Ru 2 O 7 , a low-symmetry ruthenate oxide which hosts an unconventional polar-metal phase. From a combination of angle-resolved photoemission spectroscopy and scanning tunneling spectroscopy measurements, we demonstrate that the surface hosts an insulating phase, a distinct departure from metallicity within the bulk. Utilizing quantitative low-energy electron diffraction in conjunction with electronic structure calculations, we show how this results from a combined surface structure relaxation and the impact of marked electronic correlations in this system. Our findings highlight the proximity of Ca 3 Ru 2 O 7 to an insulating metallic state, and illustrate how subtle structural distortions can control its emergent electronic phases.", "tier": "A_MUST_READ", "score": "10", "reason": "Direct ARPES and STS study of electronic structure in a correlated oxide.", "tags": ["ARPES", "STS", "correlatedelectronsystem", "ruthenate"], "image": "", "briefing": {"background": "루테네이트 화합물(Ruthenate)은 강한 스핀-궤도 결합과 전자 상관관계가 얽혀 있는 전형적인 강상관 전자계입니다. 특히 Ca3Ru2O7은 구조적 대칭성과 전자적 성질이 민감하게 연결된 polar-metal로 알려져 있어, 표면과 벌크 상태의 차이가 물성에 미치는 영향이 중요한 연구 주제입니다.", "motivation": "벌크 상태에서 금속성을 띠는 Ca3Ru2O7이 표면에서는 어떤 전자적 환경을 갖는지, 그리고 이것이 표면 구조적 완화와 어떻게 연관되는지 확인하고자 함.", "result": "ARPES와 STS를 통해 Ca3Ru2O7 표면이 벌크와 달리 절연체 상태임을 밝힘. 이는 표면 구조 완화와 강한 전자 상관관계의 결합에 의한 결과임.", "implication": "강상관 금속 산화물의 표면이 벌크와 완전히 다른 상(phase)을 가질 수 있음을 보여주며, 소자 응용 시 표면 상태 제어의 중요성을 강조함.", "novelty": "단순 이론적 예측이 아니라 ARPES와 STS의 상호 보완적 분석을 통해 polar-metal 표면에서 나타나는 절연상 전이를 직접 관측함.", "unresolved": "표면 절연상의 정확한 전자 구조적 기원(예: 구체적인 밴드갭 형성 메커니즘)에 대한 상세한 미시적 모델은 추가 논의가 필요함.", "future_work": "표면 제어를 통해 이러한 절연상을 조절하거나, 박막 두께에 따른 금속-절연체 전이의 임계점 연구가 진행될 것으로 보임.", "concepts": [{"term": "Polar Metal", "why_emerged": "반전 대칭성이 깨진 결정 구조 내에서 금속성을 유지하는 물질군을 분류하고 고유의 특이 물성을 찾기 위해 사용됨.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "강상관 시스템, 초전도체, 자기적 정렬과 결합하여 비전통적인 물성을 나타내는 경우가 많음."}, {"term": "Scanning Tunneling Spectroscopy (STS)", "why_emerged": "물질 표면의 상태 밀도(DOS)를 원자 수준의 분해능으로 측정하여 국소적인 전자 구조와 갭 정보를 얻기 위해 개발됨.", "origin": "Gerd Binnig와 Heinrich Rohrer가 STM 발명 이후 물리적 분광법으로 확장함.", "connections": "ARPES와 함께 강상관 시스템의 갭 형성 및 전자 구조 연구에 필수적으로 사용됨."}], "english_summary": ["Demonstrated that the surface of Ca3Ru2O7 exhibits an insulating phase, contrary to its bulk metallic nature.", "Utilized combined ARPES and STS measurements to characterize the electronic structure.", "Attributed the insulating phase to the synergy between surface structural relaxation and electronic correlations.", "Highlights the susceptibility of emergent electronic phases to surface conditions in low-symmetry correlated oxides."]}}, {"title": "Correlation-driven origin of shallow electron pocket in Co1/3TaS2 revealed by ARPES and cluster perturbation theory (Phys. Rev. B)", "journal": "arXiv_CondMat", "source": "keyword", "link": "https://arxiv.org/abs/2602.15588", "authors": "Wojciech Sa : "Gemini", "link": "https://doi.org/10.1126/sciadv.aeb0659", "authors": "Qi Zhang, Mithun Ghosh, Yaroslav Zhumagulov, et al.", "last_authors": "Zdeněk Sofer, Ahmet Avsar", "summary": "Dilute magnetic semiconductors (DMSs) provide a platform for electrically controlling spin interactions; however, conventional systems face limited gate tunability and structural disorder. Here, we demonstrate gate-switchable magnetism in air-stable, dilute Fe-doped PtSe 2 , a two-dimensional (2D) DMS that remains structurally homogeneous down to the atomically thin limit. Bulk crystals exhibit ferromagnetism with a Curie temperature of 320 kelvin, and this coupling persists in metallic devices down to seven layers. As thickness and carrier concentration further decrease, the system transitions to antiferromagnetic order, with a gate-tunable Néel temperature reaching 105 kelvin in five-layer semiconducting devices. Our first-principles calculations reveal a carrier-density–dependent crossover from Ruderman-Kittel-Kasuya-Yosida–mediated ferromagnetism to superexchange-driven antiferromagnetism. These findings demonstrate how induced magnetic order evolves from bulk to the 2D limit, providing a pathway to functional spintronic devices with electrically controlled magnetic states.", "tier": "B_IMPORTANT_CONDMAT", "score": "9", "reason": "Electrical control of magnetism in 2D semiconductor Fe-doped PtSe2 via RKKY and superexchange mechanisms.", "tags": ["2Dmaterials", "DMS", "magnetism", "spintronics", "DFT", "ferromagnetism", "antiferromagnetism"], "image": "", "briefing": {"background": "희석 자기 반도체(DMS)는 스핀트로닉스 소자 구현을 위해 자기적 성질을 전기적으로 제어하고자 하는 연구 분야입니다.", "motivation": "기존 DMS의 제한된 게이트 제어 가능성과 구조적 무질서를 극복하고, 층상 구조 물질에서 자성을 전기적으로 제어하기 위함입니다.", "result": "Fe가 도핑된 PtSe2 2D 물질에서 게이트 전압을 통해 강자성과 반강자성 사이의 상태 전환을 구현했습니다.", "implication": "RKKY와 초교환 상호작용 간의 경쟁을 캐리어 밀도 제어로 조절할 수 있음을 보여주어, 2D spintronics 소자 설계의 청사진을 제시합니다.", "novelty": "단순한 자성 유도가 아니라, 두께와 캐리어 밀도 조절을 통해 강자성-반강자성 전이를 전기적으로 제어했다는 점이 핵심입니다.", "unresolved": "실제 장치 제작 시 Fe 도핑의 균일성 문제나 대면적 합성에 대한 수율은 여전히 과제로 남습니다.", "future_work": "다른 도판트와의 비교 연구, 그리고 이러한 게이트 제어 자기 상태를 이용한 저전력 메모리 소자 개발 등이 예상됩니다.", "concepts": [{"term": "RKKY 상호작용", "why_emerged": "전도성 전자(캐리어)를 매개로 하여 멀리 떨어진 국소 자기 모멘트 간의 자기적 결합을 설명합니다.", "origin": "Ruderman, Kittel, Kasuya, Yosida (1950s).", "connections": "희석 자기 반도체, 자성 금속."}, {"term": "초교환 상호작용 (Superexchange)", "why_emerged": "비자성 이온을 매개로 하여 자성 이온 간의 자기적 결합이 일어나는 현상을 설명합니다.", "origin": "Philip W. Anderson (1950s).", "connections": "반강자성체, Mott 절연체."}], "english_summary": ["Demonstrates gate-switchable magnetism in Fe-doped PtSe2, an air-stable 2D DMS.", "The system exhibits a transition from RKKY-mediated ferromagnetism to superexchange-driven antiferromagnetism.", "Magnetic state is controllable via thickness and carrier density gating.", "Provides a promising pathway for electrically reconfigurable 2D spintronic devices."]}}, {"title": "Antiferromagnetism-altered plasmon dynamics", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2609.03138", "authors": "Yifan Su, Suheng Xu, Rocco A. Vitalone, et al.", "last_authors": "Angel Rubio, D. N. Basov", "summary": "The interaction between plasmons and magnons is a long-sought phenomenon with implications for fundamental physics and spintronics applications. In three-dimensional systems, this coupling is suppressed by the large mismatch in energy scales, but two-dimensional (2D) plasmons with gapless dispersion can overlap with magnons over a broad spectral range. Despite numerous theoretical predictions, experimental observation of magnon-plasmon interaction has remained elusive. In this work, we study a first-of-its-kind hybrid plasmon-magnon platform based on 2D materials. By deploying scattering-type scanning near-field optical microscopy (s-SNOM) with terahertz radiation, we image propagating plasmon wavepackets at a graphene/NiPS$_3$ interface and track their dynamics across the antiferromagnetic transition of NiPS$_3$. We observe a clear renormalization of the plasmon-polariton dispersion concurrent with the onset of antiferromagnetic order. With complementary Raman scattering and nano-terahertz spectroscopy, we unveil spectral weight redistribution and dielectric screening changes, potentially associated with the multi-magnon continuum, as the underlying mechanism. These results provide solid evidence of coupling between plasmon and antiferromagnetic order, marking a cornerstone for a potential platform for hybrid magnon-plasmon interactions in 2D materials, opening avenues for coherent spin-plasmon devices and tunable terahertz spintronic components.", "tier": "B_IMPORTANT_CONDMAT", "score": "9", "reason": "Direct experimental study of plasmon-magnon coupling in 2D materials (graphene/NiPS3) using SNOM.", "tags": ["graphene", "magnon", "antiferromagnet"], "image": "https://arxiv.org/html/2609.03138v1/Fig0.png", "briefing": {"background": "2D 자성체와 플라즈모닉스의 결합은 차세대 스핀트로닉스와 테라헤르츠 소자 구현을 위한 핵심 분야입니다. 기존 3D 시스템에서는 플라즈몬과 마그논의 에너지 스케일 불일치로 인해 강한 결합이 어려웠으나, 2D 물질에서는 분산 관계의 중첩이 가능해 이 문제가 완화됩니다.", "motivation": "이론적으로 예측된 2D 물질에서의 플라즈몬-마그논 결합을 실험적으로 직접 관측하고, 반강자성체 전이 전후의 플라즈몬 동역학 변화를 규명하고자 합니다.", "result": "graphene/NiPS3 이종 접합에서 s-SNOM을 사용하여 반강자성 전이 시 플라즈몬-폴라리톤 분산이 재규격화(renormalization)되는 것을 관측했습니다. 이는 다중-마그논 연속체에 의한 유전율 스크리닝 변화와 스펙트럼 재분배가 핵심 기작임을 시사합니다.", "implication": "2D 플랫폼에서 플라즈몬과 반강자성 질서 사이의 결합을 증명함으로써, 외부 제어가 가능한 테라헤르츠 스핀트로닉스 소자 개발의 토대를 마련했습니다.", "novelty": "플라즈몬과 마그논의 강한 상호작용을 나노 스케일에서 직접 영상화했다는 점에서 매우 혁신적입니다. 특히 reader의 관심사인 2D van der Waals 이종 구조와 자성 시스템의 결합 연구로서 중요한 가치를 가집니다.", "unresolved": "관측된 스펙트럼 재분배에 기여하는 마그논 모드들의 구체적인 미시적 경로와 결합 강도의 정량적 제어 가능성은 추가 연구가 필요합니다.", "future_work": "다양한 2D 자성체 조합을 통한 결합 강도 튜닝 실험과, 이를 활용한 능동형 테라헤르츠 광소자 구현이 예상됩니다.", "concepts": [{"term": "s-SNOM", "why_emerged": "빛의 회절 한계를 극복하여 나노미터 규모의 국소 광학적 특성을 측정하기 위해 필요합니다.", "origin": "2000년대 초반 근접장 광학 기술의 발전으로 정립되었습니다.", "connections": "플라즈몬-폴라리톤 이미징, 나노-적외선 분광학."}, {"term": "플라즈몬-폴라리톤", "why_emerged": "빛과 물질(전자)의 강한 결합을 통해 광학 신호를 나노미터 수준으로 가두기 위해 연구됩니다.", "origin": "반도체 및 금속 물리학에서 오랫동안 다뤄진 개념입니다.", "connections": "반데르발스 이종 구조, 나노 포토닉스."}], "english_summary": ["Experimental demonstration of plasmon-magnon coupling in a graphene/NiPS3 van der Waals heterostructure.", "Utilized s-SNOM to track plasmon-polariton dispersion across the antiferromagnetic transition.", "Renormalization of plasmon dispersion provides evidence for strong coupling to the magnetic order.", "Opens new pathways for tunable terahertz spintronic devices and coherent spin-plasmon platforms."]}}, {"title": "Electron-phonon coupled hydrodynamics in semimetal TaAs2", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2609.03517", "authors": "Shan Jiang, Wei Xie, Xiaokang Li, Kamran Behnia, Zengwei Zhu", "last_authors": "Kamran Behnia, Zengwei Zhu", "summary": "Hydrodynamic corrections to diffusive transport can arise when momentum-conserving collisions between quasiparticles become prominent, and they have been documented for both electrons and phonons. An emerging frontier topic is coupled electron-phonon (e-ph) hydrodynamics. Here, through electrical and thermal transport measurements on TaAs2 crystals with different impurity levels, we document the emergence of an e-ph bifluid in the temperature window of 5 to 15 K. Within this range, the lattice thermal conductivity exhibits a faster-than-T^3 temperature dependence, as a consequence of non-monotonic and purity-dependent phonon mean free paths, a signature of phonon Poiseuille flow. However, strong e-ph coupling impedes the emergence of a ballistic regime. This is corroborated by the observation of quantum oscillations in the lattice thermal conductivity. Prominent phonon-mediated momentum exchange between electrons amplifies the violation of the Wiedemann-Franz law and yields a two-order-of-magnitude discrepancy between quantum and transport lifetimes, a signature of electron hydrodynamics in semimetals. Our results imply that in semimetals with optimized e-ph coupling, thanks to matching between the cryogenic phonon wave?length and the Fermi wavelength, momentum and energy flow between the electron and phonon reservoirs as frequently as within each reservoir.", "tier": "B_IMPORTANT_CONDMAT", "score": "9", "reason": "Experimental evidence of electron-phonon hydrodynamics in a topological semimetal through transport measurements.", "tags": ["material", "topologicalsemimetal", "transport"], "image": "https://arxiv.org/html/2609.03517v1/Fig1.png", "briefing": {"background": "반도체나 금속 내에서 전자와 포논의 집단적인 움직임인 '유체 역학적 전송(hydrodynamic transport)'은 최근 강상관 전자계 분야에서 매우 중요한 주제입니다. 특히 전자와 포논이 강하게 결합하여 하나의 시스템처럼 흐르는 'bifluids' 연구가 주목받고 있습니다.", "motivation": "위상 반금속 TaAs2에서 전자-포논 결합이 전송 현상에 미치는 영향과 유체 역학적 거동의 가능성을 실험적으로 검증하고자 합니다.", "result": "5~15K 구간에서 격자 열전도도가 T^3보다 빠르게 증가하고, 전자-포논 결합으로 인한 Wiedemann-Franz 법칙 위반 및 수송 수명과 양자 수명의 큰 차이를 발견했습니다.", "implication": "반금속에서 전자와 포논이 momentum/energy를 공유하는 유체 역학적 상태가 존재함을 증명하며, 이는 위상 물질의 열전 및 수송 현상을 이해하는 새로운 패러다임을 제시합니다.", "novelty": "위상 반금속 물질에서 전자-포논 비유체(bifluids)를 통한 유체 역학적 전송의 실험적 증거를 제시했습니다. reader의 관심사인 Ta 계열 텔루라이드 및 위상 물질에서의 새로운 전송 물리와 직결됩니다.", "unresolved": "강한 전자-포논 결합이 유체 역학적 거동을 어떻게 가두는지(ballistic regime과의 경쟁)에 대한 완전한 미시적 모델은 아직 완성되지 않았습니다.", "future_work": "서로 다른 도핑 수준과 순도를 가진 샘플을 통한 전송 특성의 체계적인 비교 연구와, 이를 활용한 열 관리 및 스핀-전하 분리 연구가 기대됩니다.", "concepts": [{"term": "Wiedemann-Franz 법칙", "why_emerged": "전자계의 열전도도와 전기전도도 사이의 비례 관계를 기술하기 위해 필요합니다.", "origin": "1853년 Wiedemann과 Franz에 의해 제안되었습니다.", "connections": "페르미 액체 이론, 유체 역학적 수송."}, {"term": "위상 반금속", "why_emerged": "에너지 띠 구조가 위상적으로 보호되는 교차점을 가지는 새로운 물질 상태를 탐구하기 위해 필요합니다.", "origin": "2010년대 중반 Weyl/Dirac 반금속 이론 정립.", "connections": "Berry 곡률, 비정상 홀 효과."}], "english_summary": ["Evidence of electron-phonon hydrodynamic bifluids in the semimetal TaAs2.", "Observations of non-monotonic lattice thermal conductivity and violation of the Wiedemann-Franz law.", "Strong electron-phonon coupling identified as the driver for collective hydrodynamic flow.", "Highlights the potential for manipulating quasiparticle flow in topological semimetals."]}}, {"title": "Heesch Nodal Lines in Inadmissible Achiral Antiferromagnets", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2609.03772", "authors": "Xing-Yao Guo, Chung-Yuen Chan, Zi-Ting Sun, Kam Tuen Law", "last_authors": "Zi-Ting Sun, Kam Tuen Law", "summary": "Recently, a new class of Weyl semimetals in antiferromagnets named Heesch Weyl semimetals was discovered, which have inadmissible chiral magnetic point group symmetries (inadmissible magnetic point groups are incompatible with ferromagnetic order) and distinctive surface Fermi arcs. In Heesch Weyl semimetals, the Weyl points are pinned at high symmetry momenta with two-dimensional irreducible corepresentations in the Brillouin zone. As the Weyl points are pinned, the Weyl points with opposite topological charges cannot emerge or be brought together for creation and annihilation as in conventional Weyl semimetals. In this work, we show that when mirror or rotoinversion symmetries are restored so that the point group becomes achiral, long doubly degenerate lines connecting Weyl points with opposite topological charges emerge. We call these lines the Heesch nodal lines (HNLs) and their host materials the Heesch nodal line antiferromagnets. HNLs result in a large number of two-dimensional massless Dirac cones for planes intercepting the HNLs in the Brillouin zone. Moreover, a large subset of the HNL antiferromagnets has the special property that the lowest nonvanishing order of the nonlinear anomalous Hall effect starts with the third order. First-principles calculations on representative collinear and noncollinear antiferromagnets, such as MnTe, CrSb, and Mn$_3$GaN, confirm our predictions on the presence of HNLs. When the inadmissible symmetry is broken by strain, the double degeneracy of the HNLs is lifted and the associated massless Dirac cones are gapped out, providing a route to realizing sizable anomalous Hall effects in antiferromagnetic crystals. We conclude that all inadmissible antiferromagnets without parity-time symmetry are topological. They are either Heesch Weyl antiferromagnets or Heesch nodal line antiferromagnets.", "tier": "B_IMPORTANT_CONDMAT", "score": "9", "reason": "Strong interest in Weyl/Dirac semimetals, antiferromagnetism, and anomalous Hall effects in real materials.", "tags": ["topic", "Weyl-semimetal", "antiferromagnetism", "anomalous-Hall"], "image": "https://arxiv.org/html/2609.03772v1/Fig_four_types.jpg", "briefing": {"background": "반강자성체에서의 비전통적인 위상 구조(Weyl semimetals) 연구는 위상 물리와 자성을 결합한 핵심 과제입니다. 기존 Weyl 반금속과 달리 특정 대칭성에 의해 Weyl 점이 고정되는 시스템은 새로운 물리적 현상을 예견합니다.", "motivation": "반강자성체 내에서 'Heesch Weyl semimetal' 구조가 특정 대칭성(mirror/rotoinversion)에 의해 어떻게 변화하는지, 그리고 이로 인해 발생하는 'Heesch nodal lines'의 위상적 성질을 밝히고자 합니다.", "result": "대칭성이 복원될 경우 Weyl 점들이 선형 구조인 Heesch Nodal Lines(HNLs)로 연결됨을 증명했습니다. 또한, 이 물질들이 3차 비선형 비정상 홀 효과를 보임을 밝혀냈습니다.", "implication": "반강자성체에서 위상적 보호를 받는 nodal line의 존재를 예견하고, 이를 통해 대칭성을 제어(예: strain)하여 큰 비정상 홀 효과를 유도할 수 있는 경로를 제시했습니다.", "novelty": "강자성체가 아닌 반강자성체에서의 새로운 위상적 nodal line 구조를 정의했습니다. MnTe, CrSb 등 실제 물질을 대상으로 DFT 기반 예견을 수행하여 reader의 관심사와 부합합니다.", "unresolved": "실제 실험에서 strain 등을 통해 HNL을 gapping할 때 발생하는 비정상 홀 효과의 정량적 크기와 재료 물성에 따른 복잡한 자기 구조의 영향을 정확히 계산하는 것은 여전히 난제입니다.", "future_work": "제시된 물질들(MnTe, CrSb 등)에 대한 ARPES를 통한 nodal line의 직접적인 관측과 비선형 홀 효과 측정 연구가 뒤따를 것입니다.", "concepts": [{"term": "Heesch Weyl semimetal", "why_emerged": "자성 point group이 ferromagnetic과 불호환인 경우의 위상적 상태를 기술하기 위해 필요합니다.", "origin": "최근 1-2년 내 이론적으로 제안됨.", "connections": "Magnetic point group, Weyl semimetal."}, {"term": "비선형 비정상 홀 효과", "why_emerged": "기존 선형 홀 효과가 대칭성에 의해 소멸되는 시스템에서 Berry 곡률의 쌍극자 모멘트에 의한 전송을 기술하기 위해 필요합니다.", "origin": "2010년대 후반 위상 반금속 연구로부터 확립.", "connections": "Berry 곡률, 위상 수송론."}], "english_summary": ["Introduction of Heesch nodal lines (HNLs) in achiral antiferromagnetic semimetals.", "Demonstrates that symmetry restoration converts isolated Weyl points into topological nodal lines.", "Predicts non-vanishing third-order nonlinear anomalous Hall effects in specific antiferromagnets.", "Computational validation in MnTe and CrSb provides a template for future spectroscopic verification."]}}, {"title": "Non-Resonant Impulsively Stimulated Raman Scattering by a Terahertz Field: a Case Study of 1T-TaS2", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2609.03519", "authors": "Haotian Zhang, Yuheng Guo, Zidu Yu, et al.", "last_authors": "Xinbo Wang, Hao Chu", "summary": "Time-domain ultrafast and nonlinear terahertz spectroscopy techniques are recently applied to many condensed matter systems for investigating their collective excitations. In centrosymmetric systems, these collective modes are typically Raman-active and therefore do not couple directly to the terahertz electric field. The mechanism by which light-matter interaction realizes in these studies has not been explicitly discussed in detail. In this work, we perform terahertz pump - optical probe and terahertz third harmonic generation investigations on 1T-TaS2, a material exhibiting a rich charge-density-wave (CDW) phase diagram including the commensurate, nearly-commensurate and incommensurate CDW phases. The transition between these distinct states leaves a clear signature on the dynamical Raman response. We investigate how the Raman-active phonons couple to a broadband monocycle terahertz field as well as a narrowband multicycle terahertz field. Our results indicate that a modified impulsively stimulated Raman scattering mechanism involving two-photon absorption, also known as non-resonant Raman scattering, underlies the coherent excitation and observation of the lattice modes. These results are relevant for future spectroscopy investigation and coherent control of collective modes using low-energy terahertz field as well as cavity electrodynamical dressing of solids.", "tier": "B_IMPORTANT_CONDMAT", "score": "9", "reason": "Ultrafast spectroscopy of collective modes in the CDW phases of 1T-TaS2.", "tags": ["material", "CDW", "spectroscopy"], "image": "https://arxiv.org/static/browse/0.3.4/images/arxiv-logo-fb.png", "briefing": {"background": "전하 밀도 파(CDW)와 같은 정렬 상태를 가진 물질에서 집단 들뜸(collective excitations)은 물질의 물리적 특성을 결정짓는 핵심 요소입니다. 초고속 분광학은 이 모드들의 동역학을 관찰하는 데 필수적입니다.", "motivation": "중심 대칭성을 가진 물질에서 Raman 활성 모드는 테라헤르츠(THz) 전기장과 직접 결합하지 않아야 함에도 불구하고, 실험적으로는 테라헤르츠 펌프를 통해 관찰되는 경우가 많아 그 물리적 메커니즘을 명확히 규명할 필요가 있었습니다.", "result": "1T-TaS2의 다양한 CDW 상에서 테라헤르츠 분광 실험을 통해, 이 들뜸이 2광자 흡수를 포함하는 '비공명 충격 유도 Raman 산란(non-resonant impulsively stimulated Raman scattering)' 메커니즘에 의해 발생함을 입증했습니다.", "implication": "낮은 에너지의 테라헤르츠 필드를 이용해 고체 내 집단 모드를 조절하거나 공동 양자 전기역학(cavity electrodynamics)을 구현하는 제어 기술의 이론적 토대를 마련했습니다.", "novelty": "CDW 상에서의 비선형 광-물질 상호작용 메커니즘을 규명하여, 향후 더 정밀한 시간 분해 분광 실험 및 물질 제어 전략을 세우는 데 중요한 단서를 제공합니다.", "unresolved": "실험적 결과는 제시되었으나, 이 비공명 메커니즘이 다른 강상관 물질의 복잡한 위상 구조에서도 동일하게 지배적인지 여부는 추가 연구가 필요합니다.", "future_work": "테라헤르츠 필드를 이용한 집단 모드의 코히런트 제어 실험 및 cavity dressing을 이용한 물질 물성 변조 연구가 이어질 것으로 보입니다.", "concepts": [{"term": "CDW (Charge Density Wave)", "why_emerged": "전자와 격자 사이의 상호작용으로 인해 전자 밀도가 주기적으로 변조되는 바닥 상태를 설명하기 위해 도입되었습니다.", "origin": "Peierls에 의해 1차원 금속 시스템에서 처음 제안되었습니다.", "connections": "Kagome 금속 AV3Sb5의 CDW 연구 및 전이금속 디칼코게나이드(TMD)의 상전이 연구와 직접 연결됩니다."}, {"term": "Impulsively Stimulated Raman Scattering", "why_emerged": "극초단파 펄스를 이용해 격자 진동을 결맞게(coherent) 여기시키기 위해 사용됩니다.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "초고속 펌프-프로브 분광학의 핵심 구동 메커니즘입니다."}], "english_summary": ["Investigated coherent excitation of CDW collective modes in 1T-TaS2 using THz spectroscopy.", "Identified that non-resonant impulsively stimulated Raman scattering via two-photon absorption drives these lattice modes.", "Provided a mechanistic understanding of how Raman-active phonons couple to THz  팔면체 기울임이 억제될 때 전하 밀도가 높은 금속 상태로 전이되는 크로스오버 현상을 관찰했습니다.", "implication": "라티스 구조(격자)와 전자 상태 사이의 밀접한 상호작용이 고온 초전도성을 유도하는 중요한 요소임을 시사합니다.", "novelty": "니켈산염 초전도체의 구조-물성 상관관계를 체계적으로 매핑하여, 향후 초전도 전이 온도 제어의 설계 원리를 제시했습니다.", "unresolved": "이 구조적 변화가 직접적으로 초전도 전자쌍 형성에 어떻게 기여하는지에 대한 미시적 메커니즘은 여전히 숙제입니다.", "future_work": "ARPES를 통한 직접적인 페르미 면 관찰과 도핑 제어를 통한 초전도 상태의 정밀한 상태 변화 연구가 필요합니다.", "concepts": [{"term": "Bilayer Nickelates", "why_emerged": "큐프레이트와 유사한 3d 궤도 특성을 가지면서도 층 구조를 조절할 수 있어 새로운 고온 초전도체 탐색의 장으로 활용됨.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "Cuprate high-Tc superconductivity, Mott physics."}, {"term": "Oxygen Octahedra Tilt", "why_emerged": "페로브스카이트 유도체 구조에서 전자 궤도 결합과 페르미 면의 모양을 결정짓는 핵심 구조 변수임.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "Structural phase transition, Electronic band narrowing."}], "english_summary": ["The study maps the P-T phase diagram of bilayer La3Ni2O7.", "Suppression of oxygen octahedra tilts triggers a crossover to a high-carrier-density metallic state.", "Results demonstrate a clear link between lattice structure and electronic properties in nickelate superconductors."]}}, {"title": "Observation of subharmonic charge-density-wave correlations in La-based cuprates", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/djbs-mcz5", "authors": "J.-S. Lee, S. A. Kivelson, H. Lee, et al.", "last_authors": "M. Fujita, C.-C. Kao", "summary": "Suggestive but indirect evidence for pair-density-wave correlations has been reported in several high- T c cuprates, yet a bulk-sensitive scattering signature of the expected subharmonic charge response has remained elusive. Here, the authors use resonant soft x-ray scattering to identify a reproducible subharmonic charge density wave response near half the primary charge-ordering wave vector in two La-based cuprates. The response emerges in the stripe-ordered, layer-decoupled superconducting regime, where charge, spin, and superconducting correlations are intertwined.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "RSXS study of CDW in cuprates; clear experimental relevance.", "tags": ["CDW", "cuprate", "superconductivity"], "image": "", "briefing": {"background": "고온 초전도 큐프레이트에서 전하 밀도 파동(CDW)은 초전도와 경쟁하거나 공존하는 근본적인 전자 질서로, 이들의 복잡한 얽힘(entanglement)을 이해하는 것은 난제입니다.", "motivation": "큐프레이트에서 페어 밀도 파동(PDW)의 존재를 뒷받침하는 직접적인 증거인 '하부 조화(subharmonic) 전하 반응'을 bulk 민감 측정법인 RSXS를 통해 검증하고자 했습니다.", "result": "두 종류의 La 기반 큐프레이트에서 기본 전하 질서 파동 벡터의 절반 지점에서 나타나는 subharmonic CDW 반응을 확인했습니다.", "implication": "이는 스트라이프 질서가 있는 상에서 전하, 스핀, 초전도 상관관계가 실제로 심도 있게 얽혀 있음을 입증하는 강력한 증거가 됩니다.", "novelty": "이전까지 간접적으로만 추측되던 PDW 관련 시그니처를 RSXS라는 정밀 분광법으로 포착하여 큐프레이트 물성 연구에 새로운 실험적 이정표를 제시했습니다.", "unresolved": "관찰된 subharmonic 시그니처가 정확히 어떤 물리적 상태(예: PDW)와 직결되는지에 대한 이론적 해석의 여지가 남아 있습니다.", "future_work": "다른 도핑 수준 및 다양한 큐프레이트 계열에서의 유사 현상 추적, 이론적 모델과의 정량적 비교.", "concepts": [{"term": "Pair-Density-Wave (PDW)", "why_emerged": "큐프레이트의 초전도성과 전하 질서 사이의 공존 문제를 해결하기 위해 제안된 이국적인 초전도 상태.", "origin": "Agterberg et al. (2008) 등에서 이론적으로 제안됨.", "connections": "Stripe phases, High-Tc superconductivity, CDW."}, {"term": "Resonant Soft X-ray Scattering (RSXS)", "why_emerged": "원소 특정적이고 궤도 민감도가 높아 얇은 층이나 벌크의 전하/스핀 질서를 탐지하는 데 필수적임.", "origin": "싱크로트론 기술의 발전과 함께 확립됨.", "connections": "RIXS, Charge order, Quantum materials."}], "english_summary": ["RSXS measurements reveal subharmonic CDW signatures in La-based cuprates.", "The observed signal appears at half the primary charge-ordering wave vector.", "Provides experimental evidence for intertwined spin, charge, and superconducting correlations."]}}, {"title": "Optical conductivity of the topological semimetal Nb2n+1SinTe4n+2", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/qnry-8r3m", "authors": "Seongjin Ahn", "last_authors": "Seongjin Ahn", "summary": "We study the linear optical conductivity of the ${\\mathrm{Nb}}_{2n+1}{\\mathrm{Si}}_{n}{\\mathrm{Te}}_{4n+2}$ family of layered va on coupling in superconducting hydrides", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2507.06749", "authors": "Trinidad Novoa, Francesco Belli, Raffaello Bianco, Julia Contreras-Garc\\'ia, Ion Errea", "last_authors": "Julia Contreras-Garc\\'ia, Ion Errea", "summary": "Electron-phonon coupling is at the origin of conventional superconductivity, enabling the pairing of electrons into Cooper pairs. The electron-phonon matrix elements depend on the electronic eigenstates and, in the standard linear approximation, on the first derivative of the potential felt by the electrons with respect to ionic perturbations. Here, we focus on the derivatives of the potential with a twofold aim: to assess their contribution to the overall coupling and to analyze the limitations of neglecting higher-order derivatives. Several real-space functions are proposed to do the analysis, and are computed for some well-known superconductors. Our results show that, in hydrides, the derivatives of the potential tend to be larger in regions of high electron localization, explaining the success of electronic descriptors previously described to correlate with the critical temperature. The new functions introduced here are able to tell apart structures with similar types of bonding but very different critical temperatures, such as H3S and H3Se Im-3m phases, where electronic descriptors alone fail. Moreover, they provide a method to discriminate promising superconductors from conventional low-$T_c$ materials. Interestingly, our descriptors are capable of easily estimating the impact of higher-order terms in the electron-phonon coupling. In fact, we capture the limitations of the linear approximation expected for PdH, and predict an even more important non-linear behavior in other hydrides.", "tier": "B_IMPORTANT_CONDMAT", "score": "7", "reason": "DFT-based electronic structure analysis of electron-phonon coupling in high-Tc superconducting hydrides.", "tags": ["theory
