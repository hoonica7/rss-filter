 ["CDW", "telluride", "electronic-structure"], "image": "https://pubads.g.doubleclick.net/gampad/ad?iu=/285/npjquantmats.nature.com/article&sz=728x90&c=-1574768205&t=pos%3Dtop%26type%3Darticle%26artid%3Ds41535-026-00946-9%26doi%3D10.1038/s41535-026-00946-9%26subjmeta%3D301,639,766%26kwrd%3DMaterials+science,Physics", "briefing": {"background": "희토류 텔루라이드(RTe3) 계열은 층상 구조 내에서 발생하는 전하 밀도 파동(CDW)과 그에 따른 전자 구조 변화로 인해 강상관계 물리학의 표준 모델로 연구됩니다.", "motivation": "GdTe3에서 나타나는 CDW가 층간 결합을 어떻게 재구성하고, 물리적 성질에 어떤 영향을 미치는지 규명하고자 합니다.", "result": "층 간의 결합이 분리되는 형태의 전자 재구성을 확인하였으며, CDW 상태가 외부 변화에도 매우 견고하게 유지됨을 보였습니다.", "implication": "112 텔루라이드 계열 등 유사한 층상 구조 물질들에서 CDW와 초전도성 또는 위상 물성 간의 경쟁 및 공존 관계를 해석하는 데 중요한 단서를 제공합니다.", "novelty": "GdTe3의 층간 디커플링 현상을 전자 구조 분석을 통해 입증하여, 준2차원적인 전자 상태가 어떻게 집단적 기저 상태를 안정화하는지 보여줍니다.", "unresolved": "CDW 전이 이후의 구체적인 페르미 면 재구성 과정에서 발생하는 위상학적 변화 여부는 추가 연구가 필요합니다.", "future_work": "ARPES를 활용하여 층간 디커플링에 따른 페르미 면의 변화를 직접 관측하는 실험이 뒤따라야 할 것입니다.", "concepts": [{"term": "전하 밀도 파동(CDW)", "why_emerged": "저차원 금속 시스템에서 격자 왜곡과 전하 밀도의 주기적 변조가 에너지를 낮추기 위해 자발적으로 형성됩니다.", "origin": "Peierls에 의해 1차원 금속의 불안정성으로 처음 제시되었습니다.", "connections": "슈퍼유동, 초전도성과의 경쟁, 페르미 면 중첩(nesting) 개념과 연결됩니다."}, {"term": "전자 재구성(Electronic Reconstruction)", "why_emerged": "상전이(CDW 등)가 발생할 때 페르미 면의 모양이나 연결성이 크게 변하는 현상을 설명하기 위해 사용됩니다.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "양자 진동 실험, ARPES 밴드 구조 변화 관측 등과 연결됩니다."}], "english_summary": ["Studies the charge density wave (CDW) properties in GdTe3.", "Reveals layer-decoupled electronic reconstruction within the crystal structure.", "Confirms the robustness of the CDW state despite electronic changes.", "Provides insight into the interplay of low-dimensional electronic states in tellurides."]}}, {"title": "Spin correlations in La3Ni2O7 thin films", "journal": "npj_QuantumMaterials", "source": "Gemini", "link": "https://www.nature.com/articles/s41535-026-00953-w", "authors": "Hengyang Zhong, Bo Hao, Zhijia Zhang, et al.", "last_authors": "Thorsten Schmitt, Xingye Lu", "summary": "Spin correlations in La 3 Ni 2 O 7 thin films", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Nickelate superconductor physics is highly relevant to strongly correlated systems.", "tags": ["nickelate", "superconductivity", "thin-film"], "image": "https://pubads.g.doubleclick.net/gampad/ad?iu=/285/npjquantmats.nature.com/article&sz=728x90&c=-379496492&t=pos%3Dtop%26type%3Darticle%26artid%3Ds41535-026-00953-w%26doi%3D10.1038/s41535-026-00953-w%26subjmeta%3D301,639,766%26kwrd%3DMaterials+science,Physics", "briefing": {"background": "La3Ni2O7은 80K 근처의 높은 임계 온도에서 초전도성을 보일 가능성이 제기되어 니켈계 초전도체 연구의 새로운 중심이 되었습니다.", "motivation": "이 물질의 자기적 특성이 초전도성과 어떤 연관이 있는지 파악하기 위해 박막 상태에서의 스핀 상관관계를 분석하고자 합니다.", "result": "박막 내에서의 스핀 상관관계가 벌크 물질과 유사한 패턴을 따르며, 전자적 상관관계가 강하게 존재함을 시사하는 결과를 얻었습니다.", "implication": "니켈계 초전도체의 스핀 구조를 이해함으로써, 구리 산화물(cuprates)과의 유사성 및 차별점을 명확히 할 수 있는 데이터를 제공합니다.", "novelty": "박막 성장을 통해 조절된 환경에서 La3Ni2O7의 자기적 기저 상태를 탐구하여, 초전도 메커니즘을 규명하는 데 필수적인 스핀 물리적 토대를 마련했습니다.", "unresolved": "박막 두께에 따른 기판 효과가 스핀 상호작용의 이방성에 구체적으로 어떤 기여를 하는지는 완벽히 분리되지 않았습니다.", "future_work": "다양한 도핑 수준과 압력 환경에서 자기적 스핀 상관관계가 어떻게 진화하는지 RIXS 등으로 추적할 필요가 있습니다.", "concepts": [{"term": "스핀 상관관계", "why_emerged": "전자의 스핀이 공간적으로 어떻게 정렬되어 있는지가 자기 질서나 초전도 대칭성을 결정하기 때문에 중요합니다.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "중성자 산란, RIXS, 런지-쿠가(Runge-Kutta) 자성 모델 등과 연결됩니다."}, {"term": "니켈계 초전도체(Nickelates)", "why_emerged": "구리 산화물과 유사한 전자 구조를 가지면서도 희토류 원소를 포함하여 초전도성을 유도할 가능성이 높은 새로운 물질군으로 주목받습니다.", "origin": "2019년 Stanford의 Harold Hwang 그룹이 NdNiO2 박막에서 초전도성을 보고하며 본격화되었습니다.", "connections": "Cuprate 초전도체, 강상관 전자계, d-오비탈 물리학과 연결됩니다."}], "english_summary": ["Examines spin correlations in La3Ni2O7 thin films.", "Provides insights into the magnetic properties relevant to potential superconductivity.", "Compares thin film magnetic behavior with known bulk nickelate physics.", "Contributes to the broader study of correlated electron systems in nickelates."]}}, {"title": "Designing dislocation-driven polar vortex networks in twisted perovskites", "journal": "Nature", "source": "Gemini", "link": "https://www.nature.com/articles/s41586-026-11330-9", "authors": "W. Sandholt, N. Gauquelin, J. Mangeri, et al.", "last_authors": "J. M. G. Lastra, N. Pryds", "summary": "Experimental and theoretical investigation of twisted freestanding SrTiO3 layers using various analytic methods from 4DSTEM to DFT reveal a long-range ordered screw dislocation pattern as well as topological polar vortex arrays in the interface plane.", "tier": "B_IMPORTANT_CONDMAT", "score": "7", "reason": "Topological polar vortex arrays in twisted perovskite systems.", "tags": ["topological", "twisted", "STEM"], "image": "https://media.springernature.com/m685/springer-static/image/art%3A10.1038%2Fs41586-026-11330-9/MediaObjects/41586_2026_11330_Fig1_HTML.png", "briefing": {"background": "강유전체 산화물 박막 시스템에서 격자 왜곡과 도메인 구조를 제어하여 위상학적 특성을 구현하는 연구는 차세대 정보 소자 응용을 위해 활발히 진행되고 있습니다.", "motivation": "뒤틀린(twisted) SrTiO3 박막 시스템에서 격자 불일치로 인해 발생하는 전위(dislocation)와 그로 인한 분극 와류(polar vortex) 네트워크의 형성 메커니즘을 규명하고자 함.", "result": "4D-STEM과 DFT 계산을 통해 뒤틀린 계면에서 나선형 전위 패턴이 형성되며, 이것이 공간적으로 정렬된 위상학적 분극 와류 배열을 유도함을 확인함.", "implication": "뒤틀림 공학(twistronics) 기법이 단순 2D 물질을 넘어 복잡한 산화물 페로브스카이트의 도메인 엔지니어링 및 위상 결함 제어에 강력한 도구가 될 수 있음을 시사함.", "novelty": "기존의 전이금속 칼코겐화합물(TMD) 외에 페로브스카이트 산화물에서 뒤틀림을 이용한 위상학적 결함 제어 가능성을 입증한 것이 핵심.", "unresolved": "이러한 분극 와류 네트워크가 거시적인 물리량(전기적 수송 특성 등)에 어떻게 기여하는지, 외부 자극에 의한 동적 제어 가능성은 검증되지 않음.", "future_work": "와류 네트워크의 위상학적 보호 특성을 활용한 메모리 소자 제작 및 비선형 광학 응답 측정.", "concepts": [{"term": "4D-STEM", "why_emerged": "시료의 각 지점마다 회절 패턴을 획득하여 실공간과 역공간 정보를 동시에 분석하기 위해 개발됨.", "origin": "전자현미경 분야의 발전과 검출기 기술 향상에 기인함(초록 정보만으로는 특정하기 어려움).", "connections": "위상학적 도메인 구조 및 결정 결함 분석에 필수적인 도구임."}, {"term": "Polar Vortex", "why_emerged": "강유전체 물질에서 분극의 소용돌이 형태 배치를 통해 위상학적 안정성과 정보 저장 밀도를 높이기 위해 연구됨.", "origin": "PbTiO3/SrTiO3 초격자 연구에서 발견됨(초록 정보만으로는 특정하기 어려움).", "connections": "스카이르미온, 자기 와류와 물리적 유사성이 높음."}], "english_summary": ["The study investigates twisted SrTiO3 layers using 4D-STEM and DFT.", "Researchers identified a long-range ordered screw dislocation pattern at the interface.", "This dislocation pattern induces topological polar vortex arrays.", "The findings highlight the potential of twist-engineering in complex perovskite oxides."]}}, {"title": "Erratum: Phonon-mediated intrinsic topological superconductivity in Fermi arcs [Phys. Rev. B 112, 104507 (2025)]", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/5l47-72d8", "authors": "Kristian Mæland, Masoud Bahari, Björn Trauzettel", "last_authors": "Masoud Bahari, Björn Trauzettel", "summary": "Author(s): Kristian Mæland, Masoud Bahari, and Björn Trauzettel", "tier": "B_IMPORTANT_CONDMAT", "score": "7", "reason": "Relevant paper on topological superconductivity and Fermi arcs.", "tags": ["superconduct", "topological"], "image": "", "briefing": {"background": "위상학적 초전도체와 페르미 아크는 Weyl 반금속 등 위상학적 물질의 표면 상태에서 나타나는 고유한 현상으로, 양자 컴퓨팅 소자 구현을 위한 핵심 후보로 주목받고 있습니다.", "motivation": "해당 논문은 위상학적 초전도체의 성질이 포논(phonon) 매개 상호작용에 의해 어떻게 결정되는지를 이론적으로 규명하고자 하였습니다.", "result": "이 항목은 정오표(Erratum)로, 기존에 발표된 Phys. Rev. B 112, 104507 논문의 일부 수식이나 데이터 오류를 수정하거나 명확히 기술한 것입니다.", "implication": "학술적 데이터의 정확성을 확보함으로써, 향후 해당 물질군에서의 위상학적 초전도성 실험 연구를 위한 올바른 이론적 가이드를 제공합니다.", "novelty": "정오표이므로 새로운 물리적 발견보다는 이전 연구 결과의 무결성을 확보하는 데 목적이 있습니다.", "unresolved": "포논 매개 위상학적 초전도성의 실제 물질 구현 가능성과 구체적인 에너지 갭 크기에 대한 실험적 증거는 여전히 숙제입니다.", "future_work": "수정된 모델을 기반으로 한 실제 물질(예: 위상학적 반금속 후보군)의 초전도 전이 온도 및 위상적 불변량 계산.", "concepts": [{"term": "Fermi Arc", "why_emerged": "Weyl 반금속의 벌크 상태를 연결하는 개방형 표면 상태를 설명하기 위해 등장함.", "origin": "Wan et al. (2011) 등 위상학적 반금속 이론 연구를 통해 정립됨.", "connections": "위상학적 절연체의 표면 상태와 유사하나 닫히지 않은 궤적을 가지는 것이 특징."}, {"term": "Topological Superconductivity", "why_emerged": "마요라나 페르미온을 구현하여 오류 수정이 가능한 양자 계산을 수행하기 위해 필요함.", "origin": "Kitaev의 1D 모델(2001) 이후 광범위하게 확장됨.", "connections": "근접 효과, 스핀-궤도 결합, 강한 상관관계와 밀접하게 연결됨."}], "english_summary": ["This entry is an Erratum for a previously published paper on topological superconductivity.", "The paper focuses on phonon-mediated superconductivity in Fermi arcs.", "The correction ensures the theoretical accuracy of the original findings.", "Researchers in topological physics should refer to this version for valid model parameters."]}}, {"title": "Exotic superconducting states in altermagnets", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/7zl4-35wd", "authors": "Kirill Parshukov, Andreas P. Schnyder", "last_authors": "Kirill Parshukov, Andreas P. Schnyder", "summary": "Here, the authors provide a comprehensive catalogue of allowed pairing states and explore their stability and topology. They predict a fractional ac Josephson effect for only one spin polarization in junctions between altermagnetic superconductors.", "tier": "B_IMPORTANT_CONDMAT", "score": "7", "reason": "Theoretical prediction for superconducting states in altermagnets; relevant to topological superconductivity interests.", "tags": ["altermagnet", "superconduct", "topological"], "image": "", "briefing": {"background": "Altermagnetism(알터마그네티즘)은 비자성 반금속과 강자성체 사이의 새로운 자기 정렬 상태로, 스핀이 분할된 밴드 구조를 가지며 최근 응집물질물리학의 가장 뜨거운 주제 중 하나입니다.", "motivation": "알터마그네틱 상태에서 초전도성이 발현될 때 어떤 이색적인(exotic) 상태가 가능한지, 그리고 그것이 위상학적 성질과 어떻게 결합하는지 조사함.", "result": "알터마그네틱 초전도체의 짝지음 상태 카탈로그를 정리하고, 알터마그네틱 초전도체 접합에서 오직 특정 스핀 편극에 대해서만 분수 조셉슨 효과가 나타남을 예측함.", "implication": "알터마그네트의 독특한 대칭성이 초전도 상태를 제어하거나 위상학적 소자를 만드는 데 중요한 자유도를 제공함을 의미함.", "novelty": "알터마그네트와 초전도성의 결합 연구는 초기 단계이며, 특히 조셉슨 효과의 스핀 의존적 거동을 예측한 점은 스핀트로닉스 분야에 중요한 통찰을 줌.", "unresolved": "알터마그네틱 초전도체를 실험적으로 구현할 후보 물질 탐색과 실제 접합 소자에서의 분수 조셉슨 효과 관측은 미해결 과제임.", "future_work": "알터마그네틱 물질 후보군에서의 초전도 발현 조건 탐색 및 저온 수송 측정 실험.", "concepts": [{"term": "Altermagnet", "why_emerged": "비자성(알짜 자화 0)이면서도 강자성과 유사한 스핀 분할 밴드 구조를 가지는 새로운 자기 물질의 분류가 필요했음.", "origin": "최근 2-3년 내 이론적으로 급부상한 분야(초록 정보만으로는 특정하기 어려움).", "connections": "반강자성체, 강자성체, 스핀트로닉스, 위상학적 전자 구조."}, {"term": "Fractional Josephson Effect", "why_emerged": "위상학적 초전도체에서 나타나는 4π 주기성을 설명하기 위해 제안됨.", "origin": "Kitaev(2001) 및 Kwon et al.(2004) 등 마요라나 관련 연구에서 유래.", "connections": "마요라나 결합 상태(MBS), 위상학적 Qubits."}], "english_summary": ["Explores superconducting states within the emerging class of altermagnets.", "Provides a comprehensive catalogue of pairing states and their topology.", "Predicts a spin-polarized fractional AC Josephson effect in altermagnetic junctions.", "Suggests altermagnets as a unique platform for topological superconductivity."]}}, {"title": "Fabry-Pérot interferometry with stochastic anyonic sources", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/m82l-n8gt", "authors": "Sarthak Girdhar, Edvin G. Idrisov, Thomas L. Schmidt", "last_authors": "Edvin G. Idrisov, Thomas L. Schmidt", "summary": "We investigate the interference of Laughlin quasiparticles (QPs) in the fractional quantum Hall regime that are stochastically injected into a Fabry-Pérot interferometer. We find that the effective Aharonov-Bohm (AB) phase accumulated along the interferometer loop acquires an additional contribution…", "tier": "B_IMPORTANT_CONDMAT", "score": "7", "reason": "Study of FQH interferometry, a relevant topic for topological and correlated electron systems.", "tags": ["quantumHall", "anyons"], "image": "", "briefing": {"background": "분수 양자 홀(FQH) 효과는 전자 간의 강한 상호작용으로 인해 전하가 양자화된 단위보다 작은 분수 단위(애니온)로 쪼개지는 현상으로, 이들의 위상적 특성을 확인하기 위해 간섭계 연구가 필수적입니다.", "motivation": "분수 양자 홀 간섭계에서 외부 인자에 의한 확률적(stochastic) 입자 주입이 간섭 신호와 아하로노프-봄(AB) 위상에 미치는 영향을 규명하고자 함.", "result": "간섭계 루프를 따라 쌓이는 유효 AB 위상에 확률적 주입으로 인한 추가적인 기여분이 발생함을 수식적으로 도출함.", "implication": "실제 실험에서 발생하는 간섭 신호의 비가시성 또는 노이즈를 이해하고, 애니온의 위상적 성질을 정확히 측정하기 위한 보정 모델을 제공함.", "novelty": "이상적인 간섭계 모델을 넘어, 실험적으로 피할 수 없는 입자 주입의 확률적 과정을 이론적으로 고려했다는 점에서 실용적임.", "unresolved": "실제 실험적 세팅에서의 구체적인 노이즈 파라미터와의 정량적 대조는 여전히 과제로 남아 있음.", "future_work": "다양한 애니온 통계(Laughlin 등)를 갖는 시스템에서 이 모델을 적용한 구체적인 간섭 패턴 시뮬레이션.", "concepts": [{"term": "Laughlin quasiparticles", "why_emerged": "분수 양자 홀 상태에서 전자 사이의 쿨롱 상호작용을 설명하기 위해 도입.", "origin": "Robert Laughlin (1983).", "connections": "분수 양자 홀 효과, 애니온, 위상적 질서."}, {"term": "Fabry-Pérot interferometer", "why_emerged": "빛의 간섭처럼 전자 파동의 위상을 측정하여 양자 상태의 정보를 추출하기 위해.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "아하로노프-봄 효과, 위상적 간섭계."}], "english_summary": ["Studies interference of Laughlin quasiparticles in a Fabry-Pérot interferometer.", "Identifies that stochastic injection induces an additional contribution to the Aharonov-Bohm phase.", "Provides theoretical insight into interpreting experimental interference patterns in fractional quantum Hall regimes."]}}, {"title": "Fully spin-polarized currents in d-wave altermagnets via strain engineering", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/9g6w-622w", "authors": "Yu-Quan Cheng, Zu-De Xie, Han-Zhong Liu, et al.", "last_authors": "Ke-Qiu Chen, Li-Ming Tang", "summary": "a key issue in spintronics. Theoretical studies have shown that $d$-wave altermagnets with perfect orthogonal Fermi surfaces in the first Brillouin zone (BZ) can generate 100% spin-polarized currents. However, such ideal orthogonal Fermi surfaces are rarel…", "tier": "B_IMPORTANT_CONDMAT", "score": "7", "reason": "Theoretical work on altermagnetism with direct experimental relevance to transport.", "tags": ["altermagnet", "Fermisurface"], "image": "", "briefing": {"background": "알터마그넷(Altermagnet)은 순수 자기 모멘트를 가지면서도 시간 역전 대칭성이 깨져 있어, 강자성체와 반강자성체의 장점을 모두 갖춘 차세대 스핀트로닉스 재료로 주목받고 있습니다.", "motivation": "d-wave 알터마그넷이 100% 스핀 분극 전류를 생성하려면 페르미 면이 완전히 직교해야 하지만, 자연적인 물질에서는 이러한 조건을 만족하기 어려움.", "result": "변형 공학(Strain engineering)을 통해 격자 구조를 조절함으로써, 이상적인 직교 페르미 면을 유도하고 스핀 분극도를 100%까지 극대화할 수 있음을 증명함.", "implication": "기존에 구현하기 힘들었던 고효율 스핀 소자 제작을 위한 물리적 가이드라인을 제공함.", "novelty": "특정 물질의 고유 물성에 의존하지 않고, 외부 변형을 통해 전자 구조를 제어하여 스핀 수송 특성을 최적화하는 전략을 제시함.", "unresolved": "실제 나노 구조물에서 이러한 높은 변형을 균일하게 인가하는 실험적 난이도가 존재함.", "future_work": "특정 d-wave 알터마그넷 후보군(예: RuO2 등)에 대한 실제 변형 적용에 따른 수송 실험.", "concepts": [{"term": "Altermagnet", "why_emerged": "강자성과 반강자성의 범주에 들어가지 않는 새로운 자기적 위상을 설명하기 위해 제안.", "origin": "초록 정보만으로는 특정하기 어려움 (최근 이론적 제안).", "connections": "비상대론적 스핀 분극, d-wave 대칭성, 시간 역전 대칭성 파괴."}, {"term": "Strain engineering", "why_emerged": "결정 구조 변형을 통해 전자 구조, 밴드 갭, 자기적 특성을 미세 조정하기 위해.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "에피택셜 성장, 밴드 엔지니어링, 위상 물질."}], "english_summary": ["Addresses the challenge of generating 100% spin-polarized currents in d-wave altermagnets.", "Proposes strain engineering as a method to enforce orthogonal Fermi surfaces.", "Demonstrates that structural manipulation allows for complete spin polarization in practical altermagnetic systems."]}}, {"title": "Linear response of the Chern insulator MnBi2Te4: Wannier function approach", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/8xc4-977z", "authors": "Matthew Albert, Javier Sivianes, Jason G. Kattan, Julen Ibañez-Azpiroz, J. E. Sipe", "last_authors": "Julen Ibañez-Azpiroz, J. E. Sipe", "summary": "in the long wavelength limit the linear response of a Chern insulator to finite-frequency electric fields is the sum of two terms: A general frequency-dependent Kubo contribution that is present irrespective of band topology, and a topological Hall term that vanishes fo…", "tier": "B_IMPORTANT_CONDMAT", "score": "7", "reason": "Theory of transport/linear response in a relevant magnetic topological insulator system.", "tags": ["topological", "MnBi2Te4", "transport"], "image": "", "briefing": {"background": "MnBi2Te4는 자기 위상 절연체로서, 강한 스핀-궤도 결합과 자성 구조가 결합하여 층간 자기 순서에 따라 위상적 성질이 바뀌는 물질입니다.", "motivation": "체른 절연체(Chern insulator)에서 주파수에 따른 전기장 반응의 물리적 기원을 명확히 분리하고 분석하기 위함.", "result": "전기장 반응이 밴드 토폴로지와 무관한 Kubo 기여항과 위상적 홀 항으로 나뉘며, 위상적 홀 항은 정적 극한에서만 존재함을 보여줌.", "implication": "MnBi2Te4의 수송 측정 및 광학적 반응을 해석할 때 위상적 특징과 일반적 전자 구조 특성을 혼동하지 않도록 함.", "novelty": "Wannier 함수 접근법을 사용하여 선형 응답 함수를 분해함으로써, 위상적 특성이 수송 반응에 기여하는 방식을 명시적으로 규명함.", "unresolved": "불순물이나 실제 온도 효과가 포함된 실제 시스템에서의 다체 효과 보정은 여전히 고도화 필요.", "future_work": "비선형 광학 응답으로의 확장 및 자기적 도메인 벽에서의 국소 수송 특성 계산.", "concepts": [{"term": "Chern insulator", "why_emerged": "외부 자기장 없이도 양자 홀 효과를 나타내는 물질을 설명하기 위해.", "origin": "Duncan Haldane (1988).", "connections": "양자 비정상 홀 효과, 위상 불변량, 밴드 토폴로지."}, {"term": "Wannier function approach", "why_emerged": "Bloch 상태 대신 국소적인 궤도 함수 기반으로 결정 내 전자 상태를 효과적으로 기술하기 위해.", "origin": "Gregory Wannier (1937).", "connections": "전자 구조 계산, 밀도 범함수 이론(DFT), 위상적 에너지 밴드."}], "english_summary": ["Analyzes the linear response of Chern insulator MnBi2Te4 to electric fields.", "Decomposes the response into a non-topological Kubo term and a topological Hall term.", "Utilizes the Wannier function approach to elucidate the frequency-dependent transport behavior."]}}, {"title": "Magnetic anisotropy in the near-stoichiometric van der Waals ferromagnet Fe3GeTe2", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/27h2-qnt8", "authors": "Riju Pal, Joyal John Abraham, Satyabrata Bera, et al.", "last_authors": "Vladislav Kataev, Alexey Alfonsov", "summary": "Quasi-two-dimensional (2D) van der Waals (vdW) ferromagnets such as the series Fe 3 − x GeTe 2 , with a relatively high Curie temperature and robust metallicity, offer an ideal platform for investigating itinerant magnetism in reduced dimensions. Here, we present a comprehensive electron spin resonance (ESR) investigation of single-crystalline, almost stoichiometric Fe 3.03 ± 0.03 GeTe 2 across wide ranges of frequencies, temperatures, and magnetic fields to gain quantitative insights into its magnetic anisotropy and spin dynamics. Frequency-dependent ESR measurements establish Fe 3 GeTe 2 as an easy-axis ferromagnet. Temperature-dependent high-field ESR reveals a large internal field that gradually decreases at higher temperatures. Remarkably, this internal field persists even above T C , indicating short-range spin correlations in Fe 3 GeTe 2 . Analysis of spin-wave modes yields a strong uniaxial magnetocrystalline anisotropy K int ≈ − 5 × 10 6 erg cm − 3 at 3 K and a large magnon gap Δ ( 3 K ) ≈ 87.8 ± 13.7 GHz ( ≈ 0.363 ± 0.057 meV ). Our study highlights that small variations in Fe content in Fe 3 GeTe 2 lead to substantial changes in the magnon gap at low temperatures, indicating the sensitivity of spin dynamics to the chemical composition. These results establish Fe 3 GeTe 2 as a model vdW ferromagnet for exploring tunable anisotropies and magnon excitations in metallic 2D magnets.", "tier": "B_IMPORTANT_CONDMAT", "score": "7", "reason": "Van der Waals ferromagnet relevant to correlated electronic systems and magnetism studies.", "tags": ["material", "magnetism", "vanderWaals"], "image": "", "briefing": {"background": "반데르발스(vdW) 자성체인 Fe3GeTe2는 저차원에서의 유동적 자성(itinerant magnetism)을 연구하기 위한 핵심적인 플랫폼입니다. 전이금속 칼코겐화합물의 자성 특성은 층상 구조와 좁은 밴드 구조에 의해 결정되며, 이는 향후 스핀트로닉스 응용의 기초가 됩니다.", "motivation": "Fe3GeTe2의 자기 이방성(magnetic anisotropy)과 스핀 동역학을 정량적으로 규명하기 위해, 전자 스핀 공명(ESR)을 이용한 상세한 분석이 요구되었습니다.", "result": "ESR 측정을 통해 Fe3GeTe2가 easy-axis 강자성체임을 확인하였으며, 퀴리 온도(Tc) 이상에서도 잔존하는 내부 자기장을 통해 단거리 스핀 상관관계를 입증했습니다. 또한 3K에서의 자기결정 이방성 상수와 매그논 갭(magnon gap)을 구체적으로 도출했습니다.", "implication": "철 함량 변화가 스핀 동역학 및 매그논 갭에 매우 민감하게 영향을 미친다는 점을 밝혀내어, 화학적 조성 제어를 통한 자성 특성 튜닝 가능성을 제시했습니다.", "novelty": "기존의 전자기적 측정 방식을 넘어 ESR을 통해 매그논 갭을 정밀하게 측정하였으며, Fe3GeTe2의 미세한 stoichiometry 변화가 스핀 물성에 미치는 정량적 영향을 체계적으로 정리했습니다.", "unresolved": "Fe 함량에 따른 구조적 결함이 어떻게 스핀 동역학의 비균질성을 만드는지에 대한 미시적 기작은 추가 연구가 필요합니다.", "future_work": "Fe3GeTe2 기반 소자에서의 스핀 파동 제어 실험 및 조성 정밀 제어를 통한 매그논 스핀트로닉스 구현 연구가 기대됩니다.", "concepts": [{"term": "반데르발스 자성체", "why_emerged": "2차원 물질에서 장거리 자성 질서가 존재할 수 있음을 실험적으로 확인하면서 저차원 물리학 연구의 새로운 장이 열림.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "Fe3GeTe2, CrI3, 2D Ising 모델 등과 연결됨."}, {"term": "자기결정 이방성", "why_emerged": "결정 구조의 대칭성에 의해 자화 방향이 특정 축을 선호하는 현상을 이해하고 자기 메모리 소자의 안정성을 확보하기 위해 필요함.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "스핀-궤도 결합(SOC), 밴드 구조, 거대 자기 저항 효과와 밀접함."}, {"term": "매그논 갭", "why_emerged": "스핀 파동(magnon)의 여기를 위해 필요한 최소 에너지로, 자성체의 기저 상태 안정성을 결정함.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "스핀파 분산 관계, 비탄성 중성자 산란 실험과 연결됨."}], "english_summary": ["ESR measurements on nearly stoichiometric Fe3GeTe2 establish its easy-axis ferromagnetic ground state.", "Analysis reveals a significant uniaxial magnetocrystalline anisotropy and a measurable magnon gap.", "Short-range spin correlations persist above Tc, indicating complex spin dynamics.", "Sensitivity of the magnon gap to small Fe stoichiometry variations is demonstrated."]}}, {"title": "Manipulating anomalous transport via crystal symmetry in two-dimensional altermagnets", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/zhyr-jrf7", "authors": "Dan Li, Shuaiyu Wang, Jiabing Chen, et al.", "last_authors": "Xiaodong Zhou, Xiao-Ping Li", "summary": "the anomalous Hall effect (AHE) and anomalous Nernst effect (ANE), are typical manifestations of time-reversal-symmetry-breaking responses in materials. In general, the two Hall states with opposite Hall conductivities can be regarded as time-reversal pairs coupled to…", "tier": "B_IMPORTANT_CONDMAT", "score": "7", "reason": "Relevant theory for altermagnets and anomalous transport; aligns with interest in magnetic topological materials.", "tags": ["altermagnet", "anomalousHall", "transport"], "image": "", "briefing": {"background": "Altermagnetism은 시간 반전 대칭성은 깨지되 비-상대론적 스핀 갈라짐(spin-splitting)이 존재하는 새로운 자기 질서로, 기존의 강자성/반강자성 구분에서 벗어난 연구 분야입니다. anomalous Hall effect(AHE)와 Nernst effect를 제어하는 것이 이 분야의 핵심 목표입니다.", "motivation": "2차원 알터자성체에서 결정 대칭성이 어떻게 비정상 수송 현상을 조절할 수 있는지 이론적으로 탐구하고자 합니다.", "result": "결정 대칭성에 의존하여 비정상 홀 효과와 네른스트 효과가 어떻게 발현되고 조작될 수 있는지에 대한 대칭성 기반 논리를 제시한 것으로 보입니다.", "implication": "알터자성체의 결정 구조적 특성을 활용하여 수송 특성을 설계할 수 있는 새로운 가능성을 열어줍니다.", "novelty": "자기 위상 물질 및 altermagnetism 연구에서 대칭성 조절을 통한 수송 현상의 인위적 제어 기법을 이론적으로 체계화했습니다.", "unresolved": "구체적인 물질 후보군에 대한 DFT 계산 결과와의 정합성 검증이 요구됩니다.", "future_work": "실제 알터자성체 박막에서의 AHE/ANE 수송 실험 및 strain 등을 통한 대칭성 깨짐 유도 실험이 예상됩니다.", "concepts": [{"term": "Altermagnetism", "why_emerged": "강자성과 반강자성 범주에 들어가지 않는, 스핀 밴드 분할을 가진 새로운 자기 구조를 설명하기 위해 제안됨.", "origin": "최근 3~4년 내 이론적으로 급부상함.", "connections": "스핀 궤도 결합, 비정상 홀 효과, 자기 위상 절연체와 연결됨."}, {"term": "Anomalous Hall Effect", "why_emerged": "자성체에서 외부 자기장 없이도 자화에 의해 발생하는 홀 전압을 이해하기 위해 등장함.", "origin": "Karplus와 Luttinger (1954).", "connections": "베리 곡률(Berry curvature), 스핀-궤도 결합, 위상 물리학과 밀접함."}], "english_summary": ["Explores anomalous Hall and Nernst effects in 2D altermagnets.", "Discusses how crystal symmetry dictates the anomalous transport responses.", "Provides a framework for manipulating spin-split states via symmetry-driven mechanisms.", "Connects fundamental symmetry analysis with observable topological transport phenomena."]}}, {"title": "Moiré strain skyrmions in sliding twisted bilayers", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/65kw-1h1l", "authors": "Rong Hu, Yu-Tao Tan, Dapeng Liu, Jie Ren, Yizhou Liu", "last_authors": "Jie Ren, Yizhou Liu", "summary": "the physical properties of solid materials. Among them, strain glass induced by defect engineering provides an important paradigm for nanoscale domain manipulation. Here, we propose purely mechanical moiré strain skyrmions, topologically protected elastic textures whose…", "tier": "B_IMPORTANT_CONDMAT", "score": "7", "reason": "Relevant study on moiré systems, a topic of interest for the user.", "tags": ["moir", "twistedbilayer", "topological"], "image": "", "briefing": {"background": "Moiré 초격자는 비틀림 각도와 격자 변형을 통해 전자 구조를 제어할 수 있는 플랫폼입니다. 여기서 유도되는 위상학적 텍스처는 새로운 양자 현상을 창출하는 원동력이 됩니다.", "motivation": "슬라이딩하는 비틀림 이중층에서 나타나는 물리적 변형(strain)이 어떻게 위상학적 특성을 가지는 'Skyrmion' 형태로 발현되는지 연 wave altermagnets.", "Identification of dual Fano resonance and spin-dependent nodal features.", "Provides framework for interpreting STM/STS data on altermagnetic materials."]}}, {"title": "Signature of field-induced spin relaxation in the paramagnetic regime of the frustrated triangular antiferromagnet NdZnAl11O19", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/3jvc-cng7", "authors": "Manshi Rani, Dheeraj Ranaut, Manh Duc Le, Mohamed Aouane, G. B. G. Stenning, K. Mukherjee", "last_authors": "G. B. G. Stenning, K. Mukherjee", "summary": "This study explores the influence of positional disorder on magnetic behavior, focusing on the presence of orphan spins that are effectively decoupled from the collective spin dynamics. Here, the authors investigate the positional disorder and its impact on crystal electric field (CEF) excitations using inelastic neutron scattering measurements. Interestingly, a field-induced spin relaxation associated with the orphan spins, with an energy barrier corresponding to the CEF gap is revealed through ac susceptibility measurements.", "tier": "B_IMPORTANT_CONDMAT", "score": "7", "reason": "Neutron scattering study on a frustrated magnetic system relevant to quantum magnetism.", "tags": ["neutronscattering", "antiferromagnet", "quantummagnetism"], "image": "", "briefing": {"background": "좌절된 자성체(frustrated magnets)는 기하학적 구조로 인해 스핀이 정렬되지 못하고 양자적 변동성이 큰 상태를 유지합니다. 이런 물질은 양자 스핀 액체 후보군이나 독특한 자기 들뜸 현상을 연구하는 데 핵심적인 시스템입니다.", "motivation": "위치적 무질서가 이러한 좌절된 자성체의 스핀 역학, 특히 결정장(CEF) 들뜸과 고립된 스핀(orphan spins)의 거동에 어떤 영향을 미치는지 규명하고자 합니다.", "result": "비탄성 중성자 산란을 통해 위치적 무질서가 결정장 들뜸에 미치는 영향을 확인했으며, 교류 자기 감수율 측정을 통해 고립된 스핀이 결정장 에너지 간극과 연관된 에너지 장벽을 가진 자기장 유도 스핀 완화 현상을 보임을 발견했습니다.", "implication": "무질서가 존재하는 좌절된 자성체에서 스핀 역학을 이해하는 새로운 경로를 제시하며, 이는 양자 자성체 설계 시 결함 제어의 중요성을 강조합니다.", "novelty": "실제 물질에서 무질서에 의한 'orphan spins'가 외부 자기장에 어떻게 응답하는지를 결정장 물리와 연결하여 실험적으로 증명했습니다.", "unresolved": "무질서의 정확한 분포와 국소적 환경이 고립 스핀의 역학에 미치는 정량적인 상관관계가 명확히 밝혀지지 않았습니다.", "future_work": "고립된 스핀의 분포를 원자 수준에서 관측하거나, 더 낮은 온도에서의 자기 완화 현상에 대한 심층 연구가 필요합니다.", "concepts": [{"term": "좌절된 반강자성체", "why_emerged": "기하학적 제약으로 인해 스핀들이 모두 반평행하게 정렬할 수 없는 구조의 자성체를 이해하기 위해 필요.", "origin": "Anderson에 의한 RVB 이론 제안에서 개념적 기원.", "connections": "양자 스핀 액체, 카고메 격자 물질, 몬테카를로 시뮬레이션."}, {"term": "결정장 들뜸(CEF excitations)", "why_emerged": "결정 구조 내 이온의 에너지가 결정장 분리에 의해 양자화되어 나타나는 특성을 설명하기 위해 필요.", "origin": "Bethe와 Van Vleck의 초기 이론화.", "connections": "중성자 산란, 전이 금속 자성, 희토류 원소 자성."}, {"term": "오펀 스핀(Orphan spins)", "why_emerged": "구조적 무질서로 인해 격자 내에서 다른 스핀들과 상호작용이 단절된 스핀 상태를 구분하기 위해 필요.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "스핀 유리, 격자 결함, 양자 불순물."}], "english_summary": ["Investigated the effect of positional disorder in the frustrated antiferromagnet NdZnAl11O19.", "Used inelastic neutron scattering to analyze crystal electric field (CEF) excitations.", "Identified field-induced spin relaxation associated with orphan spins.", "The relaxation process exhibits an energy barrier corresponding to the CEF gap."]}}, {"title": "Topological transition and superconducting dome in W2C tuned by nitrogen doping", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/ngm6-z5xx", "authors": "Ya-Ping Li, Shu-Xiang Qiao, Mei-Yan Ni, Hong-Yan Lu, Ping Zhang", "last_authors": "Hong-Yan Lu, Ping Zhang", "summary": "an effective strategy for enhancing superconductivity in transition-metal carbides. Orthorhombic ${\\mathrm{W}}_{2}\\mathrm{C}$ has been experimentally synthesized and identified as an intrinsic superconductor. However, the influence of N doping on its superconducting and topolo…", "tier": "B_IMPORTANT_CONDMAT", "score": "7", "reason": "Investigates topological superconductivity in a specific material system.", "tags": ["superconduct", "topological"], "image": "", "briefing": {"background": "전이금속 탄화물(Transition-metal carbides)은 우수한 기계적, 전기적 성질을 가지며, 최근 위상 물성과 결합하여 초전도성을 구현하려는 시도가 활발합니다.", "motivation": "W2C 물질의 초전도성과 위상적 성질을 질소 도핑을 통해 제어하고 최적화할 수 있는지 확인하고자 합니다.", "result": "질소 도핑을 통해 W2C의 초전도 특성을 향상시킬 수 있음을 보였으며, 도핑 농도에 따른 위상적 전이 가능성을 제시했습니다.", "implication": "질소 도핑이 위상 물질의 페르미 준위를 조절하여 초전도성을 강화하는 효과적인 전략임을 시사합니다.", "novelty": "W2C와 같은 탄화물계 물질에서 질소 도핑을 통한 위상 상태와 초전도 돔 제어 가능성을 보여주었습니다.", "unresolved": "도핑된 질소 원자가 정확히 결정 구조의 어디에 위치하며, 그것이 위상 불변량을 구체적으로 어떻게 변환시키는지에 대한 미세한 메커니즘은 부족합니다.", "future_work": "ARPES를 통한 전자 구조 관측과 질소 도핑 농도에 따른 위상 불변량(Z2 등)의 직접적인 검증이 필요합니다.", "concepts": [{"term": "위상적 전이(Topological transition)", "why_emerged": "물질의 밴드 구조가 바뀌며 위상 불변량이 변화하는 현상을 기술하기 위해 필요.", "origin": "Kane과 Mele의 Graphene 연구.", "connections": "위상 절연체, 페르미 준위 조정, 베리 곡률."}, {"term": "초전도 돔(Superconducting dome)", "why_emerged": "물질의 상태 변수(도핑 등)에 따라 초전도 전이 온도가 급격히 변하며 형성되는 영역을 설명하기 위해 필요.", "origin": "고온 초전도체 연구에서 관례적으로 정의.", "connections": "큐프레이트, 철계 초전도체, 강상관 전자계."}], "english_summary": ["Explored nitrogen doping in orthorhombic W2C to enhance superconductivity.", "Demonstrated that N-doping acts as a tuner for superconducting and topological properties.", "Observed the emergence of a superconducting dome upon doping control.", "Suggests a potential route for engineering topological superconductivity in transition-metal carbides."]}}, {"title": "Voltage-tunable Josephson diode at zero applied field", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/gkfb-1kbw", "authors": "Sjoerd Telkamp, Junting Zhao, Saulius Vaitiekėnas", "last_authors": "Junting Zhao, Saulius Vaitiekėnas", "summary": "We report a gate-tunable Josephson diode effect in hybrid nanowire junctions consisting of a spin-orbit-coupled semiconductor core coated with epitaxial ferromagnetic insulator and superconductor shells. The wires display a hysteretic superconducting window as a function of axial magnetic field. In …", "tier": "B_IMPORTANT_CONDMAT", "score": "7", "reason": "Experimental study of hybrid superconducting systems; relevant to topological physics.", "tags": ["superconductivity", "Josephsonjunction", "experiment"], "image": "", "briefing": {"background": "조셉슨 다이오드 효과(Josephson diode effect)는 전류가 한쪽 방향으로는 쉽게 흐르고 반대 방향으로는 저항을 갖는 현상으로, 초전도 소자의 비가역적 제어를 가능하게 합니다.", "motivation": "스핀-궤도 결합 반도체와 강자성체, 초전도체를 결합한 하이브리드 나노와이어 구조에서 외부 자기장 없이 전압 제어만으로 다이오드 특성을 구현하고자 합니다.", "result": "강자성 껍질을 가진 나노와이어 접합에서 외부 자기장 없이도 게이트 전압을 통해 조셉슨 다이오드 효과를 유도할 수 있음을 실험적으로 확인했습니다.", "implication": "자기장 없이 초전도 소자의 정류 작용이 가능해짐에 따라 저전력 위상 양자 컴퓨터와 극저온 소자 설계에 큰 진전이 예상됩니다.", "novelty": "외부 자기장 없이 전압(게이트) 제어만으로 조셉슨 다이오드 효과를 구현했다는 점이 핵심이며, 위상 양자 소자 응용 가능성을 넓혔습니다.", "unresolved": "게이트 전압이 정확히 어떻게 시스템의 반전 대칭성을 깨고 비가역성을 유도하는지, 그 세부적인 정량적 모델링이 보완되어야 합니다.", "future_work": "위상적으로 보호된 마요라나 페르미온과의 결합 연구나, 다이오드 효율의 정량적 최적화 실험이 기대됩니다.", "concepts": [{"term": "조셉슨 다이오드 효과", "why_emerged": "비가역적 초전도 전류를 제어하여 고전적인 다이오드와 유사한 기능을 극저온에서 구현하기 위해 필요.", "origin": "최근 2-3년 내 실험적 관측이 활발해진 분야.", "connections": "반전 대칭성 깨짐, 스핀-궤도 결합, 마요라나 페르미온."}, {"term": "강자성 절연체(Ferromagnetic insulator)", "why_emerged": "반도체에 스핀 편극을 주입하거나 자기적 특성을 부여하기 위해 필요.", "origin": "전형적인 자기 물질 이론.", "connections": "근접 효과, 하이브리드 나노와이어, 스핀트로닉스."}], "english_summary": ["Reported a gate-tunable Josephson diode effect in hybrid nanowire junctions.", "System consists of a spin-orbit-coupled core with epitaxial ferromagnetic and superconducting shells.", "Demonstrated directional supercurrent rectification without external magnetic fields.", "Enables voltage-controlled superconducting circuit elements for potential quantum computing applications."]}}, {"title": "Asymmetric and Scalable Electronic Hysteresis Induced by Ratchet-like Charge Injections in van der Waals Heterostructures", "journal": "PRL_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/vg1s-h4x6", "authors": "Linshang Chen, Rui Mei, Heng Wu, et al.", "last_authors": "Kostya S. Novoselov, Yanmeng Shi", "summary": "in intrinsically nonpolar graphene/hexagonal boron nitride (hBN) heterostructures and widely exploited to realize electr , "score": "7", "reason": "Relevant spectroscopy and magnetic phase transition in a Mott insulator.", "tags": ["magnons", "Mott", "spectroscopy"], "image": "", "briefing": {"background": "모트 절연체(Mott insulator)는 전자 간 강한 상관관계로 인해 나타나는 독특한 자기적 위상을 가지고 있으며, 이를 외부 변형(strain)으로 제어하는 것은 양자 물질의 물성 조절 연구에서 중요한 주제입니다.", "motivation": "단축 변형(uniaxial strain)을 통해 Ca2RuO4 모트 절연체의 테라헤르츠 마그논을 정밀하게 제어하고, 자기 상전이 근처에서 나타나는 물성 변화를 이해하고자 합니다.", "result": "변형에 의해 유도되는 두 반강자성 상태 사이의 상전이를 발견했으며, 이는 층간 교환 상호작용의 부호 변화와 관련이 있음을 밝혀냈습니다.", "implication": "자기 상전이 인근에서의 극단적인 변형 민감도를 활용하여 새로운 유형의 테라헤르츠 마그논 소자(transition-edge magnonic device) 개발 가능성을 제시합니다.", "novelty": "Ru 원자가의 스핀-궤도 성분 해석을 통해 마그논 에너지의 변화 원인을 미시적으로 규명한 점이 돋보이며, 이는 스핀-궤도 결합 물질 연구에 직접적인 통찰을 제공합니다.", "unresolved": "완벽하게 제어된 미세 변형을 실제 소자 규모에서 안정적으로 장기 유지할 수 있는지 여부가 남아있습니다.", "future_work": "다양한 전이금속 산화물에서 변형-자기성 결합의 일반적인 규칙을 도출하고, 고성능 마그논 소자 프로토타입 구현 연구가 필요합니다.", "concepts": [{"term": "모트 절연체", "why_emerged": "강한 전자 상관관계 때문에 밴드 이론으로는 설명되지 않는 절연체 상태를 설명하기 위해 필요함.", "origin": "Nevill Mott (1949).", "connections": "고온 초전도체, 강상관 전자계, 스핀 액체."}, {"term": "테라헤르츠 마그논", "why_emerged": "자기 모멘트의 집단적 들뜸 현상으로, 테라헤르츠 대역의 스핀 파동을 통해 신호를 전달할 수 있음.", "origin": "Bloch (1930) 등에 의해 이론화됨.", "connections": "비탄성 중성자 산란, 라만 산란, 스핀트로닉스."}], "english_summary": ["Investigated strain modulation of THz magnons in the Mott insulator Ca2RuO4.", "Identified a strain-induced phase transition involving a sign change in interlayer exchange coupling.", "Linked magnon energy shifts to the spin-orbital composition of Ru valence electrons.", "Demonstrates high sensitivity for potential transition-edge magnonic device applications."]}}, {"title": "Canted antiferromagnetism and spin-flop transition in honeycomb -Na2PrO3 revealed by angle-dependent torque magnetometry up to 35 T", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2611.25291", "authors": "Kylie MacFarquharson, Ryutaro Okuma, Matthew Pearce, et al.", "last_authors": "Yurii Skourski, Radu Coldea", "summary": "We report angle-dependent piezocantilever torque measurements on untwinned single crystals of the honeycomb magnet α \\alpha - Na 2 ​ PrO 3 \\text{Na}{\\vphantom{\\text{X}}}_{\\smash[t]{\\text{2}}}\\text{PrO}{\\vphantom{\\text{X}}}_{\\smash[t]{\\text{3}}} , proposed as a candidate to display unconventional magnetic behavior stabilized by anisotropic exchange interactions between spin-orbit entangled, effective pseudospin 1/2 Pr 4+ magnetic moments. Previous powder susceptibility measurements observed signatures of a transition at low temperatures to antiferromagnetic order with a weak ferromagnetic moment. From the torque angular dependence in three orthogonal crystallographic planes we infer a zero-field canted antiferromagnetic structure, with the magnetic moments almost normal to the honeycomb layers, but weakly canted such as to give rise to a spontaneous ferromagnetic moment along the in-plane monoclinic a a -axis, with two magnetic domains related by time reversal. Sharp jumps in the angular dependence of the torque when the field projection along the a a -axis changes sign are interpreted as field-induced switching between the two degenerate magnetic domains with oppositely aligned ferromagnetic moments. We propose a minimal spin Hamiltonian including easy-axis exchange anisotropy and symmetry-allowed Dzyaloshinskii-Moriya (DM) couplings, for which a mean-field calculation reproduces the main features of the observed angle-dependent torque. Torque measurements in fields up to 35 T applied almost normal to the layers observe a strong anomaly, which we attribute to proximity to the field-induced spin-flop transition predicted for the above Hamiltonian. We contrast the predicted magnetic phase diagrams for magnetic fields in different orthogonal crystallographic planes normal to the honeycomb layers and discuss how DM interactions convert some transitions into smooth crossovers and stabilize a phase boundary line connecting the spin- n stabilizing the magnetic phase diagram."]}}, {"title": "Circuit model for gate-induced excitation of quantum Hall edges tuned by DC gate bias", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2611.25332", "authors": "Kodai Sugizaki, Takaaki Mano, Go Yusa", "last_authors": "Takaaki Mano, Go Yusa", "summary": "Edge excitations, which propagate along the edge of a quantum Hall system, are of great interest in the study of low-dimensional electron systems and mesoscopic transport phenomena. In this study, we investigate the relationship between the input voltage and the excitation waveform for gate-induced excitations. By varying the offset voltage applied to the gate, we observe that the excitation waveform changes from a first-derivative-like response to a response proportional to the input waveform in the time domain. In the frequency domain, we observe that the frequency dependence of the gate excitation changes significantly as the offset voltage crosses the pinch-off voltage. We show that these changes can be described by a single equivalent circuit model with different effective gate-2DEG capacitances on either side of the pinch-off voltage. In addition, we confirm that the effective capacitance obtained from the fitting of the model with the experimental data is consistent with the capacitance calculated from the device structure.", "tier": "B_IMPORTANT_CONDMAT", "score": "7", "reason": "Experimental study of quantum Hall edge excitations; relevant to topological/transport interests.", "tags": ["quantumHall", "transport"], "image": "https://arxiv.org/html/2611.25332v1/fig2.png", "briefing": {"background": "양자 홀 효과(Quantum Hall Effect) 시스템에서는 샘플 가장자리를 따라 흐르는 1차원적인 '엣지 상태(edge state)'가 존재하며, 이는 위상학적으로 보호되어 에너지 손실 없는 전하 전달을 가능하게 합니다. 이러한 엣지 모드를 정밀하게 제어하는 것은 메조스코픽 물리 및 양자 정보 소자 구현의 핵심 과제입니다.", "motivation": "게이트 전압을 통해 양자 홀 엣지 상태에 여기(excitation)를 유도할 때, 인가된 전압 파형과 실제 엣지에서 발생하는 여기 파형 사이의 관계를 규명하고자 했습니다.", "result": "게이트 오프셋 전압에 따라 여기 tomically sharp interfaces remain unclear. In this work, we investigated PTCDA-MoS2 as a prototypical 2D organic-inorganic heterostructure and revealed dual-mode exciton coupling between the constituent crystals. Monolayer-resolved PTCDA molecular crystals were grown on monolayer MoS2 via physical vapor assembly, and their crystallographic details, including the stacking angle, were determined by electron diffraction. Upon the formation of the heterostructures, PTCDA's photoluminescence was completely quenched because of organic-to-inorganic hole transfer, whereas that of MoS2 increased markedly with PTCDA thickness. Using differential reflectance and photoluminescence excitation spectroscopy, we found that the enhancement arises from two distinct mechanisms. Ground-state charge transfer injects holes into MoS2, which suppresses negative trion formation and enhances the radiative recombination of neutral excitons. In addition, resonant energy transfer, enabled by spectral overlap between PTCDA and MoS2, diverts excitation energy from PTCDA to MoS2. Our findings reconcile previously proposed mechanisms and establish a unified framework in which charge and energy transfer cooperate to govern exciton coupling at organic-inorganic interfaces.", "tier": "B_IMPORTANT_CONDMAT", "score": "7", "reason": "Relevant experimental study on 2D heterostructures and interlayer exciton dynamics.", "tags": ["experiment", "2Dmaterials", "heterostructure"], "image": "https://arxiv.org/static/browse/0.3.4/images/arxiv-logo-fb.png", "briefing": {"background": "2D 반도체(MoS2)와 유기 분자 결정(PTCDA)을 결합한 이종접합(heterostructure) 시스템은 엑시톤(exciton)의 에너지 및 전하 전달을 조절할 수 있는 유연한 플랫폼으로 주목받고 있습니다.", "motivation": "유기물과 무기물 계면에서 발생하는 복합적인 에너지 및 전하 이동 과정을 명확히 이해하고 이를 통합된 메커니즘으로 설명하고자 했습니다.", "result": "PTCDA-MoS2 이종접합에서 유기물에서 무기물로의 정공 전달(hole transfer)과 공명 에너지 전달(resonant energy transfer)이라는 두 가지 핵심 기작을 밝혀냈습니다.", "implication": "정공 주입이 트라이온(trion) 형성을 억제하여 MoS2의 광발광을 증폭시키는 원리를 규명함으로써, 향후 고효율 2D 광전소자 설계의 가이드라인을  simultaneous strong- and weak-bond scaling, these branches become the gap-closing conditions at momenta 0 0 and π \\pi of the transverse-field Ising chain obtained from the row transfer matrix. On the topological side, the classical decay length tends to the localization length of a Majorana end mode of the Jordan–Wigner fermion chain. We also prove that the regular strong-bond Yang–Baxter family cannot be continued to the finite-coupling interior within the fixed-basis ansatz with one vanishing bond direction.", "tier": "B_IMPORTANT_CONDMAT", "score": "7", "reason": "Kagome lattice study with topological/Majorana implications, tangentially relevant to current interests.", "tags": ["kagome", "topological", "Majorana"], "image": "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAsAAAAOCAYAAAD5YeaVAAAAAXNSR0IArs4c6QAAAAZiS0dEAP8A/wD/oL2nkwAAAAlwSFlzAAALEwAACxMBAJqcGAAAAAd0SU1FB9wKExQZLWTEaOUAAAAddEVYdENvbW1lbnQAQ3JlYXRlZCB3aXRoIFRoZSBHSU1Q72QlbgAAAdpJREFUKM9tkL+L2nAARz9fPZNCKFapUn8kyI0e4iRHSR1Kb8ng0lJw6FYHFwv2LwhOpcWxTjeUunYqOmqd6hEoRDhtDWdA8ApRYsSUCDHNt5ul13vz4w0vWCgUnnEc975arX6ORqN3VqtVZbfbTQC4uEHANM3jSqXymFI6yWazP2KxWAXAL9zCUa1Wy2tXVxheKA9YNoR8Pt+aTqe4FVVVvz05O6MBhqUIBGk8Hn8HAOVy+T+XLJfLS4ZhTiRJgqIoVBRFIoric47jPnmeB1mW/9rr9ZpSSn3Lsmir1fJZlqWlUonKsvwWwD8ymc/nXwVBeLjf7xEKhdBut9Hr9WgmkyGEkJwsy5eHG5vN5g0AKIoCAEgkEkin0wQAfN9/cXPdheu6P33fBwB4ngcAcByHJpPJl+fn54mD3Gg0NrquXxeLRQAAwzAYj8cwTZPwPH9/sVg8PXweDAauqqr2cDjEer1GJBLBZDJBs9mE4zjwfZ85lAGg2+06hmGgXq+j3+/DsixYlgVN03a9Xu8jgCNCyIegIAgx13Vfd7vdu+FweG8YRkjXdWy329+dTgeSJD3ieZ7RNO0VAXAPwDEAO5VKndi2fWrb9jWl9Esul6PZbDY9Go1OZ7PZ9z/lyuD3OozU2wAAAABJRU5ErkJggg==", "briefing": {"background": "가고메(Kagome) 격자 시스템은 기하학적 좌절(frustration)과 위상학적 특성으로 인해 강한 상관관계 및 양자 자성 연구의 핵심 플랫폼입니다. 특히 이징 모델과의 결합은 통계 역학적 상전이 및 준입자 거동을 해석하는 중요한 이론적 틀을 제공합니다.", "motivation": "이 연구는 부호 교차(sign-alternating) 가고메 이징 모델에서 페르미온의 붕괴 길이(decay length)를 정확하게 계산하여 위상학적 특성과 마요라나 모드 간의 연관성을 명확히 하고자 합니다.", "result": "특정 횡운동량 p=π/2 지점에서 페르미온 붕괴 길이에 대한 엄밀한 해석적 해를 도출했습니다. 특히 고전적 모델의 붕괴 길이가 Jordan-Wigner 페르미온 체인의 마요라나 말단 모드(Majorana end mode)의 국소화 길이와 일치함을 보였습니다.", "implication": "이론적으로 이징 모델의 상전이와 위상학적 양자 현상을 연결하는 가교를 제공하며, 가고메 금속과 같은 실제 물질 시스템에서 마요라나 물리 연구의 이론적 기반을 강화합니다.", "novelty": "가고메 격자 내의 위상학적 상태를 정확한 해석적 수식으로 유도했다는 점이 독창적입니다. 본인의 관심사인 가고메 금속에서의 위상 모드 이해에 추상적이지만 수학적 엄밀함을 제공합니다.", "unresolved": "이 연구는 이론적 모델에 집중되어 있으며, 실제 가고메 금속 시스템에서 발생하는 비평형 상태나 복잡한 전자-전자 상호작용은 고려되지 않았습니다.", "future_work": "도출된 수식을 바탕으로 실제 가고메 격자를 가진 물질에서 횡운동량에 따른 준입자 여기 특성을 검증하는 연구가 필요합니다.", "concepts": [{"term": "마요라나 제로 모드", "why_emerged": "입자와 반입자가 동일한 성질을 갖는 페르미온적 준입자로서 위상학적 양자 컴퓨팅 구현을 위해 제안되었습니다.", "origin": "Ettore Majorana가 1937년 처음 제안하였으며, 고체 물리학에서는 Kitaev 체인 모델 등을 통해 구현 가능성이 입증되었습니다.", "connections": "위상 절연체, 초전도체, Jordan-Wigner 변환과 밀접하게 연결됩니다."}, {"term": "가고메 이징 모델", "why_emerged": "기하학적 구조에서 발생하는 스핀의 좌절 현상과 통계적 물성을 이해하기 위해 고안되었습니다.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "통계 역학, 위상학적 상전이 연구의 표준 모델로 사용됩니다."}], "english_summary": ["Exact derivation of fermionic decay length in the sign-alternating kagome Ising model.", "Identifies connection between classical decay length and Majorana end mode localization.", "Shows divergence at critical points matching transverse-field Ising chain gap closing.", "Proves impossibility of extending certain Yang-Baxter families under restricted ansatz."]}}, {"title": "Field-free deterministic spin-orbit torque magnetization switching using monolayer WTe2", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2611.25755", "authors": "Ganesh Hanchanahal, Arnav Jain, Shrushti Tapar, Saroj P Dash, Bhaskaran Muralidharan", "last_authors": "Saroj P Dash, Bhaskaran Muralidharan", "summary": "An important step towards the practical implementation of spin-orbit torque magnetic memory is the field-free switching of the magnetization vector. In this work, we investigate spin-orbit torque-driven magnetization dynamics and switching devices comprising monolayer $\\mathrm{WTe}_2$ as the spin-source material. We perform a comparative analysis of the two phases of $\\mathrm{WTe}_2$, namely the $1\\mathrm{T}_d$ and $1\\mathrm{T}'$ with the necessary symmetries for field-free deterministic magnetization switching. We demonstrate switching in both systems and analyse the dependence of the switching dynamics on the applied bias voltage, ribbon orientation and width of the magnetic layer. Modelling the ferromagnet as an exchange-coupled macrospin within a non-equilibrium Green's function framework, we find that the $x$-ribbon geometry of the $1\\mathrm{T}_d$ $\\mathrm{WTe}_2$ phase generates a significantly larger current-induced spin polarization than the $1\\mathrm{T}'$ phase, resulting in a larger damping-like torque on the adjacent magnetic layer and faster switching. The switching time of $1\\mathrm{T}'$ devices varies strongly and non-monotonically with the width of the magnetic layer. In $1\\mathrm{T}_d$ devices, it remains nearly constant over a broad range of widths, consistent with an edge-dominated torque. These results identify $x$-ribbon $1\\mathrm{T}_d$-$\\mathrm{WTe}_2$ as a promising spin source for field-free SOT-MRAM.", "tier": "B_IMPORTANT_CONDMAT", "score": "7", "reason": "Investigation of WTe2 for spin-orbit torque; relevant to topological semimetals and thin films.", "tags": ["monolayer", "WTe2", "spintronics"], "image": "https://arxiv.org/html/2611.25755v1/final_Figure_1.png", "briefing": {"background": "차세대 스핀트로닉스 메모리(SOT-MRAM)는 외부 자기장 없이 전류만으로 자성체의 스위칭을 수행해야 하는데, 이를 위해서는 고효율 스핀 소스 물질이 필수적입니다.", "motivation": "위상학적 성질을 갖는 WTe2 단층막이 뛰어난 스핀-궤도 토크(SOT)를 제공할 수 있는지, 그리고 두 가지 결정상(1Td vs 1T') 중 무엇이 더 우수한지 비교 분석하고자 합니다.", "result": "1Td-WTe2의 x-리본 구조가 1T'상보다 더 강한 스핀 편극과 감쇠형 토크(damping-like torque)를 유도하여 훨씬 빠른 결정적 스위칭이 가능함을 규명했습니다.", "implication": "WTe2를 활용한 전력 효율적인 필드 프리(field-free) SOT-MRAM 소자 제작을 위한 구체적인 구조적 가이드라인을 제시합니다.", "novelty": "단순 위상 특성 연구를 넘어 WTe2의 결정상에 따른 스핀 토크 효율의 차이를 계산하여, 실제 소자 구현 가능성을 제시한 점이 핵심입니다.", "unresolved": "실제 실험적 소자에서의 계면 tanton methods, that this hybridization can drive the transition first order, with the metastable phase decaying at an exponentially small rate. We propose an array of Josephson-coupled $p+ip$ superconducting islands as a microscopic platform realizing the required hierarchy of scales. Finally, we discuss experimental signatures of this first-order transition, in particular a hysteresis loop whose width is set by the coexistence window.", "tier": "B_IMPORTANT_CONDMAT", "score": "7", "reason": "Study of Majorana-mediated interactions in 2D topological superconductors with potential experimental platform proposal.", "tags": ["topological-superconductivity", "Majorana", "vortices"], "image": "https://arxiv.org/html/2611.25018v1/panel_a.png", "briefing": {"background": "2차원 위상 초전도체에서 자기장 하의 소용돌이(vortex)는 마요라나 모드를 가질 수 있는데, 이 소용돌이들이 어떻게 결합하고 분리되는지가 초전도 전이 현상을 결정합니다.", "motivation": "마요라나 모드가 존재하는 소용돌이들 사이에 추가적인 인력(attractive channel)이 작용할 때, 기존의 BKT 상전이 기전이 어떻게 변하는지 탐구합니다.", "result": "마요라나 결합으로 인한 인력이 기존의 BKT 전이를 1차 상전이(first order transition)로 바꿀 수 있음을 밝히고, 이 상태에서의 이력 현상(hysteresis)을 예측했습니다.", "implication": "마요라나 모드의 존재를 소용돌이의 집단적 동역학, 특히 상전이 특성을 통해 간접적으로 실험 증명할 수 있는 새로운 경로를 제공합니다.", "novelty": "위상학적 초전도체 내 마요라나 결합이 열역학적 상전이의 차수(order)를 바꿀 수 있다는 통찰은 실험 물리학자들에게 새로운 관측 지표를 제공합니다.", "unresolved": "이론적 모델에서 가정한 Josephson 결합 배열의 제작 정확도와 마요라나 결합의 세기가 다른 교란 요인을 압도할 수 있는지 확인이 필요합니다.", "future_work": "조셉슨 결합 p+ip 초전도체 섬 배열을 이용한 실험적 전도도 측정을 통해 1차 상전이의 흔적인 히스테리시스를 확인해야 합니다.", "concepts": [{"term": "BKT 상전이", "why_emerged": "2차원 시스템에서 소용돌이-반소용돌이 쌍의 결합/분리를 통해 상전이가 일어남을 설명하기 위해 도입되었습니다.", "origin": "Berezinskii(1971), Kosterlitz와 Thouless(1973)가 독립적으로 제안하였습니다.", "connections": "2차원 초전도체, 초유체, XY 모델과 연결됩니다."}, {"term": "p+ip 초전도체", "why_emerged": "시간 반전 대칭성이 깨진 위상 초전도 상태를 구현하기 위한 모델로, 마요라나 모드를 가집니다.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "위상학적 양자 계산, 양자 홀 효과와 관련됩니다."}], "english_summary": ["Investigates the impact of Majorana-mediated vortex interaction on the BKT transition.", "Shows that Majorana hybridization can drive the transition to first-order.", "Predicts hysteresis signatures for experimental verification.", "Proposes an array of Josephson-coupled p+ip islands as a realization platform."]}}, {"title": "Fractional Charge at Dislocations from Band-Inversion Cancellation", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2611.26616", "authors": "Vladimir Juri\\v{c}i\\'c, Rodrigo Soto-Garrido", "last_authors": "Vladimir Juri\\v{c}i\\'c, Rodrigo Soto-Garrido", "summary": "Band inversions with opposite Chern numbers cancel in the Hall response and yield counterpropagating boundary modes that can gap out. However, a bulk probe of the topology that survives such a cancellation is lacking. We here show that dislocations in inversion-symmetric two-band crystals with cancelling band inversions bind a half-integer charge, which reveals the quantized bulk polarization of the bond-centered obstructed atomic limit realized by such crystals. To demonstrate this, we continuously deform a broad class of two-band lattice models into decoupled chains, without closing the bulk gap or breaking the inversion symmetry, where the dislocation charge follows from a count of occupied bonds. Notably, the fractional part of this charge is insensitive to local perturbations of the dislocation core, and it therefore persists after the in-gap core state is removed, as we show analytically in the chain limit and numerically away from it. In the Weyl-semimetal counterpart, the response to a magnetic flux separates this crystalline charge from the charge set by the Chern number of each momentum slice. We propose that a half-integer core charge that persists after the in-gap peak disappears from the local spectrum can be detected in artificial electronic and optical lattices, with metamaterials providing complementary access to the core modes.", "tier": "B_IMPORTANT_CONDMAT", "score": "7", "reason": "Topological semimetal and crystal defect analysis relevant to electronic structure/Weyl materials.", "tags": ["Weyl", "Chern", "topological"], "image": "https://arxiv.org/html/2611.26616v1/response_overview.png", "briefing": {"background": "위상 절연체나 위상 반금속에서 대역 반전(band inversion)은 위상적 특성을 결정짓는 핵심 요소입니다. 일반적으로 반대되는 천 수(Chern number)를 가진 대역 반전들은 서로 상쇄되어 물리적 응답을 보이지 않는 것처럼 보이지만, 결정 구조의 결함(dislocation) 등에서는 숨겨진 위상적 정보가 드러날 수 있습니다.", "motivation": "상쇄된 대역 반전이 존재하는 결정에서 벌크의 위상적 성질을 탐지할 수 있는 명확한 방법론이 부족했기에, 결정 결함인 전위(dislocation)가 이러한 위상적 특성을 어떻게 반영하는지 분석하고자 했습니다.", "result": "반전 대칭성을 가진 2-대역 모델에서 전위가 반정수(half-integer) 전하를 띠게 됨을 입증했습니다. 이는 해당 결정이 'obstructed atomic limit'이라는 특정 위상 상태에 있음을 나타내며, 전위 코어의 국소적 섭동에도 불구하고 이 전하가 사라지지 않고 유지됨을 보였습니다.", "implication": "이 결과는 결정의 전위를 이용해 그동안 감지하기 어려웠던 벌크의 위상적 분극을 직접 관측할 수 있는 경로를 제시합니다.", "novelty": "웨일 반금속 연구 등에서 결정 결함이 위상적 특성 탐지에 중요한 도구가 될 수 있음을 보여주며, 특히 전위 코어의 모드와 상관없이 위상적으로 보호된 전하가 존재한다는 점이 전자 구조 연구에 시사하는 바가 큽니다.", "unresolved": "실제 물질의 복잡한 전자 구조에서 이 효과를 실험적으로 명확히 분리해내는 방법은 여전히 과제로 남아 있습니다.", "future_work": "메타물질이나 인공 전자 격자 시스템에서의 실험적 검증이 기대됩니다.", "concepts": [{"term": "대역 반전 상쇄(Band-inversion cancellation)", "why_emerged": "위상적으로 자명하지 않은(non-trivial) 여러 대역이 공존할 때 전체적인 위상 성질을 이해하기 위해 필요함.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "위상 절연체, 웨일 반금속의 위상 불변량 분석."}, {"term": "전위(Dislocation)", "why_emerged": "결정 격자의 주기성을 깨뜨리는 결함으로, 국소적인 위상 모드 형성을 유도하는 원인이 됨.", "origin": "Vito Volterra(1907).", "connections": "결정 내 위상 결함, 위상적 전하(Topological charge)."}, {"term": "Obstructed atomic limit", "why_emerged": "원자 위치와 밴드 구조의 대칭성 사이의 위상적 관계를 기술하기 위해 도입됨.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "위상 결정 절연체(Topological Crystalline Insulator)."}], "english_summary": ["Analyzed fractional charge trapping at dislocations in crystals with cancelling band inversions.", "Demonstrated that half-integer charge is a topological indicator of the obstructed atomic limit.", "Showed that this charge is robust against local core perturbations.", "Proposed that artificial electronic or optical lattices can probe this topological bulk signature."]}}, {"title": "Gauge invariance, collective modes, and the justification of normal-state subtraction in Dirac superconductors (J. Phys. Soc. Jpn.)", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2608.28485", "authors": "Hiroshi Hayasaka", "last_authors": "Hiroshi Hayasaka", "summary": "In Dirac superconductors, the unbounded spectrum of low-energy Dirac models is known to give rise to unphysical interband contributions from deep-lying states to the electromagnetic response. To eliminate these contributions, normal-state subtraction (NSS), in which the normal-state response is subtracted from the superconducting-state response, has been widely employed. However, the relation between NSS and a gauge-invariant electromagnetic response, particularly the role of the vertex correction required by the Ward identity, has remained unclear. In this work, we consider a massive-Dirac model with $s$-wave pairing and analytically investigate the electromagnetic response at zero temperature by solving the Bethe--Salpeter equation and incorporating the collective-mode contribution to the electromagnetic vertex. We show that, in the static long-wavelength limit, the vertex correction exactly cancels the bare longitudinal response with NSS, yielding the vanishing longitudinal response required by gauge invariance. In contrast, the transverse component of the vertex correction vanishes in the long-wavelength limit, so that the gauge-invariant Meissner weight coincides with that obtained from the bare transverse response with NSS. Moreover, within the class of isotropic and analytic UV regularization terms, we show that gauge invariance uniquely fixes the regularization term in the static long-wavelength limit to the value prescribed by NSS. Our results thus provide a microscopic justification for NSS.", "tier": "B_IMPORTANT_CONDMAT", "score": "7", "reason": "Relevant theoretical disc
