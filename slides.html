<!DOCTYPE html>

<head>
<meta charset='UTF-8'>
<meta name='viewport' content='width=device-width, initial-scale=1.0'>
<title>Daily Paper Slideshow</title>
<style>
  :root {
    color-scheme: light;
    --bg: #f6f7f4;
    --paper: #ffffff;
    --ink: #111827;
    --muted: #64748b;
    --line: #d8ddd2;
    --accent: #176b87;
    --accent-2: #9a3412;
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; overflow: auto; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: var(--bg); color: var(--ink); }
  .shell { max-width: 1500px; min-height: 100vh; margin: 0 auto; padding: 14px 18px; display: flex; flex-direction: column; }
  .topbar { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 16px; }
  .top-actions { display: flex; align-items: center; gap: 10px; }
  .topbar a, button { border: 1px solid var(--line); border-radius: 8px; background: var(--paper); color: var(--ink); padding: 10px 14px; font-weight: 700; text-decoration: none; cursor: pointer; }
  button.primary { background: var(--accent); border-color: var(--accent); color: white; }
  button:disabled { opacity: 0.45; cursor: not-allowed; }
  .counter { color: var(--muted); font-weight: 700; }
  .slide { min-height: calc(100vh - 82px); background: var(--paper); border: 1px solid var(--line); border-radius: 10px; padding: 18px; box-shadow: 0 18px 42px rgba(15, 23, 42, 0.10); display: grid; grid-template-columns: minmax(310px, 0.86fr) minmax(0, 1.55fr); gap: 18px; overflow: visible; }
  .paper-head { min-width: 0; min-height: 0; overflow: visible; display: flex; flex-direction: column; gap: 12px; }
  .figure { margin: 0; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: #f8fafc; }
  .figure img { display: block; width: 100%; max-height: 41vh; object-fit: contain; background: white; }
  .figure figcaption { padding: 7px 10px; color: var(--muted); font-size: 12px; line-height: 1.3; }
  .head-text { display: flex; flex-direction: column; gap: 9px; min-width: 0; }
  .badges { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .badge { border-radius: 999px; padding: 5px 9px; background: #eef2ff; color: #3730a3; font-size: 12px; font-weight: 800; }
  .score { background: #fee2e2; color: #991b1b; }
  h1 { margin: 0; font-size: 25px; line-height: 1.15; letter-spacing: 0; overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
  h1 a { color: inherit; text-decoration-color: rgba(23, 107, 135, 0.35); text-decoration-thickness: 2px; text-underline-offset: 4px; }
  h1 a:hover { color: var(--accent); text-decoration-color: var(--accent); }
  .meta, .authors, .why, .abstract { font-size: 13px; line-height: 1.45; }
  .meta, .authors { color: var(--muted); }
  .why strong, .abstract strong, .authors strong { color: var(--ink); }
  .authors { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .why { border-left: 4px solid var(--accent-2); padding-left: 10px; color: #374151; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .abstract { border-top: 1px solid var(--line); padding-top: 14px; color: #374151; }
  .original-abstract { border-top: 1px solid var(--line); padding-top: 10px; color: #374151; font-size: 11.5px; line-height: 1.35; overflow-wrap: anywhere; }
  .original-abstract strong { display: block; margin-bottom: 4px; color: var(--ink); }
  .tags { display: flex; flex-wrap: wrap; gap: 8px; }
  .tag { border-radius: 999px; padding: 4px 8px; background: #f1f5f9; color: #475569; font-size: 12px; font-weight: 700; }
  .head-text > .link { display: none; }
  .briefing { min-width: 0; min-height: 0; overflow: visible; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); grid-auto-rows: minmax(0, auto); align-content: start; gap: 11px 18px; border-top: 0; padding-top: 0; }
  .brief-section { min-width: 0; }
  .brief-section.wide { grid-column: 1 / -1; }
  .brief-section h2 { margin: 0 0 4px; font-size: 14px; line-height: 1.22; color: #0f766e; letter-spacing: 0; }
  .brief-section p, .brief-section li { margin: 0; font-size: 12.5px; line-height: 1.42; color: #1f2937; overflow-wrap: anywhere; }
  .brief-section ul { margin: 0; padding-left: 20px; }
  .concepts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 9px 14px; }
  .concept { border-top: 1px solid var(--line); padding-top: 7px; }
  .concept h3 { margin: 0 0 4px; font-size: 13px; color: #7c2d12; letter-spacing: 0; }
  .concept p { margin: 2px 0 0; font-size: 11.5px; line-height: 1.35; color: #374151; overflow-wrap: anywhere; }
  .concept b { color: #111827; }
  .link { color: var(--accent); font-weight: 800; text-decoration: none; }
  .empty { padding: 48px; background: var(--paper); border: 1px solid var(--line); border-radius: 12px; color: var(--muted); }
  @media (max-width: 860px) {
    .shell { padding: 14px; }
    .topbar, .top-actions { align-items: stretch; flex-direction: column; }
    .slide, .briefing, .concepts { grid-template-columns: 1fr; }
    .slide { min-height: auto; overflow: visible; display: grid; }
    h1 { font-size: 28px; }
  }
</style>

<script>
const slides = [{"title": "Disentangling bulk and surface electronic structure using targeted cleave planes in RuO2", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/sjrs-3fjz", "authors": "Maria H. Visscher, Sebastian Buchberger, Bruno Saika, et al.", "last_authors": "Andrew P. Mackenzie, Phil D. C. King", "summary": "Using focused ion beam designed cleaving planes, the authors prepare different surface orientations of RuO 2 for study by angle-resolved photoemission spectroscopy. The high-resolution measurements this enables from two distinct surfaces, combined with electronic structure calculations, make it possible to better distinguish bulk versus surface states. In fact, they reveal that the ARPES spectra are largely dominated by surface, rather than bulk, states, and reveal how these are strongly impacted by spin-orbit coupling, surface stoichiometry, and structure.", "tier": "A_MUST_READ", "score": "10", "reason": "Direct ARPES study of the electronic structure of the important altermagnet candidate RuO2.", "tags": ["ARPES", "RuO2", "altermagnetism"], "image": "", "briefing": {"background": "RuO2는 최근 알터마그네틱(altermagnetism) 후보 물질로 큰 주목을 받고 있습니다. 알터마그네틱은 스핀 정렬과 대칭성으로 인해 강자성과 반강자성의 특성을 동시에 가지며, ARPES와 같은 실험 기법으로 전자 구조를 검증하는 것이 물질의 물리적 성질을 이해하는 데 필수적입니다.", "motivation": "RuO2와 같은 복잡한 산화물에서 ARPES 측정 시 벌크 상태와 표면 상태가 섞여 데이터를 해석하는 데 어려움이 있습니다. 본 연구는 정밀하게 제어된 cleave plane을 사용하여 표면 기여도를 명확히 구분하고자 했습니다.", "result": "FIB를 이용한 타겟팅 클리빙을 통해 서로 다른 방향의 표면을 측정했습니다. 결과적으로 측정된 ARPES 신호 상당수가 벌크가 아닌 표면 상태에 의해 지배되며, 이 상태들이 스핀-궤도 결합(SOC)과 표면 화학량론에 크게 의존함을 확인했습니다.", "implication": "알터마그네틱 현상 연구 시 표면 상태가 데이터를 왜곡할 수 있음을 경고합니다. 향후 RuO2의 벌크 특성을 논할 때는 표면 효과를 엄격히 배제하거나 보정한 해석이 필요합니다.", "novelty": "FIB 기반의 정교한 표면 준비 기법을 통해 논란이 많았던 RuO2의 ARPES 데이터 해석 기준을 제시한 점이 핵심입니다. 독자의 ARPES 분석 능력에 직접적인 방법론적 통찰을 제공합니다.", "unresolved": "표면 상태가 너무 강해 벌크 고유의 알터마그네틱 밴드 분리를 완전히 실험적으로 검증하기에는 한계가 여전히 존재합니다.", "future_work": "표면 효과를 최소화할 수 있는 추가적인 시편 처리 기술 개발 및 박막 샘플을 통한 벌크 전자 구조 직접 관측이 요구됩니다.", "concepts": [{"term": "Altermagnetism", "why_emerged": "기존의 강자성/반강자성 범주로 분류되지 않는 새로운 자기 질서 구현을 위해 필요.", "origin": "최근 2-3년 내 이론적으로 정립됨 (예: Šmejkal et al.)", "connections": "스핀-궤도 결합, 비자성 금속 내 스핀 분할."}, {"term": "FIB-based cleaving", "why_emerged": "특정 결정 방향에서만 나타나는 표면 상태를 선택적으로 연구하기 위해.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "ARPES 표면 감도 제어, 결정면 선택적 전자 구조 분석."}], "english_summary": ["Targeted cleaving using FIB reveals dominant surface states in RuO2 ARPES spectra.", "The study disentangles surface vs bulk contributions in an altermagnet candidate.", "Results highlight the crucial impact of surface stoichiometry and SOC on electronic structure measurements."]}}, {"title": "Electronic structure of LuNb6Sn6 probed by high-field torque magnetometry up to 41 T and first-principles calculations", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/3w55-ywgg", "authors": "Tucker Beekmann, Kyryl Shtefiienko, Brenden R. Ortiz, Jiaqiang Yan, David E. Graf, Keshav Shrestha", "last_authors": "David E. Graf, Keshav Shrestha", "summary": "We report the electronic structure of the kagome compound ${\\mathrm{LuNb}}_{6}{\\mathrm{Sn}}_{6}$ using high-field torque magnetometry and first-principles calculations. This compound hosts a kagome lattice of Nb atoms and undergoes a charge density wave (CDW) transition below 70 K, accompanied by th…", "tier": "A_MUST_READ", "score": "10", "reason": "Direct hit on kagome electronic structure, Nb-based kagome lattices, and CDW transitions.", "tags": ["material", "kagome", "electronicstructure", "CDW"], "image": "", "briefing": {"background": "Kagome 격자 구조의 금속들은 위상적 전자 구조와 전하 밀도 파동(CDW)이 공존하며 강한 상관관계를 보입니다. 특히 AV3Sb5 계열 이외의 새로운 Nb 기반 Kagome 시스템 연구는 이 현상의 보편성을 검증하는 데 중요합니다.", "motivation": "LuNb6Sn6 화합물에서 나타나는 CDW 전이의 기원과 해당 물질의 페르미 표면 특성을 고자기장 환경에서 체계적으로 분석하고자 했습니다.", "result": "고자기장 토크 자기 측정(torque magnetometry)을 통해 페르미 표면의 진동(Quantum oscillations)을 관측하였으며, 이를 DFT 계산과 결합하여 해당 물질의 opological TMD, highly relevant to electronic structure.", "tags": ["material", "CDW", "TMD", "quasi-1D"], "image": "", "briefing": {"background": "전하 밀도 파동(CDW)은 물질 내 전자들의 집단적 상호작용으로 발생하는 전하 밀도의 주기적 변조 현상으로, 저차원계에서 이론적으로 매우 중요하게 다루어지지만 실험적으로는 환경적 노이즈에 매우 취약합니다.", "motivation": "1T′-MoTe2는 독특한 위상적 성질과 다형성을 가진 TMD 물질로서, 이 물질의 1차원 나노구조 내에서 CDW가 어떻게 형성되고 안정화되는지 규명하고자 함.", "result": "1T′-MoTe2 나노구조에서 관찰된 견고한 CDW 상을 확인하였으며, 이는 저차원 환경에서도 전자적 정렬이 외부 섭동을 견디고 형성될 수 있음을 시사함.", "implication": "1차원 한정 조건에서도 강한 상관관계 효과가 유효하며, 향후 위상적 소자나 차세대 전자 소자로서 TMD 물질의 활용 가능성을 뒷받침함.", "novelty": "실험적으로 취약한 1차원 CDW 현상을 특정 TMD 나노구조에서 안정적으로 관찰했다는 점이 핵심이며, 독자의 연구 관심사인 저차원 전자 구조 연구와 맞닿아 있음.", "unresolved": "나노구조화 과정에서 발생하는 결함이나 기판 효과가 CDW 형성의 임계 온도나 안정성에 미치는 구체적인 메커니즘은 명확하지 않음.", "future_work": "온도나 게이트 전압 제어를 통한 CDW 상의 위상 변화 관찰 및 ARPES를 통한 전자 구조의 직접적인 밴드 변화 추적.", "concepts": [{"term": "CDW (Charge Density Wave)", "why_emerged": "전자-포논 결합에 의해 바닥 상태의 에너지를 낮추기 위한 전자 밀도의 자발적 재배치.", "origin": "Peierls (1955).", "connections": "Peierls 불안정성, 초전도와의 경쟁 관계, Mott 절연체."}, {"term": "1T′-phase", "why_emerged": "TMD 물질의 구조적 다형성 중 하나로, 대칭성 붕괴를 통해 위상적 특성을 유도함.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "Weyl semimetal, 1T-MoTe2, 위상 절연체."}], "english_summary": ["Investigated CDW phases in 1D 1T′-MoTe2 nanostructures.", "Demonstrated robust collective ordering despite 1D structural constraints.", "Provides insights into electronic correlations in low-dimensional TMDs."]}}, {"title": "Emergent Surface Altermagnetism", "journal": "PRL_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/hw4l-jknk", "authors": "Yuzhong Hu, Pan Zhou, Baoru Pan, Songmin Liu, Binchang Zhou, Lizhong Sun", "last_authors": "Binchang Zhou, Lizhong Sun", "summary": "Research on altermagnetism has thus far primarily focused on spin-polarized bulk electronic states in magnetic materials. In this work, we advance the field by introducing the concept of surface altermagnetism (SAM), wherein altermagnetic spin polarization emerges at the surfaces of collinear antife…", "tier": "B_IMPORTANT_CONDMAT", "score": "9", "reason": "Highly relevant concept of altermagnetic surface states for future ARPES investigation of magnetic materials.; demoted from A: broad CM, not direct user/project hit", "tags": ["topic", "altermagnetism", "surface-states"], "image": "", "briefing": {"background": "알터자성(Altermagnetism)은 시간 역전 대칭성이 깨져 있으나 결정 대칭성에 의해 자화가 상쇄되는 새로운 자기적 상태로, 기존의 강자성/반강자성과 구별되는 독특한 스핀 분극 밴드 구조를 가짐.", "motivation": "기존 알터자성 연구가 주로 벌크 전자 상태에 집중되어 있었으나, 표면에서 발생하는 자기적 특성이 실제 소자 구현 및 표면 측정 시 중요한 변수로 작용할 가능성을 규명하고자 함.", "result": "공선형 반강자성체 표면에서 알터자성 스핀 분극이 창발적으로 나타나는 '표면 알터자성(SAM)' 개념을 정립함.", "implication": "표면 민감도가 높은 실험 기법인 ARPES를 통해 알터자성 특성을 관찰할 때 표면 상태가 단순한 반강자성이 아닌 알터자성 특징을 반영할 수 있음을 의미함.", "novelty": "알터자성 이론의 영역을 표면 물리학으로 확장하였으며, 이는 차세대 스핀트로닉스 재료를 ARPES로 검증하는 연구자들에게 필수적인 이론적 기초를 제공함.", "unresolved": "표면 구조 완화나 불순물이 알터자성 스핀 분극을 얼마나 억제하거나 강화하는지에 대한 실험적 정량화가 부족함.", "future_work": "표면 알터자성 상태를 직접 관찰하기 위한 저온 고분해능 spin-resolved ARPES 실험.", "concepts": [{"term": "Altermagnetism", "why_emerged": "기존의 강자성/반강자성 분류로 설명되지 않는, 결정 대칭성을 보존하면서도 스핀 분극 밴드를 가지는 상태의 필요성.", "origin": "Šmejkal et al. (2022).", "connections": "Spin-split bands, non-relativistic spin splitting, magnetic topological materials."}, {"term": "Surface Altermagnetism", "why_emerged": "표면에서의 대칭성 붕괴가 자기적 질서에 미치는 영향을 이해하기 위해.", "origin": "본 논문에서 제안됨.", "connections": "Surface states, spin-polarized ARPES, symmetry-broken surface systems."}], "english_summary": ["Introduced the concept of Surface Altermagnetism (SAM).", "SAM reveals spin-polarized states at surfaces of collinear antiferromagnets.", "Extends the scope of altermagnetism to surface-sensitive measurement techniques."]}}, {"title": "Superconductivity in Noncentrosymmetric Rhombohedral NbSe2", "journal": "PRL_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/b68j-t167", "authors": "Zhengxian Li, Xiaoyu Shen, Shaozheng Wang, et al.", "last_authors": "Noah F. Q. Yuan, Guorui Chen", "summary": "Crystal stacking offers a powerful yet underexplored route to engineer symmetry in layered superconductors. Here we report superconductivity in rhombohedral-stacked ${\\mathrm{NbSe}}_{2}$ ($3R\\text{−}{\\mathrm{NbSe}}_{2}$), a noncentrosymmetric polytype in which global inversion symmetry is removed by…", "tier": "B_IMPORTANT_CONDMAT", "score": "9", "reason": "Direct interest in NbSe2 polytypes and symmetry engineering in layered superconductors.; demoted from A: broad CM, not direct user/project hit", "tags": ["material", "superconductivity", "NbSe2"], "image": "", "briefing": {"background": "층상 물질의 적층 순서를 바꾸는 '적층 공학'은 반전 대칭성을 인위적으로 제어할 수 있는 강력한 도구로, 위상적 물성 및 초전도 현상을 조절하는 핵심적인 연구 방법임.", "motivation": "NbSe2의 다양한 다형체 중 3R 적층 구조가 가지는 비중심대칭(noncentrosymmetric) 특성이 초전도성에 미치는 영향을 규명하고자 함.", "result": "3R-NbSe2에서 초전도성을 관찰하였으며, 반전 대칭성 붕괴가 이 시스템의 초전도 매개변수나 위상적 특성에 미치는 영향을 분석함.", "implication": "물질을 다루는 적층 공법을 통해 기존 2H-NbSe2와는 다른 초전도 메커니즘을 유도할 수 있는 가능성을 제시함.", "novelty": "NbSe2 계열의 새로운 상에서의 초전도성 발견은 위상 초전도체나 비중심대칭 초전도 연구 분야에 중요한 시사점을 제공함.", "unresolved": "3R-NbSe2 초전도 상태의 대칭성 파라미터가 구체적으로 어떠한지(s-wave vs unconventional)에 대한 직접적 증거는 더 필요함.", "future_work": "저온에서의 갭 측정 및 자기장 하에서의 초전도 특성 변화(Upper critical field 등) 측정.", "concepts": [{"term": "Noncentrosymmetric", "why_emerged": "시스템의 반전 대칭성을 제거하여 Rashba 스핀-궤도 결합을 유도하고 위상적 상태를 만들기 위해.", "origin": "Gorkov and Rashba (2001).", "connections": "Rashba splitting, parity-mixed superconductivity, topological insulators."}, {"term": "Polytype (3R vs 2H)", "why_emerged": "원자층의 적층 순서(stacking sequence)에 따라 전자 구조가 극적으로 변하는 TMD의 특성 때문.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "TMD, van der Waals heterostructures, crystal stacking engineering."}], "english_summary": ["Reported superconductivity in rhombohedral 3R-NbSe2.", "Utilized stacking order to break global inversion symmetry.", "Offers a new platform for studying noncentrosymmetric superconductors."]}}, {"title": "Ultrafast laser-driven topological phase patterning", "journal": "Science_Advances", "source": "Gemini", "link": "https://doi.org/10.1126/sciadv.aee8907", "authors": "Jianyu Wu, Arthur Niedermayr, Gaolong Cao, Oscar Grånäs, Jonas Weissenrieder", "last_authors": "Oscar Grånäs, Jonas Weissenrieder", "summary": "Microscopic and dynamic control over quantum states is essential for bridging fundamental studies of material properties to device function. Realizing such control at combined high spatial resolution and ultrafast temporal precision remains a major challenge. Here, we demonstrate femtosecond laser-driven patterning of topological quantum states in the Weyl semimetal WTe 2 . By engineering the excitation field into a transient optical grating, we create spatially selective and reversible structural distortions that induce local transitions between topological and topologically trivial states. Using ultrafast transmission electron microscopy, we directly visualize the formation of a periodic Td/1T* heterostructure, observe the propagation of a phase front, and analyze nanoscale confinement of coherently excited optical phonon modes. Our findings establish a platform for all-optical, spatially programmable, and reconfigurable control of quantum states, paving the way for optically addressable topological devices.", "tier": "B_IMPORTANT_CONDMAT", "score": "9", "reason": "Direct relevance: laser-driven topological transitions in Weyl semimetal WTe2 using ultrafast microscopy.; demoted from A: broad CM, not direct user/project hit", "tags": ["WTe2", "Weylsemimetal", "ultrafast", "topologicalphasetransition"], "image": "", "briefing": {"background": "양자 물질의 위상학적 특성을 실시간으로 제어하는 것은 차세대 양자 소자 구현의 핵심 과제입니다. 특히 WTe2와 같은 Weyl 반금속은 구조적 대칭성에 따라 위상학적 성질이 민감하게 변하는 특성을 가집니다.", "motivation": "초고속 레이저 펄스를 이용해 특정 영역에만 구조적 변형을 유도하여, 위상학적 상태를 공간적으로 프로그래밍할 수 있는 플랫폼을 구축하고자 합니다.", "result": "펨토초 레이저 격자(transient optical grating)를 이용해 WTe2에서 Td/1T* 상이 주기적으로 교차하는 이질 구조를 형성하고, 위상학적 상태의 국소적 변화를 초고속 투과전자현미경(UTEM)으로 직접 관측했습니다.", "implication": "빛을 이용해 나노미터 규모에서 위상학적 상태를 원하는 대로 생성하거나 재구성할 수 있음을 보여주며, 이는 광학적으로 주소 지정 가능한 토폴로지 소자 설계의 발판이 됩니다.", "novelty": "기존 이론 중심의 Floquet 공학 연구와 달리, 실제 물질(WTe2)에서 공간적으로 프로그래밍 가능한 위상 패턴을 UTEM으로 직접 시각화했다는 점이 독보적입니다.", "unresolved": "생성된 위상 이질 구조의 수명과 반복적인 재구성 과정에서의 열적 피로도, 그리고 전하 수송 특성에 미치는 실제적 영향은 아직 상세히 규명되지 않았습니다.", "future_work": "다양한 위상 재료에 대한 확장 실험 및 레이저 패턴의 정밀도를 높여 실제 논리 연산이 가능한 위상 소자 구현 시도가 기대됩니다.", "concepts": [{"term": "Weyl 반금속", "why_emerged": "밴드 구조의 비축퇴 밴드 교차점인 Weyl 노드를 가지며, 강한 Berry 곡률로 인한 특이한 전자기 특성을 탐구하기 위해 필요합니다.", "origin": "Hermann Weyl(1929)의 페르미온 이론을 기반으로, 2011년 Wan et al.이 고체 내 구현을 제안했습니다.", "connections": "이상 홀 효과, 카이랄 아노말리 등과 연결됩니다."}, {"term": "초고속 투과전자현미경 (UTEM)", "why_emerged": "펨토초 단위의 빠른 구조 변화와 나노미터 단위의 공간 해상도를 동시에 확보하기 위해 개발되었습니다.", "origin": "Ahmed Zewail 그룹의 펨토초 전자 회절 연구에서 발전되었습니다.", "connections": "시간 분해 분광학 및 동역학적 구조 분석과 연결됩니다."}], "english_summary": ["Demonstrates spatial patterning of topological phases in WTe2 via ultrafast optical gratings.", "Uses UTEM to visualize the formation of periodic Td/1T* phase heterostructures.", "Establishes a platform for programmable, all-optical control of quantum states.", "Proves real-time switching between topological and trivial states in a Weyl semimetal."]}}, {"title": "RIXS observation of bond-directional excitations in the Kitaev material Na2IrO3", "journal": "npj_QuantumMaterials", "source": "Gemini", "link": "https://www.nature.com/articles/s41535-026-00938-9", "authors": "Marco Magnaterra, Karolin Hopfer, Christoph J. Sahle, et al.", "last_authors": "Jeroen van den Brink, Markus Grüninger", "summary": "RIXS observation of bond-directional excitations in the Kitaev material Na 2 IrO 3", "tier": "B_IMPORTANT_CONDMAT", "score": "9", "reason": "High relevance: direct interest in RIXS and topological material electronic structure.", "tags": ["RIXS", "Na2IrO3", "topological"], "image": "https://pubads.g.doubleclick.net/gampad/ad?iu=/285/npjquantmats.nature.com/article&sz=728x9 ors": "F. Malte Grosche, Alexander G. Eaton", "summary": "Observations of a memory effect in the p-wave superconductor candidate UTe2, which can be controlled by varying the strength and duration of the electrically applied stimuli, are described.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Heavy fermion candidate for topological superconductivity, relevant to user interest in unconventional systems.", "tags": ["UTe2", "superconductivity", "heavy-fermion"], "image": "https://media.springernature.com/m685/springer-static/image/art%3A10.1038%2Fs41586-026-11015-3/MediaObjects/41586_2026_11015_Fig1_HTML.png", "briefing": {"background": "UTe2는 중페르미온 시스템에서 p-파 초전도체 후보로 강력하게 거론되며, 위상학적 초전도성을 나타낼 것으로 기대되는 희귀한 물질입니다.", "motivation": "이러한 물질에서 외부 전기적 자극을 통해 초전도 상태를 변화시키고 그 변화를 유지(기억)하는 메커니즘을 밝혀내고자 합니다.", "result": "UTe2에서 전기적 자극의 강도와 시간에 따라 초전도 특성이 변하는 기억 효과(memory effect)를 관측했습니다.", "implication": "위상학적 초전도체의 양자 상태를 전기적으로 제어하고 저장할 수 있는 가능성을 제시합니다.", "novelty": "강상관 시스템이자 중페르미온 초전도체에서 전기적 자극에 의한 가역적이고 조절 가능한 특성 변화를 보고한 흥미로운 사례입니다.", "unresolved": "기억 효과의 미시적 기원(예: 격자 결함, 국소적 전하 재분배, 또는 전자 상태 변화)이 아직 명확하지 않습니다.", "future_work": "이러한 초전도 기억 효과가 위상학적 기원을 가지는지에 대한 추가적인 검증 실험과 소자화 연구가 예상됩니다.", "concepts": [{"term": "UTe2", "why_emerged": "중페르미온 기반 위상학적 초전도 후보 물질로서 스핀 삼중항 초전도 가능성이 높습니다.", "origin": "초록 정보만으로는 특정하기 어려움 (Ran et al., 2019 등이 주요 발견).", "connections": "Sr2RuO4, 강상관 위상 물리학과 연결됩니다."}, {"term": "중페르미온", "why_emerged": "f-전자와 전도 전자 사이의 강한 혼성화로 인해 유효 질량이 극단적으로 커지는 특이 금속 상태를 이해하기 위해 사용됩니다.", "origin": "Steglich et al.(1979)의 CeCu2Si2 발견으로부터 확립되었습니다.", "connections": "반강자성, 비통상적 초전도성과 긴밀히 연결됩니다."}], "english_summary": ["Reports an electrically controllable superconducting memory effect in UTe2.", "Demonstrates that electrical stimuli can modulate superconducting states in heavy-fermion systems.", "Suggests potential for active control of topological superconductors.", "Presents a novel functional observation in unconventional superconductivity research."]}}, {"title": "Checkerboard-type Zhang-Rice states in overdoped cuprate superconductors", "journal": "Nature_Communications", "source": "Gemini", "link": "https://www.nature.com/articles/s41467-026-77985-0", "authors": "Xiongfang Liu, Kun Han, Yan Peng, et al.", "last_authors": "Mi Jiang, Xinmao Yin", "summary": "In cuprate superconductors, the overdoped regime has received comparatively limited attention. Here, broadband optical spectroscopy and DQMC calculations reveal an electronic reconstruction in LSCO beyond x > 0.2, consistent with a checkerboard Zhang–Rice configuration hosting coexisting localized and itinerant carriers.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Broadband spectroscopy study of electronic reconstruction in overdoped cuprates, relevant to unconventional superconductivity.", "tags": ["method:opticalspectroscopy", "material:cuprate", "topic:superconductivity"], "image": "https://pubads.g.doubleclick.net/gampad/ad?iu=/285/nature_communications/article&sz=728x90&c=-38688796&t=pos%3Dtop%26type%3Darticle%26artid%3Ds41467-026-77985-0%26doi%3D10.1038/s41467-026-77985-0%26techmeta%3D122,128,132,145%26subjmeta%3D1003,119,301,639,766,995%26kwrd%3DElectronic+properties+and+materials,Superconducting+properties+and+materials", "briefing": {"background": "구리 산화물 초전도체(cuprates)에서 전자 도핑 농도가 높은 과도핑(overdoped) 영역은 페르미 액체에 가까워진다고 여겨졌으나, 최근 이 영역에서의 전자 상관관계와 숨겨진 질서가 다시 주목받고 있습니다.", "motivation": "과도핑된 LSCO 물질에서 나타나는 전자 구조 재구성(reconstruction)의 기원을 이해하고, 장-라이스 상태가 어떻게 변화하는지 규명하고자 함.", "result": "광학 분광법과 DQMC 계산을 통해 과도핑 영역(x > 0.2)에서 국소적 캐리어와 이동성 캐리어가 공존하는 바둑판 형태의 장-라이스 상태를 확인했습니다.", "implication": "과도핑 영역이 단순히 단순한 금속 상태가 아니며, 강한 전자 상관관계에 의한 복잡한 전자 구조 재구성이 초전도성에 영향을 줄 수 있음을 시사합니다.", "novelty": "기존 연구가 부족했던 과도핑 영역에서의 전자적 불균일성을 실험적(광학) 데이터와 이론적(DQMC) 모델로 뒷받침하여 비전통적 초전도체 모델을 확장했습니다.", "unresolved": "이 바둑판 구조가 실제 초전도 전이 온도 변화에 미치는 정량적인 인과관계는 추가 연구가 필요합니다.", "future_work": "다른 과도핑 구리 산화물 물질군에서의 유사 현상 검증 및 전자 구조 불균일성을 측정할 수 있는 공간 분해 분광법 적용.", "concepts": [{"term": "Zhang-Rice state", "why_emerged": "구리 산화물에서 Cu 3d 궤도와 O 2p 궤도 간의 강한 혼성화를 설명하기 위해 도입.", "origin": "F. C. Zhang and T. M. Rice (1988).", "connections": "Hubbard 모델, t-J 모델, 고온 초전도 기원론."}, {"term": "Overdoped regime", "why_emerged": "초전도 상도에서 도핑 농도가 최적치보다 높은 영역을 명명하기 위해 사용.", "origin": "초창기 구리 산화물 연구 단계에서 확립.", "connections": "페르미 액체, 비전통적 초전도성, 슈도갭 소멸."}], "english_summary": ["Broadband optical spectroscopy and DQMC simulations explore the overdoped regime of LSCO (x > 0.2).", "Evidence for a checkerboard Zhang-Rice configuration is identified in this high-doping range.", "The result suggests the coexistence of localized and itinerant carriers beyond the standard Fermi liquid picture."]}}, {"title": "Anisotropic magnons in the layered honeycomb ferromagnet CrSiTe3", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/c7bd-ghcb", "authors": "T. J. Williams, D. L. Abernathy, M. D. Lumsden, J.-Q. Yan, A. D. Christianson", "last_authors": "J.-Q. Yan, A. D. Christianson", "summary": "Recent experimental and theoretical studies have suggested a possible Dirac magnon gap in the two-dimensional ferromagnetic semiconductor CrSiTe 3 . Detailed neutron scattering measurements were performed to shed light on the existence of the magnon gap, and suggest that the gap is very small or nonexistent, with previous measurements being complicated by experimental factors. During these measurements, it was found that the out-of-plane couplings could explain the usual property of the increase in the magnetic transition temperature when CrSiTe 3 is exfoliated to monolayers. Furthermore, the material was shown to have anisotropic magnons along the out-of-plane direction, through the proposed Dirac point. We speculate that this is due to an exchange anisotropy, though Kitaev-like interactions alone cannot explain the spectra.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Neutron scattering study of a honeycomb vdW ferromagnet; relevant to topological magnons.", "tags": ["material", "neutronscattering", "magnon", "vdW"], "image": "", "briefing": {"background": "CrSiTe3는 벌크에서 2D 층상 구조를 가진 반도체형 강자성체로, 2D 자성 및 위상적 스핀 파동 연구의 핵심 물질입니다.", "motivation": "초록 정보만으로는 분야 내부의 구체적 동기를 안정적으로 요약하기 어렵습니다.", "result": "Recent experimental and theoretical studies have suggested a possible Dirac magnon gap in the two-dimensional ferromagnetic semiconductor CrSiTe 3 . Detailed neutron scattering measurements were performed to shed light on the existence of the magnon gap, and suggest that the gap is very small or nonexistent, with previous measurements being complicated by experimental factors. During these measurements, it was found that the out-of-plane couplings could explain the usual property of the increase in the magnetic transition temperature when CrSiTe 3 is exfoliated to monolayers. Furthermore, the material was shown to have anisotropic magnons along the out-of-plane direction, through the proposed Dirac point. We speculate that this is due to an exchange anisotropy, though Kitaev-like interactions alone cannot explain the spectra.", "implication": "필터가 이 논문을 통과시킨 이유는 관련 키워드, 저자, 또는 Gemini relevance score 때문입니다.", "novelty": "기존에 제기된 Dirac magnon gap의 존재 여부를 재검토하고, 층간 결합과 이방성 교환 상호작용이 스펙트럼에 미치는 영향을 규명했습니다.", "unresolved": "Kitaev 모델만으로는 설명되지 않는 이방성 스펙트럼의 정확한 물리적 기원(예: Dzyaloshinskii-Moriya 상호작용의 구체적 성분)이 여전히 불분명합니다.", "future_work": "이방성 교환 상호작용을 정밀하게 제어하기 위한 스트레인 엔지니어링이나 추가적인 비탄성 중성자 산란 실험.", "concepts": [{"term": "Dirac magnon", "why_emerged": "벌집 격자(honeycomb lattice)에서 스핀 파동의 분산 관계가 Dirac 점을 가질 수 있다는 이론적 예측.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "위상적 자성, 스핀 홀 효과, CrI3/CrGeTe3 연구."}, {"term": "Kitaev interaction", "why_emerged": "벌집 격자 시스템에서 방향에 따라 다른 스핀 상호작용을 기술하기 위해 도입.", "origin": "Alexei Kitaev (2006).", "connections": "양자 스핀 액체, 이리데이트(iridates), 위상적 물질."}], "english_summary": ["Neutron scattering study on CrSiTe3 refutes the presence of a large Dirac magnon gap.", "Experimental findings suggest the magnon gap is likely nonexistent or extremely small.", "Anisotropy in out-of-plane coupling is proposed to explain magnetic transition temperature changes in thin layers.", "Data reveals anisotropic magnons that defy simple Kitaev-only interaction models."]}}, {"title": "Electronic mean free path of the cuprate superconductor Bi2Sr2CaCu2O8+δ from thermal Hall conductivity", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/c4gc-hkfn", "authors": "Emma Campillo, Manel Mezidi, Lu Chen, et al.", "last_authors": "Genda Gu, Louis Taillefer", "summary": "We use thermal transport to access the electronic mean free path of $d$-wave quasiparticles in one of the most widely studied cuprate superconductors, ${\\mathrm{Bi}}_{2}{\\mathrm{Sr}}_{2}{\\mathrm{CaCu}}_{2}{\\mathrm{O}}_{8+δ}$ (Bi2212). We have measured the thermal conductivity ${κ}_{\\mathrm{xx}}$ and…", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Quasiparticle transport study in Bi2212, a core material for electronic structure spectroscopy.", "tags": ["experiment", "Bi2212", "cuprate", "thermalHall"], "image": "", "briefing": {"background": "Bi2212는 ARPES 및 STM 연구에서 가장 빈번하게 사용되는 구리 산화물 초전도체로, 준입자 거동을 이해하는 것이 전체 고온 초전도 현상 해석의 핵심입니다.", "motivation": "Bi2212의 d-파 준입자 산란 메커니즘을 열전도율 측정을 통해 검증하고자 함.", "result": "열적 홀 효과와 열전도율 측정을 통해 Bi2212의 준입자 평균 자유 행로(mean free path)를 정밀 분석함.", "implication": "강한 상관관계 하에서의 전하 수송 특성을 제한하는 주요 산란 메커니즘을 식별하는 데 기여함.", "novelty": "통상적으로 사용되는 전기 전도도 외에 열전도 측정이라는 독립적인 도구를 사용하여 준입자 동역학을 교차 검증함.", "unresolved": "열적 홀 효과의 원천이 되는Berry curvature의 기여분과 순수 준입자 산란 효과의 명확한 분리.", "future_work": "다른 도핑 수준에서의 평균 자유 행로 분석 및 비등방성 산란 기작 모델링.", "concepts": [{"term": "Thermal Hall effect", "why_emerged": "전하를 띠지 않는 준입자(예: 포논, 마그논)가 자기장에서 어떻게 이동하는지 확인하기 위해 도입.", "origin": "위상 물성 연구의 대두와 함께 활성화.", "connections": "위상적 절연체, 중성 엑시톤, 스핀 액체 후보 물질."}, {"term": "Mean free path", "why_emerged": "준입자가 산란 없이 이동하는 평균 거리를 정량화하여 산란 메커니즘을 유추하기 위해 필요.", "origin": "고전적인 드루드 모델로부터 확립.", "connections": "이동도(mobility), 산란 시간, 강한 상관관계 금속."}], "english_summary": ["Thermal transport measurements are used to probe the quasiparticle mean free path in Bi2Sr2CaCu2O8+δ.", "The study focuses on d-wave quasiparticle dynamics in the high-Tc cuprate.", "Provides independent verification of scattering behavior compared to standard electrical transport studies."]}}, {"title": "From perovskite to infinite-layer nickelates: Hole concentration from x-ray absorption", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/qc3z-k45l", "authors": "R. Pons, M. Flavenot, K. Fürsich, et al.", "last_authors": "D. Preziosi, E. Benckiser", "summary": "The difficulty of determining cation concentrations and oxygen stoichiometry in infinite-layer nickelate thin films has so far prevented clear experimental identification of the nickel electron configuration in the superconducting phase. We used soft x-ray absorption spectroscopy to study the successive changes in PrNiO x thin films at various intermediate stages of topotactic reduction with x = 2 – 3 . By comparing the Ni L -edge spectra to single- and double-cluster ligand-field calculations, we find that none of our samples exhibits a pure d 9 configuration. Our quantitative analysis using the charge sum rule shows that even when films are maximally reduced, the spatially averaged number of nickel 3 d holes is 1.38. Superconducting samples have even higher values, calling into question the previously assumed limit of hole doping. Concomitant changes in the oxygen K -edge absorption spectra upon reduction indicate the presence of oxygen 2 p holes, even in the most reduced films. Overall, our results suggest a complex interplay of hole-doping mechanisms resulting from self-doping effects, structural defects, and oxygen nonstoichiometry.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Soft XAS study characterizing the electronic configuration in infinite-layer nickelate superconductors.", "tags": ["XAS", "nickelates", "superconductivity"], "image": "", "briefing": {"background": "무한층(infinite-layer) 니켈산염은 구리산염(cuprate)과 유사한 d9 전자 배치를 가질 것으로 기대되어 고온 초전도체 후보로 주목받고 있습니다. 그러나 박막 합성 과정에서의 산소 비화학양론성과 양이온 농도 결정의 어려움으로 인해 실제 전자 상태에 대한 논란이 지속되고 있습니다.", "motivation": "이 논문은 topotactic reduction 과정을 거친 PrNiOx 박막에서 산소 비화학양론 변화에 따른 니켈의 전자 구조와 정공 농도를 실험적으로 명확히 규명하고자 하였습니다.", "result": "연엑스선 흡수 분광법(XAS) 분석 결과, 초전도 상의 샘플에서도 순수한 d9 전자 배치가 관찰되지 않았으며, 오히려 상당한 양의 니켈 3d 정공(hole)과 산소 2p 정공이 존재하는 복합적인 상태임을 확인했습니다.", "implication": "기존에 가정되었던 무한층 니켈산염의 단순한 d9 모델이 실제로는 정공 도핑 기전과 결함 등에 의해 매우 복잡하다는 것을 시사하며, 초전도 발현 메커니즘에 대한 재해석이 필요함을 강조합니다.", "novelty": "실제 초전도 박막에 대한 정량적 분석을 통해 이론적 가설과 실험적 결과 사이의 큰 괴리를 밝혀냈으며, 이는 니켈산염 연구 커뮤니티에 중요한 경종을 울리는 결과입니다.", "unresolved": "왜 1.38개 수준의 높은 정공 농도에서도 초전도가 나타나는지, 그리고 이들 정공이 도핑과 산소 결함 중 어디에서 주로 기인하는지 명확하지 않습니다.", "future_work": "도핑 메커니즘을 제어하기 위한 합성 공정 최적화 및 전자 구조 분석을 통한 국소적인 전하 분포 관찰이 필요합니다.", "concepts": [{"term": "Topotactic reduction", "why_emerged": "산소 함량을 정밀하게 조절하여 페로브스카이트 구조에서 무한층 구조로 상전이를 유도하기 위해 필요합니다.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "니켈산염 박막 합성, 고온 초전도체 연구"}, {"term": "Charge sum rule", "why_emerged": "XAS 스펙트럼의 적분값을 통해 시스템의 전자/정공 농도를 정량화하기 위해 사용됩니다.", "origin": "Thole et al. (1992)", "connections": "XAS, X-ray Magnetic Circular Dichroism (XMCD)"}], "english_summary": ["Soft XAS study of infinite-layer PrNiOx thin films.", "Samples consistently show d-hole density higher than the assumed d9 limit.", "Oxygen K-edge data reveals oxygen 2p holes, indicating complex self-doping.", "Results challenge simple d9 electronic configuration models for nickelate superconductors."]}}, {"title": "Magneto-optical response of five-septuple-layer MnBi2Te4 in spin-flip states", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/33km-cp5r", "authors": "Shahid Sattar, Roman Stepanov, A. H. MacDonald, C. M. Canali", "last_authors": "A. H. MacDonald, C. M. Canali", "summary": "Magneto-optical (MO) effects like Kerr and Faraday rotations provide a direct probe of topological order in thin films of the magnetic topological insulator (TI) MnBi 2 Te 4 (MBT). Motivated by recent experimental studies of spin-flip/flop transitions in MBT thin films, we investigate the interplay between interlayer spin configurations, topological order, and MO response in five septuple-layer (5-SL) MBT using first-principles calculations and a simplified coupled Dirac cone model. Our results reveal that, despite possessing a nonzero out-of-plane magnetization, 5-SL MBT thin films can be either C = + 1 TIs or C = 0 topologically trivial insulators depending on the relative spin orientations of the top and bottom SLs. We evaluate the Faraday and Kerr rotation angles using tight-binding models derived from calculations and by comparing our results with those of a simplified coupled Dirac cone model to clarify the macroscopic mechanisms underlying the MO response of spin-flip states. These theoretical findings highlight the tunability of topological and MO properties in MBT thin films and provide microscopic insight into the emergence of complex topological order in layered antiferromagnetic materials.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Investigation of magneto-optical signatures in the magnetic topological insulator MnBi2Te4.", "tags": ["experiment", "MnBi2Te4", "topological-insulator"], "image": "", "briefing": {"background": "자기 위상절연체(Magnetic Topological Insulator)인 MnBi2Te4(MBT)는 층간 자기 결합에 따라 위상적 성질이 바뀌는 물질로, 양자 변칙 홀 효과 등의 물리적 현상을 구현하는 플랫폼입니다.", "motivation": "MBT 박막의 자기 상태(spin-flip/flop) 변화에 따른 위상적 위상 변화와 이와 연동된 자기광학적(MO) 반응의 마이크로스코픽한 기전을 이론적으로 규명하고자 했습니다.", "result": "5층(5-SL) 구조의 MBT에서 외부 자기장에 따른 층간 스핀 배향 변화가 위상수(Chern number)를 C=1에서 C=0으로 전환시킬 수 있음을 보였고, 이를 Kerr/Faraday 회전각으로 정량화했습니다.", "implication": "자기광학적 측정이 단순히 자기적 상태뿐만 아니라 위상적 위상을 실시간으로 추적할 수 있는 비파괴적 도구가 될 수 있음을 의미합니다.", "novelty": "자기 구조와 위상적 위상의 직접적인 연결 고리를 제시하여, MBT 기반의 위상 소자 설계에 중요한 이론적 가이드라인을 제공  of the fractional quantum Hall effect without external magnetic fields. Here we propose a programmable platform for engineering topological flat bands by combining a Zeeman field with a tunable elec…", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Directly relevant to topological insulators, flat bands, and moire-like superlattice engineering.", "tags": ["topologicalinsulators", "flatband", "Cherninsulator"], "image": "", "briefing": {"background": "강한 상호작용이 존재하는 평탄 밴드(flat band)에서 나타나는 분수 Chern 절연체(FCI)는 외부 자기장 없이도 분수 양자 홀 효과를 구현할 수 있어 현대 응집물질 물리학의 핵심 연구 주제입니다.", "motivation": "모아레 격자나 인위적인 초격자 잠재력을 활용하여 위상적 성질을 가지는 평탄 밴드를 효율적으로 제어할 수 있는 플랫폼을 설계하고자 합니다.", "result": "Rashba 시스템과 Zeeman 장, 그리고 튜닝 가능한 초격자 잠재력을 결합하여 위상학적으로 비자명한 평탄 밴드를 형성할 수 있음을 이론적으로 제시했습니다.", "implication": "실제 재료 공학에서 위상 양자 상태를 제어하기 위한 설계 지침을 제공하며, 차세대 양자 소자 개발의 기반이 됩니다.", "novelty": "외부 자기장 없이도 상호작용 기반의 위상 질서를 제어할 수 있는 프로그래밍 가능한 플랫폼을 제안했다는 점에서 독창적입니다.", "unresolved": "제안된 이론적 모델을 실제 물리적 소자(예: 반데르발스 이종접합)에서 완벽하게 구현하기 위한 실험적 파라미터 최적화가 필요합니다.", "future_work": "실제 Rashba 시스템을 포함한 2D 물질에서의 밴드 구조 계산 및 이를 검증하기 위한 ARPES 연구가 뒤따라야 할 것입니다.", "concepts": [{"term": "분수 Chern 절연체", "why_emerged": "자기장 없는 환경에서 분수 양자 홀 상태를 구현하기 위해 등장.", "origin": "Neupert et al. (2011) 등.", "connections": "분수 양자 홀 효과, 위상 절연체."}, {"term": "Rashba 시스템", "why_emerged": "구조적 반전 대칭 파괴에 의한 스핀-궤도 결합을 설명하기 위해 필요.", "origin": "Rashba (1960).", "connections": "스핀트로닉스, 위상 절연체."}], "english_summary": ["Proposes a platform to engineer topological flat bands in Rashba systems.", "Combines Zeeman fields and tunable superlattice potentials to host Fractional Chern Insulators.", "Realizes lattice analogs of fractional quantum Hall effects without external magnetic fields.", "Provides a design principle for programmable topological quantum matter."]}}, {"title": "Topology, imaging, and emergent phenomena of spin textures", "journal": "Science_Advances", "source": "Gemini", "link": "https://doi.org/10.1126/sciadv.aeg8564", "authors": "Achim Rosch, Christian Pfleiderer, Manfred Fiebig, Xiuzhen Yu, Yoshinori Tokura, Naoto Nagaosa", "last_authors": "Yoshinori Tokura, Naoto Nagaosa", "summary": "Spin textures are magnetic configurations that vary smoothly in space, momentum, or time. This review explores the topology, geometry, dynamics, and imaging of these complex, often noncollinear configurations in magnetic and multiferroic systems, providing a framework for investigating the interplay between local spatial patterns and their global physical properties. A central theme is the role of Berry phases and quantum geometry, which provide a common framework linking topological textures, emergent electrodynamics, charge transport, and magnetically induced ferroelectricity. Spin textures can manifest as stable topological particles, coupling to electrons or magnons via emergent electromagnetic fields. Advanced real-space imaging techniques resolve the internal structure and dynamics of topological textures like magnetic skyrmions or multiferroic domains, enabling the direct observation of their nucleation, motion, and annihilation in both two and three dimensions. In multiferroic systems, spin textures can induce ferroelectricity, and nonlinear optical techniques, such as second-harmonic generation, can resolve the coexisting order parameters in such systems. Last, we examine emergent functionalities of spin textures and multiferroics, such as nonreciprocal transport, and provide an outlook on the technological potential of magnetic textures and their role in exploring the link between topology and magnetism.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Highly relevant review of Berry phases, topology, and transport in magnetic textures like skyrmions.", "tags": ["topologicalmagnetism", "skyrmions", "Berryphase", "review"], "image": "", "briefing": {"background": "자기적 텍스처는 국소적인 자기 모멘트의 배열이 공간적으로 변화하는 구조로, Berry 위상과 위상학적 성질이 결합하여 독특한 전자 수송 현상을 유도합니다.", "motivation": "다양한 자기 및 멀티페로익 시스템에서 나타나는 비공선 026-02730-3/MediaObjects/41563_2026_2730_Fig1_HTML.png", "briefing": {"background": "2차원 반강자성체(van der Waals magnet)는 스핀 구조와 전자 상태 간의 결합을 연구하기 위한 플랫폼입니다. 특히 CrSBr은 층상 구조와 엑시톤 발광 특성으로 주목받고 있습니다.", "motivation": "빛에 의한 광여기 상태(exciton)가 어떻게 자성체 내의 스핀 동역학을 제어하고 비선형 마그논 모드를 유도하는지 규명하고자 합니다.", "result": "광여기된 엑시톤이 스핀 토크(spin torque)를 발생시켜 펄스 이후에도 지속되는 위상 결맞음(phase-coherent) 에너지 교환을 통해 비선형 마그논 동역학을 구동함을 확인했습니다.", "implication": "빛을 이용해 초고속으로 스핀 상태를 제어할 수 있는 가능성을 열어주며, 광-스핀 소자 응용의 기초를 마련합니다.", "novelty": "단순한 정적 자성 측정을 넘어, 엑시톤과 마그논 사이의 동적 상호작용을 통한 비선형 스핀 제어를 입증했다는 점에서 중요합니다.", "unresolved": "엑시톤-마그논 상호작용의 미세한 스케일과 비선형성 지속 시간이 실제 디바이스 환경에서도 동일하게 유지되는지는 추가 연구가 필요합니다.", "future_work": "펨토초 분해능의 스핀 이미징 기술을 도입하여 엑시톤에 의한 스핀 토크의 공간적 분포를 가시화할 것으로 예상됩니다.", "concepts": [{"term": "비선형 마그논 동역학", "why_emerged": "고밀도 스핀 여기 상태에서 마그논 간 상호작용이 무시할 수 없을 때 이를 기술하기 위해 필요합니다.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "스핀파(spin wave), 마그논 비선형 분산 관계"}, {"term": "반데르발스 자성체(vdW magnet)", "why_emerged": "단원자층으로 박리 가능하면서도 자성을 유지하는 물질을 통해 저차원 양자 현상을 탐구하기 위해 부상했습니다.", "origin": "2017년 CrI3 및 CrGeTe3 연구를 통해 본격화", "connections": "2D 자성, 자기적 이방성, 층간 교환 상호작용"}], "english_summary": ["Photoexcited excitons in CrSBr induce nonlinear magnon dynamics.", "Evidence of phase-coherent spin-torque generation by optical pulses.", "The effects persist significantly beyond the duration of the optical pulse.", "This mechanism suggests new paths for ultrafast opto-spintronic device control."]}}, {"title": "Microwave-to-optical transduction using magnon–exciton coupling", "journal": "Nature_Materials", "source": "Gemini", "link": "https://www.nature.com/articles/s41563-026-02748-7", "authors": "Pratap Chandra Adak, Iris E. McDaniel, Suvodeep Paul, et al.", "last_authors": "Andrea Alú, Vinod M. Menon", "summary": "Broadband microwave-to-optical conversion is demonstrated in the layered antiferromagnet CrSBr through strong magnon–exciton coupling, offering a scalable platform for quantum transduction.", "tier": "B_IMP hree-dimensional lattice distortions causes the quantum magnet CuGeO3 to form a dimerized state. Now the authors demonstrate how this interplay affects fractionalized quasiparticles of CuGeO3.", "tier": "B_IMPORTANT_CONDMAT", "score": "7", "reason": "Study of fractionalized quasiparticles in 1D systems, relevant to user's Luttinger liquid interests.", "tags": ["magnetism", "CuGeO3", "quasiparticles"], "image": "https://media.springernature.com/m685/springer-static/image/art%3A10.1038%2Fs41567-026-03447-5/MediaObjects/41567_2026_3447_Fig1_HTML.png", "briefing": {"background": "1차원 양자 스핀 사슬은 스핀 분획화(spinon)와 같은 비자명한 양자 상태를 관찰하기에 가장 적합한 연구 대상입니다.", "motivation": "CuGeO3에서 관찰되는 스핀-피얼스(spin-Peierls) 전이와 사슬 내 자기적 좌절(frustration)이 스핀 분획 현상에 미치는 영향을 분석하고자 합니다.", "result": "이 시스템에서 약하게 상호작용하는 스핀온(spinon)과 강하게 결합된 트리플론(triplon)이 공존하며 시스템의 물성을 결정함을 밝혀냈습니다.", "implication": "1차원 자성체 내의 준입자(quasiparticle) 구조와 분획화 현상을 이해하는 데 중요한 데이터포인트가 됩니다.", "novelty": "frustration과 격자 왜곡의 상호작용이 어떻게 서로 다른 유형의 분획화된 준입자들을 안정화하는지 체계적으로 설명했습니다.", "unresolved": "3차원 격자 왜곡이 준입자의 결맞음성에 미치는 정량적인 파라미터는 여전히 연구가 필요합니다.", "future_work": "비탄성 중성자 산란(INS) 등을 통해 스핀온과 트리플론의 분산 관계를 더 정밀하게 측정할 예정입니다.", "concepts": [{"term": "스핀온(Spinon)", "why_emerged": "1차원 하이젠베르크 사슬에서 스핀 상태가 단일 입자가 아닌 비국소적 쌍으로 존재함을 설명하기 위해 필요합니다.", "origin": "H. Bethe (1931), L. Faddeev and J. Takhtajan (1981)", "connections": "양자 스핀 액체, 분획화(fractionalization), 베테 가설"}, {"term": "스핀-피얼스(Spin-Peierls) 전이", "why_emerged": "저차원 자기 시스템에서 격자 왜곡을 통해 에너지를 낮추려는 경향을 기술하기 위해 제안되었습니다.", "origin": "Michael Cross and Daniel Fisher (1979)", "connections": "Peierls 전이, 이합체화(dimerization)"}], "english_summary": ["The quantum magnet CuGeO3 exhibits interplay between frustration and lattice distortion.", "Analysis reveals the co-existence of weakly interacting spinons and bound triplons.", "Advances understanding of fractionalized quasiparticle physics in 1D systems.", "Provides insights into how structural transitions modify elementary spin excitations."]}}, {"title": "Altermagnetic phases and phase transitions in the Lieb-5 Hubbard model", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/xv8w-8sx3", "authors": "Sougata Biswas, Achintyaa, Paramita Dutta", "last_authors": "Achintyaa, Paramita Dutta", "summary": "The emergence of altermagnetism, a collinear magnetic phase characterized by momentum-dependent spin-split bands but zero net magnetization, has fundamentally reshaped the classification of magnetic order. We propose an altermagnetic (AM) order in a repulsive Hubbard model on the Lieb-5 lattice. Con…", "tier": "B_IMPORTANT_CONDMAT", "score": "7", "reason": "Theory of altermagnetism, a topic of high current interest for electronic structure and symmetry.", "tags": ["theory", "altermagnetism"], "image": "", "briefing": {"background": "자성체는 전통적으로 강자성과 반강자성으로 분류되어 왔으나, 최근 '알터마그네티즘(Altermagnetism)'이라는 새로운 상이 제안되었습니다. 이는 순자화율은 0이지만, 대칭성이 낮은 격자 구조 덕분에 운동량 공간에서 스핀 분할이 일어나는 독특한 비콜리니어(collinear) 자성 상태입니다.", "motivation": "Lieb-5 격자라는 복잡한 단위세포 구조에서 척력성 허바드 모델을 사용하여, 알터마그네틱 상태가 어떠한 물리적 기작으로 발생하고 상전이가 일어나는지 이론적으로 분석하고자 합니다.", "result": "Lieb-5 격자에서의 전자 상관관계가 어떻게 특정 자성 정렬을 유도하며, 이 과정에서 발생하는 운동량 의존적 스핀 분할 특성을 규명하였습니다.", "implication": "알터마그네티즘의 존재를 특정 격자 모델에서 이론적으로 확증함으로써, 미래의 스핀트로닉스 소자 재료 개발을 위한 설계 지침을 제공합니다.", "novelty": "기존의 전형적인 단순 격자가 아닌 Lieb-5와 같은 복잡한 단위세포에서 알터마그네티즘을 다루어, 새로운 재료군으로의 확장 가능성을 제시했습니다.", "unresolved": "실제 합성 가능한 물질에서의 구현 가능성과, 실제 물질 내의 밴드 구조와 모델 간의 정량적 일치 여부는 아직 남아있습니다.", "future_work": "다른 기하학적 격자로의 확장 및 실제 위상학적 특성과 결합된 알터마그네틱 현상 연구가 기대됩니다.", "concepts": [{"term": "알터마그네티즘", "why_emerged": "강자성도 반강자성도 아닌 제3의 자성 상태를 분류하기 위해 필요합니다.", "origin": "최근 2020년대 들어 이론적으로 체계화됨.", "connections": "반강자성 스핀트로닉스, 비자성체 스핀 분할 효과와 연결됨."}, {"term": "Lieb-5 격자", "why_emerged": "격자 기하구조에 따른 밴드 구조의 변화를 연구하기 위한 모델 격자입니다.", "origin": "Elliott Lieb의 초기 격자 모델 연구에서 파생됨.", "connections": "플랫 밴드 물리, 강한 상관관계 시스템."}], "english_summary": ["The paper investigates altermagnetic order in the Lieb-5 Hubbard model.", "Altermagnetism is identified as a spin-split phase without net magnetization.", "The study provides a theoretical basis for identifying such phases in complex lattices.", "This contributes to the broader understanding of magnetism beyond collinear paradigms."]}}, {"title": "Anisotropy of spin waves in the field-polarized phase of Fe-doped MnSi", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/4y5x-mrl7", "authors": "I. N. Khoroshiy, A. Podlesnyak, D. Menzel, et al.", "last_authors": "A. S. Sukhanov, S. E. Nikitin", "summary": "Chiral magnetic textures, such as skyrmions, are of great interest to the condensed matter community due to their novel transport properties. The stabilization of topologically nontrivial magnetic phases, like the skyrmion lattice in cubic MnSi, is governed by underlying magnetic interactions which …", "tier": "B_IMPORTANT_CONDMAT", "score": "7", "reason": "Magnetic interactions in a classic topological chiral magnet MnSi.", "tags": ["material", "magnetism", "topology"], "image": "", "briefing": {"background": "MnSi는 카이랄 자성체로, 스커미온 격자(skyrmion lattice)가 처음 발견된 물질 중 하나입니다. 이러한 물질의 위상학적 자성 구조는 복잡한 자기적 상호작용의 균형에 의해 결정됩니다.", "motivation": "Fe를 도핑한 MnSi의 자기적 특성을 조사하여, 필드 편극 상태에서 스핀 파(spin wave)가 어떻게 이방성을 띠는지 규명하고자 합니다.", "result": "자기장 하에서 나타나는 스핀 파의 분산 관계와 이방성을 구체적으로 측정하여, MnSi의 자기적 상호작용 매개변수를 더욱 정밀하게 제한하였습니다.", "implication": "스커미온과 같은 위상학적 자성 구조를 안정화하는 데 필요한 미세한 에너지 척도(DM 상호작용 등)를 이해하는 데 중요한 데이터를 제공합니다.", "novelty": "잘 알려진 MnSi 시스템 내에서 도핑을 통한 미세 조정과 그에 따른 스핀 파의 변화를 추적하여, 상호작용의 세부적인 메커니즘을 규명했습니다.", "unresolved": "Fe 도핑이 위상학적 보호 정도에 미치는 상세한 영향과 저온에서의 양자 상전이와의 연결고리는 추가 연구가 필요합니다.", "future_work": "도핑 농도와 위상학적 전하 간의 상관관계에 대한 중성자 산란 실험이 이어질 것으로 예상됩니다.", "concepts": [{"term": "카이랄 자성체", "why_emerged": "공간 반전 대칭이 깨진 결정 구조에서 Dzyaloshinskii-Moriya(DM) 상호작용을 연구하기 위해 필요합니다.", "origin": "I. Dzyaloshinskii(1958)와 T. Moriya(1960).", "connections": "스커미온, 위상학적 홀 효과."}, {"term": "스핀 파", "why_emerged": "자성체 내 스핀들의 집단적 들뜸 현상을 설명하기 위해 고안되었습니다.", "origin": "Bloch (1930)에 의해 확립됨.", "connections": "매그논, 자기 상호작용의 정량적 분석."}], "english_summary": ["The study examines the anisotropy of spin waves in field-polarized Fe-doped MnSi.", "It focuses on the magnetic interactions governing topological phases like skyrmions.", "The results provide insights into the underlying energy scales of chiral magnets.", "Experimental magnetic excitation spectra are analyzed for varying dopant concentrations."]}}, {"title": "Composition-dependent bulk properties in intercalated transition metal dichalcogenides Co1/3(1±δ)NbS2", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/vl26-p4lg", "authors": "Woonghee Cho, Kiwan Nam, Yeochan An, et al.", "last_authors": "Kee Hoon Kim, Je-Geun Park", "summary": "We report a systematic study of the composition-dependent bulk properties in $\\mathrm{C}{\\mathrm{o}}_{1/3(1±δ)}\\mathrm{Nb}{\\mathrm{S}}_{2}$ single crystals across a series of precisely controlled cobalt compositions with $−4%≤δ≤8%$. By tuning the cobalt stoichiometry, we find that the topological Ha…", "tier": "B_IMPORTANT_CONDMAT", "score": "7", "reason": "Experimental study of intercalated TMDs and topological Hall effect, relevant to magnetic topological materials.", "tags": ["material", "TMD", "transport"], "image": "", "briefing": {"background": "NbS2와 같은 층상 전이금속 디칼코게나이드(TMD)에 전이금속을 삽입하면 자성이나 위상학적 특성이 크게 변합니다. 특히 112 구조 TMD는 자기 위상학적 물질로 주목받고 있습니다.", "motivation": "Co가 삽입된 NbS2(Co1/3NbS2) 시스템에서 Co 함량의 미세한 변화(δ)가 위상학적 홀 효과(THE)와 같은 벌크 물성에 미치는 영향을 체계적으로 측정하고자 합니다.", "result": "Co 농도 조절에 따라 위상학적 홀 효과가 민감하게 변하며, 결정 구조적 불균일성이 자성 및 전하 수송에 결정적인 역할을 함을 밝혔습니다.", "implication": "위상학적 소자를 구현할 때 화학적 조성 제어가 얼마나 중요한지 보여주며, 물질 설계의 정밀도를 향상시킬 필요성을 강조합니다.", "novelty": "단순한 물질 합성이 아닌, 매우 정밀하게 제어된 조성 변화를 통해 위상학적 홀 효과의 변동성을 정량화했습니다.", "unresolved": "왜 특정 조성에서 위상학적 홀 효과가 극대화되는지에 대한 미시적 자성 배열(스핀 텍스처)의 직접적인 이미징은 여전히 과제로 남아있습니다.", "future_work": "로렌츠 투과전자현미경을 이용한 스핀 텍스처 관찰이나 스핀 편극 ARPES를 통한 image": "", "briefing": {"background": "벌집 격자 구조의 자기 물질에서 궤도와 스핀의 얽힘을 통해 나타나는 'Kitaev 상호작용'은 양자 스핀 액체 구현을 위한 핵심 요소로 연구되어 왔습니다.", "motivation": "Na3Co2SbO6는 Kitaev 후보 물질이지만, 실제 결정 구조의 비대칭성과 결정장 효과가 자기적 특성에 미치는 영향이 명확히 규명되지 않았습니다.", "result": "XAS 및 XMCD 측정을 통해 이 물질의 국소 전자 구조를 분석하였으며, 지배적인 삼각 결정장 외에 미세한 대칭성 깨짐이 존재함을 확인했습니다.", "implication": "이러한 미세한 국소 격자 왜곡을 고려함으로써 실험적으로 관찰된 면내 자기 이방성을 일관되게 설명할 수 있게 되었습니다.", "novelty": "Kitaev 물리학에서 국소 왜곡의 중요성을 강조하며, 고정밀 분광학 데이터와 다중항 계산을 결합해 실제 화합물의 전자 구조를 정밀하게 재구성했습니다.", "unresolved": "이러한 결정장 효과가 Kitaev 양자 스핀 액체 상태를 어느 정도까지 억제하거나 변화시키는지에 대한 직접적인 논의는 부족합니다.", "future_work": "저온 중성자 산란이나 비탄성 산란을 통해 자기 여기 상태를 관측하여 이 모델의 타당성을 추가 검증할 필요가 있습니다.", "concepts": [{"term": "Kitaev candidate", "why_emerged": "키타예프 모델의 양자 스핀 액체 상태를 실험적으로 구현하기 위해 강한 스핀-궤도 결합과 벌집 격자 구조를 가진 물질이 필요함.", "origin": "Alexei Kitaev (2006)", "connections": "H3LiIr2O6, RuCl3 등 자기 절연체 연구와 연결됨."}, {"term": "XAS (X-ray Absorption Spectroscopy)", "why_emerged": "원소 선택적으로 국소 전자 상태와 점유된/비점유된 궤도 정보를 얻기 위해 개발됨.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "XMCD, RIXS 등 분광학 기술의 기초가 됨."}], "english_summary": ["High-precision XAS/XMCD study on Na3Co2SbO6.", "Identified dominant trigonal crystal field with subtle symmetry deviations.", "Lower local symmetry explains in-plane magnetization anisotropy.", "Emphasizes the role of local distortions in Kitaev physics."]}}, {"title": "Finite-momentum bound pairs of two electrons in an altermagnetic metal", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/whw7-hdtg", "authors": "Hui Hu, Zhao Liu, Jia Wang, Xia-Ji Liu", "last_authors": "Jia Wang, Xia-Ji Liu", "summary": "We solve the two-electron problem on a square lattice with $d$-wave altermagnetism, considering both on-site and nearest-neighbor attractive interactions. The altermagnetic spin-splitting in the single-particle dispersion naturally gives rise to a ground state of two-electron bound pairs with nonzer…", "tier": "B_IMPORTANT_CONDMAT", "s
