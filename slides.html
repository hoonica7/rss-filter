<title>Daily Paper Slideshow</title>
<style>
  :root {
    color-scheme: light;
    --bg: #f6f7f4;
    --paper: #ffffff;
    --ink: #111827;
    --muted: #64748b;
    --line: #d8ddd2;
    --accent: #176b87;
    --accent-2: #9a3412;
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; overflow: auto; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: var(--bg); color: var(--ink); }
  .shell { max-width: 1500px; min-height: 100vh; margin: 0 auto; padding: 14px 18px; display: flex; flex-direction: column; }
  .topbar { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 16px; }
  .top-actions { display: flex; align-items: center; gap: 10px; }
  .topbar a, button { border: 1px solid var(--line); border-radius: 8px; background: var(--paper); color: var(--ink); padding: 10px 14px; font-weight: 700; text-decoration: none; cursor: pointer; }
  button.primary { background: var(--accent); border-color: var(--accent); color: white; }
  button:disabled { opacity: 0.45; cursor: not-allowed; }
  .counter { color: var(--muted); font-weight: 700; }
  .slide { min-height: calc(100vh - 82px); background: var(--paper); border: 1px solid var(--line); border-radius: 10px; padding: 18px; box-shadow: 0 18px 42px rgba(15, 23, 42, 0.10); display: grid; grid-template-columns: minmax(310px, 0.86fr) minmax(0, 1.55fr); gap: 18px; overflow: visible; }
  .paper-head { min-width: 0; min-height: 0; overflow: visible; display: flex; flex-direction: column; gap: 12px; }
  .figure { margin: 0; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: #f8fafc; }
  .figure img { display: block; width: 100%; max-height: 41vh; object-fit: contain; background: white; }
  .figure figcaption { padding: 7px 10px; color: var(--muted); font-size: 12px; line-height: 1.3; }
  .head-text { display: flex; flex-direction: column; gap: 9px; min-width: 0; }
  .badges { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .badge { border-radius: 999px; padding: 5px 9px; background: #eef2ff; color: #3730a3; font-size: 12px; font-weight: 800; }
  .score { background: #fee2e2; color: #991b1b; }
  h1 { margin: 0; font-size: 25px; line-height: 1.15; letter-spacing: 0; overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
  h1 a { color: inherit; text-decoration-color: rgba(23, 107, 135, 0.35); text-decoration-thickness: 2px; text-underline-offset: 4px; }
  h1 a:hover { color: var(--accent); text-decoration-color: var(--accent); }
  .meta, .authors, .why, .abstract { font-size: 13px; line-height: 1.45; }
  .meta, .authors { color: var(--muted); }
  .why strong, .abstract strong, .authors strong { color: var(--ink); }
  .authors { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .why { border-left: 4px solid var(--accent-2); padding-left: 10px; color: #374151; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .abstract { border-top: 1px solid var(--line); padding-top: 14px; color: #374151; }
  .original-abstract { border-top: 1px solid var(--line); padding-top: 10px; color: #374151; font-size: 11.5px; line-height: 1.35; overflow-wrap: anywhere; }
  .original-abstract strong { display: block; margin-bottom: 4px; color: var(--ink); }
  .tags { display: flex; flex-wrap: wrap; gap: 8px; }
  .tag { border-radius: 999px; padding: 4px 8px; background: #f1f5f9; color: #475569; font-size: 12px; font-weight: 700; }
  .head-text > .link { display: none; }
  .briefing { min-width: 0; min-height: 0; overflow: visible; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); grid-auto-rows: minmax(0, auto); align-content: start; gap: 11px 18px; border-top: 0; padding-top: 0; }
  .brief-section { min-width: 0; }
  .brief-section.wide { grid-column: 1 / -1; }
  .brief-section h2 { margin: 0 0 4px; font-size: 14px; line-height: 1.22; color: #0f766e; letter-spacing: 0; }
  .brief-section p, .brief-section li { margin: 0; font-size: 12.5px; line-height: 1.42; color: #1f2937; overflow-wrap: anywhere; }
  .brief-section ul { margin: 0; padding-left: 20px; }
  .concepts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 9px 14px; }
  .concept { border-top: 1px solid var(--line); padding-top: 7px; }
  .concept h3 { margin: 0 0 4px; font-size: 13px; color: #7c2d12; letter-spacing: 0; }
  .concept p { margin: 2px 0 0; font-size: 11.5px; line-height: 1.35; color: #374151; overflow-wrap: anywhere; }
  .concept b { color: #111827; }
  .link { color: var(--accent); font-weight: 800; text-decoration: none; }
  .empty { padding: 48px; background: var(--paper); border: 1px solid var(--line); border-radius: 12px; color: var(--muted); }
  @media (max-width: 860px) {
    .shell { padding: 14px; }
    .topbar, .top-actions { align-items: stretch; flex-direction: column; }
    .slide, .briefing, .concepts { grid-template-columns: 1fr; }
    .slide { min-height: auto; overflow: visible; display: grid; }
    h1 { font-size: 28px; }
  }
</style>

<script>
const slides = [{"title": "Correlation-driven origin of shallow electron pocket in Co1/3TaS2 revealed by ARPES and cluster perturbation theory", "journal": "PRB_Recent", "source": "keyword", "link": "http://link.aps.org/doi/10.1103/6y9w-lx94", "authors": "Wojciech Sas, Yuki Utsumi Boucher, Seyed Ashkan Moghadam Ziabari, et al.", "last_authors": "Ivo Batistić, Petar Popčević", "summary": "We investigate the electronic structure and Fermi surface of ${\\mathrm{Co}}_{1/3}{\\mathrm{TaS}}_{2}$ using angle-resolved photoemission spectroscopy (ARPES) combined with theoretical modeling beyond standard density functional theory ($\\mathrm{DFT}+\\mathrm{U}$). A shallow electron pocket, the so-cal…", "tier": "A_MUST_READ", "score": "10", "reason": "title strong match: ARPES", "tags": ["ARPES", "angle-resolvedphotoemission", "photoemission", "Fermisurface"], "image": "", "briefing": {"background": "자성 원자가 층간 삽입된 전이금속 디칼코게나이드(TMD)는 자성과 전자 구조의 상호작용을 연구하기에 적합한 플랫폼입니다. 특히 2H-TaS2와 같은 물질에 자성체인 Co를 삽입하면 격자 구조의 대칭성 변화와 함께 새로운 전자 상태가 나타납니다.", "motivation": "Co1/3TaS2에서 관찰되는 얕은 전자 포켓인 '베타(beta) 형상'의 기원에 대해 학계의 논란이 있었습니다. 유사한 NbS2 기반 물질에서 이것이 표면 효과인지 혹은 벌크의 고유한 성질인지 명확하지 않았으며, 일반적인 DFT 계산으로는 이를 재현하기 어려웠습니다.", "result": "ARPES 측정과 클러스터 섭동 이론(CPT)을 결합하여 분석한 결과, 이 베타 포켓이 Co 사이트의 강한 전자 상관관계(correlation)에 기인한 벌크 상태임을 입증했습니다. 또한 Co 함량을 줄인 시료(Co0.22TaS2)에서는 장거리 질서가 깨지면서 이 특징이 사라지는 것을 확인했습니다.", "implication": "삽입된 자성 원자의 농도와 결정학적 질서가 페르미 면의 미세 구조를 결정하는 결정적인 요인임을 시사합니다. 이는 단순한 전하 이동 모델을 넘어선 강상관 효과의 중요성을 보여줍니다.", "novelty": "TaS2 계열에서 베타 포켓을 실험적으로 처음 관찰하였으며, DFT+U로 설명되지 않던 부분을 CPT라는 고급 이론 기법을 통해 성공적으로 해석해 낸 점이 돋보입니다. 독자의 ARPES 및 DFT+DMFT(또는 상관관계 이론) 관심사와 매우 밀접합니다.", "unresolved": "Co 이외의 다른 전이금속(Cr, Ni 등)이 삽입된 경우에도 동일한 상관관계 기반 메커니즘이 지배적인지에 대한 비교 연구가 더 필요합니다.", "future_work": "온도 변화에 따른 상관관계 효과의 진화나, 외부 자기장을 통한 전자 포켓의 변조 가능성을 확인하는 실험이 이어질 것으로 예상됩니다.", "concepts": [{"term": "Cluster Perturbation Theory (CPT)", "why_emerged": "강한 전자 상관관계가 있는 시스템에서 단거리 상관관계를 정확하게 다루면서도 거시적인 밴드 구조를 계산하기 위해 개발되었습니다.", "origin": "David Senechal 등이 2000년대 초반에 제안하고 발전시킴.", "connections": "Hubbard 모델, DMFT, Exact Diagonalization"}, {"term": "Intercalated TMDs", "why_emerged": "기존 2D 층상 구조 물질의 물성을 조절하거나 새로운 자성 상태를 유도하기 위해 층 사이에 이종 원자를 삽입하기 시작했습니다.", "origin": "초록 정보만으로는 특정하기 어려움 (반세기 이상의 연구 역사).", "connections": "Charge Density Wave (CDW), 초전도체, 스핀트로닉스"}, {"term": "Beta feature (electron pocket)", "why_emerged": "삽입 물질의 페르미 면에서 기존 호스트 물질에는 없던 새로운 전자 상태가 특정 대칭점 근처에서 관찰되면서 주목받았습니다.", "origin": "주로 Co/Cr0.33NbS2 등의 연구에서 처음 보고됨.", "connections": "Fermi surface reconstruction, Charge transfer"}, {"term": "DFT+U", "why_emerged": "표준적인 밀도 범함수 이론(DFT)이 d-오비탈이나 f-오비탈을 가진 강상관 시스템의 밴드 갭이나 국소 전자 상태를 과소평가하는 문제를 해결하기 위해 도입되었습니다.", "origin": "Anisimov 등에 의해 1990년대 초반 제안됨.", "connections": "LDA, GGA, Strong correlation"}], "english_summary": ["ARPES and CPT reveal a shallow electron pocket (beta feature) in Co1/3TaS2.", "The study proves this feature is a correlation-driven bulk state rather than a surface effect.", "Long-range crystallographic order of Co atoms is essential for maintaining the coherent pocket.", "Comparison with reduced Co-content samples confirms the role of local correlations and orbital character."]}}, {"title": "Correlated Insulator at the Surface of the Polar Metal Ca3Ru2O7", "journal": "PRL_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/x9gh-xxwb", "authors": "Daniel Halliday, Izidor Benedičič, Andela Zivanovic, et al.", "last_authors": "Phil D. C. King, Peter Wahl", "summary": "We investigate the electronic structure at the surface of the correlated oxide Ca 3 Ru 2 O 7 , a low-symmetry ruthenate oxide which hosts an unconventional polar-metal phase. From a combination of angle-resolved photoemission spectroscopy and scanning tunneling spectroscopy measurements, we demonstrate that the surface hosts an insulating phase, a distinct departure from metallicity within the bulk. Utilizing quantitative low-energy electron diffraction in conjunction with electronic structure calculations, we show how this results from a combined surface structure relaxation and the impact of marked electronic correlations in this system. Our findings highlight the proximity of Ca 3 Ru 2 O 7 to an insulating metallic state, and illustrate how subtle structural distortions can control its emergent electronic phases.", "tier": "A_MUST_READ", "score": "10", "reason": "Direct hit: Combined ARPES and STM/STS on a correlated oxide surface; highly relevant material.", "tags": ["ARPES", "STM", "Ca3Ru2O7", "correlatedoxides"], "image": "", "briefing": {"background": "Ca3Ru2O7은 금속성과 결정의 극성(polar) 구조가 공존하는 희귀한 '극성 금속' 물질입니다. 이러한 물질은 구조적 왜곡과 전자 상관관계가 얽혀 있어 복잡한 상전이 현상을 나타냅니다.", "motivation": "벌크 상태에서는 금속성을 유지하지만, 결정의 대칭성이 깨지는 표면에서 이 물질의 전자 구조가 어떻게 변하는지, 그리고 그것이 구조적 이완(relaxation)과 어떤 상관관계가 있는지 밝히고자 했습니다.", "result": "ARPES와 STM/STS를 결합하여 측정한 결과, Ca3Ru2O7의 표면이 벌크의 금속성 대신 '강상관 부도체(correlated insulator)' 상태를 형성하고 있음을 발견했습니다. LEED와 계산을 통해 표면 원자의 구조적 이완이 전자 상관관계를 증폭시켜 이러한 부도체 전이를 유도함을 규명했습니다.", "implication": "극성 금속의 물성이 외부 환경이나 계면 상태에 매우 민감하게 반응할 수 있음을 보여주며, 미세한 구조 제어를 통해 금속-부도체 전이를 조절할 가능성을 제시합니다.", "novelty": "ARPES(운동량 공간)와 STM(실공간) 정보를 동시에 활용하여 극성 금속 표면의 특이 상태를 완벽하게 기술했습니다. 루테네이트(ruthenate) 시스템의 복합적인 상호작용을 다루고 있어 독자의 핵심 관심 분야에 부합합니다.", "unresolved": "표면 부도체 상태가 시료의 온도 변화나 외부 전기장에 의해 다시 금속으로 돌아올 수 있는지(가역성)에 대한 검증이 남아 있습니다.", "future_work": "다양한 두께의 박막 실험이나 헤테로 구조 접합을 통해 표면 부도체화 현상을 응용하는 연구가 기대됩니다.", "concepts": [{"term": "Polar Metal", "why_emerged": "일반적으로 금속의 자유 전자는 내부 전기장을 차폐하여 극성을 없애지만, 특정 구조에서는 금속성과 비중심대칭 구조가 공존할 수 있어 신소재 후보로 주목받았습니다.", "origin": "Anderson과 Blount가 1965년에 이론적으로 제안함.", "connections": "Inversion symmetry breaking, Weyl semimetals, Ferroelectricity"}, {"term": "Scanning Tunneling Spectroscopy (STS)", "why_emerged": "표면의 특정 위치에서 에너지에 따른 상태 밀도(LDOS)를 측정하여 국소적인 전자 밴드 갭이나 상태를 확인하기 위해 사용됩니다.", "origin": "Binnig와 Rohrer의 STM 발명 이후 발전됨 (1980년대).", "connections": "STM, Local density of states, Superconducting gap"}, {"term": "Ruthenates (Ru-based oxides)", "why_emerged": "스핀-궤도 결합과 전자 상관관계가 절묘하게 균형을 이루고 있어 비전형적 초전도, 자기적 정렬, 금속-부도체 전이 등 풍부한 물리 현상을 보여줍니다.", "origin": "초록 정보만으로는 특정하기 어려움 (Sr2RuO4 연구 등에서 확장됨).", "connections": "Sr2RuO4, Mott insulator, Spin-orbit coupling"}, {"term": "Surface Relaxation", "why_emerged": "결정이 표면에서 끊어질 때 원자들이 에너지를 최소화하기 위해 평형 위치에서 벗어나는 현상으로, 전자 밴드 구조를 크게 변화시킵니다.", "origin": "초록 정보만으로는 특정하기 어려움 (표면 과학의 기초 개념).", "connections": "LEED, Surface states, Strain engineering"}], "english_summary": ["Discovery of a correlated insulating state at the surface of the polar metal Ca3Ru2O7.", "Combined ARPES, STM/STS, and LEED study identifies surface relaxation as the driving force.", "The result highlights the sensitivity of polar metals to structural distortions.", "Strong electronic correlations are amplified by subtle surface-specific changes in bond lengths and angles."]}}, {"title": "Correlation-driven origin of shallow electron pocket in Co1/3TaS2 revealed by ARPES and cluster perturbation theory (Phys. Rev. B)", "journal": "arXiv_CondMat", "source": "keyword", "link": "https://arxiv.org/abs/2602.15588", "authors": "Wojciech Sas, Yuki Utsumi Boucher, Seyed Ashkan Moghadam Ziabari, et al.", "last_authors": "Ivo Batisti\\'c, Petar Pop\\v{c}evi\\'c", "summary": "We investigate the electronic structure and Fermi surface of Co$_{1/3}$TaS$_2$ using angle-resolved photoemission spectroscopy (ARPES) combined with theoretical modeling beyond standard density functional theory (DFT+U). A shallow electron pocket, the so-called $\\beta$ feature, is observed at the Fermi level near the corner of the superlattice Brillouin zone, representing the first experimental observation of this feature in an intercalated TaS$_2$ compound. Similar pockets have been reported in $X_{1/3}$NbS$_2$ ($X$ = Co, Cr, Ni), where their surface versus bulk origin remains actively debated. Because conventional DFT+U does not capture this feature, we employ cluster perturbation theory (CPT) to incorporate an explicit trea ", "link": "https://arxiv.org/abs/2607.19551", "authors": "Tyler Wu, Truman Idso, Siddharth Karkare, Tom\\'as Arias", "last_authors": "Siddharth Karkare, Tom\\'as Arias", "summary": "Photoemission is an escape problem, yet first-principles calculations usually trap the electron in a periodic box. We present a parameter-free \\emph{ab initio} framework that removes this artificial boundary by constructing open scattering states for semi-infinite crystal-vacuum interfaces from Wannier Hamiltonians and Green-function embedding. The method gives continuum-normalized time-reversed LEED final states with microscopic quasiparticle attenuation. For Ag(111), it predicts absolute quantum efficiency, vectorial photoemission, and mean transverse energy on the experimental scale.", "tier": "A_MUST_READ", "score": "9", "reason": "title strong match: photoemission", "tags": ["photoemission"], "image": "https://arxiv.org/html/2607.19551v2/figs/1d_partition.png", "briefing": {"background": "광전자 방출(Photoemission) 실험 결과인 ARPES 데이터를 정확히 해석하기 위해서는 이론적인 시뮬레이션이 필수적입니다. 하지만 기존의 제1원리 계산은 주기적인 경계 조건을 사용하므로, 전자가 고체 밖 진공으로 나가는 '탈출 과정'을 묘사하는 데 한계가 있었습니다.", "motivation": "반무한(semi-infinite) 결정과 진공 계면을 모델링하여 인위적인 경계 조건 없이 광전자의 산란 상태(scattering states)를 정확하게 계산하는 프레임워크를 개발하고자 했습니다.", "result": "워니어 해밀토니언(Wannier Hamiltonian)과 그린 함수 임베딩을 이용해 파라미터가 없는 ab-initio 방법론을 구축했습니다. 이를 Ag(111)면에 적용하여 절대 양자 효율과 벡터 광전자 방출 등을 실험 수준으로 정확하게 예측했습니다.", "implication": "ARPES 데이터의 강도(intensity) 분포와 매트릭스 엘리먼트 효과를 훨씬 정밀하게 계산할 수 있게 되어, 실험 데이터에서 미세한 전자 구조 정보를 추출하는 능력이 향상될 것입니다.", "novelty": "기존의 박스 가두기 식의 계산에서 벗어나 실제 실험 상황과 유사한 '열린 계'에서의 산란 상태를 구현했다는 점이 혁신적입니다. 독자의 ARPES 및 전자 구조 계산 관심사와 밀접합니다.", "unresolved": "복잡한 강상관 계(strongly correlated systems)에서도 이 방법론이 어느 정도의 정확도를 유지할지는 검증이 필요합니다.", "future_work": "이 방법론을 위상 절연체나 복잡한 다층 구조에 적용하여 실제 ARPES 스펙트럼과 직접 비교하는 연구가 진행될 것입니다.", "concepts": [{"term": "Scattering States (산란 상태)", "why_emerged": "계의 경계 밖으로 퍼져나가는 입자의 거동을 설명하기 위해 양자역학에서 필수적입니다.", "origin": "초록 정보만으로는 특정하기 어려움", "c uthors": "Shu Guo, Ruidan Zhong", "summary": "The pursuit of geometrically frustrated lattices beyond conventional paradigms remains a central challenge in the design of quantum materials. Herein, we report the discovery of the A3V9Te13 (A = Cs, Rb) family of vanadium-based intermetallic compounds, which host a unique two-dimensional Mosaic lattice derived from the Kagome network, composed of an ordered tessellation of triangles, squares, and pentagons. The Cs compound (CVT) exhibits strong electronic correlations, characterized by non-Fermi liquid behavior at low temperatures, an exceptionally large Sommerfeld coefficient, and a bulk phase transition at T* $\\approx$ 47 K with possible charge- or spin-related origin. Inspired by pressure-tuning in related Kagome systems, we demonstrate that the electronic ground state of this lattice is exquisitely tunable via chemical pressure. Systematic substitution of Cs with smaller Rb ions suppresses the T* phase transition and the correlated electronic response, ultimately driving the system into a highly frustrated semiconducting ground state without long-range magnetic order down to 60 mK. This work unveils a new structural platform for exploring the interplay between geometric frustration and strong electron correlations, providing a chemically controllable platform for exploring the phase space between distinct correlated electronic states.", "tier": "B_IMPORTANT_CONDMAT", "score": "10", "reason": "Discovery of new vanadium-based kagome-derived lattices with tunable correlations and phase transitions.; demoted from A: broad CM, not direct user/project hit", "tags": ["kagome", "vanadium", "correlated"], "image": "https://arxiv.org/static/browse/0.3.4/images/arxiv-logo-fb.png", "briefing": {"background": "카고메 격자는 기하학적 좌절과 특이한 밴드 구조(플랫 밴드, 디락 콘)로 유명하지만, 이를 변형한 새로운 기하학적 구조에서도 흥미로운 양자 물성이 나타날 수 있습니다. 특히 바나듐(V) 기반의 화합물은 강한 상관관계와 위상학적 특성을 동시에 탐구하기에 적합합니다.", "motivation": "전형적인 카고메 격자를 넘어선 '모자이크(Mosaic) 격자'라는 새로운 구조적 플랫폼을 발견하고, , not direct user/project hit", "tags": ["experiment", "CsV3Sb5", "kagome"], "image": "https://arxiv.org/html/2609.03513v1/Fig/high_t_new_t.png", "briefing": {"background": "CsV3Sb5 카고메 금속에서 Sb 자리에 Sn을 도핑하면 전하 밀도 파동(CDW)이 억제되고 초전도성이 강화되는 특이한 양상 체계가 나타납니다. 이러한 변화의 미시적 원인이 격자 구조의 국부적 변형인지 혹은 전자 구조의 직접적인 변화인지는 여전히 논쟁 중입니다.", "motivation": "Sn 치환이 CsV3Sb5의 격자 불안정성과 전자적 불안정성에 미치는 영향을 원자 스케일에서 규명하기 위해 NQR(핵사중극자공명) 실험과 DFT 계산을 결합하여 연구를 수행했습니다.", "result": "Sn 도핑 초기부터 국부적인 격자 왜곡이 발생하며, 이는 실온까지 유지됨을 확인했습니다. 특히 Sn이 완전히 도핑된 가상의 x=1 케이스에서 바나듐 트리머(V-trimers) 구조가 형성되는데, 층간 위상 차이(0 또는 π)에 따라 에너지적으로 거의 대등한 두 가지 구조가 경쟁하며 존재할 수 있음을 계산으로 밝혀냈습니다.", "implication": "Sn 도핑은 단순히 캐리어를 주입하는 것을 넘어, 국부적인 불순물 유도 왜곡과 거시적인 구조적 불안정성 간의 복잡한 상호작용을 일으킵니다. 이는 카고메 금속의 상도표가 구조적 경쟁 상태에 놓여 있음을 시사합니다.", "novelty": "NQR이라는 국부 탐침 도구를 사용하여 Sn 주위의 국부 왜곡을 직접 관찰했다는 점과, 층간 위상 차이에 따른 구조적 경쟁을 DFT로 구체화했다는 점이 돋보입니다. 독자의 주요 프로젝트 물질인 CsV3Sb5를 직접 다룹니다.", "unresolved": "이러한 국부적 왜곡이 초전도 쌍 형성(pairing)에 긍정적인 역할을 하는지, 혹은 단순히 CDW를 방해하여 초전도를 돕는 것인지에 대한 추가 논의가 필요합니다.", "future_work": "다양한 Sn 농도에서의 층간 상관관계 측정 및 STM을 통한 국부적인 트리머 구조의 직접 이미징 연구가 뒤따를 것으로 보입니다.", "concepts": [{"term": "NQR (Nuclear Quadrupole Resonance)", "why_emerged": "외부 자기장 없이 핵의 사중극자 모멘트와 주변 전하 분포 간의 상호작용을 통해 국부적인 화학적/구조적 환경을 민감하게 측정하기 위해 사용.", "origin": "Hans Dehmelt (1940년대 말)", "connections": "NMR, Local structural distortion, Charge order probe."}, {"term": "V-trimers", "why_emerged": "카고메 격자에서 CDW가 형성될 때 바나듐 원자들이 서로 가까워지며 형성하는 군집 구조를 설명하기 위해 등장.", "origin": "초록 정보만으로는 특정하기 어려움 (AV3Sb5 CDW 연구에서 일반화됨)", "connections": "David-star pattern, Inverse David-star, Structural phase transition."}, {"term": "Structural Instability", "why_emerged": "특정 온도나 압력 조건에서 격자 구조가 더 낮은 에너지 상태로 변하려는 성질을 설명하기 위해 필요함.", "origin": "초록 정보만으로는 특정하기 어려움 (고체물리학 기본 개념)", "connections": "Phonon softening, Phase transition, Peierls instability."}], "english_summary": ["The study examines the effect of Sn substitution on the lattice instabilities of CsV3Sb5 using NQR and DFT.", "Sn induces 관관계는 추가 연구가 필요해 보입니다.", "future_work": "다른 R-Mn6Sn6 (R=희토류) 계열 물질로의 확장 연구 및 외부 자극(펌프 광)의 세기에 따른 비평형 상태의 위상 전이 제어 연구가 기대됩니다.", "concepts": [{"term": "Spin Reorientation", "why_emerged": "자기 이방성 에너지가 온도나 자기장에 따라 변하면서 자화의 용이축이 바뀌는 현상을 설명하기 위해 도입되었습니다.", "origin": "고전적인 자성학 연구에서 확립된 개념임.", "connections": "Spin-orbit coupling, Magnetic anisotropy, Phase transitions."}, {"term": "Kagome Ferrimagnet", "why_emerged": "카고메 격자의 기하학적 좌절(frustration)과 강자성/반강자성 결합이 공존하는 계를 연구하기 위해 등장했습니다.", "origin": "카고메 격자 구조를 가진 Mn 기반 금속 화합물 연구군.", "connections": "Chern insulator, Weyl nodes, TbMn6Sn6."}, {"term": "Intrinsic Timescale", "why_emerged": "물질 내부의 근본적인 상호작용(교환 상호작용 등)에 의해 결정되는 물리적 변화의 속도 한계를 이해하기 위해 필요합니다.", "origin": "Ultrafast laser spectroscopy 기술의 발달과 함께 중요해짐.", "connections": "Ultrafast dynamics, Spintronics, Pump-probe technique."}], "english_summary": ["This study presents the first direct measurement of the intrinsic spin reorientation timescale in the kagome ferrimagnet TbMn6Sn6.", "The researchers utilized ultrafast optical techniques to capture the dynamic response of the spin system.", "The results provide critical speed parameters for potential spintronic and quantum technology applications using topological kagome magnets."]}}, {"title": "Fermi surface studies of altermagnetic CrSb from Shubnikov–de Haas oscillations", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/j77q-p4ch", "authors": "Sajal Naduvile Thadathil, Beat Valentin Schwarze, Jaafar Ansari, et al.", "last_authors": "Jochen Wosnitza, Toni Helm", "summary": "The authors present here results from electrical magnetotransport measurements on microstructures of altermagnetic CrSb in pulsed fields up to 68 T. They study the temperature and field-orientation dependence of magnetic quantum oscillations in combination with first-principles calculations. The observed frequency spectrum agrees well with density functional theory calculations that take spin-orbit coupling into account, without invoking significant a d h o c band shifts. The findings validate the predicted electronic band structure of CrSb hosting multiple semimetallic bands and a locally alternating spin polarization.", "tier": "B_IMPORTANT_CONDMAT", "score": "9", "reason": "High-field transport study on altermagnets; very relevant to the experimental user profile.", "tags": ["altermagnet", "transport", "Fermisurface"], "image": "", "briefing": {"background": "알터자성(Altermagnetism)은 최근 정의된 자성 상태로, 반강자성체처럼 순 자화값은 0이지만 강자성체처럼 운동량 공간에서 스핀 할당(spin splitting)이 일어나는 독특한 특성을 가집니다. CrSb는 이러한 알터자성을 나타내는 대표적인 후보 물질입니다.", "motivation": "CrSb의 전자 구조와 페르미 면(Fermi surface)이 이론적 예측과 일치하는지, 특히 알터자성 특유의 스핀 분할이 실제 밴드 구조에 어떻게 반영되어 있는지를 실험적으로 검증하고자 했습니다.", "result": "최대 68T의 강자기장 하에서 슈브니코프-드 하스(SdH) 양자 진동을 관찰했습니다. 실험에서 얻은 진동 주파수 스펙트럼이 별도의 밴드 시프트 조정 없이도 스핀-궤도 결합(SOC)을 고려한 DFT 계산 결과와 매우 잘 일치함을 확인했습니다.", "implication": "CrSb가 여러 개의 준금속(semimetallic) 밴드를 가지며 국부적으로 교차하는 스핀 편극을 보유하고 있다는 이론적 예측을 강력하게 뒷받침합니다. 이는 알터자성체의 전송 특성을 이해하는 기반이 됩니다.", "novelty": "최신 관심사인 알터자성체 CrSb의 페르미 면을 강자기장 수송 측정을 통해 직접 매핑하고 이론과 대조했다는 점이 중요합니다. ARPES 데이터가 부족할 수 있는 상황에서 상호보완적인 강력한 증거를 제시합니다.", "unresolved": "실험적으로 관찰된 다수의 주파수 성분 중 스핀 분할(spin splitting)에 의한 미세 구조를 더 명확히 분리해내는 정밀한 분석이 향후 과제로 남습니다.", "future_work": "다양한 결정 방향에 따른 각도 의존성 SdH 측정 및 자기 광학 효과를 이용한 스핀 분할의 직접적인 관찰 연구가 이어질 것으로 보입니다.", "concepts": [{"term": "Altermagnetism", "why_emerged": "전통적인 강자성과 반강자성으로 분류되지 않는, 시간에너지 대칭성이 깨진 비공성(non-relativistic) 스핀 분할 시스템을 설명하기 위해 등장했습니다.", "origin": "L. Šmejkal, J. Sinova, R. Jungwirth 등에 의해 최근 이론적으로 정립됨.", "connections": "Antiferromagnetism, Spin-splitting, Berry curvature."}, {"term": "Shubnikov–de Haas (SdH) oscillations", "why_emerged": "강자기장에서 금속의 전도도가 자기장의 역수에 비례하여 진동하는 현상을 통해 페르미 면의 단면적을 측정하기 위해 사용됩니다.", "origin": "1930년 Lev Shubnikov와 Wander de Haas에 의해 발견됨.", "connections": "Quantum oscillations, Fermi surface mapping, Landau levels."}, {"term": "CrSb", "why_emerged": "높은 네엘 온도를 가지며 뚜렷한 알터자성 밴드 구조를 가질 것으로 예측되어 모델 물질로 선택되었습니다.", "origin": "초록 정보만으로는 특정하기 어려움 (전통적인 NiAs 구조 화합물).", "connections": "Altermagnetism, Itinerant antiferromagnetism."}], "english_summary": ["Magnetotransport measurements in pulsed fields up to 68 T were performed to study the Fermi surface of altermagnetic CrSb.", "The observed Shubnikov–de Haas oscillations perfectly match DFT calculations accounting for spin-orbit coupling without manual band shifts.", "The study validates the predicted electronic structure of CrSb as an altermagnet hosting multiple semimetallic bands."]}}, {"title": "Orbital-selective Mott and antiferromagnetic phases in diagonally compressed kagome lattice", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/ml9d-pzwl", "authors": "Jiewei Ding, Ho-Kin Tang, Wing Chi Yu", "last_authors": "Ho-Kin Tang, Wing Chi Yu", "summary": "We perform determinant quantum Monte Carlo simulations of the half-filled Hubbard model on a diagonally compressed kagome lattice, introducing exponential decay long-range hopping $t(r)={t}_{0}exp\\left(−r/{r}_{0}\\right)$ to account for the evolving bond length. By varying the lattice angle $θ$ and t…", "tier": "B_IMPORTANT_CONDMAT", "score": "9", "reason": "Highly relevant theory for correlated phases in kagome lattices, directly impacting user's project interests.; demoted from A: broad CM, not direct user/project hit", "tags": ["theory", "material", "kagome", "correlated"], "image": "", "briefing": {"background": "카고메 격자 물질은 기하학적 좌절과 평탄 밴드(flat band)로 인해 전자 간의 상관관계가 극대화될 수 있는 시스템입니다. 최근 AV3Sb5 계열에서 발견된 다양한 상(CDW, 초전도 등)으로 인해 격자 변형과 상관관계의 상호작용에 대한 관심이 높습니다.", "motivation": "카고메 격자에 '대각선 압축(diagonal compression)'이라는 비대칭적 변형이 가해졌을 때, 전자-전자 상호작용(Hubbard U)이 유도하는 상전이와 궤도 선택적 현상을 이론적으로 규명하고자 했습니다.", "result": "결정 구조의 각도 변화와 장거리 호핑(hopping)을 고려한 DQMC 시뮬레이션 결과, 특정 조건에서 '궤도 선택적 모트 절연체(Orbital-selective Mott phase)'와 반강자성 상이 나타남을 발견했습니다.", "implication": "격자의 대칭성을 깨뜨리는 물리적 변형(strain)이 카고메 물질의 모트 물리와 자기 구조를 제어하는 유효한 수단이 될 수 있음을 시사합니다.", "novelty": "단순한 허바드 모델을 넘어 비대칭 압축과 장거리 호핑 효과를 포함하여 카고메 격자의 전자 상태도를 정밀하게 계산했다는 점이 돋보입니다. 독자가 관심을 갖는 AV3Sb5의 네마틱성이나 격자 변형 효과와 이론적으로 연결될 수 있는 주제입니다.", "unresolved": "이론적 모델에서 예측된 궤도 선택적 모트 상이 실제 물질(예: 압력을 가한 카고메 금속)에서 실험적으로 어떻게 관찰될 수 있을지에 대한 구체적인 제안이 보강되어야 합니다.", "future_work": "도핑(non-half-filling) 변화에 따른 상전이 연구 및 본 연구에서 발견된 상들과 초전도 상 간의 경쟁 관계에 대한 연구가 유망합니다.", "concepts": [{"term": "Orbital-selective Mott phase (OSMP)", "why_emerged": "다중 궤도 계에서 특정 궤도의 전자는 절연체가 되고 다른 궤도의 전자는 금속성을 유지하는 복잡한 상관관계를 설명하기 위해 도입되었습니다.", "origin": "Anisimov 등에 의해 2002년경 제안됨.", "connections": "Hund's metal, Iron-based superconductors, Mott transition."}, {"term": "Determinant Quantum Monte Carlo (DQMC)", "why_emerged": "강상관 전자계의 다체 문제를 수치적으로 정확하게 계산하기 위해 개발된 알고리즘입니다.", "origin": "1981년 Blankenbecler, Scalapino, Sugar 등에 의해 정립됨.", "connections": "Hubbard model, Sign problem, Many-body physics."}, {"term": "Geometric Frustration", "why_emerged": "삼각형 기반 격자 구조에서 스핀들이 서로 반대 방향을 향하려 할 때 모든 결합을 동시에 만족시킬 수 없는 상황을 설명합니다.", "origin": "G. H. Wannier (1950) 등의 Ising 모델 연구.", "connections": "Spin liquid, Kagome lattice, Antiferromagnetism."}], "english_summary": ["Theoretical study using DQMC simulations on a diagonally compressed kagome Hubbard model.", "The inclusion of long-range hopping and lattice distortion reveals orbital-selective Mott and antiferromagnetic phases.", "Results suggest that symmetry-breaking strain is a powerful tool to tune electronic correlations and magnetism in kagome lattices."]}}, {"title": "Kagomelike Bands in Graphene/WSe2 Heterostructure Realized by Strong Interlayer Hybridization", "journal": "PRL_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/jw4w-2jbm", "authors": "Ruo-Han Zhang, Jiang-Hui Pan, Ya-Ning Ren, et al.", "last_authors": "Ji Feng, Lin He", "summary": "In two-dimensional (2D) van der Waals (vdW) structures, the twist angle between adjacent layers has emerged as a pivotal parameter for engineering electronic band structures. This is vividly exemplified by the discovery of an extensive array of correlated and topological phases in 2D moiré systems. …", "tier": "B_IMPORTANT_CONDMAT", "score": "9", "reason": "Directly relevant kagome-like band engineering in a van der Waals heterostructure.; demoted from A: broad CM, not direct user/project hit", "tags": ["kagome", "graphene", "heterostructure", "electronic-structure"], "image": "", "briefing": {"background": "2차원 반데르발스(vdW) 물질들을 쌓고 비트는 기술은 전자 밴드 구조를 조절하여 평탄 밴드(flat band)나 위상적 상태를 만드는 핵심 수단으로 자리 잡았습니다.", "motivation": "기존의 모아레(moiré) 시스템은 주로 격자 불일치나 비틀림에 의한 주기적 포텐셜에 의존해 왔습니다. 본 연구는 그래핀과 WSe2의 이종 구조에서 층간 하이브리드화(interlayer hybridization)를 극대화하여 새로운 전자 구조를 유도하고자 했습니다.", "result": "그래핀과 WSe2 이종 구조에서 강한 층간 결합을 통해 카고메 격자(kagome lattice) 특유의 밴드 구조를 구현하는 데 성공했습니다. 이는 모아레 무늬를 넘어선 새로운 밴드 엔지니어링 경로를 제시합니다.", "implication": "이종 구조의 적층 방식과 결합 세기를 조절함으로써, 벌크 카고메 금속(AV3Sb5 등)에서만 보던 물리적 현상들을 인공적인 2차원 계면에서도 탐구할 수 있게 됩니다.", "novelty": "단순한 기하학적 비틀림이 아닌 '층간 하이브리드화'를 주된 기제로 사용하여 카고메 밴드를 생성했다는 점이 독창적입니다. 카고메 금속을 연구하는 독자의 관심사에 부합하는 새로운 플랫폼 제안입니다.", "unresolved": "초록상으로는 이 카고메 밴드가 실제 상관 관계(strong correlation)나 위상적 특성(Berry curvature 등)을 얼마나 강력하게 유도하는지에 대한 구체적인 전송 측정 결과가 부족해 보입니다.", "future_work": "이 시스템에서 ARPES를 통한 직접적인 밴드 매핑과, 초전도성 또는 자성과 같은 상관 현상의 발현 여부를 확인하는 후속 연구가 예상됩니다.", "concepts": [{"term": "Kagome Band", "why_emerged": "카고메 격자 구조에서 나타나는 평탄 밴드와 디락 지점 등의 특이한 전자 구조를 설명하기 위해 등장했습니다.", "origin": "일본의 전통 대바구니 패턴 이름에서 유래함.", "connections": "Frustrated magnetism, Flat band physics, AV3Sb5 compounds."}, {"term": "Interlayer Hybridization", "why_emerged": "서로 다른 2차원 층이 겹쳐졌을 때 각 층의 전자 궤도가 섞이며 새로운 에너지 상태를 만드는 현상을 설명하기 위함입니다.", "origin": "양자역학적 궤도 혼성 이론에 기반함.", "connections": "Band gap engineering, Moiré superlattices."}, {"term": "Moiré System", "why_emerged": "두 격자의 주기성 차이로 발생하는 거시적 패턴이 전자에 미치는 영향을 연구하기 위해 도입되었습니다.", "origin": "비틀린 이중층 그래핀(TBG) 연구에서 본격화됨.", "connections": "Magic angle graphene, Quantum simulators."}], "english_summary": ["Demonstrated kagome-like bands in Graphene/WSe2 heterostructures via strong interlayer hybridization.", "Moves beyond simple twist-angle engineering to utilize interfacial orbital mixing.", "Provides a new platform for studying kagome physics in 2D van der Waals systems.", "Potential for realizing correlated and topological phases in artificial structures."]}}, {"title": "Kinetic Kagome Magnetism: From Self-Trapping RVB Polarons to Semiclassical Correlations", "journal": "PRL_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/zbxv-vtq8", "authors": "Yufei Pei, Shuai A. Chen, Claudio Castelnovo, Roderich Moessner", "last_authors": "Claudio Castelnovo, Roderich Moessner", "summary": "A study of the counter-Nagaoka problem of a single hole in an infinite- U Hubbard model on the kagome lattice reveals a new type of polaron, a resonating-valence-bond polaron that morphs into semiclassical order as polarization is reduced.", "tier": "B_IMPORTANT_CONDMAT", "score": "9", "reason": "Theory of correlated electron physics and magnetism on the kagome lattice, highly relevant.", "tags": ["kagome", "theory", "Hubbardmodel", "stronglycorrelated"], "image": "", "briefing": {"background": "강하게 상관된 전자계(Strongly Correlated Systems)에서 전하 운반자(hole)의 이동과 국부적인 스핀 배열 사이의 상호작용은 자성 및 전송 특성을 결정하는 핵심 요소입니다.", "motivation": "무한한 쿨롱 상호작용(infinite-U)을 가진 허바드 모델(Hubbard model)의 카고메 격자에서, 구멍(hole) 하나가 시스템의 자성 정렬에 어떤 영향을 미치는지(counter-Nagaoka 문제)를 이해하고자 했습니다.", "result": "카고메 격자 내에서 구멍이 이동하며 형성하는 'RVB(Resonating Valence Bond) 폴라론'이라는 새로운 형태의 준입자를 발견했습니다. 이 폴라론은 스핀 분극이 낮아짐에 따라 반클래식한 상관관계로 전이됨을 확인했습니다.", "implication": "카고메 격자 기반 물질(AV3Sb5 등)에서 전하 운반자가 단순한 이동을 넘어 주변의 위상적/자성적 배경과 어떻게 상호작용하는지에 대한 이론적 토대를 제공합니다.", "novelty": "기존의 Nagaoka 강자성(삼각 격자 등에서 나타남)과 대비되는 카고메 격자만의 독특한 구멍 포획(self-trapping) 메커니즘을 규명했다는 점이 중요합니다.", "unresolved": "실제 실험 물질(AV3Sb5 등)은 무한한 U가 아닌 유한한 값을 가지므로, 실제 재료의 파라미터 내에서 이 폴라론이 얼마나 안정적인지는 추가 검증이 필요합니다.", "future_work": "이러한 RVB 폴라론이 다수의 전하 운반자가 있을 때 어떤 집단 현상(예: 초전도, 전하 밀도파)으로 이어지는지에 대한 연구가 필요합니다.", "concepts": [{"term": "RVB Polaron", "why_emerged": "강한 상관계에서 구멍이 주변의 스핀 액체 상태(RVB)와 결합하여 이동하는 복합적 상태를 묘사하기 위해 제안되었습니다.", "origin": "P. W. Anderson의 RVB 이론과 폴라론 개념의 합성.", "connections": "Quantum spin liquids, High-Tc superconductivity."}, {"term": "Infinite-U Hubbard Model", "why_emerged": "전자 간의 반발력이 매우 커서 한 격자점에 전자 두 개가 절대 올 수 없는 극한의 상관관계를 단순화하여 모델링하기 위해 도입되었습니다.", "origin": "John Hubbard (1963).", "connections": "Mott insulators, Nagaoka ferromagnetism."}, {"term": "Counter-Nagaoka Problem", "why_emerged": "특정 격자에서 구멍이 시스템을 강자성으로 만들지 않고 오히려 비자명한 자성 상태를 유도하는 현상을 탐구하기 위해 등장했습니다.", "origin": "Nagaoka's theorem (1966)의 확장/반대 사례 연구.", "connections": "Kinetic magnetism, Frustrated lattices."}], "english_summary": ["Theorized a new type of 'RVB polaron' in the infinite-U Hubbard model on a kagome lattice.", "Discovered that a single hole forms a self-trapping structure that evolves with spin polarization.", "Explains the transition from quantum resonating bonds to semiclassical magnetic correlations.", "Offers theoretical insight into kinetic magnetism in frustrated kagome systems."]}}, {"title": "Material Realization of Spinless, Covalent-Type Dirac Semimetals in Three Dimensions", "journal": "PRL_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/pshy-l48q", "authors": "Yuki Tanaka, Rinsuke Yamada, Manabu Sato, et al.", "last_authors": "Motoaki Hirayama, Max Hirschberger", "summary": "Realization of a three-dimensional (3D) analog of graphene has been a central challenge in topological materials science. Graphene is stabilized by covalent bonding, unlike conventional spin-orbit-type 3D Dirac semimetals (DSMs). In this study, we demonstrate the material realization of covalent-typ…", "tier": "B_IMPORTANT_CONDMAT", "score": "9", "reason": "Experimental realization of a new class of 3D Dirac semimetal; highly relevant to user's topological interest.; demoted from A: broad CM, not direct user/project hit", "tags": ["Diracsemimetal", "topologicalmaterials", "electronicstructure"], "image": "", "briefing": {"background": "3차원 디락 준금속(Dirac Semimetal)은 대개 무거운 원소의 강한 스핀-궤도 결합(SOC)에 의해 생성되지만, 그래핀과 같은 공유 결합 기반의 원리에 의한 3차원 아날로그 구현은 여전히 도전 과제였습니다.", "motivation": "SOC가 아닌 공유 결합(covalent-type)을 통해 안정화되는, 스핀 정보를 고려하지 않아도 성립하는(spinless-like) 새로운 3차원 디락 준금속을 실제 물질에서 구현하고자 했습니다.", "result": "화합물의 결정 구조와 결합 특성을 제어하여 SOC에 의존하지 않는 스핀리스 타입의 3차원 디락 준금속 상태를 실험적으로 입증하였습니다.", "implication": "스핀-궤도 결합이 약한 가벼운 원소들로 이루어진 물질에서도 견고한 3차원 위상 상태를 만들 수 있음을 보여주며, 이는 위상 물질 설계의 범위를 대폭 확장합니다.", "novelty": "기존의 Cd3As2나 Na3Bi 같은 SOC 기반 준금속과 달리, '공유 결합성'을 주축으로 한 3차원 위상 구조를 실증했다는 점이 핵심입니다. 독자의 관심사인 위상 반금속 연구와 직결됩니다.", "unresolved": "실제 ARPES 측정을 통해 밴드의 선형 교차점과 위상적 표면 상태(Fermi arc)를 얼마나 정밀하게 분리해냈는지가 관건입니다.", "future_work": "해당 물질의 anomalous Hall effect나 Berry curvature 관련 전송 현상을 측정하여 SOC 기반 물질과의 차별점을 부각하는 연구가 이어질 것으로 보입니다.", "concepts": [{"term": "3D Dirac Semimetal", "why_emerged": "3차원 공간에서 전자의 에너지 분산이 디락 방정식처럼 선형적으로 교차하는 물질을 찾기 위해 정의되었습니다.", "origin": "Young et al. (2012) 등에 의해 이론적 기반 정립.", "connections": "Weyl semimetals, Topological insulators."}, {"term": "Covalent-type DSM", "why_emerged": "SOC가 주도하는 위상 상태와 구분하여, 원자 간 공유 결합의 대칭성이 만드는 디락 지점을 설명하기 위해 등장했습니다.", "origin": "초록 정보만으로는 특정하기 어려우나 그래핀의 3D 확장 개념임.", "connections": "Graphene, Lattice symmetry protection."}, {"term": "Spinless Fermion", "why_emerged": "스핀-궤도 결합이 무시될 수 있을 정도로 작거나, 계의 물리가 스핀 자유도와 독립적으로 결정될 때의 물리 현상을 다루기 위해 쓰입니다.", "origin": "양자 통계 물리 기초 개념.", "connections": "Berry phase, Orbital magnetism."}], "english_summary": ["Realized a 3D analog of graphene using covalent bonding rather than spin-orbit coupling.", "Identified and demonstrated a spinless-type Dirac semimetal in a real material system.", "Expands the search for topological semimetals to light-element, covalent-bonded compounds.", "Challenges the dominance of SOC-based mechanisms in topological materials science."]}}, {"title": "Direct imaging Berry curvature–induced transport and domain behavior in noncollinear single-crystal antiferromagnetic thin films", "journal": "Science_Advances", "source": "Gemini", "link": "https://doi.org/10.1126/sciadv.aeb6478", "authors": "Yuchuan Yao, Pratap Pal, Camron Farhang, et al.", "last_authors": "Jing Xia, Chang-Beom Eom", "summary": "The discovery of the intrinsic anomalous Hall effect (AHE) in noncollinear antiferromagnets has opened a plethora of promising opportunities in antiferromagnetic devices. The key challenges limiting their full potential are (i) high-quality epitaxial thin-film growth and (ii) the understanding of Berry curvature and antiferromagnetic domain physics. Here, we focus on a noncollinear antiperovskite antiferromagnet Mn 3 NiN as a model system, successfully grown as a single-crystal epitaxial thin film. Combining multiple experiments supported by theoretical calculations, we probe the Berry curvature associated with antiferromagnetic Γ 4g domains in Mn 3 NiN and its strong connection to an AHE. We directly image the antiferromagnetic domains driving the intrinsic Berry curvature with high-resolution Sagnac MOKE (magneto-optical Kerr-effect) microscopy, controlling spatial distribution and dynamics by varying temperature and applied magnetic fields. Our findings provide critical advancement of the fundamental understanding and wide tunability of Berry curvature in noncollinear antiferromagnets important for realization in potential spintronic applications.", "tier": "B_IMPORTANT_CONDMAT", "score": "9", "reason": "Directly addresses Berry curvature, anomalous Hall effect, and domain dynamics in noncollinear antiferromagnets.", "tags": ["antiferromagnet", "Berrycurvature", "transport", "magneto-optics"], "image": "", "briefing": {"background": "비공선형 반강자성체(Noncollinear AFM)는 알짜 자화가 거의 없음에도 불구하고 운동량 공간에서 베리 곡률(Berry curvature)을 생성할 수 있어, 차세대 스핀트로닉스 소자의 핵심 후보로 꼽힙니다. 특히 베리 곡률에 기인한 이상 홀 효과(AHE)를 반강자성 상태에서 제어하는 것이 이 분야의 주요 과제입니다.", "motivation": "본 연구는 고품질의 비공선형 반강자성 박막을 성장시키고, 이론적으로 예측된 베리 곡률과 반강자성 도메인(domain)의 물리적 연결 고리를 직접적인 이미징을 통해 실험적으로 증명하고자 했습니다.", "result": "안티페로브스카이트(antiperovskite) 구조의 Mn3NiN 단결정 에피택셜 박막을 성장시키는 데 성공했습니다. 고해상도 Sagnac MOKE 현미경을 사용하여 Berry 곡률을 유도하는 Gamma 4g 반강자성 도메인을 직접 시각화했으며, 온도가 변함에 따라 도메인의 동역학 및 공간적 분포가 AHE와 직접적으로 연계됨을 확인했습니다.", "implication": "반강자성 도메인을 직접 제어함으로써 거시적인 수송 특성인 이상 홀 효과를 튜닝할 수 있음을 보여주었으며, 이는 외부 자기장에 민감하지 않은 반강자성 기반 비휘발성 메모리 소자 설계의 토대를 제공합니다.", "novelty": "비공선형 반강자성 박막에서 베리 곡률과 연관된 도메인 거동을 직접 이미징한 점이 독보적입니다. 독자의 관심사인 Berry curvature와 AHE가 실제 도메인 구조와 어떻게 결합되는지를 실험적으로 보여준 중요한 사례입니다.", "unresolved": "도메인 벽(domain wall)의 미세한 구조적 에너지와 도메인 이동(switching) 속도의 한계치는 아직 명확히 규명되지 않았습니다.", "future_work": "전기적 게이팅이나 스핀-궤도 토크(SOT)를 이용한 도메인 벽의 나노초 단위 제어 실험 및 ARPES를 통한 운동량 공간의 베리 곡률 직접 측정이 기대됩니다.", "concepts": [{"term": "비공선형 반강자성(Noncollinear AFM)", "why_emerged": "스핀이 단순히 평행/반평행하지 않고 꼬인 구조를 가질 때 발생하는 위상학적 특성을 활용하기 위해 등장함.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "이상 홀 효과(AHE), 스핀 홀 효과, 위상학적 자기 구조"}, {"term": "Sagnac MOKE 현미경", "why_emerged": "매우 미세한 시간 역전 대칭성 파괴를 감지하여 자성 도메인을 높은 감도로 이미징하기 위해 고안됨.", "origin": "A. Kapitulnik 그룹 등에 의해 정밀 측정 기법으로 발전됨", "connections": "시간 역전 대칭성 파괴, 반강자성 도메인 이미징"}, {"term": "이상 홀 효과(AHE)", "why_emerged": "강자성체뿐만 아니라 베리 곡률이 존재하는 시스템에서 나타나는 비대칭 수송 현상을 설명하기 위해 필요함.", "origin": "Edwin Hall (1881년)", "connections": "베리 곡률, 위상 절연체, 스핀 궤도 결합"}, {"term": "안티페로브스카이트(Antiperovskite)", "why_emerged": "결정 구조 내에서 음이온과 양이온의 위치가 바뀐 구조로, 특이한 자기 구조와 전자 구조를 탐색하기 위해 연구됨.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "Mn3NiN, 초전도체, 거대 자기 저항"}], "english_summary": ["Direct imaging of Gamma 4g antiferromagnetic domains in epitaxial Mn3NiN thin films using Sagnac MOKE.", "Establishes a strong experimental link between real-space AFM domains and momentum-space Berry curvature-induced AHE.", "Demonstrates spatial distribution and temperature dependence of domains driving the intrinsic anomalous Hall effect.", "Advances the potential of noncollinear antiferromagnets for robust, high-density spintronic applications."]}}, {"title": "Electrical control of induced magnetism in an air-stable two-dimensional semiconductor", "journal": "Science_Advances", "source": "Gemini", "link": "https://doi.org/10.1126/sciadv.aeb0659", "authors": "Qi Zhang, Mithun Ghosh, Yaroslav Zhumagulov, et al.", "last_authors": "Zdeněk Sofer, Ahmet Avsar", "summary": "Dilute magnetic semiconductors (DMSs) provide a platform for electrically controlling spin interactions; however, conventional systems face limited gate tunability and structural disorder. Here, we demonstrate gate-switchable magnetism in air-stable, dilute Fe-doped PtSe 2 , a two-dimensional (2D) DMS that remains structurally homogeneous down to the atomically thin limit. Bulk crystals exhibit ferromagnetism with a Curie temperature of 320 kelvin, and this coupling persists in metallic devices down to seven layers. As thickness and carrier concentration further decrease, the system transitions to antiferromagnetic order, with a gate-tunable Néel temperature reaching 105 kelvin in five-layer semiconducting devices. Our first-principles calculations reveal a carrier-density–dependent crossover from Ruderman-Kittel-Kasuya-Yosida–mediated ferromagnetism to superexchange-driven antiferromagnetism. These findings demonstrate how induced magnetic order evolves from bulk to the 2D limit, providing a pathway to functional spintronic devices with electrically controlled magnetic states.", "tier": "B_IMPORTANT_CONDMAT", "score": "9", "reason": "Gate-switchable magnetism in 2D semiconductor with RKKY/superexchange, very relevant.; demoted from A: broad CM, not direct user/project hit", "tags": ["2Dmaterials", "magnetism", "semiconductor", "spintronics", "electricalcontrol"], "image": "", "briefing": {"background": "희박 자성 반도체(DMS)는 전하량과 스핀을 동시에 제어할 수 있어 오랜 기간 연구되어 왔으나, 기존의 3차원 시스템은 게이트 제어의 한계와 구조적 무질서라는 문제를 안고 있었습니다. 2차원 소재의 등장은 이러한 한계를 극복할 새로운 플랫폼을 제공했습니다.", "motivation": "공기 중에서 안정한 2차원 반도체인 PtSe2에 Fe를 도핑하여, 소재의 두께와 게이트 전압에 따라 자기적 특성을 가역적으로 조절할 수 있는지 확인하고자 했습니다.", "result": "Fe가 도핑된 PtSe2에서 벌크 상태는 um-dependent spin splitting of electron bands due to a specific crystal structure that is invariant under time reversal only in combination with rotations and reflections. The developed phenomenological approach allows to obtain a spectrum of electron bands in altermagnets corresponding to antiferromagnets with the same symmetry. We consider antiferromagnetic, weak ferromagnetic, and ferrimagnetic structures. The calculated Berry curvature of electron bands in the alterrmarnet with zero spontaneous magnetisation occurs an odd function of momentum whereas it is even in a weak ferromagnetic state. The Berry curvature in ferrimagnetic state is equal to zero.", "tier": "B_IMPORTANT_CONDMAT", "score": "9", "reason": "Electronic bands and Berry curvature in altermagnets; high interest topic for this user.", "tags": ["theory", "material", "altermagnetism"], "image": "https://arxiv.org/html/2601.14878v4/Fig1.png", "briefing": {"background": "최근 발견된 알터마그넷(Altermagnet)은 알짜 자화가 0임에도 불구하고 특정 결정 구조의 대칭성에 의해 에너지 밴드에서 스핀 분리(spin splitting)가 일어나는 새로운 자성 분류입니다. 이는 기존의 강자성체와 반강자성체의 장점을 동시에 갖추고 있습니다.", "motivation": "본 연구는 현상론적 접근법을 통해 알터마그넷의 전자 밴드 구조를 유도하고, 일반적인 반강자성체나 약강자성체와 구별되는 베리 곡률(Berry curvature)의 대칭 특성을 명확히 규명하고자 했습니다.", "result": "알터마그넷의 베리 곡률은 운동량(momentum)의 기함수(odd function)로 나타나는 반면, 자발적 자화가 있는 약강자성 상태에서는 우함수(even function)가 됨을 이론적으로 유도했습니다. 또한 페리자성(ferrimagnetic) 상태에서는 베리 곡률이 0이 됨을 보였습니다.", "implication": "알터마그넷을 실험적으로 식별할 수 있는 명확한 대칭성 기준을 제시했습니다. 특히 ARPES나 수송 실험에서 베리 곡률의 운동량 의존성을 측정함으로써 다른 자성 상태와 구별할 수 있게 됩니다.", "novelty": "알터마그넷, 강자성, 페리자성 상태 사이의 베리 곡률 패리티(parity) 차이를 체계적으로 정리한 점이 핵심입니다. 독자의 주 관심사인 알터마그넷 및 베리 곡률 물리와 직결되는 이론적 가이드라인입니다.", "unresolved": "스핀-궤도 결합(SOC)의 세기가 베리 곡률의 패리티 보존에 미치는 구체적인 영향에 대해서는 논의가 더 필요합니다.", "future_work": "본 이론적 예측을 검증하기 위한 알터마그넷 후보 물질(예: RuO2, MnTe)에 대한 고해상도 ARPES 및 CD-ARPES 실험이 뒤따를 것으로 예상됩니다.", "concepts": [{"term": "알터마그넷(Altermagnetism)", "why_emerged": "반강자성의 0인 자화와 강자성의 스핀 분리 특성을 동시에 갖는 물질군을 분류하기 위해 명명됨.", "origin": "L. Šmejkal, J. Sino r": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Important study on magnetic topological insulators, highly relevant to user research interests.", "tags": ["anomalousHall", "material", "topology"], "image": "", "briefing": {"background": "자기 위상 절연체(Magnetic Topological Insulator)는 외부 자기장 없이도 자성 원소의 배열에 의해 위상적 성질이 발현되는 물질입니다. 특히 높은 턴 수(Chern number)를 가진 양자 이상 홀 효과(QAH)는 손실 없는 고속 전자 소자 구현의 핵심입니다.", "motivation": "MnBi2Te4는 대표적인 자기 위상 절연체이나, 층별로 발현되는 홀 효과의 특성과 높은 턴 수를 구현하는 메커니즘을 명확히 규명할 필요가 있었습니다.", "result": "MnBi2Te4 층에서 층별 분해(layer-resolved)가 가능한 양자 이상 홀 효과를 관측했으며, 높은 턴 수를 갖는 에지 채널을 확인했습니다.", "implication": "자기 위상 물질의 위상적 상태를 층 단위로 제어할 수 있음을 시사하며, 이는 차세대 위상 양자 소자 설계에 중요한 가이드라인이 됩니다.", "novelty": "자기 위상 물질의 복잡한 자기 구조를 층별로 분석하여 턴 수를 조절하는 메커니즘을 규명했다는 점에서 위상 물성 연구자들에게 매우 중요합니다.", "unresolved": "실제 상온 근처에서의 구현 가능성과 외부 환경 변화에 따른 위상 상태의 안정성 문제는 여전히 과제로 남아 있습니다.", "future_work": "다른 강자성 위상 물질로의 확장 연구 및 더 높은 턴 수를 안정적으로 유지하기 위한 이종 접합 연구가 기대됩니다.", "concepts": [{"term": "양자 이상 홀 효과", "why_emerged": "외부 자기장 없이도 위상적 경계 상태를 활용해 손실 없는 전류를 생성하기 위해.", "origin": "Haldane 모델(1988) 및 Cr-doped (Bi,Sb)2Te3 실험(2013).", "connections": "위상 절연체, Chern Insulator, 자성 위상 물질."}, {"term": "턴 수 (Chern number)", "why_emerged": "밴드 구조의 위상적 불변량을 정량적으로 정의하기 위해.", "origin": "Chern(1940년대), Thouless et al.(1982).", "connections": "Berry 곡률, 양자 홀 효과, 위상 불변량."}], "english_summary": ["Investigated MnBi2Te4 for high Chern number quantum anomalous Hall effect.", "Demonstrated layer-resolved transport properties in magnetic topological insulators.", "Provided insights into boundary chiral channels without external magnetic fields.", "Highlights potential for dissipationless electronics through topological control."]}}, {"title": "Self-induced spin-orbit torque switching in a synthetic antiferromagnetic Co2MnGa/MnGa bilayer", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/byz8-31yp", "authors": "Rongkun Han, Haohang Cheng, Dahai Wei, Yuan Lu, Jianhua Zhao", "last_authors": "Yuan Lu, Jianhua Zhao", "summary": "The large intrinsic spin current in magnetic Weyl semimetals provides a promising platform for spin-orbit torque (SOT) devices. Here, we demonstrate SOT-driven magnetization switching in a synthetic antiferromagnet (SAF) composed of a ${\\mathrm{Co}}_{2}\\mathrm{MnGa}$ (CMG)/MnGa bilayer. In this heav…", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Magnetization dynamics in a magnetic Weyl semimetal Co2MnGa; very relevant topological material class.", "tags": ["experiment", "material", "Weyl", "magnetism"], "image": "", "briefing": {"background": "자성 바일 반금속(Magnetic Weyl semimetal)은 내부 대칭성 파괴를 통해 특이한 전자 상태를 가지며, 큰 베리 곡률에 의한 비통상적인 스핀 전류를 생성할 수 있어 스핀트로닉스 분야에서 주목받고 있습니다.", "motivation": "Co2MnGa는 위상적 특성이 잘 알려진 바일 반금속으로, 이를 이용한 효율적인 스핀-궤도 토크(SOT) 기반의 자화 반전 기술을 실험적으로 증명하고자 했습니다.", "result": "Co2MnGa/MnGa 이중층 구조에서 합성 반강자성(SAF) 거동을 확인하고, 이를 통해 효율적인 SOT 유도 자화 반전을 달성했습니다.", "implication": "위상 물질의 물리적 성질이 실제 소자 성능 향상(고속 자화 반전)에 직접적으로 기여함을 증명했습니다.", "novelty": "바일 반금속의 위상적 물성을 활용하여 소자 효율을 극대화했다는 점에서 알터마그네티즘 및 위상 스핀트로닉스 분야에 중요한 진전입니다.", "unresolved": "MnGa 층과의 계면에서 발생하는 스핀 전달의 구체적인 미시적 메커니즘에 대한 이론적 해석이 더 필요합니다.", "future_work": "바일 반금속의 위상적 특성을 극대화하기 위한 이종 구조 최적화 및 고주파 자성 역학 연구.", "concepts": [{"term": "바일 반금속 (Weyl Semimetal)", "why_emerged": "운동량 공간에서 밴드가 선형적으로 만나는 특이점을 연구하기 위해.", "origin": "Murakami(2007), Wan et al.(2011).", "connections": "위상적 상태, 이상 홀 효과, 자이로트로픽 효과."}, {"term": "스핀-궤도 토크 (SOT)", "why_emerged": "전류를 이용해 빠르고 효율적으로 자성 메모리의 비트를 제어하기 위해.", "origin": "Miron et al.(2011).", "connections": "스핀 홀 효과, Rashba 효과, MRAM 소자."}], "english_summary": ["Demonstrated SOT-driven magnetization switching in Co2MnGa/MnGa bilayers.", "Utilized the intrinsic spin current of magnetic Weyl semimetal Co2MnGa.", "Constructed a synthetic antiferromagnet to enhance switching efficiency.", "Validates the utility of topological materials in advanced spintronic devices."]}}, {"title": "Electronic Tuning of the Soft-Phonon Transport Anomaly in Ta2Ni(SxSe1−x)5", "journal": "PRL_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/l5xq-2yrt", "authors": "Yuan-Shan Zhang, Masahiko Isobe, Hidenori Takagi, Dennis Huang", "last_authors": "Hidenori Takagi, Dennis Huang", "summary": "Tuning the electronic structure of the excitonic insulator candidate Ta 2 NiSe 5 via sulfur substitution reveals that its highly directional phonon transport anomaly is directly driven by electronic fluctuations, suggesting that electronic interactions and lattice effects cooperatively contribute to its phase transition.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Electronic structure/transport study of a relevant excitonic material.", "tags": ["transport", "phonons", "excitonic-insulator"], "image": "", "briefing": {"background": "Ta2NiSe5는 들뜬 상태의 전자-정공 쌍이 응축되어 형성되는 '엑시톤 절연체(excitonic insulator)' 후보 물질로, 전자와 격자 간의 강한 상호작용이 물성을 지배합니다.", "motivation": "유황(S) 치환을 통해 Ta2Ni(SxSe1−x)5의 전자 구조를 정밀하게 튜닝함으로써, 격자 불안정과 전자적 상태의 상관관계를 확인하고자 했습니다.", "result": "포논 수송의 이상 현상이 전자적 요동(fluctuation)에 의해 직접적으로 유도됨을 확인하여, 전자-격자 결합의 중요성을 입증했습니다.", "implication": "엑시톤 절연체 전이 과정에서 전자와 격자가 협력하여 상전이를 유도한다는 점을 명확히 함으로써, 관련 물성 모델을 수정해야 함을 시사합니다.", "novelty": "물질의 조성을 변화시켜 전자 구조와 격자 동역학의 직접적인 연관성을 규명했다는 점이 본 연구의 핵심입니다.", "unresolved": "전자-포논 결합의 구체적인 강도와 상전이 온도와의 정량적인 관계는 추가적인 해석이 필요합니다.", "future_work": "초고속 분광학을 이용한 전자와 포논의 시분해 관측 연구가 향후 과제로 예상됩니다.", "concepts": [{"term": "엑시톤 절연체", "why_emerged": "전자와 정공의 결합 상태가 응축되어 발생하는 새로운 절연체 상태를 이해하기 위해.", "origin": "Mott(1961), Knox(1963).", "connections": "BCS 이론, 상전이, 강상관 전자계."}, {"term": "포논 수송", "why_emerged": "격자 진동을 통해 열과 정보가 어떻게 전달되는지 규명하기 위해.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "열전도도, 전자-포논 결합, 격자 비조화성."}], "english_summary": ["Tuned electronic structure of Ta2NiSe5 via sulfur substitution.", "Identified that directional phonon anomalies are driven by electronic fluctuations.", "Confirmed cooperative contribution of electronic and lattice effects to phase transitions.", "Advances the understanding of excitonic insulator candidates."]}}, {"title": "Full Minimal Coupling GW-Bethe-Salpeter-Equation Framework for Circular Dichroism in Solids: Applications to Chiral 2D Perovskites", "journal": "PRL_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/mdr9-tzws", "authors": "Xian Xu, Diana Y. Qiu", "last_authors": "Xian Xu, Diana Y. Qiu", "summary": "Circular dichroism (CD) and other chiroptical responses are key probes of both chirality and momentum-space geometry in solids, but first-principles calculations are still challenging in periodic systems with strong exciton effects. Here, we develop a gauge-invariant first-principles framework for C…", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "First-principles framework for circular dichroism and momentum-space geometry in 2D chiral materials.", "tags": ["circulardichroism", "first-principles", "2Dmaterials", "momentum-spacegeometry", "theory"], "image": "", "briefing": {"background": "고체 물리학에서 원형 이색성(CD)은 물질의 카이랄성과 운동량 공간의 기하학적 구조를 파악하는 핵심 수단입니다. 하지만 엑시톤 효과가 강한 주기적 시스템에서 이를 제1원리(first-principles) 수준에서 계산하는 것은 이론적으로 매우 까다롭습니다.", "motivation": "기존 계산 방식의 게이지 불변성 문제를 해결하고, 엑시톤 효과를 엄밀하게 포함하는 새로운 GW-Bethe-Salpeter 프레임워크를 정립하고자 합니다.", "result": "게이지 불변성을 만족하는 최소 결합(minimal coupling) 형태의 새로운 계산 프레임워크를 개발하였으며, 이를 통해 카이랄 2D 페로브스카이트의 광학적 반응을 성공적으로 해석했습니다.", "implication": "향후 다양한 카이랄 고체 물질에서 운동량 공간의 토폴로지나 베리 곡률 관련 광학적 특성을 정확히 예측하는 표준적인 계산 도구가 될 것입니다.", "novelty": "기존에는 다루기 힘들었던 엑시톤 효과와 게이지 불변성을 동시에 해결한 점이 이론 물리 측면에서 매우 중요하며, 독자의 관심 분야인 ARPES와 연관된 운동량 공간 기하학 탐구에 기초가 되는 방법론입니다.", "unresolved": "계산 비용이 매우 높을 것으로 예상되며, 매우 복잡한 결함 구조나 비평형 상태에서의 적용 여부는 아직 명확하지 않습니다.", "future_work": "더 복잡한 카이랄 위상 물질 및 2D 층상 구조체로의 적용 확대와 광학적 실험 결과와의 정량적 대조 연구가 진행될 것으로 보입니다.", "concepts": [{"term": "Bethe-Salpeter Equation (BSE)", "why_emerged": "고체 내에서 전자-정공 쌍인 엑시톤의 결합 에너지와 광학적 특성을 정확히 계산하기 위해 필요합니다.", "origin": "Edwin Salpeter와 Hans Bethe가 1951년 제안.", "connections": "GW 근사와 결합하여 현대 응집물질물리에서 들뜬 상태 계산의 표준으로 사용됨."}, {"term": "Gauge Invariance", "why_emerged": "물리적 관측값이 벡터/스칼라 퍼텐셜의 정의 방식에 따라 달라지지 않아야 한다는 물리적 원리입니다.", "origin": "전자기학의 기본 원리.", "connections": "고체 물리학의 광학적 응답 함수 계산에서 필수적인 수학적 제약 조건."}], "english_summary": ["Developed a robust first-principles GW-BSE framework for circular dichroism.", "Ensures gauge invariance for calculations in periodic solids with strong excitonic effects.", "Successfully applied to chiral 2D perovskites for optical response predictions.", "Provides a powerful tool for probing momentum-space geometry in novel materials."]}}, {"title": "Quantum Geometry of Altermagnetic Magnons Probed by Light", "journal": "PRL_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/12cl-b9jj", "authors": "Rundong Yuan, Wojciech J. Jankowski, Ka Shen, Robert-Jan Slager", "last_authors": "Ka Shen, Robert-Jan Slager", "summary": "Magnons with momentum-dependent chirality are a key signature of altermagnets. We identify bicircular light as a smoking-gun optical probe for chiral altermagnetic magnons, selectively targeting their quantum geometry induced by an alternation of magnonic chirality. We show that in d -wave altermagnets, under a canting magnetic field, the altermagnetic magnons realize a nontrivial quantum geometry, resulting in an enhancement of the nonlinear second-order light-magnon interactions. We find that the scattering of bicircular pulses probes the present magnonic quantum geometry, even if the magnonic topology is trivial. Hence, our findings establish bicircular Raman response as an optical effect of choice to identify altermagnetic magnons. As such, we propose a universal experimental protocol to distinguish altermagnets from antiferromagnets by detecting their magnon chirality patterns with light, independently of the underlying magnon topology.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Theory proposing an optical experimental probe for quantum geometry of altermagnetic magnons.", "tags": ["altermagnetism", "magnons", "opticalprobe", "quantumgeometry", "theory"], "image": "", "briefing": {"background": "알터자성(Altermagnetism)은 스핀 분극이 운동량에 의존하는 새로운 자기 상으로, 일반적인 강자성이나 반강자성과는 다른 위상적/기하학적 성질을 갖습니다.", "motivation": "알터자성체에서 나타나는 운동량 의존적 카이랄 매그논(magnon)의 양자 기하학적 특성을 광학적으로 탐지할 수 있는 명확한 실험적 신호를 찾고자 합니다.", "result": "비원형 편광 빛(bicircular light)이 알터자성 매그논의 카이랄성을 선택적으로 탐지할 수 있는 '스모킹 건'임을 이론적으로 증명했습니다.", "implication": "기존 반강자성과 알터자성을 광학적으로 확실히 구별할 수 있는 실험적 프로토콜을 제공하며, 비선형 광-매그논 상호작용을 통해 알터자성의 기하학적 위상을 측정 가능하게 합니다.", "novelty": "독자의 관심사인 '자기 위상 물질' 및 '알터자성' 분야에서 매그논의 양자 기하학적 특성을 다루는 새로운 광학적 접근법을 제시했다는 점에서 매우 시의적절합니다.", "unresolved": "실제 실험에서 Bicircular Raman 분광법을 구현할 때의 광원 정밀도와 샘플 준비에 따른 신호 대 잡음비 문제가 남아있습니다.", "future_work": "실제 d-파 알터자성 후보 물질(예: RuO2 등)에 대한 비원형 편광 라만 산란 실험이 예상됩니다.", "concepts": [{"term": "Altermagnetism", "why_emerged": "기존의 반강자성 범주로는 설명되지 않는, 운동량 공간에서 스핀이 갈라지는 새로운 자기 대칭성을 기술하기 위해 등장.", "origin": "최근 수년 내 이론적으로 정립, Libor Smejkal 등이 주도.", "connections": "비상반적 전자 수송, 베리 곡률, 새로운 자기 정렬 현상과 연결."}, {"term": "Bicircular Light", "why_emerged": "물질의 비선형 광학적 응답을 선택적으로 자극하여 대칭성 파괴 정보를 얻기 위해 도입.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "2차 조화파 발생(SHG) 및 매그논 분광법의 정밀 분석에 활용."}], "english_summary": ["Identifies bicircular light as an optical probe for chiral altermagnetic magnons.", "Shows that nonlinear second-order light-magnon interactions detect quantum geometry.", "Proposes a universal protocol to distinguish altermagnets from antiferromagnets.", "Independent of underlying magnon topology, relying on magnon chirality patterns."]}}, {"title": "Terahertz Magneto-Photocurrents in the Topological Insulator Bi2Se3 Probe Its Topological Surface States", "journal": "PRL_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/yvbq-rdkz", "authors": "Chihun In, Genaro Bierhance, Deepti Jain, et al.", "last_authors": "Seongshik Oh, Tobias Kampfrath", "summary": "We study ultrafast magneto-photocurrents in a three-dimensional topological insulator. For this purpose, we excite ( In r Bi 1 − r ) 2 Se 3 thin films with a femtosecond laser pulse in the presence of an external magnetic field B ext up to 0.3 T parallel to the film plane. The resulting in-plane photocurrent is measured by detecting the emitted terahertz electromagnetic pulse. It is proportional and perpendicular to B ext . Strikingly, for r ≥ 4 % , we observe an abrupt photocurrent reduction, which is strongly correlated with the indium-induced quenching of the topological surface states. The rise time, decay time, and amplitude of the terahertz magneto-photocurrent can consistently be explained by the following scenario: optically excited spin-polarized electrons propagate toward the film surface where the accumulated spin is converted into an in-plane charge current due to spin-velocity locking. Our results are highly relevant for contact-free probing of spin-charge conversion in systems without spontaneous magnetic order and without having to add invasive spin-source layers.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Experimental study of topological surface states in Bi2Se3 using a magneto-optical probe.", "tags": ["topologicalinsulator", "magneto-optics", "Bi2Se3", "experimental"], "image": "", "briefing": {"background": "Bi2Se3와 같은 위상 절연체는 표면 상태(TSS)에서 나타나는 스핀-운동량 잠김 현상으로 주목받아 왔으며, 이를 비침습적으로 측정하는 방법이 중요합니다.", "motivation": "외부 자기장을 인가했을 때 위상 절연체의 표면에서 발생하는 스핀-전하 변환 전류를 테라헤르츠(THz) 방출 측정을 통해 탐구하고자 합니다.", "result": "테라헤르츠 광전류가 인듐 도핑에 의한 TSS 퀜칭(quenching)과 강한 상관관계를 가짐을 발견하고, 스핀-운동량 잠김에 의한 전류 생성을 확인했습니다.", "implication": "별도의 스핀 주입 층 없이도 외부 자기장을 통해 TSS의 스핀-전하 변환 능력을 정밀하게 측정할 수 있음을 증명했습니다.", "novelty": "독자가 관심 있어 하는 '위상 절연체'와 '스핀-전하 변환' 현상을 테라헤르츠 분광법으로 contact-free하게 측정했다는 점이 실험 물리학적으로 매우 실용적입니다.", "unresolved": "표면 상태 외의 벌크 전도도 기여도가 완전히 분리되지 않았을 가능성과, 다양한 도핑 농도에서의 정량적 해석이 더 필요합니다.", "future_work": "다른 위상 물질로의 확장 및 스핀-전자 트랜지스터 등 소자 응용 연구로의 연계가 기대됩니다.", "concepts": [{"term": "Topological Surface States (TSS)", "why_emerged": "물질 내부의 위상적 불변량에 의해 표면에만 나타나는 전도성 채널을 설명하기 위해 등장.", "origin": "Kane-Mele, Bernevig-Zhang 등이 2000년대 중반에 이론화.", "connections": "양자 스핀 홀 효과, 위상 절연체, 스핀-운동량 잠김."}, {"term": "Spin-Momentum Locking", "why_emerged": "표면 상태에서 전자의 스핀 방향이 전자의 운동량 방향에 고정되어야 한다는 대칭성 요구를 설명.", "origin": "위상 절연체 이론의 핵심 결과.", "connections": "스핀-궤도 토크, 효율적인 스핀-전하 변환."}], "english_summary": ["Studies ultrafast magneto-photocurrents in Bi2Se3 topological insulators.", "Observes a reduction in photocurrent correlated with In-induced TSS quenching.", "Explains results via spin-velocity locking of spin-polarized electrons.", "Demonstrates a contact-free probe for spin-charge conversion."]}}, {"title": "Direct evaporation of single-crystal metal contacts for 2D semiconductors", "journal": "Science", "source": "Gemini", "link": "https://doi.org/10.1126/science.aee3132", "authors": "Ying Zhang, Chang Liu, Huiting Wang, et al.", "last_authors": "Lain-Jong Li, Jianlu Wang", "summary": "Metal contacts remain one of the key bottlenecks in two-dimensional (2D) semiconductor electronics. We developed an atomic-scale step-by-step evaporation method to directly grow single-crystal metals on monolayer semiconductors with clean interfaces. This method accesses a distinct growth-kinetic window that suppresses secondary nucleation and promotes lateral coalescence, enabling van der Waals epitaxy of diverse metals—including bismuth, silver, indium, gold, and palladium—on molybdenum disulfide (MoS 2 ) and tungsten diselenide (WSe 2 ). The single-crystal metals support ultrathin conduction, provide spatially uniform work functions, and exhibit improved thermal robustness. As contacts, they show minimal Fermi-level pinning, approaching the Schottky–Mott limit. With bismuth and palladium contacts, monolayer MoS 2 and WSe 2 transistors achieved ultralow n- and p-type contact resistances of 36 and 145 ohm-micrometers, respectively, and short-channel currents both above 1.1 milliampere per micrometer.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Important methodology for contacts to 2D monolayer semiconductors and vdW heterostructures.", "tags": ["materialsscience", "2Dmaterials", "vanderWaals", "semiconductor"], "image": "", "briefing": {"background": "2차원 반도체 소자에서 금속과 반도체 사이의 접촉 저항은 성능을 결정짓는 핵심 병목 현상입니다. 기존의 증착 방식은 계면에 결함이나 불순물을 유발하여 페르미 준위 고정(Fermi-level pinning) 문제를 야기하곤 했습니다.", "motivation": "단층 2D 반도체(MoS2, WSe2) 위에 결함이 없고 원자 단위에서 깨끗한 단결정 금속 접합을 직접 성장시켜 접촉 저항을 최소화하고자 했습니다.", "result": "반데르발스 에피택시를 활용해 비스무트, 은, 인듐 등을 단결정으로 성장시켰으며, 이를 통해 쇼트키-모트(Schottky-Mott) 한계에 근접하는 낮은 접촉 저항과 높은 소자 전류를 확보했습니다.", "implication": "고성능 2D 반도체 전자 소자 구현을 위한 대량 생산 공정의 기술적 장벽을 크게 낮출 수 있습니다.", "novelty": "성장 동역학(growth-kinetic)을 조절하여 금속의 2차 핵생성을 억제하고 측면 결합을 유도한 것이 핵심입니다. 2D 재료 물리 연구실에서 나노소자 제작 시 소스/드레인 접촉 문제를 해결하는 실질적인 도구가 될 것입니다.", "unresolved": "대면적 기판상에서의 균일한 단결정 성장이 산업적 규모에서도 안정적으로 유지되는지는 추가 검증이 필요합니다.", "future_work": "다른 다양한 2D 재료 시스템으로의 확장 및 초소형 채널 길이를 가진 트랜지스터에서의 성능 최적화 연구가 예상됩니다.", "concepts": [{"term": "반데르발스 에피택시", "why_emerged": "격자 불일치(lattice mismatch)가 심한 재료들을 화학적 결합 없이도 층간 상호작용을 통해 성장시키기 위해 필요.", "origin": "Koma et al. (1984)", "connections": "2D 이종접합, 소자 미세화 기술"}, {"term": "페르미 준위 고정 (Fermi-level pinning)", "why_emerged": "금속과 반도체 접합부의 계면 상태(interface states)로 인해 금속의 일함수와 상관없이 장벽 높이가 고정되는 현상 이해.", "origin": "Bardeen (1947)", "connections": "Schottky 장벽, 반도체 소자 물리학"}], "english_summary": ["Developed a method to grow single-crystal metal contacts directly on 2D semiconductors via van der Waals epitaxy.", "The approach suppresses secondary nucleation to achieve clean, uniform interfaces with minimal Fermi-level pinning.", "Demonstrated ultralow n- and p-type contact resistances in MoS2 and WSe2 transistors.", "This provides a scalable pathway for high-performance 2D electronics."]}}, {"title": "A Strategy Toward Room Temperature Topological Hall Effect via Local Moment Magnetism", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2609.03223", "authors": "Karthik Rao, Kevin Allen, Yuxiang Gao, et al.", "last_authors": "Vivien Zapf, Emilia Morosan", "summary": "Topological spin textures in local moment systems hold great promise for technological applications due to their large magnetic moments, strong spin-orbit coupling (SOC), and high tunability. Finding new spin textures that are stable near room temperature is paramount to maximizing their potential for applications. Here, we provide a strategy for realizing topological spin textures at high temperatures by identifying rare earth ($R$) magnets ordering at or near room temperature. We demonstrate the feasibility of this strategy in one of these magnets, hexagonal Gd$_5$Pb$_3$, which orders at $T_C$ = 285 K. The indication for topological spin textures comes from topological Hall effect (THE), which, in Gd$_5$Pb$_3$, occurs between $T$ = 100 - 200 K, an order of magnitude higher temperature than in other reported $R$-based systems. Our results present an opportunity to explore the role of SOC, anisotropic exchange, geometric frustration, and magnetic interactions in stabilizing topological spin textures, and provide a pathway toward realizing them near room temperature in $R$-based magnets.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Experimental investigation of topological Hall effect in a rare-earth magnet Gd5Pb3.", "tags": ["experiment", "Gd5Pb3", "topologicalHall"], "image": "https://arxiv.org/html/2609.03223v1/Figure_1.png", "briefing": {"background": "위상적 스핀 텍스처(예: 스카이미온)는 위상적 홀 효과(THE)를 통해 감지될 수 있으며, 차세대 스핀트로닉스 소자의 핵심 요소로 주목받고 있습니다. 그러나 대부분의 소재에서 이는 매우 낮은 온도에서만 발생합니다.", "motivation": "상온 근처에서 작동하는 위상적 스핀 텍스처를 구현하기 위해, 퀴리 온도(TC)가 높은 희토류 자성 금속(Gd5Pb3)에서 THE의 발현 가능성을 탐색했습니다.", "result": "Gd5Pb3가 285K에서 자성을 띠며, 100~200K 온도 범위에서 THE가 관측됨을 확인했습니다. 이는 기존 희토류 기반 시스템보다 훨씬 높은 온도입니다.", "implication": "희토류 기반 자성체에서 강한 스핀-궤도 결합(SOC)과 이방성 교환 상호작용을 이용해 고온 위상적 스핀 질서를 제어할 수 있음을 시사합니다.", "novelty": "희토류 자석의 국소 모멘트를 활용하여 THE의 작동 온도를 한 자릿수 이상 높였다는 점이 중요하며, 향후 더 높은 온도에서의 위상적 현상을 설계하는 전략을 제시합니다.", "unresolved": "관측된 THE가 정확히 어떤 위상적 스핀 구조(예: 스카이미온 격자, 나선형 구조)에 기인하는지 직접적인 공간 분해능 영상화(예: 로런츠 TEM)가 필요합니다.", "future_work": "Gd5Pb3 외의 다른 희토류 금속간 화합물 탐색 및 상온 작동 스카이미온 소자 구현 연구.", "concepts": [{"term": "위상적 홀 효과 (Topological Hall Effect)", "why_emerged": "전자가 위상적으로 비자명한 스핀 구조를 통과할 때 유효 자기장(Berry phase)에 의해 발생하는 추가적인 홀 전도도 설명.", "origin": "Nagaosa & Tokura (2013)", "connections": "스카이미온, 베리 곡률, 스핀트로닉스"}, {"term": "희토류 자석", "why_emerged": "4f 전자들의 강한 자기 모멘트와 스핀-궤도 결합을 이용해 고차 자기 질서를 구현하고자 함.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "희토류 자기저항, 스핀-궤도 토크"}], "english_summary": ["Investigated the topological Hall effect (THE) in the rare-earth magnet Gd5Pb3.", "Observed THE at temperatures up to 200 K, significantly higher than previous rare-earth systems.", "Proposed a design strategy for topological spin textures near room temperature using rare-earth magnetism.", "Highlights the role of SOC and anisotropic exchange in stabilizing high-temperature topological spin textures."]}}, {"title": "Antiferromagnetism-altered plasmon dynamics", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2609.03138", "authors": "Yifan Su, Suheng Xu, Rocco A. Vitalone, et al.", "last_authors": "Angel Rubio, D. N. Basov", "summary": "The interaction between plasmons and magnons is a long-sought phenomenon with implications for fundamental physics and spintronics applications. In three-dimensional systems, this coupling is suppressed by the large mismatch in energy scales, but two-dimensional (2D) plasmons with gapless dispersion can overlap with magnons over a broad spectral range. Despite numerous theoretical predictions, experimental observation of magnon-plasmon interaction has remained elusive. In this work, we study a first-of-its-kind hybrid plasmon-magnon platform based on 2D materials. By deploying scattering-type scanning near-field optical microscopy (s-SNOM) with terahertz radiation, we image propagating plasmon wavepackets at a graphene/NiPS$_3$ interface and track their dynamics across the antiferromagnetic transition of NiPS$_3$. We observe a clear renormalization of the plasmon-polariton dispersion concurrent with the onset of antiferromagnetic order. With complementary Raman scattering and nano-terahertz spectroscopy, we unveil spectral weight redistribution and dielectric screening changes, potentially associated with the multi-magnon continuum, as the underlying mechanism. These results provide solid evidence of coupling between plasmon and antiferromagnetic order, marking a cornerstone for a potential platform for hybrid magnon-plasmon interactions in 2D materials, opening avenues for coherent spin-plasmon devices and tunable terahertz spintronic components.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Experimental study of plasmon-magnon coupling in 2D materials (NiPS3/graphene).", "tags": ["graphene", "magnons", "antiferromagnetism"], "image": "https://arxiv.org/html/2609.03138v1/Fig0.png", "briefing": {"background": "플라스몬(전하 밀도 파동)과 마그논(스핀 파동)은 각각 서로 다른 에너지 영역에서 작동하여 상호작용이 어렵지만, 2D 재료에서는 이들의 분산 관계가 겹칠 수 있어 하이브리드 모드 형성이 가능합니다.", "motivation": "2D 자성 절연체(NiPS3)와 그래핀을 결합하여, 반강자성 전이 시 플라스몬-마그논 간의 상호작용 및 플라스몬 거동 변화를 관찰하고자 했습니다.", "result": "반강자성 전이 온도에서 그래핀의 플라스몬-폴라리톤 분산 관계가 재규격화(renormalization)되는 현상을 s-SNOM으로 이미지화하여 확인했습니다.", "implication": "2D 이종접합에서 스핀 질서가 전하 캐리어의 플라스몬 동역학을 실시간으로 제어할 수 있음을 입증하여, 저전력 스핀트로닉 소자 응용 가능성을 열었습니다.", "novelty": "2D 재료 시스템에서 플라스몬-마그논 결합을 실험적으로 증명한 선구적인 사례입니다. 특히 그래핀의 플라스몬을 활용한 마그논 감지 도구로서의 가능성을 보여줍니다.", "unresolved": "관측된 분산 관계의 변화가 구체적으로 어떤 다-마그논(multi-magnon) 연속체와 결합했는지에 대한 미시적 기작은 추가 연구가 필요합니다.", "future_work": "외부 자기장 인가에 따른 플라스몬-마그논 결합의 동적 튜닝 및 THz 스핀트로닉 소자 프로토타입 구현.", "concepts": [{"term": "플라스몬-폴라리톤", "why_emerged": "광학적 여기와 전자 플라스몬이 결합하여 나노 구조에서 빛을 강하게 국소화하고 전파시키기 위해.", "origin": "Pitarke et al. (2007)", "connections": "나노 포토닉스, 2D 재료의 광학 응답"}, {"term": "s-SNOM", "why_emerged": "빛의 회절 한계를 극복하여 나노미터 규모에서 시료의 광학적 물성 및 플라스몬을 이미지화하기 위해.", "origin": "Keilmann & Hillenbrand (2004)", "connections": "근접장 광학, 2D 재료 이미징"}], "english_summary": ["Experimental demonstration of magnon-plasmon coupling in a graphene/NiPS3 van der Waals heterostructure.", "Used s-SNOM to track plasmon-polariton dynamics across the antiferromagnetic transition of NiPS3.", "Observed clear renormalization of plasmon dispersion, providing evidence of spin-plasmon interaction.", "Paves the way for tunable terahertz spintronic devices."]}}, {"title": "Critical photoinduced reflectivity relaxation dynamics in single-layer Bi-based cuprates near the pseudogap end point (New J. Phys.)", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2508.21298", "authors": "T. Shimizu, R. Tobise, T. Kurosawa, et al.", "last_authors": "D. Mihailovic, T. Mertelj", "summary": "A comprehensive study of photoinduced transient reflectivity dynamics in heavily overdoped single-layer cuprate (Bi,Pb)$_{2}$Sr$_{2}$CuO$_{6+\\delta}$ (Pb-Bi-2201) across the end points of the pseudogap and superconducting phases was conducted using optical ultrafast time-resolved pump-probe spectroscopy. In the Pb-Bi-2201 near the proposed pseudogap end-point doping, the transient reflectivity dynamics above $T_{{\\rm c}}$ resemble the pseudogap response observed in the optimally doped La-Bi-2201. With decreasing temperature, however, the relaxation time exhibits a power-law divergence, $\\tau\\sim10\\hbar/k_{\\mathrm{B}}T$, consistent with quantum critical behavior near the proposed pseudogap end-point doping. A similar power-law increase in relaxation time is also observed at a slightly more overdoped composition, though it is less pronounced.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Experimental ultrafast spectroscopy on cuprates exploring the pseudogap end point.", "tags": ["experiment", "material", "cuprate"], "image": "https://arxiv.org/html/2508.21298v2/Diagram.png", "briefing": {"background": "구리 산화물(cuprates) 고온 초 both the undoped and optimally-doped regimes, implying that local electronic moments exist independent of superconductivity. However, the systematic doping-dependent magnetic behavior is not yet fully resolved, and characterizing it could uncover the relationship between local moments and the superconducting dome. In this work, we use muon spin rotation ($\\mu$SR) on a (La,Sr)NiO$_2$ doping series from the undoped parent compound, through the superconducting dome, to the over-doped normal state (Sr substitution 0% $\\leq$ x $\\leq$ 25%) to probe the magnetic ground state and the temperature-dependent static and dynamic behavior. We find that local moments experience spin freezing into a glassy state at temperatures on the order of a few tens of kelvin regardless of the doping level. We also observe a subtle destabilization of the glassy state with increased hole doping. These observations suggest that magnetism and superconductivity are largely decoupled phenomena with indirect interactions described in a multi-orbital framework.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Experimental muSR study of magnetic order in nickelate superconductors, a relevant broader interest.", "tags": ["experiment", "nickelates", "magnetism"], "image": "https://arxiv.org/html/2609.03388v1/Fig1_LSNO_ZF_Spectra_v3.png", "briefing": {"background": "무한 층(infinite layer) 니켈산염은 구리 산화물과 유사한 구조를 가지지만, 모체 화합물에서 장거리 반강자성 정렬이 결여되어 있다는 점에서 초전도 기작의 비교 대상으로 주목받습니다.", "motivation": "니켈산염 초전도체에서 초전도성과 자기적 국소 모멘트 사이의 상관관계를 규명하기 위해 도핑에 따른 자기적 상태를 조사하고자 했습니다.", "result": "도핑 수준과 무관하게 수십 K 온도에서 스핀이 동결되는 유리(glassy) 상태가 관찰되며, 이는 자성과 초전도성이 독립적임을 시사합니다.", "implication": "니켈산염의 초전도 현상이 강한 반강자성 질서 위에서 일어나는 구리 산화물과는 다른 물리학을 따를 가능성을 제시합니다.", "novelty": "무지론(muSR)을 통해 도핑 계열 전체를 측정하여 니켈산염의 자기적 모멘트가 초전도 상태와 결합하기보다 독립적인 동역학을 가짐을 규명했습니다.", "unresolved": "관찰된 자기 유리 상태의 미시적 기원과 도핑에 의한 스핀 상태의 미세한 변화에 대한 이론적 해석이 더 필요합니다.", "future_work": "다른 도핑 범위와 중성자 산란 등을 활용한 국소 스핀 동역학의 정밀 분석이 필요합니다.", "concepts": [{"term": "무한 층 니켈산염", "why_emerged": "구리 산화물과 유사한 전자 구조를 구현하여 고온 초전도 메커니즘을 검증하기 위해 설계됨.", "origin": "Hayward et al. (1999)에 의해 처음 합성됨.", "connections": "구리 산화물(Cuprates), 3d 전자계, 초전도 dome."}, {"term": "muSR (Muon Spin Rotation)", "why_emerged": "물질 내부의 매우 작은 국소 자기장을 비파괴적으로 정밀하게 측정하기 위해 도입.", "origin": "1970년대 초반부터 응집물질물리 실험 도구로 본격 정착.", "connections": "NMR, 중성자 산란과 상호 보완적인 자기 측정 기법."}], "english_summary": ["Investigated the doping dependence of magnetic ground states in infinite-layer nickelates using muSR.", "Found spin-freezing into a glassy state regardless of doping, pointing to decoupled magnetism and superconductivity.", "Supports a multi-orbital framework for nickelates distinct from cuprate physics."]}}, {"title": "Electron-phonon coupled hydrodynamics in semimetal TaAs2", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2609.03517", "authors": "Shan Jiang, Wei Xie, Xiaokang Li, Kamran Behnia, Zengwei Zhu", "last_authors": "Kamran Behnia, Zengwei Zhu", "summary": "Hydrodynamic corrections to diffusive transport can arise when momentum-conserving collisions between quasiparticles become prominent, and they have been documented for both electrons and phonons. An emerging frontier topic is coupled electron-phonon (e-ph) hydrodynamics. Here, through electrical and thermal transport measurements on TaAs2 crystals with different impurity levels, we document the emergence of an e-ph bifluid in the temperature window of 5 to 15 K. Within this range, the lattice thermal conductivity exhibits a faster-than-T^3 temperature dependence, as a consequence of non-monotonic and purity-dependent phonon mean free paths, a signature of phonon Poiseuille flow. However, strong e-ph coupling impedes the emergence of a ballistic regime. This is corroborated by the observation of quantum oscillations in the lattice thermal conductivity. Prominent phonon-mediated momentum exchange between electrons amplifies the violation of the Wiedemann-Franz law and yields  e-ph coupling facilitates momentum exchange between electron and phonon reservoirs."]}}, {"title": "Evolution of electron spin resonance through a metallic quantum critical phase diagram", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2609.03994", "authors": "Marc Scheffler, J\\\"org Sichelschmidt, Conrad Clauss, et al.", "last_authors": "Frank Steglich, Martin Dressel", "summary": "In the heavy-fermion metal YbRh2Si2, quantum criticality at a suppressed antiferromagnetic order is governed by the interplay of local magnetic moments and itinerant conduction electrons. We demonstrate how this can be investigated by a new experimental approach that enables the observation of electron spin resonance (ESR) across a broad range of frequencies and fields at very low temperatures. This allowed us to cover a large part of the phase diagram from the paramagnetic Fermi-liquid phase to the phase with antiferromagnetic order and including the quantum-critical regime. Both the ESR g-factor and the linewidth present distinct behaviors in these three regimes, providing further insight into the physics across a quantum critical point. Notably, when cooling down at a field directly towards the quantum critical point, both g-factor and linewidth continuously decrease. Furthermore, we observe a very good matching of the g-factor behavior upon field-tuning and temperature-tuning towards the quantum-critical point. We analyze and discuss the results in the context of present theories on ESR in strongly correlated electron systems.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Experimental ESR study of heavy-fermion quantum criticality.", "tags": ["quantumcritical", "ESR", "correlated"], "image": "https://arxiv.org/html/2609.03994v1/FigS1.png", "briefing": {"background": "중페르미온(Heavy-fermion) 물질은 국소 자기 모멘트와 전도 전자의 상호작용으로 인해 비전형적인 금속성 및 자기적 성질을 띱니다. 이 시스템에서 양자 임계점(QCP) 근처의 물리적 상태를 규명하는 것은 강상관 전자계의 핵심 난제 중 하나입니다.", "motivation": "YbRh2Si2의 양자 임계점 주위에서 발생하는 자기적 특성을 전자 스핀 공명(ESR)이라는 국소적 탐침을 사용하여 페르미 액체상, 반강자성상, 양자 임계 영역 전반에 걸쳐 체계적으로 추적하고자 했습니다.", "result": "ESR의 g-인자와 선폭(linewidth)이 페르미 액체상, 반강자성상, 양자 임계 영역에서 각기 다른 거동을 보임을 확인했습니다. 특히 자기장과 온도를 변화시키며 양자 임계점에 접근할 때 g-인자와 선폭이 연속적으로 감소하는 일관된 거동을 관찰했습니다.", "implication": "이 결과는 강상관 시스템의 양자 임계 현상에서 국소 스핀과 전도 전자 사이의 결합이 어떻게 진화하는지에 대한 실험적 증거를 제공하며, 기존의 이론적 모델들을 검증할 중요한 벤치마크가 됩니다.", "novelty": "저온 환경에서 광범위한 주파수와 자기장을 커버하는 새로운 ESR 접근법을 통해, 접근하기 어려운 양자 임계 영역의 동역학적 특성을 직접 관찰했다는 점이 중요합니다.", "unresolved": "실험적 결과는 제시되었으나, ESR 신호의 미세한 변화를 완전히 설명할 수 있는 정량적 미시 이론 모델은 여전히 논의가 진행 중입니다.", "future_work": "다른 중페르미온 물질들에 대한 유사한 ESR 실험을 통해 본 결과가 YbRh2Si2 특유의 것인지, 혹은 보편적인 양자 임계 물리 현상인지 확인할 필요가 있습니다.", "concepts": [{"term": "중페르미온(Heavy-fermion)", "why_emerged": "전도 전자가 f-전자와의 강한 산란으로 인해 거대한 유효 질량을 가지게 되는 현상을 설명하기 위해 도입되었습니다.", "origin": "1970년대 후반 CeAl3 등에서 처음 보고되었습니다.", "connections": "Kondo 격자 모델, 비전형적 초전도체, 양자 임계점 연구와 깊게 연관됩니다."}, {"term": "양자 임계점(Quantum Critical Point, QCP)", "why_emerged": "절대 영도에서 물질이 상전이를 겪으며 발생하는 들뜸(fluctuation)이 상온 근처까지 물성에 영향을 미치는 현상을 설명하기 위해 필요합니다.", "origin": "Hertz, Millis, Lonzarich 등에 의해 이론적 체계가 정립되었습니다.", "connections": "고온 초전도체, 이상 금속 거동, 비-페르미 액체 물성과 연결됩니다."}, {"term": "전자 스핀 공명(ESR)", "why_emerged": "전자 스핀의 자기적 환경과 완화 시간을 직접적으로 조사하기 위한 분광학적 수단입니다.", "origin": "Zavoisky(1944)에 의해 처음 실험적으로 발견되었습니다.", "connections": "NMR, RIXS와 함께 강상관 물질의 자기적 들뜸을 이해하는 핵심 기법입니다."}], "english_summary": ["The paper investigates YbRh2Si2 using advanced low-temperature ESR spectroscopy across the quantum critical phase diagram.", "Experimental results show distinct evolutions of the ESR g-factor and linewidth across paramagnetic, antiferromagnetic, and quantum critical regimes.", "A consistent scaling behavior of the g-factor is observed upon both field-tuning and temperature-tuning toward the quantum critical point.", "The study provides crucial experimental constraints for theoretical models of quantum criticality in strongly correlated electron systems."]}}, {"title": "Exciton multipolarity controls coherent and squeezed phonons in van der Waals heterostructures", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2609.03795", "authors": "Indrajit Maity, Arash A. Mostofi, Johannes Lischner, \\'Angel Rubio", "last_authors": "Johannes Lischner, \\'Angel Rubio", "summary": "Photoexcitation-driven changes in the electronic distribution displace atoms, generating coherent phonons on ultrafast timescales. Two-dimensional (2D) materials and their heterostructures offer a powerful platform for engineering these phonons. Yet, despite the widespread observation of photoexcited coherent phonons, a design principle for controlling their character remains elusive. Here, using detailed atomistic simulations of multilayers of alternating MoSe$_2$ and WSe$_2$, we reveal exciton multipolarity as a design principle for tuning photoinduced phonons from coherent to squeezed. These phonons are interlayer breathing modes, with dipolar excitons coupling linearly to generate coherent states and quadrupolar excitons coupling quadratically to produce squeezed states. Moreover, an out-of-plane electric field enables switch-like control, converting quadrupolar excitons into dipolar excitons and switching the phonon state from squeezed to coherent. For example, in trilayer WSe$_2$/MoSe$_2$/WSe$_2$, the photoexcited 1.04-THz breathing mode switches from a squeezed state at zero field to a coherent state under an applied vertical field. Experimentally, these phonon states can be directly probed by ultrafast X-ray or electron diffraction and indirectly through transient reflectivity. Our results open new avenues for ultrafast control of lattice and electronic dynamics on picosecond timescales, with implications for THz quantum phononics, nanophotonic technologies, and quantum-noise-limited sensing.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Direct relevance to phonon and excitonic dynamics in vdW heterostructures.", "t     const concepts = document.createElement('div');
    concepts.className = 'concepts';
    b.concepts.forEach(c => {
      const item = document.createElement('div');
      item.className = 'concept';
      item.appendChild(textEl('h3', '', c.term || 'Concept'));
      [['왜 생겼나: ', c.why_emerged], ['누가 만들었나: ', c.origin], ['연결되는 흐름: ', c.connections]].forEach(([label, text]) => { if (!text) return; const p = document.createElement('p'); const bold = textEl('b', '', label); p.appendChild(bold); p.append(text); item.appendChild(p); });
      concepts.appendChild(item);
    });
    section.appendChild(concepts);
    briefing.appendChild(section);
  }
  if (b.english_summary && b.english_summary.length) { const section = document.createElement('section'); section.className = 'brief-section wide'; section.appendChild(textEl('h2', '', 'English Summary')); const ul = document.createElement('ul'); b.english_summary.slice(0, 5).forEach(line => ul.appendChild(textEl('li', '', line))); section.appendChild(ul); briefing.appendChild(section); }
  slideEl.appendChild(briefing);
  counterEl.textContent = `${index + 1} / ${slides.length}`;
  prevBtn.disabled = index === 0;
  nextBtn.disabled = index === slides.length - 1;
}
prevBtn.addEventListener('click', () => { index = Math.max(0, index - 1); render(); });
nextBtn.addEventListener('click', () => { index = Math.min(slides.length - 1, index + 1); render(); });
document.addEventListener('keydown', event => { if (event.key === 'ArrowLeft') prevBtn.click(); if (event.key === 'ArrowRight') nextBtn.click(); });
render();
</script>
</body>
</html>
