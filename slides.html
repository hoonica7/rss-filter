pletion in the SrIrO3 layers and the corresponding electron accumulation in the 3d layers. The magnitude of ICT follows the trend expected from electronegativity mismatch, supporting electronegativity driven band alignment as the dominant contribution in this series. Beyond interfacial doping, we find that strong 3d,5d hybridization induces a low spin to high spin conversion in the cobaltate layers, hinting to interface controlled spin state engineering without chemical substitution. These results establish electronegativity mismatch as a predictive design parameter for correlated oxide interfaces and provide a materials platform for tailoring band filling, orbital hierarchy, and spin configurations in quantum oxide heterostructures, paving the way towards advanced oxide electronics and next-generation information technologies.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Experimental electronic structure spectroscopy on correlated oxide heterostructures, relevant to user's broader interests.", "tags": ["heterostructure", "correlated", "XAS", "electronicstructure", "oxides", "spin-orbitcoupling"], "image": "https://arxiv.org/static/browse/0.3.4/images/arxiv-logo-fb.png", "briefing": {"background": "강상관 전자계 산화물 헤테로 구조에서는 계면 전하 이동(ICT)을 통해 벌크에서는 나타나지 않는 새로운 전자 위상이나 물리적 특성을 설계할 수 있으나, 예측 가능한 설계 원리가 부족한 상태입니다.", "motivation": "5d 금속인 SrIrO3와 3d 전이금속 산화물을 결합한 초격자 시스템에서 전기음성도 차이가 계면 전하 이동과 스핀 상태 변화에 미치는 정량적 관계를 규명하고자 했습니다.", "result": "계면 전하 이동의 크기가 3d와 5d 물질 간의 전기음성도 차이와 일치함을 발견하여, 이를 예측 가능한 설계 파라미터로 확립했습니다. 특히 코발트 화합물 계면에서 스핀 상태의 변화(low-spin to high-spin)를 유도할 수 있음을 확인했습니다.", "implication": "화학적 치환 없이도 계면 공학을 통해 전자 구조, 밴드 채움, 궤도 계층, 스핀 상태를 제어할 수 있는 재료 설계의 지침을 제공합니다.", "novelty": "5d 스핀-궤도 결합 물질(SrIrO3)을 포함한 강상관 헤테로 구조에서 전기음성도라는 직관적인 파라미터를 통해 전하 및 스핀 상태를 제어했다는 점이 독자의 electronic structure/DFT+DMFT 연구 관심사와 잘 부합합니다.", "unresolved": "계면에서의 원자 재배열이나 산소 팔면체 회전이 전자 구조에 미치는 국소적 영향은 추가적인 이론 모델링이 필요합니다.", "future_work": "다양한 3d/5d 계면에서의 자기적 질서 형성 및 위상적 특성 변화를 RIXS 등으로 조사하는 연구가 뒤따를 것으로 보입니다.", "concepts": [{"term": "Interfacial Charge Transfer (ICT)", "why_emerged": "서로 다른 화학 포텐셜을 가진 두 물질이 접합될 때 에너지를 최소화하기 위해 전자들이 계면을 가로질러 이동하는 현상을 이해하고 이용하기 위해 필요합니다.", "origin": "전통적인 반도체 접합 물리학에서 유래하였으나, 최근 강상관 산화물 시스템에서 중요하게 다뤄짐.", "connections": "전자 구조 엔지니어링, 밴드 정렬, 산화물 헤테로 구조 물리와 연결됩니다."}, {"term": "Spin-Orbit Coupling (SOC)", "why_emerged": "5d 전이금속과 같이 원자 번호가 큰 시스템에서 전자의 스핀과 궤도 운동이 강하게 결합하여 밴드 구조를 변형시키는 효과를 기술하기 위해 필수적입니다.", "origin": "양자 역학 초기 단계에서 제안됨.", "connections": "토폴로지컬 절연체, Weyl semimetals, 이리데이트(Iridate) 물리와 직결됩니다."}], "english_summary": ["Investigated interfacial charge transfer in 3d/5d oxide superlattices (SrIrO3/3d-perovskites).", "Established electronegativity mismatch as a predictive design parameter for interfacial doping.", "Demonstrated interface-controlled spin-state switching in cobaltate layers.", "Provides a framework for band filling and orbital engineering in quantum oxide heterostructures."]}}, {"title": "Kinematic Quantum Geometry", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2611.13089", "authors": "Bernardo Barrera, Nishchhal Verma, Raquel Queiroz, Anatoli Polkovnikov, Anushya Chandran", "last_authors": "Anatoli Polkovnikov, Anushya Chandran", "summary": "Kinematic quantum geometry describes fast degrees of freedom (DOFs) that adiabatically follow states parametrized by both the coordinates and the velocities of slow DOFs. It extends Born-Oppenheimer geometry, which depends on coordinates alone, introduces mixed Berry curvatures, and modifies the effective theory governing the slow DOFs. We test its predictions in two setups: spinful particles moving in magnetic textures, and Dirac electrons in graphene coupled to an LC circuit. In the first, kinematic quantum geometry produces a velocity-dependent effective mass tensor and generates a Lorentz-like force nonlinear in velocity that can arise even in coplanar textures. In the second, it renormalizes the circuit capacitance and generates a Hall current nonlinear in the electric field. For small velocities, it reproduces recent results for electronic dynamics in external electromagnetic fields and in pseudospin textures. However, the framework can remain valid at large velocities beyond the perturbative regime, provided the kinematic states are sufficiently slowly varying.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Theoretical framework with direct implications for Dirac materials (graphene), Berry curvature, and nonlinear transport.", "tags": ["theory", "graphene", "Diracmaterials", "Berrycurvature", "transport"], "image": "https://arxiv.org/html/2611.13089v1/main1.png", "briefing": {"background": "기존의 본-오펜하이머(Born-Oppenheimer) 근사는 느린 자유도와 빠른 자유도를 분리할 때 위치 좌표에만 의존합니다. 하지만 물리 시스템이 빠르게 변화하는 상황에서는 속도 항까지 고려한 기하학적 구조가 필요합니다.", "motivation": "위치뿐만 아니라 속도까지 고려하는 새로운 양자 기하학적 프레임워크가 시스템의 비선형 수송 현상과 유효 질량 텐서에 어떤 영향을 미치는지 규명하고자 합니다.", "result": "속도에 의존하는 유효 질량 텐서와 비선형 홀 전류를 유도하는 '운동학적 양자 기하학'을 제안했습니다. 이는 그래핀의 전자 역학 등에서 나타나는 비선형 수송 현상을 잘 설명합니다.", "implication": "베리 곡률 효과를 넘어선 고속 운동 체계에서도 유효한 수송 이론을 구축할 수 있으며, 위상 물질의 비선형 광학 및 수송 응답 해석에 중요한 도구가 될 것입니다.", "novelty": "기존의 베리 곡률 기반 이론을 확장하여 속도에 의존하는 고차 보정항을 포함시켰으며, 그래핀과 같은 디락 물질의 비선형 전자기적 응답을 더욱 정교하게 기술합니다.", "unresolved": "운동학적 상태가 아주 급격하게 변하는 강한 비평형 영역에서의 프레임워크 적용 한계는 여전히 과제로 남아 있습니다.", "future_work": "실제 강상관 전자계 물질의 비평형 동역학 및 초고속 레이저 펄스 하에서의 전자 수송 계산에 적용할 예정입니다.", "concepts": [{"term": "Kinematic Quantum Geometry", "why_emerged": "기존 정적 기하학만으로는 설명 불가능한 고속 동역학에서의 양자 상태 변화를 기술하기 위해 필요.", "origin": "본 연구진에 의해 제안됨.", "connections": "Born-Oppenheimer approximation, Berry curvature."}, {"term": "Berry Curvature", "why_emerged": "블로흐 파동 함수의 기하학적 위상 성질을 이해하고 홀 효과 등을 설명하기 위해 도입됨.", "origin": "Michael Berry (1984).", "connections": "Anomalous Hall effect, Topological band theory."}], "english_summary": ["Introduces Kinematic Quantum Geometry to describe DOFs depending on both coordinates and velocities.", "Extends Born-Oppenheimer framework to capture high-velocity regimes and nonlinear transport.", "Predicts velocity-dependent effective mass and nonlinear Hall currents in Dirac materials like graphene.", "Provides a robust theoretical basis for nonlinear electronic response beyond adiabatic approximations."]}}, {"title": "Particle-hole asymmetry and a fluctuating pair-density-wave state in a lightly doped Mott insulator on the square lattice", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2611.14101", "authors": "Hao-Xin Wang, Zheng-Yuan Yue, Wen-Yuan Liu, Zheng-Cheng Gu", "last_authors": "Wen-Yuan Liu, Zheng-Cheng Gu", "summary": "Whether a lightly doped Mott insulator on the square lattice supports robust d d -wave superconductivity remains a central question in strongly correlated physics and in the microscopic theory of cuprate superconductivity. Experiments and numerical studies reveal a pronounced particle–hole asymmetry, pointing to a delicate competition among d d -wave superconductivity, pair-density-wave (PDW), stripe, charge-density-wave (CDW), and antiferromagnetic correlations. Here we combine large-scale density-matrix renormalization group (DMRG) and finite-size projected entangled pair states (PEPS) to study the square-lattice t t - J J model at low doping, δ ≤ 0.1 \\delta\\leq 0.1 , while tuning the next-nearest-neighbor hopping t ′ t^{\\prime} from the electron-like ( t ′ > 0 t^{\\prime}>0 ) to the hole-like ( t ′ < 0 t^{\\prime}<0 ) regime. We uncover a pronounced particle-hole-asymmetric reorganization of the low-energy state. The electron-like side supports robust, nearly uniform d d -wave pairing, whereas decreasing t ′ t^{\\prime} induces a period-two plaquette modulation and ultimately produces, on the hole-like side, a charge-dominated state with a strongly suppressed static pairing amplitude. This evolution is supported by DMRG calculations on open strips and PEPS calculations on open square lattices up to 16 × 16 16\\times 16 sites that preserve C 4 C_{4} symmetry at the Hamiltonian level. On these squares, both methods find that the pair correlations of the hole-like state select the plaquette momenta ( π , 0 ) (\\pi,0) and ( 0 , π ) (0,\\pi) and decay within a few lattice spacings, while the dominant charge-density modulation forms a bidirectional checkerboard whose period extrapolates to about 4 ​ a 0 4a_{0} , close to that observed in lightly doped Bi-2201. These observations establish a fluctuating plaquette PDW in the lightly doped hole-like regime, in which local pairs carry finite momentum but lack phase coherence. Our results firmly establish particle-hole asymmetry as a central organizing principle for competing pairing tendencies in the lightly doped t t - J J model. The suppression of uniform pairing on the hole-like side further motivates investigating whether material-specific processes (such as extended Cu-O molecular-orbital dynamics beyond a strict Zhang-Rice singlet description, correlated hopping, and lattice coupling) enhance pair mobility and global superconducting coherence.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Theoretical study of competing orders in lightly doped Mott insulators, relevant to cuprate superconductivity and CDW.", "tags": ["theory", "cuprates", "superconductivity", "CDW", "correlated", "Mott"], "image": "https://arxiv.org/html/2611.14101v1/pairing_sector_summary_schematic_candidate_v2.png", "briefing": {"background": "강상관 전자계, 특히 구리 산화물 초전도체에서 도핑에 따른 초전도 상태와 전하 밀도 파(CDW), 스핀 구조 간의 복잡한 경쟁 관계를 이해하는 것은 물성 물리학의 핵심 난제입니다.", "motivation": "전자 도핑과 정공 도핑 간의 비대칭성(particle-hole asymmetry)이 어떻게 초전도성과 전하 질서 형성에 결정적인 차이를 만드는지 규명하고자 합니다.", "result": "DMRG 및 PEPS 수치 계산을 통해 정공 도핑 측에서 '요동치는 플래켓 쌍 밀도 파(fluctuating plaquette PDW)'가 우세하며, 이것이 초전도성을 억제하는 주된 원인임을 밝혔습니다.", "implication": "구리 산화물(Bi-2201 등)에서 관찰되는 전하 정렬 현상과 초전도성 억제 기작을 이론적으로 정당화할 수 있는 강력한 증거를 제공합니다.", "novelty": "t-J 모델에서 t' 매개변수에 따른 입자-정공 비대칭성을 체계적으로 연구하여, 실험적 결과와 잘 부합하는 PDW 상태의 존재를 입증했습니다.", "unresolved": " upling."}], "english_summary": ["Directly visualizes site-selective Co 3d orbital states in Ca3Co2O6 using synchrotron X-ray diffraction.", "Reveals that trigonal-prismatic Co site anisotropy arises from orbital hybridization beyond simple CEF effects.", "Demonstrates the power of valence electron density analysis in probing local electronic environments.", "Provides experimental real-space evidence for Co 3d-O 2p-Co 4p hybridization in Ising chain magnets."]}}, {"title": "Thermodynamic signatures of a nearby quantum critical endpoint in UTe2 under intense magnetic field", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2611.14185", "authors": "M. Gen, K. Somesh, A. Miyake, et al.", "last_authors": "D. Aoki, W. Knafo", "summary": "Several unconventional superconducting phases have been discovered in the vicinity of metamagnetism in the heavy-fermion paramagnet UTe 2 under magnetic field. To describe the mechanism of magnetic-field-induced superconductivity, a challenge is to characterize the quantum critical magnetic properties at the metamagnetic transition. In this work, we investigate the thermodynamic properties of UTe 2 under magnetic fields up to 60 T applied in the crystallographic 𝐛 − 𝐜 \\mathbf{b}-\\mathbf{c} plane. Magnetization and magnetostriction experiments have been performed under magnetic fields tilted by an angle θ ≲ 42 ∘ \\theta\\lesssim 42^{\\circ} from 𝐛 \\mathbf{b} toward 𝐜 \\mathbf{c} . They support that a quantum critical endpoint at the field angle θ Q ​ C ​ E ​ P ≃ ( 70 ± 10 ) ∘ \\theta_{QCEP}\\simeq(70\\pm 10)^{\\circ} and magnetic field μ 0 ​ H Q ​ C ​ E ​ P ≃ ( 75 ± 10 ) \\mu_{0}H_{QCEP}\\simeq(75\\pm 10) T terminates the metamagnetic transition line. A pseudo-gap in the magnetic susceptibility is related with the metamagnetic transition observed in magnetic fields for θ < θ Q ​ C ​ E ​ P \\theta<\\theta_{QCEP} . The possible relation between the quantum critical endpoint and the development of magnetic-fie   if (r.last_authors || r.authors) { const authors = document.createElement('p'); authors.className = 'authors'; if (r.last_authors) authors.append('Last authors: ' + r.last_authors); if (r.authors) authors.append((r.last_authors ? ' | ' : '') + 'Authors: ' + r.authors); headText.appendChild(authors); }
  appendLabeledText(headText, 'why', 'Filter reason: ', r.reason);
  if (r.tags && r.tags.length) { const tags = document.createElement('div'); tags.className = 'tags'; r.tags.forEach(tag => tags.appendChild(textEl('span', 'tag', '#' + tag))); headText.appendChild(tags); }
  if (r.link) { const link = document.createElement('a'); link.className = 'link'; link.href = r.link; link.target = '_blank'; link.rel = 'noopener noreferrer'; link.textContent = 'Open paper'; headText.appendChild(link); }
  head.appendChild(headText);
  if (r.summary) { const abstract = document.createElement('p'); abstract.className = 'original-abstract'; const strong = textEl('strong', '', 'Original abstract'); abstract.appendChild(strong); abstract.append(r.summary); head.appendChild(abstract); }
  slideEl.appendChild(head);
  const briefing = document.createElement('div');
  briefing.className = 'briefing';
  appendBriefSection(briefing, 'Background', b.background);
  appendBriefSection(briefing, 'Motivation', b.motivation);
  appendBriefSection(briefing, 'Result', b.result);
  appendBriefSection(briefing, 'Implication', b.implication);
  appendBriefSection(briefing, "Why it's important / Novelty", b.novelty);
  appendBriefSection(briefing, 'Unresolved Questions', b.unresolved);
  appendBriefSection(briefing, 'Expected Future Work', b.future_work);
  if (b.concepts && b.concepts.length) {
    const section = document.createElement('section');
    section.className = 'brief-section wide';
    section.appendChild(textEl('h2', '', 'Concepts / Terms'));
    const concepts = document.createElement('div');
    concepts.className = 'concepts';
    b.concepts.forEach(c => {
      const item = document.createElement('div');
      item.className = 'concept';
      item.appendChild(textEl('h3', '', c.term || 'Concept'));
      [['왜 생겼나: ', c.why_emerged], ['누가 만들었나: ', c.origin], ['연결되는 흐름: ', c.connections]].forEach(([label, text]) => { if (!text) return; const p = document.createElement('p'); const bold = textEl('b', '', label); p.appendChild(bold); p.append(text); item.appendChild(p); });
      concepts.appendChild(item);
    });
    section.appendChild(concepts);
    briefing.appendChild(section);
  }
  if (b.english_summary && b.english_summary.length) { const section = document.createElement('section'); section.className = 'brief-section wide'; section.appendChild(textEl('h2', '', 'English Summary')); const ul = document.createElement('ul'); b.english_summary.slice(0, 5).forEach(line => ul.appendChild(textEl('li', '', line))); section.appendChild(ul); briefing.appendChild(section); }
  slideEl.appendChild(briefing);
  counterEl.textContent = `${index + 1} / ${slides.length}`;
  prevBtn.disabled = index === 0;
  nextBtn.disabled = index === slides.length - 1;
}
prevBtn.addEventListener('click', () => { index = Math.max(0, index - 1); render(); });
nextBtn.addEventListener('click', () => { index = Math.min(slides.length - 1, index + 1); render(); });
document.addEventListener('keydown', event => { if (event.key === 'ArrowLeft') prevBtn.click(); if (event.key === 'ArrowRight') nextBtn.click(); });
render();
</script>
</body>
</html>
