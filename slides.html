<!DOCTYPE html>

<title>Daily Paper Slideshow</title>
<style>
  :root {
    color-scheme: light;
    --bg: #f6f7f4;
    --paper: #ffffff;
    --ink: #111827;
    --muted: #64748b;
    --line: #d8ddd2;
    --accent: #176b87;
    --accent-2: #9a3412;
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; overflow: auto; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: var(--bg); color: var(--ink); }
  .shell { max-width: 1500px; min-height: 100vh; margin: 0 auto; padding: 14px 18px; display: flex; flex-direction: column; }
  .topbar { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 16px; }
  .top-actions { display: flex; align-items: center; gap: 10px; }
  .topbar a, button { border: 1px solid var(--line); border-radius: 8px; background: var(--paper); color: var(--ink); padding: 10px 14px; font-weight: 700; text-decoration: none; cursor: pointer; }
  button.primary { background: var(--accent); border-color: var(--accent); color: white; }
  button:disabled { opacity: 0.45; cursor: not-allowed; }
  .counter { color: var(--muted); font-weight: 700; }
  .slide { min-height: calc(100vh - 82px); background: var(--paper); border: 1px solid var(--line); border-radius: 10px; padding: 18px; box-shadow: 0 18px 42px rgba(15, 23, 42, 0.10); display: grid; grid-template-columns: minmax(310px, 0.86fr) minmax(0, 1.55fr); gap: 18px; overflow: visible; }
  .paper-head { min-width: 0; min-height: 0; overflow: visible; display: flex; flex-direction: column; gap: 12px; }
  .figure { margin: 0; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: #f8fafc; }
  .figure img { display: block; width: 100%; max-height: 41vh; object-fit: contain; background: white; }
  .figure figcaption { padding: 7px 10px; color: var(--muted); font-size: 12px; line-height: 1.3; }
  .head-text { display: flex; flex-direction: column; gap: 9px; min-width: 0; }
  .badges { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .badge { border-radius: 999px; padding: 5px 9px; background: #eef2ff; color: #3730a3; font-size: 12px; font-weight: 800; }
  .score { background: #fee2e2; color: #991b1b; }
  h1 { margin: 0; font-size: 25px; line-height: 1.15; letter-spacing: 0; overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
  h1 a { color: inherit; text-decoration-color: rgba(23, 107, 135, 0.35); text-decoration-thickness: 2px; text-underline-offset: 4px; }
  h1 a:hover { color: var(--accent); text-decoration-color: var(--accent); }
  .meta, .authors, .why, .abstract { font-size: 13px; line-height: 1.45; }
  .meta, .authors { color: var(--muted); }
  .why strong, .abstract strong, .authors strong { color: var(--ink); }
  .authors { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .why { border-left: 4px solid var(--accent-2); padding-left: 10px; color: #374151; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .abstract { border-top: 1px solid var(--line); padding-top: 14px; color: #374151; }
  .original-abstract { border-top: 1px solid var(--line); padding-top: 10px; color: #374151; font-size: 11.5px; line-height: 1.35; overflow-wrap: anywhere; }
  .original-abstract strong { display: block; margin-bottom: 4px; color: var(--ink); }
  .tags { display: flex; flex-wrap: wrap; gap: 8px; }
  .tag { border-radius: 999px; padding: 4px 8px; background: #f1f5f9; color: #475569; font-size: 12px; font-weight: 700; }
  .head-text > .link { display: none; }
  .briefing { min-width: 0; min-height: 0; overflow: visible; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); grid-auto-rows: minmax(0, auto); align-content: start; gap: 11px 18px; border-top: 0; padding-top: 0; }
  .brief-section { min-width: 0; }
  .brief-section.wide { grid-column: 1 / -1; }
  .brief-section h2 { margin: 0 0 4px; font-size: 14px; line-height: 1.22; color: #0f766e; letter-spacing: 0; }
  .brief-section p, .brief-section li { margin: 0; font-size: 12.5px; line-height: 1.42; color: #1f2937; overflow-wrap: anywhere; }
  .brief-section ul { margin: 0; padding-left: 20px; }
  .concepts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 9px 14px; }
  .concept { border-top: 1px solid var(--line); padding-top: 7px; }
  .concept h3 { margin: 0 0 4px; font-size: 13px; color: #7c2d12; letter-spacing: 0; }
  .concept p { margin: 2px 0 0; font-size: 11.5px; line-height: 1.35; color: #374151; overflow-wrap: anywhere; }
  .concept b { color: #111827; }
  .link { color: var(--accent); font-weight: 800; text-decoration: none; }
  .empty { padding: 48px; background: var(--paper); border: 1px solid var(--line); border-radius: 12px; color: var(--muted); }
  @media (max-width: 860px) {
    .shell { padding: 14px; }
    .topbar, .top-actions { align-items: stretch; flex-direction: column; }
    .slide, .briefing, .concepts { grid-template-columns: 1fr; }
    .slide { min-height: auto; overflow: visible; display: grid; }
    h1 { font-size: 28px; }
  }
</style>

const slides = [{"title": "Evidence for p-wave magnetism in electronic band structure of metallic EuSi", "journal": "Nature", "source": "author whitelist", "link": "https://www.nature.com/articles/s41586-026-11295-9", "authors": "Erjian Cheng, Yixing Yang, Yifan Gao, et al.", "last_authors": "Zhongkai Liu, Claudia Felser", "summary": "A combination of symmetry analysis, first-principles calculations, neutron scattering and photoemission spectroscopy shows p-wave magnetism in the near-Fermi-level electronic structure of stoichiometric metallic EuSi.", "tier": "A_MUST_READ", "score": "10", "reason": "author whitelist: Makoto Hashimoto", "tags": ["photoemission", "neutronscattering", "bandstructure"], "image": "https://media.springernature.com/m685/springer-static/image/art%3A10.1038%2Fs41586-026-11295-9/MediaObjects/41586_2026_11295_Fig1_HTML.png", "briefing": {"background": "자성 금속 화합물에서 전자 밴드 구조와 자기 질서 사이의 상호작용은 응집물질물리학의 핵심 과제 중 하나입니다. 특히 p-파(p-wave) 자기적 특성은 고전적인 자기 질서와 다른 궤도 각운동량 성분을 포함하며, 비전형적인 전자 상관관계를 이해하는 데 중요합니다.", "motivation": "EuSi라는 화학량론적 금속에서 발견된 독특한 자기적 거동이 전자 밴드 구조에 어떻게 반영되는지 규명하고자 함.", "result": "대칭성 분석, 제1원리 계산, 중성자 산란, 광전자 분광법(ARPES)을 결합하여 페르미 준위 근처에서 p-파 자기적 특징을 갖는 전자 밴드 구조를 실험적으로 입증함.", "implication": "p-파 자기적 상태가 금속의 전자 구조에 미치는 영향을 확인했으며, 이는 비전형적인 자성 물질 연구에 새로운 프레임워크를 제공함.", "novelty": "기존의 s-파 기반 자성 모델을 넘어, 궤도 대칭성이 결합된 p-파 자기 질서가 금속 상태에서 직접적으로 관측되었다는 점에서 매우 중요함.", "unresolved": "p-파 자기 질서가 초전도성이나 다른 위상학적 현상과 어떻게 연결되는지, 그 동역학적 기원은 여전히 추가 연구가 필요함.", "future_work": "저온 환경에서의 자기 수송 현상 측정 및 p-파 특성에 기반한 스핀트로닉스 소자 응용 연구가 기대됨.", "concepts": [{"term": "p-wave magnetism", "why_emerged": "기존 s-파 자성과 달리 궤도 각운동량 성분이 자기 질서에 중요한 역할을 할 때 발생.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "스핀-궤도 결합, 비전형적 초전도체."}, {"term": "Stoichiometric metal", "why_emerged": "화학적 조성이 엄밀하게 유지되어 불순물에 의한 산란이 배제된 이상적인 시스템을 연구하기 위해 필요.", "origin": "재료과학의 기초 개념.", "connections": "고순도 결정 성장, 밴드 구조 이론."}], "english_summary": ["EuSi is identified as a system exhibiting p-wave magnetism in its electronic structure.", "The study integrates neutron scattering and photoemission spectroscopy for verification.", "The results confirm the momentum-dependent spin structure near the Fermi level.", "This work provides a framework for understanding complex magnetism in metallic systems."]}}, {"title": "Intracycle Interference in Strong-Field Photoemission from a Tungsten Needle Tip", "journal": "PRL_Recent", "source": "keyword", "link": "http://link.aps.org/doi/10.1103/t87j-1ngl", "authors": "Timo Wirth, Jonas Heimerl, Stefan Meier, Peter Hommelhoff", "last_authors": "Stefan Meier, Peter Hommelhoff", "summary": "by strong laser fields can rescatter, generating attosecond high harmonics. Spectral peaks arise from inter- and intracycle interference of coherent electron wave packets. While intercycle interference is well known, intracycle interference of plateau electrons has not been ob…", "tier": "A_MUST_READ", "score": "9", "reason": "title strong match: photoemission", "tags": ["photoemission"], "image": "", "briefing": {"background": "강한 레이저 장을 이용한 광전자 분광법은 고체 표면의 전자 동역학을 아토초 단위의 분해능으로 연구하는 강력한 도구입니다.", "motivation": "텅스텐 팁에서 강한 레이저장에 의해 발생하는 광전자의 재산란 과정 중 발생하는 '인트라사이클(intracycle)' 간섭 현상을 이해하기 위함.", "result": "고차 조화파(high harmonics) 생성 과정에서 발생하는 인트라사이클 간섭 현상을 실험적으로 관측하고 스펙트럼 피크의 기원을 밝힘.", "implication": "금속 표면의 극초단 전자 동역학을 조절하고 이해하는 데 있어 간섭 현상이 중요한 역할을 함을 증명함.", "novelty": "잘 알려진 인터사이클(intercycle) 간섭과 달리, 단일 사이클 내에서 발생하는 전자 파동 패킷의 간섭을 실험적으로 포착한 점이 돋보임.", "unresolved": "이러한 극초단 전자 동역학이 복잡한 위상학적 물질이나 상관관계 물질의 전자 구조 측정에 미치는 영향은 아직 명확하지 않음.", "future_work": "더 다양한 재료 표면에 대한 고해상도 아토초 광전자 분광 측정 및 이론적 모델링 고도화.", "concepts": [{"term": "Intracycle interference", "why_emerged": "레이저 필드의 단일 사이클 내에서 방출된 전자 파동 패킷들 사이의 중첩 현상을 기술하기 위해 필요.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "고차 조화파 생성, 강한 장 물리학."}, {"term": "Rescattering", "why_emerged": "강한 장 환경에서 전자가 가속된 후 이온 코어로 되돌아와 충돌하는 현상을 설명하기 위해 제안됨.", "origin": "Corkum (1993).", "connections": "HHG(High Harmonic Generation), 광전자 분광법."}], "english_summary": ["The study investigates intracycle interference in strong-field photoemission from tungsten tips.", "It resolves the spectral peaks generated by coherent electron wave packets.", "The work differentiates between intercycle and intracycle interference mechanisms.", "This provides insights into attosecond electron dynamics at solid surfaces."]}}, {"title": "Altermagnets versus Antiferromagnets", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2601.14878", "authors": "V. P. Mineev", "last_authors": "V. P. Mineev", "summary": "Altermagnets are substances with a momentum-dependent spin splitting of electron bands due to a specific crystal structure that is invariant under time reversal only in combination with rotations and reflections. The developed phenomenological approach allows to obtain a spectrum of electron bands in altermagnets corresponding to their magnetic group symmetry. We consider antiferromagnetic, weak ferromagnetic, and ferrimagnetic structures. The calculated Berry curvature of electron bands in the altermagnet with zero spontaneous magnetisation occurs an odd function of momentum components whereas it is even in a weak ferromagnetic state. The Berry curvature in ferrimagnetic state consists of sum of even and odd terms.", "tier": "A_MUST_READ", "score": "9", "reason": "Direct hit: theory of altermagnets, Berry curvature, and their electronic band structure.", "tags": ["theory", "altermagnetism", "Berrycurvature", "electronicstructure", "magnetism"], "image": "https://arxiv.org/html/2601.14878v5/Fig1.png", "briefing": {"background": "반강자성체와 구별되는 새로운 자기적 위상인 알터마그넷(Altermagnet)은 비전형적인 밴드 분할을 보여주어 차세대 스핀트로닉스 재료로 주목받고 있습니다.", "motivation": "알터마그넷과 일반적인 반강자성체 사이의 물리적 차이를 명확히 하고, 전자 밴드 구조 및 베리 곡률(Berry curvature) 측면에서 체계적으로 분류하기 위함.", "result": "대칭성 분석을 통해 알터마그넷의 밴드 분할이 시간 반전 대칭성과 결정 대칭성의 결합으로 발생함을 보이고, 베리 곡률의 모멘텀 의존성을 통해 반강자성/페리자성체와 구분되는 특징을 도출함.", "implication": "알터마그넷의 전자 구조적 특징을 규명하여, 향후 스핀 수송 현상 및 위상학적 특성을 활용한 소자 설계의 이론적 토대를 마련함.", "novelty": "알터마그넷의 베리 곡률이 모멘텀의 홀함수(odd function)로 나타난다는 점을 이론적으로 명시하여, 기존 반강자성체와 차별화되는 위상적 특성을 명확히 함.", "unresolved": "실제 실험적 재료에서 베리 곡률에 의한 이상 홀 효과(AHE)의 크기를 완벽하게 예측하는 것은 여전히 난제임.", "future_work": "다양한 알터마그넷 후보 물질에 대한 ARPES 및 수송 현상 실험과의 정량적 비교 연구.", "concepts": [{"term": "Altermagnetism", "why_emerged": "시간 반전 대칭성이 깨진 반강자성 구조에서 스핀 분할이 발생하는 새로운 자기 위상을 기술하기 위해 필요.", "origin": "Šmejkal et al. (2022).", "connections": "반강자성체, 스핀트로닉스, 위상학적 물질."}, {"term": "Berry curvature", "why_emerged": "밴드 구조의 기하학적 위상 성질을 기술하고 이상 홀 효과 등을 설명하기 위해 필요.", "origin": "Berry (1984).", "connections": "위상 절연체, 비정상 홀 효과, 궤도 자기 모멘트."}], "english_summary": ["The paper provides a phenomenological theory distinguishing altermagnets from antiferromagnets.", "It analyzes momentum-dependent band splitting based on magnetic group symmetry.", "Berry curvature calculations show unique odd/even dependencies in altermagnets.", "This framework helps classify magnetic materials for topological and spintronic applications."]}}, {"title": "momipy: A time-resolved momentum microscopy data analysis workflow", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2611.25888", "authors": "Paul Werner (I. Physikalisches Institut, Georg-August-Universit\\\"at G\\\"ottingen, Germany), et al.", "last_authors": "Stefan Mathias (I. Physikalisches Institut, International Center for Advanced Studies of Energy Conversion)", "summary": "Photoemission momentum microscopy is an emerging approach to photoelectron spectroscopy that is transforming electronic band structure mapping at both laboratory-based and large-scale facilities. Its extension to time-resolved measurements has recently enabled major advances, ranging from the femtosecond imaging of exciton wavefunctions to dark-field photoelectron microscopy of light-induced dynamics and strong light-matter interactions. However, the rapid acquisition of high-dimensional data sets (including electron in-plane momenta $k_x$ and $k_y$, kinetic energy $E_\\mathrm{kin}$, time $\\Delta t$, and more) poses substantial challenges for data handling and analysis. A typical workflow encompasses data acquisition, exploratory visualization, calibration and targeted feature extraction, with data management ideally guided by FAIR principles. Here, we present momipy, a Python package that streamlines the momentum microscopy data analysis workflow efficiently and at low computational cost. Among other features, momipy provides interactive 4D data visualization, energy and momentum calibration, space-charge correction, and a broad selection of multidimensional data analysis routines, including binning, momentum-map extraction and time-, energy- and momentum-resolved model fitting. momipy is accompanied by a selection of interactive example scripts, supporting adoption of momipy by both experienced researchers and users new to momentum microscopy.", "tier": "A_MUST_READ", "score": "9", "reason": "Highly relevant software package for ARPES and momentum microscopy data analysis.", "tags": ["method", "ARPES", "momentummicroscopy"], "image": "https://arxiv.org/html/2611.25888v1/fig1_v12.png", "briefing": {"background": "시간 분해 광전자 분광법(TR-ARPES) 및 모멘텀 현미경은 고체 내부의 전자 구조 및 동역학을 페미초(fs) 단위의 시간 분해능으로 관측할 수 있는 강력한 도구입니다.", "motivation": "모멘텀 현미경은 4차원(kx, ky, E, t) 이상의 거대 데이터를 생성하므로, 연구자가 이를 효율적으로 보정, 시각화 및 정량 분석할 수 있는 표준화된 워크플로우 소프트웨어가 필요했습니다.", "result": "데이터 분석 효율을 높이고 정량적 피팅을 자동화하는 Python 패키지 'momipy'를 개발하여 공개했습니다.", "implication": "ARPES 및 모멘텀 현미경 분야에서 데이터 처리의 재현성을 높이고, 분석 시간을 획기적으로 줄여 보다 복잡한 다차원 데이터 해석을 가능하게 합니다.", "novelty": "데이터 분석 자동화뿐만 아니라 FAIR 원칙을 준수하는 관리 환경을 제공하며, 특히 공간 전하 보정(space-charge correction) 루틴을 포함하여 사용자 편의성을 극대화했습니다.", "unresolved": "소프트웨어 패키지이므로 고유한 물리적 현상 해결과는 거리가 있으나, 데이터 분석 도구의 정밀도가 실제 물리 결과 해석에 미치는 영향은 향후 검증이 필요합니다.", "future_work": "커뮤니티의 피드백을 통한 기능 확장 및 다양한 실험실/대형 시설 데이터 포맷에 대한 지속적인 호환성 업데이트가 예상됩니다.", "concepts": [{"term": "Momentum microscopy", "why_emerged": "기존 ARPES보다 넓은 운동량 공간을 한 번에 효과적으로 측정하기 위해 개발되었습니다.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "ARPES, K-space mapping, Photoelectron spectroscopy"}, {"term": "FAIR principles", "why_emerged": "연구 데이터의 검색, 접근, 상호 운용 및 재사용을 보장하기 위해 도입되었습니다.", "origin": "Wilkinson et al. (2016)", "connections": "Open science, Data management"}, {"term": "Space-charge correction", "why_emerged": "강한 광 펄스 사용 시 광전자 간의 쿨롱 상호작용으로 인한 에너지 분해능 저하를 보정하기 위해 필요합니다.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "TR-ARPES, Electron optics"}], "english_summary": ["momipy is a new Python package for efficient analysis of high-dimensional momentum microscopy data.", "The tool supports interactive 4D visualization, energy/momentum calibration, and space-charge correction.", "It facilitates FAIR data management and streamlines the workflow for both novice and expert users.", "This package provides a scalable solution for time-resolved ARPES and momentum spectroscopy experiments."]}}, {"title": "Fermi-surface-driven linear magnetoresistance in the kagome magnet TbMn6Sn6", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/grzw-y5lz", "authors": "Sicheng Zhou, Ruihuan Duan, Jie Pang, et al.", "last_authors": "Guangtong Liu, Li Lu", "summary": "Here, the authors identify a Fermi surface driven mechanism for positive linear magnetoresistance in the kagome ferrimagnet TbMn 6 Sn 6 . Measurements on multiple nanoflake devices reveal pronounced linear magnetoresistance, with substantial device-to-device variations in both its slope and the quadratic-to-linear crossover field. Combining magnetotransport experiments with first-principles-based semiclassical calculations, the authors demonstrate how the relaxation time and small shifts in chemical potential govern these variations. These findings provide insight into the microscopic origin of linear magnetoresistance and, in particular, its emergence at relatively low crossover fields.", "tier": "B_IMPORTANT_CONDMAT", "score": "9", "reason": "Excellent experimental transport study on a relevant kagome magnet system.", "tags": ["kagome", "transport", "Fermisurface"], "image": "", "briefing": {"background": "가고메(Kagome) 격자는 기하학적 좌절(frustration)과 평탄한 띠(flat band), 반 폰 호브 특이점 등으로 인해 강상관 전자계 연구의 중심이 되고 있습니다.", "motivation": "TbMn6Sn6와 같은 가고메 자성체에서 관찰되는 선형 자기저항(LMR)의 기원이 불분명하여, 전자 구조와의 상관관계를 규명하고자 했습니다.", "result": "나노 박막 소자 측정을 통해 선형 자기저항을 관찰했으며, 페르미 면에서의 산란 시간과 화학 퍼텐셜 이동이 이 현상을 결정함을 밝혀냈습니다.", "implication": "자기저항의 선형성이 물질의 고유한 양자 효과뿐만 아니라 샘플의 미세한 전자 구조 변화에 의해 제어될 수 있음을 시사합니다.", "novelty": "가고메 자성체에서 자기저항의 선형성과 2차-선형 크로스오버 현상을 반고전적 계산과 결합하여 미시적으로 설명한 점이 핵심입니다.", "unresolved": "소자 간의 변동이 여전히 존재하며, 이러한 불균일성이 벌크 특성인지 박막 공정상의 문제인지에 대한 추가 연구가 필요합니다.", "future_work": "다양한 페르미 준위 조절(게이팅 또는 도핑)을 통한 자기저항 거동의 미세 조정 실험이 필요합니다.", "concepts": [{"term": "Linear Magnetoresistance (LMR)", "why_emerged": "자기장에서 저항이 자기장에 비례하여 변화하는 현상으로, 종종 비전통적 물리 기전의 신호로 간주됩니다.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "Quantum limit, Fermi surface, Scattering rate"}, {"term": "Kagome ferrimagnet", "why_emerged": "가고메 격자의 전자 구조와 자기 정렬이 결합되어 복잡한 위상학적 물리 현상을 유도하기 때문입니다.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "Berry curvature, Topological phases, AV3Sb5"}], "english_summary": ["The authors investigate Fermi-surface-driven linear magnetoresistance in TbMn6Sn6.", "Nanoflake devices show linear magnetoresistance with device-dependent crossover fields.", "Semiclassical calculations reveal that relaxation time and chemical potential shifts explain the variations.", "The findings clarify the microscopic origins of LMR in magnetic kagome materials."]}}, {"title": "Emergence and Detection of Surface altermagnetism in KV2Se2O", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2608.03551", "authors": "Rodrigo Jaeschke-Ubiergo, Xanthe H. Verbeek, Colin Lange, et al.", "last_authors": "Alexander Mook, Jairo Sinova", "summary": "We demonstrate the recent concept of emergent surface altermagnetism through its unique signatures in KV$_2$Se$_2$O. We show that for bulk antiferromagnetically ordered KV$_2$Se$_2$O, the (001) surface exhibits $d$-wave altermagnetism. Our results fully explain the recent seemingly contradicgting experimental evidence, independently showing both an antiferromagnetically ordered bulk from neutron diffraction, and $d$-wave spin splitting from photoemission spectroscopy. To fully verify this conecept, we predict, as a key experimental signature, a large nonlinear Edelstein response, which is localized at the surface, and follows the $d$-wave altermagnetic symmetry. These results are not only relevant for the metallic and room-temperature magnet KV$_2$Se$_2$O, but also for several other Lieb lattice systems. Our work expands the pool of techniques that can be used to detect altermagnetism emerging at the surfaces of antiferromagnets.", "tier": "B_IMPORTANT_CONDMAT", "score": "9", "reason": "Altermagnetism study using photoemission (ARPES) in a real material; highly relevant.", "tags": ["experiment", "altermagnetism", "photoemission"], "image": "https://arxiv.org/html/2608.03551v2/surface_states.001.jpeg", "briefing": {"background": "알터자성(Altermagnetism)은 시간 역전 대칭성을 깨면서도 순 자화가 없는 새로운 자기 정렬 상태로, 최근 응집물질물리학의 큰 화두입니다.", "motivation": "KV2Se2O에서 벌크의 반강자성 특성과 표면에서의 d-wave 스핀 분할 관측 결과가 서로 모순되어 보였던 문제를 해결하고자 했습니다.", "result": "벌크는 반강자성 상태를 유지하지만, 표면(001)에서는 대칭성 깨짐으로 인해 d-wave 알터자성이 발생함을 규명했습니다.", "implication": "알터자성이 벌크뿐만 아니라 표면에서도 국소적으로 발현될 수 있음을 증명하여, 향후 다양한 Lieb 격자 기반 물질로의 연구 확장이 가능해졌습니다.", "novelty": "실험적 결과의 모순을 알터자성 대칭성으로 논리적으로 해결하였으며, 표면 국소 Edelstein 효과를 실험 신호로 제안했습니다.", "unresolved": "제안된 비선형 Edelstein 효과에 대한 실제 실험적 검증이 남아 있습니다.", "future_work": "표면 민감성 측정 기법을 활용한 Edelstein 효과의 정량적 측정 및 다른 Lieb 격자 물질들에 대한 확장 연구.", "concepts": [{"term": "Altermagnetism", "why_emerged": "기존의 강자성이나 반강자성과는 다른, 결정 대칭성을 바탕으로 스핀 분할을 유도하는 새로운 자기 상태를 분류하기 위해 제안되었습니다.", "origin": "Šmejkal et al. (2022)", "connections": "Spintronics, Antiferromagnetism, Berry curvature"}, {"term": "Edelstein effect", "why_emerged": "결정 대칭성 파괴가 스핀 전류나 자기적 응답을 유도하는 물리 현상을 설명하기 위해 필요합니다.", "origin": "V. M. Edelstein (1990)", "connections": "Spin-orbit coupling, Rashba effect, Spintronics"}], "english_summary": ["The paper explains the emergence of d-wave altermagnetism at the (001) surface of KV2Se2O.", "It resolves the contradiction between bulk antiferromagnetic data and surface photoemission results.", "The study proposes a large nonlinear Edelstein response as a signature of this surface phase.", "This work broadens the scope of altermagnetism to include surface-specific states in Lieb lattice systems."]}}, {"title": "Magnetic field control of the excitonic transition in Ta2NiSe5 (Phys. Rev. B)", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2601.23136", "authors": "Giacomo Mazza", "last_authors": "Giacomo Mazza", "summary": "The formation of excitonic insulator phases in quantum materials is often masked by structural distortions caused by the coupling between electronic and phononic order parameters. Here, for the candidate material Ta$_2$NiSe$_5$, we show that sufficiently high magnetic fields can stabilize an excitonic insulating phase in the absence of a lattice distortion. By considering the interplay between the excitonic and structural instabilities, we predict a magnetic field-induced transition from the low-temperature, structurally distorted, semiconducting phase to an undistorted excitonic insulator phase with ground-state loop currents. Before the transition, the magnetic field-softening of the phonon mode associated with the structural distortion reveals the existence of a latent excitonic phase under the structurally distorted one. These results highlight an unbiased route towards the disentanglement of the coupled excitonic-structural transition in Ta$_2$NiSe$_5$, and uncover a general mechanism for magnetic field control of competing phases in quantum materials.", "tier": "B_IMPORTANT_CONDMAT", "score": "9", "reason": "Theory proposing magnetic field control to induce loop currents, a direct interest, in an excitonic insulator.; demoted from A: broad CM, not direct user/project hit", "tags": ["theory", "excitonicinsulator", "loopcurrent", "magneticfield", "quantummaterials"], "image": "https://arxiv.org/html/2601.23136v2/fig_supp0_s.png", "briefing": {"background": "Ta2NiSe5는 구조적 왜곡(격자 변형)과 엑시톤 절연체(excitonic insulator, EI) 상태가 강하게 결합되어 있어, 순수한 EI 상태만을 분리하여 관찰하기가 매우 어렵습니다.", "motivation": "강한 자기장을 가함으로써 격자 왜곡 없이 엑시톤 절연체 상태만을 안정화하고, 그 안에서 이론적으로 예측된 '루프 전류(loop currents)'를 제어할 수 있는지를 확인하고자 합니다.", "result": "자기장이 격자 왜곡과 관련된 포논 모드를 연화(softening)시켜, 구조적 왜곡이 제거된 상태에서 루프 전류를 포함한 순수한 엑시톤 절연체 상으로의 전이를 유도할 수 있음을 이론적으로 예측했습니다.", "implication": "자기장을 통해 구조적/전자적 불안정성을 분리함으로써, 물질 내부의 숨겨진(latent) 엑시톤 상을 드러낼 수 있는 일반적인 제어 메커니즘을 제시합니다.", "novelty": "기존 연구들은 구조적 전이와 EI 전이가 분리되지 않아 해석이 모호했으나, 본 연구는 자기장을 변수로 활용하여 경쟁 상태를 제어하는 명확한 물리적 경로를 제안합니다.", "unresolved": "실제 실험적 구현에서 요구되는 매우 높은 자기장의 크기가 기술적 한계가 될 수 있으며, 루프 전류의 직접적인 실험적 검출은 여전히 과제로 남아 있습니다.", "future_work": "고자기장 환경에서의 라만 분광법이나 ARPES를 통해 포논 연화 및 전자 구조의 변화를 실제 관측하는 후속 연구가 필요합니다.", "concepts": [{"term": "엑시톤 절연체", "why_emerged": "전자와 정공 사이의 쿨롱 인력으로 인해 결합된 엑시톤이 응집하여 발생하는 절연체 상을 설명하기 위해 도입되었습니다.", "origin": "Knox(1963) 등이 처음 이론적으로 제안하였습니다.", "connections": "밴드갭 제어, Mott 절연체, 전하 밀도 파(CDW)와 밀접하게 관련되어 있습니다."}, {"term": "루프 전류", "why_emerged": "엑시톤 절연체 상태에서 나타날 수 있는 미세한 전류 루프가 시간에 따른 대칭성을 파괴하는 특성을 설명하기 위해 필요합니다.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "시간 역전 대칭성 파괴(TRSB), 궤도 자기 모멘트와 관련됩니다."}], "english_summary": ["Ta2NiSe5 exhibits coupled structural and excitonic instabilities.", "Theoretical proposal for magnetic field-induced pure excitonic insulator phase.", "Field suppresses lattice distortion and stabilizes ground-state loop currents.", "Suggests a general mechanism for disentangling competing phases in quantum materials."]}}, {"title": "Scattering Circular Dichroism from Spatially Modulated Anisotropic Magnetic Dipoles in BiFeO3", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2611.25546", "authors": "Y. Ishii, N. Sasabe, T. Honda, et al.", "last_authors": "T. Arima, Y. Yamasaki", "summary": "Antiferromagnets with broken time-reversal symmetry, including altermagnets, have attracted growing interest because they can exhibit ferromagnet-like responses, such as the anomalous Hall effect and magneto-optical effects, despite their compensated spin structures. Such time-reversal symmetry breaking is characterized by ferroic time-reversal-odd multipoles, distinct from the conventional spin and orbital moments. Among them, the anisotropic magnetic dipole (AMD), which reflects the local orbital anisotropy, shares the symmetry of magnetization and can have a ferroic component even when the spin moments cancel. AMD responses have thus far been identified primarily in antiferromagnets with unit-cell magnetic periodicity, whereas spatially modulated AMDs in long-wavelength magnetic textures remain unexplored. Here, we report resonant soft x-ray small-angle scattering measurements on the antiferromagnetic spin cycloid of the multiferroic BiFeO$_3$. We observe pronounced circular dichroism in the resonant scattering intensity, i.e., scattering circular dichroism, which is not expected from the established cycloidal and Dzyaloshinskii-Moriya-interaction-induced sinusoidal spin structures. We show that the staggered rotation of the FeO$_6$ octahedra gives rise to ferroic AMD components despite the antiparallel spin alignment. As the local magnetic symmetry varies with the cycloidal phase, these AMDs are spatially modulated and produce the dichroism through interference with the sinusoidal spin component. Our findings demonstrate that long-wavelength antiferromagnetic textures can host spatially modulated AMDs, opening new avenues for exploring hidden multipole textures in magnetic and multiferroic materials.", "tier": "B_IMPORTANT_CONDMAT", "sc erm": "Berry curvature", "why_emerged": "결정 내 Bloch 전자의 위상학적 성질을 기술하기 위해 필요.", "origin": "Michael Berry (1984).", "connections": "이상 홀 효과, 양자 홀 효과, 위상 절연체"}, {"term": "Anomalous Nernst Effect (ANE)", "why_emerged": "자기 물질의 위상학적 성질과 열전 특성 사이의 관계를 조사하기 위해.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "이상 홀 효과, 자기 열전학"}], "english_summary": ["Investigated AHE and ANE in CeMn2Ge2 single crystals.", "Connected observed transport effects to Berry curvature of the electronic structure.", "Highlights the utility of ANE in probing magnetic topological states.", "Strengthens the understanding of magnetic Weyl/topological semimetal transport."]}}, {"title": "Magnetic anisotropy, first-order metamagnetic transitions, and weak antilocalization in the candidate topological semimetal Tb2Zn17", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/ytfq-5c74", "authors": "Rajesh Swami, Papul Sahu, Sonali S Pradhan, V. Kanchana, Z. Hossain", "last_authors": "V. Kanchana, Z. Hossain", "summary": "in the rhombohedral Th 2 Zn 17 -type structure (space group R 3 ¯ m ), a structure type known to accommodate atomic disorder. Here, the authors highlight the role of disorder-induced scattering in magnetotransport measurements, which exhibit signatures of weak antilocalization. This compound shows multiple first-order field-induced metamagnetic transitions, strong magnetic anisotropy, crystal electric field effects, and possible spin canting within its antiferromagnetic state. First-principles calculations predict multiple electron and hole Fermi pockets, along with mirror-symmetry-protected nodal rings, suggesting Tb 2 Zn 17 as a promising rare-earth-based magnetic topological semimetal.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Experimental study of a magnetic topological semimetal with potential ARPES relevance.", "tags": ["topological", "semimetal", "magnetism"], "image": "", "briefing": {"background": "희토류 화합물에서 자기적 위상학적 semimetal은 강한 자기 이방성과 위상 밴드 구조가 공존하여 물리적으로 매우 흥미로운 플랫폼을 제공합니다.", "motivation": "Tb2Zn17의 자기적 특성과 위상학적 전도성 가능성을 실험적으로 검증하고 제1원리 계산을 통해 해석하고자 했습니다.", "result": "다수의 메타자기적 전이와 약한 반국소화(weak antilocalization) 현상을 발견하였으며, 미러 대칭성에 의해 보호되는 nodal ring의 존재를 이론적으로 예측했습니다.", "implication": "Tb2Zn17이 희토류 기반의 새로운 위상학적 semimetal 후보군임을 시사하며, 자기적 질서와 위상 상태가 결합된 물성 연구에 활용될 수 있습니다.", "novelty": "희토류 복합 금속에서의 복잡한 자기적 물성과 위상적 성질을 통합적으로 제시한 점이 중요하며, ARPES를 통한 밴드 검증 가능성을 제시했습니다.", "unresolved": "실험적으로 관측된 weak antilocalization이 위상 밴드 구조와 직접적으로 어떻게 연결되는지, 특히 자기적 질서와의 상호작용은 미지수입니다.", "future_work": "ARPES 실험을 통해 예측된 nodal ring과 페르미 포켓 구조를 직접 관측하는 연구가 매우 시급합니다.", "concepts": [{"term": "Nodal ring", "why_emerged": "밴드 접촉점이 1차원 선 형태를 이루는 위상학적 금속 상태를 정의하기 위해.", "origin": "Burkov et al. (2011) 등.", "connections": "위상적 semimetal, 베리 곡률, Dirac/Weyl 페르미온"}, {"term": "Weak antilocalization", "why_emerged": "전자의 양자 간섭 효과가 전도에 미치는 영향을 설명하기 위해.", "origin": "Hikami, Larkin, Nagaoka (1980).", "connections": "스핀-궤도 결합, 위상학적 표면 상태"}], "english_summary": ["Reported metamagnetic transitions and weak antilocalization in Tb2Zn17.", "Identified Tb2Zn17 as a rare-earth magnetic topological semimetal candidate.", "Predicted mirror-symmetry-protected nodal rings via first-principles calculations.", "Establishes a solid basis for future ARPES investigation of this compound."]}}, {"title": "Magnetic circular dichroism of terahertz modes and selection rules of Raman-active optical phonons in the polar altermagnet candidate Mn2Mo3O8", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/sqws-q32r", "authors": "F. Schilberth, K. Vasin, M. Knauft, et al.", "last_authors": "I. Kézsmárki, J. Deisenhofer", "summary": "We investigated the magnetic and vibrational excitations in the collinear altermagnet candidate Mn 2 Mo 3 O 8 by temperature-dependent Raman scattering and magneto-optical THz time-domain transmission spectroscopy. By comparison to calculations accurately capturing the eigenfrequencies of t rvey, Kyuho Lee, et al.", "last_authors": "Srinivas Raghu, Harold Y. Hwang", "summary": "An experiment enables the first systematic, absolute superfluid-density measurement across the full superconducting dome of an infinite-layer nickelate.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Important experimental study on unconventional superconductivity in nickelates.", "tags": ["experiment", "nickelate", "superconductivity"], "image": "", "briefing": {"background": "무한층(infinite-layer) 니켈산염은 구리 산화물(cuprate) 고온 초전도체와 구조적으로 유사하여, 비전통적 초전도 현상의 발현 가능성과 그 메커니즘을 규명하기 위한 주요 연구 대상입니다.", "motivation": "초전도 도핑 영역 전반에 걸쳐 절대 초유체 밀도(superfluid density)를 체계적으로 측정하여, 니켈산염의 초전도 상태가 구리 산화물과 유사한 물리적 특성을 공유하는지 확인하고자 했습니다.", "result": "니켈산염의 초전도 돔 전체에 걸친 절대 초유체 밀도 데이터를 성공적으로 획득하여, 초전도 상태의 강건성과 전하 운반자 농도와의 관계를 명확히 했습니다.", "implication": "니켈산염의 초전도 매커니즘이 구리 산화물과 얼마나 유사한지 혹은 다른지를 결정짓는 핵심 지표를 제공하며, 관련 이론 모델링의 제약 조건을 강화합니다.", "novelty": "무한층 니켈산염에서 처음으로 체계적인 절대 초유체 밀도 측정을 수행했다는 점이 중요하며, 향후 니켈산염 연구에서 초전도성 결맞음 분석의 기준점이 될 것입니다.", "unresolved": "초유체 밀도 값의 절대적인 크기와 구리 산화물과의 정량적 차이에 대한 완벽한 이론적 합의는 아직 부족합니다.", "future_work": "다른 도핑 수준이나 희토류 원소 치환 시의 초유체 밀도 변화를 추적하여 상전이 근처의 양자 임계 현상을 연구할 것으로 보입니다.", "concepts": [{"term": "무한층 니켈산염", "why_emerged": "구조적으로 페로브스카이트 산화물에서 산소 층을 제거한 형태이며, 구리 산화물과 유사한 3d 전자 구조를 가져 초전도 가능성이 제기되었습니다.", "origin": "2019년 Li 등(Stanford)에 의해 NdNiO2에서 초전도성이 최초 발견되었습니다.", "connections": "구리 산화물 고온 초전도체, 3d 전이금속 산화물."}, {"term": "초유체 밀도", "why_emerged": "초전도 상태의 강도와 결맞음 정도를 측정하는 물리량으로, 런던 침투 깊이의 역수로 정의됩니다.", "origin": "런던 형제(London brothers)의 전자기 이론에서 확립되었습니다.", "connections": "Uemura 플롯, 고온 초전도 연구의 표준 지표."}], "english_summary": ["This study presents the first systematic measurement of absolute superfluid density in infinite-layer nickelates.", "The experiment covers the entire superconducting dome, providing key insights into the doping dependence.", "Results allow for a direct comparison of the superconducting mechanism between nickelates and cuprates.", "The work serves as a critical reference for understanding the nature of the superconducting state in nickelates."]}}, {"title": "Fully Nonequilibrium Hall Response from Berry Curvature", "journal": "PRL_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/cj8b-4sp4", "authors": "Shouvik Sur, Lei Chen, Yiming Wang, Chandan Setty, Silke Paschen, Qimiao Si", "last_authors": "Silke Paschen, Qimiao Si", "summary": "In topological materials, Berry curvature leads to intrinsic Hall responses. Focusing on time-reversal symmetric systems with broken inversion symmetry, a spontaneous (zero magnetic field) Hall effect is expected to develop under an applied electric field. Motivated by recent developments in Weyl-Ko…", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Directly relevant to Berry curvature and anomalous Hall effects in topological semimetals.", "tags": ["Weyl", "Berrycurvature", "topological", "Halleffect"], "image": "", "briefing": {"background": "위상 물질에서 베리 곡률(Berry curvature)은 전자 상태의 기하학적 특성을 결정하며, 이는 비정상 홀 효과(Anomalous Hall Effect)와 같은 특이한 수송 현상의 원인이 됩니다.", "motivation": "시간 반전 대칭성은 유지하지만 반전 대칭성이 깨진 시스템에서, 전기장이 인가되었을 때 발생하는 자발적 비평형 홀 응답 메커니즘을 이론적으로 규명하고자 했습니다.", "result": "전기장에 의해 유도되는 베리 곡률 기반의 비평형 홀 전류가 어떻게 형성되는지 이론적 모델을 통해 도출했습니다.", "implication": "위상 반금속에서의 비선형 수송 현상이나 광-유도 위상 효과 등을 이해하는 데 중요한 토대를 제공할 수 있습니다.", "novelty": "평형 상태의 홀 효과를 넘어 전기장 인가 시의 동역학적 베리 곡률 응답을 다루었다는 점이 위상 물질의 비평형 물성 연구에 새로운 관점을 제시합니다.", "unresolved": "실제 실험적 측정에서 노이즈와 다른 기여도를 분리하여 이 자발적 효과만을 추출하는 방법은 도전 과제로 남아 있습니다.", "future_work": "Weyl 반금속 등 특정 물질을 대상으로 한 고주파 홀 응답 측정이나 레이저 기반의 비평형 측정 실험이 뒤따를 것으로 예상됩니다.", "concepts": [{"term": "베리 곡률", "why_emerged": "운동량 공간에서의 전자 파동함수의 기하학적 위상 차이를 기술하기 위해 필요합니다.", "origin": "Michael Berry (1984년)에 의해 기하학적 위상 개념으로 정립되었습니다.", "connections": "이상 홀 효과, 위상 반금속, Chern 수."}, {"term": "비평형 홀 응답", "why_emerged": "강한 전기장이나 레이저 인가 시 시스템이 평형을 벗어나며 나타나는 수송 현상을 이해하기 위해 필요합니다.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "비선형 광학 응답, Floquet 공학."}], "english_summary": ["The paper investigates the nonequilibrium Hall response driven by Berry curvature in systems with broken inversion symmetry.", "It focuses on spontaneous Hall effects that emerge under an applied electric field while maintaining time-reversal symmetry.", "The theoretical framework addresses the link between electric-field-induced Berry curvature and transport phenomena.", "This work contributes to the understanding of nonequilibrium topological transport in Weyl semimetals."]}}, {"title": "Topological Multicomponent Superconductivity with Sizable s-Wave Admixture in Twisted Bilayer Cuprates", "journal": "PRL_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/6cyn-zbpm", "authors": "Yu-Hang Li, Congjun Wu, Wang Yang", "last_authors": "Congjun Wu, Wang Yang", "summary": "An investigation of three-component superconductivity in twisted bilayer cuprates shows that s-wave pairing does not preclude chiral topological superconductivity.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Relevant study on twisted bilayer cuprates and topological superconductivity.", "tags": ["twisted-bilayer", "cuprates", "superconductivity"], "image": "", "briefing": {"background": "트위스트 이중층 그래핀에서 발견된 초전도성과 유사하게, 구리 산화물을 트위스트하여 적층했을 때 나타나는 평탄 밴드(flat band)에서의 강상관 전자 현상이 새로운 연구 주제로 떠오르고 있습니다.", "motivation": "트위스트 이중층 구리 산화물에서 나타나는 다성분 초전도성과 그 위상적 특성이 s-파 대칭성과 공존할 수 있는지 조사하고자 했습니다.", "result": "s-파 성분이 혼재되어 있음에도 불구하고 비틀림 각도에 따라 카이랄 위상 초전도성이 충분히 발현될 수 있음을 확인했습니다.", "implication": "위상 초전도성을 구현하기 위해 반드시 이국적인 대칭성만을 찾을 필요는 없으며, 밴드 엔지니어링을 통해 이를 제어할 수 있음을 시사합니다.", "novelty": "구리 산화물의 잘 알려진 d-파 성질에 s-파를 의도적으로 도입하고도 위상적 성질을 유지할 수 있다는 이론적 가능성을 제시했습니다.", "unresolved": "실제 트위스트 구리 산화물 소자 제작의 어려움과 그 안에서 발생하는 실제 상전이 온도의 타당성 검증이 필요합니다.", "future_work": "구체적인 물질 시스템에 기반한 DFT 계산이나, 초전도 질서 매개변수 간의 경쟁 및 협력에 대한 추가적인 수치 해석이 기대됩니다.", "concepts": [{"term": "트위스트 이중층 구리 산화물", "why_emerged": "모아레 초격자를 통해 밴드 구조를 조절하여 강상관 현상을 극대화하기 위해 고안되었습니다.", "origin": "트위스트 그래핀 이후 모아레 물리학의 확장에서 비롯되었습니다.", "connections": "트위스트 이중층 그래핀, 고온 초전도, 모아레 물리학."}, {"term": "카이랄 위상 초전도체", "why_emerged": "시간 반전 대칭성이 깨지고 가장자리에 마요라나 페르미온을 가질 수 있는 초전도 상태를 찾기 위해 필요합니다.", "origin": "Volovik 등에 의해 위상물질론의 맥락에서 제시되었습니다.", "connections": "마요라나 모드, 양자 계산, Chern 절연체."}], "english_summary": ["The study examines multicomponent superconductivity in twisted bilayer cuprates.", "It demonstrates that s-wave admixture does not prevent the emergence of chiral topological superconductivity.", "This provides theoretical support for realizing topological states in van der Waals heterostructures of unconventional superconductors.", "The findings suggest a flexible path for engineering topological superconductivity via band structure manipulation."]}}, {"title": "Unveiling High-Energy Ultrafast Responses Driven by Fermi-Level Gap Opening in Charge-Density Waves", "journal": "PRL_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/vz71-r52l", "authors": "Qiong Wu, Tianchen Hu, Junhan Huang, et al.", "last_authors": "Tao Dong, Nan-Lin Wang", "summary": "in superconductors and correlated electron systems. However, how a small gap opening near the Fermi surface affects the spectral changes in the high-energy interband…", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Directly relevant to CDW systems and electronic structure dynamics.", "tags": ["CDW", "ultrafast", "electronic-structure"], "image": "", "briefing": {"background": "전하 밀도 파동(CDW) 시스템에서 페르미 준위 근처에 작은 에너지 갭이 열리는 현상은 물질의 전자 구조 및 초전도성과 밀접한 관련이 있습니다. 이러한 갭이 더 넓은 에너지 영역의 대역 간(interband) 광학 응답에 어떻게 영향을 미치는지 이해하는 것은 강상관 전자계의 동역학을 규명하는 데 필수적입니다.", "motivation": "CDW 형성으로 인한 페르미 준위 근처의 미세한 전자 구조 변화가 어떻게 초고속 시간 분해 분광 데이터에서 관찰되는 고에너지 전이의 스펙트럼 변화로 이어지는지 밝히고자 합니다.", "result": "페르미 준위 갭 열림이 고에너지 대역 간 응답에 구체적인 스펙트럼 변조를 유도함을 확인했습니다.", "implication": "초고속 분광학을 통해 관찰된 데이터에서 CDW 상태의 정밀한 전자 구조 정보를 역으로 추적할 수 있는 가능성을 제시합니다.", "novelty": "저에너지 물성(CDW 갭)과 고에너지 물성(interband 전이) 사이의 상관관계를 초고속 영역에서 연결했다는 점이 중요합니다.", "unresolved": "초록 정보만으로는 구체적인 물질 화합물명이나 갭의 크기 변화와 고에너지 스펙트럼의 정량적 관계에 대한 상세한 설명이 부족합니다.", "future_work": "다른 CDW 물질 시스템으로의 확장 연구와 이론적 밴드 구조 계산을 통한 실험 데이터의 정량적 검증이 필요합니다.", "concepts": [{"term": "Charge-Density Waves (CDW)", "why_emerged": "금속 내 전자 밀도의 공간적 주기성 변화와 격자 왜곡이 결합하여 안정화되는 기저 상태를 설명하기 위해 도입되었습니다.", "origin": "Peierls에 의해 1차원 금속 시스템에서 제안되었습니다.", "connections": "페르미 표면 중첩(nesting), 초전도성과의 경쟁, 디락/바일 반금속에서의 토폴로지적 CDW 등과 연결됩니다."}], "english_summary": ["Investigates the influence of Fermi-level gap opening on high-energy interband responses in CDW systems.", "Explains how low-energy spectral features in CDW affect ultrafast optical dynamics.", "Provides insight into connecting electronic structure modifications with time-resolved spectroscopy data."]}}, {"title": "Anisotropic field suppression of charge order reveals orbital-selective Kondo hybridization in UTe2", "journal": "Science_Advances", "source": "Gemini", "link": "https://www.science.org/doi/abs/10.1126/sciadv.aeh8987?af=R", "authors": "Nileema Sharma, Fangjun Cheng, Hyeok-Jun Yang, et al.", "last_authors": "Yi-Ting Hsu, Xiaolong Liu", "summary": "UTe 2 is a rare correlated quantum material where unconventional density-wave orders, Kondo physics, spin-triplet pairing, and reentrant superconductivity coexist. Because superconductivity emerges from a strongly correlated normal state, identifying and controlling intertwined normal-state orders are essential for understanding the electronic landscape where superconductivity arises. Here, using scanning tunneling microscopy in a vector magnetic field, we uncover a staggered charge density wave (CDW) in high-quality UTe 2 crystals. This CDW exhibits a strong directional field response: It is completely quenched by a modest 1.7-tesla magnetic field along the quasi–one-dimensional uranium-chain direction while remaining robust against fields along other crystallographic axes. This anisotropy suggests an orbital-driven field-tuned quantum phase transition. Unexpectedly, the same field orientation concurrently suppresses the 5f Kondo resonance. Modeling indicates a switch in the dominant hybridization channel from Te 5 p- U 5 f to U 6 d- U 5 f coupling, suggesting an intimate interplay between CDW and the Kondo effect.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Important study on heavy fermion superconductivity and charge order in a correlated material.", "tags": ["heavy-fermion", "superconductivity", "charge-order"], "image": "", "briefing": {"background": "UTe2는 강상관 전자계에서 스핀-삼중항 초전도성, 콘도 효과, 그리고 전하 밀도 파동(CDW)과 같은 다양한 질서가 복잡하게 얽혀 있는 물질입니다. 이들의 상호작용은 초전도 발생 메커니즘을 이해하는 열쇠입니다.", "motivation": "UTe2에서 초전도성을 뒷받침하는 정상 상태의 전자 구조와 CDW, 콘도 효과의 상관관계를 입증하고자 합니다.", "result": "STM을 사용하여 UTe2의 특정 결정축 방향으로 가해진 자기장에 의해 CDW와 5f 콘도 공명이 동시에 억제됨을 발견했습니다.", "implication": "CDW와 콘도 효과가 동일한 전자적 기원(궤도 혼성)을 공유하며 초전도성과의 경쟁 혹은 협력 관계에 있음을 시사합니다.", "novelty": "자기장 방향에 따른 이방성 반응을 통해 U-5f 전자와 Te-5p/U-6d 전자 사이의 혼성 채널 전환 메커니즘을 실험적으로 규명했습니다.", "unresolved": "가해진 자기장이 구체적으로 어떻게 궤도 혼성 채널을 전환시키는가에 대한 미시적 메커니즘은 추가 연구가 필요합니다.", "future_work": "다양한 자기장 강도와 방향에서의 추가적인 STS 측정 및 다체 이론 모델링을 통한 혼성 메커니즘 검증이 예상됩니다.", "concepts": [{"term": "Kondo Hybridization", "why_emerged": "국부적인 자성 모멘트와 전도 전자 사이의 상호작용으로 인해 형성되는 비자성 상태를 설명하기 위해 도입되었습니다.", "origin": "Jun Kondo에 의해 제안되었습니다.", "connections": "중페르미온(Heavy Fermion) 물성, 비전통적 초전도성, 양자 임계점 현상과 밀접하게 연관됩니다."}, {"term": "Staggered CDW", "why_emerged": "특정 결정 격자 구조 내에서 전하 밀도가 불균일하게 분포하는 공간적 질서를 명명하기 위해 사용됩니다.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "UTe2의 삼중항 초전도성과 관련된 스핀-전하 결합 현상 연구에서 핵심적인 역할을 합니다."}], "english_summary": ["Discovers a staggered CDW in UTe2 using vector-field scanning tunneling microscopy.", "Demonstrates that the CDW and 5f Kondo resonance are suppressed by magnetic fields along the U-chain.", "Suggests an orbital-selective mechanism involving a switch between Te-p/U-f and U-d/U-f hybridization channels.", "Highlights the intertwined nature of charge order and Kondo physics in heavy-fermion superconductors."]}}, {"title": "Ab-initio study of magnetic interaction in RNiO2: role of rare-earth size and epitaxial strain", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2611.25907", "authors": "Ramasamy Murugesan, Shiyu Deng, Marie-Bernadette Lepetit", "last_authors": "Shiyu Deng, Marie-Bernadette Lepetit", "summary": "In this paper we present a systematic first-principles investigation of the structure and nearest-neighbor magnetic exchange interactions in the infinite-layer RNiO2 thin-film series (R = La-Lu), under the constrain of different substrates. Density functional theory calculations are first employed to optimize the crystal structures, while CAS+DDCI correlated wave-function calculations were used for the determination of the magnetic exchanges. This methodology allows to obtain magnetic interactions in good agreement with RIXS experimental estimations. In the pristine case, our results confirm that the structure of RNiO2 (except for R = La and Ce) adopts the I4/mcm space group, characterized by an out-of-plane rotation of the NiO4 plaquettes. This result remains valid under substrate constrains, even if compressive strain reduces the amplitude of the rotational distortion and leads to an enhancement of the magnetic exchange interaction relative to the pristine structures. The latter are found to depend sensitively on both the rare-earth ionic radius and the applied epitaxial strain. These results highlight the role of structural distortions and substrate-induced strain in tuning magnetic interactions in infinite-layer nickelates.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "DFT and RIXS-benchmarked electronic structure study of infinite-layer nickelates.", "tags": ["RIXS", "nickelate", "electronicstructure"], "image": "https://arxiv.org/html/2611.25907v1/Figures/RvsNiONi2.png", "briefing": {"background": "무한층 니켈산염(Infinite-layer nickelates, RNiO2)은 구리 산화물과 유사한 전자 구조를 가지며 초전도성을 나타내어, 고온 초전도 메커니즘 규명의 유망한 플랫폼으로 주목받고 있습니다.", "motivation": "희토류 이온의 크기와 에피택셜 변형이 RNiO2 박막의 결정 구조와 자기적 상호작용(교환 상수)에 미치는 영향을 체계적으로 밝히고자 합니다.", "result": "CAS+DDCI 계산법을 통해 RIXS 실험값과 잘 일치하는 자기적 교환 상수를 도출하였으며, 변형과 이온 크기에 따른 구조적 왜곡 변화가 자기적 상호작용을 강하게 조절함을 확인했습니다.", "implication": "기판 선택과 희토류 치환을 통해 니켈산염의 자기적 물성을 설계할 수 있는 이론적 근거를 제공합니다.", "novelty": "단순 DFT를 넘어 상관관계 효과를 반영한 파동함수 기반 계산을 통해 RIXS 데이터와의 정밀한 정량적 일치를 달성했습니다.", "unresolved": "계산 결과가 실험적인 박막의 결함(산소 빈자리 등)을 얼마나 완벽하게 반영하는지는 여전히 숙제입니다.", "future_work": "다양한 기판 변형을 적용한 실제 박막 샘플의 RIXS 측정 및 초전도 전이 온도와의 상관관계 분석이 이어질 것입니다.", "concepts": [{"term": "Infinite-layer nickelates", "why_emerged": "구리 산화물과 등전자적 유사성을 가진 물질군을 찾고, 고온 초전도성을 재현/이해하기 위해 연구됩니다.", "origin": "Hayward et al.에 의해 처음 합성되었습니다.", "connections": "cuprates의 d-파 초전도성, RIXS를 이용한 마그논 측정, 고압/에피택셜 박막 공학과 연결됩니다."}, {"term": "CAS+DDCI", "why_emerged": "강상관 전자계에서 다전자 파동함수를 정확하게 기술하여 자기적 교환 상수를 계산하기 위해 개발되었습니다.", "origin": "Couty, Dance, Illas 등에 의해 정립되었습니다.", "connections": "ab-initio 전자 구조 계산, DFT+U, RIXS 스펙트럼 해석과 연결됩니다."}], "english_summary": ["Presents an ab-initio study on magnetic exchanges in RNiO2 thin-film series.", "Utilizes CAS+DDCI method to match RIXS experimental data for magnetic interactions.", "Shows that rare-earth ionic size and epitaxial strain significantly tune structural distortions and magnetic exchanges.", "Provides a theoretical framework for structural engineering of magnetic interactions in infinite-layer nickelates."]}}, {"title": "Altermagnetic magnon splitting in hematite: from bulk g-wave to planar i-wave", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2611.25284", "authors": "Tobias Dannegger, Julian A. Beisch, Levente R\\'ozsa, L\\'aszl\\'o Szunyogh, Ulrich Nowak", "last_authors": "L\\'aszl\\'o Szunyogh, Ulrich Nowak", "summary": "Hematite is an insulating iron oxide with both a collinear antiferromagnetic and a weakly ferromagnetic phase with intriguing properties, such as long-range spin transport distances, that make it promising for spintronics applications. It has also been identified as a candidate for g-wave altermagnetism. Here, we present the results of fully relativistic ab initio calculations of the magnon properties of hematite, with a focus on altermagnetic effects. We quantitatively evaluate both the anisotropic and altermagnetic magnon band splitting as well as the magnon lifetimes. We show that dipolar interactions lead to a sizeable non-altermagnetic splitting and a hybridisation between opposite-chirality magnons resulting in a strong reduction of the spin expectation value of magnons close to the {\\Gamma} point and around nodal planes, even in the collinear out-of-plane phase. Both the frequencies and the lifetimes have a large altermagnetic splitting in the $k_z = 0$ plane, which is characteristic of hematite and not generally expected for g-wave altermagnets. We compare our results to the prototypical, hexagonal g-wave altermagnet manganese telluride, which has four symmetry-protected nodal planes, whereas the fourth nodal surface in hematite is not completely fixed by symmetry. We derive implicit analytical expressions for this surface and discuss how it arises from a combination of rotational and translational symmetry, which leads to a transition to i-wave symmetry at the Brillouin zone boundary. The example of hematite reveals the trigonal altermagnets as a special case where the splitting function exhibits both bulk (g-wave) and planar (i-wave) components, and shows that the point symmetries alone are not sufficient to capture the full symmetry-determined behaviour of the splitting function.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Relevant theoretical study on altermagnets with potential connections to electronic structure and magnetism.", "tags": ["theory", "altermagnet", "magnon"], "image": "https://arxiv.org/html/2611.25284v1/Fig1.png", "briefing": {"background": "알터마그넷(Altermagnet)은 시간반전 대칭성과 결정 대칭성이 결합하여 스핀이 갈라진(split) 밴드를 가지는 새로운 자기 상입니다. 이는 강자성체의 스핀 분극과 반강자성체의 상쇄 특성을 동시에 지녀 스핀트로닉스 분야에서 큰 주목을 받고 있습니다.", "motivation": "적색 철광석인 헤마타이트(Hematite)가 g-wave 알터마그넷 후보로 지목됨에 따라, 헤마타이트의 스핀 분할 특성과 이를 결정짓는 대칭성 및 마그논 성질을 정밀하게 규명하고자 연구되었습니다.", "result": "헤마타이트에서 스핀 분할이 단순히 g-wave에 국한되지 않고, 특정 면에서는 i-wave 성질을 동시에 지님을 확인했습니다. dipolar 상호작용이 알터마그넷 고유의 분할 외에 추가적인 분할을 야기하며, 이는 브릴루앙 존 경계에서의 대칭성 전이로 이어집니다.", "implication": "알터마그넷의 대칭성 분류에서 단순히 점군(point group)만 고려하는 것은 불충분하며, 회전 및 병진 대칭성이 결합된 전체적인 해석이 필요함을 시사합니다.", "novelty": "헤마타이트를 g-wave와 i-wave의 혼합 사례로 해석하여, 알터마그넷의 대칭성 보호 노달 면(nodal surface)이 시스템에 따라 어떻게 유연하게 변할 수 있는지 입증했습니다.", "unresolved": "이론적 계산 결과가 실제 실험(예: RIXS 등)에서 관찰되는 마그논 스펙트럼과 얼마나 정밀하게 일치하는지는 추가적인 비교가 필요합니다.", "future_work": "다른 삼방정계 알터마그넷 후보 물질들로의 확장 연구 및 비탄성 중성자 산란(INS) 등을 통한 실험적 검증이 기대됩니다.", "concepts": [{"term": "알터마그넷(Altermagnet)", "why_emerged": "강자성체와 반강자성체를 넘어선 제3의 자기 상태가 존재할 수 있다는 이론적 필요성에 의해 제기됨.", "origin": "최근 2~3년 내 이론적 활발한 논의 시작 (초록 정보만으로는 특정하기 어려움).", "connections": "반강자성 스핀트로닉스, 베리 곡률, 스핀 분극 수송 현상."}, {"term": "g-wave/i-wave 알터마그넷", "why_emerged": "운동량 공간에서의 스핀 분할 패턴을 초전도체의 d-wave 등과 유사한 각도 의존성으로 분류하기 위함.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "고온 초전도체 대칭성, 노달 반금속."}], "english_summary": ["Hematite exhibits complex magnon splitting with both g-wave and i-wave components.", "Dipolar interactions significantly affect magnon properties near the Gamma point.", "Symmetry-protected nodal surfaces are not solely defined by point groups in this material.", "The study provides a framework for understanding trigonal altermagnetic systems."]}}, {"title": "Current-driven resistive switching in high-field heavy fermion metal UTe2", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2611.25792", "authors": "Ling Zhang (Mark), Chunyu (Mark), Guo, et al.", "last_authors": "Priscila F. S. Rosa, Philip J. W. Moll", "summary": "In UTe$_2$, superconductivity persists up to 70 T for fields tilted by roughly 20-40{\\deg} from the b axis toward c. Its normal state is a field-polarized (FP) state, which emerges above a first-order metamagnetic transition when the field component along b exceeds $\\sim$35 T. Despite being the parent of this high-field superconductivity, the FP state remains poorly understood, including whether it shares underlying physics with the low-field paramagnetic (PM) state from which it is abruptly separated. Using microstructures fabricated by focused ion beam, we reach current densities of 30-60 kA/cm2 and observe a current-induced high-resistivity state in both the PM and FP regimes over a wide range of field angles in the bc plane. Above a critical current density of order 10 kA/cm2, the resistivity sharply rises to values comparable to those near the critical end point of the metamagnetic transition. The critical current density increases with temperature, opposite to the trend expected from Joule heating, ruling out a thermal origin. The emergence of the same instability on both sides of the metamagnetic transition reveals an unexpected commonality between the FP and PM states. More broadly, the observation of a current-induced transition in a heavy-fermion metal exposes the multitude of nearby electronic states in correlated electron systems and shows that electric current, like magnetic field and pressure, can switch between them.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Experimental study of UTe2, relevant to unconventional superconductivity and correlated electron systems.", "tags": ["heavyfermion", "superconductivity", "correlated"], "image": "https://arxiv.org/html/2611.25792v1/fig1_merged_v9.png", "briefing": {"background": "UTe2는 강한 전자 상관관계에 의해 유도된 중페르미온 초전도체로, 매우 높은 자기장에서 초전도 상태가 지속되는 특이한 성질을 가지고 있습니다. 메타자기 전이(metamagnetic transition)를 통해 파라자성 상태(PM)에서 필드-편극 상태(FP)로 전이합니다.", "motivation": "고자기장 환경에서의 초전도 상태를 이해하기 위해 그 모체인 정상 상태(FP state)와 낮은 자기장의 PM 상태 간의 관계를 규명하고자 했습니다.", "result": "임계 전류 밀도 이상의 전류를 인가했을 때, PM과 FP 상태 모두에서 유사한 저항 급증 현상을 발견했습니다. 이는 전류가 자기장이나 압력과 유사하게 전자 상태를 스위칭할 수 있는 제어 변수가 될 수 있음을 의미합니다.", "implication": "PM과 FP 상태가 단순한 자기적 정렬의 차이를 넘어, 전자 구조적으로 매우 밀접하게 연결된 다중 상태임을 시사합니다.", "novelty": "전류 유도 저항 스위칭을 통해 중페르미온 시스템의 불안정성을 탐색하는 새로운 실험 방법론을 제시했습니다.", "unresolved": "관찰된 저항 급증의 근본적인 미시적 물리 메커니즘(예: 페르미 면의 재구성이나 전자 상관성 변화)은 여전히 밝혀지지 않았습니다.", "future_work": "고자기장 하에서의 STS 또는 ARPES 등을 이용한 전자 상태의 직접적인 가시화 연구가 필요합니다.", "concepts": [{"term": "중페르미온(Heavy Fermion)", "why_emerged": "f-전자와 전도 전자 사이의 강한 결합으로 유효 질량이 극단적으로 커지는 현상을 설명하기 위해 필요함.", "origin": "1970년대 이후 전이금속/희토류 화합물 연구에서 정립됨.", "connections": "비전통적 초전도성, Kondo 효과, 양자 임계 현상."}, {"term": "메타자기 전이(Metamagnetic transition)", "why_emerged": "외부 자기장에 의해 자화 상태가 비선형적이고 급격하게 변하는 현상을 이해하기 위해 제기됨.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "강한 자기적 상관관계, 강자성/반강자성 경쟁."}], "english_summary": ["Current-driven resistive switching observed in UTe2 across both PM and FP states.", "Instability occurs at a critical current density, ruling out Joule heating origins.", "The commonality of the instability suggests a deeper link between PM and FP phases.", "Electric current acts as a powerful tuning parameter for strongly correlated systems."]}}, {"title": "Local orbital magnetization and Chern markers from equilibrium local currents", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2611.26599", "authors": "Henrique P. Veiga, Aires Ferreira, Caio H. Lewenkopf, Jo\\~ao M. Viana Parente Lopes", "last_authors": "Caio H. Lewenkopf, Jo\\~ao M. Viana Parente Lopes", "summary": "Local currents carry the orbital magnetization of a macroscopic sample and are key for modeling inhomogeneous magnetic materials and for understanding magnetoelectric and topological responses. However, producing realistic simulated images of local currents in inhomogeneous systems remains challenging. Building upon recent work on stochastic estimation methods for tight-binding models, we show that all matrix elements of positive semidefinite operators defined on a lattice can be obtained at once from a single set of filtered random vectors. This eliminates the need for independent simulations previously required for off-diagonal elements, which significantly speeds up the calculation of spatial maps of local currents. Further, we express bond currents in terms of loop currents that obey a discrete Poisson equation, with the current vorticity acting as the source term. Its solution yields a local orbital magnetization. In analogy with the global St\\v{r}eda relation, the derivative of this magnetization with respect to the chemical potential defines a new local Chern marker. Built entirely from bond currents, it requires no position operator and is not bound by the zero-sum rule of projector markers in open samples. Hence, it is free of boundary-compensation artifacts, and its sample average converges to the bulk Chern number in a controlled fashion.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Methodological advancement in calculating local currents and Chern markers in magnetic materials.", "tags": ["loopcurrent", "topological", "electronic_structure"], "image": "https://arxiv.org/html/2611.26599v1/Chern_Local_Hall.png", "briefing": {"background": "물질 내부의 국소 전류(local current) 분포는 자기적 특성과 토폴로지적 성질을 이해하는 데 핵심적이지만, 이를 실제 실험 결과와 직접 비교할 수 있는 시뮬레이션으로 구현하는 것은 매우 어렵습니다.", "motivation": "복잡하고 비균일한 시스템에서 국소 전류 밀도와 궤도 자화, 그리고 국소 첸 수(Chern marker)를 효율적으로 계산하기 위한 수치적 방법을 개발하고자 했습니다.", "result": "랜덤 벡터를 활용한 확률적 추정법을 최적화하여, 계산 효율을 크게 높였습니다. 또한 전류 밀도로부터 직접 국소 첸 수를 도출하여 경계 효과의 오차 없이 bulk 첸 수로 수렴하게 만들었습니다.", "implication": "이 방법은 위상 절연체나 자기 물질의 공간적으로 변화하는 토폴로지적 물리량을 시각화하는 데 표준적인 툴이 될 수 있습니다.", "novelty": "기존 방법 대비 연산 효율을 혁신적으로 개선하고, 물리적으로 의미 있는 국소 첸 마커를 경계 효과 없이 계산 가능하게 했다는 점이 중요합니다.", "unresolved": "실제 실험에서 국소 전류를 직접 매핑하는 방법(예: Scanning SQUID 등)과의 정량적 오차 범위에 대한 논의는 본 논문에서 다루지 않았습니다.", "future_work": "불순물이 포함된 실제 결정 구조나 모아레 시스템 등 복잡한 lattice 모델로의 적용 연구가 예상됩니다.", "concepts": [{"term": "국소 첸 마커(Local Chern Marker)", "why_emerged": "불균일한 시스템이나 열린 경계가 있는 샘플에서 위상 불변량을 국소적으로 정의하기 위해 필요함.", "origin": "2010년대 위상학적 물리 연구가 심화되면서 정립됨.", "connections": "Streda 공식, 위상 절연체, 비정질 물질의 위상 물리."}, {"term": "루프 전류(Loop Current)", "why_emerged": "자성 물질 내부에서 궤도 자화를 유도하는 미시적 전류 순환 모델을 위해 필요함.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "가고메 금속의 자성, 가짜-갭(pseudogap) 상, 자기 정렬."}], "english_summary": ["New stochastic method developed for efficient simulation of local currents.", "Local Chern marker defined via bond currents avoids boundary artifacts.", "Calculated magnetization and Chern markers converge to bulk properties.", "Facilitates study of inhomogeneous magnetic and topological materials."]}}, {"title": "Magnetic order in Tb and Dy substituted La3Ni2O7 and effects of high-pressure high-temperature O2 annealing", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2611.25349", "authors": "Yuhang Deng, Farhad Taraporevala, Jui-Chia Lee, et al.", "last_authors": "Jeffrey W. Lynn, M. Brian Maple", "summary": "To study the influence of magnetic lanthanide (Ln) substituents on La3Ni2O7, polycrystalline samples of La3-xLnxNi2O7 (Ln = Pr, Eu, Gd, Tb, Dy, Ho, Er, Tm, and Yb) were synthesized and characterized by electrical transport, magnetization, and x-ray and neutron powder diffraction before and after high-pressure high-temperature oxygen annealing. The annealing process led to the formation of La3Ni2O7 polymorphs and more metallic-like temperature dependence of the electrical resistance while changing the density-wave transition temperature only slightly. For unannealed La2.7Tb0.3Ni2O7 and La2.7Dy0.3Ni2O7, distinct features in the magnetic susceptibility and additional magnetic peaks in neutron diffraction patterns indicate that both samples develop long-range magnetic order below ~13 and 11 K, respectively. The magnetic signatures were strongly suppressed following oxygen annealing, suggesting a possible association with the accompanying structural modifications. These behaviors distinguish Tb and Dy from Pr, Nd, and Sm substituents which do not introduce magnetic ordering in the system, establishing La3-xTbxNi2O7 and La3-xDyxNi2O7 as promising platforms for exploring the interplay between magnetic order and pressure-induced superconductivity in La3Ni2O7.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Relevant to nickelate superconductivity and magnetism; high interest field for the user.", "tags": ["material", "superconductivity", "nickelates"], "image": "https://arxiv.org/static/browse/0.3.4/images/arxiv-logo-fb.png", "briefing": {"background": "La3Ni2O7은 최근 고압 환경에서 고온 초전도성을 보이는 것으로 밝혀져 니켈 기반 초전도체 연구의 핵심 물질로 부상했습니다. 이 물질의 물리적 특성, 특히 자기적 질서와 초전도성의 상관관계를 이해하는 것은 고온 초전도 메커니즘을 밝히는 데 필수적입니다.", "motivation": "La3Ni2O7의 자기적 특성이 초전도성에 미치는 영향을 체계적으로 조사하기 위해, 다양한 란타넘족(Ln) 원소를 치환하여 자기적 질서의 변화와 산소 어닐링이 구조 및 물성에 미치는 영향을 분석하고자 했습니다.", "result": "Tb와 Dy가 치환된 샘플에서 11~13 K 이하의 장거리 자기 질서를 확인했습니다. 하지만 고압 고온 산소 어닐링을 거치면 이러한 자기 신호가 크게 억제되는 것을 발견했습니다.", "implication": "산소 함량 및 구조적 변형이 자기적 상태를 제어할 수 있음을 의미하며, 이는 향후 고압 하에서의 초전도성 연구에서 자성 조절을 통한 물성 제어 가능성을 시사합니다.", "novelty": "기존 니켈산염 연구에서 간과되었던 란타넘족 치환을 통한 자기적 상태 제어 가능성을 제시했으며, 특히 자기 질서와 고압 초전도성 간의 상관관계를 탐구할 수 있는 새로운 실험 플랫폼을 제공합니다.", "unresolved": "산소 어닐링이 정확히 어떤 국소적 구조 변화를 일으켜 자기 질서를 억제하는지에 대한 미세한 메커니즘은 명확하지 않습니다.", "future_work": "고압 환경에서 Tb/Dy 치환된 시료의 초전도 전이 온도와 자기 질서가 어떻게 공존하거나 경쟁하는지에 대한 정밀한 고압 연구가 필요합니다.", "concepts": [{"term": "La3Ni2O7", "why_emerged": "구조적으로 층상 페로브스카이트 구조를 가지며, 2층 니켈-산소 구조가 고온 초전도성을 나타낼 가능성으로 주목받음.", "origin": "최근 고압 초전도체 보고로 널리 알려짐.", "connections": "니켈산염 초전도체, 큐프레이트 초전도체와의 전자 구조 비교."}, {"term": "산소 어닐링", "why_emerged": "합성 과정에서 발생하는 산소 결함을 제거하고 시료의 화학양론적 조성과 금속성을 최적화하기 위해 필수적임.", "origin": "고체화학 및 고온 초전도체 합성의 일반적 관례.", "connections": "산소 공공, 전하 도핑 제어."}], "english_summary": ["Investigated magnetism in Tb/Dy-substituted La3Ni2O7 as a platform for studying nickelate superconductivity.", "Identified long-range magnetic order below 13 K in Tb and Dy substituted samples.", "High-pressure oxygen annealing significantly suppresses magnetic order, linking structural changes to magnetic state.", "Provides a potential experimental window to tune magnetic properties in pressure-induced superconductors."]}}, {"title": "Magneto-optical transport in type-II Weyl semimetals in the presence of orbital magnetic moment (Phys. Scr.)", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2602.04781", "authors": "Panchlal Prabhat, Amit Gupta", "last_authors": "Panchlal Prabhat, Amit Gupta", "summary": "In this work, we investigate the linear and nonlinear magnetoconductivity of tilted type-II Weyl semimetals within the semiclassical Boltzmann framework by incorporating both the Berry curvature (BC) and the orbital magnetic moment (OMM) corrections. In the linear response regime, we derive analytical expressions for the magnetoconductivity that explicitly include the previously ignored OMM contribution while in the nonlinear regime we obtain analytical expressions that account for the combined effects of the BC and OMM. We find that the open Fermi surface and finite density of states characteristic of the type-II phase qualitatively alter the BC and OMM-induced transport responses relative to the type-I case. Depending on the magnetic-field orientation and transport geometry, the OMM is shown to either suppress or enhance different magnetoconductivity components, in contrast to their monotonic behavior in type-I Weyl semimetals. Our results provide a comprehensive theoretical framework for magneto-optical transport in tilted type-II Weyl semimetals and identify experimentally accessible signatures of the interplay between cone tilt, BC and OMM in candidate materials such as WTe$_2$, MoTe$_2$ and TaIrTe$_4$.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Theory on magneto-transport in Weyl semimetals, includes Berry curvature and orbital magnetic moment with experimental signatures.", "tags": ["theory", "Weylsemimetal", "Berrycurvature", "transport", "magneto-optics"], "image": "https://arxiv.org/html/2602.04781v3/cond_no_B_tilt_type2.png", "briefing": {"background": "Weyl 반금속(Weyl Semimetal)은 에너지 띠가 점 접촉(Weyl node)을 이루며 위상학적 특성을 보이는 물질로, Berry 곡률(BC)과 궤도 자기 모멘트(OMM)가 전송 현상에 큰 영향을 미칩니다.", "motivation": "기존의 선형 반응 이론에서 무시되었던 궤도 자기 모멘트(OMM) 기여를 포함하여, 기울어진(tilted) type-II Weyl 반금속의 자기 전도도를 이론적으로 정립하고자 했습니다.", "result": "type-II Weyl 반금속의 열린 페르미 면과 유한한 상태 밀도가 BC와 OMM에 의한 전송 반응을 크게 바꿈을 발견했습니다. OMM은 자장의 방향과 시료 기하학적 구조에 따라 자기 전도도를 증폭시키거나 억제할 수 있음을 증명했습니다.", "implication": "WTe2와 같은 실제 물질에서 BC와 OMM의 상호작용을 실험적으로 분리하여 측정할 수 있는 이론적 지침을 제공합니다.", "novelty": "기존 type-I 위주의 이론에서 벗어나 실질적인 type-II 물질에서 나타나는 OMM 효과를 명시적으로 도출하여, 실제 Weyl 반금속에서의 실험 데이터를 해석하는 데 중요한 틀을 제시했습니다.", "unresolved": "강한 상관관계 효과나 비선형적 밴드 구조의 미세한 변화가 OMM에 미치는 영향은 추가 연구가 필요합니다.", "future_work": "제시된 이론적 모델을 기반으로 WTe2나 TaIrTe4와 같은 물질에서 자장 의존적 전송 측정을 수행하여 BC/OMM 기여도를 추출하는 실험이 기대됩니다.", "concepts": [{"term": "type-II Weyl 반금속", "why_emerged": "Weyl cone이 강하게 기울어져 전자와 정공 포켓이 접촉하는 새로운 위상학적 상태를 설명하기 위해 필요.", "origin": "Soluyanov et al. (Nature, 2015).", "connections": "WTe2, Lorentz 불변성 위반."}, {"term": "궤도 자기 모멘트 (OMM)", "why_emerged": "결정 격자 내 전자의 국소적인 궤도 운동이 외부 자장에 반응하는 기여를 설명하기 위해 필수적임.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "Berry 곡률, 비정상 홀 효과."}, {"term": "Berry 곡률 (BC)", "why_emerged": "운동량 공간에서 위상학적 기하학적 위상이 전자의 동역학에 미치는 효과를 나타내기 위해 필요.", "origin": "Michael Berry (1984).", "connections": "위상 절연체, 비정상 홀 효과, 반정상 자성."}], "english_summary": ["Developed a semiclassical Boltzmann framework for magnetoconductivity in tilted type-II Weyl semimetals.", "Explicitly incorporated both Berry curvature and orbital magnetic moment (OMM) corrections.", "Found that OMM can either enhance or suppress magnetoconductivity depending on field orientation.", "Identifies specific signatures for experimental detection in materials like WTe2 and TaIrTe4."]}}, {"title": "Magnon high-harmonic generation by nonlinearities of spin torque driven by phonon-mediated crossing of many-body energy levels of bright and dark excitons", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2611.26589", "authors": "Jalil Varela-Manjarres, Federico Garcia-Gaitan, Branislav K. Nikolic", "last_authors": "Federico Garcia-Gaitan, Branislav K. Nikolic", "summary": "Recent intense experimental focus on CrSBr, a two-dimensional (2D) antiferromagnetic semiconductor, has revealed numerous surprises in its response to ultrafast optical drive. We demonstrate that a single microscopic mechanism accounts for two of them---high-harmonic generation of magnons and persistence of magnon oscillations over \\mbox{$\\sim 1$ ns} time scale that is much longer than the femtosecond laser pulse (fsLP) pump duration. This mechanism arises from an unusually complex interplay of four different fundamental quasiparticles of condensed matter physics: magnons, optically bright and dark excitons, and phonons. By viewing magnons as the system and the other three quasiparticles as a quantum many-body bath, we derive an extended Landau-Lifshitz-Gilbert (eLLG) equation. Its new term generated by the bath is spatially nonlocal and time-dependent, as well as strongly {\\em nonlinear} when the {\\em crossing of many-body energy levels} of bright and dark excitons occurs via phonon mediation. It also resembles the so-called field-like spin-transfer torque (STT) in spintronics, but STT is driven there with current pulses, so it explains the microscopic origin of the recently experimentally conjectured {\\em excitonic STT}. Since dark excitons supply energy to magnons long after the fsLP is switched off, such a reservoir opens avenues for its engineering and applications in optospintronics and optomagnonics, neuromorphic computing, and quantum transduction.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Advanced study on antiferromagnetic CrSBr with ultrafast spectroscopy/magnon dynamics implications.", "tags": ["magnon", "antiferromagnet", "ultrafast"], "image": "https://arxiv.org/html/2611.26589v1/Fig1_V3.png", "briefing": {"background": "CrSBr과 같은 2D 반강자성체는 광학적 여기를 통해 마그논(magnon) 동역학을 제어할 수 있는 차세대 스핀트로닉스 재료로 주목받고 있습니다.", "motivation": "최근 CrSBr에서 관찰된 마그논의 고조파 발생과 긴 수명의 마그논 진동 현상의 근본적인 미시적 메커니즘을 규명하고자 했습니다.", "result": "마그논, 밝은 엑시톤, 어두운 엑시톤, 그리고 포논이 복합적으로 상호작용하는 시스템을 유도하고, 특히 엑시톤 간의 에너지 준위 교차 시 발생하는 비선형 스핀 토크 효과가 마그논 고조파를 유발함을 밝혔습니다.", "implication": "어두운 엑시톤이 마그논의 에너지 저장소 역할을 하여 펨토초 레이저 펄스 이후에도 마그논을 장시간 진동시킬 수 있음을 입증했습니다.", "novelty": "기존에 추측만 되었던 '엑시톤 스핀 토크(excitonic STT)'의 미시적 기원을 이론적으로 유도했으며, 2D 자성체에서의 광-마그논 상호작용을 새로운 관점에서 설명했습니다.", "unresolved": "다양한 2D 자성체에서 이 메커니즘의 보편성을 확인하기 위한 추가적인 재료 연구가 필요합니다.", "future_work": "이러한 엑시톤-마그논 결합을 이용한 초고속 정보 처리 장치 및 뉴로모픽 컴퓨팅 소자로의 응용 실험이 기대됩니다.", "concepts": [{"term": "엑시톤 스핀 토크", "why_emerged": "광학적으로 생성된 엑시톤이 스핀 자유도에 토크를 가해 자성 상태를 변화시키는 과정을 설명하기 위해 필요.", "origin": "초록 정보만으로는 특정하기 어려움 (최근 실험적 추측 기반).", "connections": "스핀 전달 토크(STT), 광-스핀트로닉스."}, {"term": "고조파 발생 (High-harmonic generation)", "why_emerged": "강한 비선형 응답을 통해 기본 주파수의 정수배 에너지를 가진 마그논을 생성하기 위해 필요.", "origin": "비선형 광학 분야에서 유래, 스핀 시스템으로 확장됨.", "connections": "비선형 동역학, Landau-Lifshitz-Gilbert 방정식."}], "english_summary": ["Presents a unified microscopic mechanism for magnon high-harmonic generation in 2D antiferromagnet CrSBr.", "Derived an extended Landau-Lifshitz-Gilbert equation accounting for magnon-exciton-phonon interactions.", "Identifies excitonic spin-transfer torque as the driver of long-lived magnon oscillations.", "Suggests CrSBr is a promising platform for optospintronics and neuromorphic computing applications."]}}, {"title": "Momentum-space quantum Monte Carlo for twisted bilayer graphene: Interaction effects in the presence of remote bands", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2611.25522", "authors": "Shibo Shan, Cheng Huang, Zi Yang Meng", "last_authors": "Cheng Huang, Zi Yang Meng", "summary": "Twisted bilayer graphene hosts strong correlation effects within topological flat bands separated from remote dispersive bands. This separation motivates projection onto the central bands, which greatly reduces the computational complexity of many-body calculations, including momentum-space quantum Monte Carlo (QMC) simulations. However, the interaction-induced Mott gap obtained in the projected model can be comparable to the noninteracting flat--remote band separation, raising the question of whether the projection remains valid. Here, we extend momentum-space QMC to explicitly include remote BM bands within a broad energy window at charge neutrality. We find that the projected description remains reliable over a broad parameter regime, up to $u_0/u_1\\lesssim0.9$: the projected and remote-band calculations yield similar low-energy electron and trion spectra, and the Kramers intervalley-coherent ground state remains stable. In particular, the Dirac trion remains robust in the finite-temperature normal state when remote bands are included. Near the band-touching limit $u_0=u_1$, remote-band electrons acquire substantial low-energy spectral weight, accompanied by suppression of the trion weight and loss of the Kramers intervalley-coherent state. Our findings establish the broad validity of flat-band projection while reconciling the projected and THF viewpoints by identifying the near-band-touching regime in which explicit remote-band degrees of freedom become essential.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Strongly correlated electron systems in twisted graphene; highly relevant to current CM research interests.", "tags": ["graphene", "twistedbilayer", "stronglycorrelated"], "image": "https://arxiv.org/html/2611.25522v1/fig1.png", "briefing": {"background": "트위스트된 이중층 그래핀(TBG)은 마법 각도 근처에서 형성되는 평탄한 밴드(flat band) 내의 강력한 상관관계로 인해 초전도성 및 절연 상태와 같은 풍부한 물성을 보입니다. 이론적으로는 이 평탄한 밴드만을 분리하여 투영(projection)하는 방식을 사용해 계산 복잡도를 줄여왔으나, 실제 시스템에서는 멀리 떨어진 밴드(remote bands)와의 상호작용이 무시할 수 없는 수준일 수 있다는 의문이 제기되어 왔습니다.", "motivation": "평탄한 밴드 투영 모델이 실제 enerate ground states. Without any physics input about the expected outcome, it discovers a degenerate ground-state manifold whose entanglement reveals anyons with quantum dimension $\\sqrt{2}$, the hallmark of Ising-type non-Abelian order. By directly computing the overlap with trial wave functions, we further show that Landau level mixing favors the anti-Pfaffian over other candidate states. Our results demonstrate the power of neural-network wave functions in finding and characterizing non-Abelian anyons from first principles, in regimes of strong Landau level mixing, relevant to many recent experiments.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Significant advancement in understanding fractional quantum Hall physics and non-Abelian anyons.", "tags": ["quantum_hall", "anyons", "topological"], "image": "https://arxiv.org/html/2610.18967v2/fig2_landau_delta_nu.png", "briefing": {"background": "분수 양자 홀 효과(FQHE) 상태, 특히 짝수 분모 충진율에서의 비아벨 애니온은 위상 양자 컴퓨터 구현을 위한 핵심 요소로 간주됩니다. 그러나 란다우 준위 혼합(Landau level mixing)이 강한 실제 실험 환경에서는 어떤 위상적 질서가 우세한지 이론적으로 규명하기가 매우 어려웠습니다.", "motivation": "란다우 준위 혼합을 포함한 실제 미시적 해밀토니안 상황에서 신경망 변분 파동함수를 사용하여 비아벨 애니온(Ising-type)의 존재를 입증하고 최적의 위상 상태를 찾고자 함.", "result": "AI 기반의 신경망 파동함수를 통해 란다우 준위 혼합이 강한 환경에서도 3/2 충진율에서 'anti-Pfaffian' 상태가 기저 상태임을 밝혀냈으며, 이 상태가 양자 차원(quantum dimension) sqrt(2)를 가짐을 증명함.", "implication": "강한 상호작용과 란다우 준위 혼합이 존재하는 복잡한 시스템에서도 데이터 기반 AI 방법론이 비섭동적 위상 물리 문제를 해결할 수 있는 강력한 도구임을 입증함.", "novelty": "물리적 선입견 없이 신경망 파동함수만을 이용하여 비아벨 애니온의 징표를 찾아낸 점이 매우 혁신적이며, 기존의 복잡한 수치 계산 방법의 한계를 돌파함.", "unresolved": "본 결과는 이론적인 변분 계산에 기반하고 있어, 실제 시료에서의 란다우 준위 혼합 효과를 실험적으로 완전히 제어하여 비교하는 단계는 남아있음.", "future_work": "더 높은 충진율로의 확장 및 실제 실험 데이터와의 정밀한 위상 전하 매칭 연구가 예상됨.", "concepts": [{"term": "Non-Abelian Anyons", "why_emerged": "입자의 통계적 성질이 교환 순서에 의존하여 위상 양자 연산의 핵심 요소가 될 수 있음을 설명하기 위해 도입됨.", "origin": "Moore, Read, Wen 등이 1990년대 정립.", "connections": "분수 양자 홀 효과, 위상 양자 컴퓨팅."}, {"term": "Landau Level Mixing", "why_emerged": "전자 간 쿨롱 상호작용 에너지
