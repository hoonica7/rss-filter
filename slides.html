<!DOCTYPE html>

<meta name='viewport' content='width=device-width, initial-scale=1.0'>
<title>Daily Paper Slideshow</title>
<style>
  :root {
    color-scheme: light;
    --bg: #f6f7f4;
    --paper: #ffffff;
    --ink: #111827;
    --muted: #64748b;
    --line: #d8ddd2;
    --accent: #176b87;
    --accent-2: #9a3412;
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; overflow: auto; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: var(--bg); color: var(--ink); }
  .shell { max-width: 1500px; min-height: 100vh; margin: 0 auto; padding: 14px 18px; display: flex; flex-direction: column; }
  .topbar { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 16px; }
  .top-actions { display: flex; align-items: center; gap: 10px; }
  .topbar a, button { border: 1px solid var(--line); border-radius: 8px; background: var(--paper); color: var(--ink); padding: 10px 14px; font-weight: 700; text-decoration: none; cursor: pointer; }
  button.primary { background: var(--accent); border-color: var(--accent); color: white; }
  button:disabled { opacity: 0.45; cursor: not-allowed; }
  .counter { color: var(--muted); font-weight: 700; }
  .slide { min-height: calc(100vh - 82px); background: var(--paper); border: 1px solid var(--line); border-radius: 10px; padding: 18px; box-shadow: 0 18px 42px rgba(15, 23, 42, 0.10); display: grid; grid-template-columns: minmax(310px, 0.86fr) minmax(0, 1.55fr); gap: 18px; overflow: visible; }
  .paper-head { min-width: 0; min-height: 0; overflow: visible; display: flex; flex-direction: column; gap: 12px; }
  .figure { margin: 0; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: #f8fafc; }
  .figure img { display: block; width: 100%; max-height: 41vh; object-fit: contain; background: white; }
  .figure figcaption { padding: 7px 10px; color: var(--muted); font-size: 12px; line-height: 1.3; }
  .head-text { display: flex; flex-direction: column; gap: 9px; min-width: 0; }
  .badges { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .badge { border-radius: 999px; padding: 5px 9px; background: #eef2ff; color: #3730a3; font-size: 12px; font-weight: 800; }
  .score { background: #fee2e2; color: #991b1b; }
  h1 { margin: 0; font-size: 25px; line-height: 1.15; letter-spacing: 0; overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
  h1 a { color: inherit; text-decoration-color: rgba(23, 107, 135, 0.35); text-decoration-thickness: 2px; text-underline-offset: 4px; }
  h1 a:hover { color: var(--accent); text-decoration-color: var(--accent); }
  .meta, .authors, .why, .abstract { font-size: 13px; line-height: 1.45; }
  .meta, .authors { color: var(--muted); }
  .why strong, .abstract strong, .authors strong { color: var(--ink); }
  .authors { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .why { border-left: 4px solid var(--accent-2); padding-left: 10px; color: #374151; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .abstract { border-top: 1px solid var(--line); padding-top: 14px; color: #374151; }
  .original-abstract { border-top: 1px solid var(--line); padding-top: 10px; color: #374151; font-size: 11.5px; line-height: 1.35; overflow-wrap: anywhere; }
  .original-abstract strong { display: block; margin-bottom: 4px; color: var(--ink); }
  .tags { display: flex; flex-wrap: wrap; gap: 8px; }
  .tag { border-radius: 999px; padding: 4px 8px; background: #f1f5f9; color: #475569; font-size: 12px; font-weight: 700; }
  .head-text > .link { display: none; }
  .briefing { min-width: 0; min-height: 0; overflow: visible; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); grid-auto-rows: minmax(0, auto); align-content: start; gap: 11px 18px; border-top: 0; padding-top: 0; }
  .brief-section { min-width: 0; }
  .brief-section.wide { grid-column: 1 / -1; }
  .brief-section h2 { margin: 0 0 4px; font-size: 14px; line-height: 1.22; color: #0f766e; letter-spacing: 0; }
  .brief-section p, .brief-section li { margin: 0; font-size: 12.5px; line-height: 1.42; color: #1f2937; overflow-wrap: anywhere; }
  .brief-section ul { margin: 0; padding-left: 20px; }
  .concepts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 9px 14px; }
  .concept { border-top: 1px solid var(--line); padding-top: 7px; }
  .concept h3 { margin: 0 0 4px; font-size: 13px; color: #7c2d12; letter-spacing: 0; }
  .concept p { margin: 2px 0 0; font-size: 11.5px; line-height: 1.35; color: #374151; overflow-wrap: anywhere; }
  .concept b { color: #111827; }
  .link { color: var(--accent); font-weight: 800; text-decoration: none; }
  .empty { padding: 48px; background: var(--paper); border: 1px solid var(--line); border-radius: 12px; color: var(--muted); }
  @media (max-width: 860px) {
    .shell { padding: 14px; }
    .topbar, .top-actions { align-items: stretch; flex-direction: column; }
    .slide, .briefing, .concepts { grid-template-columns: 1fr; }
    .slide { min-height: auto; overflow: visible; display: grid; }
    h1 { font-size: 28px; }
  }
</style>

<script>
const slides = [{"title": "Tuning the Fermi surface of MoTe2 by Nb doping", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/nqff-vzcg", "authors": "Andrew P. Weber, Iñigo Robredo, Philipp Rüßmann, et al.", "last_authors": "J. Enrique Ortega, Julen Ibañez-Azpiroz", "summary": "Ab initio calculations and angle-resolved photoemission experiments demonstrate that the bulk and surface electronic structure of Weyl semimetal candidate ${\\mathrm{MoTe}}_{2}$ changes significantly by tuning the chemical potential by less than 0.4 eV. Calculations indicate that several Lifshitz tra…", "tier": "A_MUST_READ", "score": "10", "reason": "Direct ARPES study of Fermi surface tuning and Weyl physics in Nb-doped MoTe2.", "tags": ["ARPES", "MoTe2", "Weylsemimetal"], "image": "", "briefing": {"background": "웨일 반금속(Weyl semimetal)은 에너지 밴드가 특정 지점에서 교차하며 독특한 위상학적 특성을 보이는 물질로, MoTe2는 이러한 특성이 외부 자극이나 도핑에 의해 민감하게 변할 수 있어 많은 관심을 받고 있는 후보 물질입니다.", "motivation": "본 연구는 Nb 도핑을 통해 화학적 포텐셜을 미세하게 조정(0.4 eV 미만)했을 때, MoTe2의 벌크 및 표면 전자 구조와 페르미 면의 위상학적 변화가 어떻게 일어나는지 정밀하게 규명하고자 했습니다.", "result": "제일원리 계산과 ARPES 실험을 통해 Nb 도핑에 따른 화학적 포텐셜의 변화를 확인하였으며, 이 과정에서 페르미 면의 위상이 변화하는 여러 번의 립시츠 전이(Lifshitz transitions)가 발생함을 입증했습니다.", "implication": "화학적 도핑을 통해 MoTe2의 위상학적 상태와 페르미 면 기하학을 정밀하게 제어할 수 있음을 보여주며, 이는 위상 소자 응용을 위한 기초 토대가 됩니다.", "novelty": "독자의 주요 관심사인 ARPES를 활용하여 웨일 반금속 후보인 MoTe2의 전자 구조 튜닝을 직접 관측했다는 점이 중요하며, 도핑에 따른 전자 구조의 구체적인 진화 과정을 밝힌 것이 핵심입니다.", "unresolved": "도핑에 의해 유도된 각 웨일 포인트의 정확한 이동 경로와 그에 따른 전송 특성(Hall 효과 등)의 정량적 연결은 추가 연구가 필요합니다.", "future_work": "다양한 농도의 Nb 도핑 샘플에 대한 스핀 분해 ARPES(Spin-ARPES) 실험과 저온에서의 양자 진동 측정이 기대됩니다.", "concepts": [{"term": "Weyl semimetal", "why_emerged": "고체 물리 내에서 질량이 없는 웨일 페르미온을 구현하고 새로운 양자 수송 현상을 탐구하기 위해 등장했습니다.", "origin": "2015년경 TaAs 계열에서 처음 실험적으로 입증되었습니다.", "connections": "위상 절연체, 디락 반금속, 변칙 홀 효과(AHE)와 밀접한 관련이 있습니다."}, {"term": "Lifshitz transition", "why_emerged": "전자 구조의 위상학적 변화가 물질의 물성에 미치는 영향을 설명하기 위해 필요했습니다.", "origin": "1960년 I. M. Lifshitz에 의해 제안되었습니다.", "connections": "상전이, 초전도 현상, 비정상적인 열역학적 성질과 연관됩니다."}, {"term": "ARPES", "why_emerged": "물질의 에너지와 운동량 공간에서의 전자 구조를 직접적으로 관측하기 위해 개발되었습니다.", "origin": "초록 정보만으로는 특정하기 어려우나, 광전효과를 기반으로 수십 년간 발전해 왔습니다.", "connections": "페르미 면 매핑, 밴드 갭 측정, 다체 상호작용 연구의 핵심 도구입니다."}], "english_summary": ["Investigates the Fermi surface evolution of Weyl semimetal MoTe2 via Nb doping.", "Combines ARPES experiments with ab initio calculations to monitor electronic structure changes.", "Identifies multiple Lifshitz transitions within a 0.4 eV chemical potential range.", "Demonstrates effective tuning of bulk and surface topological electronic states."]}}, {"title": "Graphene lattice recoil in hard x-ray photoemission: Experiment and theory", "journal": "PRB_Recent", "source": "keyword", "link": "http://link.aps.org/doi/10.1103/s8w3-plc1", "authors": "Simone Ritarossi, Alice Apponi, Orlando Castellano, et al.", "last_authors": "Francesco Offi, Alessandro Ruocco", "summary": "Hard-x-ray C 1 s photoemission from monolayer graphene probes a regime in which nuclear recoil and intrinsic electronic asymmetry contribute on comparable energy scales to the observed spectral line shape. Here we combine experiment and modeling over the photon-energy range 0.8 – 8 keV to resolve this interplay quantitatively. A graphene-specific implementation of the Fujikawa-Takata cumulant formalism, based on an anisotropic vibrational density of states constrained by first-principles phonon calculations, captures the expected recoil scaling with photon energy and emission geometry but fails to reproduce the pronounced asymmetric tails of the measured spectra. To overcome this limitation, we introduce an explicit electronic convolution model in which a photon-energy-independent reference response, dominated by the electronic line shape and extracted from the low-recoil 0.8 keV data through a recoil-inclusive fit, is convolved with a phonon recoil kernel carrying the full dependence on photon energy and emission angle. This approach reproduces both the measured line-shape evolution and the observed peak shifts across the explored energy range without refitting the spectra at higher photon energies. The results show that recoil in graphene cannot be described by a baseline treatment in which the phonon recoil kernel is combined only with symmetric lifetime broadening, but must be treated together with the intrinsic many-body electronic response of the C 1 s line.", "tier": "A_MUST_READ", "score": "9", "reason": "title strong match: photoemission", "tags": ["photoemission", "graphene", "monolayer"], "image": "", "briefing": {"background": "하드 엑스레이 광전자 분광법(HAXPES)은 벌크 민감도가 높아 물질 내부의 전자 구조 연구에 유용하지만, 가벼운 원소의 경우 고에너지 광자에 의한 원자핵 반동(recoil) 효과가 스펙트럼 형상을 심하게 왜곡시키는 문제가 있습니다.", "motivation": "그래핀과 같은 2D 물질에서 0.8~8 keV 에너지 범위의 광전자가 방출될 때 나타나는 핵 반동 효과와 전자적 비대칭성 간의 복잡한 상호작용을 정량적으로 해석하고자 했습니다.", "result": "단순한 포논 반동 모델만으로는 실험적인 비대칭 스펙트럼을 설명할 수 없으며, 다체(many-body) 효과에 의한 고유의 전자적 라인 모양과 포논 반동 커널을 결합한 새로운 모델이 실험 결과를 정확히 재현함을 보였습니다.", "implication": "2D 물질 및 가벼운 원소 기반 시스템의 고에너지 광전자 분광 데이터 해석 시 격자 반동과 다체 전자 응답을 동시에 고려해야 한다는 가이드라인을 제시합니다.", "novelty": "그래핀의 핵 반동 현상을 실험과 이론의 결합을 통해 정밀하게 규명했으며, 에너지에 따른 스펙트럼 진화를 통합적으로 설명하는 모델을 제시했습니다.", "unresolved": "다양한 기판과의 상호작용이 존재하는 다른 2D 헤테로 구조에서의 반동 효과 변화 여부.", "future_work": "h-BN이나 전이금속 디칼코게나이드(TMD) 등 다른 저차원 물질 시스템으로의 모델 확장 적용이 필요합니다.", "concepts": [{"term": "Nuclear recoil", "why_emerged": "광전자가 방출될 때의 운동량 보존 법칙에 의한 원자핵의 에너지 손실을 설명하기 위해 등장했습니다.", "origin": "초록 정보만으로는 특정하기 어려우나, 뫼스바우어 효과 등 핵물리 및 고체물리에서 기원합니다.", "connections": "포논 산란, HAXPES 스펙트럼 비대칭성, 원자 수준의 동역학 연구와 연결됩니다."}, {"term": "HAXPES", "why_emerged": "표면 민감도가 높은 기존 XPS의 한계를 극복하고 물질 내부(bulk)의 정보를 얻기 위해 등장했습니다.", "origin": "2000년대 초반 방사광 가속기 기술의 발전과 함께 본격화되었습니다.", "connections": "벌크 전자 구조, 깊이별 화학적 상태 분석 등에 활용됩니다."}], "english_summary": ["Analyzes nuclear recoil effects in hard x-ray C 1s photoemission of monolayer graphene.", "Covers a wide photon energy range from 0.8 to 8 keV.", "Proposes a model combining phonon recoil with intrinsic many-body electronic asymmetry.", "Shows that recoil in graphene requires a treatment integrated with electronic response."]}}, {"title": "Altermagnetism in Folded Iron Chain Systems", "journal": "PRL_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/6327-7256", "authors": "Ling-Fang Lin, Yang Zhang, Satoshi Okamoto, Adriana Moreo, Lun-Hui Hu, Elbio Dagotto", "last_authors": "Lun-Hui Hu, Elbio Dagotto", "summary": "Altermagnetism—moment-compensated magnetism with momentum-dependent spin splitting—has so far been realized primarily in Néel-type antiferromagnets. Here, we demonstrate altermagnetism in folded iron chain systems with block-type magnetic order (e.g.,$↑↑↓↓$). In the strictly one-dimensional (1D) cas…", "tier": "A_MUST_READ", "score": "9", "reason": "Theory of altermagnetism in 1D chains with momentum-dependent spin splitting, highly relevant for ARPES.", "tags": ["theory", "altermagnetism", "electronic-structure"], "image": "", "briefing": {"background": "알터마그네티즘(Altermagnetism)은 순 자화값은 0이지만 운동량 공간에서 스핀 분할(spin splitting)이 나타나는 제3의 자성 상태로, 최근 응집물질 물리 분야에서 급부상하고 있는 주제입니다.", "motivation": "기존에 주로 연구되던 Néel 타입 반강자성체 외에, 1차원 사슬 구조와 블록 타입(↑↑↓↓) 자기 질서를 가진 시스템에서도 알터마그네티즘이 나타날 수 있는지 이론적으로 탐구하고자 했습니다.", "result": "이론적 모델링을 통해 접힌 철(iron) 사슬 시스템의 블록 타입 자기 질서가 운동량에 의존하는 스핀 분할을 유도함을 증명했습니다. 이는 이론적 예측 단계이며 실제 물질에서의 확인이 필요합니다.", "implication": "알터마그네티즘의 구현 가능한 물질 범위를 준1차원(quasi-1D) 시스템과 비전통적인 자기 질서로 확장시킴으로써, 관련 ARPES 연구의 새로운 타겟을 제시합니다.", "novelty": "블록 타입 자기 구조에서의 알터마그네티즘을 처음으로 제안했으며, 독자가 관심을 가지는 112 계열 화합물이나 철 기반 사슬 시스템과의 연관성이 매우 높습니다.", "unresolved": "이론적 예측을 뒷받침할 수 있는 실제 화합물(예: 특정 철 기반 준1차원 물질)에서의 Spin-ARPES 실험적 검증.", "future_work": "예측된 스핀 분할을 관측하기 위한 준1차원 철 화합물에 대한 고해상도 ARPES 실험 및 자성 특성 정밀 측정이 요구됩니다.", "concepts": [{"term": "Altermagnetism", "why_emerged": "반강자성체의 특성과 강자성체의 스핀 분할 장점을 동시에 갖는 물질군을 분류하기 위해 등장했습니다.", "origin": "2021-2022년경 Libor Šmejkal, Jairo Sinova 등에 의해 체계화되었습니다.", "conne
