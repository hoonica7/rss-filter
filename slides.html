<title>Daily Paper Slideshow</title>
<style>
  :root {
    color-scheme: light;
    --bg: #f6f7f4;
    --paper: #ffffff;
    --ink: #111827;
    --muted: #64748b;
    --line: #d8ddd2;
    --accent: #176b87;
    --accent-2: #9a3412;
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; overflow: auto; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: var(--bg); color: var(--ink); }
  .shell { max-width: 1500px; min-height: 100vh; margin: 0 auto; padding: 14px 18px; display: flex; flex-direction: column; }
  .topbar { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 16px; }
  .top-actions { display: flex; align-items: center; gap: 10px; }
  .topbar a, button { border: 1px solid var(--line); border-radius: 8px; background: var(--paper); color: var(--ink); padding: 10px 14px; font-weight: 700; text-decoration: none; cursor: pointer; }
  button.primary { background: var(--accent); border-color: var(--accent); color: white; }
  button:disabled { opacity: 0.45; cursor: not-allowed; }
  .counter { color: var(--muted); font-weight: 700; }
  .slide { min-height: calc(100vh - 82px); background: var(--paper); border: 1px solid var(--line); border-radius: 10px; padding: 18px; box-shadow: 0 18px 42px rgba(15, 23, 42, 0.10); display: grid; grid-template-columns: minmax(310px, 0.86fr) minmax(0, 1.55fr); gap: 18px; overflow: visible; }
  .paper-head { min-width: 0; min-height: 0; overflow: visible; display: flex; flex-direction: column; gap: 12px; }
  .figure { margin: 0; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: #f8fafc; }
  .figure img { display: block; width: 100%; max-height: 41vh; object-fit: contain; background: white; }
  .figure figcaption { padding: 7px 10px; color: var(--muted); font-size: 12px; line-height: 1.3; }
  .head-text { display: flex; flex-direction: column; gap: 9px; min-width: 0; }
  .badges { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .badge { border-radius: 999px; padding: 5px 9px; background: #eef2ff; color: #3730a3; font-size: 12px; font-weight: 800; }
  .score { background: #fee2e2; color: #991b1b; }
  h1 { margin: 0; font-size: 25px; line-height: 1.15; letter-spacing: 0; overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
  h1 a { color: inherit; text-decoration-color: rgba(23, 107, 135, 0.35); text-decoration-thickness: 2px; text-underline-offset: 4px; }
  h1 a:hover { color: var(--accent); text-decoration-color: var(--accent); }
  .meta, .authors, .why, .abstract { font-size: 13px; line-height: 1.45; }
  .meta, .authors { color: var(--muted); }
  .why strong, .abstract strong, .authors strong { color: var(--ink); }
  .authors { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .why { border-left: 4px solid var(--accent-2); padding-left: 10px; color: #374151; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .abstract { border-top: 1px solid var(--line); padding-top: 14px; color: #374151; }
  .original-abstract { border-top: 1px solid var(--line); padding-top: 10px; color: #374151; font-size: 11.5px; line-height: 1.35; overflow-wrap: anywhere; }
  .original-abstract strong { display: block; margin-bottom: 4px; color: var(--ink); }
  .tags { display: flex; flex-wrap: wrap; gap: 8px; }
  .tag { border-radius: 999px; padding: 4px 8px; background: #f1f5f9; color: #475569; font-size: 12px; font-weight: 700; }
  .head-text > .link { display: none; }
  .briefing { min-width: 0; min-height: 0; overflow: visible; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); grid-auto-rows: minmax(0, auto); align-content: start; gap: 11px 18px; border-top: 0; padding-top: 0; }
  .brief-section { min-width: 0; }
  .brief-section.wide { grid-column: 1 / -1; }
  .brief-section h2 { margin: 0 0 4px; font-size: 14px; line-height: 1.22; color: #0f766e; letter-spacing: 0; }
  .brief-section p, .brief-section li { margin: 0; font-size: 12.5px; line-height: 1.42; color: #1f2937; overflow-wrap: anywhere; }
  .brief-section ul { margin: 0; padding-left: 20px; }
  .concepts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 9px 14px; }
  .concept { border-top: 1px solid var(--line); padding-top: 7px; }
  .concept h3 { margin: 0 0 4px; font-size: 13px; color: #7c2d12; letter-spacing: 0; }
  .concept p { margin: 2px 0 0; font-size: 11.5px; line-height: 1.35; color: #374151; overflow-wrap: anywhere; }
  .concept b { color: #111827; }
  .link { color: var(--accent); font-weight: 800; text-decoration: none; }
  .empty { padding: 48px; background: var(--paper); border: 1px solid var(--line); border-radius: 12px; color: var(--muted); }
  @media (max-width: 860px) {
    .shell { padding: 14px; }
    .topbar, .top-actions { align-items: stretch; flex-direction: column; }
    .slide, .briefing, .concepts { grid-template-columns: 1fr; }
    .slide { min-height: auto; overflow: visible; display: grid; }
    h1 { font-size: 28px; }
  }
</style>

<script>
const slides = [{"title": "Interaction-driven quantum criticality in two-dimensional quadratic band crossing semimetals with time-reversal symmetry breaking", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/lbcv-sgpm", "authors": "Yi-Kun Fang, Jing Wang", "last_authors": "Yi-Kun Fang, Jing Wang", "summary": "We present a systematic investigation of all 16 marginally relevant fermion-fermion interactions in two-dimensional (2D) time-reversal symmetry-breaking kagome semimetals hosting a quadratic band crossing point (QBCP). Employing a momentum-shell renormalization-group approach that treats every inter…", "tier": "A_MUST_READ", "score": "10", "reason": "Direct hit for user projects: kagome semimetals and time-reversal symmetry breaking.", "tags": ["theory", "kagome", "TRSB"], "image": "", "briefing": {"background": "2차원 물질에서 나타나는 이차 곡선 교차점(Quadratic Band Crossing Point, QBCP)은 강한 전자 상관관계가 발현될 수 있는 특이적인 전자 구조입니다. 특히 카고메 격자와 같이 시간 반전 대칭성(TRS)이 깨진 계에서 이러한 상태는 비자명한 위상적 특성과 양자 임계 현상을 유도할 수 있어 활발히 연구되고 있습니다.", "motivation": "TRS가 깨진 카고메 semimetal 시스템에서 가능한 16가지의 페르미온-페르미온 상호작용이 시스템의 양자 임계성에 미치는 영향을 체계적으로 규명하고자 합니다.", "result": "모멘텀 쉘 재규격화군(RG) 방법을 통해 특정 상호작용들이 시스템의 양자 임계 현상을 어떻게 유도하는지 도출하였습니다.", "implication": "이 결과는 카고메 금속(예: AV3Sb5 계열)에서 관측되는 TRSB 기원과 관련된 전자 상태의 상호작용 메커니즘을 이론적으로 뒷받침하며, 향후 강상관 전자계 모델링의 기준이 될 것입니다.", "novelty": "기존 연구와 달리 16가지 가능한 상호작용 채널을 모두 고려한 포괄적 분석이며, 카고메 금속 내 비자명한 위상 상태와 자성/초전도 현상의 연결고리를 제공합니다.", "unresolved": "실제 화합물에서의 격자 왜곡이나 구체적인 밴드 오프셋 효과가 재규격화 흐름에 미치는 영향은 추가 검증이 필요합니다.", "future_work": "실제 재료의 DFT 밴드 구조를 기반으로 한 하이젠베르크 모델이나 허바드 모델 파라미터와의 결합 연구.", "concepts": [{"term": "Quadratic Band Crossing Point (QBCP)", "why_emerged": "선형 분산(Dirac point)과는 달리 밴드 교차점이 이차 함수 형태를 띠며 높은 상태 밀도(DOS)를 가짐.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "고온 초전도체 및 도핑된 그래핀 물리와 관련."}, {"term": "Time-Reversal Symmetry Breaking (TRSB)", "why_emerged": "자기적 질서가 형성되거나 루프 전류와 같은 비자명한 상태가 존재할 때 나타남.", "origin": "상대론적 양자역학의 기본 대칭성으로 근원이 깊음", "connections": "Anomalous Hall effect, Weyl semimetals와 밀접."}], "english_summary": ["Analyzes 16 fermion interactions in 2D kagome semimetals with QBCP.", "Uses momentum-shell renormalization group to study quantum criticality.", "Provides theoretical insight into TRSB in kagome lattices.", "Bridges the gap between microscopic interactions and topological phase transitions."]}}, {"title": "Direct Visualization of Gate-Tunable Flat Bands in Twisted Double Bilayer Graphene", "journal": "PRL_Recent", "source": "author whitelist", "link": "http://link.aps.org/doi/10.1103/3vg5-vkzy", "authors": "Souvik Sasmal, Ryan Muzzio, Ahmed Khalifa, et al.", "last_authors": "Shubhayu Chatterjee, Jyoti Katoch", "summary": "The evolution of moiré minibands under varying carrier density and displacement field may be directly visualized using microfocused angle-resolved photoemission spectroscopy.", "tier": "A_MUST_READ", "score": "10", "reason": "author whitelist: Eli Rotenberg", "tags": ["angle-resolvedphotoemission", "photoemission", "graphene", "moir", "twisted", "flatband"], "image": "", "briefing": {"background": "뒤틀린(Twisted) 층상 구조의 그래핀은 모아레 무늬(Moiré pattern)로 인해 전자 밴드 구조가 평탄화(Flat band)되며, 이 영역에서 강한 상관관계에 의한 초전도나 절연체 상태가 발현됩니다.", "motivation": "이론적으로 예측된 모아레 미니밴드의 게이트 전압과 변위장에 따른 변화를 직접적인 공간 및 에너지 분해능으로 관찰하고자 합니다.", "result": "마이크로 포커싱된 ARPES를 사용하여 뒤틀린 이중 이중층 그래핀(TDBG)의 평탄 밴드가 게이트 전압에 따라 어떻게 진화하는지 시각화하는 데 성공했습니다.", "implication": "밴드 구조의 직접 관측은 강상관 전자계의 위상적 물리와 초전도 메커니즘을 실험적으로 확인하는 강력한 증거가 됩니다.", "novelty": "일반적인 수송 측정(transport)과 달리 ARPES를 통한 밴드 구조의 직접 시각화는 밴드 왜곡의 미시적 기원을 증명합니다.", "unresolved": "극히 좁은 공간 영역에서의 측정으로 인한 샘플 불균일성 및 빔 스팟 크기 제한에 따른 분해능 한계.", "future_work": "더 넓은 꼬임 각도 범위와 더 낮은 온도에서의 정밀한 전자 구조 관찰.", "concepts": [{"term": "Moiré Flat Bands", "why_emerged": "두 층 사이의 꼬임으로 인한 속도 억제 및 상태 밀도 극대화 필요.", "origin": "Bistritzer와 MacDonald (2011)에 의해 이론적으로 정립", "connections": "Magic-angle twisted bilayer graphene과 연결."}, {"term": "Micro-ARPES", "why_emerged": "미세한 모아레 도메인 ]}}, {"title": "Discovery of flat-band 2D materials via physics-informed scoring and structure-based learning", "journal": "Science_Advances", "source": "Gemini", "link": "https://doi.org/10.1126/sciadv.aea3611", "authors": "Xiangwen Wang, Yihao Wei, Anupam Bhattacharya, Qian Yang, Artem Mishchenko", "last_authors": "Qian Yang, Artem Mishchenko", "summary": "Flat electronic bands are a fertile ground for exotic quantum phenomena, from unconventional superconductivity to fractional topology. However, their rarity and the reliance on density functional theory (DFT) calculations for identification have limited systematic exploration across large material spaces. Here, we report the discovery of multiple previously unrecognized flat-band two-dimensional materials through a structure-informed, data-driven framework. We introduce a physically motivated flatness score that combines band dispersion and density-of-states features, enabling algorithmic labeling of known materials without requiring manual inspection. This score is then used to train a multimodal deep learning model that predicts flat-band propensity directly from atomic structure. Applied to more than 10,000 unlabeled materials, our framework identifies numerous flat-band candidates. Among the top-scoring structures (flatness score higher than 0.9), DFT calculations on materials with kagome-like lattices confirm a flat-band prediction accuracy of 98%, demonstrating the ability to discover topologically nontrivial systems. By bypassing the need for precomputed band structures, our approach enables large-scale, interpretable screening and expands the design space for correlated quantum phases in low-dimensional systems.", "tier": "B_IMPORTANT_CONDMAT", "score": "9", "reason": "Data-driven discovery of 2D flat-band and kagome-like materials; highly relevant to electronic structure.", "tags": ["method", "material", "kagome", "flat-band"], "image": "", "briefing": {"background": "플랫 밴드(flat-band)는 상태 밀도가 극도로 높아 강한 .com/articles/s41567-026-03375-4", "authors": "Shusen Ye, Jianfa Zhao, Zhiheng Yao, et al.", "last_authors": "Changqing Jin, Yayu Wang", "summary": "How individual doped holes turn into superconducting Cooper pairs as doping increases in unconventional superconductors is still not well understood. Now, this process is observed in a paradigmatic cuprate compound.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Direct observation of electronic structure and pairing in a major class of unconventional superconductors.", "tags": ["material", "cuprates", "superconductivity"], "image": "https://media.springernature.com/m685/springer-static/image/art%3A10.1038%2Fs41567-026-03375-4/MediaObjects/41567_2026_3375_Fig1_HTML.png", "briefing": {"background": "구리 산화물(Cuprates)은 고온 초전도의 핵심 물질로, 도핑된 구멍(hole)이 어떻게 쿠퍼 쌍으로 진화하는지는 지난 수십 년간 고체 물리의 최대 난제 중 하나임.", "motivation": "도핑 농도가 증가함에 따라 개별 도핑 구멍이 어떻게 Zhang-Rice 단일항을 형성하고 결국 초전도 상태로 전이되는지 직접 관측하고자 함.", "result": "구리 산화물에서 도핑된 구멍의 거동과 전자적 분자 형성 및 쿠퍼 쌍 생성 과정을 시각화함.", "implication": "구리 산화물 초전도의 기원이 되는 미세 구조적 진화 과정을 확인하여 비전통적 초전도 이론의 실험적 토대를 강화함.", "novelty": "STM/STS 등 전자 구조 측정에 관심이 많은 독자에게 전하 캐리어의 진화를 실시간(공간적)으로 보여주는 혁신적인 관측 결과를 제공함.", "unresolved": "초전도 전이 온도 직전의 미세한 상 전이 과정과 불순물에 의한 국소적인 섭동 영향은 여전히 논의의 여지가 있음.", "future_work": "다른 도핑 범위와 다양한 구리 산화물 계열에서의 비교 연구를 통한 보편성 검증.", "concepts": [{"term": "Zhang-Rice 단일항", "why_emerged": "구리 산화물의 CuO2 평면에서 도핑된 구멍의 전자적 성질을 정확히 모델링하기 위해 제안됨.", "origin": "Zhang과 Rice(1988)가 제안.", "connections": "강상관 전자계, 앤더슨 격자 모델."}, {"term": "쿠퍼 쌍", "why_emerged": "낮은 온도에서 전자들이 인력을 통해 쌍을 이루어 초전도를 형성하는 현상을 설명하기 위함.", "origin": "BCS 이론(1957).", "connections": "포논 결합, 고온 초전도체의 비전통적 매개체."}], "english_summary": ["Direct visualization of the evolution of doped holes in cuprate superconductors.", "The study reveals the formation of Zhang-Rice singlets and the subsequent development of Cooper pairs.", "This provides critical insights into the pairing mechanism in unconventional superconductors.", "The results offer a spatial understanding of how macroscopic superconductivity emerges from microscopic electronic states."]}}, {"title": "Broken SU(3) flavor symmetry in a quantum Hall valley nematic", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/y8bd-y5ht", "authors": "G. Krizman, A. Kazakov, C.-W. Cho, et al.", "last_authors": "G. Springholz, L.-A. de Vaulchier", "summary": "Under high magnetic fields, electrons can organize and break internal symmetries associated with their pseudospin. Here, the authors demonstrate broken SU(3) symmetry assigned to the valley degree of freedom in the Pb(Sn)Se system by following the valley population revealed by the integer quantum Hall effect. A tilted magnetic field acts as a Zeeman valley field, lifting the valley pseudospin degeneracy and driving valley nematic order.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Experimental evidence for valley nematicity and symmetry breaking in a topological system.", "tags": ["experiment", "nematicity", "quantum-Hall"], "image": "", "briefing": {"background": "양자 홀 효과 하의 다체계는 전자의 자유도(계곡, 스핀 등) 사이의 경쟁으로 인해 비전통적인 질서 상태가 잘 나타남.", "motivation": "자기장이 인가된 상태에서 Pb(Sn)Se 시스템의 계곡(valley) 자유도가 가지는 SU(3) 대칭성이 어떻게 깨지는지 조사하기 위함.", "result": "계곡 자유도가 만드는 SU(3) 대칭성이 깨지며 네마틱 질서(nematic order)가 유도됨을 밝힘.", "implication": "위상 물질에서의 계곡 자유도 제어 가능성을 확인하였으며, 이는 향후 밸리트로닉스 및 위상 전자 소자 응용에 중요함.", "novelty": "독자의 관심사인 네마틱 질서와 위상 시스템의 접점을 다루며, 특히 자기장을 통한 계곡 자유도 조절 메커니즘을 상세히 규명함.", "unresolved": "네마틱 상전이의 상세한 임계 거동과 다른 다체 효과와의 상호작용은 추가 분석이 필요함.", "future_work": "다양한 경사 자기장 각도에서의 전도도 측정 및 위상학적 홀 효과 분석.", "concepts": [{"term": "계곡 네마틱 (Valley Nematic)", "why_emerged": "계곡(valley) 자유도 간의 축퇴가 깨지면서 방향성을 가진 질서가 나타나는 현상을 설명하기 위해 도입.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "전하 네마틱, 밸리트로닉스, SU(3) 대칭성 파괴."}, {"term": "SU(3) 대칭성", "why_emerged": "3개의 독립적인 계곡 자유도가 가지는 수학적 대칭 구조를 기술하기 위해 필요.", "origin": "입자 물리학에서 유래, 고체 물리에서는 다중 계곡 시스템에서 활용.", "connections": "스핀-궤도 결합, 양자 홀 효과 구현했습니다.", "implication": "스핀 분할 특성을 유지하면서 자기적 정렬 방식을 제어할 수 있어, 비휘발성 메모리 및 스핀 제어 장치 설계에 새로운 자유도를 제공합니다.", "novelty": "알터마그네틱의 대칭성 기원과 스핀 물리 현상을 실험적으로 조절 가능한 플랫폼으로 확장했다는 점이 핵심입니다.", "unresolved": "실제 상전이 경계에서의 미세한 자기 구조 및 동역학적 특성에 대한 심층적인 연구가 필요합니다.", "future_work": "다양한 화학적 치환 조합을 통한 새로운 알터마그네틱 물질 후보군 탐색 및 소자 응용 연구가 기대됩니다.", "concepts": [{"term": "알터마그네틱", "why_emerged": "반강자성체처럼 순자화는 없지만, 대칭성 덕분에 페르미 준위에서 스핀 분할이 나타나는 새로운 자기상 정의가 필요했습니다.", "origin": "최근 2-3년 내 체코 물리연구소 그룹(Jungwirth 등)에 의해 이론적 정립.", "connections": "반강자성, 스핀트로닉스, 페르미 준위 스핀 분할."}, {"term": "보상된 페리마그네틱", "why_emerged": "두 개 이상의 부격자 스핀이 서로 상쇄되어 전체 자화는 0이 되는 구조를 기술하기 위해 필요했습니다.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "페리마그네틱, 반강자성체, 스핀 밸런스."}], "english_summary": ["Explores interconversion between altermagnetism and compensated ferrimagnetism.", "Utilizes chemical symmetry breaking to modulate magnetic states.", "Demonstrates high potential for future spintronic devices.", "Highlights a new mechanism for controlling spin-splitting without net magnetization."]}}, {"title": "Tailoring Pure Valley-Zeeman Spin-Orbit Coupling in WSe2-Encapsulated Monolayer Graphene", "journal": "PRL_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/46n3-pryp", "authors": "Yaqing Han, Siqi Jiang, Jingkuan Xiao, et al.", "last_authors": "Lei Wang, Geliang Yu", "summary": "Clearly resolved Landau levels reveal a symmetry-enforced Landau-level reordering driven by competition between fixed valley–Zeeman splitting and magnetic-field-dependent cyclotron energy.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Direct experimental study of vdW heterostructures and graphene electronic structure under magnetic fields.", "tags": ["experiment", "graphene", "van-der-Waals", "transport"], "image": "", "briefing": {"background": "이중층 그래핀 및 vdW 헤테로구조에서 밸리(valley) 자유도와 스핀 자유도의 상호작용은 토폴로지 물성 연구의 핵심입니다.", "motivation": "WSe2와 그래핀의 헤테로구조에서 발현되는 밸리-제만(valley-Zeeman) 결합이 란다우 준위 재배열에 미치는 영향을 규명하고자 합니다.", "result": "자기장에 따른 란다우 준위의 이동과 밸리-제만 효과 사이의 경쟁을 통해 준위 재배열(reordering)을 직접 관측했습니다.", "implication": "vdW 헤테로구조를 통해 전자 구조의 대칭성을 미세하게 튜닝할 수 있음을 보여주며, 이는 밸리트로닉스 소자 설계의 기반이 됩니다.", "novelty": "란다우 준위 분해능을 극대화하여 밸리-제만 효과를 직접적으로 실험 제어(tailoring)했다는 점이 높게 평가됩니다.", "unresolved": "매우 낮은 자기장 영역에서의 준위 재배열 동역학 및 국소적인 불균일성 효과는 완전히 규명되지 않았습니다.", "future_work": "다양한 뒤틀림 각도(twist angle)를 가진 헤테로구조에서의 밸리-제만 커플링 변화 측정 연구.", "concepts": [{"term": "밸리-제만 스핀-궤도 결합", "why_emerged": "육방격자에서 대칭성 깨짐에 의해 각 밸리마다 스핀 분할이 일어나는 현상을 설명하기 위해 도입.", "origin": "주로 전이금속 디칼코게나이드(TMDC) 연구에서 확립.", "connections": "밸리트로닉스, 그래핀, 스핀-궤도 결합."}, {"term": "란다우 준위 재배열", "why_emerged": "강한 자기장에서 시스템의 에너지 준위가 외부 매개변수에 의해 순서가 바뀔 때 발생하는 물리 현상을 규명하기 위해 필요.", "origin": "양자 홀 효과 및 고체물리 기초 이론.", "connections": "자기적 상전이, 퀀텀 홀 효과, 전자 구조 튜닝."}], "english_summary": ["Investigates valley-Zeeman spin-orbit coupling in WSe2-encapsulated graphene.", "Observes Landau level reordering driven by magnetic field competition.", "Provides experimental control over electronic symmetries in vdW heterostructures.", "Essential for future valleytronic and quantum hall applications."]}}, {"title": "Two-Band Superconductivity in Few-Layer NbSe2 and TaS2", "journal": "PRL_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/p836-tdgw", "authors": "Shahar Simon, Maya Klang, Oded Millo, Hadar Steinberg", "last_authors": "Oded Millo, Hadar Steinberg", "summary": "The nature of superconductivity in the transition metal dichalcogenide family, particularly $2{\\mathrm{H}\\text{−}\\mathrm{NbSe}}_{2}$ and $2{\\mathrm{H}\\text{−}\\mathrm{TaS}}_{2}$ in the ultrathin limit, is not fully understood. While tunneling measurements apparently show a single superconducting gap,…", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Experimental investigation of multiband superconductivity in relevant TMDC materials.", "tags": ["superconductivity", "TMDC", "spectroscopy"], "image": "", "briefing": {"background": "NbSe2, TaS2와 같은 2D 전이금속 디칼코게나이드(TMDC) 물질은 CDW와 초전도성의 경쟁으로 물리학자들의 오랜 연구 대상이었습니다.", "motivation": "극박막(few-layer) TMDC에서 단일 갭으로 알려졌던 기존 측정 결과와 달리, 다중 밴드(two-band) 초전도성의 존재 여부를 재검증하고자 합니다.", "result": "터널링 분광법(STS)을 통해 특정 조건에서 두 개의 초전도 갭 구조를 명확히 관측했습니다.", "implication": "초박막 영역에서도 벌크와 유사하거나 복합적인 초전도 매커니즘이 살아있음을 시사하며, 이는 TMDC 기반 초전도 연구에 중요한 단서를 제공합니다.", "novelty": "전통적인 단일 갭 해석에서 벗어나 다중 밴드 기여를 명확히 분리해냈다는 점에서 해당 분야의 해석 패러다임을 바꿀 수 있습니다.", "unresolved": "두 밴드가 어떠한 상호작용을 통해 결합하는지(혹은 독립적인지), 층수 변화에 따른 정량적 전이 과정은 여전히 논의가 필요합니다.", "future_work": "다양한 층수와 정렬(stacking) 방식에 따른 초전도 갭의 변화를 정량적으로 비교 분석하는 연구.", "concepts": [{"term": "2-밴드 초전도성", "why_emerged": "페르미 면에 존재하는 여러 밴드가 각각 독립적으로 또는 결합하여 초전도 현상을 일으키는 것을 설명하기 위해 필요.", "origin": "MgB2 등의 발견 이후 널리 확립.", "connections": "다중 밴드 모델, 초전도 갭, BCS 이론."}, {"term": "전이금속 디칼코게나이드 (TMDC)", "why_emerged": "강한 2D 특성과 다양한 전자적 상전이(CDW, 초전도 등)를 가지는 물질군으로, 차세대 소재 연구의 보고.", "origin": "1960년대 초반 층상 구조 물질로 연구 시작.", "connections": "NbSe2, TaS2, 2D 재료, 전하 밀도 파(CDW)."}], "english_summary": ["Examines multiband superconductivity in few-layer NbSe2 and TaS2.", "Demonstrates evidence of two-band superconducting gaps using tunneling spectroscopy.", "Challenges previous single-gap interpretations in ultrathin TMDCs.", "Deepens understanding of superconductivity in 2D transition metal dichalcogenides."]}}, {"title": "Orbital magnetoresistance in the antiferromagnet CoO driven by dynamic orbital angular momentum", "journal": "Science", "source": "Gemini", "link": "https://doi.org/10.1126/science.adw1808", "authors": "Christin Schmitt, Sachin Krishnia, Mahmoud Zeer, et al.", "last_authors": "Yuriy Mokrousov, Mathias Kläui", "summary": "Recent predictions of orders of magnitude larger orbital current effects compared with spin currents have attracted considerable interest. However, orbital currents must first be converted into spin currents to interact with the static magnetization dominated by spin angular momentum in conventional magnets. By using a magnet dominated by orbital angular momentum (OAM), we demonstrate a 70-fold enhancement in orbital Hall magnetoresistance in cobalt II oxide/copper (CoO/Cu*), compared with spin Hall magnetoresistance in cobalt II oxide/platinum (CoO/Pt). This arises from interactions between dynamic OAM from surface-oxidized Cu* and static OAM in the antiferromagnetic insulator CoO. Our results show how by using OAM-dominated materials, we can harness the benefits of giant orbital currents that have not been possible using conventional spin-dominated magnets.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Explores orbital angular momentum and orbital Hall effects in an antiferromagnet; highly relevant to magnetism and transport.", "tags": ["material", "CoO", "topic", "antiferromagnetism", "orbital-currents"], "image": "", "briefing": {"background": "스핀 전류(spin current) 기반의 기존 스핀트로닉스는 효율성 제약이 존재합니다. 최근 이를 극복하고자 스핀 각운동량보다 수십 배 큰 궤도 각운동량(OAM)을 활용한 '오비트로닉스(Orbitronics)'가 차세대 정보 처리 기술로 주목받고 있습니다.", "motivation": "기존의 스핀-궤도 토크 기반 장치는 궤도 전류를 다시 스핀 전류로 변환해야 하는 비효율이 있습니다. 본 연구는 궤도 각운동량이 지배적인 반강자성체(CoO)를 직접 활용하여 이러한 변환 과정을 생략하고 궤도 전류의 이점을 극대화하고자 했습니다.", "result": "산화된 구리 표면에서 생성된 동적 궤도 각운동량과 반강자성체 CoO의 정적 궤도 각운동량 간의 상호작용을 통해, CoO/Pt(스핀 기반) 대비 CoO/Cu*(궤도 기반) 구조에서 70배 향상된 궤도 홀 자기저항을 구현했습니다.", "implication": "궤도 각운동량 지배 물질을 사용함으로써 스핀 변환 없이도 거대한 궤도 전류를 활용할 수 있음을 증명했습니다. 이는 차세대 저전력 자기 메모리 및 오비트로닉 소자 개발의 새로운 설계 원리를 제시합니다.", "novelty": "스핀-궤도 상호작용을 이용한 기존 방식에서 벗어나, 궤도 각운동량 자체를 직접 운반체로 활용했다는 점이 혁신적입니다. 본 연구의 자성체 기반 수송 현상 탐구는 자기적 위상 물질의 물성 연구와도 맥을 같이 합니다.", "unresolved": "CoO 표면 산화층(Cu*)에서 생성되는 동적 궤도 각운동량의 정확한 미시적 메커니즘과, 다양한 다른 물질 시스템으로의 범용성 확인이 필요합니다.", "future_work": "실제 상온 작동이 가능한 오비트로닉 논리 소자 구현 및 다양한 궤도 활성 물질 탐색이 이어질 것으로 예상됩니다.", "concepts": [{"term": "궤도 홀 효과(Orbital Hall Effect)", "why_emerged": "스핀 홀 효과와 유사하게 궤도 각운동량이 이동하는 현상으로, 스핀 전류보다 큰 신호 생성 가능성 때문에 등장함.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "스핀 홀 효과(SHE), 궤도-스핀 변환, 스핀트로닉스"}, {"term": "반강자성체(Antiferromagnet)", "why_emerged": "외부 자기장에 무감각하고 빠른 동역학을 가져 고속 정보 처리에 유리 "transport", "topology"], "image": "", "briefing": {"background": "다밴드(multiband) 반금속에서 자기저항의 각도 의존성은 페르미 표면 구조와 캐리어 불균형을 분석하는 핵심 도구입니다. 기존의 홀 효과 측정은 주로 수직 자기장에서 수행되지만, 회전 자기장에서의 이방성 연구는 위상적 반금속의 전자 구조를 이해하는 데 중요합니다.", "motivation": "WTe2와 같은 전이금속 디칼코게나이드(TMD) 반금속에서 각도 분해 자기수송 측정을 통해 다밴드 시스템의 캐리어 불균형을 정량적으로 특징짓고자 함.", "result": "기존 cosθ 형태의 홀 응답 위에 3회 대칭(threefold) 변조가 겹쳐진 새로운 신호를 WTe2에서 관측함.", "implication": "자기수송 각도 고조파(angular harmonics)가 복잡한 다밴드 반금속의 페르미 면 내 캐리어 불균형을 직접적으로 반영하는 지표로 활용될 수 있음을 시사함.", "novelty": "반금속의 수송 현상에서 고차 각도 응답을 분리해냄으로써, ARPES와 같은 직접적인 전자 구조 탐색 없이도 위상적 반금속의 캐리어 특성을 추출할 수 있는 보완적 방법론 제시.", "unresolved": "관측된 3회 대칭 변조가 결정 구조적 기원인지, 특정 위상적 밴드 접합의 징후인지에 대한 미세한 원인 분석은 추가 연구가 필요함.", "future_work": "다른 위상적 반금속 물질로의 적용 및 고차 고조파가 베리 곡률(Berry curvature) 분포와 갖는 정량적 관계 규명.", "concepts": [{"term": "Angular Hall response", "why_emerged": "다밴드 시스템의 전자 구조 비등방성을 자기장에서 회전시키며 분리해내기 위해 필요함.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "Shubnikov-de Haas 효과, 비등방 자기저항(AMR)."}, {"term": "Multiband semimetal", "why_emerged": "전자와 정공 밴드가 페르미 레벨 근처에서 공존하여 수송 현상을 복잡하게 만드는 시스템을 설명하기 위해 사용.", "origin": "일반적인 고체물리학 이론에서 유래.", "connections": "Weyl semimetals, Dirac semimetals."}], "english_summary": ["The paper investigates angular dependence of magnetotransport in the multiband semimetal WTe2.", "A threefold modulation is observed in the Hall response, superposed on the conventional cos(theta) background.", "This harmonic analysis provides a direct probe for carrier imbalance in complex Fermi surfaces.", "The results demonstrate that angular magnetotransport can serve as a sensitive tool for semimetal characterization."]}}, {"title": "Low-temperature spin dynamics and absence of magnetic order in layered α−RuI3", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/kxbj-gp8z", "authors": "Hank C. H. Wu, Benjamin M. Huddart, Francis L. Pratt, Danrui Ni, Robert J. Cava, Stephen J. Blundell", "last_authors": "Robert J. Cava, Stephen J. Blundell", "summary": "Quantum spin liquids are long-sought for their elusive, never-frozen magnetic states. In layered α -RuI 3 , magnetic Ru ions form a honeycomb network related to the Kitaev material α -RuCl 3 , yet muon spin relaxation reveals a strikingly different low-temperature behaviour. The authors show here that the spins remain dynamically fluctuating down to 50 mK and find evidence for 2D spin diffusion, supporting the view that α -RuI 3 is a promising candidate for hosting a quantum spin liquid state.", "tier": "B_IMPORTANT_CONDMAT", "score": "7", "reason": "Interesting quantum magnet study on honeycomb lattice material related to known spin liquid candidates.", "tags": ["quantum-magnet", "spin-liquid", "material"], "image": "", "briefing": {"background": "양자 스핀 액체(QSL)는 극저온에서도 자기적 무질서가 유지되는 상태로, 기하학적 좌절(frustration)이 있는 격자에서 주로 탐구됩니다. 특히 RuCl3와 같은 허니컴 격자 시스템은 Kitaev 모델과 관련되어 큰 관심을 받고 있습니다.", "motivation": "α-RuI3가 α-RuCl3와 유사한 허니컴 구조를 가짐에도 불구하고, 실제로 양자 스핀 액체 거동을 보이는지 확인하기 위함.", "result": "뮤온 스핀 완화(μSR) 측정 결과 50 mK까지 자기적 동결이 발생하지 않으며, 2차원 스핀 확산 거동을 확인함.", "implication": "α-RuI3가 양자 스핀 액체 상태를 연구하기 위한 또 다른 후보 물질임을 시사하며, 자기적 상호작용의 근본적인 차이를 규명할 근거를 제공함.", "novelty": "α-RuCl3의 강력한 경쟁 물질로서, 자기적 무질서 상태가 극저온까지 안정적으로 유지됨을 실험적으로 입증함.", "unresolved": "실제 양자 스핀 액체의 들뜸(fractionalized excitations)에 대한 직접적인 증거(예: 비열의 선형항, 비탄성 중성자 산란 등)는 추가 확인이 필요함.", "future_work": "비탄성 중성자 산란 및 더 높은 자기장 하에서의 열전도도 측정을 통한 스핀 액체 상태의 확증.", "concepts": [{"term": "Quantum spin liquid", "why_emerged": "강한 자기적 좌절로 인해 절대영도에서도 자기 질서가 형성되지 않는 상태를 기술하기 위해 필요함.", "origin": "Anderson (1973).", "connections": "Kitaev honeycomb model, fractionalization."}, {"term": "Muon spin relaxation (μSR)", "why_emerged": "매우 약한 자기장 변동을 감지하여 자기적 동결 여부를 확인하는 극도로 민감한 탐침이 필요했음.", "origin": "1970년대 이후 응집물질물리학에 도입.", "connections": "Magnetic susceptibility, neutron scattering."}], "english_summary": ["The study examines low-temperature magnetic properties of layered alpha-RuI3 using muon spin relaxation.", "No magnetic ordering is found down to 50 mK, indicating dynamic spin fluctuations.", "Evidence for 2D spin diffusion supports the candidacy of alpha-RuI3 as a quantum spin liquid.", "The findings suggest a contrast in spin dynamics between RuI3 and the Kitaev material RuCl3."]}}, {"title": "Magnetic lock-in transition and competing interactions in EuAuBi", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/dp5g-fbpc", "authors": "S. H. Moody, C. Ritter, H. Takahashi, S. Ishiwata, J. S. White", "last_authors": "S. Ishiwata, J. S. White", "summary": "The zero-field magnetic ground state of the superconducting polar semimetal EuAuBi is determined using neutron powder diffraction. The system realizes a commensurate antiferromagnetic ground state of wave vector k = ( 1 / 3 , 0 , 0 ) with moments along the crystallographic b axis and unequal moment amplitudes between the two magnetically inequivalent Eu orbits. On warming above an intermediate transition temperature, T N 2 ≈ 3.3 K , a commensurate-incommensurate transition occurs with k ( T ) = [ 1 / 3 − δ ( T ) , 0 , 0 ] , preserving the moment direction and occurring only within a narrow temperature window below the incommensurate-paramagnetic transition at T N 1 ≈ 4 K . A minimal isotropic exchange toy model including interactions up to third-nearest neighbors suggests the presence of competing interactions. Together, these results provide a foundation for future studies of materials hosting an interplay between magnetism, superconductivity, and electric polarity.", "tier": "B_IMPORTANT_CONDMAT", "score": "7", "reason": "Neutron study of magnetic order in a polar semimetal.", "tags": ["neutron-scattering", "magnetism", "semimetal"], "image": "", "briefing": {"background": "극성(polar) 금속이나 반금속은 구조적 비대칭성으로 인해 밴드 구조와 자기적 정렬 사이의 독특한 상호작용이 발생합니다. Eu 기반 화합물은 국부적인 모멘트와 전도성 전자 간의 강한 상호작용을 연구하기 좋은 플랫폼입니다.", "motivation": "초전도성을 띠는 극성 반금속 EuAuBi에서 자기적 정렬 구조와 상전이 메커니즘을 명확히 규명하기 위함.", "result": "중성자 회절을 통해 k=(1/3, 0, 0)인 정합(commensurate) 반강자성 상태를 확인했으며, 특정 온도에서 불정합(incommensurate) 상태로의 전이를 발견함.", "implication": "자기적 질서가 미세한 교환 상호작용 경쟁에 의해 민감하게 결정됨을 보였으며, 이는 극성 구조와 자기 질서의 상관관계를 이해하는 단초를 제공함.", "novelty": "상대적으로 드문 극성 반금속 계열에서 자기적 상전이의 상세 경로를 중성자 회절로 직접 추적함.", "unresolved": "이러한 자기적 구조가 어떻게 초전도성과 공존하는지, 혹은 경쟁하는지에 대한 미세 역학은 미해결 과제임.", "future_work": "고압 또는 변형률 제어를 통한 자기 정렬과 초전도 상태의 상호작용 관측.", "concepts": [{"term": "Commensurate-incommensurate transition", "why_emerged": "자기 주기성이 격자 상수와 정수비로 나뉘지 않는 상태로 변하는 현상을 기술하기 위해 필요함.", "origin": "1960년대 자기 구조 연구 중 정립.", "connections": "Spin-density wave (SDW), nesting."}, {"term": "Polar semimetal", "why_emerged": "반전 대칭성이 깨진 금속 시스템에서 나타나는 비자명한 밴드 토폴로지 연구를 위해 필요함.", "origin": "최근 위상 물질 연구의 확장.", "connections": "Weyl semimetals, Rashba effect."}], "english_summary": ["Neutron powder diffraction is used to resolve the magnetic ground state of the polar semimetal EuAuBi.", "The system shows a commensurate antiferromagnetic order at low temperatures.", "A temperature-driven transition to an incommensurate state occurs below 4 K.", "Competing exchange interactions are proposed to explain the complex magnetic phase diagram."]}}, {"title": "Magnetic skyrmion lattice disclinations in pentagon- and heptagon-shaped FeGe nanostructures", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/nwd2-1hk9", "authors": "Thibaud Denneulin, Nikolai S. Kiselev, Vladyslav M. Kuchkin, and Rafal E. Dunin-Borkowski", "last_authors": "Thibaud Denneulin, Nikolai S. Kiselev, Vladyslav M. Kuchkin, and Rafal E. Dunin-Borkowski", "summary": "Magnetic skyrmions typically form hexagonal lattices in chiral magnets, where translational defects such as dislocations are well known but angular defects remain largely unexplored. Here, the authors stabilize fivefold and sevenfold skyrmion lattice disclinations in pentagon- and heptagon-shaped FeGe nanostructures fabricated by focused ion beam milling. Lorentz transmission electron microscopy and electron holography reveal their magnetic and elastic structure. Supported by micromagnetic simulations, the results show how geometric confinement engineers defects in skyrmion lattices.", "tier": "B_IMPORTANT_CONDMAT", "score": "7", "reason": "Experimental investigation of magnetic textures in the topological magnet FeGe.", "tags": ["experiment", "skyrmions", "FeGe"], "image": "", "briefing": {"background": "카이랄 자성체에서 나타나는 자기 스카이머(skyrmion)는 위상학적으로 보호되는 소용돌이 모양의 스핀 구조입니다. 주로 육각형 격자를 이루며, 격자 결함(전위 등)에 대한 연구는 많았으나 기하학적 구속을 통한 각도 결함(disclinations) 제어는 미개척 분야였습니다.", "motivation": "나노 구조체의 기하학적 형상을 이용해 스카이머 격자 내에 5각형 및 7각형과 같은 위상학적 결함을 인위적으로 배치하고 그 구조적 특성을 규명하고자 했습니다.", "result": "FeGe 나노 구조체에서 집속 이온빔(FIB)을 사용해 5각형 및 7각형 스카이머 격자 결함을 성공적으로 안정화했습니다. 로렌츠 투과 전자 현미경과 전자 홀로그래피를 통해 이들의 자기적, 탄성적 구조를 직접 관찰했습니다.", "implication": "기하학적 구속(geometric confinement)을 통해 자기 위상 구조체를 정밀하게 엔지니어링할 수 있음을 입증했습니다.", "novelty": "스카이머 격자에서 각도 결함(disclinations)을 실험적으로 안정화하고 시각화했다는 점이 독보적입니다. topological magnetic texture 연구의 연장선에서 위상 제어 능력을 한 단계 높였습니다.", "unresolved": "이러한 인위적 결함이 거시적인 수송 현상(예: 위상학적 홀 효과)에 미치는 구체적인 영향은 확인되지 않았습니다.", "future_work": "스카이머 격자 내 결함의 동역학 연구 및 이를 활용한 논리 소자 응용 가능성 평가.", "concepts": [{"term": "Magnetic Skyrmion", "why_emerged": "강한 스핀-궤도 결합을 가진 계에서 에너지를 낮추기 위해 나타나는 비자명한 위상 구조가 필요함", "origin": "Tony Skyrme이 입자 물리학에서 제안, 자성체에서는 Bogdanov와 Yablonskii가 1989년 이론적 제시", "connections": "Topological Hall effect, Chiral magnets, Spin-transfer torque"}, {"term": "Lorentz TEM", "why_emerged": "나노 스케일의 자기 도메인 구조를 직접 관찰하기 위한 고분해능 기술 필요", "origin": "전자 현미경 발달과 함께 자성체 연구에 응용되어 정착", "connections": "Electron holography, DPC(Differential Phase Contrast)"}], "english_summary": ["Stabilized fivefold and sevenfold skyrmion lattice disclinations in FeGe nanostructures.", "Used focused ion beam milling to impose geometric confinement on the magnetic lattice.", "Visualized the magnetic and elastic structure via Lorentz TEM and electron holography.", "Demonstrates precise geometric engineering of topological defects in chiral magnets."]}}, {"title": "Microscopic NMR evidence for successive antiferroelectric and antiferromagnetic order in the van der Waals magnet CuCrP2S6", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/ggvw-rh72", "authors": "C. S. Saramgi, L. F. Prager, S. Selter, Y. Shemerliuk, S. Aswartham, B. Büchner, H.-J. Grafe, and K. M. Ranjith", "last_authors": "S. Aswartham, B. Büchner, H.-J. Grafe, and K. M. Ranjith", "summary": "The layered van der Waals magnet CuCrP 2 S 6 hosts a sequence of ordering phenomena. Here, the authors use nuclear magnetic resonance to provide direct microscopic fingerprints of its successive phase transitions, revealing the emergence of a quasi-antiferroelectric state, long-range antiferroelectric order, and antiferromagnetic order upon cooling. The results uncover the microscopic signatures of successive electric and magnetic ordering transitions in a van der Waals material and provide insight into the interplay between electric and magnetic order in layered quantum materials.", "tier": "B_IMPORTANT_CONDMAT", "score": "7", "reason": "Comprehensive study of successive ordering in a vdW quantum material.", "tags": ["vanderWaals", "magnetism", "NMR"], "image": "", "briefing": {"background": "반데르발스(vdW) 자성체는 2차원 층상 구조와 강력한 스핀-격자-전하 결합으로 인해 새로운 다강체(multiferroics) 및 양자 현상을 탐구하는 플랫폼으로 각광받고 있습니다.", "motivation": "CuCrP2S6가 나타내는 복잡한 상전이 과정을 미시적 수준에서 규명하고, 전기적/자기적 질서 사이의 상호작용을 이해하고자 했습니다.", "result": "NMR(핵자기공명)을 통해 냉각 과정에서 준-반강유전 상태(quasi-antiferroelectric), 장거리 반강유전 질서, 그리고 반강자성 질서로 이어지는 순차적 상전이 과정을 미시적 지표로 입증했습니다.", "implication": "vdW 소재에서 전기적 질서와 자기적 질서가 어떻게 공존하고 경쟁하는지를 보여주는 중요한 사례가 됩니다.", "novelty": "거시적 측정치뿐만 아니라 NMR이라는 로컬 프로브를 활용해 다단계 질서 형성 과정을 명확히 분리해냈습니다.", "unresolved": "이 순차적 질서의 핵심적인 원동력인 스핀-전하 결합의 상세한 물리적 메커니즘은 여전히 미완의 과제입니다.", "future_work": "전기장 또는 자기장 인가에 따른 이 상전이들의 변조 가능성 연구.", "concepts": [{"term": "Van der Waals Magnet", "why_emerged": "2D 극한까지 자성을 유지하는 소재의 필요성과 소자 응용 가능성", "origin": "CrI3, Cr2Ge2Te6 등의 발견으로 2017년 전후 본격화", "connections": "2D magnetism, Spintronics, Layered materials"}, {"term": "NMR (Nuclear Magnetic Resonance)", "why_emerged": "국소 자기장의 미세한 변화를 감지하여 자기적 상태를 분석하기 위함", "origin": "Bloch와 Purcell이 1946년 발견", "connections": "Hyperfine coupling, Spin-lattice relaxation, Local magnetism"}], "english_summary": ["Investigated phase transitions in vdW magnet CuCrP2S6 using NMR spectroscopy.", "Revealed successive ordering from quasi-antiferroelectric to antiferromagnetic states.", "Provides microscopic evidence of the interplay between electric and magnetic orders.", "Highlights the potential of vdW materials for multi-ordered quantum phenomena."]}}, {"title": "Noncollinear spin order, field-induced transitions, and short-range correlations in Cu4SO4(OH)6", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/l362-1h1r", "authors": "Oleksandr Prokhnenko, Koji Kaneko, Chihiro Tabata, et al.", "last_authors": "Lawrence M. Anovitz, Andrey Podlesnyak", "summary": "We report a comprehensive study of spin- 1 2 quantum magnet brochantite, Cu 4 SO 4 ( OH ) 6 , combining high-field thermodynamic measurements, polarized neutron diffraction, inelastic neutron scattering, and nuclear magnetic resonance spectroscopy. Using bulk magnetization and specific heat measurements we construct the magnetic H − T phase diagram for magnetic fields applied along main crystallographic directions up to 24.1 T. Polarized neutron diffraction reveals a noncollinear magnetic ground state confined to the a b plane. A field-induced transition is observed for magnetic fields in the a b plane whose critical field and character evolve continuously with field direction in the a b plane. While the transition for H ∥ b might be a spin-flop-like transition, the one for H ∥ a resembles the short-range correlated state above T N , suggesting a magnetic configuration related to the quasi-two-dimensional correlations in the   badges.className = 'badges';
  if (r.score) badges.appendChild(textEl('span', 'badge score', `${r.score}/10`));
  if (r.tier) badges.appendChild(textEl('span', 'badge', r.tier));
  if (r.journal) badges.appendChild(textEl('span', 'badge', r.journal));
  if (r.source) badges.appendChild(textEl('span', 'badge', r.source));
  headText.appendChild(badges);
  const title = document.createElement('h1');
  if (r.link) { const titleLink = document.createElement('a'); titleLink.href = r.link; titleLink.target = '_blank'; titleLink.rel = 'noopener noreferrer'; titleLink.textContent = r.title || ''; title.appendChild(titleLink); }
  else { title.textContent = r.title || ''; }
  headText.appendChild(title);
  headText.appendChild(textEl('p', 'meta', [r.journal, r.source].filter(Boolean).join(' | ')));
  if (r.last_authors || r.authors) { const authors = document.createElement('p'); authors.className = 'authors'; if (r.last_authors) authors.append('Last authors: ' + r.last_authors); if (r.authors) authors.append((r.last_authors ? ' | ' : '') + 'Authors: ' + r.authors); headText.appendChild(authors); }
  appendLabeledText(headText, 'why', 'Filter reason: ', r.reason);
  if (r.tags && r.tags.length) { const tags = document.createElement('div'); tags.className = 'tags'; r.tags.forEach(tag => tags.appendChild(textEl('span', 'tag', '#' + tag))); headText.appendChild(tags); }
  if (r.link) { const link = document.createElement('a'); link.className = 'link'; link.href = r.link; link.target = '_blank'; link.rel = 'noopener noreferrer'; link.textContent = 'Open paper'; headText.appendChild(link); }
  head.appendChild(headText);
  if (r.summary) { const abstract = document.createElement('p'); abstract.className = 'original-abstract'; const strong = textEl('strong', '', 'Original abstract'); abstract.appendChild(strong); abstract.append(r.summary); head.appendChild(abstract); }
  slideEl.appendChild(head);
  const briefing = document.createElement('div');
  briefing.className = 'briefing';
  appendBriefSection(briefing, 'Background', b.background);
  appendBriefSection(briefing, 'Motivation', b.motivation);
  appendBriefSection(briefing, 'Result', b.result);
  appendBriefSection(briefing, 'Implication', b.implication);
  appendBriefSection(briefing, "Why it's important / Novelty", b.novelty);
  appendBriefSection(briefing, 'Unresolved Questions', b.unresolved);
  appendBriefSection(briefing, 'Expected Future Work', b.future_work);
  if (b.concepts && b.concepts.length) {
    const section = document.createElement('section');
    section.className = 'brief-section wide';
    section.appendChild(textEl('h2', '', 'Concepts / Terms'));
    const concepts = document.createElement('div');
    concepts.className = 'concepts';
    b.concepts.forEach(c => {
      const item = document.createElement('div');
      item.className = 'concept';
      item.appendChild(textEl('h3', '', c.term || 'Concept'));
      [['왜 생겼나: ', c.why_emerged], ['누가 만들었나: ', c.origin], ['연결되는 흐름: ', c.connections]].forEach(([label, text]) => { if (!text) return; const p = document.createElement('p'); const bold = textEl('b', '', label); p.appendChild(bold); p.append(text); item.appendChild(p); });
      concepts.appendChild(item);
    });
    section.appendChild(concepts);
    briefing.appendChild(section);
  }
  if (b.english_summary && b.english_summary.length) { const section = document.createElement('section'); section.className = 'brief-section wide'; section.appendChild(textEl('h2', '', 'English Summary')); const ul = document.createElement('ul'); b.english_summary.slice(0, 5).forEach(line => ul.appendChild(textEl('li', '', line))); section.appendChild(ul); briefing.appendChild(section); }
  slideEl.appendChild(briefing);
  counterEl.textContent = `${index + 1} / ${slides.length}`;
  prevBtn.disabled = index === 0;
  nextBtn.disabled = index === slides.length - 1;
}
prevBtn.addEventListener('click', () => { index = Math.max(0, index - 1); render(); });
nextBtn.addEventListener('click', () => { index = Math.min(slides.length - 1, index + 1); render(); });
document.addEventListener('keydown', event => { if (event.key === 'ArrowLeft') prevBtn.click(); if (event.key === 'ArrowRight') nextBtn.click(); });
render();
</script>
</body>
</html>
