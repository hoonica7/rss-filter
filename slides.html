<title>Daily Paper Slideshow</title>
<style>
  :root {
    color-scheme: light;
    --bg: #f6f7f4;
    --paper: #ffffff;
    --ink: #111827;
    --muted: #64748b;
    --line: #d8ddd2;
    --accent: #176b87;
    --accent-2: #9a3412;
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; overflow: auto; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: var(--bg); color: var(--ink); }
  .shell { max-width: 1500px; min-height: 100vh; margin: 0 auto; padding: 14px 18px; display: flex; flex-direction: column; }
  .topbar { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 16px; }
  .top-actions { display: flex; align-items: center; gap: 10px; }
  .topbar a, button { border: 1px solid var(--line); border-radius: 8px; background: var(--paper); color: var(--ink); padding: 10px 14px; font-weight: 700; text-decoration: none; cursor: pointer; }
  button.primary { background: var(--accent); border-color: var(--accent); color: white; }
  button:disabled { opacity: 0.45; cursor: not-allowed; }
  .counter { color: var(--muted); font-weight: 700; }
  .slide { min-height: calc(100vh - 82px); background: var(--paper); border: 1px solid var(--line); border-radius: 10px; padding: 18px; box-shadow: 0 18px 42px rgba(15, 23, 42, 0.10); display: grid; grid-template-columns: minmax(310px, 0.86fr) minmax(0, 1.55fr); gap: 18px; overflow: visible; }
  .paper-head { min-width: 0; min-height: 0; overflow: visible; display: flex; flex-direction: column; gap: 12px; }
  .figure { margin: 0; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: #f8fafc; }
  .figure img { display: block; width: 100%; max-height: 41vh; object-fit: contain; background: white; }
  .figure figcaption { padding: 7px 10px; color: var(--muted); font-size: 12px; line-height: 1.3; }
  .head-text { display: flex; flex-direction: column; gap: 9px; min-width: 0; }
  .badges { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .badge { border-radius: 999px; padding: 5px 9px; background: #eef2ff; color: #3730a3; font-size: 12px; font-weight: 800; }
  .score { background: #fee2e2; color: #991b1b; }
  h1 { margin: 0; font-size: 25px; line-height: 1.15; letter-spacing: 0; overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
  h1 a { color: inherit; text-decoration-color: rgba(23, 107, 135, 0.35); text-decoration-thickness: 2px; text-underline-offset: 4px; }
  h1 a:hover { color: var(--accent); text-decoration-color: var(--accent); }
  .meta, .authors, .why, .abstract { font-size: 13px; line-height: 1.45; }
  .meta, .authors { color: var(--muted); }
  .why strong, .abstract strong, .authors strong { color: var(--ink); }
  .authors { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .why { border-left: 4px solid var(--accent-2); padding-left: 10px; color: #374151; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .abstract { border-top: 1px solid var(--line); padding-top: 14px; color: #374151; }
  .original-abstract { border-top: 1px solid var(--line); padding-top: 10px; color: #374151; font-size: 11.5px; line-height: 1.35; overflow-wrap: anywhere; }
  .original-abstract strong { display: block; margin-bottom: 4px; color: var(--ink); }
  .tags { display: flex; flex-wrap: wrap; gap: 8px; }
  .tag { border-radius: 999px; padding: 4px 8px; background: #f1f5f9; color: #475569; font-size: 12px; font-weight: 700; }
  .head-text > .link { display: none; }
  .briefing { min-width: 0; min-height: 0; overflow: visible; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); grid-auto-rows: minmax(0, auto); align-content: start; gap: 11px 18px; border-top: 0; padding-top: 0; }
  .brief-section { min-width: 0; }
  .brief-section.wide { grid-column: 1 / -1; }
  .brief-section h2 { margin: 0 0 4px; font-size: 14px; line-height: 1.22; color: #0f766e; letter-spacing: 0; }
  .brief-section p, .brief-section li { margin: 0; font-size: 12.5px; line-height: 1.42; color: #1f2937; overflow-wrap: anywhere; }
  .brief-section ul { margin: 0; padding-left: 20px; }
  .concepts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 9px 14px; }
  .concept { border-top: 1px solid var(--line); padding-top: 7px; }
  .concept h3 { margin: 0 0 4px; font-size: 13px; color: #7c2d12; letter-spacing: 0; }
  .concept p { margin: 2px 0 0; font-size: 11.5px; line-height: 1.35; color: #374151; overflow-wrap: anywhere; }
  .concept b { color: #111827; }
  .link { color: var(--accent); font-weight: 800; text-decoration: none; }
  .empty { padding: 48px; background: var(--paper); border: 1px solid var(--line); border-radius: 12px; color: var(--muted); }
  @media (max-width: 860px) {
    .shell { padding: 14px; }
    .topbar, .top-actions { align-items: stretch; flex-direction: column; }
    .slide, .briefing, .concepts { grid-template-columns: 1fr; }
    .slide { min-height: auto; overflow: visible; display: grid; }
    h1 { font-size: 28px; }
  }
</style>

<script>
const slides = [{"title": "Cooperative concurrence of 4f and 3d flat bands in the kagome heavy-fermion metal YbCr6Ge6", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/zdzj-bln9", "authors": "Wenxin Lv (吕文欣), Pengcheng Ma (马鹏程), Tianqi Wang (王天琦), et al.", "last_authors": "Zhonghao Liu (刘中灏), Hechang Lei (雷和畅)", "summary": "Flat-band (FB) systems originating from special lattice geometry like in kagome metals as well as localized orbitals in materials such as heavy-fermion (HF) compounds have attracted intensive interest due to their band topology and strong electron correlation effects, leading to emergent quantum sta…", "tier": "A_MUST_READ", "score": "10", "reason": "Direct hit: Kagome metal featuring flat bands and strong correlations; highly relevant to user's core projects.", "tags": ["kagome", "flatband", "heavyfermion", "electronicstructure"], "image": "", "briefing": {"background": "kagome 격자의 기하학적 구조에서 기인하는 플랫 밴드(Flat-band)와 중성 페르미온(Heavy-fermion) 시스템의 국부 궤도에 의한 전자 상관관계는 현대 응집물리에서 양자 상태를 제어하는 핵심 요소입니다.", "motivation": "기하학적 플랫 밴드(3d)와 상관관계 기반 플랫 밴드(4f)가 한 물질 내에서 공존하고 상호작용할 때 나타나는 새로운 물리 현상을 YbCr6Ge6 시스템을 통해 탐구하고자 합니다.", "result": "YbCr6Ge6 물질에서 Cr의 kagome 격자가 형성하는 3d 플랫 밴드와 Yb의 4f 전자층이 형성하는 플랫 밴드가 페르미 준위 근처에서 동시에 존재(cooperative concurrence)함을 확인하였습니다.", "implication": "이 연구 결과는 kagome 격자의 위상적 특성과 중성 페르미온의 강한 상관관계를 결합하여 새로운 형태의 양자 질서를 설계할 수 있는 물질 플랫폼을 제시합니다.", "novelty": "서로 다른 기원을 가진 두 종류의 플랫 밴드가 협력적으로 공존하는 사례를 kagome 금속에서 발견한 것이며, 이는 사용자의 주된 관심사인 kagome 시스템의 전자 구조 연구와 직결됩니다.", "unresolved": "3d 및 4f 플랫 밴드 사이의 구체적인 혼성(hybridization) 강도와 그것이 거시적인 수송 특성에 미치는 정량적인 영향은 아직 명확하지 않습니다.", "future_work": "ARPES를 이용한 플랫 밴드의 직접 관측과 저온 물성 측정을 통해 Kondo 물리 및 위상 현상의 상관관계를 규명할 필요가 있습니다.", "concepts": [{"term": "Kagome Flat Band", "why_emerged": "격자의 기하학적 구조 내에서 파동 함수의 상쇄 간섭을 통해 전자 전송을 억제하고 에너지 대역을 평평하게 만들기 위해 도입되었습니다.", "origin": "초록 정보만으로는 특정하기 어려우나 kagome 격자 모델 이론에서 유래함", "connections": "Frustrated magnetism, Topology, Strong correlation"}, {"term": "Heavy Fermion", "why_emerged": "f-전자와 전도 전자 사이의 강한 상관관계로 인해 유효 질량이 매우 무거워지는 현상을 설명하기 위해 제안되었습니다.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "Kondo effect, f-block elements, Unconventional superconductivity"}, {"term": "3d-4f Coexistence", "why_emerged": "전이 금속의 3d 전자와 희토류의 4f 전자가 가진 장점을 결합하여 더 복잡한 양자 상태를 유도하기 위해 연구됩니다.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "Kondo lattice, Magnetic ordering"}, {"term": "Strong Correlation", "why_emerged": "전자 간의 쿨롱 상호작용이 너무 강해 단일 입자 근사가 불가능한 시스템을 설명하기 위해 필수적입니다.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "Mott insulator, High-Tc superconductivity"}], "english_summary": ["Discovered simultaneous occurrence of 3d and 4f flat bands in YbCr6Ge6.", "Explores the synergy between kagome geometry and heavy-fermion correlations.", "Identifies a unique platform for emergent quantum phases near the Fermi level.", "Highlights the cooperation of orbital and lattice-driven electronic structures."]}}, {"title": "Tuning the Fermi surface of MoTe2 by Nb doping", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/nqff-vzcg", "authors": "Andrew P. Weber, Iñigo Robredo, Philipp Rüßmann, et al.", "last_authors": "J. Enrique Ortega, Julen Ibañez-Azpiroz", "summary": "Ab initio calculations and angle-resolved photoemission experiments demonstrate that the bulk and surface electronic structure of Weyl semimetal candidate ${\\mathrm{MoTe}}_{2}$ changes significantly by tuning the chemical potential by less than 0.4 eV. Calculations indicate that several Lifshitz tra…", "tier": "A_MUST_READ", "score": "10", "reason": "Direct hit: ARPES study on a Weyl semimetal candidate exploring Fermi surface and Lifshitz transitions.", "tags": ["ARPES", "MoTe2", "Weylsemimetal", "Fermisurface"], "image": "", "briefing": {"background": "MoTe2와 같은 Weyl 준금속(Weyl semimetal)은 에너지 밴드가 교차하는 Weyl 노드를 가지며, 페르미 준위의 위치에 따라 위상적 특성이 크게 좌우됩니다.", "motivation": "Nb 도핑을 통해 MoTe2의 화학적 포텐셜을 미세하게 조정함으로써 페르미면의 진화와 위상적 전이 과정을 실험적으로 관측하고자 합니다.", "result": "0.4 eV 미만의 작은 도핑 농도 변화로도 MoTe2의 벌크 및 표면 전자 구조가 크게 변하며, 이 과정에서 다수의 Lifshitz 전이가 발생함을 ARPES와 DFT 계산으로 입증했습니다.", "implication": "도핑을 통한 화학적 포텐셜 튜닝이 Weyl 준금속의 위상 상태를 제어하는 유효한 수단임을 보여주며, 소자 응용 가능성을 시사합니다.", "novelty": "Nb 도핑에 따른 페르미면의 체계적인 변화를 ARPES로 직접 시각화하였으며, 이는 위상 준금속의 전자 구조 제어에 대한 사용자의 관심사와 부합합니다.", "unresolved": "도핑에 따른 Weyl 노드의 정확한 소멸 임계점과 그에 따른 베리 곡률(Berry curvature)의 정량적 변화는 추가 연구가 필요합니다.", "future_work": "도핑된 MoTe2의 이상 홀 효과(Anomalous Hall Effect) 측정 및 Spin-ARPES를 통한 스핀 텍스처 분석이 기대됩니다.", "concepts": [{"term": "Weyl Semimetal", "why_emerged": "상대론적 디락 방정식을 따르는 질량 없는 페르미온을 고체 내에서 구현하기 위해 등장했습니다.", "origin": "Hermann Weyl (theory), 2015년경 실측(TaAs 등)", "connections": "Topology, Berry curvature, Fermi arc"}, {"term": "Lifshitz Transition", "why_emerged": "전자계의 위상적 변화로 인해 페르미면의 연결성이 바뀌는 현상을 설명하기 위해 도입되었습니다.", "origin": "I. M. Lifshitz (1960)", "connections": "Fermi surface topology, Van Hove singularity"}, {"term": "ARPES", "why_emerged": "고체의 에너지-운동량 공간에서의 전자 구조를 직접적으로 관측하기 위해 개발되었습니다.", "origin": "Photoelectric effect 기반 발전", "connections": "Electronic structure, Fermi surface mapping"}, {"term": "Nb Doping", "why_emerged": "MoTe2의 정공(hole) 농도를 조절하여 페르미 준위를 낮추고 위상 특성을 튜닝하기 위해 선택되었습니다.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "Carrier concentration control, Chemical potential tuning"}], "english_summary": ["Demonstrated significant Fermi surface evolution in MoTe2 via Nb doping.", "Observed multiple Lifshitz transitions within a small chemical potential range (< 0.4 eV).", "Combined ARPES and DFT to map the sensitivity of Weyl semimetal candidates.", "Provides a roadmap for tuning topological electronic states through doping."]}}, {"title": "c-axis strain tuning of superconductivity and symmetric elastoresistivity in CsV3Sb5", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/l499-9f6c", "authors": "Xiaoran Yang, Yutong Li, Chunyi Li, et al.", "last_authors": "Huiqiu Yuan, Xingye Lu", "summary": "The kagome metal ${\\mathrm{CsV}}_{3}{\\mathrm{Sb}}_{5}$ hosts an intriguing interplay between charge-density-wave (CDW) order and superconductivity that is highly sensitive to lattice distortions. However, determining the specific roles of the in-plane $({A}_{1g,1})$ and out-of-plane $({A}_{1g,2})$ s…", "tier": "A_MUST_READ", "score": "10", "reason": "Direct hit on CsV3Sb5 kagome metal, CDW, and superconductivity projects.", "tags": ["material", "CsV3Sb5", "kagome", "superconductivity"], "image": "", "briefing": {"background": "Kagome 금속인 CsV3Sb5는 전하 밀도파(CDW)와 초전도성이 공존하는 흥미로운 물질로, 이들의 상호작용은 격자 변형에 매우 민감합니다.", "motivation": "면내(in-plane) 변형 외에도 c-축 방향의 변형(strain)이 초전도성과 탄성저항(elastoresistivity)에 미치는 구체적인 역할을 분리하여 이해하고자 합니다.", "result": "c-축 변형을 통해 초전도성을 튜닝할 수 있음을 확인하였으며, CDW 및 초전도 상태와 관련된 대칭적 탄성저항 성분의 변화를 정밀하게 측정하였습니다.", "implication": "CsV3Sb5의 물리적 성질이 2차원적인 kagome 평면뿐만 아니라 3차원적인 층간 결합 및 격자 구조에 강하게 의존함을 증명합니다.", "novelty": "사용자의 핵심 관심 물질인 CsV3Sb5에 대해 c-축 변형이라는 새로운 제어 변수를 사용하여 초전도-CDW 경쟁 관계를 조명했습니다.", "unresolved": "c-축 변형이 CDW의 위상(phase)이나 대칭성에 미치는 미시적인 변화 기전은 아직 완전히 밝혀지지 않았습니다.", "future_work": "c-축 변형 하에서의 고해상도 STM 또는 X-선 산란 실험을 통해 원자 단위의 구조 변화와 CDW 차원성의 상관관계를 조사할 필요가 있습니다.", "concepts": [{"term": "CsV3Sb5", "why_emerged": "Kagome 격자에서 나타나는 위상적 특성, CDW, 초전도성의 복합적인 상호작용을 연구하기 위해 최근 급부상했습니다.", "origin": "2020년 Stephen Wilson 그룹 등에서 발견", "connections": "Kagome metal, CDW, Superconductivity, AV3Sb5 family"}, {"term": "Charge Density Wave (CDW)", "why_emerged": "전자-격자 상호작용이나 페르미면 네스팅에 의해 전하 밀도가 주기적으로 변조되는 현상을 설명하기 위해 도입되었습니다.", "origin": "Peierls (theory)", "connections": "Peierls instability, Broken symmetry, Fermi surface nesting"}, {"term": "Elastoresistivity", "why_emerged": "격자 변형에 따른 전기 저항의 변화를 통해 시스템의 전하 감수성과 대칭성 붕괴를 탐지하기 위해 사용됩니다.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "Nematicity, Strain tuning, Electronic susceptibility"}, {"term": "c-axis Strain", "why_emerged": "물질의 층간 거리를 조절함으로써 수직 방향의 화학 결합과 차원성 변화가 물성에 미치는 영향을 연구하기 위해 필요합니다.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "3D coupling, Uniaxial strain, Lattice distortion"}], "english_summary": ["Investigated c-axis strain effects on superconductivity in kagome CsV3Sb5.", "Identified symmetric elastoresistivity associated with CDW and SC orders.", "Highlights the importance of 3D lattice coupling in supposedly 2D kagome systems.", "Provides new insights into the strain-tuning of competing electronic phases."]}}, {"title": "Coexisting Kondo and Weyl-like transport in kagome heavy-fermion metal, YbyCo3Ge3-xSnx", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2611.03822", "authors": "M. P. Dubbelman, R. Meduri, T. M. Kyrk, Z. Cheng, P. Maderson, D. Pizzirani, et al.", "last_authors": "M. E. Kamminga, S. Wiedmann, J. Y. Chan, M. N. Ali", "summary": "Strong electron correlations and topology offer complementary routes to controlling electrical conduction, as correlations can make electrons heavy (e.g. Kondo lattices) whereas topology can make them behave as massless particles (e.g. Dirac or Weyl systems), and having both in one material is rare. In Kondo lattice systems, Kondo hybridization between localized 4$f$ and conduction electrons strongly enhances the quasiparticle mass, where in Weyl-Kondo systems these Kondo-renormalized bands form Weyl states, and simultaneous signs of both Kondo and Weyl states in one material have not been observed in transport. Here we report signs of both in the kagome metal \\ce{Yb_yCo3Ge_{3-x}Sn_x} by combining magnetotransport, heat capacity, magnetization, angle-resolved and X-ray photoemission spectroscopy, and DFT+U calculations to reveal Yb-dependent Kondo scattering developing into lattice coherence, with extrapolated Sommerfeld coefficient of approximately 2 ~Jmol$_{\\mathrm{Yb}}^{-1}$K$^{-2}$. Transverse magnetoresistance (MR) follows single-ion Kondo scaling, whereas longitudinal transport contains an additional negative response proportional to B$^2$ and remains unsaturated up to 32 T, consistent with a chiral anomaly. These findings support a picture of Kondo and Weyl-like conduction arising from distinct electronic states without external Fermi-level tuning, suggesting a possible route to combining correlated and topological functionality in a bulk material.", "tier": "A_MUST_READ", "score": "10", "reason": "Direct experimental study using ARPES and transport on a novel kagome Weyl-Kondo system.", "tags": ["method:ARPES", "material:Yb_yCo3Ge_{3-x}Sn_x", "kagome", "Weyl"], "image": "https://arxiv.org/html/2611.03822v1/fig1.png", "briefing": {"background": "강한 전자 상관관계에 의한 Kondo 효과와 위상학적 특성인 Weyl 페르미온은 현대 응집물질 물리학의 핵심 연구 주제입니다. 특히 Kagome 격자는 기하학적 좌절(frustration)로 인해 특이한 전자 구조를 형성하기 쉬워 이 두 현상을 결합하기 위한 이상적인 플랫폼으로 여겨집니다.", "motivation": "Kondo 격자 시스템에서 무거운 준입자가 형성되면서 동시에 Weyl 반금속의 특성을 보이는 'Weyl-Kondo' 상태를 수송 측정과 전자 구조 측정을 통해 한 물질에서 명확하게 입증하는 것은 매우 드문 사례입니다. 본 연구는 YbyCo3Ge3-xSnx라는 Kagome 중페르미온 금속에서 이를 확인하고자 했습니다.", "result": "ARPES와 수송 측정을 통해 Yb 4f 전자와 전도 전자 사이의 Kondo 산란 및 lattice coherence를 확인했습니다(Sommerfeld 계수 ~2 J/mol_Yb-1 K-2). 동시에 자기장 하에서 포화되지 않는 음의 종방향 자기저항(B^2 비례)을 관측하여, Weyl 상태의 지문인 키랄 이상(chiral anomaly)의 징후를 발견했습니다.", "implication": "이 결과는 외부적인 페르미 준위 튜닝 없이도 강한 상관관계(Kondo)와 위상학적 기능성(Weyl)이 공존할 수 있음을 시사합니다. 이는 상관관계가 큰 위상 물질 설계의 새로운 경로를 제시합니다.", "novelty": "Kagome 격자 기반 물질에서 Kondo 효과에 의한 밴드 くりこみ(renormalization)와 Weyl 특성을 동시에 실험적으로 포착했다는 점이 독보적입니다. 특히 독자의 주요 관심사인 ARPES와 Kagome 금속, Weyl 물리 모두를 관통하는 주제입니다.", "unresolved": "Kondo 밴드와 Weyl 노드가 정확히 어떤 오비탈 혼성에서 기인하는지, 그리고 이들 사이의 정밀한 에너지 위치 관계가 초록 정보만으로는 명확히 드러나지 않습니다.", "future_work": "압력이나 화학적 치환을 통한 Kondo 온도 및 Weyl 점 위치 제어 연구, 그리고 비정상 홀 효과(AHE)의 정량적 분석이 뒤따를 것으로 예상됩니다.", "concepts": [{"term": "Kagome Heavy-Fermion", "why_emerged": "Kagome 격자의 기하학적 특성과 f-전자의 강한 상관관계를 결합하여 새로운 양자 상을 찾기 위해 등장함.", "origin": "초록 정보만으로는 특정하기 어려우나, 최근 Kagome 금속 연구의 확장선상에 있음.", "connections": "AV3Sb5, Ce-based heavy fermions, Kondo lattice model"}, {"term": "Chiral Anomaly", "why_emerged": "Weyl 반금속에서 좌/우성 입자 수의 보존이 깨지는 현상을 통해 위상적 특성을 증명하기 위해 필요함.", "origin": "Adler-Bell-Jackiw (1969, 고에너지 물리)", "connections": "Negative Longitudinal Magnetoresistance, Weyl Semimetals, Berry Curvature"}, {"term": "Sommerfeld Coefficient (gamma)", "why_emerged": "금속 내 전자의 유효 질량이 얼마나 커졌는지(중페르미온 특성)를 정량화하기 위해 측정함.", "origin": "Arnold Sommerfeld (1927)", "connections": "Specific heat, Effective mass, Kondo effect"}, {"term": "DFT+U", "why_emerged": "표준적인 밀도범함수이론(DFT)이 설명하지 못하는 강한 전자 상관관계를 보정하기 위해 도입됨.", "origin": "Anisimov et al. (1991)", "connections": "Strongly correlated systems, Hubbard model, DMFT"}], "english_summary": ["Evidence of coexisting Kondo effect and Weyl-like transport in the kagome heavy-fermion metal YbyCo3Ge3-xSnx.", "ARPES and transport reveal heavy quasiparticles and a chiral anomaly (negative B^2 magnetoresistance).", "Large Sommerfeld coefficient confirms strong electron correlations within the kagome lattice framework.", "A rare example of a system where correlations and topology manifest simultaneously without fine-tuning."]}}, {"title": "Tuning the Fermi surface of MoTe2 by Nb Doping (Phys. Rev. B)", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2601.05197", "authors": "Andrew P. Weber (Donostia International Physics Center, ICFO-Institut de Ciencies Fotoniques), I\\~nigo Robredo (Luxembourg Institute of Science, et al.", "last_authors": "Centro de F\\'isica de Materiales CSIC-UPV/EHU, Ikerbasque Foundation)", "summary": "Ab initio calculations and angle-resolved photoemission experiments demonstrate that the bulk and surface electronic structure of Weyl semimetal candidate MoTe2 changes significantly by tuning the chemical potential by less than 0.4 eV. Calculations indicate that several Lifshitz transitions can occur among multiple electron and hole Fermi pockets of differing orbital character. Experiments show that 18% Nb-Mo substitution reduces the occupation of bulk and (001) surface bands, effectively producing a quasi-rigid band shift of $\\simeq$ 0.2 eV. Orbital character and dimensionality of the bulk bands is examined by soft X-ray angle resolved photoemission with control of the excitation light polarization. Deposition of alkali atoms on the surface produces electron binding energy shifts consistent with increased band filling. The results indicate that multiple regimes of electronic properties can be easily accessed in this versatile, layered material.", "tier": "A_MUST_READ", "score": "10", "reason": "Direct ARPES study of the Fermi surface and Lifshitz transitions in Nb-doped MoTe2.", "tags": ["method", "material", "ARPES"], "image": "https://arxiv.org/html/2601.05197v2/Td_structure.png", "briefing": {"background": "MoTe2는 대표적인 Weyl 반금속 후보 물질로, 결정 구조와 전자 상태가 화학적 포텐셜의 변화에 매우 민감합니다. 위상적 전하나 초전도성 등 원하는 물성을 얻기 위해 페르미 면(Fermi surface)을 정밀하게 제어하는 기술이 필수적입니다.", "motivation": "Nb 도핑을 통해 MoTe2의 화학적 포텐셜을 이동시키고, 이에 따른 벌크 및 표면 전자 구조의 변화, 특히 Lifshitz 전이의 발생 여부를 ARPES와 DFT로 확인하고자 했습니다.", "result": "18% Nb 치환이 약 0.2 eV의 정공 도핑(강체 밴드 이동)을 일으키는 것을 확인했습니다. SX-ARPES와 편광 제어를 통해 벌크 밴드의 오비탈 특성과 차원을 분석했으며, 표면 알칼리 금속 증착으로 전자 도핑에 의한 밴드 이동 또한 관측했습니다.", "implication": "MoTe2 계열 물질에서 도핑을 통해 다양한 전자 구조 레지임(여러 전자/정공 포켓이 나타나는 지점 등)을 쉽게 오갈 수 있음을 보여주어, 위상 소자 응용 가능성을 높였습니다.", "novelty": "연엑스선(Soft X-ray) ARPES를 사용해 벌크 상태를 정밀하게 분리하고, 도핑을 통한 Lifshitz 전이 경로를 구체적으로 제시했다는 점이 중요합니다. 112 tellurides와 유사한 층상 구조 조절 전략을 보여줍니다.", "unresolved": "도핑된 Nb 원자가 무질서(disorder)를 유발하여 Weyl 노드의 수명(lifetime)에 미치는 영향은 추가 연구가 필요해 보입니다.", "future_work": "Nb 도핑 농도에 따른 위상 불변량 변화 측정 및 도핑된 MoTe2에서의 초전도 상전이 연구가 기대됩니다.", "concepts": [{"term": "Lifshitz Transition", "why_emerged": "외부 변수에 의해 페르미 면의 위상(연결성)이 급격히 변할 때 발생하는 전자 상전이를 설명하기 위해 도입됨.", "origin": "Ilya Lifshitz (1960)", "connections": "Fermi surface topology, Quantum oscillations, Van Hove singularity"}, {"term": "Rigid Band Shift", "why_emerged": "도핑 시 밴드 구조 자체는 변하지 않고 페르미 준위만 이동한다는 단순화된 모델로 실험 결과를 해석하기 위해 사용됨.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "Chemical doping, Gate tuning, Mott insulators"}, {"term": "Soft X-ray ARPES", "why_emerged": "자외선 ARPES보다 광전자의 탈출 깊이가 길어 벌크 전자 구조를 더 정확하게 측정하기 위해 개발됨.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "Bulk electronic structure, k_z dispersion, SX-ARPES"}, {"term": "Fermi Pocket", "why_emerged": "브릴루앙 영역 내에서 전하 운반자가 존재하는 영역을 시각화하고 그 특성(정공/전자)을 정의하기 위함.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "Quantum oscillations, Hall effect, ARPES"}], "english_summary": ["Demonstrated Fermi surface tuning of Weyl semimetal MoTe2 via Nb doping (hole doping).", "ARPES and DFT show a quasi-rigid band shift of ~0.2 eV for 18% Nb substitution.", "Identified several Lifshitz transitions among multiple electron and hole pockets.", "Soft X-ray ARPES used to disentangle bulk and surface electronic states and orbital characters."]}}, {"title": "Depth-dependent electronic states of Fe3O4 across the Verwey transition studied by hard x-ray photoemission spectroscopy", "journal": "PRB_Recent", "source": "keyword", "link": "http://link.aps.org/doi/10.1103/lyp6-ctpz", "authors": "Shigenori Ueda, Azusa N. Hattori, Hidekazu Tanaka", "last_authors": "Azusa N. Hattori, Hidekazu Tanaka", "summary": "Depth-dependent electronic states of a prototypical strongly correlated ${\\mathrm{Fe}}_{3}{\\mathrm{O}}_{4}$ thin film across the Verwey transition temperature $({T}_{\\mathrm{V}}∼125\\phantom{\\rule{0.16em}{0ex}}\\mathrm{K})$ were investigated by hard x-ray photoemission spectroscopy (HAXPES) combined w…", "tier": "A_MUST_READ", "score": "9", "reason": "title strong match: photoemission", "tags": ["photoemission", "correlated"], "image": "", "briefing": {"background": "Fe3O4(자철석)는 온도가 낮아지면 금속에서 절연체로 변하는 Verwey 전이를 겪는 대표적인 강상관 산화물입니다. 이 현상은 전하 정렬과 격자 변형이 얽힌 복잡한 메커니즘을 가지고 있습니다.", "motivation": "벌크와 표면의 경계에서 전자 상태가 어떻게 다른지, 그리고 Verwey 전이 전후로 깊이에 따른 전자 구조의 변화가 어떻게 일어나는지 HAXPES를 통해 규명하고자 했습니다.", "result": "HAXPES의 높은 투과력을 활용하여 표면에서 벌크로 갈수록 변화하는 Fe의 가전자가 상태와 금속-절연체 전이의 거동을 깊이별로 프로파일링했습니다. 표면 근처에서 전이 특성이 벌크와 다르게 억제되거나 변형되는 양상을 포착했을 것으로  regime in which nuclear recoil and intrinsic electronic asymmetry contribute on comparable energy scales to the observed spectral line shape. Here we combine experiment and modeling over the photon-energy range 0.8 – 8 keV to resolve this interplay quantitatively. A graphene-specific implementation of the Fujikawa-Takata cumulant formalism, based on an anisotropic vibrational density of states constrained by first-principles phonon calculations, captures the expected recoil scaling with photon energy and emission geometry but fails to reproduce the pronounced asymmetric tails of the measured spectra. To overcome this limitation, we introduce an explicit electronic convolution model in which a photon-energy-independent reference response, dominated by the electronic line shape and extracted from the low-recoil 0.8 keV data through a recoil-inclusive fit, is convolved with a phonon recoil kernel carrying the full dependence on photon energy and emission angle. This approach reproduces both the measured line-shape evolution and the observed peak shifts across the explored energy range without refitting the spectra at higher photon energies. The results show that recoil in graphene cannot be described by a baseline treatment in which the phonon recoil kernel is combined only with symmetric lifetime broadening, but must be treated together with the intrinsic many-body electronic response of the C 1 s line.", "tier": "A_MUST_READ", "score": "9", "reason": "title strong match: photoemission", "tags": ["photoemission", "graphene", "monolayer"], "image": "", "briefing": {"background": "광전자 분광학(Photoemission spectroscopy)에서 광자의 에너지가 커질수록 방출되는 전자의 운동량이 증가하고, 이에 따른 반작용으로 원자핵이 밀려나는 핵 반동(nuclear recoil) 현상이 발생합니다. 특히 Hard X-ray(HAXPES) 영역에서는 이 효과가 무시할 수 없을 정도로 커져 스펙트럼의 선형(line shape)을 왜곡시킵니다.", "motivation": "단층 그래핀의 C 1s 코어 레벨 측정에서 핵 반동으로 인한 에너지 이동과 그래핀 특유의 다체(many-body) 전자적 비대칭성이 어떻게 결합되어 스펙트럼에 나타나는지 정량적으로 분리하고 이해하고자 했습니다.", "result": "Fujikawa-Takata cumulant 형식을 기반으로 한 기존의 모  spin-charge conversion, particularly in the absence of an external magnetic field, remains to be studied. Here, we report electric field control of spin-charge conversion in the topological insulator Bi 2 Te 3 with the antiferromagnetic multiferroic BiFeO 3 , using a nonlocal spin transport device. A systematic thickness dependence of the spin transport across the interface between Bi 2 Te 3 and BiFeO 3 reveals a signature of topological surface-state–dominated spin transport in the bilayer system. The spin-charge conversion remains robust for thicknesses above 10 nanometers but falls rapidly with reducing thickness and vanishes at 5 nanometers. This is consistent with hybridization-induced emergence of a trivial insulating phase, which is supported by the coherency factor estimated from the magnetoconductance of Bi 2 Te 3 . These results establish that spin-momentum–locked surface states dominate interfacial spin transport in the decoupled regime. Beyond presenting efficient spin-charge interconversion at an entirely insulating magnetic interface, this work also highlights sputter-deposited Bi 2 Te 3 as a high-quality and scalable platform for integrating quantum materials onto the devices. The nonlocal spin transport approach presented here provides a simple and unprecedented direct evidence of spin-charge conversion and opens an efficient and practical pathway toward designing energy-efficient spin-based devices.", "tier": "A_MUST_READ", "score": "9", "reason": "author whitelist: Robert J. Birgeneau", "tags": ["topologicalinsulator", "topological", "ferromagnet", "antiferromagnet", "transport"], "image": "", "briefing": {"background": "위상 절연체(TI)는 표면에 스핀-운동량 잠금(spin-momentum locking) 상태를 가져 효율적인 스핀-전하 변환이 가능합니다. 이를 자성체와 결합하여 전력 소모가 적은 차세대 스핀 장치를 만드는 연구가 활발합니다.", "motivation": "외부 자기장 없이도 전기장만으로 스핀-전하 변환을 제어할 수 있는 소자를 구현하고, 인터페이스에서의 스핀 수송 기작을 규명하고자 했습니다.", "result": "위상 절연체 Bi2Te3와 다강성(multiferroic) 반강자성체 BiFeO3 계면에서 비로컬(nonlocal) 스핀 수송 장치를 제작하여 전기장 제어를 실현했습니다. 특 nerally expected to enhance charge density wave (CDW) order. However, experimental results in monolayer ${\\mathrm{NbSe}}_{2}$ appear conflicting: while optical measurements reveal CDW signatures up to 145 K on oxide substrates, scanning tunneling microscopy (STM) studies …", "tier": "B_IMPORTANT_CONDMAT", "score": "10", "reason": "Direct study of CDW in NbSe2 using STM, matching core interests in CDW and 1D/2D materials.; demoted from A: broad CM, not direct user/project hit", "tags": ["STM", "CDW", "NbSe2"], "image": "", "briefing": {"background": "NbSe2와 같은 전이 금속 디칼코게나이드(TMD)는 차원이 낮아질수록 전하 밀도 파(CDW)와 초전도성이 복잡하게 얽히는 특성을 보입니다. 특히 단층(monolayer) 수준에서는 벌크와 다른 물성이 나타나는데, 그 발생 기작에 대한 논란이 지속되고 있습니다.", "motivation": "단층 NbSe2에서 광학적 측정(약 145K)과 STM 관찰 결과 사이의 전이 온도 및 CDW 거동에 대한 상충되는 데이터를 해결하고, 기판이나 결함이 CDW 핵 생성에 미치는 영향을 규명하고자 합니다.", "result": "STM 연구를 통해 단층 NbSe2에서 결함(defect)이 CDW의 핵 생성 및 안정화에 핵심적인 역할을 함을 제안합니다. 초록 정보에 따르면 특정 기판 위에서 결함 주위로 CDW가 국부적으로 유도되는 현상을 포착한 것으로 보입니다.", "implication": "단층 NbSe2의 CDW는 순수하게 내재적인 현상이라기보다 주변 환경(기판, 점 결함)에 극도로 민감하게 반응하는 불안정성을 가질 수 있음을 시사합니다.", "novelty": "실공간 측정을 통해 결함과 CDW의 상관관계를 직접 보여주었으며, 이는 STM과 2D TMD 시스템의 CDW 물성을 중요하게 다루는 사용자에게 매우 직접적인 정보를 제공합니다.", "unresolved": "결함이 없는 완벽한 깨끗한 샘플(pristine limit)에서 내재적인 CDW 전이 온도가 실제로 얼마인지에 대해서는 추가 논의가 필요해 보입니다.", "future_work": "다양한 결함 밀도를 제어한 시료에서의 체계적인 온도 가변 STM 측정이나, 기판 영향을 최소화한 현수형(suspended) 단층 NbSe2에 대한 연구가 예상됩니다.", "concepts": [{"term": "Charge Density Wave (CDW)", "why_emerged": "금속의 전자 밀도가 주기적으로 변조되면서 격자 왜곡을 동반하는 상전이 현상을 설명하기 위해 등장했습니다.", "origin": "Rudolf Peierls (1930년대 이론적 제안)", "connections": "Peierls instability, Kohn anomaly, Superconductivity"}, {"term": "STM (Scanning Tunneling Microscopy)", "why_emerged": "원자 수준의 실공간 해상도로 표면의 상태 밀도(LDOS)를 직접 관찰하기 위해 개발되었습니다.", "origin": "Gerd Binnig, Heinrich Rohrer (1981)", "connections": "STS (Scanning Tunneling Spectroscopy), Quasiparticle Interference (QPI)"}, {"term": "1H-NbSe2", "why_emerged": "2D 극한에서의 강한 전자-격자 결합과 초전도성, CDW의 공존을 연구하기 위한 표준 물 e electron-phonon coupling matrix elements. These findings establish dynamical anharmonicity as a critical link between soft-mode lattice fluctuations and electronic spectral signatures, providing insights into coupled lattice-electron dynamics in two-dimensional quantum materials.", "tier": "B_IMPORTANT_CONDMAT", "score": "10", "reason": "Relates phonon softening to electronic quasiparticle signatures and CDW in a primary material of interest, NbSe2.; demoted from A: broad CM, not direct user/project hit", "tags": ["material:NbSe2", "CDW", "electronic-structure", "theory"], "image": "https://arxiv.org/static/browse/0.3.4/images/arxiv-logo-fb.png", "briefing": {"background": "2차원 물질에서 CDW 불안정성은 일반적으로 소프트 포논(soft phonon)에 의해 유도됩니다. 그러나 원자층 수준의 얇은 물질에서는 비조화성(anharmonicity)이 강해져서 전통적인 정적 이론으로는 설명하기 어려운 동역학적 특성이 나타납니다.", "motivation": "단층 1H-NbSe2에서 포논 간의 상호작용(3-phonon, 4-phonon)이 포논 스펙트럼과 그에 따른 전자 준입자(quasiparticle)의 결맞음 및 ARPES 신호에 미치는 영향을 이론적으로 규명하고자 합니다.", "result": "3-포논 및 4-포논 상호작용이 CDW 모드의 동역학적 연화(softening)를 유도하여 전이 온도를 높이고, 포논 라인 모양을 비-로렌츠 형태로 변형시킴을 발견했습니다. 이는 전자의 self-energy에 영향을 주어 ARPES에서 관찰되는 킹크(kink)와 위성(satellite) 특징을 강화합니다.", "implication": "실험적으로 관찰되는 전자 구조의 비정상적인 특징들이 단순히 전자-전자 상호작용뿐만 아니라 강한 비조화 포논 동역학에서 비롯될 수 있음을 보여줍니다.", "novelty": "정적인 격자 왜곡을 넘어 동역학적 포논 비조화성이 전자 준입자의 결맞음 상실(decoherence)에 미치는 경로를 명확히 제시했습니다. ARPES와 전자 구조 계산(DFT+DMFT 등)에 관심이 높은 사용자에게 중요한 이론적 토대를 제공합니다.", "unresolved": "이러한 비-로렌츠형 포논 스펙트럼을 중성자 산란이나 RIXS를 통해 단층 샘플에서 직접 실험적으로 확인하는 과제가 남아 있습니다.", "future_work": "온도 변화에 따른 포논 스펙트럼 함수 측정 및 다양한 2D 금속에서의 일반화된 비조화성 효과 계산이 기대됩니다.", "concepts": [{"term": "Phonon Anharmonicity", "why_emerged": "조화 근사(harmonic approximation)가 설명하지 못하는 열팽창, 열전도, 포논 수명 등을 설명하기 위해 도입되었습니다.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "Lattice thermal conductivity, Soft mode, Phase transitions"}, {"term": "Quasiparticle Decoherence", "why_emerged": "다체계 상호작용으로 인해 전자의 양자 역학적 상태가 수명을 갖고 흩어지는 현상을 설명합니다.", "origin": "Lev Landau (Fermi Liquid Theory)", "connections": "Self-energy, Spectral function broadening, ARPES lineshape"}, {"term": "Fan-Migdal Electron Self-energy", "why_emerged": "전자와 포논의 상호작용이 전자의 에너지와 수명에 미치는 영향을 정량적으로 계산하기 위해 개발되었습니다.", "origin": "C. Fan, A.B. Migdal (1950-60년대)", "connections": "Electron-phonon coupling, ARPES kink, Eliashberg theory"}, {"term": "Soft-mode softening", "why_emerged": "구조적 상전이가 일어날 때 특정 격자 진동 모드의 주파수가 0으로 수렴하며 격자가 불안정해지는 현상을 설명합니다.", "origin": "William Cochran, Philip Anderson (1950년대 후반)", "connections": "Structural phase transition, CDW, Ferroelectricity"}], "english_summary": ["Demonstrates that dynamical phonon anharmonicity (3- and 4-phonon interactions) drives CDW softening in monolayer NbSe2.", "Shows how these dynamical effects lead to non-Lorentzian phonon lineshapes and electronic quasiparticle decoherence.", "Connects strong momentum-dependent electron-phonon coupling to enhanced kinks and satellites in ARPES spectra."]}}, {"title": "Synergistic evolution of electronic nematic fluctuations, charge density wave order, and superconductivity in CuxTiSe2", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/q8zl-lsyc", "authors": "Xingyu Lv (吕星雨), Yang Fu (付阳), Shangjie Tian (田尚杰), et al.", "last_authors": "Xiao Zhang (张晓), Hechang Lei (雷和畅)", "summary": "The interplay among electronic nematicity, charge density wave (CDW), and superconductivity in correlated electronic systems has induced extensive research interest. Here, we discover the existence of nematic fluctuations in a ${\\mathrm{TiSe}}_{2}$ single crystal and investigate its evolution with C…", "tier": "B_IMPORTANT_CONDMAT", "score": "9", "reason": "Directly addresses the interplay of nematicity, CDW, and superconductivity in a transition metal dichalcogenide.; demoted from A: broad CM, not direct user/project hit", "tags": ["material", "nematicity", "CDW", "superconductivity"], "image": "", "briefing": {"background": "TiSe2는 CDW와 초전도성이 공존하는 대표적인 TMD 물질입니다. 최근 철 기반 초전도체나 구리 산화물에서 중요하게 다뤄지는 '전자 네마틱(electronic nematic)' 상태가 TMD 시스템에서도 나타날 수 있는지에 대한 관심이 높습니다.", "motivation": "CuxTiSe2 시스템에서 구리 도핑에 따른 전자 네마틱 요동(fluctuation), CDW, 초전도성 사이의 상관관계와 진화 과정을 실험적으로 확인하고자 합니다.", "result": "도핑되지 않은 TiSe2에서 이미 네마틱 요동이 존재함을 발견했으며, Cu 도핑이 진행됨에 따라 CDW와 네마틱 요동, 그리고 초전도성이 서로 시너지 효과를 내며 변화하는 거동을 확인했습니다.", "implication": "TMD 계열에서도 네마틱 상태가 CDW와 초전도성의 상호작용을 이해하는 핵심 요소일 수 있음을 시사하며, 이는 다른 강상관 전자계 물질들과의 공통된 물리학적 기저를 암시합니다.", "novelty": "TiSe2 계열에서 네마틱 요동의 존재를 명시적으로 보고하고 CDW/초전도성과의 연결 고리를 제시했습니다. 사용자의 관심사인 네마틱성(nematicity)과 CDW의 얽힘을 직접적으로 다룹니다.", "unresolved": "네마틱 요동의 근원이 격자 변형에 의한 것인지, 아니면 순수하게 전자의 궤도나 스핀 자유도에서 기인한 것인지에 대한 구분이 필요합니다.", "future_work": "탄성 저항(elastoresistance) 측정이나 변형 유도 ARPES 실험을 통해 네마틱 민감도(nematic susceptibility)를 정량적으로 측정하는 연구가 이어질 것으로 보입니다.", "concepts": [{"term": "Electronic Nematicity", "why_emerged": "결정 격자의 회전 대칭성이 전자의 상호작용에 의해 자발적으로 깨지는 상태를 설명하기 위해 등장했습니다.", "origin": "Steven Kivelson, Eduardo Fradkin, Victor Emery (1998)", "connections": "Liquid crystals, Iron-based superconductors, High-Tc cuprates"}, {"term": "CuxTiSe2", "why_emerged": "층간 도핑을 통해 CDW를 억제하고 초전도성을 유도하며 양자 임계점 근처의 물성을 연구하기 위해 사용됩니다.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "Intercalation, Superconductivity, Charge density wave"}, {"term": "Nematic Fluctuations", "why_emerged": "장거리 네마틱 질서가 형성되기 전 단계에서 나타나는 동역학적인 대칭성 깨짐의 전조 현상을 이해하기 위해 필요합니다.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "Quantum criticality, Elastoresistance, Structural transition"}, {"term": "Synergistic Evolution", "why_emerged": "여러 질서 변수(order parameters)가 서로 경쟁하는 것이 아니라 밀접하게 연결되어 함께 변화하는 복합적인 상태를 설명합니다.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "Intertwined orders, Coexistence of phases"}], "english_summary": ["Reports the discovery of electronic nematic fluctuations in TiSe2 and their evolution with Cu intercalation.", "Identifies a synergistic relationship between nematicity, CDW order, and the emergence of superconductivity.", "Suggests nematicity is an intrinsic feature of TMDs near the CD ": [{"term": "Yu-Shiba-Rusinov (YSR) states", "why_emerged": "초전도체 내의 자성 불순물이 쿠퍼 쌍을 깨뜨리며 형성하는 속박 상태(bound states)를 설명하기 위해 도입되었습니다.", "origin": "L. Yu, H. Shiba, and A. I. Rusinov (1960년대)", "connections": "안드레예프 반사(Andreev reflection), 마요라나 제로 모드와 밀접한 관련이 있습니다."}, {"term": "Tip-induced band bending", "why_emerged": "STM 팁과 샘플 사이의 전위차로 인해 샘플 표면 근처의 에너지 밴드가 휘어지는 현상을 설명하거나 제어하기 위해 사용됩니다.", "origin": "STM 기술의 발전과 함께 반도체 표면 연구에서 중요해짐", "connections": "게이트 전압 효과, 국소적 도핑 제어와 유사한 역할을 합니다."}, {"term": "Mixed-valence regime", "why_emerged": "금속 내 불순물 원자의 가전자 상태가 두 가지 이상의 값을 동시에 가질 수 있는 양자 역학적 혼합 상태를 설명하기 위해 등장했습니다.", "origin": "희토류 화합물 연구 등 응집물질물리 초창기부터 연구됨", "connections": "곤도 효과(Kondo effect), 중거운 페르미온 시스템과 연관됩니다."}, {"term": "NbSe2", "why_emerged": "대표적인 전하 밀도 파(CDW)와 초전도성이 공존하는 2차원 층상 물질로, 다양한 물리적 기판으로 널리 쓰입니다.", "origin": "초록 정보만으로는 특정하기 어려움 (전형적인 TMD 물질)", "connections": "2D 초전도체, CDW 연구, 위상 절연체 성장의 기판으로 자주 활용됩니다."}], "english_summary": ["Visualized a quantum phase transition in a mixed-valence Fe dopant on Bi2Te3/NbSe2.", "Utilized STM tip-induced band bending to precisely tune and observe the electronic evolution.", "Demonstrated atomic-scale control of magnetic impurity states within a TI/SC interface.", "Provides insights into engineering topological states through local field manipulation."]}}, {"title": "Altermagnetism revealed by polarized neutrons in MnF2", "journal": "Science", "source": "Gemini", "link": "https://www.science.org/doi/abs/10.1126/science.aec2602?af=R", "authors": "Quentin Faure, Dalila Bounoua, Victor Balédent, et al.", "last_authors": "Sylvain Petit, Paul McClarty", "summary": "Altermagnets are compensated magnets with symmetry-enforced spin split bands. Direct spectroscopic evidence for their existence has been reported in several materials. For example, inelastic neutron scattering (INS) has recently been used to witness a splitting of magnon bands in MnTe that is compatible with altermagnetism. Here, we present polarized INS results on MnF 2 showing that it is altermagnetic. Our data reveal a splitting coming from the long-range dipolar coupling. Furthermore, using a domain-biased sample, the data reveal a nonzero chirality in the neutron scattering cross section that reverses the sign between the two magnon modes. It is this feature that clearly demonstrates altermagnetism in MnF 2 . This finding highlights the potential for polarized INS to characterize altermagnets through its sensitivity to fine structure in magnon spectra.", "tier": "B_IMPORTANT_CONDMAT", "score": "9", "reason": "Direct interest: altermagnetism revealed by neutron scattering, magnetic order.", "tags": ["altermagnetism", "neutronscattering", "magneticorder", "MnF2"], "image": "", "briefing": {"background": "최근 발견된 알터자성(Altermagnetism)은 강자성(FM)과 반강자성(AFM)의 특성을 동시에 갖는 제3의 자성 상태입니다. 순자화값은 0이지만, 대칭성에 의해 운동량 공간에서 스핀이 갈라진 밴드 구조를 가집니다.", "motivation": "전형적인 반강자성체로 알려진 MnF2에서 알터자성적 특성을 실험적으로 확인하고, 특히 중성자 산란을 통해 마그논 밴드의 미세 구조를 규명하고자 했습니다.", "result": "편광 비탄성 중성자 산란(polarized INS) 실험을 통해 MnF2의 마그논 밴드 할당이 쌍극자 결합(dipolar coupling)에 의해 분리됨을 확인했습니다. 특히 도메인 편향된 샘플에서 두 마그논 모드 사이의 부호가 반전되는 0이 아닌 카이랄리티(chirality)를 발견하여 알터자성을 입증했습니다.", "implication": "MnF2가 알터자성체임을 확인했을 뿐만 아니라, 편광 중성자 산란이 알터자성체의 대칭성과 스핀 동역학을 판별하는 매우 강력한 도구임을 입증했습니다.", "novelty": "알터자성의 증거를 마그논의 카이랄리티 반전이라는 독특한 현상을 통해 제시했습니다. 이는 알터자성 및 자기 구조 연구에 관심이 많은 독자에게 매우 중요한 결과입니다.", "unresolved": "쌍극자 상호작용 외에 교환 상호작용(exchange interaction)이 알터자성 마그논 분리에 기여하는 정량적 정도에 대한 추가 연구가 필요합니다.", "future_work": "다른 알터자성 후보 물질들(RuO2, CrSb 등)에 대한 편광 중성자 산란 연구와 이를 활용한 스핀트로닉스 응용 연구가 이어질 것으로 보입니다.", "concepts": [{"term": "Altermagnetism", "why_emerged": "순자화가 없으면서도 스핀 분할된 밴드를 가진 물질군을 기존의 FM/AFM 분류체계에서 독립시키기 위해 제안되었습니다.", "origin": "Libor Šmejkal, Jairo Sinova, Tomas Jungwirth (2022년경 이론적 정립)", "connections": "비정상 홀 효과(AHE), 스핀 할당 밴드 구조와 연결됩니다."}, {"term": "Polarized INS", "why_emerged": "중성자의 스핀 정보를 활용하여 물질 내 자성 산란과 핵 산란을 분리하고 마그논의 스핀 성분을 분석하기 위해 개발되었습니다.", "origin": "Bertram Brockhouse (1950년대 INS 기초 확립 및 이후 편 PORTANT_CONDMAT", "score": "9", "reason": "Very direct interest in altermagnetism and magnetic excitations.", "tags": ["altermagnetism", "magnons", "chiral", "MnTe"], "image": "", "briefing": {"background": "알터자성체는 강자성체처럼 스핀이 분리된 에너지 밴드를 가지면서도 반강자성체처럼 순자화가 없는 독특한 대칭성을 가집니다. 이러한 대칭성은 전자의 거동뿐만 아니라 집단 들뜸인 마그논의 성질에도 결정적인 영향을 미칩니다.", "motivation": "알터자성 후보 물질인 MnTe에서 이론적으로 예측된 '카이랄 알터마그논(chiral altermagnon)'의 존재를 실험적으로 증명하고자 했습니다.", "result": "원형 이색성 공명 비탄성 X선 산란(CD-RIXS)을 통해 MnTe에서 마그논의 운동량에 따른 스핀 편광 특성을 측정했습니다. 결과적으로 MnTe의 g-wave 대칭성과 일치하는 운동량 의존성을 가진 카이랄 마그논 모드를 발견했습니다.", "implication": "알터자성 질서가 스핀 동역학을 어떻게 형성하는지 명확히 보여주었으며, 알터자성 특유의 '카이랄 알터마그논'이 새로운 종류의 자기 여기(magnetic excitation)임을 확립했습니다.", "novelty": "RIXS의 원형 이색성을 이용해 마그논의 스핀-운동량 잠금(spin-momentum locking) 현상을 포착했다는 점이 혁신적입니다. CD-ARPES/RIXS에 관심이 높은 독자에게 매우 흥미로운 주제입니다.", "unresolved": "온도 변화에 따른 카이랄 마그논의 감쇠(damping) 현상과 격자 진동(phonon)과의 상호작용에 대한 상세한 분석이 필요합니다.", "future_work": "이러한 카이랄 마그논을 이용한 초고속 스핀트로닉스 소자 구현 및 양자 정보 전달 매체로서의 가능성 탐구가 기대됩니다.", "concepts": [{"term": "Chiral altermagnon", "why_emerged": "알터자성체의 독특한 대칭성에서 비롯된, 운동량에 따라 특정 카이랄리티를 갖는 새로운 마그논 모드를 지칭하기 위해 명명되었습니다.", "origin": "본 연구에서 실험적 증거와 함께 제시됨", "connections": "알터자성, 스핀-운동량 잠금, g-wave 자성 질서와 연결됩니다."}, {"term": "CD-RIXS", "why_emerged": "공명 비탄성 X선 산란에서 빛의 원형 편광을 조절하여 물질의 자성 및 카이랄 들뜸을 선택적으로 측정하기 위해 도입되었습니다.", "origin": "RIXS 기술의 발전과 싱크로트론 방사광원의 정밀화", "connections": "CD-ARPES, XMCD(X선 원형 이색성)와 원리적으로 맞닿아 있습니다."}, {"term": "g-wave symmetry", "why_emerged": "공간 상의 대칭성 분포를 구면 조화 함수(spherical harmonics)의 g-오비탈 대칭성(L=4)과 유사한 형태로 설명하기 위해 사용됩니다.", "origin": "결정장 이론 및 그룹 이론", "connections": "알터자성의 스핀 분할 패턴을 설명하는 핵심 요소입니다."}, {"term": "MnTe", "why_emerged": "고온에서 안정한 반강자성체였으나 최근 대표적인 알터자성 후보 물질로 재조명받고 있는 화합물입니다.", "origin": "초록 정보만으로는 특정하기 어려움 (전통적인 NiAs 구조 화합물)", "connections": "알터자성, 스핀 할당 밴드, 스핀트로닉스 재료 연구와 연관됩니다."}], "english_summary": ["Experimentally evidenced 'chiral altermagnons' in MnTe using CD-RIXS.", "Observed momentum-dependent spin polarization matching g-wave symmetry.", "Established that altermagnetic order fundamentally shapes spin dynamics.", "Paves the way for spintronic applications using chiral magnetic excitations."]}}, {"title": "Anomalous Hall Response and Real-Space Current Correlations in Rhombohedral Graphene", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2611.04312", "authors": "Zhen Bi, Chandra M. Varma", "last_authors": "Zhen Bi, Chandra M. Varma", "summary": "We investigate the anomalous Hall effect (AHE) and magnetization observed in rhombohedral graphene through real-space calculations which lead to new insights. Our calculations reveal no equilibrium loop currents of the type associated with the Haldane model of a quantum anomalous Hall insulator. Instead, the AHE arises in this instance from interference between electronic paths forming oriented closed Wilson loops of current operators in the presence of valley polarization. We show some examples of these Wilson loops. Using the fact that the added-carrier charge density resides dominantly in the top and bottom layers, we develop a real-space expansion of the surface Hamiltonian that reproduces the Hall response of the full model with good accuracy. We also predict that a smooth local potential induces equilibrium circulating currents whose strength depends on both Berry curvature and the orbital moments of states at the Fermi surface.", "tier": "B_IMPORTANT_CONDMAT", "score": "9", "reason": "Direct theoretical investigation of loop currents and anomalous Hall response in a relevant material system.; demoted from A: broad CM, not direct user/project hit", "tags": ["theory", "graphene", "loop-current", "anomalous-hall"], "image": "https://arxiv.org/html/2611.04312v1/figures/microscopic_defect_current_field.png", "briefing": {"background": "菱面体(Rhombohedral) 적층 구조의 그래핀은 편평한 밴드(flat band)를 형성하여 전자 간의 강한 상관관계를 유도하며, 특히 외부 자기장 없이도 이상 홀 효과(Anomalous Hall Effect, AHE)를 보이는 독특한 양자 상태로 주목받고 있습니다.", "motivation": "최근 Rhombohedral 그래핀에서 관찰된 AHE의 기원을 두고, 이것이 Haldane 모델에서 제안된 것과 같은 '평형 고리 전류(equilibrium loop current)'에 의한 것인지, 아니면 다른 메커니즘에 의한 것인지 규명하고자 했습니다.", "result": "계산 결과, Haldane형의 자발적 고리 전류는 존재하지 않음을 확인했습니다. 대신 계곡 분극(valley polarization)이 존재할 때, 전류 연산자의 국소적 폐곡선인 'Wilson loops' 간의 간섭 효과가 AHE를 발생시키는 실질적인 원인임을 밝혀냈습니다.", "implication": "표면층에 전하 밀도가 집중된다는 점을 이용한 실공간 전개(real-space expansion) 모델이 전체 시스템의 홀 응답을 정확히 재현함을 보여주었으며, 이는 복잡한 다층 구조 그래핀의 홀 효과를 더 단순한 표면 모델로 설명할 수 있음을 의미합니다.", "novelty": "독자의 주요 관심사인 '고리 전류(loop current)'와 'TRSB(시간 역전 대칭성 깨짐)' 키워드에 직접적으로 닿아 있는 연구입니다. 특히 고리 전류의 물리적 실체를 부정하는 대신, Wilson loop 간섭이라는 새로운 미시적 기원을 제시한 점이 중요합니다.", "unresolved": "이론적 계산으로 예측된 국소 전위에 의한 순환 전류가 실제 실험(예: SQUID-on-tip 등)에서 측정 가능한 수준인지에 대한 추가 검증이 필요합니다.", "future_work": "예측된 베리 곡률과 궤도 모멘트에 의존하는 순환 전류를 실험적으로 관측하기 위한 나노 스케일 자기장 측정 실험이 뒤따를 것으로 보입니다.", "concepts": [{"term": "Wilson loop", "why_emerged": "게이지 장이나 파동함수의 기하학적 위상 변화를 닫힌 경로를 따라 정의하기 위해 도입되었습니다.", "origin": "Kenneth G. Wilson (1974년 격자 게이지 이론에서 제안)", "connections": "Berry phase, Chern number, Wannier functions"}, {"term": "Loop current", "why_emerged": "강상관 전자계에서 시간 역전 대칭성을 깨뜨리지만 넷 자화(net magnetization)가 없는 상태를 설명하기 위해 제안되었습니다.", "origin": "Chandra Varma (구리 산화물 초전도체의 pseudogap 상태 설명 위해 제안)", "connections": "Kagome metals, Time-reversal symmetry breaking, AV3Sb5"}, {"term": "Valley polarization", "why_emerged": "이차원 재료의 밴드 구조 내 서로 다른 운동량 극점(valley)의 자유도를 제어하여 정보 소자로 활용(valleytronics)하기 위해 등장했습니다.", "origin": "초록 정보만으로는 특정하기 어려움 (2000년대 중반 그래핀 연구와 함께 본격화)", "connections": "Graphene, Transition Metal Dichalcogenides (TMDs), Anomalous Hall Effect"}, {"term": "Rhombohedral Graphene", "why_emerged": "ABC 적층 방식으로 인해 베리 곡률이 표면에 집중되고 상관 현상이 극대화되는 특성을 연구하기 위해 주목받았습니다.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "Flat bands, Superconductivity, Quantum Anomalous Hall Effect"}], "english_summary": ["The paper investigates the origin of the anomalous Hall effect in rhombohedral graphene using real-space calculations.", "It finds that AHE arises from electronic path interference (Wilson loops) under valley polarization, rather than Haldane-type equilibrium loop currents.", "A simplified surface Hamiltonian accurately reproduces the Hall response of the full multilayer system.", "Predicted local circulating currents depend on both Berry curvature and orbital moments at the Fermi surface."]}}, {"title": "Chiral Phonons Coupled to Spin-Split Bands in Altermagnetic CrSb and MnTe", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2607.04802", "authors": "Armando Consiglio, Maximilian \\\"Unzelmann, Giancarlo Panaccione, Domenico Di Sante", "last_authors": "Giancarlo Panaccione, Domenico Di Sante", "summary": "Altermagnets exhibit momentum-dependent spin splitting without net magnetization, providing a unique platform where magnetic order, electronic structure and lattice dynamics intertwine. Here, using first-principles calculations, we demonstrate that the prototypical altermagnets CrSb and MnTe host locally chiral phonon modes carrying finite phonon angular momentum with a six-lobes $f$-wave texture in momentum space. Our results show that the chiral lattice motion originates from the pnictogen/chalcogen sublattice, while the altermagnetic spin splitting is generated by the magnetic transition-metal atoms, indicating that chiral lattice dynamics and altermagnetic electronic states originate from different atomic sublattices of the same crystal. In pristine compounds, at each valley, inversion symmetry suppresses the net phonon angular momentum despite local circular atomic motion. We further demonstrate that isoelectronic symmetry lowering induced by chemical substitution lifts this cancellation and generates finite valley phonon chirality, while keeping the altermagnetic nature of the compounds intact. Most importantly, we reveal that chiral phonons couple to momentum-dependent spin-split electronic bands through momentum-dependent electron-phonon interaction, producing characteristic modifications of the electronic structure, possibly accessible by photoemission experiments. Our results establish altermagnets as a promising platform for chiral phononics and spin-selective lattice control.", "tier": "B_IMPORTANT_CONDMAT", "score": "9", "reason": "Theoretical prediction of chiral phonons in altermagnets with direct implications for photoemission.", "tags": ["theory", "material", "altermagnetism"], "image": "https://arxiv.org/html/2607.04802v2/Figure_1_final.png", "briefing": {"background": "알터마그네티즘(Altermagnetism)은 넷 자화가 0임에도 불구하고 운동량 공간에서 스핀 분할이 일어나는 새로운 자성 분류로, 자성 소자와 스핀트로닉스 연구의 차세대 플랫폼으로 각광받고 있습니다.", "motivation": "대표적인 알터마그넷인 CrSb와 MnTe에서 격자 진동(포논)이 전자 구조와 결합하여 카이랄성(chirality)을 가질 수 있는지, 그리고 이것이 전자 밴드에 어떤 영향을 주는지 규명하고자 했습니다.", "result": "제1원리 계산을 통해 CrSb와 MnTe가 운동량 공간에서 6개 엽(six-lobes) 형태의 $f$-wave 텍스처를 가진 카이랄 포논을 가짐을 발견했습니다. 특히 격자의 카이랄 거동과 전자의 알터마그네틱 스핀 분할이 서로 다른 원자 부격자(sublattice)에서 기인한다는 점을 밝혀냈습니다.", "implication": "화학적 치환을 통해 밸리 포논 카이랄성을 제어할 수 있으며, 이러한 카이랄 포논이 스핀 분할된 밴드와 강하게 결합하여 전자 구조에 독특한 변조를 일으킴을 제시했습니다.", "novelty": "독자의 핵심 관심사인 '알터마그네티즘'과 'ARPES'를 연결하는 연구입니다. 카이랄 포논과 스핀 분할 밴드의 결합 결과가 광전자 분광 실험(ARPES)으로 관측 가능하다는 예측은 실험가에게 매우 중요한 정보입니다.", "unresolved": "이론적으로 예측된 포논-전자 결합에 의한 밴드 변조가 실제 ARPES 실험에서 배경 잡음이나 다른 다체 효과와 구별되어 명확히 관측될 수 있을지가 관건입니다.", "future_work": "도핑이나 치환된 CrSb/MnTe 샘플에 대한 편광 의존 ARPES 또는 IXS(비탄성 X선 산란) 실험을 통해 카이랄 포논의 흔적을 직접 확인하는 연구가 기대됩니다.", "concepts": [{"term": "Altermagnetism", "why_emerged": "강자성(FM)의 스핀 분할 특성과 반강자성(AFM)의 제로 자화 특성을 동시에 갖는 물질군을 이론적으로 분류하기 위해 등장했습니다.", "origin": "L. Šmejkal, J. Sinova, T. Jungwirth 등 (2022년경 본격 정립)", "connections": "Antiferromagnetism, Spin-split bands, Anomalous Hall Effect"}, {"term": "Chiral Phonon", "why_emerged": "격자 진동이 원자들의 원운동을 통해 각운동량을 가질 수 있음을 설명하고, 이를 제어하여 새로운 물성을 유도하기 위해 제안되었습니다.", "origin": "L. Zhang, Q. Niu (2014년 이론적 제안)", "connections": "Phonon angular momentum, Valleytronics, Berry phase"}, {"term": "Spin-split bands", "why_emerged": "전자의 스핀 상/하 상태가 에너지적으로 분리되어 스핀 rence peak", "why_emerged": "초전도 상태에서 갭 가장자리에 상태 밀도가 집중되는 현상을 나타내며, 초전도체의 질과 갭 크기를 판단하는 척도로 쓰입니다.", "origin": "BCS 이론 (Bardeen, Cooper, Schrieffer, 1957)", "connections": "BCS theory, DOS, Quasiparticle interference"}, {"term": "Scanning Tunneling Spectroscopy (STS)", "why_emerged": "물질 표면의 국소적인 전자 상태 밀도(LDOS)를 원자 수준의 분해능으로 측정하기 위해 개발되었습니다.", "origin": "Gerd Binnig, Heinrich Rohrer (1981, STM의 확장)", "connections": "STM, LDOS, dI/dV mapping"}, {"term": "Monolayer FeSe/SrTiO3", "why_emerged": "단층 구조와 기판의 상호작용(포논 등)을 통해 초전도 온도를 극적으로 높일 수 있음을 연구하기 위해 등장했습니다.", "origin": "Qing-Yan Wang, Xue-Qiang Zhang 등 (2012년 발견)", "connections": "High-Tc superconductivity, Interfacial phonon coupling, Iron-based superconductors"}], "english_summary": ["The paper provides a precise constraint on the superconducting gap of monolayer FeSe/SrTiO3 using tip-height-dependent STS.", "Statistical analysis of tunneling decay rates identifies three energy regimes: Andreev reflection ( 13 meV).", "The superconducting gap is determined to be between 6 and 13 meV, resolving ambiguity caused by missing coherence peaks.", "Low-energy tunneling is found to be localized near defects, whereas higher-energy states are spatially extended."]}}, {"title": "Imaging phase winding in topological superconductors with a fork-tip Josephson STM", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2609.38174", "authors": "Vladislav Poliakov, Archisman Panigrahi", "last_authors": "Vladislav Poliakov, Archisman Panigrahi", "summary": "The topological phase winding in a chiral superconductor remains challenging to access by conventional real-space probes. We propose a scheme to probe this winding with a fork-tip Josephson STM near an impurity, where two superconducting tips form an interferometer sensitive to phase differences between two positions. The phase winding remains accessible via the fork-tip critical current even if the relative phase between the fork-tip and sample fluctuates,
