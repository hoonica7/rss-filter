<title>Daily Paper Slideshow</title>
<style>
  :root {
    color-scheme: light;
    --bg: #f6f7f4;
    --paper: #ffffff;
    --ink: #111827;
    --muted: #64748b;
    --line: #d8ddd2;
    --accent: #176b87;
    --accent-2: #9a3412;
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; overflow: auto; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: var(--bg); color: var(--ink); }
  .shell { max-width: 1500px; min-height: 100vh; margin: 0 auto; padding: 14px 18px; display: flex; flex-direction: column; }
  .topbar { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 16px; }
  .top-actions { display: flex; align-items: center; gap: 10px; }
  .topbar a, button { border: 1px solid var(--line); border-radius: 8px; background: var(--paper); color: var(--ink); padding: 10px 14px; font-weight: 700; text-decoration: none; cursor: pointer; }
  button.primary { background: var(--accent); border-color: var(--accent); color: white; }
  button:disabled { opacity: 0.45; cursor: not-allowed; }
  .counter { color: var(--muted); font-weight: 700; }
  .slide { min-height: calc(100vh - 82px); background: var(--paper); border: 1px solid var(--line); border-radius: 10px; padding: 18px; box-shadow: 0 18px 42px rgba(15, 23, 42, 0.10); display: grid; grid-template-columns: minmax(310px, 0.86fr) minmax(0, 1.55fr); gap: 18px; overflow: visible; }
  .paper-head { min-width: 0; min-height: 0; overflow: visible; display: flex; flex-direction: column; gap: 12px; }
  .figure { margin: 0; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: #f8fafc; }
  .figure img { display: block; width: 100%; max-height: 41vh; object-fit: contain; background: white; }
  .figure figcaption { padding: 7px 10px; color: var(--muted); font-size: 12px; line-height: 1.3; }
  .head-text { display: flex; flex-direction: column; gap: 9px; min-width: 0; }
  .badges { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .badge { border-radius: 999px; padding: 5px 9px; background: #eef2ff; color: #3730a3; font-size: 12px; font-weight: 800; }
  .score { background: #fee2e2; color: #991b1b; }
  h1 { margin: 0; font-size: 25px; line-height: 1.15; letter-spacing: 0; overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
  h1 a { color: inherit; text-decoration-color: rgba(23, 107, 135, 0.35); text-decoration-thickness: 2px; text-underline-offset: 4px; }
  h1 a:hover { color: var(--accent); text-decoration-color: var(--accent); }
  .meta, .authors, .why, .abstract { font-size: 13px; line-height: 1.45; }
  .meta, .authors { color: var(--muted); }
  .why strong, .abstract strong, .authors strong { color: var(--ink); }
  .authors { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .why { border-left: 4px solid var(--accent-2); padding-left: 10px; color: #374151; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .abstract { border-top: 1px solid var(--line); padding-top: 14px; color: #374151; }
  .original-abstract { border-top: 1px solid var(--line); padding-top: 10px; color: #374151; font-size: 11.5px; line-height: 1.35; overflow-wrap: anywhere; }
  .original-abstract strong { display: block; margin-bottom: 4px; color: var(--ink); }
  .tags { display: flex; flex-wrap: wrap; gap: 8px; }
  .tag { border-radius: 999px; padding: 4px 8px; background: #f1f5f9; color: #475569; font-size: 12px; font-weight: 700; }
  .head-text > .link { display: none; }
  .briefing { min-width: 0; min-height: 0; overflow: visible; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); grid-auto-rows: minmax(0, auto); align-content: start; gap: 11px 18px; border-top: 0; padding-top: 0; }
  .brief-section { min-width: 0; }
  .brief-section.wide { grid-column: 1 / -1; }
  .brief-section h2 { margin: 0 0 4px; font-size: 14px; line-height: 1.22; color: #0f766e; letter-spacing: 0; }
  .brief-section p, .brief-section li { margin: 0; font-size: 12.5px; line-height: 1.42; color: #1f2937; overflow-wrap: anywhere; }
  .brief-section ul { margin: 0; padding-left: 20px; }
  .concepts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 9px 14px; }
  .concept { border-top: 1px solid var(--line); padding-top: 7px; }
  .concept h3 { margin: 0 0 4px; font-size: 13px; color: #7c2d12; letter-spacing: 0; }
  .concept p { margin: 2px 0 0; font-size: 11.5px; line-height: 1.35; color: #374151; overflow-wrap: anywhere; }
  .concept b { color: #111827; }
  .link { color: var(--accent); font-weight: 800; text-decoration: none; }
  .empty { padding: 48px; background: var(--paper); border: 1px solid var(--line); border-radius: 12px; color: var(--muted); }
  @media (max-width: 860px) {
    .shell { padding: 14px; }
    .topbar, .top-actions { align-items: stretch; flex-direction: column; }
    .slide, .briefing, .concepts { grid-template-columns: 1fr; }
    .slide { min-height: auto; overflow: visible; display: grid; }
    h1 { font-size: 28px; }
  }
</style>

ng an ultrahigh-vacuum cryogenic sample quenching and transfer technique. A superconducting gap of ~18 milli–electron volts with coherence peaks is observed along the Brillouin zone diagonal. The finite gap persists across the entire Brillouin zone, revealing the absence of gap nodes. A kink is observed in the energy-momentum dispersion at ~70 milli–electron volts below the Fermi level, indicating an electron-boson coupling. The simultaneous observation of a nodeless superconducting gap and electron-boson coupling provides insight into the pairing symmetry and gluing mechanism in Ruddlesden-Popper bilayer nickelates.", "tier": "B_IMPORTANT_CONDMAT", "score": "9", "reason": "ARPES study of nodeless superconducting gap and electron-boson coupling in nickelate films.", "tags": ["ARPES", "nickelate", "unconventionalsuperconductivity"], "image": "", "briefing": {"background": "LaNiO3 기반의 Ruddlesden-Popper 구조 니켈산염은 고온 초전도체인 구리산염의 대안으로서 전자 구조의 유사성을 확인하려는 활발한 연구 대상입니다.", "motivation": "최근 발견된 이중층 니켈산염의 초전도 기원을 밝히기 위해, 실제 전자 에너지 스케일과 결합 메커니즘을 ARPES로 직접 측정하고자 합니다.", "result": "ARPES를 통해 초전도 상태에서의 마디 없는(nodeless) 초전도 갭과 약 70 meV 에너지에서의 전자-보손 결합 킹크(kink)를 관측하였습니다.", "implication": "니켈산염의 초전도 매개 메커니즘에 대한 실험적 근거를 제시하며, 구리산염과는 다른 pairing 대칭성의 가능성을 열었습니다.", "novelty": "극저온 퀜칭 기술을 적용하여 불안정한 박막 시료의 초전도 상태를 성공적으로 ARPES로 측정해낸 기술적 성과가 돋보입니다.", "unresolved": "관측된 전자-보손 결합이 정확히 어떤 종류의 보손(포논, 마그논 등)에 의한 것인지에 대한 논쟁이 남습니다.", "future_work": "보손 모드의 에너지와 위상 정보를 정밀화하는 후속 연구와 온도 변화에 따른 갭 폐쇄 거동 조사가 필요합니다.", "concepts": [{"term": "Ruddlesden-Popper 이중층 니켈산염", "why_emerged": "구리산염의 전성기 이후, 유사한 전이 금속 산화물 기반의 고온 초전도체 탐색 과정에서 설계된 구조.", "origin": "최근 보고된 La3Ni2O7 시스템을 기점으로 함.", "connections": "구리산염(cuprates), 전이 금속 산화물, 강상관계 물리학."}, {"term": "전자-보손 결합(kink)", "why_emerged": "분산 관계의 굴절(kink)을 통해 초전도를 유도하는 입자가 무엇인지 추적하기 위해 도입됨.", "origin": "초기 구리산염 ARPES 연구에서 널리 알려짐.", "connections": "엘리아슈베르그 이론, 포논-전자 상호작용."}], "english_summary": ["ARPES measurements of (La,Pr,Sm)3Ni2O7 superconducting thin films.", "Observed a nodeless superconducting gap and a kink indicating electron-boson coupling.", "Provides key insights into the pairing mechanism of bilayer nickelate superconductors.", "Success in applying cryogenic quenching techniques for high-quality ARPES data."]}}, {"title": "Efficient spin-pumping and spin transport across epitaxial Mn3Sn(0001) noncollinear antiferromagnet/permalloy interfaces (npj Spintronics)", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2508.02415", "authors": "Surya N. Panda, Ning Mao, Nikolai Peshcherenko, et al.", "last_authors": "Claudia Felser, Edouard Lesne", "summary": "arXiv:2508.02415v2 Announce Type: replace Abstract: The generation and control of spin currents are crucial for advancing next-generation spintronic technologies. These technologies depend on materials capable of efficiently sourcing and interconverting spin and charge currents, while overcoming some limitations associated with conventional ferromagnets and heavy metals. Kagome topological antiferromagnetic Weyl semimetals, such as Mn3Sn, present unique advantages owing to their distinct magnetic order and significant Berry curvature-driven transport phenomena. In this study, we systematically investigate spin current generation and spin-to-charge conversion phenomena in epitaxial (0001)-oriented Mn$_3$Sn thin films. Our findings reveal a spin Hall angle of 0.9$\\%$ and a nearly isotropic in-plane spin Hall conductivity of ~44.4 ($\\hbar$/e) $\\Omega^{-1}$.cm$^{-1}$ at room temperature, originating from a combination of intrinsic and extrinsic contributions, as discussed in light of first-principle calculations. Furthermore, in Mn$_3$Sn(0001)/Ni$_{81}$Fe$_{19}$ heterostructures, we observe a high spin-mixing conductance of 28.52 nm$^{-2}$ and an interfacial spin-transparency of approximately 72$\\%$. Notably, we also find that the spin diffusion length in Mn$_3$Sn(0001) epitaxial films exceeds 15 nm at room temperature. Our results highlight the potential, and limitations, of the topological Weyl noncollinear antiferromagnet Mn$_3$Sn as an efficient material for spin transport and conversion in prospective spintronic applications.", "tier": "B_IMPORTANT_CONDMAT", "score": "9", "reason": "Topological kagome antiferromagnet Mn3Sn is highly relevant to experimental electronic structure and transport.", "tags": ["material", "kagome", "transport"], "image": "https://arxiv.org/static/browse/0.3.4/images/arxiv-logo-fb.png", "briefing": {"background": "차세대 스핀트로닉스 소자 개발을 위해 스핀 전류를 효율적으로 생성하고 제어하는 소재 연구가 필수적입니다. 기존 강자성체나 중금속의 한계를 극복하기 위해 비콜리니어(noncollinear) 반강자성체와 같은 위상 물질이 주목받고 있습니다.", "motivation": "위상적 카고메 반강자성체인 Mn3Sn은 독특한 자기 구조와 베리 곡률(Berry curvature)을 가지고 있어, 이를 활용한 스핀-전하 변환 효율과 스핀 수송 특성을 실험적으로 확인하고자 했습니다.", "result": "Mn3Sn(0001) 박막에서 상온 스핀 홀 각도 0.9%, 스핀 혼합 컨덕턴스 28.52 nm^-2, 계면 스핀 투명도 72%라는 높은 수치를 확인했습니다. 또한 15 nm 이상의 스핀 확산 길이를 보여 스핀 소자로서의 가능성을 입증했습니다.", "implication": "Mn3Sn이 기존의 전이금속 기반 스핀 소자를 대체할 수 있는 효율적인 소재임을 시사하며, 비콜리니어 반강자성체가 위상 물리학 기반의 스핀트로닉스 응용에 핵심적인 역할을 할 수 있음을 보여줍니다.", "novelty": "Mn3Sn의 위상적 성질과 비콜리니어 자기 구조가 결합된 실질적인 스핀 수송 파라미터를 정량적으로 제시했습니다. Mn3Sn을 연구하는 카고메 격자 전문가들에게 스핀트로닉스 소자 최적화 지표를 제공합니다.", "unresolved": "내인성 및 외인성 기여도에 대한 정밀한 분리와, 보다 복잡한 다층 구조에서의 계면 결함이 스핀 수송에 미치는 영향은 명확히 규명되지 않았습니다.", "future_work": "다른 위상적 카고메 물질과의 계면 연구 및 초고속 스핀 스위칭을 구현하기 위한 동적 스핀 응답 측정 실험이 필요합니다.", "concepts": [{"term": "Mn3Sn", "why_emerged": "Weyl 반금속 특성을 가진 카고메 반강자성체로서 거대 변칙 홀 효과를 보임.", "origin": "Nakatsuji 그룹에 의해 2015년 큰 변칙 홀 효과가 발견됨.", "connections": "Mn3Ge, Co3Sn2S2 등 여타 위상적 카고메 물질과 비교 연구됨."}, {"term": "Spin-mixing conductance", "why_emerged": "강자성체와 비강자성체 계면에서 스핀 전류의 투과 효율을 정량화하기 위해 도입됨.", "origin": "Brataas et al. (2000) 등 이론적 정립.", "connections": "스핀 펌핑(Spin pumping) 및 스핀 토크 효율 계산의 핵심 변수."}], "english_summary": ["Epitaxial Mn3Sn(0001) thin films demonstrate efficient spin-to-charge conversion.", "High spin-mixing conductance of 28.52 nm^-2 and long spin diffusion length (>15 nm) are observed at room temperature.", "Findings suggest topological noncollinear antiferromagnets are competitive candidates for spintronic applications.", "The study provides quantitative benchmarking for Mn3Sn-based heterostructures."]}}, {"title": "Geometry-Driven Magnetoelectric Coupling in Two-Dimensional Compensated Ferrimagnets", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2607.00997", "authors": "Peibo Xu, Yixuan Che, Haifeng Lv, Xiaojun Wu, Jinlong Yang", "last_authors": "Xiaojun Wu, Jinlong Yang", "summary": "arXiv:2607.00997v1 Announce Type: new Abstract: The magnetoelectric coupling in compensated magnets enables stray-field-free manipulation of spin-splitting, holding great promise for spintronics, but inherently hindered by the symmetry mismatch between spatial-inversion-broken ferroelectricity and time-reversal-broken spin states. Here, based on a symmetry-decoupled analysis of magnetoelectric coupling in compensated magnets, we establish a geometry-driven spin-ferroelectric coupling mechanism in bilayer breathing kagome lattices. Within this geometric framework interlocking the out-of-plane electric polarization with cooperative intralayer structural distortions, we demonstrate that polarization switching drives a deterministic reversal of the global spin splitting. First-principles calculations on a prototype bilayer Nb3Cl8 successfully validate this mechanism, demonstrating the switching of spin-splitting states through an energetically feasible, asynchronous layer-by-layer transition pathway. Our proposed coupling originates from lattice geometry and structural symmetry, establishing a unique route toward switchable spin splitting in compensated ferrimagnets.", "tier": "B_IMPORTANT_CONDMAT", "score": "9", "reason": "Directly relevant to kagome lattices and magnetic topological materials of high interest.", "tags": ["kagome", "magnetism", "topology"], "image": "https://arxiv.org/static/browse/0.3.4/images/arxiv-logo-fb.png", "briefing": {"background": "스핀 분할(spin-splitting)을 소산 없이 제어하는 기술은 차세대 메모리 소자의 핵심입니다. 그러나 위상학적으로 반전된 자기 상태와 강유전성의 대칭성 부조화가 이 둘을 결합하는 데 걸림돌이 되어 왔습니다.", "motivation": "격자 구조의 기하학적 형상을 이용해 대칭성 제약 문제를 극복하고, 구조적 왜곡을 통해 스핀 분할 상태를 결정론적으로 전환하는 새로운 메커니즘을 제안하고자 했습니다.", "result": "이중층 브리딩 카고메 격자(breathing kagome lattice)에서 면외 전기 분극과 격자 왜곡이 결합된 '기하학적 스핀-강유전 결합'을 발견했습니다. Nb3Cl8 모델 시스템에서 분극 스위칭이 스핀 분할 반전을 유도함을 증명했습니다.", "implication": "강유전성과 자기적 스핀 분할을 직접 연결하는 새로운 스위칭 경로를 제시했습니다. 이는 전기장을 통한 자기 상태의 결정론적 제어를 가능하게 하여 저전력 spintronics의 새로운 지평을 엽니다.", "novelty": "복잡한 전자 상관관계 없이 오직 '기하학적 대칭성'만으로 스핀 분할을 제어하는 원리를 제시한 점이 핵심입니다. 카고메 격자 물리학과 강유전성을 결합한 매우 우아한 기하학적 접근입니다.", "unresolved": "실제 실험적 박막 합성에서 이중층 간의 결합 세기 및 층별 스위칭 속도 조절에 대한 구체적인 공정 변수는 아직 연구가 필요합니다.", "future_work": "Nb3Cl8과 같은 이중층 카고메 물질에서 실제 전기적 스위칭을 통한 스핀 분할 측정(예: 광전자 분광법) 실험이 필요합니다.", "concepts": [{"term": "Breathing kagome lattice", "why_emerged": "카고메 격자의 단위 세포 내에서 결합 길이가 서로 다른 왜곡을 도입하여 대칭성을 조절하고자 도입됨.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "카고메 물질 내 위상적 밴드 구조 변형 연구와 연결됨."}, {"term": "Magnetoelectric coupling", "why_emerged": "전기장으로 자기적 특성을 조절하여 전력 소비를 최소화하기 위해 연구됨.", "origin": "Dzyaloshinskii와 Astrov 등의 고전적 연구.", "connections": "Multiferroics 및 최근의 위상 자성체와 결합하여 큰 주목을 받음."}], "english_summary": ["A new mechanism for geometry-driven magnetoelectric coupling is proposed in bilayer breathing kagome lattices.", "Structural distortion enables deterministic reversal of spin-splitting states via polarization switching.", "First-principles simulations on Nb3Cl8 confirm the asynchronous layer-by-layer transition pathway.", "The approach provides a new route for stray-field-free spintronic devices."]}}, {"title": "Coexistence of liquid-like disordered state and weak ferromagnetism in a s = 1 kagome lattice", "journal": "npj_QuantumMaterials", "source": "Gemini", "link": "https://www.nature.com/articles/s41535-026-00917-0", "authors": "J. Khatua, Taeyun Kim, Chanhyeon Lee, et al.", "last_authors": "Hiroyuki Nojiri, Kwang-Yong Choi", "summary": "npj Quantum Materials, Published online: 29 June 2026; doi:10.1038/s41535-026-00917-0 Coexistence of liquid-like disordered state and weak ferromagnetism in a s = 1 kagome lattice", "tier": "B_IMPORTANT_CONDMAT", "score": "9", "reason": "Kagome lattice physics is highly relevant to user's electronic structure interests.", "tags": ["kagome", "magnetism", "strongly-correlated"], "image": "https://pubads.g.doubleclick.net/gampad/ad?iu=/285/npjquantmats.nature.com/article&sz=728x90&c=1100990910&t=pos%3Dtop%26type%3Darticle%26artid%3Ds41535-026-00917-0%26doi%3D10.1038/s41535-026-00917-0%26subjmeta%3D119,639,766,997%26kwrd%3DCondensed-matter+physics,Magnetic+properties+and+materials", "briefing": {"background": "S=1 카고메 격자는 강한 기하학적 좌절(geometric frustration)로 인해 일반적인 자기 정렬이 억제되고 양자 액체 상태와 같은 이국적인 양자 상태가 나타날 가능성이 높아 응집물질물리학의 주요 연구 대상입니다.", "motivation": "특정 S=1 카고메 물질에서 나타나는 액체와 같은 무질서 상태와 약한 강자성 간의 공존 현상이 과연 근본적인 물리 현상인지, 불순물에 의한 효과인지를 규명하고자 했습니다.", "result": "연구진은 s=1 카고메 격자 시스템에서 액체와 유사한 무질서 상태가 약한 강자성 정렬과 동시에 존재함을 관측했습니다. 이는 기존의 단순한 자기 정렬 모델로는 설명하기 어려운 복합적인 자기 상호작용의 증거입니다.", "implication": "좌절된 자기 시스템에서 무질서와 정렬이 어떻게 공존하고 경쟁하는지에 대한 새로운 시각을 제공합니다. 강한 상관관계를 가진 전자계의 양자 위상을 이해하는 데 중요한 단서가 됩니다.", "novelty": "S=1 카고메 시스템에서의 무질서 상태 공존은 희귀한 현상으로, 양자 액체 상태의 이해를 넓히는 기여를 합니다. 특히 카고메 금속의 위상 물리학 연구자들에게 흥미로운 상관관계 정보를 제공합니다.", "unresolved": "이러한 공존 상태가 물질의 순도에 따른 것인지, 아니면 카고메 격자 고유의 양자적 좌절이 원인인지에 대한 논쟁은 여전히 남아있을 가능성이 큽니다.", "future_work": "저온 중성자 산란 실험을 통해 자기 스핀 동역학의 기원을 보다 상세히 조사할 필요가 있습니다.", "concepts": [{"term": "Geometric frustration", "why_emerged": "삼각형 기반 격자 구조에서 모든 스핀을 만족시키는 반강자성 결합이 불가능하여 에너지가 최소화되지 못하는 현상을 설명하기 위해 도입됨.", "origin": "G. H. Wannier (1950) 등에 의해 이론적 정립.", "connections": "양자 스핀 액체(Quantum Spin Liquid) 이론과 깊은 연관."}, {"term": "S=1 Kagome lattice", "why_emerged": "S=1/2 격자와는 다른 스핀-궤도 결합 및 자기적 이방성을 탐구하기 위해 중요함.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "자기적 위상 절연체 및 강한 상관관계 물질 연구."}], "english_summary": ["A liquid-like disordered state is found to coexist with weak ferromagnetism in an S=1 kagome lattice.", "The study investigates the complex magnetic nature of frustrated kagome systems.", "Results challenge traditional models of magnetic ordering in frustrated geometries.", "The work serves as a reference for researchers exploring correlated electrons in kagome structures."]}}, {"title": "Field-free Josephson diode and tunable ϕ0-junction in chiral kagome antiferromagnets", "journal": "npj_QuantumMaterials", "source": "Gemini", "link": "https://www.nature.com/articles/s41535-026-00907-2", "authors": "Jin-Xing Hou, Chuang Li, Lun-Hui Hu, Song-Bo Zhang", "last_authors": "Lun-Hui Hu, Song-Bo Zhang", "summary": "npj Quantum Materials, Published online: 17 June 2026; doi:10.1038/s41535-026-00907-2 Field-free Josephson diode and tunable ϕ 0 -junction in chiral kagome antiferromagnets", "tier": "B_IMPORTANT_CONDMAT", "score": "9", "reason": "Kagome magnetism directly aligns with user's research interests in topological quantum materials.", "tags": ["kagome", "antiferromagnetism", "topology"], "image": "https://pubads.g.doubleclick.net/gampad/ad?iu=/285/npjquantmats.nature.com/article&sz=728x90&c=-1933539904&t=pos%3Dtop%26type%3Darticle%26artid%3Ds41535-026-00907-2%26doi%3D10.1038/s41535-026-00907-2%26subjmeta%3D301,639,766%26kwrd%3DMaterials+science,Physics", "briefing": {"background": "카고메 격자 시스템은 기하학적 좌절과 위상적 밴드 구조가 결합하여 비자명한 양자 상태를 생성하는 물리 현상의 핵심 연구 분야입니다.", "motivation": "카고메 반강자성체에서 나타나는 카이랄 대칭성 파괴를 이용하여 외부 자기장 없이 조셉슨 다이오드 효과를 구현하고 위상차를 조절하는 메커니즘을 탐구합니다.", "result": "카이랄 카고메 반강자성체 구조에서 외부 자기장 없이 조셉슨 접합의 정류 효과와 가변적 파이-제로(phi-0) 접합 특성을 이론적으로 입증했습니다.", "implication": "자기장 없이 작동하는 초전도 소자의 설계 가능성을 제시하며, 위상 양자 컴퓨터와 같은 미래 초전도 회로 소자 구현에 중요한 이론적 토대가 됩니다.", "novelty": "외부 자기장의 인가가 필연적이었던 기존의 조셉슨 다이오드 연구와 달리, 물질 고유의 카이랄성에 기반한 자발적 효과를 다루어 카고메 관련 위상 물리 연구자와 밀접합니다.", "unresolved": "실제 실험에서의 재료 합성 정밀도와 결함이 나타내는 정류 효율의 저하 가능성은 여전히 숙제로 남아 있습니다.", "future_work": "실제 실험 플랫폼에서의 조셉슨 접합 소자 제작 및 저온 전류-전압 측정 결과를 통한 현상 검증이 필요합니다.", "concepts": [{"term": "조셉슨 다이오드", "why_emerged": "초전도 회로에서 전류의 흐름 방향에 비대칭성을 부여하여 비가역적 소자를 만들기 위해 고안되었습니다.", "origin": "초전도 정류 효과는 최근 여러 위상 물질 연구 그룹에서 본격적으로 다뤄지기 시작했습니다.", "connections": "위상 절연체, 비대칭 초전도 접합 연구와 연결됩니다."}, {"term": "카이랄 카고메 반강자성체", "why_emerged": "카고메 격자의 기하학적 특징과 반강자성 스핀 배열이 결합되어 위상적 물성을 극대화하기 위해 연구됩니다.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "AV3Sb5계열 메탈, 팽창된 격자 물성 연구와 연결됩니다."}], "english_summary": ["Explores field-free Josephson diode effects in chiral kagome antiferromagnets.", "Demonstrates tunable phi-0 junction properties without external magnetic fields.", "Advances potential applications for non-reciprocal superconducting quantum circuits."]}}, {"title": "Observation of a saddle-loop van Hove singularity", "journal": "npj_QuantumMaterials", "source": "Gemini", "link": "https://www.nature.com/articles/s41535-026-00905-4", "authors": "Y. Morita, K. Nakayama, N. Ito, et al.", "last_authors": "K. Kudo, T. Sato", "summary": "npj Quantum Materials, Published online: 25 June 2026; doi:10.1038/s41535-026-00905-4 Observation of a saddle-loop van Hove singularity", "tier": "B_IMPORTANT_CONDMAT", "score": "9", "reason": "Van Hove singularities are crucial for electronic structure/ARPES interpretation in kagome and related systems.", "tags": ["ARPES", "electronic-structure", "van-hove-singularity"], "image": "https://pubads.g.doubleclick.net/gampad/ad?iu=/285/npjquantmats.nature.com/article&sz=728x90&c=-1535516039&t=pos%3Dtop%26type%3Darticle%26artid%3Ds41535-026-00905-4%26doi%3D10.1038/s41535-026-00905-4%26subjmeta%3D301,639,766%26kwrd%3DMaterials+science,Physics", "briefing": {"background": "고체 물리학에서 밴드 구조의 밀도 상태(DOS)가 급격히 변하는 반-호프 특이점(vHS)은 강상관 전자계와 초전도성 발현의 핵심 원동력입니다.", "motivation": "기존의 점(point) 형태가 아닌 새로운 형태의 밴드 구조 기하학을 가지는 '안장-루프(saddle-loop)' 형태의 반-호프 특이점을 관측하고자 합니다.", "result": "ARPES 측정을 통해 기존의 표준적인 반-호프 특이점과는 다른 확장된 에너지 분포를 가진 안장-루프 구조를 실험적으로 확인했습니다.", "implication": "물질의 페르미 준위 근처에서 상태 밀도를 높이는 새로운 기전이 발견됨으로써, 해당 물질군의 초전도 전이 온도 제어 및 전자 상관 관계 모델링이 수정되어야 함을 시사합니다.", "novelty": "ARPES/CD-ARPES 데이터 해석에 있어 필수적인 밴드 구조의 토폴로지를 구체화했으며, AV3Sb5 등 카고메 금속의 밴드 구조 이해에 직접적인 단서를 제공합니다.", "unresolved": "이 안장-루프 구조가 실제 페르미 준위에서의 강상관 현상과 정확히 어떻게 상호작용하는지에 대한 동역학적 정보는 더 필요합니다.", "future_work": "다른 유사 구조체에서의 안장-루프 존재 여부 조사 및 대응되는 초전도 특성과의 상관관계 분석이 필요합니다.", "concepts": [{"term": "반-호프 특이점(vHS)", "why_emerged": "결정 구조 내 에너지 분산 관계(E-k)에서 상태 밀도가 발산하거나 불연속적인 거동을 보이는 지점을 이해하기 위해 도입되었습니다.", "origin": "Léon Van Hove (1953년).", "connections": "전이 금속 디칼코게나이드 및 카고메 금속의 전자 구조 연구."}, {"term": "ARPES", "why_emerged": "물질 내부의 전자 에너지와 운동량 관계(밴드 구조)를 직접 시각화하기 위해 개발되었습니다.", "origin": "광전 효과를 기초로 하며 1960년대 이후 발전.", "connections": "퀀텀 물질의 위상 상태 확인의 핵심 도구."}], "english_summary": ["Reports the discovery of a novel saddle-loop van Hove singularity.", "Uses ARPES to confirm the extended geometric features of the electronic band structure.", "Crucial for interpreting high-density states in correlated kagome systems."]}}, {"title": "Family of magnetic field-boosted superconductors in rhombohedral graphene", "journal": "Nature", "source": "Gemini", "link": "https://www.nature.com/articles/s41586-026-10815-x", "authors": "Junseok Seo, Armel A. Cotten, Shenyong Ye, et al.", "last_authors": "Dominik M. Zumbühl, Long Ju", "summary": "Nature, Published online: 29 June 2026; doi:10.1038/s41586-026-10815-x Family of magnetic field-boosted superconductors in rhombohedral graphene", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "High-quality experimental study on correlated electron systems in graphene.", "tags": ["graphene", "superconductivity", "correlated-electrons"], "image": "https://pubads.g.doubleclick.net/gampad/ad?iu=/285/nature.com/article&sz=728x90&c=1340135866&t=pos%3Dtop%26type%3Darticle%26artid%3Ds41586-026-10815-x%26doi%3D10.1038/s41586-026-10815-x%26techmeta%3D120%26subjmeta%3D1003,119,639,766,995%26kwrd%3DElectronic+properties+and+materials,Superconducting+properties+and+materials", "briefing": {"background": "그래핀을 기반으로 한 모아레 시스템이나 적층 구조에서는 평탄한 밴드(flat band)가 형성되어 강한 전자 상관 효과가 나타나는 연구가 활발합니다.", "motivation": "능면체(Rhombohedral) 적층 그래핀에서 자기장을 가했을 때 초전도성이 강화되는 특이 현상을 연구합니다.", "result": "자기장 인가가 오히려 초전도 상태를 촉진하는 새로운 계열의 물질군을 발견하였으며, 이는 일반적인 초전도 파괴 효과와는 상반된 결과입니다.", "implication": "기존의 자기장 비적합형 초전도성 모델을 넘어, 강상관 전자계에서 자기장이 상태의 안정화에 기여할 수 있는 새로운 메커니즘 가능성을 보여줍니다.", "novelty": "반데르발스 이종접합 분야에서 자기장 제어를 통한 위상 및 초전도 제어의 새로운 사례를 제공하며, 일반적인 2D 재료 연구자와 가치가 있습니다.", "unresolved": "자기장에 의해 초전도성이 부스트되는 정확한 미시적 메커니즘(궤도 효과 vs 스핀 효과)은 추가적인 규명이 필요합니다.", "future_work": "이 계열 물질의 페르미 표면 측정과 온도 의존적 상전이 분석이 이어져야 합니다.", "concepts": [{"term": "적층 그래핀(Rhombohedral graphene)", "why_emerged": "그래핀 층들의 쌓임 방식에 따라 밴드 구조를 제어하여 새로운 물성을 유도하기 위해 연구됩니다.", "origin": "그래핀 연구 초기부터 구조적으로 정의됨.", "connections": "트위스티드 이중층 그래핀, 2D 층상 물질 연구."}, {"term": "자기장 부스팅 초전도", "why_emerged": "통상적인 초전도체가 자기장에서 파괴되는 것과 달리 특정 조건에서 오히려 활성화되는 비전통적 현상을 설명하기 위해 사용됩니다.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "강상관 전자계, 비전통적 초전도성."}], "english_summary": ["Identifies a family of superconductors in rhombohedral graphene where superconductivity is boosted by magnetic fields.", "Challenges conventional understanding of superconducting state stability in magnetic environments.", "Provides significant insight into correlated electron behavior in 2D van der Waals materials."]}}, {"title": "Surface d-orbital order in an intermetallic compound", "journal": "Nature_Physics", "source": "Gemini", "link": "https://www.nature.com/articles/s41567-026-03359-4", "authors": "Zhanyang Hao, Haohao Sheng, Wanru Ma, et al.", "last_authors": "Zhijun Wang, Chaoyu Chen", "summary": "Nature Physics, Published online: 29 June 2026; doi:10.1038/s41567-026-03359-4 Whether orbital order can exist with a clear band-structure fingerprint in correlated materials has remained unresolved. Now an orbital order from rare earth 5d electrons without structural or magnetic order is seen in an intermetallic compound.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Orbital order in intermetallics is highly relevant to electronic structure research.", "tags": ["orbitalorder", "electronicstructure", "correlated"], "image": "https://media.springernature.com/m685/springer-static/image/art%3A10.1038%2Fs41567-026-03359-4/MediaObjects/41567_2026_3359_Fig1_HTML.png", "briefing": {"background": "상관관계가 강한 물질에서 궤도 정렬(orbital order)은 전자 구조와 물성을 결정짓는 핵심 요소이나, 격자 왜곡이나 자기 정렬 없이 순수하게 궤도 자유도만으로 질서가 형성되는지를 확인하는 것은 실험적으로 매우 어려운 난제였습니다.", "motivation": "본 연구는 희토류 금속간 화합물에서 구조적, 자기적 상전이 없이 오직 5d 전자 궤도의 정렬만으로 나타나는 전자 구조의 변화를 관측하고자 하였습니다.", "result": "ARPES 등을 통해 관측 가능한 명확한 밴드 구조 변화(fingerprint)를 동반한 궤도 정렬을 확인하였으며, 이는 기존의 구조적/자기적 질서와 분리된 새로운 유형의 양자 질서임을 규명했습니다.", "implication": "강상관 전자계에서 궤도 자유도가 독립적인 질서 변수(order parameter)로 작용할 수 있음을 입증하며, 향후 궤도 기반의 양자 제어 연구의 가능성을 열었습니다.", "novelty": "구조적 대칭성 파괴를 수반하지 않는 궤도 정렬을 실험적으로 포착한 점이 핵심입니다. 사용자 관심사인 AV3Sb5 등 kagome 금속의 전자 구조 연구에 있어 순수 궤도 질서의 가능성을 고려할 때 중요한 참조가 됩니다.", "unresolved": "이 궤도 정렬의 미시적인 형성 기작(예: 쿨롱 상호작용 vs 기타 다체 효과)이 완전히 규명되지는 않았습니다.", "future_work": "온도 변화에 따른 상전이 특성 조사 및 타 희토류 화합물로의 범용성 확대 실험이 필요합니다.", "concepts": [{"term": "Orbital Order", "why_emerged": "강상관 전자계에서 전자의 궤도 자유도가 특정 방향으로 정렬되어 시스템의 대칭성을 낮추는 현상을 설명하기 위해 등장했습니다.", "origin": "Kugel과 Khomskii(1973) 등이 제안했습니다.", "connections": "Nematicity, Jahn-Teller 효과, 다체 상호작용 등과 밀접합니다."}, {"term": "Intermetallic Compound", "why_emerged": "서로 다른 금속 원소 간의 화합을 통해 금속성 질서와 강한 상관관계가 공존하는 플랫폼을 찾기 위해 주목받았습니다.", "origin": "초록 정보만으로는 특정하기 어렵습니다.", "connections": "희토류 화합물, Heavy Fermion 시스템과 연결됩니다."}], "english_summary": ["Demonstrated the existence of pure orbital order in an intermetallic compound.", "Identified a clear band-structure fingerprint of 5d orbital order without structural or magnetic transitions.", "Provides experimental evidence for orbital-only electronic ordering in correlated materials.", "Suggests that orbital degrees of freedom can act as primary order parameters in quantum materials."]}}, {"title": "DC spin current driven by low-frequency light in altermagnets", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/3j6x-397h", "authors": "Yihua Xiao, Ruizhi Dong, Xiaomu Wang, Ruixiang Fei", "last_authors": "Xiaomu Wang, Ruixiang Fei", "summary": "Author(s): Yihua Xiao, Ruizhi Dong, Xiaomu Wang, and Ruixiang Fei Efficient generation of DC spin-polarized currents via light is a promising route toward ultrafast spintronics, yet remains challenging. Here, we show that altermagnets, a class of antiferromagnets with symmetry-driven spin splitting, can generate DC spin currents via the nonlinear spin Hall effect.… [Phys. Rev. B 114, 014405] Published Wed Jul 01, 2026", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Theoretical prediction of DC spin current generation in altermagnets, a user-relevant topic.", "tags": ["theory", "altermagnetism", "spintronics", "Hall_effect"], "image": "", "briefing": {"background": "Altermagnet는 기존의 강자성(순자화 발생)이나 반강자성(스핀 분할 없음)과 달리, 특정 대칭성을 통해 스핀이 갈라지는(spin-split) 새로운 자기적 상태로, 차세대 spintronics 소자로 주목받고 있습니다.", "motivation": "Altermagnet의 독특한 대칭성 특성을 이용해 외부 빛을 통해 어떻게 효율적으로 DC 스핀 전류를 생성할 수 있을지 이론적으로 탐구하고자 하였습니다.", "result": "비선형 스핀 홀 효과(Nonlinear Spin Hall Effect)를 통해 저주파 빛 조사 시 DC 스핀 전류가 생성될 수 있음을 증명했습니다.", "implication": "초고속 광학적 제어가 가능한 새로운 spintronics 소자 설계의 이론적 근거를 마련했습니다.", "novelty": "Altermagnet의 비전통적인 자기 구조를 스핀 전류 생성 메커니즘과 직접 연결했다는 점에서 의미가 큽니다.", "unresolved": "실제 실험적 소자 구현에서의 효율성과 기판/계면 효과에 대한 정량적 분석은 아직 과제로 남아있습니다.", "future_work": "실제 altermagnet 후보 물질(예: RuO2 등)에서의 광학적 측정 및 소자 제작 실험이 예상됩니다.", "concepts": [{"term": "Altermagnetism", "why_emerged": "기존 반강자성체가 가졌던 스핀 분할 부재의 한계를 극복하고 새로운 자성적 성질을 규명하기 위해 제안되었습니다.", "origin": "2020년대 초반 Šmejkal, Jungwirth 등이 구체화하였습니다.", "connections": "Antiferromagnetism, Spin-orbit coupling, Hall effect와 연결됩니다."}, {"term": "Nonlinear Spin Hall Effect", "why_emerged": "선형 응답 범위 밖에서 비전통적인 자성 대칭성을 활용한 스핀 전류 생성 효율을 높이기 위해 도입되었습니다.", "origin": "초록 정보만으로는 특정하기 어렵습니다.", "connections": "Berry curvature dipole, Berry phase physics와 eakdown", "why_emerged": "Heavy-fermion 시스템에서 국소 모멘트와 전도 전자 간의 Kondo 일중항 상태가 붕괴하며 발생하는 양자 상전이를 설명하기 위해 도입되었습니다.", "origin": "Si, Coleman 등이 제안한 QCP 관련 이론에서 유래합니다.", "connections": "Quantum Criticality, Heavy-fermion superconductivity와 연결됩니다."}, {"term": "Flat-band", "why_emerged": "입자의 운동 에너지가 억제되어 상호작용 에너지가 지배적인 상태를 유도함으로써 강상관 효과를 극대화하기 위해 필요합니다.", "origin": "Bistritzer와 MacDonald(2011) 등의 Twisted bilayer graphene 연구가 촉매가 되었습니다.", "connections": "Strong correlation, Superconductivity와 밀접합니다."}], "english_summary": ["Theoretical study on flat-band induced Kondo breakdown in moiré superlattices.", "Explores reentrant quantum phases in van der Waals f-electron systems.", "Demonstrates the power of moiré platforms to simulate complex heavy-fermion physics.", "Provides insights into the interplay between band structure engineering and correlated electron states."]}}, {"title": "Magnetism and magnetoelastic effect in the two-dimensional van der Waals multiferroic CuCrP2S6", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/51ds-ph5b", "authors": "Jiasen Guo, Ryan P. Siebenaller, Michael A. Susner, Jiaqiang Yan, Zachary Morgan, Feng Ye", "last_authors": "Zachary Morgan, Feng Ye", "summary": "Author(s): Jiasen Guo, Ryan P. Siebenaller, Michael A. Susner, Jiaqiang Yan, Zachary Morgan, and Feng Ye The ordered moment direction in the van der Waals multiferroic CuCrP 2 S 6 remains unresolved despite growing research interest. Here, the authors have determined the ground-state magnetic structure using neutron diffraction, revealing that the ordered moments align along the crystallographic b axis with weak spin anisotropy. Magnetic field measurements further uncover a magnetoelastic coupling. This work provides firm basis for future magnetoelectric study and i n s i t u diffraction of strain-tunable magnetism in this two-dimensional magnet. [Phys. Rev. B 114, 014401] Published Wed Jul 01, 2026", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Experimental study of magnetism and magnetoelasticity in 2D van der Waals multiferroic.", "tags": ["material_2D", "van_der_Waals", "magnetism", "neutron_scattering"], "image": "", "briefing": {"background": "2차원 반데르발스 물질에서의 다강체(multiferroic) 특성은 전기적/자기적 자유도의 결합을 통해 차세대 소자 구현 가능성을 제시하여 주목받고 있습니다. CuCrP2S6는 이 분야에서 중요한 연구 대상입니다.", "motivation": "기존 연구에서 이 물질의 자기적 기저 상태인 스핀 정렬 방향이 명확히 규명되지 않아, 상세한 자기 구조를 결정하고자 중성자 회절 연구를 수행했습니다.", "result": "자기 모멘트가 결정학적 b축을 따라 정렬되어 있음을 확인하였으며, 자기장 인가 시 자기탄성 결합(magnetoelastic coupling) 현상이 존재함을 밝혔습니다.", "implication": "자기전기 효과 연구의 기초를 마련하였으며, 2차원 자성체에서 변형을 이용한 자기적 특성 제어 가능성을 시사합니다.", "novelty": "반데르발스 다강체의 미세한 자기 구조와 자기탄성 특성을 중성자 회절로 직접 규명하여 향후 응용 연구의 벤치마크를 제공했습니다.", "unresolved": "자기 이방성이 매우 약한데, 이러한 약한 이방성이 2차원 자성에서 스핀 들뜸 스펙트럼에 미치는 구체적인 영향은 더 연구가 필요합니다.", "future_work": "실시간(in-situ) 변형 제어 실험을 통한 자기적 상태의 동적 변조 연구가 기대됩니다.", "concepts": [{"term": "다강체", "why_emerged": "전기적 편극과 자기적 질서가 공존하여 두 자유도 간의 제어가 가능하기 때문에.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "스핀트로닉스, 강유전체, 자기전기 효과"}, {"term": "자기탄성 결합", "why_emerged": "자기 질서와 격자 구조 사이의 에너지를 최소화하려는 상호작용을 설명하기 위해.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "마그논-포논 결합, 압전 효과"}], "english_summary": ["Determined the magnetic ground state of the 2D van der Waals multiferroic CuCrP2S6 using neutron diffraction.", "Identified that magnetic moments align along the b axis with weak anisotropy.", "Observed magnetoelastic coupling under magnetic fields, offering potential for strain-tunable magnetism."]}}, {"title": "Quantitative thermodynamic study of superconducting and normal states in UTe2 under pressure", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/3xxl-tkqt", "authors": "T. Vasina, M. Pfeiffer, R. Borth, M. Nicklas, M. Amano Patino, G. Lapertot, J.-P. Brison, E. Hassinger, G. Knebel, and D. Braithwaite", "last_authors": "J.-P. Brison, E. Hassinger, G. Knebel, and D. Braithwaite", "summary": "Author(s): T. Vasina, M. Pfeiffer, R. Borth, nfrared spectroscopy under strong magnetic fields provides a powerful probe of Landau quantization and field-induced collective excitations, yet its full potential has long been constrained by the lack of in-situ polarization control, because the highly divergent infrared beam propagating through narrow light tubes undergoes multiple wall reflections, leading to severe polarization degradation. Here we report a collimated magneto-infrared spectroscopy system that integrates continuous in-situ polarimetry. The system employs incident and exit collimation chambers forming a Kepler type optical architecture, which converts the large-aperture FTIR output into a low-divergence beam and strongly suppresses multi-reflection trajectories inside long gold-plated light tubes, thereby enhancing both optical throughput and polarization fidelity. A remotely controlled polarization module, consisting of an automated linear polarizer and a switchable Fresnel rhomb positioned entirely outside the high-field region, enables continuous in-situ tuning between linear, circular, and arbitrary elliptical polarization states without thermal cycling, manual realignment, or breaking vacuum. Interchangeable compact focusing modules further support Faraday and Voigt geometries in both transmission and reflection experiments within a 50 mm magnet bore, providing efficient beam focusing and signal collection while maintaining polarization fidelity. The setup achieves a minimum root-mean-square noise of 0.0033%, an average noise of 0.0082%, and a linear polarization extinction ratio up to 40:1. We demonstrate the capability through continuous in-situ linear polarimetry and broadband circular polarimetry in the magneto-infrared spectroscopy of various single crystals. This platform establishes a robust experimental framework for in-situ polarization-resolved magneto-infrared spectroscopy.", "tier": "C_MAYBE", "score": "8", "reason": "Significant improvement to high-field magneto-infrared spectros
