<title>Daily Paper Slideshow</title>
<style>
  :root {
    color-scheme: light;
    --bg: #f6f7f4;
    --paper: #ffffff;
    --ink: #111827;
    --muted: #64748b;
    --line: #d8ddd2;
    --accent: #176b87;
    --accent-2: #9a3412;
  }
  * { box-sizing: border-box; }
  body { margin: 0; height: 100vh; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: var(--bg); color: var(--ink); }
  .shell { max-width: 1500px; height: 100vh; margin: 0 auto; padding: 14px 18px; display: flex; flex-direction: column; }
  .topbar { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 16px; }
  .top-actions { display: flex; align-items: center; gap: 10px; }
  .topbar a, button { border: 1px solid var(--line); border-radius: 8px; background: var(--paper); color: var(--ink); padding: 10px 14px; font-weight: 700; text-decoration: none; cursor: pointer; }
  button.primary { background: var(--accent); border-color: var(--accent); color: white; }
  button:disabled { opacity: 0.45; cursor: not-allowed; }
  .counter { color: var(--muted); font-weight: 700; }
  .slide { height: calc(100vh - 82px); background: var(--paper); border: 1px solid var(--line); border-radius: 10px; padding: 18px; box-shadow: 0 18px 42px rgba(15, 23, 42, 0.10); display: grid; grid-template-columns: minmax(310px, 0.86fr) minmax(0, 1.55fr); gap: 18px; overflow: hidden; }
  .paper-head { min-width: 0; overflow: hidden; display: flex; flex-direction: column; gap: 12px; }
  .figure { margin: 0; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: #f8fafc; }
  .figure img { display: block; width: 100%; max-height: 41vh; object-fit: contain; background: white; }
  .figure figcaption { padding: 7px 10px; color: var(--muted); font-size: 12px; line-height: 1.3; }
  .head-text { display: flex; flex-direction: column; gap: 9px; min-width: 0; }
  .badges { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .badge { border-radius: 999px; padding: 5px 9px; background: #eef2ff; color: #3730a3; font-size: 12px; font-weight: 800; }
  .score { background: #fee2e2; color: #991b1b; }
  h1 { margin: 0; font-size: 25px; line-height: 1.15; letter-spacing: 0; overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
  h1 a { color: inherit; text-decoration-color: rgba(23, 107, 135, 0.35); text-decoration-thickness: 2px; text-underline-offset: 4px; }
  h1 a:hover { color: var(--accent); text-decoration-color: var(--accent); }
  .meta, .authors, .why, .abstract { font-size: 13px; line-height: 1.45; }
  .meta, .authors { color: var(--muted); }
  .why strong, .abstract strong, .authors strong { color: var(--ink); }
  .authors { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .why { border-left: 4px solid var(--accent-2); padding-left: 10px; color: #374151; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .abstract { border-top: 1px solid var(--line); padding-top: 14px; color: #374151; }
  details.abstract-details { display: none; }
  details.abstract-details summary { cursor: pointer; color: var(--accent); font-weight: 800; margin-bottom: 8px; }
  .tags { display: flex; flex-wrap: wrap; gap: 8px; }
  .tag { border-radius: 999px; padding: 4px 8px; background: #f1f5f9; color: #475569; font-size: 12px; font-weight: 700; }
  .head-text > .link { display: none; }
  .briefing { min-width: 0; min-height: 0; overflow: hidden; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); grid-auto-rows: minmax(0, auto); gap: 11px 18px; border-top: 0; padding-top: 0; }
  .brief-section { min-width: 0; }
  .brief-section.wide { grid-column: 1 / -1; }
  .brief-section h2 { margin: 0 0 4px; font-size: 14px; line-height: 1.22; color: #0f766e; letter-spacing: 0; }
  .brief-section p, .brief-section li { margin: 0; font-size: 12.5px; line-height: 1.42; color: #1f2937; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .brief-section ul { margin: 0; padding-left: 20px; }
  .concepts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 9px 14px; }
  .concept { border-top: 1px solid var(--line); padding-top: 7px; }
  .concept h3 { margin: 0 0 4px; font-size: 13px; color: #7c2d12; letter-spacing: 0; }
  .concept p { margin: 2px 0 0; font-size: 11.5px; line-height: 1.35; color: #374151; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .concept b { color: #111827; }
  .link { color: var(--accent); font-weight: 800; text-decoration: none; }
  .empty { padding: 48px; background: var(--paper); border: 1px solid var(--line); border-radius: 12px; color: var(--muted); }
  @media (max-width: 860px) {
    body { height: auto; overflow: auto; }
    .shell { padding: 14px; }
    .topbar, .top-actions { align-items: stretch; flex-direction: column; }
    .slide, .briefing, .concepts { grid-template-columns: 1fr; }
    .slide { height: auto; overflow: visible; display: grid; }
    details.abstract-details { display: block; }
    h1 { font-size: 28px; }
  }
</style>

<script>
const slides = [{"title": "Equilibrium Stabilization of a Hidden Phase Like Metallic State in 1T-TaS2", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2605.22292", "authors": "Turgut Yilmaz, Anil Rajapitamahuni, Suji Park, Houk Jang, Asish K. Kundu, Elio Vescovo", "last_authors": "Asish K. Kundu, Elio Vescovo", "summary": "arXiv:2605.22292v1 Announce Type: new Abstract: Electronic phases that lie outside the equilibrium ground state offer a route to explore competing configurations in correlated materials. In 1T-TaS2, ultrafast excitation accesses a metallic hidden phase that is distinct from the commensurate insulating ground state. Here we use angle-resolved photoemission spectroscopy to show that an equivalent electronic configuration is stabilized in exfoliated intermediate-thickness 1T-TaS2 flakes, where it persists up to room temperature before evolving through a different sequence of electronic transitions. This equilibrium hidden-phase-like state hosts a metallic band with finite Fermi-level spectral weight while retaining the characteristic hybridization gaps associated with the star-of-David band folding. These results establish a platform for controlling competing electronic states in layered materials, with implications for both quantum science and phase change technologies.", "tier": "A_MUST_READ", "score": "10", "reason": "ARPES study of the metallic hidden phase in exfoliated 1T-TaS2 correlated flakes.", "tags": ["experimental", "method", "material", "correlated"], "image": "https://arxiv.org/html/2605.22292v1/x1.png", "briefing": {"background": "1T-TaS2는 전하 밀도파(CDW)와 모트(Mott) 절연체 특성이 결합된 대표적인 강상관 층상 물질입니다. 특히 초고속 광펄스 등을 통해 평형 상태에서는 나타나지 않는 이른바 '숨겨진 상(hidden phase)'으로 전이될 수 있음이 알려져 있으나, 대개 극저온에서만 유지되거나 일시적인 특성을 보입니다.", "motivation": "광학적 자극 없이 열역학적 평형 상태에서 이러한 금속성 숨겨진 상을 안정화할 수 있는 방법을 찾고, 그 전자 구조를 각분해 광전자 분광법(ARPES)으로 직접 규명하고자 하였습니다.", "result": "박리된 중간 두께의 1T-TaS2 플레이크에서 상온까지 유지되는 금속성 숨겨진 상 상태를 평형 상태에서 구현했습니다. ARPES 측정 결과, 이 상태는 '다윗의 별' 구조에 의한 하이브리드화 갭(hybridization gap)은 유지하면서도 페르미 레벨(Fermi level)에서 유한한 스펙트럼 강도를 갖는 금속 밴드를 형성함을 확인했습니다.", "implication": "숨겨진 상을 평형 상태에서 구현함으로써, 펌프-프로브(pump-probe) 방식이 아닌 일반적인 ARPES와 같은 정적 측정 기술로도 이 고유한 상의 전자 구조를 정밀하게 연구할 수 있게 되었습니다.", "novelty": "이 연구는 박리(exfoliation)와 두께 조절을 통해 비평형 상태의 전도성을 평형 상태로 가져왔다는 점에서 중요합니다. 독자의 관심사인 ARPES를 활용하여 1T-TaS2의 복잡한 상관 관계와 상전이 경로를 새로운 각도에서 조명했습니다.", "unresolved": "중간 두께 플레이크에서 왜 이러한 상이 안정화되는지에 대한 구체적인 메커니즘(변형력 또는 표면 효과 등)은 추가 규명이 필요합니다.", "future_work": "안정화된 금속 상의 두께 의존성 연구 및 이를 활용한 상전이 메모리 소자 등의 응용 연구가 기대됩니다.", "concepts": [{"term": "Hidden Phase", "why_emerged": "평형 상태의 상도표에서는 나타나지 않지만, 강한 섭동(빛 등)을 통해 도달할 수 있는 새로운 양자 상태를 설명하기 위해 등장했습니다.", "origin": "초록 정보만으로는 특정하기 어려우나, 1T-TaS2의 광유기 상전이 연구들에서 주로 확립되었습니다.", "connections": "Charge Density Wave (CDW), Mott Insulator, Photo-induced phase transition"}, {"term": "Star-of-David reconstruction", "why_emerged": "1T-TaS2의 저온 CDW 상태에서 13개의 Ta 원자가 클러스터를 형성하여 대칭성이 낮아지는 현상을 설명하기 위해 도입되었습니다.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "Commensurate CDW, Band folding, Hybridization gap"}, {"term": "Exfoliated Flakes", "why_emerged": "벌크 시료와는 다른 차원성이나 변형 효과를 통해 새로운 물성을 유도하기 위해 사용됩니다.", "origin": "그래핀의 발견(Andre Geim 등) 이후 2차원 물질 연구에서 보편화되었습니다.", "connections": "2D Materials, Van der Waals heterostructures, Strain engineering"}, {"term": "Fermi-level spectral weight", "why_emerged": "물질이 금속성을 띠는지, 혹은 갭이 형성되어 절연체인지 판단하기 위한 직접적인 척도로 사용됩니다.", "origin": "고체물리학의 밴드 이론 및 광전자 분광법에서 기원했습니다.", "connections": "ARPES, Density of States (DOS), Metal-Insulator Transition"}], "english_summary": ["Stabilization of a metallic hidden-phase-like state in exfoliated 1T-TaS2 flakes under equilibrium.", "ARPES characterization reveals coexistence of hybridization gaps and metallic Fermi-level weight.", "The phase persists up to room temperature, unlike transient light-induced states.", "Offers a new platform for controlling competing electronic phases in correlated 2D materials."]}}, {"title": "Superconductivity in kagome metals due to soft loop-current fluctuations (Nat. Commun.)", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2507.16892", "authors": "Daniel J. Schultz, Grgur Palle, Asimpunya Mitra, Yong Baek Kim, Rafael M. Fernandes, J\\\"org Schmalian", "last_authors": "Rafael M. Fernandes, J\\\"org Schmalian", "summary": "arXiv:2507.16892v2 Announce Type: replace Abstract: We demonstrate that soft fluctuations of translation symmetry-breaking loop currents provide a mechanism for unconventional superconductivity in kagome metals that naturally addresses the multiple superconducting phases observed under pressure. Focusing on the rich multi-orbital character of these systems, we show that loop currents involving both vanadium and antimony orbitals generate low-energy collective modes that couple efficiently to electrons near the Fermi surface and mediate attractive interactions in two distinct unconventional pairing channels. While loop-current fluctuations confined to vanadium orbitals favor chiral $d+id$ superconductivity, which spontaneously breaks time-reversal symmetry, the inclusion of antimony orbitals stabilizes an $s^{\\pm}$ state that is robust against disorder. We argue that these two states are realized experimentally as pressure increases and the antimony-dominated Fermi surface sheet undergoes a Lifshitz transition.", "tier": "A_MUST_READ", "score": "10", "reason": "Directly targets user's core interests: kagome metals, loop currents, and unconventional superconductivity mechanisms.", "tags": ["material", "kagome", "loop-current", "superconductivity"], "image": "https://arxiv.org/static/browse/0.3.4/images/arxiv-logo-fb.png", "briefing": {"background": "AV3Sb5 (A=K, Cs, Rb)와 같은 카고메 금속은 초전도성, 전하 밀도파(CDW), 그리고 시간 반전 대칭성 깨짐(TRSB)이 의심되는 루프 전류(loop current) 상태 등 다양한 양자 현상이 얽혀 있어 주목받고 있습니다.", "motivation": "카고메 금속에서 관찰되는 다중 초전도 상과 압력에 따른 상전이의 근본 원인을 루프 전류 요동(loop-current fluctuations) 관점에서 설명하고자 했습니다.", "result": "바나듐(V)과 안티모니(Sb) 오비탈을 모두 고려한 다중 오비탈 모델을 통해, 루프 전류의 '소프트 요동'이 비전통적 초전도성을 매개할 수 있음을 보였습니다. V 오비탈 중심의 요동은 시간 반전 대칭성을 깨는 $d+id$ 파동 초전도를, Sb 오비탈이 관여하면 불순물에 강한 $s^{\\pm}$ 파동 초전도를 선호함을 밝혔습니다.", "implication": "압력 증가에 따라 Sb 중심의 페르미 면이 리프시츠 전이(Lifshitz transition)를 겪으면서 $d+id$에서 $s^{\\pm}$로 초전도 대칭성이 바뀔 수 있음을 시사하며, 이는 실험적 관찰과 일치합니다.", "novelty": "루프 전류라는 독특한 질서 파라미터가 초전도 쌍 형성에 직접 기여한다는 이론적 메커니즘을 제시했습니다. 독자의 핵심 관심사인 AV3Sb5의 루프 전류 및 TRSB 문제를 직접적으로 다룹니다.", "unresolved": "이론적 모델이 제시하는 루프 전류 요동의 세기를 실제 실험에서 어떻게 정량적으로 측정할 것인지가 과제로 남습니다.", "future_work": "루프 전류의 대칭성에 따른 실험적 시그니처를 찾기 위한 분광학적 연구 및 압력 하에서의 위상 변화 관찰이 필요합니다.", "concepts": [{"term": "Loop-current fluctuations", "why_emerged": "카고메 격자에서 관찰되는 시간 반전 대칭성 깨짐을 설명하기 위한 질서 파라미터의 요동으로 제안되었습니다.", "origin": "C. M. Varma 등이 구리 산화물 초전도체에서 처음 제안한 개념을 카고메 시스템에 적용했습니다.", "connections": "Time-reversal symmetry breaking (TRSB), Chiral order, Unconventional superconductivity"}, {"term": "Kagome metals", "why_emerged": "기하학적 좌절(frustration)과 전하 밀도파, 초전도성이 공존하는 특이한 전자 구조를 연구하기 위해 부상했습니다.", "origin": "초록 정보만으로는 특정하기 어려우나, AV3Sb5 계열의 발견 이후 급격히 확산되었습니다.", "connections": "CsV3Sb5, Flat bands, Dirac nodes, Van Hove singularities"}, {"term": "Lifshitz transition", "why_emerged": "외부 압력이나 도핑에 의해 페르미 면의 위상학적 구조가 급격히 변하는 현상을 설명하기 위해 도입되었습니다.", "origin": "I. M. Lifshitz (1960)", "connections": "Fermi surface topology, Density of states anomaly, Phase transitions under pressure"}, {"term": "s+/- state", "why_emerged": "서로 다른 페르미 면 사이에서 부호가 바뀌는 초전도 질서 파라미터를 설명하기 위해 철 기반 초전도체 등에서 널리 쓰이게 되었습니다.", "origin": "철 기반 초전도체 연구(Igor Mazin 등)에서 확립되었습니다.", "connections": "Iron pnictides, Multi-band superconductivity, Chiral d-wave"}], "english_summary": ["Loop-current fluctuations mediate unconventional superconductivity in kagome metals.", "V-orbital fluctuations favor chiral d+id pairing with TRSB.", "Inclusion of Sb-orbitals stabilizes a disorder-robust s+/- state.", "The transition between phases is driven by a pressure-induced Lifshitz transition."]}}, {"title": "Topologically Driven Giant Effective Spin Mixing Conductance in Antiferromagnetic FeSn/Py Heterostructures", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2605.22180", "authors": "Kacho Imtiyaz Ali Khan, Nidhi Kandwal, Pankhuri Gupta, et al.", "last_authors": "Johan {\\AA}kerman, Pranaba Kishor Muduli", "summary": "arXiv:2605.22180v1 Announce Type: new Abstract: The topological semimetal FeSn antiferromagnet, characterized by its kagome lattice, two-dimensional flat bands, and Dirac-like surface states, holds immense promise for spintronic applications. In this work, for the first time, we investigate the spin pumping behavior in epitaxial-FeSn/Py (Ni$_{80}$Fe$_{20}$) heterostructures. We report a giant effective spin mixing conductance (g$^{\\uparrow \\downarrow}_{\\mathrm{eff}}$) of $(116\\pm 7)$~nm$^{-2}$, which is nearly one order of magnitude higher than that of standard Pt/Py heterostructures. The insertion of a 3 nm Al spacer layer results in a two-fold reduction in the effective damping, confirming the interfacial origin of the large g$^{\\uparrow\\downarrow}_{\\mathrm{eff}}$. Consistently, we observe an order-of-magnitude higher inverse spin Hall effect voltage in the FeSn/Py system compared to a reference Pt/Py film stack. We attribute the giant g$^{\\uparrow\\downarrow}_{\\mathrm{eff}}$ to the direct interfacing of the Py layer with the topologically active [001]-kagome surface of epitaxial-FeSn. These findings establish the critical role of topologically active interfaces for advanced quantum-material-based spintronic devices.", "tier": "A_MUST_READ", "score": "10", "reason": "Experimental spin transport in FeSn, a kagome topological semimetal featuring Dirac surface states.", "tags": ["experimental", "material", "kagome", "topology"], "image": "https://arxiv.org/html/2605.22180v1/Figure1.jpg", "briefing": {"background": "스핀트로닉스 분야에서는 스핀 정보를 전기적 신호로 효율적으로 변환하기 위해 스핀 혼합 전도도(spin mixing conductance)가 큰 물질을 탐색합니다. FeSn은 평탄 as a potent candidate for topological spintronic applications."]}}, {"title": "Altermagnetism, kagome flat band, and Weyl fermion states in magnetically intercalated transition metal dichalcogenides", "journal": "npj_QuantumMaterials", "source": "Gemini", "link": "https://www.nature.com/articles/s41535-026-00885-5", "authors": "Avinash Sah, Ting Yong Lim, Clayton Conner, et al.", "last_authors": "Pavlo Sukhachov, Guang Bian", "summary": "npj Quantum Materials, Published online: 09 May 2026; doi:10.1038/s41535-026-00885-5 Altermagnetism, kagome flat band, and Weyl fermion states in magnetically intercalated transition metal dichalcogenides", "tier": "A_MUST_READ", "score": "10", "reason": "Directly combines kagome physics, altermagnetism, and Weyl fermions—all core project interests.", "tags": ["theory", "kagome", "altermagnetism"], "image": "https://pubads.g.doubleclick.net/gampad/ad?iu=/285/npjquantmats.nature.com/article&sz=728x90&c=1475459320&t=pos%3Dtop%26type%3Darticle%26artid%3Ds41535-026-00885-5%26doi%3D10.1038/s41535-026-00885-5%26subjmeta%3D301,639,766%26kwrd%3DMaterials+science,Physics", "briefing": {"background": "자성체 분류에서 전통적인 강자성과 반강자성 외에, 최근 교차 스핀 대칭을 가지는 알터마그네티즘(Altermagnetism)이 주목받고 있습니다. 이는 순 자화량은 0이면서도 밴드 구조에서 운동량에 의존하는 스핀 갈라짐을 유도하여 스핀트로닉스 분야에서 매우 중요한 물리적 상태로 간주됩니다.", "motivation": "카고메(Kagome) 격자는 편평한 밴드(flat band)와 위상학적 특이점을 동시에 가질 수 있는 독특한 기하학적 구조입니다. 본 연구는 자성체가 삽입된 전이금속 디칼코게나이드(TMD) 시스템에서 알터마그네티즘과 카고메 격자의 전자 구조적 이점을 결합하여 새로운 양자 상태를 탐색하고자 했습니다.", "result": "연구진은 특정 자성 삽입 TMD 시스템에서 알터마그네티즘, 카고메 편평 밴드, 그리고 바일 페르미온(Weyl fermion) 상태가 공존할 수 있음을 이론적/계산적으로 제시한 것으로 보입니다. (초록 정보가 제한적이나 제목과 저널 성격상 이론적 예측에 무게가 실림)", "implication": "만약 이 결과가 실험적으로 확인된다면, 외부 자기장 없이도 위상학적 특성을 조절할 수 있는 알터마그네틱 위상 물질 설계가 가능해지며, 이는 고효율 스핀 소자 구현으로 이어질 수 있습니다.", "novelty": "독자의 핵심 관심사인 카고메 금속(AV3Sb5 등)의 물리와 최근 부상하는 알터마그네티즘을 결합했다는 점이 가장 큰 참신함입니다. 특히 위상학적 바일 페르미온 상태와의 연결 고리를 제시한 점이 중요합니다.", "unresolved": "이러한 상태를 실제로 구현하기 위한 구체적인 자성 원소 및 TMD 조합의 실험적 합성 난이도와 상온 안정성 여부는 초록만으로 판단하기 어렵습니다.", "future_work": "실제 ARPES 측정을 통해 알터마그네틱 밴드 갈라짐과 카고메 편평 밴드의 존재를 직접적으로 입증하는 연구가 뒤따를 것으로 예상됩니다.", "concepts": [{"term": "알터마그네티즘 (Altermagnetism)", "why_emerged": "강자성의 강점(스핀 갈라짐)과 반강자성의 강점(순 자화량 0, 빠른 동역학)을 동시에 갖는 제3의 자성을 설명하기 위해 등장했습니다.", "origin": "최근 Libor Šmejkal 등에 의해 이론적으로 체계화되었습니다.", "connections": "반강자성 스핀트로닉스, 비정상 홀 효과(AHE), 스핀 할 효과와 밀접하게 연관됩니다."}, {"term": "카고메 편평 밴드 (Kagome flat band)", "why_emerged": "격자 구조의 기하학적 간섭으로 인해 전자의 운동 에너지가 억제되어 강한 상관관계가 나타나는 상태를 연구하기 위해 필요합니다.", "origin": "기하학적 좌절 현상을 연구하는 응집물질 물리 분야에서 확립되었습니다.", "connections": "고온 초전도, 분수 양자 홀 효과, 상관 절연체 상태와 연결됩니다."}, {"term": "바일 페르미온 (Weyl fermion)", "why_emerged": "질량이 없는 디락 페르미온이 위상학적 보호를 받는 상태를 고체 물리에서 구현하기 위해 도입되었습니다.", "origin": "Hermann Weyl의 이론적 제안 이후 TaAs 등에서 실험적으로 발견되었습니다.", "connections": "카이랄 변칙(Chiral anomaly), 아크 표면 상태(Fermi arc), 위상 반금속과 연결됩니다."}], "english_summary": ["Explores the intersection of altermagnetism and kagome lattice physics in intercalated TMDs.", "Identifies the coexistence of flat bands and Weyl fermion states within a magnetic framework.", "Suggests a new platform for topological spintronics using momentum-dependent spin splitting."]}}, {"title": "Controlling correlations of a polaritonic Luttinger liquid by engineered cross-Kerr nonlinearity", "journal": "PRB_Recent", "source": "keyword", "link": "http://link.aps.org/doi/10.1103/yjtj-c22v", "authors": "Nabaneet Sharma, Anushree Dey, Bimalendu Deb", "last_authors": "Anushree Dey, Bimalendu Deb", "summary": "Author(s): Nabaneet Sharma, Anushree Dey, and Bimalendu Deb We study correlation properties of polaritons at zero temperature in a multiconnected Jaynes-Cummings lattice on a superconducting circuit quantum electrodynamics platform with engineered cross-Kerr nonlinearity that mimics attractive nearest-neighbor interaction. A multiconnected Jaynes-Cummings la… [Phys. Rev. B 113, 174520] Published Mon May 18, 2026", "tier": "A_MUST_READ", "score": "9", "reason": "title strong match: Luttinger liquid", "tags": ["Luttinger", "superconduct"], "image": "", "briefing": {"background": "1차원 계에서 상호작용하는 전자는 페르미 액체 이론이 아닌 러틴저 액체(Luttinger liquid) 이론으로 설명됩니다. 이는 준입자가 붕괴하고 스핀과 전하가 분리되는 독특한 상관관계를 보입니다.", "motivation": "전통적인 고체 물리 시스템이 아닌, 초전도 회로 QED 플랫폼에서 빛과 물질의 혼성 입자인 폴라리톤을 이용해 러틴저 액체의 상관관계를 인위적으로 제어할 수 있는 방법을 모색했습니다.", "result": "교차-커(cross-Kerr) 비선형성을 설계하여 인접한 격자 간의 인력 상호작용을 모사함으로써, 폴라리토닉 러틴저 액체의 상관 특성을 조절할 수 있음을 보였습니다.", "implication": "실제 응집물질 시스템에서 조절하기 어려운 상호작용 매개변수를 양자 시뮬레이터를 통해 정밀하게 제어하며 1차원 상관 물리 연구의 새로운 지평을 열 수 있습니다.", "novelty": "독자의 관심사인 러틴저 액체 물리를 초전도 회로 기반의 '엔지니어링된 비선형성'을 통해 구현했다는 점에서 기존의 재료 물리학적 접근과는 다른 신선한 시각을 제공합니다.", "unresolved": "폴라리톤의 유한한 수명이 0K 근처에서의 양자 상관관계 측정에 미치는 영향과 실제 실험 장치에서의 확장성 문제가 남아 있습니다.", "future_work": "실제 초전도 큐비트 어레이를 이용한 실험적 검증 및 더 복잡한 비선형 상호작용을 통한 다양한 비평형 양자 상태 탐구가 기대됩니다.", "concepts": [{"term": "러틴저 액체 (Luttinger liquid)", "why_emerged": "1차원 시스템에서 전자의 상호작용이 준입자 개념을 무너뜨리는 현상을 설명하기 위해 제안되었습니다.", "origin": "Joaquín Mazdak Luttinger(1963)에 의해 이론적 기초가 마련되었습니다.", "connections": "스핀-전하 분리, 1차원 나노와이어, 탄소 나노튜브 물리와 직결됩니다."}, {"term": "폴라리톤 (Polariton)", "why_emerged": "빛(광자)과 물질(여기자 등)의 강한 결합을 통해 나타나는 새로운 준입자를 다루기 위해 등장했습니다.", "origin": "J.J. Hopfield(1958) 등이 이론적으로 정립하기 시작했습니다.", "connections": "보즈-아인슈타인 응축, 비선형 광학, 초유체 상태와 연결됩니다."}, {"term": "교차-커 효과 (Cross-Kerr effect)", "why_emerged": "한 광학 모드의 위상이 다른 모드의 광자 수에 의해 변하는 비선형 현상을 제어하기 위해 필요합니다.", "origin": "비선형 광학 분야에서 정립되었습니다.", "connections": "양자 비파괴 측정, 양자 게이트 구현, 유효 상호작용 엔지니어링에 활용됩니다."}], "english_summary": ["Demonstrates control of 1D Luttinger liquid correlations in a polaritonic system.", "Uses engineered cross-Kerr nonlinearity to mimic attractive nearest-neighbor interactions.", "Provides a superconducting circuit QED platform for simulating long-range quantum correlations."]}}, {"title": "Emergence of a distinct density wave state in ultrathin VSe2 films", "journal": "PRB_Recent", "source": "author whitelist", "link": "http://link.aps.org/doi/10.1103/w4s8-fckc", "authors": "Sen Liao, Xiuhua Chen, Yuzhe Wang, et al.", "last_authors": "Donglai Feng, Juan Jiang", "summary": "Author(s): Sen Liao, Xiuhua Chen, Yuzhe Wang, Rui Xu, Jianghao Yao, Yilin Wang, Donglai Feng, and Juan Jiang Dimensionality critically governs correlated states, often inducing emergent ground states in reduced dimensions. While ${\\mathrm{VSe}}_{2}$ has been studied extensively, its monolayer ground state remains controversial. Here, we resolve these issues by investigating the thickness-dependent evolutio… [Phys. Rev. B 113, 195142] Published Thu May 21, 2026", "tier": "A_MUST_READ", "score": "9", "reason": "author whitelist: Donglai Feng", "tags": ["monolayer", "correlated"], "image": "", "briefing": {"background": "VSe2와 같은 층상 전이금속 디칼코게나이드에서 차원성(dimensionality)은 전하 밀도파(CDW)와 같은 상관 상태의 형성에 결정적인 역할을 합니다. 특히 단층(monolayer) 극한에서의 바닥 상태에 대해서는 학계의 의견이 분분합니다.", "motivation": "VSe2 초박막의 두께 변화에 따른 전자 구조와 밀도파 상태의 진화를 추적하여, 단층 및 수 층 박막에서 나타나는 특이한 양자 상태의 본질을 규명하고자 했습니다.", "result": "연구진은 초박막 VSe2에서 기존 벌크와는 구분되는 '독특한 밀도파 상태(distinct density wave state)'가 출현함을 발견하고, 이를 실험적으로 입증한 것으로 보입니다.", "implication": "2차원 극한에서 TMD 물질의 전하 질서(charge order)가 벌크와 어떻게 다른 메커니즘으로 형성되는지 이해하는 데 중요한 단서를 제공하며, 이는 2차원 소자 설계 시 전자 상태 제어의 기반이 됩니다.", "novelty": "독자의 관심 저자인 Feng Donglai(ARPES 전문가)의 연구로, ARPES나 STM 등을 활용해 VSe2의 논란이 되는 단층 바닥 상태를 명확히 규명하려 시도했다는 점이 핵심입니다.", "unresolved": "출현한 밀도파 상태의 구체적인 공간적 대칭성과 이것이 기판과의 상호작용에 의한 것인지, 혹은 순수하게 차원성 감소에 의한 것인지에 대한 추가 논의가 필요할 수 있습니다.", "future_work": "온도 가변 측정을 통한 CDW 상전이 거동의 정밀 분석 및 외부 변수(변형률 등)를 통한 새로운 밀도파 상태의 조절 가능성 연구가 예상됩니다.", "concepts": [{"term": "전하 밀도파 (CDW, Charge Density Wave)", "why_emerged": "전자-포논 상호작용이나 페르미 면 중첩(nesting)으로 인해 전하 밀도가 주기적으로 변조되는 현상을 설명하기 위해 도입되었습니다.", "origin": "Rudolf Peierls(1930년대)가 이론적 토대를 제공했습니다.", "connections": "금속-절연체 전이, 초전도와의 경쟁 관계, 파이얼스 왜곡과 깊은 연관이 있습니다."}, {"term": "VSe2 (Vanadium Diselenide)", "why_emerged": "전형적인 TMD 물질 중 하나로, 강한 전자 상관관계와 잠재적인 자성을 연구하기 위해 선택되는 재료입니다.", "origin": "초록 정보만으로는 특정하기 어려우나 1T 구조의 대표적 물질로 알려져 있습니다.", "connections": "단층 자성, CDW, 스핀 밀도파(SDW) 연구의 테스트베드입니다."}, {"term": "차원성 효과 (Dimensionality effects)", "why_emerged": "3차원 벌크에서 2차원 또는 1차원으로 물질의 크기가 줄어들 때 나타나는 전자 상태의 급격한 변화를 이해하기 위해 필요합니다.", "origin": "양자역학 및 통계역학의 발전과 함께 확립되었습니다.", "connections": "양자 구속 효과, 뫼레 격자, 반데르발스 이종접합 구조와 관련됩니다."}], "english_summary": ["Identifies a novel density wave state emerging in ultrathin VSe2 films.", "Resolves controversy surrounding the ground state of monolayer VSe2 through thickness-dependent studies.", "Led by Feng Donglai, highlighting the critical role of dimensionality in correlated electronic phases."]}}, {"title": "Phase and electronic structure control of altermagnetic α−MnTe thin films via epitaxy on InP (111)", "journal": "PRB_Recent", "source": "author whitelist", "link": "http://link.aps.org/doi/10.1103/vwgc-ltkz", "authors": "Yuzhe Wang, Shiwu Su, Min Ge, et al.", "last_authors": "Donglai Feng, Juan Jiang", "summary": "Author(s): Yuzhe Wang, Shiwu Su, Min Ge, Pengxu Ran, Tongrui Li, Xianglin Li, Sen Liao, Yu Liang, Jiaqin Wen, Jianghao Yao, Jiexiong Sun, Haoyuan Yan, Rui Xu, Shengtao Cui, Zhe Sun, Donglai Feng, and Juan Jiang Tailoring altermagnetism in $α\\text{−}\\mathrm{MnTe}$ thin films via molecular beam epitaxy (MBE) enables the investigation of emergent quantum states and their underlying physical mechanisms. Here, we report a systematic study of MnTe thin film growth on InP (111) substrates. Crucially, the substrat… [Phys. Rev. B 113, 205139] Published Wed May 20, 2026", "tier": "A_MUST_READ", "score": "9", "reason": "author whitelist: Donglai Feng", "tags": ["altermagnet"], "image": "", "briefing": {"background": "알터마그네틱(altermagnetism)은 강자성(넷 자기화)과 반강자성(보상된 자기 모멘트)의 특징을 동시에 가지며, 비상대론적인 스핀 분할을 보여주는 새로운 자기 상태입니다. 이 분야는 차세대 스핀트로닉스와 양자 소자 구현을 위한 핵심 후보로 주목받고 있습니다.", "motivation": "알터마그네틱 소재인 α-MnTe의 물성을 제어하고 활용하기 위해서는 고품질 박막 성장 기술과 그에 따른 전자 구조 변화에 대한 이해가 필수적입니다. 본 연구는 InP (111) 기판 위에서의 에피택셜 성장을 통해 MnTe 박막의 상(phase)과 전자 구조를 정밀하게 제어하고자 했습니다.", "result": "InP (111) 기판을 활용하여 α-MnTe 박막 성장에 성공했으며, 분자선 에피택시(MBE) 공정 변수를 통해 박막의 결정상과 전자 구조를 조절할 수 있음을 보였습니다. 특히 기판과의 계면 제어가 알터마그네틱 특성 발현에 중요한 역할을 함을 시사합니다.", "implication": "고품질 α-MnTe 박막의 위상 및 전자 구조 제어가 가능해짐에 따라, 향후 ARPES 등을 통한 알터마그네틱 스핀 분할의 직접적인 관찰과 이를 이용한 스핀 전류 생성 소자 연구가 가속화될 것입니다.", "novelty": "Donglai Feng 교수 그룹의 연구로, InP 기판을 활용한 새로운 성장 경로를 제시했다는 점과 알터마그네틱 소재의 실질적인 소자화를 위한 박막 제어 기술을 확보했다는 점에서 독자(ARPES 및 알터마그넷 관심)에게 매우 중요한 정보를 제공합니다.", "unresolved": "초록상으로는 성장된 박막에서 실제 알터마그네틱 스핀 분할이 ARPES를 통해 얼마나 명확하게 관찰되었는지에 대한 구체적인 데이터 수치는 명시되지 않았습니다.", "future_work": "실제 스핀 분해 ARPES(Spin-ARPES)를 통한 밴드 분할 측정과 대칭성 붕괴에 따른 변칙 홀 효과(AHE) 등의 수송 특성 분석이 이어질 것으로 예상됩니다.", "concepts": [{"term": "알터마그네틱 (Altermagnetism)", "why_emerged": "기존 강자성과 반강자성의 이분법적 분류로 설명할 수 없는, 순 자기화는 없으면서 스핀 분할이 큰 자성체를 정의하기 위해 등장했습니다.", "origin": "최근 Šmejkal, Jungwirth, Sinova 등에 의해 이론적으로 체계화되었습니다.", "connections": "반강자성 스핀트로닉스, 베리 곡률(Berry curvature), 비상대론적 스핀 분할."}, {"term": "분자선 에피택시 (MBE)", "why_emerged": "원자층 단위의 정밀한 박막 성장과 고순도 결정 제작이 필요했기 때문입니다.", "origin": "1960년대 후반 J. R. Arthur와 Alfred Y. Cho에 의해 개발되었습니다.", "connections": "2차원 물질, 양자 우물, 화합물 반도체 성장."}, {"term": "α-MnTe", "why_emerged": "전형적인 반강자성체로 알려져 있었으나, 최근 알터마그네틱 밴드 구조를 가질 것으로 예측되어 재조명받고 있습니다.", "origin": "초록 정보만으로는 특정하기 어려움 (전통적인 NiAs 구조 화합물).", "connections": "반강자성 반도체, 알터마그네틱 밴드 분할."}, {"term": "InP (111) 기판", "why_emerged": "박막 성장 시 격자 불합합도를 줄이고 특정 결정 방향성을 유도하기 위한 지지체로 선택되었습니다.", "origin": "반도체 산업에서 널리 쓰이는 III-V족 화합물 기판입니다.", "connections": "에피택셜 성장, 격자 정합."}], "english_summary": ["Successfully controlled the phase and electronic structure of altermagnetic α-MnTe thin films using MBE on InP (111) substrates.", "The study highlights the critical role of substrate-mediated epitaxy in tailoring quantum states in altermagnets.", "Provides a foundation for future ARPES studies on spin-splitting and transport applications in MnTe systems.", "Conducted by the Donglai Feng group, a leading authority in ARPES and electronic structure research."]}}, {"title": "Fingerprints of Preformed Pairs in Two-Electron Angle-Resolved Photoemission Spectroscopy", "journal": "PRL_Recent", "source": "keyword", "link": "http://link.aps.org/doi/10.1103/4c3d-1bm7", "authors": "Janez Bonča, Andrea Damascelli, Mona Berciu", "last_authors": "Andrea Damascelli, Mona Berciu", "summary": "Author(s): Janez Bonča, Andrea Damascelli, and Mona Berciu We use variational exact diagonalization (VED) to calculate the two-electron removal spectral weight for the Hubbard-Holstein model, starting from the ground state with two electrons on a one-dimensional chain. We argue that this spectral weight provides a valuable proxy for the intensity of 2eARPES… [Phys. Rev. Lett. 136, 196504] Published Thu May 14, 2026", "tier": "A_MUST_READ", "score": "9", "reason": "title strong match: angle-resolved photoemission", "tags": ["ARPES", "angle-resolvedphotoemission", "photoemission", "Hubbard"], "image": "", "briefing": {"background": "기존 ARPES는 단일 전자를 검출하여 입자의 에너지를 측정하므로, 초전도체 등에서 발생하는 '전자 쌍(Cooper pairs)'의 직접적인 상호작용을 관찰하는 데 한계가 있었습니다. 이를 극복하기 위해 두 개의 전자를 동시에 방출시켜 측정하는 2e-ARPES 이론이 제안되어 왔습니다.", "motivation": "강상관 계 및 전자-포논 결합 시스템(Hubbard-Holstein 모델)에서 초전도 현상의 전구체인 '미리 형성된 쌍(preformed pairs)'이 존재할 때, 이것이 2e-ARPES 스펙트럼에 어떤 고유한 흔적을 남기는지 이론적으로 규명하고자 했습니다.", "result": "Variational Exact Diagonalization(VED) 기법을 사용하여, 미리 형성된 전자 쌍이 존재할 경우 2e-ARPES의 스펙트럼 가중치(spectral weight)가 특정 에너지와 운동량 영역에서 뚜렷한 특징을 보임을 입증했습니다.", "implication": "이 결과는 실험적으로 2e-ARPES를 수행할 때, 단순한 통계적 우연이 아닌 실제 물리적 전자 쌍의 존재를 식별할 수 있는 가이드라인을 제공합니다. 특히 슈도갭(pseudogap) 상태의 기원을 밝히는 데 기여할 수 있습니다.", "novelty": "Damascelli와 Berciu 같은 ARPES 및 다체계 이론 권위자들이 참여하여, 2e-ARPES가 강상관 소재의 짝짓기 물리(pairing physics)를 탐구하는 강력한 도구가 될 수 있음을 구체적인 모델링으로 보여주었습니다.", "unresolved": "1차원 체인 모델에서의 결과이므로, 고온 초전도체와 같은 실제 2차원 시스템에서의 정량적인 스펙트럼 형태는 추가 연구가 필요합니다.", "future_work": "실제 구리 산화물(Cuprates)이나 철계 초전도체에 대한 2e-ARPES 실험과의 비교 및 고차원 모델로의 확장 연구가 기대됩니다.", "concepts": [{"term": "2e-ARPES", "why_emerged": "단일 입자 측정으로는 알 수 없는 전자 간 상관관계와 쌍 형성 에너지를 직접 측정하기 위해 고안되었습니다.", "origin": "이론적으로는 오래전 제안되었으나, 광원 및 검출기 기술 발달로 최근 다시 주목받고 있습니다.", "connections": "Double photoemission (DPE), Cooper pairs, 단일 입자 ARPES."}, {"term": "미리 형성된 쌍 (Preformed Pairs)", "why_emerged": "임계 온도(Tc) 위에서도 전자들이 쌍을 이루고 있으나 위상 응집이 일어나지 않은 상태를 설명하기 위해 등장했습니다.", "origin": "고온 초전도체의 슈도갭 현상을 설명하는 주요 가설 중 하나입니다.", "connections": "슈도갭 (Pseudogap), BEC-BCS crossover, 강상관 계."}, {"term": "Hubbard-Holstein 모델", "why_emerged": "전자 간의 쿨롱 척력(Hubbard)과 전자-포논 간의 상호작용(Holstein)을 동시에 고려하기 위해 만들어진 모델입니다.", "origin": "John Hubbard(1963)와 T. Holstein(1959)의 모델을 결합함.", "connections": "폴라론 (Polaron), 고온 초전도, 전하 밀도파 (CDW)."}, {"term": "Variational Exact Diagonalization (VED)", "why_emerged": "무한한 힐베르트 공간을 가진 격자 모델에서 기저 상태와 여기 상태를 효율적이고 정확하게 계산하기 위해 필요합니다.", "origin": "Bonca 등에 의해 발전된 수치 해석 기법입니다.", "connections": "Lanczos 알고리즘, 강상관 시스템 계산."}], "english_summary": ["Theoretically predicts that preformed electron pairs leave distinct 'fingerprints' in 2e-ARPES spectral weight.", "Uses Variational Exact Diagonalization on the Hubbard-Holstein model to demonstrate these features.", "Provides a crucial proxy for identifying pairing interactions directly through double photoemission experiments.", "Authored by ARPES expert Andrea Damascelli, bridging advanced spectroscopy with many-body theory."]}}, {"title": "Fragility of Topology under Electronic Correlations in Iron Chalcogenides", "journal": "PRL_Recent", "source": "author whitelist", "link": "http://link.aps.org/doi/10.1103/tq1k-g4lb", "authors": "Younsik Kim, Junseo Yoo, Sehoon Kim, et al.", "last_authors": "Minjae Kim, Changyoung Kim", "summary": "Author(s): Younsik Kim, Junseo Yoo, Sehoon Kim, Sungsoo Hahn, Kiyohisa Tanaka, Li Yu, Minjae Kim, and Changyoung Kim The interplay between electronic correlations and topology is a central topic in the study of quantum materials. In this Letter, we investigate the impact of the orbital-selective Mott phase (OSMP) on the topological properties of ${\\mathrm{FeTe}}_{1−x}{\\mathrm{Se}}_{x}$ (FTS), an iron chalcogenide … [Phys. Rev. Lett. 136, 196502] Published Tue May 12, 2026", "tier": "A_MUST_READ", "score": "9", "reason": "author whitelist: Changyoung Kim", "tags": ["Mott", "topological"], "image": "", "briefing": {"background": "철계 칼코겐화물($FeTe_{1-x}Se_x$)은 위상 표면 상태와 초전도성이 공존하여 마요라나 제로 모드를 탐구하기 위한 최적의 플랫폼으로 여겨집니다. 하지만 이 물질은 전자 간의 강한 상관관계(Mott physics) 또한 공존하는 복잡한 시스템입니다.", "motivation": "전자 상관관계에 의해 발생하는 '궤도 선택적 모트 상(OSMP)'이 이 물질의 위상적 성질(topology)에 어떤 영향을 미치는지, 즉 상관관계가 위상을 강화하는지 아니면 파괴하는지를 규명하고자 했습니다.", "result": "궤도 선택적 모트 전이가 발생할 때, 해당 궤도가 기여하는 밴드 구조의 변화로 인해 기존의 위상적 보호가 약화되거나 사라질 수 있다는 '위상의 취약성(fragility)'을 확인했습니다.", "implication": "이 결과는 $FeTe_{1-x}Se_x$와 같은 다중 궤도 시스템에서 위상 절연체나 위상 초전도 특성을 이해할 때, 단순한 밴드 계산을 넘어 국소적인 전자 상관관계를 정밀하게 고려해야 함을 시사합니다.", "novelty": "김창영 교수 그룹의 연구로, 철계 초전도체에서 모트 물리(Mottness)와 위상(Topology) 사이의 상충 관계를 명확히 지적했습니다. 이는 위상 물질 설계 시 상관관계의 부정적 영향을 경고하는 중요한 결과입니다.", "unresolved": "상관관계에 의해 파괴된 위상 상태가 외부 압력이나 도핑 조절을 통해 다시 회복될 수 있는지에 대한 임계 조건은 아직 명확하지 않습니다.", "future_work": "도핑 농도에 따른 궤도별 유효 질량 변화를 ARPES로 정밀 측정하고, 이를 DFT+DMFT 계산과 대조하여 위상 밴드의 붕괴 과정을 추적하는 연구가 지속될 것입니다.", "concepts": [{"term": "궤도 선택적 모트 상 (OSMP)", "why_emerged": "다중 궤도 시스템에서 모든 전자가 동시에 금속-절연체 전이를 일으키지 않고, 특정 궤도의 전자만 먼저 국소화되는 현상을 설명하기 위해 등장했습니다.", "origin": "철계 초전도체의 발견 이후 다중 궤도 물리 연구에서 핵심 개념으로 부상했습니다.", "connections": "Hund's metal, 강상관 전자계, 철계 초전도체."}, {"term": "위상적 취약성 (Fragility of Topology)", "why_emerged": "외부 섭동이나 전자 상호작용이 위상 상태를 보호하는 대칭성을 깨뜨리거나 밴드 갭을 닫을 수 있음을 나타내기 위해 사용되었습니다.", "origin": "본 논문에서 상관관계와 위상의 관계를 설명하는 핵심 테마로 제시됨.", "connections": "위상 절연체, 마요라나 제로 모드, 전자 상관관계."}, {"term": "FeTe1-xSex (FTS)", "why_emerged": "철계 초전도체 중 가장 단순한 구조를 가지면서도 위상 표면 상태를 가져 위상 초전도 연구의 표준 물질이 되었습니다.", "origin": "2008년 철계 초전도체 발견 직후 합성 및 연구가 시작됨.", "connections": "마요라나 페르미온, 위상 초전도체, ARPES."}, {"term": "전자 상관관계 (Electronic Correlations)", "why_emerged": "전자들 사이의 독립적인 움직임을 가정하는 단일 입자 근사가 맞지 않는 시스템(주로 d 또는 f 궤도 포함)을 설명하기 위해 필요합니다.", "origin": "모트 절연체 연구 등을 통해 확립된 고체물리학의 근간 개념입니다.", "connections": "모트 전이, DMFT (동역학적 평균장 이론), 다체계 물리."}], "english_summary": ["Investigates the impact of orbital-selective Mott phases on the topological properties of FeTe1-xSex.", "Finds that electronic correlations can lead to the 'fragility' of topological states in iron chalcogenides.", "Highlights the competition between Mottness and topology, suggesting that strong correlations may destabilize topological protection.", "Led by Changyoung Kim, a key figure in ARPES studies of iron-based superconductors and topological materials."]}}, {"title": "Coherent terahertz control of metastable magnetization in FePS3", "journal": "arXiv_CondMat", "source": "author whitelist", "link": "https://arxiv.org/abs/2510.16993", "authors": "Batyr Ilyas, Tianchuang Luo, Honglie Ning, et al.", "last_authors": "Angel Rubio, Nuh Gedik", "summary": "arXiv:2510.16993v2 Announce Type: replace Abstract: The crystal lattice governs the emergent electronic, magnetic, and optical properties of quantum materials, making structural tuning through strain, pressure, or chemical substitution a key approach for discovering and controlling novel quantum phases. Beyond static modifications, driving specific lattice modes with ultrafast stimuli offers a dynamic route for tailoring material properties out of equilibrium. However, achieving dynamic coherent control of the nonequilibrium phases via resonant excitation of lattice coherences remains largely unexplored. Such manipulation enables non-volatile, on demand amplification and suppression of order parameters on femtosecond timescales, necessary for next generation optoelectronic ultrafast computation. In this study, we demonstrate coherent phononic control of a newly discovered, light-induced metastable magnetization in the van der Waals antiferromagnet FePS3. By using a sequence of terahertz (THz) pulses, we modulate the magnetization amplitude at the frequencies of phonon coherences, whose infrared-active nature and symmetries are further revealed by polarization- and field-strength-dependent measurements. Furthermore, our two-dimensional THz spectroscopy, in tandem with first-principles numerical simulations, shows that these phonons nonlinearly displace a Raman active phonon, which induces the metastable net magnetization. These findings not only clarify the microscopic mechanism underlying the metastable state in FePS3 but also establish vibrational coherences in solids as a powerful tool for ultrafast quantum phase control, enabling manipulation of material functionalities far from equilibrium.", "tier": "A_MUST_READ", "score": "9", "reason": "author whitelist: Nuh Gedik", "tags": ["vanderWaals", "phonon", "ferromagnet", "antiferromagnet"], "image": "https://arxiv.org/html/2510.16993v2/x1.png", "briefing": {"background": "양자 물질의 결정 격자는 전자적, 자기적 성질을 결정하는 핵심 요소입니다. 최근에는 정적인 변형(strain)이나 압력을 가하는 대신, 강한 빛(초고속 펄스)을 조사하여 특정 격자 모드를 공명 시킴으로써 물질의 물성을 비평형 상태에서 동적으로 제어하려는 '플로케 엔지니어링(Floquet engineering)'과 유사한 시도들이 활발합니다.", "motivation": "반데르발스 반강자성체인 FePS3에서 빛으로 유도된 '준안정 자화(metastable magnetization)' 상태가 발견된 바 있으나, 이를 테라헤르츠(THz) 파동을 이용해 결맞게(coherent) 제어하고 그 미시적 메커니즘을 규명하는 연구는 미진했습니다.", "result": "테라헤르츠 펄스 시퀀스를 사용하여 FePS3의 자화 진폭을 특정 포논 주파수로 변조하는 데 성공했습니다. 2차원 THz 분광법과 제1원리 계산을 통해, 적외선(IR) 활성 포논이 비선형적으로 라만(Raman) 활성 포논을 변위시켜 순 자화(net magnetization)를 유도한다는 비선형 포논 결합 메커니즘을 확인했습니다.", "implication": "이 결과는 고체 내의 진동 결맞음(vibrational coherence)이 비평형 상태의 양자 상을 제어하는 강력한 도구가 될 수 있음을 시사합니다. 특히 자성 상 변화를 펨토초 단위로 조절할 수 있어 초고속 광전자 컴퓨팅 기술로의 응용 가능성을 엽니다.", "novelty": "Nuh Gedik 교수 그룹의 연구로, 단순한 상태 변화를 넘어 자성 상태의 크기를 THz 펄스로 동적이고 결맞게 제어했다는 점이 핵심입니다. 독자의 관심사인 vdW 자성체 및 초고속 동적 제어(Floquet 관련) 분야와 밀접한 연관이 있습니다.", "unresolved": "준안정 자화 상태가 얼마나 오랫동안 지속되는지, 그리고 다른 외부 환경(온도, 자기장)에서 이 비선형 결합이 어떻게 변화하는지에 대한 추가 검증이 필요합니다.", "future_work": "다른 유형의 vdW 자성체에서도 유사한 포논 유도 자화 제어가 가능한지 확인하고, 이를 활용한 실제 논리 소자의 프로토타입 연구가 이어질 것으로 보입니다.", "concepts": [{"term": "FePS3", "why_emerged": "2차원 반데르발스 층상 구조를 가지면서 반강자성을 띠는 물질 연구를 위해 주목받았습니다.", "origin": "초록 정보만으로는 특정하기 어려움 (널리 알려진 vdW 반강자성체)", "connections": "MnPS3, NiPS3 등 MPX3 계열 물질과 함께 2차원 자성 연구의 핵심 재료임."}, {"term": "Metastable Magnetization", "why_emerged": "평형 상태에서는 나타나지 않는 자성 상태를 외부 자극으로 유도하여 새로운 기능을 창출하기 위해 등장했습니다.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "광유도 상전이(Photo-induced phase transition), 비평형 통계 역학."}, {"term": "Nonlinear Phonon Coupling", "why_emerged": "하나의 포논 모드가 다른 포논 모드나 전자/자기적 자유도와 비선형적으로 상호작용하는 물리 현상을 설명하기 위해 도입되었습니다.", "origin": "초록 정보만으로는 특정하기 어려움 (비선형 광학 및 격자 동역학)", "connections": "Phonon-driven control, Coherent control, Raman/IR active modes."}], "english_summary": ["Demonstrated coherent control of light-induced metastable magnetization in FePS3 using THz pulse sequences.", "Identified a nonlinear coupling mechanism where IR-active phonons displace Raman-active phonons to induce net magnetization.", "Establishes vibrational coherence as a tool for ultrafast, non-volatile manipulation of magnetic order parameters.", "Combines 2D THz spectroscopy with first-principles simulations to clarify the microscopic control mechanism."]}}, {"title": "Photoemission intermittency via stochastic gating in rubrene nanowires coupled to plasmonic silver nanoparticles", "journal": "arXiv_CondMat", "source": "keyword", "link": "https://arxiv.org/abs/2605.22313", "authors": "Moha Naeimi, Waqas Pervez, Frithjof Harmsen, Ingo Barke, Sylvia Speller", "last_authors": "Ingo Barke, Sylvia Speller", "summary": "arXiv:2605.22313v1 Announce Type: new Abstract: In this work, we report a new nanoscale phenomenon observed as photoemission intermittency (On-Off electron emission), manifested as stochastic bursts in electron yield at quasi-one-dimensional organic wires and silver nanoparticles interface. Energy-resolved measurements reveal that the emitted electrons carry out hybrid information, containing photoelectron yield enhancement associated with the nanoparticles and kinetic energies determined by the organic semiconductor. The intermittency results in a dynamic shift of the electron spectra correlating with the photoelectron yield. We attribute the observed behaviour to the photo-hole accumulation and stochastic gating of charge due to electron-hole separation at the nano interface. These findings introduces the photoemission intermittency as a nanoscale phenomenon indicating a new dynamic regime of charge assisted emission at organic-plasmonic interfaces. Keywords: rubrene, nanoparticle, PEEM, exciton, charge", "tier": "A_MUST_READ", "score": "9", "reason": "title strong match: photoemission", "tags": ["photoemission", "STS", "quasi-one-dimensional"], "image": "https://arxiv.org/html/2605.22313v1/Figures/PEEM.png", "briefing": {"background": "광전자 방출(Photoemission)은 물질의 전자 구조를 파악하는 핵심 수단입니다. 최근에는 나노 스케일의 유기물 반도체와 금속 나노입자가 결합된 계면에서 발생하는 복잡한 전하 이동 현상을 이해하는 것이 광전 소자 효율 향상을 위해 중요해졌습니다.", "motivation": "루브렌(rubrene) 나노선과 은(Ag) 나노입자 사이의 준1차원 계면에서 나타나는 비정상적인 전자 방출 거동과 그 역학을 규명하고자 했습니다.", "result": "광전자 방출이 연속적이지 않고 On-Off 상태를 반복하는 '광방출 간헐성(photoemission intermittency)' 현상을 발견했습니다. 이는 계면에서 전자-정공 분리 후 정공(photo-hole)이 축적되어 발생하며, 이 축적된 전하가 확률적으로 게이팅(stochastic gating) 역할을 하여 전자 방출을 조절함을 확인했습니다.", "implication": "나노 구조 계면에서의 전하 축적이 전자 방출 스펙트럼의 동적 이동을 유도한다는 사실을 밝힘으로써, 유기 플라스모닉 장치의 동작 원리를 새로운 시각에서 이해할 수 있게 되었습니다.", "novelty": "준1차원(quasi-1D) 시스템에서의 광전자 방출을 시간적/에너지적으로 분해하여 '간헐성'이라는 새로운 동적 체제를 제시했습니다. 독자의 관심사인 quasi-1D 및 photoemission 분석 방법론과 관련이 깊습니다.", "unresolved": "초록상으로는 이러한 간헐적 방출의 정확한 시간 척도와 제어 가능성에 대한 구체적인 데이터가 충분히 설명되지 않았습니다.", "future_work": "게이팅 현상을 인위적으로 조절하여 전자 방출 주기를 제어하거나, 다른 유기 분자 시스템으로의 확장 연구가 가능할 것입니다.", "concepts": [{"term": "Photoemission Intermittency", "why_emerged": "나노 스케일에서 관찰되는 불규칙한 전자 방출 버스트(burst) 현상을 설명하기 위해 제안된 개념입니다.", "origin": "본 연구 논문에서 주요 현상으로 보고됨", "connections": "Fluorescence blinking, Stochastic processes in nanostructures."}, {"term": "Rubrene Nanowires", "why_emerged": "높은 전하 이동도를 가진 유기 반도체인 루브렌을 나노 구조로 만들어 준1차원적 물리 특성을 연구하기 위해 사용됩니다.", "origin": "유기 전자공학 분야에서 널리 연구됨", "connections": "Organic field-effect transistors (OFETs), Quasi-1D transport."}, {"term": "Stochastic Gating", "why_emerged": "무작위적으로 축적되거나 소멸되는 전하가 주변의 전위 장벽을 변화시켜 전하 흐름을 조절하는 현상을 설명하기 위해 사용됩니다.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "Charge trapping, Gating effect in nanodevices."}], "english_summary": ["Reported photoemission intermittency at the interface of rubrene nanowires and silver nanoparticles.", "The intermittency manifests as stochastic bursts in electron yield due to photo-hole accumulation and gating.", "Energy-resolved measurements show a dynamic shift in spectra correlated with the intermittent yield.", "Introduces a new regime of charge-assisted emission at organic-plasmonic nano-interfaces."]}}, {"title": "Pressure-modulated competition between dual charge density waves in NbSe3", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/s48z-19pt", "authors": "Yongsheng Zhao, Konstantin Glazyrin, Pablo J. Bereciartua, et al.", "last_authors": "Wenge Yang, Moritz Hoesch", "summary": "Author(s): Yongsheng Zhao, Konstantin Glazyrin, Pablo J. Bereciartua, Christian Plueckthun, Satishkumar Kulkarni, Nana Li, Limin Yan, Kai Zhang, Bihan Wang, Yiming Wang, Jianbo Zhang, Nico Giordano, Helmuth Berger, Xin Wang, Sonia Francoual, Wenge Yang, and Moritz Hoesch Controlling collective electronic states through clean and reversible external stimuli is crucial for realizing functional quantum materials. Here, we report a study on temperature ($T$) and pressure ($P$)-tuned charge-density-wave (CDW) orders in the quasi-one-dimensional system of $\\mathrm{NbS}{\\m… [Phys. Rev. B 113, 195130] Published Mon May 18, 2026", "tier": "B_IMPORTANT_CONDMAT", "score": "10", "reason": "Direct hit on project materials: pressure-tuned CDW competition in the quasi-1D NbSe3 system.; demoted from A: broad CM, not direct user/project hit", "tags": ["NbSe3", "CDW", "quasi-1D"], "image": "", "briefing": {"background": "전하 밀도파(CDW)는 전자들 사이의 상호작용으로 인해 격자 변형과 전하 분포의 주기적 변조가 나타나는 집단적 양자 상태입니다 english_summary": ["Experimental demonstration of strain-induced square moiré patterns in stacked graphene.", "STM visualization shows reversible transition from trigonal to square moiré symmetry.", "Offers a new pathway for geometric band engineering via controlled manipulation of lattice wrinkles."]}}, {"title": "Josephson diode and spin-valve effects on the surface of altermagnet CrSb", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2602.08766", "authors": "V. D. Esin, D. Yu. Kazmin, Yu. S. Barash, A. V. Timonina, N. N. Kolesnikov, E. V. Deviatov", "last_authors": "Yu. S. Barash, A. V. Timonina, N. N. Kolesnikov, E. V. Deviatov", "summary": "arXiv:2602.08766v3 Announce Type: replace Abstract: We experimentally investigate charge transport in In-CrSb and In-CrSb-In proximity devices, which are formed as junctions between superconducting indium leads and thick single crystal flakes of altermagnet CrSb. For double In-CrSb-In junctions, $dV/dI(B)$ curves are mirrored in respect to zero field for two magnetic field sweep directions, which is characteristic behavior of a Josephson spin valve. Also, we demonstrate Josephson diode effect by direct measurement of the critical current for two opposite directions in external magnetic field. We interpret these observations as a joint effect of the spin-polarized topological surface states and the altermagnetic spin splitting of the bulk bands in CrSb. For a single In-CrSb interface, the superconducting gap oscillates in magnetic field for both field orientations, which strongly resembles the Fulde-Ferrell-Larkin-Ovchinnikov (FFLO) behavior. FFLO is based on finite-momentum Cooper pairing, therefore, it is fully compatible with the requirements for the Josephson diode effect.", "tier": "B_IMPORTANT_CONDMAT", "score": "9", "reason": "Direct experimental study of topological surface states in an important altermagnet material CrSb.", "tags": ["experiment", "CrSb", "altermagnetism"], "image": "https://arxiv.org/html/2602.08766v3/x1.png", "briefing": {"background": "알터자성체(Altermagnet)는 시간 반전 대칭을 깨지만 자기 모멘트가 상쇄되는 새로운 자기 상태로, 스핀 분극된 위상 표면 상태를 가질 것으로 기대됩니다.", "motivation": "CrSb 알터자성체 표면에서 나타나는 수송 현상을 통해 조셉슨 소자 및 스핀-밸브 거동을 직접 확인하고자 했습니다.", "result": "In-CrSb-In 접합에서 조셉슨 다이오드 효과와 FFLO 상태와 유사한 자기장 의존성을 관측했습니다.", "implication": "알터자성체-초전도체 접합이 위상적 스핀 수송 및 초전도 제어를 위한 새로운 플랫폼임을 증명합니다.", "novelty": "알터자성체에서 나타나는 특유의 밴드 스핀 분할이 위상 표면 상태와 결합해 조셉슨 접합에서 비대칭적인 수송 현상을 보인다는 점이 중요합니다.", "unresolved": "관측된 현상이 알터자성체의 고유 밴드 구조와 어떻게 정량적으로 일치하는지에 대한 미시적 모델링이 필요합니다.", "future_work": "알터자성체에서의 스핀-분극된 표면 상태를 직접 관찰하기 위한 ARPES 혹은 스핀-분극 STS 측정 연구가 요구됩니다.", "concepts": [{"term": "알터자성체", "why_emerged": "강자성체도 반강자성체도 아닌 제3의 자기 상태로, 스핀 분할된 밴드 구조를 제공하기 위해 제안되었습니다.", "origin": "최근 5년 내 이론적으로 급부상한 개념으로, Jungwirth 그룹 등이 주도하였습니다.", "connections": "반강자성체, 스핀트로닉스, 위상 밴드 구조."}, {"term": "조셉슨 다이오드 효과", "why_emerged": "초전도 접합에서 전류 흐름의 방향에 따라 임계 전류값이 달라지는 비대칭 현상을 설명하기 위해 도입되었습니다.", "origin": "최근 초전도-위상 물질 접합 분야에서 활발히 연구되고 있습니다.", "connections": "초전도성, 위상물질, 비가역적 수송."}], "english_summary": ["Experimental study of In-CrSb Josephson junctions showing diode and spin-valve effects.", "Evidence suggests interplay between altermagnetic spin splitting and topological surface states.", "Observations mimic FFLO-like behavior, highlighting CrSb as a promising platform for superconducting spintronics."]}}, {"title": "Chiral charge density wave in 1T- and 4Hb-TaS2: the role of interlayer coupling", "journal": "npj_QuantumMaterials", "source": "Gemini", "link": "https://www.nature.com/articles/s41535-026-00889-1", "authors": "Roni Anna Gofman, Abigail Dishi, Hyeonhu Bae, et al.", "last_authors": "Binghai Yan, Amit Kanigel", "summary": "npj Quantum Materials, Published online: 05 May 2026; doi:10.1038/s41535-026-00889-1 Chiral charge density wave in 1T- and 4Hb-TaS 2 : the role of interlayer coupling", "tier": "B_IMPORTANT_CONDMAT", "score": "9", "reason": "Direct relevance to chiral CDW and TRSB interests in transition metal dichalcogenides.; demoted from A: broad CM, not direct user/project hit", "tags": ["experiment", "TaS2", "CDW"], "image": "https://pubads.g.doubleclick.net/gampad/ad?iu=/285/npjquantmats.nature.com/article&sz=728x90&c=1769374674&t=pos%3Dtop%26type%3Darticle%26artid%3Ds41535-026-00889-1%26doi%3D10.1038/s41535-026-00889-1%26subjmeta%3D301,639,766%26kwrd%3DMaterials+science,Physics", "briefing": {"background": "전이금속 디칼코게나이드(TMD)인 TaS2는 전하 밀도 파동(CDW)이 잘 연구된 시스템입니다. 특히 1T와 4Hb 폴리타입에서 발견되는 키랄(chiral) CDW 상태는 시간 반전 대칭성 깨짐(TRSB)과 관련하여 물리적 관심이 높습니다.", "motivation": "이 논문은 1T-TaS2와 4Hb-TaS2에서 관찰되는 키랄 CDW 현상에 있어 층간 결합(interlayer coupling)이 어떠한 구조적, 전자적 기여를 하는지 규명하고자 합니다.", "result": "층간 상호작용이 단일 층의 CDW 특성을 변형시키며, 키랄 CDW 상태의 안정성과 발현에 중요한 역할을 한다는 점을 실험적으로 확인했습니다.", "implication": "TMD 물질에서 CDW의 공간적 대칭성과 키랄성 제어를 위한 중요한 단서를 제공하며, 이는 카고메 금속(AV3Sb5) 등 다른 강상관 전자계의 위상적 물성 연구에도 시사점을 줍니다.", "novelty": "기존 연구들이 단일 층 물리(2D limit)에 집중했던 것과 달리, 층간 결합을 명시적으로 고려하여 키랄 CDW의 기원을 설명한 점이 핵심입니다.", "unresolved": "층간 결합의 구체적인 강도에 따른 키랄 도메인의 역학적 변화나 TRSB의 직접적인 증거가 시스템 전반에서 어떻게 정량화되는지는 추가적인 연구가 필요합니다.", "future_work": "ARPES를 활용하여 층간 결합에 따른 밴드 구조 변화와 키랄 CDW가 유도하는 전자 상태의 직접적인 매핑이 예상됩니다.", "concepts": [{"term": "키랄 전하 밀도 파동 (Chiral CDW)", "why_emerged": "물질 내 전하 밀도의 주기적 변조가 공간 반전이나 회전 대칭을 깨뜨려 거시적인 키랄성을 유도하기 때문입니다.", "origin": "특정인이 아닌 TMD CDW 연구의 발전 과정에서 축적된 결과임.", "connections": "TRSB, 위상 금속 상태, 페르미 면 재구성."}, {"term": "1T/4Hb-TaS2", "why_emerged": "TMD 물질 중 강한 전자 상관관계와 CDW 및 초전도 현상이 공존하는 대표적인 모델 시스템이기 때문입니다.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "강상관 전자계, 초전도-CDW 경쟁 관계."}], "english_summary": ["Explores the role of interlayer coupling in 1T- and 4Hb-TaS2 chiral CDW states.", "Demonstrates how stacking and 3D interactions influence the observed chiral symmetry breaking.", "Provides insights into how dimensionality modulates collective electronic phases in TMDs.", "Relevant to understanding the emergence of TRSB in transition metal systems."]}}, {"title": "Probing the quantum metric of 3D topological insulators", "journal": "Nature_Materials", "source": "Gemini", "link": "https://www.nature.com/articles/s41563-026-02617-3", "authors": "Giacomo Sala, Emanuele Longo, Maria Teresa Mercaldo, et al.", "last_authors": "Carmine Ortix, Andrea D. Caviglia", "summary": "Nature Materials, Published online: 22 May 2026; doi:10.1038/s41563-026-02617-3 The quantum metric of a surface Dirac cone is found to contribute to the nonlinear magnetoresistance of thin films of the 3D topological insulator Sb2Te3.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Probes Dirac cone quantum metric in 3D TI Sb2Te3 via nonlinear magnetoresistance; highly relevant.", "tags": ["experiment", "Sb2Te3", "topologicalinsulator"], "image": "https://media.springernature.com/m685/springer-static/image/art%3A10.1038%2Fs41563-026-02617-3/MediaObjects/41563_2026_2617_Fig1_HTML.png", "briefing": {"background": "위상 절연체(TI)의 표면 디락 페르미온은 Berry 곡률과 밀접한 관련이 있습니다. 이러한 양자 기하학적 특성을 직접 측정하는 것은 위상 물성 연구의 핵심 난제 중 하나입니다.", "motivation": "비선형 자기저항 효과를 통해 Sb2Te3 박막의 표면 디락 콘(Dirac cone)에서 양자 계량(quantum metric)의 기여도를 도출하고자 합니다.", "result": "표면 디락 콘의 양자 계량이 비선형 자기저항 신호에 직접적으로 기여함을 확인하여, 이를 통해 해당 물질의 기하학적 파라미터를 실험적으로 추출했습니다.", "implication": "수송 측정을 통해 밴드 구조의 양자 기하학적 특성을 직접 프로빙할 수 있는 강력한 실험적 도구를 확보하게 되었습니다.", "novelty": "기존의 ARPES나 복잡한 위상적 홀 효과 분석 없이도, 전기적 수송 측정만으로 양자 계량을 도출했다는 점이 매우 창의적입니다.", "unresolved": "이러한 양자 계량 기여도가 샘플의 결함이나 층 두께 변화에 따라 얼마나 견고하게 유지되는지는 추가 검증이 필요합니다.", "future_work": "다른 위상 물질들(예: 자기 위상 절연체나 Weyl 반금속)에 본 측정 기법을 적용하여 Berry 곡률과 양자 계량의 관계를 일반화할 것으로 보입니다.", "concepts": [{"term": "양자 계량 (Quantum Metric)", "why_emerged": "상태의 기하학적 거리를 정의하기 위해 Berry 연결성으로부터 유도된 텐서량으로, 위상 물질의 비선형 응답을 이해하기 위해 필수적입니다.", "origin": "J. P. Provost and G. Vallee (1980) 등에 의해 수학적으로 정립됨.", "connections": "Berry 곡률, 비선형 홀 효과, 비선형 자기저항."}, {"term": "비선형 자기저항", "why_emerged": "기존 선형 응답 이론으로 설명되지 않는 위상 물질의 복잡한 수송 현상을 규명하기 위해 필요합니다.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "Berry 다이폴, 위상학적 응답, 비대칭 산란."}], "english_summary": ["Investigates the quantum metric of surface Dirac cones in 3D TI Sb2Te3.", "Uses nonlinear magnetoresistance as a probe for quantum geometric properties.", "Shows direct correlation between electronic structure geometry and transport response.", "Offers a transport-based alternative to spectroscopic methods for characterizing topology."]}}, {"title": "Oxygen-centred planar orbitals in the electronic structure and spin-density-wave reconstruction of multilayer nickelates", "journal": "Nature_Physics", "source": "Gemini", "link": "https://www.nature.com/articles/s41567-026-03286-4", "authors": "Christine C. Au-Yeung, Xinglong Chen, S. Smit, et al.", "last_authors": "J. F. Mitchell, A. Damascelli", "summary": "Nature Physics, Published online: 21 May 2026; doi:10.1038/s41567-026-03286-4 The potential similarities in the superconductivity in nickelates and cuprates is a topic of debate. Now a distinct likeness is observed in the electronic properties of these materials, which hints that the microscopic mechanisms may be related.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Directly addresses the electronic structure and SDW reconstruction of nickelates, relevant to the user's interest in unconventional superconductivity.", "tags": ["nickelates", "electronicstructure", "superconductivity"], "image": "https://media.springernature.com/m685/springer-static/image/art%3A10.1038%2Fs41567-026-03286-4/MediaObjects/41567_2026_3286_Fig1_HTML.png", "briefing": {"background": "니켈산염은 구리산염(Cuprates)과 유사한 전자 구조를 가지고 있어 고온 초전도 가능성으로 주목받아 왔으나, 세부적인 궤도 특성과 스핀 밀도 파동(SDW) 특성에서 차이를 보입니다.", "motivation": "다층 니켈산염에서 산소 중심 평면 오비탈이 전자 구조와 SDW 재구성에 어떤 영향을 미치는지 밝혀, 니켈산염과 구리산염의 물리적 유사성을 재평가하고자 합니다.", "result": "니켈산염에서 산소 오비탈의 역할이 구리산염의 그것과 놀라울 정도로 유사하다는 점을 관찰하여, 두 시스템의 초전도 기전이 미시적으로 연결될 가능성을 제시했습니다.", "implication": "니켈산염 초전도체 연구가 단순한 '제2의 구리산염' 찾기를 넘어, 왜 유사한 궤도 특성이 나타나는지에 대한 이론적 토대를 강화합니다.", "novelty": "다층 니켈산염에서 산소 기여도를 정밀 분석하여 구리산염과의 미시적 평행선을 그어낸 점이 학계의 논쟁을 환기합니다.", "unresolved": "관찰된 유사성이 실제 초전도 전이 온도나 상전이 메커니즘으로 어떻게 정량적으로 연결되는지에 대해서는 아직 추가적인 실험적 입증이 필요합니다.", "future_work": "ARPES를 통한 밴드 구조의 정밀 매핑과 RIXS를 이용한 산소/니켈 간의 전하 이동 전이 연구가 예상됩니다.", "concepts": [{"term": "스핀 밀도 파동 (SDW)", "why_emerged": "전자의 스핀 밀도가 물질 내부에서 공간적으로 주기성을 가지고 변조되는 상태를 설명하기 위해 필요합니다.", "origin": "A. W. Overhauser (1960년대 초반)에 의해 정립됨.", "connections": "페르미 면 재구성, 자기 질서, 초전도 경쟁/공존."}, {"term": "다층 니켈산염", "why_emerged": "낮은 차원의 니켈산염 시스템에서 고온 초전도를 탐색하기 위해 설계된 물질군입니다.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "구리산염, R-Ni-O 시스템, 전자 상관계."}], "english_summary": ["Examines oxygen-centered planar orbitals in multilayer nickelates.", "Identifies structural and electronic similarities between nickelates and cuprates.", "Links these similarities to observed spin-density-wave (SDW) reconstructions.", "Suggests a shared microscopic origin for superconductivity in both material classes."]}}, {"title": "Abelian and non-Abelian fractionalized states in twisted MoTe2: A generalized Landau-level theory", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/dvry-pfnb", "authors": "Bohao Li, Yunze Ouyang, Fengcheng Wu", "last_authors": "Yunze Ouyang, Fengcheng Wu", "summary": "Author(s): Bohao Li, Yunze Ouyang, and Fengcheng Wu Here, the authors develop a framework that variationally decomposes Bloch bands into generalized Landau levels (LLs), enabling a quantitative characterization of their effective LL nature. Applied to twisted bilayer MoTe 2 , the first band is dominated by the generalized zeroth LL, supporting Abelian fractional Chern insulators. The second band, at specific twist angles, is dominated by the generalized first LL and exhibits numerical evidence consistent with a non-Abelian Moore–Read state. [Phys. Rev. B 113, 195129] Published Mon May 18, 2026", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Theoretical framework for twisted MoTe2; relevant to fractional Chern insulators and moire systems.", "tags": ["twistedMoTe2", "fractionalCherninsulator", "moire"], "image": "", "briefing": {"background": "모아레 격자 시스템은 격자 불일치나 비틀림을 통해 평평한 에너지 밴드를 형성하여 강한 전자 상관관계를 유도합니다. 이 시스템에서 분수 첸 절연체(FCI)는 외부 자기장 없이도 분수 양자 홀 효과를 구현할 수 있는 플랫폼으로 큰 주목을 받고 있습니다.", "motivation": "비틀린 MoTe2에서 관측된 분수 첸 절연체 상태의 물리적 기원을 정량적으로 분석하고, 고차 란다우 준위와 유사한 물리적 상태를 이론적으로 규명하고자 합니다.", "result": "변분법을 사용해 Bloch 밴드를 일반화된 란다우 준위로 분해하는 프레임워크를 개발했습니다. 이를 통해 첫 번째 밴드가 0차 란다우 준위 성격을 띠어 Abelian FCI를 지지하며, 두 번째 밴드는 1차 란다우 준위 성격이 강해 비-Abelian Moore-Read 상태 가능성을 시사함을 보였습니다.", "implication": "모아레 밴드의 토폴로지적 성질을 란다우 준위의 언어로 재해석함으로써, 비틀린 이중층 시스템에서 고도의 양자 상태를 설계할 수 있는 정량적 기준을 마련했습니다.", "novelty": "기존의 복잡한 수치 계산 의존성을 줄이고, 란다우 준위라는 직관적인 물리 체계로 모아레 밴드의 분수 위상 상태를 분류했다는 점이 독창적입니다.", "unresolved": "실제 실험에서 Moore-Read 상태의 특징인 비-Abelian 통계적 성질을 직접 검증하는 것은 여전히 난제로 남아 있습니다.", "future_work": "다른 전이 금속 디칼코게나이드(TMD) 모아레 시스템에 이 프레임워크를 적용하여 고차 위상 상태의 가능성을 탐색할 예정입니다.", "concepts": [{"term": "분수 첸 절연체", "why_emerged": "외부 자기장 없이 위상학적으로 보호되는 분수 양자 홀 효과를 구현하기 위해 필요.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "분수 양자 홀 효과, Chern 밴드, 격자 모델."}, {"term": "모아레 격자", "why_emerged": "2D 물질의 층간 비틀림을 통해 밴드 구조를 인위적으로 조절하고 강상관 물성을 유도하기 위해 필요.", "origin": "MacDonald 등 (2011).", "connections": "Twisted bilayer graphene, 강한 상관계,平坦 밴드."}, {"term": "Moore-Read 상태", "why_emerged": "분수 양자 홀 효과의 5/2 채움 상태에서 발견되는 비-Abelian 위상 순서를 설명하기 위해 필요.", "origin": "Moore와 Read (1991).", "connections": "비-Abelian 통계, 양자 컴퓨팅, 파피안 파동함수."}], "english_summary": ["A variational framework is developed to map moire Bloch bands onto generalized Landau levels.", "The first band in twisted MoTe2 supports Abelian fractional Chern insulators.", "The second band exhibits characteristics of a non-Abelian Moore-Read state.", "This framework provides a quantitative design principle for topological phases in moire systems."]}}, {"title": "Accessing dirty-regime anomalous Hall effect in pure ferromagnetic metals", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/26cn-khsq", "authors": "Tengfei Ma, Lingsong Huang, Ning Jiang, et al.", "last_authors": "Wenyu Xing, Weibo Gao", "summary": "Author(s): Tengfei Ma, Lingsong Huang, Ning Jiang, Yaoxiang Jiang, Guixin He, Shifeng Zhao, Cong Wang, Wenyu Xing, and Weibo Gao The anomalous Hall effect (AHE) in the dirty regime of pure ferromagnetic metals is challenging to access without doping. Here, the authors use cluster beam deposition to tune structural disorder in ferromagnetic nanogranular CoFe films, reaching a low- conductivity metallic state and enabling systematic study of the AHE in the dirty regime. The AHE is dominated by the intrinsic mechanism and follows the predicted scaling σ AHE ≈ σ x x 1 . 6 . This work fills a key experimental gap and establishes a disorder-based platform for engineering the AHE. [Phys. Rev. B 113, 174428] Published Tue May 19, 2026", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Experimental study of the scaling behavior of the anomalous Hall effect in disordered metallic films.", "tags": ["material", "anomalousHalleffect", "ferromagnet"], "image": "", "briefing": {"background": "강자성 금속의 비정상 홀 효과(AHE)는 고유 메커니즘과 비고유 메커니즘(skew scattering, side jump)의 복잡한 상호작용으로 설명됩니다. 특히 전도도가 매우 낮은 'dirty regime'에서의 거동은 실험적 접근이 어려워 이론적으로만 예측되어 왔습니다.", "motivation": "불순물이 많은(dirty) 강자성체에서 전도도와 홀 전도도 사이의 스케일링 법칙을 검증하고, 각 메커니즘의 기여도를 실험적으로 명확히 분리하고자 합니다.", "result": "클러스터 빔 증착법으로 CoFe 박막의 무질서도를 정밀하게 제어하여 dirty regime의 AHE를 관측했습니다. 결과적으로 고유 메커니즘이 지배적이며, 전도도와 홀 전도도가 1.6의 지수로 스케일링됨을 확인했습니다.", "implication": "강자성 금속의 전자 구조와 수송 현상 사이의 관계를 더 깊이 이해하게 되었으며, 무질서도 조절을 통한 홀 효과 엔지니어링의 가능성을 입증했습니다.", "novelty": "도핑 대신 구조적 무질서를 조절하는 방식을 택해, 실험적으로 접근하기 힘들었던 dirty regime의 보편적 스케일링 법칙을 실증했습니다.", "unresolved": "다른 금속계나 더 극단적인 무질서 조건에서도 동일한 스케일링 지수가 유지되는지, 혹은 다른 물리적 메커니즘이 개입하는지는 추가 연구가 필요합니다.", "future_work": "다양한 자성 나노입자 시스템으로 확장을 통해 AHE 스케일링의 범용성을 시험할 것으로 보입니다.", "concepts": [{"term": "비정상 홀 효과 (AHE)", "why_emerged": "강자성체에서 자화에 비례하는 비정상적인 횡방향 전압 발생을 이해하기 위해 필요.", "origin": "Hall (1881).", "connections": "Berry 곡률, 스핀-궤도 결합, 자성체 물성."}, {"term": "Dirty regime", "why_emerged": "물질 내의 불순물로 인해 전자의 평균 자유 행로가 짧아지는 극한의 수송 상태를 정의하기 위해 필요.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "Anderson 국소화, 준고전적 수송 이론."}], "english_summary": ["Accesses the AHE in the dirty regime of ferromagnetic CoFe films.", "Uses cluster beam deposition to control structural disorder.", "Finds intrinsic mechanism dominance with scaling exponent 1.6.", "Establishes a platform for disorder-based AHE engineering."]}}, {"title": "Anisotropic metamagnetism and magnetotransport of heavy rare-earth orthorhombic single-crystal TbAlGe", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/z39k-8vrq", "authors": "Ram Kumar, K. E. Avers, V. Saini, et al.", "last_authors": "S. R. Saha, J. Paglione", "summary": "Author(s): Ram Kumar, K. E. Avers, V. Saini, D. S. Sokratov, Y. Anand, P. Saraf, J. A. Horn, N. Brenowitz, S. Otazo, P. Sobel, D. Graf, S. R. Saha, and J. Paglione We report a comprehensive investigation of the anisotropic magnetism and magnetic field-induced transitions in single crystals of the orthorhombic system TbAlGe, a member of the topological $R\\mathrm{AlGe}$ (where $R$ denotes rare earth) family with the highest ordering temeprature in the $R\\mathrm{… [Phys. Rev. B 113, 174423] Published Mon May 18, 2026", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Topological RAlGe family member; studies magnetic field-induced transitions and anisotropic transport.", "tags": ["transport", "TbAlGe", "topologicalsemimetal"], "image": "", "briefing": {"background": "토폴로지적 자성 물질은 베리 곡률과 자성 구조가 얽혀 비전통적인 수송 현상을 보입니다. RAlGe 계열은 Weyl 반금속 후보군으로서 자기적 위상 전이와 수송 현상의 결합을 연구하는 중요한 플랫폼입니다.", "motivation": "TbAlGe가 RAlGe 가족 중 가장 높은 자기 정렬 온도를 가진다는 점에 주목하여, 자기장 인가에 따른 이방성 메타자기성(metamagnetism)과 수송 현상의 연관성을 조사하고자 합니다.", "result": "단결정 TbAlGe를 성장시켜 정밀한 자기장-수송 특성을 측정했습니다. 결정 방향에 따른 이방성 자기 전이와 메타자기적 거동을 확인하였으며, 이는 강한 자기 이방성과 전자 구조 사이의 밀접한 관계를 보여줍니다.", "implication": "토폴로지적 전자 구조와 자기적 정렬이 상호작용하는 복잡한 위상 물질군에서 새로운 자기적 제어 가능성을 시사합니다.", "novelty": "RAlGe 계열 중 Tb 시스템의 높은 전이 온도를 활용하여, 더 넓은 온도 영역에서 자기적 조절이 가능한 토폴로지 반금속 연구의 토대를 마련했습니다.", "unresolved": "이러한 자기 전이가 구체적으로 어떤 Weyl 마디의 변화를 유도하는지, 혹은 토폴로지적 수송 특성(예: AHE)에 어떤 기여를 하는지에 대한 상세 분석이 필요합니다.", "future_work": "ARPES를 통해 자기장에 따른 밴드 구조 변화와 Weyl 마디의 이동을 직접 관측하는 실험이 뒤따를 것으로 예상됩니다.", "concepts": [{"term": "메타자기성 (Metamagnetism)", "why_emerged": "자기장에서 자화가 비선형적으로 급격히 증가하는 현상을 설명하기 위해 필요.", "origin": "Neel (1930년대).", "connections": "자기 이방성, 교환 상호작용, 자기상 전이."}, {"term": "Weyl 반금속", "why_emerged": "에너지 밴드가 교차하는 위상적 특이점을 통해 비정상적인 수송 현상을 설명하기 위해 필요.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "위상 절연체, 카이랄 아노말리, Berry 곡률."}], "english_summary": ["Investigates TbAlGe, a rare-earth topological semimetal with the highest ordering temperature in the RAlGe family.", "Reports anisotropic magnetotransport and magnetic field-induced transitions.", "Highlights strong coupling between magnetic anisotropy and electronic properties.", "Provides a platform for controlling topological electronic states via magnetic fields."]}}, {"title": "Bulk thermal conductance of the 5/2 and 7/3 fractional quantum Hall states in the Corbino geometry", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/3mm9-47h9", "authors": "F. Boivin, M. Petrescu, Z. Berkson-Korenberg, K. W. West, L. N. Pfeiffer, and G. Gervais", "last_authors": "Z. Berkson-Korenberg, K. W. West, L. N. Pfeiffer, and G. Gervais", "summary": "Author(s): F. Boivin, M. Petrescu, Z. Berkson-Korenberg, K. W. West, L. N. Pfeiffer, and G. Gervais The peculiar 5/2 fractional quantum Hall state is a promising platform for fault-tolerant quantum computation, provided that the exact nature of its wave function can be understood. Here, using an exceptionally high-electron-mobility device patterned in the Corbino geometry, the authors report measurements of the pure bulk thermal conductance in the 5/2 and 7/3 fractional quantum Hall states. The data reveal a strong violation of the Wiedemann–Franz law, in agreement with a recent study published in N a t u r e , and suggest that the underlying wave function at filling factor 5/2 is particle–hole symmetric. [Phys. Rev. B 113, L201301] Published Thu May 21, 2026", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Experimental investigation of 5/2 FQH states, highly relevant to topological physics.", "tags": ["experiment", "quantum-Hall"], "image": "", "briefing": {"background": "분수 양자 홀(FQH) 효과는 강한 자기장 하에서 전자 간의 강한 상관관계로 인해 나타나는 위상학적 상태입니다. 특히 5/2 상태는 비아벨 통계(non-Abelian statistics)를 가질 것으로 예상되어 위상 양자 컴퓨터 구현의 핵심 후보로 꼽힙니다.", "motivation": "5/2 및 7/3 상태의 파동함수 성질을 명확히 밝히기 위해, 불순물 영향을 최소화한 코르비노(Corbino) 기하구조에서 벌크 열 전도도를 정밀 측정하고자 했습니다.", "result": "위드만-프란츠(Wiedemann-Franz) 법칙의 강한 위반을 확인하였으며, 5/2 상태의 파동함수가 입자-홀 대칭성을 가질 가능성을 제시했습니다.", "implication": "5/2 상태가 비아벨 성질을 지닌 특정 위상학적 모델(예: Moore-Read 상태 등)과 부합함을 시사하며 양자 컴퓨팅 소자 설계의 중요한 이정표가 됩니다.", "novelty": "초고이동도 시료를 이용한 코르비노 기하구조 측정으로 실험적 신뢰도를 극대화했습니다.", "unresolved": "입자-홀 대칭적 파동함수의 구체적인 미시적 모델에 대한 완전한 합의는 여전히 논쟁 중입니다.", "future_work": "더 낮은 온도에서의 정밀 측정과 대안적 파동함수 모델과의 정량적 비교가 필요합니다.", "concepts": [{"term": "Corbino geometry", "why_emerged": "가장자리 전류(edge current)의 기여를 배제하고 벌크의 응답 특성만을 분리해서 측정하기 위해 고안되었습니다.", "origin": "O. M. Corbino, 1911년 제안.", "connections": "양자 홀 효과, 비소산적 전송 현상."}, {"term": "Wiedemann-Franz law", "why_emerged": "금속의 전기 전도도와 열 전도도 사이의 비례 관계를 설명하기 위해 고안되었습니다.", "origin": "Gustav Wiedemann, Rudolf Franz, 1853년.", "connections": "Fermi 액체 이론, quasiparticle 수송."}, {"term": "Particle-hole symmetry", "why_emerged": "FQH 상태의 파동함수가 입자와 홀의 상호교환에 대해 대칭적인지 확인하여 상태의 본질을 분류하기 위해 사용됩니다.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "Moore-Read 상태, Anti-Pfaffian 상태."}], "english_summary": ["Measured bulk thermal conductance in 5/2 and 7/3 FQH states using a Corbino geometry.", "Observed a strong violation of the Wiedemann–Franz law in these quantum Hall states.", "Results suggest the 5/2 filling factor state possesses particle–hole symmetry.", "Provides experimental evidence relevant to non-Abelian topological quantum computing."]}}, {"title": "Localized-to-itinerant transition in the quasi-one-dimensional Kondo lattice CeCo2Ga8", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/6d98-gndh", "authors": "Chao Mu, Jiabin Song, Le Wang, et al.", "last_authors": "Zheng Li, Jianlin Luo", "summary": "Author(s): Chao Mu, Jiabin Song, Le Wang, Youguo Shi, Yi-feng Yang, Zheng Li, and Jianlin Luo We report $^{59}\\mathrm{Co}$ and $^{71}\\mathrm{Ga}$ nuclear magnetic resonance investigations of the quasi-one-dimensional Kondo lattice compound ${\\mathrm{CeCo}}_{2}{\\mathrm{Ga}}_{8}$. Below the coherence temperature, ${T}^{*}≈\\phantom{\\rule{4pt}{0ex}}29\\phantom{\\rule{0.28em}{0ex}}\\mathrm{K}$, the … [Phys. Rev. B 113, 195134] Published Mon May 18, 2026", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "NMR study of a quasi-1D Kondo lattice, matching interests in 1D materials and correlated systems.", "tags": ["CeCo2Ga8", "Kondolattice", "quasi-1D"], "image": "", "briefing": {"background": "Ce 화합물과 같은 Kondo 격자 시스템은 전도 전자와 국소 모멘트 사이의 상호작용으로 인해 비페르미 액체 거동이나 무거운 페르미온 물리 등이 나타나는 강상관 전자계의 대표적 연구 대상입니다.", "motivation": "quasi-1D 구조를 가진 CeCo2Ga8에서 Kondo 격자 효과와 전자들의 국소-비국소(localized-to-itinerant) 전환 과정을 규명하고자 했습니다.", "result": "NMR 측정(59Co, 71Ga)을 통해 결맞음 온도(coherence temperature, T*) 이하에서의 자기적 특성 변화와 전자 상태의 진화를 관찰했습니다.", "implication": "1차원적인 구조적 특성이 Kondo 스크리닝 과정과 자기적 정렬에 미치는 영향을 이해하는 데 기여합니다.", "novelty": "quasi-1D 시스템에서의 Kondo 격자 물리와 NMR을 이용한 국소적 자기 환경 분석을 결합하여, Kondo 시스템의 1차원적 성질을 상세히 파고들었습니다.", "unresolved": "전체적인 페르미 면의 진화에 대한 구체적인 전산모사 결과와의 직접적 매핑은 추가 연구가 필요합니다.", "future_work": "다양한 압력 하에서의 연구를 통해 국소-비국소 전이를 더욱 정밀하게 제어하는 실험이 예상됩니다.", "concepts": [{"term": "Kondo lattice", "why_emerged": "희토류 원소의 국소 스핀과 전도 전자 간의 격자 수준 상호작용을 기술하기 위해 필요했습니다.", "origin": "Kondo 효과(Jun Kondo, 1964)의 고체 내 격자 확장.", "connections": "Heavy fermion, RKKY 상호작용."}, {"term": "Coherence temperature (T*)", "why_emerged": "국소 모멘트가 전도 전자들과 얽혀 격자 전반에 걸친 결맞는 전자 상태를 형성하기 시작하는 온도를 정의하기 위해 사용됩니다.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "Kondo 스크리닝, 무거운 페르미온 액체 상태."}], "english_summary": ["Conducted 59Co and 71Ga NMR studies on the quasi-1D Kondo lattice CeCo2Ga8.", "Investigated the localized-to-itinerant electron transition below the coherence temperature.", "Provides insights into the interplay between quasi-1D structure and Kondo lattice behavior.", "Characterized magnetic and electronic environment transitions in a correlated Ce compound."]}}, {"title": "Nonvolatile control of nonlinear Hall and circular photogalvanic effects via Berry curvature dipole in multiferroic monolayer CrNBr2", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/43bn-1d17", "authors": "Wenzhe Zhou, Yinheng Li, Dehe Zhang, Guibo Zheng, Fangping Ouyang", "last_authors": "Guibo Zheng, Fangping Ouyang", "summary": "Author(s): Wenzhe Zhou, Yinheng Li, Dehe Zhang, Guibo Zheng, and Fangping Ouyang The Berry curvature dipole induced by symmetry breaking plays a pivotal role in electronic transport properties and nonlinear responses, such as the nonlinear Hall effect and circular photogalvanic effect. The study of the Berry curvature dipole is often explored in time-reversal symmetric systems, … [Phys. Rev. B 113, 195126] Published Mon May 18, 2026", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Connects Berry curvature dipoles, nonlinear Hall, and 2D materials, directly relevant to topological transport interests.", "tags": ["Berrycurvature", "nonlinearHall", "monolayer"], "image": "", "briefing": {"background": "위상학적 물질에서 베리 곡률(Berry curvature) 분포의 비대칭성은 비선형 수송 현상을 유도하며, 이는 차세대 소자 개발을 위한 물리적 원천으로 주목받고 있습니다.", "motivation": "다강성(multiferroic) 단층 물질인 CrNBr2에서 베리 곡률 쌍극자(Berry curvature dipole)를 통해 비선형 홀 효과와 광전류 효과를 제어하고자 했습니다.", "result": "비휘발성 외부 제어를 통해 비선형 홀 효과와 원형
