<title>Daily Paper Slideshow</title>
<style>
  :root {
    color-scheme: light;
    --bg: #f6f7f4;
    --paper: #ffffff;
    --ink: #111827;
    --muted: #64748b;
    --line: #d8ddd2;
    --accent: #176b87;
    --accent-2: #9a3412;
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; overflow: auto; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: var(--bg); color: var(--ink); }
  .shell { max-width: 1500px; min-height: 100vh; margin: 0 auto; padding: 14px 18px; display: flex; flex-direction: column; }
  .topbar { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 16px; }
  .top-actions { display: flex; align-items: center; gap: 10px; }
  .topbar a, button { border: 1px solid var(--line); border-radius: 8px; background: var(--paper); color: var(--ink); padding: 10px 14px; font-weight: 700; text-decoration: none; cursor: pointer; }
  button.primary { background: var(--accent); border-color: var(--accent); color: white; }
  button:disabled { opacity: 0.45; cursor: not-allowed; }
  .counter { color: var(--muted); font-weight: 700; }
  .slide { min-height: calc(100vh - 82px); background: var(--paper); border: 1px solid var(--line); border-radius: 10px; padding: 18px; box-shadow: 0 18px 42px rgba(15, 23, 42, 0.10); display: grid; grid-template-columns: minmax(310px, 0.86fr) minmax(0, 1.55fr); gap: 18px; overflow: visible; }
  .paper-head { min-width: 0; min-height: 0; overflow: visible; display: flex; flex-direction: column; gap: 12px; }
  .figure { margin: 0; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: #f8fafc; }
  .figure img { display: block; width: 100%; max-height: 41vh; object-fit: contain; background: white; }
  .figure figcaption { padding: 7px 10px; color: var(--muted); font-size: 12px; line-height: 1.3; }
  .head-text { display: flex; flex-direction: column; gap: 9px; min-width: 0; }
  .badges { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .badge { border-radius: 999px; padding: 5px 9px; background: #eef2ff; color: #3730a3; font-size: 12px; font-weight: 800; }
  .score { background: #fee2e2; color: #991b1b; }
  h1 { margin: 0; font-size: 25px; line-height: 1.15; letter-spacing: 0; overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
  h1 a { color: inherit; text-decoration-color: rgba(23, 107, 135, 0.35); text-decoration-thickness: 2px; text-underline-offset: 4px; }
  h1 a:hover { color: var(--accent); text-decoration-color: var(--accent); }
  .meta, .authors, .why, .abstract { font-size: 13px; line-height: 1.45; }
  .meta, .authors { color: var(--muted); }
  .why strong, .abstract strong, .authors strong { color: var(--ink); }
  .authors { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .why { border-left: 4px solid var(--accent-2); padding-left: 10px; color: #374151; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .abstract { border-top: 1px solid var(--line); padding-top: 14px; color: #374151; }
  .original-abstract { border-top: 1px solid var(--line); padding-top: 10px; color: #374151; font-size: 11.5px; line-height: 1.35; overflow-wrap: anywhere; }
  .original-abstract strong { display: block; margin-bottom: 4px; color: var(--ink); }
  .tags { display: flex; flex-wrap: wrap; gap: 8px; }
  .tag { border-radius: 999px; padding: 4px 8px; background: #f1f5f9; color: #475569; font-size: 12px; font-weight: 700; }
  .head-text > .link { display: none; }
  .briefing { min-width: 0; min-height: 0; overflow: visible; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); grid-auto-rows: minmax(0, auto); align-content: start; gap: 11px 18px; border-top: 0; padding-top: 0; }
  .brief-section { min-width: 0; }
  .brief-section.wide { grid-column: 1 / -1; }
  .brief-section h2 { margin: 0 0 4px; font-size: 14px; line-height: 1.22; color: #0f766e; letter-spacing: 0; }
  .brief-section p, .brief-section li { margin: 0; font-size: 12.5px; line-height: 1.42; color: #1f2937; overflow-wrap: anywhere; }
  .brief-section ul { margin: 0; padding-left: 20px; }
  .concepts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 9px 14px; }
  .concept { border-top: 1px solid var(--line); padding-top: 7px; }
  .concept h3 { margin: 0 0 4px; font-size: 13px; color: #7c2d12; letter-spacing: 0; }
  .concept p { margin: 2px 0 0; font-size: 11.5px; line-height: 1.35; color: #374151; overflow-wrap: anywhere; }
  .concept b { color: #111827; }
  .link { color: var(--accent); font-weight: 800; text-decoration: none; }
  .empty { padding: 48px; background: var(--paper); border: 1px solid var(--line); border-radius: 12px; color: var(--muted); }
  @media (max-width: 860px) {
    .shell { padding: 14px; }
    .topbar, .top-actions { align-items: stretch; flex-direction: column; }
    .slide, .briefing, .concepts { grid-template-columns: 1fr; }
    .slide { min-height: auto; overflow: visible; display: grid; }
    h1 { font-size: 28px; }
  }
</style>

<script>
const slides = [{"title": "Control of the Electronic and Atomic Structure of the Altermagnetic -MnTe Surface via Substrate-Induced Surfactants", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2610.35236", "authors": "Martin Heinrich, Mahdi Hajlaoui, Takuya Takashiro, et al.", "last_authors": "Gunther Springholz, Matthias Muntwiler", "summary": "Altermagnets are a novel class of materials with unique momentum dependent spin-polarization of the electronic band structure, which opens up new avenues for spintronic devices. Altermagnetic {\\alpha}-MnTe is particularly interesting for such applications due to its giant spin splitting and the persistence of altermagnetic order up to room temperature. Growth of thin films is, however, challenging and governed by interactions with the substrate. As a result, the surface of {\\alpha}-MnTe thin films exhibits very different atomic structures in dependence of the substrate material. Whereas on SrF2(111) an atomically clean, perfectly (2x2) reconstructed surface forms, on InP(111)A the MnTe surface is always InTe terminated due to super-segregation of In from the substrate to the surface. Most strikingly, the InTe surfactant layer displays a quasi-periodic dislocation network to accommodate the InTe/MnTe lattice mismatch. This leads to the emergence of distinct surface states in dependence of surface termination that strongly affect the electronic band structure at the surface as shown by angle resolved photoemission and tunneling spectroscopy. Thus, control and characterization of the atomic structure of the surface is fundamentally important for understanding the properties of altermagnets and provides room for engineering and tailoring of spin-polarized states in actual devices.", "tier": "A_MUST_READ", "score": "10", "reason": "Direct ARPES and STS study of the band structure in a key altermagnetic material.", "tags": ["method", "material", "ARPES", "altermagnetism", "STS"], "image": "https://arxiv.org/html/2610.35236v1/figure1-intro-rheed-leed_v-20260907.png", "briefing": {"background": "알터마그네틱(Altermagnetic) 물질은 기존의 강자성이나 반강자성과 달리, 격자 대칭성에 의해 결정되는 운동량 의존적 스핀 분할(momentum-dependent spin splitting)을 보이는 새로운 자성 상태입니다. 이는 스핀트로닉스 소자 응용 가능성 때문에 큰 주목을 받고 있습니다.", "motivation": "알터마그네틱 물질인 알파-MnTe 박막의 성장 과정에서 기판과 박막 간의 상호작용이 표면 원자 구조와 전자 상태에 미치는 영향을 규명하고, 이를 제어할 수 있는지를 확인하고자 합니다.", "result": "SrF2 기판 위에서는 깨끗한 (2x2) 재구성이 형성되는 반면, InP 기판 위에서는 기판의 인듐이 표면으로 분리(segregation)되어 InTe 종단층이 형성됨을 발견했습니다. 이 InTe 층은 격자 불일치를 해소하기 위해 전위 네트워크를 형성하며, 이로 인해 표면 전자 구조가 크게 변화함을 ARPES와 STS로 확인했습니다.", "implication": "알터마그네틱 물질의 스핀 분할 상태는 표면 종단 상태와 원자 배열에 극도로 민감하므로, 소자 구현을 위해서는 박막 성장에서 기판 선택과 계면 제어가 필수적임을 시사합니다.", "novelty": "실제 알터마그네틱 박막 표면에서 기판 유도 계면 공학(substrate-induced surfactant engineering)을 통해 전자 구조를 조절할 수 있음을 직접적으로 증명했습니다.", "unresolved": "InTe 층이 존재할 때 나타나는 표면 상태가 알터마그네틱 스핀 분할 특성을 어떻게 변화시키는지에 대한 정량적 스핀 해상도 데이터는 추가 연구가 필요합니다.", "future_work": "표면 종단 구조를 정밀하게 제어하여 알터마그네틱 스핀 분할을 원하는 대로 설계하는 공정 기술 개발이 기대됩니다.", "concepts": [{"term": "Altermagnetism", "why_emerged": "기존 자성 분류 체계에서 설명되지 않는, 스핀 정렬은 상쇄되지만 스핀 분할이 존재하는 자성체를 분류하기 위해 제안됨.", "origin": "최근 2020년대 초반, 이론 물리학계에서 본격적으로 확립됨.", "connections": "반강자성, 스핀트로닉스, 베리 곡률(Berry curvature)."}, {"term": "Surfactant-mediated growth", "why_emerged": "박막 성장 시 격자 불일치를 완화하거나 원하는 표면 종단 상태를 얻기 위해 사용됨.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "박막 성장 물리, 계면 공학."}], "english_summary": ["Surface atomic structure of alpha-MnTe altermagnet films depends strongly on the substrate.", "InP substrates lead to an InTe surfactant layer, while SrF2 yields clean (2x2) surfaces.", "ARPES and STS confirm that these surface terminations significantly alter the electronic bands.", "Controlling surface termination is crucial for engineering spintronic properties in altermagnets."]}}, {"title": "Direct observation of a spin-polarized surface Dirac gap in the antiferromagnetic topological insulator NdBi (Nat. Commun.)", "journal": "arXiv_CondMat", "source": "author whitelist", "link": "https://arxiv.org/abs/2610.35353", "authors": "Yuto Fukushima, Hiroyuki S. Suzuki, Masayuki Ochi, et al.", "last_authors": "Ryo Mori, Takeshi Kondo", "summary": "A gapped Dirac cone in antiferromagnetic topological insulators (AFM-TIs) is essential for realizing the quantized anomalous Hall effect, yet its intrinsic magnitude remains controversial. In the prototypical AFM-TI MnBi2Te4, however, the observed Dirac gap is significantly smaller than theoretical predictions or nearly absent, highlighting a long-standing discrepancy. Here we demonstrate that NdBi hosts a spin-polarized topological surface Dirac cone with a sizable gap of 17 meV at the Dirac point, in excellent agreement with density functional theory predictions (12 meV). This direct observation is enabled by high-resolution 7 eV laser-based spin- and angle-resolved photoemission spectroscopy, which unambiguously disentangles the spin-polarized surface Dirac cone from bulk-derived states. Furthermore, through temperature dependence and controlled surface contamination, we establish a direct linkage between surface magnetism and the Dirac gap, demonstrating that the gap opens only in the presence of surface magnetic order. These results provide definitive spectroscopic evidence for an intrinsic Dirac gap in AFM-TIs and establish NdBi as a model platform to resolve the long-standing discrepancy between experiment and theory in AFM-TIs.", "tier": "A_MUST_READ", "score": "10", "reason": "author whitelist: Takeshi Kondo", "tags": ["angle-resolvedphotoemission", "photoemission", "STS", "Dirac", "anomalousHall", "topologicalinsulator", "topological", "ferromagnet"], "image": "https://arxiv.org/html/2610.35353v1/Fig1.png", "briefing": {"background": "반강자성 위상 절연체(AFM-TI)는 양자 변칙 홀 효과를 구현할 후보로 꼽히지만, 실제 물질에서 이론적으로 예측된 표면 디랙 콘의 간극(gap)이 관측되지 않거나 너무 작은 문제가 존재해 왔습니다.", "motivation": "NdBi 물질이 AFM-TI로서 이론적 예측과 일치하는 실질적인 스핀 편극 디랙 간극을 보유하고 있는지 검증하고자 했습니다.", "result": "7 eV 레이저를 이용한 고분해능 스핀-ARPES를 통해 NdBi 표면에서 17 meV의 상당한 크기를 가진 디랙 간극을 관측했습니다. 이는 DFT 이론값인 12 meV와 매우 잘 일치합니다.", "implication": "NdBi가 AFM-TI의 이론과 실험 간의 괴리를 해결할 수 있는 벤치마크 물질임을 증명했습니다. 표면 자기 질서가 간극 형성에 직접 관여함도 확인했습니다.", "novelty": "기존 MnBi2Te4 등에서 문제가 되었던 '작은 간극' 이슈를 NdBi라는 새로운 플랫폼에서 고분해능 측정을 통해 명쾌하게 해결했습니다.", "unresolved": "이 간극이 실제 양자 변칙 홀 효과로 이어지는지에 대한 수송 현상 실험은 논문에서 직접 다루지 않았습니다.", "future_work": "저온 수송 측정을 통한 양자 변칙 홀 효과의 직접적인 관측 및 간극의 자기장 의존성 연구.", "concepts": [{"term": "Antiferromagnetic Topological Insulator (AFM-TI)", "why_emerged": "위상적으로 비자명한 상태와 반강자성 질서가 결합된 상태를 연구하기 위해 등장.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "MnBi2Te4, 양자 변칙 홀 효과, 시간 반전 대칭성 파괴."}, {"term": "Dirac gap", "why_emerged": "위상 표면 상태의 축퇴를 깨고 질량(mass)을 부여하여 위상적 응용을 가능하게 하기 위해 필요.", "origin": "위상 절연체 연구 초기 단계부터 확립됨.", "connections": "베리 곡률, 위상 상전이."}], "english_summary": ["NdBi is identified as an antiferromagnetic topological insulator with a clear Dirac gap.", "High-resolution 7 eV laser spin-ARPES reveals a 17 meV gap, matching DFT predictions.", "The gap originates from surface magnetic order, as evidenced by temperature dependence.", "NdBi serves as a definitive platform to resolve long-standing theory-experiment discrepancies in AFM-TIs."]}}, {"title": "Evaluating the Structural Basis for Polar Altermagnet Candidate Ca3(Ru,Ti)2O7", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2606.16181", "authors": "Akash Saha, Yihuang Xiong, Vladimir A. Stoica, et al.", "last_authors": "Zhiqiang Mao, Venkatraman Gopalan", "summary": "The interplay between polar and altermagnetic orders remains largely unexplored in the broader landscape of correlated electron systems. Density functional theory (DFT) within the PBEsol + U U treatment propose Ca 3 Ru 2 O 7 as a polar altermagnet, reliant on the transformation of the experimentally reported B ​ b ​ 2 1 ​ m Bb2_{1}m phase to a lower symmetry P ​ n ​ 2 1 ​ a Pn2_{1}a structure. Here, we perform a targeted search for the P ​ n ​ 2 1 ​ a Pn2_{1} hors": "Lun-Hui Hu, Elbio Dagotto", "summary": "Altermagnetism—moment-compensated magnetism with momentum-dependent spin splitting—has so far been realized primarily in Néel-type antiferromagnets. Here, we demonstrate altermagnetism in folded iron chain systems with block-type magnetic order (e.g.,$↑↑↓↓$). In the strictly one-dimensional (1D) cas…", "tier": "B_IMPORTANT_CONDMAT", "score": "9", "reason": "Altermagnetism in 1D systems, directly relevant to a strong interest of the user.", "tags": ["altermagnetism", "1Dmaterials", "magneticmaterials", "theory"], "image": "", "briefing": {"background": "알터마그네티즘(Altermagnetism)은 기존의 강자성(자화 존재)이나 일반적 반강자성(스핀 분할 없음)의 범주를 넘어, 순자화는 상쇄되면서도 운동량 의존적 스핀 분할을 보이는 새로운 자기 위상입니다.", "motivation": "기존의 알터마그네티즘 연구가 3차원 네엘(Néel)형 반강자체에 집중된 반면, 1차원 철 사슬 시스템에서도 이러한 특성이 발현 가능한지 이론적으로 검증하고자 함.", "result": "접힌 철 사슬 구조에서 블록형 자기 정렬이 존재할 때 알터마그네틱 특성이 나타남을 확인하였으며, 특히 1D 극한 상황에서의 거동을 분석함.", "implication": "1차원 저차원 물질에서도 스핀트로닉스 응용이 가능한 알터마그네틱 상태를 설계할 수 있음을 시사함.", "novelty": "1D 시스템으로 알터마그네티즘의 영역을 확장함. 독자가 관심 있는 준1차원 물질 및 강상관 전자계 연구에 이론적 토대를 제공함.", "unresolved": "실제 실험적 물질 구현 및 이에 대한 직접적인 스핀 분할 측정은 아직 이루어지지 않음.", "future_work": "해당 이론을 만족하는 실제 1D 물질 후보군 탐색 및 ARPES를 통한 스핀 분할 직접 관측 시도.", "concepts": [{"term": "알터마그네티즘", "why_emerged": "강자성과 반강자성의 이분법적 분류를 넘어선 새로운 자기 질서 규명이 필요했기 때문.", "origin": "최근 1-2년 내 이론적 체계가 정립됨 (예: Jungwirth 그룹 등).", "connections": "반강자성, 스핀트로닉스, 베리 곡률과 연결됨."}, {"term": "블록형 자기 정렬", "why_emerged": "강한 자기적 상호작용과 기하학적 제약이 결합된 저차원 구조에서 나타나는 특이 정렬 패턴.", "origin": "철 기반 사슬 모델 연구에서 관찰.", "connections": "철계 초전도체, 1D 사슬 모델."}], "english_summary": ["Extends altermagnetism concepts to 1D folded iron chain systems.", "Identifies block-type magnetic orders that support momentum-dependent spin splitting.", "Provides a theoretical framework for potential spintronic applications in low-dimensional materials.", "Complements existing studies of 3D Néel-type altermagnets."]}}, {"title": "Chirality-Resolved Spectroscopy of Caroli–de Gennes–Matricon , "Provides a practical framework for investigating rotational symmetry breaking."]}}, {"title": "First-Principles Wannier Representation of Proximity Effects", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2607.25690", "authors": "Yaroslav Zhumagulov, Johan F\\'elisaz, Stepan S. Tsirkin, Denis Kochan, Oleg V. Yazyev", "last_authors": "Denis Kochan, Oleg V. Yazyev", "summary": "Proximity effects in layered heterostructures are commonly represented by static parameters fitted to first-principles band structures, an approximation that usually discards the energy dependence of interlayer hybridization, momentum transfer, and spatial structure. We address this limitation by deriving a dynamical proximity operator directly from density functional theory by downfolding the heterostructure Kohn-Sham Hamiltonian onto a fixed low-energy target Wannier subspace. We demonstrate the method for three different graphene heterostructures coupled to magnetic and semiconducting substrates. Graphene/hBN/Co(0001) exhibits proximity-induced exchange resonances driven by hybridization with Co states. Graphene/PtSe$_2$ develops a sublattice-selective, intervalley-coherent, proximity-induced coupling. For graphene/WSe$_2$, we identify the spatial modulation of both Rashba and valley-Zeeman proximity-induced spin-orbit couplings. The method determines the full microscopic structure of the proximity coupling from first principles, providing input for transport and correlated-phase calculations.", "tier": "B_IMPORTANT_CONDMAT", "score": "9", "reason": "High relevance: DFT/Wannier modeling of proximity effects in graphene/WSe2 and other vdW heterostructures.; demoted from A: broad CM, not direct user/project hit", "tags": ["method", "graphene", "heterostructure"], "image": "https://arxiv.org/html/2607.25690v2/fig_cobalt.png", "briefing": {"background": "반데르발스 이종접합에서 근접 효과(proximity effect)는 계면을 통한 상태 혼성화를 통해 한 층의 성질을 다른 층으로 유도하는 물리 현상입니다. 기존에는 이를 정적인 매개변수로 근사하여 에너지 의존성을 무시하는 한계가 있었습니다.", "motivation": "이종접합에서의 층간 혼성화, 운동량 전달, 공간적 구조를 모두 포함하는 미시적이고 동역학적인 근접 효과 모델링의 필요성에 따라 본 연구가 수행되었습니다.", "result": "DFT 해밀토니안을 저에너지 타겟 Wannier 부분 공간으로 다운폴딩하여 근접 효과를 동역학적 연산자로 유도했습니다. 이를 통해 Graphene/hBN/Co, Graphene/PtSe2, Graphene/WSe2 구조에서 스핀-궤도 결합 및 교환 상호작용의 미시적 분포를 성공적으로 계산했습니다.", "implication": "이 모델링 기법은 향후 이종접합을 이용한 수송 현상 계산이나 상관관계가 강한 위상물질의 계산적 설계를 위한 정밀한 입력값을 제공할 것입니다.", "novelty": "정적인 매개변수 근사를 넘어, DFT 수준에서 근접 효과의 완전한 미시적 구조를 도출했다는 점이 혁신적이며, 특히 모아레 시스템이나 위상 절연체 기반 소자 연구에 직접적인 도구를 제공합니다.", "unresolved": "계산적 복잡도가 높아 대규모 시스템에 적용할 경우 Wannier 기반 확장의 한계가 있을 수 있습니다.", "future_work": "본 기법을 복잡한 강상관 전이금속 산화물 기반 이종접합이나 동역학적 위상 현상이 나타나는 시스템으로 확장할 예정입니다.", "concepts": [{"term": "Wannier downfolding", "why_emerged": "DFT의 Bloch 상태를 국소적인 Wannier 함수로 변환하여 유효 모델을 구성하기 위해 필요함.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "Wannier90 패키지, 투영 방법론, 다체 섭동 이론."}, {"term": "Proximity Effect", "why_emerged": "계면을 통해 서로 다른 성질의 재료가 상호작용할 때 물리적 기원을 규명하기 위함.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "초전도 근접 효과, 스핀-궤도 근접 효과, 위상 절연체 heterostructure."}], "english_summary": ["New method derives a dynamical proximity operator from DFT via Wannier subspace downfolding.", "The approach captures energy-dependent interlayer hybridization and spatial modulation of proximity couplings.", "Demonstrated on graphene heterostructures to reveal exchange resonances and Rashba/valley-Zeeman physics.", "Provides a rigorous microscopic framework for modeling transport in vdW heterostructures."]}}, {"title": "Nanoscale mapping of native defects in Td-MoTe2 and their impact on graphene-based van der Waals heterostructures", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2610.34924", "authors": "Wojciech Ry\\'s, Iaroslav Lutsyk, Mindaugas Lukosius, et al.", "last_authors": "Pawe{\\l} Krukowski, Pawe{\\l} J. Kowalczyk", "summary": "We investigate native defects and their impact on the electronic structure of Td-MoTe2 and graphene/Td-MoTe2 van der Waals heterostructures using scanning tunnelling microscopy and spectroscopy. STM reveals a high density of circular, hollow surface defects that we attribute to Te vacancies. STS on pristine MoTe2 shows semimetallic, V-shaped dI/dV spectra with subtle low-energy states. The vacancies suppress the tunnelling conductance below the Fermi level without introducing new sharp defect-related resonances, consistent with a vacancy-induced redistribution of Mo-Te spectral weight rather than the appearance of new electronic states. In the heterostructure, graphene preserves these MoTe2 fingerprints with no noticeable graphene doping or charge transfer. Our results demonstrate that isolated native Te vacancies act as spectroscopically weak perturbations to the low-energy electronic structure of graphene. The graphene overlayer further screens their impact on the electronic structure, making graphene/Td-MoTe2 heterostructures intrinsically tolerant to such interface defects.", "tier": "B_IMPORTANT_CONDMAT", "score": "9", "reason": "Direct STM/STS study of defects and electronic structure in a topological vdW heterostructure.; demoted from A: broad CM, not direct user/project hit", "tags": ["method", "material", "STS", "Weyl-semimetal"], "image": "https://arxiv.org/static/browse/0.3.4/images/arxiv-logo-fb.png", "briefing": {"background": "Td-MoTe2는 위상적 특성을 가진 Weyl 반금속 후보 물질로, 이 물질의 전자 구조는 표면 결함과 같은 구조적 불완전성에 크게 영향을 받을 수 있어 STM/STS 연구가 필수적입니다.", "motivation": "Td-MoTe2 표면에 존재하는 천연 결함이 그 자체의 전자 구조와 그래핀과 결합된 이종접합에서의 전자 특성에 어떤 영향을 미치는지 규명하고자 했습니다.", "result": "STM을 통해 Te 원자 공공(vacancy) 결함을 발견했으며, STS 분석 결과 이 공공들이 국소적인 공명 상태를 생성하기보다는 전체적인 분광학적 무게(spectral weight)를 재분배하는 미세한 교란임을 확인했습니다.", "implication": "그래핀이 Td-MoTe2 위의 결함 영향을 효과적으로 차폐하여, 이종접합 소자에서 본질적인 물리 특성을 유지할 수 있음을 입증했습니다.", "novelty": "위상 반금속 표면 결함의 실질적인 분광학적 효과를 STM으로 직접 관측하고, 이종접합 내에서의 물리적 안정성을 확인한 점이 주목할 만합니다.", "unresolved": "Te 공공의 밀도가 매우 높을 경우 위상적 표면 상태(Fermi arc)가 어떻게 보호되는지에 대한 정밀한 분석이 추가로 필요합니다.", "future_work": "더 높은 결함 밀도를 가진 샘플에서 전자 상관관계의 변화와 위상적 안정성을 추가 조사할 계획입니다.", "concepts": [{"term": "Td-MoTe2", "why_emerged": "Weyl 반금속 상태가 구현 가능한 이차원 전이금속 칼코겐 화합물로 주목됨.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "Weyl 반금속, 위상 상전이, 1T' 구조."}, {"term": "STM/STS", "why_emerged": "원자 수준의 국소 상태 밀도를 직접 탐색하기 위해 필요.", "origin": "Gerd Binnig and Heinrich Rohrer (1981).", "connections": "준입자 간섭 영상(QPI), 국소 전자 상태."}], "english_summary": ["Investigated native Te vacancies in Td-MoTe2 using STM/STS.", "Defects act as minor perturbations that redistribute spectral weight without inducing sharp resonance states.", "Graphene overlayer provides screening that protects the heterostructure's electronic properties.", "Suggests intrinsic tolerance of graphene/Td-MoTe2 heterostructures to interface defects."]}}, {"title": "Nodeless d-wave pairing in monolayer FeSe revealed by intra-unit-cell Josephson interferometry", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2610.34382", "authors": "Runxin Li, Yuchen Huo, Jiong Mei, et al.", "last_authors": "Qi-Kun Xue, Yu-Jie Sun", "summary": "The Josephson effect provides a direct phase-sensitive probe of superconducting order and has played a central role in identifying unconventional pairing symmetries1-6. Conventional Josephson interferometry, however, extracts phase information through engineered junction geometries and crystallographic orientations, rather than by resolving the internal phase structure of the pair state within a single unit cell. Here, we use a superconducting Nb tip to realize atomic-scale Josephson interferometry in monolayer FeSe/SrTiO3. Despite a fully gapped quasiparticle spectrum, the local Josephson response exhibits a striking intra-unit-cell pattern, with maxima centred on Fe-Fe bonds and robust nodal lines along the Fe-Se directions. We show that these nodal lines arise from destructive interference between Josephson tunnelling amplitudes associated with opposite-sign pairing components. M ature.com/m685/springer-static/image/art%3A10.1038%2Fs41567-026-03495-x/MediaObjects/41567_2026_3495_Fig1_HTML.png", "briefing": {"background": "알터자성(Altermagnetism)은 시간 역전 대칭성은 깨져있지만 스핀 보상(compensation)이 이루어지는 새로운 자기 질서 상태로, spintronics의 새로운 후보입니다.", "motivation": "합성이 어려운 알터자성 물질의 대안으로, 반데르발스 물질을 트위스트 적층하여 인위적으로 알터자성 상태를 유도하고자 하였습니다.", "result": "직교 트위스트된 반데르발스 동종 구조(homostructure)에서 알터자성적 특성이 나타남을 실험적으로 확인했습니다.", "implication": "합성 및 제어가 어려운 단일 물질 대신 트위스트 적층이라는 디자인 전략으로 알터자성 구현이 가능함을 보였습니다.", "novelty": "트위스트 각도와 구조 제어를 통해 기존에 발견되지 않았던 새로운 알터자성 위상을 설계했다는 점이 혁신적입니다.", "unresolved": "트위스트 각도에 따른 알터자성 안정성 범위와 실제 spintronics 소자에서의 구동 안정성이 추가 검증되어야 합니다.", "future_work": "트위스트 층상 구조에서의 Berry 곡률 측정 및 anomalous Hall 효과에 대한 상세한 전기적 수송 특성 연구가 이어질 것입니다.", "concepts": [{"term": "알터자성(Altermagnetism)", "why_emerged": "강자성체의 표유 자장 문제와 반강자성체의 낮은 제어 효율을 극복하기 위해 제안됨.", "origin": "Jungwirth et al.(2022) 등 최근 제안됨.", "connections": "비상대론적 스핀 분할, 시간 역전 대칭성 파괴."}, {"term": "트위스트 반데르발스 동종 구조", "why_emerged": "층상 물질 간의 적층 각도에 따른 밴드 구조 및 상관관계 효과를 엔지니어링하기 위함.", "origin": "트위스티드 이중층 그래핀(Jarillo-Herrero, 2018).", "connections": "모아레 격자, 강상관 물리, 밴드 엔지니어링."}], "english_summary": ["Observation of altermagnetism in orthogonally twisted van der Waals homostructures.", "Provides a design strategy for thin-film altermagnetic spintronic devices.", "Avoids the difficulty of synthesizing intrinsic altermagnetic materials.", "Highlights the role of moiré physics in emerging magnetic phases."]}}, {"title": "Anatomy of spin-orbit torques in monolayer Fe3GeTe2 and Fe3GaTe2: Insights from atomistic and momentum-space decompositions", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/1v68-qwcl", "authors": "Gusthavo M. S. Brizolla, Stepan S. Tsirkin, Yaroslav Zhumagulov, Jaroslav Fabian", "last_authors": "Yaroslav Zhumagulov, Jaroslav Fabian", "summary": "Spin–orbit torque (SOT) enables electrical magnetization control in spintronic devices. Here, the authors calculate S 대칭성 깨짐, 다강체, 국소 스핀 분극."}], "english_summary": ["Investigated SOT in monolayer Fe3GeTe2 and Fe3GaTe2 using DFT and Kubo formalism.", "Identified that hidden atomic-scale torques are up to 30 times larger than net torques.", "Found that horizontal mirror symmetry causes cancellation of these torques.", "Suggests that vdW engineering could unlock these hidden torques for high-efficiency spintronics."]}}, {"title": "Anomalous Hall enhancement in fully compensated noncollinear antiferromagnetic Cr-doped Mn3Sn", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/kz93-vvjb", "authors": "Ying Zhang, Xin Chen, Hang Xie, Ziyan Luo, Yihong Wu, Lei Shen (沈雷)", "last_authors": "Yihong Wu, Lei Shen (沈雷)", "summary": "The noncollinear antiferromagnet (AFM), ${\\mathrm{Mn}}_{3}\\mathrm{Sn}$, exhibits ultrafast spin dynamics and negligible stray fields, making it a promising candidate for fast and energy-efficient spintronic devices. However, its practical applications remain limited by the relatively small Hall resp…", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Direct relevance to topological magnets, Berry curvature, and anomalous Hall effect in a key material class.", "tags": ["material", "Mn3Sn", "anomalousHall"], "image": "", "briefing": {"background": "Mn3Sn은 비공선형 반강자성체로서 거대한 변칙 홀 효과(AHE)를 나타내어 차세대 스피트로닉스 소재로 주목받고 있습니다.", "motivation": "Mn3Sn의 실용적인 응용을 위해 홀 응답을 향상시키려는 시도가 있으나, 크기가 여전히 제한적이라는 한계가 있습니다.", "result": "Cr 도핑을 통해 Mn3Sn의 자기적 성질을 변조함으로써 변칙 홀 효과의 향상을 유도했습니다.", "implication": "비공선형 반강자성체의 전자 구조와 베리 곡률을 도핑으로 미세 조정하여 기능성 자성체를 설계할 수 있음을 보여줍니다.", "novelty": "완전 보상된 비공선형 반강자성체에서의 홀 응답 제어 가능성을 확인하여, 에너지 효율적인 소자 구현에 기여합니다.", "unresolved": "도핑이 베리 곡률의 구조와 반강자성 스핀 구조에 미치는 정확한 메커니즘은 추가적인 실험적 검증이 필요합니다.", "future_work": "도핑 농도에 따른 자성 구조의 변화와 베리 곡률의 진화를 ARPES 등으로 직접 확인하는 연구가 요구됩니다.", "concepts": [{"term": "Anomalous Hall Effect (AHE)", "why_emerged": "강자성체 내 전자의 스핀-궤도 결합에 의한 베리 곡률로 인해 전압이 생성되는 현상 해석.", "origin": "Hall (1881) 발견 이후, Karplus-Luttinger (1954) 이론.", "connections": "베리 위상, 위상학적 자성체, 비공선형 반강자성체."}, {"term": "Noncollinear Antiferromagnet", "why_emerged": "기존의 공선형 반강자성체와 달리 스핀이 특정 평면에서 복잡하게 배열되어 자성-위상학적 물성을 동시에 갖추기 위해.", "origin": "Mn3Sn의 경우 Nakatsuji et al., Nature (2015)에서 주목받기 시작.", "connections": "카이랄 자성, 스핀 탄성파(Magnon), 토폴로지."}], "english_summary": ["Explored anomalous Hall effect enhancement in Cr-doped Mn3Sn.", "Aims to improve Hall response in noncollinear antiferromagnets for spintronics.", "Utilizes doping to modulate magnetic properties of fully compensated AFM systems.", "Shows promise for energy-efficient topological magnetic devices."]}}, {"title": "Controllable quantum spin Hall phases in Bi2Te3-family van der Waals heterobilayers", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/hl8t-qzls", "authors": "E. V. C. Lopes, P. H. Sophia, F. Crasto de Lima, and A. Fazzio", "last_authors": "E. V. C. Lopes, P. H. Sophia, F. Crasto de Lima, and A. Fazzio", "summary": "The tunability and control of topological edge/surface states are crucial for the development of new device applications. In this work, by combining first-principles calculations and Wannier-based tight-binding methods, we show the emergence of quantum spin Hall phases in van der Waals heterostructu…", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Material-specific study of topological phases in Bi2Te3-family heterostructures.", "tags": ["theory", "Bi2Te3", "topological-insulator"], "image": "", "briefing": {"background": "Bi2Te3 계열은 위상 절연체의 대표적인 물질로, 이들의 이종접합은 위상학적 상태를 제어할 수 있는 플랫폼을 제공합니다.", "motivation": "위상 절연체 기반의 이종구조에서 양자 스핀 홀(QSH) 상태를 인위적으로 제어하고 활용하기 위한 설계 원리를 확립하고자 했습니다.", "result": "제1원리 계산을 통해 Bi2Te3 계열 반데르발스 이종 이중층(heterobilayers) 구조에서 QSH 위상이 나타날 수 있음을 확인했습니다.", "implication": "위상적 성질을 외부적으로 조절 가능한 소자 설계의 이론적 토대를 마련하며, 새로운 위상 전자공학 소재 가능성을 제시합니다.", "novelty": "Bi2Te3 물질군 내에서의 조합을 통해 QSH 상태의 제어 가능성을 입증했다는 점이 독창적입니다.", "unresolved": "이론적으로 예측된 QSH 상태가 실제 소자 환경이 ate control of quantum phases in transition metal dichalcogenides."]}}, {"title": "YCl electride as a multiorbital correlated topological dice lattice system", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/pj5b-mzql", "authors": "Jianqi Zhong, Songyuan Geng, Teng-Fei Ying, Haoxiang Li, Benjamin T. Zhou", "last_authors": "Haoxiang Li, Benjamin T. Zhou", "summary": "The long-sought dice lattice flat band has recently been discovered for the first time in two-dimensional layered electride yttrium monochloride (YCl) [Geng et al. , Nat. Commun. 17 , 2213 (2026) ]. While essential flat band features of YCl were captured by an idealized simple dice lattice model [Geng…", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Electronic structure of a real topological material with correlated flat bands.", "tags": ["material", "YCl", "topology"], "image": "", "briefing": {"background": "위상 물성학에서는 격자 구조의 대칭성과 전자의 궤도 중첩을 조절하여 강한 상관관계를 유도하는 평탄띠(flat band)를 구현하는 것이 핵심 과제입니다. 특히 주사위 격자(dice lattice)는 특유의 밴드 구조로 인해 위상적 비자명성과 상관계수 효과를 동시에 연구할 수 있는 이상적인 플랫폼입니다.", "motivation": "최근 2차원 적층 일렉트라이드(electride)인 YCl에서 발견된 주사위 격자 평탄띠가 단순한 이상적 모델을 넘어 실제 다중 궤도(multiorbital) 상관관계가 밴드 구조에 미치는 영향을 규명하고자 합니다.", "result": "YCl 시스템의 전자 구조에서 다중 궤도 특성이 어떻게 평탄띠의 위상적 성질을 강화하거나 변형시키는지 이론적으로 해석했습니다.", "implication": "YCl이 단순 모델을 넘어 강한 전자 상관관계가 지배하는 위상적 물질임을 시사하며, 이는 향후 고온 초전도체나 위상적 자성체 연구의 새로운 후보군이 될 수 있습니다.", "novelty": "독자님께서 관심 가지시는 위상 물질과 전자 구조의 상관관계 연구 관점에서, 실제 실험으로 확인된 물질의 밴드 구조를 다중 궤도 모델로 분석했다는 점에서 중요합니다.", "unresolved": "초록 정보만으로는 YCl의 다중 궤도가 구체적으로 어떤 위상적 상전이를 유도하는지, 실제 자기장 하에서의 반응(TRSB 등)에 대한 정보가 부족합니다.", "future_work": "ARPES를 통한 실제 밴드 구조의 실험적 검증 및 다체 효과가 반영된 전자 상관관계 계산 연구가 이어져야 합니다.", "concepts": [{"term": "일렉트라이드 (Electride)", "why_emerged": "음이온이 격자 위치가 아닌 결정 내 빈 공간(interstitial space)에 전자가 갇혀 있는 특이한 물질 상태를 연구하기 위해 필요합니다.", "origin": "Dyke 등이 20세기 중반 개념을 도입했으나, 최근 고체 화학 분야에서 재조명되었습니다.", "connections": "2차원 물질, 투명 전도체, 강한 상관계수 전자계."}, {"term": "주사위 격
