<title>Daily Paper Slideshow</title>
<style>
  :root {
    color-scheme: light;
    --bg: #f6f7f4;
    --paper: #ffffff;
    --ink: #111827;
    --muted: #64748b;
    --line: #d8ddd2;
    --accent: #176b87;
    --accent-2: #9a3412;
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; overflow: auto; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: var(--bg); color: var(--ink); }
  .shell { max-width: 1500px; min-height: 100vh; margin: 0 auto; padding: 14px 18px; display: flex; flex-direction: column; }
  .topbar { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 16px; }
  .top-actions { display: flex; align-items: center; gap: 10px; }
  .topbar a, button { border: 1px solid var(--line); border-radius: 8px; background: var(--paper); color: var(--ink); padding: 10px 14px; font-weight: 700; text-decoration: none; cursor: pointer; }
  button.primary { background: var(--accent); border-color: var(--accent); color: white; }
  button:disabled { opacity: 0.45; cursor: not-allowed; }
  .counter { color: var(--muted); font-weight: 700; }
  .slide { min-height: calc(100vh - 82px); background: var(--paper); border: 1px solid var(--line); border-radius: 10px; padding: 18px; box-shadow: 0 18px 42px rgba(15, 23, 42, 0.10); display: grid; grid-template-columns: minmax(310px, 0.86fr) minmax(0, 1.55fr); gap: 18px; overflow: visible; }
  .paper-head { min-width: 0; min-height: 0; overflow: visible; display: flex; flex-direction: column; gap: 12px; }
  .figure { margin: 0; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: #f8fafc; }
  .figure img { display: block; width: 100%; max-height: 41vh; object-fit: contain; background: white; }
  .figure figcaption { padding: 7px 10px; color: var(--muted); font-size: 12px; line-height: 1.3; }
  .head-text { display: flex; flex-direction: column; gap: 9px; min-width: 0; }
  .badges { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .badge { border-radius: 999px; padding: 5px 9px; background: #eef2ff; color: #3730a3; font-size: 12px; font-weight: 800; }
  .score { background: #fee2e2; color: #991b1b; }
  h1 { margin: 0; font-size: 25px; line-height: 1.15; letter-spacing: 0; overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
  h1 a { color: inherit; text-decoration-color: rgba(23, 107, 135, 0.35); text-decoration-thickness: 2px; text-underline-offset: 4px; }
  h1 a:hover { color: var(--accent); text-decoration-color: var(--accent); }
  .meta, .authors, .why, .abstract { font-size: 13px; line-height: 1.45; }
  .meta, .authors { color: var(--muted); }
  .why strong, .abstract strong, .authors strong { color: var(--ink); }
  .authors { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .why { border-left: 4px solid var(--accent-2); padding-left: 10px; color: #374151; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .abstract { border-top: 1px solid var(--line); padding-top: 14px; color: #374151; }
  .original-abstract { border-top: 1px solid var(--line); padding-top: 10px; color: #374151; font-size: 11.5px; line-height: 1.35; overflow-wrap: anywhere; }
  .original-abstract strong { display: block; margin-bottom: 4px; color: var(--ink); }
  .tags { display: flex; flex-wrap: wrap; gap: 8px; }
  .tag { border-radius: 999px; padding: 4px 8px; background: #f1f5f9; color: #475569; font-size: 12px; font-weight: 700; }
  .head-text > .link { display: none; }
  .briefing { min-width: 0; min-height: 0; overflow: visible; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); grid-auto-rows: minmax(0, auto); align-content: start; gap: 11px 18px; border-top: 0; padding-top: 0; }
  .brief-section { min-width: 0; }
  .brief-section.wide { grid-column: 1 / -1; }
  .brief-section h2 { margin: 0 0 4px; font-size: 14px; line-height: 1.22; color: #0f766e; letter-spacing: 0; }
  .brief-section p, .brief-section li { margin: 0; font-size: 12.5px; line-height: 1.42; color: #1f2937; overflow-wrap: anywhere; }
  .brief-section ul { margin: 0; padding-left: 20px; }
  .concepts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 9px 14px; }
  .concept { border-top: 1px solid var(--line); padding-top: 7px; }
  .concept h3 { margin: 0 0 4px; font-size: 13px; color: #7c2d12; letter-spacing: 0; }
  .concept p { margin: 2px 0 0; font-size: 11.5px; line-height: 1.35; color: #374151; overflow-wrap: anywhere; }
  .concept b { color: #111827; }
  .link { color: var(--accent); font-weight: 800; text-decoration: none; }
  .empty { padding: 48px; background: var(--paper); border: 1px solid var(--line); border-radius: 12px; color: var(--muted); }
  @media (max-width: 860px) {
    .shell { padding: 14px; }
    .topbar, .top-actions { align-items: stretch; flex-direction: column; }
    .slide, .briefing, .concepts { grid-template-columns: 1fr; }
    .slide { min-height: auto; overflow: visible; display: grid; }
    h1 { font-size: 28px; }
  }
</style>

 NbSe2 등 다른 TMD 화합물의 삽입 연구와 비교됨."}, {"term": "강상관 전자계(Correlated Electrons)", "why_emerged": "전자 간의 쿨롱 상호작용이 무시할 수 없는 수준이 되어 단일 입자 근사(DFT)로는 설명되지 않는 물성을 해결하기 위해 도입.", "origin": "Mott insulator 연구를 통해 확립됨.", "connections": "Cuprates, Nickelates, 그리고 최근의 Kagome 금속 연구와 연결됨."}], "english_summary": ["Study of FexNbS2 combining ARPES, XAS, and DFT.", "Identifies significant eV-scale electronic restructuring.", "Demonstrates that electronic correlations are vital for magnetism in Fe-intercalated TMDs.", "Presents evidence linking TMD magnetic behavior to physics typically seen in correlated oxides."]}}, {"title": "Deciphering the absence of charge density waves in the V-based kagome metal CsV6Sb6", "journal": "PRB_Recent", "source": "keyword", "link": "http://link.aps.org/doi/10.1103/3vlt-zz94", "authors": "Rongxiao Du, Yunfan Yang, Wenxin Lv, et al.", "last_authors": "Hechang Lei, Jianbo Hu", "summary": "Author(s): Rongxiao Du, Yunfan Yang, Wenxin Lv, Junhong Yu, Hang Zhang, Hechang Lei, and Jianbo Hu While charge density waves (CDWs) are a hallmark of the kagome metal $\\mathrm{Cs}{\\mathrm{V}}_{3}{\\mathrm{Sb}}_{5}$, their absence in the bilayer counterpart $\\mathrm{Cs}{\\mathrm{V}}_{6}{\\mathrm{Sb}}_{6}$ remains a notable exception, with the underlying mechanism yet to be elucidated. Here, integrat… [Phys. Rev. B 113, 245119] Published Tue Jun 09, 2026", "tier": "A_MUST_READ", "score": "9", "reason": "title strong match: kagome metal", "tags": ["kagome", "chargedensitywave", "CDW"], "image": "", "briefing": {"background": "AV3Sb5(A=K, Cs, Rb) kagome 금속은 전하 밀도 파동(CDW)과 초전도성으로 유명하지만, 그 구조적 유사체들에서 CDW의 발현 여부는 화합물별로 매우 다릅니다.", "motivation": "kagome 금속 계열인 CsV6Sb6에서는 왜 CsV3Sb5와 달리 CDW가 나타나지 않는지에 대한 근본적인 원인을 파악하고자 했습니다.", "result": "이중층 구조(bilayer)를 가진 CsV6Sb6에서 CDW 부재의 원인을 전자적 구조와 격자 결합의 관점에서 분석했습니다.", "implication": "Kagome 격자에서 CDW 발현이 밴드 구조의 nesting이나 특정 nesting vector에 얼마나 민감하게 반응하는지를 이해하는 척도가 됩니다.", "novelty": "AV3Sb5 시스템의 CDW 물성을 이해하는 기준점을 제공하며, 구조적 변형(단일층 vs 이중층)이 전 ong match: angle-resolved photoemission", "tags": ["ARPES", "angle-resolvedphotoemission", "photoemission", "chargedensitywave", "CDW", "Fermisurface"], "image": "", "briefing": {"background": "전이금속 디칼코게나이드(TMD) 물질인 VSe2는 저온에서 전하 밀도파(CDW) 상전이를 겪으며, 이는 전자 구조의 재구성을 동반합니다. ARPES는 이러한 전자 구조의 변화를 직접적으로 관측할 수 있는 핵심적인 도구입니다.", "motivation": "VSe2에서 관측되는 복잡한 CDW 상태(4x4x3.18)가 페르미 면과 밴드 구조에 미치는 구체적인 영향, 특히 V 3d 및 Se 4p 오비탈의 기여를 규명하고자 합니다.", "result": "CDW 상전이 이후 페르미 면의 일부가 사라지는(depletion) 현상을 직접 관측하였습니다. 이는 CDW 형성이 격자 변조뿐만 아니라 전자 오비탈의 재구성을 통해 페르미 표면을 어떻게 재구성하는지 보여줍니다.", "implication": "VSe2와 같은 저차원 물질에서 CDW와 전자 구조 사이의 결합을 더 명확히 이해할 수 있으며, 이는 Kagome 금속 등 다른 CDW 물질 연구에도 시사점을 줍니다.", "novelty": "SPEM(Scanning Photoemission Microscopy)을 병행하여 불균일할 수 있는 CDW 도메인 환경에서의 국소적 전자 구조를 시각화한 점이 돋보입니다.", "unresolved": "관측된 페르미 면 소멸이 왜 특정 영역에서 더 강하게 일어나는지에 대한 미시적 메커니즘과 CDW 상전이의 드라이빙 포스에 대한 완벽한 합의는 여전히 논의의 여지가 있습니다.", "future_work": "온도 변화에 따른 밴드 구조의 연속적인 진화 관측 및 다른 도핑 수준에서의 CDW 거동 연구가 필요합니다.", "concepts": [{"term": "Charge Density Wave (CDW)", "why_emerged": "저차원 물질에서 전자-격자 상호작용으로 인해 전하 밀도가 주기적인 변조를 일으키는 현상으로, 에너지 저감을 위해 등장합니다.", "origin": "Peierls, R. (1955).", "connections": "Kagome 금속의 CDW, Peierls 전이, 전자-포논 결합."}, {"term": "ARPES", "why_emerged": "고체의 역공간 전자 구조(에너지 밴드)를 직접 측정하기 위해 개발되었습니다.", "origin": "초기 광전효과 연구에 기반하며 1970년대 이후 발전.", "connections": "페르미 표면 매핑, 스핀 편극 ARPES, 전자 상관관계 연구."}], "english_summary": ["Study of VSe2 electronic structure across the 4x4x3.18 CDW transition.", "ARPES and SPEM reveal partial Fermi surface depletion in the CDW state.", "Highlights the role of V 3d and Se 4p orbital reconstruction.", "Provides spatial mapping of electronic states in the CDW phase."]}}, {"title": "Symmetry-locked six-state control of altermagnetism via sliding ferroelectricity", "journal": "Science_Advances", "source": "Gemini", "link": "https://doi.org/10.1126/sciadv.aec5229", "authors": "Wei Sun, Wenxuan Wang, Changhong Yang, Shifeng Huang, Zhenxiang Cheng", "last_authors": "Shifeng Huang, Zhenxiang Cheng", "summary": "Altermagnetic multiferroics offer a promising route to low-power spintronics by enabling spin splitting without net magnetization, extending beyond conventional spin-orbit coupling. However, achieving deterministic electric control has remained elusive. Here, a six-state platform for high-dimensional magnetoelectric coupling in altermagnets is established by exploiting the nondegenerate transition paths of sliding ferroelectrics as a symmetry-engineering knob, thereby transcending the conventional binary (up/down) paradigm of sliding ferroelectricity. First-principles calculations on bilayer manganese phosphorus trisulfide reveal a spin-polarization symmetry-locking mechanism. Polarization switching along the three nondegenerate paths not only reverses the spin splitting but also rotates its spin-splitting texture in 120° increments, yielding six nonvolatile, electrically addressable altermagnetic states. Furthermore, direct correspondence is established between the spin-splitting texture and the nonlinear Hall response, providing unique electrical fingerprints for each state. This work establishes a paradigm for electric field–driven reconstruction of momentum-space spin geometry, providing a versatile platform for controlling quantum phenomena in altermagnetic spintronics.", "tier": "A_MUST_READ", "score": "9", "reason": "Very direct hit on altermagnetism, multiferroics, electric control, and anomalous Hall implications.", "tags": ["altermagnetism", "multiferroics", "spintronics", "DFT", "anomalousHall"], "image": "", "briefing": {"background": "Altermagnetism(알터자성)은 순자화값이 0이면서 스핀-궤도 결합 없이 스핀 분할을 나타내는 새로운 자기 상입니다. 차세대 저전력 스핀트로닉스 구현을 위해 이를 전기적으로 제어하는 기술이 필수적입니다.", "motivation": "이전의 이진법(Up/Down) 기반 강유전성 제어를 넘어, 알터자성을 다상(multi-state)으로 정밀하게 제어할 수 있는 플랫폼을 구축하고자 합니다.", "result": "MnPS3 이중층 구조에서 슬라이딩 강유전성을 이용해 6가지 상태의 알터자성 상태를 제어할 수 있음을 입증했습니다. 스핀 분할 텍스처를 120도씩 회전시킬 수 있음을 보여줍니다.", "implication": "알터자성의 스핀 방향과 비선형 홀 효과(Nonlinear Hall r  demoted from A: broad CM, not direct user/project hit", "tags": ["kagome", "material", "altermagnet"], "image": "", "briefing": {"background": "Kagome 격자는 기하학적 좌절(frustration)과 평탄 밴드(flat band)를 포함한 특이한 전자 구조로 유명합니다. 최근 AV3Sb5 물질에서 나타나는 다양한 질서 상태(CDW, TRSB 등)의 기원을 이해하는 것이 중요합니다.", "motivation": "Kagome 격자에서 전자 간의 상호작용으로 인해 나타날 수 있는 '알터자성'과 유사한 비전통적 자기 정렬의 가능성을 AV3Sb5와 연결하여 탐구합니다.", "result": "격자 구조의 대칭성(홀수 개의 서브격자)이 어떻게 콜리니어(collinear) 알터자성 상태를 허용하는지 이론적으로 제시하며, AV3Sb5에서의 물리적 응용 가능성을 논합니다.", "implication": "AV3Sb5의 이상 홀 효과나 다른 자기적 이상 현상이 기존의 스핀 알터자성을 넘어, 오비탈 알터자성(Orbital altermagnetism)에 의해 설명될 가능성을 강력하게 뒷받침합니다.", "novelty": "Kagome 격자의 기하학적 특성과 알터자성 이론을 결합하여, AV3Sb5 연구 분야의 난제 중 하나인 TRSB(시간 반전 대칭성 파괴) 상태를 새로운 관점에서 해석합니다.", "unresolved": "제시된 이론이 실제 AV3Sb5의 실험적 자기적 감수율 데이터와 정량적으로 일치하는지에 대한 실험적 확증이 필요합니다.", "future_work": "DFT 계산을 통한 구체적 오비탈 알터자성 시그니처 도출 및 관련 물질군의 추가 탐색이 예상됩니다.", "concepts": [{"term": "Orbital Altermagnetism", "why_emerged": "스핀뿐만 아니라 오비탈 각운동량이 결정 대칭성에 의해 정렬되는 새로운 자성 상태를 설명하기 위해 등장.", "origin": "최근 이론 물리학계에서 논의 시작.", "connections": "Kagome 금속, 궤도 홀 효과, 토폴로지."}, {"term": "AV3Sb5", "why_emerged": "강한 상관관계를 가진 Kagome 금속에서 나타나는 CDW, 초전도성, TRSB 간의 상호작용을 연구하기 위해 주목받음.", "origin": "실험적으로는 약 2020년경 본격 연구됨.", "connections": "위상물질, nematicity, Kagome 격자."}], "english_summary": ["Proposes orbital altermagnetism on the kagome lattice.", "Explains how collinear altermagnetic-like states can emerge in lattices with odd sublattices.", "Links theoretical findings to electronic orders in AV3Sb5 kagome metals.", "Provides a potential mechanism for TRSB and magnetic anomalies in these systems."]}}, {"title": "Topological quantum materials: kagome, chiral, and square-net frameworks", "journal": "npj_QuantumMaterials", "source": "Gemini", "link": "https://www.nature.com/articles/s41535-026-00902-7", "authors": "Avdhesh K. Sharma, Snehashish Chatterjee, Premakumar Yanda, Claudia Felser, Chandra Shekhar", "last_authors": "Claudia Felser, Chandra Shekhar", "summary": "npj Quantum Materials, Published online: 11 June 2026; doi:10.1038/s41535-026-00902-7 Topological quantum materials: kagome, chiral, and square-net frameworks", "tier": "B_IMPORTANT_CONDMAT", "score": "10", "reason": "Directly covers kagome and topological frameworks central to user research on AV3Sb5 systems.; demoted from A: broad CM, not direct user/project hit", "tags": ["kagome", "topological", "electronic-structure"], "image": "https://pubads.g.doubleclick.net/gampad/ad?iu=/285/npjquantmats.nature.com/article&sz=728x90&c=-895742581&t=pos%3Dtop%26type%3Darticle%26artid%3Ds41535-026-00902-7%26doi%3D10.1038/s41535-026-00902-7%26subjmeta%3D301,639,766%26kwrd%3DMaterials+science,Physics", "briefing": {"background": "위상 양자 물질(Topological Quantum Materials)은 전자 구조의 위상적 성질을 활용하여 기존 재료에서 볼 수 없는 특이한 수송 현상이나 저손실 전도성을 구현하고자 하는 연구 분야입니다. 카고메 격자(kagome lattice)는 그 기하학적 특성으로 인해 평탄 밴드(flat bands)와 디랙 점(Dirac points)을 동시에 가질 수 있어 강상관 전자계 연구의 중심지입니다.", "motivation": "다양한 위상적 물질 후보군인 카고메, 카이랄, 사각 격자(square-net) 재료들이 가진 전자 구조적 공통점과 차이점을 체계적으로 정리하여, 향후 신소재 설계 및 물성 예측을 위한 통합적인 가이드라인을 제공하고자 합니다.", "result": "위상 양자 물질의 구조적 프레임워크와 그에 따른 전자 구조적 특징들을 분류하였습니다. 각 격자 형태가 어떻게 특정한 위상적 밴드 구조를 유도하며, 이것이 물리적 특성으로 어떻게 연결되는지 이론적/실험적 관점에서 요약하였습니다.", "implication": "이 분류체계는 연구자들이 특정 위상 물성을 타겟팅할 때 어떤 격자 구조를 선택해야 할지에 대한 명확한 전략적 방향을 제시합니다.", "novelty": "AV3Sb5와 같은 카고메 초전도체 연구를 수행하는 사용자에게 필수적인 구조-물성 상관관계를 종합적으로 조망해주며, 최신 위상 물질 연구의 지형도를 제공합니다.", "unresolved": "이론적 예측과 실험적 실제 구현 사이의 괴리(예: 완벽한 격자 대칭성 유지의 어려움)는 여전히 과제로 남아 있습니다.", "future_work": "실제 합성된 물질에서 밴드 구조의 미세 조정을 통한 위상 상태의 전이 연구 및 외부 장(전기장, 자기장)을 이용한 물성 제어 연구가 기대됩니다.", "concepts": [{"term": "카고메 격자", "why_emerged": "기하학적 좌절(frustration)과 전자 간 상호작용이 얽힌 새로운 물리 상태 탐구 필요성", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "AV3Sb5, 위상 평탄 밴드, 베리 곡률"}, {"term": "위상 양자 물질", "why_emerged": "밴드 구조의 위상 불변량을 이용한 강건한(robust) 전자 상태 구현을 위해", "origin": "Kane & Mele(2005)의 위상 절연체 연구가 시초", "connections": "디랙 세미메탈, 웨일 세미메탈"}], "english_summary": ["Review of topological quan 터마그네틱", "why_emerged": "스핀 분극된 밴드를 가지면서 알짜 자기 모멘트가 없는 자성 상태를 구현하기 위해", "origin": "Recent theoretical breakthroughs (Šmejkal et al.)", "connections": "반강자성, 스핀 분리 밴드"}, {"term": "마그논", "why_emerged": "자기 질서 상태에서의 집단적 스핀 들뜸(spin excitation)을 기술하기 위해", "origin": "Bloch(1930)", "connections": "중성자 산란, 자기 분산 관계"}], "english_summary": ["Investigation of altermagnetic magnon splitting in FeF2 using neutron scattering.", "Found that altermagnetic effects are dominated by dipolar interactions.", "Clarifies the competition between relativistic/symmetry-based effects and dipole-dipole interactions.", "Important for interpreting magnetic excitation spectra in altermagnetic materials."]}}, {"title": "Single-particle tunneling spectrum with a robust superconducting gap in La 2 PrNi 2 O 7 thin films at ambient pressure", "journal": "Science_Advances", "source": "Gemini", "link": "https://doi.org/10.1126/sciadv.aeg2429", "authors": "Shengtai Fan, Mengjun Ou, Marius Scholten, et al.", "last_authors": "Ilya M. Eremin, Hai-Hu Wen", "summary": "The recent discovery of high-temperature superconductivity in nickelate systems has generated tremendous interest in the community. The core issue to understand the pairing mechanism is the superconducting gap and its symmetry. We have successfully synthesized the superconducting thin films of La 2 PrNi 2 O 7 with an onset transition temperature of 41.5 kelvins and measured the superconducting tunneling spectra after exposing the superconducting layer by using the tip-excavation technique. The spectrum shows a robust superconducting gap at about Δ ≈ 19 milli–electron volts, and fittings based on the Dynes model indicate that this dominant gap should have an s -wave structure with low anisotropy, which allows us to put the priority in selecting the s ± pairing symmetry. Furthermore, a clear hump structure is observed at an energy of 49 ± 2 milli–electron volts, which is inclined to be interpreted as a bosonic mode. Our results help clarify the mystery of superconductivity in bilayer nickelate superconductors.", "tier": "B_IMPORTANT_CONDMAT", "score": "9", "reason": "Direct hit: STM/STS-like measurement of superconducting gap in nickelate superconductor.; demoted from A: broad CM, not direct user/project hit", "tags": ["superconductivity", "nickelates", "STM/STS", "electronicstructure"], "image": "", "briefing": {"background": "니켈산염 초전도체(Nickelate superconductors)는 구리 산화물(cuprate) 고온 초전도체와 유사한 전자 구조를 가져, 고온 초전도 기작을 이해하는 핵심 시스템으로 주목받고 있습니다.", "motivation": "La2PrNi2O7 박막의 초전도 갭 구조와 대칭성을 STM(주사터널링현미경) 및 STS(주사터널링분광)를 통해 직접 관측하여, s-wave 또는 d-wave와 같은 페어링 대칭성을 규명하고자 합니다.", "result": "약 19meV의 초전도 갭을 관측하였으며, 이는 s-wave 구조와 부합하는 것으로 해석되었습니다. 또한 49meV 근처의 hump 구조를 bosonic 모드로 해석했습니다.", "implication": "빌레이 니켈산염에서의 초전도성 기작이 s± 페어링 대칭성을 가질 가능성을 제시하며, 이는 니켈산염 초전도체의 물리 모델을 정립하는 데 기여합니다.", "novelty": "박막 표면을 정밀하게 가공(tip-excavation)하여 직접적인 초전도 갭 데이터를 확보한 점이 매우 고무적이며, 니켈산염 연구자들에게 강력한 실험적 증거를 제공합니다.", "unresolved": "관측된 s-wave 갭이 강상관 효과에 의한 것인지, 혹은 일반적인 BCS 이론의 결과인지에 대한 추가적인 논의가 필요합니다.", "future_work": "온도 및 자기장 의존성 측정을 통한 초전도성 보존 여부 확인 및 보손 모드(bosonic mode)의 기원 규명.", "concepts": [{"term": "STS", "why_emerged": "물질 표면의 국소적 전자 상태 밀도를 에너지 분해능을 가지고 직접 매핑하기 위해", "origin": "Binnig & Rohrer(1982)의 STM 개발 기반", "connections": "초전도 갭, 국소 상태 밀도(LDOS)"}, {"term": "s± 대칭성", "why_emerged": "페르미 면 사이의 부호가 반대인 초전도 갭을 설명하기 위해", "origin": "Iron-based superconductors(Mazin et al.)에서 제안", "connections": "다중 밴드 초전도체, 페어링 기작"}], "english_summary": ["STS study of La2PrNi2O7 thin film superconducting gap.", "Observed a robust gap of ~19 meV, suggesting s-wave symmetry.", "Reported a boson mode at ~49 meV.", "Provides crucial experimental constraints for pairing mechanism in bilayer nickelates."]}}, {"title": "Ferroelectric Altermagnetic Chern Insulator in magnetic field: electrical control of the Chern number", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2606.11862", "authors": "Meysam Bagheri Tagani, Carmine Autieri", "last_authors": "Meysam Bagheri Tagani, Carmine Autieri", "summary": "arXiv:2606.11862v1 Announce Type: new Abstract: The quantum anomalous Hall effect in altermagnets is difficult to realize because spin-up and spin-down states remain degenerate at the $\\Gamma$ point in the nonrelativistic limit. We start from the Bernevig-Hughes-Zhang model to incorporate nontrivial band topology. We demonstrate that the combined effects of an external magnetic field, spin canting, and ferroelectric orbital hybridization lift the degeneracy at the $\\Gamma$ point, enabling electric-field control of the Chern number. A minimal two-dimensional d-wave altermagnetic model with band inversion then realizes a ferroelectrically tunable Chern insulator with spontaneous spin canting. The ferroelectric polarization controls the topological phase and the orbital angular momentum, enabling a rich phase diagram with C = $\\pm 1$ and C = $\\pm 2$ through a Berry-curvature reorganization linked to the spin canting response and ferroelectricity. Our results establish a symmetry-consistent route to electrically tunable Chern insulating phases in altermagnetic materials, opening opportunities for low-power topological and orbitronic devices.", "tier": "B_IMPORTANT_CONDMAT", "score": "9", "reason": "Directly relevant to altermagnetism and topological insulator research; fits user's interest in topological materials.", "tags": ["altermagnetism", "Cherninsulator", "topological"], "image": "https://arxiv.org/html/2606.11862v1/x1.png", "briefing": {"background": "위상 절연체와 양자 변칙 홀 효과(QAHE) 연구는 비산란 채널을 이용한 저전력 전자소자 구현을 목표로 합니다. 특히 알터마그넷(altermagnet)은 최근 스핀-궤도 결합 없이도 스핀 분할이 일어나는 독특한 자기적 특성으로 주목받고 있습니다.", "motivation": "알터마그넷은 비상대론적 한계에서 Γ 지점의 스핀 축퇴를 유지하기 때문에, 기존에는 위상학적으로 비자명한 밴드 토폴로지를 유도하기가 어려웠습니다. 이를 극복하고 전기적으로 위상을 제어하는 방법을 찾고자 했습니다.", "result": "외부 자기장, 스핀 경사(spin canting), 강유전체 궤도 혼성화를 결합하여 Γ 지점의 축퇴를 제거하였습니다. 이를 통해 강유전 분극으로 체른 수(Chern number)를 C=±1 또는 ±2로 전기적 제어할 수 있음을 보였습니다.", "implication": "알터마그넷 기반의 위상 소자가 전기장만으로 스위칭 가능함을 시사하며, 이는 저전력 궤도-스핀트로닉스 소자 개발의 새로운 경로를 제시합니다.", "novelty": "알터마그넷의 대칭성 조건을 위상학적 비자명성과 결합하여, 전기장으로 밴드 구조와 베리 곡률을 재구성할 수 있다는 점이 핵심입니다. 사용자 관심사인 위상적 물질의 외부 제어 연구와 궤를 같이합니다.", "unresolved": "실제 소재에서의 강유전성과 알터마그네틱 위상의 공존 가능성 및 그 안정성에 대한 실험적 검증이 부족합니다.", "future_work": "실제 소재 후보군 탐색 및 강유전체-알터마그넷 이종접합 구조에서의 전기 전도도 측정 실험이 요구됩니다.", "concepts": [{"term": "알터마그넷", "why_emerged": "기존 강자성체나 반강자성체와 달리, 결정 대칭성에 의해 스핀과 운동량이 연결된 독특한 분할을 보이기 위해 필요했습니다.", "origin": "최근 2020년대 초반 이론적으로 확립되었습니다.", "connections": "반강자성체, 스핀 궤도 토크, 베리 곡률 연구와 밀접합니다."}, {"term": "체른 절연체", "why_emerged": "외부 자기장 없이도 양자 홀 효과를 구현하여 에너지 손실 없는 전류 전달을 위해 도입되었습니다.", "origin": "Haldane 모델(1988).", "connections": "양자 변칙 홀 효과, 위상 절연체."}], "english_summary": ["Proposes an electrically tunable Chern insulator using altermagnetic materials.", "Uses external magnetic fields and ferroelectric orbital hybridization to lift spin degeneracy at the Gamma point.", "Demonstrates control over Chern numbers (C=±1, ±2) via ferroelectric polarization.", "Offers a new pathway for low-power topological and orbitronic devices."]}}, {"title": "Orbital Altermagnetism in Two Dimensions (Phys. Rev. Lett.)", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2510.00509", "authors": "Mingxiang Pan, Feng Liu, Huaqing Huang", "last_authors": "Feng Liu, Huaqing Huang", "summary": "arXiv:2510.00509v3 Announce Type: replace Abstract: We introduce the concept of \\emph{orbital altermagnetism}, a symmetry-protected magnetic order of pure orbital degrees of freedom. It is characterized with ordered anti-parallel orbital magnetic moments in real space but momentum-dependent orbital band splittings, analogous to spin altermagnetism. Using a minimal tight-binding model with complex hoppings in a square-kagome lattice, we show that such order inherently arises from staggered loop currents, producing a $d$-wave-like orbital-momentum locking. First-principles calculations show that orbital alterma g large skyrmion deformation and topological phase transitions. [Phys. Rev. Lett. 136, 236703] Published Tue Jun 09, 2026", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Strongly relevant to topological magnetic structures and potential future ARPES interest.", "tags": ["topological", "skyrmion", "magnetism"], "image": "", "briefing": {"background": "스카이뮴(Skyrmion) 격자는 위상학적으로 보호된 자기 소용돌이 구조로, 물질 내 결함인 전위(dislocation)와의 상호작용은 전체 격자의 물리적 성질과 위상 전이를 결정짓는 핵심 요소입니다.", "motivation": "기존 키텔(Kittel)의 자기-극성 유추 방식으로는 스카이뮴 격자 내 전위의 변형과 위상적 전이를 충분히 설명하기 어려워 이를 넘어선 새로운 물리학적 이해가 필요했습니다.", "result": "스카이뮴 격자 내 전위가 가지는 내부 구조와 위상 전이 기작을 밝혀냈으며, 스카이뮴 변형과 위상학적 변화 사이의 직접적인 상관관계를 규명하였습니다.", "implication": "스카이뮴 기반 소자의 동역학적 특성을 이해하고, 위상적 결함을 제어하여 물성을 조절하는 기반을 마련하였습니다.", "novelty": "단순한 격자 해석을 넘어 위상학적 전위의 물리적 기원을 재해석한 점이 학술적으로 중요하며, 자기적 위상 구조를 깊이 다루는 물리 연구에 기여합니다.", "unresolved": "실제 실험상에서 관찰되는 다양한 위상 전위의 동역학적 제어 방법은 과제로 남아있습니다.", "future_work": "위상 결함이 소자의 이동도나 안정성에 미치는 구체적인 영향에 대한 후속 실험 연구.", "concepts": [{"term": "스카이뮴 격자", "why_emerged": "자기적 위상 상태를 활용한 저전력 정보 저장 매체 개발 필요.", "origin": "전자기학적 위상 이론으로 1960년대 초반 제안.", "connections": "홀 효과, 위상 자성, 토폴로지컬 절연체."}, {"term": "위상 전위", "why_emerged": "결정학적 결함이 격자의 위상적 성질을 어떻게 바꾸는지 이해하기 위해 필요.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "결정 결함론, 위상 물리학."}], "english_summary": ["Skyrmion lattice dislocations undergo unique topological phase transitions.", "The study surpasses traditional magnetic-polar analogies for skyrmion deformations.", "Internal core structures of dislocations are linked to macroscopic topological changes.", "Provides insight into controlling topological magnetic defects for future devices."]}}, {"title": "Confined growth of armchair MoS 2 nanotubes at the 1-nm limit", "journal": "Science", "source": "Gemini", "link": "https://doi.org/10.1126/science.aee3446", "authors": "Yusuke Nakanishi, Ryosuke Senga, Shinpei Furusawa, et al.", "last_authors": "Yasumitsu Miyata, Kazu Suenaga", "summary": "Atomically thin nanotubes of semiconducting transition metal dichalcogenides offer a platform for exploring quantum phenomena at the one-dimensional limit and for realizing nanoscale transistor channels. However, conventional syntheses produce only large-diameter (>10 nm), multiwalled tubes with uncontrolled chiralities. We report the synthesis of single-walled molybdenum disulfide (MoS 2 ) nanotubes with diameters approaching 1 nm, achieved through spatially confined reactions inside boron nitride (BN) nanotubes. The confined geometry stabilizes otherwise inaccessible, highly strained MoS 2 nanotubes, yielding structurally well-defined armchair configurations. Their bandgaps shrink systematically with decreasing diameter, in accordance with long-standing theoretical predictions. The insulating BN sheath simultaneously provides an intrinsic gate-all-around architecture, thereby promising access to truly nanoscale transistor channels.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Important condensed matter physics on 1D quantum phenomena in MoS2 nanotubes; 2D/1D materials.", "tags": ["materialsscience", "2Dmaterials", "nanomaterials", "electronicstructure", "quantumphenomena", "TMD"], "image": "", "briefing": {"background": "1차원 한계에서의 양자 현상을 탐구하기 위해 나노튜브 구조가 필요하지만, 기존의 합성법으로는 직경이 크고 복잡한 다중벽 나노튜브만 생성되는 한계가 있었습니다.", "motivation": "보론 나이트라이드(BN) 나노튜브의 내부 공간을 나노 반응기로 사용하여, 원자 단위에서 정밀하게 제어된 1nm 직경의 단일벽 MoS2 나노튜브를 합성하고자 했습니다.", "result": "성공적으로 1nm급 단일벽 MoS2 나노튜브를 합성하였으며, 직경이 감소함에 따라 밴드갭이 체계적으로 변하는 것을 확인하여 이론적 예측을 입증하였습니다.", "implication": "초미세 트랜지스터 채널 및 1차원 양자 물질 탐구를 위한 새로운 플랫폼을 제공하며, 차세대 반도체 공정에의 응용 가능성을 열었습니다.", "novelty": "BN 나노튜브 내 공간 제한(confined growth)을 통해 비평형 상태의 나노구조를 안정화한 점이 매우 혁신적입니다.", "unresolved": "대량 생산 가능성과 긴 나노튜브의 연속성을 확보하는 문제가 실용화를 위한 과제로 남아 있습니다.", "future_work": "다양한 TMD 물질로의 확장 및 초미세 나노튜브에서의 물리적 성질(초전도성, 자기적 특성 등) 탐구.", "concepts": [{"term": "TMD(전이금속 디칼코게나이드)", "why_emerged": "그래핀을 넘어선 반도체 특성을 가진 2차원 물질 탐색.", "origin": "2010년대 전후 MoS2 단층 연구 활성화.", "connections": "2D 반도체, 반데르발스 이종접합."}, {"term": "공간 제한 성장", "why_emerged": "열역학적으로 불안정한 나노 구조를 물리적으로 안정화하기 위해 필요.", "origin": "나노튜브 합성 기술과 함께 발전.", "connections": "템플릿 합성, 나노 반응기."}], "english_summary": ["Single-walled MoS2 nanotubes were synthesized at the 1-nm limit using BN nanotubes as templates.", "The confined growth allows access to structurally defined armchair configurations.", "Experimental results confirm the systematic bandgap shrinkage with diameter reduction.", "The study offers a new platform for 1D quantum transport and nanoscale transistor channels."]}}, {"title": "Broadband and high-speed terahertz wireless sensing via vertical-transport Dirac-source detector", "journal": "Science_Advances", "source": "Gemini", "link": "https://doi.org/10.1126/sciadv.aeg2196", "authors": "Xiaokai Pan, Yiming Wang, Hangxiang Wang, et al.", "last_authors": "Wei Lu, Lin Wang", "summary": "In the realm of wireless sensing, it is envisioned that sensing and communication functionalities will coexist and be fully integrated within a unified system. Future sensing systems thus necessitate detectors capable of operating at higher frequency bands—ranging from millimeter wave to terahertz (THz)—while delivering wider bandwidths, faster response rates, and enhanced functional integration. Dirac-source (DS) detectors use Dirac semimetals as hot-electron sources to capitalize on the low density of states (DOS) near the Dirac point, thereby effectively suppressing the formation of metal-induced gap states. Furthermore, when this architecture incorporates the inherent interlayer vertical electron transport of vertical van der Waals (vdW) heterostructures, it shows great promise for realizing low-power, post–Moore era sensing devices with superior injection and transport efficiencies. Here, we report a DS detector composed of the completely vertical gold/zirconium pentatelluride/graphene/gold structure (Au/ZrTe 5 /graphene/Au) heterojunction, which harnesses strong localized fields to achieve high thermionic emission. The detector manifests outstanding performance in terms of remarkable responsivity, exceeds a peak of 1600 V/W from 0.02 to 0.5 THz at room temperature, has a fast response time less than 20 ns, and notably is capable for heterodyne mixing with intermediate frequency (IF) bandwidth larger than ±26.5 gigahertz. Our results not only shed a fresh light on DS dynamics in the terahertz region but also highlight the transformative potential of semimetal electronics for applications in wireless energy harvesting, communication, and imaging.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Dirac semimetals, graphene, and vdW heterostructures for electron transport and dynamics.", "tags": ["Diracsemimetal", "graphene", "vanderWaalsheterostructures", "electrontransport", "2Dmaterials"], "image": "", "briefing": {"background": "테라헤르츠(THz) 대역은 통신 및 센싱 기술의 차세대 핵심 주파수 대역입니다. 그러나 기존 반도체 소자는 이 영역에서 감도와 대역폭의 한계에 직면해 있어, 이를 극복하기 위해 새로운 물리적 원리 기반의 고효율 감지기 개발이 필요합니다.", "motivation": "디락 준금속(Dirac semimetal)의 낮은 상태 밀도(DOS) 특성을 활용하여 금속-반도체 계면에서의 불필요한 준위 형성을 억제하고, 수직형 반데르발스 이종접합의 이점을 결합하여 초고속 고감도 테라헤르츠 검출기를 구현하고자 함.", "result": "Au/ZrTe5/Graphene/Au 수직 이종접합 소자를 제작하여 0.02~0.5 THz 대역에서 1600 V/W 이상의 우수한 감응도와 20 ns 미만의 빠른 응답 시간, 그리고 26.5 GHz 이상의 광대역 혼합(heterodyne mixing) 성능을 입증함.", "implication": "디락 준금속 기반의 전자 소자가 실제 고성능 무선 통신 및 테라헤르츠 이미징 응용 분야에서 상용 소자를 능가하는 성능을 낼 수 있음을 보여줌.", "novelty": "기존 그래핀이나 2D 물질 단독 소자보다 ZrTe5와의 이종접합을 통해 강한 국소 장을 유도하고 열전자 방출을 최적화한 수직 수송 구조가 핵심 혁신 요소임.", "unresolved": "소자의 장기 안정성 문제와 대면적 소자 제작 시의 균일성 확보 방안이 추가적인 검토 사항임.", "future_work": "실제 상용화 가능한 수준의 대면적 웨이퍼 공정 도입 및 테라헤르츠 에너지 수확 시스템으로의 확장 연구.", "concepts": [{"term": "디락 준금속(Dirac semimetal)", "why_emerged": "선형 분산 관계를 가지는 준입자가 위상학적으로 보호되는 전자 구조를 구현하기 위해 필요.", "origin": "2010년대 초반 Cd3As2, Na3Bi 등에서 실험적으로 처음 발견됨.", "connections": "위상 절연체, 웨일 준금속, 높은 이동도 전자 소자."}, {"term": "반데르발스 이종접합(vdW heterostructure)", "why_emerged": "서로 다른 2D 물질을 적층하여 계면 제어를 통해 새로운 물리적 특성을 창출하기 위함.", "origin": "Andre Geim 등에 의해 초기 연구가 확립됨.", "connections": "모아레 격자, 2D 전자 가스, 초전도-절연체 전이 연구."}], "english_summary": ["A vertical Dirac-source detector based on Au/ZrTe5/Graphene/Au heterojunction is reported.", "The device demonstrates high responsivity (1600 V/W) and wide bandwidth in the 0.02-0.5 THz range.", "Fast response ( 26.5 GHz) are achieved at room temperature.", "The findings highlight the potential of semimetal electronics for high-speed wireless sensing applications."]}}, {"title": "Altermagnetic and dipolar splitting of magnons in FeF2 (Phys. Rev. Lett.)", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2601.04303", "authors": "J. Sears, V. O. Garlea, D. Lederman, J. M. Tranquada, I. A. Zaliznyak", "last_authors": "J. M. Tranquada, I. A. Zaliznyak", "summary": "arXiv:2601.04303v2 Announce Type: replace Abstract: FeF$_2$ is a prototypical rutile antiferromagnet recently proposed as an altermagnet, with a magnetic symmetry that permits spin-split electronic bands and chiral magnons. Using very-high-resolution inelastic neutron scattering on a single crystal of FeF$_2$, we show that the dominant source of magnon splitting is in fact the long-range dipolar interaction rather than altermagnetic exchange terms. At momenta where the dipolar splitting vanishes, we observe additional broadening due to altermagnetic chiral splitting and estimate this splitting to be $\\sim$35 $\\mu$eV. Polarized measurements further reveal that, where dipolar splitting is present, the chiral magnon modes become mixed and the resulting modes are predominantly linearly polarized, with at most a small chiral component. These findings highlight the significant effect of dipolar interactions on magnon chirality, particularly when altermagnetic interactions are weak.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "High-resolution inelastic neutron scattering study of altermagnetic magnons in FeF2.", "tags": ["altermagnetism", "magnon", "neutronscattering"], "image": "https://arxiv.org/html/2601.04303v2/x1.png", "briefing": {"background": "알터자성(Altermagnetism)은 시간 역전 대칭성이 깨져 있고 격자 대칭성이 스핀 분할을 유도하는 새로운 자기 질서입니다. 최근 전자 밴드 구조에서의 스핀 분할이 화두가 되면서 마그논(magnon) 수준에서의 징후에 대한 연구가 활발합니다.", "motivation": "알터자성 후보 물질인 FeF2에서 마그논 분할의 기원이 진정한 알터자성 효과인지, 아니면 다른 물리적 효과(쌍극자 상호작용 등)에 의한 것인지 검증하고자 함.", "result": "비탄성 중성자 산란 실험 결과, FeF2의 주된 마그논 분할은 알터자성 교환항이 아닌 장거리 쌍극자 상호작용에 의해 발생함을 확인. 알터자성 효과에 의한 키랄 분할은 약 35 ueV 수준으로 극히 미미함.", "implication": "알터자성 물질을 연구할 때 쌍극자 상호작용이 마그논 분산에 미치는 지배적인 영향을 반드시 고려해야 함을 경고.", "novelty": "매우 높은 해상도의 중성자 산란을 통해 알터자성 이론의 한계를 지적하고 스핀 역학에서 쌍극자 상호작용의 중요성을 정량적으로 분리해냄.", "unresolved": "알터자성 효과가 약한 물질에서 마그논 키랄성을 명확하게 분리하여 관찰하기 위한 더 정교한 분석 기술이 필요함.", "future_work": "알터자성 상호작용이 훨씬 더 강력한 다른 후보 물질들에 대한 유사한 고해상도 분광 실험.", "concepts": [{"term": "알터자성(Altermagnetism)", "why_emerged": "강자성도 반강자성도 아니면서 밴드 스핀 분할을 가지는 새로운 자기 상의 분류.", "origin": "최근 2-3년 내 이론적으로 급격히 정립됨 (예: Jungwirth et al.).", "connections": "반강자성, 스핀트로닉스, 베리 곡률, 비정상 홀 효과."}, {"term": "비탄성 중성자 산란(INS)", "why_emerged": "물질 내 원자나 스핀의 집단 들뜸(마그논, 포논)의 분산 관계를 직접 측정하기 위함.", "origin": "20세기 중반 중성자원 기술 발달과 함께 확립.", "connections": "스핀 파동(magnon), 격자 진동(phonon), 자기 정렬 측정."}], "english_summary": ["High-resolution inelastic neutron scattering on FeF2 reveals the origin of magnon splitting.", "The dominant splitting is attributed to long-range dipolar interactions rather than altermagnetic exchange.", "Altermagnetic chiral splitting is estimated to be approximately 35 ueV.", "The study underscores the necessity of accounting for dipolar interactions in altermagnetic magnon studies."]}}, {"title": "Chiral Magnons and Cycloidal Phonons in Altermagnetic CuF2 Monolayer", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2606.11584", "authors": "Andrea M. Le\\'on, Mat\\'ias F. Torreblanca, Carmine Autieri, Jhon W. Gonz\\'alez", "last_authors": "Andrea M. Le\\'on, Mat\\'ias F. Torreblanca, Carmine Autieri, Jhon W. Gonz\\'alez", "summary": "arXiv:2606.11584v1 Announce Type: new Abstract: Altermagnetism establishes momentum-dependent spin splitting through non-symmorphic crystal symmetries, yet whether these same symmetries simultaneously govern spin and lattice collective excitations remains open. Here we show, using first-principles calculations and linear spin-wave theory, that monolayer CuF$_2$ hosts both chirality-split magnons and cycloidal phonons controlled by the same $P2_1/c$ symmetry operations. The altermagnetic order drives strongly anisotropic magnon chirality via symmetric anisotropic exchange, with Dzyaloshinskii--Moriya interactions acting as a weak secondary modulation. Crucially, the phonon and magnon chiral responses are directionally complementary: cycloidal phonon angular momentum emerges precisely where magnon chirality is symmetry-suppressed, and vice versa. The magnon bands further carry quantized Chern numbers $C^M = \\pm 2$, confirming non-trivial altermagnetic topology. These results establish monolayer CuF$_2$ as a platform where a single symmetry framework engineers magnonic, phononic, and topological responses, providing a direct connection between altermagnetism and spin-lattice chirality in two-dimensional materials.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Theory of topological altermagnets with direct relevance to current topics.", "tags": ["altermagnet", "topological", "theory"], "image": "https://arxiv.org/html/2606.11584v1/x1.png", "briefing": {"background": "알터자성 물질에서 전자적인 스핀 분할이 격자 진동(포논)과 같은 다른 물리적 들뜸에도 동일한 대칭성 원리로 작용하는지는 응집물질물리학의 중요한 미해결 과제입니다.", "motivation": "단층 CuF2를 모델 시스템으로 하여 알터자성 대칭성이 마그논(스핀)과 포논(격자)의 키랄성을 동시에 어떻게 제어하는지 이론적으로 규명하고자 함.", "result": "P21/c 대칭성에 의해 마그논과 포논이 모두 키랄성을 가지며, 이들의 반응이 서로 상보적으로 나타남을 발견. 또한 마그논 밴드가 2의 위상학적 체른 수(Chern number)를 가짐을 입증.", "implication": "알터자성이 전자 구조뿐만 아니라 포논 구조의 위상학적 설계 원리까지 확장될 수 있음을 제시.", "novelty": "마그논과 포논의 키랄성을 동시에 다루는 통합적 위상학적 모델을 구축하고, 비자성 들뜸(포논)에서도 알터자성 대칭성의 영향력을 확인했다는 점.", "unresolved": "실제 실험적 환경(기판 효과 등)
