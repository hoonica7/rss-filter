<title>Daily Paper Slideshow</title>
<style>
  :root {
    color-scheme: light;
    --bg: #f6f7f4;
    --paper: #ffffff;
    --ink: #111827;
    --muted: #64748b;
    --line: #d8ddd2;
    --accent: #176b87;
    --accent-2: #9a3412;
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; overflow: auto; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: var(--bg); color: var(--ink); }
  .shell { max-width: 1500px; min-height: 100vh; margin: 0 auto; padding: 14px 18px; display: flex; flex-direction: column; }
  .topbar { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 16px; }
  .top-actions { display: flex; align-items: center; gap: 10px; }
  .topbar a, button { border: 1px solid var(--line); border-radius: 8px; background: var(--paper); color: var(--ink); padding: 10px 14px; font-weight: 700; text-decoration: none; cursor: pointer; }
  button.primary { background: var(--accent); border-color: var(--accent); color: white; }
  button:disabled { opacity: 0.45; cursor: not-allowed; }
  .counter { color: var(--muted); font-weight: 700; }
  .slide { min-height: calc(100vh - 82px); background: var(--paper); border: 1px solid var(--line); border-radius: 10px; padding: 18px; box-shadow: 0 18px 42px rgba(15, 23, 42, 0.10); display: grid; grid-template-columns: minmax(310px, 0.86fr) minmax(0, 1.55fr); gap: 18px; overflow: visible; }
  .paper-head { min-width: 0; min-height: 0; overflow: visible; display: flex; flex-direction: column; gap: 12px; }
  .figure { margin: 0; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: #f8fafc; }
  .figure img { display: block; width: 100%; max-height: 41vh; object-fit: contain; background: white; }
  .figure figcaption { padding: 7px 10px; color: var(--muted); font-size: 12px; line-height: 1.3; }
  .head-text { display: flex; flex-direction: column; gap: 9px; min-width: 0; }
  .badges { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .badge { border-radius: 999px; padding: 5px 9px; background: #eef2ff; color: #3730a3; font-size: 12px; font-weight: 800; }
  .score { background: #fee2e2; color: #991b1b; }
  h1 { margin: 0; font-size: 25px; line-height: 1.15; letter-spacing: 0; overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
  h1 a { color: inherit; text-decoration-color: rgba(23, 107, 135, 0.35); text-decoration-thickness: 2px; text-underline-offset: 4px; }
  h1 a:hover { color: var(--accent); text-decoration-color: var(--accent); }
  .meta, .authors, .why, .abstract { font-size: 13px; line-height: 1.45; }
  .meta, .authors { color: var(--muted); }
  .why strong, .abstract strong, .authors strong { color: var(--ink); }
  .authors { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .why { border-left: 4px solid var(--accent-2); padding-left: 10px; color: #374151; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .abstract { border-top: 1px solid var(--line); padding-top: 14px; color: #374151; }
  .original-abstract { border-top: 1px solid var(--line); padding-top: 10px; color: #374151; font-size: 11.5px; line-height: 1.35; overflow-wrap: anywhere; }
  .original-abstract strong { display: block; margin-bottom: 4px; color: var(--ink); }
  .tags { display: flex; flex-wrap: wrap; gap: 8px; }
  .tag { border-radius: 999px; padding: 4px 8px; background: #f1f5f9; color: #475569; font-size: 12px; font-weight: 700; }
  .head-text > .link { display: none; }
  .briefing { min-width: 0; min-height: 0; overflow: visible; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); grid-auto-rows: minmax(0, auto); align-content: start; gap: 11px 18px; border-top: 0; padding-top: 0; }
  .brief-section { min-width: 0; }
  .brief-section.wide { grid-column: 1 / -1; }
  .brief-section h2 { margin: 0 0 4px; font-size: 14px; line-height: 1.22; color: #0f766e; letter-spacing: 0; }
  .brief-section p, .brief-section li { margin: 0; font-size: 12.5px; line-height: 1.42; color: #1f2937; overflow-wrap: anywhere; }
  .brief-section ul { margin: 0; padding-left: 20px; }
  .concepts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 9px 14px; }
  .concept { border-top: 1px solid var(--line); padding-top: 7px; }
  .concept h3 { margin: 0 0 4px; font-size: 13px; color: #7c2d12; letter-spacing: 0; }
  .concept p { margin: 2px 0 0; font-size: 11.5px; line-height: 1.35; color: #374151; overflow-wrap: anywhere; }
  .concept b { color: #111827; }
  .link { color: var(--accent); font-weight: 800; text-decoration: none; }
  .empty { padding: 48px; background: var(--paper); border: 1px solid var(--line); border-radius: 12px; color: var(--muted); }
  @media (max-width: 860px) {
    .shell { padding: 14px; }
    .topbar, .top-actions { align-items: stretch; flex-direction: column; }
    .slide, .briefing, .concepts { grid-template-columns: 1fr; }
    .slide { min-height: auto; overflow: visible; display: grid; }
    h1 { font-size: 28px; }
  }
</style>

fect in a relevant topological semimetal, related to 112 tellurides.", "tags": ["topologicalsemimetal", "Halleffect", "Berrycurvature", "experiment", "TaIrTe4"], "image": "", "briefing": {"background": "홀 효과는 보통 자기장이 있거나 자성이 있는 물질에서 나타나지만, 최근 위상 기하학적 특성을 가진 비자성 물질에서 자기장에 비선형적으로 반응하는 '비선형 홀 효과'가 발견되어 새로운 소자 응용 및 기초 물리 연구의 장이 열렸습니다.", "motivation": "기존의 비선형 홀 효과 연구는 주로 베리 곡률 쌍극자(Berry curvature dipole)에 집중되었습니다. 본 연구는 TaIrTe4라는 물질에서 궤도 기커니즘에 의한 '베리 접속 분극성(BCP) 쌍극자'가 유도하는 새로운 형태의 비선형 평면 홀 효과를 탐구하고자 했습니다.", "result": "비자성 위상 반금속 TaIrTe4에서 실온에서도 작동하는 고유(intrinsic) 비선형 평면 홀 효과를 발견했습니다. 이는 면내 자기장이 궤도 메커니즘을 통해 베리 접속 분극성 쌍극자를 생성함으로써 발생한다는 점을 규명했습니다.", "implication": "실온에서 자성 없이도 비선형적인 홀 응답을 얻을 수 있다는 점은 고주파 정류기나 차세대 테라헤르츠 감지기 등 위상 전자 소자 구현에 매우 유리한 고지를 점했음을 의미합니다.", "novelty": "독자께서 관심을 가지는 112 계열 유사 화합물(TaIrTe4)에서 '실온' 및 '고유(intrinsic)' 물성을 확인했다는 점이 중요합니다. 베리 곡률이 아닌 베리 접속(connection)의 분극 특성을 직접적으로 운송 측정과 연결했다는 학술적 가치가 큽니다.", "unresolved": "궤도 메커니즘 외에 스핀-궤도 결합이 미치는 세부적인 영향이나, 다른 유사 위상 반금속(NbNiTe2 등)에서의 일반화 가능성에 대한 연구가 남아 있습니다.", "future_work": "다양한 두께의 박막 소자에서의 성능 최적화와 이를 활용한 실질적인 정류 소자 프로토타입 제작이 예상됩니다.", "concepts": [{"term": "Nonlinear Planar Hall Effect", "why_emerged": "전계의 제곱에 비례하는 홀 응답을 통해 물질의 기하학적 위상 정보(Berry phase 관련)를 추출하기 위해 등장.", "origin": "초록 정보만으로는 특정하기 어려우나 최근 수년간 위상 물질계에서 활발히 연구됨.", "connections": "Berry curvature dipole, Quantum metric, TaIrTe4."}, {"term": "Berry-connection-polarizability (BCP) dipole", "why_emerged": "베리 곡률만으로 설명되지 않는 고차(higher-order) 비선형 응답을 설명하기 위한 기하학적 개념.", "origin": "최근 위상 수송 이론 연구자들에 의해 제안됨.", "connections": "Orbital magnetization, Semiclassical equations of motion, TaIrTe4."}], "english_summary": ["Demonstrates a room-temperature intrinsic nonlinear planar Hall effect in the nonmagnetic semimetal TaIrTe4.", "Identifies the Berry-connection-polarizability (BCP) dipole as the origin, driven by an orbital mechanism under an in-plane magnetic field.", "Extends the scope of nonlinear transport from Berry curvature dipoles to BCP dipoles.", "Suggests potential for high-temperature topological electronic applications."]}}, {"title": "Direct Observation of Channelised Supercurrents in a Kagome Superconductor", "journal": "arXiv_CondMat", "source": "keyword", "link": "https://arxiv.org/abs/2606.20157", "authors": "Matthijs Rog, Tycho J. Blom, Reinier Q. Regter, et al.", "last_authors": "Milan P. Allan, Kaveh Lahabi", "summary": "arXiv:2606.20157v1 Announce Type: new Abstract: Superconductors are many-body quantum states in which current flows without dissipation. Theory predicts that supercurrents follow a relatively simple spatial pattern in both conventional and unconventional superconductors. Recent studies into the AV3Sb5 (A = Cs, K, Rb) family of Kagome superconductors indicate that CsV3Sb5 has unconventional transport properties that cannot be accounted for with these simple theories, including reports of intrinsic Josephson junctions, higher order Cooper pairing and the zero field diode effect. Attempts to interpret these findings have focused on the interplay of superconductivity with the unconventional charge density wave (CDW) order in these materials, with which superconductivity competes. A current roadblock to understanding how these kagome superconductors give rise to their intriguing properties is the lack of spatially resolved information about transport. Here we show, using a recently developed superconducting quantum interference device (SQUID) microscope, that flakes of CsV3Sb5-xSnx host a network of narrow supercurrent channels. These supercurrent channels emerge at the critical temperature and remain stable for all temperatures and currents. Their non-linear behaviour is consistent with a network of Josephson junctions linked by narrow supercurrent filaments, which naturally leads to the observed transport anomalies. Intriguingly, these observations are much weaker in undoped samples, which suggests links to the physics of charge density waves, disorder, and electronic correlations, all of which are greatly influenced by the doping strength. These results establish new frontiers for the local investigation of charge transport and competing orders in strongly correlated electron systems, and shine a new light on the anomalous transport properties of the AV3Sb5 kagome superconductors.", "tier": "A_MUST_READ", "score": "9", "reason": "title strong match: kagome superconductor", "tags": ["STS", "kagome", "AV3Sb5", "CsV3Sb5", "V3Sb5", "chargedensitywave", "CDW", "superconduct"], "image": "https://arxiv.org/static/browse/0.3.4/images/arxiv-logo-fb.png", "briefing": {"background": "카고메 초전도체 CsV3Sb5는 초전도와 CDW가 공존하며, 조셉슨 다이오드 효과나 변칙적인 수송 특성 등 흥미로운 물리 현상을 보여줍니다. 하지만 이러한 특성이 시료 전체에서 균일하게 나타나는지, 아니면 특정 경로를 통해 나타나는지에 대한 공간적 정보가 부족했습니다.", "motivation": "CsV3Sb5에서 보고된 고유 조셉슨 접합 행동과 비선형 수송 특성이 물질 내부의 어떤 미시적 전류 경로에서 기인하는지 SQUID 현미경을 통해 시각화하고자 했습니다.", "result": "Sn이 도핑된 CsV3Sb5 시료에서 초전도 전류가 균일하게 흐르지 않고 좁은 채널(filaments)을 형성하여 흐르는 '채널화된 초전도 전류'를 직접 관찰했습니다. 이 채널들은 조셉슨 접합 네트워크처럼 작동하며, 이것이 그동안 관찰된 기이한 수송 특성의 원인임을 밝혀냈습니다.", "implication": "카고메 초전도체의 비정상적인 물성이 거시적인 대칭성 깨짐보다는 미시적인 전류 채널의 네트워크 구조에서 기인할 수 있음을 시사합니다. 이는 CDW, 무질서(disorder), 그리고 전자 상관관계의 복합적인 상호작용의 결과로 해석됩니다.", "novelty": "독자의 관심사인 CsV3Sb5에서 STM/STS와는 다른 척도(SQUID microscopy)로 전류 밀도를 직접 지도화했다는 점이 돋보입니다. 특히 도핑에 따른 전류 경로 변화를 보여줌으로써 불순물과 CDW의 역할을 강조했습니다.", "unresolved": "이러한 채널링 현상이 본질적인 위상적 도메인 벽(domain wall) 때문인지, 아니면 단순한 화학적 불균일성이나 변형(strain)에 의한 것인지에 대한 명확한 구분이 필요합니다.", "future_work": "도핑 농도를 정밀하게 제어하거나 변형을 가하면서 전류 채널의 패턴 변화를 관찰하고, 이를 통해 CDW 도메인과의 상관관계를 규명하는 연구가 기대됩니다.", "concepts": [{"term": "SQUID Microscopy", "why_emerged": "물질 내부의 미세한 자기장과 전류 분포를 비파괴적으로 고해상도 시각화하기 위해 개발됨.", "origin": "IBM 연구소 등에서 초기 개발 및 정밀화.", "connections": "Scanning Probe Microscopy, Supercurrent imaging, Josephson junctions."}, {"term": "Channelised Supercurrent", "why_emerged": "초전도체 내에서 전류가 균일하게 흐르지 않고 특정 경로로 집중되는 현상을 설명하기 위한 용어.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "Josephson junction networks, Disorder, Domain walls."}], "english_summary": ["Directly visualizes channelised supercurrents in Sn-doped CsV3Sb5 using SQUID microscopy.", "Finds that supercurrent flows through a network of narrow filaments acting as Josephson junctions.", "Explains anomalous transport properties, such as the zero-field diode effect, via this filamentary network.", "Highlights the influence of doping and CDW-disorder interplay on the spatial distribution of superconductivity."]}}, {"title": "Enhanced electronic correlations and altermagnetic ground state of two-dimensional CsCr3Sb5 monolayers", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2606.19740", "authors": "Z. H. Guan, Z. L. Peng, W. Z. Zhuo, et al.", "last_authors": "M. H. Qin, J. M. Liu", "summary": "arXiv:2606.19740v1 Announce Type: new Abstract: Recently, layered corrected kagome metal CsCr3Sb5 have garnered significant attention attributed to its flat bands near the Fermi level (EF) and altermagnetic ground state [ Yi Liu et al., Nature 632, 1032 (2024)]. However, the van Hove singularities (vHSs) in bulk CsCr3Sb5 are far away from the EF, while an effective modulation of VHS toward the EF is essential for exploring intriguing electron transport properties. In this work, using first-principles calculations, we investigate electronic structures of two-dimensional (2D) Cr3Sb5 and CsCr3Sb5 monolayers which may be mechanically exfoliated from bulk materials. Notably, it is revealed that both flat bands and vHSs simultaneously reside in close proximity to the EF in Cr3Sb5 monolayer, signifying enhanced electronic correlations. Importantly, a tensile strain further shifts the incipient flat bands and vHSs of two monolayers simultaneously to the vicinity of the EF, suggesting strain tunable electronic correlations and concomitant quantum effects. Furthermore, altermagnetic ground state is also revealed due to retained mirror symmetry between two sublattices in these two monolayers. Thus, this work advances understan nal": "Nature", "source": "Gemini", "link": "https://www.nature.com/articles/s41586-026-10654-w", "authors": "Zhehao Ge, Conor Smith, Zehao He, et al.", "last_authors": "Feng Wang, Michael F. Crommie", "summary": "Nature, Published online: 17 June 2026; doi:10.1038/s41586-026-10654-w A technique combining atomically resolved scanning tunnelling microscopy with neural-quantum-state quantum Monte Carlo simulation of disordered 2D electron Wigner solids establishes a powerful framework to enable the clear identification of two distinct defect-induced disorder regimes.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "STM study on 2D electron Wigner solids with disorder, relevant to strongly correlated systems and quantum Hall.", "tags": ["STM", "2Dmaterials", "stronglycorrelated", "quantumHall", "disorder"], "image": "https://media.springernature.com/m685/springer-static/image/art%3A10.1038%2Fs41586-026-10654-w/MediaObjects/41586_2026_10654_Fig1_HTML.png", "briefing": {"background": "위그너 고체(Wigner Solid)는 전자 간의 강한 쿨롱 반발력으로 인해 전자들이 격자 형태로 배열되는 양자 상태입니다. 실제 물질에서는 불순물(disorder)이 필연적으로 존재하며, 이것이 위그너 고체의 결정성과 양자 역학적 특성을 어떻게 방해하는지 이해하는 것은 강상관계 전자 시스템 연구의 핵심 과제입니다.", "motivation": "본 연구는 STM을 이용한 원자 단위의 시각화와 신경 양자 상태(Neural-Quantum-State) 기반의 양자 몬테카를로 시뮬레이션을 결합하여, 불순물이 2차원 전자 위그너 고체에 미치는 영향을 구체적으로 분석하고자 했습니다.", "result": "연구진은 불순물로 인해 발생하는 서로 다른 두 가지 결함 체제(defect-induced disorder regimes)를 명확히 식별해냈으며, STM 데이터와 이론 시뮬레이션 간의 정밀한 일치를 확인했습니다.", "implication": "이 프레임워크를 통해 불순물이 강상관계 물질의 국소적 전자 상태를 어떻게 변화시키는지 예측할 수 있게 되었으며, 이는 향후 고전도성 및 양자 홀 효과 시스템의 불순물 제어 설계에 중요한 지침이 됩니다.", "novelty": "STM의 실공간 분해능과 현대적 계산 물리학(머신러닝 기반 퀀텀 상태)을 결합하여 실험과 이론의 간극을 좁혔다는 점이 큰 강점입니다. 귀하가 관심 있는 전자 구조 시각화 분야의 정밀도를 한 차원 높였습니다.", "unresolved": "이 연구에서 식별된 두 가지 결함 체제가 온도 변화나 자기장 세기에 따라 어떻게 동적으로 전이되는지는 추가적인 연구가 필요합니다.", "future_work": "더 낮은 온도에서의 위그너 고체 안정성 연구 및 다양한 기판 물질 위에서의 불순물 분포 패턴에 대한 추가 시뮬레이션이 예상됩니다.", "concepts": [{"term": "위그너 고체", "why_emerged": "전자들 사이의 운동 에너지보다 쿨롱 에너지가 지배적일 때 형성되는 전자 격자 상태를 설명하기 위해 필요.", "origin": "유진 위그너(Eugene Wigner)가 1934년에 처음 제안.", "connections": "강상관계 물리학, 모트 절연체, 양자 홀 효과의 바닥 상태 등과 밀접하게 연결됨."}, {"term": "STM", "why_emerged": "물질의 표면 원자 및 전자 상태 밀도를 원자 단위의 정밀도로 직접 관측하기 위해 등장.", "origin": "거드 비니히와 하인리히 로러가 1981년 개발.", "connections": "STS(스캐닝 터널링 분광법), 원자 조작, 강상관계 물질의 위상 구조 분석에 필수적인 도구."}], "english_summary": ["The study investigates the effect of quenched disorder on 2D electron Wigner solids.", "Researchers utilized combined STM imaging and Neural-Quantum-State Monte Carlo simulations.", "The work identifies two distinct regimes of defect-induced disorder.", "This framework bridges the gap between experimental real-space mapping and theoretical quantum modeling."]}}, {"title": "Altermagnetism of ultrathin CrSb slabs", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/k9zm-2k1v", "authors": "Brahim Marfoua, Mohammad Amirabbasi, Marcus Ekholm", "last_authors": "Mohammad Amirabbasi, Marcus Ekholm", "summary": "Author(s): Brahim Marfoua, Mohammad Amirabbasi, and Marcus Ekholm Altermagnets exhibit momentum-dependent spin splitting without net magnetization, combining characteristics of both ferromagnets and antiferromagnets, making them highly interesting for spintronics applications. CrSb is a prime candidate with a high Néel temperature ($∼700\\phantom{\\rule{0.28em}{0ex}… [Phys. Rev. B 113, 214439] Published Tue Jun 16, 2026", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Study on altermagnetism in CrSb, directly aligned with user interest in magnetic topological materials.", "tags": ["altermagnetism", "magnetic-materials", "theory"], "image": "", "briefing": {"background": "알터마그네틱(Altermagnetism)은 기존의 강자성(넷 자화 존재)이나 반강자성(스핀 보상됨)과 달리, 넷 자화는 없으면서 운동량 공간에서 비대칭적인 스핀 분리가 일어나는 새로운 자기 질서입니다. 이는 스핀트로닉스 구현을 위한 효율적인 에너지 수송의 가능성을 열어줍니다.", "motivation": "CrSb는 네엘 온도가 높고 스핀 분리 특성이 우수하여 알터마그네틱 후보 물질로 주목받고 있습니다. 본 논문은 이 물질이 초박막(ultrathin) 형태일 때 어떤 자기적 특성을 보이는지 이론적으로 규명하고자 했습니다.", "result": "CrSb 초박막 구조에서 알터마그네틱 특성이 안정적으로 유지됨을 확인했으며, 두께 변화에 따른 스핀 분리 기작의 변화를 이론적으로 입증했습니다.", "implication": "고온에서 작동 가능한 자성 소자의 플랫폼으로서 CrSb 초박막의 잠재력을 높게 평가할 수 있게 되었습니다.", "novelty": "자기 위상 물질 및 altermagnetism 분야는 귀하의 관심사인 Weyl/Dirac 반금속 및 Berry curvature와 연계될 가능성이 높습니다. 특히 박막 공정에서의 물성 제어에 대한 통찰을 제공합니다.", "unresolved": "이론적 계산 결과가 실제 박막 제작 시 나타날 표면 효과나 격자 불일치에 의해 어떻게 왜곡될지는 명확하지 않습니다.", "future_work": "CrSb 초박막을 이용한 스핀 전류 생성 실험 및 ARPES를 통한 운동량 공간에서의 스핀 분리 직접 관측이 필요합니다.", "concepts": [{"term": "알터마그네틱", "why_emerged": "강자성과 반강자성의 장점을 결합하여 넷 자화 없이 높은 스핀 분리도를 얻기 위해 제안.", "origin": "최근 2020년대 들어 활발히 정의되고 이론적 틀이 확립됨.", "connections": "반강자성 스핀트로닉스, 위상 절연체, 스핀-궤도 결합 시스템."}], "english_summary": ["The paper explores the altermagnetic properties of ultrathin CrSb slabs.", "Altermagnets provide momentum-dependent spin splitting without net magnetization.", "CrSb is identified as a candidate with a high Néel temperature of 700 K.", "The research highlights potential for high-temperature spintronic applications."]}}, {"title": "Boosted magnetic fluctuations at the onset of superconductivity in UTe2 beyond 40 T", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/3hzr-5qcs", "authors": "T. Thebault, K. Somesh, G. Lapertot, M. Nardone, A. Zitouni, M. Barragan, et al.", "last_authors": "D. Aoki, G. Knebel, D. Braithwaite, and W. Knafo", "summary": "Author(s): T. Thebault, K. Somesh, G. Lapertot, M. Nardone, A. Zitouni, M. Barragan, J. Béard, J. Billette, F. Lecouturier-Dupouy, S. Tardieu, D. Aoki, G. Knebel, D. Braithwaite, and W. Knafo Multiple triplet-candidate unconventional superconducting phases have been reported in the heavy-fermion compound UTe 2 . Here, the authors find an enhancement of the electrical resistivity Fermi liquid coefficient A at a metamagnetic transition preceding the onset of superconductivity in magnetic fields higher than 40 T. The enhancement of A is attributed to a magnetic fluctuation mode probably in play for the mechanism of this superconducting phase. [Phys. Rev. B 113, L220503] Published Mon Jun 15, 2026", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "High-field study of exotic heavy fermion superconductivity.", "tags": ["superconductivity", "heavy-fermion", "magnetism"], "image": "", "briefing": {"background": "UTe2는 중페르미온(heavy-fermion) 물질 중에서도 특이한 초전도 현상을 보이는 후보 물질로, 특히 자기장 하에서의 다중 초전도 상과 트리플렛(triplet) 페어링 가능성으로 인해 강상관계 물리학의 뜨거운 감자입니다.", "motivation": "초록 정보만으로는 분야 내부의 구체적 동기를 안정적으로 요약하기 어렵습니다.", "result": "40 T 이상의 강자기장 영역에서 나타나는 메타자기 전이(metamagnetic transition) 직전, 페르미 액체 계수(A)가 급격히 상승하는 것을 발견했습니다.", "implication": "이 결과는 자기적 요동(magnetic fluctuations)이 40 T 이상에서의 초전도 상태를 유지하거나 형성하는 데 직접적인 매개 역할을 할 가능성을 제시합니다.", "novelty": "40 T를 넘는 초강자기장 환경에서의 실험 결과는 극히 드뭅니다. 중페르미온의 스핀-전하 분리나 복합 상 형성에 대한 이해를 극단적인 조건에서 테스트했다는 점에서 가치가 있습니다.", "unresolved": "관측된 자기 요동 모드가 구체적으로 어떤 대칭성을 가지는지, 그리고 왜 이 높은 자기장에서 특정 초전도 상이 선택적으로 안정화되는지에 대한 미시적 기작은 미해결 과제입니다.", "future_work": "더 정밀한 자기 공명 실험이나 극저온 고자기장 하에서의 RIXS 연구를 통해 자기 요동의 정체를 밝히는 과정이 기대됩니다.", "concepts": [{"term": "중페르미온", "why_emerged": "f-전자들의 국소성과 전도 전자의 혼성으로 인해 유효 질량이 자유 전자의 수백 배에 달하는 상태를 설명하기 위해 필요.", "origin": "1970년대 이후 발견되어 이론적으로 정립됨.", "connections": "Kondo 효과, 비전통적 초전도성, 양자 임계점."}], "english_summary": ["UTe2 is investigated under extreme magnetic fields exceeding 40 T.", "Enhanced electrical resistivity Fermi liquid coefficient A is observed near metamagnetic transitions.", "Magnetic fluctuations are identified as the likely driver for the superconducting mechanism.", "This provides evidence for triplet superconductivity in heavy-fermion materials."]}}, {"title": "Interplay between many-body correlations, strain, and lattice relaxation in twisted bilayer graphene", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/x2mz-hm8y", "authors": "Lorenzo Crippa, Gautam Rai, Dumitru Călugăru, et al.", "last_authors": "Giorgio Sangiovanni, Tim Wehling", "summary": "Author(s): Lorenzo Crippa, Gautam Rai, Dumitru Călugăru, Haoyu Hu, Jonah Herzog-Arbeitman, B. Andrei Bernevig, Roser Valentí, Giorgio Sangiovanni, and Tim Wehling Here, the authors explain a set of experimental features that, while ubiquitously observed in twisted bilayer graphene samples, have so far eluded a unified theoretical description. A broad range of spectral, response, and thermodynamic properties in twisted bilayer graphene is accurately described microscopically and traced to the interplay of electronic correlations, lattice strain, and structural relaxation. The results are in excellent agreement with multiple recent experiments including scanning tunneling and quantum twisting microscopy experiments. [Phys. Rev. B 113, L241112] Published Wed Jun 17, 2026", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Important experimental/theory synthesis for twisted bilayer graphene correlations; relevant to reader profile.", "tags": ["twisted-bilayer", "graphene", "correlations"], "image": "", "briefing": {"background": "트위스티드 이중층 그래핀(TBG)은 마법 각도 근처에서 강한 전자 상관관계에 의해 유도된 초전도성 및 상관 절연체 상태를 보여주며, 복잡한 물성 조절이 가능해 현대 응집물질물리학의 중심 연구 분야입니다.", "motivation": "TBG에서 공통적으로 관측되는 다양한 분광학적, 열역학적 데이터들이 기존 이론으로는 파편적으로만 설명되어, 격자 변형 및 완화 효과를 포함한 통합적인 미시적 이론 기술이 요구되었습니다.", "result": "전자 상관관계, 격자 변형, 구조적 완화의 상호작용을 통합적으로 모델링하여 STM 및 양자 트위스팅 현미경 실험 결과들을 일관되게 설명해냈습니다.", "implication": "TBG의 물리적 특성이 순수하게 전자적 상관관계뿐만 아니라 구조적 격자 효과와 밀접하게 얽혀 있음을 입증하며, 향후 TBG 소자 설계 및 물성 예측의 표준 이론적 프레임워크를 제시합니다.", "novelty": "기존에 분리되어 다루어지던 이론적 요소들을 하나의 모델로 통합하여 실험적 정합성을 높였으며, 독자의 주 관심사인 전자 구조(STM/STS) 해석에 중요한 정량적 근거를 제공합니다.", "unresolved": "매우 작은 각도에서의 미세한 격자 불균일성이 전체적인 거시적 물성에 미치는 영향은 여전히 완벽히 계산하기 어렵습니다.", "future_work": "보다 복잡한 다층 구조 시스템이나 변형이 유도된 모아레 초격자에 대한 모델 확장 연구가 예상됩니다.", "concepts": [{"term": "트위스티드 이중층 그래핀 (TBG)", "why_emerged": "그래핀 층을 특정 각도로 비틀어 평탄한 밴드를 형성함으로써 전자 상관관계를 극대화하기 위해 필요.", "origin": "Pablo Jarillo-Herrero 그룹(2018)", "connections": "모아레 초격자, 강상관 전자계, 초전도성."}, {"term": "구조적 완화 (Structural Relaxation)", "why_emerged": "비틀린 층 사이의 에너지를 최소 ks-j4ht", "authors": "Qiyang Sun, Songrui Hou, Ayman H. Said, et al.", "last_authors": "Wei Tian, Chen Li", "summary": "Author(s): Qiyang Sun, Songrui Hou, Ayman H. Said, Yanzhong Pei, Jie Ma, Wei Tian, and Chen Li Chiral phonons carry finite phonon angular momentum, yet their momentum-resolved behavior in acoustic branches remains largely unexplored. Here, we report the direct detection of chiral acoustic phonons in elemental Te. Through a combination of high-energy-resolution inelastic x-ray scattering exper… [Phys. Rev. Lett. 136, 246101] Published Mon Jun 15, 2026", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Experimental momentum-resolved spectroscopy on elemental tellurium, relevant to topological and telluride research.", "tags": ["experiment", "tellurium", "phonons", "spectroscopy"], "image": "", "briefing": {"background": "원소 텔루륨(Te)은 나선형 원자 사슬 구조를 가져 시간 반전 대칭성이 깨진 위상학적 특성을 보일 수 있는 물질입니다. 이와 관련된 격자 역학의 비대칭적 거동을 이해하는 것이 고체 물리학의 주요 과제 중 하나입니다.", "motivation": "키랄 포논(chiral phonons)은 유한한 포논 각운동량을 가지지만, 이를 운동량 공간(momentum-resolved)에서 직접 관측하는 것은 매우 어렵습니다. 이 연구는 텔루륨의 음향 포논 분기에서 이러한 키랄성을 실험적으로 직접 확인하고자 합니다.", "result": "고분해능 비탄성 X선 산란(IXS)을 통해 원소 텔루륨에서 키랄 음향 포논을 직접 검출하는 데 성공했습니다.", "implication": "키랄 포논의 존재가 입증됨에 따라, 포논-전자 상호작용 및 위상학적 포논 수송 현상에 대한 새로운 이해의 장이 열리게 됩니다.", "novelty": "텔루륨과 같은 저차원 구조에서 키랄 음향 포논의 운동량 분해 측정이 이루어졌다는 점이 중요하며, 이는 귀하가 관심을 두는 112 텔루라이드 물질군이나 위상학적 물질의 동역학 이해에 중요한 벤치마크를 제공합니다.", "unresolved": "이 키랄 포논이 구체적인 위상학적 수송 현상이나 열전 특성에 어떻게 기여하는지에 대한 정량적 관계는 여전히 연구가 필요합니다.", "future_work": "다른 키랄 물질에서의 유사한 포논 모드 측정 및 포논의 각운동량이 전하 및 스핀 수송에 미치는 영향에 대한 추가 연구가 예상됩니다.", "concepts": [{"term": "키랄 포논", "why_emerged": "결정 구조의 대칭성 파괴로 인해 포논이 고유한 회전 성질(각운동량)을 가질 수 있다는 이론적 배경 때문에 등장했습니다.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "위상학적 음향학, 포논 홀 효과와 연결됩니다."}, {"term": "비탄성 X선 산란 (IXS)", "why_emerged": "물질의 포논 분산 관계를 에너지와 운동량 공간에서 직접 측정하기 위해 필수적인 기술입니다.", "origin": "수십 년간의 방사광 가속기 기술 발전으로 확립", "connections": "비탄성 중성자 산란(INS)과 상호보완적 관계입니다."}], "engl mplication": "알터자성의 마그논 위상학이 실재함을 보여줌으로써, 새로운 유형의 스핀 정보 수송 장치 개발 가능성을 열었습니다.", "novelty": "알터자성에서 마그논의 키랄성을 관측한 첫 번째 사례로서, 자기 위상 물질 연구에 중요한 이정표가 됩니다.", "unresolved": "이러한 키랄 마그논이 외부 장에 의해 어떻게 스위칭되는지에 대한 물리적 한계 및 동역학적 상세 기제는 여전히 연구 대상입니다.", "future_work": "다양한 알터자성 후보 물질들에 대한 유사한 중성자 산란 연구 및 이를 이용한 스핀 전류 생성 효율 측정.", "concepts": [{"term": "알터자성 (Altermagnetism)", "why_emerged": "강자성도 반강자성도 아닌 새로운 자기적 위상이 요구되는 과정에서 등장했습니다.", "origin": "최근 이론적 제안(2020년대 초)", "connections": "반강자성체, 비스핀 반전 대칭성, 베리 곡률과 연결됩니다."}, {"term": "키랄 마그논", "why_emerged": "마그논이 가진 스핀 파동의 각운동량 성분이 자기적 특성에 영향을 준다는 이론적 필요성에서 등장했습니다.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "스핀 파동, 위상학적 자성체와 연결됩니다."}], "english_summary": ["Altermagnetism is a new magnetic phase with broken time and spatial inversion symmetries.", "Researchers report the observation of chiral magnons in MnTe using polarized inelastic neutron scattering.", "This is the first unambiguous evidence of spin-split magnon bands in an altermagnet.", "The result suggests potential for novel spintronic devices based on chiral spin-wave dynamics."]}}, {"title": "General ab initio framework for electronic-order–induced lattice-dynamics symmetry breaking", "journal": "Science_Advances", "source": "Gemini", "link": "https://doi.org/10.1126/sciadv.aed7081", "authors": "Shuai Zhang, Mengqi Wang, Pan Zhang, Tiantian Zhang", "last_authors": "Pan Zhang, Tiantian Zhang", "summary": "Conventional ab initio approaches are unable to describe phonon time-reversal symmetry ( T ) breaking. Here, we develop an ab initio framework, grounded in molecular Berry curvature (MBC) theory, which captures electronic-order–driven symmetry breaking in lattice dynamics. Using Co 3 Sn 2 S 2 as a model system, our ab initio framework yields phonon spectra that break both T and mirror symmetries, quantitatively reproduce the observed phonon splittings observed in experiments, and reveal distinct microscopic origins for the E g and E u modes: E g splitting is governed by MBC and is accurately captured by our algorithm, whereas E u splitting is enhanced by the Fano resonance and matches the experimental data once the Fano-factor correction is included. Leveraging this algorithm, we predict several candidate materials with nonzero electronic-order–driven symmetry breaking in lattice dynamics, establishing a first-principles route to understand electron-phonon coupling, phonon magnetism, and related Hall-type lattice responses.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Ab initio framework for electronic-order-induced phonon symmetry breaking in the kagome magnet Co3Sn2S2.", "tags": ["theory", "Co3Sn2S2", "Berrycurvature", "kagomelattice"], "image": "", "briefing": {"background": "물질 내 전자 상태가 바뀌면서 생기는 구조적 변화, 특히 포논의 대칭성 파괴를 정밀하게 다루는 것은 응집물질물리학의 난제입니다. 기존의 밀도범함수이론(DFT) 기반 계산은 시간 반전 대칭성(T)이 깨진 상태의 포논 스펙트럼을 기술하는 데 한계가 있었습니다.", "motivation": "카고메 자성체인 Co3Sn2S2에서 실험적으로 관측된 포논 분할(phonon splitting) 현상을 분자 베리 곡률(MBC) 이론을 도입하여 제일원리적으로 설명하고자 했습니다.", "result": "MBC 이론을 결합한 새로운 ab initio 프레임워크를 개발하여 Co3Sn2S2의 E_g 및 E_u 모드에서 발생하는 포논 분할을 정량적으로 재현했습니다. E_g는 MBC로, E_u는 파노 공명 보정을 통해 설명했습니다.", "implication": "전자 질서가 격자 역학에 미치는 영향을 제일원리 수준에서 예측할 수 있게 되었으며, 포논 자기(phonon magnetism) 및 홀 타입 격자 반응 연구의 토대를 마련했습니다.", "novelty": "기존 DFT가 다루지 못했던 시간 반전 대칭성 파괴 포논을 MBC 이론으로 극복했다는 점이 핵심이며, 독자가 관심 있는 카고메 격자 시스템의 전자-포논 결합을 이해하는 강력한 도구를 제시했습니다.", "unresolved": "제시된 프레임워크가 매우 복잡한 상관관계가 존재하는 강상관 전자계에서 어느 정도의 범용성을 가질지에 대해서는 추가 검증이 필요합니다.", "future_work": "예측된 다른 신규 물질들에 대한 실험적 검증 및 전자-포논 결합에 의한 홀 효과 연구로의 확장이 기대됩니다.", "concepts": [{"term": "분자 베리 곡률 (Molecular Berry Curvature)", "why_emerged": "분자나 격자 진동 수준에서 나타나는 기하학적 위상 효과를 설명하기 위해 필요합니다.", "origin": "최근 전자 위상 물리학의 발전과 함께 정립되었습니다.", "connections": "전자 베리 곡률, 이상 홀 효과, 위상 자성체."}, {"term": "파노 공명 (Fano resonance)", "why_emerged": "이산적인 양자 상태와 연속적인 상태 사이의 간섭을 설명하기 위해 필요합니다.", "origin": "Ugo Fano (1961).", "connections": "전자-포논 결합, 분광학적 비대칭 피크."}], "english_summary": ["Developed an ab initio framework to model phonon time-reversal symmetry breaking using molecular Berry curvature.", "Successfully reproduced phonon splitting in Co3Sn2S2, specifically addressing Eg and Eu modes.", "Demonstrated that MBC accurately captures Eg splitting, while Fano resonance explains Eu splitting.", "Established a predictive computational pathway for studying electronic-order-induced lattice dynamics in topological magnetic materials."]}}, {"title": "Anomalous magneto-optical response at RuO2 / WSe2 van der Waals interface", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2606.20262", "authors": "Muhammad Hassan Shaikh, Abhijith Puthiya Veettil, Collin Maurtua, et al.", "last_authors": "Anderson Janotti, Chitraleema Chakraborty", "summary": "arXiv:2606.20262v1 Announce Type: new Abstract: Ruthenium dioxide ($\\mathrm{RuO_2}$) has been proposed as an altermagnetic candidate, although its magnetic ground state remains controversial. Here, we probe weak interfacial magnetic states at the surface of (001)-oriented $\\mathrm{RuO_2}$ films using the magnetic proximity effect (MPE) in a van der Waals heterostructure consisting of monolayer tungsten diselenide ($\\mathrm{WSe_2}$) atop $\\mathrm{RuO_2}$. Temperature-dependent magneto-optical spectroscopy reveals an anomalous excitonic energy shift and a deviation from conventional Varshni behavior below 55 K that are absent in an encapsulated $\\mathrm{WSe_2}$ control sample. The anomalous shift reverses sign upon field cooling with opposite magnetic field polarity, indicating a magnetic origin. Polarization-resolved measurements further show a nearly field-independent and fluctuating valley splitting in $\\mathrm{WSe_2 / RuO_2}$ in strong contrast to the conventional linear Zeeman splitting observed in the control bare $\\mathrm{WSe_2}$ sample. These results suggest that the valley states are governed predominantly by interfacial exchange fields associated with weak surface magnetic states in $\\mathrm{RuO_2}$, which do not produce a conventional linear Zeeman response within the applied magnetic field range. Importantly, this approach enables direct optical probing of emergent surface magnetism without introducing an additional ferromagnetic layer, positioning MPE-based optical probing as a tool for investigating weak surface magnetism and offering new possibilities for studying magnetic materials with controversial magnetic states.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Experimental investigation of altermagnetic proximity effects and band structure.", "tags": ["altermagnet", "vanderWaals", "magneto-optics"], "image": "https://arxiv.org/html/2606.20262v1/x1.png", "briefing": {"background": "RuO2는 알터마그네틱(altermagnetic) 후보 물질로 주목받고 있으나 그 자기적 성질은 여전히 논쟁적입니다. 2D 층상 물질과의 계면에서의 자기적 근접 효과(MPE)는 벌크가 아닌 표면의 미세한 자기 상태를 탐구하는 중요한 창구가 됩니다.", "motivation": "RuO2의 표면 자기 상태가 논쟁적인 상황에서, WSe2와의 반데르발스 이종접합을 통해 계면의 자기적 근접 효과를 광학적으로 측정하여 RuO2의 자기성을 규명하고자 했습니다.", "result": "55K 이하에서 WSe2의 엑시톤 에너지 변화가 일반적인 Varshni 거동을 벗어남을 확인했습니다. 이는 자기장에 따른 방향성 역전이 가능한 자기적 기원이며, 일반적인 Zeeman 효과와는 다른 계면 교환장의 존재를 시사합니다.", "implication": "강자성 층을 덧붙이지 않고도 Altermagnet 후보 물질의 표면 자기 상태를 광학적으로 직접 프로빙할 수 있는 방법론을 제시했습니다.", "novelty": "Altermagnetic 후보인 RuO2의 표면 스핀 상태를 WSe2 밸리 분할이라는 고감도 광학적 도구로 관측했다는 점에서 실험적 가치가 큽니다.", "unresolved": "관측된 현상이 순수하게 표면의 Altermagnetism에서 기인하는지, 혹은 산화층 등 표면 결함에서 발생하는 미세 자성인지에 대한 완벽한 분리는 아직 과제로 남아 있습니다.", "future_work": "다양한 두께와 표면 처리된 RuO2 시료를 이용한 후속 실험을 통해 자기적 기원과 Altermagnetic 특성을 명확히 분리할 필요가 있습니다.", "concepts": [{"term": "알터마그네틱 (Altermagnetism)", "why_emerged": "자화율은 0이지만 스핀 분할된 전자 구조를 가져 스핀트로닉스 응용에 유리한 새로운 자기 상태가 필요했습니다.", "origin": "최근 이론적으로 정립(2022년경).", "connections": "반강자성체, 스핀 분할, 비상반성 수송."}, {"term": "자기적 근접 효과 (Magnetic Proximity Effect)", "why_emerged": "비자성 물질에 인접한 자성체의 자기적 성질을 유도하거나 탐지하기 위해 고안되었습니다.", "origin": "초전도/강자성체 계면에서 초기 논의.", "connections": "스핀 주입, 밸리 분할, spintronics."}], "english_summary": ["Probed surface magnetism in RuO2 using magnetic proximity effect in WSe2/RuO2 van der Waals heterostructures.", "Observed anomalous excitonic shifts in WSe2 below 55K that deviate from conventional Zeeman responses.", "The result points to interfacial exchange fields governed by RuO2 surface states.", "Provides an optical diagnostic tool for investigating controversial altermagnetic candidates without external ferromagnets."]}}, {"title": "Boltzmann-constrained extraction of spin splitting and momentum relaxation in d-wave altermagnets", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2606.19785", "authors": "Y. X. Gao, Z. W. Fan, Q. S. Yao, Y. D. Ji, H. Geng", "last_authors": "Y. D. Ji, H. Geng", "summary": "arXiv:2606.19785v1 Announce Type: new Abstract: Altermagnets exhibit spin-split electronic structure without requiring spin-orbit coupling, but transport measurements generally mix intrinsic spin splitting with extrinsic scattering. We examine this identifiability problem for a two-dimensional d-wave altermagnet within a unified semiclassical framework spanning ballistic to diffusive transport. The spin-dependent Fermi-surface anisotropy produces a pronounced size effect, where vastly different longitudinal velocities cause the two spin channels to exhibit markedly different effective relaxation lengths within the same device geometry. However, the altermagnetic coupling $\\alpha$ and the momentum relaxation time $\\tau_0$ strongly compensate each other in longitudinal conductance, creating a severe parameter degeneracy. To lift this degeneracy, we formulate a physics-informed neural network (PINN) to act as a differentiable Boltzmann solver that strictly enforces contact injection, local particle conservation, and global current continuity. Driven by sparse conductance spectra, this neural solver leverages the Fermi-level dependence of transport to unlock the coupled parameters simultaneously, achieving sub-percent accuracy even under moderate measurement noise. These results show that combining the Fermi-level dependence of transport with strict physical constraints provides a robust route to separating spin splitting from scattering in altermagnetic conductors.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Theory on extracting spin splitting from transport in altermagnets, highly relevant to anomalous Hall and altermagnetism.", "tags": ["theory", "altermagnetism", "transport", "spintronics", "numericalmethods"], "image": "https://arxiv.org/html/2606.19785v1/x1.png", "briefing": {"background": "알터마그네틱 물질은 스핀-궤도 결합 없이도 스핀 분할된 전자 구조를 가지지만, 실제 수송 실험에서는 스핀 분할 효과와 산란에 의한 효과가 혼재되어 데이터를 해석하기 매우 어렵습니다.", "motivation": "d-파 알터마그네틱 물질에서 측정된 수송 데이터로부터 스핀 분할 파라미터와 운동량 완화 시간을 명확하게 분리해내기 위해 새로운 데이터 분석 프레임워크가 필요했습니다.", "result": "물리적 제약이 포함된 신경망(PINN) 기반의 볼츠만 솔버를 구축했습니다. 이를 통해 페르미 준위 의존성을 활용하여 파라미터들 사이의 축퇴(degeneracy)를 풀고 높은 정확도로 스핀 분할도를 추출해냈습니다.", "implication": "알터마그네틱 물질의 복잡한 수송 데이터를 해석하는 표준화된 계산 도구를 제공하며, 향후 스핀트로닉스 재료 개발을 가속화할 것입니다.", "novelty": "데이터 해석의 난제였던 '매개변수 축퇴' 문제를 PINN 기법을 통해 해결했다는 점에서, 데이터 기반 물리 연구의 좋은 사례를 보여줍니다.", "unresolved": "실제 실험적 노이즈가 극심한 경우나 밴드 구조가 매우 복잡한 다중 밴드 시스템에서의 강건성은 추가적인 검증이 필요합니다.", "future_work": "PINN 솔버를 실제 다양한 알터마그네틱 물질의 수송 측정 데이터에 적용하여 실질적인 스핀 분할 파라미터를 도출할 예정입니다.", "concepts": [{"term": "물리적 제약 신경망 (PINN)", "why_emerged": "물리 법칙을 만족해야 하는 데이터 해석에서 블랙박스 AI의 한계를 극복하기 위해 필요합니다.", "origin": "Raissi et al. (2019).", "connections": "Boltzmann 수송 방정식, 역문제 해결."}, {"term": "매개변수 축퇴 (Parameter Degeneracy)", "why_emerged": "서로 다른 물리적 원인이 결과적으로 동일한 측정치를 산출할 때 해석이 불가능해지는 현상을 해결해야 했습니다.", "origin": "역문제(Inverse problem) 일반론.", "connections": "수송 해석, 데이터 분석."}], "english_summary": ["Introduced a physics-informed neural network (PINN) to act as a differentiable Boltzmann solver for altermagnets.", "Addressed the parameter degeneracy problem between spin-splitting and momentum relaxation in transport measurements.", "Successfully extracted spin-splitting parameters from conductance spectra with high precision.", "Offers a robust analytical ion metal chalcogenide compounds (TMC), including $1T-\\mathrm{TiSe_2}$, $\\mathrm{Ta_2Pd_3Te_5}$, and $\\mathrm{Ta_2NiSe_5}$, share a crucial common characteristic: their low-energy physics is governed by electrons in $d-$ orbitals subject to strong on-site Coulomb interactions. In this work, we investigate spatially indirect exciton condensation in two-dimensional semimetals on triangular lattice. Using a combination of dynamical mean-field theory and the determinant quantum Monte Carlo method, we study two- and three-orbital Hubbard models incorporating strong on-site ($U$) and inter-orbital interactions ($V$). Our results demonstrate that on-site Hubbard $U$ can strongly suppress the condensation temperature $T_c$, an effect that is particularly pronounced at higher electron-hole pair densities. This behavior contrasts sharply with the case without on-site $U$, where $T_c$ grows with pair density at fixed $V$. Moreover, we uncover competition among multiple electron-hole pairing channels in the three-orbital model, which also acts to suppress $T_c$ of exciton condensation. An orbital-selective electron-hole pairing state is identified. These findings may help explain the large discrepancy between strong binding-energy and relative low transition temperature for indirect excitons in TMCs materials, offering important insights for understanding and engineering exciton condensation in materials with strongly correlated $d-$ shell electrons.", "tier": "C_MAYBE", "score": "8", "reason": "Correlated electron physics in TMCs; directly relevant to electronic structure/excitons.; tier capped to C: formal/generic theory watch", "tags": ["correlated", "excitons", "semimetals"], "image": "https://arxiv.org/html/2603.18445v2/x1.png", "briefing": {"background": "자동 브리핑을 생성하지 못했습니다. 초록과 원문 링크를 기준으로 빠르게 확인하세요.", "motivation": "초록 정보만으로는 분야 내부의 구체적 동기를 안정적으로 요약하기 어렵습니다.", "result": "arXiv:2603.18445v2 Announce Type: replace Abstract: Identifying materials hosting an excitonic in
