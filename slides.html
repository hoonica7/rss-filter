<!DOCTYPE html>

<head>
<meta charset='UTF-8'>
<meta name='viewport' content='width=device-width, initial-scale=1.0'>
<title>Daily Paper Slideshow</title>
<style>
  :root {
    color-scheme: light;
    --bg: #f6f7f4;
    --paper: #ffffff;
    --ink: #111827;
    --muted: #64748b;
    --line: #d8ddd2;
    --accent: #176b87;
    --accent-2: #9a3412;
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; overflow: auto; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: var(--bg); color: var(--ink); }
  .shell { max-width: 1500px; min-height: 100vh; margin: 0 auto; padding: 14px 18px; display: flex; flex-direction: column; }
  .topbar { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 16px; }
  .top-actions { display: flex; align-items: center; gap: 10px; }
  .topbar a, button { border: 1px solid var(--line); border-radius: 8px; background: var(--paper); color: var(--ink); padding: 10px 14px; font-weight: 700; text-decoration: none; cursor: pointer; }
  button.primary { background: var(--accent); border-color: var(--accent); color: white; }
  button:disabled { opacity: 0.45; cursor: not-allowed; }
  .counter { color: var(--muted); font-weight: 700; }
  .slide { min-height: calc(100vh - 82px); background: var(--paper); border: 1px solid var(--line); border-radius: 10px; padding: 18px; box-shadow: 0 18px 42px rgba(15, 23, 42, 0.10); display: grid; grid-template-columns: minmax(310px, 0.86fr) minmax(0, 1.55fr); gap: 18px; overflow: visible; }
  .paper-head { min-width: 0; min-height: 0; overflow: visible; display: flex; flex-direction: column; gap: 12px; }
  .figure { margin: 0; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: #f8fafc; }
  .figure img { display: block; width: 100%; max-height: 41vh; object-fit: contain; background: white; }
  .figure figcaption { padding: 7px 10px; color: var(--muted); font-size: 12px; line-height: 1.3; }
  .head-text { display: flex; flex-direction: column; gap: 9px; min-width: 0; }
  .badges { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .badge { border-radius: 999px; padding: 5px 9px; background: #eef2ff; color: #3730a3; font-size: 12px; font-weight: 800; }
  .score { background: #fee2e2; color: #991b1b; }
  h1 { margin: 0; font-size: 25px; line-height: 1.15; letter-spacing: 0; overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
  h1 a { color: inherit; text-decoration-color: rgba(23, 107, 135, 0.35); text-decoration-thickness: 2px; text-underline-offset: 4px; }
  h1 a:hover { color: var(--accent); text-decoration-color: var(--accent); }
  .meta, .authors, .why, .abstract { font-size: 13px; line-height: 1.45; }
  .meta, .authors { color: var(--muted); }
  .why strong, .abstract strong, .authors strong { color: var(--ink); }
  .authors { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .why { border-left: 4px solid var(--accent-2); padding-left: 10px; color: #374151; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .abstract { border-top: 1px solid var(--line); padding-top: 14px; color: #374151; }
  .original-abstract { border-top: 1px solid var(--line); padding-top: 10px; color: #374151; font-size: 11.5px; line-height: 1.35; overflow-wrap: anywhere; }
  .original-abstract strong { display: block; margin-bottom: 4px; color: var(--ink); }
  .tags { display: flex; flex-wrap: wrap; gap: 8px; }
  .tag { border-radius: 999px; padding: 4px 8px; background: #f1f5f9; color: #475569; font-size: 12px; font-weight: 700; }
  .head-text > .link { display: none; }
  .briefing { min-width: 0; min-height: 0; overflow: visible; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); grid-auto-rows: minmax(0, auto); align-content: start; gap: 11px 18px; border-top: 0; padding-top: 0; }
  .brief-section { min-width: 0; }
  .brief-section.wide { grid-column: 1 / -1; }
  .brief-section h2 { margin: 0 0 4px; font-size: 14px; line-height: 1.22; color: #0f766e; letter-spacing: 0; }
  .brief-section p, .brief-section li { margin: 0; font-size: 12.5px; line-height: 1.42; color: #1f2937; overflow-wrap: anywhere; }
  .brief-section ul { margin: 0; padding-left: 20px; }
  .concepts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 9px 14px; }
  .concept { border-top: 1px solid var(--line); padding-top: 7px; }
  .concept h3 { margin: 0 0 4px; font-size: 13px; color: #7c2d12; letter-spacing: 0; }
  .concept p { margin: 2px 0 0; font-size: 11.5px; line-height: 1.35; color: #374151; overflow-wrap: anywhere; }
  .concept b { color: #111827; }
  .link { color: var(--accent); font-weight: 800; text-decoration: none; }
  .empty { padding: 48px; background: var(--paper); border: 1px solid var(--line); border-radius: 12px; color: var(--muted); }
  @media (max-width: 860px) {
    .shell { padding: 14px; }
    .topbar, .top-actions { align-items: stretch; flex-direction: column; }
    .slide, .briefing, .concepts { grid-template-columns: 1fr; }
    .slide { min-height: auto; overflow: visible; display: grid; }
    h1 { font-size: 28px; }
  }
</style>

<script>
const slides = [{"title": "Observation of mirror-odd and mirror-even spin texture in ultrathin epitaxially strained RuO 2 films", "journal": "Science_Advances", "source": "author whitelist", "link": "https://doi.org/10.1126/sciadv.aec2917", "authors": "Yichen Zhang, Seung Gyo Jeong, Luca Buiarelli, et al.", "last_authors": "Bharat Jalan, Ming Yi", "summary": "Recently, rutile ruthenium dioxide (RuO 2 ) has attracted renewed interest due to expectations of prominent altermagnetic spin splitting. However, accumulating experimental evidence suggests that, in its bulk and thick-film forms, RuO 2 does not display any form of magnetic ordering. Despite this, the spin structure of RuO 2 remains largely unexplored in the ultrathin limit, where substrate-imposed epitaxial strain can be substantial. Here, we use spin-resolved angle-resolved photoemission spectroscopy, supported by ab initio calculations, to reveal the electronic structure of 2-nanometer-thick epitaxial RuO 2 heterostructures. We observe an unconventional spin texture characterized by the coexistence of mirror-even and mirror-odd momentum-dependent components. A comprehensive symmetry analysis rules out nonmagnetic origins of this spin texture. These findings suggest an emergent nonrelativistic spin structure enabled by epitaxial strain in the ultrathin limit, marking a distinct departure from the behavior of relaxed or bulk RuO 2 . Our work opens previously unexplored perspectives for exploring symmetry-breaking mechanisms and spin textures in oxide heterostructures.", "tier": "A_MUST_READ", "score": "10", "reason": "author whitelist: Sung-Kwan Mo", "tags": ["angle-resolvedphotoemission", "photoemission", "STS", "altermagnet", "heterostructure"], "image": "", "briefing": {"background": "알터마그네티즘(Altermagnetism)은 순 자화량은 0이지만 운동량 공간에서 스핀 할당이 일어나는 새로운 자기 상으로 주목받고 있습니다. RuO2는 대표적인 후보 물질이지만, 최근 벌크 및 두꺼운 박막에서는 자기 질서가 없다는 보고가 잇따르며 논란이 되어 왔습니다.", "motivation": "벌크와 달리 계면 변형(epitaxial strain)이 강하게 작용하는 초박막(2nm) 극한에서 RuO2의 스핀 구조가 어떻게 변화하는지, 그리고 알터마그네틱 특성이 발현되는지 확인하고자 했습니다.", "result": "Spin-resolved ARPES를 통해 2nm RuO2 박막에서 거울 대칭에 대해 짝수(even) 및 홀수(odd) 특성을 동시에 갖는 비전형적 스핀 텍스처를 관측했습니다. 이는 격자 변형에 의해 유도된 비상대론적 스핀 분할 현상임을 대칭성 분석과 제일원리 계산으로 입증했습니다.", "implication": "격자 변형을 통해 비자성으로 알려진 물질에서도 강력한 스핀 할당(spin splitting)을 유도할 수 있음을 보여주며, 이는 스핀트로닉스 소자 응용을 위한 새로운 물리적 경로를 제시합니다.", "novelty": "알터마그네트 후보 물질인 RuO2에서 변형 유기(strain-induced) 스핀 구조를 직접적인 스핀 ARPES로 확인했다는 점이 독보적이며, 독자의 주된 관심사인 알터마그네티즘과 ARPES 실험을 완벽히 관통하는 결과입니다.", "unresolved": "초록에는 명시되지 않았으나, 이러한 스핀 구조가 나타나는 정확한 자기 질서의 온도 의존성이나 자성 도메인의 크기 등에 대한 추가 검증이 필요할 수 있습니다.", "future_work": "다른 기판을 이용한 변형 조절이나, 산화물 헤테로 구조에서의 스핀 홀 효과 측정 등 동역학적 특성 연구가 이어질 것으로 예상됩니다.", "concepts": [{"term": "Altermagnetism (알터마그네티즘)", "why_emerged": "강자성과 반강자성의 장점을 결합하여 순 자화량 없이도 큰 스핀 분할을 얻기 위해 제안됨.", "origin": "Libor Šmejkal, Tomas Jungwirth 등에 의해 이론적으로 정립됨.", "connections": "비상대론적 스핀 분할, 거대한 자기저항 효과, 스핀 홀 효과."}, {"term": "Epitaxial Strain (에피택셜 변형)", "why_emerged": "박막 성장 시 기판과의 격자 부정합을 이용해 물질의 전자 구조나 자성을 미세 조정하기 위해 활용됨.", "origin": "초록 정보만으로는 특정하기 어려움 (박막 물리학의 고전적 기법).", "connections": "금속-절연체 전이, 강유전성 제어, RuO2 자성 유도."}, {"term": "Spin-resolved ARPES", "why_emerged": "단순한 밴드 구조뿐만 아니라 운동량 공간에서의 스핀 극성(spin polarization)을 직접 측정하기 위해 개발됨.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "위상 절연체, Rashba 효과, 알터마그네틱 스핀 분할 확인."}], "english_summary": ["Observation of strain-induced spin splitting in 2nm ultrathin RuO2 films using spin-resolved ARPES.", "Discovery of unconventional mirror-even and mirror-odd spin textures that deviate from bulk behavior.", "Symmetry analysis rules out non-magnetic origins, confirming emergent non-relativistic spin structures.", "Provides a route to engineer altermagnetic-like properties in oxide heterostructures via epitaxial strain."]}}, {"title": "Disentangling bulk and surface states in the electronic structure of PtBi2(0001)", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2607.26804", "authors": "Stefanie Suzanne Brinkman, Xin Liang Tan, Anders Christian Mathisen, et al.", "last_authors": "Jorge I. Facio, Hendrik Bentmann", "summary": "Recent reports of surface-localized topological superconductivity in trigonal PtBi$_2$ highlight the importance of understanding its surface electronic structure. We investigate the bulk and surface band structure of PtBi$_2$ using angle-resolved photoemission spectroscopy (ARPES) and first-principles calculations. Through photon-energy- and polarization-dependent measurements, we disentangle bulk dispersions from surface states on the two distinct surface terminations of PtBi$_2$(0001). For both terminations, we assign several different surface states and find good agreement between experiment and calculations. Based on our calculations, we analyze the orbital composition in the surface and bulk bands and compare the results to polarization-dependent ARPES measurements. Together, our results provide a coherent picture of the surface electronic structure of PtBi$_2$ across both surface terminations.", "tier": "A_MUST_READ", "score": "10", "reason": "Direct ARPES study of electronic and topological surface states in a superconducting material.", "tags": ["ARPES", "electronicstructure", "topological", "superconductivity", "experiment", "material"], "image": "https://arxiv.org/html/2607.26804v1/Figures_VUV/newfig1.png", "briefing": {"background": "PtBi2는 위상학적 특성과 초전도성이 공존할 가능성이 제기되어, 마요라나 페르미온 연구 등을 위한 위상 초전도체 후보로 주목받고 있습니다.", "motivation": "이 물질의 위상학적 성질을 명확히 규명하기 위해서는 ARPES 데이터에서 관측되는 밴드가 벌크(bulk)에서 기인한 것인지, 아니면 표면 상태(surface state)인지 분별하는 것이 필수적입니다.", "result": "광자 에너지 및 편광 의존 ARPES를 통해 PtBi2(0001)의 두 가지 서로 다른 표면 종단(termination)에서 나타나는 표면 상태를 벌크 밴드와 성공적으로 분리해냈습니다. 계산 결과와 비교하여 각 밴드의 궤도 성분(orbital composition)까지 상세히 할당했습니다.", "implication": "PtBi2의 표면 전자 구조에 대한 일관된 지도를 완성함으로써, 향후 이 물질에서 관측되는 초전도 현상이 위상학적 표면 상태와 어떻게 결합되는지 해석할 수 있는 기초를 마련했습니다.", "novelty": "복잡한 112 계열 텔루라이드 관련 물질인 PtBi2에서 실험적으로 표면 상태와 벌크 상태를 명확히 구분했다는 점이 중요하며, 독자의 관심사인  / 2 S=1/2 spin systems with a single ejected fermion, i.e., extracting the single-hole momentum ( k k )- and energy ( ω \\omega )-dependent spectral function A ​ ( k , ω ) A(k,\\omega) . We compute the distance ( r r )- and imaginary time ( τ \\tau )-dependent Green’s function G ​ ( r , τ ) G(r,\\tau) via Angelucci’s canonical transformation [Phys. Rev. B 51 , 11580 (1995)] of the fermionic Hamiltonian, implementing it for stochastic series expansion QMC simulations. Our calculations of A ​ ( k , ω ) A(k,\\omega) focus on the different characteristics of systems with spin-charge separation and those in which a spin polaron forms instead because of effectively attractive interactions between the spin and the charge. Spin-charge separation is well established in the conventional t t - J J chain, which we confirm here as a demonstration of the method. Turning on a multispin interaction Q Q that eventually drives the system into a spontaneously dimerized (valence-bond solid, VBS) state, we can observe the features of spin-charge separation until the VBS transition takes place. While generally good agreement is found with the conventional analytical spin-charge separation ansatz, we point out the formation of a gap between two holon bands that in the ansatz are degenerate (crossing each other versus the momentum) at k = 0 k=0 and k = π k=\\pi . Inside the VBS phase, effectively attractive interactions may lead to the binding of the spinon and holon, for which we find evidence at large Q / J Q/J . In the statically dimerized t t - J J chain (i.e., with alternating strengths of the model parameters), we find equally spaced spin polaron bands corresponding to increasingly large bound states with two internal spin polaron modes—even and odd with respect to parton permutation. Our results overall demonstrate the power of modern analytic continuation tools in combination with large-scale quantum Monte Carlo simulations.", "tier": "A_MUST_READ", "score": "9", "reason": "QMC st  phase induced by a perpendicular electric field in twisted bilayer graphene.", "Authors derive the AC phase shift and find it exhibits sharp peaks near magic angles.", "A dual-tip scanning tunneling spectroscopy configuration is proposed to detect the AC phase shift.", "The findings suggest a novel pathway to manipulate spin-related topological phases in moiré systems."]}}, {"title": "Coloring in anyon superconductivity", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2607.19470", "authors": "Umang Mehta, Yuto Nakajima, Hart Goldman", "last_authors": "Yuto Nakajima, Hart Goldman", "summary": "The recently observed signatures of superconductivity proximate to a fractional quantum anomalous Hall (FQAH) state in a twisted MoTe$_2$ bilayer has revitalized interest in quantum phases of matter induced by anyon dynamics. Here we show how a panoply of anyon-driven phases associated with doping the lattice ${\\nu=2/3}$ FQAH state can be realized as competing instabilities of a Fermi surface of charge-$e/3$ ``quarks'' coupled to a $\\mathrm{SU}(3)_{-1}$ Chern-Simons gauge field, which is dual to the more conventional $\\mathrm{U}(1)_3$ Chern-Simons-Ginzburg-Landau theory of quasiholes. For example, a range of electronic superconductors emerge from \\emph{color superconductivity}, under which the Fermi surface experiences a pairing instability mediated by gauge fluctuations. These include SC$\\star$ phases -- where superconductivity coexists with topological order -- as well as topological superconductors displaying half-integer chiral central charges when the quarks are weakly paired. One example is a $p+ip$ ``color-valley-locked'' superconductor, a topological analogue of the color superconductor familiar in quantum chromodynamics. On the other hand, both superconducting and non-Fermi liquid phases can emerge when the quarks form an itinerant ferromagnet, polarizing the Fermi surface to a particular combination of colors. Finally, our framewo s://arxiv.org/abs/2607.27104", "authors": "Guihao Jia, Jingming Yan, Yucong Peng, et al.", "last_authors": "Qi-Kun Xue, Wei Li", "summary": "In iron-based superconductors, the dz2 orbital band typically resides far below the Fermi level and has not been considered to participate in Cooper pairing. Here, using monolayer FeSe/SrTiO3 as a model system, we demonstrate that tip-induced tensile strain controllably shifts the dz2 band toward the Fermi level, driving a two-stage enhancement of superconductivity. In-plane lattice expansion first enhances electronic correlation, amplifying superconductivity in the initial stage. As strain further increases, the upward-shifted dz2 band hybridizes with the dxy band, reconstructing the pairing-active d-orbital bands and inducing a secondary, stronger gap enhancement. Collectively, these two stages enlarge the superconducting gap from 17.8 to 23.6 meV. Throughout this process, invariant Fermi wave vectors confirm that the enhancement originates from band renormalization and reconstruction rather than carrier doping. Our work establishes a route to tailor superconducting states via strain-activated electronic correlations and band engineering, and reveals a previously unrecognized orbital-selective pairing mechanism with broad implications for correlated multiband superconductors.", "tier": "B_IMPORTANT_CONDMAT", "score": "9", "reason": "STM study of strain-controlled band reconstruction and enhanced superconductivity in monolayer FeSe/SrTiO3.", "tags": ["STM", "FeSe", "superconductivity", "monolayer"], "image": "https://arxiv.org/static/browse/0.3.4/images/arxiv-logo-fb.png", "briefing": {"background": "FeSe/SrTiO3 단층 박막은 고온 초전도 메커니즘을 규명하기 위한 대표적인 모델 시스템으로, 계면 결합과 격자 변형을 통한 Tc 조절 연구가 활발합니다.", "motivation": "일반적으로 FeSe 기반 초전도체에서 dz2 오비탈은 페르미 준위 아래 깊숙이 존재하여 초전도 현상에 참여하지 않는 것으로 간주되어 왔으나, 본 연구는 이를 인위적인 변형을 통해 제어하여 초전도성에 미치는 영향을 조사하고자 했습니다.", "result": "STM 팁을 이용한 인장 변형으로 dz2 오비탈을 페르미 준위로 끌어올려, 전자 상관관계 강화와 dxy-dz2 밴드 혼성화를 통해 초전도 갭이 17 unconventional superconductivity is observed by applying pressure to this material.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Novel vdW heavy-fermion superconductor CeSiI; highly relevant to Kondo physics and unconventional superconductivity interests.", "tags": ["material", "CeSiI", "heavy-fermion", "superconductivity", "vdW"], "image": "https://media.springernature.com/m685/springer-static/image/art%3A10.1038%2Fs41567-026-03392-3/MediaObjects/41567_2026_3392_Fig1_HTML.png", "briefing": {"background": "CeSiI와 같은 2D van der Waals(vdW) 물질은 강한 전자 상관관계와 자기적 질서가 층상 구조 속에서 어떻게 발현되는지 연구할 수 있는 플랫폼을 제공함.", "motivation": "저차원 중페르미온(heavy-fermion) 금속인 CeSiI에서 압력 변화를 통해 자기 질서와 초전도성의 경쟁 및 상호작용을 탐구하고자 함.", "result": "압력 인가에 따라 반강자성 상태가 억제되면서 Kondo 결맞음과 비전통적 초전도성이 발현되는 위상도를 확인.", "implication": "vdW 층상 구조가 중페르미온 초전도 연구의 새로운 후보군이 될 수 있음을 입증하며, 압력 조절을 통한 물성 제어의 가능성을 제시.", "novelty": "vdW 물질과 전형적인 3D 기반의 heavy-fermion 물리 사이의 연결 고리를 찾았으며, 층상 구조에서의 양자 임계 현상을 연구할 수 있음.", "unresolved": "이 초전도성의 대칭성(s-wave vs d-wave)과 Kondo 격자 시스템 내에서의 구체적인 페르미 면 변화는 추가 측정 필요.", "future_work": "압력 하에서의 ARPES 또는 비탄성 중성자 산란을 통해 Kondo 결맞음과 스핀 유동성 확인.", "concepts": [{"term": "Heavy-Fermion Metal", "why_emerged": "f-전자와 전도 전자 사이의 Kondo 상호작용으로 인해 유효 질량이 매우 커진 전자 시스템의 이해를 위해.", "origin": "1970년대 후반~80년대 초반 CeAl3 등에서 확립.", "connections": "Kondo 효과, 양자 임계점, 비전통적 초전도."}, {"term": "Van der Waals (vdW) Heavy-Fermion", "why_emerged": "기존 벌크 중페르미온 물질을 2D 한계치까지 박리하거나 조절하여 새로운 소자 응용 및 물리 탐색을 위해.", "origin": "최근 수년간 vdW 자성체 및 초전도체 연구의 확산.", "connections": "2D 물질, Moire 시스템."}], "english_summary": ["CeSiI is identified as a novel two-dimensional van der Waals heavy-fermion metal.", "Application of pressure reveals a phase diagram involving antiferromagnetism and unconventional superconductivity.", "The findings highlight the role of structural dimensionality in heavy-fermion physics.", "This system offers a tunable platform to study the interplay between Kondo coherence and superconductivity."]}}, {"title": "Electronic states at twist stacking faults in rhombohedral graphite", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/9nng-3m6q", "authors": "Xiaoqian Liu, Yifei Guan, Oleg V. Yazyev", "last_authors": "Yifei Guan, Oleg V. Yazyev", "summary": "Flat bands are typically associated with finely tuned moiré systems in two dimensions. Here we show that twist stacking faults in bulk rhombohedral graphite generically produce nearly flat interface bands governed by the interplay between the moiré periodicity and Zak phase topology. We identify a c…", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Directly relevant study on moiré flat bands and Zak phase topology in rhombohedral graphite.", "tags": ["material", "topology", "flat-bands", "moiré"], "image": "", "briefing": {"background": "모아레 격자는 층상 구조 물질에서 층 간의 뒤틀림(twist)에 의해 발생하는 주기적 퍼텐셜로, 강상관 전자계와 평탄 밴드(flat band) 물성을 구현하는 핵심 플랫폼입니다.", "motivation": "기존 모아레 연구가 주로 2D 반데르발스 이종접합에 집중된 것과 달리, 본 연구는 3차원 능면체 흑연(rhombohedral graphite) 내부의 뒤틀림 적층 결함(twist stacking fault)이 가진 전자 구조적 특성을 규명하고자 합니다.", "result": "능면체 흑연의 적층 결함이 모아레 주기성과 Zak 위상 토폴로지의 상호작용을 통해 평탄 밴드를 자연스럽게 생성함을 보였습니다.", "implication": "3차원 벌크 물질 내에서도 인위적인 층 조절 없이 결함 제어만으로 토폴로지 평탄 밴드 물성을 유도할 수 있음을 시사합니다.", "novelty": "외부에서 힘을 가해 뒤틀림을 만드는 방식이 아닌, 벌크 물질 내부의 적층 결함을 이용한 자생적 모아레 물리라는 점이 독특하며, 흑연 기반의 토폴로지 연구에 새로운 관점을 제공합니다.", "unresolved": "실제 실험적 측정(ARPES 등)을 통한 밴드 구조 검증이 필요하며, 결함의 밀도와 분포를 얼마나 정교하게 제어할 수 있는지가 과제입니다.", "future_work": "실제 능면체 흑연 시료에서 STM/STS를 통한 국소 상태 밀도 측정 및 ARPES를 이용한 평탄 밴드의 직접 관측이 필요합니다.", "concepts": [{"term": "능면체 흑연", "why_emerged": "탄소 동소체 중 적층 순서에 따른 전자 구조의 변화가 크고, 표면 상태가 토폴로지 물성을 가질 수 있어 연구됨.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "ABC 적층 흑연, 토폴로지 절연체, 그래핀 모아레 시스템."}, {"term": "Zak 위상", "why_emerged": "1차원 격자 시스템에서 밴드 구조의 토폴로지적 특성을 정의하기 위해 필요함.", "origin": "J. Zak (1989)", "connections": "베리 위상, SSH 모델, 토폴로지 위상 불변량."}], "english_summary": ["Investigates nearly flat interface bands in rhombohedra t, the spin-wave Goldstone mode acquires a gap, controlled by the magnetic field. The universal ν / T behavior of the resonance linewidth suggests thermally assisted magnon-magnon collisions as the key magnetic relaxation mechanism in α -MnTe.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Experimental spectroscopy of a key altermagnetic material MnTe.", "tags": ["experiment", "altermagnet", "MnTe"], "image": "", "briefing": {"background": "알터마그네틱(Altermagnetic) 물질은 전통적인 강자성체나 반강자성체와 달리, 비자성체와 유사하게 순 자기 모멘트는 0이지만 스핀 분리된 밴드 구조를 갖는 새로운 자기적 위상입니다.", "motivation": "알터마그네틱 후보 물질인 α-MnTe의 스핀파(magnon) 동역학을 이해하기 위해, 외부 자기장에 따른 저에너지 스핀파 모드인 골드스톤 모드의 변화를 관찰하고자 했습니다.", "result": "자기장 하에서 스핀파 골드스톤 모드가 갭(gap)을 형성함을 확인하였으며, 공명 선폭의 온도 의존성을 통해 스핀 이완 메커니즘이 열에 의한 마그논-마그논 충돌임을 규명했습니다.", "implication": "알터마그네틱 물질에서의 스핀 동역학을 실험적으로 입증함으로써, 향후 스핀트로닉스 소자 응용을 위한 기초 데이터를 제공합니다.", "novelty": "α-MnTe와 같은 알터마그넷의 기초적인 자기적 성질을 ESR 분광법을 통해 직접적으로 측정하여 비자성-강자성 특성을 가진 밴드 구조의 근간이 되는 마그논 거동을 상세히 밝힌 점이 중요합니다.", "unresolved": "공명 선폭이 특정 온도 영역에서 왜 ν/T 거동을 정확히 따르는지에 대한 미시적 상세 모델링이 추가로 필요합니다.", "future_work": "다양한 결정 방향에서의 ESR 측정 및 더 높은 자기장에서의 스핀파 분산 관계 연구가 필요합니다.", "concepts": [{"term": "Altermagnetism", "why_emerged": "반강자성체의 무자성 특성과 강자성체의 밴드 분할 특성을 동시에 가지는 물질군을 기술하기 위해 등장.", "origin": "최근 2-3년 내 이론적으로 제안 및 명명됨 (초록 정보만으로는 특정인물 확인 어려움).", "connections": "반강자성, 비상대론적 스핀 분할, 스핀트로닉스."}, {"term": "Goldstone mode", "why_emerged": "연속적 대칭성이 자발적으로 깨질 때 나타나는 저에너지 여기 상태를 설명하기 위해 필요.", "origin": "Yoichiro Nambu, Jeffrey Goldstone (1960년대).", "connections": "자발적 대칭성 깨짐, 힉스 메커니즘, 초전도체."}], "english_summary": ["Investigated the spin-wave dynamics in α-MnTe using ESR spectroscopy.", "The spin-wave Goldstone mode exhibits a magnetic-field-dependent energy gap.", "Identified thermally assisted magnon-magnon collisions as the primary relaxation mechanism.", "Provides experimental insight into the fundamental magnetic excitations of altermagnets."]}}, {"title": "Suppression of magnetism in Co3Sn2S2 under external pressure", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/v623-m3y4", "authors": "A. Chmeruk, D. Jones, R. Dwadasi, J. Ebad-Allah, F. Beiuşeanu, F. Schilberth, et al.", "last_authors": "H. Nakamura, C. A. Kuntscher, A. Östlin, and L. Chioncel", "summary": "Magnetic materials with nontrivial band topology combine key concepts of modern solid-state physics and are expected to broaden the range of emergent quantum phases. At the same time, external pressure has proven to be a viable tool in manipulating the band topology and magnetism. Using first-principle simulations combined with optical spectroscopy measurements, the authors show here how the correlation effects are largely responsible for the suppression of the ferromagnetic state in a prototypical Weyl semimetal Co 3 Sn 2 S 2 under external pressure.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Prototypical Weyl semimetal with strong relevance to electronic structure and magnetic topology interests.", "tags": ["material", "Co3Sn2S2", "Weylsemimetal"], "image": "", "briefing": {"background": "Co3Sn2S2는 위상학적으로 비자명한 밴드 구조와 강자성 특성을 동시에 가지는 대표적인 웨일 반금속으로, 응집물질물리학에서 자기적 위상 물질의 연구 모델입니다.", "motivation": "외부 압력을 인가했을 때 강자성 및 위상적 밴드 구조가 어떻게 제어될 수 있는지, 특히 전자 상관관계의 역할을 규명하고자 했습니다.", "result": "압력에 의해 강자성 상태가 억제됨을 확인하였으며, 이 과정에서 단순한 격자 왜곡보다 전자 상관관계가 핵심적인 역할을 한다는 점을 광학 분광법과 제1원리 계산으로 증명했습니다.", "implication": "압력이 위상적 전자 구조와 자기적 정렬을 조절하는 효과적인 수단임을 보였으며, 이는 위상적 소자 개발에 활용될 수 있습니다.", "novelty": "Co3Sn2S2라는 중요한 후보 물질에서 압력에 의한 자기적 전이를 전자 상관관계 관점에서 풀어낸 점이 주목할 만합니다.", "unresolved": "압력 하에서 나타나는 양자 임계점 근처의 상세한 물리량 변화 및 위상적 불변량의 변화 정도는 추가 연구가 필요합니다.", "future_work": "압력 하에서의 ARPES 측정을 통해 실제 밴드 구조의 변형을 직접적으로 관측할 필요가 있습니다.", "concepts": [{"term": "Weyl semimetal", "why_emerged": "밴드 교차점에서 Weyl fermion quasiparticle이 존재하는 위상적 위상을 기술하기 위해 필요.", "origin": "Herring (1937) 이론 제안, Wan et al. (2011) 물질 예측.", "connections": "위상 절연체, 이상 홀 효과, Berry curvature."}, {"term": "External pressure", "why_emerged": "물질의 화학적 조성 변화 없이 격자 상수와 전자 간 상호작용을 미세하게 조절하기 위해 필요.", "origin": "Bridgman 등 고압 물리학의 발전.", "connections": "상전이 유도, Mott 절연체 제어, 초전도성 억제/증폭."}], "english_summary": ["Studied the suppression of ferromagnetism in Weyl semimetal Co3Sn2S2 under pressure.", "Used first-principles simulations and optical spectroscopy.", "Correlation effects are found to be dominant in the magnetic suppression.", "Provides insights into tuning band topology and magnetism in topological materials."]}}, {"title": "Altermagnetism in Quasicrystals", "journal": "PRL_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/src1-b2xt", "authors": "Rui Chen, Bin Zhou, Dong-Hui Xu", "last_authors": "Bin Zhou, Dong-Hui Xu", "summary": "Altermagnets are a recently discovered class of magnetic materials that combine a collinear, zero-magnetization spin structure, characteristic of antiferromagnets, with spin-split electronic bands, a hallmark of ferromagnets. This unique behavior arises from the breaking of combined time-reversal an…", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Theory on altermagnetism in quasicrystals, directly relevant to magnetic topics.", "tags": ["theory", "altermagnetism", "quasicrystals"], "image": "", "briefing": {"background": "알터마그네티즘은 결정 대칭성에 기반한 스핀 분할 현상으로, 기존에는 주로 주기적 결정 구조에서 논의되었습니다.", "motivation": "비주기적인 구조를 가진 준결정(Quasicrystal)에서도 알터마그네티즘이 존재할 수 있는지 이론적으로 탐구하고자 했습니다.", "result": "시간-반전 대칭성과 병진 대칭성이 결합된 형태가 깨질 경우, 준결정에서도 알터마그네티즘이 나타날 수 있음을 입증했습니다.", "implication": "알터마그네티즘의 물리적 도메인을 준결정 시스템까지 확장하여, 비주기적 위상 물성 연구의 새로운 장을 열 수 있습니다.", "novelty": "결정학적 한계를 넘어 준결정 구조에서의 스핀 분할 가능성을 제시한 점이 매우 혁신적입니다.", "unresolved": "실제 준결정 화합물에서 이 현상을 구현하기 위한 구체적인 후보 물질 선정과 합성법이 제시되지 않았습니다.", "future_work": "해당 이론을 적용할 수 있는 적절한 준결정 물질을 탐색하고, 수치 계산을 통해 물리적 물성을 정량적으로 예측해야 합니다.", "concepts": [{"term": "Quasicrystal", "why_emerged": "병진 대칭성은 없지만 회전 대칭성을 가지는 독특한 고체 구조를 기술하기 위해 등장.", "origin": "Dan Shechtman (1982).", "connections": "페닝 로즈 타일링, 금속-유리, 위상적 정렬."}, {"term": "Time-reversal symmetry breaking", "why_emerged": "강자성이나 반강자성 등 자성을 가진 상태의 위상적 성질을 정의하기 위해 필요.", "origin": "Wigner (1932) 등 초기 양자역학.", "connections": "위상 절연체, 양자 홀 효과, 스핀-궤도 결합."}], "english_summary": ["Extends the concept of altermagnetism to quasicrystalline systems.", "Theoretical framework shows spin-split bands in non-periodic lattice structures.", "Demonstrates that combined symmetry breaking can host altermagnetic behavior in quasicrystals.", "Opens new perspectives for topological properties in non-periodic solids."]}}, {"title": "D-Wave Phonon Angular Momentum Texture in Altermagnets by Magnon-Phonon Hybridization", "journal": "PRL_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/r43h-ch8r", "authors": "Hannah Bendin, Alexander Mook, Ingrid Mertig, Robin R. Neumann", "last_authors": "Ingrid Mertig, Robin R. Neumann", "summary": "In altermagnets, the magnon bands are anisotropically spin split in reciprocal space without relativistic or dipolar spin-spin interactions. In this Letter, we theoretically study magnons and phonons coupled by spin-lattice interaction in a two-dimensional square-lattice d -wave altermagnet. We show that phonon-chirality-selective magnon-phonon hybridization can be caused by interfacial Dzyaloshinskii-Moriya interaction leading to the emergence of hybrid quasiparticles that possess finite phonon angular momentum. These hybrid quasiparticles are called magnon polarons and consist of spin-polarized magnons and chiral phonons. Their phonon angular momentum texture follows the d -wave character of the magnon spin texture, opening up the possibility of phononic counterparts to the electronic response effects in altermagnets, such as a , i.e., the generation of a transverse phonon angular momentum current induced by a temperature gradient—the bosonic analog of the spin-splitter effect.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Theoretical study of magnon-phonon coupling and angular momentum texture in altermagnets.", "tags": ["theory", "altermagnetism", "magnons", "phonons"], "image": "", "briefing": {"background": "알터마그넷(Altermagnet)은 시간 반전 대칭과 병진 대칭의 결합으로 인해 상대론적 효과 없이도 역격자 공간에서 이방성 스핀 분할이 발생하는 새로운 자기 질서 상태입니다.", "motivation": "본 연구는 알터마그넷 내에서 마그논과 포논이 스핀-격자 상호작용을 통해 결합할 때 나타나는 물리적 현상, 특히 마그논-포논 하이브리드(마그논 폴라론)의 각운동량 분포를 이론적으로 규명하고자 했습니다.", "result": "D-wave 알터마그넷에서 계면 Dzyaloshinskii-Moriya 상호작용이 포논과 마그논의 선택적 결합을 유도하며, 이로 인해 포논 각운동량 텍스처가 마그논의 스핀 텍스처와 동일한 D-wave 대칭성을 가짐을 증명했습니다.", "implication": "알터마그넷에서 전자적 스핀-스플리터 효과의 보존적 대응물인 '포논 각운동량 전류' 생성이 가능함을 제시하며, 열 구배를 통해 포논 흐름을 제어하는 스핀트로닉스의 확장된 가능성을 열었습니다.", "novelty": "전자계의 Berry 곡률 및 스핀 텍스처 연구에서 bosonic 대응물인 포논 시스템으로 개념을 확장했으며, 알터마그넷의 고유한 대칭성을 격자 진동 모드와 연결했다는 점에서 독창적입니다.", "unresolved": "실제 실험적 환경에서의 계면 효과 유도 가능성과 제안된 포논 각운동량 전류의 구체적인 측정 방법론은 여전히 도전 과제입니다.", "future_work": "실제 알터마그넷 후보 물질에서의 비탄성 중성자 산란이나 RIXS를 이용한 포논-마그논 혼성 상태의 실험적 검증이 기대됩니다.", "concepts": [{"term": "알터마그넷 (Altermagnet)", "why_emerged": "기존 강자성/반강자성으로 분류되지 않는, 비상대론적 스핀 분할을 가지는 새로운 자기 질서 위상을 기술하기 위해 필요함.", "origin": "최근 2020년대 초반 이론적으로 정립됨(예: J. Zelezny 등).", "connections": "반강자성 스핀트로닉스, 비상반성 전달 현상과 밀접함."}, {"term": "마그논 폴라론 (Magnon Polaron)", "why_emerged": "마그논과 포논이 강하게 결합할 때 나타나는 준입자 상태를 기술하기 위해 필요함.", "origin": "전통적인 자기 시스템에서 연구되어 왔으나 알터마그넷으로의 확장은 최근 시도임.", "connections": "스핀-격자 결합, 마그논-포논 혼성."}], "english_summary": ["Theoretical study of magnon-phonon coupling in d-wave altermagnets.", "Identifies the emergence of magnon polarons with finite phonon angular momentum.", "Shows phonon angular momentum texture mirrors the altermagnetic spin texture.", "Proposes a bosonic analog to the spin-splitter effect in altermagnets."]}}, {"title": "Intrinsic Nernst Effect from Berry Curvature in Superconductors", "journal": "PRL_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/jhgx-c8f1", "authors": "Tzu-Chi Hsieh, Cong Xiao, Yi-Ting Hsu", "last_authors": "Cong Xiao, Yi-Ting Hsu", "summary": "The Nernst effect acts as direct probe of Berry curvature to test topological superconductivity in 2D material with spin-orbit coupling.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Theoretical proposal for using Nernst effect to probe Berry curvature in 2D topological superconductors.", "tags": ["theory", "Berrycurvature", "topologicalsuperconductor", "Nernsteffect", "2Dmaterials"], "image": "", "briefing": {"background": "위상 초전도체는 벌크 상태의 위상 불변량에 의해 결정되는 에지(edge) 혹은 표면 상태를 가지며, 이는 베리 곡률과 직접적인 관련이 있습니다.", "motivation": "위상 초전도체의 베리 곡률을 실험적으로 증명하기 위한 직접적인 관측 방법론으로서 네른스트 효과(Nernst effect)의 타당성을 평가하고자 합니다.", "result": "2D 물질에서 스핀-궤도 결합이 존재할 때 네른스트 효과가 베리 곡률을 직접적으로 측정하는 도구가 될 수 있음을 이론적으로 도출했습니다.", "implication": "위상 초전도성을 검증할 때 기존의 복잡한 STM/STS나 분광학적 방법 외에 열전 현상을 활용한 새로운 실험적 진단법을 제공합니다.", "novelty": "전통적인 홀 효과나 자기장 응답 외에 위상물질의 열전 특성과 베리 곡률 간의 정량적 관계를 명확히 하여 초전도 위상 물성 연구의 지평을 넓혔습니다.", "unresolved": "실제 초전도 상태에서 열전 계수가 매우 작아 실험적 신호대 잡음비(SNR) 확보가 어렵다는 실무적 한계가 존재합니다.", "future_work": "강한 스핀-궤도 결합을 가진 위상 초전도체 후보군에서 저온 네른스트 측정 실험이 필요합니다.", "concepts": [{"term": "네른스트 효과 (Nernst Effect)", "why_emerged": "온도 구배 하에서 발생하는 가로 방향의 기전력을 통해 전하 운반자의 위상적 성질을 탐지하기 위해 사용됨.", "origin": "Walther Nernst (1886년).", "connections": "홀 효과, 베리 곡률, 위상 수송 현상."}, {"term": "베리 곡률 (Berry Curvature)", "why_emerged": "양자역학적 파동 함수의 기하학적 위상 성질을 에너지 대역 구조에 도입하기 위해 필요함.", "origin": "Michael Berry (1984년).", "connections": "이상 홀 효과, 위상 불변량, TKNN 불변량."}], "english_summary": ["Investigates the Nernst effect as a probe for Berry curvature in 2D superconductors.", "Connects topological superconductivity with transverse thermoelectric response.", "Provides a theoretical framework for using Nernst measurements to reveal topological properties.", "Useful for characterizing topological superconductors with spin-orbit coupling."]}}, {"title": "Mechanism for Nodal Topological Superconductivity on PtBi2 Surface", "journal": "PRL_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/x1cy-w5zd", "authors": "Kristian Mæland, Giorgio Sangiovanni, Björn Trauzettel", "last_authors": "Giorgio Sangiovanni, Björn Trauzettel", "summary": "Experiments show that the Weyl semimetal ${\\mathrm{PtBi}}_{2}$ hosts unconventional superconductivity in its topological surface states. Hence, the material is a candidate for intrinsic topological superconductivity. Measurements indicate nodal gaps in the center of the Fermi arcs. We derive that an…", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Theoretical study of topological superconductivity on Weyl semimetal PtBi2 surface, with experimental links.", "tags": ["theory", "topologicalsuperconductor", "Weylsemimetal", "PtBi2", "STS", "unconventionalsuperconductivity"], "image": "", "briefing": {"background": "PtBi2는 Weyl 준금속 특성과 초전도성을 동시에 보여, 위상 초전도체의 후보 물질로 주목받고 있는 전이금속 칼코겐 화합물입니다.", "motivation": "PtBi2 표면의 STM 측정에서 관찰된 노달(nodal) 초전도 갭 구조의 기원을 위상 표면 상태와의 상관관계 속에서 설명하고자 했습니다.", "result": "Weyl 준금속 표면의 페르미 아크(Fermi arc) 상태와 벌크 초전도 상태 간의 상호작용이 표면에서 노달 위상 초전도성을 유도할 수 있는 기작을 규명했습니다.", "implication": "위상 표면 상태가 어떻게 고유한 초전도 갭 구조를 형성하는지에 대한 이론적 토대를 마련했으며, 이는 위상 양자 소자 개발의 단초가 됩니다.", "novelty": "실험적으로 관측된 노달 구조를 이론적으로 정당화함으로써, PtBi2가 위상 초전도체임을 강력히 시사하고 관련 연구의 표준 모델을 제시했습니다.", "unresolved": "이론과 실험 간의 정량적 오차 범위 및 다른 표면 상태와의 경쟁 관계에 대한 추가적인 연구가 필요합니다.", "future_work": "자기장 하에서의 STS 연구를 통해 표면 상태의 보텍스 코어 거동 및 마요라나 모드 탐색이 후속되어야 합니다.", "concepts": [{"term": "Weyl 준금속 (Weyl Semimetal)", "why_emerged": "역격자 공간에서 밴드가 선형적으로 교차하는 Weyl 노드를 가지는 위상 물질을 기술하기 위해 필요함.", "origin": "초기 제안은 1929년 H. Weyl, 고체 물성 발현은 2010년대 초반임.", "connections": "위상 초전도체, 이상 홀 효과, 페르미 아크."}, {"term": "노달 초전도성 (Nodal Superconductivity)", "why_emerged": "초전도 갭이 일부 방향에서 0이 되는 비전통적 초전도체의 성질을 기술하기 위해 필요함.", "origin": "고온 초전도체(cuprates) 연구에서 d-wave 대칭성과 함께 널리 알려짐.", "connections": "위상 초전도체, 갭 비등방성, 강상관 전자계."}], "english_summary": ["Analyzes the nodal superconducting gap on the surface of Weyl semimetal PtBi2.", "Links surface states (Fermi arcs) to intrinsic topological superconductivity.", "Provides a ections": "반강자성체, 스핀트로닉스, 베리 곡률."}, {"term": "준결정 (Quasicrystals)", "why_emerged": "전통적인 결정학의 주기성 정의를 벗어난 회전 대칭성을 가진 물질을 설명하기 위해 도입되었습니다.", "origin": "Dan Shechtman (1982)에 의해 처음 발견되었습니다.", "connections": "펜로즈 타일링, 비주기적 순서, 위상적 상태."}], "english_summary": ["Extends altermagnetism concept from periodic crystals to quasicrystalline structures.", "Uses a hyperspatial projective construction to show symmetry-protected spin splitting.", "Proposes that aperiodic systems can host non-trivial magnetic spin textures.", "Theoretical framework opens doors for exploring spin-dependent physics in quasicrystals."]}}, {"title": "Step geometry–guided growth of rhombohedral graphene", "journal": "Science", "source": "Gemini", "link": "https://doi.org/10.1126/science.aed9202", "authors": "Mengze Zhao, Zhibin Zhang, Xin Sui, et al.", "last_authors": "Xiaobo Lu, Kaihui Liu", "summary": "Rhombohedral (ABC)–stacked graphene has emerged as a platform for exploring correlated and topological physics. However, its large-scale, pure-phase synthesis has been hindered by intrinsic thermodynamic metastability and kinetic instability. In this work, we introduce a step geometry–guided epitaxial strategy to deterministically control interlayer slip, enabling the synthesis of pure-phase rhombohedral graphene. Using this approach, we obtained pure (phase purity > 99%) rhombohedral graphene with an area reaching 160 micrometers by 80 micrometers and thickness ranging from ~15 layers to ~120 nanometers. The resulting samples establish the first comprehensive reference dataset of Raman fingerprints and intrinsic band structures from few-layer films to ~200-layer bulk. Electronic transport measurements reveal a layer-antiferromagnetic state and the quantum anomalous Hall effect, enabling scalable exploration of next-generation quantum science and technology applications.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Synthesis of rhombohedral graphene with quantum anomalous Hall effect and correlated physics.", "tags": ["graphene", "topological", "correlated", "anomalousHalleffect", "antiferromagnetism", "transport", "synthesis"], "image": "", "briefing": {"background": "ABC 적층(Rhombohedral) 그래핀은 전자 간 상호작용이 강해지기 쉬운 평평한 밴드 구조를 가지고 있어, 강상관계 및 위상 물성을 탐구하는 핵심 플랫폼으로 주목받고 있습니다.", "motivation": "ABC 적층 그래핀의 순수한 상을 넓은 면적으로 합성하는 것은 열역학적 불안정성 때문에 매우 어려웠으며, 이를 극복하기 위한 결정 성장 기법이 필요했습니다.", "result": "계단 구조를 이용한 에피택셜 성장 기법을 통해 99% 이상의 순도를 가진 대면적 ABC 적층 그래핀을 합성하는 데 성공했습니다.", "implication": "이를 통해 층간 반강자성 상태 및 양자 변칙 홀 효과(QAHE)를 안정적으로 관측할 수 있게 되었으며, 확장 가능한 위상 양자 소자 제작이 가능해졌습니다.", "novelty": "기존의 무작위성 성장을 제어하여 대면적 ABC 그래핀을 확보함으로써, 전자 구조와 수송 물성에 대한 정밀한 실험적 연구를 가능하게 한 공학적 성과입니다.", "unresolved": "다양한 층수에서 나타나는 위상적 전이의 상세한 메커니즘과 외부 환경(온도, 게이트)에 대한 구체적인 위상도 연구가 추가로 필요합니다.", "future_work": "합성된 시료를 이용한 다양한 게이트 조절 실험 및 정밀한 광학적 분광 연구, 그리고 이를 활용한 위상 양자 소자 설계가 예상됩니다.", "concepts": [{"term": "ABC 적층 (Rhombohedral graphene)", "why_emerged": "그래핀 층들의 쌓임 방식에 따라 밴드 구조가 급격히 달라지며, 특정 쌓임 방식에서 강상관계 물리현상이 나타나기 때문입니다.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "무아레 그래핀, 강상관 물리, 양자 변칙 홀 효과."}, {"term": "양자 변칙 홀 효과 (QAHE)", "why_emerged": "외부 자기장 없이도 자발적인 자기 정렬에 의해 전도 채널이 위상적으로 보호되는 현상을 구현하기 위해 필요합니다.", "origin": "Duncan Haldane(이론), Xue Qikun 그룹(실험, 2013) 등에 의해 확립되었습니다.", "connections": "위상 절연체, 자기적 위상 물질, 베리 곡률."}], "english_summary": ["Achieved high-purity (99%+) large-area synthesis of rhombohedral (ABC) stacked graphene.", "Developed a step geometry-guided epitaxial growth method to control interlayer slip.", "Demonstrated layer-antiferromagnetism and quantum anomalous Hall effect.", "Provides a reliable platform for studying correlated and topological physics in graphene."]}}, {"title": "A programmable superconductor created by light", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2607.14567", "authors": "Viktoria Yursa, Igor Vaskivskyi, Anze Mraz, et al.", "last_authors": "Mikhail Feigelman, Dragan Mihailovic", "summary": "The quest for superconductivity created by light extends for more than half a century, yet direct evidence of a true zero-resistance state - whose macroscopic quantum phase coherence is both created and controlled by light - has remained elusive. Here we report for the first time on a complex but robust light-programmable superconducting (LiPS) state at an aluminium-silicon heterojunction that is created and fully controlled with femtosecond laser pulses. The superconducting critical temperatures - ranging from 1.8 to 8.5 K, can be increased or erased at will by the application of tailored pulse sequences. At low temperatures the LiPS state shows features characteristic of a Berezinski-Kosterlitz-Thouless topological transition, but another distinct state appears at temperatures above 2 K, which shows clear signatures of quantum phase disorder. In the presence of a magnetic field we observe behaviour characteristic of vortex pinning and creep consistent with the 2-dimensional (2D) nature of the phase coherent system. The origin of the LiPS effect is attributed to light pulse control of the Moire-like superlattice of misfit dislocations (MDs) arising from discommensurations between the Al and Si lattices which is visible by high-resolution electron microscopy. We show how light pulses can be used to control the superlattice periodicity and highlight the appearance of topologically protected soliton-like kinks along the dislocation lines, important for imparting controllable metastability to the system. The demonstration of LiPS paves the way for designing metastable superconducting devices with controllable phase-coherence, enabling applications such as light-engineered quantum circuits, local gap tuning in quantum processors, and optically switchable superconducting devices.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Experimental demonstration of light-programmable superconductivity with 2D and moire-like superlattice features.", "tags": ["experiment", "superconductivity", "mo
