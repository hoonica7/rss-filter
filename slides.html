<!DOCTYPE html>

<head>
<meta charset='UTF-8'>
<meta name='viewport' content='width=device-width, initial-scale=1.0'>
<title>Daily Paper Slideshow</title>
<style>
  :root {
    color-scheme: light;
    --bg: #f6f7f4;
    --paper: #ffffff;
    --ink: #111827;
    --muted: #64748b;
    --line: #d8ddd2;
    --accent: #176b87;
    --accent-2: #9a3412;
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; overflow: auto; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: var(--bg); color: var(--ink); }
  .shell { max-width: 1500px; min-height: 100vh; margin: 0 auto; padding: 14px 18px; display: flex; flex-direction: column; }
  .topbar { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 16px; }
  .top-actions { display: flex; align-items: center; gap: 10px; }
  .topbar a, button { border: 1px solid var(--line); border-radius: 8px; background: var(--paper); color: var(--ink); padding: 10px 14px; font-weight: 700; text-decoration: none; cursor: pointer; }
  button.primary { background: var(--accent); border-color: var(--accent); color: white; }
  button:disabled { opacity: 0.45; cursor: not-allowed; }
  .counter { color: var(--muted); font-weight: 700; }
  .slide { min-height: calc(100vh - 82px); background: var(--paper); border: 1px solid var(--line); border-radius: 10px; padding: 18px; box-shadow: 0 18px 42px rgba(15, 23, 42, 0.10); display: grid; grid-template-columns: minmax(310px, 0.86fr) minmax(0, 1.55fr); gap: 18px; overflow: visible; }
  .paper-head { min-width: 0; min-height: 0; overflow: visible; display: flex; flex-direction: column; gap: 12px; }
  .figure { margin: 0; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: #f8fafc; }
  .figure img { display: block; width: 100%; max-height: 41vh; object-fit: contain; background: white; }
  .figure figcaption { padding: 7px 10px; color: var(--muted); font-size: 12px; line-height: 1.3; }
  .head-text { display: flex; flex-direction: column; gap: 9px; min-width: 0; }
  .badges { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .badge { border-radius: 999px; padding: 5px 9px; background: #eef2ff; color: #3730a3; font-size: 12px; font-weight: 800; }
  .score { background: #fee2e2; color: #991b1b; }
  h1 { margin: 0; font-size: 25px; line-height: 1.15; letter-spacing: 0; overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
  h1 a { color: inherit; text-decoration-color: rgba(23, 107, 135, 0.35); text-decoration-thickness: 2px; text-underline-offset: 4px; }
  h1 a:hover { color: var(--accent); text-decoration-color: var(--accent); }
  .meta, .authors, .why, .abstract { font-size: 13px; line-height: 1.45; }
  .meta, .authors { color: var(--muted); }
  .why strong, .abstract strong, .authors strong { color: var(--ink); }
  .authors { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .why { border-left: 4px solid var(--accent-2); padding-left: 10px; color: #374151; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .abstract { border-top: 1px solid var(--line); padding-top: 14px; color: #374151; }
  .original-abstract { border-top: 1px solid var(--line); padding-top: 10px; color: #374151; font-size: 11.5px; line-height: 1.35; overflow-wrap: anywhere; }
  .original-abstract strong { display: block; margin-bottom: 4px; color: var(--ink); }
  .tags { display: flex; flex-wrap: wrap; gap: 8px; }
  .tag { border-radius: 999px; padding: 4px 8px; background: #f1f5f9; color: #475569; font-size: 12px; font-weight: 700; }
  .head-text > .link { display: none; }
  .briefing { min-width: 0; min-height: 0; overflow: visible; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); grid-auto-rows: minmax(0, auto); align-content: start; gap: 11px 18px; border-top: 0; padding-top: 0; }
  .brief-section { min-width: 0; }
  .brief-section.wide { grid-column: 1 / -1; }
  .brief-section h2 { margin: 0 0 4px; font-size: 14px; line-height: 1.22; color: #0f766e; letter-spacing: 0; }
  .brief-section p, .brief-section li { margin: 0; font-size: 12.5px; line-height: 1.42; color: #1f2937; overflow-wrap: anywhere; }
  .brief-section ul { margin: 0; padding-left: 20px; }
  .concepts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 9px 14px; }
  .concept { border-top: 1px solid var(--line); padding-top: 7px; }
  .concept h3 { margin: 0 0 4px; font-size: 13px; color: #7c2d12; letter-spacing: 0; }
  .concept p { margin: 2px 0 0; font-size: 11.5px; line-height: 1.35; color: #374151; overflow-wrap: anywhere; }
  .concept b { color: #111827; }
  .link { color: var(--accent); font-weight: 800; text-decoration: none; }
  .empty { padding: 48px; background: var(--paper); border: 1px solid var(--line); border-radius: 12px; color: var(--muted); }
  @media (max-width: 860px) {
    .shell { padding: 14px; }
    .topbar, .top-actions { align-items: stretch; flex-direction: column; }
    .slide, .briefing, .concepts { grid-template-columns: 1fr; }
    .slide { min-height: auto; overflow: visible; display: grid; }
    h1 { font-size: 28px; }
  }
</style>

<script>
const slides = [{"title": "Monolayer van der Waals kagome lattice for high-temperature flat-band physics", "journal": "Nature_Physics", "source": "author whitelist", "link": "https://www.nature.com/articles/s41567-026-03492-0", "authors": "Hyungkun Bong, Choongjae Won, Seongyong Lee, et al.", "last_authors": "Kyle M. Shen, Mingu Kang", "summary": "The experimental realization of intrinsic 2D kagome materials with controllable flat bands has remained challenging. Now a van der Waals kagome material family is shown to host an isolated, gate-tunable flat band down to the monolayer limit.", "tier": "A_MUST_READ", "score": "10", "reason": "author whitelist: Chris Jozwiak", "tags": ["kagome", "vanderWaals", "monolayer", "flatband"], "image": "https://media.springernature.com/m685/springer-static/image/art%3A10.1038%2Fs41567-026-03492-0/MediaObjects/41567_2026_3492_Fig1_HTML.png", "briefing": {"background": "카고메(kagome) 격자는 기하학적 좌절(frustration)로 인해 플랫 밴드(flat band), 디락 콘(Dirac cone), 그리고 반 호브 특이점(van Hove singularity)을 동시에 가질 수 있어 강상관 물성 연구의 핵심 플랫폼입니다. 특히 플랫 밴드에서는 전자 간 상호작용이 극대화되어 자성이나 초전도와 같은 특이 현상이 나타날 수 있습니다.", "motivation": "기존의 카고메 물질들은 3차원 벌크 특성이 강하거나 층간 결합이 세서 단층(monolayer) 수준에서 플랫 밴드를 제어하기 어려웠습니다. 본 연구는 게이트 전압으로 물성 조절이 용이한 반데르발스(van der Waals) 구조를 가진 단층 카고메 격자를 구현하여 고온 플랫 밴드 물리 연구를 가속화하고자 합니다.", "result": "연구진은 새로운 반데르발스 카고메 물질군을 발견하고, 이것이 단층 극한에서도 고립된(isolated) 플랫 밴드를 유지함을 입증했습니다. 또한 이 플랫 밴드가 게이트 전압을 통해 조절 가능하다는 것을 보여주었습니다.", "implication": "단층 카고메 시스템에서 플랫 밴드를 자유롭게 조절할 수 있게 됨으로써, 고온 초전도, 양자 이상 홀 효과(QAHE) 및 새로운 자성 상태를 정밀하게 탐사할 수 있는 이상적인 실험 장이 마련되었습니다.", "novelty": "독자님이 관심을 가지시는 AV3Sb5 계열 카고메 금속의 연장선상에 있으면서도, 반데르발스 박리가 가능하다는 점과 단층에서도 플랫 밴드 특성이 뚜렷하다는 점이 큰 차별점입니다. 특히 ARPES 전문가인 Chris Jozwiak이 참여하여 밴드 구조의 신뢰성이 높습니다.", "unresolved": "이 단층 시스템에서 실제로 관측될 수 있는 다체 효과(many-body effects)의 구체적인 종류와 강도는 추가적인 저온 실험이 필요해 보입니다.", "future_work": "해당 단층 물질을 이용한 트랜지스터 소자 제작 및 게이트 전압에 따른 저항/자화율 변화 측정, 그리고 극저온에서의 초전도성 탐색이 이어질 것으로 예상됩니다.", "concepts": [{"term": "카고메 격자 (Kagome Lattice)", "why_emerged": "기하학적 구조로 인해 파동함수가 상쇄 간섭을 일으켜 에너지가 일정한 플랫 밴드를 형성할 수 있기 때문입니다.", "origin": "일본의 대나무 바구니 패턴에서 유래되었으며, 고체물리학에서는 시라네(Shirane) 등에 의해 널리 알려짐.", "connections": "AV3Sb5 (A=K, Rb, Cs), 프러스레이티드 자성체, 위상 물질."}, {"term": "플랫 밴드 (Flat Band)", "why_emerged": "전자의 운동 에너지가 극도로 억제되어 전자 간 상호작용이 지배적인 물리 현상을 유도하기 위해 필요합니다.", "origin": "초록 정보만으로는 특정하기 어려우나, 전형적인 격자 모델 연구에서 파생됨.", "connections": "마법 각도 트위스트 이층 그래핀, 강상관 전자계, 비관습적 초전도체."}, {"term": "반데르발스 물질 (van der Waals Materials)", "why_emerged": "층간 결합이 약해 단층으로 박리가 가능하고, 다른 2차원 물질과 적층하여 새로운 이종구조를 만들기 위함입니다.", "origin": "그래핀(Graphene)의 발견 이후 본격적으로 연구됨.", "connections": "원자층 박리, 이종구조 소자, 전이금속 디칼코게나이드(TMD)."}], "english_summary": ["Realization of a new van der Waals kagome material family down to the monolayer limit.", "Demonstrates isolated and gate-tunable flat bands suitable for high-temperature correlated physics.", "Addresses the challenge of creating intrinsic 2D kagome systems with controllable band structures.", "Provides an ideal platform for exploring superconductivity and magnetism in the 2D limit."]}}, {"title": "Time-resolved ARPES in pumped excitonic systems: Floquet physics induced by excitonic fields", "journal": "PRB_Recent", "source": "keyword", "link": "http://link.aps.org/doi/10.1103/18mz-pmgh", "authors": "Amir Eskandari-asl, Adolfo Avella", "last_authors": "Amir Eskandari-asl, Adolfo Avella", "summary": "We develop a theoretical framework based on the dynamical projective operatorial approach (DPOA) to study the time-resolved and angle-resolved photoemission spectroscopy (TR-ARPES) of pumped excitonic systems. Including Coulomb electron-electron interactions at the Hartree-Fock level, our formalism captures the formation of excitonic bound states under the application of pump pulses. Considering a prototypical two-dimensional two-band semiconductor, we analyze the equilibrium phase diagram, which shows the expected transition from a semiconducting to an excitonic-insulator phase as the Coulomb interaction strength or its range increases. Out of equilibrium, we find that when the pump frequency is resonant with an excitonic mode, coherent oscillations of the excitonic order parameter persist after the pump pulse subsides, and they give rise to clear Floquet sidebands in the TR-ARPES spectrum. These exciton-field-induced sidebands are distinct from those originating from the pump laser field. We also identify band-resonance-induced sidebands arising from residual coherences at momenta where the band gap is resonant with the pump frequency. Finally, we analyze the local Coulomb interaction limit. Our results corroborate recent experimental observations of exciton-field-induced Floquet-like sidebands and establish DPOA as an efficient and accurate method for simulating ultrafast phenomena in interacting electron systems.", "tier": "A_MUST_READ", "score": "10", "reason": "title strong match: ARPES", "tags": ["ARPES", "angle-resolvedphotoemission", "photoemission"], "image": "", "briefing": {"background": "빛을 조사하여 물질의 평형 상태를 깨뜨리는 펌프-프로브(pump-probe) 기법은 새로운 위상 상태나 비평형 상전이를 연구하는 핵심 도구입니다. 특히 플로케(Floquet) 공학은 주기적인 빛의 장을 통해 밴드 구조를 재설계하는 기법으로 각광받고 있습니다.", "motivation": "최근 TR-ARPES 실험에서 펌프 광의 진동수와 직접적으로 연결되지 않는 이상한 사이드밴드(sideband)들이 관측되었습니다. 본 논문은 엑시톤(exciton) 결합이 강한 시스템에서 엑시톤 장 자체가 플로케 사이드밴드를 형성할 수 있는지 이론적으로 규명하고자 합니다.", "result": "DPOA(Dynamical Projective Operatorial Approach)를 통해 계산한 결과, 강한 펌프 광에 의해 유도된 엑시톤 오더 파라미터의 결맞은 진동(coherent oscillations)이 TR-ARPES 스펙트럼에서 독특한 플로케 사이드밴드를 생성함을 확인했습니다. 이는 레이저 장에 의한 기존 플로케 상태와는 구별되는 현상입니다.", "implication": "TR-ARPES 데이터 해석 시 단순히 외부 레이저장만 고려할 것이 아니라, 시스템 내부의 상관 관계(엑시톤 등)에 의한 내부 유도 장의 효과를 필수적으로 고려해야 함을 시사합니다.", "novelty": "독자님의 주 관심사인 ARPES 및 플로케 공학에 직접적으로 연관된 연구입니다. 특히 추상적 이론이 아닌, 최근 실험에서 보고된 '엑시톤 유도 플로케' 현상을 설명할 수 있는 정교한 이론적 프레임워크를 제공한다는 점이 중요합니다.", "unresolved": "엑시톤 장 외에 전하 밀도 파동(CDW)이나 다른 보존적 여기(bosonic excitations)들이 유사한 사이드밴드를 형성할 수 있는지에 대한 일반화가 필요합니다.", "future_work": "실제 엑시톤 절연체 후보 물질(예: Ta2NiSe5)의 TR-ARPES 데이터와 본 모델의 직접적인 비교 분석이 수행될 것으로 보입니다.", "concepts": [{"term": "TR-ARPES (Time-resolved ARPES)", "why_emerged": "평형 상태에서 보이지 않는 들뜬 상태의 전자 구조와 에너지 이완 역학을 실시간으로 관찰하기 위해 개발되었습니다.", "origin": "초록 정보만으로는 특정하기 어려움 (초고속 레이저 기술 발전과 결합됨).", "connections": "비평형 동역학, 초고속 상전이, 펌프-프로브 분광학."}, {"term": "플로케 사이드밴드 (Floquet Sidebands)", "why_emerged": "시간 주기에 따른 해밀토니안의 대칭성으로 인해 에너지 축 상에서 복제된 밴드 구조가 나타나는 현상을 설명하기 위함입니다.", "origin": "Gaston Floquet의 수학적 정리에서 유래, 셜리(Shirley) 등에 의해 양자계 도입.", "connections": "광유도 위상 상전이, 플로케 절연체, 주기적 구동계."}, {"term": "엑시톤 절연체 (Excitonic Insulator)", "why_emerged": "전자와 홀 사이의 강한 쿨롱 인력으로 인해 보손 형태의 바닥 상태가 형성되어 절연 특성을 나타내는 상을 설명하기 위함입니다.", "origin": "Mott, Keldysh, Kozlov 등이 1960년대에 제안.", "connections": "Ta2NiSe5, 1T-TiSe2, 전자-홀 응축."}], "english_summary": ["Develops a theoretical framework (DPOA) for TR-ARPES in pumped excitonic systems.", "Predicts Floquet sidebands induced by the coherent oscillation of the excitonic order parameter.", "Distinguishes internal exciton-field-induced sidebands from external laser-field-induced ones.", "Explains recent experimental observations of anomalous sidebands in ultrafast photoemission."]}}, {"title": "Correlation-enhanced electron-phonon coupling in FeSe/SrTiO3 at a magic angle", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/whx6-mq31", "authors": "Qiang Zou, Antik Sihi, Basu Dev Oli, et al.", "last_authors": "Lian Li, Subhasish Mandal", "summary": "Here, the authors combine first-principles dynamical mean-field theory (DMFT), epitaxial materials design, angle-resolved photoemission spectroscopy, and scanning tunneling microscopy/spectroscopy to show that superconductivity in monolayer FeSe/SrTiO 3 is maximized at a magic FeSe 4 tetrahedral angle. They demonstrate that strong electronic correlations, captured by DMFT, substantially enhance electron-phonon coupling within the FeSe layer and produce a superconducting dome. These findings reveal the microscopic origin of enhanced superconductivity thors": "Diego Peña, Jose Ignacio Pascual", "summary": "Scanning tunnelling spectroscopy shows that the fractional spin-1/2 end states of molecular Haldane chains couple differently to a superconducting condensate depending on whether the chain contains an even or odd number of spin-1 triangulene units.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "STS study of spin chains on superconductors; highly relevant to Majorana physics and topological states.", "tags": ["method:STS", "material:superconductor", "topic:Majorana"], "image": "https://media.springernature.com/m685/springer-static/image/art%3A10.1038%2Fs41586-026-11117-y/MediaObjects/41586_2026_11117_Fig1_HTML.png", "briefing": {"background": "초전도체 표면에 자성 불순물이나 체인을 흡착시키면 Yu-Shiba-Rusinov(YSR) 상태가 형성되며, 이들이 결합하여 위상학적 초전도 상태 및 마요라나 구속 상태(Majorana bound states)를 구현하려는 연구가 활발합니다.", "motivation": "분자 수준의 Haldane 스핀 체인을 초전도체 기판 위에 배치했을 때, 스핀 체인의 길이(홀수 vs 짝수)에 따른 스핀 상태의 기하학적 패리티가 초전도체와의 결합 및 마요라나 모드 형성에 어떤 영향을 미치는지 규명하고자 함.", "result": "트리앙굴렌(triangulene) 단위로 구성된 분자 스핀 체인에서, 분자 개수의 홀짝성에 따라 말단 스핀-1/2 상태의 초전도 응축물과의 결합 강도가 다르게 나타남을 STS로 관찰함.", "implication": "분자 단위의 정밀한 조작을 통해 마요라나 구속 상태의 위상학적 보호 특성을 제어하거나 프로그래밍할 수 있는 가능성을 제시함.", "novelty": "기존의 원자 단위 나노선 연구를 넘어, 화학적으로 설계된 분자 체인을 이용해 양자 스핀의 기하학적 패리티가 초전도 위상 물성에 미치는 영향을 직접적으로 증명함.", "unresolved": "이러한 패리티 의존적 결합이 실제 위상학적 비자명한 에너지 갭을 여는 과정에서 노이즈나 환경적 요인에 얼마나 강인한지는 명확하지 않음.", "future_work": "더 긴 스핀 체인을 제작하여 마요라나 파동함수의 중첩이 어떻게 변화하는지 공간 분해능을 높인 STS 연구가 필요함.", "concepts": [{"term": "Haldane 체인", "why_emerged": "정수 스핀 체인의 기저 상태가 갭을 가지며 말단에 자유 스핀이 존재한다는 위상학적 성질을 이해하기 위해 필요.", "origin": "Duncan Haldane (1983)", "connections": "위상학적 정렬, AKLT 모델, 양자 자성체 연구와 연결됨."}, {"term": "Yu-Shiba-Rusinov (YSR) 상태", "why_emerged": "초전도체 내의 자성 불순물이 만드는 국소적인 아갭(in-gap) 상태를 기술하기 위해 필요.", "origin": "Yu (1965), Shiba (1968), Rusinov (1969)", "connections": "마요라나 구속 상태, 초전도체 내 자성체 물성 연구의 기초."}], "english_summary": ["STS study reveals parity-dependent coupling of molecular Haldane spin chains to superconductors.", "Odd vs even number of triangulene units modulates the interaction with the superconducting condensate.", "Provides a platform for controlling Majorana-like states via molecular engineering.", "Demonstrates high-precision manipulation of spin states on superconducting surfaces."]}}, {"title": "Single-stripe magnetic order and bilayer spin dynamics in single-crystalline La3Ni2O7", "journal": "Nature_Materials", "source": "Gemini", "link": "https://www.nature.com/articles/s41563-026-02768-3", "authors": "Lixing Chen, Enkang Zhang, Yiqing Hao, et al.", "last_authors": "Qisi Wang, Jun Zhao", "summary": "Momentum-resolved neutron scattering of a mosaic of single crystals of La3Ni2O7, a parent compound of nickelate superconductors, is reported. The magnetic behaviour of these nickelate crystals is distinct from that of cuprates and furthers our understanding of the origin of superconductivity in this class of materials.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Important neutron scattering study on the magnetic order of new nickelate superconductors.", "tags": ["method:neutron-scattering", "material:La3Ni2O7", "topic:nickelate"], "image": "https://media.springernature.com/m685/springer-static/image/art%3A10.1038%2Fs41563-026-02768-3/MediaObjects/41563_2026_2768_Fig1_HTML.png", "briefing": {"background": "La3Ni2O7은 상압 하에서 높은 임계 온도를 보이는 새로운 니켈 산화물 초전도체 후보 물질로, 구리 산화물(cuprates)과의 유사성과 차별점에 대한 논의가 활발합니다.", "motivation": "La3Ni2O7의 초전도 현상이 스핀 상관관계와 어떻게 연결되어 있는지 이해하기 위해, 모체 화합물(parent compound)의 자기적 질서 구조를 명확히 규명하고자 함.", "result": "중성자 산란 실험을 통해 La3Ni2O7에서 단일 줄무늬(single-stripe) 자기 질서와 이중층(bilayer) 스핀 역학을 관측하여, 기존의 구리 산화물과는 다른 자기적 특성을 확인함.", "implication": "니켈산염 초전도체의 스핀 물성이 구리 산화물 모델(Hubbard 모델 기반)과는 다른 방식으로 작용할 수 있음을 시사하여 초전도 매커니즘 정립의 새로운 근거를 제공함.", "novelty": "단결정 모자이크 샘플을 활용한 운동량 분해 중성자 산란을 통해 니켈산염의 복잡한 자기 구조를 실험적으로 입증함.", "unresolved": "이 단일 줄무늬 자기 질서가 초전도성이 나타나는 고압 환경에서 어떻게 변화하거나 억제되는지에 대한 연결 고리는 추가 연구가 필요함.", "future_work": "고압 조건에서의 : "We reveal a mechanism that may explain the nonmetallic out-of-plane resistivity in layered metals. By carefully examining how the Drude-Boltzmann expression for the c -axis conductivity emerges out of the Kubo formula, we find, besides the standard metallic term proportional to the carrier lifetime τ , a non-Drude contribution proportional to 1 / τ . The Drude behavior breaks down when 1 / τ > 2 η * , the crossover value η * being small (and hence observable) when the c -axis velocities vary rapidly with the distance from the Fermi surface. We consider the Hund metal Sr 2 RuO 4 as a test case, which we study within a realistic dynamical mean-field theory approach. The non-Drude behavior observed experimentally in c -axis transport is reproduced and explained by our considerations, showing that earlier invoked extrinsic mechanisms that involve either impurities or phonons are unnecessary. Although the small value of η * arises from a peculiar accidental cancellation due to destructive interference, characteristic of body-centered tetragonal lattices, we emphasize and discuss the generality of this mechanism.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Explains nonmetallic c-axis transport in layered metals like the unconventional superconductor Sr2RuO4.", "tags": ["theory", "Sr2RuO4", "transport"], "image": "", "briefing": {"background": "층상 구조 금속(layered metals)에서 면외(c-axis) 전기 전도도는 금속성 거동을 보일 것으로 예상되지만, Sr2RuO4와 같은 일부 재료에서는 비금속성(절연체와 유사한) 온도 의존성을 보여 수십 년간 논란이 되어 왔습니다.", "motivation": "기존에는 이러한 비금속성 거동을 설명하기 위해 불순물 산란이나 특정 포논 모드 등 외부적인 요인을 가정해야 했으나, 본 연구는 순수하게 전자 구조와 산란 시간(scattering time)의 관계 내에서 이를 설명하고자 합니다.", "result": "Kubo 공식 내의 Drude-Boltzmann 항 외에도 산란 시간 τ의 역수에 비례하는(1/τ) 비-Drude 성분이 존재함을 발견했습니다. c-축 속도가 페르미 면 근처에서 급격히 변할 때 이 성분이 지배적이 되어 전도도를 감소시킵니다.", "implication": "Sr2RuO4와 같은 Hund 금속의 면외 수송 현상이 외부 잡음 없이도 고유한 전자 구조적 특성만으로 완벽히 설명 가능함을 입증했습니다.", "novelty": "외부적 메커니즘을 배제하고, 결정 격자의 기하학적 특성과 전자 수송의 이론적 한계를 정교하게 연결하여 오래된 수수께끼를 해결했습니다.", "unresol ation of quantum Hall effect breakdown in graphene, a primary interest area.", "tags": ["material", "graphene", "quantumHall"], "image": "", "briefing": {"background": "양자 홀 효과(QHE)는 강한 자기장에서 2차원 전자 시스템의 저항이 양자화되는 현상입니다. 하지만 충분히 큰 전류나 전압이 인가되면 전자들이 에너지를 잃고 상태가 붕괴(Breakdown)되는 현상이 발생하는데, 이를 이해하는 것은 저전력 전자 소자 설계의 핵심입니다.", "motivation": "그래핀은 사이클로트론 갭과 스핀/밸리 갭이 공존하여 에너지 스케일에 따른 QHE 붕괴 메커니즘을 상세히 탐구할 수 있는 최적의 플랫폼입니다. 본 연구는 광대역 여기 조건에서 그래핀의 QHE 붕괴가 어떻게 일어나는지 규명하고자 합니다.", "result": "고이동도 그래핀 Corbino 디바이스를 사용하여 QHE 붕괴가 비옴(Non-Ohmic) 영역에서 옴(Ohmic) 영역으로 전이되는 과정을 실험적으로 관찰했습니다.", "implication": "다양한 에너지 스케일에서의 여기 조건이 어떻게 양자화된 전도 상태를 파괴하는지 정량적으로 밝혀내어, 차세대 그래핀 기반 고주파 소자의 안정성 한계를 이해하는 데 기여합니다.", "novelty": "그래핀의 독특한 에너지 밴드 구조를 이용하여 QHE 붕괴의 전이 과정을 광대역 여기 환경에서 직접 관측했다는 점에서 실험적 가치가 높습니다.", "unresolved": "특정 에너지 스케일에서의 붕괴가 밸리 산란 혹은 스핀 플립 중 어떤 구체적인 미시적 메커니즘에 의해 지배받는지에 대한 명확한 분리는 여전히 과제로 남아 있습니다.", "future_work": "다른 van der Waals 헤테로구조나 모아레 격자 시스템에서의 유사한 QHE 붕괴 연구로 확장하여 밸리/스핀 자유도의 역할을 정밀하게 분리할 것으로 예상됩니다.", "concepts": [{"term": "Corbino geometry", "why_emerged": "홀 효과 측정 시 접촉 저항이나 가장자리 상태의 복잡한 영향을 배제하고 순수한 벌크 전도 현상을 측정하기 위해 고안됨.", "origin": "Orso Mario Corbino (1911년).", "connections": "고전적인 자기저항 측정부터 현대의 양자 홀 효과 정밀 측정에 널리 사용됨."}, {"term": "Quantum Hall Effect (QHE) Breakdown", "why_emerged": "임계 전류 이상의 강한 전기장에서 양자화된 홀 저항이 급격히 사라지는 현상을 규명하여 소자의 한계를 정의하기 위해.", "origin": "Klaus von Klitzing (1980년).", "connections": "Landau 준위, 제너 터널링, 전자 가열 효과와 밀접한 관련이 있음."}], "english_summary": ["Investigated the breakdown of quantum Hall effect in high-mobility graphene.", "Used Corbino geometry to explore the crossover from non-Ohmic to Ohmic transport.", "Identified that broadband excitations significantly influence the stability of the QHE state.", "Provides insight into the dissipation mechanisms in Dirac material-based devices."]}}, {"title": "Néel-Antiferromagnet-Proximitized Superconductivity in the NbSe2/MnPS3 Heterostructures", "journal": "PRL_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/xfg2-227f", "authors": "Xinyi Zheng, Ruihuan Duan, Xilin Feng, et al.", "last_authors": "Guangtong Liu, Li Lu", "summary": "Antiferromagnet-superconductor (AFM-SC) hybrids offer a rich but largely unexplored platform for realizing spin-triplet Cooper pairing and chiral topological superconductivity, yet experimental demonstrations remain scarce. Here, we report the modification of superconductivity in ${\\mathrm{NbSe}}_{2…", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Proximity effects in NbSe2 heterostructures; relevant to TMDs, superconductivity, and topology.", "tags": ["material", "heterostructure", "superconductivity", "TMD"], "image": "", "briefing": {"background": "반강자성체(AFM)와 초전도체(SC)의 이종접합은 스핀 삼중항(Spin-triplet) Cooper 쌍이나 카이랄 위상 초전도성을 유도할 수 있는 매력적인 플랫폼입니다.", "motivation": "NbSe2와 같은 전이금속 디칼코게나이드(TMD)는 이미 풍부한 초전도 물성을 가지며, 이를 AFM 재료인 MnPS3와 결합하여 근접 효과에 의한 새로운 초전도 상태를 탐색하고자 합니다.", "result": "NbSe2/MnPS3 헤테로구조에서 Neel 반강자성체가 NbSe2의 초전도성에 영향을 미치는 현상을 관찰했습니다.", "implication": "이종접합 계면에서 자기적 질서가 초전도 메커니즘을 변조함을 보여주며, 위상 초전도 소자 설계에 중요한 실험적 토대를 제공합니다.", "novelty": "실험적으로 구현하기 어려운 AFM-SC 하이브리드 시스템에서 근접 효과를 직접적으로 제어하고 증명하려는 시도라는 점이 돋보입니다.", "unresolved": "관찰된 초전도 변화가 순수하게 스핀-삼중항에 의한 것인지, 혹은 일반적인 자기적 억제 효과와 어떻게 구분되는지 명확한 분리가 필요합니다.", "future_work": "이러한 이종접합에서의 국소적인 저항 측정이나 터널링 분광법(STS)을 통한 에너지 갭의 공간적 변화 연구가 이어질 것입니다.", "concepts": [{"term": "Proximity Effect", "why_emerged": "초전도체와 비초전도체 사이의 계면에서 파동함수의 중첩을 통해 비초전도체에도 초전도 성질이 나타나는 현상을 설명하기 위해.", "origin": "Meissner and Meissner (1960년대 초반).", "connections": "Andreev 반사(Andreev reflection)와 직접적으로 연결됨."}, {"term": "Spin-triplet Superconductivity", "why_emerged": "일반적인 s-wave 스핀-단일항(singlet) 쌍과 달리, 스핀이 평행한 상태의 쌍을 통해 위상적 성질을 유도하기 위해.", "origin": "Leggett (1975년, 3He 초유체 연구).", "connections": "토폴로지적 절연체 및 Majorana 페르미온 연구와 연결됨."}], "english_summary": ["Explored superconductivity in NbSe2/MnPS3 van der Waals heterostructures.", "Demonstrated the influence of Neel antiferromagnetic order on superconducting properties.", "Provides a platform to investigate spin-triplet Cooper pairing through proximity effects.", "Highlights the potential for engineering topological phases in TMD heterostructures."]}}, {"title": "Revealing the Nature of the Charge Density Wave Order of ErTe3 via Raman Scattering under Anisotropic Strain", "journal": "PRL_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/2ypb-byqq", "authors": "Théotime Freitas, Mattia Udina, Alexandr Alekhin, et al.", "last_authors": "Indranil Paul, Yann Gallais", "summary": "The nature of the charge density wave (CDW) order of the rare-earth tritelluride ${\\mathrm{ErTe}}_{3}$ is investigated by Raman scattering under anisotropic strain. The CDW state of ${\\mathrm{ErTe}}_{3}$ is unconventional since it is accompanied by an unusual mirror symmetry breaking, whose origin r…", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Experimental investigation of unconventional CDW order in a relevant telluride material.", "tags": ["experiment", "ErTe3", "CDW"], "image": "", "briefing": {"background": "희토류 트리텔루라이드(RTe3)는 전형적인 CDW 물질로, 왜곡된 구조와 결합된 특이한 전자 질서로 인해 많은 관심을 받고 있습니다. 특히 이 물질들은 CDW가 대칭성을 깨뜨리는 방식에 대한 논쟁이 많습니다.", "motivation": "ErTe3의 CDW 상태에서 발생하는 비정상적인 거울 대칭성 깨짐의 미시적 원인을 규명하기 위해 외부 응력을 통한 제어 실험을 수행했습니다.", "result": "이방성 변형(anisotropic strain) 하에서의 라만 산란을 통해 ErTe3의 CDW 오더의 성질을 명확히 했습니다. 특히 대칭성 깨짐과 관련된 모드들의 반응을 분석했습니다.", "implication": "CDW 형성의 근본적인 메커니즘이 순수한 페르미 표면 중첩(nesting)을 넘어 격자와의 복잡한 상호작용임을 시사합니다.", "novelty": "응력 제어를 통해 구조적 변형과 CDW 질서 사이의 결합을 분리해냈다는 점에서 기존의 정적인 관측보다 훨씬 깊은 정보를 제공합니다.", "unresolved": "이러한 대칭성 깨짐이 국소적으로 어떤 질서를 가지는지(도메인 문제)와 다른 희토류 물질들과의 정량적 차이는 추가 연구가 필요합니다.", "future_work": "스트레인 유도 CDW 전이 온도 변화 관측 및 유사한 구조를 가진 다른 텔루라이드 계열 물질로의 일반화.", "concepts": [{"term": "Charge Density Wave (CDW)", "why_emerged": "저차원 금속 시스템에서 전자 밀도의 주기적 변조와 함께 격자 변형이 동반되는 상태를 설명하기 위해.", "origin": "Peierls (1955년).", "connections": "위상 절연체 및 고온 초전도체와의 경쟁/협력 관계 연구와 연결됨."}, {"term": "Raman Scattering under Strain", "why_emerged": "재료의 구조적 대칭성 및 포논 모드의 변화를 외부 응력으로 미세하게 조절하여 전자 질서와의 상관관계를 파악하기 위해.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "광학 분광학 및 고압 물리 분야의 발전과 함께 정교해짐."}], "english_summary": ["Investigated the unconventional charge density wave (CDW) order in ErTe3.", "Utilized Raman scattering under anisotropic strain to reveal mirror symmetry breaking.", "Clarified the nature of the CDW phase and its relation to lattice degrees of freedom.", "Provides key experimental evidence for understanding symmetry-breaking in rare-earth tritellurides."]}}, {"title": "Gate-tunable chiral spin mode in WSe2/WS2 moiré superlattices", "journal": "Science", "source": "Gemini", "link": "https://www.science.org/doi/abs/10.1126/science.adq6530?af=R", "authors": "Zhexu Shan, Wenjian Su, Kenji Watanabe, et al.", "last_authors": "Yuanfeng Xu, Yanhao Tang", "summary": "The interplay between many-body and spin-orbit coupling (SOC) effects can lead to previously unobserved phenomena in solids. Chiral spin modes (CSMs) are collective spin excitations that arise from such interplay and connect states with opposite chirality. Here, we report a gate-tunable CSM that occurs between conduction SOC-split minibands in near-0°-twisted WSe 2 /WS 2 bilayers. This mode manifests as a sharp resonance with giant Raman efficiency in the pseudovector-symmetry channel of the Raman spectra. By varying the filling, the CSM transitions from a chiral spin exciton to an excitonic polaron. The spin-flip nature is directly confirmed by the Zeeman effect, and the filling dependence indicates a charge-transfer insulator at unity filling. Our results demonstrate that transition metal–dichalcogenide moiré superlattices are a fertile platform for exploring exotic low-lying collective excitations.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Moiré superlattice experiment on spin modes in vdW heterostructures, highly relevant to user's broader interests.", "tags": ["experiment", "WSe2", "moire"], "image": "", "briefing": {"background": "반데르발스 이종접합의 모아레 초격자는 전자 간의 강한 상관관계와 스핀-궤도 결합(SOC)이 결합된 독특한 물리적 현상을 연구하는 플랫폼을 제공합니다.", "motivation": "WSe2/WS2 이종접합에서 전도대 SOC 분리 미니밴드 사이의 집단적 스핀 들뜸(collective spin excitations) 현상을 규명하고자 함.", "result": "근접 0도 비틀림 각도에서 라만 분광법을 통해 관측된 뾰족한 공명 현상을 통해 '카이랄 스핀 모드(CSM)'를 발견함. 이 모드는 전하 충전 상태에 따라 카이랄 스핀 엑시톤에서 엑시톤 폴라론으로 전이함.", "implication": "모아레 초격자가 스핀 자유도가 제어되는 새로운 양자 다체계 현상을 탐색하는 강력한 도구임을 입증함.", "novelty": "게이트 전압으로 튜닝 가능한 CSM을 최초로 보고하였으며, 제만 효과를 통해 스핀-플립 성질을 명확히 규명함.", "unresolved": "단위 충전 상태에서의 전하 이동 절연체 특성에 대한 구체적인 미시적 메커니즘은 추가 연구가 필요함.", "future_work": "다른 비틀림 각도나 다층 구조에서의 유사한 집단적 들뜸 연구 및 이를 이용한 스핀트로닉스 소자 응용 가능성 탐색.", "concepts": [{"term": "카이랄 스핀 모드 (CSM)", "why_emerged": "SOC가 존재하는 시스템에서 반대 카이랄성을 가진 상태를 연결하는 들뜸을 설명하기 위해 도입됨.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "스핀-궤도 결합, 집단적 들뜸 현상."}, {"term": "모아레 초격자", "why_emerged": "두 2차원 물질을 겹칠 때 생기는 주기적 포텐셜을 통해 물리적 밴드 구조를 엔지니어링하기 위함.", "origin": "MacDonald 등 (2011)에 의해 본격적으로 이론화됨.", "connections": "강상관계 전자계, 엑시톤, 초전도."}], "english_summary": ["Reported gate-tunable chiral spin modes in 0-degree twisted WSe2/WS2 moire superlattices.", "Identified transition between chiral spin exciton and excitonic polaron via filling control.", "Confirmed spin-flip nature of the resonance using the Zeeman effect in Raman spectra.", "Demonstrated the utility of moire superlattices for studying exotic collective spin excitations."]}}, {"title": "Layer-decoupled electronic reconstruction and a robust charge density wave in GdTe3", "journal": "npj_QuantumMaterials", "source": "Gemini", "link": "https://www.nature.com/articles/s41535-026-00946-9", "authors": "Xin Zheng, Yunbo Wu, Tongrui Li, et al.", "last_authors": "Shengtao Cui, Zhe Sun", "summary": "Layer-decoupled electronic reconstruction and a robust charge density wave in GdTe 3", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Relevant charge density wave study in a material often characterized by electronic structure tool function appendLabeledText(parent, className, label, text) { if (!text) return; const el = document.createElement('p'); el.className = className; const strong = textEl('strong', '', label); el.appendChild(strong); el.append(text); parent.appendChild(el); }
function appendBriefSection(parent, title, text, wide = false) { if (!text) return; const section = document.createElement('section'); section.className = 'brief-section' + (wide ? ' wide' : ''); section.appendChild(textEl('h2', '', title)); section.appendChild(textEl('p', '', text)); parent.appendChild(section); }
function render() {
  slideEl.replaceChildren();
  if (!slides.length) { slideEl.className = 'empty'; slideEl.textContent = 'No papers passed the filters in this run.'; counterEl.textContent = '0 / 0'; prevBtn.disabled = true; nextBtn.disabled = true; return; }
  slideEl.className = 'slide';
  const r = slides[index];
  const b = r.briefing || {};
  const head = document.createElement('div');
  head.className = 'paper-head';
  if (r.image) {
    const figure = document.createElement('figure');
    figure.className = 'figure';
    const img = document.createElement('img');
    img.src = r.image; img.alt = 'Figure or article preview image'; img.loading = 'lazy'; img.referrerPolicy = 'no-referrer'; img.onerror = () => figure.remove();
    figure.appendChild(img);
    figure.appendChild(textEl('figcaption', '', 'Figure / article preview image from the source page'));
    head.appendChild(figure);
  }
  const headText = document.createElement('div');
  headText.className = 'head-text';
  const badges = document.createElement('div');
  badges.className = 'badges';
  if (r.score) badges.appendChild(textEl('span', 'badge score', `${r.score}/10`));
  if (r.tier) badges.appendChild(textEl('span', 'badge', r.tier));
  if (r.journal) badges.appendChild(textEl('span', 'badge', r.journal));
  if (r.source) badges.appendChild(textEl('span', 'badge', r.source));
  headText.appendChild(badges);
  const title = document.createElement('h1');
  if (r.link) { const titleLink = document.createElement('a'); titleLink.href = r.link; titleLink.target = '_blank'; titleLink.rel = 'noopener noreferrer'; titleLink.textContent = r.title || ''; title.appendChild(titleLink); }
  else { title.textContent = r.title || ''; }
  headText.appendChild(title);
  headText.appendChild(textEl('p', 'meta', [r.journal, r.source].filter(Boolean).join(' | ')));
  if (r.last_authors || r.authors) { const authors = document.createElement('p'); authors.className = 'authors'; if (r.last_authors) authors.append('Last authors: ' + r.last_authors); if (r.authors) authors.append((r.last_authors ? ' | ' : '') + 'Authors: ' + r.authors); headText.appendChild(authors); }
  appendLabeledText(headText, 'why', 'Filter reason: ', r.reason);
  if (r.tags && r.tags.length) { const tags = document.createElement('div'); tags.className = 'tags'; r.tags.forEach(tag => tags.appendChild(textEl('span', 'tag', '#' + tag))); headText.appendChild(tags); }
  if (r.link) { const link = document.createElement('a'); link.className = 'link'; link.href = r.link; link.target = '_blank'; link.rel = 'noopener noreferrer'; link.textContent = 'Open paper'; headText.appendChild(link); }
  head.appendChild(headText);
  if (r.summary) { const abstract = document.createElement('p'); abstract.className = 'original-abstract'; const strong = textEl('strong', '', 'Original abstract'); abstract.appendChild(strong); abstract.append(r.summary); head.appendChild(abstract); }
  slideEl.appendChild(head);
  const briefing = document.createElement('div');
  briefing.className = 'briefing';
  appendBriefSection(briefing, 'Background', b.background);
  appendBriefSection(briefing, 'Motivation', b.motivation);
  appendBriefSection(briefing, 'Result', b.result);
  appendBriefSection(briefing, 'Implication', b.implication);
  appendBriefSection(briefing, "Why it's important / Novelty", b.novelty);
  appendBriefSection(briefing, 'Unresolved Questions', b.unresolved);
  appendBriefSection(briefing, 'Expected Future Work', b.future_work);
  if (b.concepts && b.concepts.length) {
    const section = document.createElement('section');
    section.className = 'brief-section wide';
    section.appendChild(textEl('h2', '', 'Concepts / Terms'));
    const concepts = document.createElement('div');
    concepts.className = 'concepts';
    b.concepts.forEach(c => {
      const item = document.createElement('div');
      item.className = 'concept';
      item.appendChild(textEl('h3', '', c.term || 'Concept'));
      [['왜 생겼나: ', c.why_emerged], ['누가 만들었나: ', c.origin], ['연결되는 흐름: ', c.connections]].forEach(([label, text]) => { if (!text) return; const p = document.createElement('p'); const bold = textEl('b', '', label); p.appendChild(bold); p.append(text); item.appendChild(p); });
      concepts.appendChild(item);
    });
    section.appendChild(concepts);
    briefing.appendChild(section);
  }
  if (b.english_summary && b.english_summary.length) { const section = document.createElement('section'); section.className = 'brief-section wide'; section.appendChild(textEl('h2', '', 'English Summary')); const ul = document.createElement('ul'); b.english_summary.slice(0, 5).forEach(line => ul.appendChild(textEl('li', '', line))); section.appendChild(ul); briefing.appendChild(section); }
  slideEl.appendChild(briefing);
  counterEl.textContent = `${index + 1} / ${slides.length}`;
  prevBtn.disabled = index === 0;
  nextBtn.disabled = index === slides.length - 1;
}
prevBtn.addEventListener('click', () => { index = Math.max(0, index - 1); render(); });
nextBtn.addEventListener('click', () => { index = Math.min(slides.length - 1, index + 1); render(); });
document.addEventListener('keydown', event => { if (event.key === 'ArrowLeft') prevBtn.click(); if (event.key === 'ArrowRight') nextBtn.click(); });
render();
</script>
</body>
</html>
