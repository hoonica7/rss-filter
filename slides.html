<!DOCTYPE html>

<meta name='viewport' content='width=device-width, initial-scale=1.0'>
<title>Daily Paper Slideshow</title>
<style>
  :root {
    color-scheme: light;
    --bg: #f6f7f4;
    --paper: #ffffff;
    --ink: #111827;
    --muted: #64748b;
    --line: #d8ddd2;
    --accent: #176b87;
    --accent-2: #9a3412;
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; overflow: auto; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: var(--bg); color: var(--ink); }
  .shell { max-width: 1500px; min-height: 100vh; margin: 0 auto; padding: 14px 18px; display: flex; flex-direction: column; }
  .topbar { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 16px; }
  .top-actions { display: flex; align-items: center; gap: 10px; }
  .topbar a, button { border: 1px solid var(--line); border-radius: 8px; background: var(--paper); color: var(--ink); padding: 10px 14px; font-weight: 700; text-decoration: none; cursor: pointer; }
  button.primary { background: var(--accent); border-color: var(--accent); color: white; }
  button:disabled { opacity: 0.45; cursor: not-allowed; }
  .counter { color: var(--muted); font-weight: 700; }
  .slide { min-height: calc(100vh - 82px); background: var(--paper); border: 1px solid var(--line); border-radius: 10px; padding: 18px; box-shadow: 0 18px 42px rgba(15, 23, 42, 0.10); display: grid; grid-template-columns: minmax(310px, 0.86fr) minmax(0, 1.55fr); gap: 18px; overflow: visible; }
  .paper-head { min-width: 0; min-height: 0; overflow: visible; display: flex; flex-direction: column; gap: 12px; }
  .figure { margin: 0; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: #f8fafc; }
  .figure img { display: block; width: 100%; max-height: 41vh; object-fit: contain; background: white; }
  .figure figcaption { padding: 7px 10px; color: var(--muted); font-size: 12px; line-height: 1.3; }
  .head-text { display: flex; flex-direction: column; gap: 9px; min-width: 0; }
  .badges { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .badge { border-radius: 999px; padding: 5px 9px; background: #eef2ff; color: #3730a3; font-size: 12px; font-weight: 800; }
  .score { background: #fee2e2; color: #991b1b; }
  h1 { margin: 0; font-size: 25px; line-height: 1.15; letter-spacing: 0; overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
  h1 a { color: inherit; text-decoration-color: rgba(23, 107, 135, 0.35); text-decoration-thickness: 2px; text-underline-offset: 4px; }
  h1 a:hover { color: var(--accent); text-decoration-color: var(--accent); }
  .meta, .authors, .why, .abstract { font-size: 13px; line-height: 1.45; }
  .meta, .authors { color: var(--muted); }
  .why strong, .abstract strong, .authors strong { color: var(--ink); }
  .authors { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .why { border-left: 4px solid var(--accent-2); padding-left: 10px; color: #374151; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .abstract { border-top: 1px solid var(--line); padding-top: 14px; color: #374151; }
  .original-abstract { border-top: 1px solid var(--line); padding-top: 10px; color: #374151; font-size: 11.5px; line-height: 1.35; overflow-wrap: anywhere; }
  .original-abstract strong { display: block; margin-bottom: 4px; color: var(--ink); }
  .tags { display: flex; flex-wrap: wrap; gap: 8px; }
  .tag { border-radius: 999px; padding: 4px 8px; background: #f1f5f9; color: #475569; font-size: 12px; font-weight: 700; }
  .head-text > .link { display: none; }
  .briefing { min-width: 0; min-height: 0; overflow: visible; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); grid-auto-rows: minmax(0, auto); align-content: start; gap: 11px 18px; border-top: 0; padding-top: 0; }
  .brief-section { min-width: 0; }
  .brief-section.wide { grid-column: 1 / -1; }
  .brief-section h2 { margin: 0 0 4px; font-size: 14px; line-height: 1.22; color: #0f766e; letter-spacing: 0; }
  .brief-section p, .brief-section li { margin: 0; font-size: 12.5px; line-height: 1.42; color: #1f2937; overflow-wrap: anywhere; }
  .brief-section ul { margin: 0; padding-left: 20px; }
  .concepts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 9px 14px; }
  .concept { border-top: 1px solid var(--line); padding-top: 7px; }
  .concept h3 { margin: 0 0 4px; font-size: 13px; color: #7c2d12; letter-spacing: 0; }
  .concept p { margin: 2px 0 0; font-size: 11.5px; line-height: 1.35; color: #374151; overflow-wrap: anywhere; }
  .concept b { color: #111827; }
  .link { color: var(--accent); font-weight: 800; text-decoration: none; }
  .empty { padding: 48px; background: var(--paper); border: 1px solid var(--line); border-radius: 12px; color: var(--muted); }
  @media (max-width: 860px) {
    .shell { padding: 14px; }
    .topbar, .top-actions { align-items: stretch; flex-direction: column; }
    .slide, .briefing, .concepts { grid-template-columns: 1fr; }
    .slide { min-height: auto; overflow: visible; display: grid; }
    h1 { font-size: 28px; }
  }
</style>

<script>
const slides = [{"title": "Complex Magnetic Phases and Unconventional Skyrmion Thermodynamics in Magnetically Intercalated Cr1+xTe2Compounds", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2610.00877", "authors": "Clayton Conner, Santosh Karki Chhetri, Avinash Sah, et al.", "last_authors": "Zheng Gai, Guang Bian", "summary": "Chemical intercalation provides a powerful route for tuning the electronic and magnetic properties of transition metal dichalcogenides (TMDs), enabling the emergence of magnetic phases and phenomena that are otherwise inaccessible in their pristine forms. Here, we investigate the structural, electronic, and magnetic properties of magnetically intercalated Cr$_{1+x}$Te$_2$ through a combination of scanning tunneling microscopy, angle-resolved photoemission spectroscopy, magnetization, electrical transport, and Lorentz transmission electron microscopy measurements. We uncover a rich magnetic phase diagram comprising paramagnetic, in-plane spin-fluctuation, out-of-plane ferromagnetic, and field-induced N\\'eel-type skyrmion phases. In particular, Lorentz transmission electron microscopy directly reveals the formation of N\\'eel-type skyrmion textures slightly below the Curie temperature, with their configurations evolving strongly with temperature and magnetic field. The skyrmions exhibit pronounced thermal hysteresis and coexist with stripe domains, indicative of a complex magnetic energy landscape arising from the competition among disorder-induced local Dzyaloshinskii-Moriya interactions, perpendicular magnetic anisotropy, and dipolar interactions. Our results demonstrate that chemical intercalation can profoundly reshape the magnetic interactions and phase behavior of TMDs, establishing Cr$_{1+x}$Te$_2$ as a versatile platform for exploring tunable magnetism, skyrmion physics, and unconventional thermodynamic phenomena in low-dimensional quantum materials.", "tier": "A_MUST_READ", "score": "10", "reason": "Direct ARPES and STM investigation of magnetic phases in an intercalated TMD compound.", "tags": ["experiment", "ARPES", "STM", "TMD", "magnetism"], "image": "https://arxiv.org/html/2610.00877v2/Fig1_new.png", "briefing": {"background": "전이금속 디칼코게나이드(TMD)는 층상 구조 덕분에 층 사이로 외부 원자를 삽입(Intercalation)하여 물성을 조절하기에 매우 유리한 시스템입니다. 특히 자성 원자를 삽입할 경우 기존의 비자성 또는 단순 자성 TMD에서 볼 수 없었던 복잡한 자기 토폴로지나 위상학적 현상을 유도할 수 있어 활발히 연구되고 있습니다.", "motivation": "본 연구는 Cr이 과잉 삽입된 Cr_{1+x}Te_2 화합물에서 삽입된 원자가 구조적, 전자적, 그리고 자기적 상태를 어떻게 변화시키는지, 특히 스커미온(Skyrmion)과 같은 복잡한 자기 상태가 생성될 수 있는지를 규명하고자 했습니다.", "result": "STM과 ARPES를 통해 전자 구조를 확인하고, Lorentz TEM(LTEM)을 통해 큐리 온도 직하에서 Neel-type 스커미온 격자를 직접 관찰했습니다. 상자성, 면내 스핀 요동, 수직 강자성, 그리고 자기장 유도 스커미온 상이 공존하는 복잡한 자기 상태도를 구축하였으며, 이는 국소적인 Dzyaloshinskii-Moriya 상호작용(DMI)과 수직 자기 이방성 사이의 경쟁에 기인함을 밝혔습니다.", "implication": "화학적 삽입이 TMD의 자기 상호작용을 근본적으로 재편할 수 있음을 보여주며, Cr_{1+x}Te_2가 조절 가능한 스커미온 물리 및 저차원 양자 자성을 연구하기 위한 다기능 플랫폼임을 입증했습니다.", "novelty": "독자의 주요 관심사인 ARPES와 STM을 사용하여 자성 TMD의 전자 구조를 직접 측정했을 뿐만 아니라, LTEM을 결합하여 자성 구조의 실공간 거동을 스커미온 수준에서 연결했다는 점이 중요합니다. 자성 위상 물질 연구 맥락에서 매우 높은 가치가 있습니다.", "unresolved": "삽입된 Cr 원자의 양(x)에 따른 스커미온 크기와 안정성의 정밀한 상관관계, 그리고 스커미온의 동역학적 특성에 대한 추가적인 실시간 관찰이 필요합니다.", "future_work": "전류나 전기장을 이용한 스커미온 제어 실험, 그리고 삽입 농도에 따른 위상 홀 효과(Topological Hall Effect)의 체계적인 측정이 기대됩니다.", "concepts": [{"term": "스커미온 (Skyrmion)", "why_emerged": "소용돌이 형태의 안정한 자기 구조를 통해 차세대 저전력 메모리 및 스핀트로닉스 소자를 구현하기 위해 등장했습니다.", "origin": "Tony Skyrme (입자물리학 모델), 이후 강자성체에서 스핀 텍스처로 확장됨", "connections": "Dzyaloshinskii-Moriya 상호작용(DMI), 위상 홀 효과, 수직 자기 이방성(PMA)"}, {"term": "삽입 (Intercalation)", "why_emerged": "층상 물질의 격자 사이에 원자를 넣어 전하 밀도를 조절하거나 새로운 대칭성을 깨뜨려 물성을 튜닝하기 위해 사용됩니다.", "origin": "초록 정보만으로는 특정하기 어려움 (화학적 공정)", "connections": "TMD, 도핑, 흑연 층간 화합물(GIC)"}, {"term": "Lorentz TEM (LTEM)", "why_emerged": "나노미터 스케일에서 자기 도메인이나 스커미온과 같은 국소적인 자기 구조를 직접 시각화하기 위해 필요합니다.", "origin": "초록 정보만으로는 특정하기 어려움 (전자현미경 기술)", "connections": "스커미온 텍스처, 자기 구역 벽(Domain Wall), 투과 전자 현미경"}, {"term": "Dzyaloshinskii-Moriya 상호작용 (DMI)", "why_emerged": "반전 대칭성이 깨진 시스템에서 스핀들이 서로 수직이 되게 하여 스커미온 같은 비공선형 자기 구조를 만들기 위해 필요합니다.", "origin": "Igor Dzyaloshinskii, Toru Moriya", "connections": "스핀-궤도 결합, 스커미온 안정성, 카이랄 자성체"}], "english_summary": ["Discovery of a complex magnetic phase diagram in Cr-intercalated Cr1+xTe2 using ARPES, STM, and LTEM.", "Direct observation of Neel-type skyrmions and their evolution with temperature and magnetic field.", "Identified competition between local DMI and magnetic anisotropy as the origin of the complex energy landscape.", "Demonstrates chemical intercalation as a powerful tool for engineering skyrmion physics in 2D TMDs."]}}, {"title": "Direct view of exciton and carrier dynamics in twisted bilayer graphene", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2610.17984", "authors": "Gianmarco Gatti, Anders S. Mortensen, Zhihao Jiang, et al.", "last_authors": "Ulrich Starke, Philip Hofmann", "summary": "Twisted bilayer graphene (tBLG) on H-intercalated SiC (twist angle of $9 \\pm 1^{\\circ}$) is studied by position\\mbox{-}, time\\mbox{-}, and angle-resolved photoemission spectroscopy (ARPES). Both graphene layers are hole doped, with a Dirac-point offset of 30~meV. Time-resolved ARPES near the van Hove singularity reveals a spectral feature within the hybridization-induced band gap, together with excited electrons in the conduction band. The in-gap feature exhibits distinct dynamics, and its binding energy and $k$-space location are consistent with the proposed non-hydrogenic ``ghost-Fano'' exciton arising from destructive interference between two nearly degenerate excitonic channels. Near the Dirac points, the twist separates the largely layer-polarized Dirac cones in momentum space, providing direct layer selectivity. We find markedly different peak electronic temperatures in the two graphene layers, even though their subsequent cooling dynamics are very similar. We attribute this to an ultrafast interlayer redistribution of electronic energy, driven by an interlayer electric field that arises from the different doping in the layers.", "tier": "A_MUST_READ", "score": "10", "reason": "Direct hit: uses time-resolved ARPES to study electronic structure and excitons in twisted bilayer graphene.", "tags": ["ARPES", "material:graphene", "topic:twisted-bilayer"], "image": "https://arxiv.org/html/2610.17984v1/TBG_Fig1_v6_grs4.png", "briefing": {"background": "비틀린 이층 그래핀(tBLG)은 두 층 사이의 비틀림 각도에 따라 밴드 구조가 혼성(hybridization)되어 모아레 초격자나 평탄 밴드(flat band) 등 독특한 양자 현상을 나타냅니다. 특히 이러한 밴드 구조의 변화는 엑시톤(exciton)과 같은 다체 상호작용의 동역학에 큰 영향을 미칩니다.", "motivation": "tBLG의 밴드 갭 및 혼성 영역에서 발생하는 엑시톤과 전하 운반자의 동역학을 운동량 공간(k-space)에서 직접 관찰하고, 층별 선택적인 에너지 이완 과정을 이해하고자 했습니다.", "result": "시간 분해 ARPES(tr-ARPES)를 통해 van Hove 특이점 근처에서 'ghost-Fano' 엑시톤으로 추정되는 갭 내 신호를 발견했습니다. 또한, 두 그래핀 층의 도핑 농도 차이로 인해 발생하는 층간 전기장이 초고속 에너지 재분배를 유도하여, 두 층의 초기 전자 온도가 확연히 다르게 나타남을 확인했습니다.", "implication": "층간 에너지 전달 메커니즘이 단순한 산란을 넘어 전기장에 의해 구동될 수 있음을 시사하며, tBLG의 광전자 소자 응용 시 층별 동역학 제어의 중요성을 보여줍니다.", "novelty": "tr-ARPES를 사용하여 tBLG의 층 선택적 정보를 추출하고, 이론적으로만 제시되었던 ghost-Fano 엑시톤의 실험적 증거를 k-space에서 직접 제시했다는 점이 매우 독보적입니다.", "unresolved": "비틀림 각도에 따른 엑시톤 수명의 변화 및 다양한 도핑 수준에서의 층간 전기장 효과의 정밀한 세기가 아직 완전히 정량화되지 않았습니다.", "future_work": "매직 각도(Magic angle) 근처에서의 엑시톤 동역학 측정 및 외부 게이트 전압을 이용한 층간 전기장 제어 실험이 가능할 것으로 보입니다.", "concepts": [{"term": "Ghost-Fano 엑시톤", "why_emerged": "거의 축퇴된 두 개의 엑시톤 채널 사이의 상쇄 간섭으로 발생하는 독특한 광학적/전자적 응답을 설명하기 위해 도입되었습니다.", "origin": "최근 이론 연구에서 제안됨 (U. Starke 연구그룹 등)", "connections": "Fano 공명, 엑시톤 절연체, 다체 간섭"}, {"term": "시간 분해 ARPES (tr-ARPES)", "why_emerged": "전자 구조의 평형 상태뿐만 아니라 펌프 레이저 조사 후의 초고속 여기 상태 및 이완 과정을 관찰하기 위해 개발되었습니다.", "origin": "초록 정보만으로는 특정하기 어려움 (레이저 기술 결합)", "connections": "초고속 동역학, 전자-음향자 결합, 엑시톤 형성 관찰"}, {"term": "van Hove 특이점 (vHs)", "why_emerged": "상태 밀도(DOS)가 발산하는 지점으로, 초전도나 엑시톤 형성과 같은 상호작용 효과를 극대화하는 지점입니다.", "origin": "Léon van Hove", "connections": "상태 밀도 발산, 모아레 평탄 밴드, 다체 불안정성"}, {"term": "층 선택성 (Layer Selectivity)", "why_emerged": "이층 구조에서 각 층이 가진 고유한 물성이나 도핑 상태를 분리해서 이해하기 위해 운동량 공간에서의 분리 기술이 필요합니다.", "origin": "초록 정보만으로는 특정하기 어려움 (ARPES 기법)", "connections": "Valleytronics, 층간 분극, 이중층 헤테로 구조"}], "english_summary": ["Direct visualization of exciton and carrier dynamics in twisted bilayer graphene (9-degree twist) using tr-ARPES.", "Identified a 'ghost-Fano' exciton feature within the hybridization-induced band gap.", "Observed distinct peak electronic temperatures between layers despite similar cooling rates, driven by an interlayer electric field.", "Demonstrates layer-specific energy redistribution mechanisms in moire systems."]}}, {"title": "Enhancing Quasi-Two-Dimensional Electronic Structure in Bi2O2Se via Chlorine Substitution (Advanced Science (2026): e77919)", "journal": "arXiv_CondMat", "source": "author whitelist", "link": "https://arxiv.org/abs/2610.14619", "authors": "Yong-Zhen Jiang, Qi-Xun Wen, Xiang Xu, et al.", "last_authors": "Yang-Yang Lv, Cheng Chen", "summary": "Bismuth oxyselenide (Bi2O2Se) has emerged as a leading semiconductor candidate for next-generation electronics and quantum phenomena research. However, its strong ionic interlayer bonding of Se layers fundamentally restricts the full potential of this otherwise promising quasi-two-dimensional (2D) material. In this work, we demonstrate chlorine substitution as an effective strategy to introduce van der Waals gaps and modify the electronic structure of the system. Through comprehensive transport and angle-resolved photoemission spectroscopy (ARPES) measurements on Bi6O6Se2Cl2 single crystal, an optimal Cl-doping compound, we show that the key electronic features, including indirect band gap, high electron mobility, and carrier effective mass, are well preserved, while the 2D character of the system is sufficiently enhanced. First-principles calculations attribute this selective tunability to the unique spatial separation between conductive Bi-O layers and dopant Se/Cl layers, which enables independent optimization of interlayer coupling and intralayer transport. Remarkably, our theoretical calculations combined with experimental observations project a broad bandgap engineering across a wide range (0.8 ~ 3.5 eV) within the Bi2O2Se system. Our findings not only expand the application potential of Bi2O2Se-based materials in optoelectronics, nanoelectronics, and fundamental research but also highlight spatial decoupling as a viable strategy for modifying detailed electronic structure of quasi-2D quantum systems.", "tier": "A_MUST_READ", "score": "10", "reason": "author whitelist: Yu-Lin Chen", "tags": ["ARPES", "angle-resolvedphotoemission", "photoemission", "vanderWaals", "transport"], "image": "https://arxiv.org/static/browse/0.3.4/images/arxiv-logo-fb.png", "briefing": {"background": "Bi2O2Se는 높은 전자 이동도와 공기 중 안정성 덕분에 차세대 반도체로 주목받고 있지만, 층 사이의 강력한 이온 결합 때문에 완전한 van der Waals(vdW) 물질로서의 특성을 발휘하는 데 한계가 있었습니다.", "motivation": "Se 자리에 Cl을 치환하여 층간 결합을 약화시키고 vdW 갭을 도입함으로써, Bi2O2Se의 고유한 장점(고이동도 등)은 유지하면서 2차원성을 강화하고 밴드갭을 조절하고자 했습니다.", "result": "Cl 치환을 통해 Bi6O6Se2Cl2 단결정을 합성하였으며, ARPES 측정을 통해 이 시스템이 여전히 높은 전자 이동도와 작은 유효 질량을 유지하면서도 강화된 2차원 전자 구조를 가짐을 확인했습니다. 또한, 0.8 eV에서 3.5 eV까지 넓은 범위의 밴드갭 엔지니어링이 가능하다는 계산 결과를 얻었습니다.", "implication": "Bi2O2Se 계열 물질이 기존 반도체 소자를 넘어 광전자 및 나노 전자 공학 분야에서 vdW 헤테로 구조의 핵심 소재로 활용될 가능성을 높였습니다.", "novelty": "전도층(Bi-O)과 도핑층(Se/Cl)의 공간적 분리(Spatial Decoupling)를 통해 층간 결합과 층내 수송 특성을 독립적으로 제어할 수 있다는 전략을 ARPES로 직접 검증했다는 점이 돋보입니다. (저자 리스트 중 Yu-Lin Chen은 독자의 주요 관심 저자임)", "unresolved": "Cl 치환 농도에 따른 수송 특성의 극한적인 변화와 대면적 박막 제작 시의 안정성 확보 문제가 남아 있습니다.", "future_work": "Cl 치환된 Bi2O2Se를 기반으로 한 고성능 field-effect transistor(FET) 제작 및 다른 vdW 물질과의 적층을 통한 소자 특성 연구가 기대됩니다.", "concepts": [{"term": "반데르발스 갭 (van der Waals gap)", "why_emerged": "층상 물질에서 원자층 사이를 물리적으로 쉽게 박리하고 다른 물질과 적층하기 위해 필수적인 구조적 특징입니다.", "origin": "Johannes Diderik van der Waals", "connections": "박리(Exfoliation), 2D 소재, 헤테로 구조"}, {"term": "공간적 분리 (Spatial Decoupling)", "why_emerged": "전하 수송이 일어나는 경로와 불순물/도핑이 일어나는 경로를 분리하여 이동도 저하 없이 물성을 조절하기 위해 도입된 전략입니다.", "origin": "초록 정보만으로는 특정하기 어려움 (반도체 물리 전략)", "connections": "변조 도핑(Modulation doping), 이동도 향상, 층상 구조"}, {"term": "밴드갭 엔지니어링 (Bandgap Engineering)", "why_emerged": "소자의 동작 파장이나 전압 특성을 최적화하기 위해 반도체의 밴드갭을 인위적으로 조절하기 위해 필요합니다.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "합금화(Alloying), 화학적 치환, 광전 소자"}, {"term": "유효 질량 (Effective Mass)", "why_emerged": "결정 내 전자의 운동을 진공 중의 자유 전자처럼 단순하게 기술하기 위해 밴드 곡률을 질량 개념으로 치환한 것입니다.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "이동도(Mobility), 상태 밀도, ARPES 곡률"}], "english_summary": ["Enhanced quasi-2D character in Bi2O2Se through Cl substitution to introduce van der Waals gaps.", "ARPES confirming preservation of high electron mobility and carrier effective mass despite chemical modification.", "Demonstrated bandgap tunability from 0.8 to 3.5 eV via spatial decoupling of conductive and dopant layers.", "Positions Bi2O2Se-based materials as versatile candidates for next-generation vdW optoelectronics."]}}, {"title": "Framework for an AI-Ready ARPES Community Database", "journal": "arXiv_CondMat", "source": "keyword", "link": "https://arxiv.org/abs/2610.15236", "authors": "Zhi-Xun Shen, Jin Gene Wong, Karen Lei, et al.", "last_authors": "Ming Yi, Timothy Zaklama", "summary": "Condensed matter stands to gain profoundly from widespread adoption of artificial intelligence (AI). However, its current means of data organization impedes this endeavor. As a premier measure of electronic structure underlying material properties, Angle-Resolved Photoemission Spectroscopy (ARPES) has accumulated over four decades of spectra, yet the community's publication-centered workflow preserves only a highly selected fraction of its experimental record. A shared data ecosystem could transform these fragmented measurements and their contexts into a persistent, collective scientific memory, creating immediate value for reproducibility and reuse while laying the foundation for AI-enabled discovery. In this Perspective, we report outcomes of a recent community workshop and propose a practical path toward such an ecosystem. Its benefits unfold along three timescales. In the near term, standardized, searchable, and citable datasets strengthen analysis pipelines independently of AI. In the intermediate future, community-validated tools operating across laboratories could enable broader reuse and increasingly closed-loop automated experiments. In the long term, a diverse corpus of measured electronic spectra could support foundation models for quantum matter. Looking forward, a diverse corpus of measured electronic spectra could support foundation models for quantum matter and new discoveries. We discuss lessons from existing scientific databases, the current state of AI in ARPES, as well as areas of community convergence on data organization, access, credit, governance, and a staged pilot program.", "tier": "A_MUST_READ", "score": "10", "reason": "title strong match: ARPES", "tags": ["ARPES", "angle-resolvedphotoemission", "photoemission"], "image": "https://arxiv.org/static/browse/0.3.4/images/arxiv-logo-fb.png", "briefing": {"background": "ARPES는 고체 전자 구조를 직접적으로 측정하는 핵심 도구로 지난 수십 년간 막대한 데이터를 축적해 왔으나, 연구실마다 데이터 형식이 다르고 출판 중심의 관습으로 인해 원천 데이터의 공유와 재사용이 극히 제한적이었습니다.", "motivation": "최근 AI/머신러닝 기술이 급전하면서 고체물리학 분야에서도 이를 활용한 발견이 기대되지만, ARPES 데이터의 파편화된 상태는 AI 모델 학습과 데이터 주도형 과학(Data-driven science)으로의 전환을 가로막고 있습니다.", "result": "Z-X Shen, Ming Yi 등 ARPES 분야의 주요 연구자들이 모여 커뮤니티 기반의 통합 데이터베이스 프레임워크를 제안했습니다. 데이터 표준화, 검색 가능성, 인용 가능성을 확보하고, 나아가 연구실 간 경계를 넘는 자동화된 실험 및 양자 물질 전용 AI 파운데이션 모델 구축을 위한 단계적 로드맵을 제시했습니다.", "implication": "이 프레임워크가 정착되면 실험 결과의 재현성이 획기적으로 향상되고, 개별 연구자가 수행하기 어려운 대규모 데이터 분석이 가능해져 새로운 양자 물질 발견의 속도가 빨라질 것입니다.", "novelty": "ARPES 기술 자체의 발전이 아닌, ARPES 커뮤니티 전체의 연구 수행 방식(workflow)을 AI 친화적으로 개편하려는 최초의 조직적 시도라는 점이 중요합니다. 독자께서 ARPES 데이터를 다루는 방식에 근본적 변화를 줄 수 있는 이정표적 성격의 논문입니다.", "unresolved": "데이터 공유에 따른 연구자의 권리(Credit) 보호 문제, 각기 다른 기기 특성을 어떻게 표준화하여 정규화할 것인지에 대한 기술적 합의가 여 ent an angle-resolved photoemission spectroscopy and density functional theory study of Co 1/4 TaSe 2 , a compound we identify as a layered altermagnetic material. Magnetic susceptibility measurements confirm type-A antiferromagnetic ordering with a Néel temperature of 178 K. Our spin-resolved and spin-integrated angle-resolved photoemission spectroscopy measurements reveal an electronic band structure in excellent agreement with density functional theory calculations, demonstrating clear signatures of altermagnetic spin splitting at the Fermi surface. Furthermore, temperature-dependent angle-resolved photoemission spectroscopy reveals a reconstructed valence band structure, with observable band shifts upon heating above the Néel temperature, consistent with the suppression of altermagnetic order. These findings establish Co 1/4 TaSe 2 as a promising platform for exploring altermagnetic phenomena.", "tier": "A_MUST_READ", "score": "10", "reason": "Direct hit: ARPES observation of altermagnetic spin splitting in a real material Co1/4TaSe2.", "tags": ["ARPES", "altermagnetism", "TMD", "electronicstructure"], "image": "https://arxiv.org/html/2508.12985v2/Sprague_Figure_1.jpg", "briefing": {"background": "알터마그네티즘(Altermagnetism)은 강자성(순 자화 존재)과 반강자성(순 자화 0)의 특성을 동시에 갖는 새로운 자성 상태로, 실공간에서는 자화가 상쇄되지만 운동량 공간에서는 스핀 분열(Spin splitting)이 나타나는 독특한 상입니다.", "motivation": "이론적 예측은 활발하지만, 실제로 높은 네엘 온도($T_N$)를 가지면서 층상 구조를 가진 알터마그네틱 물질을 실험적으로 확인한 사례는 여전히 부족합니다.", "result": "코발트가 인터칼레이션된 TMD인 $Co_{1/4}TaSe_2$를 대상으로 ARPES 측정과 DFT 계산을 수행하여, 페르미 면에서 명확한 알터마그네틱 스핀 분열 신호를 관측했습니다. $T_N = 178 K$의 A-타입 반강자성 정렬을 확인했으며, 온도를 높여 $T_N$ 이상으로 갈 때 밴드 구조가 재구성되는 현상을 통해 자성과 밴드 분열의 상관관계를 증명했습니다.", "implication": "이 물질은 실온에 근접한 $T_N$을 가진 층상 알터마그넷으로서, 향후 스핀트로닉스 소자나 위상 양자 현상 연구를 위한 우수한 플랫폼이 될 수 있음을 시사합니다.", "novelty": "독자의 관심사인 ARPES를 이용해 '알터마그네티즘'을 직접 증명했다는 점이 핵심이며, 특히 독자가 주목하는 TMD(TaSe2) 기반 시스템에서의 구현이라는 점에서 직접적인 연관성이 큽니다.", "unresolved": "실제 스핀 분열의 크기를 정밀하게 제어할 수 있는지, 그리고 다른 인터칼레이션 농도에서의 상도표 변화에 대한 연구가 더 필요 ination with X-ray diffraction (XRD) and first-principles calculations. Static XRD measurements establish the lattice constant as the key control parameter for the topological transition, with a critical value $a_\\mathrm{c}=6.073$ \\AA separating the normal-insulator and topological phases. Despite generating electronic temperatures far above the topological-to-normal transition temperature $T_\\mathrm{c}$, optical excitation in the TCI phase does not induce a phase transition. Instead, it drives an ultrafast lattice contraction of $\\Delta a \\approx -0.45$ pm within less than 1 ps that counteracts thermal expansion and prevents the system from reaching $a_\\mathrm{c}$. The optical excitation therefore pushes the system deeper into the topological phase, providing a direct explanation for the absence of an optically driven transition. Total-energy calculations reveal that this behavior originates from the band inversion in the topological regime, which reverses the character of the photoinduced charge transfer and transiently strengthens atomic bonding. These findings identify band inversion as a mechanism that fundamentally alters the nonequilibrium lattice response, with general implications for ultrafast optical control of topological materials.", "tier": "A_MUST_READ", "score": "10", "reason": "Direct tr-ARPES study on an optically driven topological crystalline insulator, highly relevant.", "tags": ["ARPES", "topologicalinsulator", "ultrafast", "latticedynamics"], "image": "https://arxiv.org/html/2610.16513v1/Figure_1A.png", "briefing": {"background": "위상 결정 절연체(TCI)는 격자 대칭성에 의해 위상 상태가 보호되는 물질로, 빛을 이용해 격자나 전자를 자극하여 위상 상전이를 초고속으로 제어하려는 시도가 지속되고 있습니다.", "motivation": "TCI인 $Pb_{1-x}Sn_xSe$에서 광 여기에 의해 일반 절연체-위상 절연체 상전이가 유도될 수 있는지, 그리고 그 과정에서 격자와 전자의 상호작용이 어떻게 일어나는지 규명하고자 했습니다.", "result": "tr-ARPES와 XRD를 통해 관찰한 결과, 강한 광 여기에도 불구하고 위상 상전이는 일어나지 않았습니다. 대신 1ps 이내에 격자가 약 -0.45 pm 수축하는 '초고속 격자 수축' 현상을 발견했습니다. 이는 밴드 반전(Band inversion) 상태에서 광 여기에 의해 전하 이동 특성이 바뀌며 원자 간 결 mmary": "A Dirac mass is characterized not only by its magnitude but also by its sign, which influences the Berry curvature, Hall response, and the propagation direction of chiral boundary modes. However, local spectroscopy of magnetic topological surfaces has so far accessed only the gap magnitude $|M|$. Here we show how the topological sign of $M$ can be determined locally. We first establish the sign information that spin-resolved tunneling can access and the reference required to obtain an absolute Hall sign. Although spin--orbital entanglement generally obscures the relation between measured spin and Dirac pseudospin, crystalline rotation symmetry alleviates this ambiguity at the band edge. On a $C_3$ axis, an axial tip couples to a fully spin-polarized state whose tunneling asymmetry directly reveals the sign of the occupied-band Berry curvature, independent of orbital composition. We further show that the zeroth Landau level provides an independent mass-sign measurement with an unpolarized tip, while opposite domains and their chiral domain-wall modes provide self-consistency checks. These results pave the way for imaging the locations where the topological character changes within a material, rather than merely identifying where a spectral gap appears.", "tier": "A_MUST_READ", "score": "9", "reason": "author whitelist: M. Zahid Hasan", "tags": ["Dirac", "Berrycurvature", "topological", "Landaulevel"], "image": "https://arxiv.org/html/2610.17464v1/fig1_schematic.png", "briefing": {"background": "위상 절연체나 자기 위상 물질에서 디락 질량(Dirac mass)은 에너지 갭의 크기뿐만 아니라 그 부호(sign)가 베리 곡률과 키랄 경계 모드의 거동을 결정하는 핵심 정보입니다. 하지만 지금까지 STM/STS와 같은 국소 분광학적 방법으로는 갭의 크기(|M|)만 측정할 수 있었습니다.", "motivation": "디락 질량의 부호를 국소적으로 이미징하여, 물질 내부에서 위상적 특성이 변하는 경계나 도메인을 실시간으로 식별하고자 하는 목적이 있습니다.", "result": "C3 회전 대칭성을 활용하여 축 방향 팁(axial tip)으로 특정 스핀 편극 상태를 결합함으로써, 궤도 조성과 무관하게 점유된 밴드의 베리 곡률 부호를 직접 측정하는 방법을 제시했습니다.", "implication": "단순한 에너지 갭 관찰을 넘어, 물질의 위상적 위상(topological phase)이 공간적으로 어떻게 변하는지를 직접 지도로 그려낼 수 있는 새로운 진단 도구를 확보했습니다.", "novelty": "기존 스핀-궤도 얽힘에 의한 모호함을 C3 대칭성 이용으로 극복했다는 점과, 0번째 란다우 레벨(0th LL)을 활용한 질량 부호 검증 기법을 제안한 점이 주목할 만합니다.", "unresolved": "실험적 팁의 정렬 정밀도가 측정 결과에 미치는 영향이나, 팁 자체가 유도하는 위상 왜곡 가능성에 대한 보정 작업이 남아있습니다.", "future_work": "다양한 자기 위상 물질의 도메인 벽에서 실제로 위상 부호가 바뀌는 지점을 시각화하고, 이를 활용한 위상 회로 제어 가능성을 탐색할 것으로 보입니다.", "concepts": [{"term": "Dirac mass sign", "why_emerged": "위상학적 상전이와 베리 곡률의 부호를 결정짓는 물리량으로 필요함.", "origin": "디락 페르미온 이론과 위상 절연체 물리학의 기초.", "connections": "안정적인 Hall 응답, 키랄 에지 모드와 직결."}, {"term": "Spin-polarized tunneling", "why_emerged": "전자 구조의 스핀 정보를 국소적으로 읽어내기 위해.", "origin": "Tedrow and Meservey에 의해 확립됨.", "connections": "STS 기술의 확장, 자기 위상 물질 연구의 핵심 도구."}, {"term": "Zeroth Landau level", "why_emerged": "디락 페르미온의 위상적 특징을 나타내는 스펙트럼 표식.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "양자 홀 효과, 위상학적 비자명성 관찰."}], "english_summary": ["Presents a novel method to image the sign of the Dirac mass in magnetic topological materials using STM/STS.", "Utilizes C3 rotation symmetry to decouple spin-orbital entanglement for direct Berry curvature sign determination.", "Validates the method through 0th Landau level spectroscopy and chiral domain wall observations.", "Enables spatial mapping of topological character transitions rather than mere gap magnitude measurements."]}}, {"title": "Observation of stacked vortex structure with number controllable Majorana zero mode in Bi2Te3/FeTe heterojunction", "journal": "arXiv_CondMat", "source": "author whitelist", "link": "https://arxiv.org/abs/2610.17701", "authors": "Xinru Han, Zhaokun Luo, Quanxin Hu, et al.", "last_authors": "Gan Wang, Hong Ding", "summary": "Creation and control of Majorana zero modes (MZMs) in solid devices is the key challenge in realizing fault tolerant topological quantum computation. Here we report spectroscopic evidence for number controllable MZMs in stoichiometric one quintuple layer Bi$_{2}$Te$_{3}$/FeTe heterostructures, together with the observation of stacked vortices in superconducting islands. Low temperature scanning tunnelling microscopy and spectroscopy reveal a long period moire superlattice arising from lattice mismatch, which induces nanoscale modulation of superconducting gaps. Magnetic vortices exhibit a stacked core structure with two layer derived bound state branches: a dispersive branch evolving into an X-shaped pattern away from the vortex center, and a quantum-limit branch characterized by a spatially unsplit MZMs together with discrete integer quantized Caroli-de Gennes-Matricon states. Notably, MZMs are observed in all measured vortices, and their number can be tuned by magnetic field and the size of Bi$_{2}$Te$_{3}$ islands. These results establish stoichiometric 1QL-Bi$_{2}$Te$_{3}$/FeTe as a patterned superconducting interface that enables isolated and few-vortex Majorana configurations, providing a controlled platform for fuse MZMs.", "tier": "A_MUST_READ", "score": "9", "reason": "author whitelist: Hong Ding", "tags": ["Majorana", "moire", "heterostructure", "superconduct", "topological"], "image": "https://arxiv.org/static/browse/0.3.4/images/arxiv-logo-fb.png", "briefing": {"background": "위상 초전도체와 자기 물질의 접합 계면은 마요라나 제로 모드(MZM)를 구현하기 위한 핵심 플랫폼입니다. 특히 자성 물질인 FeTe와 위상 절연체인 Bi2Te3의 이종접합은 위상 초전도성을 유도하기 위한 유망한 후보로 알려져 있습니다.", "motivation": "MZM의 수를 제어하고, 고립된 소수의 볼텍스 내에서 안정적인 마요라나 구성을 실험적으로 증명하고자 합니다.", "result": "Bi2Te3/FeTe 이종접합에서 모아레 초격자에 의한 초전도 갭의 나노 단위 변조를 확인했습니다. 자기 볼텍스 내부에서 마요라나 모드와 양자화된 Caroli-de Gennes-Matricon 상태를 관측했으며, 자기장과 아일랜드 크기를 통해 MZM의 수를 제어 가능함을 보였습니다.", "implication": "마요라나 기반 양자 컴퓨팅을 위한 '제어 가능한' 플랫폼으로서, 1QL Bi2Te3/FeTe 계면의 기술적 유효성을 확립했습니다.", "novelty": "적층된 볼텍스 구조 내에서 MZM의 수를 조절할 수 있다는 점은 위상 양자 연산의 확장성을 확보하는 데 매우 중요한 진전입니다.", "unresolved": "MZM의 위상학적 보호 정도와 외부 노이즈에 대한 결맞음(coherence) 유지 능력에 대한 정량적 분석이 요구됩니다.", "future_work": "관측된 MZM의 비아벨(non-Abelian) 통계적 특성을 검증하는 브레이딩(braiding) 실험이 이어질 것으로 예상됩니다.", "concepts": [{"term": "Majorana zero mode", "why_emerged": "위상 양자 컴퓨팅에서 오류가 없는 논리 비트를 구현하기 위해.", "origin": "Ettore Majorana, 고체 물리학에서는 2000년대 후반부터 본격 연구.", "connections": "위상 초전도체, 볼텍스 상태, 큐비트."}, {"term": "Moiré superlattice", "why_emerged": "격자 불일치로 인한 나노 단위의 주기적 포텐셜 변조를 제어하기 위해.", "origin": "그라핀 분야에서 발견되어 현재 다물체 물리학의 핵심 도구.", "connections": "트위스트 이층 구조, 초전도 제어."}, {"term": "Caroli-de Gennes-Matricon states", "why_emerged": "볼텍스 코어 내부의 속박된 준입자 상태를 기술하기 위해.", "origin": "1964년 Caroli 등에 의해 제안.", "connections": "볼텍스 내 MZM과의 경쟁 및 공존 상태."}], "english_summary": ["Demonstrates controlled Majorana zero modes (MZMs) in 1QL-Bi2Te3/FeTe heterostructures.", "Identifies stacked vortex structures modulated by a long-period moiré superlattice.", "Shows MZM number control via magnetic field and topological insulator island size.", "Provides a promising platform for fault-tolerant topological quantum computation."]}}, {"title": "Realistic Simulation of Valence-band Photoemission Spectra by using First-principles Calculations on the Basis of FLAPW Method (Journal of the Physical Society of Japan)", "journal": "arXiv_CondMat", "source": "keyword", "link": "https://arxiv.org/abs/2610.15602", "authors": "Noriaki Hamada, Satoshi Nakamura, Kenta Takahashi, Mario Okawa, Tomohiko Saitoh", "last_authors": "Mario Okawa, Tomohiko Saitoh", "summary": "In order to reproduce experimental photoemission spectroscopy (PES) data by using band structure calculations with linearized augmented-plane-wave method, we developed a new method to calculate the atomic-subshell photoelectron differential cross section (PE-DCS) of the valence band. PE-DCS was calculated to be the sum of the products of the partial density of states (PDOS) and the photoionization differential cross section (PI-DCS) of each atomic subshell. To construct an appropriate PDOS beyond the conventional muffin-tin sphere (MTS) PDOS, we proposed a ``nearly-neutral atomic sphere\", which can be defined as a natural extension of MTS. Although the calculational method for atomic-subshell PI-DCS was the standard Hartree-Fock-Slater method, we developed a new computer code in order to deal with the unoccupied electron shells in the ground state of isolated atoms up to $\\sim$10 keV. Details of the PE-DCS calculations were examined by using two simple examples of Na metal and NaCl, and then, the method was applied to hard x-ray PES (HX-PES) data of CuAlO$_2$. The experimental spectra were satisfactorily reproduced, demonstrating the potential applications of our method to HX-PES spectra of many compounds.", "tier": "A_MUST_READ", "score": "9", "reason": "title strong match: photoemission", "tags": ["photoemission", "bandstructure"], "image": "https://arxiv.org/html/2610.15602v1/ABCAP_Fig1_theta.png", "briefing": {"background": "광전자 분광법(PES) 데이터는 전자 구조를 이해하는 가장 직접적인 도구이나, 실험 스펙트럼과 이론적인 계산 결과를 정량적으로 대조하는 과정에서 항상 모델 의존적인 한계가 존재합니다.", "motivation": "FLAPW(선형 증강 평면파) 방법론을 바탕으로 실험적 PES 스펙트럼을 더욱 정확하게 재현할 수 있는 계산 프레임워크를 개발하는 것입니다.", "result": "기존 머핀-틴(muffin-tin) 구형 모델의 한계를 극복한 '준중성 원자 구체(nearly-neutral atomic sphere)' 모델을 도입했습니다. 또한 10 keV 수준까지의 높은 에너지 영역을 처리할 수 있는 새로운 사진이온화 미분 단면적(PI-DCS) 코드를 작성했습니다.", "implication": "하드 엑스레이 광전자 분광법(HX-PES)을 포함한 다양한 에너지 영역에서 이론과 실험의 불일치를 획기적으로 줄여, 고도로 상관된 전자계나 복잡한 산화물 연구에 정밀함을 더할 수 있습니다.", "novelty": "원자 subshell별 PDOS와 PI-DCS를 결합하여 PES 데이터를 시뮬레이션하는 엄밀한 루틴을 확립했다는 점이 핵심이며, 특히 실험 연구자와 이론가 사이의 간극을 메우는 데 기여합니다.", "unresolved": "강한 전자 상관관계(electron correlation)가 동반된 시스템에서 다체 효과를 얼마나 효율적으로 이 계산법에 통합할 수 있는지는 추가 과제입니다.", "future_work": "다양한 전이 금속 산화물 및 고온 초전도체 물질에 이 코드를 적용하여 실험적 밴드 구조 해석의 신뢰도를 높일 예정입니다.", "concepts": [{"term": "FLAPW", "why_emerged": "결정 구조에서 전자 파동함수를 효율적이고 정확하게 계산하기 위해.", "origin": "Andersen 등에 의해 제안.", "connections": "DFT 기반 전자 구조 계산, 광범위한 고체 물리 이론."}, {"term": "Photoionization cross section", "why_emerged": "PES에서 에너지에 따른 방출 확률을 정량화하기 위해.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "심준위 및 가전자대 분광학."}, {"term": "HX-PES", "why_emerged": "벌크의 전자 상태를 더 깊이 탐구하기 위해 기존 PES보다 높은 에너지의 엑스레이 사용.", "origin": "싱크로트론 방사광 시설의 발전과 함께 확립.", "connections": "벌크 sensitive 분광학, 고압 물리학."}], "english_summary": ["Introduces a new method to simulate valence-band PES using FLAPW-based first-principles calculations.", "Proposes 'nearly-neutral atomic sphere' PDOS to improve upon traditional muffin-tin models.", "Developed a new code for high-energy atomic-subshell photoionization cross-sections (up to 10 keV).", "Demonstrates high-accuracy reproduction of HX-PES spectra for CuAlO2."]}}, {"title": "Symmetry Condition and Mechanism for the Anomalous Hall Effect in Odd-Parity Magnets", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2610.16247", "authors": "Xun-Jiang Luo, Su-Qi Zhang, Yi-Dong Liu, Yong-Ting Shi, Ding-Fu Shao, Mingliang Tian", "last_authors": "Ding-Fu Shao, Mingliang Tian", "summary": "The anomalous Hall effect (AHE) in unconventional magnets has attracted considerable attention. A giant AHE has recently been observed in the candidate $p$-wave magnet Gd$_3$(Ru$_{1-\\delta}$Rh$_{\\delta}$)$_4$Al$_{12}$ [Nature 646, 837(2025)], while its theoretical interpretation invokes a spontaneous magnetization to break time-reversal symmetry ($\\mathcal{T}$), although the magnetic order itself already breaks $\\mathcal{T}$. Consequently, the microscopic origin of the AHE in odd-parity magnets (OPMs) remains an open question. Here we establish the symmetry condition and microscopic mechanism for the AHE in OPMs. Since the OPM order is classified by the spin group whereas the AHE is governed by the magnetic group, the AHE is allowed only when the magnetic point group is ferromagnetic; conversely, it is forbidden whenever the effective time reversal $\\mathcal{T}\\tau$ (with $\\tau$ a fractional translation), which is essential to the realization of the OPM, is preserved. Microscopically, OPMs generically host a hidden Zeeman field (HZF) rooted in this intrinsic $\\mathcal{T}$ breaking, and its interplay with spin-orbit coupling (SOC) generates the AHE without any external field. We demonstrate this picture with models on ty) 위치와 강하게 연관되어 있음을 발견했습니다. 또한, $d+id'$ 및 $d+is$ 상태가 존재할 수 있음을 보였으며 이들의 대칭성 변환 특성을 규명했습니다.", "implication": "실험적 결과의 불일치가 꼬임각뿐만 아니라 층간 터널링 강도와 도핑 수준의 미세한 차이에서 기인할 수 있음을 제시하여, 향후 실험 설계를 정교화할 수 있습니다.", "novelty": "단순 현상론적 모델을 넘어, 밴 호브 특이점이 TRSB 위상에 미치는 영향을 체계적으로 계산한 점이 돋보이며, 모아레(moiré) 시스템의 상관 물리학을 큐프레이트 영역으로 확장한 연구입니다.", "unresolved": "실험 데이터와의 완벽한 일치를 위해서는 더 복잡한 전자-전자 상호작용 및 무질서(disorder) 효과를 포함한 추가 연구가 필요합니다.", "future_work": "조셉슨 접합 실험 결과와의 정량적 비교 및 다른 초전도 물질 시스템으로의 이론 적용이 예상됩니다.", "concepts": [{"term": "TRSB (Time-Reversal Symmetry Breaking)", "why_emerged": "초전도 상태에서 자기적 질서가 동반되거나 위상학적으로 특이한 초전도 갭 구조를 설명하기 위해 필요합니다.", "origin": "큐프레이트 및 위상 초전도체 연구에서 핵심 개념으로 정립됨.", "connections": "비전통적 초전도, $d+id$ 상태, 카이랄 초전도체."}, {"term": "Van Hove Singularity", "why_emerged": "밴드 구조의 밀도가 급격히 발산하는 지점으로, 상전이 및 상관 물리학에서 상태의 불안정성을 유도하는 주요 원인입니다.", "origin": "1953년 Leon Van Hove에 의해 도입됨.", "connections": "페르미 준위 조정, 상관 전자계, 초전도 전이 온도 상승."}], "english_summary": ["The paper investigates the gap structure and phase diagram of twisted bilayer cuprates using a microscopic lattice model.", "It demonstrates that the TRSB superconducting state is closely linked to the position of the Van Hove singularity.", "The authors identify $d+id'$ and $d+is$ order parameters and analyze their dependence on twist angle and tunneling strength.", "These results help explain the discrepancies observed in recent experiments on twisted bilayer cuprates."]}}, {"title": "Imaging Gate-Tunable Single-Layer Molecular Kagome Lattices", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2610.18539", "authors": "Ziyi Wang, Rafal Zuzak, Weichen Tang, et al.", "last_authors": "Steven G. Louie, Michael F. Crommie", "summary": "Kagome lattices provide a simple geometry for engineering electronic states that exhibit novel quantum behavior. In conventional kagome materials, however, the relevant states are often embedded in chemically complex three-dimensional crystals and are difficult to isolate or tune. Molecule-based kagome networks offer structural precision and tunability, but have largely been confined to metallic substrates incompatible with 2D devices. Here we report growth of single-layer Ni$_3$(HITP)$_2$ metal-organic frameworks (MOFs) on van der Waals substrates including graphene-based field-effect devices using metal-salt molecular beam epitaxy. Low-temperature scanning tunneling spectroscopy resolves kagome-derived flat-band and van Hove singularity-based spectral features consistent with first-principles calculations. Gating hybrid 2D MOF devices allows us to energetically shift kagome spectral features, thus establishing electrostatic control of chemically programmable 2D kagome electronic lattices.", "tier": "B_IMPORTANT_CONDMAT", "score": "10", "reason": "Direct hit: STS on a kagome lattice resolving flat-band and van Hove features.; demoted from A: broad CM, not direct user/project hit", "tags": ["STS", "kagome", "graphene", "flat-band"], "image": "https://arxiv.org/static/browse/0.3.4/images/arxiv-logo-fb.png", "briefing": {"background": "Kagome 격자는 기하학적 좌절(frustration)과 간섭 효과로 인해 flat-band와 van Hove 특이점(vHs) 등 흥미로운 양자 상태를 생성하는 플랫폼으로 주목받고 있습니다. 기존의 3D kagome 금속(AV3Sb5 등)은 물질 자체가 복잡하여 개별 전자 상태를 제어하기 어렵습니다.", "motivation": "분자 기반 금속-유기 구조체(MOF)를 이용하여 kagome 격자의 구조적 정밀도를 높이고, 특히 2D 소자 환경에서 정전기적 게이팅을 통해 전자 구조를 능동적으로 제어하고자 합니다.", "result": "그래핀 기판 위에 Ni3(HITP)2 단층 MOF를 성장시키고 STS 측정을 통해 예측된 kagome flat-band 및 vHs 특성을 관측했습니다. 게이트 전압을 통해 이러한 특성들의 에너지 위치를 성공적으로 이동시켰습니다.", "implication": "화학적으로 프로그래밍 가능한 2D kagome 격자를 구현함으로써, 위상 물성 및 강상관 전자계를 게이팅으로 조절할 수 있는 새로운 실험 플랫폼을 제시합니다.", "novelty": "기존 금속 기판에 국한되었던 MOF 성장을 2D vdW 기판 및 소자 플랫폼으로 확장하여 전자 구조의 직접적인 실험적 제어 가능성을 보여주었습니다.", "unresolved": "MOF 내부의 원자 수준 결함이 전체적인 electronic band 구조의 분산에 미치는 정량적인 영향은 추가 연구가 필요합니다.", "future_work": "더 넓은 범위의 게이팅을 통한 상전이 탐색 및 초전도/자기적 물성 유도 실험이 기대됩니다.", "concepts": [{"term": "Flat-band", "why_emerged": "입자 간 상호작용이 지배적인 영역에서 강상관 물리 현상을 극대화하기 위해 필요합니다.", "origin": "일반 ng knob for its internal phase structure. This behavior is consistent with a time-reversal-symmetry-breaking multiband superconducting state characterized by a nontrivial relative phase between superconducting condensates. Our results establish hybrid molecular Josephson junctions as a quantum-device platform for phase-sensitive investigation and integration of molecularly engineered superconductors, opening opportunities to uncover and engineer unconventional superconducting phases.", "tier": "B_IMPORTANT_CONDMAT", "score": "10", "reason": "Experimental study of vdW heterostructure junctions demonstrating unconventional multiband superconductivity.; demoted from A: broad CM, not direct user/project hit", "tags": ["STS", "vanderWaals", "superconduct"], "image": "https://arxiv.org/html/2610.16483v1/Fig1.png", "briefing": {"background": "vdW 이종접합 내에서의 초전도는 층간 상호작용과 인터칼레이션(intercalation)을 통해 물성을 정밀하게 조절할 수 있습니다. 위상 감응형 양자 소자에서 초전도 접합의 위상차는 비정상적인 수송 현상을 관찰하는 핵심 지표입니다.", "motivation": "TaS2와 NbSe2 헤테로구조에 특정 분자를 인터칼레이션하여 Josephson 접합의 내부 위상 구조와 비가역적 수송 현상(diode effect)의 상관관계를 규명하고자 합니다.", "result": "분자 인터칼레이션이 Ising 초전도성을 유도하며, 접합 구조의 대칭성 변화에 따라 Josephson diode 효과가 나타남을 확인했습니다. 이는 시간 반전 대칭성이 깨진 다중 밴드 초전도 상태임을 시사합니다.", "implication": "분자 인터칼레이션이 초전도 응축액 간의 상대적 위상을 조절하는 '튜닝 노브'로 작용함을 입증하여, 위상 초전도체 탐색을 위한 새로운 소자 플랫폼을 제공합니다.", "novelty": "단순한 초전도체 조절을 넘어, 분자 인터칼레이션을 통해 Josephson 접합 내의 위상 물리와 비가역적 수송 현상을 직접적으로 제어했다는 점이 독창적입니다.", "unresolved": "인터칼레이트된 분자가 정확히 어떤 방식으로 초전도 밴드 간의 위상차를 유도하는지에 대한 미시적 메커니즘은 추가 규명이 필요합니다.", "future_work": "다양한 분자 종을 이용한 초전도 위상 엔지니어링 및 위상 양자 컴퓨터 소자 응용 연구.", "concepts": [{"term": "Josephson Diode Effect", "why_emerged": "초전도 소자에서 전류의 방향에 따른 임계 전류의 비대칭성을 제어하기 위해 필요합니다.", "origin": "초전도 이종구조 연구에서 최근 활발히 논의됨.", "connections": "비가역적 수송, 시간 반전 대칭성 깨짐."}, {"term": "Ising Superconductivity", "why_emerged": "강한 스핀-궤도 결합에 의해 스핀이 면에 수직으로 고정된 독특한 초전도 상태를 설명하기 위해 등장했습니다.", "origin": "2D 전이금속 디칼코게나이드(TMD)에서 관측됨.", "connections": "비중심대칭 초전도체, TMD."}], "english_summa ductor's order parameter of NbSe2.", "tier": "B_IMPORTANT_CONDMAT", "score": "9", "reason": "Scanning tunneling spectroscopy of proximity-induced superconductivity in topological insulator thin films.; demoted from A: broad CM, not direct user/project hit", "tags": ["STM/STS", "Bi2Te3/NbSe2", "topologicalinsulator"], "image": "https://arxiv.org/static/browse/0.3.4/images/arxiv-logo-fb.png", "briefing": {"background": "위상 절연체(TI)와 초전도체의 이종접합은 마요라나 페르미온과 같은 위상 초전도 현상을 구현하기 위한 핵심 플랫폼입니다.", "motivation": "Bi2Te3/NbSe2 이종접합에서 계면의 초전도 근접 효과가 실제 전자 구조에 어떻게 나타나는지 STS를 통해 밝히고자 합니다.", "result": "관찰된 코히런스 피크의 비정상적 형태가 NbSe2 자체의 복잡한 갭 구조 때문이 아니라, Bi2Te3 표면 상태와 벌크 상태가 각각 근접 결합된 결과임을 규명했습니다.", "implication": "위상 절연체와 초전도체 결합 계면에서 나타나는 전자 구조의 복잡성을 이해하고, 이를 정밀하게 제어할 수 있는 가능성을 제시합니다.", "novelty": "화학 포텐셜 의존적 STS 측정을 통해 표면 상태와 벌크 상태의 기여도를 분리해낸 점이 중요합니다.", "unresolved": "NbSe2의 갭 파라미터와 다른 밴드들이 위상적 특성에 정확히 어떻게 기여하는지에 대한 완벽한 정량적 모델링은 추가 논의가 필요합니다.", "future_work": "더 정교한 나노 구조 제작을 통한 국소적 위상 초전도성 검증 및 위상 표면 상태의 마요라나 모드 탐색.", "concepts": [{"term": "근접 효과 (Proximity Effect)", "why_emerged": "초전도체와 비초전도체 접합에서 초전도 성질이 비초전도체 영역으로 스며드는 현상을 이해하기 위해 필요했습니다.", "origin": "De Gennes가 1960년대 초반에 확립했습니다.", "connections": "조셉슨 접합, 위상 초전도체."}, {"term": "STS (Scanning Tunneling Spectroscopy)", "why_emerged": "물질 표면의 상태 밀도(DOS)를 원자 수준에서 에너지 분해능을 가지고 측정하기 위해 필요했습니다.", "origin": "Binnig와 Rohrer에 의한 STM 발명 이후 발전했습니다.", "connections": "밴드 구조, 초전도 갭 측정."}], "english_summary": ["Investigated Bi2Te3/NbSe2 heterostructures using low-temperature STS.", "Observed anomalous coherence peaks deviating from conventional s-wave signatures.", "Analysis reveals separate contributions from bulk and surface states of Bi2Te3.", "Proximity coupling to NbSe2 induces distinct superconducting features."]}}, {"title": "Confinement-deconfinement transitions in the dimer-loop models on two-dimensional non-bipartite lattices", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2610.16676", "authors": "Jay Pandey, Souvik Kundu, Kedar Damle", "last_authors": "Souvik Kundu, Kedar Damle", "summary": "Recent work [Kundu, Damle, Phys. Rev. X 15, 011018 (2025)] has demonstrated that a class of $S=1$ kagome lattice antiferromagnets with competing anisotropies can exhibit unusual low-temperature behavior that is best described in terms of the statistical mechanics of an interesting interpolation between the fully-packed dimer model and the fully-packed loop model on the bipartite honeycomb lattice. On this and other bipartite lattices in two and three dimension, such fully-packed dimer-loop models generically have two distinct power-law correlated Coulomb phases, both of which admit a low-energy description in terms of a fluctuating divergence-free polarization vector field [Phys. Rev. X 15, 011018 (2025); arXiv:2510.11607]. The transition between these phases corresponds to a confinement transition for the $Z_2$ part of the corresponding $U(1)$ flux [Phys. Rev. X 15, 011018 (2025); arXiv:2510.11607]. Here we demonstrate that a variant of such a topological confinement transition can also exist in dimer-loop models on non-bipartite lattices such as the kagome and triangular lattices although the low-energy description does not feature any conserved $U(1)$ flux. In these non-bipartite dimer-loop models, both phases are short-range correlated liquids, and the topological distinction between them is in terms of a $Z_2$-valued winding number instead of the flux of a divergence-free polarization field. In spite of this key difference, this transition appears to be in the same Ising universality class as the analogous transition of the bipartite dimer-loop models. These kagome and triangular lattice dimer-loop models correspond respectively to the low-energy limit of a class of $S=1$ antiferromagnets with competing anisotropies on the ruby lattice comprising a corner-sharing arrangement of fully-frustrated squares and a lattice of corner-sharing fully-frustrated hexagons.", "tier n Cao, Qian Niu, Shengyuan A. Yang, Cong Xiao", "last_authors": "Shengyuan A. Yang, Cong Xiao", "summary": "We propose a crossed electric spin generation effect in multilayer structures. This effect combines the advantages of in-plane and gate electric fields for manipulating spin, and unveils a nice quantum geometric structure in terms of the underlying hybrid Berry curvatures that are unique to quasi-2D systems and manifest inherent spin-layer-orbital coupling. Combining our theory with first-principles calculations, we predict sizable spin generation in 2D ferromagnetic Fe3GeTe2 and altermagnetic V2Te2O. Our theory opens a new Berry-curvature route for all-electric spin manipulation in 2D materials", "tier": "B_IMPORTANT_CONDMAT", "score": "9", "reason": "Berry-curvature-driven spin manipulation in altermagnetic and ferromagnetic van der Waals materials.; demoted from A: broad CM, not direct user/project hit", "tags": ["theory", "V2Te2O", "altermagnetism"], "image": "https://arxiv.org/html/2610.14668v1/Fig.2.png", "briefing": {"background": "차세대 스핀트로닉스 구현을 위해 외부 전기장만으로 스핀 분극을 제어하는 효율적인 방법이 요구되고 있습니다. 기존 스핀-궤도 토크는 주로 평면 내 전기장에 의존하며, 2차원 자성 재료에서의 고유한 기하학적 특성 활용에는 한계가 있었습니다.", "motivation": "다층 구조 시스템에서 평면 내 및 게이트 전기장을 결합하여, 2차원 자성체의 양자 기하학적 구조(하이브리드 베리 곡률)를 이용한 새로운 스핀 생성 메커니즘을 탐구하고자 합니다.", "result": "교차 전기 스핀 생성(Crossed Electric Spin Generation) 효과를 제안하고, 2차원 강자성체 Fe3GeTe2와 알터마그네틱(altermagnetic) V2Te2O 시스템에서 유의미한 스핀 생성을 이론적으로 예측했습니다.", "implication": "베리 곡률을 활용한 전기적 스핀 조작 경로를 확장함으로써, 외부 전압만으로 스핀 상태를 제어하는 에너지 효율적인 차세대 자성 소자 개발에 기여할 수 있습니다.", "novelty": "알터마그네틱 물질에서의 베리 곡률 효과를 규명하고, 층간-궤도 결합을 통한 스핀 제어라는 새로운 물리적 통찰을 제공합니다.", "unresolved": "이론적으로 제안된 효과가 실제 소자 환경에서의 무질서(disorder)나 불순물 영향 하에서도 강건하게 유지되는지에 대한 추가적인 실험적 검증이 필요합니다.", "future_work": "Fe3GeTe2 및 V2Te2O와 같은 다층 시스템에서의 스핀 전류 직접 측정 실험 및 소자 응용을 위한 후속 연구가 예상됩니다.", "concepts": [{"term": "알터마그네티즘 (Altermagnetism)", "why_emerged": "기존 강자성/반강자성으로 분류되지 않는, 스핀 갈림(spin splitting)이 존재하는 새로운 자성 위상을 기술하기 위해 도입되었습니다.", "origin": "최근 수년 내 제1원리 계산과 대칭성 해석을 통해 정립되었습니다.", "connections": "반강자성의 비상쇄적 스핀 구조와 강자성의 에너지 분리 특성을 공유합니다."}, {"term": "베리 곡률 (Berry Curvature)", "why_emerged": "전자 파동함수의 기하학적 위상 정보를 물리적으로 해석하고 전자기적 응답을 기술하기 위해 필수적입니다.", "origin": "Michael Berry (1984).", "connections": "이상 홀 효과, 궤도 자기 모멘트, 반전 대칭성이 깨진 시스템의 비선형 수송 현상과 연결됩니다."}], "english_summary": ["Proposes a novel crossed electric spin generation effect in multilayer van der Waals materials.", "Utilizes hybrid Berry curvatures and inherent spin-layer-orbital coupling.", "Predicts sizable spin generation in Fe3GeTe2 and altermagnetic V2Te2O.", "Enables all-electric spin manipulation for next-generation spintronics."]}}, {"title": "Destructive Interference of a Charge Density Wave in the Skyrmion Magnet GdRu2Si2", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2610.16682", "authors": "G. D. A. Wood, D. A. Mayoh, F. Orlandi, et al.", "last_authors": "M. R. Lees, G. Balakrishnan", "summary": "In skyrmion magnets, charge density waves induce higher-order exchange interactions that can select multi-Q ground states. Using resonant X-ray scattering and neutron diffraction, we measure temperature-dependent spin-charge coupling in GdRu 2 ​ Si 2 \\text{GdRu}{\\vphantom{\\text{X}}}_{\\smash[t]{\\text{2}}}\\text{Si}{\\vphantom{\\text{X}}}_{\\smash[t]{\\text{2}}} . A minimal Landau model with one critical exponent and two ordering temperatures reproduces all six observed order parameters. Spin-density wave components of the multi-Q ground state drive charge ordering, but the onset of a magnetic helix suppresses it via destructive interference.", "tier": "B_IMPORTANT_CONDMAT", "score": "9", "reason": "Experimental study of CDW and spin-charge coupling in a skyrmion magnet using resonant X-ray scattering and neutron diffraction.", "tags": ["chargedensitywave", "skyrmions", "neutronscattering", "X-rayscattering", "magnetism"], "image": "https://arxiv.org/html/2610.16682v1/NF1.png", "briefing": {"background": "스카이뮴(Skyrmion) 자성체는 위상학적 비자명성과 독특한 자기 구조로 주목받고 있으나, 이를 형성하는 전자 구조와 전하 밀도 파동(CDW) 간의 상호작용은 복잡하여 명확한 메커니즘 규명이 어렵습니다.", "motivation": "GdRu2Si2 화합물에서 전하 밀도 파동과 자기적 성질이 결합되는 미시적 원리를 이해하고, 다중-Q(multi-Q) 기저 상태 선택에서의 스핀-전하 결합 역할을 규명하고자 합니다.", "result": "공명 X선 산란 및 중성자 회절을 통해 CDW가 자기적 헬릭스(magnetic helix)와의 간섭으로 인해 상쇄되는 현상을 확인하고, 이를 하나의 Landau 모델로 기술하였습니다.", "implication": "스카이뮴 자성체 내에서 전하와 스핀이 서로 배타적으로 경쟁하거나 공존하는 복잡한 위상학적 환경을 체계적으로 설명할 수 있는 틀을 제공합니다.", "novelty": "CDW와 스카이뮴 자기 구조 사이의 파괴적 간섭(destructive interference)이라는 구체적인 상호작용 경로를 실험적으로 입증했습니다.", "unresolved": "다양한 온도 및 외부 자기장 조건에서 나타나는 위상 전이의 미세한 동역학적 변화는 여전히 완벽히 이해되지 않았습니다.", "future_work": "다른 스카이뮴 기반 복합 화합물에 대한 유사 연구와 이를 통한 스핀-전하 결합 제어 기술 연구가 기대됩니다.", "concepts": [{"term": "전하 밀도 파동 (CDW)", "why_emerged": "전자 밀도의 주기적인 변조가 에너지를 낮추는 저차원 시스템의 특성을 설명하기 위해 나왔습니다.", "origin": "Peierls (1955).", "connections": "Kagome 금속(AV3Sb5)의 CDW 및 비관습적 초전도성과도 밀접한 관련이 있습니다."}, {"term": "스카이뮴 (Skyrmion)", "why_emerged": "자기 시스템에서 안정적인 와류 형태의 위상학적 결함을 기술하기 위해 도입되었습니다.", "origin": "Tony Skyrme (1962), 자기 시스템 적용은 Bogdanov et al. (1989).", "connections": "위상학적 홀 효과 및 저전력 스핀 메모리 소자의 후보군입니다."}], "english_summary": ["Investigates spin-charge coupling in skyrmion-hosting GdRu2Si2.", "Uses resonant X-ray and neutron diffraction to map ordering parameters.", "Reveals CDW onset suppressed by destructive interference from magnetic helices.", "Provides a Landau-model description of multi-Q ground state selection."]}}, {"title": "Direct Observation of Chirality-Dependent Berry Curvature Dipole via Cross-Axial Nonlinear Hall Effect in Trigonal Te", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2610.14367", "authors": "Jaehyun Lee, Junhee Shin, Daryll J. C. Dalayoan, et al.", "last_authors": "Hosub Jin, Seon Namgung", "summary": "Quantum geometric quantities, such as Berry curvature (BC) and quantum metric, are known to govern the physical and topological properties of materials, making access to these quantities critically important for the comprehensive understanding of the materials. Chiral crystals offer a natural platform in which structural handedness can control quantum geometry and nonlinear transport, but direct experimental access to the quantum geometric quantities has remained elusive. Here, we show that trigonal tellurium (Te) hosts an enantiomer-dependent Berry curvature dipole (BCD) that can be accessed through the measurement of cross-axial nonlinear Hall effect (NHE), unlike previously studied in-plane configurations where the BCD contribution vanishes. Angle-resolved measurements on left- and right-handed Te devices reveal a second-order transverse response whose sign reverses with crystal chirality. The extracted cross-axial nonlinear susceptibility, $\\chi_{yxz}$, exceeds the in-plane susceptibility, $\\chi_{xxx}$, by more than two-folds, indicating a strong BCD-driven contribution. First-principles calculations attribute this behavior to a topologically nontrivial hedgehog-like BC texture near the H points and predict a BCD that reverses sign between opposite enantiomers, consistent with experiment. These results establish cross-axial nonlinear Hall transport as a symmetry-selective probe of chirality-controlled quantum geometry in tellurium and related chiral materials.", "tier": "B_IMPORTANT_CONDMAT", "score": "9", "reason": "Experimental access to Berry curvature dipole and chirality in Tellurium; highly relevant to user's quantum geometry interests.", "tags": ["material", "Berry-curvature", "transport", "Hall-effect", "topological"], "image": "https://arxiv.org/static/browse/0.3.4/images/arxiv-logo-fb.png", "briefing": {"background": "양자 기하학적 양인 베리 곡률은 물질의 비선형 수송 현상을 결정짓는 핵심 요소이나, 이를 직접 실험적으로 추출하는 것은 매우 도전적인 과제였습니다.", "motivation": "카이랄(chiral) 물질인 텔루륨(Te)에서 구조적 대칭성이 어떻게 베리 곡률 쌍극자(BCD)와 연결되는지, 그리고 이를 비선형 홀 효과로 관측할 수 있는지 검증하고자 합니다.", "result": "교축(cross-axial) 비선형 홀 효과 측정을 통해 텔루륨의 거울상 이성질체에 따른 베리 곡률 쌍극자 신호를 성공적으로 측정하고, 이것이 H 지점 부근의 고슴도치형(hedgehog) 베리 곡률 텍스처에서 기인함을 입증했습니다.", "implication": "비선형 수송 현상이 물질의 위상학적 기하 구조를 탐사하는 강력한 분광학적 도구가 될 수 있음을 보여주었습니다.", "novelty": "기존 평면 내 실험에서 사라지던 BCD 효과를 교축 측정으로 성공적으로 포착하여, 카이랄 물질의 위상적 성질을 직접 증명한 점이 독보적입니다.", "unresolved": "비선형 수송 현상이 강하게 나타나는 온도 영역과 샘플의 무질서도가 신호 크기에 미치는 영향에 대한 정량적 추가 분석이 필요합니다.", "future_work": "텔루륨 외 다른 카이랄 위상 절연체 및 반금속에서의 교축 비선형 홀 효과 측정으로 응용 범위가 넓어질 것입니다.", "concepts": [{"term": "베리 곡률 쌍극자 (BCD)", "why_emerged": "반전 대칭성이 깨진 시스템에서 베리 곡률의 운동량 공간 분포가 비대칭적일 때 발생하는 비선형 전류를 기술하기 위해 필요합니다.", "origin": "Fu (2015).", "connections": "비선형 홀 효과(NHE)와 직접 연결되며 Berry curvature의 미세 구조를 탐사하는 핵심 지표입니다."}, {"term": "비선형 홀 효과 (Nonlinear Hall Effect)", "why_emerged": "선형 응답에서 나타나지 않는 양자 기하학적 정보를 비선형 수송(2차 응답)을 통해 얻기 위해 등장했습니다.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "위상학적 물질, 카이랄 시스템, 베리 곡률 분포 측정."}], "english_summary": ["Direct experimental observation of Berry curvature dipole (BCD) in chiral tellurium.", "Employs cross-axial nonlinear Hall effect measurement as a sensitive probe.", "Links sign reversal of second-order transverse response to crystal chirality.", "Confirms hedgehog-like Berry curvature texture via first-principles calculations."]}}, {"title": "Disorder-driven symmetry suppression by van der Waals planar defects in a magnetic topological insulator", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2605.15332", "authors": "Rikkie Joris, Heyi Xia, Ana Beatriz Pedro Fontes, et al.", "last_authors": "Badih A. Assaf, Lino M. C. Pereira", "summary": "Magnetic topological insulators offer a platform to control electronic topology through magnetic order, yet reliable routes to tune their properties remain limited. Here, we show that ion irradiation allows to modify the magnetic properties and the anomalous Hall response of the van der Waals magnetic topological insulator MnBi$_2$Te$_4$. Using noble gas ion beams, intrinsic defects are introduced via collision cascades without chemical doping. We identify two distinct regimes. At low fluence, cation antisite disorder leads to a near-complete redistribution of Bi over cation sites while preserving long-range crystallographic order, accompanied by a transition from $p$-type to $n$-type transport. At high fluence, cation-anion intermixing drives the formation of a previously unreported layer-disordered phase characterized by a high density of van der Waals-specific planar defects, including swapped bilayers. Despite significant structural disorder, the system retains partial periodic order up to high displacement levels. Magnetometry and X-ray spectroscopy show that the Mn high-spin state and intralayer antiferromagnetic interactions likely persist, while macroscopic magnetic anisotropy is strongly reduced. At the same time, the magnitude of the anomalous Hall conductivity is reduced by an order of magnitude, far exceeding the change in magnetization, and its sign is modified. The observations are consistent with a suppression of the Berry curvature of the occupied states. These results establish ion irradiation as a means to tune anomalous Hall conductivity in topological insulators through defect engineering and reveal a disorder-driven approach to control symmetry and electronic structure in van der Waals magnetic materials.", "tier": "B_IMPORTANT_CONDMAT", "score": "9", "reason": "Control of magnetic order and anomalous Hall effect in the magnetic topological insulator MnBi2Te4 via ion-irradiation.", "tags": ["method:transport", "material:MnBi2Te4", "topic:magnetictopologicalinsulator"], "image": "https://arxiv.org/html/2605.15332v3/Figures/TEM_Comp_SB.png", "briefing": {"background": "자기 위상 절연체(MTI)는 자기 질서와 위상적 전자 구조가 결합된 물질로, 양자 변칙 홀 효과(QAHE)와 같은 특이한 물리 현상을 구현할 수 있어 차세대 소자 후보로 연구됩니다.", "motivation": "MnBi2Te4와 같은 MTI에서 결함을 통한 전자 구조와 자기적 특성의 정교한 제어는 여전히 어려운 과제이며, 이를 위한 비파괴적이고 효율적인 튜닝 기법이 필요합니다.", "result": "이온 조사를 통해 MnBi2Te4의 격자 구조를 파괴하지 않으면서 캐리어 타입을 p에서 n형으로 변환하고, 고에너지 조사를 통해 층간 뒤섞임이 포함된 새로운 결함 구조를 유도했습니다.", "implication": "이온 조사가 MTI의 베리 곡률과 변칙 홀 전도도를 조절하는 효과적인 방법임을 보여주었으며, 특정 결함 구조를 통한 물성 제어의 가능성을 열었습니다.", "novelty": "화학적 도핑 없이 물리적인 이온 조사만으로 MTI의 위상적 물리량을 직접적으로 튜닝하는 기법을 제안하여, 독자 관심사인 MTI 물성 조절에 새로운 실험적 도구를 제시합니다.", "unresolved": "이온 조사에 의해 생성된 구체적인 결함 패턴이 전체 전자 구조의 위상적 불변량에 미치는 정량적 변화는 추가 연구가 필요합니다.", "future_work": "다른 위상 물질로의 응용 및 조사된 결함이 자기 구조에 미치는 미시적인 상호작용 분석이 필요합니다.", "concepts": [{"term": "MnBi2Te4", "why_emerged": "본질적인 자기 질서를 가진 위상 절연체를 구현하기 위해 필요.", "origin": "2019년경 여러 그룹(예: Otrokov et al.)에 의해 보고됨.", "connections": "위상 절연체, 양자 변칙 홀 효과, 자성 물질."}, {"term": "Anomalous Hall Effect (AHE)", "why_emerged": "전하 수송에서 자기적 산란과 Berry 곡률의 역할을 이해하기 위해 필요.", "origin": "Edwin Hall이 1881년에 발견.", "connections": "Berry 곡률, 자성 위상 물질, 양자 변칙 홀 효과."}, {"term": "Cation Antisite Disorder", "why_emerged": "결정 내 양이온 위치가 뒤바뀌며 전하 농도나 자기적 결합을 변화시키는 결함 기작 규명이 필요.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "도핑 효과, 격자 결함, 수송 특성 변화."}], "english_summary": ["Demonstrates ion irradiation as a tool to tune electronic and magnetic properties in MnBi2Te4.", "Low fluence irradiation effectively controls carrier concentration while preserving crystal structure.", "High fluence leads to layer-disordered phases that suppress the anomalous Hall conductivity significantly.", "Links the reduction in Hall response to the suppression of Berry curvature in the topological insulator."]}}, {"title": "Dispersion of low-energy optical excitations in NiPS3 explained by singlet polaron theory", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2610.15230", "authors": "I. J. Hamad, C. S. Helman, A. E. Feiguin, L. O. Manuel, A. A. Aligia", "last_authors": "L. O. Manuel, A. A. Aligia", "summary": "Optical and resonant inelastic X-ray scattering (RIXS) experiments in the van der Waals antiferromagnet NiPS$_3$ have revealed narrow excitonic resonances near 1.5 eV whose microscopic origin remains under debate. In this work we study the momentum dependence of these excitations using the singlet-polaron theory (SPT) previously developed for NiPS$_3$. Within its framework, we calculate the spectral function of the corresponding effective model and extract the dispersion of the resulting quasiparticles. The theory naturally predicts two singlet excitations whose dynamics arise from their propagation in the zig-zag antiferromagnetic background ($S=1$) coupled to two-magnon processes. We show that the dispersion of the lowest-energy quasiparticle agrees very well with the excitonic dispersion measured by RIXS, reproducing both its overall shape and bandwidth along high-symmetry directions of the Brillouin zone. Our results provide a consistent interpretation of the optical excitations in terms of dispersive singlet polarons, and suggest that similar mechanisms may govern excitonic dynamics in other layered van der Waals antiferromagnets.", "tier": "B_IMPORTANT_CONDMAT", "score": "9", "reason": "Interprets RIXS data in a vdW antiferromagnet; highly relevant spectroscopic study.", "tags": ["method", "NiPS3", "RIXS"], "image": "https://arxiv.org/html/2610.15230v1/orbital_e.png", "briefing": {"background": "층상 반데르발스 반강자성체인 NiPS3는 독특한 자성 기저 상태와 함께 광학적/RIXS 실험에서 관찰되는 낮은 에너지 여기 상태가 존재하여 강상관 전자계 연구의 핵심 모델 물질입니다.", "motivation": "NiPS3의 RIXS 데이터에서 관찰되는 1.5 eV 근처의 좁은 엑시톤 공명의 미시적 기원을 싱글렛 폴라론 이론(SPT)으로 설명하고자 합니다.", "result": "이 이론을 통해 계산된 준입자 분산 관계가 RIXS에서 측정한 엑시톤 분산과 매우 잘 일치함을 확인했습니다.", "implication": "NiPS3의 광학적 여기 현상이 단순히 자유로운 엑시톤이 아닌, 자기 배경과 결합된 '싱글렛 폴라론'의 역학으로 이해될 수 있음을 시사합니다.", "novelty": "복잡한 강상관 자성체에서의 준입자 동역학을 효과 모델로 성공적으로 설명함으로써, 향후 다른 van der Waals 자성체 연구에도 적용 가능한 프레임워크를 제공합니다.", "unresolved": "이 모델이 제안하는 싱글렛 폴라론 동역학이 다른 층상 반강자성체에서도 보편적으로 나타나는지는 아직 확인되지 않았습니다.", "future_work": "다른 층상 자성체에서의 분광학적 데이터와 모델 예측값 비교 및 편극 의존 RIXS 실험 검증.", "concepts": [{"term": "RIXS (Resonant Inelastic X-ray Scattering)", "why_emerged": "물질의 전하, 스핀, 궤도 자유도에 따른 저에너지 여기를 운동량 분해능을 가지고 측정하기 위해 필요.", "origin": "1990년대 초기 제안되어 2000년대 중반 이후 비약적으로 발전.", "connections": "중성자 산란, 분광학, 강상관 전자계."}, {"term": "Singlet Polaron", "why_emerged": "국소적인 스핀 싱글렛이 반강자성 배경 위에서 준입자처럼 이동하는 효과를 기술하기 위해 필요.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "엑시톤, 마그논, 강상관 자성체."}, {"term": "NiPS3", "why_emerged": "반데르발스 층상 구조 내에서 자기 질서와 전자 구조의 결합을 연구하기 위한 모델 플랫폼.", "origin": "오랫동안 연구되어 온 층상 칼코젠 화합물의 일종.", "connections": "van der Waals 물질, 반강자성, 엑시톤."}], "english_summary": ["Explains low-energy excitonic resonances in NiPS3 using singlet polaron theory (SPT).", "Calculated quasiparticle dispersion matches RIXS measurements of the excitonic bands.", "Reveals that excitations propagate in a zig-zag antiferromagnetic background coupled to two-magnon processes.", "Provides a universal mechanism for understanding excitonic dynamics in layered vdW antiferromagnets."]}}, {"title": "Electron state tomography from quasiparticle interference maps (Phys. Rev. B)", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2606.18858", "authors": "A. Razanajatovo, J. Cayssol, C. Dutreix", "last_authors": "J. Cayssol, C. Dutreix", "summary": "Characterizing electronic band structures requires precise knowledge of wave functions and their quantum geometry. Here, we introduce a tomography method to reconstruct the density matrix of electron states from quasiparticle interference maps around single impurities. We consider two-orbital models on a honeycomb lattice, relevant to graphene heterostructures and direct-gap semiconductors. For on-site impurities, backscattering between time-reversed states directly maps the density matrix populations and coherences into distinct orbital contributions in the interference map. While local probes usually lack orbital resolution, these orbital contributions transform under distinct symmetry group representations and can thus be disentangled to reveal the density matrix and quantum geometric tensor of the scattering states. This establishes impurities as tomographic probes for band structures in scanning tunneling microscopy using conventional, unpolarized tips.", "tier": "B_IMPORTANT_CONDMAT", "score": "9", "reason": "Development of electronic density matrix and quantum geometry reconstruction from scanning tunneling microscopy QPI data.", "tags": ["method:STM", "material:graphene", "topic:quantumgeometry"], "image": "https://arxiv.org/html/2606.18858v2/Figure1.png", "briefing": {"background": "STM(주사 터널링 현미경)은 물질 표면의 전자 상태를 측정하는 핵심 도구이지만, 직접적으로 궤도나 파동함수의 정보를 얻는 데는 한계가 있어 이를 보완할 방법이 필요합니다.", "motivation": "불순물에 의한 준입자 간섭(QPI) 패턴을 역으로 분석하여 전자 상태의 밀도 행렬과 양자 기하학적 정보를 추출하는 토모그래피 기법을 개발하고자 합니다.", "result": "시간 반전 상태 간의 산란을 이용해 파동함수의 궤도 성분과 밀도 행렬을 QPI 맵에서 분리해내는 이론적 기법을 확립했습니다.", "implication": "표준적인 STM 데이터를 사용하여 밴드 구조의 토폴로지와 궤도 정보를 고도로 정밀하게 도출할 수 있게 됩니다.", "novelty": "단순한 이미지 획득을 넘어, 일반적인 비편극 팁을 사용함에도 불구하고 밴드 구조의 양자 기하학적 텐서를 도출하는 강력한 '토모그래피'적 접근을 제시했습니다.", "unresolved": "실제 실험상의 노이즈 환경에서 정교한 궤도 정보를 얼마나 정밀하게 분리해낼 수 있는지에 대한 실증 연구가 필요합니다.", "future_work": "그래핀 외에 다른 복잡한 위상 물질(예: 위상 반금속)에 대한 적용 및 실험적 검증.", "concepts": [{"term": "Quasiparticle Interference (QPI)", "why_emerged": "표면의 불순물에 의한 산란파가 간섭을 일으키는 패턴을 통해 벌크 전자 밴드 구조를 탐색하기 위해 필요.", "origin": "2000년대 초반 J. E. Hoffman 등에 의해 그래핀 등에서 본격 활용.", "connections": "STM/STS, 밴드 구조 매핑, 산란 물리학."}, {"term": "Quantum Geometric Tensor", "why_emerged": "파동함수의 위상적 성질과 기하학적 분포(Berry 곡률 등을 포함)를 수학적으로 기술하기 위해 필요.", "origin": "J. P. Provost와 G. Vallee에 의해 1980년에 제안.", "connections": "Berry 위상, 위상 물성, 전자 구조."}, {"term": "Electron State Tomography", "why_emerged": "측정 데이터를 바탕으로 시스템의 미시적 상태를 재구성하는 역문제 해결 기법.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "역문제, 양자 상태 재구성, QPI."}], "english_summary": ["Proposes a new tomographic method to reconstruct the density matrix from QPI maps in STM.", "Uses backscattering between time-reversed states to disentangle orbital contributions.", "Enables extraction of the quantum geometric tensor using conventional unpolarized STM tips.", "Applicable to complex band structures in graphene heterostructures and topological materials."]}}, {"title": "Field-driven phase transition crossover in kagome antiferromagnet Mn3-xCoxSn", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2610.16189", "authors": "Shubhankar Paul, Chanchal Sow", "last_authors": "Shubhankar Paul, Chanchal Sow", "summary": "Mn$_3$Sn exhibits a complex magnetic phase diagram with multiple symmetry-breaking phenomena. Minute electron doping at the Mn site breaks the kagome lattice symmetry in Mn$_3$Sn. In this work, we exploited this to tune the order of the magnetic phase transition using magnetocaloric effect in Mn$_{3-x}$Co$_x$Sn single crystals. Pristine Mn$_3$Sn shows metallic behaviour with a spin-reorientation transition at 278 K, which shifts to 175 K upon Co doping. Additionally, Co doping also induces a weak-ferromagnetic transition near $\\approx 210$ K. The effect of Co doping results inverse to conventional magnetocaloric effect, with enhanced magnetic entropy change. Further, the scaled entropy change reveals a field-driven magnetic phase transition crossover from first order to second order in Mn$_{2.75}$Co$_{0.25}$Sn crystal. Based on experimental data, a new phase diagram is constructed, depicting the field evolution of various magnetic orders.", "tier": "B_IMPORTANT_CONDMAT", "score": "9", "reason": "Direct experimental study of kagome magnets relevant to anomalous Hall and TRSB.; demoted from A: broad CM, not direct user/project hit", "tags": ["kagome", "magnetism", "experiment"], "image": "https://arxiv.org/html/2610.16189v1/fig0.png", "briefing": {"background": "카고메 격자 구조를 가진 Mn3Sn은 베리 곡률과 관련된 비정상 홀 효과(AHE) 및 위상학적 성질로 인해 현대 응집물질물리학의 주요 연구 대상입니다. 이러한 시스템에서 자기 위상의 전이와 순서 매개변수를 제어하는 것은 양자 상태를 공학적으로 설계하는 데 핵심적입니다.", "motivation": "Mn3Sn의 Mn 사이트에 Co를 도핑하여 격자 대칭성을 파괴함으로써, 자기 위상 전이의 차수를 조절하고 외부 자기장에 따른 위상 다이어그램의 변화를 체계적으로 탐구하고자 했습니다.", "result": "Co 도핑을 통해 스핀 재배향 전이 온도를 제어하고, Mn2.75Co0.25Sn 결정에서 자기장 유도 자기 위상 전이가 1차에서 2차로 교차하는 현상을 관측했습니다.", "implication": "자기장과 도핑 농도를 통해 카고메 자성체의 위상 전이를 정밀하게 제어할 수 있음을 입증하여, 향후 위 tructures, Superconductivity, STM."}, {"term": "STS (Scanning Tunneling Spectroscopy)", "why_emerged": "표면의 국부적인 상태 밀도(LDOS)를 원자 단위에서 측정하기 위해 필요함.", "origin": "Gerd Binnig과 Heinrich Rohrer(1982)가 개발.", "connections": "Superconducting gap, Quasiparticle interference."}], "english_summary": ["Studied (SnS)1.17NbS2 misfit layered compounds via STM/STS.", "Resolved SnS- and NbS2-terminated surfaces at the atomic scale.", "Measured nearly uniform superconducting gaps despite the misfit structure.", "Provides insights into surface-bulk electronic correspondence in heterostructures."]}}, {"title": "Observation of a Novel Charge Density Wave Superstructure in Monolayer 1T-VS2 at Room Temperature and its Evolution in Multilayers", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2510.03800", "authors": "Samanta Pal, Kaustuv Chatterjee, Jyotirmoy Sau, et al.", "last_authors": "A. K. Raychaudhuri, Prabir Pal", "summary": "Spontaneous formation of charge density wave (CDW) superstructures in monolayers (MLs) of a two-dimensional (2D) crystal lattice is fundamental in understanding its complex quantum states. We report a successful top-down liquid phase exfoliation and stamp transfer process (LPESTP) to create ML VS\\textsubscript{2}, undergoing a CDW transition at room temperature. Using high-resolution transmission electron microscopy (HRTEM) and electron diffraction (ED), we observed the coexistence of 1T and 2H polymorphic phases in VS\\textsubscript{2} at room temperature, and only the 1T phase undergoes CDW transition. We discovered a novel incommensurate CDW superstructure ($\\sqrt{7} \\times \\sqrt{7}$) R19.1\\textsuperscript{o} in ML 1T-VS\\textsubscript{2}. With an increase in the number of layers, the CDW order changes to a commensurate ($2 \\times 2\\times 1$) superstructure. Using angle-dependent photoelectron spectroscopy and TEM, we have shown that vanadium atoms self-intercalate as V\\textsuperscript{3+} ions in multilayer VS\\textsubscript{2} and are responsible for the evolution of the CDW superstructure from the incommensurate ($\\sqrt{7} \\times \\sqrt{7}$) R 19.1\\textsuperscript{o} to the commensurate ($2\\times2\\times1$) order. We also report the observation of novel Moir\\'e superlattices in twisted bilayer 1T-VS\\textsubscript{2} flakes with trapped CDW superstructure of the monolayer. The density functional theory (DFT) calculation performed on ML 1T-VS\\textsubscript{2} show that the observed ($\\sqrt{7} \\times \\sqrt{7}$) R 19.1\\textsuperscript{o} CDW superstructure has lower energy compared to that of the pristine undistorted ML and the CDW instability is driven by formation of strong soft-phonon modes. Our findings provide an important platform for understanding the evolution of CDW superstructures in 1T-VS\\textsubscript{2} with layer numbers and V self-intercalation.", "tier": "B_IMPORTANT_CONDMAT", "score": "9", "reason": "Experimental observation of CDW in monolayer VS2 using PES and TEM; highly relevant material and topic.; demoted from A: broad CM, not direct user/project hit", "tags": ["CDW", "monolayer", "photoemission", "TMD"], "image": "https://arxiv.org/static/browse/0.3.4/images/arxiv-logo-fb.png", "briefing": {"background": "2D 전이금속 디칼코게나이드(TMD)의 단층에서 나타나는 전하 밀도 파(CDW)는 낮은 차원에서 전자 상관관계와 격자 왜곡이 결합된 상징적인 현상입니다. 특히 1T-VS2는 층 수와 도핑에 따라 매우 민감하게 변하는 전자적 특성을 가집니다.", "motivation": "단층 1T-VS2에서의 CDW 형성 기제와, 층 수가 증가하고 바나듐 이온이 자가 삽입됨에 따라 CDW 초구조가 어떻게 진화하는지 밝히고자 했습니다.", "result": "단층에서 실온 CDW(루트7x루트7)를 관측했으며, 층이 두꺼워질수록 V 이온의 삽입으로 인해 2x2x1 구조로 변화함을 확인했습니다.", "implication": "2D 물질의 두께와 자가 도핑(V self-intercalation)이 양자 위상을 조절하는 핵심 변수임을 확인하였으며, 이는 위상학적 물질 설계에 중요한 근거를 제공합니다.", "novelty": "실온에서 작동하는 단층 VS2의 CDW를 관측하고 그 구조적 진화 과정을 체계적으로 설명한 점이 매우 혁신적입니다.", "unresolved": "관측된 CDW와 1T-VS2의 자기적 특성 간의 긴밀한 연결 고리에 대해서는 추가적인 자기 민감도 측정 등이 요구됩니다.", "future_work": "관측된 CDW 상태에서의 Berry 곡률 및 관련 수송 현상에 대한 연구가 기대됩니다.", "concepts": [{"term": "전하 밀도 파 (CDW)", "why_emerged": "전자와 격자의 상호작용으로 인해 전하 밀도가 e weak-coupling d-wave limit, signifying a crossover from a phase-fluctuating two-dimensional regime to a globally coherent three-dimensional state. Upon compression to 37 GPa, the superconducting condensate is completely quenched into an insulating-like state, yet the pseudogap persists. The extended phase diagram reveals an unambiguous decoupling between the pseudogap and superconductivity, imposing stringent constraints on microscopic theories of high-temperature superconductivity.", "tier": "B_IMPORTANT_CONDMAT", "score": "9", "reason": "High-impact ultrafast spectroscopy on BSCCO investigating pseudogap and superconductivity under pressure.", "tags": ["experiment", "cuprates", "pseudogap"], "image": "https://arxiv.org/static/browse/0.3.4/images/arxiv-logo-fb.png", "briefing": {"background": "고온 초전도체인 구리 산화물(cuprates)에서 의사갭(pseudogap)과 초전도 현상의 상관관계는 수십 년간 논쟁의 핵심이었습니다. 의사갭이 초전도의 전구체인지, 아니면 별도의 질서인지 밝히는 것은 고온 초전도 메커니즘 이해에 필수적입니다.", "motivation": "정수압(hydrostatic pressure)이라는 깨끗한 튜닝 파라미터를 사용하여 압력에 따른 의사갭과 초전도 상태의 진화를 추적함으로써 두 현상의 물리적 독립성을 검증하고자 합니다.", "result": "초고압(최대 37 GPa) 환경에서 초전도는 완전히 사라지지만 의사갭은 지속됨을 확인했습니다. 또한, 압력 증가에 따라 의사갭의 시작 온도(T*)는 상승하나 에너지갭(ΔPG)은 억제되는 반면, 초전도 상태는 돔 형태의 궤적을 보이며 뚜렷하게 분리(decoupling)되는 양상을 보입니다.", "implication": "의사갭과 초전도는 서로 얽힌(intertwined) 질서가 아니며, 두 현상이 독립적인 물리적 기원을 가질 가능성을 강하게 시사합니다. 이는 고온 초전도 이론 모델의 범위를 대폭 축소하는 중요한 제약 조건을 제공합니다.", "novelty": "기존에는 저압 실험이 주를 이루었으나, 37 GPa까지의 고압 환경에서 초전도를 완전히 끄고도 의사갭이 남는 것을 관찰하여 두 상의 분리를 명확히 입증했습니다. 고온 초전도 연구의 고전적인 질문에 대한 결정적 증거를 제시합니다.", "unresolved": "초전도가 완전히 억제된 상태에서 관찰되는 절연체와 유사한 상태의 상세한 본질과, 의사갭이 왜 초전도와 독립적으로 존재하는지에 대한 미시적 기원은 여전히 미해결 상태입니다.", "future_work": "다른 도핑 수준의 구리 산화물이나 다층 구조 시스템에서 이 압력 효과가 보편적인지 확인하는 추가적인 고압 전기전도도 및 분광학적 연구가 필요합니다.", "concepts": [{"term": "Pseudogap", "why_emerged": "초전도 전이 온도(Tc) 이상에서 페르미 준위 근처의 상태 밀도가 일부 손실되는 현상을 설명하기 위해 등장했습니다.", "origin": "1990년대 초기 NMR 및 광학 분광학 연구를 통해 학계에 알려졌습니다.", "connections": "Cuprate의 복잡한 위상 도표 및 d-wave 대칭성과 밀접하게 연결되어 있습니다."}, {"term": "Bilayer
