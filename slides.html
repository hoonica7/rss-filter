<title>Daily Paper Slideshow</title>
<style>
  :root {
    color-scheme: light;
    --bg: #f6f7f4;
    --paper: #ffffff;
    --ink: #111827;
    --muted: #64748b;
    --line: #d8ddd2;
    --accent: #176b87;
    --accent-2: #9a3412;
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; overflow: auto; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: var(--bg); color: var(--ink); }
  .shell { max-width: 1500px; min-height: 100vh; margin: 0 auto; padding: 14px 18px; display: flex; flex-direction: column; }
  .topbar { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 16px; }
  .top-actions { display: flex; align-items: center; gap: 10px; }
  .topbar a, button { border: 1px solid var(--line); border-radius: 8px; background: var(--paper); color: var(--ink); padding: 10px 14px; font-weight: 700; text-decoration: none; cursor: pointer; }
  button.primary { background: var(--accent); border-color: var(--accent); color: white; }
  button:disabled { opacity: 0.45; cursor: not-allowed; }
  .counter { color: var(--muted); font-weight: 700; }
  .slide { min-height: calc(100vh - 82px); background: var(--paper); border: 1px solid var(--line); border-radius: 10px; padding: 18px; box-shadow: 0 18px 42px rgba(15, 23, 42, 0.10); display: grid; grid-template-columns: minmax(310px, 0.86fr) minmax(0, 1.55fr); gap: 18px; overflow: visible; }
  .paper-head { min-width: 0; min-height: 0; overflow: visible; display: flex; flex-direction: column; gap: 12px; }
  .figure { margin: 0; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: #f8fafc; }
  .figure img { display: block; width: 100%; max-height: 41vh; object-fit: contain; background: white; }
  .figure figcaption { padding: 7px 10px; color: var(--muted); font-size: 12px; line-height: 1.3; }
  .head-text { display: flex; flex-direction: column; gap: 9px; min-width: 0; }
  .badges { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .badge { border-radius: 999px; padding: 5px 9px; background: #eef2ff; color: #3730a3; font-size: 12px; font-weight: 800; }
  .score { background: #fee2e2; color: #991b1b; }
  h1 { margin: 0; font-size: 25px; line-height: 1.15; letter-spacing: 0; overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
  h1 a { color: inherit; text-decoration-color: rgba(23, 107, 135, 0.35); text-decoration-thickness: 2px; text-underline-offset: 4px; }
  h1 a:hover { color: var(--accent); text-decoration-color: var(--accent); }
  .meta, .authors, .why, .abstract { font-size: 13px; line-height: 1.45; }
  .meta, .authors { color: var(--muted); }
  .why strong, .abstract strong, .authors strong { color: var(--ink); }
  .authors { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .why { border-left: 4px solid var(--accent-2); padding-left: 10px; color: #374151; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .abstract { border-top: 1px solid var(--line); padding-top: 14px; color: #374151; }
  .original-abstract { border-top: 1px solid var(--line); padding-top: 10px; color: #374151; font-size: 11.5px; line-height: 1.35; overflow-wrap: anywhere; }
  .original-abstract strong { display: block; margin-bottom: 4px; color: var(--ink); }
  .tags { display: flex; flex-wrap: wrap; gap: 8px; }
  .tag { border-radius: 999px; padding: 4px 8px; background: #f1f5f9; color: #475569; font-size: 12px; font-weight: 700; }
  .head-text > .link { display: none; }
  .briefing { min-width: 0; min-height: 0; overflow: visible; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); grid-auto-rows: minmax(0, auto); align-content: start; gap: 11px 18px; border-top: 0; padding-top: 0; }
  .brief-section { min-width: 0; }
  .brief-section.wide { grid-column: 1 / -1; }
  .brief-section h2 { margin: 0 0 4px; font-size: 14px; line-height: 1.22; color: #0f766e; letter-spacing: 0; }
  .brief-section p, .brief-section li { margin: 0; font-size: 12.5px; line-height: 1.42; color: #1f2937; overflow-wrap: anywhere; }
  .brief-section ul { margin: 0; padding-left: 20px; }
  .concepts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 9px 14px; }
  .concept { border-top: 1px solid var(--line); padding-top: 7px; }
  .concept h3 { margin: 0 0 4px; font-size: 13px; color: #7c2d12; letter-spacing: 0; }
  .concept p { margin: 2px 0 0; font-size: 11.5px; line-height: 1.35; color: #374151; overflow-wrap: anywhere; }
  .concept b { color: #111827; }
  .link { color: var(--accent); font-weight: 800; text-decoration: none; }
  .empty { padding: 48px; background: var(--paper); border: 1px solid var(--line); border-radius: 12px; color: var(--muted); }
  @media (max-width: 860px) {
    .shell { padding: 14px; }
    .topbar, .top-actions { align-items: stretch; flex-direction: column; }
    .slide, .briefing, .concepts { grid-template-columns: 1fr; }
    .slide { min-height: auto; overflow: visible; display: grid; }
    h1 { font-size: 28px; }
  }
</style>

<script>
const slides = [{"title": "Microscopic signatures of an imaginary charge density wave in a kagome metal", "journal": "Nature_Physics", "source": "keyword", "link": "https://www.nature.com/articles/s41567-026-03339-8", "authors": "S. Suetsugu, F. Hori, M. Shibata, et al.", "last_authors": "H. Kontani, Y. Matsuda", "summary": "Nature Physics, Published online: 17 June 2026; doi:10.1038/s41567-026-03339-8 Whether imaginary charge density waves and their associated loop currents exist has remained an open question. Now signatures of this state have been observed in kagome metal CsV3Sb5, revealing spontaneous time-reversal symmetry breaking.", "tier": "A_MUST_READ", "score": "9", "reason": "title strong match: kagome metal", "tags": ["kagome", "CsV3Sb5", "V3Sb5", "chargedensitywave", "loopcurrent", "time-reversalsymmetrybreaking"], "image": "https://media.springernature.com/m685/springer-static/image/art%3A10.1038%2Fs41567-026-03339-8/MediaObjects/41567_2026_3339_Fig1_HTML.png", "briefing": {"background": "카고메 격자 물질은 기하학적 좌절과 특이한 밴드 구조(플랫 밴드, 디락 콘, 밴 안 호브 특이점)로 인해 강한 전자 상관관계와 토폴로지컬 특성을 동시에 보입니다. 최근 CsV3Sb5와 같은 AV3Sb5 계열에서 상온 근처의 전하 밀도 파동(CDW)과 초전도성이 발견되었으며, 특히 외부 자기장 없이도 시간 역전 대칭성(TRSB)이 깨지는 현상이 보고되어 그 기원에 대한 논란이 지속되어 왔습니다.", "motivation": "CsV3Sb5에서 관찰되는 시간 역전 대칭성 깨짐의 물리적 실체가 무엇인지 규명하는 것이 핵심 과제입니다. 이론적으로는 복소수 질서 파라미터를 갖는 '허수 전하 밀도 파동(iCDW)' 혹은 '궤도 루프 전류(orbital loop current)' 상태가 제시되었으나, 이를 뒷받침할 미시적인 증거가 부족한 상황이었습니다.", "result": "본 연구는 카고메 금속 CsV3Sb5에서 허수 전하 밀도 파동(imaginary CDW)의 미시적 징후를 관찰하였습니다. 연구진은 특정 실험적 서명을 통해 이 물질 내부에서 자발적으로 시간 역전 대칭성이 깨졌음을 확인하였으며, 이는 일반적인 전하 밀도 파동과는 구별되는 루프 전류 상태의 존재를 강하게 시사합니다.", "implication": "이 결과가 옳다면, CsV3Sb5의 CDW는 단순한 원자 위치의 변위뿐만 아니라 전자 흐름의 양자역학적 위상과 관련된 '위상적 CDW'임을 의미합니다. 이는 루프 전류 상태를 실험적으로 입증한 중대한 진전이며, 카고메 시스템에서의 특이 초전도 기작을 이해하는 새로운 틀을 제공합니다.", "novelty": "이론적으로만 논의되던 iCDW 및 관련 루프 전류 상태를 실제 물질에서 미시적 서명을 통해 확인했다는 점이 가장 큰 참신함입니다. 특히 사용자의 주된 관심사인 CsV3Sb5에서의 TRSB 기원을 직접적으로 다루고 있어 최우선 순위의 논문입니다.", "unresolved": "iCDW가 생성하는 자기 모멘트의 크기와 정밀한 공간적 분포, 그리고 이 상태가 극저온 초전도 상태와 구체적으로 어떻게 경쟁하거나 공존하는지에 대해서는 추가적인 연구가 필요합니다.", "future_work": "ARPES나 STM을 이용해 iCDW 상태에서의 밴드 구조 변화와 국소 전자 상태 밀도의 상관관계를 더 정밀하게 측정할 필요가 있으며, 외부 압력이나 도핑에 따른 iCDW와 초전도성의 상전이도 분석 대상입니다.", "concepts": [{"term": "Imaginary Charge Density Wave (iCDW)", "why_emerged": "표준적인 CDW는 전하 밀도의 실수 부분만 변하지만, 시간 역전 대칭성 깨짐을 설명하기 위해 복소수 질서 파라미터(위상 이동)를 갖는 모델이 제안되었습니다.", "origin": "Varma 등이 루프 전류 모델과 관련하여 이론적으로 제시함 (초록 정보만으로는 특정하기 어려움)", "connections": "Loop current, Time-reversal symmetry breaking, Chiral CDW"}, {"term": "Kagome Metal", "why_emerged": "정삼각형과 정육각형이 교대로 배치된 격자 구조에서 발생하는 좌절과 특이 밴드 구조를 연구하기 위해 등장했습니다.", "origin": "일본의 대나무 바구니 패턴(Kagome)에서 유래", "connections": "Frustrated magnetism, Flat bands, Dirac semimetals"}, {"term": "Loop Current", "why_emerged": "스핀 자기 모멘트 없이도 궤도 운동을 통해 시간 역전 대칭성을 깰 수 있는 메커니즘으로 고안되었습니다.", "origin": "C. M. Varma (1997년경, 구리 산화물 초전도체 관련)", "connections": "Orbital angular momentum, TRSB, iCDW"}], "english_summary": ["The study reports microscopic evidence for an imaginary charge density wave (iCDW) in the kagome metal CsV3Sb5.", "The observed state is associated with spontaneous time-reversal symmetry breaking, resolving long-standing debates about the origin of TRSB in this system.", "The findings link the iCDW to the long-sought orbital loop current state in kagome lattices.", "This work provides a crucial experimental foundation for understanding the interplay between unconventional CDW and superconductivity."]}}, {"title": "Observation of Switchable Chiral Magnons in an Altermagnet", "journal": "PRL_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/m8lc-f8gk", "authors": "Zheyuan Liu, Hodaka Kikuchi, Zijun Wei, et al.", "last_authors": "Igor A. Zaliznyak, Takatsugu Masuda", "summary": "Author(s): Zheyuan Liu, Hodaka Kikuchi, Zijun Wei, Shinichiro Asai, Mechthild Enderle, Ursula B. Hansen, Vasile O. Garlea, Manh D. Le, Gøran J. Nilsen, Igor A. Zaliznyak, and Takatsugu Masuda Polarized inelastic neutron scattering gives the first unambiguous evidence of chirality of the split magnon bands in altermagnetic MnTe. [Phys. Rev. Lett. 136, 236705] Published Fri Jun 12, 2026", "tier": "A_MUST_READ", "score": "9", "reason": "Experimental observation of chiral magnons in an altermagnet using neutron scattering.", "tags": ["altermagnetism", "neutronscattering", "magnons", "magnetism"], "image": "", "briefing": {"background": "알터마그네티즘(Altermagnetism)은 강자성(FM)과 반강자성(AFM)의 특징을 동시에 갖는 새로운 자성 분류입니다. 반강자성체처럼 순 자화(Net magnetization)는 0이지만, 강자성체처럼 운동량 공간에서 스핀 할당(Spin splitting)이 일어나 상반된 스핀 밴드가 분리됩니다.", "motivation": "알터마그네트의 독특한 대칭성이 마그논(Magnon)과 같은 기본 들뜨기(Excitation)에 어떻게 투영되는지, 특히 스핀 분리된 마그논 밴드와 그 키랄성(Chirality)을 실험적으로 직접 증명할 필요가 있었습니다.", "result": "편극 비탄성 중성자 산란(Polarized INS) 실험을 통해 알터마그네트 후보 물질인 MnTe에서 분리된 마그논 밴드의 키랄성을 세계 최초로 명확하게 관찰하였습니다. 연구진은 특정 대칭성 하에서 마그논 밴드가 갈라지고 각각 고유한 회전 방향(키랄성)을 가짐을 확인했습니다.", "implication": "알터마그네틱 재료가 스핀-편극된 정보 전달 매개체로서 사용될 수 있음을 물리학적으로 확증했습니다. 순 자화가 없음에도 불구하고 스핀 정보를 선택적으로 제어할 수 있는 새로운 스핀트로닉스 소자 개발의 가능성을 열었습니다.", "novelty": "알터마그네트의 핵심 특성인 '스핀 분리된 여기 상태'를 중성자 산란으로 직접 보여준 기념비적인 연구입니다. 사용자의 관심사인 알터마그네티즘과 중성자 산란을 결합한 매우 높은 관련성의 논문입니다.", "unresolved": "외부 전기장이나 변형(Strain)을 통해 이러한 키랄 마그논을 얼마나 효율적으로 스위칭하고 제어할 수 있는지에 대한 실용적 검증이 남아 있습니다.", "future_work": "다양한 알터마그네트 후보 물질(RuO2, MnF2 등)에서 유사한 마그논 거동을 확인하고, 이를 이용한 마그논 스핀 트랜스포트 실험이 이어질 것으로 예상됩니다.", "concepts": [{"term": "Altermagnetism", "why_emerged": "기존 FM/AFM 이분법으로 설명되지 않는, 결정 대칭성에 기인한 스핀 분리 현상을 정의하기 위해 2022년경 제안되었습니다.", "origin": "Libor Šmejkal, Jairo Sinova, Tomáš Jungwirth 등", "connections": "Collinear antiferromagnetism, Spin-splitting, Spintronics"}, {"term": "Chiral Magnons", "why_emerged": "마그논의 스핀 세차 운동 방향에 따라 서로 다른 물리적 응답을 나타내기 때문에 그 특성을 구별할 필요가 있습니다.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "Polarized neutron scattering, Berry curvature in magnons"}, {"term": "MnTe", "why_emerged": "육방정계 구조를 가진 반강자성체로, 최근 알터마그네틱 특성을 보일 것으로 예측되어 집중 연구되고 있습니다.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "Hexagonal lattice, Altermagnet candidate"}], "english_summary": ["This paper reports the first unambiguous observation of chiral magnons in the altermagnet MnTe using polarized inelastic neutron scattering.", "The results confirm that altermagnets exhibit spin-split magnon bands with distinct chiralities, despite having zero net magnetization.", "The study experimentally validates the unique symmetry-protected spin excitations predicted for altermagnetic materials.", "These findings pave the way for utilizing altermagnets in next-generation spintronic devices via magnon manipulation."]}}, {"title": "Room-Temperature Intrinsic Nonlinear Planar Hall Effect in TaIrTe4", "journal": "PRL_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/hbdj-2hgf", "authors": "Chang Jiang, Fan Yang, Yu Zhao, et al.", "last_authors": "Shaoming Dong, Faxian Xiu", "summary": "Author(s): Chang Jiang, Fan Yang, Yu Zhao, Jinshan Yang, Peng Yu, Huiying Liu, Yuda Zhang, Zehao Jia, Xiangyu Cao, Li Tian, Jingyi Yan, Zheng Liu, Zhongkai Liu, Xian-Lei Sheng, Cong Xiao, Shengyuan A. Yang, Shaoming Dong, and Faxian Xiu A room-temperature intrinsic nonlinear planar Hall effect in the nonmagnetic topological semimetal TaIrTe 4 reveals how an in-plane magnetic field generates a Berry-connection-polarizability dipole through an orbital mechanism. [Phys. Rev. Lett. 136, 236302] Published Fri Jun 12, 2026", "tier": "A_MUST_READ", "score": "9", "reason": "Experimental study of nonlinear Hall effect in a relevant topological telluride semimetal.", "tags": ["topologicalsemimetal", "Halleffect", "tellurides", "transport"], "image": "", "briefing": {"background": "비선형 홀 효과(Nonlinear Hall Effect)는 시간 역전 대칭성이 보존되는 비자성 시스템에서도 베리 곡률 쌍극자(Berry curvature dipole)가 존재할 경우 발생할 수 있는 현상입니다. 이는 양자 소자나 고주파 정류기 분야에서 큰 관심을 받고 있습니다.", "motivation": "TaIrTe4와 같은 토폴로지컬 반금속에서 상온에서도 작동하는 고성능의 내재적(Intrinsic) 비선형 홀 효과를 구현하고, 그 물리적 메커니즘을 규명하는 것이 목표입니다.", "result": "비자성 토폴로지컬 반금속 TaIrTe4에서 상온의 내재적 비선형 평면 홀 효과(NPHE)를 관찰 antumMonteCarlo"], "image": "https://media.springernature.com/m685/springer-static/image/art%3A10.1038%2Fs41586-026-10654-w/MediaObjects/41586_2026_10654_Fig1_HTML.png", "briefing": {"background": "2차원 전자 시스템에서 전자 간의 쿨롱 상호작용이 지배적이 되면, 전자들이 격자처럼 배열되는 위그너 결정(Wigner solid) 상태가 형성됩니다. 하지만 실제 물질의 불순물(quenched disorder)이 이 규칙적인 배열을 어떻게 방해하고 변형시키는지 관찰하는 것은 매우 도전적인 과제입니다.", "motivation": "STM을 통한 국부적 관찰과 양자 몬테카를로 계산을 결합하여, 불순물에 의한 위그너 고체의 무질서 상태가 정량적으로 어떻게 나타나는지 명확히 규명하고자 합니다.", "result": "원자 단위 해상도의 STM 데이터와 신경망 양자 상태(NQS) 기반의 시뮬레이션을 비교하여, 무질서가 유도하는 위그너 고체의 두 가지 서로 다른 상태를 성공적으로 식별했습니다.", "implication": "강한 상관관계와 무질서가 공존하는 시스템에서 위그너 결정의 미세 구조를 이해함으로써, 상관관계 물성 연구의 새로운 분석 프레임워크를 정립했습니다.", "novelty": "STM 이미지와 고성능 계산 모델을 직접 결합하여 무질서도를 정량적/정성적으로 분리했다는 점이 핵심입니다.", "unresolved": "이 연구 결과가 모든 2차원 시스템의 위그너 결정에 보편적으로 적용될 수 있는지에 대한 추가 검증이 필요합니다.", "future_work": "다양한 유형의 무질서(점 결함, 전위 등)가 위그너 결정의 동역학적 특성에 미치는 영향을 분석하는 후속 연구가 예상됩니다.", "concepts": [{"term": "위그너 결정", "why_emerged": "낮은 밀도에서 전자 간 척력이 운동 에너지보다 커질 때 형성되는 고전적인 전자 결정 상태.", "origin": "Eugene Wigner (1934년).", "connections": "강한 상관관계, 모아레(Moire) 초격자 내 전자 상관 물리와 연결."}, {"term": "신경망 양자 상태(NQS)", "why_emerged": "고차원 다체 문제의 파동 함수를 효율적으로 근사하기 위해 머신러닝 기법 도입.", "origin": "Carleo & Troyer (2017년).", "connections": "변분 몬테카를로, 강한 상관계 계산 물리학과 연결."}], "english_summary": ["Combines atomic-scale STM imaging with NQS-based quantum Monte Carlo simulations.", "Identifies two distinct regimes of disorder-induced effects on 2D Wigner solids.", "Establishes a robust framework for understanding correlated electron states under disorder.", "Highlights the utility of combining experimental local probes with advanced computational modeling."]}}, {"title": "Anomalous magneto-optical response at RuO2 / WSe2 van der Waals interface", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2606.20262", "authors": "Muhammad Hassan Shaikh, Abhijith Puthiya Veettil, Collin Maurtua, et al.", "last_authors": "Anderson Janotti, Chitraleema Chakraborty", "summary": "arXiv:2606.20262v1 Announce Type: new Abstract: Ruthenium dioxide ($\\mathrm{RuO_2}$) has been proposed as an altermagnetic candidate, although its magnetic ground state remains controversial. Here, we probe weak interfacial magnetic states at the surface of (001)-oriented $\\mathrm{RuO_2}$ films using the magnetic proximity effect (MPE) in a van der Waals heterostructure consisting of monolayer tungsten diselenide ($\\mathrm{WSe_2}$) atop $\\mathrm{RuO_2}$. Temperature-dependent magneto-optical spectroscopy reveals an anomalous excitonic energy shift and a deviation from conventional Varshni behavior below 55 K that are absent in an encapsulated $\\mathrm{WSe_2}$ control sample. The anomalous shift reverses sign upon field cooling with opposite magnetic field polarity, indicating a magnetic origin. Polarization-resolved measurements further show a nearly field-independent and fluctuating valley splitting in $\\mathrm{WSe_2 / RuO_2}$ in strong contrast to the conventional linear Zeeman splitting observed in the control bare $\\mathrm{WSe_2}$ sample. These results suggest that the valley states are governed predominantly by interfacial exchange fields associated with weak surface magnetic states in $\\mathrm{RuO_2}$, which do not produce a conventional linear Zeeman response within the applied magnetic field range. Importantly, this approach enables direct optical probing of emergent surface magnetism without introducing an additional ferromagnetic layer, positioning MPE-based optical probing as a tool for investigating weak surface magnetism and offering new possibilities for studying magnetic materials with controversial magnetic states.", "tier": "B_IMPORTANT_CONDMAT", "score": "9", "reason": "Probing emergent magnetism in RuO2 using vdW heterostructure exciton spectroscopy.", "tags": ["altermagnet", "vanderWaals", "heterostructure"], "image": "https://arxiv.org/html/2606.20262v1/x1.png", "briefing": {"background": "RuO2는 최근 알터마그네틱(altermagnetic) 후보 물질로 주목받고 있으나, 그 자기적 기저 상태는 여전히 논란의 여지가 많습니다. 특히 표면에서의 미세한 자기 상태를 직접 탐지하는 것은 응집물질물리학에서 중요한 난제입니다.", "motivation": "WSe2와 같은 반도체와의 반데르발스 이종접합을 만들어, 계면에서의 자기 근접 효과(MPE)를 통해 RuO2 표면의 자기적 특성을 광학적으로 탐사하고자 합니다.", "result": "55 K 이하에서 나타나는 특이한 엑시톤 에너지 이동과 자기장 의존적 계곡 분할(valley splitting) 현상을 발견하여, RuO2 표면에 존재하는 약한 자기 상태를 증명했습니다.", "implication": "강자성 층을 덧대지 않고도 이종접합 인터페이스만을 이용하여 알터마그네틱 후보 물질의 자기적 성질을 성공적으로 탐지할 수 있음을 보여주었습니다.", "novelty": "기존의 선형 Zeeman 효과와 대비되는 독특한 계곡 분할 양상을 확인하여, 알터마그네틱 물질의 복잡한 자기적 정체를 밝히는 새로운 실험적 도구를 제시했습니다.", "unresolved": "발견된 자기적 신호가 RuO2의 알터마그네틱 벌크 성질과 어떻게 직접적으로 대응되는지에 대한 추가적인 이론적 정리가 필요합니다.", "future_work": "RuO2 이외의 다른 알터마그네틱 후보군에 대해 본 광학적 근접 효과 측정법을 적용하여 일반성을 검증할 것입니다.", "concepts": [{"term": "알터마그네틱", "why_emerged": "기존 강자성/반강자성으로 분류되지 않는, 스핀과 격자 대칭성이 결합된 새로운 자기적 순서 체계.", "origin": "최근 5년 이내 이론적으로 제안됨.", "connections": "반강자성, 스핀트로닉스, 베리 곡률과 연결."}, {"term": "자기 근접 효과(MPE)", "why_emerged": "비자기성 층에 이웃한 자기성 층의 자기적 특성을 전달받아 물성을 변화시키는 현상을 관찰하기 위해.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "반데르발스 이종접합, 엑시톤 스핀트로닉스."}], "english_summary": ["Probes surface magnetism of RuO2 via WSe2/RuO2 van der Waals heterostructures.", "Detects anomalous excitonic energy shifts and fluctuating valley splitting below 55 K.", "Demonstrates a non-invasive optical method to investigate controversial magnetic states in altermagnets.", "Provides evidence of interfacial exchange fields without the need for additional ferromagnetic layers."]}}, {"title": "Excitonic spin torque in a magnetic semiconductor", "journal": "Nature_Materials", "source": "Gemini", "link": "https://www.nature.com/articles/s41563-026-02643-1", "authors": "Nicholas J. Brennan, Jiacheng Tang, Jalil Varela-Manjarres, et al.", "last_authors": "Yafei Ren, Youn Jue Bae", "summary": "Nature Materials, Published online: 15 June 2026; doi:10.1038/s41563-026-02643-1 Distinct magnon dynamics are observed at high excitation pump power in the two-dimensional antiferromagnetic semiconductor CrSBr t6", "authors": "Iftakhar Bin Elius, Nathan Valadez, Gyanendra Dhakal, et al.", "last_authors": "Dariusz Kaczorowski, Madhab Neupane", "summary": "Author(s): Iftakhar Bin Elius, Nathan Valadez, Gyanendra Dhakal, Volodymyr Buturlim, Sabin Regmi, Dante James, Peter Radanovich, Keng Tou Chu, Ellis Thompson, Matthew Yankowitz, Tetiana Romanova, Andrzej Ptok, Krzysztof Gofryk, Dariusz Kaczorowski, and Madhab Neupane Charge density wave (CDW) phenomena in low-dimensional rare-earth chalcogenides have drawn considerable interest owing to their interplay with lattice instabilities, electronic correlations, and magnetism. ${\\mathrm{EuTe}}_{4}$, which contains both mono- and bilayer Te pseudosquare nets together wit… [Phys. Rev. B 113, 235125] Published Mon Jun 15, 2026", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "CDW gap observation using electronic spectroscopy, very relevant to the user's CDW interests.", "tags": ["CDW", "electronicstructure", "spectroscopy"], "image": "", "briefing": {"background": "전하 밀도 파(CDW)는 낮은 차원의 물질에서 격자 불안정성과 전자 상관관계가 상호작용하며 나타나는 양자 상태로, 전자 구조의 변화를 연구하는 것이 중요합니다.", "motivation": "EuTe4는 Te 망을 포함하여 복합적인 구조를 가진 화합물로, CDW 형성에 따른 밴드갭의 변화를 명확히 규명할 필요가 있었습니다.", "result": "전자 분광법(ARPES 추정)을 사용하여 EuTe4에서 운동량에 의존하는 CDW 갭을 성공적으로 관측했습니다.", "implication": "희토류 칼코게나이드계 물질에서 격자 왜곡과 전자 상태 사이의 연결 고리를 구체화하였습니다.", "novelty": "EuTe4의 전자 구조에 대한 직접적인 분광학적 증거를 제시하여, 관련 물질군에서의 CDW 메커니즘 연구에 중요한 기초 데이터를 제공합니다.", "unresolved": "CDW 갭이 자기적 성질과 어떻게 구체적으로 결합되어 있는지(상호작용의 정도)는 향후 과제입니다.", "future_work": "온도 변화에 따른 갭의 닫힘 거동 연구 및 밴드 구조 변화의 동역학적 분석이 필요합니다.", "concepts": [{"term": "전하 밀도 파 (CDW)", "why_emerged": "저차원 시스템에서 페르미 표면의 네스팅(nesting)과 전자-포논 상호작용에 의해 전자 밀도가 주기적으로 변조되는 현상입니다.", "origin": "Rudolf Peierls(1955년)가 이론적으로 예측하였습니다.", "connections": "파이얼스 전이, 밴드갭 형성, 양자 상전이."}, {"term": "EuTe4", "why_emerged": "특이한 적층 구조를 가진 층상 물질로, 자기적 성질과 CDW의 공존 가능성 때문입니다.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "희토류 칼코게나이드, 위상 물질."}], "english_summary": ["Observed momentum-dependent CDW gap in EuTe4.", "Highlights interplay between lattice instability and electronic structure.", "Provides direct spectroscopic evidence for CDW states in rare-earth chalcogenides.", "Validates the role of pseudosquare Te nets in CDW formation."]}}, {"title": "Optical vortex probe of loop-current chirality in moiré materials", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/dlgp-bgbb", "authors": "Nobuhiko Yokoshi, Akihito Kato", "last_authors": "Nobuhiko Yokoshi, Akihito Kato", "summary": "Author(s): Nobuhiko Yokoshi and Akihito Kato We propose a symmetry-resolved optical probe of intrinsic loop-current chirality in moiré materials, with twisted bilayer graphene as a representative realization. Interlayer interference generates chiral electronic circulation on triangular plaquettes, giving rise to an intrinsic geometric chiralit… [Phys. Rev. B 113, 245303] Published Mon Jun 15, 2026", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Proposed probe for loop-currents in moiré materials, highly relevant to user interest in TRSB/loop-currents.", "tags": ["loop-current", "moiré", "spectroscopy"], "image": "", "briefing": {"background": "모아레 격자 시스템(twisted bilayer graphene 등)에서는 전자 간 상호작용과 기하학적 구조가 결합하여 평탄한 밴드가 형성되며, 여기서 시간 반전 대칭성 깨짐(TRSB)과 관련된 루프 전류(loop-current) 상태가 종종 이론적으로 제안되어 왔습니다.", "motivation": "이 논문은 모아레 소재에서 발생하는 미세한 루프 전류의 카이랄성을 실험적으로 검출하기 위해 광학적 소용돌이(optical vortex)를 이용한 대칭성 분해 프로브를 제안합니다.", "result": "층간 간섭이 삼각형 플래킷(plaquette) 구조에서 전자 순환을 유도하며, 광학적 소용돌이 빔을 통해 이러한 기하학적 카이랄성을 효과적으로 읽어낼 수 있음을 이론적으로 보였습니다.", "implication": "루프 전류가 유도하는 미세한 자성을 직접 검출하기 어려웠던 기존 한계를 극복하고, 광학적 기법을 통해 모아레 소재의 위상적 성질을 규명하는 새로운 도구가 될 수 있습니다.", "novelty": "기존의 ARPES나 STS 외에도, 광학적 빔 조절을 통해 비자명한 전자 구조를 탐지할 수 있는 광학적 접근법을 제시했다는 점에서 독자님의 관심사인 TRSB 연구에 중요한 방법론적 확장을 제공합니다.", "unresolved": "실제 실험적 구현 시 광학적 정렬 및 신호 대 잡음비(S/N ratio) 확보와 같은 기술적 난제가 남아 있습니다.", "future_work": "제안된 광학적 소용돌이 빔을 이용한 실제 실험적 시연 및 비틀림 각도에 따른 루프 전류 세기의 변화 관측.", "concepts": [{"term": "Optical vortex", "why_emerged": "빛의 위상 특이점(orbital angular momentum)을 활용해 물질의 카이랄성이나 특이한 전자기적 응답을 선택적으로 탐지하기 위해 고안되었습니다.", "origin": "Allen et al. (1992)에 의해 라게르-가우스 빔의 궤도 각운동량으로서 정립되었습니다.", "connections": "비선형 광학, 위상 전자기학, 광학적 핀셋과 연결됩니다."}, {"term": "Loop-current", "why_emerged": "강상관 전자계에서 자성 모멘트 없이도 나타날 수 있는 기묘한 질서 상태(hidden order)를 설명하기 위해 제안되었습니다.", "origin": "Varma (1997)에 의해 고온 초전도체 내의 가설적 질서로 유명해졌습니다.", "connections": "TRSB, 가구메 금속, 궤도 자기 모멘트와 밀접합니다."}], "english_summary": ["Proposes an optical vortex probe to detect loop-current chirality in moiré materials.", "Utilizes interlayer interference effects in triangular moiré plaquettes to generate distinct optical signatures.", "Provides a non-contact method to study TRSB states in twisted bilayer graphene systems.", "Offers a new spectroscopic tool for investigating hidden topological orders."]}}, {"title": "Revisiting the symmetry and optical phonons of altermagnetic α-MnTe", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/5hjw-f341", "authors": "Ece Uykur, Marcos V. Gonçalves-Faria, Sahana Rößler, et al.", "last_authors": "Manfred Helm, Alexander A. Tsirlin", "summary": "Author(s): Ece Uykur, Marcos V. Gonçalves-Faria, Sahana Rößler, Victoria A. Ginga, Marcus Schmidt, Stephan Winnerl, Manfred Helm, and Alexander A. Tsirlin Using infrared and Raman spectroscopies combined with high-resolution x-ray diffraction, we address several controversial aspects of altermagnetic $α$-MnTe. We show that mechanical stress applied to crystals of this material causes a drastic broadening of Bragg peaks that conceals signatures of addi… [Phys. Rev. B 113, 224107] Published Fri Jun 12, 2026", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Experimental spectroscopy/diffraction study of an altermagnetic material.", "tags": ["altermagnet", "phonon", "spectroscopy"], "image": "", "briefing": {"background": "알터자성(altermagnetism)은 시간 반전 대칭성이 깨져 있으면서도 순자화가 0인 새로운 자성 k.aps.org/doi/10.1103/yh3v-pwz9", "authors": "Henri Menke, Niklas Enderlein, Roland Gillen, et al.", "last_authors": "Giorgio Sangiovanni, Philipp Hansmann", "summary": "Author(s): Henri Menke, Niklas Enderlein, Roland Gillen, Yi-Ting Tseng, Michel Bockstedte, Janina Maultzsch, Giorgio Sangiovanni, and Philipp Hansmann We propose three transition-metal adatom systems on SiC surfaces as a versatile platform to realize massless Dirac fermions and flat bands with strong electronic correlations. Using density functional theory combined with the constrained random phase approximation and dynamical mean-field theory, we… [Phys. Rev. Lett. 136, 246503] Published Thu Jun 18, 2026", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "DFT+DMFT theory predicting correlated Dirac fermions and flat bands on real material surfaces.", "tags": ["theory", "electronic_structure", "DFT", "DMFT", "Dirac", "flat_bands", "correlated_electrons", "2D_materials"], "image": "", "briefing": {"background": "표면 물리 및 강상관 전자계 분야에서 특정 기하학적 구조를 가진 격자(예: 허니컴 격자)는 위상학적 성질과 강한 전자 상관관계를 유도할 수 있는 중요한 플랫폼입니다.", "motivation": "SiC 표면 위에 전이금속 원자를 증착하여 2차원적으로 정렬된 격자를 형성함으로써, 실험적으로 제어 가능한 환경에서 디락 페르미온과 평탄 밴드(Flat bands)의 물리적 특성을 구현하고자 합니다.", "result": "DFT 및 DMFT 계산을 통해 세 가지 전이금속 흡착 시스템이 강한 전자 상관관계 하에서 질량 없는 디락 페르미온과 평탄 밴드를 형성할 수 있음을 이론적으로 예측했습니다.", "implication": "이러한 시스템은 강상관 물리와 위상 물리가 결합된 신규 소재를 설계하는 데 중요한 가이드라인을 제공하며, 양자 다체계 연구를 위한 새로운 플랫폼이 될 수 있습니다.", "novelty": "이론적인 DFT+DMFT 접근 방식을 통해 SiC 기반의 실현 가능한 소재 후보군을 제시했으며, ARPES 등을 통한 향후 실험적 검증의 토대를 마련했다는 점에서 관련 연구자들에게 가치가 있습니다.", "unresolved": "실제 실험에서의 원자 정렬 상태나 무질서가 디락 페르미온의 성질에 미치는 영향은 완전히 규명되지 않았습니다.", "future_work": "제시된 시스템의 실험적 합성 및 ARPES를 이용한 실제 전자 구조 측정, 위상학적 성질의 검증이 필요합니다.", "concepts": [{"term": "Flat bands", "why_emerged": "운동 에너지가 억제되어 전자 상관관계 효과가 극대화되는 에너지 밴드를 연구하기 위해 도입됨.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "고온 초전도, 위상 절연체, 모아레 시스템 등에서의 강상관 현상과 연결됨."}, {"term": "DFT+DMFT", "why_emerged": "밀도범함수이론(DFT)만으로는 설명하기 어려운 강한 전자 상관효과를 도입되었습니다.", "origin": "Tony Skyrme (1960년대)", "connections": "Magnetic topological materials, spin-orbit coupling, Dzyaloshinskii-Moriya interaction."}, {"term": "전위(Dislocation)", "why_emerged": "결정 격자의 선 결함을 설명하기 위해 고체 물리학에서 도입된 개념입니다.", "origin": "Vito Volterra (1907년)", "connections": "Plasticity, elasticity, topological phase transitions."}], "english_summary": ["Investigates the topological transitions and elastic properties of skyrmion dislocations.", "Goes beyond Kittel's magnetic-polar analogy to describe core structure deformations.", "Provides insights into the stability and structural dynamics of skyrmion lattices.", "Relevant for magnetic topological materials and future spintronic applications."]}}, {"title": "Exploring the third dimension in quantum confinement of surface electrons", "journal": "Science_Advances", "source": "Gemini", "link": "https://doi.org/10.1126/sciadv.aed3926", "authors": "Lu Lyu, Tobias Eul, Wei Yao, et al.", "last_authors": "Martin Aeschlimann, Benjamin Stadtmüller", "summary": "Quantum confinement of surface electrons in two-dimensional metal-organic networks offers a powerful route to engineer electronic states for quantum and spintronic technologies. Here, we demonstrate the pivotal role of vertical variations in the surface potential on the quantum confinement of surface electrons. We investigate the confinement of both Shockley surface state and image-potential state electrons with their distinct vertical electron density distributions in a Cu-T4PT network on Cu(111). We find a substantial renormalization of the band mass of the image state, whereas the Shockley state remains almost unchanged. This notable divergence arises from the distinct three-dimensional potential landscape of the Cu-T4PT network, with a strong repulsive potential at the vertical position of the molecular backbone and leaky channels beneath the Cu coordination spheres. Our findings demonstrate the essential role of vertical potential engineering in designing quantum-confined states, thereby advancing control over electronic properties and quantum phenomena at the nanoscale.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Directly relevant to surface electronic states, quantum confinement, and electronic structure engineering.", "tags": ["electronicstructure", "quantumconfinement", "surfacescience", "spintronics"], "image": "", "briefing": {"background": "금속 표면의 2차원 네트워크에서 전자를 가두는 양자 구속 현상은 소형화된 스핀트로닉스 및 양자 소자 구현을 위한 핵심 기술입니다. 기존에는 주로 평면적인 측면에서의 구속에 집중했으나, 전자 밀도 분포에 따른 수직 방향의 전위차도 중요한 변수입니다.", "motivation": "Shockley 표면 상태와 image-potential 상태라는 서로 다른 수직적 밀도 분포를 가진 전자들이 금속-유기물 네트워크(Cu-T4PT/Cu(111)) 내에서 어떻게 다른 양자 구속 거동을 보이는지 확인하고자 했습니다.", "result": "Shockley 상태는 비교적 안정적인 반면, image-potential 상태는 수직 전위 구조(분자 골격의 척력 및 Cu 배위 중심 아래의 누설 채널)에 의해 유효 질량의 상당한 재규격화가 일어남을 관찰했습니다.", "implication": "표면 전자 상태를 제어할 때 단순히 2차원적 패턴뿐만 아니라 수직적 전위 환경(3D 포텐셜 랜드스케이프)을 정밀하게 설계해야 함을 시사합니다.", "novelty": "전자 상태마다 수직 밀도 분포가 다르다는 점에 착안하여, 3차원적 전위 엔지니어링이 전자 특성에 미치는 영향을 실험적으로 정량화했다는 점이 중요합니다.", "unresolved": "특정 분자 네트워크 구조에서의 결과이므로, 다른 다양한 분자 기판 조합에서도 보편적으로 적용 가능한 수직 전위 엔지니어링 규칙 확립이 필요합니다.", "future_work": "다양한 분자 배치와 기판 조합을 통해 수직 전위 구조를 체계적으로 변화시켜 전자 상태의 질량 및 밴드 구조를 능동적으로 제어하는 실험 연구가 기대됩니다.", "concepts": [{"term": "Shockley surface state", "why_emerged": "금속 표면의 주기적 전위가 끊기면서 발생하는 전위 장벽으로 인해 표면에 국한되는 전자 상태가 이론적으로 예견되었습니다.", "origin": "William Shockley(1939년).", "connections": "Tamm 상태, 금속 표면의 전자 구조 연구, ARPES를 통한 표면 상태 관측."}, {"term": "Image-potential state", "why_emerged": "표면 밖으로 나가는 전자가 금속 내 전자들을 밀어내며 생기는 상호작용으로 인해 표면 근처에 형성되는 일종의 리드버그 상태가 필요했습니다.", "origin": "1970년대 이후 표면 과학 연구에서 실험적으로 확인.", "connections": "2PPE(Two-photon photoemission), 양자 구속 연구."}], "english_summary": ["The study examines quantum confinement of surface electrons in metal-organic networks.", "It compares Shockley states and image-potential states on Cu-T4PT/Cu(111) surfaces.", "Vertical potential variations significantly impact the effective mass of image-potential states.", "The findings highlight the necessity of 3D potential engineering for nanoscale device design."]}}, {"title": "Symmetry enforced quantum spin Hall effect in Altermagnets", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2606.19903", "authors": "Fanzheng Chen, Lixin Zhang, Shuaishuai Niu, Junfeng Ren, Weijiang Gong, Xiangru Kong", "last_authors": "Weijiang Gong, Xiangru Kong", "summary": "arXiv:2606.19903v1 Announce Type: new Abstract: The quantum spin Hall effect (QSHE) has attracted widespread attention due to its dissipationless transport, which is protected by non-trivial topological invariants and helical edge states. Because even weak magnetic disorder can destroy the stability of topological quantum states, current research on the QSHE has primarily focused on non-magnetic materials. In this work, we extend the research scope of the QSHE to altermagnets. We establish the relevant symmetry constraints and identify all magnetic point groups that can realize the altermagnetic QSHE. Symmetry analysis reveals that pronounced spin-valley locking or spin-valley-layer locking universally exists in these systems. The concerted interaction between band inversion and spin-valley locking collectively gives rise to the helical edge states. Using first-principles calculations and theoretical models, we demonstrate that monolayer Nb2SeTeO exhibits an altermagnetic QSHE characterized by spin-valley locking, while bilayer Hf3Se3Te2 manifests an altermagnetic QSHE featuring spin-valley-layer locking. This work clarifies the intrinsic symmetry correlation between altermagnetism and quantum spin Hall topological phases, providing a brand-new theoretical perspective and research platform for exploring magnetic topological systems and developing next-generation spintronic devices", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Combines QSHE and altermagnetism; highly relevant to current research interests in magnetic topological materials.", "tags": ["altermagnet", "quantumspinHall", "topological"], "image": "https://arxiv.org/html/2606.19903v1/Fig1.png", "briefing": {"background": "위상 절연체와 양자 스핀 홀 효과(QSHE)는 자기적 섭동에 취약합니다. 최근 등장한 altermagnetism(교대 자성)은 자성체이면서도 독특한 대칭성 기반의 비자기적 특성을 보존할 수 있어, 위상 물질 연구의 새로운 돌파구로 주목받고 있습니다.", "motivation": "자성 질서가 존재하는 환경에서도 QSHE가 발현될 수 있도록, altermagnet의 대칭성 조건을 파악하고 이를 만족하는 후보 물질을 찾고자 했습니다.", "result": "특정 자기 점군에서 스핀-밸리 결합 또는 스핀-밸리-층 결합이 보호하는 QSHE의 존재를 이론적으로 확인했습니다. 후보 물질로 Nb2SeTeO(단층)와 Hf3Se3Te2(이층)를 제시했습니다.", "implication": "자기적 질서가 위상 상태를 파괴하지 않고 오히려 독특한 스핀-밸리 정보를 보호하는 플랫폼이 될 수 있음을 입증했습니다.", "novelty": "자성체에서는 불가능하다고 여겨졌던 QSHE를 altermagnet의 대칭성을 활용해 구현 가능한 영역으로 확장했습니다. 특히 귀하의 관심사인 자기 위상 물질 및 스핀트로닉스 분야에 새로운 후보군을 제공합니다.", "unresolved": "제시된 물질들의 실험적 합성 가능성과 ARPES 등을 통한 실제 엣지 상태 관측 및 위상 불변성 검증이 과제로 남아 있습니다.", "future_work": "이론적 후보 물질에 대한 실제 시편 제작과 엣지 상태 전도도 측정을 통한 QSHE 특성 실험적 검증이 수행될 것입니다.", "concepts": [{"term": "Altermagnetism", "why_emerged": "기존 강자성/반강자성으로 분류되지 않는, 결정 대칭성에 의해 결정되는 복합적인 자기적/스핀 분할 특성을 설명하기 위해 제안되었습니다.", "origin": "최근 2020년대 초반 이론적 정립 및 실험적 후보 물질 탐색 활발.", "connections": "반강자성, 스핀-밸리 결합, 위상물질."}, {"term": "Quantum Spin Hall Effect (QSHE)", "why_emerged": "에너지 손실 없는 전선 구현을 위해 스핀-궤도 결합에 의해 보호되는 헬리컬 엣지 상태가 필요했습니다.", "origin": "Kane & Mele(2005년), Bernevig 등(2006년 HgTe 양자우물에서 실험적 증명).", "connections": "위상 절연체, 스핀트로닉스, 베리 곡률."}], "english_summary": ["Extends QSHE research to altermagnetic systems via symmetry analysis.", "Identifies magnetic point groups enabling altermagnetic QSHE with spin-valley locking.", "Proposes Nb2SeTeO and Hf3Se3Te2 as material candidates for topological magnetic phases.", "Provides a theoretical platform for developing dissipationless spin-polarized transport."]}}, {"title": "Competition between charge-density-wave and superconducting orders on eight-leg square Hubbard cylinders", "journal": "npj_QuantumMaterials", "source": "Gemini", "link": "https://www.nature.com/articles/s41535-026-00910-7", "authors": "Hong-Chen Jiang, Thomas P. Devereaux, Steven A. Kivelson", "last_authors": "Thomas P. Devereaux, Steven A. Kivelson", "summary": "npj Quantum Materials, Published online: 10 June 2026; doi:10.1038/s41535-026-00910-7 Competition between charge-density-wave and superconducting orders on eight-leg square Hubbard cylinders", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Theoretical study of CDW-superconductivity competition, directly relevant to user's interests.", "tags": ["CDW", "superconductivity", "Hubbardmodel", "theory"], "image": "https://pubads.g.doubleclick.net/gampad/ad?iu=/285/npjquantmats.nature.com/article&sz=728x90&c=2142611852&t=pos%3Dtop%26type%3Darticle%26artid%3Ds41535-026-00910-7%26doi%3D10.1038/s41535-026-00910-7%26subjmeta%3D301,639,766%26kwrd%3DMaterials+science,Physics", "briefing": {"background": "Hubbard 모델은 강상관계 전자계의 물리, 특히 고온 초전도와 CDW(전하밀도파) 사이의 미묘한 경쟁과 협력을 이해하기 위한 표준적인 모델입니다.", "motivation": "8-leg Hubbard 실린더라는 계산 가능한 규모에서 CDW와 초전도성 사이의 상호작용과 경쟁 관계를 구체적으로 규명하고자 했습니다.", "result": "이 논문은 상호작용 강도와 전자 밀도에 따른 CDW와 초전도 질서의 상대적 안정성과 경쟁 양상을 시뮬레이션을 통해 보여줍니다.", "implication": "구리 산화물 등 실제 강상관계 물질에서 관찰되는 CDW와 초전도성의 복잡한 위상도를 이론적으로 이해할 수 있는 단서를 제공합니다.", "novelty": "대규모 수치 계산(DMRG 등 예상)을 통해 고차원적 실린더 환경에서의 양자 상태 경쟁을 규명하여, 실제 물질에서 관찰되는 현상들과 직접적인 비교 가능성을 높였습니다.", "unresolved": "실린더 크기 효과에 따른 한계가 존재하며, 2차원 무한계(bulk)에서의 물리와 완벽히 일치하는지에 대한 논의가 여전히 필요합니다.", "future_work": "더 넓은 실린더 혹은 2차원 평면으로의 확장을 통해 CDW와 초전도성 간의 미시적 결합 메커니즘을 상세화하는 연구가 이어질 것입니다.", "concepts": [{"term": "Hubbard Cylinder", "why_emerged": "2차원 평면에서의 계산 복잡도를 줄이면서도 2차원적 물리 현상(CDW, 초전도)을 유지하기 위해 고안된 기하학적 모델입니다.", "origin": "DMRG(Density Matrix Renormalization Group) 계산 기술과 함께 발전.", "connections": "강상관계 물리학, 고온 초전도체, 수치적 모의실험."}, {"term": "Charge Density Wave (CDW)", "why_emerged": "전자와 격자의 결합으로 인해 전자 밀도가 주기적으로 변하는 상태가 에너지적으로 안정할 때 나타나는 기저 상태입니다.", "origin": "Peierls 불안정성(1955년).", "connections": "전자-포논 결합, 페르미 면 중첩(nesting), 고온 초전도체."}], "english_summary": ["Investigates the interplay between CDW and superconductivity using eight-leg Hubbard cylinders.", "Employs advanced numerical techniques to map the phase competition in correlated systems.", "Clarifies the stability regions of superconducting and charge-ordered phases.", "Provides insights relevant to understanding high-Tc superconductivity mechanisms."]}}, {"title": "Interplay between altermagnetism and superconductivity in two dimensions: intertwined symmetries and singlet-triplet mixing", "journal": "npj_QuantumMaterials", "source": "Gemini", "link": "https://www.nature.com/articles/s41535-026-00898-0", "authors": "Kinga Jasiewicz, Paweł Wójcik, Michał P. Nowak, Michał Zegrodnik", "last_authors": "Michał P. Nowak, Michał Zegrodnik", "summary": "npj Quantum Materials, Published online: 15 June 2026; doi:10.1038/s41535-026-00898-0 Interplay between altermagnetism and superconductivity in two dimensions: intertwined symmetries and singlet-triplet mixing", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Altermagnetism and its interplay with superconductivity is a key interest.", "tags": ["altermagnetism", "superconductivity", "2Dmaterials", "theory"], "image": "https://media.springernature.com/m685/springer-static/image/art%3A10.1038%2Fs41535-026-00898-0/MediaObjects/41535_2026_898_Fig1_HTML.png", "briefing": {"background": "Altermagnetism(AM)은 기존의 강자성체와 반강자성체와는 다른 새로운 자기 질서로, 시간 반전 대칭성을 깨면서도 순자화율이 영인 독특한 성질을 가집니다. 이 시스템에서 초전도성이 어떻게 구현되는지는 현대 응집물질물리학의 중요한 주제입니다.", "motivation": "AM 상태에서 발생하는 특이한 대칭적 제약이 초전도 쌍의 상태(singlet 및 triplet)에 어떤 영향을 미치고, 두 상태가 어떻게 혼합되는지 규명하고자 합니다.", "result": "AM 물질의 스핀-궤도 결합 및 특유의 대칭성이 singlet과 triplet 초전도 쌍의 상호작용을 유도하며, 이는 에너지 밴드의 재구성을 통해 초전도 상태를 변화시킴을 이론적으로 제시합니다.", "implication": "AM 물질에서 초전도성은 단순히 기존의 BCS 이론을 따르지 않으며, 스핀 편향된 밴드 구조와 대칭적 특성이 결합된 새로운 유형의 위상적 초전도체나 스핀 필터링이 가능함을 시사합니다.", "novelty": "AM이라는 차세대 자기적 질서를 초전도성과 연결하여 다룬 점이 혁신적이며, 이는 저자의 주요 관심 분야인 자기 위상 물질 및 강상관 전자계 연구의 확장성을 제공합니다.", "unresolved": "실제 실험적 샘플(예: 특정 AM 후보 물질)에서의 초전도성 발현 가능성에 대한 구체적인 재료 후보군 제시는 부족합니다.", "future_work": "실제 실험적으로 구현 가능한 AM 초전도체 후보군 발굴 및 ARPES/STS를 이용한 밴드 구조 검증이 필요합니다.", "concepts": [{"term": "Altermagnetism", "why_emerged": "기존 분류로 설명되지 않는, 결정 대칭성을 기반으로 스핀 분할을 보이는 새로운 자기 위상을 기술하기 위해 도입됨.", "origin": "최근 2020년대 초반 J. Zelezny 등에 의해 체계화됨.", "connections": "반강자성체, 스핀-궤도 토크, 비자성 금속과의 이종접합 소자 연구 등."}, {"term": "Singlet-Triplet Mixing", "why_emerged": "공간 반전 또는 시간 반전 대칭성이 깨진 시스템에서 스핀 상태의 고유값인 singlet과 triplet이 더 이상 분리되지 않는 현상을 이해하기 위함.", "origin": "초전도 이론의 기본 토대 위에서 비중심대칭 초전도체와 함께 발전함.", "connections": "비중심대칭 초전도체, 위상 초전도체, Majorana 페르미온 연구."}], "english_summary": ["The study investigates the interplay between altermagnetism and superconductivity in 2D systems.", "It explores how symmetry constraints in altermagnets lead to singlet-triplet superconducting pair mixing.", "The theory suggests that spin-polarized bands in altermagnets fundamentally alter superconducting states.", "The findings provide a pathway for identifying unconventional superconducting phases in altermagnetic materials."]}}, {"title": "Spin-lattice coupling induced chiral phonons and their signature in Raman Circular Dichroism", "journal": "npj_QuantumMaterials", "source": "Gemini", "link": "https://www.nature.com/articles/s41535-026-00893-5", "authors": "Eduard Koller, Swetlana Swarup, Johannes Knolle, Natalia B. Perkins", "last_authors": "Johannes Knolle, Natalia B. Perkins", "summary": "npj Quantum Materials, Published online: 17 June 2026; doi:10.1038/s41535-026-00893-5 Spin-lattice coupling induced chiral phonons and their signature in Raman Circular Dichroism", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Spectroscopy involving circular dichroism and chiral phonons; relevant to broken symmetries.", "tags": ["spectroscopy", "chiral", "phonons", "brokensymmetry"], "image": "https://pubads.g.doubleclick.net/gampad/ad?iu=/285/npjquantmats.nature.com/article&sz=728x90&c=-275873478&t=pos%3Dtop%26type%3Darticle%26artid%3Ds41535-026-00893-5%26doi%3D10.1038/s41535-026-00893-5%26subjmeta%3D301,639,766%26kwrd%3DMaterials+science,Physics", "briefing": {"background": "스핀과 격자의 결합은 고체 내부의 에너지를 재분배하고 대칭성을 깨뜨리는 중요한 기작입니다. 최근에는 이러한 결합이 어떻게 카이랄성(chiral)을 갖는 포논을 유도하는지가 위상 물질 연구의 핵심 화두가 되었습니다.", "motivation": "자기적인 상호작용이 어떻게 격자의 진동 모드를 카이랄하게 만들며, 이를 실험적으로 어떻게 탐지할 수 있을지(특히 라만 분광법을 통해) 확인하고자 합니다.", "result": "스핀-격자 결합이 유도하는 카이랄 포논이 라만 원편광 이색성(Raman Circular Dichroism) 신호에 고유한 지문을 남긴다는 것을 이론적으로 입증했습니다.", "implication": "라만 산란을 통해 물질 내부의 자기적 질서와 격자 진동의 결합도를 직접적으로 관찰할 수 있는 강력한 분광학적 도구를 마련했습니다.", "novelty": "카이랄 포논이라는 미시적 현상을 거시적인 광학적 측정값(이색성)과 직접 연결하여 실험적 관측 가능성을 제시한 점이 독자에게 매우 유용합니다.", "unresolved": "특정 실제 물질에서의 정량적인 스핀-격자 결합 상수에 대한 실험적 보정은 여전히 도전 과제입니다.", "future_work": "다양한 위상 자성 물질에서 라만 원편광 이색성을 이용한 카이랄 포논 매핑 실험이 예상됩니다.", "concepts": [{"term": "Chiral Phonons", "why_emerged": "결정 구조나 자기적 환경에 의해 진동자가 특정 방향으로 회전하는 특성을 기술하기 위해 필요함.", "origin": "최근 수년간 위상 포논학 연구 과정에서 개념화됨.", "connections": "자기-격자 결합, 위상 포논, 원편광 광학."}, {"term": "Raman Circular Dichroism", "why_emerged": "재료의 카이랄성이나 자기 대칭성을 광학적으로 비파괴 검사하기 위한 고정밀 분광법.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "자기 광학 이색성, 라만 분광법, 카이랄성 분석."}], "english_summary": ["The paper explores spin-lattice coupling as a driver for chiral phonons in quantum materials.", "It establishes a theoretical link between chiral lattice excitations and Raman circular dichroism.", "The study shows that Raman spectroscopy can effectively probe broken symmetry states via these signatures.", "This provides a diagnostic tool for identifying magnetic and chiral order in candidate quantum materials."]}}, {"title": "Bilateral hydrogenation-induced high-Chern-number quantum anomalous Hall state in monolayer Cr2Ge2Te6", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/vjm5-xhl7", "authors": "Xiang Li, Xin-Wei Yi, Jing-Yang You, et al.", "last_authors": "Gang Su, Bo Gu", "summary": "Author(s): Xiang Li, Xin-Wei Yi, Jing-Yang You, Jia-Wen Li, Qing-Han Yang, Gang Su, and Bo Gu The pursuit of high-temperatur emical functionalization as a viable path for controlling topological states in van der Waals magnets."]}}, {"title": "Coupling of magnetic and lattice collective excitations in the two-dimensional van der Waals antiferromagnet FePS3", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/fwb8-fwjb", "authors": "Kartik Panda, Itzik Kapon, Dumitru Dumcenco, Dirk van der Marel, Alexey B. Kuzmenko, Nimrod Bachar", "last_authors": "Alexey B. Kuzmenko, Nimrod Bachar", "summary": "Author(s): Kartik Panda, Itzik Kapon, Dumitru Dumcenco, Dirk van der Marel, Alexey B. Kuzmenko, and Nimrod Bachar We combine polarized infrared magnetotransmission and Faraday angle rotation measurements to map the collective excitations of the van der Waals antiferromagnet ${\\mathrm{FePS}}_{3}$. Below the Néel temperature (${T}_{\\mathrm{N}}≈118\\phantom{\\rule{4pt}{0ex}}\\mathrm{K}$), the phonon spectrum becomes … [Phys. Rev. B 113, 235124] Published Mon Jun 15, 2026", "tier": "B_IMPORTANT_CONDMAT", "score": "7", "reason": "Experimental study of collective excitations in a vdW magnet.", "tags": ["vanderWaals", "antiferromagnet", "spectroscopy"], "image": "", "briefing": {"background": "반데르발스(vdW) 자성체는 층상 구조와 강한 상관관계, 그리고 외부 조절 가능성 때문에 현대 응집물질 물리학에서 저차원 자기 현상을 연구하는 핵심 플랫폼입니다.", "motivation": "FePS3는 2D 반강자성체로서, Néel 온도 이하에서 자기 질서와 격자 구조 사이의 상호작용이 어떻게 나타나는지 상세히 조사할 필요가 있었습니다.", "result": "편광 적외선 자성 투과 및 패러데이 회전 측정을 통해, 자기 질서가 형성될 때 포논 스펙트럼이 어떻게 변화하는지 정밀하게 매핑했습니다.", "implication": "자기적 들뜸과 격자 들뜸의 결합(spin-phonon coupling)을 명확히 함으로써, vdW 자성체에서의 다체 물리 및 준입자 상호작용 이해를 확장합니다.", "novelty": "자기-격자 상호작용을 광학적 방법으로 직접 조명하여 정밀도를 높였으며, 향후 vdW 기반 스핀트로닉스 재료 설계에 유용한 기초 데이터를 제공합니다.", "unresolved": "자기적 들뜸이 격자 구조를 왜곡시키는 구체적인 동역학적 경로에 대해서는 추가적인 시간 분해 분광법 연구가 필요할 것으로 보입니다.", "future_work": "다른 2D 반강자성체로의 확장 연구 및 자기장 조절에 따른 포논 모드의 위상 변화 조사.", "concepts": [{"term": "반데르발스 반강자성체", "why_emerged": "박리 가능한 2D 층상 구조 내에서 자기 질서를 제어하고 고유한 물리적 현상을 탐구하기 위해.", "origin": "초록 정보만으로는 특정하기 어려움", "con     });
    section.appendChild(concepts);
    briefing.appendChild(section);
  }
  if (b.english_summary && b.english_summary.length) { const section = document.createElement('section'); section.className = 'brief-section wide'; section.appendChild(textEl('h2', '', 'English Summary')); const ul = document.createElement('ul'); b.english_summary.slice(0, 5).forEach(line => ul.appendChild(textEl('li', '', line))); section.appendChild(ul); briefing.appendChild(section); }
  slideEl.appendChild(briefing);
  counterEl.textContent = `${index + 1} / ${slides.length}`;
  prevBtn.disabled = index === 0;
  nextBtn.disabled = index === slides.length - 1;
}
prevBtn.addEventListener('click', () => { index = Math.max(0, index - 1); render(); });
nextBtn.addEventListener('click', () => { index = Math.min(slides.length - 1, index + 1); render(); });
document.addEventListener('keydown', event => { if (event.key === 'ArrowLeft') prevBtn.click(); if (event.key === 'ArrowRight') nextBtn.click(); });
render();
</script>
</body>
</html>
