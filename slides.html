<title>Daily Paper Slideshow</title>
<style>
  :root {
    color-scheme: light;
    --bg: #f6f7f4;
    --paper: #ffffff;
    --ink: #111827;
    --muted: #64748b;
    --line: #d8ddd2;
    --accent: #176b87;
    --accent-2: #9a3412;
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; overflow: auto; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: var(--bg); color: var(--ink); }
  .shell { max-width: 1500px; min-height: 100vh; margin: 0 auto; padding: 14px 18px; display: flex; flex-direction: column; }
  .topbar { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 16px; }
  .top-actions { display: flex; align-items: center; gap: 10px; }
  .topbar a, button { border: 1px solid var(--line); border-radius: 8px; background: var(--paper); color: var(--ink); padding: 10px 14px; font-weight: 700; text-decoration: none; cursor: pointer; }
  button.primary { background: var(--accent); border-color: var(--accent); color: white; }
  button:disabled { opacity: 0.45; cursor: not-allowed; }
  .counter { color: var(--muted); font-weight: 700; }
  .slide { min-height: calc(100vh - 82px); background: var(--paper); border: 1px solid var(--line); border-radius: 10px; padding: 18px; box-shadow: 0 18px 42px rgba(15, 23, 42, 0.10); display: grid; grid-template-columns: minmax(310px, 0.86fr) minmax(0, 1.55fr); gap: 18px; overflow: visible; }
  .paper-head { min-width: 0; min-height: 0; overflow: visible; display: flex; flex-direction: column; gap: 12px; }
  .figure { margin: 0; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: #f8fafc; }
  .figure img { display: block; width: 100%; max-height: 41vh; object-fit: contain; background: white; }
  .figure figcaption { padding: 7px 10px; color: var(--muted); font-size: 12px; line-height: 1.3; }
  .head-text { display: flex; flex-direction: column; gap: 9px; min-width: 0; }
  .badges { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .badge { border-radius: 999px; padding: 5px 9px; background: #eef2ff; color: #3730a3; font-size: 12px; font-weight: 800; }
  .score { background: #fee2e2; color: #991b1b; }
  h1 { margin: 0; font-size: 25px; line-height: 1.15; letter-spacing: 0; overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
  h1 a { color: inherit; text-decoration-color: rgba(23, 107, 135, 0.35); text-decoration-thickness: 2px; text-underline-offset: 4px; }
  h1 a:hover { color: var(--accent); text-decoration-color: var(--accent); }
  .meta, .authors, .why, .abstract { font-size: 13px; line-height: 1.45; }
  .meta, .authors { color: var(--muted); }
  .why strong, .abstract strong, .authors strong { color: var(--ink); }
  .authors { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .why { border-left: 4px solid var(--accent-2); padding-left: 10px; color: #374151; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .abstract { border-top: 1px solid var(--line); padding-top: 14px; color: #374151; }
  .original-abstract { border-top: 1px solid var(--line); padding-top: 10px; color: #374151; font-size: 11.5px; line-height: 1.35; overflow-wrap: anywhere; }
  .original-abstract strong { display: block; margin-bottom: 4px; color: var(--ink); }
  .tags { display: flex; flex-wrap: wrap; gap: 8px; }
  .tag { border-radius: 999px; padding: 4px 8px; background: #f1f5f9; color: #475569; font-size: 12px; font-weight: 700; }
  .head-text > .link { display: none; }
  .briefing { min-width: 0; min-height: 0; overflow: visible; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); grid-auto-rows: minmax(0, auto); align-content: start; gap: 11px 18px; border-top: 0; padding-top: 0; }
  .brief-section { min-width: 0; }
  .brief-section.wide { grid-column: 1 / -1; }
  .brief-section h2 { margin: 0 0 4px; font-size: 14px; line-height: 1.22; color: #0f766e; letter-spacing: 0; }
  .brief-section p, .brief-section li { margin: 0; font-size: 12.5px; line-height: 1.42; color: #1f2937; overflow-wrap: anywhere; }
  .brief-section ul { margin: 0; padding-left: 20px; }
  .concepts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 9px 14px; }
  .concept { border-top: 1px solid var(--line); padding-top: 7px; }
  .concept h3 { margin: 0 0 4px; font-size: 13px; color: #7c2d12; letter-spacing: 0; }
  .concept p { margin: 2px 0 0; font-size: 11.5px; line-height: 1.35; color: #374151; overflow-wrap: anywhere; }
  .concept b { color: #111827; }
  .link { color: var(--accent); font-weight: 800; text-decoration: none; }
  .empty { padding: 48px; background: var(--paper); border: 1px solid var(--line); border-radius: 12px; color: var(--muted); }
  @media (max-width: 860px) {
    .shell { padding: 14px; }
    .topbar, .top-actions { align-items: stretch; flex-direction: column; }
    .slide, .briefing, .concepts { grid-template-columns: 1fr; }
    .slide { min-height: auto; overflow: visible; display: grid; }
    h1 { font-size: 28px; }
  }
</style>

<script>
const slides = [{"title": "Termination-selective Kondo hybridization of topological surface states in CeCuAs2", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2611.15022", "authors": "Bo Chen, Chen Zhang, Hao Liu, et al.", "last_authors": "Yu-Xia Duan, Jian-Qiao Meng", "summary": "Strongly correlated topological states in Kondo lattices represent a frontier in condensed matter physics, where the coupling between boundary electrons and localized f states can reshape the low-energy electronic structure. Here, we combine termination-resolved angle-resolved photoemission spectroscopy (ARPES), Ce 4$d \\rightarrow 4f$ resonant photoemission, and surface electronic structure calculations to investigate the Kondo lattice compound CeCuAs$_2$. Two distinct surface electronic structures are assigned to the As1 and CeAs2 terminations through their characteristic Fermi-surface geometries and termination-specific calculations. On CeAs2, a Dirac surface state associated with the calculated nontrivial bulk topology coexists with a weakly dispersive Ce 4$f$ band near $E_F$. Resonant photoemission identifies the low-energy 4$f$ character and reveals crystal-field-related fine structure in the energy range traversed by the Dirac branch. On cooling, the 4$f$ and Dirac regions both gain spectral weight, whereas a reference conduction-band region changes much less. Together, these observations provide spectroscopic evidence for termination-selective $f$-Dirac hybridization and the development of 4$f$ character in a topological surface state. Our results identify surface termination as a microscopic means of controlling the interplay between Kondo correlations and topological boundary electrons.", "tier": "A_MUST_READ", "score": "10", "reason": "Experimental ARPES study of Kondo-Dirac hybridization in a topological material, a direct hit for user's expertise.", "tags": ["ARPES", "experiment", "Kondo", "topological_materials", "Dirac", "correlated_electrons", "electronic_structure"], "image": "https://arxiv.org/html/2611.15022v1/Figure1.png", "briefing": {"background": "강상관 계와 위상 상태의 결합은 현대 고체물리학의 핵심 화두 중 하나입니다. 특히 국소화된 f-전자가 전도 전자와 결합하여 무거운 페르미온을 형성하는 콘도 격자(Kondo lattice) 시스템에서, 위상학적으로 보호받는 표면 상태(Topological Surface State)가 이 상관관계에 의해 어떻게 변하는지를 이해하는 것은 새로운 양자 상태 발견의 열쇠입니다.", "motivation": "콘도 격자 화합물인 CeCuAs2에서 국소 f-상태와 위상 표면 상태 사이의 상호작용을 조사하고자 했습니다. 특히 샘플의 표면 종단(termination)이 이들 사이의 하이브리드화(hybridization)에 어떤 영향을 미치는지 실험적으로 확인하는 것이 주요 목표입니다.", "result": "ARPES와 표면 전자 구조 계산을 통해 As1과 CeAs2라는 두 가지 뚜렷한 표면 상태를 식별했습니다. CeAs2 표면에서는 위상학적으로 자명하지 않은 벌크 구조에서 유래한 디락(Dirac) 표면 상태가 Ce 4f 밴드와 공존하며, 온도가 낮아짐에 따라 이 두 상태 사이의 하이브리드화가 선택적으로 발생함을 분광학적으로 확인했습니다.", "implication": "표면 종단을 선택함으로써 콘도 상관관계와 위상 경계 전자 사이의 상호작용을 미시적으로 제어할 수 있음을 시사합니다. 이는 표면 엔지니어링을 통해 강상관 위상 물질의 물성을 튜닝할 수 있는 가능성을 열어줍니다.", "novelty": "실험적으로 접근하기 까다로운 콘도-디락 하이브리드화를 종단 선택적(termination-selective) ARPES를 통해 직접 관찰했다는 점이 혁신적입니다. 독자의 주요 관심사인 ARPES와 위상 물질, 그리고 강상관 계의 교집합에 정확히 위치하는 연구입니다.", "unresolved": "표면 종단에 따른 하이브리드화 강도의 정량적 차이와 이것이 거시적인 수송 특성(transport properties)에 구체적으로 어떤 변화를 주는지에 대한 추가 연구가 필요해 보입니다.", "future_work": "다른 콘도 격자 시스템에서도 유사한 표면 의존성이 나타나는지 확인하고, 외부 압력이나 화학적 도핑을 통해 이러한 하이브리드화를 동적으로 제어하는 실험이 기대됩니다.", "concepts": [{"term": "Kondo lattice", "why_emerged": "금속 내의 국소 자성 불순물과 전도 전자 사이의 상호작용(콘도 효과)이 격자 구조에서 주기적으로 배열될 때 나타나는 독특한 물리적 현상을 설명하기 위해 등장했습니다.", "origin": "Jun Kondo(1964)의 단일 불순물 모델을 격자로 확장한 개념입니다.", "connections": "Heavy fermion systems, Kondo insulators, RKKY interaction"}, {"term": "Termination-resolved ARPES", "why_emerged": "결정 구조상 표면이 잘리는 위치에 따라 전자 구조가 판이하게 달라질 수 있는데, 이를 개별적으로 구별하여 측정하기 위해 필요합니다.", "origin": "초록 정보만으로는 특정하기 어려우나, 시료의 미세 구역을 측정하는 nano-ARPES 기술 등의 발전과 궤를 같이합니다.", "connections": "Micro-ARPES, Scanning Tunneling Spectroscopy (STS)"}, {"term": "Dirac surface state", "why_emerged": "위상 절연체나 위상 반금속의 경계에서 나타나는 질량이 없는 디락 페르미온의 거동을 설명하기 위해 도입되었습니다.", "origin": "Kane, Mele, Bernevig, Hughes, Zhang 등에 의한 위상 절연체 이론 연구(2005-2006)에서 확립되었습니다.", "connections": "Topological insulators, Spin-orbit coupling, Time-reversal symmetry"}, {"term": "Resonant photoemission", "why_emerged": "특정 원소의 가전자대(valence band) 기여도를 증폭시켜, 복잡한 밴드 구조 내에서 특정 궤도(예: Ce 4f)의 성분을 명확히 추출하기 위해 사용됩니다.", "origin": "X-선 흡수 끝단(absorption edge)에서의 전이 확률 증폭 현상을 이용하며, 광전 효과의 연장선상에 있습니다.", "connections": "XAS (X-ray Absorption Spectroscopy), ARPES"}], "english_summary": ["Investigated the interplay between Kondo correlations and topological surface states in CeCuAs2 using ARPES.", "Identified two distinct surface terminations, showing that Kondo-Dirac hybridization occurs selectively on the CeAs2 surface.", "Demonstrated that surface termination can serve as a microscopic tool to control the emergence of 4f character in topological states.", "The findings bridge the gap between heavy fermion physics and topological materials using advanced spectroscopic techniques."]}}, {"title": "Photoemission tomography of excitons: Momentum-space signatures of correlated electron-hole wave functions", "journal": "PRB_Recent", "source": "keyword", "link": "http://link.aps.org/doi/10.1103/z2w9-2q3c", "authors": "Siegfried Kaidisch, Amir Kleiner, Sivan Refaely-Abramson, Peter Puschnig, Christian S. Kern", "last_authors": "Peter Puschnig, Christian S. Kern", "summary": "The momentum-space signatures of excitons can be experimentally accessed through time-resolved (pump-probe) photoelectron spectroscopy. In this work, we develop a computational framework for exciton photoemission orbital tomography (exPOT) in periodic systems, enabling the simulation and interpretation of experimental observables within many-body perturbation theory. By connecting the G W + Bethe-Salpeter equation (BSE) approach to photoemission tomography, our formalism captures exciton photoemission in periodic systems, explicitly incorporating photoemission matrix element effects induced by the light-matter interaction via the probe pulse. The correlated nature of electrons and holes introduces distinct consequences for excitonic photoemission. Using the prototypical two-dimensional material hexagonal boron nitride, we demonstrate these effects, including a dependence of the photoemission angular distribution on the pump pulse polarization. Moreover, our framework extends to excitons with finite center-of-mass momentum, making it well-suited to studying momentum-dark excitons. This provides valuable insights into the microscopic nature of excitonic phenomena in quantum materials.", "tier": "A_MUST_READ", "score": "9", "reason": "title strong match: photoemission", "tags": ["photoemission", "correlated"], "image": "", "briefing": {"background": "엑시톤(exciton)은 전자와 정공이 쿨롱 상호작용으로 결합된 준입자로, 광학적 성질을 결정하는 핵심 요소입니다. 하지만 엑시톤은 전기적으로 중성이라 기존의 전자 구조 측정 방식으로는 그 파동함수의 모멘텀 공간 정보를 직접 얻기 어려웠습니다.", "motivation": "시간 분해 광전자 분광법(TR-ARPES)을 통해 측정된 데이터로부터 엑시톤의 모멘텀 공간 시그니처를 정확하게 추출하고 해석할 수 있는 이론적 및 계산적 프레임워크를 구축하고자 했습니다.", "result": "GW+BSE(Bethe-Salpeter Equation) 방법론을 광전자 방출 궤도 토모그래피와 결합한 'exPOT' 프레임워크를 개발했습니다. 이를 통해 hBN(육방정 질화붕소)에서 펌프 펄스의 편광에 따른 엑시톤 광전자 방출 양상을 시뮬레이션하고, 모멘텀 공간에서의 어두운 엑시톤(dark exciton)을 식별할 수 있음을 보여주었습니다.", "implication": "실험적으로 얻은 TR-ARPES 데이터를 통해 엑시톤의 상관된 전자-정공 파동함수를 직접적으로 재구성할 수 있는 이론적 기반을 마련했습니다. 이는 양자 소재의 여기 상태(excited state)를 이해하는 데 큰 진전을 의미합니다.", "novelty": "기존의 단일 입자 근사를 넘어 엑시톤의 다체(many-body) 특성을 광전자 방출 행렬 요소(matrix element) 효과와 함께 고려한 최초 수준의 계산 프레임워크입니다. 독자의 관심사인 ARPES의 해석 범위를 여기 상태 물리까지 확장해 줍니다.", "unresolved": "계산 복잡성으로 인해 매우 큰 단위 셀을 가진 시스템이나 무아레(Moire) 초격자 시스템에 바로 적용하기에는 효율성 개선이 필요할 수 있습니다.", "future_work": "전이금속 이칼코게나이드(TMD)나 무아레 시스템에서의 엑시톤 역학 해석에 적용될 것으로 예상되며, 실험 데이터와의 직접적인 정량적 비교 연구가 이어질 것입니다.", "concepts": [{"term": "Photoemission tomography", "why_emerged": "분자의 궤도 함수나 고체의 밴드 구조를 모멘텀 공간에서의 광전자 방출 강도 분포를 통해 시각화하고 재구성하기 위해 고안되었습니다.", "origin": "Peter Puschnig 등이 분자 시스템에서 먼저 제안하고 발전시켰습니다.", "connections": "ARPES, Orbital imaging, Plane-wave approximation"}, {"term": "Exciton (엑시톤)", "why_emerged": "반도체나 절연체에서 빛을 흡수했을 때 생성되는 전자-정공 쌍의 결합 상태를 설명하기 위해 도입되었습니다.", "origin": "Yakov Frenkel(1931)과 Wannier(1937) 등에 의해 이론적으로 확립되었습니다.", "connections": "Coulomb interaction, Many-body perturbation theory, Photoluminescence"}, {"term": "Bethe-Salpeter Equation (BSE)", "why_emerged": "입자 간의 상호작용을 고려하여 엑시톤과 같은 결합 상태의 에너지를 정확하게 계산하기 위해 다체론적 관점에서 개발되었습니다.", "origin": "Hans Bethe와 Edwin Salpeter가 1951년에 제안했습니다.", "connections": "GW approximation, Green's function, Many-body physics"}, {"term": "Momentum-dark exciton", "why_emerged": "모멘텀 보존 법칙으로 인해 빛과 직접 상호작용하지 않아 광학적 측정으로는 보이지 않는 엑시톤 상태를 설명하기 위해 필요합니다.", "origin": "초록 정보만으로는 특정하기 어려우나, 고체 광학 이론의 발전 과정에서 확립되었습니다.", "connections": "Indirect exciton, TR-ARPES, Intervalley scattering"}], "english_summary": ["Developed 'exPOT', a framework for simulating exciton signatures in photoemission spectroscopy using GW+BSE.", "The method captures matrix element effects and links exciton wavefunctions to momentum-space observables.", "Demonstrated the identification of momentum-dark excitons in hexagonal boron nitride (hBN).", "Provides a powerful tool for interpreting time-resolved ARPES data in the context of correlated electron-hole dynamics."]}}, {"title": "Sliding-controlled magnetoelectric coupling of ferroelectricity and altermagnetism in the van der Waals bilayers VPX3 (X=S,Se,Te)", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/91dy-wnd5", "authors": "Shaoxuan Qi, Yumeng Zhang, Siqi Dong, et al.", "last_authors": "Tingting Zhong, Qing Yang", "summary": "Two-dimensional materials have enabled unprecedented control over material properties through interlayer engineering, where mechanisms such as sliding can directly modify symmetry configurations and functionalities. Based on first-principles calculations, we demonstrate that bilayer $\\mathrm{VP}{X}_…", "tier": "A_MUST_READ", "score": "9", "reason": "Altermagnetism and van der Waals heterostructures, both strong interests, with first-principles calculations.", "tags": ["altermagnetism", "vanderWaals", "ferroelectricity", "first-principlestheory"], "image": "", "briefing": {"background": "알터마그네티즘(Altermagnetism)은 최근 발견된 자성 상태로, 순 자화는 0이지만 모멘텀 공간에서 스핀 할당이 비대칭적으로 나타나 스핀 분할 밴드를 가집니다. 반면 강유전성(Ferroelectricity)은 자발적인 전기 편향을 가집니다. 이 두 성질이 결합된 다강성(Multiferroics) 특성은 차세대 소자 구현에 매우 중요합니다.", "motivation": "2차원 반데르발스 층상 물질인 VPX3(X=S, Se, Te) 이중층에서 층 간의 '슬라이딩(sliding)'이라는 기계적 자유도를 통해 강유전성과 알터마그네티즘 사이의 결합을 제어할 수 있는지 조사하고자 했습니다.", "result": "제1원리 계산을 통해 VPX3 이중층의 슬라이딩 상태에 따라 대칭성이 변화하며, 이에 따라 강유전성과 알터마그네티즘이 서로 강하게 결합됨을 입증했습니다. 특히 특정 슬라이딩 배치에서 전기 편향의 방향에 따라 알터마그네틱 스핀 분할 양상을 조절할 수 있음을 보였습니다.", "implication": "외부 전기장이나 기계적 조작(슬라이딩)을 통해 자성 상태를 정밀하게 제어할 수 있는 새로운 경로를 제시합니다. 이는 나노 스케일의 자기 센서나 메모리 소자 개발에 응용될 수 있습니다.", "novelty": "독자의 관심사인 '알터마그네티즘'과 '반데르발스 이중층'을 '슬라이딩 엔지니어링'이라는 최신 트렌드와 결합했습니다. 특히 자기 구조와 전기적 분극의 상관관계를 대칭성 관점에서 명확히 해석했습니다.", "unresolved": "계산 결과의 실험적 검증이 필요하며, 실제 소자 환경에서 층 간 슬라이딩을 정밀하게 제어할 때 발생할 수 있는 마찰이나 무아레 패턴의 영향에 대한 연구가 보완되어야 합니다.", "future_work": "VPX3 이중층에 대한 실험적 합성 및 슬라이딩 제어 실험, 그리고 다른 알터마그네틱 후보 물질군으로의 이론적 확장 연구가 기대됩니다.", "concepts": [{"term": "Altermagnetism", "why_emerged": "강자성(FM)의 스핀 분할 특성과 반강자성(AFM)의 순 자화 제로 특성을 동시에 갖는 제3의 자성 상태를 정의하기 위해 등장했습니다.", "origin": "최근(2020년대 초) Libor Šmejkal, Tomas Jungwirth 등에 의해 명명되고 이론화되었습니다.", "connections": "Antiferromagnetism, Spin-splitting, Berry curvature"}, {"term": "Sliding ferroelectricity", "why_emerged": "층상 물질에서 층 간의 미세한 평행 이동(슬라이딩)만으로 반전 대칭성이 깨지며 강유전성이 나타나는 현상을 설명하기 위해 도입되었습니다.", "origin": "2020년 전후로 Li-Zhu 등을 포함한 연구 그룹들에 의해 이론 및 실험적으로 보고되었습니다.", "connections": "Van der Waals materials, Moire ferroelectricity, Layer-stacking order"}, {"term": "Magnetoelectric coupling", "why_emerged": "자기장으로 전기 분극을 조절하거나, 전기장으로 자화 방향을 조절하여 저전력/고속 소자를 만들기 위해 연구됩니다.", "origin": "Pierre Curie(1894)에 의해 제안되었으며, 2000년대 다강성 물질 연구와 함께 급부상했습니다.", "connections": "Multiferroics, Spintronics, Symmetry breaking"}, {"term": "Van der Waals bilayers", "why_emerged": "단일층과는 다른, 두 층 사이의 상호작용과 적층 방식에 따른 새로운 양자 상태를 탐구하기 위해 필요합니다.", "origin": "그래핀의 se observations indicate that carrier self-doping, rather than ideal altermagnetic order alone, governs the giant magneto-optical response, and establish telecom-wavelength Kerr imaging as a practical readout for altermagnetic spintronics.", "tier": "B_IMPORTANT_CONDMAT", "score": "9", "reason": "Significant experimental study on altermagnetism and anomalous Hall effects, highly relevant to user interests.", "tags": ["experiment", "altermagnet", "anomalous-hall"], "image": "https://arxiv.org/html/2604.21021v4/Figure_1.png", "briefing": {"background": "반강자성체와 강자성체의 장점을 결합한 알터마그네틱(altermagnet)은 최근 스핀트로닉스 분야에서 매우 주목받는 새로운 자기 상태입니다.", "motivation": "MnTe에서 관찰되는 거대한 자기광학 반응이 이상적인 알터마그네틱 순서 때문인지, 아니면 결함에 의한 도핑 효과인지 확인하고자 합니다.", "result": "거대한 커(Kerr) 효과가 결정 전체가 아닌 특정 영역에서 관찰되며, 이는 캐리어 자기 도핑(self-doping)이 지배적인 역할을 함을 시사합니다.", "implication": "알터마그네틱 물질의 성능이 순수 이론적 위상학적 순서뿐만 아니라 시료의 전도성 및 도핑 수준에 크게 좌우됨을 보여줍니다.", "novelty": "실험적으로 커 효과의 공간적 불균일성을 입증하여 알터마그네틱 스핀트로닉스 소자 설계에 실용적인 가이드라인을 제공합니다.", "unresolved": "이상적인 알터마그네틱 순서와 도핑 효과를 완전히 분리하여 제어하는 방법은 여전히 도전 과제입니다.", "future_work": "다양한 도핑 수준을 조절하여 커 효과를 극대화하거나 스위칭 효율을 높이는 소자 연구가 기대됩니다.", "concepts": [{"term": "알터마그네틱", "why_emerged": "순자화는 없지만 스핀 분할 밴드를 가져 스핀트로닉스 활용이 가능한 새로운 자기 물질의 분류 필요성 때문에.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "반강자성, 강자성, 스핀-분할 밴드."}, {"term": "커(Kerr) 효과", "why_emerged": "자기 물질 표면에서 반사되는 빛의 편광이 회전하는 현상을 통해 비파괴적으로 자기 상태를 검출하기 위해.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "자기 광학, 스핀트로닉스."}], "english_summary": ["Reported giant spontaneous Kerr rotation in alpha-MnTe.", "Revealed that the Kerr effect is non-uniform and depends on carrier self-doping.", "Challenges the simple assumption that macroscopic signals stem solely from pure altermagnetic order.", "Proposes telecom-wavelength Kerr imaging as a diagnostic tool for altermagnetic spintronics."]}}, {"title": "Long-lived light-driven bimagnons at finite momentum in NiO", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2611.17335", "authors": "Xian P. Yang, Christopher T. Parzyck, Martin Cross, et al.", "last_authors": "Wei-Sheng Lee, Alexander H. Reid", "summary": "Light can manipulate magnetic order and its excitations on ultrafast timescales, including through resonantly driven phonons. In antiferromagnets, light can also create correlated magnon pairs, or bimagnons. Unlike single magnons, whose damping has been measured and modeled in detail, little is known about the lifetime, interactions and decay of such correlated pairs: prior two-magnon measurements show broad linewidths or coherences that dephase within 200 fs. Here we pump the phonon-assisted two-magnon absorption of NiO with mid-infrared pulses, far below its bandgap, and probe the resulting magnetic dynamics at finite momentum with time-resolved resonant inelastic X-ray scattering (RIXS). Upon photoexcitation, the one-magnon linewidth and energy are essentially unchanged, indicating that the long-range magnetic order is preserved without the photocarrier-induced demagnetization characteristic of above-bandgap excitation. A pump-induced two-magnon signal appears on the energy-gain (anti-Stokes) side of the spectrum. Its spectral weight peaks 4 ps after the pump, well beyond our 0.5 ps time resolution, indicative of a delayed growth likely due to momentum redistribution of the light-induced magnon pairs across the Brillouin zone. This two-magnon signal decays with a time constant of $28\\pm11$ ps, exceeding the previously reported two-magnon dephasing time by more than two orders of magnitude. These results establish long-lived light-driven bimagnon correlations beyond the one-magnon state, akin to the higher-order correlations measured in ultracold gases.", "tier": "B_IMPORTANT_CONDMAT", "score": "9", "reason": "High-quality RIXS study on magnetic excitations in a relevant material system.", "tags": ["RIXS", "magnons", "NiO"], "image": "https://arxiv.org/html/2611.17335v1/fig1.png", "briefing": {"background": ": {"background": "삼각 격자 시스템에서의 콘도 모델은 전도 전자와 국소 자기 모멘트 간의 상호작용을 통해 비자명한 위상학적 질서와 자성 상태를 연구하는 표준적인 플랫폼입니다.", "motivation": "삼각 격자의 밴드 구조에서 감마 및 M 포인트의 페르미 주머니 사이의 중첩(nesting) 특성이 어떻게 트리플-Q 자기 질서와 양자 이상 홀 효과(QAHE)를 유도할 수 있는지 이론적으로 규명하고자 합니다.", "result": "특정 페르미 면 구조가 트리플-Q 자기 상태를 안정화하며, 이 상태가 위상학적으로 비자명한 밴드 구조와 연결되어 QAHE를 발생시킬 수 있음을 보였습니다.", "implication": "자기 위상 물질의 설계 원리를 제시하며, 특히 Kagome 금속과 같은 기하학적 좌절을 가진 시스템에서의 자기적 상태 제어에 대한 통찰을 제공합니다.", "novelty": "삼각 격자 콘도 모델을 통해 QAHE의 발현 조건을 구체적인 페르미 주머니 결합 구조로 분석한 점이 중요하며, ARPES 등을 통한 실험적 검증 가능성을 제시합니다.", "unresolved": "실제 물질의 밴드 구조와 얼마나 일치하는지, 그리고 전자 상관관계가 강할 때의 섭동 효과가 정확히 어떻게 나타나는지에 대한 추가 연구가 필요합니다.", "future_work": "실제 삼각 격자 기반 자기 위상 물질 후보군에서의 자기 질서 관찰 및 수송 현상 실험.", "concepts": [{"term": "Kondo model", "why_emerged": "금속 내 자기 불순물에 의한 전기 저항의 극소 현상을 설명하기 위해 제안됨.", "origin": "Jun Kondo (1964).", "connections": "Heavy fermion 시스템, RKKY 상호작용."}, {"term": "Quantum Anomalous Hall Effect", "why_emerged": "외부 자기장 없이 위상학적 밴드 구조와 강자성에 의해 양자화된 홀 전도도를 구현하기 위해 필요.", "origin": "Haldane model (1988) 이론적 제안, 실험적 발견 (2013).", "connections": "Chern insulator, Topological semimetals."}], "english_summary": ["Studies a low-energy Kondo model on a triangular lattice.", "Investigates the role of Fermi-surface nesting between Gamma and M points.", "Identifies conditions for triple-Q magnetic ordering.", "Links the magnetic state to the emergence of the Quantum Anomalous Hall Effect."]}}, {"title": "Disorder effects on the anomalous Hall conductivity of a two-dimensional ferromagnetic Rashba model", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/sws2-p4tk", "authors": "Bing Liu, Hongchao Yang, Ye Yang, Xiaole Qiu, Lianzhen Cao, Weiwei Chen", "last_authors": "Lianzhen Cao, Weiwei Chen", "summary": "The anomalous Hall conductivity of a ferromagnetic two-dimensional electron gas with a Rashba spin-orbit interaction is studied in the presence of Gaussian white noise. In this condition the anomalous Hall conductivity can be separated into two parts, intrinsic and side jump. The intrinsic contribut…", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Theoretical study on anomalous Hall conductivity in a 2D ferromagnetic Rashba system, a key interest.", "tags": ["theory", "anomalousHall", "ferromagnetism", "spin-orbitcoupling", "2Dmaterials"], "image": "", "briefing": {"background": "강자성 금속에서 나타나는 이상 홀 효과(AHE)는 위상학적 베리 곡률과 불순물 산란의 상호작용에 의해 결정되며, 이는 물질의 자성과 수송 특성을 이해하는 핵심 요소입니다.", "motivation": "2차원 강자성 라쉬바 시스템에서 무질서(disorder)가 내재적(intrinsic) 및 측면 점프(side-jump) 기여에 미치는 영향을 명확히 분리하여 이해하고자 합니다.", "result": "가우스 백색 소음(Gaussian white noise) 모델을 사용하여 무질서 환경에서도 AHE의 각 성분이 어떻게 보존되거나 수정되는지 수치적/이론적으로 규명했습니다.", "implication": "실제 실험에서 관측되는 AHE 신호를 이론적으로 더 정확하게 분해할 수 있게 하며, 소자 설계 시 불순물 제어의 중요성을 강조합니다.", "novelty": "2D 시스템에서 라쉬바 스핀-궤도 결합이 무질서와 결합할 때 AHE의 물리적 기원을 명확히 분리하여 설명했다는 점에서 실용적 가치가 높습니다.", "unresolved": "강한 무질서나 국소적 결함에 대한 영향력은 본 연구의 가우스 근사 모델을 넘어설 수 있습니다.", "future_work": "다양한 유형의 결함(도핑, 표면 상태 등)이 스핀-궤도 결합에 미치는 실질적인 효과에 대한 시뮬레이션.", "concepts": [{"term": "Rashba spin-orbit coupling", "why_emerged": "표면이나 계면에서 나타나는 구조적 반전 대칭성 깨짐이 전자의 스핀 상태를 갈라놓는 현상을 설명.", "origin": "Rashba and Sheka (1959).", "connections": "Spin-orbit torque, Spintronics."}, {"term": "Side-jump mechanism", "why_emerged": "불순물 산란 시 전자의 파동함수가 이동하는 산란 특성을 기술하기 위해 필요.", "origin": "Berger (1970).", "connections": "Anomalous Hall Effect, Berry curvature."}], "english_summary": ["Analyzes anomalous Hall conductivity in a 2D ferromagnetic Rashba model.", "Incorporates Gaussian white noise to represent disorder.", "Distinguishes between intrinsic and side-jump contributions.", "Clarifies the influence of disorder on transport coefficients in Rashba systems."]}}, {"title": "Electronic structure, quasiparticle renormalizations, and magnetic correlations in the alternating single-layer bilayer nickelate La5Ni3O11", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/4dmx-knsn", "authors": "I. V. Leonov", "last_authors": "I. V. Leonov", "summary": "Using the $\\mathrm{DFT}\\phantom{\\rule{0.16em}{0ex}}+$ dynamical mean-field theory ($\\mathrm{DFT}+\\mathrm{DMFT}$) method, we study the normal-state electronic structure, orbital-dependent quasiparticle renormalizations, Fermi surface, and magnetic correlations in the recently discovered alternating s…", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Electronic structure of nickelate, a material class of interest for unconventional superconductivity.", "tags": ["nickelate", "electronicstructure", "DFT+DMFT"], "image": "", "briefing": {"background": "니켈레이트(Nickelates)는 초전도 현상의 메커니즘을 밝히기 위해 구리 산화물(cuprate)의 대안으로 활발히 연구되고 있으며, 특히 다층 구조의 전자 구조 규명이 필수적입니다.", "motivation": "최근 발견된 La5Ni3O11 물질의 전자 구조와 궤도 의존적 준입자 재규격화(quasiparticle renormalization)를 DFT+DMFT 방식으로 이해하고자 합니다.", "result": "강한 전자 상관관계에 따른 밴드 재규격화와 궤도 특성에 따른 자기 상관 관계를 정량화하였습니다.", "implication": "층상 니켈레이트의 초전도 가능성과 자기 질서의 기원을 파악하는 데 중요한 기초 데이터를 제공합니다.", "novelty": "DFT+DMFT라는 강력한 도구를 사용하여 다층 니켈레이트의 비섭동적 전자 구조를 밝혀, 향후 이 물질군의 물성 예측력을 높였습니다.", "unresolved": "초전도 전이 온도와 관련된 구체적인 초전도 페어링 대칭성은 본 연구 범위 너머에 있습니다.", "future_work": "RIXS 또는 ARPES 실험을 통한 계산값 검증 및 초전도 상태에서의 전자 구조 변화 분석.", "concepts": [{"term": "DFT+DMFT", "why_emerged": "강한 전자 상관계에서 DFT만으로 부족한 국소적 전자 상호작용을 보완하기 위해 개발됨.", "origin": "Kotliar et al. (2006).", "connections": "Strongly correlated electron systems, Hubbard model."}, {"term": "Quasiparticle renormalization", "why_emerged": "전자들이 서로 상호작용하며 유효 질량이 변하는 현상을 설명하기 위해 필요.", "origin": "Landau Fermi liquid theory.", "connections": "Effective mass, DMFT."}], "english_summary": ["Investigates the normal-state electronic structure of La5Ni3O11.", "Employs DFT+DMFT to capture strong correlation effects.", "Examines orbital-dependent quasiparticle renormalizations and magnetic correlations.", "Provides theoretical insight into the physics of alternating layer nickelates."]}}, {"title": "Pressure-tuned competing electronic states in layered tes sensitivity of competing states to external pressure.", "Provides insights into controlling phase stability in 2D materials."]}}, {"title": "Pressure-tuned interlayer coupling and structural control of the ground state in 1T−IrTe2", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/bszx-hzm6", "authors": "Rongqi Wu, Ye Yang, Zhiwei Wang, et al.", "last_authors": "Jianjun Ying, Xianhui Chen", "summary": "Layered quantum materials often host multiple nearly degenerate electronic states whose balance is highly sensitive to lattice symmetry and interlayer coupling. $1T−{\\mathrm{IrTe}}_{2}$ is a representative example, where superconductivity emerges in close proximity to a charge-ordered state. Here, w…", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Relevant 112-type material showing CDW and superconductivity interplay.", "tags": ["112tellurides", "CDW", "superconductivity"], "image": "", "briefing": {"background": "1T-IrTe2와 같은 112형 텔루라이드는 전하 밀도 파(CDW)와 초전도성 사이의 미묘한 경쟁 및 공존이 나타나는 대표적인 양자 물질입니다.", "motivation": "층간 결합의 조절이 1T-IrTe2의 기저 상태인 CDW 상과 초전도성 사이의 경쟁에 어떤 영향을 미치는지 밝히고자 합니다.", "result": "압력을 가해 층간 거리를 변화시킴으로써 구조적 왜곡을 제어하고, 이로 인해 CDW 상태가 억제되거나 초전도 상태가 강화되는 메커니즘을 확인했습니다.", "implication": "층간 결합 조절이 강상관 전자계 물질의 양자 상전이를 미세하게 제어할 수 있는 효율적인 수단임을 시사합니다.", "novelty": "112 텔루라이드 시스템에서 압력을 통해 CDW와 초전도성의 긴장 관계를 직접적으로 해부했다는 점이 독자의 연구 관심사와 직결됩니다.", "unresolved": "CDW 상전이의 미시적 원인이 되는 전자-포논 결합의 정확한 기여도는 완벽히 규명되지 않았습니다.", "future_work": "압력 의존적 ARPES 측정을 통해 전자 구조가 어떻게 재구성되는지 확인하는 연구가 요구됩니다.", "concepts": [{"term": "1T-IrTe2", "why_emerged": "CDW와 초전도성의 상호작용을 연구하는 모델 시스템으로 부각됨.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "NbSe3, TaNiTe2."}, {"term": "Charge Density Wave (CDW)", "why_emerged": "격자 왜곡과 전하 밀도의 공간적 변조를 설명하기 위해 필요함.", "origin": "Peierls, 1955년 제안.", "connections": "Peierls instability, superconductivity competition."}], "english_summary": ["Studies pressure-tuned interlayer coupling in 1T-IrTe2.", "Examines the e debates regarding Fermi surface reconstruction in strongly correlated superconductors."]}}, {"title": "Superconducting diode effect in magnetic superconductors realized by nonreciprocal domain-wall dynamics", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/k96f-s31s", "authors": "Dong Hui Han, Suk Bum Chung, Se Kwon Kim", "last_authors": "Suk Bum Chung, Se Kwon Kim", "summary": "The authors propose here a route to the superconducting diode effect through nonreciprocal magnetic domain-wall dynamics in ferromagnetic superconductors. Applied magnetic fields break time-reversal and inversion symmetries, producing direction-dependent critical currents for Walker breakdown—the onset of sustained domain-wall precession. Owing to the order parameter redundancy, the precession generates nonsingular phase slips. By connecting magnetic dynamics with superconducting transport, the authors identify a mechanism for realizing the superconducting diode effect without the need for complex heterostructures.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Theoretical proposal for superconducting diode effect in magnetic superconductors, relevant to unconventional superconductivity.", "tags": ["theory", "superconductivity", "magnetism", "ferromagnetism", "superconductingdiodeeffect"], "image": "", "briefing": {"background": "자기적 물질 내에서 자구벽(domain wall)은 외부 자극에 민감하게 반응합니다. 초전도체와 자기적 질서가 공존하는 경우, 이 역학을 제어하여 초전도 전류의 비대칭성을 유도하려는 시도가 주목받고 있습니다.", "motivation": "복잡한 다층 헤테로 구조 없이 강자성 초전도체 자체의 내부 동역학을 이용해 초전도 다이오드 효과(SDE)를 구현할 수 있는 실용적 메커니즘을 찾고자 합니다.", "result": "강자성 초전도체에서 자기장 하의 비가역적인 자구벽 동역학이 Walker 붕괴(Walker breakdown)의 임계 전류 차이를 만들어내고, 위상 슬립(phase slip)을 통해 비가역적 초전도 수송을 유도함을 이론적으로 밝혔습니다.", "implication": "자성 초전도체 자체를 다이오드 소자로 사용할 수 있으며, 이는 차세대 초전도 전자 소자 설계의 단순화와 효율화에 기여할 것입니다.", "novelty": "단순한 기하학적 비대칭성이 아닌, 물질 내부의 근본적인 자구벽 동역학을 이용해 SDE를 구현했다는 점에서 매우 독창적입니다.", "unresolved": "이러한 동역학이 실제로 실험적으로 관측 가능한 낮은 온도 영역에서의 자구벽 속도와 위상 슬립의 동역학적 임계점 규명 -Haw Chu, Matthew Yankowitz", "summary": "Strongly correlated and topological phases in moiré materials are exquisitely sensitive to lattice geometry at both atomic and superlattice length scales. Twist angle, pressure, and strain directly modify the lattice and thus act as highly effective tuning parameters. Here, we examined electrical transport in twisted bilayer graphene subjected to continuous uniaxial strain. Near the magic angle (≈1.1°), devices exhibited a pronounced elastoresistance that depended on band filling and temperature, with a gauge factor more than two orders of magnitude larger than that of conventional metals. In selected doping regimes, the elastoresistance exhibited a Curie-Weiss–like temperature divergence. We discuss possible microscopic origins, including nematic fluctuations and enhanced electronic entropy from fluctuating isospin moments. Our work establishes uniaxial strain as a versatile probe of correlated physics in a moiré material.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Experimental investigation of electronic properties in twisted bilayer graphene systems.", "tags": ["graphene", "moire", "transport"], "image": "", "briefing": {"background": "매직각(magic-angle) 트위스티드 이중층 그래핀(MATBG)은 층간 비틀림 각도를 조절하여 전자 밴드 구조를 평탄하게 만듦으로써, 강한 전자 상관관계와 초전도성, 절연 상태 등 풍부한 양자 위상을 발현시키는 대표적인 모아레(moiré) 시스템입니다.", "motivation": "모아레 격자는 격자 변형에 극도로 민감하므로, 변형(strain)을 능동적인 제어 변수로 사용하여 물질 내 상관관계 물성과 이와 관련된 양자 위상을 체계적으로 탐구하고자 합니다.", "result": "매직각 근처에서 기존 금속보다 100배 이상 큰 거대 탄성저항(elastoresistance)을 관측했습니다. 특히 특정 도핑 영역에서 탄성저항이 큐리-바이스(Curie-Weiss) 법칙을 따르는 온도 의존성을 보여, 네마틱 변동(nematic fluctuations)이나 등스핀 모멘트(isospin moments)의 엔트로피 효과와 연관됨을 시사합니다.", "implication": "일축 변형(uniaxial strain)이 모아레 물질의 상관관계를 조절하는 강력한 도구임을 입증했으며, 이는 향후 강상관 전자계의 위상 제어 연구에 중요한 실험적 방법론을 제시합니다.", "novelty": "기존 금속 대비 압도적인 게이지 인자(gauge factor)를 확인하였으며, 변형률을 통해 강상관 물성을 정량적으로 분석하는 새로운 틀을 마련했습니다. 사용자의 관심사인 nematicity와 강상관 전자계 연구와 직결됩니다.", "unresolved": "거대 탄성저항의 미시적 기원인 네마틱 변동과 등스핀 모멘트 ystematically suppressed with increasing B B to converge toward the long-range 3D Ising universality class ( β ∼ 0.330 \\beta\\sim 0.330 , γ ∼ 1.00 \\gamma\\sim 1.00 ). Conversely, under an in-plane hard-axis configuration ( B ⟂ c B\\perp c ), the critical behavior study exhibits a sub-unity regime ( γ < 1 \\gamma<1 ) across the measured range of B B . This behavior is attributed to the intense competitive interplay between the external Zeeman energy and strong out-of-plane magnetocrystalline anisotropy. Our findings demonstrate that critical behavior in nontrivial van der Waals magnets is fundamentally modulated by the orientation of B B and the strength of magnetocrystalline anisotropy, demonstrating the necessity of B B -dependent critical behavior investigation over conventional frameworks.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Experimental study on the prominent vdW ferromagnet Fe3GeTe2, relevant to user's 2D magnetic materials interest.", "tags": ["vanderWaals", "ferromagnetism", "experiment"], "image": "https://arxiv.org/html/2611.15380v1/MT_MH_FGT.png", "briefing": {"background": "Fe3GeTe2와 같은 2D 반데르발스 강자성체는 층상 구조와 강한 자기 비등방성으로 인해 저차원 자성 물성을 연구하는 핵심 플랫폼으로 자리 잡고 있습니다.", "motivation": "자기장 방향(축 내/외)과 자기 비등방성이 상전이 부근의 임계 거동(critical behavior)에 미치는 영향을 규명하고, 범용적인 분석법을 통해 이를 체계화하고자 합니다.", "result": "자기장이 쉬운 축(easy axis) 방향일 때 시스템은 3D 아이징(Ising) 범용성 클래스로 수렴하지만, 면내(hard-axis) 방향에서는 자기 비등방성과 Zeeman 에너지의 경쟁으로 인해 비전형적인 임계 지수(gamma < 1)가 나타남을 확인했습니다.", "implication": "2D 자성체의 임계 거동이 단순히 물질 자체의 성질뿐만 아니라 외부 자기장의 방향과 자기 비등방성 간의 에너지 척도 경쟁에 의해 근본적으로 결정됨을 보여줍니다.", "novelty": "기존의 정형화된 임계 지수 분석에서 벗어나 자기장 방향에 따른 거동 변화를 실험적으로 정밀하게 분리해냈으며, 이는 저차원 자성 시스템의 비등방성 연구에 중요한 통찰을 제공합니다.", "unresolved": "임계 영역 근처에서 발생하는 정밀한 도메인 벽 거동과 상호작용 에너지 간의 미세한 동역학은 여전히 해석의 여지가 있습니다.", "future_work": "다양한 2D 자성체에 대한 확장된 임계 분석 및 자기장-온도-변형률 위상도 연구가 뒤따를 것으로 보입니다.", "concepts": [{"term": "임계 지수 (Critical Exponents)", "why_emerged": "상전이 부근에서 물리량이 멱법칙(power law)으로 발산하거나 0으로 수렴하는 방식을 기술 , "Highlights the necessity of direct magnetic field detection in non-equilibrium experiments."]}}, {"title": "Emergence of Bogoliubov Fermi Surfaces in hybrid Al/InAs heterostructures", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2608.06553", "authors": "S. Feyrer, V. Dimic, I. Lobato, A. Kirchner, P. Drexler, L. Rupp, et al.", "last_authors": "M. Aprili, N. Paradiso, C. Strunk, L. Tosi", "summary": "We investigate the microwave electrodynamics of a proximitized two-dimensional electron gas in hybrid superconductor/semiconductor heterostructures. Using lumped-element resonators with inductor wires oriented relative to an in-plane magnetic field, we directly probe the superfluid stiffness via the kinetic inductance. As the field increases, the resonance frequency exhibits a non-monotonic and strongly anisotropic evolution that cannot be explained by orbital pair breaking alone. We show that this behavior is consistent with the emergence of Bogoliubov Fermi surfaces, which selectively suppress the supercurrent response depending on the direction of the magnetic field. Microscopic calculations of the stiffness tensor capture the observed anisotropy driven by the interplay of Zeeman and orbital Fulde-Ferrell effects. Our results establish microwave stiffness measurements as a sensitive probe of anisotropic gapless superconductivity in hybrid systems.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Study of Bogoliubov Fermi surfaces in proximitized semiconductors is highly relevant.", "tags": ["superconductivity", "heterostructure", "Fermisurface"], "image": "https://arxiv.org/html/2608.06553v2/Fig1_v4.png", "briefing": {"background": "초전도체/반도체 하이브리드 구조는 위상 초전도 및 마요라나 페르미온 구현을 위한 핵심 플랫폼입니다. 강한 스핀-궤도 결합을 가진 반도체와 초전도체의 근접 효과는 시스템의 전자 구조를 정교하게 제어할 수 있게 합니다.", "motivation": "외부 자기장 하에서 하이브리드 구조 내의 초전도 상태가 어떻게 변화하는지, 특히 Bogoliubov 페르미 표면(BFS)이 형성될 때 나타나는 전기역학적 특성을 직접 관측하고자 했습니다.", "result": "마이크로파 공진기를 이용해 초전도 강성(superfluid stiffn ently intertwined in unconventional high-transition-temperature (high-Tc) superconductors remains a central open question. Here, we report time-reversal symmetry (TRS) breaking and glassy dynamics in the superconducting state of nickelate (La,Pr,Sm)3Ni2O7 films. Magnetoresistance hysteresis and zero-field non-reciprocal charge transport, complementary evidence for broken TRS, are observed in the superconducting state, while absent in the normal state. Within the superconducting transition regime, logarithmically slow resistance relaxations following magnetic-field perturbations provide strong evidence for glassy dynamics. Remarkably, the reproducible temperature hierarchy across multiple films reveals that these novel phenomena emerge concurrently with developing superconducting phase coherence, preceding the zero-resistance state. Consistently, scanning superconducting quantum interference device (sSQUID) microscopy directly resolves the zero-field magnetic-flux patterns indicative of spontaneous TRS breaking, which emerge simultaneously with local superconducting diamagnetism and phase stiffness. Our observations suggest a frustrated multicomponent superconducting order parameter in the nickelate films, whose internal relative phases may carry TRS-breaking chirality and freeze into a textured phase glass. Collectively, our findings identify a distinctive form of superconductivity in which internal phase degrees of freedom may support additional broken symmetries and glassy order, offering a new perspective on intertwined ordering phenomena in unconventional high-Tc superconductors.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Important experimental observation of TRSB and glassy dynamics in a highly relevant nickelate superconductor.", "tags": ["experiment", "nickelate", "superconductivity"], "image": "https://arxiv.org/static/browse/0.3.4/images/arxiv-logo-fb.png", "briefing": {"background": "니켈산염은 고온 초전도 연구의 새로운 지평으로, 층상 구조와 3d 전자의 강한 상관관계로 인해 쿠퍼레이트
