<title>Daily Paper Slideshow</title>
<style>
  :root {
    color-scheme: light;
    --bg: #f6f7f4;
    --paper: #ffffff;
    --ink: #111827;
    --muted: #64748b;
    --line: #d8ddd2;
    --accent: #176b87;
    --accent-2: #9a3412;
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; overflow: auto; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: var(--bg); color: var(--ink); }
  .shell { max-width: 1500px; min-height: 100vh; margin: 0 auto; padding: 14px 18px; display: flex; flex-direction: column; }
  .topbar { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 16px; }
  .top-actions { display: flex; align-items: center; gap: 10px; }
  .topbar a, button { border: 1px solid var(--line); border-radius: 8px; background: var(--paper); color: var(--ink); padding: 10px 14px; font-weight: 700; text-decoration: none; cursor: pointer; }
  button.primary { background: var(--accent); border-color: var(--accent); color: white; }
  button:disabled { opacity: 0.45; cursor: not-allowed; }
  .counter { color: var(--muted); font-weight: 700; }
  .slide { min-height: calc(100vh - 82px); background: var(--paper); border: 1px solid var(--line); border-radius: 10px; padding: 18px; box-shadow: 0 18px 42px rgba(15, 23, 42, 0.10); display: grid; grid-template-columns: minmax(310px, 0.86fr) minmax(0, 1.55fr); gap: 18px; overflow: visible; }
  .paper-head { min-width: 0; min-height: 0; overflow: visible; display: flex; flex-direction: column; gap: 12px; }
  .figure { margin: 0; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: #f8fafc; }
  .figure img { display: block; width: 100%; max-height: 41vh; object-fit: contain; background: white; }
  .figure figcaption { padding: 7px 10px; color: var(--muted); font-size: 12px; line-height: 1.3; }
  .head-text { display: flex; flex-direction: column; gap: 9px; min-width: 0; }
  .badges { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .badge { border-radius: 999px; padding: 5px 9px; background: #eef2ff; color: #3730a3; font-size: 12px; font-weight: 800; }
  .score { background: #fee2e2; color: #991b1b; }
  h1 { margin: 0; font-size: 25px; line-height: 1.15; letter-spacing: 0; overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
  h1 a { color: inherit; text-decoration-color: rgba(23, 107, 135, 0.35); text-decoration-thickness: 2px; text-underline-offset: 4px; }
  h1 a:hover { color: var(--accent); text-decoration-color: var(--accent); }
  .meta, .authors, .why, .abstract { font-size: 13px; line-height: 1.45; }
  .meta, .authors { color: var(--muted); }
  .why strong, .abstract strong, .authors strong { color: var(--ink); }
  .authors { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .why { border-left: 4px solid var(--accent-2); padding-left: 10px; color: #374151; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .abstract { border-top: 1px solid var(--line); padding-top: 14px; color: #374151; }
  .original-abstract { border-top: 1px solid var(--line); padding-top: 10px; color: #374151; font-size: 11.5px; line-height: 1.35; overflow-wrap: anywhere; }
  .original-abstract strong { display: block; margin-bottom: 4px; color: var(--ink); }
  .tags { display: flex; flex-wrap: wrap; gap: 8px; }
  .tag { border-radius: 999px; padding: 4px 8px; background: #f1f5f9; color: #475569; font-size: 12px; font-weight: 700; }
  .head-text > .link { display: none; }
  .briefing { min-width: 0; min-height: 0; overflow: visible; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); grid-auto-rows: minmax(0, auto); align-content: start; gap: 11px 18px; border-top: 0; padding-top: 0; }
  .brief-section { min-width: 0; }
  .brief-section.wide { grid-column: 1 / -1; }
  .brief-section h2 { margin: 0 0 4px; font-size: 14px; line-height: 1.22; color: #0f766e; letter-spacing: 0; }
  .brief-section p, .brief-section li { margin: 0; font-size: 12.5px; line-height: 1.42; color: #1f2937; overflow-wrap: anywhere; }
  .brief-section ul { margin: 0; padding-left: 20px; }
  .concepts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 9px 14px; }
  .concept { border-top: 1px solid var(--line); padding-top: 7px; }
  .concept h3 { margin: 0 0 4px; font-size: 13px; color: #7c2d12; letter-spacing: 0; }
  .concept p { margin: 2px 0 0; font-size: 11.5px; line-height: 1.35; color: #374151; overflow-wrap: anywhere; }
  .concept b { color: #111827; }
  .link { color: var(--accent); font-weight: 800; text-decoration: none; }
  .empty { padding: 48px; background: var(--paper); border: 1px solid var(--line); border-radius: 12px; color: var(--muted); }
  @media (max-width: 860px) {
    .shell { padding: 14px; }
    .topbar, .top-actions { align-items: stretch; flex-direction: column; }
    .slide, .briefing, .concepts { grid-template-columns: 1fr; }
    .slide { min-height: auto; overflow: visible; display: grid; }
    h1 { font-size: 28px; }
  }
</style>

const slides = [{"title": "Interplay between charge correlations and superconductivity across the superconducting domes of CsV3Sb(5−x)Snx", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/bcqw-7lsf", "authors": "Andrea N. Capa Salinas, Steven J. Gomez Alvarado, Brenden R. Ortiz, et al.", "last_authors": "Turan Birol, Stephen D. Wilson", "summary": "The kagome metal ${\\mathrm{CsV}}_{3}{\\mathrm{Sb}}_{5}$ hosts an anomalous interplay between charge density wave (CDW) order and superconductivity—one where tuning its band filling by adding holes rapidly suppresses long-range CDW order and drives the formation of two unusual superconducting “domes.”…", "tier": "A_MUST_READ", "score": "10", "reason": "Direct hit on core project material (CsV3Sb5) and its CDW/superconductivity interplay.", "tags": ["experiment", "CsV3Sb5", "kagome"], "image": "", "briefing": {"background": "AV3Sb5(A=K, Rb, Cs)계 Kagome 금속은 기하학적 좌절(frustration)과 특이한 밴드 구조(Van Hove singularity)로 인해 전하 밀도 파(CDW)와 초전도성이 공존하거나 경쟁하는 독특한 상평형도를 보입니다.", "motivation": "CsV3Sb5 시스템에서 Sb를 Sn으로 치환(hole doping)할 때 나타나는 장거리 CDW의 억제와 이 과정에서 형성되는 두 개의 초전도 '돔(dome)'의 전자적 기원을 밝히고자 합니다.", "result": "홀 도핑에 따라 CDW 상관관계와 초전도성 사이의 상호작용을 추적하였으며, 전하 농도 조절이 밴드 채우기를 변화시켜 두 가지 서로 다른 초전도 영역을 생성함을 확인했습니다.", "implication": "Kagome 격자 내의 전하 질서와 초전도성이 단순히 경쟁 관계가 아닐 수 있음을 시사하며, 도핑을 통한 다중 초전도 상 제어의 가능성을 제시합니다.", "novelty": "CsV3Sb(5-x)Snx 시스템에서 나타나는 이례적인 두 개의 초전도 돔 구조를 전자 구조적 관점에서 체계적으로 분석했다는 점이 독자님의 Kagome 금속 및 CDW 연구 관심사와 일치합니다.", "unresolved": "두 개의 초전도 돔에서 나타나는 pairing symmetry가 동일한지, 아니면 서로 다른 물리적 기원을 갖는지에 대한 명확한 결론은 아직 부족합니다.", "future_work": "각 초전도 돔 영역에서의 갭 구조를 확인하기 위한 고해상도 ARPES 및 STS 측정과 압력 등 추가 변수 제어 실험이 필요합니다.", "concepts": [{"term": "Kagome lattice", "why_emerged": "기하학적 좌절로 인한 평탄 밴드(flat band)와 Dirac cone 등 특이한 양자 현상을 탐구하기 위해 도입되었습니다.", "origin": "일본의 전통 바구니 패턴에서 유래, Syozi(1951) 등이 통계 역학 모델로 연구 시작.", "connections": "Dirac semimetals, Flat bands, Quantum anomalous Hall effect."}, {"term": "Charge Density Wave (CDW)", "why_emerged": "저차원 금속에서 전자-격자 상호작용에 의해 전하 밀도가 주기적으로 변조되는 현상을 설명하기 위해 등장했습니다.", "origin": "Rudolf Peierls(1930년대 이론적 예측).", "connections": "Peierls instability, Superconductivity, Nesting vector."}, {"term": "Superconducting dome", "why_emerged": "도핑이나 압력에 따라 초전도 임계 온도가 포물선 형태로 나타나는 현상을 묘사하기 위해 사용됩니다.", "origin": "Cuprate 및 Iron-based 초전도체 연구에서 널리 알려짐.", "connections": "Quantum critical point, Unconventional superconductivity."}, {"term": "Van Hove Singularity", "why_emerged": "상태 밀도(DOS)가 발산하는 지점으로, 상관 관계가 강한 상(phase)의 발현을 이해하는 데 중요합니다.", "origin": "Léon Van Hove (1953).", "connections": "Many-body interactions, CDW, Superconductivity."}], "english_summary": ["The study investigates the electronic phase diagram of Sn-doped CsV3Sb5 kagome metal.", "Hole doping suppresses long-range CDW and induces two distinct superconducting domes.", "The research focuses on the interplay between charge correlations and superconductivity across the doping range.", "It provides insights into how band filling tuning affects the stability of collective electronic phases in kagome systems."]}}, {"title": "From Zero to Mega-Gauss Fields: Comprehensive Magnetophotonic Spectroscopy of Graphene Dirac Cones", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2608.10638", "authors": "Shojiro Takeyama, Hiroaki Saito", "last_authors": "Shojiro Takeyama, Hiroaki Saito", "summary": "We investigate the infrared magneto-optical response of n-doped epitaxial graphene on 4H-SiC in ultrahigh magnetic fields up to 560~T, utilizing single-turn coil and electromagnetic flux compression techniques. The measured absorption spectra are anomalously broad, strongly deviating from conventional cyclotron resonance. Angle-resolved photoemission spectroscopy (ARPES) reveals a distorted Dirac dispersion featuring a ``camel-back\" structure with an energy gap of $E_g \\sim 0.2$~eV. Using the band parameters extracted via a generalized bilayer graphene model, we construct a Landau level (LL) fan chart that dictates a critical level crossing between the $N=0^+$ and $N=0^-$ states near 160--200~T. At this threshold, the optical transition mechanism undergoes a dramatic shift from an electron-dominated collective mode to a cooperative electron-hole collective excitation. Furthermore, the extreme-field absorption spectra under thulium fiber laser excitation ($\\hbar\\omega_0 = 0.636$~eV)---culminating in a massive resonance near 400~T with a shoulder at 200~T---are excellently reproduced by a collective Alfv\\'en wave model. This analysis also evidences a magnetic-field-induced enhancement of the sublattice potential asymmetry parameter (from 0.10~eV to 0.12~eV). This directly signifies that the macroscopic electron-hole band asymmetry is further amplified by the applied magnetic field. Ultimately, the field-induced energy inversion generates a strongly interacting, fully compensated electron-hole plasma. The resonant excitation of Alfv\\'en waves in this regime demonstrates that a pristine tabletop analog to the relativistic electron-positron plasmas found in astrophysical extremes can be elegantly realized within a 2D graphene system.", "tier": "A_MUST_READ", "score": "10", "reason": "Direct hit: combines ARPES with high-field magneto-physics on graphene Dirac systems.", "tags": ["experiment", "ARPES", "graphene"], "image": "https://arxiv.org/html/2608.10638v2/ARPESGraphene.png", "briefing": {"background": "그래핀은 디락 페르미온의 특성을 가지며, 강한 자기장 하에서 란다우 준위(Landau Level)를 형성합니다. 초고자기장 환경은 이러한 전자의 양자적 거동을 극단적인 한계까지 밀어붙일 수 있는 환경을 제공합니다.", "motivation": "500T 이상의 초고자기장 환경에서 그래핀의 디락 콘이 어떻게 변형되는지, 그리고 그에 따른 광학적 응답과 집단 여기(collective excitation) 현상을 규명하고자 합니다.", "result": "ARPES를 통해 0.2 eV의 갭을 가진 '낙타 등(camel-back)' 형태의 변형된 디락 분산을 확인했으며, 160~200T 부근에서 란다우 준위 교차에 의한 광학 전이 메커니즘의 급격한 변화(Alfvén wave 여기)를 관측했습니다.", "implication": "그래핀 시스템이 천체 물리학에서나 볼 수 있는 상대론적 전자-양전자 플라즈마의 지상 실험 모델(tabletop analog)로 활용될 수 있음을 보여줍니다.", "novelty": "독자님의 주 관심사인 AR l, P. D. C. King", "summary": "The formation of flat electronic bands from long-wavelength superperiodic moir\\'e potentials in van der Waals heterostructures underpins the creation and control of a host of highly-tunable correlated and topological phases. While the underlying moir\\'e periodicity is typically a fixed property of the heterostructure, here we show how the development of a charge-density wave (CDW) in one of the constituent materials can create an emergent moir\\'e lattice. We demonstrate this experimentally in TiSe$_2$/graphite epitaxial heterostructures, using angle-resolved photoemission and scanning-tunnelling microscopy and spectroscopy to directly image the resulting long-wavelength moir\\'e potential and concomitant flat-band formation. We show how the intrinsically low-energy, deformable landscape of the CDW imparts significant tunability, stabilising quasi-one-dimensional moir\\'e domains from symmetry breaking within the CDW, and allowing the complete suppression of flat-band formation by carrier doping across the CDW phase transition. Our findings thus open a new avenue for engineering moir\\'e matter by exploiting the rich many-body states of the parent compounds of 2D heterostructures.", "tier": "A_MUST_READ", "score": "10", "reason": "Direct hits on ARPES, STM, CDW, and moiré flat bands in TiSe2 heterostructures.", "tags": ["ARPES", "STM", "CDW", "heterostructure"], "image": "https://arxiv.org/html/2511.05648v2/x1.png", "briefing": {"background": "반도체 및 금속 박막을 쌓아 만드는 무아레(Moiré) 초격자는 평탄 밴드를 형성하여 강상관 현상을 유도합니다. 보통은 기하학적인 비틀림(twist)이나 격자 상수 차이에 의존합니다.", "motivation": "고정된 격자 구조가 아닌, 물질 내부의 전자적 질서인 '전하 밀도 파(CDW)'가 스스로 무아레 주기를 만들어낼 수 있는지 실험적으로 입증하고자 합니다.", "result": "TiSe2/graphite 이종 접합 구조에서 TiSe2의 CDW 격자와 그래파이트 격자 사이의 간섭으로 형성되는 '발현적 무아레(emergent moiré)'와 그에 따른 평탄 밴드 형성을 ARPES와 STM으로 직접 관측했습니다.", "implication": "무아레 평탄 밴드를 물리적인 비틀림 없이 전자적 상전이(도핑 등)를 통해 켰다 껐다 할 수 있는 '재구성 가능한(reconfigurable)' 양자 소자 가능성을 제시합니다.", "novelty": "CDW를 무아레 형성의 핵심 요소로 ", "RuO2", "altermagnetism"], "image": "", "briefing": {"background": "RuO2는 알터마그네티즘 후보 물질로서 큰 기대를 모으고 있지만, 실험적으로 측정되는 자성 신호가 연구마다 달라 논란이 많습니다. 특히 알터마그네티즘은 본질적으로 알짜 자화(Net magnetization)가 없어야 하지만, 일부 박막 실험에서는 자화가 보고되기도 합니다.", "motivation": "스트레인(Strain)이 RuO2의 자기적 기상(Ground state)에 미치는 영향을 조사하여, 실험적으로 관측되는 자화 신호가 물질의 고유한 성질인지 아니면 외부 응력에 의한 변형인지 확인하고자 합니다.", "result": "연구 결과, 스트레인이 인가될 때 RuO2 내에서 유도된 자화(induced magnetization)가 나타날 수 있음을 확인하였습니다. 이는 격자 변형이 알터마그네틱 상태의 대칭성을 깨뜨려 미세한 알짜 자화를 형성할 수 있음을 의미합니다.", "implication": "그동안 RuO2의 자성을 두고 벌어진 논란(박막 vs 벌크)의 원인 중 하나가 기판 등에 의한 스트레인 효과일 가능성을 강력하게 시사합니다.", "novelty": "알터마그네티즘의 핵심 쟁점인 '순 자화의 존재 여부'를 스트레인이라는 변수를 통해 해석했습니다. 사용자님의 관심사인 알터마그네티즘의 물리적 실체를 규명하는 데 중요한 퍼즐 조각을 제공합니다.", "unresolved": "인가된 스트레인의 방향과 크기에 따라 자화의 방향이 어떻게 결정되는지에 대한 정교한 제어 실험이 필요합니다.", "future_work": "스트레인이 정밀하게 제어된 RuO2 박막에서의 비정상 홀 효과(AHE) 및 중성자 산란 연구가 기대됩니다.", "concepts": [{"term": "스트레인 유도 자화 (Strain-induced magnetization)", "why_emerged": "격자 변형이 전자 구조와 자성에 미치는 영향을 이해하여 물성을 튜닝하기 위해 연구됩니다.", "origin": "압전/자기변형 효과 연구에서 유래함", "connections": "압전성, 스핀-격자 결합, 박막 공학"}, {"term": "자기 기상 (Magnetic ground state)", "why_emerged": "절대 영도 부근에서 물질이 갖는 가장 안정적인 자성 상태를 정의하기 위해 필요합니다.", "origin": "양자 통계 역학 및 고체 물리학의 기초 개념", "connections": "스핀 밀도 파동, 강자성, 반강자성, 알터마그네티즘"}], "english_summary": ["Investigates the effect of strain on the magnetic ground state of the altermagnetic candidate RuO2.", "Demonstrates that strain can induce a net magnetization, potentially resolving discrepancies in experimental reports.", "Highlights the sensitivity of altermagnetic symmetry to lattice deformations."]}}, {"title": "Defect-Induced Displacement of Topological Surface State in Quantum Magnet MnBi2Te4", "journal": "PRL_Recent", "source": "author whitelist", "link": "http://link.aps.org/doi/10.1103/pt1j-996m", "authors": "Felix Lüpke, Marek Kolmer, Hengxin Tan, et al.", "last_authors": "Wonhee Ko, An-Ping Li", "summary": "The topological magnet MnBi 2 Te 4 (MBT), with gapped topological surface state, is an attractive platform for realizing quantum anomalous Hall and axion insulator states. However, the experimentally observed surface state gaps fail to meet theoretical predictions, although the exact mechanism behind the gap suppression has been debated. Recent theoretical studies suggest that intrinsic antisite defects push the topological surface state away from the MBT surface, closing its gap and making it less accessible to scanning probe experiments. Here, we report on the local effect of defects on the MBT surface states and demonstrate that high defect concentrations lead to a displacement of the surface states well into the MBT crystal, validating the theorized mechanism. The local and global influence of antisite defects on the topological surface states are studied with samples of varying defect densities by combining scanning tunneling microscopy, angle-resolved photoemission spectroscopy, and density functional theory. Our findings identify a combination of increased defect density and reduced defect spacing as the primary factors underlying the displacement of the surface states and suppression of surface gap, guiding further development of topological quantum materials.", "tier": "A_MUST_READ", "score": "9", "reason": "author whitelist: Adam Kaminski", "tags": ["anomalousHall", "quantummagnet", "topological"], "image": "", "briefing": {"background": "MnBi2Te4(MBT)는 자성 토폴로지컬 절연체의 대표적인 물질로, 양자 이상 홀 효과(QAH) 및 액시온 절연체 상태를 구현할 수 있는 유망한 플랫폼입니다. 이론적으로는 표면 상태에 자기적 갭이 크게 형성되어야 하지만, 실제 실험에서는 이 갭이 작거나 관찰되지 않는 경우가 많아 그 원인에 대한 논란이 지속되어 왔습니다.", "motivation": "이 연구는 MBT의 고유 결함인 안티사이트(antisite) 결함이 토폴로지컬 표면 상태(TSS)의 공간적 분포와 갭 형성에 어떤 영향을 미치는지 실험적으로 검증하고자 했습니다. 특히 결함이 TSS를 표면에서 결정 내부로 밀어낸다는 최근의 이론적 가설을 확인하는 것이 핵심 동기입니다.", "result": "STM, ARPES, DFT 결합 분석을 통해 안티사이트 결함 농도가 높아질수록 토폴로지컬 표면 상태가 표면에서 멀어져 결정 내부로 변위(displacement)됨을 확인했습니다. 결함 밀도 증가와 결함 간 거리 감소가 TSS를 내부로 밀어내는 주요 기제이며, 이로 인해 표면 근처에서 측정되는 에너지 갭이 억제되고 주사 탐침 실험에서 TSS에 접근하기 어려워진다는 것을 입증했습니다.", "implication": "실험적으로 관찰된 TSS 갭의 비정상적인 축소가 결함에 의한 파동 함수의 재분포 때문임을 규명함으로써, 향후 고품질 QAH 소자 제작을 위해 결함 제어가 필수적임을 시사합니다. 또한 표면 측정법인 ARPES와 STM 데이터 해석 시 subsurface 상태에 대한 고려가 중요함을 보여줍니다.", "novelty": "이론적 가설이었던 'TSS의 내부 이동'을 실험적으로 직접 관찰하고 결함 농도와의 상관관계를 정량적으로 제시했습니다. 독자 프로필의 관심사인 ARPES와 STM을 동시에 활용하여 벌크와 표면의 전자기적 연결 고리를 명확히 했다는 점에서 중요도가 높습니다.", "unresolved": "결함의 종류나 분포가 TSS 변위에 미치는 세부적인 임계 농도를 완벽히 정량화하는 것과, 이러한 변위가 실제 양자 이상 홀 전도도에 미치는 수송 특성 상의 정밀한 영향은 추가 연구가 필요합니다.", "future_work": "결함 제어를 통한 표면 상태 복원 연구와, 인위적으로 결함을 조절하여 TSS의 깊이를 튜닝하는 '위상 상태 엔지니어링' 연구가 이어질 것으로 예상됩니다.", "concepts": [{"term": "Antisite Defect", "why_emerged": "결정 구조 내에서 서로 다른 원자가 자리를 바꾸는 현상을 설명하기 위해 등장했습니다.", "origin": "결정학 및 고체물리학의 기본 개념으로, MnBi2Te4에서는 Mn과 Bi의 자리 바꿈이 빈번합니다.", "connections": "Mn-Bi antisite 결함은 MBT의 자기적 질서와 위상적 특성을 저해하는 주요 요인으로 꼽힙니다."}, {"term": "Topological Surface State (TSS)", "why_emerged": "토폴로지컬 절연체의 벌크-경계 대응 원리에 의해 표면에 나타나는 특이한 전자 상태를 설명하기 위해 제안되었습니다.", "origin": "Kane, Mele, Bernevig 등에 의해 이론적으로 확립되었습니다.", "connections": "Spin-momentum locking, Dirac cone, ARPES로 직접 관찰 가능."}, {"term": "Axion Insulator", "why_emerged": "자기적 토폴로지컬 절연체에서 특정 자기 구조에 의해 나타나는 고유한 위상 절연체 상태를 정의하기 위해 도입되었습니다.", "origin": "Wilczek 등에 의한 이론적 개념이 고체물리학으로 확장되었습니다.", "connections": "MnBi2Te4의 반강자성 상태에서 실현 가능하며, 특이한 자기전기 효과를 보입니다."}], "english_summary": ["Investigated the effect of antisite defects on the topological surface state (TSS) of MnBi2Te4 using STM, ARPES, and DFT.", "Demonstrated that high defect concentration displaces the TSS from the surface into the crystal bulk.", "Identified this displacement as the primary mechanism for the observed suppression of the topological surface gap.", "Provides crucial guidelines for defect engineering to realize robust quantum anomalous Hall states."]}}, {"title": "Dimensional crossover and local strain induced deflection of the spin spiral state in multiferroic NiI2 (Science Bulletin)", "journal": "arXiv_CondMat", "source": "author whitelist", "link": "https://arxiv.org/abs/2608.11944", "authors": "Tianxing Jiang, Lianchuang Li, Haiyan Zhu, et al.", "last_authors": "Donglai Feng, Tong Zhang", "summary": "Low-dimensional multiferroics hold great promise for integrated magnetoelectric devices. Spin spiral state has recently been shown to induce ferroelectricity in single-layer van der Waals (vdW) material NiI2. However, how this state evolves and can be tuned towards the two-dimensional limit remain unclear. Here, we combine spin-polarized scanning tunneling microscopy, layer-by-layer film growth, and multi-scale theoretical modeling to investigate the spin spirals in NiI2 thin films. As the film thickness increases from 1 to 7 monolayers, we observed a continuous increase of spin-spiral wavelength and a rotation of wavevector from near [110] to [1-10] direction, which evidences a dimensional crossover primarily driven by enhanced interlayer exchange energy. Moreover, we find that the film wrinkles can cause deflection of the spin spiral wavevector, which is caused by local curvature induced modification of exchange interactions. Our findings establish thickness and local strain as two tuning methods for engineering non-collinear helical magnetism and accompanied electric polarization in vdW multiferroics.", "tier": "A_MUST_READ", "score": "9", "reason": "author whitelist: Donglai Feng", "tags": ["scanningtunneling", "vanderWaals", "monolayer"], "image": "https://arxiv.org/static/browse/0.3.4/images/arxiv-logo-fb.png", "briefing": {"background": "NiI2와 같은 2차원 반데르발스(vdW) 물질은 스핀 나선(spin spiral) 구조가 강유전성을 유도하는 다강성(multiferroic) 특성을 가집니다. 이는 차세대 자기전기 소자 구현을 위한 핵심 재료로 주목받고 있습니다.", "motivation": "단층 NiI2에서 다강성이 확인되었으나, 층수가 증가함에 따라 이 나선 상태가 어떻게 진화하는지(차원 교차 현상)와 국소적인 변형(strain)이 스핀 구조에 어떤 영향을 미치는지에 대해서는 이해가 부족했습니다.", "result": "스핀 분광 STM(SP-STM)을 통해 1~7층 두께의 NiI2 박막을 관찰한 결과, 층수가 늘어남에 따라 스핀 나선의 파장이 길어지고 파동 벡터(wavevector)가 [110] 방향에서 [1-10] 방향으로 회전하는 것을 발견했습니다. 또한, 박막의 주름(wrinkle)에 의한 국소적인 곡률이 스핀 나선의 방향을 굴절시킨다는 점을 확인했습니다.", "implication": "층간 교환 o the controversial magnetic signatures in RuO2.", "Tunability of these effects is demonstrated for future device applications."]}}, {"title": "Layer-Number-Controlled Symmetry Breaking and Surface-State Transport in Rhombohedral Graphene Multilayers", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2608.11450", "authors": "Bosai Lyu, Jian Zheng, Kai Liu, et al.", "last_authors": "Weidong Luo, Guorui Chen", "summary": "Rhombohedral multilayer graphene hosts layer-polarized flat bands, providing an intriguing platform for correlated and topological electronic states; however, the role of layer number in governing symmetry breaking and surface screening remains elusive. Here we prepare rhombohedral graphene multilayers and systematically conduct electrical transport measurements. We uncover an unconventional layer dependence of phase transitions: the critical displacement field (D$_{c}$) for the layer-antiferromagnetic (LAF)-to-semimetal transitions remains constant across tetralayer to hexalayer graphene, whereas the D$_{c}$ for semimetal-to-layer-polarized-insulator (LPI) transition increases with layer number, defying unscreened Coulomb interaction models. In hexalayer graphene, surface-state-dominated transport emerges, with Landau levels (LLs) and resistive peaks selectively controlled by adjacent gates, a signature of strong interlayer screening absent in thinner stacks. High magnetic fields reveal valley-layer-locked LLs and dissipative states possibly from interlayer backscattering, highlighting the presence of decoupled surface states. Our findings establish layer number as a key tuning knob for engineering correlated and topological phases in rhombohedral graphene multilayers.", "tier": "B_IMPORTANT_CONDMAT", "score": "9", "reason": "Explores topological surface states and layer-polarized phases in rhombohedral graphene, a key moire-related platform.", "tags": ["experiment", "graphene", "topological"], "image": "https://arxiv.org/static/browse/0.3.4/images/arxiv-logo-fb.png", "briefing": {"background": "능면체(Rhombohedral) 적층 그래핀은 층간 결합 및 강한 상관관계에 의해 독특한 평탄 밴드(flat bands)와 위상 상태를 형성하는 시스템입니다.", "motivation": "층 수(layer number)가 어떻게 대칭성 깨짐과 위상적 상태를 제어하는지, 특히 층간 스크리닝 효과가 이러한 물성에 미치는 역할을 규명하고자 했습니다.", "result": "4층부터 6층까지 그래핀의 상전이 임계 변위장이 층 수에 따라 다르게 변화함을 발견했으며, 특히 6층에서 표면 상태 중심의 전하 수송이 관찰되었습니다.", "implication": "그래핀의 층 수를 조절함으로써 위상적 절연체 및 상관관계 전자 상태를 설계할 수 있는 정밀한 튜닝 놉(knob)으로서의 가능성을 보여줍니다.", "novelty": "기존의 비스크리닝 쿨롱 모델로 설명되지 않는 독특한 층 수 의존적 상전이를 발견하여, 고차 적층 그래핀의 위상 물성을 새로 정립했습니다.", "unresolved": "층간 backscattering에 의한 소산 상태의 미시적 기전이 완전하게 밝혀지지 않았습니다.", "future_work": "적층 구조를 정교하게 제어한 소자에서 양자 홀 효과와 연계된 위상 전도 연구가 이어질 것으로 보입니다.", "concepts": [{"term": "Rhombohedral Multilayer Graphene", "why_emerged": "ABC 적층 구조를 통해 밴드 구조의 변화와 강한 상관관계 현상을 구현하기 위해.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "평탄 밴드, 모아레 시스템, 위상 절연체."}, {"term": "Interlayer Screening", "why_emerged": "다층 시스템에서 전하 간의 쿨롱 상호작용이 어떻게 차폐되어 밴드 구조에 영향을 주는지 설명하기 위해.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "금속-절연체 상전이, 쿨롱 상호작용."}], "english_summary": ["Study of layer-dependent symmetry breaking in rhombohedral graphene.", "Observation of unconventional layer-number dependent phase transitions.", "Hexalayer graphene exhibits strong interlayer screening and surface-dominated transport.", "Layer number is established as a critical tuning parameter for topological phases."]}}, {"title": "Mechanical strain induced topological phase changes of monolayer and bilayer ZrTe5", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2311.04721", "authors": "Zolt\\'an Tajkov, D\\'aniel Nagy, J\\'anos Koltai, P\\'eter Nemes-Incze", "last_authors": "J\\'anos Koltai, P\\'eter Nemes-Incze", "summary": "Two-dimensional materials offer exceptional tunability of their properties through strain, electrostatic gating, and related mechanisms. Among these, ZrTe$_5$ stands out as a material in which band topology can be switched via mechanical deformation. In its bulk form, it lies near a topological phase boundary, allowing efficient modulation of its topological state through strain. While extensive studies exist on bulk ZrTe$_5$, the topological phase transitions in monolayer and bilayer forms remain largely unexplored. Here we show that monolayer and bilayer ZrTe$_5$ exhibit distinct strain-induced topological transitions. Mechanical deformation in monolayers can close the topological gap, while bilayers display a richer phase diagram, including topological and trivial insulating phases as well as an intermediate metallic phase. Since thinner van der Waals materials are more amenable to strain tuning, our results identify bilayer ZrTe$_5$ as a candidate for achieving tunable topological phase transitions using moderate (1-2{\\%}) strain as a tuning knob.", "tier": "B_IMPORTANT_CONDMAT", "score": "9", "reason": "Directly relevant to topological materials and strain tuning of semimetals like ZrTe5.", "tags": ["material", "ZrTe5", "topology", "strain"], "image": "https://arxiv.org/html/2311.04721v2/1_10.png", "briefing": {"background": "ZrTe5는 위상적 위상 경계 근처에 위치한 물질로, 밴드 토폴로지가 외부 자극에 매우 민감하여 위상 물성 연구의 핵심 플랫폼입니다.", "motivation": "벌크 형태의 연구는 많지만, 저차원(단일층/이중층) ZrTe5에서 기계적 변형(strain)이 위상 상태에 미치는 영향은 아직 충분히 탐구되지 않았습니다.", "result": "단일층에서는 위상 갭을 닫을 수 있고, 이중층에서는 기계적 변형을 통해 위상 절연체, 일반 절연체, 금속 상태로 정밀하게 위상을 바꿀 수 있음을 보였습니다.", "implication": "1-2% 정도의 작은 변형만으로 위상적 상태를 가역적으로 조절할 수 있어, 변형 공학(strain engineering)을 이용한 위상 소자 개발이 가능해집니다.", "novelty": "벌크 ZrTe5보다 변형에 더 유연한 저차원 박막 시스템에서 풍부한 위상 상도(phase diagram)를 발견했습니다.", "unresolved": "실제 실험적으로 이 정도의 변형을 소자 환경에서 어떻게 정교하게 인가하고 측정할지에 대한 공정상 난관이 존재합니다.", "future_work": "스트레인 인가 소자를 통한 수송 측정 및 나노 ARPES 등을 이용한 위상 밴드 변화 직접 관측이 예상됩니다.", "concepts": [{"term": "Topological Phase Transition", "why_emerged": "밴드 구조의 불변량(예: Z2)이 변하며 물리적 성질이 급격히 바뀌는 현상을 기술하기 위해.", "origin": "초록 정보만으로는 특정하기 어려움 (Hasan & Kane, 2010 등).", "connections": "위상 절연체, 밴드 반전, 베리 위상."}, {"term": "Strain Engineering", "why_emerged": "물질을 기계적으로 구부리거나 당겨 결정 격자를 변형시킴으로써 전자 구조를 능동적으로 제어하기 위해.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "반데르발스 물질, 2D 재료, 밴드 튜닝."}], "english_summary": ["Investigation of strain-induced topological phase transitions in ZrTe5.", "Monolayer ZrTe5 shows topological gap closure under strain.", "Bilayer ZrTe5 offers a rich phase diagram including metallic phases.", "Thin-layer ZrTe5 is proposed as a platform for tunable topological devices."]}}, {"title": "Quetzalcoatlite as a Disorder-Free Platform for Chiral Magnetism and Frustration", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2608.11301", "authors": "Aleksandar Razpopov, P. Peter Stavropoulos, Michael R. Norman, Roser Valent\\'i", "last_authors": "Michael R. Norman, Roser Valent\\'i", "summary": "The natural mineral quetzalcoatlite Zn$_6$Cu$_3$(TeO$_6$)$_2$(OH)$_6$ $\\cdot$ (Ag$_x$Pb$_y$Cl$_{x+2y}$) is a structurally ideal kagome magnet, providing a platform for exploring the interplay of geometric frustration, chirality, and tunability in a disorder-free framework. Here, we present the (first) comprehensive ab initio study of its electronic and magnetic properties. The electronic structure is dominated by localized half-filled Cu $d_{x^2-y^2}$ orbitals that become insulating through electronic correlations. Mapping the low-energy physics onto a Heisenberg model reveals that the magnetism is governed primarily by two exchange interactions: a nearest-neighbor intralayer kagome coupling and a next-nearest-neighbor interlayer coupling. Their competition stabilizes an unconventional three-dimensional chiral magnetic state. Each kagome layer hosts a $\\sqrt{3}\\times\\sqrt{3}$ order, while adjacent layers are rotated by $60^\\circ$, producing a right-handed spiral along the crystallographic $c$-axis. This intrinsic chiral order emerges naturally from the crystal structure and magnetic interactions, establishing quetzalcoatlite as a distinctive reali man Sankar, Kwang-Yong Choi", "summary": "Using temperature-, field-, and angle-dependent Raman scattering, the authors observe here a sharp magnon coexisting with a broad spinon continuum in the quasi-one-dimensional quantum magnet SeCuO 3 . Both excitations exhibit identical angular dependence governed by the same Raman scattering symmetry. This common scattering symmetry demonstrates that coherent magnons emerge from the confinement of fractionalized spinons inherent to a one-dimensional quantum magnet.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Experimental spectroscopy on a quasi-1D quantum magnet showing spinon continuum, relevant to user's interest in spin-charge separation.", "tags": ["experiment", "quasi-1D", "spinons"], "image": "", "briefing": {"background": "준일차원 자성체는 스핀의 분수화(fractionalization)가 나타나는 대표적인 시스템으로, 스핀-전하 분리나 스피논과 같은 이국적인 들뜸이 관찰되는 물리적 장입니다.", "motivation": "SeCuO3라는 quasi-1D 시스템에서 자성 들뜸(마그논)과 스피논 연속체(spinon continuum)가 동시에 존재할 수 있는지 확인하고자 했습니다.", "result": "라마산란 측정 결과, 국소적인 마그논과 비국소적인 스피논 연속체가 동일한 대칭성을 공유하며 공존함을 발견했습니다.", "implication": "강력한 양자 요동 하에서도 간섭성 마그논이 분수화된 스피논 상태로부터 창발할 수 있음을 보여주며, 저차원 자성체의 이해를 확장합니다.", "novelty": "quasi-1D 자성체에서 마그논과 스피논의 공존을 라만 분광법으로 증명하고, 이들이 동일한 대칭성을 가짐을 밝혀낸 점이 주목됩니다.", "unresolved": "스피논 연속체의 에너지 범위가 구체적으로 어떻게 마그논 결합을 제한하거나 변조하는지에 대한 미시적 모델은 더 세밀한 이론적 뒷받침이 필요합니다.", "future_work": "다른 quasi-1D 시스템으로의 확장 연구나 자기장 하에서의 스피논 분해(spinon deconfinement) 현상 탐구가 필요합니다.", "concepts": [{"term": "스피논", "why_emerged": "일차원 스핀 사슬에서 스핀 1/2이 두 개의 스핀 1/2 준입자로 쪼개지는 현상을 설명하기 위해 도입됨.", "origin": "한스 베테 (1931년)", "connections": "스핀-전하 분리, 양자 자성체, 루팅어 액체"}, {"term": "마그논", "why_emerged": "자기 정렬 상태에서 발생하는 스핀의 집단적 들뜸(파동)을 입자화하여 다루기 위해 필요함.", "origin": "펠릭스 블로흐 (1930년)", "connections": "자성, 큐리 온도, 비탄성 중성자 산란"}], "english_summary": ["Observes coexistence of magnons and spinon continua in SeCuO3.", "Uses Raman scattering to probe quasi-1D quantum magnetism.", "Demonstrates coherent magnons emerging from fractionalized spinons.", "Confirms identical scattering symmetry for both excitation types."]}}, {"title": "Dynamical spin correlations in kagome antiferromagnets: Comparison of the Abrikosov fermion and Schwinger boson approaches beyond mean field", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/h85g-v6zx", "authors": "Daiki Sasamoto, Joji Nasu", "last_authors": "Daiki Sasamoto, Joji Nasu", "summary": "Quantum spin liquids exhibit fractionalized spin excitations as a consequence of strong quantum many-body effects and have therefore attracted considerable attention. The kagome antiferromagnetic Heisenberg model is a promising candidate for realizing a quantum spin-liquid ground state; however, the…", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Detailed theory for kagome antiferromagnets and spin liquids, directly relevant to the user's core material class.", "tags": ["theory", "kagome", "spin-liquid"], "image": "", "briefing": {"background": "카고메 격자에서의 반강자성 하이젠베르크 모델은 기하학적 좌절(frustration)로 인해 양자 스핀 액체(Quantum Spin Liquid, QSL) 상태를 구현할 수 있는 가장 유력한 후보 중 하나입니다. QSL은 장거리 자기 질서 대신 분수화된 여기(fractionalized excitations)를 특징으로 하며, 이를 이론적으로 설명하기 위해 스핀을 가상의 입자로 기술하는 방식이 널리 쓰입니다.", "motivation": "QSL의 동역학적 특성을 설명하기 위해 아브리코소프 페르미온(Abrikosov fermion)과 슈윙거 보존(Schwinger boson) 방법이 주로 사용되지만, 대개 평균장 이론 수준에 머물러 있습니다. 본 연구는 평균장 수준을 넘어 게이지장 요동(gauge field fluctuations)을 포함했을 때 두 방법론이 스핀 상관관계 및 여기 스펙트럼에서 어떤 차이를 보이는지 정밀하게 비교하고자 했습니다.", "result": "연구팀은 게이지 요동을 고려한 계산을 통해 두 표현 방식이 카고메 반강자성체의 동역학적 스핀 구조 인자에서 질적으로 다른 특징을 나타냄을 확인했습니다. 특히 특정 대칭성 조건하에서 나타나는 여기 패턴의 변형과 연속체(continuum)의 거동이 방법론에 따라 어떻게 달라지는지 구체적인 수치적 지표를 제시했습니다.", "implication": "실제 카고메 물질(예: Herbertsmithite 등)에서 측정된 비탄성 중성자 산란(INS)이나 공명 비탄성 X선 산란(RIXS) 데이터를 해석할 때, 어떤 이론적 틀을 선택하느냐에 따라 물리적 해석이 크게 달라질 수 있음을 시사합니다.", "novelty": "카고메 금속(AV3Sb5 등)에서 나타나는 비정상적인 물성에 관심이 많은 독자에게, 스핀 자유도의 양자 요동이 격자 구조와 결합하여 어떤 복잡한 여기 상태를 만드는지에 대한 이론적 토대를 제공합니다. 특히 평균장 이론의 한계를 넘어선 계산법을 제시했다는 점이 핵심입니다.", "unresolved": "이론적 모델링이 실제 물질의 궤도 자유도나 스핀-궤도 결합(SOC)을 완전히 포함하지는 않았으므로, 보다 복잡한 실제 카고메 화합물에 직접 적용하기에는 추가적인 확장이 필요합니다.", "future_work": "향후에는 이 방법론을 확장하여 카고메 금속에서의 루프 전류(loop current)나 시공간 반전 대칭성 깨짐(TRSB) 현상과 스핀 여기 사이의 관계를 규명하는 연구가 기대됩니다.", "concepts": [{"term": "양자 스핀 액체 (Quantum Spin Liquid)", "why_emerged": "극저온에서도 스핀이 얼어붙지 않고 액체처럼 요동치는 상태를 설명하기 위해 등장했습니다.", "origin": "P.W. Anderson (1973)", "connections": "기하학적 좌절, 분수화 여기, 위상학적 질서"}, {"term": "아브리코소프 페르미온 (Abrikosov Fermion)", "why_emerged": "스핀 연산자를 페르미온의 생성/소멸 연산자로 치환하여 다체계 문제를 해결하기 위해 고안되었습니다.", "origin": "Alexei Abrikosov (1965)", "connections": "게이지 이론, 강상관 전자계"}, {"term": "슈윙거 보존 (Schwinger Boson)", "why_emerged": "스핀을 보존 입자로 표현하여 자성체의 여기 상태를 기술하기 위해 사용됩니다.", "origin": "Julian Schwinger", "connections": "반강자성체, 대칭성 파괴 상태 연구"}, {"term": "동역학적 스핀 구조 인자 (DSF)", "why_emerged": "물질 내 스핀의 시간 및 공간적 상관관계를 측정하고 비탄성 중성자 산란 결과를 예측하기 위해 필요합니다.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "비탄성 중성자 산란(INS), RIXS"}], "english_summary": ["Compares Abrikosov fermion and Schwinger boson mappings for the kagome antiferromagnetic Heisenberg model.", "Goes beyond mean-field theory by incorporating gauge field fluctuations.", "Identifies distinct qualitative differences in the dynamical spin structure factor between the two approaches.", "Provides theoretical guidance for interpreting fractionalized excitations in kagome spin liquid candidates."]}}, {"title": "Finite-temperature ab initio structural optimization of the bilayer nickelate superconductor La3Ni2O7", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/qbnb-bzr6", "authors": "Ryoma Asai, Ryotaro Arita, Takumi Chida, Ryota Masuki, Kazuhiko Kuroki, Terumasa Tadano", "last_authors": "Kazuhiko Kuroki, Terumasa Tadano", "summary": "We develop a first-principles framework for finite-temperature structural optimization that incorporates vibrational contributions to the free energy through anharmonic phonon theory. We extend and further improve the efficiency of the recent approach, enabling its application to systems in which th…", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Ab-initio study of the structural and vibrational properties of the high-Tc bilayer nickelate superconductor.", "tags": ["DFT", "La3Ni2O7", "nickelate"], "image": "", "briefing": {"background": "최근 발견된 복층 니켈레이트(La3Ni2O7)는 고압 하에서 약 80K의 높은 초전도 임계온도(Tc)를 보여 큰 주목을 받고 있습니다. 하지만 고압 환경에서의 정확한 결정 구조와 유한 온도에서의 격자 안정성은 초전도 메커니즘을 이해하는 데 핵심적인 난제로 남아 있습니다.", "motivation": "표준적인 제일원리(DFT) 계산은 주로 절대영도(T=0)에서의 구조를 다룹니다. 본 연구는 비조화 진동(anharmonic phonon) 효과를 포함하여 유한 온도에서 La3Ni2O7의 구조적 최적화를 수행할 수 있는 새로운 효율적인 프레임워크를 개발하고 적용하고자 했습니다.", "result": "유한 온도 효과와 비조화성을 고려한 구조 최적화를 통해, 고온 및 고압 조건에서의 La3Ni2O7의 안정적인 상(phase)과 격자 매개변수를 정확히 예측했습니다. 특히 비조화 포논 이론을 통해 온도가 구조적 상전이에 미치는 영향을 정량적으로 계산해냈습니다.", "implication": "계산된 구조는 DFT+DMFT 등 상관관계가 강한 계를 다루는 후속 전자 구조 계산의 신뢰도를 높여주며, 니켈레이트 초전도체의 핵심인 d-오비탈 채움 정도와 결정장 갈라짐(crystal field splitting)을 보다 정확히 추정하게 해줍니다.", "novelty": "독자의 관심사인 니켈레이트 초전도체와 DFT+DMFT 방법론의 기초가 되는 '정확한 구조 정보'를 유한 온도 조건에서 제공합니다. 특히 anharmonicity를 효율적으로 처리하는 수치적 방법론을 제시했다는 점이 기술적 혁신입니다.", "unresolved": "계산된 구조가 실제 실험에서 관찰되는 전하 밀도파(CDW)나 자기 질서와 어떻게 구체적으로 얽히는지에 대한 통합적인 분석은 여전히 진행 중입니다.", "future_work": "이 프레임워크를 다른 전이금속 산화물이나 압력 유도 상전이를 보이는 위상 물질에 적용하여 유한 온도 물성을 예측하는 연구가 이어질 것으로 보입니다.", "concepts": [{"term": "복층 니켈레이트 (Bilayer Nickelate)", "why_emerged": "구리 산화물(Cuprates)과 유사한 전자 구조를 가진 물질에서 고온 초전도성을 찾기 위해 연구되었습니다.", "origin": "실험적 발견은 Sun et al. (Nature, 2023)이 기점", "connections": "La3Ni2O7, 고온 초전도, 강상관 전자계"}, {"term": "비조화 포논 (Anharmonic Phonon)", "why_emerged": "격자 진동이 조화 진동자 모델을 벗어나는 경우(특히 고온/고압)의 물리적 현상을 설명하기 위해 필요합니다.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "열전도, 구조적 상전이, 자유 에너지 계산"}, {"term": "제일원리 구조 최적화 (Ab initio Optimization)", "why_emerged": "실험 데이터 없이 양자역학 계산만으로 물질의 가장 안정적인 원자 배열을 찾기 위해 등장했습니다.", "origin": "Hohenberg-Kohn 및 Kohn-Sham (1964, 1965)", "connections": "DFT, 기하 구조 최적화"}, {"term": "유한 온도 구조 최적화", "why_emerged": "실제 실험 환경은 0K가 아니므로 온도에 따른 격자 팽창 및 엔트로피 효과를 고려해야 정확한 물성 예측이 가능합니다.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "헬름홀츠 자유 에너지, 통계역학"}], "english_summary": ["Developed a first-principles framework for finite-temperature structural optimization including anharmonic phonons.", "Applied the method to the bilayer nickelate superconductor La3Ni2O7 under pressure.", "Improved the efficiency of free energy minimization considering vibrational contributions.", "Provides accurate structural parameters crucial for understanding the high-Tc mechanism in nickelates."]}}, {"title": "Nonequilibrium effects in vibrational modes pumped by inelastic tunneling", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/17p5-2cj9", "authors": "Chi Ming Yim, Owain T. Beynon, Seunghyun Khim, Chiara Gattinoni, Peter Wahl", "last_authors": "Chiara Gattinoni, Peter Wahl", "summary": "The properties of strongly correlated electron materials exhibit a surprising sensitivity to small lattice distortions, providing an opportunity for their tuning by selective distortion driving, usually achieved by optical excitations. Using inelastic electron tunneling in scanning tunneling microsc…", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Relevant to STM/STS investigations of correlated electron systems and lattice coupling.", "tags": ["theory", "STM", "vibrationalmodes"], "image": "", "briefing": {"background": "강상관 전자계 물질의 특성은 미세한 격자 왜곡에 매우 민감하게 반응합니다. 보통은 빛(광학적 여기)을 이용해 격자를 제어하지만, 주사 터널링 현미경(STM)의 비탄성 전자 터널링을 이용하면 원자 단위의 국소적인 격자 진동 제어가 가능할 수 있습니다.", "motivation": "STM의 비탄성 전자 터널링 분광법(IETS) 과정에서 터널링 전자가 국소적인 진동 모드(vibrational modes)를 어떻게 여기시키고, 이것이 비평형 상태를 어떻게 유도하는지에 대한 물리적 기작을 이해하고자 했습니다.", "result": "터널링 전자가 격자 모드를 펌핑(pumping)하여 비평형 점유 상태를 만드는 과정을 분석했습니다. 특히 팁과 시료 사이의 전압 및 전류 조건에 따라 특정 진동 모드가 비정상적으로 활성화될 수 있음을 보였으며, 이를 통해 국소적인 물성 변화를 유도할 수 있는 가능성을 제시했습니다.", "implication": "STM을 단순히 관찰 도구가 아니라, 국소적인 '격자 공학(lattice engineering)' 도구로 활용하여 나노 스케일에서 강상관 위상 변화나 초전도성을 미세 조정할 수 있는 길을 제시합니다.", "novelty": "STM/STS를 주력으로 하는 독자에게 매우 유용한 연구로, IETS 신호를 단순한 스펙트럼 해석을 넘어 '비평형 상태의 제어 변수'로 바라보게 합니다. 특히 상관관계 물질에서의 격자-전자 결합 연구에 직접적인 통찰을 제공합니다.", "unresolved": "이러한 비평형 진동 여기 상태가 얼마나 오랫동안 지속되는지(결맞음 시간)와 주변 원자로의 에너지 소산(dissipation) 과정에 대한 구체적인 데이터는 부족합니다.", "future_work": "실제 NbSe3와 같은 CDW 물질이나 112 telluride 화합물에서 STM 팁을 이용해 국소적으로 CDW 차수 파라미터를 조절하는 실험이 가능할 것으로 보입니다.", "concepts": [{"term": "비탄성 전자 터널링 분광법 (IETS)", "why_emerged": "터널링 과정에서 전자가 에너지를 잃으며 분자나 격자의 진동을 일으키는 현상을 측정하기 위해 고안되었습니다.", "origin": "Jaklevic and Lambe (1966)", "connections": "STM, 분자 진동, 포논 분광학"}, {"term": "비평형 상태 (Nonequilibrium)", "why_emerged": "외부 자극(전류, 빛 등)에 의해 계가 열적 평형에서 벗어나 새로운 동역학적 특성을 보일 때 이를 설명하기 위해 필요합니다.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "플로케 공학, 펌프-프로브 실험"}, {"term": "주사 터널링 현미경 (STM)", "why_emerged": "물질의 표면을 원자 단위 해상도로 관찰하고 국소적인 전자 구조(LDOS)를 측정하기 위해 발명되었습니다.", "origin": "Binnig and Rohrer (1981)", "connections": "STS, IETS, 원자 조작"}, {"term": "진동 모드 (Vibrational Mode)", "why_emerged": "결정 격자 내 원자들의 집단적인 움직임이 전자계의 성질에 미치는 영향을 이해하기 위해 필요합니다.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "포논, 전자-포논 결합"}], "english_summary": ["Investigates nonequilibrium populations of vibrational modes excited by inelastic tunneling in STM.", "Shows that tunneling electrons can effectively pump local lattice distortions.", "Provides a theoretical and experimental basis for controlling local material properties via IETS.", "Relevant for tuning strongly correlated states at the atomic scale using scanning probes."]}}, {"title": "Nonrelativistic Ising superconductivity in p-wave magnets", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/p21c-rtv7", "authors": "M. Khodas, Libor Šmejkal, I. I. Mazin", "last_authors": "Libor Šmejkal, I. I. Mazin", "summary": "We discuss a possibility of superconductivity in the $p$-wave magnets. These are recently discovered materials that have zero net magnetization by symmetry and finite nonrelativistic spin splittin  point.", "Reports the absence of phonon criticality at high pressure.", "Challenges conventional nesting-driven models for density waves in Cr.", "Suggests complex underlying electronic mechanisms beyond simple phonon softening."]}}, {"title": "Possible origin of the 1750.16em0excm−1 Raman mode in altermagnetic MnTe", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/7pd9-xwmw", "authors": "Bishal Thapa, K. D. Belashchenko, Igor I. Mazin", "last_authors": "K. D. Belashchenko, Igor I. Mazin", "summary": "MnTe has recently attracted exceptional attention due to its well-established altermagnetism, prompting a thorough reexamination of its properties. In particular, it was found that a Raman-active excitation at $∼175\\phantom{\\rule{0.28em}{0ex}}{\\mathrm{cm}}^{−1}$, routinely assigned to the ${E}_{2g}$…", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Focuses on MnTe, a key altermagnetic material of direct interest, despite using Raman spectroscopy.", "tags": ["material", "MnTe", "altermagnet"], "image": "", "briefing": {"background": "알터자성(Altermagnetism)은 기존의 강자성(순자화 발생)이나 반강자성(시간반전 대칭성 보존)과 구분되는 새로운 자기적 상태로, 결정 대칭성을 바탕으로 스핀 분리된 밴드 구조를 가집니다.", "motivation": "MnTe는 알터자성의 대표 물질로 주목받고 있으나, 특정 라만 모드(175 cm^-1)의 기원에 대한 해석이 기존 문헌들 간에 불일치를 보이고 있어 이를 규명하고자 함.", "result": "이전까지 E2g 모드로 흔히 간주되던 175 cm^-1 라만 모드의 물리적 기원을 이론적으로 재해석하여, MnTe의 알터자성 특성과 관련된 격자 및 자기적 상호작용의 관점에서 새로운 해석을 제시함.", "implication": "MnTe의 라만 스펙트럼 해석을 바로잡음으로써, 향후 분광학적 측정 데이터를 바탕으로 알터자성 물질의 물리적 특성을 연구하는 데 정확한 가이드라인을 제공함.", "novelty": "실험적 이상 현상을 DFT 기반의 정교한 분석으로 규명하여 알터자성 물질의 분광학적 이해를 높임. 독자의 주요 관심사인 알터자성체 연구에 필요한 기초 데이터 해석을 개선함.", "unresolved": "해당 라만 모드가 단순 격자 진동인지, 아니면 자기적 기원을 동반한 들뜸인지에 대한 실험적 확증이 추가로 필요함.", "future_work": "저온 환경에서의 편광 라만 측정 등을 통해 계산된 모드들의 대칭성을 실험적으로 검증하는 후속 연구가 필요함.", "concepts": [{"term": "알터자성", "why_emerged": "강자성과 반강자성의 경계를 넘어선 새로운 자기적 대칭성 분류가 필요했기 때문.", "origin": "최근 1~2년 사이의 이론적 정립 (Mazil, Šmejkal 등).", "connections": "반강자성 스핀트로닉스, 비상반적 function textEl(tag, className, text) { const el = document.createElement(tag); if (className) el.className = className; el.textContent = text || ''; return el; }
function appendLabeledText(parent, className, label, text) { if (!text) return; const el = document.createElement('p'); el.className = className; const strong = textEl('strong', '', label); el.appendChild(strong); el.append(text); parent.appendChild(el); }
function appendBriefSection(parent, title, text, wide = false) { if (!text) return; const section = document.createElement('section'); section.className = 'brief-section' + (wide ? ' wide' : ''); section.appendChild(textEl('h2', '', title)); section.appendChild(textEl('p', '', text)); parent.appendChild(section); }
function render() {
  slideEl.replaceChildren();
  if (!slides.length) { slideEl.className = 'empty'; slideEl.textContent = 'No papers passed the filters in this run.'; counterEl.textContent = '0 / 0'; prevBtn.disabled = true; nextBtn.disabled = true; return; }
  slideEl.className = 'slide';
  const r = slides[index];
  const b = r.briefing || {};
  const head = document.createElement('div');
  head.className = 'paper-head';
  if (r.image) {
    const figure = document.createElement('figure');
    figure.className = 'figure';
    const img = document.createElement('img');
    img.src = r.image; img.alt = 'Figure or article preview image'; img.loading = 'lazy'; img.referrerPolicy = 'no-referrer'; img.onerror = () => figure.remove();
    figure.appendChild(img);
    figure.appendChild(textEl('figcaption', '', 'Figure / article preview image from the source page'));
    head.appendChild(figure);
  }
  const headText = document.createElement('div');
  headText.className = 'head-text';
  const badges = document.createElement('div');
  badges.className = 'badges';
  if (r.score) badges.appendChild(textEl('span', 'badge score', `${r.score}/10`));
  if (r.tier) badges.appendChild(textEl('span', 'badge', r.tier));
  if (r.journal) badges.appendChild(textEl('span', 'badge', r.journal));
  if (r.source) badges.appendChild(textEl('span', 'badge', r.source));
  headText.appendChild(badges);
  const title = document.createElement('h1');
  if (r.link) { const titleLink = document.createElement('a'); titleLink.href = r.link; titleLink.target = '_blank'; titleLink.rel = 'noopener noreferrer'; titleLink.textContent = r.title || ''; title.appendChild(titleLink); }
  else { title.textContent = r.title || ''; }
  headText.appendChild(title);
  headText.appendChild(textEl('p', 'meta', [r.journal, r.source].filter(Boolean).join(' | ')));
  if (r.last_authors || r.authors) { const authors = document.createElement('p'); authors.className = 'authors'; if (r.last_authors) authors.append('Last authors: ' + r.last_authors); if (r.authors) authors.append((r.last_authors ? ' | ' : '') + 'Authors: ' + r.authors); headText.appendChild(authors); }
  appendLabeledText(headText, 'why', 'Filter reason: ', r.reason);
  if (r.tags && r.tags.length) { const tags = document.createElement('div'); tags.className = 'tags'; r.tags.forEach(tag => tags.appendChild(textEl('span', 'tag', '#' + tag))); headText.appendChild(tags); }
  if (r.link) { const link = document.createElement('a'); link.className = 'link'; link.href = r.link; link.target = '_blank'; link.rel = 'noopener noreferrer'; link.textContent = 'Open paper'; headText.appendChild(link); }
  head.appendChild(headText);
  if (r.summary) { const abstract = document.createElement('p'); abstract.className = 'original-abstract'; const strong = textEl('strong', '', 'Original abstract'); abstract.appendChild(strong); abstract.append(r.summary); head.appendChild(abstract); }
  slideEl.appendChild(head);
  const briefing = document.createElement('div');
  briefing.className = 'briefing';
  appendBriefSection(briefing, 'Background', b.background);
  appendBriefSection(briefing, 'Motivation', b.motivation);
  appendBriefSection(briefing, 'Result', b.result);
  appendBriefSection(briefing, 'Implication', b.implication);
  appendBriefSection(briefing, "Why it's important / Novelty", b.novelty);
  appendBriefSection(briefing, 'Unresolved Questions', b.unresolved);
  appendBriefSection(briefing, 'Expected Future Work', b.future_work);
  if (b.concepts && b.concepts.length) {
    const section = document.createElement('section');
    section.className = 'brief-section wide';
    section.appendChild(textEl('h2', '', 'Concepts / Terms'));
    const concepts = document.createElement('div');
    concepts.className = 'concepts';
    b.concepts.forEach(c => {
      const item = document.createElement('div');
      item.className = 'concept';
      item.appendChild(textEl('h3', '', c.term || 'Concept'));
      [['왜 생겼나: ', c.why_emerged], ['누가 만들었나: ', c.origin], ['연결되는 흐름: ', c.connections]].forEach(([label, text]) => { if (!text) return; const p = document.createElement('p'); const bold = textEl('b', '', label); p.appendChild(bold); p.append(text); item.appendChild(p); });
      concepts.appendChild(item);
    });
    section.appendChild(concepts);
    briefing.appendChild(section);
  }
  if (b.english_summary && b.english_summary.length) { const section = document.createElement('section'); section.className = 'brief-section wide'; section.appendChild(textEl('h2', '', 'English Summary')); const ul = document.createElement('ul'); b.english_summary.slice(0, 5).forEach(line => ul.appendChild(textEl('li', '', line))); section.appendChild(ul); briefing.appendChild(section); }
  slideEl.appendChild(briefing);
  counterEl.textContent = `${index + 1} / ${slides.length}`;
  prevBtn.disabled = index === 0;
  nextBtn.disabled = index === slides.length - 1;
}
prevBtn.addEventListener('click', () => { index = Math.max(0, index - 1); render(); });
nextBtn.addEventListener('click', () => { index = Math.min(slides.length - 1, index + 1); render(); });
document.addEventListener('keydown', event => { if (event.key === 'ArrowLeft') prevBtn.click(); if (event.key === 'ArrowRight') nextBtn.click(); });
render();
</script>
</body>
</html>
