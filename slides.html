<title>Daily Paper Slideshow</title>
<style>
  :root {
    color-scheme: light;
    --bg: #f6f7f4;
    --paper: #ffffff;
    --ink: #111827;
    --muted: #64748b;
    --line: #d8ddd2;
    --accent: #176b87;
    --accent-2: #9a3412;
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; overflow: auto; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: var(--bg); color: var(--ink); }
  .shell { max-width: 1500px; min-height: 100vh; margin: 0 auto; padding: 14px 18px; display: flex; flex-direction: column; }
  .topbar { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 16px; }
  .top-actions { display: flex; align-items: center; gap: 10px; }
  .topbar a, button { border: 1px solid var(--line); border-radius: 8px; background: var(--paper); color: var(--ink); padding: 10px 14px; font-weight: 700; text-decoration: none; cursor: pointer; }
  button.primary { background: var(--accent); border-color: var(--accent); color: white; }
  button:disabled { opacity: 0.45; cursor: not-allowed; }
  .counter { color: var(--muted); font-weight: 700; }
  .slide { min-height: calc(100vh - 82px); background: var(--paper); border: 1px solid var(--line); border-radius: 10px; padding: 18px; box-shadow: 0 18px 42px rgba(15, 23, 42, 0.10); display: grid; grid-template-columns: minmax(310px, 0.86fr) minmax(0, 1.55fr); gap: 18px; overflow: visible; }
  .paper-head { min-width: 0; min-height: 0; overflow: visible; display: flex; flex-direction: column; gap: 12px; }
  .figure { margin: 0; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: #f8fafc; }
  .figure img { display: block; width: 100%; max-height: 41vh; object-fit: contain; background: white; }
  .figure figcaption { padding: 7px 10px; color: var(--muted); font-size: 12px; line-height: 1.3; }
  .head-text { display: flex; flex-direction: column; gap: 9px; min-width: 0; }
  .badges { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .badge { border-radius: 999px; padding: 5px 9px; background: #eef2ff; color: #3730a3; font-size: 12px; font-weight: 800; }
  .score { background: #fee2e2; color: #991b1b; }
  h1 { margin: 0; font-size: 25px; line-height: 1.15; letter-spacing: 0; overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
  h1 a { color: inherit; text-decoration-color: rgba(23, 107, 135, 0.35); text-decoration-thickness: 2px; text-underline-offset: 4px; }
  h1 a:hover { color: var(--accent); text-decoration-color: var(--accent); }
  .meta, .authors, .why, .abstract { font-size: 13px; line-height: 1.45; }
  .meta, .authors { color: var(--muted); }
  .why strong, .abstract strong, .authors strong { color: var(--ink); }
  .authors { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .why { border-left: 4px solid var(--accent-2); padding-left: 10px; color: #374151; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .abstract { border-top: 1px solid var(--line); padding-top: 14px; color: #374151; }
  .original-abstract { border-top: 1px solid var(--line); padding-top: 10px; color: #374151; font-size: 11.5px; line-height: 1.35; overflow-wrap: anywhere; }
  .original-abstract strong { display: block; margin-bottom: 4px; color: var(--ink); }
  .tags { display: flex; flex-wrap: wrap; gap: 8px; }
  .tag { border-radius: 999px; padding: 4px 8px; background: #f1f5f9; color: #475569; font-size: 12px; font-weight: 700; }
  .head-text > .link { display: none; }
  .briefing { min-width: 0; min-height: 0; overflow: visible; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); grid-auto-rows: minmax(0, auto); align-content: start; gap: 11px 18px; border-top: 0; padding-top: 0; }
  .brief-section { min-width: 0; }
  .brief-section.wide { grid-column: 1 / -1; }
  .brief-section h2 { margin: 0 0 4px; font-size: 14px; line-height: 1.22; color: #0f766e; letter-spacing: 0; }
  .brief-section p, .brief-section li { margin: 0; font-size: 12.5px; line-height: 1.42; color: #1f2937; overflow-wrap: anywhere; }
  .brief-section ul { margin: 0; padding-left: 20px; }
  .concepts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 9px 14px; }
  .concept { border-top: 1px solid var(--line); padding-top: 7px; }
  .concept h3 { margin: 0 0 4px; font-size: 13px; color: #7c2d12; letter-spacing: 0; }
  .concept p { margin: 2px 0 0; font-size: 11.5px; line-height: 1.35; color: #374151; overflow-wrap: anywhere; }
  .concept b { color: #111827; }
  .link { color: var(--accent); font-weight: 800; text-decoration: none; }
  .empty { padding: 48px; background: var(--paper); border: 1px solid var(--line); border-radius: 12px; color: var(--muted); }
  @media (max-width: 860px) {
    .shell { padding: 14px; }
    .topbar, .top-actions { align-items: stretch; flex-direction: column; }
    .slide, .briefing, .concepts { grid-template-columns: 1fr; }
    .slide { min-height: auto; overflow: visible; display: grid; }
    h1 { font-size: 28px; }
  }
</style>

<script>
const slides = [{"title": "Interplay between charge correlations and superconductivity across the superconducting domes of CsV3Sb(5−x)Snx", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/bcqw-7lsf", "authors": "Andrea N. Capa Salinas, Steven J. Gomez Alvarado, Brenden R. Ortiz, et al.", "last_authors": "Turan Birol, Stephen D. Wilson", "summary": "The kagome metal ${\\mathrm{CsV}}_{3}{\\mathrm{Sb}}_{5}$ hosts an anomalous interplay between charge density wave (CDW) order and superconductivity—one where tuning its band filling by adding holes rapidly suppresses long-range CDW order and drives the formation of two unusual superconducting “domes.”…", "tier": "A_MUST_READ", "score": "10", "reason": "Direct focus on CsV3Sb5, kagome superconductivity, CDW order, and electronic structure.", "tags": ["material", "kagome", "superconductivity", "chargedensitywave"], "image": "", "briefing": {"background": "Kagome 금속 CsV3Sb5는 전하 밀도 파동(CDW)과 초전도성이 공존하며 흥미로운 전자적 상호작용을 보여주는 대표적인 강상관 물질 시스템입니다.", "motivation": "CsV3Sb5에서 캐리어 도핑(Sn 치환을 통한 홀 도핑)이 CDW 상태와 초전도 돔 구조에 미치는 영향을 체계적으로 조사하고자 했습니다.", "result": "Sn 치환에 따른 밴드 채움 변화가 CDW를 급격히 억제하며, 두 개의 분리된 초전도 돔이 형성되는 현상을 관찰했습니다.", "implication": "CDW와 초전도성 사이의 경쟁 또는 상호 보완적 관계를 명확히 함으로써, 카고메 격자에서의 다체계적인 전자 상태 제어 가능성을 제시합니다.", "novelty": "CsV3Sb5의 도핑 제어를 통한 초전도 상도의 정밀한 매핑을 제공하며, 이는 기존 연구자들의 카고메 금속 물성 이해를 더욱 구체화합니다.", "unresolved": "두 개의 초전도 돔이 정확히 어떤 물리적 기원을 갖는지(예: 페르미 면의 변화 vs 특정 밴드 모드)에 대한 미세한 메커니즘은 추가 규명이 필요합니다.", "future_work": "도핑된 샘플에 대한 저온 주사 터널링 현미경(STM) 및 ARPES를 통해 CDW 파괴와 초전도성 강화의 국소적, 밴드 구조적 변화를 직접 관찰할 예정입니다.", "concepts": [{"term": "CDW 돔", "why_emerged": "물질의 전자 밀도가 특정 파동 벡터를 가지고 주기적으로 변하는 상태를 의미하며, CsV3Sb5의 초전도성과 경쟁하거나 협력하는 현상을 이해하기 위해 필요함.", "origin": "R.E. Peierls에 의해 1차원 금속 시스템에서 제안됨.", "connections": "페르미 면 중첩(nesting), 전자-격자 결합."}], "english_summary": ["Investigated the effect of Sn doping in CsV3Sb5 on CDW and superconductivity.", "Hole doping suppresses the CDW order rapidly.", "Discovery of two distinct superconducting domes in the phase diagram.", "Provides insight into the competing order between CDW and superconductivity in kagome metals."]}}, {"title": "Interaction-driven flat band and charge order in Fe 5 GeTe 2", "journal": "Science_Advances", "source": "Gemini", "link": "https://doi.org/10.1126/sciadv.aeg5930", "authors": "Qiang Gao, Gabriele Berruto, Khanh Duy Nguyen, et al.", "last_authors": "Jiun-Haw Chu, Shuolong Yang", "summary": "Flat electronic bands enable fascinating emergent phenomena such as superconductivity and charge orders. A prevailing approach to realizing flat bands is to engineer lattice geometric constraints in twisted or kagome-like materials. An alternative approach is to utilize purely electronic-interaction-driven flat bands, yet a fundamental challenge is that extreme flatness requires ultrastrong interaction strength, which often leads to incoherent states. Here we demonstrate the concurrent formation of an interaction-driven flat band at the Fermi level and a 3 × 3 R 30 ° charge order in a van der Waals magnet Fe 5 GeTe 2 using high-resolution angle-resolved photoemission spectroscopy. This charge order is manifested by band folding within 30 meV below the Fermi level, with its nesting driven by flat bands. The presence of this flat band throughout the Brillouin zone and the logarithmic temperature dependence of its spectral weight suggest a phenomenological Kondo-like, coherent Fermi liquid emerging from strong correlations. Our work establishes a paradigm where an interaction-driven flat band promotes large-scale electronic ordering.", "tier": "A_MUST_READ", "score": "10", "reason": "Direct ARPES study of interaction-driven flat band and charge order in a van der Waals magnet.", "tags": ["ARPES", "flatband", "chargeorder", "correlatedelectrons", "vanderWaals", "magnetism", "Fe5GeTe2"], "image": "", "briefing": {"background": "평탄한 전자 밴드(Flat band)는 전자 간 강한 상호작용을 유도하여 초전도, 자기적 정렬, 전하 밀도 파동 등 다양한 양자 현상을 창출하는 핵심 요소입니다.", "motivation": "격자 구조 기반의 밴드 평탄화가 아닌, 강한 전자 상호작용 자체에 의해 유도된 평탄 밴드가 Fe5GeTe2에서 나타나는지 규명하고자 했습니다.", "result": "ARPES를 통해 Fe5GeTe2에서 페르미 준위 근처의 평탄 밴드와 3x3xR30° 전하 질서가 동시에 형성됨을 확인했습니다.", "implication": "평탄 밴드가 강한 상관관계를 매개로 전하 질서를 유도하는 새로운 메커니즘을 입증했습니다.", "novelty": "밴드 평탄화가 구조적 엔지니어링 없이 상호작용만으로도 가능함을 보였으며, 이는 자성 반데르발스 물질 연구에 중요한 전환점입니다.", "unresolved": "30 meV 하부의 밴드 폴딩이 정확히 어떤 전자적 환경에서 가장 강하게 발현되는지에 대한 다체계적 해석이 완벽히 정립되지 않았습니다.", "future_work": "온도 변화에 따른 스펙트럼 무게 변화를 통한 Kondo-like 페르미 액체 거동의 상세 연구 및 도핑을 통한 전하 질서 제어 실험이 기대됩니다.", "concepts": [{"term": "Flat band", "why_emerged": "전자의 유효 질량이 무한대에 가까워져 전자 간 상호작용 효과가 극대화되는 에너지 대역을 기술하기 위해 도입됨.", "origin": "초격자 및 카고메 격자 연구에서 주로 다뤄짐.", "connections": "상관 전자계, 비상관 Fermi 액체, 초전도성."}, {"term": "Fe5GeTe2", "why_emerged": "자성을 띄는 2D 물질로서 반데르발스 층상 구조와 상관 전자 현상을 결합하여 연구하기 위해 주목받음.", "origin": "최근 5년 내 Fe-Ge-Te 계열 물질 연구에서 본격 부상.", "connections": "Fe3GeTe2, 반데르발스 강자성체."}], "english_summary": ["Demonstrates interaction-driven flat band formation in Fe5GeTe2.", "Observed concurrent 3x3xR30 charge order using high-resolution ARPES.", "The flat band acts as the driving force for the charge order via band nesting.", "Suggests a Kondo-like coherent Fermi liquid behavior due to strong correlations."]}}, {"title": "A spin-bond theory unifying non-relativistic spin splitting and emergent spin-orbit textures", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2608.09644", "authors": "S. Allende, R. M. Otxoa", "last_authors": "S. Allende, R. M. Otxoa", "summary": "Magnetic order with vanishing net magnetization can produce non-relativistic spin-split bands, broadly categorized into even-parity altermagnets and odd-parity \\(p\\)-wave magnets. Here, we introduce a spin-bond theory that unifies these seemingly distinct phenomena into a single algebraic framework. We demonstrate that non-relativistic spin textures are fundamentally governed by two components of the electronic bond: unitary spin phases and Hermitian spin amplitudes. The unitary sector generates odd-parity p-wave and emergent spin-orbit-like textures, while the Hermitian sector generates even-parity spin fields, including the uniform \\(\\Gamma\\)-split and bond-structured altermagnetic limits. Beyond unifying known phases, our theory uncovers a mixed non-commuting regime that emerges when the unitary and Hermitian sectors fail to commute, revealing an underlying non-commuting spin-bond structure. This regime generates a non-coplanar spin texture characterized by an even-in-momentum transverse spin polarization, providing a direct spectroscopic fingerprint for spin- and angle-resolved photoemission spectroscopy. Furthermore, we establish that this synthetic spin-orbit coupling can be dynamically tuned by geometrically controlling the non-commutation of the bond sectors. By providing a microscopic foundation for such tuning, our theory paves the way for advanced applications, including field-free spin qubits.", "tier": "A_MUST_READ", "score": "10", "reason": "Unified altermagnetism theory providing specific fingerprints for spin-resolved angle-resolved photoemission spectroscopy.", "tags": ["theory", "altermagnetism", "ARPES"], "image": "https://arxiv.org/html/2608.09644v1/x1.png", "briefing": {"background": "Altermagnetism(교대 자성)은 순자화가 0임에도 불구하고 결정 구조 대칭성에 의해 에너지 밴드에 스핀 분할이 발생하는 새로운 자성 상태입니다.", "motivation": "기존에 분리되어 논의되던 even-parity 알터마그넷과 odd-parity p-wave 자성을 통합하는 보편적인 이론 프레임워크가 필요했습니다.", "result": "스핀-결합(spin-bond) 이론을 통해 유니타리 및 에르미트 스핀 성분으로 스핀 분할을 통합 설명하고, 새로운 비교환적 regimes을 발견했습니다.", "implication": "알터마그넷 시스템에서 관찰되는 스핀 텍스처를 스펙트럼 지문(spectroscopic fingerprint)으로 정의하여 실험적 검증 가능성을 높였습니다.", "novelty": "이론적 통합뿐만 아니라 스핀 분할을 기하학적 제어로 튜닝할 수 있는 물리적 기초를 제공하여 스핀트로닉스 응용의 가능성을 열었습니다.", "unresolved": "비교환적 regimes에서 나타나는 비공면적 스핀 텍스처의 실험적 관찰은 아직 초기 단계입니다.", "future_work": "제시된 스핀-결합 모델을 특정 알터마그넷 후보 물질에 대입하여 스핀 분해 ARPES 데이터와의 정량적 비교가 필요합니다.", "concepts": [{"term": "Altermagnetism", "why_emerged": "강자성도 아니고 반강자성도 아닌, 대칭성  "authors": "Siyuan Qiu, Philip D. Suh, Nhat Huy Tran, et al.", "last_authors": "Zhixun Shen, Zhurun Ji", "summary": "Most AI agents act only after scientists have defined the task. Discovery is harder under practical uncertainties: the probe may not be where it is expected, the signal may occupy only a small region of a disordered sample, and the evidence may not distinguish among competing explanations. Here we show that an AI agent can decide what evidence an uncertain experiment needs next, and act on it. Beyond automation, AIMS, an uncertainty-aware experimentalist for cryogenic microwave impedance microscopy, quantifies uncertainty where it originates, in perception, sampling, and interpretation, and converts each into its own corrective action rather than a single confidence score. Given only an open objective, AIMS relocated a probe lost during cooldown while flagging its own unreliable estimates, mapped twist angle disorder to locate the strongest correlated states in twisted bilayer MoSe$_2$, and uncovered a paradox: the half-filled stripe that classical theory predicts should melt first survived longest. Distinguishing an incomplete model from a wrong mechanism, AIMS commissioned a beyond-mean-field calculation and an independent structural measurement as the decisive tests, revising its interpretation as each arrived: quantum motion reverses the classical hierarchy, stabilizing the half-filled stripe while destabilizing its neighbors. These uncertainty-to-action loops are generic to scanning probe experiments, and AIMS turns uncertainty from an obstacle into a driver of discovery.", "tier": "A_MUST_READ", "score": "9", "reason": "author whitelist: Zhixun Shen", "tags": ["STS", "twistedbilayer", "correlated", "twisted"], "image": "https://arxiv.org/html/2607.16544v2/Figure1.jpg", "briefing": {"background": "주사 탐침 현미경(STM, MIM 등)을 이용한 복잡한 양자 물질 분석은 실험 환경의 불확실성과 데이터 노이즈, 해석의 모호함 때문에 높은 숙련도를 가진 연구자의 직관에 크게 의존해 왔습니다.", "motivation": "불확실한 실험 상황에서 연구자가 어떻게 판단하 k": "https://arxiv.org/abs/2608.09054", "authors": "Mengyang Zhang, Jie Li, Yifei Chen, Shifang Li, Zhentao Fu, Jianxin Zhong", "last_authors": "Zhentao Fu, Jianxin Zhong", "summary": "Realizing the spin-resolved electronic properties in superconducting materials stands as a critical frontier, offering both novel fundamental physics and potential for dissipationless spin-based devices. Here, we predict a series of Janus FeX0.5Y0.5 monolayers derived from iron-based superconductors (e.g., FeSe, FeTe, and FeS) by using Kondo-type model and first-principles calculations. These Janus structures exhibit significant spin-splittingelectronic states, large topological band gaps (51.4 meV) and high N\\'eel temperatures (415 K). We further reveal that valley polarization can be effectively tuned via applied in-plane strain and the resulting valley-polarized anomalous Hall conductivity can be manipulated by shifting the Fermi level. Our work suggests a new strategy based on altermagnetism for engineering spin-splitting states in superconducting systems and inspires further exploration of superconducting spintronics.", "tier": "A_MUST_READ", "score": "9", "reason": "Altermagnetism and spin-resolved electronic structure in iron-based monolayers; high relevance to ARPES.", "tags": ["theory", "altermagnetism", "iron-basedsuperconductors"], "image": "https://arxiv.org/static/browse/0.3.4/images/arxiv-logo-fb.png", "briefing": {"background": "최근 스핀 편극이 없는 상태에서도 자기적 정렬에 의해 밴드 구조가 스핀 분할되는 'Altermagnetism' 개념이 등장하며, 이를 이용한 소자 응용 및 스핀트로닉스 연구가 활발해지고 있습니다.", "motivation": "철 기반 초전도체 모체 물질을 바탕으로 한 Janus 단층 구조가 스핀 분할 및 위상학적 특성을 가지는지 이론적으로 규명하고자 했습니다.", "result": "FeX0.5Y0.5(X, Y = S, Se, Te) Janus 단층이 강한 스핀 분할과 높은 Néel 온도를 가짐을 예측했습니다.", "implication": "이러한 물질은 스핀 편극된 밴드를 가지면서 동시에 초전도성을 나타낼 가능성이 있어, 초전도 기반 스핀트로닉스 구현을 위한 새로운 물질 후보군을 제시합니다.", "novelty": "Janus 구조를 도입하여 대칭성을 깨뜨리고 altermagnetism을 유도한 점이 독창적입니다. 특히 철 기반 초전도체 연구자에게 ARPES를 통한 밴드 구조 확인을 위한 유력한 후보 물질을 제안합니다.", "unresolved": "이론적인 예측이 nsider effects of both interaction and the curvature of fermionic dispersion. The finite frequency conductivity, calculated in the lowest order of disorder potential, consists of two parts. First one is the elastic contribution, largely independent of temperature and interaction. Second one is the inelastic contribution, strongly dependent on temperature and frequency and appearing upon simultaneous presence of curvature, disorder and interaction. We argue that apart from such finite frequency conductivity, there should always remain the $\\delta$-function peak of conductivity at zero frequency, whose weight is weakly dependent on the disorder.", "tier": "A_MUST_READ", "score": "9", "reason": "title strong match: Luttinger liquid", "tags": ["STS", "Luttinger"], "image": "https://arxiv.org/html/2403.15930v3/nonint.png", "briefing": {"background": "1차원 페르미온 시스템에서 전자 간 상호작용이 강해지면 일반적인 페르미 액체 이론이 무너지고 전하와 스핀의 자유도가 분리되는 '러팅어 액체(Luttinger Liquid)' 상태가 형성됩니다.", "motivation": "비선형 러팅어 액체 모델에서 페르미온 분산의 곡률과 무질서(disorder)가 상호작용할 때, 유한 주파수에서 나타나는 전기 전도도의 특성을 이론적으로 규명하고자 함.", "result": "유한 주파수 전도도가 무질서와의 상호작용 방식에 따라 탄성 및 비탄성 성분으로 나뉘며, 비탄성 성분은 온도와 주파수에 강하게 의존함을 보임. 또한, 무질서가 존재함에도 0 주파수에서 델타 함수 형태의 전도도 피크가 유지됨을 확인함.", "implication": "1차원 도체 및 준1차원 물질에서 관찰되는 비정상적인 전도 현상을 이론적으로 설명할 수 있는 기초가 됨.", "novelty": "곡률 효과가 포함된 비선형 러팅어 액체 모델에서 무질서에 의한 동적 전도도 응답을 구체적으로 도출한 점이 핵심적임.", "unresolved": "매우 매끄러운 무질서 포텐셜을 가정하고 있어, 강한 불순물이 존재하는 실제 실험 환경에서의 정밀한 적용은 추가 연구가 필요함.", "future_work": "실제 준1차원 물질에서의 광학 전도도 측정 및 STS를 이용한 국소적 전자 상태 밀도와 전도도의 상관관계 연구가 예상됨.", "concepts": [{"term": "러팅어 액체 (Luttinger Liquid)", "why_emerged": "상호작용이 강한 1차원 시스템에서 단일 입자 여기(quasiparticle) 개념이 붕괴하고 집단 들뜸 현상이 지배적이게 되어 도입됨.", "origin": "Tomonaga(1950)와 Luttinger(1963)에 의해 기초가 마련됨.", "connections": "스핀-전하 분리, 탄소 나노튜브, 준1차원 금속."}, {"term": "비선형 러팅어 액체 (Nonlinear Luttinger Liquid)", "why_emerged": "선형 분산 모델이 설명하지 못하는 페르미 에너지 근처의 밴드 곡률 효과를 포함하기 위해 필요함.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "반호브 특이점 근처의 동역학, 비평형 통계역학."}], "english_summary": ["Analysis of finite-frequency conductivity in 1D systems with smooth disorder.", "Identifies elastic and inelastic contributions influenced by dispersion curvature and interactions.", "Predicts the persistence of a zero-frequency delta-peak in conductance.", "Provides a theoretical framework for transport in strongly correlated 1D quantum wires."]}}, {"title": "Magnetotransport evolution and nonlinear Hall effect in altermagnetic MnTe (Frontiers of Physics,2026)", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2608.09371", "authors": "Wei Zhou, Zhifeng Xue, Yunxing Li, et al.", "last_authors": "Donghui Guo, Huichao Wang", "summary": "Hexagonal MnTe is a prototypical semiconducting altermagnet whose properties are heavily influenced by intrinsic disorder, yet how the resulting diverse transport regimes shape its magnetotransport behavior remains to be clarified alongside the role of relativistic spin-orbit coupling (SOC). Here, we present a systematic study of the anisotropic magnetoresistance (AMR), planar Hall effect (PHE), and nonlinear transport in MnTe bulk single crystals. Below the N\\'eel temperature (TN ~ 304 K), the emergence of high-order harmonics in AMR and PHE within the high-temperature metallic regime reveals the interplay of magnetic order, crystalline symmetry, and SOC. At relatively lower temperatures, the disappearance of higher-order symmetries coincides with a transport crossover into the hopping conduction regime, suggesting that carrier localization diminishes the transport sensitivity to the Fermi-surface topology. In addition, we detect distinct second-order nonlinear Hall signals, providing evidence for a macroscopic inversion-asymmetric response in altermagnetic MnTe. Extending the investigations into the localized regime provides key insights into the subtle role of disorder and SOC in macroscopic charge transport. Our work thus underscores the necessity of exploring magnetotransport across diverse conducting regimes to comprehensively understand altermagnetic properties.", "tier": "A_MUST_READ", "score": "9", "reason": "Experimental magnetotransport study of altermagnetic MnTe, a key material class in the user profile.", "tags": ["experiment", "MnTe", "altermagnetism"], "image": "https://arxiv.org/static/browse/0.3.4/images/arxiv-logo-fb.png", "briefing": {"background": "알터자성(Altermagnetism)은 시간 역전 대칭은 깨져 있지만 공간 반전 대칭과 시간 역전 대칭의 결합된 연산에 의해 비자성 금속과 유사한 밴드 구조를 갖는 새로운 자기 질서 상태입니다.", "motivation": "알터자성 물질인 MnTe에서 스핀-궤도 결합(SOC)과 무질서가 실제 자기 수송 특성에 어떤 영향을 미치는지 실험적으로 규명하고자 함.", "result": "MnTe에서 고온의 금속성 영역과 저온의 호핑 전도 영역으로의 전이를 확인했으며, 비선형 홀 효과와 이방성 자기저항에서 대칭성 변화를 관측함.", "implication": "알터자성체의 수송 특성이 전도 체제(conducting regime)에 따라 크게 달라짐을 증명하여, 향후 소자 설계 시 온도 및 도핑 조절의 중요성을 시사함.", "novelty": "MnTe에서의 제2차 비선형 홀 효과를 직접 검출하여 알터자성 특성을 시각화했다는 점이 본 연구의 가장 큰 학술적 가치임.", "unresolved": "호핑 전도 영역에서 발생하는 국소화 효과가 알터자성 고유의 베리 곡률 성분을 어떻게 마스킹하는지에 대한 정량적 분석은 미흡함.", "future_work": "고순도 결정에서의 비선형 응답 정밀 측정 및 다른 알터자성 후보 물질과의 비교 연구.", "concepts": [{"term": "알터자성 (Altermagnetism)", "why_emerged": "전통적인 강자성이나 반강자성으로 분류되지 않는, 스핀 갈라짐(spin-splitting)이 존재하는 비자성 금속 유사 상태를 설명하기 위해 제안됨.", "origin": "최근 5년 이내 이론적으로 정립됨 (예: Šmejkal et al.).", "connections": "비교차 스핀 밴드 갈라짐, 베리 곡률, 비선형 홀 효과."}, {"term": "비선형 홀 효과 (Nonlinear Hall Effect)", "why_emerged": "반전 대칭성이 깨진 계에서 외부 자기장 없이도 베리 곡률 다이폴에 의해 나타나는 2차 비선형 수송 현상을 기술하기 위해 필요함.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "토폴로지, 베리 곡률 다이폴, 알터자성."}], "english_summary": ["Systematic transport study of altermagnetic MnTe crystals.", "Observation of AMR, PHE, and nonlinear Hall effect signals.", "Identification of temperature-dependent transport crossovers from metallic to hopping regimes.", "Highlights the significant role of disorder and SOC in altermagnetic magnetotransport."]}}, {"title": "Momentum-Selective Electron and Spin Dynamics under Ultrafast Photoexcitation", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2608.08104", "authors": "Gusein Bedirkhanov, Nagamalleswararao Dasari, Alexander I. Lichtenstein, Evgeny A. Stepanov", "last_authors": "Alexander I. Lichtenstein, Evgeny A. Stepanov", "summary": "Recent advances in time-resolved spectroscopies have enabled direct access to the momentum-selective nonequilibrium dynamics of correlated quantum materials, revealing a strongly momentum-dependent response of electrons and collective excitations. Interpreting these observations requires a real-time theoretical framework that consistently captures the interplay between strong local electronic correlations and nonlocal collective fluctuations, a capability that remains beyond state-of-the-art nonequilibrium approaches. Using a recently developed real-time many-body framework, we resolve the momentum-selective ultrafast dynamics of a photoexcited correlated electron system. We predict a transient nodal-antinodal anisotropy in electronic heating, providing a microscopic explanation for the momentum-dependent response debated in time-resolved photoemission and Raman experiments, and identify the nonthermal spectral-weight transfer responsible for the transient antinodal in-gap states observed in ultrafast photoemission. We further uncover a momentum-selective magnetic response, in which antiferromagnetic fluctuations undergo a strongly nonthermal, quench-like excitation far above the electronic temperature while preserving their correlation length, before relaxing through a momentum-space magnon cascade toward lower-momentum modes. Finally, by tracking the real-time local spin susceptibility, we identify a dynamical, experimentally accessible signature of local-moment formation and its photoinduced melting. Our results establish a unified microscopic picture of ultrafast electronic and magnetic dynamics, providing a framework for interpreting momentum-resolved pump-probe experiments.", "tier": "A_MUST_READ", "score": "9", "reason": "Theoretical framework for momentum mary": "Controlling material excitations offers access to novel fundamental and technological properties. The paradigm of Floquet engineering, the manipulation of the electronic structure using a coherent and time-periodic driving source, has attracted significant attention. While most realizations rely on strong optical fields, coherent phonons provide an alternative route to realizing Floquet-Bloch states and are expected to enable substantially longer-lived Floquet-Bloch states. We show that laser-excited coherent phonons drive Floquet-Bloch states. Using time-resolved multiphoton photoemission combined with quantum beat spectroscopy on graphene-covered Ir(111), we track the coherent electronic dynamics of the image-potential states dressed by coherent phonons. The beat signal indicates the presence of sideband structure with the coherent-phonon frequency as its fundamental period, consistent with Floquet theory. Furthermore, an independent oscillation in intensity at the same frequency was observed, confirming excitation of the coherent phonon mode. Compared with conventional light-driven Floquet-Bloch states, the observed phonon-driven Floquet-Bloch states persist for one to two orders of magnitude longer. These results establish coherent phonons as a material-driven route to Floquet engineering and demonstrate the long-lived dressing of electronic states beyond the optical excitation window.", "tier": "A_MUST_READ", "score": "9", "reason": "Experimental photoemission evidence of long-lived phonon-driven Floquet states in graphene.", "tags": ["experimental", "graphene", "photoemission"], "image": "https://arxiv.org/html/2606.30065v3/x1.png", "briefing": {"background": "물질 내 전자를 제어하여 새로운 물성을 유도하는 플로케 공학(Floquet engineering)은 주로 강한 광학적 레이저장을 이용해 왔습니다. 하지만 광원은 발열 문제와 짧은 수명이라는 한계를 지니고 있어 이를 극복할 새로운 구동 방식이 필요합니다.", "motivation": "빛 대신 물질 내부의 결맞은 포논(coherent phonons)을 이용하여 전자를 제어할 경우, 플로케 상태의 수명을 더 길게 유지할 수 있을 것이라는 가설을 실험적으로 검증하고자 했습니다.", "result": "그래핀/Ir(111) 시스템에서 레이저로 여기된 포논이 전자 상태를 드레스(dressing)하여 플로케-블로흐 상태를 형성함을 관측했습니다. 특히 광학적 방식보다 수명이 1~2배 정도 길게 지속됨을 증명했습니다.", "implication": "포논을 이용한 플로케 공학이 가능함을 보여주었으며, 이는 외부 광원 없이도 물질 고유의 진동을 활용하여 전자 구조를 변조할 수 있는 새로운 플랫폼을 제시합니다.", "novelty": "기존 플로케 연구들이 주로 레이저 파라미터에 의존했다면, 본 연구는 '물질 자체의 포논'을 능동적 제어 수단으로 사용하여 수명 문제를 해결했다는 점이 독보적입니다.", "unresolved": "이러한 포논 유도 플로케 상태가 더 복잡한 위상 물질이나 강상관 전자계에서 얼마나 안정적으로 유지될지에 대해서는 추가적인 데이터가 필요합니다.", "future_work": "다양한 2차원 물질 및 위상 절연체로 연구 범위를 확장하여 포논 기반의 밴드 구조 튜닝을 실제 소자 응용으로 연결하려는 노력이 이어질 것입니다.", "concepts": [{"term": "Floquet-Bloch states", "why_emerged": "시간 주기적 외장이 가해질 때 고체 내부 전자가 에너지를 재분배하여 갖는 새로운 밴드 구조를 기술하기 위해 필요합니다.", "origin": "Floquet 이론은 1883년 Gaston Floquet이 제안했으며, 고체 물리학 분야에서는 2010년대 이후 본격적으로 응용되기 시작했습니다.", "connections": "고조파 생성, 플로케 위상 절연체, 타임-리졸브 ARPES와 깊은 관련이 있습니다."}, {"term": "Coherent phonons", "why_emerged": "펨토초 레이저 펄스에 의해 원자들이 결맞게 진동하는 현상을 이해하고 제어하기 위해 등장했습니다.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "초고속 분광학, 밴드 구조 변조, 라만 산란."}], "english_summary": ["Demonstrated phonon-driven Floquet-Bloch states in graphene on Ir(111).", "Used time-resolved multiphoton photoemission to track phonon-dressed electronic states.", "Phonon-driven states exhibit significantly longer lifetimes than optical Floquet states.", "Establishes a new material-driven route for Floquet engineering in solid-state systems."]}}, {"title": "Robust spin pseudogap and spin-charge separation in the t-J model", "journal": "arXiv_CondMat", "source": "keyword", "link": "https://arxiv.org/abs/2608.09689", "authors": "Zheng-Yuan Yue, Jia-Xin Zhang, Zheng-Cheng Gu", "last_authors": "Jia-Xin Zhang, Zheng-Cheng Gu", "summary": "The $\\sigma t$-$J$ model, obtained from the usual $t$-$J$ model by flipping the sign of the spin-down hopping term, has been proposed to eliminate the strong interference between doped holes and the spin background, known as the phase string effect. In this work, we investigate the finite-temperature properties of the $\\sigma t$-$J$ model using infinite projected entangled-pair state (iPEPS) algorithms, in comparison with the $t$-$J$ model and its easy-plane variants. We show that these models share similar spin-pseudogap thermodynamics, with a maximum in the spin susceptibility at $T^* \\sim J$ and a broad specific-heat peak. Tensor network renormalization (TNR) further provides strong evidences for a Berezinskii-Kosterlitz-Thouless (BKT) transition in the spin sector of the $\\sigma t$-$J$ model at a lower temperature $T_\\text{BKT} < T^*$ due to its reduced $\\mathrm{U}(1)$ spin-rotation symmetry. Crucially, in contrast to the $t$-$J$ model and to its easy-plane variants that also exhibit BKT transitions, these signatures remain robust upon doping: the doped holes preserve and even enhance the antiferromagnetic correlations in the $xy$ spin plane, leading to a weak doping dependence of both $T^*$ and $T_\\text{BKT}$. Finally, we develop a slave-fermion mean-field theory for the $\\sigma t$-$J$ model, whose projective symmetry group (PSG) is selected based on numerically determined hopping and pairing correlations, and show that it explains the robust spin pseudogap upon doping.", "tier": "A_MUST_READ", "score": "9", "reason": "title strong match: spin-charge separation", "tags": ["spin-chargeseparation", "ferromagnet", "antiferromagnet"], "image": "https://arxiv.org/static/browse/0.3.4/images/arxiv-logo-fb.png", "briefing": {"background": "강상관 전자계에서 '스핀-전하 분리(Spin-charge separation)'는 전자가 스핀과 전하라는 자유도로 나누어 독립적으로 거동하는 현상으로, 고온 초전도체와 같은 강상관 물질의 비페르미 액체 성질을 이해하는 핵심 열쇠입니다.", "motivation": "기존 t-J 모델에서의 위상 문자열(phase string) 효과가 스핀과 전하의 복잡한 간섭을 유발하여 물리적 해석을 어렵게 하므로, 이를 제거한 σt-J 모델을 통해 순수한 스핀-전하 분리 거동을 탐구하고자 했습니다.", "result": "σt-J 모델이 도핑 후에도 견고한 스핀 슈도갭(spin pseudogap)과 BKT 전이 특성을 유지함을 수치적(iPEPS, TNR)으로 증명했습니다.", "implication": "전하가 도핑되어도 반강자성 상관관계가 스핀 면에서 유지되며, 스핀-전하 분리가 모델 내부에서 매우 견고하게 존재함을 시사합니다.", "novelty": "기존 t-J 모델의 난제였던 위상 문자열 효과를 수학적으로 제거하여 강상관 현상을 보다 명확하게 분리하여 해석할 수 있는 방법론적 진보를 이뤘습니다.", "unresolved": "이 모델이 실제 층상 화합물에서의 전자 구조와 정확히 어느 정도까지 정량적으로 일치하는지에 대한 실험적 검증이 부족합니다.", "future_work": "다양한 2D 격자 구조에 본 모델을 적용하여 전이 온도 T_BKT와 도핑 수준 사이의 상관관계를 체계적으로 분석할 예정입니다.", "concepts": [{"term": "Spin-charge separation", "why_emerged": "1차원 계에서 전자가 스핀과 전하 자유도로 분리되어 움직이는 현상이 발견되면서, 이를 다차원으로 확장하여 강상관계를 설명하고자 제안되었습니다.", "origin": "1980년대 P.W. Anderson 등이 제안한 공명 원자가 결합 상태(RVB) 이론에서 기원합니다.", "connections": "Luttinger 액체 이론, 1D 스핀 사다리 구조, 고온 초전도체."}, {"term": "Berezinskii-Kosterlitz-Thouless (BKT) transition", "why_emerged": "2차원 계에서 앤더슨의 정리에 따라 자발적 대칭성 깨짐이 금지됨에도 불구하고, 위상 결함(vortex)에 의해 상전이가 발생하는 현상을 설명하기 위해 도입되었습니다.", "origin": "1970년대 Vadim Berezinskii와 J. Michael Kosterlitz, David Thouless에 의해 정립되었습니다.", "connections": "초유체, 2차원 자기 물질, XY 모델."}], "english_summary": ["Investigated the σt-J model to study spin-charge separation without phase string effects.", "Used iPEPS and TNR algorithms to show robust spin pseudogap and BKT transitions.", "Doped holes preserve antiferromagnetic correlations in the xy spin plane.", "Slave-fermion mean-field theory explains the doping-resilient spin pseudogap."]}}, {"title": "Superconductivity, pseudogap and marginal Fermi liquid in a relative-momentum-local theory", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2608.09785", "authors": "Jian-Jian Miao", "last_authors": "Jian-Jian Miao", "summary": "Cuprate superconductors host \\(d\\)-wave superconductivity (SC), a pseudogap (PG) with Fermi arcs and a strange metal (SM) with incoherent excitations and temperature-linear resistivity. These regimes emerge from the same doped Mott system but are usually described separately. Here a relative-momentum-local (RML) theory is constructed, with the exact spin-singlet Cooper representation of antiferromagnetic superexchange in the \\(t\\)-\\(J\\) model serving as a common thread. Pair correlations organize the low-energy behaviour of this Cooper channel into phase-coherent static SC, phase-incoherent quasi-static PG and phase-incoherent dynamic SM. A static RML prescription yields an exactly solvable PG Hamiltonian with nodal electron poles, antinodal gaps, resolution-broadened Fermi arcs and gapless charge-\\(2e\\) Cooper surfaces. A Cooper-surface Lifshitz transition generates logarithmic enhancements in the specific-heat coefficient and charge response without a spin singularity. The particle-particle continuum at finite centre-of-mass momentum produces Ohmic damping, while a dynamic RML prescription yields a one-loop self-energy with marginal-Fermi-liquid scaling. Spectral-weight transfer in the physical pair spectrum diagnoses the PG--SM crossover, whereas nonzero phase stiffness and global phase coherence identify SC. The RML theory relates single-particle, pair-sensitive and thermodynamic probes to three infrared organizations of one Cooper channel. A decisive experimental signature would be zero-energy Cooper-surface ridges in two-electron angle-resolved photoemission spectroscopy (2e-ARPES).", "tier": "A_MUST_READ", "score": "9", "reason": "Cuprate theory predicting zero-energy Cooper-surface ridges observable via two-electron ARPES.", "tags": ["theory", "cuprates", "ARPES"], "image": "https://arxiv.org/html/2608.09785v1/figures/figure-1.png", "briefing": {"background": "구리 산화물 초전도체(cuprates)는 슈도갭, 스트레인지 메탈, d-파 초전도 등 서로 다른 물성들이 공존하며, 이를 통합적으로 설명할 수 있는 이론적 틀이 오랫동안 부재했습니다.", "motivation": "t-J 모델의 스핀-싱글렛 쿠퍼 표현을 중심으로, 다양한 물성을 단일한 '쿠퍼 채널(Cooper channel)'의 서로 다른 위상적 상태로 통합 설명하기 위해 RML 이론을 구축했습니다.", "result": "RML 이론을 통해 전자 구조의 앤티노달 갭(antinodal gap), 페르미 아크, 그리고 제로 에너지 쿠퍼 표면(Cooper surface) Ridge 구조를 예측했습니다.", "implication": "이 모델이 옳다면, 기존의 복잡한 강상관 현상을 단일 쿠퍼 채널의 위상적 결맞음 상태 변화로 단순화하여 해석할 수 있습니다.", "novelty": "단순한 계산을 넘어 '2e-ARPES'라는 구체적인 실험 검증법을 제시하여, 이론이 실제 ARPES 측정 데이터를 통해 검증될 수 있는 길을 열었습니다.", "unresolved": "2e-ARPES는 실험적으로 매우 고난도의 기술이며, 이 예측된 리지(ridge) 구조를 실제 샘플에서 명확히 구분해낼 수 있을지는 불확실합니다.", "future_work": "차세대 2e-ARPES 실험 장비를 활용하여 초전도 상태와 슈도갭 상태에서의 쿠퍼 표면 구조를 직접 관측하는 연구가 요구됩니다.", "concepts": [{"term": "Cooper surface", "why_emerged": "초전도체 내에서 페르미 면과 유사하게 쿠퍼 쌍들이 가질 수 있는 에너지적으로 허용된 운동량 공간상의 표면을 정의하기 위해 도입되었습니다.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "초전도체 밴드 이론, 2e-ARPES 측정, 페르미 액체론."}, {"term": "Marginal Fermi liquid", "why_emerged": "구리 산화물의 저온 저항이 온도에 선형적으로 비례하는(strange metal) 현상을 설명하기 위해 기존 페르미 액체론의 수정을 위해 제안되었습니다.", "origin": "1989년 Varma 등에 의해 제안되었습니다.", "connections": "cuprates, 비페르미 액체, 비저항의 온도 의존성."}], "english_summary": ["Proposed a relative-momentum-local (RML) theory for cuprate superconductors.", "Unifies superconductivity, pseudogap, and strange metal phases within one Cooper channel.", "Predicts the existence of zero-energy Cooper-surface ridges.", "Suggests 2e-ARPES as a decisive experimental test for the RML theory."]}}, {"title": "Robust field-free superconducting diode effect in FeTe0.55Se0.45", "journal": "npj_QuantumMaterials", "source": "author whitelist", "link": "https://www.nature.com/articles/s41535-026-00930-3", "authors": "Peng Dong, Jinghui Wang, Yanjiang Wang, et al.", "last_authors": "Jinsheng Wen, Jun Li", "summary": "Robust field-free superconducting diode effect in FeTe 0.55 Se 0.45", "tier": "A_MUST_READ", "score": "9", "reason": "author whitelist: Yulin Chen", "tags": ["superconduct"], "image": "https://pubads.g.doubleclick.net/gampad/ad?iu=/285/npjquantmats.nature.com/article&sz=728x90&c=-1252816207&t=pos%3Dtop%26type%3Darticle%26artid%3Ds41535-026-00930-3%26doi%3D10.1038/s41535-026-00930-3%26subjmeta%3D301,639,766%26kwrd%3DMaterials+science,Physics", "briefing": {"background": "초전도 다이오드 효과(Superconducting Diode Effect)는 특정 방향으로의 초전도 전류(supercurrent)와 반대 방향의 전류 흐름에 대한 임계 전류값(Ic)이 비대칭적인 현상을 말합니다.", "motivation": "일반적으로 이 효과는 외부 자기장이나 자성 층을 통해 시간 반전 대칭성을 깨뜨려야 나타나는데, FeTe0.55Se0.45에서 자성 없이(field-free) 이 현상이 나타나는 메커니즘을 규명하고자 합니다.", "result": "FeTe0.55Se0.45에서 외부 자기장 없이 강력한 초전도 다이오드 효과가 관측됨을 확인하였습니다.", "implication": "에너지 소모가 적은 차세대 초전도 전자 소자 설계에 있어, 외부 자기장 장치 없이도 정류 작용이 가능한 물질적 기반을 제공합니다.", "novelty": "철 기반 초전도체(Iron-based superconductor)인 FeTeSe 시스템에서 구현된 사례로, 독특한 대칭성 파괴 메커니즘이 존재함을 시사합니다.", "unresolved": "이러한 현상을 유발하는 구체적인 대칭성 파괴의 기원(예: 자발적 정렬 혹은 결정 구조적 비대칭성)에 대한 미시적 분석이 추가로 필요합니다.", "future_work": "ARPES를 통해 대칭성 파괴를 유발하는 전자 구조적 변화를 직접 관찰하거나, 수송 현상과의 상관관계를 정밀 분석하는 후속 연구가 예상됩니다.", "concepts": [{"term": "Superconducting Diode Effect", "why_emerged": "비반전 중심성(non-centrosymmetric) 또는 자기적 정렬에 의한 전류 비대칭 제어 필요성.", "origin": "최근 수년간 초전도 스핀트로닉스 분야에서 활발히 연구됨.", "connections": "Josephson 접합, 비반전 중심 초전도체, Rashba 상호작용."}], "english_summary": ["Report of a field-free superconducting diode effect in FeTe0.55Se0.45.", "The discovery challenges the conventional need for external magnetic fields for rectifying supercurrents.", "This finding paves the way for energy-efficient superconducting electronic components."]}}, {"title": "Goniopolar kagome materials boost transverse thermoelectricity", "journal": "Nature_Materials", "source": "Gemini", "link": "https://www.nature.com/articles/s41563-026-02706-3", "authors": "Authors not available in source RSS", "last_authors": "", "summary": "Thermoelectricity enables interconversion between heat and charge currents, but existing material platforms rely on constrained longitudinal geometries, complex fabrication or an external magnetic field to achieve high performance. Now, goniopolar kagome materials enable strong transversal thermoelectricity without an applied magnetic field, owing to flat electronic bands or van Hove singularities.", "tier": "B_IMPORTANT_CONDMAT", "score": "10", "reason": "Direct relevance to kagome materials, electronic structure, and van Hove singularities.; demoted from A: broad CM, not direct user/project hit", "tags": ["kagome", "thermoelectricity", "electronicstructure"], "image": "https://media.springernature.com/m685/springer-static/image/art%3A10.1038%2Fs41563-026-02706-3/MediaObjects/41563_2026_2706_Fig1_HTML.png", "briefing": {"background": "열전 소자는 열에너지를 전기에너지로 변환하는 기술로, 효율을 높이기 위해 전하 운반자의 에너지 선택성을 최적화하는 것이 중요합니다.", "motivation": "기존 열전 물질의 기하학적 제약과 자기장 의존성을 극복하기 위해, 독특한 밴드 구조를 가진 카고메(kagome) 격자 물질의 잠재력을 탐구하고자 합니다.", "result": "카고메 물질의 평탄한 밴드(flat bands)와 반 호브 특이점(van Hove singularities)이 외부 자기장 없이도 강력한 횡방향 열전 현상을 유도함을 발견했습니다.", "implication": "자기장 없이 고효율 열전 소자를 구현할 수 있는 새로운 재료 설계 원리를 제시합니다.", "novelty": "밴드 구조의 토폴로지와 반 호브 특이점을 이용해 열전 효율을 극대화했다는 점에서 카고메 금속 물리학과 응용 분야의 중요한 연결 고리를 형성합니다.", "unresolved": "물질별 최적의 화학적 도핑이나 구조적 왜곡이 열전 효율에 미치는 미시적 최적화 조건이 명확하지 않습니다.", "future_work": "다양한 AV3Sb5 계열 물질에서 횡방향 열전 특성과 전자 구조 간의 정량적 상관관계를 도출하기 위한 추가적인 ARPES 실험이 기대됩니다.", "concepts": [{"term": "Goniopolar", "why_emerged": "밴드 구조에 따라 운반자의 성질(전자/정공)이 방향에 따라 달라지는 독특한 수송 특성을 설명하기 위해.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "반 호브 특이점, Berry 곡률, 카고메 격자 전자 구조."}, {"term": "Van Hove Singularity", "why_emerged": "상태 밀도(DOS)가 발산하는 지점에서 상전이나 물성 변화가 급격히 일어나는 현상을 이해하기 위해.", "origin": "Léon Van Hove (1953).", "connections": "CDW, 초전도성, 페르미 면 토폴로지."}], "english_summary": ["Discovery of goniopolar behavior in kagome materials enabling transverse thermoelectricity.", "The effect is driven by flat bands and van Hove singularities without the need for magnetic fields.", "This provides a new material platform for high-performance, magnetic-field-free thermoelectric applications."]}}, {"title": "Probing crystal-field modulations with magnetic adatoms on the incipient charge-density-wave superconductor 2H-NbS2", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2608.09753", "authors": "Werner M. J. van Weerdenburg, Margarete Huisinga, Constantin Flommersfeld, Lisa M. R\\\"utten, Katharina J. Franke", "last_authors": "Lisa M. R\\\"utten, Katharina J. Franke", "summary": "The interplay between multiple quantum phases in layered materials may lead to incipient quantum behavior, where the material's ground state is close to a phase transition and sensitive to local disorder. The transition metal dichalcogenide material $2H$-NbS$_2$ exhibits incipient charge-density-wave behavior along with a well-developed superconducting state, creating a scenario where the local lattice instabilities play a crucial role. Here we present how an individual magnetic atom on $2H$-NbS$_2$ can be applied as a local sensor to reveal hidden crystal-field modulations. By manipulating the adatom across the surface with the tip of a scanning tunneling microscope, we measure variations in the Yu-Shiba-Rusinov (YSR) excitation spectra and map the local environment around an intrinsic point defect. We find that while the superconducting state is spatially uniform, the YSR excitation energy strongly depends on the position of the atom. We determine that the main contribution to this effect originates from variations in the local crystal-field environment. These results establish a new approach to investigate crystal-field modulations at the atomic scale and reveal how defects and lattice instabilities shape the atomic landscape of an incipient charge-density-wave material.", "tier": "B_IMPORTANT_CONDMAT", "score": "10", "reason": "STM study of YSR states on NbS2, linking crystal-field modulations to incipient CDW behavior.; demoted from A: broad CM, not direct user/project hit", "tags": ["experiment", "STM", "NbS2"], "image": "https://arxiv.org/html/2608.09753v1/x1.png", "briefing": {"background": "2H-NbS2는 초전도성과 전하 밀도 파(CDW)가 공존하는 층상 물질로, 이들의 복잡한 상호작용은 원자 수준의 국소 환경에 민감하게 반응합니다.", "motivation": "자성 불순물을 탐침으로 사용하여 2H-NbS2 표면의 숨겨진 결정장(crystal-field) 변조를 원자 단위에서 정밀하게 측정하고자 합니다.", "result": "주사 터널링 현미경(STM)을 이용해 자성 아다톰(adatoms) 위치에 따른 YSR 상태 에너지 변화를 관측하여, 결정장 변조가 원자 단위에서 존재함을 규명했습니다.", "implication": "불순물 상태가 물질 내부의 격자 불안정성과 숨겨진 물리적 상호작용을 비파괴적으로 진단하는 감지기 역할을 할 수 있음을 보여줍니다.", "novelty": "단순한 STM 관찰을 넘어 자성 아다톰을 이동시키며 미시적 공간에서 결정장의 국소 변화를 매핑한 점이 매우 창의적입니다.", "unresolved": "관측된 결정장 변조와 근본적인 CDW 형성 원리 사이의 인과관계는 추가적인 이론 모델링이 필요합니다.", "future_work": "다른 전이금속 디칼코게나이드(TMD) 시스템으로의 확장 연구 및 특정 CDW 단계에서의 YSR 상태 섭동 관찰.", "concepts": [{"term": "Yu-Shiba-Rusinov (YSR) state", litting in hole-doped RuO 2 .", "tier": "B_IMPORTANT_CONDMAT", "score": "9", "reason": "Quantum oscillation interpretation of altermagnetism in RuO2, very relevant to profile.", "tags": ["altermagnet", "transport", "quantumoscillations"], "image": "", "briefing": {"background": "Altermagnetism은 강자성(ferromagnetism)의 비상반성(non-reciprocity)과 반강자성(antiferromagnetism)의 상쇄된 자기 모멘트가 공존하는 새로운 자기 상입니다. 이는 스핀-궤도 결합 없이도 스핀 분할(spin splitting)을 유도하여 차세대 스핀트로닉스 재료로 주목받고 있습니다.", "motivation": "RuO2와 같은 altermagnet 후보 물질에서 자성 상태를 명확히 판별하고, 스핀 분할의 정도를 실험적으로 정량화할 수 있는 지표를 찾고자 합니다.", "result": "홀 도핑된 RuO2의 Fermi surface pocket을 모델링하여, Ru 원자의 국소 자기 모멘트와 양자 진동(quantum oscillation) 데이터 간의 선형 상관관계를 확립했습니다.", "implication": "이 선형 상관관계를 통해 양자 진동 측정만으로 RuO2의 altermagnetic 스핀 분할 상태를 실시간으로 추적하고 검증할 수 있는 표준 프로토콜을 제시합니다.", "novelty": "기존의 복잡한 자기 구조 분석 대신, 전송 측정(transport)과 결합된 양자 진동이라는 접근하기 쉬운 도구를 통해 altermagnetism의 존재를 증명했다는 점에서 매우 실용적입니다.", "unresolved": "이 상관관계가 다른 도핑 농도나 결함이 존재하는 실제 시료에서도 동일하게 유지되는지에 대한 추가적인 실험적 검증이 필요합니다.", "future_work": "실제 고품질 홀 도핑된 RuO2 시료를 이용한 정밀 양자 진동 측정과 온도 변화에 따른 altermagnetic 전이 관찰이 예상됩니다.", "concepts": [{"term": "Altermagnetism", "why_emerged": "강자성과 반강자성의 장점을 모두 가지며 스핀-궤도 결합 없이 큰 스핀 분할을 얻기 위해.", "origin": "최근 2020년대 초반 이론적으로 체계화됨.", "connections": "반강자성체, 스핀-궤도 토크(SOT), 스핀트로닉스."}, {"term": "Quantum oscillation", "why_emerged": "Fermi surface의 크기와 모양, 유효 질량 등을 실험적으로 결정하기 위해.", "origin": "De Haas-van Alphen 효과(1930년대).", "connections": "Fermi surface 매핑, ARPES와의 비교."}], "english_summary": ["Establishes a quasilinear correlation between local magnetic moments and quantum oscillation patterns in hole-doped RuO2.", "Provides a practical experimental fingerprint to track and identify altermagnetic spin splitting.", "Offers a transport-based characterization method for altermagnetic regimes in rutile oxides."]}}, {"title": "X-ray imaging of antiferromagnetic cluster octupole domains in Mn3Sn", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/fq34-r263", "authors": "M. T. Birch, S. Wintz, Y. Sun, et al.", "last_authors": "T. Arima, Y. Tokura", "summary": "Here, the authors use element-specific x-ray microscopy to image antiferromagnetic cluster octupole domain structures in focused ion-beam fabricated Mn 3 Sn devices. The magnetic contrast arises from pre-edge x-ray magnetic circular dichroism that is independent of the small net moment, revealing how mesoscale textures evolve under applied magnetic fields and link to the anomalous Hall response. The results establish x-ray microscopy as a powerful route to image domain structures in time-reversal symmetry breaking antiferromagnets.", "tier": "B_IMPORTANT_CONDMAT", "score": "9", "reason": "X-ray imaging of Mn3Sn magnetic textures; highly relevant for topological magnetism.", "tags": ["x-ray", "antiferromagnet", "topology"], "image": "", "briefing": {"background": "Mn3Sn은 비자명한 자기적 위상 구조를 가진 반강자성체로, 큰 비정상 홀 효과(AHE)를 보여줍니다. 이러한 특성은 자성 도메인 구조와 밀접하게 연관되어 있어 이를 시각화하는 기술이 핵심적입니다.", "motivation": "Mn3Sn의 복잡한 자성 도메인과 비정상 홀 효과 사이의 미시적 연결 고리를 직접적인 이미징을 통해 규명하고자 했습니다.", "result": "X선 자기 원형 이색성(XMCD) 현미경을 사용하여 Mn3Sn 내부의 옥타폴(octupole) 자성 도메인을 가시화했으며, 이 구조가 외부 자기장에 따라 어떻게 변하는지 밝혀냈습니다.", "implication": "반강자성체의 메조스케일 자기 텍스처를 직접 관찰함으로써, 비정상 홀 효과와 같은 거시적 양자 수송 현상의 미시적 근원을 명확히 설명할 수 있게 되었습니다.", "novelty": "순수 자기 모멘트가 거의 없는 반강자성체에서 전하 중성점 등을 이용한 미세 자성 구조 이미징에 성공했다는 점에서 topological magnetism 연구의 돌파구가 됩니다.", "unresolved": "외부 자기장에 의한 도메인 벽의 이동 및 재배열 과정에서의 비가역적 특성에 대한 정밀한 물리 기전은 추가 연구가 필요합니다.", "future_work": "다양한 전류 구동 조건 하에서의 도메인 역학 관찰 및 소자 규모에서의 스위칭 연구가 진행될 것입니다.", "concepts": [{"term": "Octupole domains", "why_emerged": "반강자성에서 스핀 모멘트가 상쇄되어도 나타나는 고차 다중극자 자기 질서를 설명하기 위해.", "origin": "Mn3Sn의 비정상 홀 효과 연구와 함께 최근 주목받음.", "connections": "비정상 홀 효과, 위상 자성(Topological Magnetism)."}, {"term": "XMCD (X-ray Magnetic Circular Dichroism)", "why_emerged": "원소 선택적이고 자성 상태에 민감한 정밀 구조 분석을 위해.", "origin": "1980년대 후반 Schütz et al.", "connections": "자기 텍스처 이미징, 싱크로트론 방사광 분석."}], "english_summary": ["Reports element-specific X-ray microscopy of octupole magnetic domains in Mn3Sn.", "Links mesoscale magnetic textures to the macroscopic anomalous Hall response.", "Demonstrates a novel imaging route for time-reversal symmetry breaking antiferromagnets."]}}, {"title": "Chiral Charge Density Waves in Transition Metal Dichalcogenide", "journal": "PRL_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/5vkg-zvhv", "authors": "Ettore Carpene", "last_authors": "Ettore Carpene", "summary": "The emergence of chirality in the charge density wave (CDW) phase of 1 T − TiSe 2 has recently attracted significant attention, yet its microscopic origin remains debated. The prevailing interpretation attributes chirality to a relative phase shift between the charge density components. Here, using density functional theory and symmetry analysis, it is demonstrated that such phase-shifted states entail prohibitive energy costs, rendering them unlikely candidates for the ground state. Instead, a nearly degenerate metastable CDW phase stacking order with monoclinic symmetry is identified that naturally breaks mirror and inversion symmetries. The CDW in 1 T − TiSe 2 possesses a dual physical nature: The electronic charge redistribution is intrinsically bond modulated, while the periodic lattice distortion is atom-centered transverse. This spatial separation allows a specific optical coupling mechanism where circularly polarized light breaks the energetic degeneracy between chiral domains. These results reconcile conflicting experimental observations, identifying the “spontaneous” chirality observed in local probes as a statistical distribution of CDW phase stacking domains while establishing the mechanism for macroscopic, light-induced gyrotropic order.", "tier": "B_IMPORTANT_CONDMAT", "score": "9", "reason": "Direct relevance to CDW, chirality, and a known TMD material.", "tags": ["CDW", "chiral", "TMD", "electronicorder"], "image": "", "briefing": {"background": "1T-TiSe2는 CDW 상전이를 보이는 대표적인 TMD 물질입니다. 최근 이 CDW 상에서의 카이랄성(chirality) 발현이 관찰되었으나, 그 미시적 기원에 대해서는 논란이 많았습니다.", "motivation": "기존에 제안된 '상-이동(phase-shift)' 모델이 에너지적으로 불안정하다는 점을 지적하고, 보다 타당한 CDW 스태킹 구조를 제시하고자 합니다.", "result": "단사정계 대칭성을 가지며 에너지적으로 유리한 'CDW 상 스태킹' 구조를 제시했습니다. 이는 전자 전하 재분배와 격자 왜곡이 공간적으로 분리되어 일어남을 증명합니다.", "implication": "그동안 서로 모순되던 실험 결과들이 단순한 단일 상이 아니라, 다양한 스태킹 도메인들의 통계적 분포로 인해 나타난 현상임을 설명할 수 있게 되었습니다.", "novelty": "단순한 계산을 넘어, 광학적 방법(원편광)을 통해 어떻게 카이랄 도메인을 제어할 수 있는지 구체적인 메커니즘을 제시하여 광 제어 스핀트로닉스 분야에 중요한 통찰을 줍니다.", "unresolved": "이러한 도메인 분포가 시료 성장 방법이나 기판 효과에 따라 어떻게 구체적으로 제어될 수 있는지에 대한 추가 최적화 연구가 필요합니다.", "future_work": "광학적으로 유도된 카이랄 도메인의 초고속 이미징 및 시간 분해 분광학적 관찰이 기대됩니다.", "concepts": [{"term": "Charge Density Wave (CDW)", "why_emerged": "1차원 혹은 저차원 계에서 전자와 격자가 결합하여 주기적인 정렬을 이루는 바닥 상태를 설명하기 위해.", "origin": "Peierls instability (1955년).", "connections": "TMDs, 엑시톤 절연체, 초전도성과의 경쟁."}, {"term": "Chirality", "why_emerged": "거울상 대칭성이 깨진 물질의 위상적 성질과 물리적 특성을 이해하기 위해.", "origin": "수학/화학에서 유래, 고체 물리학에서는 최근 위상 물질에서 활발히 논의.", "connections": "Gyrotropy, 원편광 발광/흡수, 위상 수송."}], "english_summary": ["Identifies a monoclinic CDW stacking order in 1T-TiSe2 that explains observed chirality.", "Proposes that macroscopic chirality arises from the statistical distribution of metastable stacking domains.", "Provides a mechanism for light-induced control of gyrotropic order in TMDs."]}}, {"title": "Coexistence and Tunability of Orbital and Spin Hall Effects in RuO2", "journal": "PRL_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/lf8d-26b6", "authors": "Lishu Zhang, Mahmoud Zeer, Dongwook Go, et al.", "last_authors": "Hyunsoo Yang, Lei Shen (沈雷)", "summary": "Altermagnetic materials, especially ${\\mathrm{RuO}}_{2}$, have recently attracted considerable attention for their unique magnetic properties and energy-efficient spintronic applications. However, recent experimental studies have reported highly conflicting signatures regarding altermagnetic spin sp…", "tier": "B_IMPORTANT_CONDMAT", "score": "9", "reason": "Direct relevance to altermagnetism and Hall effects in a specific material, RuO2.", "tags": ["altermagnetism", "Halleffect", "spintronics", "RuO2"], "image": "", "briefing": {"background": "RuO2는 최근 알터마그네틱(altermagnetic) 물질로 주목받으며, 스핀 편극 전류 생성의 효율성으로 인해 차세대 스핀트로닉스 소자 후보로 각광받고 있습니다.", "motivation": "RuO2의 알터마그네틱 성질에 대한 실험적 증거가 상충하는 상황에서, 궤도 홀 효과(OHE)와 스핀 홀 효과(SHE)의 공존 가능성과 그 튜닝 가능성을 규명하고자 합니다.", "result": "RuO2에서 궤도 홀 효과와 스핀 홀 효과가 공존함을 확인하였으며, 이들 효과를 외부 인자로 조절할 수 있음을 보였습니다.", "implication": "알터마그네틱 물질에서의 자기적 특성이 단순히 스핀뿐만 아니라 궤도 자유도와 밀접하게 연관되어 있음을 시사하며, 이는 향후 스핀-궤도 기반 소자 설계의 중요한 이정표가 될 것입니다.", "novelty": "RuO2의 알터마그네틱 특성을 궤도 및 스핀 홀 효과의 관점에서 통합적으로 분석하여, 논란이 있는 자기적 서명을 체계적으로 설명했습니다.", "unresolved": "실험적 결과들 사이의 상충되는 데이터에 대한 완벽한 합의점은 여전히 연구가 필요하며, 특정 조건에서의 비균질성 문제가 남아있을 수 있습니다.", "future_work": "다른 알터마그네틱 후보 물질들에 대한 유사한 궤도-스핀 분리 측정 및 소자 응용을 위한 전기적 제어 최적화 연구가 이어질 것입니다.", "concepts": [{"term": "Altermagnetism", "why_emerged": "기존의 강자성(ferro)이나 반강자성(antiferro)으로 분류되지 않는, 스핀-궤도 결합에 의해 비자성 결정 구조에서도 스핀 편극이 나타나는 새로운 자기 질서입니다.", "origin": "최근 2020년대 초반 J. Zelezny 등에 의해 이론적으로 체계화되었습니다.", "connections": "반강자성 스핀트로닉스 및 비자성 금속의 밴드 구조 내 스핀 분할 현상과 직접적으로 연결됩니다."}, {"term": "Spin Hall Effect", "why_emerged": "전류를 흘렸을 때 시료 양단에 스핀의 흐름(spin current)이 발생하는 현상을 이용해 외부 자기장 없이 스핀을 조작하기 위해 필요합니다.", "origin": "1971년 Dyakonov와 Perel에 의해 예측되었습니다.", "connections": "Rashba 효과, 위상 절연체 및 스핀-궤도 토크(SOT) 소자와 깊게 연결되어 있습니다."}], "english_summary": ["Investigated the coexistence of Orbital and Spin Hall effects in the altermagnetic candidate RuO2.", "Demonstrated that both effects are present and can be tuned.", "Provides experimental insight into the controversial magnetic signatures of RuO2.", "Advances the understanding of orbital-spin physics in altermagnetic materials for spintronics."]}}, {"title": "Strongly Enhanced Charge-Density Waves and Correlated Insulating State in Atomically Thin 1T−TaS2", "journal": "PRL_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/pxpf-6bsv", "authors": "Gan Liu, Yulu Liu, Qiling Luo, et al.", "last_authors": "Yi Lu, Xiaoxiang Xi", "summary": "A combination of Raman spectroscopy and transport measurements shows that approaching the 2D limit markedly enhances the charge density wave order and the associated correlated insulating state in 1 T -TaS 2 .", "tier": "B_IMPORTANT_CONDMAT", "score": "9", "reason": "Direct experimental study of enhanced CDW and correlated state in atomically thin $1T\\text{−}{\\text{TaS}}_{2}$.", "tags": ["CDW", "correlatedelectrons", "2Dmaterials", "Ramanspectroscopy", "transport"], "image": "", "briefing": {"background": "1T-TaS2는 전형적인 층상 구조 물질로, 온도 변화에 따른 전하 밀도 파동(CDW)과 상관관계가 강한 절연체 상태 사이의 복잡한 물리적 상호작용으로 유명합니다.", "motivation": "벌크와 달리 원자 수준의 박막으로 갈수록 CDW 질서와 상관 절연체 상태가 어떻게 변하는지 규명하고자 합니다.", "result": "2차원 극한으로 갈수록 1T-TaS2의 CDW 질서가 강하게 강화되며, 이와 연관된 상관 절연체 상태 역시 두드러짐을 라만 및 수송 측정을 통해 확인했습니다.", "implication": "차원 축소(dimensional reduction)를 통해 상관 전자계의 위상과 상전이를 제어할 수 있는 가능성을 제시하며, 이는 저차원 물질의 물성 공학에 중요한 정보를 제공합니다.", "novelty": "박막화가 CDW와 상관 절연체 상태를 강화한다는 것을 실험적으로 명확히 입증하여 2D 극한에서의 상전이 이해도를 높였습니다.", "unresolved": "박막 두께에 따른 세부적인 밴드 구조 변화와 층간 결합의 구체적 역할에 대해서는 추가적인 ARPES 측정 등이 요구됩니다.", "future_work": "이러한 박막 시스템에서의 외부 게이트 전압이나 압력을 이용한 CDW 제어 및 초전도 상태와의 경쟁 관계 연구가 예상됩니다.", "concepts": [{"term": "Charge Density Wave (CDW)", "why_emerged": "전자의 밀도가 공간적으로 주기적인 변조를 일으키며 에너지를 낮추는 상으로, 저차원 도체에서 흔히 발견됩니다.", "origin": "Peierls에 의해 제안되었습니다.", "connections": "전자-포논 결합, 페르미 면의 네스팅(nesting)과 밀접한 관계가 있습니다."}, {"term": "Correlated Insulator", "why_emerged": "전자의 강한 쿨롱 반발력 때문에 밴드 이론으로는 도체여야 함에도 절연체로 존재하는 상태를 설명하기 위해 필요합니다.", "origin": "Mott에 의해 제안되었습니다.", "connections": "Mott 절연체, 허바드 모델(Hubbard model)과 직접 연결됩니다."}], "english_summary": ["Experimental study on atomically thin 1T-TaS2 using Raman and transport measurements.", "Revealed that dimensionality reduction significantly enhances CDW order.", "Confirmed the reinforcement of the correlated insulating state in the 2D limit.", "Highlights the potential for manipulating strong correlation effects through thin-film engineering."]}}, {"title": "Ferroelectric control of the Mott insulator–topological metal transition", "journal": "Science_Advances", "source": "Gemini", "link": "https://doi.org/10.1126/sciadv.aed6236", "authors": "Mengmeng Niu, Peng-Jie Guo, Yicheng Ma, et al.", "last_authors": "Jingsi Qiao, Yeliang Wang", "summary": "Correlated and topological phases often coexist or compete in van der Waals materials, yet achieving an electrically switchable and reversible conversion between them remains a substantial challenge. Such control is crucial for understanding their interplay and enabling nonvolatile, low-power topological electronics. Here, we propose and demonstrate a polarization-controlled route to switch between Mott insulator and topological metal in ferroelectric-Mott heterostructures. In α-In 2 Se 3 /1T-NbSe 2 , polarization reversal modulates interlayer coupling through out-of-plane orbital alignment. Downward polarization stabilizes Mott-insulating states with type-I band alignment, whereas upward polarization enhances interfacial hybridization, forms interlayer covalent-like quasi-bonding, and drives Γ-point band inversions. The resulting spin-split hybridized valleys penetrate the valence band, inducing a nontrivial topological state with intrinsic anomalous Hall conductivity of ∼10 2 siemens per centimeter. The comparison with α-In 2 Se 3 /1T-TaSe 2 and α-In 2 Se 3 /1T-TaS 2 further identifies Γ-centered valleys and out-of-plane p z -orbital coupling as key ingredients for polarization-switchable topology, providing a general design framework for electrically programmable correlated-topological integration in two-dimensional heterostructures.", "tier": "B_IMPORTANT_CONDMAT", "score": "9", "reason": "Ferroelectric control of Mott-topological transition in van der Waals heterostructures with anomalous Hall effect.", "tags": ["Mottinsulator", "topologicalmetal", "vanderWaals", "heterostructure", "ferroelectricity", "anomalousHall", "correlatedelectronsystem", "NbSe2"], "image": "", "briefing": {"background": "Mott 절연체와 위상 금속 상태는 각각 강한 전자 상관관계와 비자명한 위상 구조에서 비롯되는데, 이 둘을 하나의 소자에서 전기적으로 스위칭하는 것은 현대 응집물질물리의 중요한 도전 과제입니다.", "motivation": "강유전체(ferroelectric) 물질을 활용하여 Mott 절연체와 위상 금속 상태 간의 가역적 전환을 실현하고, 그 메커니즘을 밝히고자 합니다.", "result": "α-In2Se3/1T-NbSe2 헤테로구조에서 강유전체 분극을 이용해 층간 결합을 변조함으로써 Mott 절연체 상태와 위상 금속 상태 사이의 스위칭을 달성했습니다.", "implication": "전기장 제어를 통해 상관관계와 위상 물성을 동시에 조절할 수 있는 새로운 소자 설계 프레임워크를 마련했습니다.", "novelty": "강유전체 분극에 의한 궤도 정렬 변화가 인터페이스 하이브리드화를 유도하여 위상 상태를 프로그래밍할 수 있음을 증명했습니다.", "unresolved": "이러한 현상이 NbSe2 외에 다른 1T 계열 물질에서 얼마나 보편적으로 적용 가능한지는 더 많은 연구가 필요합니다.", "future_work": "제안된 헤테로구조의 실질적인 토폴로지 전자 소자로의 응용 가능성을 타진하고, 유사한 강유전-위상 계면 탐색이 활발해질 것입니다.", "concepts": [{"term": "Mott Insulator", "why_emerged": "밴드 구조로는 금속이어야 할 물질이 전자 간 강한 반발로 인해 전하 이동이 불가능해져 절연체가 되는 현상을 설명합니다.", "origin": "Nevill Mott에 의해 1949년 제안되었습니다.", "connections": "고온 초전도체, 큐레이트(cuprates), 강상관계 시스템의 핵심 개념입니다."}, {"term": "Anomalous Hall Effect (AHE)", "why_emerged": "외부 자기장 없이도 자성체 내에서 베리 곡률(Berry curvature)에 의해 발생하는 횡방향 전압을 설명하기 위해 도입되었습니다.", "origin": "Hall 효과의 변형으로 발견되었으며, Karplus와 Luttinger가 이론을 발전시켰습니다.", "connections": "위상학적 밴드 구조, 자기적 Weyl 세미메탈, Berry phase와 연결됩니다."}], "english_summary": ["Demonstrated ferroelectric control of the Mott insulator-topological metal transition.", "Used alpha-In2Se3/1T-NbSe2 van der Waals heterostructures.", "Polarization reversal modulates interlayer orbital hybridization to drive band inversion.", "Achieved an electrically switchable topological state with measurable anomalous Hall conductivity.", "Provides a design framework for programmable correlated-topological integration."]}}, {"title": "Density waves in low-pressure bilayer nickelates", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2606.29527", "authors": "Lauro B. Braz, Steffen B\\\"otzel, Frank Lechermann, et al.", "last_authors": "Luis G. G. V. Dias da Silva, Ilya M. Eremin", "summary": "The low-pressure phase diagram of La$_3$Ni$_2$O$_7$ provides an important reference for understanding its pressure-induced high-temperature superconductivity. While the spin-density-wave transition at $T_{\\text{SDW}}\\approx150$ K is increasingly well established, the origin of the second density-wave transition at $T_{\\text{DW}}\\approx130$ K has remained unresolved. Here, we perform unrestricted Hartree-Fock calculations to investigate the potential origin of the second transition. {Within the orthorhombic phase, the degeneracy between possible ordering wavevectors at $\\boldsymbol{Q}_{Y}=(0,\\pi)$ and at $\\boldsymbol{Q}_{X}=(\\pi,0)$ is lifted and the electronic system} develops a double-stripe spin-density wave with ordering vector $\\boldsymbol{Q}_{Y}=(0,\\pi)$. We identify that the pure double stripe spin state is unstable in La$_3$Ni$_2$O$_7$ towards a commensurate charge-density wave instability, which favors a spin-modulated double stripe order with intertwined charge and spin instabilities and establish the hierarchy of ordered states in La$_3$Ni$_2$O$_7$. We further discuss our results in the context of available experimental literature and propose further experimental tests to elucidate the origin of the SDW/DW states in this system.", "tier": "B_IMPORTANT_CONDMAT", "score": "9", "reason": "Important study of intertwined spin and charge density waves in superconducting nickelates.; demoted from A: broad CM, not direct user/project hit", "tags": ["theory", "nickelate", "density-waves"], "image": "https://arxiv.org/html/2606.29527v2/model_system_v2.png", "briefing": {"background": "La3Ni2O7은 상압 하에서 고온 초전도성을 보이는 니켈산염으로, 이 물질의 기저 상태인 스핀 밀도 파동(SDW)과 전하 밀도 파동(CDW)의 상호작용을 이해하는 것이 고온 초전도 기작 규명의 핵심입니다.", "motivation": "상압에서 관측되는 두 가지 밀도 파동 전이(T_SDW=150K, T_DW=130K) 중, 나중에 발견된 T_DW 전이의 기원과 그 실체를 이론적으로 밝히고자 했습니다.", "result": "비제약 하트리-폭(Unrestricted Hartree-Fock) 계산을 통해, 이중 스트라이프(double-stripe) SDW 상태가 전하 밀도 파동과 얽혀 있음을 확인했습니다. SDW가 순수하게 존재하는 것보다 CDW와 결합한 상태가 에너지적으로 더 안정함을 보였습니다.", "implication": "La3Ni2O7의 상압 상전이 계층 구조를 명확히 함으로써, 압력에 의한 초전도성 발현 전후의 전자 상관관계 변화를 추론할 수 있는 토대를 제공합니다.", "novelty": "니켈산염 초전도체에서 스핀과 전하 밀도 파동의 상호 얽힘(intertwined)을 구체적인 오더링 벡터(Q_Y=(0,π))와 함께 이론적으로 정립한 점이 중요합니다.", "unresolved": "실제 실험적으로 관측된 구체적인 CDW 구조와 이번 모델링의 일치 여부, 그리고 스트라이프 패턴의 도메인 성질에 대한 추가 연구가 필요합니다.", "future_work": "제안된 스핀-전하 결합 밀도 파동을 검증하기 위한 공명 X-선 산란 실험이나 저온 주사터널링현미경(STM) 실험이 필요합니다.", "concepts": [{"term": "Double-stripe SDW", "why_emerged": "전자의 스핀 밀도가 공간적으로 주기적인 패턴을 형성할 때 나타나는 현상으로, 강상관 전자계의 비대칭성을 설명하기 위해 필요합니다.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "쿠퍼레이트의 스트라이프 상, 니켈산염의 자기적 이방성 연구와 연결됩니다."}, {"term": "Intertwined order", "why_emerged": "서로 다른 차수의 파라미터(스핀, 전하)가 독립적이지 않고 동시 다발적으로 나타나는 현상을 기술하기 위해 등장했습니다.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "고온 초전도체의 슈도갭, 전하 밀도 파동 및 초전도성 사이의 관계론과 연결됩니다."}], "english_summary": ["Analyzes the density wave transitions in La3Ni2O7 using Hartree-Fock calculations.", "Identifies that the secondary DW transition is a charge-density wave instability intertwined with a double-stripe spin-density wave.", "Establishes a hierarchy of order in the low-pressure phase of nickelates.", "Suggests that ligand-modulated interactions are key to the system's electronic stability."]}}, {"title": "Exchange-induced suppression of superconductivity in a nano-skyrmion lattice - superconductor hybrid", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2608.09207", "authors": "Dongfei Wang, Wenbin Li, Eric Mascot, Roland Wiesendanger", "last_authors": "Eric Mascot, Roland Wiesendanger", "summary": "Engineered magnet-superconductor hybrids have recently been identified as promising platforms for the investigation of topological superconductivity. Beyond ferro- and antiferromagnetic structures, coupling non-collinear spin textures, such as skyrmion lattices, to superconductors offers an exciting route for creating and manipulating unconventional superconducting states. In this work, by preparing monolayer Fe on Ir(111) thin films grown epitaxially on a Nb(110) surface, we realize a hybrid system of a nano-skyrmion lattice proximitized to a superconducting substrate. Scanning tunneling spectroscopy shows that superconductivity becomes suppressed by the Fe nano-skyrmion lattice, with both the superconducting gap and coherence peaks disappearing. Tight-binding calculations reveal that with increasing exchange coupling, the gap is progressively filled up and eventually superconductivity gets quenched. These results reveal microscopic constraints for designing topologically non-trivial states based on magnet-superconducting heterostructures.", "tier": "B_IMPORTANT_CONDMAT", "score": "9", "reason": "Scanning tunneling spectroscopy of a nano-skyrmion lattice on a superconductor; targets spectroscopic interests.; demoted from A: broad CM, not direct user/project hit", "tags": ["experiment", "STS", "topologicalsuperconductivity"], "image": "https://arxiv.org/static/browse/0.3.4/images/arxiv-logo-fb.png", "briefing": {"background": "자성체와 초전도체의 이질 접합은 위상 초전도성(topological superconductivity)을 구현하고 마요라나 준입자를 탐색하기 위한 핵심 플랫폼입니다.", "motivation": "강자성체나 반강자성체가 아닌, 비공선형 스핀 구조인 나노-스카이르미온 격자가 초전도성과 접합되었을 때 나타나는 국소적 전자 상태 변화를 조사하고자 했습니다.", "result": "Fe 스카이르미온 격자가 Nb 기판의 초전도성을 강하게 억제함을 STS를 통해 확인했습니다. 교환 상호작용이 증가함에 따라 초전도 갭과 코히런스 피크가 사라지는 현상을 보였습니다.", "implication": "스카이르미온 격자를 이용한 위상 초전도체 설계 시, 강한 교환 결합이 오히려 초전도성을 파괴할 수 있으므로 자성층의 두께나 결합 강도 제어가 필수적임을 시사합니다.", "novelty": "스카이르미온과 초전도체의 하이브리드 계면에서 발생하는 초전도 갭의 붕괴를 원자 수준에서 정밀하게 관측(STS)했다는 점이 독보적입니다.", "unresolved": "초전도성이 억제되는 영역에서 위상학적 경계 상태(Edge states)나 마요라나 모드의 등장은 관측되지 않았으며, 이를 구현하기 위한 최적화 조건이 미지수입니다.", "future_work": "교환 결합을 약하게 조절하거나 다른 위상학적 자성 구조를 사용하여 초전도성을 유지하면서도 위상학적 특성을 추출하는 실험이 필요합니다.", "concepts": [{"term": "Nano-skyrmion lattice", "why_emerged": "비자명한 위상학적 성질을 띠는 소용돌이 모양의 스핀 구조로, 차세대 스핀트로닉스 소자로 주목받습니다.", "origin": "Tony Skyrme(이론), Mühlbauer et al. (실험적 발견, 2009).", "connections": "위상 홀 효과, 스핀-궤도 결합, 강자성/반강자성 스핀 구조와 연결됩니다."}, {"term": "Proximitized", "why_emerged": "초전도체가 아닌 물질에 초전도 성질을 전이시켜 새로운 양자 상태를 생성하기 위해 사용되는 기술적 방법론입니다.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "조셉슨 접합, 위상 초전도성 구현, 마요라나 페르미온 탐색과 직접 연결됩니다."}], "english_summary": ["Investigates the proximity effect of a nano-skyrmion lattice on a superconducting Nb(110) substrate.", "Scanning Tunneling Spectroscopy reveals the suppression of superconductivity by Fe nano-skyrmions.", "Tight-binding calculations confirm that strong exchange coupling leads to the quenching of the superconducting gap.", "Provides microscopic guidelines for designing magnetic-superconducting heterostructures for topological physics."]}}, {"title": "Many-Body Amplification of Ligand Instabilities Driving Verwey-Type Transitions in Altermagnet CsCr2S2O", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2607.28029", "authors": "Xiuhua Chen, Yilin Wang", "last_authors": "Xiuhua Chen, Yilin Wang", "summary": "Altermagnet CsCr$_2$S$_2$O undergoes a Verwey-type metal-to-insulator transition (MIT), accompanied by a lattice distortion and stripe charge order on the Cr sublattice. Intriguingly, the atomic distortions occur exclusively at the ligand sites rather than the Cr sites, leaving the origin of the pronounced Cr charge disproportionation unresolved. Using density functional theory plus dynamical mean-field theory (DFT+DMFT) calculations, we identify an orbital-selective Mott state in which the correlated metallic $d_{yz}$ orbital governs the low-energy physics. We show that S-site distortions produces only a small bare charge asymmetry between the Cr sublattices through Cr-$d_{yz}$--S-$p$ hybridization. Dynamical electronic correlations, however, dramatically amplify this asymmetry, producing pronounced differentiation in both the charge occupancy and correlation strength of the $d_{yz}$ orbitals. The resulting si {"term": "Verwey-type transition", "why_emerged": "마그네타이트(Fe3O4)에서 처음 발견된 전하 정렬 및 금속-절연체 전이 현상을 기술하는 용어입니다.", "origin": "E.J.W. Verwey (1939).", "connections": "전하 정렬, 자기적 상전이, 복합 음이온 화합물과 연결됩니다."}], "english_summary": ["Studies the metal-insulator transition (MIT) in the altermagnet CsCr2S2O using DFT+DMFT.", "Discovers that S-site ligand distortions drive the MIT through correlation-amplified charge disproportionation.", "Highlights the Cr-dyz orbital as the primary driver of low-energy physics.", "Proposes ligand engineering as a powerful strategy to control metallic states in altermagnets."]}}, {"title": "Perpendicular electric field induced competing s^- and d-wave pairings in La3Ni2O7 thin film", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2604.07185", "authors": "Yongping Wei, Xun Liu, Fan Yang, Mi Jiang", "last_authors": "Fan Yang, Mi Jiang", "summary": "Inspired by the possibility that superconducting properties may be altered by applying a perpendicular electric field in the Ruddlesden-Popper (RP) bilayer nickelate La$_3$Ni$_2$O$_7$ thin film, we investigated the imbalanced two-orbital bilayer Hubbard model with a layer potential bias using dynamical cluster quantum Monte Carlo calculations. Focusing on the pairing symmetry evolution with the potential bias between layers for the undoped, hole-doped, and electron-doped regimes, we found that the $s^\\pm$-wave pairing, originating from the $d_{z^2}$ orbital at high temperature regime as well as $d_{x^2-y^2}$ orbital at lower temperatures, is suppressed by the potential bias; while a possible pairing symmetry transition from $s^\\pm$-wave to $d$-wave pairing occurs, driven by the interlayer orbital mismatch and the transfer of electrons into the $d_{x^2-y^2}$ orbitals. Our large-scale many-body calculations align with the previous expectation from weak-coupling methods and provide further insight into the superconducting mechanism in RP nickelates.", "tier": "B_IMPORTANT_CO s.org/doi/10.1103/h13n-whcx", "authors": "Fei Zou, Long Zhang, Guoying Gao", "last_authors": "Long Zhang, Guoying Gao", "summary": "Altermagnets, characterized by vanishing net magnetization and momentum-dependent spin-splitting, offer a unique platform for high-performance spintronic devices. Here, we propose a double-barrier altermagnetic tunneling junction, and investigate the spin transport properties of ${\\mathrm{RuO}}_{2}/…", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Transport theory for altermagnets, relevant to user's interest in altermagnetism.", "tags": ["altermagnet", "transport", "theory"], "image": "", "briefing": {"background": "알터자성체(Altermagnet)는 순자화값이 0이면서도 운동량 공간에서 스핀 분할(spin-splitting)이 일어나는 새로운 자기 질서 상태로, 차세대 스피트로닉스 소자의 핵심 재료로 주목받습니다.", "motivation": "알터자성체의 고유한 스핀 분할 특성을 이용하여 기존의 강자성체 기반 터널 접합보다 훨씬 강력한 자기 저항(TMR) 효과를 구현하고자 하는 소자적 관점의 연구입니다.", "result": "이중 장벽(double-barrier) 알터자성체 터널 접합을 설계하고, 특정 운동량 상태에서 발생하는 공명 터널링을 통해 거대한 TMR 효과가 나타남을 이론적으로 입증했습니다.", "implication": "알터자성체가 고효율 스핀 소자 구현에 탁월한 후보임을 시사하며, 비-강자성체 기반의 스핀트로닉스 소자 설계에 가이드라인을 제공합니다.", "novelty": "알터자성체 특유의 운동량 의존적 스핀 구조를 전송 효율 극대화에 활용했다는 점이 핵심이며, 토폴로지 물질의 수송 연구를 하는 독자에게 흥미로운 제안입니다.", "unresolved": "실제 나노소자 제작 시 계면 결함이나 스핀 산란 효과가 거대 TMR 효과를 얼마나 감소시킬지에 대한 분석이 필요합니다.", "future_work": "RuO2 등 실제 알터자성체 물질을 이용한 소자 제작 및 저온에서의 전기 전도도 측정 실험이 뒤따를 것으로 보입니다.", "concepts": [{"term": "알터자성체 (Altermagnet)", "why_emerged": "강자성체와 반강자성체의 장점을 결합하여 자기장 없이 스핀 전류를 제어하기 위해.", "origin": "최근 2-3년 사이 이론적 확립 (예: Šmejkal et al.).", "connections": "Berry curvature, anomalous Hall, spin-splitting."}, {"term": "공명 터널링 (Resonant Tunneling)", "why_emerged": "에너지 및 운동량 조건이 맞을 때 터널링 효율을 비약적으로 높이기 위해.", "origin": "양자 역학적 터널링 효과의 일반적 응용.", "connections": "Double-barrier junctions, quantum wells."}], "english_summary": ["Proposes a double-barrier altermagnetic tunneling junction for high-performance spintronics.", "Demonstrates giant tunneling magnetoresistance via momentum-selective resonant tunneling.", "Exploits the unique momentum-dependent spin-splitting of altermagnets.", "Provides a theoretical framework for efficient spin control in non-ferromagnetic materials."]}}, {"title": "Phonon scattering mechanisms in WTe2 observed by ultrafast coherent phonon spectroscopy", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/ssvg-wh36", "authors": "Mizuki Akei, Yu Mizukoshi, Muneaki Hase", "last_authors": "Yu Mizukoshi, Muneaki Hase", "summary": "T d -WTe 2 is a Weyl semimetal, which exhibits unique physical properties of electronic states, such as the Lifshitz transition. Here, using ultrafast laser spectroscopy, the authors reveal contribution of phonon-electron scattering only for the low-frequency A 1 optical phonon, in addition to conventional phonon-phonon scattering at low temperatures. The findings of the phonon-electron scattering path possibly induced by the Lifshitz transition pave the way for further exploration of the electronic structure and transport properties in a wide range of quantum materials.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Experimental study on Weyl semimetal WTe2; relevant to electronic structure.", "tags": ["WTe2", "Weylsemimetal", "spectroscopy"], "image": "", "briefing": {"background": "Weyl 반금속인 WTe2는 전자 구조의 변화(Lifshitz transition)와 밀접하게 연관된 격자 진동(포논) 특성을 가지고 있어, 물질의 기본 물성 이해에 중요한 모델 시스템입니다.", "motivation": "저온에서 나타나는 WTe2의 비정상적인 전자 구조 변화가 격자 진동과 어떤 상관관계를 갖는지 규명하고, 전자-포논 산란의 경로를 분리하여 확인하고자 했습니다.", "result": "초고속 분광법을 통해 저주파 A1 광학 포논이 저온에서 전자-포논 산란에 참여함을 확인했으며, 이는 Lifshitz 전이와 관련이 있을 가능성을 시사합니다.", "implication": "양자 물질에서 전자-포논 결합의 동역학을 이해하는 새로운 방법을 제시하며, 위상물질의 수송 현상 해석에 중요한 근거를 제공합니다.", "novelty": "WTe2의 전자 구조적 변화(Lifshitz 전이)가 구체적으로 어떤 포논 모드와 상호작용하는지 실험적으로 분리해 낸 것이 중요한 기여입니다.", "unresolved": "Lifshitz 전이가 정확히 어떤 포논 모드와의 상호작용을 매개하는지에 대한 미시적 메커니즘과 그 강도는 추가 연구가 필요합니다.", "future_work": "다른 위상 반금속 물질로 범위를 넓혀 Lifshitz 전이와 포논 모드 결합의 보편성을 조사하는 연구가 이어질 것입니다.", "concepts": [{"term": "Lifshitz 전이 (Lifshitz Transition)", "why_emerged": "페르미면의 토폴로지가 온도나 압력에 따라 변하는 현상을 기술하기 위해.", "origin": "I. M. Lifshitz, 1960.", "connections": "전자 구조 변화, 위상 반금속, 양자 상전이."}, {"term": "초고속 코히어런스 포논 분광법 (Ultrafast Coherent Phonon Spectroscopy)", "why_emerged": "극도로 짧은 시간 스케일에서 격자의 진동 동역학을 실시간으로 관찰하기 위해.", "origin": "1990년대 초반 펨토초 레이저 기술의 발전과 함께 정립.", "connections": "Electron-phonon coupling, lattice dynamics."}], "english_summary": ["Investigates phonon scattering mechanisms in Weyl semimetal WTe2 using ultrafast spectroscopy.", "Identifies a specific contribution of phonon-electron scattering for the low-frequency A1 optical mode.", "Links these scattering processes to potential changes induced by the Lifshitz transition.", "Advances understanding of electron-phonon coupling in topological quantum materials."]}}, {"title": "Possible origin of the 1750.16em0excm−1 Raman mode in altermagnetic MnTe", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/7pd9-xwmw", "authors": "Bishal Thapa, K. D. Belashchenko, Igor I. Mazin", "last_authors": "K. D. Belashchenko, Igor I. Mazin", "summary": "MnTe has recently attracted exceptional attention due to its well-established altermagnetism, prompting a thorough reexamination of its properties. In particular, it was found that a Raman-active excitation at $∼175\\phantom{\\rule{0.28em}{0ex}}{\\mathrm{cm}}^{−1}$, routinely assigned to the ${E}_{2g}$…", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Altermagnetic material analysis relevant to magnetic topological materials interest.", "tags": ["material", "altermagnetism", "spectroscopy"], "image": "", "briefing": {"background": "알터자성(Altermagnetism)은 강자성이나 반강자성과는 다른 새로운 자기 질서로, 시간 역전 대칭성이 깨져 있으면서도 순 자화값이 0인 독특한 성질을 가집니다.", "motivation": "MnTe에서 관측된 175 cm⁻¹ Raman 모드가 기존에 E₂g 모드로 잘못 해석되고 있었을 가능성을 제기하며 그 기원을 재조명합니다.", "result": "이 Raman 모드가 실제로는 격자 진동이 아닌, 알터자성 질서와 결합된 전자적 들뜸이나 마그논 산란 등에 의한 것일 가능성을 물리적 모델을 통해 제시합니다.", "implication": "알터자성 물질의 스펙트럼 데이터를 정확히 해석하는 기준을 제공하며, 비전통적인 자기 질서의 탐지를 위한 중요한 실험적 이정표가 될 것입니다.", "novelty": "독자님이 관심 가지는 알터자성 물질인 MnTe의 전자-격자 상호작용을 심도 있게 다루어, 향후 해당 물질의 ARPES나 RIXS 결과 해석 시 오해를 방지할 수 있습니다.", "unresolved": "이 모드의 정확한 미시적 기원에 대해서는 여전히 실험적 확증이 필요하며, 이론적 계산값과 실험 데이터의 완벽한 정량적 일치는 확인되지 않았습니다.", "future_work": "편광 분해 Raman 분광법이나 추가적인 자기장 의존성 측정을 통해 해당 모드의 대칭성을 명확히 밝히는 연구가 필요합니다.", "concepts": [{"term": "Altermagnetism", "why_emerged": "비자기적 결정 구조에서 시간 역전 대칭성이 깨져 발생하는 새로운 유형의 자기 질서가 발견되면서 정립되었습니다.", "origin": "최근 2-3년 내에 이론적으로 체계화되었습니다.", "connections": "반강자성, 스핀 분극 전자 구조, 위상학적 물성 연구와 결합됩니다."}, {"term": "Raman mode", "why_emerged": "물질 내의 격자 진동(포논) 및 전자 상태의 들뜸을 비파괴적으로 탐구하기 위해 사용됩니다.", "origin": "C. V. Raman에 의해 1928년 발견되었습니다.", "connections": "ARPES, RIXS와 함께 응집물질의 준입자 특성을 이해하는 핵심 도구입니다."}], "english_summary": ["MnTe is a prominent altermagnetic material exhibiting unique broken time-reversal symmetry.", "The paper re-evaluates the 175 cm⁻¹ Raman mode previously assigned to an E2g phonon.", "Authors suggest the mode likely originates from non-phonon excitations related to altermagnetic order.", "This provides a framework for future spectroscopic studies in topological and magnetic materials."]}}, {"title": "Quantum geometry in the NbSe2 family: Obstructed compact Wannier function and perturbation theory", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/2bjl-p1vd", "authors": "Jiabin Yu, Yi Jiang, Yuanfeng Xu, et al.", "last_authors": "Fernando De Juan, B. Andrei Bernevig", "summary": "Here, the authors reveal that monolayer NbSe 2 and related transition metal dichalcogenides host obstructed atomic bands near the Fermi level. By constructing a b i n i t i o six-, three-, and single-band Wannier models, they identify remarkably compact obstructed Wannier functions and an unusual dominance of next-nearest-neighbor hopping. These results provide a transparent low-energy framework for investigating how quantum geometry shapes charge order, electron–phonon coupling, and superconductivity in NbSe 2 .", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "DFT study of NbSe2 electronic structure relevant to charge order and superconductivity.", "tags": ["DFT", "NbSe2", "superconductivity"], "image": "", "briefing": {"background": "NbSe₂와 같은 전이금속 디칼코게나이드(TMD)는 전하 밀도 파(CDW)와 초전도성이 공존하여 전자 상관관계 연구의 핵심 물질입니다.", "motivation": "기존의 에너지 밴드 모델만으로는 NbSe₂의 복잡한 전자 구조와 결합된 물성을 충분히 설명하기 어려워 양자 기하학적 관점이 도입되었습니다.", "result": "페르미 준위 근처에 '방해받은(obstructed) 원자 밴드'가 존재함을 발견하고, 매우 콤팩트한 Wannier 함수를 도출했습니다.", "implication": "NbSe₂의 전자 구조가 국소적 호핑(hopping)보다는 양자 기하학적 제약에 의해 결정됨을 시사하며, 이는 CDW와 초전도성의 상관관계를 다시 쓰게 합니다.", "novelty": "Wannier 함수를 이용해 NbSe₂의 하위 에너지 모델을 구축함으로써, 독자님의 주관심사인 112 tellurides 및 kagome 계열의 전자 구조 해석에도 유용한 방법론을 제시합니다.", "unresolved": "이러한 양자 기하학적 특성이 실제 초전도 전이 온도에 미치는 정량적인 영향력은 추가 연구가 필요합니다.", "future_work": "제안된 Wannier 모델을 바탕으로 CDW 형성 메커니즘을 시뮬레이션하고 이를 ARPES 데이터와 비교하는 작업이 예상됩니다.", "concepts": [{"term": "Obstructed Wannier functions", "why_emerged": "물질의 위상학적 성질과 전자 밴드 구조 간의 관계를 보다 직관적으로 이해하기 위해 필요했습니다.", "origin": "B. Andrei Bernevig 그룹에 의해 위상학적 밴드 이론의 맥락에서 정립되었습니다.", "connections": "위상 절연체, 국소화된 전자 상태 이론과 밀접합니다."}, {"term": "Quantum geometry", "why_emerged": "평탄 밴드(flat band)나 위상학적 물질에서 전자 파동함수의 기하학적 구조가 물성을 지배함이 드러나며 주목받게 되었습니다.", "origin": "Berry 곡률 및 Wannier 함수 기반의 현대 위상 물성 이론에서 기인합니다.", "connections": "초전도성, 분수 양자 홀 효과, 비선형 광응답."}], "english_summary": ["Monolayer NbSe2 hosts obstructed atomic bands near the Fermi level.", "Researchers constructed ab-initio Wannier models identifying compact obstructed Wannier functions.", "Dominant next-nearest-neighbor hopping provides a low-energy framework for electronic correlations.", "These findings help clarify the interplay between charge order, phonons, and superconductivity in TMDs."]}}, {"title": "Role of interstitial s orbital in a model of infinite-layer nickelates", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/j7n2-vhkt", "authors": " ronic dispersion.", "The study reconciles discrepancies in theoretical models regarding nickelate band structure."]}}, {"title": "Tunable skyrmion and antiskyrmion fluids via mechanical strain in a chiral kagome lattice", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/nr3k-43c5", "authors": "Gonzalo dos Santos, Flavia A. Gómez Albarracín, Ludovic D. C. Jaubert, Pierre Pujol, Eduardo M. Bringa, H. Diego Rosales", "last_authors": "Eduardo M. Bringa, H. Diego Rosales", "summary": "Magnetic skyrmions are nanometric swirling spin textures that exhibit remarkable stability at finite temperatures, making them promising candidates for spintronic applications. Achieving controllable stability and transitions between distinct topological structures is crucial for practical implement…", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Directly touches on kagome physics and topological spin textures.", "tags": ["material", "kagome", "topological"], "image": "", "briefing": {"background": "자성 스카이뮴(skyrmion) 및 안티스카이뮴(antiskyrmion)은 위상학적으로 보호되는 소용돌이 형태의 스핀 구조로, 차세대 스핀트로닉스 소자의 핵심 요소로 주목받고 있습니다. 카고메 격자와 같은 비자명한 결정 구조에서는 이러한 스핀 텍스처의 형성 및 안정성이 물질의 위상학적 특성과 강하게 결합되어 나타납니다.", "motivation": "스카이뮴의 위상적 안정성을 외부 자극을 통해 제어하고, 특히 특정 기하학적 격자(카고메)에서 기계적 변형(strain)이 이러한 위상학적 스핀 상태의 전이에 미치는 영향을 탐구하고자 합니다.", "result": "카고메 격자에서 인가된 기계적 변형이 스카이뮴 및 안티스카이뮴 유체 상태의 안정성을 변화시킬 수 있음을 보였으며, 특정 변형 조건에서 위상학적 스핀 텍스처의 제어 가능한 상태 변화를 입증했습니다.", "implication": "기계적 변형을 활용해 위상학적 스핀 상태를 동적으로 제어할 수 있음을 제시하며, 이는 외부 자기장이나 전류 외에도 변형 공학(strain engineering)을 이용한 신규 스핀트로닉 소자 설계 가능성을 보여줍니다.", "novelty": "카고메 격자의 기하학적 특성과 위상학적 스핀 텍스처 간의 결합을 다루고 있어, 사용자의 핵심 관심사인 카고메 금속 및 위상 자성 물질 연구에 중요한 물리적 통찰을 제공합니다.", "unresolved": "실제 합성된 카고메 자성 물질에서 이러한 유체 상태의 전이가 실험적으로 구현 가능한지, 그리고 상온 안정성 확보 여부는 여전히 추가 연구가 필요합니다.", "future_work": "원자 분해능의 스핀 이미징 기술(예: Lorentz TEM, MFM)을 이용한 실제 실험적 관측과 특정 변형 조건에서의 수송 특성 측정.", "concepts": [{"term": "스카이뮴 (Skyrmion)", "why_emerged": "비자명한 위상학적 성질을 가져 에너지 장벽에 의해
