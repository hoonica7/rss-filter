<!DOCTYPE html>

<title>Daily Paper Slideshow</title>
<style>
  :root {
    color-scheme: light;
    --bg: #f6f7f4;
    --paper: #ffffff;
    --ink: #111827;
    --muted: #64748b;
    --line: #d8ddd2;
    --accent: #176b87;
    --accent-2: #9a3412;
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; overflow: auto; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: var(--bg); color: var(--ink); }
  .shell { max-width: 1500px; min-height: 100vh; margin: 0 auto; padding: 14px 18px; display: flex; flex-direction: column; }
  .topbar { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 16px; }
  .top-actions { display: flex; align-items: center; gap: 10px; }
  .topbar a, button { border: 1px solid var(--line); border-radius: 8px; background: var(--paper); color: var(--ink); padding: 10px 14px; font-weight: 700; text-decoration: none; cursor: pointer; }
  button.primary { background: var(--accent); border-color: var(--accent); color: white; }
  button:disabled { opacity: 0.45; cursor: not-allowed; }
  .counter { color: var(--muted); font-weight: 700; }
  .slide { min-height: calc(100vh - 82px); background: var(--paper); border: 1px solid var(--line); border-radius: 10px; padding: 18px; box-shadow: 0 18px 42px rgba(15, 23, 42, 0.10); display: grid; grid-template-columns: minmax(310px, 0.86fr) minmax(0, 1.55fr); gap: 18px; overflow: visible; }
  .paper-head { min-width: 0; min-height: 0; overflow: visible; display: flex; flex-direction: column; gap: 12px; }
  .figure { margin: 0; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: #f8fafc; }
  .figure img { display: block; width: 100%; max-height: 41vh; object-fit: contain; background: white; }
  .figure figcaption { padding: 7px 10px; color: var(--muted); font-size: 12px; line-height: 1.3; }
  .head-text { display: flex; flex-direction: column; gap: 9px; min-width: 0; }
  .badges { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .badge { border-radius: 999px; padding: 5px 9px; background: #eef2ff; color: #3730a3; font-size: 12px; font-weight: 800; }
  .score { background: #fee2e2; color: #991b1b; }
  h1 { margin: 0; font-size: 25px; line-height: 1.15; letter-spacing: 0; overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
  h1 a { color: inherit; text-decoration-color: rgba(23, 107, 135, 0.35); text-decoration-thickness: 2px; text-underline-offset: 4px; }
  h1 a:hover { color: var(--accent); text-decoration-color: var(--accent); }
  .meta, .authors, .why, .abstract { font-size: 13px; line-height: 1.45; }
  .meta, .authors { color: var(--muted); }
  .why strong, .abstract strong, .authors strong { color: var(--ink); }
  .authors { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .why { border-left: 4px solid var(--accent-2); padding-left: 10px; color: #374151; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .abstract { border-top: 1px solid var(--line); padding-top: 14px; color: #374151; }
  .original-abstract { border-top: 1px solid var(--line); padding-top: 10px; color: #374151; font-size: 11.5px; line-height: 1.35; overflow-wrap: anywhere; }
  .original-abstract strong { display: block; margin-bottom: 4px; color: var(--ink); }
  .tags { display: flex; flex-wrap: wrap; gap: 8px; }
  .tag { border-radius: 999px; padding: 4px 8px; background: #f1f5f9; color: #475569; font-size: 12px; font-weight: 700; }
  .head-text > .link { display: none; }
  .briefing { min-width: 0; min-height: 0; overflow: visible; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); grid-auto-rows: minmax(0, auto); align-content: start; gap: 11px 18px; border-top: 0; padding-top: 0; }
  .brief-section { min-width: 0; }
  .brief-section.wide { grid-column: 1 / -1; }
  .brief-section h2 { margin: 0 0 4px; font-size: 14px; line-height: 1.22; color: #0f766e; letter-spacing: 0; }
  .brief-section p, .brief-section li { margin: 0; font-size: 12.5px; line-height: 1.42; color: #1f2937; overflow-wrap: anywhere; }
  .brief-section ul { margin: 0; padding-left: 20px; }
  .concepts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 9px 14px; }
  .concept { border-top: 1px solid var(--line); padding-top: 7px; }
  .concept h3 { margin: 0 0 4px; font-size: 13px; color: #7c2d12; letter-spacing: 0; }
  .concept p { margin: 2px 0 0; font-size: 11.5px; line-height: 1.35; color: #374151; overflow-wrap: anywhere; }
  .concept b { color: #111827; }
  .link { color: var(--accent); font-weight: 800; text-decoration: none; }
  .empty { padding: 48px; background: var(--paper); border: 1px solid var(--line); border-radius: 12px; color: var(--muted); }
  @media (max-width: 860px) {
    .shell { padding: 14px; }
    .topbar, .top-actions { align-items: stretch; flex-direction: column; }
    .slide, .briefing, .concepts { grid-template-columns: 1fr; }
    .slide { min-height: auto; overflow: visible; display: grid; }
    h1 { font-size: 28px; }
  }
</style>

<script>
const slides = [{"title": "Hund's coupling governed orbital-selective superconductivity in Ba1−xKxFe2As2", "journal": "PRB_Recent", "source": "author whitelist", "link": "http://link.aps.org/doi/10.1103/yry8-qdm6", "authors": "Elena Corbae, Rong Zhang, Cong Li, et al.", "last_authors": "Donghui Lu, Zhi-Xun Shen", "summary": "Author(s): Elena Corbae, Rong Zhang, Cong Li, Kunihiro Kihou, Chul-Ho Lee, Makoto Hashimoto, Thomas Devereaux, Oscar Tjernberg, Egor Babaev, Dung-Hai Lee, Vadim Grinenko, Donghui Lu, and Zhi-Xun Shen While the influence of electronic correlations on superconductivity is a defining question, identifying how these correlations manifest in the superconducting state remains difficult. Furthermore, in multiorbital systems, correlations driven by Hund’s coupling can differentiate the behavior of individual orbitals, and how such orbital selectivity governs superconducting pairing has remained largely unexplored experimentally. Here, the authors use angle-resolved photoemission spectroscopy to experimentally determine the superconducting gap of a representative iron-based superconductor as the Hund’s coupling influence increases. They find increased correlation diminishes the superconducting gap in an orbital-selective way, suggesting that Hund’s coupling plays a central role in shaping pairing in multiorbital superconductors. [Phys. Rev. B 113, 224517] Published Fri Jun 12, 2026", "tier": "A_MUST_READ", "score": "10", "reason": "author whitelist: Makoto Hashimoto", "tags": ["angle-resolvedphotoemission", "photoemission", "superconduct"], "image": "", "briefing": {"background": "철 기반 초전도체(Fe-based superconductors)에서 전자 상관관계는 초전도 상태를 결정짓는 핵심 요소입니다. 특히 다중 궤도(multiorbital) 시스템에서 Hund's 결합은 전자의 국소화와 궤도 선택적 성질을 유도하여 초전도 페어링 메커니즘을 복잡하게 만드는 원인이 됩니다.", "motivation": "이 연구는 Hund's 결합의 세기가 변화함에 따라 다중 궤도 시스템의 초전도 갭이 어떻게 궤도 선택적으로 변화하는지 실험적으로 규명하고자 했습니다.", "result": "ARPES를 통해 Ba1-xKxFe2As2 시스템의 초전도 갭을 관찰한 결과, 강한 상관관계가 궤도 선택적인 방식으로 초전도 갭을 약화시킨다는 점을 확인했습니다.", "implication": "이 결과는 Hund's 결합이 단순히 상관관계를 조절하는 것을 넘어, 다중 궤도 초전도체에서 페어링의 대칭성과 강도를 결정하는 핵심적인 물리적 기제임을 시사합니다.", "novelty": "이론적으로 제안되었던 Hund's 결합에 의한 궤도 선택적 초전도 현상을 최첨단 ARPES 분해능을 통해 직접 관측했다는 점이 중요합니다. 철 기반 초전도체 연구의 권위자인 Zhi-Xun Shen 그룹의 성과입니다.", "unresolved": "Hund's 결합에 의한 궤도 선택성이 페어링 대칭성 자체를 근본적으로 바꾸는지, 아니면 단순히 갭의 크기만을 억제하는지에 대한 세부적인 양자역학적 인과관계는 여전히 심화 연구가 필요합니다.", "future_work": "다른 Fe-based 화합물 및 니켈계 초전도체와의 비교 연구를 통해 Hund's 결합의 보편적 역할을 검증하고, 이론적인 DMFT 계산과의 정량적 비교가 수행될 것으로 기대됩니다.", "concepts": [{"term": "Hund's coupling", "why_emerged": "다중 궤도 시스템에서 전자 간의 상호작용이 궤도 자유도와 스핀 정렬에 미치는 영향을 설명하기 위해 필요합니다.", "origin": "원자 물리학의 Hund's 법칙에서 유래, 고체 물리학에서는 2000년대 이후 다중 궤도 상관계 물질 연구의 핵심 개념으로 정착되었습니다.", "connections": "Kanamori 결합, Mott 전이, 철 기반 초전도체의 전자 구조 이론과 직접 연결됩니다."}, {"term": "Orbital-selective superconductivity", "why_emerged": "특정 궤도의 전자가 다른 궤도보다 더 강하게 상관되어 초전도 갭의 크기가 궤도마다 달라지는 현상을 설명하기 위해 도입되었습니다.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "궤도 선택적 Mott 전이(OSMT), Fe-based pnictides의 전자 구조."}], "english_summary": ["ARPES study reveals how Hund's coupling governs superconducting gaps in Ba1-xKxFe2As2.", "Identifies orbital-selective suppression of the superconducting gap due to increased electronic correlations.", "Provides experimental evidence that Hund's physics is a primary driver of pairing in multiorbital systems.", "Results highlight the complex interplay between orbital degrees of freedom and superconducting order parameters."]}}, {"title": "Orbital-selective band evolution and out-of-plane correlation in the FeGe-family kagome antiferromagnet ScFe6Ge6", "journal": "arXiv_CondMat", "source": "author whitelist", "link": "https://arxiv.org/abs/2606.16245", "authors": "Jae Hyuck Lee, Ze Yan, Tongrui Li, et al.", "last_authors": "Yanfeng Guo, Dawei Shen", "summary": "In strongly correlated materials such as high-temperature superconductors, the relation between charge density wave (CDW) order and magnetism remains an important unresolved problem. FeGe is the first kagome metal known to exhibit CDW order deep within an antiferromagnetic state, accompanied by an unconventional evolution of lattice symmetry. To elucidate the general conditions governing such spin-correlated CDW order, we investigate ScFe 6 Ge 6 , which lacks CDW order and therefore exhibits reduced involvement of charge degrees of freedom while retaining other properties of FeGe. Instead of a CDW order, ScFe 6 Ge 6 undergoes a magnetic transition at T ∗ T^{*} = 195 K. Across this transition, angle-resolved photoemission and Raman spectroscopy reveal orbital-selective behavior confined to a single kagome Dirac band, together with electron–phonon and magnetoelastic coupling to an out-of-plane phonon mode. These results suggest that orbital-selective physics and out-of-plane correlations play enhanced roles in realizing spin-correlated CDW order in magnetic kagome metals. Keywords: Kagome lattice, FeGe, CDW, antiferromagnetism, out-of-plane, orbital-selective, magnetoelastic, ARPES, Raman, VHS, Dirac band, flatband, electron-phonon coupling", "tier": "A_MUST_READ", "score": "10", "reason": "author whitelist: Changyoung Kim", "tags": ["angle-resolvedphotoemission", "photoemission", "kagome", "chargedensitywave", "CDW", "Dirac", "superconduct", "correlated"], "image": "https://arxiv.org/html/2606.16245v1/x1.png", "briefing": {"background": "Kagome 금속에서 전하 밀도 파(CDW)와 자기적 질서(magnetism) 사이의 상호작용은 최근 응집물질 물리학의 가장 뜨거운 주제 중 하나입니다. FeGe와 같은 물질은 이 두 현상이 공존하는 독특한 지점이 존재하여 복잡한 물리적 기제를 이해하는 데 중요한 모델을 제공합니다.", "motivation": "CDW 질서가 없는 ScFe6Ge6와 CDW가 존재하는 FeGe를 비교함으로써, 스핀과 연계된 CDW 형성에 필요한 필수 물리적 조건을 식별하고자 했습니다.", "result": "ScFe6Ge6에서 자기 전이와 동시에 발생하는 궤도 선택적 Dirac 밴드 진화와 면외(out-of-plane) 포논 결합을 발견했습니다.", "implication": "자기적 Kagome 금속에서 CDW 질서가 발현되기 위해서는 특정 밴드의 궤도 선택적 성질과 격자의 면외 진동 모드가 강하게 결합해야 함을 시사합니다.", "novelty": "CDW가 없는 등구조 화합물을 비교 연구 대상으로 삼아 CDW 발현의 인과관계를 격리하여 분석했다는 방법론적 측면이 돋보입니다. AV3Sb5 계열 연구자들에게 큰 영감을 줄 수 있는 분석입니다.", "unresolved": "면외 포논 모드가 구체적으로 어떻게 전자와 상호작용하여 CDW 불안정성을 유도하거나 억제하는지에 대한 미시적 메커니즘은 명확하지 않습니다.", "future_work": "다른 Kagome 화합물로의 확장을 통해 이번에 발견된 궤도 선택적 Dirac 밴드 진화가 일반적인지 검증하고, 압력이나 도핑에 따른 제어 연구가 이어질 것입니다.", "concepts": [{"term": "Kagome lattice", "why_emerged": "기하학적 좌절(frustration)과 flat band, Dirac 밴드 등 특이한 전자 구조를 형성하기 위해 필요합니다.", "origin": "1951년 Kaya Seiji에 의해 일본의 전통 바구니 짜기 패턴에서 명명되었습니다.", "connections": "Quantum spin liquid, AV3Sb5 화합물, 위상물질(Topological materials)."}, {"term": "Orbital-selective behavior", "why_emerged": "밴드 구조 내의 특정 궤도 성분이 물리적 상전이에 다르게 반응하는 비대칭성을 기술하기 위해 도입되었습니다.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "Hund's metal, 다중 궤도 시스템의 강상관 현상."}], "english_summary": ["Comparative ARPES and Raman study between ScFe6Ge6 and FeGe.", "Reveals orbital-selective Dirac band evolution linked to out-of-plane phonons.", "Suggests that out-of-plane correlations are essential for realizing spin-correlated CDW in Kagome metals.", "Provides new constraints for existing theories of CDW-magnetism coexistence."]}}, {"title": "Emergent spin-singlet pairing in the frustrated kagome metal Sc3Mn3Al7Si5", "journal": "PRB_Recent", "source": "keyword", "link": "http://link.aps.org/doi/10.1103/8tjx-yy4w", "authors": "R. Guehne, A. K. Sharma, P. Yanda, J. Noky, J. Sichelschmidt, R. Koban, W. Schnelle, C. Shekhar, M. Baenitz, and C. Felser", "last_authors": "W. Schnelle, C. Shekhar, M. Baenitz, and C. Felser", "summary": "Author(s): R. Guehne, A. K. Sharma, P. Yanda, J. Noky, J. Sichelschmidt, R. Koban, W. Schnelle, C. Shekhar, M. Baenitz, and C. Felser The metallic kagome compound ${\\mathrm{Sc}}_{3}{\\mathrm{Mn}}_{3}{\\mathrm{Al}}_{7}{\\mathrm{Si}}_{5}$ has attracted attention as a candidate platform where geometric frustration and itinerant electrons may cooperate to stabilize a quantum-disordered magnetic ground state. Here, we combine bulk thermod… [Phys. Rev. B 113, 214430] Published Wed Jun 10, 2026", "tier": "A_MUST_READ", "score": "9", "reason": "title strong match: kagome metal", "tags": ["kagome"], "image": "", "briefing": {"background": "기하학적 좌절을 가진 Kagome 금속은 스핀 기하학의 한계로 인해 일반적인 자기 질서가 억제되면서 특이한 양자 상태(예: 양자 스핀 액체)를 형성할 가능성이 높은 플랫폼입니다.", "motivation": "Sc3Mn3Al7Si5라는 새로운 Kagome 금속 후보 물질에서 기하학적 좌절과 전도 전자가 결합하여 나타나는 양자 물리적 특성을 탐색하고자 했습니다.", "result": "열역학적 및 자기적 측정을 통해 이 물질이 양자 무질서 자기 바닥 상태(quantum-disordered magnetic ground state)를 향하고 있음을 제시했습니다.", "implication": "이 물질이 기하학적 좌절과 스핀-싱글렛 페어링이 공존하는 새로운 강상관 시스템임을 시사합니다.", "novelty": "Mn 기반의 새로운 Kagome 금속을 발견하고, 이것이 일반적인 자기 정렬이 아닌 특이한 스핀-싱글렛 관련 상태를 보일 가능성을 제기했다는 점에서 흥미롭습니다.", "unresolved": "스핀-싱글렛 페어링의 기원이 진정한 양자 스핀 액체인지, 아니면 다른 형태의 강한 국소적 자기 상관관계에 의한 것인지에 대한 증거가 추가로 필요합니다.", "future_work": "단결정 시료를 이용한 ARPES를 통한 전자 구조 직접 측정과 저온에서의 뮤온 스핀 회전(μSR) 또는 중성자 산란 실험이 요구됩니다.", "concepts": [{"term": "Geometric frustration", "why_emerged": "격자 구조가 삼각, Kagome 등일 경우 스핀이 모든 인접 스핀과 동시에 반강자성 정렬을 할 수 없는 상황을 설명하기 위해 필요합니다.", "origin": "1950년 G.H. Wannier가 삼각 격자에서 제안했습니다.", "connections": "양자 스핀 액체, 자기적 위상 물질."}, {"term": "Spin-singlet pairing", "why_emerged": "두 전자의 스핀이 역방향으로 결합하여 전체 스핀이 0인 상태를 형성하는 기제를 기술하기 위해 필요합니다.", "origin": "양자역학 초기 이론(Heitler-London, 1927) 이후 BCS 이론에서 초전도체의 핵심으로 확립되었습니다.", "connections": "BCS 초전도체, RVB(Resonating Valence Bond) 상태."}], "english_summary": ["Investigates the metallic Kagome compound Sc3Mn3Al7Si5.", "Combines bulk thermodynamics to suggest a quantum-disordered magnetic ground state.", "Points to the interplay between geometric frustration and itinerant electrons.", "Proposes potential for emergent spin-singlet pairing in this frustrated system."]}}, {"title": "Magnonic properties of hematite α-Fe2O3: A combined ab initio and atomistic spin dynamics study", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/c15n-vl24", "authors": "Shanshan Hu, Ziyang Li, Liya Qiao, Yuzhong Zhang, Zongzhi Zhang, Yaowen Liu", "last_authors": "Zongzhi Zhang, Yaowen Liu", "summary": "Author(s): Shanshan Hu, Ziyang Li, Liya Qiao, Yuzhong Zhang, Zongzhi Zhang, and Yaowen Liu Altermagnets are promis  attention towards understanding its underlying origin. With its layered van der Waals structure, the question that remains largely unexplored is whether the three-dimensional anisotropic transport characteristics of WTe2 persists under chemical substitution. Here, we present a systematic angle-dependent magneto-transport study of single-crystalline TaxW1-xTe2 (x = 0, 0.05, 0.1). The results are analysed within a mass anisotropy scaling framework to extract the mass anisotropy parameter {\\gamma} as a function of temperature and doping. It is observed that Ta substitution leads to monotonic increase of {\\gamma} across all temperatures, indicating a progressive deepening of quasi-two-dimensional Fermi surface character. Ta doping also leads to a substantial improvement in crystalline quality, reflected in a pronounced increase in the residual resistivity ratio. Despite weakening electron-hole compensation, the magnetoresistance rises sharply to ~58,211% at x = 0.1, which is assigned to a substantial enhancement in carrier mobility. Rietveld refinement confirms a systematic c-axis contraction with Ta content, identifying the structural origin of the enhanced anisotropy. The mass anisotropy scaling that holds for x = 0 and x = 0.05 breaks down for x = 0.1, where the angular magneto-resistance anisotropy substantially exceeds single-ellipsoid predictions, pointing to a multi-pocket Fermi surface with distinct anisotropies. Nonlinear Hall resistivity provides independent evidence for the underlying multiband character of transport in this system. These findings demonstrate that Fermi surface anisotropy, carrier compensation, and mobility are independent parameters that can lead to tuneable control of large magnetoresistance in topological semimetal WTe2.", "tier": "A_MUST_READ", "score": "9", "reason": "Magneto-transport study of topological semimetal WTe2, very relevant to user's interest in WTe2 and semimetals.", "tags": ["topologicalsemimetal", "WTe2", "magneto-transport"], "image": "https://arxiv.org/static/browse/0.3.4/images/arxiv-logo-fb.png", "briefing": {"background": "WTe2는 거대 자기저항(XMR) 현상으로 유명하며, 이는 위상 반금속 물성과 전자-정공 보상(compensation) 효과가 복합적으로 작용합니다. 이러한 수송 특성이 격자 변형이나 치환에 따라 어떻게 변화하는지는 응집물질물리학의 주요 연구 주제입니다.", "motivation": "Ta 도핑을 통한 WTe2의 격자 구조 변화가 밴드 구조의 이방성과 거대 자기저항 특성에 미치는 영향을 체계적으로 분석하고자 함.", "result": "Ta 도핑이 준-2차원적 페르미 표면 특성을 강화하며, 도핑 농도에 따라 자기저항이 ~58,211%까지 급격히 증가함을 밝힘.", "implication": "페르미 표면의 이방성, 캐리어 보상, 이동도가 독립적으로 조절 가능하며, 이를 통해 거대 자기저항 현상을 튜닝할 수 있음을 증명.", "novelty": "질량 이방성(mass anisotropy) 스케일링 모델을 통해 WTe2의 다중 밴드 특성을 정량적으로 분석하고 물질 설계 전략을 제시함.", "unresolved": "도핑 농도가 높은 영역(x=0.1 이상)에서 단일 타원체 예측을 벗어나는 상세한 밴드 구조 변화의 기원.", "future_work": "Ta 도핑된 WTe2의 정밀한 ARPES 측정을 통한 페르미 표면 구조의 직접적인 변화 관측.", "concepts": [{"term": "거대 자기저항 (XMR)", "why_emerged": "외부 자기장에 따라 저항이 극적으로 변화하는 현상을 이해하고 응용하기 위해.", "origin": "Ali et al. (2014) 등이 WTe2에서 본격적으로 보고.", "connections": "전자-정공 보상, 위상 반금속, 이동도."}, {"term": "질량 이방성 (Mass Anisotropy)", "why_emerged": "밴드 구조의 방향 의존성을 정량화하기 위해.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "페르미 표면, 자기저항."}], "english_summary": ["Investigates the effect of Ta doping on magneto-transport in WTe2.", "Observes enhanced 2D character and magnetoresistance (up to ~58,211%) with Ta substitution.", "Identifies structural contraction along the c-axis as a driver for increased mass anisotropy.", "Validates multiband transport character via nonlinear Hall resistivity and mass anisotropy scaling breakdown."]}}, {"title": "Luttinger liquid parameters in one-dimensional Rydberg arrays", "journal": "arXiv_CondMat", "source": "keyword", "link": "https://arxiv.org/abs/2606.16128", "authors": "Shu-Ao Liao, Li-Ping Yang, Jin Zhang", "last_authors": "Li-Ping Yang, Jin Zhang", "summary": "arXiv:2606.16128v1 Announce Type: new Abstract: We investigate Berezinskii-Kosterlitz-Thouless (BKT) transitions in one-dimensional Rydberg chains, where commensurate critical regimes associated with the melting of crystalline orders with period larger than five and incommensurate floating phases are both described by Luttinger liquid theory. The central quantity is the Luttinger liquid parameter $K$, which characterizes the universal low-energy theory and controls the relevance of perturbations driving BKT transitions. We extract $K$ using Friedel oscillations and the recently developed crosscap method introduced in Phys. Rev. Lett. 134, 076501 (2025). As benchmarks, we first apply the crosscap method to a $\\mathbb{Z}_3$ dual hard-core boson chain and a spin-1 XY chain with single-ion anisotropy, obtaining BKT transition points consistent with previous results after finite-size extrapolation. We then compute $K$ in the Rydberg chain along lines with fixed correlation-oscillation period near BKT transitions. Along the commensurate period-five line, the critical values of $K$ predicted by sine-Gordon theory reveal two BKT transitions separating the disordered phase, the critical phase, and the $\\mathbb{Z}_5$ crystalline phase. The results from Friedel oscillations and the crosscap method agree with each other and are further supported by energy-gap scaling and Binder-cumulant analysis. To obtain reliable values of $K$ from Friedel oscillations, we use a multi-harmonic fitting scheme throughout the analysis. Along incommensurate lines, the BKT points obtained from Friedel oscillations agree with those extracted from entanglement entropy. Finally, we show that the values of $K$ obtained from the two methods are mutually consistent inside the incommensurate floating phase.", "tier": "A_MUST_READ", "score": "9", "reason": "title strong match: Luttinger liquid", "tags": ["Luttinger"], "image": "https://arxiv.org/html/2606.16128v1/x1.png", "briefing": {"background": "1차원 양자 다체계에서 저에너지 물성은 일반적으로 Luttinger 액체 이론으로 기술됩니다. Rydberg 원자 배열은 격자 상수나 상호작용을 정밀하게 제어할 수 있어 이 이론을 검증하는 이상적인 플랫폼을 제공합니다.", "motivation": "Rydberg 원자 체인 내에서 나타나는 BKT 전이와 얽힌 결정상(crystalline phase) 및 유동상(floating phase) 간의 전이 과정에서 Luttinger 액체 매개변수 K의 역할을 정량적으로 분석하고자 함.", "result": "새로운 'crosscap method'와 Friedel 진동 분석을 통해 Rydberg 체인의 고차 고조파를 포함한 Luttinger 매개변수 K를 정확히 추출하였으며, 두 방법이 이론적 BKT 전이 지점과 일치함을 확인.", "implication": "다양한 격자 주기성을 가진 시스템에서 범용적인 Luttinger 매개변수 추출이 가능함을 입증하여 1차원 강상관 전자계 연구의 분석 도구를 고도화함.", "novelty": "최근 제안된 crosscap method를 Rydberg 배열에 적용하여 이론적 sine-Gordon 모델과 실험/수치 데이터 간의 정합성을 검증함.", "unresolved": "매우 긴 주기성을 가진 결정상에서의 고차 상호작용이 K 값의 미세한 편차에 미치는 영향은 여전히 논의의 여지가 있음.", "future_work": "더 긴 사슬에서의 유한 크기 효과 연구 및 2차원 Rydberg 시스템으로의 확장.", "concepts": [{"term": "Luttinger liquid", "why_emerged": "1차원 시스템에서는 페르미 액체 이론이 붕괴되어 스핀-전하 분리가 일어나기 때문에 도입됨.", "origin": "Haldane (1981)", "connections": "Tomonaga-Luttinger 모델, 스핀-전하 분리, 1D 도체."}, {"term": "BKT transition", "why_emerged": "2차원 및 1차원 시스템에서 위상학적 결함의 구속(binding)과 해리(unbinding)를 통한 상전이를 설명하기 위해 필요.", "origin": "Berezinskii, Kosterlitz, Thouless (1970년대)", "connections": "초유체성, 2D XY 모델, 위상학적 결함."}], "english_summary": ["Analyzes Luttinger liquid parameter K in 1D Rydberg atom arrays.", "Utilizes crosscap method and Friedel oscillations to map BKT transition points.", "Matches results with sine-Gordon theory and entanglement entropy.", "Validates a robust numerical framework for 1D quantum many-body systems."]}}, {"title": "Observation of momentum dependent charge density wave gap in EuTe4", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/n72p-lpt6", "authors": "Iftakhar Bin Elius, Nathan Valadez, Gyanendra Dhakal, et al.", "last_authors": "Dariusz Kaczorowski, Madhab Neupane", "summary": "Author(s): Iftakhar Bin Elius, Nathan Valadez, Gyanendra Dhakal, Volodymyr Buturlim, Sabin Regmi, Dante James, Peter Radanovich, Keng Tou Chu, Ellis Thompson, Matthew Yankowitz, Tetiana Romanova, Andrzej Ptok, Krzysztof Gofryk, Dariusz Kaczorowski, and Madhab Neupane Charge density wave (CDW) phenomena in low-dimensional rare-earth chalcogenides have drawn considerable interest owing to their interplay with lattic re, we perform a targeted search for the $Pn2_{1}a$ phase using synchrotron X-ray diffraction on single crystals of Ca$_{3}$Ru$_{2}$O$_{7}$ and Ca$_{3}$(Ru$_{0.99}$Ti$_{0.01}$)$_{2}$O$_{7}$. No diffraction signature of the $Pn2_{1}a$ structure is detected down to 20 K within experimental limits of $\\sim$60-200 fm atomic displacements, significantly smaller than the DFT prediction of $\\sim$1 pm. Combined with recent nonlinear transport measurements, our structural study suggests Ca$_{3}$Ru$_{2}$O$_{7}$ as a unique system where strong electron correlations drive an electronic phase transition without any measurable lattice symmetry change. With Ti substitution exceeding $\\sim$3%, a chemically tunable altermagnetic phase with $Bb2_{1}m$ structure emerges. The study highlights the importance of sub-picometer metrology towards de-convolving structural versus electronic origins of altermagnets.", "tier": "B_IMPORTANT_CONDMAT", "score": "9", "reason": "High-quality structural study on an altermagnet candidate with direct relevance to electronic structure.", "tags": ["altermagnet", "X-ray", "electronic-structure"], "image": "https://arxiv.org/html/2606.16181v1/x1.png", "briefing": {"background": "Altermagnetism은 순자화가 0이면서도 전자 밴드 구조가 스핀 분할되는 새로운 자기 질서 유형으로, 차세대 스핀트로닉스 재료로 주목받고 있습니다.", "motivation": "Ca3Ru2O7에서 DFT 계산으로 제안된 극성 알터자성 상태(Pn21a 구조)가 실제 실험적으로 확인될 수 있는지, 즉 격자 대칭성 파괴가 동반되는지를 검증하고자 했습니다.", "result": "20K까지의 저온 Synchrotron X-ray 회절 실험 결과, DFT에서 예측한 1pm 수준의 격자 왜곡은 관찰되지 않았습니다. 즉, Ca3Ru2O7의 알터자성은 격자 구조 변화 없이 전자 상관관계에 의해 유도되는 전자적 상전이일 가능성이 큽니다.", "implication": "알터자성 연구 시 격자 왜곡에 의존하는 모델을 재평가해야 하며, 전자 상관관계가 지배하는 순수한 전자적 위상 변화로서의 알터자성 가능성을 열어두어야 합니다.", "novelty": "서브 피코미터 수준의 정밀한 구조 분석을 통해 DFT 예측과 실험적 실제 사이의 간극을 명확히 함으로써 알터자성의 기원에 대한 본질적인 논쟁을 제시했습니다.", "unresolved": "Ti 치환 시 발생하는 알터자성의 물리적 메커니즘과 그 정확한 임계 농도에서의 전자 구조 변화가 완전히 규명되지 않았습니다.", "future_work": "Ti 도핑 농도에 따른 전자 구조의 변화를 ARPES 등으로 직접 측정하여 알터자성 밴드 분할을 관찰하는 실험이 필요합니다.", "concepts": [{"term": "Altermagnetism", "why_emerged": "기존 강자성/반강자성으로 분류되지 않는, 스핀 분할 밴드를 가지는 새로운 자기 질서의 필요성.", "origin": "초근접 이론적 제안(예: Jungwirth 그룹), 2020년대 초반.", "connections": "반강자성, 스핀트로닉스, 비상반적 수송 현상."}, {"term": "Bb21m / Pn21a", "why_emerged": "결정 구조의 공간군 대칭성을 기술하여 물리적 성질(극성 여부 등)을 분류하기 위함.", "origin": "결정학 분야의 표준 분류법.", "connections": "구조적 위상 전이, 알터자성 대칭성 분석."}, {"term": "Sub-picometer metrology", "why_emerged": "DFT에서 예측하는 미세한 격자 변화를 검증하기 위한 초정밀 X-ray 분석 기법.", "origin": "고해상도 싱크로트론 X-선 회절 실험 기술.", "connections": "구조-물성 관계 연구."}], "english_summary": ["Ca3Ru2O7 is studied as a candidate for polar altermagnetism.", "High-resolution X-ray diffraction finds no evidence of the predicted structural transition to Pn21a symmetry.", "The results imply the altermagnetic state in this system is driven by electron correlation without lattice symmetry changes.", "Ti substitution triggers a chemically tunable altermagnetic phase, highlighting a complex phase landscape."]}}, {"title": "In-Plane Anisotropy-Driven Directional Charge Transport in van der Waals p-n Heterojunction (Nanoscale)", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2405.14817", "authors": "Rahul Paramanik, Tanima Kundu, Soumik Das, et al.", "last_authors": "Sanjoy Kr Mahatha, Subhadeep Datta", "summary": "arXiv:2405.14817v2 Announce Type: replace Abstract: Low-symmetry two-dimensional (2D) van der Waals (vdW) materials enable anisotropic charge transport, crucial for polarization-sensitive optoelectronics. In this study, a $p$-GeS/$n$-MoS$_2$ heterostructure diode is investigated, where the anisotropic band dispersion of GeS, revealed by angle-resolved photoemission spectroscopy (ARPES), governs directional charge flow. Angle-resolved Raman spectroscopy confirms the crystallographic orientation, and transport measurements in GeS field-effect transistors (FETs) show a mobility anisotropy of $\\sim 3.4$. The heterojunction exhibits orientation-dependent diode characteristics, anti-ambipolar transport, and a type-II band alignment, leading to anisotropic optoelectronic response. These findings establish a pathway for utilizing electronic anisotropy in vdW heterostructures for energy-efficient rectification.", "tier": "B_IMPORTANT_CONDMAT", "score": "9", "reason": "Direct ARPES study of anisotropic band dispersion in a vdW heterostructure.", "tags": ["ARPES", "vanderWaals", "transport"], "image": "https://arxiv.org/html/2405.14817v2/x1.png", "briefing": {"background": "반데르발스(vdW) 이종접합 소자는 두 2D 물질 간의 밴드 정렬을 통해 에너지 효율적인 전자 및 광전 소자를 구현하는 차세대 플랫폼입니다.", "motivation": "2D 물질인 GeS의 비등방성 밴드 구조가 vdW 이종접합(p-GeS/n-MoS2) 내의 전하 수송 방향성에 어떻게 기여하는지 ARPES와 전기적 측정을 통해 규명하고자 했습니다.", "result": "ARPES로 관찰된 GeS의 이등방적 밴드 분산이 해당 이종접합의 이방성 전하 수송을 유도함을 확인했습니다. 이 소자는 방향성 다이오드 특성과 anti-ambipolar 거동을 보였습니다.", "implication": "vdW 이종접합에서 밴드 구조의 비등방성을 제어함으로써 편광 민감형 광검출기나 효율적인 정류 소자 설계가 가능함을 시사합니다.", "novelty": "ARPES로 밴드 구조의 비등방성을 직접 확인하고 이를 실제 소자의 수송 특성과 직접적으로 연결한 점이 중요합니다.", "unresolved": "이종접합 계면에서의 국부적인 전하 이동이나 격자 부정합(lattice mismatch)이 밴드 비등방성에 미치는 정밀한 영향은 아직 규명 과제입니다.", "future_work": "다른 비등방성 2D 물질 조합을 이용한 소자 성능 최적화 및 광학적 응답에 대한 추가 연구가 필요합니다.", "concepts": [{"term": "ARPES", "why_emerged": "물질의 에너지-운동량 분산 관계를 직접적으로 관측하기 위한 도구.", "origin": "광전효과에 기반한 20세기 중반 실험 기술.", "connections": "Fermi 표면 분석, 위상 물질 연구."}, {"term": "vanderWaals Heterostructure", "why_emerged": "격자 불일치 부담 없이 서로 다른 2D 물질을 적층하여 신물성 창출.", "origin": "Geim, Novoselov (2010년대).", "connections": "모아레 격자, 2D 전자계."}, {"term": "Anti-ambipolar transport", "why_emerged": "전압에 따라 전도성이 증가하다가 다시 감소하는 비정상적인 전송 현상.", "origin": "vdW 이종접합 기반 소자 연구.", "connections": "p-n 접합 정류 작용."}], "english_summary": ["p-GeS/n-MoS2 vdW heterojunction shows anisotropic charge transport.", "ARPES measurements confirm the anisotropic band dispersion of GeS as the origin of directional flow.", "The heterojunction exhibits orientation-dependent diode behavior and anti-ambipolar transport.", "These results demonstrate the potential for utilizing electronic anisotropy in high-efficiency optoelectronics."]}}, {"title": "Nonlinear opto-magnetic signature of d-wave altermagnets (Phys. Rev. Lett.)", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2509.08254", "authors": "Lijun Yang, Long Liang", "last_authors": "Lijun Yang, Long Liang", "summary": "arXiv:2509.08254v3 Announce Type: replace Abstract: Altermagnetism, a recently discovered collinear magnetic order with net zero magnetization but exhibiting spin-splitting band structure, has attracted much research interest due to the rich fundamental physics and possible applications. In this work, we investigate the opto-magnetic response of $d$-wave altermagnets, focusing on the inverse Cotton-Mouton effect--the induction of static magnetization via linearly polarized light. We find that the direction of the induced magnetization is determined by the N\\'eel vector. Moreover, its magnitude exhibits a periodic dependence on the polarization angle of the incident light, a hallmark of the system's symmetry. Our findings demonstrate that the inverse Cotton-Mouton effect offers a direct method both for detecting $d$-wave altermagnets and for probing their intrinsic properties.", "tier": "B_IMPORTANT_CONDMAT", "score": "9", "reason": "Directly relevant to user interest in altermagnetism and opto-magnetic probes.", "tags": ["altermagnet", "magnetism"], "image": "https://arxiv.org/html/2509.08254v3/x1.png", "briefing": {"background": "알터자성은 스핀 분할 밴드를 가지면서도 자화가 상쇄되어 외부 자기장에 둔감하지만, 광학적 방법으로는 그 숨겨진 위상을 탐지할 수 있는 가능성이 있습니다.", "motivation": "d-wave 알터자성의 독특한 대칭성을 활용하여, 빛을 통해 정적인 자화를 유도하는 '역 Cotton-Mouton 효과'의 응답 특성을 이론적으로 규명하고자 했습니다.", "result": "d-wave 알터자성에서 입사광의 편광 방향에 따라 유도되는 자화가 결정되며, 그 크기가 편광각에 주기적으로 반응함을 밝혔습니다. 이는 알터자성을 검출하는 새로운 광학적 방법이 될 수 있습니다.", "implication": "자성 정렬을 직접 측정하기 어려운 알터자성 물질에서 광학적 비선형 응답을 통해 Neel 벡터의 배향과 대칭성을 진단할 수 있습니다.", "novelty": "알터자성의 고유한 대칭성을 비선형 광학 응답(역 Cotton-Mouton 효과)과 연결하여 실험적 탐지 수단을 제시한 점이 매우 고무적입니다.", "unresolved": "실제 실험에서 이러한 매우 작은 비선형 신호를 배경 잡음과 구별하여 감지할 수 있을지에 대한 실험적 난이도가 남아있습니다.", "future_work": "구체적인 알터자성 후보 물질(예: RuO2 등)에 대한 초고속 광학 측정 실험이 뒤따라야 합니다.", "concepts": [{"term": "Inverse Cotton-Mouton effect", "why_emerged": "광학적 여기를 통해 물질 내에 자기적 질서를 유도하거나 제어하기 위함.", "origin": "비선형 광학 연구.", "connections": "자기광학 효과, 초고속 자성 제어."}, {"term": "d-wave Altermagnet", "why_emerged": "알터자성 중 스핀 분할 구조가 d-wave 대칭성을 띠는 경우.", "origin": "최근 알터자성 이론 분류 연구.", "connections": "Neel 벡터, 스핀-궤도 결합."}, {"term": "Neel vector", "why_emerged": "반강자성질서에서 각 부격자의 자화 방향을 정의하는 벡터.", "origin": "반강자성 이론 초기.", "connections": "자기 이방성, 알터자성 대칭성."}], "english_summary": ["The paper investigates the opto-magnetic response of d-wave altermagnets.", "It shows that the inverse Cotton-Mouton effect can induce static magnetization via polarized light.", "The induced magnetization depends on the Neel vector and the incident light's polarization angle.", "This optical signature offers a new, direct method for identifying and probing d-wave altermagnets."]}}, {"title": "Stabilizing Itinerant Electrons in a Corner-Sharing Kagom\\'e Oxide Nd4Os3ZnO14", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2606.15774", "authors": "Ryutaro Okuma, Yuita Fujisawa, Chia-Hsiu Hsu, et al.", "last_authors": "Jun-ichi Yamaura, Yoshihiko Okamoto", "summary": "arXiv:2606.15774v1 Announce Type: new Abstract: Kagome oxides provide a fertile platform for exploring exotic electronic states arising from geometrical frustration and characteristic band topology. Here, we report the synthesis of a 5d transition-metal kagome oxide, Nd4Os3ZnO14, obtained via high-temperature, high-pressure hydrothermal synthesis. Single-crystal X-ray diffraction reveals a two-dimensional kagome network formed by corner-sharing OsO6 octahedra, with a nominal osmium valence of +4.67. In-plane resistivity and hard X-ray photoelectron spectroscopy measurements indicate that the semimetallic electronic structure at room temperature evolves into a semiconducting ground s , "link": "https://www.nature.com/articles/s41567-026-03298-0", "authors": "Federico Mazza, Sounak Biswas, Xinlin Yan, et al.", "last_authors": "Fakher F. Assaad, Silke Paschen", "summary": "Nature Physics, Published online: 15 June 2026; doi:10.1038/s41567-026-03298-0 A strange metal is a strongly correlated quantum state that occurs in many different materials. Now, quantum Fisher information is shown to increase as the strange metal forms, indicating that the state has high multipartite entanglement.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Research on strange metals and entanglement, a key topic in strongly correlated electron systems.", "tags": ["stronglycorrelated", "strangemetal", "quantumentanglement", "theory"], "image": "https://media.springernature.com/m685/springer-static/image/art%3A10.1038%2Fs41567-026-03298-0/MediaObjects/41567_2026_3298_Fig1_HTML.png", "briefing": {"background": "이상 금속(strange metal) 상태는 란다우 페르미 액체 이론을 따르지 않는 강상관계 물질의 상으로, 고온 초전도체 등에서 공통적으로 나타나는 난제입니다.", "motivation": "이상 금속 상태가 나타날 때 전자들 사이의 양자 얽힘이 어떤 역할을 하는지, 그리고 이를 어떻게 정량화할 수 있는지 확인하고자 했습니다.", "result": "이상 금속이 형성되는 과정에서 양자 피셔 정보(Quantum Fisher Information, QFI)가 증가하며, 이는 상태 내부에 높은 다체 얽힘이 존재함을 증명합니다.", "implication": "이상 금속의 본질이 단순한 준입자 물리학을 넘어 강한 양자 다체 얽힘 상태임을 시사하며, 양자 정보 이론을 응집 물질 물리학에 성공적으로 적용한 사례입니다.", "novelty": "이상 금속의 물성을 양자 정보 이론적 도구인 QFI를 통해 입증했다는 점이 이론적으로 매우 신선합니다.", "unresolved": "QFI의 증가가 이상 금속의 모든 특성(예: 비정상적인 저항률 거동)을 완벽하게 설명하는지에 대해서는 논의가 필요합니다.", "future_work": "다양한 강상관계 물질군에서 QFI를 측정하거나 계산하여 이상 금속 상태와의 보편적 연결성을 검증해야 합니다.", "concepts": [{"term": "Quantum Fisher Information", "why_emerged": "양자 상태의 민감도와 얽힘의 정도를 정량적으로 평가하기 위해 정보 이론에서 도입됨.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "양자 다체 얽힘, 위상 양자 상전이 연구에 필수적임."}, {"term": "Strange Metal", "why_emerged": "저항이 온도에 비례하는(T-linear) 등 기존 금속 이론으로 설명되지 않는 특이 물성을 설명하기 위해 필요.", "origin": "고온 초전도체 연구 중 큐프레이트에서 관측됨.", "connections": "플랑크 산란, 양자 임계점, 비-페르미 액체 물성."}], "english_summary": ["Strange metals repre       item.className = 'concept';
      item.appendChild(textEl('h3', '', c.term || 'Concept'));
      [['왜 생겼나: ', c.why_emerged], ['누가 만들었나: ', c.origin], ['연결되는 흐름: ', c.connections]].forEach(([label, text]) => { if (!text) return; const p = document.createElement('p'); const bold = textEl('b', '', label); p.appendChild(bold); p.append(text); item.appendChild(p); });
      concepts.appendChild(item);
    });
    section.appendChild(concepts);
    briefing.appendChild(section);
  }
  if (b.english_summary && b.english_summary.length) { const section = document.createElement('section'); section.className = 'brief-section wide'; section.appendChild(textEl('h2', '', 'English Summary')); const ul = document.createElement('ul'); b.english_summary.slice(0, 5).forEach(line => ul.appendChild(textEl('li', '', line))); section.appendChild(ul); briefing.appendChild(section); }
  slideEl.appendChild(briefing);
  counterEl.textContent = `${index + 1} / ${slides.length}`;
  prevBtn.disabled = index === 0;
  nextBtn.disabled = index === slides.length - 1;
}
prevBtn.addEventListener('click', () => { index = Math.max(0, index - 1); render(); });
nextBtn.addEventListener('click', () => { index = Math.min(slides.length - 1, index + 1); render(); });
document.addEventListener('keydown', event => { if (event.key === 'ArrowLeft') prevBtn.click(); if (event.key === 'ArrowRight') nextBtn.click(); });
render();
</script>
</body>
</html>
