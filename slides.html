수 바이레이어 구조인 Co3Sn은 벌크 합성이 어려워 연구가 제한적이었습니다.", "motivation": "분자선 적층 성장(MBE) 방식을 통해 고품질의 Co3Sn 박막을 성장시키고, 이 물질의 자기적 특성과 위상학적 수송 특성을 규명하고자 했습니다.", "result": "MBE를 통해 직접적인 A-B 쌓임 구조를 가진 Co3Sn 카고메 바이레이어 박막 합성에 성공했습니다. 이 물질은 상온(300K) 이상의 큐리 온도를 갖는 강자성체이며, 온도에 무관하게 일정한 변칙적 홀 전도도(약 90 Ohm^-1 cm^-1)를 나타냄을 확인했습니다. DFT 계산을 통해 이것이 페르미 준위 근처의 베리 곡률 핫스팟에 의한 본질적(intrinsic) 효과임을 밝혔습니다.", "implication": "상온에서 작동하는 새로운 카고메 강자성 플랫폼을 확보했으며, 층 쌓임 방식에 따라 카고메 금속의 위상 물성을 설계할 수 있음을 시사합니다.", "novelty": "그동안 합성이 어려웠던 Co3Sn을 박막 형태로 처음 구현하여 상온 강자성 및 본질적 AHE를 입증했습니다. 독자의 관심사인 카고메 금속과 AHE 연구에 중요한 재료적 진전입니다.", "unresolved": "박막의 두께나 기판과의 격자 부정합이 위상 밴드 구조와 AHE 강도에 미치는 세부적인 영향에 대한 추가 연구가 필요합니다.", "future_work": "성장된 Co3Sn 박막을 이용한 ARPES 측정으로 실제 밴드 구조를 확인하고, 다른 2D 물질과의 이종 접합을 통한 위상 소자 연구가 진행될 것으로 보입니다.", "concepts": [{"term": "Co3Sn (Kagome metal)", "why_emerged": "CoSn 계열 물질 중 바이레이어 적층 구조를 가진 새로운 위상 자성체를 탐색하는 과정에서 주목받았습니다.", "origin": "초록 정보만으로는 특정하기 어려움 (본 연구에서 MBE 성장 성공)", "connections": "CoSn, Co3Sn2S2, FeSn"}, {"term": "Molecular beam epitaxy (MBE)", "why_emerged": "원자 단위로 층을 쌓아 벌크로는 존재하기 어려운 준안정 상태의 고품질 단결정 박막을 얻기 위해 사용됩니다.", "origin": "J. R. Arthur and Alfred Y. Cho (1960년대 후반)", "connections": "Thin film growth, Heterostructures"}, {"term": "Intrinsic anomalous Hall conductivity", "why_emerged": "불순물 산란과 관계없이 물질 고유의 전자 밴드 위상(베리 곡률)에 의해 발생하는 홀 효과를 정의하기 위함입니다.", "origin": "Karplus and Luttinger (1954)", "connections": "Berry curvature, Topological band theory"}, {"term": "Berry curvature hotspots", "why_emerged": "밴드 교차점이나 좁은 갭 영역에서 베리 곡률이 국소적으로 매우 크게 집중되어 물리량에 큰 기여를 하는 지점을 설명하기 위함입니다.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "Weyl nodes, Spin-split bands"}], "english_summary": ["Successful MBE growth of high-quality bilayer kagome ferromagnet Co3Sn thin films.", "Discovery of room-temperature ferromagnetism (Tc > 300K) and temperature-independent intrinsic AHE.", "DFT calculations confirm the AHE originates from Berry curvature hotspots near the Fermi level.", "Establishes Co3Sn as a robust platform for investigating room-temperature topological physics in kagome metals."]}}, {"title": "Modulation of charge density waves in a twisted vortex moire superlattice (Nano Letters)", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2605.26510", "authors": "Qian Fang, Yanhao Shi, Jingyi Duan, et al.", "last_authors": "Hui Chen, Hong-Jun Gao", "summary": "Twisted moire superlattices in van-der-Waals heterostructures provide a powerful platform for engineering correlated states through moire-band reconstruction. However, whether globally coherent electronic orders can be continuously manipulated at the nanoscale remains largely unexplored. Reconstructed moire structures in small-angle and near-commensurate regime feature continuously varying local environments, offering new opportunities for nanoscale manipulation of correlated phases. Here, we report the modulation of charge density wave (CDW) states in a twisted vortex moire superlattice formed between monolayer VTe2 and superconducting NbSe2. Scanning tunneling microscopy/spectroscopy reveals that the intrinsic long-range CDW of monolayer VTe2 is reconstructed into inequivalent local phases with distinct stability and coherence within a single moire unit cell, including suppressed CDW order and enhanced short-range CDW correlations persisting to room temperature. First-principles calculations show that the reconstructed CDW landscape originates from strong local strain variation, where compressive strain substantially stabilizes the charge order. Furthermore, the modulated CDW states exhibit competing interplay with proximity-induced superconductivity. Our results establish vortex moire superlattices as a versatile platform for nanoscale manipulation of correlated electronic orders in low-dimensional quantum materials.", "tier": "B_IMPORTANT_CONDMAT", "score": "9", "reason": "STM study of CDW manipulation in VTe2/NbSe2 moire heterostructure.; demoted from A: broad CM, not direct user/project hit", "tags": ["STM", "CDW", "moire", "heterostructure"], "image": "https://arxiv.org/static/browse/0.3.4/images/arxiv-logo-fb.png", "briefing": {"background": "반데르발스 이종접합 구조에서 발생하는 무아레(Moiré) 초격자는 전자 밴드 구조를 재구성하여 상관된 전자 상태(Correlated states)를 제어하는 강력한 플랫폼으로 자리 잡았습니다. 특히 전하 밀도 파동(CDW)과 같은 양자 질서가 나노 스케일에서 어떻게 변조되는지를 이해하는 것이 이 분야의 핵심 과제 중 하나입니다.", "motivation": "본 연구는 단층 VTe2와 초전도체인 NbSe2를 접합하여 형성된 'Twisted vortex moiré superlattice'에서 CDW 상태가 나노 수준에서 어떻게 공간적으로 조절되는지, 그리고 초전도성과 어떤 상호작용을 하는지 규명하고자 했습니다.", "result": "STM/STS 측정 결과, VTe2 고유의 장거리 CDW가 무아레 단위 격자 내에서 국부적인 변형(strain)에 의해 서로 다른 위상으로 재구성됨을 확인했습니다. 특정 영역에서는 CDW가 억제되는 반면, 다른 영역에서는 실온까지 유지되는 강한 단거리 CDW 상관관계가 나타났습니다. 또한, 이러한 CDW의 변조가 NbSe2로부터 유도된 근접 초전도성(proximity-induced superconductivity)과 경쟁적 관계에 있음을 보여주었습니다.", "implication": "무아레 초격자의 국부적인 변형 에너지를 이용하면 CDW와 초전도 같은 물리적 상태를 나노미터 규모에서 정밀하게 설계하고 조절할 수 있음을 시사합니다.", "novelty": "단순한 무아레 패턴을 넘어 'vortex' 형태의 변형 지형을 이용해 CDW의 안정성과 초전도성을 동시에 조절했다는 점이 혁신적입니다. 독자의 관심사인 STM 연구와 CDW/초전도 경쟁 시스템(AV3Sb5와 유사한 맥락)을 직접적으로 다루고 있습니다.", "unresolved": "초록 정보만으로는 CDW와 초전도성 사이의 정량적인 위상 다이어그램이나 다른 전이 금속 디칼코게나이드(TMD) 조합으로의 범용성 확인이 더 필요해 보입니다.", "future_work": "다른 비틀림 각도에서의 위상 변화 관찰이나, 외부 변형(strain) 장치를 통한 동적인 CDW-초전도성 제어 실험이 예상됩니다.", "concepts": [{"term": "Moiré superlattice", "why_emerged": "두 층의 격자 상수가 다르거나 비틀렸을 때 발생하는 거시적 간섭 무늬를 통해 전자의 운동 에너지를 억제하고 상관 관계를 극대화하기 위해 도입되었습니다.", "origin": "초록 정보만으로는 특정하기 어려우나, 그래핀/BN 이종접합 및 마법각 그래핀 연구를 통해 대중화되었습니다.", "connections": "Flat bands, Mott insulator, Unconventional superconductivity"}, {"term": "Charge Density Wave (CDW)", "why_emerged": "저차원 금속 시스템에서 전자-포논 상호작용이나 페르미 면 중첩(nesting)으로 인해 전하 밀도가 주기적으로 변조되는 현상을 설명하기 위해 등장했습니다.", "origin": "Rudolf Peierls (Peierls instability)", "connections": "NbSe2, VTe2, AV3Sb5 kagome metals"}, {"term": "Proximity-induced superconductivity", "why_emerged": "초전도체가 아닌 물질이 초전도체와 접촉했을 때 쿠퍼 쌍이 스며들어 초전도성을 띠게 되는 현상을 이용해 새로운 양자 상태를 만들기 위해 연구되었습니다.", "origin": "초록 정보만으로는 특정하기 어려움 (안드레예프 반사 관련 초기 연구)", "connections": "Majorana bound states, Topological superconductivity"}, {"term": "Local strain variation", "why_emerged": "무아레 구조의 원자 재배열(reconstruction) 과정에서 발생하는 국부적인 응력이 전자 구조에 미치는 영향을 설명하기 위해 중요해졌습니다.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "Strain engineering, Bandgap tuning"}], "english_summary": ["Demonstrated nanoscale modulation of CDW in VTe2/NbSe2 twisted vortex moiré superlattices using STM.", "Identified local strain variation as the primary driver for creating inequivalent CDW phases within a single moiré cell.", "Observed a competitive interplay between the modulated CDW states and proximity-induced superconductivity.", "Established moiré strain engineering as a tool for manipulating correlated electronic orders in 2D heterostructures."]}}, {"title": "Momentum-resolved EELS study of collective charge excitations in 1T-TaS2", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2608.23492", "authors": "Farzaneh Hoveyda-Marashi (Department of Physics, University of Illinois, Materials Research Laboratory, et al.", "last_authors": "Dipanjan Chaudhuri (Department of Physics, Peter Abbamonte (Department of Physics", "summary": "We use momentum-resolved electron energy-loss spectroscopy (M-EELS) to study the low-energy charge excitations of 1$T$-TaS$_2$ across the nearly commensurate-to-commensurate charge-density-wave (CDW) transition. Single-crystal x-ray diffraction and elastic M-EELS measurements confirm the expected rotation of the CDW wave vector upon entering the commensurate phase. In the nearly commensurate phase, the low-energy M-EELS spectra reveal an acoustic phonon branch and two optical phonon features whose energies and dispersions are broadly consistent with previous calculations and inelastic x-ray measurements. Across the transition, the optical phonon energies remain nearly unchanged, while their spectral intensity develops a pronounced temperature dependence near the CDW ordering wave vector. At higher energies, the finite-momentum charge response undergoes a substantial redistribution of spectral weight below the transition, consistent with the opening of an energy gap. These results demonstrate that M-EELS provides simultaneous access to lattice dynamics and finite-momentum valence band charge excitations in 1$T$-TaS$_2$, revealing their evolution across the commensurate CDW transition.", "tier": "B_IMPORTANT_CONDMAT", "score": "9", "reason": "Experimental study of CDW and charge excitations using momentum-resolved spectroscopy.", "tags": ["CDW", "spectroscopy", "excitation"], "image": "https://arxiv.org/html/2608.23492v2/Figures/XRD-annotated2.png", "briefing": {"background": "1T-TaS2는 전하 밀도 파동(CDW)과 모트 절연체(Mott insulator) 상태가 복잡하게 얽혀 있는 대표적인 강상관 물질입니다. 특히 거의 정합(NC) 상태에서 정합(C) 상태로 변하는 상전이 과정에서의 전하 여기(charge excitations)와 격자 역학의 변화를 이해하는 것이 중요합니다.", "motivation": "기존의 분광법으로는 운동량 분해능을 가지고 낮은 에너지 영역의 집단적 전하 여기와 격자 진동을 동시에 관찰하는 데 한계가 있었습니다. 이를 극복하기 위해 M-EELS를 사용하여 1T-TaS2의 상전이 과정을 조사했습니다.", "result": "M-EELS를 통해 NC-CDW에서 C-CDW로 전이될 때의 변화를 관측했습니다. 광학 포논(optical phonon)의 에너지는 거의 변하지 않지만, CDW 정렬 벡터(wave vector) 근처에서 그 강도가 강한 온도 의존성을 보임을 확인했습니다. 또한 상전이 시 고에너지 영역에서 전하 응답의 스펙트럼 가중치(spectral weight)가 재분배되며 에너지 갭이 형성되는 과정을 포착했습니다.", "implication": "1T-TaS2의 상전이가 단순히 격자 구조의 변화뿐만 아니라 전자적 스펙트럼의 급격한 재구성을 동반함을 정밀하게 입증했습니다. M-EELS가 격자와 전자의 상호작용을 연구하는 데 강력한 도구임을 보여줍니다.", "novelty": "운동량 분해 전자 에너지 손실 분광법(M-EELS)을 사용하여 1T-TaS2의 집단 여기를 나노미터 수준의 역격자 공간에서 직접 측정했다는 점이 돋보입니다. 독자의 관심사인 CDW 및 상관계 물리와 밀접합니다.", "unresolved": "실험 결과가 기존의 이론적 계산 및 비탄성 X선 산란(IXS) 결과와 대체로 일치하지만, 광학 포논의 강도 변화에 대한 구체적인 미시적 메커니즘은 더 깊은 분석이 필요할 수 있습니다.", "future_work": "더 낮은 에너지 영역에서의 골드스톤 모드(Goldstone modes) 관측이나, 외부 섭동(압력, 광 여기)에 의한 여기 상태의 변화 연구가 뒤따를 수 있습니다.", "concepts": [{"term": "M-EELS", "why_emerged": "중성자 산란이나 X선 산란보다 낮은 에너지 영역의 전하 밀도 요동을 운동량 분해능을 가지고 측정하기 위해 개발되었습니다.", "origin": "Peter Abbamonte (M-EELS 기술의 현대적 정립)", "connections": "Inelastic X-ray scattering (IXS), Plasmons, Phonons"}, {"term": "1T-TaS2", "why_emerged": "2차원 물질 중 CDW, Mott 절연체, 초전도성 등 다양한 양자상이 공존하여 다체 물리 연구의 표준 물질로 선택되었습니다.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "Star of David reconstruction, Mott transition"}, {"term": "Commensurate CDW", "why_emerged": "CDW의 주기가 격자 주기와 정수비를 이룰 때 발생하는 강한 고정(pinning) 효과와 에너지 갭 형성을 설명하기 위해 정의되었습니다.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "Lock-in transition, Nearly commensurate (NC) phase"}, {"term": "Spectral weight redistribution", "why_emerged": "상전이나 갭 형성 과정에서 전자들이 차지하는 에너지-운동량 상태의 밀도가 어떻게 변하는지 설명하기 위한 개념입니다.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "Sum rules, Optical conductivity, ARPES"}], "english_summary": ["Used momentum-resolved EELS (M-EELS) to study charge excitations in 1T-TaS2 across the NC-to-C CDW transition.", "Observed stable optical phonon energies but significant temperature-dependent intensity changes at the CDW wave vector.", "Detected a redistribution of spectral weight at higher energies, consistent with the opening of a charge gap in the C-CDW phase.", "Demonstrated M-EELS as an effective probe for simultaneous lattice dynamics and valence band excitations."]}}, {"title": "Observation of dodecagonal replica bands in 30-twisted bilayer WSe2", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2608.26864", "authors": "Christian Valentiner-Branth Fokdal, Chakradhar Sahoo, Thomas S. Nielsen, et al.", "last_authors": "Marcin Mucha-Kruczy\\'nski, S{\\o}ren Ulstrup", "summary": "Twisted bilayers of two-dimensional (2D) transition metal dichalcogenides are promising systems for achieving tunable quasicrystalline orders with emergent properties. The underpinning electronic structure and scattering processes in 2D quasicrystals with multiorbital dodecagonal replica bands have so far not been determined. Here, we utilize angle-resolved photoemission spectroscopy (ARPES) with micrometer spatial resolution to directly observe replica bands in 30 ∘ -twisted bilayer WSe 2 \\text{WSe}{\\vphantom{\\text{X}}}_{\\smash[t]{\\text{2}}} . The symmetry and intensity distribution of the observed replicas are explained by interlayer Umklapp scattering from bottom to top WSe 2 \\text{WSe}{\\vphantom{\\text{X}}}_{\\smash[t]{\\text{2}}} layers. Our spectral function measurements are consistent with the presence of a van Hove singularity adjacent to the K \\mathrm{K} -valleys, which underlines the possibility of inducing electronic reconstructions in bilayers with a large interlayer twist angle.", "tier": "B_IMPORTANT_CONDMAT", "score": "9", "reason": "Experimental ARPES study of electronic structure in twisted bilayer WSe2, highly relevant.", "tags": ["ARPES", "twistedbilayer", "2Dmaterials", "electronicstructure", "TMDs"], "image": "https://arxiv.org/html/2608.26864v1/Fig1.png", "briefing": {"background": "이차원 전이 금속 디칼코게나이드(TMD)의 비틀린 이중층 구조는 무아레 무늬를 통해 독특한 전자 구조를 형성합니다. 특히 30도 비틀림 각도는 결정론적 준결정(Quasicrystal) 구조를 형성하여, 기존의 주기적 격자에서는 볼 수 없던 물성을 유도할 수 있습니다.", "motivation": "30도 비틀린 WSe2 이중층에서 나타나는 '십이각형(dodecagonal) 복제 밴드(replica bands)'와 그 산란 과정, 그리고 이에 따른 전자 구조의 재구성을 마이크로-ARPES를 통해 직접 관측하고자 했습니다.", "result": "ARPES 측정 결과, 두 층 사이의 층간 엄클랩 산란(interlayer Umklapp scattering)에 의해 발생하는 십이각형 대칭의 복제 밴드를 처음으로 직접 관찰했습니다. 또한 K-valley 근처에서 van Hove 특이점(vHs)이 존재함을 확인하였으며, 이는 큰 비틀림 각도에서도 전자 구조의 재구성이 일어날 수 있음을 시사합니다.", "implication": "30도 비틀린 TMD 시스템이 준결정 물리와 강상관 전자 물성을 연구할 수 있는 새로운 플랫폼임을 입증했습니다. 특히 vHs의 존재는 도핑 조절을 통한 새로운 양자 상의 발현 가능성을 열어줍니다.", "novelty": "30도라는 극한의 비틀림 각도에서 나타나는 복제 밴드를 ARPES로 직접 시각화했다는 점이 핵심입니다. 독자의 주된 관심사인 ARPES와 TMD 전자 구조 연구에 완벽히 부합합니다.", "unresolved": "이러한 준결정 상태에서 전자-전자 상호작용이 구체적으로 어떤 다체 물리 현상(예: 초전도, 자성)을 유도할 수 있는지에 대한 실험적 증거가 더 필요합니다.", "future_work": "게이팅을 통한 페르미 준위 조절로 vHs를 직접 탐사하거나, 준결정 격자에서의 수송 특성(transport) 연구가 기대됩니다.", "concepts": [{"term": "ARPES", "why_emerged": "물질 내부 전자의 에너지와 운동량을 직접 측정하여 페르미 면과 밴드 구조를 시각화하기 위해 개발되었습니다.", "origin": "초록 정보만으로는 특정하기 어려움 (광전효과 기반)", "connections": "Electronic structure, Fermi surface, CDW/SDW"}, {"term": "Replica bands", "why_emerged": "무아레 초격자나 층간 산란에 의해 원래의 밴드가 역격자 벡터만큼 이동하여 나타나는 부수적인 밴드를 설명하기 위해 등장했습니다.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "Moiré bands, Umklapp scattering"}, {"term": "van Hove singularity (vHs)", "why_emerged": "밴드 구조에서 상태 밀도(DOS)가 발산하는 지점으로, 여기서 페르미 준위가 위치할 때 다양한 불안정성과 상관 관계가 극대화됩니다.", "origin": "Léon van Hove", "connections": "Superconductivity, Magnetism, Density of states"}, {"term": "Interlayer Umklapp scattering", "why_emerged": "서로 다른 격자 구조를 가진 층 사이에서 전자가 운동량을 교환하며 발생하는 산란 과정을 설명하기 위해 필요합니다.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "Moiré potential, Momentum transfer"}], "english_summary": ["Directly observed dodecagonal replica bands in 30-degree twisted bilayer WSe2 using micro-ARPES.", "Explained the symmetry and intensity of replicas through interlayer Umklapp scattering between the layers.", "Identified a van Hove singularity (vHs) near the K-valleys, suggesting potential for correlated phases even at large twist angles.", "Highlighted the 30-degree twisted TMD as a platform for studying 2D quasicrystalline electronic structures."]}}, {"title": "Terahertz anomalous Hall effect in magnetic Weyl semimetal Co3Sn2S2", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2608.27195", "authors": "Ashutosh Singh, Hongjing Xu, Xielin Wang, et al.", "last_authors": "Junichiro Kono, Alexey Belyanin", "summary": "Time-reversal-symmetry-broken Weyl semimetals are known to have at least two nodes in their electronic band structure, separated in momentum space and acting as sources and sinks of Berry curvature. This gives rise to a transverse Hall conductivity, known as the anomalous Hall effect (AHE), which, in the simplest two-node picture, is proportional to the momentum-space separation between the nodes in the zero frequency limit. In the recently discovered Weyl semimetal $\\mathrm{Co_3Sn_2S_2}$, a giant AHE has been observed. However, experimental investigations in the low-energy regime, which directly probe quasiparticle excitations near the Weyl nodes, remain limited. Here, we present a systematic study of the intrinsic low-energy gyrotropic optical response of $\\mathrm{Co_3Sn_2S_2}$ using terahertz spectroscopy combined with semianalytical calculations based on a physically intuitive effective model. Our results provide a robust and transparent explanation of the observed magnetooptical phenomena in terms of intrinsic gyrotropy arising from momentum-space separation of the Weyl nodes. Furthermore, quantitative comparison between experiment and theory places stringent constraints on the material parameters.", "tier": "B_IMPORTANT_CONDMAT", "score": "9", "reason": "THz spectroscopy of magnetic Weyl nodes and Berry curvature in the kagome Weyl semimetal Co3Sn2S2.", "tags": ["material", "Weyl", "Berrycurvature", "anomalousHall", "spectroscopy"], "image": "https://arxiv.org/html/2608.27195v1/figure1.png", "briefing": {"background": "시간 역전 대칭성(Time-reversal symmetry)이 깨진 바일 반금속(Weyl semimetal)은 운동량 공간에서 베리 곡률(Berry curvature)의 원천과 소멸점 역할을 하는 바일 노드를 가집니다. 이러한 위상학적 구조는 외부 자기장 없이도 큰 가로 방향 전도도를 유발하는 이상 홀 효과(Anomalous Hall Effect, AHE)를 만들어내며, 이는 차세대 스핀트로닉스 및 저전력 소자 연구의 핵심입니다.", "motivation": "카고메 격자 구조를 가진 Co3Sn2S2는 거대한 이상 홀 효과를 보이는 대표적인 물질이지만, 바일 노드 근처의 준입자 여기(quasiparticle excitation)를 직접적으로 관찰할 수 있는 낮은 에너지 영역(THz)에서의 광학적 응답 연구는 그동안 부족했습니다.", "result": "테라헤르츠(THz) 분광법과 유효 모델 계산을 결합하여 Co3Sn2S2의 고유한(intrinsic) 자이로트로픽(gyrotropic) 광응답을 확인했습니다. 실험 결과는 바일 노드 사이의 운동량 공간 간격에 따른 베리 곡률의 기여로 투명하게 설명되며, 실험 데이터와 이론의 정량적 비교를 통해 해당 물질의 핵심 파라미터들을 엄격하게 제한하는 데 성공했습니다.", "implication": "바일 노드의 위치와 동역학적 응답 사이의 직접적인 상관관계를 규명함으로써, Co3Sn2S2와 같은 자기 위상 물질의 전자 구조를 THz 영역에서 정밀하게 제어하고 진단할 수 있는 기반을 마련했습니다.", "novelty": "독자의 주요 관심사인 카고메 금속 Co3Sn2S2를 대상으로 하며, 기존 DC 수송 특성 위주의 연구를 넘어 THz 주파수 대역의 동역학적 이상 홀 효과를 체계적으로 분석했다는 점이 핵심적인 차별점입니다.", "unresolved": "실험 조건에 따른 불순물 산란의 영향이나, 더 높은 주파수 대역으로 확장했을 때의 밴드 간 전이 기여도에 대한 추가적인 분리가 필요할 수 있습니다.", "future_work": "다른 자기 바일 반금속 시스템으로의 확장 연구와, 초고속 시분해 THz 분광법을 이용한 위상적 전하 운송의 동역학적 제어 시도  "reason": "Significant experimental progress in quantum Hall anyon physics in graphene.", "tags": ["experiment", "graphene", "quantumHall"], "image": "https://media.springernature.com/m685/springer-static/image/art%3A10.1038%2Fs41567-026-03428-8/MediaObjects/41567_2026_3428_Fig1_HTML.png", "briefing": {"background": "분수 양자 홀 효과(Fractional Quantum Hall Effect) 상태에서 나타나는 애니온(Anyon)은 전하의 일부분만을 가지는 기묘한 준입자로, 위상 양자 컴퓨터의 기본 단위로 주목받고 있습니다. 하지만 이들의 전하를 정밀하게 측정하고 가두는 것은 실험적으로 매우 어려운 과제입니다.", "motivation": "그래핀은 높은 이동도와 게이트 조절 가능성 덕분에 양자 홀 상태 연구에 적합하지만, 애니온의 전하를 직접 측정하는 실험적 구현은 여전히 도전적인 분야입니다.", "result": "이중층 그래핀(Bilayer Graphene)에서 게이트로 정의된 안티도트(Antidot) 구조를 이용해 애니온의 전하를 측정하는 데 성공했습니다. 특히 정공-공액(hole-conjugate) 상태에서 하류(downstream) 정수 엣지 모드의 패리티(parity)가 관찰되는 전하량을 결정한다는 중요한 물리적 메커니즘을 발견했습니다.", "implication": "애니온의 전하를 제어하고 측정할 수 있는 새로운 플랫폼으로서 그래핀 안티도트의 유용성을 입증했으며, 이는 향후 애니온 통계(braiding) 실험으로 이어질 수 있는 중요한 발판입니다.", "novelty": "이중층 그래핀이라는 재료적 특성과 안티도트 기하학을 결합하여, 그동안 논란이 되었던 정공-공액 상태의 분수 전하 특성을 명확히 규명했다는 점이 돋보입니다.", "unresolved": "서로 다른 애니온들 사이의 교환 통계(braiding statistics)를 직접적으로 관찰하는 것은 여전히 다음 단계의 과제로 남아 있습니다.", "future_work": "안티도트 간섭계를 이용한 애니온 브레이딩 실험 및 더 복잡한 분수 상태에서의 전하 분할 연구가 기대됩니다.", "concepts": [{"term": "애니온 (Anyon)", "why_emerged": "3차원과 달리 2차원 공간에서는 페르미온이나 보존이 아닌 중간적인 통계를 따르는 입자가 존재할 수 있음을 설명하기 위해 등장했습니다.", "origin": "Frank Wilczek (1982년)", "connections": "분수 양자 홀 효과, 위상 양자 컴퓨팅, 준입자"}, {"term": "안티도트 (Antidot)", "why_emerged": "2차원 전자 가스 시스템에서 전자가 투과할 수 없는 '구멍' 형태의 퍼텐셜 장벽을 만들어 산란 및 간섭 효과를 연구하기 위해 도입되었습니다.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "양자 홀 효과, 아로노프-봄 효과, 전하 양자화"}, {"term": "정공-공액 상태 (Hole-conjugate states)", "why_emerged": "분수 양자 홀 효과에서 채워짐 인자(filling factor)가 1/2보다 큰 경우, 전자 대신 정공의 관점에서 상태를 설명하기 위해 사용됩니다.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "엣지 모드 구조, 중성 모드(Neutral mode)"}, {"term": "이중층 그래핀 (Bilayer Graphene)", "why_emerged": "단일층 그래핀과 달리 수직 전장을 통해 밴드갭을 조절할 수 있는 특성을 활용하기 위해 연구되었습니다.", "origin": "Andre Geim & Konstantin Novoselov 등 (2004년 이후)", "connections": "모아레 초격자, 베리 위상, 조정 가능한 전자 구조"}], "english_summary": ["Demonstrated anyonic charge measurement using gate-defined antidots in bilayer graphene.", "Revealed that downstream integer edge mode parity dictates the observed charge in hole-conjugate states.", "Provides a robust platform for studying fractional statistics in van der Waals heterostructures.", "Essential step towards experimental realization of anyon braiding for topological quantum computing."]}}, {"title": "Emergence of magnetic ordering and weak antilocalization in Fe-doped Sb2Te3: Evidence by muon spin resonance and density functional theory studies", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/7jww-qc6d", "authors": "Suchandra Mukherjee, Nabakumar Rana, Ankit Kumar, et al.", "last_authors": "Swapnadeep Goswami, Aritra Banerjee", "summary": "Three-dimensional topological insulators have garnered significant attention in scientific research due to their unique electronic properties. An in-depth study has been conducted to explore the influence of iron (Fe) doping on both the magnetic properties and the topological insulating behavior of …", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Studies magnetic ordering in a topological insulator using experimental (muSR) and DFT.", "tags": ["topologicalinsulator", "magneticmaterials", "DFT", "muSR", "magneticorder"], "image": "", "briefing": {"background": "위상 절연체(Topological Insulator)에 자성 불순물을 주입하면 시간 역전 대칭성이 깨지면서 표면 디락 상태에 밴드갭이 열리고, 양자 이상 홀 효과와 같은 독특한 현상이 나타날 수 있습니다. Sb2Te3는 대표적인 위상 절연체 중 하나입니다.", "motivation": "Fe 도핑이 Sb2Te3의 위상학적 표면 상태와 내부 자기 질서(magnetic ordering)에 미치는 영향을 미시적인 관점에서 규명하고, 약한 안티로컬라이제이션(WAL) 현상과의 연관성을 이해하고자 했습니다.", "result": "뮤온 스핀 공명($\\mu$SR) 실험을 통해 물질 내부의 국소적인 자기 질서 형성을 직접 확인하였으며, DFT 계산을 통해 도핑된 Fe 원자의 전자 구조와 자기적 모멘트를 뒷받침했습니다. 또한 저온 수송 측정을 통해 위상 상태의 신호인 WAL이 자성 도핑 하에서도 어떻게 나타나는지 분석했습니다.", "implication": "자성 위상 절연체 시스템에서 자성 질서와 위상 보호 특성이 공존하거나 경쟁하는 메커니즘을 이해하는 데 기여하며, 이는 자기적으로 조절 가능한 위상 소자 개발에 정보를 제공합니다.", "novelty": "국소 자기장에 매우 민감한 $\\mu$SR 기법을 사용하여 Fe 도핑된 Sb2Te3의 자기적 상태를 실험적으로 명확히 입증하고 이를 이론(DFT)과 연결했다는 점이 중요합니다.", "unresolved": "자성 불순물의 분포 균일성에 따른 효과와, 디락 포인트의 밴드갭 개방 여부에 대한 직접적인 ARPES 증거가 보완되면 더 강력한 결론을 도출할 수 있을 것입니다.", "future_work": "ARPES를 통한 직접적인 전자 구조 관찰과 도핑 농도에 따른 자기 상도표(magnetic phase diagram)의 정교화 작업이 필요합니다.", "concepts": [{"term": "약한 안티로컬라이제이션 (WAL)", "why_emerged": "강한 스핀-궤도 결합이 있는 시스템에서 전자들이 서로 간섭하여 전도도가 증가하는 현상을 설명하기 위해 등장했습니다.", "origin": "Hikami, Larkin, and Nagaoka (1980년)", "connections": "위상 절연체, 스핀-궤도 결합, 양자 간섭"}, {"term": "뮤온 스핀 공명 (muSR)", "why_emerged": "물질 내부의 극히 미세한 국소 자기장을 비파괴적인 방식으로 측정하기 위해 개발되었습니다.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "자기 질서 측정, 초전도체 침투 깊이, 자성 재료 분석"}, {"term": "밀도 범함수 이론 (DFT)", "why_emerged": "다전자 시스템의 바닥 상태 에너지를 전하 밀도 함수를 통해 계산하기 위해 제안되었습니다.", "origin": "Walter Kohn & Pierre Hohenberg (1964년)", "connections": "밴드 구조 계산, 전자 밀도 분포, 전산 재료 과학"}, {"term": "자성 위상 절연체", "why_emerged": "위상 절연체의 보호된 표면 상태와 자성 질서의 결합을 통해 새로운 양자 현상을 탐색하기 위해 연구되었습니다.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "양자 이상 홀 효과, 액시온 절연체, 시간 역전 대칭성 파괴"}], "english_summary": ["Investigated Fe-doped Sb2Te3 using Muon Spin Resonance (muSR) and Density Functional Theory (DFT).", "Confirmed the emergence of magnetic ordering and its coexistence with weak antilocalization (WAL).", "Combined local magnetic probing (muSR) with transport and theoretical studies to characterize the magnetic TI state.", "Provides insights into the interaction between magnetic dopants and topological electronic structures."]}}, {"title": "High harmonic spectroscopy from lower-order to higher-order topological insulators", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/7zjc-4b4r", "authors": "Bryan Lorenzo, Carlos Batista, Milad Jangjan, et al.", "last_authors": "Camilo Granados, Alexis Chacón", "summary": "Here, the authors demonstrate that high-harmonic spectroscopy from lower-order to higher-order topological insulators reveals distinct contributions from bulk, edge, and corner electronic states. By systematically resolving these emission channels, they establish how topological features evolve across different classes of topological materials and clarify the microscopic origin of the emitted harmonics. Their results provide a unified framework for understanding and exploiting high-harmonic generation as a probe of topological quantum matter.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Studies experimental spectroscopic probe for topological insulators and electronic states.", "tags": ["topologicalinsulator", "spectroscopy", "electronicstructure"], "image": "", "briefing": {"background": "위상 절연체(Topological Insulator)는 내부(bulk)는 절연체이지만 표면이나 단면(edge)에는 특이한 전도성 상태가 존재하는 물질입니다. 최근에는 표면뿐만 아니라 모서리(corner)에만 상태가 존재하는 고차 위상 절연체(Higher-order TI)로 연구 범위가 확장되고 있습니다. 이러한 위상적 상태를 비파괴적인 광학적 방법으로 측정하고 분석하는 것은 고체 물리학의 중요한 과제입니다.", "motivation": "고차 위상 절연체에서 나타나는 벌크, 가장자리, 모서리 상태들이 각각 고차 조화파 생성(High-harmonic generation, HHG)에 어떻게 기여하는지 계통적으로 밝히고, 이를 통해 위상적 특징이 어떻게 진화하는지 통합적인 프레임워크를 제시하고자 합니다.", "result": "연구진은 저차에서 고차 위상 절연체에 이르기까지 HHG 분광법을 적용하여 벌크, 가장자리, 모서리 전자 상태에서 발생하는 방출 채널을 개별적으로 분리하는 데 성공했습니다. 이를 통해 위상 물질의 등급에 따른 조화파 발생의 미시적 기원을 명확히 규명했습니다.", "implication": "HHG 분광법이 단순히 물질의 비선형 응답을 보는 도구를 넘어, 물질의 위상적 차수(topological order)를 판별하고 각 위치에 국소화된 전자 상태를 직접적으로 탐침할 수 있는 강력한 도구가 될 수 있음을 시사합니다.", "novelty": "기존의 선형 분광학으로는 구분하기 어려운 고차 위상 상태의 미세한 기여를 HHG라는 비선형 도구를 통해 체계적으로 분리해냈다는 점이 핵심입니다. 독자의 관심사인 ARPES와 결합하여 전자 구조의 위상적 특징을 다각도로 분석하는 데 중요한 참고 자료가 됩니다.", "unresolved": "실제 실험에서 벌크 신호가 매우 강할 경우 미세한 모서리(corner) 신호를 완벽하게 분별해내는 감도 한계 및 다른 비선형 광학 효과와의 혼선 가능성이 남아 있습니다.", "future_work": "실제 실험적 구현을 통해 이론적 프레임워크를 검증하고, 나아가 플로케(Floquet) 공학 등을 이용해 실시간으로 위상 상태를 제어하며 HHG로 모니터링하는 연구가 기대됩니다.", "concepts": [{"term": "High Harmonic Generation (HHG)", "why_emerged": "강한 전자기파가 물질과 상호작용할 때 입사광 빈도의 정수배에 해당하는 고에너지 광자가 발생하는 현상으로, 물질의 전자 구조 정보를 비선형적으로 추출하기 위해 도입되었습니다.", "origin": "1960년대 비선형 광학의 발전과 함께 제안됨", "connections": "Attosecond physics, Nonlinear spectroscopy"}, {"term": "Higher-order Topological Insulator (HOTI)", "why_emerged": "전형적인 위상 절연체의 벌크-경계 대응 원리를 확장하여, (d)차원 물질이 (d-2)차원 이하의 경계(모서리 등)에서 위상 상태를 가질 수 있음을 설명하기 위해 등장했습니다.", "origin": "2017년경 Benalcazar, Bernevig, Hughes 등에 의해 제안됨", "connections": "Quadrupole topological insulator, Corner states"}, {"term": "Bulk-boundary correspondence", "why_emerged": "물질 내부(bulk)의 위상학적 불변량과 경계면(boundary)에 나타나는 무질량 전자 상태 사이의 직접적인 연관성을 설명하기 위해 정립되었습니다.", "origin": "1980년대 양자 홀 효과 연구에서 유래", "connections": "Su-Schrieffer-Heeger (SSH) model, Chern number"}], "english_summary": ["Demonstrated high-harmonic spectroscopy as a probe for identifying bulk, edge, and corner states in topological insulators.", "Established a unified framework for the evolution of topological features across different classes of TI materials.", "Clarified the microscopic origin of emitted harmonics from various topological emission channels.", "Provides a non-destructive spectroscopic method to characterize higher-order topological phases."]}}, {"title": "La substitution studies on the heavy-fermion superconductor CeRh2As2", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/f79y-ssdx", "authors": "Sushma Lakshmi Ravi Sankar, Manuel Brando, Jochen Wosnitza, Seunghyun Khim", "last_authors": "Jochen Wosnitza, Seunghyun Khim", "summary": "CeRh 2 As 2 has been receiving considerable attention due to its unusual two-phase superconductivity. The superconducting (SC) phase appears at T c = 0.35 K in an ordered state (phase I) of the Ce − 4 f moments, which develops below T 0 = 0.55 K. The microscopic nature of phase I has not been fully established yet. We report a single-crystal study of the effect of La substitution on these low-temperature phases in Ce 1 − x La x Rh 2 As 2 up to x = 0.1 . The lattice parameters increase monotonically with x , corresponding to an effective negative pressure of approximately − 0.3 GPa for x = 0.1 . While the Ce 3 + local valence state and the non-Fermi-liquid behavior are preserved, the resistivity coherence maximum T max * ≈ 45 K in the pristine sample shifts to lower temperatures with increasing x , indicating a suppression of the Kondo energy scale upon lattice expansion. On the other hand, both T c and T 0 are rapidly suppressed to below 0.1 K for x > 0.05 . Notably, such a rapid decrease of T c under moderate negative pressure is unexpected, but is rather consistent with a substitution-induced disorder effect which leads to strong pair breaking in unconventional superconductors. The observed fragility of phase I under both pressure and disorder may imply its itinerant origin.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Directly relevant to heavy-fermion unconventional superconductivity.", "tags": ["heavyfermion", "superconductivity", "materials"], "image": "", "briefing": {"background": "CeRh2As2는 최근 발견된 무거운 페르미온(heavy-fermion) 초전도체로, 외부 자기장에 의해 두 개의 서로 다른 초전도 상이 나타나는 이례적인 특징을 가집니다. 특히 초전도와 공존하거나 인접해 있는 미지의 정렬 상태(Phase I)의 정체에 대해 학계의 관심이 높습니다.", "motivation": "La 치환을 통해 격자 팽창(부압 효과)과 무질서(disorder)를 도입함으로써 CeRh2As2의 특이한 초전도 상과 Phase I의 안정성을 조사하고 그 물리적 기원을 밝히고자 했습니다.", "result": "La 치환(x=0.1)은 약 -0.3 GPa의 부압 효과를 주며 콘도 에너지 스케일을 감소시켰습니다. 그러나 초전도 전이 온도(Tc)와 Phase I의 전이 온도(T0)는 예상보다 훨씬 빠르게 억제되었습니다. 이는 단순한 압력 효과보다는 비전통적 초전도체에서 나타나는 무질서에 의한 쌍파괴(pair breaking) 효과로 해석됩니다.", "implication": "Phase I이 자기적 국소 모멘트의 정렬이라기보다 순회 전자(itinerant)의 특성을 가진 상태일 가능성이 높음을 시사하며, 초전도 현상이 무질서에 매우 취약한 비전통적(unconventional) 성격임을 뒷받침합니다.", "novelty": "CeRh2As2 시스템에서 La 치환을 통한 화학적 압력과 무질서의 영향을 단결정 수준에서 정밀하게 분리하여 Phase I의 순회적 성격(itinerant origin)에 대한 강력한 증거를 제시했습니다. 독자가 관심을 갖는 중성자 산란이나 ARPES 결과와 결합될 수 있는 재료물리적 기초를 제공합니다.", "unresolved": "Phase I의 구체적인 대칭성 붕괴 양상(예: 다극자 정렬 등)은 여전히 명확하지 않으며, La 치환이 유도하는 무질서의 미시적 분포가 초전도 쌍에 미치는 구체적 영향에 대한 추가 연구가 필요합니다.", "future_work": "Phase I의 정체를 밝히기 위한 고압 하에서의 NMR 연구나, 무질서 효과를 최소화한 다른 방식의 도핑 연구, 그리고 ARPES를 통한 페르미면 변화 관찰이 필요합니다.", "concepts": [{"term": "Heavy-fermion superconductor", "why_emerged": "f-전자와 전도 전자 사이의 강한 상관관계로 인해 전자의 유효 질량이 매우 무거워진 상태에서 초전도가 발생하는 현상을 설명하기 위해 도입되었습니다.", "origin": "1979년 Steglich 등에 의해 CeCu2Si2에서 처음 발견", "connections": "Kondo lattice, Unconventional superconductivity"}, {"term": "Chemical pressure (Substitution)", "why_emerged": "물리적 압력 장치 없이 원자 반경이 다른 원소를 치환하여 격자 상수를 조절함으로써 물리적 성질의 변화를 관찰하기 위해 사용됩니다.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "Lattice expansion, Negative pressure"}, {"term": "Pair breaking effect", "why_emerged": "비전통적 초전도체에서 비자기적 불순물이 쿠퍼 쌍의 위상 관계를 깨뜨려 초전도성을 급격히 저하시키는 현상을 설명하기 위해 중요합니다.", "origin": "Abrikosov-Gor'kov theory (1960)", "connections": "Anderson's theorem, Unconventional SC"}], "english_summary": ["Investigated the effect of La substitution (up to 10%) on the heavy-fermion superconductor CeRh2As2.", "Observed a rapid suppression of both the superconducting phase (Tc) and the unknown ordered state Phase I (T0).", "Identified that the suppression is consistent with disorder-induced pair breaking rather than just negative pressure.", "Suggested an itinerant origin for Phase I based on its fragility to both pressure and disorder."]}}, {"title": "Nonlinear Hall effect in topological Dirac semimetals in a parallel magnetic field", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/7slj-8529", "authors": "Maxim Dzero, Maxim Khodas, Alex Levchenko, Vladyslav Kozii", "last_authors": "Alex Levchenko, Vladyslav Kozii", "summary": "We compute the second-harmonic response of two-dimensional topological Dirac semimetals subjected to an in-plane magnetic field. The quantum kinetic equation for the Wigner distribution function is derived and then solved to compute the second-order electric-field contributions to the current densit…", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Theory of nonlinear Hall effect in topological Dirac semimetals, relevant to transport experiments   if (r.score) badges.appendChild(textEl('span', 'badge score', `${r.score}/10`));
  if (r.tier) badges.appendChild(textEl('span', 'badge', r.tier));
  if (r.journal) badges.appendChild(textEl('span', 'badge', r.journal));
  if (r.source) badges.appendChild(textEl('span', 'badge', r.source));
  headText.appendChild(badges);
  const title = document.createElement('h1');
  if (r.link) { const titleLink = document.createElement('a'); titleLink.href = r.link; titleLink.target = '_blank'; titleLink.rel = 'noopener noreferrer'; titleLink.textContent = r.title || ''; title.appendChild(titleLink); }
  else { title.textContent = r.title || ''; }
  headText.appendChild(title);
  headText.appendChild(textEl('p', 'meta', [r.journal, r.source].filter(Boolean).join(' | ')));
  if (r.last_authors || r.authors) { const authors = document.createElement('p'); authors.className = 'authors'; if (r.last_authors) authors.append('Last authors: ' + r.last_authors); if (r.authors) authors.append((r.last_authors ? ' | ' : '') + 'Authors: ' + r.authors); headText.appendChild(authors); }
  appendLabeledText(headText, 'why', 'Filter reason: ', r.reason);
  if (r.tags && r.tags.length) { const tags = document.createElement('div'); tags.className = 'tags'; r.tags.forEach(tag => tags.appendChild(textEl('span', 'tag', '#' + tag))); headText.appendChild(tags); }
  if (r.link) { const link = document.createElement('a'); link.className = 'link'; link.href = r.link; link.target = '_blank'; link.rel = 'noopener noreferrer'; link.textContent = 'Open paper'; headText.appendChild(link); }
  head.appendChild(headText);
  if (r.summary) { const abstract = document.createElement('p'); abstract.className = 'original-abstract'; const strong = textEl('strong', '', 'Original abstract'); abstract.appendChild(strong); abstract.append(r.summary); head.appendChild(abstract); }
  slideEl.appendChild(head);
  const briefing = document.createElement('div');
  briefing.className = 'briefing';
  appendBriefSection(briefing, 'Background', b.background);
  appendBriefSection(briefing, 'Motivation', b.motivation);
  appendBriefSection(briefing, 'Result', b.result);
  appendBriefSection(briefing, 'Implication', b.implication);
  appendBriefSection(briefing, "Why it's important / Novelty", b.novelty);
  appendBriefSection(briefing, 'Unresolved Questions', b.unresolved);
  appendBriefSection(briefing, 'Expected Future Work', b.future_work);
  if (b.concepts && b.concepts.length) {
    const section = document.createElement('section');
    section.className = 'brief-section wide';
    section.appendChild(textEl('h2', '', 'Concepts / Terms'));
    const concepts = document.createElement('div');
    concepts.className = 'concepts';
    b.concepts.forEach(c => {
      const item = document.createElement('div');
      item.className = 'concept';
      item.appendChild(textEl('h3', '', c.term || 'Concept'));
      [['왜 생겼나: ', c.why_emerged], ['누가 만들었나: ', c.origin], ['연결되는 흐름: ', c.connections]].forEach(([label, text]) => { if (!text) return; const p = document.createElement('p'); const bold = textEl('b', '', label); p.appendChild(bold); p.append(text); item.appendChild(p); });
      concepts.appendChild(item);
    });
    section.appendChild(concepts);
    briefing.appendChild(section);
  }
  if (b.english_summary && b.english_summary.length) { const section = document.createElement('section'); section.className = 'brief-section wide'; section.appendChild(textEl('h2', '', 'English Summary')); const ul = document.createElement('ul'); b.english_summary.slice(0, 5).forEach(line => ul.appendChild(textEl('li', '', line))); section.appendChild(ul); briefing.appendChild(section); }
  slideEl.appendChild(briefing);
  counterEl.textContent = `${index + 1} / ${slides.length}`;
  prevBtn.disabled = index === 0;
  nextBtn.disabled = index === slides.length - 1;
}
prevBtn.addEventListener('click', () => { index = Math.max(0, index - 1); render(); });
nextBtn.addEventListener('click', () => { index = Math.min(slides.length - 1, index + 1); render(); });
document.addEventListener('keydown', event => { if (event.key === 'ArrowLeft') prevBtn.click(); if (event.key === 'ArrowRight') nextBtn.click(); });
render();
</script>
</body>
</html>
