<title>Daily Paper Slideshow</title>
<style>
  :root {
    color-scheme: light;
    --bg: #f6f7f4;
    --paper: #ffffff;
    --ink: #111827;
    --muted: #64748b;
    --line: #d8ddd2;
    --accent: #176b87;
    --accent-2: #9a3412;
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; overflow: auto; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: var(--bg); color: var(--ink); }
  .shell { max-width: 1500px; min-height: 100vh; margin: 0 auto; padding: 14px 18px; display: flex; flex-direction: column; }
  .topbar { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 16px; }
  .top-actions { display: flex; align-items: center; gap: 10px; }
  .topbar a, button { border: 1px solid var(--line); border-radius: 8px; background: var(--paper); color: var(--ink); padding: 10px 14px; font-weight: 700; text-decoration: none; cursor: pointer; }
  button.primary { background: var(--accent); border-color: var(--accent); color: white; }
  button:disabled { opacity: 0.45; cursor: not-allowed; }
  .counter { color: var(--muted); font-weight: 700; }
  .slide { min-height: calc(100vh - 82px); background: var(--paper); border: 1px solid var(--line); border-radius: 10px; padding: 18px; box-shadow: 0 18px 42px rgba(15, 23, 42, 0.10); display: grid; grid-template-columns: minmax(310px, 0.86fr) minmax(0, 1.55fr); gap: 18px; overflow: visible; }
  .paper-head { min-width: 0; min-height: 0; overflow: visible; display: flex; flex-direction: column; gap: 12px; }
  .figure { margin: 0; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: #f8fafc; }
  .figure img { display: block; width: 100%; max-height: 41vh; object-fit: contain; background: white; }
  .figure figcaption { padding: 7px 10px; color: var(--muted); font-size: 12px; line-height: 1.3; }
  .head-text { display: flex; flex-direction: column; gap: 9px; min-width: 0; }
  .badges { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .badge { border-radius: 999px; padding: 5px 9px; background: #eef2ff; color: #3730a3; font-size: 12px; font-weight: 800; }
  .score { background: #fee2e2; color: #991b1b; }
  h1 { margin: 0; font-size: 25px; line-height: 1.15; letter-spacing: 0; overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
  h1 a { color: inherit; text-decoration-color: rgba(23, 107, 135, 0.35); text-decoration-thickness: 2px; text-underline-offset: 4px; }
  h1 a:hover { color: var(--accent); text-decoration-color: var(--accent); }
  .meta, .authors, .why, .abstract { font-size: 13px; line-height: 1.45; }
  .meta, .authors { color: var(--muted); }
  .why strong, .abstract strong, .authors strong { color: var(--ink); }
  .authors { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .why { border-left: 4px solid var(--accent-2); padding-left: 10px; color: #374151; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .abstract { border-top: 1px solid var(--line); padding-top: 14px; color: #374151; }
  .original-abstract { border-top: 1px solid var(--line); padding-top: 10px; color: #374151; font-size: 11.5px; line-height: 1.35; overflow-wrap: anywhere; }
  .original-abstract strong { display: block; margin-bottom: 4px; color: var(--ink); }
  .tags { display: flex; flex-wrap: wrap; gap: 8px; }
  .tag { border-radius: 999px; padding: 4px 8px; background: #f1f5f9; color: #475569; font-size: 12px; font-weight: 700; }
  .head-text > .link { display: none; }
  .briefing { min-width: 0; min-height: 0; overflow: visible; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); grid-auto-rows: minmax(0, auto); align-content: start; gap: 11px 18px; border-top: 0; padding-top: 0; }
  .brief-section { min-width: 0; }
  .brief-section.wide { grid-column: 1 / -1; }
  .brief-section h2 { margin: 0 0 4px; font-size: 14px; line-height: 1.22; color: #0f766e; letter-spacing: 0; }
  .brief-section p, .brief-section li { margin: 0; font-size: 12.5px; line-height: 1.42; color: #1f2937; overflow-wrap: anywhere; }
  .brief-section ul { margin: 0; padding-left: 20px; }
  .concepts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 9px 14px; }
  .concept { border-top: 1px solid var(--line); padding-top: 7px; }
  .concept h3 { margin: 0 0 4px; font-size: 13px; color: #7c2d12; letter-spacing: 0; }
  .concept p { margin: 2px 0 0; font-size: 11.5px; line-height: 1.35; color: #374151; overflow-wrap: anywhere; }
  .concept b { color: #111827; }
  .link { color: var(--accent); font-weight: 800; text-decoration: none; }
  .empty { padding: 48px; background: var(--paper); border: 1px solid var(--line); border-radius: 12px; color: var(--muted); }
  @media (max-width: 860px) {
    .shell { padding: 14px; }
    .topbar, .top-actions { align-items: stretch; flex-direction: column; }
    .slide, .briefing, .concepts { grid-template-columns: 1fr; }
    .slide { min-height: auto; overflow: visible; display: grid; }
    h1 { font-size: 28px; }
  }
</style>

const slides = [{"title": "Band structure of Na2KSb: Near-band-gap photoemission spectroscopy and density functional theory calculations", "journal": "PRB_Recent", "source": "keyword", "link": "http://link.aps.org/doi/10.1103/n3js-g2bn", "authors": "S. A. Rozhkov, V. V. Bakin, S. V. Eremeev, V. S. Rusetsky, V. A. Golyashov, D. A. Kustov, D. K. Orekhov, H. E. Scheibler, V. L. Alperovich, and O. E. Tereshchenko", "last_authors": "D. K. Orekhov, H. E. Scheibler, V. L. Alperovich, and O. E. Tereshchenko", "summary": "The electronic band structure of ${\\mathrm{Na}}_{2}\\mathrm{KSb}$ was studied by a combination of low-energy photoemission spectroscopy and density functional theory (DFT) calculations. The optical and photoemission quantum efficiency (QE) spectra, along with longitudinal energy distribution curves (…", "tier": "A_MUST_READ", "score": "9", "reason": "title strong match: photoemission", "tags": ["photoemission", "bandstructure"], "image": "", "briefing": {"background": "광전자 분광법(PES)은 고체 물질의 밴드 구조를 직접 관측하는 핵심 도구로, 반도체 및 광전 음극 소재의 효율을 결정하는 전자 상태를 이해하는 데 필수적입니다.", "motivation": "알칼리 안티모나이드 계열인 Na2KSb는 고효율 광전 음극 후보 물질로, 실제 작동 메커니즘을 규명하기 위해 밴드 구조의 실험적 검증과 DFT 계산의 비교가 필요했습니다.", "result": "근접 밴드 갭 영역에서의 광전자 분광 데이터와 밀도 범함수 이론(DFT) 계산을 결합하여 Na2KSb의 전자 밴드 구조를 구체적으로 규명했습니다.", "implication": "고효율 광전 음극 소자 설계 시 이론적 예측과 실제 전자 구조 간의 차이를 줄여 차세대 광전자 소자 개발의 가이드라인을 제공합니다.", "novelty": "Na2KSb의 밴드 구조를 저에너지 광전자 분광법을 통해 실험적으로 확인하고 DFT 결과와 상세히 대조했다는 점이 중요합니다.", "unresolved": "표면 상태나 산화 방지를 위한 캡핑 층이 밴드 구조에 미치는 정량적인 영향은 여전히 논의의 여지가 있습니다.", "future_work": "다양한 도핑 농도에 따른 밴드 갭 변화 연구 및 시간 분해 광전자 분광법을 통한 여기자 동역학 연구가 예상됩니다.", "concepts": [{"term": "광전자 분광법(PES)", "why_emerged": "물질의 밴드 구조와 상태 밀도를 직접적으로 측정하기 위해 필요합니다.", "origin": "1905년 아인슈타인의 광전효과 이론을 바탕으로 1960년대 카이 시그반 등에 의해 발전되었습니다.", "connections": "ARPES, XPS와 연계되며 전자 구조 연구의 표준적인 기법입니다."}, {"term": "밀도 범함수 이론(DFT)", "why_emerged": "다체 전자계의 복잡한 슈뢰딩거 방정식을 효율적으로 풀기 위해 고안되었습니다.", "origin": "1964년 호헨버그-콘, 1965년 콘-샴 정리에 의해 정립되었습니다.", "connections": "밴드 구조 계산을 위한 표준 전산 재료 과학 도구입니다."}], "english_summary": ["Investigated the electronic band structure of the photocathode material Na2KSb.", "Combined low-energy photoemission spectroscopy with DFT calculations.", "Provides clear insights into the near-gap electronic state essential for QE.", "Validates theoretical models against experimental photoemission data."]}}, {"title": "Pressure-Induced Magnetic-Field-Free Superconducting Diode Effect in NbSe2 Flake", "journal": "PRL_Recent", "source": "author whitelist", "link": "http://link.aps.org/doi/10.1103/8wnw-16qt", "authors": "Shihao Zhu, Tian Le, Cuiying Pei, et al.", "last_authors": "Wen-Yu He, Yanpeng Qi", "summary": "The superconducting diode effect (SDE) is a fascinating nonreciprocal phenomenon where the critical current is different for opposite current directions. It is widely believed that realizing SDE requires breaking both inversion symmetry and time-reversal symmetry (TRS), which are usually achieved vi…", "tier": "A_MUST_READ", "score": "9", "reason": "author whitelist: Yulin Chen", "tags": ["superconduct"], "image": "", "briefing": {"background": "초전도 다이오드 효과(SDE)는 전류의 방향에 따라 임계 전류값이 다른 비가역 현상으로, 기존에는 외부 자기장이 필수적이었습니다.", "motivation": "자기장 없이(Field-free) SDE를 구현하여 소자의 집적도를 높이고 에너지 효율적인 양자 소자를 구현하고자 했습니다.", "result": "압력을 가하여 NbSe2 박막의 반전 대칭성을 제어함으로써 외부 자기장 없이도 SDE가 발생하는 현상을 관측했습니다.", "implication": "위상 초전도체나 자성체 기반 소자 없이도 순수 압력 제어만으로 비가역 초전도 소자를 만들 수 있는 가능성을 열었습니다.", "novelty": "외부 자기장 없이 단지 압력 조절을 통해 NbSe2에서 SDE를 유도한 것은 초전도 소자 응용 분야에서 매우 흥미로운 성과입니다.", "unresolved": "압력 하에서의 구조적 상전이와 SDE의 직접적인 상관관계에 대한 미시적 메커니즘은 추가 규명이 필요합니다.", "future_work": "압력-온도 상도 연구 및 초전도 다이오드를 이용한 로직 게이트 회로 실험이 기대됩니다.", "concepts": [{"term": "초전도 다이오드 효과(SDE)", "why_emerged": "초전도 기반의 비가역 소자 및 위상 양자 컴퓨터 연구를 위해 필요합니다.", "origin": "최근 2D 물질 및 위상 물질 연구에서 활발히 보고되고 있습니다.", "connections": "비대칭 임계 전류, 비가역적인 전하 수송과 밀접합니다."}, {"term": "NbSe2(니오븀 셀레나이드)", "why_emerged": "전형적인 층상 구조 초전도체로서 CDW와 초전도의 공존 연구에 핵심적인 물질입니다.", "origin": : "일반적인 벌크 물질의 초전도성을 진공 환경 변화를 통해 향상시킬 수 있다는 가능성을 보여준 독특한 연구입니다.", "unresolved": "진공 향상 효과의 구체적인 미시적 메커니즘(예: 표면 상태의 재배열 또는 도핑 효과 여부)은 아직 명확하지 않습니다.", "future_work": "진공 수준에 따른 정밀한 Tc 변화 추적 및 ARPES를 통한 전자 밴드 구조 변화의 실시간 관측이 필요합니다.", "concepts": [{"term": "NbSe2", "why_emerged": "CDW와 초전도성의 상호작용을 연구할 수 있는 층상 구조 플랫폼으로 널리 사용됨.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "TMD, 2D 물질"}, {"term": "전하 밀도 파동(CDW)", "why_emerged": "저차원 금속에서 전자의 밀도가 공간적으로 주기적인 변조를 일으키는 현상을 이해하기 위해.", "origin": "Peierls (1955)", "connections": "금속-절연체 전이, 강상관 전자계"}], "english_summary": ["Evidence for vacuum-enhanced superconductivity in NbSe2 observed.", "Surface/interface environment significantly influences superconducting transition.", "Opens new pathways for controlling superconductivity in TMDs through environmental engineering."]}}, {"title": "Bridging ambient- and high-pressure superconductivity in La2LnNi2O7 films", "journal": "Nature_Materials", "source": "Gemini", "link": "https://www.nature.com/articles/s41563-026-02695-3", "authors": "Motoki Osada, Chieko Terakura, Shusaku Imajo, et al.", "last_authors": "Yoshinori Tokura, Atsushi Tsukazaki", "summary": "Lanthanide substitution, ultrahigh magnetic field measurements and high-pressure studies are utilized to compare and contrast ambient- and high-pressure superconductivity in bilayer nickelate films.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Nickelate superconductivity study relevant to broad interest in unconventional superconducting systems.", "tags": ["nickelate", "superconductivity", "thinfilms"], "image": "https://media.springernature.com/m685/springer-static/image/art%3A10.1038%2Fs41563-026-02695-3/MediaObjects/41563_2026_2695_Fig1_HTML.png", "briefing": {"background": "니켈산염 초전도체는 구리산염(cuprates)의 대안으로 주목받으며, 층상 구조(빌레이어)에서의 초전도 메커니즘을 규명하는 것이 고온 초전도 물리 연구의 핵심 난제입니다.", "motivation": "La2LnNi2O7 니켈산염 박막에서 상압 초전도와 고압 초전도 간의 물리적 연결 고리를 확인하고, 란타넘족 원소 치환 및 자기장 효과를 통해 전자 구조적 차이를 밝히고자 했습니다.", "result": "상압과 고압 상태의 초전도 특성을 비교 분석하여, 두 영역이 서로 다른 위상적 상태 혹은 전자 상관관계에 기반할 가능성을 시사하는 데이터를 확보했습니다.", "implication": "니켈산염 초전도체의 상전이 메커니즘을 이해함으로써, 고온 초전도체를 설계하기 위한 화학적 치환 및 압력 제어 지침을 제공할 수 있습니다.", "novelty": "란타넘족 치환과 극한 자기장, 고압 실험을 결합하여 니켈산염 박막의 초전도 상도를 통합적으로 조명했다는 점이 중요합니다.", "unresolved": "상압과 고압 초전도 사이의 구체적인 페르미 면(Fermi surface)의 변화나 전자 쌍 형성 기제의 동일성 여부는 명확하지 않습니다.", "future_work": "ARPES를 통한 전자 구조의 직접 관측 및 다양한 란타넘족 치환체에서의 도핑 효과 연구가 필요합니다.", "concepts": [{"term": "니켈산염 초전도체", "why_emerged": "구리산염과 유사한 3d 전자 구조를 가지면서도 화학적 자유도가 높아 초전도 메커니즘 연구에 적합하기 때문입니다.", "origin": "2019년 Li et al.에 의해 Nd0.8Sr0.2NiO2 박막에서 처음 보고되었습니다.", "connections": "구리산염(cuprates), 훈드(Hund's) 금속, 강상관 전자계."}], "english_summary": ["Investigated superconductivity in La2LnNi2O7 bilayer nickelate films.", "Used lanthanide substitution and extreme magnetic fields to probe phase properties.", "Compares ambient- and high-pressure superconducting regimes.", "Provides insights into the underlying electronic structure of nickelate superconductors."]}}, {"title": "Layer-engineered quantum anomalous Hall effect in twisted rhombohedral graphene", "journal": "Nature_Materials", "source": "Gemini", "link": "https://www.nature.com/articles/s41563-026-02711-6", "authors": "Zhangyuan Chen, Naitian Liu, Jiannan Hua, et al.", "last_authors": "Wei Zhu, Shuigang Xu", "summary": "Magnetotransport measurements on numerous samples of monolayer–multilayer (1 + N) rhombohedral graphene reveal a high-Chern-number quantum anomalous Hall effect with Chern number C = N. Further, in twisted Bernal bilayer–rhombohedral tetralayer graphene, a displacement-field-driven topological phase transition between C = 3 and C = 4 states is demonstrated.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "High-impact study on quantum anomalous Hall and topology in moire graphene systems.", "tags": ["graphene", "topology", "quantumanomalousHall"], "image": "https://media.springernature.com/m685/springer-static/image/art%3A10.1038%2Fs41563-026-02711-6/MediaObjects/41563_2026_2711_Fig1_HTML.png", "briefing": {"background": "모아레 격자와 층상 그래핀 시스템은 강한 전자 상관관계와 위상적 특성이 발현되는 플랫폼으로, 양자 비정상 홀 효과(QAHE)를 구현하는 데 매우 중요합니다.", "motivation": "능면체(rhombohedral) 그래핀의 층 수(N)에 따른 위상적 성질과 모아레 패턴이 유도하는 위상 상전이를 체계적으로 연구하고자 했습니다.", "result": "1+N 층 구조에서 C=N의 높은 천 수(Chern number)를 갖는 양자 비정상 홀 효과를 관측하고, 변위장 제어를 통해 C=3와 C=4 상태 간의 위상 상전이를 성공적으로 구현했습니다.", "implication": "모아레 그래핀이 위상 양자 컴퓨터 및 저전력 소자를 위한 고차원 위상 절연체의 플랫폼이 될 수 있음을 입증했습니다.", "novelty": "변위장을 이용한 능동적 위상 상태 전환과 높은 천 수를 구현한 점이 독창적이며, 그래핀 토폴로지 분야의 중요한 진전입니다.", "unresolved": "이러한 고차 위상 상태의 안정성과 온도 의존성에 대한 상세 메커니즘이 추가 연구가 필요합니다.", "future_work": "다른 뒤틀림 각도에서의 상태 변화 탐색 및 국소적인 전자 구조 측정(STS 등)이 기대됩니다.", "concepts": [{"term": "양자 비정상 홀 효과(QAHE)", "why_emerged": "외부 자기장 없이도 자성체 내의 자발적 자기 모멘트만으로 양자 홀 효과와 같은 위상적 상태를 구현하기 위해 등장했습니다.", "origin": "Haldane 모델(1988)로 이론화되었으며, 자기 위상 절연체에서 실험적으로 처음 구현되었습니다.", "connections": "양자 홀 효과, Chern 절연체, Berry 곡률."}, {"term": "능면체 그래핀", "why_emerged": "그래핀 층을 ABC 순서로 쌓았을 때 나타나는 특유의 전자 분산과 플랫 밴드 특성을 활용하기 위해 필요합니다.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "Bernal(AB) 쌓기, 모아레(Moire) 격자, 플랫 밴드 물리학."}], "english_summary": ["Demonstrates high-Chern-number QAHE in (1+N) rhombohedral graphene.", "Observed C=N states in monolayer-multilayer systems.", "Shows displacement-field-driven phase transition between C=3 and C=4.", "Advances the understanding of topology in moire-engineered graphene."]}}, {"title": "Antidots measure anyonic charge in graphene", "journal": "Nature_Physics", "source": "Gemini", "link": "https://www.nature.com/articles/s41567-026-03428-8", "authors": "Authors not available in source RSS", "last_authors": "", "summary": "Anyons are fractionally charged quasiparticles of the quantum Hall effect, and could one day power topological quantum computers. Trapping and measuring anyons remains difficult, but quasiparticle charges have now been measured using a gate-defined antidot in bilayer graphene. For hole-conjugate states, the parity of downstream integer edge modes sets the observed charge.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Important transport study of FQH states in graphene.", "tags": ["graphene", "quantumHall", "transport"], "image": "https://media.springernature.com/m685/springer-static/image/art%3A10.1038%2Fs41567-026-03428-8/MediaObjects/41567_2026_3428_Fig1_HTML.png", "briefing": {"background": "분수 양자 홀 상태(FQH)에서의 애니온(anyon)은 위상 양자 연산의 핵심 단위이지만, 이들의 분수 전하를 직접 측정하는 것은 실험적으로 매우 어렵습니다.", "motivation": "이층 그래핀(bilayer graphene)을 이용해 게이트로 정의된 안티닷(antidot) 구조에서 애니온의 전하를 정밀하게 측정하고자 했습니다.", "result": "안티닷 구조를 통해 분수 전하를 직접 관측했으며, 홀 공액(hole-conjugate) 상태에서 에지 모드의 패리티가 관측된 전하 값에 결정적인 영향을 미친다는 것을 확인했습니다.", "implication": "애니온의 통계적 성질을 실험적으로 제어할 수 있게 됨으로써 위상 양자 컴퓨팅 구현 가능성을 높였습니다.", "novelty": "안티닷 구조를 활용하여 그래핀에서 애니온 전하를 직접 측정함으로써 분수 양자 홀 상태의 위상적 성질을 검증했습니다.", "unresolved": "다양한 분수 충전 인자에서의 범용적인 전하 측정 정확도와 에지 모드 사이의 복잡한 상호작용은 여전히 연구가 필요합니다.", "future_work": "이러한 애니온의 브레이딩(braiding) 실험 및 위상적 양자 게이트 설계 연구가 기대됩니다.", "concepts": [{"term": "애니온(Anyon)", "why_emerged": "2차원 계에서 보존과 페르미온을 넘어서는 비자명한 교환 통계를 가지는 준입자의 필요성 때문에 등장했습니다.", "origin": "Leinaas와 Myrheim(1977)이 이론적으로 제시하고 Wilczek이 명명했습니다.", "connections": "분수 양자 홀 효과, 위상 양자 연산, Chern-Simons 이론."}, {"term": "안티닷(Antidot)", "why_emerged": "양자 홀 시료 내에 작은 비전도성 섬을 만들어 준입자의 터널링이나 에지 상태의 간섭을 정밀하게 제어하기 위해 필요합니다.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "양자 점(Quantum dot), 에지 상태, 간섭계."}], "english_summary": ["Measured anyonic fractional charge in bilayer graphene.", "Utilized a gate-defined antidot structure.", "Found that edge-mode parity dictates observed quasiparticle charge in hole-conjugate states.", "Highlights progress toward topological quantum computing."]}}, {"title": "Antiferromagnetic-like resonance and anisotropic exchanges in the triangular-lattice quantum magnet NaYbSe2", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/1djt-5g6w", "authors": "Wenjing Zhang, Jiaojiao Cao, Zhendong Fu, et al.", "last_authors": "Zhenxing Wang, Zhongwen Ouyang", "summary": "Triangular-lattice rare-earth chalcogenides $\\mathrm{NaYb}{X}_{2}$ ($X$ = O, S, and Se) are promising quantum spin liquid (QSL) candidates, while the exact properties of the quantum state remain elusive. In this work, we present a spin-dynamic investigation of ${\\mathrm{NaYbSe}}_{2}$. Magnetic susce…", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Magnetic characterization of a quantum spin liquid candidate material.", "tags": ["material", "quantummagnet", "spinliquid"], "image": "", "briefing": {"background": "삼각 격자(triangular-lattice) 구조를 가진 양자 자성체는 기하학적 좌절(geometric frustration)로 인해 저온에서 자성 정렬을 피하고 양자 스핀 액체(QSL) 상태를 형성할 가능성이 있어 활발히 연구됩니다.", "motivation": "NaYbSe2는 QSL 후보 물질로 제안되었으나, 그 자성 상태와 역학적 특성에 대한 명확한 이해가 부족하여 이를 상세히 조사하고자 합니다.", "result": "NaYbSe2의 스핀 동역학 조사를 통해 반강자성적 공명 현상과 이방성 교환 상호작용의 증거를 포착했습니다.", "implication": "이 물질이 QSL의 후보로서 가지는 구체적인 자기적 상호작용 메커니즘을 밝혀, 희토류 칼코게나이드 시스템의 양자 물성 이해도를 높였습니다.", "novelty": "삼각 격자 시스템에서 이방성 상호작용의 역할을 강조하며, QSL 후보군의 스핀 동역학적 특성을 실증적으로 분석했습니다.", "unresolved": "실제 기저 상태가 진정한 스핀 액체인지, 혹은 저온에서 미세한 자기 정렬이 나타나는지에 대한 완전한 결론은 부족합니다.", "future_work": "저온에서의 중성자 산란 실험이나 비열 측정을 통한 추가적인 스핀 기여도 분석이 필요합니다.", "concepts": [{"term": "양자 스핀 액체 (QSL)", "why_emerged": "강한 자기적 좌절로 인해 절대 영도에서도 자기적 장거리 정렬이 형성되지 않는 상태를 기술하기 위해 필요.", "origin": "Anderson (1973).", "connections": "RVB 이론, 고온 초전도체와의 연관성."}, {"term": "기하학적 좌절", "why_emerged": "격자 구조상 모든 스핀이 동시에 반강자성적 상호작용을 만족할 수 없는 상황을 설명하기 위해 도입.", "origin": "Wannier (1950).", "connections": "삼각 격자, 카고메 격자 시스템."}], "english_summary": ["NaYbSe2 is investigated as a candidate for a quantum spin liquid on a triangular lattice.", "Magnetic dynamics show evidence of antiferromagnetic-like resonance.", "Anisotropic exchange interactions play a key role in the spin-dynamic response.", "These findings clarify the complex magnetic landscape of rare-earth chalcogenides."]}}, {"title": "Emergent room-temperature anomalous and topological Hall responses in the epitaxial ferromagnetic Weyl nodal-line metal Fe5Si3", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/flxb-4ktc", "authors": "Shubhashish Pati, Sonali Srotaswini Pradhan, Abhay Pandey, et al.", "last_authors": "V. Kanchana, Sujeet Chaudhary", "summary": "The interplay between real and reciprocal space topology yields intrinsically linked transport phenomena in topological magnetic material systems. In particular, broken time-reversal symmetry together with strong Dzyaloshinskii-Moriya interaction and pronounced uniaxial anisotropy can simultaneously…", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Topological Weyl semimetal with direct experimental transport relevance.", "tags": ["material", "Weylsemimetal", "topology"], "image": "", "briefing": {"background": "위상학적 물질에서 시간 역전 대칭성이 깨지면 비정상 홀 효과(AHE)와 위상 홀 효과(THE)가 나타나며, 이는 차세대 스핀트로닉스 응용에 핵심적인 역할을 합니다.", "motivation": "강자성 Weyl 마디선(nodal-line) 금속인 Fe5Si3에서 실온 수준의 비정상적인 홀 반응을 실험적으로 관측하고 물리적 기원을 밝히고자 합니다.", "result": "Fe5Si3 에피택셜 박막에서 큰 비정상 홀 전도도와 위상 홀 효과를 실온에서 관측했습니다.", "implication": "상온에서 작동하는 위상학적 홀 소자 개발의 가능성을 열었으며, 강자성 Weyl 금속 시스템의 응용 가치를 입증했습니다.", "novelty": "강자성 Weyl 마디선 금속에서 실온 위상 홀 응답을 확인했다는 점이 독창적이며, 특히 Berry 곡률과 위상학적 성질의 결합을 보여줍니다.", "unresolved": "이 시스템에서 관측된 위상 홀 효과가 순수하게 스카이뮨(skyrmion) 등의 위상 자성 구조에 의한 것인지에 대한 추가적인 현미경적 증거가 필요합니다.", "future_work": "자기 힘 현미경(MFM)이나 로런츠 투과 전자 현미경(LTEM)을 통한 실공간 자기 구조 직접 관측.", "concepts": [{"term": "Weyl 마디선 금속", "why_emerged": "운동량 공간에서 밴드가 교차하는 지점이 점이 아닌 선을 이룰 때의 특이한 물성을 기술하기 위해 도입.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "Berry 곡률, 비정상 홀 효과."}, {"term": "비정상 홀 효과", "why_emerged": "강자성 물질에서 외부 자기장 없이도 자화에 의해 발생하는 홀 전압을 설명하기 위해 필요.", "origin": "Hall (1881).", "connections": "Berry 위상, 스핀-궤도 결합."}], "english_summary": ["Fe5Si3 is identified as a ferromagnetic Weyl nodal-line metal.", "The material exhibits anomalous and topological Hall responses at room temperature.", "Results suggest a significant interplay between electronic topology and magnetic order.", "This provides a potential platform for room-temperature topological spintronics."]}}, {"title": "Identifying open-orbit topological surface states in dual topological semimetal TaSb2", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/9gk1-krjp", "authors": "Susmita Changdar, Heike Schlörb, Oleksandr Suvorov, et al.", "last_authors": "Sergey Borisenko, Setti Thirupathaiah", "summary": "TaSb 2 , a member of the TmPn 2 family of materials, hosts the very rare dual topological phase—weak topological insulating state and topological crystalline insulating state along different crystallographic orientations. So far, studies on the electronic structure of TmPn 2 compounds have focused on their overall electronic structure and the bulk open-orbit Fermi surfaces. Using angle-resolved photoemission spectroscopy, density functional theory calculations, and transport measurements, we distinguish the intertwined bulk and surface states on the weakly topological ( 20 1 ¯ ) plane of TaSb 2 . We identify multiple electron- and holelike bulk bands, yielding a near-perfect carrier compensation. Crucially, we observe open-orbit FSs near M ¯ and parallel to Γ ¯ − Y ¯ direction that are entirely of surface origin. The surface states also exhibit band crossing at ∼ 0.6 eV below Fermi level at the time-reversal invariant momentum M ¯ , indicating nontrivial band topology. Consistent with this, magnetotransport measurements display weak antilocalization, establishing TaSb 2 as a platform for spin-polarized topological transport on a weakly topological surface.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Relevant electronic structure study of topological semimetal.", "tags": ["material", "topologicalsemimetal", "electronicstructure"], "image": "", "briefing": {"background": "TmPn2 화합물은 위상학적으로 비자명한 밴드 구조를 가지며, 벌크와 표면 상태가 복잡하게 얽혀 있어 차세대 양자 소자 후보로 연구됩니다.", "motivation": "TaSb2의 약한 위상 절연체 상태와 위상 결정 절연체 상태가 공존하는 밴드 구조를 ARPES와 수송 측정을 통해 명확히 규명하고자 합니다.", "result": "TaSb2의 (20-1) 면에서 벌크 밴드와 구별되는 표면 기원의 '열린 궤도(open-orbit)' 페르미 표면을 식별했습니다.", "implication": "TaSb2가 약한 위상 표면에서의 스핀 편극 수송을 위한 플랫폼임을 확인했으며, 위상학적 밴드 구조와 수송 현상의 연결 고리를 강화했습니다.", "novelty": "ARPES를 통해 벌크 밴드와 표면 상태를 성공적으로 분리해냈으며, 특히 열린 궤도 페르미 표면의 기원이 표면 상태임을 증명한 점이 중요합니다.", "unresolved": "다양한 결정학적 방향에 따른 표면 상태의 차이와 이것이 소자 효율에 미치는 영향에 대해서는 추가 논의가 필요합니다.", "future_work": "게이트 전압 조절을 통한 위상학적 수송 특성의 제어 실험.", "concepts": [{"term": "열린 궤도 (Open-orbit)", "why_emerged": "자기장 하에서 페르미 표면이 브릴루앙 영역을 가로질러 닫히지 않는 경로를 설명하기 위해 필요.", "origin": "Lifshitz, Lifshitz, and Kaganov (1950s).", "connections": "자기저항(MR), 밴드 구조 토폴로지."}, {"term": "약한 위상 절연체", "why_emerged": "시간 역전 대칭성을 가진 시스템에서 거울 대칭성 등에 의해 보호되는 위상적 특성을 분류하기 위해 도입.", "origin": "Fu, Kane, and Mele (2007).", "connections": "강한 위상 절연체(STI), Z2 불변량."}], "english_summary": ["TaSb2 displays dual topological phases involving weak and crystalline insulation.", "ARPES distinguishes surface-origin open-orbit Fermi surfaces from bulk bands.", "Magnetotransport data confirms weak antilocalization on the topological surface.", "The material is established as a platform for spin-polarized topological transport."]}}, {"title": "Landau levels and magneto-optics in 30∘ quasiperiodic twisted bilayer graphene", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/fs49-9zrj", "authors": "Masaru Hitomi, Takuto Kawakami, Mikito Koshino", "last_authors": "Takuto Kawakami, Mikito Koshino", "summary": "Here, the authors show how magnetic fields expose the hidden quasiband structure of 30° twisted bilayer graphene, a quasicrystal with 12-fold rotational symmetry but no translational symmetry. Their Landau-level theory reveals quantized orbits of quasiband pockets, unusual spectral patterns, and magneto-optical selection rules enforced by quasicrystalline symmetry, providing a route to quantum magneto-optics in broader quasiperiodic van der Waals materials.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Magneto-optics and band structure study of twisted bilayer graphene systems.", "tags": ["graphene", "magneto-optics", "bandstructure"], "image": "", "briefing": {"background": "트위스티드 이중층 그래핀(TBG)은 층간 비틀림 각도에 따라 전자 구조가 극적으로 변하며, 특히 30도 비틀림은 병진 대칭성이 없는 준결정(quasicrystal) 구조를 형성합니다.", "motivation": "30도 비틀림 구조에서 나타나는 12회 회전 대칭성과 병진 대칭성 부재가 전자 상태와 란다우 준위(Landau level)에 어떤 영향을 미치는지 규명하고자 합니다.", "result": "자기장 하에서 준결정 구조에 기인한 양자화된 궤도와 독특한 자기 광학 선택 규칙을 확인했습니다.", "implication": "준결정 물질에서의 전자 구조를 자기 광학 측정을 통해 탐구할 수 있는 이론적 기반을 마련했습니다.", "novelty": "병진 대칭성이 없는 준결정에서 란다우 준위 이론을 정립하여 복잡한 전자 상태를 이해할 수 있게 함으로써, 차세대 모아레/준결정 물성 연구의 지표를 제시합니다.", "unresolved": "실제 실험에서 준결정의 무질서(disorder)가 얼마나 란다우 준위 분해능을 저해할지에 대한 논의는 부족합니다.", "future_work": "실제 30도 비틀림 시료에 대한 자기 광학 분광학 및 STM 측정을 통한 실험적 검증이 기대됩니다.", "concepts": [{"term": "준결정(Quasicrystal)", "why_emerged": "회전 대칭성은 가지지만 주기적 격자 구조(병진 대칭성)를 갖지 않는 결정 구조를 설명하기 위해 필요합니다.", "origin": "Dan Shechtman이 1982년 발견하여 2011년 노벨 화학상 수상.", "connections": "펜로즈 타일링, 모아레 물리학."}, {"term": "란다우 준위(Landau Level)", "why_emerged": "자기장 내에서 전자 궤도가 양자화되어 에너지 스펙트럼이 불연속적으로 나뉘는 현상을 설명하기 위해 도입되었습니다.", "origin": "Lev Landau가 1930년 제안.", "connections": "양자 홀 효과, 사이클로트론 공명."}], "english_summary": ["The paper explores the magneto-optics of 30-degree twisted bilayer graphene.", "It models Landau levels in a quasicrystalline system lacking translational symmetry.", "The study identifies quantized quasiband orbits and selection rules dictated by 12-fold symmetry.", "This framework bridges the gap between quasicrystal physics and quantum magneto-optics."]}}, {"title": "Layer-mediated tuning of spin and valley physics in stacked tetragonal altermagnetic bilayers", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/w468-mdrb", "authors": "Jianke Tian, Xiaowen Zhou, Gui-Bin Liu", "last_authors": "Xiaowen Zhou, Gui-Bin Liu", "summary": "As an emerging magnetic phase, altermagnets (AMs) with collinear compensated magnetism in real space and alternating spin splitting in the band structure have attracted widespread attention. Here, based on first-principles calculations, we demonstrate that the layer stacking imposes symmetry constra…", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Altermagnetism is highly relevant to current magnetic materials research.", "tags": ["material", "altermagnet", "bandstructure"], "image": "", "briefing": {"background": "알터마그넷(Altermagnet)은 순자화가 0이면서도 밴드 구조 내에서 스핀 분할이 발생하는 새로운 자기 상으로, 강자성체와 반강자성체의 장점을 모두 가집니다.", "motivation": "적층된 사방정계(tetragonal) 알터마그넷 구조에서 층간 적층 방식이 스핀 및 밸리(valley) 물리 특성을 어떻게 제어할 수 있는지 확인하고자 합니다.", "result": "제1원리 계산을 통해 층간 적층 방식에 따른 대칭성 제약이 스핀 분할 패턴을 조절함을 보였습니다.", "implication": "적층 순서 제어를 통해 알터마그넷의 전자적 성질을 튜닝할 수 있는 스핀트로닉스 설계 원리를 제공합니다.", "novelty": "알터마그넷의 고유한 밴드 분할을 구조적 자유도로 제어할 수 있다는 점을 입증하여, 재료 설계 전략을 구체화했습니다.", "unresolved": "계산 결과가 실험적으로 실현 가능한 특정 물질군에서 어떻게 구현될지에 대한 구체적인 후보 물질 제시는 부족합니다.", "future_work": "실험적 합성을 통한 밴드 구조의 ARPES 검증 및 적층 방식별 자기 저항 측정 연구.", "concepts": [{"term": "알터마그넷(Altermagnet)", "why_emerged": "강자성체의 큰 스핀 분할과 반강자성체의 높은 안정성을 동시에 얻기 위해 필요합니다.", "origin": "최근(2020년대 초반) 이론적으로 제안 및 명명됨.", "connections": "비상관 반강자성, 스핀트로닉스."}, {"term": "밸리 물리학(Valley Physics)", "why_emerged": "에너지 밴드의 국소 최소점(valley) 자유도를 정보 저장 및 연산에 활용하기 위해 연구됩니다.", "origin": "이차원 재료 연구 초기부터 확립.", "connections": "스핀-밸리 커플링, 그래핀."}], "english_summary": ["This paper investigates spin and valley physics in tetragonal altermagnetic bilayers.", "It utilizes first-principles calculations to demonstrate symmetry-dependent band control.", "Layer stacking acts as a tuning parameter for alternating spin splitting.", "These findings provide a basis for designing altermagnet-based spintronic devices."]}}, {"title": "Magnetization-free quantum anomalous Hall effect in altermagnetic weak topological insulators", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/5378-2fcs", "author , "cuprates"], "image": "", "briefing": {"background": "고온 초전도체인 큐프레이트에서 나타나는 d-파동 대칭성과 전하 밀도 파(stripe order)의 상관관계는 현대 응집물질물리의 가장 큰 난제 중 하나입니다.", "motivation": "허바드 모델(Hubbard model)에서 스핀온(spinon) 쌍의 싱글렛 형성이 d-파동 초전도성의 미시적 기원인지를 이론적으로 규명하고자 했습니다.", "result": "스트라이프 상태 내의 부분 채움(partially filled) 영역에서 스핀온 싱글렛 쌍이 d-파동 초전도성을 유도함을 이론적 모델링을 통해 증명하였습니다.", "implication": "큐프레이트의 전하 스트라이프와 초전도성 간의 미시적 연결 고리를 제시하여, 강상관 전자계 모델링에 강력한 이론적 근거를 제공합니다.", "novelty": "복잡한 스트라이프 구조 내에서 스핀 자유도인 스핀온의 역할을 구체화하여, 고온 초전도성의 이론적 체계를 정교화했습니다.", "unresolved": "이 모델이 실제 도핑된 허바드 격자 외의 현실적인 d-파동 초전도체 물질의 정량적인 전이 온도 등을 얼마나 정확히 예측하는지.", "future_work": "다양한 도핑 수준 및 격자 비대칭성이 스핀온 쌍 형성에 미치는 영향을 DMFT 등으로 추가 계산.", "concepts": [{"term": "스핀온", "why_emerged": "1차원 혹은 강상관 시스템에서 스핀-전하 분리가 일어날 때 스핀 자유도를 전달하는 준입자.", "origin": "Anderson (1987)의 RVB 이론에서 제안.", "connections": "양자 스핀 액체, 허바드 모델."}, {"term": "d-파동 대칭성", "why_emerged": "큐프레이트 초전도체에서 나타나는 갭 구조를 설명하기 위해.", "origin": "Wollman et al. (1993) 등 위상 민감 실험을 통해 확립.", "connections": "고온 초전도체, 페르미-허바드 모델."}], "english_summary": ["Theoretical study of spinon singlet pairing in striped Hubbard models.", "Explains the emergence of d-wave superconductivity in hole-doped systems.", "Provides a mechanism linking stripe orders and superconducting states.", "Deepens understanding of cuprate physics via Hubbard quantum simulation insights."]}}, {"title": "Topological Surface Charge Detection via Active Capacitive Compensation: A Pathway to the 4D Quantum Hall Effect", "journal": "PRL_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/wycz-5hvd", "authors": "Yuanze Li, Renfei Wang, Yifan Zhang, et al.", "last_authors": "Yang Liu, Tian Liang", "summary": "The topological magnetoelectric effect (TME) in three-dimensional topological insulators (TIs), described by $\\mathrm{Δ}P=({e}^{2}/2h){N}_{\\text{Ch}}^{(2)}\\mathrm{Δ}B$, serves as a condensed-matter realization of the four-dimensional quantum Hall effect (4D QHE). In dual-gate axion insulator devices…", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Topological magnetoelectric effect in topological insulators, related to 4D QHE.", "tags": ["topologicalinsulator", "quantumHalleffect", "axioninsulator", "condensedmatter"], "image": "", "briefing": {"background": "3차원 위상절연체(TI)는 물질 내부의 벌크 상태와 표면 상태가 분리되어 있으며, 위상적으로 보호된 표면 전하 축적 효과인 위상 자기전기 효과(TME)를 보입니다. 이는 수학적으로 4차원 양자 홀 효과(4D QHE)의 물리적 구현으로 간주됩니다.", "motivation": "이 논문은 액시온 절연체 소자에서 듀얼 게이트 구조를 활용하여 위상 표면 전하를 정밀하게 측정하고, 이를 통해 4D QHE의 물리적 특성을 실험적으로 확인하고자 합니다.", "result": "활성 용량 보상(Active Capacitive Compensation) 기법을 도입하여 TI 표면의 미세한 전하 변화를 효과적으로 감지하였습니다.", "implication": "위상 자기전기 효과를 실험적으로 검증함으로써, 고차원 위상 물리 현상을 저차원 계에서 연구할 수 있는 새로운 경로를 제시합니다.", "novelty": "기존의 정적인 측정 방식에서 벗어나 능동적인 보상 기법을 사용하여 표면 전하를 정밀 제어 및 측정함으로써, 4D 양자 홀 효과 모델의 실험적 증거를 강화했습니다.", "unresolved": "액시온 절연체 상태의 완벽한 달성과 불순물에 의한 표면 전하 산란 효과가 여전히 측정의 한계로 작용할 수 있습니다.", "future_work": "본 기법을 활용하여 다양한 위상학적 위상에서의 자기전기 결합 계수를 더 정밀하게 측정하고, 이를 이용한 소자 응용 연구가 기대됩니다.", "concepts": [{"term": "Topological Magnetoelectric Effect", "why_emerged": "위상절연체의 표면에서 자기장 변화가 전하 밀도 변화를 유도하는 현상을 설명하기 위해 도입됨.", "origin": "Qi, Hughes, and Zhang (2008) 이론 제안.", "connections": "액시온 전기역학, 위상절연체, 양자 이상 홀 효과와 연결됨."}, {"term": "4D Quantum Hall Effect", "why_emerged": "고차원 공간에서의 정수 양자 홀 효과가 저차원 시스템의 위상적 불변량과 수학적으로 대응됨을 설명하기 위해 제안.", "origin": "Zhang and Hu (2001)에 의해 고차원 위상 물리의 맥락에서 이론적 기반 마련.", "connections": "2차원 양자 홀 효과의 일반화, 위상절연체 물리."}], "english_summary": ["Demonstrates a novel detection technique for topological surface charges.", "Utilizes active capacitive compensation in axion insulator devices.", "Provides experimental evidence linking 3D topological insulator properties to the 4D quantum Hall effect.", "Offers a precise pathway to probe topological magnetoelectric coupling."]}}, {"title": "Preferred synthesis of armchair transition metal dichalcogenide nanotubes", "journal": "Science", "source": "Gemini", "link": "https://doi.org/10.1126/science.aeh1429", "authors": "Abid, Luneng Zhao, Ju Huang, et al.", "last_authors": "Huayong Yang, Rong Xiang", "summary": "Nanotubes represent an important class of crystalline materials, but controlling their structures, particularly chiralities, remains a fundamental challenge. In this work, we report a strategy for synthesizing transition metal dichalcogenide nanotubes with preferred armchair chirality. Tin disulfide, molybdenum disulfide, and tungsten disulfide nanotubes were formed with high yield and structural purity inside boron nitride nanotube channels. Atomic-resolution imaging, electron diffraction, and circular dichroism revealed an armchair preference up to 83%. Density functional theory ruled out structural stability as the origin of this preference but confirmed that zigzag nanoribbons are energetically more stable. Machine learning potential molecular dynamics simulated that zigzag nanoribbons roll up to form armchair nanotubes, a process that was subsequently observed by in situ transmission electron microscope. This work may inspire the achievement of on-demand synthesis of various nanotubes with specific chiralities.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Synthesis of chiral 1D TMD nanotubes, a relevant quasi-1D material system, with spectroscopy.", "tags": ["nanotubes", "TMD", "quasi-1D", "chirality", "spectroscopy", "DFT"], "image": "", "briefing": {"background": "전이금속 디칼코게나이드(TMD) 나노튜브는 독특한 준 1차원 전자 구조를 가지며, 밴드갭 엔지니어링 및 광전자 소자 활용 가능성이 큽니다. 그러나 원하는 카이랄성(chirality)을 가진 나노튜브를 선택적으로 합성하는 것은 오랜 난제였습니다.", "motivation": "TMD 나노튜브의 합성 과정에서 발생하는 카이랄성 조절의 어려움을 극복하고, 특정 카이랄성(armchair)을 가진 튜브를 높은 수율로 합성하는 전략을 개발하고자 했습니다.", "result": "질화붕소(BN) 나노튜브 내부 공간을 템플릿으로 활용하여 SnS2, MoS2, WS2 나노튜브를 암체어(armchair) 우선 순위로 합성하는 데 성공했습니다.", "implication": "나노튜브의 기하학적 구조를 제어함으로써 준 1차원 물질의 전기적·광학적 특성을 설계할 수 있는 가능성을 열었습니다.", "novelty": "기존의 무작위적 합성 방식과 달리, 템플릿 유도 합성 및 기계 학습 잠재력을 이용한 시뮬레이션을 통해 암체어 구조 선호도를 밝혀냈으며, 이는 준 1차원 물성 연구에 큰 진전입니다.", "unresolved": "BN 템플릿의 치수 제한으로 인해 나노튜브의 직경이 제한적일 수 있으며, 더 긴 튜브의 합성이나 대량 생산 최적화가 필요합니다.", "future_work": "다른 이종 구조 시스템에 대한 적용과 합성된 나노튜브의 카이랄성 의존적 물성(예: 비선형 광학, Luttinger 액체 거동) 연구가 이어질 것입니다.", "concepts": [{"term": "Armchair Chirality", "why_emerged": "나노튜브의 원자 배열 구조가 전기적 특성(금속성 vs 반도체성)을 결정하기 때문에 구분 필요.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "탄소 나노튜브, TMD 나노튜브의 밴드 구조와 직접 연결."}, {"term": "Transition Metal Dichalcogenide (TMD)", "why_emerged": "그래핀과 유사한 층상 구조를 가지면서도 밴드갭이 존재하여 소자 구현에 유리한 물질군.", "origin": "수십 년 전부터 연구되었으나 2010년대 이후 2D 층상 물질 연구로 급부상.", "connections": "전자상관관계, 2D 이종접합, 엑시톤 물성."}], "english_summary": ["Achieved preferential synthesis of armchair TMD nanotubes using BN templates.", "Confirmed structure using electron microscopy and circular dichroism.", "Used DFT and ML-assisted MD simulations to explain the armchair preference.", "Provides a scalable strategy for chiral-controlled 1D nanostructure synthesis."]}}, {"title": "Room-temperature multiferroicity in all–van der Waals heterostructures", "journal": "Science", "source": "Gemini", "link": "https://doi.org/10.1126/science.adq0420", "authors": "Qinqin Wang, Baojuan Xin, Chen Liu, et al.", "last_authors": "Evgeny Y. Tsymbal, Cheng Gong", "summary": "Multiferroics host simultaneous and coupled ferroic orders, allowing disparate external stimuli to induce abrupt transformations in their structures and properties. Creating multiferroicity in two-dimensional (2D) van der Waals (vdW) platforms would add the elements of strong quantum confinement, enhanced quasiparticle excitations, and wide tunability to the capabilities of these systems. In this work, we constructed vdW heterostructures of ferromagnetic triiron gallium ditelluride (Fe 3 GaTe 2 ) and ferroelectric copper indium thiophosphate (CuInP 2 S 6 ) to integrate their respective orders. We observed strong interferroic coupling at room temperature by demonstrating ferroelectrically reconfigurable magnetic anisotropy of 2D Fe 3 GaTe 2 . The interferroic magnetoelectricity diminished with increasing Fe 3 GaTe 2 thickness, revealing the interfacial nature of heterostructure multiferroicity. Our discovery of all-vdW heterostructure multiferroicity opens the door to the artificial assembly of vdW layers for designer 2D multiferroics.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Room-temperature multiferroicity in 2D van der Waals heterostructures is highly relevant.", "tags": ["vanderWaals", "heterostructure", "2Dmaterial", "multiferroicity", "ferromagnetism", "ferroelectricity", "quantummaterials"], "image": "", "briefing": {"background": "멀티페로익(multiferroic) 물질은 강유전성과 강자성을 동시에 가지며, 이들 사이의 결합을 통해 전기장으로 자성을 제어할 수 있는 차세대 메모리 후보군입니다. 반데르발스 이종접합은 층간 결합을 통해 새로운 물성을 구현하는 강력한 도구입니다.", "motivation": "상온에서 작동하는 2D 멀티페로익 이종접합을 구축하여, 전기장으로 자성을 조절하는 효율적인 스핀트로닉스 소자 가능성을 모색했습니다.", "result": "Fe3GaTe2(강자성)와 CuInP2S6(강유전성)의 이종접합에서 상온 멀티페로익 특성을 구현하였으며, 전기장에 의해 Fe3GaTe2의 자기 이방성이 재구성됨을 보였습니다.", "implication": "계면 결합을 통해 상온 수준에서 스핀-전하 결합을 제어할 수 있음을 증명하여 2D 기반 자성 소자 상용화에 중요한 단서를 제공합니다.", "novelty": "모든 층이 반데르발스 물질로 이루어진 소자에서 상온 멀티페로익 현상을 관측했다는 점이 핵심이며, 이는 계면 물성 제어의 중요성을 부각시킵니다.", "unresolved": "Fe3GaTe2 층의 두께에 따라 결합 효율이 감소하는 현상에 대한 미시적 원인이 완전히 규명되지 않았습니다.", "future_work": "계면 결합의 물리적 메커니즘을 규명하고, 소자의 안정성을 높이는 공정 개선 및 대면적 소자 구현 연구가 예상됩니다.", "concepts": [{"term": "Multiferroicity", "why_emerged": "강자성과 강유전성의 공존을 통해 차세대 다기능 메모리 소자를 구현하기 위해 도입됨.", "origin": "Schmid (1994)에 의해 멀티페로익이라는 용어가 정립됨.", "connections": "스핀트로닉스, 강유전체, 강자성체, 자기전기 결합."}, {"term": "Van der Waals Heterostructure", "why_emerged": "서로 다른 2D 물질을 적층하여 단일 물질에서는 얻을 수 없는 새로운 물리적 특성을 창출하기 위함.", "origin": "Geim and Grigorieva (2013) Nature 논문.", "connections": "모아레 격자, 엑시톤 물리, 2D 자성체."}], "english_summary": ["Demonstrates room-temperature multiferroicity in Fe3GaTe2/CuInP2S6 vdW heterostructures.", "Observes electrically reconfigurable magnetic anisotropy via ferroelectric coupling.", "Highlights the interfacial nature of the observed magnetoelectric effect.", "Paves the way for vdW-based designer multiferroic electronic devices."]}}, {"title": "Ultralong sheathed single-metal-atom chains synthesized under high pressure", "journal": "Science", "source": "Gemini", "link": "https://doi.org/10.1126/science.aeg0028", "authors": "Jie Zhang, Xiao Dong, Shengchao Qiu, et al.", "last_authors": "Haiyan Zheng, Kuo Li", "summary": "Single-metal-atom chains (SMACs) represent the ultimate limit of one-dimensional nanostructures. They serve as archetypal model systems for condensed matter physics and constitute fundamental building blocks for next-generation nanoelectronics. However, synthesis of SMACs suitable for practical applications remains challenging. In this work, we create micrometer-long, carbon-sheathed copper SMACs at milligram scale by compressing β-copper phthalocyanine to above 21 gigapascals. The SMACs are in atom-scale ordering, are isolable through acid-assisted exfoliation, and exhibit exceptional stability, with Cu-Cu distance confined at 2.57 angstroms. Anisotropic conductance and antiferromagnetic interactions are suggested by experimental and computational results. This work establishes a universal synthetic strategy for sheathed SMACs, positioning them as a compelling platform for prospective electronic and spintronic applications.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Synthesis of quasi-1D metal chains with anisotropic conductance and antiferromagnetic interactions.", "tags": ["quasi-1D", "nanomaterials", "antiferromagnetism", "condensedmatterphysics"], "image": "", "briefing": {"background": "1차원 나노 구조의 극한 형태인 단일 금속 원자 사슬(SMAC)은 응집물질물리학의 근본 모델 시스템이자 차세대 나노전자소자의 핵심 소자로 주목받고 있습니다.", "motivation": "기존에는 단일 원자 사슬을 안정적으로 합성하고 분리하는 데 큰 어려움이 있었으며, 이를 극복하기 위한 범용적인 합성 전략이 필요했습니다.", "result": "고압(21 GPa 이상) 환경에서 β-구리 프탈로시아닌을 압축하여 탄소로 둘러싸인 마이크로미터 길이의 구리 원자 사슬을 성공적으로 합성했습니다.", "implication": "금속 원자 간 거리(2.57 Å)가 고정된 안정적인 1차원 금속 시스템을 구현함으로써, 향후 스핀트로닉스 및 나노전자소자 구현을 위한 플랫폼을 마련했습니다.", "novelty": "실험과 계산을 통해 이 사슬이 이방성 전도도와 반강자성 상호작용을 보임을 제시했습니다. quasi-1D 물질의 자기적 특성에 관심 있는 연구자에게 중요한 모델이 될 수 있습니다.", "unresolved": "실제 나노회로에 통합하기 위한 전극 연결 방식 및 구체적인 자기적 기원(스핀-전하 분리 등)에 대한 정밀한 분석이 추가로 필요합니다.", "future_work": "다양한 금속 원자를 이용한 원자 사슬 합성 확장 및 이들의 양자 수송 특성에 대한 상세 연구가 예상됩니다.", "concepts": [{"term": "SMAC (Single-Metal-Atom Chains)", "why_emerged": "물질의 차원성을 극단적으로 제한하여 양자 제한 효과와 저차원 물리 현상을 연구하기 위해 필요함.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "양자선(Quantum wires), 랏팅거 액체(Luttinger liquid) 연구와 연결됨."}, {"term": "반강자성 상호작용", "why_emerged": "이웃한 스핀들이 서로 반대 방향으로 정렬하려는 에너지를 기술하기 위해 필요.", "origin": "Louis Néel (1930년대 제안)", "connections": "스핀-전하 분리, 고온 초전도체, 저차원 자성체 연구와 깊은 연관."}], "english_summary": ["Synthesized long, stable copper single-atom chains using high-pressure compression of phthalocyanine.", "Achieved micrometer-length chains with uniform 2.57 angstrom Cu-Cu spacing.", "Demonstrated anisotropic conductance and potential antiferromagnetic interactions.", "Provides a universal synthesis platform for quasi-1D quantum electronic components."]}}, {"title": "Multidimensional spectro-temporal imaging of exciton dynamics under propagating acoustic strain in two-dimensional semiconductors", "journal": "Science_Advances", "source": "Gemini", "link": "https://doi.org/10.1126/sciadv.aef5458", "authors": "Yuta Takahashi, Takumi Yamamoto, Hidetoshi Kanzawa, et al.", "last_authors": "Shinichi Watanabe, Shun Fujii", "summary": "Dynamic strain offers a promising route to manipulate tightly bound excitons in two-dimensional semiconductors. Its impact, however, has so far been inferred primarily from time-averaged or spatially integrated measurements. In particular, for dynamic strain driven by surface acoustic waves (SAWs), the relatively small strain amplitude and competing piezoelectric effects have hindered direct access to the real-time evolution of exciton emission energy and recombination dynamics within a single acoustic cycle. Here we report a fully phase-synchronized, multidimensional spectro-temporal-spatial visualization of exciton emission in monolayer tungsten diselenide driven by propagating SAWs. By integrating phase-resolved microscopy and interferometric surface displacement measurements, we achieve simultaneous mapping of exciton emission energy, photoluminescence intensity, linewidth, and decay dynamics and directly correlate them with the dynamic strain field. Our work establishes propagating acoustic strain as a powerful platform for deterministic exciton control and provides a comprehensive framework for exploring nonequilibrium exciton dynamics in low-dimensional materials.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Spectroscopic study of exciton dynamics in 2D semiconductors under strain, relevant to low-dimensional materials.", "tags": ["2Dmaterials", "excitons", "spectroscopy", "WSe2", "strainengineering"], "image": "", "briefing": {"background": "2차원 반도체의 엑시톤(exciton)은 강한 결합 에너지 덕분에 광소자 응용에 유리하며, 변형(strain)을 통해 이들을 제어하려는 시도가 활발합니다.", "motivation": "표면 음향파(SAW)에 의한 동적 변형이 엑시톤 동역학에 미치는 영향을 기존의 시간/공간 평균 측정 방식으로는 직접 관찰하기 어려웠습니다.", "result": "위상 동기화 현미경과 간섭계를 결합하여, WSe2 단층에서 SAW가 유도하는 엑시톤 에너지, PL 강도, 수명 변화를 단일 음향 주기 내에서 실시간으로 시각화했습니다.", "implication": "동적 변형을 이용한 엑시톤의 결정론적 제어 프레임워크를 수립하여, 비평형 상태의 저차원 물질 물리 연구에 새로운 도구를 제공합니다.", "novelty": "단순한 정적 변형 실험을 넘어 동적 음향장을 실시간으로 추적했다는 점에서 저차원 물질의 동역학 연구 수준을 한 단계 높였습니다.", "unresolved": "매우 짧은 엑시톤 수명과 음향파 주기 간의 정밀한 정합 최적화가 필요하며, 더 복잡한 2D 이질구조에서의 거동은 추가 연구가 필요합니다.", "future_work": "다른 2D 반도체 및 모아레 격자 시스템에 이 기술을 적용하여 엑시톤 수송 제어 및 양자 정보 소자 응용을 탐색할 것입니다.", "concepts": [{"term": "엑시톤 (Exciton)", "why_emerged": "반도체 내 전자-정공 쌍의 정전기적 결합을 설명하기 위해 도입.", "origin": "Yakov Frenkel (1931년)", "connections": "2D 물질의 광학 특성, 모아레 엑시톤, 강상관 전자계 연구와 직결됨."}, {"term": "표면 음향파 (SAW)", "why_emerged": "표면을 따라 이동하는 탄성파를 이용해 나노스케일의 국소적 물리량 제어를 위해 사용.", "origin": "Lord Rayleigh (1885년)", "connections": "음향광학(acousto-optics), 소자 변형 제어 기술."}], "english_summary": ["Performed real-time, phase-synchronized imaging of exciton dynamics in monolayer WSe2.", "Used propagating surface acoustic waves to drive dynamic strain.", "Simultaneously mapped emission energy, PL intensity, and decay dynamics.", "Provides a framework for deterministic exciton control via dynamic strain engineering."]}}, {"title": "Regulating phonon-carrier transport by interfacial symmetry breaking in thermoelectric multilayers", "journal": "Science_Advances", "source": "Gemini", "link": "https://doi.org/10.1126/sciadv.aeh5460", "authors": "Zhengtong Yao, Bin Liu, Shuai Zhang, et al.", "last_authors": "Moran Wang, Zhiyu Hu", "summary": "More than half of global primary energy is dissipated as low-grade waste heat, yet thermoelectric conversion remains constrained by the intrinsic coupling between phonon and charge transport. Here, we introduce graded interfacial size distribution as a thermodynamic design variable that breaks translational symmetry in multilayers, enabling anisotropic regulation of phonon-carrier transport. Using bismuth telluride (Bi 2 Te 3 )/metal [gold, silver, and platinum (Pt)] multilayers as a model system, we demonstrate that multiscale interface distributions induce broadband phonon suppression through the coexistence of interfacial scattering, coherent interference, and localization. This yields an ultralow cross-plane thermal conductivity of 0.22 watts per meter per kelvin and a high room-temperature ZT of 1.51 in Bi 2 Te 3 /Pt films. Concurrently, asymmetric metal-semiconductor interfaces create quasi–two-dimensional accumulation channels that enhance in-plane carrier mobility while preserving energy filtering, delivering a power factor of 176.2 microwatts per centimeter per square kelvin at 300 kelvin. The graded architecture enables high performance in both vertical and flexible planar devices, illustrating a general strategy in which interface distribution, not merely composition, governs anisotropic heat-charge transport. Our findings establish statistical interface engineering as a platform for thermoelectric energy harvesting and solid-state cooling.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Condensed matter research on thermoelectric transport in Bi2Te3 multilayers, relevant to material physics.", "tags": ["thermoelectrics", "transport", "multilayers", "Bi2Te3"], "image": "", "briefing": {"background": "열전 소자는 폐열 회수 핵심 기술이나, 열전도도와 전기전도도 사이의 상충 관계(trade-off)로 인해 효율 향상에 한계가 있습니다.", "motivation": "기존 조성을 바꾸는 방식 대신, 계면 분포라는 설계 변수를 활용하여 포논과 전하 수송을 개별적으로 제어하고자 했습니다.", "result": "Bi2Te3/금속 다층 박막의 계면 크기 분포를 차등 설계하여, 포논 산란 및 간섭을 극대화해 열전도도를 낮추고, 2차원 수송 채널을 통해 전하 이동도를 높였습니다.", "implication": "계면 공학(Interface engineering)이 단순한 조성을 넘어 열전 성능을 결정짓는 핵심 변수임을 입증했습니다.", "novelty": "열전도도와 전력 인자의 동시 향상을 통해 높은 ZT(1.51)를 달성했으며, 이는 대면적 및 유연 소자에도 적용 가능한 범용 설계 전략입니다.", "unresolved": "실제 고온 안정성이나 박막 내 결함 밀도에 따른 성능 저하 가능성 등 장기 신뢰성 테스트가 필요합니다.", "future_work": "다양한 금속 조합을 통한 열전 계면 최적화 및 유연한 에너지 하베스팅 소자로의 실제 구현이 예상됩니다.", "concepts": [{"term": "열전 성능 지수 (ZT)", "why_emerged": "열전 소재의 효율을 정량적으로 비교하기 위해 도입.", "origin": "전통적인 열역학적 정의", "connections": "Seebeck 효과, 전도성 고분자, 나노구조 열전 소재 연구."}, {"term": "포논 (Phonon)", "why_emerged": "결정 격자의 집단적 진동을 양자화하여 설명하기 위해 필요.", "origin": "Igor Tamm (1932년)", "connections": "열전도도 조절, 초전도 현상의 전자-포논 결합."}], "english_summary": ["Introduced graded interface distribution to decouple phonon and charge transport in Bi2Te3 multilayers.", "Achieved low thermal conductivity (0.22 W/mK) and high ZT (1.51) at room temperature.", "Created quasi-2D accumulation channels to enhance carrier mobility.", "Presents a statistical interface engineering approach for high-performance thermoelectric design."]}}, {"title": "Ultrafast energy transfer across Pd/MXene interface via hot phonon-electron interactions", "journal": "Science_Advances", "source": "Gemini", "link": "https://doi.org/10.1126/sciadv.aee2017", "authors": "Jie Zhao, Qi Zhang, Meng Geng, et al.", "last_authors": "Kaijun Yuan, Xueming Yang", "summary": "The interfacial structure and energy transfer (ET) in heteros     img.src = r.image; img.alt = 'Figure or article preview image'; img.loading = 'lazy'; img.referrerPolicy = 'no-referrer'; img.onerror = () => figure.remove();
    figure.appendChild(img);
    figure.appendChild(textEl('figcaption', '', 'Figure / article preview image from the source page'));
    head.appendChild(figure);
  }
  const headText = document.createElement('div');
  headText.className = 'head-text';
  const badges = document.createElement('div');
  badges.className = 'badges';
  if (r.score) badges.appendChild(textEl('span', 'badge score', `${r.score}/10`));
  if (r.tier) badges.appendChild(textEl('span', 'badge', r.tier));
  if (r.journal) badges.appendChild(textEl('span', 'badge', r.journal));
  if (r.source) badges.appendChild(textEl('span', 'badge', r.source));
  headText.appendChild(badges);
  const title = document.createElement('h1');
  if (r.link) { const titleLink = document.createElement('a'); titleLink.href = r.link; titleLink.target = '_blank'; titleLink.rel = 'noopener noreferrer'; titleLink.textContent = r.title || ''; title.appendChild(titleLink); }
  else { title.textContent = r.title || ''; }
  headText.appendChild(title);
  headText.appendChild(textEl('p', 'meta', [r.journal, r.source].filter(Boolean).join(' | ')));
  if (r.last_authors || r.authors) { const authors = document.createElement('p'); authors.className = 'authors'; if (r.last_authors) authors.append('Last authors: ' + r.last_authors); if (r.authors) authors.append((r.last_authors ? ' | ' : '') + 'Authors: ' + r.authors); headText.appendChild(authors); }
  appendLabeledText(headText, 'why', 'Filter reason: ', r.reason);
  if (r.tags && r.tags.length) { const tags = document.createElement('div'); tags.className = 'tags'; r.tags.forEach(tag => tags.appendChild(textEl('span', 'tag', '#' + tag))); headText.appendChild(tags); }
  if (r.link) { const link = document.createElement('a'); link.className = 'link'; link.href = r.link; link.target = '_blank'; link.rel = 'noopener noreferrer'; link.textContent = 'Open paper'; headText.appendChild(link); }
  head.appendChild(headText);
  if (r.summary) { const abstract = document.createElement('p'); abstract.className = 'original-abstract'; const strong = textEl('strong', '', 'Original abstract'); abstract.appendChild(strong); abstract.append(r.summary); head.appendChild(abstract); }
  slideEl.appendChild(head);
  const briefing = document.createElement('div');
  briefing.className = 'briefing';
  appendBriefSection(briefing, 'Background', b.background);
  appendBriefSection(briefing, 'Motivation', b.motivation);
  appendBriefSection(briefing, 'Result', b.result);
  appendBriefSection(briefing, 'Implication', b.implication);
  appendBriefSection(briefing, "Why it's important / Novelty", b.novelty);
  appendBriefSection(briefing, 'Unresolved Questions', b.unresolved);
  appendBriefSection(briefing, 'Expected Future Work', b.future_work);
  if (b.concepts && b.concepts.length) {
    const section = document.createElement('section');
    section.className = 'brief-section wide';
    section.appendChild(textEl('h2', '', 'Concepts / Terms'));
    const concepts = document.createElement('div');
    concepts.className = 'concepts';
    b.concepts.forEach(c => {
      const item = document.createElement('div');
      item.className = 'concept';
      item.appendChild(textEl('h3', '', c.term || 'Concept'));
      [['왜 생겼나: ', c.why_emerged], ['누가 만들었나: ', c.origin], ['연결되는 흐름: ', c.connections]].forEach(([label, text]) => { if (!text) return; const p = document.createElement('p'); const bold = textEl('b', '', label); p.appendChild(bold); p.append(text); item.appendChild(p); });
      concepts.appendChild(item);
    });
    section.appendChild(concepts);
    briefing.appendChild(section);
  }
  if (b.english_summary && b.english_summary.length) { const section = document.createElement('section'); section.className = 'brief-section wide'; section.appendChild(textEl('h2', '', 'English Summary')); const ul = document.createElement('ul'); b.english_summary.slice(0, 5).forEach(line => ul.appendChild(textEl('li', '', line))); section.appendChild(ul); briefing.appendChild(section); }
  slideEl.appendChild(briefing);
  counterEl.textContent = `${index + 1} / ${slides.length}`;
  prevBtn.disabled = index === 0;
  nextBtn.disabled = index === slides.length - 1;
}
prevBtn.addEventListener('click', () => { index = Math.max(0, index - 1); render(); });
nextBtn.addEventListener('click', () => { index = Math.min(slides.length - 1, index + 1); render(); });
document.addEventListener('keydown', event => { if (event.key === 'ArrowLeft') prevBtn.click(); if (event.key === 'ArrowRight') nextBtn.click(); });
render();
</script>
</body>
</html>
