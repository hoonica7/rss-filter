<title>Daily Paper Slideshow</title>
<style>
  :root {
    color-scheme: light;
    --bg: #f6f7f4;
    --paper: #ffffff;
    --ink: #111827;
    --muted: #64748b;
    --line: #d8ddd2;
    --accent: #176b87;
    --accent-2: #9a3412;
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; overflow: auto; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: var(--bg); color: var(--ink); }
  .shell { max-width: 1500px; min-height: 100vh; margin: 0 auto; padding: 14px 18px; display: flex; flex-direction: column; }
  .topbar { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 16px; }
  .top-actions { display: flex; align-items: center; gap: 10px; }
  .topbar a, button { border: 1px solid var(--line); border-radius: 8px; background: var(--paper); color: var(--ink); padding: 10px 14px; font-weight: 700; text-decoration: none; cursor: pointer; }
  button.primary { background: var(--accent); border-color: var(--accent); color: white; }
  button:disabled { opacity: 0.45; cursor: not-allowed; }
  .counter { color: var(--muted); font-weight: 700; }
  .slide { min-height: calc(100vh - 82px); background: var(--paper); border: 1px solid var(--line); border-radius: 10px; padding: 18px; box-shadow: 0 18px 42px rgba(15, 23, 42, 0.10); display: grid; grid-template-columns: minmax(310px, 0.86fr) minmax(0, 1.55fr); gap: 18px; overflow: visible; }
  .paper-head { min-width: 0; min-height: 0; overflow: visible; display: flex; flex-direction: column; gap: 12px; }
  .figure { margin: 0; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: #f8fafc; }
  .figure img { display: block; width: 100%; max-height: 41vh; object-fit: contain; background: white; }
  .figure figcaption { padding: 7px 10px; color: var(--muted); font-size: 12px; line-height: 1.3; }
  .head-text { display: flex; flex-direction: column; gap: 9px; min-width: 0; }
  .badges { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .badge { border-radius: 999px; padding: 5px 9px; background: #eef2ff; color: #3730a3; font-size: 12px; font-weight: 800; }
  .score { background: #fee2e2; color: #991b1b; }
  h1 { margin: 0; font-size: 25px; line-height: 1.15; letter-spacing: 0; overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
  h1 a { color: inherit; text-decoration-color: rgba(23, 107, 135, 0.35); text-decoration-thickness: 2px; text-underline-offset: 4px; }
  h1 a:hover { color: var(--accent); text-decoration-color: var(--accent); }
  .meta, .authors, .why, .abstract { font-size: 13px; line-height: 1.45; }
  .meta, .authors { color: var(--muted); }
  .why strong, .abstract strong, .authors strong { color: var(--ink); }
  .authors { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .why { border-left: 4px solid var(--accent-2); padding-left: 10px; color: #374151; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .abstract { border-top: 1px solid var(--line); padding-top: 14px; color: #374151; }
  .original-abstract { border-top: 1px solid var(--line); padding-top: 10px; color: #374151; font-size: 11.5px; line-height: 1.35; overflow-wrap: anywhere; }
  .original-abstract strong { display: block; margin-bottom: 4px; color: var(--ink); }
  .tags { display: flex; flex-wrap: wrap; gap: 8px; }
  .tag { border-radius: 999px; padding: 4px 8px; background: #f1f5f9; color: #475569; font-size: 12px; font-weight: 700; }
  .head-text > .link { display: none; }
  .briefing { min-width: 0; min-height: 0; overflow: visible; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); grid-auto-rows: minmax(0, auto); align-content: start; gap: 11px 18px; border-top: 0; padding-top: 0; }
  .brief-section { min-width: 0; }
  .brief-section.wide { grid-column: 1 / -1; }
  .brief-section h2 { margin: 0 0 4px; font-size: 14px; line-height: 1.22; color: #0f766e; letter-spacing: 0; }
  .brief-section p, .brief-section li { margin: 0; font-size: 12.5px; line-height: 1.42; color: #1f2937; overflow-wrap: anywhere; }
  .brief-section ul { margin: 0; padding-left: 20px; }
  .concepts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 9px 14px; }
  .concept { border-top: 1px solid var(--line); padding-top: 7px; }
  .concept h3 { margin: 0 0 4px; font-size: 13px; color: #7c2d12; letter-spacing: 0; }
  .concept p { margin: 2px 0 0; font-size: 11.5px; line-height: 1.35; color: #374151; overflow-wrap: anywhere; }
  .concept b { color: #111827; }
  .link { color: var(--accent); font-weight: 800; text-decoration: none; }
  .empty { padding: 48px; background: var(--paper); border: 1px solid var(--line); border-radius: 12px; color: var(--muted); }
  @media (max-width: 860px) {
    .shell { padding: 14px; }
    .topbar, .top-actions { align-items: stretch; flex-direction: column; }
    .slide, .briefing, .concepts { grid-template-columns: 1fr; }
    .slide { min-height: auto; overflow: visible; display: grid; }
    h1 { font-size: 28px; }
  }
</style>

<script>
const slides = [{"title": "Hund's coupling governed orbital-selective superconductivity in Ba1−xKxFe2As2", "journal": "PRB_Recent", "source": "author whitelist", "link": "http://link.aps.org/doi/10.1103/yry8-qdm6", "authors": "Elena Corbae, Rong Zhang, Cong Li, et al.", "last_authors": "Donghui Lu, Zhi-Xun Shen", "summary": "Author(s): Elena Corbae, Rong Zhang, Cong Li, Kunihiro Kihou, Chul-Ho Lee, Makoto Hashimoto, Thomas Devereaux, Oscar Tjernberg, Egor Babaev, Dung-Hai Lee, Vadim Grinenko, Donghui Lu, and Zhi-Xun Shen While the influence of electronic correlations on superconductivity is a defining question, identifying how these correlations manifest in the superconducting state remains difficult. Furthermore, in multiorbital systems, correlations driven by Hund’s coupling can differentiate the behavior of individual orbitals, and how such orbital selectivity governs superconducting pairing has remained largely unexplored experimentally. Here, the authors use angle-resolved photoemission spectroscopy to experimentally determine the superconducting gap of a representative iron-based superconductor as the Hund’s coupling influence increases. They find increased correlation diminishes the superconducting gap in an orbital-selective way, suggesting that Hund’s coupling plays a central role in shaping pairing in multiorbital superconductors. [Phys. Rev. B 113, 224517] Published Fri Jun 12, 2026", "tier": "A_MUST_READ", "score": "10", "reason": "author whitelist: Makoto Hashimoto", "tags": ["angle-resolvedphotoemission", "photoemission", "superconduct"], "image": "", "briefing": {"background": "철 기반 초전도체(FeSC)와 같은 다중 궤도 시스템에서 전자 상관관계가 초전도 상태에 미치는 영향은 응집물질물리학의 핵심 과제입니다. 특히 훈트 결합(Hund's coupling)은 전자 간 상호작용을 강화하고 궤도 선택적 물리 현상을 유도하는 주요 원인으로 지목됩니다.", "motivation": "훈트 결합의 세기가 변화함에 따라 개별 궤도에서 초전도 갭(superconducting gap)이 어떻게 반응하는지 실험적으로 확인하고자 했습니다.", "result": "Ba1-xKxFe2As2 시스템에서 전자 상관관계가 증가함에 따라 특정 궤도에서 초전도 갭이 감소하는 현상을 ARPES로 관측하여, 훈트 결합이 궤도 선택적 방식으로 초전도 페어링을 제어함을 입증했습니다.", "implication": "다중 궤도 시스템의 초전도 메커니즘을 이해하는 데 훈트 결합의 역할을 정립하였으며, 이는 향후 강상관 전자계 초전도체 설계의 중요한 지표가 될 것입니다.", "novelty": "이론적으로 제안되던 궤도 선택적 초전도성을 실제 FeSC 물질에서 ARPES를 통해 직접 관측했다는 점에서 높은 가치가 있습니다.", "unresolved": "훈트 결합이 구체적으로 어떤 페어링 상호작용(예: 스핀 변동)을 통해 갭 감소를 유도하는지에 대한 미시적 메커니즘은 추가 연구가 필요합니다.", "future_work": "다른 FeSC 화합물로의 확장 연구 및 훈트 결합의 변화가 페르미 면 위상의 변형에 미치는 영향에 대한 정밀 분석이 예상됩니다.", "concepts": [{"term": "훈트 결합(Hund's coupling)", "why_emerged": "다중 궤도 시스템에서 전자들이 같은 궤도를 점유하기보다 다른 궤도를 차지하며 스핀을 평행하게 정렬하려는 에너지를 설명하기 위해 필요합니다.", "origin": "Friedrich Hund(1925년 제안)", "connections": "강상관 전자계, 철 기반 초전도체, 궤도 선택적 모트 전이"}, {"term": "궤도 선택적 초전도성", "why_emerged": "멀티 궤도 시스템에서 특정 궤도만 강하게 상관되어 초전도성에 차등적인 기여를 하는 현상을 설명하기 위해 등장했습니다.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "다중 궤도 Hubbard 모델, 훈트 금속"}], "english_summary": ["Investigated orbital-selective superconductivity in Ba1-xKxFe2As2 using ARPES.", "Demonstrated that increased electronic correlations, driven by Hund's coupling, suppress the superconducting gap in an orbital-dependent manner.", "Provides experimental evidence that Hund's coupling is a primary factor in the pairing physics of multiorbital superconductors."]}}, {"title": "Detecting the full photoemission cone from laser-based ARPES experiments by leveraging deflector technology (Rev. Sci. Instrum.)", "journal": "arXiv_CondMat", "source": "keyword", "link": "https://arxiv.org/abs/2601.17099", "authors": "Nicolas Gauthier, Benson Kwaku Frimpong, Dario Armanno, et al.", "last_authors": "Francois L\\'egar\\'e, Fabio Boschini", "summary": "arXiv:2601.17099v2 Announce Type: replace Abstract: Angle-resolved photoemission spectroscopy (ARPES) provides a direct access to the electronic band structure of solid and molecular systems. The momentum range accessible by this technique depends directly on the photon energy used, and low-photon-energy sources are insufficient to photoemit electrons over the full Brillouin zone of most quantum materials. In addition, while electrons are emitted over a 2$\\pi$ solid angle, conventional hemispherical analyzers only collect a small subset of those electrons. A previous work [RSI 92, 123907 (2021)] demonstrated that electrons emitted over a larger field-of-view can be acquired in one fixed configuration by accelerating them towards the analyzer with a bias voltage. Here, we extend this work by leveraging the deflector technology of novel ARPES hemispherical analyzers. We demonstrate the ability to detect all $2\\pi$ photoemitted electrons in a fixed configuration for various materials such as gold, cuprates and transition-metal dichalcogenides. This approach is especially advantageous for time-resolved ARPES, as electron dynamics over a large momentum range can be accessed with identical measurement conditions.", "tier": "A_MUST_READ", "score": "10", "reason": "title strong match: ARPES", "tags": ["ARPES", "angle-resolvedphotoemission", "photoemission", "cuprate", "bandstructure"], "image": "https://arxiv.org/html/2601.17099v2/fig1e.png", "briefing": {"background": "ARPES는 고체의 전자 구조를 직접 측정하는 강력한 도구이지만, 광자 에너지 제한으로 인해 브릴루앙 존 전체를 한 번에 측정하기 어렵고, 기존 분석기는 방출되는 전자 중 일부만 수집한다는 한계가 있었습니다.", "motivation": "고정된 실험 구성에서 더 넓은 운동량 영역의 광전자 정보를 효율적으로 수집하여 데이터 처리 효율과 시간 분해능을 개선하고자 했습니다.", "result": "최신 편향 장치(deflector) 기술을 활용하여 2π 전 영역에서 방출되는 광전자를 수집하는 기술을 구현했습니다.", "implication": "다양한 물질(금속, 초전도체, TMD)의 밴드 구조를 단일 구성으로 완전하게 측정할 수 있어 시간 분해(TR-ARPES) 실험의 신뢰성과 효율을 크게 높일 수 있습니다.", "novelty": "데이터 수집 범위를 획기적으로 확장하여, 특히 비평형 동역학 측정 시 측정 조건의 변화 없이 전체 브릴루앙 존을 관찰할 수 있게 되었습니다.", "unresolved": "편향 전압을 가할 때 발생하는 전자 렌즈 효과로 인한 에너지 분해능 저하 가능성 및 최적의 보정 알고리즘 구축이 과제로 남아 있습니다.", "future_work": "시간 분해 ARPES 시스템에 이 기술을 본격 도입하여 초고속 전자 동역학 및 밴드 구조 변화의 미세 관찰이 수행될 것입니다.", "concepts": [{"term": "편향 기술(Deflector technology)", "why_emerged": "광전자 분석기 입구로 들어오는 전자들의 궤적을 전기적으로 제어하여 더 넓은 각도의 정보를 수집하기 위해 필요합니다.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "ARPES 분석기 성능 향상, 2D 물질 전자 구조 분석"}, {"term": "시간 분해 ARPES (TR-ARPES)", "why_emerged": " connections": "격자 탄성론(Lattice elasticity), 위상 결함(Topological defects)."}], "english_summary": ["Investigates the topological nature of dislocations in skyrmion lattices.", "Reveals that dislocations possess internal core structures and undergo topological phase transitions.", "Moves beyond Kittel's simplistic magnetic-polar analogy to describe lattice elasticity.", "Provides a deeper theoretical framework for topological defects in magnetic topological materials."]}}, {"title": "Exploring the third dimension in quantum confinement of surface electrons", "journal": "Science_Advances", "source": "Gemini", "link": "https://doi.org/10.1126/sciadv.aed3926", "authors": "Lu Lyu, Tobias Eul, Wei Yao, et al.", "last_authors": "Martin Aeschlimann, Benjamin Stadtmüller", "summary": "Quantum confinement of surface electrons in two-dimensional metal-organic networks offers a powerful route to engineer electronic states for quantum and spintronic technologies. Here, we demonstrate the pivotal role of vertical variations in the surface potential on the quantum confinement of surface electrons. We investigate the confinement of both Shockley surface state and image-potential state electrons with their distinct vertical electron density distributions in a Cu-T4PT network on Cu(111). We find a substantial renormalization of the band mass of the image state, whereas the Shockley state remains almost unchanged. This notable divergence arises from the distinct three-dimensional potential landscape of the Cu-T4PT network, with a strong repulsive potential at the vertical position of the molecular backbone and leaky channels beneath the Cu coordination spheres. Our findings demonstrate the essential role of vertical potential engineering in designing quantum-confined states, thereby advancing control over electronic properties and quantum phenomena at the nanoscale.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Direct experimental study of quantum confinement of surface electrons, highly relevant to electronic structure.", "tags": ["electronicstructure", "quantumconfinement", "surfacescience", "2Dmaterials", "STM/STS"], "image": "", "briefing": {"background": "양자 구속(Quantum Confinement)은 전자의 운동이 2차원 또는 1차원으로 제한될 때 발생하는 현상으로, 전자의 에너지 준위가 불연속적으로 변하게 됩니다. 이는 반도체 양자점, 양자 우물 등의 나노 구조에서 전자의 거동을 제어하고 새로운 물성을 발현시키는 데 중요한 역할을 하며, 양자 및 스핀트로닉 기술의 기반이 됩니다. 특히 표면 전자 상태는 외부 환경에 민감하여 조절 가능성이 높기 때문에 많은 연구가 이루어지고 있습니다.", "motivation": "기존 연구에서는 주로 2차원 평면에서의 양자 구속 현상에 초점을 맞추었으나, 이 논문은 표면 전자의 양자 구속에 있어 '수직 방향'의 전위 변화가 미치는 영향을 탐구하고자 했습니다. 즉, 단순히 2차원적인 구속을 넘어 3차원 공간에서 전위가 어떻게 분포하고 변화하는지가 표면 전자 상태에 어떤 결정적인 역할을 하는지 밝히는 것이 목표입니다.", "result": "구리-테트라페닐테트라피리딜포르피린(Cu-T4PT) 네트워크가 형성된 Cu(111) 표면에서 쇼클리 표면 상태(Shockley surface state)와 이미지-전위 상태(image-potential state) 전자의 구속을 조사했습니다. 그 결과, 이미지-전위 상태 전자의 띠 질량(band mass)이 크게 재규격화(renormalization)되는 반면, 쇼클리 상태는 거의 변하지 않음을 발견했습니다. 이러한 현상은 Cu-T4PT 네트워크의 독특한 3차원 전위 환경, 즉 분자 골격 위치에서의 강한 반발 전위와 구리 배위 구 아래의 누출 통로(leaky channels) 때문임을 밝혀냈습니다.", "implication": "만약 이 결과가 정확하다면, 표면 전자 상태의 양자 구속을 설계하고 제어하는 데 있어서 단순히 평면적인 구조뿐만 아니라 수직 방향의 전위 공학이 핵심적인 역할을 한다는 것을 의미합니다. 이는 나노 스케일에서 전자의 특성 및 양자 현상을 더욱 정교하게 제어할 수 있는 새로운 가능성을 열어줄 것입니다.", "novelty": "이 연구는 STM/STS를 사용하여 표면 전자의 양자 구속 현상을 '3차원적인 전위 환경'이라는 새로운 관점에서 직접 실험적으로 탐구했다는 점에서 중요합니다. 특히 쇼클리 표면 상태와 이미지-전위 상태가 수직 방향 전위 변화에 대해 상이한 반응을 보이는 것을 명확히 보여주며, 이는 표면 전자 구조 연구와 STM/STS 기술 활용에 대한 깊은 이해를 제공합니다. 독자에게는 ARPES, STM/STS를 통한 전자 구조 연구에 대한 직접적인 관련성이 높습니다.", "unresolved": "추상적인 정보만으로는 명확한 미해결 과제를 특정하기 어렵습니다. 다만, 이 연구에서 밝혀진 3차원 전위 설계 원리를 다른 금속-유기 네트워크나 다양한 기판에 적용했을 때도 유사한 현상이 나타나는지 추가적인 검증이 필요할 수 있습니다. 또한, 이 3차원 전위가 스핀 자유도에 미치는 영향은 추가 탐구 영역일 수 있습니다.", "future_work": "향후 연구에서는 이러한 수직 방향 전위 공학 원리를 활용하여 특정 스핀 또는 전하 특성을 가진 양자 구속 상태를 설계하고, 이를 양자 컴퓨팅이나 스핀트로닉 소자에 응용하는 방향으로 나아갈 수 있을 것입니다. 또한, 시간 분해능이 있는 기술을 사용하여 전자의 동역학에 대한 3차원 전위의 영향을 연구할 수 있습니다.", "concepts": [{"term": "Quantum Confinement (양자 구속)", "why_emerged": "물질의 크기가 전자의 드 브로이 파장 수준으로 작아질 때, 전자의 에너지가 양자화되어 불연속적인 에너지 준위를 갖게 되는 현상을 설명하기 위해 필요했습니다.", "origin": "양자역학의 기본 원리에서 비롯되었으며, 1970년대 후반 양자 우물 등의 반도체 나노구조에서 실험적으로 관찰되고 이론적으로 설명되기 시작했습니다.", "connections": "반도체 양자점(quantum dot), 양자 우물(quantum well), 양자선(quantum wire), 2D 물질(2D materials) 등 다양한 나노 구조의 전자 물성 이해에 필수적이며, 레이저, 트랜지스터, 태양전지 등의 소자 개발에 응용됩니다."}, {"term": "Shockley surface state (쇼클리 표면 상태)", "why_emerged": "결정 표면에서 원자 배열의 단절로 인해 발생하는 새로운 전자 상태를 설명하기 위해 도입되었습니다. 표면에서만 존재하며 벌크(bulk) 내부에 침투하지 못하는 특성을 가집니다.", "origin": "Walter Shockley가 1939년에 이론적으로 예측했으며, 이후 다양한 금속 및 반도체 표면에서 실험적으로 확인되었습니다.", "connections": "Tamm surface state와 함께 표면 전자 상태의 중요한 두 가지 유형 중 하나입니다. 금속 표면의 스핀 분할(spin splitting), 표면 재구성(surface reconstruction), 촉매 반응 등 다양한 표면 현상과 관련이 있습니다."}, {"term": "Image-potential state (이미지-전위 상태)", "why_emerged": "금속 표면 위에 전자가 있을 때, 전자가 표면 내부에 유도하는 양전하(이미지 전하)와의 인력에 의해 형성되는 구속된 전자 상태를 설명하기 위해 필요했습니다. 전자는 금속 표면 위, 즉 진공 쪽으로 형성된 전위 우물에 갇히게 됩니다.", "origin": "1930년대 초반 J. J. Thomson에 의해 이미지 전하 개념이 도입되었고, 1970년대 이후 실험적으로 직접 관찰되기 시작했습니다.", "connections": "양자 구속 상태의 일종으로, 금속 표면의 작업 함수(work function), 전자의 산란 메커니즘, 초고속 표면 동역학 연구 등에 활용됩니다."}, {"term": "Band mass renormalization (띠 질량 재규격화)", "why_emerged": "결정 내 전자가 주변 환경(다른 전자, 포논, 불순물 등)과의 상호작용으로 인해 진공에서의 자유 전자 질량과 다른 '유효 질량(effective mass)'을 갖게 되는 현상을 설명하기 위해 사용됩니다. 상호작용이 강할수록 유효 질량은 크게 변할 수 있습니다.", "origin": "고체 물리학에서 전자의 유효 질량 개념은 1930년대 Bloch 이론과 Band 이론의 발전과 함께 정립되었습니다. '재규격화'는 이러한 상호작용 효과를 포함하여 유효 질량이 '원래 값'과 달라지는 것을 강조하는 표현입니다.", "connections": "강상관 물질, 페르미 액체 이론, 양자 다체 이론 등에서 중요한 개념으로, 전자의 이동도(mobility), 비열(specific heat) 등 다양한 수송 및 열적 특성을 이해하는 데 필수적입니다."}], "english_summary": ["This study explores the crucial role of vertical potential variations in quantum confinement of surface electrons.", "Using STM/STS on a Cu-T4PT network on Cu(111), researchers observed a significant renormalization of the image-potential state's band mass, while the Shockley state remained largely unaffected.", "This divergence is attributed to the unique 3D potential landscape, featuring a repulsive potential at the molecular backbone and leaky channels.", "The findings highlight vertical potential engineering as essential for designing quantum-confined states, enhancing control over nanoscale electronic properties.", "This provides new insights into electronic structure engineering, particularly relevant for STM/STS users interested in quantum confinement."]}}, {"title": "Single-particle tunneling spectrum with a robust superconducting gap in La 2 PrNi 2 O 7 thin films at ambient pressure", "journal": "Science_Advances", "source": "Gemini", "link": "https://doi.org/10.1126/sciadv.aeg2429", "authors": "Shengtai Fan, Mengjun Ou, Marius Scholten, et al.", "last_authors": "Ilya M. Eremin, Hai-Hu Wen", "summary": "The recent discovery of high-temperature superconductivity in nickelate systems has generated tremendous interest in the community. The core issue to understand the pairing mechanism is the superconducting gap and its symmetry. We have successfully synthesized the superconducting thin films of La 2 PrNi 2 O 7 with an onset transition temperature of 41.5 kelvins and measured the superconducting tunneling spectra after exposing the superconducting layer by using the tip-excavation technique. The spectrum shows a robust superconducting gap at about Δ ≈ 19 milli–electron volts, and fittings based on the Dynes model indicate that this dominant gap should have an s -wave structure with low anisotropy, which allows us to put the priority in selecting the s ± pairing symmetry. Furthermore, a clear hump structure is observed at an energy of 49 ± 2 milli–electron volts, which is inclined to be interpreted as a bosonic mode. Our results help clarify the mystery of superconductivity in bilayer nickelate superconductors.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Unconventional superconductivity in nickelates, using tunneling spectroscopy for electronic structure.", "tags": ["superconductivity", "nickelate", "STM/STS"], "image": "", "briefing": {"background": "구리 기반 고온 초전도체(cuprates)와 철 기반 초전도체(iron pnictides/chalcogenides)의 발견 이후, 새로운 유형의 고온 초전도체를 찾는 연구가 활발히 진행되고 있습니다. 최근 니켈 기반 산화물(nickelates)에서 고온 초전도 현상이 발견되면서, 이 물질들이 구리계 초전도체와 유사한 메커니즘을 가질지 혹은 완전히 새로운 메커니즘을 가질지에 대한 커뮤니티의 관심이 집중되고 있습니다. 초전도성의 핵심은 전자쌍을 형성하는 메커니즘을 이해하는 것이며, 이를 위해 초전도 갭(superconducting gap)의 크기와 대칭성을 결정하는 것이 중요합니다.", "motivation": "최근 니켈산화물 시스템에서 고온 초전도성이 발견되었지만, 그 근본적인 페어링 메커니즘과 초전도 갭의 대칭성에 대한 이해는 아직 부족합니다. 이 논문은 La2PrNi2O7 박막에서 강건한 초전도 갭을 측정하고, 그 대칭성을 규명하여 이중층 니켈산화물 초전도체의 미스터리를 해명하는 데 기여하고자 했습니다.", "result": "La2PrNi2O7 박막에서 41.5 K의 초전도 전이 온도를 확인하고, 팁 발굴(tip-excavation) 기법을 사용하여 초전도층을 노출시킨 후 단일 입자 터널링 스펙트럼(single-particle tunneling spectrum)을 측정했습니다. 스펙트럼은 약 19 meV의 강건한 초전도 갭을 보여주었으며, Dynes 모델 피팅 결과 이 주된 갭이 낮은 이방성(anisotropy)을 가진 s-파 대칭성을 가짐을 시사하여 s± 페어링 대칭성을 우선 고려하게 했습니다. 또한, 49 ± 2 meV 에너지에서 명확한 험프(hump) 구조가 관찰되었는데, 이는 보손 모드(bosonic mode)로 해석될 가능성이 높습니다.", "implication": "만약 이 결과가 정확하다면, La2PrNi2O7과 같은 이중층 니켈산화물 초전도체의 페어링 메커니즘은 s-파 대칭성을 기반으로 할 가능성이 높다는 것을 의미합니다. 이는 구리계 초전도체의 d-파 대칭성과는 다른 특징을 가지며, 새로운 고온 초전도 메커니즘 연구에 중요한 방향을 제시할 수 있습니다. 또한 관찰된 보손 모드는 페어링에 관여하는 매개체를 이해하는 데 중요한 단서가 될 수 있습니다.", "novelty": "이 연구는 니켈산화물 초전도체, 특히 La2PrNi2O7 물질에서 초전도 갭의 크기와 대칭성을 STM/STS를 통해 직접 실험적으로 규명했다는 점에서 중요합니다. 특히 s-파 대칭성 가능성을 제시하고 보손 모드를 관찰한 것은 니켈산화물의 비전통적 초전도성을 이해하는 데 큰 진전입니다. 독자는 니켈산화물, 비전통적 초전도성, 그리고 STM/STS를 통한 전자 구조 연구에 강한 관심을 가지고 있어 매우 관련성이 높습니다.", "unresolved": "s-파 대칭성이 주된 갭으로 제시되었지만, 이방성이 낮다는 것 외에 정확한 s-파의 형태(예: s++ 또는 s±)에 대한 추가적인 확증은 필요합니다. 또한, 관찰된 보손 모드가 정확히 어떤 기원에서 왔는지(예: 스핀, 격자 진동)에 대한 추가적인 연구가 필요합니다. 이중층 니켈산화물에서 초전도성이 발현되는 미시적 메커니즘에 대한 완전한 이해는 아직 미해결 과제입니다.", "future_work": "향후 연구에서는 각도 분해능이 있는 터널링 분광법이나 ARPES와 같은 다른 실험 기술을 통해 갭의 이방성을 더 정밀하게 조사하고, 보손 모드의 기원을 밝히는 실험 및 이론 연구가 진행될 수 있습니다. 또한, 물질의 도핑 의존성이나 외부 압력 하에서의 갭 특성 변화를 연구하여 페어링 메커니즘에 대한 종합적인 이해를 구축할 수 있을 것입니다.", "concepts": [{"term": "Nickelate (니켈산화물)", "why_emerged": "구리산화물과 유사한 전자 구조를 가질 수 있어 새로운 고온 초전도체 후보 물질로 오랫동안 연구되었으나, 최근에서야 고온 초전도성이 실험적으로 발견되면서 큰 주목을 받게 되었습니다.", "origin": "니켈산화물은 오래전부터 존재하던 물질군이지만, 고온 초전도성이 처음 발견된 것은 2019년 LaNiO2에서 Sr 도핑을 통해 보고되었습니다. 이 논문은 이중층 니켈산화물인 La2PrNi2O7에 대한 것입니다.", "connections": "구리산화물 초전도체(cuprates), 희토류 기반 니켈산화물(Ruddlesden-Popper nickelates), 비전통적 초전도성, 강상관 전자계와 밀접하게 관련되어 있으며, 새로운 초전도 메커니즘 탐색의 주요 분야입니다."}, {"term": "Superconducting gap (초전도 갭)", "why_emerged": "초전도 상태에서 전자들이 쿠퍼 쌍(Cooper pair)을 형성하여 바닥 상태로 응축될 때, 페르미 면 근처에 형성되는 에너지 간극을 설명하기 위해 도입되었습니다. 이 갭은 전자쌍을 깨뜨리는 데 필요한 최소 에너지입니다.", "origin": "BCS 이론(Bardeen-Cooper-Schrieffer theory)에서 처음으로 이론적으로 설명되었으며, 초전도체에서 전자-포논 상호작용에 의해 발생하는 것으로 제안되었습니다. 조셉슨 효과(Josephson effect)나 터널링 실험을 통해 실험적으로 측정되었습니다.", "connections": "BCS 이론, 페어링 메커니즘, 초전도 전이 온도(Tc), 특정 열(specific heat), 터널링 분광법(tunneling spectroscopy), ARPES 등 다양한 초전도 물성과 현상을 이해하고 측정하는 데 핵심적인 개념입니다."}, {"term": "s-wave symmetry (s-파 대칭성)", "why_emerged": "초전도 갭의 공간적 대칭성을 분류하기 위해 사용되는 용어입니다. s-파 대칭성은 초전도 갭이 페르미 면에서 거의 등방적(isotropic)이고 부호가 바뀌지 않는 대칭성을 가짐을 의미합니다.", "origin": "초전도 페어링 이론에서 각운동량(angular momentum)을 기반으로 쿠퍼 쌍의 파동 함수를 분류하는 과정에서 도입되었습니다. BCS 초전도체에서 흔히 나타나는 대칭성입니다.", "connections": "d-파 대칭성(구리계 초전도체), p-파 대칭성(일부 중금속 페르미온 물질), f-파 대칭성 등 다른 갭 대칭성과 대비됩니다. 갭 대칭성은 초전도체의 페어링 메커니즘과 직접적으로 관련되어 있습니다."}, {"term": "Bosonic mode (보손 모드)", "why_emerged": "초전도체에서 전자들이 쿠퍼 쌍을 형성하는 매개체 역할을 하는 양자화된 진동(quanta of oscillation)을 설명하기 위해 도입되었습니다. 이는 주로 포논(phonons)일 수 있지만, 스핀 플럭츄에이션(spin fluctuations)이나 다른 전자적 여기(excitations)일 수도 있습니다.", "origin": "BCS 이론에서 전자가 포논을 교환하여 쿠퍼 쌍을 형성한다는 아이디어에서 비롯되었으며, 이후 비전통적 초전도체에서는 포논 외의 다른 보손 모드가 페어링에 기여할 수 있다는 가설이 제기되었습니다.", "connections": "전자-포논 결합(electron-phonon coupling), 스핀-플럭츄에이션, 램지 밴드(Raman scattering), 중성자 산란(neutron scattering), 초전도 터널링 스펙트럼의 험프 구조 등과 연관되어 페어링 메커니즘을 규명하는 중요한 단서가 됩니다."}], "english_summary": ["This study reports robust s-wave-like superconductivity in La2PrNi2O7 thin films with a critical temperature of 41.5 K.", "Using STM/STS, a dominant superconducting gap of ~19 meV was measured, with Dynes model fitting indicating an s-wave structure with low anisotropy.", "A clear bosonic mode was also observed at 49 meV, suggesting its potential role in the pairing mechanism.", "These results provide crucial insights into the pairing symmetry of bilayer nickelate superconductors, prioritizing s± pairing.", "This work is highly relevant for researchers interested in unconventional superconductivity in nickelates and electronic structure via STM/STS."]}}, {"title": "Kohn--Luttinger Superconductivity in Flat Chern Bands", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2606.17205", "authors": "Nianlong Zou, Cheng Xu, Yafis Barlas, Yang Zhang", "last_authors": "Yafis Barlas, Yang Zhang", "summary": "arXiv:2606.17205v1 Announce Type: new Abstract: Recent observations of superconductivity near correlated topological phases in flat bands suggest a facile link between flat-band geometry and electron pairing. In this work, we reveal a geometry-driven Kohn--Luttinger mechanism in which Landau-level-like form factors align the attractive lobe of the RPA-screened Coulomb interaction with the form-factor peak, generating an anomalously strong attractive channel near local band extrema. Using the Skyrmion lattice model as a minimal realization, we show that for spin-unpolarized pairing the form-factor magnitude enforces an emergent momentum-space translational symmetry and selects an extended-$s$ instability concentrated at small Fermi pockets, while for spin-polarized pairing the form-factor phase drives chiral $p$- and $f$-wave order without invoking spin fluctuations. The band-extrema enhancement persists in higher Landau-level analogs and survives finite-temperature screening and Berezinskii--Kosterlitz--Thouless phase fluctuations. Our work establishes quantum geometry as a key organizing principle for unconventional pairing in flat Chern bands.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Theory of unconventional pairing in flat bands, relevant to the moire and correlated community.", "tags": ["theory", "superconductivity", "topological"], "image": "https://arxiv.org/html/2606.17205v1/x1.png", "briefing": {"background": "평탄 밴드(flat bands)는 전자의 운동 에너지가 거의 없어 전자-전자 상호작용이 지배적이게 되는 특수한 전자 구조를 가집니다. 이는 모아레(moire) 물질이나 일부 강상관 물질에서 관찰되며, 비전통적인 초전도성, 자성 등 다양한 양자 현상을 유도할 수 있습니다. 특히 위상학적으로 비자명한 평탄 밴드(flat Chern bands)는 상관관계와 위상학적 특성이 동시에 발현되는 흥미로운 영역으로, 여기서의 초전도 페어링 메커니즘을 이해하는 것이 중요합니다.", "motivation": "최근 평탄 밴드에서 상관관계와 위상학적 특성이 결합된 초전도성이 관찰되면서, 평탄 밴드의 기하학적 특성과 전자 페어링 사이의 연관성이 주목받고 있습니다. 이 논문은 평탄 체른 밴드(flat Chern bands)에서 양자 기하학적 특성에 의해 유도되는 콘-루팅거(Kohn-Luttinger) 메커니즘이 어떻게 비전통적 초전도성을 발생시키는지 이론적으로 규명하고자 했습니다.", "result": "연구는 '기하학적 특성에 의해 유도되는 콘-루팅거 메커니즘'을 제안합니다. 이 메커니즘에서 란다우 준위(Landau-level)와 유사한 형태 인자(form factors)가 RPA(Random Phase Approximation) 스크리닝된 쿨롱 상호작용의 인력 로브(attractive lobe)를 형태 인자 피크(peak)와 정렬시켜 국소적인 밴드 극단(band extrema) 근처에서 이례적으로 강한 인력 채널을 생성합니다. 스커미온 격자(Skyrmion lattice) 모델을 통해 스핀 비분극 페어링(spin-unpolarized pairing)에서는 형태 인자 크기가 운동량 공간 병진 대칭성을 유도하고 작은 페르미 포켓(Fermi pockets)에 집중된 확장 s-파 불안정성을 선택하며, 스핀 분극 페어링(spin-polarized pairing)에서는 형태 인자 위상(phase)이 스핀 요동 없이 카이럴 p-파 및 f-파 질서(order)를 유도함을 보였습니다. 이러한 밴드 극단의 향상은 고차 란다우 준위 유사체에서도 유지되며, 유한 온도 스크리닝 및 BKT(Berezinskii-Kosterlitz-Thouless) 상 요동에서도 살아남습니다.", "implication": "이 결과가 옳다면, 평탄 체른 밴드에서 양자 기하학적 특성이 비전통적 초전도 페어링의 핵심적인 조직 원리임을 의미합니다. 이는 모아레 물질과 같은 평탄 밴드 시스템에서 초전도성 발현을 이해하고 예측하는 새로운 이론적 프레임워크를 제공합니다. 또한, 스핀 요동 없이 카이럴 p-파 및 f-파 초전도성을 유도할 수 있다는 점은 위상 초전도체 연구에 중요한 방향을 제시합니다.", "novelty": "이 연구는 평탄 체른 밴드에서 '양자 기하학적 특성'이 비전통적 초전도성을 유도하는 새로운 '콘-루팅거 메커니즘'을 제안했다는 점에서 매우 독창적입니다. 특히, 형태 인자의 역할과 스핀 분극 여부에 따른 다양한 초전도 대칭성(확장 s-파, 카이럴 p-파, f-파) 예측은 모아레 물질이나 위상 물질에서의 비전통적 초전도성 연구에 중요한 이론적 기반을 제공합니다. 독자는 모아레/트위스트 이중층, 비전통적 초전도성, 위상학적 개념에 관심이 많으므로 매우 관련성이 높습니다.", "unresolved": "이론적 예측이므로, 제안된 콘-루팅거 메커니즘과 그로 인한 초전도 대칭성(확장 s-파, 카이럴 p-파, f-파)이 실제 평탄 체른 밴드 물질에서 실험적으로 어떻게 검증될 수 있는지에 대한 추가적인 논의가 필요합니다. 또한, 현실 물질에서 이 메커니즘이 다른 페어링 메커니즘과 어떻게 경쟁하거나 공존하는지에 대한 깊이 있는 분석이 필요할 수 있습니다.", "future_work": "향후 연구에서는 이 이론적 프레임워크를 실제 모아레 물질(예: 트위스트 이중층 그래핀)에 적용하여 초전도성 발현의 실험 결과를 설명하고 예측하는 데 활용할 수 있을 것입니다. 또한, 제안된 카이럴 p-파 및 f-파 초전도성을 실험적으로 탐색하기 위한 구체적인 물질 설계나 실험 제안이 이어질 수 있습니다.", "concepts": [{"term": "Flat Chern Bands (평탄 체른 밴드)", "why_emerged": "모아레 물질과 같은 시스템에서 전자의 운동 에너지가 거의 0에 가까운 '평탄 밴드'가 나타나면서, 여기에 위상학적 특성인 '체른 수(Chern number)'가 결합된 경우를 설명하기 위해 필요했습니다. 이는 강상관 효과와 위상학적 특성이 동시에 중요한 역할을 하는 새로운 물리 현상을 탐구하는 데 중요합니다.", "origin": "평탄 밴드 자체는 다양한 결정 구조에서 예측되었으나, '평탄 체른 밴드'라는 개념은 모아레 시스템, 특히 트위스트 이중층 그래핀에서 나타나는 양자 홀 효과와 상관관계 현상을 설명하면서 주목받기 시작했습니다. 체른 수 개념은 David Thouless 등이 1982년에 양자 홀 효과를 설명하면서 도입했습니다.", "connections": "모아레 물질(moire materials), 트위스트 이중층 그래핀(twisted bilayer graphene), 양자 홀 효과(quantum Hall effect), 위상 절연체(topological insulators), 위상 초전도체(topological superconductors), 강상관 전자계(strongly correlated electron systems)와 밀접하게 연관되어 있습니다."}, {"term": "Kohn-Luttinger mechanism (콘-루팅거 메커니즘)", "why_emerged": "전통적인 BCS 이론이 전자-포논 상호작용에 의한 인력으로 초전도성을 설명하는 것과 달리, 전자-전자 쿨롱 반발 상호작용만으로도 초전도 페어링, 특히 비전통적인 대칭성의 페어링을 유도할 수 있음을 보이기 위해 제안된 이론적 메커니즘입니다.", "origin": "Walter Kohn과 Joaquin Luttinger가 1965년에 발표한 이론으로, 페르미 액체(Fermi liquid) 내 전자의 동적 스크리닝된 쿨롱 상호작용이 특정 조건에서 인력적인 채널을 형성하여 초전도성을 유도할 수 있음을 보였습니다.", "connections": "비전통적 초전도성, 높은 임계 온도 초전도체, 페르미 액체 이론, 스핀 플럭츄에이션 매개 초전도성 이론 등과 관련이 있으며, 특정 형태의 쿨롱 상호작용이 인력으로 작용하는 조건을 탐구하는 데 활용됩니다."}, {"term": "Form Factors (형태 인자)", "why_emerged": "양자역학에서 입자나 전하 분포의 공간적 형태를 나타내는 함수로, 산란 실험 등에서 파동 함수의 중첩 적분이나 상호작용 강도를 기술하는 데 사용됩니다. 이 논문에서는 란다우 준위와 유사한 형태로 전위의 공간적 분포를 나타내는 데 활용되었습니다.", "origin": "초록 정보만으로는 특정하기 어려움. 그러나 '형태 인자' 개념은 양자장론 및 고에너지 물리학에서 입자의 내부 구조를 설명하는 데 광범위하게 사용되어 왔으며, 응집 물질 물리학에서는 밴드 구조나 파동 함수의 공간적 분포를 기술하는 데 적용됩니다.", "connections": "산란 진폭, 밴드 구조, 파동 함수, 란다우 준위, 국소화된 상태 등 다양한 양자 현상 및 전자 구조 설명에 활용됩니다. 이 논문에서는 특히 '양자 기하학'과 연결되어 페어링 강도를 결정하는 데 핵심 역할을 합니다."}, {"term": "Chiral p- and f-wave order (카이럴 p-파 및 f-파 질서)", "why_emerged": "초전도 쿠퍼 쌍의 대칭성 중 하나로, 쌍을 이루는 전자의 스핀이 평행하고(삼중항 페어링) 궤도 각운동량(orbital angular momentum)이 1(p-파) 또는 3(f-파)인 경우를 의미합니다. 특히 '카이럴(chiral)'은 이러한 대칭성이 시간 반전 대칭성(Time-Reversal Symmetry)을 깨뜨리며, 특정 방향성을 갖는다는 것을 나타냅니다.", "origin": "비전통적 초전도성 연구에서 제안된 대칭성으로, 특히 3He 초유체(superfluid)에서 p-파 초유동성이 발견되면서 주목받았습니다. 응집 물질에서는 스트론튬 루테네이트(Sr2RuO4)와 같은 물질에서 카이럴 p-파 초전도성이 논의되고 있습니다.", "connections": "위상 초전도체, 마요라나 페르미온(Majorana fermions), 스핀 삼중항 초전도성(spin-triplet superconductivity), 시간 반전 대칭성 깨짐(Time-Reversal Symmetry Breaking, TRSB), 양자 컴퓨팅에의 응용 등과 밀접하게 관련되어 있습니다. 독자의 TRSB 관심사와도 연관됩니다."}], "english_summary": ["This theoretical work proposes a geometry-driven Kohn-Luttinger mechanism for unconventional superconductivity in flat Chern bands.", "Landau-level-like form factors are shown to align attractive screened Coulomb interactions, creating strong attractive channels near band extrema.", "For spin-unpolarized pairing, this leads to an extended-s instability at small Fermi pockets, enforced by emergent momentum-space translational symmetry.", "For spin-polarized pairing, the form-factor phase drives chiral p- and f-wave order without invoking spin fluctuations.", "The study establishes quantum geometry as a key organizing principle for unconventional pairing in topological flat bands, highly relevant to moire systems and unconventional superconductivity."]}}, {"title": "Probing La-based nickelates with Ni 1s core-level photoelectron spectroscopy", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2606.17663", "authors": "Daisuke Takegami, Naoki Ito, Koto Fujinuma, et al.", "last_authors": "Berit H. Goodge, Atsushi Hariki", "summary": "arXiv:2606.17663v1 Announce Type: new Abstract: We present a comparative Ni core level photoemission study of La$_3$Ni$_2$O$_7$, Nd$_3$Ni$_2$O$_7$, and LaNiO$_3$ using both the Ni $2p$ and the Ni $1s$. We address the challenges in analyzing the widely investigated Ni $2p$ spectra arising from the substantial overlap in energy of the Ni $2p$ with the La $3d$. We show that on the other hand the deep Ni $1s$ core level does provide a clean view on the intrinsic electronic excitations and we highlight its potential to resolve detailed differences in the electronic structure within the strongly correlated Ruddlesden-Popper series La$_{n+1}$Ni$_n$O$_{3n+1}$.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Core-level spectroscopy study of nickelates, relevant to current correlated electronic structure studies.", "tags": ["photoemission", "nickelate"], "image": "https://arxiv.org/html/2606.17663v1/x1.png", "briefing": {"background": "니켈레이트는 구리 기반 고온 초전도체(cuprates)와 유사한 전자 구조를 가지는 강상관 전자계 물질로, 비전통적인 초전도 및 다양한 이국적인 물리 현상을 탐구하기 위한 유망한 플랫폼으로 주목받고 있습니다. 이들 물질의 특이한 물성을 이해하기 위해서는 정확한 전자 구조 분석이 필수적입니다.", "motivation": "기존 연구에서는 니켈레이트의 전자 구조를 분석하기 위해 Ni 2p 코어 준위 광전자 분광법이 널리 사용되었으나, La 기반 니켈레이트의 경우 Ni 2p 신호가 La 3d 신호와 에너지적으로 크게 중첩되어 정확한 분석이 어려웠습니다. 이 논문은 이러한 중첩 문제를 해결하고 보다 깨끗한 본질적인 전자 여기를 관찰하기 위해 Ni 1s 코어 준위 광전자 분광법의 유용성을 탐구하는 것을 동기로 합니다.", "result": "연구팀은 La$_3$Ni$_2$O$_7$, Nd$_3$Ni$_2$O$_7$, 그리고 LaNiO$_3$에 대한 비교 분석을 통해, 깊은 Ni 1s 코어 준위가 본질적인 전자 여기를 깨끗하게 보여주며, 강상관 러들스덴-포퍼(Ruddlesden-Popper) 계열 니켈레이트 내에서 전자 구조의 미세한 차이까지 해결할 수 있는 잠재력을 가지고 있음을 입증했습니다.", "implication": "만약 Ni 1s 코어 준위 광전자 분광법이 Ni 2p 스펙트럼의 한계를 극복하는 효과적인 방법으로 확립된다면, 이는 라듐계 니켈레이트뿐만 아니라 다른 강상관 산화물에서 전자 구조를 보다 정확하게 특성화하는 데 새로운 표준 방법론을 제공할 수 있습니다. 이를 통해 니켈레이트의 고온 초전도 메커니즘 등 복잡한 물리 현상에 대한 이해를 심화시킬 수 있습니다.", "novelty": "이 연구의 참신성은 La 기반 니켈레이트에서 Ni 2p와 La 3d 코어 준위의 중첩 문제에 대한 명확한 해결책으로 Ni 1s 코어 준위 광전자 분광법의 유효성을 실증했다는 점에 있습니다. 이는 강상관 전자계 물질의 '전자 구조'를 보다 정확하게 이해하는 데 중요한 기여를 하며, 독자가 관심을 가지는 'ARPES' 및 '코어 준위 분광학' 기술과 직접적으로 관련되어 있습니다.", "unresolved": "이 초록만으로는 Ni 1s 스펙트럼을 통해 실제로 각 니켈레이트 물질의 전자 구조에서 어떤 '상세한 차이'가 관찰되었는지, 그리고 그 차이가 물질의 물리적 특성에 어떤 영향을 미치는지에 대한 구체적인 결과는 제시되지 않았습니다. 방법론의 유용성을 보였다는 점에 중점을 둔 것으로 보입니다.", "future_work": "향후 연구에서는 Ni 1s 코어 준위 광전자 분광법을 사용하여 러들스덴-포퍼 계열 La$_{n+1}$Ni$_n$O$_{3n+1}$ 내의 다양한 조성에 걸쳐 전자 구조의 진화를 체계적으로 조사하고, 이 정보가 초전도성이나 다른 양자상 전이와 어떻게 연결되는지 밝히는 것이 중요할 것입니다. 또한, 유사한 코어 준위 중첩 문제를 겪는 다른 복합 산화물 시스템에도 이 방법을 적용할 수 있습니다.", "concepts": [{"term": "니켈레이트 (Nickelates)", "why_emerged": "구리 기반 초전도체(cuprates)와 유사하게 강한 전자 상관 관계를 보이며, 이국적인 물리적 특성과 잠재적인 고온 초전도체로서 주목받아 그 특성을 이해하기 위해 연구가 시작되었습니다.", "origin": "특정 발견자보다는 1980년대 후반 고온 초전도 연구가 활발해지면서 페로브스카이트 및 관련 구조의 니켈 산화물에 대한 관심이 증가했습니다.", "connections": "구리 기반 초전도체, 페로브스카이트 산화물, 강상관 전자계, 러들스덴-포퍼 계열."}, {"term": "코어 준위 광전자 분광법 (Core-level photoelectron spectroscopy)", "why_emerged": "물질의 원소 조성, 화학적 상태, 그리고 깊은 코어 전자 준위의 전하 분포를 정확하게 파악하고, 물질의 표면 민감한 특성을 분석하기 위해 필요합니다.", "origin": "1900년대 초 아인슈타인의 광전 효과 이론에 기반하며, 1960년대 초 Kai Siegbahn에 의해 X선 광전자 분광법(XPS)으로 발전되었습니다.", "connections": "ARPES (Angle-resolved Photoemission Spectroscopy), XAS (X-ray Absorption Spectroscopy), RIXS (Resonant Inelastic X-ray Scattering)."}, {"term": "러들스덴-포퍼 계열 (Ruddlesden-Popper series)", "why_emerged": "페로브스카이트 구조의 변형으로, 산소 팔면체 층의 두께('n' 값)를 조절하여 다양한 물리적 특성(예: 초전도, 자기)을 탐색하고, 2차원적인 특성을 가진 층상 구조 물질을 연구하기 위해 제안되었습니다.", "origin": "1957년 S. N. Ruddlesden과 P. Popper에 의해 처음 분류되었습니다.", "connections": "페로브스카이트, 층상 산화물, 강상관 물질, 고온 초전도체."}, {"term": "강상관 전자계 (Strongly correlated electron systems)", "why_emerged": "전자들 사이의 상호작용이 매우 강하여 단순한 단일 입자 모델로는 설명할 수 없는 복잡하고 이국적인 양자 현상(예: 고온 초전도, 모트 절연체, 거대 자기 저항)을 이해하기 위해 필요한 개념입니다.", "origin": "1950-60년대 Mott 절연체 개념에서 시작하여 1970년대 이후 Hubbard 모델, Kondo 효과 등 이론적 발전과 함께 중요성이 부각되었습니다.", "connections": "모트 절연체, 허버드 모델, 양자 임계 현상, 고온 초전도체, 중성미자."}], "english_summary": ["This study employs both Ni 2p and Ni 1s core-level photoemission to investigate La-based nickelates (La3Ni2O7, Nd3Ni2O7, LaNiO3).", "It addresses the analytical challenges in Ni 2p spectra due to significant overlap with La 3d core levels.", "The research demonstrates that the deep Ni 1s core level provides a clean view of intrinsic electronic excitations.", "This method shows strong potential to resolve detailed electronic structure differences within the strongly correlated Ruddlesden-Popper nickelate series.", "It offers a superior approach for electronic structure characterization in complex oxides where core-level overlaps obscure data."]}}, {"title": "Surface-switchable nonreciprocity   badges.className = 'badges';
  if (r.score) badges.appendChild(textEl('span', 'badge score', `${r.score}/10`));
  if (r.tier) badges.appendChild(textEl('span', 'badge', r.tier));
  if (r.journal) badges.appendChild(textEl('span', 'badge', r.journal));
  if (r.source) badges.appendChild(textEl('span', 'badge', r.source));
  headText.appendChild(badges);
  const title = document.createElement('h1');
  if (r.link) { const titleLink = document.createElement('a'); titleLink.href = r.link; titleLink.target = '_blank'; titleLink.rel = 'noopener noreferrer'; titleLink.textContent = r.title || ''; title.appendChild(titleLink); }
  else { title.textContent = r.title || ''; }
  headText.appendChild(title);
  headText.appendChild(textEl('p', 'meta', [r.journal, r.source].filter(Boolean).join(' | ')));
  if (r.last_authors || r.authors) { const authors = document.createElement('p'); authors.className = 'authors'; if (r.last_authors) authors.append('Last authors: ' + r.last_authors); if (r.authors) authors.append((r.last_authors ? ' | ' : '') + 'Authors: ' + r.authors); headText.appendChild(authors); }
  appendLabeledText(headText, 'why', 'Filter reason: ', r.reason);
  if (r.tags && r.tags.length) { const tags = document.createElement('div'); tags.className = 'tags'; r.tags.forEach(tag => tags.appendChild(textEl('span', 'tag', '#' + tag))); headText.appendChild(tags); }
  if (r.link) { const link = document.createElement('a'); link.className = 'link'; link.href = r.link; link.target = '_blank'; link.rel = 'noopener noreferrer'; link.textContent = 'Open paper'; headText.appendChild(link); }
  head.appendChild(headText);
  if (r.summary) { const abstract = document.createElement('p'); abstract.className = 'original-abstract'; const strong = textEl('strong', '', 'Original abstract'); abstract.appendChild(strong); abstract.append(r.summary); head.appendChild(abstract); }
  slideEl.appendChild(head);
  const briefing = document.createElement('div');
  briefing.className = 'briefing';
  appendBriefSection(briefing, 'Background', b.background);
  appendBriefSection(briefing, 'Motivation', b.motivation);
  appendBriefSection(briefing, 'Result', b.result);
  appendBriefSection(briefing, 'Implication', b.implication);
  appendBriefSection(briefing, "Why it's important / Novelty", b.novelty);
  appendBriefSection(briefing, 'Unresolved Questions', b.unresolved);
  appendBriefSection(briefing, 'Expected Future Work', b.future_work);
  if (b.concepts && b.concepts.length) {
    const section = document.createElement('section');
    section.className = 'brief-section wide';
    section.appendChild(textEl('h2', '', 'Concepts / Terms'));
    const concepts = document.createElement('div');
    concepts.className = 'concepts';
    b.concepts.forEach(c => {
      const item = document.createElement('div');
      item.className = 'concept';
      item.appendChild(textEl('h3', '', c.term || 'Concept'));
      [['왜 생겼나: ', c.why_emerged], ['누가 만들었나: ', c.origin], ['연결되는 흐름: ', c.connections]].forEach(([label, text]) => { if (!text) return; const p = document.createElement('p'); const bold = textEl('b', '', label); p.appendChild(bold); p.append(text); item.appendChild(p); });
      concepts.appendChild(item);
    });
    section.appendChild(concepts);
    briefing.appendChild(section);
  }
  if (b.english_summary && b.english_summary.length) { const section = document.createElement('section'); section.className = 'brief-section wide'; section.appendChild(textEl('h2', '', 'English Summary')); const ul = document.createElement('ul'); b.english_summary.slice(0, 5).forEach(line => ul.appendChild(textEl('li', '', line))); section.appendChild(ul); briefing.appendChild(section); }
  slideEl.appendChild(briefing);
  counterEl.textContent = `${index + 1} / ${slides.length}`;
  prevBtn.disabled = index === 0;
  nextBtn.disabled = index === slides.length - 1;
}
prevBtn.addEventListener('click', () => { index = Math.max(0, index - 1); render(); });
nextBtn.addEventListener('click', () => { index = Math.min(slides.length - 1, index + 1); render(); });
document.addEventListener('keydown', event => { if (event.key === 'ArrowLeft') prevBtn.click(); if (event.key === 'ArrowRight') nextBtn.click(); });
render();
</script>
</body>
</html>
