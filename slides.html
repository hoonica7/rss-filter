<!DOCTYPE html>
<html lang='en'>
<head>
<meta charset='UTF-8'>
<meta name='viewport' content='width=device-width, initial-scale=1.0'>
<title>Daily Paper Slideshow</title>
<style>
  :root {
    color-scheme: light;
    --bg: #f6f7f4;
    --paper: #ffffff;
    --ink: #111827;
    --muted: #64748b;
    --line: #d8ddd2;
    --accent: #176b87;
    --accent-2: #9a3412;
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; overflow: auto; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: var(--bg); color: var(--ink); }
  .shell { max-width: 1500px; min-height: 100vh; margin: 0 auto; padding: 14px 18px; display: flex; flex-direction: column; }
  .topbar { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 16px; }
  .top-actions { display: flex; align-items: center; gap: 10px; }
  .topbar a, button { border: 1px solid var(--line); border-radius: 8px; background: var(--paper); color: var(--ink); padding: 10px 14px; font-weight: 700; text-decoration: none; cursor: pointer; }
  button.primary { background: var(--accent); border-color: var(--accent); color: white; }
  button:disabled { opacity: 0.45; cursor: not-allowed; }
  .counter { color: var(--muted); font-weight: 700; }
  .slide { min-height: calc(100vh - 82px); background: var(--paper); border: 1px solid var(--line); border-radius: 10px; padding: 18px; box-shadow: 0 18px 42px rgba(15, 23, 42, 0.10); display: grid; grid-template-columns: minmax(310px, 0.86fr) minmax(0, 1.55fr); gap: 18px; overflow: visible; }
  .paper-head { min-width: 0; min-height: 0; overflow: visible; display: flex; flex-direction: column; gap: 12px; }
  .figure { margin: 0; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: #f8fafc; }
  .figure img { display: block; width: 100%; max-height: 41vh; object-fit: contain; background: white; }
  .figure figcaption { padding: 7px 10px; color: var(--muted); font-size: 12px; line-height: 1.3; }
  .head-text { display: flex; flex-direction: column; gap: 9px; min-width: 0; }
  .badges { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .badge { border-radius: 999px; padding: 5px 9px; background: #eef2ff; color: #3730a3; font-size: 12px; font-weight: 800; }
  .score { background: #fee2e2; color: #991b1b; }
  h1 { margin: 0; font-size: 25px; line-height: 1.15; letter-spacing: 0; overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
  h1 a { color: inherit; text-decoration-color: rgba(23, 107, 135, 0.35); text-decoration-thickness: 2px; text-underline-offset: 4px; }
  h1 a:hover { color: var(--accent); text-decoration-color: var(--accent); }
  .meta, .authors, .why, .abstract { font-size: 13px; line-height: 1.45; }
  .meta, .authors { color: var(--muted); }
  .why strong, .abstract strong, .authors strong { color: var(--ink); }
  .authors { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .why { border-left: 4px solid var(--accent-2); padding-left: 10px; color: #374151; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .abstract { border-top: 1px solid var(--line); padding-top: 14px; color: #374151; }
  .original-abstract { border-top: 1px solid var(--line); padding-top: 10px; color: #374151; font-size: 11.5px; line-height: 1.35; overflow-wrap: anywhere; }
  .original-abstract strong { display: block; margin-bottom: 4px; color: var(--ink); }
  .tags { display: flex; flex-wrap: wrap; gap: 8px; }
  .tag { border-radius: 999px; padding: 4px 8px; background: #f1f5f9; color: #475569; font-size: 12px; font-weight: 700; }
  .head-text > .link { display: none; }
  .briefing { min-width: 0; min-height: 0; overflow: visible; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); grid-auto-rows: minmax(0, auto); align-content: start; gap: 11px 18px; border-top: 0; padding-top: 0; }
  .brief-section { min-width: 0; }
  .brief-section.wide { grid-column: 1 / -1; }
  .brief-section h2 { margin: 0 0 4px; font-size: 14px; line-height: 1.22; color: #0f766e; letter-spacing: 0; }
  .brief-section p, .brief-section li { margin: 0; font-size: 12.5px; line-height: 1.42; color: #1f2937; overflow-wrap: anywhere; }
  .brief-section ul { margin: 0; padding-left: 20px; }
  .concepts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 9px 14px; }
  .concept { border-top: 1px solid var(--line); padding-top: 7px; }
  .concept h3 { margin: 0 0 4px; font-size: 13px; color: #7c2d12; letter-spacing: 0; }
  .concept p { margin: 2px 0 0; font-size: 11.5px; line-height: 1.35; color: #374151; overflow-wrap: anywhere; }
  .concept b { color: #111827; }
  .link { color: var(--accent); font-weight: 800; text-decoration: none; }
  .empty { padding: 48px; background: var(--paper); border: 1px solid var(--line); border-radius: 12px; color: var(--muted); }
  @media (max-width: 860px) {
    .shell { padding: 14px; }
    .topbar, .top-actions { align-items: stretch; flex-direction: column; }
    .slide, .briefing, .concepts { grid-template-columns: 1fr; }
    .slide { min-height: auto; overflow: visible; display: grid; }
    h1 { font-size: 28px; }
  }
</style>

rial", "electronic-structure", "correlated-systems"], "image": "", "briefing": {"background": "1T-TaS2는 강한 전자 상관관계로 인해 여러 CDW 상을 거쳐 절연체 상태에 도달하는 모델 물질입니다. 이 물질은 전자-격자 결합과 전자-전자 상관관계가 정교하게 조절되는 시스템으로, 초고속 펨토초 레이저를 이용한 전자 구조 동역학 연구가 활발합니다.", "motivation": "도핑(Mo) 및 광 펌핑에 의한 진폭 모드(amplitude mode) 동역학이 1T-TaS2의 절연 상태와 전자 구조 변화에 어떻게 기여하는지 밝히고자 했습니다.", "result": "광 여기 후 발생하는 전자 구조의 변화가 단순히 열적 효과가 아니라, 진폭 모드와 같은 집단 들뜸(collective excitations)과 도핑된 이온들에 의해 결정됨을 입증했습니다.", "implication": "초고속 분광학적 관점에서 강상관 절연체의 위상 변화를 제어할 수 있는 물리적 기제를 이해하는 데 중요한 토대를 마련했습니다.", "novelty": "광 여기된 1T-TaS2의 전자 구조를 페르미 준위 근처에서 고분해능으로 추적하여, 전자 상관관계와 도핑이 어떻게 상호작용하는지 명확히 분리했다는 점이 주목됩니다.", "unresolved": "도핑된 Mo 이온이 국소적으로 형성하는 무질서 상태가 전자 동역학에 미치는 비평형 효과를 완전히 규명하는 것은 여전히 난제로 남아있습니다.", "future_work": "다양한 도핑 레벨에서의 비교 연구 및 시간 분해 ARPES(tr-ARPES)를 이용한 밴드 분산의 초고속 변화 관찰이 예상됩니다.", "concepts": [{"term": "Amplitude Mode", "why_emerged": "CDW 시스템에서 차수 매개변수(order parameter)의 크기가 진동하는 집단 들뜸 현상을 설명하기 위해 도입되었습니다.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "CDW 동역학, 위상 전이, 초고속 분광학."}, {"term": "1T-TaS2", "why_emerged": "강상관 전자계에서 전자 구조와 CDW 간의 상호작용을 연구하기 위한 대표적인 TMD 플랫폼입니다.", "origin": "1970년대 이후 다양한 실험적 연구로 정립됨.", "connections": "모트 절연체(Mott insulator), 전하 밀도 파(CDW), 초고속 광응답."}], "english_summary": ["Investigated the ultrafast electronic structure dynamics of 1T-TaS2 via femtosecond spectroscopy.", "Analyzed the roles of Mo-doping and amplitude mode dynamics in the insulating state.", "Demonstrates that collective excitations drive transient electronic changes, distinct from simple heating effects."]}}, {"title": "Band-Geometry-Driven Spin Photocurrent in Centrosymmetric Altermagnets", "journal": "PRL_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/g85x-rgxm", "authors": "Ruizhi Dong, Yihua Xiao, Ruixiang Fei", "last_authors": "Yihua Xiao, Ruixiang Fei", "summary": "Author(s): Ruizhi Dong, Yihua Xiao, and Ruixiang Fei Geometric responses give rise to novel phenomena in charge and spin transport, which have been extensively studied in the context of the quantum geometry of Bloch states in periodic solids. In contrast, the geometry of Hamiltonian eigenvalues is often considered trivial. Here, we demonstrate that th… [Phys. Rev. Lett. 136, 216702] Published Thu May 28, 2026", "tier": "B_IMPORTANT_CONDMAT", "score": "9", "reason": "Directly relevant to altermagnetism and band-geometry-driven spin phenomena in condensed matter.", "tags": ["altermagnetism", "electronicstructure", "transport", "bandgeometry"], "image": "", "briefing": {"background": "알터자성(Altermagnetism)은 시간 역전 대칭성을 깨면서도 순자화가 0인 새로운 자기 위상으로, 기존 강자성/반강자성과는 다른 밴드 구조의 스핀 분할(spin-splitting) 특성을 보입니다.", "motivation": "알터자성체의 중심대칭성(centrosymmetry)이 존재함에도 불구하고, 밴드 기하학적 특성에 기반한 스핀 광전류가 발생할 수 있음을 이론적으로 증명하고자 했습니다.", "result": "해밀토니안 고유값의 기하학적 구조가 밴드 간 스핀 전류를 유도하는 데 결정적인 역할을 하며, 이것이 알터자성체에서 비자명한 응답을 낳음을 규명했습니다.", "implication": "알터자성체는 자화가 없으면서도 스핀 전류를 효율적으로 제어할 수 있는 차세대 스핀트로닉스 소자 후보군임을 강력히 뒷받침합니다.", "novelty": "통상적으로 자성체가 아니라고 생각되기 쉬운 중심대칭성 물질에서도 밴드 기하학을 통해 강력한 스핀 응답을 이끌어낼 수 있음을 보여주어, 독자의 관심사인 위상물질 및 스핀 물리 연구 범위를 크게 확장했습니다.", "unresolved": "제안된 밴드 기하학 기반 스핀 광전류를 실험적으로 검증하기 위한 구체적인 물질 후보군 선정 및 광학 측정 정밀도가 향후 과제입니다.", "future_work": "특정 알터자성체 박막에서의 광-스핀 전류 측정 및 밴드 구조의 Berry 곡률 계산을 통한 추가적인 수송 현상 연구가 기대됩니다.", "concepts": [{"term": "Altermagnetism", "why_emerged": "강자성과 반강자성의 경계에서 비자명한 스핀 분할을 가지면서 순자화가 없는 상태를 분류하기 위해 제안되었습니다.", "origin": "최근 2~3년 내 이론적 토대가 급격히 정립됨.", "connections": "시간 역전 대칭성 파괴, 스핀-궤도 결합, 밴드 분할."}, {"term": "Band Geometry", "why_emerged": "블로흐 파동함수의 위상적/기하학적 성질을 통해 물질의 응답 특성을 이해하기 위해 도입되었습니다.", "origin": "Berry Phase와 관련하여 많은 연구자가 정립함.", "connections": "Berry Curvature, Quantum Metric, 위상물질."}], "english_summary": ["Theoretical study on band-geometry-driven spin photocurrent in centrosymmetric altermagnets.", "Shows that Hamiltonian eigenvalue geometry induces non-trivial spin transport despite centrosymmetry.", "Highlights the potential of altermagnets for spin-orbitronic applications without external magnetization."]}}, {"title": "Collinear ferromagnetism with reduced moment length in kagome magnet Nd3Ru4Al12", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/9pvl-33xc", "authors": "Yuki Ishihara, Ryota Nakano, Rinsuke Yamada, et al.", "last_authors": "Taro Nakajima, Max Hirschberger", "summary": "Author(s): Yuki Ishihara, Ryota Nakano, Rinsuke Yamada, Takuya Nomoto, Priya R. Baral, Moritz M. Hirschmann, Kamini Gautam, Kamil K. Kolincio, Akiko Kikkawa, Seno Aji, Hiraku Saitoh, Masaaki Matsuda, Yasujiro Taguchi, Taka-hisa Arima, Yoshinori Tokura, Taro Nakajima, and Max Hirschberger We determine the magnetic ground state of the kagome lattice magnet ${\\mathrm{Nd}}_{3}{\\mathrm{Ru}}_{4}{\\mathrm{Al}}_{12}$ by single-crystal neutron diffraction, supported by experiments with polarized neutrons. We identify this material as a collinear ferromagnet (“hex-FM”) with uniform moment leng… [Phys. Rev. B 113, 214410] Published Tue Jun 02, 2026", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Detailed magnetic study of a kagome lattice material using neutron diffraction.", "tags": ["material", "kagome", "neutronscattering"], "image": "", "briefing": {"background": "가고메 격자 물질은 기하학적 좌절(geometric frustration)과 전자 상관관계로 인해 위상적 전자 상태나 특이한 자기 질서가 나타날 가능성이 높아 응집물질물리학의 주요 연구 대상입니다.", "motivation": "Nd3Ru4Al12 물질의 자기적 바닥 상태를 명확히 규명하고, 가고메 격자에서의 자기 모멘트 배열 방식을 확인하고자 합니다.", "result": "단결정 중성자 회절 및 편극 중성자 실험을 통해 이 물질이 균일한 모멘트 길이를 가진 'hex-FM' 유형의 공선형 강자성체(collinear ferromagnet)임을 확인했습니다.", "implication": "Nd3Ru4Al12가 단순한 강자성 질서를 보인다는 점은, 향후 이 물질을 기반으로 한 위상적 물리 현상이나 밴드 구조 연구 시 자기적 배경을 이해하는 중요한 토대가 됩니다.", "novelty": "가고메 격자 자성체에서 흔히 볼 수 있는 복잡한 비공선형(non-collinear) 스핀 구조가 아닌 공선형 강자성 질서를 정밀하게 밝혀내어, 해당 물질의 자기적 자유도를 제한적으로 정의했다는 점이 중요합니다.", "unresolved": "왜 이 물질이 가고메 격자임에도 불구하고 비공선형 스핀 구조가 아닌 공선형 강자성 상태를 선호하는지에 대한 미시적 메커니즘은 추가 논의가 필요합니다.", "future_work": "해당 자기 구조가 전자의 밴드 구조 및 위상적 특성(Berry curvature 등)에 미치는 영향에 대한 이론적 계산이나 ARPES 연구가 뒤따라야 할 것입니다.", "concepts": [{"term": "가고메 격자(Kagome Lattice)", "why_emerged": "좌절된 스핀 시스템에서 나타나는 이국적인 양자 현상을 탐구하기 위해 필요합니다.", "origin": "일본의 전통 바구니 짜기 패턴에서 유래, 고체물리학에서는 대칭적 격자 구조로 정립되었습니다.", "connections": "디랙 페르미온, 평탄 밴드(flat band), 위상적 강자성."}, {"term": "공선형 강자성(Collinear Ferromagnet)", "why_emerged": "자기 모멘트의 배열 방향을 분류하여 물리적 성질을 이해하기 위해 필수적입니다.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "스핀-궤도 결합, 비공선형 자성, 자기 이방성."}], "english_summary": ["Determined the magnetic ground state of kagome magnet Nd3Ru4Al12.", "Used single-crystal neutron diffraction to identify a collinear 'hex-FM' structure.", "Confirmed uniform moment lengths through polarized neutron experiments."]}}, {"title": "Evolution of charge density wave soft phonon modes in PdxErTe3", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/7ky1-nmyx", "authors": "Avishek Maity, Stephan Rosenkranz, Raymond Osborn, et al.", "last_authors": "Ian R. Fisher, Frank Weber", "summary": "Author(s): Avishek Maity, Stephan Rosenkranz, Raymond Osborn, Rolf Heid, Ayman H. Said, Ahmet Alatas, Joshua A. W. Straquadine, Matthew J. Krogstad, Anisha G. Singh, Ian R. Fisher, and Frank Weber Here, the authors use diffuse and inelastic x-ray scattering to investigate the dynamics of orthogonal charge density waves (CDWs) in Pd x ErTe 3 . Strong diffuse scattering and phonon softening persist at wave vector q a (|| a * ) equal in magnitude to the ordering vector q c (|| c * ) of the primary CDW, although small intercalation already suppresses the secondary CDW order near q a . The authors demonstrate that diffuse scattering and phonon softening at q a is coupled to fluctuations of the onset of the primary CDW for all intercalation levels. [Phys. Rev. B 113, 224101] Published Mon Jun 01, 2026", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Experimental study of CDW dynamics in a telluride; high relevance to CDW and telluride interests.", "tags": ["experiment", "chargedensitywave", "telluride"], "image": "", "briefing": {"background": "텔루라이드(Te) 기반 층상 물질에서 전하 밀도 파동(CDW)은 페르미 면 중첩과 격자 변형이 복합적으로 작용하는 중요한 물리 현상입니다.", "motivation": "Pd가 도핑된 ErTe3에서 직교하는 두 방향의 CDW가 어떻게 상호작용하며, 불순물(Pd)에 의해 이들의 안정성이 어떻게 변하는지 규명하고자 합니다.", "result": "하위 CDW 상태가 억제되더라도, 해당 모드에서의 포논 연화(phonon softening)와 산란 현상은 여전히 기본 CDW의 변동과 강하게 결합되어 있음을 확인했습니다.", "implication": "CDW의 경쟁 및 공존 메커니즘을 이해하는 데 있어 포논 역학이 매우 중요한 역할을 하며, 도핑을 통한 미세 조정이 CDW 상관관계를 제어할 수 있음을 시사합니다.", "novelty": "다양한 도핑 수준에서 포논 연화를 추적하여, 겉보기에는 사라진 듯 보이는 CDW의 흔적이 모드 결합을 통해 지속됨을 실험적으로 증명했습니다.", "unresolved": "Pd 도핑이 국소적인 변형을 통해 전자 구조의 밴드 겹침에 미치는 정밀한 영향은 아직 명확하지 않습니다.", "future_work": "온도 변화에 따른 포논 연화의 동역학적 변화를 추가적으로 측정하여 CDW 위상 전이의 동역학을 상세히 연구할 예정입니다.", "concepts": [{"term": "전하 밀도 파동(CDW)", "why_emerged": "전자의 밀도가 공간적으로 주기적인 변조를 일으켜 전도성 변화를 초래하는 현상을 설명하기 위해 필요합니다.", "origin": "Peierls가 1차원 금속 시스템에서 처음 제안했습니다.", "connections": "페르미 면 중첩(nesting), 포논 연화, 위상 절연체."}, {"term": "포논 연화(Phonon Softening)", "why_emerged": "격자 불안정성이나 위상 전이 직전에 특정 포논 모드의 에너지가 낮아지는 현상을 설명하기 위해 도입되었습니다.", "origin": "격자 동역학 이론에서 일반적으로 도출되는 결과입니다.", "connections": "구조 상전이, CDW, 초전도성."}], "english_summary": ["Investigated CDW dynamics in PdxErTe3 using diffuse and inelastic X-ray scattering.", "Found that phonon softening at the secondary CDW vector persists despite order suppression.", "Demonstrated coupling between the suppressed CDW fluctuations and the primary CDW."]}}, {"title": "Existence of spontaneously generated and condensed excitons in the charge density wave phase of monolayer TiSe2: Role of ionic screening", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/lzrv-dflt", "authors": "Miaomiao Guo, Zeyu Jiang, Yuanchang Li", "last_authors": "Zeyu Jiang, Yuanchang Li", "summary": "Author(s): Miaomiao Guo, Zeyu Jiang, and Yuanchang Li The debate over whether the charge density wave (CDW) in ${\\mathrm{TiSe}}_{2}$ originates from spontaneous exciton condensation or the Jahn-Teller effect persists. Although this ectroscopy.", "tags": ["antiferromagnetism", "TRSB", "spectroscopy", "magneticmaterials"], "image": "", "briefing": {"background": "시간 반전 대칭성 깨짐(TRSB)이 있는 반강자성체는 스핀-궤도 결합과 결합하여 비상반적 광학 특성을 나타낼 수 있습니다. ErCrO3와 같은 다중 자기 부격자를 가진 물질에서 이러한 국소 자기적 정보를 분리해내는 것이 중요합니다.", "motivation": "두 개의 서로 다른 자기 이온(Er, Cr)을 가진 ErCrO3에서 전기장으로 유도된 비상반적 방향성 이색성(Directional Dichroism)을 측정하여 site-specific한 자기 거동을 프로빙하고자 합니다.", "result": "외부 전기장 하에서 특정 자기 부격자의 광흡수 스펙트럼 변화를 관찰함으로써, 복잡한 반강자성 구조 내에서 부격자별 자기 질서의 기여도를 구분해냈습니다.", "implication": "자기 위상 물질의 비가역적 성질을 전기장으로 제어할 수 있는 물리적 기초를 마련했으며, TRSB를 확인하는 정밀한 분광학적 도구를 제시합니다.", "novelty": "복합 산화물 내의 부격자별 자기 기여를 비상반적 광학 측정을 통해 분리했다는 점이 핵심이며, 자기적 위상 물질 및 altermagnetism 연구에 직접적인 방법론적 기여를 합니다.", "unresolved": "전기장에 의한 분극이 어떻게 개별 부격자의 자기 모멘트 방향과 결합하여 최종적인 광학 응답을 이끌어내는가에 대한 미시적 모델링이 보완되어야 합니다.", "future_work": "이러한 부격자별 자기 질서 제어를 실제 소자에서 위상 상태의 스위칭으로 활용하는 연구가 필요합니다.", "concepts": [{"term": "비상반적 방향성 이색성", "why_emerged": "광 진행 방향과 편광에 따라 빛의 흡수가 달라지는 현상으로, 시간 반전 대칭성이 깨진 시스템의 자기적 질서를 파악하기 위해 필요합니다.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "비상반적 자기 광학, 자기 전기 효과"}, {"term": "시간 반전 대칭성 깨짐", "why_emerged": "자기 위상 물질 및 반강자성체에서의 비전통적인 물리 현상을 정의하는 핵심 대칭성입니다.", "origin": "양자역학의 대칭성 원리에서 비롯됨", "connections": "반강자성체, 위상 절연체, anomalous Hall effect"}], "english_summary": ["Probing site-specific magnetism in the time-reversal-odd antiferromagnet ErCrO3.", "Utilizes electric field-induced nonreciprocal directional dichroism.", "Distinguishes magnetic contributions between distinct Er3+ and Cr3+ sites.", "Provides a spectroscopic tool to verify TRSB in complex magnetic materials."]}}, {"title": "Symmetry Classification of Altermagnetism and Emergence of Type-IV Magnetism in Two Dimensions", "journal": "PRL_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/jp95-17sz", "authors": "Mu Tian, Chaoxi Cui, Zeying Zhang, Jingyi Duan, Wanxiang Feng, Run-Wu Zhang", "last_authors": "Wanxiang Feng, Run-Wu Zhang", "summary": "Author(s): Mu Tian, Chaoxi Cui, Zeying Zhang, Jingyi Duan, Wanxiang Feng, and Run-Wu Zhang Two-dimensional (2D) magnetism, particularly 2D altermagnetism (AM), has attracted considerable interest due to its exceptional physical properties and broad application potential. However, the classification of AM undergoes a fundamental paradigm shift when transitioning from three-dimensional (3D)… [Phys. Rev. Lett. 136, 206701] Published Thu May 21, 2026", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Directly relevant symmetry analysis of altermagnetism in 2D systems, an area of specified interest.", "tags": ["theory", "altermagnetism", "2Dmaterials"], "image": "", "briefing": {"background": "알터마그네틱(Altermagnetism)은 순수 자기모멘트가 0임에도 불구하고 스핀-궤도 결합 없이 운동량 공간에서 스핀 갈라짐(spin splitting)이 나타나는 새로운 자기 질서 상태입니다.", "motivation": "3차원 시스템에서 확립된 알터마그네틱 분류 체계가 2차원으로 축소될 때 발생하는 물리적 패러다임 변화를 체계적으로 분류하고자 합니다.", "result": "2차원 시스템에서만 나타나는 독특한 대칭성 기반의 알터마그네틱 타입을 정의하고, 특히 'Type-IV'라고 명명된 새로운 자기적 위상 상태를 제안했습니다.", "implication": "2차원 자성 재료에서 스핀트로닉스 응용 가능성을 넓히고, 비자성 상태와 강자성 상태 사이의 새로운 위상적 분류 기준을 제공합니다.", "novelty": "기존 3D 알터마그네틱 연구를 저차원으로 확장하여, 차원성에 따른 대칭성 보호 물리량을 명확히 구분했다는 점이 독자에게 흥미롭습니다.", "unresolved": "이론적인 분류 체계가 확립되었으나, 이를 실험적으로 검증할 수 있는 실제 2D 화합물 예시가 본 초록에는 부족합니다.", "future_work": "제안된 Type-IV 알터마그네틱 상태를 나타내는 실제 2D 층상 구조 물질의 발견 및 ARPES를 통한 밴드 구조 관측이 요구됩니다.", "concepts": [{"term": "Altermagnetism", "why_emerged": "기존 강자성/반강자성으로 설명되지 않는, 순수 자화값이 없으면서도 스핀 갈라짐을 가지는 물질의 발견 필요성.", "origin": "최근 1-2년 내 이론물리학계에서 급격히 대두된 개념.", "connections": "반강자성(Antiferromagnetism), 스핀-궤도 토크, 스핀 결정 구조."}, {"term": "Type-IV Magnetism", "why_emerged": "2D 시스템의 제한된 대칭성 그룹 하에서 기존 분류로 설명되지 않는 스핀 구조를 포괄하기 위함.", "origin": "본 논문에서 제안.", "connections": "2D 자성 그룹 이론, 스핀 공간 군."}], "english_summary": ["Proposes a new classification scheme for altermagnetism in 2D systems.", "Identifies Type-IV magnetism as a distinct symmetry-protected phase.", "Extends the scope of altermagnetic spintronics to low-dimensional structures.", "Provides a theoretical framework for future experimental searches in 2D materials."]}}, {"title": "Magnon hydrodynamics in an atomically thin ferromagnet", "journal": "Science", "source": "Gemini", "link": "https://doi.org/10.1126/science.adp2397", "authors": "Ruolan Xue, Nikola Maksimovic, Pavel E. Dolgirev, et al.", "last_authors": "Eugene Demler, Amir Yacoby", "summary": "Strong interactions between particles can lead to emergent collective excitations. Spin waves, known as magnons, have been predicted to reach a strongly interacting hydrodynamic regime, where they form a slow collective density mode. In this work, we isolate exfoliated sheets of chromium trichloride (CrCl 3 ), where magnon interactions are strong, and develop a technique to measure the collective magnon dynamics though nearby nitrogen-vacancy centers in diamond. Thermal magnetic fluctuations generated by monolayer CrCl 3 increase upon decreasing temperature; this anomalous trend may be a consequence of the damping rate of a low-energy magnon sound mode that sharpens as magnon interactions increase with increasing temperature. By measuring the magnetic fluctuations emitted by thin multilayer CrCl 3 in the presence of a variable-frequency drive field, we obtain spectroscopic evidence for this two-dimensional magnon sound mode.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Experimental study of magnon hydrodynamics in a 2D ferromagnet, relevant to strongly correlated systems.", "tags": ["2Dmaterials", "magnetism", "magnons", "stronglycorrelated", "experimental"], "image": "", "briefing": {"background": "강상관 전자계에서 준입자들이 강한 상호작용을 할 때, 개별 입자가 아닌 유체처럼 거동하는 '유체역학적(hydrodynamic) 체제'에 대한 연구가 활발합니다.", "motivation": "스핀파(magnon) 역시 강한 상호작용 하에서 유체역학적 거동을 보일 수 있다는 예측을 실험적으로 검증하고자 했습니다.", "result": "2D 강자성체인 CrCl3에서 질소-공공(NV) 센터 현미경을 활용해 마그논의 집단적 밀도 모드인 '마그논 사운드'를 검출했습니다.", "implication": "마그논이 열적 에너지 운반자로서 유체처럼 흐를 수 있음을 입증하여 스핀트로닉스 소자의 열 관리 및 신호 전송 제어에 기여할 수 있습니다.", "novelty": "2D 물질에서 직접적인 마그논 유체역학 현상을 포착한 드문 연구이며, NV 센터를 활용한 미세 측정 기술이 돋보입니다.", "unresolved": "온도 변화에 따른 마그논 사운드의 감쇠 기제와 상호작용 강도의 정량적 관계에 대한 미세한 설명이 보완될 필요가 있습니다.", "future_work": "다양한 2D 자성체에서 마그논-마그논 상호작용을 제어하여 마그논 점성 및 전도도를 측정하는 후속 연구가 예상됩니다.", "concepts": [{"term": "Magnon", "why_emerged": "자기 질서에서의 집단적 들뜸 현상을 양자화된 입자로 기술하기 위함.", "origin": "Bloch (1930년).", "connections": "스핀파, 강자성, 퀀텀 스핀 액체."}, {"term": "Hydrodynamic regime", "why_emerged": "입자 간 충돌이 빈번하여 확산 모드보다 집단적인 흐름 모드가 지배적인 상태를 기술하기 위해 필요.", "origin": "전자 유체역학 분야에서 먼저 제안.", "connections": "나비에-스토크스 방정식, 점성 전자의 흐름."}], "english_summary": ["Demonstrates magnon hydrodynamics in monolayer CrCl3.", "Uses NV center microscopy to detect collective magnon sound modes.", "Confirms strong magnon-magnon interactions in 2D ferromagnets.", "Provides experimental evidence for the hydrodynamic flow of spin waves."]}}, {"title": "Symmetry-locked six-state control of altermagnetism via sliding ferroelectricity", "journal": "Science_Advances", "source": "Gemini", "link": "https://doi.org/10.1126/sciadv.aec5229", "authors": "Wei Sun, Wenxuan Wang, Changhong Yang, Shifeng Huang, Zhenxiang Cheng", "last_authors": "Shifeng Huang, Zhenxiang Cheng", "summary": "Altermagnetic multiferroics offer a promising route to low-power spintronics by enabling spin splitting without net magnetization, extending beyond conventional spin-orbit coupling. However, achieving deterministic electric control has remained elusive. Here, a six-state platform for high-dimensional magnetoelectric coupling in altermagnets is established by exploiting the nondegenerate transition paths of sliding ferroelectrics as a symmetry-engineering knob, thereby transcending the conventional binary (up/down) paradigm of sliding ferroelectricity. First-principles calculations on bilayer manganese phosphorus trisulfide reveal a spin-polarization symmetry-locking mechanism. Polarization switching along the three nondegenerate paths not only reverses the spin splitting but also rotates its spin-splitting texture in 120° increments, yielding six nonvolatile, electrically addressable altermagnetic states. Furthermore, direct correspondence is established between the spin-splitting texture and the nonlinear Hall response, providing unique electrical fingerprints for each state. This work establishes a paradigm for electric field–driven reconstruction of momentum-space spin geometry, providing a versatile platform for controlling quantum phenomena in altermagnetic spintronics.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Directly addresses altermagnetism with first-principles calculations and experimental observables.", "tags": ["theory", "altermagnetism", "multiferroics", "spintronics", "DFT", "MnPS3", "Halleffect"], "image": "", "briefing": {"background": "전기장을 사용하여 자기 상태를 제어하는 다강체 연구는 차세대 초저전력 스핀트로닉스 소자의 핵심 과제입니다.", "motivation": "알터마그네틱 특성을 순수하게 전기적 방법으로 제어할 수 있는 플랫폼을 구축하고자 했습니다.", "result": "MnPS3 이중층 구조에서 슬라이딩 강유전성을 이용해 스핀 갈라짐을 120도씩 회전시키는 6상태(six-state) 제어 메커니즘을 제안했습니다.", "implication": "전기장만으로 스핀 텍스처를 재구성하여 비휘발성 메모리 및 논리 소자 구현이 가능함을 보였습니다.", "novelty": "알터마그네틱과 슬라이딩 강유전성을 결합하여 기존의 이진법 제어를 넘어선 다중 상태 제어 방식을 제시한 것이 혁신적입니다.", "unresolved": "이론적 제안 및 계산에 근거한 결과이므로, 실제 소자 수준에서 6상태가 얼마나 안정적으로 유지되는지에 대한 실험 데이터가 필요합니다.", "future_work": "MnPS3 또는 유사한 알터마그네틱 반데르발스 물질에서의 전기적 스위칭 및 비선형 홀 효과 실험적 관측.", "concepts": [{"term": "Sliding Ferroelectricity", "why_emerged": "층상 물질에서 층간 쌓임 구조(stacking)의 변화로 발생하는 새로운 형태의 강유전성을 연구하기 위함.", "origin": "최근 2D 반데르발스 물질 연구에서 확립.", "connections": "반데르발스 헤테로구조, 적층 순서(stacking order)."}, {"term": "Nonlinear Hall effect", "why_emerged": "시간 역전 대칭성이 깨지지 않아도 특정 밴드 구조의 기하학적 특성에 의해 발생하는 홀 효과를 설명하기 위함.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "Berry 곡률 다이폴, Berry 위상."}], "english_summary": ["Proposes a six-state control mechanism for altermagnetism using sliding ferroelectricity.", "MnPS3 bilayer systems show electrically tunable spin-splitting textures.", "Links spin-splitting geometry directly to nonlinear Hall responses.", "Enables potential development of multi-state spintronic logic devices."]}}, {"title": "Altermagnetism of ultrathin CrSb slabs", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2510.00985", "authors": "Brahim Marfoua, Mohammad Amirabbasi, Marcus Ekholm", "last_authors": "Mohammad Amirabbasi, Marcus Ekholm", "summary": "arXiv:2510.00985v2 Announce Type: replace Abstract: Altermagnets exhibit momentum-dependent spin splitting without net magnetization, combining characteristics of both ferromagnets and antiferromagnets, making them highly interesting for spintronics applications. CrSb is a prime candidate with a high N\\'eel temperature ($\\sim700$~K) and a large exchange-driven splitting of $\\sim0.6$--1~eV. Using ab-initio calculations, we consider slabs of various orientations in the ultrathin limit. We find that (100) oriented slabs have spin-degenerate bands. In (0001) oriented slabs, the exchange-driven altermagnetic spin splitting collapses, but including spin-orbit coupling restores a residual anisotropic splitting of $\\sim70$~meV. In contrast, the (110) oriented slabs show an altermagnetic spin splitting of $\\sim400$~meV, and emerges as a robust candidate for realizing large, exchange-driven altermagnetism", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Focus on altermagnetism in a real material system with large spin splitting.", "tags": ["material", "CrSb", "altermagnetism"], "image": "https://arxiv.org/html/2510.00985v2/x1.png", "briefing": {"background": "알터마그넷(Altermagnetism)은 자화가 없으면서도 전자 밴드의 스핀 분리를 나타내는 새로운 자기 위상으로, 기존의 강자성체와 반강자성체의 장점을 결합하여 스핀트로닉스 응용에 매우 유망한 물질군입니다.", "motivation": "높은 닐 온도를 가진 CrSb가 알터마그넷의 좋은 후보 물질임에도 불구하고, 실제 소자 응용을 위한 박막(slab) 형태에서 배향에 따른 자기적 특성 변화와 스핀 분리 유지 여부를 확인하고자 함.", "result": "CrSb 박막의 (110) 배향이 약 400 meV의 큰 교환 상호작용 기반 스핀 분리를 유지하며 알터마그넷 후보로서 가장 적합함을 보였고, 반면 (100)이나 (0001) 배향에서는 스핀 분리가 사라지거나 매우 작아짐을 확인.", "implication": "알터마그넷 소자 설계 시 결정 배향이 물리적 특성을 결정짓는 핵심 변수임을 시사하며, CrSb 기반의 고온 스핀트로닉스 소자 실현 가능성을 높임.", "novelty": "실제 CrSb 물질을 대상으로 박막 배향에 따른 밴드 구조 변화를 원자 단위 계산으로 정밀하게 분석하여 소자 응용을 위한 최적 조건을 제시함.", "unresolved": "이론적 계산 결과가 실제 박막 성장 시의 결함이나 표면 효과 등에 의해 어떻게 변화할지에 대한 실험적 검증이 부족함.", "future_work": "실제 CrSb 박막 성장을 통한 각도 분해 광전자 분광법(ARPES) 등으로 계산된 밴드 분리를 실험적으로 직접 관측하는 연구 필요.", "concepts": [{"term": "Altermagnetism", "why_emerged": "기존 반강자성체와 달리 스핀 분극 없이도 운동량 의존적 스핀 분리를 가져 스핀 수송 소자에 활용하고자 등장.", "origin": "최근 2020년대 초반 이론적으로 정립됨(초록 정보만으로는 특정 학자 이름 언급 어려움).", "connections": "반강자성체, 강자성체, 스핀 궤도 결합."}, {"term": "Exchange-driven splitting", "why_emerged": "자기적 질서가 스핀 밴드의 에너지 위치를 어떻게 결정하는지 설명하기 위해 필요.", "origin": "고체 물리학의 기초적 이론(초록 정보만으로는 특정하기 어려움).", "connections": "교환 상호작용, 밴드 구조, 스핀트로닉스."}], "english_summary": ["Altermagnetism offers large spin splitting without net magnetization, ideal for spintronics.", "CrSb is identified as a robust altermagnet candidate due to its high Neel temperature.", "Ab-initio calculations show (110) oriented CrSb slabs retain significant spin splitting.", "Different slab orientations drastically alter the magnetic splitting, guiding future device fabrication."]}}, {"title": "Magnetic field effects on spin-split band and magnon transport in altermagnets and emergent compensated ferrimagnets", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2606.03451", "authors": "Kazushi Aoyama, Hikaru Kawamura", "last_authors": "Kazushi Aoyama, Hikaru Kawamura", "summary": "arXiv:2606.03451v1 Announce Type: new Abstract: In altermagnets and fully compensated ferrimagnets, not only the electron band but also the magnon band exhibits spin splitting without net magnetization, which enables thermal activation of the magnon spin current. Here, we theoretically investigate magnetic field effects on the magnon properties of these antiferromagnets in the presence of a weak easy-axis anisotropy which makes the collinear states robust against the magnetic field. For the altermagnet and compensated ferrimagnet, we analyze a 2 sublattice order i
