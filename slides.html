<title>Daily Paper Slideshow</title>
<style>
  :root {
    color-scheme: light;
    --bg: #f6f7f4;
    --paper: #ffffff;
    --ink: #111827;
    --muted: #64748b;
    --line: #d8ddd2;
    --accent: #176b87;
    --accent-2: #9a3412;
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; overflow: auto; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: var(--bg); color: var(--ink); }
  .shell { max-width: 1500px; min-height: 100vh; margin: 0 auto; padding: 14px 18px; display: flex; flex-direction: column; }
  .topbar { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 16px; }
  .top-actions { display: flex; align-items: center; gap: 10px; }
  .topbar a, button { border: 1px solid var(--line); border-radius: 8px; background: var(--paper); color: var(--ink); padding: 10px 14px; font-weight: 700; text-decoration: none; cursor: pointer; }
  button.primary { background: var(--accent); border-color: var(--accent); color: white; }
  button:disabled { opacity: 0.45; cursor: not-allowed; }
  .counter { color: var(--muted); font-weight: 700; }
  .slide { min-height: calc(100vh - 82px); background: var(--paper); border: 1px solid var(--line); border-radius: 10px; padding: 18px; box-shadow: 0 18px 42px rgba(15, 23, 42, 0.10); display: grid; grid-template-columns: minmax(310px, 0.86fr) minmax(0, 1.55fr); gap: 18px; overflow: visible; }
  .paper-head { min-width: 0; min-height: 0; overflow: visible; display: flex; flex-direction: column; gap: 12px; }
  .figure { margin: 0; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: #f8fafc; }
  .figure img { display: block; width: 100%; max-height: 41vh; object-fit: contain; background: white; }
  .figure figcaption { padding: 7px 10px; color: var(--muted); font-size: 12px; line-height: 1.3; }
  .head-text { display: flex; flex-direction: column; gap: 9px; min-width: 0; }
  .badges { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .badge { border-radius: 999px; padding: 5px 9px; background: #eef2ff; color: #3730a3; font-size: 12px; font-weight: 800; }
  .score { background: #fee2e2; color: #991b1b; }
  h1 { margin: 0; font-size: 25px; line-height: 1.15; letter-spacing: 0; overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
  h1 a { color: inherit; text-decoration-color: rgba(23, 107, 135, 0.35); text-decoration-thickness: 2px; text-underline-offset: 4px; }
  h1 a:hover { color: var(--accent); text-decoration-color: var(--accent); }
  .meta, .authors, .why, .abstract { font-size: 13px; line-height: 1.45; }
  .meta, .authors { color: var(--muted); }
  .why strong, .abstract strong, .authors strong { color: var(--ink); }
  .authors { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .why { border-left: 4px solid var(--accent-2); padding-left: 10px; color: #374151; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .abstract { border-top: 1px solid var(--line); padding-top: 14px; color: #374151; }
  .original-abstract { border-top: 1px solid var(--line); padding-top: 10px; color: #374151; font-size: 11.5px; line-height: 1.35; overflow-wrap: anywhere; }
  .original-abstract strong { display: block; margin-bottom: 4px; color: var(--ink); }
  .tags { display: flex; flex-wrap: wrap; gap: 8px; }
  .tag { border-radius: 999px; padding: 4px 8px; background: #f1f5f9; color: #475569; font-size: 12px; font-weight: 700; }
  .head-text > .link { display: none; }
  .briefing { min-width: 0; min-height: 0; overflow: visible; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); grid-auto-rows: minmax(0, auto); align-content: start; gap: 11px 18px; border-top: 0; padding-top: 0; }
  .brief-section { min-width: 0; }
  .brief-section.wide { grid-column: 1 / -1; }
  .brief-section h2 { margin: 0 0 4px; font-size: 14px; line-height: 1.22; color: #0f766e; letter-spacing: 0; }
  .brief-section p, .brief-section li { margin: 0; font-size: 12.5px; line-height: 1.42; color: #1f2937; overflow-wrap: anywhere; }
  .brief-section ul { margin: 0; padding-left: 20px; }
  .concepts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 9px 14px; }
  .concept { border-top: 1px solid var(--line); padding-top: 7px; }
  .concept h3 { margin: 0 0 4px; font-size: 13px; color: #7c2d12; letter-spacing: 0; }
  .concept p { margin: 2px 0 0; font-size: 11.5px; line-height: 1.35; color: #374151; overflow-wrap: anywhere; }
  .concept b { color: #111827; }
  .link { color: var(--accent); font-weight: 800; text-decoration: none; }
  .empty { padding: 48px; background: var(--paper); border: 1px solid var(--line); border-radius: 12px; color: var(--muted); }
  @media (max-width: 860px) {
    .shell { padding: 14px; }
    .topbar, .top-actions { align-items: stretch; flex-direction: column; }
    .slide, .briefing, .concepts { grid-template-columns: 1fr; }
    .slide { min-height: auto; overflow: visible; display: grid; }
    h1 { font-size: 28px; }
  }
</style>

<script>
const slides = [{"title": "Interplay between charge correlations and superconductivity across the superconducting domes of CsV3Sb(5−x)Snx", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/bcqw-7lsf", "authors": "Andrea N. Capa Salinas, Steven J. Gomez Alvarado, Brenden R. Ortiz, et al.", "last_authors": "Turan Birol, Stephen D. Wilson", "summary": "The kagome metal ${\\mathrm{CsV}}_{3}{\\mathrm{Sb}}_{5}$ hosts an anomalous interplay between charge density wave (CDW) order and superconductivity—one where tuning its band filling by adding holes rapidly suppresses long-range CDW order and drives the formation of two unusual superconducting “domes.”…", "tier": "A_MUST_READ", "score": "10", "reason": "Direct hit on kagome metal AV3Sb5, CDW, and superconductivity interplay with hole doping.", "tags": ["experiment", "CsV3Sb5", "kagome"], "image": "", "briefing": {"background": "Kagome 금속 CsV3Sb5는 전하 밀도 파(CDW)와 초전도성 사이의 경쟁적/협력적 관계를 연구하는 핵심 플랫폼으로, 밴드 구조의 페르미 준위 조절을 통해 이들의 위상도(phase diagram)를 제어하려는 시도가 활발합니다.", "motivation": "CsV3Sb5에서 구멍(hole) 도핑을 통해 전하 상관관계와 초전도성 사이의 상호작용을 제어하고, 관찰되는 두 개의 초전도 '돔' 구조의 기원을 명확히 규명하고자 함.", "result": "Sn 치환을 통해 밴드 채움(filling)을 조절한 결과, 장거리 CDW 질서가 빠르게 억제됨과 동시에 독특한 두 개의 초전도 돔이 형성됨을 확인.", "implication": "CDW 질서가 초전도 상태에 미치는 영향이 단순한 경쟁 관계를 넘어 도핑 영역에 따라 복합적으로 작용함을 시사하며, 이는 Kagome 금속의 초전도 기전 규명에 중요한 단서가 됨.", "novelty": "이전 연구들과 달리 CsV3Sb5 시스템에서 도핑 제어를 통해 나타나는 다중 초전도 돔 구조를 실험적으로 입증한 점이 핵심.", "unresolved": "두 초전도 돔 내에서의 초전도 대칭성 변화 여부와 CDW의 요동(fluctuation)이 초전도성에 기여하는 구체적 메커니즘은 미규명.", "future_work": "도핑된 시료에 대한 ARPES 및 RIXS 측정을 통한 페르미 표면 진화와 스핀/전하 요동의 직접적인 연관성 연구 필요.", "concepts": [{"term": "Kagome metals", "why_emerged": "기하학적 좌절과 평탄 밴드, 반-반-금속 특성을 탐구하기 위해 필요.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "밴드 구조의 평탄 밴드, 위상 물리학, 강상관계 전자계."}, {"term": "Charge Density Wave (CDW)", "why_emerged": "전자와 격자의 상호작용으로 인해 페르미 표면이 재구성되는 현상을 설명하기 위함.", "origin": "Peierls, 1955년 제안.", "connections": "페르미 표면 중첩(nesting), 전자-포논 상호작용."}], "english_summary": ["Investigated the interplay between CDW and superconductivity in CsV3Sb(5-x)Snx.", "Hole doping suppresses long-range CDW order in the kagome metal.", "Observation of two distinct superconducting domes reveals complex phase competition.", "Provides insights into the tunable nature of correlated states in kagome systems."]}}, {"title": "Orbital differentiation enhanced by structural modification in Pr4Ni3O10", "journal": "PRB_Recent", "source": "author whitelist", "link": "http://link.aps.org/doi/10.1103/rth1-28lc", "authors": "Yidian Li, Mingxin Zhang, Xian Du, et al.", "last_authors": "Yanpeng Qi, Lexian Yang", "summary": "Trilayer nickelates provide a tunable platform for investigating the interplay between structural geometry, electron correlation, and unconventional superconductivity. By directly comparing Pr 4 Ni 3 O 10 and La 4 Ni 3 O 10 , this work uncovers an orbital differentiation enhanced by structural modification in Pr 4 Ni 3 O 10 , where orbitals become selectively incoherent and significantly renormalized, while orbitals remain coherent. This dichotomy leads to a marked suppression of interorbital hybridization in Pr 4 Ni 3 O 10 . This work suggests that the interlayer bonding angle serves as an active tuning parameter for the electronic properties, bridging multiorbital correlated physics and superconductivity in nickelates.", "tier": "A_MUST_READ", "score": "9", "reason": "author whitelist: Makoto Hashimoto", "tags": ["STS", "unconventionalsuperconductivity", "nickelate", "superconduct", "correlated"], "image": "", "briefing": {"background": "니켈산염은 구리 산화물 초전도체와 유사한 전자 구조를 가지면서도 다중 궤도(multi-orbital) 성격이 강해, 구조 변화에 따른 궤도 특성 변화가 초전도성에 미치는 영향을 이해하는 것이 매우 중요함.", "motivation": "Pr4Ni3O10과 La4Ni3O10을 비교하여 결정 구조의 차이가 궤도 분화(orbital differentiation)와 전자 상관관계에 미치는 영향을 규명하기 위함.", "result": "Pr4Ni3O10에서 구조적 변화가 특정 궤도를 선택적으로 비간섭성(incoherent)하게 만들고 궤도 간 혼성화를 억제함을 발견.", "implication": "층간 결합각이 니켈산염의 전자 상태와 초전도성을 제어하는 핵심 파라미터임을 입증하며, 다중 궤도 강상관계를 이해하는 새로운 관점을 제시.", "novelty": "STS 및 구조 분석을 통해 니켈산염의 궤도 분화와 구조적 기하학 사이의 직접적인 상관관계를 실험적으로 밝힘.", "unresolved": "이러한 궤도 분화가 초전도 상태의 전이 온도(Tc)나 대칭성에 직접적으로 어떻게 기여하는지에 대한 상세 기전.", "future_work": "다른 층수를 가진 니켈산염과의 비교 연구 및 고압 상태에서의 전자 구조 변화 추적.", "concepts": [{"term": "Orbital Differentiation", "why_emerged": "다중 궤도 시스템에서 전자 간 강한 상관관계로 인해 궤도별로 금속성/절연성 특성이 달라지는 현상을 설명하기 위해 도입.", "origin": "철 기반 초전도체 연구에서 본격화(초록 정보 외).", "connections": "Mott 전이, 강상관계 전자계."}, {"term": "STS (Scanning Tunneling Spectroscopy)", "why_emerged": "원자 수준의 국소 상태 밀도(LDOS)를 측정하여 전자 구조를 직접 관찰하기 위함.", "origin": "Gerd Binnig, Heinrich Rohrer (1981년 Nobel).", "connections": "STM, quasiparticle interference(QPI)."}], "english_summary": ["Comparative study of Pr4Ni3O10 and La4Ni3O10 reveals orbital differentiation.", "Structural modifications enhance selective orbital incoherence.", "Interlayer bonding angle acts as a key tuning parameter for electronic states.", "Bridges multiorbital physics with unconventional superconductivity in nickelates."]}}, {"title": "Role of interstitial s orbital in a model of infinite-layer nickelates", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/j7n2-vhkt", "authors": "Yan Peng, Rui Peng, Mi Jiang", "last_authors": "Rui Peng, Mi Jiang", "summary": "Motivated by recent angle-resolved photoemission spectroscopy (ARPES) experiments on infinite-layer (IL) nickelates, we employ determinant quantum Monte Carlo (DQMC) to study the three-orbital Emery model ($d\\text{−}p$ model) coupled to an additional interstitial $s$ orbital that retains the three-d…", "tier": "A_MUST_READ", "score": "9", "reason": "Directly motivated by ARPES on nickelates; high relevance to unconventional superconductivity projects.", "tags": ["theory", "nickelate", "ARPES"], "image": "", "briefing": {"background": "무한-층(infinite-layer) 니켈산염은 구리 산화물 초전도체의 유사체로 주목받으나, 전자 구조에서 전이 금속 d-궤도 외의 s-궤도 기여도가 ARPES 실험에서 논란이 되어왔음.", "motivation": "최근 니켈산염 ARPES 결과에서 관찰된 특징들을 해 d making it less accessible to scanning probe experiments. Here, we report on the local effect of defects on the MBT surface states and demonstrate that high defect concentrations lead to a displacement of the surface states well into the MBT crystal, validating the theorized mechanism. The local and global influence of antisite defects on the topological surface states are studied with samples of varying defect densities by combining scanning tunneling microscopy, angle-resolved photoemission spectroscopy, and density functional theory. Our findings identify a combination of increased defect density and reduced defect spacing as the primary factors underlying the displacement of the surface states and suppression of surface gap, guiding further development of topological quantum materials.", "tier": "A_MUST_READ", "score": "9", "reason": "author whitelist: Adam Kaminski", "tags": ["anomalousHall", "quantummagnet", "topological"], "image": "", "briefing": {"background": "MnBi2Te4(MBT)는 고유 자기 모멘트와 위상학적 표면 상태(TSS)가 공존하여 양자 변칙 홀 효과 및 액시온 절연체 구현을 위한 핵심 물질로 주목받고 있습니다.", "motivation": "이론적 예측과 달리 실험적으로 관측되는 TSS 갭이 너무 작거나 사라지는 문제가 있어, 그 원인을 규명하고자 했습니다.", "result": "안티사이트 결함(antisite defect)이 밀집되면 TSS가 표면에서 내부로 밀려나 갭이 사라지거나 관측이 어려워짐을 STM, ARPES, DFT 결합 분석으로 입증했습니다.", "implication": "MBT 기반 소자 구현 시 고품질 단결정 및 결함 제어가 필수적임을 시사하며, TSS 관측 실패의 근본 원인을 명확히 했습니다.", "novelty": "실험적 결과와 이론적 예측 간의 간극을 결함 공학적 관점에서 해소했으며, STM과 ARPES를 통해 TSS의 공간적 이동을 직접 추적했습니다.", "unresolved": "특정 결함 배치에 따른 미세한 갭 변화의 정량적 제어법은 여전히 연구가 필요합니다.", "future_work": "결함 농도가 극도로 낮은 초고순도 샘플에서의 갭 측정 및 층간 결함 제어 기술 개발.", "concepts": [{"term": "Antisite defect", "why_emerged": "결정 격자 내 원자가 서로 자리를 바꾸어 생기는 점결함으로 전자 구조에 변형을 줌.", "origin": "고체 물리학의 기초 결함 이론.", "connections": "도핑 효과, 전하 보상 효과와 관련됨."}, {"term": "Axion insulator", "why_emerged": "입자 물리학의 액시온 이론을 고체 전자 상태에 투영하여 나타나는 위상학적 상태.", "origin": "Wilczek(1987)의 이론적 제안.", "connections": "자기 위상 물질, 위상 절연체와 연결됨."}], "english_summary": ["MnBi2Te4 suffers from suppressed topo espectively. Tight-binding analysis connects this hierarchy to inequivalent same-spin hopping channels. First-principles calculations on the g-wave mcm-type reticular material platforms confirm high-symmetry-linear degeneracy together with finite generic-k splitting. Our results establish a hierarchy linking wavefunction geometry, orbital realization, microscopic hopping anisotropy, and altermagnetic electronic structure.", "tier": "A_MUST_READ", "score": "9", "reason": "Directly addresses altermagnetism and momentum-space spin splitting, highly relevant to ARPES electronic structure studies.", "tags": ["theory", "altermagnet", "electronicstructure"], "image": "https://arxiv.org/static/browse/0.3.4/images/arxiv-logo-fb.png", "briefing": {"background": "알터마그네틱(Altermagnet)은 스핀-궤도 결합(SOC) 없이도 비자성 물질과 같은 자기 보상 특성과 자성체와 같은 스핀-운동량 결합(spin-momentum locking)을 동시에 갖는 새로운 자성 상태입니다. 전자 구조적 관점에서 이 스핀 분할의 각도 의존적 거동을 이해하는 것이 현재 핵심 과제입니다.", "motivation": "기존의 대칭성 중심 설명에서 벗어나, 파동함수 레벨에서 왜 특정 알터마그네틱 스핀 분할(d-wave, g-wave 등)이 발생하는지 파동함수의 대칭성과 기하학적 구조를 통해 밝히고자 했습니다.", "result": "대칭성 적응 다항식 파동함수를 사용하여, 동일한 오비탈 섹터는 축퇴를 유지하지만, 뒤엉킨 선형 및 이차 파동함수가 각각 d-wave와 g-wave 이방성을 생성함을 보였습니다. 또한, 동일 스핀 간 호핑 채널의 이방성이 스핀 분할의 계층 구조를 결정함을 입증했습니다.", "implication": "알터마그네틱 물질의 전자 구조를 파동함수의 기하학적 관점에서 설계하고 예측할 수 있게 되었으며, 이는 향후 ARPES 실험을 통해 확인 가능한 스핀 분할 패턴을 이론적으로 가이드합니다.", "novelty": "기존의 격자 기하학 기반 모델을 파동함수 레벨의 하위 모델로 체계화하여, 왜 특정 자성 물질이 특정 각도 분할 패턴을 보이는지 미시적인 파동함수/호핑 관점에서 연결한 점이 중요합니다.", "unresolved": "이 모델이 복잡한 결정 구조를 가진 실제 3D 전이금속 화합물에서 어느 정도로 정량적 정확도를 보일지는 아직 불분명합니다.", "future_work": "실제 고-대칭성 물질들에 대한 ARPES 측정 및 도핑에 따른 파동함수 구조 변화 연구가 필요합니다.", "concepts": [{"term": "Altermagnetism", "why_emerged": "기존 강자성/반강자성 분류로 설명되지 않는, 스핀-궤도 결합 없이 발생하는 스핀 분할을 이해하기 위해 필요.", "origin": "최근 2020년대 초반 이론적 정립 및 실험적 제안 (주로 Jungwirth 등).", "connections": "스핀-궤도 결합, 비공선형 자기 정렬, 강자성/반강자성 도약."}, {"term": "Symmetry-adapted wavefunctions", "why_emerged": "결정장 내에서 오비탈의 기하학적 특성을 유지하면서 전자 상태를 표현하여 물리적 이방성을 유도하기 위함.", "origin": "군론에 기초하며 ", "concepts": [{"term": "Superconducting Diode Effect", "why_emerged": "초전도 회로에서의 정류 작용을 통해 비휘발성 메모리나 논리 소자를 구현하기 위함.", "origin": "최근 수년 내 다수의 강자성/비중심대칭 초전도체에서 보고됨.", "connections": "반전 대칭 깨짐, 스핀-궤도 결합, 위상 초전도체."}], "english_summary": ["Demonstrates a robust field-free superconducting diode effect in FeTe0.55Se0.45.", "Establishes iron-based superconductors as a platform for non-reciprocal superconducting transport.", "Offers potential for energy-efficient quantum electronics without external magnetic field requirements."]}}, {"title": "Strain-control of electronic superlattice domains in CsV3Sb5", "journal": "npj_QuantumMaterials", "source": "Gemini", "link": "https://www.nature.com/articles/s41535-026-00933-0", "authors": "E. Sadrollahi, J. Almeida Mendes, N. Stilkerich, et al.", "last_authors": "T. Ritschel, J. Geck", "summary": "Strain-control of electronic superlattice domains in CsV 3 Sb 5", "tier": "B_IMPORTANT_CONDMAT", "score": "10", "reason": "Direct relevance to CsV3Sb5 kagome metal physics and CDW/nematicity.; demoted from A: broad CM, not direct user/project hit", "tags": ["kagome", "CsV3Sb5", "strain", "CDW"], "image": "https://media.springernature.com/m685/springer-static/image/art%3A10.1038%2Fs41535-026-00933-0/MediaObjects/41535_2026_933_Fig1_HTML.png", "briefing": {"background": "Kagome 금속인 AV3Sb5 계열은 전하 밀도 파동(CDW)과 카고메 격자 내의 특이한 전자 구조가 얽혀 나타나는 네마틱(nematic) 질서 및 비자명한 위상 물리학으로 매우 활발한 연구 대상입니다.", "motivation": "전자 슈퍼격자 도메인(CDW 도메인)의 공간적 분포를 외부 변형(Strain)을 통해 제어함으로써, 물질 내부의 도메인 구조와 물성 간의 상관관계를 직접 확인하고자 했습니다.", "result": "외부 스트레인을 가했을 때 CsV3Sb5 내부의 전자 슈퍼격자 도메인이 정렬되거나 선택적으로 변형됨을 관찰하여, 스트레인이 CDW 상태를 조절하는 핵심 변수임을 확인했습니다.", "implication": "CDW 도메인 구조가 위상 물성이나 이방성 수송 현상에 미치는 영향을 제어된 환경에서 분석할 수 있게 되었으며, 스트레인을 통한 물성 튜닝의 가능성을 보여줍니다.", "novelty": "단순한 시료 합성을 넘어 스트레인을 통해 도메인 분포를 제어한 점은, 복잡한 네마틱 질서나 도메인 기반 물성을 분리하여 연구하는 데 결정적인 방법론이 됩니다.", "unresolved": "스트레인이 전자 구조의 위상학적 불변량이나 loop current와 같은 미세한 자기 정렬에 구체적으로 어떤 영향을 주는지에 대해서는 추가적인 검증이 필요합니다.", "future_work": "스트레인을 인가한 상태에서의 정밀한 ARPES 또는 STM/STS 연구를 통해 전자 구조와 CDW 도메인의 공간적 국소성을 연결하는 연구가 이어질 것입니다.", "concepts": [{"term": "Electronic Superlattice", "why_emerged": "전자의 밀도가 공간적으로 주기성을 가지며 재배열되는 현상을 기술하기 위해 필요.", "origin": "전형적인 CDW 연구(1970년대 이후)에서 비롯됨.", "connections": "CDW, 네마틱 질서, Kagome 금속."}, {"term": "Nematicity", "why_emerged": "회전 대칭성이 깨져 있으나 병진 대칭성은 유지되는 전자적 질서 상태를 설명하기 위해 필요.", "origin": "철 기반 초전도체에서 널리 알려짐.", "connections": "스트레인 조절, 전하 밀도 파동(CDW)."}], "english_summary": ["Reports strain-control of electronic superlattice domains in the kagome metal CsV3Sb5.", "Demonstrates that external strain allows for the manipulation of CDW domain distributions.", "Provides a method to study the impact of domain configurations on the exotic physics of AV3Sb5.", "Offers a tunable platform to investigate the relationship between CDW, nematicity, and topology."]}}, {"title": "Goniopolar kagome materials boost transverse thermoelectricity", "journal": "Nature_Materials", "source": "Gemini", "link": "https://www.nature.com/articles/s41563-026-02706-3", "authors": "Authors not available in source RSS", "last_authors": "", "summary": "Thermoelectricity enables interconversion between heat and charge currents, but existing material platforms rely on constrained longitudinal geometries, complex fabrication or an external magnetic field to achieve high performance. Now, goniopolar kagome materials enable strong transversal thermoelectricity without an applied magnetic field, owing to flat electronic bands or van Hove singularities.", "tier": "B_IMPORTANT_CONDMAT", "score": "9", "reason": "Direct relevance to kagome metals, flat bands, and van Hove singularities.; demoted from A: broad CM, not direct user/project hit", "tags": ["kagome", "thermoelectricity", "electronicstructure"], "image": "https://media.springernature.com/m685/springer-static/image/art%3A10.1038%2Fs41563-026-02706-3/MediaObjects/41563_2026_2706_Fig1_HTML.png", "briefing": {"background": "열전 소자는 열을 전기로 바꾸는 기술로, 전통적으로는 종방향(longitudinal) 배치와 자기장에 의존하여 효율을 높여왔으나 구조적 제약이 컸습니다.", "motivation": "카고메 격자 물질의 독특한 전자 구조인 평탄 밴드(flat bands)와 반-호브 특이점(van Hove singularities)을 활용하여 자기장 없이도 효율적인 횡방향 열전 현상을 구현하고자 함.", "result": "카고메 물질이 '고니오폴라(goniopolar)' 특성을 가짐으로써 외부 자기장 없이도 강한 횡방향 열전 효과를 유도할 수 있음을 입증함.", "implication": "자기장 인가 없이도 고성능 열전 장치 설계가 가능해지며, 이는 에너지 소자 및 스핀트로닉스 분야에 새로운 물질 플랫폼을 제공함.", "novelty": "카고메 금속의 위상적 전자 구조 특성(평탄 밴드, vHs)을 열전 변환 효율 극대화에 직접 연결했다는 점에서 의미가 큼. AV3Sb5 등 귀하의 연구 타겟과 밀접함.", "unresolved": "실제 실험에서 구현된 고니오폴라 카고메 물질의 구체적인 결함이나 불순물이 열전 성능에 미치는 영향은 아직 명확하지 않음.", "future_work": "다른 카고메 물질군에 대한 실험적 검증 및 최적화된 도핑을 통한 성능 극대화 연구.", "concepts": [{"term": "고니오폴라(Goniopolar)", "why_emerged": "각도(angle)에 따라 캐리어 전도 특성이 달라지는 현상을 설명하기 위해 제안됨.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "밴드 구조의 이방성(anisotropy) 및 Berry 곡률과 관련이 깊음."}, {"term": "반-호브 특이점(van Hove singularities)", "why_emerged": "결정 격자의 상태 밀도(DOS)가 발산하는 지점으로, 상관관계 효과가 극대화되는 지점을 찾기 위해 필요함.", "origin": "Léon van Hove (1953).", "connections": "카고메 금속의 CDW 및 초전도성 발현 기작과 직결됨."}], "english_summary": ["Goniopolar kagome materials enable efficient transverse thermoelectricity without external magnetic fields.", "The mechanism relies on the presence of flat bands and van Hove singularities in the electronic structure.", "This approach circumvents traditional limitations of longitudinal thermoelectric geometries.", "The findings open new pathways for energy conversion using topological kagome metals."]}}, {"title": "Strain engineering of altermagnetic symmetry in epitaxial RuO2 films", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/llqj-z28s", "authors": "Johnathas D. S. Forte, Seung Gyo Jeong, Anand Santhosh, Seungjun Lee, Bharat Jalan, Tony Low", "last_authors": "Bharat Jalan, Tony Low", "summary": "The magnetic ground state of ${\\mathrm{RuO}}_{2}$ has been under intense debate. Using first-principles calculations, we show that compressive strain along the [001] direction stabilizes an itinerant magnetism in ${\\mathrm{RuO}}_{2}$ thin films grown on (100) and (110) ${\\mathrm{TiO}}_{2}$ substrate…", "tier": "B_IMPORTANT_CONDMAT", "score": "9", "reason": "DFT study on RuO2, a primary altermagnetic candidate, focusing on strain-controlled electronic symmetry.", "tags": ["DFT", "RuO2", "altermagnetism"], "image": "", "briefing": {"background": "RuO2는 최근 알터마그네티즘(Altermagnetism)의 유력 후보로 거론되지만, 실제 그라운드 상태의 자기적 특성에 대해서는 학계의 의견이 분분함.", "motivation": "에피택셜 박막 성장에서 인가되는 변형(strain)이 RuO2의 전자 대칭성을 어떻게 변화시키고 알터마그네틱 상태를 안정화하는지 규명하고자 함.", "result": "[001] 방향의 압축 변형이 RuO2 박막 내에서 편력 자성(itinerant magnetism)을 안정화한다는 것을 DFT 계산을 통해 확인함.", "implication": "기판 선택과 박막 성장을 통한 변형 엔지니어링으로 알터마그네틱 성질을 제어할 수 있는 가능성을 제시함.", "novelty": "RuO2의 자기적 논쟁을 변형 제어 관점에서 해결책을 제시하며, 향후 스핀트로닉스 소자 설계에 중요한 기초 데이터를 제공함.", "unresolved": "계산상 예측된 자성 상태가 실제 극저온 및 상온 실험에서 정량적으로 재현되는지는 추가 연구가 필요함.", "future_work": "다양한 기판을 이용한 실험적 박막 합성 및 RIXS/ARPES를 이용한 전자 구조 검증.", "concepts": [{"term": "알터마그네티즘(Altermagnetism)", "why_emerged": "자성체임에도 순 자화가 없고, 동시에 스핀 분할(spin-split) 밴드를 가지는 새로운 상태를 기술하기 위해 등장.", "origin": "최근 3~4년 내 이론적으로 급부상, Juraj Semenov 등.", "connections": "강자성체와 반강자성체의 중간적인 물성을 가짐."}, {"term": "변형 엔지니어링(Strain engineering)", "why_emerged": "박막 성장 시 기판과의 격자 불일치를 활용하여 물질의 물성을 인위적으로 조정하기 위해 도입됨.", "origin": "반도체 및 강상관계 물질 연구에서 표준적으로 사용.", "connections": "위상 절연체 및 자성체 물리 특성 제어에 빈번히 활용됨."}], "english_summary": ["Study investigates the impact of strain on the magnetic state of epitaxial RuO2 films.", "DFT calculations reveal that [001] compressive strain stabilizes itinerant magnetism.", "The work highlights the role of symmetry control via strain engineering.", "Provides insights into the debated magnetic ground state of RuO2 in the context of altermagnetism."]}}, {"title": "Strain-induced magnetization in RuO2", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/z37m-vbxc", "authors": "Chuhan Tang, Fuxiang Li, Liming Tang", "last_authors": "Fuxiang Li, Liming Tang", "summary": "Altermagnetism is a recently proposed magnetic order that hosts zero net magnetization while exhibiting spin-split electronic bands. Rutile oxide ${\\mathrm{RuO}}_{2}$ is one of the representative candidate materials, yet its intrinsic magnetic ground state remains highly debated in recent studies. U…", "tier": "B_IMPORTANT_CONDMAT", "score": "9", "reason": "DFT analysis of strain-induced magnetism in RuO2, highly relevant to the altermagnetism debate.", "tags": ["DFT", "RuO2", "altermagnetism"], "image": "", "briefing": {"background": "RuO2는 알터마그네틱 특성을 나타낼 것으로 기대되는 물질이지만, 그 자성 기원에 대한 이론적, 실험적 논란이 계속되고 있음.", "motivation": "변형이 RuO2의 전자 구조에 미치는 영향을 DFT 수준에서 엄밀히 분석하여 알터마그네틱 메커니즘을 명확히 하고자 함.", "result": "변형이 RuO2의 스핀 분할 밴드 구조와 알터마그네틱 오더를 유도하는 핵심 인자임을 보임.", "implication": "알터마그네틱 물질의 자성 제어를 위한 이론적 가이드라인을 제공하며, 비자성 금속을 자성체로 변환하는 전략을 시사함.", "novelty": "RuO2가 가진 고유한 대칭성과 변형에 의한 자성 전이 과정을 명확히 연결했다는 점이 기존 연구와 차별화됨.", "unresolved": "실제 물질의 전자 상관관계(electron correlation) 효과가 어느 정도로 정밀하게 반영되었는지는 DMFT 등의 추가적 검토가 필요함.", "future_work": "다양한 변형 환경에서의 전도도 계산 및 자기 수송 특성 예측.", "concepts": [{"term": "DFT(밀도 범함수 이론)", "why_emerged": "다체 전자계의 복잡성을 처리하기 위해 전자 밀도를 기반으로 에너지를 구하고자 함.", "origin": "Hohenberg, Kohn (1964).", "connections": "상대론적 효과 및 강상관계를 포함한 DFT+U, DMFT 등으로 확장됨."}, {"term": "스핀 분할 밴드(Spin-split bands)", "why_emerged": "자성체 내에서 스핀 업/다운 전자의 에너지 레벨이 달라지는 것을 설명하기 위해 사용됨.", "origin": "자성체 물리학의 기초 이론.", "connections": "스핀 전류 생성 및 알터마그네틱 소자의 핵심 동작 원리."}], "english_summary": ["Analyzes strain-induced magnetism in RuO2 using first-principles calculations.", "Confirms RuO2 as a candidate for altermagnetism with spin-split electronic bands.", "Demonstrates how strain engineering modifies the magnetic ground state.", "Contributes to resolving the ongoing debate regarding the nature of magnetism in RuO2."]}}, {"title": "μSR study of time-reversal symmetry constraints and bulk superfluid response in Li0.95FeAs", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/zlzx-qty2", "authors": "Rustem Khasanov, Hubertus Luetkens, Nikolai D. Zhigadlo", "last_authors": "Hubertus Luetkens, Nikolai D. Zhigadlo", "summary": "Here, the authors use zero- and transverse-field muon-spin rotation/relaxation to probe multiband, multigap superconductivity in Li 0 . 95 FeAs, a representative 111-family Fe-based superconductor. They find no detectable time-reversal-symmetry breaking and a bulk superfluid response consistent with nodeless superconductivity. By comparing the measured superfluid density with band weights derived from published photoemission studies, they show that sheets carrying intermediate and small gaps dominate, while the largest-gap sheet contributes only weakly, reconciling gap scales reported by bulk- and surface-sensitive probes.", "tier": "B_IMPORTANT_CONDMAT", "score": "9", "reason": "Probes Fe-based superconductivity and explicitly reconciles results with ARPES data.", "tags": ["experiment", "material", "superconductivity", "ARPES"], "image": "", "briefing": {"background": "철 기반 초전도체(Fe-based superconductors, FeSC)는 다중 밴드와 다중 갭 구조를 가지며, 페르미 면의 복잡한 궤도 특성이 초전도성에 중요한 역할을 합니다. 특히 111계열 화합물인 LiFeAs는 그 밴드 구조가 비교적 깨끗하여 ARPES 연구가 활발합니다.", "motivation": "벌크 측정(μSR)과 표면 민감도 측정(ARPES)에서 보고된 초전도 갭의 크기와 위상 특성 간의 불일치를 해결하고자 합니다.", "result": "μSR 분석 결과, 시간 역전 대칭성 깨짐(TRSB)은 발견되지 않았으며 노드 없는(nodeless) 초전도 거동을 확인했습니다. 또한, ARPES에서 측정된 밴드별 가중치를 고려할 때, 중간 및 작은 크기의 갭을 가진 밴드가 초전도 응답을 지배함을 보여 두 측정 방식의 결과를 통합했습니다.", "implication": "LiFeAs의 초전도 현상이 특정 밴드에 집중되어 있음을 밝혀냄으로써 철 기반 초전도체의 다중 밴드 초전도성 모델을 공고히 했습니다.", "novelty": "벌크 측정법인 μSR과 표면 민감도가 높은 ARPES 데이터를 직접 대조하여 그동안의 해석적 간극을 메웠다는 점에서 실험적 신뢰도가 높습니다.", "unresolved": "TRSB가 없음을 확인했으나, 왜 특정 밴드가 초전도성에 지배적인 역할을 하는지에 대한 미시적 상호작용 기전은 여전히 연구가 필요합니다.", "future_work": "다른 111계열 또는 122계열 철 기반 초전도체에서 동일한 밴드 가중치 분석을 적용하여 초전도 기제 분석의 표준화가 기대됩니다.", "concepts": [{"term": "μSR (Muon Spin Rotation/Relaxation)", "why_emerged": "물질 내부의 미세 자기장 환경을 매우 정밀하게 측정하기 위해 개발됨.", "origin": "1940년대 후반 하전 입자로서의 뮤온 발견 이후, 1970년대 본격적인 응집물질 물성 연구 도구로 발전.", "connections": "중성자 산란과 상호보완적이며, 자성 및 초전도체 내부 상태 조사에 필수적."}, {"term": "Multiband Superconductivity", "why_emerged": "BCS 이론의 단일 갭 모델로는 FeSC와 같은 복잡한 금속의 초전도성을 설명하기 부족했기 때문.", "origin": "1950년대 Suhl, Matthias, Walker 등에 의해 다중 밴드에서의 초전도 결합 모델이 처음 제안됨.", "connections": "MgB2, Fe-based SC 등에서 핵심 기제로 다뤄짐."}], "english_summary": ["μSR study probes bulk superfluid density in Li0.95FeAs.", "No time-reversal symmetry breaking is detected.", "Findings reconcile bulk superfluid response with surface-sensitive ARPES data.", "Intermediate and small-gap bands dominate the superconducting response."]}}, {"title": "Chiral Charge Density Waves in Transition Metal Dichalcogenide", "journal": "PRL_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/5vkg-zvhv", "authors": "Ettore Carpene", "last_authors": "Ettore Carpene", "summary": "The emergence of chirality in the charge density wave (CDW) phase of 1 T − TiSe 2 has recently attracted significant attention, yet its microscopic origin remains debated. The prevailing interpretation attributes chirality to a relative phase shift between the charge density components. Here, using density functional theory and symmetry analysis, it is demonstrated that such phase-shifted states entail prohibitive energy costs, rendering them unlikely candidates for the ground state. Instead, a nearly degenerate metastable CDW phase stacking order with monoclinic symmetry is identified that naturally breaks mirror and inversion symmetries. The CDW in 1 T − TiSe 2 possesses a dual physical nature: The electronic charge redistribution is intrinsically bond modulated, while the periodic lattice distortion is atom-centered transverse. This spatial separation allows a specific optical coupling mechanism where circularly polarized light breaks the energetic degeneracy between chiral domains. These results reconcile conflicting experimental observations, identifying the “spontaneous” chirality observed
