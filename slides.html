 "Identified Rashba-type spin-momentum locking via second-harmonic magnetotransport.", "Confirms the influence of nonsymmorphic symmetry on electronic transport.", "Provides insights into topological semimetal properties beyond standard ARPES."]}}, {"title": "Self-consistent Coulomb interactions from constrained dynamical mean-field theory", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/yb1w-8cxm", "authors": "Antik Sihi, Subhasish Mandal, Kristjan Haule", "last_authors": "Subhasish Mandal, Kristjan Haule", "summary": "Author(s): Antik Sihi, Subhasish Mandal, and Kristjan Haule Here, the authors develop constrained dynamical mean-field theory, a self-consistent first-principles approach for determining screened Coulomb interactions in correlated materials. The method incorporates local vertex corrections within the same many-body framework used to compute electronic spectra, yielding interaction strengths that enable excellent agreement with photoemission experiments across Mott insulators, correlated metals, altermagnets, and unconventional superconductors. [Phys. Rev. B 113, L201116] Published Fri May 29, 2026", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "DFT+DMFT development for altermagnets and superconductors; relevant to interpreting photoemission.", "tags": ["method", "photoemission", "altermagnet"], "image": "", "briefing": {"background": "강상관 전자계 물질에서 전자 간의 쿨롱 상호작용(U)은 물리적 성질을 결정하는 핵심 변수입니다. 기존 DFT+DMFT 계산에서는 U 값을 경험적으로 입력해야 하는 한계가 있어, 이를 예측적으로 구하는 방법론이 연구되어 왔습니다.", "motivation": "기존의 강제된 DMFT 방식의 부정확성을 극복하고, 다양한 상관계 물질에서 스펙트럼과 상호작용 강도를 동시에 정합성 있게 도출하고자 했습니다.", "result": "새로운 제약된(constrained) DMFT 프레임워크를 통해 스크리닝된 쿨롱 상호작용을 자가 정합적으로 도출하는 데 성공했습니다. 이는 Mott 절연체부터 알터마그네트(altermagnets)까지 다양한 물질군에서 실험적 분광 데이터와 우수한 일치를 보입니다.", "implication": "강상관 물질의 전자 구조 계산의 신뢰도를 대폭 높였으며, 특히 알터마그네트나 초전도체와 같은 복잡한 시스템의 물성 예측 가능성을 확장했습니다.", "novelty": "상호작용 변수를 예측적으로 계산하면서도 실험 데이터와 잘 일치한다는 점에서, DMFT 기반의 전자 구조 연구자들에게 매우 강력한 도구입니다.", "unresolved": "매우 큰 시스템에 대한 계산 비용과 더 강한 비국소적 상관관계에 대한 처리는 여전히 과제로 남아 있습니다.", "future_work": "ARPES나 RIXS 결과와 본 방법론을 직접 비교하여 미지의 강상관 물질들의 파라미터 최적화 연구가 활발할 것으로 예상됩니다.", "concepts": [{"term": "Constrained DMFT", "why_emerged": "상관 에너지(U)를 경험적 선택이 아닌 물질 내 전자 스크리닝 효과로부터 도출하기 위해 개발되었습니다.", "origin": "Kristjan Haule 그룹의 발전된 수치 계산 기법.", "connections": "DFT, DMFT, RPA(Random Phase Approximation)와 연결됨."}, {"term": "Altermagnet", "why_emerged": "강자성도 반강자성도 아닌, 스핀 분리된 밴드 구조를 가지는 새로운 자기 상을 구분하기 위해 필요합니다.", "origin": "최근 3~4년 사이 이론적 정립 및 실험적 검증 시도 중.", "connections": "반강자성, 위상적 밴드 구조, 스핀트로닉스와 밀접함."}], "english_summary": ["Developed a self-consistent constrained DMFT method for calculating screened Coulomb interactions.", "Ensures consistency between local vertex corrections and electronic spectra.", "Provides excellent agreement with photoemission experiments across various correlated systems.", "Applicable to Mott insulators, correlated metals, and altermagnets."]}}, {"title": "Electronic Layer Decoupling Driven by Density-Wave Order in La4Ni3O10", "journal": "PRL_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/qgl1-zh9f", "authors": "Ziqiang Guan (管梓强), Sophia F. R. TenHuisen, M. Tepie, et al.", "last_authors": "Christopher C. Homes, Matteo Mitrano", "summary": "Author(s): Ziqiang Guan (管梓强), Sophia F. R. TenHuisen, M. Tepie, Yifeng Zhao (赵祎峰), Ezra Day-Roberts, Harrison LaBollita, Alexander M. Young, Xiaomeng Cui (崔宵萌), Xinglong Chen (陈幸龙), Filippo Glerean, Carl Audric Guia, Mark P. M. Dean, Philip Kim, J. F. Mitchell, Antia S. Botana, Christopher C. Homes, and Matteo Mitrano We probe the density-wave transition of the trilayer nickelate ${\\mathrm{La}}_{4}{\\text{Ni}}_{3}{\\mathrm{O}}_{10}$ with polarization-resolved infrared spectroscopy. The low-energy electrodynamics is strongly anisotropic, with metallic in-plane and insulating out-of-plane character. In the ordered ph… [Phys. Rev. Lett. 136, 216501] Published Tue May 26, 2026", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Experimental study of density-wave order in nickelate, with relevance to CDW and unconventional superconductivity.", "tags": ["CDW", "nickelate", "spectroscopy", "experiment"], "image": "", "briefing": {"background": "니켈산염(Nickelate)은 구리산염 고온 초전도체의 유사한 전자 구조를 가져 비통상 초전도 후보 물질로 주목받고 있습니다. 이들의 전자적 층상 구조와 전하 밀도 파(CDW)의 관계는 이해가 매우 중요합니다.", "motivation": "3층 구조를 가진 La4Ni3O10에서 나타나는 상전이의 물리적 기원을 명확히 하고, 이 과정이 물질의 층간 결합에 어떤 영향을 미치는지 규명하고자 했습니다.", "result": "편광 분해 적외선 분광법을 통해 CDW 전이 이후 물질이 금속적 면내(in-plane) 성질과 절연성 면외(out-of-plane) 성질을 동시에 가지게 됨을 확인했습니다.", "implication": "CDW 상전이가 단순한 전하 재배열을 넘어, 물질의 전자적 차원성을 변형(decoupling)시킴을 입증했습니다.", "novelty": "CDW와 결합된 층상 탈결합(layer decoupling) 현상을 실증적으로 보여준 사례로, 니켈산염에서의 초전도성 억제 기작을 이해하는 핵심 단서가 될 것입니다.", "unresolved": "왜 특정 온도에서 이러한 층상 탈결합이 일어나는지에 대한 미시적 상호작용의 세부 사항은 아직 충분히 설명되지 않았습니다.", "future_work": "압력이나 도핑을 통해 CDW를 억제했을 때 초전도성이 회복되는지 확인하는 후속 연구가 필수적입니다.", "concepts": [{"term": "Electronic layer decoupling", "why_emerged": "층상 물질에서 전하가 층간을 이동하지 못하고 특정 층에 갇히는 현상을 기술하기 위해 필요합니다.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "전하 밀도 파(CDW), 저차원 자성, 고온 초전도체."}, {"term": "La4Ni3O10", "why_emerged": "삼층 니켈산염으로서 고온 초전도 메커니즘 연구의 모델 시스템으로 사용됩니다.", "origin": "다양한 페로브스카이트 니켈산염 연구 계보.", "connections": "라세이트(LaNiO3) 및 무한층 니켈산염 연구."}], "english_summary": ["Probed the density-wave transition in trilayer La4Ni3O10 using infrared spectroscopy.", "Revealed strongly anisotropic electrodynamics with metallic in-plane and insulating out-of-plane character.", "Demonstrates density-wave order-driven electronic layer decoupling.", "Contributes to understanding the relationship between CDW and unconventional superconductivity in nickelates."]}}, {"title": "Evidence of Chiral Fermion Edge Modes through Geometric Engineering of Thermal Hall Effect in α−RuCl3", "journal": "PRL_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/rn48-7j6y", "authors": "Heda Zhang, Gábor B. Halász, Sujoy Ghosh, et al.", "la : [], "english_summary": ["The detailed AI briefing was unavailable for this paper.", "Use the abstract, score reason, and original link for a quick first pass."]}}, {"title": "Generic integer and fractional quantum anomalous Hall crystals from interaction-driven band folding (Phys. Rev. B)", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2505.04138", "authors": "Hongyu Lu, Han-Qing Wu, Bin-Bin Chen, Wang Yao, Zi Yang Meng", "last_authors": "Wang Yao, Zi Yang Meng", "summary": "arXiv:2505.04138v4 Announce Type: replace Abstract: Among the extensive studies of fractional quantum anomalous Hall (FQAH) states, there recently appears a growing interest in the topological states with coexisting charge density wave (CDW) orders. Such states are referred to as Hall crystals. However, compared to those with integer Hall conductivities, the FQAH crystal (FQAHC) is still elusive even at the level of microscopic model. In this work, we numerically study a topological flat-band model on triangular lattice with spinless fermions. At fractional filling of the Chern band, the nearest-neighbor interaction leads to a commensurate and topologically trivial CDW state. Interestingly, the folded mini-band above the CDW gap is non-trivial, and we focus on the doping of it without any projection. A series of (F)QAHC states at (fractional) integer fillings of this mini-band are discovered and some FQAHC state might even exist in less \"ideal\" conditions. The ground-state degeneracies of such (F)QAHC states are enlarged by the CDW degeneracy and the Hall conductivities -- determined by the fillings of the mini-band -- are different from the fillings of the original Chern band. We also study the thermodynamics of an FQAHC state and find a compressible CDW phase at intermediate temperatures, which might serve as a precursor of lower temperature FQAHC phase. Moreover, we numerically demonstrate that such a generic scheme of doping CDW-folded topological mini-ba   briefing.className = 'briefing';
  appendBriefSection(briefing, 'Background', b.background);
  appendBriefSection(briefing, 'Motivation', b.motivation);
  appendBriefSection(briefing, 'Result', b.result);
  appendBriefSection(briefing, 'Implication', b.implication);
  appendBriefSection(briefing, "Why it's important / Novelty", b.novelty);
  appendBriefSection(briefing, 'Unresolved Questions', b.unresolved);
  appendBriefSection(briefing, 'Expected Future Work', b.future_work);
  if (b.concepts && b.concepts.length) {
    const section = document.createElement('section');
    section.className = 'brief-section wide';
    section.appendChild(textEl('h2', '', 'Concepts / Terms'));
    const concepts = document.createElement('div');
    concepts.className = 'concepts';
    b.concepts.forEach(c => {
      const item = document.createElement('div');
      item.className = 'concept';
      item.appendChild(textEl('h3', '', c.term || 'Concept'));
      [['왜 생겼나: ', c.why_emerged], ['누가 만들었나: ', c.origin], ['연결되는 흐름: ', c.connections]].forEach(([label, text]) => { if (!text) return; const p = document.createElement('p'); const bold = textEl('b', '', label); p.appendChild(bold); p.append(text); item.appendChild(p); });
      concepts.appendChild(item);
    });
    section.appendChild(concepts);
    briefing.appendChild(section);
  }
  if (b.english_summary && b.english_summary.length) { const section = document.createElement('section'); section.className = 'brief-section wide'; section.appendChild(textEl('h2', '', 'English Summary')); const ul = document.createElement('ul'); b.english_summary.slice(0, 5).forEach(line => ul.appendChild(textEl('li', '', line))); section.appendChild(ul); briefing.appendChild(section); }
  slideEl.appendChild(briefing);
  counterEl.textContent = `${index + 1} / ${slides.length}`;
  prevBtn.disabled = index === 0;
  nextBtn.disabled = index === slides.length - 1;
}
prevBtn.addEventListener('click', () => { index = Math.max(0, index - 1); render(); });
nextBtn.addEventListener('click', () => { index = Math.min(slides.length - 1, index + 1); render(); });
document.addEventListener('keydown', event => { if (event.key === 'ArrowLeft') prevBtn.click(); if (event.key === 'ArrowRight') nextBtn.click(); });
render();
</script>
</body>
</html>
