<title>Daily Paper Slideshow</title>
<style>
  :root {
    color-scheme: light;
    --bg: #f6f7f4;
    --paper: #ffffff;
    --ink: #111827;
    --muted: #64748b;
    --line: #d8ddd2;
    --accent: #176b87;
    --accent-2: #9a3412;
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; overflow: auto; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: var(--bg); color: var(--ink); }
  .shell { max-width: 1500px; min-height: 100vh; margin: 0 auto; padding: 14px 18px; display: flex; flex-direction: column; }
  .topbar { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 16px; }
  .top-actions { display: flex; align-items: center; gap: 10px; }
  .topbar a, button { border: 1px solid var(--line); border-radius: 8px; background: var(--paper); color: var(--ink); padding: 10px 14px; font-weight: 700; text-decoration: none; cursor: pointer; }
  button.primary { background: var(--accent); border-color: var(--accent); color: white; }
  button:disabled { opacity: 0.45; cursor: not-allowed; }
  .counter { color: var(--muted); font-weight: 700; }
  .slide { min-height: calc(100vh - 82px); background: var(--paper); border: 1px solid var(--line); border-radius: 10px; padding: 18px; box-shadow: 0 18px 42px rgba(15, 23, 42, 0.10); display: grid; grid-template-columns: minmax(310px, 0.86fr) minmax(0, 1.55fr); gap: 18px; overflow: visible; }
  .paper-head { min-width: 0; min-height: 0; overflow: visible; display: flex; flex-direction: column; gap: 12px; }
  .figure { margin: 0; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: #f8fafc; }
  .figure img { display: block; width: 100%; max-height: 41vh; object-fit: contain; background: white; }
  .figure figcaption { padding: 7px 10px; color: var(--muted); font-size: 12px; line-height: 1.3; }
  .head-text { display: flex; flex-direction: column; gap: 9px; min-width: 0; }
  .badges { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .badge { border-radius: 999px; padding: 5px 9px; background: #eef2ff; color: #3730a3; font-size: 12px; font-weight: 800; }
  .score { background: #fee2e2; color: #991b1b; }
  h1 { margin: 0; font-size: 25px; line-height: 1.15; letter-spacing: 0; overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
  h1 a { color: inherit; text-decoration-color: rgba(23, 107, 135, 0.35); text-decoration-thickness: 2px; text-underline-offset: 4px; }
  h1 a:hover { color: var(--accent); text-decoration-color: var(--accent); }
  .meta, .authors, .why, .abstract { font-size: 13px; line-height: 1.45; }
  .meta, .authors { color: var(--muted); }
  .why strong, .abstract strong, .authors strong { color: var(--ink); }
  .authors { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .why { border-left: 4px solid var(--accent-2); padding-left: 10px; color: #374151; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .abstract { border-top: 1px solid var(--line); padding-top: 14px; color: #374151; }
  .original-abstract { border-top: 1px solid var(--line); padding-top: 10px; color: #374151; font-size: 11.5px; line-height: 1.35; overflow-wrap: anywhere; }
  .original-abstract strong { display: block; margin-bottom: 4px; color: var(--ink); }
  .tags { display: flex; flex-wrap: wrap; gap: 8px; }
  .tag { border-radius: 999px; padding: 4px 8px; background: #f1f5f9; color: #475569; font-size: 12px; font-weight: 700; }
  .head-text > .link { display: none; }
  .briefing { min-width: 0; min-height: 0; overflow: visible; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); grid-auto-rows: minmax(0, auto); align-content: start; gap: 11px 18px; border-top: 0; padding-top: 0; }
  .brief-section { min-width: 0; }
  .brief-section.wide { grid-column: 1 / -1; }
  .brief-section h2 { margin: 0 0 4px; font-size: 14px; line-height: 1.22; color: #0f766e; letter-spacing: 0; }
  .brief-section p, .brief-section li { margin: 0; font-size: 12.5px; line-height: 1.42; color: #1f2937; overflow-wrap: anywhere; }
  .brief-section ul { margin: 0; padding-left: 20px; }
  .concepts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 9px 14px; }
  .concept { border-top: 1px solid var(--line); padding-top: 7px; }
  .concept h3 { margin: 0 0 4px; font-size: 13px; color: #7c2d12; letter-spacing: 0; }
  .concept p { margin: 2px 0 0; font-size: 11.5px; line-height: 1.35; color: #374151; overflow-wrap: anywhere; }
  .concept b { color: #111827; }
  .link { color: var(--accent); font-weight: 800; text-decoration: none; }
  .empty { padding: 48px; background: var(--paper); border: 1px solid var(--line); border-radius: 12px; color: var(--muted); }
  @media (max-width: 860px) {
    .shell { padding: 14px; }
    .topbar, .top-actions { align-items: stretch; flex-direction: column; }
    .slide, .briefing, .concepts { grid-template-columns: 1fr; }
    .slide { min-height: auto; overflow: visible; display: grid; }
    h1 { font-size: 28px; }
  }
</style>

<script>
const slides = [{"title": "Anisotropic bond-current susceptibilities and real-space current topology in correlated electron systems", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2607.25483", "authors": "Worapon Phatcharasirinawakun, Hiroyuki Yamase", "last_authors": "Worapon Phatcharasirinawakun, Hiroyuki Yamase", "summary": "We derive all symmetry-allowed bond-current form factors generated by nearest-neighbor bond-charge interactions on square, triangular, and kagome lattices. We find that the anisotropy of the bond-current susceptibility systematically favors ordering wave vectors that support closed loop-current states, whereas symmetry-related wave vectors with weaker susceptibility generate noncirculating current textures. Near van Hove filling, this correspondence is robust across all lattice geometries considered, producing staggered flux phases on the square lattice, diamond-shaped current patterns on the triangular lattice and both chiral and nonchiral loop-current states on the kagome lattice. Our results establish a direct link between bond-current form factors, susceptibility anisotropy, and real-space current topology, providing a general framework for identifying loop-current orders and interpreting signatures of time-reversal symmetry breaking in correlated electron materials.", "tier": "A_MUST_READ", "score": "10", "reason": "Direct hit: analyzes loop-current order and time-reversal symmetry breaking in kagome and other correlated electron systems.", "tags": ["kagome", "time-reversalsymmetrybreaking", "correlated", "loopcurrent"], "image": "https://arxiv.org/static/browse/0.3.4/images/arxiv-logo-fb.png", "briefing": {"background": "강상관계 물질에서 루프 전류(loop current) 상태는 시간 역전 대칭성 파괴(TRSB)를 유도하면서도 순 자화가 없는 독특한 질서 파라미터로, 카고메 금속(AV3Sb5) 등의 비전통적 현상을 설명하는 핵심 기제로 간주됩니다.", "motivation": "본 연구는 정방, 삼각형, 카고메 격자에서 인접 결합 전하 상호작용에 의해 생성되는 모든 대칭 허용 결합 전류 형태 인자를 도출하고, 감수성 이방성이 루프 전류 상태의 위상을 어떻게 결정하는지 규명하고자 했습니다.", "result": "결합 전류 감수성의 이방성이 닫힌 루프 전류 상태를 생성하는 특정 질서 벡터를 계통적으로 선호함을 발견했습니다. 특히 van Hove 충전 상태 근처에서 카고메 격자의 키랄 및 비키랄 루프 전류 상태가 나타나는 메커니즘을 확인했습니다.", "implication": "이 결과는 실험에서 관찰되는 결합 전류와 시간 역전 대칭성 파괴 신호를 격자 구조 및 전자 구조의 위상적 특성과 직접 연결하여 해석할 수 있는 일반적인 이론적 틀을 제공합니다.", "novelty": "카고메 금속의 루프 전류 및 TRSB 이슈와 직접적으로 연결되며, 감수성 이방성과 실공간 전류 위상 사이의 직접적인 상관관계를 밝혀내어 독자의 주요 관심사인 카고메 시스템 이해에 중요한 이론적 토대를 제공합니다.", "unresolved": "실제 AV3Sb5 물질의 복잡한 멀티 오비탈 효과나 다른 경쟁적인 전하 밀도파(CDW) 질서와의 구체적인 상호작용은 추가적인 정량적 계산이 필요할 것으로 보입니다.", "future_work": "도출된 이론적 프레임워크를 구체적인 카고메 화합물의 ARPES 데이터나 광학적 자기 응답 실험 결과와 비교하여 루프 전류의 존재를 확증하는 연구가 기대됩니다.", "concepts": [{"term": "Loop-current order", "why_emerged": "구리 산화물 초전도체 등에서 시간 역전 대칭성을 깨뜨리는 비전통적 질서를 설명하기 위해 도입되었습니다.", "origin": "C. M. Varma (1997) 등이 제안함.", "connections": "Kagome metals, Time-reversal symmetry breaking, Orbital magnetization."}, {"term": "Bond-current susceptibility", "why_emerged": "격자 위에서 결합(bond)을 따라 흐르는 전류가 외부 섭동에 어떻게 반응하는지 정량화하기 위해 필요합니다.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "Linear response theory, Charge density wave, Nematicity."}, {"term": "van Hove filling", "why_emerged": "상태 밀도가 발산하는 지점으로, 전하 밀도파나 초전도와 같은 불안정성이 극대화되는 전하 밀도 상태입니다.", "origin": "Léon van Hove (1953).", "connections": "Density of states, Fermi surface nesting, Kagome lattice physics."}, {"term": "Real-space current topology", "why_emerged": "전류 패턴이 형성하는 닫힌 고리나 위상적 특성을 실공간에서 정의하여 거시적 양자 현상을 설명하기 위해 등장했습니다.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "Chirality, Flux phases, Chern insulators."}], "english_summary": ["Derived symmetry-allowed bond-current form factors on square, triangular, and kagome lattices.", "Identified that susceptibility anisotropy favors closed loop-current states near van Hove filling.", "Established a direct link between bond-current factors and real-space current topology.", "Provides a theoretical framework for interpreting time-reversal symmetry breaking in kagome metals."]}}, {"title": "Direct visualization of gate-tunable flat bands in twisted double bilayer graphene", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2510.19632", "authors": "Souvik Sasmal (Department of Physics, Carnegie Mellon University, Pittsburgh, et al.", "last_authors": "Shubhayu Chatterjee (Department of Physics, Jyoti Katoch (Department of Physics", "summary": "The symmetry-broken correlated states in twisted double bilayer graphene (TDBG) can be tuned via several external knobs, including twist angle, displacement field, and carrier density. However, a direct, momentum-resolved characterization of how these parameters reshape the flat-band structure remains limited. In this study, we employ micro focused angle-resolved photoemission spectroscopy to investigate the flat-band dispersion of TDBG at a twist angle of 1.6, systematically varying the displacement field and carrier density via electrostatic gating. We directly observe multiple flat moir'e minibands near charge neutrality, including a flat remote valence band residing below the low-energy flat-band manifold. Furthermore, the dominant Coulomb repulsive energy over the flat- band bandwidth suggests favorable conditions for the emergence of interaction-driven correlated phenomena in TDBG. These findings establish that the formation and evolution of flat bands in TDBG arises from the interplay between the electron filling and the displacement field.", "tier": "A_MUST_READ", "score": "10", "reason": "Direct hits: micro-ARPES, twisted graphene, flat bands, and electronic structure spectroscopy.", "tags": ["experiment", "ARPES", "graphene", "flatband"], "image": "https://arxiv.org/html/2510.19632v2/x1.png", "briefing": {"background": "비틀린 모아레 시스템은 밴드 구조를 극도로 평탄하게 만들어 전자 간 상호작용이 지배하는 강상관 물리 현상을 연구할 수 있는 이상적인 플랫폼입니다.", "motivation": "비틀린 이중 이층 그래핀(TDBG)에서 변위장(displacement field)과 운반자 밀도 조절을 통해 플랫 밴드가 어떻게 변하는지 운동량 공간에서 직접 시각화하고자 했습니다.", "result": "micro-ARPES를 통해 1.6도 비틀린 TDBG의 플랫 밴드 분산을 직접 관측했습니다. 특히 전하 중성점 근처의 다중 플랫 밴드와 그 아래 위치한 원격 원자가 밴드를 확인했으며, 밴드 폭 대비 쿨롱 에너지가 지배적임을 밝혔습니다.", "implication": "게이트 전압을 이용해 플랫 밴드의 형태와 충전 상태를 정밀하게 조절할 수 있음을 확인하였으며, 이는 TDBG가 상호작용 유도 상관 상태를 연구하기 위한 강력한 조절 인자를 가졌음을 시사합니다.", "novelty": "독자의 핵심 관심사인 ARPES를 사용하여 모아레 시스템의 전자 구조 진화를 직접 관측했다는 점이 중요하며, 특히 외부 게이트에 의한 밴드 튜닝 가능성을 시각적으로 입증했습니다.", "unresolved": "플랫 밴드 내에서 발생하는 자발적 대칭성 파괴 상태(예: 절연체 또는 초전도)의 미시적 오더 파라미터와의 직접적인 연결 확인이 남아있습니다.", "future_work": "다양한 비틀림 각도에서의 밴드 매핑 및 상관 관계에 의한 에너지 갭(Gap) 형성 과정에 대한 더 높은 해상도의 실험이 필요합니다.", "concepts": [{"term": "micro-ARPES", "why_emerged": "모아레 초격자와 같이 크기가 매우 작은 마이크론 단위 샘플의 운동량 공간 전자 구조를 측정하기 위해 개발되었습니다.", "origin": "광학 기술의 발전에 따라 다양한 방사광 가속기 시설에서 구축됨.", "connections": "ARPES, Moire superlattice, Nanoscale electronic structure."}, {"term": "Flat band", "why_emerged": "전자의 운동 에너지가 억제되어 전자 간의 쿨롱 상호작용이 물리 현상을 지배하도록 하기 위해 필요합니다.", "origin": "Theoretical models like Lieb lattice or Magic-angle graphene.", "connections": "Strong correlation, Superconductivity, Mott insulator."}, {"term": "Twisted Double Bilayer Graphene (TDBG)", "why_emerged": "단순 비틀린 이층 그래핀보다 수직 전기장(변위장)을 통한 전자 구조 조절이 용이하여 등장했습니다.", "origin": "Cao et al. 및 여러 그룹에서 동시 연구됨.", "connections": "Van der Waals heterostructures, Magic angle, Gate-tunability."}, {"term": "Displacement field", "why_emerged": "이층 이상의 적층 구조에서 층간 전위차를 유도하여 밴드 갭이나 위상적 특성을 조절하기 위해 사용됩니다.", "origin": "Dual-gate FET structures in 2D materials.", "connections": "Bandgap engineering, Layer polarization, Valley physics."}], "english_summary": ["Directly visualized gate-tunable flat bands in 1.6-degree twisted double bilayer graphene using micro-ARPES.", "Observed multiple moire minibands and a remote valence band near charge neutrality.", "Confirmed the dominance of Coulomb interactions over the flat-band bandwidth.", "Demonstrated the systematic reshaping of electronic structure via displacement field and carrier density."]}}, {"title": "Stacking-dependent anisotropic altermagnetism in V1/3NbS2", "journal": "arXiv_CondMat", "source": "author whitelist", "link": "https://arxiv.org/abs/2607.25213", "authors": "Chris J. Lygouras, Nathan Prouse, Jack H. Drouin, et al.", "last_authors": "Satoru Nakatsuji, Collin L. Broholm", "summary": "We report profound impacts of the stacking sequence of triangular lattices of magnetic transition metal ions intercalated between the layers of the van der Waals material NbS$_2$. Using single crystal x-ray and neutron diffraction, and transport and magnetization measurements, we show there are two distinct polytypes of $\\rm V_{1/3}NbS_2$ with disparate easy axes of magnetization and different anomalous Hall responses. Self-consistent analysis of inelastic neutron scattering data provides evidence for oscillatory RKKY interactions that extend to 1 nm and stabilize quasi-collinear A-type altermagnetic orders in both polytypes though with perpendicular easy axes. The detailed stacking sequence of a bulk polytype crystal dramatically impact its macroscopic anomalous Hall response and magnetism, which suggests a new path to engineer the bulk properties of a layered three dimensional solid.", "tier": "A_MUST_READ", "score": "10", "reason": "author whitelist: Robert J. Birgeneau", "tags": ["STS", "anomalousHall", "altermagnet", "vanderWaals", "neutronscattering", "transport"], "image": "https://arxiv.org/static/browse/0.3.4/images/arxiv-logo-fb.png", "briefing": {"background": "알터마그네티즘(Altermagnetism)은 강자성(스핀 분리)과 반강자성(순 자화 제로)의 특성을 동시에 갖는 새로운 자기 분류로, 차세대 스핀트로닉스의 핵심 후보입니다.", "motivation": "반데르발스 전이금속 디칼코게나이드(TMD)인 NbS2에 삽입된 V 이온의 적층 방식(stacking)이 물질의 거시적 자기적, 수송적 특성에 미치는 영향을 조사했습니다.", "result": "두 종류의 서로 다른 폴리타입 V1/3NbS2를 발견했습니다. 이들은 서로 수직인 자기 용이축과 판이하게 다른 변칙 홀 응답을 보였으며, 중성자 산란을 통해 약 1nm 범위의 RKKY 상호작용이 A타입 알터마그네틱 질서를 안정화함을 확인했습니다.", "implication": "단순한 조성 변화가 아닌, 원자층의 적층 순서 제어만으로도 알터마그네틱 물질의 이방성과 홀 효과를 설계할 수 있다는 새로운 경로를 제시했습니다.", "novelty": "독자의 관심사인 알터마그넷, 변칙 홀 효과, 중성자 산란이 집약된 연구입니다. 특히 적층 구조와 알터마그네틱 특성 사이의 상관관계를 실험적으로 명확히 규명했습니다.", "unresolved": "두 폴리타입 사이의 경계나 혼합 상태에서 나타나는 미시적인 스핀 동역학 및 도메인 구조에 대한 분석이 추가로 필요합니다 erimental transport data and scattering theory in kagome systems."]}}, {"title": "Surface-dominant transport in Weyl semimetal NbAs nanowires for next-generation interconnects", "journal": "Science", "source": "Gemini", "link": "https://doi.org/10.1126/science.adx3027", "authors": "Yeryun Cheon, Mehrdad T. Kiani, Yi-Hsin Tu, et al.", "last_authors": "Ching-Tzu Chen, Judy J. Cha", "summary": "Ongoing demands for smaller and more energy-efficient electronic devices necessitate alternative interconnect materials with lower electrical resistivity at reduced dimensions. We report the synthesis of Weyl semimetal niobium arsenide (NbAs) nanowires through thermomechanical nanomolding with single crystallinity and controlled diameters down to 40 nanometers. The resistivity of NbAs nanowires decreases with decreasing diameter, and 40-nanometer-diameter nanowires exhibited a room-temperature resistivity of 10.5 ± 1.9 microhm·centimeters, which is ~70% lower than their bulk counterpart. Calculations attribute this resistivity reduction to surface-dominant conduction with a long carrier lifetime at finite temperatures. Further characterization of nanowires and bulk crystals revealed high breakdown current density, stability, and thermal conductivity. These properties highlight the potential of NbAs nanowires as next-generation interconnects that could surpass the limitations of current copper-based interconnects.", "tier": "B_IMPORTANT_CONDMAT", "score": "9", "reason": "Direct interest: experimental transport in Weyl semimetal nanowires, highly relevant to user profile.; demoted from A: broad CM, not direct user/project hit", "tags": ["Weylsemimetal", "transport", "nanowires", "topologicalmaterials"], "image": "", "briefing": {"background": "Weyl 반금속은 위상학적 비자명한 전자 구조를 가지며, 표면 상태에 의한 독특한 전도성을 보일 가능성이 있어 차세대 전자 소자 및 인터커넥트 재료로 주목받고 있습니다.", "motivation": "기존 구리 기반 인터커넥트의 한계를 극복하기 위해, 크기가 감소해도 낮은 저항을 유지할 수 있는 고성능 위상학적 나노 소재를 개발하고자 했습니다.", "result": "직경 40nm 이하의 NbAs 나노와이어를 성공적으로 합성하였 ples surface-potential-encoded physisorption with long-range diffusion to promote ordered nucleation and epitaxial alignment. This “soft” pathway enables strain-free tellurium epitaxy with a pristine vdW gap (∼1.4 angstrom) despite lattice mismatch (>3.6%) and generalizes across multiple vdW templates. Retaining hallmark advantages of ALD including scalability and uniformity, we further program in-plane orientation through vdW symmetry engineering to achieve quasi-single-crystalline tellurium films with pronounced anisotropy and a chiral anomaly signature. Our work establishes a universal, low-thermal-budget approach for integrating vdW materials and expands the scope of epitaxy within the ALD paradigm.", "tier": "B_IMPORTANT_CONDMAT", "score": "9", "reason": "Van der Waals epitaxy of tellurium showing chiral anomaly signature relevant to topological physics.; demoted from A: broad CM, not direct user/project hit", "tags": ["vanderWaals", "topologicalmaterial", "semimetal", "epitaxy", "materialsynthesis"], "image": "", "briefing": {"background": "반데르발스 이종접합 구조에서 고품질 박막 성장은 차세대 나노 전자 소자 구현을 위한 필수 공정 기술입니다.", "motivation": "ALD 공정에서의 비정질 성장을 억제하고, 낮은 온도에서 결정성을 유지하며 기판과 에피택셜하게 정렬된 텔루륨 박막을 성장시키고자 했습니다.", "result": "확산 제어형 에피택셜 ALD(Epi-ALD) 기술을 통해 텔루륨의 고결정성 성장을 달성하고, 카이랄 아노말리 신호를 관측했습니다.", "implication": "기존 ALD 공정의 제약을 극복함으로써 범용적인 고품질 위상학적 소재 합성 경로를 확보했습니다.", "novelty": "반데르발스 기판과 텔루륨 간의 계면을 원자 수준에서 프로그래밍하여 카이랄 특성을 유지하면서 대면적 성장이 가능함을 입증했습니다.", "unresolved": "더 다양한 반데르발스 재료 조합에 대한 보편성 검증과 더 정밀한 도핑 제어 기법에 대한 연구가 요구됩니다.", "future_work": "본 공정을 활용한 위상학적 소자 제작 및 텔루륨의 카이랄성에 기반한 스핀트로닉스 소자 응용이 기대됩니다.", "concepts": [{"term": "카이랄 아노말리", "why_emerged": "위상학적 물질에서 외부 전기장과 자기장에 의해 전하 보존이 깨지는 현상을 설명하기 위해 필요함.", "origin": "Adler-Bell-Jackiw 아노말리에서 유래.", "connections": "Weyl 반금속, 음의 자기저항과 연결됨."}, {"term": "반데르발스 에피택시", "why_emerged": "격자 불일치가 큰 재료 간의 이종접합에서 계면 결함을 최소화하기 위해 필요함.", "origin": "Koma et al. (1984) 등이 초기 개념 제안.", "connections": "2D 소재, vdW 이종접합 기술과 연결됨."}], "english_summary": ["Development of Diffusion-steered Epitaxial ALD (Epi-ALD) for tellurium films.", "Achieved high crystallinity on vdW templates despite lattice mismatch.", "Demonstrated chiral anomaly signature in the resulting tellurium films.", "Offers a scalable, low-thermal-budget approach for high-quality vdW materials synthesis."]}}, {"title": "A Catalogue of Topological Moir\\'e Bands in Twisted Semiconductors", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2607.25172", "authors": "Jiaheng Li, Yan Zhang, Jiaxuan Liu, et al.", "last_authors": "Hongming Weng, Quansheng Wu", "summary": "Twisted two-dimensional semiconductors provide a route to flat and topological moir\\'e minibands, but systematic principles for organizing their material dependence have remained unclear. Here, we establish a high-throughput framework that integrates structural relaxation, first-principles electronic structure calculations, and moir\\'e band topology. We apply this framework to 43 experimentally realized monolayers and 91 symmetry-inequivalent bilayer prototypes, yielding over 1,000 angle-resolved moir\\'e electronic band structures. This database reveals that the low-energy moir\\'e electronic structure is organized primarily by the valley character of the parent band edge together with stacking symmetry. In $\\Gamma$-valley systems, the miniband width usually follows a nearly quadratic twist-angle scaling, consistent with a folding-dominated kinetic-energy scale. In $K$-valley systems, stacking-controlled interlayer hybridization governs whether parent Berry curvature is redistributed into isolated valley Chern minibands. By contrast, $M$-valley systems form a more material-specific class associated with anisotropic and symmetry-constrained band folding. The same valley-and-stacking hierarchy rationalizes the emergence or suppression of $\\mathbb{Z}_2$ minibands, and surface termination in Janus bilayers provides a microscopic knob for changing the relevant ltermagnets was based on the spin-group approach, which is val…", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Electronic structure and band splitting analysis in a relevant altermagnetic system.", "tags": ["altermagnet", "electronicstructure", "antiferromagnet"], "image": "", "briefing": {"background": "Altermagnetism은 일반적인 강자성이나 반강자성과 달리, 순자화는 0이지만 대칭성 파괴에 의해 운동량 공간에서 스핀 분할(spin splitting)이 나타나는 새로운 자기 질서 상태임.", "motivation": "CrSb와 같은 반강자성체에서 나타나는 스핀 분할 현상을 기존의 스핀 그룹(spin-group) 접근법을 넘어 더 정밀하게 기술하고자 함.", "result": "Altermagnet 내의 전자 밴드가 어떻게 운동량 의존적 스핀 분할을 겪는지에 대한 이론적 체계 보완 및 구체적 기술.", "implication": "Altermagnet의 스핀 수송 및 제어 기술을 설계하는 데 필요한 전자 구조적 기반을 마련함.", "novelty": "기존 반강자성체로만 여겨졌던 CrSb가 altermagnet의 특성을 가진다는 점을 부각하며, Berry curvature 등 위상 물성과의 연관성을 강화함.", "unresolved": "실제 실험적 데이터(예: ARPES 스핀 분해 측정)와의 정량적 일치 여부 및 스핀 분할의 크기를 결정하는 미세 상호작용의 정도.", "future_work": "Spin-ARPES를 이용한 CrSb의 밴드 분할 직접 관측, Anomalous Hall 효과와의 상관관계 규명.", "concepts": [{"term": "Altermagnet", "why_emerged": "전통적인 강자성과 반강자성의 이분법으로 설명되지 않는, 비자성적이지만 스핀 분할이 존재하는 독특한 자기 상태를 분류하기 위해 필요.", "origin": "최근 5년 이내 이론적으로 제안 및 명명됨 (J. Železný 등).", "connections": "반강자성체, 스핀 궤도 결합, 밴드 토폴로지."}, {"term": "스핀 그룹 (Spin-group)", "why_emerged": "공간 대칭성과 스핀 대칭성을 동시에 고려하여 자기 구조의 대칭성을 분류하기 위한 대칭군 이론.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "자기 대칭성, 밴드 분할 이론."}], "english_summary": ["CrSb is analyzed as an altermagnetic system with momentum-dependent spin splitting.", "The study addresses theoretical descriptions of electronic bands in altermagnets.", "It emphasizes the spin-group approach to understand band structures without net magnetization.", "This work provides a framework for future spin-electronic device applications."]}}, {"title": "Effect of modest hydrostatic pressure on low-temperature transport behavior in La3Ni2O7 thin films", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/zjnc-vv8p", "authors": "Deepak Kumar, Jared Z. Dans, Keenan E. Avers, Ryan Paxson, Ichiro Takeuchi, Johnpierre Paglione", "last_authors": "Ichiro Takeuchi, Johnpierre Paglione", "summary": "How do La 3 Ni 2 O 7 thin films behaves under modest hydrostatic pressure? The authors here investigate epitaxial thin films under substrate selection, oxygen treatment, and hydrostatic pressure, and reveal tunable transport behavior, where modest pressure drives a transition from Fermi liquid-like metallicity toward non-Fermi liquid response. These findings highlight strain- and pressure-enabled control of bilayer nickelate thin films, offering a concise pathway to explore exotic low-temperature electronic states.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Experimental study on a key nickelate compound, showing transition to non-Fermi liquid behavior.", "tags": ["experiment", "nickelates", "transport"], "image": "", "briefing": {"background": "La3Ni2O7은 고온 초전도체 연구에서 철 기반 초전도체와 유사한 구조적/전자적 특성을 공유하여 큰 주목을 받고 있는 이중층 니켈산염입니다.", "motivation": "본 연구는 이 물질의 기판 스트레인과 정수압에 따른 전자 구조의 변화, 특히 저온에서의 전도 특성 변화를 탐구하고자 합니다.", "result": "정수압 인가 시 페르미 액체(Fermi liquid) 금속성에서 비페르미 액체(non-Fermi liquid) 거동으로의 전이를 관찰했습니다.", "implication": "니켈산염 박막에서 외부 변수(압력, 스트레인)가 강상관 전자 상태를 정밀하게 제어할 수 있는 핵심 도구임을 시사합니다.", "novelty": "벌크 시료가 아닌 에피택셜 박막을 사용하여 스트레인 효과와 압력 효과를 결합해 전자 상태를 튜닝했다는 점이 독창적입니다.", "unresolved": "비페르미 액체 상태가 어떠한 미시적 산란 메커니즘이나 상관관계에 의한 것인지에 대한 상세 정보는 부족합니다.", "future_work": "온도 변화에 따른 수송 특성의 자세한 멱법칙 분석과 ARPES를 통한 전자 구조 변화 직접 관측이 필요합니다.", "concepts": [{"term": "비페르미 액체 (Non-Fermi Liquid)", "why_emerged": "강한 전자 상관관계로 인해 란다우의 페르미 액체 이론이 파괴되는 금속 상태를 설명하기 위해 필요합니다.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "양자 임계점(QCP), 고온 초전도체 내의 이상 금속 상태."}, {"term": "이중층 니켈산염 (Bilayer Nickelate)", "why_emerged": "구조적으로 큐프레이트와 유사하면서도 자기적 성질을 포함하여 새로운 고온 초전도 메커니즘 후보로 부상했습니다.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "La3Ni2O7, La4Ni3O10, 페로브스카이트 산화물."}], "english_summary": ["La3Ni2O7 thin films were investigated under varying substrate strain and hydrostatic pressure.", "Experimental results show a tunable transition from Fermi liquid to non-Fermi liquid transport behavior.", "Pressure-enabled control provides a new pathway to study correlated electronic states in nickelate systems."]}}, {"title": "Electronic states at twist stacking faults in rhombohedral graphite", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/9nng-3m6q", "authors": "Xiaoqian Liu, Yifei Guan, Oleg V. Yazyev", "last_authors": "Yifei Guan, Oleg V. Yazyev", "summary": "Flat bands are typically associated with finely tuned moiré systems in two dimensions. Here we show that twist stacking faults in bulk rhombohedral graphite generically produce nearly flat interface bands governed by the interplay between the moiré periodicity and Zak phase topology. We identify a c…", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Moire and flat-band physics are highly relevant to the user's research interests.", "tags": ["moire", "flatband", "graphite"], "image": "", "briefing": {"background": "층상 구조를 가진 흑연의 적층 구조 변화와 모아레 패턴은 전자 밴드 구조를 극적으로 변화시켜 강상관 및 위상 물리 현상을 유도할 수 있습니다.", "motivation": "롬보헤드럴(rhombohedral) 흑연에서 비틀림 적층 결함(twist stacking faults)이 전자 구조에 미치는 영향을 규명하고자 합니다.", "result": "모아레 주기성과 Zak 위상 위상학의 상호작용으로 인해 계면에서 거의 평탄한(nearly flat) 밴드가 형성됨을 밝혔습니다.", "implication": "인위적인 초격자 제작 없이도 물질 내의 자연적인 결함 구조를 통해 평탄한 밴드 물성을 구현할 수 있는 가능성을 제시합니다.", "novelty": "일반적인 모아레 물질과 달리 벌크 구조의 결함에서 평탄 밴드가 유도된다는 점이 흥미롭습니다.", "unresolved": "이러한 평탄 밴드가 실제 저온 수송 특성이나 초전도성 같은 강상관 현상으로 발현되는지에 대한 실험적 증거는 아직 없습니다.", "future_work": "STS/STM을 통한 계면 국소 상태 밀도(LDOS) 직접 관측과 평탄 밴드 근처의 도핑 효과 연구가 기대됩니다.", "concepts": [{"term": "평탄 밴드 (Flat Band)", "why_emerged": "전자의 운동 에너지가 억제되어 전자-전자 상호작용이 지배적인 역할을 하도록 만들어 강상관 현상을 연구하기 위해 필요합니다.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "모아레 격자, 꼬인 이중층 그래핀."}, {"term": "Zak 위상 (Zak Phase)", "why_emerged": "1차원 시스템의 위상적 성질을 기술하기 위해 도입된 베리 위상의 한 형태입니다.", "origin": "J. Zak (1989)", "connections": "위상 절연체, 밴드 토폴로지."}], "english_summary": ["Twist stacking faults in rhombohedral graphite are shown to induce flat interface bands.", "The band formation arises from the interplay between moiré periodicity and Zak phase topology.", "This mechanism offers a way to realize flat band physics without precise moiré engineering."]}}, {"title": "Highly fluctuating double-q magnetic order in the van der Waals metal CeTe3", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/m9lb-4vhx", "authors": "Ryutaro Okuma, Yuita Fujisawa, Natsumi Maekawa, et al.", "last_authors": "Yoshinori Okada, Daichi Ueta", "summary": "${\\mathrm{CeTe}}_{3}$ is a van der Waals antiferromagnet composed of magnetic ${[\\mathrm{CeTe}]}^{+}$ layers coupled to highly conducting ${\\mathrm{Te}}^{0.5−}$ square nets. Its simple quasi-two-dimensional electronic structure and cleavable nature make it an appealing platform for exploring correla…", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Experimental study of a cleavable magnetic vdW metal related to the RTe3 CDW family.", "tags": ["experiment", "vanderWaals", "magnetism", "CeTe3"], "image": "", "briefing": {"background": "RTe3 화합물 계열은 전하 밀도 파동(CDW)과 자기적 성질이 공존하는 vdW 물질로, 전자-격자 결합 연구의 대표적 플랫폼입니다.", "motivation": "CeTe3 내의 자기적 정렬 상태가 낮은 차원성과 전도성 Te 층과 어떻게 상호작용하는지 규명하고자 합니다.", "result": "CeTe3에서 변동성이 강한 double-q 자기적 질서가 존재하며, 전도층과의 결합이 전자 구조에 영향을 줌을 시사합니다.", "implication": "자기적 질서와 CDW가 공존하는 시스템에서 스핀-전하 결합의 복잡성을 이해하는 토대가 됩니다.", "novelty": "CeTe3의 자기적 상태를 명확히 규명했으며, 자기적 정렬의 요동(fluctuation)이 전자 구조에 미치는 영향을 실험적으로 추적했습니다.", "unresolved": "Double-q 자기 질서의 정확한 미시적 기원과 CDW와의 정량적인 결합 상수는 아직 상세히 규명되지 않았습니다.", "future_work": "ARPES를 통한 자기 질서 전후의 페르미 표면 변화 관찰 및 중성자 산란을 통한 자기 구조의 직접적 검증이 필요합니다.", "concepts": [{"term": "Double-q 자기 질서", "why_emerged": "단일 벡터로 기술되지 않는 복잡한 자기 구조를 이해하기 위해 필요합니다.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "자기 스카이뮨, 자기적 상전이."}, {"term": "Van der Waals 자성체", "why_emerged": "박리가 가능하여 2차원 환경에서의 자성을 제어하고 연구하기 위해 필요합니다.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "CrI3, Fe3GeTe2."}], "english_summary": ["CeTe3 is studied as a van der Waals antiferromagnet with highly conducting square nets.", "Researchers identify a highly fluctuating double-q magnetic order in the system.", "This work provides insight into the interplay between magnetism and electronic states in cleavable CDW materials."]}}, {"title": "Light-induced parity anomaly and topological phase transitions in the antiferromagnetic topological insulator MnBi2Te4", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/y5s3-ndym", "authors": "Jiayan Zhang, Yu Wang, Yanxia Xing", "last_authors": "Yu Wang, Yanxia Xing", "summary": "The utilization of periodic driving to control nonequilibrium topological phases has garnered increasing attention in condensed matter physics. In this work, within the high-frequency limit of Floquet theory, we investigate the effects of circularly polarized light (CPL) on the topological propertie…", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Floquet analysis of MnBi2Te4, a relevant magnetic topological insulator system.", "tags": ["topologicalinsulator", "floquet", "antiferromagnet"], "image": "", "briefing": {"background": "위상 절연체는 시간 반전 대칭성이 보존될 때 보호되는 위상학적 성질을 가지지만, 외부 자기장이나 자성 불순물을 도입하여 이를 깨뜨림으로써 새로운 양자 상태를 유도할 수 있습니다. Floquet 공학은 주기적인 빛을 이용하여 평형 상태에서는 불가능한 새로운 위상적 상태를 동적으로 생성하는 기술입니다.", "motivation": "본 연구는 자기 위상 절연체인 MnBi2Te4에 원편광(CPL)을 조사했을 때 나타나는 Floquet 위상적 변화와 패리티 이상(parity anomaly) 현상을 이론적으로 규명하고자 합니다.", "result": "고주파 한계 내에서 Floquet 이론을 적용하여 MnBi2Te4가 빛에 의해 위상적 위상 전이를 겪으며, 특정 조건에서 패리티 이상과 연관된 위상적 특성이 발현될 수 있음을 보였습니다.", "implication": "자성 위상 물질의 위상학적 상태를 레이저를 이용해 실시간으로 제어할 수 있는 가능성을 제시하며, 이는 양자 컴퓨터 소자나 차세대 광전자 소자로의 응용에 중요한 이론적 토대가 됩니다.", "novelty": "MnBi2Te4와 같은 반강자성 위상 절연체에 Floquet 공학을 결합하여 동적 위상 조절 가능성을 체계적으로 분석했다는 점이 독자에게 흥미롭습니다.", "unresolved": "실제 실험에서의 레이저 조사 조건(세기, 주파수 범위)과 물질의 가열 효과 사이의 상쇄 관계가 명확히 논의되지 않았습니다.", "future_work": "실제 ARPES를 이용한 시간 분해 측정(time-resolved ARPES)을 통해 이 이론적 예측을 실험적으로 검증하는 연구가 필요합니다.", "concepts": [{"term": "Floquet Engineering", "why_emerged": "물질에 주기적인 외부장을 걸어 새로운 유효 해밀토니안을 생성하기 위해 필요.", "origin": "초기 개념은 1960년대 제시되었으나 현대적 응용은 최근 10년 내 활발해짐.", "connections": "위상 물질의 밴드 구조 제어, 광유도 초전도성."}, {"term": "Parity Anomaly", "why_emerged": "2차원 디랙 페르미온 시스템에서 시간 반전 대칭성을 깰 때 질량이 비대칭적으로 생성되는 현상을 이해하기 위해.", "origin": "1980년대 장 이론에서 제안됨.", "connections": "양자 비정질 홀 효과, 위상 절연체 표면 상태."}], "english_summary": ["Analyzes the impact of circularly polarized light on the topological properties of MnBi2Te4.", "Uses Floquet theory in the high-frequency limit to describe topological phase transitions.", "Investigates the emergence of parity anomaly induced by periodic driving.", "Provides a theoretical framework for manipulating topological phases in magnetic topological insulators."]}}, {"title": "Percolation-driven ferromagnetism in a dilute magnetic topological insulator", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/fb7q-qfpw", "authors": "Farhan Islam, Santanu Pakhira, Deborah L. Schlagel, et al.", "last_authors": "Robert J. McQueeney, David Vaknin", "summary": "Single-crystal neutron scattering and magnetic susceptibility measurements of the dilute magnetic topological insulator (${\\mathrm{Sn}}_{0.9}{\\mathrm{Mn}}_{0.1})\\mathrm{Te}$ demonstrate the emergence of long-range ferromagnetic (FM) order below ${T}_{\\mathrm{C}}=12±1\\phantom{\\rule{0.16em}{0ex}}\\math…", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Neutron scattering and magnetic study of a magnetic topological insulator (Sn,Mn)Te.", "tags": ["material", "topologicalinsulator", "neutronscattering"], "image": "", "briefing": {"background": "위상 절연체에 자기 이온을 도핑하여 자성을 띠게 하면 자기 위상 절연체(MTI)가 되는데, 이는 양자 비정질 홀 효과 등을 구현하는 플랫폼이 됩니다. 그러나 도핑된 자성 불순물의 분포가 불균일할 때 자성 전이가 어떻게 일어나는지는 응집물질물리학의 주요 과제입니다.", "motivation": "희석된 자기 위상 절연체인 (Sn,Mn)Te 시스템에서 Mn 도핑에 의한 강자성 전이 메커니즘을 규명하고, 그것이 percolation(침투) 모델과 어떻게 연관되는지 확인하고자 합니다.", "result": "중성자 산란 실험을 통해 Mn이 풍부한 나노 클러스터가 형성되고, 이들의 퍼콜레이션(percolation)을 통해 Tc = 12K 이하에서 장거리 강자성 질서가 형성됨을 증명했습니다.", "implication": "자기 위상 절연체에서 자기적 질서가 균일한 고용체가 아닌 국소적인 클러스터링에 의해 지배될 수 있음을 시사하여, 관련 소자의 자기적 균일성 확보에 중요한 통찰을 제공합니다.", "novelty": "단순한 도핑 농도에 의한 강자성 발현이 아니라, 나노 규모의 불균일한 구조(Percolation)가 강자성 형성에 핵심적인 역할을 한다는 실험적 증거를 제시했습니다.", "unresolved": "이러한 나노 클러스터링이 물질의 위상학적 표면 상태의 Dirac cone에 구체적으로 어떤 산란 효과를 주는지에 대한 직접적인 증거는 부족합니다.", "future_work": "STS(주사 터널링 분광)를 이용해 Mn 클러스터 부근의 전자 상태 밀도 변화와 국소적인 자성 효과를 직접 관측하는 연구가 이어져야 합니다.", "concepts": [{"term": "Percolation Theory", "why_emerged": "불규칙한 매질 속에서 물리적 연결성이나 상태 전이를 설명하기 위해.", "origin": "1950년대 Broadbent와 Hammersley에 의해 제안.", "connections": "전도성 복합체, 자성 전이, 도핑된 반도체."}, {"term": "Dilute Magnetic Topological Insulator", "why_emerged": "위상 절연체에 자성을 부여하여 위상 양자 현상을 제어하기 위해.", "origin": "2010년대 이후 MTI 연구가 활발해지며 확립됨.", "connections": "Mn 도핑된 Bi2Se3, 비정질 홀 효과."}], "english_summary": ["Studies ferromagnetic ordering in the dilute magnetic topological insulator (Sn,Mn)Te.", "Identifies that Mn ions form clusters, driving ferromagnetism via a percolation mechanism.", "Utilizes single-crystal neutron scattering and magnetic susceptibility measurements.", "Highlights the role of chemical inhomogeneity in magnetic topological insulators."]}}, {"title": "Pressure-induced redistribution of oxygen hole states in La4Ni3O10", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/w85f-qpt2", "authors": "Guiwen Jiang, Liang Si, George A. Sawatzky, Mi Jiang", "last_authors": "George A. Sawatzky, Mi Jiang", "summary": "Using density functional calculations and multiorbital, multiatom cluster exact diagonalization that includes local exchange and Coulomb interactions, we explored the local low-energy electronic states of trilayer ${\\mathrm{La}}_{4}{\\mathrm{Ni}}_{3}{\\mathrm{O}}_{10}$ via a minimal ${\\mathrm{Ni}}_{3}…", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Nickelates and electronic structure/DFT+DMFT are relevant to the user's profile.", "tags": ["nickelate", "electronicstructure", "DFT"], "image": "", "briefing": {"background": "니켈산염(Nickelates)은 큐프레이트와 유사한 전자 구조를 가져 고온 초전도체의 후보 물질로 주목받고 있습니다. La4Ni3O10은 3층 구조 니켈산염으로, 압력 하에서 나타나는 전자적 상태 변화는 초전도성 기작과 밀접한 연관이 있습니다.", "motivation": "압력이 가해질 때 La4Ni3O10 내부의 니켈-산소 층에서 발생하는 전자 재분배(charge redistribution) 메커니즘을 DFT와 DMFT를 조합하여 이해하고자 합니다.", "result": "압력이 증가함에 따라 Ni와 O 사이의 전하 전이가 일어나며, 특히 O 2p 궤도와 Ni 3d 궤도 사이의 혼성 강도가 변하여 금속-절연체 전이나 자기적 상태 변화에 영향을 미침을 보였습니다.", "implication": "니켈산염의 압력 의존적 초전도 현상의 근본 원인이 산소 홀 상태의 전자적 재배치에 있음을 강력하게 뒷받침하며, 향후 압력 제어를 통한 초전도성 설계 가능성을 높입니다.", "novelty": "DFT+DMFT 결합 방법론을 통해 복잡한 3층 구조 물질에서의 궤도 간 혼성 효과를 정밀하게 분석하여 실험적 압력 결과와 연결했다는 점이 중요합니다.", "unresolved": "초전도 상으로 전이되는 정확한 임계 압력에서의 스핀 파동 성질에 대해서는 추가적인 다체 계산이 필요합니다.", "future_work": "고압 조건 하에서의 X-ray 흡수 분광법(XAS)이나 RIXS 측정을 통해 계산된 산소 홀 상태의 변화를 실험적으로 검증해야 합니다.", "concepts": [{"term": "DFT+DMFT", "why_emerged": "강상관 전자계 물질의 밴드 구조와 강한 전자 상관관계를 동시에 다루기 위해.", "origin": "1990년대 후반~2000년대 초반 개발.", "connections": "큐프레이트, 니켈산염, 금속-절연체 전이."}, {"term": "Oxygen Hole", "why_emerged": "전이 금속 산화물에서 전하 이동(charge transfer) 현상을 이해하기 위해.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "Zaanen-Sawatzky-Allen(ZSA) 분류, 전하 이동 절연체."}], "english_summary": ["Investigates the electronic structure of trilayer La4Ni3O10 under pressure.", "Uses DFT+DMFT methods to track redistribution of oxygen hole states.", "Links electronic state changes to Ni-O orbital hybridization.", "Provides insights into the mechanism of pressure-induced physical changes in nickelates."]}}, {"title": "Suppression of magnetism in Co3Sn2S2 under external pressure", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/v623-m3y4", "authors": "A. Chmeruk, D. Jones, R. Dwadasi, J. Ebad-Allah, F. Beiuşeanu, F. Schilberth, et al.", "last_authors": "H. Nakamura, C. A. Kuntscher, A. Östlin, and L. Chioncel", "summary": "Magne ogical", "superconductivity", "PtBi2"], "image": "", "briefing": {"background": "PtBi2는 위상 반금속으로 알려져 있으며, 이 물질의 표면 상태가 초전도성을 띨 때, 그것이 위상 초전도체로서 기능할 수 있는지에 대한 논의가 활발합니다.", "motivation": "Fermi arc 중앙에서 관측된 결절(nodal) 초전도 갭의 형성 메커니즘을 이론적으로 규명하고자 했습니다.", "result": "표면 상태의 전자 구조와 결합한 특정 초전도 결합 메커니즘이 노달 결절을 형성함을 제시했습니다.", "implication": "PtBi2가 위상 초전도체 후보 물질로서 적합하며, 마요라나 준입자 연구를 위한 플랫폼이 될 수 있음을 시사합니다.", "novelty": "PtBi2 표면의 독특한 전자 구조와 위상적 특성이 어떻게 노달 초전도성을 생성하는지 논리적 메커니즘을 제공했습니다.", "unresolved": "제시된 이론적 모델과 실험적 RIXS나 ARPES 측정치 간의 정량적 일치 여부는 추가적인 검증이 필요합니다.", "future_work": "결절의 위치와 위상적 특성을 확인하기 위한 위상 민감형 분광학 실험이 필요합니다.", "concepts": [{"term": "위상 초전도성", "why_emerged": "위상 절연체와 초전도체의 결합을 통해 마요라나 페르미온을 구현하기 위해 도입되었습니다.", "origin": "Fu와 Kane(2008)의 이론적 제안이 시초입니다.", "connections": "위상 반금속, Majorana 준입자, 양자 컴퓨팅."}, {"term": "Fermi arc", "why_emerged": "Weyl 반금속의 표면 상태에서 나타나는 비닫힘 페르미 표면 구조를 설명하기 위해 필요했습니다.", "origin": "Wan 등(2011)에 의해 Weyl 반금속 특성으로 예측되었습니다.", "connections": "Weyl 반금속, ARPES 관측, 위상 물성."}], "english_summary": ["PtBi2 is a Weyl semimetal with unconventional surface superconductivity.", "Experiments indicate nodal gaps at the center of the Fermi arcs.", "The authors derive a mechanism explaining this nodal structure.", "Results support PtBi2 as a platform for topological superconductivity."]}}, {"title": "Probing Multipolar Order in the Candidate Altermagnet MnF2 through the Elastocaloric Effect under Strain", "journal": "PRL_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/svrz-315w", "authors": "Rahel Ohlendorf, Luca Buiarelli, Hilary M. L. Noad, et al.", "last_authors": "Jörg Schmalian, Elena Gati", "summary": "The first unambiguous bulk confirmation of altermagnetism in MnF 2 is achieved by combining symmetry-guided strain and magnetic-field tuning with highly sensitive elastocaloric measurements and first-principles theory.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Direct experimental evidence for altermagnetism, highly relevant for magnetic topological materials.", "tags": ["altermagnetism", "experiment"], "image": "", "briefing": {"background": "Altermagnetism은 기존의 강자성(Ferromagnetism)이나 반강자성(Antiferromagnetism)과는 다른 제3의 자기적 상태로, 결정 구조의 대칭성으로 인해 자기 모멘트는 상쇄되지만 비상반성(non-relativistic) 스핀 분리(spin-splitting)가 발생하는 상태입니다. 이는 자성 위상 물질 연구의 새로운 지평을 열고 있습니다.", "motivation": "MnF2는 이론적으로 altermagnetism 후보 물질로 제안되었으나, 이를 실험적으로 명확히 증명하는 것은 자성 구조의 복잡성 때문에 어려움이 있었습니다. 본 연구는 정밀한 측정 기술을 통해 이를 검증하고자 했습니다.", "result": "변형률(strain)과 자기장 제어를 결합한 탄성열량(elastocaloric) 측정 및 제1원리 계산을 통해 MnF2에서 대규모(bulk) altermagnetism을 최초로 명확히 확인했습니다.", "implication": "Altermagnetism이 단순한 이론적 예측을 넘어 실제 물질계에서 존재함이 입증되었으며, 향후 자성 위상 물질의 대칭성 기반 물성 제어 연구에 중요한 기준이 될 것입니다.", "novelty": "열역학적 측정인 탄성열량 효과를 자성 연구에 도입하여 altermagnetism을 직접 증명한 점이 독창적입니다. 자성 토폴로지 물질에 관심이 많은 독자에게 altermagnetism의 실제 구현 사례로서 매우 유익합니다.", "unresolved": "Altermagnetism의 미시적 동역학이나 구체적인 스핀 수송 특성에 대한 완전한 이해는 추가 연구가 필요합니다.", "future_work": "Altermagnetism이 발현되는 다양한 물질군으로의 확장 및 스핀트로닉스 소자로의 응용 가능성 타진이 예상됩니다.", "concepts": [{"term": "Altermagnetism", "why_emerged": "비상반성 스핀 분리와 상쇄된 자기 모멘트를 동시에 가지는 자기적 상태를 분류하기 위해 필요.", "origin": "최근 2-3년 내 체계적으로 정립됨 (예: Šmejkal et al.)", "connections": "반강자성, 스핀트로닉스, 비상반성 스핀 궤도 결합."}, {"term": "Elastocaloric Effect", "why_emerged": "물질의 상전이와 관련된 엔트로피 변화를 정밀하게 측정하기 위해 필요.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "열량학, 상전이 분석, 변형률 제어 물성."}], "english_summary": ["Provides the first unambiguous bulk experimental confirmation of altermagnetism in MnF2.", "Utilizes symmetry-guided strain and magnetic-field tuning combined with elastocaloric measurements.", "Confirms that altermagnetism exhibits non-relativistic spin splitting despite vanishing net magnetic moment.", "Establishes a robust framework for detecting and controlling altermagnetic order in topological magnets."]}}, {"title": "Step geometry–guided growth of rhombohedral graphene", "journal": "Science", "source": "Gemini", "link": "https://doi.org/10.1126/science.aed9202", "authors": "Mengze Zhao, Zhibin Zhang, Xin Sui, et al.", "last_authors": "Xiaobo Lu, Kaihui Liu", "summary": "Rhombohedral (ABC)–stacked graphene has emerged as a platform for exploring correlated and topological physics. However, its large-scale, pure-phase synthesis has been hindered by intrinsic thermodynamic metastability and kinetic instability. In this work, we introduce a step geometry–guided epitaxial strategy to deterministically control interlayer slip, enabling the synthesis of pure-phase rhombohedral graphene. Using this approach, we obtained pure (phase purity > 99%) rhombohedral graphene with an area reaching 160 micrometers by 80 micrometers and thickness ranging from ~15 layers to ~120 nanometers. The resulting samples establish the first comprehensive reference dataset of Raman fingerprints and intrinsic band structures from few-layer films to ~200-layer bulk. Electronic transport measurements reveal a layer-antiferromagnetic state and the quantum anomalous Hall effect, enabling scalable exploration of next-generation quantum science and technology applications.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Experimental study of rhombohedral graphene with quantum anomalous Hall effect and antiferromagnetism.", "tags": ["graphene", "topological", "anomalousHall", "correlated", "transport", "magnetism", "2Dmaterials"], "image": "", "briefing": {"background": "Rhombohedral (ABC) 적층 그래핀은 베리 곡률(Berry curvature)과 강한 전자 상관관계가 결합되어 양자 비정상 홀 효과(QAHE) 및 자성 위상 물성을 연구하기 위한 이상적인 플랫폼입니다.", "motivation": "ABC 적층 그래핀의 물성을 정확히 연구하려면 순도가 높고 결함이 적은 대면적 단결정 합성이 필수적이지만, 기존 방식으로는 열역학적으로 불안정한 ABC 위상을 제어하기 어려웠습니다.", "result": "단계 기하 구조 유도 에피택시(step geometry–guided epitaxy) 성장법을 개발하여 99% 이상의 순도를 가진 대면적 ABC 그래핀을 합성했습니다. 이를 통해 층-반강자성(layer-AFM) 및 양자 비정상 홀 효과를 성공적으로 측정했습니다.", "implication": "고품질의 ABC 그래핀을 대량으로 얻을 수 있게 됨에 따라 그래핀 기반의 위상 양자 소자 개발과 다체 물리 연구가 가속화될 것입니다.", "novelty": "성장 기법의 혁신을 통해 위상적으로 흥미로운 물성을 대면적 샘플에서 구현했다는 점에서 중요합니다. 특히 QAHE와 AFM이 결합된 2D 물질 연구자들에게 큰 가치가 있습니다.", "unresolved": "매우 두꺼운 시료에서 나타나는 다체 상태의 상세한 미시적 메커니즘은 추가 조사가 필요합니다.", "future_work": "소자 구조의 미세화 및 양자 비정상 홀 효과 기반의 소자 효율 극대화 연구.", "concepts": [{"term": "Rhombohedral (ABC) Stacking", "why_emerged": "그래핀의 적층 방식에 따른 전자 구조 변화를 이용한 물성 제어를 위해 필요.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "Moire 그래핀, 베리 곡률, 양자 비정상 홀 효과."}, {"term": "Quantum Anomalous Hall Effect (QAHE)", "why_emerged": "외부 자기장 없이도 자발적으로 위상학적 홀 전도도가 양자화되는 상태를 구현하기 위해 필요.", "origin": "Haldane(1988) 모델, 실험적 증명은 Chang et al.(2013).", "connections": "토폴로지 절연체, 자기적 위상 물질."}], "english_summary": ["Demonstrates a novel step geometry-guided epitaxial strategy for high-purity ABC-stacked rhombohedral graphene.", "Achieved phase purity > 99% with sample dimensions up to 160x80 micrometers.", "Observed intrinsic layer-antiferromagnetic states and the quantum anomalous Hall effect.", "Provides a comprehensive baseline for Raman and electronic structure in few-layer to bulk ABC graphene."]}}, {"title": "Aharonov-Casher phase in twisted bilayer graphene", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2607.25660", "authors": "Igor Kuzmenko, Y. B. Band, Yshai Avishai", "last_authors": "Y. B. Band, Yshai Avishai", "summary": "The Aharonov-Casher (AC) effect is a quantum mechanical phenomenon in which the wave function of a particle with a magnetic moment moving in a region subject to an electric field develops a phase shift due to spin-orbit interaction, even if no classical force acts on it. This phase also depends on the medium through which the particle moves. Here we focus on the AC phase of an electron moving in twisted bilayer graphene (TBG) lying in the $x$-$y$ plane, subject to a uniform electric field perpendicular to the plane of the graphene, ${\\bf E}=E{\\hat{\\bf z}}$. The AC phase is determined by an $SU(2)$ vector potential ${\\bf A}$ from which a phase factor is generated, and used to perform a gauge transformation of the Hamiltonian. We find that the AC phase is linear with $E$ and exhibits sharp peaks at the magic angles.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Theoretical study of Aharonov-Casher phase and spin-orbit effects in twisted bilayer graphene at magic angles.", "tags": ["graphene", "twistedbilayer", "spinorbicoupling", "theory"], "image": "https://arxiv.org/html/2607.25660v1/x1.png", "briefing": {"background": "트위스티드 이중층 그래핀(TBG)은 매직 앵글 부근에서 강력한 전자 상관관계와 평탄 밴드(flat bands)가 나타나며, 여기서 발생하는 스핀-궤도 결합(SOC) 효과는 시스템의 위상 물성을 이해하는 핵심 요소입니다.", "motivation": "TBG 시스템에서 전자의 파동함수가 수직 전기장 하에서 위상 변화(Aharonov-Casher phase)를 겪을 때, 이것이 매직 앵글 근처에서 어떻게 발현되는지 이론적으로 규명하고자 했습니다.", "result": "수직 전기장에 의해 유도되는 AC 위상이 전기장에 대해 선형적으로 비례하며, 특히 매직 앵글에서 예리한 피크를 형성한다는 점을 Hamiltonian 분석을 통해 밝혀냈습니다.", "implication": "TBG의 전자 구조와 위상적 특성이 외부 전기장 제어를 통해 어떻게 변조될 수 있는지에 대한 이론적 근거를 제공합니다.", "novelty": "기존의 기하학적 위상 연구에 AC 위상이라는 관점을 도입하여 매직 앵글 시스템의 SOC 효과를 해석했다는 점에서 독창적입니다. TBG의 전자 구조와 위상 물성 연구자에게 이론적 토대를 제시합니다.", "unresolved": "이론적인 결과가 실제 광학적 혹은 수송 실험에서 어떻게 직접적으로 관측될 수 있을지에 대한 구체적인 시그니처 제시는 부족합니다.", "future_work": "매직 앵글 TBG 소자에서의 전기장 조절을 통한 위상 전도도 변화 실험 검증.", "concepts": [{"term": "Aharonov-Casher (AC) Phase", "why_emerged": "전기장 내에서 이동하는 자기 모멘트가 위상 변화를 겪는 현상을 설명하기 위해 필요.", "origin": "Aharonov와 Casher(1984).", "connections": "Aharonov-Bohm 효과, 스핀-궤도 결합, 위상학적 위상."}, {"term": "Magic Angle", "why_emerged": "이중층 그래핀의 밴드 구조가 평탄해지며 강력한 상관관계가 나타나는 특정 회전 각도를 설명하기 위해 필요.", "origin": "Bistritzer와 MacDonald(2011).", "connections": "초전도성, 상관관계 절연체, 트위스티드 이중층 그래핀."}], "english_summary": ["Explores the Aharonov-Casher (AC) phase in twisted bilayer graphene (TBG) under a perpendicular electric field.", "Utilizes an SU(2) vector potential framework to derive the phase shift due to spin-orbit interactions.", "Finds the AC phase is linearly proportional to the electric field and shows sharp peaks at magic angles.", "Offers insights into how external electric fields modulate the topological electronic properties of TBG."]}}, {"title": "Anisotropic magnons in a layered honeycomb ferromagnet", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2602.19935", "authors": "Travis J. Williams, Douglas L. Abernathy, Mark D. Lumsden, Jiaqiang Yan, Andrew D. Christianson", "last_authors": "Jiaqiang Yan, Andrew D. Christianson", "summary": "Recent experimental and theoretical studies have suggested a possible Dirac magnon gap in the two-dimensional ferromagnetic semiconductor CrSiTe$_3$. Detailed neutron scattering measurements were performed to shed light on the existence of the magnon gap, and suggest that the gap is very small or non-existent, with previous measurements being complicated by experimental factors. During these measurements, it was found that the out-of-plane couplings could explain the usual property of the increase in the magnetic transition temperature when CrSiTe$_3$ is exfoliated to monolayers. Furthermore, the material was shown to have anisotropic magnons along the out-of-plane direction, through the proposed Dirac point. We speculate that this is due to an exchange anisotropy, though Kitaev-like interactions alone cannot explain the spectra.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Neutron scattering study of CrSiTe3, exploring Dirac magnons and exfoliation effects.", "tags": ["experiment", "CrSiTe3", "neutronscattering"], "image": "https://arxiv.org/html/2602.19935v2/x1.png", "briefing": {"background": "벌집 격자(honeycomb)를 가진 강자성체 CrSiTe3와 같은 물질에서 마그논(magnon)은 디락(Dirac) 포인트를 가질 것으로 예측되어 왔습니다. 이러한 2차원 자성체는 층간 결합과 엑스폴리에이션(박리) 과정에서의 물성 변화를 이해하는 것이 핵심적인 물리적 과제입니다.", "motivation": "이전 연구들에서 CrSiTe3의 디락 마그논 갭 존재 여부에 대한 논란이 있었으며, 이를 명확히 규명하기 위해 정밀한 중성자 산란 실험이 필요했습니다.", "result": "연구 결과, 기존에 보고된 디락 마그논 갭은 실험적 오차에 의한 것일 가능성이 크며 실제 갭은 매우 작거나 거의 없음을 시사합니다. 또한, 박리 시 전이 온도가 상승하는 현상을 층간 결합의 이방성으로 설명하였습니다.", "implication": "이 결과는 CrSiTe3의 자성 층간 상호작용이 단층으로의 박리 시 발생하는 자기적 특성 변화를 지배함을 보여줍니다. 또한 Kitaev 상호작용만으로는 스펙트럼을 완전히 설명할 수 없음을 시사합니다.", "novelty": "이방성 마그논의 존재를 실험적으로 증명하고, 박리된 박막의 특성을 벌크 중성자 산란 데이터로 논리적으로 연결했다는 점에서 의미가 있습니다.", "unresolved": "디락 마그논 갭이 완전히 존재하지 않는 것인지, 혹은 매우 미세한 갭의 기원을 어떻게 정량적으로 정의할 것인지에 대한 추가 연구가 필요합니다.", "future_work": "더 높은 에너지 분해능을 갖춘 비탄성 중성자 산란 실험과 Kitaev 모델을 넘어선 새로운 교환 상호작용 모델의 개발이 요구됩니다.", "concepts": [{"term": "Dirac Magnons", "why_emerged": "벌집 격자 시스템에서 스핀파의 분산 관계가 선형적(Dirac 원뿔 형태)으로 나타나는 물리적 현상을 설명하기 위해 도입되었습니다.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "반강자성체와 벌집 격자 강자성체의 위상학적 여기(excitation) 연구와 밀접하게 연결됩니다."}, {"term": "Exfoliation Effect", "why_emerged": "벌크 물질을 단층으로 박리할 때 발생하는 층간 상호작용의 소실 및 전자/자기 구조 변화를 이해하기 위해 필요합니다.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "반데르발스 이종접합체 및 2D 자성체 연구의 핵심 기반입니다."}], "english_summary": ["Precision neutron scattering on CrSiTe3 reveals that the previously reported Dirac magnon gap is likely an experimental artifact.", "The study attributes the increase in magnetic transition temperature upon exfoliation to out-of-plane coupling effects.", "Experimental spectra confirm anisotropic magnons, suggesting that Kitaev interactions alone are insufficient to describe the physics."]}}, {"title": "Charge-6e superconductivity from doping SU(3) spin liquids", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2607.25909", "authors": "Yan-Qi Wang, Boran Zhou, Hui Yang, Zhi-Qiang Gao", "last_authors": "Hui Yang, Zhi-Qiang Gao", "summary": "We propose doping S ​ U ​ ( 3 ) SU(3) -symmetric spin liquids as a route toward charge- 6 ​ e 6e superconductivity. This generalizes the idea of constructing charge- 4 ​ e 4e superconductivity from doped S ​ U ​ ( 4 ) SU(4) -symmetric phases. As a concrete platform, we study a bilayer triangular-lattice Hubbard model with S ​ U ​ ( 3 ) SU(3) spin symmetry and interlayer antiferromagnetic exchange. Using complementary parton constructions, we analyze doped ℤ 3 \\mathbb{Z}_{3} quantum spin liquid and S ​ U ​ ( 3 ) SU(3) -related chiral spin liquids. Doping a ℤ 3 \\mathbb{Z}_{3} quantum spin liquid can produce an orthogonal metal with a gauge invariant fermi surface of charge- 3 ​ e 3e fermionic trions. Pairing these trions gives a time-reversal-symmetric charge- 6 ​ e 6e superconductor. Doping Abelian S ​ U ​ ( 3 ) 1 SU(3)_{1} and S ​ U ​ ( 6 ) 1 SU(6)_{1} chiral spin liquids yields chiral charge- 6 ​ e 6e superconductors with and without residual Abelian topological order, respectively. Doping a non-Abelian S ​ U ​ ( 3 ) 2 SU(3)_{2} chiral spin liquid leads to a non-Abelian chiral charge- 6 ​ e 6e superconductor intertwined with S ​ O ​ ( 3 ) − 3 SO(3)_{-3} topological order and supporting non-Abelian h / ( 6 ​ e ) h/(6e) superconducting vortices. We also identify several other phases, including ℤ 3 \\mathbb{Z}_{3} orthogonal metal, quantum anomalous Hall (crystal) phases enriched by ℤ 3 \\mathbb{Z}_{3} or ℤ 2 \\mathbb{Z}_{2} topological order, S ​ U ​ ( 3 ) SU(3) -breaking charge- 2 ​ e 2e superconductors, composite fermi liquid coupled to non-Abelian gauge field, and descendant chiral spin liquids. Our results identify doped S ​ U ​ ( 3 ) SU(3) spin liquids as a natural setting where symmetry, fractionalization, and topology cooperate to produce charge- 6 ​ e 6e superconductivity.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Theoretical proposal for charge-6e superconductivity from doping SU(3) spin liquids, with topological implications.", "tags": ["superconductivity", "spinliquid", "topological", "anomalousHall", "Hubbardmodel", "theory"], "image": "https://arxiv.org/html/2607.25909v1/x1.png", "briefing": {"background": "응집물질 물리학에서 전자 상관관계와 위상적 질서가 만나 생기는 특이한 초전도 상태를 찾는 것은 중요한 과제입니다. 특히 2e 전하 단위가 아닌 더 큰 전하 단위(4e, 6e)를 갖는 초전도체는 분수화된(fractionalized) 상태와 연관되어 있습니다.", "motivation": "SU(3) 대칭성을 갖는 스핀 액체를 도핑하여 기존의 charge-4e 초전도체 연구를 확장하고, 더 높은 전하 단위의 초전도 현상을 이론적으로 규명하고자 했습니다.", "result": "이중층 삼각 격자 허바드 모델에서 도핑된 SU(3) 스핀 액체가 charge-6e 초전도성을 나타낼 수 있음을 보였습니다. 특히 Z3 양자 스핀 액체를 도핑하면 전하 3e인 '트리온(trion)'이 형성되고, 이들의 페어링을 통해 charge-6e 상태가 도출됩니다.", "implication": "위 nt of altermagnetism have broadened the physical origin and research framework of chiral magnons, making them a research frontier in condensed matter physics. This review presents a unified framework for chiral magnons, covering symmetry-breaking mechanisms, material implementation, experimental characterization, transport response, and many-body non-Hermitian dynamics, and evaluates routes toward room-temperature and device-related platforms. The discussion is based on symmetry analysis, model Hamiltonians, and spin-wave theory, combined with first-principles calculations as well as recent spectroscopic (e.g., inelastic and polarized neutron scattering, Brillouin light scattering) and transport measurements. This review further summarizes bulk-gap and Berry-curvature induced chiral magnon edge states, the enhancement of non-reciprocity via chiral spin pumping and cavity-magnon hybrids, as well as non-Hermitian features arising from multiparticle damping and gain-loss competition. This review provides a comprehensive reference for elucidating the underlying mechanisms of chiral magnons, advancing the synthesis and experimental characterization of novel materials, and also guiding the design of next-generation non-reciprocal magnonic devices.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Relevant review on chiral magnons and altermagnetism with direct experimental and material connections.", "tags": ["altermagnet", "magnon", "topology"], "image": "https://arxiv.org/static/browse/0.3.4/images/arxiv-logo-fb.png", "briefing": {"background": "스핀 정보 소자 및 저전력 스핀트로닉스 구현을 위해 스핀파(magnon)의 전파 방향을 제어하는 것은 매우 중요합니다. 대칭성이 깨진 자성체에서 나타나는 '카이랄 마그논'은 비가역적 성질을 가지고 있습니다.", "motivation": "최근 주목받는 Altermagnetism을 포함하여 카이랄 마그논의 물리적 기원과 최신 연구 동향을 통합적으로 정리할 필요가 있었습니다.", "result": "카이랄 마그논의 대칭성 파괴 메커니즘, 비가역적 전파 기전, 위상학적 엣지 상태 등을 일관된 프레임워크로 정리했습니다. 또한 altermagnetism이 어떻게 카이랄 마그논의 연구 영역을 확장했는지 강조합니다.", "implication": "본 리뷰는 차세대 비가역적 마그논 소자 설계와 관련된 이론적 기반과 물질 탐색을 위한 가이드라인을 제공합니다.", 그래핀, 평탄 밴드(flat band), 모아레 물리학"}, {"term": "천 절연체(Chern insulator)", "why_emerged": "외부 자기장 없이도 양자 홀 효과와 유사한 위상학적 상태를 구현하기 위해 필요함.", "origin": "Haldane 모델(1988)에서 이론적으로 최초 제안.", "connections": "위상학적 절연체, 비정상 홀 효과, Berry 곡률"}, {"term": "위그너 결정(Wigner crystal)", "why_emerged": "전자들 사이의 쿨롱 상호작용이 운동 에너지를 압도할 때 발생하는 기저 상태를 설명하기 위해 도입됨.", "origin": "Eugene Wigner(1934)가 예측.", "connections": "강상관 전자계, 쿨롱 격자, 2D 전자 가스"}], "english_summary": ["Investigates charge-transfer heterostructures using rhombohedral multilayer graphene (RMG).", "Develops self-consistent electrostatic theory for layer charge distribution control.", "Predicts Chern insulator phases via Wigner crystal-induced superlattices.", "Identifies interlayer excitonic insulator states for comparable effective mass conditions.", "Proposes these structures as highly tunable platforms for topological and correlated phenomena."]}}, {"title": "Element-Specific Visualization of Layer-Parity and Twist-Dependent Magnetism in CrSBr", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2607.26003", "authors": "Aalok Tiwari, Shubhada Patil, Ravi Kumar Bandapelli, et al.", "last_authors": "Simranjeet Singh, Jyoti Katoch", "summary": "Van der Waals (vdW) based antiferromagnets (AFMs) are an ideal platform for probing and understanding thickness- and twist-angle-dependent emergent spin phenomena. However, element-specific nanoscale characterization of the spin structure in atomically thin vdW-based AFMs systems and layer-parity effects remain elusive, making them crucial for both fundamental insight into low-dimensional magnetism and the rational design of spintronic devices based on these materials. Here, we utilize X-ray magnetic circular and linear dichroisms paired with photoemission electron microscopy to resolve the magnetic order in atomically thin CrSBr. Our comprehensive measurements reveal CrSBr magnetic structure at the nanoscale and its dependence on the layer number, surface encapsulatio , "Provides a foundation for moiré-based magnetic device engineering."]}}, {"title": "Field-Induced Dissociation Reveals Excitonic Long-Range Photocarrier Transport in Bulk-Insulating Bi2Se3 Nanoribbons", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2607.25128", "authors": "Rodrigo Becerra Silva, Xiang Yi, Ziyi Song, Dong Yu", "last_authors": "Ziyi Song, Dong Yu", "summary": "Photoexcited charge carriers in topological insulators display anomalously long-range transport at cryogenic temperatures, but the underlying mechanism remains under debate. Here we use a transverse electric field as a discriminating probe of photocarrier dynamics in bulk-insulating Sb-doped Bi2Se3 nanoribbons, combining scanning photocurrent microscopy (SPCM) with ultrafast transient photovoltage (TPV) measurements. SPCM shows that suppression of the photocurrent requires a transverse electric field nearly 50 times larger than that needed to deflect free carriers, yet comparable to the expected exciton dissociation field. TPV measurements at 12 K and low excitation fluence reveal that the photocarrier diffusivity exceeds the value implied by the Einstein relation and the measured drift mobility by more than an order of magnitude, a bound that holds even at the lower end of the fitting uncertainty. Together, these observations indicate that the long-range photoresponse is not carried by free charge carriers but by a charge-neutral correlated state.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Experimental study of topological insulators and correlated photocarrier dynamics.", "tags": ["topological-insulator", "transport", "correlated"], "image": "https://arxiv.org/html/2607.25128v1/Figures/TOC.png", "briefing": {"background": "위상학적 절연체(TI)는 표면 상태에서 전하 이동도가 높지만, 저온에서의 비정상적으로 긴 거리 수송 기작은 여전히 논쟁의 중심에 있습니다.", "motivation": "Sb-doped Bi2Se3 나노리본에서 나타나는 광학적 반응의 거리 확산 기작이 자유 전하에 의한 것인지, 상관 전자 상태에 의한 것인지 규명하고자 합니다.", "result": "횡방향 전기장 실험을 통해 광전류를 억제하는 데 필 rticle dispersion gives rise to finite-momentum pairing between electrons with unlike spins, in agreement with earlier predictions. Quite unexpectedly, this pairing typically emerges across multiple channels with mixed parity. Consequently, the resulting finite-momentum Fulde-Ferrell-Larkin-Ovchinnikov (FFLO) superconducting phase is expected to exhibit a multi-component order parameter featuring singlet-triplet mixing. We examine several forms of altermagnetism, specifically $d_{xy}$-wave and $d_{x^{2}-y^{2}}$-wave altermagnetic couplings, and present the corresponding phase diagrams. Additionally, we study triplet pairing between electrons with identical spins and find that it always occurs at zero center-of-mass momentum. Although it is unfavorable in the regime of weak altermagnetic coupling and low electron filling, it can dominate the phase diagram when the altermagnetic coupling is sufficiently strong. The influence of on-site attractive interactions on mixed-parity pairing is also explored.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Directly addresses altermagnetism and unconventional finite-momentum pairing, both highly relevant topics.", "tags": ["theory", "altermagnetism", "superconductivity"], "image": "https://arxiv.org/html/2603.12897v2/x1.png", "briefing": {"background": "알터마그네틱(Altermagnetic) 금속은 시간 반전 대칭성은 깨져 있으나 스핀 보존 격자 대칭성은 유지되는 새로운 자기 상으로, 강자성체와 반강자성체의 특성을 동시에 가집니다. 이 시스템에서 전자 상태의 스핀 분할은 초전도 쌍 형성 기작에 새로운 자유도를 제공합니다.", "motivation": "알터마그네틱 금속 내의 스핀 분할이 일반적인 영운동량(zero-momentum) 초전도 상태를 넘어 유한 운동량(finite-momentum) FFLO 초전도 상태를 어떻게 유도하는지, 그리고 이 과정에서 스핀-단일항과 삼중항 혼합이 어떻게 발생하는지 이론적으로 규명하고자 합니다.", "result": "근접 이웃 상호작용 하에서 알터마그네틱 스핀 분할이 유한 운동량 FFLO 쌍 형성을 촉진하며, 예상치 못하게 여러 채널에서 홀수 및 짝수 패리티가 혼합된 다성분 오더 파라미터가 나타남을 확인했습니다.", "implication": "알터마그네틱 물질이 유한 운동량 초전도성과 스핀-단일항/삼중항 혼합 상태를 실현할 수 있는 플랫폼임을 시사하며, 이는 위상 초전도체 탐색에 중요한 근거가 됩니다.", "novelty": "알터마그네틱 시스템에서의 FFLO 상태가 단일 채널이 아닌 다채널 혼합 패리티 형태로 발현된다는 점을 제시한 것이 핵심이며, 이는 자성 위상 물질의 초전도성 연구 분야에 새로운 방향을 제시합니다.", "unresolved": "이론적 모델인 격자 모형 기반의 해석이므로 실제 알터마그네틱 화합물에서의 구체적인 상호작용 강도와 전이 온도에 대한 정량적 예측은 여전히 과제로 남아 있습니다.", "future_work": "실제 알터마그네틱 물질에서의 실험적 확인을 위한 구체적인 물질 후보군 선정 및 자기장 하에서의 수송 현상 계산이 필요합니다.", "concepts": [{"term": "알터마그네틱(Altermagnetism)", "why_emerged": "기존의 강자성(순자화 존재)과 반강자성(스핀 상쇄)으로 분류되지 않는, 스핀 분할을 동반한 새로운 자기 질서 상태를 설명하기 위해 도입되었습니다.", "origin": "최근 2~3년 내 이론적으로 체계화됨 (Smejkal et al. 등).", "connections": "반강자성 스핀트로닉스, 비전통적 초전도성, 스핀-궤도 결합."}, {"term": "FFLO(Fulde-Ferrell-Larkin-Ovchinnikov) 상태", "why_emerged": "강한 자기장 하에서 스핀-단일항 초전도체가 쌍을 이루는 전자들의 페르미 면 미스매치를 극복하기 위한 유한 운동량 쌍 형성 상태로 제안되었습니다.", "origin": "1964년 Fulde, Ferrell, Larkin, Ovchinnikov에 의해 독립적으로 제안됨.", "connections": "상태 밀도 변조, 위상 초전도, 강한 자기장 환경."}, {"term": "단일항-삼중항 혼합 (Singlet-triplet mixing)", "why_emerged": "반전 대칭성이 깨진 계에서 스핀 상태가 고정되지 않고 섞이면서 나타나는 복합적인 초전도 질서 변수를 이해하기 위해 필요합니다.", "origin": "초전도 대칭성 파괴 연구에서 파생됨.", "connections": "비전통적 초전도체, Rashba 스핀-궤도 결합, 위상 물질."}], "english_summary": ["The paper investigates pairing instabilities in altermagnetic metals on a square lattice.", "It finds that altermagnetic spin-splitting naturally drives finite-momentum FFLO superconductivity.", "A key discovery is the emergence of multi-component order parameters with mixed parity (singlet-triplet mixing).", "The phase diagram reveals that triplet pairing at zero momentum can dominate under strong altermagnetic coupling."]}}, {"title": "Imaging the N\\'eel Vector in Two-Dimensional Antiferromagnets using Antisymmetric Compton Scattering", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2607.25418", "authors": "Wuxuan Li, Zhuocheng Lu, Jingshan Qi, Hua Wang, Kai Chang", "last_authors": "Hua Wang, Kai Chang", "summary": "We demonstrate that antisymmetric Compton scattering can detect both the switching and the continuous rotation of the N\\'eel vector in two-dimensional (2D) antiferromagnets. By probing magnetoelectric (ME) multipoles, which couple electric and magnetic dipole
