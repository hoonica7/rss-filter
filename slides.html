<title>Daily Paper Slideshow</title>
<style>
  :root {
    color-scheme: light;
    --bg: #f6f7f4;
    --paper: #ffffff;
    --ink: #111827;
    --muted: #64748b;
    --line: #d8ddd2;
    --accent: #176b87;
    --accent-2: #9a3412;
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; overflow: auto; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: var(--bg); color: var(--ink); }
  .shell { max-width: 1500px; min-height: 100vh; margin: 0 auto; padding: 14px 18px; display: flex; flex-direction: column; }
  .topbar { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 16px; }
  .top-actions { display: flex; align-items: center; gap: 10px; }
  .topbar a, button { border: 1px solid var(--line); border-radius: 8px; background: var(--paper); color: var(--ink); padding: 10px 14px; font-weight: 700; text-decoration: none; cursor: pointer; }
  button.primary { background: var(--accent); border-color: var(--accent); color: white; }
  button:disabled { opacity: 0.45; cursor: not-allowed; }
  .counter { color: var(--muted); font-weight: 700; }
  .slide { min-height: calc(100vh - 82px); background: var(--paper); border: 1px solid var(--line); border-radius: 10px; padding: 18px; box-shadow: 0 18px 42px rgba(15, 23, 42, 0.10); display: grid; grid-template-columns: minmax(310px, 0.86fr) minmax(0, 1.55fr); gap: 18px; overflow: visible; }
  .paper-head { min-width: 0; min-height: 0; overflow: visible; display: flex; flex-direction: column; gap: 12px; }
  .figure { margin: 0; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: #f8fafc; }
  .figure img { display: block; width: 100%; max-height: 41vh; object-fit: contain; background: white; }
  .figure figcaption { padding: 7px 10px; color: var(--muted); font-size: 12px; line-height: 1.3; }
  .head-text { display: flex; flex-direction: column; gap: 9px; min-width: 0; }
  .badges { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .badge { border-radius: 999px; padding: 5px 9px; background: #eef2ff; color: #3730a3; font-size: 12px; font-weight: 800; }
  .score { background: #fee2e2; color: #991b1b; }
  h1 { margin: 0; font-size: 25px; line-height: 1.15; letter-spacing: 0; overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
  h1 a { color: inherit; text-decoration-color: rgba(23, 107, 135, 0.35); text-decoration-thickness: 2px; text-underline-offset: 4px; }
  h1 a:hover { color: var(--accent); text-decoration-color: var(--accent); }
  .meta, .authors, .why, .abstract { font-size: 13px; line-height: 1.45; }
  .meta, .authors { color: var(--muted); }
  .why strong, .abstract strong, .authors strong { color: var(--ink); }
  .authors { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .why { border-left: 4px solid var(--accent-2); padding-left: 10px; color: #374151; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .abstract { border-top: 1px solid var(--line); padding-top: 14px; color: #374151; }
  .original-abstract { border-top: 1px solid var(--line); padding-top: 10px; color: #374151; font-size: 11.5px; line-height: 1.35; overflow-wrap: anywhere; }
  .original-abstract strong { display: block; margin-bottom: 4px; color: var(--ink); }
  .tags { display: flex; flex-wrap: wrap; gap: 8px; }
  .tag { border-radius: 999px; padding: 4px 8px; background: #f1f5f9; color: #475569; font-size: 12px; font-weight: 700; }
  .head-text > .link { display: none; }
  .briefing { min-width: 0; min-height: 0; overflow: visible; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); grid-auto-rows: minmax(0, auto); align-content: start; gap: 11px 18px; border-top: 0; padding-top: 0; }
  .brief-section { min-width: 0; }
  .brief-section.wide { grid-column: 1 / -1; }
  .brief-section h2 { margin: 0 0 4px; font-size: 14px; line-height: 1.22; color: #0f766e; letter-spacing: 0; }
  .brief-section p, .brief-section li { margin: 0; font-size: 12.5px; line-height: 1.42; color: #1f2937; overflow-wrap: anywhere; }
  .brief-section ul { margin: 0; padding-left: 20px; }
  .concepts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 9px 14px; }
  .concept { border-top: 1px solid var(--line); padding-top: 7px; }
  .concept h3 { margin: 0 0 4px; font-size: 13px; color: #7c2d12; letter-spacing: 0; }
  .concept p { margin: 2px 0 0; font-size: 11.5px; line-height: 1.35; color: #374151; overflow-wrap: anywhere; }
  .concept b { color: #111827; }
  .link { color: var(--accent); font-weight: 800; text-decoration: none; }
  .empty { padding: 48px; background: var(--paper); border: 1px solid var(--line); border-radius: 12px; color: var(--muted); }
  @media (max-width: 860px) {
    .shell { padding: 14px; }
    .topbar, .top-actions { align-items: stretch; flex-direction: column; }
    .slide, .briefing, .concepts { grid-template-columns: 1fr; }
    .slide { min-height: auto; overflow: visible; display: grid; }
    h1 { font-size: 28px; }
  }
</style>

<script>
const slides = [{"title": "Correlation-enhanced electron-phonon coupling in FeSe/SrTiO3 at a magic angle", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/whx6-mq31", "authors": "Qiang Zou, Antik Sihi, Basu Dev Oli, et al.", "last_authors": "Lian Li, Subhasish Mandal", "summary": "Here, the authors combine first-principles dynamical mean-field theory (DMFT), epitaxial materials design, angle-resolved photoemission spectroscopy, and scanning tunneling microscopy/spectroscopy to show that superconductivity in monolayer FeSe/SrTiO 3 is maximized at a magic FeSe 4 tetrahedral angle. They demonstrate that strong electronic correlations, captured by DMFT, substantially enhance electron-phonon coupling within the FeSe layer and produce a superconducting dome. These findings reveal the microscopic origin of enhanced superconductivity and suggest a route for engineering higher-temperature superconductors.", "tier": "A_MUST_READ", "score": "10", "reason": "Direct hit: ARPES/STM, FeSe unconventional superconductivity, 2D materials, DFT+DMFT.", "tags": ["ARPES", "STM/STS", "unconventionalsuperconductivity", "FeSe", "monolayer", "DFT+DMFT", "electron-phononcoupling"], "image": "", "briefing": {"background": "FeSe 단일층이 SrTiO3(STO) 기판 위에서 벌크보다 월등히 높은 초전도 전이 온도(Tc)를 보이는 현상은 고온 초전도 연구의 핵심 화두입니다. 특히 전자-음향자 상호작용(EPC)과 전자 상관관계(Correlation)가 Tc 향상에 기여하는 정량적 메커니즘을 밝히는 것이 주요 과제입니다.", "motivation": "본 연구는 FeSe/STO의 초전도성이 Fe-Se-Fe 사면체 결합 각도에 따라 어떻게 변화하는지, 그리고 전자 상관관계가 EPC를 어떻게 강화하는지 규명하고자 DFT+DMFT 계산과 ARPES, STM 실험을 결합했습니다.", "result": "실험과 이론의 결합을 통해 FeSe4 사면체 각도가 특정 '매직 앵글'에 도달할 때 Tc가 최대화됨을 발견했습니다. DMFT 계산 결과, 강한 전자 상관관계가 FeSe 층 내의 EPC를 실질적으로 증폭시켜 초전도 돔(dome) 구조를 형성함을 입증했습니다.", "implication": "전자 상관관계가 단순히 초전도와 경쟁하는 것이 아니라, 특정 기하학적 조건(매직 앵글) 하에서 EPC를 강화하여 Tc를 높이는 조력자 역할을 할 수 있음을 시사합니다.", "novelty": "독자님의 주요 관심사인 ARPES, STM, FeSe 및 DFT+DMFT를 모두 포괄하는 연구입니다. 구조적 변수(결합각)와 상관관계의 시너지를 정교하게 연결했다는 점에서 FeSe 기반 고온 초전도체 설계에 새로운 가이드라인을 제공합니다.", "unresolved": "매직 앵글을 유도하는 기판과의 계면 변형(strain)을 원자 단위에서 완벽하게 제어하고 유지하는 기술적 한계가 존재합니다.", "future_work": "다양한 기판이나 외부 압력을 이용해 FeSe의 결합각을 정밀하게 튜닝하며 Tc의 한계를 시험하는 후속 연구가 예상됩니다.", "concepts": [{"term": "DFT+DMFT", "why_emerged": "밀도범함수이론(DFT)만으로는 설명하기 어려운 전이금속 산화물 등의 강상관계 시스템을 정확히 기술하기 위해 등장했습니다.", "origin": "초록 정보만으로는 특정하기 어려움 (1990년대 초반 Georges, Kotliar 등에 의해 정립됨)", "connections": "허바드 모델, 전자 상관관계, 동적 평균장 이론"}, {"term": "Electron-Phonon Coupling (EPC)", "why_emerged": "BCS 이론에서 초전도 쌍 형성을 설명하는 핵심 기전으로, 결정 격자의 진동과 전자의 상호작용을 다룹니다.", "origin": "초록 정보만으로는 특정하기 어려움 (Bardeen, Cooper, Schrieffer 등)", "connections": "BCS 초전도 이론, 고온 초전도, FeSe/STO"}, {"term": "Magic Angle", "why_emerged": "구조적 대칭성이나 기하학적 배치가 물리적 특성(초전도 등)을 극적으로 변화시키는 임계 지점을 설명하기 위해 사용됩니다.", "origin": "초록 정보만으로는 특정하기 어려움 (최근 비틀린 이중층 그래핀 연구 등에서 널리 사용됨)", "connections": "모아레 패턴, 비틀린 이중층 그래핀, 구조적 튜닝"}, {"term": "FeSe/SrTiO3", "why_emerged": "단일층 FeSe가 벌크(8K)보다 훨씬 높은 Tc(60K 이상)를 가짐이 발견되면서 계면 효과 연구를 위해 주목받았습니다.", "origin": "2012년 Xue 교수 연구팀(Tsinghua University)에 의해 처음 보고됨", "connections": "철 기반 초전도체, 계면 초전도, 분자선 적층 성장(MBE)"}], "english_summary": ["A combined DFT+DMFT, ARPES, and STM study identifies a magic tetrahedral angle in monolayer FeSe/STO.", "Strong electronic correlations are shown to substantially enhance electron-phonon coupling within the FeSe layer.", "The study reveals a correlation-driven superconducting dome and provides a route for engineering high-Tc superconductors."]}}, {"title": "Time-resolved ARPES in pumped excitonic systems: Floquet physics induced by excitonic fields", "journal": "PRB_Recent", "source": "keyword", "link": "http://link.aps.org/doi/10.1103/18mz-pmgh", "authors": "Amir Eskandari-asl, Adolfo Avella", "last_authors": "Amir Eskandari-asl, Adolfo Avella", "summary": "We develop a theoretical framework based on the dynamical projective operatorial approach (DPOA) to study the time-resolved and angle-resolved photoemission spectroscopy (TR-ARPES) of pumped excitonic systems. Including Coulomb electron-electron interactions at the Hartree-Fock level, our formalism captures the formation of excitonic bound states under the application of pump pulses. Considering a prototypical two-dimensional two-band semiconductor, we analyze the equilibrium phase diagram, which shows the expected transition from a semiconducting to an excitonic-insulator phase as the Coulomb interaction strength or its range increases. Out of equilibrium, we find that when the pump frequency is resonant with an excitonic mode, coherent oscillations of the excitonic order parameter persist after the pump pulse subsides, and they give rise to clear Floquet sidebands in the TR-ARPES spectrum. These exciton-field-induced sidebands are distinct from those originating from the pump laser field. We also identify band-resonance-induced sidebands arising from residual coherences at momenta where the band gap is resonant with the pump frequency. Finally, we analyze the local Coulomb interaction limit. Our results corroborate recent experimental observations of exciton-field-induced Floquet-like sidebands and establish DPOA as an efficient and accurate method for simulating ultrafast phenomena in interacting electron systems.", "tier": "A_MUST_READ", "score": "10", "reason": "title strong match: ARPES", "tags": ["ARPES", "angle-resolvedphotoemission", "photoemission"], "image": "", "briefing": {"background": "초강력 레이저 펌프를 이용해 물질의 전자 구조를 일시적으로 변조하는 플로케(Floquet) 공학은 새로운 양자 상태를 구현하는 유망한 방법입니다. 특히 엑시톤 절연체와 같이 전자 간 상호작용이 강한 시스템에서 시분해 ARPES(TR-ARPES) 데이터가 어떻게 나타나는지에 대한 이론적 정립이 필요합니다.", "motivation": "펌프 레이저에 의해 형성된 엑시톤 바인딩 상태가 TR-ARPES 스펙트럼에서 어떻게 플로케 물리(Floquet physics)를 유도하는지, 특히 레이저 필드 자체에 의한 효과와 엑시톤 필드에 의한 효과를 구분하고자 했습니다.", "result": "동적 투영 연산자 접근법(DPOA)을 개발하여 엑시톤 시스템의 TR-ARPES를 모사했습니다. 펌프 펄스가 엑시톤 모드와 공명할 때, 레이저가 사라진 후에도 엑시톤 오더 파라미터의 간섭성 진동이 지속되며, 이것이 TR-ARPES 스펙트럼에서 고유한 '엑시톤 유도 플로케 사이드밴드'를 형성함을 발견했습니다.", "implication": "TR-ARPES에서 관찰되는 사이드밴드가 단순히 외부 전자기장(레이저)에 의한 것뿐만 아니라, 물질 내부의 다체 상호작용(엑시톤 필드)에 의해서도 생성될 수 있음을 확인했습니다.", "novelty": "독자님의 관심사인 Floquet engineering과 TR-ARPES를 이론적으로 심도 있게 다룹니다. 최근의 실험적 관찰을 뒷받침하며, 강상관계 시스템의 초고속 현상을 시뮬레이션하는 효율적인 방법론(DPOA)을 제시했다는 점이 중요합니다.", "unresolved": "제시된 DPOA 방법론이 더 복잡한 다중 밴드 시스템이나 산란 효과가 강한 실제 물질에 어디까지 확장 가능한지에 대한 검증이 필요합니다.", "future_work": "실제 엑시톤 절연체 후보 물질(예: Ta2NiSe5)의 TR-ARPES 실험 데이터를 본 이론 프레임워크로 해석하는 연구가 이어질 것으로 보입니다.", "concepts": [{"term": "Excitonic Insulator", "why_emerged": "전자와 정공 사이의 강한 쿨롱 인력으로 인해 엑시톤이 자발적으로 응축되어 절연 상태가 되는 현상을 설명하기 위해 제안되었습니다.", "origin": "1960년대 Mott, Keldysh, Kozlov 등에 의해 제안됨", "connections": "Ta2NiSe5, 엑시톤 응축, 전하 밀도 파(CDW)"}, {"term": "Floquet Sidebands", "why_emerged": "주기적으로 구동되는 양자 시스템에서 원래의 에너지 준위가 구동 주파수의 정수배만큼 이동하여 나타나는 복제 상태를 설명하기 위해 등장했습니다.", "origin": "초록 정보만으로는 특정하기 어려움 (Shirley, Sambe 등의 플로케 이론 기반)", "connections": "Floquet engineering, 광유도 위상 상태, TR-ARPES"}, {"term": "TR-ARPES", "why_emerged": "물질에 빛을 조사한 후 시간에 따른 전자 구조의 변화를 직접 관찰하여 비평형 동역학을 연구하기 위해 개발되었습니다.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "펌프-프로브 실험, 초고속 동역학, ARPES"}, {"term": "DPOA", "why_emerged": "다체 시스템의 비평형 동역학을 슈뢰딩거 방정식을 직접 풀지 않고 효율적으로 계산하기 위해 개발된 이론적 접근법입니다.", "origin": "본 논문 저자진이 주도적으로 활용/발전시킨 것으로 보임", "connections": "하트리-포크 근사, 시간 의존적 다체 문제"}], "english_summary": ["Developed a theoretical DPOA framework to simulate TR-ARPES in pumped excitonic systems.", "Identified excitonic-field-induced Floquet sidebands that persist after the pump pulse subsides.", "The results clarify the distinction between sidebands from the pump laser field versus internal excitonic coherence."]}}, {"title": "Coherence and pairing enhancement in a trilayer cuprate with layer-selective charge order", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2506.01448", "authors": "S. Smit, M. Bluschke, P. Moen, et al.", "last_authors": "M. Capone, A. Damascelli", "summary": "Trilayer cuprates hold the record for the highest superconducting critical temperatures ($T_{\\text{c}}$), yet the underlying mechanism remains elusive. Using time- and angle-resolved photoemission spectroscopy (tr-ARPES), we uncover a striking interplay between charge order, superconducting gap magnitude, and quasiparticle coherence in Bi$_2$Sr$_2$Ca$_2$Cu$_3$O$_{10+\\delta}$ (Bi2223). We present ARPES-based evidence of charge order on the inner CuO$_2$ plane -- as confirmed via resonant x-ray scattering (RXS) -- and show that the same inner plane hosts a large superconducting gap matching its doping, firmly establishing it as underdoped. Despite its underdoped nature, the inner plane also exhibits an exceptional degree of quasiparticle coherence; suppressing charge-order fluctuations further enhances this, making it comparable to that of the overdoped outer planes at elevated electronic temperatures. At the same time, on the overdoped outer planes we find larger superconducting gaps than what is seen on comparably doped single and bilayer cuprates, indicating an unexpected and simultaneous enhancement of both coherence and pairing interactions in Bi2223. These findings, supported by complementary single- and three-layer Hubbard model calculations, reveal a unique interlayer mechanism in which both pairing strength and phase coherence are optimized when interfacing planes with distinct hole concentrations, providing new microscopic insight into the record $T_{\\text{c}}$ of Bi2223.", "tier": "A_MUST_READ", "score": "10", "reason": "Direct hit: tr-ARPES study of charge order and superconductivity in a trilayer cuprate.", "tags": ["method:ARPES", "material:Bi2223", "topic:charge-order", "topic:superconductivity"], "image": "https://arxiv.org/html/2506.01448v2/Fig1.png", "briefing": {"background": "3층 구조의 구리 산화물(Trilayer cuprate)은 상압에서 가장 높은 Tc를 기록하는 물질군입니다. 하지만 세 개의 CuO2 평면 사이의 전하 분포와 초전도성 간의 상관관계는 여전히 불분명한 상태입니다.", "motivation": "Bi2223의 내부 평면(IP)과 외부 평면(OP) 사이의 전하 질서(Charge order), 초전도 갭, 그리고 준입자 간섭성(quasiparticle coherence)의 공간적 차이를 tr-ARPES로 직접 관찰하여 높은 Tc의 기원을 찾고자 했습니다.", "result": "tr-ARPES와 RXS 실험을 통해 내부 평면에서 전하 질서의 증거를 발견했으며, 이 평면이 대형 초전도 갭을 가진 저도핑(underdoped) 상태임을 확인했습니다. 놀랍게도 이 내부 평면은 높은 준입자 간섭성을 보였으며, 외부 평면에서도 단층/복층보다 큰 갭이 관찰되어 층 간 상호작용에 의한 쌍 형성 강화가 일어남을 입증했습니다.", "implication": "서로 다른 홀 농도를 가진 평면들이 인접할 때 페어링 강도와 위상 간섭성이 동시에 최적화될 수 있음을 보여주며, 이는 고온 초전도 설계를 위한 '층 선택적 도핑' 전략의 중요성을 강조합니다.", "novelty": "독자님의 핵심 관심사인 ARPES, Bi2223, 전하 질서(CDW), 고온 초전도를 모두 포함합니다. 특히 tr-ARPES를 이용해 각 층의 동역학적 특성을 분리해내어 3층 구조의 장점을 명확히 설명했다는 점이 탁월합니다.", "unresolved": "전하 질서의 변동(fluctuations)이 구체적으로 어떤 산란 채널을 통해 초전도 간섭성을 저해하거나 돕는지에 대한 상세한 미시적 메커니즘은 더 연구가 필요합니다.", "future_work": "다른 다층 구리 산화물(n>3)에서도 유사한 층 선택적 강화 메커니즘이 작동하는지 확인하고, 이를 이용한 새로운 고온 초전도체 합성이 기대됩니다.", "concepts": [{"term": "Bi2223", "why_emerged": "상압에서 Tc가 약 110K에 달하는 가장 대표적인 고온 초전도체 중 하나로, 층상 구조 연구를 위해 중요합니다.", "origin": "초록 정보만으로는 특정하기 어려움 (1988년 Maeda 등에 의해 발견된 Bi 계열 중 하나)", "connections": "BSCCO, 3층 구리 산화물, 고온 초전도"}, {"term": "Charge Order (전하 질서)", "why_emerged": "구리 산화물 초전도체에서 초전도와 경쟁하거나 공존하는 전하 밀도의 공간적 변조 현상을 설명하기 위해 등장했습니다.", "origin": "초록 정보만으로는 특정하기 어려움 (Tranquada 등에 의한 스트라이프 상 발견 등)", "connections": "전하 밀도 파(CDW), 의사갭(pseudogap), 구리 산화물"}, {"term": "Quasiparticle Coherence", "why_emerged": "초전도체에서 전자가 산란되지 않고 얼마나 잘 정의된 파동으로 존재할 수 있는지를 나타내는 척도로, 초전도 전이와 밀접합니다.", "origin": "초록 정보만으로는 특정하기 어려움 (Landau의 준입자 이론 기반)", "connections": "ARPES 스펙트럼의 날카로운 피크, 초전도 응축, 산란율"}, {"term": "Layer-selective charge order", "why_emerged": "다층 구조 물질에서 특정 층에만 국한되어 나타나는 전하 질서 현상을 구분하여 이해하기 위해 사용됩니다.", "origin": "본 연구에서 Bi2223의 내부 평면 특이성을 설명하며 강조됨", "connections": "다층 허바드 모델, 비균일 도핑, 층 간 결합"}], "english_summary": ["Used tr-ARPES and RXS to discover inner-plane charge order in trilayer Bi2223.", "Demonstrated that the underdoped inner plane maintains high quasiparticle coherence while the outer planes show enhanced pairing.", "Reveals an interlayer mechanism where interfacing distinct planes optimizes both pairing strength and phase coherence for record Tc."]}}, {"title": "Monolayer van der Waals kagome lattice for high-temperature flat-band physics (Nat. Phys.)", "journal": "arXiv_CondMat", "source": "author whitelist", "link": "https://arxiv.org/abs/2610.24071", "authors": "Hyungkun Bong, Choongjae Won, Seongyong Lee, et al.", "last_authors": "Kyle M. Shen, Mingu Kang", "summary": "Kagome lattice materials host a remarkably rich landscape of novel quantum phenomena, all arising from the intrinsic interplay of topology, correlation, and frustration. While previous studies have been mostly limited to bulk three-dimensional (3D) kagome crystals, the realization of a true two-dimensional (2D) kagome system has remained a long-standing goal, to unlock fundamentally new physics and engineering pathways inaccessible in 3D systems. In this work, we establish the first ideal 2D monolayer kagome lattices by leveraging a novel and versatile van der Waals (vdW) kagome family, A2T3X4 (A = K, Rb, Cs; T = Ni, Pd, Pt; X = S, Se). Our nano-focused angle-resolved photoemission spectroscopy (nano-ARPES) directly characterizes the electronic structure of A2T3X4 down to the monolayer limit, notably revealing an isolated kagome-derived flat band just below the Fermi level. Via gate-engineering of 2D A2T3X4, the kagome flat band can be further tuned to the Fermi level, allowing direct access to the partially filled flat band physics and establishing a qualitatively new 2D flat band platform. Compared to existing moire-based artificial flat band systems, this vdW kagome-based intrinsic flat band system realizes more than 220 times higher flat band electron density, opening an entirely new density and energy regime for exploring 2D flat band physics. Harnessing this high-electron-density flat band in 2D vdW kagome system provides a clear pathway to scale emergent flat band phenomena - such as fractional quantum anomalous Hall states - to far higher temperatures than currently achievable, as long-envisioned in theory and further supported by our many-body calculations.", "tier": "A_MUST_READ", "score": "10", "reason": "author whitelist: Chris Jozwiak", "tags": ["ARPES", "angle-resolvedphotoemission", "photoemission", "kagome", "anomalousHall", "moire", "vanderWaals", "monolayer"], "image": "https://arxiv.org/static/browse/0.3.4/images/arxiv-logo-fb.png", "briefing": {"background": "카고메(Kagome) 격자는 기하학적 좌절(frustration)로 인해 플랫 밴드(flat band), 디락 콘(Dirac cone), 위상적 밴드 갭을 동시에 가질 수 있어 양자 상호작용 연구의 핵심 플랫폼입니다. 기존의 AV3Sb5와 같은 시스템은 주로 3차원 벌크 결정 형태로 연구되어 왔으나, 게이트 전압을 통한 전자 농도 조절이나 양자 소자화가 용이한 진정한 2차원 단층(monolayer) 카고메 시스템에 대한 갈증이 컸습니다.", "motivation": "본 연구는 기존 모아레(moiré) 시스템이 가진 낮은 캐리어 밀도 한계를 극복하고, 높은 온도에서도 플랫 밴드 물리(예: 분수 양자 이상 홀 효과)를 관찰할 수 있는 새로운 반데르발스(vdW) 카고메 물질군을 찾고자 했습니다.", "result": "연구진은 새로운 vdW 카고메 물질군인 A2T3X4(A=K, Rb, Cs; T=Ni, Pd, Pt; X=S, Se)를 제시하고, 이를 단층까지 박리하는 데 성공했습니다. 나노-ARPES 측정을 통해 페르미 준위 근처에서 고립된 카고메 기원 플랫 밴드를 직접 확인했으며, 게이트 조절을 통해 이 플랫 밴드에 직접 접근할 수 있음을 입증했습니다.", "implication": "이 물질은 기존 모아레 시스템보다 200배 이상 높은 전자 밀도를 가진 플랫 밴드를 제공합니다. 이는 분수 양자 이상 홀 효과(FQAH)와 같은 창발적 현상을 현재보다 훨씬 높은 온도에서 구현하고 제어할 수 있는 기반을 마련한 것입니다.", "novelty": "이상적인 2차원 단층 카고메 격자를 최초로 구현했다는 점이 가장 큰 혁신입니다. 사용자님의 주요 관심사인 카고메 금속과 ARPES, 그리고 단층 2D 물질의 전자 구조 제어를 완벽하게 관통하는 결과로, 고온 위상 양자 상태 연구의 새로운 표준이 될 가능성이 높습니다.", "unresolved": "실제 게이트 소자 내에서 분수 양자 이상 홀 효과가 실험적으로 관찰되는지, 그리고 자성 및 상관 관계의 세기가 온도를 어디까지 끌어올릴 수 있을지에 대한 실험적 검증이 남아 있습니다.", "future_work": "박리된 단층 A2T3X4를 이용한 전송 측정 소자 제작, 게이트 전압에 따른 플랫 밴드 충전율 제어, 그리고 극한 환경에서의 양자 홀 효과 측정이 예상됩니다.", "concepts": [{"term": "Flat Band (플랫 밴드)", "why_emerged": "밴드의 곡률이 거의 없어 전자의 유효 질량이 무한대가 되며, 운동 에너지가 억제되어 전자 간 상호작용(correlation)이 지배적인 상태를 연구하기 위해 등장했습니다.", "origin": "초록 정보만으로는 특정하기 어려움 (이론적으로는 Tight-binding 모델의 좌절된 격자 구조에서 유도됨)", "connections": "Kagome lattice, Moiré superlattice, Fractional Quantum Anomalous Hall Effect"}, {"term": "Nano-ARPES", "why_emerged": "미세하게 박리된 수 마이크로미터 크기의 단층 시편이나 불균일한 표면의 전자 구조를 정밀하게 측정하기 위해 광원의 크기를 나노미터 수준으로 집속한 기술입니다.", "origin": "MAESTRO (Advanced Light Source) 등 주요 방사광 가속기 빔라인에서 발전", "connections": "ARPES, 2D Materials, Domain imaging"}, {"term": "A2T3X4 family", "why_emerged": "화학적으로 안정적이면서 층간 결합이 약해 단층 박리가 가능한 새로운 카고메 구조 기반의 반데르발스 물질군이 필요했습니다.", "origin": "본 논문 연구진 (Bong et al.)", "connections": "van der Waals materials, Kagome metals"}], "english_summary": ["Discovery of a new van der Waals kagome family, A2T3X4, enabling the realization of true 2D monolayer kagome lattices.", "Direct observation of an isolated kagome flat band near the Fermi level using nano-focused ARPES.", "The system offers 220 times higher electron density than moiré systems, potentially hosting FQAH states at high temperatures.", "Gate-tunability allows for direct exploration of partially filled flat-band physics in an intrinsic 2D crystal."]}}, {"title": "Surface-extended Andreev bound states emerging from intrinsic surface superconductivity of PtBi2", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2507.13843", "authors": "Xiaochun Huang, Lingxiao Zhao, Sebastian Schimmel, et al.", "last_authors": "Bernd B\\\"uchner, Matthias Bode", "summary": "Intrinsic topological superconductivity remains one of the central open questions in condensed-matter physics. The three-dimensional Weyl semimetal PtBi$_2$ has recently been shown by angle-resolved photoemission spectroscopy to host a superconducting gap that opens exclusively on its Fermi-arc surface states and exhibits a nodal structure, making it a promising platform for exploring unconventional and potentially topological superconductivity. However, despite these momentum-resolved insights, the real-space spectroscopic signatures of unconventional superconductivity in PtBi$_2$ remain unclear. Here, using scanning tunneling microscopy and spectroscopy, we reveal a sizable and spatially homogeneous gap ($\\Delta > 10\\,\\mathrm{meV}$) on atomically pristine terraces of PtBi$_2$. Within this gap, we detect surface-extended in-gap states exhibiting pronounced atomic-scale spatial modulation. Analysis of the tunneling spectra indicates that these states are most consistently interpreted as Andreev bound states within a superconducting gap. Further phenomenological modeling shows that their characteristic spectral features are naturally captured by a chiral pairing scenario. Our results establish a direct real-space connection between the superconducting gap and surface-extended quasiparticle states in PtBi$_2$, and provide new insight into the nature of its unconventional surface superconductivity. These findings highlight PtBi$_2$ as a versatile platform for exploring exotic quasiparticle excitations and potential Majorana physics.", "tier": "A_MUST_READ", "score": "10", "reason": "Direct hit: STM and ARPES context on a Weyl semimetal with unconventional surface superconductivity.", "tags": ["method:STM", "method:ARPES", "material:PtBi2", "topic:Weyl-semimetal"], "image": "https://arxiv.org/html/2507.13843v2/Figure1.jpg", "briefing": {"background": "PtBi2는 위상학적으로 0차원 점 접촉이 존재하는 웨일 반금속(Weyl semimetal)으로 알려져 있으며, 최근 ARPES를 통해 표면의 페르미 아크(Fermi arc)에서만 선택적으로 초전도 갭이 열린다는 보고가 있었습니다. 이는 위상 초전도체 구현의 유망한 후보 물질로 꼽힙니다.", "motivation": "ARPES를 통해 운동량 공간(k-space)에서의 정보는 얻었으나, 실제 공간(real-space)에서 이 초전도 상태가 어떤 특성을 갖는지, 그리고 안드레예프 속박 상태(Andreev bound states)와 같은 비전통적 초전도체의 증거가 존재하는지 확인이 필요했습니다.", "result": "STM/STS 연구 결과, 깨끗한 PtBi2 테라스 표면에서 약 10 meV 이상의 균일한 초전도 갭을 발견했습니다. 특히 갭 내부에서 원자 단위의 공간 변조를 보이는 표면 확장 안드레예프 속박 상태(ABS)를 검출했으며, 이는 키랄 페어링(chiral pairing) 시나리오와 일치함을 보였습니다.", "implication": "PtBi2의 표면 초전도가 단순한 벌크 효과가 아니라, 페르미 아크와 관련된 비전통적(unconventional) 성격을 지님을 시사합니다. 이는 마요라나 페르미온(Majorana physics) 탐색을 위한 중요한 물리적 토대를 제공합니다.", "novelty": "사용자님의 관심사인 PtBi2와 STM/STS를 직접 연결하는 논문입니다. 특히 페르미 아크 기원의 초전도성을 실제 공간 분광학으로 증명하고 키랄 대칭성과의 연결고리를 제시했다는 점에서 매우 중요합니다.", "unresolved": "이 초전도 상태가 외부 자기장에 어떻게 반응하는지, 그리고 큐리 온도가 아닌 초전도 전이 온도 부근에서 토폴로지컬 불변량이 어떻게 변하는지에 대한 추가 연구가 필요합니다.", "future_work": "자기장 하에서의 보텍스(vortex) 코어 구조 관측 및 보텍스 내 마요라나 제로 모드 존재 여부 확인을 위한 고해상도 STM 측정이 기대됩니다.", "concepts": [{"term": "Andreev Bound States (ABS)", "why_emerged": "초전도체와 일반 금속(또는 위상 상태)의 계면에서 안드 mpound", "journal": "PRB_Recent", "source": "keyword", "link": "http://link.aps.org/doi/10.1103/jf63-mc5r", "authors": "Xizhi Li, Nour Maraytta, Xipeng Wang, et al.", "last_authors": "Aifeng Wang, Hengxin Tan", "summary": "The rattling chain model has provided a useful phenomenological guideline for identifying $A{M}_{6}{X}_{6}$-type kagome charge density wave (CDW) materials. In this work, we performed a comprehensive experimental and theoretical investigation of ${\\text{TiV}}_{6}{\\text{Sn}}_{6}$, a kagome CDW materi…", "tier": "A_MUST_READ", "score": "9", "reason": "title strong match: kagome metal", "tags": ["kagome", "chargedensitywave", "CDW"], "image": "", "briefing": {"background": "카고메 격자 구조를 가진 금속 화합물(kagome metals)은 특유의 기하학적 좌절(frustration)과 전자 구조(flat band, Dirac cone 등)로 인해 전하 밀도 파동(CDW), 초전도성, 위상학적 특성 등 다양한 양자 현상을 보입니다. 특히 AV3Sb5 계열에서 발견된 CDW는 비정상적인 홀 효과와 결합되어 큰 주목을 받았습니다.", "motivation": "최근 166 구조의 카고메 금속(AM6X6)에서 '래틀링 체인 모델(rattling chain model)'이 CDW 발생을 예측하는 지표로 사용되어 왔습니다. TiV6Sn6는 이 모델에 따르면 CDW가 나타나야 하는 화합물임에도 불구하고, 실제 실험에서는 CDW가 관찰되지 않는 이유를 밝히고자 합니다.", "result": "이 논문은 TiV6Sn6에 대한 포괄적인 실험 및 이론적 조사를 통해, 단순히 원자의 '래틀링(흔들림)' 현상만으로는 CDW 전이를 보장할 수 없음을 보여줍니다. 전자-격자 결합 강도나 페르미 면의 네스팅(nesting) 조건 등 다른 결정적인 요인이 결여되었을 가능성을 시사합니다.", "implication": "기존의 현상론적인 래틀링 체인 모델의 한계를 명확히 함으로써, 향후 새로운 카고메 CDW 물질을 설계하거나 탐색할 때 고려해야 할 물리적 변수들을 재정의하게 합니다.", "novelty": "사용자의 주요 관심사인 카고메 금속(AV3Sb5 등)과 CDW 메커니즘을 직접적으로 다루고 있으며, 모델의 예측과 실제 실험 결과 사이의 불일치를 분석하여 해당 분야의 이론적 완성도를 높였다는 점에서 중요합니다.", "unresolved": "TiV6Sn6에서 CDW가 억제되는 구체적인 미시적 원인(예: 압축률, 특정 밴드의 분산 특성 등)에 대한 정량적 분석은 추가 연구가 필요해 보입니다.", "future_work": "도핑이나 외부 압력을 통해 TiV6Sn6 계열에서 숨겨진 CDW 상태를 유도할 수 있는지 확인하는 실험이나, 래틀링 모델을 보완할 수 있는 새로운 열역학적 가이드라인 제시가 기대됩니다.", "concepts": [{"term": "Kagome Metal (카고메 금속)", "why_emerged": "기하학적 구조에서 기인한 전자 간의 강한 상관관계와 위상학적 밴드 구조를 연구하기 위해 등장했습니다.", "origin": "일본의 대나무 바구니 패턴(Kagome)에서 유래한 격자 구조 명칭입니다.", "connections": "AV3Sb5, RV6Sn6, Dirac/Weyl semimetals, Frustrated magnetism"}, {"term": "Rat thors": "Noam Ophir, Anna Keselman", "last_authors": "Noam Ophir, Anna Keselman", "summary": "We study the formation of a trion liquid in doped low-dimensional semiconductors with strong electron-hole interactions and analyze its signatures in angle-resolved photoemission spectroscopy (ARPES). We show that this strongly correlated state of matter forms naturally in the vicinity of the phase …", "tier": "A_MUST_READ", "score": "9", "reason": "title strong match: photoemission", "tags": ["ARPES", "angle-resolvedphotoemission", "photoemission", "correlated"], "image": "", "briefing": {"background": "반도체나 저차원 물질에 빛을 쪼여 생성된 전자-정공 쌍은 엑시톤(exciton)을 형성하며, 여기에 전하가 추가되면 트리온(trion, charged exciton)이 됩니다. 입자 농도가 충분히 높아지면 이들이 집단적으로 행동하는 '트리온 액체' 상태가 형성될 수 있습니다.", "motivation": "트리온 액체는 강한 상관관계를 가진 흥미로운 양자 상태이지만, 이를 각분해 광전자 분광법(ARPES)과 같은 실험 장비로 어떻게 식별하고 해석할지에 대한 이론적 가이드가 부족했습니다.", "result": "연구팀은 도핑된 저차원 반도체에서 트리온 액체의 형성을 연구하고, ARPES 스펙트럼에 나타나는 고유한 신호(signature)를 분석했습니다. 상전이 근처에서 이 상태가 자연스럽게 형성됨을 보였습니다.", "implication": "ARPES를 통해 고체 내의 단순한 밴드 구조뿐만 아니라, 트리온과 같은 복합적인 다체(many-body) 여기 상태의 동역학을 직접 관찰할 수 있는 토대를 마련했습니다.", "novelty": "트리온 물리와 ARPES 해석을 결합했다는 점이 핵심입니다. 특히 ARPES를 주 도구로 사용하는 사용자에게 강상관 전자계 연구의 새로운 타겟(trion liquid)을 제시합니다.", "unresolved": "실제 실험 데이터에서 배경 잡음이나 다른 준입자(polaron 등) 신호로부터 트리온 액체 신호를 명확히 분리해낼 수 있는 해상도 확보가 관건입니다.", "future_work": "단층 TMD(Transition Metal Dichalcogenides)와 같은 실제 2차원 반도체 물질에 대한 고해상도 시간 분해 ARPES(tr-ARPES) 실험과의 비교 연구가 기대됩니다.", "concepts": [{"term": "Trion (트리온)", "why_emerged": "반도체 내에서 전자-정공 쌍(엑시톤)에 추가적인 전하가 결합된 준입자를 설명하기 위해 등장했습니다.", "origin": "M. Lampert (1958)가 처음 제안함.", "connections": "Exciton, Many-body physics, Doped semiconductors"}, {"term": "ARPES (각분해 광전자 분광법)", "why_emerged": "물질 내 전자의 에너지와 운동량 관계(밴드 구조)를 직접 측정하기 위해 개발되었습니다.", "origin": "William Spicer 등의 광전효과 연구를 기반으로 발전함.", "connections": "Fermi surface, Band mapping, Photoemission"}, {"term": "Many-body interaction (다체 상호작용)", "why_emerged": "단일 입자 근사로 설명할 수 없는 전하 운반자들 간의 복잡한 상관관계를 이해하기 위해 필수적입니다.", "origin": "Quantum field theory applied to condensed matter.", "connections": "Correlation effects, Green's function, Collective excitations"}], "english_summary": ["Theoretically predicts ARPES signatures of a trion liquid in low-dimensional semiconductors.", "Explores the formation of strongly correlated trion states near phase transitions.", "Provides a framework to identify complex many-body bound states using photoemission spectroscopy.", "Directly applicable to the user's ARPES interest in correlated and 2D systems."]}}, {"title": "CME-SpectrumBench: Can LLMs Analyze Condensed Matter Spectral Data?", "journal": "arXiv_CondMat", "source": "author whitelist", "link": "https://arxiv.org/abs/2610.24304", "authors": "Jin Gene Wong, Anjney Midha, Joseph Mathew Tennyson, Wei-Lin Chiang, Ion Stoica, Zhi-Xun Shen", "last_authors": "Ion Stoica, Zhi-Xun Shen", "summary": "Large Language Models (LLMs) are presently well assessed by expert-level mathematics and physics benchmarks which focus on theoretical, symbolic reasoning. However, we lack experimental benchmarks that evaluate data analysis in frontier research problems, a capability that future domain-specific foundation models must have. To this end, we present CME-SpectrumBench, an expert-designed benchmark consisting of 190 questions that measures how reliably frontier LLMs analyze research-level spectral scientific data in condensed matter experiments (CME). Using simulated CME spectral data, we prompt models to identify structures from 2D intensity arrays in the face of noise and limited instrumental resolution, a test of dense context reasoning. Models are scored by how accurately their numerical answers approach the ground truth. Under direct query, scores generally pale in comparison to handwritten code due to clear failure modes: models can find simple features but struggle to trace patterns or compute derived quantities, and performance typically degrades with increased data resolution and noise/convolution levels. LLM performance becomes comparable to handwritten code by allowing tool use (access to a Python interpreter) with/without ReAct prompting, in effect mapping questions onto agentic code generation problems. Our findings show that frontier models can serve as research assistants by interfacing with data through code, but still face difficulties processing information directly from large datasets - a key barrier future foundation models must overcome. The code and data are publicly available at https://huggingface.co/datasets/jingene/CMESpectrumBench.", "tier": "A_MUST_READ", "score": "9", "reason": "author whitelist: Zhi-Xun Shen", "tags": ["authorWhitelist"], "image": "https://arxiv.org/html/2610.24304v1/Images/Example.png", "briefing": {"background": "응집물질 물리학(CME) 실험, 특히 ARPES나 STM과 같은 분야에서는 방대한 양의 2차원 스펙트럼 데이터가 생성됩니다. 이러한 데이터를 분석하여 물리적 특징을 추출하는 과정은 지금까지 주로 전문가의 수동 분석이나 전용 알고리즘에 의존해 왔습니다.", "motivation": "최근 거대언어모델(LLM)이 다양한 과학적 추론에서 두각을 나타내고 있으나, 복잡하고 노이즈가 섞인 실제 실험 데이터를 직접 분석하고 수치적 물리량을 도출하는 데 얼마나 신뢰할 수 있는지는 검증되지 않았습니다.", "result": "Zhi-Xun Shen 교수 연구팀은 190개의 전문가 설계 질문으로 구성된 'CME-SpectrumBench'를 구축했습니다. 평가 결과, 최신 LLM들은 직접적인 데이터 쿼리 시에는 단순 특징은 찾지만 패턴 추적이나 복잡한 물리량 계산에서는 기존 코드에 비해 성능이 크게 떨어졌습니다. 하지만 LLM이 파이썬 인터프리터를 도구로 사용할 경우 성능이 기존 코드 수준으로 향상됨을 확인했습니다.", "implication": "현재의 LLM은 데이터를 직접 읽고 해석하는 '눈'의 역할보다는, 적절한 분석 코드를 생성하고 실행하여 결과를 요약하는 '연구 보조원(Research Assistant)' 역할에 더 적합함을 시사합니다.", "novelty": "ARPES 분야의 거두인 Shen 교수가 참여하여 실제 실험 데이터의 특성(노이즈, 기기 분해능 등)을 반영한 LLM 벤치마크를 처음으로 제시했다는 점이 중요합니다. 독자의 주요 관심사인 ARPES 데이터 분석의 자동화 가능성을 타겟팅합니다.", "unresolved": "데이터의 해상도가 높아지거나 노이즈/컨볼루션 수준이 심해질 경우 LLM의 추론 성능이 급격히 저하되는 임계점의 원인은 아직 명확히 규명되지 않았습니다.", "future_work": "실험 데이터를 직접 처리할 수 있는 도메인 특화 기반 모델(Foundation Model)의 개발과, 더 복잡한 다차원 데이터셋으로의 벤치마크 확장이 기대됩니다.", "concepts": [{"term": "CME-SpectrumBench", "why_emerged": "LLM의 응집물질 물리학 실험 데이터 분석 능력을 정량적으로 평가하기 위해 고안되었습니다.", "origin": "Jin Gene Wong, Zhi-Xun Shen 등 (2024)", "connections": "ARPES, STM 데이터셋, LLM 추론 벤치마크"}, {"term": "Agentic Code Generation", "why_emerged": "LLM이 스스로 코드를 작성하고 실행하여 문제를 해결하는 방식이 단순 텍스트 답변보다 정확도가 높기 때문입니다.", "origin": "ReAct prompting 등 AI 에이전트 이론", "connections": "Python 인터프리터, 도구 사용(Tool-use) LLM"}], "english_summary": ["A new benchmark, CME-SpectrumBench, evaluates LLMs on analyzing research-level spectral data in condensed matter physics.", "Frontier LLMs struggle with direct numerical analysis but excel when given access to Python tools and ReAct prompting.", "The study highlights that while LLMs can act as research assistants, processing dense experimental data remains a major challenge for future foundation models."]}}, {"title": "Certifying Nonlocal Spin Quantum Entanglement from Local Tunneling Spectra", "journal": "arXiv_CondMat", "source": "author whitelist", "link": "https://arxiv.org/abs/2610.24440", "authors": "Payman Kazemikhah, Ruolun Zhang, Xiangyu Luo, et al.", "last_authors": "Md. Shafayat Hossain, M. Zahid Hasan", "summary": "Quantum entanglement is intrinsically nonlocal, whereas tunneling spectroscopy measures one site at a time. We show that this apparent mismatch can be overcome: local tunneling spectra can certify spin entanglement without coherent control or absolute intensity calibration. An exact spin sum rule turns the high-bias conductance into an internal normalization, allowing the inelastic spin-flip weight to place a lower bound on the local quantum Fisher information. Total-spin conservation then fixes the otherwise inaccessible intersite fluctuation, converting two local spectra into a bound on a collective entanglement witness. We incorporate coupling to the substrate through a spectroscopic bound on spin leakage, while a hierarchy of thresholds distinguishes entanglement between the spins from entanglement with their environment. Including instrumental broadening and noise, the resulting certificate holds at a stated confidence level. These results establish a route for extracting nonlocal quantum information from equilibrium local spectroscopy.", "tier": "A_MUST_READ", "score": "9", "reason": "author whitelist: M. Zahid Hasan", "tags": ["authorWhitelist"], "image": "https://arxiv.org/html/2610.24440v1/fig3_map.png", "briefing": {"background": "양자 얽힘은 본질적으로 비국소적(nonlocal)인 성질이지만, STM과 같은 터널링 분광법은 특정 지점에서 국소적인 측정만을 수행합니다. 따라서 국소 측정을 통해 계의 전체적인 얽힘 상태를 증명하는 것은 물리적으로 매우 어려운 과제였습니다.", "motivation": "결맞음 제어(coherent control)나 절대적인 강도 보정 없이도, 국소적인 터널링 스펙트럼 데이터만으로 비국소적인 스핀 양자 얽힘을 인증할 수 있는 이론적 방법론을 제시하고자 합니다.", "result": "연구팀은 스핀 합 규칙(spin sum rule)을 이용해 고전압 전도도를 내부 표준화 지표로 삼고, 비탄성 스핀-플립 가중치가 국소 양자 피셔 정보(LQFI)의 하한선을 결정함을 보였습니다. 또한 전체 스핀 보존 법칙을 통해 측정되지 않은 사이트 간의 요동을 고정함으로써, 두 개의 국소 스펙트럼을 결합해 전체 계의 얽힘 증거로 변환하는 데 성공했습니다.", "implication": "STM/STS를 통해 단순히 상태 밀도(DOS)를 보는 것을 넘어, 실제 재료 시스템의 양자 정보(얽힘)를 정량적으로 추출할 수 있는 길이 열렸습니다.", "novelty": "M. Zahid Hasan 그룹의 연구로, 위상 물질 탐색에서 한 단계 나아가 양자 정보 추출을 위한 분광학적 방법론을 제시했습니다. 독자가 관심 있는 STM/STS 실험을 양자 얽힘 증명 도구로 확장했다는 점이 돋보입니다.", "unresolved": "기판(substrate)과의 결합으로 인한 스핀 누출이나 계측기의 노이즈가 얽힘 인증의 하한선에 미치는 영향에 대한 추가적인 실험적 검증이 필요합니다.", "future_work": "실제 자성 원자 체인이나 2차원 자성 시스템에서 STM을 이용해 비국소 얽힘을 직접 실험적으로 측정하는 시도가 이어질 것으로 보입니다.", "concepts": [{"term": "Quantum Fisher Information (QFI)", "why_emerged": "양자 상태의 민감도와 얽힘의 정도를 정량화하기 위해 도입된 통계적 척도입니다.", "origin": "Samuel L. Braunstein, Carlton M. Caves (1994)", "connections": "Quantum Metrology, Entanglement Witness"}, {"term": "Inelastic Spin-Flip Weight", "why_emerged": "터널링 분광 시 전자의 스핀이 바뀌며 발생하는 에너지 손실을 측정하여 계의 스핀 여기 상태를 이해하기 위해 필요합니다.", "origin": "초록 정보만으로는 특정하기 어려움 (Inelastic Electron Tunneling Spectroscopy의 확장)", "connections": "STM/STS, Spin Dynamics"}], "english_summary": ["The paper proposes a protocol to certify nonlocal spin entanglement using only local tunneling spectra from instruments like STM.", "By utilizing spin sum rules and local quantum Fisher information, they establish a spectroscopic bound for entanglement without needing absolute intensity calibration.", "This method links local equilibrium spectroscopy directly to collective quantum information, bridging the gap between local probes and global quantum states."]}}, {"title": "Magnetoelectric Bulk Photovoltaic Effect in Centrosymmetric Solids", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2610.26057", "authors": "Longjun Xiang, Fuming Xu, Lei Zhang, Jian Wang", "last_authors": "Lei Zhang, Jian Wang", "summary": "It is commonly believed that a bulk photovoltaic current requires broken spatial inversion symmetry. However, in this work, we demonstrate that dc photocurrents can arise in centrosymmetric solids from the bilinear coupling between the electric and magnetic components of light. This magnetoelectric bulk photovoltaic effect (MBPE) has a quantum-geometric origin in the dipole moments of the Zeeman quantum metric and Zeeman Berry curvature. We identify four distinct MBPE mechanisms, including time-reversal-even and time-reversal-odd injection-like and shift-like photocurrents driven by linearly or circularly polarized light. Our symmetry analysis shows that the MBPE is allowed in broad classes of two-dimensional centrosymmetric nonmagnetic and magnetic materials under normally incident light. As representative examples, we predict sizable MBPEs in centrosymmetric monolayer Pt$_2$HgSe$_3$ and altermagnetic RuF$_4$, with current densities on the order of $1~\\mathrm{mA/m}$. Notably, the injection-like photocurrent in RuF$_4$ reverses sign upon switching either the light helicity or the N\\'eel vector. Our results extend the bulk photovoltaic effect to centrosymmetric solids and open new opportunities for electrical readout of altermagnetic order.", "tier": "A_MUST_READ", "score": "9", "reason": "Connects altermagnetism (RuF4) and Zeeman Berry curvature to experimental photovoltaic signatures.", "tags": ["altermagnet", "Berry-curvature", "photovoltaic"], "image": "https://arxiv.org/html/2610.26057v1/FIG3.png", "briefing": {"background": "벌크 광기전 효과(BPVE)는 일반적으로 공간 반전 대칭이 깨진 물질에서만 발생하는 것으로 알려져 있습니다. 이는 태양전지나 센서 기술의 물리적 제한 요소로 작용해 왔습니다.", "motivation": "반전 대칭이 유지되는(centrosymmetric) 물질에서도 빛의 전기장과 자기장 성분의 선형 결합을 통해 직류 광전류가 발생할 수 있음을 증명하고, 이를 최근 주목받는 알터마그넷(Altermagnet)과 연결하고자 합니다.", "result": "연구팀은 '자기전기 벌크 광기전 효과(MBPE)'를 제안했습니다. 이는 지만 양자 메트릭(Zeeman quantum metric)과 지만 베리 곡률(Zeeman Berry curvature)이라는 양자 기하학적 성질에서 기인합니다. 특히 알터마그넷 후보 물질인 RuF4에서 빛의 헬리시티나 네엘 벡터 방향에 따라 부호가 바뀌는 상당한 크기의 광전류가 발생함을 예측했습니다.", "implication": "반전 대칭 물질에서도 광전류를 생성할 수 있게 되어 재료 선택의 폭이 넓어졌으며, 특히 알터마그넷의 자기적 질서를 전기적으로 읽어낼 수 있는(readout) 새로운 메커니즘을 제공합니다.", "novelty": "독자의 주요 관심사인 알터마그넷(RuF4)과 베리 곡률을 활용하여 새로운 광전류 효과를 설명했습니다. 기존 BPVE의 대칭성 제약을 깨는 이론적 확장을 제시했다는 점에서 혁신적입니다.", "unresolved": "예측된 RuF4에서의 MBPE 신호 강도가 실제 실험 환경의 열적 요동이나 산란 효과 하에서도 충분히 측정 가능할지는 미지수입니다.", "future_work": "Centrosymmetric monolayer Pt2HgSe3나 RuF4와 같은 실제 물질에서의 실험적 관측과, 이를 이용한 차세대 광전 소자 설계가 기대됩니다.", "concepts": [{"term": "Altermagnetism", "why_emerged": "강자성(순자화 있음)과 반강자성(순자화 없음)의 장점을 동시에 가진, 스핀 분열된 밴드 구조를 갖는 새로운 자성 상태를 정의하기 위해 등장했습니다.", "origin": "Libor Šmejkal, Jairo Sinova, Tomas Jungwirth (2022년경)", "connections": "RuF4, Spin-polarized bands, Anomalous Hall effect"}, {"term": "Zeeman Berry Curvature", "why_emerged": "외부 자기장이나 자기 모멘트와 빛의 자기장 성분이 결합할 때 나타나는 전자 파동함수의 기하학적 위상 변화를 설명하기 위해 도입되었습니다.", "origin": "초록 정보만으로는 특정하기 어려움 (Berry curvature의 확장)", "connections": "Quantum Geometry, Magnetoelectric Effect"}], "english_summary": ["The researchers demonstrate that bulk photovoltaic currents can occur in centrosymmetric solids via magnetoelectric coupling.", "The effect originates from the Zeeman quantum metric and Zeeman Berry curvature, extending BPVE theory to magnetic materials with inversion symmetry.", "Sizable photocurrents are predicted in altermagnetic RuF4, offering a method for electrical readout of its Néel vector."]}}, {"title": "Microscopic Compensation of Circular Optical Response in Altermagnets", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2610.25489", "authors": "Meysam Bagheri Tagani, Carmine Autieri, Sahar Izadi Vishkayi", "last_authors": "Carmine Autieri, Sahar Izadi Vishkayi", "summary": "A weak or vanishing circular optical signal need not imply weak helicity-sensitive transitions: it can be the residual of much larger opposing microscopic contributions. We resolve the finite-frequency interband Kubo response before summing over transitions and momentum, separating cancellation among transitions at fixed momentum from cancellation across the Brillouin zone. An exactly compensated $d$-wave model establishes the symmetry benchmark. In MnTe, first-principles Wannier calculations reveal a symmetry-dark N\\'eel orientation with an extended sign-changing circular kernel whose bulk integral vanishes. Reorienting the N\\'eel vector removes this extinction, yet the allowed response remains a small imbalance between large positive- and negative-momentum sectors; the imbalance reverses with photon energy and flips the macroscopic sign. Thus magnetic symmetry decides whether circular response is allowed, whereas microscopic compensation determines how much survives and with what sign. This distinction provides a general framework for interpreting weak, vanishing, and sign-changing magneto-optical signals in compensated magnets.", "tier": "A_MUST_READ", "score": "9", "reason": "Direct focus on altermagnetism and microscopic electronic response in MnTe, highly relevant to user's material interests.", "tags": ["altermagnet", "material", "spectroscopy"], "image": "https://arxiv.org/html/2610.25489v1/Fig1.png", "briefing": {"background": "얼터마그넷(Altermagnet)은 순자화는 0이지만 밴드 구조에서 스핀 분할이 일어나는 새로운 자성 상태로, 응집물질 물리 분야에서 큰 관심을 받고 있습니다. 특히 원편광에 대한 응답(Circular optical response)은 자성체의 전자 구조와 대칭성을 연구하는 중요한 도구입니다.", "motivation": "일반적으로 보상된 자성체(Compensated magnets)에서 원편광 신호가 약하거나 나타나지 않으면 전이 강도 자체가 약하다고 간주하기 쉽습니다. 본 연구는 이러한 거시적 신호의 소멸이 실제로는 미시적인 기여들의 상쇄 결과일 수 있음을 MnTe 사례를 통해 규명하고자 했습니다.", "result": "제1원리 Wannier 계산을 통해 MnTe의 특정 네엘(Néel) 방향에서는 브릴루앙 영역 전체에 걸쳐 부호가 변하는 원편광 커널이 존재하여 전체 적분값이 0이 됨을 보였습니다. 네엘 벡터의 방향을 바꾸면 이러한 상쇄가 깨지며, 거시적인 신호의 부호와 크기는 미시적인 양/음의 운동량 영역 간의 미세한 불균형에 의해 결정됨을 확인했습니다.", "implication": "얼터마그넷의 자기 광학 신호를 해석할 때, 단순히 신호의 유무가 아니라 대칭성에 따른 '미시적 상쇄(Microscopic compensation)' 메커니즘을 고려해야 한다는 새로운 프레임워크를 제공합니다.", "novelty": "얼터마그넷의 광학 응답을 운동량 공간에서 분해하여 해석함으로써, 독자의 관심사인 MnTe와 같은 실제 물질에서 전자 구조와 광학 신호 사이의 관계를 미시적으로 연결했습니다. 이는 CD-ARPES 등을 통한 실험적 검증의 이론적 토대가 됩니다.", "unresolved": "이론적으로 예측된 네엘 벡터 재배향에 따른 신호 변화를 실제 실험에서 얼마나 정밀하게 제어하고 측정할 수 있을지에 대한 실험적 증명이 필요합니다.", "future_work": "다양한 얼터마그넷 후보 물질군으로 이 프레임워크를 확장하고, 외부 전자기장을 이용한 네엘 벡터 제어를 통해 광학 응답을 튜닝하는 연구가 기대됩니다.", "concepts": [{"term": "Altermagnetism", "why_emerged": "강자성(FM)의 큰 자화와 반강자성(AFM)의 빠른 스핀 역학을 동시에 구현하기 위해 스핀 분할이 있는 비강자성 상태의 필요성이 제기됨.", "origin": "L. Šmejkal, J. Sinova, T. Jungwirth 등에 의해 최근 이론적으로 정립됨.", "connections": "반강자성체, 스핀 홀 효과, 자기 광학 효과"}, {"term": "Interband Kubo response", "why_emerged": "물질의 광학적 전도도나 유전율을 전도대와 가전자대 사이의 전이 관점에서 양자역학적으로 계산하기 위해 도입됨.", "origin": "Ryogo Kubo (1957)", "connections": "선형 응답 이론, 베리 곡률, 광학 전도도"}, {"term": "Néel vector", "why_emerged": "반강자성체에서 각 서브래티스의 자화 방향을 정의하여 자기 정렬 상태를 기술하기 위해 필요함.", "origin": "Louis Néel (1930년대)", "connections": "반강자성, 스핀 동역학, 스핀토로닉스"}, {"term": "Wannier functions", "why_emerged": "Bloch 함수를 국소화된 기저 함수로 변환하여 복잡한 고체 시스템의 전자 구조를 효율적으로 계산하기 위해 고안됨.", "origin": "Gregory Wannier (1937)", "connections": "제1원리 계산, Tight-binding 모델, 베리 위상"}], "english_summary": ["Investigates the microscopic origin of weak circular optical responses in altermagnets using MnTe as a model system.", "Demonstrates that vanishing macroscopic signals can result from internal cancellations across the Brillouin zone rather than weak transitions.", "Shows that reorienting the Néel vector can reveal hidden electronic imbalances, providing a framework for magneto-optical interpretation.", "Links microscopic electronic transitions to macroscopic symmetry-allowed responses in compensated magnets."]}}, {"title": "Suppression ugh the chiral superlattice, their orbital Bloch wavefunction and quantum geometry are modulated by the strong chiral superlattice potential, generating large Berry curvature in the chiral superlattice, which we detect by the nonlinear Hall effect. At 150 K, the chiral superlattice induced Berry curvature couples to the collinear AFM order, generating a giant anomalous Hall angle ~0.14 abruptly near $T_N$ that is among the largest in bulk magnets. Moreover, our spin Hanle precession measurement shows that the chiral superlattice also generates spin-polarized current from the collinear AFM, a long-standing goal in spintronics. We shed light on the supermodulation formation mechanism based on chemical ion size and physical interlayer-intralayer energy competitions, using which we propose a design principle to discover similar bond-mismatch superlattices, providing a chiral superlattice pathway through real space engineering of quantum geometry.", "tier": "B_IMPORTANT_CONDMAT", "score": "9", "reason": "Direct interest: topological antiferromagnetism, chiral superlattice, giant anomalous Hall, Berry curvature.; demoted from A: broad CM, not direct user/project hit", "tags": ["topologicalmaterials", "antiferromagnet", "anomalousHalleffect", "Berrycurvature", "spintronics"], "image": "https://arxiv.org/html/2610.24242v1/Figure1.png", "briefing": {"background": "반강자성체(AFM)는 일반적으로 스핀 정렬로 인해 자화가 상쇄되어 베리 곡률(Berry curvature)이나 스핀 분할이 없는 것으로 간주되어 왔습니다. 그러나 최근 스핀트로닉스 분야에서는 이러한 반강자성체에서도 비전통적인 물리 현상을 유도하려는 시도가 활발합니다.", "motivation": "UOTe라는 물질이 원래는 베리 곡률이 없는 반강자성체임에도 불구하고, 실제로는 거대한 비선형 홀 효과와 같은 비정상적인 전자기적 특성을 보이는 이유를 규명하고자 하였습니다.", "result": "UOTe 내부에 자발적으로 형성되는 '카이랄 초격자(chiral superlattice)' 구조를 발견하였습니다. 이 구조는 일종의 동결된 카이랄 포논으로 작용하며, 전자의 파동함수를 변조하여 거대한 베리 곡률과 스핀 편극 전류를 생성함을 확인했습니다.", "implication": "반강자성체에서 실공간 격자 엔지니어링을 통해 양자 기하학을 제어할 수 있음을 증명했습니다. 이는 거대한 이상 홀 효과를 유도하는 새로운 경로를 제시하며 반강자성 스핀트로닉스 소자 설계의 중요한 원리가 됩니다.", "novelty": "본질적으로 자성이 없는 상태에서 구조적 비대칭(카이랄성)을 이용해 강한 위상학적 현상을 이끌어낸 ully compensated ferrimagnetism (Class-III, 31 cSLGs). We illustrate these categories using the most common and feasibly exfoliable 2D candidate materials. These include Sr$_2$CaCr$_2$P$_2$O$_9$ and Sr$_2$CaCr$_2$As$_2$O$_9$ (Class-I), BaMnGe and MnPS$_3$ (Class-II), and Sr$_3$Fe$_2$O$_5$Cl$_2$ and bilayer MnBi$_2$Te$_4$ (Class-III). We further demonstrate that the \\(\\mathcal{E}_z\\) generates distinctly different spin-splitting fingerprints across the three classes, yielding distinct spin-dependent responses: the electric Hall effect in Class-I, spin-polarized transport in Class-II, and the electric reversible magneto-optical Kerr effect in Class-III. Our work not only closes a complete internal cycle from conventional to unconventional collinear magnetism in 2D antiferromagnets, but also establishes a viable all-electrical compensated magnetism platform and control scheme for future spintronic applications.", "tier": "B_IMPORTANT_CONDMAT", "score": "9", "reason": "Symmetry classification of altermagnetism in 2D materials like MnBi$_2$Te$_4$, relevant to user's interests.", "tags": ["theory", "MnBi2Te4", "altermagnetism"], "image": "https://arxiv.org/html/2610.25186v1/fig1.png", "briefing": {"background": "최근 '알터자성(altermagnetism)'이라는 새로운 자성 분류가 등장하며 반강자성체의 스핀 분할(spin-splitting) 현상이 주목받고 있습니다. 이는 스핀-궤도 결합 없이도 자성을 조절할 수 있어 스핀트로닉스 응용에 매우 유리합니다.", "motivation": "2차원 물질에서 전기장(Ez)을 인가했을 때, 대칭성(PT-symmetry)이 보존된 반강자성체 내에 '숨겨진' 자기적 위상이 어떻게 발현되는지를 체계적으로 분류하고자 했습니다.", "result": "88개의 스핀 층 그룹(cSLGs)을 분류하여 전기장이 가해질 때 나타나는 세 가지 형태의 비전통적 자성(Type-IV, 알터자성, 완전히 상쇄된 페리자성)을 규명했습니다.", "implication": "전기장 제어를 통해 반강자성체의 자성을 스위칭하거나 제어할 수 있는 이론적 기반을 마련했습니다. 이는 비휘발성 메모리 등 스핀트로닉스 소자 설계에 직접 활용 가능합니다.", "novelty": "2D 반강자성체의 대칭성 분석을 통해 전기장을 이용한 '알터자성' 등의 창발적 현상을 예측하고 구체적인 후보 물질을 제시한 점이 중요합니다.", "unresolved": "제시된 물질들에서 전기장에 의한 스핀 분할이 실험적으로 얼마나 뚜렷하게 관측되는지에 대한 후속 실증 실험이 부족합니다.", "future_work": "MnBi2Te4와 같은 실제 물질군에서 전기장 게이트를 이용한 자기 광학 커 효과(MOKE) 측정이나 전송 실험을 통한 검증이 이어져야 합니다.", "concepts": [{"term": "알터자성", "why_emerged": "반강자성체에서 비상반적인 스핀 분할을 실현하여 스핀트로닉스 기능을 구현하기 위해 필요함.", "origin": "Tomas Jungwirth et al.(2022).", "connections": "반강자성체, 스핀트로닉스, 자기적 비대칭성."}, {"term": "PT 대칭성", "why_emerged": "반강자성체의 스핀 정렬을 분류하고 물리적 성질을 정의하는 핵심적인 대칭성 요소임.", "origin": "고전적 대칭성 이론에 기반.", "connections": "위상학적 물질, 스핀-궤도 결합."}, {"term": "스핀 층 그룹(cSLG)", "why_emerged": "2차원 자성 구조의 대칭성을 체계적으로 분류하기 위한 수학적 틀.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "결정학, 자성 위상학."}], "english_summary": ["Systematic symmetry classification of 88 collinear spin layer groups in 2D PT-symmetric antiferromagnets.", "Predicts three distinct classes of unconventional collinear magnetism driven by perpendicular electric fields.", "Identifies specific 2D materials like MnBi2Te4 as candidates for electrical control of magnetism.", "Establishes a comprehensive framework for electrically controlled spintronic applications."]}}, {"title": "Engineering topological phenomena via field-driven Weyl motion", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2610.25609", "authors": "Jeonghoon Shin, Taekoo Oh", "last_authors": "Jeonghoon Shin, Taekoo Oh", "summary": "We illustrate the field-driven anomalous Hall engineering via the momentum-space motion of Weyl nodes using pyrochlore iridates under a [111] magnetic field as an example. We model the system with a well-established microscopic Hamiltonian and the field effect with the spin rotation from the all-in-all-out to the ferromagnetic state. Tracking the position of Weyl nodes during the spin rotation, we demonstrate macroscopic anomalous Hall conductivity variations are fundamentally driven by Weyl node motions by comparing the full multi-band Kubo formula with the geometric Weyl node separation. The discrepancy occurs only near a critical spin rotation angle, where several Weyl nodes come into close proximity. We reveal that the evolution of anomalous Hall conductivity under the magnetic field agrees with reported experiments in an order-of-magnitude and non-monotonicity. These results elucidate the field-driven dynamics of momentum-space monopoles and provide a framework for understanding transport in strongly correlated topological materials.", "tier": "B_IMPORTANT_CONDMAT", "score": "9", "reason": "Directly addresses Weyl node dynamics, anomalous Hall, and correlated iridates using Kubo formula and transport.; demoted from A: broad CM, not direct user/project hit", "tags": ["Weyl-semimetal", "anomalous-Hall", "transport"], "image": "https://arxiv.org/html/2610.25609v1/Fig1.png", "briefing": {"background": "위상 반금속에서 웨일 노드(Weyl node)는 운동량 공간의 모노폴로 간주되며, 이들의 위치와 이동은 시스템의 거시적 물성인 변칙 홀 효과(Anomalous Hall Effect)를 결정짓는 핵심 요소입니다.", "motivation": "파이로클로어 이리데이트(Pyrochlore iridates)에서 외부 자기장에 의한 스핀 배열 변화가 어떻게 웨일 노드의 이동을 유도하고, 결과적으로 변칙 홀 전도도를 변화시키는지 미시적 Hamiltonian을 통해 규명하고자 합니다.", "result": "웨일 노드의 이동이 변칙 홀 전도도의 변화를 주도함을 확인하였으며, 스핀 회전 각도에 따른 전도도의 비단조적(non-monotonic) 거동이 실제 실험 데이터와 일관됨을 보였습니다.", "implication": "강상관 위상 물질에서 자기장 제어를 통해 운동량 공간의 토폴로지를 조작하고, 이를 통해 수송 특성을 설계(Engineering)할 수 있는 이론적 토대를 제공합니다.", "novelty": "웨일 노드라는 추상적인 개념과 실험적으로 관측 가능한 변칙 홀 전도도 사이의 정량적 대응 관계를 파이로클로어 이리데이트라는 구체적인 물질 계에서 체계적으로 분석했습니다.", "unresolved": "웨일 노드가 아주 근접하게 위치할 때 나타나는 전도도 계산의 불일치 원인과 그 근방에서의 상세한 물리적 거동은 아직 명확하지 않습니다.", "future_work": "다른 위상 물질 계로의 확장 적용 및 자기장에 의한 위상 전이의 동역학적 특성에 대한 추가 연구가 기대됩니다.", "concepts": [{"term": "웨일 노드(Weyl node)", "why_emerged": "위상 반금속에서 전도대와 가전자가 만나는 점(node)이 에너지 운동량 공간에서 위상학적 전하를 띠는 모노폴 역할을 함이 발견되어 정의되었습니다.", "origin": "Herring (1937)이 처음 이론을 제안하였으며, 응집물질물리에서는 최근 10년 사이 위상물질 연구의 핵심으로 자리 잡았습니다.", "connections": "베리 곡률, 변칙 홀 효과, 카이럴 이상(Chiral anomaly)과 깊은 연관이 있습니다."}, {"term": "변칙 홀 효과(Anomalous Hall Effect)", "why_emerged": "강자성 물질에서 외부 자기장 외에도 자화에 의한 비대칭 산란이나 내재적 베리 곡률로 인해 발생하는 홀 전압을 설명하기 위해 필요했습니다.", "origin": "Karplus와 Luttinger (1954)에 의해 초기 이론이 정립되었습니다.", "connections": "웨일 반금속, 자기 위상 절연체, 스핀 궤도 결합과 밀접하게 연결됩니다."}], "english_summary": ["Analyzed field-driven transport in pyrochlore iridates via Weyl node dynamics.", "Demonstrated that macroscopic anomalous Hall conductivity tracks Weyl node motion in momentum space.", "Successfully matched experimental non-monotonic Hall data using a multi-band Kubo formula.", "Provides a predictive framework for tuning topological transport in correlated systems."]}}, {"title": "Theory of High-Temperature Fractional Chern Phases in Monolayer van der Waals Kagome Materials A2T3X4", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2610.24633", "authors": "Soomin Oh, Jiyong Han, Jinhyeok Choi, Donghae Seo, Mingu Kang, Gil Young Cho", "last_authors": "Mingu Kang, Gil Young Cho", "summary": "Fractional Chern insulators bring the fractional quantum Hall effect, with its anyonic excitations, to zero magnetic field. So far they have been realized in moir\\'e materials, where the long superlattice period weakens electronic interactions and confines these phases to cryogenic temperatures. Early proposals instead envisioned topological flat bands on atomic-scale lattices, where fractionalization could persist to far higher temperatures, but a suitable material has been lacking. Here we theoretically identify monolayers of the recently synthesized van der Waals kagome family $\\mathrm{A}_2\\mathrm{T}_3\\mathrm{X}_4$ as such a platform, combining intrinsic topological flat bands and strong Coulomb interactions with gate-tunable carrier density and layer assembly. Exact diagonalization of models derived from density functional theory reveals ferromagnetism over broad filling ranges, supporting diverse fractional Chern insulators, anomalous composite Fermi liquids, and charge-ordered phases. In particular, in $\\mathrm{Cs}_2\\mathrm{Pd}_3\\mathrm{S}_4$, the fractional Chern insulator exhibits a many-body gap of approximately 26 meV in the largest system accessible with band mixing allowing at most one interband electron-hole excitation. Layer assembly further provides a natural route to fractional quantum spin Hall insulators: bilayers with antiparallel magnetizations support this phase at realistic separations. These results identify an experimentally accessible material family in which chemical composition, carrier density, and stacking offer complementary routes to fractionalization at enhanced energy scales and control over topological order.", "tier": "B_IMPORTANT_CONDMAT", "score": "9", "reason": "Directly identifies intrinsic topological flat bands in a new van der Waals kagome material family.", "tags": ["material", "kagome", "topological", "van-der-waals"], "image": "https://arxiv.org/html/2610.24633v1/Fig1.png", "briefing": {"background": "분수 양자 홀 효과는 극저온과 강한 자기장을 필요로 하지만, 위상 평탄 밴드(Flat bands)를 이용한 분수 첸 절연체(Fractional Chern Insulator)는 자기장 없이도 동일한 물리 현상을 구현할 수 있어 주목받고 있습니다.", "motivation": "모아레 격자 시스템은 격자 상수가 커서 상호작용 에너지가 약하다는 단점이 있어, 원자 규모 격자에서 더 높은 온도까지 분수 위상 상태를 유지할 수 있는 새로운 후보 물질을 찾고자 합니다.", "result": "반데르발스 카고메 물질군인 A2T3X4(예: Cs2Pd3S4)가 강한 상호작용을 가진 위상 평탄 밴드를 보유하고 있음을 DFT 및 정확한 대각화 계산을 통해 증명하였습니다.", "implication": "이 물질군은 외부 자기장 없이도 상온에 가까운 온도에서 분수 첸 절연체나 분수 양자 스핀 홀 절연체를 구현할 수 있는 매우 유망한 플랫폼이 될 것입니다.", "novelty": "기존 모아레 물질의 낮은 에너지 스케일 한계를 극복하기 위해 화학적 설계가 가능한 원자 규모 카고메 밴드 구조를 제안했다는 점에서 매우 큰 잠재력을 가집니다.", "unresolved": "이론적으로 예측된 위상 상들이 실제 합성된 단결정 샘플에서 실험적으로 구현되는지, 특히 26 meV의 에너지 갭이 실제로 관측되는지는 미지수입니다.", "future_work": "해당 물질의 단결정 성장 및 ARPES를 통한 밴드 구조 확인, 저온 수송 측정을 통한 분수 양자 홀 상태의 실험적 검증이 필수적입니다.", "concepts": [{"term": "분수 첸 절연체(Fractional Chern Insulator)", "why_emerged": "분수 양자 홀 효과의 물리학을 자기장 없이 결정 격자 시스템에서 실현하기 위해 필요했습니다.", "origin": "Neupert et al. (2011) 등에 의해 이론적으로 처음 제안되었습니다.", "connections": "분수 양자 홀 효과, 위상 평탄 밴드, 모아레 초격자와 연결됩니다."}, {"term": "카고메 격자(Kagome Lattice)", "why_emerged": "격자 구조 자체에서 발생하는 기하학적 좌절(frustration)과 위상학적 평탄 밴드로 인해 강상관 전자계 연구의 최전선이 되었습니다.", "origin": "이름은 바구니를 짜는 일본 전통 공예에서 유래했으며, 1950년대에 자성 연구에서 처음 학술적으로 주목받았습니다.", "connections": "AV3Sb5, 디랙 반금속, 초전도체, 자기 위상 상태와 연결됩니다."}], "english_summary": ["Identified A2T3X4 van der Waals kagome materials as candidates for high-temperature fractional Chern insulators.", "Computational models predict intrinsic topological flat bands with strong Coulomb interactions.", "Calculations suggest potential for fractional composite Fermi liquids and charge-ordered phases.", "Offers a scalable platform for exploring fractionalized topological states beyond moiré systems."]}}, {"title": "Time-Reversal Symmetry Breaking in the Centrosymmetric Nonsymmorphic Superconductor RuB2", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2610.26264", "authors": "Ritu Gupta, Reena, Dibyendu Samanta, et al.", "last_authors": "Sudeep Kumar Ghosh, Yogesh Singh", "summary": "Centrosymmetric nonsymmorphic AB2 (A = Ru, Os) borides exhibit anomalous superconducting properties, but the microscopic nature of their superconducting ground state remains unresolved. Here, we investigate RuB2 using zero- and transverse-field muon spin relaxation (muSR), first-principles electronic-structure calculations, and Ginzburg-Landau symmetry analysis. Zero-field muSR reveals spontaneous internal magnetic fields below Tc = 1.6 K, providing direct evidence for time-reversal symmetry breaking (TRSB). Transverse-field measurements establish a fully gapped superconducting state, with a gap magnitude close to the BCS weak-coupling limit. Density-functional calculations show that RuB2 is a multiband Z2 topological metal with appreciable spin-orbit coupling. Guided by the experimental observations and the symmetry of the orthorhombic crystal structure, our Ginzburg-Landau analysis suggests that an internally antisymmetric, nonunitary spin-triplet state is a promising candidate for the superconducting order parameter. This candidate is consistent with both the observed TRSB and the fully gapped superconducting state. These results establish RuB2 as a promising platform for investigating unconventional superconductivity arising from the interplay of crystal symmetry, multiband electronic structure, and spin-orbit coupling, and motivate further studies of related nonsymmorphic borides. The two muSR measurements provide complementary constraints: zero-field data probe spontaneous magnetism associated with TRSB, while transverse-field data characterize superconducting field distribution and support a full gap. The topological electronic structure and spin-orbit coupling provide context for unconventional pairing. Although these results do not uniquely determine the order parameter, they narrow candidates and highlight that nonsymmorphic symmetry may shape superconductivity in RuB2.", "tier": "B_IMPORTANT_CONDMAT", "score": "9", "reason": "muSR evidence of TRSB in a topological superconductor; very direct relevance to user interests.", "tags": ["experiment", "RuB2", "TRSB"], "image": "https://arxiv.org/html/2610.26264v1/60GRuB2newCopy.png", "briefing": {"background": "시간 반전 대칭 깨짐(TRSB)은 초전도 상태에서 자발적 자기 모멘트가 발생하는 현상으로, 이는 대개 비전통적(unconventional) 초전도성의 강력한 증거로 간주됩니다.", "motivation": "중심대칭을 가진 비공간군(Nonsymmorphic) RuB2 물질에서 나타나는 초전도성의 미시적 기원을 규명하고 TRSB 여부를 확인하고자 합니다.", "result": "뮤온 스핀 완화(muSR) 실험을 통해 초전도 전이 온도 아래에서 자발적 내부 자기장이 발생함을 확인하여 TRSB를 증명하였고, 갭 구조가 등방성(full gap)임을 밝혔습니다.", "implication": "RuB2는 대칭성과 스핀 궤도 결합이 얽혀있는 비전통적 초전도체 연구의 새로운 후보군이 되며, 특히 비공간군 대칭성이 초전도 상태에 미치는 영향을 탐구할 수 있습니다.", "novelty": "RuB2와 같은 특정 화합물에서 TRSB와 완전한 갭(full gap)이라는 두 가지 상충되어 보이는 특성을 동시에 관측하고, 이를 대칭성 분석으로 이론화했다는 점이 독창적입니다.", "unresolved": "정확한 초전도 오더 파라미터의 형태는 아직 확정되지 않았으며, 스핀 삼중항(triplet) 상태인지에 대한 결정적 증거는 추가 연구가 필요합니다.", "future_work": "조셉슨 접합 실험이나 특정 방향에 민감한 터널링 실험을 통한 위상적 특징 확인, NMR을 통한 스핀 감수성 연구가 필요합니다.", "concepts": [{"term": "시간 반전 대칭 깨짐(TRSB)", "why_emerged": "일반적인 s-파 초전도체가 아닌 비전통적 초전도체에서 초전도 상태와 자기적 정렬이 공존하거나, 초전도 질서 변수 자체가 자기적 성질을 띨 때 필요하게 되었습니다.", "origin": "초기에는 Sr2RuO4와 같은 물질에서 집중적으로 연구되었습니다.", "connections": "위상 초전도체, 마요라나 페르미온, 스핀 삼중항 초전도성과 연결됩니다."}, {"term": "비공간군(Nonsymmorphic)", "why_emerged": "결정 구조에서 glide plane이나 screw axis와 같은 연산이
