<title>Daily Paper Slideshow</title>
<style>
  :root {
    color-scheme: light;
    --bg: #f6f7f4;
    --paper: #ffffff;
    --ink: #111827;
    --muted: #64748b;
    --line: #d8ddd2;
    --accent: #176b87;
    --accent-2: #9a3412;
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; overflow: auto; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: var(--bg); color: var(--ink); }
  .shell { max-width: 1500px; min-height: 100vh; margin: 0 auto; padding: 14px 18px; display: flex; flex-direction: column; }
  .topbar { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 16px; }
  .top-actions { display: flex; align-items: center; gap: 10px; }
  .topbar a, button { border: 1px solid var(--line); border-radius: 8px; background: var(--paper); color: var(--ink); padding: 10px 14px; font-weight: 700; text-decoration: none; cursor: pointer; }
  button.primary { background: var(--accent); border-color: var(--accent); color: white; }
  button:disabled { opacity: 0.45; cursor: not-allowed; }
  .counter { color: var(--muted); font-weight: 700; }
  .slide { min-height: calc(100vh - 82px); background: var(--paper); border: 1px solid var(--line); border-radius: 10px; padding: 18px; box-shadow: 0 18px 42px rgba(15, 23, 42, 0.10); display: grid; grid-template-columns: minmax(310px, 0.86fr) minmax(0, 1.55fr); gap: 18px; overflow: visible; }
  .paper-head { min-width: 0; min-height: 0; overflow: visible; display: flex; flex-direction: column; gap: 12px; }
  .figure { margin: 0; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: #f8fafc; }
  .figure img { display: block; width: 100%; max-height: 41vh; object-fit: contain; background: white; }
  .figure figcaption { padding: 7px 10px; color: var(--muted); font-size: 12px; line-height: 1.3; }
  .head-text { display: flex; flex-direction: column; gap: 9px; min-width: 0; }
  .badges { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .badge { border-radius: 999px; padding: 5px 9px; background: #eef2ff; color: #3730a3; font-size: 12px; font-weight: 800; }
  .score { background: #fee2e2; color: #991b1b; }
  h1 { margin: 0; font-size: 25px; line-height: 1.15; letter-spacing: 0; overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
  h1 a { color: inherit; text-decoration-color: rgba(23, 107, 135, 0.35); text-decoration-thickness: 2px; text-underline-offset: 4px; }
  h1 a:hover { color: var(--accent); text-decoration-color: var(--accent); }
  .meta, .authors, .why, .abstract { font-size: 13px; line-height: 1.45; }
  .meta, .authors { color: var(--muted); }
  .why strong, .abstract strong, .authors strong { color: var(--ink); }
  .authors { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .why { border-left: 4px solid var(--accent-2); padding-left: 10px; color: #374151; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .abstract { border-top: 1px solid var(--line); padding-top: 14px; color: #374151; }
  .original-abstract { border-top: 1px solid var(--line); padding-top: 10px; color: #374151; font-size: 11.5px; line-height: 1.35; overflow-wrap: anywhere; }
  .original-abstract strong { display: block; margin-bottom: 4px; color: var(--ink); }
  .tags { display: flex; flex-wrap: wrap; gap: 8px; }
  .tag { border-radius: 999px; padding: 4px 8px; background: #f1f5f9; color: #475569; font-size: 12px; font-weight: 700; }
  .head-text > .link { display: none; }
  .briefing { min-width: 0; min-height: 0; overflow: visible; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); grid-auto-rows: minmax(0, auto); align-content: start; gap: 11px 18px; border-top: 0; padding-top: 0; }
  .brief-section { min-width: 0; }
  .brief-section.wide { grid-column: 1 / -1; }
  .brief-section h2 { margin: 0 0 4px; font-size: 14px; line-height: 1.22; color: #0f766e; letter-spacing: 0; }
  .brief-section p, .brief-section li { margin: 0; font-size: 12.5px; line-height: 1.42; color: #1f2937; overflow-wrap: anywhere; }
  .brief-section ul { margin: 0; padding-left: 20px; }
  .concepts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 9px 14px; }
  .concept { border-top: 1px solid var(--line); padding-top: 7px; }
  .concept h3 { margin: 0 0 4px; font-size: 13px; color: #7c2d12; letter-spacing: 0; }
  .concept p { margin: 2px 0 0; font-size: 11.5px; line-height: 1.35; color: #374151; overflow-wrap: anywhere; }
  .concept b { color: #111827; }
  .link { color: var(--accent); font-weight: 800; text-decoration: none; }
  .empty { padding: 48px; background: var(--paper); border: 1px solid var(--line); border-radius: 12px; color: var(--muted); }
  @media (max-width: 860px) {
    .shell { padding: 14px; }
    .topbar, .top-actions { align-items: stretch; flex-direction: column; }
    .slide, .briefing, .concepts { grid-template-columns: 1fr; }
    .slide { min-height: auto; overflow: visible; display: grid; }
    h1 { font-size: 28px; }
  }
</style>

<script>
const slides = [{"title": "Superconducting state with broken time-reversal symmetry and collective modes in the kagome superconductors AV3Sb5 (A=K, Cs, Rb)", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/sk88-7gky", "authors": "Xinloong Han, Jun Zhan, Jiangping Hu, Fu-chun Zhang, Xianxin Wu", "last_authors": "Fu-chun Zhang, Xianxin Wu", "summary": "Author(s): Xinloong Han, Jun Zhan, Jiangping Hu, Fu-chun Zhang, and Xianxin Wu We comprehensively study the unconventional pairing and collective modes in the multiband kagome superconductors $A{\\mathrm{V}}_{3}{\\mathrm{Sb}}_{5}$ ($A=\\mathrm{K},\\mathrm{Cs},\\mathrm{Rb}$). By solving gap equations at zero temperature, we identify a transition from normal $(s++/s±)$-wave pairing t… [Phys. Rev. B 114, 024503] Published Wed Jul 01, 2026", "tier": "A_MUST_READ", "score": "10", "reason": "Directly relevant to TRSB and superconductivity in AV3Sb5 kagome superconductors.", "tags": ["material", "kagome", "superconductivity"], "image": "", "briefing": {"background": "AV3Sb5 (A=K, Cs, Rb) kagome 금속은 전하 밀도 파(CDW)와 함께 나타나는 시간 역전 대칭성 깨짐(TRSB) 및 비전통적 초전도성으로 인해 응집물질물리학에서 매우 뜨거운 연구 주제입니다.", "motivation": "이 논문은 AV3Sb5 화합물의 다중 밴드 전자 구조에서 나타나는 비전통적 페어링 대칭성과 그에 수반되는 집단 모드(collective modes)의 성질을 이론적으로 규명하고자 합니다.", "result": "연구진은 갭 방정식을 풀어 일반적인 s-wave 상태에서 TRSB가 발생하는 비전통적 초전도 상태로의 전이를 확인했으며, 관련 집단 모드의 존재를 제시했습니다.", "implication": "이론적 예측이 맞다면, TRSB를 동반하는 이 화합물의 초전도성은 기존의 BCS 이론을 넘어선 위상 초전도체나 자성 초전도체 연구의 새로운 플랫폼이 될 수 있습니다.", "novelty": "독자의 주요 관심사인 AV3Sb5에서의 TRSB 기원과 초전도성 메커니즘을 다밴드 모델 관점에서 체계적으로 분석했다는 점이 핵심입니다.", "unresolved": "이론적 모델에서의 예측이 실제 실험적 측정(예: μSR, RIXS 등)에서 관측된 TRSB 신호와 정확히 일치하는지, 그리고 어떤 페어링 대칭성이 지배적인지는 여전히 논쟁의 여지가 있습니다.", "future_work": "제안된 집단 모드를 실험적으로 검증하기 위한 분광학적 연구(예: 라만 산란 또는 광학 분광법)와 도핑에 따른 상전이의 상세한 비교가 필요합니다.", "concepts": [{"term": "TRSB (Time-Reversal Symmetry Breaking)", "why_emerged": "물질 내 자성이나 복잡한 전자기적 질서가 존재할 때 나타나는 비전통적 상태를 설명하기 위해 필요함.", "origin": "Landau와 고전적 대칭성 이론에 뿌리를 두며, 현대 물성에서는 루프 전류 모델 등과 연결됨.", "connections": "위상 절연체, 자기 위상 물질, 비전통적 초전도체와 밀접."}, {"term": "Kagome superconductor", "why_emerged": "카고메 격자의 기하학적 좌절(frustration)이 평탄 밴드(flat band)와 van Hove 특이점을 유도하여 강상관 현상을 일으키기 때문.", "origin": "기하학적 격자 연구에서 유래하여 최근 AV3Sb5에서 실험적으로 구현됨.", "connections": "반강자성, 양자 스핀 액체, 위상 밴드 구조와 연결됨."}], "english_summary": ["We theoretically investigate unconventional superconducting pairing in AV3Sb5 kagome metals.", "The study identifies a transition from standard pairing to a time-reversal symmetry breaking (TRSB) state.", "Collective modes associated with this superconducting state are calculated.", "The results provide insights into the mysterious interplay between magnetism and superconductivity in kagome lattices."]}}, {"title": "Direct Visualization of Gate-Tunable Flat Bands in Twisted Double Bilayer Graphene", "journal": "PRL_Recent", "source": "author whitelist", "link": "http://link.aps.org/doi/10.1103/3vg5-vkzy", "authors": "Souvik Sasmal, Ryan Muzzio, Ahmed Khalifa, et al.", "last_authors": "Shubhayu Chatterjee, Jyoti Katoch", "summary": "Author(s): Souvik Sasmal, Ryan Muzzio, Ahmed Khalifa, Paulina Majchrzak, Alfred J. H. Jones, I-Hsuan Kao, Kenji Watanabe, Takashi Taniguchi, Simranjeet Singh, Eli Rotenberg, Aaron Bostwick, Chris Jozwiak, Søren Ulstrup, Shubhayu Chatterjee, and Jyoti Katoch The evolution of moiré minibands under varying carrier density and displacement field may be directly visualized using microfocused angle-resolved photoemission spectroscopy. [Phys. Rev. Lett. 137, 016402] Published Tue Jun 30, 2026", "tier": "A_MUST_READ", "score": "10", "reason": "author whitelist: Eli Rotenberg", "tags": ["angle-resolvedphotoemission", "photoemission", "graphene", "moir", "twisted", "flatband"], "image": "", "briefing": {"background": "모아레 초격자 시스템은 층간 각도 조절을 통해 밴드 구조를 제어할 수 있는 플랫폼으로, 특히 비틀린 이중층 그래핀은 강상관 물리 연구의 핵심입니다.", "motivation": "이 연구는 마이크로 ARPES를 사용하여 비틀린 이중층 그래핀의 캐리어 밀도와 변위장에 따른 모아레 미니밴드의 진화를 직접 시각화하고자 합니다.", "result": "캐리어 밀도와 외부 전기장(변위장)에 따라 평탄 밴드(flat bands)가 어떻게 변하는지 ARPES를 통해 직접 관측하는 데 성공했습니다.", "implication": "밴드 구조의 가변성을 실험적으로 확인함으로써, 강상관 전자 상태를 전기장으로 정밀 제어할 수 있는 소자 응용 및 물리 연구의 토대를 마련했습니다.", "novelty": "Eli Rotenberg 그룹의 고해상도 μ-ARPES 기술을 활용하여, 이론적으로만 예측되던 모아레 평탄 밴드의 미세한 구조 변화를 실시간으로 직접 확인했다는 점이 중요합니다.", "unresolved": "특정 평탄 밴드 위치에서 발생하는 전자-전자 상호작용의 구체적인 강도와 그에 따른 파생 질서(correlated order)의 형성 메커니즘은 추가 조사가 필요합니다.", "future_work": "상이한 비틀림 각도에서의 밴드 정밀 매핑과, 도핑에 따른 페르미 표면의 진화 과정을 초저온에서 관측하는 연구가 이어질 것입니다.", "concepts": [{"term": "Moiré minibands", "why_emerged": "두 층 사이의 주기성 차이로 인해 발생하는 거대 주기로 인해 에너지가 분할되어 형성됨.", "origin": "MacDonald 등(2011)의 이론적 연구 이후 비틀린 이중층 그래핀에서 실험적으로 확립됨.", "connections": "Flat band 물리, 강상관 전자계, 초전도 현상과 연결됨."}, {"term": "μ-ARPES", "why_emerged": "시료의 아주 작은 영역만을 조사하여 공간적으로 불균일한 모아레 시스템의 전자 구조를 분석하기 위해 필요함.", "origin": "초고휘도 방사광 가속기 기술의 발전으로 가능해짐.", "connections": "일반 ARPES, 나노 스케일 전자 구조 분석과 연결됨."}], "english_summary": ["Micro-focused ARPES directly visualizes the evolution of moiré minibands in twisted double bilayer graphene.", "The study maps how carrier density and displacement fields tune the electronic flat bands.", "Results confirm the high tunability of the band structure in moiré systems.", "This provides a critical experimental basis for controlling correlated electronic states."]}}, {"title": "Realization of strongly correlated 2D honeycomb boron", "journal": "Science_Advances", "source": "author whitelist", "link": "https://doi.org/10.1126/sciadv.aee3116", "authors": "Takemi Kato, Tomonori Nakamura, Kosuke Nakayama, et al.", "last_authors": "Yoshinori Okada, Takafumi Sato", "summary": "Borophene, a two-dimensional (2D) boron sheet, has recently gained considerable attention as a postgraphene material owing to its unique properties, such as intrinsic metallic character, lightest element monolayer structure, and high-frequency phonons. These features, together with its theoretically predicted high density of states, make borophene an excellent platform for investigating various quantum phenomena. However, the realization of emergent phenomena is hindered by fabrication challenges and inherently weak electronic correlations within the s and p electron system. Here, we demonstrate a strongly correlated 2D electronic state derived from a honeycomb boron lattice exposed at the surface of ternary boride LaRh 3 B 2 . Using angle-resolved photoemission spectroscopy, we uncover the extended saddle-point van Hove singularity near the Fermi level, which is linked to the substantial lattice expansion and many-body interaction. Moreover, scanning tunneling microscopy reveals the electronic nematicity, which likely originates from the saddle-point instability. Our findings open a pathway to exploring the exotic correlated phenomena in boron-based 2D systems.", "tier": "A_MUST_READ", "score": "10", "reason": "author whitelist: Takafumi Sato", "tags": ["angle-resolvedphotoemission", "photoemission", "scanningtunneling", "nematic", "graphene", "monolayer", "correlated", "phonon"], "image": "", "briefing": {"background": "붕소(Boron) 기반의 2차원 물질은 그래핀의 대안으로 주목받지만, 전자 상관관계가 약하다는 한계가 있어 새로운 소재 구현이 필요합니다.", "motivation": "LaRh3B2 표면에서 붕소 기반의 허니컴 격자를 구현하여 강한 전자 상관관계와 그로 인한 양자 현상을 탐구하고자 합니다.", "result": "허니컴 보론 격자에서 페르미 준위 근처의 van Hove 특이점과 그에 따른 전자 네마틱 질서(electronic nematicity)를 ARPES와 STM으로 관측했습니다.", "implication": "기존 보로핀의 한계를 극복하고 강상관 전자계로서의 붕소 기반 2차원 물질의 가능성을 열었으며, 이는 비전통적 초전도체 연구와 연결될 수 있습니다.", "novelty": "강상관 효과가 붕소 시스템에서 나타남을 ARPES로 직접 증명하고, 동시에 STM으로 네마틱 질서를 발견하여 전자 구조와 질서 변수 간의 관계를 규명한 점이 탁월합니다.", "unresolved": "이 네마틱 질서가 격자 불안정성과 전자 상관관계 중 무엇이 주도적으로 발생하는지에 대한 미시적 원리는 아직 명확하지 않습니다.", "future_work": "온도 변화에 따른 네마틱 상전이 측정 및 도핑을 통한 페르미 준위 근처의 물성 변화 연구가 필요합니다.", "concepts": [{"term": "van Hove singularity", "why_emerged": "밴드 구조의 상태 밀도(DOS)가 발산하는 지점으로, 상전이를 유도하는 핵심적 역할을 설명하기 위해 필요함.", "origin": "Leon Van Hove(1953)가 고체 내부의 진동 상태를 설명하기 위해 제안함.", "connections": "강상관 전자계, 초전도, 전하 밀도 파(CDW)와 연결됨."}, {"term": "Electronic Nematicity", "w st magneto-optical spectroscopy.", "Specific optical fingerprints are identified as indicators of altermagnetism.", "The study demonstrates the utility of ultrafast techniques in probing spin symmetries."]}}, {"title": "Observation of quantum vortex core fractionalization and skyrmion formation in a superconductor", "journal": "Science", "source": "author whitelist", "link": "https://doi.org/10.1126/science.ads0189", "authors": "Yu Zheng, Quanxin Hu, Xin Yu, et al.", "last_authors": "Chi-Ming Yim, Hong Ding", "summary": "Magnetic fields can penetrate a superconductor in the form of quantum vortices, which consist of a core singularity with circulating currents. London’s quantization implies that there is one core singularity per quantum of magnetic flux in single-component superconductors. In this study, we report signatures of quantum vortex core fractionalization on the potassium-terminated surface of a multiband superconductor, KFe 2 As 2 . The observed splitting of single integer–flux vortices into several fractional vortices results in a disparity between the numbers of flux quanta and vortex cores. These fractional vortices often arrange in chains, which calculations show are characterized by a ℂP 2 skyrmionic topological invariant; this constitutes a different type of topological defect: the chiral skyrmion. The disparate natures of integer and fractional vortices comprising skyrmions lead to distinct spectroscopic signatures.", "tier": "A_MUST_READ", "score": "9", "reason": "author whitelist: Hong Ding", "tags": ["superconduct", "topological"], "image": "", "briefing": {"background": "전통적인 초전도체에서 자기장은 양자화된 자속 선(flux quanta)의 형태로 침투하며, 이는 정수 배의 자속을 가진 보텍스(vortex) 코어를 형성합니다. 위상학적 물리 분야에서는 이러한 코어 구조를 이해하고 제어하는 것이 초전도 현상의 근본 메커니즘을 밝히는 데 중요합니다.", "motivation": "다중 밴드 초전도체인 KFe2As2 표면에서 단일 정수 자속이 여러 개의 분수(fractional) 보텍스로 쪼개지는 현상을 관찰하고, 이를 위상학적으로 분석하고자 함.", "result": "보텍스 코어의 분수화(fractionalization) 현상을 실험적으로 발견하였으며, 이들이 배열된 체인이 위상학적 불변량인 CP2 스카이르미온(skyrmion) 구조를 가 , Andrea Severing", "summary": "Author(s): Martin Sundermann, Joe D. Thompson, Eric D. Bauer, Chun-Fu Chang, Sheng-Huai Chen, Chang-Yang Kuo, Liu Hao Tjeng, Gertrud Zwicknagl, and Andrea Severing The nature of cerium’s 4 f electron is key to understanding the mechanism of pressure-induced quantum criticality in the heavy-fermion ferromagnet CeRh 6 Ge 4 . Combining core-level photoemission and polarized x-ray absorption spectroscopy with simulations based on the single-impurity Anderson model, the authors demonstrate here that Kondo hybridization admixes higher-lying crystal field states into a multiorbital ground state with a 4 f occupancy n f ~ 0.9, which also accounts for the dynamical spin response. The results establish the importance of Kondo hybridization and the resulting multiorbital ground state as essential components for a model of quantum criticality. [Phys. Rev. B 113, 245149] Published Mon Jun 29, 2026", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Photoemission study on quantum critical heavy-fermion material.", "tags": ["photoemission", "heavyfermion", "experiment"], "image": "", "briefing": {"background": "중페르미온 강자성체에서 나타나는 압력 유도 양자 임계 현상은 물리학의 오래된 과제입니다. 특히 세륨(Ce) 기반 물질에서 4f 전자의 국소성(locality)과 편력성(itinerancy) 사이의 경쟁은 핵심적인 이해 요소입니다.", "motivation": "CeRh6Ge4 물질에서 관측되는 양자 임계성의 기원을 규명하고, 세륨 4f 전자의 콘도 혼성(Kondo hybridization) 역할과 전자 상태를 분석하고자 합니다.", "result": "광전자 분광법(PES)과 X선 흡수 분광법(XAS)을 통해 4f 전자 점유율을 계산하고, 콘도 혼성이 결정장 상태와 결합하여 다중 궤도 기저 상태를 형성함을 증명하였습니다.", "implication": "중페르미온 양자 임계점에 대한 모델 구축 시 단순 모델을 넘어선 다중 궤도 기저 상태의 중요성을 입증했습니다.", "novelty": "핵심 실험 기법인 PES/XAS를 동원하여 양자 임계 Ce 화합물의 4f 상태를 정밀 분석했다는 점이, 귀하의 강상관계 및 전자 구조 계산 연구에 중요한 레퍼런스가 될 것입니다.", "unresolved": "동역학적 스핀 응답과 관련된 미세한 4f 전자 상관관계가 압력에 의해 변화하는 구체적인 메커니즘은 추가적인 고압 ARPES/RIXS 실험이 필요합니다.", "future_work": "다양한 압력 하에서의 RIXS 측정을 통한 스핀 및 궤도 여기(excitation)의 직접 관측.", "concepts": [{"term": "콘도 혼성", "why_emerged": "국소 자기 모멘트가 전도 전자와 상호작용하여 기저 상태를 형성하는 과정을 이해하기 위해.", "origin": "Jun Kondo(1964)", "connections": "중페르미온, 안더슨 모델(Anderson Model)."}, {"term": "양자 임계점", "why_emerged": "절대 영도에서 발생하는 상전이를 기술하기 위해.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "강상관계 물리학, 비페르미 액체."}], "english_summary": ["Studies the nature of 4f electrons in quantum critical CeRh6Ge4.", "Employs photoemission and X-ray absorption to confirm the role of Kondo hybridization.", "Reveals that multi-orbital ground states are essential for describing quantum criticality.", "Provides a foundation for modeling Ce-based ferromagnetic superconductors."]}}, {"title": "Nonthermal melting and density wave instability coupled to the lattice in La4Ni3O10", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/f1ll-pr86", "authors": "Chen Zhang, Lixing Chen, Qi-Yi Wu, et al.", "last_authors": "Jun Zhao, Jian-Qiao Meng", "summary": "Author(s): Chen Zhang, Lixing Chen, Qi-Yi Wu, Congcong Le, Xianxin Wu, Hao Liu, Bo Chen, Ying Zhou, Zhong-Tuo Fu, Chun-Hui Lv, Zi-Jie Xu, Hai-Long Deng, Enkang Zhang, Yinghao Zhu, H. Y. Liu, Yu-Xia Duan, Jun Zhao, and Jian-Qiao Meng The recent discovery of high-temperature superconductivity in pressurized nickelates has renewed interest in the broken-symmetry states of their ambient-pressure parent phases, where a density wave (DW) order emerges and competes with superconductivity, but its microscopic origin remains unresolved.… [Phys. Rev. B 113, L241121] Published Mon Jun 29, 2026", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Density wave and correlation study in nickelates, relevant to unconventional superconductivity interests.", "tags": ["nickelate", "density-wave", "superconductivity"], "image": "", "briefing": {"background": "니켈레이트(nickelates)는 최근 고압 조건에서 초전도성이 발견되면서 쿠퍼산화물(cuprates)을 잇는 차세대 고온 초전도 물질 후보로 급부상했습니다. 상압 상에서 나타나는 밀도파(Density Wave, DW) 상태는 초전도성과 경쟁하거나 그 형성 기원을 밝히는 핵심적인 단서로 간주됩니다.", "motivation": "La4Ni3O10 상압 상에서 관측되는 밀도파 상태가 격자 왜곡과 어떻게 결합하며, 이 비열적(nonthermal) 붕괴 메커니즘이 니켈레이트의 전자 구조와 어떻게 상호작용하는지 명확히 규명하고자 e symmetry [ C 2 | | E ¯ ] connecting opposite-spin sublattices, where C 2 and E ¯ respectively represent a 180° rotation around the axis perpendicular to spins and the inversion separating opposite-spin sublattices. [Phys. Rev. B 113, L220412] Published Wed Jun 24, 2026", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Altermagnetism is directly relevant to magnetic materials and electronic structure symmetry.", "tags": ["theory", "altermagnet"], "image": "", "briefing": {"background": "알터마그네틱(altermagnet)은 기존의 강자성(ferromagnet)이나 반강자성(antiferromagnet)으로 분류되지 않는 새로운 자기적 위상으로, 결정 대칭성에 의해 스핀 분할이 일어나는 물질을 의미합니다.", "motivation": "기존에 연구된 짝수 패리티(even-parity) 알터마그네틱을 넘어, 이론적으로 홀수 패리티(odd-parity) 알터마그네틱이 존재할 수 있는 대칭성 조건을 구체적으로 규명하고자 합니다.", "result": "스핀 군 분석을 통해 홀수 패리티 알터마그네틱이 나타나기 위한 3가지 필수 대칭성 조건을 도출하였습니다.", "implication": "알터마그네틱의 분류 체계를 확장하고, 실험적으로 새로운 자기적 성질을 갖는 물질을 탐색할 수 있는 이론적 지침을 제공합니다.", "novelty": "자기적 위상의 위상학적 대칭성을 체계화한 연구로, 베리 곡률과 관련된 수송 현상 연구자들에게 새로운 물질 디자인 원리를 제시합니다.", "unresolved": "홀수 패리티를 명확히 입증할 수 있는 실제 물질 후보군과 그에 따른 실험적 검증 방법은 구체적으로 명시되지 않았습니다.", "future_work": "도출된 조건을 만족하는 실제 결정 구조를 가진 물질을 DFT 계산 등을 통해 예측하고 실험적으로 확인하는 과정이 기대됩니다.", "concepts": [{"term": "알터마그네틱 (Altermagnetism)", "why_emerged": "반강자성체이면서도 강자성과 같은 스핀 분할(Spin splitting)을 보이는 물리적 현상을 설명하기 위해 제안됨", "origin": "Šmejkal et al.(2022) 등 최근 확립됨", "connections": "Berry curvature, anomalous Hall effect, spintronics"}, {"term": "스핀 군 (Spin Group)", "why_emerged": "자기 구조를 기술할 때 일반적인 결정 대칭성 그룹(Magnetic space group)보다 정교한 대칭성 분류가 필요했음", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "Symmetry analysis, band topology"}], "english_summary": ["Elucidates the theoretical criteria for odd-parity altermagnetism.", "Uses spin-group analysis to define necessary symmetry breaking.", "Extends the classification of unconventional magnetic phases.", "Provides a framework for identifying new altermagnetic materials."]}}, {"title": "Quasiparticle interference in LiFeAs: Signature of inelastic tunneling throu gnetic order adds a new entry to the family of iron chalcogenides.", "The result suggests complex interactions between electronic correlations and low-dimensional magnetic order."]}}, {"title": "Landau Theory for Pair Density Modulation in Fe(Te,Se) Flakes", "journal": "PRL_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/n7xg-dbfz", "authors": "Po-Jui Chen, Piers Coleman", "last_authors": "Po-Jui Chen, Piers Coleman", "summary": "Author(s): Po-Jui Chen and Piers Coleman Motivated by recent scanning tunneling microscopy (STM) experiments reporting a pair-density modulation (PDM) in flakes of ${\\mathrm{FeTe}}_{0.55}{\\mathrm{Se}}_{0.45}$, we develop a Landau theory to elucidate its physical origin. We analyze the PDM in terms of screw and glide symmetries, interpretin… [Phys. Rev. Lett. 137, 016501] Published Mon Jun 29, 2026", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Explains STM observables in iron-based superconductors; high relevance for electronic structure and spectroscopy.", "tags": ["theory", "FeTeSe", "superconductivity"], "image": "", "briefing": {"background": "철 기반 초전도체(FeSC)에서 초전도 질서 변수(order parameter)가 공간적으로 변조되는 현상은 강한 전자 상관관계와 격자 대칭성 사이의 상호작용을 이해하는 핵심입니다.", "motivation": "Fe(Te,Se) 박막에서 관찰된 쌍 밀도 변조(PDM)의 미시적 기원을 랜다우 이론을 통해 체계적으로 설명하고자 했습니다.", "result": "나선(screw) 및 미끄럼(glide) 대칭성을 바탕으로 PDM의 발생 기전을 이론적으로 규명했습니다.", "implication": "초전도체 내의 국소적인 질서 변수 변조가 결정 구조의 대칭성과 어떻게 결합하는지에 대한 새로운 물리적 그림을 제시합니다.", "novelty": "STM으로 관찰된 복잡한 패턴을 표준적인 랜다우 이론 프레임워크로 해석하여 실험 데이터의 타당성을 높였습니다.", "unresolved": "이 변조가 발생하는 정확한 에너지는 무엇인지, 다른 초전도 화합물에서도 보편적으로 나타나는지는 불분명합니다.", "future_work": "다른 철 기반 초전도 물질에서의 PDM 관찰 및 이 이론의 정량적 예측 검증이 필요합니다.", "concepts": [{"term": "Pair Density Modulation (PDM)", "why_emerged": "초전도 질서 변수가 공간적으로 균일하지 않고 주기적으로 변하는 상태를 기술하기 위해 필요.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "FFLO 상태, 복합 질서 변수(competing order)."}, {"term": "Landau Theory", "why_emerged": "대칭성 파괴를 바탕으로 상전이 근처의 물리량을 기술하기 위해.", "origin": "Le th spin currents have attracted considerable interest. However, orbital currents must first be converted into spin currents to interact with the static magnetization dominated by spin angular momentum in conventional magnets. By using a magnet dominated by orbital angular momentum (OAM), we demonstrate a 70-fold enhancement in orbital Hall magnetoresistance in cobalt II oxide/copper (CoO/Cu*), compared with spin Hall magnetoresistance in cobalt II oxide/platinum (CoO/Pt). This arises from interactions between dynamic OAM from surface-oxidized Cu* and static OAM in the antiferromagnetic insulator CoO. Our results show how by using OAM-dominated materials, we can harness the benefits of giant orbital currents that have not been possible using conventional spin-dominated magnets.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Discovery of giant orbital Hall magnetoresistance, highly relevant to transport and orbital physics interests.", "tags": ["magnetotransport", "CoO", "orbital-hall-effect"], "image": "", "briefing": {"background": "스핀 전류는 자기 소자의 핵심 요소이지만, 최근에는 스핀보다 훨씬 큰 효과를 낼 수 있는 궤도 각운동량(OAM) 전류를 활용한 '스핀트로닉스'를 넘어선 '궤도트로닉스'가 주목받고 있습니다.", "motivation": "정적 자기 모멘트가 아닌 궤도 각운동량이 지배적인 반강자성체 CoO에서 궤도 홀 자기저항(OHMR)이 스핀 홀 효과보다 더 효율적일 수 있는지 확인하고자 합니다.", "result": "CoO/Cu 계면에서 70배 증폭된 궤도 홀 자기저항을 관측했으며, 이는 CoO 내의 정적 궤도 각운동량과 Cu의 동적 궤도 각운동량의 상호작용에 기인함을 밝혔습니다.", "implication": "스핀 각운동량 기반 장치를 대체하거나 보완할 수 있는 궤도 기반 초고효율 자기 소자 개발의 가능성을 열었습니다.", "novelty": "궤도 각운동량이 지배하는 물질을 전략적으로 설계하여 기존 스핀 홀 효과를 능가하는 수송 현상을 실험적으로 입증했습니다.", "unresolved": "궤도 전류의 장거리 수송 특성 및 다양한 반강자성 재료로의 일반화 가능성에 대한 검증이 더 필요합니다.", "future_work": "궤도 홀 효과의 스위칭 효율 최적화 및 상온에서의 궤도 기반 자기 메모리 소자 시연.", "concepts": [{"term": "궤도 홀 자기저항(OHMR)", "why_emerged": "스핀 전류와 유사하게 궤도 각운동량 흐름이 물질 내에서 저항 변화를 일으키는 현상을 측정하기 위해 정의됨.", "origin": "최근 궤도트로닉스 연구 분야에서 제안됨.", "connections": "스핀 홀 효과, 자기저항."}, {"term": "궤도 각운동량(OAM)", "why_emerged": "전자 스핀 외에 전자의 궤도 운동에서 비롯된 자기적 성질을 분리하여 활용하기 위해 중요해짐.", "origin": "원자 물리학의 기본 개념이나 고체 내에서는 최근 주목받음.", "connections": "스핀-궤도 결합, 베리 곡률."}], "english_summary": ["Demonstrated 70-fold enhancement of orbital Hall magnetoresistance in CoO/Cu structures.", "Exploited OAM-dominated magnetism in CoO instead of spin-dominated magnets.", "Highlights the potential of orbital currents for ultra-efficient spintronic devices.", "Proves interaction between dynamic and static OAM is highly effective for magnetotransport."]}}, {"title": "Superconducting phase diagram of multilayer square-planar nickelates", "journal": "Science", "source": "Gemini", "link": "https://doi.org/10.1126/science.adp4440", "authors": "Grace A. Pan, Dan Ferenc Segedin, Sophia F. R. TenHuisen, et al.", "last_authors": "Berit H. Goodge, Julia A. Mundy", "summary": "The discovery of superconductivity in square-planar nickelates has offered a rich materials platform to explore the origins of high-temperature superconductivity. However, experimental investigations have largely been limited to the infinite-layer R NiO 2 ( R , rare earth) nickelates. We constructed a phase diagram of multilayer square-planar Nd n +1 Ni n O 2 n +2 compounds and found signatures of superconductivity for dimensionality n = 4 to 8. Upon decreasing n , the superconducting anisotropy evolves owing to 4 f electron effects, and electronic structure characteristics approach cuprate-like behavior. Magnetic fluctuations persist from within the superconducting regime and into the overdoped, nonsuperconducting regime. The superconducting regime overlaps with that of chemically doped infinite-layer nickelates, demonstrating underlying commonalities as well as differences across varying structural realizations of square-planar nickelates. Our work establishes this layered template for creating new nickel-based superconductors.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "High-impact experimental phase diagram of nickelate superconductors, directly listed in user's profile interest.", "tags": ["superconductivity", "nickelates", "electronic-structure"], "image": "", "briefing": {"background": "구리 기반 초전도체(cuprates)의 고온 초전도 메커니즘을 이해하기 위해, 결정 구조가 유사한 니켈 기반 산화물(nickelates)의 전자 구조 및 초전도 기원을 탐색하는 연구가 활발합니다.", "motivation": "기존 연구가 주로 무한층(infinite-layer) RNiO2에 국한되어 있었기에, 다층(multilayer) 구조를 가진 Ndn+1NinO2n+2 화합물에서의 초전도성 발현 가능성과 그 물리적 특성을 규명하고자 했습니다.", "result": "n=4에서 8 사이의 다층 니켈 산화물에서 초전도성 신호를 확인했습니다. 층수가 줄어들수록 4f 전자 효과로 인해 이방성이 진화하며, 전자 구조는 점차 cuprates와 유사한 특성을 보입니다.", "implication": "다층 니켈 산화물이 고온 초전도 연구를 위한 새로운 플랫폼이 될 수 있음을 입증했으며, 무한층 구조와 다층 구조 간의 초전도성 공통점을 제시했습니다.", "novelty": "다층 니켈 산화물의 체계적인 위상 도표를 제시함으로써, 기존 무한층 니켈산염에 국한되었던 연구 범위를 확장했습니다. 특히 귀하가 관심을 가지는 electronic structure와 cuprate-like physics와의 연결고리를 잘 보여줍니다.", "unresolved": "이 다층 화합물에서 관찰된 자기적 요동이 구체적으로 초전도 메커니즘과 어떤 상관관계를 갖는지에 대한 이론적 규명은 미완성입니다.", "future_work": "초전도 이방성의 미세한 기원 조사와, 니켈 기반 초전도체의 도핑 수준에 따른 스핀 요동의 상세 거동에 대한 추가 연구가 기대됩니다.", "concepts": [{"term": "Infinite-layer nickelates", "why_emerged": "Cuprate의 CuO2 평면과 유사한 NiO2 평면을 구현하여 초전도성을 유도하기 위해 고안됨.", "origin": "2019년 Li, Norman, Hwang 등(Nature).", "connections": "Cuprate 고온 초전도체, 2D 전자 구조, 강상관 전자계."}, {"term": "4f electron effects", "why_emerged": "희토류 원소의 4f 전자가 전도 대역의 전자 구조 및 자기적 성질에 미치는 영향을 이해하기 위해 필요.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "중희토류 화합물, Kondo 격자, 자성 이방성."}], "english_summary": ["Explored multilayer square-planar nickelates (Ndn+1NinO2n+2) for superconductivity.", "Identified superconductivity in compounds with n=4 to 8, showing evolving anisotropy.", "Electronic structure approaches cuprate-like behavior as dimensionality decreases.", "Magnetic fluctuations persist across the superconducting and overdoped regimes.", "Establishes a new layered template for nickel-based high-Tc exploration."]}}, {"title": "Plaid-Like Spin Splitting and Chirality of Magnon Bands in Antiferromagnetic MnTe2", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2607.02114", "authors": "Dirk Wulferding, Daehyeon An, Jiwon Choi, et al.", "last_authors": "Se Kwon Kim, Kwang-Yong Choi", "summary": "arXiv:2607.02114v1 Announce Type: new Abstract: Altermagnets constitute an emerging class of magnetic materials that combine compensated antiferromagnetic order with spin-split excitations arising from crystalline symmetries. Despite strong theoretical interest, their experimental identification remains challenging. Here, we demonstrate that helicity- and angle-resolved Raman scattering measurements reveal reduced rotational symmetries of magnons and a pronounced imbalance between left- and right-circular polarization channels, indicating momentum-dependent magnon handedness. First-principles DFT+$U$ calculations combined with linear spin-wave theory uncover a characteristic plaid-like spin-splitting structure in momentum space. The resulting magnon spin textures are dictated by the unconventional sublattice symmetries of MnTe$_2$ and closely emulate those of altermagnetic electronic bands. Our work provides evidence of chiral spin-wave excitations unique to this non-coplanar antiferromagnet.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Raman and DFT study of altermagnetic spin-splitting in MnTe2, identifying unique chiral magnon excitations.", "tags": ["Raman", "altermagnet", "MnTe2"], "image": "https://arxiv.org/html/2607.02114v1/x1.png", "briefing": {"background": "반강자성 물질에서 스핀-궤도 결합(SOC) 없이도 자성 대역의 스핀 분할이 일어나는 'Altermagnetism'이라는 새로운 자기 상의 실험적 검증이 중요해졌습니다.", "motivation": "반강자성 물질 MnTe2에서 이론적으로 예측된 알터자기적 스핀 분할 및 그로 인한 마그논 밴드의 위상적 특징을 실험적으로 확인하고자 했습니다.", "result": "라만 산란 측정을 통해 마그논 밴드의 회전 대칭성 감소와 원편광 이색성을 발견했습니다. 이는 운동량에 따른 마그논의 handedness와 'Plaid-like' 스핀 분할 구조를 강력하게 시사합니다.", "implication": "알터자기 시스템에서 전자 밴드뿐만 아니라 스핀파(마그논) 역시 알터자기적 대칭성 파괴를 보임을 확인하여, 차세대 스핀트로닉스 재료로서의 가능성을 열었습니다.", "novelty": "MnTe2와 같은 비공면(non-coplanar) 반강자성체에서 라만 산란을 이용해 마그논의 chiral한 성질을 실험적으로 포착했다는 점이 독창적입니다.", "unresolved": "이러한 마그논의 handedness가 수송 현상에 미치는 구체적인 영향이나 외부 자장에 의한 동역학적 제어 방법은 과제로 남아있습니다.", "future_work": "다른 반강자성체에서의 알터자기적 마그논 특성 확인 및 자성 도메인 제어 실험이 예상됩니다.", "concepts": [{"term": "Altermagnetism", "why_emerged": "기존의 강자성(순자화) 또는 통상적인 반강자성(스핀 분할 없음)으로 분류되지 않는, 스핀 분할을 동반하는 새로운 반강자성 상태의 필요성.", "origin": "최근 2-3년 내 이론적으로 급부상(예: Libor Smejkal 등).", "connections": "반강자성, 스핀트로닉스, 비상대론적 스핀 분할."}, {"term": "Magnon chirality", "why_emerged": "마그논이 가지는 각운동량과 그에 따른 위상적 성질을 이해하기 위해.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "스핀-격자 결합, 위상 자성체, 비상반 수송 현상."}], "english_summary": ["Investigated MnTe2 using Raman scattering to probe altermagnetic magnon bands.", "Observed reduced rotational symmetry and chiral magnon responses.", "Calculations reveal a plaid-like momentum-space spin splitting of magnons.", "Confirmed that magnons in MnTe2 emulate altermagnetic electronic band textures.", "Provides experimental evidence for chiral spin-wave excitations in non-coplanar antiferromagnets."]}}, {"title": "Unconventional Mixed-Parity Magnetism in Rare-Earth Tetraborides", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2607.02117", "authors": "Dong-Choon Ryu, Jae-Ho Han, Bongjae Kim, Chang-Jong Kang", "last_authors": "Bongjae Kim, Chang-Jong Kang", "summary": "arXiv:2607.02117v1 Announce Type: new Abstract: Altermagnetism has advanced the study of compensated magnets by revealing non-relativistic spin splitting, traditionally classified into strictly even- or odd-parity spin textures. Here, we unveil a fundamentally different regime: component-resolved mixed-parity spin splitting in a fully three-dimensional compensated magnet. Using first-principles calculations, tight-binding and $\\mathbf{k} \\cdot \\mathbf{p}$ models, along with spin-group symmetry analysis, we demonstrate that the non-coplanar ground state of $\\mathrm{TbB}_4$ enforces a unique momentum-space spin texture. The in-plane spin components exhibit odd-parity $p$- and $f$-wave-like textures, whereas the out-of-plane component retains an even-parity $d$-wave altermagnetic character. Cruciall agnetic Heisenberg model is a promising candidate for realizing a quantum spin-liquid ground state; however, the nature of its excitation spectrum remains controversial, particularly for the presence of a spin gap and the gauge structure coupled to fractional quasiparticles. To address these issues, parton approaches have been extensively employed in theoretical studies, where spin operators are represented in terms of either fermionic or bosonic quasiparticles; the former approach is known as the Abrikosov fermion method, while the latter is referred to as the Schwinger boson method. Thus far, these approaches have been pursued independently, and it has remained unclear how the results obtained from these two different frameworks compare with each other, particularly with respect to the spin dynamics and gauge structure of the kagome antiferromagnet. Here, we investigate the dynamical spin structure factor of the antiferromagnetic Heisenberg model with a Dzyaloshinskii-Moriya interaction on a kagome lattice, which is relevant to the material herbertsmithite, by employing both the Abrikosov fermion and Schwinger boson approaches. We find that the dynamical spin structure factor obtained from the Abrikosov fermion mean-field theory exhibits dome-shaped features, and that its continuum structure significantly depends on the gauge structure of the spin-liquid ansatz. On the other hand, the Schwinger boson mean-field theory yields a concave-down structure in the low-energy region of the dynamical spin structure factor, which is distinct from that obtained using the Abrikosov fermion approach. Moreover, the low-energy gap is substantially reduced, and the low-energy spectral weight is enhanced, by incorporating many-body effects beyond the mean-field approximation, which is consistent with experimental observations. Our results suggest the importance of many-body effects in the Schwinger boson theory for capturing the low-energy spin dynamics of kagome antiferromagnets." e synthesis of a Sr0.75ClNbS2 superconductor that achieves unidirectional, parallel AA stacking-a configuration never before realized in a bulk crystal. Unlike conventional intercalation, which merely expands the interlayer spacing, our approach employs a planar Sr-Cl network to enforce a complete stacking reorganization, driving all NbS2 layers from the native antiparallel AB stacking into a unidirectional, parallel AA arrangement. This stacking switch globally breaks inversion symmetry, transforming centrosymmetric 2H-NbS2 into a noncentrosymmetric bulk crystal with D3h point group symmetry. Crucially, this structural design reproduces, in three dimensions, the electronic environment of an isolated monolayer, thereby preventing cancellation of the local Ising fields. As a result, strong Ising spin-orbit coupling and spin-split bands persist throughout the bulk. Transport measurements reveal extreme superconducting anisotropy ({\\gamma} ~ 77), an in-plane upper critical field (~ 10.65 T) that far exceeds the Pauli paramagnetic limit, and clean-limit superconductivity indicative of high crystalline quality. Moreover, magnetotransport uncovers a novel magnetic-field-induced anomalous metallic state characterized by finite dissipation yet a vanishing Hall response. Direct band-structure measurements corroborate the layer-decoupled, quasi-2D electronic nature of the system. This work establishes stacking-geometry engineering as a powerful strategy to artificially enforce a globally noncentrosymmetric, quasi-2D superconducting state in bulk crystals, paving the way for designing quantum materials with tunable crystalline symmetry and electronic band topology.", "tier": "C_MAYBE", "score": "8", "reason": "Experimental study of unconventional superconductivity and broken inversion symmetry in a bulk material.; tier capped to C: formal/generic theory watch", "tags": ["superconductivity", "transport", "brokensymmetry"], "image": "https://arxiv.org/static/browse/0.3.4/images       concepts.appendChild(item);
    });
    section.appendChild(concepts);
    briefing.appendChild(section);
  }
  if (b.english_summary && b.english_summary.length) { const section = document.createElement('section'); section.className = 'brief-section wide'; section.appendChild(textEl('h2', '', 'English Summary')); const ul = document.createElement('ul'); b.english_summary.slice(0, 5).forEach(line => ul.appendChild(textEl('li', '', line))); section.appendChild(ul); briefing.appendChild(section); }
  slideEl.appendChild(briefing);
  counterEl.textContent = `${index + 1} / ${slides.length}`;
  prevBtn.disabled = index === 0;
  nextBtn.disabled = index === slides.length - 1;
}
prevBtn.addEventListener('click', () => { index = Math.max(0, index - 1); render(); });
nextBtn.addEventListener('click', () => { index = Math.min(slides.length - 1, index + 1); render(); });
document.addEventListener('keydown', event => { if (event.key === 'ArrowLeft') prevBtn.click(); if (event.key === 'ArrowRight') nextBtn.click(); });
render();
</script>
</body>
</html>
