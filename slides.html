<!DOCTYPE html>
<html lang='en'>
<head>
<meta charset='UTF-8'>
<meta name='viewport' content='width=device-width, initial-scale=1.0'>
<title>Daily Paper Slideshow</title>
<style>
  :root {
    color-scheme: light;
    --bg: #f6f7f4;
    --paper: #ffffff;
    --ink: #111827;
    --muted: #64748b;
    --line: #d8ddd2;
    --accent: #176b87;
    --accent-2: #9a3412;
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; overflow: auto; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: var(--bg); color: var(--ink); }
  .shell { max-width: 1500px; min-height: 100vh; margin: 0 auto; padding: 14px 18px; display: flex; flex-direction: column; }
  .topbar { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 16px; }
  .top-actions { display: flex; align-items: center; gap: 10px; }
  .topbar a, button { border: 1px solid var(--line); border-radius: 8px; background: var(--paper); color: var(--ink); padding: 10px 14px; font-weight: 700; text-decoration: none; cursor: pointer; }
  button.primary { background: var(--accent); border-color: var(--accent); color: white; }
  button:disabled { opacity: 0.45; cursor: not-allowed; }
  .counter { color: var(--muted); font-weight: 700; }
  .slide { min-height: calc(100vh - 82px); background: var(--paper); border: 1px solid var(--line); border-radius: 10px; padding: 18px; box-shadow: 0 18px 42px rgba(15, 23, 42, 0.10); display: grid; grid-template-columns: minmax(310px, 0.86fr) minmax(0, 1.55fr); gap: 18px; overflow: visible; }
  .paper-head { min-width: 0; min-height: 0; overflow: visible; display: flex; flex-direction: column; gap: 12px; }
  .figure { margin: 0; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: #f8fafc; }
  .figure img { display: block; width: 100%; max-height: 41vh; object-fit: contain; background: white; }
  .figure figcaption { padding: 7px 10px; color: var(--muted); font-size: 12px; line-height: 1.3; }
  .head-text { display: flex; flex-direction: column; gap: 9px; min-width: 0; }
  .badges { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .badge { border-radius: 999px; padding: 5px 9px; background: #eef2ff; color: #3730a3; font-size: 12px; font-weight: 800; }
  .score { background: #fee2e2; color: #991b1b; }
  h1 { margin: 0; font-size: 25px; line-height: 1.15; letter-spacing: 0; overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
  h1 a { color: inherit; text-decoration-color: rgba(23, 107, 135, 0.35); text-decoration-thickness: 2px; text-underline-offset: 4px; }
  h1 a:hover { color: var(--accent); text-decoration-color: var(--accent); }
  .meta, .authors, .why, .abstract { font-size: 13px; line-height: 1.45; }
  .meta, .authors { color: var(--muted); }
  .why strong, .abstract strong, .authors strong { color: var(--ink); }
  .authors { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .why { border-left: 4px solid var(--accent-2); padding-left: 10px; color: #374151; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .abstract { border-top: 1px solid var(--line); padding-top: 14px; color: #374151; }
  .original-abstract { border-top: 1px solid var(--line); padding-top: 10px; color: #374151; font-size: 11.5px; line-height: 1.35; overflow-wrap: anywhere; }
  .original-abstract strong { display: block; margin-bottom: 4px; color: var(--ink); }
  .tags { display: flex; flex-wrap: wrap; gap: 8px; }
  .tag { border-radius: 999px; padding: 4px 8px; background: #f1f5f9; color: #475569; font-size: 12px; font-weight: 700; }
  .head-text > .link { display: none; }
  .briefing { min-width: 0; min-height: 0; overflow: visible; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); grid-auto-rows: minmax(0, auto); align-content: start; gap: 11px 18px; border-top: 0; padding-top: 0; }
  .brief-section { min-width: 0; }
  .brief-section.wide { grid-column: 1 / -1; }
  .brief-section h2 { margin: 0 0 4px; font-size: 14px; line-height: 1.22; color: #0f766e; letter-spacing: 0; }
  .brief-section p, .brief-section li { margin: 0; font-size: 12.5px; line-height: 1.42; color: #1f2937; overflow-wrap: anywhere; }
  .brief-section ul { margin: 0; padding-left: 20px; }
  .concepts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 9px 14px; }
  .concept { border-top: 1px solid var(--line); padding-top: 7px; }
  .concept h3 { margin: 0 0 4px; font-size: 13px; color: #7c2d12; letter-spacing: 0; }
  .concept p { margin: 2px 0 0; font-size: 11.5px; line-height: 1.35; color: #374151; overflow-wrap: anywhere; }
  .concept b { color: #111827; }
  .link { color: var(--accent); font-weight: 800; text-decoration: none; }
  .empty { padding: 48px; background: var(--paper); border: 1px solid var(--line); border-radius: 12px; color: var(--muted); }
  @media (max-width: 860px) {
    .shell { padding: 14px; }
    .topbar, .top-actions { align-items: stretch; flex-direction: column; }
    .slide, .briefing, .concepts { grid-template-columns: 1fr; }
    .slide { min-height: auto; overflow: visible; display: grid; }
    h1 { font-size: 28px; }
  }
</style>

<script>
const slides = [{"title": "Tuning the Fermi surface of MoTe2 by Nb doping", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/nqff-vzcg", "authors": "Andrew P. Weber, Iñigo Robredo, Philipp Rüßmann, et al.", "last_authors": "J. Enrique Ortega, Julen Ibañez-Azpiroz", "summary": "Ab initio calculations and angle-resolved photoemission experiments demonstrate that the bulk and surface electronic structure of Weyl semimetal candidate ${\\mathrm{MoTe}}_{2}$ changes significantly by tuning the chemical potential by less than 0.4 eV. Calculations indicate that several Lifshitz tra…", "tier": "A_MUST_READ", "score": "10", "reason": "Direct hit: ARPES and DFT study of the Fermi surface and Weyl physics in a transition metal telluride.", "tags": ["method:ARPES", "material:MoTe2", "topic:Weylsemimetal"], "image": "", "briefing": {"background": "Weyl 준금속인 MoTe2는 위상학적으로 보호받는 노드와 표면 페르미 아크를 가져 차세대 양자 소자 후보로 주목받고 있습니다. 그러나 이러한 위상적 특성을 실제 응용에 활용하려면 페르미 준위의 위치를 정밀하게 제어하여 원하는 에너지 대역의 밴드 구조를 확보하는 것이 필수적입니다.", "motivation": "본 연구는 Nb 도핑을 통해 MoTe2의 화학적 퍼텐셜을 미세하게 조정했을 때, 벌크 및 표면 전자 구조가 어떻게 변화하는지 ARPES 실험과 제일원리 계산을 통해 규명하고자 했습니다.", "result": "Nb 도핑을 통해 화학적 퍼텐셜을 0.4 eV 이내로 튜닝함으로써 여러 차례의 Lifshitz 전이를 유도할 수 있음을 확인했습니다. 도핑 농도에 따라 페르미 표면의 연결성이 극적으로 변하며, 특히 위상적 성질이 강하게 나타나는 특정 에너지 영역으로의 접근 가능성을 제시했습니다.", "implication": "적절한 Nb 도핑을 통해 MoTe2의 위상적 특성을 최적화할 수 있음을 입증함으로써, 특정 Weyl 노드의 쌍을 선택적으로 활용하거나 수송 특성을 제어하는 것이 가능해집니다.", "novelty": "실험(ARPES)과 이론(DFT)의 결합을 통해 도핑에 따른 페르미 표면 진화를 정량적으로 추적했습니다. 독자의 주요 관심사인 '반전이 대칭성이 깨진 Weyl 준금속' 및 '전자 구조 튜닝' 측면에서 매우 높은 연관성을 가집니다.", "unresolved": "도핑으로 인한 불순물 산란이 위상적 상태의 수명(lifetime)에 미치는 영향이나, 강한 자기장 하에서의 자기 수송 특성 변화에 대한 추가 연구가 필요합니다.", "future_work": "다양한 도핑 농도에서의 magneto-ARPES 측정이나 Nb 외의 다른 원소를 활용한 전자/정공 도핑 효과 비교 연구가 기대됩니다.", "concepts": [{"term": "Weyl 준금속 (Weyl Semimetal)", "why_emerged": "질량이 없는 Weyl 페르미온을 고체 물리 시스템에서 구현하기 위해 제안되었습니다.", "origin": "Hermann Weyl (이론적 기반), 2015년 TaAs에서 실험적 발견", "connections": "Dirac 준금속, 위상 절연체, 페르미 아크"}, {"term": "Lifshitz 전이 (Lifshitz Transition)", "why_emerged": "압력이나 도핑에 의해 페르미 표면의 위상적 구조가 급격히 변하는 현상을 설명하기 위해 등장했습니다.", "origin": "Ilya Lifshitz (1960)", "connections": "전자 밀도 상태(DOS) 이상, 양자 임계 현상"}, {"term": "Nb 도핑 (Nb Doping)", "why_emerged": "TMDC 물질에서 정공(hole)을 주입하여 캐리어 농도와 페르미 준위를 제어하기 위한 수단으로 널리 쓰입니다.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "MoTe2, WTe2, 반도체 도핑 공정"}], "english_summary": ["Demonstrated Fermi surface tuning in Weyl semimetal MoTe2 via Nb doping.", "Identified multiple Lifshitz transitions within a 0.4 eV chemical potential range.", "Combined ARPES and DFT to map the evolution of bulk and surface states.", "Provides a route to optimize topological properties for quantum device applications."]}}, {"title": "Cooperative concurrence of 4f and 3d flat bands in the kagome heavy-fermion metal YbCr6Ge6", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/zdzj-bln9", "authors": "Wenxin Lv (吕文欣), Pengcheng Ma (马鹏程), Tianqi Wang (王天琦), et al.", "last_authors": "Zhonghao Liu (刘中灏), Hechang Lei (雷和畅)", "summary": "Flat-band (FB) systems originating from special lattice geometry like in kagome metals as well as localized orbitals in materials such as heavy-fermion (HF) compounds have attracted intensive interest due to their band topology and strong electron correlation effects, leading to emergent quantum sta…", "tier": "A_MUST_READ", "score": "9", "reason": "Direct interest: Kagome metal flat-band physics and heavy-fermion behavior in a real material.", "tags": ["material:YbCr6Ge6", "topic:kagome", "topic:flatband"], "image": "", "briefing": {"background": "카고메 격자는 기하학적 좌절(frustration)에 의해 플랫 밴드(flat band)를 형성하며, 무거운 페르미온(heavy fermion) 시스템은 4f 전자와 전도 전자 간의 혼성화를 통해 강한 상관관계를 보입니다. 이 두 현상이 한 물질에서 만날 경우 새로운 양자 상태가 나타날 수 있습니다.", "motivation": "YbCr6Ge6라는 카고메 무거운 페르미온 금속에서 4f 궤도에 의한 플랫 밴드와 Cr 기반 카고메 격자의 3d 궤도에 의한 플랫 밴드가 어떻게 공존하고 상호작용하는지 밝히고자 했습니다.", "result": "이 물질에서 4f 전자와 3d 전자에 의한 두 종류의 플랫 밴드가 협력적으로 공존함을 확인했습니다. 이는 격자 기하학에서 기인한 위상적 특성과 f-전자의 강한 상관관계가 동시에 작용하고 있음을 의미합니다.", "implication": "단일 물질 내에서 기하학적 플랫 밴드와 상관관계에 의한 플랫 밴드를 동시에 제어할 수 있는 플랫폼을 확보하게 되었습니다. 이는 카고메 금속의 자성 및 초전도 특성 연구에 중요한 단서를 제공합니다.", "novelty": "독자의 핵심 관심사인 AV3Sb5와 같은 카고메 물질군에 무거운 페르미온 물리(4f-3d 상호작용)를 결합한 시스템이라는 점이 매우 매력적입니다. 특히 'Flat band'와 'Kagome' 키워드의 직접적인 교집합입니다.", "unresolved": "두 플랫 밴드 사이의 구체적인 산란 메커니즘이나, 극저온에서의 대칭성 붕괴(예: CDW 또는 loop current) 가능성은 아직 미지로 남아 있습니다.", "future_work": "STM/STS를 이용한 국소 전자 구조 분석이나 극저온/고자기장 하에서의 수송 특성 측정이 필요합니다.", "concepts": [{"term": "카고메 격자 (Kagome Lattice)", "why_emerged": "삼각형과 육각형이 교차하는 구조에서 발생하는 기하학적 좌절과 간섭 효과를 연구하기 위해 도입되었습니다.", "origin": "Syôzi Itô (1951)", "connections": "플랫 밴드, 프러스트레이티드 자성, AV3Sb5"}, {"term": "플랫 밴드 (Flat Band)", "why_emerged": "전자의 운동 에너지가 억제되어 전자 간 상관관계가 극대화되는 상태를 설명하기 위해 필요합니다.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "강상관 전자계, 고온 초전도, 모아레 초격자"}, {"term": "무거운 페르미온 (Heavy Fermion)", "why_emerged": "f-궤도 전자와 전도 전자의 혼성화를 통해 전자의 유효 질량이 매우 커지는 현상을 설명하기 위해 등장했습니다.", "origin": "Steglich et al. (1979) 등의 실험적 발견", "connections": "Kondo 효과, 양자 임계점, 비전통적 초전도"}], "english_summary": ["Observed the coexistence of 4f and 3d flat bands in YbCr6Ge6.", "Merges kagome lattice geometry with heavy-fermion physics.", "Identifies a cooperative effect between band topology and strong correlations.", "Establishes a new platform for studying emergent quantum states in kagome metals."]}}, {"title": "Graphene lattice recoil in hard x-ray photoemission: Experiment and theory", "journal": "PRB_Recent", "source": "keyword", "link": "http://link.aps.org/doi/10.1103/s8w3-plc1", "authors": "Simone Ritarossi, Alice Apponi, Orlando Castellano, et al.", "last_authors": "Francesco Offi, Alessandro Ruocco", "summary": "Hard-x-ray C 1 s photoemission from monolayer graphene probes a regime in which nuclear recoil and intrinsic electronic asymmetry contribute on comparable energy scales to the observed spectral line shape. Here we combine experiment and modeling over the photon-energy range 0.8 – 8 keV to resolve this interplay quantitatively. A graphene-specific implementation of the Fujikawa-Takata cumulant formalism, based on an anisotropic vibrational density of states constrained by first-principles phonon calculations, captures the expected recoil scaling with photon energy and emission geometry but fails to reproduce the pronounced asymmetric tails of the measured spectra. To overcome this limitation, we introduce an explicit electronic convolution model in which a photon-energy-independent reference response, dominated by the electronic line shape and extracted from the low-recoil 0.8 keV data through a recoil-inclusive fit, is convolved with a phonon recoil kernel carrying the full dependence on photon energy and emission angle. This approach reproduces both the measured line-shape evolution and the observed peak shifts across the explored energy range without refitting the spectra at higher photon energies. The results show that recoil in graphene cannot be described by a baseline treatment in which the phonon recoil kernel is combined only with symmetric lifetime broadening, but must be treated together with the intrinsic many-body electronic response of the C 1 s line.", "tier": "A_MUST_READ", "score": "9", "reason": "title strong match: photoemission", "tags": ["photoemission", "graphene", "monolayer"], "image": "", "briefing": {"background": "경엑스선 광전자 분광법(HAXPES)은 높은 에너지의 광자를 사용하여 물질 내부 깊숙한 곳의 전자 정보를 얻을 수 있지만, 광자의 높은 운동량 때문에 원자핵이 뒤로 밀려나는 '반동(recoil)' 현상이 발생하여 스펙트럼이 왜곡됩니다.", "motivation": "단층 그래핀의 C 1s 코어 레벨 HAXPES 측정 시 발생하는 원자핵 반동과 고유의 다체 전자 응답(asymmetry) 간의 복합적인 상호작용을 정량적으로 분리하고 이해하고자 했습니다.", "result": "단순한 반동 모델로는 그래핀의 비대칭 스펙트럼 꼬리를 설명할 수 없음을 발견했습니다. 대신, 에너지에 독립적인 전자적 비대칭 모델과 에너지/각도에 의존하는 포논 반동 커널을 결합한 새로운 컨볼루션 모델을 통해 0.8~8 keV 영역의 데이터를 완벽하게 재현했습니다.", "implication": "2차원 물질에서 광전자가 방출될 때의 다체 효과와 격자 진동(recoil)의 결합 방식을 명확히 규명함으로써, HAXPES를 이용한 2D 시스템의 정밀 분석 정확도를 높였습니다.", "novelty": "그래핀이라는 대표적인 2D 시스템에서 HAXPES의 난제 중 하나인 re
