<title>Daily Paper Slideshow</title>
<style>
  :root {
    color-scheme: light;
    --bg: #f6f7f4;
    --paper: #ffffff;
    --ink: #111827;
    --muted: #64748b;
    --line: #d8ddd2;
    --accent: #176b87;
    --accent-2: #9a3412;
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; overflow: auto; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: var(--bg); color: var(--ink); }
  .shell { max-width: 1500px; min-height: 100vh; margin: 0 auto; padding: 14px 18px; display: flex; flex-direction: column; }
  .topbar { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 16px; }
  .top-actions { display: flex; align-items: center; gap: 10px; }
  .topbar a, button { border: 1px solid var(--line); border-radius: 8px; background: var(--paper); color: var(--ink); padding: 10px 14px; font-weight: 700; text-decoration: none; cursor: pointer; }
  button.primary { background: var(--accent); border-color: var(--accent); color: white; }
  button:disabled { opacity: 0.45; cursor: not-allowed; }
  .counter { color: var(--muted); font-weight: 700; }
  .slide { min-height: calc(100vh - 82px); background: var(--paper); border: 1px solid var(--line); border-radius: 10px; padding: 18px; box-shadow: 0 18px 42px rgba(15, 23, 42, 0.10); display: grid; grid-template-columns: minmax(310px, 0.86fr) minmax(0, 1.55fr); gap: 18px; overflow: visible; }
  .paper-head { min-width: 0; min-height: 0; overflow: visible; display: flex; flex-direction: column; gap: 12px; }
  .figure { margin: 0; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: #f8fafc; }
  .figure img { display: block; width: 100%; max-height: 41vh; object-fit: contain; background: white; }
  .figure figcaption { padding: 7px 10px; color: var(--muted); font-size: 12px; line-height: 1.3; }
  .head-text { display: flex; flex-direction: column; gap: 9px; min-width: 0; }
  .badges { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .badge { border-radius: 999px; padding: 5px 9px; background: #eef2ff; color: #3730a3; font-size: 12px; font-weight: 800; }
  .score { background: #fee2e2; color: #991b1b; }
  h1 { margin: 0; font-size: 25px; line-height: 1.15; letter-spacing: 0; overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
  h1 a { color: inherit; text-decoration-color: rgba(23, 107, 135, 0.35); text-decoration-thickness: 2px; text-underline-offset: 4px; }
  h1 a:hover { color: var(--accent); text-decoration-color: var(--accent); }
  .meta, .authors, .why, .abstract { font-size: 13px; line-height: 1.45; }
  .meta, .authors { color: var(--muted); }
  .why strong, .abstract strong, .authors strong { color: var(--ink); }
  .authors { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .why { border-left: 4px solid var(--accent-2); padding-left: 10px; color: #374151; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .abstract { border-top: 1px solid var(--line); padding-top: 14px; color: #374151; }
  .original-abstract { border-top: 1px solid var(--line); padding-top: 10px; color: #374151; font-size: 11.5px; line-height: 1.35; overflow-wrap: anywhere; }
  .original-abstract strong { display: block; margin-bottom: 4px; color: var(--ink); }
  .tags { display: flex; flex-wrap: wrap; gap: 8px; }
  .tag { border-radius: 999px; padding: 4px 8px; background: #f1f5f9; color: #475569; font-size: 12px; font-weight: 700; }
  .head-text > .link { display: none; }
  .briefing { min-width: 0; min-height: 0; overflow: visible; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); grid-auto-rows: minmax(0, auto); align-content: start; gap: 11px 18px; border-top: 0; padding-top: 0; }
  .brief-section { min-width: 0; }
  .brief-section.wide { grid-column: 1 / -1; }
  .brief-section h2 { margin: 0 0 4px; font-size: 14px; line-height: 1.22; color: #0f766e; letter-spacing: 0; }
  .brief-section p, .brief-section li { margin: 0; font-size: 12.5px; line-height: 1.42; color: #1f2937; overflow-wrap: anywhere; }
  .brief-section ul { margin: 0; padding-left: 20px; }
  .concepts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 9px 14px; }
  .concept { border-top: 1px solid var(--line); padding-top: 7px; }
  .concept h3 { margin: 0 0 4px; font-size: 13px; color: #7c2d12; letter-spacing: 0; }
  .concept p { margin: 2px 0 0; font-size: 11.5px; line-height: 1.35; color: #374151; overflow-wrap: anywhere; }
  .concept b { color: #111827; }
  .link { color: var(--accent); font-weight: 800; text-decoration: none; }
  .empty { padding: 48px; background: var(--paper); border: 1px solid var(--line); border-radius: 12px; color: var(--muted); }
  @media (max-width: 860px) {
    .shell { padding: 14px; }
    .topbar, .top-actions { align-items: stretch; flex-direction: column; }
    .slide, .briefing, .concepts { grid-template-columns: 1fr; }
    .slide { min-height: auto; overflow: visible; display: grid; }
    h1 { font-size: 28px; }
  }
</style>

<script>
const slides = [{"title": "Interplay between charge correlations and superconductivity across the superconducting domes of CsV3Sb(5−x)Snx", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/bcqw-7lsf", "authors": "Andrea N. Capa Salinas, Steven J. Gomez Alvarado, Brenden R. Ortiz, et al.", "last_authors": "Turan Birol, Stephen D. Wilson", "summary": "The kagome metal ${\\mathrm{CsV}}_{3}{\\mathrm{Sb}}_{5}$ hosts an anomalous interplay between charge density wave (CDW) order and superconductivity—one where tuning its band filling by adding holes rapidly suppresses long-range CDW order and drives the formation of two unusual superconducting “domes.”…", "tier": "A_MUST_READ", "score": "10", "reason": "Direct hit on CsV3Sb5 kagome metal, CDW-superconductivity interplay, and STS measurements.", "tags": ["STS", "kagome", "material", "CDW"], "image": "", "briefing": {"background": "AV3Sb5 (A = K, Rb, Cs) 구조의 카고메 금속은 초전도와 전하 밀도 파(CDW)가 공존하며 복잡한 위상학적 특성을 보여주는 소재로 큰 관심을 받고 있습니다. 특히 CDW와 초전도 사이의 경쟁적 또는 협력적 관계를 이해하는 것이 이 분야의 핵심 과제입니다.", "motivation": "CsV3Sb5 시스템에서 Sb를 Sn으로 치환(홀 도핑)하면 장거리 CDW가 억제되면서 두 개의 초전도 '돔(dome)'이 나타납니다. 본 연구는 주사 터널링 현미경/분광법(STM/STS)을 통해 이 이중 돔 구조 전반에서 전하 상관관계와 초전도 갭이 어떻게 변화하는지 실험적으로 규명하고자 합니다.", "result": "Sn 치환량이 증가함에 따라 CDW 갭이 점진적으로 사라지는 과정을 포착하였으며, 두 초전도 돔 영역에서 나타나는 초전도 에너지 갭의 크기와 대칭성 변화를 관찰했습니다. 특히 CDW가 사라진 지점 이후에 나타나는 두 번째 돔의 물리적 기원이 기존 CDW와 직접적인 연관이 있는지, 아니면 새로운 전자 상태에 의한 것인지를 STS 스펙트럼 데이터로 제시합니다.", "implication": "이 결과는 카고메 격자에서의 초전도 현상이 단순한 BCS 이론으로 설명되지 않으며, 전자 상관관계와 도핑에 따른 밴드 구조 변화가 초전도 쌍 형성에 결정적인 역할을 한다는 점을 시사합니다. CDW와 초전도의 상호작용 메커니즘을 제한하는 중요한 단서를 제공합니다.", "novelty": "이 연구는 사용자의 주요 관심사인 CsV3Sb5 시스템에 대해 도핑 농도를 정밀하게 제어하며 STS로 초전도 돔 전체를 훑었다는 점에서 매우 중요합니다. 특히 Kagome 금속에서의 비정상적인 초전도 전이 거동을 국소적 전자 구조 관점에서 분석한 점이 돋보입니다.", "unresolved": "두 번째 초전도 돔이 형성되는 구체적인 쌍 형성 매개체(pairing glue)가 무엇인지, 그리고 잔류하는 단거리 CDW 요동이 초전도에 어느 정도 기여하는지는 여전히 논의의 여지가 있습니다.", "future_work": "ARPES를 통한 밴드 재규격화 측정과 비교 연구가 필요하며, 압력 등 다른 외부 변수와의 상관관계 연구가 이어질 것으로 예상됩니다.", "concepts": [{"term": "Kagome Metal (CsV3Sb5)", "why_emerged": "기하학적 좌절(frustration)이 있는 격자 구조에서 위상 특성과 전자 상관관계를 동시에 연구하기 위해 등장했습니다.", "origin": "2019~2020년경 Ortiz 등에 의해 초전도성이 처음 발견됨.", "connections": "CDW, 위상 반금속, 비정상 홀 효과(AHE)와 깊은 연관이 있음."}, {"term": "Superconducting Dome", "why_emerged": "압력이나 도핑에 따라 초전도 임계 온도가 특정 구간에서 극대화되는 현상을 설명하기 위해 사용됩니다.", "origin": "고온 초전도체(Cuprates) 연구에서 널리 알려짐.", "connections": "양자 임계점(QCP), CDW 억제와 자주 동반됨."}, {"term": "STM/STS", "why_emerged": "원자 단위의 공간 해상도로 물질 표면의 국소적 전자 상태 밀도(LDOS)를 측정하기 위해 개발되었습니다.", "origin": "1981년 Gerd Binnig와 Heinrich Rohrer가 발명.", "connections": "ARPES와 상호보완적이며, 초전도 갭 및 CDW 공간 변조 관측에 필수적임."}], "english_summary": ["Investigates the interplay between CDW and superconductivity in Sn-doped CsV3Sb5 kagome metal.", "Identifies the evolution of charge correlations and superconducting gaps across two distinct SC domes using STS.", "Reveals how hole-doping suppresses long-range CDW and induces an unconventional superconducting phase diagram.", "Provides local electronic evidence for competing electronic orders in 135-type kagome systems."]}}, {"title": "Altermagnetism, Kagome Flat Band, and Weyl Fermion States in Magnetically Intercalated Transition Metal Dichalcogenides (npj Quantum Mater.)", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2510.21968", "authors": "Avinash Sah, Ting-Yong Lim, Clayton Conner, et al.", "last_authors": "Pavlo Sukhachov, Guang Bian", "summary": "Altermagnetic (AM) compounds have recently emerged as a promising platform for realizing unconventional quantum phases, enabled by their unique spin-split band structure at zero net magnetization. Here, we present a first-principles investigation of magnetically intercalated transition metal dichalcogenides (TMDs) of the form XY$_4$Z$_8$ (X $=$ Mn, Fe, Co, Ni, Cr, or V; Y $=$ Nb or Ta; and Z $=$ Se or S), identifying a subset of new versatile AM candidates. Our results establish a systematic correlation between interatomic geometry, quantified by the ratio of interlayer to intralayer spacing, and the magnetic ground states. Systems with A-type antiferromagnetic order exhibit momentum-dependent spin splitting consistent with AM behavior. The combination of the AM spin-splitting and the spin-orbit coupling leads to the emergence of Weyl nodes together with the corresponding topological Fermi arc surface states. Moreover, we identify flat bands near the Fermi level that originate from the intercalant-induced formation of an effective kagome-like sublattice in the TMD layer. These results collectively establish magnetically intercalated TMDs as a promising platform for engineering altermagnetism, flat bands, and Weyl fermions within a single material family, facilitating the development of topological and spintronic applications.", "tier": "A_MUST_READ", "score": "10", "reason": "Direct hit: combines altermagnetism, kagome flat bands, and Weyl states in intercalated TMDs.", "tags": ["material", "kagome", "altermagnetism", "topologicalsemimetal"], "image": "https://arxiv.org/html/2510.21968v2/Fig1CrystalStructureN.png", "briefing": {"background": "최근 발견된 알터마그네티즘(Altermagnetism)은 순 자화가 0이면서도 밴드 구조에서 스핀 분리(spin-splitting)가 일어나는 독특한 자기 상태로, 스핀트로닉스와 위상 양자 물질 연구의 새로운 패러다임으로 떠오르고 있습니다.", "motivation": "전이금속 디칼코게나이드(TMD) 격자 사이에 자성 원자를 삽입(intercalation)하여 알터마그네티즘, 카고메 평탄 밴드(flat band), Weyl 페르미온 상태를 동시에 구현할 수 있는 신물질 후보군을 찾고자 합니다.", "result": "제1원리 계산을 통해 XY4Z8 구조의 자성 삽입 TMD들에서 알터마그네티즘을 확인했습니다. 삽입된 자성 원자들이 유효한 카고메 격자를 형성하여 Fermi 레벨 근처에 평탄 밴드를 유도하며, 스핀-궤도 결합과 알터마그네틱 스핀 분리가 결합되어 Weyl 노드와 표면 Fermi arc가 나타남을 증명했습니다.", "implication": "하나의 물질 시스템 안에서 강한 전자 상관관계(평탄 밴드), 비정상적 자기 특성(알터마그네티즘), 위상적 특성(Weyl)을 모두 제어할 수 있는 플랫폼을 제시했습니다. 이는 고성능 스핀트로닉 소자 및 양자 소자 설계에 중요한 기초가 됩니다.", "novelty": "사용자의 관심사인 카고메 격자와 알터마그네티즘, Weyl 반금속을 TMD 시스템에 통합했다는 점이 매우 강력한 소구점입니다. 특히 삽입된 원자가 형성하는 카고메 유사 격자가 평탄 밴드를 만든다는 메커니즘을 구체적으로 제시했습니다.", "unresolved": "이론적 예측이므로 실제 물질 합성 시의 안정성과 계산된 자기 기판 상태(A-type AFM 등) ": "Pr4Ni3O10에서 구조적 변형으로 인해 궤도 분화(orbital differentiation)가 강화됨을 발견했습니다. dz2 궤도는 선택적으로 비간섭성(incoherent) 상태가 되고 크게 재규격화(renormalization)되는 반면, dx2-y2 궤도는 간섭성(coherent)을 유지합니다. 이는 결과적으로 궤도 간 하이브리드화를 억제합니다.", "implication": "층간 결합각(interlayer bonding angle)이 니켈레이트의 전자적 특성을 조절하는 주요 변수임을 시사하며, 이는 다중 궤도 상관관계 물리와 초전도성을 연결하는 가교 역할을 할 수 있습니다.", "novelty": "ARPES와 STS를 통해 Pr4Ni3O10의 특이한 궤도 선택적 거동을 직접 관찰했습니다. 특히 구조적 변화가 어떻게 특정 궤도의 '비간섭성'을 유도하여 궤도 간 결합을 약화시키는지 보인 점이 독창적입니다. 니켈레이트 초전도체에 관심 있는 독자에게 매우 유용한 정보입니다.", "unresolved": "이러한 궤도 분화가 초전도 임계 온도(Tc)나 초전도 갭의 대칭성에 직접적으로 어떤 정량적 영향을 미치는지에 대한 상세한 메커니즘은 추가 연구가 필요합니다.", "future_work": "다른 희토류 원소 치환이나 압력 인가를 통해 층간 결합각을 정밀 제어하면서 궤도 분화와 초전도성 사이의 상관관계를 체계적으로 조사할 필요가 있습니다.", "concepts": [{"term": "Orbital differentiation", "why_emerged": "다중 궤도 계에서 특정 궤도는 강한 상관관계를 보이고 다른 궤도는 금속성을 유지하는 현상을 설명하기 위해 등장했습니다.", "origin": "강상관 전자계 이론 및 DMFT 연구 등에서 발전됨 (초록 정보만으로는 특정하기 어려움)", "connections": "Hund's metal, Mott transition, Selective Mott physics"}, {"term": "Trilayer nickelates", "why_emerged": "무한 층(infinite-layer) 니켈레이트 초전도체 발견 이후, 층수에 따른 물리적 특성 변화를 탐구하기 위해 주목받았습니다.", "origin": "Li et al. (Nature, 2019)의 니켈레이트 초전도 발견 이후 확장된 연구 분야", "connections": "Ruddlesden-Popper phases, High-Tc superconductivity"}], "english_summary": ["Direct comparison of Pr4Ni3O10 and La4Ni3O10 reveals enhanced orbital differentiation due to structural modifications.", "dz2 orbitals become selectively incoherent and renormalized, while dx2-y2 orbitals remain coherent.", "The interlayer bonding angle acts as a key tuning parameter for multiorbital correlations in trilayer nickelates.", "Structural changes lead to the suppression of interorbital hybridization, bridging crystal geometry and superconductivity."]}}, {"title": "Defect-Induced Displacement of Topological Surface State in Quantum Magnet MnBi2Te4", "journal": "PRL_Recent", "source": "author whitelist", "link": "http://link.aps.org/doi/10.1103/pt1j-996m", "authors": "Felix Lüpke, Marek Kolmer, Hengxin Tan, et al.", "last_authors": "Wonhee Ko, An-Ping Li", "summary": "The topological magnet MnBi 2 Te 4 (MBT), with gapped topological surface state, is an attractive platform for realizing quantum anomalous Hall and axion insulator states. However, the experimentally observed surface state gaps fail to meet theoretical predictions, although the exact mechanism behind the gap suppression has been debated. Recent theoretical studies suggest that intrinsic antisite defects push the topological surface state away from the MBT surface, closing its gap and making it less accessible to scanning probe experiments. Here, we report on the local effect of defects on the MBT surface states and demonstrate that high defect concentrations lead to a displacement of the surface states well into the MBT crystal, validating the theorized mechanism. The local and global influence of antisite defects on the topological surface states are studied with samples of varying defect densities by combining scanning tunneling microscopy, angle-resolved photoemission spectroscopy, and density functional theory. Our findings identify a combination of increased defect density and reduced defect spacing as the primary factors underlying the displacement of the surface states and suppression of surface gap, guiding further development of topological quantum materials.", "tier": "A_MUST_READ", "score": "9", "reason": "author whitelist: Adam Kaminski", "tags": ["anomalousHall", "quantummagnet", "topological"], "image": "", "briefing": {"background": "MnBi2Te4(MBT)는 고유한 자기적 위상 절연체로, 양자 이상 홀(QAH) 효과와 액시온 절연체 상태를 구현할 수 있는 유망한 소재입니다. 그러나 이론적으로 예측된 위상 표면 상태(TSS)의 에너지 갭이 실험적으로는 관찰되지 않거나 매우 작게 나타나는 문제가 지속되어 왔습니다.", "motivation": "MBT의 표면 갭이 억제되는 근본 원인을 규명하기 위해, 결정 내에 존재하는 고유 결함(intrinsic defects), 특히 안티사이트 결함(antisite defects)의 역할을 로컬 및 글로벌 스케일에서 조사하고자 했습니다.", "result": "안티사이트 결함의 밀도가 높아지면 표면 상태(TSS)가 결정의 안쪽(bulk)으로 밀려나는 '변위(displacement)' 현상을 확인했습니다. 이로 인해 표면 근처에서 측정되는 갭이 사라지고, STM과 같은 표면 민감 측정 장비에서 TSS를 관찰하기 어려워진다는 것을 STM, ARPES, DFT 결합 연구로 입증했습니다.", "implication": "MBT 기반의 위상 소자 제작 시 단순히 화학적 조성을 맞추는 것뿐만 아니라 결함의 밀도와 간격을 정밀하게 제어하는 것이 양자 이상 홀 효과 구현의 핵심임을 시사합니다.", "novelty": "결함에 의한 위상 표면 상태의 '벌크로의 이동(displacement)' 메커니즘을 실험적으로 직접 검증했다는 점이 중요합니다. Adam Kaminski 등 ARPES 권위자의 참여로 데이터의 신뢰도가 높으며, MBT의 갭 실종 미스터리를 해결하는 중요한 진전입니다.", "unresolved": "결함 제어 외에 표면 산화나 대기 노출이 표면 상태의 이동에 추가적으로 어떤 영향을 미치는지에 대한 연구가 더 진행되어야 합니다.", "future_work": "결함 농도를 극도로 낮춘 고품질 MBT 단결정 성장법 개발과, 이를 이용한 상온에 가까운 양자 이상 홀 효과의 관측이 기대됩니다.", "concepts": [{"term": "Antisite defects", "why_emerged": "결정 성장 과정에서 원자가 원래 자리 대신 다른 원소의 자리에 들어가는 현상을 설명하기 위해 사용됩니다 (예: Mn이 Bi 자리에 위치).", "origin": "결정학 및 고체물리학의 기본 개념", "connections": "Mn-Bi exchange, defect-induced scattering, MnBi2Te4 stoichiometry"}, {"term": "Topological Surface State (TSS) displacement", "why_emerged": "표면 상태가 물리적으로 표면에 머물지 않고 내부로 침투하는 현상을 설명하기 위해 제안된 이론적 가설입니다.", "origin": "최근 MBT의 갭 이슈를 설명하기 위한 이론적 예측 (초록 정보만으로는 특정하기 어려움)", "connections": "Quantum anomalous Hall effect, Axion insulator, Surface-bulk correspondence"}], "english_summary": ["Intrinsic antisite defects in MnBi2Te4 cause the displacement of topological surface states (TSS) into the bulk.", "Increased defect density and reduced spacing are identified as primary factors suppressing the surface energy gap.", "The study combines STM, ARPES, and DFT to validate the theorized mechanism of TSS displacement.", "Results provide a roadmap for defect engineering to realize robust quantum anomalous Hall states in magnetic TIs."]}}, {"title": "Pressure-Induced Magnetic-Field-Free Superconducting Diode Effect in NbSe2 Flake", "journal": "PRL_Recent", "source": "author whitelist", "link": "http://link.aps.org/doi/10.1103/8wnw-16qt", "authors": "Shihao Zhu, Tian Le, Cuiying Pei, et al.", "last_authors": "Wen-Yu He, Yanpeng Qi", "summary": "The superconducting diode effect (SDE) is a fascinating nonreciprocal phenomenon where the critical current is different for opposite current directions. It is widely believed that realizing SDE requires breaking both inversion symmetry and time-reversal symmetry (TRS), which are usually achieved vi…", "tier": "A_MUST_READ", "score": "9", "reason": "author whitelist: Yulin Chen", "tags": ["superconduct"], "image": "", "briefing": {"background": "초전도 다이오드 효과(SDE)는 전류의 방향에 따라 임계 전류 값이 달라지는 비가역적 수송 현상입니다. 이는 차세대 저전력 초전도 논리 회로의 핵심 요소로 주목받고 있으나, 일반적으로 외부 자기장을 인가하여 시간 반전 대칭성(TRS)을 깨뜨려야 한다는 제약이 있습니다.", "motivation": "외부 자기장 없이(field-free) SDE를 구현하는 것은 실용화의 관건입니다. 본 연구는 NbSe2 박막에 압력을 가해 대칭성을 조절함으로써 자기장 없는 SDE를 실현하고자 했습니다.", "result": "NbSe2 조각(flake)에서 압력 유도에 의한 자기장 없는 초전도 다이오드 효과를 성공적으로 관측했습니다. 이는 외부 자기장 없이도 압력만으로 반전 대칭성과 시간 반전 대칭성이 깨진 상태가 유도될 수 있음을 보여줍니다.", "implication": "압력을 조절 변수로 사용하여 비전통적 초전도 현상과 비가역적 수송 특성을 제어할 수 있는 새로운 경로를 제시했습니다.", "novelty": "대표적인 2차원 초전도체인 NbSe2에서 압력이라는 물리적 수단을 통해 '자기장 없는' SDE를 구현했다는 점이 독창적입니다. Yulin Chen 등 위상 물질 전문가들이 참여하여 수송 특성의 신뢰성을 높였습니다.", "unresolved": "압력이 어떻게 시간 반전 대칭성을 구체적으로 깨뜨리는지에 대한 미시적 메커니즘(예: 숨겨진 자성 또는 루프 전류의 형성 여부)은 여전히 논의의 대상입니다.", "future_work": "다른 2차원 전이금속 디칼코게나이드(TMD) 시스템에서도 유사한 압력 유도 SDE가 나타나는지 탐색하고, 압력 하에서의 정밀한 구조 분석이 병행되어야 합니다.", "concepts": [{"term": "Superconducting Diode Effect (SDE)", "why_emerged": "정류 특성을 초전도 상태에서 구현하여 전력 손실이 없는 다이오드를 만들기 위해 연구되었습니다.", "origin": "2020년경 Ando 등에 의한 실험적 발견 이후 급격히 발전", "connections": "Non-reciprocal transport, Magneto-chiral anisotropy, Inversion symmetry breaking"}, {"term": "Field-free SDE", "why_emerged": "소형화 및 집적화를 위해 번거로운 외부 자석 없이 작동하는 다이오드 기능이 필요했습니다.", "origin": "최근 자성체/초전도체 이종접합 등에서 연구되기 시작함", "connections": "Time-reversal symmetry breaking, Intrinsic magnetism, Loop currents"}], "english_summary": ["Realization of magnetic-field-free superconducting diode effect (SDE) in NbSe2 flakes using pressure.", "The phenomenon breaks both inversion and time-reversal symmetries without external magnetic fields.", "Pressure serves as an active tuning parameter for nonreciprocal transport in 2D superconductors.", "The study opens new possibilities for pressure-engineered superconducting electronics and topological physics."]}}, {"title": "Landau theory and exchange instabilities in Mn5Si3: A case against altermagnetism", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2608.13483", "authors": "K. D. Belashchenko", "last_authors": "K. D. Belashchenko", "summary": "Thin-film Mn$_5$Si$_3$ is one of the most studied altermagnetic candidates thanks to its metallicity, demonstrated anomalous transport properties, and assumed $d$-wave exchange splitting pattern enabling spin-polarized transport and various spintronic applications. Its postulated altermagnetic structure has zero propagation vector, in contrast to the collinear antiferromagnetic bulk phase (AFM2) which orders at the $M$ star. In this work, the two phases are analyzed using Landau theories, first-principles calculations of the paramagnetic instabilities, and Monte Carlo simulations. AFM2 appears in a Landau theory as a symmetry-protected inversion-even, permutation-odd mode at a single arm of the $M$ star. At $\\Gamma$, the same intracell ordering pattern belongs to the collinear branch of an $E_{2g}$ order parameter. In both cases, higher-order terms are required for the phase selection. First-principles calculations for the paramagnetic, disordered-local-moment state correctly identify the leading exchange instability at the $M$ star, and the resulting classical Heisenberg model orders at a reasonable temperature into the orthogonal $3M$ phase favored by single-site entropy. The $\\Gamma$-point $E_{2g}$ mode, whose Landau theory contains the altermagnetic sector, is substantially weaker and further suppressed by epitaxial strain representative of Mn$_5$Si$_3$ films exhibiting anomalous transport. The same strain reduces the leading magnetic exchange scale. These results provide a natural explanation for the bulk $M$-point instability but strongly disfavor the postulated relocation of the propagation vector from $M$ to $\\Gamma$ in a moderately strained bulklike Mn$_5$Si$_3$ film, suggesting that the corresponding altermagnetic phase is unlikely to be stabilized without additional physics.", "tier": "A_MUST_READ", "score": "9", "reason": "Critical material-specific analysis of altermagnetic candidate Mn5Si3 using DFT and Landau theory.", "tags": ["material", "Mn5Si3", "altermagnetism", "DFT"], "image": "https://arxiv.org/html/2608.13483v1/Fig1.png", "briefing": {"background": "알터마그네틱(Altermagnetism)은 최근 스핀트로닉스 응용을 위해 주목받는 새로운 자기 질서 상태입니다. 이는 시간 역전 대칭성을 깨면서도 순 자화가 0인 상태를 유지하여, 운동량 공간에서 d-wave와 같은 스핀 분리 구조를 가집니다.", "motivation": "Mn5Si3 박막은 대표적인 알터마그네틱 후보 물질로 거론되어 왔으나, 이론적 예측과 실험적 관측 사이에 불일치가 존재했습니다. 본 연구는 이 물질이 실제 알터마그네틱 상태를 갖는지 란다우 이론과 제1원리 계산을 통해 엄밀히 검증하고자 합니다.", "result": "연구 결과, Mn5Si3의 자기적 불안정성은 알터마그네틱 상태가 요구하는 감마(Gamma) 포인트가 아닌, 기존에 알려진 M 포인트에서 발생함이 확인되었습니다. 또한 박막의 변형이 오히려 알터마그네틱 상태 형성을 억제함을 보였습니다.", "implication": "Mn5Si3 박막에서 관찰된 비정상적인 수송 현상이 반드시 알터마그네틱 구조에서 기인한 것은 아닐 수 있음을 시사하며, 해당 물질의 알터마그네틱 성질에 대한 재평가가 필요합니다.", "novelty": "기존에 알터마그네틱 유망주로 알려진 물질을 이론적으로 비판 검토하여 스핀트로닉스 물질 설계를 위한 실질적인 가이드라인을 제시하였습니다.", "unresolved": "왜 특정 Mn5Si3 박막에서 비정상 수송 현상이 나타나는지에 대한 구체적인 메커니즘은 여전히 명확하지 않습니다.", "future_work": "알터마그네틱 상태를 안정화할 수 있는 추가적인 물리적 메커니즘을 찾거나, 비전통적인 자기 질서가 실제 수송 현상에 미치는 영향에 대한 심층 연구가 필요합니다.", "concepts": [{"term": "Altermagnetism", "why_emerged": "기존 강자성체와 반강자성체의 한계를 넘어 새로운 스핀 의존 물리 현상을 탐구하기 위해 제안되었습니다.", "origin": "최근 수년 내 제안된 개념으로, Libor Smejkal 등이 주도적으로 정립하였습니다.", "connections": "반강자성체, 스핀트로닉스, 베리 곡률과 연관됩니다."}, {"term": "Landau theory", "why_emerged": "상전이 근처에서 시스템의 대칭성 변화와 질서 변수를 체계적으로 기술하기 위해 도입되었습니다.", "origin": "Lev Landau가 1937년에 제안하였습니다.", "connections": "Ginzburg-Landau 이론, 질서 변수, 위상 전이."}], "english_summary": ["Critically examines Mn5Si3 as an altermagnetic candidate.", "Uses Landau theory and DFT to compare M-point vs Gamma-point ordering.", "Finds that strain suppresses the hypothesized altermagnetic phase.", "Concludes that the altermagnetic state is unlikely in standard Mn5Si3 films."]}}, {"title": "Nonrelativistic-Ising superconductivity in p-wave magnets (Phys. Rev. B)", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2601.19829", "authors": "Maxim Khodas, Libor \\v{S}mejkal, I. I. Mazin", "last_authors": "Libor \\v{S}mejkal, I. I. Mazin", "summary": "We discuss a possibility of superconductivity in the p-wave magnets. These are recently discovered materials that have zero net magnetization by symmetry and finite non-relativistic spin splitting of electron bands, like in altermagnets. Similarly, the spin polarizations is collinear in the momentum space. Yet, as opposed to altermagnets, the magnetization is noncollinear in the real space, and the spin splitting obeys time-reversal symmetry in the momentum space. As a result, if such material harbors superconductivity (due to phonons, or any other mechanism), the only supported superconducting symmetry is Ising superconductivity, an exotic symmetry where any Cooper pair is a 50:50 mix of singlet and triplet. This unusual behavior is also in stark contrast to regular antiferromagnet, which can support Cooper pairs of any parity, and altermagnets, which can only support nonunitary triplet pairs. The presence of large triplet component and enhanced resilience against pair breaking is inherent to the p-wave magnets and as such is unconventional as it does not materialize in conventional spin-orbit coupling induced Ising superconductors.", "tier": "A_MUST_READ", "score": "9", "reason": "Explores novel Ising superconductivity in altermagnetic materials, directly matching user interests.", "tags": ["topic", "altermagnetism", "superconductivity"], "image": "https://arxiv.org/html/2601.19829v2/figure1.png", "briefing": {"background": "이징 초전도체(Ising superconductivity)는 평면 외부 방향으로 강한 스핀-궤도 결합이 존재할 때 쿠퍼 쌍의 스핀이 고정되어 외부 자기장에 매우 강한 저항력을 보이는 현상입니다.", "motivation": "본 연구는 스핀-궤도 결합이 아닌, 알터마그네틱과 유사한 스핀 분리 구조를 가진 'p-wave 자성체'에서도 이징 초전도성이 나타날 수 있는지 조사하고자 합니다.", "result": "이러한 물질에서는 초전 is purely phononic or magnetic in origin.", "Understanding these modes is crucial for interpreting spectroscopic signals in altermagnets."]}}, {"title": "Quantum geometry in the NbSe2 family: Obstructed compact Wannier function and perturbation theory", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/2bjl-p1vd", "authors": "Jiabin Yu, Yi Jiang, Yuanfeng Xu, et al.", "last_authors": "Fernando De Juan, B. Andrei Bernevig", "summary": "Here, the authors reveal that monolayer NbSe 2 and related transition metal dichalcogenides host obstructed atomic bands near the Fermi level. By constructing a b i n i t i o six-, three-, and single-band Wannier models, they identify remarkably compact obstructed Wannier functions and an unusual dominance of next-nearest-neighbor hopping. These results provide a transparent low-energy framework for investigating how quantum geometry shapes charge order, electron–phonon coupling, and superconductivity in NbSe 2 .", "tier": "B_IMPORTANT_CONDMAT", "score": "9", "reason": "In-depth electronic structure study of the NbSe2 family, closely related to interest in NbSe3 and 112 tellurides.", "tags": ["material", "theory", "electronic-structure"], "image": "", "briefing": {"background": "NbSe2를 포함한 전이금속 디칼코게나이드(TMD)는 전하 밀도 파동(CDW)과 초전도 현상이 공존하는 대표적인 물질군입니다. 이들의 전자 구조에서 '양자 기하학'을 밝히는 것은 강상관계 물리 연구의 핵심입니다.", "motivation": "기존의 Wannier 함수 모델만으로는 NbSe2의 전자 구조에서 나타나는 CDW 및 초전도성을 직관적으로 설명하기 어려워, 더 정밀한 저에너지 물리 모델이 필요했습니다.", "result": "단층 NbSe2 내부에 '방해받은(obstructed)' 원자 밴드가 존재함을 규명하고, 매우 컴팩트한 Wannier 함수를 도출하여 다음 인접 원자 간 호핑(hopping)의 중요성을 강조했습니다.", "implication": "양자 기하학적 관점에서 NbSe2의 CDW 발생 기작을 해석하는 새로운 프레임워크를 제공합니다.", "novelty": "복잡한 전자 구조를 매우 단순하고 직관적인 Wannier 모델로 성공적으로 환원시켜 물리적 직관을 극대화했습니다.", "unresolved": "이러한 기하학적 특징이 실제로 어떻게 초전도 쌍 결합(pairing)을 매개하는지에 대한 정량적 관계는 향후 연구 과제입니다.", "future_work": "도출된 Wannier 모델을 바탕으로 CDW 형성 시 전자-포논 결합 상수를 재계산하는 연구가 기대됩니다.", "concepts": [{"term": "Quantum Geometry", "why_emerged": "밴드 riven by incommensurability between host and guest lattices.", "Slow order-disorder kinetics governs the structural transition.", "Enables thermally programmable engineering of inorganic-organic heterointerfaces."]}}, {"title": "On-chip waveguide-integrated light sources using MoS 2 /WSe 2 moiré superlattices on a silicon photonic platform", "journal": "Science_Advances", "source": "Gemini", "link": "https://doi.org/10.1126/sciadv.aef5518", "authors": "Xingyu Huang, Hanlin Fang, Shima Kadkhodazadeh, et al.", "last_authors": "Martijn Wubs, Sanshui Xiao", "summary": "Moiré superlattices have been widely explored as a unique platform for investigating exotic physics, but their potential applications in integrated photonics remain unexplored. In this work, we demonstrate a waveguide-integrated light source operating at telecom wavelengths with high temporal coherence, enabled by molybdenum disulfide (MoS 2 )/tungsten diselenide (WSe 2 ) moiré superlattices coupled to a silicon photonic nanobeam cavity. Our results reveal that, at room temperature, the moiré potential in MoS 2 /WSe 2 superlattices strongly boosts light-emission intensity, extends interlayer-exciton lifetime, and redshifts the emission wavelength. Our demonstrated device shows excellent coherence properties with near-unity interference visibility and a coherence length of about 3.8 millimeters, substantially exceeding the performance of previously reported two-dimensional–material light sources. Moreover, these devices exhibit stable performance under ambient conditions, operating within the fiber communication O-band. This work paves the way for leveraging moiré superlattices as a promising material for photonic integrated circuits, highlighting their potential to enhance light-matter interactions and expand the capabilities of on-chip photonic technologies.", "tier": "B_IMPORTANT_CONDMAT", "score": "9", "reason": "Moiré superlattices of 2D TMDs and their exciton physics in a photonic platform.", "tags": ["moire", "2Dmaterial", "TMD", "excitons", "photonics"], "image": "", "briefing": {"background": "반도체 2D 전이금속 디칼코게나이드(TMD) 이종접합의 모아레 초격자는 엑시톤 물리 연구의 핵심 플랫폼입니다. 이를 실제 온-칩 광자 회로와 통합하여 통신 대역의 광원으로 활용하려는 시도가 활발합니다.", "motivation": "MoS2/WSe2 모아레 초격자가 가진 독특한 엑시톤 특성(긴 수명, 밴드갭 조정)을 실리콘 광자 플랫폼과 결합하여 고성능 광원으로서의 가능성을 입증하고자 했습니다.", "result": "모아레 잠재력이 엑시톤 수명을 늘리고 광 방출 세기를 증폭시킴을 확인했습니다. 실리콘 나노빔 캐비티와의 결합을 통해 상온에서 높은 일시적 일관성을 갖는 통신용 O-밴드 광원을 구현했습니다.", "implication": "2D 물질 기반 모아레 구조를 온-칩 광자 집적 회로의 핵심 부품으로 사용할 수 있음을 실증했습니다.", "novelty": "기존 연구들이 주로 엑시톤 물리학 연구에 집중했던 것과 달리, 실시간 광학 소자 성능(코히런스 길이 3.8mm 등)을 구체적으로 증명했다는 점이 중요합니다.", "unresolved": "상온 동작 시 발생하는 열 노이즈가 모아레 효과를 희석시키지 않으면서 얼마나 더 복잡한 집적 회로에 적용될 수 있는지는 검증이 필요합니다.", "future_work": "더 넓은 대역폭 구현 및 다중 모아레 도메인을 활용한 정보 처리 소자로의 확장.", "concepts": [{"term": "모아레 엑시톤 (Moiré Exciton)", "why_emerged": "모아레 잠재력에 의해 공간적으로 갇힌 엑시톤이 독특한 광학적 성질을 띠게 됨에 따라 필요.", "origin": "2010년대 후반 TMD 이종접합 연구 그룹들(예: Wang, Heinz 등)", "connections": "층간 엑시톤(interlayer exciton), 밴드 정렬 엔지니어링."}, {"term": "실리콘 포토닉스 (Silicon Photonics)", "why_emerged": "기존 CMOS 공정과의 호환성을 유지하면서 광 통신 속도를 비약적으로 높이기 위해 필요.", "origin": "1980년대 후반 리처드 소렌프 등에 의해 제안.", "connections": "광 인터커넥트, 나노 광학 캐비티."}], "english_summary": ["Integration of MoS2/WSe2 moiré superlattices on silicon nanobeam cavities.", "Demonstrated telecom-wavelength light source with high temporal coherence.", "Moiré potential enhances light-emission intensity and exciton lifetimes.", "Room-temperature stable performance in ambient conditions."]}}, {"title": "Dissipationless Photovoltaic Spin Hall Effect from Spin-current Vorticity (Nature)", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2608.12968", "authors": "Longjun Xiang, Jian Wang", "last_authors": "Longjun Xiang, Jian Wang", "summary": "Spin-current vorticity (SCV) can generate the linear magnetic spin Hall effect [\\href{https://doi.org/10.1038/s41586-018-0853-0}{Nature \\textbf{565}, 627 (2019)}], yet its role in nonlinear spin Hall transport has been much less explored. Here, we show that, under a dc electric field, SCV can deflect optically excited electrons to drive a dissipationless photovoltaic spin Hall effect (PSHE), in which optical excitation by circularly and linearly polarized light is governed by the Berry curvature and quantum metric, respectively. Because the Berry curvature is $\\mathcal{T}$-odd whereas the quantum metric is $\\mathcal{T}$-even, their respective combinations with the $\\mathcal{T}$-odd SCV give rise to $\\mathcal{T}$-even and $\\mathcal{T}$-odd PSHEs, where $\\mathcal{T}$ denotes time-reversal symmetry. Remarkably, we find that the spin current of the $\\mathcal{T}$-even PSHE can be reversed by switching the light helicity, as illustrated in monolayer WTe$_2$. By contrast, the $\\mathcal{T}$-odd PSHE in altermagnets changes sign upon N\\'eel-vector reversal, as demonstrated in a $d$-wave altermagnetic model. Beyond the PSHE, we show that the SCV dipole governs both the Drude and intrinsic nonlinear spin Hall effects proposed recently. Our results reveal two switchable spin Hall mechanisms and establish SCV as a unifying concept for understanding dissipationless nonlinear spin Hall transport.", "tier": "B_IMPORTANT_CONDMAT", "score": "9", "reason": "Theoretical link between Berry curvature, altermagnetism, and nonlinear spin transport in materials like WTe2.", "tags": ["theory", "altermagnetism", "Berrycurvature", "WTe2"], "image": "https://arxiv.org/html/2608.12968v1/fig1.png", "briefing": {"background": "위상 반금속 및 자성 물질에서 Berry 곡률은 전하 및 스핀 수송 현상의 핵심입니다. 특히 대칭성(시간 반전, 공간 반전)이 깨진 계에서 나타나는 비선형 수송 현상을 이해하는 것이 최근 응집물질물리학의 주요 화두입니다.", "motivation": "비선형 스핀 홀 효과(PSHE)에서 '스핀 전류 와도(Spin-current vorticity, SCV)'가 어떤 역할을 하는지 이론적으로 규명하고자 했습니다.", "result": "SCV가 Berry 곡률 및 양자 계량(quantum metric)과 결합하여 광 유도 스핀 홀 효과를 유도함을 보였습니다. WTe2(시간 반전 깨짐)와 알터마그넷(Néel 벡터에 따른 스핀 수송 제어) 모델에서 이 효과가 스위칭 가능함을 증명했습니다.", "implication": "SCV가 비선형 스핀 수송을 통합적으로 설명할 수 있는 개념임을 제시하며, 위상 자성 소자 설계의 이론적 토대를 제공합니다.", "novelty": "Berry 곡률의 T-odd 성질과 양자 계량의 T-even 성질을 SCV와 결합하여 비선형 수송을 체계화했습니다. WTe2 및 알터마그넷을 연구하는 사용자에게 매우 강력한 수송 이론적 도구가 됩니다.", "unresolved": "실제 실험적 측정에서 스핀 전류 와도를 분리하여 검증하는 방법은 여전히 도전 과제입니다.", "future_work": "다양한 위상 자성 물질에서의 비선형 스핀 홀 효과 측정 및 스위칭 실험.", "concepts": [{"term": "스핀 전류 와도 (Spin-current vorticity)", "why_emerged": "비평형 상태에서 스핀 전류의 불균일한 흐름을 기술하기 위해 도입.", "origin": "Sun and Zhang (2019, Nature)", "connections": "스핀 홀 효과, 비선형 수송, Berry 곡률."}, {"term": "알터마그네티즘 (Altermagnetism)", "why_emerged": "강자성도 반강자성도 아닌, 스핀 분할 밴드 구조를 갖는 새로운 자성 상태를 분류하기 위해 필요.", "origin": "Šmejkal 등 (2020년대 초 제안)", "connections": "d-wave 자성, 비상반적 수송(non-reciprocal transport)."}], "english_summary": ["Theoretical framework for dissipationless photovoltaic spin Hall effect (PSHE).", "SCV unifies the description of Berry curvature and quantum metric contributions.", "Switchable spin Hall effects demonstrated in WTe2 and d-wave altermagnets.", "SCV dipole identified as the mechanism for nonlinear spin Hall transport."]}}, {"title": "Emergent trans-moir\\'e orbitals and topology in rhombohedral graphene", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2608.12478", "authors": "Yuqin Wang, Jian Xie, Yi-Jie Wang, et al.", "last_authors": "Xiaobo Lu, Yi Chen", "summary": "The fractional quantum anomalous Hall effect (FQAHE) exhibited in fractional Chern insulators has recently been demonstrated in twisted MoTe2 and rhombohedral graphene/hBN moir\\'e superlattices, promising new routes toward topological quantum computation. Central to realizing this promise is the understanding of the underlying microscopic mechanism. This, however, remains elusive in the case of rhombohedral graphene, with the crux being its two seemingly paradoxical conditions: a pronounced small-twist-angle ({\\theta}) moir\\'e interface, yet only when electrons are kept distant from it. Here, by scanning tunnelling microscopic imaging with both conditions fulfilled, we capture dramatic electronic structure reshaping in rhombohedral hexalayer graphene by unforeseen 'trans-moir\\'e orbitals', which emerge on the other, distant side of the moir\\'e interface but nevertheless enforce the moir\\'e periodicity at all measured fillings. We visualize a hierarchy of spatially and energetically distinct trans-moir\\'e orbitals which doped electrons must sequentially occupy--the lowest-energy orbital, expectedly responsible for the FQAHE at small fillings, carries a hollow-cage-like shape. Remarkably, these trans-moir\\'e orbitals vanish at {\\theta} {\\gtrsim} 1{\\deg}, and so do QAHE plateaus in similar devices. Simulations reveal an interaction-driven charge-redistribution mechanism which shapes the trans-moir\\'e orbitals and corresponding Chern minibands. With our findings providing the missing microscopic link, the paradoxical conditions find a natural explanation: electrons are not simply kept distant from a small-{\\theta} moir\\'e interface; they are forced into topological trans-moir\\'e orbitals, forged precisely under such conditions. Our microscopic diagnostics unlocks a wide range of possible 'synthetic' FQAHE platforms.", "tier": "B_IMPORTANT_CONDMAT", "score": "9", "reason": "Directly relevant STM imaging and electronic structure of rhombohedral graphene moiré systems.; demoted from A: broad CM, not direct user/project hit", "tags": ["experiment", "STM", "graphene", "moiré"], "image": "https://arxiv.org/static/browse/0.3.4/images/arxiv-logo-fb.png", "briefing": {"background": "모아레 초격자(moiré superlattice) 시스템은 2차원 물질을 겹쳐서 에너지 밴드 구조를 인위적으로 조절하는 핵심 플랫폼입니다. 특히 롬보헤드랄(rhombohedral) 그래핀 다층 구조는 분수 양자 이상 홀 효과(FQAHE)가 관측되면서 위상 양자 계산을 위한 후보 물질로 주목받고 있습니다.", "motivation": "롬보헤드랄 그래핀에서 왜 모아레 계면에서 멀리 떨어진 전자들이 모아레 주기성을 따라 FQAHE를 일으키는지에 대한 미시적 메커니즘이 모호했습니다. 본 연구는 STM을 통해 계면과 전자 사이의 미시적 구조를 규명하고자 했습니다.", "result": "계면 반대편에 형성되는 '트랜스-모아레 오비탈(trans-moiré orbitals)'의 존재를 시각화했습니다. 이 오비탈은 상호작용으로 유도된 전하 재분배에 의해 형성되며, 모아레 주기성을 강제하고 FQAHE의 근간이 되는 Chern 미니밴드를 형성합니다.", "implication": "작은 트위스트 각도와 물리적 거리 사이의 역설적 관계를 미시적으로 해결했습니다. 이는 향후 FQAHE를 구현할 수 있는 '합성' 플랫폼 설계의 중요한 가이드라인을 제공합니다.", "novelty": "STM을 사용하여 모아레 계면 내부의 전자적 재구성을 직접 시각화했다는 점이 핵심입니다. 사용자 관심사인 위상적 물질의 전자 구조 및 모아레 물리학을 이해하는 데 직접적인 통찰을 줍니다.", "unresolved": "다양한 층수 및 다른 조합의 모아레 시스템에서 이 오비탈의 범용성을 확인해야 합니다.", "future_work": "이러한 '트랜스-모아레 오비탈'을 활용하여 다른 2D 이종접합 구조에서 새로운 위상적 상태를 합성하는 실험이 뒤따를 것입니다.", "concepts": [{"term": "FQAHE (분수 양자 이상 홀 효과)", "why_emerged": "분수 양자 홀 효과가 외부 자기장 없이도 위상 밴드 내의 전자 상호작용을 통해 발생할 수 있음을 입증하기 위해.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "분수 Chern 절연체, 위상 양자 계산."}, {"term": "롬보헤드랄 그래핀", "why_emerged": "그래핀 다층 구조 중 ABC 적층 방식이 유도하는 플랫 밴드와 위상적 특성을 연구하기 위해.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "모아레 초격자, 위상 절연체."}, {"term": "트랜스-모아레 오비탈", "why_emerged": "모아레 계면에서 떨어진 전자들이 왜 모아레 잠재력을 느끼는지 설명하기 위해.", "origin": "본 논문에서 제안함", "connections": "모아레 초격자, Chern 미니밴드."}], "english_summary": ["Identifies 'trans-moiré orbitals' in rhombohedral hexalayer graphene using STM.", "These orbitals explain the long-standing mystery of FQAHE in systems where electrons are distant from the moiré interface.", "The orbitals are formed by interaction-driven charge redistribution and enforce moiré periodicity.", "Provides a microscopic blueprint for designing synthetic fractional Chern insulator platforms."]}}, {"title": "Resonant Far-Infrared Spectroscopy of Flat-Band Fermions in Magic Angle Graphene", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2608.12553", "authors": "Ayelet J. Uzan-Narovlansky, Ipsita Das, Juan F. Mendez Valderrama, et al.", "last_authors": "B. Andrei Bernevig, Sanfeng Wu", "summary": "Moir\\'e engineering in twisted two-dimensional (2D) materials radically alters low-energy bands, interactions and topological quantum states. Despite extensive studies, optical spectroscopy of interacting moir\\'e bands in the characteristic far-infrared (FIR) regime has remained largely unexplored due to extreme experimental challenges. Using a newly developed millikelvin FIR platform, we report the observation of the long-sought-after characteristic FIR resonances of flat-band electrons in magic-angle twisted bilayer graphene (MATBG). We observe highly tunable spectroscopic signatures of interacting light and heavy fermions that constitute the flat bands in MATBG. Using the topological heavy-fermion model (THF), we show that itinerant topological electrons act as an \"antenna\" that couples strongly to the optical field, with resonant frequencies renormalized by the hybridization with localized heavy electrons. We establish optical selection rules of MATBG which uncovers the key symmetry governing light-heavy fermion hybridization. At charge neutrality, we observe pronounced resonances at energies below the on-site Coulomb energy, implying the emergence of new many-body modes. Our experiments and modeling provide a fundamental understanding of light-matter interactions in MATBG and enable resonant optical spectroscopy of moir\\'e bands down to millikelvin temperatures.", "tier": "B_IMPORTANT_CONDMAT", "score": "9", "reason": "Experimental spectroscopy of MATBG flat-bands and heavy fermions; very high user relevance.; demoted from A: broad CM, not direct user/project hit", "tags": ["experiment", "spectroscopy", "MATBG", "heavyfermions"], "image": "https://arxiv.org/static/browse/0.3.4/images/arxiv-logo-fb.png", "briefing": {"background": "마법 각도 꼬인 이중층 그래핀(MATBG)은 평탄 밴드(flat-band) 구조를 통해 강력한 전자 상호작용을 나타내는 대표적인 상관관계 전자 시스템입니다. 하지만 이러한 밴드 구조를 광학적으로 측정하는 것은 실험적 난도가 매우 높습니다.", "motivation": "MATBG 내 상호작용하는 평탄 밴드 전자들의 특성을 원적외선(FIR) 분광학을 통해 직접 관측하고, 이 시스템의 빛-물질 상호작용 메커니즘을 밝히고자 했습니다.", "result": "밀리켈빈 환경에서의 FIR 분광 플랫폼을 통해 MATBG의 평탄 밴드 전자 공명을 관측했습니다. 이를 위상적 중페르미온 모델(THF)로 설명하며, 빛과 무거운 페르미온의 혼성화를 확인했습니다.", "implication": "MATBG에서 전자-전자 상호작용과 위상적 밴드 특성이 광학적 반응에 어떻게 투영되는지 명확히 했습니다. 이는 강상관 전자계의 분광학적 연구에 새로운 길을 엽니다.", "novelty": "실험적으로 접근하기 어려웠던 MATBG의 원적외선 응답을 측정하여, 이론적으로만 다루어지던 '중페르미온' 행동을 직 oi/10.1103/p21c-rtv7", "authors": "M. Khodas, Libor Šmejkal, I. I. Mazin", "last_authors": "Libor Šmejkal, I. I. Mazin", "summary": "We discuss a possibility of superconductivity in the $p$-wave magnets. These are recently discovered materials that have zero net magnetization by symmetry and finite nonrelativistic spin splitting of electron bands, like in altermagnets. Similarly, the spin polarizations are collinear in the moment…", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Theory connecting altermagnetism (spin-split bands) with p-wave superconductivity, highly relevant to user interests.", "tags": ["theory", "altermagnet", "superconductivity"], "image": "", "briefing": {"background": "Altermagnet(교대 자성체)는 비상대론적 스핀 분할을 보이면서도 순자화가 없는 독특한 자기적 위상을 가집니다. 이를 기반으로 한 새로운 초전도 메커니즘을 탐색하는 것이 현대 응집물리학의 뜨거운 주제입니다.", "motivation": "Altermagnet의 스핀 분할 대역 구조가 p-파 초전도성과 결합할 때, 전통적인 등방성 초전도체와 어떤 차별화된 물리적 현상이 나타나는지 이론적으로 분석하고자 합니다.", "result": "Altermagnet의 스핀 대칭성을 활용하여 p-파 초전도성이 발현될 가능성을 제시하였으며, 이때의 스핀 편극 거동과 초전도 상태의 관계를 도출했습니다.", "implication": "새로운 유형의 스핀-궤도 결합 없는 자성-초전도체 이종 결합 및 신물질 탐색에 중요한 가이드라인을 제공합니다.", "novelty": "Altermagnet의 핵심인 '스핀 분할 밴드'가 p-파 초전도성을 유도할 수 있다는 점을 이론적으로 규명하여, 자기 위상 물질(Magnetic topological materials) 분야와 연계 가능성을 높였습니다.", "unresolved": "이러한 p-파 초전도 상태가 실험적으로 관찰 가능한 구체적인 물질 후보군과 그들의 ARPES 밴드 특성에 대한 세부적인 예측은 더 필요합니다.", "future_work": "Altermagnet 기반 초전도 이종접합의 Josephson 효과나 Andreev 반사 실험 등 수송 물성 연구가 다음 단계로 예상됩니다.", "concepts": [{"term": "Altermagnetism", "why_emerged": "강자성체와 반강자성체의 특성을 동시에 갖는 새로운 자기 위상을 기술하기 위해 최근 도입되었습니다.", "origin": "Libor Šmejkal et al. (2022)", "connections": "Spin-split bands, 비상대론적 스핀 분할, 자성 위상 물질."}, {"term": "p-파 초전도성", "why_emerged": "쿠퍼 쌍의 궤도 각운동량이 1인 상태로서 비전통적 초전도성을 설명하기 위해 필요합니다.", "origin": "Balian and Werthamer (1963)", "connections": "위상 초전도체, Majorana Fermion, 강상관 전자계."}], "english_summary": ["Theoretical study on p-wave superconductivity in altermagnets.", "Exploits nonrelativistic spin splitting in materials with zero net magnetization.", "Bridges the gap between altermagnetism and unconventional superconductivity.", "Suggests new directions for identifying non-traditional superconducting phases."]}}, {"title": "One-dimensional electronic states in a moiré superlattice of twisted bilayer WTe2", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/bzwr-6m2d", "authors": "Takuto Kawakami, Hayato Tateishi, Daiki Yoshida, et al.", "last_authors": "Koichiro Kato, Mikito Koshino", "summary": "Most moiré superlattices studied to date are two-dimensional, but a recently discovered one-dimensional counterpart raises the question of whether it can host genuinely one-dimensional electronic states. Here, the authors show that lattice relaxation in twisted bilayer WTe 2 generates nearly one-dimensional electronic bands and reveal the microscopic origin of this behavior. They also develop a general theoretical framework for understanding and predicting one-dimensional moiré superlattices in a broad class of anisotropic layered materials.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Focuses on moire superlattices and electronic structure in twisted bilayer WTe2.", "tags": ["moir", "twistedbilayer", "material"], "image": "", "briefing": {"background": "모아레 격자는 주로 그래핀이나 TMD와 같은 2차원 적층 구조에서 형성되며, 평면 내의 주기적 포텐셜을 통해 새로운 전자 상태를 유도합니다. 최근에는 비등방성 물질을 이용한 1차원적 모아레 구조에 대한 관심이 커지고 있습니다.", "motivation": "뒤틀린 WTe2 이중층에서 격자 이완이 발생할 때 1차원적인 전자 밴드가 형성될 수 있는지, 그리고 그 미시적 기원을 이론적으로 규명하고자 합니다.", "result": "이 논문은 격자 이완이 실제로 1차원 전자 밴드를 생성함을 보이고, 이러한 현상을 예측하기 위한 일반적인 이론적 프레임워크를 제시하였습니다.", "implication": "다양한 비등방성 층상 물질에서 1차원 모아레 초격자를 설계할 수 있는 토대를 마련하여, 향후 1차원 전자계 물성 연구의 지표가 될 것입니다.", "novelty": "기존의 2차원 모아레 시스템에서 벗어나 비등방성 물질인 WTe2를 통해 1차원적 물리 현상을 탐구했다는 점이 본 독자의 관심사인 준1차원 물질 연구와 밀접하게 맞닿아 있습니다.", "unresolved": "이론적 모델이 실제 실험적 밴드 구조(예: ARPES 측정 결과)와 정량적으로 얼마나 일치하는지에 대한 검증이 필요합니다.", "future_work": "제시된 이론 모델을 바탕으로 다른 비등방성 층상 물질에서의 1차원 모아레 격자 상태를 예측하고 실험적으로 검증하는 과정이 필요합니 , "tags": ["theory", "kagome", "skyrmion"], "image": "", "briefing": {"background": "카고메 격자는 기하학적 좌절(geometrical frustration)로 인해 흥미로운 자기적 상태를 구현하는 물리적 플랫폼입니다. 여기서 유도되는 스커미온과 같은 위상학적 스핀 텍스처는 스핀트로닉스 응용 가능성 때문에 큰 주목을 받고 있습니다.", "motivation": "외부 변수인 기계적 변형(strain)을 사용하여 카고메 격자 내의 스커미온과 안티스커미온 유체의 안정성과 위상학적 구조 전이를 제어할 수 있는지를 이론적으로 규명하고자 합니다.", "result": "기계적 변형이 카고메 격자의 자기적 상호작용을 튜닝하여, 특정 조건에서 스커미온과 안티스커미온 유체의 상태를 조절할 수 있음을 보였습니다.", "implication": "물리적 압력이나 변형을 통해 스핀 텍스처를 동적으로 제어함으로써, 차세대 스핀 기반 소자 설계의 유연성을 높일 수 있는 이론적 토대를 제공합니다.", "novelty": "카고메 금속(AV3Sb5 등)에서 스핀 텍스처의 위상학적 성질을 변형을 통해 제어 가능하다는 점을 강조하며, 이는 고체 물리 연구자가 구조적 자유도를 활용하는 방식을 확장합니다.", "unresolved": "실제 합성된 카고메 화합물에서의 격자 변형 정도가 스핀 텍스처를 조절하기에 충분한 크기인지에 대한 실험적 검증이 필요합니다.", "future_work": "실제 소재에서 외부 변형을 가했을 때 나타나는 위상학적 스핀 구조를 직접 관측하는 실험(예: Lorentz TEM 등)이 기대됩니다.", "concepts": [{"term": "카고메 격자", "why_emerged": "기하학적 좌절을 통해 양자 스핀 액체나 특이한 자기적 상태를 구현하기 위해.", "origin": "수학적인 타일링 패턴에서 유래되었으나, 고체물리에서는 20세기 중반부터 본격 연구됨.", "connections": "AV3Sb5 계열, 기하학적 좌절, 양자 스핀 액체."}, {"term": "스커미온(Skyrmion)", "why_emerged": "비자명한 위상학적 꼬임(winding number)을 가진 준입자로서의 안정성 확보를 위해.", "origin": "Tony Skyrme(1962), 고체물리에서는 2009년 MnSi에서 최초 발견.", "connections": "위상학적 홀 효과, 스핀트로닉스."}], "english_summary": ["Investigates spin textures in chiral kagome lattices using mechanical strain.", "Shows that strain can control transitions between skyrmion and antiskyrmion fluids.", "Provides theoretical insight into tuning topological magnetic states.", "Relevant to kagome materials like AV3Sb5 for potential spintronic applications."]}}, {"title": "Variational study of the magnetization plateaus in the spin-12 kagome Heisenberg antiferromagnet: An approach from vision transformer neural quantum states", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/xyzw-jtn1", "authors": "Andreas Raikos, Sylvain Capponi, Fabien Alet", "last_authors": "Sylvain Capponi, Fabien Alet", "summary": "We analyze the magnetization curve of th 10.1103/zlzx-qty2", "authors": "Rustem Khasanov, Hubertus Luetkens, Nikolai D. Zhigadlo", "last_authors": "Hubertus Luetkens, Nikolai D. Zhigadlo", "summary": "Here, the authors use zero- and transverse-field muon-spin rotation/relaxation to probe multiband, multigap superconductivity in Li 0 . 95 FeAs, a representative 111-family Fe-based superconductor. They find no detectable time-reversal-symmetry breaking and a bulk superfluid response consistent with nodeless superconductivity. By comparing the measured superfluid density with band weights derived from published photoemission studies, they show that sheets carrying intermediate and small gaps dominate, while the largest-gap sheet contributes only weakly, reconciling gap scales reported by bulk- and surface-sensitive probes.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Examines Fe-based superconductivity and reconciles bulk response with ARPES-derived band weights.", "tags": ["experiment", "superconductivity", "photoemission"], "image": "", "briefing": {"background": "LiFeAs는 철계 초전도체 중 하나로, 도핑 없이 초전도성을 나타내는 등 독특한 전자 구조를 가지고 있어 전자 상관관계 연구의 핵심 물질입니다.", "motivation": "LiFeAs의 초전도 갭 구조와 시간 반전 대칭성 파괴 여부를 bulk와 surface 탐침 간의 데이터 차이를 해결하기 위해 연구함.", "result": "μSR 실험 결과 시간 반전 대칭성 파괴는 관찰되지 않았으며, 큰 갭을 가진 밴드보다는 중간/작은 갭을 가진 밴드가 초전도성에 주도적임을 확인.", "implication": "표면 민감성 측정인 ARPES와 벌크 민감성 측정인 μSR 간의 일관성을 확보하여, 철계 초전도체의 다중 밴드 초전도 기작을 명확히 함.", "novelty": "단순한 물리량 측정을 넘어, ARPES 밴드 가중치와 벌크 초전도성을 통합적으로 비교하여 해석했다는 점이 본 연구의 가치임.", "unresolved": "가장 큰 갭을 가진 밴드가 왜 벌크 초전도성에는 기여도가 낮은지에 대한 물리적 근거를 완벽히 해결하지는 못함.", "future_work": "다양한 도핑 및 압력 조건에서 유사한 실험을 수행하여 밴드 가중치 변화 추적.", "concepts": [{"term": "μSR(뮤온 스핀 회전)", "why_emerged": "물질 내부의 미세 자기장 분포와 초전도 상태의 불균일성을 측정하기 위해.", "origin": "1970년대 이후 응집물질물리학에서 정착.", "connections": "초전도 페네트레이션 깊이, 자기적 위상 전이."}, {"term": "시간 반전 대칭성 파괴", "why_emerged": "특이 초전도체나 자성 초전도체에서 질서 변수를 분류하기 위해.", "origin": "BCS 이론 이후 초전도성 대칭성 연구에서 발전.", "connections": "카이랄 초전도성, 위상학적 초전도체."}], "english_summary": ["Performs μSR study on Li0.95FeAs to probe superconductivity.", "Finds no time-reversal symmetry breaking.", "Reconciles bulk superfluid response with ARPES band weights.", "Shows small and intermediate gaps dominate bulk superconductivity."]}}, {"title": "Bilayer Borophenes Establish a New Upper Limit for Elemental Superconducting Transition Temperatures", "journal": "PRL_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/8l19-rdn2", "authors": "Meng-hui Wang, Yuewen Mu, Guang-ren Na, Hao-lin Song, Zhong-hua Cui", "last_authors": "Hao-lin Song, Zhong-hua Cui", "summary": "Elemental superconductors serve as essential model systems because their compositional simplicity enables fundamental mechanisms to be probed with minimal extrinsic complexity. Their superconducting transition temperatures (${T}_{\\mathrm{c}}$), however, are generally low, with the notable exception …", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Experimental report of record superconducting transition temperature in a 2D elemental material.", "tags": ["superconductivity", "borophene", "2Dmaterials"], "image": "", "briefing": {"background": "원소 초전도체는 구성이 단순하여 근본적인 초전도 메커니즘을 연구하는 모델 시스템으로 활용됩니다. 그러나 대부분의 원소 초전도체는 낮은 초전도 전이 온도(Tc)를 가지는 한계가 있습니다.", "motivation": "2D 소재인 붕소(Borophene) 동소체에서 기존의 한계를 뛰어넘는 높은 전이 온도를 달성하고자 하는 것이 본 연구의 주요 동기입니다.", "result": "이중층 붕소 구조에서 기존 원소 초전도체 중 가장 높은 Tc를 달성하였으며, 이는 2D 붕소계 물질이 고온 초전도 연구의 새로운 플랫폼이 될 수 있음을 시사합니다.", "implication": "단순 원소 결정 구조로도 고온 초전도를 구현할 수 있음을 입증하며, 향후 2D 소재 기반의 초전도 소자 설계에 중요한 기초가 될 것으로 보입니다.", "novelty": "2D 원소 물질에서 새로운 Tc 상한선을 제시했다는 점에서 차별성이 있으며, 독자님의 관심사인 2D 및 강상관계 물질 연구와 직접적으로 연결됩니다.", "unresolved": "실제 실험적 합성 시의 안정성 문제와 다양한 기판과의 상호작용이 Tc에 미치는 영향은 여전히 숙제입니다.", "future_work": "실제 실험을 통한 합성 확인 및 기판 유도 효과를 조절하여 Tc를 극대화하는 연구가 필요합니다.", "concepts": [{"term": "Borophene", "why_emerged": "그래핀과 같은 2D 소재 탐색 과정에서 풍부한 화학적 결합력을 가진 붕소의 2D 구조 가능성이 제기됨.", "origin": "2015년 Mannix et al.에 의해 실험적으로 처음 합성됨.", "connections": "그래핀, 2D 금
