<!DOCTYPE html>

<meta name='viewport' content='width=device-width, initial-scale=1.0'>
<title>Daily Paper Slideshow</title>
<style>
  :root {
    color-scheme: light;
    --bg: #f6f7f4;
    --paper: #ffffff;
    --ink: #111827;
    --muted: #64748b;
    --line: #d8ddd2;
    --accent: #176b87;
    --accent-2: #9a3412;
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; overflow: auto; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: var(--bg); color: var(--ink); }
  .shell { max-width: 1500px; min-height: 100vh; margin: 0 auto; padding: 14px 18px; display: flex; flex-direction: column; }
  .topbar { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 16px; }
  .top-actions { display: flex; align-items: center; gap: 10px; }
  .topbar a, button { border: 1px solid var(--line); border-radius: 8px; background: var(--paper); color: var(--ink); padding: 10px 14px; font-weight: 700; text-decoration: none; cursor: pointer; }
  button.primary { background: var(--accent); border-color: var(--accent); color: white; }
  button:disabled { opacity: 0.45; cursor: not-allowed; }
  .counter { color: var(--muted); font-weight: 700; }
  .slide { min-height: calc(100vh - 82px); background: var(--paper); border: 1px solid var(--line); border-radius: 10px; padding: 18px; box-shadow: 0 18px 42px rgba(15, 23, 42, 0.10); display: grid; grid-template-columns: minmax(310px, 0.86fr) minmax(0, 1.55fr); gap: 18px; overflow: visible; }
  .paper-head { min-width: 0; min-height: 0; overflow: visible; display: flex; flex-direction: column; gap: 12px; }
  .figure { margin: 0; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: #f8fafc; }
  .figure img { display: block; width: 100%; max-height: 41vh; object-fit: contain; background: white; }
  .figure figcaption { padding: 7px 10px; color: var(--muted); font-size: 12px; line-height: 1.3; }
  .head-text { display: flex; flex-direction: column; gap: 9px; min-width: 0; }
  .badges { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .badge { border-radius: 999px; padding: 5px 9px; background: #eef2ff; color: #3730a3; font-size: 12px; font-weight: 800; }
  .score { background: #fee2e2; color: #991b1b; }
  h1 { margin: 0; font-size: 25px; line-height: 1.15; letter-spacing: 0; overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
  h1 a { color: inherit; text-decoration-color: rgba(23, 107, 135, 0.35); text-decoration-thickness: 2px; text-underline-offset: 4px; }
  h1 a:hover { color: var(--accent); text-decoration-color: var(--accent); }
  .meta, .authors, .why, .abstract { font-size: 13px; line-height: 1.45; }
  .meta, .authors { color: var(--muted); }
  .why strong, .abstract strong, .authors strong { color: var(--ink); }
  .authors { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .why { border-left: 4px solid var(--accent-2); padding-left: 10px; color: #374151; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .abstract { border-top: 1px solid var(--line); padding-top: 14px; color: #374151; }
  .original-abstract { border-top: 1px solid var(--line); padding-top: 10px; color: #374151; font-size: 11.5px; line-height: 1.35; overflow-wrap: anywhere; }
  .original-abstract strong { display: block; margin-bottom: 4px; color: var(--ink); }
  .tags { display: flex; flex-wrap: wrap; gap: 8px; }
  .tag { border-radius: 999px; padding: 4px 8px; background: #f1f5f9; color: #475569; font-size: 12px; font-weight: 700; }
  .head-text > .link { display: none; }
  .briefing { min-width: 0; min-height: 0; overflow: visible; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); grid-auto-rows: minmax(0, auto); align-content: start; gap: 11px 18px; border-top: 0; padding-top: 0; }
  .brief-section { min-width: 0; }
  .brief-section.wide { grid-column: 1 / -1; }
  .brief-section h2 { margin: 0 0 4px; font-size: 14px; line-height: 1.22; color: #0f766e; letter-spacing: 0; }
  .brief-section p, .brief-section li { margin: 0; font-size: 12.5px; line-height: 1.42; color: #1f2937; overflow-wrap: anywhere; }
  .brief-section ul { margin: 0; padding-left: 20px; }
  .concepts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 9px 14px; }
  .concept { border-top: 1px solid var(--line); padding-top: 7px; }
  .concept h3 { margin: 0 0 4px; font-size: 13px; color: #7c2d12; letter-spacing: 0; }
  .concept p { margin: 2px 0 0; font-size: 11.5px; line-height: 1.35; color: #374151; overflow-wrap: anywhere; }
  .concept b { color: #111827; }
  .link { color: var(--accent); font-weight: 800; text-decoration: none; }
  .empty { padding: 48px; background: var(--paper); border: 1px solid var(--line); border-radius: 12px; color: var(--muted); }
  @media (max-width: 860px) {
    .shell { padding: 14px; }
    .topbar, .top-actions { align-items: stretch; flex-direction: column; }
    .slide, .briefing, .concepts { grid-template-columns: 1fr; }
    .slide { min-height: auto; overflow: visible; display: grid; }
    h1 { font-size: 28px; }
  }
</style>

<script>
const slides = [{"title": "Electronic Origin of Delicate Antiferromagnetism in FexNbS2", "journal": "PRL_Recent", "source": "author whitelist", "link": "http://link.aps.org/doi/10.1103/99yr-nqbx", "authors": "Wenxin Li, Jonathan T. Reichanadter, Shan Wu, et al.", "last_authors": "Jeffrey B. Neaton, Yu He", "summary": "Author(s): Wenxin Li, Jonathan T. Reichanadter, Shan Wu, Ji Seop Oh, Rourav Basak, Shannon C. Haley, Siqi Wang, Joshua E. Chaparro Mata, Elio Vescovo, Donghui Lu, Makoto Hashimoto, Christoph Klewe, Suchismita Sarker, Jessica L. McChesney, Alex Frañó, James G. Analytis, Robert J. Birgeneau, Jeffrey B. Neaton, and Yu He A combination of ARPES, XAS, and DFT shows a dramatic eV-scale electronic restructuring in Fe x NbS 2 , similar to what happens in correlated oxides, and suggests electronic correlations play a central role in the magnetism of Fe-intercalated transition-metal dichalcogenides. [Phys. Rev. Lett. 136, 216503] Published Wed May 27, 2026", "tier": "A_MUST_READ", "score": "10", "reason": "author whitelist: Donghui Lu", "tags": ["ARPES", "STS", "correlated", "ferromagnet", "antiferromagnet"], "image": "", "briefing": {"background": "전이금속 디칼코게나이드(TMD) 층 사이에 자성 원자를 삽입(intercalation)하는 것은 저차원 자성 및 전자 상관관계를 연구하는 주요 방법입니다. 특히 FexNbS2 시스템은 삽입된 Fe의 농도에 따라 복잡한 자성 상태를 보이며, 이를 설명하기 위한 전자 구조의 근본적인 이해가 필요합니다.", "motivation": "FexNbS2에서 나타나는 미세한 반강자성(AFM)의 기원을 밝히기 위해, 단순한 단일 입자 모델을 넘어선 강한 전자 상관관계의 역할을 ARPES와 XAS 등을 통해 확인하고자 했습니다.", "result": "ARPES, XAS 및 DFT 계산을 종합한 결과, FexNbS2에서 eV 단위의 대규모 전자 구조 재편(restructuring)이 발견되었습니다. 이는 강상관 산화물에서 관찰되는 현상과 유사하며, 전자 상관관계가 Fe-intercalated TMD의 자성 형성에 핵심적인 역할을 한다는 점을 시사합니다.", "implication": "이 결과는 intercalated TMD 시스템을 약한 결합(weak coupling) 이론으로만 설명하기 어렵다는 것을 보여주며, 향후 이들 물질의 자성 및 수송 특성을 해석할 때 강상관 효과를 반드시 고려해야 함을 의미합니다.", "novelty": "이 연구는 ARPES를 통해 메브(meV) 수준이 아닌 이브이(eV) 수준의 거대한 밴드 재편을 직접 관찰함으로써, TMD 시스템에서도 산화물에 필적하는 강한 상관관계가 존재함을 입증했습니다. ARPES 데이터가 핵심 증거로 사용되어 사용자 관심도와 매우 부합합니다.", "unresolved": "eV 규모의 거대한 전자 구조 변화가 어떻게 '미세한(delicate)' 자성 전이 온도나 특정 자기 구조로 연결되는지에 대한 정량적 연결 고리는 더 연구가 필요합니다.", "future_work": "다른 전이금속이 삽입된 TMD 시스템에서도 유사한 상관관계 유도 전자 재편이 나타나는지 탐색하고, 이를 조절하여 새로운 자성 상태를 구현하는 연구가 기대됩니다.", "concepts": [{"term": "Electronic Restructuring", "why_emerged": "상호작용이 없는 밴드 이론과 실제 측정된 에너지 밴드 사이의 거대한 차이를 설명하기 위해 도입되었습니다.", "origin": "강상관 전자계(예: 모트 절연체, 구리 산화물) 연구에서 정립되었습니다.", "connections": "Hubbard 모델, Mott transition, spectral weight transfer"}, {"term": "Intercalation", "why_emerged": "2차원 층상 물질의 특성을 제어하거나 새로운 기능성(자성, 초전도)을 부여하기 위해 화학적 종을 층 사이에 끼워넣는 기법입니다.", "origin": "초록 정보만으로는 특정하기 어려움 (화학 및 재료 과학의 고전적 기법)", "connections": "TMD, Graphite intercalation compounds, 2D materials"}, {"term": "ARPES", "why_emerged": "물질 내부 전자의 에너지와 운동량 관계(밴드 구조)를 직접 시각화하기 위해 개발되었습니다.", "origin": "광전효과에 기반하며, 1980년대 이후 고온 초전도체 연구와 함께 급격히 발전했습니다.", "connections": "Fermi surface, Quasiparticle, Band dispersion"}], "english_summary": ["ARPES and XAS reveal an eV-scale electronic restructuring in Fe-intercalated NbS2.", "The results suggest that electronic correlations, similar to those in oxides, drive the magnetism in this TMD system.", "This challenges weak-coupling models for intercalated TMDs and emphasizes the importance of strong correlation effects."]}}, {"title": "Symmetry-Broken Ground State and Phonon-Mediated Superconductivity in Kagome CsV3Sb5", "journal": "PRL_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/4r8x-j3nd", "authors": "Manex Alkorta, Martin Gutierrez-Amigo, Đorđe Dangić, et al.", "last_authors": "Maia G. Vergniory, Ion Errea", "summary": "Author(s): Manex Alkorta, Martin Gutierrez-Amigo, Đorđe Dangić, Chunyu Mark Guo, Philip J. W. Moll, Maia G. Vergniory, and Ion Errea The newly discovered family of nonmagnetic kagome metals ${\\mathrm{AV}}_{3}{\\mathrm{Sb}}_{5}$ ($\\mathrm{A}=\\mathrm{K}$, Rb, or Cs) provides a unique platform for exploring the interplay between charge-density wave (CDW) order, superconductivity, nontrivial topology, and spontaneous time-reversal sym… [Phys. Rev. Lett. 136, 206401] Published Fri May 22, 2026", "tier": "A_MUST_READ", "score": "10", "reason": "Direct relevance to kagome metals, CDW, and superconductivity in CsV3Sb5.", "tags": ["CsV3Sb5", "kagome", "CDW", "superconductivity"], "image": "", "briefing": {"background": "최근 발견된 AV3Sb5(A=K, Rb, Cs) 카고메 금속은 카고메 격자 특유의 플랫 밴드, 디락 콘과 더불어 전하 밀도파(CDW)와 초전도가 공존하여 응집물질 물리학의 핵심 연구 대상으로 급부상했습니다.", "motivation": "CsV3Sb5의 기저 상태에서 나타나는 대칭성 붕괴의 본질을 규명하고, 초전도 현상이 기존의 포논 매개 기작으로 설명 가능한지 아니면 비전통적인 기작인지 확인하고자 했습니다.", "result": "이 연구는 CsV3Sb5에서 대칭성이 붕괴된 기저 상태 내에서 초전도 현상이 포논 매개(phonon-mediated) 기작에 의해 발생한다는 증거를 제시했습니다. 특히 CDW와 초전도의 복잡한 얽힘 속에서도 격자 진동의 역할을 강조했습니다.", "implication": "이 결과가 맞다면 CsV3Sb5의 초전도 자체는 전통적인 BCS 이론의 범주 내에 있을 가능성이 높으며, 다만 그 배경이 되는 전자 구조가 CDW에 의해 비자명하게 변형된 상태임을 뜻합니다.", "novelty": "독자의 주요 관심사인 CsV3Sb5 시스템에서 대칭성 붕괴와 초전도 메커니즘을 직접 다루고 있습니다. 비전통적 초전도 가능성이 제기되는 상황에서 포논 매개설에 힘을 실어주는 결과입니다.", "unresolved": "실험적으로 보고된 시간 반전 대칭성 붕괴(TRSB) 신호와 포논 매개 초전도 기작이 어떻게 정합성을 이룰 수 있는지에 대한 추가적인 논의가 필요합니다.", "future_work": "다양한 압력이나 도핑 조건에서 포논 스펙트럼과 초전도 전이 온도의 상관관계를 정밀 측정하여 본 이론적 제안을 검증하는 실험이 예상됩니다.", "concepts": [{"term": "Kagome Metal", "why_emerged": "기하학적 좌절(frustration)과 특이한 위상적 밴드 구조를 동시에 탐구할 수 있는 플랫폼으로 주목받았습니다.", "origin": "일본의 대나무 바구니 패턴(Kagome)에서 유래한 격자 구조 연구에서 시작되었습니다.", "connections": "Flat band, Dirac fermion, Frustrated magnetism"}, {"term": "Charge Density Wave (CDW)", "why_emerged": "저차원 금속에서 전자-포논 상호작용 등에 의해 전자 밀도가 주기적으로 변조되는 현상을 설명하기 위해 도입되었습니다.", "origin": "Peierls가 1D 금속의 불안정성을 제안하며 정립되었습니다.", "connections": "Peierls instability, Fermi surface nesting, Symmetry breaking"}, {"term": "Phonon-mediated Superconductivity", "why_emerged": "금속 내 전자들이 격자 진동(포논)을 매개로 쌍을 이루어 저항이 사라지는 현상을 설명하기 위한 표준 모델입니다.", "origin": "Bardeen, Cooper, Schrieffer (BCS theory, 1957)", "connections": "Cooper pair, Electron-phonon coupling, Isotope effect"}], "english_summary": ["The study investigates the symmetry-broken ground state and superconductivity in kagome CsV3Sb5.", "Results point towards a phonon-mediated mechanism for superconductivity within the CDW phase.", "Provides insight into the competition and coexistence of CDW and SC in kagome systems."]}}, {"title": "Engineering magnetic anisotropy and ferromagnetism in the topological kagome metal GdV6Sn6 via Nd substitution", "journal": "PRB_Recent", "source": "keyword", "link": "http://link.aps.org/doi/10.1103/4z1d-42vv", "authors": "Santosh Karki Chhetri, M. M. Sharma, Jian Wang, et al.", "last_authors": "Md Rafique Un Nabi, Jin Hu", "summary": "Author(s): Santosh Karki Chhetri, M. M. Sharma, Jian Wang, Dinesh Upreti, Gokul Acharya, Md Rafique Un Nabi, and Jin Hu Rare-earth engineering offers a route to tune the coupling between magnetism and transport in kagome metals. Here, the authors show that replacing Gd with Nd in GdV 6 Sn 6 preserves the V-based kagome framework while switching the magnetic anisotropy from easy plane to easy axis. Magnetotransport crosses over from spin-scattering-driven negative magnetoresistance at low fields to positive orbital magnetoresistance at high fields, accompanied by a twofold-to-fourfold angular evolution that disentangles magnetic and electronic anisotropy. [Phys. Rev. B 113, 224417] Published Thu Jun 04, 2026", "tier": "A_MUST_READ", "score": "9", "reason": "title strong match: kagome metal", "tags": ["kagome", "topological", "ferromagnet", "transport"], "image": "", "briefing": {"background": "RV6Sn6(R=희토류) 계열의 카고메 금속은 희토류 원소의 자성과 V 격자의 전자 구조가 결합되어 다양한 자기-수송 특성을 조절할 수 있는 유망한 재료입니다.", "motivation": "GdV6Sn6에서 Gd를 Nd로 치환함으로써 자기 이방성(magnetic anisotropy)을 제어하고, 이것이 전자의 수송 특성에 어떤 영향을 미치는지 밝히고자 했습니다.", "result": "Nd 치환을 통해 자화 용이축이 면내(easy-plane)에서 축 방향(easy-axis)으로 바뀜을 확인했습니다. 이에 따라 저자기장에서는 스핀 산란에 의한 음의 자기저항이 나타나고, 고자기장에서는 양의 궤도 자기저항으로 전환되는 거동을 관찰했습니다.", "implication": "희토류 엔지니어링을 통해 카고메 금속의 자기 이방성을 정밀하게 조절할 수 있음을 보여주었으며, 이는 베리 곡률(Berry curvature)과 관련된 이상 홀 효과 등의 제어 가능성을 시사합니다.", "novelty": "1-6-6 카고메 시스템에서 자기 이방성을 '엔지니어링'하는 구체적인 경로를 제시했습니다. 특히 리학의 공존 가능성을 시사합니다.", "novelty": "기존에 논란이 많았던 Fe3GeTe2의 미시적 전자 상태를 매우 낮은 온도에서 STM으로 분해하여, 전자 구조의 기원을 콘도 물리학적 관점에서 해석한 점이 중요합니다.", "unresolved": "표면 상태와 벌크 특성 사이의 차이점, 그리고 구체적인 콘도 상호작용의 에너지 스케일이 여전히 불분명합니다.", "future_work": "다른 112 텔루라이드 계열 물질과의 비교 연구를 통해 콘도 격자 거동의 보편성을 확인하고, 자기장 하에서의 STS 변화 관찰이 필요합니다.", "concepts": [{"term": "콘도 격자 (Kondo Lattice)", "why_emerged": "국소 자기 모멘트와 전도 전자 사이의 상호작용(콘도 효과)이 격자 전체에서 주기적으로 일어나는 현상을 설명하기 위해 제안.", "origin": "1960년대 초 Jun Kondo의 단일 불순물 효과 연구를 격자 모델로 확장.", "connections": "중페르미온(Heavy Fermion) 시스템과 깊은 연관."}, {"term": "반데르발스 자성체", "why_emerged": "원자층 단위로 박리가 가능하면서도 고유한 자기 질서를 유지하는 신물질 연구를 위해 등장.", "origin": "2017년 전후 CrI3, CrGeTe3 등의 발견으로 촉발.", "connections": "2D 자성, 스핀트로닉스 응용 연구."}], "english_summary": ["Low-temperature STM/STS study of Fe3GeTe2 surface.", "Identifies signatures consistent with Kondo-lattice behavior.", "Clarifies the microscopic electronic structure of this paradigm van der Waals magnet."]}}, {"title": "Electronic Layer Decoupling Driven by Density-Wave Order in La4Ni3O10", "journal": "PRL_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/qgl1-zh9f", "authors": "Ziqiang Guan (管梓强), Sophia F. R. TenHuisen, M. Tepie, et al.", "last_authors": "Christopher C. Homes, Matteo Mitrano", "summary": "Author(s): Ziqiang Guan (管梓强), Sophia F. R. TenHuisen, M. Tepie, Yifeng Zhao (赵祎峰), Ezra Day-Roberts, Harrison LaBollita, Alexander M. Young, Xiaomeng Cui (崔宵萌), Xinglong Chen (陈幸龙), Filippo Glerean, Carl Audric Guia, Mark P. M. Dean, Philip Kim, J. F. Mitchell, Antia S. Botana, Christopher C. Homes, and Matteo Mitrano We probe the density-wave transition of the trilayer nickelate ${\\mathrm{La}}_{4}{\\text{Ni}}_{3}{\\mathrm{O}}_{10}$ with polarization-resolved infrared spectroscopy. The low-energy electrodynamics is strongly anisotropic, with metallic in-plane and insulating out-of-plane character. In the ordered ph… [Phys. Rev. Lett. 136, 216501] Published Tue May 26, 2026", "tier": "B_IMPORTANT_CONDMAT", "score": "9", "reason": "Spectroscopic investigation of electronic order in a relevant nickelate system.", "tags": ["nickelate", "spectroscopy", "electronicstructure"], "image": "", "briefing": {"background": "니켈산염(Nickelate) 시스템은 큐프레이트와 유사한 전자 구조를 가지면서도 독특한 d-전자 상관관계를 보여 고온 초전도 연구의 주요 타겟입니다.", "motivation": "삼층 니켈산염 La4Ni3O10에서 나타나는 밀도파(Density-Wave) 전이의 특성을 분광학적 방법으로 상세히 분석하고자 했습니다.", "result": "편광 분해 적외선 분광법을 통해 이 물질이 밀도파 상태에서 평면 내(in-plane) 금속성과 평면 간(out-of-plane) 절연성을 보이는 전자적 층 분리(decoupling) 현상을 발견했습니다.", "implication": "층상 니켈산염의 2차원적 전자 구조가 밀도파 질서에 의해 어떻게 변조되는지 입증했으며, 이는 니켈산염의 초전도 기제 연구에 중요한 단서를 제공합니다.", "novelty": "적외선 분광법을 통해 정밀하게 전자적 층 분리 현상을 포착하였으며, 이는 고에너지 물리학적 관점(DFT+DMFT 등)에서의 전자 상관관계 모델에 강력한 제약 조건을 제공합니다.", "unresolved": "밀도파 형성의 직접적인 원동력(Nested Fermi surface vs 강한 전자 상관관계)에 대한 논쟁이 여전히 존재합니다.", "future_work": "이러한 층 분리 현상이 초전도 상태와 어떻게 경쟁하거나 협력하는지, 고압이나 도핑 환경에서의 추가 연구가 필요합니다.", "concepts": [{"term": "밀도파 (Density-Wave)", "why_emerged": "전자의 전하 밀도 또는 스핀 밀도가 격자의 주기성을 따라 공간적으로 변조되는 기저 상태를 설명하기 위해 도입.", "origin": "Peierls, Overhauser 등에 의해 제안.", "connections": "CDW, SDW 등 위상적 성질과 긴밀히 연관."}, {"term": "적외선 분광법", "why_emerged": "물질 내 저에너지 전자 여기(excitation)와 광학적 전도도를 비파괴적으로 정밀 측정하기 위해 활용.", "origin": "분광학적 물리학 기초.", "connections": "DRS, 갭 구조 측정, 플라즈몬 연구와 연결."}], "english_summary": ["Investigation of La4Ni3O10 trilayer nickelate using polarization-resolved IR spectroscopy.", "Reveals electronic decoupling between metallic in-plane and insulating out-of-plane states.", "Driven by density-wave ordering, providing new insights for nickelate superconductivity."]}}, {"title": "Evidence of Chiral Fermion Edge Modes through Geometric Engineering of Thermal Hall Effect in α−RuCl3", "journal": "PRL_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/rn48-7j6y", "authors": "Heda Zhang, Gábor B. Halász, Sujoy Ghosh, et al.", "last_authors": "Michael A. McGuire, Jiaqiang Yan", "summary": "Author(s): Heda Zhang, Gábor B. Halász, Sujoy Ghosh, Stephen Jesse, Thomas Z. Ward, David A. Tennant, Michael A. McGuire, and Jiaqiang Yan The experimental observation of half-integer-quantized thermal Hall conductivity in the Kitaev candidate material $α\\text{−}{\\mathrm{RuCl}}_{3}$ has served as a signature of non-Abelian anyons through an associated chiral Majorana edge mode. However, both the reproducibility of the quantized thermal… [Phys. Rev. Lett. 136, 226301] Published Mon Jun 01, 2026", "tier": "B_IMPORTANT_CONDMAT", "score": "9", "reason": "Significant evidence for Majorana edge modes in a key Kitaev quantum magnet.", "tags": ["material", "topological", "Majorana"], "image": "", "briefing": {"background": "α-RuCl3는 Kitaev 양자 스핀 액체 후보 물질로, 자기장이 걸렸을 때 나타나는 반정수 양자화 열 홀 효과가 비아벨 애니온(Non-Abelian anyon)과 카이랄 마요라나 에지 모드의 증거로 여겨져 왔습니다.", "motivation": "기존 열 홀 효과 데이터의 재현성 및 해석에 대한 논란이 지속됨에 따라, 물리적인 기하학적 제어를 통해 카이랄 페르미온 에지 모드의 존재를 명확히 검증하고자 함.", "result": "α-RuCl3의 기하학적 설계를 통해 열 홀 효과를 제어함으로써, 논란이 되었던 비아벨 애니온 유래 에지 모드의 존재에 대한 강력한 실험적 증거를 확보함.", "implication": "Kitaev 양자 스핀 액체 물질에서 토폴로지적 양자 계산의 핵심인 마요라나 상태를 실험적으로 확실하게 증명할 수 있는 길을 열었음.", "novelty": "단순 측정을 넘어 기하학적 엔지니어링을 도입하여 관측된 물리량의 토폴로지적 기원을 명확히 분리해냄.", "unresolved": "데이터 재현성 문제의 근본적인 원인과 외부 노이즈(포논 등) 기여도를 완전히 배제하는 표준화 절차는 여전히 과제로 남아있음.", "future_work": "다른 Kitaev 후보 물질에 대한 기하학적 설계 적용 및 더 낮은 온도에서의 열 홀 전도도 정밀 측정.", "concepts": [{"term": "Kitaev Quantum Spin Liquid", "why_emerged": "벌집 격자에서 스핀 간의 이방성 교환 상호작용으로 인해 기하학적 좌절을 일으켜 스핀이 정렬하지 않는 상태를 기술하기 위해 필요.", "origin": "Alexei Kitaev (2006)", "connections": "Majorana fermion, Honeycomb lattice, Mott insulators"}, {"term": "Chiral Majorana Edge Mode", "why_emerged": "양자 스핀 액체 시스템의 경계에서 나타나는 토폴로지적 들뜸 상태를 설명하기 위해 도입됨.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "Non-Abelian anyons, Thermal Hall effect"}], "english_summary": ["Provides geometric engineering evidence for chiral Majorana edge modes in alpha-RuCl3.", "Addresses reproducibility issues of the half-integer quantized thermal Hall effect.", "Strengthens the case for Kitaev quantum spin liquid behavior in this material.", "Utilizes structural control to confirm the topological origin of thermal transport."]}}, {"title": "Multiband superconductivity in the kagome-lattice superconductor Re2Zr", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2606.07184", "authors": "Gabriel Kuderowicz, Bartlomiej Wiendlocha", "last_authors": "Gabriel Kuderowicz, Bartlomiej Wiendlocha", "summary": "arXiv:2606.07184v1 Announce Type: new Abstract: We present a first-principles investigation of the electronic structure, lattice dynamics, electron-phonon coupling, and superconducting properties of the hexagonal kagome-lattice compound Re$_2$Zr, in which time-reversal symmetry breaking and unconventional pairing have recently been proposed. We examine whether superconductivity in Re$_2$Zr can be explained within a conventional phonon-mediated framework by performing fully ab initio calculations within the density functional theory for superconductors. The electronic structure is characterized by a mixture of seven two- and three-dimensional Fermi surface sheets, giving rise to multiband superconductivity with many overlapping superconducting gaps. A spin-orbit-induced van Hove singularity is identified in the density of states near $E_F$. The electron-phonon interaction is moderately strong, with a coupling constant $\\lambda \\simeq 0.88$. Superconducting gap calculations reveal significant anisotropy and a broad distribution of gap values across different Fermi surface sheets. Spin fluctuations introduce additional depairing effects and reduce the critical temperature from 7.7 K to 6.4 K, in excellent agreement with the experimental value of 6.65 K. Taken together, our results show that the superconducting energy scale in Re$_2$Zr can be quantitatively reproduced within a conventional phonon-mediated framework, while the resulting state exhibits pronounced multiband and anisotropic gap structure. The origin of the experimentally suggested time-reversal symmetry breaking, however, remains an open question.", "tier": "B_IMPORTANT_CONDMAT", "score": "9", "reason": "Direct relevance to kagome metals and superconductivity studies.", "tags": ["material", "kagome", "superconductivity"], "image": "https://arxiv.org/html/2606.07184v1/x1.png", "briefing": {"background": "최근 AV3Sb5 계열의 kagome 금속에서 나타나는 전하밀도파(CDW) 및 초전도 현상이 큰 관심을 끌고 있으며, 유사한 격자 구조를 가진 다른 물질들에서의 초전도 기원 규명이 중요해짐.", "motivation": "Re2Zr kagome 금속에서 실험적으로 보고된 시간 반전 대칭 깨짐(TRSB)과 초전도성이 기존의 전자-포논 결합 모델로 설명 가능한지 확인하고자 함.", "result": "제1원리 계산을 통해 Re2Zr의 초전도성은 기존의 포논 매개 이론으로 정량적으로 재현 가능하며, 스핀 요동이 임계온도를 낮추는 역할을 함을 규명함.", "implication": "모든 kagome 초전도체가 비전통적일 필요는 없으며, 기존 이론의 틀 내에서도 다중 밴드 효과로 인해 복잡한 초전도 양상이 나타날 수 있음을 보임.", "novelty": "Kagome 물질에서 흔히 주장되는 '비전통적 초전도성'에 대해 물리적 기반의 정량적 모델링을 제공하여 과도한 해석에 경종을 울림.", "unresolved": "실험적으로 관측된 시간 반전 대칭 깨짐(TRSB) 현상의 구체적인 기원은 여전히 미스터리로 남아있음.", "future_work": "TRSB를 유발하는 내부적인 자기적 원인이나 국소적 대칭성 깨짐에 대한 추가적인 이론적/실험적 연구 필요.", "concepts": [{"term": "Multiband Superconductivity", "why_emerged": "Fermi 표면이 여러 밴드로 구성된 물질에서 밴드마다 다른 초전도 갭이 형성되는 현상을 설명하기 위해 필요.", "origin": "Suhl, Matthias, and Walker (1959)", "connections": "MgB2, Iron-based superconductors"}, {"term": "Van Hove Singularity", "why_emerged": "상태 밀도가 급격히 증가하는 지점으로, 전이금속 화합물 등에서 물리적 성질(초전도, 자기적 성질)을 결정짓는 핵심 요소.", "origin": "Leon Van Hove (1953)", "connections": "Kagome metals, Flat bands, Correlated systems"}], "english_summary": ["Investigates the kagome superconductor Re2Zr using ab initio DFT calculations.", "Confirms conventional phonon-mediated superconductivity explains key thermodynamic properties.", "Identifies a multiband gap structure and the role of spin fluctuations on Tc.", "Notes that experimental time-reversal symmetry breaking remains unexplained by current models."]}}, {"title": "Superconductivity and the quasiparticle mass enhancement near the CDW critical point using Bethe-Salpeter method: Application to cuprates", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2508.19536", "authors": "Youichi Yamakawa, Hiroshi Kontani", "last_authors": "Youichi Yamakawa, Hiroshi Kontani", "summary": "arXiv:2508.19536v2 Announce Type: replace Abstract: In recent years, charge-channel order in strongly correlated metals has attracted much attention. Representative examples include electronic nematic order in cuprates and iron-based superconductors, and Star-of-David order in kagome metals. Critical phenomena and unconventional superconductivity arising from fluctuations of such charge-channel orders are central issues today; however, the essential role is played by many-body effects (vertex corrections) beyond the mean-field approximation, and their origin and computational methods have not been established. In this study, we propose the Bethe-Salpeter equation method to evaluate electron-electron interactions in two-dimensional Hubbard models beyond the mean-field approximation. Based on the Baym-Kadanoff conserving approximation, we find that an attractive interaction in the charge channel emerges from the Aslamazov-Larkin vertex corrections that describe the interference processes among spin fluctuations. Applying this method to the square-lattice Hubbard model shows that the cooperation of attractive charge fluctuations and repulsive spin fluctuations yields high-$T_c$ $d$-wave superconductivity together with enhanced effective mass. These results provide a natural explanation for the phase diagram of cuprate superconductors, in which $d$-wave superconductivity is strongly enhanced near the charge-order critical point.The theory can also be applied to iron-based and nickelate superconductors, suggesting broad potential for future applications.", "tier": "B_IMPORTANT_CONDMAT", "score": "9", "reason": "Direct relevance to kagome metals, Star-of-David CDW order, and unconventional superconductivity.", "tags": ["theory", "kagome", "CDW", "cuprates", "superconductivity"], "image": "https://arxiv.org/html/2508.19536v2/x1.png", "briefing": {"background": "강상관 전자계에서 전하 채널(예: CDW, 네마틱 상)의 요동이 초전도성을 유도하거나 강화하는 기작은 고온 초전도체 연구의 핵심 난제 중 하나임.", "motivation": "평균장 근사를 넘어선 정밀한 다체계 물리량 계산을 통해, 특히 Star-of-David CDW 등이 나타나는 Kagome 금속 및 구리 산화물에서의 초전도 매커니즘을 규명하고자 함.", "result": "Bethe-Salpeter 방정식과 Aslamazov-Larkin 정점 보정(vertex correction)을 통해 전하 요동이 유효 질량을 높이고 d-파 초전도성을 유도함을 보임.", "implication": "고온 초전도체의 상도표를 설명하는 새로운 보편적 모델을 제시하며, 향후 다양한 상관 계 물질의 초전도성 예측에 활용 가능함.", "novelty": "기존 평균장 이론으로 설명하기 어려웠던 상관 관계 강한 전자들의 간섭 효과를 체계적으로 계산 프레임워크에 도입함.", "unresolved": "구체적인 물질 구조에 따른 매개변수 설정이 정밀한지에 대한 실험적 검증이 여전히 필요함.", "future_work": "해당 프레임워크를 iron-based 및 nickelate 초전도체에 적용하여 물질별 특이적 초전도상 비교 연구.", "concepts": [{"term": "Bethe-Salpeter Equation", "why_emerged": "다체계에서 입자-홀 쌍의 상호작용을 계산하여 들뜸 상태를 정확히 기술하기 위해 필요.", "origin": "Hans Bethe and Edwin Salpeter (1951)", "connections": "Green's functions, Vertex corrections, Many-body theory"}, {"term": "Aslamazov-Larkin Vertex Correction", "why_emerged": "초전도 전이 근처에서 요동에 의한 전도성 및 상호작용의 증폭 효과를 설명하기 위해 도입됨.", "origin": "L. G. Aslamazov and A. I. Larkin (1968)", "connections": "Superconducting fluctuations, Cuprates"}], "english_summary": ["Proposes a Bethe-Salpeter approach to evaluate electron interactions in correlated metals.", "Shows Aslamazov-Larkin vertex corrections link charge fluctuations to d-wave superconductivity.", "Provides a theoretical framework for CDW-linked superconductivity in cuprates and kagome metals.", "Successfully links enhanced effective mass and superconductivity near CDW critical points."]}}, {"title": "Existence of spontaneously generated and condensed excitons in the charge density wave phase of monolayer TiSe2: Role of ionic screening", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/lzrv-dflt", "authors": "Miaomiao Guo, Zeyu Jiang, Yuanchang Li", "last_authors": "Zeyu Jiang, Yuanchang Li", "summary": "Author(s): Miaomiao Guo, Zeyu Jiang, and Yuanchang Li The debate o n monolayer TiSe2.", "It explores the competition between excitonic condensation and the Jahn-Teller effect.", "Theoretical calculations demonstrate that ionic screening is vital for stable excitonic condensation.", "The study provides a theoretical basis for excitonic insulator behavior in 2D systems."]}}, {"title": "Impact of multiband effects on non-Fermi-liquid transport phenomena in bilayer nickelates", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/1ps4-zb93", "authors": "Seiichiro Onari, Daisuke Inoue, Rina Tazai, Youichi Yamakawa, Hiroshi Kontani", "last_authors": "Youichi Yamakawa, Hiroshi Kontani", "summary": "Author(s): Seiichiro Onari, Daisuke Inoue, Rina Tazai, Youichi Yamakawa, and Hiroshi Kontani Recently discovered high-${T}_{c}$ superconductivity in thin-film bilayer nickelates ${\\mathrm{La}}_{3}{\\mathrm{Ni}}_{2}{\\mathrm{O}}_{7}$ under ambient pressure has attracted great interest. Non-Fermi-liquid transport behaviors, such as $T$-linear resistivity and a positive Hall coefficient that inc… [Phys. Rev. B 113, 245110] Published Thu Jun 04, 2026", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Addresses electronic structure and transport in the trending high-Tc nickelate compounds.", "tags": ["theory", "nickelate", "superconductivity"], "image": "", "briefing": {"background": "최근 발견된 La3Ni2O7 이층 니켈산염은 고온 초전도성을 나타내며 차세대 고온 초전도 물질로 주목받고 있습니다. 이 물질의 수송 현상은 전형적인 페르미 액체 이론으로 설명되지 않는 비페르미 액체(NFL)적 거동을 보여 이를 이해하는 것이 매우 중요합니다.", "motivation": "이층 니켈산염에서 관찰되는 T-선형 저항 및 Hall 계수의 비정상적인 온도 의존성을 다밴드 전자 구조의 관점에서 이론적으로 해석하고자 합니다.", "result": "이층 시스템의 궤도 의존적 상관관계와 다밴드 효과가 비페르미 액체 특성을 유도한다는 것을 입증했으며, 특히 특정 궤도에서의 강한 상관관계가 수송 현상을 지배함을 보였습니다.", "implication": "니켈산염의 초전도 기전을 이해하기 위한 필수적인 전자 구조 모델을 제시하며, 밴드 구조와 수송 현상 사이의 직접적인 연결 고리를 확립했습니다.", "novelty": "단순한 단일 밴드 모델을 넘어, 이층 니켈산염의 다궤도 특징을 고려한 이론적 틀을 제시했습니다. 이는 강상관 전자계의 비페르미 액체 물성을 이해하려는 연구자들에게 중요한 이론적 근거가 됩니다.", "unresolved": "이론적 모델에서 제시한 궤도별 상관관계가 실험적 ARPES 또는 공명 비탄성 X선 elevance.", "tags": ["CDW", "experiment", "2Dmaterials"], "image": "", "briefing": {"background": "CDW와 같은 거시적인 양자 상태는 일반적으로 벌크 물질의 특성으로 간주됩니다. 그러나 물질의 크기가 나노 스케일로 줄어들 때, 이러한 질서가 어떻게 변화하는지(크기 효과)를 이해하는 것은 저차원 물리학에서 매우 중요한 주제입니다.", "motivation": "1T-TiSe2 나노 플레이크를 활용하여 CDW의 상전이 온도가 물질의 크기에 따라 어떻게 변하는지(melting point depression)를 실험적으로 관찰하고자 합니다.", "result": "나노 스케일로 갈수록 CDW 상전이 온도가 낮아지는 크기 효과를 관찰했으며, 이는 나노 제한 환경에서의 전자 상관관계 및 질서 매개변수의 공간적 변화를 시사합니다.", "implication": "나노 구조화가 강상관 양자 상태를 제어할 수 있는 도구가 될 수 있음을 입증하며, 소자 크기에 따른 물성 제어 가능성을 열었습니다.", "novelty": "기존에 거의 보고되지 않았던 CDW 상태의 크기 의존적 녹는점 변화를 실험적으로 정밀하게 포착했습니다. 이는 2D 전자 구조 연구자와 소자 물리학자에게 매우 흥미로운 주제입니다.", "unresolved": "크기 효과가 일어나는 근본적인 메커니즘이 표면 효과 때문인지, 아니면 나노 제한에 의한 밴드 구조의 변화 때문인지에 대한 상세한 분리가 필요합니다.", "future_work": "다른 강상관 물질(예: 다른 2D CDW 물질)로 연구 범위를 확장하고, 제어된 크기에서 ARPES를 수행하여 전자 밴드 구조 변화를 직접 매핑하는 실험이 유망합니다.", "concepts": [{"term": "Melting Point Depression", "why_emerged": "나노 입자의 크기가 작아짐에 따라 표면적 비중이 커지면서 물질의 상전이 온도가 낮아지는 현상을 설명하기 위해 사용됩니다.", "origin": "전형적인 열역학적 크기 효과로 오래전부터 연구됨.", "connections": "표면 에너지, 나노 크기 제한, 열역학."}, {"term": "Nanoflakes", "why_emerged": "2D 물질을 정밀하게 제어된 환경에서 연구하고 소자화하기 위해 기계적 박리 등을 통해 제작된 나노 박막 조각입니다.", "origin": "Graphene 연구 초기부터 활발히 사용됨.", "connections": "2D van der Waals 헤테로구조, 소자 물리학."}], "english_summary": ["The study explores the size-dependent melting of the CDW state in 1T-TiSe2.", "It reveals that the CDW transition temperature decreases as the nanoflake size decreases.", "This finding demonstrates a unique size effect in a correlated electronic system.", "The results offer insights into controlling quantum states via structural confinement."]}}, {"title": "Pressure tuning of the charge density wave and superconductivity in the noncentrosymmetric superconductor 4Ha−TaSe2", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/pbgh-693x", "authors": "Zhihan Si, Shaopeng Wang, Yonghui Zhou, et al.", "last_authors": "Xiaoping Yang, Zhaorong Yang", "summar ba 등에 의해 이론적으로 논의.", "connections": "스핀-궤도 결합, 강한 이방성, 비전통적 초전도성 연구."}], "english_summary": ["The paper investigates the structural and electronic evolution of 4Ha-TaSe2 under pressure.", "A CDW transition at 120 K is identified at ambient pressure.", "Electrical transport and Raman spectroscopy characterize the interplay between CDW and superconductivity.", "Results provide insight into the phase competition in noncentrosymmetric transition metal dichalcogenides."]}}, {"title": "Second-order anomalous Hall effect controlled by electric fields in altermagnets", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/wb4y-tzln", "authors": "Arnob Mukherjee, Biplab Sanyal, Annica M. Black-Schaffer, Ankita Bhattacharya", "last_authors": "Annica M. Black-Schaffer, Ankita Bhattacharya", "summary": "Author(s): Arnob Mukherjee, Biplab Sanyal, Annica M. Black-Schaffer, and Ankita Bhattacharya Altermagnets are a recently discovered class of compensated magnets with momentum-dependent spin splittings and unusual transport properties, even without a net magnetization. In the presence of combined fourfold rotation and time-reversal (${C}_{4}\\mathcal{T}$) symmetry, linear and also second orde… [Phys. Rev. B 113, L220401] Published Wed Jun 03, 2026", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Theory of transport in altermagnets, a high-priority topic for the user.", "tags": ["theory", "altermagnetism", "anomalous-Hall"], "image": "", "briefing": {"background": "Altermagnetism(알터자성)은 순자화값이 0임에도 불구하고 운동량 의존적인 스핀 분할을 가져 강자성과 반강자성의 특징을 모두 가지는 새로운 자기 상입니다. 이는 차세대 스핀트로닉스 소자 구현을 위한 핵심 후보입니다.", "motivation": "Altermagnet 시스템에서 대칭성 조건(C4T 등)에 따라 전기장으로 제어 가능한 비선형 수송 현상, 특히 2차 이상 홀 효과(Second-order anomalous Hall effect)를 이론적으로 예측하고자 했습니다.", "result": "Altermagnet에서 전기장을 가함으로써 2차 이상 홀 효과를 유도 및 제어할 수 있음을 규명했습니다.", "implication": "순자화가 없는 altermagnet을 이용해 외부 전기장으로 비선형 홀 전압을 제어할 수 있음을 보여, 에너지 효율이 높은 자성 소자 설계에 이정표를 제시합니다.", "novelty": "Altermagnet의 독특한 ems with topological implications.", "tags": ["graphene", "moiré", "topology", "correlated"], "image": "", "briefing": {"background": "뒤틀린 이중층 그래핀(TBG)과 육방정 질화붕소(hBN) 이종구조는 모아레 무늬(moiré pattern)를 통해 평탄 밴드(flat band)를 형성하여 상관관계와 위상 물성이 극대화되는 시스템입니다.", "motivation": "TBG/hBN 시스템에서 층간 결합과 기판 전위가 밴드의 위상적 성질(chern insulator 등)에 미치는 영향을 분석하여 위상 상전이 메커니즘을 밝히고자 했습니다.", "result": "물질 내의 국소적 파라미터 변화가 모아레 평탄 밴드의 위상을 어떻게 변화시키고, 이로 인해 Chern insulator와 같은 위상 위상이 어떻게 결정되는지 이론적으로 모델링했습니다.", "implication": "모아레 격자 시스템에서 외부 변수 조절을 통해 위상적 성질을 엔지니어링할 수 있는 가이드라인을 제공합니다.", "novelty": "TBG/hBN에서 나타나는 위상적 상전이를 미시적 파라미터와 연결하여 이해도를 높였으며, 향후 correlated electron system 연구의 중요한 이론적 기반이 됩니다.", "unresolved": "현실적인 샘플에서 나타나는 불균일한 모아레 간격이나 국소적 왜곡이 이러한 위상 상태를 어떻게 교란하는지는 상세 분석이 필요합니다.", "future_work": "이론적 예측을 기반으로 한 저온 STM/STS 실험을 통해 평탄 밴드의 위상 특성을 국소적으로 측정하는 연구가 기대됩니다.", "concepts": [{"term": "Moiré Flat Band", "why_emerged": "그래핀 층간 각도 조절을 통해 전자 에너지 분산을 억제하여 전자 간 상호작용을 증폭시키기 위해 사용됩니다.", "origin": "Bistritzer와 MacDonald (2011) 등에 의해 물리적 중요성 대두.", "connections": "강상관 전자계, 비전통적 초전도성, Chern insulator."}, {"term": "Chern Insulator", "why_emerged": "외부 자기장 없이도 자발적인 시간 반전 대칭성 깨짐을 통해 양자 홀 효과와 유사한 위상 상태를 구현하기 위해 필요합니다.", "origin": "Haldane 모델(1988).", "connections": "위상 절연체, 양자 이상 홀 효과, 모아레 시스템."}], "english_summary": ["The study explores topological phase transitions in twisted bilayer graphene aligned with hBN.", "Interlayer coupling and substrate potentials are identified as critical parameters for moiré flat band topology.", "The work provides a framework for understanding the emergence of fractional Chern insulators in moiré systems.", "Results suggest potential for topological engineering in van der Waals heterostructures."]}}, {"title": "Altermagnetic and Dipolar Splitting of Magnons in FeF2", "journal": "PRL_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/g6dt-rf8c", "authors": "J. Sears, V. O. Garlea, D. Lederman, J. M. Tranquada, I. A. Zaliznyak", "last_authors": "J. M. Tranq ist and be fully integrated within a unified system. Future sensing systems thus necessitate detectors capable of operating at higher frequency bands—ranging from millimeter wave to terahertz (THz)—while delivering wider bandwidths, faster response rates, and enhanced functional integration. Dirac-source (DS) detectors use Dirac semimetals as hot-electron sources to capitalize on the low density of states (DOS) near the Dirac point, thereby effectively suppressing the formation of metal-induced gap states. Furthermore, when this architecture incorporates the inherent interlayer vertical electron transport of vertical van der Waals (vdW) heterostructures, it shows great promise for realizing low-power, post–Moore era sensing devices with superior injection and transport efficiencies. Here, we report a DS detector composed of the completely vertical gold/zirconium pentatelluride/graphene/gold structure (Au/ZrTe 5 /graphene/Au) heterojunction, which harnesses strong localized fields to achieve high thermionic emission. The detector manifests outstanding performance in terms of remarkable responsivity, exceeds a peak of 1600 V/W from 0.02 to 0.5 THz at room temperature, has a fast response time less than 20 ns, and notably is capable for heterodyne mixing with intermediate frequency (IF) bandwidth larger than ±26.5 gigahertz. Our results not only shed a fresh light on DS dynamics in the terahertz region but also highlight the transformative potential of semimetal electronics for applications in wireless energy harvesting, communication, and imaging.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Uses Dirac semimetal ZrTe5 and graphene vdW heterostructures; highly relevant to user's material interests.", "tags": ["material", "ZrTe5", "Diracsemimetal", "transport"], "image": "", "briefing": {"background": "디락 반금속(Dirac semimetal)은 전자 상태 밀도가 낮아 광전 효과나 전하 이동 측면에서 고성능 소자 구현에 유리하며, 테라헤르츠(THz) 대역의 무선 통신 및 센싱 기술 수요가 급증하고 있습니다.", "motivation": "기존 금속 기반의 전극은 계면 결함으로 인
