<!DOCTYPE html>

<meta charset='UTF-8'>
<meta name='viewport' content='width=device-width, initial-scale=1.0'>
<title>Daily Paper Slideshow</title>
<style>
  :root {
    color-scheme: light;
    --bg: #f6f7f4;
    --paper: #ffffff;
    --ink: #111827;
    --muted: #64748b;
    --line: #d8ddd2;
    --accent: #176b87;
    --accent-2: #9a3412;
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; overflow: auto; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: var(--bg); color: var(--ink); }
  .shell { max-width: 1500px; min-height: 100vh; margin: 0 auto; padding: 14px 18px; display: flex; flex-direction: column; }
  .topbar { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 16px; }
  .top-actions { display: flex; align-items: center; gap: 10px; }
  .topbar a, button { border: 1px solid var(--line); border-radius: 8px; background: var(--paper); color: var(--ink); padding: 10px 14px; font-weight: 700; text-decoration: none; cursor: pointer; }
  button.primary { background: var(--accent); border-color: var(--accent); color: white; }
  button:disabled { opacity: 0.45; cursor: not-allowed; }
  .counter { color: var(--muted); font-weight: 700; }
  .slide { min-height: calc(100vh - 82px); background: var(--paper); border: 1px solid var(--line); border-radius: 10px; padding: 18px; box-shadow: 0 18px 42px rgba(15, 23, 42, 0.10); display: grid; grid-template-columns: minmax(310px, 0.86fr) minmax(0, 1.55fr); gap: 18px; overflow: visible; }
  .paper-head { min-width: 0; min-height: 0; overflow: visible; display: flex; flex-direction: column; gap: 12px; }
  .figure { margin: 0; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: #f8fafc; }
  .figure img { display: block; width: 100%; max-height: 41vh; object-fit: contain; background: white; }
  .figure figcaption { padding: 7px 10px; color: var(--muted); font-size: 12px; line-height: 1.3; }
  .head-text { display: flex; flex-direction: column; gap: 9px; min-width: 0; }
  .badges { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .badge { border-radius: 999px; padding: 5px 9px; background: #eef2ff; color: #3730a3; font-size: 12px; font-weight: 800; }
  .score { background: #fee2e2; color: #991b1b; }
  h1 { margin: 0; font-size: 25px; line-height: 1.15; letter-spacing: 0; overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
  h1 a { color: inherit; text-decoration-color: rgba(23, 107, 135, 0.35); text-decoration-thickness: 2px; text-underline-offset: 4px; }
  h1 a:hover { color: var(--accent); text-decoration-color: var(--accent); }
  .meta, .authors, .why, .abstract { font-size: 13px; line-height: 1.45; }
  .meta, .authors { color: var(--muted); }
  .why strong, .abstract strong, .authors strong { color: var(--ink); }
  .authors { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .why { border-left: 4px solid var(--accent-2); padding-left: 10px; color: #374151; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .abstract { border-top: 1px solid var(--line); padding-top: 14px; color: #374151; }
  .original-abstract { border-top: 1px solid var(--line); padding-top: 10px; color: #374151; font-size: 11.5px; line-height: 1.35; overflow-wrap: anywhere; }
  .original-abstract strong { display: block; margin-bottom: 4px; color: var(--ink); }
  .tags { display: flex; flex-wrap: wrap; gap: 8px; }
  .tag { border-radius: 999px; padding: 4px 8px; background: #f1f5f9; color: #475569; font-size: 12px; font-weight: 700; }
  .head-text > .link { display: none; }
  .briefing { min-width: 0; min-height: 0; overflow: visible; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); grid-auto-rows: minmax(0, auto); align-content: start; gap: 11px 18px; border-top: 0; padding-top: 0; }
  .brief-section { min-width: 0; }
  .brief-section.wide { grid-column: 1 / -1; }
  .brief-section h2 { margin: 0 0 4px; font-size: 14px; line-height: 1.22; color: #0f766e; letter-spacing: 0; }
  .brief-section p, .brief-section li { margin: 0; font-size: 12.5px; line-height: 1.42; color: #1f2937; overflow-wrap: anywhere; }
  .brief-section ul { margin: 0; padding-left: 20px; }
  .concepts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 9px 14px; }
  .concept { border-top: 1px solid var(--line); padding-top: 7px; }
  .concept h3 { margin: 0 0 4px; font-size: 13px; color: #7c2d12; letter-spacing: 0; }
  .concept p { margin: 2px 0 0; font-size: 11.5px; line-height: 1.35; color: #374151; overflow-wrap: anywhere; }
  .concept b { color: #111827; }
  .link { color: var(--accent); font-weight: 800; text-decoration: none; }
  .empty { padding: 48px; background: var(--paper); border: 1px solid var(--line); border-radius: 12px; color: var(--muted); }
  @media (max-width: 860px) {
    .shell { padding: 14px; }
    .topbar, .top-actions { align-items: stretch; flex-direction: column; }
    .slide, .briefing, .concepts { grid-template-columns: 1fr; }
    .slide { min-height: auto; overflow: visible; display: grid; }
    h1 { font-size: 28px; }
  }
</style>

<script>
const slides = [{"title": "Cooperative concurrence of 4f and 3d flat bands in the kagome heavy-fermion metal YbCr6Ge6", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/zdzj-bln9", "authors": "Wenxin Lv (吕文欣), Pengcheng Ma (马鹏程), Tianqi Wang (王天琦), et al.", "last_authors": "Zhonghao Liu (刘中灏), Hechang Lei (雷和畅)", "summary": "Flat-band (FB) systems originating from special lattice geometry like in kagome metals as well as localized orbitals in materials such as heavy-fermion (HF) compounds have attracted intensive interest due to their band topology and strong electron correlation effects, leading to emergent quantum sta…", "tier": "A_MUST_READ", "score": "10", "reason": "Direct hit on kagome flat-band electronic structure and heavy-fermion correlation effects.", "tags": ["material", "kagome", "electronicstructure"], "image": "", "briefing": {"background": "카고메(Kagome) 격자는 특유의 기하학적 좌절(geometric frustration)로 인해 전자 밴드 구조에서 플랫 밴드(flat band)를 형성하며, 이는 강한 상관관계 효과를 유도합니다. 동시에 중성 페르미온(heavy-fermion) 시스템은 4f 전자의 국소성으로 인해 높은 유효 질량의 플랫 밴드를 가집니다.", "motivation": "본 연구는 3d 전이 금속인 Cr 기반의 카고메 격자와 4f 희토류 원소인 Yb가 공존하는 YbCr6Ge6 화합물에서, 두 종류의 플랫 밴드가 어떻게 상호작용하고 물리적 특성을 결정하는지 규명하고자 합니다.", "result": "YbCr6Ge6 시스템에서 3d 전자에 의한 카고메 플랫 밴드와 Yb 4f 전자에 의한 중성 페르미온 플랫 밴드가 동시에 협력적으로 나타남을 발견했습니다. 이는 계의 전자 구조와 강한 전자 상관관계를 동시에 제어할 수 있는 독특한 환경을 제공합니다.", "implication": "카고메 격자의 위상적 특성과 중성 페르미온의 강상관 물리(Kondo 효과 등)가 결합됨으로써, 새로운 양자 임계 현상이나 위상적 양자 상태를 탐구할 수 있는 다기능 플랫폼으로서의 가능성을 보여줍니다.", "novelty": "서로 다른 기원을 가진 두 종류의 플랫 밴드가 단일 물질 내에서 공존(cooperative concurrence)함을 확인한 것이 핵심입니다. 특히 사용자의 관심사인 AV3Sb5와 같은 카고메 물질군에 중성 페르미온 물리학을 접목했다는 점에서 중요합니다.", "unresolved": "두 플랫 밴드 간의 구체적인 혼성(hybridization) 강도와 이로 인해 발생하는 위상적 불변량의 변화는 추가적인 정밀 측정이 필요합니다.", "future_work": "극저온에서의 ARPES 측정과 비정상 홀 효과(AHE) 측정을 통해 플랫 밴드 유래 위상 물성을 직접 검증할 필요가 있습니다.", "concepts": [{"term": "Kagome Lattice", "why_emerged": "기하학적 좌절을 통해 전자의 운동 에너지를 억제하고 플랫 밴드를 형성하기 위해 도입되었습니다.", "origin": "일본의 대나무 바구니 패턴에서 유래, Syozi(1951) 등이 통계 역학 모델로 제안.", "connections": "AV3Sb5, 분수 양자 홀 효과, 스핀 액체"}, {"term": "Heavy Fermion", "why_emerged": "국소화된 f-전자와 전도 전자 사이의 혼성으로 인해 전자의 유효 질량이 매우 커지는 현상을 설명하기 위함입니다.", "origin": "1970년대 Steglich 등에 의해 CeCu2Si2에서 처음 발견.", "connections": "Kondo 격자, 비전통적 초전도, 양자 임계점"}, {"term": "Flat Band", "why_emerged": "전자의 상태 밀도(DOS)를 극대화하여 전자-전자 상호작용이 지배적인 환경을 만들기 위해 중요합니다.", "origin": "초록 정보만으로는 특정하기 어려움 (격자 기하학 연구에서 발전).", "connections": "강상관 계, 위상 절연체, 마술각 트위스트 그래핀"}, {"term": "3d-4f Interaction", "why_emerged": "넓은 밴드의 3d 전자와 국소적인 4f 전자의 장점을 결합하여 물성을 조절하기 위해 연구됩니다.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "희토류-전이금속 화합물, 자성 메모리 소재"}], "english_summary": ["Discovery of coexisting 4f (heavy-fermion) and 3d (kagome) flat bands in YbCr6Ge6.", "The material provides a unique platform to study the interplay between lattice-driven topology and strong electron correlations.", "Identified cooperative concurrence of different flat-band origins within a single crystal structure.", "Potential for exploring novel quantum phases like topological heavy-fermion states."]}}, {"title": "Tuning the Fermi surface of MoTe2 by Nb doping", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/nqff-vzcg", "authors": "Andrew P. Weber, Iñigo Robredo, Philipp Rüßmann, et al.", "last_authors": "J. Enrique Ortega, Julen Ibañez-Azpiroz", "summary": "Ab initio calculations and angle-resolved photoemission experiments demonstrate that the bulk and surface electronic structure of Weyl semimetal candidate ${\\mathrm{MoTe}}_{2}$ changes significantly by tuning the chemical potential by less than 0.4 eV. Calculations indicate that several Lifshitz tra…", "tier": "A_MUST_READ", "score": "10", "reason": "Direct hit: ARPES and DFT study of the Fermi surface and Weyl physics in MoTe2.", "tags": ["ARPES", "material", "Weylsemimetal", "Fermisurface"], "image": "", "briefing": {"background": "Weyl 반금속인 MoTe2는 위상학적 특성이 페르미 준위(Fermi level)의 위치에 매우 민감하여, 화학 포텐셜의 미세한 변화만으로도 Weyl 점의 개수나 페르미 면의 형상이 바뀔 수 있습니다.", "motivation": "MoTe2의 위상 상태를 실험적으로 제어하기 위해 Nb 도핑을 사용하여 페르미 준위를 정밀하게 튜닝하고, 이에 따른 전자 구조의 변화를 체계적으로 관찰하고자 합니다.", "result": "Nb 도핑을 통해 화학 포텐셜을 0.4 eV 이하의 범위에서 성공적으로 조절했습니다. 이 과정에서 벌크 및 표면 상태의 급격한 변화를 확인했으며, 계산된 여러 단계의 Lifshitz 전이를 ARPES 실험으로 뒷받침했습니다.", "implication": "도핑을 통해 MoTe2의 Weyl 물리와 위상학적 표면 상태를 엔지니어링할 수 있음을 입증했으며, 이는 위상 소자 응용을 위한 중요한 단계입니다.", "novelty": "Nb 도핑이라는 실제적인 수단을 통해 Weyl 반금속 후보 물질의 페르미 면을 대폭적으로 변화시키고, 이를 ARPES와 DFT로 정밀하게 대조했다는 점이 돋보입니다.", "unresolved": "도핑으로 인한 불규칙성(disorder)이 Weyl 노드의 결맞음성(coherence)에 미치는 영향에 대해서는 추가 논의가 필요합니다.", "future_work": "Lifshitz 전이 지점 근처에서의 수송 특성 변화와 비정상 홀 전도도(AHC)의 상관관계 연구가 기대됩니다.", "concepts": [{"term": "Weyl Semimetal", "why_emerged": "응집물질 물리에서 질량이 없는 디락 페르미온의 위상학적 짝을 구현하기 위해 등장했습니다.", "origin": "Hermann Weyl(1929)의 이론적 제안을 기반으로 2015년 TaAs에서 실험적 확인.", "connections": "Fermi arc, 카이랄 이상(Chiral anomaly), MoTe2/WTe2"}, {"term": "Lifshitz Transition", "why_emerged": "외부 변수에 의해 페르미 면의 연결성이 바뀌는 위상학적 상전이를 설명하기 위해 도입되었습니다.", "origin": "I. M. Lifshitz (1960).", "connections": "반금속-금속 전이, 초전도 임계 온도 변화"}, {"term": "Nb Doping", "why_emerged": "MoTe2와 같은 전이금속 디칼코게나이드에서 정공(hole)을 주입하여 화학 포텐셜을 낮추기 위해 사용됩니다.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "p-type 반도체, 전하 밀도파(CDW) 제어"}, {"term": "Fermi Surface Topology", "why_emerged": "물질의 수송 특성과 위상적 보호를 받는 표면 상태를 이해하는 핵심 요소이기 때문입니다.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "Berry curvature, Quantum oscillations"}], "english_summary": ["Demonstrated precise Fermi surface tuning in MoTe2 via Nb doping.", "Observed multiple Lifshitz transitions and significant changes in surface states using ARPES.", "Chemical potential shifts of up to 0.4 eV were achieved and validated by DFT calculations.", "Provides a route to engineer topological properties in Type-II Weyl semimetals."]}}, {"title": "Incoherent dark excitons extend Floquet-like physics across time and momentum", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2610.38156", "authors": "Xing Zhu, Jacques Hawecker, Enrico Perfetto, et al.", "last_authors": "Gianluca Stefanucci, Keshav M. Dani", "summary": "Floquet phenomena - where a coherent, time-periodic drive hybridizes the conduction band with energy-replicated copies of the valence band - have been demonstrated with intense optical fields and, more recently, other bosonic excitations. However, within mean-field approximations and the current understanding of Floquet phenomena, these effects survive only for the coherence time of the drive, limiting practical use and current demonstrations to the sub-picosecond regime. Here, consistent with recent theoretical predictions beyond the mean-field picture, using time- and angle-resolved photoemission spectroscopy in WSe$_2$/MoS$_2$ heterostructures, we show that incoherent, dense populations of dark interlayer excitons hybridize the conduction band with energy-replicated copies of the valence band, mimicking Floquet-like phenomena - now persisting for nearly a nanosecond. With increasing interlayer exciton density, the valence band and its replica evolve from an inverted-parabolic to a Mexican-hat dispersion, a signature of the predicted non-zero static coupling that hybridizes the bands and scales linearly with the exciton density. By tuning twist angle, we further show that dark excitons with net momentum create replicas that hybridize with bands offset not just in energy but also in momentum, providing another powerful degree of freedom beyond conventional Floquet engineering. These results establish a robust, long-lived route to engineering electronic states, beyond a coherent, zero-momentum drive.", "tier": "A_MUST_READ", "score": "10", "reason": "Directly relevant ARPES study on Floquet-like band engineering in TMDC heterostructures.", "tags": ["ARPES", "Floquet", "heterostructure"], "image": "https://arxiv.org/static/browse/0.3.4/images/arxiv-logo-fb.png", "briefing": {"background": "Floquet 엔지니어링은 주기적인 빛 조작을 통해 물질의 밴드 구조를 변형시키지만, 일관성(coherence) 유지 시간이 매우 짧아 실용화에 한계가 있었습니다. 최근에는 빛 대신 다른 보존적 여기(exciton 등)를 이용한 밴드 조작이 제안되었습니다.", "motivation": "WSe2/MoS2 이종 접합 구조에서 암엑시톤(dark exciton)을 이용하여 Floquet과 유사한 밴드 복제(replica) 현상을 구현하고, 그 수명과 운동량 제어 가능성을 확인하고자 합니다.", "result": "비결맞음 층간 암엑시톤이 원자가 전자대(valence band)의 복제본을 형성하여 전도대와 혼성됨을 tr-ARPES로 관찰했습니다. 이 효과는 기존 Floquet의 ps 단위를 넘어 ns 단위까지 지속되었으며, 트위스트 각도 조절을 통해 운동량 오프셋이 있는 복제 밴드를 생성했습니다.", "implication": "초고속 레이저 구동 없이도 엑시톤 밀도와 트위스트 각도만으로 밴드 구조를 장시간(nanosecond) 동안 '멕시칸 모자(Mexican-hat)' 형태로 설계할 수 있는 새로운 경로를 제시합니다.", "novelty": "Floquet-like 현상을 암엑시톤을 통해 비결맞음(incoherent) 영역으로 확장하고 수명을 획기적으로 늘린 점, 그리고 운동량 공간에서의 제어 가능성을 입증한 점이 매우 혁신적입니다.", "unresolved": "암엑시톤의 밀도를 극한으로 높였을 때 발생할 수 있는 엑시톤 응축(condensation) 효과와의 상호작용은 아직 미지의 영역입니다.", "future_work": "트위스트 각도에 따른 베리 곡률(Berry curvature) 변화 측정 및 엑시톤 기반 위상 상태 제어 실험이 가능할 것입니다.", "concepts": [{"term": "Floquet Engineering", "why_emerged": "평형 상태에서 존재하지 않는 새로운 위상학적 상태를 빛으로 유도하기 위해 등장했습니다.", "origin": "Gaston Floquet의 수학 이론을 응집물질 물리(Oka/Aoki 등)에 적용.", "connections": "Floquet 위상 절연체, 광유도 밴드 갭"}, {"term": "Dark Interlayer Exciton", "why_emerged": "광학적으로 전이가 금지되어 수명이 길고, 서로 다른 층에 전하가 나뉘어 있어 안정적인 여기 상태를 유지하기 때문입니다.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "WSe2/MoS2 heterostructure, 엑시톤 확산"}, {"term": "tr-ARPES", "why_emerged": "펌프-프로브 기법을 통해 여기 상태의 전자 구조 변화를 시간 분해능을 가지고 직접 관찰하기 위해 필수적입니다.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "Floquet physics, 초고속 전자 동역학"}, {"term": "Mexican-hat Dispersion", "why_emerged": "밴드 반전이나 자발적 대칭성 깨짐의 징후로 나타나며, 전하 밀도파나 초전도와 관련이 깊습니다.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "Rashba 효과, Graphene bilayer"}], "english_summary": ["Achieved Floquet-like band engineering using long-lived incoherent dark excitons in WSe2/MoS2.", "Extended the lifetime of induced band replicas from picoseconds to nearly a nanosecond.", "Observed a density-dependent evolution into a Mexican-hat dispersion via tr-ARPES.", "Demonstrated momentum-offset replicas by tuning the heterostructure twist angle."]}}, {"title": "Observation of light-induced topological state in graphene", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2610.39695", "authors": "Sotirios Fragkos, Ann Chantal Goutier, Umberto Dellasette, et al.", "last_authors": "Michael Sch\\\"uler, Samuel Beaulieu", "summary": "Driving quantum materials with light can reshape not only their electronic band structures but also the geometry of their electronic wavefunctions. In graphene, circularly polarized light is predicted to open gaps at the Dirac points and induce a pseudospin texture and Berry curvature characteristic of the Haldane model, realizing a Floquet Chern insulator [ 32 , 33 , 26 , 18 ] . Transport and all-optical measurements have provided evidence for a light-induced anomalous Hall response [ 29 , 25 ] , but cannot resolve the underlying electronic states in both energy and momentum space. Time- and angle-resolved photoemission spectroscopy has revealed Floquet-Bloch sidebands [ 30 , 10 ] and hybridization gaps at crossings between Floquet bands [ 44 ] . However, these experiments used linearly polarized driving, which preserves time-reversal symmetry and thus does not induce a topological phase. Here, we combine circular-dichroic time-resolved extreme-ultraviolet momentum microscopy [ 14 ] with ab initio theory to investigate graphene driven by circularly polarized light. We observe a pump-induced photoemission circular dichroism near the Dirac point that reverses sign with pump helicity and across the Dirac energy, in agreement with our calculations. These results link the measured dichroic response to the light-induced pseudospin texture and its associated Berry curvature, providing spectroscopic evidence for the Floquet-engineered topological insulating state in graphene.", "tier": "A_MUST_READ", "score": "10", "reason": "Direct experimental observation using TR-ARPES of light-induced topological state in graphene.", "tags": ["experiment", "ARPES", "TR-ARPES", "graphene", "Floquet", "topological", "Berrycurvature", "anomalousHall"], "image": "https://arxiv.org/html/2610.39695v1/Figure_1.png", "briefing": {"background": "빛을 이용하여 양자 물질의 전자 상태를 제어하는 Floquet 공학은 물질의 밴드 구조뿐만 아니라 파동함수의 기하학적 특성까지 바꿀 수 있는 유망한 기술입니다.", "motivation": "이론적으로 그래핀에 원편광(circularly polarized light)을 조사하면 시간 반전 대칭성이 깨지며 Haldane 모델과 유사한 Floquet Chern 절연체 상태가 유도될 것으로 예측되어 왔으나, 이를 에너지-운동량 공간에서 직접 분광학적으로 확인하는 데 어려움이 있었습니다.", "result": "연구진은 원편광 이색성 시간 분해 극자외선 운동량 현미경(circular-dichroic TR-ARPES)을 사용하여, 펌프광의 헬리시티(helicity)에 따라 Dirac 지점 근처에서 부호가 반전되는 광전자 이색성 신호를 관측했습니다. 이는 계산된 가성스핀(pseudospin) 텍스처 및 Berry 곡률과 일치합니다.", "implication": "그래핀에서 빛으로 유도된 위상 절연체 상태에 대한 직접적인 분광학적 증거를 제시함으로써, Floquet 위상 상전이의 실시간 제어 가능성을 확고히 했습니다.", "novelty": "기존의 선편광 기반 TR-ARPES가 위상적 특성을 유도하지 못했던 한계를 극복하고, 원편광과 CD-ARPES 기법을 결합하여 Berry 곡률과 관련된 전자 구조의 변화를 직접 시각화했다는 점이 독보적입니다. 독자의 관심사인 TR-ARPES 및 Berry 곡률 제어와 직결됩니다.", "unresolved": "빛에 의해 유도된 이 상태가 얼마나 오랫동안 안정적으로 유지될 수 있는지, 그리고 실제 소자 응용을 위한 소산(dissipation) 효과는 어떠한지에 대한 추가 연구가 필요합니다.", "future_work": "다른 2D 물질 및 반데르발스 이종접합 구조에서의 Floquet 위상 상태 탐색과 비평형 상태에서의 양자 홀 효과 측정 등이 기대됩니다.", "concepts": [{"term": "Floquet Chern Insulator", "why_emerged": "주기적인 외부 섭동(빛)을 통해 정적인 상태에서는 존재하지 않는 위상적 성질을 유도하기 위해 등장했습니다.", "origin": "Oka and Aoki (2009) 등이 이론적으로 제안했습니다.", "connections": "Haldane 모델, 위상 절연체, 비평형 통계역학"}, {"term": "TR-ARPES (시간 분해 각분해 광전자 분광법)", "why_emerged": "초고속 영역에서 전자의 동역학과 밴드 구조의 변화를 실시간으로 관찰하기 위해 개발되었습니다.", "origin": "초록 정보만으로는 특정하기 어려우나, 펨토초 레이저 기술의 발전과 함께 확립되었습니다.", "connections": "전자-포논 상호작용, 엑시톤 동역학, Floquet 상태"}, {"term": "Berry Curvature (베리 곡률)", "why_emerged": "결정 내 전자 파동함수의 기하학적 위상 효과를 설명하고 이상 홀 효과 등을 이해하기 위해 도입되었습니다.", "origin": "Michael Berry (1984)의 기하학적 위상 개념에서 유래했습니다.", "connections": "위상 불변량, Chern 수, 이상 홀 효과"}, {"term": "Circular Dichroism (원편광 이색성)", "why_emerged": "물질의 카이랄성이나 전자 상태의 궤도/스핀 각운동량 정보를 추출하기 위해 사용됩니다.", "origin": "초록 정보만으로는 특정하기 어려우나, 광학 및 X선 분광학에서 널리 사용되어 왔습니다.", "connections": "스핀-궤도 결합, 위상적 텍스처, Berry 곡률"}], "english_summary": ["Direct spectroscopic observation of a light-induced Floquet topological state in graphene using TR-ARPES.", "Demonstrated that circularly polarized pump light induces a pseudospin texture and Berry curvature near Dirac points.", "Observed helicity-dependent circular dichroism in the photoemission signal, confirming the Floquet Chern insulator phase.", "Links ultrafast optical driving with energy-momentum resolved topological properties."]}}, {"title": "Graphene lattice recoil in hard x-ray photoemission: Experiment and theory", "journal": "PRB_Recent", "source": "keyword", "link": "http://link.aps.org/doi/10.1103/s8w3-plc1", "authors": "Simone Ritarossi, Alice Apponi, Orlando Castellano, et al.", "last_authors": "Francesco Offi, Alessandro Ruocco", "summary": "Hard-x-ray C 1 s photoemission from monolayer graphene probes a regime in which nuclear recoil and intrinsic electronic asymmetry contribute on comparable energy scales to the observed spectral line shape. Here we combine experiment and modeling over the photon-energy range 0.8 – 8 keV to resolve this interplay quantitatively. A graphene-specific implementation of the Fujikawa-Takata cumulant formalism, based on an anisotropic vibrational density of states constrained by first-principles phonon calculations, captures the expected recoil scaling with photon energy and emission geometry but fails to reproduce the pronounced asymmetric tails of the measured spectra. To overcome this limitation, we introduce an explicit electronic convolution model in which a photon-energy-independent reference response, dominated by the electronic line shape and extracted from the low-recoil 0.8 keV data through a recoil-inclusive fit, is convolved with a phonon recoil kernel carrying the full dependence on photon energy and emission angle. This approach reproduces both the measured line-shape evolution and the observed peak shifts across the explored energy range without refitting the  Hubbard model produces genuine $d$-wave superconductivity at a substantial transition temperature, in excess of either interaction alone. The observed trends suggest that stronger Hubbard repulsion may cooperate with the phonon to further raise the pairing scale. The enhancement persists at stronger repulsion within the accessible window, limited by the fermion sign problem, and follows a common trend across phonon frequencies $\\Omega$ when organized by a retardation scale $2\\pi T/\\Omega$. We also find a well-defined superconducting dome in doping, echoing a characteristic feature of correlated superconductors. Our results identify the $B_{1g}$ phonon as a plausible microscopic ingredient for robust $d$-wave superconductivity in the Hubbard model and suggest a concrete, physically motivated route toward materials with higher superconducting transition temperatures.", "tier": "A_MUST_READ", "score": "9", "reason": "author whitelist: Zhi-Xun Shen", "tags": ["STS", "superconduct", "correlated", "Hubbard", "phonon"], "image": "https://arxiv.org/html/2610.37746v1/figS_realspace_U26.png", "briefing": {"background": "강상관 전자계에서 d-파 초전도성은 흔히 전자 간의 척력인 Hubbard 상호작용만으로 설명하려 노력해왔으나, 전이 온도를 높이는 데 한계가 있었습니다.", "motivation": "전자-포논 상호작용과 전자 간의 척력이 어떻게 협력하여 초전도성을 강화할 수 있는지, 특히 B1g 포논의 역할을 Hubbard 모델에서 규명하고자 했습니다.", "result": "B1g 포논이 Hubbard 척력과 결합할 때 d-파 초전도 전이 온도가 크게 상승하며, 실험적으로 관찰되는 초전도 돔(dome) 구조가 이론적으로 재현됨을 확인했습니다.", "implication": "포논이 단순한 방해 요소가 아니라, 적절한 대칭성을 가질 경우 강상관 초전도체의 전이 온도를 높이는 핵심 동력이 될 수 있음을 시사합니다.", "novelty": "Zhi-Xun Shen 등 권위 있는 저자들이 참여하여 수치적 엄밀성을 갖춘 양자 몬테카를로 계산으로 Hubbard 모델 내에서의 포논 역할을 명확히 규명했습니다.", "unresolved": "페르미온 부호 문제(sign problem)로 인해 매우 강한 상호작용 영역에서의 계산은 여전히 제한적입니다.", "future_work": "실제 고온 초전도체 물질에서 B1g 포논의 기여를 실험적으로 검증하고, 보다 다양한 포논 모드와의 상호작용 연구가 필요합니다.", "concepts": [{"term": "B1g 포논", "why_emerged": "결정 구조의 대칭성 파괴가 전자 쌍 형성 메커니즘에 어떤 영향을 미치는지 분석하기 위해 필요합니다.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "cuprates의 d-파 대칭성과 관련이 깊음"}, {"term": "d-wave superconductivity", "why_emerged": "구리 산화물 초전도체에서 전자 쌍의 파동함수가 d-파 대칭성을 가진다는 것이 발견되면서 이론적 정립이 필요해짐.", "origin": "D. J. Scalapino 등에 의해 광범위하게 논의됨", "connections": "Hubbard 모델 내의 강상관 초전도 현상과 밀접함"}], "english_summary": ["Numerically exact QMC study on the repulsive Hubbard model.", "B1g phonons significantly boost d-wave superconducting transition temperatures.", "Results reproduce the characteristic superconducting dome seen in correlated materials.", "Suggests a cooperative mechanism between electronic repulsion and phonon modes."]}}, {"title": "Evidence for a charged vortex lattice in an exciton superfluid", "journal": "arXiv_CondMat", "source": "author whitelist", "link": "https://arxiv.org/abs/2610.37781", "authors": "Ryan L. Lee, Jungwoo Lee, Viliam Va\\v{n}o, et al.", "last_authors": "Allan MacDonald, Ali Yazdani", "summary": "Lattices of quantized vortices are a defining property of rotating superfluids and of type-II superconductors in magnetic fields. Realizing an analogous vortex lattice in an exciton superfluid-formed from bound electron-hole pairs-has remained challenging because excitons are electrically neutral. Building on previous theoretical studies of the low-energy excitations in an exciton superfluid, recent theory has predicted that in a strong magnetic field, a weakly charged exciton superfluid can stabilize a vortex-antivortex lattice arising from the mutual repulsion of fractionally charged vortex cores. Here we report evidence for this predicted vortex lattice in a bilayer exciton condensate by imaging its charged vortices with the scanning tunnelling microscope. The condensate forms between Landau levels of two graphene layers separated by a thin hexagonal boron nitride barrier in a perpendicular magnetic field. We find that the vortex lattice periodicity scales with the total excess charge and is insensitive to its distribution between the two layers, in quantitative agreement with theoretical predictions. Our observations provide evidenc conductance signatures for local and nonlocal tunneling.", "Offers a new pathway for topological quantum computation using fractional vortices."]}}, {"title": "Evidence for an effective gauge field in flakes of superconducting 4Hb-TaS2", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2610.39979", "authors": "Shalev Gur, T. R. Devidas, Eylon Persky, et al.", "last_authors": "Amit Kanigel, Beena Kalisky", "summary": "Understanding the normal state of unconventional superconductors is central to uncovering the origin of superconductivity itself. Unconventional superconductivity often emerges from correlated electronic states characterized by intertwined symmetry-breaking orders. A striking example is 4Hb-TaS2, whose superconducting state exhibits a remarkable range of phenomena, including an unusual magnetic memory effect. Previous experiments showed that magnetic memory can be encoded above Tc and later revealed through spontaneous vortices below Tc, suggesting time-reversal symmetry breaking. However, since memory and vorticity are intertwined, this prevents establishing whether the effect results from trapped flux, weak conventional magnetism, or a true hidden electronic order. Here, we show that magnetic memory persists in the vortex-free Meissner regime of exfoliated 4Hb-TaS2 flakes, where it appears as a stable remanent modification of the superconducting screening response. Our results rule out explanations based on trapped vortices. Furthermore, the spatial profile of the flux generated by trained samples at zero field is inconsistent with conventional weak magnetism, suggesting a hidden electronic phase that imprints an effective flux on the superconducting condensate.", "tier": "B_IMPORTANT_CONDMAT", "score": "10", "reason": "Direct hit: 4Hb-TaS2 experimental evidence for TRSB and hidden order, highly relevant to projects.; demoted from A: broad CM, not direct user/project hit", "tags": ["experiment", "4Hb-TaS2", "TRSB"], "imag bohedral multilayer graphene (RMG) has been demonstrated as a promising platform for investigating strongly correlated phases of matter. Here, we observe a coexistence of superconductivity and Chern insulators in a twisted rhombohedral bilayer-trilayer graphene moir\\'e superlattice. Superconductivity, evidenced by a sharp transition with a critical temperature of ~180 mK, nonlinear I-V with a BKT temperature of 135 mK, and a signature of phase-sensitive interference patterns, emerges from a symmetry-breaking Fermi surface near v = -2 and D = 0, and it survives at a large in-plane magnetic field up to 2 T, strongly deviating from the Pauli limit. Moreover, we observe a strong modulation of the Ginzburg-Landau coherence length from 467 nm to 145 nm as the in-plane magnetic field increases from 0 to 2 T, whereas the critical current Ic barely changes. Unlike previous studies in RMG, we observe a competition between superconductivity and a correlated insulator at v = -2, monitored by displacement fields and twist angles. Note that we also observe integer Chern insulators with C = 1, 3, and -3 at v = 1/2, 1, and 3, respectively, for large D > 0 in the same superconducting device. The observations establish twisted rhombohedral graphene multilayers as a fascinating system to investigate unconventional superconductivity, high Chern number topology, and their interplay.", "tier": "B_IMPORTANT_CONDMAT", "score": "9", "reason": "Significant experimental result combining superconductivity and Chern topology in twisted graphene.", "tags": ["experiment", "graphene", "superconductivity"], "image": "https://arxiv.org/static/browse/0.3.4/images/arxiv-logo-fb.png", "briefing": {"background": "모아레 격자 시스템(Moiré superlattice)은 층간 비틀림을 통해 전자 구조를 정밀하게 제어할 수 있어, 강상관 전자계 물리 연구의 핵심 플랫폼으로 자리 잡았습니다.", "motivation": "비틀린 능면체 다층 그래핀(RMG) 구조에서 초전도성과 위상 절연체 상태가 공존할 수 있는지, 그 상호작용의 기원을 규명하고자 했습니다.", "result": "비틀린 능면체 이중층-삼중층 그래핀에서 파울리 한계를 넘어서는 초전도 현상과 C=1, 3 등 다양한 Chern 절연체 상태가 동일 장치에서 공존함을 관찰했습니다.", "implication": "다층 그래핀 시스템이 위상 물성과 초전도성이 결합된 양자 다체계 현상을 연구할 수 있는 매우 강력한 플랫폼임을 입증했습니다.", "novelty": "Chern 위상과 비재래적 초전도성이 한 장치 내에서 조절 가능한 방식으로 공존함을 보였으며, 이는 위상적 초전도체 구현을 위한 실마리를 제공합니다.", "unresolved": "초전도성과 위상 절연 상태 사이의 미시적인 경쟁/상호 보완 메커니즘은 여전히 상세한 분석이 필요합니다.", "future_work": "다양한 변위장(D)과 도핑 수준에서 상도(Phase diagram)의 미세 구조를 정밀하게 매핑하는 후속 연구가 요구됩니다.", "concepts": [{"term": "Chern Insulator", "why_emerged": "자기장 없이도 위상적으로 보호되는 에지 상태를 가지는 양자 홀 효과의 격자 버전 필요성 때문입니다.", "origin": "Haldane(1988)의 벌집 격자 모델에서 처음 제안되었습니다.", "connections": "양자 비정질 홀 효과, 위상 절연체와 밀접하게 연결됩니다."}, {"term": "Moiré superlattice", "why_emerged": "2차원 물질 층을 쌓을 때 발생하는 간섭 무늬가 전자 구조를 변조하여 새로운 물리 현상을 유도하기 위해 필요합니다.", "origin": "2018년 비틀린 이중층 그래핀(TBG)의 초전도성 발견으로 대두되었습니다.", "connections": "플랫 밴드(Flat band), 강상관 물성과 연결됩니다."}], "english_summary": ["Discovery of superconductivity coexisting with Chern insulators in twisted rhombohedral bilayer-trilayer graphene.", "Observation of robust superconductivity surviving up to 2 T, suggesting unconventional pairing.", "Evidence for tunable interplay between topological phases and correlated electron states."]}}, {"title": "Direct real-space imaging of sign-reversal superconducting state by scanning Josephson tunneling", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2610.38421", "authors": "Tianheng Wei, Yanzhao Liu, Wei Ren, Zhen Liang, Ziqiang Wang, Jian Wang", "last_authors": "Ziqiang Wang, Jian Wang", "summary": "Phase-sensitive experiments based on Josephson tunneling have been considered as a pivotal method to determine the pairing symmetry in high-temperature (high-Tc) cuprate superconductors. However, in iron-based superconductors, traditional phase-sensitive experiments face setbacks because of the complexity of pairing symmetry in multiband systems. Here, using scanning Josephson tunneling microscopy (SJTM), we report the half-unit-cell periodic Josephson tunneling modulations in monolayer high-Tc Fe(Te,Se) film epitaxially grown on SrTiO3(001). The Josephson tunneling almost vanishes along the lines connecting next-nearest-neighbor Fe atoms under an s-wave superconducting tip. Combined with single-particle tunneling spectra showing the full superconducting gap, our experimental results are consistent with the sign-reversal nodeless d-wave pairing symmetry. Our findings provide sub-unit-cell scale superconducting phase information for understanding the mechanism of high-Tc superconductivity. We anticipate our work as a starting point for atomically resolved Josephson interference experiments using SJTM in various unconventional superconductors.", "tier": "B_IMPORTANT_CONDMAT", "score": "9", "reason": "Scanning Josephson tunneling on iron-based films showing sign-reversal pairing; very relevant to electronic-structure physics.", "tags": ["STS", "superconductivity", "iron-based"], "image": "https://arxiv.org/static/browse/0.3.4/images/arxiv-logo-fb.png", "briefing": {"background": "철 기반 초전도체(FeSC)의 다중 밴드 특성 때문에 고전적인 위상 민감 실험으로는 페어링 대칭성을 결정하는 데 한계가 있었습니다.", "motivation": "단층 Fe(Te,Se) 박막에서 나노 스케일의 Josephson 터널링을 통해 페어링 대칭성을 직접 시각화하고자 했습니다.", "result": "SJTM 측정 결과, 인접 Fe 원자들 사이의 위상 반전(sign-reversal)을 시사하는 Josephson 터널링 특성을 확인했습니다.", "implication": "Fe(Te,Se) 시스템의 nodeless d-wave 페어링 대칭성에 대한 직접적인 미시적 증거를 제시했습니다.", "novelty": "서브 유닛 셀(sub-unit-cell) 수준에서 초전도 위상 정보를 직접 관측하여, 철 기반 초전도체의 기원 규명에 중요한 도구를 제공했습니다.", "unresolved": "다양한 도핑 영역과 온도 변화에 따른 위상 모듈레이션의 정량적 변화는 추가적인 탐구가 필요합니다.", "future_work": "다른 비재래적 초전도체 물질로의 SJTM 적용을 통해 페어링 대칭성 규명의 표준 방법론으로 정립하는 작업이 기대됩니다.", "concepts": [{"term": "Scanning Josephson Tunneling Microscopy (SJTM)", "why_emerged": "국소적인 영역에서 페어링 파동함수의 위상을 직접 측정하기 위해 필요했습니다.", "origin": "J.C. Davis 그룹 등의 초기 STM 연구에서 발전했습니다.", "connections": "STM/STS, 위상 민감 측정 기술과 연결됩니다."}, {"term": "Sign-reversal s-wave (s+/-)", "why_emerged": "FeSC의 페르미 면 사이의 쿨롱 척력으로 인해 갭의 위상이 반전되는 현상을 설명하기 위해 등장했습니다.", "origin": "Mazin et al. (2008) 등 초창기 FeSC 이론 연구에서 제안되었습니다.", "connections": "강상관 전자계의 페어링 메커니즘과 직접 연결됩니다."}], "english_summary": ["Direct visualization of sign-reversal superconducting order in monolayer Fe(Te,Se) using SJTM.", "Experimental confirmation of nodeless d-wave pairing symmetry via Josephson interference.", "Advances in sub-unit-cell scale phase-sensitive detection for unconventional superconductors."]}}, {"title": "Excitonic-Superconducting Coexistence and Emergent Nematic Superconductivity Driven by Spontaneous Symmetry Breaking", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2606.01785", "authors": "Fei Yang, Ruigang Li, Junwei Liu, Binghai Yan", "last_authors": "Junwei Liu, Binghai Yan", "summary": "Excitonic insulating (EI) and superconducting (SC) orders are generally regarded as mutually exclusive electronic instabilities. Within a self-consistent microscopic theory, we study electronic systems hosting an EI phase in the presence of SC pairing and show that an intrinsic mismatch between electron and hole Fermi surfaces fundamentally reshapes this competition. This mismatch stabilizes FFLO-like electron-hole pairing and drives spontaneous symmetry breaking of the EI state. The resulting symmetry breaking reconstructs the pairing phase space for SC and EI state, such that different regions of the Fermi surface complementarily support either EI or SC correlations, leading to a natural coexistence of the two orders. Notably, the emergent SC state consequently breaks rotational symmetry and develops intrinsic nematic superconductivity, even in the absence of explicit symmetry-breaking fields (such as magnetic fields, spin-orbit coupling, or bare band-structure anisotropy). Our results suggest that candidate materials such as monolayer 1T$'$-MoTe$_2$ and the square-net semimetal NaAlSi may provide promising platforms for observing this phenomenon. More broadly, these findings reveal a unique mechanism by which competing many-body orders generate electronic nematicity, suggesting a broader route toward spontan "link": "https://arxiv.org/abs/2610.38449", "authors": "Yusuf Wicaksono, Toshikaze Kariyado", "last_authors": "Yusuf Wicaksono, Toshikaze Kariyado", "summary": "The superconducting diode effect is often associated with finite-momentum pairing, although model studies indicate that rectification reflects the asymmetry of the free energy about its minimum rather than the equilibrium pair momentum itself. Using a Wannier-based, self-consistent finite-$\\mathbf Q$ Bogoliubov-de Gennes approach with a Fermi-surface-adaptive quadrature that converges the critical currents, we show that the layer parity and orientation of magnetic proximity select the diode response of monolayer NbSe$_2$. For in-plane exchange, the equilibrium pair momentum $\\mathbf Q_{\\rm eq}$ and the diode efficiency are both linear in the layer-odd exchange contrast: parallel proximity on the two Se sublayers is reciprocal, and antiparallel proximity doubles the response. An out-of-plane component separates the two observables. It leaves $\\mathbf Q_{\\rm eq}$ nearly unchanged but, through pair breaking, suppresses the efficiency by more than an order of magnitude and, at low temperature, reverses it. Purely out-of-plane exchange, for which $C_3$ symmetry forbids a helical term, keeps $\\mathbf Q_{\\rm eq}=0$ yet produces a trigonal diode effect, controlled by the layer-even exchange and larger than the in-plane one above $0.65$~meV at low temperature. Magnetic layer parity thus selects between a helical and a trigonal diode channel. The trigonal channel is an intrinsic, symmetry-allowed contribution to the field-free rectification reported in NbSe$_2$/CrBr$_3$ and predicts that two-sided out-of-plane proximity cancels it when antiparallel and, at the same exchange per layer, enhances it about fourfold when parallel, in the computed range.", "tier": "B_IMPORTANT_CONDMAT", "score": "9", "reason": "Theory of superconducting diode effects in NbSe2, a relevant material in the user's profile.", "tags": ["su "]}}, {"title": "Light-Cone Friedel Oscillations: a Window into van Hove Superconductivity", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2610.40648", "authors": "Archisman Panigrahi, Vladislav Poliakov, Leonid Levitov", "last_authors": "Vladislav Poliakov, Leonid Levitov", "summary": "Van Hove (vH) singularities can enhance superconductivity by generating a large pairing susceptibility. Yet, it remains challenging to experimentally establish whether pairing really occurs near these points. We show that the saddle-point dispersion near a vH point gives rise to a `light-cone' vH-selective behavior of Friedel oscillations, which is drastically different from the familiar concentric circles. Each vH point maps onto its own real-space light-cone sector, allowing STM around a single impurity to measure whether---and how strongly---that saddle-point quasiparticle sector is gapped. A superconducting gap near vH points suppresses the oscillations in the directions corresponding to peaks in the gap function angular dependence, a behavior that provides a signature of vH-related pairing at STM-accessible length scales. This STM protocol, targeting vH superconductivity, is capable of determining whether superconducting pairing emerges near the vH points or elsewhere on the Fermi surface.", "tier": "B_IMPORTANT_CONDMAT", "score": "9", "reason": "Direct STM proposal for probing van Hove superconductivity relevant to kagome or moire systems.", "tags": ["STM", "superconductivity", "vanHove", "Friedeloscillations"], "image": "https://arxiv.org/html/2610.40648v1/Fig1_Oct18.png", "briefing": {"background": "Van Hove(vH) 특이점은 페르미 준위 근처에서 상태 밀도가 발산하여 강한 전자 상관관계와 초전도성을 유도하는 주요 지점으로 간주됩니다.", "motivation": "vH 특이점이 실제 초전도 페어링에 직접적으로 기여하는지, 페르미 면의 어느 영역에서 초전도 갭이 형성되는지를 STM으로 직접 확인하는 방법을 모색했습니다.", "result": "안장점(saddle point) 분산에 의해 발생하는 Friedel oscillation이 일반적인 원형 형태가 아닌 'light-cone' 구조를 띰을 보였습니다. 초전도 갭이 형성될 경우, 특정 운동량 영역에서 oscillation의 진폭이 억제됨을 확인했습니다.", "implication": "STM을 사용하여 초전도 갭의 각도 의존성을 국소적으로 측정함으로써 vH 특이점 기반의 초전도 페어링을 실험적으로 증명할 수 있는 구체적인 프로토콜을 제공합니다.", "novelty": "기존의 전형적인 Friedel oscillation 분석법을 탈피하여, vH 영역의 특이적인 전자 구조를 투영하는 'light-cone' 시그니처를 활용해 초전도 페어링의 기원을 식별할 수 있게 했습니다.", "unresolved": "불순물 산란의 강도에 따라 Friedel oscillation 신호가 약해질 수 있으며, 복잡한 밴드 구조를 가진 물질에서의 명확한 신호 분리가 관건입니다.", "future_work": "Kagome 금속(AV3Sb5)이나 moire 격자 시스템의 vH 특이점 근처에서 해당 시그니처를 STM으로 검출하는 후속 연구가 예상됩니다.", "concepts": [{"term": "Van Hove Singularity", "why_emerged": "상태 밀도(DOS)의 발산이 초전도나 자성 등 집단 현상의 기원이 됨을 설명하기 위해 필요합니다.", "origin": "Léon Van Hove (1953)에 의해 제안되었습니다.", "connections": "안장점(Saddle point), 페르미 면, 초전도 페어링 불안정성과 직접 연결됩니다."}, {"term": "Friedel Oscillations", "why_emerged": "금속 내 전자가 결함이나 불순물에 의해 산란될 때 페르미 파장에 따라 발생하는 전자 밀도 분포의 공간적 떨림을 설명합니다.", "origin": "Jacques Friedel (1952)에 의해 정립되었습니다.", "connections": "STM quasiparticle interference(QPI)와 함께 페르미 면 구조를 분석하는 도구로 쓰입니다."}], "english_summary": ["Proposes using 'light-cone' Friedel oscillations as an STM probe for van Hove (vH) superconductivity.", "Shows that saddle-point dispersion creates distinct oscillation patterns differing from concentric circles.", "Suppression of oscillations in specific sectors provides evidence for gap formation near vH points.", "Offers a protocol to determine if superconductivity is driven by vH singularities in correlated materials."]}}, {"title": "Selective effects of selenium substitution on superconductivity and magnetic memory in 4Hb-TaS2", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2610.39969", "authors": "Shalev Gur, Sajilesh K. P., Shubam Purwar, et al.", "last_authors": "Amit Kanigel, Beena Kalisky", "summary": "Disorder plays a central role in correlated quantum materials, but its effects can be highly selective when several electronic orders coexist. The van der Waals heterostructure 4Hb-TaS2 provides such a case, combining superconductivity, charge-order tendencies, strong scattering, and magnetic ng": {"background": "비공면/비공선형 반강자성체에서 나타나는 홀 효과는 자성 대칭성과 전자의 Berry 곡률 간의 관계를 이해하는 데 중요함.", "motivation": "UNi4B의 자기 질서 상태와 연관된 논쟁적인 홀 저항 성분을 해석하고 자기 대칭성을 규명하고자 함.", "result": "영장 및 인가 자기장 하에서 홀 저항 성분을 측정하였으며, 이는 기존 모델보다 낮은 단사정계 자기 대칭성을 시사함.", "implication": "자기 대칭성 분석이 재료의 위상학적 특성과 비정상 홀 효과의 기원을 이해하는 데 결정적임을 입증함.", "novelty": "UNi4B의 비정상 홀 효과에서 본질적인 기여를 확인하고, 이를 대칭성 기반의 새로운 자기 구조 모델로 설명함.", "unresolved": "자기 대칭성에 대한 정확한 원자 수준의 구조 모델이 완전하게 정립되지 않았을 가능성.", "future_work": "중성자 산란 등을 통한 자기 구조의 직접적 이미지화 및 DFT 계산을 통한 Berry 곡률 분석.", "concepts": [{"term": "Anomalous Hall effect", "why_emerged": "자성 재료에서 자기장에 비례하지 않는 홀 전도도가 발견됨에 따라 물리적 기원을 찾기 위해 필요.", "origin": "Karplus and Luttinger (1954).", "connections": "Berry 곡률, 스핀-궤도 결합, 위상학적 홀 효과."}, {"term": "Noncollinear antiferromagnet", "why_emerged": "자기 모멘트가 한 방향으로 정렬되지 않는 복잡한 자기 질서를 기술하기 위해 필요.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "자기 대칭성, 비정상 홀 효과, 위상학적 반금속."}], "english_summary": ["Studies Hall effect in the noncollinear antiferromagnet UNi4B.", "Identifies intrinsic contributions to the anomalous Hall effect.", "Suggests a monoclinic magnetic symmetry lower than previous models.", "Confirms that magnetic symmetry is key to interpreting Hall resistivity."]}}, {"title": "Magnetism and symmetry of superconducting gap in LaFeAsO from dynamical mean-field theory", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/gfr4-g54x", "authors": "S. L. Skornyakov, V. I. Anisimov, A. A. Katanin", "last_authors": "V. I. Anisimov, A. A. Katanin", "summary": "By employing a combined method of density functional theory and dynamical mean field theory $(\\mathrm{DFT}+\\mathrm{DMFT})$ we investigate the effect of electronic correlations on the magnetic and superconducting properties of the iron-based parent compound LaFeAsO. We find that the static nonlocal s…", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Electronic structure (DFT+DMFT) study of iron pnictide superconductivity.", "tags": ["material", "superconductivity", "DFT+DMFT"], "image": "", "briefing": {"background": "철 기반 초전도체(FeSC)의 모체 화합물에서 자기 질서와 초전도성 사이의 강한 상관관계를 이해하는 것은 고온 초전도 연구의 핵심임.", "motivation": "LaFeAsO 모체 화합물에서 전자 상관관계가 자기적 성질과 초전도 갭 구조에 미치는 영향을 규명하기 위함.", "result": "DFT+DMFT 계산을 통해 전자 상관관계가 정적인 비국소 s-파 초전도 갭 구조에 미치는 영향을 분석함.", "implication": "강상관 전자계에서 다체 효과를 고려해야만 실제 재료의 자기적·초전도적 물성을 정확히 기술할 수 있음을 재확인.", "novelty": "기존 DFT보다 향상된 DFT+DMFT 방법을 사용하여 FeSC의 자기 질서와 초전도 갭의 대칭성을 통합적으로 접근함.", "unresolved": "DMFT 계산의 복잡성으로 인해 비국소적 상관관계의 완전한 구현과 실험 데이터와의 정량적 일치도는 추가 검토가 필요.", "future_work": "온도에 따른 갭 변화 계산 및 실제 ARPES 측정값과의 비교 분석.", "concepts": [{"term": "DFT+DMFT", "why_emerged": "밀도범함수이론(DFT)의 강상관 전자계 기술 한계를 보완하기 위해 필요.", "origin": "Kotliar et al. (2006).", "connections": "동역학적 평균장 이론, 강상관 전자계, 철 기반 초전도체."}, {"term": "Iron-based parent compound", "why_emerged": "초전도 현상이 나타나기 전의 자기적/구조적 상전이를 이해하기 위해 필요.", "origin": "Kamihara et al. (2008).", "connections": "스핀 밀도파, 네마틱성, 고온 초전도."}], "english_summary": ["Employs DFT+DMFT to study LaFeAsO.", "Investigates the impact of electronic correlations on magnetism and superconductivity.", "Analyzes the effect of correlations on the superconducting gap symmetry.", "Reinforces the necessity of dynamical correlation treatments in iron-pnictides."]}}, {"title": "Observation of gapped Dirac magnons in a Co bilayer grown on Ru(0001)", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/cprf-rwsn", "authors": "Khalil Zakeri, Arthur Ernst, Christopher Hins", "last_authors": "Arthur Ernst, Christopher Hins", "summary": "Long celebrated in graphene, Dirac physics inspires the search for similar phenomena in magnonic systems. Here, the authors experimentally demonstrate that magnons in an epitaxial Co bilayer on Ru(0001) exhibit Dirac properties near the Brillouin zone corner. Remarkably, the substrate does not destroy the essential physics; despite breaking sublattice symmetry and opening a gap, local valley topology remains intact. Beyond opening possibilities for discovering Dirac magnons in other ultrathin 3 d magnetic films, these findings hold promise for on-chip magnonic applications.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Experimental evidence for Dirac-like excitations in a magnetic 2D system.", "tags": ["method", "spectroscopy", "magnon"], "image": "", "briefing": {"background": "자성체 내의 준입자인 마그논(magnon)은 격자 구조의 대칭성에 따라 그래핀의 전자와 유사한 디락(Dirac) 분산 관계를 가질 수 있습니다. 이는 정보 처리에 활용 가능한 차세대 마그노닉스 소자 개발의 핵심 기초가 됩니다.", "motivation": "자성 금속인 Co 이층막을 Ru(0001) 기판 위에 성장시켰을 때, 하부 기판에 의한 대칭성 깨짐이 마그논의 디락 물리 특성을 어떻게 보존하거나 변형시키는지 규명하고자 했습니다.", "result": "Co 이층막에서 브릴루앙 영역 구석 근처에 디락 마그논이 존재함을 확인했습니다. 기판과의 상호작용으로 인해 격자 대칭성이 깨지며 에너지 간극이 발생함에도 불구하고, 국소적인 밸리(valley) 위상 특성은 유지됨을 밝혔습니다.", "implication": "초박막 자성 시스템에서도 디락 마그논이 살아있을 수 있음을 입증하여, 향후 자성 박막 기반의 온칩(on-chip) 정보 소자 설계에 물리적 근거를 제공합니다.", "novelty": "기판의 간섭 속에서도 토폴로지적 특성이 보존되는 마그논 상태를 실험적으로 관측했다는 점에서 중요하며, 이는 저차원 자성 시스템의 밴드 엔지니어링 연구에 직결됩니다.", "unresolved": "기판에 의한 대칭성 깨짐이 정확히 어떤 강도로 간극 크기를 결정하는지, 그리고 외부 섭동(자기장 등)에 의해 이 밸리 위상이 어떻게 제어될 수 있는지는 추가 연구가 필요합니다.", "future_work": "다른 3d 전이금속 박막 시스템으로의 확장 연구와 마그논 밸리 자유도를 이용한 논리 소자 구현 실험이 예상됩니다.", "concepts": [{"term": "디락 마그논", "why_emerged": "그래핀의 디락 페르미온과 유사한 선형 분산 관계를 자성체 내 파동인 마그논에서도 찾고자 함.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "토폴로지적 자성체, 마그노닉 결정"}, {"term": "밸리 위상(Valley Topology)", "why_emerged": "운동량 공간에서 서로 다른 극점(valley)에 존재하는 전자 혹은 마그논의 양자 위상차를 기술하기 위해 필요.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "밸리트로닉스, 베리 곡률"}], "english_summary": ["Experimental observation of Dirac magnons in epitaxial Co bilayer on Ru(0001).", "Substrate-induced symmetry breaking opens a gap but preserves local valley topology.", "Demonstrates robustness of Dirac magnon physics in ultrathin magnetic films.", "Potential for developing on-chip magnonic devices using valley degrees of freedom."]}}, {"title": "Raman circular dichroism and spinon quantum geometry of chiral quantum spin liquids", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/n6zn-xvsw", "authors": "Eduard Koller, Valentin Leeb, Natalia B. Perkins, Johannes Knolle", "last_authors": "Natalia B. Perkins, Johannes Knolle", "summary": "We show that the quantum geometry of fractionalized spin excitations in Mott-insulating quantum spin liquids (QSLs) gives rise to a finite Raman circular dichroism (RCD) signal. We identify conditions under which the Loudon-Fleury framework, where light modulates the underlying exchange interactions, and the light-matter-coupling approach, where the effective vector potential couples directly to the spinon bands, yield equivalent Raman vertices for the fractionalized quasiparticles. Using the latter, we derive an analytical decomposition of the RCD into different quantum geometric contributions. This reveals the sensitivity of the RCD to the underlying structure of the wave functions and the handedness of the excitations, rather than a nonzero Chern number of spinon excitations. To illustrate this, we apply our approach to two examples, the Kitaev honeycomb model in a magnetic field and a parton mean-field state of the chiral QSL on the triangular lattice.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Quantum geometry and circular dichroism in spin liquids; highly relevant spectroscopic signatures.", "tags": ["topic", "circulardichroism", "quantumspinliquid"], "image": "", "briefing": {"background": "양자 스핀 액체(QSL)는 장거리 자기 질서가 없는 강한 상관관계 시스템으로, 분할된 준입자인 스핀온(spinon)의 존재를 실험적으로 검증하는 것이 큰 도전 과제입니다.", "motivation": "스핀온들의 양자 기하학적 구조가 빛과의 상호작용인 라만 산란 과정에서 어떻게 나타나는지, 특히 라만 원편광 이색성(RCD)으로 어떻게 감지할 수 있는지 이론적으로 탐구했습니다.", "result": "라만 원편광 이색성이 스핀온 파동함수의 기하학적 구조에 민감하게 반응함을 증명했습니다. 반드시 체른 수(Chern number)가 0이 아니어야 하는 것은 아니며, 들뜸의 손잡이(handedness) 특성을 반영함을 보였습니다.", "implication": "라만 분광법이 QSL의 내부 구조를 분석하는 강력한 도구가 될 수 있음을 시사하며, 스핀 액체 후보 물질들의 실험적 판별을 위한 이론적 기준을 마련했습니다.", "novelty": "RCD 신호를 단순히 Chern 수와 연결하는 대신 파동함수의 양자 기하학적 관점에서
