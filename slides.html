<!DOCTYPE html>

<head>
<meta charset='UTF-8'>
<meta name='viewport' content='width=device-width, initial-scale=1.0'>
<title>Daily Paper Slideshow</title>
<style>
  :root {
    color-scheme: light;
    --bg: #f6f7f4;
    --paper: #ffffff;
    --ink: #111827;
    --muted: #64748b;
    --line: #d8ddd2;
    --accent: #176b87;
    --accent-2: #9a3412;
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; overflow: auto; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: var(--bg); color: var(--ink); }
  .shell { max-width: 1500px; min-height: 100vh; margin: 0 auto; padding: 14px 18px; display: flex; flex-direction: column; }
  .topbar { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 16px; }
  .top-actions { display: flex; align-items: center; gap: 10px; }
  .topbar a, button { border: 1px solid var(--line); border-radius: 8px; background: var(--paper); color: var(--ink); padding: 10px 14px; font-weight: 700; text-decoration: none; cursor: pointer; }
  button.primary { background: var(--accent); border-color: var(--accent); color: white; }
  button:disabled { opacity: 0.45; cursor: not-allowed; }
  .counter { color: var(--muted); font-weight: 700; }
  .slide { min-height: calc(100vh - 82px); background: var(--paper); border: 1px solid var(--line); border-radius: 10px; padding: 18px; box-shadow: 0 18px 42px rgba(15, 23, 42, 0.10); display: grid; grid-template-columns: minmax(310px, 0.86fr) minmax(0, 1.55fr); gap: 18px; overflow: visible; }
  .paper-head { min-width: 0; min-height: 0; overflow: visible; display: flex; flex-direction: column; gap: 12px; }
  .figure { margin: 0; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: #f8fafc; }
  .figure img { display: block; width: 100%; max-height: 41vh; object-fit: contain; background: white; }
  .figure figcaption { padding: 7px 10px; color: var(--muted); font-size: 12px; line-height: 1.3; }
  .head-text { display: flex; flex-direction: column; gap: 9px; min-width: 0; }
  .badges { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .badge { border-radius: 999px; padding: 5px 9px; background: #eef2ff; color: #3730a3; font-size: 12px; font-weight: 800; }
  .score { background: #fee2e2; color: #991b1b; }
  h1 { margin: 0; font-size: 25px; line-height: 1.15; letter-spacing: 0; overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
  h1 a { color: inherit; text-decoration-color: rgba(23, 107, 135, 0.35); text-decoration-thickness: 2px; text-underline-offset: 4px; }
  h1 a:hover { color: var(--accent); text-decoration-color: var(--accent); }
  .meta, .authors, .why, .abstract { font-size: 13px; line-height: 1.45; }
  .meta, .authors { color: var(--muted); }
  .why strong, .abstract strong, .authors strong { color: var(--ink); }
  .authors { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .why { border-left: 4px solid var(--accent-2); padding-left: 10px; color: #374151; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .abstract { border-top: 1px solid var(--line); padding-top: 14px; color: #374151; }
  .original-abstract { border-top: 1px solid var(--line); padding-top: 10px; color: #374151; font-size: 11.5px; line-height: 1.35; overflow-wrap: anywhere; }
  .original-abstract strong { display: block; margin-bottom: 4px; color: var(--ink); }
  .tags { display: flex; flex-wrap: wrap; gap: 8px; }
  .tag { border-radius: 999px; padding: 4px 8px; background: #f1f5f9; color: #475569; font-size: 12px; font-weight: 700; }
  .head-text > .link { display: none; }
  .briefing { min-width: 0; min-height: 0; overflow: visible; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); grid-auto-rows: minmax(0, auto); align-content: start; gap: 11px 18px; border-top: 0; padding-top: 0; }
  .brief-section { min-width: 0; }
  .brief-section.wide { grid-column: 1 / -1; }
  .brief-section h2 { margin: 0 0 4px; font-size: 14px; line-height: 1.22; color: #0f766e; letter-spacing: 0; }
  .brief-section p, .brief-section li { margin: 0; font-size: 12.5px; line-height: 1.42; color: #1f2937; overflow-wrap: anywhere; }
  .brief-section ul { margin: 0; padding-left: 20px; }
  .concepts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 9px 14px; }
  .concept { border-top: 1px solid var(--line); padding-top: 7px; }
  .concept h3 { margin: 0 0 4px; font-size: 13px; color: #7c2d12; letter-spacing: 0; }
  .concept p { margin: 2px 0 0; font-size: 11.5px; line-height: 1.35; color: #374151; overflow-wrap: anywhere; }
  .concept b { color: #111827; }
  .link { color: var(--accent); font-weight: 800; text-decoration: none; }
  .empty { padding: 48px; background: var(--paper); border: 1px solid var(--line); border-radius: 12px; color: var(--muted); }
  @media (max-width: 860px) {
    .shell { padding: 14px; }
    .topbar, .top-actions { align-items: stretch; flex-direction: column; }
    .slide, .briefing, .concepts { grid-template-columns: 1fr; }
    .slide { min-height: auto; overflow: visible; display: grid; }
    h1 { font-size: 28px; }
  }
</style>

const slides = [{"title": "Direct Visualization of Gate-Tunable Flat Bands in Twisted Double Bilayer Graphene", "journal": "PRL_Recent", "source": "author whitelist", "link": "http://link.aps.org/doi/10.1103/3vg5-vkzy", "authors": "Souvik Sasmal, Ryan Muzzio, Ahmed Khalifa, et al.", "last_authors": "Shubhayu Chatterjee, Jyoti Katoch", "summary": "Author(s): Souvik Sasmal, Ryan Muzzio, Ahmed Khalifa, Paulina Majchrzak, Alfred J. H. Jones, I-Hsuan Kao, Kenji Watanabe, Takashi Taniguchi, Simranjeet Singh, Eli Rotenberg, Aaron Bostwick, Chris Jozwiak, Søren Ulstrup, Shubhayu Chatterjee, and Jyoti Katoch The evolution of moiré minibands under varying carrier density and displacement field may be directly visualized using microfocused angle-resolved photoemission spectroscopy. [Phys. Rev. Lett. 137, 016402] Published Tue Jun 30, 2026", "tier": "A_MUST_READ", "score": "10", "reason": "author whitelist: Eli Rotenberg", "tags": ["angle-resolvedphotoemission", "photoemission", "graphene", "moir", "twisted", "flatband"], "image": "", "briefing": {"background": "그래핀 층을 특정 각도로 비틀면 모아레(moiré) 무늬가 형성되면서 전자의 운동에너지가 억제되는 플랫 밴드(flat band)가 나타납니다. 특히 비틀린 이중층-이중층 그래핀(TDBG)은 외부 수직 전기장(displacement field)을 통해 전자 구조를 조절할 수 있어 상관 관계(correlation) 물성 연구의 핵심 시스템으로 꼽힙니다.", "motivation": "TDBG에서 이론적으로 예측된 플랫 밴드의 존재와, 게이트 전압 및 변위장에 따른 이들의 진화 과정을 마이크로 영역 분광법을 통해 직접적으로 시각화하여 확인하고자 했습니다.", "result": "Micro-ARPES 기술을 사용하여 TDBG의 모아레 미니밴드(miniband)를 직접 관측하는 데 성공했습니다. 특히 캐리어 농도와 수직 전기장의 변화에 따라 플랫 밴드의 위치와 폭이 어떻게 조절되는지를 실시간 공간 및 운동량 분해능으로 입증했습니다.", "implication": "이론적 예측에 머물던 TDBG의 에너지 밴드 튜닝 가능성을 실험적으로 확립했습니다. 이는 향후 TDBG 기반의 소자에서 나타나는 초전도성이나 절연체 상태의 미시적 기원을 이해하는 데 필수적인 기초 데이터를 제공합니다.", "novelty": "ARPES 전문가인 Eli Rotenberg 등이 참여한 연구로, 공간 분해능이 극대화된 micro-ARPES를 통해 복잡한 모아레 시스템의 전자 구조를 게이트 전압 하에서 직접 보였다는 점이 독보적입니다. 독자의 관심사인 ARPES 및 모아레 시스템 전자구조와 완벽히 일치합니다.", "unresolved": "실제 전송 측정에서 나타나는 다양한 상관 상태(correlated states)들과 관측된 밴드 구조 사이의 정량적 연결 고리에 대한 추가 분석이 필요합니다.", "future_work": "더 낮은 온도와 높은 분해능을 통해 상관 관계에 의한 밴드 갭 형성 과정을 정밀 추적하고, 다른 비틀림 각도에 따른 위상적 특성 변화를 탐구할 것으로 보입니다.", "concepts": [{"term": "Moiré minibands", "why_emerged": "두 격자 구조가 겹쳐지며 생기는 긴 주기의 패턴에 의해 전자의 브릴루앙 영역이 다시 나누어지며 생성됩니다.", "origin": "초록 정보만으로는 특정하기 어려움 (그래핀 모아레 연구의 일반적 개념)", "connections": "Hofstadter's butterfly, Flat bands, Magic angle"}, {"term": "Displacement field", "why_emerged": "이중층 시스템에서 상하층의 전위를 다르게 하여 대칭성을 깨고 밴드 구조를 조절하기 위해 도입되었습니다.", "origin": "반도체 이종접합 및 이중층 그래핀 물리", "connections": "Gate-tunability, Band gap engineering, Layer polarization"}, {"term": "Micro-ARPES", "why_emerged": "수 마이크로미터 크기의 작은 시료나 불균일한 모아레 도메인의 전자 구조를 측정하기 위해 광원을 집중시킨 ARPES 기술입니다.", "origin": "Advanced Light Source (ALS) 등 방사광 가속기 빔라인", "connections": "Nano-ARPES, Spatially-resolved spectroscopy"}], "english_summary": ["Directly visualized gate-tunable flat bands in twisted double bilayer graphene (TDBG) using micro-ARPES.", "Demonstrated the evolution of moiré minibands under varying carrier density and displacement fields.", "Confirmed the theoretical predictions of electronic structure tuning in moiré superlattices.", "Provides a fundamental spectroscopic basis for understanding correlated phases in TDBG."]}}, {"title": "Dynamics of a jointly commensurate moir\\'e charge density wave", "journal": "arXiv_CondMat", "source": "author whitelist", "link": "https://arxiv.org/abs/2509.16493", "authors": "Kyoung Hun Oh, Yifan Su, Honglie Ning, et al.", "last_authors": "Hoyoung Jang, Nuh Gedik", "summary": "arXiv:2509.16493v3 Announce Type: replace Abstract: The advent of two-dimensional moir\\'e systems has revolutionized the exploration of phenomena arising from strong correlations and nontrivial band topology. Recently, a moir\\'e superstructure formed by two coexisting charge density waves (CDWs) with slightly mismatched wavevectors has been realized. These incommensurate CDWs can collectively exhibit commensurability, resulting in the jointly commensurate CDW (JC-CDW) and establishing a new paradigm for controlling moir\\'e 니다.", "novelty": "알터자성의 고유 특성인 모멘텀 의존적 스핀 분할을 안드레예프 반사라는 수송 특성 측정법을 통해 실험적으로 포착했습니다. 이는 알터자성체와 초전도체 접합 연구의 시초가 될 수 있어 독자의 ARPES 및 수송 연구 관심사와 밀접합니다.", "unresolved": "모멘텀 공간에서의 정밀한 밴드 분할 양상을 완전히 매핑하기 위해서는 ARPES를 통한 직접적인 밴드 관측 데이터와의 추가적인 비교가 필요할 수 있습니다.", "future_work": "CrSb 기반의 터널 접합 소자 제작 및 알터자성 토크를 이용한 스핀 소자 구현 연구가 이어질 것으로 보입니다.", "concepts": [{"term": "Altermagnetism (알터자성)", "why_emerged": "강자성과 반강자성의 장점을 결합한 새로운 자성 분류가 필요해짐에 따라 등장했습니다.", "origin": "최근 Libor Šmejkal 등에 의해 이론적으로 체계화됨", "connections": "반강자성, 스핀-궤도 결합, 홀 효과"}, {"term": "Andreev Reflection (안드레예프 반사)", "why_emerged": "금속-초전도체 계면에서 전하 수송 메커니즘을 이해하고 스핀 분극 정도를 측정하기 위해 도입되었습니다.", "origin": "Alexander F. Andreev (1964)", "connections": "쿠퍼 쌍, 스핀 분극 분광학, 근접 효과"}, {"term": "CrSb", "why_emerged": "높은 네엘 온도를 가진 반강자성체로 알려졌으나, 알터자성 특성을 보일 것으로 예측되어 주목받았습니다.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "NiAs 구조, 알터자성, 스핀트로닉스"}, {"term": "Spin Polarization (스핀 분극)", "why_emerged": "스핀트로닉스 소자에서 정보 전달 효율을 결정하는 핵심 지표이기 때문입니다.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "스핀 주입, 거대 자기저항(GMR), 스핀 홀 효과"}], "english_summary": ["Experimentally probed momentum-dependent spin polarization in altermagnetic CrSb using Andreev reflection.", "Confirmed the existence of spin-split band structures consistent with altermagnetic symmetry.", "Established CrSb as a promising candidate for high-efficiency spintronic applications without net magnetization.", "Validated theoretical predictions of k-dependent spin transport in this new class of magnetic materials."]}}, {"title": "Observation of quantum vortex core fractionalization and skyrmion formation in a superconductor", "journal": "Science", "source": "author whitelist", "link": "https://www.science.org/doi/abs/10.1126/science.ads0189?af=R", "authors": "Yu Zheng, Quanxin Hu, Xin Yu, et al.", "last_authors": "Chi-Ming Yim, Hong Ding", "summary": "Science, Volume 393, Issue 6806, Page 80-84, July 2026.", "tier": "A_MUST_READ", "score": "9", "reason": "author whitelist: Hong Ding", "tags": ["superconduct"], "image": "", "briefing": {"background": "초전도체 내부의 양자 소용돌이(vortex)는 통상적으로 정수 단위의 자기 선속을 가집니다. 하지만 특수한 대칭성이나 위상학적 성질을 가진 초전도체에서는 이 소용돌이가 더 작은 단위로 쪼개지거나 복잡한 자기 구조를 형성할 수 있다는 이론이 있었습니다.", "motivation": "위상 초전도 특성이나 다중 밴드 효과가 기대되는 물질에서 소용돌이 핵의 내부 구조를 직접 관찰하여 이론적으로만 예견되었던 소용돌이 분획화 현상을 증명하고자 했습니다.", "result": "특정 초전도체 내에서 양자 소용돌이 핵이 여러 개로 분획화(fractionalization)되는 현상을 관찰했으며, 이 과정에서 스커미온(skyrmion) 형태의 자기 구조가 형성됨을 실험적으로 확인했습니다.", "implication": "초전도와 위상학적 자기 구조가 결합된 새로운 양자 상태를 발견한 것으로, 마요라나 제로 모드 탐색이나 소용돌이 기반 양자 소자에 중요한 전기를 마련했습니다.", "novelty": "홍딩(Hong Ding) 교수 그룹의 연구로, 초전도 소용돌이 내에서 스커미온 형성을 직접 확인한 것은 매우 이례적이며 높은 학술적 가치를 지닙니다. 이는 독자의 STM 및 위상 초전도 관심사와 직접 연결됩니다.", "unresolved": "이러한 분획화된 소용돌이의 안정성과 외부 자기장/온도 변화에 따른 거동에 대한 상세한 메커니즘 규명이 남아 있습니다.", "future_work": "분획화된 소용돌이 핵에서의 국소 상태 밀도(LDOS) 측정을 통한 마요라나 페르미온 존재 여부 확인 연구가 기대됩니다.", "concepts": [{"term": "Quantum Vortex Fractionalization (양자 소용돌이 분획화)", "why_emerged": "단일 밴드 초전도체에서 설명할 수 없는 복잡한 소용돌이 거동을 설명하기 위해 도입되었습니다.", "origin": "초록 정보만으로는 특정하기 어려움 (E. Babaev 등이 이론적 제시)", "connections": "다중 성분 초전도체, 위상학적 결함"}, {"term": "Skyrmion (스커미온)", "why_emerged": "연속적인 장에서 위상학적으로 보호되는 입자 형태의 구조를 설명하기 위해 등장했습니다.", "origin": "Tony Skyrme (1962)", "connections": "위상 자성, 스핀 텍스처, 홀 효과"}, {"term": "Vortex Core (소용돌이 핵)", "why_emerged": "초전도체에 자기장이 침투할 때 초전도성이 파괴되는 중심 영역을 정의하기 위해 필요합니다.", "origin": "Abrikosov (1957)", "connections": "제2종 초전도체, 코히어런스 길이"}, {"term": "Hong Ding (홍딩)", "why_emerged": "ARPES와 STM을 이용한 고온 초전도체 및 위상 물질 연구의 선구적인 연구자입니다.", "origin": "해당 분야 권위자", "connections": "철계 초전도체, 위상 절연체, 마요라나 페르미온"}], "english_summary": ["Reported the observation of quantum vortex core fractionalization in a superconducting system.", "Identified the formation of skyrmion structures within the vortex cores using advanced imaging.", "Demonstrated an unexpected interplay between superconductivity and topological magnetic textures.", "Provides a new platform for studying topological excitations in unconventional superconductors."]}}, {"title": "Realization of strongly correlated 2D honeycomb boron", "journal": "Science_Advances", "source": "author whitelist", "link": "https://www.science.org/doi/abs/10.1126/sciadv.aee3116?af=R", "authors": "Takemi Kato, Tomonori Nakamura, Kosuke Nakayama, et al.", "last_authors": "Yoshinori Okada, Takafumi Sato", "summary": "Science Advances, Volume 12, Issue 27, July 2026.", "tier": "A_MUST_READ", "score": "9", "reason": "author whitelist: Takafumi Sato", "tags": ["correlated"], "image": "", "briefing": {"background": "보로핀(Borophene)은 탄소의 그래핀처럼 붕소 원자가 2차원 층을 이룬 물질입니다. 붕소는 원자가 전자가 부족하여 다양한 격자 구조와 전자적 특성을 가질 수 있어 차세대 2차원 소자 후보로 연구되어 왔습니다.", "motivation": "그동안 금속적 성질이 강했던 보로핀에서 전자 간의 상호작용이 강하게 작용하는 '강상관(Strongly Correlated)' 허니컴 구조를 구현하여 새로운 물리 현상을 탐구하고자 했습니다.", "result": "특정 기판 위에서 원자적으로 정렬된 허니컴 구조의 붕소 단일층을 합성하는 데 성공했으며, ARPES 등을 통해 이 시스템에서 강력한 전자 상관관계에 의한 밴드 재구조화 현상을 관찰했습니다.", "implication": "그래핀과 유사한 구조에서 탄소와는 다른 강상관 물리(예: 모트 절연체 상태, 비전통적 초전도성 가능성)를 연구할 수 있는 새로운 플랫폼을 확보했습니다.", "novelty": "사토(Takafumi Sato) 교수 등 ARPES 전문가들이 참여하여, 단순한 2차원 물질 합성을 넘어 그 안의 강력한 전자 상관관계를 입증했다는 점이 중요합니다. 독자의 ARPES 및 2차원 물질 관심사에 부합합니다.", "unresolved": "상관관계의 강도를 조절할 수 있는 게이팅 기술이나, 이로 인해 유도될 수 있는 자성 또는 초전도성의 직접적 증거는 아직 부족합니다.", "future_work": "도핑 변화에 따른 위상 전이 탐색 및 다른 2차원 물질과의 헤테로 구조 형성을 통한 특성 제어 연구가 예상됩니다.", "concepts": [{"term": "Honeycomb Boron (허니컴 붕소)", "why_emerged": "그래핀의 붕소 버전으로서 특이한 디락 페르미온 및 전자 구조를 연구하기 위해 제안되었습니다.", "origin": "이론적 예측 후 최근 실험적 합성 진행 중", "connections": "보로핀, 그래핀, 디락 반금속"}, {"term": "Strong Correlation (강상관 관계)", "why_emerged": "독립 전자 모델로는 설명할 수 없는 전하 간의 강력한 쿨롱 상호작용 효과를 다루기 위해 필요합니다.", "origin": "Mott, Hubbard 등 (20세기 중반)", "connections": "모트 절연체, 고온 초전도, 중이온 페르미온"}, {"term": "Borophene (보로핀)", "why_emerged": "탄소 이외의 원소로 이루어진 2차원 원자층 물질의 다양성을 확보하기 위해 연구되었습니다.", "origin": "Mannix et al. (2015) 실험적 발견", "connections": "2D 소재, 고체 표면 과학"}, {"term": "Takafumi Sato (사토 타카후미)", "why_emerged": "고분해능 ARPES를 통해 다양한 양자 물질의 전자 구조를 정밀하게 규명해 온 연구자입니다.", "origin": "토호쿠 대학 교수", "connections": "ARPES, 위상 물질, 강상관 계"}], "english_summary": ["Successfully realized a strongly correlated electronic state in a 2D honeycomb boron lattice.", "Utilized ARPES to characterize the electronic structure and verify the impact of electron correlations.", "Expanded the scope of borophene from simple metals to complex correlated systems.", "Opened possibilities for studying Mott physics and unconventional superconductivity in boron-based 2D materials."]}}, {"title": "Electrically tunable interfacial thermal conduction via electronic structure engineering in Au/Bi1-xSbx topological insulators", "journal": "arXiv_CondMat", "source": "author whitelist", "link": "https://arxiv.org/abs/2607.02899", "authors": "Min Young Kim, Joon Sang Kang, Jangwoo Ha, et al.", "last_authors": "Jyoti Katoch, Joseph P. Heremans", "summary": "arXiv:2607.02899v1 Announce Type: new Abstract: This work provides direct experimental evidence for the role of topological interface states in thermal conduction across a metal/topological insulator junction. It also shows that this conduction can be reversibly modulated by electrical current injection, offering a new approach toward active control of heat flow at solid-state interfaces. Specifically, the interfacial thermal conductance of ${Au}$/$Bi_{89}$$Sb_{11}$ and ${Au}$/$Bi_{87}$$Sb_{13}$ junctions demonstrates distinct temperature- and bias-dependent behavior. Both responses are attributed to carrier redistribution between topological interface and bulk band states, driven thermally by Fermi-Dirac broadening and electrically by quasi-Fermi-level shifts and WKB tunneling into nearby bulk bands. Control experiments using trivial semimetals and insulating interlayers further confirm the topological specificity of the effect. Such electrically tunable interfacial heat conduction positions interface electronic structure engineering as a promising route for active thermal management. In doing so, it lays the groundwork for a mechanically robust alternative to conventional structure-driven thermal control compatible with increasingly dense, high-power solid-state devices.", "tier": "A_MUST_READ", "score": "9", "reason": "author whitelist: Chris Jozwiak", "tags": ["Dirac", "topologicalinsulator", "topological"], "image": "https://arxiv.org/static/browse/0.3.4/images/arxiv-logo-fb.png", "briefing": {"background": "반도체와 마이크로 장치가 소형화되고 고전력화됨에 따라 기기 내부의 열 방출을 제어하는 열 관리 기술이 중요해지고 있습니다. 특히 고체 계면에서의 열 전도(interfacial thermal conduction)는 장치의 효율성을 결정짓는 핵심 요소입니다.", "motivation": "위상 절연체(Topological Insulator, TI)의 표면 상태가 열 전달에 기여한다는 가설이 있었으나, 이를 직접적인 실험으로 증명하고 전기적으로 제어하려는 시도는 부족했습니다.", "result": "Au/Bi1-xSbx 접합에서 위상 계면 상태가 열 전도에 미치는 역할을 실험적으로 입증했습니다. 전기적 전류 주입을 통해 준-페르미 준위(quasi-Fermi-level)를 이동시키고 벌크 밴드로의 터널링을 유도함으로써 계면 열 전도도를 가역적으로 조절하는 데 성공했습니다.", "implication": "구조적 변화 없이 전자 구조 엔지니어링만으로 고체 계면의 열 흐름을 능동적으로 제어할 수 있는 새로운 경로를 제시했습니다.", "novelty": "사용자의 관심사인 Bi-Sb 위상 절연체 시스템을 활용했으며, 단순히 물성을 측정하는 데 그치지 않고 '전기적 튜닝'을 통한 열 제어라는 실용적 가능성을 TI에서 찾아냈다는 점이 독보적입니다.", "unresolved": "전류 주입에 따른 줄 가열(Joule heating) 효과와 순수하게 위상 상태에 의한 열전도 변화를 완벽하게 분리하여 정량화하는 상세한 후속 연구가 필요할 수 있습니다.", "future_work": "다양한 위상 물질 계면으로의 확장 및 초소형 고출력 소자의 방열 솔루션 적용 연구가 기대됩니다.", "concepts": [{"term": "Bi1-xSbx", "why_emerged": "최초의 3차원 위상 절연체 후보물질로서, 조성비 x에 따라 밴드 갭과 위상적 특성이 변하기 때문에 연구 가치가 높습니다.", "origin": "2008년 Hsieh 등에 의해 실험적으로 위상 절연체임이 처음 확인되었습니다.", "connections": "Bi2Se3, Bi2Te3와 같은 후속 위상 절연체 연구의 시발점이 되었습니다."}, {"term": "Interfacial Thermal Conductance (ITC)", "why_emerged": "서로 다른 두 물질 사이의 계면에서 발생하는 열 저항을 이해하고 줄이기 위해 고안된 개념입니다.", "origin": "초록 정보만으로는 특정하기 어려우나 Kapitza 저항 연구에서 유래했습니다.", "connections": "포논 산란, 전자-포논 결합, 그리고 본 논문에서 제시한 위상 전자 상태와 연결됩니다."}, {"term": "Fermi-Dirac Broadening", "why_emerged": "온도가 상승함에 따라 페르미 준위 근처의 전자 분포가 점진적으로 변하는 현상을 설명하기 위해 필요합니다.", "origin": "Enrico Fermi와 Paul Dirac이 독립적으로 제안한 통계 역학에서 유래했습니다.", "connections": "고온에서의 열전 특성 및 전기 전도도 변화를 설명하는 기초 원리입니다."}, {"term": "WKB Tunneling", "why_emerged": "전위 장벽을 통과하는 입자의 투과 확률을 근사적으로 계산하기 위해 등장했습니다.", "origin": "Wentzel, Kramers, Brillouin의 이름을 따서 명명되었습니다.", "connections": "반도체 접합부의 누설 전류나 주사 터널링 현미경(STM)의 기본 원리와 연결됩니다."}], "english_summary": ["Demonstrates electrical control of interfacial thermal conductance in Au/BiSb topological insulator junctions.", "Attributes the modulation to carrier redistribution between topological interface states and bulk bands via quasi-Fermi-level shifts.", "Provides direct experimental evidence for the role of topological states in heat transport.", "Proposes a non-mechanical, active thermal management strategy compatible with high-power solid-state devices."]}}, {"title": "From Dirac Cones to Semions: An Exact Finite-Size Theory of Parity-Anomaly Transport in Chiral Spin Liquids", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2607.01341", "authors": "Kumar Ghosh", "last_authors": "Kumar Ghosh", "summary": "arXiv:2607.01341v2 Announce Type: replace Abstract: Chiral spin liquids realize a topological state whose universal response is a fractional spin Hall conductance $\\nu_s$. The three quantities that determine this response, the integer Chern number of the fractionalized spinons, the level of the emergent Chern--Simons gauge field, and the physically measured spin pump, are related but distinct, and their relation is often stated only schematically. Here we derive it from a single object: the parity-odd determinant of a gapped Dirac cone on a spatial cylinder, resummed exactly to all orders in the compact holonomy. This determinant fixes the map from spinon topology to measurable response, and proves that finite-size corrections to the topological pump are strictly exponential, with no universal $1/L$ term. We test the resulting predictions on the kagome chiral spin liquid at three independent levels: the exact one-loop field theory, a parton band-structure calculation ($C=-1$, converging exponentially over cylinders four to twelve sites wide), and an interacting density-matrix renormalization group flux pump on the explicitly chiral $J$--$J_\\chi$ Hamiltonian ($\\nu_s=-0.500\\pm0.011$). All three agree with the analytic prediction without adjustable parameters, providing a fully quantitative bridge between microscopic topology and observable fractional response.", "tier": "A_MUST_READ", "score": "9", "reason": "Theory on parity-anomaly transport in kagome chiral spin liquids with Dirac cones and Chern number.", "tags": ["theory", "kagome", "spinliquid", "topological", "transport", "Dirac", "Chern"], "image": "https://arxiv.org/html/2607.01341v2/x1.png", "briefing": {"background": "카고메 격자나 스핀 액체 후보 물질에서 나타나는 비정상적인 수송 현상은 위상 물리학의 핵심 연구 주제입니다. 특히 카이랄 스핀 액체(Chiral Spin Liquid, CSL)는 분수화된 스핀론(spinon)과 관련된 독특한 응답을 보입니다.", "motivation": "CSL의 위상적 응답인 분수 스핀 홀 전도도와 미시적인 위상 불변량(Chern number), 그리고 실제 측정 가능한 스핀 펌프 사이의 관계를 수학적으로 명확하게 연결하고자 했습니다.", "result": "실린더 기하학 구조에서 갭이 있는 디락 콘(Dirac cone)의 패리티-홀수 행렬식(parity-odd determinant)을 정확히 계산하여, 유한한 크기 효과가 지수함수적으로 감소함을 증명했습니다. 이를 통해 카고메 CSL 모델에서 측정된 수송 계수와 이론적 위상 수치가 일치함을 확인했습니다.", "implication": "미시적 위상 특성과 거시적 관측량 사이의 정량적 가교를 마련했으며, 카고메 격자 기반 스핀 액체 연구에 강력한 이론적 도구를 제공합니다.", "novelty": "사용자의 주요 관심사인 카고메 금속/절연체 및 디락 콘 물리와 직접 연결되며, 이론적으로 모호했던 위상 펌핑의 유한 크기 보정 문제를 해결했습니다.", "unresolved": "이 이론이 비-아벨리안(non-Abelian) 위상 상태나 더 복잡한 상호작용이 있는 시스템에서도 동일하게 적용될 수 있는지에 대한 연구가 남아 있습니다.", "future_work": "실제 카고메 물질(예: Herbertsmithite 등)에서 분수화된 응답을 측정하는 실험과의 비교 연구가 기대됩니다.", "concepts": [{"term": "Chiral Spin Liquid (CSL)", "why_emerged": "시간 역전 대칭성이 깨졌으면서도 장범위 자기 질서가 없는 양자 자성 상태를 설명하기 위해 등장했습니다.", "origin": "1987년 Kalmeyer와 Laughlin이 처음 제안했습니다.", "connections": "분수 양자 홀 효과, 애니온(anyon) 물리와 밀접한 관련이 있습니다."}, {"term": "Parity Anomaly", "why_emerged": "홀수 차원 시공간에서 디락 페르미온이 대칭성을 유지하면서도 양자 역학적으로 게이지 불변성을 위반하는 현상을 설명합니다.", "origin": "1984년 Redlich 등에 의해 정립되었습니다.", "connections": "Chern-Simons 이론, 위상 절연체의 표면 상태 전도와 연결됩니다."}, {"term": "DMRG (Density Matrix Renormalization Group)", "why_emerged": "1차원 및 사다리 구조의 강관련 전자계에서 바닥 상태 에너지를 매우 정확하게 계산하기 위해 개발되었습니다.", "origin": "1992년 Steven White가 제안했습니다.", "connections": "행렬 곱 상태(Matrix Product States, MPS) 이론의 기초가 되었습니다."}, {"term": "Kagome Lattice", "why_emerged": "기하학적 좌절(frustration)이 극대화된 구조로, 독특한 밴드 평탄성(flat band)과 위상 특성을 연구하기 위해 중요합니다.", "origin": "일본의 대바구니 패턴 이름에서 유래했습니다.", "connections": "AV3Sb5와 같은 카고메 초전도체 및 위상 물질 연구의 핵심 배경입니다."}], "english_summary": ["Develops an exact finite-size theory for parity-anomaly transport in chiral spin liquids using a gapped Dirac cone model.", "Proves that topological pump corrections vanish exponentially with system size, lacking universal 1/L terms.", "Validates the theory using DMRG on the kagome J-Jchi model, showing excellent agreement for the fractional spin Hall conductance.", "Links microscopic spinon topology directly to measurable fractional response in kagome systems."]}}, {"title": "Resolving the phase of a Dirac topological state via interferometric photoemission", "journal": "arXiv_CondMat", "source": "keyword", "link": "https://arxiv.org/abs/2511.09560", "authors": "Shiri Gvishi, Ittai Sidilkover, Yun Yen, et al.", "last_authors": "Michael Sentef, Hadas Soifer", "summary": "arXiv:2511.09560v2 Announce Type: replace Abstract: The electronic wavefunction is at the heart of physical phenomena, defining the frontiers of quantum materials research. While the amplitude of the electron wavefunction in crystals can be measured with state-of-the-art probes in unprecedented resolution, its phase has remained largely inaccessible, obscuring rich electronic information. Here we develop a quantum-path electron interferometer based on time- and angle-resolved photoemission spectroscopy, that enables the reconstruction of phase information associated with electronic states, as encoded in the photoemission transition amplitudes - with energy and momentum resolution. We demonstrate the scheme by resolving the phase along the Dirac electronic band of a prototypical topological insulator and observe  필요합니다.", "concepts": [{"term": "전하 밀도 파 (Charge Density Wave, CDW)", "why_emerged": "저차원 금속 시스템에서 전자-전자 또는 전자-격자 상호작용에 의해 전하 밀도가 주기적으로 변조되는 현상을 설명하기 위해 도입되었습니다.", "origin": "Rudolf Peierls가 1차원 금속의 불안정성을 예측하며 제안되었습니다 (Peierls instability).", "connections": "NbSe2, CsV3Sb5, 전하 정렬, 초전도와의 경쟁."}, {"term": "엑시톤 응축 (Exciton Condensation)", "why_emerged": "반도체나 반금속에서 전자와 정공이 결합된 엑시톤이 보즈-아인슈타인 응축과 유사한 거동을 보이는 상태를 설명하기 위해 등장했습니다.", "origin": "L. Keldysh 등에 의해 1960년대에 제안되었습니다.", "connections": "절연체-금속 전이, 1T-TiSe2의 CDW 기원 설득력 있는 후보."}], "english_summary": ["Revisits the 3D charge-density-wave (CDW) superlattice structure of 1T-TiSe2.", "Aims to clarify structural details essential for understanding exciton condensation and orbital ordering.", "Refines the structural model to account for previously unexplained physical phenomena like chirality.", "Provides a reliable structural foundation for future electronic structure and transport studies."]}}, {"title": "Two-Band Superconductivity in Few-Layer NbSe2 and TaS2", "journal": "PRL_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/p836-tdgw", "authors": "Shahar Simon, Maya Klang, Oded Millo, Hadar Steinberg", "last_authors": "Oded Millo, Hadar Steinberg", "summary": "Author(s): Shahar Simon, Maya Klang, Oded Millo, and Hadar Steinberg The nature of superconductivity in the transition metal dichalcogenide family, particularly $2{\\mathrm{H}\\text{−}\\mathrm{NbSe}}_{2}$ and $2{\\mathrm{H}\\text{−}\\mathrm{TaS}}_{2}$ in the ultrathin limit, is not fully understood. While tunneling measurements apparently show a single superconducting gap,… [Phys. Rev. Lett. 137, 016001] Published Mon Jun 29, 2026", "tier": "B_IMPORTANT_CONDMAT", "score": "9", "reason": "Experimental study of two-band superconductivity in few-layer NbSe2/TaS2 with tunneling, very relevant.; demoted from A: broad CM, not direct user/project hit", "tags": ["superconductivity", "2Dmaterials", "transitionmetaldichalcogenides", "NbSe2", "TaS2", "STM/STS"], "image": "", "briefing": {"background": "NbSe2와 TaS2와 같은 층상 전이금속 디칼코게나이드(TMD)는 2차원 극한에서도 초전도성을 유지하는 흥미로운 물질입니다. 특히 NbSe2는 다중 밴드(multi-band) 특성을 가진 것으로 알려져 있으나, 극박막 상태에서의 갭 구조에 대해서는 논란이 있었습니다.", "motivation": "두께가 얇아진 초박막 NbSe2와 TaS2에서 터널링 측정 시 단일 갭처럼 보이는 결과들이 존재했는데, 이것이 실제 단일 밴드 초전도성인지 아니면 해상도 문제인지를 규명하고자 했습니다.", "result": "STM/STS 측정 결과, 몇 층(few-layer) 두께의 NbSe2 및 TaS2에서 두 개의 독립적인 초전도 에너지 갭이 존재함을 확인했습니다. 즉, 2차원 극한에서도 2밴드 초전도 특성이 유지됨을 입증했습니다.", "implication": "이 물질들의 초전도 메커니즘이 단순하지 않으며, 여러 밴드에서의 전자 쌍 형성이 동시에 기여하고 있음을 보여줍니다. 이는 이징(Ising) 초전도성 등과의 연관성 해석에 중요합니다.", "novelty": "사용자의 주요 관심사인 STM/STS 기법을 활용하여, 논란이 있던 초박막 TMD의 다중 밴드 초전도성을 명확히 실험적으로 입증했다는 점이 핵심입니다.", "unresolved": "두 밴드 간의 상호작용(coupling) 강도가 층수에 따라 어떻게 변하는지, 그리고 CDW와의 경쟁 관계가 2밴드 특성에 어떤 영향을 주는지에 대한 정밀한 분석이 더 필요합니다.", "future_work": "외부 자기장에 따른 두 갭의 변화 관찰 및 조셉슨 터널링을 이용한 위상 분석 등이 기대됩니다.", "concepts": [{"term": "2밴드 초전도성 (Two-Band Superconductivity)", "why_emerged": "단일 밴드 모델로 설명되지 않는 물질(예: MgB2)에서 서로 다른 페르미 면을 가진 두 밴드가 동시에 초전도에 참여하는 현상을 설명하기 위해 도입되었습니다.", "origin": "Suhl, Matthias, Walker (1959) 등에 의해 이론적으로 제안되었습니다.", "connections": "MgB2, 철계 초전도체, 이징 초전도성."}, {"term": "주사 터널링 분광법 (STS)", "why_emerged": "원자 단위의 해상도로 표면의 국부적인 전자 상태 밀도(LDOS)를 측정하여 에너지 갭을 직접 관찰하기 위해 개발되었습니다.", "origin": "Gerd Binnig, Heinrich Rohrer (STM 발명, 1981).", "connections": "초전도 갭 측정, 준입자 간섭(QPI), 전하 밀도 파 관찰."}], "english_summary": ["Identifies two-band superconductivity in few-layer NbSe2 and TaS2 using high-resolution tunneling measurements.", "Resolves previous ambiguities regarding single-gap versus multi-gap behavior in the 2D limit.", "Confirms that the multi-band nature of parent bulk TMDs persists down to ultrathin layers.", "Supports the presence of distinct superconducting gaps on different Fermi surface sheets."]}}, {"title": "Chiral Phonons Coupled to Spin-Split Bands in Altermagnetic CrSb and MnTe", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2607.04802", "authors": "Armando Consiglio, Maximilian \\\"Unzelmann, Giancarlo Panaccione, Domenico Di Sante", "last_authors": "Giancarlo Panaccione, Domenico Di Sante", "summary": "arXiv:2607.04802v1 Announce Type: new Abstract: Altermagnets exhibit momentum-dependent spin splitting without net magnetization, providing a unique platform where magnetic order, electronic structure and lattice dynamics intertwine. Here, using first-principles calculations, we demonstrate that the prototypical altermagnets CrSb and MnTe host locally chiral phonon modes carrying finite phonon angular momentum with a six-lobes $f$-wave texture in momentum space. Our results show that the chiral lattice motion originates from the pnictogen/chalcogen sublattice, while the altermagnetic spin splitting is generated by the magnetic transition-metal atoms, indicating that chiral lattice dynamics and altermagnetic electronic states originate from different atomic sublattices of the same crystal. In pristine compounds, at each valley, inversion symmetry suppresses the net phonon angular momentum despite local circular atomic motion. We further demonstrate that isoelectronic symmetry lowering induced by chemical substitution lifts this cancellation and generates finite valley phonon chirality, while keeping the altermagnetic nature of the compounds intact. Most importantly, we reveal that chiral phonons couple to momentum-dependent spin-split electronic bands through momentum-dependent electron-phonon interaction, producing characteristic modifications of the electronic structure, possibly accessible by photoemission experiments. Our results establish altermagnets as a promising platform for chiral phononics and spin-selective lattice control.", "tier": "B_IMPORTANT_CONDMAT", "score": "9", "reason": "Directly relevant to altermagnetism and potential ARPES spectroscopic signatures.", "tags": ["altermagnet", "ARPES", "phonon"], "image": "https://arxiv.org/html/2607.04802v1/x1.png", "briefing": {"background": "얼터마그넷(Altermagnet)은 순 자화량은 0이지만 운동량 공간에서 스핀 할당(Spin splitting)이 나타나는 새로운 자성 상입니다. 이 물질군에서는 자기 구조, 전자 구조, 그리고 격자 진동(Phonon) 간의 상호작용이 기존 강자성이나 반강자성과는 다른 양상을 보일 것으로 기대됩니다.", "motivation": "대표적인 얼터마그넷인 CrSb와 MnTe에서 격자의 키랄성(Chirality)을 가진 포논 모드가 존재하는지, 그리고 이것이 얼터마그넷 특유의 스핀 분할된 전자 밴드와 어떻게 결합하는지를 규명하고자 했습니다.", "result": "제1원리 계산을 통해 CrSb와 MnTe가 운동량 공간에서 6개 로브를 가진 f-wave 대칭성의 키랄 포논 모드를 가짐을 확인했습니다. 흥미롭게도 키랄 포논은 비자성 원자(Pnictogen/Chalcogen) 부격자에서 기인하는 반면, 스핀 분할은 자성 금속 부격자에서 발생합니다. 또한 화학적 치환을 통한 대칭성 붕괴가 순 키랄성을 유도하고, 이것이 전자-포논 상호작용을 통해 스핀 분할 밴드에 특징적인 변화를 일으킴을 밝혔습니다.", "implication": "얼터마그넷이 키랄 포논과 스핀 선택적 격자 제어를 위한 유망한 플랫폼임을 시사합니다. 특히 이러한 전자-포논 결합 신호는 ARPES 측정을 통해 실험적으로 검증될 가능성이 높습니다.", "novelty": "얼터마그넷의 전자 구조적 특징인 스핀 분할과 격자 역학의 키랄성을 연결시켰다는 점이 핵심입니다. 독자의 관심사인 ARPES를 이용한 스펙트로스코피 측정 가능성을 제시한 점이 중요합니다.", "unresolved": "계산 기반의 예측이므로 실제 ARPES나 비탄성 중성자/X선 산란 등을 통한 키랄 포논 모드의 직접적인 실험적 관측이 필요합니다.", "future_work": "도핑이나 변형(Strain)을 통한 대칭성 제어로 포논의 키랄성을 조절하는 실험과, 시간 분해(Time-resolved) ARPES를 이용한 포논-전자 동역학 연구가 기대됩니다.", "concepts": [{"term": "Altermagnetism", "why_emerged": "강자성의 강한 자기장과 반강자성의 스핀 분할 부재라는 한계를 극복하는 제3의 자성 상태를 설명하기 위해 등장했습니다.", "origin": "최근 Igor Mazin, Libor Šmejkal 등에 의해 이론적으로 확립되었습니다.", "connections": "Spin-split bands, Zero net magnetization, d-wave/g-wave/f-wave magnetic orderings."}, {"term": "Chiral Phonon", "why_emerged": "격자 진동이 단순한 선형 진동을 넘어 원형 운동을 통해 각운동량을 가질 수 있음을 설명하기 위해 도입되었습니다.", "origin": "2010년대 중반 W2, MoS2 등 2D 물질 연구에서 본격적으로 주목받기 시작했습니다.", "connections": "Phonon angular momentum, Valleytronics, Berry curvature."}, {"term": "f-wave texture", "why_emerged": "운동량 공간에서 6중 대칭성을 가진 물리량의 분포를 묘사하기 위해 사용됩니다.", "origin": "초록 정보만으로는 특정하기 어려우나, 결정 구조의 대칭성에서 기인합니다.", "connections": "Hexagonal lattice, Higher-order multipole order."}, {"term": "Spin-split bands", "why_emerged": "스핀 오비탈 결합이나 자기 순서에 의해 서로 다른 스핀 상태가 에너지적으로 분리되는 현상을 설명합니다.", "origin": "Zeeman effect 및 Rashba/Dresselhaus 효과에서 기원합니다.", "connections": "ARPES, Spintronics, SOC (Spin-Orbit Coupling)."}], "english_summary": ["Predicts chiral phonons with f-wave symmetry in altermagnetic CrSb and MnTe.", "Shows that chiral lattice dynamics and spin-split electronic states originate from different atomic sublattices.", "Demonstrates how chemical substitution can lift valley cancellation of phonon angular momentum.", "Proposes ARPES as a tool to detect electron-phonon coupling in these altermagnetic systems."]}}, {"title": "Topological Triplons in the Pinwheel Valence Bond Solid on the Kagome Lattice", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2606.09823", "authors": "Laura Calonge-Mart\\'inez, Peng Rao, Fr\\'ed\\'eric Mila, Johannes Knolle", "last_authors": "Fr\\'ed\\'eric Mila, Johannes Knolle", "summary": "arXiv:2606.09823v2 Announce Type: replace Abstract: We investigate the triplon excitations of the pinwheel valence-bond-solid phase on the deformed kagome lattice compound Rb2Cu3SnF12. Using bond-operator mean-field theory, we compute the triplon band structure, dynamical structure factor, Berry curvatures and the associated thermal Hall response. We show that the presence of Dzyaloshinskii-Moriya interactions and an external magnetic field are key for endowing triplon bands with nontrivial Chern numbers. We find good qualitative agreement of the low-energy dynamical structure factor with neutron-scattering experiments. An applied magnetic field can isolate the lowest triplon Chern band leading to a tunable thermal Hall conductivity for accessible temperature and field regimes. Our results establish the deformed kagome pinwheel valence-bond solid as a promising platform for topological triplon physics and for observing the associated thermal Hall effect.", "tier": "B_IMPORTANT_CONDMAT", "score": "9", "reason": "Very relevant study on kagome lattice topological excitations; directly related to the user's focus.", "tags": ["kagome", "topological", "neutron-scattering"], "image": "https://arxiv.org/html/2606.09823v2/x1.png", "briefing": {"background": "카고메 격자는 기하학적 좌절(Frustration)로 인해 양자 자성 상태를 연구하기에 최적화된 구조입니다. 특히 밸런스 본드 고체(VBS) 상태에서 발생하는 트리플론(Triplon) 여기 상태의 위상적 성질은 최근 고체 물리학의 주요 관심사입니다.", "motivation": "카고메 화합물 Rb2Cu3SnF12에서 나타나는 핀휠(Pinwheel) VBS 상의 트리플론 여기가 위상적으로 비자명한(Nontrivial) 특성을 가질 수 있는지, 그리고 이것이 열 홀 효과(Thermal Hall effect)로 이어지는지 조사했습니다.", "result": "본드 연산자 평균장 이론을 사용하여, DM 상호작용(Dzyaloshinskii-Moriya interaction)과 외부 자기장이 존재할 때 트리플론 밴드가 비제 로 Chern 수를 가짐을 증명했습니다. 계산된 동적 구조 인자가 중성자 산란 실험 결과와 정성적으로 일치함을 확인했으며, 자기장 조절을 통해 특정 Chern 밴드를 고립시켜 제어 가능한 열 홀 전도도를 얻을 수 있음을 보였습니다.", "implication": "변형된 카고메 격자 시스템이 위상 트리플론 물리를 구현하고 열 홀 효과를 관찰할 수 있는 강력한 플랫폼임을 입증했습니다.", "novelty": "독자의 주요 관심사인 카고메 금속/절연체 시스템에서 위상적 여기 상태(Topological excitations)를 다루었으며, 중성자 산란 결과와의 비교를 통해 실험적 연관성을 높였습니다.", "unresolved": "이론적 모델과 실제 실험 데이터 사이의 정량적 차이를 줄이기 위한 추가적인 고차 보정이나 정밀한 실험이 요구됩니다.", "future_work": "강한 자기장 하에서의 정밀한 열 홀 전도도 측정 및 다른 카고메 VBS 물질로의 확장 연구가 예상됩니다.", "concepts": [{"term": "Triplon", "why_emerged": "단일항(Singlet) 바닥 상태를 갖는 자성 시스템에서 발생하는 스핀-1 여기 상태를 입자처럼 기술하기 위해 도입되었습니다.", "origin": "1990년대 초반 Sachdev와 Bhatt 등에 의해 이론적으로 체계화되었습니다.", "connections": "Valence Bond Solid (VBS), Magnon, Singlet-Triplet transition."}, {"term": "Pinwheel VBS", "why_emerged": "카고메 격자의 기하학적 변형에 의해 안정화되는 특수한 이합체(Dimer) 배열 상태를 설명하기 위해 제안되었습니다.", "origin": "Rb2Cu3SnF12와 같은 특정 화합물의 실험적 관측에서 기인합니다.", "connections": "Kagome lattice, Geometric frustration, Dimerization."}, {"term": "Thermal Hall Effect", "why_emerged": "전하를 띠지 않는 여기 상태(포논, 마그논 등)의 위상적 성질을 열 흐름의 굴절을 통해 측정하기 위해 중요해졌습니다.", "origin": "2000년대 초반 Katsura 등에 의해 마그논 시스템에서 이론적으로 제안되었습니다.", "connections": "Berry curvature, Chern number, Non-magnetic heat transport."}, {"term": "DM Interaction", "why_emerged": "반전 대칭성이 깨진 자성체에서 나타나는 비공선형(Non-collinear) 자기 구조를 설명하기 위해 도입되었습니다.", "origin": "Igor Dzyaloshinskii(1958)와 Toru Moriya(1960)가 제안했습니다.", "connections": "Chiral magnetism, Skyrmions, Spin-orbit coupling."}], "english_summary": ["Investigates topological triplon excitations in the pinwheel VBS phase of a deformed kagome lattice.", "Predicts nontrivial Chern numbers for triplon bands induced by DM interaction and magnetic fields.", "Shows consistency between calculated structure factors and neutron scattering data for Rb2Cu3SnF12.", "Suggests the system as a platform for tunable thermal Hall conductivity via triplonic Berry curvature."]}}, {"title": "Two-Dimensional Altermagnetism in Epitaxial CrSb Ultrathin Films", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2510.12344", "authors": "Keren Li, Yuzhong Hu, Yue Li, et al.", "last_authors": "Weichang Hao, Yi Du", "summary": "arXiv:2510.12344v2 Announce Type: replace Abstract: Altermagnets constitute an emerging class of collinear magnets that exhibit zero net magnetization yet host spin-split electronic bands arising from non-relativistic spin-space-group symmetries. Realization of altermagnetism in the two-dimensional (2D) limit remains an outstanding challenge because dimensional reduction suppresses kZ dispersion and destabilizes the symmetry operations essential for spin compensation. Here, we investigate ultrathin CrSb films grown epitaxially on Bi2Te3 substrate and uncover the evolution of altermagnetism in the 2D limit. Scanning tunneling microscopy (STM), quasiparticle interference (QPI), angle-resolved photoemission spectroscopy (ARPES), and density functional theory (DFT) calculations show that interfacial symmetry breaking in the one-unit-cell (1 UC) limit gives rise to localized electronic states and uncompensated magnetic moments. These interfacial effects become weakened from 7/4 UC, accompanied by the recovery of a bulk-like coordination environment and the emergence of altermagnetic electronic characteristics. Our results show that the essential altermagnetic electronic structure of CrSb survives at a thickness of only ~1.05 nm, demonstrating the robustness of altermagnetism in the 2D limit and opening opportunities for integrating stray-field-free spin order into low dimensional spintronic architectures.", "tier": "B_IMPORTANT_CONDMAT", "score": "9", "reason": "Direct experimental study (ARPES/STM/QPI) on altermagnetism in 2D limit.", "tags": ["ARPES", "STM", "altermagnet"], "image": "https://arxiv.org/static/browse/0.3.4/images/arxiv-logo-fb.png", "briefing": {"background": "얼터마그넷은 스핀 제어에 유리한 특성을 갖지만, 이를 2차원 극한(2D limit)으로 줄였을 때 그 성질이 유지되는지는 불투명합니다. 차원 축소는 대칭성을 파괴하거나 스핀 보상을 불안정하게 만들 수 있기 때문입니다.", "motivation": "에피택셜하게 성장된 CrSb 초박막에서 얼터마그네틱 전자 구조가 원자층 수준(1 UC 근처)에서도 생존하는지 실험적으로 확인하고자 했습니다.", "result": "STM, QPI, ARPES 및 DFT를 결합하여 분석한 결과, 1 UC 두께에서는 계면 효과로 인해 비국소적 자화가 나타나지만, 약 7/4 UC(약 1.05 nm) 두께부터는 벌크와 유사한 배위 환경이 회복되며 얼터마그네틱 전자 구조 특성이 명확하게 나타남을 발견했습니다.", "implication": "얼터마그네틱 특성이 매우 얇은 두께에서도 유지됨을 보여줌으로써, 외부 누설 자기장이 없는 고집적 스핀트로닉스 소자 구현 가능성을 제시했습니다.", "novelty": "얼터마그네틱 후보 물질인 CrSb를 실제 2D 한계에서 ARPES와 STM으로 직접 관측한 실험 논문이라는 점에서 독자의 관심사(ARPES, STM, Altermagnetism)와 매우 밀접합니다.", "unresolved": "계면(Bi2Te3 기판)과의 상호작용이 초기 층 형성에 미치는 영향을 더 세밀하게 제어하고 이해해야 할 숙제가 남아 있습니다.", "future_work": "2D 얼터마그넷을 이용한 실제 터널 접합 소자 제작이나 다른 기판 위에서의 에피택셜 성장 연구가 이어질 것으로 보입니다.", "concepts": [{"term": "Quasiparticle Interference (QPI)", "why_emerged": "STM을 이용해 불순물 주위의 전자 산란 패턴을 분석함으로써 운동량 공간의 전자 구조(Fermi surface 등)를 추론하기 위해 사용됩니다.", "origin": "1990년대 초반 STM 기술의 발전과 함께 확립되었습니다.", "connections": "STM/STS, Fermi surface mapping, Friedel oscillations."}, {"term": "2D Limit", "why_emerged": "물질의 두께를 원자층 수준으로 줄였을 때 나타나는 양자 구속 효과나 새로운 상전이를 연구하기 위해 탐구됩니다.", "origin": "Graphene의 발견 이후 전 분야로 확산되었습니다.", "connections": "Van der Waals materials, Quantum confinement, Interfacial physics."}, {"term": "Epitaxial Film", "why_emerged": "결정성이 우수하고 원자 수준에서 두께 조절이 가능한 고품질 시료를 제작하기 위해 필수적인 공정입니다.", "origin": "반도체 박막 성장 기술에서 발전했습니다.", "connections": "MBE (Molecular Beam Epitaxy), Lattice matching, Strain engineering."}, {"term": "Spin Compensation", "why_emerged": "반강자성이나 얼터마그넷에서 순 자화량이 0이 되도록 스핀들이 서로 상쇄되는 메커니즘을 설명합니다.", "origin": "초록 정보만으로는 특정하기 어려우나, 자성 물리학의 기본 개념입니다.", "connections": "Antiferromagnetis  state)와 약한 강자성(weak ferromagnetism)이 공존함을 발견했습니다. 이는 완전한 스핀 액체나 완전한 장거리 자기 질서 대신, 두 성질이 혼재된 복합적인 상태가 기저 상태가 될 수 있음을 시사합니다.", "implication": "강한 좌절이 있는 카고메 시스템에서 무질서 상태가 단순히 자기 질서로의 전이 전 단계가 아니라, 질서와 공존할 수 있는 고유한 양자 상태의 가능성을 열어줍니다. 이는 카고메 금속(AV3Sb5)에서의 비정상적인 자기 응답을 이해하는 새로운 틀을 제공할 수 있습니다.", "novelty": "S=1 시스템에서 액체 유사 상태와 강자성의 공존을 명확히 제시했다는 점이 독창적입니다. 사용자 관심사인 카고메 격자 기반의 자성 및 비정상적 기저 상태 연구와 밀접한 관련이 있습니다.", "unresolved": "무질서 성분과 강자성 성분이 공간적으로 분리된 것인지, 혹은 단일 상 내에서 공존하는 것인지에 대한 미시적 메커니즘은 추가 규명이 필요합니다.", "future_work": "중성자 산란이나 MuSR과 같은 국소 탐침 실험을 통해 스핀 동역학을 분석하고, 외부 자기장이나 압력에 따른 공존 상태의 변화를 추적하는 연구가 예상됩니다.", "concepts": [{"term": "카고메 격자 (Kagome Lattice)", "why_emerged": "삼각형이 꼭짓점을 공유하며 배열된 구조로, 스핀이 서로 반대 방향을 향하기 어려운 기하학적 좌절을 구현하기 위해 도입되었습니다.", "origin": "일본의 전통 바구니 패턴에서 유래함.", "connections": "양자 스핀 액체, 카고메 금속(AV3Sb5), 이상 홀 효과와 밀접하게 연관됨."}, {"term": "기하학적 좌절 (Geometric Frustration)", "why_emerged": "결정 구조상의 제약으로 인해 모든 스핀 상호작용을 동시에 최소화할 수 없는 현상을 설명하기 위해 등장했습니다.", "origin": "초록 정보만으로는 특정하기 어려움 (전통적인 통계물리 개념).", "connections": "스핀 아이스, 양자 스핀 액체, 비정합 자기 구조의 원인이 됨."}, {"term": "약한 강자성 (Weak Ferromagnetism)", "why_emerged": "주로 반강자성 정렬을 가지면서도 결정 대칭성이나 Dzyaloshinskii-Moriya 상호작용으로 인해 미세한 순 자화가 발생하는 현상을 설명하기 위해 사용됩니다.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "반강자성체, 스핀 캔팅(Spin canting), 자성 위상 절연체와 연결됨."}], "english_summary": ["Discovery of coexisting liquid-like disordered states and weak ferromagnetism in an S=1 kagome lattice.", "Experimental evidence of a complex magnetic ground state arising from geometric frustration.", "Provides a new perspective on the interplay between quantum spin fluctuations and magnetic ordering.", "Highly relevant for understanding the magnetism in exotic kagome systems."]}}, {"title": "Intrinsic antiferromagnetic half-metal and topological phases from the ferrovalley states of the sliding bilayer altermagnets", "journal": "npj_QuantumMaterials", "source": "Gemini", "link": "https://www.nature.com/articles/s41535-026-00915-2", "authors": erged": "2차원 물질의 적층 각도를 조절하여 전자 밴드 구조를 설계(Bandgap engineering)하기 위해 도입되었습니다.", "origin": "초록 정보만으로는 특정하기 어려우나, twisted bilayer graphene 연구로부터 급격히 발전했습니다.", "connections": "매직 각도 그래핀, 밴드 평탄화(Band flattening), 강상관 전자계"}, {"term": "Fractional Chern Insulator (FCI)", "why_emerged": "자기장 없이도 분율 전하를 가진 여기 상태를 구현하기 위해 제안된 이론적 모델입니다.", "origin": "2011년경 여러 이론 그룹에서 동시에 제안되었습니다.", "connections": "FQHE, 토폴로지컬 절연체, 다체 상호작용"}, {"term": "Non-Abelian topological states", "why_emerged": "입자 교환 시 단순한 위상 변화 이상의 유니타리 변환을 유도하여 양자 정보를 저장하기 위해 필요합니다.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "Majorana fermion, 위상 양자 컴퓨팅"}], "english_summary": ["A Perspective on the realization of the fractional quantum anomalous Hall effect (FQAHE) in moiré materials.", "Analyzes the role of flat bands and electron correlations in stabilizing fractional Chern insulators at zero magnetic field.", "Discusses the transition from Abelian to non-Abelian topological states in moiré systems.", "Highlights the potential for topological quantum computing using these platforms."]}}, {"title": "Visualization of the Zhang–Rice singlet, electronic molecules and Cooper pair formation in a cuprate superconductor", "journal": "Nature_Physics", "source": "Gemini", "link": "https://www.nature.com/articles/s41567-026-03375-4", "authors": "Shusen Ye, Jianfa Zhao, Zhiheng Yao, et al.", "last_authors": "Changqing Jin, Yayu Wang", "summary": "Nature Physics, Published online: 07 July 2026; doi:10.1038/s41567-026-03375-4 How individual doped holes turn into superconducting Cooper pairs as doping increases in unconventional superconductors is still not well understood. Now, this process is observed in a paradigmatic cuprate compound.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Direct experimental study on Cooper pair formation in a cuprate superconductor, relevant to unconventional SC.", "tags": ["cuprates", "superconductivity", "STM/STS"], "image": "https://media.springernature.com/m685/springer-static/imag electronic motifs to the emergence of macroscopic superconductivity."]}}, {"title": "Berry curvature induced optical bistability", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/vxms-qwmf", "authors": "Navya Teja Dasari, Monu, Narayanan Namboodiri P., Pankaj Bhalla", "last_authors": "Narayanan Namboodiri P., Pankaj Bhalla", "summary": "Author(s): Navya Teja Dasari, Monu, Narayanan Namboodiri P., and Pankaj Bhalla We develop a general theoretical framework showing that Berry curvature of electronic bands can produce intrinsic optical bistability under circularly polarized illumination. The bistability arises directly from Maxwell's boundary conditions, which couple the transmitted circular field to a transver… [Phys. Rev. B 114, 045104] Published Mon Jul 06, 2026", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Theoretical framework connecting Berry curvature to an observable optical bistability phenomenon.", "tags": ["Berrycurvature", "optics", "theory", "experimentalobservable"], "image": "", "briefing": {"background": "베리 곡률(Berry curvature)은 고체 내 전자의 위상적 특성을 나타내는 양으로, 이상 홀 효과나 원형 이색성 등 다양한 물리 현상을 유도합니다.", "motivation": "베리 곡률이 물질의 비선형 광학 응답, 특히 빛의 투과도가 입력 세기에 따라 두 가지 상태를 가질 수 있는 '광학적 이중 안정성'에 미치는 영향을 이론적으로 규명하고자 했습니다.", "result": "원편광 조사 하에서 전자 밴드의 베리 곡률이 맥스웰 경계 조건과 결합하여 본질적인 광학적 이중 안정성을 유발할 수 있음을 보여주는 일반적인 이론 틀을 개발했습니다.", "implication": "베리 곡률을 광학적으로 제어하거나 측정하는 새로운 도구로 활용될 수 있으며, 위상 물질 기반의 전광학(all-optical) 스위칭 소자 개발에 기여할 수 있습니다.", "novelty": "독자님의 관심사인 Berry curvature를 전통적인 수송 현상을 넘어 비선형 광학 현상(Bistability)과 직접 연결했다는 점이 독창적입니다.", "unresolved": "이론적 예측을 검증하기 위해 베리 곡률이 큰 실제 물질(예: Weyl 반금속, 이상 홀 물질)에서의 실험적 관측이 필요합니다.", "future_work": "Weyl semimetals나 2D 위상 절연체에서 이 현상을 관측하기 위한 실험 조건 설계 및 최적화 연구가 뒤따를 것으로 보입니다.", "concepts": [{"term": "Berry curvature", "why_emerged": "전자의 파동함수가 브릴루앙 영역에서 이동할 때 얻는 기하학적 위상 변화를 설명하기 위해 도입되었습니다.", "origin": "Michael Berry (1984)", "connections": "Berry phase, 이상 홀 효과, 위상 불변량(Chern number)"}, {"term": "Optical bistability", "why_emerged": "빛을 이용한 논리 회로 및 광 스위칭 소자를 구현하기 위해 하나의 입력에 두 개의 안정적인 출력이 존재하는 특성이 필요했습니다.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "비선형 광학, 광 피드백, 광학 스위치"}, {"term": "Circularly polarized illumination", "why_emerged": "물질의 시간 반전 대칭성 파괴나 손지기(chirality)를 탐지하고 제어하기 위해 사용됩니다.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "원형 이색성(CD), 스핀 분극, Floquet 공학"}, {"term": "Maxwell's boundary conditions", "why_emerged": "서로 다른 두 매질의 경계에서 전자기장의 연속성을 설명하기 위해 필요합니다.", "origin": "James Clerk Maxwell", "connections": "전자기학, 프레넬 반사, 표면파"}], "english_summary": ["Proposes a theoretical framework where Berry curvature induces intrinsic optical bistability.", "The effect emerges from the coupling of transmitted fields to transverse responses under circularly polarized light.", "Connects internal topological properties of bands directly to nonlinear optical observables.", "Suggests new ways to probe Berry curvature using all-optical methods in topological materials."]}}, {"title": "Continuous transition from Fermi liquid to fractional Chern insulator", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/1ynf-bv96", "authors": "Ya-Hui Zhang", "last_authors": "Ya-Hui Zhang", "summary": "Author(s): Ya-Hui Zhang Recent experiments in moiré materials have observed fractional Chern insulators (FCIs) at zero magnetic field, providing an opportunity to study the transition from FCIs to the more conventional phases such as Fermi liquid (FL) and superconductor by tuning the interaction strength or bandwidth. In t… [Phys. Rev. B 114, 065107] Published Mon Jul 06, 2026", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Theory of fractional Chern insulators in moire materials, a high-priority topic for the user.", "tags": ["theory", "moire", "fractionalCherninsulator"], "image": "", "briefing": {"background": "모레(moiré) 격자계는 밴드 구조를 극단적으로 평탄하게 만들어 강한 전자 상관관계와 위상학적 상태를 연구하기 위한 최적의 플랫폼으로 각광받고 있습니다.", "motivation": "최근 모레 물질에서 외부 자기장 없이도 나타나는 분수 천 절연체(FCI)가 발견됨에 따라, 상호작용 세기나 밴드폭 조절을 통해 이 상태가 페르미 액체(FL)나 초전도체와 같은 통상적인 상으로 어떻게 전이되는지 이해하는 것이 중요해졌습니다.", "result": "본 연구는 이론적으로 분수 천 절연체에서 페르미 액체 상태로의 연속적인 상전이가 가능함을 보였습니다.", "implication": "FCI와 FL 사이의 연속 전이는 새로운 양자 임계 현상을 탐구할 수 있는 장을 열어주며, 모레 시스템에서의 상도표를 이해하는 핵심적인 틀을 제공합니다.", "novelty": "독자의 주요 관심사인 모레 물질과 분수 천 절연체(FCI)를 다루고 있으며, 특히 영자기장에서의 상전이 기작을 이론적으로 구체화했다는 점에서 중요합니다.", "unresolved": "이론적 예측을 뒷받침할 구체적인 실험 데이터와 전이 과정에서의 게이지 장 효과에 대한 추가 검증이 필요합니다.", "future_work": "실험적으로 밴드폭을 조절하며 해당 연속 상전이에서 나타나는 비정상적인 수송 특성을 측정하는 연구가 기대됩니다.", "concepts": [{"term": "Fractional Chern Insulator (FCI)", "why_emerged": "자기장 없이 격자 구조 자체의 위상적 성질만으로 분수 양자 홀 효과와 유사한 상태를 구현하기 위해 등장했습니다.", "origin": "2011년경 여러 그룹에 의해 이론적으로 제안되었으며 최근 모레 물질에서 실험적으로 확인되었습니다.", "connections": "분수 양자 홀 효과, 천 수(Chern number), 평탄 밴드(Flat band)"}, {"term": "Moiré materials", "why_emerged": "이차원 물질을 살짝 비틀어 쌓을 때 생기는 거대 격자를 통해 전자의 밴드 구조를 정밀하게 제어하기 위해 등장했습니다.", "origin": "초록 정보만으로는 특정하기 어려우나 그래핀 적층 구조 연구에서 시작되었습니다.", "connections": "매직 각도 그래핀, 강상관 전자계, 위상 절연체"}, {"term": "Fermi liquid (FL)", "why_emerged": "금속 내 전자의 상호작용을 독립적인 준입자들의 행동으로 설명하기 위해 도입된 표준 모델입니다.", "origin": "레프 란다우(Lev Landau)", "connections": "Landau-Fermi liquid theory, 비페르미 액체, 전도성 금속"}, {"term": "Continuous transition", "why_emerged": "물질의 상태가 급격한 변화(1차 전이) 없이 매끄럽게 변하는 양자 임계점을 연구하기 위해 중요합니다.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "양자 임계점(QCP), 2차 상전이, 척도 불변성"}], "english_summary": ["This theory paper explores the continuous phase transition between fractional Chern insulators and Fermi liquids in moiré materials.", "It addresses the mechanism of tuning interaction strength and bandwidth at zero magnetic field.", "The study provides a theoretical framework for understanding the emergence and dissolution of topological order in these systems.", "It is highly relevant to the physics of strongly correlated moiré heterostructures and quantum criticality."]}}, {"title": "DC spin current driven by low-frequency light in altermagnets", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/3j6x-397h", "authors": "Yihua Xiao, Ruizhi Dong, Xiaomu Wang, Ruixiang Fei", "last_authors": "Xiaomu Wang, Ruixiang Fei", "summary": "Author(s): Yihua Xiao, Ruizhi Dong, Xiaomu Wang, and Ruixiang Fei Efficient generation of DC spin-polarized currents via light is a promising route toward ultrafast spintronics, yet remains challenging. Here, we show that altermagnets, a class of antiferromagnets with symmetry-driven spin splitting, can generate DC spin currents via the nonlinear spin Hall effect.… [Phys. Rev. B 114, 014405] Published Wed Jul 01, 2026", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Theory of DC spin current generation in altermagnets, a direct interest area.", "tags": ["theory", "altermagnetism", "spintronics"], "image": "", "briefing": {"background": "빛을 이용해 전자의 스핀을 제어하는 연구는 에너지 소모가 적고 속도가 빠른 차세대 스핀트로닉스 소자 구현을 위한 핵심 과제입니다.", "motivation": "대칭성에 의해 스핀 갈라짐(spin splitting)이 나타나는 새로운 자성체인 얼터마그넷(altermagnet)을 활용하여, 저주파 광원을 통한 직류(DC) 스핀 전류 생성 효율을 높이고자 했습니다.", "result": "얼터마그넷에서 비선형 스핀 홀 효과(nonlinear spin Hall effect)를 통해 저주파 빛으로 직류 스핀 전류를 생성할 수 있음을 이론적으로 입증하였습니다.", "implication": "얼터마그넷이 외부 자기장 없이도 고효율 광-스핀 변환 소자로 사용될 수 있는 물리적 근거를 마련했습니다.", "novelty": "독자의 관심 분야인 얼터마그네티즘을 다루며, 특히 광유기 비선형 응답을 스핀 전류 생성과 결합했다는 점이 독창적입니다.", "unresolved": "실제 물질 실험에서 산란(scattering)이나 불순물이 비선형 응답의 수득률에 미치는 영향이 확인되어야 합니다.", "future_work": "제시된 이론을 바탕으로 RuO2 등 대표적인 얼터마그넷 후보 물질에서 광유기 직류 스핀 전류를 직접 측정하는 실험이 예상됩니다.", "concepts": [{"term": "Altermagnetism", "why_emerged": "강자성체와 반강자성체의 장점을 결합한, 즉 순 자화는 없으면서 스핀 갈라짐은 존재하는 새로운 자성 상태를 정의하기 위해 등장했습니다.", "origin": "최근 시니차(Šmejkal) 등의 그룹에서 체계화함.", "connections": "반강자성체, 스핀 홀 효과, 대칭성 기반 밴드 분리"}, {"term": "Nonlinear spin Hall effect", "why_emerged": "선형 응답이 제한되는 대칭성 하에서 외부 전계나 광계의 비선형적 응답을 통해 스핀 전류를 생성하기 위해 연구됩니다.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "Berry curvature dipole, 비선형 광학, 스핀-궤도 결합"}, {"term": "DC spin current", "why_emerged": "교류 신호보다 소자 구동 및 신호 전달에 안정적인 직류 형태의 스핀 흐름이 스핀트로닉스 구현에 필수적이기 때문입니다.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "Spin pumping, Spin-torque, Spintronics"}, {"term": "Low-frequency light", "why_emerged": "테라헤르츠(THz) 영역 등 저에너지 광원을 이용한 저전력 제어 가능성을 탐색하기 위해 중요합니다.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "THz spectroscopy, Floquet engineering, 광유기 상전이"}], "english_summary": ["The study theoretically proposes the generation of DC spin currents in altermagnets using low-frequency light.", "It utilizes the nonlinear spin Hall effect, which is driven by the unique symmetry-protected spin splitting in altermagnets.", "The findings suggest altermagnets as efficient candidates for ultrafast and low-power spintronic applications.", "This connects the field of altermagnetism with nonlinear optical response."]}}, {"title": "Devil's staircase magnetic spirals in Ni2−xCoxScSbO6", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/dlvy-9bd9", "authors": "Kunlang Ji, Elena Solana-Madruga, Angel M. Arevalo-Lopez, Pascal Manuel, J. Paul Attfield", "last_authors": "Pascal Manuel, J. Paul Attfield", "summary": "Author(s): Kunlang Ji, Elena Solana-Madruga, Angel M. Arevalo-Lopez, Pascal Manuel, and J. Paul Attfield $\\mathrm{N}{\\mathrm{i}}_{2−x}\\mathrm{C}{\\mathrm{o}}_{x}\\mathrm{ScSb}{\\mathrm{O}}_{6}$ solid solutions ($x=0.1$, 0.2, 0.3, 0.4) have been studied by magnetization and neutron powder diffraction measurements. All samples are magnetically ordered below ${T}_{\\mathrm{C}}≈63\\phantom{\\rule{0.16em}{0ex}}\\m… [Phys. Rev. B 114, 034403] Published Mon Jul 06, 2026", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Experimental study of magnetic spirals using neutron powder diffraction, directly relevant to magnetic order.", "tags": ["magnetism", "neutronscattering", "magneticorder", "experimental"], "image": "", "briefing": {"background": "복잡한 자성 물질에서 자기 구조의 미세한 변화는 전기적, 위상학적 특성에 직접적인 영향을 미치며, 이를 조절하는 연구가 활발합니다.", "motivation": "Ni2-xCoxScSbO6 고용체에서 니켈(Ni)과 코발트(Co)의 치환 비율에 따라 자성 구조가 어떻게 진화하는지 중성자 회절로 정밀 분석하고자 했습니다.", "result": "해당 물질 시스템에서 조성 변화에 따라 자기 나선 구조가 불연속적 혹은 연속적으로 변하는 '악마의 계단(Devil's staircase)' 현상을 발견하고 그 자기 상도표를 확립했습니다.", "implication": "미세한 화학적 조성 조절로 복잡한 비공선성(non-collinear) 자기 구조를 정밀하게 제어할 수 있음을 보여주었습니다.", "novelty": "중성자 산란(Neutron scattering)을 이용한 자성 구조 분석은 독자의 핵심 관심사이며, 특히 '악마의 계단'과 같은 복잡한 위상학적 자성 구조의 실험적 확인이 중요합니다.", "unresolved": "이러한 복잡한 나선 구조가 전기적 분극(multiferroicity)이나 비정상 홀 효과와 어떻게 연결되는지는 추가 연구가 필요합니다.", "future_work": "단결정 샘플을 이용한 더 높은 정밀도의 중성자 회절 실험과 외부 자기장에 의한 상전이 연구가 진행될 것으로 보입니다.", "concepts": [{"term": "Devil's staircase", "why_emerged": "경쟁하는 상호작용들로 인해 파수(wavevector)가 매끄럽게 변하지 않고 유리수 값들에서 머무르며 계단 모양으로 변하는 복잡한 상태를 설명하기 위해 등장했습니다.", "origin": "Bak et al. (1982) 등의 이론적 연구에서 널리 알려짐.", "connections": "Frustrated magnetism, ANNNI model, Incommensurate phases"}, {"term": "Magnetic spirals", "why_emerged": "인접한 스핀들이 특정 각도를 가지고 비공선적으로 배열되는 구조를 설명하기 위해 필요합니다.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "Dzyaloshinskii-Moriya interaction, Helimagnetism, Skyrmions"}, {"term": "Neutron powder diffraction", "why_emerged": "물질 내부의 자기 모멘트의 크기와 방향을 직접적으로 관측할 수 있는 가장 강력한 도구이기 때문입니다.", "origin": "Clifford Shull (1994년 노벨상)", "connections": "Magnetic structure factor, Rietveld refinement"}, {"term": "Solid solutions", "why_emerged": "두 가지 이상의 원소를 섞어 물리적 성질(격자 상수, 자성 등)을 연속적으로 조절하기 위해 사용됩니다.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "Doping, Chemical pressure, Phase diagram"}], "english_summary": ["This experimental work identifies complex magnetic spiral phases in Ni2-xCoxScSbO6 using neutron powder diffraction.", "The authors discovered a 'Devil's staircase' behavior where the magnetic modulation vector changes with composition.", "The study maps out the magnetic phase diagram, showing how Ni/Co substitution tunes the frustration and ordering.", "It provides a high-quality example of using neutron scattering to resolve non-collinear magnetic structures."]}}, {"title": "Magnetizing altermagnets through ultrafast asymmetric spin dynamics", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/hwy3-mt7r", "authors": "Zhaobo Zhou, Sangeeta Sharma, John Kay Dewhurst, Junjie He", "last_authors": "John Kay Dewhurst, Junjie He", "summary": "Author(s): Zhaobo Zhou, Sangeeta Sharma, John Kay Dewhurst, and Junjie He Laser pulses are known to induce symmetric demagnetization: equal loss of magnetic moments in the identical sublattices of antiferromagnets and ferromagnets at ultrashort timescales. Using time-dependent density functional theory, we show that linearly polarized laser pulses can drive asymmetric dem… [Phys. Rev. B 114, 024409] Published Mon Jul 06, 2026", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "DFT study of ultrafast spin dynamics and magnetization in altermagnets, a direct interest.", "tags": ["theory", "altermagnet", "ultrafast", "DFT"], "image": "", "briefing": {"background": "최근 발견된 알터마그넷(Altermagnet)은 순자화(net magnetization)가 0임에도 불구하고 강자성체처럼 밴드 구조에서 스핀 분할(spin-splitting)이 일어나는 새로운 자기 상태입니다. 이는 스핀트로닉스 분야에서 속도가 빠른 반강자성체의 장점과 제어가 쉬운 강자성체의 장점을 동시에 가질 수 있어 큰 주목을 받고 있습니다.", "motivation": "일반적으로 반강자성체나 강자성체에 강한 레이저 펄스를 쏘면 모든 서브래티스(sublattice)에서 대칭적인 자화 감소(demagnetization)가 일어납니다. 본 연구는 알터마그넷 특유의 결정 구조와 자기 구조를 활용하여, 레이저를 통해 서브래티스 간의 비대칭적인 스핀 역학을 유도하고 이를 통해 순자화를 생성할 수 있는지 탐구합니다.", "result": "시간 의존 밀도 범함수 이론(TD-DFT) 계산을 통해, 선편광 레이저 펄스가 알터마그넷의 특정 서브래티스에 비대칭적으로 작용하여 서로 다른 속도로 스핀 모멘트를 감소시킴을 보였습니다. 결과적으로 평형 상태에서는 0이었던 순자화가 극초단 시간 영역에서 0이 아닌 값으로 유도될 수 있음을 증명했습니다.", "implication": "알터마그넷을 외부 자기장 없이 빛만으로 자화시킬 수 있음을 의미합니다. 이는 알터마그넷 기반의 초고속 광-스핀 소자 구현 가능성을 시사하며, 기존 반강자성 스핀트로닉스의 한계를 극복할 수 있는 물리적 기제를 제공합니다.", "novelty": "알터마그넷의 비대칭적 스핀 분할 성질을 '초고속 역학'과 결합하여 비대칭 자화(asymmetric demagnetization)라는 새로운 현상을 제시한 점이 핵심입니다. 독자의 관심사인 알터마그네틱 전자 구조와 외부 섭동(광학적 여기) 간의 상관관계를 다루고 있어 연구 가치가 높습니다.", "unresolved": "이러한 비대칭 자화 상태가 얼마나 오랫동안 유지되는지(relaxation time), 그리고 실제 실험 환경에서 열적 효과가 이 현상을 방해하지 않는지에 대한 정량적 검증이 추가로 필요합니다.", "future_work": "실제 알터마그넷 후보 물질(예: RuO2, MnTe)에 대한 초고속 자기-광학 실험(MOKE)을 통해 이 예측을 실험적으로 검증하는 연구가 뒤따를 것으로 예상됩니다.", "concepts": [{"term": "알터마그네티즘 (Altermagnetism)", "why_emerged": "반강자성(자화 0)과 강자성(스핀 분할)의 특징을 동시에 설명하기 위해 도입된 새로운 자기 분류체계입니다.", "origin": "최근 Šmejkal, Sinova, Jungwirth 등에 의해 이론적으로 확립되었습니다.", "connections": "반강자성체, 강자성체, 비대칭 스핀 분할, 스핀 홀 효과."}, {"term": "초고속 스핀 역학 (Ultrafast spin dynamics)", "why_emerged": "펨토초(fs) 단위에서 발생하는 자기적 변화를 이해하고 테라헤르츠 급 스핀 소자를 개발하기 위해 등장했습니다.", "origin": "1996년 Beaurepaire 등의 초고속 탈자화 실험이 시초로 평가됩니다.", "connections": "펨토초 레이저, 자기소거(demagnetization), 자기-광학 커 효과(MOKE)."}, {"term": "TD-DFT (Time-Dependent Density Functional Theory)", "why_emerged": "시간에 따라 변하는 외부 전동사(레이저 등)에 반응하는 전자계의 양자 역학적 상태를 계산하기 위해 필요합니다.", "origin": "Runge와 Gross가 1984년에 기초 정리를 증명했습니다.", "connections": "DFT, 여기 상태 계산, 전자-광 상호작용."}], "english_summary": ["The study demonstrates that linearly polarized laser pulses can induce asymmetric demagnetization in altermagnets.", "Using TD-DFT, the researchers show how sublattices respond differently to ultrafast excitation, creating a transient net magnetization.", "This provides a mechanism to 'magnetize' zero-net-moment altermagnets using light, bridging the gap between AFM and FM functionalities."]}}, {"title": "Tailoring magnetocrystalline anisotropy and anisotropic magnetocaloric effect in Ni-doped Fe3GaTe2 single crystals", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/k713-wl4g", "authors": "Luozhao Zhang, Liqiang Zeng, Jinbo Yang, et al.", "last_authors": "Zhigao Huang, Jizhai Cui", "summary": "Author(s): Luozhao Zhang, Liqiang Zeng, Jinbo Yang, Yongfeng Mei, Zhongchong Lin, Zhigao Huang, and Jizhai Cui The regulation of magnetic anisotropy in two-dimensional (2D) van der Waals (vdW) ferromagnets is critical for enabling spintronic and solid-state cooling applications, yet the microscopic doping mechanism remains poorly understood, as conventional ideal-lattice models fail to reconcile the moderate… [Phys. Rev. B 114, 014409] Published Mon Jul 06, 2026", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Experimental study of magnetic properties in a van der Waals ferromagnet, relevant to 2D materials.", "tags": ["experimental", "vanderWaals", "ferromagnet", "magneticproperties"], "image": "", "briefing": {"background": "Fe3GaTe2는 상온 근처에서 강자성을 유지하는 층상 반데르발스(vdW) 물질로, 2D 스핀트로닉스 및 자기 냉각(magnetic cooling) 기술의 핵심 후보 물질입니다. 특히 자기 이방성(magnetic anisotropy)은 정보 저장의 안정성을 결정하는 중요한 요소입니다.", "motivation": "2D 자성체의 자기 이방성을 조절하기 위해 도핑(doping)이 널리 사용되지만, 원자 단위에서 도핑이 이방성에 미치는 미시적 메커니즘은 여전히 불투명합니다. 특히 기존의 이상적인 격자 모델로는 실제 측정되는 이방성 변화를 완벽히 설명하기 어려웠습니다.", "result": "Fe3GaTe2 단결정에 Ni을 도핑하여 결정 자기 이방성(MAE)과 자기열 효과(MCE)를 성공적으로 조절했습니다. Ni 도핑 양에 따라 자화 용이축(easy axis)의 안정성이 변하며, 이방성 자기 엔트로피 변화가 체계적으로 튜닝됨을 실험적으로 확인했습니다.", "implication": "Ni 도핑을 통해 Fe3GaTe2의 자기적 특성을 정밀하게 제어할 수 있음을 보여주었으며, 이는 차세대 2D 자성 소자 및 나노 스케일 냉각 장치의 최적화된 소재 설계 가이드를 제공합니다.", "novelty": "최근 독자가 관심을 가질 만한 고온 vdW 강자성체인 Fe3GaTe2 시스템에서 도핑을 통한 이방성 제어 메커니즘을 상세히 규명했다는 점이 중요합니다. 실험과 이론(모델) 간의 간극을 줄이려는 시도가 포함되어 있습니다.", "unresolved": "도핑된 Ni 원자가 격자 내에서 차지하는 정확한 위치와 국소적인 전자 구조 변화를 STM이나 ARPES로 직접 관찰하여 이방성 변화의 근원을 더 명확히 할 필요가 있습니다.", "future_work": "박막 형태에서의 도핑 효과 검증 및 Ni 외의 다른 전이 금속 도핑을 통한 광범위한 물성 맵핑 연구가 기대됩니다.", "concepts": [{"term": "결정 자기 이방성 (Magnetocrystalline Anisotropy, MAE)", "why_emerged": "자성체의 자화 방향이 특정 결정축을 따라 정렬되려는 성질을 설명하기 위해 도입되었습니다.", "origin": "초록 정보만으로는 특정하기 어려우나 자성학의 고전적 개념입니다.", "connections": "스핀-궤도 결합(SOC), 자화 용이축, 자기 이력 곡선."}, {"term": "자기열 효과 (Magnetocaloric Effect, MCE)", "why_emerged": "자기장의 변화를 이용해 물질의 온도를 조절하는 친환경 냉각 기술을 위해 연구됩니다.", "origin": "1881년 Warburg에 의해 발견되었습니다.", "connections": "자기 엔트로피, 단열 소자화 냉각, 상전이."}, {"term": "반데르발스 자성체 (vdW Ferromagnets)", "why_emerged": "원자 층 두께에서도 자성이 유지되는 물질을 찾아 2D 소자에 활용하기 위해 등장했습니다.", "origin": "2017년 CrI3 및 Cr2Ge2Te6에서 2D 자성이 발견되며 본격화되었습니다.", "connections": "Fe3GeTe2, Mermin-Wagner 정리, 2D 스핀트로닉스."}], "english_summary": ["The paper investigates the effect of Ni doping on the magnetocrystalline anisotropy and magnetocaloric properties of Fe3GaTe2 single crystals.", "Experimental results show that Ni substitution effectively tunes the magnetic easy axis and anisotropic entropy changes.", "This work provides a strategy for tailoring the magnetic performance of vdW ferromagnets for spintronic and cooling applications."]}}, {"title": "Topological magnon Hall effect: The perspective of angular momentum conservation", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/c8yv-jh96", "authors": "Huibin Jiang (姜惠彬), Hongbin Wu (武宏斌), Jin Lan (兰金)", "last_authors": "Hongbin Wu (武宏斌), Jin Lan (兰金)", "summary": "Author(s): Huibin Jiang (姜惠彬), Hongbin Wu (武宏斌), and Jin Lan (兰金) When magnon propagates through a magnetic texture, the Hall effect arises as a prominent feature to characterize the underlying nontrivial magnetic topology, due to the action of the emergent pseudomagnetic field. Here, we propose a complementary framework based on the angular momentum conservation,… [Phys. Rev. B 114, 034405] Published Mon Jul 06, 2026", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Theoretical framework for topological magnon Hall effect, highly relevant to topological and Hall interests.", "tags": ["topological", "magnon", "Halleffect", "theory"], "image": "", "briefing": {"background": "자성체 내에서 스핀의 파동인 마그논(Magnon)이 흐를 때, 자기 구조의 기하학적 위상이나 유효 자기장에 의해 휘어지는 현상을 마그논 홀 효과라고 합니다. 이는 전하가 없는 마그논을 이용한 저전력 정보 전달 기술의 핵심입니다.", "motivation": "기존의 마그논 홀 효과 이론은 주로 가상의 가짜자기장(pseudomagnetic field) 개념에 의존해 왔습니다. 본 연구는 보다 근본적인 물리 원리인 '각운동량 보존 법칙'의 관점에서 마그논 홀 효과를 재해석하고 새로운 이론적 틀을 제시하고자 합니다.", "result": "마그논이 불균일한 자기 텍스처(magnetic texture)를 통과할 때, 마그논과 배경 자기 구조 사이의 각운동량 교환이 발생하며 이 과정에서 마그논의 궤적이 굴절됨을 보였습니다. 이를 통해 위상적 마그논 홀 효과를 설명하는 상호보완적인 이론 프레임워크를 구축했습니다.", "implication": "마그논 홀 효과를 이해하는 데 있어 베리 곡률(Berry curvature)과 같은 위상적 관점 외에도 각운동량의 흐름이라는 역학적 관점이 중요함을 시사합니다. 이는 다양한 자성 구조체에서의 마그논 제어 전략을 세우는 데 도움을 줍니다.", "novelty": "위상적 현상을 보존 법칙이라는 보편적인 물리 법칙과 연결하여 해석의 명확성을 높였습니다. 독자의 주요 관심사인 베리 곡률 및 위상적 홀 효과를 마그논 시스템으로 확장한 연구입니다.", "unresolved": "제시된 이론적 틀이 비공선(non-collinear) 자기 구조나 복잡한 다강체 시스템에서도 보편적으로 적용될 수 있는지에 대한 추가 검증이 필요합니다.", "future_work": "다양한 자성 나노 구조(스커미온 격자 등)에서 각운동량 전달에 따른 마그논 산란 실험을 통해 이 이론을 검증할 수 있을 것입니다.", "concepts": [{"term": "마그논 홀 효과 (Magnon Hall Effect)", "why_emerged": "전하가 없는 중성 입자인 마그논에서 발생하는 홀 현상을 설명하기 위해 등장했습니다.", "origin": "2010년 Onose 등에 의해 실험적으로 관찰되었습니다.", "connections": "열 홀 효과, 베리 곡률, 스핀파(Spin wave)."}, {"term": "자기 텍스처 (Magnetic Texture)", "why_emerged": "스커미온, 도메인 월과 같이 공간적으로 스핀 방향이 변하는 복잡한 자기 정렬 상태를 기술하기 위해 사용됩니다.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "스커미온, 위상적 자기 구조, 도메인 월."}, {"term": "각운동량 보존 (Angular Momentum Conservation)", "why_emerged": "물리계의 회전 대칭성과 관련된 근본적인 보존 법칙으로, 시스템의 동역학을 제한하는 요소입니다.", "origin": "고전 역학 및 에미 뇌터의 정리에 기초함", "connections": "스핀 토크, 마그논-자성체 상호작용."}], "english_summary": ["The paper proposes a new framework for the topological magnon Hall effect based on the conservation of angular momentum.", "It argues that the Hall deflection of magnons in magnetic textures is a direct consequence of angular momentum exchange between magnons and the background.", "This perspective complements the traditional emergent magnetic field approach and provides a deeper understanding of magnon transport in nontrivial magnetic topologies."]}}, {"title": "Topological magnons on the ferromagnetic zigzag lattice", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/6p3f-l13x", "authors": "Skandan Subramanian, Tom Berlijn, Lucas Lindsay, Do Hoon Kiem, Randy S. Fishman, John W. Villanova", "last_authors": "Randy S. Fishman, John W. Villanova", "summary": "Author(s): Skandan Subramanian, Tom Berlijn, Lucas Lindsay, Do Hoon Kiem, Randy S. Fishman, and John W. Villanova Motivated by the experimental identification of magnetic compounds consisting of zigzag chains, we analyze the band st   headText.appendChild(badges);
  const title = document.createElement('h1');
  if (r.link) { const titleLink = document.createElement('a'); titleLink.href = r.link; titleLink.target = '_blank'; titleLink.rel = 'noopener noreferrer'; titleLink.textContent = r.title || ''; title.appendChild(titleLink); }
  else { title.textContent = r.title || ''; }
  headText.appendChild(title);
  headText.appendChild(textEl('p', 'meta', [r.journal, r.source].filter(Boolean).join(' | ')));
  if (r.last_authors || r.authors) { const authors = document.createElement('p'); authors.className = 'authors'; if (r.last_authors) authors.append('Last authors: ' + r.last_authors); if (r.authors) authors.append((r.last_authors ? ' | ' : '') + 'Authors: ' + r.authors); headText.appendChild(authors); }
  appendLabeledText(headText, 'why', 'Filter reason: ', r.reason);
  if (r.tags && r.tags.length) { const tags = document.createElement('div'); tags.className = 'tags'; r.tags.forEach(tag => tags.appendChild(textEl('span', 'tag', '#' + tag))); headText.appendChild(tags); }
  if (r.link) { const link = document.createElement('a'); link.className = 'link'; link.href = r.link; link.target = '_blank'; link.rel = 'noopener noreferrer'; link.textContent = 'Open paper'; headText.appendChild(link); }
  head.appendChild(headText);
  if (r.summary) { const abstract = document.createElement('p'); abstract.className = 'original-abstract'; const strong = textEl('strong', '', 'Original abstract'); abstract.appendChild(strong); abstract.append(r.summary); head.appendChild(abstract); }
  slideEl.appendChild(head);
  const briefing = document.createElement('div');
  briefing.className = 'briefing';
  appendBriefSection(briefing, 'Background', b.background);
  appendBriefSection(briefing, 'Motivation', b.motivation);
  appendBriefSection(briefing, 'Result', b.result);
  appendBriefSection(briefing, 'Implication', b.implication);
  appendBriefSection(briefing, "Why it's important / Novelty", b.novelty);
  appendBriefSection(briefing, 'Unresolved Questions', b.unresolved);
  appendBriefSection(briefing, 'Expected Future Work', b.future_work);
  if (b.concepts && b.concepts.length) {
    const section = document.createElement('section');
    section.className = 'brief-section wide';
    section.appendChild(textEl('h2', '', 'Concepts / Terms'));
    const concepts = document.createElement('div');
    concepts.className = 'concepts';
    b.concepts.forEach(c => {
      const item = document.createElement('div');
      item.className = 'concept';
      item.appendChild(textEl('h3', '', c.term || 'Concept'));
      [['왜 생겼나: ', c.why_emerged], ['누가 만들었나: ', c.origin], ['연결되는 흐름: ', c.connections]].forEach(([label, text]) => { if (!text) return; const p = document.createElement('p'); const bold = textEl('b', '', label); p.appendChild(bold); p.append(text); item.appendChild(p); });
      concepts.appendChild(item);
    });
    section.appendChild(concepts);
    briefing.appendChild(section);
  }
  if (b.english_summary && b.english_summary.length) { const section = document.createElement('section'); section.className = 'brief-section wide'; section.appendChild(textEl('h2', '', 'English Summary')); const ul = document.createElement('ul'); b.english_summary.slice(0, 5).forEach(line => ul.appendChild(textEl('li', '', line))); section.appendChild(ul); briefing.appendChild(section); }
  slideEl.appendChild(briefing);
  counterEl.textContent = `${index + 1} / ${slides.length}`;
  prevBtn.disabled = index === 0;
  nextBtn.disabled = index === slides.length - 1;
}
prevBtn.addEventListener('click', () => { index = Math.max(0, index - 1); render(); });
nextBtn.addEventListener('click', () => { index = Math.min(slides.length - 1, index + 1); render(); });
document.addEventListener('keydown', event => { if (event.key === 'ArrowLeft') prevBtn.click(); if (event.key === 'ArrowRight') nextBtn.click(); });
render();
</script>
</body>
</html>
