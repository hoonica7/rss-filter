tion-driven ordering of multiple pseudospins and anomalous Hall metals in Bernal-stacked graphene", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2611.30906", "authors": "Jeonghyeon Suh, Kyungjin Shin, Hongki Min", "last_authors": "Kyungjin Shin, Hongki Min", "summary": "Recent observations of anomalous Hall states in Bernal-stacked tetralayer graphene raise a fundamental question: How do electron-electron interactions organize multiple low-energy pseudospin sectors within each spin-valley flavor? Within the Hartree-Fock approximation, we analyze interaction-driven pseudospin ordering and spin-valley polarization as functions of displacement field and carrier density. We find a rich phase diagram shaped by the interplay between the two pseudospin doublets, including mixed flavor orders at charge neutrality and anomalous Hall metals upon doping. In particular, we identify topological states with $\\sigma_{xy} \\approx 6e^{2}/h$, consistent with recent experimental observations. Our results highlight the central role of multiple pseudospin doublets in the interaction-driven phases of even-layer Bernal multilayers.", "tier": "B_IMPORTANT_CONDMAT", "score": "7", "reason": "Topological anomalous Hall states in graphene-based systems are relevant to broader topological interests.", "tags": ["graphene", "anomalousHall", "topological"], "image": "https://arxiv.org/html/2611.30906v1/fig1.png", "briefing": {"background": "버널(Bernal) 쌓임 다층 그래핀은 층간 결합과 강한 전자 간 상호작용으로 인해 다양한 위상적 전자 상태를 나타내는 플랫폼입니다. 특히 anomalous Hall 효과는 전자 상관관계와 위상 구조의 결합을 보여주는 중요한 지표입니다.", "motivation": "최근 버널 쌓임 4층 그래핀에서 관측된 anomalous Hall 상태의 근본 원인을 파악하기 위해, 여러 개의 의사 스핀(pseudospin) 자유도가 어떻게 조직되는지 규명하고자 합니다.", "result": "Hartree-Fock 근사를 통해 displacement field와 운반자 밀도에 따른 phase diagram을 도출했습니다. 특히 6e²/h의 홀 전도도를 보이는 topological 상태를 식별했습니다.", "implication": "다층 그래핀 시스템에서 다중 의사 스핀 이중층(doublets) 간의 상호작용이 위상적 물성을 결정짓는 핵심 기제임을 확인했습니다.", "novelty": "다층 그래핀의 복잡한 에너지 밴드 구조에서 다중 의사 스핀 자유도 간의 상호작용을 명확히 규명하여 실험 관측 결과(6e²/h)를 이론적으로 설명했습니다.", "unresolved": "현재의 이론적 모델이 실제 실험에서 관측되는 모든 상관관계 효과를 완벽하게 반영하는지는 추가 검증이 필요합니다.", "future_work": "다른 층수의 그래핀 시스템으로의 확장 및 더 정밀한 다체 계산(DMFT 등)을 통한 위상 상의 안정성 평가.", "concepts": [{"term": "Bernal-stacked graphene", "why_emerged": "그래핀 층들이 ABAB 순서로 적층되어 고유한 밴드 구조와 상관관계를 유도하기 위해 연구됩니다.", "origin": "그래핀 연구 초기부터 기본적인 적층 구조로 확립됨.", "connections": "Twisted bilayer graphene 및 moiré 시스템과 비교 연구됨."}, {"term": "Anomalous Hall metals", "why_emerged": "외부 자기장 없이도 자성 및 위상적 구조에 의해 발생하는 홀 효과를 설명하기 위해 필요합니다.", "origin": "Karplus와 Luttinger에 의해 이론적 기틀 마련(1954).", "connections": "Berry curvature, 자기 위상 절연체와 밀접하게 연결됨."}], "english_summary": ["Analyzes interaction-driven ordering in Bernal-stacked tetralayer graphene.", "Identifies that multiple pseudospin doublets play a central role in forming anomalous Hall states.", "Theoretical results reproduce the observed Hall conductivity of 6e²/h.", "Highlights the interplay between spin-valley polarization and pseudospin ordering in even-layer multilayers."]}}, {"title": "Interface invariants of rhombohedral graphene with layer-dependent potentials and couplings", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2611.29093", "authors": "Yuelong Li", "last_authors": "Yuelong Li", "summary": "Domain walls in the perpendicular bias of rhombohedral (ABC-stacked) graphene bind valley-resolved interface modes whose signed number is fixed by a bulk-difference invariant. We determine which values of this invariant are reachable when the layer potentials are arbitrary monotone profiles, as produced by screening, and when the interlayer couplings vary from bond to bond. Within the single-particle continuum model, the invariant of an $m$-layer stack equals the difference of occupied angular weights of the zero-momentum levels, which reduces the classification to the ordering of those levels. At equal coupling, nonlinear monotone potentials reproduce exactly the set of invariants of linear potentials, also under the requirement of a common energy gap: screening moves phase boundaries but creates no new invariant values. With bond-dependent coupling, we characterize all occupied configurations. The range of attainable invariants is unchanged, but the gaps inside it are filled, beginning at five layers. Reflection-symmetric stacks realize a large subfamily with a guaranteed common gap, and lower bounds on single-bulk gaps complete the set of invariants with a common global gap for five and six layers. Among the examples is an eight-layer domain wall defined purely by gates, whose number of co-propagating channels per valley switches from 8 to 16 as the gate strength increases. Exact transfer-matrix calculations of the interface spectrum reproduce every predicted signed crossing count. A norm bound gives the minimum spread of interlayer coupling compatible with a prescribed gap.", "tier": "B_IMPORTANT_CONDMAT", "score": "7", "reason": "Electronic structure analysis of graphene heterostructures with topological implications.", "tags": ["graphene", "topological"], "image": "https://arxiv.org/html/2611.29093v1/figures/original/setup.png", "briefing": {"background": "능동적 다층 그라핀 시스템에서 층간 결합과 퍼텐셜을 조절하여 위상학적 경계 상태를 제어하는 연구는 차세대 전자 소자 및 위상 양자 컴퓨터 구현의 핵심 요소입니다.", "motivation": "능동적 게이트 제어 환경(가변 퍼텐셜) 하에서 층간 결합 변화가 다층 능동적 그라핀 도메인 벽의 위상학적 불변량과 경계 모드에 미치는 영향을 체계적으로 분류하고자 합니다.", "result": "단일 입자 연속체 모델을 통해 다층 스택의 불변량을 결정하는 제로 모멘텀 준위의 정렬 조건을 도출하였으며, 스크리닝 효과나 결합 변화가 새로운 위상학적 불변량을 생성하지 않음을 보였습니다.", "implication": "다층 그라핀 도메인 벽의 게이트 제어를 통해 채널 수를 정밀하게 스위칭할 수 있는 설계 원리를 제시하여, 위상학적 전자 회로 구현의 토대를 마련합니다.", "novelty": "복잡한 층간 상호작용 속에서도 위상학적 불변량을 유지하는 조건을 수학적으로 엄밀히 규명하였으며, 8층 구조에서의 채널 스위칭 예시는 실험적 검증이 가능한 명확한 타겟을 제공합니다.", "unresolved": "실제 실험적 도메인 벽에서의 무질서(disorder) 영향이나 다체 효과가 위상학적 불변량의 안정성에 미치는 구체적 정량화는 여전히 과제로 남아 있습니다.", "future_work": "실제 van der Waals 이종접합 소자를 제작하여 게이트 전압을 통한 경계 상태 채널의 스위칭 성능을 STM/STS로 검증하는 연구가 필요합니다.", "concepts": [{"term": "능동적(Rhombohedral) 그라핀", "why_emerged": "Bernal(AB) 적층과 다른 위상학적 성질을 가지며 밴드 구조 조절이 용이하여 연구됨.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "위상학적 절연체, 뒤틀린 이중층 그라핀(TBG)"}, {"term": "위상학적 불변량", "why_emerged": "시스템의 전역적 위상 성질을 기술하고 위상 전이 경계를 정의하기 위해 필요.", "origin": "Thouless, Kohmoto, Nightingale, den Nijs (TKNN) 등", "connections": "벌크-경계 대응 원리, Chern 수"}], "english_summary": ["Analyzes interface invariants in ABC-stacked graphene systems.", "Determines effects of layer-dependent potentials and bond-dependent couplings.", "Confirms that screening does not change the allowed topological invariant values.", "Demonstrates gate-controlled switching of co-propagating edge channels in multilayer stacks."]}}, {"title": "Interface-Engineered Piezoelectricity and Electromechanical Coupling in Two-Dimensional van der Waals Heterostructures", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2611.30974", "authors": "Shivanand Yadav, Raihan Ahammed, Umer Ali, et al.", "last_authors": "Amit Agarwal, Somnath Bhowmick", "summary": "Interfaces between dissimilar two-dimensional (2D) materials provide a route to engineer electromechanical responses that are not intrinsic to the individual constituent layers. Here, we use high-throughput density functional theory (DFT) calculations to investigate 461 van der Waals heterostructures constructed from 57 2D monolayers and establish a materials-design framework linking work-function mismatch, interfacial charge redistribution, dipole formation, and strain-dependent electromechanical response. We find that heterostructure formation generates out-of-plane interfacial dipoles via charge redistribution between the constituent layers, while biaxial in-plane strain systematically modulates them. The resulting heterostructures exhibit two distinct regimes: metallic interfaces with strain-tunable interfacial dipoles and semiconducting heterostructures with well-defined piezoelectric responses. For the latter, Berry-phase (BP) calculations independently validate the charge-density-difference (CDD) approach, which is generally applicable to all representative systems, with piezoelectric coefficients calculated via two methods agreeing to within 10%. Among 24 selected heterostructures, effective biaxial interfacial electromechanical coefficients reach 83.35 pCm-1 . These results demonstrate that the interface can serve as the active element governing electromechanical coupling and provide a computationally guided strategy for designing strain-tunable out-of-plane electromechanical responses in 2D van der Waals heterostructures.", "tier": "B_IMPORTANT_CONDMAT", "score": "7", "reason": "High-throughput DFT study of 2D vdW heterostructures is relevant to the broader reader profile.", "tags": ["vanderWaals", "heterostructure", "DFT"], "image": "https://arxiv.org/html/2611.30974v1/Figure_1.1.png", "briefing": {"background": "2D van der Waals 이종접합은 단일 소재가 갖지 못하는 특이적 전기기계적 반응을 유도할 수 있어 차세대 유연 소자 설계의 유망한 플랫폼입니다.", "motivation": "수백 개의 이종접합 조합을 대규모 DFT 계산으로 분석하여, 층간 전하 이동과 쌍극자 형성이 압전 성능에 미치는 상관관계를 체계적으로 이해하고자 합니다.", "result": "전하 밀도 차이(CDD) 분석과 베리 위상(Berry phase) 계산을 통해 이종접합의 압전 계수를 정량화하였으며, 금속성 및 반도체성 인터페이스별 물리적 메커니즘을 구분하였습니다.", "implication": "계면 엔지니어링을 통해 압전 반응을 극대화하는 소재 설계 가이드라인을 제공하며, 특히 계면 자체가 물리적 활성 요소가 될 수 있음을 입증했습니다.", "novelty": "461개의 대규모 데이터셋 기반으로 소재 설계 프레임워크를 정립하였으며, 전기기계적 계수 도출 방법론을 표준화했다는 점이 핵심입니다.", "unresolved": "실제 합성된 샘플에서의 원자 단위 계면 결함이나 도메인 구조가 계산된 이상적인 압전 성능에 미치는 영향은 아직 평가되지 않았습니다.", "future_work": "계산된 소재들 중 상위권 물질에 대해 실험적 압전 반응 측정 및 strain에 따른 밴드 구조 변화의 ARPES 검증이 기대됩니다.", "concepts": [{"term": "Van der Waals 이종접합", "why_emerged": "격자 불일치 부담 없이 서로 다른 특성의 2D 층을 결합하여 새로운 물리 현상을 찾기 위해.", "origin": "Geim & Novoselov 등에 의해 대중화", "connections": "Moire 패턴, 2D 소재 밴드 엔지니어링"}, {"term": "베리 위상(Berry Phase)", "why_emerged": "파동 함수의 기하학적 위상 성질을 기술하고 분극 및 압전 성능을 정량화하기 위해 필요.", "origin": "Michael Berry (1984)", "connections": "이상 홀 효과, 위상 절연체"}], "english_summary": ["High-throughput DFT screening of 461 van der Waals heterostructures.", "Establishes a design framework linking interfacial dipoles to electromechanical response.", "Validates piezoelectric coefficients using Berry-phase and charge-density methods.", "Identifies effective interfacial electromechanical coefficients reaching 83.35 pCm-1."]}}, {"title": "Interstitial Magnetoelectricity in Altermagnetic Electrides", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2611.28504", "authors": "Yue Li, Shibo Fang, Jianhua Wang, et al.", "last_authors": "Jing Lu, Yee Sin Ang", "summary": "Electrides and altermagnets are two distinct yet intriguing classes of quantum materials, characterized by interstitial anionic electrons and nonrelativistic spin splitting, respectively. The recent prediction of Stoner-instability-driven altermagnetic electride provides a natural bridge between these two fields. Here, we investigate the magnetoelectric response and its related spin-polarized transport in the altermagnetic electride Zr$_2$N monolayer. Using the tight-binding Hubbard model and first-principles calculations, we find that the electric field can break the magnetic compensation between the two interstitial anionic electrons, inducing a finite net magnetization and giving rise to an interstitial electron mediated magnetoelectric response. The magnetoelectric response is further demonstrated through the electrical control of spin conductivity. Our results reveal a magnetoelectric effect in altermagnetic electrides, paving a way towards electride-based spintronic devices.", "tier": "B_IMPORTANT_CONDMAT", "score": "7", "reason": "Altermagnetism and transport in 2D systems align with current spintronics/topological interests.", "tags": ["altermagnet", "electride", "spintronics"], "image": "https://arxiv.org/static/browse/0.3.4/images/arxiv-logo-fb.png", "briefing": {"background": "알터마그네틱(Altermagnetic) 물질은 기존의 강자성/반강자성과는 다른 비상대론적 스핀 분할을 보여 차세대 스핀트로닉스 소재로 주목받고 있습니다.", "motivation": "알터마그네틱 특성과 electride(음이온 전자)의 특성을 동시에 가진 Zr2N 단층에서 전기장을 통한 스핀 제어 가능성을 탐색하고자 합니다.", "result": "외부 전기장이 계면의 스핀 보상(magnetic compensation)을 깨뜨려 넷 자기화(net magnetization)를 유도하며, 이를 통해 스핀 전도도를 전기적으로 제어할 수 있음을 보였습니다.", "implication": "일반적인 자기장 제어가 아닌 전기장 기반의 스핀 제어가 알터마그네틱 시스템에서 가능함을 제시하여, 저전력 스핀트로닉스 소자의 새로운 후보를 제공합니다.", "novelty": "새로운 물리 상태인 '알터마그네틱 electride'를 정의하고, interstitial 전자의 자유도를 활용한 자기전기 효과를 최초로 이론적 모델링했습니다.", "unresolved": "실제 Zr2N 단층의 실험적 합성 난이도와, 실제 온도 환경에서의 알터마그네틱 질서의 안정성 및 도메인 영향은 확인이 필요합니다.", "future_work": "알터마그네틱 electride의 스핀 분할 구조를 확인하기 위한 ARPES/spin-resolved ARPES 실험과 자기전기 효과 측정 연구가 뒤따라야 합니다.", "concepts": [{"term": "알터마그네틱(Altermagnet)", "why_emerged": "스핀-궤도 결합 없이도 자발적인 스핀 분할을 가지는 새로운 자기 상의 필요성.", "origin": "Recent theoretical prediction (e.g., Libor Šmejkal et al.)", "connections": "반강자성, 비자성 금속과의 차별화된 스핀 구조"}, {"term": "Electride", "why_emerged": "격자 간 사이(interstitial)에 전자가 음이온처럼 존재하는 독특한 전자 구조 특성 탐구.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "낮은 일함수, 전자 방출 소재"}], "english_summary": ["Investigates magnetoelectric effects in altermagnetic electride Zr2N monolayers.", "Uses Hubbard model and DFT to show electric-field-induced net magnetization.", "Demonstrates electrical control of spin conductivity in the interstitial electron system.", "Paves the way for electride-based altermagnetic spintronic devices."]}}, {"title": "Intertwined Magneto-Structural Criticality Driving Heterogeneous Collective-Pseudospin Dynamics in Sr2IrO4", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2611.28395", "authors": "Arnab Singh, Junyoung Kwon, AM Milinda Abeykoon", "last_authors": "Junyoung Kwon, AM Milinda Abeykoon", "summary": "Correlated quantum phenomena arising from spin-orbit-coupled degrees of freedom provide foundational paradigms in emerging quantum technologies and spin-based functionalities. Elucidating the cooperative behaviors of these systems requires a precise probing of their intertwined magnetic and structural configurations. Using complementary resonant X-ray diffraction and high-energy total scattering measurements on single crystals of Sr2IrO4, we observe that spontaneous structural distortions scale quadratically with the magnetic order parameter. Importantly, the lattice distortion inherits the characteristic 2D XY -like critical behavior of the underlying antiferromagnetic order. X-ray photon correlation spectroscopy (XPCS) reveals multiscale, temperature- and wave-vector-dependent magnetic dynamics characterized by compressed-exponential relaxation and signatures of critical slowing down near the magnetic transition. These findings suggest the role of spin-orbit coupling and local structural distortions as the possible mechanism orchestrating such unconventional dynamics.", "tier": "B_IMPORTANT_CONDMAT", "score": "7", "reason": "Strong correlation study of spin-orbit coupled iridate relevant to electronic structure interests.", "tags": ["correlated", "magnetism", "electronicstructure"], "image": "https://arxiv.org/html/2611.28395v1/Figure_1_ver2_HR.png", "briefing": {"background": "Sr2IrO4는 스핀-궤도 결합(SOC)이 강한 5d 전이금속 산화물로, 구리 기반 고온 초전도체와 유사한 물성을 보여 강상관계 물리 분야의 중요한 모델 물질입니다. 스핀과 격자 자유도가 어떻게 얽혀있는지를 규명하는 것은 전이금속 산화물의 근본적인 물성을 이해하는 데 필수적입니다.", "motivation": "이 연구는 Sr2IrO4에서 스핀-궤도 결합에 의해 나타나는 자기적 질서와 격자 구조 사이의 상관관계, 그리고 상전이 근처에서 발생하는 복잡한 동역학적 특성을 분자 수준에서 밝히고자 했습니다.", "result": "구조적 왜곡이 자기 질서 변수와 이차적으로 비례하며, 격자 왜곡이 2D XY 모델의 임계 거동을 따른다는 점을 확인했습니다. 또한, X-ray 광자 상관 분광법(XPCS)을 통해 자기 전이 근처에서 나타나는 느려짐 현상과 압축 지수 완화 동역학을 관측했습니다.", "implication": "스핀-궤도 결합이 단순한 정적 구조를 넘어, 동역학적인 상전이 과정에서 격자와 자기 시스템을 어떻게 결합시키는지를 보여주며, 강상관계 물질에서의 창발적 물성 이해에 중요한 단서를 제공합니다.", "novelty": "기존의 정적 측정 방식에서 벗어나 XPCS를 통해 자기적 동역학을 직접 관측했다는 점이 독보적입니다. 강상관계 물질에서의 비정상적인 동역학을 이해하려는 연구자에게 특히 흥미로운 결과입니다.", "unresolved": "격자 왜곡과 자기 동역학 간의 구체적인 미시적 메커니즘은 여전히 추가적인 이론 모델링이 필요합니다.", "future_work": "다른 5d 전이금속 시스템으로의 확장 연구와 더불어, 초고속 펌프-프로브 분광법을 이용한 비평형 동역학 연구가 기대됩니다.", "concepts": [{"term": "스핀-궤도 결합 (Spin-Orbit Coupling)", "why_emerged": "5d 원소처럼 무거운 원자에서 전자의 궤도와 스핀 자유도가 얽히며 에너지가 갈라지는 현상을 설명하기 위해 필요합니다.", "origin": "양자역학 초기 이론부터 존재하였으며, 고체 물리학에서는 디랙 방정식을 비상대론적으로 근사하여 정립됨.", "connections": "위상 절연체, 디랙 반금속, 이리데이트의 Mott 절연체 연구와 직결됨."}, {"term": "XPCS (X-ray Photon Correlation Spectroscopy)", "why_emerged": "물질 내부의 나노미터 규모에서 발생하는 시간에 따른 요동(fluctuation)을 직접 측정하기 위해 개발되었습니다.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "상전이 임계 동역학, 유리질(glassy) 상태 연구, 확산 현상 규명 등에 활용."}], "english_summary": ["Sr2IrO4 exhibits intertwined magnetic and structural criticality.", "Structural distortions scale quadratically with magnetic order parameters.", "XPCS measurements reveal critical slowing down near the magnetic transition.", "Spin-orbit coupling is identified as a key driver for these unconventional dynamics."]}}, {"title": "Intrinsic disorder in the candidate quantum spin ice Pr2Zr2O7", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2509.10101", "authors": "T. J. Hicken, P. Meadows, D. Prabhakaran, et al.", "last_authors": "D. J. Voneshen, J. P. Goff", "summary": "Pr$_2$Zr$_2$O$_7$ is a promising example of a quantum spin liquid, where structural disorder plays a key role in enhancing quantum mechanical effects. Here we have determined the intrinsic defect structure of Pr$_2$Zr$_2$O$_7$ using neutron and x-ray scattering techniques supported by density functional theory. Our results explain the crystal field excitations by considering the non-magnetic singlets that arise on neighbouring sites. This makes a significant contribution towards the observed broadening of pinch points in the magnetic diffuse scattering, which was previously attributed purely to quantum effects.", "tier": "B_IMPORTANT_CONDMAT", "score": "7", "reason": "Neutron scattering analysis of disorder in a quantum spin liquid candidate.", "tags": ["spinliquid", "neutronscattering", "disorder"], "image": "https://arxiv.org/html/2509.10101v2/fig1_structure.png", "briefing": {"background": "양자 스핀 액체(QSL)는 절대 영도에서도 자기적 질서가 생기지 않는 상태로, 후보 물질 내의 결정 결함이나 무질서가 이 상태를 방해하거나 오히려 안정화하는 역할을 할 수 있어 활발히 연구됩니다.", "motivation": "Pr2Zr2O7은 유력한 QSL 후보 물질이지만, 실험적으로 관측되는 자기 산란 데이터의 기원이 순수한 양자 효과인지 아니면 결정 내의 무질서 때문인지 명확히 구분할 필요가 있었습니다.", "result": "중성자 및 X-선 산란을 통해 Pr2Zr2O7 내부의 고유한 결함 구조를 결정했습니다. 이 결함이 인접한 사이트에서 비자성 싱글렛을 형성하며, 이로 인해 자기 산란에서 관측되는 '핀치 포인트(pinch point)'의 폭이 넓어지는 현상이 순수 양자 효과가 아닌 결함에 의한 것임을 밝혀냈습니다.", "implication": "QSL 후보 물질 분석 시 무질서의 효과를 분리하는 것이 필수적임을 보여주며, 기존 양자 효과로 해석되던 결과들에 대한 재검토가 필요함을 시사합니다.", "novelty": "중성자 산란 데이터 해석에서 무질서의 영향을 정량적으로 배제하여 QSL 후보 물질의 데이터를 더 정확하게 해석할 수 있는 방법론을 제시했습니다.", "unresolved": "결함이 완전히 배제된 이상적인 단결정에서 어떤 본질적인 양자 자기적 거동이 나타날지는 여전히 밝혀야 할 과제입니다.", "future_work": "더 높은 순도의 샘플 제작을 통한 후속 중성자 산란 실험이 필요하며, 타 QSL 후보 물질로의 분석 방법론 확장 연구가 예상됩니다.", "concepts": [{"term": "양자 스핀 액체 (Quantum Spin Liquid)", "why_emerged": "저온에서도 스핀이 얼지 않고 얽힘 상태를 유지하는 새로운 양자 물질 상태를 정의하기 위해 필요합니다.", "origin": "필립 앤더슨(Philip Anderson)이 1973년에 제안함.", "connections": "고온 초전도체, 위상 양자 컴퓨터, 프러스트레이션 자기 시스템 연구와 연결됨."}, {"term": "핀치 포인트 (Pinch Point)", "why_emerged": "스핀 아이스 시스템에서의 자기적 상관관계를 역격자 공간에서 시각화할 때 나타나는 특징적인 형태입니다.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "스핀 아이스, 쿨롱상(Coulomb phase), 자기 모노폴 연구."}], "english_summary": ["Pr2Zr2O7 is a quantum spin liquid candidate with intrinsic structural disorder.", "Neutron and X-ray scattering confirm defect structures create non-magnetic singlets.", "Disorder, rather than purely quantum effects, accounts for pinch point broadening.", "Accurate modeling of defects is crucial for interpreting quantum spin liquid signatures."]}}, {"title": "Local Pressure Induced Quantum Dot to Ring Transition and Aharonov Bohm Effect in Reconfigurable MoTe2 Bilayers", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2611.28786", "authors": "Ibsal Assi, A. Belayadi, Hocine Bahlouli, Udo Schwingenschl\\\"ogl, J. P. F. LeBlanc", "last_authors": "Udo Schwingenschl\\\"ogl, J. P. F. LeBlanc", "summary": "We demonstrate that local pressure provides an effective means of engineering reconfigurable quantum confinement in MoTe2 homobilayers. By applying a smooth, spatially varying pressure profile, we show that the confinement geometry can be continuously tuned from a conventional quantum dot to a quantum ring, with the emergence of annular confinement being a distinctive feature of AB-stacked bilayers. This crossover originates from the pressure-induced spatial modulation in the electronic parameters, which produces an off-center minimum in the effective confinement potential, thereby redistributing the ground-state probability density away from the center and giving rise to an annular confinement geometry. In the quantum-ring regime, a perpendicular magnetic field gives rise to a flux-periodic energy spectrum and persistent currents, providing characteristic signatures of the Aharonov-Bohm effect. By coupling the pressure-induced quantum ring to source and drain leads, we further demonstrate pronounced Aharonov-Bohm conductance oscillations, accompanied by real-space current patterns exhibiting constructive and destructive interference at integer and half-integer magnetic flux quanta, respectively. These findings establish locally pressurized MoTe2 bilayers as a lithography-free platform for reconfigurable quantum confinement and realizing pressure-tunable Aharonov-Bohm interferometry in two dimensional materials.", "tier": "B_IMPORTANT_CONDMAT", "score": "7", "reason": "Relevant study on 2D van der Waals materials and reconfigurable electronic confinement.", "tags": ["vanderWaals", "electronicstructure"], "image": "https://arxiv.org/html/2611.28786v1/AB_stack_dot_to_ring.png", "briefing": {"background": "2D 전이금속 디칼코게나이드(TMD)는 게이트 조절이나 압력 등을 통해 전자 상태를 제어할 수 있는 플랫폼을 제공하며, 특히 나노구조를 자유롭게 구성하여 양자 소자를 구현하려는 연구가 진행 중입니다.", "motivation": "MoTe2 이중층에서 국소적인 압력을 이용해 양자점(Quantum Dot)에서 양자 고리(Quantum Ring)로의 변환을 유도하고, 이를 통해 아하로노프-봄(AB) 효과를 관측하고자 했습니다.", "result": "압력을 가하는 공간적 프로파일을 조절하여 전자의 가둠 형태를 양자 고리로 바꿀 수 있음을 이론적으로 보였습니다. 또한, 자기장에 따른 전도도 진동(Aharonov-Bohm oscillation)이 발생하는 것을 확인하여, 리소그래피 없이도 재구성 가능한 양자 소자 플랫폼을 증명했습니다.", "implication": "별도의 정밀한 리소그래피 없이 기계적인 압력만으로 복잡한 나노 전자 구조를 설계할 수 있다는 점은 향후 양자 소자 제조 공정의 패러다임을 바꿀 수 있는 가능성을 제시합니다.", "novelty": "2D TMD 물질에서 압력이라는 물리적 수단을 통해 동적으로 가둠 포텐셜을 변화시켜 AB 효과를 구현했다는 점이 매우 창의적입니다.", "unresolved": "실제 실험적으로 압력을 나노미터 스케일에서 정밀하게 인가하는 기술적 난관이 남아있습니다.", "future_work": "실험실 환경에서의 국소 압력 인가 기술(예: AFM 팁 사용)과의 결합 연구 및 소자 응용을 위한 전도도 측정 연구가 필요합니다.", "concepts": [{"term": "아하로노프-봄 효과 (Aharonov-Bohm Effect)", "why_emerged": "자기장이 없는 영역에서도 전자의 위상이 벡터 포텐셜에 의해 변할 수 있음을 입증하기 위해 도입되었습니다.", "origin": "야키르 아하로노프와 데이비드 봄이 1959년 제안함.", "connections": "위상 양자 현상, 양자 간섭 소자(SQUID), 링 기반 양자 간섭 측정."}, {"term": "MoTe2 이중층 (Homobilayers)", "why_emerged": "2D 층간 결합을 통해 단층 물질에서는 볼 수 없는 새로운 밴드 구조 및 위상 물성을 탐색하기 위해 필요합니다.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "Moiré 물리, 반데르발스 헤테로구조, 층간 엑시톤 연구."}], "english_summary": ["Locally applied pressure in MoTe2 bilayers reconfigures quantum confinement geometry.", "The system transitions from a quantum dot to an annular quantum ring.", "Aharonov-Bohm conductance oscillations are observed in the ring regime.", "This provides a lithography-free platform for reconfigurable quantum electronic devices."]}}, {"title": "Mixed-State Magnetotransport Below Tc in Type-II Superconducting NbN Thin Films", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2611.29817", "authors": "Sai Vaishnavi Kanduri, Danilo B\\\"urger, Zichao Li, et al.", "last_authors": "Sahitya V. Vegesna, Heidemarie Kr\\\"uger", "summary": "The transport properties of type-II superconductors in the mixed state below the superconducting transition temperature, $T_c$, remain difficult to interpret because superconducting and dissipative processes coexist in the presence of a magnetic field. To investigate this regime in NbN thin films, we measured the field-dependent sheet resistance ($R^M_{xx}$) and Hall resistance ($R^M_{xy}$) below $T_c$ in Van der Pauw geometry for 4-nm-thick NbN films on sapphire and silicon substrates at driving currents of 1 mA and 2 mA. By combining the longitudinal response with the antisymmetrized Hall signal, we use a phenomenological current-partition model to estimate the dissipative and superconducting current contributions. From this analysis, we estimate the field-dependent superconducting current together with the Hall-derived effective dissipative carrier density and mobility. We also observe an even-in-field transverse signal whose magnitude depends strongly on the driving current. We discuss this signal as a possible mixed-state response involving the magnetic and supercurrent texture of Abrikosov vortices, vortex dynamics, and Cooper-pair current redistribution. The present measurements do not uniquely distinguish vortex, condensate, or combined contributions. The model provides a practical way to compare the longitudinal and transverse mixed-state responses without implying a direct spatial separation of the two current channels.", "tier": "B_IMPORTANT_CONDMAT", "score": "7", "reason": "Magnetotransport study in a superconductor, relevant to vortex physics and topological superconductivity.", "tags": ["superconductivity", "transport", "vortex"], "image": "https://arxiv.org/html/2611.29817v1/Fig2.jpg", "briefing": {"background": "제2종 초전도체는 자기장 하에서 볼텍스(Abrikosov vortices)가 형성되는 혼합 상태(mixed state)를 가지며, 이때 초전도와 저항성 소산(dissipation)이 공존합니다. 이 상태에서의 수송 현상은 복잡한 동역학으로 인해 해석이 매우 까다롭습니다.", "motivation": "NbN 박막에서 자기장과 전류에 따른 수송 특성을 분리하여, 초전도 전류와 소산적 전류 성분이 혼합 상태에서 어떻게 기여하는지 현상론적으로 규명하고자 했습니다.", "result": "전류 분할 모델(current-partition model)을 사용하여 종방향 저항과 홀 저항으로부터 초전도 전류 및 소산적 운반자 밀도를 분리 추정했습니다. 또한 자기장에 대해 우함수(even-in-field)인 횡방향 신호를 관측했는데, 이는 볼텍스 동역학 및 초전도 응축의 재분배와 관련이 있을 것으로 보입니다.", "implication": "복잡한 혼합 상태에서의 수송 현상을 공간적으로 완전히 분리하지 않고도 모델을 통해 효과적으로 이해하고 비교할 수 있는 실용적인 분석 프레임워크를 제시했습니다.", "novelty": "실험적으로 얻기 어려운 초전도-소산 전류 성분을 홀 신호 분석을 통해 효과적으로 분해했으며, NbN 시스템에서 볼텍스 텍스처와 관련된 비자명한 횡방향 신호를 보고했습니다.", "unresolved": "현재의 측정 데이터만으로는 볼텍스 기여분, 초전도 응축분, 혹은 이들이 결합된 효과를 완전히 분리하여 단정 짓기는 어렵습니다.", "future_work": "볼텍스 동역학의 직접적인 영상화 실험이나 더 정교한 미시적 이론 모델과의 결합을 통해 신호의 기원을 명확히 규명할 필요가 있습니다.", "concepts": [{"term": "Abrikosov vortex", "why_emerged": "제2종 초전도체 내부로 자기장이 침투할 때 에너지를 최소화하기 위해 형성되는 양자화된 자기선속 다발입니다.", "origin": "Alexei Abrikosov (1957)", "connections": "Ginzburg-Landau 이론, 초전도체의 자성 거동 연구."}, {"term": "Mixed state", "why_emerged": "제2종 초전도체에서 하부 임계자기장(Hc1)과 상부 임계자기장(Hc2) 사이의 상태를 설명하기 위해 필요합니다.", "origin": "초전도 이론 초기 단계에 확립됨", "connections": "Vortex lattice, flux pinning."}], "english_summary": ["Investigated magnetotransport in 4-nm-thick NbN films below Tc.", "Used a phenomenological current-partition model to distinguish superconducting and dissipative contributions.", "Reported an even-in-field transverse signal likely linked to vortex dynamics.", "Demonstrated that transport measurements can probe mixed-state textures without requiring spatial separation."]}}, {"title": "Oscillatory superconducting proximity effects in a buried Pt interlayer detected by FMR", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2611.28313", "authors": "L. Peridon, T. Courtois, S. A Hussain, et al.", "last_authors": "C. Ciccarelli, T. Hauet", "summary": "We investigate superconducting proximity effects in NbN/Pt/Py and NbN/Cu/Py trilayers using broadband ferromagnetic resonance (FMR). The reduction of the spin-pumping contribution to the Py damping below the superconducting transition temperature (Tc) is used to probe the superconducting correlations and electronic density of state in the buried metallic interlayer. For a Cu interlayer, the damping reduction remains finite up to at least 20 nm, in agreement with the large coherence length above 100nm in Cu. In contrast, the damping reduction for a Pt interlayer exhibits a non-monotonic thickness dependence and is fully suppressed above 5 nm. Using the quasiclassical theory, we a o spintronics, but conventional spin Hall mechanisms are intrinsically limited by the small spin Hall angle. Here we show that superconductivity can overcome this limitation and enable near-unity spin-to-charge signal conversion. We consider a nonlocal spin-valve geometry in which a spin accumulation is injected into a superconductor and converted into a transverse charge signal through the inverse spin Hall effect. In the superconducting state, the strongly suppressed quasiparticle conductance below the gap allows the resulting charge imbalance to generate a voltage comparable to the injected spin bias, despite a small spin Hall angle. We derive the full nonequilibrium response including finite spectral broadening and finite temperature, and propose temperature and spin-bias-dependent measurements of the detector voltage to test our predictions.", "tier": "B_IMPORTANT_CONDMAT", "score": "7", "reason": "Topical discussion on spin-charge conversion in superconductors, relevant to topological/unconventional superconductivity.", "tags": ["superconductor", "Halleffect", "spintronics"], "image": "https://arxiv.org/html/2611.30781v1/Setup.png", "briefing": {"background": "스핀트로닉스 분야에서는 정보 처리를 위해 스핀 흐름을 전하 흐름으로 변환하는 효율(스핀 홀 각도)을 높이는 것이 핵심 과제입니다. 일반적인 금속에서는 이 효율이 매우 낮아 응용에 한계가 있습니다.", "motivation": "초전도체의 초전도 갭 이하에서 준입자 전도도가 억제된다는 점을 활용하여, 낮은 스핀 홀 각도에서도 고효율의 스핀-전하 변환이 가능한지 이론적으로 검증하고자 함.", "result": "초전도 상태의 비평형 응답을 계산한 결과, 스핀 축적에 의한 전하 불균형이 초전도 갭에 의해 증폭되어 스핀 주입 전압과 유사한 수준의 전압(near-unity conversion)을 생성할 수 있음을 입증함.", "implication": "초전도체를 활용한 초고효율 스핀 감지기나 논리 소자 설계가 가능해지며, 특히 비전통적 초전도체나 위상 초전도체의 스핀 물성 연구에 중요한 도구가 될 것임.", "novelty": "기존의 물질적 한계인 '낮은 스핀 홀 각도'를 초전도 상태의 특이한 준입자 동역학을 이용해 극복했다는 점이 핵심임.", "unresolved": "이론적으로는 준입자 응답을 기반으로 하지만, 실제 실험 환경(특히 비평형 상태의 국소적 가열 효과 등)에서의 정교한 측정은 과제로 남아 있음.", "future_work": "실제 스핀-밸브 구조에서 온도와 스핀 바이어스 변화에 따른 전압 응답을 측정하는 실험적 검증이 필요함.", "concepts": [{"term": "Inverse Spin Hall Effect", "why_emerged": "스핀 전류를 측정 가능한 전압(전하 전류)으로 변환하기 위해 필요함.", "o  Rev. Lett.)", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2509.22606", "authors": "Viktor Bekassy, Mikael Fogelstr\\\"om, Johannes Hofmann", "last_authors": "Mikael Fogelstr\\\"om, Johannes Hofmann", "summary": "Quantum gases are used to simulate the physics of the lowest Landau level with neutral atoms, which in the simplest setup is achieved by rotating the gas at the confining harmonic trap frequency, a requirement that is difficult to meet in practice. However, it is known that lowest Landau level states appear among the excited states of weakly interacting gases, even in a nonrotating trap, by working at fixed finite angular momentum. Thus, even in the absence of rotations or for moderate rotation frequencies, fractional quantum Hall (FQH) states can be accessed as excited states at finite angular momentum. Motivated by this, and by recent experimentally demonstrated excitation protocols for two particles, we show that such states can be selectively addressed at larger particle numbers, and we propose imaging techniques to resolve their distinct microscopic structure. In particular, we suggest that recently developed excitation and imaging techniques for rotating few-fermion systems allow for a detailed experimental investigation of FQH wave functions and of the crossover to large particle numbers. We illustrate the evolution of the excitation spectrum with rotations at weak interactions for $N=6$ spin-balanced fermions and show how sampling of the few-body wave function allows one to discriminate between total guiding-center, center-of-mass vortex, and hyperradial excitations, thus providing detailed and versatile probes of the microscopic structure of FQH states.", "tier": "B_IMPORTANT_CONDMAT", "score": "7", "reason": "Discusses experimental probes of fractional quantum Hall states, relevant to topological physics.", "tags": ["quantumHall", "Fermigas"], "image": "https://arxiv.org/html/2509.22606v2/fig2.png", "briefing": { nt magnets without a magnetic field. In this study, we find that a type of skyrmion crystal with two topological charges per unit cell and no magnetization at the ferromagnetic point in reciprocal space, SkX-2, is naturally stabilized in an $\\mathrm{SO}(3)$-symmetric model with short-range interactions realized by the Heisenberg model on the triangular lattice with scalar chirality. We complement our numerical results with a theoretical analysis that quantitatively describes the transition from the ferromagnetic to the SkX-2 ground state and the evolution of the topological charge density. Despite the constraints given by the Mermin-Wagner theorem at finite temperature, the SkX-2 can either exhibit a first-order phase transition with translation symmetry breaking, or a continuous transition to a floating solid depending on the charge density, which is given by the strength of the scalar chirality interaction. Finally, the numerical results indicate the presence of $\\mathbb{Z}_2$-vortices at finite temperature above the tetrahedral ground state in the antiferromagnetic region of our model, suggesting the existence of a vortex topological transition similar to that reported in the ordering of the pure antiferromagnetic model.", "tier": "B_IMPORTANT_CONDMAT", "score": "7", "reason": "Theory of skyrmion crystals in itinerant magnets, relevant to topological magnetic materials.", "tags": ["skyrmion", "topological", "magnetism"], "image": "https://arxiv.org/static/browse/0.3.4/images/arxiv-logo-fb.png", "briefing": {"background": "스커미온 결정(Skyrmion crystal)은 일반적으로 비중심대칭 격자에서 자기장 인가 시 나타나는 위상학적 스핀 구조입니다. 최근 연구는 자기장 없이 스핀 상호작용만으로 이를 구현하는 물리학적 메커니즘을 규명하는 데 집중하고 있습니다.", "motivation": "외부 자기장 없이도 스칼라 카이랄성(scalar chirality)이 존재하는 하이젠베르크 삼각형 격자 모델에서 스커미온 결정이 안정화될 수 있는지 이론적으로 확인하고자 합니다.", "result": "이 연구는 두 개의 위상 전하를 가지며 자기장이 없는 상태에서 안정적인 SkX-2 위상 구조를 발견했습니다. 또한 강자성 상태에서 SkX-2로의 전이 메커니즘을 정량화하고 유한 온도에서의 위상학적 특성을 논의했습니다.", "implication": "자기장 없이도 위상학적 자기 구조가 안정화될 수 있음을 보임으로써, 위상학적 홀 효과 및 스핀트로닉스 소자 응용을 위한 새로운 재료 설계 가능성을 제시합니다.", "novelty": "외부 자기장 없이 SO(3) 대칭성 모델 내에서 스칼라 카이랄성 상호작용만으로 SkX-2가 자연스럽게 유도된다는 점이 핵심입니다. 이는 위상학적 자성체 연구자에게 중요한 모델 체계가 될 것입니다.", "unresolved": "유한 온도에서 Mermin-Wagner 정리에 의한 변동성과 실제 물리적 시스템에서의 정확한 상전이 유형(1차 vs 연속)은 여전히 논쟁적입니다.", "future_work": "실제 비중심대칭 자성체에서 이 이론적 모델을 검증하기 위한 중성자 산란 연구나 박막 시편을 이용한 실공간 관측이 필요합니다.", "concepts": [{"term": "스커미온 결정(Skyrmion crystal)", "why_emerged": "자기 모멘트가 나선형/소용돌이 형태로 주기적으로 배열된 위상학적 자기 구조를 기술하기 위해 필요.", "origin": "Tony Skyrme(1962), 자기 시스템에서의 실현은 Mühlbauer et al.(2009).", "connections": "위상학적 홀 효과(THE), 카이랄 자성, 스핀텍스처."}, {"term": "스칼라 카이랄성(Scalar chirality)", "why_emerged": "비공면적(non-coplanar) 스핀 배열을 기술하고 위상학적 홀 효과와 같은 물리적 현상을 설명하기 위해 도입.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "스핀-궤도 결합, 베리 위상, 위상학적 홀 효과."}], "english_summary": ["The paper investigates skyrmion crystal stability in an SO(3)-symmetric Heisenberg triangular lattice without external magnetic fields.", "Identifies the SkX-2 phase, characterized by two topological charges per unit cell, stabilized by scalar chirality interactions.", "Provides a theoretical description of the transition from ferromagnetic ground states to SkX-2.", "Discusses the role of Z2-vortices at finite temperatures in the antiferromagnetic region."]}}, {"title": "Quantum Hall Effect in a 3D Cross-Dimensional Quantum Anomalous Hall System", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2611.28751", "authors": "Liang-Liang Cheng, Ao-Long Li, Zhi-Qiang Zhang, Hua Jiang", "last_authors": "Zhi-Qiang Zhang, Hua Jiang", "summary": "We systematically investigate cross-dimensional transport and the resulting quantum Hall effect in 3D quantum anomalous Hall effect systems, which are constructed by coupling two Weyl-semimetal Hamiltonians. Our study unveils that the system hosts highly anisotropic surface states and chiral modes, leading to rich quantum Hall responses. Crucially, we clarify how magnetic fields applied along three high-symmetry directions dictate the evolution of the Chern numbers, chiral modes, and Hall responses. We discover that chiral modes along different directions can originate from distinct mechanisms, giving rise to various magnetic modulation characteristics. Furthermore, we unveil the breakdown of the conventional Chern-number-based bulk-boundary correspondence under magnetic fields, where the Chern numbers alone fail to fully characterize the evolution of the chiral states. This anomalous behavior is attributed to the unique momentum-space distributions of surface bands. These insights are further validated numerically through multi-terminal Hall transport simulations. Our findings expand the understanding of magnetic-field-driven mechanisms in 3D topological systems and provide deeper insights into the interplay between quantized Hall effects and Chern numbers in 3D systems.", "tier": "B_IMPORTANT_CONDMAT", "score": "7", "reason": "Important study on topological phases in Weyl semimetals with experimental transport implications.", "tags": ["Weyl", "topological", "transport"], "image": "https://arxiv.org/html/2611.28751v1/fig1.png", "briefing": {"background": "위상학적 반금속은 벌크의 밴드 교차점과 표면의 페르미 아크가 특징입니다. 3차원 양자 이상 홀 효과(QAHE) 시스템은 이러한 위상학적 특징이 외부 자기장 및 결합된 Weyl 반금속 Hamiltonians에 의해 어떻게 변조되는지 탐구합니다.", "motivation": "3D 시스템에서 여러 방향으로 자기장을 인가했을 때 횡방향 수송 특성과 Chern 수의 변화, 그리고 벌크-표면 대응 원리가 어떻게 수정되는지 밝히고자 합니다.", "result": "서로 다른 대칭 방향에 따른 자기장 인가가 위상학적 표면 상태와 chiral 모드를 어떻게 제어하는지 분석했습니다. 기존의 Chern 수 기반 대응 원리가 3D 환경에서 붕괴될 수 있음을 수치적으로 입증했습니다.", "implication": "단순한 Chern 수만으로는 복잡한 3D 위상학적 상태를 완전히 기술할 수 없으며, 모멘텀 공간의 표면 밴드 분포가 핵심적인 역할을 함을 시사합니다.", "novelty": "3D Weyl 반금속 시스템에서 자기장 제어를 통한 수송 현상의 이방성을 상세히 규명하여, 실제 자기 위상 물질의 transport 실험 해석에 중요한 가이드라인을 제공합니다.", "unresolved": "실제 Weyl 물질(예: Co3Sn2S2)에서의 실험적 다단자 홀 전도도 측정 데이터와의 직접적인 비교 및 구체적인 재료적 구현은 아직 과제로 남아 있습니다.", "future_work": "복합적인 자기장 방향을 활용한 장치 제작 및 나노 스케일 수송 측정을 통한 위상 모드 조절 실험이 기대됩니다.", "concepts": [{"term": "Weyl 반금속", "why_emerged": "밴드 구조에서 전도대와 가전도대가 점 접촉을 이루는 위상적 비자명 상태를 기술하기 위해 필요.", "origin": "Wan et al.(2011), experimentally seen in TaAs by Xu et al.(2015).", "connections": "페르미 아크, 이상 홀 효과, 위상학적 반금속."}, {"term": "벌크-표면 대응 원리(Bulk-boundary correspondence)", "why_emerged": "위상학적 벌크 상태가 표면의 전도성 상태와 어떻게 연결되는지 설명하기 위해 도입.", "origin": "Hasan & Kane(2010) Review.", "connections": "위상 절연체, Chern 수, 위상학적 불변량."}], "english_summary": ["Systematically analyzes transport in 3D quantum anomalous Hall systems constructed from coupled Weyl-semimetal Hamiltonians.", "Demonstrates highly anisotropic surface states and chiral modes modulated by magnetic fields along high-symmetry axes.", "Reveals the breakdown of conventional Chern-number-based bulk-boundary correspondence in these 3D systems.", "Validates findings through multi-terminal Hall transport simulations."]}}, {"title": "Quantum and classical transport in the underscreened Kondo lattice", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2611.31093", "authors": "Leo Pintar, Don Rolih, Rok \\v{Z}itko", "last_authors": "Don Rolih, Rok \\v{Z}itko", "summary": "We investigate quantum effects in high-spin Kondo-lattice transport as resistivity approaches the classical spin-disorder limit. Using dynamical mean-field theory and the numerical renormalization group, we calculate resistivity, the Seebeck coefficient, and optical conductivity for the paramagnetic single-channel Kondo lattice away from half filling. At intermediate temperatures, the resistivity for large local spin S S approaches the double-exchange plateau. Thermopower retains a positive quantum excess even where resistivity is nearly classical. The excess arises from the transport kernel’s particle-hole asymmetry. Even the full Kelvin approximation, often accurate for incoherent correlated metals, captures only part of it. Incomplete Kondo screening leaves residual moments and leads to singular Fermi-liquid behavior at low temperatures. For S = 1 tigates transport in the high-spin underscreened Kondo lattice using DMFT and NRG.", "Describes the resistivity behavior as it approaches the classical spin-disorder limit.", "Explains quantum excess in thermopower through particle-hole asymmetry in the transport kernel.", "Confirms that incomplete Kondo screening leads to residual moments and singular Fermi-liquid behavior."]}}, {"title": "Terahertz detection of magnon chirality in polycrystalline CsCuCl3", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2611.30992", "authors": "Juan S. Rodr\\'iguez-Hern\\'andez, Gabriel F. Freitas, Nicolas M. Kawahala, Rafael S. Freitas, Felix G. G. Hernandez", "last_authors": "Rafael S. Freitas, Felix G. G. Hernandez", "summary": "In antiferromagnets, the handedness of magnon precession is usually measured on single crystals. In a pressed pellet of the chiral helimagnet CsCuCl$_3$, whose grains carry both structural handednesses and all orientations, we found that, from 5 to 7 T, the sub-terahertz magnon absorbs one circular polarization more than 20 times as strongly as the other, which rules out precession about each grain's own axis. Spin-wave theory attributes this to the Zeeman frequency, here two to four times the exchange-enhanced gap, which locks the precession axis to the field in every grain. Magnon chirality in antiferromagnets is thus accessible without a single crystal.", "tier": "B_IMPORTANT_CONDMAT", "score": "7", "reason": "Experimental study of magnon chirality and magnetic properties.", "tags": ["magnon", "antiferromagnet", "experiment"], "image": "https://arxiv.org/html/2611.30992v1/fig1.png", "briefing": {"background": "반강자성체(Antiferromagnet)에서의 스핀파(magnon)는 특정한 회전 방향성(chirality)을 가지며, 이는 물질의 자기적 구조와 위상적 성질을 이해하는 데 핵심적인 지표입니다. 기존 연구는 주로 단결정 시료를 사용하여 개별 입자의 기하학적 제약 속에서 측정해 왔습니다.", "motivation": "단결정이 아닌 다결정 시료(pellet)에서도 이러한 스핀파의 회전 방향성을 관측하고, 외부 자기장이 스핀의 세차 운동 축을 고정함으로써 나타나는 거시적인 물리적 특성을 확인하고자 합니다.", "result": "CsCuCl3 다결정 시료에서 5-7T 자기장 조건 하에 테라헤르츠 대역의 스핀파가 특정 원형 편광을 선택적으로 강하게 흡수함을 발견했습니다. 이는 외부 자기장에 의해 각 결정립의 스핀 세차 운동이 외부 자기장 방향으로 정렬(locking)되기 때문임을 입증했습니다.", "implication": "단결정 제작이 어려운 물질에서도 외부 자기장을 활용해 스핀파의 회전 방향성을 손쉽게 측정할 수 있음을 보여주며, 강자성/반강자성체의 스핀트로닉스 연구 도구로서의 가능성을 넓혔습니다.", "novelty": "단결정 시료 없이도 다결정 시료에서 스핀파의 chirality를 특정할 수 있는 실험적 프로토콜을 제시했다는 점이 독창적입니다.", "unresolved": "다결정 내의 결정립 크기나 밀집도에 따른 신호의 균일성 문제, 그리고 자기장 세기가 더 낮은 영역에서의 정렬 거동에 대한 추가 연구가 필요합니다.", "future_work": "다양한 반강자성 재료에 대한 확장 검증 및 스핀-궤도 토크 소자에의 응용 연구가 기대됩니다.", "concepts": [{"term": "Magnon chirality", "why_emerged": "반강자성체 내 스핀 정렬의 역학적 상태와 편광된 빛과의 상호작용을 구분하기 위해 필요합니다.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "스핀파의 원형 편광 흡수율 차이(Magnetic Circular Dichroism)와 직결됨"}, {"term": "CsCuCl3", "why_emerged": "구조적 chiral 나선형 자기 구조를 가진 대표적인 물질로서 스핀파 연구에 필수적입니다.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "헬리마그넷(helimagnet) 연구의 표준 물질"}], "english_summary": ["Experimental demonstration of magnon chirality detection in polycrystalline CsCuCl3 pellets.", "High-field Zeeman energy effectively locks the precession axis of spin waves across grains.", "Successfully rules out local-axis-only precession models via circular dichroism.", "Provides a method to study chiral magnets without requiring single crystals."]}}, {"title": "Twisted light affects ultrafast demagnetization", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2206.07502", "authors": "Eva Prinz, Paul Herrgen, Jonas Hoefer, Benjamin Stadtm\\\"uller, Martin Aeschlimann", "last_authors": "Benjamin Stadtm\\\"uller, Martin Aeschlimann", "summary": "Irradiation with an ultrashort laser pulse can completely destroy the magnetic order of ferromagnetic thin films on the femtosecond timescale. This phenomenon holds great potential for ultrafast spintronics and information processing and is an active field of research. It is still an open question if the angular momentum of light can support this effect. While it has been shown that the spin of light only has a negligible influence, we experimentally demonstrate the influence of photonic orbital angular momentum (OAM) on the magnetization dynamics of a thin nickel film. Our results reveal that the photonic OAM affects the demagnetization behavior by a non-coherent, secondary process within the first hundreds of femtoseconds depending on the handedness of the OAM with respect to the direction of the sample magnetization.", "tier": "B_IMPORTANT_CONDMAT", "score": "7", "reason": "Experimental study of magnetization dynamics; relevant to ultrafast/spintronics interests.", "tags": ["experiment", "magnetism", "ultrafast"], "image": "https://arxiv.org/static/browse/0.3.4/images/arxiv-logo-fb.png", "briefing": {"background": "초고속 레이저 펄스를 이용한 강자성체의 자기 질서 파괴(Ultrafast demagnetization)는 차세대 초고속 스핀트로닉스 구현을 위해 매우 중요한 연구 분야입니다.", "motivation": "광자의 스핀 각운동량의 영향은 무시할 수 있는 수준으로 밝혀졌으나, 궤도 각운동량(OAM)이 박막의 자화 역학에 미치는 직접적인 영향은 규명되지 않았습니다.", "result": "니켈 박막에 OAM을 가진 레이저 펄스를 조사했을 때, 펨토초 단위에서 자화의 감소 속도가 빛의 chirality(OAM 방향)와 샘플의 자화 방향 간의 관계에 따라 다르게 나타남을 실험적으로 증명했습니다.", "implication": "빛의 궤도 각운동량을 제어함으로써 자기 메모리의 스위칭 속도나 효율을 제어할 수 있는 새로운 물리적 자유도를 확보했습니다.", "novelty": "빛의 OAM이 자화 역학에 직접적인 영향을 미치는 비간섭적 이차 공정을 확인하여, 기존 스핀 각운동량 중심의 한계를 넘어섰습니다.", "unresolved": "이러한 OAM 효과가 구체적으로 어떤 미시적 전이 경로(전자-포논, 전자-스핀 등)를 거쳐 일어나는지에 대한 명확한 메커니즘 규명이 필요합니다.", "future_work": "다양한 자성 박막에서의 물질 특이적 반응 연구 및 초고속 스핀 스위칭 소자에의 도입 연구가 예상됩니다.", "concepts": [{"term": "Orbital Angular Momentum (OAM)", "why_emerged": "광자의 공간적 위상 분포가 물질 내 전자의 궤도 모멘트와 어떻게 상호작용하는지 탐구하기 위해 필요합니다.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "트위스티드 빛, 궤도 홀 효과와 연결됨"}, {"term": "Ultrafast demagnetization", "why_emerged": "펨토초 단위에서의 정보 처리 속도 한계를 극복하기 위해 제안된 현상입니다.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "스핀-격자 완화 시간, 자기 재구성 동역학"}], "english_summary": ["Study of photonic orbital angular momentum (OAM) effect on ultrafast demagnetization in Ni films.", "Demonstrates that OAM handedness influences demagnetization dynamics in the first   }
  const headText = document.createElement('div');
  headText.className = 'head-text';
  const badges = document.createElement('div');
  badges.className = 'badges';
  if (r.score) badges.appendChild(textEl('span', 'badge score', `${r.score}/10`));
  if (r.tier) badges.appendChild(textEl('span', 'badge', r.tier));
  if (r.journal) badges.appendChild(textEl('span', 'badge', r.journal));
  if (r.source) badges.appendChild(textEl('span', 'badge', r.source));
  headText.appendChild(badges);
  const title = document.createElement('h1');
  if (r.link) { const titleLink = document.createElement('a'); titleLink.href = r.link; titleLink.target = '_blank'; titleLink.rel = 'noopener noreferrer'; titleLink.textContent = r.title || ''; title.appendChild(titleLink); }
  else { title.textContent = r.title || ''; }
  headText.appendChild(title);
  headText.appendChild(textEl('p', 'meta', [r.journal, r.source].filter(Boolean).join(' | ')));
  if (r.last_authors || r.authors) { const authors = document.createElement('p'); authors.className = 'authors'; if (r.last_authors) authors.append('Last authors: ' + r.last_authors); if (r.authors) authors.append((r.last_authors ? ' | ' : '') + 'Authors: ' + r.authors); headText.appendChild(authors); }
  appendLabeledText(headText, 'why', 'Filter reason: ', r.reason);
  if (r.tags && r.tags.length) { const tags = document.createElement('div'); tags.className = 'tags'; r.tags.forEach(tag => tags.appendChild(textEl('span', 'tag', '#' + tag))); headText.appendChild(tags); }
  if (r.link) { const link = document.createElement('a'); link.className = 'link'; link.href = r.link; link.target = '_blank'; link.rel = 'noopener noreferrer'; link.textContent = 'Open paper'; headText.appendChild(link); }
  head.appendChild(headText);
  if (r.summary) { const abstract = document.createElement('p'); abstract.className = 'original-abstract'; const strong = textEl('strong', '', 'Original abstract'); abstract.appendChild(strong); abstract.append(r.summary); head.appendChild(abstract); }
  slideEl.appendChild(head);
  const briefing = document.createElement('div');
  briefing.className = 'briefing';
  appendBriefSection(briefing, 'Background', b.background);
  appendBriefSection(briefing, 'Motivation', b.motivation);
  appendBriefSection(briefing, 'Result', b.result);
  appendBriefSection(briefing, 'Implication', b.implication);
  appendBriefSection(briefing, "Why it's important / Novelty", b.novelty);
  appendBriefSection(briefing, 'Unresolved Questions', b.unresolved);
  appendBriefSection(briefing, 'Expected Future Work', b.future_work);
  if (b.concepts && b.concepts.length) {
    const section = document.createElement('section');
    section.className = 'brief-section wide';
    section.appendChild(textEl('h2', '', 'Concepts / Terms'));
    const concepts = document.createElement('div');
    concepts.className = 'concepts';
    b.concepts.forEach(c => {
      const item = document.createElement('div');
      item.className = 'concept';
      item.appendChild(textEl('h3', '', c.term || 'Concept'));
      [['왜 생겼나: ', c.why_emerged], ['누가 만들었나: ', c.origin], ['연결되는 흐름: ', c.connections]].forEach(([label, text]) => { if (!text) return; const p = document.createElement('p'); const bold = textEl('b', '', label); p.appendChild(bold); p.append(text); item.appendChild(p); });
      concepts.appendChild(item);
    });
    section.appendChild(concepts);
    briefing.appendChild(section);
  }
  if (b.english_summary && b.english_summary.length) { const section = document.createElement('section'); section.className = 'brief-section wide'; section.appendChild(textEl('h2', '', 'English Summary')); const ul = document.createElement('ul'); b.english_summary.slice(0, 5).forEach(line => ul.appendChild(textEl('li', '', line))); section.appendChild(ul); briefing.appendChild(section); }
  slideEl.appendChild(briefing);
  counterEl.textContent = `${index + 1} / ${slides.length}`;
  prevBtn.disabled = index === 0;
  nextBtn.disabled = index === slides.length - 1;
}
prevBtn.addEventListener('click', () => { index = Math.max(0, index - 1); render(); });
nextBtn.addEventListener('click', () => { index = Math.min(slides.length - 1, index + 1); render(); });
document.addEventListener('keydown', event => { if (event.key === 'ArrowLeft') prevBtn.click(); if (event.key === 'ArrowRight') nextBtn.click(); });
render();
</script>
</body>
</html>
