name: Gemini regression and safe smoke test

"on":
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q
      - run: python -m compileall -q Filter_RSS.py enhance_slides.py run_filter_resilient.py gemini_runtime.py smoke_test_gemini.py restore_checkpoint.py

  synthetic-live-smoke:
    if: github.event_name == 'workflow_dispatch'
    needs: regression
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'
      - run: pip install -r requirements.txt
      # A single synthetic paper only. No feeds, private ranking profile,
      # generated production files, Pages deployment, or email transmission.
      - run: python smoke_test_gemini.py
        env:
          GOOGLE_API_KEY1: ${{ secrets.GOOGLE_API_KEY1 }}
          GOOGLE_API_KEY2: ${{ secrets.GOOGLE_API_KEY2 }}
          GOOGLE_API_KEY3: ${{ secrets.GOOGLE_API_KEY3 }}
          GEMINI_MODELS: ${{ secrets.GEMINI_MODELS }}
          GEMINI_API_VERSION: "v1beta"
          GEMINI_BATCH_SIZE: "1"
