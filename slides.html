<title>Daily Paper Slideshow</title>
<style>
  :root {
    color-scheme: light;
    --bg: #f6f7f4;
    --paper: #ffffff;
    --ink: #111827;
    --muted: #64748b;
    --line: #d8ddd2;
    --accent: #176b87;
    --accent-2: #9a3412;
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; overflow: auto; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: var(--bg); color: var(--ink); }
  .shell { max-width: 1500px; min-height: 100vh; margin: 0 auto; padding: 14px 18px; display: flex; flex-direction: column; }
  .topbar { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 16px; }
  .top-actions { display: flex; align-items: center; gap: 10px; }
  .topbar a, button { border: 1px solid var(--line); border-radius: 8px; background: var(--paper); color: var(--ink); padding: 10px 14px; font-weight: 700; text-decoration: none; cursor: pointer; }
  button.primary { background: var(--accent); border-color: var(--accent); color: white; }
  button:disabled { opacity: 0.45; cursor: not-allowed; }
  .counter { color: var(--muted); font-weight: 700; }
  .slide { min-height: calc(100vh - 82px); background: var(--paper); border: 1px solid var(--line); border-radius: 10px; padding: 18px; box-shadow: 0 18px 42px rgba(15, 23, 42, 0.10); display: grid; grid-template-columns: minmax(310px, 0.86fr) minmax(0, 1.55fr); gap: 18px; overflow: visible; }
  .paper-head { min-width: 0; min-height: 0; overflow: visible; display: flex; flex-direction: column; gap: 12px; }
  .figure { margin: 0; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: #f8fafc; }
  .figure img { display: block; width: 100%; max-height: 41vh; object-fit: contain; background: white; }
  .figure figcaption { padding: 7px 10px; color: var(--muted); font-size: 12px; line-height: 1.3; }
  .head-text { display: flex; flex-direction: column; gap: 9px; min-width: 0; }
  .badges { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .badge { border-radius: 999px; padding: 5px 9px; background: #eef2ff; color: #3730a3; font-size: 12px; font-weight: 800; }
  .score { background: #fee2e2; color: #991b1b; }
  h1 { margin: 0; font-size: 25px; line-height: 1.15; letter-spacing: 0; overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
  h1 a { color: inherit; text-decoration-color: rgba(23, 107, 135, 0.35); text-decoration-thickness: 2px; text-underline-offset: 4px; }
  h1 a:hover { color: var(--accent); text-decoration-color: var(--accent); }
  .meta, .authors, .why, .abstract { font-size: 13px; line-height: 1.45; }
  .meta, .authors { color: var(--muted); }
  .why strong, .abstract strong, .authors strong { color: var(--ink); }
  .authors { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .why { border-left: 4px solid var(--accent-2); padding-left: 10px; color: #374151; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .abstract { border-top: 1px solid var(--line); padding-top: 14px; color: #374151; }
  .original-abstract { border-top: 1px solid var(--line); padding-top: 10px; color: #374151; font-size: 11.5px; line-height: 1.35; overflow-wrap: anywhere; }
  .original-abstract strong { display: block; margin-bottom: 4px; color: var(--ink); }
  .tags { display: flex; flex-wrap: wrap; gap: 8px; }
  .tag { border-radius: 999px; padding: 4px 8px; background: #f1f5f9; color: #475569; font-size: 12px; font-weight: 700; }
  .head-text > .link { display: none; }
  .briefing { min-width: 0; min-height: 0; overflow: visible; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); grid-auto-rows: minmax(0, auto); align-content: start; gap: 11px 18px; border-top: 0; padding-top: 0; }
  .brief-section { min-width: 0; }
  .brief-section.wide { grid-column: 1 / -1; }
  .brief-section h2 { margin: 0 0 4px; font-size: 14px; line-height: 1.22; color: #0f766e; letter-spacing: 0; }
  .brief-section p, .brief-section li { margin: 0; font-size: 12.5px; line-height: 1.42; color: #1f2937; overflow-wrap: anywhere; }
  .brief-section ul { margin: 0; padding-left: 20px; }
  .concepts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 9px 14px; }
  .concept { border-top: 1px solid var(--line); padding-top: 7px; }
  .concept h3 { margin: 0 0 4px; font-size: 13px; color: #7c2d12; letter-spacing: 0; }
  .concept p { margin: 2px 0 0; font-size: 11.5px; line-height: 1.35; color: #374151; overflow-wrap: anywhere; }
  .concept b { color: #111827; }
  .link { color: var(--accent); font-weight: 800; text-decoration: none; }
  .empty { padding: 48px; background: var(--paper); border: 1px solid var(--line); border-radius: 12px; color: var(--muted); }
  @media (max-width: 860px) {
    .shell { padding: 14px; }
    .topbar, .top-actions { align-items: stretch; flex-direction: column; }
    .slide, .briefing, .concepts { grid-template-columns: 1fr; }
    .slide { min-height: auto; overflow: visible; display: grid; }
    h1 { font-size: 28px; }
  }
</style>

<script>
const slides = [{"title": "Interplay between charge correlations and superconductivity across the superconducting domes of CsV3Sb(5−x)Snx", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/bcqw-7lsf", "authors": "Andrea N. Capa Salinas, Steven J. Gomez Alvarado, Brenden R. Ortiz, et al.", "last_authors": "Turan Birol, Stephen D. Wilson", "summary": "The kagome metal ${\\mathrm{CsV}}_{3}{\\mathrm{Sb}}_{5}$ hosts an anomalous interplay between charge density wave (CDW) order and superconductivity—one where tuning its band filling by adding holes rapidly suppresses long-range CDW order and drives the formation of two unusual superconducting “domes.”…", "tier": "A_MUST_READ", "score": "10", "reason": "Direct investigation of Sn-doped CsV3Sb5 kagome metal, focusing on the CDW and superconductivity interplay.", "tags": ["experiment", "kagomemetal", "chargedensitywave"], "image": "", "briefing": {"background": "Kagome 금속 CsV3Sb5는 전하 밀도 파(CDW)와 초전도성이 공존하며 나타나는 독특한 전자 구조로 인해 응집물질물리학의 주요 연구 대상입니다.", "motivation": "Sn 도핑을 통해 캐리어 농도를 제어함으로써, CDW 차수와 두 개의 초전도 돔 사이의 상호작용 및 경쟁 관계를 실험적으로 규명하고자 했습니다.", "result": "Sn 치환을 통해 밴드 필링을 조절하면 장거리 CDW 질서가 빠르게 억제되고, 이 과정에서 초전도 돔이 형성되는 비정상적인 거동을 확인했습니다.", "implication": "CsV3Sb5 계열의 상전이 메커니즘을 이해하고, 전자 상관관계가 초전도성에 미치는 영향을 명확히 함으로써 위상적 초전도체 후보군 연구에 기여합니다.", "novelty": "화학적 치환을 통한 전자 구조 튜닝이 어떻게 CDW와 초전도성의 경쟁을 조정하는지 직접적으로 보여주며, 독자 연구 분야인 kagome 금속 내 초전도 기원 규명에 필수적입니다.", "unresolved": "두 개의 초전도 돔 내부에서 초전도 대칭성(symmetry)이나 파동함수의 성질이 어떻게 변화하는지에 대한 구체적인 정보는 부족합니다.", "future_work": "저온 환경에서의 고분해능 ARPES나 STS 측정을 통해 각 돔에서의 초전도 갭 구조 및 위상적 특성을 상세히 조사해야 합니다.", "concepts": [{"term": "Kagome Metal", "why_emerged": "기하학적 좌절(frustration)이 존재하는 격자 구조에서 나타나는 평탄한 밴드(flat band)와 디락 포인트의 물성을 연구하기 위함입니다.", "origin": "초기에는 kagome 격자 모델 이론에서 출발했으며, 이후 CsV3Sb5와 같은 실제 물질 발견으로 실증되었습니다.", "connections": "위상 절연체, 비상식적 홀 효과, CDW 질서와 밀접한 관련이 있습니다."}, {"term": "Charge Density Wave (CDW)", "why_emerged": "전자와 격자 간의 상호작용으로 인해 전자 밀도가 주기적으로 변조되는 기저 상태를 설명하기 위해 등장했습니다.", "origin": "Peierls(1955)가 1차원 금속 체인에서 이론적으로 예견했습니다.", "connections": "초전도성과의 경쟁, 위상적 상태와의 결합 등 강상관계 시스템의 핵심 주제입니다."}], "english_summary": ["CsV3Sb5 is a key kagome metal exhibiting an anomalous interplay between CDW and superconductivity.", "Sn-doping is utilized as a tuning parameter for band filling to suppress the CDW order.", "The study maps the evolution of superconducting domes as a function of chemical doping.", "This work provides insights into the competing ground states in correlated kagome systems."]}}, {"title": "Orbital differentiation enhanced by structural modification in Pr4Ni3O10", "journal": "PRB_Recent", "source": "author whitelist", "link": "http://link.aps.org/doi/10.1103/rth1-28lc", "authors": "Yidian Li, Mingxin Zhang, Xian Du, et al.", "last_authors": "Yanpeng Qi, Lexian Yang", "summary": "Trilayer nickelates provide a tunable platform for investigating the interplay between structural geometry, electron correlation, and unconventional superconductivity. By directly comparing Pr 4 Ni 3 O 10 and La 4 Ni 3 O 10 , this work uncovers an orbital differentiation enhanced by structural modification in Pr 4 Ni 3 O 10 , where orbitals become selectively incoherent and significantly renormalized, while orbitals remain coherent. This dichotomy leads to a marked suppression of interorbital hybridization in Pr 4 Ni 3 O 10 . This work suggests that the interlayer bonding angle serves as an active tuning parameter for the electronic properties, bridging multiorbital correlated physics and superconductivity in nickelates.", "tier": "A_MUST_READ", "score": "9", "reason": "author whitelist: Makoto Hashimoto", "tags": ["STS", "unconventionalsuperconductivity", "nickelate", "superconduct", "correlated"], "image": "", "briefing": {"background": "삼중층 니켈 산화물(Trilayer nickelates)은 구리 산화물 초전도체와 유사한 물성을 가지면서 구조적 자유도가 높아 강상관계 초전도체 연구의 플랫폼으로 주목받고 있습니다.", "motivation": "Pr4Ni3O10과 La4Ni3O10의 구조적 차이가 전자 상관관계와 궤도 결맞음(coherence)에 어떤 차이를 만드는지 비교 연구하 l response serves as a direct probe of the underlying topological and magnetic state changes.", "The work highlights the potential for optical manipulation and detection of topological phases."]}}, {"title": "Exploring nontrivial band structure, Berry curvature, spin polarizations, and spin currents in d-wave altermagnets tailored by anisotropic optical fields", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/zp5c-vpd9", "authors": "Andrii Iurov, Liubov Zhemchuzhna, Tiyhearah Danner-Jackson", "last_authors": "Liubov Zhemchuzhna, Tiyhearah Danner-Jackson", "summary": "This paper presents a detailed theoretical investigation of the energy spectrum, band gaps, topological and collective properties, and linear response in $d$-wave altermagnets in the presence of an off-resonance optical dressing field. We consider the altermagnets with both ${d}_{{x}^{2}−{y}^{2}}$ a…", "tier": "B_IMPORTANT_CONDMAT", "score": "9", "reason": "Directly addresses altermagnetism, band structure, and Berry curvature, all high-priority interests.", "tags": ["theory", "altermagnetism", "Berrycurvature"], "image": "", "briefing": {"background": "알터자성(Altermagnetism)은 최근 강자성이나 반강자성과는 다른 새로운 자기적 질서로 주목받고 있으며, 역전 대칭성이 깨진 비자기적 상태와 강한 스핀 분할(spin splitting)을 특징으로 합니다.", "motivation": "광학적 드레싱 필드를 사용하여 d-파 알터자성체의 밴드 구조, 베리 곡률, 그리고 스핀 전류를 제어하고 비자명한 위상 물성을 유도하고자 함.", "result": "외부 광학 필드에 의해 d-파 알터자성체의 밴드 갭과 스핀 분극이 수정될 수 있으며, 이를 통해 베리 곡률과 스핀 수송 특성을 효율적으로 조절할 수 있음을 이론적으로 증명.", "implication": "빛을 이용한 플로케(Floquet) 공학을 알터자성체에 적용하여 새로운 형태의 토폴로지 제어와 스핀트로닉스 소자 응용이 가능함을 시사.", "novelty": "알터자성체라는 새로운 물질 군에 광학적 드레싱을 결합하여, 물질 고유의 스핀-궤도 상호작용 없이도 위상 물성을 설계할 수 있는 이론적 틀을 제공함.", "unresolved": "실제 실험적 구현을 위한 레이저 강도와 주파수 조건에서의 물질 안정성 및 실질적인 스핀 전류 측정의 난이도.", "future_work": "광학적 제어를 통한 실제 d-파 알터자성체에서의 비정상 홀 효과 측정 및 ARPES를 통한 밴드 구조 변조 관측.", "concepts": [{"term": "알터자성 (Altermagnetism)", "why_emerged": "반강자성이면서도 스핀 분할이 일어나는 새로운 자기 질서를 설명하기 위해 등장.", "origin": "최근 2020년대 초반 이론적 정립(Jungwirth 그룹 등).", "connections": "반강자성, 스핀 분할, 비정상 홀 효과."}, {"term": "베리 곡률 (Berry Curvature)", "why_emerged": "고체 내 전자의 양자 역학적 위상 구조를 이해하기 위한 핵심 파라미터.", "origin": "Michael Berry (1984).", "connections": "Anomalous Hall effect, Weyl semimetal, Topological insulators."}, {"term": "광학적 드레싱 (Optical Dressing)", "why_emerged": "빛의 전기장 성분을 이용하여 물질의 해밀토니안을 직접 변조하기 위해 사용.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "Floquet engineering, coherent state control."}], "english_summary": ["The paper investigates the band structure and topological properties of d-wave altermagnets.", "An off-resonance optical dressing field is applied to modulate spin polarization and Berry curvature.", "Theoretical results show that light fields can effectively tune the collective and transport properties.", "The findings offer a strategy for Floquet engineering in newly discovered altermagnetic materials."]}}, {"title": "Chiral Charge Density Waves in Transition Metal Dichalcogenide", "journal": "PRL_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/5vkg-zvhv", "authors": "Ettore Carpene", "last_authors": "Ettore Carpene", "summary": "The emergence of chirality in the charge density wave (CDW) phase of 1 T − TiSe 2 has recently attracted significant attention, yet its microscopic origin remains debated. The prevailing interpretation attributes chirality to a relative phase shift between the charge density components. Here, using density functional theory and symmetry analysis, it is demonstrated that such phase-shifted states entail prohibitive energy costs, rendering them unlikely candidates for the ground state. Instead, a nearly degenerate metastable CDW phase stacking order with monoclinic symmetry is identified that naturally breaks mirror and inversion symmetries. The CDW in 1 T − TiSe 2 possesses a dual physical nature: The electronic charge redistribution is intrinsically bond modulated, while the periodic lattice distortion is atom-centered transverse. This spatial separation allows a specific optical coupling mechanism where circularly polarized light breaks the energetic degeneracy between chiral domains. These results reconcile conflicting experimental observations, identifying the “spontaneous” chirality observed in local probes as a statistical distribution of CDW phase stacking domains while establishing the mechanism for macroscopic, light-induced gyrotropic order.", "tier": "B_IMPORTANT_CONDMAT", "score": "9", "reason": "Highly relevant study of chiral CDW origin in 1T-TiSe2, central to electronic order interests.", "tags": ["material", "CDW", "chirality"], "image": "", "briefing": {"background": "전이금속 디칼코게나이드(TMD)에서의 전하 밀도 파(CDW)는 물질의 전자 구조와 격자 왜곡이 결합된 현상으로, 최근 1T-TiSe2와 같은 물질에서 관측되는 '카이랄성(Chirality)'의 기원이 논란의 중심이었습니다.", "motivation": "1T-TiSe2에서 관측되는 CDW의 카이랄성이 과연 순수한 전자 상태의 위상 이동인가, 아니면 격자 왜곡의 기하학적 분포인가를 규명하고자 함.", "result": "상대적인 위상 이동 모델은 에너지 비용이 너무 크며, 오히려 monoclinic 대칭성을 가진 메타스테이블한 격자 적층 순서가 카이랄성을 유발한다는 사실을 발견. 즉, 관측되는 카이랄성은 국소적 도메인의 통계적 분포임.", "implication": "CDW의 카이랄성은 단순한 전자적 위상 문제가 아니라, 격자 구조와 전자 전하 재분배가 결합된 복합적인 현상임을 명확히 함.", "novelty": "기존의 상반된 실험 결과를 통합하는 새로운 모델을 제시하였으며, circularly polarized light를 이용한 카이랄 도메인 제어 기전을 확립하여 차세대 광 스위칭 소자 연구에 기여.", "unresolved": "실제 단일 결정 샘플에서 나타나는 도메인 경계의 동역학적 특성과 거시적 gyrotropy의 온도 의존성.", "future_work": "시간 분해 광학 실험을 통해 CDW 도메인의 광학적 재배열 과정을 직접 관찰.", "concepts": [{"term": "전하 밀도 파 (CDW)", "why_emerged": "페르미 표면의 nesting을 통해 전자 밀도가 공간적으로 주기성을 갖게 되는 현상을 기술.", "origin": "Peierls instability (1955).", "connections": "Superconductivity, 1T-TiSe2, lattice distortion."}, {"term": "카이랄성 (Chirality)", "why_emerged": "거울상 대칭성이 깨져 오른손/왼손 방향성이 물질의 물성을 지배하는 현상을 기술.", "origin": "Kelvin (1884)이 도입, 고체물리학 전반에서 보편적.", "connections": "Berry phase, topological transport, gyrotropy."}], "english_summary": ["The origin of chirality in the CDW phase of 1T-TiSe2 is investigated using DFT and symmetry analysis.", "Phase-shifted electronic states are ruled out due to high energy costs.", "The study identifies monoclinic stacking of CDW phases as the natural origin of symmetry breaking.", "Light-induced control of chiral domains is proposed, reconciling previous experimental conflicts."]}}, {"title": "Contactless Cavity Sensing of Superfluid Stiffness in Atomically Thin 4Hb−TaS2", "journal": "PRL_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/p6wt-2dkx", "authors": "Trevor Chistolini, Ha-Leem Kim, Qiyu Wang, et al.", "last_authors": "Irfan Siddiqi, Feng Wang", "summary": "A key property of superconductors called superfluid stiffness can now be measured in a wide range of 2D systems.", "tier": "B_IMPORTANT_CONDMAT", "score": "9", "reason": "Strong interest in TaS2 polytypes, superconductivity, and 2D materials.", "tags": ["experiment", "TaS2", "superconductivity"], "image": "", "briefing": {"background": "원자층 두께의 2차원 초전도체에서 초전도 특성을 정밀하게 측정하는 것은 소자의 물리적 성질과 위상적 전이 현상을 이해하는 데 핵심적입니다.", "motivation": "기존의 접촉식 측정 방식은 얇은 시료에 손상을 주거나 기생 효과를 유발할 수 있어, 비접촉식 방식으로 4Hb-TaS2의 초전도 강성(superfluid stiffness)을 측정하고자 함.", "result": "공진기(cavity)를 이용한 비접촉식 감지 기술을 통해 원자층 수준의 TaS2에서 초전도 강성을 성공적으로 정량화함.", "implication": "다양한 2차원 물질 및 헤테로구조에서 물질 손상 없이 초전도 물성을 탐구할 수 있는 새로운 실험 플랫폼을 제시함.", "novelty": "원자 단위의 얇은 층에서 전극 접촉 없이 초전도성을 검증할 수 있어, 차세대 2D 소자 연구에 필수적인 분석 툴이 될 것으로 기대됨.", "unresolved": "TaS2의 복잡한 다형체 중 4Hb 상에서 나타나는 초전도와 전하밀도파(CDW) 사이의 구체적인 미시적 상관관계는 추가 연구가 필요함.", "future_work": "다양한 2D 층상 물질 및 헤테로구조에 적용하여 위상 초전도체 후보군 탐색에 활용할 계획.", "concepts": [{"term": "Superfluid Stiffness", "why_emerged": "초전도체에서 쿠퍼 쌍의 응집 정도와 위상적 안정성을 정의하기 위해 필요.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "Berezinskii-Kosterlitz-Thouless 전이, 초전도 응답 함수."}, {"term": "4Hb-TaS2", "why_emerged": "1T와 1H 구조가 교차 적층된 다형체로, 초전도와 CDW의 공존 현상 연구를 위해 부상.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "Transition Metal Dichalcogenides (TMDs), 2D 초전도성."}], "english_summary": ["Developed a non-contact cavity sensing method for 2D superconductors.", "Successfully measured superfluid stiffness in atomical ctures is crucial for practical implement…", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Investigates topological spin textures in a kagome lattice; highly relevant to the user's kagome metal focus.", "tags": ["theory", "kagome", "skyrmions"], "image": "", "briefing": {"background": "카고메 격자 구조는 기하학적 좌절(frustration)과 위상학적 밴드 구조를 동시에 제공하여 독특한 자기적 위상 상태를 연구하는 데 핵심적인 플랫폼입니다.", "motivation": "카고메 격자에서 스커미온과 안티스커미온과 같은 위상학적 스핀 텍스처를 기계적 변형(strain)을 통해 제어하고 이들 사이의 전이를 유도하고자 함.", "result": "기계적 변형을 통해 카고메 격자 내의 스커미온 및 안티스커미온 유체의 안정성과 밀도를 가역적으로 조절할 수 있음을 확인.", "implication": "카고메 금속 기반 소자에서 스핀 위상 구조를 실시간으로 제어할 수 있는 새로운 경로를 제시함.", "novelty": "카고메 격자에서 스커미온-안티스커미온 간의 자유로운 전이를 스트레인이라는 물리적 변수로 제어했다는 점이 본 연구의 핵심.", "unresolved": "실제 실험 환경에서의 스트레인 인가 방식과 해당 물질의 구체적인 자기적 상전이 경계면에 대한 추가 분석 필요.", "future_work": "실험적인 카고메 자성체에서 스트레인을 이용한 스핀 텍스처 변화 확인 및 이를 이용한 정보 저장 소자 설계.", "concepts": [{"term": "카고메 격자 (Kagome Lattice)", "why_emerged": "전자의 강력한 기하학적 좌절과 위상학적 비평범성을 동시에 연구하기 위한 격자 구조.", "origin": "일본의 바구니 짜기 패턴에서 유래, 응집물질물리학에서 널리 차용.", "connections": "Dirac 금속, 비전통적 초전도, 양자 스핀 액체."}, {"term": "스커미온/안티스커미온 (Skyrmion/Antiskyrmion)", "why_emerged": "낮은 전력으로 정보를 전달할 수 있는 위상학적으로 안정된 스핀 소용돌이 구조가 필요함.", "origin": "Tony Skyrme(이론 제안), 2000년대 후반 실험적으로 관측.", "connections": "위상 절연체, Dzyaloshinskii-Moriya 상호작용."}], "english_summary": ["This paper investigates the manipulation of topological spin textures in kagome lattices.", "Mechanical strain is shown to tune the stability of skyrmion and antiskyrmion fluids.", "The findings offer a method to control magnetic topological transitions.", "Relevant for designing kagome-based spintronic devices."]}}, {"title": "μSR study of time-reversal symmetry constraints and bulk superfluid response in Li0.95FeAs", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/zlzx-qty2", "authors": "Rustem Khasanov, Hubertus Luetkens, Nikolai D. Zhigadlo", "last_authors": "Hubertus Luetkens, Nikolai D. Zhigadlo", "summary": "Here, the authors use zero- and transverse-field muon-spin rotation/relaxation to probe multiband, multigap superconductivity in Li 0 . 95 FeAs, a representative 111-family Fe-based superconductor. They find no detectable time-reversal-symmetry breaking and a bulk superfluid response consistent with nodeless superconductivity. By comparing the measured superfluid density with band weights derived from published photoemission studies, they show that sheets carrying intermediate and small gaps dominate, while the largest-gap sheet contributes only weakly, reconciling gap scales reported by bulk- and surface-sensitive probes.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Iron-based superconductor study directly comparing bulk results to ARPES-derived band weights.", "tags": ["experiment", "superconductivity", "Fe-basedsuperconductors"], "image": "", "briefing": {"background": "철 기반 초전도체(Fe-based superconductors, 111 계열)는 다중 밴드 및 다중 갭 구조를 가지며, 시간 반전 대칭성 깨짐 여부가 초전도 메커니즘을 이해하는 데 매우 중요합니다.", "motivation": "LiFeAs의 초전도 갭 구조가 벌크 물성과 표면(ARPES) 측정 결과 간에 보이는 괴리를 해결하기 위해 벌크 민감 프로브인 μSR을 활용.", "result": "Li0.95FeAs에서 시간 반전 대칭성 깨짐은 관측되지 않았으며, 초전도 갭은 노드(node)가 없는 형태임이 확인됨. ARPES 데이터와의 비교를 통해 작은 갭과 중간 크기 갭이 초전도 응답을 지배함.", "implication": "표면 민감 프로브인 ARPES와 벌크 민감 프로브인 μSR 사이의 데이터를 밴드 가중치 비교로 일관성 있게 설명함.", "novelty": "기존에 논란이 되었던 갭 규모 차이를 밴드 구조 기여도 관점에서 명쾌하게 분석하여 111계열 철 초전도체의 물성을 정립함.", "unresolved": "가장 큰 갭을 가진 밴드가 초전도성에 미치는 기여도가 왜 낮은지에 대한 미시적 원리는 여전히 추가적인 이론 연구가 필요함.", "future_work": "다른 철 기반 초전도 물질에 대한 유사한 다중 프로브 통합 분석 및 이론적 밴드 가중치 검증.", "concepts": [{"term": "μSR (Muon-Spin Rotation/Relaxation)", "why_emerged": "물질 내부의 미세 자기장을 비침습적으로 측정하여 자기 정렬 및 초전도 현상을 정밀하게 분석하기 위해 등장.", "origin": "1940-50년대 뮤온 발견 이후, 1970년대 이후 본격적인 고체 물리 실험 기법으로 정착.", "connections": "NMR, 중성자 산란(Neutron scattering)."}, {"term": "다중 밴드/다중 갭 (Multiband/Multigap)", "why_emerged": "철 기반 초전도체와 같이 페르미 면이 복잡하게 얽힌 물질에서 각 페르미 포켓마다 서로 다른 초전도 쌍 형성 강도를 이해하기 위해 필요.", "origin": "철 기반 초전도체 발견(2008년) 이후 본격적으로 연구됨.", "connections": "BCS 이론, Eliashberg 이론."}], "english_summary": ["Study of Li0.95FeAs using zero- and transverse-field muon-spin rotation.", "No evidence for time-reversal symmetry breaking was detected.", "The bulk superfluid density is governed by small and intermediate gap bands.", "This reconciles differences between surface-sensitive ARPES and bulk probes."]}}, {"title": "Emergence of Charge-4e Superconductivity from 2D Nematic Superconductors", "journal": "PRL_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/j7nh-jzdd", "authors": "Xuan Zou, Zhou-Quan Wan, Hong Yao", "last_authors": "Zhou-Quan Wan, Hong Yao", "summary": "Charge-$4e$ superconductivity is an exotic state of matter that may emerge as a vestigial order from a charge-$2e$ superconductor with multicomponent superconducting order parameters. Showing its emergence in a lattice phase model from numerically exact large-scale computations has remained rare. He…", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Connects nematicity and unconventional superconductivity, core areas of user interest.", "tags": ["theory", "material", "nematicity"], "image": "", "briefing": {"background": "전통적인 초전도체는 전자쌍(Cooper pair, 2e)의 응축 현상입니다. 최근 응축물질물리학에서는 이보다 높은 전하를 띠는 입자(4e 등)가 응축된 '차지-4e' 초전도 상태가 이론적으로 예견되었으며, 이는 다성분 초전도 질서 매개변수 사이의 위상적 요동에서 기인합니다.", "motivation": "Charge-4e 초전도체가 다성분 초전도체에서 파생된 잔여 질서(vestigial order)로 나타날 수 있다는 가설을 격자 모델 기반의 대규모 수치 계산을 통해 명확히 입증하고자 함.", "result": "2D 네마틱 초전도체 모델에서 차지-4e 초전도 상태가 실제로 발현됨을 수치적으로 확인하였습니다.", "implication": "다성분 초전도체에서 나타나는 네마틱 상태와 차지-4e 초전도 상태 간의 깊은 상관관계를 규명하였으며, 이는 향후 고온 초전도체나 무아레 계에서의 이색적인 초전도 상태 연구에 이론적 토대가 됩니다.", "novelty": "기존의 추측에 머물렀던 현상을 대규모 수치 계산을 통해 직접적으로 관측 가능성을 제시했다는 점에서 이론물리학적으로 매우 의미가 큽니다.", "unresolved": "실제 고체 물질에서 이 상태를 실험적으로 어떻게 제어하고 측정할 수 있을지에 대한 구체적인 물질 후보군 제시는 부족합니다.", "future_work": "차지-4e 초전도성을 검증할 수 있는 실험적 시그니처(예: Josephson 터널링 등) 연구 및 실제 물질 기반의 현실적인 Hamiltonian 모델링이 필요합니다.", "concepts": [{"term": "Charge-4e Superconductivity", "why_emerged": "기존 2e 초전도체 외에 고차의 전하 응축 상태가 존재할 수 있다는 이론적 가능성 탐구.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "BEC-BCS crossover, 다성분 초전도체, 네마틱 질서."}, {"term": "Nematic Superconductor", "why_emerged": "초전도 질서 매개변수가 회전 대칭성을 자발적으로 깨뜨리는 현상을 설명하기 위해.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "Fe-계 초전도체, 고온 초전도체에서의 nematicity."}], "english_summary": ["Charge-4e superconductivity is investigated as a vestigial order in 2D nematic superconductors.", "Large-scale numerical simulations on a lattice model confirm the emergence of this exotic state.", "The study establishes a theoretical link between multicomponent superconducting order parameters and higher-charge condensation."]}}, {"title": "Emergent Electronic Insulating States in a One-Dimensional Moiré Superlattice", "journal": "PRL_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/h1q6-rc95", "authors": "Jianfeng Bi, Masaki Minamikawa, Ruige Dong, et al.", "last_authors": "Mikito Koshino, Sihan Zhao", "summary": "Two-dimensional van der Waals (vdW) moiré superlattices have provided a powerful knob to engineer a plethora of new quantum states. However, extending such moiré engineering to one-dimensional (1D) vdW systems has remained challenging. Here, we report the creation of moiré-engineered electronic insu…", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Significant development in 1D moiré engineering and electronic insulating states.", "tags": ["material", "moiré", "vanderWaals"], "image": "", "briefing": {"background": "2D 무아레 시스템은 층간 뒤틀림을 통해 전자 구조를 제어하여 상관관계 물리(Mott 절연체, 초전도 등)를 탐구하는 강력한 도구입니다. 최근에는 이를 1D 시스템으로 확장하려는 시도가 활발합니다.", "motivation": "2D에서 성공적인 무아레 엔지니어링을 1D 반데르발스 시스템으로 확장하여, 저차원에서의 새로운 절연 상태를 구현하고자 함.", "result": "1D 반데르발스 물질에서 무아레 패턴을 설계하고 이를 통해 새로운 전자적 절연 상태를 보고함.", "implication": "1D 계에서의 무아레 엔지니어링이 가능함을 입증하였으며, 이는 저차원 상관관계 전자계 연구의 새로운 플랫폼을 제시합니다.", "novelty": "2D에 집중되었던 무아레 연구를 1D로 성공적으로 확장했다는 점이 혁신적이며, 1D Luttinger liquid나 관련 상관관계 연구와 연결될 잠재력이 큼.", "unresolved": "관측된 절연 상태가 순수하게 무아레 전위로 인한 것인지, 아니면 다른 구조적 결함과의 복합적인 결과인지 명확한 구분 필요.", "future_work": "1D 무아레 시스템에서의 도핑 제어 및 정밀한 전달 측정(transport measurement)을 통한 상전이 특성 연구.", "concepts": [{"term": "Moiré Superlattice", "why_emerged": "2D 물질을 겹쳐 격자 상수를 크게 늘림으로써 좁은 에너지 밴드를 유도하여 강한 상관관계를 유도하기 위해.", "origin": "Lanzhou(2018) 등에 의한 Twisted Bilayer Graphene 연구가 시발점.", "connections": "Twisted bilayer graphene, flat bands."}, {"term": "1D van der Waals system", "why_emerged": "1D 한계에서의 전자적 자유도와 양자 상전이를 연구하기 위해.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "Luttinger liquid, spin-charge separation."}], "english_summary": ["Moiré engineering is successfully extended from 2D to 1D van der Waals materials.", "The study demonstrates the creation of emergent electronic insulating states in these 1D moiré superlattices.", "This approach provides a new platform to study quantum states in one-dimensional systems."]}}, {"title": "Highly Anisotropic Charge Dynamics and Spectral Weight Redistribution in the Trilayer Nickelate La4Ni3O10", "journal": "PRL_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/5j5t-sfnc", "authors": "Zhe Liu, Jie Li, Deyuan Hu, et al.", "last_authors": "Meng Wang, Hai-Hu Wen", "summary": "We study the $ab$-plane and $c$-axis charge dynamics of ${\\mathrm{La}}_{4}{\\text{Ni}}_{3}{\\mathrm{O}}_{10}$ using optical spectroscopy. While a pronounced Drude profile, i.e., metallic response, is observed in the $ab$-plane optical conductivity ${σ}_{1}^{ab}(ω)$, the $c$-axis optical spectra ${σ}_{…", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Experimental optical spectroscopy on trilayer nickelate, highly relevant for unconventional superconductivity.", "tags": ["material:nickelate", "unconventionalsuperconductivity", "spectroscopy:optical", "stronglycorrelated"], "image": "", "briefing": {"background": "니켈산염은 구리산염(cuprate)과 유사한 전자 구조를 가져 고온 초전도체의 후보 물질로 주목받고 있습니다. La4Ni3O10은 층상 구조를 가진 삼중층 니켈산염으로, 금속-비금속 전이와 전하 역학 연구가 활발합니다.", "motivation": "La4Ni3O10의 전하 역학이 공간적으로 어떤 이방성을 가지는지, 그리고 에너지 분산에 따른 스펙트럼 가중치 재분배 특성을 분석하고자 함.", "result": "ab-평면에서는 금속성 Drude 응답이 뚜렷하나, c-축 방향으로는 전하 역학이 크게 다르며 강한 이방성을 보임을 확인.", "implication": "삼중층 니켈산염의 전자 상관관계가 2차원적 평면과 층간 방향에서 확연히 다르게 작용함을 시사하며, 이는 초전도 메커니즘 규명에 핵심적인 단서가 될 것.", "novelty": "광학 분광법을 통해 La4Ni3O10의 층간 결합 성질과 금속성 응답의 이방성을 직접적으로 측정하여 니켈산염 초전도성 연구의 토대를 강화함.", "unresolved": "이러한 이방성이 전자 상관관계와 격자 왜곡 중 어느 것에 더 큰 기여를 받는지에 대한 미시적 원인은 추가 연구 필요.", "future_work": "온도 변화에 따른 스펙트럼 가중치 이동 관측 및 특정 도핑 수준에서의 전자 구조 변화 분석.", "concepts": [{"term": "Optical Spectroscopy", "why_emerged": "물질의 전하 역학 및 밴드 구조를 비파괴적으로 분석하기 위해.", "origin": "Maxwell의 전자기학 기반, 고체물리 응용은 20세기 중반 확립.", "connections": "Drude model, reflectivity, optical conductivity."}, {"term": "Nickelate Superconductivity", "why_emerged": "Cuprate와 유사한 d-전자 시스템에서 고온 초전도성을 찾기 위한 노력의 일환.", "origin": "Li et al. (2019)의 NdNiO2 발견이 결정적.", "connections": "Cuprate, strongly correlated electrons."}], "english_summary": ["Optical spectroscopy analysis of the trilayer nickelate La4Ni3O10 reveals highly anisotropic charge dynamics.", "While the ab-plane exhibits clear metallic Drude behavior, c-axis spectra show distinct redistribution.", "These findings provide insights into the electronic dimensionality and correlations in multilayer nickelates."]}}, {"title": "Magnetic-Field-Tunable Repulsive Exciton-Exciton Interaction in the van der Waals Antiferromagnet NiPS3", "journal": "PRL_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/jl7j-g835", "authors": "Kaiyang Huang, Jaena Park, Zhuo Yang, et al.", "last_authors": "Yoshimitsu Kohama, Yasuhiro H. Matsuda", "summary": "Two ultranarrow absorption peaks around 1.5 eV, which are widely believed to originate from a transition from a spin-orbital entangled triplet to a singlet state, in the two-dimensional van der Waals crystal ${\\mathrm{NiPS}}_{3}$, have attracted considerable attention because of their pronounced spi…", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Study of van der Waals magnetic material with strong electronic correlations.", "tags": ["experiment", "NiPS3", "van-der-waals"], "image": "", "briefing": {"background": "NiPS3는 2D 반데르발스 반강자성체로, 강한 전자 상관관계와 스핀-궤도 얽힘이 공존하는 독특한 전자 구조를 가지고 있습니다. 이러한 물질에서 나타나는 엑시톤은 스핀 및 궤도 자유도와 밀접하게 연관되어 있어, 차세대 스핀트로닉스 및 광학 소자 연구의 핵심 모델 시스템으로 주목받고 있습니다.", "motivation": "NiPS3의 1.5 eV 대역에서 관찰되는 초미세 흡수 피크는 스핀-궤도 얽힘 상태를 반영합니다. 본 연구는 외부 자기장을 통해 이러한 엑시톤 간의 상호작용을 제어하고, 자기적 정렬과 엑시톤 동역학 사이의 미시적 상관관계를 규명하고자 합니다.", "result": "외부 자기장을 인가했을 때 엑시톤 간의 척력(repulsive interaction)이 조절됨을 확인했습니다. 이는 자기장 변화가 물질 내부의 자기적 구조와 엑시톤의 결합 상태를 직접적으로 변조할 수 있음을 실험적으로 증명한 것입니다.", "implication": "반데르발스 자기체에서 엑시톤을 자기적으로 제어할 수 있는 가능성을 열었으며, 이는 향후 2D 자성 물질 기반의 엑시톤-스핀 제어 소자 설계에 중요한 물리적 토대를 제공합니다.", "novelty": "외부 자기장을 이용해 엑시톤 간 상호작용을 튜닝했다는 점이 핵심이며, NiPS3와 같은 강상관 2D 물질에서 엑시톤 물성을 조절하는 새로운 경로를 제시했습니다.", "unresolved": "자기장 하에서의 구체적인 스핀-궤도 얽힘 변화가 엑시톤의 결합 에너지를 미시적으로 어떻게 변조하는지에 대한 이론적 모델링이 보완되어야 합니다.", "future_work": "시간 분해 분광법을 통한 엑시톤 동역학 관찰 및 자기장 하에서의 광학적 비선형성 측정 연구가 뒤따를 것으로 예상됩니다.", "concepts": [{"term": "반데르발스 반강자성체", "why_emerged": "층상 구조를 유지하며 자성을 띠는 2D 물질의 물리적 특성을 탐구하기 위해 필요.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "2D 자성, 스핀-궤도 결합"}, {"term": "스핀-궤도 얽힘 상태", "why_emerged": "Ni 기반 물질에서 스핀과 궤도 자유도가 분리되지 않고 하나의 양자 상태로 거동함을 설명하기 위해.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "Mott 절연체, 다체 물리"}], "english_summary": ["NiPS3 is a 2D van der Waals antiferromagnet featuring spin-orbital entangled excitonic states.", "The study investigates the tunability of exciton-exciton interactions using external magnetic fields.", "Results show magnetic-field-dependent repulsive interactions, highlighting the link between magnetic order and exciton dynamics.", "This work provides a framework for controlling excitonic properties in correlated 2D magnetic materials."]}}, {"title": "Pearl-Vortex Tunneling in Magic-Angle Twisted Graphene", "journal": "PRL_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/1vnb-k7zd", "authors": "Marta Perego, Peter Koopmann, Clara Galante Agero, et al.", "last_authors": "Thomas Ihn, Klaus Ensslin", "summary": "A Josephson junction acts as a single-vortex sensor, enabling the detection of the dynamics of individual Pearl vortices in magic-angle twisted graphene.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Direct interest in twisted bilayer graphene and vortex dynamics in moire superconductors.", "tags": ["experiment", "graphene", "moire"], "image": "", "briefing": {"background": "마법 각도 뒤틀린 이중층 그래핀(MATTG)은 평탄 밴드 구조에서 초전도성을 포함한 다양한 강상관 물리 현상을 나타냅니다. 이러한 초전도체 내의 소용돌이(vortex) 동역학을 이해하는 것은 고온 및 unconventional 초전도체의 기원과 메커니즘을 밝히는 데 필수적입니다.", "motivation": "일반적인 초전도체와 달리 모아레 초전도체는 물리적 치수가 극도로 작고 2D적 특성을 가집니다. 따라서 개별 소용돌이의 움직임을 감지하고 물리적 성질을 분석하는 고감도 센싱 기술이 필요했습니다.", "result": "조셉슨 접합(Josephson junction)을 단일 소용돌이 센서로 활용하여, MATTG 시스템 내부에서 개별 Pearl 소용돌이의 동역학을 직접적으로 관찰하고 추적하는 데 성공했습니다.", "implication": "초전도 소용돌이의 거동을 원자 수준에서 제어하고 관찰할 수 있는 도구를 마련했으며, 이는 모아레 계의 초전도 상태가 가진 위상학적 성질 및 분산 특성을 연구하는 강력한 방법론이 될 것입니다.", "novelty": "조셉슨 접합을 이용한 개별 소용돌이 감지 방식은 기존의 벌크 측정 방식보다 훨씬 정밀하며, 2D 모아레 시스템의 초전도성을 이해하는 데 새로운 돌파구를 제시합니다.", "unresolved": "소용돌이와 모아레 격자 간의 국소적인 상호작용이 어떻게 초전도 상태의 비등방성을 생성하는지에 대해서는 추가적인 공간 분해능 연구가 필요합니다.", "future_work": "소용돌이 고정(pinning) 메커니즘 연구 및 외부 게이트 전압을 통한 소용돌이 운동의 능동적 제어 실험이 기대됩니다.", "concepts": [{"term": "Pearl 소용돌이", "why_emerged": "두께가 침투 깊이보다 작은 2D 박막 초전도체에서의 자기장 분포를 설명하기 위해 필요.", "origin": "J. Pearl (1964)", "connections": "2D 초전도성, 조셉슨 효과"}, {"term": "마법 각도 뒤틀린 이중층 그래핀", "why_emerged": "간단한 탄소 구조체에서 평탄 밴드를 생성하여 강상관 전자 물성을 연구하기 위해.", "origin": "Pablo Jarillo-Herrero 연구팀 (2018)", "connections": "모아레 물리학, 평탄 밴드 초전도성"}], "english_summary": ["A Josephson junction is employed as a sensitive detector for individual Pearl vortices in magic-angle twisted bilayer graphene.", "The experiment enables direct monitoring of vortex dynamics in a 2D moiré superconducting system.", "This approach bridges the gap between macroscopic superconducting signatures and microscopic vortex behavior.", "The findings offer new insights into the nature of superconductivity in MATTG."]}}, {"title": "Strongly Enhanced Charge-Density Waves and Correlated Insulating State in Atomically Thin 1T−TaS2", "journal": "PRL_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/pxpf-6bsv", "authors": "Gan Liu, Yulu Liu, Qiling Luo, et al.", "last_authors": "Yi Lu, Xiaoxiang Xi", "summary": "A combination of Raman spectroscopy and transport measurements shows that approaching the 2D limit markedly enhances the charge density wave order and the associated correlated insulating state in 1 T -TaS 2 .", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Experimental observation of enhanced CDW and correlation in 2D 1T-TaS2.", "tags": ["experiment", "material", "CDW"], "image": "", "briefing": {"background": "1T-TaS2는 전형적인 전이금속 디칼코게나이드(TMD) 물질로, 전하 밀도 파동(CDW)과 상관 절연 상태가 공존하는 대표적인 모델입니다. 2D 극한으로 갈수록 밴드 구조와 상관 효과가 극적으로 변화하며, 이는 CDW 물성을 탐구하는 핵심 분야입니다.", "motivation": "벌크와 달리 2D 극한에서의 1T-TaS2가 나타내는 CDW 상태가 어떠한 물리적 변화를 겪는지, 특히 상관 절연 상태의 강화 여부를 확인하는 것이 본 연구의 목적입니다.", "result": "라만 분광법과 전기 전송 측정을 통해 2D 극한으로 갈수록 CDW 질서와 이에 수반되는 상관 절연 상태가 현저하게 강화됨을 관찰했습니다.", "implication": "2D 제한이 시스템 내부의 전자-전자 상호작용을 증폭시켜 고유한 전자 위상을 강화할 수 있음을 시사하며, 이는 저차원 물질에서의 전이 현상을 제어하는 새로운 길을 제시합니다.", "novelty": "2D 극한에서의 CDW 증폭 현상을 실험적으로 명확히 입증했으며, 이는 TaS2 기반의 나노 소자 개발과 상관 전자 물성 연구에 직접적인 영향을 줄 것입니다.", "unresolved": "강화된 CDW와 상관 절연 상태가 초전도 상태와 어떠한 경쟁 또는 협력 관계에 있는지에 대한 상세한 위상 도면 구축이 미진합니다.", "future_work": "주사 터널링 현미경(STM)을 이용한 국소 밴드 구조 및 CDW 갭의 직접적인 관측, 그리고 압력/변형률에 따른 상태 변화 연구가 필요합니다.", "concepts": [{"term": "전하 밀도 파동 (CDW)", "why_emerged": "전자 밀도가 주기적으로 변조되는 양자 위상을 설명하기 위해.", "origin": "Rudolf Peierls (1955)", "connections": "페르미 면 중첩, 1D/2D 강상관 물성"}, {"term": "상관 절연 상태", "why_emerged": "강한 전자-전자 반발력으로 인해 밴드 이론이 예측한 금속 상태가 아닌 절연체로 존재하는 상태를 기술하기 위해.", "origin": "Neville Mott (1949)", "connections": "Mott 전이, 다체 물리"}], "english_summary": ["The study investigates 1T-TaS2 in the 2D limit using Raman spectroscopy and transport measurements.", "Enhanced charge-density wave order and correlated insulating states are observed as the thickness approaches the 2D limit.", "This demonstrates that dimensionality restriction significantly modifies the electronic ground state in TMDs.", "Results provide critical data for controlling collective quantum phenomena in atomically thin materials."]}}, {"title": "Topological Surface Charge Detection via Active Capacitive Compensation: A Pathway to the 4D Quantum Hall Effect", "journal": "PRL_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/wycz-5hvd", "authors": "Yuanze Li, Renfei Wang, Yifan Zhang, et al.", "last_authors": "Yang Liu, Tian Liang", "summary": "The topological magnetoelectric effect (TME) in three-dimensional topological insulators (TIs), described by $\\mathrm{Δ}P=({e}^{2}/2h){N}_{\\text{Ch}}^{(2)}\\mathrm{Δ}B$, serves as a condensed-matter realization of the four-dimensional quantum Hall effect (4D QHE). In dual-gate axion insulator devices…", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Relevant to topological insulators, axion physics, and quantum Hall effects in real devices.", "tags": ["experiment", "topological-insulator", "quantum-hall"], "image": "", "briefing": {"background": "3차원 위상 절연체는 내부는 절연체이나 표면에 전도성 상태가 존재하는 물질로, 특히 액시온 절연체 상태에서 나타나는 위상 자성 전기 효과(TME)는 4차원 양자 홀 효과와 수학적으로 등가라는 점이 알려져 있습니다.", "motivation": "기존 이론에서 예측된 액시온 절연체의 위상 자성 전기 효과를 실험적으로 직접 측정하고, 이를 4차원 양자 홀 효과의 응집 물질 기반 실현으로 증명하고자 합니다.", "result": "이중 게이트 액시온 절연체 소자를 사용하여 표면 전하를 능동 정전 용량 보상 방식으로 정밀하게 감지함으로써, 위상 자성 전기 효과의 핵심 수치인 위상 전하를 성공적으로 측정했습니다.", "implication": "이 실험적 결과는 4차원 양자 홀 효과의 물리학을 3차원 위상 절연체 시스템에서 구현할 수 있음을 입증하며, 위상학적 물리 현상을 소자 레벨에서 제어할 수 있는 가능성을 열어줍니다.", "novelty": "복잡한 위상 물리 현상을 능동적인 전기적 측정 기술(capacitive compensation)로 실증했다는 점에서 독창적이며, 독자의 주 관심사인 위상학적 물질의 전자 상태 측정 분야에 중요한 방법론을 제공합니다.", "unresolved": "실험적 신호의 정밀도와 외부 노이즈 간의 관계, 그리고 샘플의 불균질성이 측정값에 미치는 영향은 여전히 보완이 필요합니다.", "future_work": "더 다양한 위상 물질 시스템에서의 TME 측정 및 4차원 양자 홀 물리 현상의 응용 소자 개발.", "concepts": [{"term": "위상 자성 전기 효과 (TME)", "why_emerged": "위상 절연체에서 전기장과 자기장의 결합을 기술하기 위해 도입되었습니다.", "origin": "Qi et al. (2008)에 의해 이론적으로 정립되었습니다.", "connections": "액시온 전기역학, 4차원 양자 홀 효과."}, {"term": "액시온 절연체", "why_emerged": "위상 절연체 내에서 자성 불순물이나 구조적 변형을 통해 반전 대칭과 시간 반전 대칭이 깨진 상태를 설명하기 위해 필요합니다.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "위상 절연체, 자기 위상 물질."}], "english_summary": ["Experimental detection of topological magnetoelectric effect in axion insulators.", "Uses active capacitive compensation to probe surface topological charges.", "Provides a solid-state realization of the 4D quantum Hall effect.", "Demonstrates precise control over topological surface states in dual-gate devices."]}}, {"title": "Heavily doped, highly compensated epitaxial ScN thin films exceed Boltzmann thermopower limits", "journal": "Science", "source": "Gemini", "link": "https://doi.org/10.1126/science.aef9458", "authors": "Renuka Karanje, Dheemahi Rao, Diksha Dadhich, et al.", "last_authors": "Subroto Mukerjee, Bivas Saha", "summary": "The Seebeck effect converts a temperature gradient into an electric voltage. However, conventional transport theories constrain this thermopower to a few millivolts per Kelvin in crystalline materials. We present experimental evidence of a Seebeck coefficient exceeding –124 millivolts per Kelvin near room temperature in heavily doped, highly compensated (HDHC) epitaxial scandium nitride (ScN) thin films. Random distribution of charged dopants in HDHC ScN are known to generate potential fluctuations that distort the electronic bands and give rise to percolative transport, and our results further reveal a power-law scaling between thermopower and electrical conductivity. In ultrathin films, the Rytova-Keldysh modifications of the Coulomb potential further amplify the potential fluctuations and enhance the Seebeck response. Our findings reveal a so /10.1126/sciadv.aef6328", "authors": "Yu Zhang, Meng Xu, Bowei Zhou, et al.", "last_authors": "K. Andre Mkhoyan, Weigang Wang", "summary": "Electric-field control of spin states offers a promising route to ultralow-power, ultrafast magnetization switching in spintronic devices such as magnetic tunnel junctions (MTJs). However, enhancing voltage-controlled magnetic anisotropy (VCMA) through interfacial engineering often disrupts coherent tunneling and suppresses tunnel magnetoresistance (TMR), limiting practical device performance. Here, we experimentally demonstrate highly energy-efficient, voltage-driven magnetization switching in MTJs enabled by a remote iridium (Ir) doping strategy that tailors the Ir concentration near the MgO/CoFeB interface in the free layer. By inserting an ultrathin Ir layer away from the tunnel barrier and leveraging controlled diffusion during annealing, we achieve sub-nanosecond switching with an energy of only 3.5 femtojoules per bit in nanoscale MTJs while maintaining a TMR ratio up to 160% after 400°C postannealing. These results resolve a long-standing VCMA-TMR trade-off and establish a scalable pathway toward ultralow-power nonvolatile spintronic devices under aggressive energy and scaling constraints.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Experimental spintronics paper on magnetic tunnel junctions with voltage control of magnetism.", "tags": ["spintronics", "magnetism", "magnetictunneljunctions", "transport", "thinfilms"], "image": "", "briefing": {"background": "자기 터널 접합(MTJ)을 이용한 스핀트로닉스 소자는 에너지 효율적인 스위칭이 핵심이나, 전압으로 자성 이방성을 제어하는 기술과 자기 저항 비율(TMR) 사이에는 상충 관계(trade-off)가 존재합니다.", "motivation": "인터페이스 엔지니어링을 통해 이 상충 관계를 극복하고, 낮은 에너지로 빠른 자기 반전을 달성하고자 합니다.", "result": "이리듐(Ir)을 MgO/CoFeB 계면 근처에 정밀하게 도핑하는 전략을 통해, 터널링 효율을 유지하면서 전압 제어 자기 이방성을 대폭 향상시켜 저전력 고속 스위칭을 구현했습니다.", "implication": "스핀트로닉스 소자의 상용화를 가로막던 에너지 효율성 문제를 해결함으로써, 향후 비휘발성 메모리 및 로직 소자의 집적도를 획기적으로 높일 수 있습니다.", "novelty": "특정 인터페이스 도핑을 통해 TMR 손실 없이 VCMA 효율을 극   if (r.summary) { const abstract = document.createElement('p'); abstract.className = 'original-abstract'; const strong = textEl('strong', '', 'Original abstract'); abstract.appendChild(strong); abstract.append(r.summary); head.appendChild(abstract); }
  slideEl.appendChild(head);
  const briefing = document.createElement('div');
  briefing.className = 'briefing';
  appendBriefSection(briefing, 'Background', b.background);
  appendBriefSection(briefing, 'Motivation', b.motivation);
  appendBriefSection(briefing, 'Result', b.result);
  appendBriefSection(briefing, 'Implication', b.implication);
  appendBriefSection(briefing, "Why it's important / Novelty", b.novelty);
  appendBriefSection(briefing, 'Unresolved Questions', b.unresolved);
  appendBriefSection(briefing, 'Expected Future Work', b.future_work);
  if (b.concepts && b.concepts.length) {
    const section = document.createElement('section');
    section.className = 'brief-section wide';
    section.appendChild(textEl('h2', '', 'Concepts / Terms'));
    const concepts = document.createElement('div');
    concepts.className = 'concepts';
    b.concepts.forEach(c => {
      const item = document.createElement('div');
      item.className = 'concept';
      item.appendChild(textEl('h3', '', c.term || 'Concept'));
      [['왜 생겼나: ', c.why_emerged], ['누가 만들었나: ', c.origin], ['연결되는 흐름: ', c.connections]].forEach(([label, text]) => { if (!text) return; const p = document.createElement('p'); const bold = textEl('b', '', label); p.appendChild(bold); p.append(text); item.appendChild(p); });
      concepts.appendChild(item);
    });
    section.appendChild(concepts);
    briefing.appendChild(section);
  }
  if (b.english_summary && b.english_summary.length) { const section = document.createElement('section'); section.className = 'brief-section wide'; section.appendChild(textEl('h2', '', 'English Summary')); const ul = document.createElement('ul'); b.english_summary.slice(0, 5).forEach(line => ul.appendChild(textEl('li', '', line))); section.appendChild(ul); briefing.appendChild(section); }
  slideEl.appendChild(briefing);
  counterEl.textContent = `${index + 1} / ${slides.length}`;
  prevBtn.disabled = index === 0;
  nextBtn.disabled = index === slides.length - 1;
}
prevBtn.addEventListener('click', () => { index = Math.max(0, index - 1); render(); });
nextBtn.addEventListener('click', () => { index = Math.min(slides.length - 1, index + 1); render(); });
document.addEventListener('keydown', event => { if (event.key === 'ArrowLeft') prevBtn.click(); if (event.key === 'ArrowRight') nextBtn.click(); });
render();
</script>
</body>
</html>
