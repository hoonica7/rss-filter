<!DOCTYPE html>

<title>Daily Paper Slideshow</title>
<style>
  :root {
    color-scheme: light;
    --bg: #f6f7f4;
    --paper: #ffffff;
    --ink: #111827;
    --muted: #64748b;
    --line: #d8ddd2;
    --accent: #176b87;
    --accent-2: #9a3412;
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; overflow: auto; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: var(--bg); color: var(--ink); }
  .shell { max-width: 1500px; min-height: 100vh; margin: 0 auto; padding: 14px 18px; display: flex; flex-direction: column; }
  .topbar { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 16px; }
  .top-actions { display: flex; align-items: center; gap: 10px; }
  .topbar a, button { border: 1px solid var(--line); border-radius: 8px; background: var(--paper); color: var(--ink); padding: 10px 14px; font-weight: 700; text-decoration: none; cursor: pointer; }
  button.primary { background: var(--accent); border-color: var(--accent); color: white; }
  button:disabled { opacity: 0.45; cursor: not-allowed; }
  .counter { color: var(--muted); font-weight: 700; }
  .slide { min-height: calc(100vh - 82px); background: var(--paper); border: 1px solid var(--line); border-radius: 10px; padding: 18px; box-shadow: 0 18px 42px rgba(15, 23, 42, 0.10); display: grid; grid-template-columns: minmax(310px, 0.86fr) minmax(0, 1.55fr); gap: 18px; overflow: visible; }
  .paper-head { min-width: 0; min-height: 0; overflow: visible; display: flex; flex-direction: column; gap: 12px; }
  .figure { margin: 0; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: #f8fafc; }
  .figure img { display: block; width: 100%; max-height: 41vh; object-fit: contain; background: white; }
  .figure figcaption { padding: 7px 10px; color: var(--muted); font-size: 12px; line-height: 1.3; }
  .head-text { display: flex; flex-direction: column; gap: 9px; min-width: 0; }
  .badges { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .badge { border-radius: 999px; padding: 5px 9px; background: #eef2ff; color: #3730a3; font-size: 12px; font-weight: 800; }
  .score { background: #fee2e2; color: #991b1b; }
  h1 { margin: 0; font-size: 25px; line-height: 1.15; letter-spacing: 0; overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
  h1 a { color: inherit; text-decoration-color: rgba(23, 107, 135, 0.35); text-decoration-thickness: 2px; text-underline-offset: 4px; }
  h1 a:hover { color: var(--accent); text-decoration-color: var(--accent); }
  .meta, .authors, .why, .abstract { font-size: 13px; line-height: 1.45; }
  .meta, .authors { color: var(--muted); }
  .why strong, .abstract strong, .authors strong { color: var(--ink); }
  .authors { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .why { border-left: 4px solid var(--accent-2); padding-left: 10px; color: #374151; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .abstract { border-top: 1px solid var(--line); padding-top: 14px; color: #374151; }
  .original-abstract { border-top: 1px solid var(--line); padding-top: 10px; color: #374151; font-size: 11.5px; line-height: 1.35; overflow-wrap: anywhere; }
  .original-abstract strong { display: block; margin-bottom: 4px; color: var(--ink); }
  .tags { display: flex; flex-wrap: wrap; gap: 8px; }
  .tag { border-radius: 999px; padding: 4px 8px; background: #f1f5f9; color: #475569; font-size: 12px; font-weight: 700; }
  .head-text > .link { display: none; }
  .briefing { min-width: 0; min-height: 0; overflow: visible; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); grid-auto-rows: minmax(0, auto); align-content: start; gap: 11px 18px; border-top: 0; padding-top: 0; }
  .brief-section { min-width: 0; }
  .brief-section.wide { grid-column: 1 / -1; }
  .brief-section h2 { margin: 0 0 4px; font-size: 14px; line-height: 1.22; color: #0f766e; letter-spacing: 0; }
  .brief-section p, .brief-section li { margin: 0; font-size: 12.5px; line-height: 1.42; color: #1f2937; overflow-wrap: anywhere; }
  .brief-section ul { margin: 0; padding-left: 20px; }
  .concepts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 9px 14px; }
  .concept { border-top: 1px solid var(--line); padding-top: 7px; }
  .concept h3 { margin: 0 0 4px; font-size: 13px; color: #7c2d12; letter-spacing: 0; }
  .concept p { margin: 2px 0 0; font-size: 11.5px; line-height: 1.35; color: #374151; overflow-wrap: anywhere; }
  .concept b { color: #111827; }
  .link { color: var(--accent); font-weight: 800; text-decoration: none; }
  .empty { padding: 48px; background: var(--paper); border: 1px solid var(--line); border-radius: 12px; color: var(--muted); }
  @media (max-width: 860px) {
    .shell { padding: 14px; }
    .topbar, .top-actions { align-items: stretch; flex-direction: column; }
    .slide, .briefing, .concepts { grid-template-columns: 1fr; }
    .slide { min-height: auto; overflow: visible; display: grid; }
    h1 { font-size: 28px; }
  }
</style>

<script>
const slides = [{"title": "Evidence for p-wave magnetism in electronic band structure of metallic EuSi", "journal": "Nature", "source": "author whitelist", "link": "https://www.nature.com/articles/s41586-026-11295-9", "authors": "Erjian Cheng, Yixing Yang, Yifan Gao, et al.", "last_authors": "Zhongkai Liu, Claudia Felser", "summary": "A combination of symmetry analysis, first-principles calculations, neutron scattering and photoemission spectroscopy shows p-wave magnetism in the near-Fermi-level electronic structure of stoichiometric metallic EuSi.", "tier": "A_MUST_READ", "score": "10", "reason": "author whitelist: Makoto Hashimoto", "tags": ["photoemission", "neutronscattering", "bandstructure"], "image": "https://media.springernature.com/m685/springer-static/image/art%3A10.1038%2Fs41586-026-11295-9/MediaObjects/41586_2026_11295_Fig1_HTML.png", "briefing": {"background": "고체 물리학에서 자기성과 전자 구조의 상호작용은 위상 전도체 및 자성 재료 설계의 핵심입니다. 특히 최근에는 단순한 강자성이나 반강자성을 넘어 전자 밴드 구조에서 특이한 스핀 분할을 유도하는 새로운 형태의 자기적 질서에 대한 연구가 활발합니다.", "motivation": "EuSi는 금속성 화합물로서 그 전자 구조 내에 존재할 수 있는 특이한 대칭성과 자기적 기여를 규명할 필요가 있었습니다. 특히 실험적으로 관측하기 어려운 전도 전자의 스핀-운동량 결합 양상을 확인하고자 했습니다.", "result": "대칭성 분석, 제일원리 계산, 중성자 산란 및 각분해 광전자 분광법(ARPES)을 결합하여 EuSi의 페르미 준위 근처 전자 밴드 구조에서 p-wave 형태의 자기적 특성이 존재함을 확인했습니다.", "implication": "이 결과는 단순한 자기 모멘트의 배열을 넘어 전자 밴드 자체가 특정 대칭성을 가진 자기적 성질을 띠는 'p-wave 자성'의 존재를 증명하며, 이는 향후 알터마그네티즘(altermagnetism)이나 스핀트로닉스 소자 응용에 중요한 기초가 됩니다.", "novelty": "ARPES와 중성자 산란을 통해 금속 EuSi에서 p-wave 자기성을 직접적으로 연결했다는 점이 혁신적입니다. 독자의 관심사인 ARPES와 자성 위상 물질 연구에 부합하는 Nature급 연구입니다.", "unresolved": "p-wave 자기성이 거시적인 수송 현상이나 초전도성과 같은 다른 양자 현상과 어떻게 직접적으로 결합되는지는 추가 연구가 필요합니다.", "future_work": "다른 희토류 규소 화합물에서의 유사 현상 탐색 및 스핀 분해 ARPES를 통한 더 상세한 스핀 텍스처 검증이 기대됩니다.", "concepts": [{"term": "p-wave magnetism", "why_emerged": "기존의 s-wave 대칭성을 넘어서는 전자 구조상의 이방성 자기 응답을 설명하기 위해 등장했습니다.", "origin": "초록 정보만으로는 특정하기 어려우나, 대칭성 분석과 밴드 계산의 발전으로 구체화되었습니다.", "connections": "altermagnetism, spin-triplet pairing, spin-momentum locking"}, {"term": "EuSi", "why_emerged": "희토류 기반의 금속 간 화합물로서 강한 전자 상관관계와 자기성을 동시에 탐구하기 위한 플랫폼으로 선정되었습니다.", "origin": "전통적인 금속 간 화합물 연구군에서 유래했습니다.", "connections": "Rare-earth silicides, magnetic semimetals"}, {"term": "Electronic band structure", "why_emerged": "결정 내 전자의 에너지와 운동량 관계를 이해하여 물질의 전기적, 자기적 성질을 예측하기 위해 필요합니다.", "origin": "Felix Bloch 등에 의해 20세기 초 정립되었습니다.", "connections": "DFT, ARPES, Fermi surface"}, {"term": "Neutron scattering", "why_emerged": "물질 내부의 자기 구조와 스핀 파동을 직접적으로 측정하기 위해 개발되었습니다.", "origin": "Clifford Shull 등에 의해 실험적으로 확립되었습니다.", "connections": "Magnetic order, spin dynamics"}], "english_summary": ["Demonstrates p-wave magnetism in metallic EuSi using ARPES and neutron scattering.", "Integrates symmetry analysis with first-principles calculations to map electronic structures.", "Identifies unique spin-textured band structures near the Fermi level.", "Provides experimental evidence for unconventional magnetic states in simple metallic systems."]}}, {"title": "Intracycle Interference in Strong-Field Photoemission from a Tungsten Needle Tip", "journal": "PRL_Recent", "source": "keyword", "link": "http://link.aps.org/doi/10.1103/t87j-1ngl", "authors": "Timo Wirth, Jonas Heimerl, Stefan Meier, Peter Hommelhoff", "last_authors": "Stefan Meier, Peter Hommelhoff", "summary": "by strong laser fields can rescatter, generating attosecond high harmonics. Spectral peaks arise from inter- and intracycle interference of coherent electron wave packets. While intercycle interference is well known, intracycle interference of plateau electrons has not been ob…", "tier": "A_MUST_READ", "score": "9", "reason": "title strong match: photoemission", "tags": ["photoemission"], "image": "", "briefing": {"background": "강한 레이저장을 이용한 광전자 방출은 전자의 파동성을 제어하고 아토초 단위의 물리 현상을 연구하는 데 필수적입니다. 특히 금속 나노 팁에서 발생하는 광전자의 간섭 효과는 전자 방출 메커니즘을 이해하는 핵심 지표입니다.", "motivation": "레이저 펄스 내에서 발생하는 전자 파동 패킷의 간섭에는 주기 간(intercycle) 간섭과 주기 내(intracycle) 간섭이 있습니다. 주기 간 간섭은 잘 알려져 있으나, 플래토(plateau) 전자의 주기 내 간섭은 관측이 어려웠습니다.", "result": "텅스텐 바늘 팁을 이용한 강장 광전자 방출 실험에서 플래토 전자의 주기 내 간섭(intracycle interference)에 기인한 스펙트럼 피크를 처음으로 관측하는 데 성공했습니다.", "implication": "전자 파동 패킷의 미세한 시간적 제어가 가능함을 시사하며, 이는 아토초 전자 광학 및 고해상도 분광 기술 발전에 기여할 수 있습니다.", "novelty": "일반적인 광전자 분광법(ARPES)과는 다른 시간 영역(time-domain) 물리이지만, 독자의 관심사인 광전자 방출의 근본적인 간섭 현상을 다루고 있습니다.", "unresolved": "재산란(rescattering) 과정에서 발생하는 위상 변화가 실험 데이터에 미치는 정량적인 영향은 여전히 논의의 여지가 있습니다.", "future_work": "팁의 재질이나 기하학적 구조를 변화시켜 간섭 무늬를 제어하거나, 이를 이용한 초고속 전자 회절 연구가 진행될 것으로 보입니다.", "concepts": [{"term": "Intracycle Interference", "why_emerged": "단일 광학 주기 내에서 방출된 전자 파동 사이의 위상차를 설명하기 위해 필요합니다.", "origin": "강장 물리(Strong-field physics) 이론 연구자들에 의해 제안되었습니다.", "connections": "High-harmonic generation, attosecond physics"}, {"term": "Tungsten Needle Tip", "why_emerged": "나노 스케일의 곡률 반경을 통해 국부적인 전기장을 증폭시키기 위해 사용됩니다.", "origin": "현대 나노 광학 및 전자 방출 연구에서 널리 쓰입니다.", "connections": "Field emission, STM tips"}, {"term": "Strong-field photoemission", "why_emerged": "강한 전자기장 하에서 비선형적으로 발생하는 전자 방출 현상을 탐구하기 위해 등장했습니다.", "origin": "레이저 기술의 발전에 따른 비선형 광학 연구에서 유래했습니다.", "connections": "Multiphoton ionization, Keldysh parameter"}, {"term": "Rescattering", "why_emerged": "방출된 전자가 레이저장에 의해 가속되어 모체와 다시 충돌하는 현상을 설명하기 위해 고안되었습니다.", "origin": "Three-step model of HHG (Corkum et al.)", "connections": "High harmonic generation, plateau electrons"}], "english_summary": ["Observes intracycle interference of plateau electrons from a tungsten tip.", "Utilizes strong-field photoemission to generate coherent electron wave packets.", "Demonstrates high-resolution spectral peaks arising from sub-optical cycle dynamics.", "Advances the understanding of attosecond electron control in metal nanostructures."]}}, {"title": "Anisotropic field suppression of charge order reveals orbital-selective Kondo hybridization in UTe2", "journal": "Science_Advances", "source": "Gemini", "link": "https://www.science.org/doi/abs/10.1126/sciadv.aeh8987?af=R", "authors": "Nileema Sharma, Fangjun Cheng, Hyeok-Jun Yang, et al.", "last_authors": "Yi-Ting Hsu, Xiaolong Liu", "summary": "UTe 2 is a rare correlated quantum material where unconventional density-wave orders, Kondo physics, spin-triplet pairing, and reentrant superconductivity coexist. Because superconductivity emerges from a strongly correlated normal state, identifying and controlling intertwined normal-state orders are essential for understanding the electronic landscape where superconductivity arises. Here, using scanning tunneling microscopy in a vector magnetic field, we uncover a staggered charge density wave (CDW) in high-quality UTe 2 crystals. This CDW exhibits a strong directional field response: It is completely quenched by a modest 1.7-tesla magnetic field along the quasi–one-dimensional uranium-chain direction while remaining robust against fields along other crystallographic axes. This anisotropy suggests an orbital-driven field-tuned quantum phase transition. Unexpectedly, the same field orientation concurrently suppresses the 5f Kondo resonance. Modeling indicates a switch in the dominant hybridization channel from Te 5 p- U 5 f to U 6 d- U 5 f coupling, suggesting an intimate interplay between CDW and the Kondo effect.", "tier": "B_IMPORTANT_CONDMAT", "score": "9", "reason": "High-impact study on charge order and Kondo hybridization in the heavy fermion superconductor UTe2.", "tags": ["material", "heavyfermion", "unconventionalsuperconductivity"], "image": "", "briefing": {"background": "UTe2는 스핀-트리플렛 초전도체 후보로 꼽히는 중성 페르미온 물질로, 초전도 상태와 얽혀 있는 전하 밀도 파(CDW) 및 콘도(Kondo) 물리 등의 정상 상태(normal state) 질서에 대한 이해가 매우 중요합니다.", "motivation": "UTe2에서 발견된 CDW가 자기장에 대해 어떻게 반응하는지, 그리고 이것이 물질 내의 국부적인 콘도 하이브리드화와 어떤 상관관계를 갖는지 규명하고자 했습니다.", "result": "벡터 자기장 STM을 통해 U-chain 방향(a-축)으로 1.7T의 약한 자기장만 가해도 CDW가 완전히 소멸됨을 확인했습니다. 동시에 5f 콘도 공명이 억제되고 하이브리드화 채널이 Te 5p-U 5f에서 U 6d-U 5f로 전환되는 현상을 발견했습니다.", "implication": "CDW와 콘도 효과가 궤도 선택적(orbital-selective)으로 강하게 얽혀 있음을 증명하며, 자기장이 전자 궤도의 결합 방식을 튜닝하여 상전이를 유도할 수 있음을 보여줍니다.", "novelty": "UTe2의 CDW가 특정 방향의 자기장에 매우 민감하다는 이방성을 밝혀냈으며, STM을 통해 궤도 선택적 콘도 하이브리드화의 직접적인 증거를 제시한 중요한 연구입니다.", "unresolved": "자기장에 의한 하이브리드화 채널의 전환이 초전도 쌍 형성 기전(pairing mechanism)에 어떤 직접적인 영향을 주는지에 대한 추가 연구가 필요합니다.", "future_work": "a-축 방향 자기장 하에서의 초전도성 변화와 CDW 소멸 간의 상관관계에 대한 수송 특성 및 열역학적 측정이 뒤따를 것으로 예상됩니다.", "concepts": [{"term": "Kondo hybridization", "why_emerged": "국부적인 자성 이온의 전자와 전도 전자 사이의 결합을 통해 무거운 페르미온 상태가 형성되는 과정을 설명하기 위해 필요합니다.", "origin": "Jun Kondo의 이론적 배경과 중성 페르미온 연구에서 발전했습니다.", "connections": "Heavy fermion, Fano resonance, 5f systems"}, {"term": "Charge Density Wave (CDW)", "why_emerged": "전자들 사이의 상호작용이나 전자-격자 결합으로 인해 전하 밀도가 주기적으로 변조되는 현상을 설명하기 위해 등장했습니다.", "origin": "Rudolf Peierls의 이론적 제안에서 유래했습니다.", "connections": "Peierls instability, nesting, STM"}, {"term": "UTe2", "why_emerged": "이례적으로 높은 임계 자기장을 가진 스핀-트리플렛 초전도 후보 물질로 주목받아 연구되었습니다.", "origin": "2019년 Ran et al. 등에 의해 초전도성이 재발견되었습니다.", "connections": "Spin-triplet superconductivity, Weyl nodes"}, {"term": "Orbital-selective", "why_emerged": "다전자계에서 특정 궤도만이 물리적 현상(금속-절연체 전이, 자기성 등)에 참여하는 현상을 설명하기 위해 고안되었습니다.", "origin": "강상관 전자계(Mott insulators) 연구에서 주로 사용됩니다.", "connections": "Mott physics, Hund's metal"}], "english_summary": ["Reveals anisotropic field suppression of CDW in UTe2 using vector-field STM.", "Discovers a low-field (1.7T) quantum phase transition tied to the uranium-chain direction.", "Identifies a switch in Kondo hybridization channels from p-f to d-f coupling.", "Links charge order and Kondo physics through orbital-selective electronic landscape tuning."]}}, {"title": "Room-temperature topological spin textures via cobalt substitution in a kagome antiferromagnet", "journal": "npj_QuantumMaterials", "source": "Gemini", "link": "https://www.nature.com/articles/s41535-026-00947-8", "authors": "Shaohua Fan, Zinan Zhao, Baochun Wu, et al.", "last_authors": "Xingye Lu, Jinbo Yang", "summary": "Room-temperature topological spin textures via cobalt substitution in a kagome antiferromagnet", "tier": "B_IMPORTANT_CONDMAT", "score": "9", "reason": "Direct hit on kagome magnetism and topological materials, central to current research projects.; demoted from A: broad CM, not direct user/project hit", "tags": ["experiment", "kagomemagnet", "topological"], "image": "https://pubads.g.doubleclick.net/gampad/ad?iu=/285/npjquantmats.nature.com/article&sz=728x90&c=555769839&t=pos%3Dtop%26type%3Darticle%26artid%3Ds41535-026-00947-8%26doi%3D10.1038/s41535-026-00947-8%26subjmeta%3D301,639,766%26kwrd%3DMaterials+science,Physics", "briefing": {"background": "카고메(Kagome) 격자 구조는 기하학적 좌절(frustration)과 전자 밴드의 위상적 특성이 결합되어 독특한 자기적, 전기적 물성을 나타내는 플랫폼으로 주목받고 있습니다.", "motivation": "기존의 카고메 자성체들은 주로 저온에서만 특이한 자기 구조를 보이는 경우가 많아, 상온에서도 안정적인 위상 스핀 텍스처(topological spin texture)를 구현하는 것이 응용 측면에서 중요한 과제였습니다.", "result": "본 연구는 카고메 반강자성체 내에 코발트(Co)를 치환함으로써 상온에서 안정적인 위상 스핀 텍스처를 생성할 수 있음을 실험적으로 보여주었습니다.", "implication": "카고메 격자 기반의 자성 소자 개발에 있어 온도 제약을 극복할 수 있는 가능성을 제시하며, 스핀트로닉스 분야에서 카고메 물질의 활용 범위를 넓혔습니다.", "novelty": "카고메 자성체에서 원소 치환을 통해 상온 위상 스핀 상태를 유도했다는 점이 독창적이며, 독자의 주된 관심사인 카고메 금속 및 자기 위상 물질 연구와 직접적으로 연결됩니다.", "unresolved": "초록 정보만으로는 치환된 코발트의 정확한 농도 범위나 스핀 텍스처의 정밀한 위상 불변량(topological invariant) 분석 결과는 구체적으로 파악하기 어렵습니다.", "future_work": "다양한 외부 자기장 및 전류 환경에서 해당 스핀 텍스처의 동역학적 특성을 연구하고, 이를 활용한 나노 소자 제작이 기대됩니다.", "concepts": [{"term": "카고메 반강자성체(Kagome Antiferromagnet)", "why_emerged": "삼각형 모서리가 맞닿은 기하학적 구조 때문에 스핀이 서로 반대 방향으로 정렬하기 힘든 좌절 상태를 연구하기 위해 등장했습니다.", "origin": "일본의 대나무 바구니 패턴에서 유래한 격자 구조로, 고체물리학에서는 수십 년간 이론과 실험 양면에서 연구되어 왔습니다.", "connections": "좌절 자성, 위상 홀 효과, 플랫 밴드(Flat band) 물성과 밀접한 관련이 있습니다."}, {"term": "위상 스핀 텍스처(Topological Spin Texture)", "why_emerged": "스카이뮨(skyrmion)이나 메론(meron)과 같이 연속적인 변형으로 지울 수 없는 안정적인 자기 구조를 데이터 저장 매체로 활용하기 위해 고안되었습니다.", "origin": "토니 스카임(Tony Skyrme)의 입자 물리학 이론이 자성체 연구에 도입되며 확립되었습니다.", "connections": "스핀트로닉스, 위상 홀 효과, 비공선형(non-collinear) 자성과 연결됩니다."}], "english_summary": ["Demonstrates room-temperature topological spin textures in a kagome antiferromagnet via cobalt substitution.", "Overcomes the low-temperature limitation of typical kagome magnetic systems.", "Directly relevant to the development of kagome-based spintronic devices at ambient conditions."]}}, {"title": "Designing dislocation-driven polar vortex networks in twisted perovskites", "journal": "Nature", "source": "Gemini", "link": "https://www.nature.com/articles/s41586-026-11330-9", "authors": "W. Sandholt, N. Gauquelin, J. Mangeri, et al.", "last_authors": "J. M. G. Lastra, N. Pryds", "summary": "Experimental and theoretical investigation of twisted freestanding SrTiO3 layers using various analytic methods from 4DSTEM to DFT reveal a long-range ordered screw dislocation pattern as well as topological polar vortex arrays in the interface plane.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "High-impact experimental study on twisted perovskite heterostructures and topological textures.", "tags": ["4DSTEM", "SrTiO3", "twistedbilayers", "topology"], "image": "https://media.springernature.com/m685/springer-static/image/art%3A10.1038%2Fs41586-026-11330-9/MediaObjects/41586_2026_11330_Fig1_HTML.png", "briefing": {"background": "최근 2차원 물질의 비틀림(twist)을 이용한 모아레(moiré) 물리 연구가 페로브스카이트 산화물과 같은 강유전체/유전체 시스템으로 확장되고 있습니다.", "motivation": "비틀린 산화물 이종 접합 구조에서 전하뿐만 아니라 극성(polar) 차원의 위상 구조를 설계하고 제어할 수 있는지를 탐구하고자 했습니다.", "result": "자립형(freestanding) SrTiO3 층을 비틀어 적층했을 때, 계면에서 장거리 질서를 가진 나선 전위(screw dislocation) 패턴과 그에 따른 위상 극성 소용돌이(polar vortex) 배열이 형성됨을 확인했습니다.", "implication": "산화물 이종 구조의 기계적 변형(전위)을 통해 나노미터 수준의 극성 위상 구조를 정밀하게 제어할 수 있는 새로운 경로를 열었습니다.", "novelty": "4D-STEM과 DFT 계산을 결합하여 전위 중심의 극성 텍스처를 직접 관찰하고 규명했다는 점이 혁신적이며, 모아레 시스템의 물리적 범위를 넓혔습니다.", "unresolved": "이러한 극성 소용돌이 네트워크가 외부 전기장에 반응하여 어떻게 재구성되는지에 대한 실시간 동역학 연구는 추가적으로 필요해 보입니다.", "future_work": "다양한 페로브스카이트 물질 조합에 비틀림 각도를 조절하여 새로운 강유전성 또는 다강성(multiferroic) 특성을 유도하는 연구가 진행될 것으로 보입니다.", "concepts": [{"term": "극성 소용돌이(Polar Vortex)", "why_emerged": "나노 크기의 강유전체 구조에서 전기 분극이 소용돌이 형태를 띠며 에너지를 최소화하려는 현상을 설명하기 위해 등장했습니다.", "origin": "초록 정보만으로는 특정하기 어려우나, 산화물 초격자 연구에서 2010년대 중반 이후 본격적으로 보고되었습니다.", "connections": "강유전성, 모아레 무늬, 위상 절연체와 개념적 유사성을 공유합니다."}, {"term": "4D-STEM", "why_emerged": "재료의 국소적인 결정 구조와 전자기장을 나노미터 이하의 고해상도로 동시에 측정하기 위해 개발되었습니다.", "origin": "주사 투과 전자 현미경(STEM) 기술의 발전과 고속 검출기 기술의 결합으로 탄생했습니다.", "connections": "결정 결함 분석, 국소 분극 측정, 나노 구조 분석의 핵심 도구입니다."}], "english_summary": ["Reports the formation of dislocation-driven polar vortex networks in twisted SrTiO3 bilayers.", "Combines 4D-STEM and DFT to reveal long-range ordered screw dislocation and topological polar arrays.", "Establishes a new method for designing topological textures in oxide heterostructures using moiré engineering."]}}, {"title": "Flat-band-induced integer doping and phase transition in monolayer graphene", "journal": "Nature", "source": "Gemini", "link": "https://www.nature.com/articles/s41586-026-11254-4", "authors": "Z. Wang, C. Moulsdale, X. Guo, et al.", "last_authors": "C. R. Woods, K. S. Novoselov", "summary": "An architecture comprising monolayer graphene doubly aligned to bulk and monolayer hBN on either side shows a gate-tunable global structural phase transition between two stacking configurations, accompanied by flat-band-induced integer doping.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Significant experimental study of flat bands and phase transitions in monolayer graphene systems.", "tags": ["material", "graphene", "flatbands"], "image": "https://media.springernature.com/m685/springer-static/image/art%3A10.1038%2Fs41586-026-11254-4/MediaObjects/41586_2026_11254_Fig1_HTML.png", "briefing": {"background": "그래핀과 육방정 질화붕소(hBN)의 정렬은 에너지 밴드 구조를 변형시켜 특이한 양자 현상을 유도하는 핵심 기술입니다.", "motivation": "단층 그래핀에서 비틀림 없이도 플랫 밴드(flat band) 효과를 유도하고, 이를 통해 강력한 전자-전자 상관관계 및 상전이를 관찰하고자 했습니다.", "result": "단층 그래핀 양쪽을 hBN과 정렬시킨 구조(double alignment)에서 게이트 전압으로 조절 가능한 구조적 상전이를 발견했으며, 이 과정에서 플랫 밴드에 의한 정수 도핑(integer doping) 현상을 관찰했습니다.", "implication": "단순한 적층 구조 정렬만으로도 단층 그래핀의 구조적 상태와 전자 상태를 동시에 제어할 수 있음을 시사합니다.", "novelty": "비틀린 이중층 그래핀이 아닌 '단층' 그래핀에서 슈퍼 모아레(super-moiré) 효과를 통해 플랫 밴드 물리와 상전이를 구현했다는 점이 매우 독창적입니다.", "unresolved": "구조적 상전이가 일어나는 미시적 메커니즘(원자 수준의 변위 등)에 대한 정밀한 실공간 관찰 데이터는 보완이 필요할 수 있습니다.", "future_work": "이러한 정수 도핑 상태에서의 초전도성이나 자성 등 다른 상관 관계 물성(correlated states)의 발현 여부를 탐색할 것으로 보니다.", "concepts": [{"term": "플랫 밴드(Flat band)", "why_emerged": "운동 에너지가 억제되어 전자 간의 상호작용이 지배적으로 나타나는 시스템을 연구하기 위해 필요합니다.", "origin": "이론적으로는 리브(Lieb) 모형 등에서 제안되었으며, 최근 모아레 시스템에서 실험적으로 크게 부각되었습니다.", "connections": "강상관계 물리, 초전도성, 분수 양자 홀 효과와 연결됩니다."}, {"term": "슈퍼 모아레(Super-moiré)", "why_emerged": "두 개 이상의 모아레 무늬가 간섭하여 더 큰 주기의 패턴을 형성할 때 발생하는 물성을 설명하기 위해 등장했습니다.", "origin": "그래핀/hBN 이중 정렬 연구 등 다층 계면 연구에서 최근 정립되었습니다.", "connections": "이중 정렬(Double alignment), 밴드 엔지니어링, 모아레 물리."}], "english_summary": ["Observed a gate-tunable structural phase transition in monolayer graphene doubly aligned with hBN.", "Reveals flat-band-induced integer doping and associated electronic correlations without twisting.", "Provides a new platform for exploring many-body physics in simple monolayer systems via super-moiré engineering."]}}, {"title": "Berry curvature induced anomalous Hall and Nernst effects in the conical ferromagnet CeMn2Ge2", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/w894-8jgw", "authors": "Yuzhao Tang, Zhiyang Chen, Bangyong Yan, et al.", "last_authors": "Jun Hu, Baomin Wang", "summary": "The anomalous Hall effect (AHE) and its thermoelectric counterpart, the anomalous Nernst effect (ANE), are sensitive probes of electronic states associated with Berry curvature (BC) in magnetic materials. In this work, we report on the AHE and ANE in single-crystalline ${\\mathrm{CeMn}}_{2}{\\mathrm{G…", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Direct study of Berry curvature and AHE in a magnetic system, core topic of interest.", "tags": ["Berrycurvature", "anomalousHall", "magnetism"], "image": "", "briefing": {"background": "자성체 내의 비정상 수송 현상(AHE, ANE)은 전자의 파동함수가 가진 위상학적 특성인 베리 곡률(Berry curvature)과 밀접한 관련이 있습니다. 특히 복잡한 자기 구조를 가진 물질에서 이러한 효과를 연구하는 것은 새로운 토폴로지컬 양자 상태를 이해하는 핵심적인 방법입니다.", "motivation": "본 연구는 원뿔형(conical) 강자성 구조를 가진 CeMn2Ge2 단결정에서 베리 곡률에 의해 유도되는 비정상 홀 효과(AHE)와 비정상 네른스트 효과(ANE)를 실험적으로 탐구하고자 수행되었습니다.", "result": "CeMn2Ge2 단결정에서 큰 비정상 홀 전도도와 비정상 네른스트 신호를 관찰하였습니다. 분석 결과, 이 현상들은 단순한 자화(magnetization)의 크기보다는 운동량 공간에서의 전자 구조적 특성인 베리 곡률에서 주된 기여를 받는다는 것을 확인했습니다.", "implication": "원뿔형 자기 정렬 상태에서도 강한 위상학적 수송 특성이 나타날 수 있음을 보여주며, 이는 향후 자기 구조와 베리 곡률의 상호작용을 이용한 열전 소자 및 스핀트로닉스 소자 개발에 기여할 수 있습니다.", "novelty": "독자의 주요 관심사인 베리 곡률 및 비정상 홀 효과(AHE)를 다루고 있으며, 특히 원뿔형 자기 구조라는 특수한 환경에서의 수송 특성을 정밀하게 분석했다는 점에서 차별성이 있습니다.", "unresolved": "원뿔형 구조의 세부적인 피치(pitch) 변화나 외부 압력 등이 베리 곡률의 분포에 미치는 영향에 대해서는 추가적인 연구가 필요해 보입니다.", "future_work": "다른 희토류 기반 1-2-2 시스템(RMn2Ge2)과의 비교 연구 및 고자기장 하에서의 베리 곡률 변화 관찰이 기대됩니다.", "concepts": [{"term": "베리 곡률 (Berry Curvature)", "why_emerged": "결정 내 전자의 파동함수가 파수(k) 공간에서 가지는 기하학적 위상을 설명하기 위해 도입되었습니다.", "origin": "Michael Berry (1984)", "connections": "비정상 홀 효과, 위상 절연체, 궤도 자기 모멘트"}, {"term": "비정상 네른스트 효과 (ANE)", "why_emerged": "자성체에 온도 구배를 주었을 때 자화 방향과 온도 구배에 수직한 방향으로 전압이 발생하는 현상을 설명하기 위해 나타났습니다.", "origin": "초록 정보만으로는 특정하기 어려움 (19세기 후반~20세기 초 발견)", "connections": "비정상 홀 효과의 열전 대응 현상, 스핀 열전 효과"}, {"term": "원뿔형 강자성체 (Conical Ferromagnet)", "why_emerged": "스핀들 사이의 교환 상호작용과 이방성이 경쟁하며 나타나는 비공선형(non-collinear) 자기 구조의 일종입니다.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "헬리컬 자기 구조, 스커미온, 비공선형 자성"}], "english_summary": ["Investigated AHE and ANE in single-crystalline CeMn2Ge2 with conical ferromagnetic order.", "Identified that Berry curvature is the primary driver of the anomalous transport coefficients.", "Demonstrated significant intrinsic contributions to the Nernst effect in this specific magnetic phase.", "Highlights the connection between complex magnetic textures and topological electronic states."]}}, {"title": "Intra-atomic magnetic octupoles and their coupling to cluster magnetic octupoles in chiral antiferromagnetic Mn3Sn", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/lfl8-syfd", "authors": "Dohoon Park, Seungyun Han, Hyun-Woo Lee", "last_authors": "Seungyun Han, Hyun-Woo Lee", "summary": "We demonstrate that ${\\mathrm{Mn}}_{3}\\mathrm{Sn}$ hosts finite intra-atomic magnetic octupoles (AMOs) $\\mathbf{o}$ in addition to the well-established cluster magnetic octupole (CMO) $\\mathbf{O}$. In contrast to the cluster-scale CMO, the AMO is a site-localized magnetic multipole associated with t…", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Advanced study of chiral antiferromagnet Mn3Sn, a significant topological magnetic material.", "tags": ["theory", "antiferromagnet", "topology"], "image": "", "briefing": {"background": "Mn3Sn은 비공선형(non-collinear) 반강자성체로서, 큰 비정상 홀 효과를 보여 토폴로지컬 자성 연구에서 매우 중요한 물질입니다. 기존에는 '클러스터 자성 옥투폴(CMO)' 개념을 통해 그 물성을 설명해 왔습니다.", "motivation": "기존의 클러스터 단위 해석을 넘어, 개별 원자 내부의 궤도 상태에서 기인하는 '원자 내 자성 옥투폴(AMO)'의 존재 여부와 그것이 전체 자기 구조에 미치는 영향을 규명하고자 했습니다.", "result": "Mn3Sn이 클러스터 규모의 CMO 외에도 국소적인 AMO를 보유하고 있음을 이론적으로 증명했습니다. 특히 Mn 원자의 t2g 궤도와 관련된 AMO가 CMO와 강하게 결합되어 있음을 밝혀냈습니다.", "implication": "Mn3Sn의 거시적인 위상학적 특성(AHE 등)이 단순한 스핀 배열뿐만 아니라 원자 내부의 복잡한 멀티폴(multipole) 자유도와 연결되어 있음을 시사합니다.", "novelty": "독자의 관심 물질인 Mn3Sn의 자기 구조를 AMO라는 새로운 미시적 관점에서 재해석했습니다. 이는 자성 반강자성체의 스핀트로닉스 응용을 위한 새로운 물리적 지표를 제공합니다.", "unresolved": "AMO의 직접적인 실험적 측정(예: 특정 편광을 이용한 공명 X선 산란 등)을 통한 검증이 숙제로 남아 있습니다.", "future_work": "AMO와 CMO 간의 동역학적 결합에 의한 스핀 파(spin wave) 및 마그논 분산의 변화 연구가 예상됩니다.", "concepts": [{"term": "클러스터 자성 옥투폴 (CMO)", "why_emerged": "반강자성체에서 순자화가 거의 없음에도 불구하고 큰 홀 효과가 나타나는 것을 설명하기 위해 여러 스핀의 집합적 대칭성을 표현하고자 도입되었습니다.", "origin": "L. Šmejkal, T. Jungwirth 등 (최근 10년 내 이론적 정립)", "connections": "Mn3Sn, 카고메 격자 반강자성, 비정상 홀 효과"}, {"term": "원자 내 자성 옥투폴 (AMO)", "why_emerged": "단일 원자 수준에서 전자 궤도의 비대칭적 분포에 의한 고차 자기 모멘트를 정의하기 위해 필요했습니다.", "origin": "본 연구진 (Seungyun Han, Hyun-Woo Lee 등)", "connections": "결정장 효과, 궤도 자유도, 멀티폴릭스"}, {"term": "카이랄 반강자성체 (Chiral Antiferromagnet)", "why_emerged": "스핀이 평면 내에서 특정한 회전 방향성( chirality)을 가지며 배열되는 자성체를 분류하기 위해 정의되었습니다.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "Mn3Sn, Mn3Ge, 베리 위상, 스핀 홀 효과"}], "english_summary": ["Discovered intra-atomic magnetic octupoles (AMO) in the chiral antiferromagnet Mn3Sn.", "Showed that AMO associated with Mn t2g orbitals couples to the known cluster magnetic octupole (CMO).", "Provides a microscopic multi-orbital perspective on the topological properties of Mn3Sn.", "Refines the understanding of how local orbital degrees of freedom contribute to macro-scale magnetic order."]}}, {"title": "Magnetic anisotropy in the near-stoichiometric van der Waals ferromagnet Fe3GeTe2", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/27h2-qnt8", "authors": "Riju Pal, Joyal John Abraham, Satyabrata Bera, et al.", "last_authors": "Vladislav Kataev, Alexey Alfonsov", "summary": "Quasi-two-dimensional (2D) van der Waals (vdW) ferromagnets such as the series Fe 3 − x GeTe 2 , with a relatively high Curie temperature and robust metallicity, offer an ideal platform for investigating itinerant magnetism in reduced dimensions. Here, we present a comprehensive electron spin resonance (ESR) investigation of single-crystalline, almost stoichiometric Fe 3.03 ± 0.03 GeTe 2 across wide ranges of frequencies, temperatures, and magnetic fields to gain quantitative insights into its magnetic anisotropy and spin dynamics. Frequency-dependent ESR measurements establish Fe 3 GeTe 2 as an easy-axis ferromagnet. Temperature-dependent high-field ESR reveals a large internal field that gradually decreases at higher temperatures. Remarkably, this internal field persists even above T C , indicating short-range spin correlations in Fe 3 GeTe 2 . Analysis of spin-wave modes yields a strong uniaxial magnetocrystalline anisotropy K int ≈ − 5 × 10 6 erg cm − 3 at 3 K and a large magnon gap Δ ( 3 K ) ≈ 87.8 ± 13.7 GHz ( ≈ 0.363 ± 0.057 meV ). Our study highlights that small variations in Fe content in Fe 3 GeTe 2 lead to substantial changes in the magnon gap at low temperatures, indicating the sensitivity of spin dynamics to the chemical composition. These results establish Fe 3 GeTe 2 as a model vdW ferromagnet for exploring tunable anisotropies and magnon excitations in metallic 2D magnets.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Van der Waals ferromagnet of direct interest to electronic structure/magnetism studies.", "tags": ["vanderWaals", "ferromagnet", "electronicstructure"], "image": "", "briefing": {"background": "Fe3GeTe2(FGT)는 반데르발스(vdW) 층상 구조를 가진 강자성체로, 2차원 자성 연구 및 스핀트로닉스 소자 구현을 위한 핵심 물질입니다. 특히 금속성을 유지하면서도 높은 큐리 온도(Tc)를 가져 주목받고 있습니다.", "motivation": "FGT의 자기적 특성은 철(Fe) 함량에 매우 민감합니다. 본 연구는 화학 양론에 거의 일치하는(Fe 3.03) 고품질 단결정의 자기 이방성과 스핀 동역학을 전자 스핀 공명(ESR)을 통해 정밀하게 측정하고자 했습니다.", "result": "FGT가 강한 용이축(easy-axis) 자기 이방성을 가짐을 확인하였으며, 내부 자기장이 Tc 이상에서도 잔류하여 단거리 스핀 상관관계가 존재함을 밝혀냈습니다. 또한 마그논 갭(magnon gap)의 크기를 정량화하고, Fe 함량의 미세한 변화가 이 갭에 큰 영향을 준다는 것을 확인했습니다.", "implication": "FGT의 스핀파 제어 및 마그논 기반 소자 설계 시 화학 양론적 조절이 결정적인 변수임을 시사하며, 2차원 자성체의 상전이 거동에 대한 미시적 정보를 제공합니다.", "novelty": "독자의 관심 물질인 FGT의 이방성을 ESR이라는 정밀 분광 기술로 분석했습니다. 특히 Tc 이상의 단거리 상관관계와 철 함량에 따른 마그논 갭의 민감성을 규명한 것이 핵심입니다.", "unresolved": "Fe 함량 변화가 정확히 어떤 물리적 메커니즘(예: 페르미 준위 변화 또는 교환 상호작용 변화)을 통해 마그논 갭을 바꾸는지에 대한 추가 이론 연구가 필요합니다.", "future_work": "다양한 철 결핍/과잉 시료에 대한 계통적인 ESR 측정 및 원자층 두께에 따른 이방성 변화 연구가 이어질 것으로 보입니다.", "concepts": [{"term": "자기 이방성 (Magnetic Anisotropy)", "why_emerged": "자성체의 자화 방향이 결정 구조 내의 특정 방향을 선호하는 현상을 설명하기 위해 등장했습니다.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "용이축(Easy-axis), 결정자기 이방성, 스핀-궤도 결합"}, {"term": "전자 스핀 공명 (ESR)", "why_emerged": "미시적인 스핀 환경, 자기 이방성 및 완화 과정을 고주파 자기장을 이용해 정밀하게 측정하기 위해 개발되었습니다.", "origin": "Yevgeny Zavoisky (1944)", "connections": "자기 공명 영상(MRI), 스핀 동역학, 마그논 갭"}, {"term": "반데르발스 자성체 (vdW Ferromagnet)", "why_emerged": "원자층 두께의 극박막에서도 자성이 유지되는 현상을 연구하고 2D 소자를 만들기 위해 발견되었습니다.", "origin": "CrI3, Fe3GeTe2 등의 발견 (2017년 전후)", "connections": "그래핀, 2차원 물질, 층상 구조"}], "english_summary": ["Conducted a comprehensive ESR study on near-stoichiometric Fe3GeTe2 single crystals.", "Determined strong easy-axis anisotropy and quantified the magnon gap at low temperatures.", "Observed short-range spin correlations persisting above the Curie temperature (Tc).", "Demonstrated that small variations in Fe content significantly impact the spin dynamics and magnon gap."]}}, {"title": "Magnetic anisotropy, first-order metamagnetic transitions, and weak antilocalization in the candidate topological semimetal Tb2Zn17", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/ytfq-5c74", "authors": "Rajesh Swami, Papul Sahu, Sonali S Pradhan, V. Kanchana, Z. Hossain", "last_authors": "V. Kanchana, Z. Hossain", "summary": "in the rhombohedral Th 2 Zn 17 -type structure (space group R 3 ¯ m ), a structure type known to accommodate atomic disorder. Here, the authors highlight the role of disorder-induced scattering in magnetotransport measurements, which exhibit signatures of weak antilocalization. This compound shows multiple first-order field-induced metamagnetic transitions, strong magnetic anisotropy, crystal electric field effects, and possible spin canting within its antiferromagnetic state. First-principles calculations predict multiple electron and hole Fermi pockets, along with mirror-symmetry-protected nodal rings, suggesting Tb 2 Zn 17 as a promising rare-earth-based magnetic topological semimetal.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Characterization of a new magnetic topological semimetal with potential experimental relevance.", "tags": ["topological_semimetal", "magnetotransport", "electronic_structure"], "image": "", "briefing": {"background": "위상 반금속(topological semimetal)은 밴드 구조 내에서 위상적으로 보호되는 노드(node)나 링(ring)을 가지는 물질군으로, 전자의 베리 곡률과 관련된 비정상 홀 효과 등을 연구하는 핵심 분야입니다. 희토류 화합물은 강한 자기적 모멘트와 스핀-궤도 결합(SOC)을 동시에 제공하여 이러한 위상적 특성과 자기적 질서의 상호작용을 탐구하기 좋은 플랫폼입니다.", "motivation": "Tb2Zn17 물질은 R-3m 공간군을 가지며 구조적 무질서가 나타나기 쉬운 화합물입니다. 이 연구는 이 물질이 위상 반금속으로서 어떠한 자기적 특성과 수송 현상을 보이는지, 특히 무질서가 어떻게 수송 현상에 기여하는지 규명하고자 합니다.", "result": "Tb2Zn17이 다중 메타자기적 전이와 강한 자기 이방성, 결정 전기장 효과를 가진 반강자성체임을 확인했습니다. 수송 측정에서 약한 반국소화(weak antilocalization) 신호를 발견했으며, DFT 계산을 통해 노드 링(nodal ring)의 존재를 예측했습니다.", "implication": "이 결과는 Tb2Zn17이 위상적 밴드 구조와 자기 질서가 공존하는 자기 위상 반금속 후보 물질임을 시사합니다. 무질서가 위상적 특성에 미치는 영향을 연구하는 모델 시스템이 될 수 있습니다.", "novelty": "자기적 질서가 위상적 반금속성에 미치는 영향과 무질서 시스템에서의 약한 반국소화 현상을 체계적으로 연결했다는 점이 독자 연구 분야(ARPES/위상물질)와 잘 맞닿아 있습니다.", "unresolved": "실험적으로 확인된 노드 링의 위상적 보호 정도나 ARPES를 통한 실제 밴드 구조의 직접적인 증명은 아직 부족한 상황입니다.", "future_work": "ARPES를 활용하여 계산에서 예측된 페르미 포켓과 노드 링을 직접적으로 관측하는 연구가 필요합니다.", "concepts": [{"term": "약한 반국소화 (Weak Antilocalization)", "why_emerged": "강한 스핀-궤도 결합이 있는 시스템에서 전자 간섭 효과로 인해 저항이 감소하는 현상을 설명하기 위해 도입되었습니다.", "origin": "Hikami, Larkin, Nagaoka (1980)에 의해 이론적 기틀이 마련되었습니다.", "connections": "위상 절연체 및 위상 반금속 표면 상태 확인을 위한 핵심적인 수송 지표로 활용됩니다."}, {"term": "메타자기적 전이 (Metamagnetic Transition)", "why_emerged": "강한 자기장에서 자기 모멘트가 급격히 재배열되는 현상을 기술하기 위해 필요했습니다.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "강상관 전자계의 자기적 상전이 및 이방성 연구와 깊게 연관되어 있습니다."}, {"term": "노드 링 (Nodal Ring)", "why_emerged": "밴드 구조 내에서 점이 아닌 고리 형태의 축퇴 상태를 기술하기 위해 도입되었습니다.", "origin": "위상물질 분야의 발전에 따라 이론적으로 정립되었습니다.", "connections": "Dirac/Weyl 준금속과 함께 위상 반금속의 주요 분류 중 하나입니다."}], "english_summary": ["Tb2Zn17 is identified as a candidate for a magnetic topological semimetal.", "The compound shows complex magnetic behavior, including metamagnetic transitions and spin canting.", "Magnetotransport data reveals weak antilocalization, suggesting the role of disorder.", "First-principles calculations support the existence of mirror-symmetry-protected nodal rings."]}}, {"title": "Magnetic circular dichroism of terahertz modes and selection rules of Raman-active optical phonons in the polar altermagnet candidate Mn2Mo3O8", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/sqws-q32r", "authors": "F. Schilberth, K. Vasin, M. Knauft, et al.", "last_authors": "I. Kézsmárki, J. Deisenhofer", "summary": "We investigated the magnetic and vibrational excitations in the collinear altermagnet candidate Mn 2 Mo 3 O 8 by temperature-dependent Raman scattering and magneto-optical THz time-domain transmission spectroscopy. By comparison to calculations accurately capturing the eigenfrequencies of the vibrational eigenmodes, we identify all optical phonons, including the lowest-lying Raman modes of A 1 and E 2 type, which had remained elusive in a previous Raman study. Moreover, we compare the selection rules for optically active phonons in the paramagnetic and the magnetically ordered phases of Mn 2 Mo 3 O 8 and analyze the Raman selection rules with respect to pseudoangular momentum conservation. No splitting of the degenerate paramagnetic E 2 optical phonons into circularly polarized modes could be resolved below T N , indicating negligible morphic effects of optical phonons upon magnetic ordering. In contrast, we observe strong magnetic circular dichroism at a broad THz excitation band, emerging in the magnetically ordered state. This band, potentially originating from two-magnon excitations, is only electric-dipole active and features a field-dependent two-component fine structure. Its magnetic circular dichroism vanishes above the spin-flop transition at 4 T.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Experimental study of an altermagnet candidate, aligning with user interests.", "tags": ["altermagnet", "spectroscopy", "magnetism"], "image": "", "briefing": {"background": "알터자석(altermagnet)은 비자성체와 같이 페르미 표면이 비축퇴되어 있으면서도 강자성과 같은 자기적 질서를 가지는 새로운 자기 상입니다. 이는 베리 곡률과 비정상 홀 효과 등 스핀 의존 현상을 연구하는 데 매우 중요한 물질군입니다.", "motivation": "Mn2Mo3O8이 알터자석 후보 물질로서, 자성 상태에서 어떠한 격자 진동(phonon) 특성을 보이는지, 그리고 자기적 구조가 광학적 선택 규칙에 어떻게 영향을 주는지 확인하고자 했습니다.", "result": "라만 산란 및 THz 분광법을 통해 이전에 규명되지 않았던 Raman 모드를 포함한 모든 광학 포논을 식별했습니다. 자기 상태에서 E2 포논의 갈라짐은 관측되지 않았으나, 강한 자기 원편광 이색성(MCD)을 갖는 THz 밴드를 발견했습니다.", "implication": "알터자석의 자기적 특성이 격자 진동보다 전자/자성 여기(magnon) 결합에 더 강하게 나타남을 시사합니다. 이는 알터자석에서의 스핀-포논 상호작용 이해에 기여합니다.", "novelty": "알터자석 후보 물질에서 자기장 의존적 THz MCD를 명확히 관측함으로써, 알터자석의 자기적 여기 구조를 직접적으로 프로빙할 수 있는 가능성을 열었습니다.", "unresolved": "관측된 THz 밴드가 2-magnon 여기인지, 혹은 다른 전자적 기원인지에 대한 명확한 미시적 해석이 추가로 필요합니다.", "future_work": "관측된 THz 밴드의 정체를 밝히기 위한 비탄성 중성자 산란 연구나 더 정교한 스핀-궤도 결합 계산이 요구됩니다.", "concepts": [{"term": "알터자석 (Altermagnet)", "why_emerged": "강자성도 반강자성도 아닌, 대칭성 보호에 의해 스핀 분할이 일어나는 새로운 자기 질서 형태를 기술하기 위해 필요했습니다.", "origin": "최근 이론적으로 제안되었으며, 여러 그룹(Jungwirth et al.)에서 활발히 연구 중입니다.", "connections": "비정상 홀 효과, 스핀-궤도 토크 연구와 깊은 관련이 있습니다."}, {"term": "자기 원편광 이색성 (MCD)", "why_emerged": "물질의 자기적 상태를 빛의 편광 특성을 통해 조사하기 위해 도입되었습니다.", "origin": "Faraday 및 Zeeman 효과 연구의 연장선상에 있습니다.", "connections": "자성체 연구에서 전자 구조 및 여기 상태를 조사하는 표준적인 분광학 도구입니다."}, {"term": "스핀-플롭 전이 (Spin-flop transition)", "why_emerged": "반강자성체가 자기장에서 스핀 방향을 급격히 바꾸는 전이를 기술하기 위해 필요했습니다.", "origin": "네일(Néel)의 반강자성 이론 연구 초기에 정립되었습니다.", "connections": "자기적 이방성과 외부 자기장 에너지의 경쟁으로 나타납니다."}], "english_summary": ["Mn2Mo3O8 is investigated as a candidate altermagnet.", "Raman and THz spectroscopy identify all optical phonon modes.", "No splitting of E2 phonons indicates minimal coupling to magnetic ordering.", "Strong THz magnetic circular dichroism is observed, providing insights into magnetic excitations."]}}, {"title": "Raman optical activity and helicity-dependent phonon splitting in chiral CoSi", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/tkkv-qm1v", "authors": "Yuki Suganuma, Gakuto Kusuno, Kohei Miyazaki, et al.", "last_authors": "Yoshihiko Togawa, Takuya Satoh", "summary": "in solids provides access to two distinct phenomena: Raman optical activity (ROA), an intensity difference between circular polarization channels, and helicity-dep : "Silke Paschen, Qimiao Si", "summary": "In topological materials, Berry curvature leads to intrinsic Hall responses. Focusing on time-reversal symmetric systems with broken inversion symmetry, a spontaneous (zero magnetic field) Hall effect is expected to develop under an applied electric field. Motivated by recent developments in Weyl-Ko…", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Relevant to Berry curvature and Weyl materials, though focused on transport observables.", "tags": ["theory", "Berrycurvature", "Weylsemimetal"], "image": "", "briefing": {"background": "위상 물질에서 베리 곡률(Berry curvature)은 전하 수송에 기여하며, 특히 시간 반전 대칭성이 보존되는 시스템에서 외부 전기장에 의한 응답 연구가 중요합니다.", "motivation": "Weyl-Kondo 반금속 등에서 나타나는 비평형 상태의 홀 응답을 베리 곡률의 관점에서 이론적으로 해석하고자 합니다.", "result": "시간 반전 대칭성이 있고 반전 대칭성이 깨진 시스템에서 전기장이 인가될 때 자발적인 홀 효과가 발생할 수 있음을 이론적으로 도출했습니다.", "implication": "위상 물질의 수송 현상을 이해하는 데 있어 단순히 평형 상태의 특성뿐만 아니라, 비평형 상태의 동역학적 특성이 결정적인 역할을 할 수 있음을 보여줍니다.", "novelty": "외부 자기장 없이 전기장만으로 유도되는 홀 효과를 베리 곡률 기반으로 정교화하여, Weyl 물질군에서의 수송 현상을 설명하는 틀을 제시했습니다.", "unresolved": "실제 실험에서 발생하는 산란 효과나 기타 소산 메커니즘이 순수한 베리 곡률 효과와 어떻게 상호작용하는지는 추가적인 논의가 필요합니다.", "future_work": "다양한 위상 반금속에서의 전기장 응답 실험 측정 및 비선형 수송 현상에 대한 후속 이론 연구가 예상됩니다.", "concepts": [{"term": "Berry curvature", "why_emerged": "위상적으로 비자명한 밴드 구조를 가진 물질에서 Bloch 전자의 이상 속도(anomalous velocity)를 설명하기 위해 필요했습니다.", "origin": "Michael Berry (1984)의 기하학적 위상 이론에서 기원합니다.", "connections": "이상 홀 효과, 위상 불변량, Chern 절연체."}, {"term": "Weyl semimetal", "why_emerged": "운동량 공간에서 점 접촉(point nodes)을 가진 위상 물질을 분류하고 그 독특한 표면 상태를 연구하기 위해 도입되었습니다.", "origin": "Herring(1937)이 제안하고 최근 수년 내 실험적으로 다수 구현되었습니다.", "connections": "베리 곡률, 이상 홀 효과, 페르미 아크."}], "english_summary": ["Develops a theoretical framework for nonequilibrium Hall response driven by Berry curvature.", "Focuses on time-reversal symmetric systems with broken inversion symmetry.", "Demonstrates that a spontaneous Hall effect can emerge under an applied electric field.", "Bridges the gap between topological electronic structure and nonlinear transport observables."]}}, {"title": "Topological Multicomponent Superconductivity with Sizable s-Wave Admixture in Twisted Bilayer Cuprates", "journal": "PRL_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/6cyn-zbpm", "authors": "Yu-Hang Li, Congjun Wu, Wang Yang", "last_authors": "Congjun Wu, Wang Yang", "summary": "An investigation of three-component superconductivity in twisted bilayer cuprates shows that s-wave pairing does not preclude chiral topological superconductivity.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Relevant study on twisted bilayer systems and topological pairing in cuprates.", "tags": ["twistedbilayer", "cuprate", "topologicalsuperconductivity"], "image": "", "briefing": {"background": "트위스트된 이중층 구조(twisted bilayer)는 모아레 무늬를 통해 밴드 구조를 엔지니어링하고 새로운 상관 전자 상을 유도하는 강력한 플랫폼입니다. 특히 고온 초전도체인 구리산화물(cuprate)을 이 구조에 적용하면 기존과는 다른 위상적 초전도성을 구현할 수 있을지에 대한 관심이 큽니다.", "motivation": "구리산화물 트위스트 이중층에서 다성분 초전도체가 형성될 때, 통상적으로 위상적 특성을 방해한다고 여겨지는 s-파(s-wave) 성분이 섞이더라도 여전히 카이랄(chiral) 위상 초전도성이 생존할 수 있는지를 이론적으로 규명하고자 했습니다.", "result": "s-파 성분이 혼합되어 있음에도 불구하고, 특정 조건 하에서 카이랄 위상 초전도 상태가 안정적으로 존재할 수 있음을 이론적 모델링을 통해 보였습니다.", "implication": "고온 초전도체 기반의 위상 양자 소자 개발 가능성을 열어주며, 복합적인 대칭성을 갖는 초전도체 연구의 새로운 방향을 제시합니다.", "novelty": "기존의 's-파 혼합 시 위상성 파괴'라는 고정관념을 깨고, 다성분 초전도체에서 위상 위상이 공존할 수 있음을 증명했습니다.", "unresolved": "실제 트위스트된 구리산화물 샘플을 제작하고 관측하는 실험적 검증이 여전히 어렵습니다.", "future_work": "구체적인 물질 시스템 내에서의 전자 간 상호작용 강도와 트위스트 각도에 따른 상도(phase diagram) 정밀 계산이 필요합니다.", "concepts": [{"term": "카이랄 위상 초전도체", "why_emerged": "시간 역전 대칭성이 깨진 상태에서 위상적 보호를 받는 가장자리를 가지는 초전도체를 찾기 위해 도입되었습니다.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "위상 절연체, 마요라나 페르미온"}, {"term": "다성분 초전도성", "why_emerged": "단일 파라미터로 기술되지 않는 복잡한 대칭성을 갖는 초전도체를 설명하기 위해 필요합니다.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "비재래적 초전도체, 다중 밴드 초전도"}], "english_summary": ["Investigates three-component superconductivity in twisted bilayer cuprates.", "Shows that s-wave pairing admixture does not necessarily destroy chiral topological superconductivity.", "Provides a theoretical framework for engineering topological phases in cuprate heterostructures."]}}, {"title": "Ultrasensitive Strain Modulation of Terahertz Magnons at a Magnetic Phase Transition", "journal": "PRL_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/wk6v-1x5s", "authors": "Lichen Wang, Sajna Hameed, Yiran Liu, et al.", "last_authors": "Matteo Minola, Bernhard Keimer", "summary": "Motivated by the prospect of strain control of terahertz (THz) magnons, we have used resonant x-ray diffraction and Raman scattering to investigate the magnetic ground state and excitations of the layered Mott insulator Ca 2 RuO 4 under uniaxial strain. We discovered a strain-induced phase transition between two antiferromagnetic states that differ in the sign of the interlayer exchange interaction. Although this interaction is weak and partially frustrated, the corresponding magnon energies of the two states differ by more than 10% ( ∼ 0.3 THz ). Our theoretical analysis explains this surprising observation by tracing the origin of both the sign reversal of the interlayer coupling and the magnon energy to the spin-orbital composition of the Ru valence electrons. The extreme strain sensitivity of the THz magnon energy near a magnetic phase transition opens up pathways toward a new generation of “transition-edge” magnonic devices.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Experimental study of a layered Mott insulator using resonant X-ray diffraction and strain modulation.", "tags": ["experiment", "Ca2RuO4", "Mottinsulator", "magnons"], "image": "", "briefing": {"background": "Ca2RuO4는 모트 절연체로서 스핀, 궤도, 격자 자유도가 강하게 결합되어 있어 외적 자극(응력 등)에 매우 민감하게 반응하는 물질입니다. 테라헤르츠(THz) 마그논은 차세대 마그노닉 소자의 핵심 요소로 주목받고 있습니다.", "motivation": "단축 응력(uniaxial strain)을 가했을 때 이 물질의 자기적 위상 전이와 그에 따른 THz 마그논의 거동이 어떻게 변하는지, 그 미시적 메커니즘을 밝히고자 했습니다.", "result": "응력에 의해 층간 자기 교환 상호작용의 부호가 바뀌는 상전이를 발견했으며, 이 과정에서 마그논 에너지가 10% 이상 변하는 민감한 응답을 확인했습니다.", "implication": "상전이 근처에서 외부 자극을 통해 마그논 주파수를 정밀하게 제어할 수 있음을 보여주어, '전이-에지(transition-edge)' 마그노닉 소자 개발의 가능성을 입증했습니다.", "novelty": "응력 조절을 통한 자기 구조의 미세한 변화가 어떻게 THz 마그논의 급격한 에너지 변화로 이어지는지를 spin-orbital 조성 관점에서 명확히 규명했습니다.", "unresolved": "이러한 극단적인 민감도가 실제 상온 혹은 더 넓은 범위의 소자 운용 조건에서도 유지될지는 미지수입니다.", "future_work": "다양한 전이 금속 산화물로 확장하여 응력 기반의 마그논 파동 제어 기술을 고도화할 계획입니다.", "concepts": [{"term": "THz 마그논", "why_emerged": "고주파수 대역에서 스핀 정보를 전달하는 준입자로서 통신 소자의 고속화에 필요합니다.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "스핀트로닉스, 비탄성 중성자 산란"}, {"term": "모트 절연체", "why_emerged": "강한 전자 상관관계로 인해 밴드 이론으로는 절연체임을 설명할 수 없는 물질들을 해석하기 위해 등장했습니다.", "origin": "Nevill Mott (1949)", "connections": "하버드 모델, 구리산화물 고온 초전도체"}], "english_summary": ["Studies Ca2RuO4 using resonant X-ray diffraction under uniaxial strain.", "Discovers a strain-induced magnetic phase transition reversing interlayer coupling.", "Demonstrates high sensitivity of THz magnon energy to strain near the phase transition.", "Proposes potential for transition-edge magnonic devices."]}}, {"title": "Unveiling High-Energy Ultrafast Responses Driven by Fermi-Level Gap Opening in Charge-Density Waves", "journal": "PRL_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/vz71-r52l", "authors": "Qiong Wu, Tianchen Hu, Junhan Huang, et al.", "last_authors": "Tao Dong, Nan-Lin Wang", "summary": "in superconductors and correlated electron systems. However, how a small gap opening near the Fermi surface affects the spectral changes in the high-energy interband…", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Relevant to CDW spectral dynamics, potentially applicable to AV3Sb5.", "tags": ["CDW", "ultrafast", "spectroscopy"], "image": "", "briefing": {"background": "전하 밀도 파(CDW)는 물질의 페르미 표면에 갭을 형성하며 전자 구조를 크게 재구성합니다. 이러한 상태를 초고속 레이저 펄스로 섭동했을 때 나타나는 스펙트럼 변화는 물질의 상관관계를 이해하는 중요한 열쇠가 됩니다.", "motivation": "CDW 갭 형성이 고에너지 대역의 밴드 간 전자 응답(interband response)에 구체적으로 어떤 영향을 주는지 규명하고자 했습니다.", "result": "CDW 갭 개방이 전자 스펙트럼의 고에너지 응답을 어떻게 변조하는지에 대한 데이터를 제시하고 있습니다.", "implication": "초고속 분광학을 이용한 CDW 물질 연구에서 갭 형성의 동역학적 특징을 파악하는 방법론을 제공합니다.", "novelty": "저에너지 물리로만 주로 논의되던 CDW 현상이 고에너지 전자 구조에 미치는 영향을 초고속 분광으로 직접 연결했습니다.", "unresolved": "초록이 불완전하여 구체적인 메커니즘이나 특정 물질에서의 효과가 명확하지 않습니다.", "future_work": "AV3Sb5와 같은 Kagome 금속에서의 CDW 동역학 연구에 이 방법론을 적용할 필요가 있습니다.", "concepts": [{"term": "전하 밀도 파 (CDW)", "why_emerged": "저차원 물질에서 전자 밀도의 주기적 변조와 격자 왜곡이 결합된 상을 설명하기 위해 도입되었습니다.", "origin": "Peierls (1955)", "connections": "Kagome 금속, 페르미 면 중첩(nesting)"}, {"term": "초고속 분광학", "why_emerged": "전자-포논 결합이나 전자 간 상관관계의 실시간 동역학을 관측하기 위해 필수적입니다.", "origin": "Ahmed Zewail (1990년대)", "connections": "펌프-프로브 분광, 시간 분해 ARPES"}], "english_summary": ["Investigates the high-energy ultrafast responses of materials with CDW.", "Focuses on how the opening of a small gap at the Fermi surface affects spectral changes.", "Provides insights into electronic correlations and CDW dynamics."]}}, {"title": "Layer-decoupled electronic reconstruction and a robust charge density wave in GdTe3", "journal": "npj_QuantumMaterials", "source": "Gemini", "link": "https://www.nature.com/articles/s41535-026-00946-9", "authors": "Xin Zheng, Yunbo Wu, Tongrui Li, et al.", "last_authors": "Shengtao Cui, Zhe Sun", "summary": "Layer-decoupled electronic reconstruction and a robust charge density wave in GdTe 3", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "High relevance to CDW and electronic reconstruction in tellurides, related to 112 telluride projects.", "tags": ["experiment", "GdTe3", "chargedensitywave"], "image": "https://pubads.g.doubleclick.net/gampad/ad?iu=/285/npjquantmats.nature.com/article&sz=728x90&c=331044032&t=pos%3Dtop%26type%3Darticle%26artid%3Ds41535-026-00946-9%26doi%3D10.1038/s41535-026-00946-9%26subjmeta%3D301,639,766%26kwrd%3DMaterials+science,Physics", "briefing": {"background": "Rare-earth tritellurides (RTe3)은 전형적인 2차원 전하밀도파(CDW) 물질군으로, CDW 형성과 페르미 표면 재구성이 어떻게 상호작용하는지 연구하기 위한 플랫폼입니다.", "motivation": "GdTe3에서 층간 결합이 약한 구조적 특성을 이용하여, 층별로 독립적인 전자 재구성이 발생하는지 확인하고자 합니다.", "result": "GdTe3 내에서 층별로 분리된 전자 재구성이 일어나며, 이러한 특성이 외부 섭동에 강인한 CDW 상태를 유지하는 데 기여함을 밝혔습니다.", "implication": "이 연구는 2차원 재료의 층간 결합 제어가 CDW 양자 질서를 조절하는 데 핵심적인 변수임을 시사합니다.", "novelty": "기존 연구들이 주로 벌크 특성에 집중한 것과 달리, GdTe3의 층간 디커플링 효과를 명확히 분리해 분석한 점이 독특합니다.", "unresolved": "층별 디커플링이 정확히 어떤 미시적 상호작용에 의해 지배되는지에 대한 기전은 여전히 토의의 여지가 있습니다.", "future_work": "ARPES를 이용해 각 층별 밴드 구조를 분해하거나, 압력 제어를 통한 층간 결합 세기 변화 연구가 예상됩니다.", "concepts": [{"term": "Charge Density Wave", "why_emerged": "전자와 격자 사이의 강한 상호작용으로 페르미 표면이 중첩될 때 발생하는 에너지 안정화 상태입니다.", "origin": "Peierls (1955년)의 1차원 금속 불안정성 이론이 시초입니다.", "connections": "Kagome 금속의 CDW 현상 및 초전도성과의 경쟁 관계 연구와 직접 연결됩니다."}, {"term": "Electronic Reconstruction", "why_emerged": "CDW나 자기적 질서로 인해 페르미 표면이 재구성되어 밴드 구조가 바뀌는 현상을 설명하기 위해 사용됩니다.", "origin": "초록 정보만으로는 특정하기 어렵습니다.", "connections": "고온 초전도체 및 중페르미온 시스템의 페르미 표면 재구성 연구와 맥락을 같이합니다."}], "english_summary": ["GdTe3 exhibits a layer-decoupled electronic reconstruction.", "The CDW state remains robust despite the observed electronic decoupling.", "The study highlights the role of interlayer interaction in modulating collective electronic states.", "Findings contribute to understanding CDW formation in layered telluride systems."]}}, {"title": "Coupled magnetic and lattice excitations in multiferroic Ba3HoRu2O9: Insights from neutron scattering, Raman spectroscopy, and machine-learned phonon calculations", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/1fcf-72wv", "authors": "E. Kushwaha, S. Ghosh, G. Roy, et al.", "last_authors": "D. T. Adroja, T. Basu", "summary": "in energy. The hexagonal 6H perovskite ${\\mathrm{Ba}}_{3}{\\mathrm{HoRu}}_{2}{\\mathrm{O}}_{9}$ provides an…", "tier": "B_IMPORTANT_CONDMAT", "score": "7", "reason": "Multimodal experimental and theoretical study of magnetic/lattice excitations in a complex compound.", "tags": ["experiment", "neutronscattering", "phonon", "magnetism"], "image": "", "briefing": {"background": "다강성(Multiferroic) 물질은 자기적 질서와 격자 구조가 긴밀하게 결합되어 있어, 이를 이용한 새로운 스핀-격자 결합 기전 탐구가 필수적입니다.", "motivation": "6H 육방정계 페로브스카이트인 Ba3HoRu2O9에서 자기적 들뜸과 포논 사이의 비자명한 상호작용을 규명하고자 합니다.", "result": "중성자 산란과 라만 분광법, 기계 학습 기반의 포논 계산을 통해 자기적 질서와 격자 진동이 결합된 하이브리드 들뜸을 확인했습니다.", "implication": "다강성 물질의 복잡한 여기 스펙트럼 해석에 머신러닝 기반 포논 계산이 강력한 도구임을 입증했습니다.", "novelty": "실험적 중성자/라만 데이터와 머신러닝 포논 계산을 결합하여 복잡한 다강체 시스템의 들뜸을 규명한 접근이 주목됩니다.", "unresolved": "결합의 강도가 저온에서 자성 전이와 어떤 정량적 관계를 갖는지 완전히 규명되지 않았습니다.", "future_work": "다른 희토류 원소를 치환하여 자기적-격자 결합의 튜닝 가능성을 탐구할 것으로 예상됩니다.", "concepts": [{"term": "Multiferroic", "why_emerged": "전기적 편극과 자기적 질서가 동시에 존재하는 물질에서 새로운 물리적 기능을 찾기 위해 등장했습니다.", "origin": "Schmid (1994년)가 용어를 정의했습니다.", "connections": "스핀-격자 결합 기반의 센서 및 메모리 소자 연구와 연결됩니다."}, {"term": "Neutron Scattering", "why_emerged": "자성 이온의 자기 모멘트 분포와 포논 분산 관계를 동시에 조사할 수 있는 유일한 수단입니다.", "origin": "Shull과 Brockhouse의 1994년 노벨상 연구가 시초입니다.", "connections": "양자 자기 상태 및 자성 위상 물질의 핵심 분석 도구입니다."}], "english_summary": ["Multiferroic Ba3HoRu2O9 studied via multimodal experimental techniques.", "Neutron scattering and Raman spectroscopy reveal coupled magnetic-lattice excitations.", "Machine-learned phonon calculations successfully clarify the complex spectrum.", "Findings emphasize the role of spin-lattice interactions in multiferroic hexagonal perovskites."]}}, {"title": "Electron-phonon decoupling in the quantum Hall regime", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/1nqs-dy38", "authors": "R. Carroll, G. Auton, J. Gough, et al.", "last_authors": "D. A. Ritchie, M. Pepper", "summary": "The temperature dependence of the breakdown of the quantum Hall effect in a GaAs / Al x Ga 1 − x As two-dimensional electron gas is reported. Two-terminal current-voltage characteristics show hysteretic current jumps of greater than three orders of magnitude. We demonstrate that this is a manifestation of electron overheating that can be explained by an electron-phonon decoupling mechanism; an overheating model can explain the experimental observations with lattice temperatures varying between 65 and 800 mK. Applied voltage-induced electron overheating in disordered materials has previously been demonstrated in systems with an Arrhenius temperature dependence; in this work the dominant transport mechanism is that of Efros-Shklovskii hopping. Notably, it has been predicted that electron-phonon decoupling is harder to observe in such a system, when compared to a system in which transport takes an Arrhenius form.", "tier": "B_IMPORTANT_CONDMAT", "score": "7", "reason": "Experimental study of quantum Hall regime, relevant to the broader topological materials focus.", "tags": ["experiment", "quantumHall", "phonon"], "image": "", "briefing": {"background": "양자 홀 효과(QHE) 영역에서 전자의 에너지 상태는 밴드 구조의 특수성으로 인해 격자와의 에너지 교환이 제한되는 현상이 나타납니다.", "motivation": "GaAs/AlGaAs 시스템에서 QHE 파괴 현상이 전자 과열 및 전자-포논 디커플링으로 설명될 수 있는지 확인하고자 합니다.", "result": "QHE 영역에서의 전류 점프 현상이 전자-포논 디커플링 모델로 설명되며, 특히 Efros-Shklovskii 호핑 전도 방식이 지배적임을 증명했습니다.", "implication": "위상 절연체나 저차원 전자계에서의 열전달 특성을 이해하는 데 중요한 기초 자료를 제공합니다.", "novelty": "기존 Arrhenius 모델과 달리 Efros-Shklovskii 호핑 체제에서 전자-포논 디커플링을 관찰하기 어려운 것으로 알려졌으나, 이를 실증했다는 점이 중요합니다.", "unresolved": "디커플링이 관찰되는 미시적 산란 과정의 정확한 메커니즘은 추가 연구가 필요합니다.", "future_work": "더 낮은 온도 범위에서의 열전도율 측정 및 무질서도(disorder) 제어를 통한 호핑 전도 연구가 이어질 것입니다.", "concepts": [{"term": "Quantum Hall Regime", "why_emerged": "2차원 전자계에 강한 자기장이 걸릴 때 발생하는 란다우 준위와 위상적 전도 특성을 설명하기 위해 등장했습니다.", "origin": "Klitzing (1980년)에 의해 발견되었습니다.", "connections": "위상학적 물질, Berry curvature 및 엣지 상태 연구의 기초입니다."}, {"term": "Efros-Shklovskii Hopping", "why_emerged": "쿨롱 상호작용이 무질서한 시스템에서 전도 기전을 설명하기 위해 수정된 Mott 호핑 모델입니다.", "origin": "Efros와 Shklovskii (1975년)에 의해 제안되었습니다.", "connections": "2차원 및 비정질 시스템의 저온 전도도 연구와 연결됩니다."}], "english_summary": ["Electron-phonon decoupling observed in the quantum Hall regime of GaAs systems.", "Hysteretic current jumps are attributed to electron overheating.", "Transport is dominated by Efros-Shklovskii hopping mechanism.", "The study challenges previous predictions regarding the difficulty of observing this effect."]}}, {"title": "Fabry-Pérot interferometry with stochastic anyonic sources", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/m82l-n8gt", "authors": "Sarthak Girdhar, Edvin G. Idrisov, Thomas L. Schmidt", "last_authors": "Edvin G. Idrisov, Thomas L. Schmidt", "summary": "We investigate the interference of Laughlin quasiparticles (QPs) in the fractional quantum Hall regime that are stochastically injected into a Fabry-Pérot interferometer. We find that the effective Aharonov-Bohm (AB) phase accumulated along the interferometer loop acquires an additional contribution…", "tier": "B_IMPORTANT_CONDMAT", "score": "7", "reason": "Theoretical study of anyonic interference in FQH, relevant to fundamental CM.", "tags": ["fractional_quantum_hall", "anyons"], "image": "", "briefing": {"background": "분수 양자 홀 효과(FQH) 상태에서 나타나는 준입자(quasiparticle)는 일반적인 페르미온이나 보손이 아닌, 입자 교환 시 위상이 변하는 애니온(anyon) 특성을 가집니다.", "motivation": "Fabry-Pérot 간섭계를 이용해 애니온의 통계적 성질을 검증할 때, 준입자가 확률적으로 주입되는 실제 환경에서의 간섭 패턴 변화를 이론적으로 이해하고자 함입니다.", "result": "간섭 루프를 따라 축적되는 아하로노프-봄(Aharonov-Bohm) 위상에 확률적 주입에 의한 추가적인 기여가 발생하며, 이는 기존의 간섭 모델을 수정해야 함을 보여줍니다.", "implication": "애니온의 위상학적 성질을 실험적으로 확인하려는 시도에서, 입자 주입의 비결정론적 특성이 측정 데이터에 미치는 영향을 보정할 수 있는 이론적 토대가 됩니다.", "novelty": "기존의 이상적인 정적 간섭 모델을 넘어, 확률적인 입자 흐름이 간섭 패턴에 미치는 영향을 다루어 실제 소자 환경에 더 가까운 해석을 제공합니다.", "unresolved": "실제 실험에서 준입자 간의 쿨롱 상호작용이 주입 확률과 결합하여 발생하는 비선형 효과에 대해서는 추가적인 정밀 연구가 필요합니다.", "future_work": "실제 FQH 소자에서 준입자 주입의 통계적 분포를 조절하여 이론적 예측을 검증하는 저온 수송 측정 실험이 기대됩니다.", "concepts": [{"term": "애니온 (Anyons)", "why_emerged": "2차원 시스템에서 입자 교환 시 위상이 자유로운 통계를 가질 수 있다는 양자역학적 가능성 때문에 등장했습니다.", "origin": "Leinaas와 Myrheim에 의해 1977년 제안되었습니다.", "connections": "분수 양자 홀 효과, 위상학적 양자 컴퓨팅, 비아벨 통계와 연결됩니다."}, {"term": "Fabry-Pérot 간섭계", "why_emerged": "광학에서 두 반사면 사이의 다중 반사를 이용한 정밀 간섭 측정을 위해 개발되었으며, 전자 소자에서는 준입자의 간섭 위상을 측정하는 데 활용됩니다.", "origin": "Charles Fabry와 Alfred Pérot에 의해 1897년 고안되었습니다.", "connections": "아하로노프-봄 효과, 엣지 상태(edge state) 수송 연구와 연결됩니다."}], "english_summary": ["Analyzes Fabry-Pérot interferometry with stochastic Laughlin quasiparticle injection.", "Identifies an additional phase contribution beyond the standard Aharonov-Bohm phase.", "Provides a theoretical framework to interpret non-deterministic particle statistics in FQH devices."]}}, {"title": "Giant spin-to-charge conversion by tailoring magnetically proximitized topological Dirac semimetal", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/jg51-9xf7", "authors": "Masayuki Ishida, Soichiro Fukuoka, Takahiro Chiba, Yohei Kota, Masaaki Tanaka, Le Duc Anh", "last_authors": "Masaaki Tanaka, Le Duc Anh", "summary": "in Fe/ α -Sn heterostructures.The estimated inverse Edelstein length reaches −3.1±1.0 nm—among the largest reported at room-temperature—when α -Sn thickness is 25 nm. This performance is attributed to the interplay of magnetic proximity and spin diffusion. Topological surface states at the Fe interface are suppressed, whereas those at the opposite interface are preserved by thickness tuning. These findings establish magnetic proximity engineering as a promising strategy for realizing efficient spintronic devices.", "tier": "B_IMPORTANT_CONDMAT", "score": "7", "reason": "Experimental study on topological semimetal heterostructures relevant to spintronics and topology.", "tags": ["experimental", "topological", "Dirac", "spintronics"], "image": "", "briefing": {"background": "위상 절연체나 디랙 반금속 표면의 위상학적 상태는 스핀과 운동량이 고정된 '스핀-운동량 잠금' 현상을 보이며, 이는 고효율 스핀-전하 변환 소자 구현의 핵심입니다.", "motivation": "자성체와 위상 물질의 이종 접합에서 근접 효과를 활용해 실온에서 구동 가능한 거대 스핀-전하 변환 효율을 달성하고자 합니다.", "result": "Fe/α-Sn 이종 구조에서 α-Sn 두께를 조절하여 표면 상태를 최적화함으로써 실온에서 세계 최고 수준의 역 에델슈타인(inverse Edelstein 체 이론이 적용되지 않는 강상관 전자계의 대표적 모델입니다.", "motivation": "1차원 계에서 전자의 산란과 재분배 과정이 저온에서 어떻게 유체역학적 요동으로 나타나는지 그 이론적 체계를 구축하고자 함입니다.", "result": "전자의 수송과 완화 과정이 단순히 하나의 현상이 아니라, 입자 재분배와 평형화라는 두 가지 다른 등급의 동역학으로 분리됨을 밝혔습니다.", "implication": "1차원 나노와이어나 탄소 나노튜브 등 저차원 시스템의 수송 현상을 이해하는 이론적 기반을 마련하였으며, 열적 및 전기적 수송 계수의 미시적 도출을 가능케 합니다.", "novelty": "기존 럿팅거 액체 이론을 넘어 유체역학적 접근을 통해 1차원 계의 비평형 동역학을 체계화했습니다.", "unresolved": "실제 실험에서 발생하는 불순물에 의한 산란이 유체역학적 흐름과 어떻게 경쟁하고 결합하는지에 대한 명확한 해답은 미완입니다.", "future_work": "본 이론을 바탕으로 한 1차원 나노와이어의 온도 의존적 전기 전도도 측정 및 초고속 동역학 실험이 필요합니다.", "concepts": [{"term": "럿팅거 액체 (Luttinger Liquid)", "why_emerged": "1차원 계에서 페르미 액체 이론이 붕괴함에 따라, 스핀과 전하의 자유도가 분리되는 현상을 기술하기 위해 필요했습니다.", "origin": "Tomonaga와 Luttinger에 의해 제안된 이후 Haldane에 의해 완성되었습니다.", "connections": "스핀-전하 분리, 양자 와이어, 탄소 나노튜브와 연결됩니다."}, {"term": "유체역학적 요동 (Hydrodynamic Fluctuations)", "why_emerged": "강하게 상호작용하는 다체계에서 입자 개별의 거동보다 집단적 흐름의 요동이 물리적 특성을 지배할 때 필요합니다.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "나비에-스토크스 방정식, 2차원 전자 액체, 소산적 흐름과 연결됩니다."}], "english_summary": ["Develops a theory for hydrodynamic fluctuations in 1D quantum liquids.", "Distinguishes between particle redistribution and equilibration relaxation processes.", "Provides insight into electron relaxation in single-channel wires.", "Advances understanding of non-Fermi liquid behavior in 1D systems."]}}, {"title": "Magnetic-field control of the excitonic transition in Ta2NiSe5", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/9d27-6dvw", "authors": "Giacomo Mazza", "last_authors": "Giacomo Mazza", "summary": "The formation of excitonic insulator phases in quantum materials is often masked by structural distortions caused by the coupling between electronic and phononic order parameters. Here, for the candidate material ${\\mathrm{Ta}}_{2}{\\mathrm{NiSe}}_{5}$, we show that sufficiently high magnetic fields …", "tier": "B_IMPORTANT_CONDMAT", "score": "7", "reason": "Interesting magnetic field effects on a correlated quantum material related to user's materials interest.", "tags": ["excitonicinsulator", "magnetism", "Ta2NiSe5"], "image": "", "briefing": {"background": "Ta2NiSe5는 전자와 정공이 결합한 엑시톤이 응축되어 형성되는 엑시톤 절연체 후보 물질로 오랫동안 연구되어 왔으나, 구조적 변형과 전자-격자 결합이 이 위상을 가리는 문제가 있었습니다.", "motivation": "외부 자기장을 인가하여 구조적 변형과 얽힌 엑시톤 절연체 상의 안정성을 테스트하고, 전자적 상태의 변화를 추적하고자 합니다.", "result": "충분히 강한 자기장이 인가되었을 때 Ta2NiSe5의 엑시톤 전이 과정에 제어가 가능함을 보였습니다.", "implication": "자기장을 정밀하게 조절함으로써 엑시톤 절연체 상을 실험적으로 분리하거나 제어할 수 있는 가능성을 제시하며, 이는 correlated material 연구의 새로운 파라미터를 제공합니다.", "novelty": "구조적 요인에 의해 가려졌던 엑시톤 절연체 상의 본질을 자기장을 이용해 순수 전자적 관점에서 분리해낼 가능성을 보였습니다.", "unresolved": "자기장 인가 시 구조적 변형이 완전히 배제되는지, 혹은 격자와의 결합이 어떻게 동적으로 반응하는지에 대한 미시적 메커니즘은 추가 연구가 필요합니다.", "future_work": "강자기장 환경에서의 ARPES 측정 또는 초고속 분광학을 통해 엑시톤 응축체의 동역학적 변화를 직접 관찰하는 실험이 필요합니다.", "concepts": [{"term": "엑시톤 절연체 (Excitonic Insulator)", "why_emerged": "전자-정공 쌍의 결합 에너지가 밴드 갭보다 클 때 발생하는 기저 상태의 불안정성을 설명하기 위해 필요했습니다.", "origin": "Knox (1963) 등에 의해 이론적으로 처음 제안되었습니다.", "connections": "반도체 물리, Mott 절연체, BCS 이론과 연결됩니다."}], "english_summary": ["Ta2NiSe5 is a candidate for an excitonic insulator phase, often obscured by structural distortions.", "The study examines how high magnetic fields influence the transition and electronic states.", "Results suggest that magnetic fields can act as a control parameter to tune the excitonic transition.", "This provides a potential pathway to decouple electronic and structural orders in correlated quantum materials."]}}, {"title": "Signature of field-induced spin relaxation in the paramagnetic regime of the frustrated triangular antiferromagnet NdZnAl11O19", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/3jvc-cng7", "authors": "Manshi Rani, Dheeraj Ranaut, Manh Duc Le, Mohamed Aouane, G. B. G. Stenning, K. Mukherjee", "last_authors": "G. B. G. Stenning, K. Mukherjee", "summary": "This study explores the influence of positional disorder on magnetic behavior, focusing on the presence of orphan spins that are effectively decoupled from the collective spin dynamics. Here, the authors investigate the positional disorder and its impact on crystal electric field (CEF) excitations using inelastic neutron scattering measurements. Interestingly, a field-induced spin relaxation associated with the orphan spins, with an energy barrier corresponding to the CEF gap is revealed through ac susceptibility measurements.", "tier": "B_IMPORTANT_CONDMAT", "score": "7", "reason": "Neutron scattering study on frustrated magnetism, relevant to broader quantum magnetism interests.", "tags": ["experimental", "neutron-scattering", "magnetism"], "image": "", "briefing": {"background": "좌절된 자성체(frustrated magnets)는 기하학적 구조로 인해 스핀 정렬이 억제되어 다양한 이색적 상태를 보이며, 이와 관련된 비정질(disorder)의 효과를 이해하는 것이 핵심 과제입니다.", "motivation": "NdZnAl11O19 물질의 위치적 무질서가 결정장(CEF) 여기와 전체 스핀 동역학에 미치는 영향을 규명하고자 합니다.", "result": "비정질로 인해 고립된 'orphan spins'이 존재함을 확인하고, 이 스핀들이 결정장 갭 에너지와 관련된 장 유도 스핀 완화(field-induced spin relaxation) 현상을 보임을 증명했습니다.", "implication": "무질서가 단순한 노이즈가 아니라, 자성체 내에서 별도의 스핀 동역학을 형성하는 중요한 인자임을 보여줍니다.", "novelty": "비탄성 중성자 산란을 통해 orphan spin과 결정장 여기 사이의 상관관계를 명확히 밝혔습니다.", "unresolved": "orphan spin의 구체적인 공간적 분포와 이들이 전체 시스템의 기저 상태에 미치는 장기적인 영향은 여전히 논의가 필요합니다.", "future_work": "저온에서의 비열 측정 및 자화율의 세부적인 온도 의존성을 통한 이론 모델과의 비교 연구가 기대됩니다.", "concepts": [{"term": "Orphan spins", "why_emerged": "기하학적 좌절을 가진 시스템에서 무질서로 인해 자기적 질서에 참여하지 못하는 스핀을 설명하기 위해 필요했습니다.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "스핀 유리, 양자 자성체, 기하학적 좌절 시스템과 연결됩니다."}, {"term": "결정장 (Crystal Electric Field, CEF)", "why_emerged": "원자 주위의 리간드들에 의해 생성된 전기장이 d 또는 f 궤도 함수의 에너지 준위를 분리하는 현상을 이해하기 위해 필요했습니다.", "origin": "Bethe (1929)에 의해 체계화되었습니다.", "connections": "란타넘족 자성체, 전자 구조론과 밀접합니다."}], "english_summary": ["Investigation of frustrated antiferromagnet NdZnAl11O19 using inelastic neutron scattering.", "The study focuses on the impact of positional disorder and the emergence of orphan spins.", "Findings n parity, Topological phase transitions."}], "english_summary": ["Quantum inductance is proposed as a probe to distinguish Majorana zero modes.", "The method differentiates true topological signals from trivial state mimics.", "This approach mitigates false positive results in Majorana nanowire experiments.", "It provides a phase-sensitive tool for verifying fermion parity switching."]}}, {"title": "Fully integrated perovskite active polaritonic circuits", "journal": "Nature", "source": "Gemini", "link": "https://www.nature.com/articles/s41586-026-11299-5", "authors": "Antonio Fieramosca, Vincenzo Ardizzone, Rosanna Mastria, et al.", "last_authors": "Ilenia Viola, Daniele Sanvitto", "summary": "A fully integrated perovskite polaritonic circuit that brings the functionalities of fully integrated on-chip polaritonic systems simultaneously delivering room-temperature waveguide lasing, controllable optical routing and amplification together in a single-step-grown platform is shown.", "tier": "C_MAYBE", "score": "6", "reason": "Experimental study of integrated perovskite materials, relevant to broader 2D/materials interests.", "tags": ["material", "perovskite", "photonics"], "image": "https://media.springernature.com/m685/springer-static/image/art%3A10.1038%2Fs41586-026-11299-5/MediaObjects/41586_2026_11299_Fig1_HTML.png", "briefing": {"background": "반도체 기반 광소자의 한계를 극복하기 위해 페로브스카이트 물질을 활용한 소형 고효율 광회로 기술이 주목받고 있음.", "motivation": "단일 칩 위에서 발광, 라우팅, 증폭을 모두 수행하는 통합 페로브스카이트 극성 회로(polaritonic circuit)를 실현하고자 함.", "result": "단일 단계 성장을 통해 레이저 발진과 신호 제어 및 증폭이 가능한 일체형 페로브스카이트 회로 구현에 성공함.", "implication": "차세대 광컴퓨팅 및 초고속 광통신 소자로서 페로브스카이트 물질의 실용적 활용 가능성을 크게 높임.", "novelty": "단순한 재료 특성 연구를 넘어 실질적인 회로 통합을 실험적으로 달성했다는 점에서 응용성이 높음.", "unresolved": "장시간 구동 시 발생하는 열적 안정성 및 재료의 내구성 문제는 상용화를 위해 해결해야 할 과제임.", "future_work": "온-칩 극성 회로를 이용한 논리 연산 장치 개발 및 더 넓은 파장 대역에서의 운용성 시험.", "concepts": [{"term": "Polariton", "why_emerged": "빛과 물질의 강한 결합을 통해 새로운 준입자 상태를 만들고 이를 광소자에 활용하기 위해 필요함.", "origin"     img.src = r.image; img.alt = 'Figure or article preview image'; img.loading = 'lazy'; img.referrerPolicy = 'no-referrer'; img.onerror = () => figure.remove();
    figure.appendChild(img);
    figure.appendChild(textEl('figcaption', '', 'Figure / article preview image from the source page'));
    head.appendChild(figure);
  }
  const headText = document.createElement('div');
  headText.className = 'head-text';
  const badges = document.createElement('div');
  badges.className = 'badges';
  if (r.score) badges.appendChild(textEl('span', 'badge score', `${r.score}/10`));
  if (r.tier) badges.appendChild(textEl('span', 'badge', r.tier));
  if (r.journal) badges.appendChild(textEl('span', 'badge', r.journal));
  if (r.source) badges.appendChild(textEl('span', 'badge', r.source));
  headText.appendChild(badges);
  const title = document.createElement('h1');
  if (r.link) { const titleLink = document.createElement('a'); titleLink.href = r.link; titleLink.target = '_blank'; titleLink.rel = 'noopener noreferrer'; titleLink.textContent = r.title || ''; title.appendChild(titleLink); }
  else { title.textContent = r.title || ''; }
  headText.appendChild(title);
  headText.appendChild(textEl('p', 'meta', [r.journal, r.source].filter(Boolean).join(' | ')));
  if (r.last_authors || r.authors) { const authors = document.createElement('p'); authors.className = 'authors'; if (r.last_authors) authors.append('Last authors: ' + r.last_authors); if (r.authors) authors.append((r.last_authors ? ' | ' : '') + 'Authors: ' + r.authors); headText.appendChild(authors); }
  appendLabeledText(headText, 'why', 'Filter reason: ', r.reason);
  if (r.tags && r.tags.length) { const tags = document.createElement('div'); tags.className = 'tags'; r.tags.forEach(tag => tags.appendChild(textEl('span', 'tag', '#' + tag))); headText.appendChild(tags); }
  if (r.link) { const link = document.createElement('a'); link.className = 'link'; link.href = r.link; link.target = '_blank'; link.rel = 'noopener noreferrer'; link.textContent = 'Open paper'; headText.appendChild(link); }
  head.appendChild(headText);
  if (r.summary) { const abstract = document.createElement('p'); abstract.className = 'original-abstract'; const strong = textEl('strong', '', 'Original abstract'); abstract.appendChild(strong); abstract.append(r.summary); head.appendChild(abstract); }
  slideEl.appendChild(head);
  const briefing = document.createElement('div');
  briefing.className = 'briefing';
  appendBriefSection(briefing, 'Background', b.background);
  appendBriefSection(briefing, 'Motivation', b.motivation);
  appendBriefSection(briefing, 'Result', b.result);
  appendBriefSection(briefing, 'Implication', b.implication);
  appendBriefSection(briefing, "Why it's important / Novelty", b.novelty);
  appendBriefSection(briefing, 'Unresolved Questions', b.unresolved);
  appendBriefSection(briefing, 'Expected Future Work', b.future_work);
  if (b.concepts && b.concepts.length) {
    const section = document.createElement('section');
    section.className = 'brief-section wide';
    section.appendChild(textEl('h2', '', 'Concepts / Terms'));
    const concepts = document.createElement('div');
    concepts.className = 'concepts';
    b.concepts.forEach(c => {
      const item = document.createElement('div');
      item.className = 'concept';
      item.appendChild(textEl('h3', '', c.term || 'Concept'));
      [['왜 생겼나: ', c.why_emerged], ['누가 만들었나: ', c.origin], ['연결되는 흐름: ', c.connections]].forEach(([label, text]) => { if (!text) return; const p = document.createElement('p'); const bold = textEl('b', '', label); p.appendChild(bold); p.append(text); item.appendChild(p); });
      concepts.appendChild(item);
    });
    section.appendChild(concepts);
    briefing.appendChild(section);
  }
  if (b.english_summary && b.english_summary.length) { const section = document.createElement('section'); section.className = 'brief-section wide'; section.appendChild(textEl('h2', '', 'English Summary')); const ul = document.createElement('ul'); b.english_summary.slice(0, 5).forEach(line => ul.appendChild(textEl('li', '', line))); section.appendChild(ul); briefing.appendChild(section); }
  slideEl.appendChild(briefing);
  counterEl.textContent = `${index + 1} / ${slides.length}`;
  prevBtn.disabled = index === 0;
  nextBtn.disabled = index === slides.length - 1;
}
prevBtn.addEventListener('click', () => { index = Math.max(0, index - 1); render(); });
nextBtn.addEventListener('click', () => { index = Math.min(slides.length - 1, index + 1); render(); });
document.addEventListener('keydown', event => { if (event.key === 'ArrowLeft') prevBtn.click(); if (event.key === 'ArrowRight') nextBtn.click(); });
render();
</script>
</body>
</html>
