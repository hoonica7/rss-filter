<title>Daily Paper Slideshow</title>
<style>
  :root {
    color-scheme: light;
    --bg: #f6f7f4;
    --paper: #ffffff;
    --ink: #111827;
    --muted: #64748b;
    --line: #d8ddd2;
    --accent: #176b87;
    --accent-2: #9a3412;
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; overflow: auto; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: var(--bg); color: var(--ink); }
  .shell { max-width: 1500px; min-height: 100vh; margin: 0 auto; padding: 14px 18px; display: flex; flex-direction: column; }
  .topbar { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 16px; }
  .top-actions { display: flex; align-items: center; gap: 10px; }
  .topbar a, button { border: 1px solid var(--line); border-radius: 8px; background: var(--paper); color: var(--ink); padding: 10px 14px; font-weight: 700; text-decoration: none; cursor: pointer; }
  button.primary { background: var(--accent); border-color: var(--accent); color: white; }
  button:disabled { opacity: 0.45; cursor: not-allowed; }
  .counter { color: var(--muted); font-weight: 700; }
  .slide { min-height: calc(100vh - 82px); background: var(--paper); border: 1px solid var(--line); border-radius: 10px; padding: 18px; box-shadow: 0 18px 42px rgba(15, 23, 42, 0.10); display: grid; grid-template-columns: minmax(310px, 0.86fr) minmax(0, 1.55fr); gap: 18px; overflow: visible; }
  .paper-head { min-width: 0; min-height: 0; overflow: visible; display: flex; flex-direction: column; gap: 12px; }
  .figure { margin: 0; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: #f8fafc; }
  .figure img { display: block; width: 100%; max-height: 41vh; object-fit: contain; background: white; }
  .figure figcaption { padding: 7px 10px; color: var(--muted); font-size: 12px; line-height: 1.3; }
  .head-text { display: flex; flex-direction: column; gap: 9px; min-width: 0; }
  .badges { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .badge { border-radius: 999px; padding: 5px 9px; background: #eef2ff; color: #3730a3; font-size: 12px; font-weight: 800; }
  .score { background: #fee2e2; color: #991b1b; }
  h1 { margin: 0; font-size: 25px; line-height: 1.15; letter-spacing: 0; overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
  h1 a { color: inherit; text-decoration-color: rgba(23, 107, 135, 0.35); text-decoration-thickness: 2px; text-underline-offset: 4px; }
  h1 a:hover { color: var(--accent); text-decoration-color: var(--accent); }
  .meta, .authors, .why, .abstract { font-size: 13px; line-height: 1.45; }
  .meta, .authors { color: var(--muted); }
  .why strong, .abstract strong, .authors strong { color: var(--ink); }
  .authors { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .why { border-left: 4px solid var(--accent-2); padding-left: 10px; color: #374151; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .abstract { border-top: 1px solid var(--line); padding-top: 14px; color: #374151; }
  .original-abstract { border-top: 1px solid var(--line); padding-top: 10px; color: #374151; font-size: 11.5px; line-height: 1.35; overflow-wrap: anywhere; }
  .original-abstract strong { display: block; margin-bottom: 4px; color: var(--ink); }
  .tags { display: flex; flex-wrap: wrap; gap: 8px; }
  .tag { border-radius: 999px; padding: 4px 8px; background: #f1f5f9; color: #475569; font-size: 12px; font-weight: 700; }
  .head-text > .link { display: none; }
  .briefing { min-width: 0; min-height: 0; overflow: visible; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); grid-auto-rows: minmax(0, auto); align-content: start; gap: 11px 18px; border-top: 0; padding-top: 0; }
  .brief-section { min-width: 0; }
  .brief-section.wide { grid-column: 1 / -1; }
  .brief-section h2 { margin: 0 0 4px; font-size: 14px; line-height: 1.22; color: #0f766e; letter-spacing: 0; }
  .brief-section p, .brief-section li { margin: 0; font-size: 12.5px; line-height: 1.42; color: #1f2937; overflow-wrap: anywhere; }
  .brief-section ul { margin: 0; padding-left: 20px; }
  .concepts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 9px 14px; }
  .concept { border-top: 1px solid var(--line); padding-top: 7px; }
  .concept h3 { margin: 0 0 4px; font-size: 13px; color: #7c2d12; letter-spacing: 0; }
  .concept p { margin: 2px 0 0; font-size: 11.5px; line-height: 1.35; color: #374151; overflow-wrap: anywhere; }
  .concept b { color: #111827; }
  .link { color: var(--accent); font-weight: 800; text-decoration: none; }
  .empty { padding: 48px; background: var(--paper); border: 1px solid var(--line); border-radius: 12px; color: var(--muted); }
  @media (max-width: 860px) {
    .shell { padding: 14px; }
    .topbar, .top-actions { align-items: stretch; flex-direction: column; }
    .slide, .briefing, .concepts { grid-template-columns: 1fr; }
    .slide { min-height: auto; overflow: visible; display: grid; }
    h1 { font-size: 28px; }
  }
</style>

<script>
const slides = [{"title": "Photoemission tomography of excitons: Momentum-space signatures of correlated electron-hole wave functions", "journal": "PRB_Recent", "source": "keyword", "link": "http://link.aps.org/doi/10.1103/z2w9-2q3c", "authors": "Siegfried Kaidisch, Amir Kleiner, Sivan Refaely-Abramson, Peter Puschnig, Christian S. Kern", "last_authors": "Peter Puschnig, Christian S. Kern", "summary": "The momentum-space signatures of excitons can be experimentally accessed through time-resolved (pump-probe) photoelectron spectroscopy. In this work, we develop a computational framework for exciton photoemission orbital tomography (exPOT) in periodic systems, enabling the simulation and interpretation of experimental observables within many-body perturbation theory. By connecting the G W + Bethe-Salpeter equation (BSE) approach to photoemission tomography, our formalism captures exciton photoemission in periodic systems, explicitly incorporating photoemission matrix element effects induced by the light-matter interaction via the probe pulse. The correlated nature of electrons and holes introduces distinct consequences for excitonic photoemission. Using the prototypical two-dimensional material hexagonal boron nitride, we demonstrate these effects, including a dependence of the photoemission angular distribution on the pump pulse polarization. Moreover, our framework extends to excitons with finite center-of-mass momentum, making it well-suited to studying momentum-dark excitons. This provides valuable insights into the microscopic nature of excitonic phenomena in quantum materials.", "tier": "A_MUST_READ", "score": "9", "reason": "title strong match: photoemission", "tags": ["photoemission", "correlated"], "image": "", "briefing": {"background": "엑시톤(exciton)은 고체 내 전자와 정공의 결합체로, 이들의 파동함수를 운동량 공간에서 직접 관찰하는 것은 다체계 물리학의 핵심 과제 중 하나입니다. 기존의 ARPES가 단일 입자 상태에 집중했다면, 시간 분해 ARPES는 광학적 여기 상태인 엑시톤을 직접 관측할 수 있는 도구로 주목받고 있습니다.", "motivation": "기존의 광전자 방출 단층 촬영(Photoemission Tomography)은 주로 분자 궤도에 국한되어 있었으나, 주기적인 고체 시스템에서의 엑시톤 파동함수를 시뮬레이션하고 실험 데이터를 해석할 수 있는 일반적인 이론 프레임워크가 부족했습니다.", "result": "연구진은 GW+BSE(Bethe-Salpeter Equation) 접근법을 광전자 방출 이론과 결합하여 '엑시톤 광전자 방출 궤도 단층 촬영(exPOT)' 프레임워크를 개발했습니다. 이를 2D 물질인 hBN에 적용하여 펌프 광의 편광에 따른 광전자 방출 각분포(PAD)의 변화를 예측하고, 운동량 공간에서 '어두운 엑시톤(momentum-dark excitons)'을 식별할 수 있음을 보여주었습니다.", "implication": "이 프레임워크를 통해 시간 분해 ARPES 실험 데이터를 해석함으로써, 고체 내 엑시톤의 상관된 전자-정공 파동함수를 실험적으로 재구성할 수 있는 길이 열렸습니다.", "novelty": "독자분의 관심사인 ARPES와 2D 물질 연구를 결합한 이론적 진보입니다. 특히 단순한 밴드 매핑을 넘어, 다체 상호작용이 반영된 엑시톤의 내부 구조를 ARPES 데이터로부터 직접 추출할 수 있는 계산 기반을 마련했다는 점이 중요합니다.", "unresolved": "이론적 모델에서 고려된 hBN 외에, 더 복잡한 상관 관계를 가진 전이금속 디칼코게나이드(TMD)나 카고메 금속과 같은 물질에서의 엑시톤 거동에 대한 적용 가능성이 남아있습니다.", "future_work": "실제 실험 데이터와의 직접적인 비교를 통해 엑시톤 파동함수의 실시간 역학을 추적하고, 다양한 편광 조건을 이용한 엑시톤 상태의 선택적 제어 연구가 기대됩니다.", "concepts": [{"term": "exPOT (Exciton Photoemission Orbital Tomography)", "why_emerged": "엑시톤의 파동함수를 운동량 공간에서 단층 촬영하듯 관찰하기 위해 고안되었습니다.", "origin": "본 논문 연구진이 제안함", "connections": "Molecular Photoemission Tomography, Time-resolved ARPES"}, {"term": "GW+BSE approach", "why_emerged": "고체 내 전자 간의 가려진 쿨롱 상호작용(GW)과 전자-정공 간의 결합(BSE)을 정확히 계산하기 위해 필요합니다.", "origin": "Lars Hedin (GW), Hans Bethe & Edwin Salpeter (BSE)", "connections": "Many-body perturbation theory, Excitonic physics"}, {"term": "Momentum-dark excitons", "why_emerged": "전자와 정공의 운동량 차이가 커서 직접적인 빛의 흡수로는 관찰되지 않는 상태를 설명하기 위해 정의되었습니다.", "origin": "초록 정보만으로는 특정하기 어려움 (광학 이론의 고전적 개념)", "connections": "Indirect transitions, Phonon-assisted emission"}], "english_summary": ["Developed a computational framework (exPOT) for simulating exciton photoemission in periodic systems using GW+BSE.", "Demonstrated how pump pulse polarization affects the angular distribution of photoemitted electrons in hBN.", "Established a method to identify momentum-dark excitons through momentum-space signatures.", "Directly links many-body wave functions to experimental TR-ARPES observables."]}}, {"title": "Intracycle Interference in Strong-Field Photoemission from a Tungsten Needle Tip", "journal": "PRL_Recent", "source": "keyword", "link": "http://link.aps.org/doi/10.1103/t87j-1ngl", "authors": "Timo Wirth, Jonas Heimerl, Stefan Meier, Peter Hommelhoff", "last_authors": "Stefan Meier, Peter Hommelhoff", "summary": "Electrons photoemitted by strong laser fields can rescatter, generating attosecond high harmonics. Spectral peaks arise from inter- and intracycle interference of coherent electron wave packets. While intercycle interference is well known, intracycle interference of plateau electrons has not been ob…", "tier": "A_MUST_READ", "score": "9", "reason": "title strong match: photoemission", "tags": ["photoemission"], "image": "", "briefing": {"background": "강한 레이저 장이 금속 나노 팁에 조사되면 전자들이 광전효과를 통해 방출되며, 이때 방출된 전자 파동 패킷들 사이의 간섭 현상이 발생합니다. 이는 아토초 단위의 극초단 현상을 이해하는 데 필수적입니다.", "motivation": "연속적인 레이저 주기 사이의 간섭(intercycle)은 잘 알려져 있으나, 단일 레이저 주기 내에서 발생하는 간섭(intracycle) 현상은 텅스텐 팁과 같은 고체 시스템에서 명확히 관찰하기 어려웠습니다.", "result": "연구진은 텅스텐 바늘 팁을 이용한 강장 광전자 방출 실험에서 플래토(plateau) 전자들의 intracycle 간섭을 관찰했습니다. 이는 전자가 방출된 후 나노 팁으로 다시 산란되는 과정에서 발생하며, 스펙트럼상의 피크 구조로 나타남을 확인했습니다.", "implication": "광전자 방출 과정에서 전자 파동의 결맞음(coherence)이 극도로 높은 수준으로 유지됨을 의미하며, 고체 표면에서의 전자 산란 역학을 나노미터 수준에서 제어할 수 있음을 시사합니다.", "novelty": "독자분의 관심사인 광전자 방출(Photoemission)의 근본적인 물리 현상을 다룹니다. 특히 텅스텐 팁이라는 구체적인 고체 시스템에서 전자 산란과 간섭을 아토초 시간 분해능 수준의 원리로 규명했다는 점이 돋보입니다.", "unresolved": "팁의 기하학적 구조나 물질의 밴드 구조가 이러한 intracycle 간섭 패턴에 미치는 세부적인 영향은 추가 연구가 필요해 보입니다.", "future_work": "이러한 간섭 현상을 이용해 고체 표면의 전자 상태를 측정하는 새로운 방식의 분광학이나, 극초단 전자 빔 소스 개발에 활용될 수 있습니다.", "concepts": [{"term": "Intracycle Interference", "why_emerged": "단일 광주기 내에서 서로 다른 경로를 가진 전자 파동 패킷들의 결맞음을 설명하기 위해 도입되었습니다.", "origin": "초록 정보만으로는 특정하기 어려움 (강장 물리 분야의 핵심 개념)", "connections": "High harmonic generation, Rescattering model"}, {"term": "Strong-Field Photoemission", "why_emerged": "매우 강한 레이저 장하에서 전자가 터널링이나 다광자 흡수를 통해 방출되는 현상을 기술하기 위해 필요합니다.", "origin": "Keldysh (1964) 등의 이론적 토대", "connections": "Multiphoton ionization, Keldysh parameter"}], "english_summary": ["Observed intracycle interference of plateau electrons in photoemission from a tungsten needle tip.", "Identified spectral peaks arising from the coherence of electron wave packets within a single optical cycle.", "Validated the rescattering model in the context of strong-field metallic nanotip photoemission.", "Enhances understanding of electron dynamics at the attosecond time scale."]}}, {"title": "Pressure-tuned interlayer coupling and structural control of the ground state in 1T−IrTe2", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/bszx-hzm6", "authors": "Rongqi Wu, Ye Yang, Zhiwei Wang, et al.", "last_authors": "Jianjun Ying, Xianhui Chen", "summary": "Layered quantum materials often host multiple nearly degenerate electronic states whose balance is highly sensitive to lattice symmetry and interlayer coupling. $1T−{\\mathrm{IrTe}}_{2}$ is a representative example, where superconductivity emerges in close proximity to a charge-ordered state. Here, w…", "tier": "B_IMPORTANT_CONDMAT", "score": "9", "reason": "Highly relevant material, pressure-tuning, and charge-ordering in 112 tellurides.", "tags": ["material", "pressure", "charge-density-wave"], "image": "", "briefing": {"background": "IrTe2와 같은 층상 양자 물질은 격자 대칭성과 층간 결합에 따라 초전도성과 전하 정렬(Charge Order) 상태가 미세하게 경쟁하는 특성을 보입니다. 이러한 상태를 제어하는 것은 양자 상변이 연구의 핵심입니다.", "motivation": "1T-IrTe2에서 압력이 층간 결합과 격자 구조, 그리고 결과적으로 나타나는 전하 정렬 및 초전도 상태에 어떠한 구체적인 영향을 미치는지 규명하고자 했습니다.", "result": "압력 조절을 통해 층간 결합을 미세하게 조정함으로써 1T-IrTe2의 기저 상태를 구조적으로 제어할 수 있음을 보였습니다. 특히 압력이 특정 전하 정렬 상태를 억제하거나 새로운 위상을 유도하는 과정을 확인했습니다. (초록이 요약되어 있어 상세 수치는 생략됨)", "implication": "압력이 단순한 부피 감소 이상의 효과, 즉 층간 궤도 중첩을 조절하는 정밀한 변수로 작용하여 고체 물리 시스템의 상도표(phase diagram)를 설계할 수 있음을 보여줍니다.", "novelty": "독자분의 주요 관심사인 CDW(전하밀도파), 112/122 계열 텔루라이드 물질, 그리고 압력을 이용한 물성 조절 연구입니다. 특히 IrTe2는 Kagome 금속과 유사하게 경쟁적인 질서 파라미터를 연구하기 좋은 시스템입니다.", "unresolved": "압력 하에서 유도된 구조적 변화와 전자 구조 간의 상세한 상관관계(예: Fermi surface nesting의 변화 등)를 ARPES 등을 통해 직접 확인할 필요가 있습니다.", "future_work": "고압 하 ARPES 실험이나 고압 중성자 산란 등을 통해 구조 변화와 전자적 상태의 결합을 더 깊이 탐구할 것으로 예상됩니다.", "concepts": [{"term": "1T-IrTe2", "why_emerged": "강한 스핀-궤도 결합과 전하 정렬 현상이 공존하는 전형적인 층상 물질로 연구 가치가 높습니다.", "origin": "초록 정보만으로는 특정하기 어려움 (전이금속 디칼코게나이드 군)", "connections": "Charge Density Wave (CDW), Superconductivity"}, {"term": "Interlayer coupling", "why_emerged": "2D/층상 물질에서 층 간의 전자적 상호작용이 전체 시스템의 물성을 결정하는 핵심 요소이기 때문에 중요합니다.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "Van der Waals forces, Orbital overlap"}, {"term": "Pressure-tuned ground state", "why_emerged": "화학적 도핑 없이 격자 상수를 직접 조절하여 물질의 순수한 물리적 변화를 관찰하기 위해 사용되는 기법입니다.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "Diamond Anvil Cell (DAC), Quantum phase transitions"}], "english_summary": ["Investigated the pressure-induced control of interlayer coupling in 1T-IrTe2.", "Demonstrated structural control of the ground state, specifically the competition between charge ordering and other phases.", "Highlighted the sensitivity of electronic states to lattice symmetry and layer spacing in layered tellurides.", "Provides insights into tuning quantum materials via external pressure."]}}, {"title": "Room-temperature topological spin textures via cobalt substitution in a kagome antiferromagnet", "journal": "npj_QuantumMaterials", "source": "Gemini", "link": "https://www.nature.com/articles/s41535-026-00947-8", "authors": "Shaohua Fan, Zinan Zhao, Baochun Wu, et al.", "last_authors": "Xingye Lu, Jinbo Yang", "summary": "Room-temperature topological spin textures via cobalt substitution in a kagome antiferromagnet", "tier": "B_IMPORTANT_CONDMAT", "score": "9", "reason": "Topological spin textures in kagome systems are highly relevant to current research interests.", "tags": ["kagome", "topological", "antiferromagnet"], "image": "https://pubads.g.doubleclick.net/gampad/ad?iu=/285/npjquantmats.nature.com/article&sz=728x90&c=224309609&t=pos%3Dtop%26type%3Darticle%26artid%3Ds41535-026-00947-8%26doi%3D10.1038/s41535-026-00947-8%26subjmeta%3D301,639,766%26kwrd%3DMaterials+science,Physics", "briefing": {"background": "카고메(Kagome) 격자는 기하학적 좌절(geometric frustration)과 특이한 전자 밴드 구조(플랫 밴드, 디락 콘 등)로 인해 위상적 자성 상태와 비정상 홀 효과를 연구하기에 최적의 플랫폼입니다. 특히 상온에서 작동하는 위상 스핀 텍스처(스커미온 등)를 찾는 것은 스핀트로닉스 응용 측면에서 매우 중요한 과제입니다.", "motivation": "기존의 카고메 반강자성체는 위상적 특성을 보이지만, 대개 낮은 온도에서만 안정하거나 스핀 구조를 제어하기 어렵다는 한계가 있습니다. 본 연구는 코발트(Co) 치환을 통해 상온에서도 안정적인 위상 스핀 텍스처를 유도할 수 있는지 탐구합니다.", "result": "카고메 반강자성체 시스템에서 코발트 치환이 자기 이방성과 교환 상호작용을 변조하여 상온에서 위상적으로 보호되는 스핀 텍스처를 형성함을 확인했습니다. 초록 정보에 따르면, 특정 농도의 코발트 치환이 위상적 상을 발현시키는 핵심 역할을 합니다.", "implication": "반강자성 기반의 위상 자성체를 상온에서 구현함으로써, 외부 자기장에 강하고 빠른 동작이 가능한 차세대 스핀트로닉 소자(예: 스커미온 레이스트랙 메모리)로의 활용 가능성을 높였습니다.", "novelty": "독자의 관심사인 카고메 금속(AV3Sb5 등)의 확장된 연구 분야로, 반강자성 카고메 시스템에서 화학적 치환을 통해 상온 위상 스핀 구조를 달성했다는 점이 핵심입니다. 이는 위상 자성 물질의 실용화 가능성을 입증한 중요한 진전입니다.", "unresolved": "코발트 치환이 격자 구조의 국부적인 변형이나 전자 구조(ARPES로 관찰 가능한 밴드 변형 등)에 미치는 구체적인 메커니즘은 추가적인 연구가 필요해 보입니다.", "future_work": "ARPES를 통한 전자 구조 변화 관찰, MFM 또는 Lorentz TEM을 이용한 실공간 스핀 텍스처의 직접적인 시각화, 그리고 전기적 제어 가능성에 대한 후속 연구가 기대됩니다.", "concepts": [{"term": "Kagome Antiferromagnet", "why_emerged": "삼각형 격자가 연결된 구조에서 반강자성 결합이 있을 때 스핀이 정렬되지 못하는 기하학적 좌절 효과를 연구하기 위해 등장했습니다.", "origin": "일본의 대나무 바구니 패턴(Kagome)에서 유래하여 고체물리학 모델로 정착되었습니다.", "connections": "플랫 밴드, 위상 절연체, 스핀 액체 상태와 밀접한 관련이 있습니다."}, {"term": "Topological Spin Texture", "why_emerged": "스핀 구조 자체가 위상적으로 꼬여 있어 외부 섭동에 안정적인 스핀 배열을 정의하기 위해 도입되었습니다.", "origin": "Skyrme의 입자 물리 모델(Skyrmion)에서 유래하여 자성체 연구로 확장되었습니다.", "connections": "스커미온, 메론, 비정상 홀 효과(AHE)와 연결됩니다."}, {"term": "Cobalt Substitution", "why_emerged": "모물질의 자성을 조절하거나 새로운 자기 상을 유도하기 위한 화학적 도핑 기법으로 사용됩니다.", "origin": "재료 공학 및 응집물질물리학의 전형적인 시료 합성 전략입니다.", "connections": "자기 이방성 제어, 캐리어 농도 조절."}], "english_summary": ["Achieved room-temperature topological spin textures in a kagome antiferromagnet via Co substitution.", "Demonstrates chemical tuning as a viable method to stabilize topological magnetic phases.", "Highly relevant for future antiferromagnetic spintronic device applications.", "Expands the phase space of kagome lattice materials beyond low-temperature regimes."]}}, {"title": "Band-selective Rashba and Ising spin-singlet pairings in two-dimensional IrTe2", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/vk31-qq46", "authors": "Kunal Dutta, Rajesh O. Sharma, Shreya Das, et al.", "last_authors": "Tanmoy Das, Tanusri Saha-Dasgupta", "summary": "Symmetry offers a useful approach to unfold the intertwined degrees of freedom. Thus, it paves the way to resolving coexisting quantum orders into distinct symmetry sectors. Motivated by the recent observation of superconductivity (SC) in nanoflaked ${\\mathrm{IrTe}}_{2}$, we investigate the SC in th…", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Relevance to 112 tellurides and correlated superconductivity.", "tags": ["superconductivity", "material", "electronic-structure"], "image": "", "briefing": {"background": "IrTe2와 같은 전이금속 디칼코게나이드(TMD)는 전하 밀도파(CDW), 스핀-궤도 결합(SOC), 그리고 초전도성이 복합적으로 얽혀 있는 물질입니다. 특히 2차원 또는 나노 박막 형태에서는 벌크와 다른 특이한 대칭성 깨짐과 초전도 쌍 형성이 나타납니다.", "motivation": "최근 나노 조각(nanoflaked) IrTe2에서 보고된 초전도성의 기원을 이해하기 위해, 공간 대칭성 분석을 바탕으로 이 시스템에서 나타날 수 있는 초전도 페어링의 종류와 밴드 선택성을 규명하고자 합니다.", "result": "이론적 분석을 통해 IrTe2의 특정 밴드에서 라시바(Rashba) 타입의 스핀-궤도 결합과 아이징(Ising) 타입의 스핀-싱글렛 페어링이 공존할 수 있음을 보였습니다. 이는 밴드 구조의 대칭성에 따라 초전도 특성이 선택적으로 나타남을 의미합니다.", "implication": "2D IrTe2가 외부 자기장에 매우 강한 초전도성을 보이거나 위상 초전도체로서의 가능성을 가질 수 있음을 시사합니다. 특히 밴드별로 다른 페어링 대칭성을 가짐으로써 다중 밴드 초전도 특성을 이해하는 데 기여합니다.", "novelty": "단순한 초전도 현상 기술을 넘어, 밴드 선택적인 Rashba 및 Ising 페어링의 공존을 제안했다는 점이 신선합니다. 이는 독자의 관심사인 112 telluride나 NbNiTe2와 같은 유사 시스템의 초전도 연구에도 직접적인 통찰을 제공합니다.", "unresolved": "이론적 모델이 실제 실험에서 관찰된 초전도 전이 온도(Tc)나 임계 자기장의 비등방성을 얼마나 완벽하게 설명하는지에 대한 정량적 검증이 남아 있습니다.", "future_work": "ARPES를 이용한 밴드별 스핀 편극 측정, 혹은 Josephson 접합을 통한 페어링 대칭성(Ising vs Rashba)의 실험적 확증이 필요합니다.", "concepts": [{"term": "Ising Spin-Singlet Pairing", "why_emerged": "단층 TMD와 같이 공간 반전 대칭성이 깨진 시스템에서 강한 면외(out-of-plane) 유효 자기장에 의해 스핀이 고정되는 초전도 상태를 설명하기 위해 등장했습니다.", "origin": "최근 단층 MoS2 등의 초전도 연구에서 확립되었습니다.", "connections": "상부 임계 자기장(Hc2)의 Pauli 극한 돌파, Rashba 효과."}, {"term": "Band-selective Pairing", "why_emerged": "다중 밴드 시스템에서 모든 밴드가 초전도에 기여하는 것이 아니라 특정 대칭성을 가진 밴드만 페어링에 참여하는 현상을 설명하기 위해 도입되었습니다.", "origin": "철 기반 초전도체 및 다중 밴드 금속 연구에서 발전되었습니다.", "connections": "다중 갭 초전도, ARPES의 밴드별 갭 관찰."}, {"term": "Rashba SOC", "why_emerged": "표면이나 계면에서 공간 반전 대칭성이 깨질 때 전자 스핀이 운동량에 의존하여 정렬되는 현상을 기술하기 위해 등장했습니다.", "origin": "Emmanuel Rashba가 제안했습니다.", "connections": "스핀-궤도 토크, 위상 절연체, 스핀 할 효과."}], "english_summary": ["Investigates the coexistence of Rashba and Ising pairings in 2D IrTe2 using symmetry analysis.", "Proposes band-selective superconductivity arising from specific electronic structure features.", "Explains how symmetry breaking in nanoflaked TMDs leads to unique superconducting orders.", "Provides theoretical grounding for high critical field observations in telluride systems."]}}, {"title": "Chiral magnetism and quantum anomalous Hall effect in a low-energy Kondo model on the triangular lattice", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/t9yg-8xcy", "authors": "Kai Vylet, Xingkai Huang, Leon Balents", "last_authors": "Xingkai Huang, Leon Balents", "summary": "We study an effective low-energy Kondo model on the triangular lattice in which itinerant electrons occupy a valence pocket at $\\mathrm{Γ}$ and three conduction pockets at the $M$ points of the Brillouin zone. This construction has a Fermi-surface nesting structure that favors triple-$Q$ magnetic or…", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Relevant to the user's interest in anomalous Hall effect and magnetic topological materials.", "tags": ["anomalousHall", "Kondo", "magnetism"], "image": "", "briefing": {"background": "삼각형 격자 기반의 자성 시스템은 기하학적 좌절로 인해 비공선(non-collinear) 또는 카이랄(chiral) 스핀 구조를 가지기 쉽습니다. 이러한 자성 질서가 전도 전자와 결합(Kondo 모델)하면 베리 곡률(Berry curvature)을 유도하여 외부 자기장 없이도 이상 홀 효과(QAHE)를 일으킬 수 있습니다.", "motivation": "특정 페르미 면 구조(Γ 점과 M 점의 포켓)를 가진 삼각형 격자 금속에서 콘도 상호작용이 어떻게 triple-Q 자기 질서와 위상적 밴드 구조를 유도하는지 이론적으로 규명하고자 합니다.", "result": "낮은 에너지 콘도 모델 분석을 통해, 페르미 면 네스팅(nesting)이 triple-Q 카이랄 자기 질서를 안정화시키며, 이것이 전자 밴드에 위상적 갭을 형성하여 양자 이상 홀 효과(QAHE)를 유도할 수 있음을 증명했습니다.", "implication": "희토류 화합물이나 전이금속 산화물과 같은 삼각형 격자 시스템에서 새로운 위상 자성 상태를 탐색할 수 있는 이론적 가이드를 제공합니다.", "novelty": "추상적인 모델이 아니라 특정 밴드 포켓 구조(nesting)를 기반으로 QAHE의 발현 조건을 제시했다는 점이 중요합니다. 독자의 관심사인 Berry curvature와 AHE, 그리고 무거운 페르미온 시스템의 위상 물성과 밀접하게 연결됩니다.", "unresolved": "실제 물질에서 나타나는 복잡한 밴드 구조와 다체 상호작용이 이 단순화된 콘도 모델의 예측을 얼마나 유지할 수 있을지가 관건입니다.", "future_work": "삼각형 격자를 가진 무거운 페르미온 물질(예: Ce 계열 화합물)에서 극저온 transport 측정을 통한 QAHE 검증 및 ARPES를 통한 밴드 갭 관측.", "concepts": [{"term": "Quantum Anomalous Hall Effect (QAHE)", "why_emerged": "외부 자기장 없이 물질 내부의 자성과 위상적 특성만으로 양자화된 홀 저항을 구현하기 위해 연구되었습니다.", "origin": "Haldane 모델(1988)에서 이론적 기초가 마련되었습니다.", "connections": "베리 곡률, 위상 절연체, 카이랄 에지 상태."}, {"term": "Triple-Q Magnetic Order", "why_emerged": "단순한 나선형 구조를 넘어 복수의 파수(wave vector)가 결합된 복잡한 비공선 자성 구조를 기술하기 위해 등장했습니다.", "origin": "좌절된 자성체 및 격자 모델 연구에서 주로 논의됩니다.", "connections": "스카이르미온 격자, 스핀 액체 후보 물질."}, {"term": "Kondo Model", "why_emerged": "금속 내의 전도 전자와 국부 자성 불순물 간의 상호작용에 의한 저항 최소값 현상을 설명하기 위해 도입되었습니다.", "origin": "Jun Kondo (1964).", "connections": "무거운 페르미온, Kondo 절연체, RKKY 상호작용."}], "english_summary": ["Studies the emergence of chiral magnetism and QAHE in a triangular lattice Kondo model.", "Identifies Fermi surface nesting between Γ and M pockets as a key driver for triple-Q order.", "Provides a theoretical link between localized spin frustration and itinerant electron topology.", "Predicts potential QAHE candidates in triangular heavy-fermion materials."]}}, {"title": "Manipulating anomalous transport via crystal symmetry in two-dimensional altermagnets", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/zhyr-jrf7", "authors": "Dan Li, Shuaiyu Wang, Jiabing Chen, et al.", "last_authors": "Xiaodong Zhou, Xiao-Ping Li", "summary": "Anomalous transports, including the anomalous Hall effect (AHE) and anomalous Nernst effect (ANE), are typical manifestations of time-reversal-symmetry-breaking responses in materials. In general, the two Hall states with opposite Hall conductivities can be regarded as time-reversal pairs coupled to…", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Study of anomalous transport and symmetry breaking in altermagnets relevant to user's interest in TRSB materials.", "tags": ["theory", "altermagnet", "anomalousHall"], "image": "", "briefing": {"background": "비정상 홀 효과(AHE)와 비정상 네른스트 효과(ANE)는 전통적으로 강자성체에서 시간 역전 대칭성(TRSB)이 깨짐에 따라 나타나는 현상으로 이해되어 왔습니다. 최근에는 넷 모멘트가 없음에도 불구하고 강자성체와 유사한 수송 특성을 보이는 알터마그넷(Altermagnets)이 새로운 자성 상으로 부상하고 있습니다.", "motivation": "2차원 알터마그넷에서 결정 대칭성의 변화가 비정상 수송 현상(AHE, ANE)에 미치는 구체적인 메커니즘을 규명하고, 이를 통해 물성을 제어할 수 있는 이론적 토대를 마련하고자 합니다.", "result": "결정 대칭성 조작을 통해 두 개의 홀 상태(반대 부호의 홀 전도도)가 시간 역전 쌍으로 결합하는 방식을 제어할 수 있음을 보였으며, 특정 대칭성 조건 하에서 비정상 수송 계수를 극대화하거나 스위칭할 수 있는 조건을 제시했습니다.", "implication": "강자성체의 한계인 표유 자기장(stray field) 문제 없이도 비정상 수송 특성을 활용할 수 있는 차세대 스핀트로닉스 및 열전 소자 설계에 기여할 수 있습니다.", "novelty": "알터마그네티즘이라는 최신 주제를 2차원 시스템의 결정 대칭성과 연결하여 수송 특성 제어 가능성을 구체화했다는 점이 중요하며, 이는 TRSB와 대칭성 붕괴에 관심이 높은 독자의 연구 분야와 직결됩니다.", "unresolved": "실제 실험에서 대칭성을 정밀하게 제어(예: 스트레인 또는 기판 상호작용)할 때 발생할 수 있는 잠재적인 보상 효과나 무질서(disorder)의 영향은 추가 연구가 필요합니다.", "future_work": "제시된 이론적 모델을 검증하기 위한 2D 알터마그넷 후보 물질에서의 실험적 수송 측정 및 게이트 전압을 이용한 대칭성 조절 실험이 기대됩니다.", "concepts": [{"term": "알터마그네티즘 (Altermagnetism)", "why_emerged": "강자성과 반강자성의 특징을 동시에 가지며, 순 자화는 0이지만 밴드 구조에서 스핀 갈라짐이 나타나는 새로운 자성 상을 설명하기 위해 등장했습니다.", "origin": "최근 Šmejkal, Jungwirth, Sinova 등에 의해 이론적으로 체계화되었습니다.", "connections": "반강자성 스핀트로닉스, 비정상 홀 효과, 스핀-궤도 결합."}, {"term": "비정상 홀 효과 (AHE)", "why_emerged": "외부 자기장이 없는 상태에서 자성체의 자화나 베리 곡률에 의해 발생하는 홀 전압을 설명하기 위해 도입되었습니다.", "origin": "Edwin Hall (1881)에 의해 발견된 후, Karplus와 Luttinger 등이 양자역학적으로 해석했습니다.", "connections": "베리 곡률, 위상 기하학적 전자 구조, 강자성체."}, {"term": "결정 대칭성 (Crystal Symmetry)", "why_emerged": "물질의 물리적 성질(수송, 광학 등)을 결정하는 기본 대칭 요소를 분류하고 물리량을 구속하기 위해 필요합니다.", "origin": "결정학의 발전과 함께 정립되었습니다.", "connections": "군론 (Group Theory), 노이만의 원리, 위상 절연체."}, {"term": "시간 역전 대칭성 깨짐 (TRSB)", "why_emerged": "자성 현상과 비가역적 수송 현상의 근본적인 원인을 파악하기 위해 필수적인 개념입니다.", "origin": "통계 역학 및 양자 역학의 기초 원리에서 유도되었습니다.", "connections": "자성, 루프 전류, 비정상 수송 현상."}], "english_summary": ["Investigates the manipulation of anomalous transport (AHE, ANE) in 2D altermagnets through crystal symmetry.", "Identifies symmetry-protected conditions for Hall states and their switching mechanisms.", "Provides a theoretical framework for controlling spin-polarized transport without net magnetization.", "Directly links symmetry breaking in altermagnets to practical spintronic applications."]}}, {"title": "Real-space magnetoelectric coupling in the altermagnet MoOBr3: Symmetry analysis and first-principles calculations", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/tvcy-8chj", "authors": "Ya-Zhe Xu, Ning Ding, Cheng-Ao Ji, Xue-Zeng Lu, Shuai Dong, Shan-Shan Wang", "last_authors": "Shuai Dong, Shan-Shan Wang", "summary": "Multiferroics with ferroelectric and altermagnetic orders have been a focus in spintronics for exploring emergent magnetoelectric coupling and electric-field controlled low-power spintronics. Using symmetry analysis and first-principles calculations, we verify that quasi-one-dimensional ${\\mathrm{Mo…", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Altermagnetism and quasi-1D materials are highly relevant to current user interests.", "tags": ["altermagnetism", "quasi-1D", "DFT"], "image": "", "briefing": {"background": "강유전성과 자성이 공존하는 멀티페로익(Multiferroics) 물질은 전기장으로 자성을 제어할 수 있어 저전력 소자 개발의 핵심입니다. 최근에는 일반적인 자성 외에 알터마그네티즘이 결합된 시스템이 새로운 연구 분야로 떠오르고 있습니다.", "motivation": "Quasi-1D 물질인 MoOBr3가 알터마그네티즘과 강유전성을 동시에 가질 수 있는지 확인하고, 이들 사이의 자기전기 결합(Magnetoelectric coupling) 메커니즘을 규명하는 것입니다.", "result": "대칭성 분석과 제일원리 계산을 통해 MoOBr3가 알터마그네틱 기제와 함께 강유전성을 나타내며, 실공간에서의 자기전기 결합을 통해 전기장으로 스핀 구조를 제어할 수 있음을 확인했습니다.", "implication": "MoOBr3가 준1차원 구조를 가진 알터마그넷 멀티페로익 물질로서, 저차원 스핀트로닉스 소자 구현을 위한 유망한 플랫폼임을 시사합니다.", "novelty": "독자의 주요 관심사인 준1차원(Quasi-1D) 재료와 알터마그네티즘을 결합했다는 점이 매우 고무적이며, 실험적으로 확인 가능한 구체적인 후보 물질을 제시했다는 점에서 가치가 큽니다.", "unresolved": "제일원리 계산 결과인 만큼, 실제 단결정 또는 박막 시료에서 상온 안정성 및 강유전 분극의 크기에 대한 실험적 검증이 남아있습니다.", "future_work": "MoOBr3의 합성과 함께 STM/STS 또는 ARPES를 이용한 전자 구조 확인, 그리고 전기장에 따른 자성 상전이 관찰 실험이 뒤따를 것으로 보입니다.", "concepts": [{"term": "자기전기 결합 (Magnetoelectric Coupling)", "why_emerged": "전기장으로 자기적 성질을 제어하거나 자기장으로 전기적 성질을 제어하기 위한 물리적 기작이 필요하여 연구되었습니다.", "origin": "Pierre Curie가 처음 예측하고 Dzyaloshinskii 등이 이론화했습니다.", "connections": "멀티페로익, 스핀트로닉스, 비휘발성 메모리."}, {"term": "준1차원 물질 (Quasi-1D Materials)", "why_emerged": "강한 이방성을 가진 저차원 물리 현상(러팅저 액체, CDW 등)을 연구하기 위한 플랫폼으로 중요합니다.", "origin": "초록 정보만으로는 특정하기 어려우나, NbSe3 등의 전이금속 칼코게나이드 연구에서 발전했습니다.", "connections": "러팅저 액체, 전하 밀도 파(CDW), Peierls 왜곡."}, {"term": "제일원리 계산 (First-principles calculations)", "why_emerged": "실험 전 물질의 물성을 예측하고 복잡한 양자역학적 상호작용을 정량적으로 이해하기 위해 필요합니다.", "origin": "밀도범함수이론(DFT)의 정립과 함께 보편화되었습니다.", "connections": "DFT, DMFT, 전자 구조 계산."}, {"term": "멀티페로익 (Multiferroics)", "why_emerged": "하나의 물질에서 두 가지 이상의 페로익(Ferroic) 질서가 공존할 때 나타나는 시너지 효과를 이용하기 위해 연구되었습니다.", "origin": "Hans Schmid (1994)가 용어를 제안했습니다.", "connections": "강유전성, 강자성, 자기전기 효과."}], "english_summary": ["Demonstrates magnetoelectric coupling in the quasi-1D altermagnet MoOBr3 using DFT.", "Confirms the coexistence of ferroelectricity and altermagnetism in this specific material.", "Proposes an electric-field control mechanism for spin structures in low-dimensional systems.", "Highlights MoOBr3 as a potential candidate for low-power spintronic devices."]}}, {"title": "Thermomagnonic torques in insulating altermagnets", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/918g-3q7f", "authors": "Edward Schwartz, Hamed Vakili, Alexey A. Kovalev", "last_authors": "Hamed Vakili, Alexey A. Kovalev", "summary": "We develop a symmetry-controlled theory of anisotropic thermomagnonic torques in insulating altermagnets. Starting from the stochastic Landau-Lifshitz-Gilbert equations, we identify a spin-splitter magnonic torque associated with thermally generated, sublattice-odd spin currents and an anisotropic e…", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Altermagnetism is relevant to the user's interest in magnetic topological materials and novel spin structures.", "tags": ["altermagnetism", "magnons", "spintronics"], "image": "", "briefing": {"background": "마그노닉스(Magnonics)는 전자의 이동 없이 스핀의 파동인 마그논을 이용해 정보를 전달함으로써 열 발생을 최소화하려는 분야입니다. 최근 알터마그넷의 독특한 이방적 밴드 구조가 마그논 수송에 미치는 영향이 주목받고 있습니다.", "motivation": "절연체 알터마그넷에서 온도 구배(Temperature gradient)에 의해 발생하는 마그논 토크의 특성을 규명하고, 이를 자성 제어에 활용할 수 있는 이론적 기반을 구축하는 것입니다.", "result": "알터마그넷 특유의 서브래티스 대칭성으로 인해 발생하는 '스핀-스플리터(Spin-splitter)' 마그논 토크와 이방성 에팅스하우젠(Ettingshausen) 마그논 토크를 이론적으로 유도하고 식별했습니다.", "implication": "전류를 흘리기 어려운 절연체 자성체에서도 열을 이용해 효율적으로 스핀 토크를 생성하고 자화 방향을 제어할 수 있는 가능성을 열었습니다.", "novelty": "금속이 아닌 절연체 기반의 알터마그넷에서 열-마그논 상호작용을 다루었으며, 이는 독자의 관심사인 알터마그네티즘과 스핀 구조 제어 연구에 새로운 시각을 제공합니다.", "unresolved": "이론적으로 예측된 마그논 토크의 크기가 실제 실험 장치에서 측정 가능한 수준인지, 그리고 불순물 산란이 토크의 이방성에 미치는 영향에 대한 검토가 필요합니다.", "future_work": "절연성 알터마그넷 박막과 중금속 층의 이종 접합 구조에서 열 유도 스핀 토크 측정 실험 및 마그논 홀 효과와의 연관성 연구가 예상됩니다.", "concepts": [{"term": "마그논 (Magnon)", "why_emerged": "자성체 내의 스핀 정렬이 흐트러지는 집단적인 들뜸(Elementary excitation)을 양자화하여 설명하기 위해 도입되었습니다.", "origin": "Felix Bloch (1930)에 의해 제안되었습니다.", "connections": "스핀파, 마그노닉스, 스핀 제벡 효과."}, {"term": "서멀 마그노닉 토크 (Thermomagnonic torque)", "why_emerged": "전기적 수단이 아닌 열(온도 차)을 이용해 자성체의 자화 방향을 조절하기 위한 물리적 힘이 필요하여 연구되었습니다.", "origin": "초록 정보만으로는 특정하기 어려우나, 스핀 칼로리트로닉스 분야에서 파생되었습니다.", "connections": "스핀-전달 토크(STT), 스핀 제벡 효과, LLG 방정식."}, {"term": "스핀-스플리터 효과 (Spin-splitter effect)", "why_emerged": "알터마그넷에서 스핀 방향에 따라 전하/스핀 흐름이 공간적으로 분리되는 현상을 설명하기 위해 제안되었습니다.", "origin": "알터마그네티즘 연구와 함께 최근 제안된 개념입니다.", "connections": "알터마그네티즘, 스핀 홀 효과, 이방성 수송."}, {"term": "LLG 방정식 (Landau-Lifshitz-Gilbert equation)", "why_emerged": "시간에 따른 자성체의 자화 세차 운동과 감쇠 과정을 현상론적으로 기술하기 위해 필수적입니다.", "origin": "Landau, Lifshitz (1935) 및 Gilbert (1955).", "connections": "자화 역학, 마그논, 스핀 토크."}], "english_summary": ["Develops a symmetry-controlled theory for anisotropic thermomagnonic torques in insulating altermagnets.", "Identifies a unique 'spin-splitter' magnonic torque arising from sublattice-odd spin currents.", "Uses stochastic Landau-Lifshitz-Gilbert equations to model thermal magnon generation and transport.", "Provides a theoretical pathway for heat-driven magnetization control in altermagnetic insulators."]}}, {"title": "Atomic-Scale Visualization of Quantum Phase Transition in Mixed-Valence Regime", "journal": "PRL_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/17nh-csbr", "authors": "Xingsen Chen, Junyi Zhang, Qiaoyan Yu, et al.", "last_authors": "Hao Zheng, Jinfeng Jia", "summary": "Fe dopants on the surface of a ${\\mathrm{Bi}}_{2}{\\mathrm{Te}}_{3}$ thin film grown on a superconducting ${\\mathrm{NbSe}}_{2}$ substrate by molecular beam epitaxy are investigated by a dilution-refrigerator scanning tunneling microscope. Utilizing the tip-induced band bending effect, we precisely ma…", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "STM study on topological insulator heterostructure providing relevant electronic structure and spectroscopic insights.", "tags": ["STM", "Bi2Te3", "superconductivity"], "image": "", "briefing": {"background": "혼성 원자가(mixed-valence) 시스템은 고체 물리에서 전자의 국소적 상태와 비국소적 상태 사이의 상호작용을 연구하는 중요한 장입니다. 특히 위상 절연체(TI)와 초전도체(SC)의 이종구조 내에서 도펀트의 전자적 상태를 제어하는 것은 양자 상전이와 새로운 준입자(예: Majorana) 연구의 핵심입니다.", "motivation": "Bi2Te3 위상 절연체 박막과 NbSe2 초전도 기판 이종구조에 증착된 Fe 도펀트의 전자적 거동을 원자 단위에서 규명하고, 외부 팁을 이용해 이러한 양자 상태를 인위적으로 조절할 수 있는지 탐구하고자 했습니다.", "result": "희석 냉동기 STM을 이용하여 Fe 도펀트 주변의 전자 구조를 정밀하게 측정했습니다. 특히 STM 팁에 의한 밴드 굴곡(tip-induced band bending) 효과를 활용하여, 혼성 원자가 영역에서 일어나는 양자 상전이(QPT) 과정을 원자 스케일에서 성공적으로 시각화했습니다.", "implication": "개별 불순물의 원자가 상태를 팁 전압 등으로 국부적으로 조절함으로써, 위상 물질 내의 초전도 및 자성 특성을 정밀하게 튜닝할 수 있는 실험적 경로를 제시했습니다.", "novelty": "STM/STS를 활용한 전자 구조 가시화는 독자의 핵심 관심사입니다. 특히 NbSe2(독자 관심 물질)를 기판으로 사용하고, 위상 절연체 표면에서 양자 상전이를 조절하며 시각화했다는 점에서 기술적/학술적 가치가 높습니다.", "unresolved": "상전이 과정에서 나타나는 구체적인 스핀 상태의 변화나 Kondo 효과와 Yu-Shiba-Rusinov 상태 간의 미시적인 경쟁 메커니즘에 대한 추가 분석이 필요할 수 있습니다.", "future_work": "다른 종류의 자성 도펀트(Mn, Cr 등)나 다양한 위상 물질 계면에서의 응용 연구가 기대되며, 이를 활용한 양자 비트나 나노 스케일 소자 설계 연구로 이어질 수 있습니다.", "concepts": [{"term": "Mixed-Valence Regime", "why_emerged": "금속 내의 희토류나 전이 금속 불순물이 두 가지 이상의 원자가 상태 사이에서 요동치는 현상을 설명하기 위해 도입되었습니다.", "origin": "L.M. Falicov와 J.C. Kimball(1969) 등의 이론적 연구와 이후 실험적 확인.", "connections": "Kondo lattice, Heavy fermion systems"}, {"term": "Tip-Induced Band Bending", "why_emerged": "STM 팁의 전계가 반도체나 절연체 표면의 전하 분포를 변화시켜 국부적인 에너지 준위를 이동시키는 현상을 이해하기 위해 필요했습니다.", "origin": "STM 기술의 발전과 함께 반도체 표면 분석 과정에서 발견됨.", "connections": "STS, Schottky barrier, Field effect"}, {"term": "NbSe2", "why_emerged": "대표적인 층상 구조(2D) 초전도체이자 전하 밀도파(CDW)가 공존하는 물질로, 위상 물질과의 이종구조 제작에 널리 쓰입니다.", "origin": "1960-70년대 전이 금속 디칼코게나이드 연구 중 확립.", "connections": "Charge Density Wave (CDW), Superconductivity, vdW heterostructures"}, {"term": "Quantum Phase Transition (QPT)", "why_emerged": "절대 영도에서 온도 대신 압력, 자기장, 도핑 등 매개변수 변화에 의해 일어나는 상전이를 기술하기 위해 등장했습니다.", "origin": "S. L. Sondhi 등(1997)에 의해 현대적 개념으로 정리됨.", "connections": "Quantum criticality, Phase diagram, Emergent phenomena"}], "english_summary": ["Atomic-scale visualization of quantum phase transitions in Fe-doped Bi2Te3/NbSe2 heterostructures using STM.", "Demonstrates precise control over mixed-valence states via tip-induced band bending effects.", "Maps the evolution of electronic structures across the transition at the single-atom limit.", "Provides a platform for tuning topological and superconducting properties in hybrid systems."]}}, {"title": "Emergence of a Symmetry-Broken Chern Insulator near a Moiré Kondo Breakdown", "journal": "PRL_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/szcj-44xj", "authors": "Wanghao Tian, Bowen Shen, Lizhong Li, et al.", "last_authors": "Jie Shan, Kin Fai Mak", "summary": "A new class of topological states emerging near a Kondo breakdown in a moiré Kondo lattice system reveals a connection between the chiral Kondo interaction and the formation of topologically nontrivial states at fractional moiré fillings—an observation that has not been reported in previous heavy-fermion systems.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Topologically nontrivial states in moire Kondo systems are relevant for correlated electron materials.", "tags": ["moire", "topological", "Kondo", "heavy-fermion"], "image": "", "briefing": {"background": "모아레(Moiré) 초격자 시스템은 강상관 전자 물리와 위상 수학적 특성을 결합할 수 있는 혁신적인 플랫폼입니다. 최근에는 무거운 페르미온 시스템에서 나타나는 곤도(Kondo) 물리와 위상 절연체 특성을 모아레 시스템에서 구현하려는 연구가 활발합니다.", "motivation": "모아레 곤도 격자 시스템에서 곤도 붕괴(Kondo breakdown)가 일어날 때 나타나는 새로운 위상 상태의 존재 유무와 그 물리적 기원을 밝히고자 했습니다.", "result": "곤도 붕괴 영역 근처에서 대칭성이 깨진 첸 절연체(Chern Insulator) 상태가 생성됨을 확인했습니다. 이는 키랄 곤도 상호작용(chiral Kondo interaction)이 특정 모아레 채움(filling) 상태에서 위상적으로 유의미한 상태를 형성하는 데 기여함을 보여줍니다.", "implication": "기존의 무거운 페르미온 물질에서는 관찰되지 않았던 새로운 형태의 위상 상태를 발견함으로써, 강상관 물질 내의 위상 제어 가능성을 확장했습니다.", "novelty": "모아레 시스템에서의 곤도 물리와 첸 절연체의 결합은 독자의 'moire/twisted' 및 'topological insulators' 관심사와 완벽히 일치합니다. 특히 곤도 붕괴라는 양자 임계 현상 근처에서의 위상 상태 발현은 매우 새로운 결과입니다.", "unresolved": "대칭성 붕괴가 정확히 어떤 대칭성(시간 역전 대칭성 등)을 어느 정도로 깨뜨리는지에 대한 미시적인 대칭성 분석이 추가로 요구됩니다.", "future_work": "키랄 상호작용의 강도를 조절하여 첸 수를 제어하거나, 분수 첸 절연체(Fractional Chern Insulator) 상태로의 전이 가능성을 탐색하는 연구가 가능합니다.", "concepts": [{"term": "Moiré Kondo Lattice", "why_emerged": "두 층의 반도체나 전도체를 비틀어 쌓아 거대한 격자 주기를 만들고, 이를 통해 국소적인 스핀과 전도 전자의 상호작용(Kondo)을 증폭하기 위해 등장했습니다.", "origin": "최근 2D 물질 비틀림 연구(Twistronics)에서 파생됨.", "connections": "Twisted bilayer graphene, Heavy fermions"}, {"term": "Kondo Breakdown", "why_emerged": "곤도 상호작용에 의해 형성된 무거운 준입자가 파괴되어 국소 스핀과 전도 전자가 분리되는 양자 임계 현상을 설명하기 위해 필요합니다.", "origin": "P. Coleman, Q. Si 등에 의해 무거운 페르미온 시스템에서 이론화됨.", "connections": "Quantum criticality, Local moment, Heavy fermion"}, {"term": "Chern Insulator", "why_emerged": "외부 자기장 없이 물질 내부의 대칭성 붕괴와 위상적 특성만으로 양자 홀 효과를 나타내는 절연체를 정의하기 위해 등장했습니다.", "origin": "F.D.M. Haldane (1988)의 모델 제안.", "connections": "Quantum Anomalous Hall Effect, Berry curvature"}, {"term": "Chiral Kondo Interaction", "why_emerged": "스핀-궤도 결합이나 특정 격자 대칭성 하에서 곤도 산란이 방향성을 가지는 경우를 기술하기 위해 필요합니다.", "origin": "최근 위상 물질과 곤도 효과의 결합 연구에서 부각됨.", "connections": "Spin-orbit coupling, Topological Kondo insulator"}], "english_summary": ["Discovery of a symmetry-broken Chern insulator emerging near the Kondo breakdown in moiré lattices.", "Establishes a link between chiral Kondo interactions and non-trivial topology at fractional fillings.", "Identifies a novel class of topological states not previously observed in bulk heavy-fermion systems.", "Highlights moiré systems as a versatile platform for exploring the intersection of Kondo physics and topology."]}}, {"title": "Evolution of the Superfluid Density in Infinite-Layer Nickelates", "journal": "PRL_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/25gn-bfgw", "authors": "Bai Yang Wang, Shannon P. Harvey, Kyuho Lee, et al.", "last_authors": "Srinivas Raghu, Harold Y. Hwang", "summary": "An experiment enables the first systematic, absolute superfluid-density measurement across the full superconducting dome of an infinite-layer nickelate.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Experimental study of superfluid density in nickelates, a material class of interest.", "tags": ["experiment", "superconductivity", "nickelates"], "image": "", "briefing": {"background": "무한 층 니켈레이트(infinite-layer nickelates)는 2019년 초전도성이 발견된 이후, 구리 산화물(cuprates) 초전도체와 유사한 메커니즘을 가졌을 것이라는 기대로 인해 고온 초전도 연구의 새로운 격전지가 되었습니다.", "motivation": "니켈레이트 초전도체의 성질을 이해하는 가장 중요한 척도 중 하나인 초전도 유체 밀도(superfluid density)를 도핑에 따른 초전도 돔(dome) 전체 영역에서 절대값으로 측정하고자 했습니다.", "result": "니켈레이트 시스템 전체 초전도 돔에 걸쳐 절대적인 초전도 유체 밀도를 처음으로 계통 측정했습니다. 이를 통해 도핑량 변화에 따른 초전도체의 강성(stiffness) 변화를 정량적으로 확인했습니다.", "implication": "이 결과는 니켈레이트의 초전도 메커니즘이 약한 결합의 BCS 이론을 따르는지, 혹은 강한 상관관계가 지배하는 구리 산화물과 유사한지를 판별하는 결정적인 실험 데이터로 활용될 것입니다.", "novelty": "니켈레이트에서 초전도 유체 밀도의 '절대값'을 돔 전체에서 측정했다는 점이 핵심입니다. 독자의 nickelates 및 unconventional superconductivity 관심사에 매우 중요한 정보를 제공합니다.", "unresolved": "측정된 유체 밀도의 온도 의존성이 특정 대칭성(s-wave 또는 d-wave)을 명확히 지시하는지, 그리고 잔여 비초전도 성분이 존재하는지에 대한 논의가 남아있습니다.", "future_work": "다양한 기판 스트레인(strain) 조절을 통한 유체 밀도 변화 연구 및 니켈레이트 내의 전하 밀도파(CDW)와의 경쟁 관계 규명이 기대됩니다.", "concepts": [{"term": "Infinite-Layer Nickelates", "why_emerged": "Perovskite 구조에서 산소를 제거하여 Ni 이온의 산화수를 조절함으로써 구리 산화물과 유사한 d9 전자 상태를 만들기 위해 연구되었습니다.", "origin": "Danilo Li, Harold Hwang 등 (2019, NdNiO2 초전도 발견).", "connections": "Cuprates, High-Tc superconductivity, NdNiO2, PrNiO2"}, {"term": "Superfluid Density", "why_emerged": "초전도 응축에 참여하는 전하 운반자의 밀도를 나타내며, 초전도 상태의 견고함(stiffness)을 측정하는 핵심 물리량입니다.", "origin": "London brothers (1935)의 런던 이론에서 파생됨.", "connections": "London penetration depth, Kinetic inductance"}, {"term": "Superconducting Dome", "why_emerged": "비정형 초전도체에서 도핑이나 압력에 따라 초전도 임계 온도(Tc)가 종 모양(dome)으로 변화하는 보편적 현상을 설명하기 위해 쓰입니다.", "origin": "Cuprates 연구 과정에서 정립된 개념.", "connections": "Quantum phase diagram, Optimal doping"}, {"term": "Absolute Measurement", "why_emerged": "상대적인 변화가 아닌 실제 물리량의 수치를 확정함으로써 이론 모델과의 직접적인 비교를 가능하게 하기 위해 중요합니다.", "origin": "정밀 계측 물리학 분야.", "connections": "Mutual inductance, Muon spin rotation (uSR)"}], "english_summary": ["Reports the first systematic, absolute superfluid-density measurements across the full nickelate superconducting dome.", "Provides critical quantitative data for determining the pairing mechanism in infinite-layer nickelates.", "Evaluates the superconducting stiffness as a function of hole doping.", "Contributes to the ongoing debate on the similarities and differences between nickelates and cuprates."]}}, {"title": "Unveiling High-Energy Ultrafast Responses Driven by Fermi-Level Gap Opening in Charge-Density Waves", "journal": "PRL_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/vz71-r52l", "authors": "Qiong Wu, Tianchen Hu, Junhan Huang, et al.", "last_authors": "Tao Dong, Nan-Lin Wang", "summary": "Ultrafast pump-probe spectroscopy is indispensable for investigating interactions, collective excitations, and nonequilibrium dynamics in superconductors and correlated electron systems. However, how a small gap opening near the Fermi surface affects the spectral changes in the high-energy interband…", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Relevant to spectroscopy/dynamics of CDW materials, closely aligned with experimental interests.", "tags": ["CDW", "ultrafastspectroscopy", "correlated"], "image": "", "briefing": {"background": "전하 밀도 파동(CDW)은 저차원 전도체에서 전자-격자 상호작용으로 인해 페르미 준위 근처에 에너지 갭을 형성하며 발생하는 현상입니다. 이 갭은 물질의 전도성과 광학적 특성을 결정짓는 핵심 요소입니다.", "motivation": "기존 연구들은 주로 페르미 준위 근처의 낮은 에너지 영역에서의 갭 형성에 집중해 왔으나, 이러한 미세한 변화가 높은 에너지 영역의 인터밴드(interband) 전이 및 초고속 동역학에 어떤 영향을 미치는지에 대해서는 이해가 부족했습니다.", "result": "연구진은 초고속 펌프-프로브 분광학을 통해 페르미 준위의 CDW 갭 형성이 고에너지 대역의 광학적 응답에 직접적인 변화를 유도한다는 것을 확인했습니다. 이는 에너지 스케일이 서로 다른 물리 현상들이 강하게 결합되어 있음을 보여줍니다.", "implication": "낮은 에너지의 전자 구조 변화가 전체 시스템의 광학적 특성을 재구성할 수 있음을 시사하며, 이는 CDW 물질을 이용한 초고속 광소자 설계에 중요한 기초 데이터를 제공합니다.", "novelty": "CDW 시스템에서 초고속 시분해 분광학을 사용하여 저에너지 갭 물리와 고에너지 광학 응답 사이의 연결 고리를 밝혀냈습니다. 사용자께서 관심을 가지는 CDW 물질의 분광학적 이해를 심화시키는 결과입니다.", "unresolved": "초록 정보만으로는 특정 물질에서의 정량적인 결합 세기나 갭의 크기에 따른 응답의 비선형성 정도를 파악하기 어렵습니다.", "future_work": "다양한 온도 및 펌프 광 에너지 조건에서 실험을 수행하여 CDW 전이의 보편적인 동역학 모델을 구축할 것으로 예상됩니다.", "concepts": [{"term": "Charge-Density Waves (CDW)", "why_emerged": "저차원 금속 시스템에서 격자 왜곡과 결합된 전하 밀도의 주기적 재배열을 설명하기 위해 도입되었습니다.", "origin": "Rudolf Peierls가 1D 금속의 불안정성을 이론적으로 제시(Peierls instability)한 데서 기원합니다.", "connections": "Peierls instability, Fermi surface nesting, ARPES 갭 측정 연구와 밀접하게 연관됩니다."}, {"term": "Ultrafast pump-probe spectroscopy", "why_emerged": "평형 상태에서 관찰할 수 없는 전자의 들뜸 상태와 피코초(ps) 이하의 빠른 상호작용 동역학을 관측하기 위해 개발되었습니다.", "origin": "초단파 레이저 기술의 발전과 함께 1980년대 이후 응집물질 물리 연구에 본격 도입되었습니다.", "connections": "시분해 ARPES(tr-ARPES), 비평형 상전이 연구의 핵심 도구입니다."}, {"term": "Interband transition", "why_emerged": "물질이 빛을 흡수할 때 서로 다른 에너지 밴드 간에 전자가 이동하는 현상을 설명하기 위해 필요합니다.", "origin": "고체 물리 초기 양자역학적 밴드 이론 확립 과정에서 정립되었습니다.", "connections": "물질의 복소 유전율, 반사율 등 광학적 특성 해석의 근간이 됩니다."}], "english_summary": ["Investigates the link between low-energy CDW gap opening and high-energy interband optical responses.", "Utilizes ultrafast pump-probe spectroscopy to track non-equilibrium electronic dynamics.", "Demonstrates that Fermi-level modifications significantly drive spectral changes in high-energy regimes.", "Provides a deeper understanding of energy-scale coupling in correlated electron systems."]}}, {"title": "Giant elastoresistance in magic-angle twisted bilayer graphene", "journal": "Science", "source": "Gemini", "link": "https://www.science.org/doi/abs/10.1126/science.adz0597?af=R", "authors": "Xuetao Ma, Zhaoyu Liu, Jiaqi Cai, et al.", "last_authors": "Jiun-Haw Chu, Matthew Yankowitz", "summary": "Strongly correlated and topological phases in moiré materials are exquisitely sensitive to lattice geometry at both atomic and superlattice length scales. Twist angle, pressure, and strain directly modify the lattice and thus act as highly effective tuning parameters. Here, we examined electrical transport in twisted bilayer graphene subjected to continuous uniaxial strain. Near the magic angle (≈1.1°), devices exhibited a pronounced elastoresistance that depended on band filling and temperature, with a gauge factor more than two orders of magnitude larger than that of conventional metals. In selected doping regimes, the elastoresistance exhibited a Curie-Weiss–like temperature divergence. We discuss possible microscopic origins, including nematic fluctuations and enhanced electronic entropy from fluctuating isospin moments. Our work establishes uniaxial strain as a versatile probe of correlated physics in a moiré material.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Important experiment on moire systems, relevant for broader quantum materials understanding.", "tags": ["moire", "graphene", "transport"], "image": "", "briefing": {"background": "매직 앵글 비틀림 이층 그래핀(MATBG)은 특정 각도에서 전자 밴드가 평평해지며 강한 상관관계와 위상학적 특성을 나타냅니다. 이러한 특성은 격자 구조의 미세한 변화(스트레인)에 매우 민감합니다.", "motivation": "연속적인 일축 변형(uniaxial strain)을 가했을 때 MATBG의 전자 수송 특성이 어떻게 변화하는지 측정하여, 물질 내의 네마틱 요동(nematic fluctuations)이나 등속스핀(isospin) 물리와의 연관성을 규명하고자 했습니다.", "result": "매직 앵글 근처에서 일반 금속보다 100배 이상 큰 거대한 엘라스토레지스턴스(변형에 따른 저항 변화)를 발견했습니다. 특히 특정 도핑 영역에서 저항 변화율이 퀴리-바이스 법칙을 따르는 온도 의존성을 보임을 확인했습니다.", "implication": "이러한 거대 응답은 MATBG 내부에 전자적 네마틱성이 존재하거나, 대칭성이 붕괴된 이소스핀 모멘트의 엔트로피 효과가 강력하게 작용하고 있음을 시사합니다.", "novelty": "스트레인을 정밀하게 제어하는 실험 기법을 모아레 시스템에 적용하여 새로운 튜닝 파라미터를 제시했습니다. 사용자께서 관심 있는 네마틱성 및 상관 전자계 연구에 직접적인 정보를 제공합니다.", "unresolved": "거대 엘라스토레지스턴스의 주된 원인이 순수한 네마틱 요동인지, 아니면 이소스핀 대칭성 붕괴에 의한 것인지에 대한 정밀한 이론적 구분이 필요합니다.", "future_work": "스트레인 하에서의 STM 관측이나 다른 모아레 시스템(ABC-TLG 등)으로의 확장 연구가 기대됩니다.", "concepts": [{"term": "Elastoresistance", "why_emerged": "물질에 기계적 변형(strain)을 가했을 때 전기 저항이 변화하는 정도를 측정하여 전자 구조의 이방성을 조사하기 위해 사용됩니다.", "origin": "초록 정보만으로는 특정하기 어려우나, 고체 수송 특성 연구의 표준 기법 중 하나입니다.", "connections": "Electronic nematicity, Gauge factor, Piezoresistivity와 연관됩니다."}, {"term": "Magic-angle twisted bilayer graphene (MATBG)", "why_emerged": "그래핀 층 사이의 비틀림 각도를 조절해 강상관 물리(초전도, 절연체 상)를 구현하기 위해 등장했습니다.", "origin": "2018년 MIT의 Pablo Jarillo-Herrero 그룹에서 실험적으로 처음 구현되었습니다.", "connections": "Flat bands, Moiré superlattice, Unconventional superconductivity와 연결됩니다."}, {"term": "Isospin", "why_emerged": "그래핀의 밸리(valley)와 스핀(spin) 자유도를 결합하여 다중항 상태를 설명하기 위한 양자수로 도입되었습니다.", "origin": "핵물리학의 아이소스핀 개념을 고체물리 밸리 자유도에 유추하여 적용했습니다.", "connections": "Symmetry breaking, Isospin ferromagnetism, Quantum Hall effect와 관련됩니다."}], "english_summary": ["Reports giant elastoresistance in magic-angle twisted bilayer graphene under uniaxial strain.", "Observes a gauge factor two orders of magnitude higher than conventional metals.", "Identifies Curie-Weiss-like temperature divergence, suggesting proximity to a phase transition.", "Discusses the roles of electronic nematicity and fluctuating isospin moments in the moiré lattice."]}}, {"title": "Layer-decoupled electronic reconstruction and a robust charge density wave in GdTe3", "journal": "npj_QuantumMaterials", "source": "Gemini", "link": "https://www.nature.com/articles/s41535-026-00946-9", "authors": "Xin Zheng, Yunbo Wu, Tongrui Li, et al.", "last_authors": "Shengtao Cui, Zhe Sun", "summary": "Layer-decoupled electronic reconstruction and a robust charge density wave in GdTe 3", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Electronic structure and CDW physics in layered tellurides is highly relevant to user interest.", "tags": ["CDW", "tellurides", "electronic_structure"], "image": "https://pubads.g.doubleclick.net/gampad/ad?iu=/285/npjquantmats.nature.com/article&sz=728x90&c=-875909913&t=pos%3Dtop%26type%3Darticle%26artid%3Ds41535-026-00946-9%26doi%3D10.1038/s41535-026-00946-9%26subjmeta%3D301,639,766%26kwrd%3DMaterials+science,Physics", "briefing": {"background": "GdTe3는 희토류 트리텔루라이드(RTe3) 계열의 물질로, 이차원적인 전하 밀도 파동(CDW) 특성을 연구하기 위한 대표적인 시스템입니다. 이들 물질은 층상 구조를 가지며 전자 구조의 2D 이방성이 강합니다.", "motivation": "GdTe3에서 층 간의 결합이 약해졌을 때 전자 구조가 어떻게 재구성되는지, 그리고 그 과정에서도 CDW 상이 얼마나 견고하게 유지되는지를 확인하고자 했습니다.", "result": "실험을 통해 GdTe3에서 층 분리(layer-decoupled)에 따른 전자적 재구성이 일어남을 관찰했으며, 그럼에도 불구하고 CDW 상태가 매우 안정적(robust)으로 유지됨을 밝혀냈습니다.", "implication": "물질의 층상 결합력을 조절함으로써 전자 구조를 제어할 수 있는 가능성을 보여주며, CDW doi%3D10.1038/s41535-026-00953-w%26subjmeta%3D301,639,766%26kwrd%3DMaterials+science,Physics", "briefing": {"background": "니켈산염은 고온 초전도체인 구리산염의 대안으로 주목받고 있으며, 특히 La3Ni2O7은 상압 하에서의 초전도 가능성 및 복잡한 전자-자기 구조로 인해 강상관 전자계 연구의 핵심 물질로 떠올랐습니다.", "motivation": "La3Ni2O7의 초전도 메커니즘을 이해하기 위해 필수적인 정보인 박막 상태에서의 스핀 상관관계를 구체적으로 분석하고자 했습니다.", "result": "La3Ni2O7 박막의 스핀 상관관계를 실험적으로 관측하고 분석하여, 물질 내 자기적 정렬과 상관관계의 특성을 밝혀냈습니다.", "implication": "니켈산염 초전도체에서 자기적 요동이나 스핀 상관관계가 전하 캐리어의 페어링에 기여하는 방식을 이해하는 데 중요한 단서를 제공합니다.", "novelty": "벌크가 아닌 박막 형태의 La3Ni2O7에서 스핀 동역학을 분석했다는 점이 독보적이며, 구리산염과의 비교 연구에서 니켈산염 고유의 자기적 특성을 규명하는 데 기여합니다.", "unresolved": "박막의 두께 및 기판과의 상호작용이 초전도성 및 스핀 상관관계에 미치는 구체적인 영향은 여전히 논의의 여지가 있습니다.", "future_work": "도핑 변화에 따른 스핀 상관관계의 진화 과정 관찰 및 RIXS 등을 통한 더 정밀한 자기 진동 모드 분석이 필요합니다.", "concepts": [{"term": "La3Ni2O7", "why_emerged": "구리산염 이후 새로운 고온 초전도 물질을 찾는 과정에서 니켈의 3d 궤도 특성을 활용하고자 등장함.", "origin": "최근 고압 초전도 실험으로 주목받기 시작함.", "connections": "구리산염 초전도체, 페로브스카이트 산화물 연구와 연결됨."}, {"term": "스핀 상관관계", "why_emerged": "강상관 전자계에서 전자 간의 상호작용이 전하와 스핀 자유도에 미치는 영향을 이해하기 위해 필요함.", "origin": "자기학의 기초 이론에서 확립됨.", "connections": "RIXS, 중성자 산란, 초전도 메커니즘의 요동 이론."}], "english_summary": ["Investigates spin correlations in La3Ni2O7 thin films.", "Crucial for understanding the pairing mechanism in nickelate superconductors.", "Provides experimental insights into magnetic orders that may compete or cooperate with superconductivity.", "Connects thin-film magnetism to the broader context of correlated nickelate physics."]}}, {"title": "Spatiotemporal intensity-cycling microscopy unveils many-body interactions and correlated transport in van der Waals semiconductors", "journal": "Nature_Materials", "source": "Gemini", "link": "https://www.nature.com/articles/s41563-026-02800-6", "authors": "Jakhangirkhodja A. Tulyagankhodjaev, Michelle E. Reynoso, Yongseok Hong, et al.", "last_authors": "Xavier Roy, Milan Delor", "summary": "Intensity-cycling spatiotemporal microscopy separates single-particle and multi-par t_authors": "Hui Deng", "summary": "Light–matter condensates get a magnetic control knob. In the layered magnet CrSBr, reorienting the spins with a modest field shifts the condensate’s colour by more than 10 meV.", "tier": "B_IMPORTANT_CONDMAT", "score": "7", "reason": "Magnetic control of excitons in vdW magnets is relevant to correlated systems.", "tags": ["magnetism", "vdW", "exciton"], "image": "https://media.springernature.com/m685/springer-static/image/art%3A10.1038%2Fs41563-026-02790-5/MediaObjects/41563_2026_2790_Fig1_HTML.png", "briefing": {"background": "빛과 물질의 강한 결합 상태인 엑시톤 폴라리톤은 양자 광학 및 스핀트로닉스 분야에서 매우 중요한 역할을 합니다.", "motivation": "반데르발스 자성체인 CrSBr 내의 자기적 질서와 빛-물질 응축 상태 사이의 능동적인 제어 가능성을 탐색하고자 했습니다.", "result": "외부 자기장을 통해 CrSBr의 스핀 정렬을 조절함으로써, 빛-물질 응축물의 색상(에너지)을 10 meV 이상 변화시키는 데 성공했습니다.", "implication": "자기적 질서를 광학적 정보 처리 및 제어의 스위치로 사용할 수 있음을 시사하며, 자성체 기반의 광-소자 구현 가능성을 제시합니다.", "novelty": "자성체와 빛-물질 결합 상태를 결합하여 자기장으로 광학적 출력을 즉각적으로 튜닝할 수 있는 '자기 제어 노브'를 확보했다는 점이 핵심입니다.", "unresolved": "해당 효과의 효율성 및 더 높은 온도에서의 동작 가능성, 그리고 스핀-궤도 결합의 구체적 경로에 대한 정밀한 분석이 필요합니다.", "future_work": "초고속 자기장 펄스를 이용한 응축 상태의 동역학 제어 및 다른 자성 구조체로의 확장 연구.", "concepts": [{"term": "CrSBr", "why_emerged": "공기 중 안정성이 높은 반데르발스 반강자성체로서 스핀트로닉스 응용 가능성 때문에 주목받음.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "A-타입 반강자성, 자성 엑시톤."}, {"term": "빛-물질 응축물", "why_emerged": "광자와 전자 시스템이 강하게 결합하여 거시적인 양자 상태를 형성하는 시스템을 연구하기 위해 필요함.", "origin": "엑시톤 폴라리톤 이론으로부터 발전.", "connections": "보스-아인슈타인 응축, 폴라리톤 레이저."}], "english_summary": ["Demonstrates magnetic control of light-matter condensates in CrSBr.", "Reorienting spins with a modest magnetic field shifts the condensate energy.", "Provides a new mechanism for tunable opto-magnetic devices.", "Highlights the potential of layered magnets in controlling quantum light states."]}}, {"title": "Beyond the lowest Landau level: Unlocking more robust fractional states using flat Chern bands with higher vortexability", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/5yrq-qjkh", "authors": "Yitong Zhang, Siddhartha Sarkar, Xiaohan Wan, Daniel E. Parker, Shi-Zeng Lin, Kai Sun", "last_authors": "Shi-Zeng Lin, Kai Sun", "summary": "Enhancing the many-body gap of a fractional state is crucial for realizing robust fractional excitations. For fractional Chern insulators, existing studies suggest that making flat Chern bands closely resemble the lowest Landau level (LLL) seems to maximize the excitation gap, providing an apparently optimal platform. In this work, we demonstrate that from the LLL limit can, in fact, produce substantially larger fractional quantum Hall gaps. Using moiré flat bands with strongly non-Landau-level wave functions, we show that the gap can exceed that of the LLL by more than two orders of magnitude for short-range interactions and by factors of two to three for long-range interactions. This enhancement is generic across Abelian fractional Chern insulator states and follows a universal enhancement factor within each hierarchy. In the Landau-level framework, we identify the amplification of pseudopotentials as the microscopic origin of the observed enhancement. More generally, in a Chern band system where the pseudopotential decomposition is not well defined, we find a sharp scaling distinction: in the strongly screened regime, the ν = 1 / 3 gap scales cubically with gate distance d s in the LLL and vortexable Chern bands, but linearly in higher-vortexable Chern bands. The activation of this leading O ( d s ) term by deviating from ideal quantum geometry is the key origin of the gap enhancement, and this criterion remains meaningful even without rotational symmetry. We further examined non-Abelian states and found that within finite-size resolution, this wave-function construction method can also be used to manipulate and enhance the gap for certain interaction parameters. We further discuss experimental implications of our findings in twisted bilayer MoTe 2 .", "tier": "B_IMPORTANT_CONDMAT", "score": "7", "reason": "Fractional Chern insulators and topological band structures are of interest to the user.", "tags": ["Chern", "topological", "LandauLevel"], "image": "", "briefing": {"background": "분수 양자홀 효과를 격자 구조에서 구현하는 분수 천 절연체(Fractional Chern Insulator, FCI) 연구는 외부 자기장 없이도 위상 상태를 얻을 수 있다는 점에서 중요합니다. 기존에는 이 상태들을 '가장 낮은 란다우 준위(LLL)'와 유사하게 만드는 것이 최적이라고 여겨졌습니다.", "motivation": "LLL과 유사하게 밴드를 평탄화하는 것만이 분수 상태의 에너지 갭을 극대화하는 유일한 방법인지, 혹은 란다우 준위의 한계를 뛰어넘는 새로운 설계 원리가 존재하는지 탐구하고자 했습니다.", "result": "란다우 준위와 다른 파동함수를 가진 모아레 평탄 밴드를 사용하여, 특정 상호작용 하에서 LLL보다 100배 이상 큰 분수 양자홀 갭을 구현할 수 있음을 보였습니다. 특히 '보텍스 가능성(vortexability)'이 높은 밴드 구조가 갭 증폭의 핵심임을 규명했습니다.", "implication": "단순히 LLL을 모방하는 것보다 고차 보텍스를 가진 밴드를 설계하는 것이 더 강력한 위상 상태를 만들 수 있음을 제시하며, 향후 더 높은 온도에서 분수 양자 상태를 관측할 가능성을 열었습니다.", "novelty": "기존 통념을 깨고 '란다우 준위로부터의 이탈'이 오히려 갭 크기를 증폭시킨다는 점을 이론적으로 정립했으며, 트위스트 이중층 MoTe2와 같은 실제 모아레 시스템에 바로 적용 가능한 가이드라인을 제공합니다.", "unresolved": "비가환(non-Abelian) 상태에서의 정확한 갭 증폭 메커니즘과 유한 크기 효과에 따른 한계점이 완전히 해결되지 않았습니다.", "future_work": "트위스트 이중층 MoTe2에서의 실험적 검증 및 더 넓은 범위의 모아레 물질에서의 분수 상태 안정성 계산.", "concepts": [{"term": "Fractional Chern Insulator", "why_emerged": "강한 자기장 없이도 위상학적으로 분수 양자홀 상태를 구현하여 저전력 소자 등에 활용하기 위해 필요.", "origin": "초록 정보만으로는 특정하기 어려움 (주요 제안자: Neupert, Sheng, Haldane 등)", "connections": "분수 양자홀 효과, 모아레 격자, 위상 밴드 구조."}, {"term": "Vortexability", "why_emerged": "밴드의 기하학적 특성을 설명하고 파동함수가 자기장 내의 란다우 준위와 얼마나 유사하거나 다른지 정량화하기 위해 도입.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "란다우 준위, 천 절연체, 양자 기하학."}, {"term": "Pseudopotentials", "why_emerged": "Haldane이 분수 양자홀 상태의 상호작용을 체계적으로 분류하기 위해 도입한 개념.", "origin": "F. D. M. Haldane (1983).", "connections": "러플린 파동함수, 분수 양자홀 효과, 갭 이론."}], "english_summary": ["Challenges the conventional wisdom that fractional Chern insulators must mimic the lowest Landau level.", "Demonstrates that high-vortexability moiré bands can boost fractional quantum Hall gaps by orders of magnitude.", "Identifies the amplification of pseudopotentials as r 1D quantum magnetic physics.", "Thermodynamic analysis confirms the gapped nature of the spin excitations."]}}, {"title": "Simulating the Haldane model in ultraclean GaAs heterostructures", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/rk2w-qmk7", "authors": "Francesco Cioni, Lorenzo Cavicchi, Fabio Taddei, Marco Polini", "last_authors": "Fabio Taddei, Marco Polini", "summary": "The Haldane model represents the minimal lattice-based realization of a Chern insulator, exhibiting a quantized Hall conductance in the absence of Landau levels. Despite its conceptual elegance, the implementation in crystalline solids of the requisite pattern of Peierls phases breaking time-reversal symmetry remains experimentally demanding. In this work, we theoretically investigate the possibility to simulate the Haldane model in ultraclean GaAs/AlGaAs heterostructures. Our proposal relies on recent experiments in which a high-mobility two-dimensional electron gas is subject to a gate-defined honeycomb electrostatic potential and a laterally periodic magnetic field generated by patterned ferromagnetic structures. The combined electrostatic and magnetic superlattices furnish a viable route to emulate the topological properties of the Haldane model.", "tier": "B_IMPORTANT_CONDMAT", "score": "7", "reason": "Realization of Chern insulator physics in GaAs heterostructures; valuable for topological research.", "tags": ["experiment", "topological", "Cherninsulator", "heterostructure"], "image": "", "briefing": {"background": "위상 절연체와 퀀텀 홀 효과의 기원인 Haldane 모델은 시간 역전 대칭성을 깨는 Peierls 위상을 필요로 하여 실제 결정 격자에서 구현하기 매우 어렵습니다.", "motivation": "최근 고이동도 GaAs/AlGaAs 이종 접합에서의 발전된 게이트 제어 및 미세 가공 기술을 활용하여, 인공적인 벌집 격자 전위와 주기적 자기장을 결합함으로써 Haldane 모델의 위상 특성을 모사할 수 있는지 이론적으로 검증하고자 합니다.", "result": "정전기적 초격자와 자성체를 이용한 주기적 자기장의 조합이 Haldane 모델의 물리적 환경을 충실히 재현할 수 있음을 이론적으로 입증했습니다.", "implication": "실제 고체 결정의 한계를 넘어 엔지니어링된 이종 접합에서 위상물질의 물리적 특성을 자유롭게 조절하고 연구할 수 있는 플랫폼을 제시합니다.", "novelty": "독창적인 실험적 구성을 통해 고전적이지만 실현이 어려웠던 Haldane 모델을 제어가능한 반도체 헤테로구조로 가져왔으며, 이는 위상적 물성 연구의 새로운 경로가 됩니다.", "unresolved": "이론적 제안 단계로, 실제 미세 자기장 패턴을 제작했을 때 발생하는 소음이나 산란이 위상 상태를 얼마나 유지할 수 있는지에 대한 정밀한 측정은 남아있습니다.", "future_work": "실제 GaAs 헤테로구조에서의 나노 패터닝 제작 및 이로 인한 양자 수송 현상 실험이 뒤따라야 합니다.", "concepts": [{"term": "Haldane 모델", "why_emerged": "Landau level 없이도 양자화된 홀 컨덕턴스를 보여주는 위상 절연체의 최소 격자 모델이 필요했음.", "origin": "F. D. M. Haldane (1988).", "connections": "Chern insulator, 양자 변칙 홀 효과."}, {"term": "Chern insulator", "why_emerged": "시간 역전 대칭성이 깨진 상태에서 위상적으로 보호받는 가장자리를 가진 절연체를 설명하기 위해 필요함.", "origin": "Haldane (1988).", "connections": "Integer Quantum Hall Effect, Topological insulator."}, {"term": "GaAs/AlGaAs 이종 접합", "why_emerged": "초고이동도 2차원 전자 가스를 형성하여 양자 현상을 정밀하게 관측하기 위한 표준 플랫폼.", "origin": "Dingle et al. (1978).", "connections": "2DEG, 분수 양자 홀 효과."}], "english_summary": ["Proposes a platform to simulate the Haldane model using GaAs/AlGaAs heterostructures.", "Uses gate-defined honeycomb potential and periodic magnetic fields to mimic Chern insulator physics.", "Provides a viable path for emulating topological states in engineered semiconductor systems.", "Demonstrates that electrostatic and magnetic superlattices can overcome natural material limitations."]}}, {"title": "Sondheimer magneto-oscillations as a probe of Fermi surface reconstruction in underdoped cuprates", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/73v3-nbrg", "authors": "Alexander Nikolaenko, Carsten Putzke, Philip J. W. Moll, Subir Sachdev, Pavel A. Nosov", "last_authors": "Subir Sachdev, Pavel A. Nosov", "summary": "Determining the Fermi surface (FS) volume in underdoped cuprates is crucial for understanding the nature of the strongly correlated pseudogap phase. Conventional quantum oscillation techniques, typically used for this purpose, are inapplicable in this high-temperature regime due to thermal and disor…", "tier": "B_IMPORTANT_CONDMAT", "score": "7", "reason": "Application of transport techniques to probe Fermi surfaces in correlated systems like cuprates.", "tags": ["cuprates", "Fermisurface", "transport"], "image": "", "briefing": {"background": "구리산화물(Cuprates)의 저도핑 영역에서 나타나는 의사갭(pseudogap) 상의 정체와 페르미 표면 재구성(Fermion surface reconstruction)은 고온 초전도 연구의 핵심 난제입니다.", "motivation": "전통적인 양자 진동(quantum oscillation) 측정법은 고온에서 열적 요동과 불순물 효과로 인해 적용이 어려워, 이를 극복할 수 있는 새로운 수송 측정 기법이 필요했습니다.", "result": "Sondheimer 진동을 활용하여 강한 상관관계를 가진 구리산화물의 페르미 표면 재구성 과정을 프로빙할 수 있는 방법론을 제시했습니다.", "implication": "의사갭 상의 전자 구조에 대한 보다 명확한 정보를 얻어 구리산화물의 초전도 메커니즘을 밝히는 데 기여할 수 있습니다.", "novelty": "기존의 QO 방식이 한계를 보이는 영역에서 수송 현상을 통해 페르미 표면을 분석함으로써 고온 초전도체 연구에 돌파구를 제시합니다.", "unresolved": "이 기법이 실제 실험 환경에서 요구되는 매우 높은 정밀도와 샘플 순도를 어떻게 유지할지에 대한 현실적인 제약이 존재합니다.", "future_work": "다양한 저도핑 구리산화물 샘플에 이 기법을 적용한 정밀 수송 실험 및 결과 분석이 필요합니다.", "concepts": [{"term": "Sondheimer 진동", "why_emerged": "금속의 수송 계수에서 자기장 의존적인 진동을 통해 페르미 표면 정보를 추출하기 위해 고안됨.", "origin": "E. H. Sondheimer (1950년대).", "connections": "Shubnikov-de Haas 효과, 양자 진동."}, {"term": "페르미 표면 재구성", "why_emerged": "저도핑 구리산화물에서 전하 밀도 파동(CDW)이나 반강자성 정렬 등으로 페르미 표면의 크기나 모양이 변하는 현상을 이해하기 위해.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "Pseudogap, CDW, Quantum Criticality."}, {"term": "의사갭(Pseudogap)", "why_emerged": "초전도 전이 온도 이상에서도 나타나는 에너지 갭 현상을 설명하기 위해 도입됨.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "Cuprates, 고온 초전도."}], "english_summary": ["Addresses the challenge of probing Fermi surfaces in underdoped cuprates.", "Utilizes Sondheimer magneto-oscillations to circumvent limitations of conventional quantum oscillations.", "Proposes a transport-based probe for Fermi surface reconstruction in the pseudogap regime.", "Provides a potential tool for investigating strongly correlated systems where standard methods fail."]}}, {"title": "Spin current generation controlled by the Néel state in a compensated ferrimagnet", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10. entiates these materials from momentum-dependent spin-split altermagnets.", "Offers new insights into spintronic control in zero-net-magnetization materials."]}}, {"title": "Terahertz field driven nonlinear Hall effect and other second order transport phenomena in two-dimensional tellurene", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/w8fp-vmm7", "authors": "M. D. Moldavskaya, L. E. Golub, E. Mönch, et al.", "last_authors": "J. Wunderlich, S. D. Ganichev", "summary": "We study terahertz field-driven second order nonlinear electron transport phenomena, including the nonlinear Hall effect (NLHE), in two-dimensional tellurene flakes. The dc current excited by linearly polarized terahertz (THz) radiation in Hall bar samples is investigated in directions both along an…", "tier": "B_IMPORTANT_CONDMAT", "score": "7", "reason": "Nonlinear transport and 2D tellurides connect to the user's interests in 112 tellurides and Hall physics.", "tags": ["Halleffect", "transport", "tellurene"], "image": "", "briefing": {"background": "반전 대칭성이 깨진 저차원 물질에서는 비선형 수송 현상이 나타날 수 있으며, 이는 전자의 Berry 곡률 쌍극자 모멘트와 관련이 있습니다.", "motivation": "2차원 텔루렌(Tellurene) 박막에서 테라헤르츠(THz) 자기장 유도 비선형 홀 효과(NLHE)의 물리적 기원을 규명하고자 함.", "result": "선형 편광 THz 방사선에 의해 유도된 직류 전류를 관찰하였으며, 이는 물질의 대칭성 깨짐과 비선형 수송 계수에 의한 것임을 확인함.", "implication": "저차원 물질의 위상학적 특성을 이용한 고속 THz 검출기나 비선형 전자 소자 개발의 기초를 제공함.", "novelty": "텔루렌이라는 특정 2D 시스템에서 THz 기반의 비선형 수송 현상을 정밀하게 측정한 드문 사례임.", "unresolved": "실험적 결과가 내인적(intrinsic) Berry 곡률 효과와 외인적(extrinsic) 산란 효과 중 어디에 더 지배받는지에 대한 엄밀한 분리는 추가 분석이 필요함.", "future_work": "다른 2D 키랄 물질과의 비교 연구 및 게이트 전압 조절을 통한 비선형 계수 튜닝 실험.", "concepts": [{"term": "비선형 홀 효과", "why_emerged": "반전 대칭성이 깨진 계에서 Berry 곡률의 비대칭적 분포를 탐구하기 위해 필요함.", "origin": "Fu (2015) 등에 의해 이론적으로 제안됨.", "connections": "Berry 곡률 쌍극자, 위상학적 수송 현상."}, {"term": "텔루렌", "why_emerged": "텔루륨의 2차원 동소체로서 강한 스핀-궤도 결합과 이방성 특성 때문.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "112 텔루라이드, 반도체 특성."}], "english_summary": ["Investigation of second-order nonlinear electron transport in 2D tellurene.", "THZ-driven nonlinear Hall effect observed in Hall bar samples.", "Results highlight the role of symmetry breaking in nonlinear responses.", "Potential for high-speed THz signal processing applications."]}}, {"title": "Gossamer Superconductivity in Moiré WSe2 Bilayer", "journal": "PRL_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/mvnb-m6fd", "authors": "Hui-Ke Jin, Guangyue Ji, Zhan Wang, Jie Wang, Fu-Chun Zhang", "last_authors": "Jie Wang, Fu-Chun Zhang", "summary": "Moiré transition metal dichalcogenides have served as a versatile platform for simulating Hubbard physics. Recent experiments have identified robust superconductivity in moiré bilayer ${\\mathrm{WSe}}_{2}$ for certain twist angles. Here, we propose the gossamer nature of the superconductivity recentl…", "tier": "B_IMPORTANT_CONDMAT", "score": "7", "reason": "Theory paper on moiré superconductivity; fits into the broader strongly correlated/van der Waals interests.", "tags": ["moire", "superconductivity", "WSe2"], "image": "", "briefing": {"background": "모아레 초격자는 강상관 전자계 물리학을 연구하는 강력한 플랫폼으로, 특히 WSe2 이중층에서 초전도 현상이 발견되어 주목받고 있습니다.", "motivation": "최근 모아레 WSe2에서 관찰된 강건한 초전도 현상이 기존의 일반적인 초전도체와 어떻게 다른지 이론적 모델을 통해 규명하고자 함.", "result": "해당 시스템의 초전도성이 '고서머(Gossamer)' 특성을 지님을 제안함. 이는 초전도 상태가 페르미 액체와 불안정한 기저 상태 사이의 미묘한 평형에 놓여 있음을 의미함.", "implication": "모아레 시스템 내 강상관 초전도 기작을 이해하는 새로운 관점을 제시함.", "novelty": "고서머 초전도성 개념을 모아레 이중층에 처음으로 적용하여 해당 물질의 전자 구조적 불안정성을 설명함.", "unresolved": "실험적으로 도핑 농도에 따른 고서머 상태의 전이 경계가 명확히 관찰되지 않았음.", "future_work": "도핑 제어를 통한 초전도성 소멸 과정의 정밀 측정 및 초전도 기작에 관한 미시적 모델 고도화.", "concepts": [{"term": "고서머 초전도", "why_emerged": "강하게 상관된 절연체와 초전도체 사이의 경쟁 상태를 설명하기 위해 필요함.", "origin": "Laughlin (2002) 등에 의해 제안됨.", "connections": "고온 초전도체, 페르미-루티저 액체 물리학."}, {"term": "모아레 초격자", "why_emerged": "두 층 사이의 꼬임각을 통해 전자 밴드 구조를 인위적으로 설계하기 위함.", "origin": "Cao et al. (2018, 뒤틀린 이중층 그래핀) 이후 확립됨.", "connectio function render() {
  slideEl.replaceChildren();
  if (!slides.length) { slideEl.className = 'empty'; slideEl.textContent = 'No papers passed the filters in this run.'; counterEl.textContent = '0 / 0'; prevBtn.disabled = true; nextBtn.disabled = true; return; }
  slideEl.className = 'slide';
  const r = slides[index];
  const b = r.briefing || {};
  const head = document.createElement('div');
  head.className = 'paper-head';
  if (r.image) {
    const figure = document.createElement('figure');
    figure.className = 'figure';
    const img = document.createElement('img');
    img.src = r.image; img.alt = 'Figure or article preview image'; img.loading = 'lazy'; img.referrerPolicy = 'no-referrer'; img.onerror = () => figure.remove();
    figure.appendChild(img);
    figure.appendChild(textEl('figcaption', '', 'Figure / article preview image from the source page'));
    head.appendChild(figure);
  }
  const headText = document.createElement('div');
  headText.className = 'head-text';
  const badges = document.createElement('div');
  badges.className = 'badges';
  if (r.score) badges.appendChild(textEl('span', 'badge score', `${r.score}/10`));
  if (r.tier) badges.appendChild(textEl('span', 'badge', r.tier));
  if (r.journal) badges.appendChild(textEl('span', 'badge', r.journal));
  if (r.source) badges.appendChild(textEl('span', 'badge', r.source));
  headText.appendChild(badges);
  const title = document.createElement('h1');
  if (r.link) { const titleLink = document.createElement('a'); titleLink.href = r.link; titleLink.target = '_blank'; titleLink.rel = 'noopener noreferrer'; titleLink.textContent = r.title || ''; title.appendChild(titleLink); }
  else { title.textContent = r.title || ''; }
  headText.appendChild(title);
  headText.appendChild(textEl('p', 'meta', [r.journal, r.source].filter(Boolean).join(' | ')));
  if (r.last_authors || r.authors) { const authors = document.createElement('p'); authors.className = 'authors'; if (r.last_authors) authors.append('Last authors: ' + r.last_authors); if (r.authors) authors.append((r.last_authors ? ' | ' : '') + 'Authors: ' + r.authors); headText.appendChild(authors); }
  appendLabeledText(headText, 'why', 'Filter reason: ', r.reason);
  if (r.tags && r.tags.length) { const tags = document.createElement('div'); tags.className = 'tags'; r.tags.forEach(tag => tags.appendChild(textEl('span', 'tag', '#' + tag))); headText.appendChild(tags); }
  if (r.link) { const link = document.createElement('a'); link.className = 'link'; link.href = r.link; link.target = '_blank'; link.rel = 'noopener noreferrer'; link.textContent = 'Open paper'; headText.appendChild(link); }
  head.appendChild(headText);
  if (r.summary) { const abstract = document.createElement('p'); abstract.className = 'original-abstract'; const strong = textEl('strong', '', 'Original abstract'); abstract.appendChild(strong); abstract.append(r.summary); head.appendChild(abstract); }
  slideEl.appendChild(head);
  const briefing = document.createElement('div');
  briefing.className = 'briefing';
  appendBriefSection(briefing, 'Background', b.background);
  appendBriefSection(briefing, 'Motivation', b.motivation);
  appendBriefSection(briefing, 'Result', b.result);
  appendBriefSection(briefing, 'Implication', b.implication);
  appendBriefSection(briefing, "Why it's important / Novelty", b.novelty);
  appendBriefSection(briefing, 'Unresolved Questions', b.unresolved);
  appendBriefSection(briefing, 'Expected Future Work', b.future_work);
  if (b.concepts && b.concepts.length) {
    const section = document.createElement('section');
    section.className = 'brief-section wide';
    section.appendChild(textEl('h2', '', 'Concepts / Terms'));
    const concepts = document.createElement('div');
    concepts.className = 'concepts';
    b.concepts.forEach(c => {
      const item = document.createElement('div');
      item.className = 'concept';
      item.appendChild(textEl('h3', '', c.term || 'Concept'));
      [['왜 생겼나: ', c.why_emerged], ['누가 만들었나: ', c.origin], ['연결되는 흐름: ', c.connections]].forEach(([label, text]) => { if (!text) return; const p = document.createElement('p'); const bold = textEl('b', '', label); p.appendChild(bold); p.append(text); item.appendChild(p); });
      concepts.appendChild(item);
    });
    section.appendChild(concepts);
    briefing.appendChild(section);
  }
  if (b.english_summary && b.english_summary.length) { const section = document.createElement('section'); section.className = 'brief-section wide'; section.appendChild(textEl('h2', '', 'English Summary')); const ul = document.createElement('ul'); b.english_summary.slice(0, 5).forEach(line => ul.appendChild(textEl('li', '', line))); section.appendChild(ul); briefing.appendChild(section); }
  slideEl.appendChild(briefing);
  counterEl.textContent = `${index + 1} / ${slides.length}`;
  prevBtn.disabled = index === 0;
  nextBtn.disabled = index === slides.length - 1;
}
prevBtn.addEventListener('click', () => { index = Math.max(0, index - 1); render(); });
nextBtn.addEventListener('click', () => { index = Math.min(slides.length - 1, index + 1); render(); });
document.addEventListener('keydown', event => { if (event.key === 'ArrowLeft') prevBtn.click(); if (event.key === 'ArrowRight') nextBtn.click(); });
render();
</script>
</body>
</html>
