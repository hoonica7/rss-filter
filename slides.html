<!DOCTYPE html>

<head>
<meta charset='UTF-8'>
<meta name='viewport' content='width=device-width, initial-scale=1.0'>
<title>Daily Paper Slideshow</title>
<style>
  :root {
    color-scheme: light;
    --bg: #f6f7f4;
    --paper: #ffffff;
    --ink: #111827;
    --muted: #64748b;
    --line: #d8ddd2;
    --accent: #176b87;
    --accent-2: #9a3412;
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; overflow: auto; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: var(--bg); color: var(--ink); }
  .shell { max-width: 1500px; min-height: 100vh; margin: 0 auto; padding: 14px 18px; display: flex; flex-direction: column; }
  .topbar { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 16px; }
  .top-actions { display: flex; align-items: center; gap: 10px; }
  .topbar a, button { border: 1px solid var(--line); border-radius: 8px; background: var(--paper); color: var(--ink); padding: 10px 14px; font-weight: 700; text-decoration: none; cursor: pointer; }
  button.primary { background: var(--accent); border-color: var(--accent); color: white; }
  button:disabled { opacity: 0.45; cursor: not-allowed; }
  .counter { color: var(--muted); font-weight: 700; }
  .slide { min-height: calc(100vh - 82px); background: var(--paper); border: 1px solid var(--line); border-radius: 10px; padding: 18px; box-shadow: 0 18px 42px rgba(15, 23, 42, 0.10); display: grid; grid-template-columns: minmax(310px, 0.86fr) minmax(0, 1.55fr); gap: 18px; overflow: visible; }
  .paper-head { min-width: 0; min-height: 0; overflow: visible; display: flex; flex-direction: column; gap: 12px; }
  .figure { margin: 0; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: #f8fafc; }
  .figure img { display: block; width: 100%; max-height: 41vh; object-fit: contain; background: white; }
  .figure figcaption { padding: 7px 10px; color: var(--muted); font-size: 12px; line-height: 1.3; }
  .head-text { display: flex; flex-direction: column; gap: 9px; min-width: 0; }
  .badges { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .badge { border-radius: 999px; padding: 5px 9px; background: #eef2ff; color: #3730a3; font-size: 12px; font-weight: 800; }
  .score { background: #fee2e2; color: #991b1b; }
  h1 { margin: 0; font-size: 25px; line-height: 1.15; letter-spacing: 0; overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
  h1 a { color: inherit; text-decoration-color: rgba(23, 107, 135, 0.35); text-decoration-thickness: 2px; text-underline-offset: 4px; }
  h1 a:hover { color: var(--accent); text-decoration-color: var(--accent); }
  .meta, .authors, .why, .abstract { font-size: 13px; line-height: 1.45; }
  .meta, .authors { color: var(--muted); }
  .why strong, .abstract strong, .authors strong { color: var(--ink); }
  .authors { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .why { border-left: 4px solid var(--accent-2); padding-left: 10px; color: #374151; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .abstract { border-top: 1px solid var(--line); padding-top: 14px; color: #374151; }
  .original-abstract { border-top: 1px solid var(--line); padding-top: 10px; color: #374151; font-size: 11.5px; line-height: 1.35; overflow-wrap: anywhere; }
  .original-abstract strong { display: block; margin-bottom: 4px; color: var(--ink); }
  .tags { display: flex; flex-wrap: wrap; gap: 8px; }
  .tag { border-radius: 999px; padding: 4px 8px; background: #f1f5f9; color: #475569; font-size: 12px; font-weight: 700; }
  .head-text > .link { display: none; }
  .briefing { min-width: 0; min-height: 0; overflow: visible; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); grid-auto-rows: minmax(0, auto); align-content: start; gap: 11px 18px; border-top: 0; padding-top: 0; }
  .brief-section { min-width: 0; }
  .brief-section.wide { grid-column: 1 / -1; }
  .brief-section h2 { margin: 0 0 4px; font-size: 14px; line-height: 1.22; color: #0f766e; letter-spacing: 0; }
  .brief-section p, .brief-section li { margin: 0; font-size: 12.5px; line-height: 1.42; color: #1f2937; overflow-wrap: anywhere; }
  .brief-section ul { margin: 0; padding-left: 20px; }
  .concepts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 9px 14px; }
  .concept { border-top: 1px solid var(--line); padding-top: 7px; }
  .concept h3 { margin: 0 0 4px; font-size: 13px; color: #7c2d12; letter-spacing: 0; }
  .concept p { margin: 2px 0 0; font-size: 11.5px; line-height: 1.35; color: #374151; overflow-wrap: anywhere; }
  .concept b { color: #111827; }
  .link { color: var(--accent); font-weight: 800; text-decoration: none; }
  .empty { padding: 48px; background: var(--paper); border: 1px solid var(--line); border-radius: 12px; color: var(--muted); }
  @media (max-width: 860px) {
    .shell { padding: 14px; }
    .topbar, .top-actions { align-items: stretch; flex-direction: column; }
    .slide, .briefing, .concepts { grid-template-columns: 1fr; }
    .slide { min-height: auto; overflow: visible; display: grid; }
    h1 { font-size: 28px; }
  }
</style>

<script>
const slides = [{"title": "Monolayer van der Waals kagome lattice for high-temperature flat-band physics", "journal": "Nature_Physics", "source": "author whitelist", "link": "https://www.nature.com/articles/s41567-026-03492-0", "authors": "Hyungkun Bong, Choongjae Won, Seongyong Lee, et al.", "last_authors": "Kyle M. Shen, Mingu Kang", "summary": "The experimental realization of intrinsic 2D kagome materials with controllable flat bands has remained challenging. Now a van der Waals kagome material family is shown to host an isolated, gate-tunable flat band down to the monolayer limit.", "tier": "A_MUST_READ", "score": "10", "reason": "author whitelist: Chris Jozwiak", "tags": ["kagome", "vanderWaals", "monolayer", "flatband"], "image": "https://media.springernature.com/m685/springer-static/image/art%3A10.1038%2Fs41567-026-03492-0/MediaObjects/41567_2026_3492_Fig1_HTML.png", "briefing": {"background": "카고메(kagome) 격자는 기하학적 좌절(frustration)로 인해 에너지가 거의 일정한 '플랫 밴드(flat band)'를 형성할 수 있는 구조입니다. 이러한 플랫 밴드에서는 전자 간 상호작용이 극대화되어 초전도, 자성, 또는 비전형적인 위상 상태와 같은 강상관 물리 현상이 나타날 가능성이 매우 높습니다.", "motivation": "기존의 벌크 카고메 물질들은 플랫 밴드가 다른 밴드들과 섞여 있거나, 전하 밀도파(CDW) 등 복잡한 질서와 얽혀 있어 플랫 밴드 고유의 물성을 순수하게 제어하기 어려웠습니다. 특히 원자층 수준(monolayer)에서 안정적이고 게이트 전압으로 튜닝 가능한 플랫 밴드를 구현하는 것이 주요 과제였습니다.", "result": "연구진은 반데르발스(vdW) 결합 구조를 가진 새로운 카고메 격자 물질군을 발견하고, 이를 단일 원자층 수준까지 박리하는 데 성공했습니다. ARPES 등을 통해 이 물질이 원자층 한계에서도 다른 밴드와 분리된(isolated) 고유의 플랫 밴드를 유지하며, 이를 게이트 전압으로 정밀하게 조절할 수 있음을 입증했습니다.", "implication": "이 물질은 고온에서도 플랫 밴드 물리(예: Mott 절연체 상태, 비전형적 초전도)를 연구할 수 있는 이상적인 플랫폼을 제공합니다. 특히 vdW 구조 덕분에 다른 2D 물질과의 이종 접합이나 게이트 소자 제작이 용이하여, 플랫 밴드 소자 물리 연구에 획기적인 전환점이 될 것입니다.", "novelty": "카고메 물질을 단일층 한계까지 낮추면서도 플랫 밴드의 특성을 보존하고 게이트 조절 가능성까지 확인한 점이 핵심입니다. 독자의 관심사인 CsV3Sb5와 같은 카고메 금속 연구의 연장선상에서, 더 단순하고 제어 가능한 2D 시스템으로의 확장을 의미합니다.", "unresolved": "단일층 상태에서의 실제 전자-전자 상호작용 강도와 그로 인해 유도될 수 있는 구체적인 다체 현상(fractional Chern insulator 등)의 실험적 증거는 추가 연구가 필요합니다.", "future_work": "극저온 수송 측정 및 게이트 전압에 따른 상도표(phase diagram) 구축, 그리고 이종 접합을 통한 위상적 특성 제어 실험이 기대됩니다.", "concepts": [{"term": "Kagome Lattice", "why_emerged": "기하학적 구조에 기인한 파괴적 간섭을 통해 전자 전송을 억제하고 플랫 밴드를 형성하기 위해 도입되었습니다.", "origin": "일본의 대나무 바구니 패턴에서 유래되었으며, Syozi(1951) 등이 통계 역학 모델로 도입했습니다.", "connections": "Frustrated magnetism, Flat-band physics, Topological insulators."}, {"term": "Flat Band", "why_emerged": "운동 에너지를 억제하여 전자 간의 쿨롱 상호작용이 지배적인 시스템을 만들기 위해 필요합니다.", "origin": "초록 정보만으로는 특정하기 어려우나, Tight-binding 모델의 특수 해로 알려져 있습니다.", "connections": "Mott insulator, High-Tc superconductivity, Wigner crystal."}, {"term": "Van der Waals (vdW) Material", "why_emerged": "층간 결합이 약해 원자층 단위로 박리가 가능하고 이종 접합 소자를 만들기 위해 중요해졌습니다.", "origin": "그래핀의 발견 이후 다양한 2D 소재 연구로 확장되었습니다.", "connections": "Graphene, Transition Metal Dichalcogenides (TMDs), Moire superlattice."}], "english_summary": ["Realization of a monolayer van der Waals kagome material hosting an isolated flat band.", "Demonstrates gate-tunability of the flat band down to the single-layer limit.", "Provides a clean platform for studying correlation-driven physics in 2D kagome lattices.", "Potential for high-temperature flat-band engineering and novel quantum phases."]}}, {"title": "Correlation-enhanced electron-phonon coupling in FeSe/SrTiO3 at a magic angle", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/whx6-mq31", "authors": "Qiang Zou, Antik Sihi, Basu Dev Oli, et al.", "last_authors": "Lian Li, Subhasish Mandal", "summary": "Here, the authors combine first-principles dynamical mean-field theory (DMFT), epitaxial materials design, angle-resolved photoemission spectroscopy, and scanning tunneling microscopy/spectroscopy to show that superconductivity in monolayer FeSe/SrTiO 3 is maximized at a magic FeSe 4 tetrahedral angle. They demonstrate that strong electronic correlations, captured by DMFT, substantially enhance electron-phonon coupling within the FeSe layer and produce a superconducting dome. These findings reveal the microscopic origin of enhanced superconductivity and suggest a route for engineering higher-temperature superconductors.", "tier": "A_MUST_READ", "score": "10", "reason": "Direct hit: combines ARPES, STM, and DMFT to study FeSe/STO superconductivity.", "tags": ["ARPES", "STM", "DMFT", "FeSe", "superconductivity"], "image": "", "briefing": {"background": "monolayer FeSe/SrTiO3(STO) 시스템은 단일층 FeSe가 벌크보다 훨씬 높은 초전도 전이 온도(Tc)를 보이는 현상으로 인해 고온 초전도 연구의 핵심 주제입니다. 특히 계면에서의 전자-포논 결합(EPC)과 전자 상관관계(correlation)가 Tc 향상의 주요 원인으로 지목되어 왔습니다.", "motivation": "FeSe 층의 격자 구조(특히 Fe-Se-Fe 사면체 각도)가 초전도성에 미치는 영향과, 전자 상관관계가 EPC를 어떻게 강화하는지에 대한 미시적인 메커니즘이 명확히 밝혀지지 않았습니다.", "result": "DMFT 계산과 ARPES/STM 실험을 결합하여, FeSe4 사면체가 특정 '매직 각도(magic angle)'를 가질 때 초전도성이 극대화됨을 발견했습니다. 강한 전자 상관관계가 FeSe 층 내의 EPC를 실질적으로 증폭시키며, 이것이 초전도 돔(superconducting dome) 형성을 이끄는 핵심 동력임을 입증했습니다.", "implication": "단순히 계면 효과뿐만 아니라, 원자 단위의 구조 제어(사면체 각도)와 전자 상관관계의 상호작용이 고온 초전도 구현에 결정적임을 시사합니다. 이는 새로운 철 기반 초전도체 설계에 중요한 가이드라인을 제공합니다.", "novelty": "ARPES와 STM이라는 독자의 주력 실험 기법과 DMFT 이론을 결합하여 '매직 각도'라는 구조적 파라미터를 초전도성 강화와 연결시킨 점이 매우 뛰어납니다. 상관관계에 의한 EPC 강화 메커니즘 제시는 독창적입니다.", "unresolved": "사면체 각도를 실험적으로 완벽하게 독립적으로 제어하며 다른 변수(도핑 등)의 영향을 완전히 배제할 수 있는지에 대한 논의가 더 필요할 수 있습니다.", "future_work": "다른 기판 위에서의 FeSe 성장이나 화학적 치환을 통한 사면체 각도 조절 실험, 그리고 유사한 메커니즘이 니켈레이트 등 다른 초전도체에도 적용되는지 확인하는 연구가 필요합니다.", "concepts": [{"term": "DMFT (Dynamical Mean-Field Theory)", "why_emerged": "강한 상관관계가 있는 전자 시스템에서 국소적 상호작용을 비섭동적으로 다루기 위해 고안되었습니다.", "origin": "Antoine Georges, Gabriel Kotliar 등이 1990년대 초에 정립했습니다.", "connections": "Mott transition, Hubbard model, DFT+DMFT."}, {"term": "Electron-Phonon Coupling (EPC)", "why_emerged": "전자와 격자 진동의 상호작용을 통해 전자가 쌍을 이루는(Cooper pair) 전통적인 초전도 메커니즘을 설명하기 위해 필요합니다.", "origin": "BCS 이론(1957)의 핵심 요소로 정립되었습니다.", "connections": "BCS theory, Migdal-Eliashberg theory, Cooper pairs."}, {"term": "FeSe/SrTiO3 Interface", "why_emerged": "단일층 FeSe를 산화물 기판 위에 올렸을 때 발생하는 Tc의 비약적 상승을 연구하기 위해 주목받았습니다.", "origin": "2012년 Qing-Yan Wang 등에 의해 처음 보고되었습니다.", "connections": "Interfacial superconductivity, Unit-cell FeSe, High-Tc superconductors."}], "english_summary": ["Identifies a 'magic' tetrahedral angle that maximizes superconductivity in monolayer FeSe/STO.", "Uses DMFT and ARPES/STM to show that electronic correlations significantly enhance electron-phonon coupling.", "Explains the microscopic origin of the superconducting dome in this interfacial system.", "Suggests structural engineering as a route to higher transition temperatures in superconductors."]}}, {"title": "Influence of the N\\'eel vector on the bulk electronic structure of MnTe measured from the (1 1 00) surface", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2610.20383", "authors": "D. A. Usanov, A. B. Hellenes, S. Hahn, M. Leandersson, J. Osiecki, K. Uhl\\'i\\v{r}ov\\'a, D. Evtushinsky, L. \\v{S}mejkal, T. Jungwirth, J. H. Dil", "last_authors": "D. Evtushinsky, L. \\v{S}mejkal, T. Jungwirth, J. H. Dil", "summary": "Altermagnetism gives rise to momentum-dependent spin splitting without net magnetization. Here, we use angle-resolved photoemission spectroscopy (ARPES) to investigate bulk $\\alpha$-MnTe single crystals cleaved along the $(1\\bar{1}00)$ plane - an orientation that preserves the compensated magnetic symmetry at the surface and substantially reduces surface effects and $k_z$ broadening. We resolve the three-dimensional bulk band structure with markedly enhanced spectral clarity. The $d$-wave band splitting, driven by the altermagnetic order and spin-orbit coupling in the $\\mathbf{\\Gamma}-\\mathbf{K}-\\mathbf{M}$ nodal plane, shows a perfect match to theoretical predictions. We further establish that the valence-band maximum occurs near the $\\mathbf{A}$ point, identifying the corresponding hole pockets as the states governing the transport properties. Spatially resolved measurements reveal systematic variations of the band dispersion along $\\mathbf{\\Gamma}-\\mathbf{K}$ and $\\mathbf{A}-\\mathbf{L}$, associated with different pinning of the N\\'eel vector at the surface. Our results establish a surface-sensitive route to resolving the bulk altermagnetic electronic structure of MnTe and provide direct spectroscopic evidence for N\\'eel-vector-dependent band splitting.", "tier": "A_MUST_READ", "score": "10", "reason": "Direct ARPES study of altermagnetic electronic structure and N\\'eel vector dependence in MnTe.", "tags": ["experiment", "ARPES", "altermagnetism", "electronicstructure", "MnTe", "bandstructure"], "image": "https://arxiv.org/html/2610.20383v1/figures/fig1_v3.jpg", "briefing": {"background": "알터마그네티즘(Altermagnetism)은 순 자화값은 0이지만 결정 구조의 대칭성에 의해 운동량 공간에서 스핀 분할(spin splitting)이 일어나는 새로운 자성 상태입니다. MnTe는 대표적인 알터마그네틱 후보 물질로, 그 전자 구조와 스핀 특성을 직접적으로 관찰하는 것이 이 분야의 핵심 과제입니다.", "motivation": "기존 ARPES 측정은 표면 효과나 스핀-궤도 결합의 영향으로 벌크 알터마그네틱 밴드 구조를 명확히 분별하기 어려웠습니다. 특히 반강자성 정렬의 방향을 나타내는 넬 벡터(N\\u00e9el vector)가 실제 전자 밴드에 미치는 영향을 직접 확인하는 것이 필요했습니다.", "result": "MnTe의 (1-100) 면을 성공적으로 벽개하여 표면 효과가 억제된 벌크 밴드 구조를 고해상도 ARPES로 측정했습니다. 이론적으로 예측된 d-wave 형태의 밴드 분할을 확인했으며, 특히 표면에서의 넬 벡터 고정(pinning) 상태에 따라 밴드 분산이 체계적으로 변화함을 스펙트로스코피 수준에서 최초로 입증했습니다.", "implication": "알터마그네티즘의 물리적 실체를 밴드 구조 차원에서 확증했습니다. 넬 벡터의 방향 조절을 통해 전자 구조를 제어할 수 있음을 보여줌으로써, 알터마그네틱 스핀트로닉스 소자 개발의 기초를 마련했습니다.", "novelty": "특정 결정면(1-100)을 선택하여 벌크 특성을 극대화한 ARPES 실험이라는 점과, 넬 벡터와 밴드 구조 사이의 직접적인 연결 고리를 실험적으로 증명한 점이 독자의 관심사인 ARPES 및 자성체 연구와 완벽히 부합합니다.", "unresolved": "온도 변화에 따른 넬 벡터의 요동(fluctuation)이나 외부 자기장/전류에 의한 넬 벡터 제어 효율에 대해서는 추가적인 실시간 관찰이 필요합니다.", "future_work": "스핀 분해 ARPES(SARPES)를 통한 스핀 편극도 직접 측정과, 전류 유도 넬 벡터 스위칭을 동반한 In-situ ARPES 연구가 기대됩니다.", "concepts": [{"term": "Altermagnetism", "why_emerged": "강자성(자화 있음)과 반강자성(스핀 분할 없음)의 장점을 동시에 갖는 제3의 자성 상태를 설명하기 위해 등장했습니다.", "origin": "L. \\u0160mejkal, J. Sinova, T. Jungwirth 등이 최근(2022년경) 이론적으로 확립했습니다.", "connections": "Antiferromagnetism, Spin splitting, Spintronics."}, {"term": "N\\u00e9el vector", "why_emerged": "반강자성체 내에서 스핀이 정렬된 방향을 정의하고 이를 통해 대칭성을 분석하기 위해 사용됩니다.", "origin": "Louis N\\  to ARPES investigations of MnBi2Te4.; demoted from A: broad CM, not direct user/project hit", "tags": ["material", "topological-insulator", "MnBi2Te4"], "image": "", "briefing": {"background": "MnBi2Te4는 위상 절연체와 자기 정렬이 공존하는 물질로, 자기적 성질에 의한 위상 표면 상태의 에너지 갭 형성이 물리 연구의 핵심입니다.", "motivation": "MnBi2Te4에서 이론적으로 예측된 표면 자기 갭이 종종 관측되지 않는 이유를 파악하고 이를 복구하는 방법을 찾음.", "result": "표면 자기 상태의 교란이 갭 형성을 방해함을 밝히고, 특정 조절을 통해 표면 자기 갭을 복구하는 메커니즘을 규명함.", "implication": "자기 위상 절연체 기반의 양자 비정상 홀 효과 등을 실제 소자에서 구현하는 데 필요한 물질 제어 기술을 확보함.", "novelty": "표면 상태의 비정상적인 거동을 물질 내부의 자기적 환경과 연계하여 해석함으로써 ARPES 데이터의 불일치 원인을 설명함.", "unresolved": "실제 실험 조건에서 표면 자기 갭을 얼마나 견고하게 유지할 수 있는지에 대한 장기적 안정성.", "future_work": "갭이 복구된 MnBi2Te4에서의 수송 현상 측정 및 광학적 제어 실험.", "concepts": [{"term": "자기 위상 절연체", "why_emerged": "위상적 특성과 자기 정렬을 결합해 비자명한 위상 현상을 구현하기 위해 도입됨.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "MnBi2Te4, 양자 비정상 홀 효과."}, {"term": "표면 자기 갭", "why_emerged": "표면 디락 원뿔에 자기적 대칭성 깨짐이 발생할 때 열리는 에너지 간극.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "시간 역전 대칭성 깨짐, 위상 표면 상태."}], "english_summary": ["Addresses the elusive surface magnetic gap in MnBi2Te4.", "Identifies the origin of missing gaps in ARPES measurements.", "Proposes methods to restore the topological gap.", "Crucial for realizing quantized anomalous transport."]}}, {"title": "Anomalously high quasiparticle thermal conductivity in the underdoped cuprate superconductor HgBa2CuO4+", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2607.06332", "authors": "Jordan Baglo, Quentin Barth\\'elemy, \\'Etienne Lefran\\c{c}ois, et al.", "last_authors": "Cyril Proust, Louis Taillefer", "summary": "The single-layer cuprate superconductor HgBa$_{2}$CuO$_{4+\\delta}$ (Hg1201) is an ideal candidate for investigating many properties of cuprates with minimal disorder and without the complication of multiple CuO$_2$ layers. Here we measure the in-plane longitudinal thermal conductivity $\\kappa$ of underdoped Hg1201 ($T_c$ = 76 K, $p$ = 0.11) at dilution refrigerator temperatures to extract the nodal quasiparticle velocity ratio $v_F/v_\\Delta$. Assuming contributions from only a single line node per quadrant on the Fermi surface leads to a value of $v_F/v_\\Delta$ = $23 \\pm 3$, anomalously large compared to other cuprates at similar dopings. In conjunction with the anomalously high quasiparticle specific heat of Hg1201 in the normal state reported previously at a similar doping, this points to more than one Fermi surface sheet crossing the nodal line, suggesting the presence of more than the single small electron pocket detected by quantum oscillations.", "tier": "B_IMPORTANT_CONDMAT", "score": "9", "reason": "Experimental study of nodal quasiparticles and Fermi surface topology in the single-layer cuprate Hg1201.", "tags": ["experiment", "material", "cuprate", "Fermi-surface"], "image": "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAsAAAAOCAYAAAD5YeaVAAAAAXNSR0IArs4c6QAAAAZiS0dEAP8A/wD/oL2nkwAAAAlwSFlzAAALEwAACxMBAJqcGAAAAAd0SU1FB9wKExQZLWTEaOUAAAAddEVYdENvbW1lbnQAQ3JlYXRlZCB3aXRoIFRoZSBHSU1Q72QlbgAAAdpJREFUKM9tkL+L2nAARz9fPZNCKFapUn8kyI0e4iRHSR1Kb8ng0lJw6FYHFwv2LwhOpcWxTjeUunYqOmqd6hEoRDhtDWdA8ApRYsSUCDHNt5ul13vz4w0vWCgUnnEc975arX6ORqN3VqtVZbfbTQC4uEHANM3jSqXymFI6yWazP2KxWAXAL9zCUa1Wy2tXVxheKA9YNoR8Pt+aTqe4FVVVvz05O6MBhqUIBGk8Hn8HAOVy+T+XLJfLS4ZhTiRJgqIoVBRFIoric47jPnmeB1mW/9rr9ZpSSn3Lsmir1fJZlqWlUonKsvwWwD8ymc/nXwVBeLjf7xEKhdBut9Hr9WgmkyGEkJwsy5eHG5vN5g0AKIoCAEgkEkin0wQAfN9/cXPdheu6P33fBwB4ngcAcByHJpPJl+fn54mD3Gg0NrquXxeLRQAAwzAYj8cwTZPwPH9/sVg8PXweDAauqqr2cDjEer1GJBLBZDJBs9mE4zjwfZ85lAGg2+06hmGgXq+j3+/DsixYlgVN03a9Xu8jgCNCyIegIAgx13Vfd7vdu+FweG8YRkjXdWy329+dTgeSJD3ieZ7RNO0VAXAPwDEAO5VKndi2fWrb9jWl9Esul6PZbDY9Go1OZ7PZ9z/lyuD3OozU2wAAAABJRU5ErkJggg==", "briefing": {"background": "구리 산화물(cuprate) 고온 초전도체에서 페르미 표면의 토폴로지와 준입자(quasiparticle)의 특성은 초전도 메커니즘을 이해하는 핵심입니다. 특히 Hg1201은 적층 구조가 단순하고 무질서가 적어 이상적인 모델 물질로 꼽힙니다.", "motivation": "Hg1201 저도핑 영역에서 측정된 열전도율(thermal conductivity) 데이터를 분석하여, 노 al cases, there are also nematic superconductors, in which the rotational symmetry of the lattice is broken in the superconducting state. While there are several examples of nematic superconductors whose pairing emerges inside a preexisting nematic normal state, experimental evidence for superconducting states that intrinsically break rotational symmetry on their own has been exceedingly scarce. Here, we report the experimental realization and identification of an intrinsic multi-component nodal nematic superconducting state in magic-angle twisted trilayer graphene (MATTG). By integrating tunneling spectroscopy with quantum transport measurements, we directly probe the symmetry of low-energy superconducting quasiparticles. Deep inside the superconducting state, we observe a pronounced two-fold anisotropy in the zero-bias tunneling conductance under an in-plane magnetic field, which is strongly suppressed together with superconductivity as the temperature or perpendicular magnetic field is increased. Remarkably, the major axis of anisotropy rotates by up to $90^{\\circ}$ across the superconducting dome, indicating an intrinsic, field- and density-tunable symmetry of the low-energy excitations. These behaviors imply a nodal superconducting state in MATTG that spontaneously breaks the six-fold rotational symmetry of the moir\\'e superlattice. Our results establish moir\\'e graphene as a versatile platform for realizing and interrogating nodal nematic superconductivity, opening a new avenue for exploring unconventional symmetry-breaking superconducting states in two-dimensional materials.", "tier": "B_IMPORTANT_CONDMAT", "score": "9", "reason": "Tunneling spectroscopy evidence for intrinsic nematicity in magic-angle trilayer graphene superconductivity.", "tags": ["method", "material", "nematicity", "superconductivity", "STS"], "image": "https://arxiv.org/html/2610.20605v1/Figure1.png", "briefing": {"background": "모아레 격자 시스템(moiré system)은 강한 상관관계에 의한 다양한 양자 위상을 연구하는 새로운 장을 열었습니다. 그중 초전도 상태에서 회전 대칭성을 자발적으로 깨는 '네마틱 초전도체(nematic superconductor)'는 매우 희귀한 상태입니다.", "motivation": "마술 각도 뒤틀린 삼중층 그래핀(MATTG)에서 나타나는 초전도성의 대칭성을 밝히고, 이것이 물질 고유의 네마틱 특성을 가지는지 검증하고자 했습니다.", "result": "터널링 분광법(STS)을 통해 초전도 상태 내부에서 두 방향의 이방성(anisotropy)을 관측했으며, 이는 초전도도가 육방 격자의 대칭성을 스스로 깨고 있음을 증명합니다.", "implication": "모아레 그래핀이 네마틱 초전도성을 연구할 수 있는 플랫폼임을 입증했으며, 이는 고온 초전도체나 무거운 페르미온 물질 연구의 연장선에서 매우 중요한 발견입니다.", "novelty": "기존 네마틱 상이 존재한 후 초전도가 나타나는 경우와 달리, 초전도 상태 자체가 네마틱성을 유도하는 '내인성' 사례를 포착했습니다.", "unresolved": "초전도 dome 전역에 걸친 네마틱 축의 회전 메커니즘과 그 미시적 원인이 구체적으로 규명되지 않았습니다.", "future_work": "면내 자기장을 통한 네마틱 축 제어의 정밀한 위상 도표 작성 및 강한 상관관계 이론 모델과의 정량적 비교가 필요합니다.", "concepts": [{"term": "Nematic superconductivity", "why_emerged": "초전도 상태에서 결정 격자의 회전 대칭성이 깨져 이방성 물리량을 보이는 상태를 설명하기 위해 도입.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "broken rotational symmetry, unconventional superconductivity"}, {"term": "Magic-angle twisted trilayer graphene", "why_emerged": "평탄 밴드(flat band)를 통해 전자 간 상관관계를 극대화하기 위해 설계된 모아레 구조.", "origin": "Jarillo-Herrero group (2018/2021)", "connections": "moire physics, strong correlation, flat bands"}], "english_summary": ["Experimental identification of intrinsic nodal nematic superconductivity in magic-angle twisted trilayer graphene (MATTG).", "Tunneling spectroscopy reveals two-fold rotational anisotropy in the superconducting state.", "The anisotropy is field- and density-tunable, confirming spontaneous breaking of the C6 moiré lattice symmetry.", "This establishes MATTG as a platform for studying exotic symmetry-breaking superconducting states."]}}, {"title": "Pseudo-relativistic fermions and topological states in zinc-blende semiconductors and their heterostructures (Habilitation thesis)", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2610.19140", "authors": "Sergey S. Krishtopenko", "last_authors": "Sergey S. Krishtopenko", "summary": "Tracing my scientific path from many-body physics in semiconductor nanostructures to topological quantum matter, this Habilitation \\`a diriger des recherches (HDR) memoir presents only part of my research since defending two PhD theses in Toulouse and Nizhny Novgorod in 2011. Focusing on pseudo-relativistic fermions and topological states in zinc-blende semiconductors and their heterostructures, it highlights my independent research program: identifying physical problems, developing predictive theories, and initiating new directions with experimentalists. The first part addresses Kane fermions in bulk HgCdTe: temperature-driven band inversion, domain-wall states, the collapse of Landau levels in crossed electric and magnetic fields, and disorder-induced topological transitions. The second examines pressure-, temperature-, and disorder-driven phase transitions in single and double HgTe quantum wells (QWs), including bilayer-graphene-like semimetals and a two-dimensional higher-order topological insulator (2D HOTI) phase beyond the minimal BHZ model. The third develops three-layer InAs/Ga(In)Sb QWs as a III-V platform for massless Dirac fermions, large-gap quantum spin Hall insulators, 2D HOTI phases, and semimetals with quadratic band touching, and discusses InAs$_{x}$Sb$_{1-x}$/InAs$_{y}$Sb$_{1-y}$ heterostructures as a promising alternative. Several of these predictions are supported by experimental observations, including quantized helical edge transport up to 60 K and the unconventional quantum Hall effect. Defended on March 25, 2026, at the University of Montpellier. Jury: Michel GOIRAN (chair and rapporteur, LNCMI-CNRS, Toulouse); Alexey KAVOKIN (rapporteur, Westlake University, Hangzhou); Robson FERREIRA (rapporteur, LPENS-CNRS, Paris); Alexei BARANOV (member, IES-CNRS, Montpellier); Benoit JOUAULT and Fr\\'ed\\'eric TEPPE (members, L2C-CNRS, Montpellier).", "tier": "B_IMPORTANT_CONDMAT", "score": "9", "reason": "Comprehensive thesis on pseudo-relativistic fermions and topological states in semiconductor heterostructures, directly relevant.", "tags": ["thesis", "topologicalinsulator", "Dirac", "quantumspinHall", "heterostructure", "quantumHall", "semiconductors"], "image": "https://arxiv.org/html/2610.19140v1/PhD_Couverture_Fond.png", "briefing": {"background": "반도체 이종 구조(heterostructure)에서 밴드 반전(band inversion)과 스핀-궤도 결합을 조절하면 위상 절연체나 Dirac 준금속 같은 독특한 전자 구조를 구현할 수 있습니다.", "motivation": "HgTe 및 InAs/GaSb 시스템 등을 중심으로 위상 양자 물질의 발현 조건, 위상 전이, 그리고 이들 물질의 물리적 성질을 체계적으로 정리하고자 했습니다.", "result": "HgCdTe의 밴드 반전, 고차 위상 절연체(HOTI), 2D 위상 절연체 상태 등을 이론적으로 예측하고, 이를 실험적 데이터(전기 수송 등)와 연계하여 검증했습니다.", "implication": "반도체 기반 소자에서 위상 양자 현상을 제어할 수 있는 가능성을 제시하며, 향후 토폴로지 소자 설계의 이론적 토대를 제공합니다.", "novelty": "벌크 HgCdTe부터 복잡한 3층 구조까지 다양한 반도체 시스템에서의 위상적 성질을 통합적으로 고찰했다는 점에서 학술적 가치가 높습니다.", "unresolved": "위상적 성질을 가진 물질들에서 소자 구현 시 발생하는 결함이나 환경 노이즈의 영향에 대한 제어 기술이 더 필요합니다.", "future_work": "실제 나노 구조에서의 위상 엣지 상태 활용 및 응용 분야(양자 컴퓨팅 등)로의 확장성 탐구가 계속될 것입니다.", "concepts": [{"term": "Band inversion", "why_emerged": "밴드갭이 닫혔다가 다시 열리면서 위상 불변량이 변하는 전이 과정을 이해하기 위해 사용.", "origin": "Bernevig, Hughes, Zhang (2006)", "connections": "topological insulator, BHZ model, spin-orbit coupling"}, {"term": "Higher-order topological insulator (HOTI)", "why_emerged": "벌크-경계 대응 원리를 확장하여 차원이 낮은 힌지(hinge)나 코너(corner) 모드를 가지는 물질을 분류하기 위해 필요.", "origin": "Benalcazar, Bernevig, Hughes (2017)", "connections": "topological quantum matter, edge states"}], "english_summary": ["A comprehensive thesis on pseudo-relativistic fermions and topological states in zinc-blende semiconductors.", "Covers systematic studies of band inversion in HgCdTe and topological phases in InAs/GaSb heterostructures.", "Discusses 2D higher-order topological insulators and massless Dirac fermions.", "Demonstrates strong agreement between theoretical predictions and experimental observations in quantum transport."]}}, {"title": "Room-Temperature Metallic 2D Ferromagnetism Stabilized by Quantum Metric", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2610.19713", "authors": "Teng-Fei Ying, Jianqi Zhong, Songyuan Geng, Fangjie Chen, Haoxiang Li, Benjamin T. Zhou", "last_authors": "Haoxiang Li, Benjamin T. Zhou", "summary": "The recent discovery of long-sought dice-lattice bands in layered electride YCl opens up unprecedented opportunities for studying correlated electrons in real dice lattice systems. While the weakly dispersive band at the Fermi level is partially filled and density-wave states are expected due to Fermi surface nesting based on conventional theories, the ARPES measurement nevertheless revealed a uniform flat band splitting of 0.5 eV, suggesting unusual ferromagnetism (FM) borne out of the metallic 2D dice lattice. In this Letter, we propose that the uniform metallic FM order is stabilized by the prominent quantum metric near topological band crossing points at K and K', which reconstructs the magnetic instability in the dice metal and tips the density-wave instability toward a uniform FM order. Importantly, our analysis based on random phase approximation (RPA) and Hartree-Fock theory predicts a remarkably high Curie temperature above room temperature for the 2D FM order. These findings establish the first example of a room-temperature 2D metallic magnet stabilized by quantum metric, which not only exemplifies the fundamental significance of quantum geometry in solids but also bears far-reaching applications in energy-efficient high-density magnetic memories.", "tier": "B_IMPORTANT_CONDMAT", "score": "9", "reason": "Explains unusual ARPES uniform flat-band splitting in YCl using quantum metric and ferromagnetic instability.", "tags": ["theory", "YCl", "ARPES"], "image": "https://arxiv.org/html/2610.19713v1/dicestructureband_7band_compare.png", "briefing": {"background": "2D 자성체 연구는 차세대 정보 소자 구현을 위해 필수적이나, 일반적으로 상온에서 장거리 자기 정렬을 유지하기 어렵다는 한계가 있습니다. Dice 격자(T3 격자) 구조를 가진 물질은 특유의 밴드 구조로 인해 상관관계가 있는 전자 물리 현상을 연구하기에 이상적인 플랫폼입니다.", "motivation": "YCl 물질의 ARPES 측정 결과, 이론적 예측과는 달리 Fermi 준위에서 매우 큰 0.5 eV의 평탄 밴드 갈라짐이 관측되었습니다. 본 연구는 이 현상이 기존의 밀도파 불안정성이 아닌 강자성(FM) 질서에 의한 것임을 규명하고자 했습니다.", "result": "연구진은 양자 메트릭(Quantum Metric) 효과가 K 및 K' 점 근처의 위상학적 밴드 교차점에서 자기 불안정성을 재구성하여, 밀도파 상태를 강자성 상태로 전환시킨다는 것을 이론적으로 입증했습니다. 이는 상온 이상의 큐리 온도를 갖는 2D 금속성 강자성 상태를 예측합니다.", "implication": "양자 기하학(Quantum Geometry)이 고체 내부의 자기적 질서를 제어하는 핵심 인자임을 보여줍니다. 이는 상온 2D 자성 소자의 구현 가능성을 열어주는 중요한 이론적 이정표가 됩니다.", "novelty": "기존의 전형적인 교환 상호작용이 아닌, '양자 메트릭'에 기반한 2D 강자성 안정화 메커니즘을 최초로 제시했습니다. ARPES 데이터 해석과 직결되는 결과로, 본 독자의 관심사인 위상물질 내 전자 구조 연구에 강력한 통찰을 제공합니다.", "unresolved": "이론적인 RPA/Hartree-Fock 예측치이므로, 실제로 상온 자성이 물질의 결함이나 층간 상호작용 없이 발현될 수 있는지에 대한 실험적 검증이 필요합니다.", "future_work": "해당 밴드 구조를 직접 확인하기 위한 저온 및 고온 환경 하에서의 추가적인 spin-resolved ARPES 또는 MOKE 측정.", "concepts": [{"term": "Dice Lattice", "why_emerged": "그래핀과 유사하지만 중심 원자가 추가된 격자 구조로, 평탄 밴드(flat band)를 포함한 독특한 밴드 분산을 연구하기 위해 도입됨.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "허니컴 격자(그래핀), 위상학적 밴드 분산."}, {"term": "Quantum Metric", "why_emerged": "Bloch 파동함수의 기하학적 구조를 설명하기 위해 Berry 곡률과 함께 도입되었으며, 밴드 섞임 및 전자간 상관관계 설명에 필수적임.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "Berry 곡률, Quantum Geometry, 위상 부도체."}], "english_summary": ["Layered electride YCl exhibits an unexpectedly large 0.5 eV flat-band splitting observed via ARPES.", "The authors propose that this splitting is driven by metallic ferromagnetism stabilized by the quantum metric.", "RPA and Hartree-Fock calculations predict a remarkably high Curie temperature above room temperature.", "This mechanism leverages quantum geometry to transform density-wave instability into uniform ferromagnetism."]}}, {"title": "Signatures of symmetry-stabilized Dirac fermions in correlated oxide CaNbO3 thin films", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2610.19276", "authors": "Yunkyu Park, Seoung-Hun Kang, Jeongkeun Song, et al.", "last_authors": "Jong Mok Ok, Ho Nyung Lee", "summary": "Symmetry-protected electronic states in correlated oxides offer a route to combining topology, lattice tunability, and many-body interactions, but creating such topological electronic states in complex oxides remains challenging. Here, we show that oxygen octahedral rotations provide a symmetry-control parameter for stabilizing Dirac-related electronic states in epitaxial CaNbO3 films. By comparing compressively strained tetragonal films and relaxed orthorhombic films, we demonstrate that distinct octahedral rotation patterns preserve nonsymmorphic symmetry and lead to distinct transport signatures consistent with Dirac-like electronic states. The films exhibit metallic transport with high mobility of 138,000 cm2 V-1 s-1, multichannel conduction, and Shubnikov-de Haas oscillations from small high-mobility Fermi pockets. Landau-fan diagram analysis indicates finite Berry-phase contributions, while first-principles calculations reveal a strain-driven evolution from nodal-line band crossings in the orthorhombic phase to Dirac-electron band features in the tetragonal phase. These results establish oxygen octahedral symmetry as a design knob for engineering topological electronic states in correlated perovskite oxides.", "tier": "B_IMPORTANT_CONDMAT", "score": "9", "reason": "Experimental and DFT study of symmetry-stabilized Dirac fermions in correlated oxide thin films.", "tags": ["experiment", "DFT", "Dirac", "correlated", "topological", "transport", "oxides"], "image": "https://arxiv.org/static/browse/0.3.4/images/arxiv-logo-fb.png", "briefing": {"background": "상관관계가 강한 산화물(correlated oxides)은 위상학적 성질과 격자 제어 가능성을 동시에 갖출 수 있는 유망한 플랫폼입니다. 산소 팔면체 회전은 대칭성을 조절하여 페르미 표면 및 밴드 토폴로지를 변화시킬 수 있는 핵심적인 설계 변수입니다.", "motivation": "CaNbO3 박막에서 산소 팔면체 회전 패턴을 변화시켜 위상학적으로 보호된 디락 페르미온 상태를 효과적으로 제어할 수 있는지 확인하고자 했습니다.", "result": "압축 변형이 가해진 사방정계와 완화된 정방정계 박막을 비교하여, 대칭성 제어를 통해 디락-유사 전자 상태를 구현했습니다. 높은 이동도와 함께 Landau-fan diagram에서 Berry 위상이 존재함을 확인했습니다.", "implication": "산소 팔면체 회전이 단순한 격자 왜곡을 넘어, 위상 전자 상태를 설계하는 '제어 노브(knob)'로 활용될 수 있음을 증명했습니다.", "novelty": "DFT 계산과 수송 측정을 결합하여 산화물 박막에서의 대칭성 기반 위상 상태 설계를 구체화했습니다. 이는 위상 산화물 및 상관관계가 있는 전자계 연구자들에게 중요한 실험적 레퍼런스가 됩니다.", "unresolved": "디락 점 근처의 구체적인 위상학적 성질(예: 스핀-궤도 결합에 의한 갭 열림 여부)에 대한 상세한 ARPES 직접 관측은 부족합니다.", "future_work": "ARPES를 이용한 밴드 분산의 직접 관측 및 다양한 변형(strain) 공학을 통한 위상 상태의 전이 과정 연구.", "concepts": [{"term": "Nonsymmorphic Symmetry", "why_emerged": "격자 변환과 대칭 조작(회전, 반사)이 결합된 대칭성으로, 결정 내에서 디락 노드나 밴드 교차를 보호하는 중요한 역할을 함.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "위상 반금속, 디락 페르미온, 결정 대칭성."}, {"term": "Berry Phase", "why_emerged": "파동함수가 매개변수 공간에서 변할 때 얻는 위상학적 위상으로, 전자 수송 특성에 기하학적 정보를 부여함.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "반양자 홀 효과, 위상 물질, Shubnikov-de Haas oscillations."}], "english_summary": ["CaNbO3 thin films demonstrate symmetry-controlled Dirac-like fermions via oxygen octahedral rotations.", "Compressive strain and structural relaxation lead to distinct topological states protected by nonsymmorphic symmetry.", "Transport measurements show high mobility and Berry phase signatures in Landau-fan diagrams.", "This work establishes oxide octahedral symmetry as a versatile design tool for topological engineering."]}}, {"title": "Transverse magneto-gyrotropy driven by spin-induced ferroaxiality", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2610.20061", "authors": "Yoshihiro Okamura, Takumi Kagawa, Ayano Nakamura, et al.", "last_authors": "Ryotaro Arita, Youtarou Takahashi", "summary": "Photon chirality is inherently sensitive to structural handedness and magnetism, which break spatial inversion and time-reversal symmetries, respectively. Ferroaxial order, by contrast, hosts two-dimensional chirality while preserving both symmetries, thereby precluding its direct coupling to photon chirality. Intertwining ferroaxiality with magnetic order, however, may lift such constraints and enable unconventional coupling to photon chirality. Nevertheless, the optical response arising from such intertwined order has yet to be demonstrated experimentally. Here s41563-026-02768-3", "authors": "Lixing Chen, Enkang Zhang, Yiqing Hao, et al.", "last_authors": "Qisi Wang, Jun Zhao", "summary": "Momentum-resolved neutron scattering of a mosaic of single crystals of La3Ni2O7, a parent compound of nickelate superconductors, is reported. The magnetic behaviour of these nickelate crystals is distinct from that of cuprates and furthers our understanding of the origin of superconductivity in this class of materials.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Neutron scattering on magnetic order in nickelate parent compound, relevant to unconventional superconductivity.", "tags": ["neutronscattering", "nickelates", "unconventionalsuperconductivity", "magnetism", "stronglycorrelated"], "image": "https://media.springernature.com/m685/springer-static/image/art%3A10.1038%2Fs41563-026-02768-3/MediaObjects/41563_2026_2768_Fig1_HTML.png", "briefing": {"background": "La3Ni2O7은 80K 이상의 높은 임계 온도를 갖는 니켈계 초전도체로 주목받고 있습니다. 이 물질의 자성 기전과 초전도성 사이의 관계는 고온 초전도 연구의 핵심 화두입니다.", "motivation": "이 물질의 자기적 정렬 상태가 구리 산화물 초전도체(cuprates)와 어떻게 다른지, 그리고 그 스핀 동역학이 초전도성의 기원과 어떻게 연결되는지 파악하는 것이 목적입니다.", "result": "단결정 La3Ni2O7의 중성자 산란을 통해 단일 스트라이프(single-stripe) 형태의 자기 정렬과 이중층(bilayer) 스핀 동역학을 발견했습니다.", "implication": "La3Ni2O7의 자기적 특성이 구리 산화물과는 다른 독특한 상호작용을 보여주며, 이는 새로운 고온 초전도 메커니즘이 존재함을 강력히 시사합니다.", "novelty": "이중층 구조에서 나타나는 스핀 동역학을 momentum-resolved neutron scattering으로 직접 규명하여, 이론적 모델 수립에 중요한 실험적 증거를 제공했습니다.", "unresolved": "이 자기 정렬 상태가 어떻게 실제 초전도 페어링으로 이어지는지에 대한 미시적 메커니즘은 여전히 논쟁 중입니다.", "future_work": "고압 조건 하에서의 중성자 산란 연구를 통해 초전도 상과 자기적 정렬 사이의 위상 다이어그램을 더 정밀하게 조사할 것입니다.", "concepts": [{"term": "Single-stripe magnetic order", "why_emerged": "강상관 전자계에서 전하 밀도파나 스핀 밀도파와 결합된 자성 구조를 설명하기 위해 필요했습니다.", "origin": "구리 산화물 연구에서 처음 도입됨, 초록 정보만으로는 상세 기원 확인 어려움.", "connections": "스트라이프 위상, 전하 밀도파(CDW), 고온 초전도."}, {"term": "Bilayer spin dynamics", "why_emerged": "La3Ni2O7의 독특한 Ni-O 이중층 구조가 스핀 상호작용에 미치는 비등방성을 이해하기 위해 필요했습니다.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "La3Ni2O7 초전도성, 자기적 비등방성."}], "english_summary": ["Momentum-resolved neutron scattering reveals single-stripe magnetic order in La3Ni2O7.", "The bilayer spin dynamics differ significantly from traditional cuprate behavior.", "These findings provide critical constraints for theoretical models of nickelate-based high-temperature superconductivity."]}}, {"title": "Discriminating superconducting fluctuations from the pseudogap in Bi2Sr2Can−1CunO2n+4+δ (n = 2, 3): A magnetotransport study", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/d532-8q2d", "authors": "Shunpei Yamaguchi, Nae Sasaki, Shintaro Adachi, et al.", "last_authors": "Koichi Kindo, Takao Watanabe", "summary": "Elucidating the origin of the pseudogap remains a central challenge in copper oxide high‑ T c superconductors. By investigating the magnetotransport properties of Bi‑2212 and Bi‑2223 single crystals, the authors demonstrate here that the pseudogap and superconducting fluctuations are distinct phenomena. Their results strongly suggest that the pseudogap arises from preformed Cooper pairing in the BCS–BEC crossover regime, imposing stringent constraints on theoretical descriptions of high‑ T c cuprates beyond the conventional BCS paradigm.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Magnetotransport on cuprates is highly relevant to understanding unconventional superconductivity and pseudogaps.", "tags": ["superconductivity", "cuprate", "transport"], "image": "", "briefing": {"background": "구리 산화물 초전도체에서 초전도 상태가 나타나기 전 온도인 의사갭(pseudogap) 영역에서 전하 및 스핀 상태가 무엇인지 밝히는 것은 수십 년 된 난제입니다.", "motivation": "의사갭이 단순한 초전도 요동(fluctuation)인지, 아니면 초전도와는 독립적인 다른 상인지를 구분하기 위해 자기수송 특성을 조사했습니다.", "result": "Bi-2212 및 Bi-2223 결정의 자기수송 실험 결과, 의사갭과 초전도 요동이 서로 다른 물리적 기원을 갖는 별개의 현상임을 입증했습니다.", "implication": "의사갭이 BCS-BEC 교차 영역에서 나타나는 선행된 쿠퍼 쌍(preformed Cooper pairing) 형성에 의한 것이라는 가설에 강력한 힘을 실어줍니다.", "novelty": "기존의 논란이 많던 의사갭의 기원을 수송 현상 분석을 통해 구분해냈으며, 이는 고온 초전도 이론이 단순 BCS 모델을 넘어서야 함을 보여줍니다.", "unresolved": "선행된 쿠퍼 쌍이 왜 거시적인 상간 결합(phase coherence)을 형성하지 못하고 의사갭 영역에서 멈춰 있는지에 대한 정확한 이유는 미해결입니다.", "future_work": "다른 도핑 수준 및 더 높은 자기장 환경에서 유사한 전하 수송 실험을 통해 이 모델의 보편성을 검증할 것으로 보입니다.", "concepts": [{"term": "Pseudogap", "why_emerged": "초전도 전이 온도 이상에서 상태 밀도가 낮아지는 현상을 설명하기 위해 필요했습니다.", "origin": "핵자기공명(NMR) 실험에서 처음 관찰 (1989년).", "connections": "고온 초전도, 페르미 면 재구성, 전자 상관관계."}, {"term": "BCS-BEC crossover", "why_emerged": "BCS 이론(약한 결합)과 BEC 이론(강한 결합) 사이의 전이 영역을 이해하기 위해 필요했습니다.", "origin": "A. J. Leggett (1980년).", "connections": "초유체 헬륨, 냉각 원자 가스, 고온 초전도."}, {"term": "Magnetotransport", "why_emerged": "자기장 하에서의 전기 저항 및 홀 효과 변화를 통해 전하 운반체의 성질을 파악하기 위해 필요했습니다.", "origin": "고전적인 금속 물리학에서 정립됨.", "connections": "페르미 면 측정, 위상학적 반금속, 수송 계수."}], "english_summary": ["Magnetotransport study on Bi-2212 and Bi-2223 distinguishes pseudogap from superconducting fluctuations.", "Results suggest the pseudogap arises from preformed Cooper pairs in the BCS-BEC crossover regime.", "The study imposes new constraints on theories describing high-Tc cuprate superconductivity."]}}, {"title": "Gyrotropy from extrinsic geometry in twisted materials", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/xkv5-svyj", "authors": "Spenser Talkington, Eugene J. Mele", "last_authors": "Spenser Talkington, Eugene J. Mele", "summary": "Two-dimensional moiré materials feature widely tunable electronic structures. When these materials are illuminated by light, they exhibit optical gyrotropy in the form of circular dichroism and birefringence. Here, the authors show that this gyrotropy naturally decomposes into an intrinsic contribution due to interlayer electronic coupling and an extrinsic contribution due to the twisted embedding of the material in physical space. The authors conduct a general symmetry analysis applicable to moiré materials and identify regimes in which the intrinsic, and in which the extrinsic contributions dominate the gyrotropy. Finally, they apply the analysis to twisted bilayer graphene and twisted MoTe 2 .", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Excellent analysis of moire materials with clear experimental optical relevance.", "tags": ["graphene", "moire", "twisted"], "image": "", "briefing": {"background": "모아레(moiré) 물질은 2차원 층상 구조를 비틀어 쌓음으로써 전자 구조를 자유롭게 제어할 수 있는 플랫폼을 제공하며, 최근 광학적 특성 조절 분야에서 큰 주목을 받고 있습니다.", "motivation": "비틀린 2차원 물질에서 관찰되는 원형 이색성(circular dichroism) 및 복굴절과 같은 광학적 자이로트로피(gyrotropy) 현상이 물질 내부의 전자적 상호작용인지, 아니면 기하학적 배열에서 비롯된 것인지 명확히 분리하여 이해할 필요가 있습니다.", "result": "연구진은 광학적 자이로트로피를 층간 전자 결합에서 오는 '내재적(intrinsic) 기여'와 비틀린 구조 자체가 공간상에 배치되면서 발생하는 '외재적(extrinsic) 기여'로 분해하는 일반적인 대칭성 분석을 제시했습니다.", "implication": "이 결과는 비틀린 이중층 그래핀이나 MoTe2와 같은 모아레 시스템에서 광학적 응답을 해석할 때, 단순히 전자 구조만이 아니라 기하학적 배치가 중요한 역할을 한다는 점을 시사합니다.", "novelty": "기존의 전자 상태 밀도 분석을 넘어, 물리적 공간에서의 '비틀린 임베딩(twisted embedding)'이라는 기하학적 관점을 도입하여 자이로트로피의 기원을 명확히 규명했습니다.", "unresolved": "실제 실험에서 이러한 내재적 및 외재적 기여를 정량적으로 완전히 분리하여 측정하기 위해서는 더욱 정밀한 편광 분해 분광법이 요구됩니다.", "future_work": "다른 비틀린 동종/이종 구조에 이 분석 프레임워크를 적용하여, 특정 모아레 각도에서 나타나는 광학적 비대칭성을 예측하고 실험적으로 검증할 예정입니다.", "concepts": [{"term": "광학적 자이로트로피", "why_emerged": "물질이 광학적 비등방성을 가질 때 빛의 편광 상태를 회전시키거나 변환하는 성질을 설명하기 위해 필요합니다.", "origin": "고전 전자기학에서 다루던 광학적 활성 개념에 기반하며, 응집물질물리학에서는 대칭성 파괴와 결합해 논의됩니다.", "connections": "원형 이색성, 복굴절, 파라데이 효과 등과 연결됩니다."}, {"term": "모아레 물질", "why_emerged": "2차원 물질을 겹쳐 쌓을 때 발생하는 주기적인 간섭 패턴이 전자 밴드 구조를 변형시키는 효과를 활용하기 위해 제안되었습니다.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "비틀린 이중층 그래핀, 초전도성, 상관계 전자계 연구와 밀접합니다."}], "english_summary": ["The study analyzes optical gyrotropy in twisted 2D materials.", "Authors decompose the effect into intrinsic electronic and extrinsic geometric contributions.", "A symmetry-based framework is applied to twisted bilayer graphene and MoTe2.", "The work clarifies the geometric origin of circular dichroism in moiré systems."]}}, {"title": "Magnetic order and excitations in the magnetically int agnets with topological relevance.", "tags": ["vanderWaals", "topological", "ferromagnet", "transport"], "image": "", "briefing": {"background": "반데르발스(vdW) 강자성체는 층상 구조의 특성상 자기적 특성을 전기적·광학적으로 제어하기 용이하여 차세대 스핀트로닉스 소자 후보로 주목받습니다. 특히 자기 이방성과 전자 구조의 결합은 위상적 수송 현상을 결정짓는 핵심 요소입니다.", "motivation": "Fe4GeTe2에서 나타나는 스핀 재배향 전이(SRT)가 어떻게 자기 이방성 변화를 유도하고, 이것이 위상적 전자 구조 및 수송 특성에 어떤 영향을 미치는지 규명하고자 합니다.", "result": "스핀 재배향 전이를 통해 물질의 자기 이방성을 조절함으로써 자기 저항(magnetoresistance) 및 비정상 홀 효과(anomalous Hall effect)와 같은 수송 특성을 효과적으로 튜닝할 수 있음을 확인했습니다.", "implication": "vdW 강자성체에서 자기 구조 변화를 이용한 전자 상태 및 수송 현상의 동적 제어 가능성을 입증하여, 스핀-궤도 결합 기반의 위상 소자 설계에 중요한 기초 자료를 제공합니다.", "novelty": "Fe4GeTe2라는 특정 물질 시스템에서 SRT가 위상적 수송 특성과 어떻게 결합하는지를 체계적으로 분석하여, 자기 상태 변화와 위상 상태 사이의 상관관계를 명확히 했습니다.", "unresolved": "SRT가 구체적으로 어떤 에너지 밴드 갭의 변화나 베리 곡률의 재분배를 유도하는지에 대한 미시적 분광학적 증거(예: ARPES 측정)는 아직 부족합니다.", "future_work": "저온 ARPES 또는 광학적 분광법을 통해 SRT 전후의 밴드 구조 변화를 직접 관측하고, 이방성 변화가 위상적 상태를 어떻게 변조하는지 확인하는 후속 연구가 필요합니다.", "concepts": [{"term": "스핀 재배향 전이 (SRT)", "why_emerged": "자기 결정 이방성이 온도나 외부 자기장에 따라 변화할 때 스핀의 정렬 방향이 불연속적으로 바뀌는 현상을 설명하기 위해 도입됨.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "자기 이방성 상수, 자기상전이, 도메인 월 제어."}, {"term": "비정상 홀 효과 (AHE)", "why_emerged": "강자성체에서 자기 모멘트가 전자의 운동에 영향을 주어 외부 자기장이 없어도 홀 전압이 발생하는 현상을 이해하기 위해 필요.", "origin": "Karplus와 Luttinger에 의해 1954년 제안됨.", "connections": "베리 곡률, 스핀-궤도 결합, 위상적 반금속."}], "english_summary": ["Investigated spin reorientation transitions (SRT) in the vdW ferromagnet Fe4GeTe2.", "Showed that SRT significantly alters magnetotransport properties.", "Demonstrated potential for tuning topological transport via magnetic anisotropy control.", "Highlights the coupling between spin configuration and topological electronic structures."]}}, {"title": "Upward deviation from the Wiedemann-Franz law and phonon-dominated thermal transport in the topological semimetal NbP2", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/c1h3-z72r", "authors": " ical semimetal-based devices."]}}, {"title": "Demonstration of Robust Chiral Edge Transport in Field-Induced Chern Insulator MnBi2Te4 Devices with Engineered Geometric Defects", "journal": "PRL_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/tv3l-85d1", "authors": "Pinyuan Wang, Jun Ge, Jiawei Luo, et al.", "last_authors": "Fengqi Song, Jian Wang", "summary": "Chiral edge states in Chern insulators are theoretically predicted to propagate unidirectionally along the sample boundary with inherent robustness against local perturbations, which manifests as the immunity to impurity-induced backscattering, a key factor for the development of robust, high-perfor…", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Experimental transport study on a key magnetic topological insulator material.", "tags": ["experiment", "material", "topological-insulator"], "image": "", "briefing": {"background": "MnBi2Te4는 자기적 위상 절연체로서 외부 자기장 하에서 체른 절연체(Chern insulator) 상태를 구현할 수 있는 가장 대표적인 후보 물질입니다.", "motivation": "체른 절연체에서 이론적으로 예측된 카이랄 에지 상태가 실제 소자에서 불순물이나 결함에 대해 얼마나 강건한지 실험적으로 증명하고자 합니다.", "result": "기하학적 결함이 포함된 MnBi2Te4 소자에서 카이랄 에지 상태에 의한 수송이 결함에도 불구하고 강건하게 유지됨을 실험적으로 확인했습니다.", "implication": "위상적으로 보호된 수송 현상이 실제 제작된 결함 소자에서도 작동함을 증명함으로써, 저전력 위상 소자의 실용화 가능성을 높였습니다.", "novelty": "이론적 예측에 머물던 카이랄 에지 상태의 강건성을 물리적 결함이 존재하는 소자에서 직접 측정하여 증명한 것은 고무적인 결과입니다.", "unresolved": "소자의 크기가 커질 때 발생하는 국소적 불균일성이나 벌크 채널 전도 기여를 완전히 배제하는 데는 여전히 한계가 있을 수 있습니다.", "future_work": "더 넓은 면적의 소자 제작 및 나노 스케일에서의 위상 수송 측정을 통해 소자 효율을 높이는 공정 최적화 연구가 이어져야 합니다.", "concepts": [{"term": "체른 절연체 (Chern Insulator)", "why_emerged": "외부 자기장 없이도 양자 홀 효과와 유사한 위상적 상태를 구현하기 위해 고안된 절연체 상태.", "origin": "Haldane (1988)의 모델이 시초.", "connections": "양자 변칙 홀 효과(QAHE), 카이랄 에지 모드, MnBi2Te4."}, {"term": "카이랄 에지 상태", "why_emerged": "위상 절연체나 체른 절연체의 경계면에서 한 방향으로만 흐르는 전도성 모드를 설명하기 위해 필요.", "origin": "Halperin (1982)의 양자 홀 에지 상태 연구에서 유래.", "connections": "후방 산란 금지, 위상적 강건성, 란다우 준위."}], "english_summary": ["Demonstrat ty": "전형적인 위상 초전도 후보 물질인 Fe(Te,Se)에서 결함(킹크)이 기능성 수송 현상을 유발한다는 점을 규명하여, 귀하의 관심사인 철 기반 초전도체와 위상 물질의 교집합을 다룹니다.", "unresolved": "킹크 경계의 정확한 원자 구조와 그것이 전자 구조에 미치는 국소적 영향력은 추가적 STS 연구가 필요해 보입니다.", "future_work": "다양한 결함 구조 엔지니어링을 통한 비상반성 수송의 인위적 제어 연구.", "concepts": [{"term": "Nonreciprocal Transport", "why_emerged": "물질 내부의 공간 반전 대칭성 깨짐을 전도성 측정을 통해 민감하게 확인하기 위해 필요.", "origin": "초록 정보만으로는 특정하기 어려움 (최근 Rashba 효과 등과 결합하여 급부상).", "connections": "정류 효과(Rectification), Rashba 스핀-궤도 결합."}, {"term": "FeTe0.7Se0.3", "why_emerged": "철 기반 초전도체 중 위상 절연체 상태를 가질 가능성이 있어 토폴로지컬 초전도 연구의 핵심 물질.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "마요라나 페르미온, 초전도-위상 절연체 접합."}], "english_summary": ["Investigation of nonreciprocal charge transport in the FeTe0.7Se0.3 superconductor.", "Reveals that kink-boundary-induced polarity is the origin of the direction-dependent electrical response.", "Provides a mechanism to control electronic transport by engineering defect structures in topological superconductors."]}}, {"title": "Microscopic Signatures of Chern Number Sign Reversal in Twisted Bilayer WSe2", "journal": "PRL_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/1jks-ld4b", "authors": "Ke Lv, Ya-Ning Ren, Lin He", "last_authors": "Ya-Ning Ren, Lin He", "summary": "The observation of quantized Chern numbers in twisted transition metal dichalcogenide homobilayers, including 3.7° twisted ${\\mathrm{MoTe}}_{2}$ and 1.23° twisted ${\\mathrm{WSe}}_{2}$, represents a landmark breakthrough in moiré physics. A striking and unresolved paradox to emerge from these studies…", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Moir physics and Chern numbers in twisted TMDs; direct match for user's secondary interests.", "tags": ["material", "twisted-bilayer", "topological"], "image": "", "briefing": {"background": "트위스트 된 전이금속 디칼코게나이드(TMD) 이중층 구조는 모아레 격자 내 강한 상관관계 효과를 제어할 수 있어 양자 이상 홀 효과와 위상학적 상태를 구현하는 핵심 플랫폼으로 자리 잡았습니다.", "motivation": "최근 꼬인 MoTe2나 WSe2에서 양자화된 Chern 수(Chern number)가 관측되었으나, 이들의 부호 변화와 관련된 미세한 물리적 기작에 대한 이해가 부족하여 이를 해결하고자 함.", "result": "트위스트 된 WSe2 이중층에서 나타나는 Chern 수의 부호 역전 현상을 미시적 관점에서 분석하여 구조적 매개변수와 위상학적 불변량 간의 관계를 명확히 함.", "implication": "모아레 격자에서의 위상학적 상태가 격자 변형이나 쌓임 방식(stacking)에 따라 어떻게 조절될 수 있는지 보여주며, 향후 위상 소자 설계의 가이드라인을 제시함.", "novelty": "기존 연구들에서 관측되었던 '부호 역전 패러독스'에 대해 미시적 모델을 제시했다는 점에서 중요하며, 위상학적 상전이를 이해하려는 연구자들에게 유의미한 분석을 제공함.", "unresolved": "실제 샘플에서의 국소적인 구조 결함이나 불균일성이 Chern 수의 부호 역전에 미치는 영향에 대해서는 추가적인 검증이 필요함.", "future_work": "다른 비틀림 각도에서의 위상학적 상태 변화를 예측하고, STM을 이용한 국소 상태 밀도(LDOS) 측정을 통해 이론을 검증할 예정.", "concepts": [{"term": "Moiré Physics", "why_emerged": "서로 다른 층의 원자 격자가 겹칠 때 생기는 거대 주기성을 활용해 전자의 운동 에너지를 제어하기 위해 등장함.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "2D van der Waals 이중층, Twisted bilayer graphene, Correlated insulators."}, {"term": "Chern Number", "why_emerged": "에너지 밴드의 위상학적 특성을 정량화하여 양자 홀 효과와 같은 물리 현상을 설명하기 위해 필요함.", "origin": "Thouless, Kohmoto, Nightingale, den Nijs (TKNN) 등에 의해 확립됨.", "connections": "Berry curvature, Quantum Anomalous Hall Effect, Topological band theory."}], "english_summary": ["Investigates the sign reversal of Chern numbers in twisted bilayer WSe2.", "Addresses the unresolved paradox in moiré-induced topological states.", "Provides a microscopic framework for understanding topological phase transitions.", "Offers insights into tunable topological band structures in TMD systems."]}}, {"title": "Non-Ohmic to Ohmic Crossover in the Breakdown of the Quantum Hall States in Graphene under Broadband Excitations", "journal": "PRL_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/5kkx-rcdh", "authors": "Torsten Röper, Aifei Zhang, Kenji Watanabe, et al.", "last_authors": "François D. Parmentier, Erwann Bocquillon", "summary": "Graphene, through the coexistence of large cyclotron gaps and small spin and valley gaps, offers the possibility to study the breakdown of the quantum Hall effect (QHE) across a wide range of energy scales. In this Letter, we investigate the breakdown of the QHE in high-mobility graphene Corbino dev…", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Study of quantum Hall effect breakdown in graphene, a core interest topic.", "tags": ["experiment", "material", "graphene", "quantumHall"], "image": "", "briefing": {"background": "그래핀은 높은 이동도와 독특한 밴드 구조 덕분에 양자 홀 효과(QHE) 연구의 표준 물질로 사용되며, QHE의 붕괴 과정은 강한 전기장 하에서의 비평형 상태를 이해하는 데 필수적입니다.", "motivation": "일반적으로 저항이 0에 수렴하는 QHE 상태가 특정 에너지 스케일(넓은 대역 여기)에서 어떻게 Ohmic 저항 상태로 전이되는지 그 전이 과정을 상세히 규명하고자 함.", "result": "Corbino 디바이스 구조를 활용하여 그래핀에서 QHE가 파괴되는 과정을 정밀하게 측정하고, 비-옴(Non-Ohmic) 영역에서 옴(Ohmic) 영역으로 넘어가는 크로스오버 현상을 발견함.", "implication": "강한 자기장과 강한 전기장 하에서의 전자 산란 기작 및 에너지 완화 메커니즘을 밝혀냄으로써 그래핀 기반 고속 전자 소자 설계의 한계점을 제시함.", "novelty": "에너지 스케일에 따른 QHE 붕괴 양상을 체계적으로 분류하였으며, 고이동도 그래핀 소자에서 전자의 비평형 동역학을 직접적으로 관찰함.", "unresolved": "매우 짧은 시간 척도에서의 여기 에너지 분포와 격자 온도 사이의 불일치가 여전히 존재함.", "future_work": "극저온에서의 전-전 산란 과정과 광학적 여기를 병합한 시간 분해 측정법을 통해 에너지 이완 경로를 탐색할 계획.", "concepts": [{"term": "Quantum Hall Effect (QHE) Breakdown", "why_emerged": "홀 저항이 양자화되는 임계 전류 이상에서 상태가 붕괴되는 현상을 관찰하여 소자의 한계를 이해하기 위해 필요함.", "origin": "K. von Klitzing(1980) 이후 고전류 밀도 실험을 통해 연구됨.", "connections": "Landau levels, dissipative transport, electron-phonon scattering."}, {"term": "Corbino geometry", "why_emerged": "에지 상태의 기여를 배제하고 벌크 전자 수송 현상만을 측정하기 위해 고안된 고리 모양의 전극 구조.", "origin": "O. Corbino가 제안함.", "connections": "Magnetoresistance measurements, Bulk transport properties."}], "english_summary": ["Studies the breakdown mechanism of Quantum Hall states in high-mobility graphene.", "Observes the crossover from non-Ohmic to Ohmic regimes under broadband excitation.", "Utilizes Corbino geometry to isolate bulk transport properties.", "Analyzes energy relaxation dynamics in graphene's cyclotron and valley gaps."]}}, {"title": "Néel-Antiferromagnet-Proximitized Superconductivity in the NbSe2/MnPS3 Heterostructures", "journal": "PRL_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/xfg2-227f", "authors": "Xinyi Zheng, Ruihuan Duan, Xilin Feng, et al.", "last_authors": "Guangtong Liu, Li Lu", "summary": "Antiferromagnet-superconductor (AFM-SC) hybrids offer a rich but largely unexplored platform for realizing spin-triplet Cooper pairing and chiral topological superconductivity, yet experimental demonstrations remain scarce. Here, we report the modification of superconductivity in ${\\mathrm{NbSe}}_{2…", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Experimental investigation of proximity effects in vdW heterostructures involving NbSe2.", "tags": ["experiment", "material", "heterostructure", "superconductivity"], "image": "", "briefing": {"background": "상관관계 전자계 연구에서 초전도체와 반강자성체를 결합하는 근접 효과(proximity effect)는 새로운 형태의 스핀-삼중항(spin-triplet) 초전도 상태를 구현할 수 있는 후보로 주목받고 있습니다.", "motivation": "층상 구조물인 NbSe2(초전도체)와 MnPS3(반강자성체) 이종 구조를 통해 자성 근접 효과가 초전도 특성에 어떤 영향을 미치는지 실험적으로 확인하고자 함.", "result": "반강자성체로부터의 스핀 바이어스 및 자성 근접 효과가 NbSe2의 초전도 기저 상태를 변화시키며, 비정형적인 초전도 전이 특성을 유도함을 확인함.", "implication": "반강자성체 기반의 스핀-전자 소자 및 위상 초전도체 탐색을 위한 이종 구조 설계의 가능성을 보여줌.", "novelty": "전통적인 강자성체-초전도체 이종 구조를 넘어 반강자성체를 이용한 초전도성 조절을 실험적으로 입증한 사례로, 2D van der Waals 이종 구조의 확장성을 보여줌.", "unresolved": "관찰된 초전도 특성 변화가 정확히 어떤 위상학적 위상이나 스핀 쌍 형성 방식을 유도하는지는 명확하지 않음.", "future_work": "강자기장 하에서의 magneto-transport 측정 및 가능성 있는 위상학적 상태를 확인하기 위한 저온 STM 측정이 요구됨.", "concepts": [{"term": "Proximity Effect", "why_emerged": "서로 다른 물질을 접합했을 때 계면을 통해 초전도성이나 자성 특성이 전달되는 현상을 제어하기 위해 필요함.", "origin": "Meissner 등에 의해 이론화됨.", "connections": "Cooper pair tunneling, Josephson junction, Topological superconductivity."}, {"term": "Van der Waals Heterostructure", "why_emerged": "격자 불일치에 대한 제약 없이 서로 다른 2D 물질을 적층하여 신물성을 창출하기 위해 등장함.", "origin": "Geim, Novoselov 등에 의해 개척됨.", "connections": "Twisted bilayers, Interface engineering, Moiré superlattices."}], "english_summary": ["Investigates the proximity effect in NbSe2/MnPS3 heterostructures.", "Reports the modulation of superconductivity by a Néel-antiferromagnet.", "Provides an experimental platform for studying AFM-SC interactions.", "Suggests potential for realizing exotic spin-triplet pairing."]}}, {"title": "Revealing the Nature of the Charge Density Wave Order of ErTe3 via Raman Scattering under Anisotropic Strain", "journal": "PRL_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/2ypb-byqq", "authors": "Théotime Freitas, Mattia Udina, Alexandr Alekhin, et al.", "last_authors": "Indranil Paul, Yann Gallais", "summary": "The nature of the charge density wave (CDW) order of the rare-earth tritelluride ${\\mathrm{ErTe}}_{3}$ is investigated by Raman scattering under anisotropic strain. The CDW state of ${\\mathrm{ErTe}}_{3}$ is unconventional since it is accompanied by an unusual mirror symmetry breaking, whose origin r…", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Important experimental study on CDW symmetry breaking in a rare-earth tritelluride, closely related to project materials.", "tags": ["material", "CDW", "ErTe3"], "image": "", "briefing": {"background": "Rare-earth tritellurides (RTe3)은 전형적인 2차원 전하밀도파(CDW) 물질로, CDW 질서와 구조적 변형 사이의 관계를 연구하는 데 핵심적인 플랫폼입니다.", "motivation": "ErTe3의 CDW 상태에서 관찰된 특이한 거울 대칭성 깨짐(mirror symmetry breaking)의 근원을 규명하고, 변형률(strain)에 따른 응답을 통해 CDW 질서의 본질을 이해하고자 합니다.", "result": "이방성 변형(anisotropic strain)을 가한 라만 산란 실험을 통해 ErTe3의 CDW가 단순한 격자 왜곡을 넘어 대칭성 깨짐을 동반하는 비전통적 상태임을 확인했습니다.", "implication": "CDW 형성 메커니즘에서 위상적 혹은 전자적 상관관계가 기존의 포논 유도 모델보다 훨씬 복잡하게 얽혀 있음을 시사합니다.", "novelty": "변형률 제어를 통해 평소 확인하기 어려운 CDW 질서의 대칭성을 성공적으로 분리해냈으며, AV3Sb5 등 kagome 금속에서 관찰되는 비전통적 CDW 연구와 비교 분석 가능성을 제공합니다.", "unresolved": "거울 대칭성 깨짐의 미시적인 원인이 전자적 질서인지, 혹은 격자 자유도와의 강한 결합에 의한 것인지에 대한 명확한 분리는 여전히 과제로 남아 있습니다.", "future_work": "다른 희토류 원소를 사용한 RTe3 시리즈와의 체계적인 비교 연구와 저온 라만 분광법을 통한 질서 파라미터의 온도 의존성 정밀 측정이 필요합니다.", "concepts": [{"term": "Charge Density Wave (CDW)", "why_emerged": "금속 내 전자들이 에너지 효율을 위해 주기적인 밀도 변조를 일으키는 현상을 설명하기 위해 등장했습니다.", "origin": "Peierls(1955)에 의해 이론적으로 예견되었습니다.", "connections": "Kagome 금속(AV3Sb5), cuprates의 유사 갭 상태, 전자-포논 결합."}, {"term": "Raman Scattering", "why_emerged": "물질 내의 준입자 여기(quasi-particle excitation)의 에너지와 대칭성 정보를 비파괴적으로 분석하기 위해 사용됩니다.", "origin": "C.V. Raman(1928)에 의해 발견되었습니다.", "connections": "IR 분광법, ARPES를 통한 전자 구조 직접 측정과 보완적 관계."}], "english_summary": ["Investigated the CDW nature in ErTe3 using Raman scattering under anisotropic strain.", "Identified unconventional mirror symmetry breaking associated with the CDW order.", "Demonstrated that external strain acts as a sensitive probe for the underlying symmetry of the electronic ground state.", "Provides insights into non-trivial CDW orders in layered rare-earth tritellurides."]}}, {"title": "Spin-Axis Dynamic Locking", "journal": "PRL_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/6ypc-bbs7", "authors": "Zhiheng Lv, Jiangtao Cai, Dengpan Ma, Yan Xing, Zhifeng Liu", "last_authors": "Yan Xing, Zhifeng Liu", "summary": "The all-electrical realization of highly spin-polarized currents and their efficient conversion into pure spin currents remains a fundamental challenge in spintronics. Here, we report a spin-axis dynamic locking (SADL) effect in altermagnets that pins the high and dynamically robust spin polarizatio…", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Theoretical study of altermagnets, a material class specifically identified in the user profile.", "tags": ["topic", "altermagnetism", "spintronics"], "image": "", "briefing": {"background": "Altermagnetism은 강자성과 반강자성의 장점을 모두 갖춘 새로운 자성 위상으로, 스핀 분극이 운동량 공간에서 대칭적으로 분포하여 스핀트로닉스 응용 가능성이 매우 높습니다.", "motivation": "Altermagnet 내부의 스핀 전류 생성 효율을 극대화하고, 스핀 축을 역동적으로 제어할 수 있는 메커니즘을 이론적으로 정립하고자 합니다.", "result": "Altermagnet에서 '스핀 축 동적 고정(SADL)' 효과를 발견하였으며, 이를 통해 외부 전기장으로 스핀 분극 상태를 고정하거나 조절할 수 있음을 보였습니다.", "implication": "전기적 방식만으로도 고도로 정렬된 스핀 전류를 제어할 수 있어, 차세대 저전력 스핀트로닉스 소자 구현에 이론적 토대를 제공합니다.", "novelty": "Altermagnetism이라는 최신 연구 분야에서 실질적인 스핀 제어 기법을 제시했다는 점이 독자에게 매우 유의미합니다.", "unresolved": "이론적인 효과를 실제 물질 환경(결함, 표면 효과 등)에서 구현했을 때의 견고함(robustness)은 실험적 검증이 필요합니다.", "future_work": "SADL 효과를 보일 수 있는 구체적인 altermagnetic 후보 물질들에 대한 수송 특성 계산 및 소자 제작 시뮬레이션이 뒤따라야 합니다.", "concepts": [{"term": "Altermagnetism", "why_emerged": "기존 강자성체와 반강자성체 분류를 넘어서는 대칭성을 가진 자기 질서를 기술하기 위해 필요했습니다.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "Spin-orbit coupling, Berry curvature, anomalous Hall effect."}, {"term": "Spin-axis dynamic locking", "why_emerged": "Altermagnet에서의 스핀 분극이 외부 환경에 따라 흔들리지 않고 특정 방향으로 유지되도록 강제하기 위해 고안되었습니다.", "origin": "본 연구에서 제안됨.", "connections": "Spin-transfer torque, spin-orbit torque, magnetic anisotropy."}], "english_summary": ["Reported the Spin-Axis Dynamic Locking (SADL) effect in altermagnets.", "Provides a mechanism for purely electrical control of highly spin-polarized currents.", "Addresses fundamental challenges in efficient spin current generation for spintronics.", "Exploits the unique symmetry properties of altermagnetic materials for potential device applications."]}}, {"title": "Step-Edge Anomaly in Topological Metals", "journal": "PRL_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/3p2x-yjyd", "authors": "O. Schweizer, V. Gali, A. Y. Chaou, G. Lemut, P. W. Brouwer, and M. Breitkreiz", "last_authors": "A. Y. Chaou, G. Lemut, P. W. Brouwer, and M. Breitkreiz", "summary": "Bulk–boundary correspondence guarantees the presence of robust, anomalous states on the boundary of topological matter. The edges of a two-dimensional Chern insulator harbor one-dimensional chiral states, which have a conductance n e 2 / h , where n is an integer that is solely determined by the bulk. In this Letter we show that step edges on the surface of three-dimensional topological metals have a robust conductance K e 2 / h , where K is also fixed by the bulk and assumes noninteger values. We explain this prediction on the basis of the topology of gapless systems, exemplify it on a lattice model, and connect to recent experimental observations of enhanced density of states at step edges in topological metals.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Discusses bulk-boundary correspondence in topological metals, highly relevant to STS and ARPES.", "tags": ["topic", "topologicalmetals", "edgestates"], "image": "", "briefing": {"background": "위상적 물질은 벌크-경계 대응 원리(bulk-boundary correspondence)에 의해 경계 상태에서 흥미로운 물리 현상이 나타나며, 이를 STM 등으로 관찰하는 것이 중요합니다.", "motivation": "3차원 위상 금속의 '단계 가장자리(step edge)'에서 나타나는 비정상적인 전도성과 상태 밀도 변화의 원인을 규명하고자 합니다.", "result": "단계 가장자리가 벌크 위상에 의해 결정된 정수/비정수 형태의 강건한 전도도 K(e^2/h)를 가질 수 있음을 이론적으로 증명했습니다.", "implication": "표면의 불완전성이나 단차(step)가 노이즈가 아닌 위상적인 정보를 포함하고 있음을 보여주며, STM 측정 시 이 효과를 고려해야 함을 시사합니다.", "novelty": "Topological metals의 표면 분석에서 중요하게 다뤄지는 단계 가장자리 현상을 위상적 기하학적 관점에서 체계화했습니다.", "unresolved": "실제 실험에서 단계 가장자리의 기하학적 형상(높이, 각도 등)이 결과에 미치는 미세한 차이에 대한 정량적 분석이 추가로 필요합니다.", "future_work": "다양한 위상 금속에서 단차 구조를 STM/STS로 정밀 분석하여 본 이론이 예측하는 컨덕턴스 값을 실험적으로 확증하는 연구가 예상됩니다.", "concepts": [{"term": "Bulk-boundary correspondence", "why_emerged": "물질 내부의 위상적 성질이 경계에서 나타나는 상태와 어떻게 수학적으로 연결되는지 설명하기 위해 필요합니다.", "origin": "Hatsugai(1993) 등 위상 절연체 이론의 확립과 함께 정립되었습니다.", "connections": "Chern insulator, edge states, topological invariants."}, {"term": "Topological metal", "why_emerged": "갭이 없는 상태에서도 위상적 보호를 받는 금속 상태가 존재함을 기술하기 위해 사용됩니다.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "Weyl semimetal, Dirac semimetal, Fermi arc."}], "english_summary": ["Analyzed the robust conductance at step edges in 3D topological metals.", "Established a bulk-boundary correspondence for gapless systems relating step-edge properties to bulk topology.", "Explained observed anomalous density of states at step edges in experimental studies.", "Provides a theoretical framework for interpreting STM/STS measurements on topological surfaces."]}}, {"title": "Gate-tunable chiral spin mode in WSe2/WS2 moiré superlattices", "journal": "Science", "source": "Gemini", "link": "https://www.science.org/doi/abs/10.1126/science.adq6530?af=R", "authors": "Zhexu Shan, Wenjian Su, Kenji Watanabe, et al.", "last_authors": "Yuanfeng Xu, Yanhao Tang", "summary": "The interplay between many-body and spin-orbit coupling (SOC) effects can lead to previously unobserved phenomena in solids. Chiral spin modes (CSMs) are collective spin excitations that arise from such interplay and connect states with opposite chirality. Here, we report a gate-tunable CSM that occurs between conduction SOC-split minibands in near-0°-twisted WSe 2 /WS 2 bilayers. This mode manifests as a sharp resonance with giant Raman efficiency in the pseudovector-symmetry channel of the Raman spectra. By varying the filling, the CSM transitions from a chiral spin exciton to an excitonic polaron. The spin-flip nature is directly confirmed by the Zeeman effect, and the filling dependence indicates a charge-transfer insulator at unity filling. Our results demonstrate that transition metal–dichalcogenide moiré superlattices are a fertile platform for exploring exotic low-lying collective excitations.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Directly involves moire superlattices and tunable electronic/spin degrees of freedom in 2D systems.", "tags": ["WSe2/WS2", "moiresuperlattices", "chiralspinmode"], "image": "", "briefing": {"background": "전이금속 디칼코게나이드(TMD) 헤테로구조의 모아레 초격자는 층간 비틀림 각도와 격자 불일치를 통해 강한 전자 상관관계와 스핀-궤도 결합(SOC)을 제어할 수 있는 독보적인 플랫폼을 제공합니다.", "motivation": "WSe2/WS2 이중층 모아레 시스템에서 SOC와 다체 효과가 결합할 때 발생하는 새로운 집단적 들뜸 현상인 '키랄 스핀 모드(CSM)'의 존재와 그 조절 가능성을 실험적으로 검증하고자 합니다.", "result": "near-0도 비틀림을 가진 WSe2/WS2에서 전도대 SOC 분리 미니밴드 사이의 CSM을 관측했습니다. 이 모드는 라만 분광법에서 강한 공명으로 나타나며, 전하 충전율 조절을 통해 키랄 스핀 엑시톤에서 엑시톤 폴라론으로 전이됨을 확인했습니다.", "implication": "모아레 초격자가 스핀 자유도를 능동적으로 제어할 수 있는 양자 소자 개발의 핵심 플랫폼임을 입증하며, 강상관 전자계의 집단 들뜸 연구에 새로운 경로를 제시합니다.", "novelty": "외부 전기장(게이트)을 통해 집단적 스핀 들뜸을 가역적으로 제어할 수 있음을 보였으며, 이는 기존의 정적인 물성 연구를 넘어 동적 스핀 응답을 제어하는 방향으로 나아감을 보여줍니다.", "unresolved": "CSM과 엑시톤 폴라론 사이의 구체적인 위상학적 결합 강도와 이 현상이
