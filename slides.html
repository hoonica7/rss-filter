<title>Daily Paper Slideshow</title>
<style>
  :root {
    color-scheme: light;
    --bg: #f6f7f4;
    --paper: #ffffff;
    --ink: #111827;
    --muted: #64748b;
    --line: #d8ddd2;
    --accent: #176b87;
    --accent-2: #9a3412;
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; overflow: auto; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: var(--bg); color: var(--ink); }
  .shell { max-width: 1500px; min-height: 100vh; margin: 0 auto; padding: 14px 18px; display: flex; flex-direction: column; }
  .topbar { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 16px; }
  .top-actions { display: flex; align-items: center; gap: 10px; }
  .topbar a, button { border: 1px solid var(--line); border-radius: 8px; background: var(--paper); color: var(--ink); padding: 10px 14px; font-weight: 700; text-decoration: none; cursor: pointer; }
  button.primary { background: var(--accent); border-color: var(--accent); color: white; }
  button:disabled { opacity: 0.45; cursor: not-allowed; }
  .counter { color: var(--muted); font-weight: 700; }
  .slide { min-height: calc(100vh - 82px); background: var(--paper); border: 1px solid var(--line); border-radius: 10px; padding: 18px; box-shadow: 0 18px 42px rgba(15, 23, 42, 0.10); display: grid; grid-template-columns: minmax(310px, 0.86fr) minmax(0, 1.55fr); gap: 18px; overflow: visible; }
  .paper-head { min-width: 0; min-height: 0; overflow: visible; display: flex; flex-direction: column; gap: 12px; }
  .figure { margin: 0; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: #f8fafc; }
  .figure img { display: block; width: 100%; max-height: 41vh; object-fit: contain; background: white; }
  .figure figcaption { padding: 7px 10px; color: var(--muted); font-size: 12px; line-height: 1.3; }
  .head-text { display: flex; flex-direction: column; gap: 9px; min-width: 0; }
  .badges { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .badge { border-radius: 999px; padding: 5px 9px; background: #eef2ff; color: #3730a3; font-size: 12px; font-weight: 800; }
  .score { background: #fee2e2; color: #991b1b; }
  h1 { margin: 0; font-size: 25px; line-height: 1.15; letter-spacing: 0; overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
  h1 a { color: inherit; text-decoration-color: rgba(23, 107, 135, 0.35); text-decoration-thickness: 2px; text-underline-offset: 4px; }
  h1 a:hover { color: var(--accent); text-decoration-color: var(--accent); }
  .meta, .authors, .why, .abstract { font-size: 13px; line-height: 1.45; }
  .meta, .authors { color: var(--muted); }
  .why strong, .abstract strong, .authors strong { color: var(--ink); }
  .authors { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .why { border-left: 4px solid var(--accent-2); padding-left: 10px; color: #374151; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .abstract { border-top: 1px solid var(--line); padding-top: 14px; color: #374151; }
  .original-abstract { border-top: 1px solid var(--line); padding-top: 10px; color: #374151; font-size: 11.5px; line-height: 1.35; overflow-wrap: anywhere; }
  .original-abstract strong { display: block; margin-bottom: 4px; color: var(--ink); }
  .tags { display: flex; flex-wrap: wrap; gap: 8px; }
  .tag { border-radius: 999px; padding: 4px 8px; background: #f1f5f9; color: #475569; font-size: 12px; font-weight: 700; }
  .head-text > .link { display: none; }
  .briefing { min-width: 0; min-height: 0; overflow: visible; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); grid-auto-rows: minmax(0, auto); align-content: start; gap: 11px 18px; border-top: 0; padding-top: 0; }
  .brief-section { min-width: 0; }
  .brief-section.wide { grid-column: 1 / -1; }
  .brief-section h2 { margin: 0 0 4px; font-size: 14px; line-height: 1.22; color: #0f766e; letter-spacing: 0; }
  .brief-section p, .brief-section li { margin: 0; font-size: 12.5px; line-height: 1.42; color: #1f2937; overflow-wrap: anywhere; }
  .brief-section ul { margin: 0; padding-left: 20px; }
  .concepts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 9px 14px; }
  .concept { border-top: 1px solid var(--line); padding-top: 7px; }
  .concept h3 { margin: 0 0 4px; font-size: 13px; color: #7c2d12; letter-spacing: 0; }
  .concept p { margin: 2px 0 0; font-size: 11.5px; line-height: 1.35; color: #374151; overflow-wrap: anywhere; }
  .concept b { color: #111827; }
  .link { color: var(--accent); font-weight: 800; text-decoration: none; }
  .empty { padding: 48px; background: var(--paper); border: 1px solid var(--line); border-radius: 12px; color: var(--muted); }
  @media (max-width: 860px) {
    .shell { padding: 14px; }
    .topbar, .top-actions { align-items: stretch; flex-direction: column; }
    .slide, .briefing, .concepts { grid-template-columns: 1fr; }
    .slide { min-height: auto; overflow: visible; display: grid; }
    h1 { font-size: 28px; }
  }
</style>

<script>
const slides = [{"title": "Equilibrium Stabilization of a Hidden Phase Like Metallic State in 1T-TaS2", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2605.22292", "authors": "Turgut Yilmaz, Anil Rajapitamahuni, Suji Park, Houk Jang, Asish K. Kundu, Elio Vescovo", "last_authors": "Asish K. Kundu, Elio Vescovo", "summary": "Electronic phases that lie outside the equilibrium ground state offer a route to explore competing configurations in correlated materials. In 1T-TaS2, ultrafast excitation accesses a metallic hidden phase that is distinct from the commensurate insulating ground state. Here we use angle-resolved photoemission spectroscopy to show that an equivalent electronic configuration is stabilized in exfoliated intermediate-thickness 1T-TaS2 flakes, where it persists up to room temperature before evolving through a different sequence of electronic transitions. This equilibrium hidden-phase-like state hosts a metallic band with finite Fermi-level spectral weight while retaining the characteristic hybridization gaps associated with the star-of-David band folding. These results establish a platform for controlling competing electronic states in layered materials, with implications for both quantum science and phase change technologies.", "tier": "A_MUST_READ", "score": "10", "reason": "Direct ARPES/electronic structure study of a relevant CDW/correlated material.", "tags": ["ARPES", "CDW", "correlated"], "image": "https://arxiv.org/html/2605.22292v2/x1.png", "briefing": {"background": "1T-TaS2는 전형적인 전이금속 다이칼코게나이드(TMD)로, 저온에서 전하밀도파(CDW)에 의한 절연체 상태를 보입니다. 기존 연구에서는 초고속 레이저 펄스를 이용한 비평형 상태(hidden phase)에서만 금속성을 관찰할 수 있었습니다.", "motivation": "비평형 상태에서만 나타나던 금속성을 평형 상태에서도 안정적으로 구현할 수 있는지, 그리고 그 전자 구조적 특징은 무엇인지 규명하고자 함.", "result": "박리(exfoliation)된 중간 두께의 1T-TaS2 박막에서 상온까지 지속되는 금속성 상태를 ARPES로 확인했습니다. 이 상태는 Star-of-David 클러스터에 의한 밴드 접힘(folding)은 유지하면서도 페르미 준위에서 금속적인 분광 가중치(spectral weight)를 보입니다.", "implication": "초고속 광학 제어 없이도 특정 두께 제어만으로 비평형 상태와 유사한 금속상을 일상적으로 제어할 수 있는 플랫폼을 제공합니다.", "novelty": "외부 자극 없이 층 두께(thickness) 조절만으로 위상 제어가 가능하다는 점이 흥미로우며, 이는 correlated material의 상전이 연구에 새로운 물리적 접근법을 제시합니다.", "unresolved": "이 '숨겨진 위상 유사 상태'가 결정학적으로 어떤 격자 구조적 특징을 가지는지, 정확히 어떤 두께 범위에서 최적화되는지에 대한 추가 분석이 필요합니다.", "future_work": "이 상태의 수송 특성(transport properties) 측정 및 소자 응용을 위한 후속 연구가 필요함.", "concepts": [{"term": "Star-of-David", "why_emerged": "1T-TaS2의 저온 CDW 상태에서 타탄탈 원자들이 13개씩 모여 별 모양 클러스터를 형성하며 국소화되는 현상을 설명하기 위해 등장.", "origin": "Wilson, Di Salvo, Mahajan (1975).", "connections": "Mott 절연체 물성, 전하 밀도 파(CDW), 금속-절연체 전이."}, {"term": "Hidden Phase", "why_emerged": "평형 상태의 지배적인 기저 상태를 넘어, 강한 레이저 펄스로 에너지를 가했을 때만 짧게 나타나는 독특한 전자 위상을 지칭.", "origin": "초고속 분광학의 발전과 함께 2010년대 이후 본격화.", "connections": "Floquet 공학, 비평형 통계역학, 상전이 제어."}], "english_summary": ["Stabilized a metallic hidden phase in 1T-TaS2 without ultrafast pulses.", "Used exfoliated thin flakes to maintain metallic Fermi surface at room temperature.", "Retains characteristic Star-of-David band folding while gaining finite Fermi-level spectral weight.", "Demonstrates thickness-dependent control of competing electronic phases."]}}, {"title": "Nematic and chiral superconductivity emerging within the loop-current phase in kagome metals (Nat. Commun.)", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2508.04433", "authors": "Rina Tazai, Youichi Yamakawa, Hiroshi Kontani", "last_authors": "Youichi Yamakawa, Hiroshi Kontani", "summary": "The kagome metals $A$V$_3$Sb$_5$ ($A =$ Cs, Rb, K) host multiple symmetry-breaking phases, including charge-density-wave and loop-current orders, and exhibit highly exotic superconductivity with pronounced nematicity and chirality. Remarkably, even dilute impurities transform this exotic superconducting state into an isotropic $s$-wave state. These observations pose a challenge to existing theoretical scenarios. We show that loop-current order induces nematic chiral $d$-wave superconductivity in kagome metals. The loop-current-induced orbital magnetization (OM) stabilizes one chiral superconducting channels. This OM-chirality coupling mechanism is generic and applies to pairing driven by either attractive or repulsive interactions. Furthermore, coexisting loop-current and bond orders give rise to pronounced nematic chiral superconductivity even for an almost $C_6$-symmetric Fermi surface. For attractive pairing, dilute impurities suppress the chiral state and restore a conventional $s$-wave phase, as observed experimentally. The theory further predicts a robust $2\\times2$ pair-density modulation. This study provides key insights into time-reversal-symmetry-breaking exotic superconductivity in kagome metals.", "tier": "A_MUST_READ", "score": "10", "reason": "Directly addresses loop-currents, nematicity, and superconductivity in AV3Sb5 kagome metals.", "tags": ["kagome", "AV3Sb5", "superconductivity", "loop-currents"], "image": "https://arxiv.org/html/2508.04433v2/x1.png", "briefing": {"background": "AV3Sb5(A=Cs, Rb, K) 카고메 금속은 CDW, 루프 전류, 그리고 이국적인 초전도성이 복합적으로 얽혀 있어 전 세계 응집물리 학계의 핵심 연구 대상입니다.", "motivation": "왜 카고메 금속에서 nematicity와 chirality를 동반한 초전도성이 나타나며, 불순물에 의해 왜 s-wave로 변하는지 이론적으로 설명하고자 함.", "result": "루프 전류 질서가 궤도 자기 모멘트(OM)를 유도하고, 이것이 chiral d-wave 초전도성을 안정화시킨다는 것을 보임. 또한, 불순물에 의한 s-wave로의 전이가 실험 결과와 일치함을 입증.", "implication": "카고메 금속의 복잡한 대칭성 깨짐 현상들이 루프 전류라는 하나의 공통 분모로 통합되어 이해될 수 있음을 시사함.", "novelty": "루프 전류와 초전도성 사이의 직접적인 연결 고리를 이론적으로 제시했으며, 특히 자기장 없이도 자발적으로 발생하는 궤도 자기 모멘트 기반의 메커니즘을 강조.", "unresolved": "실제 실험적으로 이 루프 전류의 존재를 직접적인 분광학적 방법(예: 특정 모드의 RIXS 또는 STM 매핑)으로 완벽하게 확증하는 것은 여전히 난제.", "future_work": "제시된 2x2 페어 밀도 변조(pair-density modulation)의 실험적 관측.", "concepts": [{"term": "Loop-current order", "why_emerged": "구리 산화물 등에서 시간 역전 대칭성 깨짐을 설명하기 위해 제안된 미세 자기 전류 상태.", "origin": "Varma (1997).", "connections": "시간 역전 대칭성 깨짐(TRSB), 의사갭(Pseudogap), 카고메 격자."}, {"term": "Chiral d-wave superconductivity", "why_emerged": "시스템의 궤도 각운동량이 0이 아닌 상태로, 복소수 오더 파라미터를 갖는 초전  materials with electromagnetic cavities offers a route to modify equilibrium properties through structured vacuum fluctuations. The coupling between light and correlated electrons lacks a characteristic energy scale, making vacuum induced ground state modifications of such systems inherently off-resonant and sensitive to the full photon mode structure. We develop a consistent cavity-QED formalism for dispersive electromagnetic environments in the Coulomb gauge, capturing both dynamical dressing via the vector potential and static screening by the dielectric. With this formalism, we perform a non-perturbative study of the cavity-induced modification of magnetism in the Hubbard model close to half-filling, including all cavity modes and with parameters determined from first principles. At half-filling, we show that the modification of the magnetic exchange interaction $J$ is controlled by a generalized Purcell factor, proportional to the frequency integrated photonic density of states relative to free space. This result identifies polaritonic surface cavities as promising platforms to modify correlated systems. For the surface cavity a competition between static screening and dynamical dressing via the vector potential leads to a net enhancement of $J$, directly observable in two-magnon Raman spectroscopy. The inclusion of screening is essential to obtain even qualitatively correct results. At weak doping, a variational exact diagonalization of the cavity-coupled $t$-$J$ polaron reveals that a low-frequency surface cavity can reverse the nodal-antinodal dichotomy of the bare polaron dispersion. This effect lies beyond mean field theory and is observable via ARPES measurements. Our framework establishes a concrete design principle linking cavity geometry to material response in the off-resonant regime, which will guide future experimental and theoretical explorations.", "tier": "B_IMPORTANT_CONDMAT", "score": "9", "reason": "Directly relevant to ARPES interpretation and cavity-coupled correlated electron systems.", "tags": ["ARPES", "correlatedelectrons", "cavity-QED"], "image": "https://arxiv.org/html/2603.18933v2/figures/graphical_abstract.png", "briefing": {"background": "물질을 광학 공동(cavity) 안에 가두어 빛과 강하게 상호작용하게 함으로써, 물질의 전자 구조나 자기적 성질을 변조하려는 연구가 활발합니다.", "motivation": "기존 연구들은 주로 공진(resonance)에 집중했으나, 강상관 전자계는 특정 에너지 척도가 명확하지 않아 비공진 영역에서의 공동-물질 결합 효과를 체계적으로 이해할 필요가 있습니다.", "result": "Coulomb 게이지 하에서 공동 모드와 전자 간의 상호작용을 비섭동적으로 계산할 수 있는 형식론을 개발했습니다. 자성(J) 강화 및 반강자성 상태의 변조 가능성을 확인했습니다.", "implication": "ARPES 측정 등으로 직접 관찰 가능한 '절점-반절점(nodal-antinodal) 이분법'의 제어 가능성을 시사하며, 공동 설계를 통한 물질 물성 튜닝의 이론적 틀을 제공합니다.", "novelty": "단순한 공진 결합을 넘어, 시스템 전체의 광자 모드 구조를 포함한 포괄적인 모델을 제시했다는 점이 이론적으로 매우 중요합니다.", "unresolved": "실제 실험적으로는 공동 내부의 복잡한 물리적 환경을 제어하기가 매우 까다롭다는 점이 난제로 남아있습니다.", "future_work": "제시된 이론을 바탕으로 실제 강상관 물질(쿠프레이트, 니켈레이트 등)에 공동을 적용한 실험적 ARPES 연구가 필요합니다.", "concepts": [{"term": "Cavity-QED", "why_emerged": "광학 공동 내의 빛과 물질의 상호작용을 양자역학적으로 기술하기 위해 발전했습니다.", "origin": "1940년대 Purcell 등이 공동 내 원자의 자연 방출 제어를 논하며 시작되었습니다.", "connections": "플라즈모닉스, 극성 폴라리톤, 강상관 전자계"}, {"term": "Nodal-antinodal dichotomy", "why_emerged": "쿠프레이트 등 강상관 초전도체에서 페르미 표면의 특정 방향에 따라 전자 상태가 다르게 나타나는 현상을 설명하기 위해 등장했습니다.", "origin": "초기 ARPES 실험들을 통해 1990년대부터 본격적으로 논의되었습니다.", "connections": "슈도갭, d-파동 초전도체, 페르미 아크"}], "english_summary": ["Consistent cavity-QED formalism developed for dispersive environments.", "Non-perturbative study of cavity-induced magnetism in the Hubbard model.", "Discovery of J-enhancement and reversal of nodal-antinodal dichotomy.", "Provides design principles for cavity-coupled correlated electron studies."]}}, {"title": "Interaction-driven electronic ferroelectricity in van der Waals heterostructures", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2607.24087", "authors": "Ziying Wang, Ana Vera Montoto, Mohammad Amini, et al.", "last_authors": "Adolfo O. Fumega, Peter Liljeroth", "summary": "Strong electronic correlations in narrow-band systems provide a promising route to realize emergent quantum phases. While ferroelectricity in van der Waals materials is typically associated with inversion symmetry breaking driven by lattice distortions, interlayer sliding, or moir\\'e reconstruction, the possibility of generating ferroelectricity directly from electronic interactions remains largely unexplored. Here, using molecular beam epitaxy, scanning tunneling microscopy, and ab initio calculations, we investigate two stacking geometries of bilayer 1T-TaSe$_2$, A-C and A-C$'$, formed by coupled Star-of-David charge density wave phases. We show that both stackings realize quasi-one-dimensional interacting chains, but are governed by distinct interaction mechanisms. In the A-C stacking, strong interlayer hybridization leads to dimerization and the formation of a band insulating state. In contrast, the A-C$'$ stacking is dominated by interlayer Coulomb interactions, producing a spontaneous charge imbalance between layers that gives rise to an out-of-plane ferroelectric polarization. Furthermore, we demonstrate that ferroelectric and antiferroelectric interchain configurations can be stabilized and electrically switched by an external field. Our results prove that bilayer 1T-TaSe$_2$ is a platform for interaction-driven electronic ferroelectricity, establishing an overlooked family of charge-ordered correlated states in 1T-TaSe$_2$ multilayers.", "tier": "B_IMPORTANT_CONDMAT", "score": "9", "reason": "Excellent electronic structure study on 1T-TaSe2 heterostructures using STM and MBE.", "tags": ["STM", "chargedensitywave", "vanderWaalsheterostructures"], "image": "https://arxiv.org/html/2607.24087v1/x1.png", "briefing": {"background": "반데르발스 이종접합 구조는 층간 적층 방식에 따라 창발적인 양자 상을 구현할 수 있는 플랫폼으로 각광받고 있습니다.", "motivation": "기존의 강유전성은 주로 격자 왜곡이나 이종접합의 적층 구조에서 발생하는 기하학적 요인에 의해 유도되었으나, 본 연구는 순수하게 전자적 상호작용만으로 유도되는 강유전성을 탐구하고자 합니다.", "result": "1T-TaSe2 이중층에서 적층 구조(A-C vs A-C')에 따라 다른 물성이 나타남을 발견했습니다. A-C' 적층에서는 층간 쿨롱 상호작용으로 인해 자발적인 전하 불균형이 발생하여 강유전성이 유도됨을 확인했습니다.", "implication": "격자 왜곡 없이도 전자 상관관계만으로 강유전성을 만들 수 있다는 새로운 물리적 메커니즘을 증명했습니다.", "novelty": "STM을 통한 실공간 관측과 ab initio 계산을 결합하여, 층간 적층 구조에 따라 나타나는 전하 정렬(charge order)과 강유전성을 명확히 분리하여 규명했다는 점이 독보적입니다.", "unresolved": "전기적 스위칭의 효율성이나 외부 환경에 대한 강유전성의 안정성이 추가적인 연구 대상입니다.", "future_work": "이러한 전자적 강유전성을 이용한 나노 전자 소자 개발 및 다른 1T-TMD 물질들로의 확장 연구가 예상됩니다.", "concepts": [{"term": "1T-TaSe2", "why_emerged": "강한 전자 상관관계와 전하 밀도 파동(CDW)을 보이는 대표적인 전이금속 디칼코게나이드(TMD) 물질입니다.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "모트 절연체, 스타 오브 다윗 구조, 전하 밀도 파동"}, {"term": "Electronic ferroelectricity", "why_emerged": "이온 변위가 아닌 전자 재분배를 통해 발생하는 강유전성을 이해하여, 더욱 빠르고 효율적인 소자 제어를 구현하기 위해 필요합니다.", "origin": "다양한 강상관 물질 연구 과정에서 이론적으로 제안되었으나 최근 실험적 증거가 축적되고 있습니다.", "connections": "전자 상관관계, 쿨롱 상호작용, 강유전체"}], "english_summary": ["Investigation of bilayer 1T-TaSe2 stacking geometries.", "Evidence of interaction-driven electronic ferroelectricity in A-C' stacking.", "STM and ab initio findings reveal spontaneous interlayer charge imbalance.", "Demonstration of electrically switchable ferro- and antiferroelectric states."]}}, {"title": "Observation of correlation-driven topological transport and robust ferromagnetism in 2D CrS2", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2607.23625", "authors": "Sk Md Obaidulla, M. Nur Hasan, Dayal Das, et al.", "last_authors": "Heike C. Herper, Marko Kralj", "summary": "The realization of correlated layered magnets hosting robust ferromagnetism with emergent topological transport remains a key challenge in quantum materials. Here we report the first catalyst-free chemical vapour deposition growth of layered 1T-CrS$_2$, establishing a highly stable vdWs ferromagnet with an out-of-plane easy-axis anisotropy and a Curie temperature above room temperature. Transport measurements reveal a semimetal--insulator crossover near 80 K and pronounced negative magnetoresistance up to 350 K y Hall 효과의 발현 가능성을 제시함.", "implication": "자성과 위상이 공존하는 새로운 플랫폼을 제시하며, 향후 2차원 자성 위상 소자 개발의 가능성을 시사함.", "novelty": "기존의 강자성 기반 Weyl semimetal과 달리, 순자성이 없는 altermagnet 환경에서도 위상적 성질(Weyl, Valley Hall)이 구현될 수 있음을 수학적으로 입증함.", "unresolved": "실제 해당 물리 현상을 나타내는 구체적인 2차원 후보 물질의 실험적 합성 및 위상 상태의 직접 관측.", "future_work": "본 이론을 구현할 수 있는 2차원 후보군 탐색 및 수송 현상 계산을 통한 Valley Hall 전류 검증.", "concepts": [{"term": "Weyl semimetal", "why_emerged": "에너지 밴드가 점 형태(Weyl point)로 교차하며 3차원에서 위상적으로 보호된 전도성을 가지는 물질군 연구가 필요해서.", "origin": "초록 정보만으로는 특정하기 어려움 (통상 2011년 Wan et al. 등으로 인용).", "connections": "Berry 곡률, 비정상 홀 효과, 위상 절연체와 연결됨."}, {"term": "Valley Hall effect", "why_emerged": "전자의 밸리 자유도를 이용하여 정보를 처리하는 밸리트로닉스 구현을 위해.", "origin": "그래핀 및 TMD 연구에서 처음 제안됨.", "connections": "Berry 위상, 위상 밴드 구조와 연결됨."}], "english_summary": ["Theoretical study proposes bipolarized Weyl semimetals in 2D altermagnetic materials.", "The system exhibits the quantum crystal valley Hall effect due to inherent magnetic symmetry.", "Provides a design principle for merging magnetism and topology in non-ferromagnetic settings.", "Suggests promising applications for valleytronics using altermagnets."]}}, {"title": "Coupled-cluster approach to vibronic effects in resonant inelastic x-ray scattering of quantum materials: Application to a 5d1 rhenium oxide", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/j2fd-szjx", "authors": "Teruki Matsuzaki, Liviu F. Chibotaru, Maristella Alessio, Naoya Iwahara", "last_authors": "Maristella Alessio, Naoya Iwahara", "summary": "First-principles analysis of the spectroscopic signatures of correlated quantum materials poses significant challenges due to the interplay between spin-orbit and vibronic couplings, as well as the need to describe both dynamic and static electron correlation to reach decent accuracy. In this work, …", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Spectroscopy methodology relevant to RIXS analysis of correlated quantum materials.", "tags": ["RIXS", "spectroscopy", "methodology"], "image": "", "briefing": {"background": "RIXS(공명 비탄성 X선 산란)는 전자 상관관계가 강한 물질의 전하, 스핀, 궤도 들뜸을 측정하는 강력한 도구이나, 이론적인 스펙트럼 해석에는 매우 복잡한 다체 계산이 요구됨.", "motivation": "5d 전이금속 산화물에서 스핀-궤도 결합과 진동(vibronic) 결합이 RIXS 스펙트럼에 미치는 영향을 정확히 모델링하기 위한 coupled-cluster 방법론 도입.", "result": "진동 결합 효과를 포함하여 RIXS 스펙트럼의 미세 구조를 계산할 수 있는 새로운 다체 계산 프레임워크를 수립함.", "implication": "강한 상관관계 물질의 스펙트럼 해석 정확도를 크게 향상시켜, 실험 데이터를 기반으로 물질의 물리적 기원을 더 깊이 이해할 수 있게 함.", "novelty": "전통적인 DFT 계산의 한계를 넘어 스핀-궤도 결합과 격자 진동의 상호작용을 통합적으로 고려하여 실험값과의 일치도를 높임.", "unresolved": "이 방법론이 5d 외의 3d, 4d 강상관계 물질로 확장될 때의 효율성 및 계산 비용 문제.", "future_work": "다른 5d 레늄 산화물 및 관련 강상관계 물질에 대한 적용을 통한 방법론 검증 및 RIXS 스펙트럼 데이터베이스 구축.", "concepts": [{"term": "RIXS", "why_emerged": "에너지, 운동량 분해능을 갖춘 상태로 물질 내 전하/스핀/궤도 들뜸을 동시에 탐색하기 위해 필요.", "origin": "초록 정보만으로는 특정하기 어려움 (1970년대 X선 산란 기술에서 발전).", "connections": "중성자 산란, ARPES, 라만 분광법과 연결됨."}, {"term": "Vibronic coupling", "why_emerged": "전자 상태와 격자 진동(포논) 간의 상호작용이 물질의 전자 구조 및 스펙트럼에 미치는 영향을 기술하기 위해.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "Jahn-Teller 효과, 폴라론, 분광학 해석과 연결됨."}], "english_summary": ["Introduces a coupled-cluster approach to model vibronic effects in RIXS spectra.", "Analyzes the complex interplay of spin-orbit and vibronic couplings in 5d1 Rhenium oxides.", "Significantly improves theoretical modeling accuracy for correlated quantum materials.", "Provides a powerful tool for interpreting spectroscopic signatures in strong electron-correlated systems."]}}, {"title": "Effect of modest hydrostatic pressure on low-temperature transport behavior in La3Ni2O7 thin films", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/zjnc-vv8p", "authors": "Deepak Kumar, Jared Z. Dans, Keenan E. Avers, Ryan Paxson, Ichiro Takeuchi, Johnpierre Paglione", "last_authors": "Ichiro Takeuchi, Johnpierre Paglione", "summary": "How do La 3 Ni 2 O 7 thin films behaves under modest hydrostatic pressure? The aut eterministically control interlayer slip, enabling the synthesis of pure-phase rhombohedral graphene. Using this approach, we obtained pure (phase purity > 99%) rhombohedral graphene with an area reaching 160 micrometers by 80 micrometers and thickness ranging from ~15 layers to ~120 nanometers. The resulting samples establish the first comprehensive reference dataset of Raman fingerprints and intrinsic band structures from few-layer films to ~200-layer bulk. Electronic transport measurements reveal a layer-antiferromagnetic state and the quantum anomalous Hall effect, enabling scalable exploration of next-generation quantum science and technology applications.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Graphene/2D material, quantum anomalous Hall effect, correlated and topological physics.", "tags": ["graphene", "2Dmaterials", "anomalousHall", "correlatedelectrons", "topologicalmaterials", "transport"], "image": "", "briefing": {"background": "그래핀은 적층 구조에 따라 전자 구조가 크게 변합니다. 특히 ABC 적층(Rhombohedral) 그래핀은 강한 상관관계 및 위상학적 특성을 보이지만, 기존의 무작위 성장 방식으로는 균일한 위상을 얻기 어려웠습니다.", "motivation": "ABC 적층 그래핀을 결정론적으로 합성하여 양자 변칙 홀 효과(QAHE) 및 상관 물성을 연구할 수 있는 대면적 시료를 확보하고자 했습니다.", "result": "기판의 단차(step geometry)를 이용한 에피택셜 성장법을 통해 99% 이상의 고순도 ABC 적층 그래핀을 대면적으로 합성하는 데 성공했습니다.", "implication": "고품질의 대면적 ABC 그래핀 시료를 통해 층간 반강자성 상태와 QAHE를 관측할 수 있게 되었으며, 차세대 양자 소자 개발의 토대가 마련되었습니다.", "novelty": "기존의 물리적 박리 방식이 아닌 제어 가능한 성장법을 정립하여, 층수에 따른 전자 구조 변화를 체계적으로 연구할 수 있는 플랫폼을 구축했습니다.", "unresolved": "대면적 합성은 달성했으나, 합성된 시료 내부의 미세한 결함이 위상학적 특성에 미치는 정량적인 영향은 추가 연구가 필요합니다.", "future_work": "도핑 제어를 통한 QAHE의 최적화 및 타 위상학적 소자와의 이종 접합 연구가 예상됩니다.", "concepts": [{"term": "ABC-stacking", "why_emerged": "그래핀 층들이 쌓이는 방식에 따라 에너지 밴드 구조가 바뀌기 때문입니다.", "origin": "그래핀 연구 초기부터 격자 대칭성 연구를 통해 알려짐.", "connections": "Bernal(AB) 적층 및 뒤틀린(twisted) 그래핀과 비교됩니다."}, {"term": "Quantum Anomalous Hall Effect", "why_emerged": "외부 자기장 없이도 자성 위상 물질에서 양자화된 홀 저항을 얻기 위함입니다.", "origin": "Haldane 모델(1988)에 의해 이론적으로 제안되었습니다.", "connections": "위상 절연체 및 자성 위상 물질 연구의 핵심 주제입니다."}], "english_summary": ["Successfully synthesized large-area high-purity rhombohedral (ABC) graphene using step-guided growth.", "Established a comprehensive database for Raman and electronic band structures of ABC graphene.", "Demonstrated layer-antiferromagnetism and quantum anomalous Hall effect in the synthesized samples.", "Provides a scalable platform for studying correlated and topological physics in graphene."]}}, {"title": "Photoinduced metastable cation disorder in metal halide double perovskites", "journal": "Science_Advances", "source": "Gemini", "link": "https://doi.org/10.1126/sciadv.adt5183", "authors": "Shunran Li, Burak Guzelturk, Conrad A. Kocoj, et al.", "last_authors": "Diana Y. Qiu, Peijun Guo", "summary": "Lead-free perovskites have emerged as environmentally benign alternatives to lead halide counterparts for photovoltaic and optoelectronic applications. Among them, the double perovskite Cs 2 AgInCl 6 family, with proper composition engineering, exhibits remarkable white-light emission characteristics enabled by strong electron-phonon coupling and the formation of self-trapped excitons (STEs). Despite these advantages, the fundamental photophysics and structural dynamics governing their excited-state behavior remain poorly understood. Here, we report a long-lived metastable phase in the Cs 2 AgInCl 6 double perovskite family and unravel this process and the concomitant electronic and structural evolution using a suite of tools including transient optical spectroscopy, time-resolved x-ray diffraction (TR-XRD), time-resolved x-ray absorption spectroscopy (TR-XAS), and inelastic x-ray scattering (IXS). We show that the photoinduced, transient metastable phase is associated with B-site [silver (Ag)–indium (In)] disorder, which induces a markedly reduced optical bandgap. Supported by TR-XRD and first-principles calculations, the Ag-In disorder drives the formation of Ag-rich and In-rich domains with millisecond lifetimes, with lifetimes increasing at lower temperatures. TR-XAS further reveals that the photogenerated STEs oxidize Ag + to Ag 2+ , which facilitates this highly temporally asymmetric order-disorder transition. Our findings demonstrate a previously unidentified mechanism, mediated by hole-localized STE formation, that enables prolongation of transient light-induced states to the multimillisecond regime in halide double perovskites, opening possibilities to harvesting the functional properties of metastable phases of these material systems.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Fundamental study of photoinduced structural/electronic dynamics in perovskites, with relevant experimental techniques.", "tags": ["perovskites", "electron-phononcoupling", "excitons", "time-resolvedXRD", "time-resolvedXAS", "IXS", "stronglycorrelated"], "image": "", "briefing": {"background": "납 기반 페로브스카이트의 환경 문제를 해결하기 위해 이중 페로브스카이트(Double Perovskites)가 대안으로 연구되고 있습니다. 특히 Cs2AgInCl6는 백색광 방출 특성으로 주목받고 있습니다.", "motivation": "이 물질의 광학적 특성을 결정짓는 여기 상태의 구조적, 전자적 동역학이 아직 명확히 규명되지 않았습니다.", "result": "광 여기(photoexcitation)에 의해 B-site(Ag-In)의 질서-무질서 전이가 발생하며, 이로 인해 수 밀리초 동안 지속되는 준안정 상태(metastable phase)가 형성됨을 밝혔습니다.", "implication": "빛에 의해 유도된 구조 변화가 물질의 밴드갭을 조절할 수 있음을 입증하여, 준안정 상을 활용한 광전 소자 설계 가능성을 열었습니다.", "novelty": "TR-XRD, TR-XAS, IXS 등 다양한 시간 분해 분광 기법을 조합하여 복잡한 광-구조 결합 동역학을 원자 수준에서 규명했습니다.", "unresolved": "Ag-In 질서도가 광학적 밴드갭에 미치는 정확한 미시적 에너지 스케일과 상온에서의 동역학적 한계는 추가 조사가 필요합니다.", "future_work": "조성 변화(composition engineering)를 통해 준안정 상태의 수명을 더욱 제어하는 연구가 이어질 것입니다.", "concepts": [{"term": "Double Perovskites", "why_emerged": "납의 독성을 피하고 구조적 다양성을 확보하기 위해 A2BB'X6 구조를 채택했습니다.", "origin": "결정학 연구에서 오랫동안 알려져 왔으나 광전 분야에서는 최근 본격적으로 다뤄짐.", "connections": "일반 페로브스카이트의 대체재 및 자성 물질 연구와 연결됩니다."}, {"term": "Self-trapped Excitons (STEs)", "why_emerged": "격자 왜곡에 의해 여기자가 국소화되어 빛을 방출하는 현상을 설명하기 위해 도입되었습니다.", "origin": "이온성 결정의 광학적 연구에서 고전적으로 확립된 개념.", "connections": "강한 전자-포논 결합 시스템의 핵심 특성입니다."}], "english_summary": ["Identified a long-lived metastable phase in Cs2AgInCl6 double perovskites induced by light.", "Attributed the phase transition to photo-induced Ag-In B-site cation disorder.", "Utilized time-resolved X-ray diffraction and absorption spectroscopy to map structural evolution.", "Revealed that hole-localized STE formation facilitates the observed temporally asymmetric transition."]}}, {"title": "Accessing Few-Layer CrI3 Magnetoelasticity Through Bulk Single Crystals", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2607.24222", "authors": "J. Arneth, M. M\\\"oller, D. A. S. Kaib, P. P. Stavropoulos, A. Razpopov, M. Jonak, S. Spachmann, M. Abdel-Hafiez, S. Biswas, K. Riedl, R. Valent\\'i, R. Klingeler", "last_authors": "S. Biswas, K. Riedl, R. Valent\\'i, R. Klingeler", "summary": "The persistence of ferromagnetic long-range order in monolayers of the van der Waals semiconductor CrI$_3$ opens new routes for spintronic applications based on two-dimensional quantum magnets. In the fabrication of such devices, the constituent materials inevitably experience anisotropic strain, which modifies their intrinsic electronic properties. At the same time, strain can serve as a powerful tuning parameter, driving the material to desired regimes. While several theoretical studies have investigated the effect of biaxial in-plane strain on CrI$_3$ numerically, experiments are widely limited to the application of hydrostatic pressure. Here, we perform high-resolution magnetostriction experiments on bulk CrI$_3$ samples, and \\textit{ab-initio}-based magnetoelastic calculations, to elucidate the role of uniaxial lattice strain on the magnetic properties. Our data show that magnetostriction in CrI$_3$ is unexpectedly sensitive to surface effects, which enables us to investigate the influence of in-plane and out-of-plane strain separately, in both the bulk ferromagnetic (BFM) phase emerging at $T_{\\rm C}=61\\,\\mathrm{K}$ and the surface antiferromagnetic (SAFM) phase below $T^* \\simeq 50\\,\\mathrm{K}$. In particular, we quantify the uniaxial strain dependence of the surface interlayer coupling $J^{\\rm SAFM}_{\\perp}$ and the surface spin-flip field $B^*$, which drastically exceed the strain effects in the BFM phase by a factor of $\\sim 30$. The large magnetostrictive response allows us to study the magnetoelastic coupling in few-layer CrI$_3$ through experiments on bulk single crystals, without requiring exfoliation.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "High-quality experimental study on CrI3, a key 2D quantum magnet with direct material relevance.", "tags": ["vanderWaals", "magnetism", "quantummaterials"], "image": "https://arxiv.org/static/browse/0.3.4/images/arxiv-logo-fb.png", "briefing": {"background": "CrI3는 2D 자성 반도체로 스핀트로닉스 응용 가능성이 큽니다. 그러나 박리된 소자는 변형(strain)에 민감하며, 이 변형이 자기적 특성에 미치는 영향을 정확히 이해하는 것이 필수적입니다.", "motivation": "기존 연구는 정수압(hydrostatic pressure)에 국한되어 있어, 실제 소자 환경과 유사한 일축 변형(uniaxial strain)이 자기 물성에 미치는 영향을 규명하고자 했습니다.", "result": "벌크 시료의 자기변형(magnetostriction) 실험을 통해 표면층의 자기적 결합이 벌크보다 변형에 약 30배 더 민감하게 반응함을 발견했습니다.", "implication": "벌크 시료 실험으로 박리된 소자에서의 변형 효과를 예측할 수 있게 되었으며, CrI3의 자기적 상태를 변형으로 정밀 제어할 수 있는 근거를 제공합니다.", "novelty": "기존에 간과되었던 표면 효과(surface effects)를 분리하여 측정함으로써 일축 변형에 대한 자기적 응답을 정량화한 점이 핵심입니다.", "unresolved": "이 실험 결과가 수 층(few-layer) 이하의 극박막에서 발생하는 정교한 자기적 정렬 현상을 완전히 대변하는지는 이론적 추가 검증이 필요합니다.", "future_work": "변형된 격자 구조가 스핀-궤도 결합에 미치는 영향을 계산하고, 이를 기반으로 한 스핀 제어 실험이 기대됩니다.", "concepts": [{"term": "Magnetostriction", "why_emerged": "자기장 하에서 물질의 형상이 변하는 현상을 이해하고 자기적 상호작용을 측정하기 위함입니다.", "origin": "19세기 초 Joule에 의해 발견된 고전적 자기 현상.", "connections": "자기 탄성 결합(magnetoelastic coupling) 연구의 핵심 지표입니다."}, {"term": "Surface Antiferromagnetic (SAFM) phase", "why_emerged": "벌크와는 다른 표면 특성이 2D 자성체에서 두드러지게 나타나기 때문입니다.", "origin": "CrI3 박막 연구에서 층간 결합의 민감성을 통해 실험적으로 정립됨.", "connections": "층간 결합의 경쟁(interlayer coupling)과 밀접하게 연관됩니다."}], "english_summary": ["Investigated the effect of uniaxial strain on CrI3 magnetism using bulk high-resolution magnetostriction.", "Discovered that surface magnetic phases are significantly more sensitive to strain than bulk phases.", "Quantified the strain dependence of interlayer coupling and spin-flip fields.", "Demonstrated that bulk magnetostriction can effectively model strain responses in few-layer van der Waals magnets."]}}, {"title": "Berry curvature effects of chiral superconducting rhombohedral graphene", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2607.23764", "authors": "Jian-Hua Zeng, Zhi Wang, Qian Niu", "last_authors": "Zhi Wang, Qian Niu", "summary": "We study the Berry curvature effects of the Bogoliubov quasiparticles in chiral superconducting rhombohedral graphene. Using a two-band Bogoliubov-de Gennes Hamiltonian to describe the superconducting quasiparticles, we calculate the momentum-space Berry curvature, the orbital magnetic moment, the anomalous thermal-Hall and the anomalous spin- and orbital-Nernst transport of the chiral $p$-wave superconducting states. We investigate the impact of the normal-state energy band warping in rhombohedral graphene, which can cause the Bogoliubov Fermi surface for quasiparticle excitations. We find that the Bogoliubov Fermi surface qualitatively modulates the anomalous Hall transports, inducing a deviation of the thermal Hall conductivity from the quantized value and strongly enhancing the spin- and orbital-Nernst responses.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Relevant topological transport and Berry curvature effects in graphene, which is a broader topic of interest.", "tags": ["Berrycurvature", "graphene", "superconductivity"], "image": "https://arxiv.org/html/2607.23764v1/x1.png", "briefing": {"background": "위상 초전도체와 그래핀 시스템에서의 위상 수송 현상은 베리 곡률과 같은 기하학적 성질이 양자 수송에 미치는 영향을 이해하는 데 핵심적입니다. 특히 다층 그래핀 구조는 밴드 구조를 제어할 수 있는 장점이 있습니다.", "motivation": "카이랄 p-파 초전도성을 띠는 능면체(rhombohedral) 그래핀에서 Bogoliubov 준입자의 베리 곡률이 비정상 열-홀 효과 및 스핀/궤도 네른스트 효과에 어떤 영향을 미치는지 규명하고자 합니다.", "result": "밴드 왜곡으로 형성된 Bogoliubov 페르미 표면이 비정상 열-홀 전도도를 양자화 값에서 벗어나게 하며, 스핀 및 궤도 네른스트 응답을 크게 증폭시킴을 확인했습니다.", "implication": "위상 그래핀 소자에서 준입자의 페르미 표면 공학을 통해 열-전기 수송 응답을 제어하고 최적화할 수 있음을 시사합니다.", "novelty": "복잡한 능면체 그래핀의 밴드 워핑 효과를 초전도 상태와 결합하여 고차원적 수송 응답(스핀/궤도 네른스트)을 이론적으로 예측한 점이 돋보입니다.", "unresolved": "실제 실험에서 이러한 준입자 페르미 표면을 어떻게 안정적으로 측정하고 수송 계수와 직접 연결할지에 대한 구체적인 방법론은 제시되지 않았습니다.", "future_work": "ARPES를 이용한 Bogoliubov 페르미 표면의 직접적인 관측과 실험적인 비정상 열-홀 및 네른스트 측정 연구가 필요합니다.", "concepts": [{"term": "Bogoliubov Fermi surface", "why_emerged": "일반적인 초전도체와 달리 특정 위상 상태에서 준입자 에너지가 0이 되는 영역이 페르미 면처럼 존재할 수 있기 때문입니다.", "origin": "Agterberg 등에 의해 제안됨(초록 정보만으로는 특정하기 어려움).", "connections": "위상 초전도, 비전통적 초전도체, 페르미 표면 토폴로지."}, {"term": "Anomalous Nernst effect", "why_emerged": "자기장 없이도 위상적 성질이나 자성으로 인해 온도 기울기가 전압을 유도하는 현상을 연구하기 위해 필요합니다.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "베리 곡률, 비정상 홀 효과, 스핀트로닉스."}], "english_summary": ["Investigated Berry curvature effects in chiral superconducting rhombohedral graphene.", "Identified that Bogoliubov Fermi surfaces modulate anomalous thermal-Hall conductivity.", "Demonstrated significant enhancement of spin and orbital Nernst responses.", "Theoretical framework bridges band warping effects with topological quasiparticle transport."]}}, {"title": "D-Wave Phonon Angular Momentum Texture in Altermagnets by Magnon-Phonon Hybridization (Phys. Rev. Lett.)", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2511.08357", "authors": "Hannah Bendin, Alexander Mook, Ingrid Mertig, Robin R. Neumann", "last_authors": "Ingrid Mertig, Robin R. Neumann", "summary": "In altermagnets, the magnon bands are anisotropically spin-split in reciprocal space without relativistic or dipolar spin-spin interactions. In this work, we theoretically study magnons and phonons coupled by spin-lattice interaction in a two-dimensional square-lattice d-wave altermagnet. We show that phonon-chirality-selective magnon-phonon hybridization can be caused by interfacial Dzyaloshinskii-Moriya interaction leading to the emergence of hybrid quasiparticles that possess finite phonon angular momentum. These hybrid quasiparticles are called magnon polarons and consist of spin-polarized magnons and chiral phonons. Their phonon angular momentum texture follows the d-wave character of the magnon spin texture opening up the possibility of phononic counterparts to the electronic response effects in altermagnets, such as a phonon angular momentum splitter effect, i.e., the generation of a transverse phonon angular momentum current induced by a temperature gradient -- the bosonic analog of the spin-splitter effect.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Addresses altermagnets, a key interest area with potential for future experimental spectroscopy.", "tags": ["altermagnets", "magnon", "phonon"], "image": "https://arxiv.org/html/2511.08357v3/figures/graphical_abstract.png", "briefing": {"background": "알터자성체(altermagnet)는 최근 자성체 연구의 핵심 화두로, 스핀이 정렬된 상태에서 밴드 구조가 역공간 내에서 이방성 분할을 보이는 새로운 형태의 자성 물질입니다.", "motivation": "알터자성체에서 격자 진동인 포논과 스핀 계인 마그논 사이의 하이브리드 결합이 생성하는 물리적 효과, 특히 각운동량 전달 현상을 이론적으로 규명하고자 합니다.", "result": "DMI(Dzyaloshinskii-Moriya interaction)를 통해 마그논과 포논이 결합된 '마그논 폴라론'이 형성되며, 이것이 자성 텍스처를 따라 각운동량 전류를 발생시킬 수 있음을 보였습니다.", "implication": "전자 수송뿐만 아니라 포논(격자)을 이용한 각운동량 제어, 즉 '포논 스핀트로닉스'의 가능성을 제시합니다.", "novelty": "알터자성체의 d-파 대칭성을 포논 각운동량 텍스처와 연결하여, 전자적 응답의 보손적 아날로그(포논 스핀 분할기)를 제안한 점이 매우 새롭습니다.", "unresolved": "실제 물질 시스템에서 마그논-포논 결합 강도가 어느 정도인지, 실험적으로 해당 각운동량 전류를 어떻게 분리 검출할지는 미지수입니다.", "future_work": "알터자성체에서의 포논 각운동량 전류를 측정하기 위한 비탄성 중성자 산란이나 초고속 분광학적 접근이 필요합니다.", "concepts": [{"term": "Altermagnets", "why_emerged": "강자성이나 반강자성과 구분되는, 밴드 분할이 존재하면서 순자화값은 0인 새로운 자성 상태를 설명하기 위해 제안되었습니다.", "origin": "Jungwirth, Smejkal 등에 의해 이론적으로 확립됨.", "connections": "반강자성, 비정상 홀 효과, 스핀트로닉스."}, {"term": "Magnon-phonon hybridization", "why_emerged": "자성체 내에서 스핀파와 격자파가 독립적이지 않고 상호작용하며 에너지/운동량을 교환하는 과정을 이해하기 위해 도입되었습니다.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "스핀-격자 결합, 마그논 폴라론, 열전 수송."}], "english_summary": ["Theoretical study of magnon-phonon hybridization in 2D d-wave altermagnets.", "Identified phonon-chirality-selective coupling driven by interfacial DMI.", "Predicted emergence of magnon polarons with d-wave phonon angular momentum texture.", "Proposed a bosonic analog of the spin-splitter effect (phonon angular momentum splitter)."]}}, {"title": "Field-tuned incommensurate fan phase in an Ising-like triangular antiferromagnet", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2607.23173", "authors": "D. Flavi\\'an, R. Okuma, P. Manuel, Q. Huang, H. Zhou, R. Coldea", "last_authors": "P. Manuel, Q. Huang, H. Zhou, R. Coldea", "summary": "Using single-crystal neutron diffraction we report the observation of a field-tuned incommensurate phase in a field range just below magnetization saturation in the Ising-like triangular-lattice antiferromagnet Na$_2$BaCo(PO$_4$)$_2$. This phase occurs for magnetic fields applied along the Ising axis and exhibits an in-plane incommensurate propagation vector that moves along the hexagonal Brillouin zone boundary upon varying field, challenging the simple $XXZ$ antiferromagnetic description of the system. Within a semiclassical framework, we successfully identify this pre-saturation phase as a coplanar fan phase and study the role of dipole-dipole interactions and bond-dependent exchange anisotropy in its stabilization mechanism. We additionally present a minimal exchange model including interlayer couplings, which reproduces the complex magnetic phase diagram in field including the observed field-dependence of the incommensurate propagation vector in the fan phase.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Experimental study of complex magnetic phases in triangular lattices using neutron diffraction.", "tags": ["ferromagnet", "antiferromagnet", "material"], "image": "https://arxiv.org/html/2607.23173v1/x1.png", "briefing": {"background": "삼각격자 반강자성체는 기하학적 좌절(frustration)로 인해 복잡한 자기적 질서와 위상적 들뜸이 발생하는 응집물질물리학의 중요한 모델 시스템입니다.", "motivation": "Na2BaCo(PO4)2 물질에서 고자기장 영역에 진입하기 직전 발생하는 비정상적인 자기 상전이 현상의 미시적 메커니즘을 규명하고자 합니다.", "result": "포화 자기장 직전의 위상이 통상적인 XXZ 모델로 설명되지 않는 '팬(fan) 상'임을 밝혀냈으며, 이방성 교환 상호작용이 이를 안정화함을 확인했습니다.", "implication": "삼각격자 자기 시스템에서 다극자 상호작용 및 이방성이 자기 구조 제어에 결정적 역할을 함을 입증했습니다.", "novelty": "단결정 중성자 회절을 통해 팬 상의 전파 벡터 변화를 정밀하게 추적하여 미세한 에너지 항들이 거시적 상도에 미치는 영향을 입증했습니다.", "unresolved": "이론 모델이 실험 데이터를 거의 재현하지만, 상전이 경계면 근처의 양자 요동이나 구체적인 들뜸 스펙트럼의 정밀 측정은 과제로 남아 있습니다.", "future_work": "THz 분광법이나 RIXS를 이용한 팬 상 내의 자기 들뜸 모드(magnon excitation) 정밀 측정 연구가 예상됩니다.", "concepts": [{"term": "Fan phase", "why_emerged": "고자기장 하에서 스핀들의 배열이 단순한 강자성/반강자성 정렬을 넘어 부채꼴 모양으로 열리며 비통약(incommensurate) 구조를 갖는 상태를 설명하기 위해 필요합니다.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "자기 좌절, 반강자성, XXZ 모델."}, {"term": "Incommensurate propagation vector", "why_emerged": "격자의 주기성과 자기 정렬의 주기성이 정수비로 일치하지 않을 때, 자기적 질서의 주기를 기술하기 위해 필요합니다.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "스핀 밀도파, 질서-무질서 전이."}], "english_summary": ["Observed a field-tuned incommensurate fan phase in Na2BaCo(PO4)2.", "Neutron diffraction data challenged the simple XXZ antiferromagnetic model.", "Stabilization mechanism explained by bond-dependent exchange anisotropy and dipole interactions.", "Successfully mapped the complex magnetic phase diagram near magnetization saturation."]}}, {"title": "Magnetic anisotropy in the near-stoichiometric van der Waals ferromagnet Fe3GeTe2", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2607.24543", "authors": "Riju Pal, Joyal John Abraham, Satyabrata Bera, et al.", "last_authors": "Vladislav Kataev, Alexey Alfonsov", "summary": "Quasi-two-dimensional (2D) van der Waals (vdW) ferromagnets such as the series Fe$_{3-x}$GeTe$_2$, with a relatively high Curie temperature and robust metallicity, offer an ideal platform for investigating itinerant magnetism in reduced dimensions. Here, we present a comprehensive electron spin resonance (ESR) investigation of single-crystalline almost-stoichiometric Fe$_{3.03 \\pm 0.03}$GeTe$_{2}$ across wide ranges of frequencies, temperatures, and magnetic fields to gain quantitative insights into its magnetic anisotropy and spin dynamics. Frequency-dependent ESR measurements establish Fe$_{3}$GeTe$_{2}$ as an easy-axis ferromagnet. Temperature-dependent high-field ESR reveals a large internal field that gradually decreases at higher temperatures. Remarkably, this internal field persists even above $T_\\mathrm{C}$, evidencing short-range spin correlations in Fe$_{3}$GeTe$_{2}$. Analysis of spin-wave modes yields a strong uniaxial magnetocrystalline anisotropy $K_{\\text{int}} \\approx - 5 \\times 10^6$ erg cm$^{-3}$ at 3 K and a large magnon gap $\\Delta(3 \\mathrm{K})$ $\\approx$ 87.8 $\\pm$ 13.7 GHz ($\\approx$ 0.363 $\\pm$ 0.057 meV). Our study highlights that small variations in Fe content in Fe$_{3}$GeTe$_{2}$ lead to substantial changes in the magnon gap at low temperatures, indicating the extreme sensitivity of spin dynamics to the chemical composition. These results establish Fe$_{3}$GeTe$_{2}$ as a model vdW ferromagnet for exploring tunable anisotropies and magnon excitations in metallic 2D magnets.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Comprehensive magnetic study of a key van der Waals ferromagnet relevant to 2D magnetism.", "tags": ["material", "2Dmaterials", "ferromagnetism"], "image": "https://arxiv.org/html/2607.24543v1/Fig1.jpg", "briefing": {"background": "Fe3GeTe2(FGT)는 2차원 반데르발스 자성체 중 하나로, 높은 퀴리 온도와 금속성을 가져 자성 소자 연구의 핵심 플랫폼입니다. 차원 축소에 따른 이티너런트 자성(itinerant magnetism)의 특성을 이해하는 것이 중요합니다.", "motivation": "FGT의 화학량론적 조성(near-stoichiometric)에 따른 자기 이방성과 스핀 동역학을 정량적으로 분석하고자 합니다.", "result": "ESR(전자 스핀 공명) 분석을 통해 FGT가 명확한 easy-axis 강자성체임을 확인했습니다. 퀴리 온도 이상에서도 잔류하는 내부 자기장을 관측하여 짧은 범위의 스핀 상관관계(short-range correlation)를 증명했습니다.", "implication": "화학적 조성의 미세한 변화가 magnon gap에 큰 영향을 미치므로, FGT는 스핀 동역학 제어 및 조율이 가능한 모델 시스템으로서의 가치가 큽니다.", "novelty": "STO에 가까운 FGT 시료에 대해 주파수 및 온도 의존적 ESR을 수행하여 정량적 자기 이방성 상수와 magnon gap을 도출했습니다.", "unresolved": "Fe 조성의 미세 변화가 magnon gap을 결정짓는 미시적 메커니즘은 완벽히 밝혀지지 않았습니다.", "future_work": "조성 변화에 따른 스핀 동역학의 변화를 정밀하게 제어하여 2차원 스핀트로닉스 소자에 응용하는 연구가 예상됩니다.", "concepts": [{"term": "Magnon gap", "why_emerged": "자기 이방성으로 인해 스핀파(magnon) 여기를 위해 필요한 최소 에너지.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "Spin-wave theory, magnetic anisotropy"}, {"term": "Easy-axis ferromagnet", "why_emerged": "특정 결정축 방향으로 자기 모멘트가 정렬하려는 에너지가 더 낮은 상태를 기술.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "Magnetic anisotropy, Ising model"}, {"term": "Short-range spin correlations", "why_emerged": "상전이 온도 근처나 그 이상에서 장거리 질서는 없으나 국소적인 스핀 정렬이 존재함을 설명.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "Critical phenomena, Fluctuations"}], "english_summary": ["ESR study of near-stoichiometric Fe3GeTe2 reveals clear easy-axis ferromagnetism.", "Internal magnetic fields persist above Tc, indicating significant short-range spin correlations.", "Strong magnetocrystalline anisotropy and a sizable magnon gap are characterized.", "The magnon gap exhibits extreme sensitivity to Fe content variations.", "FGT is identified as an ideal tunable platform for 2D magnetism and spin dynamics."]}}, {"title": "Signatures of Topological Magnon Edge States in THz Spectroscopy and Cavity Response", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2607.23170", "authors": "Ipsika Mohanty, Johannes Knolle, Silvia Viola Kusminskiy", "last_authors": "Johannes Knolle, Silvia Viola Kusminskiy", "summary": "Topological magnon insulators (TMIs) have emerged as promising platforms for low-energy spin-based information processing, due to their non-trivial bulk magnon topology and robust, chiral edge modes that support dissipationless transport. Although theoretical models predict these edge states, direct experimental detection remains challenging due to their limited sensitivity to conventional probes. In this work, we propose an all-optical pathway to detect topological magnon edge modes in ferromagnetic TMIs. Our approach harnesses parametric amplification of edge magnons via resonant electromagnetic driving, enabled by magnetoelectric coupling mechanisms. We concentrate on two-dimensional van der Waals ferromagnetic materials on the honeycomb lattice with magnonic band gaps in the terahertz (THz) range. We show that a spin-dependent effective electric dipole moment, arising from dynamic charge fluctuations and consistent with the lattice symmetry up to next-nearest-neighbor interactions, gives rise to one-photon-two-magnon processes leading to parametric amplification. On this basis, we propose a THz pump-probe spectroscopy protocol in which edge modes are selectively amplified and subsequently detected in absorption. Furthermore, we discuss the possibility of using THz cavities, enabling selective coupling to edge modes while filtering out bulk contributions. These findings establish a route for probing topological magnets and open new avenues for experimental exploration of exotic topological phenomena in magnetic quantum materials.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Topological magnons in vdW ferromagnets; directly relevant to magnetic topological materials.", "tags": ["vanderWaals", "topological", "ferromagnet", "transport"], "image": "https://arxiv.org/html/2607.23170v1/x1.png", "briefing": {"background": "위상 자성 절연체(Topological Magnon Insulators)는 에지 스핀 모드를 통해 소산 없는(dissipationless) 스핀 수송을 구현할 수 있어 차세대 스핀트로닉스로 주목받고 있습니다.", "motivation": "이론적으로 예측된 위상 에지 모드는 실험적 검출이 매우 어려워, 이를 광학적으로 관측할 수 있는 구체적인 프로토콜을 제안하고자 합니다.", "result": "THz 펌프-프로브 분광법을 사용하여 에지 모드를 선택적으로 증폭하고 검출하는 방법을 제시했습니다. 이를 위해 자기-전기 결합을 이용한 파라메트릭 증폭 방식을 활용했습니다.", "implication": "이 프로토콜이 성공한다면 위상 자성체에서 자성 토폴로지를 검증하는 표준적인 광학 도구가 될 것입니다.", "novelty": "기존의 낮은 감도를 극복하기 위해 THz 캐비티와 펌프-프로브 분광법을 결합하여 벌크 기여를 필터링하고 에지 모드만 선택적으로 탐색하는 전략을 제안했습니다.", "unresolved": "실제 실험에서의 THz 광학 소자 구현 난이도와 재료에 따른 자기-전기 결합 상수의 크기가 변수로 남아 있습니다.", "future_work": "제안된 프로토콜을 실제 van der Waals 벌집 격자 강자성체에서 구현하는 실험적 검증이 필요합니다.", "concepts": [{"term": "Topological Magnon Insulator", "why_emerged": "스핀파가 에지에서 비가역적으로 이동하는 위상적 상태를 기술.", "origin": "Katsura et al. (2010)", "connections": "Topological insulators, Berry curvature"}, {"term": "Parametric amplification", "why_emerged": "입력 신호를 특정 변조를 통해 증폭하여 미약한 신호를 검출 가능하게 함.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "Nonlinear optics, THz spectroscopy"}, {"term": "Magnon edge states", "why_emerged": "위상적으로 자명하지 않은 벌크 상태의 경계에서 나타나는 비자명한 스핀파 모드.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "Edge states, Bulk-boundary correspondence"}], "english_summary": ["Proposes an all-optical detection method for topological magnon edge states.", "Utilizes parametric amplification via THz electromagnetic driving and magnetoelectric coupling.", "Suggests THz pump-probe spectroscopy to selectively amplify edge magnon signals.", "Proposes THz cavities to filter out bulk contributions for enhanced sensitivity.", "Provides a theoretical pathway to explore non-trivial magnon topology in vdW ferromagnets."]}}, {"title": "Single crystal growth, structural and magnetic properties of CeZn2-xGa2+x", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2607.22942", "authors": "Danila Sokratov (Maryland Quantum Materials Center, Department of Physics, University of Maryland, et al.", "last_authors": "Toronto, Ontario)", "summary": "The tetragonal BaAl$_4$ ($I4/mmm$) parent structure underpins a diverse family of materials exhibiting novel phenomena, including nematic superconductivity, topological semimetallicity, and heavy fermion behavior. The recent growth of ternary R-Zn-Ga compounds, such as the previously reported CeZn$_2$Ga$_2$, has explored some of the members exhibiting rare-earth magnetism within this family. In this paper, we report on the structural and magnetic properties of single crystals of CeZn$_{2-x}$Ga$_{2+x}$, a Ga-rich analogue of CeZn$_2$Ga$_2$. Our CeZn$_{2-x}$Ga$_{2+x}$ samples exhibit magnetic properties distinct from the paramagnetic behavior previously reported for CeZn$_2$Ga$_2$. We observe a magnetic transition around 4 K, pronounced metamagnetic states at low temperatures, and strong magnetic anisotropy. Though there are batch-to-batch variations that suggest a strong sensitivity to local structural imperfections, we consistently see the presence of magnetic transitions and metamagnetic states in our crystals. To investigate the local structural sensitivity hypothesis, we performed Reverse Monte Carlo analysis of collected powder neutron diffraction data, revealing the presence of significant local crystallographic disorder of the magnetic Ce site. Our findings demonstrate that the positional disorder drives competing ferromagnetic and antiferromagnetic correlations that lead to the observed spin glass behavior and complex anisotropic magnetism. This study illustrates that tuning the local crystallographic disorder enables engineering frustrated magnetic states in BaAl$_4$-type and similar intermetallic structures.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Relevant to BaAl4-type topological and heavy fermion materials; features structural disorder and magnetism.", "tags": ["topological", "heavyfermion", "ferromagnet", "antiferromagnet"], "image": "https://arxiv.org/html/2607.22942v1/x1.png", "briefing": {"background": "BaAl4형 구조는 위상 반금속, 네마틱 초전도성, 중페르미온 등 다양한 물리 현상을 연구할 수 있는 풍부한 재료군입니다.", "motivation": "기존 보고된 CeZn2Ga2의 상자성 특성과 달리, CeZn2-xGa2+x의 새로운 자기적 거동을 밝히고 구조적 무질서와의 상관관계를 규명하고자 합니다.", "result": "4K 근처에서의 자기 상전이와 메타자성(metamagnetism)을 관측했습니다. 중성자 회절 분석을 통해 Ce 사이트의 구조적 무질서가 강자성-반강자성 경쟁을 유도함을 보였습니다.", "implication": "구조적 무질서(disorder)를 공학적으로 조절함으로써 위상적 위상과 자성을 제어할 em coupled to strain-induced axial potentials, we develop a semiclassical wave-packet theory and identify a dissipative transverse current generated by a dynamical axial potential. This response is qualitatively distinct from both ordinary vector-potential transport in gapped systems and axial responses in gapless Weyl semimetals. Physically, it originates from a mass-induced Berry structure of the reconstructed Weyl bands, which becomes active when the system is driven out of equilibrium by a chiral chemical-potential imbalance. We show that transverse sound waves provide a natural route to generate the required dynamical axial field and estimate the resulting current for realistic material parameters. Our results reveal sound-induced Hall transport as a direct probe of Weyl excitonic order and provide a transport signature of interaction-generated mass in Weyl materials.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Transport theory in Weyl materials with direct experimental signature for excitonic mass.", "tags": ["theory", "Weyl", "transport"], "image": "https://arxiv.org/html/2607.18335v2/WEI_newcartoon1.png", "briefing": {"background": "Weyl semimetals은 위상수학적으로 보호받는 노드(node)를 통해 비정상적인 전송 특성을 나타냅니다. 엑시톤 절연체 상태(Excitonic Insulator)는 전자-정공 결합으로 인해 갭이 생기는데, 일반적인 갭이 있는 시스템과 달리 위상학적 비자명성이 엑시톤 질량에 의해 보존될 수 있습니다.", "motivation": "기존 Weyl 물질 연구가 주로 갭이 없는 위상 상태에 집중되어 있었으나, 이 논문은 질량이 부여된(gapped) Weyl 시스템에서만 나타나는 특이한 축 방향 전송 현상을 규명하고자 합니다.", "result": "변형(strain)에 의해 유도된 축 방향 전위(axial potential)가 Weyl 엑시톤 절연체에서 소산적 횡방향 전류를 생성함을 이론적으로 증명했습니다. 특히 횡방향 음파를 이용한 동역학적 축 필드 유도가 이 현상을 관측할 수 있는 경로임을 제시했습니다.", "implication": "소리(음파)를 이용한 홀 전송이 Weyl 엑시톤 질서의 직접적인 프로브가 될 수 있음을 시사하며, 상호작용으로 생성된 질량의 위상학적 특성을 수송 현상으로 읽어낼 수 있습니다.", "novelty": "외부 전기장 없이도 음파를 통해 Weyl 물질의 위상학적 질서에 접근하는 방법을 제시했다는 점에서 독창적입니다. 이는 ARPES로 직접 보기 힘든 위상학적 질량 보존 상태를 수송 현상으로 연결합니다.", "unresolved": "실제 실험적 구현을 위해 필요한 구체적인 물질 후보군과 음파 유도 전류의 정량적 크기가 특정 물질 환경에서 얼마나 뚜렷하게 관측될지에 대한 최적화가 필요합니다.", "future_work": "실  elementary description. Here we investigate heavy fermion UTe$_2$, which hosts a suite of exotic spin-triplet superconducting phases, the most extreme of which resides in a narrow angular window of intense magnetic fields $>$ 40 T. Through angle-dependent magnetotransport measurements in pulsed magnetic fields, we find that this superconductive phase emerges from a strange metallic state with Planckian $T$-linear resistivity confined to a small region of phase space where the field-induced superconductivity is strongest, suggesting a shared underlying mechanism. These findings reveal a novel setting for strange metallicity - in contrast to the general case of singlet superconductivity emerging on the border of antiferromagnetism, here strange metallicity accompanies field-induced triplet superconductivity within a spin-polarized magnetic state. This result demonstrates the remarkable ubiquity of strange metallicity across diverse materials settings, and highlights UTe$_2$ as a unique platform for exploring the interplay between unconventional superconductivity and quantum criticality.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Important transport study on UTe2 relating strange metallicity to unconventional superconductivity.", "tags": ["heavy-fermion", "superconductivity", "transport"], "image": "https://arxiv.org/html/2505.12131v2/x1.png", "briefing": {"background": "Strange metallicity는 고온 초전도체 등에서 나타나는 저항률의 T-linear 온도 의존성을 의미하며, 이는 전자의 강한 상관관계와 양자 임계 현상의 산물로 알려져 있습니다.", "motivation": "UTe2는 Spin-triplet 초전도체 후보로 유명합니다. 매우 높은 자기장에서 초전도성이 강화되는 현상이 나타나는데, 이것이 Strange metallicity와 어떤 관계인지 규명하고자 했습니다.", "result": "강한 자기장 영역에서 초전도성이 발현되는 UTe2의 위상 공간이 Strange metallicity(Planckian resistivity) 영역과 정확히 겹침을 발견했습니다.", "implication": "Spin-triplet 초전도성과 Strange metallicity가 강력한 상관관계에 있음을 시사하며, 강한 자기장 환경에서 양자 임계점을 이용한 새로운 초전도 메커니즘을 시사합니다.", "novelty": "일반적으로 반강자성 경계에서 나타나는 Singlet 초전도체와 달리, Spin-polarized 상태에서의 Triplet 초전도와 Strange metallicity의 공존을 밝힌 것은 매우
