<!DOCTYPE html>
<html lang='en'>
<head>
<meta charset='UTF-8'>
<meta name='viewport' content='width=device-width, initial-scale=1.0'>
<title>Daily Paper Slideshow</title>
<style>
  :root {
    color-scheme: light;
    --bg: #f6f7f4;
    --paper: #ffffff;
    --ink: #111827;
    --muted: #64748b;
    --line: #d8ddd2;
    --accent: #176b87;
    --accent-2: #9a3412;
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; overflow: auto; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: var(--bg); color: var(--ink); }
  .shell { max-width: 1500px; min-height: 100vh; margin: 0 auto; padding: 14px 18px; display: flex; flex-direction: column; }
  .topbar { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 16px; }
  .top-actions { display: flex; align-items: center; gap: 10px; }
  .topbar a, button { border: 1px solid var(--line); border-radius: 8px; background: var(--paper); color: var(--ink); padding: 10px 14px; font-weight: 700; text-decoration: none; cursor: pointer; }
  button.primary { background: var(--accent); border-color: var(--accent); color: white; }
  button:disabled { opacity: 0.45; cursor: not-allowed; }
  .counter { color: var(--muted); font-weight: 700; }
  .slide { min-height: calc(100vh - 82px); background: var(--paper); border: 1px solid var(--line); border-radius: 10px; padding: 18px; box-shadow: 0 18px 42px rgba(15, 23, 42, 0.10); display: grid; grid-template-columns: minmax(310px, 0.86fr) minmax(0, 1.55fr); gap: 18px; overflow: visible; }
  .paper-head { min-width: 0; min-height: 0; overflow: visible; display: flex; flex-direction: column; gap: 12px; }
  .figure { margin: 0; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: #f8fafc; }
  .figure img { display: block; width: 100%; max-height: 41vh; object-fit: contain; background: white; }
  .figure figcaption { padding: 7px 10px; color: var(--muted); font-size: 12px; line-height: 1.3; }
  .head-text { display: flex; flex-direction: column; gap: 9px; min-width: 0; }
  .badges { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .badge { border-radius: 999px; padding: 5px 9px; background: #eef2ff; color: #3730a3; font-size: 12px; font-weight: 800; }
  .score { background: #fee2e2; color: #991b1b; }
  h1 { margin: 0; font-size: 25px; line-height: 1.15; letter-spacing: 0; overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
  h1 a { color: inherit; text-decoration-color: rgba(23, 107, 135, 0.35); text-decoration-thickness: 2px; text-underline-offset: 4px; }
  h1 a:hover { color: var(--accent); text-decoration-color: var(--accent); }
  .meta, .authors, .why, .abstract { font-size: 13px; line-height: 1.45; }
  .meta, .authors { color: var(--muted); }
  .why strong, .abstract strong, .authors strong { color: var(--ink); }
  .authors { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .why { border-left: 4px solid var(--accent-2); padding-left: 10px; color: #374151; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .abstract { border-top: 1px solid var(--line); padding-top: 14px; color: #374151; }
  .original-abstract { border-top: 1px solid var(--line); padding-top: 10px; color: #374151; font-size: 11.5px; line-height: 1.35; overflow-wrap: anywhere; }
  .original-abstract strong { display: block; margin-bottom: 4px; color: var(--ink); }
  .tags { display: flex; flex-wrap: wrap; gap: 8px; }
  .tag { border-radius: 999px; padding: 4px 8px; background: #f1f5f9; color: #475569; font-size: 12px; font-weight: 700; }
  .head-text > .link { display: none; }
  .briefing { min-width: 0; min-height: 0; overflow: visible; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); grid-auto-rows: minmax(0, auto); align-content: start; gap: 11px 18px; border-top: 0; padding-top: 0; }
  .brief-section { min-width: 0; }
  .brief-section.wide { grid-column: 1 / -1; }
  .brief-section h2 { margin: 0 0 4px; font-size: 14px; line-height: 1.22; color: #0f766e; letter-spacing: 0; }
  .brief-section p, .brief-section li { margin: 0; font-size: 12.5px; line-height: 1.42; color: #1f2937; overflow-wrap: anywhere; }
  .brief-section ul { margin: 0; padding-left: 20px; }
  .concepts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 9px 14px; }
  .concept { border-top: 1px solid var(--line); padding-top: 7px; }
  .concept h3 { margin: 0 0 4px; font-size: 13px; color: #7c2d12; letter-spacing: 0; }
  .concept p { margin: 2px 0 0; font-size: 11.5px; line-height: 1.35; color: #374151; overflow-wrap: anywhere; }
  .concept b { color: #111827; }
  .link { color: var(--accent); font-weight: 800; text-decoration: none; }
  .empty { padding: 48px; background: var(--paper); border: 1px solid var(--line); border-radius: 12px; color: var(--muted); }
  @media (max-width: 860px) {
    .shell { padding: 14px; }
    .topbar, .top-actions { align-items: stretch; flex-direction: column; }
    .slide, .briefing, .concepts { grid-template-columns: 1fr; }
    .slide { min-height: auto; overflow: visible; display: grid; }
    h1 { font-size: 28px; }
  }
</style>

<script>
const slides = [{"title": "Nodeless superconducting gap and electron-boson coupling in (La,Pr,Sm) 3 Ni 2 O 7 films", "journal": "Science", "source": "Gemini", "link": "https://doi.org/10.1126/science.adw8329", "authors": "Jianchang Shen, Guangdi Zhou, Yu Miao, et al.", "last_authors": "Junfeng He, Zhuoyu Chen", "summary": "The discovery of superconductivity in Ruddlesden-Popper bilayer nickelate films under ambient pressure provides an opportunity to directly investigate electronic energy scales of the superconducting state and the pairing mechanism. We report angle-resolved photoemission spectroscopy measurements of superconducting (La,Pr,Sm) 3 Ni 2 O 7 thin films by developing an ultrahigh-vacuum cryogenic sample quenching and transfer technique. A superconducting gap of ~18 milli–electron volts with coherence peaks is observed along the Brillouin zone diagonal. The finite gap persists across the entire Brillouin zone, revealing the absence of gap nodes. A kink is observed in the energy-momentum dispersion at ~70 milli–electron volts below the Fermi level, indicating an electron-boson coupling. The simultaneous observation of a nodeless superconducting gap and electron-boson coupling provides insight into the pairing symmetry and gluing mechanism in Ruddlesden-Popper bilayer nickelates.", "tier": "A_MUST_READ", "score": "10", "reason": "ARPES study of nodeless superconducting gap and electron-boson coupling in nickelate films.", "tags": ["ARPES", "unconventionalsuperconductivity", "nickelates", "electron-bosoncoupling"], "image": "", "briefing": {"background": "Ruddlesden-Popper 구조를 가진 bilayer 니켈레이트(La3Ni2O7)는 최근 높은 압력 하에서 고온 초전도성이 발견되어 제2의 구리 산화물 계열로 큰 기대를 모으고 있는 물질입니다. 하지만 고압 실험의 한계로 인해 이 물질의 전자 구조와 초전도 페어링 대칭성을 결정짓는 갭(gap)의 구조를 직접적으로 관측하는 데 어려움이 있었습니다.", "motivation": "상압에서 초전도성을 나타내는 (La,Pr,Sm)3Ni2O7 박막 시료를 제작하고, 이를 초고진공 상태에서 저온으로 유지하며 ARPES로 측정함으로써, 이 시스템의 초전도 갭의 유무와 전자-보존 결합(kink) 현상을 직접 확인하고자 했습니다.", "result": "ARPES 측정 결과, 브릴루앙 존 대각선 방향을 포함하여 전체 영역에서 노드(node)가 없는 약 18 meV 크기의 초전도 갭이 관찰되었습니다. 또한 페르미 레벨 아래 약 70 meV 지점에서 분산 관계의 킹크(kink)를 발견하여, 전자가 특정 보존(boson)과 강하게 결합하고 있음을 확인했습니다.", "implication": "노드가 없는 갭의 존재는 이 니켈레이트 박막의 페어링 대칭성이 s-wave 형태일 가능성이 높음을 시사합니다. 또한 발견된 킹크 현상은 초전도 페어링을 매개하는 '글루(glue)' 메커니즘을 이해하는 핵심 단서가 될 것입니다.", "novelty": "박막 형태의 니켈레이트에서 ARPES를 통해 초전도 갭과 전자-보존 결합을 동시에 관찰한 최초의 성과 중 하나입니다. 특히 사용자께서 관심 있는 ARPES를 통해 신규 고온 초전도체 후보군의 핵심 정보를 제공했다는 점에서 가치가 높습니다.", "unresolved": "관찰된 70 meV 킹크의 기원이 포논(phonon)인지 스핀 요동(spin fluctuation)인지에 대한 명확한 구분과, 박막의 성질이 벌크 고압 상태의 성질을 얼마나 완벽히 대변하는지에 대한 추가 검증이 필요합니다.", "future_work": "도핑 농도 조절 및 압력 변화에 따른 킹크 에너지 변화를 추적하여 초전도 전이 온도(Tc)와의 상관관계를 규명하는 연구가 이어질 것으로 보입니다.", "concepts": [{"term": "Nodeless superconducting gap", "why_emerged": "초전도체의 페어링 대칭성(s-wave, d-wave 등)을 구분하기 위해 갭이 0이 되는 지점(node)의 유무를 판단하는 것이 필수적입니다.", "origin": "BCS 이론 및 비전통적 초전도체 연구 과정에서 정립되었습니다.", "connections": "s-wave 초전도체(nodeless) vs d-wave 초전도체(nodal, 예: 구리 산화물)"}, {"term": "Electron-boson coupling", "why_emerged": "전자가 격자 진동(포논)이나 스핀 파동과 상호작용하여 초전도 페어링을 형성하는 메커니즘을 설명하기 위해 도입되었습니다.", "origin": "초록 정보만으로는 특정하기 어려움 (전통적으로 Eliashberg 이론 등에 기반함)", "connections": "ARPES의 kink 현상, 초전도 pairing glue"}], "english_summary": ["Observed a nodeless superconducting gap of ~18 meV in bilayer nickelate thin films using ARPES.", "Identified an electron-boson coupling kink at ~70 meV below the Fermi level.", "Suggests s-wave pairing symmetry and provides clues for the pairing mechanism in the Ruddlesden-Popper nickelate family.", "Utilized a specialized ultrahigh-vacuum cryogenic quenching technique for high-quality ARPES measurements."]}}, {"title": "Multiple closely spaced transitions and multi-band Hall response in clean ScV6Sn6", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2606.29048", "authors": "Jonathan M. DeStefano, Elliott Rosenberg, Chaowei Hu, Xiaodong Xu, Jiun-Haw Chu", "last_authors": "Xiaodong Xu, Jiun-Haw Chu", "summary": "arXiv:2606.29048v1 Announce Type: new Abstract: The kagome metal ScV$_6$Sn$_6$ has attracted attention as a platform for exploring the interplay between charge density wave (CDW) order and symmetry-breaking phenomena, including a recently reported intermediate phase and a low-field Hall anomaly that has been attributed to an anomalous Hall effect (AHE). The interpretation of both observations has been limited by the modest sample quality achieved by previous growth procedures, which produced crystals with in-plane residual resistivity ratios (RRR) of at most $\\approx$9. Here, we report a simple modification of the flux growth procedure that yields ScV$_6$Sn$_6$ single crystals with RRR exceeding 50, more than five times the previous highest reported value, and use this expanded mobility range to revisit both the symmetry and the magnetotransport of the CDW phase. We resolve a sequence of closely spaced transitions in the immediate vicinity of $T_{CDW}$ that emerges above a sharp threshold of RRR $\\approx 4$, and demonstrate through elastoresistivity that the intermediate phase breaks the three-fold rotational symmetry of the parent lattice. We examine the Hall response from both the parent samples across the full RRR range as well as Cr-doped samples, and conclude it is quantitatively inconsistent with an intrinsic AHE and is instead explained by ordinary multi-band transport involving small, high-mobility pockets identified through quantum oscillations. These results refine the symmetry-breaking landscape of ScV$_6$Sn$_6$ and establish systematic mobility tuning as a diagnostic for disentangling an intrinsic AHE from multi-band Hall contributions in kagome CDW systems.", "tier": "A_MUST_READ", "score": "10", "reason": "Direct experimental study on kagome metal ScV6Sn6, CDW, nematicity, and magnetotransport.", "tags": ["kagome", "CDW", "nematicity", "anomalousHall", "magnetotransport", "quantumoscillations", "experiment"], "image": "https://arxiv.org/html/2606.29048v1/x1.png", "briefing": {"background": "Kagome 금속 ScV6Sn6는 전하 밀도 파(CDW)와 다양한 물리적 대칭성 붕괴 현상이 나타나 주목받고 있습니다. 그러나 기존 연구들은 샘플의 낮은 잔류 저항비(RRR)로 인해 물질 본연의 특성과 불순물 효과를 명확히 구분하지 못하는 한계가 있었습니다.", "motivation": "샘플 품질(RRR)을 획기적으로 개선하여 ScV6Sn6에서 보고된 중간 단계(intermediate phase)의 실체와 비정상 홀 효과(AHE)처럼 보이는 신호의 진짜 기원을 밝히고자 했습니다.", "result": "RRR이 50 이상인 고순도 샘플에서 CDW 전이 근처의 다단계 상전이를 새로 발견했으며, 탄성 저항(elastoresistivity) 측정을 통해 중간 단계에서 3회전 대칭성이 깨지는 네마틱성(nematicity)을 확인했습니다. 또한, 기존에 AHE로 해석되던 홀 저항 신호는 실제로는 고이동도 멀티밴드 수송에 의한 효과임을 입증했습니다.", "implication": "Kagome 시스템에서 관찰되는 비정상적인 전송 특성이 반드시 위상학적인 기원(Berry curvature 등)이 아닐 수 있음을 경고하며, 샘플의 순도와 멀티밴드 특성에 대한 엄밀한 분석이 필요함을 시사합니다.", "novelty": "기존 대비 5배 이상 높은 순도의 샘플을 활용해 시스템의 상도표를 정밀화했습니다. 사용자 관심사인 Kagome 금속의 CDW, 네마틱성, AHE 논란을 한꺼번에 다루고 있어 필독 가치가 높습니다.", "unresolved": "멀티밴드 효과를 제외하고도 남을 수 있는 미세한 위상학적 기여분이 존재하는지, 그리고 네마틱 상전이의 미시적 질서 파라미터가 무엇인지에 대한 질문이 남습니다.", "future_work": "고순도 샘플에서의 양자 진동(Quantum Oscillations) 분석을 통한 페르미 표면의 정밀한 재구성 및 ARPES를 이용한 밴드별 이동도 측정.", "concepts": [{"term": "Residual Resistivity Ratio (RRR)", "why_emerged": "금속 샘플의 결정성과 순도를 정량적으로 평가하기 위해 실온 저항과 극저온 저항의 비를 측정합니다.", "origin": "금속 물리 초기 연구에서 표준 지표로 정립됨", "connections": "Mean free path, impurity scattering, quantum oscillations visibility"}, {"term": "Nematicity", "why_emerged": "결정 격자의 회전 대칭성이 전자계의 상호작용에 의해 자발적으로 붕괴되는 현상을 설명하기 위해 도입되었습니다.", "origin": "액정(liquid crystals) 개념에서 유래하여 강상관 전자계로 확장됨", "connections": "Iron-based superconductors, AV3Sb5 kagome metals, elastoresistivity"}], "english_summary": ["Achieved high-purity ScV6Sn6 crystals (RRR > 50) to resolve intrinsic CDW properties.", "Discovered closely spaced transitions near T_CDW and confirmed rotational symmetry breaking (nematicity).", "Reinterpreted the previously reported anomalous Hall effect as an artifact of multi-band transport with high-mobility pockets.", "Establishes mobility tuning as a critical diagnostic for interpreting transport anomalies in kagome metals."]}}, {"title": "Orbital current signature using neutron diffraction", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2602.17311", "authors": "Dalila Bounoua, William Li\\`ege, Yvan Sidis, Philippe Bourges", "last_authors": "Yvan Sidis, Philippe Bourges", "summary": "arXiv:2602.17311v2 Announce Type: replace Abstract: We review the hallmarks of orbital loop currents in various correlated electron materials and how they have been evidenced using polarized neutron diffraction. Over the last 20 years, loop current signatures have been observed in high temperature copper oxide superconductors, iridates, copper oxides spin ladders and recently kagome vanadate superconductors. Such currents induce orbital magnetic moments within the unit cell of these quantum materials that can be detected through their interaction with the neutron spin. In addition to the usual description of orbital moments using point-like local magnetic moments, we here show an alternative description of the neutron magnetic cross-section involving the microscopic currents running between different atomic orbitals. We discuss the corresponding magnetic structure factors and the resulting quantitative differences between both approaches.", "tier": "A_MUST_READ", "score": "10", "reason": "Review of orbital loop current signatures in kagome vanadates using polarized neutron diffraction.", "tags": ["review", "loopcurrent", "kagome", "TRSB", "neutronscattering", "superconductivity", "correlatedelectrons"], "image": "https://arxiv.org/html/2602.17311v2/Diagrammes_de_phase.jpg", "briefing": {"background": "강상관 전자계 물질에서 시간 반전 대칭성을 깨뜨리는 궤도 루프 전류(orbital loop current)는 위상학적 특성과 비전통적 초전도성을 이해하는 중요한 가설입니다. 특히 최근 Kagome Vanadate(AV3Sb5) 계열에서 이 전류의 존재 여부가 뜨거운 쟁점이 되었습니다.", "motivation": "지난 20년간 구리 산화물, 이리듐 산화물, 그리고 최근의 Kagome 금속에서 관찰된 루프 전류의 중성자 회절 신호를 종합적으로 리뷰하고, 이를 해석하는 이론적 모델(자기 모멘트 vs 미시 전류) 간의 차이를 분석하기 위함입니다.", "result": "편극 중성자 회절(polarized neutron diffraction)이 루프 전류에 의한 미세한 자기 모멘트를 검출하는 강력한 도구임을 확인하고, Kagome vanadate 등에서 나타나는 TRSB 신호가 루프 전류 모델로 어떻게 설명될 수 있는지 정리했습니다.", "implication": "중성자 산란 실험 데이터를 해석할 때 단순한 점 자기 모멘트 근사 대신 원자 궤도 간 흐르는 미시적 전류 분포를 고려해야 더 정확한 구조 인자(structure factor) 계산이 가능함을 보여줍니다.", "novelty": "사용자의 주요 관심사인 Kagome 금속의 루프 전류 및 TRSB 이슈를 중성자 산란이라는 보완적 관점에서 체계적으로 정리한 리뷰 논문입니다.", "unresolved": "루프 전류가 유도하는 자기 신호가 워낙 미약하여 실험적 배경 신호나 다른 자기 질서와의 완벽한 분리가 여전히 도전 과제로 남아 있습니다.", "future_work": "더 높은 해상도의 편극 중성자 산란 장비와 정밀한 단결정 샘플을 이용해 Kagome 시스템의 루프 전류를 확정 짓는 추가 실험이 예상됩니다.", "concepts": [{"term": "Orbital loop current", "why_emerged": "원자 내 자성이 아닌, 원자 간 전자 흐름이 만드는 미시적 전류 루프가 물질의 자기적 성질을 결정할 수 있다는 이론적 제안에서 시작되었습니다.", "origin": "Varma 등에 의해 구리 산화물 초전도체 모델로 제안됨", "connections": "Time-reversal symmetry breaking (TRSB), Varma phase, Kagome metals"}, {"term": "Polarized neutron diffraction", "why_emerged": "매우 약한 자기 신호를 핵 산란 신호와 분리하여 정밀하게 측정하기 위해 중성자의 스핀 상태를 제어하는 기술이 필요했습니다.", "origin": "Shull, Moon 등에 의해 중성자 산란 초기에 개발됨", "connections": "Magnetic structure factor, spin-flip scattering, orbital magnetism"}], "english_summary": ["Reviews experimental signatures of orbital loop currents in cuprates, iridates, and kagome vanadates using polarized neutron diffraction.", "Compares the conventional point-like magnetic moment model with a microscopic current distribution approach.", "Highlights how orbital currents induce magnetic moments detectable via neutron-spin interactions.", "Provides a quantitative framework for interpreting magnetic structure factors in time-reversal symmetry-breaking states."]}}, {"title": "What Does the Single-Particle Spectrum Imply on the Pairing Nature and Pairing Mechanism in La3Ni2O7?", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2606.29470", "authors": "Yu-Bo Liu, Zhi-Yan Shao, Zhiming Pan, Chen Lu, Fan Yang", "last_authors": "Chen Lu, Fan Yang", "summary": "arXiv:2606.29470v1 Announce Type: new Abstract: The pairing mechanism of the bilayer nickelates La$_3$Ni$_2$O$_7$ remains a hotly-debated open question. Existing strong-coupling theories are divided into class favoring intralayer d-wave pairing and that favoring interlayer s-wave pairing, with the latter further divided into $d_{z^2}$ orbital dominated mechanism driven by orbital hybridization and $d_{x^2-y^2}$ orbital dominated mechanism driven by Hund's rule. Recent angle-resolved-photoemission-spectrum (ARPES) and scanning-tunneling-microscope (STM) combinedly reveal a nodeless full pairing gap with low anisotropy, supporting the s-wave pairing. Here we propose that the pairing gap along the Brillouin zone (BZ) diagonal can serve as a useful probe of pairing mechanism. Symmetry analysis suggests that orbital hybridization vanishes along the BZ diagonal, rendering that the pairing gaps on the $\\gamma$- and $\\alpha/\\beta$- pockets reflect the $d_{z^2}$- and $d_{x^2-y^2}$- orbital pairing strength respectively. Under the $d_{z^2}$ orbital dominated pairing mechanism driven by orbital hybridization, gap nodes are inevitable on the $\\alpha$- and $\\beta$- pockets along the BZ diagonal, which conflicts with the full gap revealed by ARPES and the U-shaped dI/dV curve observed by STM. The Hund's rule driven pairing mechanism instead leads to a full pairing gap, which well fits the ARPES and STM results. Furthermore, through a random-phase-approximation based calculation, we show that the weak-coupling theory, which tends to yield a $d_{z^2}$-orbital dominated pairing, also leads to nodes or near-nodes on the $\\alpha$- and $\\beta$- pockets along the BZ diagonal, conflicting with experiments. This analysis clarifies the dominant role of $d_{x^2-y^2}$ orbital in the pairing and establishes the Hund's rule driven pairing mechanism as the most relevant one in La$_3$Ni$_2$O$_7$.", "tier": "A_MUST_READ", "score": "10", "reason": "Direct hit: theoretical analysis of pairing in nickelate La3Ni2O7, explicitly referencing ARPES/STM experiments.", "tags": ["theory", "ARPES", "STM/STS", "nickelates", "superconductivity", "pairingmechanism", "electronicstructure"], "image": "https://arxiv.org/html/2606.29470v1/x1.png", "briefing": {"background": "La3Ni2O7은 이중층 니켈산염 초전도체로, 최근 고압 하에서 관찰된 80K급 초전도 현상으로 인해 고온 초전도 메커니즘을 밝히기 위한 핵심 물질로 주목받고 있습니다.", "motivation": "기존의 강결합 이론들은 궤도 혼성(orbital hybridization)에 의한 d(z^2) 우세 메커니즘과 훈트 규칙(Hund's rule)에 의한 d(x^2-y^2) 우세 메커니즘으로 나뉘어 대립해 왔습니다.", "result": "ARPES와 STM 데이터를 분석한 결과, 브릴루앙 존 대각선 방향에서 d(z^2) 모델이 예측하는 노드(node)가 관찰되지 않음을 확인했습니다. 따라서 훈트 규칙에 의한 d(x^2-y^2) 궤도가 주도하는 s-wave 페어링 메커니즘이 가장 타당함을 논증했습니다.", "implication": "이 모델이 정설로 자리 잡는다면, 이중층 니켈산염에서의 초전도성은 구리 산화물(cuprates)과는 다른 물리적 기원을 가짐을 시사하며 향후 초전도체 설계에 큰 이정표가 됩니다.", "novelty": "ARPES의 밴드 구조와 STM의 dI/dV 분광 정보를 대칭성 분석과 결합하여 초전도 페어링의 궤도 성분을 식별해 냈다는 점이 연구자의 관심사와 직결됩니다.", "unresolved": "이 분석은 단일 입자 스펙트럼의 특성에 의존하며, 실제 초전도 전이 과정에서의 미세한 상호작용 및 고압 환경에서 발생하는 구조적 변형과의 상관관계는 추가 연구가 필요합니다.", "future_work": "제안된 훈트 규칙 주도 모델을 검증하기 위한 더 정밀한 스핀 분해 ARPES 실험이나, 고압 환경에서의 위상학적 변화 연구가 이어질 것입니다.", "concepts": [{"term": "d(z^2) vs d(x^2-y^2)", "why_emerged": "니켈산염의 전자 구조에서 어떤 궤도가 페어링의 핵심인지 밝히기 위해 필요합니다.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "cuprates의 d(x^2-y^2) 궤도와 비교 연구 진행 중."}, {"term": "s-wave pairing", "why_emerged": "초전도 간극의 대칭성을 구분하여 메커니즘을 규명하기 위해 필요합니다.", "origin": "BCS 이론(Bardeen, Cooper, Schrieffer, 1957)", "connections": "고온 초전도체의 d-wave와 대비되는 일반적인 페어링 상태."}], "english_summary": ["The paper investigates the pairing mechanism in bilayer La3Ni2O7 nickelates.", "ARPES and STM show a full, nodeless gap conflicting with d(z^2) orbital hybridization models.", "The study identifies the d(x^2-y^2) orbital driven by Hund's rule as the dominant mechanism.", "This provides a consistent explanation for both spectroscopic and thermodynamic findings."]}}, {"title": "Erratum: Long-lived coherence between incoherent excitons revealed by time-resolved angle-resolved photoemission spectroscopy: An exact solution [Phys. Rev. B 111, 235124 (2025)]", "journal": "PRB_Recent", "source": "keyword", "link": "http://link.aps.org/doi/10.1103/lsxs-hqns", "authors": "Zhenlin Zhang, Wei Hu, Enrico Perfetto, "Gemini", "link": "http://link.aps.org/doi/10.1103/nyy3-h8wr", "authors": "Xu Yang, Xingkai Cheng, Zhuo Deng, et al.", "last_authors": "Junwei Liu, Zhao-Hua Cheng", "summary": "Author(s): Xu Yang, Xingkai Cheng, Zhuo Deng, Yu-Han Gao, Qing-Lin Yang, Zheng Chang, Peng-Tao Yang, Hong-Mei Feng, Xiang-Qun Zhang, Wei He, Junwei Liu, and Zhao-Hua Cheng Recently identified altermagnets exhibit a distinctive dual-space nature: they possess spin-split electronic bands akin to ferromagnets in momentum space while maintaining the fully compensated magnetization of antiferromagnets in real space. This inherent duality, originating from the same crystal … [Phys. Rev. Lett. 136, 256702] Published Wed Jun 24, 2026", "tier": "A_MUST_READ", "score": "9", "reason": "Experimental magneto-optical study of spin-split bands in the prototypical altermagnet MnTe.", "tags": ["experiment", "altermagnet", "MnTe", "spectroscopy"], "image": "", "briefing": {"background": "알터마그넷(Altermagnet)은 기존의 강자성체와 반강자성체의 특성을 동시에 갖는 물질군입니다. 실공간에서는 자화가 상쇄되어 반강자성적이나, 운동량 공간에서는 자성 원소의 대칭성으로 인해 스핀 분할(spin-split)된 밴드 구조를 보여 차세대 스핀트로닉스 재료로 주목받고 있습니다.", "motivation": "알터마그넷의 핵심인 '운동량 공간에서의 스핀 분할'을 광학적 방법으로 직접 검증하고, 그 전자 구조적 특성을 규명하기 위해 MnTe를 모델 시스템으로 연구했습니다.", "result": "초고속 자기-광학 측정(Ultrafast Magneto-Optical)을 통해 MnTe에서 알터마그넷 특성에 기인한 스핀 분할 밴드 구조와 관련된 지표를 관측했습니다.", "implication": "알터마그넷의 전자 구조가 광학적 신호를 통해 직접적으로 탐지될 수 있음을 증명하였으며, 이는 향후 비침습적이고 빠른 스핀 제어 기술 개발의 토대가 됩니다.", "novelty": "반강자성체와 강자성체의 장점을 모두 가진 알터마그넷의 물리적 실체를 실험적으로 확증했다는 점이 핵심입니다. 특히 스핀트로닉스 응용 가능성을 광학적 방법으로 입증했다는 점이 중요합니다.", "unresolved": "초고속 영역에서의 동역학적 변화가 전자 구조의 어떤 상세 성분에 기인하는지, 그리고 다양한 온도 조건에서의 안정적인 제어 가능성에 대한 추가 연구가 필요합니다.", "future_work": "다른 후보 물질로의 확장 연구 및 광학적 펄스를 이용한 실시간 스핀 상태 조절(Optical switching) 연구가 뒤따를 것으로 예상됩니다.", "concepts": [{"term": "Altermagnetism", "why_emerged": "강자성체의 스핀 분할 특성과 반강자성체의 안정적인 자기적 특성을 동시에 활용하기 위해 제안됨.", "origin": "최근 2~3년 내 이론적으로 정립되어 실험적 입증이 활발히 진행 중임.", "connections": "반강자성체, 스핀트로닉스, 비상반적 수송 현상."}, {"term": "Magneto-optical fingerprints", "why_emerged": "자기적 질서가 있는 물질의 전자 구조를 빛과의 상호작용을 통해 비파괴적으로 식별하기 위해 필요함.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "패러데이 효과, 커 효과, 분광학."}], "english_summary": ["Altermagnetism is identified by its dual nature of vanishing net magnetization and spin-split bands.", "This study employs ultrafast magneto-optical spectroscopy on MnTe to map these spin-split electronic states.", "The results provide direct optical evidence for the unique momentum-space band structure of altermagnets.", "This work validates the potential for optical control in future spintronic devices."]}}, {"title": "Direct observation of interfacial exchange coupling in a magnetic tunnel junction through spin-polarized quasiparticle interference (Nano Lett.)", "journal": "arXiv_CondMat", "source": "author whitelist", "link": "https://arxiv.org/abs/2606.28686", "authors": "Xu Wang, Chenxi Wang, Ying Yang, et al.", "last_authors": "Donglai Feng, Tong Zhang", "summary": "arXiv:2606.28686v1 Announce Type: new Abstract: Interfacial exchange coupling plays a critical role in enabling novel phenomena in magnetic heterostructures, such as spin triplet superconductivity, quantum anomalous Hall effect (QAHE), and advanced spintronic functionalities. While microscopic characterization of this coupling is essential for elucidating the underlying mechanism, it remains technically challenging. Here, using spin-polarized scanning tunneling microscopy (SP-STM) and quasiparticle interference, we directly observed interfacial exchange coupling in a magnetic tunnel junction formed by an Fe coated tip and a Cr(001) surface. We found the ferromagnetic tip induces significant energy shift (up to 10 meV) in the spin-polarized surface state of Cr(001). This shift is highly sensitive to the tip-surface distance and the spin-alignment between Fe tip and Cr surface, which can be switched by external magnetic field. Our results demonstrate that extended 2D surface states can mediate strong exchange coupling nd Sb-terminated surfaces of CsV3Sb5 probed by scanning photoemission spectromicroscopy (Phys. Rev. B)", "journal": "arXiv_CondMat", "source": "keyword", "link": "https://arxiv.org/abs/2606.29749", "authors": "T. Mizokawa, G. Tomassucci, M. Hattori, et al.", "last_authors": "J. -X. Yin, N. L. Saini", "summary": "arXiv:2606.29749v1 Announce Type: new Abstract: Electronic structures of Cs- and Sb-terminated surfaces of a kagome superconductor CsV$_3$Sb$_5$ have been elucidated by means of scanning photoemission microscopy (SPEM). The observed band structure of the Cs-terminated surface is rather close to that of the bulk while that of the Sb-terminated one is substantially modified around K/H point of the Brillouin zone. While the contrast between the Cs- and Sb-terminated regions is reduced below the charge density wave transition temperature, the Sb 5$p$ band of Cs-terminated region exhibits electronic inhomogeneity which slightly increases below it. The inhomogeneity of the Sb 5$p$ band would be related to disorders of the out-of-plane Sb and relevant for the band folding along $\\Gamma$-A with the charge density wave. The SPEM results suggest that the less inhomogeneous Cs termination is more suitable for interface of kagome superconductors. However, the inhomogeneity of Cs termination, which is significant at $\\Gamma$/A, noticeable at K/H, and negligible at M/L, is expected to affect the Sb 5$p$-V 3$d$ hybridization at the interface.", "tier": "A_MUST_READ", "score": "9", "reason": "title strong match: photoemission", "tags": ["photoemission", "kagome", "chargedensitywave", "superconduct", "bandstructure"], "image": "https://arxiv.org/html/2606.29749v1/x1.png", "briefing": {"background": "가고메 금속 CsV3Sb5는 전하 밀도 파(CDW), 위상 성질, 초전도 현상이 공존하는 물질로, 표면 종단(Termination)에 따라 전자 구조가 달라지는 특성이 보고되어 왔습니다.", "motivation": "표면 종단(Cs- vs Sb-terminated)에 따라 달라지는 전자 구조를 스캐닝 광전자 분광 현미경(SPEM)으로 비교 분석하여 벌크와의 차이를 규명하고자 했습니다.", "result": "Cs-표면은 벌크 상태와 유사하나, Sb-표면은 K/H 지점에서 밴드 구조가 상당히 igh-precision scanning tunneling microscopy (STM) at a base temperature of 30mK. We detect 2x2 pair density modulations by Josephson STM with a superconducting tip and 2x2 pairing gap modulations by normal STM. We find that the pairing modulations in both cases are substantially suppressed upon doping the kagome lattice with dilute isovalent nonmagnetic impurities, whereas the charge order and uniform superconductivity remain robust. We further identify the correlation between atomic dopants and the local suppression of PDW. We attribute these findings to a nonmagnetic pair-breaking effect, arising from the phase modulation of PDW in the kagome d-orbital. Taken together with its signatures in other state-of-the-art spectroscopy and transport measurements linked by theory, our findings support the ground state of the kagome superconductor as a correlated topological phase with superconducting loop currents.", "tier": "A_MUST_READ", "score": "9", "reason": "title strong match: kagome superconductor", "tags": ["STM", "scanningtunneling", "kagome", "loopcurrent", "superconduct", "correlated", "topological", "transport"], "image": "https://arxiv.org/static/browse/0.3.4/images/arxiv-logo-fb.png", "briefing": {"background": "가고메 격자 물질(AV3Sb5)은 전하 밀도 파동(CDW)과 초전도성, 위상적 특성이 공존하는 흥미로운 연구 대상입니다. 여기서 페어 밀도 파동(PDW)은 초전도 질서 변수가 공간적으로 변조되는 상태를 의미하며, 이는 강상관 전자계에서 초전도 메커니즘을 규명하는 핵심 키입니다.", "motivation": "가고메 초전도체에서 PDW의 존재를 입증하고, 이것이 비자성 불순물에 의해 어떻게 제어되는지를 통해 초전도 상태의 본질(루프 전류 모델 등)을 확인하고자 했습니다.", "result": "조셉슨 STM과 일반 STM을 사용하여 2x2 페어 밀도 및 갭 변조를 관측했습니다. 특히, 등가 비자성 불순물 도핑 시 CDW와 일반 초전도성은 유지되면서 PDW 신호만 선택적으로 억제됨을 밝혀내어, PDW의 페어 깨짐 효과를 증명했습니다.", "implication": "이 결과는 해당 가고메 초전도체의 바닥 상태가 초전도 루프 전류를 포함하는 강상관 위상적 상태임을 강력하게 지지하며, PDW가 비자성 산란에 민감하다는 이론적 예측과 일치합니다.", "novelty": "실제 가고메 결정에서 고분해능 STM을 통해 PDW의 위상 민감성을 직접 증명했다는 점이 매우 중요하며, 독자의 주요 관심사인 AV3Sb5 계열의 초전도 본질을 루프 전류 관점에서 해석했습니다.", "unresolved": "불순물 도핑과 PDW 억제 사이의 정량적 상관관계에 대한 이론적 정밀도가 더 필요하며, 이 PDW가 전체 샘플의 벌크 특성인지 국부적 현상인지에 대한 추가 연구가 e from distinct magnetic orders. In the candidate d-wave altermagnet KV2Se2O, the magnetic origin of the observed momentum-dependent spin splitting has remained controversial. Here, we employ spin-polarized scanning tunnelling microscopy combined with magnetic-field-dependent quasiparticle interference imaging to determine the magnetic configuration of KV2Se2O at the atomic scale. Spin-resolved quasiparticle interference reveals a checkerboard-like antiparallel spin texture within the V2O layer and determines its interlayer spin arrangement across unit-cell step edges. Remarkably, we identify both C-type and G-type magnetic configurations, both of which generate similar spin-split electronic structures at the single-layer level but correspond to d-wave altermagnetic and conventional antiferromagnetic orders, respectively. These observations reveal a complex magnetic landscape arising from nearly degenerate magnetic states. Our results establish a direct connection between momentum-space spin splitting and real-space magnetic order, providing a framework for identifying the microscopic origin of spin-split electronic structures in altermagnetic materials.", "tier": "A_MUST_READ", "score": "9", "reason": "Experimental SP-STM study identifying magnetic configurations and spin-split electronic structures in a candidate altermagnet.", "tags": ["altermagnetism", "STM/STS", "electronicstructure", "experiment", "magnetism"], "image": "https://arxiv.org/static/browse/0.3.4/images/arxiv-logo-fb.png", "briefing": {"background": "알터자성(Altermagnetism)은 순자화가 없음에도 불구하고 스핀 분리된 밴드 구조를 보이는 새로운 자기 상태입니다. 이 현상의 기원을 이해하려면 실제 결정 구조 내의 자기 배치(Magnetic configuration)를 원자 단위에서 확인해야 합니다.", "motivation": "KV2Se2O 화합물에서 관찰되는 스핀 분리 현상이 과연 d-파 알터자성에 기인하는지, 혹은 단순한 반강자성인지 모호했기 때문에 이를 실공간에서 규명하고자 했습니다.", "result": "스핀 편극 STM과 QPI 측정을 통해 V2O 층 내의 반평행 스핀 배열을 확인했습니다. 놀랍게도 시료에서 d-파 알터자성(C-type)과 단순 반강자성(G-type)이 공존할 수 있으며, 이들이 모두 비슷한 스핀 분리 밴드 구조를 유도함을 발견했습니다.", "implication": "운동량 공간의 측정 결과(ARPES 등)만으로는  "summary": "Author(s): Fabian Eickhoff, Jian-Xin Zhu, and Benedikt Fauseweh Moiré superlattices (MSLs) in van der Waals heterostructures have demonstrated their incredible power in driving emergent electronic phenomena, some of which are reminiscent of those usually only observed in bulk strongly correlated quantum materials. With the recent discovery of van der Waals $f$-e… [Phys. Rev. B 113, 235153] Published Fri Jun 26, 2026", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Highly relevant to moiré physics and correlated heavy-fermion systems.", "tags": ["moiré", "Kondo", "heavyfermion"], "image": "", "briefing": {"background": "모아레 초격자(Moiré superlattices)는 강상관 관계 전자계 연구를 위한 인공 격자 플랫폼입니다. 특히 무거운 페르미온 시스템(heavy-fermion)이 모아레 구조에서 재현되면서 콘도 효과(Kondo effect)와 양자 임계 현상이 새로운 주목을 받고 있습니다.", "motivation": "최근 발견된 f-전자 기반 모아레 시스템에서 나타나는 평탄 밴드(flat-band)가 콘도 파괴 및 재진입 현상에 미치는 영향을 이론적으로 규명하고자 합니다.", "result": "평탄 밴드가 형성하는 강한 국소화 현상이 콘도 스크리닝을 억제하여 콘도 파괴(Kondo breakdown)를 유도하고, 이 과정에서 발생하는 독특한 재진입 현상을 설명하였습니다.", "implication": "양자 임계점 근처에서의 위상학적 상전이나 초전도성 발현 기전 이해에 중요한 물리적 토대를 마련합니다.", "novelty": "모아레 시스템 내의 평탄 밴드와 강상관 전자계의 고전적 문제인 콘도 파괴를 결합하여, 모아레 물리 연구의 지평을 넓혔습니다.", "unresolved": "재진입 현상이 실험적으로 얼마나 명확하게 관측될 수 있는지, 실제 소재에서의 무질서(disorder) 효과가 이를 어떻게 방해할지는 불분명합니다.", "future_work": "이 이론 모델을 검증하기 위한 저온 STS 실험 및 상태 밀도 변화를 추적하는 ARPES 측정.", "concepts": [{"term": "콘도 파괴", "why_emerged": "국소 스핀과 전도 전자 사이의 콘도 스크리닝이 양자 임계점 근처에서 붕괴되는 현상을 기술하기 위해 필요함.", "origin": "Si et al. (2001, Nature)", "connections": "Kondo 격자 모델, 중성 페르미온"}, {"term": "평탄 밴드", "why_emerged": "운동 에너지가 억제됨으로써 상호작용 에너지가 지배적이 되어 상관관계 물리(모트 절연체 등)를 관찰하기 최적임.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "Landau 준위, 트위스트 그래핀"}], "english_summary": ["Theoretical investigation of Kondo breakdown in heavy-fermion moiré superlattices.", "Analyzes how flat-band formation drives the suppression of Kondo screening.", "Predicts reentrant effects in the phase diagram of correlated moiré systems.", "Deepens the understanding of quantum criticality in van der Waals f-electron materials."]}}, {"title": "Gap structure and phase diagram of twisted bilayer cuprates from a microscopic perspective", "journal": "PRB_Recent", "source": "Gemini", "link": "http://link.aps.org/doi/10.1103/85jn-qp4t", "authors": "Siddhant Panda, Andreas Kreisel, Laura Fanfarillo, P. J. Hirschfeld", "last_authors": "Laura Fanfarillo, P. J. Hirschfeld", "summary": "Author(s): Siddhant Panda, Andreas Kreisel, Laura Fanfarillo, and P. J. Hirschfeld Twisted cuprate Josephson junctions have been proposed as candidate platforms for superconducting states that break time-reversal symmetry. However, experiments report conflicting signatures. Here, the authors show that this variability can arise from microscopic parameters: the systematic exploration of the phase diagram reveals that twist angle θ, filling, and interlayer tunneling strength stabilize distinct competing superconducting states. The results clarify how differences between devices can determine whether time-reversal symmetry breaking appears. [Phys. Rev. B 113, 224523] Published Tue Jun 23, 2026", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Theoretical analysis of TRSB in unconventional superconducting systems.", "tags": ["superconductivity", "twisted", "cuprates"], "image": "", "briefing": {"background": "뒤틀린(twisted) 반도체 헤테로구조에서 발견된 초전도 현상이 구리 산화물(cuprate) 고온 초전도체에서도 재현될 수 있는지, 특히 시간-반전 대칭성 깨짐(TRSB)이 조셉슨 접합에서 어떻게 구현되는지가 중요한 연구 주제입니다.", "motivation": "뒤틀린 구리 산화물 조셉슨 접합 실험에서 보고되는 TRSB 징후의 불일치를 미시적인 물리 매개변수의 변화로 설명하고자 합니다.", "result": "비틀림 각도(twist angle), 전하 충진(filling), 층간 터널링 강도가 서로 다른 초전도 상태를 안정화하며, 실험마다 보고되는 결과가 다를 수 있음을 이론적으로 규명했습니다.", "implication": "뒤틀린 접합 시스템에서 관찰되는 물리적 특성이 고유한 물성인지 아니면 실험적 조건에 민감한 결과인지 판단하는 지표가 될 것입니다.", "novelty": "기존의 모아레 초전도체 연구를 구리 산화물이라는 강상관계 시스템으로 확장하여, TRSB 상태의 경쟁적 위상 도표를 미시적 모델로 분석한 점이 독창적입니다.", "unresolved": "실험 데이터의 불일치를 완전히 해결하기 위해 실제 소자의 나노 수준 제작 오차를 모델에 완벽히 반영하지 못했다는 한계가 있습니다.", "future_work": "특정 매개변수 영역에  regime overlaps with that of chemically doped infinite-layer nickelates, demonstrating underlying commonalities as well as differences across varying structural realizations of square-planar nickelates. Our work establishes this layered template for creating new nickel-based superconductors.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Highly relevant material class (nickelates) and unconventional superconductivity; mentions electronic structure anisotropy.", "tags": ["material", "nickelate", "superconductivity", "electronicstructure"], "image": "", "briefing": {"background": "니켈산염은 구리산염(cuprates)과 유사한 구조를 가져 고온 초전도체의 새로운 후보로 주목받고 있으나, 무한층(infinite-layer) 구조 외의 다층 구조에 대한 연구는 매우 초기 단계입니다.", "motivation": "무한층 니켈산염을 넘어 다층(n=4~8) 사각형 평면 니켈산염의 위상 도표를 작성하고, 층 두께에 따른 초전도 특성 변화를 구리산염과 비교하고자 합니다.", "result": "층수가 n=4~8인 다층 니켈산염에서 초전도성을 확인했으며, 층수가 줄어들수록 4f 전자 효과로 인해 비등방성이 변하고 구리산염과 유사한 전자 구조를 보임을 밝혀냈습니다.", "implication": "다층 니켈산염이라는 새로운 플랫폼을 통해 고온 초전도 현상의 보편성을 탐구할 수 있는 길이 열렸습니다.", "novelty": "다층 구조를 설계하여 초전도성 제어가 가능함을 보였으며, 특히 구리산염과의 구조적·전자적 유사성을 확인하여 고온 초전도 이론의 새로운 데이터를 제공합니다.", "unresolved": "다층 니켈산염에서 초전도 임계 온도(Tc)를 높이는 구체적인 최적화 파라미터(도핑 수준, 층 수)와 자기 요동의 정량적 기여도가 명확하지 않습니다.", "future_work": "다양한 희토류 원소를 활용한 화학적 도핑 최적화 및 고자기장 하에서의 수송 현상 연구.", "concepts": [{"term": "Infinite-layer nickelates", "why_emerged": "구리산염과 전자적 구조가 유사한 nickel 기반 초전도체를 찾기 위해 고안된 구조입니다.", "origin": "해럴드 황(Harold Hwang) 그룹(2019).", "connections": "Cuprate 초전도체, 페로브스카이트 구조."}, {"term": "Square-planar coordination", "why_emerged": "니켈의 d-궤도와 산소 p-궤도 간의 혼성화를 구리산염과 유사하게 만들기 위한 구조적 조건입니다.", "origin": "초록 정보만으로는 특정하기 어려움.", "connections": "전자 구조, 궤도 의존적 상관관계."}], "english_summary": ["Constructs a superconducting phase diagram for multilayer Nd(n+1)Ni(n)O(2n+2) nickelates.", "Demonstrates superconductivity in n=4 to 8 multilayer structures.", "Highlights structural and electronic similarities to cuprate superconductors.", "Establishes a template for designing new nickel-based high-Tc superconductors."]}}, {"title": "Realization of room-temperature magnetism and multistep magnetization switching in 2D metallic ferrimagnets", "journal": "Science_Advances", "source": "Gemini", "link": "https://doi.org/10.1126/sciadv.aee0391", "authors": "Zijing Zhao, Nanshu Liu, Qinghua Zhang, et al.", "last_authors": "Xiaolei Wang, Yanglong Hou", "summary": "Achieving multistep magnetization switching in two-dimensional (2D) ferrimagnets demonstrates substantial promise for advancing high-density non-Boolean logic and memory devices. However, existing 2D ferrimagnets are still hampered by low Curie temperatures and a lack of tunable multiple magnetic states. Here, we report the successful synthesis of a family of 2D Fe 0.875 S (1− x ) Se x alloy with robust room-temperature ferrimagnetism. The key magnetic and electrical properties can be effectively regulated by tailoring the chalcogen ratio in Fe 0.875 S (1− x ) Se x alloy. Notably, multiple magnetic states and resistance plateaus are observed because of the spin canting behavior, enabling the realization of several distinct spin states by adjusting magnetic fields and temperatures, thereby demonstrating great potential for multistate applications. Density functional theory calculations further reveal that the evolution of magnetic anisotropy originates from variations in the orbital occupation of electronic states near the Fermi level. Our work can expand the library of 2D metallic ferrimagnets and pave the way for designing high-density spintronic devices.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Experimental study of 2D metallic ferrimagnets with room-temperature magnetism and electronic structure insights.", "tags": ["2Dmaterials", "magnetism", "ferrimagnetism", "spintronics", "DFT"], "image": "", "briefing": {"background": "2차원 물질에서 스핀트로닉스 소자를 구현하려면 실온에서 작동하는 강자성체 혹은 페리자성체가 필수적입니다. 그러나 기존 물질들은 큐리 온도가 낮거나 자기적 상태 조절이 어렵다는 한계가 있었습니다.", "motivation": "Fe-S-Se 합금 시스템에서 칼코겐 비율을 조절하여 실온 페리자성 특성을 확보하고, 이를 통해 다단계 자기 상태 전환이 가능한 2차원 금속 페리자성체를 개발하고자 했습니다.", "result": "Fe0.875S(1-x)Sex 합금에서 실온 페리자성 및 스핀 캔팅에 따른 다단계 저항 상태를 관찰했습니다. DFT 계산을 통해 페르미 준위 근처의 궤도 점유 변화가 자기 이방성을 결정함을 확인했습니다.", "implication": "다양한 자기 상태를 갖는 2차원 페리자성체는 고밀도 비불리언(Non-Boolean) 로직 및 메모리 소자 설계의 새로운 플랫폼이 될 수 있습니다.", "novelty": "실온 작동성이라는 실용적 가치와 함께, 칼코겐 조절을 통한 밴드 구조 및 자기 이방성 엔지니어링 가능성을 제시하여 spintronics 연구자들에게 중요한 후보 물질 라이브러리를 제공합니다.", "unresolved": "실제 소자 구동 시 발생하는 계면에서의 스핀 전송 효율이나, 합금 내 원자 분포의 무작위성이 자기적 특성에 미치는 정밀한 상관관계는 추가 연구가 필요합니다.", "future_work": "Fe-S-Se 박막의 도메인 월 제어 기술 개발과 실제 스핀트로닉스 소자 환경에서의 신뢰성 테스트가 예상됩니다.", "concepts": [{"term": "Ferrimagnetism", "why_emerged": "서로 다른 부격자의 자기 모멘트가 상쇄되지 않고 정렬되어 강자성과 유사한 자성을 나타내는 현상이 필요했기 때문입니다.", "origin": "Louis Néel (1948년)", "connections": "반강자성(Antiferromagnetism), 자기 이방성(Magnetic Anisotropy)"}, {"term": "Spin Canting", "why_emerged": "반강자성 정렬에서 스핀이 완벽하게 평행하지 않고 약간 기울어져 순 자기 모멘트를 유발하는 구조를 설명하기 위해 등장했습니다.", "origin": "I. Dzyaloshinsky 및 T. Moriya (1950년대 후반)", "connections": "Dzyaloshinskii-Moriya 상호작용, 자기 구조 변조"}], "english_summary": ["Synthesized a 2D metallic Fe0.875S(1-x)Sex ferrimagnet with room-temperature stability.", "Demonstrated multistep magnetization switching controlled by chalcogen ratio.", "DFT calculations link orbital occupation near the Fermi level to magnetic anisotropy.", "Provides a platform for high-density, multistate spintronic device applications."]}}, {"title": "Interaction-induced nematic Dirac semimetal from quadratic band touching: A constrained-path quantum Monte Carlo study (SciPost Phys.)", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2507.15668", "authors": "Zi Hong Liu, Hongyu Lu, Zi Yang Meng, Lukas Janssen", "last_authors": "Zi Yang Meng, Lukas Janssen", "summary": "arXiv:2507.15668v2 Announce Type: replace Abstract: Electronic systems with quadratic band touchings, commonly found in two- and three-dimensional materials such as Bernal-stacked bilayer graphene, kagome metals, HgTe, and pyrochlore iridates, have attracted significant interest concerning the role of interactions in shaping their electronic properties. However, even in the simplest model of spinless fermions on a two-dimensional checkerboard lattice, the quantum phase diagram as a function of nearest-neighbor interaction remains under debate. We employ constrained-path quantum Monte Carlo simulations (CP-QMC) simulations to investigate the problem using a two-dimensional torus geometry. We cross-validate our results on small lattices by comparing them with density-matrix renormalization group calculations, finding quantitative agreement. In particular, we implement an improved optimization scheme within the CP-QMC simulations, enabling the identification of a bond-nematic Dirac semimetal phase that was found in tensor-network studies on cylindrical geometries, but remains inaccessible to Hartree-Fock mean-field methods. The CP-QMC approach makes it possible to establish the emergence of this phase in a geometry that preserves lattice rotational symmetry and permits extrapolation to the thermodynamic limit. Our results show that the quantum phase diagram of spinless fermions on the checkerboard lattice with nearest-neighbor repulsion features three interaction-induced phases at half filling: a quantum anomalous Hall insulator at weak coupling, a bond-nematic Dirac semimetal at intermediate coupling, and a site-nematic insulator at strong coupling.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Directly addresses nematicity in Dirac systems, relevant to kagome and graphene electronic structure.", "tags": ["theory", "nematicity", "diracsemimetal", "kagome"], "image": "https://arxiv.org/html/2507.15668v2/x1.png", "briefing": {"background": "이차원 또는 삼차원 물질에서 밴드가 이차 곡선(Quadratic band touching)으로 만나는 지점은 강한 전자 상관관계에 의해 독특한 위상학적 혹은 자발적 대칭성 깨짐 상이 나타나기 쉽습니다.", "motivation": "카고메 금속 및 그래핀 계열에서 상호작용에 의해 유도되는 '네마틱 위상(Nematic phase)'의 존재 여부와 그 위상도를 비섭동론적 수치 방법으로 명확히 규명하고자 했습니다.", "result": "상호작용이 있는 체크보드 격자 모델에서 QMC 시뮬레이션을 통해 약한 결합에서는 QAH 절연체, 중간 결합에서는 결합-네마틱 디락 반금속, 강한 결합에서는 사이트-네마틱 절연체로의 상전이를 확인했습니다.", "implication": "평균장 이론으로는 접근이 어려웠던 네마틱 디락 반금속 상을 엄밀한 수치 계산으로 입증하였으며, 이는 카고메 금속 내 자발적 대칭성 깨짐 연구의 이론적 토대가 됩니다.", "novelty": "격자 회전 대칭성을 보존하는 CP-QMC 방법을 사용하여, 기존 텐서 네트워크 방법론에서 제기된 네마틱 상을 검증하고 위상도 전반을 확장했습니다.", "unresolved": "이 모델이 실제 물질(예: AV3Sb5)의 복잡한 밴드 구조에서 나타나는 네마틱성과 정량적으로 어느 정도 일치하는지에 대한 미시적 모델링이 숙제로 남아 있습니다.", "future_work": "실제 카고메 물질의 복잡한 밴드 구조를 포함한 모델에 대한 확장 연구 및 관련 전이 온도 예측이 기대됩니다.", "concepts": [{"term": "Quadratic Band Touching", "why_emerged": "선형적인 디락 점과 달리 밴드가 이차 곡선 형태로 접하는 점은 DOS가 0이 아니어 상호작용에 매우 민감하기 때문입니다.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "디락 반금속(Dirac Semimetal), 반데르발스 물질의 밴드 엔지니어링"}, {"term": "Nematicity", "why_emerged": "회전 대칭성이 자발적으로 깨지지만 병진 대칭성은 유지되는 전자적 정렬 상태를 기술하기 위해 도입되었습니다.", "origin": "Pomeranchuk (1958년)", "connections": "전자 네마틱상(Electronic Nematic Phase), 카고메 금속의 CDW/TRSB"}], "english_summary": ["Investigated interaction-induced phases in checkerboard lattices with quadratic band touching.", "Used constrained-path quantum Monte Carlo to map the phase diagram.", "Identified a bond-nematic Dirac semimetal phase between QAH and site-nematic insulator phases.", "Validates the emergence of nematicity in Dirac systems, relevant to kagome and bilayer graphene."]}}, {"title": "Phonon-driven Floquet-Bloch states probed by quantum beat spectroscopy", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2606.30065", "authors": "Yu-Chan Tai, Chih-Wei Luo, Noriaki Takagi, Hiroshi Ishida, Chun-Liang Lin, Ryuichi Arafune", "last_authors": "Chun-Liang Lin, Ryuichi Arafune", "summary": "arXiv:2606.30065v1 Announce Type: new Abstract: Controlling material excitations offers access to novel fundamental and technological properties. The paradigm of Floquet engineering, the manipulation of the electronic structure using a coherent and time-periodic driving source, has attracted significant attention. While most realizations rely on strong optical fields, coherent phonons provide an alternative route to realizing Floquet-Bloch states, and are expected to enable substantially longer-lived Floquet-Bloch states. We show that laser-excited coherent phonons drive Floquet-Bloch states. Using time-resolved multiphoton photoemission combined with quantum beat spectroscopy on graphene-covered Ir(111), we track the coherent electronic dynamics of the image-potential states dressed by coherent phonons. The beat signal indicates the presence of sideband structure with the coherent-phonon frequency as its fundamental period, consistent with Floquet theory. Furthermore, an independent oscillation in intensity at the same frequency was observed, confirming excitation of the coherent phonon mode. Compared with conventional light-driven Floquet-Bloch states, the observed phonon-driven Floquet-Bloch states persist for one to two orders of magnitude longer. These results establish a time-domain route to identifying phonon-driven Floquet-Bloch states and reveal their formation on ultrafast timescales.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Experimental photoemission study of phonon-driven Floquet-Bloch states in graphene.", "tags": ["experiment", "photoemission", "graphene", "Floquet", "bandstructure"], "image": "https://arxiv.org/html/2606.30065v1/x1.png", "briefing": {"background": "Floquet 공학은 외부 빛을 이용해 물질의 밴드 구조를 변조하는 기술이지만, 빛에 의한 밴드 구조 변조는 매우 짧은 수명을 가집니다.", "motivation": "빠르고 일시적인 빛 대신 상대적으로 긴 수명을 가진 '결맞은 포논(Coherent phonon)'을 이용해 Floquet-Bloch 상태를 유도하고 그 동역학을 관측하고자 했습니다.", "result": "그래핀/Ir(111) 시스템에서 결맞은 포논이 전자 상태의 Floquet-Bloch 측대역(Sideband)을 형성함을 확인했습니다. 이는 기존 광학적 Floquet 상태보다 1-2차수 긴 수명을 가집니다.", "implication": "포논을 이용한 Floquet 제어는 훨씬 안정적이고 긴 시간 동안 밴드 구조를 조작할 수 있는 새로운 가능성을 제시합니다.", "novelty": "시간 분해 광전자 분광법(TR-ARPES)을 넘어 양자 비트 분광법을 통해 포논에 의해 유도된 밴드 변화를 실시간으로 추적한 것이 기술적 성취입니다.", "unresolved": "다양한 포논 모드가 공존하는 복잡한 물질에서 특정 포논 모드만을 골라 제어할 수 있는 선택적 Floquet 엔지니어링 가능성이 남아 있습니다.", "future_work": "다양한 2차원 물질로의 확대 적용 및 포논 유도 Floquet 상태를 이용한 위상 물질의 상태 제어 실험이 예상됩니다.", "concepts": [{"term": "Floquet-Bloch States", "why_emerged": "시간 주기적인 외부 구동을 통해 평형 상태에는 없는 새로운 전자 밴드 구조를 만들기 위해 도입되었습니다.", "origin": "Floquet (1883년 수학 이론), 최근 응집물질물리 응용은 2010년대 이후 활발", "connections": "시간 결정(Time Crystal), 광학적 Floquet 절연체"}, {"term": "Quantum Beat Spectroscopy", "why_emerged": "두 개 이상의 에너지 상태가 중첩될 때 발생하는 간섭 현상을 통해 여기된 상태의 역학을 정밀하게 측정하기 위함입니다.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "분자 분광학, 초고속 동역학(Ultrafast dynamics)"}], "english_summary": ["Realized long-lived Floquet-Bloch states in graphene using coherent phonons.", "Detected these states via quantum beat spectroscopy in time-resolved photoemission.", "Observed sideband structures consistent with Floquet theory, lasting 10-100 times longer than light-driven states.", "Establishes phonon-driven Floquet engineering as a robust alternative to optical methods."]}}, {"title": "Rolling Two-Dimensional Collinear Magnets into Chiral Nanotubes with p-Wave Magnetism", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2606.30214", "authors": "Zhejunyu Jin, Robin R. Neumann, Rodrigo Jaeschke-Ubiergo, Jairo Sinova, Alexander Mook", "last_authors": "Jairo Sinova, Alexander Mook", "summary": "arXiv:2606.30214v1 Announce Type: new Abstract: $p$-wave magnets are noncollinear compensated magnetic systems that exhibit nonrelativistic antisymmetric spin splitting in momentum space. Their odd-parity spin symmetry enables unconventional spintronic functionalities, including highly efficient charge-to-spin conversion via the Edelstein effect. An outstanding question is whether such magnetic phases can emerge from simple and broadly accessible magnetic building blocks rather than from intrinsically noncollinear magnetic orders. Here, we show that rolling two-dimensional collinear magnets -- ferromagnets, antiferromagnets, and altermagnets -- into nanotubes generates a rich spin-symmetry landscape controlled by curvature, chirality, and magnetic order. Remarkably, chiral nanotubes hosting radial or tangential coplanar spin textures generically realize $p$-wave magnetism irrespective of the underlying collinear parent phase. The emergent odd-parity spin symmetry manifests itself in both electronic and magnonic spectra through antisymmetric $p$-wave spin splitting. Our results establish magnetic nanotubes as a versatile platform for engineering unconventional $p$-wave magnetism and predict a nonrelativistic Edelstein response that exceeds conventional spin-orbit-driven charge-to-spin conversion by more than an order of magnitude.", "tier": "B_IMPORTANT_CONDMAT", "score": "8", "reason": "Theoretical proposal for p-wave magnetism and enhanced spintronics in chiral nanotubes from altermagnets.", "tags": ["theory", "altermagnetism", "2Dmaterials", "spintronics", "magnetism"], "image": "https://arxiv.org/html/2606.30214v1/graphical_abstract_bright.png", "briefing": {"background": "스핀트로닉스 분야에서는 효율적인 전하-스핀 변환을 위해 강한 스핀-궤도 결합이나 특정 대칭성이 파괴된 물질을 탐구합니다. p-파(p-wave) 자성체는 운동량 공간에서 비대칭적인 스핀 분할을 나타내어 고효율 스핀트로닉스 소자 구현을 위한 후보로 주목받고 있습니다.", "motivation": "본 연구는 본질적으로 비공선형(noncollinear) 자성체가 아닌, 단순한 2차원 공선형 자성체를 나노튜브로 변형하는 것만으로도 어떻게 p-파 자성체 특성을 발현시킬 수 있는지 탐구하고자 했습니다.", "result": "2차원 강자성체, 반강자성체, 알터자성체를 나노튜브로 말면 곡률과 카이랄성에 의해 방사형 또는 접선 방향의 스핀 질감이 형성되며, 이들이 원재료의 자기적 상태와 무관하게 보편적으로 p-파 자성 특성을 보임을 증명했습니다.", "implication": "자기 나노튜브가 복잡한 비공선형 물질을 합성하지 않고도 강력한 p-파 자성 특성을 제어할 수 있는 새로운 범용 플랫폼이 될 수 있음을 시사합니다.", "novelty": "기존의 알터자성체나 비공선형 자성체 연구와 달리, 구조적 기하학(곡률, 카이랄성)을 활용한 위상/자기적 엔지니어링을 제안했다는 점에서 독창적입니다. 특히 알터자성체 연구 흐름과 맞닿아 있어 스핀트로닉스 응용 가능성을 높였습니다.", "unresolved": "실제 실험적으로 나노튜브의 자기적 스핀 질감을 나노미터 스케일에서 정밀하게 측정하고 검증하는 방법론은 여전히 도전 과제입니다.", "future_work": "실제 실험 그룹에서의 나노튜브 합성 및 저온 스핀 수송 측정, 그리고 이 구조에서의 거대 Edelstein 효과에 대한 구체적인 수치 계산 및 실험적 확인이 필요합니다.", "concepts": [{"term": "p-파 자성체", "why_emerged": "비대칭적 스핀 분할을 통해 스핀-궤도 결합 없이도 효율적인 전하-스핀 변환을 달성하기 위해 필요합니다.", "origin": "초록 정보만으로는 특정하기 어려움", "connections": "알터자성체(Altermagnetism), Edelstein 효과"}, {"term": "알터자성체 (Altermagnetism)", "why_emerged": "강자성체와 반강자성체의 장점을 결합하여 스핀 분할과 보상된 자기 모멘트를 동시에 구현하기 위해 제안되었습니다.", "origin": "J. Železný 등(2022) 등 최근 연구 그룹에 의해 정립됨", "connections": "공선형 반강자성체, 스핀-궤도 결합"}, {"term": "Edelstein 효과", "why_emerged": "전류를 스핀 편극으로 변환하는 물리적 기전의 이해를 위해 필요합니다.", "origin": "V. M. Edelstein (1990)", "connections": "Rashba 효과, 스핀 홀 효과"}], "english_summary": ["The paper investigates the generation of p-wave magnetism in rolled 2D collinear magnetic nanotubes.", "Curvature and chirality induce radial or tangential spin textures that exhibit odd-parity spin symmetry.", "The emergent p-wave magnetism leads to a nonrelativistic Edelstein response exceeding conventional spin-orbit torque systems.", "This mechanism allows for engineering unconventional magnetism from simple, broadly accessible building blocks."]}}, {"title": "Symmetry-Selective Strain Control of Spin-Momentum Locking and Spin Transport in Two-Dimensional Pentagonal Altermagnets", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2606.27896", "authors": "ShuaiYu Wang, Sheng Chen, Xiao-Ping Li, Lei Wang", "last_authors": "Xiao-Ping Li, Lei Wang", "summary": "arXiv:2606.27896v1 Announce Type: new Abstract: Altermagnets are compensated magnets featuring momentum-dependent nonrelativistic spin splitting generated by nontrivial operations connecting opposite-spin sublattices. A direct symmetry-based route to control this spin splitting is to modify the real-space operations that define the altermagnetic spin-momentum locking (SML). Here, we develop a strain-resolved symmetry framework for two-dimensional pentagonal altermagnets, classifying whether uniaxial and shear strain tensors preserve, reconstruct, or eliminate the SML. Using the above criterion combined with first-principles screening, we identify 94 stable altermagnetic candidates from 3330 materials. These candidates cover all type-III spin Laue g unable Polariton Canalization in Natural van der Waals Oxide", "journal": "arXiv_CondMat", "source": "Gemini", "link": "https://arxiv.org/abs/2604.12174", "authors": "H. Shiravi, W. Zheng, D. A. Rhodes, L. Balicas, H. D. Zhou, G. X. Ni", "last_authors": "D. A. Rhodes, L. Balicas, H. D. Zhou, G. X. Ni", "summary": "arXiv:2604.12174v2 Announce Type: replace-cross Abstract: Hyperbolic phonon polaritons (HPPs) are coupled oscillations of anisotropic lattice vibrations and electromagnetic fields that confine the latter to the nanoscale, enabling novel nano-polaritonic devices. While HPPs have been identified in multiple layered materials, achieving advanced control and manipulation - particularly polariton canalization for unidirectional energy flow - often necessitates complex device fabrications or crystal modifications. Here we visualize and elucidate the properties of in-plane hyperbolicity in alpha-V2O5, a layered compound with a highly anisotropic permittivity tensor. We show unidirectional Poynting-vector propagation of polaritons in alpha-V2O5 without additional treatments. Combined with theoretical modeling, our infrared nano-imaging studies unveil a novel form of polariton canalization, with its dispersion contour continuously tunable by the incident light frequency. Additionally, we provide a theoretically calculated permittivity phase diagram for tailoring polaritonic wavefronts. These findings suggest that the metal-oxide alpha-V2O5 holds great promise for on-demand light canalization and control at the nanoscale.", "tier": "C_MAYBE", "score": "7", "reason": "Experimental study of polaritons in a van der Waals oxide, relevant to 2D materials.; tier capped to C: formal/generic theory watch", "tags": ["experiment", "vanderWaals", "phonons", "opticalspectroscopy"], "image": "https://arxiv.org/static/browse/0.3.4/images/arxiv-logo-fb.png", "briefing": {"background": "자동 브리핑을 생성하지 못했습니다. 초록과 원문 링크를 기준으로 빠르게 확인하세요.", "motivation": "초록 정보만으로는 분야 내부의 구체적 동기를 안정적으로 요
